    <style id="theme-vars">
:root {
  /* ── Brand Colors ── */
  --color-primary: #D81B60;
  --color-primary-light: #F06292;
  --color-primary-dark: #AD1457;
  --color-primary-bg: #FCE4EC;
  --color-primary-bg-soft: #FFF0F5;

  --color-secondary: #1976D2;
  --color-secondary-light: #64B5F6;
  --color-secondary-dark: #0D47A1;
  --color-secondary-bg: #E3F2FD;
  --color-secondary-bg-soft: #F0F7FF;

  --color-accent-purple: #8B5CF6;
  --color-accent-cyan: #06B6D4;
  --color-accent-teal: #14B8A6;
  --color-accent-orange: #F97316;

  /* ── Neutral Scale ── */
  --color-bg: #FAFAFA;
  --color-bg-elevated: #FFFFFF;
  --color-bg-sunken: #F3F4F6;
  --color-surface: #FFFFFF;
  --color-surface-dim: #F9FAFB;

  --color-border: #E5E7EB;
  --color-border-light: #F3F4F6;
  --color-divider: #F0F0F0;

  --color-text-primary: #111827;
  --color-text-secondary: #6B7280;
  --color-text-tertiary: #9CA3AF;
  --color-text-inverse: #FFFFFF;
  --color-text-link: #1976D2;

  /* ── State Colors ── */
  --state-success: #10B981;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* ── Radius Scale ── */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* ── Typography System ── */
  --font-sans: 'Inter', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, -apple-system, sans-serif;

  --text-xs: 10px;
  --text-xs-lh: 14px;
  --text-sm: 12px;
  --text-sm-lh: 18px;
  --text-base: 14px;
  --text-base-lh: 22px;
  --text-lg: 16px;
  --text-lg-lh: 24px;
  --text-xl: 20px;
  --text-xl-lh: 28px;
  --text-2xl: 24px;
  --text-2xl-lh: 32px;
  --text-3xl: 30px;
  --text-3xl-lh: 38px;

  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  /* ── Spacing ── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  /* ── Shadow ── */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.03);
  --shadow-md: 0 2px 8px 0 rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 4px 16px 0 rgba(0, 0, 0, 0.05);
  --shadow-float: 0 8px 24px 0 rgba(0, 0, 0, 0.08);
}

/* Dark mode */
.dark {
  --color-bg: #111827;
  --color-bg-elevated: #1F2937;
  --color-bg-sunken: #0F172A;
  --color-surface: #1F2937;
  --color-surface-dim: #374151;

  --color-border: #374151;
  --color-border-light: #1F2937;
  --color-divider: #374151;

  --color-text-primary: #F9FAFB;
  --color-text-secondary: #9CA3AF;
  --color-text-tertiary: #6B7280;
  --color-text-inverse: #111827;
  --color-text-link: #64B5F6;

  --color-primary-bg: #4A1128;
  --color-primary-bg-soft: #3B0F20;
  --color-secondary-bg: #0C2D5E;
  --color-secondary-bg-soft: #0A244D;

  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.2);
  --shadow-md: 0 2px 8px 0 rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 4px 16px 0 rgba(0, 0, 0, 0.35);
  --shadow-float: 0 8px 24px 0 rgba(0, 0, 0, 0.5);
}

  }

<body class="min-h-screen font-sans antialiased">
    <style>
      /* ── App Shell ── */
      .app-shell {
        max-width: 430px;
        margin: 0 auto;
        min-height: 100vh;
        background-color: var(--color-bg);
        font-family: var(--font-sans);
        position: relative;
      }

      .app-frame {
        padding-bottom: 140px;
        min-height: 100vh;
      }

      /* ── App Bar ── */
      .app-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--space-3) var(--space-4);
        padding-top: calc(var(--space-3) + env(safe-area-inset-top, 0px));
        position: sticky;
        top: 0;
        z-index: 100;
        background-color: var(--color-surface);
      }

      .app-bar-left {
        display: flex;
        align-items: center;
        gap: var(--space-2);
      }

      .app-bar-back {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--radius-full);
        border: none;
        background: transparent;
        cursor: pointer;
        color: var(--color-text-primary);
        transition: background-color 0.2s ease;
      }

      .app-bar-back:hover {
        background-color: var(--color-bg-sunken);
      }

      .app-bar-back svg {
        width: 22px;
        height: 22px;
      }

      .app-bar-title {
        font-size: var(--text-lg);
        font-weight: var(--font-weight-bold);
        color: var(--color-text-primary);
      }

      .app-bar-right {
        display: flex;
        align-items: center;
        gap: var(--space-1);
      }

      .app-bar-action {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--radius-full);
        border: none;
        background: transparent;
        cursor: pointer;
        color: var(--color-text-secondary);
        transition: background-color 0.2s ease;
      }

      .app-bar-action:hover {
        background-color: var(--color-bg-sunken);
      }

      .app-bar-action svg {
        width: 20px;
        height: 20px;
      }

      /* ── Hero Card ── */
      .hero-card {
        position: relative;
        margin: var(--space-4);
        border-radius: var(--radius-xl);
        overflow: hidden;
        box-shadow: var(--shadow-lg);
      }

      .hero-card-gradient {
        background: linear-gradient(135deg, #D81B60 0%, #AD1457 30%, #8B5CF6 60%, #1976D2 100%);
        padding: var(--space-8) var(--space-5) var(--space-6);
        position: relative;
      }

      .hero-card-gradient::before {
        content: '';
        position: absolute;
        top: -30px;
        right: -30px;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
      }

      .hero-card-gradient::after {
        content: '';
        position: absolute;
        bottom: -20px;
        left: 30px;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
      }

      .hero-card-name {
        font-size: var(--text-2xl);
        font-weight: var(--font-weight-bold);
        color: var(--color-text-inverse);
        position: relative;
        z-index: 2;
        margin-bottom: var(--space-3);
      }

      .hero-card-breadcrumb {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: var(--space-1);
        position: relative;
        z-index: 2;
        margin-bottom: var(--space-4);
      }

      .breadcrumb-item {
        font-size: var(--text-sm);
        color: rgba(255, 255, 255, 0.9);
        font-weight: var(--font-weight-regular);
      }

      .breadcrumb-separator {
        display: flex;
        align-items: center;
        color: rgba(255, 255, 255, 0.5);
      }

      .breadcrumb-separator svg {
        width: 14px;
        height: 14px;
      }

      .hero-card-date {
        font-size: var(--text-xs);
        color: rgba(255, 255, 255, 0.6);
        position: relative;
        z-index: 2;
      }

      /* ── Info Cards ── */
      .info-section {
        padding: 0 var(--space-4);
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
      }

      .info-card {
        background-color: var(--color-surface);
        border-radius: var(--radius-lg);
        padding: var(--space-4);
        box-shadow: var(--shadow-sm);
      }

      .info-card-title {
        font-size: var(--text-base);
        font-weight: var(--font-weight-semibold);
        color: var(--color-text-primary);
        margin-bottom: var(--space-3);
        display: flex;
        align-items: center;
        gap: var(--space-2);
      }

      .info-card-title svg {
        width: 18px;
        height: 18px;
        color: var(--color-text-secondary);
      }

      /* ── Tags ── */
      .tags-list {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2);
      }

      .tag-pill {
        font-size: var(--text-sm);
        padding: var(--space-1) var(--space-3);
        border-radius: var(--radius-full);
        font-weight: var(--font-weight-medium);
        line-height: var(--text-sm-lh);
      }

      .tag-pill.tag-pink {
        background-color: var(--color-primary-bg);
        color: var(--color-primary-dark);
      }

      .tag-pill.tag-blue {
        background-color: var(--color-secondary-bg);
        color: var(--color-secondary-dark);
      }

      .tag-pill.tag-teal {
        background-color: rgba(20, 184, 166, 0.12);
        color: var(--color-accent-teal);
      }

      /* ── Notes ── */
      .note-text {
        font-size: var(--text-base);
        color: var(--color-text-secondary);
        line-height: var(--text-base-lh);
        background-color: var(--color-bg-sunken);
        border-radius: var(--radius-md);
        padding: var(--space-3);
      }

      .note-expand {
        font-size: var(--text-sm);
        color: var(--color-text-link);
        font-weight: var(--font-weight-medium);
        cursor: pointer;
        margin-top: var(--space-2);
        display: inline-block;
      }

      /* ── QR Code Card ── */
      .qr-card-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-4);
      }

      .qr-placeholder {
        width: 120px;
        height: 120px;
        border-radius: var(--radius-lg);
        border: 2px dashed var(--color-border);
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--color-bg-sunken);
        position: relative;
        overflow: hidden;
      }

      .qr-pattern {
        width: 100%;
        height: 100%;
        position: relative;
        opacity: 0.15;
      }

      .qr-corner {
        position: absolute;
        width: 28px;
        height: 28px;
        border: 3px solid var(--color-text-tertiary);
      }

      .qr-corner.tl {
        top: 12px;
        left: 12px;
        border-right: none;
        border-bottom: none;
        border-radius: 4px 0 0 0;
      }

      .qr-corner.tr {
        top: 12px;
        right: 12px;
        border-left: none;
        border-bottom: none;
        border-radius: 0 4px 0 0;
      }

      .qr-corner.bl {
        bottom: 12px;
        left: 12px;
        border-right: none;
        border-top: none;
        border-radius: 0 0 0 4px;
      }

      .qr-corner.br {
        bottom: 12px;
        right: 12px;
        border-left: none;
        border-top: none;
        border-radius: 0 0 4px 0;
      }

      .qr-grid {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: grid;
        grid-template-columns: repeat(5, 8px);
        grid-template-rows: repeat(5, 8px);
        gap: 3px;
      }

      .qr-cell {
        width: 8px;
        height: 8px;
        border-radius: 1px;
        background-color: var(--color-text-tertiary);
      }

      .qr-cell.empty {
        background-color: transparent;
      }

      .qr-placeholder-icon {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: var(--color-text-tertiary);
        z-index: 2;
      }

      .qr-placeholder-icon svg {
        width: 32px;
        height: 32px;
      }

      .qr-actions {
        display: flex;
        gap: var(--space-3);
        width: 100%;
      }

      /* ── Buttons ── */
      .btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-2);
        padding: var(--space-3) var(--space-6);
        border-radius: var(--radius-full);
        background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
        color: var(--color-text-inverse);
        font-size: var(--text-base);
        font-weight: var(--font-weight-semibold);
        font-family: var(--font-sans);
        border: none;
        cursor: pointer;
        transition: opacity 0.2s ease, transform 0.15s ease;
        box-shadow: 0 2px 8px rgba(216, 27, 96, 0.25);
      }

      .btn-primary:hover {
        opacity: 0.9;
      }

      .btn-primary:active {
        transform: scale(0.98);
      }

      .btn-primary svg {
        width: 16px;
        height: 16px;
      }

      .btn-outlined {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-2);
        padding: var(--space-3) var(--space-6);
        border-radius: var(--radius-full);
        background-color: transparent;
        color: var(--color-primary);
        font-size: var(--text-base);
        font-weight: var(--font-weight-semibold);
        font-family: var(--font-sans);
        border: 1.5px solid var(--color-primary);
        cursor: pointer;
        transition: background-color 0.2s ease, transform 0.15s ease;
      }

      .btn-outlined:hover {
        background-color: var(--color-primary-bg-soft);
      }

      .btn-outlined:active {
        transform: scale(0.98);
      }

      .btn-outlined svg {
        width: 16px;
        height: 16px;
      }

      .btn-text-danger {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-1);
        padding: var(--space-2) var(--space-4);
        border-radius: var(--radius-full);
        background: transparent;
        color: var(--state-error);
        font-size: var(--text-sm);
        font-weight: var(--font-weight-medium);
        font-family: var(--font-sans);
        border: none;
        cursor: pointer;
        transition: background-color 0.2s ease;
      }

      .btn-text-danger:hover {
        background-color: rgba(239, 68, 68, 0.08);
      }

      .btn-text-danger svg {
        width: 16px;
        height: 16px;
      }

      /* ── Actions Row ── */
      .actions-row {
        padding: var(--space-5) var(--space-4);
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
      }

      .actions-row-bottom {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-4);
      }

      /* ── Bottom Tab Bar ── */
      .tab-bar {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        max-width: 430px;
        height: 56px;
        padding-bottom: env(safe-area-inset-bottom, 16px);
        background-color: var(--color-surface);
        border-top: 1px solid var(--color-border);
        display: flex;
        align-items: center;
        justify-content: space-around;
        z-index: 1000;
        box-shadow: var(--shadow-md);
      }

      .tab-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        flex: 1;
        height: 100%;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        text-decoration: none;
        transition: color 0.2s ease;
      }

      .tab-item .tab-icon {
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--color-text-tertiary);
        transition: color 0.2s ease;
      }

      .tab-item .tab-icon svg {
        width: 24px;
        height: 24px;
      }

      .tab-item .tab-label {
        font-size: var(--text-xs);
        line-height: var(--text-xs-lh);
        color: var(--color-text-tertiary);
        font-weight: var(--font-weight-regular);
        transition: color 0.2s ease, font-weight 0.2s ease;
      }

      .tab-item[data-active="true"] .tab-icon {
        color: var(--color-primary);
      }

      .tab-item[data-active="true"] .tab-label {
        color: var(--color-primary);
        font-weight: var(--font-weight-semibold);
      }
    </style>

        <a class="tab-item" href="settings.html" data-tab-key="tab-settings">
          <span class="tab-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
            </svg>
          </span>
          <span class="tab-label">设置</span>
        </a>
      </nav>
    </div>
    <script src="../assets/store.js"></script>
    <script>lucide.createIcons();</script>
    <script>
    (function () {
      'use strict';
      var S = window.GuiweiStore;
      var contentRoot = document.getElementById('content-root');
      var btnBack = document.getElementById('btn-back');
      var btnEditTop = document.getElementById('btn-edit-top');
      var btnDeleteTop = document.getElementById('btn-delete-top');

      // 解析 URL 参数
      function getParam(name) {
        var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
        return m ? decodeURIComponent(m[1]) : null;
      }

      // HTML 转义
      function escapeHtml(s) {
        if (s == null) return '';
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // 日期格式化：2026-06-15
      function formatDate(iso) {
        if (!iso) return '未知';
        var d = new Date(iso);
        if (isNaN(d.getTime())) return '未知';
        var y = d.getFullYear();
        var m = String(d.getMonth() + 1).padStart(2, '0');
        var day = String(d.getDate()).padStart(2, '0');
        return y + '-' + m + '-' + day;
      }

      // 相对时间
      function formatRelativeTime(iso) {
        if (!iso) return '';
        var t = new Date(iso).getTime();
        if (isNaN(t)) return '';
        var diff = Date.now() - t;
        var sec = Math.floor(diff / 1000);
        if (sec < 60) return '刚刚';
        var min = Math.floor(sec / 60);
        if (min < 60) return min + '分钟前';
        var hr = Math.floor(min / 60);
        if (hr < 24) return hr + '小时前';
        var day = Math.floor(hr / 24);
        if (day < 7) return day + '天前';
        var wk = Math.floor(day / 7);
        if (wk < 4) return wk + '周前';
        var mo = Math.floor(day / 30);
        if (mo < 12) return mo + '个月前';
        return Math.floor(mo / 12) + '年前';
      }

      // 标签颜色（与 items.html 一致）
      var TAG_COLORS = ['tag-pink', 'tag-blue'];
      function tagColor(tag) {
        if (!tag) return 'tag-pink';
        var hash = 0;
        for (var i = 0; i < tag.length; i++) { hash = (hash * 31 + tag.charCodeAt(i)) >>> 0; }
        return TAG_COLORS[hash % TAG_COLORS.length];
      }

      // 渲染错误状态
      function renderError(message) {
        contentRoot.innerHTML =
          '<div style="padding: 80px 24px; text-align: center; color: var(--color-text-tertiary);">' +
            '<div style="width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 50%; background-color: var(--color-bg-sunken); display: flex; align-items: center; justify-content: center;">' +
              '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width: 32px; height: 32px;">' +
                '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>' +
              '</svg>' +
            '</div>' +
            '<div style="font-size: var(--text-lg); font-weight: 600; color: var(--color-text-primary); margin-bottom: 6px;">无法显示物品</div>' +
            '<div style="font-size: var(--text-sm);">' + escapeHtml(message) + '</div>' +
            '<button id="btn-back-error" type="button" style="margin-top: 20px; padding: 10px 24px; background-color: var(--color-primary); color: var(--color-text-inverse); border: none; border-radius: 9999px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: var(--font-sans);">返回物品列表</button>' +
          '</div>';
        var b = document.getElementById('btn-back-error');
        if (b) b.addEventListener('click', function () { window.location.href = 'items.html'; });
      }

      // 渲染主体
      function renderItem(item) {
        var path = S.resolveItemPath(item.id);
        var pathParts = [];
        if (path.house) pathParts.push({ name: path.house.name, type: 'house', id: path.house.id });
        if (path.floor) pathParts.push({ name: path.floor.name, type: 'floor', id: path.floor.id });
        if (path.room) pathParts.push({ name: path.room.name, type: 'room', id: path.room.id });
        if (path.container) pathParts.push({ name: path.container.name, type: 'container', id: path.container.id });

        // 面包屑 HTML
        var breadcrumbHtml = '';
        if (pathParts.length === 0) {
          breadcrumbHtml = '<span class="breadcrumb-item">未设置位置</span>';
        } else {
          pathParts.forEach(function (p, i) {
            breadcrumbHtml += '<span class="breadcrumb-item">' + escapeHtml(p.name) + '</span>';
            if (i < pathParts.length - 1) {
              breadcrumbHtml += '<span class="breadcrumb-separator">' +
                '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>' +
              '</span>';
            }
          });
        }

        // 标签 HTML
        var tagsHtml = '';
        if (item.tags && item.tags.length > 0) {
          item.tags.forEach(function (t) {
            tagsHtml += '<span class="tag-pill ' + tagColor(t) + '">' + escapeHtml(t) + '</span>';
          });
        } else {
          tagsHtml = '<span style="font-size: var(--text-sm); color: var(--color-text-tertiary);">暂无标签</span>';
        }

        // 备注 HTML
        var noteHtml = '';
        if (item.note) {
          noteHtml = '<div class="note-text">' + escapeHtml(item.note) + '</div>';
        } else {
          noteHtml = '<span style="font-size: var(--text-sm); color: var(--color-text-tertiary);">暂无备注</span>';
        }

        // 位置详情（XOR 显示）
        var locationDetail = '';
        if (path.container) {
          locationDetail = '位于容器：' + escapeHtml(path.container.name);
        } else if (path.room) {
          locationDetail = '散放于房间：' + escapeHtml(path.room.name);
        } else {
          locationDetail = '位置信息缺失';
        }

        // 物品码 payload
        var payload = S.buildPayload(item.code);

        // 最近查看时间
        var viewedTime = item.lastViewedAt ? formatRelativeTime(item.lastViewedAt) : '从未';

        contentRoot.innerHTML =
          // Hero Card
          '<section class="hero-card">' +
            '<div class="hero-card-gradient">' +
              '<h1 class="hero-card-name">' + escapeHtml(item.name) + '</h1>' +
              '<div class="hero-card-breadcrumb">' + breadcrumbHtml + '</div>' +
              '<span class="hero-card-date">创建于 ' + formatDate(item.createdAt) + ' · 更新于 ' + formatRelativeTime(item.updatedAt) + '</span>' +
            '</div>' +
          '</section>' +

          // Info Cards
          '<section class="info-section">' +
            // 位置信息卡片
            '<div class="info-card">' +
              '<div class="info-card-title">' +
                '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>' +
                '位置' +
              '</div>' +
              '<div style="font-size: var(--text-base); color: var(--color-text-secondary); line-height: var(--text-base-lh); background-color: var(--color-bg-sunken); border-radius: var(--radius-md); padding: var(--space-3);">' +
                locationDetail +
              '</div>' +
              '<button class="btn-outlined" id="btn-change-location" type="button" style="width: 100%; margin-top: 12px; padding: 8px 16px; font-size: var(--text-sm);">' +
                '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>' +
                '更换位置' +
              '</button>' +
            '</div>' +

            // Tags Card
            '<div class="info-card">' +
              '<div class="info-card-title">' +
                '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>' +
                '标签' +
              '</div>' +
              '<div class="tags-list">' + tagsHtml + '</div>' +
            '</div>' +

            // Notes Card
            '<div class="info-card">' +
              '<div class="info-card-title">' +
                '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>' +
                '备注' +
              '</div>' +
              noteHtml +
            '</div>' +

            // Item Code Card
            '<div class="info-card">' +
              '<div class="info-card-title">' +
                '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="3" height="3"/><line x1="21" y1="14" x2="21" y2="21"/><line x1="14" y1="21" x2="21" y2="21"/></svg>' +
                '物品码' +
              '</div>' +
              '<div class="qr-card-content">' +
                '<div class="qr-placeholder">' +
                  '<div class="qr-pattern">' +
                    '<div class="qr-corner tl"></div><div class="qr-corner tr"></div>' +
                    '<div class="qr-corner bl"></div><div class="qr-corner br"></div>' +
                    '<div class="qr-grid"></div>' +
                  '</div>' +
                  '<div class="qr-placeholder-icon">' +
                    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>' +
                  '</div>' +
                '</div>' +
                '<div style="font-size: var(--text-xs); color: var(--color-text-tertiary); word-break: break-all; text-align: center; padding: 0 8px;">' + escapeHtml(payload) + '</div>' +
                '<div class="qr-actions">' +
                  '<button class="btn-primary" id="btn-copy-code" type="button" style="flex: 1;">' +
                    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>' +
                    '复制码' +
                  '</button>' +
                  '<button class="btn-outlined" id="btn-reset-code" type="button" style="flex: 1;">' +
                    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10"/></svg>' +
                    '重置码' +
                  '</button>' +
                '</div>' +
              '</div>' +
            '</div>' +

            // 元信息卡片
            '<div class="info-card">' +
              '<div class="info-card-title">' +
                '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' +
                '时间信息' +
              '</div>' +
              '<div style="display: flex; flex-direction: column; gap: 8px; font-size: var(--text-sm); color: var(--color-text-secondary);">' +
                '<div style="display: flex; justify-content: space-between;"><span>创建时间</span><span>' + formatDate(item.createdAt) + '</span></div>' +
                '<div style="display: flex; justify-content: space-between;"><span>最后更新</span><span>' + formatRelativeTime(item.updatedAt) + '</span></div>' +
                '<div style="display: flex; justify-content: space-between;"><span>最近查看</span><span>' + viewedTime + '</span></div>' +
              '</div>' +
            '</div>' +
          '</section>' +

          // Actions Row
          '<section class="actions-row">' +
            '<button class="btn-primary" id="btn-edit" type="button" style="width: 100%;">' +
              '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>' +
              '编辑物品' +
            '</button>' +
            '<div class="actions-row-bottom">' +
              '<button class="btn-text-danger" id="btn-delete" type="button">' +
                '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>' +
                '删除物品' +
              '</button>' +
            '</div>' +
          '</section>';

        // 绑定事件
        bindActions(item);
        lucide.createIcons();
      }

      // 绑定事件
      function bindActions(item) {
        var btnEdit = document.getElementById('btn-edit');
        var btnDelete = document.getElementById('btn-delete');
        var btnCopyCode = document.getElementById('btn-copy-code');
        var btnResetCode = document.getElementById('btn-reset-code');
        var btnChangeLoc = document.getElementById('btn-change-location');

        if (btnEdit) btnEdit.addEventListener('click', function () { goEdit(item.id); });
        if (btnEditTop) btnEditTop.addEventListener('click', function () { goEdit(item.id); });
        if (btnDelete) btnDelete.addEventListener('click', function () { confirmDelete(item); });
        if (btnDeleteTop) btnDeleteTop.addEventListener('click', function () { confirmDelete(item); });
        if (btnCopyCode) btnCopyCode.addEventListener('click', function () { copyCode(item); });
        if (btnResetCode) btnResetCode.addEventListener('click', function () { resetCode(item); });
        if (btnChangeLoc) btnChangeLoc.addEventListener('click', function () { changeLocation(item); });
      }

      function goEdit(id) {
        window.location.href = 'form.html?type=item&id=' + encodeURIComponent(id) + '&returnTo=item-detail.html?id=' + encodeURIComponent(id);
      }

      function confirmDelete(item) {
        if (!confirm('确定要删除物品 "' + item.name + '" 吗？此操作不可撤销。')) return;
        S.softDeleteItem(item.id);
        alert('物品已删除');
        window.location.href = 'items.html';
      }

      function copyCode(item) {
        var payload = S.buildPayload(item.code);
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(payload).then(function () {
            showToast('已复制到剪贴板');
          }).catch(function () {
            fallbackCopy(payload);
          });
        } else {
          fallbackCopy(payload);
        }
      }

      function fallbackCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); showToast('已复制到剪贴板'); }
        catch (e) { showToast('复制失败'); }
        document.body.removeChild(ta);
      }

      function resetCode(item) {
        if (!confirm('重置物品码后，原有的码将无法再扫描到该物品。确定要重置吗？')) return;
        var newCode = S.newId();
        S.resetOwnerCode('item', item.id, newCode);
        showToast('物品码已重置');
        render();
      }

      function changeLocation(item) {
        var msg = '请通过编辑物品重新选择位置。\n\n点击"编辑物品"按钮，在表单中重新选择位置。';
        alert(msg);
        goEdit(item.id);
      }

      function showToast(message) {
        var t = document.createElement('div');
        t.textContent = message;
        t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;z-index:9999;opacity:0;transition:opacity 0.2s;';
        document.body.appendChild(t);
        requestAnimationFrame(function () { t.style.opacity = '1'; });
        setTimeout(function () {
          t.style.opacity = '0';
          setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 200);
        }, 2000);
      }

      // 主渲染
      function render() {
        var id = getParam('id');
        if (!id) {
          renderError('缺少物品 ID 参数');
          return;
        }
        var item = S.getItem(id);
        if (!item) {
          renderError('物品不存在或已被删除');
          return;
        }
        // 标记查看
        try { S.markItemViewed(id); } catch (e) { /* ignore */ }
        renderItem(item);
      }

      // 返回按钮
      btnBack.addEventListener('click', function () {
        var returnTo = getParam('returnTo');
        if (returnTo) {
          window.location.href = returnTo;
        } else if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = 'items.html';
        }
      });

      // 启动
      render();
    })();
    </script>
    <script src="../assets/app.js"></script>
</body>
</html>
