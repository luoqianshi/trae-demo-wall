    <style id="theme-vars">
:root {
  /* ── Brand Colors ── */
  --color-primary: #D81B60;
  --color-primary-light: #F06292;
  --color-primary-dark: #AD1457;
  --color-primary-bg: #FCE4EC;
  --color-primary-bg-soft: #FFF0F5;

  --color-secondary: #1976D2;
  --color-secondary-light: #64B5F6;
  --color-secondary-dark: #0D47A1;
  --color-secondary-bg: #E3F2FD;
  --color-secondary-bg-soft: #F0F7FF;

  --color-accent-purple: #8B5CF6;
  --color-accent-cyan: #06B6D4;
  --color-accent-teal: #14B8A6;
  --color-accent-orange: #F97316;

  /* ── Neutral Scale ── */
  --color-bg: #FAFAFA;
  --color-bg-elevated: #FFFFFF;
  --color-bg-sunken: #F3F4F6;
  --color-surface: #FFFFFF;
  --color-surface-dim: #F9FAFB;

  --color-border: #E5E7EB;
  --color-border-light: #F3F4F6;
  --color-divider: #F0F0F0;

  --color-text-primary: #111827;
  --color-text-secondary: #6B7280;
  --color-text-tertiary: #9CA3AF;
  --color-text-inverse: #FFFFFF;
  --color-text-link: #1976D2;

  /* ── State Colors ── */
  --state-success: #10B981;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* ── Radius Scale ── */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* ── Typography System ── */
  --font-sans: 'Inter', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, -apple-system, sans-serif;

  --text-xs: 10px;
  --text-xs-lh: 14px;
  --text-sm: 12px;
  --text-sm-lh: 18px;
  --text-base: 14px;
  --text-base-lh: 22px;
  --text-lg: 16px;
  --text-lg-lh: 24px;
  --text-xl: 20px;
  --text-xl-lh: 28px;
  --text-2xl: 24px;
  --text-2xl-lh: 32px;
  --text-3xl: 30px;
  --text-3xl-lh: 38px;

  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  /* ── Spacing ── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  /* ── Shadow ── */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.03);
  --shadow-md: 0 2px 8px 0 rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 4px 16px 0 rgba(0, 0, 0, 0.05);
  --shadow-float: 0 8px 24px 0 rgba(0, 0, 0, 0.08);
}

/* Dark mode */
.dark {
  --color-bg: #111827;
  --color-bg-elevated: #1F2937;
  --color-bg-sunken: #0F172A;
  --color-surface: #1F2937;
  --color-surface-dim: #374151;

  --color-border: #374151;
  --color-border-light: #1F2937;
  --color-divider: #374151;

  --color-text-primary: #F9FAFB;
  --color-text-secondary: #9CA3AF;
  --color-text-tertiary: #6B7280;
  --color-text-inverse: #111827;
  --color-text-link: #64B5F6;

  --color-primary-bg: #4A1128;
  --color-primary-bg-soft: #3B0F20;
  --color-secondary-bg: #0C2D5E;
  --color-secondary-bg-soft: #0A244D;

  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.2);
  --shadow-md: 0 2px 8px 0 rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 4px 16px 0 rgba(0, 0, 0, 0.35);
  --shadow-float: 0 8px 24px 0 rgba(0, 0, 0, 0.5);
}

        /* ── App Shell ── */
        .app-shell {
          max-width: 430px;
          margin: 0 auto;
          min-height: 100vh;
          background-color: var(--color-bg);
          font-family: var(--font-sans);
          position: relative;
          display: flex;
          flex-direction: column;

          padding-bottom: 16px;

        .app-bar {
          display: flex;

          padding: var(--space-3) var(--space-4);
          padding-top: calc(var(--space-3) + env(safe-area-inset-top, 0px));
          position: sticky;
          top: 0;
          z-index: 100;
          background-color: var(--color-surface);
        }

        .app-bar-title {
          font-size: var(--text-xl);
          font-weight: var(--font-weight-bold);
          color: var(--color-text-primary);

        /* ── Page Content ── */

          flex-direction: column;

          flex-direction: column;

          align-items: center;

          padding: var(--space-3) var(--space-2);

    <script>
      // ── 设置页：从 store 动态加载统计 + 语言持久化 + 数据操作 ──
      (function () {
        'use strict';

        var LOCALE_KEY = 'app_locale';
        // data-dom-id ↔ locale 双向映射
        var DOM_TO_LOCALE = {
          'lang-zh-cn': 'zh_CN',
          'lang-zh-tw': 'zh_TW',
          'lang-en': 'en'
        };
        var LOCALE_TO_DOM = {
          'zh_CN': 'lang-zh-cn',
          'zh_TW': 'lang-zh-tw',
          'en': 'lang-en'
        };

        // 选中/未选中两种 check 图标（与 app.js 中 setupSettings 保持一致）
        var CHECK_ON = '<svg width="20" height="20" viewBox="0 0 20 20" fill="none">' +
          '<circle cx="10" cy="10" r="10" fill="var(--color-primary)"/>' +
          '<path d="M6 10.5L8.5 13L14 7" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        var CHECK_OFF = '<svg width="20" height="20" viewBox="0 0 20 20" fill="none">' +
          '<circle cx="10" cy="10" r="9" stroke="var(--color-border)" stroke-width="1.5" fill="none"/></svg>';

        // 切换语言项的 UI（不弹 toast，避免页面加载时打扰用户）
        function selectLanguageRadio(item) {
          var allItems = document.querySelectorAll('.radio-list__item');
          for (var i = 0; i < allItems.length; i++) {
            var r = allItems[i];
            r.classList.remove('radio-list__item--active');
            var check = r.querySelector('.radio-list__check');
            if (check) check.innerHTML = CHECK_OFF;
          }
          item.classList.add('radio-list__item--active');
          var check = item.querySelector('.radio-list__check');
          if (check) check.innerHTML = CHECK_ON;
        }

        // 页面加载时恢复语言选中态
        function restoreLocale() {
          var saved = null;
          try { saved = localStorage.getItem(LOCALE_KEY); } catch (e) {}
          if (!saved || !LOCALE_TO_DOM[saved]) return;
          var target = document.querySelector('[data-dom-id="' + LOCALE_TO_DOM[saved] + '"]');
          if (target) selectLanguageRadio(target);
        }

        // 监听语言切换并持久化到 localStorage
        // 注意：app.js 的 setupSettings 已绑定 click 处理视觉切换 + toast，
        // 这里只追加一个监听器负责写入 localStorage，不会破坏其行为。
        function bindLocalePersistence() {
          var items = document.querySelectorAll('.radio-list__item');
          for (var i = 0; i < items.length; i++) {
            (function (item) {
              item.addEventListener('click', function () {
                var domId = item.getAttribute('data-dom-id');
                var locale = DOM_TO_LOCALE[domId];
                if (locale) {
                  try { localStorage.setItem(LOCALE_KEY, locale); } catch (e) {}
                }
              });
            })(items[i]);
          }
        }

        // 从 GuiweiStore.stats() 刷新数据统计 UI
        function refreshStats() {
          if (!window.GuiweiStore || typeof GuiweiStore.stats !== 'function') return;
          var stats = GuiweiStore.stats();
          var itemsEl = document.getElementById('stat-items');
          var hierarchyEl = document.getElementById('stat-hierarchy');
          if (itemsEl) itemsEl.textContent = stats.items + ' 个';
          if (hierarchyEl) {
            hierarchyEl.textContent =
              stats.houses + ' 栋房子 / ' +
              stats.floors + ' 楼层 / ' +
              stats.rooms + ' 房间 / ' +
              stats.containers + ' 容器';
          }
        }

        // 绑定"清空所有数据"与"加载示例数据"按钮
        function bindDataActions() {
          var clearBtn = document.getElementById('btn-clear-data');
          var seedBtn = document.getElementById('btn-seed-data');
          if (clearBtn) {
            clearBtn.addEventListener('click', function () {
              if (!window.confirm('确定要清空所有数据吗？此操作不可恢复。')) return;
              if (window.GuiweiStore && typeof GuiweiStore.clearAll === 'function') {
                GuiweiStore.clearAll();
              }
              window.location.reload();
            });
          }
          if (seedBtn) {
            seedBtn.addEventListener('click', function () {
              if (window.GuiweiStore && typeof GuiweiStore.seedDemoData === 'function') {
                GuiweiStore.seedDemoData();
              }
              window.location.reload();
            });
          }
        }

        function init() {
          restoreLocale();
          bindLocalePersistence();
          refreshStats();
          bindDataActions();
        }

        // app.js 在 DOMContentLoaded 注册 init，本脚本在其后注册，
        // 因此会晚于 app.js 的 setupSettings 执行，可安全操作 radio-list。
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', init);
        } else {
          init();
        }
      })();
    </script>
</body>
</html>
