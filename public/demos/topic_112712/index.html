<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <title>归位 App - 功能演示</title>

  <style>
    body { font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; background: #FAFAFA; color: #111827; }
    .loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; }
    .spinner { width: 36px; height: 36px; border: 3px solid #FCE4EC; border-top-color: #D81B60; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    a { color: #D81B60; text-decoration: none; font-weight: 600; }
  </style>
</head>

  <div class="loading">
    <div class="spinner"></div>

  </div>
