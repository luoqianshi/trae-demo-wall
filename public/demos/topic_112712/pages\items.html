<html lang="zh-CN" class="light">
<head>

    <style id="theme-vars">
:root {
  /* ── Brand Colors ── */
  --color-primary: #D81B60;
  --color-primary-light: #F06292;
  --color-primary-dark: #AD1457;
  --color-primary-bg: #FCE4EC;
  --color-primary-bg-soft: #FFF0F5;

  --color-secondary: #1976D2;
  --color-secondary-light: #64B5F6;
  --color-secondary-dark: #0D47A1;
  --color-secondary-bg: #E3F2FD;
  --color-secondary-bg-soft: #F0F7FF;

  --color-accent-purple: #8B5CF6;
  --color-accent-cyan: #06B6D4;
  --color-accent-teal: #14B8A6;
  --color-accent-orange: #F97316;

  /* ── Neutral Scale ── */
  --color-bg: #FAFAFA;
  --color-bg-elevated: #FFFFFF;
  --color-bg-sunken: #F3F4F6;
  --color-surface: #FFFFFF;
  --color-surface-dim: #F9FAFB;

  --color-border: #E5E7EB;
  --color-border-light: #F3F4F6;
  --color-divider: #F0F0F0;

  --color-text-primary: #111827;
  --color-text-secondary: #6B7280;
  --color-text-tertiary: #9CA3AF;
  --color-text-inverse: #FFFFFF;
  --color-text-link: #1976D2;

  /* ── State Colors ── */
  --state-success: #10B981;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* ── Radius Scale ── */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* ── Typography System ── */
  --font-sans: 'Inter', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, -apple-system, sans-serif;

  --text-xs: 10px;
  --text-xs-lh: 14px;
  --text-sm: 12px;
  --text-sm-lh: 18px;
  --text-base: 14px;
  --text-base-lh: 22px;
  --text-lg: 16px;
  --text-lg-lh: 24px;
  --text-xl: 20px;
  --text-xl-lh: 28px;
  --text-2xl: 24px;
  --text-2xl-lh: 32px;
  --text-3xl: 30px;
  --text-3xl-lh: 38px;

  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  /* ── Spacing ── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  /* ── Shadow ── */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.03);
  --shadow-md: 0 2px 8px 0 rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 4px 16px 0 rgba(0, 0, 0, 0.05);
  --shadow-float: 0 8px 24px 0 rgba(0, 0, 0, 0.08);
}

/* Dark mode */
.dark {
  --color-bg: #111827;
  --color-bg-elevated: #1F2937;
  --color-bg-sunken: #0F172A;
  --color-surface: #1F2937;
  --color-surface-dim: #374151;

  --color-border: #374151;
  --color-border-light: #1F2937;
  --color-divider: #374151;

  --color-text-primary: #F9FAFB;
  --color-text-secondary: #9CA3AF;
  --color-text-tertiary: #6B7280;
  --color-text-inverse: #111827;
  --color-text-link: #64B5F6;

  --color-primary-bg: #4A1128;
  --color-primary-bg-soft: #3B0F20;
  --color-secondary-bg: #0C2D5E;
  --color-secondary-bg-soft: #0A244D;

  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.2);
  --shadow-md: 0 2px 8px 0 rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 4px 16px 0 rgba(0, 0, 0, 0.35);
  --shadow-float: 0 8px 24px 0 rgba(0, 0, 0, 0.5);
}

  @theme inline {

  }
  @layer base {
    body { background: var(--color-surface); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }

  <link rel="stylesheet" href="../assets/app.css" />
  <style>
    /* ── App Shell (与其他页面一致的基础结构) ── */
    .app-shell {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      background-color: var(--color-bg);
      font-family: var(--font-sans);
      position: relative;
    }
    .app-frame {
      padding-bottom: 80px;
      min-height: 100vh;
    }
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      height: 56px;
      padding-bottom: env(safe-area-inset-bottom, 16px);
      background-color: var(--color-surface);
      border-top: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 1000;
      box-shadow: var(--shadow-md);
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      flex: 1;
      height: 100%;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      text-decoration: none;
      color: var(--color-text-tertiary);
      transition: color 0.2s ease;
    }
    .tab-item .tab-icon { color: var(--color-text-tertiary); transition: color 0.2s ease; }
    .tab-item .tab-label {
      font-size: var(--text-xs);
      line-height: var(--text-xs-lh);
      color: var(--color-text-tertiary);
      font-weight: var(--font-weight-regular);
      transition: color 0.2s ease, font-weight 0.2s ease;
    }
    .tab-item[data-active="true"] { color: var(--color-primary); }
    .tab-item[data-active="true"] .tab-icon,
    .tab-item[data-active="true"] i { color: var(--color-primary); }
    .tab-item[data-active="true"] .tab-label { color: var(--color-primary); font-weight: var(--font-weight-semibold); }

    /* ── Item Card ── */
    .item-card {
      background-color: var(--color-surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: box-shadow 0.2s ease, transform 0.15s ease;
      text-decoration: none;
      color: inherit;
    }
    .item-card:hover { box-shadow: var(--shadow-md); }
    .item-card:active { transform: scale(0.99); }
    .item-card-title {
      font-size: var(--text-base);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-primary);
    }
    .item-card-path {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 2px;
    }
    .item-card-path-text {
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-card-time {
      font-size: var(--text-xs);
      color: var(--color-text-tertiary);
    }
    .item-tag {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-weight: var(--font-weight-medium);
    }
    .tag-pink { background-color: var(--color-primary-bg); color: var(--color-primary); }
    .tag-blue { background-color: var(--color-secondary-bg); color: var(--color-secondary); }
    .tag-purple { background-color: rgba(139, 92, 246, 0.12); color: var(--color-accent-purple); }
    .tag-orange { background-color: rgba(249, 115, 22, 0.12); color: var(--color-accent-orange); }
    .tag-teal { background-color: rgba(20, 184, 166, 0.12); color: var(--color-accent-teal); }

    /* ── Empty State ── */
    .empty-state {
      padding: 64px 24px 48px;
      text-align: center;
      color: var(--color-text-tertiary);
    }
    .empty-state-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      border-radius: var(--radius-full);
      background-color: var(--color-bg-sunken);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-tertiary);
    }
    .empty-state-icon svg { width: 32px; height: 32px; }
    .empty-state-title {
      font-size: var(--text-lg);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-primary);
      margin-bottom: 6px;
    }
    .empty-state-sub { font-size: var(--text-sm); }
    .empty-state-cta {
      margin-top: 20px;
      padding: 10px 24px;
      background-color: var(--color-primary);
      color: var(--color-text-inverse);
      border: none;
      border-radius: var(--radius-full);
      font-size: var(--text-sm);
      font-weight: var(--font-weight-medium);
      cursor: pointer;
      font-family: var(--font-sans);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .empty-state-cta:hover { background-color: var(--color-primary-dark); }

    /* ── Filter Chip ── */
    .filter-chip {
      flex-shrink: 0;
      padding: 6px 16px;
      border-radius: var(--radius-full);
      font-size: var(--text-sm);
      font-weight: var(--font-weight-medium);
      background-color: var(--color-bg-sunken);
      color: var(--color-text-secondary);
      cursor: pointer;
      white-space: nowrap;
      border: 1px solid var(--color-border-light);
      transition: all 0.2s ease;
      font-family: var(--font-sans);
    }
    .filter-chip[data-active="true"] {
      background-color: var(--color-primary);
      color: var(--color-text-inverse);
      border-color: var(--color-primary);
    }

    /* ── Load Complete ── */
    .load-complete {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 24px 16px 32px 16px;
      color: var(--color-text-tertiary);
    }
  </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="app-shell">

      <!-- App Shell Frame -->
      <div class="app-frame">

        <!-- 1. App Bar -->

    <script src="../assets/store.js"></script>
    <script>lucide.createIcons();</script>
    <script>
    (function () {
      'use strict';
      var S = window.GuiweiStore;
      var listEl = document.getElementById('items-list');
      var footerEl = document.getElementById('footer-area');
      var searchInput = document.getElementById('search-input');
      var searchClear = document.getElementById('search-clear');
      var chipsEl = document.getElementById('filter-chips');
      var btnAdd = document.getElementById('btn-add-item');

      // 当前过滤状态
      var state = { filter: 'all', query: '' };

      // 标签颜色映射（按 tag 内容 hash）
      var TAG_COLORS = ['tag-pink', 'tag-blue', 'tag-purple', 'tag-orange', 'tag-teal'];
      function tagColor(tag) {
        if (!tag) return 'tag-pink';
        var hash = 0;
        for (var i = 0; i < tag.length; i++) { hash = (hash * 31 + tag.charCodeAt(i)) >>> 0; }
        return TAG_COLORS[hash % TAG_COLORS.length];
      }

      // 相对时间格式化
      function formatRelativeTime(iso) {
        if (!iso) return '';
        var t = new Date(iso).getTime();
        if (isNaN(t)) return '';
        var diff = Date.now() - t;
        var sec = Math.floor(diff / 1000);
        if (sec < 60) return '刚刚';
        var min = Math.floor(sec / 60);
        if (min < 60) return min + '分钟前';
        var hr = Math.floor(min / 60);
        if (hr < 24) return hr + '小时前';
        var day = Math.floor(hr / 24);
        if (day < 7) return day + '天前';
        var wk = Math.floor(day / 7);
        if (wk < 4) return wk + '周前';
        var mo = Math.floor(day / 30);
        if (mo < 12) return mo + '个月前';
        return Math.floor(mo / 12) + '年前';
      }

      // 获取当前过滤后的物品列表
      function getCurrentItems() {
        var q = state.query.trim();
        var items;
        if (q) {
          items = S.searchItems(q);
        } else if (state.filter === 'recent-added') {
          items = S.listRecentAdded(50);
        } else if (state.filter === 'recent-viewed') {
          items = S.listRecentViewed(50);
        } else if (state.filter === 'with-tags') {
          items = S.listItems().filter(function (it) { return it.tags && it.tags.length > 0; });
        } else {
          items = S.listItems();
        }
        return items;
      }

      // 渲染单个物品卡片
      function renderItemCard(item) {
        var path = S.resolveItemPath(item.id);
        var pathLabel = S.pathLabel(path) || '未设置位置';
        var timeText = formatRelativeTime(item.updatedAt || item.createdAt) || '未知';
        // 显示第一个标签
        var firstTag = (item.tags && item.tags.length > 0) ? item.tags[0] : null;
        var tagHtml = '';
        if (firstTag) {
          var color = tagColor(firstTag);
          tagHtml = '<span class="item-tag ' + color + '">' + escapeHtml(firstTag) + '</span>';
        }
        var card = document.createElement('a');
        card.className = 'item-card';
        card.href = 'item-detail.html?id=' + encodeURIComponent(item.id);
        card.innerHTML =
          '<div style="flex: 1; min-width: 0;">' +
            '<div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">' +
              '<span class="item-card-title">' + escapeHtml(item.name) + '</span>' +
              tagHtml +
            '</div>' +
            '<div class="item-card-path">' +
              '<i data-lucide="folder" style="width: 13px; height: 13px; color: var(--color-text-tertiary); flex-shrink: 0;"></i>' +
              '<span class="item-card-path-text">' + escapeHtml(pathLabel) + '</span>' +
            '</div>' +
            '<span class="item-card-time">' + timeText + '更新</span>' +
          '</div>' +
          '<i data-lucide="chevron-right" style="width: 18px; height: 18px; color: var(--color-text-tertiary); flex-shrink: 0;"></i>';
        return card;
      }

      // 渲染空状态
      function renderEmptyState() {
        var isSearching = state.query.trim().length > 0;
        var icon = isSearching ? 'search-x' : 'package-open';
        var title = isSearching ? '未找到匹配的物品' : '还没有任何物品';
        var sub = isSearching
          ? '尝试更换关键词或清除筛选'
          : '点击右上角 + 添加你的第一个物品';
        var cta = isSearching ? '' :
          '<button class="empty-state-cta" id="empty-cta" type="button">' +
            '<i data-lucide="plus" style="width: 16px; height: 16px;"></i>' +
            '添加物品' +
          '</button>';
        footerEl.innerHTML =
          '<div class="empty-state">' +
            '<div class="empty-state-icon">' +
              '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" ' +
              'stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
              (isSearching
                ? '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="8" x2="14" y2="14"/>'
                : '<path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/>')
              + '</svg>' +
            '</div>' +
            '<div class="empty-state-title">' + title + '</div>' +
            '<div class="empty-state-sub">' + sub + '</div>' +
            cta +
          '</div>';
        if (!isSearching) {
          var ctaBtn = document.getElementById('empty-cta');
          if (ctaBtn) ctaBtn.addEventListener('click', goAddItem);
        }
      }

      // 渲染加载完成提示
      function renderLoadComplete(count) {
        if (count === 0) return;
        footerEl.innerHTML =
          '<div class="load-complete">' +
            '<i data-lucide="check-circle" style="width: 16px; height: 16px;"></i>' +
            '<span style="font-size: var(--text-sm);">已加载全部 ' + count + ' 个物品</span>' +
          '</div>';
      }

      // 主渲染函数
      function render() {
        var items = getCurrentItems();
        listEl.innerHTML = '';
        if (items.length === 0) {
          footerEl.innerHTML = '';
          renderEmptyState();
        } else {
          var frag = document.createDocumentFragment();
          items.forEach(function (it) { frag.appendChild(renderItemCard(it)); });
          listEl.appendChild(frag);
          renderLoadComplete(items.length);
        }
        lucide.createIcons();
      }

      // HTML 转义（防止 XSS）
      function escapeHtml(s) {
        if (s == null) return '';
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // 跳转添加物品
      function goAddItem() {
        window.location.href = 'form.html?type=item&returnTo=items.html';
      }

      // 事件绑定
      btnAdd.addEventListener('click', goAddItem);

      // 搜索（带 debounce）
      var searchTimer = null;
      searchInput.addEventListener('input', function (e) {
        state.query = e.target.value || '';
        searchClear.style.display = state.query ? 'flex' : 'none';
        if (searchTimer) clearTimeout(searchTimer);
        searchTimer = setTimeout(function () {
          // 搜索时自动切回 all chip（避免与 recent-* 冲突）
          if (state.query && state.filter !== 'all') {
            state.filter = 'all';
            updateChipsActive();
          }
          render();
        }, 180);
      });

      searchClear.addEventListener('click', function () {
        searchInput.value = '';
        state.query = '';
        searchClear.style.display = 'none';
        render();
      });

      // 筛选 chips
      function updateChipsActive() {
        var chips = chipsEl.querySelectorAll('.filter-chip');
        chips.forEach(function (c) {
          c.setAttribute('data-active', c.getAttribute('data-filter') === state.filter ? 'true' : 'false');
        });
      }
      chipsEl.addEventListener('click', function (e) {
        var chip = e.target.closest('.filter-chip');
        if (!chip) return;
        state.filter = chip.getAttribute('data-filter');
        // 切换 chip 时清空搜索（避免冲突）
        if (state.query) {
          state.query = '';
          searchInput.value = '';
          searchClear.style.display = 'none';
        }
        updateChipsActive();
        render();
      });

      // 初始渲染
      render();
    })();
    </script>
    <script src="../assets/app.js"></script>
</body>
</html>
