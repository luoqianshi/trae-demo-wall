  <style id="theme-vars">
:root {
  --color-primary: #D81B60;
  --color-primary-light: #F06292;
  --color-primary-dark: #AD1457;
  --color-primary-bg: #FCE4EC;
  --color-primary-bg-soft: #FFF0F5;
  --color-bg: #FAFAFA;
  --color-bg-elevated: #FFFFFF;
  --color-bg-sunken: #F3F4F6;
  --color-surface: #FFFFFF;
  --color-surface-dim: #F9FAFB;
  --color-border: #E5E7EB;
  --color-border-light: #F3F4F6;
  --color-divider: #F0F0F0;
  --color-text-primary: #111827;
  --color-text-secondary: #6B7280;
  --color-text-tertiary: #9CA3AF;
  --color-text-inverse: #FFFFFF;
  --state-success: #10B981;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;
  --font-sans: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  --text-xs: 10px;
  --text-sm: 12px;
  --text-base: 14px;
  --text-lg: 16px;
  --text-xl: 20px;
  --text-2xl: 24px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.03);

  <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-primary-light: var(--color-primary-light);
    --color-primary-dark: var(--color-primary-dark);
    --color-primary-bg: var(--color-primary-bg);
    --color-primary-bg-soft: var(--color-primary-bg-soft);
    --color-surface: var(--color-surface);
    --color-bg: var(--color-bg);
    --color-bg-elevated: var(--color-bg-elevated);
    --color-bg-sunken: var(--color-bg-sunken);
    --color-border: var(--color-border);
    --color-border-light: var(--color-border-light);
    --color-divider: var(--color-divider);
    --color-text-primary: var(--color-text-primary);
    --color-text-secondary: var(--color-text-secondary);
    --color-text-tertiary: var(--color-text-tertiary);
    --color-text-inverse: var(--color-text-inverse);
    --color-state-success: var(--state-success);
    --color-state-warning: var(--state-warning);
    --color-state-error: var(--state-error);
    --color-state-info: var(--state-info);
  }
  @layer base {
    body { background: var(--color-bg); color: var(--color-text-primary); font-family: var(--font-sans); }
    td, th { break-words; word-break: break-all; word-break: auto-phrase; }
    th { white-space: nowrap; }
  }
  </style>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }
    body { font-family: var(--font-sans); background-color: var(--color-bg); color: var(--color-text-primary); line-height: var(--text-base-lh); -webkit-font-smoothing: antialiased; }
    a { text-decoration: none; color: inherit; }
    img { display: block; max-width: 100%; }

    /* ── App Shell ── */
    .app-shell {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      background-color: var(--color-bg);
      font-family: var(--font-sans);
      position: relative;
    }

    .app-frame {
      padding-bottom: 72px;
      min-height: 100vh;
    }

    /* ── App Bar ── */
    .app-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-3) var(--space-4);
      padding-top: calc(var(--space-3) + env(safe-area-inset-top, 0px));
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--color-surface);
    }

    .app-bar-title {
      font-size: var(--text-xl);
      font-weight: var(--font-weight-bold);
      color: var(--color-text-primary);
    }

    .app-bar-action {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-full);
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--color-text-secondary);
      transition: background-color 0.2s ease;
    }

    .app-bar-action:hover {
      background-color: var(--color-bg-sunken);
    }

    .app-bar-action svg {
      width: 22px;
      height: 22px;
    }

    /* ── Hero Gradient Area ── */
    .hero-area {
      position: relative;
      margin: 0 var(--space-4);
      border-radius: var(--radius-xl);
      overflow: hidden;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: linear-gradient(135deg, #D81B60 0%, #AD1457 30%, #8B5CF6 60%, #1976D2 100%);
    }

    .hero-area-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.15;
    }

    .hero-area-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(216, 27, 96, 0.7) 0%, rgba(139, 92, 246, 0.6) 50%, rgba(25, 118, 210, 0.7) 100%);
    }

    .hero-area-content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: var(--space-4);
    }

    .hero-area-content h1 {
      font-size: var(--text-3xl);
      font-weight: var(--font-weight-bold);
      color: var(--color-text-inverse);
      margin-bottom: var(--space-2);
      letter-spacing: 2px;
    }

    .hero-area-content p {
      font-size: var(--text-base);
      color: rgba(255, 255, 255, 0.9);
      font-weight: var(--font-weight-regular);
    }

    /* ── Feature Cards Section ── */
    .feature-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-3);
      padding: var(--space-5) var(--space-4) var(--space-4);
    }

    .feature-card {
      background-color: var(--color-surface);
      border-radius: var(--radius-lg);
      padding: var(--space-4) var(--space-3);
      box-shadow: var(--shadow-sm);
      text-align: center;
      cursor: pointer;
      transition: box-shadow 0.2s ease, transform 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-2);
    }

    .feature-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }

    .feature-card:active {
      transform: translateY(0);
    }

    .feature-card-icon {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .feature-card-icon svg {
      width: 22px;
      height: 22px;
    }

    .feature-card-icon.icon-pink {
      background-color: var(--color-primary-bg);
      color: var(--color-primary);
    }

    .feature-card-icon.icon-blue {
      background-color: var(--color-secondary-bg);
      color: var(--color-secondary);
    }

    .feature-card-icon.icon-teal {
      background-color: rgba(20, 184, 166, 0.1);
      color: var(--color-accent-teal);
    }

    .feature-card-title {
      font-size: var(--text-sm);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-primary);
      line-height: var(--text-sm-lh);
    }

    .feature-card-subtitle {
      font-size: var(--text-xs);
      color: var(--color-text-secondary);
      line-height: var(--text-xs-lh);
    }

    /* ── Recent Items Section ── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-4) var(--space-4) var(--space-3);
    }

    .section-title {
      font-size: var(--text-lg);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-primary);
    }

    .section-link {
      font-size: var(--text-sm);
      color: var(--color-text-link);
      font-weight: var(--font-weight-medium);
    }

    .item-list {
      padding: 0 var(--space-4);
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }

    .item-card {
      background-color: var(--color-surface);
      border-radius: var(--radius-lg);
      padding: var(--space-3) var(--space-4);
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      gap: var(--space-3);
      cursor: pointer;
      transition: box-shadow 0.2s ease;
    }

    .item-card:hover {
      box-shadow: var(--shadow-md);
    }

    .item-card-info {
      flex: 1;
      min-width: 0;
    }

    .item-card-name {
      font-size: var(--text-base);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-primary);
      margin-bottom: var(--space-1);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-card-location {
      font-size: var(--text-xs);
      color: var(--color-text-secondary);
      margin-bottom: var(--space-2);
    }

    .item-card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-1);
    }

    .item-tag {
      font-size: var(--text-xs);
      padding: 2px var(--space-2);
      border-radius: var(--radius-full);
      font-weight: var(--font-weight-regular);
      line-height: var(--text-xs-lh);
    }

    .item-tag.tag-pink {
      background-color: var(--color-primary-bg);
      color: var(--color-primary-dark);
    }

    .item-tag.tag-blue {
      background-color: var(--color-secondary-bg);
      color: var(--color-secondary-dark);
    }

    .item-tag.tag-teal {
      background-color: rgba(20, 184, 166, 0.1);
      color: var(--color-accent-teal);
    }

    .item-card-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: var(--space-2);
      flex-shrink: 0;
    }

    .item-card-time {
      font-size: var(--text-xs);
      color: var(--color-text-tertiary);
    }

    .item-card-chevron {
      color: var(--color-text-tertiary);
    }

    .item-card-chevron svg {
      width: 16px;
      height: 16px;
    }

    /* ── Bottom Tab Bar ── */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      height: 56px;
      padding-bottom: env(safe-area-inset-bottom, 16px);
      background-color: var(--color-surface);
      border-top: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 1000;
      box-shadow: var(--shadow-md);
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      flex: 1;
      height: 100%;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .tab-item .tab-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-tertiary);
      transition: color 0.2s ease;
    }

    .tab-item .tab-icon svg {
      width: 24px;
      height: 24px;
    }

    .tab-item .tab-label {
      font-size: var(--text-xs);
      line-height: var(--text-xs-lh);
      color: var(--color-text-tertiary);
      font-weight: var(--font-weight-regular);
      transition: color 0.2s ease, font-weight 0.2s ease;
    }

    .tab-item[data-active="true"] .tab-icon {
      color: var(--color-primary);
    }

    .tab-item[data-active="true"] .tab-label {
      color: var(--color-primary);
      font-weight: var(--font-weight-semibold);
    }

    /* ── 空状态提示（最近添加列表为空时） ── */
    .item-list-empty {
      text-align: center;
      padding: var(--space-8) var(--space-4);
      color: var(--color-text-tertiary);
      font-size: var(--text-sm);
    }
  </style>

  <script>
    (function () {
      'use strict';

      // ── 相对时间格式化 ──
      // 输入 ISO 字符串，输出形如"刚刚 / 3分钟前 / 2小时前 / 昨天 / 3天前 / X月X日"
      function formatRelativeTime(isoString) {
        if (!isoString) return '';
        var then = new Date(isoString);
        if (isNaN(then.getTime())) return '';
        var diffMs = new Date().getTime() - then.getTime();
        if (diffMs < 0) diffMs = 0;
        var diffSec = Math.floor(diffMs / 1000);
        var diffMin = Math.floor(diffSec / 60);
        var diffHour = Math.floor(diffMin / 60);
        var diffDay = Math.floor(diffHour / 24);

        if (diffSec < 60) return '刚刚';
        if (diffMin < 60) return diffMin + '分钟前';
        if (diffHour < 24) return diffHour + '小时前';
        if (diffDay < 2) return '昨天';
        if (diffDay < 7) return diffDay + '天前';
        // 超过一周，回退到具体日期
        return (then.getMonth() + 1) + '月' + then.getDate() + '日';
      }

      // ── HTML 转义，避免物品名称/标签等用户数据注入 ──
      function escapeHtml(s) {
        if (s == null) return '';
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // ── 标签颜色循环：复用现有 tag-blue / tag-pink / tag-teal ──
      var TAG_CLASSES = ['tag-blue', 'tag-pink', 'tag-teal'];
      function tagClass(index) {
        return TAG_CLASSES[index % TAG_CLASSES.length];
      }

      // ── 涟漪效果（与 app.js 的 attachRipple 行为一致） ──
      function createRipple(card, e) {
        var rect = card.getBoundingClientRect();
        var size = Math.max(rect.width, rect.height);
        var x = (e.clientX || (rect.left + rect.width / 2)) - rect.left - size / 2;
        var y = (e.clientY || (rect.top + rect.height / 2)) - rect.top - size / 2;
        var ripple = document.createElement('span');
        ripple.className = 'ripple-effect';
        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = x + 'px';
        ripple.style.top = y + 'px';
        card.appendChild(ripple);
        setTimeout(function () { if (ripple.parentNode) ripple.remove(); }, 600);
      }

      // ── 渲染单个物品卡片 ──
      function renderItemCard(item) {
        var path = GuiweiStore.resolveItemPath(item.id);
        var locationText = path ? GuiweiStore.pathLabel(path) : '位置未知';
        var timeText = formatRelativeTime(item.createdAt);

        var tags = Array.isArray(item.tags) ? item.tags : [];
        var tagsHtml = '';
        tags.forEach(function (t, i) {
          tagsHtml += '<span class="item-tag ' + tagClass(i) + '">' + escapeHtml(t) + '</span>';
        });

        var card = document.createElement('div');
        card.className = 'item-card';
        card.setAttribute('data-item-id', item.id);
        card.setAttribute('tabindex', '0');
        card.innerHTML =
          '<div class="item-card-info">' +
            '<div class="item-card-name">' + escapeHtml(item.name) + '</div>' +
            '<div class="item-card-location">' + escapeHtml(locationText) + '</div>' +
            '<div class="item-card-tags">' + tagsHtml + '</div>' +
          '</div>' +
          '<div class="item-card-meta">' +
            '<span class="item-card-time">' + escapeHtml(timeText) + '</span>' +
            '<span class="item-card-chevron">' +
              '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" ' +
              'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
              '<polyline points="9 18 15 12 9 6"/>' +
              '</svg>' +
            '</span>' +
          '</div>';
        return card;
      }

      // ── 渲染空状态 ──
      function renderEmptyState(container) {
        var empty = document.createElement('div');
        empty.className = 'item-list-empty';
        empty.textContent = '还没有任何物品，点击下方添加';
        container.appendChild(empty);
      }

      // ── 初始化：从 store 加载最近添加的物品 ──
      function init() {
        var listEl = document.getElementById('recent-items-list');
        if (!listEl || !window.GuiweiStore) return;

        // 注意：不预填任何数据。localStorage 为空时 listRecentAdded 返回空数组，
        // 此时显示空状态。不主动调用 seedDemoData()。
        var items = GuiweiStore.listRecentAdded(4);

        if (!items || items.length === 0) {
          renderEmptyState(listEl);
          return;
        }

        var fragment = document.createDocumentFragment();
        items.forEach(function (item) {
          fragment.appendChild(renderItemCard(item));
        });
        listEl.appendChild(fragment);

        // 事件委托（capture 阶段）：点击卡片 → 跳转到详情页并携带物品 id。
        // 使用 capture + stopPropagation 拦截 app.js 后续给 .item-card 绑定的
        // navigate('item-detail')（不带 id），确保跳转 URL 包含 ?id=<itemId>。
        listEl.addEventListener('click', function (e) {
          var card = e.target.closest('.item-card');
          if (!card) return;
          var itemId = card.getAttribute('data-item-id');
          if (!itemId) return;
          createRipple(card, e);
          e.stopPropagation();
          window.location.href = 'item-detail.html?id=' + encodeURIComponent(itemId);
        }, true);
      }

      // 容器 #recent-items-list 已在本 <script> 之前的 HTML 中解析完成，
      // 可直接初始化；同时兼容脚本被延迟执行的情况。
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
  <script src="../assets/app.js"></script>
</body>
</html>
