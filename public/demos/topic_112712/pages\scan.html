  --color-bg: #FAFAFA;

  --color-bg-sunken: #F3F4F6;

  --shadow-lg: 0 4px 16px 0 rgba(0, 0, 0, 0.05);
  --shadow-float: 0 8px 24px 0 rgba(0, 0, 0, 0.08);
}

/* Dark mode */
.dark {
  --color-bg: #111827;
  --color-bg-elevated: #1F2937;
  --color-bg-sunken: #0F172A;
  --color-surface: #1F2937;
  --color-surface-dim: #374151;

  --color-border: #374151;
  --color-border-light: #1F2937;

}

    <style>
      /* ── Scan Page: Immersive Dark Camera UI ── */

      /* Reset body background for this page */
      body {
        background: #0F0F1A;
        color: #FFFFFF;
      }

      .scan-page {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        max-width: 430px;
        margin: 0 auto;
        position: relative;
        background: #0F0F1A;
        overflow: hidden;
      }

      /* ── Top Bar ── */
      .scan-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        padding: 12px 16px;
        padding-top: calc(12px + env(safe-area-inset-top, 0px));
        position: relative;
        z-index: 10;
        background: linear-gradient(to bottom, rgba(15,15,26,0.9), rgba(15,15,26,0));
      }

      .scan-topbar-title {
        font-family: var(--font-sans);
        font-size: var(--text-lg);
        font-weight: var(--font-weight-semibold);
        color: #FFFFFF;
        letter-spacing: 0.02em;
      }

      .scan-topbar-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border: none;
        background: rgba(255,255,255,0.1);
        border-radius: 50%;
        cursor: pointer;
        transition: background 0.2s;
        -webkit-tap-highlight-color: transparent;
      }

      .scan-topbar-btn:hover {
        background: rgba(255,255,255,0.2);
      }

      .scan-flash-btn {
        appearance: none;
        outline: none;
      }

      /* ── Camera Viewfinder Area ── */
      .scan-camera-area {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        flex: 1 1 0;
        min-height: 0;
        position: relative;
        padding: 20px 0;
      }

      .scan-camera-bg {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, #1a1a2e 0%, #0F0F1A 70%);
        z-index: 0;
      }

      /* ── Scan Frame ── */
      .scan-frame {
        position: relative;
        width: 280px;
        height: 280px;
        border: 3px solid rgba(255, 255, 255, 0.25);
        border-radius: var(--radius-xl);
        z-index: 1;
        box-shadow:
          0 0 0 1px rgba(255,255,255,0.05),
          0 0 60px rgba(216, 27, 96, 0.08),
          0 0 120px rgba(216, 27, 96, 0.04);
        overflow: hidden;
      }

      /* Animated scan line */
      .scan-line {
        position: absolute;
        left: 8px;
        right: 8px;
        height: 3px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          var(--color-primary) 20%,
          var(--color-primary-light) 50%,
          var(--color-primary) 80%,
          transparent 100%
        );
        border-radius: 2px;
        box-shadow: 0 0 12px 2px rgba(216, 27, 96, 0.5);
        animation: scan-sweep 2.8s ease-in-out infinite;
        z-index: 2;
      }

      @keyframes scan-sweep {
        0%   { top: 8px;  opacity: 0; }
        5%   { opacity: 1; }
        95%  { opacity: 1; }
        100% { top: calc(100% - 11px); opacity: 0; }
      }

      /* Corner markers */
      .scan-corner {
        position: absolute;
        width: 28px;
        height: 28px;
        z-index: 3;
        pointer-events: none;
      }

      .scan-corner::before,
      .scan-corner::after {
        content: '';
        position: absolute;
        background: var(--color-primary);
        border-radius: 2px;
      }

      .scan-corner--tl {
        top: -3px;
        left: -3px;
      }
      .scan-corner--tl::before {
        width: 28px;
        height: 4px;
        top: 0;
        left: 0;
        border-radius: 2px 0 0 0;
      }
      .scan-corner--tl::after {
        width: 4px;
        height: 28px;
    top: 0;
    left: 0;
    border-radius: 2px 0 0 0;
  }

      .scan-corner--tr {
        top: -3px;
        right: -3px;
      }
      .scan-corner--tr::before {
        width: 28px;
        height: 4px;
        top: 0;
        right: 0;
        border-radius: 0 2px 0 0;
      }
      .scan-corner--tr::after {
        width: 4px;
        height: 28px;
    top: 0;
    right: 0;
    border-radius: 0 2px 0 0;
  }

      .scan-corner--bl {
        bottom: -3px;
        left: -3px;
      }
      .scan-corner--bl::before {
        width: 28px;
        height: 4px;
        bottom: 0;
        left: 0;
        border-radius: 0 0 0 2px;
      }
      .scan-corner--bl::after {
        width: 4px;
        height: 28px;
    bottom: 0;
    left: 0;
    border-radius: 0 0 0 2px;
  }

      .scan-corner--br {
        bottom: -3px;
        right: -3px;
      }
      .scan-corner--br::before {
        width: 28px;
        height: 4px;
        bottom: 0;
        right: 0;
        border-radius: 0 0 2px 0;
      }
      .scan-corner--br::after {
        width: 4px;
        height: 28px;
    bottom: 0;
    right: 0;
    border-radius: 0 0 2px 0;
      }

      /* ── Instruction Text ── */
      .scan-instruction {
        text-align: center;
        padding: 0 16px;
        margin-bottom: 24px;
        z-index: 1;
      }

      .scan-instruction-main {
        font-family: var(--font-sans);
        font-size: var(--text-base);
        font-weight: var(--font-weight-medium);
        color: #FFFFFF;
        margin-bottom: 4px;
      }

      .scan-instruction-sub {
        font-family: var(--font-sans);
        font-size: var(--text-sm);
        color: rgba(255, 255, 255, 0.5);
      }

      /* ── Action Bar ── */
      .scan-actions {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 0 32px;
        margin-bottom: 32px;
        z-index: 1;
      }

      .scan-action-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 24px;
        border: 1.5px solid rgba(255, 255, 255, 0.4);
        border-radius: var(--radius-full);
        background: rgba(255, 255, 255, 0.06);
        color: #FFFFFF;
        font-family: var(--font-sans);
        font-size: var(--text-sm);
        font-weight: var(--font-weight-medium);
        cursor: pointer;
        transition: all 0.2s;
        -webkit-tap-highlight-color: transparent;
        appearance: none;
        outline: none;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }

      .scan-action-btn:hover {
        border-color: rgba(255, 255, 255, 0.6);
        background: rgba(255, 255, 255, 0.12);
      }

      .scan-action-btn:active {
        transform: scale(0.96);
      }

      /* ── Home Indicator ── */
      .scan-home-indicator {
        display: flex;
        justify-content: center;
        padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
        z-index: 1;
      }

      .scan-home-indicator a {
        text-decoration: none;
      }

      .scan-home-pill {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 32px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        transition: background 0.2s;
      }

      .scan-home-pill:hover {
        background: rgba(255, 255, 255, 0.15);
      }

      /* ── Manual Input Panel ── */
      .scan-input-panel {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
        max-width: 360px;
        padding: 0 20px;
        margin-bottom: 24px;
        z-index: 5;
        animation: scan-fade-in 0.25s ease;
      }

      @keyframes scan-fade-in {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .scan-input {
        width: 100%;
        padding: 12px 16px;
        border: 1.5px solid rgba(255, 255, 255, 0.3);
        border-radius: var(--radius-md);
        background: rgba(255, 255, 255, 0.08);
        color: #FFFFFF;
        font-family: var(--font-sans);
        font-size: var(--text-base);
        outline: none;
        box-sizing: border-box;
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        -webkit-appearance: none;
        appearance: none;
      }

      .scan-input::placeholder {
        color: rgba(255, 255, 255, 0.4);
      }

      .scan-input:focus {
        border-color: var(--color-primary-light);
        background: rgba(255, 255, 255, 0.12);
      }

      .scan-resolve-btn {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: var(--radius-md);
        background: var(--color-primary);
        color: #FFFFFF;
        font-family: var(--font-sans);
        font-size: var(--text-base);
        font-weight: var(--font-weight-semibold);
        cursor: pointer;
        transition: all 0.2s;
        -webkit-tap-highlight-color: transparent;
        appearance: none;
        outline: none;
      }

      .scan-resolve-btn:hover {
        background: var(--color-primary-light);
      }

      .scan-resolve-btn:active {
        transform: scale(0.97);
      }

      /* ── Result / Error Area ── */
      .scan-result {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        width: 100%;
        max-width: 340px;
        padding: 20px;
        margin: 0 20px 24px;
        border-radius: var(--radius-lg);
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.15);
        z-index: 5;
        animation: scan-fade-in 0.25s ease;
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        box-sizing: border-box;
      }

      .scan-result--error {
        border-color: rgba(239, 68, 68, 0.4);
        background: rgba(239, 68, 68, 0.1);
      }

      .scan-result--warning {
        border-color: rgba(245, 158, 11, 0.4);
        background: rgba(245, 158, 11, 0.1);
      }

      .scan-result-icon {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .scan-result--error .scan-result-icon {
        background: rgba(239, 68, 68, 0.2);
        color: #FCA5A5;
      }

      .scan-result--warning .scan-result-icon {
        background: rgba(245, 158, 11, 0.2);
        color: #FCD34D;
      }

      .scan-result-msg {
        font-family: var(--font-sans);
        font-size: var(--text-base);
        color: #FFFFFF;
        text-align: center;
        margin: 0;
        word-break: break-all;
      }

      .scan-result-btn {
        padding: 8px 24px;
        border: 1.5px solid rgba(255, 255, 255, 0.4);
        border-radius: var(--radius-full);
        background: rgba(255, 255, 255, 0.08);
        color: #FFFFFF;
        font-family: var(--font-sans);
        font-size: var(--text-sm);
        font-weight: var(--font-weight-medium);
        cursor: pointer;
        text-decoration: none;
        transition: all 0.2s;
        -webkit-tap-highlight-color: transparent;
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
      }

      .scan-result-btn:hover {
        border-color: rgba(255, 255, 255, 0.6);
        background: rgba(255, 255, 255, 0.15);
      }

      .scan-result-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .scan-result-btn--rescan {
        background: var(--color-primary);
        border-color: var(--color-primary);
      }

      .scan-result-btn--rescan:hover {
        background: var(--color-primary-light);
        border-color: var(--color-primary-light);
      }
    </style>

    <script>
    /* ── 扫码页：payload 解析与跳转逻辑 ── */
    (function () {
      'use strict';

      // ── URL 参数与返回地址解析 ──
      var params = new URLSearchParams(window.location.search);
      var presetPayload = params.get('payload');
      var rawReturnTo = params.get('returnTo');
      var mode = params.get('mode') || ''; // '' 默认 | 'location' 位置选择模式
      var returnTo;
      if (rawReturnTo === null) {
        // 未显式提供 returnTo：回退到 document.referrer（若存在且非 scan.html），否则 home.html
        returnTo = (document.referrer && document.referrer.indexOf('scan.html') === -1)
          ? document.referrer : 'home.html';
      } else if (rawReturnTo === '' || rawReturnTo === 'home') {
        returnTo = 'home.html';
      } else {
        returnTo = rawReturnTo;
      }

      // 详情页 returnTo：URL 预填模式下回链到 scan.html（保留原 returnTo 链），否则直接回到调用方
      var detailReturnTo;
      if (presetPayload) {
        detailReturnTo = 'scan.html?returnTo=' + encodeURIComponent(returnTo);
      } else {
        detailReturnTo = returnTo;
      }

      // 位置选择模式：从 form.html 跳过来，扫码识别 house/floor/room/container 后
      // 跳回 returnTo（form.html）并带 scanResultType / scanResultId
      var isLocationMode = mode === 'location';

      function getReturnUrl() {
        return returnTo;
      }

      // ── DOM 引用 ──
      var btnManual   = document.getElementById('btn-manual-input');
      var inputPanel  = document.getElementById('scan-input-panel');
      var payloadInput= document.getElementById('scan-payload-input');
      var resolveBtn  = document.getElementById('scan-resolve-btn');
      var resultBox   = document.getElementById('scan-result');
      var resultIcon  = document.getElementById('scan-result-icon');
      var resultMsg   = document.getElementById('scan-result-msg');
      var resultBtn   = document.getElementById('scan-result-btn');
      var navBackHome = document.querySelector('[data-dom-id="nav-back-home"]');
      var rescanBtn   = document.getElementById('scan-rescan-btn');

      // ── 切换手动输入面板 ──
      if (btnManual) {
        btnManual.addEventListener('click', function () {
          var isOpen = inputPanel.style.display !== 'none';
          inputPanel.style.display = isOpen ? 'none' : 'flex';
          if (!isOpen) {
            // 打开时隐藏旧结果，聚焦输入框
            resultBox.style.display = 'none';
            setTimeout(function () { payloadInput.focus(); }, 0);
          }
        });
      }

      // ── 顶部返回按钮：回到调用 scan.html 之前的页面 ──
      if (navBackHome) {
        navBackHome.addEventListener('click', function (e) {
          e.preventDefault();
          window.location.href = returnTo;
        });
      }

      // ── 重新扫描按钮：清空结果区与输入框，回到扫描状态 ──
      if (rescanBtn) {
        rescanBtn.addEventListener('click', function () {
          resultBox.style.display = 'none';
          payloadInput.value = '';
          inputPanel.style.display = 'flex';
          setTimeout(function () { payloadInput.focus(); }, 0);
        });
      }

      // ── 根据解析结果构建跳转 URL ──
      function buildRedirectUrl(result) {
        var ownerId = result.ownerId;
        var type    = result.ownerType;

        if (type === 'house') {
          return 'hierarchy.html?houseId=' + encodeURIComponent(ownerId);
        }
        if (type === 'floor') {
          var floor = GuiweiStore.getFloor(ownerId);
          if (!floor) return null;
          return 'hierarchy.html?houseId=' + encodeURIComponent(floor.houseId) +
                 '&floorId=' + encodeURIComponent(ownerId);
        }
        if (type === 'room') {
          var room = GuiweiStore.getRoom(ownerId);
          if (!room) return null;
          var parentFloor = GuiweiStore.getFloor(room.floorId);
          if (!parentFloor) return null;
          return 'hierarchy.html?houseId=' + encodeURIComponent(parentFloor.houseId) +
                 '&floorId=' + encodeURIComponent(room.floorId) +
                 '&roomId=' + encodeURIComponent(ownerId);
        }
        if (type === 'container') {
          var container = GuiweiStore.getContainer(ownerId);
          if (!container) return null;
          var parentRoom = GuiweiStore.getRoom(container.roomId);
          if (!parentRoom) return null;
          var pf = GuiweiStore.getFloor(parentRoom.floorId);
          if (!pf) return null;
          return 'hierarchy.html?houseId=' + encodeURIComponent(pf.houseId) +
                 '&floorId=' + encodeURIComponent(parentRoom.floorId) +
                 '&roomId=' + encodeURIComponent(container.roomId) +
                 '&containerId=' + encodeURIComponent(ownerId);
        }
        if (type === 'item') {
          return 'item-detail.html?id=' + encodeURIComponent(ownerId);
        }
        return null;
      }

      // ── 显示错误 ──
      function showError(msg) {
        resultBox.style.display = 'flex';
        resultBox.className = 'scan-result scan-result--error';
        resultIcon.innerHTML = '<i data-lucide="alert-circle" style="width:22px;height:22px;color:#FCA5A5;"></i>';
        resultMsg.textContent = msg;
        resultBtn.textContent = '返回';
        resultBtn.href = getReturnUrl();
        if (window.lucide && window.lucide.createIcons) window.lucide.createIcons();
      }

      // ── 显示警告（已删除） ──
      function showWarning(msg) {
        resultBox.style.display = 'flex';
        resultBox.className = 'scan-result scan-result--warning';
        resultIcon.innerHTML = '<i data-lucide="alert-triangle" style="width:22px;height:22px;color:#FCD34D;"></i>';
        resultMsg.textContent = msg;
        resultBtn.textContent = '返回';
        resultBtn.href = getReturnUrl();
        if (window.lucide && window.lucide.createIcons) window.lucide.createIcons();
      }

      // ── 解析 payload ──
      function resolvePayload(payload) {
        var value = (payload || '').trim();
        if (!value) {
          showError('请输入 payload');
          return;
        }
        var result = GuiweiStore.lookupByPayload(value);
        if (!result.hit) {
          showError('未识别的码：' + value);
          return;
        }
        if (result.ownerDeleted) {
          showWarning('该实体已删除');
          return;
        }

        // 位置选择模式：识别到 house/floor/room/container 后跳回 form.html 带 scanResult 参数
        if (isLocationMode && (result.ownerType === 'house' || result.ownerType === 'floor' ||
            result.ownerType === 'room' || result.ownerType === 'container')) {
          var sep = returnTo.indexOf('?') !== -1 ? '&' : '?';
          window.location.href = returnTo + sep +
            'scanResultType=' + encodeURIComponent(result.ownerType) +
            '&scanResultId=' + encodeURIComponent(result.ownerId);
          return;
        }

        var url = buildRedirectUrl(result);
        if (url) {
          // 如果 returnTo 有效（非 home.html 且非 scan.html），将其作为详情页的返回入口
          if (returnTo && returnTo !== 'home.html' && returnTo.indexOf('scan.html') === -1) {
            var sep2 = url.indexOf('?') !== -1 ? '&' : '?';
            url = url + sep2 + 'returnTo=' + encodeURIComponent(detailReturnTo);
          }
          window.location.href = url;
        } else {
          showError('无法解析该实体类型');
        }
      }

      // ── 解析按钮点击 ──
      if (resolveBtn) {
        resolveBtn.addEventListener('click', function () {
          resolvePayload(payloadInput.value);
        });
      }

      // ── 回车提交 ──
      if (payloadInput) {
        payloadInput.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            resolvePayload(payloadInput.value);
          }
        });
      }

      // ── URL 查询参数预填：?payload=xxx ──
      try {
        if (presetPayload) {
          payloadInput.value = presetPayload;
          inputPanel.style.display = 'flex';
          resolvePayload(presetPayload);
        }
      } catch (e) {
        // 预填失败时静默处理
      }
    })();
    </script>
</body>
</html>
