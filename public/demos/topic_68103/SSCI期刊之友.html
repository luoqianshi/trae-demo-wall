    content += '<button class="review-filter-btn' + (currentReviewFilter === '返修后拒稿' ? ' active' : '') + '" onclick="filterReviews(\'返修后拒稿\', this)">返修后拒稿<span class="count">(' + stats.reviseReject + ')</span></button>';
    content += '</div>';
  }

  content += '<div id="reviewListContainer">';
  if (j.reviews.length > 0) {
    var filteredReviews = j.reviews;
    if (currentReviewFilter !== 'all') {
      filteredReviews = j.reviews.filter(function(r) { return r.result === currentReviewFilter; });
    }
    if (filteredReviews.length === 0) {
      content += '<div class="empty-state" style="padding:20px 0"><p>暂无该类型的评价</p></div>';
    } else {
      filteredReviews.forEach(function(r) {
        content += '<div class="review-card">';
        content += '<div class="review-header"><span class="review-user">' + r.user + '</span>';
        if (r.verified) content += '<span class="review-verified">认证用户</span>';
        content += '</div>';
        content += '<div class="review-timeline">';
        content += '投稿 ' + r.submitDate;
        if (r.firstResponse) content += ' -> 一审 ' + r.firstResponse + ' (' + calcDays(r.submitDate, r.firstResponse) + '天)';
        if (r.revisions !== undefined) content += ' -> 返修 ' + r.revisions + '次';
        if (r.finalDate) content += ' -> <strong>录用</strong> ' + r.finalDate + '（共' + calcDays(r.submitDate, r.finalDate) + '天）';
        if (r.rejectDate) content += ' -> <strong>返修后拒稿</strong> ' + r.rejectDate + '（共' + calcDays(r.submitDate, r.rejectDate) + '天）';
        if (r.deskRejectDate) content += ' -> <strong>桌拒</strong> ' + r.deskRejectDate + '（共' + calcDays(r.submitDate, r.deskRejectDate) + '天）';
        content += '</div>';
        content += '<div class="review-scores">';
        if (r.difficulty) content += '<span class="score-item"><span class="label">主观难度</span> <span class="val">' + r.difficulty + '/5</span></span>';
        if (r.reviewQuality) content += '<span class="score-item"><span class="label">外审专业</span> <span class="val">' + r.reviewQuality + '/5</span></span>';
        if (r.editorQuality) content += '<span class="score-item"><span class="label">编辑专业</span> <span class="val">' + r.editorQuality + '/5</span></span>';
        if (r.communication) content += '<span class="score-item"><span class="label">沟通体验</span> <span class="val">' + r.communication + '/5</span></span>';
        if (r.rejectReason) content += '<span class="score-item"><span class="label">拒稿原因</span> <span class="val">' + r.rejectReason + '</span></span>';
        content += '</div>';
        content += '<div class="review-text">' + esc(r.text) + '</div>';
        content += '</div>';
      });
    }
  }
  content += '</div>';

  content += '<div style="padding:16px 0">';
  content += '<button class="btn-primary" onclick="openSubmitForm()">提交我的投稿评价</button>';
  content += '</div>';

  content += '</div>';

  document.getElementById('detailContent').innerHTML = content;
  showPage('page-detail');
}

function buildStars(key, label) {
  var html = '<div class="score-input-group"><label>' + label + '</label><div class="score-stars" id="stars_' + key + '">';
  for (var i = 1; i <= 5; i++) {
    html += '<span data-key="' + key + '" data-val="' + i + '" onclick="setScore(this)">&#x2605;</span>';
  }
  html += '</div></div>';
  return html;
}

function setScore(el) {
  var key = el.getAttribute('data-key');
  var val = parseInt(el.getAttribute('data-val'));
  formScores[key] = val;
  var container = document.getElementById('stars_' + key);
  container.querySelectorAll('span').forEach(function(s) {
    s.classList.toggle('active', parseInt(s.getAttribute('data-val')) <= val);
  });
}

function submitReview() {
  var result = document.getElementById('f_result').value;
  if (!result) { showToast('请选择结果'); return; }

  var sd = document.getElementById('f_submitDate').value;
  if (!sd) { showToast('请填写投稿日期'); return; }

  var review = {
    user: '当前用户',
    verified: false,
    school: '',
    result: result,
    submitDate: sd,
    text: document.getElementById('f_text').value || '（未填写心得）'
  };

  if (result === '录用') {
    var fr = document.getElementById('f_firstResponse').value;
    var fd = document.getElementById('f_finalDate').value;
    var reviewers = document.getElementById('f_reviewers').value;
    var revisions = document.getElementById('f_revisions').value;
    if (!fr || !fd || !reviewers || revisions === '') { showToast('请填写所有必填项'); return; }
    if (formScores.difficulty === 0 || formScores.reviewQuality === 0 || formScores.editorQuality === 0 || formScores.communication === 0) { showToast('请完成所有评分'); return; }
    review.firstResponse = fr;
    review.finalDate = fd;
    review.reviewers = parseInt(reviewers);
    review.revisions = parseInt(revisions);
    review.difficulty = formScores.difficulty;
    review.reviewQuality = formScores.reviewQuality;
    review.editorQuality = formScores.editorQuality;
    review.communication = formScores.communication;
  } else if (result === '桌拒') {
    var dd = document.getElementById('f_deskRejectDate').value;
    var reason = document.getElementById('f_rejectReason').value;
    if (!dd || !reason) { showToast('请填写所有必填项'); return; }
    review.deskRejectDate = dd;
    review.rejectReason = reason;
  } else if (result === '返修后拒稿') {
    var fr2 = document.getElementById('f_firstResponse').value;
    var rd = document.getElementById('f_rejectDate').value;
    var reviewers2 = document.getElementById('f_reviewers').value;
    var reason2 = document.getElementById('f_rejectReason').value;
    if (!fr2 || !rd || !reviewers2 || !reason2) { showToast('请填写所有必填项'); return; }
    if (formScores.difficulty === 0 || formScores.reviewQuality === 0 || formScores.editorQuality === 0 || formScores.communication === 0) { showToast('请完成所有评分'); return; }
    review.firstResponse = fr2;
    review.rejectDate = rd;
    review.reviewers = parseInt(reviewers2);
    review.rejectReason = reason2;
    review.difficulty = formScores.difficulty;
    review.reviewQuality = formScores.reviewQuality;
    review.editorQuality = formScores.editorQuality;
    review.communication = formScores.communication;
  }

  currentJournal.reviews.push(review);
  showToast('评价提交成功！');
  setTimeout(function() { openDetail(currentJournal.id); }, 500);
}

// ===================== COMPARE (院校List) =====================
var schoolMode = 'single';
var compareSchools = [];
var MAX_SCHOOL_COMPARE = 5;

function getAllSchools() {
  var schoolMap = {};
  journals.forEach(function(j) {
    j.schools.forEach(function(s) {
      if (!schoolMap[s.name]) {
        schoolMap[s.name] = { name: s.name, count: 0 };
      }
      schoolMap[s.name].count++;
    });
  });
  return Object.values(schoolMap).sort(function(a, b) { return b.count - a.count; });
}

function switchSchoolMode(mode, btn) {
  schoolMode = mode;
  document.querySelectorAll('.school-mode-btn').forEach(function(b) { b.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  document.getElementById('schoolSingleMode').style.display = mode === 'single' ? 'block' : 'none';
  document.getElementById('schoolCompareMode').style.display = mode === 'compare' ? 'block' : 'none';
  if (mode === 'single') {
    runCompare();
  } else {
    renderSchoolCompare();
  }
}

function initCompare() {
  var sel = document.getElementById('compareSchool');
  if (sel.options.length <= 1) {
    var schools = getAllSchools();
    schools.forEach(function(s) {
      var opt = document.createElement('option');
      opt.value = s.name;
      opt.textContent = s.name + '（' + s.count + '本）';
      sel.appendChild(opt);
    });
  }
  if (schoolMode === 'compare') {
    renderSchoolCompare();
  } else {
    runCompare();
  }
}

function onSchoolSearch() {
  var query = document.getElementById('schoolSearchInput').value.trim().toLowerCase();
  var listEl = document.getElementById('schoolSelectList');
  var schools = getAllSchools();
  
  if (!query) {
    listEl.style.display = 'none';
    return;
  }
  
  var filtered = schools.filter(function(s) {
    return s.name.toLowerCase().indexOf(query) > -1;
  });
  
  if (filtered.length === 0) {
    listEl.innerHTML = '<div class="school-select-item"><span class="school-name" style="color:var(--muted)">未找到匹配的学校</span></div>';
  } else {
    var html = '';
    filtered.forEach(function(s) {
      html += '<div class="school-select-item" onclick="selectSchool(\'' + s.name.replace(/'/g, "\\'") + '\')">';
      html += '<span class="school-name">' + s.name + '</span>';
      html += '<span class="school-count">' + s.count + '本期刊</span>';
      html += '</div>';
    });
    listEl.innerHTML = html;
  }
  listEl.style.display = 'block';
}

function selectSchool(name) {
  document.getElementById('schoolSearchInput').value = name;
  document.getElementById('schoolSelectList').style.display = 'none';
  document.getElementById('compareSchool').value = name;
  onSchoolChange();
}

function onSchoolChange() {
  var school = document.getElementById('compareSchool').value;
  var gradeSel = document.getElementById('compareGrade');
  gradeSel.innerHTML = '<option value="">全部等级</option>';
  if (school) {
    var grades = {};
    journals.forEach(function(j) {
      var match = j.schools.find(function(s) { return s.name === school; });
      if (match && match.grade) grades[match.grade] = true;
    });
    Object.keys(grades).sort(function(a,b) { return gradeWeight(b) - gradeWeight(a); }).forEach(function(g) {
      var opt = document.createElement('option');
      opt.value = g;
      opt.textContent = g;
      gradeSel.appendChild(opt);
    });
  }
  runCompare();
}

function runCompare() {
  var school = document.getElementById('compareSchool').value;
  var grade = document.getElementById('compareGrade').value;
  var results = [];

  if (school) {
    journals.forEach(function(j) {
      var match = j.schools.find(function(s) { return s.name === school; });
      if (match) {
        if (!grade || match.grade === grade) {
          results.push({ journal: j, grade: match.grade });
        }
      }
    });
  }

  document.getElementById('compareCount').textContent = school ? '共 ' + results.length + ' 本期刊' : '选择学校后查看结果';

  var html = '';
  if (results.length === 0 && school) {
    html = '<div class="empty-state"><p>-- 该学校目录下暂无匹配期刊 --</p></div>';
  }
  results.sort(function(a, b) {
    return gradeWeight(b.grade) - gradeWeight(a.grade);
  });
  results.forEach(function(r) {
    html += '<div class="compare-card" onclick="openDetail(' + r.journal.id + ')">';
    html += '<div class="jc-name">' + r.journal.name + '</div>';
    html += '<div class="jc-badges" style="margin-top:6px">';
    html += '<span class="badge badge-abs">ABS ' + (r.journal.abs === 4 ? '4*' : r.journal.abs) + '</span>';
    html += '<span class="badge badge-jcr">JCR ' + r.journal.jcr + '</span>';
    html += '<span class="badge badge-jif">JIF ' + r.journal.jif + '</span>';
    html += '<span class="badge badge-school">' + school.split(' ')[0] + ' ' + r.grade + '</span>';
    html += '</div>';
    html += '<div class="jc-meta" style="margin-top:6px">';
    html += '<span>年发文 ' + r.journal.articles2024 + '（' + r.journal.frequency + '）</span>';
    html += '<span>' + r.journal.firstDecision + '天</span>';
    html += '</div></div>';
  });
  document.getElementById('compareResults').innerHTML = html;
}

// ===================== SCHOOL COMPARE MODE =====================
function onSchoolCompareSearch() {
  var query = document.getElementById('schoolCompareSearch').value.trim().toLowerCase();
  var listEl = document.getElementById('schoolCompareList');
  var schools = getAllSchools();
  
  if (!query) {
    listEl.style.display = 'none';
    return;
  }
  
  var filtered = schools.filter(function(s) {
    return s.name.toLowerCase().indexOf(query) > -1 && !compareSchools.includes(s.name);
  });
  
  if (filtered.length === 0) {
    listEl.innerHTML = '<div class="school-select-item"><span class="school-name" style="color:var(--muted)">未找到匹配的学校</span></div>';
  } else {
    var html = '';
    filtered.slice(0, 8).forEach(function(s) {
      html += '<div class="school-select-item" onclick="addSchoolToCompare(\'' + s.name.replace(/'/g, "\\'") + '\')">';
      html += '<span class="school-name">' + s.name + '</span>';
      html += '<span class="school-count">+ 添加对比</span>';
      html += '</div>';
    });
    listEl.innerHTML = html;
  }
  listEl.style.display = 'block';
}

function addSchoolToCompare(name) {
  if (compareSchools.length >= MAX_SCHOOL_COMPARE) {
    showToast('最多对比 ' + MAX_SCHOOL_COMPARE + ' 所学校');
    return;
  }
  if (!compareSchools.includes(name)) {
    compareSchools.push(name);
  }
  document.getElementById('schoolCompareSearch').value = '';
  document.getElementById('schoolCompareList').style.display = 'none';
  renderSchoolCompare();
}

function removeSchoolFromCompare(name) {
  var idx = compareSchools.indexOf(name);
  if (idx > -1) {
    compareSchools.splice(idx, 1);
  }
  renderSchoolCompare();
}

function renderSchoolCompare() {
  var chipsEl = document.getElementById('schoolCompareChips');
  var resultsEl = document.getElementById('compareResults');
  var countEl = document.getElementById('compareCount');
  
  // Render chips
  var chipsHtml = '';
  compareSchools.forEach(function(s) {
    chipsHtml += '<span class="school-compare-chip">' + s.split(' ')[0] + '<span class="remove" onclick="removeSchoolFromCompare(\'' + s.replace(/'/g, "\\'") + '\')">&times;</span></span>';
  });
  chipsEl.innerHTML = chipsHtml;
  
  if (compareSchools.length < 2) {
    countEl.textContent = '请选择至少2所学校进行对比';
    resultsEl.innerHTML = '<div class="empty-state"><p>-- 请在上方搜索并添加学校 --</p><p class="empty-hint">支持最多5所学校同时对比</p></div>';
    return;
  }
  
  countEl.textContent = '对比 ' + compareSchools.length + ' 所学校，覆盖多本期刊';
  
  // Build comparison table - journals as rows, schools as columns
  var journalSet = {};
  journals.forEach(function(j) {
    var hasMatch = j.schools.some(function(s) { return compareSchools.includes(s.name); });
    if (hasMatch) {
      journalSet[j.id] = j;
    }
  });
  
  var compareJournals = Object.values(journalSet).sort(function(a, b) {
    // Sort by highest grade across selected schools
    var aMax = 0, bMax = 0;
    a.schools.forEach(function(s) {
      if (compareSchools.includes(s.name)) aMax = Math.max(aMax, gradeWeight(s.grade));
    });
    b.schools.forEach(function(s) {
      if (compareSchools.includes(s.name)) bMax = Math.max(bMax, gradeWeight(s.grade));
    });
    return bMax - aMax;
  });
  
  var html = '<div class="school-compare-table-wrap"><table class="school-compare-table"><thead><tr><th>期刊名称</th>';
  compareSchools.forEach(function(s) {
    html += '<th>' + s.split(' ')[0] + '</th>';
  });
  html += '<th>影响因子</th><th>JCR</th></tr></thead><tbody>';
  
  compareJournals.forEach(function(j) {
    html += '<tr style="cursor:pointer" onclick="openDetail(' + j.id + ')">';
    html += '<td>' + j.name + '</td>';
    compareSchools.forEach(function(s) {
      var match = j.schools.find(function(sc) { return sc.name === s; });
      if (match) {
        var w = gradeWeight(match.grade);
        var cls = w >= 90 ? 'grade-high' : (w >= 70 ? 'grade-mid' : 'grade-low');
        html += '<td class="' + cls + '">' + match.grade + '</td>';
      } else {
        html += '<td style="color:var(--muted)">-</td>';
      }
    });
    html += '<td>JIF ' + j.jif + '</td>';
    html += '<td>' + j.jcr + '</td>';
    html += '</tr>';
  });
  
  html += '</tbody></table></div>';
  resultsEl.innerHTML = html;
}

// ===================== FRIENDLY RANKING =====================
function switchMonth(month, btn) {
  currentMonth = month;
  document.querySelectorAll('.month-btn').forEach(function(b) { b.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  renderFriendly();
}

function switchSort(sortKey, btn) {
  currentSort = sortKey;
  document.querySelectorAll('.sort-btn').forEach(function(b) { b.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  renderFriendly();
}

var currentRankingDiscipline = 'all';
function renderRankingDisciplineFilter() {
  var container = document.getElementById('rankingDisciplineFilter');
  if (!container) return;
  var html = '';
  disciplineList.forEach(function(d) {
    html += '<div class="discipline-tag' + (currentRankingDiscipline === d.key ? ' active' : '') + '" onclick="setRankingDiscipline(\'' + d.key + '\')">' + d.name + '</div>';
  });
  container.innerHTML = html;
}

function setRankingDiscipline(key) {
  currentRankingDiscipline = key;
  renderRankingDisciplineFilter();
  renderFriendly();
}

function renderFriendly() {
  var scored = journals.filter(function(j) {
    if (currentRankingDiscipline !== 'all') {
      if (!j.discipline || !j.discipline.includes(currentRankingDiscipline)) return false;
    }
    return j.reviews.length > 10 && !j.onHold;
  }).map(function(j) {
    var scores = calcFriendlyScores(j);
    return { journal: j, scores: scores };
  });

  scored.sort(function(a, b) { return b.scores[currentSort] - a.scores[currentSort]; });

  var prevMonth = '';
  if (currentMonth === '2026-06') prevMonth = '2026-05';
  else if (currentMonth === '2026-05') prevMonth = '2026-04';

  var prevRanks = {};
  if (prevMonth && historicalRanks[prevMonth]) {
    prevRanks = historicalRanks[prevMonth];
  }

  var html = '';
  if (scored.length === 0) {
    html = '<div class="empty-state"><p>-- 暂无足够数据生成榜单（需累计评价大于10条） --</p></div>';
  }

  var sortLabels = {
    overall: '综合友好度',
    speed: '处理速度',
    review: '外审专业度',
    editor: '编辑专业度',
    communication: '沟通体验',
    difficulty: '主观难度'
  };

  scored.forEach(function(item, idx) {
    var j = item.journal;
    var s = item.scores;
    var currentRank = idx + 1;

    var changeHtml = '';
    var prevRank = prevRanks[j.id];
    if (!prevRank) {
      changeHtml = '<span class="rank-change new-tag">NEW</span>';
    } else if (prevRank === currentRank) {
      changeHtml = '<span class="rank-change same-tag">-</span>';
    } else if (prevRank > currentRank) {
      changeHtml = '<span class="rank-change up-tag">\u25B2' + (prevRank - currentRank) + '</span>';
    } else {
      changeHtml = '<span class="rank-change down-tag">\u25BC' + (currentRank - prevRank) + '</span>';
    }

    var rankClass = '';
    if (currentRank === 1) rankClass = 'top1';
    else if (currentRank === 2) rankClass = 'top2';
    else if (currentRank === 3) rankClass = 'top3';

    var kwHtml = '';
    if (j.keywords && j.keywords.length) {
      j.keywords.forEach(function(k) {
        kwHtml += '<span class="rank-keyword-tag">' + k + '</span>';
      });
    }

    var discHtml = '';
    if (j.discipline && j.discipline.length) {
      j.discipline.forEach(function(d) {
        discHtml += '<span class="badge badge-discipline" style="font-size:10px;padding:2px 6px">' + getDisciplineName(d) + '</span>';
      });
    }

    html += '<div class="rank-item" onclick="openDetail(' + j.id + ')">';
    html += '<div class="rank-number-wrap"><div class="rank-number ' + rankClass + '">' + currentRank + '</div>' + changeHtml + '</div>';
    html += '<div class="rank-info">';
    html += '<div class="rank-journal-name">' + j.name + '</div>';
    if (discHtml) html += '<div style="margin:4px 0">' + discHtml + '</div>';
    html += '<div class="rank-keywords">' + kwHtml + '</div>';
    html += '</div>';
    html += '<div>';
    html += '<div class="rank-score">' + s[currentSort] + '</div>';
    html += '<div class="rank-score-label">' + sortLabels[currentSort] + '</div>';
    html += '</div>';
    html += '</div>';
  });

  document.getElementById('friendlyList').innerHTML = html;
}

// ===================== FORUM =====================
var currentCategory = 'all';
function switchCategory(cat, btn) {
  currentCategory = cat;
  document.querySelectorAll('.category-btn').forEach(function(b) { b.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  renderForumList();
}

function renderForumList() {
  var html = '';
  var list = forumPosts;
  if (currentCategory !== 'all') {
    list = forumPosts.filter(function(p) {
      return p.tags && p.tags.some(function(t) { return t.indexOf(currentCategory) !== -1; });
    });
  }
  if (list.length === 0) {
    html = '<div class="empty-state"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><p>暂无帖子</p><p class="empty-hint">点击右上角 + 发表第一篇帖子</p></div>';
  }
  list.forEach(function(p) {
    html += '<div class="post-card" onclick="openPostDetail(' + p.id + ')">';
    html += '<div class="post-title">' + esc(p.title) + '</div>';
    html += '<div class="post-meta"><span>' + esc(p.author) + '</span><span>' + p.time.split(' ')[0] + '</span></div>';
    html += '<div class="post-preview">' + esc(p.content) + '</div>';
    if (p.tags && p.tags.length) {
      html += '<div class="post-tags">';
      p.tags.forEach(function(t) { html += '<span class="post-tag">' + esc(t) + '</span>'; });
      html += '</div>';
    }
    html += '<div class="post-stats">';
    html += '<span>\u2665 ' + (p.likes + (p.liked ? 1 : 0)) + '</span>';
    html += '<span>\u25B6 ' + p.comments.length + ' 评论</span>';
    html += '</div>';
    html += '</div>';
  });
  document.getElementById('postList').innerHTML = html;
}

function openPostDetail(id) {
  var post = forumPosts.find(function(p) { return p.id === id; });
  if (!post) return;

  var html = '<div class="post-detail">';
  html += '<div class="post-detail-title">' + esc(post.title) + '</div>';
  html += '<div class="post-detail-meta">' + esc(post.author) + ' | ' + post.time;
  if (post.tags && post.tags.length) {
    html += ' | ';
    post.tags.forEach(function(t, i) {
      if (i > 0) html += ' ';
      html += '<span class="post-tag" style="font-size:10px">' + esc(t) + '</span>';
    });
  }
  html += '</div>';
  html += '<div class="post-detail-content">' + esc(post.content) + '</div>';
  html += '<div class="post-detail-actions">';
  html += '<button class="action-btn' + (post.liked ? ' liked' : '') + '" onclick="toggleLike(' + post.id + ')">\u2665 ' + (post.likes + (post.liked ? 1 : 0)) + ' 赞</button>';
  html += '<button class="action-btn">\u25B6 ' + post.comments.length + ' 评论</button>';
  html += '</div>';
  html += '</div>';

  // Comments section
  html += '<div class="comment-section">';
  html += '<div class="comment-section-title">评论 (' + post.comments.length + ')</div>';
  post.comments.forEach(function(c) {
    html += '<div class="comment-item">';
    html += '<span class="comment-author">' + esc(c.author) + '</span><span class="comment-time">' + c.time + '</span>';
    html += '<div class="comment-text">' + esc(c.text) + '</div>';
    html += '</div>';
  });

  // Comment form
  html += '<div class="comment-form">';
  html += '<input type="text" id="commentInput" placeholder="写下你的评论...">';
  html += '<button onclick="submitComment(' + post.id + ')">发送</button>';
  html += '</div>';
  html += '</div>';

  document.getElementById('postDetailContent').innerHTML = html;
  showPage('page-postdetail');
}

function toggleLike(postId) {
  var post = forumPosts.find(function(p) { return p.id === postId; });
  if (!post) return;
  post.liked = !post.liked;
  openPostDetail(postId);
}

function submitComment(postId) {
  var input = document.getElementById('commentInput');
  var text = input.value.trim();
  if (!text) { showToast('请输入评论内容'); return; }
  var post = forumPosts.find(function(p) { return p.id === postId; });
  if (!post) return;
  var now = new Date();
  var timeStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  post.comments.push({ author: '当前用户', time: timeStr, text: text });
  showToast('评论发表成功');
  openPostDetail(postId);
}

function showNewPostForm() {
  newPostTags = [];
  document.getElementById('np_title').value = '';
  document.getElementById('np_content').value = '';
  document.getElementById('np_tags').value = '';
  document.getElementById('np_tagList').innerHTML = '';
  showPage('page-newpost');
}

function addTag(event) {
  if (event.key === 'Enter') {
    event.preventDefault();
    var input = document.getElementById('np_tags');
    var tag = input.value.trim();
    if (tag && newPostTags.indexOf(tag) === -1) {
      newPostTags.push(tag);
      renderTagChips();
    }
    input.value = '';
  }
}

function quickAddTag(tag) {
  if (newPostTags.indexOf(tag) === -1) {
    newPostTags.push(tag);
    renderTagChips();
  }
}

function removeTag(tag) {
  newPostTags = newPostTags.filter(function(t) { return t !== tag; });
  renderTagChips();
}

function renderTagChips() {
  var html = '';
  newPostTags.forEach(function(t) {
    html += '<span class="tag-chip" onclick="removeTag(\'' + t.replace(/'/g, "\\'") + '\')">' + esc(t) + ' x</span>';
  });
  document.getElementById('np_tagList').innerHTML = html;
}

function submitPost() {
  var title = document.getElementById('np_title').value.trim();
  var content = document.getElementById('np_content').value.trim();
  if (!title) { showToast('请填写标题'); return; }
  if (!content) { showToast('请填写内容'); return; }
  var now = new Date();
  var timeStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  var post = {
    id: nextPostId++,
    author: '当前用户',
    time: timeStr,
    title: title,
    content: content,
    tags: newPostTags.slice(),
    likes: 0,
    liked: false,
    comments: []
  };
  forumPosts.unshift(post);
  showToast('发帖成功');
  showPage('page-forum');
}
