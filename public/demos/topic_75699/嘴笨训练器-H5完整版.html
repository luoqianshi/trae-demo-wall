<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>嘴笨训练器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; background: #f6f2ee; color: #3d3028; overflow: hidden; }
#app { max-width: 480px; margin: 0 auto; height: 100%; position: relative; overflow: hidden; background: #f6f2ee; }
.page { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.page.active { display: block; }
#page-chat.active { display: flex; flex-direction: column; overflow: hidden; }

/* 主页 */
.hero { background: linear-gradient(135deg, #b83240, #d04050); padding: 48px 24px 36px; text-align: center; color: #fff; }
.hero h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; letter-spacing: 2px; }
.hero .slogan { font-size: 14px; opacity: 0.9; margin-bottom: 24px; }
.emergency-card { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25); border-radius: 12px; padding: 16px; margin-top: 8px; cursor: pointer; backdrop-filter: blur(4px); }
.emergency-card:active { transform: scale(0.98); }
.emergency-card .title { font-size: 16px; font-weight: 600; }
.emergency-card .sub { font-size: 12px; opacity: 0.85; margin-top: 4px; }

.module-section-title { font-size: 17px; font-weight: 700; color: #3d3028; padding: 20px 16px 8px; }
.module-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 16px 16px; }
.module-card { background: #fff; border-radius: 16px; padding: 20px 16px; text-align: center; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
.module-card:active { transform: scale(0.97); }
.module-card .icon { font-size: 32px; margin-bottom: 8px; }
.module-card .name { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.module-card .desc { font-size: 12px; color: #9a8a7a; line-height: 1.4; }

.bottom-tip { text-align: center; padding: 16px; font-size: 12px; color: #9a8a7a; line-height: 1.6; }
.emergency-card-home { background: #fff; border-radius: 14px; padding: 16px 20px; margin: 0 16px 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; box-shadow: 0 2px 12px rgba(80,50,30,0.06); border: 1px solid #e8ddd4; }
.emergency-card-home:active { transform: scale(0.98); }
.emergency-card-home .title { font-size: 16px; font-weight: 600; color: #3d3028; }
.emergency-card-home .sub { font-size: 12px; color: #9a8a7a; margin-top: 4px; }
.emergency-card-home .go { flex-shrink: 0; padding: 6px 16px; border-radius: 10px; background: linear-gradient(135deg, #b83240, #d04050); color: #fff; font-size: 12px; font-weight: 600; }

/* 场景页 */
.scene-hero { padding: 36px 24px 24px; text-align: center; color: #fff; position: relative; }
.scene-hero .back { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 20px; cursor: pointer; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }
.scene-hero h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
.scene-hero p { font-size: 13px; opacity: 0.9; }
.scene-list { padding: 16px; }
.scene-card { background: #fff; border-radius: 16px; padding: 20px; margin-bottom: 12px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.04); display: flex; align-items: center; gap: 16px; }
.scene-card:active { transform: scale(0.98); }
.scene-card .avatar { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
.scene-card .info { flex: 1; }
.scene-card .title { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
.scene-card .role { font-size: 12px; color: #9a8a7a; margin-bottom: 4px; }
.scene-card .tags { display: flex; gap: 6px; flex-wrap: wrap; }
.scene-card .tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #f0e6dc; color: #7a6a5a; }
.scene-card .arrow { font-size: 18px; color: #9a8a7a; }

/* 聊天页 */
.chat-header { display: flex; align-items: center; padding: 12px 16px; background: #fff; border-bottom: 1px solid #e8ddd4; position: sticky; top: 0; z-index: 10; }
.chat-header .back { font-size: 20px; cursor: pointer; width: 32px; }
.chat-header .char-info { display: flex; align-items: center; gap: 10px; flex: 1; }
.chat-header .char-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; background: #f0e6dc; }
.chat-header .char-name { font-size: 15px; font-weight: 600; }
.chat-header .char-sub { font-size: 11px; color: #9a8a7a; }
.chat-header .progress-text { font-size: 13px; color: #b83240; font-weight: 600; }

.progress-bar { height: 3px; background: #e8ddd4; }
.progress-bar .fill { height: 100%; background: #b83240; transition: width 0.3s; }

.chat-messages { padding: 16px; overflow-y: auto; -webkit-overflow-scrolling: touch; flex: 1; min-height: 0; }
.msg-row { display: flex; margin-bottom: 16px; }
.msg-row.player { justify-content: flex-end; }
.msg-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; background: #f0e6dc; }
.msg-bubble { max-width: 75%; padding: 12px 14px; border-radius: 16px; font-size: 14px; line-height: 1.6; position: relative; word-break: break-word; }
.msg-row.npc .msg-bubble { background: #fff; border: 1px solid #e8ddd4; margin-left: 10px; border-top-left-radius: 4px; }
.msg-row.player .msg-bubble { background: #f0e6dc; margin-right: 10px; border-top-right-radius: 4px; }
.msg-moves { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.msg-move { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #f9f5f2; color: #9a8a7a; }
.msg-type-label { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-top: 6px; }
.type-weak { background: #f4e0d8; color: #a06858; }
.type-neutral { background: #e8ddd4; color: #7a6a5a; }
.type-boundary { background: #e0ecdc; color: #4a7a5a; }
.type-counter { background: #f2ecd0; color: #7a6a30; }

.typing { display: flex; align-items: center; gap: 6px; padding: 12px 14px; background: #fff; border: 1px solid #e8ddd4; border-radius: 16px; width: 60px; margin-left: 46px; }
.typing span { width: 6px; height: 6px; background: #9a8a7a; border-radius: 50%; animation: typing 1s infinite; }
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes typing { 0%,100%{opacity:0.3;} 50%{opacity:1;} }

.toast { position: fixed; top: 60px; left: 50%; transform: translateX(-50%) translateY(-20px); background: #4a7a5a; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 13px; opacity: 0; pointer-events: none; transition: all 0.3s; z-index: 100; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.bottom-panel { background: #fff; border-top: 1px solid #e8ddd4; flex-shrink: 0; }
.choices-panel { padding: 16px; }
.choices-label { font-size: 13px; color: #9a8a7a; margin-bottom: 10px; font-weight: 500; }
.choice-btn { width: 100%; text-align: left; padding: 14px 16px; margin-bottom: 10px; border-radius: 12px; border: 1px solid #e8ddd4; background: #fff; font-size: 14px; line-height: 1.5; color: #3d3028; cursor: pointer; transition: all 0.15s; }
.choice-btn:active { background: #f9f5f2; }
.choice-btn .type-tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-right: 6px; }

.result-panel { padding: 16px; max-height: 60vh; overflow-y: auto; }
.result-card { background: #f9f5f2; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.result-card .r-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.result-card .r-text { font-size: 13px; line-height: 1.7; color: #5a4a3a; }
.result-card .r-label { font-size: 11px; color: #9a8a7a; margin-top: 8px; }
.combo-banner { background: linear-gradient(135deg, #b83240, #d04050); color: #fff; border-radius: 12px; padding: 16px; text-align: center; margin-bottom: 12px; }
.combo-banner .emoji { font-size: 32px; margin-bottom: 4px; }
.combo-banner .title { font-size: 18px; font-weight: 700; }
.combo-banner .desc { font-size: 13px; opacity: 0.9; margin-top: 4px; }

.nav-btns { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #e8ddd4; }
.nav-btn { flex: 1; padding: 10px; border-radius: 8px; border: none; font-size: 13px; cursor: pointer; }
.nav-btn.primary { background: linear-gradient(135deg, #b83240, #d04050); color: #fff; }
.nav-btn.secondary { background: #f0e6dc; color: #3d3028; }
.nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* 急救页 */
.emergency-page { padding: 16px; }
.emergency-input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #e8ddd4; font-size: 14px; resize: none; font-family: inherit; margin-bottom: 12px; }
.example-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.example-btn { padding: 6px 12px; border-radius: 16px; border: 1px solid #e8ddd4; background: #fff; font-size: 12px; color: #7a6a5a; cursor: pointer; }
.analyze-btn { width: 100%; padding: 14px; border-radius: 12px; border: none; background: linear-gradient(135deg, #b83240, #d04050); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 16px; }
.analyze-btn:active { opacity: 0.9; }
.emergency-result { background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
.emergency-result .er-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
.emergency-result .er-section { margin-bottom: 16px; }
.emergency-result .er-label { font-size: 12px; color: #9a8a7a; margin-bottom: 4px; }
.emergency-result .er-text { font-size: 14px; line-height: 1.6; color: #3d3028; }
.er-boundary { background: #e0ecdc; color: #4a7a5a; padding: 12px 14px; border-radius: 10px; font-size: 14px; line-height: 1.6; margin-top: 4px; }

/* 战报 */
.summary-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 200; display: none; align-items: center; justify-content: center; }
.summary-overlay.active { display: flex; }
.summary-card { background: #fff; border-radius: 20px; padding: 32px 24px; width: 85%; max-width: 400px; text-align: center; }
.summary-card .s-emoji { font-size: 48px; margin-bottom: 8px; }
.summary-card .s-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
.summary-card .s-sub { font-size: 13px; color: #9a8a7a; margin-bottom: 20px; }
.summary-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 20px; }
.stat-item { background: #f9f5f2; border-radius: 12px; padding: 14px 8px; }
.stat-item .num { font-size: 24px; font-weight: 700; color: #b83240; }
.stat-item .label { font-size: 11px; color: #9a8a7a; margin-top: 4px; }
.summary-card .close-btn { width: 100%; padding: 12px; border-radius: 10px; border: none; background: linear-gradient(135deg, #b83240, #d04050); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }

/* 类型颜色 */
.type-weak-bg { background: #f4e0d8 !important; color: #a06858 !important; }
.type-neutral-bg { background: #e8ddd4 !important; color: #7a6a5a !important; }
.type-boundary-bg { background: #e0ecdc !important; color: #4a7a5a !important; }
.type-counter-bg { background: #f2ecd0 !important; color: #7a6a30 !important; }

.followup-bubble { background: #f9f5f2 !important; }
</style>
</head>
<body>
<div id="app">
  <!-- 主页 -->
  <div class="page active" id="page-home">
    <div class="hero">
      <h1>嘴笨训练器</h1>
      <p class="slogan">被怼懵、被甩锅、被占便宜时，先别内耗，让 AI 陪你练一句。</p>
    </div>
    <div class="module-section-title">选择你遇到的场景</div>
    <div class="module-grid" id="home-modules"></div>
    <div class="emergency-card-home" onclick="router.go('emergency')">
      <div class="title">&#x26A0; 临场急救</div>
      <div class="sub">输入对方的话，快速分析意图 + 生成边界回复</div>
      <div class="go">进入</div>
    </div>
    <div class="bottom-tip">不是教你攻击别人，而是帮你看懂话术、守住边界、选对回法。</div>
  </div>

  <!-- 场景页 -->
  <div class="page" id="page-scenes">
    <div class="scene-hero" id="scene-hero">
      <div class="back" onclick="router.back()">&#x2190;</div>
      <h2 id="scene-module-title"></h2>
      <p id="scene-module-desc"></p>
    </div>
    <div class="scene-list" id="scene-list"></div>
  </div>

  <!-- 聊天页 -->
  <div class="page" id="page-chat">
    <div class="chat-header">
      <div class="back" onclick="router.back()">&#x2190;</div>
      <div class="char-info">
        <div class="char-avatar" id="chat-avatar"></div>
        <div>
          <div class="char-name" id="chat-name"></div>
          <div class="char-sub" id="chat-subtitle"></div>
        </div>
      </div>
      <div class="progress-text" id="chat-progress"></div>
    </div>
    <div class="progress-bar"><div class="fill" id="progress-fill"></div></div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="toast" id="toast"></div>
    <div class="bottom-panel">
      <div class="choices-panel" id="choices-panel"></div>
      <div class="result-panel" id="result-panel" style="display:none;"></div>
      <div class="nav-btns" id="chat-nav" style="display:none;">
        <button class="nav-btn secondary" id="btn-prev" onclick="chat.prevRound()">上一题</button>
        <button class="nav-btn secondary" onclick="chat.retryRound()">重新打这局</button>
        <button class="nav-btn primary" id="btn-next" onclick="chat.nextQuestion()">下一题</button>
      </div>
    </div>
  </div>

  <!-- 急救页 -->
  <div class="page" id="page-emergency">
    <div class="chat-header">
      <div class="back" onclick="router.back()">&#x2190;</div>
      <div class="char-info">
        <div class="char-avatar">&#x26A0;</div>
        <div>
          <div class="char-name">临场急救</div>
          <div class="char-sub">输入对方的话，快速生成边界回复</div>
        </div>
      </div>
    </div>
    <div class="emergency-page">
      <textarea class="emergency-input" id="emergency-input" rows="4" placeholder="输入对方刚说的话..."></textarea>
      <div class="example-btns">
        <button class="example-btn" onclick="emergency.setExample('你这么敏感干嘛，我开玩笑的')">开玩笑</button>
        <button class="example-btn" onclick="emergency.setExample('我都是为你好，你怎么不领情')">为你好</button>
        <button class="example-btn" onclick="emergency.setExample('这个问题找平台，我们处理不了')">找平台</button>
        <button class="example-btn" onclick="emergency.setExample('你要是真爱我，就不会这么计较')">爱我就该</button>
      </div>
      <button class="analyze-btn" onclick="emergency.analyze()">分析并生成边界回复</button>
      <div class="emergency-result" id="emergency-result" style="display:none;"></div>
    </div>
  </div>

  <!-- 战报弹窗 -->
  <div class="summary-overlay" id="summary-overlay">
    <div class="summary-card">
      <div class="s-emoji">&#x1F3C6;</div>
      <div class="s-title">通关战报</div>
      <div class="s-sub">本轮训练完成</div>
      <div class="summary-stats">
        <div class="stat-item"><div class="num" id="stat-total">0</div><div class="label">总回应</div></div>
        <div class="stat-item"><div class="num" id="stat-boundary">0</div><div class="label">边界型</div></div>
        <div class="stat-item"><div class="num" id="stat-counter">0</div><div class="label">回击型</div></div>
      </div>
      <button class="close-btn" onclick="chat.closeSummary()">继续训练</button>
    </div>
  </div>
</div>

<script>

const challengeData = {"workplace":[{"npc":"你这次反应有点大，职场里抗压能力还是要练练。","intent":"把具体事件里的合理反馈，贴上\"反应大\"\"抗压差\"的标签，让你怀疑是自己有问题，而不是事情本身有问题。","moves":["贴标签攻击","人格否定"],"choices":[{"type":"软弱型","text":"我知道您是提醒我，以后遇到类似情况我会先稳住情绪，再看怎么配合团队。","meaning":"你把\"反应大\"理解成自己的情绪问题来退让，没有追问具体是哪件事、哪种处理方式有问题，等于先接住了\"抗压差\"这个标签。","guidance":"保留愿意调整的态度，但要把话题拉回事实：我可以调整表达方式，您具体指的是哪次反馈、哪句话不合适？"},{"type":"中立型","text":"那您觉得我哪里需要改进？应该怎么改呢？","meaning":"你想了解具体问题，但这句把定义权交给了对方，等于默认\"我确实有问题，只是需要你指出来\"。","guidance":"可以追问，但要换一种问法：您说的抗压能力，具体指哪件事的处理方式？把评价变成事实讨论。"},{"type":"边界型","text":"我不太认可这个说法。我提的是具体问题，不是情绪反应。如果您觉得我的反馈方式有问题，我们可以讨论具体怎么改，但不接受用\"抗压差\"来概括。","meaning":"你没有接受标签，也没有攻击对方，而是把话题从\"你性格有问题\"拉回\"具体事情怎么处理\"。","guidance":"保持这个方向。如果对方继续用空泛评价，可以再追一句：您能不能举一个具体例子？"},{"type":"回击型","text":"你把你的压榨说成是我的抗压能力差，到底是我抗压能力差，还是你太欺负人了？","meaning":"你直接戳穿了对方的包装，爽感强，但\"欺负人\"这个词容易让对方抓住把柄说你情绪化。","guidance":"回击可以更精准：你说的是抗压能力，那我问你，让我一个人扛三个人的活，这叫锻炼还是叫节省人力成本？"}],"followUp":{"npcByType":{"软弱型":"你看，你自己都承认了。那以后这种高强度的事就交给你了，毕竟要练抗压嘛，我这是为你好。","中立型":"别纠结哪件事了，你就是太敏感。我是过来人，听我的没错，先把活干好再说。","边界型":"你连这点评价都说不得？你这态度在团队里很难混的，你想想清楚。","回击型":"行行行，我说你一句你十句等着我，至于吗？我就是随口一说，你这人怎么这么冲。"},"intent":"把你第1轮的回应进一步扭曲——要么把你认错的话当成把柄扩大压榨，要么用\"敏感\"\"态度\"\"至于吗\"把球踢回你身上，让你自证情绪，偏离正事。","moves":["强化标签","转移焦点","态度审判"],"choices":[{"type":"软弱型","text":"既然您是想让我多练练，我先把这部分接下来，后面如果任务堆得太满，再麻烦您帮我看看分工。","meaning":"你用\"多练练\"接受了对方的框架，虽然留下了分工调整的口子，但主动权仍交给对方，当前加压已经被你接下。","guidance":"如果暂时退让，也要把任务冲突说清：我先接这项，但现有A项目和这项的优先级需要您定一下，否则两个都可能受影响。"},{"type":"中立型","text":"敏感不敏感得看具体事。您能不能举一个我反应过度的例子，我们对一对？","meaning":"你把空泛评价拉回事实层面，但语气还留了余地，对方若举不出例子就会显出空洞性。","guidance":"保持追问具体事。如果对方举的例子站不住，可以当场回应：这件事的情况是……所以不是反应大，是问题本身需要解决。"},{"type":"边界型","text":"我说的是具体事，您回的是\"你太敏感\"\"态度不好\"。这不是讨论，是贴标签。我接受对事的评价，不接受对人的定性，咱们还是聊那件事怎么处理。","meaning":"你划清了\"对事\"和\"对人\"的界限，既不接标签，也不被带去自证态度。","guidance":"说完后直接把话题拉回原来那件事，不接对方关于\"态度\"\"敏感\"的任何话头。"},{"type":"回击型","text":"随口一说就能往人身上安标签？那我也随口一句：您这管理方式，自己抗压能力也练练呗，别一出事就往下属身上甩。","meaning":"你用同样的句式反将一军，爽感强，但容易变成对骂，对方可能借机说你顶撞领导。","guidance":"回击可以更稳：您说随口一说，那这评价就当没说过。咱们回到正事——那件事到底怎么处理，您给个准话。"}]}},{"npc":"这个项目你先接一下，我是觉得你有潜力，才给你机会。","intent":"用\"培养\"\"潜力\"\"机会\"包装额外任务，让你不好意思拒绝，同时不提资源、优先级和交付标准。","moves":["包装压榨","机会诱惑"],"choices":[{"type":"软弱型","text":"谢谢您愿意给我这个机会，我会先把项目扛起来，过程中如果有不清楚的地方再来请教您。","meaning":"你把额外任务当成机会先接了，却没有确认优先级、交付标准和资源，对方会判断只要说\"培养\"，你就会先扛。","guidance":"可以表达感谢，但接之前至少补三个确认：目标是什么、什么时候交、和手头任务哪个优先。"},{"type":"中立型","text":"好的，那这个项目大概需要做到什么程度？时间节点是什么时候？","meaning":"你开始问细节了，但语气还是\"我来配合\"，没有表达当前工作量是否允许。","guidance":"补一句：我目前手上有A项目周五交付，这个新项目和A的优先级怎么排？让对方做选择，不是你全扛。"},{"type":"边界型","text":"谢谢认可。我目前A项目周五交付，如果接这个新项目，需要确认优先级和资源支持。您看这两个怎么排？","meaning":"你没有拒绝，也没有盲目接受，而是把排优先级的责任还给领导，让他做决定。","guidance":"这就是正确做法。口头确认后，建议再发一条文字消息留痕，写明优先级和交付时间。"},{"type":"回击型","text":"你说给我机会，那加薪吗？升职吗？如果都没有，那这不叫机会，这叫免费加班。","meaning":"你戳中了\"用机会代替报酬\"的套路，但直接提钱容易让关系僵化，对方可能说你功利。","guidance":"可以更巧妙：我非常珍惜这个机会，想确认一下这个项目对应的考核目标和激励方案，方便我全力投入。"}],"followUp":{"npcByType":{"软弱型":"好，那这个项目你就全权负责了，有什么问题随时找我。放手去干，我看好你。","中立型":"别问那么细，你做着做着就知道了。我相信你的能力，先动起来再说。","边界型":"你这孩子怎么这么斤斤计较？给你机会还挑三拣四的，外面有的是人抢着做。","回击型":"我就是想培养你，你倒好，上来就谈钱谈条件。行，那你别做了，我找别人。"},"intent":"用\"全权负责\"把成本甩给你，用\"别人抢着做\"制造稀缺感逼你就范，用\"谈钱\"给你扣功利帽子让你羞愧。","moves":["甩成本","制造稀缺","道德贬低"],"choices":[{"type":"软弱型","text":"您都这么说了，我就先按自己的理解推进，遇到拿不准的地方再来找您确认。","meaning":"你接受了\"全权负责\"的模糊授权，却没有让对方确认范围和资源，后续方向偏了很容易变成你个人判断失误。","guidance":"把退让落到可控范围：我先拟一版计划和资源清单发您确认，您没意见我再推进。这样不是拒绝机会，而是给执行留依据。"},{"type":"中立型","text":"我不是挑三拣四，是想对结果负责。我先列个优先级和资源清单，您过一遍，这样我做出来才符合预期。","meaning":"你把\"问细节\"重新定义为\"对结果负责\"，但没有正面接\"别人抢着做\"的威胁。","guidance":"说完真去列清单，发文字留痕。如果对方不回，按你列的版本执行，至少有依据。"},{"type":"边界型","text":"计较优先级不是斤斤计较，是对交付负责。我可以接，但需要您把优先级排一下：A项目周五交付，这个新项目插进来，哪个先？您定了我就执行。","meaning":"你把决策权明确交回给领导，让他选，而不是你一个人扛两个项目的冲突。","guidance":"说完后发消息确认。如果领导说\"都要\"，书面回复：两个都要的话，需要增加人力或调整节点，请批示。"},{"type":"回击型","text":"找别人？行啊，您找。不过丑话说前头：这活该谁做、资源给多少、考核怎么算，您最好也跟\"别人\"讲清楚，不然换谁都做不长。","meaning":"你戳中了\"用稀缺感压价\"的虚张声势，但语气偏硬，对方可能记仇。","guidance":"可以软一档：我不谈钱谈的是规则。机会我珍惜，但活儿也得有活儿的干法，不然谁接都做不好，您说是不是？"}]}},{"npc":"别问那么多，先照做就行，出了事我负责。","intent":"要求你放弃确认，用\"我负责\"让你放心，但真正出问题时，执行人往往最先被追责。","moves":["甩锅推责","阻止留痕"],"choices":[{"type":"软弱型","text":"既然时间比较紧，我先照您刚才说的方向做，后面有偏差您再提醒我。","meaning":"你为了赶进度放弃确认，把风险留给执行阶段；一旦出错，对方可以说你理解偏差，而你没有留下可核对的依据。","guidance":"即使先做，也要同步一句：我按您刚才说的三点执行，稍后发个要点给您确认，避免做偏。"},{"type":"中立型","text":"好的，那我把要点复述一遍，您看对不对。","meaning":"你想确认细节，但\"复述要点\"没有解决\"出了事谁负责\"的问题，对方仍然可以说你理解有偏差。","guidance":"复述之后加一句：如果有偏差，请您及时纠正，我按确认后的版本执行。然后留文字记录。"},{"type":"边界型","text":"我可以先做，但需要您在消息里确认一下核心要求，这样我执行的时候有依据。不是为了推责任，是为了减少返工。","meaning":"你没有对抗，但坚持要留痕。这句\"为了减少返工\"很聪明，让对方不好拒绝。","guidance":"保持这个习惯。口头指令+文字确认，是职场最基础的自保方式。"},{"type":"回击型","text":"你说你负责，那你写下来。口头说负责，出了事你说是我理解偏差，我找谁说去？","meaning":"你戳中了\"口头负责\"的漏洞，但语气偏冲，对方可能说你态度有问题。","guidance":"换一种说法效果一样但不惹人：理解您想快速推进，为了避免执行偏差，我把要点整理一下发您确认，这样也方便您追踪进度。"}],"followUp":{"npcByType":{"软弱型":"嗯，做就行了。有什么事我们内部消化，不用搞那些消息记录有的没的，整那么正式干嘛。","中立型":"复述什么？我又不是没说清楚。你赶紧做，别磨蹭，时间紧。","边界型":"发消息确认？你是不信任我？这点小事都要留痕，以后还怎么合作？你是不是对我有意见？","回击型":"好好好，我不负责了行吧？你自己看着办，出事别来找我。"},"intent":"进一步打压你的留痕需求——要么让你\"内部消化\"放弃记录，要么用\"不信任我\"把你架到道德低处，要么撒手不管让你裸奔执行。","moves":["阻止留痕","道德绑架","撒手威胁"],"choices":[{"type":"软弱型","text":"我明白您不想弄得太正式，那我先按刚才口头说的去做，尽量别耽误进度。","meaning":"你顺着\"不用正式\"放弃了留痕，表面是配合效率，实际把指令依据变成了口头记忆，出事时很难说清。","guidance":"退一步也要自保：不发给对方，也要自己记录时间、指令来源、执行要点；更稳的是发一句\"按刚才沟通我先执行以下几点\"。"},{"type":"中立型","text":"我不是磨蹭，是这事儿涉及几个关键点，做错了返工更耽误时间。您给我两分钟，我对一下三个点就行。","meaning":"你把\"确认\"包装成\"为效率\"，但仍然没有解决留痕问题，对方口头确认后仍可否认。","guidance":"口头对完之后，自己默默发一条消息：按沟通执行以下三点……哪怕对方不回，你也有了发送记录。"},{"type":"边界型","text":"这不是信任的问题，是工作流程。我执行的东西需要有个依据，万一您后来调整了方向，我才知道按哪个版本走。我发个要点，您回个\"对\"就行，不耽误事。","meaning":"你把留痕理由从\"防你甩锅\"换成\"防方向变更\"，给对方台阶，同时守住留痕底线。","guidance":"发完后如果对方不回，隔半天再追一句：您没回复我按这个版本执行了哈。把沉默默认成确认。"},{"type":"回击型","text":"您说不负责就不负责了？这指令是您下的，执行是我做的，责任哪能您一句话就撇清。您要真不管，那这活我也没法做，出了问题大家各自承担各自的部分。","meaning":"你直接戳破\"撒手\"的虚张声势，但容易升级为正面冲突。","guidance":"更稳的版本：您说不管就不管，那我只能按自己理解的来做了。不过我提前说清楚，执行依据是您刚才的口头安排，我会如实记录。"}]}},{"npc":"这个锅你先顶一下，团队内部后面再说。","intent":"用\"团队\"名义让你承担单点责任，\"后面再说\"通常意味着不会再说。","moves":["甩锅推责","团队绑架"],"choices":[{"type":"软弱型","text":"为了不影响团队进度，我先把这个问题接住，责任归属咱们忙完再慢慢看。","meaning":"你把\"救火\"和\"背锅\"混在了一起，愿意先处理是退让，但没有给厘清责任设时间，\"后面再说\"很可能不了了之。","guidance":"可以先救火，但要加边界：我先处理当前问题，周五前我们把责任链路和后续归属过一下。"},{"type":"中立型","text":"这个事我不完全了解，能不能先说一下来龙去脉？","meaning":"你想了解情况再决定，但没有明确表达\"这不是我的责任\"。对方可能觉得你在犹豫，顺势推给你。","guidance":"了解情况后要表态：这个环节确实不是我负责的，我可以协助处理，但责任归属需要说清楚。"},{"type":"边界型","text":"我可以协助处理当前问题，但这个环节不是我的职责范围。我帮忙是为了团队，但责任归属需要如实记录，不能由我一个人扛。","meaning":"你分清了\"帮忙\"和\"背锅\"的区别，既没有见死不救，也没有替别人扛责任。","guidance":"说完之后，建议在项目群或邮件里同步处理过程，让责任归属有据可查。"},{"type":"回击型","text":"凭什么我顶？又不是我出的错。你说团队团队，出事的时候怎么不说是团队？","meaning":"你拒绝背锅是对的，但情绪太冲，容易被说\"不顾大局\"\"没有团队精神\"。","guidance":"同样的意思换个说法：我愿意帮忙处理，但这个锅不应该我来背。我们可以一起复盘，把各个环节理清楚，这样对团队长远发展更好。"}],"followUp":{"npcByType":{"软弱型":"好，那你先顶着，等忙完这阵子咱们再说归属的事。放心，我心里有数。","中立型":"来龙去脉你处理的时候就知道了，先把这个火灭了，别的事儿别管那么多。","边界型":"团队的事你还分你的我的？你这格局不行啊，一点团队精神都没有。","回击型":"行，你不顶就不顶。反正大家都知道是哪个环节出的问题，到时候别怪我没提醒你。"},"intent":"用\"忙完再说\"无限拖延厘清责任，用\"格局\"\"团队精神\"道德绑架你接锅，用\"大家都知道是你环节\"反向甩锅威胁你。","moves":["拖延厘责","道德绑架","反向甩锅"],"choices":[{"type":"软弱型","text":"我先把火灭掉，归属这块就按您说的等忙完再看，不过这周内如果方便还是碰一下。","meaning":"你继续优先承担救火，把归属问题放在\"如果方便\"的位置，对方很容易用忙来拖延，临时背锅会逐渐变成默认责任。","guidance":"把请求改成约定：我处理到周五，周五我们复盘责任归属；如果不复盘，我会在处理记录里写明当前只是临时协助。"},{"type":"中立型","text":"灭火的我知道了，但我想先确认一下：这个环节原负责人是谁？我处理的时候需要对接他，不然容易二次出问题。","meaning":"你用\"需要对接\"作为理由把原负责人浮出水面，比直接追责更聪明。","guidance":"对接时留记录：按XX指示，我与原负责人XX沟通，处理方式为……把责任链条写清。"},{"type":"边界型","text":"格局不是替别人背锅。我可以帮忙处理，但责任归属我会如实记录在处理报告里：问题环节、原负责人、处理过程都写清楚。这不是分你的我的，是让事情经得起复盘。","meaning":"你重新定义了\"格局\"——不是扛别人的锅，是让流程透明。对方很难反驳\"经得起复盘\"。","guidance":"处理完真的写一份报告发出来，cc相关人员。报告只写事实，不写评价，让责任一目了然。"},{"type":"回击型","text":"大家都知道？那正好，既然大家都知道，那就让大家都知道到底是谁的环节。您别拿\"大家都知道\"吓我，真掰扯起来，谁下的指令、谁没审核，记录里都有。","meaning":"你接住了\"反向甩锅\"并反推回去，气场足，但容易被说成\"翻旧账\"\"不顾大局\"。","guidance":"可以收一收锋芒：行，那咱们别含糊。我把我经手的部分写清楚，其他环节也请对应负责人各自说明，这样谁也别冤枉谁。"}]}},{"npc":"你怎么连这个都不懂？我之前不是暗示过了吗？","intent":"用羞辱回避自己的沟通责任，把\"没说清楚\"变成\"你理解力差\"。","moves":["暗示推责","羞辱式沟通"],"choices":[{"type":"软弱型","text":"可能我当时没有理解到您的意思，我再回去把聊天记录和会议内容仔细翻一遍。","meaning":"你把\"暗示没被理解\"归成自己的疏忽，没有要求对方指出具体依据，等于替他的模糊沟通买单。","guidance":"不要先认\"没理解\"。可以说：我去核对记录，您也帮我指一下当时是哪条信息，这样我能马上修正。"},{"type":"中立型","text":"可能我遗漏了，您是在哪个场合提到的？我回去翻一下记录。","meaning":"你想找到依据，这比道歉好，但\"我遗漏了\"还是先认了错。","guidance":"换成：我翻了一下聊天记录和会议纪要，没有找到相关说明。您方便指一下具体是哪条消息吗？"},{"type":"边界型","text":"我查了聊天记录和会议纪要，没有找到相关说明。如果您之前有提过，麻烦指给我看一下，我确认后马上调整。","meaning":"你没有认错，也没有攻击，而是用事实说话：有记录就有，没有就没有。","guidance":"如果对方找不到记录，可以补一句：那以后这类重要信息，建议发文字确认，避免遗漏。"},{"type":"回击型","text":"暗示？职场里靠暗示沟通的吗？你有要求就明说，暗示算什么？","meaning":"你戳中了\"暗示不叫沟通\"的本质，但语气太冲，对方可能说你态度恶劣。","guidance":"可以更冷静：我习惯按书面要求执行，如果有特殊要求，麻烦明确说一下，这样我才能保证做对。"}],"followUp":{"npcByType":{"软弱型":"你自己没注意还怪我？算了算了，下次我给你写明白点，省得你又漏。不过这事儿你记着点，别老让我重复。","中立型":"哪条消息？我哪记得那么清楚，反正我说过。你自己翻呗，翻不出来是你的事。","边界型":"你还翻记录？这点事你至于吗？翻出来又怎样，你照样没做到，这就是你的问题。","回击型":"我就随口一说，你至于这么大反应？敏感成这样，工作还怎么推进？"},"intent":"把找不到记录的责任继续推给你，用\"至于吗\"\"敏感\"把合理追问说成小题大做，让你不好意思再追。","moves":["推卸举证","贬低追问","态度审判"],"choices":[{"type":"软弱型","text":"我再仔细找一遍，可能当时信息太多我没抓到重点，这次先按您现在补充的要求改。","meaning":"你继续承认自己没抓到重点，让\"暗示过\"变成对方可反复使用的免责说法；虽然推进了修改，但责任仍落在你身上。","guidance":"可以先改，但别认漏看：我先按您现在明确的要求调整，同时我没有找到此前记录，后续重要要求麻烦补个文字。"},{"type":"中立型","text":"翻不出来是我的事？那这事儿就卡这儿了。您要是想让我做对，总得给我个依据，不然我怎么做都可能是错的。","meaning":"你点出了\"没有依据就没法正确执行\"，但没有把对方逼到墙角。","guidance":"补一句建设性的：要不您现在把要求说一下，我记下来按这个做，这样最靠谱。"},{"type":"边界型","text":"至于。因为这事我现在没依据，做错了算谁的？您说翻出来又怎样——翻得出来我认，翻不出来那就说明当时没说明白。咱们别绕，您现在把要求明确说一下，我立刻执行。","meaning":"你把\"翻记录\"重新定义为\"找执行依据\"，并给了对方一个台阶：现在补说也行。","guidance":"对方补说后，立刻复述并补一句：那按您现在说的执行，我发个消息记录一下，避免再扯皮。"},{"type":"回击型","text":"随口一说就给我扣\"不懂\"的帽子？那我也随口一句：您这沟通方式，是不是该练练把话说清楚？靠暗示带团队，出了事全赖下属，这套路玩得挺溜。","meaning":"你把\"暗示沟通\"的问题挑明，但\"套路玩得溜\"攻击性强，容易被记恨。","guidance":"收一收：您说随口一说，那这评价我就不当真了。不过为避免以后再\"随口\"，重要的事我们走文字，您说行不行？"}]}},{"npc":"年轻人不要太计较边界，多做一点不会亏。","intent":"把合理边界说成\"计较\"，用\"年轻人\"标签施压，让你觉得拒绝就是不懂事。","moves":["倚老卖老","道德绑架"],"choices":[{"type":"软弱型","text":"您说得也有道理，我年轻多学一点没坏处，这块我先帮着做起来。","meaning":"你顺着\"年轻人多做\"退让了，把边界问题包装成学习机会；对方以后更容易把额外工作说成锻炼。","guidance":"愿意多做也要限定性质：这次我先协助，想确认一下这是临时支持还是正式调整分工。"},{"type":"中立型","text":"我不是计较，只是想确认一下分工。","meaning":"你想解释，但一开口\"我不是计较\"就已经掉进了对方的框架，在否认一个你根本不需要否认的指控。","guidance":"不要说\"我不是计较\"。直接说：分工清楚对项目推进更高效，我想确认一下哪些是我的部分，哪些需要协同。"},{"type":"边界型","text":"分工清楚不是计较，是对项目负责。我可以多做，但需要明确哪些是正式安排，哪些是临时协助，这样大家配合起来更顺畅。","meaning":"你重新定义了\"边界\"——不是自私，是专业。对方很难反驳\"对项目负责\"这个理由。","guidance":"保持这个框架。如果对方继续说\"别分那么清\"，可以回：分清了反而效率高，避免重复劳动和责任真空。"},{"type":"回击型","text":"你让年轻人多做一点，那工资也多发一点吗？光让干活不给钱，这叫占便宜不叫培养。","meaning":"你戳中了\"用年轻人标签压价\"的本质，但直接谈钱容易让对方觉得你功利、不好管理。","guidance":"可以更巧妙：我愿意多做，也希望能多学。只是想确认一下，这些额外任务的考核和成长路径是怎样的？"}],"followUp":{"npcByType":{"软弱型":"这就对了，年轻人多干点没坏处。那这块以后就归你了，反正你也熟了。","中立型":"分工？都是干活，分什么工。你想做啥做啥呗，别那么死板。","边界型":"你这孩子怎么这么轴？我说一句你十句等着。以后谁敢带你？这点事都拎不清。","回击型":"行行行，我说不过你。你厉害，那你以后就只做你那点事吧，别的不用管。"},"intent":"把\"多做一点\"偷换成\"这块归你\"扩大职责，用\"轴\"\"谁敢带你\"孤立你，用\"只做你那点事\"反向冷暴力。","moves":["扩大职责","孤立威胁","冷暴力"],"choices":[{"type":"软弱型","text":"既然我现在比较熟，那这段时间我先继续接着，后面如果确实长期需要我负责，再看看怎么安排。","meaning":"你接受了\"熟了就归你\"的扩大职责，只留下模糊的\"后面再看\"，没有时间点也没有考核安排，临时帮忙会变成长期默认。","guidance":"把模糊退让改成期限：我先协助到月底，月底我们确认是否正式调整分工、职责和考核。"},{"type":"中立型","text":"不是死板，是怕做重复了或者漏了。您说\"想做啥做啥\"，那万一两边都没人做，最后还是扯皮。要不花两分钟把这块的负责人定一下？","meaning":"你用\"怕扯皮\"作为理由，比\"要分工\"更软，但仍然没有解决考核问题。","guidance":"定完负责人后问一句：这块算正式调整分工吗？如果算，考核和职责描述要不要更新？"},{"type":"边界型","text":"轴不是坏事，是把事做清楚。我可以多做，但\"归我\"和\"协助\"是两回事——归我，那分工和考核得更新；协助，那有个时间节点。您看是哪种？","meaning":"你逼对方在\"正式接管\"和\"临时帮忙\"之间二选一，不给模糊空间。","guidance":"对方若说\"都行\"，你就选\"协助到X号\"，并书面确认，到期收回。"},{"type":"回击型","text":"您说\"只做我那点事\"，那我可当真了。我那点事我做扎实，其他的请安排对应的人。您别嘴上说不管，回头活还往我这儿塞，那可不行。","meaning":"你接住了\"冷暴力\"并反向锁定边界，但容易被说\"刺头\"\"不好管\"。","guidance":"软一档：我理解您是气话。咱们说实在的，我那块我做满做好，额外的需要协调，您排个优先级我配合。"}]}},{"npc":"我不是批评你，我是为你好，公开说出来你才长记性。","intent":"用\"为你好\"包装公开羞辱，让你无法反驳，因为一反驳就是\"不领情\"。","moves":["公开施压","道德绑架"],"choices":[{"type":"软弱型","text":"您当众指出来也是希望我改进，我会记住这个问题，后面尽量不再犯。","meaning":"你把公开点名解释成\"帮你改进\"，没有区分问题本身和公开羞辱的方式，对方会认为这种场合施压是可接受的。","guidance":"公开场合可以先接住，但会后要补一句：问题我接受，类似反馈能否单独沟通？公开点名会影响后续协作。"},{"type":"中立型","text":"我理解您的好意，但有些情况可能您还不了解。","meaning":"你想解释，但\"我理解您的好意\"等于先接受了\"为我好\"的设定，后面的解释会被当成找借口。","guidance":"不要先接受\"好意\"。直接说：您提到的问题我可以回应，但希望有机会单独沟通，这样更充分。"},{"type":"边界型","text":"您指出的问题我可以回应，但希望以后能单独沟通。公开场合说这些，不太利于后续推进工作，也不太利于团队信任。","meaning":"你没有否认对方的评价，但明确表达了\"方式不对\"。你守住了\"怎么沟通\"这个边界。","guidance":"说完之后不要等对方回应，直接把话题拉回工作本身：关于这个问题，我的处理思路是……"},{"type":"回击型","text":"为我好就私下说，当众说叫什么为我好？你不过是想当众立威罢了。","meaning":"你戳穿了\"为你好\"的包装，但\"立威\"这个指控太直接，对方可能当场翻脸。","guidance":"可以更克制：公开场合我尊重您的发言权，但有些问题更适合一对一沟通。如果您方便，会后我们聊一下？"}],"followUp":{"npcByType":{"软弱型":"这就对了，接受批评才能成长。下次还这样，我还得公开点你，免得你没记性。","中立型":"好意你还不领情？那你自己琢磨去吧，我不管了，反正我说过了。","边界型":"我当众说你怎么了？还不是为了让大家引以为戒。你这人怎么这么玻璃心，说都说不得？","回击型":"行，我以后不说你了。好心当成驴肝肺，随你怎么想吧。"},"intent":"用\"下次还公开点你\"把当众羞辱常态化，用\"玻璃心\"\"说不得\"逼你接受羞辱方式，用\"不管了\"冷处理让你不安。","moves":["羞辱常态化","道德贬低","冷暴力"],"choices":[{"type":"软弱型","text":"我会把这次教训记下来，下次提前检查，尽量不再让您在会上提醒。","meaning":"你把\"公开点你\"理解成自己没做好导致的结果，等于默认以后还可以用公开施压来纠正你。","guidance":"会后要把方式单独拿出来谈：这次问题我会改，但公开提醒会影响团队对我的信任，以后能否先私下沟通？"},{"type":"中立型","text":"我不是不领情，是公开说这事影响大家对我的判断，活儿不好推了。您要是真为我好，咱们会后单独过一下，我把情况说清楚。","meaning":"你把\"领情\"和\"方式\"分开谈，但\"我不是不领情\"还是在对方框架里打转。","guidance":"直接约时间：今天下午您有空吗？我把这件事完整说一遍，您听完再判断。把\"为我好\"落到实处。"},{"type":"边界型","text":"玻璃心是说不得，但\"公开点我让大家引以为戒\"这事儿，戒的是我还是事？如果是事，咱们把事摆开讲清楚；如果是我，那这就不叫为我好了。我建议会后单独聊，对事不对人。","meaning":"你戳破了\"引以为戒\"的包装——戒事还是戒人，逼对方表态。","guidance":"说完直接约时间落实私下沟通，不留在公开场合纠缠。如果对方拒绝私下聊，说明他就是要当众立威，你需要考虑留痕和向上反馈。"},{"type":"回击型","text":"您说不管就不管？那这事儿就这么悬着？问题没解决，您倒是潇洒。行，那我自己处理，处理结果我抄送您一份，您看不看随意。","meaning":"你接住\"撒手不管\"并反向追责，但\"抄送您一份\"有要挟意味，对方可能反弹。","guidance":"更稳：您说不管，那我就按我的理解处理了。处理方案我整理一下发您，您要是有意见随时说，没意见我就推进。"}]}},{"npc":"这个事你先私下解决，不要把记录发到群里。","intent":"阻止你留痕，降低你的自保能力。一旦没有文字记录，对方可以随时否认说过的话。","moves":["阻止留痕"],"choices":[{"type":"软弱型","text":"既然您担心群里影响不好，我就先不在群里同步了，私下把事情处理掉。","meaning":"你为了避免\"影响不好\"放弃公开记录，虽然保住了表面和气，但关键处理过程没有共同可见的依据。","guidance":"不发大群可以，但不能没有记录。至少私信确认要点，或在核心成员小范围同步事实进度。"},{"type":"中立型","text":"好的，那我在私信里跟您确认一下要点。","meaning":"你妥协了不发群，但保留了私信记录。这是可以接受的退让，但私信的效力不如群记录。","guidance":"私信确认时措辞要正式：按照我们沟通的，我执行以下几点……如无异议我按此推进。"},{"type":"边界型","text":"可以不发散群，但我会在工作群的核心成员范围内同步处理进度，这是正常的项目管理流程，不是公开矛盾。","meaning":"你做了区分：不是公开矛盾，是正常的项目同步。对方很难反驳\"项目管理流程\"。","guidance":"同步时只写事实：XX问题已处理，处理方式为XX，如无异议按此执行。不写情绪，只写事实。"},{"type":"回击型","text":"不让我发群？是不是怕留下证据？你心虚什么？","meaning":"你直接戳穿了对方的意图，但\"心虚\"这个指控太攻击性，容易激化矛盾。","guidance":"换一种说法：我理解有些信息不适合大群，但项目相关的关键决策需要有记录，我会在核心成员范围内同步，方便大家协同。"}],"followUp":{"npcByType":{"软弱型":"对，别发了。有什么事我们口头说就行，没必要搞得那么正式，都是自己人。","中立型":"私信也不用那么正式，口头说清楚就行了。你怎么这么麻烦，这点事还写个公文？","边界型":"项目管理流程？你这是借公事搞我吧？行，你发，出了事你自己担着。","回击型":"好好好，你爱发什么发什么，我不管了。反正我说过不该发的，出问题别找我。"},"intent":"用\"自己人\"\"没必要正式\"让你彻底放弃文字记录，用\"借公事搞我\"把你的合规留痕说成针对个人，用\"出事别找我\"撇清责任。","moves":["阻止留痕","人身污名","撇清责任"],"choices":[{"type":"软弱型","text":"我懂您的意思，既然都是自己人，这次就先按口头说的处理，不把流程弄得太重。","meaning":"你被\"自己人\"说服，进一步放弃文字确认；关系看似轻松了，责任和决策却都变成不可追溯的口头内容。","guidance":"越是\"自己人\"越要把事说清。至少自己建备忘，写明时间、对方指令和处理方式；最好发一句简短私信确认。"},{"type":"中立型","text":"不是写公文，是怕做错。这事儿几个关键点，我发您私信对一下，您看一眼就行，不耽误您时间。","meaning":"你把留痕包装成\"怕做错\"，但仍然在私信层面，对方若不回仍无约束力。","guidance":"私信发完加一句：如无异议我按此执行。对方不回，沉默即视为确认，你有了发送时间戳。"},{"type":"边界型","text":"同步进度不叫搞您，叫让大家知情。我只写事实：什么问题、怎么处理、谁在跟进，不写别的。如果您觉得这有问题，那是不是说明这事儿不想让大家知道？","meaning":"你反将一军，把\"为什么不让同步\"的疑问抛回去，让对方解释。","guidance":"说完直接发同步消息，只写事实不写评价。如果对方真在群里阻止，那条阻止本身就成了记录。"},{"type":"回击型","text":"您说不管就不管？这指令是您下的，责任哪能您一句话就甩干净。行，那我按流程同步，您要真不担责，书面说一句\"此事与我无关\"，我立刻照办。","meaning":"你逼对方书面撇清，等于变相留痕，但\"此事与我无关\"基本不可能说出口，容易僵。","guidance":"软一档：您说不管，那我只能按流程走。处理方案我同步给核心成员，您要是有意见随时提，没意见我就推进，大家都有记录，反而省心。"}]}},{"npc":"客户那边你去解释，反正最后文件是你发的。","intent":"截取流程最后一步，把整个链条的责任压给执行人，回避上游环节的问题。","moves":["截取流程","甩锅推责"],"choices":[{"type":"软弱型","text":"客户那边我先去安抚，毕竟文件是我发出去的，我尽量把影响降下来。","meaning":"你把\"最后发送\"等同于\"主要责任\"，愿意处理客户问题是退让，但没有说明内容、审核等上游环节。","guidance":"可以去沟通客户，但内部要先确认口径：文件经过哪些环节、谁确认过、你按什么标准发送，不能只让执行端兜底。"},{"type":"中立型","text":"我去解释可以，但这个文件是审核通过的，我需要知道怎么跟客户说。","meaning":"你想了解口径，但没有指出上游审核环节也有责任。","guidance":"补一句：文件发送前经过XX审核确认，我去解释时会如实说明整个流程，不会只让执行环节背锅。"},{"type":"边界型","text":"我可以去跟客户沟通，但需要说明的是，这个文件发送前经过审核确认，我会如实说明整个流程，而不是只让执行端承担。","meaning":"你愿意处理问题，但拒绝独自背锅。你把完整流程摆出来，让责任分配回到事实层面。","guidance":"跟客户沟通时，准备一份流程说明：文件经过了哪些环节，每个环节的确认人是谁。"},{"type":"回击型","text":"文件是我发的，但内容是谁定的？审核是谁签的？出事了就找我，功劳算谁的？","meaning":"你戳中了\"只追执行人不追决策者\"的问题，但连着问容易让对方觉得你在甩锅。","guidance":"换一种说法：我去沟通没问题，同时建议复盘一下整个流程，找出问题环节，这样跟客户解释才有说服力。"}],"followUp":{"npcByType":{"软弱型":"去吧去吧，好好说，别提审核的事，省得客户觉得我们不专业。这事儿你兜着点。","中立型":"怎么说是你的事，反正文件是你发的。你自己想办法圆，别让客户闹起来。","边界型":"你提审核流程是什么意思？甩锅？这事就是你没把好关，别往别人身上推。","回击型":"行，功劳你不要，责任你也不背。那你是来干嘛的？光拿钱不担事？"},"intent":"让你\"别提审核\"独自背锅，用\"甩锅\"反咬你把责任往上游推，用\"光拿钱不担事\"羞辱你让你羞愧接锅。","moves":["隐匿上游","反咬甩锅","羞辱施压"],"choices":[{"type":"软弱型","text":"我先按对外统一口径去说，不主动提内部审核，尽量别让客户觉得我们流程有问题。","meaning":"你接受了隐去审核环节的要求，把完整流程压缩成你一个人的解释任务，客户追问时你会被迫继续兜底。","guidance":"对外可以注意措辞，但内部不能糊涂。至少要求一份包含定稿、审核、发送的口径，避免你单独解释成个人失误。"},{"type":"中立型","text":"圆是可以圆，但客户要是追问\"这文件谁定的内容\"，我总得有个说法。您给我个口径，我好应对。","meaning":"你想要统一口径，但仍在\"独自圆\"的框架里，没有把上游拉进来。","guidance":"口径要包含完整流程：内容由XX定稿、XX审核确认、我按发送规范执行。这样既真实又分摊了责任。"},{"type":"边界型","text":"不是甩锅，是让客户看到我们流程是规范的，出问题是个别环节，不是整个团队不靠谱。我去说，但会说清楚：内容定稿、审核确认、执行发送，每个环节都有人。这样客户才信我们。","meaning":"你把\"提审核\"重新定义为\"维护公司专业形象\"，对方无法用\"甩锅\"反驳。","guidance":"跟客户沟通时带上流程图或确认记录，让客户看到责任是分明的，而不是你一个人在解释。"},{"type":"回击型","text":"拿钱担事我认，但得担我该担的。文件是我发的没错，内容不是我定的、审核不是我签的，这锅我一个人背，那定内容和审核的人是不是该把钱退了？","meaning":"你用\"退钱\"反将，逻辑狠，但容易被说成\"斤斤计较\"\"没有担当\"。","guidance":"收一收：我担执行的责任，没问题。但定内容和审核的环节也该各自说明，这样跟客户解释才完整，大家各自认各自的部分，不冤枉谁也不放过谁。"}]}},{"npc":"大家都很忙，你别总想着把责任分那么清。","intent":"用\"忙\"和\"团队氛围\"模糊责任归属，让你觉得追责任是\"不合群\"。","moves":["稀释责任","团队绑架"],"choices":[{"type":"软弱型","text":"我理解大家都忙，这次就先不纠结责任了，先把手头这摊活推进完。","meaning":"你为了照顾团队氛围放弃厘清责任，短期推进了事情，长期却保留了模糊地带，下次问题仍可能落到你头上。","guidance":"可以暂时不追责，但要区分\"不公开争\"和\"不记录\"。私下写清自己参与了哪些环节、没参与哪些环节。"},{"type":"中立型","text":"我不是要分责任，只是想理清楚谁做什么。","meaning":"你在退让了，\"不是要分责任\"等于接受了\"分责任=不好\"的预设。","guidance":"不要否认\"分责任\"。直接说：理清分工是为了效率，避免两个人做同一件事，或者都没人做。"},{"type":"边界型","text":"分清责任不是为了推卸，是为了高效。如果出了问题不知道找谁，反而更耽误事。我建议花五分钟过一下分工，对大家都好。","meaning":"你重新定义了\"分责任\"——不是自私，是效率。而且给了一个很小的时间成本\"五分钟\"，对方不好拒绝。","guidance":"过完分工后，发一条消息同步：按照沟通，分工如下……如无异议按此执行。"},{"type":"回击型","text":"大家都忙，那就更应该分清楚谁干什么，免得白忙活。你说别分清，是不是想出了事好找人背锅？","meaning":"你戳中了对方不想厘清责任的动机，但\"背锅\"这个指控会让对方防御。","guidance":"更冷静的说法：正因为大家都忙，才需要分工明确，这样各自专注自己的部分，效率最高。"}],"followUp":{"npcByType":{"软弱型":"这就对了。团队嘛，谁多干点少干点别计较，计较多了伤感情。","中立型":"理什么谁做什么，都是一摊活，谁有空谁就干了。你想那么多干嘛。","边界型":"五分钟？我觉得没必要。你这人怎么什么事都要分这么细？累不累啊。","回击型":"行，你爱分你分。我反正不参与这种没意义的事，到时候活儿没人干你别怪我。"},"intent":"用\"伤感情\"阻止你厘清责任，用\"累不累\"贬低你的专业习惯，用\"活儿没人干别怪我\"威胁你为模糊分工的后果兜底。","moves":["情感绑架","贬低专业","后果威胁"],"choices":[{"type":"软弱型","text":"为了不伤团队和气，我先把能做的做起来，具体谁负责哪块等后面遇到问题再协调。","meaning":"你把分工问题推迟到\"遇到问题再说\"，等问题发生时成本更高，责任也更容易被临时推给正在干活的人。","guidance":"退一步也要留底：我先做A部分，B和C我没有参与，后续需要谁牵头再确认。把边界写在工作记录里。"},{"type":"中立型","text":"不是想太多，是上次就因为没分清，活儿卡了两天。我不想这次再卡。要不就两个人花两分钟对一下谁负责哪块，对完各干各的。","meaning":"你用\"上次卡了两天\"作为具体理由，比\"为了效率\"更有说服力。","guidance":"对完立刻发消息：按沟通，A部分我负责，B部分XX负责，有交叉的地方XX牵头。留痕。"},{"type":"边界型","text":"累不累不知道，但出了事扯皮更累。分清不是为难谁，是让每个人心里有数。五分钟都嫌多，那出问题的时候花的时间可能是五小时。您看是现在花五分钟，还是以后花五小时？","meaning":"你用\"现在五分钟 vs 以后五小时\"的成本对比，把分清责任的价值量化。","guidance":"说完直接拉个简单的分工表发出来，不等人表态。先做了再说，对方不反对就是默认。"},{"type":"回击型","text":"您说不参与就不参与？那这摊活到底谁牵头？您要是不认，那我可就按自己理解的干了，到时候方向不对，可别说是我自作主张。","meaning":"你接住威胁并反向把\"模糊\"的后果甩回去，但容易被说\"顶撞\"。","guidance":"软一档：我不是要分得你死我活，是想有个牵头人。您说谁牵头，我配合，这样活儿也不至于没人接。"}]}},{"npc":"你要是不愿意做，我也不勉强，只是以后机会可能就少了。","intent":"用\"机会\"做威胁，让你在不合理要求面前不敢拒绝。","moves":["威胁施压","机会诱惑"],"choices":[{"type":"软弱型","text":"我当然珍惜机会，也不是不愿意做，这个任务我先接下来，您别觉得我在推。","meaning":"你急着证明自己愿意，把\"机会会变少\"的威胁接住了，任务是否合理、资源是否匹配都被放到后面。","guidance":"珍惜机会不等于无条件接。可以说：我愿意承担，但需要先确认范围和优先级，这样机会才能做出结果。"},{"type":"中立型","text":"我不是不愿意，只是想确认一下这个任务的范围。","meaning":"你在解释自己不是不愿意，但这个框架里你已经处于\"需要证明自己\"的位置了。","guidance":"不需要证明\"我愿意\"。直接讨论任务本身：这个任务的范围、时间和资源支持，我们过一下？"},{"type":"边界型","text":"我愿意承担合理的任务，也珍惜成长机会。但机会和额外负担是两回事，我想确认这个任务是否在我的职责范围内，以及对应的资源支持。","meaning":"你区分了\"机会\"和\"负担\"，没有被威胁绑架，也没有正面冲突。","guidance":"保持这个立场。如果对方真的因为你拒绝一个不合理要求就减少机会，那这个环境本身就有问题。"},{"type":"回击型","text":"你这是威胁我？不愿意多干活就没机会，那这机会本来就是拿劳动换的，不是培养是交易。","meaning":"你戳中了\"用机会做威胁\"的本质，但\"威胁\"这个词会让对方直接防御。","guidance":"更巧妙的说法：我很珍惜这里的机会，也想长期发展。正因如此，我更希望把精力放在核心任务上，保证产出质量。"}],"followUp":{"npcByType":{"软弱型":"这才对嘛。那这个活就交给你了，好好干，我看着呢。机会是给准备好的人的。","中立型":"确认什么范围，让你做就做。想清楚，机会不等人，错过别后悔。","边界型":"你看看，一说让你做事你就有条件。这态度，能有什么发展？你自己掂量掂量。","回击型":"行，那你别做了。机会我会给愿意做的人，你好自为之。"},"intent":"用\"我看着呢\"既给甜头又施压，用\"机会不等人\"制造紧迫感逼你放弃确认，用\"给愿意的人\"制造竞争焦虑。","moves":["施压收编","制造紧迫","竞争焦虑"],"choices":[{"type":"软弱型","text":"既然您这么看重我，我会把这个活当成机会认真做，先不耽误您时间问太多。","meaning":"你为了不显得挑剔而放弃确认，\"机会\"包装成功压过了范围、资源和优先级这些关键条件。","guidance":"把确认嵌进执行：我先列个计划给您过目，资源需要XX支持，您确认后我马上推进。"},{"type":"中立型","text":"不是错过不错过，是我手上还有活，两个都接我怕哪个都做不好。您帮我排个序，哪个优先？","meaning":"你用\"怕做不好\"作为理由要优先级，比\"要确认范围\"软，但仍然没接\"机会不等人\"的威胁。","guidance":"排完序留痕：按您指示，X优先，Y排后，Y的节点顺延到X完成后。"},{"type":"边界型","text":"有条件不是态度问题，是想把事做好。您给我机会我珍惜，但机会也得配资源才能落地。这个任务的范围、节点、支持，咱们花三分钟定一下，定完我全力推进。","meaning":"你把\"有条件\"重新定义为\"为做好事\"，并给了一个很小的成本\"三分钟\"让对方无法拒绝。","guidance":"定完立刻发确认消息。如果对方说\"你自己看着办\"，书面回复：那按以下方案执行，如无异议我推进。"},{"type":"回击型","text":"给愿意的人？那您给吧。不过这活儿该谁做、资源多少、考核怎么算，您跟\"愿意的人\"也得说清楚，不然换谁都做不长，到时候别说是我撂挑子。","meaning":"你戳破\"愿意的人\"的虚张声势，但语气硬，对方可能真记仇。","guidance":"收一档：我不是不愿意，是想把规则说清楚。规则清楚了，谁都愿意做；规则不清，谁接都吃亏。您说是不是这个理？"}]}},{"npc":"这点加班都接受不了，以后怎么承担更大的事？","intent":"把额外加班包装成能力筛选，让你觉得拒绝加班就是没能力。","moves":["包装压榨","能力羞辱"],"choices":[{"type":"软弱型","text":"既然这是关键节点，我这几天就先加一下，尽量把任务赶出来。","meaning":"你把加班当成能力证明来退让，没有确认这是不是临时节点、后续怎么补偿或调整排期，容易让加班常态化。","guidance":"可以配合关键节点，但要补一句：这次加班我按临时节点支持，加班记录和后续调休按公司流程走。"},{"type":"中立型","text":"不是接受不了，只是想了解一下加班的原因和频率。","meaning":"你想了解情况，但\"不是接受不了\"还是在对方的框架里自证。","guidance":"不需要自证。直接问：这个加班是因为项目节点还是常规安排？如果是常规安排，需要调整一下排期。"},{"type":"边界型","text":"加班不是能力问题，是排期和资源问题。我可以配合关键节点加班，但如果是常态，说明排期需要优化，而不是用加班掩盖规划问题。","meaning":"你把\"加班\"从能力问题重新定义为管理问题，让对方无法用\"能力\"来压你。","guidance":"保持这个框架。如果是临时加班，记得留记录，方便后续申请调休或加班费。"},{"type":"回击型","text":"加班多就是能力强？那保洁阿姨天天加班，怎么没升职？","meaning":"你戳中了\"加班=能力\"的荒谬，但保洁阿姨这个比喻容易引发不必要的争议。","guidance":"更精准的说法：我理解关键节点需要加班，但用加班频率来衡量能力，会让大家为了表现而加班，反而降低效率。"}],"followUp":{"npcByType":{"软弱型":"这就对了。以后这种节点你多担待点，年轻人嘛，扛一扛就过去了。","中立型":"原因？原因就是项目要赶。你别问那么多，先加着，哪有那么多为什么。","边界型":"排期问题是管理层的事，你操什么心？让你加班你就加，哪来那么多道理。","回击型":"行，你不加就不加。但你记住，这种态度我记着呢，到时候评优晋升别怪我没提醒你。"},"intent":"用\"年轻人扛一扛\"把常态化加班合理化，用\"别问为什么\"压制你的合理追问，用\"评优晋升\"做长期威胁让你就范。","moves":["常态化合理化","压制追问","长期威胁"],"choices":[{"type":"软弱型","text":"我先扛过这个节点，调休这块您方便的话后面帮我看一下就行。","meaning":"你继续把加班放在前面，把调休放成\"方便的话后面看\"，对方很容易用节点紧、以后再说来弱化你的权益。","guidance":"把调休从请求变成流程：我今晚加班支持节点，加班记录我会提交，后续按制度申请调休。"},{"type":"中立型","text":"我不是问为什么问东问西，是想搞清楚这次加班到什么时候、是不是就这一阵。心里有数我才好安排别的活。","meaning":"你把\"问原因\"换成\"问节奏\"，更务实，但仍在自证\"不是问东问西\"。","guidance":"直接说：这次加班预计持续到X号？我手上的Y项目节点是Z号，两边冲突的话您帮我排一下。把冲突抛回给对方。"},{"type":"边界型","text":"排期我是不操心的，但加班影响的是我手上的交付。这个节点加班，A项目就会延期，您看是A延期还是这个加班调资源？您定，我执行。","meaning":"你用\"交付冲突\"把加班成本可视化，逼对方在两个项目间做选择，而不是你一个人扛。","guidance":"对方定完留痕：按您指示，A项目节点顺延至X号，加班优先支持Y项目。书面确认。"},{"type":"回击型","text":"您记着，那我也记着：这次加班是临时安排还是常态？如果是常态，那是不是该走正式流程调岗调薪？拿评优晋升吓我，可评优也得看产出，不是看谁加班多。","meaning":"你反将\"评优\"一军，逻辑硬，但容易被说\"刺头\"\"不好管\"。","guidance":"收一档：我理解节点紧需要加班，那就按临时加班走，调休或加班费按公司制度来。如果是常态，咱们正式聊聊排期和岗位，别一边让加班一边说这是考验。"}]}},{"npc":"我说话直，你别玻璃心。","intent":"把冒犯包装成性格特点，让你觉得受伤是你的问题，不是他的问题。","moves":["贴标签攻击","道德绑架"],"choices":[{"type":"软弱型","text":"我知道您说话比较直接，我不会往心里去，您继续说问题就行。","meaning":"你把冒犯解释成对方的直接风格，并主动表示不介意，等于允许对方继续用这种方式评价你。","guidance":"可以接纳直接沟通，但要限定：您可以直接说事，但涉及人身标签的说法我希望能换成具体问题。"},{"type":"中立型","text":"我不是玻璃心，只是觉得有些说法不太合适。","meaning":"你在自证\"不是玻璃心\"，但一旦开始自证，你就已经处于劣势了。","guidance":"不要说\"我不是玻璃心\"。直接回应内容本身：你刚才说的那个评价，我不认同，原因是……"},{"type":"边界型","text":"说话直和说话伤人是两回事。我可以接受直接，但不接受冒犯。您想表达什么可以直接说，但请不要用评价性标签。","meaning":"你区分了\"直率\"和\"冒犯\"，让对方无法用\"我说话直\"来为不当言论开脱。","guidance":"保持这个区分。如果对方说\"我就是这脾气\"，可以回：脾气是您的自由，但沟通方式我们可以一起优化。"},{"type":"回击型","text":"你说话直，我耳光也直，要不要试试？","meaning":"这个回应爽感拉满，但威胁性太强，职场里绝对不能用。","guidance":"职场回击靠的是逻辑不是暴力。可以冷回：说话直不代表说得对，您说的这个点，我有不同看法，我来说一下。"}],"followUp":{"npcByType":{"软弱型":"对嘛，大气一点。我以后说话也不跟你绕弯子了，有什么说什么，你别往心里去。","中立型":"不合适？我这人就这样，你受不了是你自己的问题。我说话从来不拐弯。","边界型":"冒犯？我说话直就成冒犯了？你这人太难伺候了，说都说不得。","回击型":"好好好，我错了行吧？以后我闭嘴，什么都不说了，省得惹你。"},"intent":"用\"大气一点\"给你戴高帽让你继续忍受，用\"受不了是你问题\"把冒犯合理化，用\"我闭嘴\"装受害者让你愧疚退让。","moves":["高帽收编","合理化冒犯","装受害者"],"choices":[{"type":"软弱型","text":"您不用绕弯子，哪里觉得不对就直接讲，我会尽量从工作角度理解。","meaning":"你把\"大气\"高帽接了下来，给了对方继续直接甚至冒犯的空间；你只强调自己会理解，没有要求对方就事论事。","guidance":"听可以，但别无条件接：您直接讲具体事项我接受，如果是评价我这个人，我希望我们换成具体行为来讨论。"},{"type":"中立型","text":"不是受不了，是有些话说出来不利于推进事。您想直说没问题，但能不能就事论事，别带人身评价？","meaning":"你区分了\"直说\"和\"人身评价\"，但\"不是受不了\"还是在自证。","guidance":"去掉\"不是受不了\"。直接说：您刚才那句XX，我不认同，原因是……把焦点拉回内容，不谈受不受得了。"},{"type":"边界型","text":"难伺候的不是我，是沟通有标准。您直说我欢迎，但带标签的\"你这人怎么这样\"不算直说，算评价。以后您直说事，我直说看法，咱们都不带人身，行不行？","meaning":"你给\"直说\"立了个标准——对事不对人，并邀请对方一起遵守。","guidance":"说完后真的就事论事回应。如果对方又带标签，立刻叫停：您看，又带评价了。咱们说事。"},{"type":"回击型","text":"您说闭嘴就闭嘴？那这事儿谁推进？您是来工作的还是来赌气的？直说可以，但别拿\"我错了\"当挡箭牌，该说的事还得说清楚。","meaning":"你戳破\"装受害者\"并把对方拉回正事，但\"赌气\"一词偏冲。","guidance":"软一档：您别说气话。我不针对您这个人，只针对刚才那句话。您要把事说清楚，我听着；带情绪的咱们放一放，先把事办了。"}]}},{"npc":"你先做个初版，范围后面再慢慢定。","intent":"先让你投入，再逐步扩大范围，最终你做的远比最初约定的多。","moves":["范围扩张","温水煮蛙"],"choices":[{"type":"软弱型","text":"我先动手出一个初版，范围后面您看了再帮我调整，我尽量快点给您东西。","meaning":"你接受了边做边定范围，短期显得配合，长期会让每一次新增要求都变成\"正常调整\"而不是范围变更。","guidance":"先做也要给初版划线：我先按A、B、C三块做初版，X号交；新增内容后续另排。"},{"type":"中立型","text":"好的，那大概需要包含哪些内容？","meaning":"你想了解范围，但\"大概\"给了对方模糊空间，后续仍可以无限扩展。","guidance":"把\"大概\"变成\"明确\"：我先列一个初版内容清单，您确认后我开始做，后续如果有调整，我们走变更流程。"},{"type":"边界型","text":"可以，我先把初版范围列一个清单，您确认后开始。后续如果有调整，我们再沟通时间和资源。这样避免反复返工。","meaning":"你设定了\"先确认范围再执行\"的流程，后续变更有了明确的对照基线。","guidance":"清单确认后留文字记录。后续对方加需求时，你可以说：这个不在初版范围内，需要单独排期。"},{"type":"回击型","text":"范围都不定就让我做？你是让我猜还是让你改？到时候做完了你说不是你要的，算谁的？","meaning":"你指出了\"范围不清就执行\"的风险，但语气太冲，对方可能说你态度不好。","guidance":"同样的意思换个说法：为了避免做出来不是您想要的，我先整理一个初版范围清单，您过一遍确认，这样效率最高。"}],"followUp":{"npcByType":{"软弱型":"好，做起来吧。做着做着方向就清楚了，别想那么多，先出东西。","中立型":"内容你看着做就行，先出东西，我们再调。别磨蹭，时间紧。","边界型":"清单？太繁琐了。你先做，有什么我随时加，灵活一点嘛。","回击型":"行，那你别做了。这么磨叽，等你做完黄花菜都凉了，我找别人。"},"intent":"用\"做着就清楚\"诱导你无范围投入，用\"随时加\"为后续扩范围铺路，用\"找别人\"威胁你放弃确认范围。","moves":["诱导无范围","为扩范围铺路","威胁替代"],"choices":[{"type":"软弱型","text":"为了先有东西可看，我就按自己理解先做一版，后面您再慢慢提修改。","meaning":"你把无范围投入合理化为\"先有东西\"，等对方持续加需求时，你很难区分修改、返工和新增范围。","guidance":"哪怕先出东西，也要发一版最小范围：初版只覆盖这三点，X号交；超出部分我们下一版排期。"},{"type":"中立型","text":"看着做也行，但我总得有个方向。您说初版是给谁看的、解决什么问题，我好定深浅。","meaning":"你用\"给谁看\"\"解决什么\"探出范围边界，比\"包含哪些\"更聪明，但仍是单方确认。","guidance":"问完后自己总结一版发确认：按您说的，初版面向XX，重点解决XX，我按这个做。留痕。"},{"type":"边界型","text":"灵活不是没边界。我列个最简清单，三块内容、X号交付，您看一眼说\"行\"，我就开干。后续要加，咱们单排时间，不挤这一版。这样您拿得快，我也不返工。","meaning":"你给了\"最简清单\"+\"一眼确认\"，把成本压到最低，对方没有理由拒绝。","guidance":"发完清单对方若不回，按默认执行。后续加需求时拿出清单：这个不在初版，单排。"},{"type":"回击型","text":"找别人？行。不过我跟您说清楚：这活儿没范围，换谁来都得返工。您要真赶时间，就更该花十分钟把范围定死，不然做出来不是您要的，更耽误。","meaning":"你戳破\"找别人\"的虚张声势，但容易被说\"顶撞\"。","guidance":"收一档：我不是磨叽，是怕做错更耽误。您给我十分钟，我把范围列出来您过一眼，过完我立刻动手，保证X号交。"}]}},{"npc":"这个失误大家都有责任，但你是执行人，先写个复盘。","intent":"口头承认多人责任，实际让你单独承担，通过\"复盘\"固化\"是你的问题\"。","moves":["稀释责任","甩锅推责"],"choices":[{"type":"软弱型","text":"既然我是执行人，我先把复盘写出来，其他环节的问题后面再看怎么补。","meaning":"你接受了由执行人先写复盘的安排，文档一旦以你的视角成稿，就很容易被理解成主要问题在你这里。","guidance":"复盘可以由你起草，但标题和结构要写成\"全流程复盘\"，决策、审核、执行、协同各环节都留栏。"},{"type":"中立型","text":"复盘我可以写，但其他环节的问题也需要提一下。","meaning":"你想写全面，但\"提一下\"力度太弱，最终复盘可能还是以你的部分为主。","guidance":"明确说：复盘我会写，但需要包含完整流程链，每个环节的负责人和决策过程都需要记录。"},{"type":"边界型","text":"复盘应该覆盖完整流程，不能只让执行人写。我负责的部分我会写，但决策、审核、协同环节也需要各负责人提供内容，这样复盘才有意义。","meaning":"你同意复盘，但坚持复盘要完整，不能变成\"你的检讨书\"。","guidance":"写复盘时用事实描述，不用评价性语言：XX环节，负责人XX，决策内容XX，执行结果XX。"},{"type":"回击型","text":"大家都有责任，凭什么我写复盘？你是觉得执行人好欺负是吧？","meaning":"你指出了\"只让执行人写复盘\"的不合理，但\"好欺负\"太情绪化。","guidance":"更冷静的说法：既然是团队问题，复盘应该由各环节负责人分别提供内容，我汇总执行部分，其他部分麻烦对应负责人补充。"}],"followUp":{"npcByType":{"软弱型":"好，你先写。其他人的部分后面他们自己补，你把你的写扎实点。","中立型":"提一下就行，主要还是写你自己这块。毕竟你是执行人，复盘重点在你。","边界型":"你写个复盘怎么这么多事？让你写你就写，哪来那么多道理。","回击型":"行，那你自己看着办。反正领导问起来，我就说执行环节的问题。"},"intent":"用\"后面补\"无限拖延他人责任，用\"重点在你\"把复盘变成你的检讨书，用\"我就说执行环节\"反向甩锅威胁你。","moves":["拖延他人责任","检讨化","反向甩锅"],"choices":[{"type":"软弱型","text":"我先把执行环节写扎实，其他人的部分等他们后面补，我写完先发您看看。","meaning":"你顺着\"先写你这块\"把复盘重心放到自己身上，其他环节是否补充完全不可控，最后可能只剩你的执行问题。","guidance":"如果只掌握执行部分，就在全流程模板里只填执行栏，其他栏标注\"待对应负责人补充\"，不要把复盘写成个人检讨。"},{"type":"中立型","text":"重点在我可以，但其他环节不写，这复盘就是片面的，领导看了还以为就我一个人的问题。我建议每块都写，我汇总。","meaning":"你点出了\"片面复盘\"的风险，但\"我建议\"力度偏弱，对方一句\"先写你的\"就能打发。","guidance":"直接行动：我建个复盘文档，分四个环节，每个环节留一栏，各负责人填自己的。我把执行栏填了，其他的麻烦转给对应人。"},{"type":"边界型","text":"不是多事，是复盘得完整才有用。我只写执行环节，那决策谁定的、审核谁签的，这些不写，复盘就是半截子。我负责执行部分我认，但请各环节负责人也提供各自的内容，我统一汇总，这样领导看到的才是全貌。","meaning":"你认自己该认的，同时把其他环节的责任人拉进来，让复盘无法变成你一个人的检讨。","guidance":"汇总时用统一模板：环节-负责人-决策/动作-结果。谁没填，空着也是信息。发出来cc领导。"},{"type":"回击型","text":"您说执行环节？那我问您：指令是您下的，审核是您签的，执行是我做的，您打算只报执行这一环？那行，那我也只写执行，指令和审核两栏我空着，备注\"上级未提供\"，让领导自己看。","meaning":"你用\"空着备注\"反将，让对方的甩锅暴露在领导面前，但容易被说\"刺头\"。","guidance":"收一档：我不是要为难谁，是想让复盘完整。我写执行，您把指令和审核的背景补一下，咱们一起交，领导看着也清楚。"}]}},{"npc":"你不要老是要资源，优秀的人会自己想办法。","intent":"用\"优秀\"标准掩盖资源缺失，让你觉得要资源=不够好。","moves":["道德绑架","标准绑架"],"choices":[{"type":"软弱型","text":"我先不提资源了，自己再想想有没有替代办法，尽量把结果做出来。","meaning":"你把要资源收了回去，接受了\"优秀的人自己想办法\"的标准；后续资源不足导致延期或降质，也容易被算到你能力上。","guidance":"自己想办法可以，但要同步风险：在没有XX资源的情况下，我会尝试替代方案，交付时间和质量可能受影响。"},{"type":"中立型","text":"我不是要资源，只是觉得没有这些确实不好做。","meaning":"你在解释自己不是\"要资源\"，但这个框架里你已经把\"要资源\"当成了不好的事。","guidance":"不要否认\"要资源\"。直接说：完成这个任务需要XX资源，目前缺XX，需要协调支持。"},{"type":"边界型","text":"优秀的定义是高质量交付，而不是无资源交付。要资源是为了对结果负责，不是偷懒。目前这个任务缺XX，需要协调，否则交付标准需要相应调整。","meaning":"你重新定义了\"优秀\"——是结果好，不是条件差还能扛。同时给了对方选择：给资源或调整标准。","guidance":"保持这个逻辑。如果对方还是不给资源，书面确认：在现有资源条件下，交付标准调整为XX。"},{"type":"回击型","text":"优秀的人自己想办法？那你招我干什么，你自己想办法不就行了？","meaning":"你戳中了\"既要不给资源又要结果\"的矛盾，但直接怼领导容易吃亏。","guidance":"更聪明的说法：我理解资源有限，那我们一起排一下优先级：如果先做XX，XX部分需要延后，您看怎么安排？"}],"followUp":{"npcByType":{"软弱型":"对嘛，自己想办法。我相信你能搞定的，加油。","中立型":"不好做也得做，这就是工作。你别老想着要东西，想办法才是本事。","边界型":"你又在要资源了。我说了，优秀的人不需要这些。你是不是对自己要求太低？","回击型":"行，那我不说了。你自己看着办，做不出来别找我。"},"intent":"用\"加油\"敷衍了事让你独自承担资源缺失，用\"对自己要求太低\"羞辱你放弃要资源，用\"做不出来别找我\"撇清责任。","moves":["敷衍施压","羞辱施压","撇清责任"],"choices":[{"type":"软弱型","text":"我先自己试着拆方案，能协调到什么就用什么，尽量不因为资源问题影响交付。","meaning":"你独自吸收了资源缺口，把\"尽量不影响\"扛到自己身上；如果最后仍受影响，对方会说你办法不够多。","guidance":"试方案前先落文字：缺XX资源，我会用替代方案推进，但预计存在A风险，请您知悉或协调。"},{"type":"中立型","text":"想办法可以，但有些事没资源就是做不了，不是我要求低。比如XX这一步，没有人/工具就是卡死。我先把能做的做了，这步您看怎么协调？","meaning":"你区分了\"能想办法的\"和\"卡死的\"，把卡死的抛回给对方，但语气仍偏软。","guidance":"说完后书面列出：已完成的、能自己做的方法、卡死需协调的。让资源缺口可视化。"},{"type":"边界型","text":"要求低不低看结果，不看会不会张嘴要。我现在告知您：缺XX资源，这件事的交付会延期/降标，这是客观条件，不是我偷懒。您有两个选择：协调资源，或者接受延期降标。您定，我执行。","meaning":"你把\"要资源\"变成\"客观告知风险\"，并给对方二选一，把决策权交回去。","guidance":"对方定完书面确认：按您指示，方案A/B执行，交付标准/时间为XX。不留模糊。"},{"type":"回击型","text":"做不出来别找您？这任务是您派的，资源是您批的，做不出来您一句\"别找我\"就完了？那行，我书面说一下：因缺少XX资源，交付将延期至X号，届时请知悉。","meaning":"你用\"书面告知\"反制\"撇清责任\"，但容易被说\"顶撞\"\"推卸\"。","guidance":"收一档：我不是推卸，是提前同步风险。缺资源这事我告知您了，您要是协调不了，那交付标准咱们重新定一个，我按新标准来，这样大家都心里有数。"}]}},{"npc":"领导问起来，你就说是你理解偏差。","intent":"诱导你替上级承担沟通责任，掩盖他指令不清的问题。","moves":["甩锅推责","诱导背锅"],"choices":[{"type":"软弱型","text":"如果这样能先把事情压下来，我跟领导说是我理解上有偏差，后面内部再复盘。","meaning":"你为了不把事情闹大而替对方认下\"理解偏差\"，这会把指令不清固化成你的能力问题。","guidance":"不要替别人认错。可以缓和地说：我会如实说明执行过程，如果有偏差，我们一起复盘指令和确认环节。"},{"type":"中立型","text":"可是我确实是按您的意思做的啊……","meaning":"你想表达自己没错，但没有明确拒绝\"说是理解偏差\"。对方可能顺势说：那你就这么跟领导说吧。","guidance":"明确拒绝：我按您的指令执行，如果结果有偏差，说明指令本身需要复盘，我不能说是我理解的问题。"},{"type":"边界型","text":"我不能这么说。我是按您的指令执行的，如果指令有模糊的地方，我们应该一起复盘沟通方式，而不是让我承担理解偏差的责任。","meaning":"你明确拒绝背锅，同时把问题拉回\"指令是否清晰\"这个事实层面。","guidance":"说完后建议留一条文字记录：按照我们沟通的，我执行了XX，结果与预期有偏差，建议复盘指令环节。"},{"type":"回击型","text":"你说的你就自己认，别让我替你擦屁股。","meaning":"你拒绝了背锅，但\"擦屁股\"太粗俗，职场中不宜这么说。","guidance":"更专业的说法：我会如实说明执行过程，包括指令内容和确认过程。如果需要复盘，我可以配合。"}],"followUp":{"npcByType":{"软弱型":"对，就这么说。这样对大家都好，别把事情搞大，你还年轻，扛一扛就过去了。","中立型":"是按我意思做的，但领导不知道这些细节，你就说理解偏差，简单，省得扯一堆。","边界型":"你纠结这个干嘛？让你这么说就这么说，是不是不听话？这点小事都不配合？","回击型":"行，你不说就不说。那领导问起来我自己解释，到时候别怪我没罩着你。"},"intent":"用\"对大家都好\"\"扛一扛\"诱导你认了，用\"不听话\"\"不配合\"压制你的拒绝，用\"我自己解释\"反向威胁让你害怕被单独甩出去。","moves":["诱导认责","服从性施压","反向威胁"],"choices":[{"type":"软弱型","text":"我不想把事情弄复杂，就先按您说的口径认成理解偏差，之后再私下把情况说清。","meaning":"你把\"对大家都好\"放在前面，接受了公开背锅、私下再说的安排；但公开记录一旦形成，私下解释很难扭转。","guidance":"不能先认再解释。汇报时直接说事实：我按XX指令执行，确认过程是XX，偏差点在XX，建议一起复盘。"},{"type":"中立型","text":"简单是对您简单，对我可一点都不简单。理解偏差一旦记下来，以后啥事都往我身上推。要不这样，您跟我一起去跟领导说，我把执行过程讲一遍，您补充指令背景，这样最清楚。","meaning":"你用\"一起去说\"把对方拉到场，避免你单独背锅，但对方多半会拒绝。","guidance":"对方拒绝同去，你就单独如实汇报，并提前发一份执行过程说明给对方抄送领导：我已将执行过程同步，如需补充指令背景请补充。"},{"type":"边界型","text":"不是不听话，是这话我不能说。我按指令执行，过程都有记录，说\"理解偏差\"等于否定我自己，也等于让真正的指令问题被盖住。我会如实汇报执行过程和指令内容，如果您觉得指令环节需要补充说明，请您一起。","meaning":"你明确划线：执行过程我会如实说，指令环节请你自己解释，我不替你背。","guidance":"说完后立刻整理一份\"执行说明\"留底：指令内容、确认时间、执行过程、结果偏差原因。汇报时带着这份。"},{"type":"回击型","text":"您自己解释？那正好，我求之不得。您要是如实说指令是您下的，我感谢您；您要是把锅全甩我头上，那我手上的执行记录、确认消息可都还在，到时候谁说真话谁说假话，一查便知。","meaning":"你用\"记录在手\"反制甩锅，气场足，但威胁意味浓，对方可能提前销毁证据或先发制人。","guidance":"收一档：我不想闹到那一步。我的意思是，咱们各自如实说，我讲执行，您讲指令，这样领导看到的是完整情况，对您也好。"}]}},{"npc":"我觉得你最近状态不太稳定，要不要反思一下？","intent":"把工作反馈扩大到人格和状态评价，让你陷入自我怀疑，而不是讨论具体问题。","moves":["贴标签攻击","人格否定"],"choices":[{"type":"软弱型","text":"可能我最近确实表现得不够稳，我回去好好想想哪里需要调整。","meaning":"你接受了\"状态不稳定\"这个笼统评价，却没有问具体表现；对方以后可以用状态问题否定你的工作反馈。","guidance":"不要先接人格评价。改成：如果有具体工作表现需要调整，您指出来，我按具体事项改。"},{"type":"中立型","text":"我最近确实有点累，但工作都按时完成了。","meaning":"你承认了\"累\"，给了对方把柄。对方可以说：你看你都说自己累了，那确实是状态问题。","guidance":"不要自证状态。直接问：您说的状态不稳定，是指某个具体项目的处理方式有问题吗？我们聊聊具体事。"},{"type":"边界型","text":"如果您觉得我的工作有需要改进的地方，请具体指出，我来调整。但\"状态不稳定\"是个人评价，不太适合作为工作反馈，我希望我们的沟通围绕具体事展开。","meaning":"你拒绝接受人格评价，同时表示愿意改进具体问题。既守住了边界，又显得专业。","guidance":"保持这个态度。如果对方说\"我只是关心你\"，可以回：谢谢关心，工作上的事我们可以直接讨论。"},{"type":"回击型","text":"你觉得我状态不好？那是不是你管理方式让我状态不好的？你怎么不反思一下？","meaning":"你反将一军，但\"你怎么不反思\"太对抗性，容易激化矛盾。","guidance":"更冷静的说法：如果我的工作表现有变化，可能和近期的工作安排有关。我们可以一起看看哪些因素影响了效率，这样更有建设性。"}],"followUp":{"npcByType":{"软弱型":"对，好好反思反思。最近确实不在状态，你自己也感觉到了吧？那就对了。","中立型":"累就对了，说明你效率有问题。你好好想想怎么调整，别老拿累当借口。","边界型":"你还跟我掰扯？我关心你你还挑我措辞？你这人怎么这么难沟通？","回击型":"行，我管理方式有问题。那你说，我该怎么管你？你来教我？"},"intent":"用\"你自己也感觉到了\"坐实标签，用\"效率有问题\"把锅扣死，用\"难沟通\"反咬你的合理追问，用\"你来教我\"反讽让你闭嘴。","moves":["坐实标签","反咬追问","反讽压制"],"choices":[{"type":"软弱型","text":"也许我自己还没意识到问题，我再从最近几个项目里找找原因，尽快调整状态。","meaning":"你继续把问题内化成\"我状态不好\"，没有要求对方举例，反而帮对方坐实了这个标签。","guidance":"把反思落到具体事：您说的不在状态具体是哪次交付或哪次沟通？指出来我能改，光说状态我没法定位。"},{"type":"中立型","text":"累不是借口，但效率跟工作量也有关系。您要是觉得我效率低，咱们看看具体哪件事慢了，是流程问题还是我的问题，对账更清楚。","meaning":"你把\"效率\"拉回具体事，但仍接了\"效率有问题\"的框架。","guidance":"对账时带上数据：A项目按期交付，B项目耗时XX，其中XX环节等了XX审批。让效率问题归位。"},{"type":"边界型","text":"不是挑措辞，是工作反馈得落到事上。您说状态、说效率，都是评价；我想要的是具体哪件事、怎么改。您举一个例子，我们对着例子聊，比我反思半天管用。","meaning":"你坚持把评价拉回事实，并用\"对着例子聊\"给对方台阶。","guidance":"对方若举不出例子，就说：那可能是我误会了，咱们以后有事直接说事，不绕状态。如果对方硬举，就事论事回应那件事。"},{"type":"回击型","text":"教您倒不敢，但起码别用\"状态\"代替\"事情\"。您要是真关心，就说说哪件事我做得不对；要是说不出具体事，那这\"状态不稳定\"也就别提了，提了也没用。","meaning":"你用\"说不出就别提\"反将，逻辑硬，但\"教您\"带刺，对方可能记恨。","guidance":"收一档：我不是要您难堪。我就是想就事论事，您说具体事，我改；说状态，我也改不了。咱们聊点能落地的，行不？"}]}},{"npc":"你这么回我，是不是对我有意见？","intent":"把任务讨论转成态度审判，让你不得不解释\"我没有意见\"，从而偏离正事。","moves":["转移话题","态度审判"],"choices":[{"type":"软弱型","text":"我对您个人肯定没有意见，刚才可能说得太急了，我先调整一下表达。","meaning":"你急着自证没有意见，话题从方案变成了你的态度；对方成功把具体问题转移成关系问题。","guidance":"可以照顾关系，但别丢正事：我不是针对您个人，我想讨论的是方案第X点，我们先把这个点定下来。"},{"type":"中立型","text":"我不是对您有意见，我只是觉得这个方案有问题。","meaning":"你还在解释\"我没有意见\"，仍然在对方的框架里。","guidance":"不需要否认\"有意见\"。直接说：我对这个方案有不同看法，我们讨论方案本身就好。"},{"type":"边界型","text":"我讨论的是事情本身，不是对您个人有意见。如果我的表达方式让您不舒服，我可以调整。但问题本身还是需要解决的，我们回到方案上？","meaning":"你区分了\"对人\"和\"对事\"，既照顾了关系，又没有放弃讨论正事。","guidance":"保持这个原则：对事不对人。如果对方反复把话题引向态度问题，说明他不想讨论正事，你可以考虑升级沟通。"},{"type":"回击型","text":"我对事不对人，倒是你，一说到正事就开始扯态度，是不是不想解决问题？","meaning":"你戳中了对方转移话题的意图，但\"不想解决问题\"太攻击性。","guidance":"更克制：我注意到我们的话题从方案本身偏移到了态度问题，我建议回到方案讨论上，这样对推进工作更有帮助。"}],"followUp":{"npcByType":{"软弱型":"你看你看，又说态度了。你就承认吧，你就是对我有意见，不然怎么每次都这样。","中立型":"方案有问题？那也是你理解的问题。你先把态度端正了，再说别的。","边界型":"对事不对人？你这话说得好听。你看看你刚才那语气，是讨论的态度吗？","回击型":"行，我不解决问题。那这摊事你全权负责，到时候别找我。"},"intent":"用\"你承认吧\"逼你认态度，用\"端正态度\"拖延方案讨论，用\"语气不对\"把焦点锁在态度上，用\"全权负责\"威胁你独自扛后果。","moves":["逼认态度","拖延正事","后果威胁"],"choices":[{"type":"软弱型","text":"可能我刚才的语气让您误会了，我先跟您道个歉，方案的问题我后面再慢慢说。","meaning":"你把主要精力放在安抚对方情绪上，方案讨论被推后；对方只要继续抓语气，就能让正事迟迟不进入。","guidance":"态度可以会后处理，方案要当场推进：如果语气让您不舒服我会注意，但第X点风险需要现在确认。"},{"type":"中立型","text":"态度端不端正，得看方案对不对。方案要是没毛病，我哪来的意见？要不咱们把方案过一遍，有问题解决问题，没问题我自然没意见。","meaning":"你把\"态度\"和\"方案\"绑定，让方案问题成为讨论焦点，但仍接了\"端正态度\"的话头。","guidance":"说完直接开始过方案，不给对方继续扯态度的机会：第一点，我的看法是……"},{"type":"边界型","text":"语气是态度，方案是事，两码事。您要是觉得我语气不好，我可以注意；但方案的问题不会因为我语气好就消失。咱们先把方案过完，语气的事我改，行不行？","meaning":"你区分了\"语气\"和\"方案\"，承认可以调整语气，但坚持先解决方案问题。","guidance":"说完直接过方案。如果对方还扯语气，就说：那咱们这样，方案过完，您单独给我提语气建议，我一定听。把态度问题隔离到会后。"},{"type":"回击型","text":"您说不解决就不解决？那这事儿卡这儿，延误了算谁的？您要真撒手，那我可就按我的方案推进了，到时候方向不对，您可别说没提醒过您。","meaning":"你接住威胁并反向追责，但\"按我方案推进\"有越权风险，对方可能借机发难。","guidance":"收一档：我不是要您撒手。我是想推进方案，您要是不参与，那我按现有方案执行，执行结果我同步您，您有意见随时提。"}]}},{"npc":"算了，你先按我说的做，别把事情复杂化。","intent":"压制你的澄清需求，把合理追问说成\"复杂化\"，让你不敢再问。","moves":["压制澄清","快速推进"],"choices":[{"type":"软弱型","text":"您想先简单推进的话，我就不再细问了，先按您刚才的说法执行。","meaning":"你为了不显得复杂放弃澄清，执行依据仍然模糊；结果不符合预期时，对方可能反过来说你没理解到位。","guidance":"可以先执行，但要留一个简短确认：我按刚才说的A、B、C执行，如无异议我开始推进。"},{"type":"中立型","text":"我不是要复杂化，只是想确认一下。","meaning":"你还在解释自己\"不是复杂化\"，已经接受了对方的定义。","guidance":"不需要解释。直接说：好的，我按您的意思执行，我把要点发您确认一下，避免做错。"},{"type":"边界型","text":"好的，我按您的要求执行。为了确保理解一致，我发一条要点确认，您看一眼就行。这不是复杂化，是减少返工。","meaning":"你接受了执行要求，但坚持留痕。用\"减少返工\"作为理由，对方很难拒绝。","guidance":"发完消息后，如果对方不回复，默认按确认版本执行。有记录在手，你就有了保护。"},{"type":"回击型","text":"我把事情搞清楚叫复杂化？那你瞎指挥叫什么？","meaning":"你拒绝了\"复杂化\"的标签，但\"瞎指挥\"太冒犯，容易当场翻脸。","guidance":"更冷静：理解您想快速推进，我把确认做得很简单，只需要您回一个\"对\"就行，不会耽误时间。"}],"followUp":{"npcByType":{"软弱型":"对，按我说的来就行。别整那些消息记录有的没的，整那么正式干嘛。","中立型":"确认什么？我说的还不够清楚？你赶紧做，别磨蹭。","边界型":"你发什么消息？这点事还留痕？你是不是不信任我？这点小事都不配合？","回击型":"行行行，我不指挥了。你自己看着做，做错了我可不管。"},"intent":"用\"别整记录\"阻止你留痕，用\"不够清楚吗\"打压你的确认需求，用\"不信任我\"道德绑架，用\"做错了我不管\"撒手威胁。","moves":["阻止留痕","打压确认","撒手威胁"],"choices":[{"type":"软弱型","text":"我明白您不想再确认细节，那我就按现在理解去做，尽量不把流程拖住。","meaning":"你顺从了\"别确认、快执行\"的压力，既没有确认细节也没有留下依据，后续偏差会被归成你的理解问题。","guidance":"退让也要留底：我按现有理解执行以下三点。发不出去也要自己写执行日志，记录时间、指令和动作。"},{"type":"中立型","text":"清楚是清楚，但有几个细节我不确定，怕做错返工更麻烦。您给我两分钟，我对三个点就行。","meaning":"你用\"怕返工\"作为确认理由，但仍在口头层面，对方一句\"别磨蹭\"就能堵住。","guidance":"口头对完，自己默默发一条消息：按沟通执行以下三点……对方不回即默认，你有了发送时间戳。"},{"type":"边界型","text":"不是不信任，是执行要有依据。我发个要点，您回个\"对\"，三秒钟的事，不算留痕算对齐。万一后面要复盘，咱们都有个准星，对您也好。","meaning":"你把\"留痕\"重新定义为\"对齐\"，并强调\"对您也好\"给对方台阶。","guidance":"发完后对方不回，隔半天追一句：您没回复我按这个执行了。把沉默默认成确认。"},{"type":"回击型","text":"您说不管就不管？这指令是您下的，做错了您一句\"不管\"就完了？行，那我按自己理解做，做完了把执行依据抄送您一份，您看不看随意，出问题各自承担各自部分。","meaning":"你接住撒手威胁并反向追责，但\"抄送\"有要挟意味，容易激化。","guidance":"软一档：您要真不指挥，那我按现有理解执行，执行方案我发您一份，您有意见随时说，没意见我推进。这样谁都不亏。"}]}}],"family":[{"npc":"我说你是为你好，你怎么还不领情？","intent":"用\"为你好\"包装控制，把不同意说成\"不领情\"，让你觉得拒绝就是不懂感恩。","moves":["为你好包装","情绪绑架"],"choices":[{"type":"软弱型","text":"妈，我知道您操心我，您先说，我都记着；这事我回头再琢磨，别因为我让您不痛快。","meaning":"你把决定权往后拖，用顺从和安抚换家里暂时安静；对方听到的是你还会按长辈的意见走，只是现在没有立刻答应。","guidance":"这仍然是退让式回避。亲友的关心可以接住，但别把选择权一起交出去，至少要补一句：我会参考，但最后还是我自己决定。"},{"type":"中立型","text":"我知道您是为我好，但有些事我有自己的想法。","meaning":"你想表达自主，但\"我知道您为我好\"等于先接受了对方的前提，后面的话力度就弱了。","guidance":"不需要先肯定\"为你好\"。直接说：这件事我自己有考虑，如果需要您的建议我会主动问。"},{"type":"边界型","text":"我理解您关心我，但关心不等于要替我做决定。我可以听您的建议，但最后的选择权在我。","meaning":"你区分了\"关心\"和\"控制\"，既没有否认对方的好意，也守住了决定权。","guidance":"保持这个区分。如果对方说\"那你就是不领情\"，可以回：领情和照做是两回事，我感谢您的关心，但不一定按您说的做。"},{"type":"回击型","text":"你说是为我好，那我问你，你是在帮我还是在满足你自己的控制欲？","meaning":"你直指对方的控制动机，但\"控制欲\"这个词太尖锐，容易引发激烈争吵。","guidance":"更委婉的说法：如果是真的为我好，那应该尊重我的选择，而不是要求我按您的意思来。"}],"followUp":{"npcByType":{"软弱型":"你看看，你嘴上说听着，脸色可不太好。我费这心思为你，你就这态度？","中立型":"你有想法？你的想法能比我的经验强？我吃过的盐比你吃过的米还多。","边界型":"我替你做决定？我那是怕你走弯路！你妈还能害你不成？","回击型":"行，我多管闲事了，我好心当成驴肝肺，以后你的事我再也不管了。"},"intent":"追问轮用\"经验压制\"和\"亲情施压\"双重绑架，把你的边界说成是不识好歹，让你为坚持自己而愧疚。","moves":["经验压制","亲情施压"],"choices":[{"type":"软弱型","text":"妈，您这么说我心里也难受，我不是不领情；先按您说的方向想想吧，咱别在饭桌上吵起来。","meaning":"你为了避免家庭冲突，把自己的立场收回去了；对方会理解成只要把话说重一点，你就会把决定让给长辈。","guidance":"缓和气氛可以，但不要用放弃立场来换。更稳的是：我不想吵，也感谢您操心，但这件事我还是要自己拿主意。"},{"type":"中立型","text":"您经验多我知道，但时代不一样了，有些事我想自己试试。","meaning":"你承认了经验差距，但\"试试\"语气太弱，对方会觉得你还在犹豫。","guidance":"更坚定：经验我参考，但怎么走我决定，您放心，出问题我自己担。"},{"type":"边界型","text":"我没说您害我，也没说不管您。我是说，建议您可以给，但最后怎么选得我自己来。您生气我也得这么说。","meaning":"你顶住了压力，既澄清了立场又没有让步，把\"生气\"和\"对错\"分开处理。","guidance":"保持这个态度。对方生气是对方的情绪，你不需要为对方的情绪负责，只需要为自己的决定负责。"},{"type":"回击型","text":"您要是真不管我事了，那我还清净了。可您嘴上说不理，转头还得管，咱俩谁不了解谁啊。","meaning":"你戳穿了对方\"以后不管\"的虚张声势，把退场威胁变成笑谈。","guidance":"语气可以轻松点笑着说。这招能化解对方的退场威胁，但要看关系，关系太僵别用。"}]}},{"npc":"你工资这么高，借我点钱怎么了？一家人别这么小气。","intent":"用亲情降低你的拒绝权，用\"小气\"标签让你不好意思拒绝。","moves":["借钱绑架","亲情施压","小气标签"],"choices":[{"type":"软弱型","text":"叔，您都这么说了，我也不好显得不顾亲戚情分；您先说个数，我看看卡里还能挪多少。","meaning":"你被\"一家人别小气\"带着走，先承认了亲情债，再进入金额讨论，等于默认自己应该借。","guidance":"亲戚借钱最怕先谈情分再谈规则。即使想帮，也要先说清楚：我最多只能在不影响生活的范围内考虑，而且借条和还款时间要写明。"},{"type":"中立型","text":"我最近也有开销，看情况吧。","meaning":"你想模糊拒绝，但\"看情况\"给了对方希望，他过几天还会来问。","guidance":"模糊拒绝不如明确拒绝：我目前不方便借。不需要解释为什么，解释越多对方越觉得你在找借口。"},{"type":"边界型","text":"借钱这件事我有自己的原则，近亲属之外我不借钱，不是小气，是怕影响关系。钱的事一旦搅进来，感情容易变味。","meaning":"你用\"保护关系\"作为不借钱的理由，对方很难说\"你不在乎感情\"，因为你不借恰恰是为了感情。","guidance":"保持这个原则。如果对方说\"就这一次\"，可以回：正因为怕影响关系，所以一次也不借，希望你能理解。"},{"type":"回击型","text":"你找我借钱还说我小气？那你之前借我的还了吗？","meaning":"你戳中了对方的双重标准，但如果对方确实没借过你钱，这句话就会反噬。","guidance":"更通用的说法：亲戚之间谈钱最伤感情，我不想因为钱的事让大家都不舒服。"}],"followUp":{"npcByType":{"软弱型":"也不多，先借我五万，过俩月还你。你要是手头紧，三万也行，咱们一家人好说话。","中立型":"看什么情况？你一个月挣那么多，能有什么开销？你是不是不想借啊？","边界型":"哟，还原则呢，一家人谈原则？你这钱是给外人挣的还是给家里人挣的？你小时候我抱过你忘了？","回击型":"我就知道你记着那点钱呢，一家人还翻旧账，我开口借一次你就这样，行吧。"},"intent":"追问轮升级绑架力度，用\"一家人\"\"小时候抱过你\"等亲情筹码压你，把不借钱说成是不顾亲情。","moves":["亲情施压","旧情绑架"],"choices":[{"type":"软弱型","text":"叔，五万我真拿不出来，我先凑两万给您周转，您别跟家里人说我不帮忙，回头记得按时还我就行。","meaning":"你一边害怕被亲戚评价，一边主动降额妥协；对方学到的是继续施压就能从你这里拿到钱。","guidance":"被亲情推进借钱时，更要把规则放在前面。要么明确不借，要么写借条、定期限，不要只靠一句\"记得还\"来保护自己。"},{"type":"中立型","text":"咱能不能别一上来就谈钱伤感情，您先说说借钱干啥用，我心里好有个底。","meaning":"你想了解用途再决定，但对方会觉得你在审问，反而更不高兴。","guidance":"问用途没问题，但要先表态：用途合理我可以考虑，但借条和还款时间得定好。"},{"type":"边界型","text":"一家人是一家人，钱是钱，这是两码事。借条得打，还款时间得定，这是规矩，对谁都一样，您别多想。","meaning":"你把\"亲情\"和\"借钱规矩\"分开，既没撕破脸又守住了底线。","guidance":"保持这个态度。如果对方因借条翻脸，说明他要的不是借钱而是白拿，这种人更不能借。"},{"type":"回击型","text":"您要真讲一家人，那就更得把话说清楚，亲兄弟明算账，不然到时候钱没了感情也黄了，谁都不好受。","meaning":"你用\"亲兄弟明算账\"反将一军，把规矩说成是为了保护感情。","guidance":"语气可以平和些。这招能把\"小气\"的帽子还给对方：不守规矩的才是不在乎感情。"}]}},{"npc":"都这么大了还不结婚，是不是要求太高了？","intent":"把私人选择放到公共场合审问，用\"要求高\"暗示是你有问题。","moves":["婚恋催促","要求高标签"],"choices":[{"type":"软弱型","text":"姨，我也没说不找，就是还没碰到合适的；您和我妈别太着急，我自己会留意的。","meaning":"你用乖顺的解释安抚亲戚，表面回避了催婚，实际上承认了自己需要给长辈一个进度交代。","guidance":"婚恋不是亲戚会议的项目。可以温和但清楚地说：有合适的我会告诉家里，但平时聚会不想把这个当主题。"},{"type":"中立型","text":"不是要求高，只是还没遇到合适的。","meaning":"你在解释自己\"不是要求高\"，等于接受了\"要求高是不好的\"这个预设。","guidance":"不需要解释。可以反问：您觉得结婚最重要的是什么？是年龄到了就结，还是遇到对的人才结？"},{"type":"边界型","text":"结婚是我自己的事，什么时候结、和谁结，我自己决定。您关心我我感谢，但这件事不需要讨论。","meaning":"你明确表达了\"这是我的私事\"，同时感谢了对方的关心，既守住边界又不过于生硬。","guidance":"如果对方继续追问，可以转移话题：对了，您家XX最近怎么样？把聚光灯转回去。"},{"type":"回击型","text":"您这么爱管闲事都不怕被人笑话，我怕什么？","meaning":"这句反击很经典，但\"爱管闲事\"可能引发家庭矛盾，看场合使用。","guidance":"如果不想太冲，可以幽默回：您这么操心我的终身大事，要不给我介绍一个？要求也不高，跟您一样热心就行。"}],"followUp":{"npcByType":{"软弱型":"缘分缘分，你都多大了还等缘分？你看你表妹，孩子都两岁了，你连个对象都没有，让爸妈脸往哪搁？","中立型":"合适？什么叫合适？你这么挑下去，到四十都结不了。你就告诉我，你到底想找什么样的？","边界型":"你自己事？你一个人的事？你不结婚，亲戚朋友问起来我怎么回答？你想过爸妈的感受吗？","回击型":"我好心关心你，还成爱管闲事了？行，以后你的事我不过问了，到时候别哭着回来找我们。"},"intent":"追问轮把婚恋上升到家族面子，用父母感受绑架你，把你的边界说成自私。","moves":["面子绑架","父母感受绑架"],"choices":[{"type":"软弱型","text":"姨，我知道您和爸妈脸上也有压力，我会多见见人、多留心的，外面亲戚再问您就先帮我挡一挡吧。","meaning":"你把婚恋变成了替家里保全面子的任务，还承诺会努力推进，对方以后更容易拿父母脸面催你。","guidance":"别把亲戚的面子焦虑接到自己身上。可以给台阶，但别许诺进度：您就说我有自己的安排，合适了自然会说。"},{"type":"中立型","text":"结婚这事急不来，您要真想帮我，给我介绍也行，但别老这么催，催得我更不想找了。","meaning":"你把球踢回给对方，让对方从\"催\"变成\"介绍\"，转移了压力。","guidance":"这招不错，但要有心理准备对方真介绍。如果介绍了不合适，明确说不合适，别勉强。"},{"type":"边界型","text":"您关心我我领情，但我结不结婚、什么时候结，这是我的人生，您催也没用。亲戚问起来您就说\"孩子有孩子的主意\"，比我出面解释强。","meaning":"你给了对方一个台阶（应对亲戚的话术），同时守住\"这是我的事\"的边界。","guidance":"保持这个态度。如果对方还是催，可以减少见面频率，用行动表明态度。"},{"type":"回击型","text":"您老说亲戚问，那您就反问他们\"你家孩子工资多少、房贷多少、过得好不好\"，看谁还敢问我的事。","meaning":"你用同样的\"审问\"逻辑反制，让对方知道催婚是双刃剑。","guidance":"这招杀伤力大，笑着说效果好。如果对方真去反问，亲戚圈可能炸锅，慎用。"}]}},{"npc":"你不是会设计吗？帮我做个海报，很简单的。","intent":"把专业劳动说成\"顺手小事\"，让你不好意思谈报酬。","moves":["白嫖技能","轻描淡写"],"choices":[{"type":"软弱型","text":"哥，你都开口了我也不好拒绝，今晚下班我帮你看一版，不过可能只能简单弄弄。","meaning":"你为了顾朋友面子答应免费劳动，还用\"简单弄弄\"替自己找缓冲；对方听到的仍然是你会接这个活。","guidance":"专业劳动不是随手人情。碍于关系也可以先限定：我可以给你看方向，正式设计需要排期和费用。"},{"type":"中立型","text":"这个工作量不小啊，你要什么样子的？","meaning":"你想了解需求，但一旦开始问需求，就等于答应了。","guidance":"先表态再问需求：可以帮忙，不过最近比较忙，简单的我可以看看，复杂的可能得排时间。"},{"type":"边界型","text":"设计是我的工作，不是顺手的事。如果是正式需求，我可以给你友情价；如果是随便做做，我最近可能没时间。","meaning":"你区分了\"帮忙\"和\"免费劳动\"，给了对方选择：要么付钱（友情价），要么等你有空。","guidance":"保持这个原则。真正的朋友会尊重你的劳动，不尊重的朋友不用怕得罪。"},{"type":"回击型","text":"你不是会做饭吗？来我家做顿饭呗，很简单的。","meaning":"用同样的逻辑反将一军，让对方感受到被要求免费劳动的荒谬。这个回法很妙。","guidance":"这种镜像反击很有效，但语气可以轻松一点，笑着说效果更好。"}],"followUp":{"npcByType":{"软弱型":"那今晚就给我吧，反正你下班也没事。对了，再帮我改个logo，顺手的事。","中立型":"什么样我自己也说不清，你随便弄弄就行，专业的事交给你。我下周一要用，没问题吧？","边界型":"还友情价？咱俩这关系还谈钱？你帮别人都收钱，帮我就不收？还是说我在你心里不如外人？","回击型":"我开个口你至于吗？不愿意就直说，还拿做饭损我，我这好心当成驴肝肺了。"},"intent":"追问轮把不免费说成\"看不起关系\"，用关系亲疏绑架你的劳动，让你觉得收费就是不在乎这段关系。","moves":["关系绑架","道德绑架"],"choices":[{"type":"软弱型","text":"哥，那我今晚把海报和logo都先帮你赶出来，这次就当帮朋友救急，以后真忙的话你可别怪我推。","meaning":"你用\"救急\"给自己台阶，却把免费范围从海报扩到了logo；朋友会记住的不是你的为难，而是你最后还是接了。","guidance":"越是熟人加需求，越要当场划范围。可以说：海报我这次帮你看，logo另算；否则你会被一次次顺手加活。"},{"type":"中立型","text":"咱先把海报弄完吧，logo这事再说，我最近真排不开，您别一次堆太多活给我。","meaning":"你想限制范围，但没有谈钱，对方下次还会用\"顺手\"加活。","guidance":"限制范围不如明确价格。说：海报这次免费，logo另算，以后都按友情价来。"},{"type":"边界型","text":"关系归关系，活归活。这次海报我友情价收个两百意思一下，logo另算。您要是觉得我在乎钱胜过在乎您，那这次我不做了，咱别因为这点事伤感情。","meaning":"你把价格和关系分开，给了对方退路（不做就不伤感情），也守住了劳动价值。","guidance":"保持这个态度。真正的朋友会付友情价，不付的本来也没把你当朋友，不做反而省心。"},{"type":"回击型","text":"您说我不愿帮您，那您帮过我什么？上次我搬家您说没空，这次找我做活又说我不够意思，这账怎么算？","meaning":"你翻旧账反制，让对方知道\"关系\"是双向的，不能只要求你付出。","guidance":"翻旧账要实事求是，别编。语气可以缓和：咱互相帮过，这次我做友情价，您也体谅我的时间。"}]}},{"npc":"我就是开个玩笑，你怎么这么敏感？","intent":"把冒犯包装成玩笑，把你的不适说成\"敏感\"，让你觉得自己才是问题。","moves":["开玩笑包装","敏感标签"],"choices":[{"type":"软弱型","text":"算了，大家吃饭聊天嘛，我不想扫兴，你们继续说就好，我缓一下就行。","meaning":"你为了不破坏亲友聚会气氛，把被冒犯的感受压下去了；对方会觉得只要场合热闹，你就不会认真计较。","guidance":"不想扫兴可以理解，但感受不能一直吞。至少可以轻一点说：这句我听着不太舒服，咱换个玩笑。"},{"type":"中立型","text":"有些玩笑确实不太好笑。","meaning":"你表达了不满，但语气太温和，对方可能觉得你在撒娇而不是认真。","guidance":"更直接：你说的那句话不好笑，以后请不要这么说了。"},{"type":"边界型","text":"玩笑的前提是双方都觉得好笑。如果只有你觉得好笑，那不叫玩笑，叫冒犯。我不喜欢这种说法，希望以后不要这样。","meaning":"你重新定义了\"玩笑\"——需要双方都觉得好笑。对方无法用\"开玩笑\"来开脱了。","guidance":"保持这个定义。如果对方说\"你也太开不起玩笑了\"，可以回：我开得起玩笑，但你说的不是玩笑。"},{"type":"回击型","text":"我打你一巴掌然后说开玩笑，你干吗？","meaning":"你用极端类比让对方感受荒谬，但\"打巴掌\"太暴力，可能引发更大冲突。","guidance":"更冷静的说法：如果我说你XX然后说开玩笑，你会觉得好笑吗？己所不欲勿施于人。"}],"followUp":{"npcByType":{"软弱型":"你看你看，嘴上说没事，脸都拉下来了。你们这代人就是玻璃心，说不得碰不得。","中立型":"好不好笑是我的事，你听不听得进去是你的事。你别跟我扯这些，我就问你是不是真生气了？","边界型":"冒犯？我说你一句就冒犯了？你这人怎么这么难相处，以后谁还敢跟你说话啊？","回击型":"你至于这么上纲上线吗？我就说句话你就要打人？行，以后我一句话都不跟你说，省得你敏感。"},"intent":"追问轮把你的边界说成\"难相处\"和\"玻璃心\"，用社交孤立威胁你，让你为维护关系而妥协感受。","moves":["孤立威胁","难相处标签"],"choices":[{"type":"软弱型","text":"舅，我不是要闹脾气，可能是我今天状态不好，咱们别因为我一句话弄得全桌尴尬。","meaning":"你把对方的冒犯变成自己的状态问题，既替对方开脱，也让亲友觉得你该负责把气氛圆回来。","guidance":"别把不舒服全揽成自己的问题。可以顾及场面地说：我不想让大家尴尬，但刚才那句以后别拿我开了。"},{"type":"中立型","text":"我生没生气不重要，重要的是您那句话确实不合适，下次别这么说了行吗？","meaning":"你把焦点从\"情绪\"转到\"行为\"，但\"行吗\"语气还是偏软，对方可能敷衍答应。","guidance":"更明确：我没生气，但那句话不合适，以后请不要这么说。用陈述句不用疑问句。"},{"type":"边界型","text":"难不难相处不是您一句话定的。我就一个要求，别拿我开这种玩笑，其他的咱该怎么聊怎么聊。您要觉得这都难，那咱就少来往，比闹僵强。","meaning":"你把\"难相处\"的标签顶回去，同时给了对方选择：尊重边界或减少来往。","guidance":"保持这个态度。对方说\"难相处\"是操控，你不用自证。真正难相处的是不顾别人感受的人。"},{"type":"回击型","text":"您说以后不跟我说话？那正好，省得我又被\"开玩笑\"。您要真觉得我敏感，那就当我敏感，各过各的。","meaning":"你接受了对方的\"绝交\"威胁，反过来变成你的选择，对方反而下不来台。","guidance":"这招叫\"以退为进\"，但说完后如果对方真不说话了，你也别主动找他，否则前功尽弃。"}]}},{"npc":"你现在翅膀硬了，家里人说话都不听了。","intent":"把不同意见上升成亲情背叛，用\"不听话\"标签制造愧疚。","moves":["翅膀硬了","亲情施压"],"choices":[{"type":"软弱型","text":"爸，我不是故意跟家里对着干，我就是有点拿不准，想再听听你们怎么想。","meaning":"你急着证明自己不是不孝，把讨论重新交给父母评判；对方会继续用\"听不听话\"来衡量你。","guidance":"可以尊重父母意见，但不要把成年决定说成等家里批准。更合适的是：我会听你们意见，但这不代表我必须照做。"},{"type":"中立型","text":"我不是不听，是有自己的想法。","meaning":"比上一个好一点，但\"不是不听\"还是在否认指控。","guidance":"不否认，直接表达：我有自己的想法，这不代表我不在乎家人，只是我需要自己做决定。"},{"type":"边界型","text":"听取家人意见和按家人说的做是两回事。我尊重你们的想法，但最终决定权在我。这不是翅膀硬，是长大。","meaning":"你区分了\"听意见\"和\"服从决定\"，用\"长大\"重新定义了对方说的\"翅膀硬\"。","guidance":"保持这个态度。真正健康的家庭关系是成年人之间的互相尊重，不是一方服从另一方。"},{"type":"回击型","text":"翅膀硬了才好，翅膀不硬的那叫窝囊废。你希望我窝囊？","meaning":"你把\"翅膀硬\"变成了正面词，反击力度大，但\"窝囊废\"可能伤害家人感情。","guidance":"更温和的说法：长大了自然有自己的判断，这恰恰说明你们把我教育得不错，我应该独立了。"}],"followUp":{"npcByType":{"软弱型":"觉得什么？你倒是说啊。嘴上说没不听，实际上一件事都不照做，这叫没不听？","中立型":"想法想法，你哪来那么多想法？我们走过来的人说的话你都不信，你信谁的？","边界型":"服从？我让你服从了吗？我让你干点正经事你跟我说服从？你这孩子真是越大越不像话！","回击型":"行，我养个窝囊废不如养个白眼狼是吧？供你读书供你长大，就换来这句话，我心寒啊。"},"intent":"追问轮用养育之恩压制你的独立，把你的成长说成是白眼狼，制造强烈的道德愧疚。","moves":["养育恩情绑架","白眼狼标签"],"choices":[{"type":"软弱型","text":"爸，您说白眼狼我真受不了，我没有忘家里对我的好；这事我先不争了，您说的我会放在心上。","meaning":"你被养育恩情压住，选择停止表达来安抚父亲；这会让对方确认重话能让你退回服从位置。","guidance":"被扣不孝的帽子时，先稳住但别收回立场：我记得家里的好，也正因为长大了，这件事我要自己判断。"},{"type":"中立型","text":"您养我长大我一辈子记着，但这不代表我每件事都得按您说的来，咱能不能就事论事谈这一件事？","meaning":"你先肯定恩情再谈具体事，但\"不代表\"语气偏弱，对方可能继续打感情牌。","guidance":"更直接：养我和这件事是两码事，咱别混在一起说，就谈这件事怎么办。"},{"type":"边界型","text":"养育之恩和这件事是两码事。您供我读书是为了我有出息、能独立判断，现在我独立了您又说我是白眼狼，这逻辑说不通。我尊重您，但也请您尊重我的决定。","meaning":"你用对方\"供你读书\"的目的反制，指出独立正是教育的成果，逻辑闭环。","guidance":"保持这个逻辑。这是最有力的反驳：你的独立恰恰证明了教育的成功，不是失败。"},{"type":"回击型","text":"您要是觉得养我就是为了让我什么都听您的，那您这是养孩子还是养工具？我感谢您，但我不欠您一个\"言听计从\"。","meaning":"你直指对方把养育当成控制筹码的本质，但\"养工具\"可能直接撕破脸。","guidance":"看关系使用。关系还行就换成：您养我不是为了让我一辈子听话，是为了让我能自己站稳，我现在站稳了，您该高兴才对。"}]}},{"npc":"别人家孩子都能帮衬家里，你怎么就不行？","intent":"用比较制造愧疚，让你觉得自己不够好、不够孝顺。","moves":["比较制造愧疚","别人家孩子"],"choices":[{"type":"软弱型","text":"妈，我不是不管家里，我也想搭把手，就是最近手头和时间都卡得紧。","meaning":"你先证明自己顾家，再用困难解释不能立刻满足；对方会抓住你的愧疚继续追问你到底能给多少。","guidance":"帮家里可以主动安排，但不要在内疚里被动承诺。先想清楚能力边界，再说：我能固定做到这些，超出的我做不到。"},{"type":"中立型","text":"别人家是别人家，我家情况不一样。","meaning":"你想说明情况不同，但没有表达\"我不需要跟别人比\"的态度。","guidance":"更直接：每个家庭情况不同，我不想跟别人比，我按自己的能力和方式来。"},{"type":"边界型","text":"我帮家里是出于我的意愿和能力，不是因为别人家孩子怎么样。比较不能解决问题，我们聊聊具体需要什么帮助。","meaning":"你拒绝被比较，同时表示愿意在能力范围内帮忙，既守住了边界又不太伤感情。","guidance":"如果对方提出具体需求，你可以按自己的能力决定帮不帮，而不是被愧疚绑架。"},{"type":"回击型","text":"别人家父母还给买房呢，你给我买了吗？","meaning":"用同样的比较逻辑反击，但容易变成互相伤害的比惨大会。","guidance":"更聪明的说法：别人家孩子帮衬家里，别人家父母也尊重孩子的选择。咱们各看一面好不好？"}],"followUp":{"npcByType":{"软弱型":"确实什么？你一个月挣的比你爸多，你帮衬不起谁帮衬得起？你看看人家小王，每个月给家里三千，你呢？","中立型":"怎么不一样？人家也是普通家庭，人家孩子也上班，怎么人家能帮你就不能？你就是不想帮。","边界型":"意愿？帮自己家还要看意愿？你小时候吃家里的、用家里的，怎么不说意愿？现在让你回报点就讲意愿了？","回击型":"好，我们没本事给你买房，我们对不起你，行了吧？养你这么大还落一身不是，我上辈子欠你的。"},"intent":"追问轮把帮助等同于还债，用\"吃家里用家里\"的旧账绑架你，把你的边界说成忘本。","moves":["旧账绑架","忘本标签"],"choices":[{"type":"软弱型","text":"妈，您别拿养我这事这么说，我听着难受；那我先每个月转两千回家，您别再说我不管家里了。","meaning":"你用固定转账换取不被责备，钱变成了买安静的代价；对方以后可能继续用亏欠感要求更多。","guidance":"给家用要基于能力和心意，而不是被愧疚逼出来。建议先算预算，再主动说明：我每月能承担多少，超过就会影响生活。"},{"type":"中立型","text":"帮家里我愿意，但具体怎么帮、帮多少，咱得商量着来，不能一上来就定数，您说呢？","meaning":"你想把\"帮\"变成协商而非义务，但\"您说呢\"语气偏软，对方可能直接拍板。","guidance":"更明确：我每月可以给一笔家用，数目我来定，不是跟别人比，是我能力范围内。"},{"type":"边界型","text":"小时候您养我是您的责任，现在我有能力了帮您是我的心意，这两件事不能混在一起算账。我每月可以给一笔家用，但这是我的心意，不是还债，您别用\"欠\"这个字。","meaning":"你把\"责任\"和\"心意\"分开，既承认了养育也守住了边界，不给\"欠债\"留空间。","guidance":"保持这个区分。如果对方继续用\"欠\"来压你，可以停给一段时间，表明态度。"},{"type":"回击型","text":"您要是真想算账，那把养育成本列出来我一次性结清，以后两不相欠？您肯定不愿意，因为您要的不是钱，是让我一辈子听话。这我不干。","meaning":"你戳穿了对方\"算账\"的虚张声势，把控制动机暴露出来。","guidance":"这话很冲，但逻辑有力。关系已经僵了才用。关系还行就换成边界型那句。"}]}},{"npc":"朋友之间还谈钱啊？你也太见外了。","intent":"用\"见外\"标签压低你的劳动价值，让你觉得收钱=不把对方当朋友。","moves":["白嫖技能","见外标签"],"choices":[{"type":"软弱型","text":"你这么说我也不好意思收了，这次就当朋友之间帮个忙，别因为钱弄得生分。","meaning":"你被\"见外\"框住，把自己的劳动让给了关系；朋友会知道用生分这个词就能让你不好意思谈钱。","guidance":"熟人也要尊重劳动。可以把话说软但规则说清：正因为是朋友才给友情价，不是完全不收。"},{"type":"中立型","text":"不是见外，就是这个工作量确实不小。","meaning":"你在解释\"不是见外\"，但还是在对方的框架里。","guidance":"不需要解释\"不是见外\"。直接说：正因为是朋友，我才给你友情价，不收钱反而是不尊重自己的专业。"},{"type":"边界型","text":"正因为是朋友，我才给你友情价。朋友之间尊重彼此的劳动，这才是长久相处的方式。不谈钱反而容易伤感情。","meaning":"你把\"谈钱\"重新定义为\"尊重劳动\"，对方很难说\"尊重劳动=见外\"。","guidance":"保持这个逻辑。如果对方还是说\"见外\"，说明他不是把你当朋友，是把你当免费工具。"},{"type":"回击型","text":"朋友之间不谈钱？那你去找免费的不朋友做。","meaning":"你戳中了对方想白嫖的本质，但语气太冲，可能直接翻脸。","guidance":"更轻松的语气：正因为是朋友，我才收友情价，换别人我都不接。你看你是要友情价还是免费介绍另一个朋友？"}],"followUp":{"npcByType":{"软弱型":"这还差不多。对了，下个月我还有个活，也交给你吧，反正你不收钱，省得我再找别人。","中立型":"工作量再大也是一次的事，你至于这么计较吗？咱俩这交情，你还跟我算工时？","边界型":"友情价？我跟你谈友情，你跟我谈价？你这朋友也太现实了，是不是以后我找你聊天都得按小时付费？","回击型":"我就开个口你至于这么损我吗？不愿意就算了，还拿话噎我，这么多年朋友我算看清你了。"},"intent":"追问轮把收费等同于\"现实\"，用朋友身份无限压榨你的劳动，让你为维护友谊而放弃劳动价值。","moves":["友谊绑架","现实标签"],"choices":[{"type":"软弱型","text":"你别这么想，我哪能因为这点钱跟你疏远；这单我不收了，下次你有需要再说，咱关系在这儿呢。","meaning":"你为了证明友情，把费用和后续边界都放掉了；对方会把你的客气当成长期免费通道。","guidance":"不要用免费证明感情。即便这次让步，也要补上边界：这次算我送你，下次开始按友情价。"},{"type":"中立型","text":"我不是跟您算工时，我是说我确实得花时间精力，您要真当我是朋友，就别让我白干，朋友也得互相体谅对吧？","meaning":"你把\"体谅\"变成双向的，但语气还是偏软，对方可能继续打感情牌。","guidance":"更明确：朋友互相体谅，所以你给我友情价，我给你质量保障，这才是朋友该有的样子。"},{"type":"边界型","text":"现实不是我，是劳动就该有回报这事本来就这样。我给您友情价是看交情，但友情价不是免费。您要是觉得收钱就不算朋友，那这朋友的标准也太低了，免费劳动力哪是朋友啊。","meaning":"你重新定义了\"朋友标准\"——朋友是互相尊重，不是一方免费给另一方干活。","guidance":"保持这个逻辑。对方说\"看清你\"是操控，你不用接。真正的朋友会付友情价。"},{"type":"回击型","text":"您说看清我，我也看清您了。一谈钱就翻脸，一要活就找朋友，您要的不是朋友是免费工具人。这话您不爱听，但我说的是事实。","meaning":"你直接戳穿对方\"朋友\"标签下的白嫖本质，把关系撕开来看。","guidance":"这话很冲，说完关系可能就凉了。如果不想翻脸，换成边界型那句，效果一样但留余地。"}]}},{"npc":"我跟你诉苦是把你当自己人，你怎么还嫌烦？","intent":"要求你无条件承接情绪，却不看你的承受度，用\"自己人\"绑架你的接受义务。","moves":["情绪绑架","自己人标签"],"choices":[{"type":"软弱型","text":"姐，我没有嫌你烦，你心里难受就跟我说吧，我这会儿先陪你聊完。","meaning":"你把自己的时间和情绪需求放到后面，用陪伴来安抚亲友；久了对方会默认你随时都能接住她的倾倒。","guidance":"关心不等于无限陪聊。可以表达在乎，也要设时限：我能听你说二十分钟，之后我得处理自己的事。"},{"type":"中立型","text":"我没有嫌烦，只是有时候确实有点累。","meaning":"你表达了感受，但\"没有嫌烦\"还是先否定了对方的指控。","guidance":"不需要否定\"嫌烦\"。直接说：我愿意听你说，但我也有自己的状态，不是每次都能接住。"},{"type":"边界型","text":"我愿意听你说，但我也需要自己的空间。把我当自己人不代表我要随时承接所有情绪，我也有扛不住的时候。","meaning":"你区分了\"亲近\"和\"无限承接\"，既没有拒绝倾听，也守住了自己的承受边界。","guidance":"保持这个边界。如果对方说\"那你还算什么自己人\"，可以回：自己人也互相体谅，不能只一个人倒一个人接。"},{"type":"回击型","text":"你跟我诉苦，我也跟你诉苦了吗？每次都是你说我听，你问过我过得怎么样吗？","meaning":"你戳中了单向情绪消耗的问题，但这句可能让对方觉得你在计较。","guidance":"更温和的说法：我很愿意听你说，但也希望有时候你能听听我的。朋友是双向的，不是一个人倒一个人接。"}],"followUp":{"npcByType":{"软弱型":"那你倒是好好听着啊，别一脸不情愿。我跟你说，这事还没完，你听我接着讲……","中立型":"累？你累什么？我遇到的事才叫累！你那点工作算什么，来来来我跟你说说我有多难……","边界型":"随时？我找你诉过几次苦啊？就这么几次你都嫌多，你这自己人当得也太精贵了，合着只分享好事不承担难处？","回击型":"好好好，我自私，我只会倒苦水，我跟你诉个苦还成罪过了？行，以后我憋着，烂肚子里也不跟你说了。"},"intent":"追问轮把你的承受边界说成\"精贵\"和\"自私\"，用\"自己人就该承担\"绑架你，让你为不倾听而愧疚。","moves":["自己人绑架","自私标签"],"choices":[{"type":"软弱型","text":"姐，刚才是我没接上话，不是嫌你烦；你接着讲，我把手头事先放一放。","meaning":"你为了避免对方受伤，把自己的安排往后推；亲近的人会更容易把你的陪伴当成理所当然。","guidance":"别用牺牲安排来证明关心。更健康的是：我在听，但我还有事，咱们再聊十五分钟。"},{"type":"中立型","text":"我没说您诉苦是坏事，但咱能不能也聊聊点别的？光聊烦心事咱俩都受不了，换个话题轻松一下行吗？","meaning":"你想转移话题减轻压力，但对方可能觉得你在敷衍，继续倒苦水。","guidance":"转移话题要自然：对了，您上次说的那件事后来怎么样了？把话题从\"诉苦\"转到具体事。"},{"type":"边界型","text":"自己人不是只一方倒一方接。我愿意听您说，但也希望您能听听我的。今天咱先聊到这，下次换我讲讲我的事，您也接一接，这才叫自己人。","meaning":"你把\"自己人\"重新定义为双向的，既没拒绝倾听又提出了对等要求。","guidance":"保持这个态度。如果对方真不愿听你的，那这段关系本来就是单向消耗，可以考虑疏远。"},{"type":"回击型","text":"您说烂肚子里也不说，那是您的选择，别拿来怪我。我也有我的难处，您从来不过问，现在还怪我不够自己人，这双标也太明显了。","meaning":"你戳穿了对方\"自己人\"的双标——只要求你承接，不给予你倾诉。","guidance":"这话有力但可能伤感情。如果还想维护关系，换成边界型那句，留个体面。"}]}},{"npc":"你那点事算什么，我比你难多了。","intent":"否定你的感受，用痛苦排名压制你，让你觉得自己的问题不值一提。","moves":["痛苦排名","否定感受"],"choices":[{"type":"软弱型","text":"你这么一说也是，你那边压力更大，我这点烦心事先不提了，免得显得我矫情。","meaning":"你把自己的难处主动降级，用退让维持亲友之间的体面；对方会习惯用比较来打断你的表达。","guidance":"亲友都可以难，不需要比赛。可以承认对方辛苦，同时保留自己：你不容易，我也想把我的事说完。"},{"type":"中立型","text":"我知道你也不容易，但我的事也挺难的。","meaning":"你想表达自己的感受，但\"我知道你不容易\"先肯定了对方的标准。","guidance":"不需要比较。直接说：我不是在跟你比谁更难，我只是在说我的感受。"},{"type":"边界型","text":"我的感受和你的感受不矛盾，不需要比较谁更难。我说我的事，不是否定你的难处，希望你也能这样对我。","meaning":"你拒绝参与\"痛苦排名\"，同时表达了互相尊重的期待。","guidance":"保持这个原则。如果对方还是说\"你那算什么\"，可以终止话题：那可能我们现在不适合聊这个，等以后再说吧。"},{"type":"回击型","text":"你难你就去解决，别拿你的难来否定我的感受。","meaning":"你戳中了对方用自己痛苦否定别人的问题，但语气偏冲。","guidance":"更平静的说法：每个人有自己的难处，我不想比谁的更难，我只是在分享我的感受而已。"}],"followUp":{"npcByType":{"软弱型":"你知道就好。所以以后别老跟我提你那些鸡毛蒜皮，我这大难处还没解决呢，你那点事自己消化。","中立型":"你那也叫难？我告诉你什么叫难……（开始大段讲自己的事，完全无视你的表达）","边界型":"不矛盾？你跟我比就是矛盾！我难的时候你在哪？现在你有点小事就要我同情，凭什么？","回击型":"行，我否定你，我什么都不是，你的事最大，我活该难受还不能说话了是吧？"},"intent":"追问轮把你的表达说成\"争同情\"，用苦难霸权压制你，让你不敢再倾诉。","moves":["苦难霸权","争同情标签"],"choices":[{"type":"软弱型","text":"舅，听您这么说我也觉得自己想多了，我那点工作上的事先放一边，您接着讲您的难处吧。","meaning":"你把自己的困扰撤回去，给了长辈更大的叙事空间；以后你一开口，对方仍可能用更苦的经历压住你。","guidance":"尊重长辈经历，不等于取消自己的感受。可以说：您那段确实不容易，但我今天也需要有人听我说几句。"},{"type":"中立型","text":"我没说您不难，我也没要您同情我，我就是想说说话。咱俩的事可以都说，不冲突的。","meaning":"你想让双方都有表达空间，但\"不冲突\"语气偏弱，对方可能继续独占话语权。","guidance":"更明确：我听您说了很多，现在轮到我说说我的，您也听听，公平吧？"},{"type":"边界型","text":"我不是在跟您比，也不是要您同情。我跟您说我的事，是因为我信任您，想跟您聊聊。您要是觉得我的事不值一提，那咱以后各聊各的，但别用您的难来堵我的嘴。","meaning":"你把\"倾诉\"重新定义为信任，同时明确不接受被\"苦难霸权\"封口。","guidance":"保持这个态度。如果对方持续否定你的感受，说明他不把你当倾诉对象，你可以找愿意听你的人。"},{"type":"回击型","text":"您活该难受？没人这么说。但您难受不代表我就该闭嘴。您要我的同情，我也想要您的倾听，这是双向的，不是您一个人说了算。","meaning":"你戳穿了对方\"只许自己难受不许别人表达\"的双标。","guidance":"这话有力但可能引发争吵。如果不想吵，换成边界型那句，效果一样但更温和。"}]}},{"npc":"我说话直，你别往心里去。","intent":"和职场版一样，用\"说话直\"为冒犯开脱，把受伤的责任推给你。","moves":["说话直包装","免责声明"],"choices":[{"type":"软弱型","text":"我知道你是为我好，话直一点也正常，我回去自己消化消化，不会跟你计较。","meaning":"你把刺耳评价包装成善意提醒，替对方卸掉责任；亲友以后会更放心地用\"直\"来否定你。","guidance":"善意和冒犯要分开。可以接受具体建议，但要说明：建议我听，带贬低的话我不舒服。"},{"type":"中立型","text":"你直说可以，但有些话确实不太好听。","meaning":"你表达了不适，但\"可以\"等于先认可了对方的说话方式。","guidance":"不需要先认可。直接回应内容：你刚才说的那句话，我不太认同。"},{"type":"边界型","text":"直说是性格，但伤人是选择。你可以直说，但请考虑对方的感受。我也会有话直说，希望你别往心里去。","meaning":"你用对方的话术反将一军，既守住了边界，又让对方感受到了同样的待遇。","guidance":"保持这个态度。亲友之间直来直去可以，但不能只有一方有\"直说\"的权利。"},{"type":"回击型","text":"那我说话也直，你长得真显老。别往心里去啊。","meaning":"用同样的逻辑让对方体验被冒犯的感觉，反击效果很强，但可能直接翻脸。","guidance":"看关系使用。如果关系够好可以当玩笑，如果关系一般就换成：直说是你的风格，不接受也是我的权利。"}],"followUp":{"npcByType":{"软弱型":"那我就直说了啊，你这人就是太懒，工作不上心，怪不得混成这样。我说的是为你好，你别不爱听。","中立型":"不好听？真话哪有好听的？我直说你不爱听，那你想让我骗你？你看别人谁跟你说真话？","边界型":"伤人？我说你两句就伤人了？你这人怎么这么脆弱，出去社会上谁惯着你？我这是提前让你适应！","回击型":"你看看你，我随口一句你至于这么攻击我？我说你也是为你好，你这是反过来人身攻击，你这人记仇啊。"},"intent":"追问轮把冒犯说成\"为你好\"和\"提前适应社会\"，用关心包装伤害，让你无法反驳。","moves":["为你好包装","脆弱标签"],"choices":[{"type":"软弱型","text":"姨，您提醒得也有道理，可能我平时确实没让大家放心，我回去慢慢改，您别为我上火。","meaning":"你把模糊的人格评价全接下来，还反过来安抚对方；对方会觉得这样评价你是有效的。","guidance":"别把\"懒\"\"不上心\"这类标签照单全收。可以只接具体部分：哪件事没做好我会改，但整体否定我不接受。"},{"type":"中立型","text":"您要说真话我没意见，但能不能就事论事，别带\"懒\"\"不上心\"这种词？您直说不代表可以乱说。","meaning":"你区分了\"真话\"和\"人身攻击\"，但语气偏软，对方可能继续用\"真话\"开脱。","guidance":"更明确：真话我听，人身攻击我不接受。您说的哪件事我做得不好，具体说，别用\"懒\"来概括。"},{"type":"边界型","text":"社会上惯不惯我那是社会的事，您是亲友不是社会。亲友之间说话更该有分寸。您要直说可以，但\"直说\"不是\"乱说\"，您说我懒得有依据，说我不上心得有具体事，不然就是人身攻击。","meaning":"你把\"亲友\"和\"社会\"分开，要求对方用更高的标准对待你，逻辑有力。","guidance":"保持这个态度。亲友之间更该互相尊重，不是更可以随便伤害。"},{"type":"回击型","text":"我记仇？您说我不上心、说我懒，我都没翻脸，您倒说我记仇。我刚才那句就是让您体验一下被\"直说\"的感觉，您都不舒服，凭什么我就该受着？","meaning":"你用\"体验\"解释回击，让对方知道被\"直说\"的感受，促成共情。","guidance":"这招叫\"换位体验\"，说完可以缓和：咱以后都别用\"说话直\"当借口，好好说话行吗？"}]}},{"npc":"你要是真把我当朋友，这点忙不会不帮吧？","intent":"用友谊做测试，把拒绝等同于\"不够朋友\"，逼你答应。","moves":["友谊绑架","测试忠诚"],"choices":[{"type":"软弱型","text":"你都说到朋友份上了，我不帮也说不过去；你先讲是什么事，我尽量给你搭把手。","meaning":"你被\"够不够朋友\"拉进义务里，还没判断事情就先答应尽量帮。","guidance":"朋友关系不是空白支票。先听事，再决定；可以说：我在乎你，但能不能帮要看事情和我的能力。"},{"type":"中立型","text":"不是不帮，是这个事我确实不太方便。","meaning":"你在解释自己\"不是不帮\"，但还是掉进了\"不帮=不够朋友\"的框架。","guidance":"不需要解释\"不是不帮\"。直接说：这件事我帮不了，但如果你需要XX方面的帮助，我可以看看。"},{"type":"边界型","text":"正因为把你当朋友，我才实话实说。这件事我帮不了，不是不愿意，是不方便。朋友之间应该能接受\"不行\"这个回答。","meaning":"你重新定义了\"朋友\"——不是有求必应，而是可以坦诚说不行。","guidance":"保持这个原则。如果对方因为你拒绝就翻脸，那说明这段友谊本身就是有条件的。"},{"type":"回击型","text":"你要是真把我当朋友，就不会用友谊来威胁我。","meaning":"你戳中了对方的逻辑漏洞，这句反击非常精准。","guidance":"这句回击效果好，但语气可以再平和一点：真朋友不会让对方为难，你说对吧？"}],"followUp":{"npcByType":{"软弱型":"这才对嘛。不过这事比我想的大点，你再帮我多帮一块儿呗，反正都帮了，不差这点。","中立型":"不方便？你都没问什么事就说不方便？你这就是先拒绝再找理由，到底当不当我是朋友你直说。","边界型":"痛快答应的不是朋友，是傻子。真朋友会把事情说清楚，让对方有判断的余地。","回击型":"威胁？我开个口就成威胁了？行，算我看错人了，你这朋友我不高攀，以后各走各的。"},"intent":"追问轮把你的边界说成\"客气\"和\"看错人\"，用绝交威胁逼你让步，让你为维护友谊而妥协。","moves":["绝交威胁","看错人标签"],"choices":[{"type":"软弱型","text":"你别把话说这么绝，咱这么多年关系别因为这事伤了；你说吧，我能帮的就先帮你。","meaning":"你害怕失去关系，于是把决定权交给对方；对方会记住用翻脸威胁能让你让步。","guidance":"关系重要也不能被威胁。稳一点的回应是：我不想翻脸，但也要先知道是什么事，不能一口答应。"},{"type":"中立型","text":"我没说不当您是朋友，但朋友之间也得说明白事。您先告诉我具体要帮什么，我再判断能不能帮，这不是客气，是负责。","meaning":"你把\"先问事\"说成\"负责\"，但对方可能继续逼你先答应再说。","guidance":"更坚定：朋友之间也要先说事再答应，不说事就让我答应，这不是朋友该做的事。"},{"type":"边界型","text":"痛快答应的不是朋友，是傻子。真朋友会把事情说清楚，让对方有判断的余地。您连什么事都不说就要我答应，不答应就是\"看错人\"，这哪是朋友，这是绑架。您要说事，我听着；您要绝交，那我也拦不住。","meaning":"你把\"绑架\"点破，同时给了对方选择：说事或绝交，把球踢回去。","guidance":"保持这个态度。真朋友不会因为你问\"什么事\"就翻脸，翻脸的本来就不是真朋友。"},{"type":"回击型","text":"您说各走各的，那我倒要问问，这段友谊里您付出过什么？每次都是您开口我帮忙，我拒绝一次您就要走，这友谊本来就是单向的，走就走吧。","meaning":"你戳穿了对方\"友谊\"的单向本质，把绝交威胁变成你的选择。","guidance":"这话很冲，说完关系基本就结束了。如果还想留余地，换成边界型那句。"}]}},{"npc":"你是不是现在混好了，就看不起我们了？","intent":"用身份变化攻击你的拒绝，让你为了证明\"没变\"而妥协。","moves":["身份攻击","自证陷阱"],"choices":[{"type":"软弱型","text":"哥，我真没有那个意思，你们都是自家人，我怎么可能看不起谁呢。","meaning":"你急着洗清\"看不起亲戚\"的指控，话题从能不能帮忙变成了你的人品自证。","guidance":"被扣帽子时不要追着证明清白。可以把焦点拉回事情：不是看不起，是这件事我确实办不了。"},{"type":"中立型","text":"不是看不起，只是这个事我确实帮不了。","meaning":"你在解释\"不是看不起\"，但还是在对方的框架里。","guidance":"不解释，直接说：帮不帮和看不看得起没关系，这件事我帮不了，其他事我能帮的我会帮。"},{"type":"边界型","text":"帮不了忙和看不起人是两回事。我拒绝这件事，不代表我变了。如果我每次拒绝都被说成\"看不起人\"，那以后我不敢再说实话了。","meaning":"你区分了\"拒绝\"和\"看不起\"，同时指出了对方这种说法的后果：以后你不敢说实话。","guidance":"保持这个态度。如果对方还是纠缠，可以终止对话：你要这么想我也没办法，但我确实帮不了。"},{"type":"回击型","text":"我混好了？那我之前找你帮忙你怎么说的？","meaning":"你想用旧事反击，但如果对方确实帮过你，这句话会反噬。","guidance":"更通用的说法：看不看得起不是用帮不帮忙来衡量的，我尊重你，但也尊重我自己的边界。"}],"followUp":{"npcByType":{"软弱型":"没有？那你怎么连这点忙都不帮？嘴上说没看不起，做的事全是看不起，你当我们瞎啊？","中立型":"帮不了？你混得这么好帮不了？你就是不想帮，找什么借口。你要真没看不起我们，你想办法也得帮。","边界型":"两回事？你忘了你困难的时候谁帮你的了？现在你有本事了，翻脸不认人，这就是你说的两回事？","回击型":"好，我当年没帮你，我错了，行了吧？你现在记着仇呢，我这辈子做的错事你都记着，我这亲戚当得真失败。"},"intent":"追问轮用旧恩情绑架你，把你的拒绝说成\"翻脸不认人\"，用道德大旗压制你的边界。","moves":["旧恩绑架","翻脸标签"],"choices":[{"type":"软弱型","text":"哥，小时候那些事我都记着，不是现在翻脸；我只是怕自己办不好，您看看能不能再问问别人。","meaning":"你被旧情拉回解释模式，还把拒绝包装成\"怕办不好\"，这会给对方继续劝你的空间。","guidance":"念旧情可以，但别让旧情替现在的请求做决定。更清楚的是：情分我记得，这件事我帮不了。"},{"type":"中立型","text":"咱别扯过去的事，就事论事，这件事我帮不了，原因我不便多说，您信我就别追了。","meaning":"你想跳过旧账谈现在，但\"不便多说\"反而激发对方的好奇和不满。","guidance":"更直接：过去的事我记着，但和这次没关系。这次帮不了，您找别人吧。"},{"type":"边界型","text":"您当年帮没帮过我，我心里有数，该感谢的我没少感谢。但这不代表我每次拒绝都是\"翻脸\"。您要是把每次拒绝都算成忘恩，那以后我不敢再跟您来往了，因为来往就意味着有求必应，这我做不到。","meaning":"你把\"来往\"和\"有求必应\"分开，指出对方逻辑的后果，逻辑有力。","guidance":"保持这个态度。真正的恩情不是无限提款权，对方把恩情当筹码恰恰是对恩情的亵渎。"},{"type":"回击型","text":"您当亲戚当得失败不失败我不知道，但您拿恩情逼我帮忙这事挺失败的。亲戚之间是互相尊重，不是谁帮过谁就能一直要账，您要这么算，咱俩把这账一笔笔算清楚，看谁欠谁。","meaning":"你把\"算账\"的主动权拿回来，让对方知道算账是双刃剑。","guidance":"这话很冲但逻辑有力。关系已经僵了才用，关系还行就换成边界型那句。"}]}},{"npc":"我都是过来人，你不听以后有你后悔的。","intent":"用经验压制你的判断，让你觉得不听就是不明智。","moves":["过来人压制","后悔恐吓"],"choices":[{"type":"软弱型","text":"爸，您经验多，我也怕自己判断错；那我先不急着定，再按您说的方向想两天。","meaning":"你用再考虑来缓冲冲突，却把父亲的经验放在自己的判断之上，对方会觉得你已经开始动摇。","guidance":"参考经验可以，但别用拖延代替选择。可以说：我会再核对信息，但决定标准还是我自己定。"},{"type":"中立型","text":"您的经验我听了，但我情况可能不一样。","meaning":"你想表达情况不同，但\"我听了\"等于先认可了对方经验的适用性。","guidance":"不需要先认可。直接说：谢谢分享您的经验，但我的情况不太一样，我会结合自己的实际做判断。"},{"type":"边界型","text":"谢谢您的经验分享。每个人的情况不同，您的经验我参考，但决定还是我自己做。如果我错了，那也是我自己的选择和代价。","meaning":"你感谢了对方的分享，同时明确\"决定权在我\"，并且接受了可能的后果。","guidance":"保持这个态度。如果对方说\"到时候别后悔\"，可以回：后悔也是我自己的事，我承担。"},{"type":"回击型","text":"过来人？那你当年听了你爸妈的话了吗？","meaning":"你用对方自己的经历反驳\"过来人\"的权威，很精准，但可能引发旧事争论。","guidance":"更平和的说法：您当年也不一定全听了长辈的吧？每代人都有自己的路要走。"}],"followUp":{"npcByType":{"软弱型":"想什么想，这事没什么好想的，听我的就对了。你要是不听，将来摔了跟头别回来哭。","中立型":"不一样？有什么不一样？你以为你能跳出这个规律？我见过的比你多多了，你那点小心思我还不清楚？","边界型":"参考？你这就是嘴上参考实际不听。我掏心掏肺给你讲，你就一句\"参考\"打发我？我吃的亏你以为我想让你也吃？","回击型":"好，我当年没听，所以我才后悔，我才不想让你重蹈覆辙！我这苦口婆心你当成控制，行，我多管闲事，以后你的事我不掺和。"},"intent":"追问轮把\"为你好\"升级为\"怕你重蹈覆辙\"，用后悔恐吓和苦口婆心绑架你，让你为不听而愧疚。","moves":["后悔恐吓","苦口婆心绑架"],"choices":[{"type":"软弱型","text":"爸，您一说后悔我也慌，我先把决定放一放，照您提醒的那些风险再重新想想。","meaning":"你被\"以后后悔\"吓住，用暂停决定来安抚长辈；这会让对方相信恐吓风险能左右你的选择。","guidance":"风险要评估，但别让恐惧替你做决定。可以回应：我会承担后果，也会把您说的风险纳入考虑。"},{"type":"中立型","text":"我理解您是怕我走弯路，但有些弯路我自己得走一遍才明白。您的经验我记着，真出问题我第一个找您请教。","meaning":"你肯定了对方的好意，同时坚持自己走路的权利，语气比较温和。","guidance":"这招不错，既给了对方面子又守住了边界。但说\"出问题找您\"要兑现，否则下次更难说服。"},{"type":"边界型","text":"您苦口婆心我领情，但\"为您好\"不等于\"替我决定\"。您的经验是您的，我的路是我的，我可能摔跟头，但摔了我会自己爬起来。您要真为我好，就让我试一次，别用后悔来吓我。","meaning":"你把\"为你好\"和\"替我决定\"分开，同时接受摔跟头的可能，逻辑闭环。","guidance":"保持这个态度。摔了跟头不找对方负责，对方就没办法用\"早告诉过你\"来压制你。"},{"type":"回击型","text":"您当年没听您爸妈的，所以您才有今天，对吧？那您凭什么要求我听您的？您要是当年听了，现在能坐在这教训我吗？经验可以分享，但不能复制，我走我的路，您别拦。","meaning":"你用对方自己的经历反制\"过来人\"权威，逻辑非常有力。","guidance":"这话有力但可能伤人。如果对方当年确实因为没听而吃过亏，这句就太扎心了，慎用。"}]}},{"npc":"我帮你指出问题，你还不高兴？","intent":"把评价包装成帮助，让你觉得不高兴就是不领情。","moves":["为你好包装","指出问题包装"],"choices":[{"type":"软弱型","text":"我没有不高兴，亲戚朋友愿意点我也是为我好，我回去好好想想。","meaning":"你把泛泛批评全解释成善意提醒，压住了自己的不舒服；对方以后会继续用\"为你好\"评价你。","guidance":"亲友提醒可以听，但要分清具体建议和情绪评价。可以问：您具体指哪件事？有具体例子我才好判断。"},{"type":"中立型","text":"我知道你是好意，但你说的我不太认同。","meaning":"你表达了不认同，但\"我知道你是好意\"先接受了对方的包装。","guidance":"不需要先肯定好意。直接说：你指出的问题我不认同，你能具体说说是哪件事吗？"},{"type":"边界型","text":"如果是具体建议我欢迎，但如果是空泛评价我不太需要。你说的\"问题\"具体指什么？能举个例子吗？","meaning":"你区分了\"具体建议\"和\"空泛评价\"，并把对方拉到事实层面。","guidance":"保持这个区分。如果对方说不出来具体例子，那就说明这个\"问题\"只是他的主观评价。"},{"type":"回击型","text":"你帮我指出问题？那我也能帮你指出几个，你想听吗？","meaning":"你用对称反将一军，让对方感受到被评价的不适。","guidance":"可以轻松一点说：好啊，那我们互相指出问题，一人一个，公平吧？"}],"followUp":{"npcByType":{"软弱型":"光谢没用啊，你得改。我给你指出三条问题，你回去好好想想，下回见面我跟你说说怎么改。","中立型":"不认同？我说的哪条不对？你说说看。你不认同就是不想改，别找借口。","边界型":"空泛？我每条都说得清清楚楚，是你自己听不进去。给你指出问题你还不领情，你这人怎么这么难进步？","回击型":"你这是要跟我对着干是吧？我好心给你提意见，你反过来挑我刺，你这人听不进一点意见，难怪原地踏步。"},"intent":"追问轮把你的不认同说成\"不想改\"和\"难进步\"，用关心包装批评，让你为不接受而自责。","moves":["难进步标签","不领情标签"],"choices":[{"type":"软弱型","text":"姨，您愿意跟我说这些也是把我当自己人，我回去一条条想，下次聚会再跟您说我改得怎么样。","meaning":"你不但接下了对方列的问题，还承诺复盘进度，等于让亲戚获得了监督你的资格。","guidance":"不要把亲友的评价变成考核。可以感谢提醒，但只说：我会自己判断哪些需要调整，不用下次汇报。"},{"type":"中立型","text":"我没说您说错，我是说有些我不认同，咱能不能逐条聊，哪条我有不同看法咱展开说？","meaning"
