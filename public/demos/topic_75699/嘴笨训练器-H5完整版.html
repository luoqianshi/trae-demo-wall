:"你想逐条讨论，但对方可能觉得你在抬杠，更不高兴。","guidance":"逐条讨论要就事论事。如果对方说不出具体事，那就停在\"不认同\"上，不用勉强达成一致。"},{"type":"边界型","text":"难不难进步不是您一句话定的。我接受具体、建设性的意见，不接受空泛的人格评价。您要是真想帮我，就事论事说哪件事、怎么改，别用\"你这人怎么这样\"来概括。","meaning":"你把\"具体建议\"和\"人格评价\"分开，只接受前者不接受后者，边界清晰。","guidance":"保持这个态度。如果对方说不出具体事还坚持\"你难进步\"，那说明他不是在帮你，是在贬低你。"},{"type":"回击型","text":"您说我不领情、难进步，那您有没有想过，您这种\"指出问题\"的方式本身就有问题？您要是真想帮我，会说\"这件事可以这样做\"，而不是\"你这人怎么这样\"。您这是批评不是帮助，我分得清。","meaning":"你区分了\"批评\"和\"帮助\"，直接戳穿对方\"为你好\"的包装。","guidance":"这话有力但可能引发争吵。如果不想吵，换成边界型那句，效果一样但更温和。"}]}},{"npc":"你别总讲边界，家人之间哪有那么多边界。","intent":"把亲密关系当成越界许可，让你觉得在家人面前设边界是不近人情。","moves":["亲情施压","边界否定"],"choices":[{"type":"软弱型","text":"妈，您要觉得我这么讲太见外，那我先不提了，家里人之间别因为这点边界闹得不舒服。","meaning":"你为了维持家里和气，把已经提出的隐私边界收回去了；家人会更容易认为边界就是生分。","guidance":"家人也需要边界，尤其是隐私和生活安排。可以温和坚持：不是见外，是每个人都需要一点私人空间。"},{"type":"中立型","text":"不是不讲边界，只是觉得跟家人不用分那么清。","meaning":"你在退让了，\"不用分那么清\"等于默认了对方可以适当越界。","guidance":"不需要退让。直接说：正因为是家人，才需要边界，这样相处起来才不累。"},{"type":"边界型","text":"正因为是家人，才更需要边界。没有边界的亲密关系最容易伤人，因为越亲近的人越知道你的软肋。设边界不是疏远，是为了长久相处。","meaning":"你重新定义了\"边界\"——不是疏远，是保护关系。这个框架很难反驳。","guidance":"保持这个逻辑。可以举例：你看那些关系好的家庭，恰恰是因为互相尊重彼此的空间和选择。"},{"type":"回击型","text":"家人之间没边界？那你为什么不在我洗澡的时候进浴室？那不也是家人吗？","meaning":"用极端例子让对方承认边界存在，但这个例子太极端，可能引发尴尬。","guidance":"更日常的例子：那你翻我手机也行？那我问你工资多少你也告诉我？边界一直都有，只是有些你没意识到。"}],"followUp":{"npcByType":{"软弱型":"这才对嘛。来，跟我说说你最近挣多少、谈没谈对象、房子首付攒多少了，一家人不用藏着掖着。","中立型":"对啊，不用分那么清，那你跟我说说呗，有什么好藏着掖着的？你是不是有什么见不得人的事？","边界型":"需要边界？你跟爸妈讲边界？我们养你的时候你怎么不讲边界？现在翅膀硬了，跟我们划清界限了是吧？","回击型":"你说这话什么意思？我什么时候进你浴室了？你拿这种话恶心我，我这当家长的还做错了？行，以后我什么都不管你了。"},"intent":"追问轮用养育之恩压制你的边界，把隐私需求说成\"见不得人\"和\"划清界限\"，让你为设边界而愧疚。","moves":["养育恩情绑架","见不得人标签"],"choices":[{"type":"软弱型","text":"妈，我不是防着您，也不是见不得人；工资的事我回头跟您说个大概，您别觉得我跟家里隔心。","meaning":"你被\"隔心\"和\"见不得人\"压住，开始交出隐私来证明亲近；之后想收回就更难。","guidance":"亲近不是把所有信息都公开。可以只给安全范围：我们够用，具体数字就不展开了，希望您理解。"},{"type":"中立型","text":"我没藏着掖着，就是有些事我习惯自己消化，等我想说的时候自然跟您说，您别追着问，越追我越不想说。","meaning":"你表达了\"想说再说\"的意愿，但语气偏软，对方可能继续追。","guidance":"更明确：有些事我不想说，您问我也不会说，这不是藏着掖着，是我的空间。"},{"type":"边界型","text":"养我和讲边界不冲突。您养我是您的责任，我感谢您；但我现在是成年人，有自己的隐私和空间，这不是\"划清界限\"，是正常的事。您要真想跟我亲近，就尊重我想说的和不想说的，强迫我说反而把我推远。","meaning":"你把\"养育\"和\"边界\"分开，同时指出强迫分享的后果——推远关系。","guidance":"保持这个态度。强迫分享只会让对方越来越沉默，真正亲近的关系是自愿分享的。"},{"type":"回击型","text":"您说以后什么都不管，那您倒是说到做到啊。每次说不管，转头又翻我抽屉、问我行踪、催我结婚，您这\"不管\"成本也太低了。我要的边界就是让您真的别管不该管的，不是嘴上说说。","meaning":"你戳穿了对方\"以后不管\"的虚张声势，把边界要求具体化。","guidance":"这话很冲但有力。如果不想撕破脸，换成边界型那句，留个体面。"}]}},{"npc":"这事你别告诉别人，免得大家难看。","intent":"用面子阻止你求助或留痕，让你独自承受，对方也不用承担责任。","moves":["面子绑架","封口施压"],"choices":[{"type":"软弱型","text":"行，我先不跟家里其他人讲，免得大家都难堪；这事我自己消化一下。","meaning":"你把亲友的面子放在自己的压力前面，选择独自承担；对方则不用面对事情带来的后果。","guidance":"如果事情影响你的权益或身心健康，不该只为对方面子保密。至少找一个可信的人商量，而不是自己硬扛。"},{"type":"中立型","text":"我知道了，但如果实在不行我可能得找人说。","meaning":"你想保留求助的权利，但\"可能得\"语气太弱，对方可能继续施压。","guidance":"更明确：如果这事影响到我，我会跟该说的人说。面子是一起维护的，不是让我一个人扛的。"},{"type":"边界型","text":"如果只是小事我可以不说。但如果这事影响到我，我需要跟信任的人商量。你不能要求我为了\"大家好看\"而一个人扛着。","meaning":"你区分了\"小事\"和\"影响我的事\"，在小事上给了面子，在大事上守住了权利。","guidance":"保持这个原则。如果对方坚持不让你说，那这件事可能比你想的更严重，更应该说出来。"},{"type":"回击型","text":"你怕难看？那你别做啊。做了还怕人知道？","meaning":"你戳中了对方\"做了事又怕被知道\"的矛盾，但语气太冲。","guidance":"更冷静的说法：如果这事说出来会难看，那说明这事本身有问题，我们一起想办法解决，而不是让我一个人藏着。"}],"followUp":{"npcByType":{"软弱型":"不光不能说，你还得帮我瞒着。要是有人问起来，你就说不知道，记住啊，这关系到咱们全家的脸面。","中立型":"什么实在不行？这事有什么不行的？你就是想说，别找借口。你要是说了，咱家在亲戚里还怎么抬头？","边界型":"影响到你？你是这家人的一员，家里的事就是你的事，你还\"影响你\"？你这人怎么这么自私，只想着自己？","回击型":"行，我做错了，我见不得人，你满意了吧？你要去说就去说，让全家人都跟着丢脸，你心里就舒服了？"},"intent":"追问轮把你的求助说成\"自私\"和\"让全家丢脸\"，用家族面子绑架你独自承受，封死你求助的路。","moves":["家族面子绑架","自私标签"],"choices":[{"type":"软弱型","text":"您先别急，我不会往外传的，这事就先压在我这儿，家里要问起来我也不提。","meaning":"你为了安抚对方，主动承担保密责任和后续压力；对方会把处理后果的负担转嫁给你。","guidance":"保密前先判断是否会伤害自己或别人。涉及权益、债务、健康等问题时，不能只按对方的面子需求来处理。"},{"type":"中立型","text":"我没要去宣扬，我只是说万一这事大了，我一个人扛不住。您也别逼我打包票，我得看情况。","meaning":"你想保留判断权，但\"看情况\"给了对方继续施压的空间。","guidance":"更明确：如果是小事我不说，如果影响到我或家人我一定会找该说的人说，这是我的底线。"},{"type":"边界型","text":"家里的事是大家的事，但\"大家\"不是一个人。这事如果是您个人的事，我可以不说；如果牵涉到我或者全家，我有权跟该商量的人商量。您要面子，我也得为自己负责，不能因为您一句\"难看\"就让我一个人扛。","meaning":"你区分了\"个人事\"和\"牵涉全家的事\"，在后者上守住了求助权。","guidance":"保持这个原则。如果对方坚持封口，那这事很可能比你想的严重，更应该告诉能帮你的人。"},{"type":"回击型","text":"您说让全家丢脸，可这事是您做的，不是我做的。要丢脸也是您先丢，我现在帮您瞒着是给您面子，您倒拿\"自私\"压我。您要真怕丢脸，以后做事之前先想想脸面，别做完了让我替您守。","meaning":"你把\"丢脸\"的责任还给对方，同时指出你现在帮忙瞒着已经是让步。","guidance":"这话有力但可能引发激烈反应。如果对方情绪激动，先撤出对话，保护自己优先。"}]}},{"npc":"你怎么这么不会做人？","intent":"用空泛评价压制具体讨论，让你觉得是自己的做人能力有问题。","moves":["人格否定","空泛评价"],"choices":[{"type":"软弱型","text":"姨，可能我确实有些地方不懂人情世故，您跟我说说是哪儿没做好，我以后注意。","meaning":"你先接受了\"不会做人\"的标签，再请求对方评判你；这会让亲友站到教育你的位置。","guidance":"人格标签不等于反馈。可以只接具体事：您说哪件事不合适我可以听，但\"不会做人\"这个说法太重了。"},{"type":"中立型","text":"我不是不会做人，只是有些事我有自己的原则。","meaning":"你在解释\"不是不会做人\"，但这个框架里\"会做人=好\"已经成立了。","guidance":"不需要解释。直接问：你说的\"不会做人\"具体指哪件事？"},{"type":"边界型","text":"做人没有标准答案，你说的'不会做人'具体指哪件事？如果是我处理方式有问题，我们可以讨论具体怎么改，但不要用'不会做人'来概括。","meaning":"你拒绝接受人格评价，同时愿意讨论具体事情，既守住了边界又显得开放。","guidance":"保持这个态度。如果对方说不出来，那\"不会做人\"就是纯粹的情绪宣泄，不需要当真。"},{"type":"回击型","text":"你这么会做人，你怎么还混成这样？","meaning":"你用对方的标准反将一军，但这句话杀伤力太大，会直接撕破脸。","guidance":"更克制的说法：每个人做人方式不同，我可能不符合你的标准，但我有自己的原则。"}],"followUp":{"npcByType":{"软弱型":"哪里？哪都是！你看看你，对长辈不热情，对亲戚不主动，办事也没眼力见，这还用我一条条说？","中立型":"原则？你的原则就是让人难堪？你这叫有原则？你倒是说说你的原则是什么，让大家评评理。","边界型":"还用具体？你整个人给人的感觉就是不会做人。你非要我举例子？那我说出来你可别不高兴，到时候又说我不给你面子。","回击型":"好，我混得不好，我窝囊，你满意了吧？我教训你是为你好，你反过来戳我痛处，你这人真是白眼狼。"},"intent":"追问轮用\"为你好\"包装人身攻击，把你的质疑说成\"白眼狼\"，让你为反击而愧疚。","moves":["为你好包装","白眼狼标签"],"choices":[{"type":"软弱型","text":"姨，您这么一说我也反省，可能我平时礼数真有不到的地方，您多担待，我以后慢慢补。","meaning":"你把笼统否定内化成自己的问题，还反过来请求对方包容；对方会继续用这种高度概括的评价压你。","guidance":"可以反省具体礼数，但不要接受整个人被否定。建议回应：哪件事我没做好可以说具体，别直接说我不会做人。"},{"type":"中立型","text":"我没说您教训得不对，但\"不会做人\"这词太大了，咱能不能就具体事聊？您说一件，我反思一件。","meaning":"你想把空泛评价拉到具体事，但对方可能继续用\"哪都是\"搪塞。","guidance":"更明确：您说不出具体事，那\"不会做人\"就是主观评价，我可以选择不接受。"},{"type":"边界型","text":"您要举例子就举，别拿\"不高兴\"来堵我。我欢迎具体反馈，不接受笼统否定。您要是说不出来具体事，那\"不会做人\"就是您的主观评价，我可以选择不接受。还有，您为我好我知道，但\"为我好\"不是人身攻击的免死金牌。","meaning":"你把\"具体反馈\"和\"笼统否定\"分开，同时指出\"为你好\"不能成为攻击的理由。","guidance":"保持这个态度。说不出来具体事的\"不会做人\"就是情绪宣泄，不用当真。"},{"type":"回击型","text":"我没戳您痛处，是您先戳我的。您说我不会做人，我说您混得不好，这叫对等。您要觉得这话难听，那\"不会做人\"也难听，您先停，我也停。咱别互相攻击，有事说事。","meaning":"你把互相攻击拉回到\"对等\"和\"停战\"，既反击了又给了台阶。","guidance":"这招叫\"对等停战\"，效果好。说完可以缓和：咱都别互相挑刺了，有啥事说啥事。"}]}},{"npc":"我以前帮过你，现在你帮我不是应该的吗？","intent":"把旧情变成无限期债务，让你觉得拒绝就是忘恩负义。","moves":["恩情绑架","翻旧账"],"choices":[{"type":"软弱型","text":"你以前确实帮过我，这份情我记着；你先说要我怎么帮，我看看能不能还上这份人情。","meaning":"你把过去的帮助理解成现在必须偿还的债，还没了解风险就把自己放进了还人情的位置。","guidance":"感恩不等于无限答应。可以先承认情分，再保留判断：我记得你的好，但这件事要看风险和能力。"},{"type":"中立型","text":"我很感谢你之前帮我，但这个事我确实不太方便。","meaning":"你想表达感谢同时拒绝，但\"感谢\"在前就先承认了\"欠债\"的关系。","guidance":"不需要先感谢。直接说：你帮过我我记得，但这件事我帮不了。感恩和答应帮忙是两回事。"},{"type":"边界型","text":"你帮过我我很感激，但感激不等于有求必应。如果你觉得帮过我就可以随时要求回报，那当初的帮忙就不是帮忙，是投资。","meaning":"你区分了\"帮忙\"和\"投资\"，这个区分非常有力。对方很难说\"我帮你就是为了以后要回报\"。","guidance":"保持这个区分。如果对方说\"那你就是忘恩负义\"，可以回：我记着你的好，但不接受用恩情来要挟。"},{"type":"回击型","text":"你帮我的时候说是帮忙，现在来要回报了？那你当初到底是帮忙还是放贷？","meaning":"你直接戳穿了对方的逻辑，\"帮忙vs放贷\"这个对比很精准。","guidance":"这句回击效果好，看关系决定用不用。如果不想太冲，可以用边界型那句。"}],"followUp":{"npcByType":{"软弱型":"也不算大事，就帮我担保贷个款，签个字就行。你以前找工作我也托了人，这次你帮我是应该的。","中立型":"不方便？签个字而已又不让你出钱。你这就是不想帮，别拿不方便搪塞我。当年我帮你的时候可没这么多废话。","边界型":"投资？我帮你叫投资？你这话说得太伤人了。我当年帮你完全是亲情，你现在倒好，把我的好意说成算计，你还有良心吗？","回击型":"行，我放贷，我图你回报，我以后再也不帮你了。我这辈子做的最大错事就是帮你，养出个白眼狼。"},"intent":"追问轮把帮忙说成\"亲情\"但要求\"应该回报\"，用恩情无限期绑架你，把你的边界说成\"没良心\"。","moves":["良心绑架","白眼狼标签"],"choices":[{"type":"软弱型","text":"哥，我不是说你算计我，你以前帮我的事我都记着；担保这事我先回去跟家里商量两天，别让我现在就表态。","meaning":"你用商量拖住场面，却没有拒绝高风险请求；对方会继续利用旧情催你给出肯定答案。","guidance":"担保不是普通帮忙，风险会落到你和小家庭身上。别用拖延给希望，应该明确：担保我不能做，其他低风险的事我可以看看。"},{"type":"中立型","text":"我承认您当年帮过我，我心里一直记着。但帮忙和回报不是一码事，更不是什么\"应该的\"。您要的具体事我可以考虑，但不能用\"应该\"来要求我。","meaning":"你承认了恩情但拒绝了\"应该\"的逻辑，语气比较温和。","guidance":"这招不错，但\"考虑\"给了对方希望。如果确实帮不了，直接说不方便。"},{"type":"边界型","text":"您帮过我我记着，该还的人情我会还，但不是这种方式、不是这种语气。担保贷款有法律风险，这不是签字那么简单。您要真把我当亲人，就不会用恩情逼我承担这种风险。我感激您，但感激不等于被绑架。","meaning":"你把\"还人情\"和\"被绑架\"分开，同时指出担保的具体风险，逻辑有力。","guidance":"保持这个态度。担保是大事，不能因为面子或恩情就签。真出了事对方不会替你扛。"},{"type":"回击型","text":"您说再也不帮我，那行，咱把过去的人情列个清单，我能还的还，还不完的我认。但您要的是\"应该\"，是\"无限期回报\"，这不是人情是债务。您要真这么算账，那咱俩以后别谈感情了，谈账吧。","meaning":"你把\"人情\"和\"债务\"分开，戳穿对方把恩情当无限提款权的本质。","guidance":"这话很冲但逻辑有力。关系已经僵了才用，关系还行就换成边界型那句。"}]}},{"npc":"算了算了，跟你说话真累。","intent":"用退场制造你的愧疚，让你追着解释、主动让步，对方不战而胜。","moves":["退场操控","愧疚制造"],"choices":[{"type":"软弱型","text":"妈，您先别走，我不是非要跟您顶，可能我刚才说急了，我再换个说法跟您讲。","meaning":"你被对方退场吓到，马上把问题揽到自己表达方式上；这会让对方用离开来迫使你软化。","guidance":"对方要暂停可以暂停，但别追着让步。可以说：您累了我们先停，等都平静了再谈，我的想法没有变。"},{"type":"中立型","text":"那我们先不说了，以后再聊。","meaning":"你给了双方台阶，但没有被愧疚绑架，这比上一个好。","guidance":"可以再坚定一点：好，等你愿意聊的时候再说。不要主动去追。"},{"type":"边界型","text":"如果你觉得累，我们可以暂停。但我不会因为你说累就改变我的立场。等你想聊了，随时找我。","meaning":"你允许暂停，但明确表示\"暂停不等于我让步\"。对方用退场施压的策略失效了。","guidance":"保持这个态度。如果对方真的走了，不要追，等他回来。如果他不回来，说明这段关系本身就有问题。"},{"type":"回击型","text":"跟你说话才累呢，什么事都要按你的来。","meaning":"你反过来指责对方，但这样会变成互相抱怨，没有建设性。","guidance":"更冷静的说法：我也觉得我们聊得不太顺畅，那先休息一下，改天再聊。"}],"followUp":{"npcByType":{"软弱型":"说说说，说什么说？我说一句你顶三句，我哪还有力气说？你看看你，把人逼成什么样了？","中立型":"以后还聊什么？每次都这样，我说你你不听，还说什么？我看咱俩以后就别聊了，省得你嫌我烦。","边界型":"立场立场，你跟家人讲立场？我累是因为你太固执，你不改我还聊什么？合着我说累是错的，你立场是对的？","回击型":"行，我累了，跟你说话累得我心口疼。你满意了？你赢了？你就这么对我，我这把年纪了还能活几年，你就这么气我？"},"intent":"追问轮用年龄和健康威胁你，把你的坚持说成\"气长辈\"，让你为维护立场而背负不孝的愧疚。","moves":["年龄威胁","不孝标签"],"choices":[{"type":"软弱型","text":"妈，您身体要紧，我不说了，刚才是我语气不好，您先歇着，别因为我这点事气坏了。","meaning":"你把对方的身体和情绪都揽到自己身上，主动停止表达；对方会知道用\"我累了\"就能结束不利的话题。","guidance":"照顾长辈身体可以，但别因此放弃议题。更稳的是：先休息，我也为语气道歉，但这件事之后还要谈。"},{"type":"中立型","text":"我没说您累是错的，我也没说我一定对。咱都消消气，等心平气和了再聊，现在聊谁都不舒服。","meaning":"你想双方都退一步，但\"我没说我一定对\"等于立场松动，对方会乘胜追击。","guidance":"别松动立场。可以说：我说话方式可以改，但我的想法不会因为您说累就变。"},{"type":"边界型","text":"您用年纪和健康来压我，我不能接受。我坚持立场不等于气您，您不舒服我理解，但不能用\"还能活几年\"来让我妥协。真要为我好，就让我把话说完，咱平等地聊，不是谁累谁就有理。","meaning":"你把\"坚持立场\"和\"气长辈\"分开，拒绝接受年龄健康绑架。","guidance":"保持这个态度。对方用健康威胁是操控，你不用为对方的情绪反应负责。"},{"type":"回击型","text":"您说您心口疼，那我建议您去看医生，别拿这个来压我。我尊重您年纪大，但年纪大不是让我放弃立场的理由。您要真气坏了身子，那是您自己选择生气，不是我让您生的，这锅我不背。","meaning":"你把\"生气\"的责任还给对方，拒绝背\"气长辈\"的锅。","guidance":"这话很冲但逻辑有力。如果对方真有健康问题，这话可能引发严重后果，慎用。"}]}}],"relationship":[{"npc":"我不回消息只是想静静，你一直问只会让我更烦。","intent":"把长期不回应造成的不安，反过来归因于你\"一直问\"，让对方的不回应变成你的错。","moves":["冷暴力","责任转嫁"],"choices":[{"type":"软弱型","text":"你忙的话我就自己消化一下。","meaning":"你把自己的不安收回去了，也默认了\"问一句就是打扰\"的说法，以后对方不回消息你也只能独自焦虑。","guidance":"不回消息是对方的选择，但你的不安也是真实的。你可以说：我理解你需要空间，但长时间不回消息让我不安，我们能不能约定一个方式？"},{"type":"中立型","text":"我不是要逼你，只是想知道你还好吗。","meaning":"你在解释自己的善意，但\"不是要逼你\"等于先接受了\"你在逼他\"的指控。","guidance":"不需要解释。直接说：我尊重你需要空间，但我也需要知道你是不是安全的，这两个需求不矛盾。"},{"type":"边界型","text":"我尊重你需要空间，但长时间不回消息会让我担心。我们能不能约定：你需要静静的时候，发一句\"我需要空间\"，我就不追问了？","meaning":"你没有放弃自己的需求，同时给了对方一个具体的解决方案，而不是空泛的\"你改/我忍\"。","guidance":"如果对方连这个约定都不愿意做，说明他不想解决问题，只想用沉默控制你。"},{"type":"回击型","text":"你不回消息是你选的，烦也是你的情绪，凭什么赖我？","meaning":"你戳中了对方转嫁责任的问题，但语气太冲，可能激化矛盾。","guidance":"更冷静的说法：你选择不回消息是你的自由，但我持续被忽视也会有自己的感受，这不是我\"问\"出来的。"}],"followUp":{"npcByType":{"软弱型":"你看你自己也清楚问多了我会烦吧？以后我静静的时候你就别吱声了，提一次我就多静两天。","中立型":"你又来了。我刚才说想静静你听不见吗？非要把气氛搞这么僵才甘心？","边界型":"约定？合着你不信任我能自己调节？你要是真爱我就不会连我静静一会儿都要管。我看你根本就是想监视我。","回击型":"你现在是在把问题全推回我身上，好像我只要需要空间就成了罪人。这样聊下去只会更糟。"},"intent":"把\"不回消息\"的控制权牢牢抓在手里，让你不敢再追问，并用情感施压让你觉得自己才是问题制造者。","moves":["冷暴力升级","道德绑架"],"choices":[{"type":"软弱型","text":"嗯，你先一个人待着吧。","meaning":"你彻底交出追问的权利，对方以后不回消息你只能干等。","guidance":"不要用沉默换\"和平\"。你可以说：我等你，但希望你能告诉我大概要多久，我好安排自己。"},{"type":"中立型","text":"我不是不信任你，只是不知道什么时候算\"静完\"。","meaning":"你想明确边界，但\"我不是不信任\"先退让了。","guidance":"直接说：我不是要监视你，我只是需要知道这件事会持续多久，这样我也能安心做自己的事。"},{"type":"边界型","text":"我等你可以，但我需要知道一个时间。是几个小时还是几天？我不是要监视你，是想让自己也有个安排，而不是一直悬着。","meaning":"你给了对方空间，但同时要回了\"知情权\"，不让对方用\"静静\"无限期拖延。","guidance":"如果对方连\"大概多久\"都不愿意给，说明他享受的是你悬着的状态，不是真的需要空间。"},{"type":"回击型","text":"我说的是约定，不是监视。你非要把我关心你说成监视，那我也想问，你是不是享受我不安的样子？","meaning":"你戳穿了对方偷换概念，并反问其动机。","guidance":"语气可以再平：我提的是具体方案，不是控制。如果你不想约定，那我就按我自己的方式处理我的不安。"}]}},{"npc":"你能不能成熟一点，不要什么都要解释。","intent":"把合理沟通需求说成\"不成熟\"，让你觉得想要解释就是幼稚。","moves":["贬低自信","贴标签"],"choices":[{"type":"软弱型","text":"我可能确实问得太细了。","meaning":"你把合理的沟通需求缩成了自己的问题。以后对方做什么你都不能问，因为一问就是\"不成熟\"。","guidance":"想要解释不是不成熟，是基本的沟通需求。成熟不等于什么都不问。"},{"type":"中立型","text":"我不是不成熟，只是有些事想了解清楚。","meaning":"你在自证\"不是不成熟\"，但一旦进入自证，你就已经处于劣势了。","guidance":"不需要自证。直接说：沟通是两个人的事，如果一方想了解、另一方不想说，那不成熟的是不想说的那一方。"},{"type":"边界型","text":"想要解释不是不成熟，是沟通的基本需求。如果你觉得解释没必要，那说明你觉得我的感受不重要。这不是成熟不成熟的问题，是尊不尊重的问题。","meaning":"你把\"成熟\"这个标签拆解了，重新定义为\"尊重\"问题，对方很难反驳。","guidance":"保持这个框架。如果对方说\"你就是太粘人\"，可以回：了解对方在想什么是正常的沟通需求，不是粘人。"},{"type":"回击型","text":"你觉得什么都不问才叫成熟？那叫忍气吞声。你是不是希望我什么都别问、什么都别管，好让你为所欲为？","meaning":"你戳中了对方用\"成熟\"压你的动机，但\"为所欲为\"太攻击性。","guidance":"更克制：成熟的沟通是两个人都愿意表达和倾听，不是一方要求另一方闭嘴。"}],"followUp":{"npcByType":{"软弱型":"你看，你自己也承认了不问。其实你自己也知道问多了没意义吧？以后别这么幼稚了。","中立型":"了解清楚？你了解得够多了，越了解越矫情。能不能别什么事都上纲上线？","边界型":"尊重？我已经够迁就你了，你还把问题说成不尊重。你要这么定义，那我以后很难再开口。","回击型":"我说一句成熟，你就跟我长篇大论。你看，这就是你不够成熟的地方，连一句评价都受不了。"},"intent":"用\"成熟\"作为压制工具，让你觉得沟通本身就是幼稚，从而放弃追问，并把你的不满说成\"矫情\"。","moves":["贬低升级","标签强化"],"choices":[{"type":"软弱型","text":"我会少问一点的。","meaning":"你承认了\"不成熟\"，对方以后可以用\"成熟\"压制你的一切需求。","guidance":"不要把\"不问\"当成成熟。你可以说：成熟是知道哪些事需要沟通，而不是什么都憋着。"},{"type":"中立型","text":"我没上纲上线，就是想知道个所以然。","meaning":"你在解释\"没有上纲上线\"，但还是掉进对方的框架。","guidance":"直接说：我想知道原因不叫上纲上线，叫沟通。如果你觉得解释很累，那说明你不愿意让我了解你。"},{"type":"边界型","text":"我说的不是评价，是我作为伴侣的知情权。成熟不是闭嘴，是知道哪些事必须说清楚。如果你连解释都觉得累，那我担心以后遇到更大的事你更不会说。","meaning":"你把\"成熟\"重新定义，并指出不解释的后果——大事更不沟通。","guidance":"保持这个框架。如果对方连小事都不愿解释，那大事更指望不上。"},{"type":"回击型","text":"你说一句我回十句就是我不成熟？那你用\"成熟\"堵我嘴算什么？算沟通吗？","meaning":"你用对方的逻辑反将，但语气偏冲。","guidance":"更平和：我说的不是评价，是表达需求。如果你觉得表达需求=不成熟，那我们对成熟的理解不一样。"}]}},{"npc":"你要是真爱我，就不会这么计较。","intent":"用\"爱\"做测试，把边界说成\"计较\"，让你觉得拒绝就是不爱。","moves":["用爱施压","情感勒索"],"choices":[{"type":"软弱型","text":"我不是计较，我只是……","meaning":"你开始解释\"不是计较\"，等于接受了\"计较=不好\"的预设。","guidance":"爱和边界不矛盾。真正的爱不会要求你放弃自己的底线。"},{"type":"中立型","text":"我爱你，但有些事我确实在意。","meaning":"你想表达爱同时表达需求，但\"我爱你\"在前就先退让了。","guidance":"不需要先表态爱。直接说：在意不等于计较。如果爱你就要什么都不在意，那不是爱，是服从。"},{"type":"边界型","text":"爱和计较是两回事。正因为我爱这段关系，才需要说清楚什么能接受、什么不能。用爱来要求我放弃底线，那这个爱就有问题。","meaning":"你区分了\"爱\"和\"服从\"，同时指出了\"用爱施压\"本身就是问题。","guidance":"保持这个逻辑。如果对方反复用\"你不爱我\"来施压，这本身就是一种情绪操控。"},{"type":"回击型","text":"你要是真爱我，就不会让我做不愿意做的事。","meaning":"用对方的话术反将一军，这句反击很精准。","guidance":"这句效果好，但语气可以再平和：如果你爱我，应该尊重我的感受，而不是用爱来要求我妥协。"}],"followUp":{"npcByType":{"软弱型":"你看你自己也说不出口吧？你心里也清楚自己计较。以后这种事别提了，提了就是你不爱我。","中立型":"你又在绕。我就问你一句：你到底爱不爱我？爱就别再提了，不爱那咱们就到此为止。","边界型":"你嘴上说爱，做的事全是计较。你要是真把我当回事，就不会为这点小事跟我较劲。我看你根本不在乎这段感情。","回击型":"好啊，原来在你眼里我做什么都不对。我对你好你看不见，一句话没说好你就上纲上线。我真的很难过。"},"intent":"反复用\"爱\"做筹码，把一切边界都说成\"不爱\"，让你在爱与底线之间被迫二选一。","moves":["用爱施压升级","二选一陷阱"],"choices":[{"type":"软弱型","text":"我当然爱你，那我不计较了……","meaning":"你用\"爱\"换\"放弃底线\"，对方会反复用这个套路。","guidance":"爱不是放弃底线的理由。你可以说：我爱你，但爱不等于什么都接受。"},{"type":"中立型","text":"我爱你，但这件事我确实在意。","meaning":"你先表态爱，再表达需求，但顺序错了，先退让了。","guidance":"不要先表态爱。直接说：在意和爱不冲突。把这两件事绑在一起的人，才是有问题的人。"},{"type":"边界型","text":"我不需要用\"不计较\"来证明爱。我爱你，所以才会想跟你把事情说清楚。如果你把每一次沟通都当成\"计较\"，那说明你不想解决问题，只想让我闭嘴。","meaning":"你把\"爱\"和\"沟通\"重新绑定，并指出对方用爱压人的本质。","guidance":"保持这个立场。反复用爱施压的人，本质上是把爱当成控制工具。"},{"type":"回击型","text":"你说的爱就是让我什么都不在意？那不是爱，是服从。你要的是伴侣还是下属？","meaning":"你戳穿了对方\"爱=服从\"的逻辑，但\"下属\"略冲。","guidance":"更平和：爱是相互尊重，不是一方放弃所有需求。如果你觉得爱就是服从，那我们对爱的定义不一样。"}]}},{"npc":"我前任都不会像你这么敏感。","intent":"用比较制造自我怀疑，让你觉得是自己有问题，而不是对方的行为有问题。","moves":["前任比较","贬低自信"],"choices":[{"type":"软弱型","text":"是吗……那我可能确实太敏感了。","meaning":"你接受了\"你不如前任\"的暗示，自我怀疑加深，以后更不敢表达不满。","guidance":"拿前任做比较本身就是一种情感操控。你的感受不需要跟前人比较才有资格存在。"},{"type":"中立型","text":"你为什么要拿我跟前任比？","meaning":"你指出了比较的问题，但这句话更像受伤的反应，而不是有力度的回击。","guidance":"更直接：在关系里拿前任做比较是不尊重人的。如果前任那么好，你应该回去找前任。"},{"type":"边界型","text":"拿前任跟我比较是不公平的。每个人都是独立的，我的感受不需要跟前人对比才有资格。如果你觉得前任更好，你可以重新选择，但不要用比较来贬低我。","meaning":"你没有陷入自我怀疑，也没有攻击对方，而是明确表达了\"比较是不可接受的\"。","guidance":"保持这个态度。如果对方经常拿前任做比较，这是一个严重的红旗信号。"},{"type":"回击型","text":"你前任不敏感？那怎么没走到最后？","meaning":"你用对方的逻辑反将一军，但这句话会引发现任与前任的争吵，不太建设性。","guidance":"更冷静的说法：我不想跟你的前任比，我是我。如果你总是拿前任做标准，那我们需要重新谈谈这段关系。"}],"followUp":{"npcByType":{"软弱型":"你看你自己也觉得敏感了吧？我跟你直说，前任就是比你懂事多了，至少不会什么事都往坏处想。","中立型":"我没有比较，我是陈述事实。你非要往心里去，那就是你自己敏感，跟我有什么关系？","边界型":"我只是提到前任你就受不了。那我问你，你这么敏感，是不是对自己也没信心？你要是有底气，至于在乎我提一句前任？","回击型":"你现在抓着这一句不放，好像我提到前任就十恶不赦。那我以后是不是说什么都要先审一遍？"},"intent":"用前任做标尺持续贬低你，同时把\"被比较的不适\"说成你自己的问题，让你不敢再提。","moves":["前任比较升级","贬低自信"],"choices":[{"type":"软弱型","text":"我以后尽量不那么在意。","meaning":"你接受了\"你不如前任\"的暗示，对方会反复用前任压你。","guidance":"不要承认\"敏感\"是问题。你可以说：你的行为让我不舒服，这跟敏感无关，跟尊重有关。"},{"type":"中立型","text":"你陈述事实也不行，这本身就是不尊重。","meaning":"你指出了问题，但力度不够。","guidance":"更直接：在关系里提前任做比较就是不尊重，没有\"陈述事实\"这种借口。"},{"type":"边界型","text":"提一次前任我可以说是不小心，反复提就是有意。我不需要跟前人比较来证明自己。如果你觉得前任更好，我不会拦你回去找，但我不会接受被拿来比较。","meaning":"你给了对方\"不小心\"的空间，但明确\"反复就是有意\"，并给了选择权。","guidance":"保持这个态度。反复拿前任比较是严重的不尊重，建议认真评估。"},{"type":"回击型","text":"你嘴上说错了，下次还会提。我看你是享受看我难受的样子吧？","meaning":"你戳穿了对方\"道歉但不改\"的模式，但语气偏冲。","guidance":"更冷静：你不是第一次提了。道歉我接受，但下次再提，我会认真考虑这段关系要不要继续。"}]}},{"npc":"我只是跟异性朋友正常聊天，你别控制欲这么强。","intent":"把边界讨论偷换成\"控制欲\"，让你觉得提出不适就是控制对方。","moves":["查岗反咬","标签化"],"choices":[{"type":"软弱型","text":"也许是我太紧张了。","meaning":"你接受了\"控制欲强\"的标签，以后对方跟异性互动你也不敢表达不适了。","guidance":"表达感受不是控制。控制是\"不准你做\"，感受是\"这件事让我不舒服\"。"},{"type":"中立型","text":"我不是控制你，只是有些行为让我不舒服。","meaning":"你在解释\"不是控制\"，但这个框架里你已经处于自证位置了。","guidance":"不需要解释\"不是控制\"。直接说：我表达不舒服不是控制你，你可以做你的选择，但我也有权利表达我的感受。"},{"type":"边界型","text":"表达感受不是控制，控制是不准你做。我说的是这件事让我不舒服，你可以选择怎么做，但我也需要知道我的感受对你来说重要不重要。","meaning":"你区分了\"表达感受\"和\"控制行为\"，让对方无法用\"控制欲\"来压制你的表达。","guidance":"保持这个区分。如果对方反复用\"控制欲\"来堵你的嘴，说明他不想面对你的感受。"},{"type":"回击型","text":"我控制欲强？那你怎么不问问你自己，跟异性暧昧算什么？","meaning":"你直接反击，但\"暧昧\"这个指控如果没有实据，对方会说你无理取闹。","guidance":"更冷静：我说的不是你能不能跟异性聊天，而是你的方式让我不舒服。如果你觉得这叫控制，那我们对边界的理解不一样。"}],"followUp":{"npcByType":{"软弱型":"你看你自己都觉得是我想多了吧？以后我聊天你别过问，问一次就是你不信任我。","中立型":"你说不舒服是你的事，但我又没做什么。你非要把正常社交说得这么难听，我也没办法。","边界型":"你要是真信任我，就不会觉得我聊天有问题。我看你不是在乎我的感受，是占有欲作祟，你自己承认吧。","回击型":"你把普通聊天说得像原则错误一样，那我是不是连正常社交都要被审查？这已经不是谈边界了。"},"intent":"把\"边界讨论\"彻底偷换成\"信任问题\"，让你觉得提感受=不信任，从而闭嘴。","moves":["信任绑架","标签强化"],"choices":[{"type":"软弱型","text":"以后你聊天的事我少问。","meaning":"你彻底放弃表达不适的权利，对方可以继续越界。","guidance":"表达感受不是控制。你可以说：我不过问不代表我不在意，但你这样让我没法再相信你。"},{"type":"中立型","text":"我没说你不正常，只是有些细节让我不舒服。","meaning":"你在解释，但\"没说不正常\"先退让了。","guidance":"直接说：我说的是具体行为让我不舒服，不是说你不能社交。请就事论事。"},{"type":"边界型","text":"我说的不是你能不能聊天，是具体哪些行为让我不舒服。比如深夜单独聊天、聊完就删记录。我不是要你断绝社交，是要你给我一个我也能接受的边界。如果你不愿意谈具体行为，那这件事就没法解决。","meaning":"你把话题拉回\"具体行为\"，并给了对方谈边界的选项，不让他用\"信任\"模糊焦点。","guidance":"保持就事论事。如果对方连\"具体哪些行为\"都不愿意谈，说明他知道自己在越界。"},{"type":"回击型","text":"你把话说得这么极端，是不是想让我觉得自己无理取闹？我说的是具体行为，你扯到断绝社交。","meaning":"你戳穿了对方夸大其词的策略，但语气偏冲。","guidance":"更平和：我说的是某些行为让我不舒服，不是要你谁都不理。你把话说极端，是想让我觉得自己过分吗？"}]}},{"npc":"你每次都把事情想复杂，我真的很累。","intent":"把问题复杂性归咎于你的思考，让对方的不作为变成\"被你想复杂了\"。","moves":["疲劳战术","责任转嫁"],"choices":[{"type":"软弱型","text":"那我不想了，你说怎么办。","meaning":"你放弃了自己的思考，把判断权交给了对方。","guidance":"想清楚不是\"想复杂\"，是负责任。不要因为对方说累就放弃思考。"},{"type":"中立型","text":"我不是想复杂，只是想搞清楚。","meaning":"你在解释\"不是想复杂\"，但还是掉进了对方的框架。","guidance":"不需要解释。直接说：搞清楚不叫想复杂，叫认真。如果你觉得累，那说明你不想面对这些问题。"},{"type":"边界型","text":"想清楚不叫复杂，叫认真。如果你觉得累，可能是因为你不想面对这些问题。我可以放慢节奏，但不会停止思考。","meaning":"你重新定义了\"想复杂\"为\"认真\"，同时指出了对方\"累\"的真正原因——不想面对。","guidance":"保持这个态度。如果对方一直觉得你\"想太多\"，可能他想要的不是一个平等的伴侣，而是一个不提要求的伴侣。"},{"type":"回击型","text":"你觉得想清楚叫累？那什么都不想叫什么？叫摆烂。","meaning":"你戳中了对方不想面对问题的本质，但\"摆烂\"可能激化矛盾。","guidance":"更平和：我不想把事情搞复杂，但有些事确实需要想清楚。如果你不想聊，我们可以等你准备好了再说。"}],"followUp":{"npcByType":{"软弱型":"你看，你自己也放弃想了吧？早就跟你说别想那么多。以后我说怎么办就怎么办，省得你累我也累。","中立型":"搞清楚？你搞得越清楚我越累。能不能别什么事都刨根问底，日子过得轻松点不行吗？","边界型":"认真？你管这叫认真？你这就是钻牛角尖。你要是真爱我，就不会让我这么累，你能放过这件事吗？","回击型":"你把我说成摆烂，那我再说什么都会被你理解成逃避。既然这样，你是不是只想听到你认可的答案？"},"intent":"用\"累\"做永久挡箭牌，让你觉得思考本身=制造负担，从而把判断权完全交出。","moves":["疲劳升级","责任转嫁"],"choices":[{"type":"软弱型","text":"那我听你的……","meaning":"你把判断权完全交给对方，以后他说什么是什么。","guidance":"不要因为对方说累就放弃思考。你可以说：我尊重你累，但有些事我必须想清楚，我们可以慢慢来。"},{"type":"中立型","text":"我不想刨根问底，就是想有个结论。","meaning":"你在解释，但还是掉进\"刨根问底\"的框架。","guidance":"直接说：想有结论不叫刨根问底，叫负责任。如果你觉得累，那是因为你不想面对。"},{"type":"边界型","text":"我不想把事情搞复杂，但有些事确实需要结论。如果你现在不想聊，我们可以约个时间，但不能无限期搁置。我需要知道这件事我们什么时候能定下来。","meaning":"你给了缓冲，但设了\"必须解决\"的预期，不让\"累\"成为永久借口。","guidance":"如果到了约定时间对方还说累，那累就是借口，不是真的累。"},{"type":"回击型","text":"你说摆烂就摆烂？那咱俩都摆烂，这关系还过不过了？","meaning":"你戳穿了对方摆烂的威胁，但语气偏冲。","guidance":"更平和：我说的不是逼你现在解决，是这件事不能一直拖着。你摆烂不解决，问题只会越积越大。"}]}},{"npc":"我都道歉了，你还想怎样？","intent":"把道歉当结束讨论的工具，而不是真正承认问题。道歉变成了\"我已经让步了，你该闭嘴了\"。","moves":["空头道歉","情绪勒索"],"choices":[{"type":"软弱型","text":"既然你道歉了，那先这样吧。","meaning":"你接受了\"道歉=结束\"的逻辑，问题并没有解决，对方以后还会做同样的事。","guidance":"道歉不是结束，是开始。真正的道歉包含\"我以后怎么做不同\"。"},{"type":"中立型","text":"我不是不接受道歉，只是问题还在。","meaning":"你想表达问题没解决，但\"不是不接受\"语气太弱。","guidance":"更直接：道歉我听到了，但我需要的是这个问题以后怎么避免，不只是道歉。"},{"type":"边界型","text":"道歉我接受了，但道歉不等于问题解决了。我需要知道你以后怎么避免同样的事，否则这个道歉只是结束对话的工具。","meaning":"你区分了\"接受道歉\"和\"问题已解决\"，让对方无法用道歉来逃避改变。","guidance":"保持这个原则。如果对方的道歉不带改变的承诺，那这个道歉就没有意义。"},{"type":"回击型","text":"你道歉是因为你知道错了，还是因为想让我闭嘴？","meaning":"你戳中了道歉的真实动机，但这句话会引发更大的争吵。","guidance":"更冷静：我接受你的道歉，但更重要的是你以后怎么做。如果你只是想让我不说了，那这个道歉没意义。"}],"followUp":{"npcByType":{"软弱型":"你看，你自己也知道差不多得了吧？道歉都给了你还不满足，是不是非要把我逼死你才甘心？","中立型":"问题还在？那你说怎么办。反正我道歉了，你不说我就当事情过去了。","边界型":"改？你怎么改都行？那好，以后我道歉你就闭嘴，别再翻这件事，行不行？这就是你要的\"改\"吧？","回击型":"你现在连我的道歉都要审动机，那我说什么都没用。你不是要解决问题，是要判我有罪。"},"intent":"把道歉当成永久免死金牌，让你觉得追问=不依不饶，从而让问题永远不被真正解决。","moves":["空头道歉升级","道德绑架"],"choices":[{"type":"软弱型","text":"可能是我追得太紧了。","meaning":"你把责任揽回来，对方以后道歉就不用改了。","guidance":"不要把追问说成斤斤计较。你可以说：我接受道歉，但我需要看到改变，否则道歉就没意义。"},{"type":"中立型","text":"我不是不满足，只是不想再发生。","meaning":"你在解释，但语气太弱。","guidance":"直接说：我需要的是你以后怎么避免，不是道歉本身。"},{"type":"边界型","text":"我接受道歉，但我需要的是具体的改变方案。比如这件事以后怎么做不同。如果你给不出方案，那这个道歉我记下了，但不算解决，下次再发生我会更认真处理。","meaning":"你区分了\"接受道歉\"和\"问题解决\"，并设了后果。","guidance":"保持这个原则。道歉不带改变的承诺，就是空头支票。"},{"type":"回击型","text":"你自己说想让我闭嘴，那就别怪我不接受这种道歉。你要是真想解决问题，就不会说这种话。","meaning":"你戳穿了对方的真实动机，但语气偏冲。","guidance":"更冷静：你刚说想让我闭嘴，那这个道歉就不是真心的。等你真的愿意解决问题了，我们再聊。"}]}},{"npc":"你这么闹，只会把我推远。","intent":"把他的回避责任转嫁给你，让你觉得表达需求=推远对方，从而不敢再说。","moves":["分手威胁","责任转嫁"],"choices":[{"type":"软弱型","text":"那我不闹了，你别走。","meaning":"你被\"推远\"威胁成功，以后不敢表达任何不满，因为一表达就是\"推远他\"。","guidance":"表达需求不是\"闹\"。如果对方用离开来威胁你闭嘴，这本身就是一种操控。"},{"type":"中立型","text":"我不是闹，我只是想跟你聊。","meaning":"你在解释\"不是闹\"，但这个框架里你已经接受了\"闹=不好\"的预设。","guidance":"不需要解释。直接说：表达感受不是闹，用离开来威胁对方闭嘴才叫问题。"},{"type":"边界型","text":"表达感受不是闹，用离开来威胁对方闭嘴也不是健康沟通。我不会因为怕你走就不说话，如果你选择走，那是你的决定。","meaning":"你没有被威胁绑架，同时把\"推远\"的责任还给了对方——是他选择走，不是你推他。","guidance":"保持这个立场。如果对方真的因为你表达感受就离开，那这段关系本身就不健康。"},{"type":"回击型","text":"你每次不想聊就说\"我把你推远\"，那你想过没有，你的沉默也在把我推远？","meaning":"你戳中了对方的单向逻辑，\"推远\"是双向的。这句反击很好。","guidance":"语气可以再平和：你觉得我闹会推远你，那你的沉默就不推远我吗？我们都在影响这段关系，不是只有一个人的问题。"}],"followUp":{"npcByType":{"软弱型":"你看，你自己也知道是闹了吧？那以后别闹了，再闹我真走了，到时候别怪我没提醒你。","中立型":"聊什么聊？我刚才说了你这样会把我推远，你还想聊？你是不是听不懂人话？","边界型":"我不走？我不走你就能继续闹？那我现在就走给你看。我看你到底敢不敢让我走。","回击型":"你把我的沉默也算成问题，那我留下是错，退开也是错。既然你这么看，我走反而省事。"},"intent":"反复用\"走\"做威胁，让你觉得表达需求=逼走对方，最终彻底不敢说话。","moves":["分手威胁升级","责任转嫁"],"choices":[{"type":"软弱型","text":"别走，我先把话收回去。","meaning":"你被威胁成功，以后任何不满都不敢表达。","guidance":"不要被\"走\"威胁。你可以说：你走不走是你的选择，但我的感受不会因为你威胁就消失。"},{"type":"中立型","text":"我不是闹，就是想跟你说件事。","meaning":"你在解释，但\"不是闹\"先退让了。","guidance":"直接说：我想说的是一件具体的事，不是闹。你用\"走\"来堵我嘴，这事就更值得说。"},{"type":"边界型","text":"你走不走是你的选择，我不会拦你。但我想说的事我还是要说，你听完再决定走不走，这样对我们都公平。如果你连听都不愿意听就走，那说明你根本不想解决问题。","meaning":"你没有被威胁绑架，同时给了对方\"听完再决定\"的选项，但不让威胁阻止你表达。","guidance":"保持这个立场。反复用\"走\"威胁的关系，本质上不安全。"},{"type":"回击型","text":"你说走就走，那咱俩就别过了。你以为用走能吓住我？","meaning":"你戳穿了对方的威胁，但这会直接推向分手。","guidance":"更冷静：你每次都说走，我不知道你是真的想走还是想吓我。但不管哪种，这都不是健康的沟通方式。"}]}},{"npc":"我说分手只是气话，你怎么还当真？","intent":"用严重话语伤人后再撤回责任，让你觉得是你\"太当真\"而不是他说了不该说的话。","moves":["分手威胁","事后撤回"],"choices":[{"type":"软弱型","text":"那我就当你是一时冲动。","meaning":"你接受了\"分手可以当气话\"的逻辑，对方以后可以反复用分手来威胁你，然后说\"开玩笑的\"。","guidance":"分手不是气话。把分手当武器的人，要么不珍惜关系，要么在用恐惧控制你。"},{"type":"中立型","text":"你说分手我确实会当真，因为分手不是小事。","meaning":"你表达了感受，但没有指出对方的问题。","guidance":"更直接：分手不是气话，是说出口就会造成伤害的话。你不能说了伤人的话然后怪我当真。"},{"type":"边界型","text":"分手不是可以当气话说的词。你说了就会造成伤害，不管你是不是认真的。如果你以后再说，我会当真。如果你不想分手，就不要用这个词来发泄情绪。","meaning":"你明确了\"分手这个词不能当气话\"的边界，同时给了后果：再说就当真。","guidance":"保持这个原则。频繁用分手做威胁的关系，本质上是不安全的。"},{"type":"回击型","text":"气话？那我说\"我出轨了\"然后说气话你信吗？","meaning":"用对称的例子让对方感受\"严重的话不能当气话\"，效果好，但例子可能引发不必要的猜疑。","guidance":"更冷静的说法：有些话一旦说出口就会造成伤害，不管是不是气话。分手就是其中之一。"}],"followUp":{"npcByType":{"软弱型":"你看，你自己也知道是气话吧？以后我说什么你别往心里去，往心里去就是你太较真。","中立型":"当真？那我说什么你都当真，日子还怎么过？你是不是想让我什么都不能说？","边界型":"我说了是气话你还较真？那下次我只能把话全憋回去，免得又被你抓住挑毛病。","回击型":"你把一句气话上升到原则问题，那我以后开口前都得先想会不会被你定罪，这样还怎么相处？"},"intent":"把伤害性的话包装成\"气话\"，让你觉得受伤=太较真，从而不敢再计较伤害性语言。","moves":["伤害撤回","标签化"],"choices":[{"type":"软弱型","text":"以后尽量别这么说了。","meaning":"你只是请求，没有设后果，对方会继续说。","guidance":"不要只是请求。你可以说：气话也会伤人，如果你再说，我会按你说的理解。"},{"type":"中立型","text":"我不是什么都当真，就是分手这话太重。","meaning":"你在解释，但语气太弱。","guidance":"直接说：有些话就是不能当气话说，分手是其中之一。这不是较真，是底线。"},{"type":"边界型","text":"气话也是你说出口的话，造成的伤害是真的。我可以不当真，但你需要承诺以后不再用这个词。如果你做不到，那我会认真考虑这段关系是否安全。","meaning":"你承认了\"不当真\"，但设了\"不再说\"的硬条件，并给了后果。","guidance":"保持这个底线。反复用分手当气话的人，要么不珍惜关系，要么在用恐惧控制你。"},{"type":"回击型","text":"你什么都不说？那跟冷暴力有什么区别？你是想用沉默再惩罚我一次？","meaning":"你戳穿了对方\"以沉默相要挟\"的策略，但语气偏冲。","guidance":"更平和：我说的不是不让你说话，是不让你用分手当气话。你扯到\"什么都不说\"，是想让我觉得要求过分吗？"}]}},{"npc":"我对别人这样你就受不了？说明你不够自信。","intent":"把不尊重边界说成你的自信问题，让你觉得吃醋或不舒服是因为自己不够好。","moves":["贬低自信","越界合理化"],"choices":[{"type":"软弱型","text":"可能是吧……我应该更自信一点。","meaning":"你接受了\"不舒服=不自信\"的逻辑，以后对方越界你只会自我反省，而不是指出对方的问题。","guidance":"不舒服不是因为不自信，是因为对方的行为越界了。自信的人也会对越界说不行。"},{"type":"中立型","text":"这不是自信的问题，是行为的问题。","meaning":"你想指出问题，但太简短，力度不够。","guidance":"更具体：自信和接受越界是两回事。我自信不代表我要接受让我不舒服的行为。"},{"type":"边界型","text":"自信和接受越界是两回事。我自信不代表我要忍受不尊重。你对别人做了什么，如果让我不舒服，我有权利表达，这跟自信无关。","meaning":"你拆解了\"自信=容忍\"的逻辑，让对方无法用\"不自信\"来堵你的嘴。","guidance":"保持这个区分。如果对方反复用\"不自信\"来压你，说明他不想改变自己的行为。"},{"type":"回击型","text":"你把不尊重说成我不自信？那你是不是觉得不管你怎么对我，我都应该笑着接受？那不叫自信，叫傻。","meaning":"你戳中了对方的逻辑漏洞，\"自信=什么都接受\"确实荒谬。","guidance":"语气可以再平和：自信是知道自己值得被尊重，不是什么都忍着。如果你觉得我表达不舒服就是不自信，那我们对自信的理解不一样。"}],"followUp":{"npcByType":{"软弱型":"你看，你自己也承认不够自信了吧？那先把自己修炼好再来管我，我做什么用不着你教。","中立型":"你又在绕。我就说一句你不够自信，你就能扯这么多。能不能别什么事都往自己身上揽？","边界型":"自信？你管这叫自信？我看你就是小心眼。你要是真自信，就不会在乎我跟别人怎么样。","回击型":"你把我整个人都归成越界，好像我做什么都带着问题。那我们已经不是在谈具体事了。"},"intent":"把\"对方越界\"持续说成\"你不自信\"，让你不停自我反省，从而忽略对方的行为本身有问题。","moves":["贬低升级","越界合理化"],"choices":[{"type":"软弱型","text":"我会先调整自己的心态。","meaning":"你接受了\"不自信\"的标签，以后对方越界你只会自我修炼。","guidance":"不要接受这个标签。你可以说：我的不舒服跟自信无关，跟你做了什么有关。"},{"type":"中立型","text":"我不是往身上揽，就是这件事让我不舒服。","meaning":"你在解释，但语气太弱。","guidance":"直接说：我不是往身上揽，是你在用\"自信\"回避你的行为问题。"},{"type":"边界型","text":"自信是我对自己的评价，跟你的行为是不是越界是两件事。我不会因为\"自信\"就接受让我不舒服的行为。如果你觉得越界可以用\"自信\"来掩盖，那我们对边界的理解差距太大，需要重新谈。","meaning":"你把\"自信\"和\"越界\"彻底分开，让对方无法用自信压你。","guidance":"保持这个区分。用\"你不自信\"来掩盖自己越界的人，本身就有问题。"},{"type":"回击型","text":"你自己说对谁都越界？那看来问题真在你。一个人反复越界还不许别人说，那叫什么？","meaning":"你戳穿了对方承认越界却反过来指责的逻辑，但语气偏冲。","guidance":"更平和：你自己说越界了，那我们就谈越界这件事。扯到\"我对你什么都错\"是想转移焦点吗？"}]}},{"npc":"你别老提需求，感情不是做任务。","intent":"用浪漫话术回避具体责任，让你觉得提需求=把感情功利化。","moves":["浪漫话术","回避责任"],"choices":[{"type":"软弱型","text":"那我先把需求放一放。","meaning":"你放弃了表达需求的权利。以后在关系里你只能等对方主动给，给了要感恩，不给不能要。","guidance":"提需求不是做任务，是让对方知道你需要什么。不提需求的关系不是浪漫，是猜谜。"},{"type":"中立型","text":"我不是在做任务，只是有些需要想跟你说。","meaning":"你在解释\"不是做任务\"，但还是掉进了对方的框架。","guidance":"不需要解释。直接说：感情不是做任务，但感情需要沟通。不提需求不代表没需求，只是憋着。"},{"type":"边界型","text":"感情不是做任务，但也不是不沟通。提需求不是功利，是让对方知道你在意什么。如果提需求都嫌多，那这段关系的沟通空间在哪里？","meaning":"你区分了\"提需求\"和\"做任务\"，同时指出了\"不提需求\"的后果——沟通空间消失。","guidance":"保持这个逻辑。健康的关系里，双方都可以安全地表达需求。"},{"type":"回击型","text":"感情不是做任务？那你什么都不用做，咱们谈恋爱干什么？","meaning":"你戳中了\"用浪漫回避责任\"的矛盾，但语气偏冲。","guidance":"更平和：感情当然不是任务，但感情里两个人都需要付出和沟通。如果连需求都不能提，那这段关系就只剩感觉了。"}],"followUp":{"npcByType":{"软弱型":"你看，你自己也觉得提多了烦吧？那以后我做什么你别要求，感情嘛，顺其自然就好。","中立型":"沟通？你管这叫沟通？你这就是给我列清单。能不能别什么事都搞得这么功利？","边界型":"沟通空间？你是不是觉得我什么都不给你？你要是真爱我，就不会总觉得我给的不够。","回击型":"你把我的付出说得像任务打卡一样，那我做多做少都会被挑。这样我反而不知道该怎么做了。"},"intent":"用\"浪漫\"做盾牌，让你觉得提需求=功利，从而让你只能被动接受对方的付出水平。","moves":["浪漫话术升级","情感勒索"],"choices":[{"type":"软弱型","text":"我以后少说这些需要。","meaning":"你放弃提需求的权利，对方给多少你都得接受。","guidance":"提需求不是功利。你可以说：感情需要沟通，不提需求的关系不是浪漫，是盲盒。"},{"type":"中立型","text":"我不是列清单，就是想让你知道我在意什么。","meaning":"你在解释，但语气太弱。","guidance":"直接说：让你知道我在意什么不叫功利，叫沟通。如果你觉得这是列清单，那说明你不想了解我。"},{"type":"边界型","text":"感情不是任务，但感情需要两个人都知道对方在意什么。我提需求不是要你立刻做到，是让你知道这些对我重要。如果你连\"我在意什么\"都不想听，那这段关系的沟通空间确实有问题，我需要重新评估。","meaning":"你区分了\"提需求\"和\"立刻满足\"，并给了\"重新评估\"的后果。","guidance":"保持这个立场。连需求都不让提的关系，本质上是单向的。"},{"type":"回击型","text":"你什么都不做？那跟单身有什么区别？谈恋爱就是为了什么都不做吗？","meaning":"你戳穿了对方\"摆烂威胁\"的逻辑，但语气偏冲。","guidance":"更平和：我说的不是要你做多少，是要你愿意沟通。你扯到\"什么都不做\"，是想让我觉得我的需求过分吗？"}]}},{"npc":"你太需要安全感了，我给不了。","intent":"把他的不稳定包装成你的过度需求，让你觉得是自己要求太多。","moves":["贬低自信","推卸责任"],"choices":[{"type":"软弱型","text":"那可能是我要求太多了。","meaning":"你接受了\"需要安全感=要求太多\"的逻辑，以后对方再忽冷忽热你也只会忍。","guidance":"需要安全感不是过度需求，是人的基本需求。问题不是你太需要，而是对方太不稳定。"},{"type":"中立型","text":"安全感不是过分的需要吧。","meaning":"你在解释\"不是过分\"，但语气太弱。","guidance":"不需要解释。直接说：安全感不是奢侈品，是关系的基础。如果基础都给不了，那不是我的问题。"},{"type":"边界型","text":"安全感不是过度需求，是关系的基础。如果你觉得给不了，那可能是我们对关系的理解不一样。我不需要你给\"很多\"，但需要基本的稳定和尊重。","meaning":"你重新定义了安全感——不是过度需求，是基础。同时给了对方一个选择：要么给基础，要么承认不合适。","guidance":"保持这个底线。如果对方连基本的安全感都\"给不了\"，那他可能还没准备好进入一段关系。"},{"type":"回击型","text":"你给不了？那你谈恋爱干什么？养鱼吗？","meaning":"你戳中了对方的问题，但\"养鱼\"这个指控可能引发激烈争吵。","guidance":"更冷静：如果你觉得安全感给不了，那我们可以谈谈你在这段关系里能给的是什么，看我能不能接受。"}],"followUp":{"npcByType":{"软弱型":"你看，你自己也知道要求多了吧？那你别指望我给安全感，自己给自己才是真的。","中立型":"稳定？你管这叫稳定？你这是想让我24小时围着你转，我做不到。","边界型":"基础？你管这叫基础？我看你就是贪心。我要是连基础都给不了，那你怎么还不走？是不是其实你也知道问题在你？","回击型":"你把我说成不稳定、养鱼，那我再解释也像狡辩。既然你已经这么判断，我还能说什么？"},"intent":"把\"自己的不稳定\"持续包装成\"对方要求过多\"，让你不停自我怀疑，从而不追究对方的忽冷忽热。","moves":["贬低升级","推卸责任"],"choices":[{"type":"软弱型","text":"我尽量自己消化这些不安。","meaning":"你接受了\"要求过多\"的标签，对方可以继续不稳定。","guidance":"安全感不是奢侈品。你可以说：我要的是基本稳定，不是24小时围着我转。"},{"type":"中立型","text":"我不是要你24小时围着，就是基本的回应。","meaning":"你在解释，但语气太弱。","guidance":"直接说：基本的回应和稳定不叫24小时围着，叫基础。如果你做不到，那我们就不合适。"},{"type":"边界型","text":"我要的不是24小时围着，是基本的回应和稳定。比如消息及时回、约定的事做到、不要无故消失。如果你连这些都\"给不了\"，那说明的不是我要求多，是你还没准备好进入一段关系。我需要你告诉我你能给的是什么。","meaning":"你把\"安全感\"具体化为可操作的行为，并给了对方\"明确能给什么\"的要求。","guidance":"保持这个底线。连基本稳定都给不了的人，不适合谈恋爱。"},{"type":"回击型","text":"你说我什么都行，那我问你，你能给的是什么？什么都不给还谈恋爱，那图什么？","meaning":"你戳穿了对方摆烂的逻辑，但语气偏冲。","guidance":"更平和：我不是要你什么都行，是要你明确你能给什么。如果你连这个都说不清，那我们确实需要重新考虑。"}]}},{"npc":"我现在压力很大，你别再给我压力。","intent":"用压力屏蔽你的感受，让你觉得表达需求=施加压力，从而闭嘴。","moves":["压力屏蔽","推卸责任"],"choices":[{"type":"软弱型","text":"那你先处理压力吧。","meaning":"你放弃了自己的需求。对方的压力成了永远的挡箭牌，你永远不能表达不满。","guidance":"表达感受不是给压力。如果对方永远在\"压力大\"，那不是压力的问题，是优先级的问题。"},{"type":"中立型","text":"我知道你压力大，但我也有事想聊。","meaning":"你想表达需求，但\"我知道你压力大\"先退让了。","guidance":"不需要先退让。直接说：我理解你有压力，但我的感受也需要被处理。我们可以找个你方便的时间聊。"},{"type":"边界型","text":"我理解你有压力，但表达感受不是给你施压。如果每次我开口你都\"压力大\"，那我的感受永远没有出口。我们可以约个时间，等你压力小一点的时候聊。","meaning":"你没有否认对方的压力，但也没有放弃自己的需求。给了时间缓冲，但设了\"一定要聊\"的预期。","guidance":"如果到了约定时间对方还是\"压力大\"，那说明压力只是借口，他只是不想面对你的感受。"},{"type":"回击型","text":"你压力大我就不能说话了？那这关系里只有你一个人的压力算压力？","meaning":"你戳中了对方用压力屏蔽你的问题，但语气偏冲。","guidance":"更平和：你的压力我理解，但我的感受也需要有出口。我们能不能找一个对双方都合适的时间来聊？"}],"followUp":{"npcByType":{"软弱型":"你看，你自己也知道给我添堵了吧？那我压力大的时候你别出现，等我好了再来找你。","中立型":"找时间？我现在哪有时间。你要是真懂事，就别在我压力大的时候提任何事。","边界型":"约时间？你是不是觉得我的压力是假的？你要是真爱我，就不会在我最难的时候还跟我计较这些。","回击型":"你把我的压力直接判成借口，那我再说难也没有意义。你只是在要求我立刻按你的节奏来。"},"intent":"把\"压力\"当成永久盾牌，让你觉得自己任何表达都是雪上加霜，从而永远闭嘴。","moves":["压力屏蔽升级","道德绑架"],"choices":[{"type":"软弱型","text":"我等你状态好点再说。","meaning":"你把自己的需求继续往后放，对方用\"压力\"成功屏蔽了你。","guidance":"表达感受不是给压力。你可以说：我等你可以，但需要一个时间，不能无限期。"},{"type":"中立型","text":"我懂事，但我的事也需要处理。","meaning":"你在解释，但语气太弱。","guidance":"直接说：我理解你压力，但我的事也不能一直拖着。我们定个时间。"},{"type":"边界型","text":"我理解你压力大，但表达感受不等于给你施压。我需要一个具体的时间，不是\"等你好了\"这种没期限的话。如果你一直说压力大但给不出时间，那我会认为压力只是借口，你不想面对我的感受。","meaning":"你给了缓冲，但设了\"具体时间\"的硬要求，并点出\"借口\"的可能。","guidance":"保持这个原则。永远在\"压力大\"的人，要么真有问题需要专业帮助，要么就是用压力回避你。"},{"type":"回击型","text":"你说我不在乎你难？那你呢？你考虑过我的感受吗？你的压力是压力，我的就不是？","meaning":"你戳穿了单向逻辑，但语气偏冲。","guidance":"更平和：我不是不在乎你难，是我也有需要处理的事。我们不能因为你压力大，我的事就永远搁置。"}]}},{"npc":"你要这么想我也没办法。","intent":"拒绝解释，终止沟通，把问题归因于\"你乱想\"，让对方不用承担任何责任。","moves":["冷暴力","拒绝解释"],"choices":[{"type":"软弱型","text":"可能是我自己想多了吧。","meaning":"你接受了\"是我在乱想\"的定义，以后对方不解释你也不能追问。","guidance":"\"你要这么想我也没办法\"是亲密关系里最敷衍的话之一。它不是在沟通，是在关上门。"},{"type":"中立型","text":"我不是乱想，是你不说清楚我才想。","meaning":"你在解释\"不是乱想\"，但还是在对方的框架里。","guidance":"不需要解释。直接说：如果你不说，我只能根据你做的事来判断。不是我想，是你没给信息。"},{"type":"边界型","text":"不是我想不想的问题，是你给的信息不够我才会有疑问。如果你觉得我的理解不对，那你说清楚。说\"没办法\"不是在解决问题，是在关门。","meaning":"你把\"乱想\"的责任还给了对方——是因为你没说清楚，我才会有疑问。","guidance":"保持这个态度。如果对方反复用这句话来终止沟通，说明他不想投入精力来维护这段关系。"},{"type":"回击型","text":"你要是真没办法，那我也没办法。咱俩都没办法，那在一起干什么？","meaning":"你用对方的逻辑反将一军，但这可能直接走向分手话题。","guidance":"更冷静：我不是在\"乱想\"，我是在问你。你的回答如果是\"没办法\"，那我只能认为你不想沟通。"}],"followUp":{"npcByType":{"软弱型":"你看，你自己也知道是你在想吧？那你别想了，想多了是你自己的问题，跟我没关系。","中立型":"解释？我没什么好解释的。你要乱想我也拦不住，你自己消化吧。","边界型":"说清楚？我说了你不信怎么办？反正你脑子里已经认定了，我说什么都是狡辩，那我还说什么？","回击型":"你直接给我贴上逃避的标签，那我现在无论说不说都像错的。你其实已经不打算听我解释了吧。"},"intent":"用\"没办法\"永久关闭沟通，让你觉得追问=自己乱想，从而放弃追问，问题永远悬而未决。","moves":["冷暴力升级","拒绝沟通"],"choices":[{"type":"软弱型","text":"我先不追着想了。","meaning":"你接受了\"乱想\"的标签，问题被搁置。","guidance":"不要接受\"乱想\"的标签。你可以说：你不说，我只能根据你做的事判断，这不是乱想。"},{"type":"中立型","text":"我不是乱想，是你不说我才想。","meaning":"你在解释，但语气太弱。","guidance":"直接说：不是我想，是你没给信息。你给信息，我就不用想。"},{"type":"边界型","text":"我不想乱想，但你不说我只能根据你的行为判断。如果你觉得我理解错了，那你说清楚。如果反复\"没办法\"，那我会认为你不想沟通，这对我来说是关系层面的信号，我会认真考虑。","meaning":"你把责任还给了对方，并给了\"认真考虑关系\"的后果。","guidance":"保持这个态度。反复用\"没办法\"终止沟通的人，不想维护关系。"},{"type":"回击型","text":"你关门？那这关系还开着的门在哪？你说不出来我可以等，但你连说都不想说，那咱俩还在一起干什么？","meaning":"你戳穿了对方\"关门\"的后果，但这会直接走向分手。","guidance":"更冷静：你关门可以，但门不能一直关着。我需要一个你说清楚的时间，否则我会按我现在的理解走。"}]}},{"npc":"你总是翻旧账。","intent":"把未解决的问题说成你\"翻旧账\"，让对方不用面对问题没解决的事实。","moves":["标签化","责任转嫁"],"choices":[{"type":"软弱型","text":"那这件旧事我先不说了。","meaning":"你放弃了追讨未解决的问题。旧账会越积越多，最终爆发。","guidance":"翻旧账和问题没解决是两回事。如果上次的问题没处理完，再提不叫翻旧账，叫跟进。"},{"type":"中立型","text":"我不是翻旧账，是上次的问题还没解决。","meaning":"你指出了区别，但力度不够，对方可能还是说\"又来了\"。","guidance":"更明确：上次你说会改，但同样的事又发生了。这不叫翻旧账，叫问题还在。"},{"type":"边界型","text":"翻旧账和问题没解决是两回事。上次的问题你说会改，但同样的事又发生了，这不叫翻旧账，叫跟进。如果你觉得是旧账，那说明上次根本没真正解决。","meaning":"你区分了\"翻旧账\"和\"问题未解决\"，同时指出了根源——上次没有真正解决。","guidance":"保持这个逻辑。如果对方每次都说\"翻旧账\"来回避，说明他根本不想解决问题。"},{"type":"回击型","text":"你说翻旧账？那你要是上次解决了，我现在翻什么？","meaning":"你戳中了\"翻旧账\"的前提——上次没解决。这句反击很精准。","guidance":"这句效果好，语气也不算太冲，可以直接用。"}],"followUp":{"npcByType":{"软弱型":"你看，你自己也知道是旧账了吧？那以后别提了，提一次我就提一次你翻旧账。","中立型":"跟进？你管这叫跟进？你这叫记仇。能不能别什么事都记这么清楚？","边界型":"上次没解决？那你说怎么算解决？你不说清楚我就当没解决是你挑剔，不是我的问题。","回击型":"你把过去的问题全压到我头上，好像只要这次又提起，就是我这个人没救了。这样根本谈不到具体事。"},"intent":"用\"翻旧账\"标签让你觉得追问=记仇，从而让旧问题永远不被解决，对方也不用改变。","moves":["标签强化","责任转嫁"],"choices":[{"type":"软弱型","text":"那我把这事先放下。","meaning":"你放弃追问，旧问题永远不被解决。","guidance":"翻旧账和跟进是两回事。你可以说：上次你说会改，但同样的事又发生，这不叫翻旧账。"},{"type":"中立型","text":"我不是记仇，就是同样的事又发生了。","meaning":"你在解释，但语气太弱。","guidance":"直接说：同样的事又发生不叫记仇，叫问题还在。"},{"type":"边界型","text":"我不提旧账，我提的是上次说会改但没改的事。如果你觉得这是旧账，那我们先把\"什么算解决\"定义清楚。比如这件事什么状态算解决，下次再发生怎么处理。你愿意跟我定义清楚，我就不算翻旧账。","meaning":"你把\"解决\"具体化，让对方无法用\"翻旧账\"模糊焦点。","guidance":"保持这个方法。把\"解决标准\"定下来，对方就没法用\"翻旧账\"堵你。"},{"type":"回击型","text":"你说我什么都不满意？那是不是因为你什么都不改？要不是你老犯，我哪来的旧账可翻？","meaning":"你戳穿了对方\"不改才被翻旧账\"的逻辑，但语气偏冲。","guidance":"更平和：我提的不是旧账，是反复发生的事。你要是不想被反复提，那就把它解决掉。"}]}},{"npc":"我没有恶意，是你想太多。","intent":"用主观无恶意否定你的感受，让你觉得受伤是你的问题，不是对方的行为问题。","moves":["动机否定","贬低自信"],"choices":[{"type":"软弱型","text":"可能吧，也许我确实想多了。","meaning":"你接受了\"想太多\"的标签，以后对方做了什么让你不舒服的事，你只会自我怀疑。","guidance":"恶意不恶意是对方的主观感受，受伤是你的真实感受。没有恶意不等于没有伤害。"},{"type":"中立型","text":"你可能没有恶意，但我确实不舒服。","meaning":"你表达了感受，但\"可能没有恶意\"先退让了。","guidance":"不需要先肯定无恶意。直接说：有没有恶意是你的事，受不受伤是我的事。你不需要有恶意也能伤害我。"},{"type":"边界型","text":"有没有恶意是你的事，受不受伤是我的事。你不需要有恶意也能伤害我。如果我说不舒服，你应该关注的是我的感受，而不是辩解自己没有恶意。","meaning":"你区分了\"动机\"和\"影响\"，让对方无法用\"无恶意\"来回避你的感受。","guidance":"保持这个区分。很多人用\"我又不是故意的\"来逃避责任，但\"不是故意的\"不等于\"不需要在意\"。"},{"type":"回击型","text":"你没有恶意？那我骂你一句然后说没恶意，你信吗？","meaning":"用对称的例子让对方感受\"无恶意≠无伤害\"，效果好。","guidance":"更平和的说法：我知道你可能不是故意的，但不是故意的也会伤人。我希望你下次注意一下就好。"}],"followUp":{"npcByType":{"软弱型":"你看，你自己也觉得想多了吧？那以后别想了，我说什么你别往心里去，往心里去就是你敏感。","中立型":"感受？你管这叫感受？你这叫玻璃心。我说一句你就受伤，那我以后什么都不说了？","边界型":"影响？你受伤是你的事，我说什么我的事。你非要把我说的每句话都当伤害，那我没法跟你说话了。","回击型":"你把没有恶意也理解成伤害，那我以后每句话都像在踩雷。这样我会越来越不敢表达。"},"intent":"用\"无恶意\"持续否定你的感受，让你觉得受伤=自己太敏感，从而不敢再表达受伤。","moves":["动机否定升级","贬低自信"],"choices":[{"type":"软弱型","text":"我会试着别往心里去。","meaning":"你接受了\"敏感\"的标签，对方以后说什么你都不能受伤。","guidance":"不要接受\"敏感\"的标签。你可以说：受伤是真实的，跟敏感无关。"},{"type":"中立型","text":"我不是玻璃心，就是你说的话让我不舒服。","meaning":"你在解释，但语气太弱。","guidance":"直接说：你说的话让我不舒服，这不是玻璃心，是正常反应。"},{"type":"边界型","text":"我不需要你有恶意，但你说话的方式会让我受伤，这是事实。我希望你下次注意一下表达方式，比如不要用\"你想太多\"来否定我的感受。如果你做不到，那我会认为你不在乎我的感受，这对关系是严重问题。","meaning":"你具体指出\"什么表达有问题\"，并给了\"做不到=不在乎\"的后果。","guidance":"保持这个原则。\"不是故意的\"不等于\"不需要在意\"。"},{"type":"回击型","text":"你什么都不说？那跟冷暴力有什么区别？你是想用沉默再伤害我一次？","meaning":"你戳穿了对方\"以沉默相要挟\"的策略，但语气偏冲。","guidance":"更平和：我说的不是不让你说话，是希望你说话注意方式。你扯到\"什么都不说\"，是想让我觉得要求过分吗？"}]}},{"npc":"你怎么这么喜欢证明自己是对的？","intent":"把事实澄清说成\"争输赢\"，让你觉得说清楚就是\"好胜\"，从而闭嘴。","moves":["贴标签","转移焦点"],"choices":[{"type":"软弱型","text":"好，我不把事情掰开说了。","meaning":"你放弃了澄清事实的权利。以后对方说什么你都得接受，因为一澄清就是\"争输赢\"。","guidance":"澄清事实不是争输赢，是对关系负责。模糊事实只会让误解越积越深。"},{"type":"中立型","text":"我不是要证明自己对，只是想把事情说清楚。","meaning":"你在解释\"不是争输赢\"，但还是掉进了对方的框架。","guidance":"不需要解释。直接说：说清楚事实不叫争输赢，叫沟通。如果你觉得说清楚就是在争，那说明你不想面对事实。"},{"type":"边界型","text":"说清楚事实不叫争输赢，叫沟通。如果连事实都不能说清楚，那我们的沟通基础在哪里？我不是在证明我对，是在确保我们对事情的理解一致。","meaning":"你重新定义了\"说清楚\"——不是争输赢，是沟通。同时指出了\"不让说清楚\"的问题。","guidance":"保持这个原则。如果对方总是把你的澄清说成\"争\"，说明他更在意控制权而不是事实。"},{"type":"回击型","text":"你喜欢模糊对错，是不是因为错了对你更有利？","meaning":"你戳中了对方不想澄清的动机，但这个指控太攻击性。","guidance":"更冷静：我不是在争对错，我是在确保我们理解一致。如果你不想说清楚，那我想知道为什么。"}],"followUp":{"npcByType":{"软弱型":"你看，你自己也承认不说清楚了吧？那以后我说什么就是什么，你别反驳了。","中立型":"理解一致？你管这叫理解一致？你这叫非得让我承认你是对的。能不能别这么好胜？","边界型":"事实？什么是事实？你说的是事实还是我说的是事实？反正你嘴硬，你说什么都是事实，行了吧？","回击型":"你把我说成故意模糊，那我再解释也会被当成狡辩。你已经先认定我是错的了。"},"intent":"把\"澄清事实\"说成\"争输赢\"，让你觉得说清楚=好胜，从而放弃澄清，事实永远模糊。","moves":["标签强化","焦点转移"],"choices":[{"type":"软弱型","text":"我先不继续解释了。","meaning":"你放弃澄清，事实被对方定义。","guidance":"澄清不是好胜。你可以说：说清楚事实是沟通的基础，不是争输赢。"},{"type":"中立型","text":"我不是好胜，就是想把事情说清楚。","meaning":"你在解释，但语气太弱。","guidance":"直接说：说清楚不叫好胜，叫负责。如果你觉得这是好胜，那说明你不想面对事实。"},{"type":"边界型","text":"我不是要证明我对，是要我们对事情的理解一致。如果连发生了什么都说不清楚，那我们没法解决问题。我需要你跟我对一遍事实，不是谁对谁错，是确保我们说的是同一件事。如果你不愿意，那我没法继续讨论。","meaning":"你把\"澄清\"重新定义为\"对事实\"，并给了\"不愿对就停止\"的后果。","guidance":"保持这个原则。连事实都不愿对的人，根本不想解决问题。"},{"type":"回击型","text":"你什么都不说清楚？那咱俩怎么解决问题？靠猜吗？","meaning":"你戳穿了对方\"模糊化\"的后果，但语气偏冲。","guidance":"更平和：我说的不是逼你承认对错，是把事实对一遍。你扯到\"什么都不说\"，是想让我觉得我的要求过分吗？"}]}},{"npc":"你再这样我真的不知道怎么爱你了。","intent":"用\"失去爱\"做威胁，让你觉得表达需求=失去爱，从而服从。","moves":["用爱施压","情感勒索","分手威胁"],"choices":[{"type":"软弱型","text":"别这样，我改。","meaning":"你被\"不爱了\"威胁成功，以后你不敢表达任何不满，因为一表达就可能\"失去爱\"。","guidance":"真正的爱不会因为对方表达感受就消失。用\"不爱你了\"来威胁闭嘴，这本身就是一种操控。"},{"type":"中立型","text":"你不要这样说，我只是想跟你聊。","meaning":"你在安抚对方，但没有指出这种话术的问题。","guidance":"更直接：你这样说让我觉得，表达感受就会失去你的爱。这是威胁，不是沟通。"},{"type":"边界型","text":"用\"不爱你了\"来回应我的感受，这是一种威胁。真正的爱不会因为对方表达需求就消失。如果你觉得爱我是一种条件交换，那我们需要重新谈这段关系。","meaning":"你指出了这是威胁，同时表达了对关系本质的质疑。对方很难再用同样的话术。","guidance":"这是一个严重的红旗信号。如果对方反复用\"不爱\"来威胁你，建议认真评估这段关系。"},{"type":"回击型","text":"你不知道怎么爱我？那你之前爱的到底是我，还是那个什么都不说的我？","meaning":"你戳中了对方\"爱的不是真实的你\"的问题，非常深刻。","guidance":"这句反击效果好，但语气可以再平和：我希望你爱的是真实的我，包括我会表达感受的部分。如果你做不到，那可能我们需要各自想想。"}],"followUp":{"npcByType":{"软弱型":"你看，你自己也知道改了吧？那以后别这样了，再这样我真的不爱你了，到时候别怪我。","中立型":"威胁？我说的不是威胁，是实话。你要是真在乎我，就不会让我说这种话。","边界型":"条件交换？你管这叫条件交换？我说我不爱你了，你还跟我谈条件？你心里到底有没有我？","回击型":"你把我的迟疑都解释成操控，那我说爱像假的，说累也像假的。你是不是已经不相信我了？"},"intent":"用\"不爱\"做终极威胁，让你觉得任何表达都可能失去爱，从而彻底服从。","moves":["用爱施压升级","情感勒索"],"choices":[{"type":"软弱型","text":"我会改，你别放弃我。","meaning":"你被\"不爱\"威胁成功，彻底服从。","guidance":"不要被\"不爱\"威胁。你可以说：你爱不爱我是你的事，我的感受不会因为你威胁就消失。"},{"type":"中立型","text":"我不是不在乎你，就是想跟你聊件事。","meaning":"你在解释，但语气太弱。","guidance":"直接说：我想跟你聊的是一件事，不是要你\"不爱我\"。你用\"不爱\"来回应我的感受，这就是威胁。"},{"type":"边界型","text":"你爱不爱我是你的选择，我不会用\"怕你不爱\"来交换我的感受被表达的权利。如果你觉得表达需求就会让你不爱我，那这段关系本身就有严重问题。我需要你认真回答：你爱的是真实的我，还是一个什么都不说的我？","meaning":"你拒绝被威胁，并把问题上升到\"你爱的是谁\"的层面。","guidance":"这是严重的红旗信号。反复用\"不爱\"威胁的人，本质上是把爱当成控制工具。"},{"type":"回击型","text":"你说没爱过？那之前说的爱都是假的？你这样说我更确定你的爱是有条件的。","meaning":"你戳穿了对方\"爱是有条件\"的本质，但会激化矛盾。","guidance":"更冷静：你刚说没爱过，那我希望你认真想想。如果你对我的爱是有条件的，那我们确实需要重新评估这段关系。"}]}},{"npc":"我已经够让着你了。","intent":"把基本尊重说成\"让步\"，让你觉得你已经欠了他的，不应该再提要求。","moves":["道德绑架","基准线拉低"],"choices":[{"type":"软弱型","text":"那……谢谢你的包容。","meaning":"你接受了\"尊重=让步\"的逻辑，以后对方做了基本的事你都要感恩戴德。","guidance":"尊重不是让步，是基本义务。不是\"让着你\"，是\"本该如此\"。"},{"type":"中立型","text":"这不是让不让的问题，是沟通的问题。","meaning":"你想表达不同看法，但力度不够。","guidance":"更直接：尊重不叫让步，叫基本的相处方式。如果你觉得尊重我就是\"让着\"我，那你的基准线有问题。"},{"type":"边界型","text":"尊重不叫让步，叫基本的相处方式。如果你觉得不骂我、不忽视我就是\"让着\"我，那你的基准线太低了。我不需要你\"让\"，我需要你正常对待。","meaning":"你重新定义了\"让步\"——那不是让步，是基本尊重。同时指出了对方的基准线太低。","guidance":"保持这个态度。如果对方觉得基本尊重就是\"让步\"，说明他在之前的关系里根本不习惯尊重人。"},{"type":"回击型","text":"你让着我？那你平时是怎么对别人的？如果对我已经是\"让\"了，那你的正常状态得多差？","meaning":"你戳中了对方\"基准线太低\"的问题，但可能引发对方 defensiveness。","guidance":"更冷静：我不要你\"让\"我，我要你正常地尊重我。如果你觉得这已经是在\"让\"，那我们对尊重的理解差距太大。"}],"followUp":{"npcByType":{"软弱型":"你看，你自己也知道是我在让着你吧？那以后别再要求了，再要求就是你不知足。","中立型":"正常？我哪里不正常了？你说我哪里不正常？你是不是觉得我做什么都不够好？","边界型":"基准线低？我哪里低了？你说我哪里低了？你要是觉得我什么都低，那你自己找个高基准线的去。","回击型":"你把我的基准线说得一无是处，那我再做什么也像是不达标。你要的是沟通，还是给我打分？"},"intent":"把\"基本尊重\"持续说成\"让步\"，让你觉得自己一直在享受对方的\"恩惠\"，从而不敢再提要求。","moves":["道德绑架升级","基准线拉低"],"choices":[{"type":"软弱型","text":"那我记得你的让步。","meaning":"你接受了\"恩惠\"的框架，对方做任何基本事你都要感恩。","guidance":"尊重不是恩惠。你可以说：我不需要你让，我需要你正常对待。"},{"type":"中立型","text":"我不是说你不够好，就是希望更正常一点。","meaning":"你在解释，但语气太弱。","guidance":"直接说：我要的不是\"更好\"，是基本尊重。"},{"type":"边界型","text":"我不需要你\"让\"，我需要你正常对待。正常对待包括：不忽视我、不骂我、答应的事做到。如果你觉得这些是\"让\"，那说明你的基准线确实有问题，不是我要求高。我需要你明确你能做到的基本尊重是什么。","meaning":"你具体化了\"正常对待\"，并给了对方\"明确基准\"的要求。","guidance":"保持这个原则。把\"基本尊重\"具体化，对方就没法用\"让\"来压你。"},{"type":"回击型","text":"你说我什么都差？那是不是因为你什么都不做？你什么都不做还嫌我要求多，那咱俩确实不合适。","meaning":"你戳穿了对方\"什么都不做却嫌要求多\"的矛盾，但语气偏冲。","guidance":"更平和：我说的不是你什么都差，是基本的尊重。你扯到\"什么都差\"，是想让我觉得我的要求过分吗？"}]}},{"npc":"算了，你开心就好。","intent":"用冷处理结束对话，表面上是让步，实际是关闭沟通，让你背负\"是你逼我退让\"的愧疚。","moves":["冷处理","制造愧疚"],"choices":[{"type":"软弱型","text":"我不是要你让步，我们再聊聊？","meaning":"你上钩了。对方说\"你开心就好\"就是在制造愧疚，你追着解释等于承认\"是我逼他退让\"。","guidance":"不要追。这句话的本质是\"我不想聊了，但我不想承担不聊的责任，所以让你背\"。"},{"type":"中立型","text":"你这样说让我觉得你并不认同。","meaning":"你指出了问题，但没有明确表达\"这种结束方式不可接受\"。","guidance":"更直接：你说\"你开心就好\"，但我需要的是我们两个人都认同的方案，不是我一个人开心。"},{"type":"边界型","text":"\"你开心就好\"不是沟通，是关上门。我需要的是我们两个人都认可的方案，不是我一个人开心。如果你不同意，可以说出来，我们继续聊。","meaning":"你戳穿了\"假让步\"的本质，同时邀请对方真正表达想法，而不是用冷处理回避。","guidance":"保持这个态度。如果对方真的什么都不说就走，说明他更在意\"站在道德高地\"而不是解决问题。"},{"type":"回击型","text":"你说\"你开心就好\"的时候，你自己开心吗？不开心就直说，别用这种话让我内疚。","meaning":"你戳中了对方用假让步制造愧疚的策略，这句反击很精准。","guidance":"这句效果好，可以直接用。语气也可以再平和一点：我不需要你让步，我需要你说真话。"}],"followUp":{"npcByType":{"软弱型":"你看，你自己也觉得是我让步了吧？那你记住，我是因为爱你才让的，别再逼我了。","中立型":"认同？我认同什么？你都说我让步了，我还能说什么？再说我又成了不让你步了。","边界型":"继续聊？我都说算了你还想聊？你是不是非得逼我跟你吵一架才甘心？","回击型":"你把\"算了\"也说成装受害者，那我连退一步都变成错。看来只有按你的方式聊才算正确。"},"intent":"用\"假让步\"持续制造愧疚，让你觉得是自己逼对方退让，从而不敢再追问真实想法。","moves":["冷处理升级","愧疚操控"],"choices":[{"type":"软弱型","text":"我不是要你让步，咱们再聊聊？","mea g":"你接受了\"规则不可挑战\"的说法，放弃了维权。","guidance":"规则可以存在，但规则必须合理合法。不合理的规则不因\"就是这样\"就有效。"},{"type":"中立型","text":"规则能给我看一下吗？","meaning":"你想看依据，这是对的，但只是\"看一下\"力度不够。","guidance":"更明确：请出示这个规则的具体条款和依据。如果这个规则违反消费者权益保护法，它本身就没有效力。"},{"type":"边界型","text":"请把你说的规则条款发给我。规则可以约定流程，但不能排除消费者依法享有的售后权利。若你们要据此拒绝处理，请说明条款依据，并给出合法的处理方案。","meaning":"你没有否认规则存在，但要求对方出示并验证合法性，把举证责任推了回去。","guidance":"保留对方拒绝处理的截图。如果对方出示的规则确实不合理，向12315投诉时一并提交。"},{"type":"回击型","text":"规则是你们定的吧？自己定规则自己用，那不叫规则，那叫霸王条款。","meaning":"你戳中了\"自定规则约束消费者\"的问题，但\"霸王条款\"这个指控需要法律支撑。","guidance":"更冷静：规则是否合法需要看具体条款。请出示，我会判断是否接受。如果不合法，我会向相关部门反映。"}],"followUp":{"npcByType":{"软弱型":"那我们就按现有规则记录处理，后续不会再重复解释。","中立型":"我理解您想看规则，但这个是公司内部规定，不方便对外公开，您就理解一下。","边界型":"规则就是规则，我给您看了您也改变不了，您要是不接受，那我也没办法了。","回击型":"您说是霸王条款就是霸王条款？我们法务都审过的，您随便投诉。"},"intent":"客服用\"内部规定不便公开\"和\"法务审过\"继续回避出示规则依据，用权威背书压你。","moves":["内部规定挡箭牌","法务背书"],"choices":[{"type":"软弱型","text":"既然是内部规定，我这边也不好继续问了。","meaning":"你接受了\"内部规定不可挑战\"。","guidance":"内部规定不能凌驾于法律。格式条款若加重消费者责任，属无效。"},{"type":"中立型","text":"那能不能让法务给我解释一下？","meaning":"你想找更高层，但还是接受了对方框架。","guidance":"不需要法务解释。直接要求出示条款原文。"},{"type":"边界型","text":"内部规定不能只凭一句话就约束消费者。民法典第四百九十七条对排除消费者主要权利、加重消费者责任的格式条款有无效规则。请出示规则原文；不出示就不能作为拒绝依据。","meaning":"你引用民法典认定格式条款效力，把举证责任推回商家。","guidance":"格式条款无效是常见投诉点。12315和市场监管可认定。"},{"type":"回击型","text":"法务审过就更该敢给我看，藏着掖着说明心虚。我现在就12315问这个规则合不合规。","meaning":"你用\"敢不敢给看\"反将一军，同时升级。","guidance":"12315确实可咨询条款合规性。保留对方拒绝出示的记录。"}]}},{"npc":"你要是不满意就自己去投诉吧。","intent":"用消极态度增加你的维权成本，赌你嫌麻烦就会放弃。","moves":["消极施压","赌你放弃"],"choices":[{"type":"软弱型","text":"我先不投诉了，我再考虑一下。","meaning":"你被对方的消极态度打退了。对方赌的就是大部分人嫌麻烦不会真的投诉。","guidance":"不要被\"去投诉吧\"吓退。12315小程序投诉很简单，不需要律师。"},{"type":"中立型","text":"我希望我们能把问题解决，不想走到投诉。","meaning":"你想给对方台阶，但对方可能顺势说\"那我也没办法\"。","guidance":"更明确：我愿意先跟你协商解决，但如果协商不成，我会向12315投诉。现在请你给出处理方案。"},{"type":"边界型","text":"投诉是后续选项，但我现在仍然给你们协商解决的机会。请先给出明确处理方案；如果继续拒绝或敷衍，我会提交12315和平台投诉，届时所有沟通记录都会作为材料。","meaning":"你既表达了协商意愿，也明确了升级途径，同时暗示了升级对商家也不利。","guidance":"保留所有沟通记录。如果对方始终拒绝处理，直接向12315或平台投诉，把记录作为证据。"},{"type":"回击型","tex {"npc":"你拍的视频不能证明是我们的问题。","intent":"否定你的证据，却不提供替代的验证路径，让你陷入\"无法自证\"的困境。","moves":["否认证据","举证责任转嫁"],"choices":[{"type":"软弱型","text":"那我再补拍几段视频给你们看。","meaning":"你在问对方，等于接受了\"需要我证明\"的前提。但商品质量问题的举证责任在销售方。","guidance":"根据消费者权益保护法，耐用商品的举证责任在销售方。不是你证明有问题，是商家证明没问题。"},{"type":"中立型","text":"那你说怎么验证？","meaning":"你想找方法，但这还是在对方的框架里，对方可以一直说\"不够\"。","guidance":"更直接：根据消费者权益保护法，六个月内的质量问题举证责任在销售方。如果你认为不是你们的问题，请提供检测报告。"},{"type":"边界型","text":"我已经提供了问题视频，你们不能只说“不够证明”却不给验证路径。购买六个月内的质量争议，销售方应承担相应举证责任；如果你们不认可，请提供检测报告或明确送检流程。","meaning":"你把举证责任翻转了——不是消费者自证，是商家反证。","guidance":"保留购买凭证和沟通记录。如果商家拒绝举证，向12315投诉时说明商家未履行举证义务。"},{"type":"回击型","text":"那你说什么能证明？除非你全程监控？你设个不可能的标准，当然证明不了。","meaning":"你戳中了对方\"设不可能标准\"的策略，但语气偏情绪化。","guidance":"更冷静：法律规定这个阶段的举证责任在你们。如果你认为不是质量问题，请提供检测报告，我接受第三方检测。"}],"followUp":{"npcByType":{"软弱型":"视频如果还不够清楚，您可以再补充材料，我们再看。","中立型":"我理解您觉得是我们的问题，但视频确实看不出来，您要不再拍清楚点？","边界型":"您说举证责任在我们，那也得看商品类型，您这个不在耐用商品范围，还是得您证明。","回击型":"您拿法律压我？那您去找检测机构，我们等着，证明不了是您的事。"},"intent":"客服用\"不在耐用商品范围\"和\"找检测机构\"继续把举证推给你，用商品分类争议拖延。","moves":["商品类型争议","检测机构门槛"],"choices":[{"type":"软弱型","text":"我再换个角度拍一遍，尽量拍得更清楚。","meaning":"你接受了无限自证。","guidance":"不要再拍了。六个月内耐用商品举证在销售方，非耐用商品也可要求合理检测。"},{"type":"中立型","text":"那这个商品算不算耐用商品？","meaning":"你提出关键问题，但还在对方框架。","guidance":"更明确：请说明商品分类依据，并指出哪条法律支持你的主张。"},{"type":"边界型","text":"商品类型可以讨论，但不能因此把全部证明压力推给我。消保法第二十三条对耐用商品六个月内瑕疵举证有明确规则；即便你们认为不适用，也请说明分类依据，并提供反证或检测安排。","meaning":"你区分耐用与非耐用，同时要求对方提供反证。","guidance":"保留商品类型证据。即便非耐用，对方否定证据也需反证。"},{"type":"回击型","text":"行，那我直接12315投诉你拒绝举证，让市场监管来认定这个商品算不算耐用，谁举证。","meaning":"你把认定权交给监管部门。","guidance":"12315可认定商品类型和举证责任。保留对方拒绝举证的记录。"}]}},{"npc":"我们已经提醒过了，是你没注意。","intent":"把提示义务转嫁成消费者的注意义务，让你觉得是自己粗心。","moves":["提示义务转嫁","注意义务甩锅"],"choices":[{"type":"软弱型","text":"可能我下单时滑得太快，没留意提示。","meaning":"你接受了\"是我的问题\"的定性，对方成功甩锅。","guidance":"提示义务在商家，不是消费者有义务去找每一条提示。关键信息必须显著标明。"},{"type":"中立型","text":"但你们的提示不太明显。","meaning":"你指出了问题，但\"不太明显\"不够有力。","guidance":"更具体：根据消费者权益保护法，关键信息需要以显著方式标明。你们的提示放在哪里？是否显著？"},{"type":"边界型","text":"提醒是否有效，不是看你们有没有放过一句话，而是看关键信息是否显著、清楚、容易看到。请说明提示出现在什么位置、用什么字体和颜色；如果位置隐蔽，就不能算有效告知。","meaning":"你用法律标准检验对方的\"提示\"是否有效，而不是接受对方说\"提醒过了\"。","guidance":"截图保留提示位置和方式。如果提示确实不显著，向平台或12315投诉时作为证据。"},{"type":"回击型","text":"你把字写一行小灰字藏在角落里，然后说我没注意？那不叫提醒，那叫藏。","meaning":"你戳中了\"隐蔽提示不算有效告知\"的问题，但需要看实际情况。","guidance":"更冷静：提示是否有效，取决于方式是否显著。请说明你们的提示方式，我会判断是否构成有效告知。"}],"followUp":{"npcByType":{"软弱型":"那您之后下单前可以多看一下页面提示，这次我们按已提示处理。","中立型":"我理解您觉得不明显，但我们确实写了，这个也算提醒过了，您看能接受吗？","边界型":"您说位置隐蔽，但我们页面就是这样设计的，您要觉得不行，那只能这样了。","回击型":"您说我们藏起来就藏起来？我们正常标注，您没看到是您的事。"},"intent":"客服用\"页面设计就这样\"和\"正常标注\"继续回避提示是否显著的问题，把设计责任推给既定事实。","moves":["设计挡箭牌","正常标注辩解"],"choices":[{"type":"软弱型","text":"这次我记下了，以后下单前多看几遍。","meaning":"你放弃了提示义务的主张。","guidance":"提示是否显著有法律标准，不是商家说了算。"},{"type":"中立型","text":"那你们能改一下标注位置吗？","meaning":"你在提改进，但当前问题没解决。","guidance":"先解决当前问题。要求因提示无效给予补偿或退款。"},{"type":"边界型","text":"消保法第二十六条要求对格式条款中的重要内容作显著提示。请把标注位置、字体大小和页面截图发我；如果只是隐藏在角落或小字里，我会主张该条款未进入合同内容。","meaning":"你引用具体法条检验提示效力，把判断权握在手里。","guidance":"截图保留标注位置。不显著提示的条款可主张无效。"},{"type":"回击型","text":"正常标注还怕我说？我现在就把截图发12315，让市场监管看看这叫不叫显著。","meaning":"你引入第三方判断，把举证转给商家。","guidance":"12315和市场监管可认定提示是否显著。截图是关键证据。"}]}},{"npc":"这个优惠不能叠加，你自己下单时没看清。","intent":"用复杂规则制造信息差，出问题时把责任推给消费者\"没看清\"。","moves":["复杂规则","信息差陷阱"],"choices":[{"type":"软弱型","text":"那这次优惠差额我先不追了。","meaning":"你接受了\"自己没看清\"的定性，放弃追讨。","guidance":"规则复杂不等于规则合理。如果优惠规则有误导性，消费者有权主张。"},{"type":"中立型","text":"但你们的规则确实很复杂。","meaning":"你指出了问题，但\"很复杂\"不够有力。","guidance":"更具体：你们的优惠规则是否有明确提示不能叠加？如果提示不显著，消费者无法做出知情选择。"},{"type":"边界型","text":"“不能叠加”会直接影响实付金额，必须在下单前显著提示。如果它只藏在规则详情里，而支付页面没有清楚标注，我就无法做出知情选择。请按优惠差额补偿或给出退款方案。","meaning":"你检验了对方的提示是否有效，而不是接受\"你没看清\"的指控。","guidance":"截图保留下单页面。如果限制条件确实不显著，向平台投诉 misleading 信息。"},{"type":"回击型","text":"你们故意把规则写得复杂，好让消费者踩坑，然后怪消费者没看清？","meaning":"你戳中了\"用复杂规则制造陷阱\"的问题，但需要实际依据。","guidance":"更冷静：规则是否合理，需要看提示方式。请说明你们的限制条件在哪里标注的，是否显著。"}],"followUp":{"npcByType":{"软弱型":"那您下次参与活动前可以先点开规则详情确认一下。","中立型":"我理解您觉得复杂，但规则确实写了不能叠加，您看能接受这个结果吗？","边界型":"您说提示不显著，但我们下单页有写的，您要觉得不行，那只能这样了。","回击型":"您说我们设陷阱就设陷阱？规则明明白白写着，您没看到是您的事。"},"intent":"客服用\"下单页有写\"继续回避提示是否显著，把责任推给你没看到，维护误导性规则。","moves":["下单页辩解","责任推卸"],"choices":[{"type":"软弱型","text":"差额不多的话，我这次先不处理了。","meaning":"你放弃了误导规则的主张。","guidance":"误导性规则可主张撤销交易。不要轻易算了。"},{"type":"中立型","text":"那你们能不能把规则简化一下？","meaning":"你提改进，但当前损失没追回。","guidance":"先追回损失。要求按叠加优惠补差价或退款。"},{"type":"边界型","text":"限制优惠叠加属于影响消费者权益的重要规则，消保法第二十六条要求这类格式条款显著提示。若下单页没有清楚标注，我不认可这个限制，请按叠加优惠补差价，或办理退款。","meaning":"你用显著提示义务检验规则效力，给出明确诉求。","guidance":"截图保留下单页。限制权利条款未显著提示可主张无效。"},{"type":"回击型","text":"明明白白写着还藏在角落？我把下单页截图发12315，让市场监管看看这叫不叫显著提示。","meaning":"你引入第三方认定，把判断权交出去。","guidance":"12315可认定提示是否显著。截图和订单记录是关键证据。"}]}},{"npc":"你先把差评删了，我们再给你处理。","intent":"把解决问题和删除评价绑定，用售后要挟你放弃差评权。","moves":["售后要挟","评价权绑架"],"choices":[{"type":"软弱型","text":"如果删了你们就处理，我可以先删。","meaning":"你放弃了最重要的筹码。删了差评后，对方可能拖延甚至不处理。","guidance":"绝对不要先删差评。差评是你的正当权利，也是你的筹码。先处理问题，再考虑是否修改评价。"},{"type":"中立型","text":"处理好了我自然会改。","meaning":"你想表达\"先解决问题\"，但\"改\"这个词给了对方模糊空间。","guidance":"更明确：处理好了我可以考虑修改评价，但不会先删。售后和评价是两回事，不能绑定。"},{"type":"边界型","text":"售后处理和评价内容不能捆绑交换。你们应先处理商品或服务问题，我有权保留真实评价；处理结果如何，我会根据实际情况再更新评价。","meaning":"你明确区分了售后义务和评价权利，对方无法用\"不删不处理\"来要挟你。","guidance":"保留对方要求\"先删差评\"的截图，这本身就是商家违规的证据。"},{"type":"回击型","text":"你用售后来要挟我删差评？这不就是做贼心虚吗？","meaning":"你戳中了对方怕差评的心理，但\"做贼心虚\"太攻击性。","guidance":"更冷静：消费者有如实评价的权利。如果你拒绝处理，我会在差评里补充你拒绝处理的过程。"}],"followUp":{"npcByType":{"软弱型":"嗯，那您先删了，我们尽快处理。","中立型":"我理解您不想删，但我们这边流程就是要先删，您看配合一下？","边界型":"那您不删我们也没法推进，这个是公司规定，您要这样的话只能等着了。","回击型":"您不删那就不处理，差评挂着呗，我们不怕。"},"intent":"客服用\"公司规定要先删\"和\"不删不处理\"继续要挟，把售后和评价强行绑定，赌你急着要售后就妥协。","moves":["公司规定要挟","拖延施压"],"choices":[{"type":"软弱型","text":"我先删掉评价，你们尽快帮我处理。","meaning":"你交出了最重要的筹码。","guidance":"绝对不要先删。删了之后对方可能彻底不处理。"},{"type":"中立型","text":"那你们能先承诺处理时限吗？","meaning":"你想换取承诺，但还在对方框架里。","guidance":"不需要交换。售后和评价是两回事，不能绑定。"},{"type":"边界型","text":"如实评价是消费者的正当权利，售后义务也不能附加“先删评价”这种条件。我拒绝先删，请立即按售后流程处理；如果继续绑定，我会把这段对话作为不合理售后条件提交投诉。","meaning":"你引用法律锁定评价权和售后义务的独立性，拒绝交换。","guidance":"保留对方要求\"先删差评\"的截图，这是商家违规的关键证据。"},{"type":"回击型","text":"不删就不处理？行，我把这段对话截图发12315，让市场监管看看你们怎么要挟消费者删差评的。","meaning":"你把要挟行为直接升级到监管。","guidance":"要求\"先删差评\"本身违规，12315和平台都可处理。截图是铁证。"}]}},{"npc":"售后专员不在，你明天再来问。","intent":"拖延处理时间，增加你的维权成本，赌你会放弃。","moves":["拖延战术","人员借口"],"choices":[{"type":"软弱型","text":"可以，那我明天同一时间再问。","meaning":"你接受了无限拖延。明天可能还是\"不在\"。","guidance":"售后专员在不在是商家内部管理问题，不能成为拒绝处理售后的理由。"},{"type":"中立型","text":"那能不能帮我留个工单？","meaning":"你想推进，但\"帮我\"语气太弱。","guidance":"更明确：售后专员在不在，不影响我的售后请求。请帮我提交工单，注明处理时限，我等回复。"},{"type":"边界型","text":"专员排班是你们的内部安排，不应让消费者承担等待成本。请现在先登记工单、写明问题和诉求，并告知最晚回复时间；如果今天无法处理，也要给出明确时限。","meaning":"你把内部管理问题跟消费者售后义务区分开，同时要求明确的时间承诺。","guidance":"记录沟通时间和对方回复。如果对方反复拖延，向平台或12315投诉时说明。"},{"type":"回击型","text":"专员不在你就不能处理了？那你们店是不是专员不在就关门？","meaning":"你戳中了\"用人员不在推责\"的荒谬，但语气偏冲。","guidance":"更冷静：我理解专员可能不在，但售后请求不应该因此搁置。请帮我提交工单，告知最晚回复时间。"}],"followUp":{"npcByType":{"软弱型":"那您明天再联系，专员回来后再看具体怎么处理。","中立型":"我理解您着急，但专员确实不在，我也处理不了，您明天再来问吧。","边界型":"那您非要今天处理，我也只能帮您记一下，等专员回来再说，时间我不能保证。","回击型":"专员就是不在，您今天来几次都一样，您明天再来。"},"intent":"客服用\"记一下等专员回来\"继续拖延，且不承诺时间，把售后请求无限期搁置。","moves":["无时限拖延","人员挡箭牌"],"choices":[{"type":"软弱型","text":"我明天再来问进度，希望到时候能处理。","meaning":"你接受了无时限拖延。","guidance":"不要接受\"明天再来\"。要求当场提交工单并明确时限。"},{"type":"中立型","text":"那你能帮我加急吗？","meaning":"你在请求加急，但主动权在对方。","guidance":"更明确：请提交工单并注明最晚回复时间，否则我向12315投诉拖延。"},{"type":"边界型","text":"经营者应及时处理售后请求，不能把“专员不在”变成无期限等待。请当场提交工单，并以文字形式告知最晚回复时间；超时未处理，我会按拖延售后向12315投诉。","meaning":"你引用法律否定人员借口，要求当场提交和书面时限。","guidance":"12315可处理售后拖延。保留每次联系的时间和回复。"},{"type":"回击型","text":"专员不在你就处理不了？那我现在就12315投诉你们拒绝及时处理售后，让市场监管来跟你们专员谈。","meaning":"你把拖延行为直接升级。","guidance":"拖延售后本身可投诉。12315会要求商家限期处理。"}]}},{"npc":"这个补偿已经是最大权限了。","intent":"用\"最大权限\"压低补偿，让你觉得没有谈判空间。","moves":["权限压制","内部标准代替法律"],"choices":[{"type":"软弱型","text":"如果真的只能这样，我就先接受。","meaning":"你接受了对方的定价，没有争取更多。","guidance":"\"最大权限\"是客服话术，不是法律标准。补偿应该基于实际损失，不是对方的权限。"},{"type":"中立型","text":"能不能再申请一下？","meaning":"你在请求，但\"能不能\"语气太弱，对方会说\"确实没办法了\"。","guidance":"更明确：最大权限是你们的内部标准，我的补偿诉求基于实际损失。如果这个权限不够，请升级处理。"},{"type":"边界型","text":"“最大权限”只是你当前岗位的内部上限，不是损失赔偿的标准。我的诉求是按实际损失补偿；如果你无权处理，请转给有权限的负责人，而不是用权限封顶。","meaning":"你区分了\"内部权限\"和\"实际损失\"，同时要求升级处理。","guidance":"如果对方拒绝升级，可以要求其书面说明最终处理方案和拒绝理由，作为投诉证据。"},{"type":"回击型","text":"最大权限？那你转给有更大权限的人。你处理不了就别挡着。","meaning":"你要求升级处理，方向对，但语气太冲。","guidance":"更冷静：如果这个权限不足以解决问题，我要求升级处理。请帮我转接有更高处理权限的负责人。"}],"followUp":{"npcByType":{"软弱型":"那我就把这个方案登记为您已接受，后续按这个执行。","中立型":"我理解您想多要，但我真的没权限了，您看能不能接受这个方案？","边界型":"那您要升级也行，但升级处理时间更长，结果未必比现在好，您考虑下。","回击型":"您要升级就升级，我们等着，该走的流程走完也就这样。"},"intent":"客服用\"升级时间更长结果未必好\"继续压低补偿，同时用\"等着\"摆出无所谓姿态，赌你嫌麻烦接受现状。","moves":["升级劝退","无所谓姿态"],"choices":[{"type":"软弱型","text":"我不想再拖了，先按这个补偿走吧。","meaning":"你被劝退，接受了不足的补偿。","guidance":"\"最大权限\"不是法律标准。补偿应基于实际损失。"},{"type":"中立型","text":"那能帮我转主管吗？","meaning":"你想升级，但没给出依据。","guidance":"更明确：请转有更高权限的负责人，我的诉求基于实际损失XX元。"},{"type":"边界型","text":"消保法第五十二条强调的是经营者造成损失后的赔偿责任，重点在实际损失，而不是客服权限。请转接能决定赔偿金额的人；如果拒绝全额赔偿，请书面说明依据和计算方式。","meaning":"你引用具体法条锁定赔偿标准，要求升级或书面拒绝。","guidance":"书面拒绝理由是投诉证据。12315可调解赔偿金额。"},{"type":"回击型","text":"行，那我直接12315投诉你们赔偿不足，让市场监管来算实际损失该赔多少。","meaning":"你把赔偿争议交给监管。","guidance":"12315可调解赔偿。保留损失凭证(支付记录、维修报价等)。"}]}},{"npc":"你情绪不要这么激动，沟通要理性。","intent":"把维权焦点转成你的情绪问题，让你觉得是自己在无理取闹。","moves":["情绪标签","焦点转移"],"choices":[{"type":"软弱型","text":"抱歉，我整理一下语气再说。","meaning":"你被\"不理性\"的标签压制了，开始自我调整，对方成功转移了焦点。","guidance":"表达诉求不是不理性。你可以说：我一直在讲事实和依据，这本身就是理性沟通。"},{"type":"中立型","text":"我没有激动，我只是在说问题。","meaning":"你在解释\"没有激动\"，但一旦进入自证，你就被带偏了。","guidance":"不需要解释。直接说：我一直在讲事实，请回应我的具体诉求，而不是评价我的情绪。"},{"type":"边界型","text":"我现在讨论的是事实、证据和处理诉求，这本身就是理性沟通。请不要把话题转到我的表达方式上；如果你认为我的诉求不能成立，请直接说明事实依据和处理方案。","meaning":"你把焦点从\"你的情绪\"拉回\"我的诉求\"，同时定义了什么是真正的理性沟通。","guidance":"保持聚焦事实。如果对方反复评价你的情绪，说明他不想回应你的实质问题。"},{"type":"回击型","text":"你推责的时候怎么不说理性？消费者维权你嫌激动，你怎么不看看自己做的事？","meaning":"你戳中了对方双重标准，但语气偏冲。","guidance":"更冷静：我理解沟通需要双方配合，但请先回应我的具体诉求。情绪不是重点，问题才是。"}],"followUp":{"npcByType":{"软弱型":"嗯，您冷静一下再说，我等您。","中立型":"我理解您着急，但您这样沟通我们也没法帮您，您先冷静下？","边界型":"您一直在讲事实我听到了，但您要这个态度，我也没法继续沟通，您换个方式？","回击型":"您继续这样说话，那我就不回应了，您冷静了再来。"},"intent":"客服继续用\"态度\"\"冷静\"评价你的表达，以拒绝回应为威胁，回避实质诉求。","moves":["态度评价","拒绝回应"],"choices":[{"type":"软弱型","text":"我换一种说法，尽量不让你觉得我态度不好。","meaning":"你被\"态度\"标签带偏，开始自我调整。","guidance":"不需要调整表达。坚持要对方回应实质诉求。"},{"type":"中立型","text":"我态度没问题，请你回应我的诉求。","meaning":"你在自证态度，但还是被带偏了。","guidance":"不需要自证态度。直接要求回应诉求。"},{"type":"边界型","text":"经营者应当正面处理消费者的合理诉求。我讲的是事实和依据，请回应问题本身，而不是继续评价我的态度。若你以“态度”为由拒绝处理，我会把这段沟通作为售后不履行材料提交12315。","meaning":"你引用法律锁定对方的回应义务，拒绝被情绪标签带偏。","guidance":"商家拒绝回应诉求本身可投诉。保留沟通记录。"},{"type":"回击型","text":"你不回应就不回应？行，我把这段录音发12315，让市场监管听听你怎么回避消费者诉求的。","meaning":"你用录音和监管施压。","guidance":"录音在多数地区合法。12315可处理商家拒绝沟通的问题。"}]}},{"npc":"其他顾客都没反馈，就你有问题。","intent":"用多数人沉默否定个体问题，让你觉得是自己特殊、挑剔。","moves":["多数人沉默","个体否定"],"choices":[{"type":"软弱型","text":"可能刚好我遇到的是个别情况。","meaning":"你接受了\"别人没说=没有问题\"的逻辑。但沉默不等于满意。","guidance":"别人有没有反馈不影响你的问题是否成立。你的体验是真实的。"},{"type":"中立型","text":"但我的确实有问题啊。","meaning":"你坚持了自己的问题，但力度不够。","guidance":"更直接：其他顾客有没有反馈，不影响我的问题是否成立。我反映的是我的实际体验，请处理。"},{"type":"边界型","text":"其他顾客是否反馈，不能用来否定我这笔订单的问题。每个人使用场景不同，沉默也不等于没有瑕疵。我现在反映的是自己的实际体验，请基于我的证据给处理方案。","meaning":"你拆解了\"多数人没说=没问题\"的逻辑，坚持基于自己的实际体验维权。","guidance":"保持这个立场。很多消费者不投诉不是因为满意，是因为嫌麻烦。你的投诉不代表只有你有问题。"},{"type":"回击型","text":"没人反馈？那你看不看差评区？是不是差评都被你删了？","meaning":"你质疑了对方的数据来源，但\"删差评\"这个指控需要依据。","guidance":"更冷静：其他顾客的情况我不清楚，我只能说我的实际体验。请基于我的问题给出处理方案。"}],"followUp":{"npcByType":{"软弱型":"那可能就是个别批次或个别使用情况，我们先这样记录。","中立型":"我理解您的感受，但确实没其他人反映，您这个我们只能个案处理。","边界型":"您说没反馈不等于没问题，但我们这边数据就是这样，您要觉得不行只能投诉。","回击型":"您要说我们删差评就删差评？我们正常经营，您随便投诉。"},"intent":"客服用\"数据就是这样\"和\"个案处理\"继续否定问题的普遍性，把你的问题孤立化、边缘化。","moves":["数据挡箭牌","个案化处理"],"choices":[{"type":"软弱型","text":"如果只能按个案，那你们个案一般怎么补偿？","meaning":"你接受了\"个案\"定性，但还没拿到方案。","guidance":"不要接受\"个案\"标签。你的问题是真实的，无论普遍与否。"},{"type":"中立型","text":"那你们能查一下有没有类似反馈吗？","meaning":"你想让对方查证，但主动权在对方。","guidance":"更明确：请处理我的实际体验问题，与是否有类似反馈无关。"},{"type":"边界型","text":"消费者可以就自己的消费体验和损失主张权利，不需要先证明“很多人都有问题”。请围绕我提供的事实处理这笔订单；如果继续用“没人反馈”搪塞，我会向12315投诉。","meaning":"你引用法律否定\"多数人沉默\"逻辑，坚持个体维权权。","guidance":"个体维权不依赖普遍性。12315可处理个案投诉。"},{"type":"回击型","text":"数据是你们说了算？行，我直接12315投诉，让市场监管来查你们是不是普遍问题。","meaning":"你把\"是否普遍\"的认定交给监管。","guidance":"12315和市场监管可开展调查。你的投诉可能成为线索。"}]}},{"npc":"你拆封了就不能退。","intent":"用拆封规则否定质量争议，让你觉得拆了就只能认了。","moves":["拆封不退","规则滥用"],"choices":[{"type":"软弱型","text":"早知道不能退，我就不拆了。","meaning":"你接受了\"拆封=不能退\"的规则。但如果质量有问题，拆封不影响退货权。","guidance":"拆封不等于不能退。如果商品有质量问题，拆封是发现问题的必要前提。"},{"type":"中立型","text":"但我不拆怎么知道有问题？","meaning":"你指出了矛盾，但力度不够。","guidance":"更明确：拆封是检验商品的必要步骤。如果拆封后发现质量问题，根据消费者权益保护法，仍可以退货。"},{"type":"边界型","text":"拆封是检查商品状态的必要步骤，不能直接等同于使用损坏。现在的问题是拆封后发现质量瑕疵，请先判断质量责任，而不是只用“拆封”一条拒绝退货。","meaning":"你区分了\"拆封\"和\"使用损坏\"，用法律依据覆盖了对方的规则。","guidance":"保留商品状态照片。如果商品本身完好只是拆封，对方不能以\"拆封\"为由拒绝退货。"},{"type":"回击型","text":"不拆封怎么知道有问题？你买水果不切开能知道坏没坏？","meaning":"用类比戳中对方逻辑的荒谬，效果好，但例子可能不够正式。","guidance":"更正式：拆封是检验商品质量的必要前提。以拆封为由拒绝退货，不符合消费者权益保护法。"}],"followUp":{"npcByType":{"软弱型":"拆封后确实会影响退货判断，您可以先保留商品现状。","中立型":"我理解您想退，但拆封了影响二次销售，这个确实退不了。","边界型":"您说拆封是检验，但您都用了才发现问题，这个不算拆封检验了。","回击型":"您拆了用过了还想退？哪有这样的道理，您随便投诉。"},"intent":"客服用\"影响二次销售\"和\"用过了\"继续把拆封和退货对立，把检验行为污名化为使用损坏。","moves":["二次销售挡箭牌","使用指控"],"choices":[{"type":"软弱型","text":"我确实试用过一下，所以不知道还能不能退。","meaning":"你接受了\"用过就不能退\"的逻辑。","guidance":"质量问题退货不取决于是否使用，取决于是否有瑕疵。"},{"type":"中立型","text":"那我用一下怎么算检验？","meaning":"你提出关键问题，但还在对方框架。","guidance":"更明确：拆封后必要的使用是检验质量的合理方式。"},{"type":"边界型","text":"消保法第二十五条讨论七日无理由时，也不是把“拆封”直接等同于商品不完好；更何况我主张的是质量问题。请说明你们认定“影响二次销售”的具体依据，并先处理质量瑕疵。","meaning":"你引用具体法条区分拆封和使用损坏，要求对方举证。","guidance":"七日无理由退货拆封后仍可退，前提是商品完好。质量问题不受此限。"},{"type":"回击型","text":"行，我直接12315投诉你们以拆封为由拒绝法定退货，让市场监管来认定影不影响二次销售。","meaning":"你把认定权交给监管。","guidance":"12315可认定是否影响二次销售。保留商品状态照片。"}]}},{"npc":"这个需要你自己联系厂家。","intent":"把销售方的售后义务转移给厂家，让你在商家和厂家之间奔波。","moves":["踢皮球","厂家推卸"],"choices":[{"type":"软弱型","text":"好，我先找厂家客服试试。","meaning":"你接受了被踢皮球。根据消费者权益保护法，销售方是第一责任人。","guidance":"商品是跟商家买的，售后责任首先在商家。商家可以跟厂家协调，但不能推给你。"},{"type":"中立型","text":"你们不能帮我联系吗？","meaning":"你在请求，但语气太弱，对方会顺势说\"你自己联系更快\"。","guidance":"更明确：根据消费者权益保护法，销售方负责售后。你可以跟厂家协调，但那是你们内部的事，消费者只跟销售方对接。"},{"type":"边界型","text":"商品是从你们店购买的，销售方应先承接售后。厂家怎么配合是你们内部协同流程，不应要求消费者自己去跑。请由你们对接厂家，并给我明确处理方案。","meaning":"你把售后责任拉回销售方，同时认可了商家可以内部协调，但不接受把消费者推出去。","guidance":"如果对方坚持让你找厂家，向12315投诉时说明商家拒绝履行售后义务。"},{"type":"回击型","text":"东西你卖的，出了事你让我找厂家？你赚钱的时候怎么不让我找厂家分？","meaning":"和前面的\"找平台\"一样，戳中了\"赚钱自己留出事推别人\"的逻辑。","guidance":"更冷静：我是跟你们购买的，售后是你们的义务。你们可以内部跟厂家协调，但不需要我直接联系厂家。"}],"followUp":{"npcByType":{"软弱型":"您先联系厂家，他们通常更清楚检测和维修流程。","中立型":"我理解您不想跑，但售后确实是厂家负责，我们只是销售方。","边界型":"您说法律这么规定，但我们合同里写了厂家售后，您签了就代表同意。","回击型":"您拿法律压我？那您去找厂家，我们按合同办事。"},"intent":"客服用\"合同写了厂家售后\"继续把责任推给厂家，用合同条款对抗法律规定。","moves":["合同对抗法律","厂家推卸升级"],"choices":[{"type":"软弱型","text":"既然合同写厂家售后，那我先按合同走。","meaning":"你接受了合同条款压制法律。","guidance":"合同条款不能排除法定售后义务。格式条款加重消费者责任的无效。"},{"type":"中立型","text":"那合同这条有效吗？","meaning":"你提出效力问题，但还没引用依据。","guidance":"更明确：根据民法典，格式条款排除销售方法定责任的无效。"},{"type":"边界型","text":"合同写厂家售后，不等于销售方可以退出售后责任。消保法第四十条允许消费者向销售者主张责任，排除销售方法定责任的格式条款我不认可。请你们直接受理并给方案。","meaning":"你引用具体法条否定合同条款效力，锁定销售方责任。","guidance":"格式条款排除法定责任无效。12315可认定。保留合同条款截图。"},{"type":"回击型","text":"合同写啥都行？那写\"售出概不负责\"也行？我现在就12315投诉你们用格式条款甩锅。","meaning":"你用极端例子戳穿合同条款的荒谬，同时升级。","guidance":"格式条款问题12315和市场监管都可处理。保留合同截图。"}]}},{"npc":"我们页面写得很清楚，是你没看到。","intent":"用隐藏信息对抗消费者理解，把信息不透明变成\"你没看清\"。","moves":["信息不透明","清楚自定"],"choices":[{"type":"软弱型","text":"可能我浏览页面时没有点开详情。","meaning":"你接受了\"是我的问题\"的定性。但页面信息是否显著，不是商家说了算。","guidance":"关键信息需要在显著位置标明。藏在详情页深处不算\"写得很清楚\"。"},{"type":"中立型","text":"但你们写在很角落的地方。","meaning":"你指出了问题，但\"很角落\"不够具体。","guidance":"更明确：关键信息是否\"写清楚\"，取决于位置是否显著、字体是否可读。请说明你们的标注方式。"},{"type":"边界型","text":"“写清楚”要看用户下单时是否能显著看到，而不是页面某处存在文字就够了。若关键信息只在详情深处或小字里，请说明标注位置、字体和展示方式。","meaning":"你检验了\"清楚\"的标准，而不是接受对方说\"写清楚了\"。","guidance":"截图保留页面布局。如果关键信息确实不显著，向平台或12315投诉时作为证据。"},{"type":"回击型","text":"写得清楚？你把重要信息藏在一堆文字里，那叫清楚？那叫埋雷。","meaning":"你戳中了\"隐藏信息\"的问题，但\"埋雷\"太攻击性。","guidance":"更冷静：信息是否清楚有标准。请告诉我你们在哪里标注的，我会判断是否构成有效告知。"}],"followUp":{"npcByType":{"软弱型":"那后续您下单前可以多停留看一下页面详情，我们这边按已展示记录。","中立型":"我理解您觉得不明显，但我们确实写了，这个也算告知了，您看能接受吗？","边界型":"您说位置隐蔽，但我们页面就是这样，您要觉得不行那只能这样了。","回击型":"您说我们埋雷就埋雷？我们正常标注，您没看到是您的事。"},"intent":"客服用\"页面就这样\"和\"正常标注\"继续回避是否显著的 ","guidance":"消协(12315)、市场监管、平台都是维权渠道。可并行投诉。"}]}},{"npc":"这个只能给你优惠券，不能退现金。","intent":"用平台利益替代实际损失补偿，让你觉得有补偿就不错了。","moves":["优惠券替代","强制补偿形式"],"choices":[{"type":"软弱型","text":"如果不能退现金，优惠券我也先收着。","meaning":"你接受了\"优惠券代替现金\"的方案。但优惠券不能用于其他平台，价值不等同于现金。","guidance":"补偿形式应该基于你的实际损失，不是对方的方便。你有权要求现金退款。"},{"type":"中立型","text":"我更想要现金退款。","meaning":"你表达了偏好，但\"更想要\"语气太弱。","guidance":"更明确：我的损失是现金，补偿也应该是现金。优惠券有使用限制，不等同于现金价值。"},{"type":"边界型","text":"我的损失来自实际支付的现金，补偿也应对应实际支付金额。优惠券有有效期、门槛和平台限制，不能等同现金退款。我拒绝以券替代现金，请按原支付路径退款。","meaning":"你区分了\"优惠券\"和\"现金\"的价值差异，坚持要求等值补偿。","guidance":"如果对方坚持只给优惠券，向平台或12315投诉时说明：商家拒绝现金退款，强制以优惠券代替。"},{"type":"回击型","text":"我给你现金你给我优惠券行不行？你干吗？","meaning":"用对称的例子让对方感受\"不等值交换\"的荒谬，效果好。","guidance":"更冷静：优惠券是你们的营销工具，不是货币。我的损失是真金白银，补偿也应该是现金。"}],"followUp":{"npcByType":{"软弱型":"优惠券也能抵扣后续消费，您可以先领取使用。","中立型":"我理解您想要现金，但系统只能发优惠券，这个我们也没办法。","边界型":"那您非要现金，我也只能帮您申请，但不保证通过，您要等通知。","回击型":"您要现金没有，就优惠券，爱要不要。"},"intent":"客服用\"系统只能发优惠券\"和\"不保证通过\"继续把优惠券强加给你，用系统限制和模糊处理拖你。","moves":["系统限制","模糊处理"],"choices":[{"type":"软弱型","text":"那我先领优惠券，现金退款就不申请了。","meaning":"你接受了不等值补偿。","guidance":"优惠券有使用限制和有效期，不等同于现金。"},{"type":"中立型","text":"那能申请现金吗？","meaning":"你在请求，但没给出依据。","guidance":"更明确：我的损失是现金，补偿也应是现金，请申请现金退款。"},{"type":"边界型","text":"赔偿应围绕实际财产损失展开，消保法第五十二条说的也是损失赔偿责任。我的损失是现金支出，不是下一次消费机会；优惠券限制太多，我拒绝接受，请办理等值现金退款。","meaning":"你引用具体法条锁定赔偿形式，拒绝优惠券。","guidance":"赔偿应以实际损失形式。12315可调解补偿形式。"},{"type":"回击型","text":"系统只能发优惠券？那我把支付记录发12315，让市场监管来跟你们系统谈该退现金还是优惠券。","meaning":"你把赔偿形式争议交给监管。","guidance":"12315可调解补偿形式。保留支付记录和优惠券限制说明。"}]}},{"npc":"再沟通也是这个结果。","intent":"提前封死协商空间，让你觉得继续维权是浪费时间。","moves":["封死协商","单方定论"],"choices":[{"type":"软弱型","text":"既然你们已经定了，我就不继续沟通了。","meaning":"你接受了\"没有空间\"的定论，放弃了维权。","guidance":"对方说\"就是这个结果\"不等于真的没有空间。升级投诉往往会有不同结果。"},{"type":"中立型","text":"那我想想其他途径。","meaning":"你想找其他途径，但\"想想\"太模糊，对方不会在意。","guidance":"更明确：如果你这边无法提供更好的方案，我会向12315和平台投诉。到时候处理人不一样，结果可能也不一样。"},{"type":"边界型","text":"你当前给的是内部处理结论，不是最终结论。若协商不能继续，我会通过12315和平台投诉升级。升级会增加你们的举证和处理成本，建议现在重新评估方案。","meaning":"你明确了这不是终点，同时 function getTypeClass(type) {
  if (type === '软弱型') return 'type-weak';
  if (type === '中立型') return 'type-neutral';
  if (type === '边界型') return 'type-boundary';
  return 'type-counter';
}

function getTypeLabelColor(type) {
  if (type === '软弱型') return 'type-weak-bg';
  if (type === '中立型') return 'type-neutral-bg';
  if (type === '边界型') return 'type-boundary-bg';
  return 'type-counter-bg';
}

function getModule(mId) { return modules.find(m => m.id === mId); }
function getScene(sId) { return scenes.find(s => s.id === sId); }
function getScenesByModule(mId) { return scenes.filter(s => s.moduleId === mId); }
function getChallengeRounds(scene) {
  if (!scene) return [];
  const all = challengeData[scene.moduleId] || [];
  if (scene.indices) return scene.indices.map(i => all[i]).filter(Boolean);
  return all;
}

const router = {
  go(page, params) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    if (page === 'home') {
      document.getElementById('page-home').classList.add('active');
      window.location.hash = '#/home';
    } else if (page === 'scenes') {
      document.getElementById('page-scenes').classList.add('active');
      scenePage.render(params.moduleId);
      window.location.hash = '#/scenes/' + params.moduleId;
    } else if (page === 'chat') {
      document.getElementById('page-chat').classList.add('active');
      chat.init(params.sceneId);
      window.location.hash = '#/chat/' + params.sceneId;
    } else if (page === 'emergency') {
      document.getElementById('page-emergency').classList.add('active');
      window.location.hash = '#/emergency';
    }
  },
  back() {
    const hash = window.location.hash;
    if (hash.startsWith('#/chat/')) this.go('scenes', { moduleId: chat.currentModuleId });
    else if (hash.startsWith('#/scenes/')) this.go('home');
    else if (hash === '#/emergency') this.go('home');
    else this.go('home');
  }
};

// 主页
const homePage = {
  render() {
    const grid = document.getElementById('home-modules');
    grid.innerHTML = modules.map(m => `
      <div class="module-card" onclick="router.go('scenes', {moduleId:'${m.id}'})">
        <div class="icon">${m.icon}</div>
        <div class="name" style="color:${m.darkColor}">${m.name}</div>
        <div class="desc">${m.desc}</div>
      </div>
    `).join('');
  }
};

// 场景页
const scenePage = {
  render(moduleId) {
    const mod = getModule(moduleId);
    const hero = document.getElementById('scene-hero');
    hero.style.background = 'linear-gradient(135deg, ' + mod.darkColor + ', ' + mod.color + ')';
    document.getElementById('scene-module-title').textContent = mod.name;
    document.getElementById('scene-module-desc').textContent = mod.desc;
    const list = getScenesByModule(moduleId);
    const listEl = document.getElementById('scene-list');
    listEl.innerHTML = list.map((s, i) => {
      const char = characterMap[s.id] || {};
      const avatarHtml = char.image ? `<img src="${char.image}" style="width:48px;height:48px;border-radius:50%;object-fit:cover;" onerror="this.outerHTML='${char.avatar}'">` : (char.avatar || '&#x1F3AD;');
      return `
        <div class="scene-card" onclick="router.go('chat', {sceneId:'${s.id}'})">
          <div class="avatar" style="background:${char.image ? 'transparent' : mod.color};color:${mod.darkColor}">${avatarHtml}</div>
          <div class="info">
            <div class="title">${s.title}</div>
            <div class="role">对手：${s.role} · ${s.desc}</div>
            <div class="tags"><span class="tag">5题</span><span class="tag">${s.role}</span></div>
          </div>
          <div class="arrow">&#x203A;</div>
        </div>
      `;
    }).join('');
  }
};

// 聊天核心
const chat = {
  scene: null,
  rounds: [],
  currentRound: 0,
  totalRounds: 0,
  selectedChoices: [],
  messages: [],
  step: 'opening',
  currentModuleId: '',

  init(sceneId) {
    this.scene = getScene(sceneId);
    if (!this.scene) return;
    this.currentModuleId = this.scene.moduleId;
    this.rounds = getChallengeRounds(this.scene);
    this.totalRounds = this.rounds.length;
    this.selectedChoices = [];
    for (let i = 0; i < this.totalRounds; i++) this.selectedChoices.push([-1, -1]);
    this.currentRound = 0;
    this.renderHeader();
    this._initRound(0);
  },

  renderHeader() {
    const char = characterMap[this.scene.id] || {};
    const mod = getModule(this.scene.moduleId);
    const avatarEl = document.getElementById('chat-avatar');
    if (char.image) {
      avatarEl.innerHTML = `<img src="${char.image}" style="width:36px;height:36px;border-radius:50%;object-fit:cover;" onerror="this.parentElement.textContent='${char.avatar}'">`;
      avatarEl.style.background = 'transparent';
    } else {
      avatarEl.textContent = char.avatar || '\u{1F3AD}';
      avatarEl.style.background = mod.color;
    }
    document.getElementById('chat-name').textContent = char.name || this.scene.role;
    document.getElementById('chat-subtitle').textContent = char.subtitle || '话术攻击者';
  },

  _initRound(idx) {
    this.currentRound = idx;
    const q = this.rounds[idx];
    const sel = this.selectedChoices[idx];
    this.clearResultFromMessages();
    this.messages = this._buildMessages(q, sel);
    this.renderMessages();
    this.renderProgress();

    if (sel[0] < 0) {
      this.step = 'opening';
      this.renderChoices(q.choices, '你的回应');
    } else if (q.followUp && sel[1] < 0) {
      this.step = 'followup';
      this.renderChoices(q.followUp.choices, '对方追击了，你怎么回？');
    } else {
      this.step = 'result';
      this.renderResult(q, sel);
    }
  },

  _buildMessages(q, sel) {
    const msgs = [];
    const char = characterMap[this.scene.id] || {};
    msgs.push({ sender: 'npc', text: q.npc, moves: q.moves || [], name: char.name, subtitle: char.subtitle });
    if (sel[0] >= 0) {
      const c1 = q.choices[sel[0]];
      msgs.push({ sender: 'player', text: c1.text, choiceType: c1.type });
    }
    if (sel[0] >= 0 && q.followUp) {
      const followupText = q.followUp.npcByType[q.choices[sel[0]].type];
      msgs.push({ sender: 'npc', text: followupText, moves: q.followUp.moves || [], isFollowUp: true, name: char.name, subtitle: char.subtitle });
    }
    if (sel[1] >= 0) {
      const c2 = q.followUp.choices[sel[1]];
      msgs.push({ sender: 'player', text: c2.text, choiceType: c2.type });
    }
    return msgs;
  },

  renderMessages() {
    const el = document.getElementById('chat-messages');
    el.innerHTML = this.messages.map(m => {
      if (m.sender === 'npc') {
        const char = characterMap[this.scene.id] || {};
        const avatarHtml = char.image ? `<img src="${char.image}" style="width:36px;height:36px;border-radius:50%;object-fit:cover;" onerror="this.outerHTML='<div class=\\'msg-avatar\\'>${char.avatar || '&#x1F3AD;'}</div>'">` : `<div class="msg-avatar">${char.avatar || '&#x1F3AD;'}</div>`;
        return `
          <div class="msg-row npc">
            ${avatarHtml}
            <div class="msg-bubble ${m.isFollowUp ? 'followup-bubble' : ''}">
              <div>${m.text}</div>
              ${m.moves && m.moves.length ? '<div class="msg-moves">' + m.moves.map(mv => '<span class="msg-move">' + mv + '</span>').join('') + '</div>' : ''}
            </div>
          </div>
        `;
      } else {
        const label = this.step === 'result' && m.choiceType ? `<div class="msg-type-label ${getTypeClass(m.choiceType)}">${m.choiceType}</div>` : '';
        return `
          <div class="msg-row player">
            <div class="msg-bubble">
              <div>${m.text}</div>
              ${label}
            </div>
            <div class="msg-avatar">&#x1F464;</div>
          </div>
        `;
      }
    }).join('');
    el.scrollTop = el.scrollHeight;
  },

  renderChoices(choices, label) {
    document.getElementById('choices-panel').style.display = 'block';
    document.getElementById('result-panel').style.display = 'none';
    document.getElementById('chat-nav').style.display = 'none';
    this.clearResultFromMessages();
    const panel = document.getElementById('choices-panel');
    panel.innerHTML = '<div class="choices-label">' + label + '</div>' +
      choices.map((c, i) => `
        <button class="choice-btn" onclick="chat.selectChoice(${i})">${c.text}</button>
      `).join('');
  },

  clearResultFromMessages() {
    const existing = document.getElementById('inline-result');
    if (existing) existing.remove();
  },

  renderResult(q, sel) {
    document.getElementById('choices-panel').style.display = 'none';
    document.getElementById('result-panel').style.display = 'none';
    document.getElementById('chat-nav').style.display = 'flex';
    document.getElementById('btn-prev').disabled = this.currentRound === 0;
    document.getElementById('btn-next').textContent = this.currentRound === this.totalRounds - 1 ? '查看战报' : '下一题';
    this.clearResultFromMessages();

    const c1 = q.choices[sel[0]];
    const c2 = sel[1] >= 0 && q.followUp ? q.followUp.choices[sel[1]] : null;
    let comboHtml = '';
    if (c2) {
      const comboKey = c1.type + '+' + c2.type;
      const combo = comboMessages[comboKey];
      if (combo) {
        comboHtml = `
          <div class="combo-banner">
            <div class="emoji">${combo.emoji}</div>
            <div class="title">${combo.title}</div>
            <div class="desc">${combo.desc}</div>
          </div>
        `;
      }
    }

    let html = `
      <div id="inline-result" style="margin-top:16px;background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 12px rgba(80,50,30,0.06);">
        ${comboHtml}
        <div class="result-card" style="background:#f9f5f2;border-radius:12px;padding:14px;margin-bottom:12px;">
          <div style="font-size:12px;color:#9a8a7a;margin-bottom:6px;">第一轮</div>
          <div class="r-title">&#x1F4AC; ${c1.type}</div>
          <div class="r-text" style="margin-top:8px"><strong>你的回应：</strong>${c1.text}</div>
          <div class="r-text" style="margin-top:8px"><strong>意图分析：</strong>${q.intent}</div>
          <div class="r-text" style="margin-top:8px"><strong>含义解读：</strong>${c1.meaning}</div>
          <div class="r-label" style="margin-top:10px;background:#e0ecdc;color:#4a7a5a;padding:8px 12px;border-radius:8px;font-weight:600;">&#x1F4A1; 指导：${c1.guidance}</div>
        </div>
    `;

    if (c2) {
      html += `
        <div class="result-card" style="background:#f9f5f2;border-radius:12px;padding:14px;margin-bottom:12px;">
          <div style="font-size:12px;color:#9a8a7a;margin-bottom:6px;">第二轮 · 追击</div>
          <div class="r-title">&#x1F4AC; ${c2.type}</div>
          <div class="r-text" style="margin-top:8px"><strong>你的回应：</strong>${c2.text}</div>
          <div class="r-text" style="margin-top:8px"><strong>追击意图：</strong>${q.followUp.intent}</div>
          <div class="r-text" style="margin-top:8px"><strong>含义解读：</strong>${c2.meaning}</div>
          <div class="r-label" style="margin-top:10px;background:#e0ecdc;color:#4a7a5a;padding:8px 12px;border-radius:8px;font-weight:600;">&#x1F4A1; 指导：${c2.guidance}</div>
        </div>
      `;
    }

    const sameType = c2 && c2.type === c1.type;
    html += `
        <div class="result-card" style="background:#f9f5f2;border-radius:12px;padding:14px;">
          <div class="r-title">&#x1F4D6; 类型解析</div>
          <div class="r-text"><strong>${c1.type}：</strong>${typeMeanings[c1.type] || ''}</div>
          ${c2 && !sameType ? '<div class="r-text" style="margin-top:8px"><strong>' + c2.type + '：</strong>' + (typeMeanings[c2.type] || '') + '</div>' : ''}
          ${c2 && sameType ? '<div class="r-text" style="margin-top:6px;color:#9a8a7a;font-size:12px;">两轮都选了' + c1.type + '，合并解析。</div>' : ''}
        </div>
      </div>
    `;

    document.getElementById('chat-messages').insertAdjacentHTML('beforeend', html);
  },

  renderProgress() {
    const pct = ((this.currentRound + 1) / this.totalRounds) * 100;
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('chat-progress').textContent = (this.currentRound + 1) + '/' + this.totalRounds;
  },

  selectChoice(index) {
    const qIdx = this.currentRound;
    const q = this.rounds[qIdx];
    const sel = this.selectedChoices;

    if (this.step === 'opening') {
      sel[qIdx][0] = index;
      const choice = q.choices[index];
      if (choice.type === '边界型') this.showEncourage();
      this.messages.push({ sender: 'player', text: choice.text });
      this.renderMessages();
      document.getElementById('choices-panel').style.display = 'none';

      if (q.followUp) {
        document.getElementById('chat-messages').innerHTML += '<div class="typing" id="typing"><span></span><span></span><span></span></div>';
        setTimeout(() => {
          const typingEl = document.getElementById('typing');
          if (typingEl) typingEl.remove();
          const followupText = q.followUp.npcByType[choice.type];
          const char = characterMap[this.scene.id] || {};
          this.messages.push({ sender: 'npc', text: followupText, moves: q.followUp.moves || [], isFollowUp: true, name: char.name, subtitle: char.subtitle });
          this.renderMessages();
          this.step = 'followup';
          this.renderChoices(q.followUp.choices, '对方追击了，你怎么回？');
        }, 800);
      } else {
        setTimeout(() => {
          this.step = 'result';
          this.renderResult(q, sel[qIdx]);
        }, 500);
      }
    } else if (this.step === 'followup') {
      sel[qIdx][1] = index;
      const choice = q.followUp.choices[index];
      if (choice.type === '边界型') this.showEncourage();
      this.messages.push({ sender: 'player', text: choice.text });
      this.renderMessages();
      document.getElementById('choices-panel').style.display = 'none';
      setTimeout(() => {
        this.step = 'result';
        this.renderResult(q, sel[qIdx]);
      }, 500);
    }
  },

  showEncourage() {
    const text = encourageTexts[Math.floor(Math.random() * encourageTexts.length)];
    const toast = document.getElementById('toast');
    toast.textContent = text;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  },

  nextQuestion() {
    if (this.currentRound < this.totalRounds - 1) {
      this._initRound(this.currentRound + 1);
    } else {
      this._showSummary();
    }
  },

  prevRound() {
    if (this.currentRound > 0) this._initRound(this.currentRound - 1);
  },

  retryRound() {
    const qIdx = this.currentRound;
    this.selectedChoices[qIdx][0] = -1;
    this.selectedChoices[qIdx][1] = -1;
    this._initRound(qIdx);
  },

  _showSummary() {
    let statBoundary = 0, statCounter = 0, statTotal = 0;
    this.selectedChoices.forEach((pair, qIndex) => {
      const q = this.rounds[qIndex];
      pair.forEach((choiceIndex, roundIndex) => {
        if (choiceIndex >= 0) {
          const list = roundIndex === 0 ? q.choices : (q.followUp ? q.followUp.choices : q.choices);
          if (list) {
            const type = list[choiceIndex].type;
            statTotal++;
            if (type === '边界型') statBoundary++;
            if (type === '回击型') statCounter++;
          }
        }
      });
    });
    document.getElementById('stat-total').textContent = statTotal;
    document.getElementById('stat-boundary').textContent = statBoundary;
    document.getElementById('stat-counter').textContent = statCounter;
    document.getElementById('summary-overlay').classList.add('active');
  },

  closeSummary() {
    document.getElementById('summary-overlay').classList.remove('active');
  }
};

// 急救
const emergency = {
  setExample(text) {
    document.getElementById('emergency-input').value = text;
  },
  analyze() {
    const text = document.getElementById('emergency-input').value.trim();
    if (!text) return;
    const lowerText = text.toLowerCase();
    let matched = null;
    for (const rule of emergencyRules) {
      if (rule.keywords.some(kw => lowerText.includes(kw.toLowerCase()))) {
        matched = rule;
        break;
      }
    }
    if (!matched) {
      matched = {
        intent: '对方的话可能包含某种施压、贴标签或转移责任的意图。先别急着自证或反击，先判断对方是在讨论具体问题，还是在用模糊话术压制你。',
        boundary: '我不太认同这个说法。如果您有具体的问题或建议，请说清楚，我们可以讨论。但我不接受用空泛的评价来定义我。',
        guidance: '把空泛评价拉回具体事实。追问对方：具体指哪件事？把判断权拿回来。'
      };
    }
    const resEl = document.getElementById('emergency-result');
    resEl.style.display = 'block';
    resEl.innerHTML = `
      <div class="er-title">&#x1F50D; 分析结果</div>
      <div class="er-section">
        <div class="er-label">对方意图</div>
        <div class="er-text">${matched.intent}</div>
      </div>
      <div class="er-section">
        <div class="er-label">边界回复（可直接复制使用）</div>
        <div class="er-boundary">${matched.boundary}</div>
      </div>
      <div class="er-section">
        <div class="er-label">应对指导</div>
        <div class="er-text">${matched.guidance}</div>
      </div>
    `;
  }
};

// Hash route init
function initRoute() {
  const hash = window.location.hash;
  if (hash.startsWith('#/scenes/')) {
    const mId = hash.split('/')[2];
    router.go('scenes', { moduleId: mId });
  } else if (hash.startsWith('#/chat/')) {
    const sId = hash.split('/')[2];
    router.go('chat', { sceneId: sId });
  } else if (hash === '#/emergency') {
    router.go('emergency');
  } else {
    router.go('home');
  }
}

window.addEventListener('hashchange', initRoute);
homePage.render();
initRoute();
</script>
