<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Checkcheck - 今日打卡卡片</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 16px 40px;
  }

  .card {
    width: 100%;
    max-width: 400px;
    background: #ffffff;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }

  /* 图片区域 */
  .card-image {
    width: 100%;
    aspect-ratio: 4/3;
    background-size: cover;
    background-position: center;
    position: relative;
  }
  .card-image::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 80px;
    background: linear-gradient(transparent, rgba(0,0,0,0.3));
  }
  .card-meta {
    position: absolute;
    bottom: 12px;
    left: 16px;
    right: 16px;
    display: flex;
    justify-content: space-between;
    color: #ffffff;
    font-size: 13px;
    font-weight: 500;
    z-index: 1;
  }

  /* 文字区域 */
  .card-body {
    padding: 20px;
  }
  .card-brand {
    font-size: 13px;
    font-weight: 600;
    color: #FF6B2C;
    letter-spacing: 0.05em;
    margin-bottom: 12px;
  }
  .card-date {
    font-size: 12px;
    color: #8e8e93;
    margin-bottom: 14px;
  }
  .card-quote {
    font-size: 18px;
    font-weight: 600;
    color: #1d1d1f;
    line-height: 1.5;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }
  .card-sub {
    font-size: 14px;
    color: #6e6e73;
    line-height: 1.5;
    margin-bottom: 16px;
  }

  /* 留言区域 */
  .card-note {
    padding: 12px 14px;
    background: #f2f2f7;
    border-left: 3px solid #FF6B2C;
    border-radius: 0 10px 10px 0;
    margin-bottom: 20px;
  }
  .card-note-label {
    font-size: 11px;
    color: #8e8e93;
    margin-bottom: 4px;
  }
  .card-note-text {
    font-size: 14px;
    color: #48484a;
    font-style: italic;
    line-height: 1.5;
  }

  /* 底部信息 */
  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 14px;
    border-top: 0.5px solid #e5e5ea;
  }
  .card-streak {
    font-size: 14px;
    font-weight: 600;
    color: #FF6B2C;
  }
  .card-location {
    font-size: 12px;
    color: #8e8e93;
  }

  /* 操作按钮 */
  .card-actions {
    width: 100%;
    max-width: 400px;
    display: flex;
    gap: 12px;
    margin-top: 20px;
  }
  .card-actions button {
    flex: 1;
    padding: 14px;
    border-radius: 999px;
    border: 1.5px solid #FF6B2C;
    background: transparent;
    color: #FF6B2C;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.18s ease, opacity 0.18s ease;
    font-family: inherit;
  }
  .card-actions button:active {
    transform: scale(0.97);
    opacity: 0.85;
  }
  .card-actions button.primary {
    background: #FF6B2C;
    color: #ffffff;
    box-shadow: 0 4px 12px rgba(255,107,44,0.25);
  }

  .back-link {
    margin-top: 20px;
    font-size: 14px;
    color: #FF6B2C;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
  }
  .back-link:hover { text-decoration: underline; }

  /* 无打卡提示 */
  .no-checkin {
    text-align: center;
    padding: 60px 20px;
    color: #8e8e93;
  }
  .no-checkin .nc-emoji { font-size: 48px; margin-bottom: 12px; display: block; }
</style>
</head>
<body>

<div id="cardContainer">
  <div class="card" id="cardMain">
    <div class="card-image" id="cardImage">
      <div class="card-meta">
        <span id="cardWeather">☀️ 晴天</span>
        <span id="cardStreak">连续第 1 天</span>
      </div>
    </div>
    <div class="card-body">
      <div class="card-brand">CHECKCHECK</div>
      <div class="card-date" id="cardDate"></div>
      <div class="card-quote" id="cardQuote"></div>
      <div class="card-sub" id="cardSub"></div>
      <div class="card-note" id="cardNote" style="display:none;">
        <div class="card-note-label">留句话</div>
        <div class="card-note-text" id="cardNoteText"></div>
      </div>
      <div class="card-footer">
        <span class="card-streak" id="cardStreakFooter"></span>
        <span class="card-location" id="cardLocation"></span>
      </div>
    </div>
  </div>

  <div class="card-actions">
    <button onclick="shareCard()">分享</button>
    <button class="primary" onclick="saveCard()">保存卡片</button>
  </div>

  <a class="back-link" href="index.html">← 返回首页</a>
</div>

<script>
  const THEMES = [
    { file: 'assets/t01_cat.jpg', name: '可爱猫咪' },
    { file: 'assets/t02_castle.jpg', name: '梦幻城堡' },
    { file: 'assets/t03_rainbow.jpg', name: '彩虹之桥' },
    { file: 'assets/t04_mountain.jpg', name: '远方的山' },
    { file: 'assets/t05_fruit.jpg', name: '水果乐园' },
    { file: 'assets/t06_space.jpg', name: '星际探索' },
    { file: 'assets/t07_ocean.jpg', name: '蔚蓝海洋' }
  ];

  const QUOTES = [
    { q: '每一天的坚持，都是未来闪耀的伏笔', s: '阳光明媚，适合快乐学习，加油~' },
    { q: '小小的步伐，也能走得很远', s: '保持好奇心，今天也要元气满满！' },
    { q: '努力不一定会成功，但放弃一定会失败', s: '勇敢面对今天的挑战吧！' },
    { q: '今天的汗水，是明天的勋章', s: '相信自己，你比想象中更棒！' },
    { q: '学习就像种树，最好的时间是十年前，其次是现在', s: '每一点进步都值得庆祝~' },
    { q: '星光不负赶路人', s: '继续加油，你正在变得更好！' },
    { q: '把今天过好，明天自然美好', s: '享受当下的每一刻~' }
  ];

  const WEATHERS = [
    { emoji: '☀️', text: '晴天' },
    { emoji: '⛅', text: '多云' },
    { emoji: '🌧️', text: '小雨' },
    { emoji: '🌈', text: '雨后彩虹' }
  ];

  function seededRandom(seed) {
    let x = Math.sin(seed * 9301 + 49297) * 10000;
    return x - Math.floor(x);
  }

  function getTodayData() {
    const now = new Date();
    const seed = now.getFullYear() * 10000 + (now.getMonth()+1) * 100 + now.getDate();
    return {
      theme: THEMES[Math.floor(seededRandom(seed) * THEMES.length)],
      quote: QUOTES[Math.floor(seededRandom(seed * 13 + 2) * QUOTES.length)].q,
      sub: QUOTES[Math.floor(seededRandom(seed * 13 + 2) * QUOTES.length)].s,
      weather: WEATHERS[Math.floor(seededRandom(seed * 7 + 1) * WEATHERS.length)]
    };
  }

  function loadState() {
    try {
      const raw = localStorage.getItem('checkcheck_state');
      if (raw) return JSON.parse(raw);
    } catch(e) {}
    return null;
  }

  function init() {
    const state = loadState();
    const data = getTodayData();
    const today = new Date();
    const weekDay = ['周日','周一','周二','周三','周四','周五','周六'][today.getDay()];
    const dateStr = `${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日 ${weekDay}`;

    document.getElementById('cardImage').style.backgroundImage = `url('${data.theme.file}')`;
    document.getElementById('cardWeather').textContent = `${data.weather.emoji} ${data.weather.text}`;
    document.getElementById('cardDate').textContent = dateStr;
    document.getElementById('cardQuote').textContent = data.quote;
    document.getElementById('cardSub').textContent = data.sub;
    document.getElementById('cardLocation').textContent = '📍 北京市海淀区实验小学';

    if (state && state.todayChecked) {
      document.getElementById('cardStreak').textContent = `连续第 ${state.streak || 1} 天`;
      document.getElementById('cardStreakFooter').textContent = `🔥 连续打卡 ${state.streak || 1} 天`;

      const todayStr = today.toISOString().split('T')[0];
      const record = state.checkinRecords ? state.checkinRecords[todayStr] : null;
      const note = record ? record.note : (state.selfNote || '');

      if (note) {
        document.getElementById('cardNote').style.display = 'block';
        document.getElementById('cardNoteText').textContent = note;
      }
    } else {
      document.getElementById('cardStreak').textContent = '连续第 1 天';
      document.getElementById('cardStreakFooter').textContent = '🔥 连续打卡 1 天';
    }
  }

  function shareCard() {
    if (navigator.share) {
      navigator.share({
        title: 'Checkcheck 打卡卡片',
        text: '我今天打卡啦！',
        url: window.location.href
      }).catch(() => {});
    } else {
      // Fallback: copy to clipboard
      const text = `Checkcheck 打卡 | ${document.getElementById('cardQuote').textContent}`;
      navigator.clipboard.writeText(text).then(() => {
        showToast('已复制分享文案');
      }).catch(() => {
        showToast('请手动截图分享');
      });
    }
  }

  function saveCard() {
    showToast('长按卡片可保存图片');
  }

  function showToast(msg) {
    const existing = document.querySelector('.toast-msg');
    if (existing) existing.remove();

    const toast = document.createElement('div');
    toast.className = 'toast-msg';
    toast.textContent = msg;
    toast.style.cssText = `
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.85);
      background: #1d1d1f; color: #ffffff; padding: 16px 28px; border-radius: 14px;
      font-size: 15px; font-weight: 500; z-index: 300; opacity: 0;
      transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.32, 0.72, 0, 1);
      pointer-events: none; white-space: nowrap; box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      font-family: inherit; text-align: center;
    `;
    document.body.appendChild(toast);
    requestAnimationFrame(() => {
      toast.style.opacity = '1';
      toast.style.transform = 'translate(-50%, -50%) scale(1)';
    });
    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transform = 'translate(-50%, -50%) scale(0.85)';
      setTimeout(() => toast.remove(), 300);
    }, 2000);
  }

  init();
</script>
</body>
</html>
