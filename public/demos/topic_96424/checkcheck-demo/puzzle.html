<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>图片方块拼图交互</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0;
    margin: 0;
    overflow: hidden;
  }

  /* 隐藏文字元素（嵌入首页时不需要） */
  .header, .controls, .status-bar, .hint { display: none !important; }

  .game-container {
    position: relative;
    background: white;
    border-radius: 20px;
    padding: 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    max-width: 100%;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn {
    padding: 12px 24px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: inherit;
  }

  .btn-primary {
    background: #ff9500;
    color: white;
  }

  .btn-primary:active {
    background: #ff7f00;
    transform: scale(0.96);
  }

  .btn-secondary {
    background: #e8e8ed;
    color: #1d1d1f;
  }

  .btn-secondary:active {
    background: #d1d1d6;
    transform: scale(0.96);
  }

  .game-container {
    position: relative;
    background: white;
    border-radius: 20px;
    padding: 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    max-width: 100%;
    overflow: hidden;
  }

  .puzzle-wrapper {
    position: relative;
    margin: 0 auto;
  }

  .tile {
    position: absolute;
    width: 100px;
    height: 100px;
    background-size: cover;
    background-repeat: no-repeat;
    border-radius: 12px;
    transition: transform 1.2s cubic-bezier(0.34, 0.1, 0.34, 1),
                left 1.2s cubic-bezier(0.34, 0.1, 0.34, 1),
                top 1.2s cubic-bezier(0.34, 0.1, 0.34, 1),
                box-shadow 0.2s ease;
    cursor: pointer;
    will-change: transform, left, top;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15), inset 0 0 0 2px rgba(255, 255, 255, 0.3);
    border: 2px solid rgba(255, 255, 255, 0.5);
  }

  .tile:active {
    transform: scale(0.95);
    transition: transform 0.1s ease;
  }

  .tile.rotated {
    box-shadow: 0 0 0 3px #ff9500, 0 6px 16px rgba(255, 149, 0, 0.45);
    z-index: 10;
    animation: float-rotate 2s ease-in-out infinite;
  }

  .tile.swapped {
    box-shadow: 0 0 0 3px #007aff, 0 6px 16px rgba(0, 122, 255, 0.45);
    z-index: 10;
    animation: float-swap 2s ease-in-out infinite;
    animation-delay: 0.5s;
  }

  .tile.selected {
    box-shadow: 0 0 0 4px #34c759, 0 8px 20px rgba(52, 199, 89, 0.5);
    z-index: 20;
    transform: scale(1.08);
  }

  .tile.rotated.solving {
    animation: rotate-back 2s cubic-bezier(0.34, 0.1, 0.34, 1) forwards,
               rotate-glow 2s ease-in-out;
  }

  @keyframes rotate-back {
    0% {
      transform: rotate(var(--start-rotation)) scale(1);
    }
    15% {
      transform: rotate(var(--start-rotation)) scale(1.25);
    }
    85% {
      transform: rotate(0deg) scale(1.25);
    }
    100% {
      transform: rotate(0deg) scale(1);
    }
  }

  @keyframes rotate-glow {
    0%, 100% {
      box-shadow: 0 0 0 3px #ff9500, 0 6px 16px rgba(255, 149, 0, 0.45);
    }
    50% {
      box-shadow: 0 0 0 8px #ff9500, 0 0 60px rgba(255, 149, 0, 0.8), 0 16px 40px rgba(255, 149, 0, 0.6);
    }
  }

  @keyframes float-rotate {
    0%, 100% { margin-top: 0; }
    50% { margin-top: -5px; }
  }

  @keyframes float-swap {
    0%, 100% { margin-top: 0; }
    50% { margin-top: -5px; }
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  .status-bar {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    width: 100%;
    max-width: 500px;
  }

  .status-item {
    background: white;
    padding: 10px 16px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
  }

  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }

  .status-dot.rotate { background: #ff9500; }
  .status-dot.swap { background: #007aff; }

  .hint {
    text-align: center;
    font-size: 13px;
    color: #86868b;
    padding: 0 16px;
    max-width: 500px;
    line-height: 1.5;
  }

  .hint strong {
    color: #ff9500;
    font-weight: 500;
  }

  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 300px;
    color: #86868b;
    font-size: 15px;
  }

  .spinner {
    width: 30px;
    height: 30px;
    border: 3px solid #e8e8ed;
    border-top-color: #ff9500;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 12px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .success-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .success-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }

  .success-card {
    background: white;
    border-radius: 24px;
    padding: 40px 32px;
    text-align: center;
    max-width: 320px;
    transform: scale(0.8);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .success-overlay.show .success-card {
    transform: scale(1);
  }

  .success-emoji {
    font-size: 64px;
    margin-bottom: 16px;
  }

  .success-card h2 {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .success-card p {
    color: #86868b;
    font-size: 15px;
    margin-bottom: 24px;
  }
</style>
</head>
<body>

<div class="header">
  <h1>图片方块拼图</h1>
  <p>找出异常方块，帮它们回到原位</p>
</div>

<div class="controls">
  <button class="btn btn-primary" onclick="startNewGame()">重新开始</button>
  <button class="btn btn-secondary" onclick="showHint()">提示一下</button>
</div>

<div class="game-container">
  <div id="puzzleWrapper" class="puzzle-wrapper">
    <div class="loading">
      <div class="spinner"></div>
      图片加载中...
    </div>
  </div>
</div>

<div class="status-bar">
  <div class="status-item">
    <div class="status-dot rotate"></div>
    <span>旋转方块</span>
  </div>
  <div class="status-item">
    <div class="status-dot swap"></div>
    <span>交换方块</span>
  </div>
</div>

<p class="hint">
  点击<strong>橙色边框</strong>的方块可以旋转回正<br>
  点击<strong>蓝色边框</strong>的两个方块可以互换回原位
</p>

<div class="success-overlay" id="successOverlay">
  <div class="success-card">
    <div class="success-emoji">🎉</div>
    <h2>打卡完成！</h2>
    <p>拼图成功，今日打卡已记录</p>
  </div>
</div>

<script>
  const TILE_SIZE = 100;
  const TILE_COUNT = 8;
  // Get image from URL param (passed by parent) or fallback to random
  const urlParams = new URLSearchParams(window.location.search);
  const paramImg = urlParams.get('img');
  const IMAGES = [
    'assets/t01_cat.jpg', 'assets/t02_castle.jpg', 'assets/t03_rainbow.jpg',
    'assets/t04_mountain.jpg', 'assets/t05_fruit.jpg', 'assets/t06_space.jpg',
    'assets/t07_ocean.jpg'
  ];
  const IMG_SRC = paramImg || IMAGES[Math.floor(Math.random() * IMAGES.length)];

  let imgElement = null;
  let displayWidth = 0;
  let displayHeight = 0;
  let scale = 1;
  let tiles = [];
  let rotateTileId = -1;
  let swapTileIds = [-1, -1];
  let selectedSwapId = -1;

  function loadImage() {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        imgElement = img;
        resolve(img);
      };
      img.onerror = reject;
      img.src = IMG_SRC;
    });
  }

  async function init() {
    try {
      await loadImage();
      calculateDisplaySize();
      startNewGame();
    } catch (e) {
      console.error('图片加载失败:', e);
      document.getElementById('puzzleWrapper').innerHTML =
        '<div class="loading">图片加载失败，请检查路径</div>';
    }
  }

  function calculateDisplaySize() {
    const maxWidth = Math.min(window.innerWidth - 32, 500);
    scale = maxWidth / imgElement.width;
    displayWidth = maxWidth;
    displayHeight = imgElement.height * scale;
  }

  function startNewGame() {
    if (!imgElement) return;

    calculateDisplaySize();

    const wrapper = document.getElementById('puzzleWrapper');
    wrapper.innerHTML = '';
    wrapper.style.width = displayWidth + 'px';
    wrapper.style.height = displayHeight + 'px';
    wrapper.style.position = 'relative';
    wrapper.style.overflow = 'hidden';
    wrapper.style.borderRadius = '12px';

    const bgImg = document.createElement('div');
    bgImg.style.position = 'absolute';
    bgImg.style.top = '0';
    bgImg.style.left = '0';
    bgImg.style.width = displayWidth + 'px';
    bgImg.style.height = displayHeight + 'px';
    bgImg.style.backgroundImage = `url(${imgElement.src})`;
    bgImg.style.backgroundSize = `${displayWidth}px ${displayHeight}px`;
    bgImg.style.backgroundPosition = '0 0';
    bgImg.style.opacity = '0.85';
    wrapper.appendChild(bgImg);

    tiles = [];
    selectedSwapId = -1;

    const cols = Math.floor(displayWidth / TILE_SIZE);
    const rows = Math.floor(displayHeight / TILE_SIZE);
    const totalPositions = cols * rows;

    const positions = [];
    for (let i = 0; i < totalPositions; i++) {
      positions.push(i);
    }
    shuffleArray(positions);

    const selectedPositions = positions.slice(0, TILE_COUNT);

    selectedPositions.forEach((pos, idx) => {
      const col = pos % cols;
      const row = Math.floor(pos / cols);

      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.style.width = TILE_SIZE + 'px';
      tile.style.height = TILE_SIZE + 'px';
      tile.style.left = (col * TILE_SIZE) + 'px';
      tile.style.top = (row * TILE_SIZE) + 'px';
      tile.style.borderRadius = '4px';

      const srcX = (col * TILE_SIZE) / scale;
      const srcY = (row * TILE_SIZE) / scale;
      const srcSize = TILE_SIZE / scale;

      tile.style.backgroundImage = `url(${imgElement.src})`;
      tile.style.backgroundSize = `${displayWidth}px ${displayHeight}px`;
      tile.style.backgroundPosition = `-${col * TILE_SIZE}px -${row * TILE_SIZE}px`;

      const tileId = idx;
      tile.dataset.id = tileId;
      tile.addEventListener('click', () => handleTileClick(tileId));

      wrapper.appendChild(tile);
      tiles.push({
        id: tileId,
        element: tile,
        gridCol: col,
        gridRow: row,
        originalCol: col,
        originalRow: row,
        rotation: 0,
        isRotated: false,
        isSwapped: false,
        type: 'normal'
      });
    });

    applyRandomChanges();
  }

  let currentGameType = null;

  function applyRandomChanges() {
    if (tiles.length < 2) return;

    const indices = tiles.map((_, i) => i);
    shuffleArray(indices);

    currentGameType = Math.random() < 0.5 ? 'rotate' : 'swap';

    if (currentGameType === 'rotate') {
      rotateTileId = indices[0];
      const rotateDeg = [90, 180, 270][Math.floor(Math.random() * 3)];
      const rotateTile = tiles[rotateTileId];
      rotateTile.rotation = rotateDeg;
      rotateTile.isRotated = true;
      rotateTile.type = 'rotate';
      rotateTile.element.style.transform = `rotate(${rotateDeg}deg)`;
      rotateTile.element.classList.add('rotated');
      updateHint('rotate');
    } else {
      swapTileIds = [indices[0], indices[1]];
      const tileA = tiles[swapTileIds[0]];
      const tileB = tiles[swapTileIds[1]];

      tileA.isSwapped = true;
      tileB.isSwapped = true;
      tileA.type = 'swap';
      tileB.type = 'swap';
      tileA.element.classList.add('swapped');
      tileB.element.classList.add('swapped');

      const tempCol = tileA.gridCol;
      const tempRow = tileA.gridRow;
      tileA.gridCol = tileB.gridCol;
      tileA.gridRow = tileB.gridRow;
      tileB.gridCol = tempCol;
      tileB.gridRow = tempRow;

      const tempLeft = tileA.element.style.left;
      const tempTop = tileA.element.style.top;
      tileA.element.style.transition = 'none';
      tileB.element.style.transition = 'none';
      tileA.element.style.left = tileB.element.style.left;
      tileA.element.style.top = tileB.element.style.top;
      tileB.element.style.left = tempLeft;
      tileB.element.style.top = tempTop;
      tileA.element.offsetHeight;
      tileB.element.offsetHeight;
      tileA.element.style.transition = '';
      tileB.element.style.transition = '';
      updateHint('swap');
    }
  }

  function updateHint(type) {
    const hintEl = document.querySelector('.hint');
    const statusBar = document.querySelector('.status-bar');
    if (type === 'rotate') {
      hintEl.innerHTML = '点击<strong style="color:#ff9500">橙色边框</strong>的方块，帮它旋转回原位';
      statusBar.innerHTML = `
        <div class="status-item">
          <div class="status-dot rotate"></div>
          <span>旋转玩法</span>
        </div>
      `;
    } else {
      hintEl.innerHTML = '依次点击<strong style="color:#007aff">两个蓝色边框</strong>的方块，帮它们换回原位';
      statusBar.innerHTML = `
        <div class="status-item">
          <div class="status-dot swap"></div>
          <span>交换玩法</span>
        </div>
      `;
    }
  }

  function handleTileClick(tileId) {
    const tile = tiles[tileId];

    if (tile.isRotated) {
      rotateTileBack(tileId);
      return;
    }

    if (tile.isSwapped) {
      handleSwapClick(tileId);
      return;
    }
  }

  function rotateTileBack(tileId) {
    const tile = tiles[tileId];
    if (!tile.isRotated) return;

    tile.element.style.setProperty('--start-rotation', tile.rotation + 'deg');
    tile.element.classList.add('solving');

    setTimeout(() => {
      tile.rotation = 0;
      tile.isRotated = false;
      tile.type = 'normal';
      tile.element.classList.remove('rotated', 'solving');
      tile.element.style.transform = 'rotate(0deg)';

      rotateTileId = -1;
      checkWin();
    }, 2000);
  }

  function handleSwapClick(tileId) {
    const tile = tiles[tileId];

    if (selectedSwapId === -1) {
      selectedSwapId = tileId;
      tile.element.classList.add('selected');
    } else if (selectedSwapId === tileId) {
      tile.element.classList.remove('selected');
      selectedSwapId = -1;
    } else {
      const firstTile = tiles[selectedSwapId];
      const secondTile = tile;

      firstTile.element.classList.remove('selected');

      firstTile.element.classList.add('solving');
      secondTile.element.classList.add('solving');

      const tempCol = firstTile.gridCol;
      const tempRow = firstTile.gridRow;
      firstTile.gridCol = secondTile.gridCol;
      firstTile.gridRow = secondTile.gridRow;
      secondTile.gridCol = tempCol;
      secondTile.gridRow = tempRow;

      const tempLeft = firstTile.element.style.left;
      const tempTop = firstTile.element.style.top;
      firstTile.element.style.left = secondTile.element.style.left;
      firstTile.element.style.top = secondTile.element.style.top;
      secondTile.element.style.left = tempLeft;
      secondTile.element.style.top = tempTop;

      setTimeout(() => {
        const id0 = swapTileIds[0];
        const id1 = swapTileIds[1];
        const t0 = tiles[id0];
        const t1 = tiles[id1];

        if (t0.gridCol === t0.originalCol && t0.gridRow === t0.originalRow &&
            t1.gridCol === t1.originalCol && t1.gridRow === t1.originalRow) {
          t0.isSwapped = false;
          t1.isSwapped = false;
          t0.type = 'normal';
          t1.type = 'normal';
          t0.element.classList.remove('swapped', 'solving');
          t1.element.classList.remove('swapped', 'solving');
          swapTileIds = [-1, -1];
        } else {
          firstTile.element.classList.remove('solving');
          secondTile.element.classList.remove('solving');
        }

        selectedSwapId = -1;
        checkWin();
      }, 1200);
    }
  }

  function showHint() {
    if (rotateTileId !== -1) {
      const tile = tiles[rotateTileId];
      tile.element.classList.add('solving');
      setTimeout(() => {
        tile.element.classList.remove('solving');
      }, 600);
    }

    swapTileIds.forEach(id => {
      if (id !== -1 && tiles[id]) {
        tiles[id].element.classList.add('solving');
        setTimeout(() => {
          tiles[id].element.classList.remove('solving');
        }, 600);
      }
    });
  }

  function checkWin() {
    let solved = false;
    if (currentGameType === 'rotate') {
      solved = !tiles.some(t => t.isRotated);
    } else if (currentGameType === 'swap') {
      solved = !tiles.some(t => t.isSwapped);
    }

    if (solved) {
      setTimeout(() => {
        showSuccess();
      }, 500);
    }
  }

  function showSuccess() {
    document.getElementById('successOverlay').classList.add('show');

    // Notify parent page that game is completed
    try {
      window.parent.postMessage({ type: 'puzzle-complete' }, '*');
    } catch(e) {}
  }

  function closeSuccess() {
    document.getElementById('successOverlay').classList.remove('show');
  }

  function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (imgElement) {
        startNewGame();
      }
    }, 300);
  });

  init();
</script>

</body>
</html>
