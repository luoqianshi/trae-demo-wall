<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>子平命理·良缘画像</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ========== 设计令牌 ========== */
  :root{
    --c-vermillion:#B22222;   /* 朱红 */
    --c-rice:#FDF5E6;         /* 米白 */
    --c-ink:#2F1B14;          /* 墨色 */
    --c-amber:#CA9E6E;        /* 琥珀 */
    --c-ink-soft:#5a463a;
    --c-rice-deep:#f3e6cc;
    --c-line:rgba(47,27,20,.18);
    --shadow-card:0 10px 30px rgba(47,27,20,.12), 0 2px 8px rgba(47,27,20,.08);
    --shadow-soft:0 4px 14px rgba(47,27,20,.10);
    --r-card:14px;
    --r-field:8px;
    --font-body:Georgia, "Noto Serif SC", "Songti SC", "SimSun", serif;
    --font-cal:"Ma Shan Zheng", "STKaiti", "KaiTi", serif;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body);
    color:var(--c-ink);
    background-color:var(--c-rice);
    /* 宣纸纹理：多层渐变模拟纤维与做旧斑点 */
    background-image:
      radial-gradient(circle at 12% 18%, rgba(202,158,110,.10) 0 1px, transparent 2px),
      radial-gradient(circle at 78% 32%, rgba(178,34,34,.05) 0 1px, transparent 2px),
      radial-gradient(circle at 35% 72%, rgba(47,27,20,.06) 0 1px, transparent 2px),
      radial-gradient(circle at 88% 85%, rgba(202,158,110,.08) 0 1px, transparent 2px),
      repeating-linear-gradient(90deg, rgba(202,158,110,.04) 0 1px, transparent 1px 6px),
      repeating-linear-gradient(0deg, rgba(47,27,20,.025) 0 1px, transparent 1px 7px),
      linear-gradient(135deg, #FDF5E6 0%, #f7ecd2 50%, #FDF5E6 100%);
    background-attachment:fixed;
    min-height:100vh;
    line-height:1.7;
  }

  /* 页面外层：仿古卷双线边框 */
  .scroll-frame{
    max-width:1080px;
    margin:0 auto;
    padding:36px 28px 80px;
    position:relative;
  }
  .scroll-frame::before{
    content:"";
    position:absolute;
    inset:18px 12px;
    border:1px solid var(--c-amber);
    border-radius:4px;
    pointer-events:none;
    opacity:.55;
  }
  .scroll-frame::after{
    content:"";
    position:absolute;
    inset:22px 16px;
    border:1px solid var(--c-vermillion);
    border-radius:4px;
    pointer-events:none;
    opacity:.28;
  }

  /* ========== 顶部标题区 ========== */
  header.title-area{
    text-align:center;
    padding:28px 16px 22px;
    position:relative;
  }
  .title-area .ornament{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    color:var(--c-amber);
    letter-spacing:.4em;
    font-size:14px;
    margin-bottom:6px;
  }
  .title-area .ornament .line{
    flex:0 0 80px;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--c-amber), transparent);
  }
  .title-area h1{
    font-family:var(--font-cal);
    font-weight:400;
    color:var(--c-vermillion);
    font-size:clamp(34px, 6vw, 56px);
    margin:6px 0 10px;
    letter-spacing:.12em;
    text-shadow:0 2px 0 rgba(178,34,34,.08);
  }
  .title-area .subtitle{
    color:var(--c-ink-soft);
    font-size:14px;
    letter-spacing:.3em;
    margin-top:4px;
  }

  /* 水墨山水装饰：底部远山剪影 */
  .ink-mountains{
    height:60px;
    margin:8px auto 0;
    max-width:520px;
    position:relative;
  }
  .ink-mountains svg{width:100%;height:100%;display:block;}
  /* 朱印 */
  .seal{
    position:absolute;
    top:14px;
    right:8%;
    width:54px;
    height:54px;
    border:2px solid var(--c-vermillion);
    color:var(--c-vermillion);
    font-family:var(--font-cal);
    font-size:14px;
    line-height:1.05;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    border-radius:4px;
    transform:rotate(-6deg);
    opacity:.85;
    background:rgba(253,245,230,.4);
    letter-spacing:.05em;
  }
  .seal span{display:block;}

  /* ========== 表单区 ========== */
  section.form-section{
    margin:30px auto 0;
    max-width:760px;
    background:linear-gradient(180deg, rgba(253,245,230,.92), rgba(247,236,210,.92));
    border:1px solid var(--c-line);
    border-radius:var(--r-card);
    box-shadow:var(--shadow-card);
    padding:28px 28px 24px;
    position:relative;
  }
  .form-section::before{
    /* 卡片左上角小角花 */
    content:"";
    position:absolute;
    top:10px;left:10px;
    width:18px;height:18px;
    border-top:2px solid var(--c-vermillion);
    border-left:2px solid var(--c-vermillion);
    border-top-left-radius:6px;
    opacity:.6;
  }
  .form-section::after{
    content:"";
    position:absolute;
    bottom:10px;right:10px;
    width:18px;height:18px;
    border-bottom:2px solid var(--c-vermillion);
    border-right:2px solid var(--c-vermillion);
    border-bottom-right-radius:6px;
    opacity:.6;
  }

  .section-title{
    font-family:var(--font-cal);
    font-size:24px;
    color:var(--c-ink);
    text-align:center;
    margin:0 0 6px;
    letter-spacing:.18em;
  }
  .section-desc{
    text-align:center;
    color:var(--c-ink-soft);
    font-size:13px;
    letter-spacing:.18em;
    margin-bottom:22px;
  }

  form#birthForm{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:18px 22px;
  }
  .field{
    display:flex;
    flex-direction:column;
  }
  .field.full{grid-column:1 / -1;}
  .field label{
    font-size:13px;
    color:var(--c-ink-soft);
    letter-spacing:.18em;
    margin-bottom:6px;
    position:relative;
    padding-left:12px;
  }
  .field label::before{
    content:"";
    position:absolute;
    left:0;top:50%;
    width:6px;height:6px;
    background:var(--c-vermillion);
    transform:translateY(-50%) rotate(45deg);
  }

  /* 出生时间四联 */
  .datetime-group{
    grid-column:1 / -1;
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:12px;
  }
  .datetime-group .field{grid-column:auto;}
  .datetime-group .field label{padding-left:12px;}

  select, input[type="text"]{
    appearance:none;
    -webkit-appearance:none;
    font-family:var(--font-body);
    font-size:15px;
    color:var(--c-ink);
    background:var(--c-rice);
    border:1px solid var(--c-amber);
    border-radius:var(--r-field);
    padding:11px 12px;
    width:100%;
    transition:border-color .2s, box-shadow .2s;
  }
  select{
    background-image:
      linear-gradient(45deg, transparent 50%, var(--c-vermillion) 50%),
      linear-gradient(135deg, var(--c-vermillion) 50%, transparent 50%);
    background-position:
      calc(100% - 16px) center,
      calc(100% - 11px) center;
    background-size:5px 5px, 5px 5px;
    background-repeat:no-repeat;
    padding-right:28px;
  }
  select:focus, input[type="text"]:focus{
    outline:none;
    border-color:var(--c-vermillion);
    box-shadow:0 0 0 3px rgba(178,34,34,.12);
  }
  input::placeholder{color:rgba(47,27,20,.35);}

  /* 性别单选 */
  .gender-options{
    display:flex;
    gap:14px;
    align-items:center;
    height:43px;
  }
  .gender-options label{
    position:relative;
    padding-left:0;
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
    font-size:15px;
    color:var(--c-ink);
    letter-spacing:.12em;
  }
  .gender-options label::before{display:none;}
  .gender-options input[type="radio"]{
    appearance:none;
    -webkit-appearance:none;
    width:18px;height:18px;
    border:1.5px solid var(--c-amber);
    border-radius:50%;
    background:var(--c-rice);
    position:relative;
    cursor:pointer;
    margin:0;
  }
  .gender-options input[type="radio"]:checked{
    border-color:var(--c-vermillion);
  }
  .gender-options input[type="radio"]:checked::after{
    content:"";
    position:absolute;
    inset:3px;
    border-radius:50%;
    background:var(--c-vermillion);
  }

  /* 提交按钮 */
  .submit-row{
    grid-column:1 / -1;
    display:flex;
    justify-content:center;
    margin-top:8px;
  }
  button#castBtn{
    font-family:var(--font-cal);
    font-size:22px;
    letter-spacing:.3em;
    color:var(--c-rice);
    background:linear-gradient(180deg, #c9292a 0%, var(--c-vermillion) 100%);
    border:none;
    border-radius:var(--r-field);
    padding:13px 48px 13px 56px;
    cursor:pointer;
    box-shadow:0 6px 16px rgba(178,34,34,.28), inset 0 0 0 1px rgba(253,245,230,.25);
    transition:transform .15s, box-shadow .15s, filter .15s;
    position:relative;
  }
  button#castBtn:hover{
    transform:translateY(-1px);
    filter:brightness(1.04);
    box-shadow:0 9px 22px rgba(178,34,34,.34), inset 0 0 0 1px rgba(253,245,230,.35);
  }
  button#castBtn:active{transform:translateY(0);}
  button#castBtn::before, button#castBtn::after{
    content:"";
    position:absolute;
    top:50%;
    width:10px;height:10px;
    border:1px solid rgba(253,245,230,.6);
    transform:translateY(-50%) rotate(45deg);
  }
  button#castBtn::before{left:14px;}
  button#castBtn::after{right:14px;}

  /* ========== 结果展示区 ========== */
  section.result-section{
    margin-top:40px;
  }
  .result-header{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    margin-bottom:22px;
    color:var(--c-ink-soft);
  }
  .result-header .line{
    flex:0 0 60px;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--c-amber), transparent);
  }
  .result-header h2{
    font-family:var(--font-cal);
    font-weight:400;
    font-size:26px;
    color:var(--c-ink);
    margin:0;
    letter-spacing:.2em;
  }

  #resultArea{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:22px;
  }

  .result-card{
    background:
      radial-gradient(circle at 90% 8%, rgba(202,158,110,.12) 0 2px, transparent 3px),
      linear-gradient(180deg, rgba(253,245,230,.96), rgba(248,238,215,.96));
    border:1px solid var(--c-line);
    border-radius:var(--r-card);
    box-shadow:var(--shadow-card);
    padding:24px 22px 22px;
    position:relative;
    min-height:180px;
    overflow:hidden;
    transition:transform .2s, box-shadow .2s;
  }
  .result-card:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 34px rgba(47,27,20,.15), 0 3px 10px rgba(47,27,20,.10);
  }
  /* 卡片右上角小印 */
  .result-card .card-seal{
    position:absolute;
    top:14px;right:14px;
    width:34px;height:34px;
    border:1.5px solid var(--c-vermillion);
    color:var(--c-vermillion);
    font-family:var(--font-cal);
    font-size:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:3px;
    transform:rotate(-4deg);
    opacity:.7;
    letter-spacing:.02em;
    text-align:center;
    line-height:1.05;
  }
  .result-card .card-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
    padding-bottom:12px;
    border-bottom:1px dashed var(--c-amber);
  }
  .result-card .card-num{
    font-family:var(--font-cal);
    color:var(--c-rice);
    background:var(--c-vermillion);
    width:30px;height:30px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
    flex:0 0 30px;
  }
  .result-card .card-title{
    font-family:var(--font-cal);
    font-size:22px;
    color:var(--c-ink);
    letter-spacing:.16em;
    margin:0;
  }
  .result-card .card-body{
    color:var(--c-ink-soft);
    font-size:14px;
    min-height:80px;
  }
  .result-card .placeholder{
    color:rgba(47,27,20,.4);
    font-style:italic;
    letter-spacing:.1em;
    font-size:13px;
  }

  /* 第四张卡：两个子项 */
  .result-card.card-meeting .card-body{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .sub-item{
    background:rgba(253,245,230,.6);
    border:1px solid var(--c-line);
    border-radius:8px;
    padding:12px;
  }
  .sub-item .sub-label{
    font-size:12px;
    color:var(--c-vermillion);
    letter-spacing:.2em;
    margin-bottom:6px;
  }
  .sub-item .sub-content{
    font-size:13px;
    color:var(--c-ink-soft);
    min-height:40px;
  }

  /* 页脚 */
  footer.page-footer{
    text-align:center;
    margin-top:50px;
    color:var(--c-ink-soft);
    font-size:12px;
    letter-spacing:.3em;
    opacity:.75;
  }
  footer.page-footer .divider{
    display:block;
    width:60px;
    height:1px;
    margin:10px auto;
    background:var(--c-amber);
    opacity:.6;
  }

  /* ========== 响应式 ========== */
  @media (max-width:720px){
    .scroll-frame{padding:24px 14px 60px;}
    .scroll-frame::before{inset:12px 8px;}
    .scroll-frame::after{inset:16px 12px;}
    .seal{width:46px;height:46px;font-size:12px;top:10px;right:6%;}
    form#birthForm{grid-template-columns:1fr;}
    .datetime-group{grid-template-columns:repeat(2, 1fr);}
    #resultArea{grid-template-columns:1fr;}
    .title-area h1{letter-spacing:.08em;}
    button#castBtn{font-size:20px;padding:12px 38px 12px 46px;}
    .result-card.card-meeting .card-body{grid-template-columns:1fr;}
  }

  @media (max-width:380px){
    .datetime-group{grid-template-columns:1fr 1fr;}
    .title-area .ornament .line{flex-basis:40px;}
  }

  /* ========== 轻提示 Toast ========== */
  #toast{
    position:fixed;
    top:24px;
    left:50%;
    transform:translateX(-50%) translateY(-30px);
    background:linear-gradient(180deg, #c9292a 0%, var(--c-vermillion) 100%);
    color:var(--c-rice);
    padding:12px 26px;
    border-radius:8px;
    font-family:var(--font-cal);
    font-size:16px;
    letter-spacing:.16em;
    box-shadow:0 8px 24px rgba(178,34,34,.35), inset 0 0 0 1px rgba(253,245,230,.3);
    opacity:0;
    pointer-events:none;
    transition:opacity .3s, transform .3s;
    z-index:9999;
    max-width:90vw;
    text-align:center;
  }
  #toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
</style>
</head>
<body>
  <div class="scroll-frame">

    <!-- ========== 顶部标题区 ========== -->
    <header class="title-area">
      <div class="seal" aria-hidden="true">
        <span>子</span><span>平</span>
      </div>
      <div class="ornament">
        <span class="line"></span>
        <span>天 命 有 常　缘 起 有 时</span>
        <span class="line"></span>
      </div>
      <h1>子平命理 · 良缘画像</h1>
      <div class="subtitle">四 柱 推 演　画 中 见 缘</div>

      <!-- 水墨远山装饰 -->
      <div class="ink-mountains" aria-hidden="true">
        <svg viewBox="0 0 520 60" preserveAspectRatio="none">
          <defs>
            <linearGradient id="ink1" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stop-color="#2F1B14" stop-opacity="0.55"/>
              <stop offset="100%" stop-color="#2F1B14" stop-opacity="0.05"/>
            </linearGradient>
            <linearGradient id="ink2" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stop-color="#5a463a" stop-opacity="0.45"/>
              <stop offset="100%" stop-color="#5a463a" stop-opacity="0.04"/>
            </linearGradient>
          </defs>
          <path d="M0,60 L0,38 Q40,20 80,32 T160,28 Q200,12 240,30 T340,26 Q380,14 420,32 T520,30 L520,60 Z" fill="url(#ink2)"/>
          <path d="M0,60 L0,48 Q50,34 100,42 T200,40 Q240,28 290,42 T400,40 Q440,30 480,44 T520,42 L520,60 Z" fill="url(#ink1)"/>
        </svg>
      </div>
    </header>

    <!-- ========== 表单区 ========== -->
    <section class="form-section">
      <h2 class="section-title">填 录 生 辰</h2>
      <p class="section-desc">— 谨 依 公 历 输 入 ， 时 辰 以 地 支 计 —</p>

      <form id="birthForm" autocomplete="off">

        <!-- 出生时间：年 月 日 时 -->
        <div class="datetime-group">
          <div class="field">
            <label for="birthYear">出生年</label>
            <select id="birthYear" name="birthYear">
              <option value="" selected disabled>选择年份</option>
            </select>
          </div>
          <div class="field">
            <label for="birthMonth">出生月</label>
            <select id="birthMonth" name="birthMonth">
              <option value="" selected disabled>选择月份</option>
            </select>
          </div>
          <div class="field">
            <label for="birthDay">出生日</label>
            <select id="birthDay" name="birthDay">
              <option value="" selected disabled>选择日期</option>
            </select>
          </div>
          <div class="field">
            <label for="birthHour">出生时辰</label>
            <select id="birthHour" name="birthHour">
              <option value="" selected disabled>选择时辰</option>
              <option value="zi">子时 (23:00–01:00)</option>
              <option value="chou">丑时 (01:00–03:00)</option>
              <option value="yin">寅时 (03:00–05:00)</option>
              <option value="mao">卯时 (05:00–07:00)</option>
              <option value="chen">辰时 (07:00–09:00)</option>
              <option value="si">巳时 (09:00–11:00)</option>
              <option value="wu">午时 (11:00–13:00)</option>
              <option value="wei">未时 (13:00–15:00)</option>
              <option value="shen">申时 (15:00–17:00)</option>
              <option value="you">酉时 (17:00–19:00)</option>
              <option value="xu">戌时 (19:00–21:00)</option>
              <option value="hai">亥时 (21:00–23:00)</option>
            </select>
          </div>
        </div>

        <!-- 出生城市 -->
        <div class="field full">
          <label for="birthCity">出生城市</label>
          <input type="text" id="birthCity" name="birthCity" placeholder="如：杭州（用于真太阳时修正，暂未启用）">
        </div>

        <!-- 性别 -->
        <div class="field">
          <label>性别</label>
          <div class="gender-options">
            <label><input type="radio" name="gender" value="male">乾造 · 男</label>
            <label><input type="radio" name="gender" value="female">坤造 · 女</label>
          </div>
        </div>

        <!-- 按钮 -->
        <div class="submit-row">
          <button type="submit" id="castBtn">推演命盘</button>
        </div>
      </form>
    </section>

    <!-- ========== 结果展示区 ========== -->
    <section class="result-section">
      <div class="result-header">
        <span class="line"></span>
        <h2>命 盘 画 像</h2>
        <span class="line"></span>
      </div>

      <div id="resultArea">

        <!-- 卡片1：相貌画像 -->
        <article class="result-card" id="cardAppearance">
          <div class="card-seal" aria-hidden="true">相</div>
          <div class="card-head">
            <span class="card-num">一</span>
            <h3 class="card-title">相貌画像</h3>
          </div>
          <div class="card-body">
            <p class="placeholder">— 待推演后，于此显现形貌气韵 —</p>
          </div>
        </article>

        <!-- 卡片2：性格画像 -->
        <article class="result-card" id="cardPersonality">
          <div class="card-seal" aria-hidden="true">性</div>
          <div class="card-head">
            <span class="card-num">二</span>
            <h3 class="card-title">性格画像</h3>
          </div>
          <div class="card-body">
            <p class="placeholder">— 待推演后，于此显现心性禀赋 —</p>
          </div>
        </article>

        <!-- 卡片3：职业画像 -->
        <article class="result-card" id="cardCareer">
          <div class="card-seal" aria-hidden="true">业</div>
          <div class="card-head">
            <span class="card-num">三</span>
            <h3 class="card-title">职业画像</h3>
          </div>
          <div class="card-body">
            <p class="placeholder">— 待推演后，于此显现事业取向 —</p>
          </div>
        </article>

        <!-- 卡片4：相遇方位与时间 -->
        <article class="result-card card-meeting" id="cardMeeting">

  <!-- 轻提示容器 -->
  <div id="toast"></div>

  <!-- ========== lunar-javascript 库 ========== -->
  <script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.13/lunar.min.js"></script>
  <script>
  /* =========================================================
   *  子平命理 · 八字推演核心脚本
   *  依赖：lunar-javascript (暴露全局 Solar / Lunar / EightChar)
   *  绑定：页面底部表单 #birthForm 提交事件
   * ======================================================= */

  /* ---------- 常量表 ---------- */

  // 天干 → 五行
  const GAN_WUXING = {
    '甲':'木','乙':'木','丙':'火','丁':'火','戊':'土',
    '己':'土','庚':'金','辛':'金','壬':'水','癸':'水'
  };

  // 天干阴阳
  const GAN_YINYANG = {
    '甲':'阳','乙':'阴','丙':'阳','丁':'阴','戊':'阳',
    '己':'阴','庚':'阳','辛':'阴','壬':'阳','癸':'阴'
  };

  // 地支本气五行（用于月令旺衰粗判）
  const ZHI_MAIN_QI = {
    '子':'水','丑':'土','寅':'木','卯':'木','辰':'土','巳':'火',
    '午':'火','未':'土','申':'金','酉':'金','戌':'土','亥':'水'
  };

  // 时辰代码 → 小时（取该时辰中点近似，用于 Lunar.fromYmdHms）
  const HOUR_CODE_TO_HOUR = {
    'zi':0, 'chou':2, 'yin':4, 'mao':6, 'chen':8, 'si':10,
    'wu':12,'wei':14,'shen':16,'you':18,'xu':20, 'hai':22
  };

  // 五行生克关系（以日主五行为键）
  // 印(生我) / 食伤(我生) / 官杀(克我) / 财(我克) / 比劫(同我)
  const WUXING_RELATIONS = {
    '木': { '印':'水', '食伤':'火', '官杀':'金', '财':'土', '比劫':'木' },
    '火': { '印':'木', '食伤':'土', '官杀':'水', '财':'金', '比劫':'火' },
    '土': { '印':'火', '食伤':'金', '官杀':'木', '财':'水', '比劫':'土' },
    '金': { '印':'土', '食伤':'水', '官杀':'火', '财':'木', '比劫':'金' },
    '水': { '印':'金', '食伤':'木', '官杀':'土', '财':'火', '比劫':'水' }
  };

  /* ---------- 通用：轻提示 Toast ---------- */
  let _toastTimer = null;
  function showToast(msg, duration = 2600) {
    const el = document.getElementById('toast');
    if (!el) { alert(msg); return; }
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => el.classList.remove('show'), duration);
  }

  /* ---------- 辅助函数 ---------- */

  /**
   * 日主旺衰粗判（仅基于月令本气）
   * @param {string} dayMasterWX  日主五行（木/火/土/金/水）
   * @param {string} monthZhiWX   月支本气五行
   * @returns {{relation:string, support:string, level:string, desc:string}}
   */
  function analyzeDayMasterStrength(dayMasterWX, monthZhiWX) {
    if (dayMasterWX === monthZhiWX) {
      return { relation:'比劫', support:'生扶', level:'得令',
               desc:'月令本气与日主同类，日主得令而旺' };
    }
    const r = WUXING_RELATIONS[dayMasterWX];
    if (monthZhiWX === r['印']) {
      return { relation:'印星', support:'生扶', level:'得令',
               desc:'月令本气生扶日主，日主得令而旺' };
    }
    if (monthZhiWX === r['食伤']) {
      return { relation:'食伤', support:'泄气', level:'失令',
               desc:'月令本气为日主所生，日主泄气而衰' };
    }
    if (monthZhiWX === r['财']) {
      return { relation:'财星', support:'耗', level:'失令',
               desc:'月令本气为日主所克，日主耗气而衰' };
    }
    if (monthZhiWX === r['官杀']) {
      return { relation:'官杀', support:'克制', level:'失令',
               desc:'月令本气克伐日主，日主受制而衰' };
    }
    return { relation:'未知', support:'未知', level:'未知', desc:'' };
  }

  /* ---------- 核心函数 ---------- */

  /**
   * 读取表单输入，调用 lunar-javascript 推演八字
   * 返回结构化八字数据对象，并写入 window.baZiData
   * @returns {object|null}
   */
  function getBaZi() {
    // 1) 读取并校验表单
    const year  = parseInt(document.getElementById('birthYear').value, 10);
    const month = parseInt(document.getElementById('birthMonth').value, 10);
    const day   = parseInt(document.getElementById('birthDay').value, 10);
    const hourCode = document.getElementById('birthHour').value;
    const city  = document.getElementById('birthCity').value.trim();

    let gender = null;
    document.getElementsByName('gender').forEach(el => {
      if (el.checked) gender = el.value;
    });

    if (!year || !month || !day || !hourCode) {
      showToast('请补全出生年月日时辰');
      console.warn('[getBaZi] 出生日期时间不完整');
      return null;
    }
    if (!gender) {
      showToast('请选择性别（乾造 / 坤造）');
      console.warn('[getBaZi] 请选择性别');
      return null;
    }

    const hour = HOUR_CODE_TO_HOUR[hourCode];

    // 2) 构建 Solar → Lunar 对象（公历输入），包裹错误处理
    let solar, lunar, eb;
    try {
      if (typeof Solar === 'undefined') {
        throw new Error('lunar-javascript 库未加载');
      }
      solar = Solar.fromYmdHms(year, month, day, hour, 30, 0);
      lunar = solar.getLunar();
      eb    = lunar.getEightChar(); // EightChar 对象
    } catch (err) {
      showToast('命盘解析受阻，请检查日期是否有效');
      console.error('[getBaZi] lunar 库解析失败:', err);
      return null;
    }

    // 3) 四柱干支
    const yearGZ  = eb.getYear();
    const monthGZ = eb.getMonth();
    const dayGZ   = eb.getDay();
    const timeGZ  = eb.getTime();

    // 各柱天干 / 地支
    const yearGan  = eb.getYearGan(),  yearZhi  = eb.getYearZhi();
    const monthGan = eb.getMonthGan(), monthZhi = eb.getMonthZhi();
    const dayGan   = eb.getDayGan(),   dayZhi   = eb.getDayZhi();  // 日主 / 夫妻宫
    const timeGan  = eb.getTimeGan(),  timeZhi  = eb.getTimeZhi();

    // 藏干（数组）
    const yearHide  = eb.getYearHideGan();
    const monthHide = eb.getMonthHideGan();
    const dayHide   = eb.getDayHideGan();
    const timeHide  = eb.getTimeHideGan();

    // 十神（天干）
    const yearSSG  = eb.getYearShiShenGan();
    const monthSSG = eb.getMonthShiShenGan();
    const timeSSG  = eb.getTimeShiShenGan();

    // 4) 日主五行
    const dayMasterGan = dayGan;
    const dayMasterWX  = GAN_WUXING[dayMasterGan];

    // 5) 月令旺衰（粗判：看月支本气与日主的关系）
    const monthZhiMainQi = ZHI_MAIN_QI[monthZhi];
    const strength = analyzeDayMasterStrength(dayMasterWX, monthZhiMainQi);

    // 6) 配偶星
    //    男命 → 财星（我克者）
    //    女命 → 官杀（克我者）
    const relations       = WUXING_RELATIONS[dayMasterWX];
    const spouseStarType  = (gender === 'male') ? '财星' : '官杀';
    const spouseStarWX    = (gender === 'male') ? relations['财'] : relations['官杀'];

    // 在四柱天干（除日干外）中查找配偶星
    const stemPositions = [
      { stem: yearGan,  pillar: '年柱', shiShen: yearSSG },
      { stem: monthGan, pillar: '月柱', shiShen: monthSSG },
      { stem: timeGan,  pillar: '时柱', shiShen: timeSSG }
    ];
    const spouseStarInStems = stemPositions
      .filter(s => GAN_WUXING[s.stem] === spouseStarWX);

    // 在四柱地支藏干中查找配偶星
    const zhiPositions = [
      { zhi: yearZhi,  hide: yearHide,  pillar: '年柱' },
      { zhi: monthZhi, hide: monthHide, pillar: '月柱' },
      { zhi: dayZhi,   hide: dayHide,   pillar: '日柱(夫妻宫)' },
      { zhi: timeZhi,  hide: timeHide,  pillar: '时柱' }
    ];
    const spouseStarInZhis = zhiPositions
      .filter(z => z.hide.some(h => GAN_WUXING[h] === spouseStarWX))
      .map(z => ({
        pillar: z.pillar,
        zhi: z.zhi,
        hide: z.hide.filter(h => GAN_WUXING[h] === spouseStarWX)
      }));

    // 7) 大运
    //    lunar-javascript: eb.getYun(gender)  gender = 1 男, 0 女
    const yunGender = (gender === 'male') ? 1 : 0;
    const yun = eb.getYun(yunGender);
    const daYunStartYear  = yun.getStartYear();   // 起运岁数
    const daYunStartMonth = yun.getStartMonth();
    const daYunStartDay   = yun.getStartDay();

    const daYunList = yun.getDaYun().map((dy, i) => ({
      index: i,
      ganZhi: dy.getGanZhi(),
      startAge: dy.getStartAge(),
      startYear: dy.getStartYear()
    }));

    // 8) 当前流年（参数化，默认 2026）
    const currentYear = 2026;
    const currentSolar = Solar.fromYmdHms(currentYear, 6, 15, 12, 0, 0);
    const currentLunar = currentSolar.getLunar();
    const currentYearGZ = currentLunar.getYearInGanZhi();

    // 9) 组装结果
    const baZiData = {
      input: { year, month, day, hourCode, hour, city, gender },
      solarStr: `${year}-${month}-${day} ${hour}:30`,
      lunarStr: lunar.toString(),
      bazi: {
        year: yearGZ, month: monthGZ, day: dayGZ, time: timeGZ,
        full: `${yearGZ} ${monthGZ} ${dayGZ} ${timeGZ}`
      },
      pillars: {
        year:  { ganZhi: yearGZ,  gan: yearGan,  zhi: yearZhi,  hide: yearHide,  shiShenGan: yearSSG },
        month: { ganZhi: monthGZ, gan: monthGan, zhi: monthZhi, hide: monthHide, shiShenGan: monthSSG },
        day:   { ganZhi: dayGZ,   gan: dayGan,   zhi: dayZhi,   hide: dayHide,   shiShenGan: '日主' },
        time:  { ganZhi: timeGZ,  gan: timeGan,  zhi: timeZhi,  hide: timeHide,  shiShenGan: timeSSG }
      },
      dayMaster: {
        gan: dayMasterGan,
        wuxing: dayMasterWX,
        yinYang: GAN_YINYANG[dayMasterGan]
      },
      spousePalace: dayZhi, // 日支
      spouseStar: {
        type: spouseStarType,
        wuxing: spouseStarWX,
        inStems: spouseStarInStems,
        inZhi: spouseStarInZhis
      },
      strength: strength,
      daYun: {
        startAge: daYunStartYear,
        startMonth: daYunStartMonth,
        startDay: daYunStartDay,
        list: daYunList
      },
      currentYear: { year: currentYear, ganZhi: currentYearGZ }
    };

    // 全局暴露，供后续渲染步骤使用
    window.baZiData = baZiData;

    /* ===== 测试用 console.log 输出 ===== */
    console.group('%c【八字推演结果】', 'color:#B22222;font-weight:bold;font-size:14px');
    console.log('输入(公历):', baZiData.solarStr,
                ' 性别:', gender, ' 城市:', city || '(未填)');
    console.log('农历:', lunar.toString());
    console.log('四柱:', baZiData.bazi.full);
    console.table({
      '年柱': `${yearGZ}  干:${yearGan}  支:${yearZhi}  藏:[${yearHide.join(',')}]  十神:${yearSSG}`,
      '月柱': `${monthGZ}  干:${monthGan}  支:${monthZhi}  藏:[${monthHide.join(',')}]  十神:${monthSSG}`,
      '日柱': `${dayGZ}  干:${dayGan}(日主)  支:${dayZhi}(夫妻宫)  藏:[${dayHide.join(',')}]`,
      '时柱': `${timeGZ}  干:${timeGan}  支:${timeZhi}  藏:[${timeHide.join(',')}]  十神:${timeSSG}`
    });
    console.log('日主天干:', dayMasterGan,
                '五行:', dayMasterWX,
                '(' + GAN_YINYANG[dayMasterGan] + ')');
    console.log('月令本气:', monthZhi, '→', monthZhiMainQi,
                ' 旺衰判定:', strength);
    console.log(`配偶星[${spouseStarType}] 五行: ${spouseStarWX}`);
    console.log('  天干透出:', spouseStarInStems.length
                ? spouseStarInStems.map(s => `${s.pillar}:${s.stem}(${s.shiShen})`).join('  ')
                : '无');
    console.log('  地支藏干:', spouseStarInZhis.length
                ? spouseStarInZhis.map(z => `${z.pillar}:${z.zhi}[${z.hide.join(',')}]`).join('  ')
                : '无');
    console.log(`起运: ${daYunStartYear}岁 ${daYunStartMonth}个月 ${daYunStartDay}天`);
    console.table(daYunList);
    console.log(`${currentYear}流年干支:`, currentYearGZ);
    console.log('完整数据对象 baZiData:', baZiData);
    console.groupEnd();

    return baZiData;
  }

   *  第3步：画像生成函数 generatePortrait(baZiData)

   *  逻辑独立，可单独测试：generatePortrait(window.baZiData)

  const ZHI_CLASH = {
    '子':'午','午':'子','丑':'未','未':'丑','寅':'申','申':'寅',
    '卯':'酉','酉':'卯','辰':'戌','戌':'辰','巳':'亥','亥':'巳'

  // 地支六合
  const ZHI_COMBINE = {
    '子':'丑','丑':'子','寅':'亥','亥':'寅','卯':'戌','戌':'卯',
    '辰':'酉','酉':'辰','巳':'申','申':'巳','午':'未','未':'午'
  };

  /**
   * 十神判定（以日主天干为本，对比目标天干）
   * @returns {string} 正官/七杀/正印/偏印/比肩/劫财/食神/伤官/正财/偏财
   */
  function computeShiShen(dayMasterGan, targetGan) {
    const dmWX = GAN_WUXING[dayMasterGan];
    const dmYY = GAN_YINYANG[dayMasterGan];
    const tWX  = GAN_WUXING[targetGan];
    const tYY  = GAN_YINYANG[targetGan];
    const sameYY = (dmYY === tYY);

    if (dmWX === tWX) return sameYY ? '比肩' : '劫财';
    const r = WUXING_RELATIONS[dmWX];
    if (tWX === r['印'])     return sameYY ? '偏印' : '正印';
    if (tWX === r['食伤'])   return sameYY ? '食神' : '伤官';
    if (tWX === r['财'])     return sameYY ? '偏财' : '正财';
    if (tWX === r['官杀'])   return sameYY ? '七杀' : '正官';
    return '未知';
  }

  /* ---------- 主函数：generatePortrait ---------- */

  /**
   * 生成四段画像 HTML 字符串
   * @param {object} baZiData  第2步 getBaZi() 返回的数据对象
   * @returns {{face:string, character:string, career:string, meet:string}|null}
   */
  function generatePortrait(baZiData) {
    if (!baZiData) {
      console.warn('[generatePortrait] baZiData 为空');
      return null;
    }

    const d = baZiData;
    const dayGan         = d.pillars.day.gan;
    const dayZhi         = d.pillars.day.zhi;
    const dayMasterWX    = d.dayMaster.wuxing;
    const gender         = d.input.gender;
    const spouseStarWX   = d.spouseStar.wuxing;
    const spouseStarType = d.spouseStar.type;   // '财星' or '官杀'
    const monthZhi       = d.pillars.month.zhi;

    // 1. 相貌
    const face = generateFace(dayZhi, spouseStarWX);

    // 2. 性格
    const character = generateCharacter(d, dayGan, dayZhi, spouseStarWX, spouseStarType);

    // 3. 职业
    const career = generateCareer(d, spouseStarWX, dayGan, dayZhi);

    // 4. 相遇方位
    const meetDirection = generateMeetDirection(monthZhi, dayZhi);

    // 5. 相遇时间
    const meetTime = generateMeetTime(d, dayZhi, spouseStarWX);

    const portrait = {
      face:      face,
      character: character,
      career:    career,
      meet:      `<p>${meetDirection}</p><p>${meetTime}</p>`
    };

    /* ===== 测试用 console.log 输出 ===== */
    console.group('%c【画像生成结果】', 'color:#CA9E6E;font-weight:bold;font-size:14px');
    console.log('相貌画像:\n', portrait.face.replace(/<[^>]+>/g,''));
    console.log('性格画像:\n', portrait.character.replace(/<[^>]+>/g,''));
    console.log('职业画像:\n', portrait.career.replace(/<[^>]+>/g,''));
    console.log('相遇方位+时间:\n', portrait.meet.replace(/<[^>]+>/g,''));
    console.log('原始对象:', portrait);
    console.groupEnd();

    return portrait;
  }

  /* ---------- 子函数：相貌 ---------- */
  function generateFace(dayZhi, spouseStarWX) {
    const peachBlossom = ['子','午','卯','酉'];
    const growth       = ['寅','申','巳','亥'];

    let baseDesc;
    if (peachBlossom.includes(dayZhi)) {
      baseDesc = FACE_DAYZHI_DESC.peachBlossom;
    } else if (growth.includes(dayZhi)) {
      baseDesc = FACE_DAYZHI_DESC.growth;
    } else {
      baseDesc = FACE_DAYZHI_DESC.tomb;
    }

    const wxDetail = FACE_WUXING_DETAIL[spouseStarWX] || '';
    const wxColor = ({'金':'#999','木':'#5a7a3a','水':'#3a5a7a','火':'#B22222','土':'#8a6a3a'})[spouseStarWX] || '#B22222';

    return `<p>${baseDesc}</p><p>配偶星属<strong style="color:${wxColor}">${spouseStarWX}</strong>行，主相貌细节：${wxDetail}</p>`;
  }

  /* ---------- 子函数：性格 ---------- */
  function generateCharacter(baZiData, dayGan, dayZhi, spouseStarWX, spouseStarType) {
    // 日支十神：以日支本气藏干推算
    const dayZhiMainQiGan = ZHI_MAIN_QI_GAN[dayZhi];
    const dayZhiSS = computeShiShen(dayGan, dayZhiMainQiGan);

    // 配偶星十神：查找透干或藏干中最优先者
    const spouseStarSS = determineSpouseStarShiShen(baZiData, spouseStarWX, spouseStarType);

    const core     = DAYZHI_SHISHEN_CORE[dayZhiSS] || '';
    const emotion  = SPOUSE_STAR_SHISHEN_EMOTION[spouseStarSS] || '';

    return `<p><strong style="color:#B22222">日支${dayZhiSS}</strong>：${core}</p><p><strong style="color:#B22222">配偶星${spouseStarSS}</strong>：${emotion}</p>`;
  }

  /**
   * 判定配偶星十神（正/偏）
   * 优先级：月透 > 年透 > 时透 > 日支藏 > 月支藏 > 年支藏 > 时支藏
   * 若全无配偶星，按默认正星推断
   */
  function determineSpouseStarShiShen(baZiData, spouseStarWX, spouseStarType) {
    const dayGan = baZiData.pillars.day.gan;
    const dayYY  = GAN_YINYANG[dayGan];

    const candidates = [];

    ['month','year','time'].forEach(pillar => {
      const stem = baZiData.pillars[pillar].gan;
      if (GAN_WUXING[stem] === spouseStarWX) {
        const priority = (pillar === 'month') ? 1 : (pillar === 'year' ? 2 : 3);
        candidates.push({ stem, priority });
      }
    });

    ['day','month','year','time'].forEach(pillar => {
      const hide = baZiData.pillars[pillar].hide;
      hide.forEach((h, i) => {
        if (GAN_WUXING[h] === spouseStarWX) {
          const priority = (pillar === 'day' ? 4 : 5) + i * 0.1;
          candidates.push({ stem: h, priority });
        }
      });
    });

    if (candidates.length === 0) {
      return spouseStarType === '财星' ? '正财' : '正官';
    }

    candidates.sort((a, b) => a.priority - b.priority);
    const best = candidates[0];
    const bestYY = GAN_YINYANG[best.stem];
    const sameYY = (dayYY === bestYY);

    if (spouseStarType === '财星') {
      return sameYY ? '偏财' : '正财';
    } else {
      return sameYY ? '七杀' : '正官';
    }
  }

  /* ---------- 子函数：职业 ---------- */
  function generateCareer(baZiData, spouseStarWX, dayGan, dayZhi) {
    const industry = SPOUSE_STAR_WX_INDUSTRY[spouseStarWX] || '各类行业';

    // 单位性质：取配偶星所在宫位（优先透干宫位，月>年>时；其次藏干，日>月>年>时）
    let palaceKey = 'month'; // 默认
    const palacePriority = { '月柱':1, '年柱':2, '时柱':3, '日柱':4, '日柱(夫妻宫)':4 };

    if (baZiData.spouseStar.inStems && baZiData.spouseStar.inStems.length > 0) {
      const sorted = [...baZiData.spouseStar.inStems].sort(
        (a, b) => (palacePriority[a.pillar] || 9) - (palacePriority[b.pillar] || 9)
      );
      palaceKey = sorted[0].pillar.replace('柱','');
    } else if (baZiData.spouseStar.inZhi && baZiData.spouseStar.inZhi.length > 0) {
      const sorted = [...baZiData.spouseStar.inZhi].sort(
        (a, b) => (palacePriority[a.pillar] || 9) - (palacePriority[b.pillar] || 9)
      );
      palaceKey = sorted[0].pillar.replace('柱','').replace('(夫妻宫)','');
    }

    const palaceMap = { '年':'year','月':'month','日':'day','时':'time' };
    const nature = SPOUSE_STAR_PALACE_NATURE[palaceMap[palaceKey]] || SPOUSE_STAR_PALACE_NATURE['month'];

    // 十神组合 → 职位风格
    const dayZhiMainQiGan = ZHI_MAIN_QI_GAN[dayZhi];
    const dayZhiSS = computeShiShen(dayGan, dayZhiMainQiGan);

    let comboKey = 'default';
    if (['正官','七杀'].includes(dayZhiSS))       comboKey = '官印相生';
    else if (['食神','伤官'].includes(dayZhiSS))  comboKey = '食伤生财';
    else if (['正财','偏财'].includes(dayZhiSS))  comboKey = '财官相生';
    else if (['比肩','劫财'].includes(dayZhiSS))  comboKey = '比劫夺财';
    else if (['正印','偏印'].includes(dayZhiSS))  comboKey = '印星化杀';

    const positionDesc = SHISHEN_COMBO_CAREER[comboKey] || SHISHEN_COMBO_CAREER['default'];

    return `<p>配偶星属<strong style="color:#B22222">${spouseStarWX}</strong>行，主行业：<br>${industry}。</p><p>配偶星现于<strong style="color:#B22222">${palaceKey}柱</strong>，主单位：<br>${nature}。</p><p>日支十神${dayZhiSS}，${positionDesc}。</p>`;
  }

  /* ---------- 子函数：相遇方位（月日起卦 + 夫妻宫对冲修正） ---------- */
  function generateMeetDirection(monthZhi, dayZhi) {
    const ZHI_ORDER = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];

    const mIdx = ZHI_ORDER.indexOf(monthZhi);
    const dIdx = ZHI_ORDER.indexOf(dayZhi);
    const steps = ((dIdx - mIdx) + 12) % 12;

    const mainDir      = ZHI_DIRECTION[dayZhi];
    const oppositeZhi  = ZHI_CLASH[dayZhi];
    const correctedDir = ZHI_DIRECTION[oppositeZhi];

    const poem = DIRECTION_POEMS[mainDir] || '方位既定，缘起有时。';

    return `以月支<strong style="color:#B22222">${monthZhi}</strong>顺数${steps}位至日支<strong style="color:#B22222">${dayZhi}</strong>，主方位落于<strong style="color:#B22222">${mainDir}</strong>。夫妻宫${dayZhi}与${oppositeZhi}相冲，引其偏移，故良缘方位当于${mainDir}与${correctedDir}之间寻之。<br><em style="color:#5a463a">诗曰：${poem}</em>`;
  }

  /* ---------- 子函数：相遇时间（大运+流年应期） ---------- */
  function generateMeetTime(baZiData, dayZhi, spouseStarWX) {
    const dayZhiCombine = ZHI_COMBINE[dayZhi];
    const dayZhiClash   = ZHI_CLASH[dayZhi];

    const currentYear = baZiData.currentYear.year;
    const daYunList   = baZiData.daYun.list;

    // 定位当前大运
    let currentDaYun = null;
    for (let i = 0; i < daYunList.length; i++) {
      const dy = daYunList[i];
      const nextDy = (i + 1 < daYunList.length) ? daYunList[i + 1] : null;
      if (dy.startYear <= currentYear && (!nextDy || nextDy.startYear > currentYear)) {
        currentDaYun = dy;
        break;
      }
    }

    if (!currentDaYun) {
      return '当前未见大运应期，需待大运流转方有姻缘动向。';
    }

    const dyStartYear = currentDaYun.startYear;
    const dyIdx       = currentDaYun.index;
    const nextDy      = (dyIdx + 1 < daYunList.length) ? daYunList[dyIdx + 1] : null;
    const dyEndYear   = nextDy ? (nextDy.startYear - 1) : (dyStartYear + 9);

    const startAge = currentDaYun.startAge;
    const endAge   = startAge + 9;

    // 遍历此大运十年，找关键流年
    const keyYears = [];
    const scanEnd = Math.min(dyEndYear, dyStartYear + 9);
    for (let y = dyStartYear; y <= scanEnd; y++) {
      const solar   = Solar.fromYmdHms(y, 6, 15, 12, 0, 0);
      const lunar   = solar.getLunar();
      const yearGZ  = lunar.getYearInGanZhi();
      const yearGan = yearGZ[0];
      const yearZhi = yearGZ[1];

      const reasons = [];
      if (yearZhi === dayZhiCombine)              reasons.push('与日支六合');
      if (yearZhi === dayZhiClash)                reasons.push('与日支相冲');
      if (yearZhi === dayZhi)                     reasons.push('与日支伏吟');
      if (GAN_WUXING[yearGan] === spouseStarWX)   reasons.push('配偶星透干');

      if (reasons.length > 0) {
        keyYears.push({ year: y, ganZhi: yearGZ, reasons });
      }
    }

    if (keyYears.length === 0) {
      return `此步大运<strong style="color:#B22222">${currentDaYun.ganZhi}</strong>（约${dyStartYear}—${dyEndYear}年，${startAge}至${endAge}岁）内，未见明显姻缘应期，需待下步大运方有动向。`;
    }

    const yearDescs = keyYears.map(k => `${k.year}年(${k.ganZhi}，${k.reasons.join('、')})`);

    return `此步大运<strong style="color:#B22222">${currentDaYun.ganZhi}</strong>（约${dyStartYear}—${dyEndYear}年，${startAge}至${endAge}岁），姻缘应期显现：<br>${yearDescs.join('；')}。其中尤以<strong style="color:#B22222">${keyYears[0].year}年</strong>最为关键，宜把握机缘。`;
  }

  /* ---------- 渲染：将画像填入四张卡片 ---------- */
  function renderPortrait(portrait) {
    document.querySelector('#cardAppearance  .card-body').innerHTML = portrait.face;
    document.querySelector('#cardPersonality .card-body').innerHTML = portrait.character;
    document.querySelector('#cardCareer      .card-body').innerHTML = portrait.career;
    // 第四张卡含两个子项，整体替换为 meet（方位+时间）
    const meetingBody = document.querySelector('#cardMeeting .card-body');
    meetingBody.innerHTML = portrait.meet;
    meetingBody.style.gridTemplateColumns = '1fr'; // 合并后改为单列
  }

  /* ---------- 表单工具：填充日期下拉 ---------- */

  /**
   * 初始化出生日期下拉选项（年/月/日）
   * 原 HTML 中年/月/日 <select> 仅含占位项，由此函数动态填充
   */
  function populateDateSelectors() {
    const yearSel  = document.getElementById('birthYear');
    const monthSel = document.getElementById('birthMonth');
    const daySel   = document.getElementById('birthDay');

    const curYear = new Date().getFullYear();
    for (let y = 1940; y <= curYear + 1; y++) {
      const opt = document.createElement('option');
      opt.value = y; opt.textContent = y + '年';
      yearSel.appendChild(opt);
    }
    for (let m = 1; m <= 12; m++) {
      const opt = document.createElement('option');
      opt.value = m; opt.textContent = m + '月';
      monthSel.appendChild(opt);
    }
    for (let d = 1; d <= 31; d++) {
      const opt = document.createElement('option');
      opt.value = d; opt.textContent = d + '日';
      daySel.appendChild(opt);
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    populateDateSelectors();

    // 表单提交绑定：getBaZi() → generatePortrait() → renderPortrait()
    // 全程 try/catch，任何意外错误都给出友好提示
    document.getElementById('birthForm').addEventListener('submit', function (e) {
      e.preventDefault();
      try {
        const data = getBaZi();
        if (!data) return; // getBaZi 内部已 toast
        const portrait = generatePortrait(data);

          showToast('画像生成受阻，请稍后重试');

          behavior:'smooth', block:'start'

      } catch (err) {
        console.error('[submit] 未捕获异常:', err);
        showToast('推演过程出现异常，请刷新重试');

    });

    // 便捷：Ctrl+Shift+D 填入测试数据（1990-05-15 14:30 男 北京 → 未时）

      }
    });
  });
