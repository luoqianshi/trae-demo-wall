<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>记忆杂货铺 · 交互式 Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --wood-dark: #3a2a1a; --wood: #5b4636; --wood-light: #8a6b4d;
    --cream: #f5e6d3; --cream-soft: #ebd9c0;
    --ember: #d97706; --ember-bright: #f59e0b;
    --ink: #2a1f17; --paper: #faf3e8;
  }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Serif SC", serif;
    background: #1a1410; color: var(--cream);
  }
  #app { position: relative; width: 100vw; height: 100vh; }
  #three-canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  #three-canvas:active { cursor: grabbing; }

  /* ===== 顶部栏 ===== */
  .topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px;
    background: linear-gradient(180deg, rgba(26,20,16,0.9) 0%, transparent 100%);
    pointer-events: none;
  }
  .topbar > * { pointer-events: auto; }
  .brand { font-size: 20px; font-weight: 700; letter-spacing: 2px; color: var(--cream); }
  .brand .emoji { margin-right: 8px; }
  .topbar-actions { display: flex; gap: 10px; }
  .btn {
    padding: 10px 20px; border-radius: 24px; border: none; cursor: pointer;
    font-size: 14px; font-weight: 600; transition: all 0.2s;
    display: inline-flex; align-items: center; gap: 6px;
    font-family: inherit;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--ember) 0%, var(--ember-bright) 100%);
    color: white; box-shadow: 0 2px 12px rgba(217,119,6,0.4);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 18px rgba(217,119,6,0.6); }
  .btn-ghost {
    background: rgba(91,70,54,0.6); color: var(--cream);
    border: 1px solid rgba(245,230,211,0.2);
  }
  .btn-ghost:hover { background: rgba(91,70,54,0.9); border-color: var(--ember-bright); }

  /* ===== 房间标题 ===== */
  .room-title {
    position: absolute; top: 64px; left: 24px; z-index: 10;
    background: rgba(26,20,16,0.85); backdrop-filter: blur(8px);
    padding: 12px 20px; border-radius: 12px;
    border: 1px solid rgba(245,158,11,0.3);
    display: none;
  }
  .room-title.visible { display: block; }
  .room-title .rt-emoji { font-size: 28px; }
  .room-title .rt-name { font-size: 18px; font-weight: 700; color: var(--cream); }
  .room-title .rt-count { font-size: 12px; color: var(--ember-bright); }

  /* ===== 底部家具导航 ===== */
  .furniture-nav {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10;
    display: none; gap: 8px; flex-wrap: wrap; justify-content: center;
    background: rgba(26,20,16,0.85); backdrop-filter: blur(8px);
    padding: 10px 14px; border-radius: 28px;
    border: 1px solid rgba(91,70,54,0.5);
    max-width: 90vw;
  }
  .furniture-nav.visible { display: flex; }
  .fn-btn {
    padding: 8px 16px; border-radius: 20px; border: none; cursor: pointer;
    font-size: 13px; font-family: inherit; transition: all 0.2s;
    background: rgba(91,70,54,0.5); color: var(--cream-soft);
    display: inline-flex; align-items: center; gap: 5px;
  }
  .fn-btn:hover { background: rgba(91,70,54,0.8); }
  .fn-btn.active { background: var(--ember); color: white; }

  /* ===== 底部提示 ===== */
  .hint {
    position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); z-index: 5;
    font-size: 12px; color: rgba(245,230,211,0.35); pointer-events: none;
    white-space: nowrap;
  }

  /* ===== 卡片详情抽屉 ===== */
  .drawer-backdrop {
    position: absolute; inset: 0; z-index: 20;
    background: rgba(0,0,0,0.4); backdrop-filter: blur(2px);
    display: none; cursor: pointer;
  }
  .drawer-backdrop.visible { display: block; }
  .drawer {
    position: absolute; top: 0; right: 0; bottom: 0; z-index: 21;
    width: 420px; max-width: 90vw;
    background: linear-gradient(180deg, #2a1f17 0%, #1a1410 100%);
    border-left: 2px solid var(--ember);
    box-shadow: -8px 0 40px rgba(0,0,0,0.5);
    transform: translateX(100%); transition: transform 0.35s ease;
    overflow-y: auto; padding: 24px;
  }
  .drawer.visible { transform: translateX(0); }
  .drawer-close {
    position: absolute; top: 16px; right: 16px;
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(245,230,211,0.1); border: none; cursor: pointer;
    color: var(--cream); font-size: 18px;
  }
  .drawer-close:hover { background: rgba(245,230,211,0.2); }
  .drawer-emoji { font-size: 56px; margin-bottom: 12px; }
  .drawer-title { font-size: 26px; font-weight: 700; color: white; margin-bottom: 16px; }
  .drawer-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .meta-chip {
    padding: 4px 12px; border-radius: 14px; font-size: 12px;
    background: rgba(245,158,11,0.15); color: var(--ember-bright);
    border: 1px solid rgba(245,158,11,0.3);
  }
  .drawer-section { margin-bottom: 20px; }
  .drawer-section h4 {
    font-size: 13px; color: var(--ember-bright); margin-bottom: 8px;
    letter-spacing: 1px; text-transform: uppercase;
  }
  .drawer-section .content {
    background: rgba(0,0,0,0.3); padding: 16px; border-radius: 10px;
    font-size: 15px; line-height: 1.8; color: var(--cream);
  }
  .drawer-section .original {
    font-size: 13px; color: rgba(245,230,211,0.5); font-style: italic;
    padding: 12px 16px; border-left: 3px solid rgba(245,230,211,0.2);
  }

  /* ===== 添加记忆面板 ===== */
  .add-panel-backdrop {
    position: absolute; inset: 0; z-index: 25;
    background: rgba(0,0,0,0.5); backdrop-filter: blur(3px);
    display: none;
  }
  .add-panel-backdrop.visible { display: block; }
  .add-panel {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); z-index: 26;
    width: 600px; max-width: 95vw;
    background: linear-gradient(180deg, #2a1f17 0%, #1a1410 100%);
    border-top: 2px solid var(--ember);
    border-radius: 20px 20px 0 0;
    padding: 28px 32px;
    box-shadow: 0 -8px 40px rgba(0,0,0,0.5);
  }
  .add-panel h3 { font-size: 22px; color: white; margin-bottom: 4px; }
  .add-panel .sub { font-size: 13px; color: var(--cream-soft); margin-bottom: 20px; }
  .add-panel textarea {
    width: 100%; height: 100px; resize: vertical;
    background: rgba(0,0,0,0.3); border: 1px solid rgba(245,230,211,0.2);
    border-radius: 10px; padding: 14px; color: var(--cream);
    font-size: 15px; font-family: inherit; line-height: 1.6;
  }
  .add-panel textarea:focus { outline: none; border-color: var(--ember-bright); }
  .strategy-select {
    margin-top: 14px;
  }
  .strategy-select label { font-size: 13px; color: var(--cream-soft); display: block; margin-bottom: 8px; }
  .strategy-options { display: flex; flex-wrap: wrap; gap: 8px; }
  .strategy-opt {
    padding: 6px 14px; border-radius: 16px; cursor: pointer;
    font-size: 12px; border: 1px solid rgba(245,230,211,0.2);
    background: rgba(91,70,54,0.3); color: var(--cream-soft);
    transition: all 0.2s;
  }
  .strategy-opt:hover { border-color: var(--ember-bright); }
  .strategy-opt.selected { background: var(--ember); color: white; border-color: var(--ember); }
  .add-actions { display: flex; gap: 12px; margin-top: 20px; justify-content: flex-end; }
  .processing-overlay {
    display: none; text-align: center; padding: 30px;
  }
  .processing-overlay.visible { display: block; }
  .shop-loader {
    width: 50px; height: 50px; border: 4px solid rgba(245,158,11,0.2);
    border-top-color: var(--ember-bright); border-radius: 50%;
    animation: spin 1s linear infinite; margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== Toast ===== */
  .toast {
    position: absolute; top: 70px; left: 50%; transform: translateX(-50%) translateY(-20px);
    z-index: 30; background: rgba(217,119,6,0.95); color: white;
    padding: 10px 24px; border-radius: 24px; font-size: 14px;
    opacity: 0; transition: all 0.3s; pointer-events: none;
    box-shadow: 0 4px 20px rgba(217,119,6,0.4);
  }
  .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== 加载屏 ===== */
  .loader-screen {
    position: absolute; inset: 0; z-index: 100;
    background: #1a1410; display: flex; align-items: center; justify-content: center;
    flex-direction: column;
  }
  .loader-screen.hidden { display: none; }
  .loader-screen .emoji { font-size: 48px; margin-bottom: 16px; animation: bounce 1s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .loader-screen .text { color: var(--cream-soft); font-size: 14px; }

  @media (max-width: 600px) {
    .drawer { width: 100vw; }
    .add-panel { width: 100vw; padding: 20px; }
    .topbar { padding: 10px 14px; }
    .brand { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="three-canvas"></canvas>

  <!-- 顶部栏 -->
  <div class="topbar">
    <div class="brand"><span class="emoji">🏪</span>记忆杂货铺</div>
    <div class="topbar-actions">
      <button class="btn btn-ghost" id="btn-back" style="display:none">← 地图</button>
      <button class="btn btn-primary" id="btn-add">✍️ 记住</button>
    </div>
  </div>

  <!-- 房间标题 -->
  <div class="room-title" id="room-title">
    <span class="rt-emoji" id="rt-emoji">📚</span>
    <span class="rt-name" id="rt-name">学习</span>
    <span class="rt-count" id="rt-count"></span>
  </div>

  <!-- 家具导航 -->
  <div class="furniture-nav" id="furniture-nav"></div>

  <!-- 底部提示 -->
  <div class="hint" id="hint">拖拽旋转 · 滚轮缩放 · 点击房子进入房间</div>

  <!-- 卡片详情抽屉 -->
  <div class="drawer-backdrop" id="drawer-bd"></div>
  <div class="drawer" id="drawer">
    <button class="drawer-close" id="drawer-close">✕</button>
    <div class="drawer-emoji" id="d-emoji">🌱</div>
    <div class="drawer-title" id="d-title">光合作用</div>
    <div class="drawer-meta" id="d-meta"></div>
    <div class="drawer-section">
      <h4>加工后的记忆</h4>
      <div class="content" id="d-content"></div>
    </div>
    <div class="drawer-section">
      <h4>原始输入</h4>
      <div class="original" id="d-original"></div>
    </div>
  </div>

  <!-- 添加记忆面板 -->
  <div class="add-panel-backdrop" id="add-bd"></div>
  <div class="add-panel" id="add-panel">
    <div id="add-form">
      <h3>✍️ 记住一段内容</h3>
      <p class="sub">输入任意文字，杂货铺会将其加工成令人印象深刻的记忆</p>
      <textarea id="memory-input" placeholder="例如：光合作用是植物利用光能将二氧化碳和水转化为有机物并释放氧气的过程..."></textarea>
      <div class="strategy-select">
        <label>选择记忆策略（可选，默认自动）</label>
        <div class="strategy-options" id="strategy-options"></div>
      </div>
      <div class="add-actions">
        <button class="btn btn-ghost" id="btn-cancel-add">取消</button>
        <button class="btn btn-primary" id="btn-process">🏪 记忆加工</button>
      </div>
    </div>
    <div class="processing-overlay" id="processing">
      <div class="shop-loader"></div>
      <div style="color:var(--cream)">🏪 杂货铺正在打包你的记忆...</div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- 加载屏 -->
  <div class="loader-screen" id="loader">
    <div class="emoji">🏪</div>
    <div class="text">正在布置杂货铺...</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

/* ================================================================
   模拟 LLM 记忆加工
   ================================================================ */
const KEYWORD_EMOJI = [
  [/植物|叶|光|光合|花|树|草/, '🌱'],
  [/动物|狗|猫|鸟|鱼|虫/, '🐾'],
  [/历史|战争|朝代|皇帝|革命|古代/, '🏛️'],
  [/物理|力|电|光|热|量|原子|分子/, '⚛️'],
  [/化学|反应|元素|酸|碱/, '🧪'],
  [/生物|基因|DNA|细胞|进化/, '🧬'],
  [/数学|公式|几何|代数|计算/, '🔢'],
  [/电脑|程序|代码|算法|数据/, '💻'],
  [/音乐|歌|乐器|旋律|节奏/, '🎵'],
  [/画|艺术|设计|色彩|美/, '🎨'],
  [/食物|吃|烹饪|菜|饭/, '🍳'],
  [/旅行|城市|国家|地图|风景/, '🗺️'],
  [/人|人物|名字|关系/, '👤'],
  [/想法|创意|灵感|点子/, '💡'],
  [/工作|职场|项目|任务/, '💼'],
  [/语言|单词|语法|英语|中文/, '📖'],
  [/生活|日常|习惯|感悟/, '🌿'],
  [/科学|研究|实验|理论/, '🔬'],
  [/宇宙|星|行星|太空|银河/, '🌌'],
  [/时间|日期|历史|年代/, '⏰'],
];

const KEYWORD_ROOM = [
  [/学习|知识|科学|物理|化学|生物|数学|历史|语言|概念|定理|公式/, 'study'],
  [/生活|日常|做饭|烹饪|浇水|习惯|感悟|咖啡/, 'life'],
  [/灵感|创意|想法|点子|梦想|写作|故事/, 'inspire'],
];

function suggestEmoji(text) {
  for (const [re, emoji] of KEYWORD_EMOJI) {
    if (re.test(text)) return emoji;
  }
  return '📦';
}

function suggestRoom(text) {
  for (const [re, roomId] of KEYWORD_ROOM) {
    if (re.test(text)) return roomId;
  }
  return 'storage';
}

function extractTitle(text) {
  const clean = text.replace(/\s+/g, ' ').trim();
  if (clean.length <= 8) return clean;
  const firstClause = clean.split(/[，。,.！!？?；;\n]/)[0];
  if (firstClause.length <= 12) return firstClause;
  return firstClause.slice(0, 10) + '…';
}

function extractTags(text) {
  const tags = [];
  if (/生物|植物|动物|基因/.test(text)) tags.push('生物');
  if (/物理|电|力|热/.test(text)) tags.push('物理');
  if (/历史|朝代|革命/.test(text)) tags.push('历史');
  if (/化学|反应|元素/.test(text)) tags.push('化学');
  if (/生活|日常/.test(text)) tags.push('生活');
  if (/创意|灵感/.test(text)) tags.push('创意');
  if (tags.length === 0) tags.push('未分类');
  return tags.slice(0, 3);
}

// 各策略的模拟加工
function processWithStrategy(text, strategy) {
  const strategies = {
    '画面感强化': `闭上眼睛想象这个画面：${text} 现在把它变成一个你能"看见"的场景——每个细节都有颜色、有形状、有温度。当你需要回忆时，只需在脑海中重新"播放"这个画面。`,
    '夸张化处理': `把这件事放大一百倍来看：${text} 想象它夸张到荒诞的地步——大到能填满天空，或者小到藏在针尖里。越是离谱，大脑越舍不得忘记。`,
    '谐音联想': `用谐音给这段信息装个"把手"：${text} 找一个读音相近、但画面感更强的词，把两者绑在一起。下次想起那个谐音词，原文就会像拔萝卜一样被带出来。`,
    '故事化重构': `把知识点塞进一个小故事里：${text} 想象一个主角（可以是你自己），在一个具体场景中遇到了这件事。故事的情节就是知识的逻辑，故事的画面就是记忆的锚点。`,
    '类比比喻': `用你早已熟悉的东西来类比：${text} 就像${text.includes('水') ? '河流汇入大海' : text.includes('电') ? '水管里流动的水' : '一棵树的根系'}——陌生的概念一旦搭上熟悉的桥，过目不忘。`,
    '记忆宫殿': `在你的记忆宫殿里选一个房间：${text} 把这段信息"放"在那个房间的某个固定位置——桌上、墙上、或者窗台上。回忆时， mentally 走进那个房间，走到那个位置，信息就在那里等你。`,
    '对比反差': `制造一个强烈的反差来记住它：${text} 想象"有它"和"没有它"的两个世界，差异越大越难忘。正反对照之间，记忆自然凸显。`,
    '押韵口诀': `把它变成一句顺口的口诀：${text} 用押韵的方式浓缩成几句——节奏感会让大脑自动循环播放，想忘都难。`,
  };
  return strategies[strategy] || strategies['画面感强化'];
}

function autoSelectStrategy(text) {
  if (/公式|列表|步骤|口诀|顺序/.test(text)) return '押韵口诀';
  if (/概念|理论|是什么|定义/.test(text)) return '类比比喻';
  if (/故事|事件|过程|流程/.test(text)) return '故事化重构';
  if (/区别|不同|比较|对比|易混/.test(text)) return '对比反差';
  if (/人名|地名|术语|单词/.test(text)) return '谐音联想';
  if (/抽象|原理|机制/.test(text)) return '画面感强化';
  return STRATEGIES[Math.floor(Math.random() * STRATEGIES.length)];
}

function simulateLLM(text, strategy) {
  const actualStrategy = strategy || autoSelectStrategy(text);
  return {
    emoji: suggestEmoji(text),
    title: extractTitle(text),
    processed_content: processWithStrategy(text, actualStrategy),
    original_text: text,
    strategy: actualStrategy,
    tags: extractTags(text),
    suggested_room: suggestRoom(text),
  };
}

/* ================================================================
   Three.js 场景
   ================================================================ */
const ROOM_W = 20, ROOM_H = 10, ROOM_D = 20;
const CARD_W = 0.85, CARD_H = 1.2, CARD_D = 0.15;

let scene, camera, renderer, controls, raycaster, mouse;
let mapGroup, roomGroup;
let currentView = 'map';
let currentRoom = null;
let roomFocus = 'overview';
let cardMeshes = []; // {mesh, card, furnitureId}
let furnitureMeshes = []; // {mesh, furniture}
let houseMeshes = []; // {mesh, room}
let cameraTarget = { pos: new THREE.Vector3(0,22,18), look: new THREE.Vector3(0,0,0), animating: false };
let selectedStrategy = null;

const MAP_CAM = { pos: [0, 22, 18], look: [0, 0, 0] };
const ROOM_OVERVIEW_CAM = { pos: [9, 6, 9], look: [0, 1.5, 0] };

function init() {
  const canvas = document.getElementById('three-canvas');
  scene = new THREE.Scene();
  scene.background = new THREE.Color('#1a1410');
  scene.fog = new THREE.Fog('#1a1410', 40, 80);

  camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.set(...MAP_CAM.pos);

  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.35;

  controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.maxPolarAngle = 1.2;
  controls.minDistance = 8;
  controls.maxDistance = 40;
  controls.target.set(...MAP_CAM.look);

  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();

  // 灯光
  setupLights('map');

  // 地图场景
  mapGroup = new THREE.Group();
  roomGroup = new THREE.Group();
  roomGroup.visible = false;
  scene.add(mapGroup);
  scene.add(roomGroup);

  buildMap();
  setupInteractions();
  animate();

  window.addEventListener('resize', onResize);
  document.getElementById('loader').classList.add('hidden');
}

function setupLights(mode) {
  // 清除旧灯光
  scene.children.filter(c => c.isLight).forEach(l => scene.remove(l));

  const ambient = new THREE.AmbientLight(0xfff5e6, mode === 'map' ? 0.6 : 1.1);
  scene.add(ambient);

  const hemi = new THREE.HemisphereLight(0xffeedd, 0x3a2a1a, mode === 'map' ? 0.4 : 0.6);
  scene.add(hemi);

  if (mode === 'room') {
    const point = new THREE.PointLight(0xffd580, 2.2, 30, 1.5);
    point.position.set(0, 8, 0);
    point.castShadow = true;
    scene.add(point);

    const dir = new THREE.DirectionalLight(0xfff5e6, 0.8);
    dir.position.set(5, 10, 5);
    scene.add(dir);
  } else {
    const dir = new THREE.DirectionalLight(0xfff5e6, 0.8);
    dir.position.set(10, 20, 10);
    scene.add(dir);
  }
}

/* ===== 构建地图（村落俯瞰） ===== */
function buildMap() {
  mapGroup.clear();
  houseMeshes = [];

  // 地面
  const groundGeo = new THREE.PlaneGeometry(60, 60);
  const groundMat = new THREE.MeshStandardMaterial({ color: '#2a1f17', roughness: 0.9 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  mapGroup.add(ground);

  // 装饰：散落的"树"
  for (let i = 0; i < 12; i++) {
    const angle = (i / 12) * Math.PI * 2;
    const r = 22 + Math.random() * 5;
    const tree = makeTree();
    tree.position.set(Math.cos(angle) * r, 0, Math.sin(angle) * r);
    mapGroup.add(tree);
  }

  // 房子：3x2 排列
  const positions = [
    [-7, 0, -4], [0, 0, -4], [7, 0, -4],
    [-7, 0, 5], [0, 0, 5], [7, 0, 5],
  ];
  ROOMS.forEach((room, i) => {
    const house = makeHouse(room);
    house.position.set(...positions[i]);
    houseMeshes.push({ mesh: house, room });
    mapGroup.add(house);
  });

  // 中心路标
  const sign = makeSignpost();
  sign.position.set(0, 0, 0.5);
  mapGroup.add(sign);
}

function makeHouse(room) {
  const group = new THREE.Group();
  const color = new THREE.Color(room.color);
  const cardCount = room.cards.length;

  // 屋身
  const bodyMat = new THREE.MeshStandardMaterial({
    color: color.clone().multiplyScalar(0.7), roughness: 0.8
  });
  const body = new THREE.Mesh(new THREE.BoxGeometry(4, 3, 4), bodyMat);
  body.position.y = 1.5;
  body.castShadow = true;
  body.receiveShadow = true;
  group.add(body);

  // 屋顶（金字塔）
  const roofMat = new THREE.MeshStandardMaterial({ color: '#5b3a1f', roughness: 0.7 });
  const roof = new THREE.Mesh(new THREE.ConeGeometry(3.2, 2, 4), roofMat);
  roof.position.y = 4;
  roof.rotation.y = Math.PI / 4;
  roof.castShadow = true;
  group.add(roof);

  // 门
  const doorMat = new THREE.MeshStandardMaterial({ color: '#3a2a1a' });
  const door = new THREE.Mesh(new THREE.PlaneGeometry(1, 1.6), doorMat);
  door.position.set(0, 0.8, 2.01);
  group.add(door);

  // emoji 标牌（Canvas 纹理）
  const labelTex = makeHouseLabel(room);
  const labelMat = new THREE.MeshBasicMaterial({ map: labelTex, transparent: true });
  const label = new THREE.Mesh(new THREE.PlaneGeometry(2.5, 1.2), labelMat);
  label.position.set(0, 2.5, 2.02);
  group.add(label);

  // 卡片数量指示
  const countTex = makeCountLabel(cardCount);
  const countMat = new THREE.MeshBasicMaterial({ map: countTex, transparent: true });
  const countLabel = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 0.5), countMat);
  countLabel.position.set(0, 3.2, 2.02);
  group.add(countLabel);

  group.userData = { type: 'house', room };
  return group;
}

function makeHouseLabel(room) {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgba(245,230,211,0.95)';
  roundRect(ctx, 0, 0, 256, 128, 16);
  ctx.fill();
  ctx.font = '64px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(room.emoji, 128, 45);
  ctx.font = 'bold 28px "Microsoft YaHei", serif';
  ctx.fillStyle = '#3a2a1a';
  ctx.fillText(room.name, 128, 95);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeCountLabel(count) {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgba(217,119,6,0.9)';
  roundRect(ctx, 0, 0, 256, 64, 12);
  ctx.fill();
  ctx.font = 'bold 28px "Microsoft YaHei", serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  ctx.fillText(`📦 ${count} 张卡片`, 128, 32);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeTree() {
  const group = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.15, 0.2, 1, 6),
    new THREE.MeshStandardMaterial({ color: '#3a2a1a' })
  );
  trunk.position.y = 0.5;
  group.add(trunk);
  const leaves = new THREE.Mesh(
    new THREE.ConeGeometry(0.8, 2, 6),
    new THREE.MeshStandardMaterial({ color: '#3d5a2a', roughness: 0.8 })
  );
  leaves.position.y = 2;
  leaves.castShadow = true;
  group.add(leaves);
  return group;
}

function makeSignpost() {
  const group = new THREE.Group();
  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.08, 0.08, 2.5, 6),
    new THREE.MeshStandardMaterial({ color: '#5b4636' })
  );
  pole.position.y = 1.25;
  group.add(pole);
  const tex = makeSignLabel();
  const board = new THREE.Mesh(
    new THREE.PlaneGeometry(2, 0.7),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true })
  );
  board.position.set(0, 2, 0);
  group.add(board);
  return group;
}

function makeSignLabel() {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 90;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgba(91,70,54,0.9)';
  roundRect(ctx, 0, 0, 256, 90, 10);
  ctx.fill();
  ctx.font = 'bold 22px "Microsoft YaHei", serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#f5e6d3';
  ctx.fillText('🏪 记忆杂货铺', 128, 30);
  ctx.font = '14px "Microsoft YaHei", serif';
  ctx.fillStyle = '#d97706';
  ctx.fillText('点击房子进入房间', 128, 60);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* ===== 构建房间内部 ===== */
function buildRoom(room) {
  roomGroup.clear();
  cardMeshes = [];
  furnitureMeshes = [];

  const themeColor = new THREE.Color(room.color);

  // 地板
  const floorMat = new THREE.MeshStandardMaterial({ color: '#6b4f37', roughness: 0.85 });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, ROOM_D), floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  roomGroup.add(floor);

  // 墙壁（内翻盒子）
  const wallMat = new THREE.MeshStandardMaterial({
    color: themeColor.clone().multiplyScalar(0.42), roughness: 0.85, side: THREE.BackSide
  });
  const walls = new THREE.Mesh(new THREE.BoxGeometry(ROOM_W, ROOM_H, ROOM_D), wallMat);
  walls.position.y = ROOM_H / 2;
  walls.receiveShadow = true;
  roomGroup.add(walls);

  // 家具
  room.furniture.forEach(f => {
    const furnMesh = buildFurniture(f, themeColor);
    furnMesh.position.set(...f.pos);
    furnMesh.rotation.y = f.rotY;
    furnMesh.userData = { type: 'furniture', furniture: f };
    roomGroup.add(furnMesh);
    furnitureMeshes.push({ mesh: furnMesh, furniture: f });
  });

  // 卡片放到家具上
  room.cards.forEach((card, idx) => {
    const furniture = room.furniture.find(f => f.id === card.furniture);
    if (!furniture) return;
    // 计算该家具上已有几张卡片
    const cardsOnFurn = room.cards.filter((c, i) => i < idx && room.furniture.find(f => f.id === c.furniture)?.id === furniture.id);
    const slotIdx = cardsOnFurn.length;
    if (slotIdx >= 3) return; // 每个家具最多3张

    const cardMesh = buildCard(card, furniture, slotIdx, themeColor);
    cardMesh.userData = { type: 'card', card, furnitureId: furniture.id };
    roomGroup.add(cardMesh);
    cardMeshes.push({ mesh: cardMesh, card, furnitureId: furniture.id });
  });

  // 北墙挂画
  const pictureTex = makeWallPicture(room);
  const picture = new THREE.Mesh(
    new THREE.PlaneGeometry(2, 2),
    new THREE.MeshBasicMaterial({ map: pictureTex })
  );
  picture.position.set(0, 5, -ROOM_D / 2 + 0.1);
  roomGroup.add(picture);
}

function buildFurniture(f, themeColor) {
  const group = new THREE.Group();
  const emissive = themeColor.clone().multiplyScalar(0.3);
  const woodMat = new THREE.MeshStandardMaterial({
    color: '#5b3a1f', roughness: 0.6, metalness: 0.1,
    emissive, emissiveIntensity: 0.05
  });

  switch (f.type) {
    case 'desk': {
      const top = new THREE.Mesh(new THREE.BoxGeometry(5, 0.12, 2.2), woodMat);
      top.position.y = f.surfaceY; top.castShadow = true; top.receiveShadow = true;
      group.add(top);
      [[-2.3,0.75,-1],[2.3,0.75,-1],[-2.3,0.75,1],[2.3,0.75,1]].forEach(p => {
        const leg = new THREE.Mesh(new THREE.BoxGeometry(0.15,1.5,0.15), woodMat);
        leg.position.set(...p); leg.castShadow = true;
        group.add(leg);
      });
      break;
    }
    case 'coffeeTable': {
      const top = new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.6,0.1,24), woodMat);
      top.position.y = f.surfaceY; top.castShadow = true; top.receiveShadow = true;
      group.add(top);
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.25,1,12), woodMat);
      leg.position.y = 0.5; leg.castShadow = true;
      group.add(leg);
      break;
    }
    case 'platform': {
      const baseMat = new THREE.MeshStandardMaterial({
        color: '#3a2a1a', roughness: 0.5, metalness: 0.4,
        emissive, emissiveIntensity: 0.08
      });
      const base = new THREE.Mesh(new THREE.CylinderGeometry(1.8,2,0.8,24), baseMat);
      base.position.y = 0.4; base.castShadow = true; base.receiveShadow = true;
      group.add(base);
      const top = new THREE.Mesh(new THREE.CylinderGeometry(1.8,1.8,0.1,24), baseMat);
      top.position.y = 0.85; top.castShadow = true;
      group.add(top);
      // 漂浮球
      const bulb = new THREE.Mesh(
        new THREE.SphereGeometry(0.4, 20, 20),
        new THREE.MeshStandardMaterial({
          color: '#FFE9B0', emissive: '#FFD580', emissiveIntensity: 0.8,
          transparent: true, opacity: 0.7
        })
      );
      bulb.position.y = 2.8;
      bulb.userData.isBulb = true;
      group.add(bulb);
      const light = new THREE.PointLight(0xFFD580, 1.5, 8, 2);
      light.position.y = 2.8;
      group.add(light);
      break;
    }
    case 'crate': {
      const box1 = new THREE.Mesh(new THREE.BoxGeometry(3.5,1.5,2.5), woodMat);
      box1.position.y = 0.75; box1.castShadow = true; box1.receiveShadow = true;
      group.add(box1);
      const box2 = new THREE.Mesh(new THREE.BoxGeometry(2.8,0.8,2), woodMat);
      box2.position.set(0.3,1.85,0.2); box2.castShadow = true;
      group.add(box2);
      const plat = new THREE.Mesh(new THREE.BoxGeometry(3,0.08,2.2), woodMat);
      plat.position.y = 2.35; plat.castShadow = true;
      group.add(plat);
      break;
    }
    case 'roundTable': {
      const top = new THREE.Mesh(new THREE.CylinderGeometry(1.8,1.8,0.1,24), woodMat);
      top.position.y = f.surfaceY; top.castShadow = true; top.receiveShadow = true;
      group.add(top);
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.25,1.2,12), woodMat);
      leg.position.y = 0.6; leg.castShadow = true;
      group.add(leg);
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.8,0.8,0.1,16), woodMat);
      base.position.y = 0.05;
      group.add(base);
      break;
    }
    case 'pedestal':
    default: {
      const pedMat = new THREE.MeshStandardMaterial({
        color: '#6b4f37', roughness: 0.65,
        emissive, emissiveIntensity: 0.04
      });
      const base = new THREE.Mesh(new THREE.BoxGeometry(2.2,1.5,1.8), pedMat);
      base.position.y = 0.75; base.castShadow = true; base.receiveShadow = true;
      group.add(base);
      const top = new THREE.Mesh(new THREE.BoxGeometry(2.6,0.1,2.2), pedMat);
      top.position.y = 1.55; top.castShadow = true;
      group.add(top);
      break;
    }
  }

  // 家具名牌
  const labelTex = makeFurnitureLabel(f);
  const label = new THREE.Mesh(
    new THREE.PlaneGeometry(2, 0.55),
    new THREE.MeshBasicMaterial({ map: labelTex, transparent: true })
  );
  label.position.set(0, f.surfaceY + 1.5, 0);
  label.userData.isLabel = true;
  group.add(label);

  return group;
}

function buildCard(card, furniture, slotIdx, themeColor) {
  const spacing = furniture.spacing || 1.0;
  const localX = (slotIdx - 1) * spacing;
  const localY = furniture.surfaceY + CARD_H / 2;
  const localZ = 0.1;

  // 局部 → 世界
  const cos = Math.cos(furniture.rotY);
  const sin = Math.sin(furniture.rotY);
  const wx = furniture.pos[0] + localX * cos + localZ * sin;
  const wy = furniture.pos[1] + localY;
  const wz = furniture.pos[2] - localX * sin + localZ * cos;

  const frontTex = makeCardTexture(card, themeColor);
  const sideMat = new THREE.MeshStandardMaterial({ color: '#a88863', roughness: 0.65 });
  const frontMat = new THREE.MeshStandardMaterial({
    map: frontTex, roughness: 0.6,
    emissive: themeColor, emissiveIntensity: 0.08
  });
  const backMat = new THREE.MeshStandardMaterial({
    color: themeColor, roughness: 0.5,
    emissive: themeColor, emissiveIntensity: 0.05
  });

  // 顺序：右、左、顶、底、前、后
  const mats = [sideMat, sideMat, sideMat, sideMat, frontMat, backMat];
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(CARD_W, CARD_H, CARD_D), mats);
  mesh.position.set(wx, wy, wz);
  mesh.rotation.y = furniture.rotY;
  mesh.castShadow = true;
  return mesh;
}

function makeCardTexture(card, themeColor) {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 384;
  const ctx = canvas.getContext('2d');
  // 背景
  const grad = ctx.createLinearGradient(0, 0, 0, 384);
  grad.addColorStop(0, '#faf3e8');
  grad.addColorStop(1, '#ebd9c0');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 256, 384);
  // 主题色边框
  ctx.strokeStyle = themeColor;
  ctx.lineWidth = 6;
  ctx.strokeRect(8, 8, 240, 368);
  // emoji
  ctx.font = '120px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(card.emoji, 128, 140);
  // 标题
  ctx.font = 'bold 32px "Microsoft YaHei", serif';
  ctx.fillStyle = '#3a2a1a';
  ctx.fillText(card.title.slice(0, 8), 128, 250);
  // 策略标签
  ctx.font = '16px "Microsoft YaHei", serif';
  ctx.fillStyle = '#d97706';
  ctx.fillText(card.strategy, 128, 300);
  // 底部装饰
  ctx.font = '14px serif';
  ctx.fillStyle = '#8a6b4d';
  ctx.fillText('— 杂货铺出品 —', 128, 340);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeFurnitureLabel(f) {
  const canvas = document.createElement('canvas');
  canvas.width = 400; canvas.height = 110;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgba(45,32,22,0.85)';
  roundRect(ctx, 0, 0, 400, 110, 16);
  ctx.fill();
  ctx.font = '48px serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  ctx.fillText(f.emoji, 16, 55);
  ctx.font = 'bold 32px "Microsoft YaHei", serif';
  ctx.fillStyle = '#F5E6D3';
  ctx.fillText(f.name, 76, 55);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeWallPicture(room) {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 256;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#3a2a1a';
  ctx.fillRect(0, 0, 256, 256);
  ctx.fillStyle = '#5b4636';
  ctx.fillRect(8, 8, 240, 240);
  ctx.fillStyle = room.color;
  ctx.fillRect(20, 20, 216, 216);
  ctx.font = '140px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  ctx.fillText(room.emoji, 128, 138);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* ================================================================
   交互
   ================================================================ */
function setupInteractions() {
  const canvas = renderer.domElement;
  canvas.addEventListener('click', onCanvasClick);

  document.getElementById('btn-add').addEventListener('click', openAddPanel);
  document.getElementById('btn-cancel-add').addEventListener('click', closeAddPanel);
  document.getElementById('btn-process').addEventListener('click', processMemory);
  document.getElementById('btn-back').addEventListener('click', exitToMap);
  document.getElementById('drawer-close').addEventListener('click', closeDrawer);
  document.getElementById('drawer-bd').addEventListener('click', closeDrawer);
  document.getElementById('add-bd').addEventListener('click', closeAddPanel);

  // 策略选项
  const strategyContainer = document.getElementById('strategy-options');
  const autoOpt = document.createElement('div');
  autoOpt.className = 'strategy-opt selected';
  autoOpt.textContent = '🎯 自动选择';
  autoOpt.dataset.strategy = '';
  autoOpt.addEventListener('click', () => selectStrategy('', autoOpt));
  strategyContainer.appendChild(autoOpt);
  STRATEGIES.forEach(s => {
    const opt = document.createElement('div');
    opt.className = 'strategy-opt';
    opt.textContent = s;
    opt.dataset.strategy = s;
    opt.addEventListener('click', () => selectStrategy(s, opt));
    strategyContainer.appendChild(opt);
  });
}

function selectStrategy(s, el) {
  selectedStrategy = s || null;
  document.querySelectorAll('.strategy-opt').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
}

function onCanvasClick(e) {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  if (currentView === 'map') {
    // 点击房子
    const intersects = raycaster.intersectObjects(houseMeshes.map(h => h.mesh), true);
    if (intersects.length > 0) {
      const houseData = findUserData(intersects[0].object, 'house');
      if (houseData) enterRoom(houseData.room);
    }
  } else if (currentView === 'room') {
    // 先检查卡片
    const cardIntersects = raycaster.intersectObjects(cardMeshes.map(c => c.mesh));
    if (cardIntersects.length > 0) {
      const mesh = cardIntersects[0].object;
      const cardData = cardMeshes.find(c => c.mesh === mesh);
      if (cardData) {
        showCardDetail(cardData.card);
        return;
      }
    }
    // 再检查家具
    const furnIntersects = raycaster.intersectObjects(furnitureMeshes.map(f => f.mesh), true);
    if (furnIntersects.length > 0) {
      const furnData = findUserData(furnIntersects[0].object, 'furniture');
      if (furnData) focusFurniture(furnData.furniture.id);
    }
  }
}

function findUserData(obj, type) {
  let current = obj;
  while (current) {
    if (current.userData && current.userData.type === type) {
      return current.userData;
    }
    current = current.parent;
  }
  return null;
}

/* ===== 视图切换 ===== */
function enterRoom(room) {
  currentView = 'room';
  currentRoom = room;
  roomFocus = 'overview';

  buildRoom(room);
  mapGroup.visible = false;
  roomGroup.visible = true;
  setupLights('room');

  // 相机过渡
  setCameraTarget(ROOM_OVERVIEW_CAM.pos, ROOM_OVERVIEW_CAM.look);

  // UI
  document.getElementById('btn-back').style.display = 'inline-flex';
  document.getElementById('room-title').classList.add('visible');
  document.getElementById('rt-emoji').textContent = room.emoji;
  document.getElementById('rt-name').textContent = room.name;
  updateRoomTitle();
  buildFurnitureNav();
  document.getElementById('furniture-nav').classList.add('visible');
  document.getElementById('hint').textContent = '拖拽旋转 · 滚轮缩放 · 点击家具聚焦 · 点击卡片查看详情';
}

function exitToMap() {
  currentView = 'map';
  currentRoom = null;
  mapGroup.visible = true;
  roomGroup.visible = false;
  setupLights('map');
  setCameraTarget(MAP_CAM.pos, MAP_CAM.look);

  document.getElementById('btn-back').style.display = 'none';
  document.getElementById('room-title').classList.remove('visible');
  document.getElementById('furniture-nav').classList.remove('visible');
  closeDrawer();
  document.getElementById('hint').textContent = '拖拽旋转 · 滚轮缩放 · 点击房子进入房间';
}

function focusFurniture(furnitureId) {
  roomFocus = furnitureId;
  const room = currentRoom;
  const furn = room.furniture.find(f => f.id === furnitureId);
  if (!furn) return;

  // 计算聚焦相机位置（在家具前方）
  const camOffset = 4.5;
  const cos = Math.cos(furn.rotY);
  const sin = Math.sin(furn.rotY);
  const camPos = [
    furn.pos[0] + camOffset * sin,
    furn.surfaceY + 2.5,
    furn.pos[2] + camOffset * cos,
  ];
  const camLook = [furn.pos[0], furn.surfaceY + 0.5, furn.pos[2]];
  setCameraTarget(camPos, camLook);
  updateFurnitureNav();
}

function focusOverview() {
  roomFocus = 'overview';
  setCameraTarget(ROOM_OVERVIEW_CAM.pos, ROOM_OVERVIEW_CAM.look);
  updateFurnitureNav();
}

/* ===== 家具导航 ===== */
function buildFurnitureNav() {
  const nav = document.getElementById('furniture-nav');
  nav.innerHTML = '';
  const overviewBtn = document.createElement('button');
  overviewBtn.className = 'fn-btn active';
  overviewBtn.innerHTML = '🗺️ 总览';
  overviewBtn.addEventListener('click', focusOverview);
  nav.appendChild(overviewBtn);
  currentRoom.furniture.forEach(f => {
    const btn = document.createElement('button');
    btn.className = 'fn-btn';
    btn.innerHTML = `${f.emoji} ${f.name}`;
    btn.dataset.furnId = f.id;
    btn.addEventListener('click', () => focusFurniture(f.id));
    nav.appendChild(btn);
  });
}

function updateFurnitureNav() {
  document.querySelectorAll('.fn-btn').forEach(btn => {
    const furnId = btn.dataset.furnId;
    if ((roomFocus === 'overview' && !furnId) || roomFocus === furnId) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  });
}

function updateRoomTitle() {
  const count = currentRoom ? currentRoom.cards.length : 0;
  document.getElementById('rt-count').textContent = `· ${count} 张记忆卡片`;
}

/* ===== 卡片详情 ===== */
function showCardDetail(card) {
  document.getElementById('d-emoji').textContent = card.emoji;
  document.getElementById('d-title').textContent = card.title;
  const meta = document.getElementById('d-meta');
  meta.innerHTML = '';
  const strategyChip = document.createElement('span');
  strategyChip.className = 'meta-chip';
  strategyChip.textContent = `策略：${card.strategy}`;
  meta.appendChild(strategyChip);
  card.tags.forEach(t => {
    const chip = document.createElement('span');
    chip.className = 'meta-chip';
    chip.textContent = t;
    meta.appendChild(chip);
  });
  document.getElementById('d-content').textContent = card.processed_content;
  document.getElementById('d-original').textContent = card.original_text;
  document.getElementById('drawer').classList.add('visible');
  document.getElementById('drawer-bd').classList.add('visible');
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('visible');
  document.getElementById('drawer-bd').classList.remove('visible');
}

/* ===== 添加记忆 ===== */
function openAddPanel() {
  document.getElementById('add-bd').classList.add('visible');
  document.getElementById('add-panel').style.display = 'block';
  document.getElementById('add-form').style.display = 'block';
  document.getElementById('processing').classList.remove('visible');
  document.getElementById('memory-input').value = '';
  document.getElementById('memory-input').focus();
}

function closeAddPanel() {
  document.getElementById('add-bd').classList.remove('visible');
  document.getElementById('add-panel').style.display = 'none';
}

function processMemory() {
  const text = document.getElementById('memory-input').value.trim();
  if (!text) { showToast('请先写下你想记住的内容'); return; }
  if (text.length < 2) { showToast('内容太短啦，多写一点更容易记住哦'); return; }

  document.getElementById('add-form').style.display = 'none';
  document.getElementById('processing').classList.add('visible');

  // 模拟 LLM 延迟
  setTimeout(() => {
    const result = simulateLLM(text, selectedStrategy);
    // 添加卡片到对应房间
    const roomId = result.suggested_room;
    const room = ROOMS.find(r => r.id === roomId) || ROOMS.find(r => r.id === 'storage');
    const card = {
      emoji: result.emoji,
      title: result.title,
      strategy: result.strategy,
      tags: result.tags,
      content: result.processed_content,
      original_text: result.original_text,
      furniture: room.furniture[0].id, // 放到第一个家具
    };
    room.cards.push(card);

    closeAddPanel();
    showToast(`✅ 已保存到「${room.name}」房间`);

    // 如果当前在该房间，刷新场景
    if (currentRoom && currentRoom.id === room.id) {
      buildRoom(currentRoom);
      updateRoomTitle();
    }
    // 更新地图房屋卡片数
    buildMap();
  }, 1800);
}

/* ===== Toast ===== */
let toastTimer = null;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('visible'), 2500);
}

/* ===== 相机过渡 ===== */
function setCameraTarget(pos, look) {
  cameraTarget.pos.set(...pos);
  cameraTarget.look.set(...look);
  cameraTarget.animating = true;
}

/* ===== 动画循环 ===== */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.getElapsedTime();

  // 相机过渡
  if (cameraTarget.animating) {
    camera.position.lerp(cameraTarget.pos, 0.08);
    controls.target.lerp(cameraTarget.look, 0.08);
    controls.update();
    if (camera.position.distanceTo(cameraTarget.pos) < 0.1) {
      camera.position.copy(cameraTarget.pos);
      controls.target.copy(cameraTarget.look);
      controls.update();
      cameraTarget.animating = false;
    }
  }

  // 灵感台漂浮球动画
  if (currentView === 'room' && roomGroup) {
    roomGroup.traverse(obj => {
      if (obj.userData && obj.userData.isBulb) {
        obj.position.y = 2.8 + Math.sin(t * 0.8) * 0.15;
      }
    });
  }

  // 地图房屋轻微浮动
  if (currentView === 'map') {
    houseMeshes.forEach((h, i) => {
      h.mesh.children[0].position.y = 1.5 + Math.sin(t * 0.5 + i) * 0.05;
    });
  }

  controls.update();
  renderer.render(scene, camera);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

/* ===== 工具函数 ===== */
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ===== 启动 ===== */
init();
</script>
