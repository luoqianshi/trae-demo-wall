<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识星图 ✦ Knowledge Starmap — 把知识宇宙，一颗一颗点亮</title>
<meta property="og:title" content="知识星图 ✦ Knowledge Starmap">
<meta property="og:description" content="把知识宇宙，一颗一颗点亮 — 一个沉浸式的学习路径可视化工具">
<meta property="og:type" content="website">
<meta property="og:image" content="">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>✦</text></svg>">
<style>
/* ═══════════════ CSS 变量（小王子风格调色盘）═══════════════ */
:root {
  --night-deep:     #10172a;
  --night-mid:      #1b2443;
  --night-warm:     #252d4a;
  --gold-warm:      #e2b96f;
  --rose-dusty:     #d4786e;
  --sage-soft:      #7d9b7a;
  --teal-prince:    #5d9b94;
  --lavender-dream: #a89cc4;
  --lantern-glow:   #f5d67b;
  --star-cream:     #fef3d4;
  --parchment:      rgba(42,38,55,0.65);
  --text-warm:      #f0ede5;
  --text-soft:      #b8b2a0;
  --text-dim:       #7a7568;
}

/* ═══════════════ 全局重置与基础 ════════════════ */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
  background: var(--night-deep);
  color: var(--text-warm);
}

/* ═══════════════ 全局按钮增强 ════════════════ */
button {
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}
button:hover {
  transform: translateY(-2px);
}
button:active {
  transform: translateY(0);
}

/* ═══════════════ 顶部导航栏 ════════════════ */
.top-nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 56px;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  background: rgba(16,23,42,0.55);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(226,185,111,0.12);
}

.nav-title {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 20px;
  font-weight: 600;
  letter-spacing: 1.5px;
  color: var(--gold-warm);
  text-shadow: 0 0 12px rgba(226,185,111,0.35);
}

.nav-progress {
  font-size: 13px;
  color: var(--text-soft);
  letter-spacing: 0.5px;
}

.nav-progress .count {
  color: var(--lantern-glow);
  font-weight: 600;
}

/* ═══════════════ 主布局 ════════════════ */
.main-container {
  display: flex;
  height: 100vh;
  padding-top: 56px;
  padding-bottom: 36px;
}

/* ═══════════════ 左侧边栏 ════════════════ */
.sidebar {
  width: 320px;
  flex-shrink: 0;
  padding: 22px 18px;
  padding-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  background: var(--parchment);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-right: 1px solid rgba(226,185,111,0.1);
  overflow-y: auto;
  overflow-x: hidden;
  transition: width 0.35s ease;
  position: relative;
}

/* 侧边栏折叠状态 */
.sidebar.collapsed {
  width: 40px;
  overflow: hidden;
}
.sidebar.collapsed .sidebar-content {
  opacity: 0;
  pointer-events: none;
}

/* 侧边栏折叠/展开按钮 */
.sidebar-collapse-btn {
  position: absolute;
  top: 10px;
  right: 8px;
  z-index: 10;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(16,23,42,0.4);
  border: 1px solid rgba(226,185,111,0.2);
  border-radius: 8px;
  color: var(--gold-warm);
  font-size: 14px;
  cursor: pointer;
  transition: all 0.25s ease;
  padding: 0;
  min-height: 28px;
  min-width: 28px;
}
.sidebar-collapse-btn:hover {
  background: rgba(226,185,111,0.15);
  border-color: rgba(226,185,111,0.4);
  box-shadow: 0 2px 8px rgba(226,185,111,0.15);
}

/* 进度条 */
.progress-bar-track {
  width: 100%;
  height: 4px;
  background: rgba(16,23,42,0.3);
  border-radius: 2px;
  overflow: hidden;
  flex-shrink: 0;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold-warm), var(--lantern-glow));
  border-radius: 2px;
  transition: width 0.5s ease;
  width: 0%;
}

/* 侧边栏内容容器 */
.sidebar-content {
  display: flex;
  flex-direction: column;
  gap: 18px;
  flex: 1;
  min-width: 0;
  transition: opacity 0.25s ease;
}

/* 侧边栏标题区 */
.sidebar-header {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* 搜索输入框 */
.starmap-input {
  width: 100%;
  padding: 12px 16px;
  font-size: 14px;
  line-height: 1.5;
  color: var(--text-warm);
  background: rgba(16,23,42,0.45);
  border: 1px solid rgba(226,185,111,0.25);
  border-radius: 14px;
  outline: none;
  transition: border-color 0.3s ease, box-shadow 0.3s ease;
  font-family: inherit;
}

.starmap-input::placeholder {
  color: var(--text-dim);
  font-style: italic;
}

.starmap-input:focus {
  border-color: rgba(226,185,111,0.65);
  box-shadow: 0 0 18px rgba(226,185,111,0.15), inset 0 0 8px rgba(226,185,111,0.05);
}

/* 展开星图按钮 */
.expand-btn {
  width: 100%;
  padding: 13px 20px;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 2px;
  color: var(--night-deep);
  background: linear-gradient(135deg, #e2b96f 0%, #d4a35c 100%);
  border: none;
  border-radius: 14px;
  cursor: pointer;
  transition: all 0.3s ease;
  font-family: inherit;
  position: relative;
  overflow: hidden;
}

.expand-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.25) 0%, transparent 60%);
  opacity: 0;
  transition: opacity 0.3s ease;
}

.expand-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 24px rgba(226,185,111,0.35), 0 0 12px rgba(226,185,111,0.2);
}

.expand-btn:hover::after {
  opacity: 1;
}

.expand-btn:active {
  transform: translateY(0);
}

/* 知识点卡片列表区 */
.knowledge-list {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 6px;
  min-height: 0;
}

.knowledge-guide {
  text-align: center;
  padding: 36px 16px;
  color: var(--text-dim);
  font-size: 14px;
  line-height: 1.8;
  font-style: italic;
  border: 1px dashed rgba(168,156,196,0.2);
  border-radius: 16px;
  background: rgba(16,23,42,0.2);
}

.knowledge-card {
  padding: 16px 18px;
  background: rgba(16,23,42,0.5);
  border: 1px solid rgba(226,185,111,0.12);
  border-radius: 14px;
  transition: all 0.3s ease;
  cursor: pointer;
}

.knowledge-card:hover {
  border-color: rgba(226,185,111,0.3);
  box-shadow: 0 4px 16px rgba(226,185,111,0.1);
  transform: translateX(4px);
}

.knowledge-card-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--gold-warm);
  margin-bottom: 6px;
  font-family: Georgia, "Times New Roman", serif;
}

.knowledge-card-desc {
  font-size: 13px;
  color: var(--text-soft);
  line-height: 1.5;
}

/* ═══════════════ 行星详情面板 ════════════════ */
.planet-detail {
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 4px 2px;
  animation: fadeIn 0.4s ease both;
  max-height: 100%;
  overflow-y: auto;
}

.back-btn {
  align-self: flex-start;
  padding: 8px 14px;
  font-size: 13px;
  color: var(--text-soft);
  background: rgba(16,23,42,0.4);
  border: 1px solid rgba(226,185,111,0.2);
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.25s ease;
  font-family: inherit;
}

.back-btn:hover {
  color: var(--gold-warm);
  border-color: rgba(226,185,111,0.45);
  background: rgba(16,23,42,0.6);
}

.planet-detail-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-bottom: 14px;
  border-bottom: 1px solid rgba(226,185,111,0.12);
}

.planet-emoji {
  font-size: 32px;
  line-height: 1;
}

.planet-name {
  font-size: 18px;
  font-weight: 600;
  color: var(--gold-warm);
  font-family: Georgia, "Times New Roman", serif;
  letter-spacing: 0.5px;
}

.planet-description {
  font-size: 14px;
  color: var(--text-soft);
  line-height: 1.7;
}

.planet-section {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.section-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

.prerequisite-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.prerequisite-tag {
  padding: 6px 12px;
  font-size: 12px;
  color: var(--gold-warm);
  background: rgba(226,185,111,0.1);
  border: 1px solid rgba(226,185,111,0.2);
  border-radius: 20px;
}

.prerequisite-tag--none {
  color: var(--text-dim);
  background: rgba(16,23,42,0.3);
  border-color: rgba(168,156,196,0.15);
}

/* ═══════════════ 学习任务区域 ════════════════ */
.task-section {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.task-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.task-title-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.task-count {
  font-size: 12px;
  color: var(--text-dim);
  font-weight: 500;
}

.task-count .done {
  color: var(--sage-soft);
  font-weight: 600;
}

.task-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-height: 320px;
  overflow-y: auto;
  padding-right: 4px;
}

/* 细滚动条美化 */
.task-list::-webkit-scrollbar {
  width: 4px;
}
.task-list::-webkit-scrollbar-track {
  background: rgba(16,23,42,0.2);
  border-radius: 2px;
}
.task-list::-webkit-scrollbar-thumb {
  background: rgba(226,185,111,0.25);
  border-radius: 2px;
}
.task-list::-webkit-scrollbar-thumb:hover {
  background: rgba(226,185,111,0.45);
}

/* 任务卡片 — 手写便签风格 */
.task-card {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 16px;
  background: rgba(254,243,212,0.06);
  border: 1px solid rgba(226,185,111,0.15);
  border-left: 3px solid var(--gold-warm);
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
}

.task-card:hover {
  background: rgba(254,243,212,0.1);
  border-color: rgba(226,185,111,0.25);
  border-left-color: var(--lantern-glow);
  transform: translateX(3px);
}

.task-card.completed {
  background: rgba(125,155,122,0.08);
  border-color: rgba(125,155,122,0.2);
  border-left-color: var(--sage-soft);
}

.task-card.completed .task-card-title {
  text-decoration: line-through;
  text-decoration-color: rgba(125,155,122,0.5);
  text-decoration-thickness: 1.5px;
  opacity: 0.6;
}

.task-card.completed .task-card-desc {
  opacity: 0.45;
}

/* 圆形复选框 */
.task-checkbox {
  width: 22px;
  height: 22px;
  min-width: 22px;
  border-radius: 50%;
  border: 2px solid rgba(184,178,160,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  margin-top: 1px;
}

.task-checkbox .checkmark {
  font-size: 12px;
  color: #fff;
  opacity: 0;
  transform: scale(0);
  transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.task-checkbox.checked {
  background: var(--sage-soft);
  border-color: var(--sage-soft);
  transform: scale(1.1);
}

.task-checkbox.checked .checkmark {
  opacity: 1;
  transform: scale(1);
}

.task-card:active .task-checkbox {
  transform: scale(0.9);
}

.task-card:active .task-checkbox.checked {
  transform: scale(0.95);
}

.task-card-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.task-card-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-warm);
  line-height: 1.4;
  transition: opacity 0.3s ease;
}

.task-card-desc {
  font-size: 12px;
  color: var(--text-soft);
  line-height: 1.5;
  transition: opacity 0.3s ease;
}

/* 建造火箭按钮 */
.build-rocket-area {
  margin-top: 8px;
  animation: fadeIn 0.6s ease both, float 3s ease-in-out infinite;
}

.build-rocket-btn {
  width: 100%;
  padding: 14px 20px;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 1.5px;
  color: var(--night-deep);
  background: linear-gradient(135deg, #f5d67b 0%, #e2b96f 50%, #d4a35c 100%);
  border: none;
  border-radius: 14px;
  cursor: pointer;
  transition: all 0.35s ease;
  font-family: inherit;
  position: relative;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(226,185,111,0.3), 0 0 8px rgba(245,214,123,0.15);
}

.build-rocket-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, transparent 50%);
  opacity: 0;
  transition: opacity 0.3s ease;
}

.build-rocket-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 32px rgba(226,185,111,0.45), 0 0 16px rgba(245,214,123,0.25);
}

.build-rocket-btn:hover::after {
  opacity: 1;
}

.build-rocket-btn:active {
  transform: translateY(-1px);
}

.build-rocket-btn .rocket-emoji {
  display: inline-block;
  margin-right: 4px;
  animation: rocketShake 2s ease-in-out infinite;
}

@keyframes rocketShake {
  0%, 100% { transform: rotate(-5deg) translateY(0); }
  25% { transform: rotate(5deg) translateY(-2px); }
  50% { transform: rotate(-3deg) translateY(0); }
  75% { transform: rotate(3deg) translateY(-1px); }
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

/* ═══════════════ 右侧 Canvas 区域 ════════════════ */
.canvas-area {
  flex: 1;
  position: relative;
  overflow: hidden;
  background: linear-gradient(180deg, var(--night-deep) 0%, var(--night-mid) 100%);
}

#starmap-canvas {
  display: block;
  width: 100%;
  height: 100%;
}

/* ═══════════════ 引导卡片 ════════════════ */
.onboarding-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 30;
  transition: opacity 0.6s ease;
}
.onboarding-overlay.hidden {
  opacity: 0;
  pointer-events: none;
}
.onboarding-card {
  max-width: 420px;
  width: 90%;
  padding: 36px 32px;
  background: rgba(42,38,55,0.75);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(226,185,111,0.25);
  border-radius: 20px;
  text-align: center;
  animation: fadeIn 0.8s ease both;
}
.onboarding-quote {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 17px;
  line-height: 1.9;
  color: var(--star-cream);
  margin-bottom: 28px;
  text-shadow: 0 0 12px rgba(226,185,111,0.3);
}
.onboarding-buttons {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 24px;
}
.onboarding-quick-btn {
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 600;
  color: var(--night-deep);
  background: linear-gradient(135deg, #e2b96f 0%, #d4a35c 100%);
  border: none;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.3s ease;
  font-family: inherit;
  letter-spacing: 0.5px;
  min-height: 44px;
  min-width: 44px;
}
.onboarding-quick-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(226,185,111,0.35), 0 0 12px rgba(226,185,111,0.2);
}
.onboarding-quick-btn:active {
  transform: translateY(0);
}
.onboarding-custom {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.onboarding-custom-label {
  font-size: 13px;
  color: var(--text-dim);
  font-style: italic;
}
.onboarding-custom-row {
  display: flex;
  gap: 8px;
  width: 100%;
  align-items: center;
}
.onboarding-custom-input {
  flex: 1;
  padding: 10px 14px;
  font-size: 14px;
  color: var(--text-warm);
  background: rgba(16,23,42,0.45);
  border: 1px solid rgba(226,185,111,0.25);
  border-radius: 12px;
  outline: none;
  transition: border-color 0.3s ease, box-shadow 0.3s ease;
  font-family: inherit;
  min-height: 44px;
}
.onboarding-custom-input::placeholder {
  color: var(--text-dim);
  font-style: italic;
}
.onboarding-custom-input:focus {
  border-color: rgba(226,185,111,0.65);
  box-shadow: 0 0 14px rgba(226,185,111,0.15);
}
.onboarding-go-btn {
  padding: 10px 18px;
  font-size: 14px;
  font-weight: 600;
  color: var(--night-deep);
  background: linear-gradient(135deg, #e2b96f 0%, #d4a35c 100%);
  border: none;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.3s ease;
  font-family: inherit;
  white-space: nowrap;
  min-height: 44px;
  min-width: 44px;
}
.onboarding-go-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(226,185,111,0.35), 0 0 12px rgba(226,185,111,0.2);
}
.onboarding-go-btn:active {
  transform: translateY(0);
}

/* 右下角装饰大四角星 */
.corner-star {
  position: absolute;
  bottom: 28px;
  right: 28px;
  width: 44px;
  height: 44px;
  pointer-events: none;
  opacity: 0.6;
}

/* ═══════════════ 底部状态栏（Footer） ════════════════ */
.status-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 36px;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  line-height: 10px;
  letter-spacing: 0.8px;
  color: var(--text-dim);
  background: rgba(16,23,42,0.5);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid rgba(226,185,111,0.1);
}

.status-bar .highlight {
  color: var(--lantern-glow);
  font-weight: 600;
}

.status-bar-left {
  position: absolute;
  left: 20px;
}

.reset-btn {
  font-size: 11px;
  color: var(--text-dim);
  background: transparent;
  border: none;
  cursor: pointer;
  transition: color 0.25s ease;
  font-family: inherit;
  letter-spacing: 0.5px;
  min-height: 44px;
  min-width: 44px;
}

.reset-btn:hover {
  color: var(--rose-dusty);
}

/* ═══════════════ 移动端侧边栏切换 ════════════════ */
.sidebar-toggle {
  display: none;
  position: fixed;
  top: 68px;
  left: 14px;
  z-index: 90;
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: var(--parchment);
  border: 1px solid rgba(226,185,111,0.2);
  color: var(--gold-warm);
  font-size: 18px;
  cursor: pointer;
  backdrop-filter: blur(10px);
  min-height: 44px;
  min-width: 44px;
}

/* ═══════════════ 响应式：小屏幕 ════════════════ */
@media (max-width: 768px) {
  .main-container {
    flex-direction: column;
    padding-top: 44px;
    padding-bottom: 36px;
  }

  .top-nav {
    height: 44px;
    padding: 0 16px;
  }

  .sidebar {
    position: fixed;
    bottom: 36px;
    left: 0;
    right: 0;
    top: auto;
    width: 100% !important;
    height: 60vh;
    z-index: 80;
    transform: translateY(100%);
    border-right: none;
    border-top: 1px solid rgba(226,185,111,0.15);
    border-radius: 20px 20px 0 0;
    transition: transform 0.35s ease, width 0.35s ease;
  }
  .sidebar.collapsed {
    width: 100% !important;
  }
  .sidebar.open {
    transform: translateY(0);
  }

  .sidebar-collapse-btn {
    display: none;
  }

  .sidebar-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    position: fixed;
    top: auto;
    bottom: 44px;
    right: 14px;
    left: auto;
  }

  .canvas-area {
    width: 100%;
  }

  .nav-title {
    font-size: 17px;
  }

  /* 引导卡片移动端适配 */
  .onboarding-card {
    padding: 24px 20px;
    max-width: 340px;
  }
  .onboarding-quote {
    font-size: 14px;
  }
  .onboarding-quick-btn {
    font-size: 13px;
    padding: 10px 14px;
  }

  /* 确保所有按钮有最小触摸区域 */
  .expand-btn,
  .back-btn,
  .build-rocket-btn,
  .achievement-btn,
  .poster-sidebar-btn,
  .skip-btn {
    min-height: 44px;
    min-width: 44px;
  }
}

/* ═══════════════ 入场动画 ════════════════ */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.sidebar-header,
.knowledge-list {
  animation: fadeIn 0.8s ease both;
}

.sidebar-header { animation-delay: 0.1s; }
.knowledge-list  { animation-delay: 0.25s; }

/* ═══════════════ 火箭动画 UI ════════════════ */
.skip-btn {
  position: absolute;
  top: 14px;
  right: 14px;
  z-index: 50;
  padding: 6px 14px;
  font-size: 13px;
  color: var(--text-soft);
  background: rgba(16,23,42,0.6);
  border: 1px solid rgba(226,185,111,0.2);
  border-radius: 10px;
  cursor: pointer;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s ease, visibility 0.3s ease, color 0.25s ease;
  font-family: inherit;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.skip-btn.visible {
  opacity: 0.45;
  visibility: visible;
}
.canvas-area:hover .skip-btn.visible {
  opacity: 0.8;
}
.skip-btn:hover {
  opacity: 1 !important;
  color: var(--gold-warm);
  border-color: rgba(226,185,111,0.5);
}

.quote-overlay {
  position: absolute;
  bottom: 64px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 40;
  max-width: 68%;
  text-align: center;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 15px;
  font-style: italic;
  line-height: 1.8;
  color: var(--star-cream);
  text-shadow: 0 0 16px rgba(226,185,111,0.4), 0 2px 8px rgba(0,0,0,0.5);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.9s ease;
}
.quote-overlay.show {
  opacity: 0.92;
}

@keyframes screenShake {
  0%   { transform: translate(0, 0); }
  25%  { transform: translate(-2px, -1px); }
  50%  { transform: translate(2px, 1px); }
  75%  { transform: translate(-1px, 1px); }
  100% { transform: translate(0, 0); }
}
.canvas-area.shaking {
  animation: screenShake 0.1s linear infinite;
}

.build-rocket-btn.pulsing {
  animation: btnPulse 1.5s ease-in-out infinite;
}
.build-rocket-btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
  transform: none !important;
}
@keyframes btnPulse {
  0%, 100% { box-shadow: 0 4px 20px rgba(226,185,111,0.3), 0 0 8px rgba(245,214,123,0.15); }
  50%      { box-shadow: 0 4px 30px rgba(226,185,111,0.6), 0 0 28px rgba(245,214,123,0.45); }
}

/* ═══════════════ 成就弹窗 ════════════════ */
.achievement-overlay {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(16,23,42,0.55);
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.35s ease, visibility 0.35s ease;
}
.achievement-overlay.show {
  opacity: 1;
  visibility: visible;
}

.achievement-card {
  width: 360px;
  padding: 32px 28px 24px;
  background: var(--parchment);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--border-glow, rgba(226,185,111,0.3));
  border-radius: 20px;
  box-shadow: 0 12px 48px rgba(0,0,0,0.4), 0 0 32px rgba(226,185,111,0.12);
  text-align: center;
  transform: scale(0.8);
  opacity: 0;
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
}
.achievement-overlay.show .achievement-card {
  transform: scale(1);
  opacity: 1;
}

.achievement-stars {
  font-size: 22px;
  letter-spacing: 8px;
  margin-bottom: 8px;
  color: var(--lantern-glow);
  text-shadow: 0 0 12px rgba(245,214,123,0.5);
}

.achievement-title {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--gold-warm);
  text-shadow: 0 0 16px rgba(226,185,111,0.35);
  margin-bottom: 6px;
}

.achievement-subtitle {
  font-size: 14px;
  color: var(--text-soft);
  margin-bottom: 18px;
  line-height: 1.6;
  white-space: pre-line;
}

.achievement-quote-box {
  position: relative;
  padding: 14px 18px;
  margin-bottom: 22px;
  background: rgba(16,23,42,0.3);
  border-radius: 12px;
  text-align: left;
}
.achievement-quote-box::before {
  content: '';
  position: absolute;
  left: 0;
  top: 10px;
  bottom: 10px;
  width: 3px;
  border-radius: 0 3px 3px 0;
  background: var(--gold-warm);
  opacity: 0.6;
}
.achievement-quote-text {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 12px;
  font-style: italic;
  line-height: 1.8;
  color: var(--text-soft);
  padding-left: 14px;
}
.achievement-quote-source {
  font-size: 11px;
  color: var(--text-dim);
  text-align: right;
  padding-left: 14px;
  margin-top: 6px;
}

.achievement-actions {
  display: flex;
  gap: 12px;
  justify-content: center;
}
.achievement-btn {
  padding: 10px 22px;
  font-size: 14px;
  font-weight: 600;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.3s ease;
  font-family: inherit;
  letter-spacing: 0.5px;
  min-height: 44px;
  min-width: 44px;
}
.achievement-btn--primary {
  color: var(--night-deep);
  background: linear-gradient(135deg, #e2b96f 0%, #d4a35c 100%);
  border: none;
  box-shadow: 0 4px 16px rgba(226,185,111,0.3);
}
.achievement-btn--primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 24px rgba(226,185,111,0.45);
}
.achievement-btn--secondary {
  color: var(--text-soft);
  background: rgba(16,23,42,0.4);
  border: 1px solid rgba(226,185,111,0.2);
}
.achievement-btn--secondary:hover {
  color: var(--gold-warm);
  border-color: rgba(226,185,111,0.45);
}

/* ═══════════════ 海报预览遮罩 ════════════════ */
.poster-overlay {
  position: fixed;
  inset: 0;
  z-index: 210;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  opacity: 0;
  transition: transform 0.4s ease, opacity 0.4s ease;
}

  transform: scale(1);
  opacity: 1;
}
.poster-actions {
  display: flex;
  gap: 16px;
  margin-top: 20px;
}

/* ═══════════════ 侧边栏海报按钮 ════════════════ */

/* ============================================================

const STORAGE_KEY = 'knowledgeStarmapData';

function loadStarmapData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) {
    console.warn('读取本地数据失败:', e);
    return null;
  }
}

function saveStarmapData(data) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    console.warn('保存本地数据失败:', e);
  }
}

/* ============================================================
   层级坐标自动排布算法
   ============================================================ */

function computeLayout(nodes, canvasWidth, canvasHeight) {
  const depthMap = new Map();

  function getDepth(node) {
    if (depthMap.has(node.id)) return depthMap.get(node.id);
    if (!node.dependencies || node.dependencies.length === 0) {
      depthMap.set(node.id, 0);
      return 0;
    }
    let maxDepDepth = -1;
    for (const depId of node.dependencies) {
      const depNode = nodes.find(n => n.id === depId);
      if (depNode) {
        maxDepDepth = Math.max(maxDepDepth, getDepth(depNode));
      }
    }
    const depth = maxDepDepth + 1;
    depthMap.set(node.id, depth);
    return depth;
  }

  nodes.forEach(n => getDepth(n));

  const layers = [];
  for (const node of nodes) {
    const d = depthMap.get(node.id);
    if (!layers[d]) layers[d] = [];
    layers[d].push(node);
  }

  const marginX = 80;
  const marginY = 70;
  const minSpacingX = 120;
  const layerHeight = 110;

  layers.forEach((layer, depth) => {
    if (!layer) return;
    const count = layer.length;
    if (count === 1) {
      layer[0].x = canvasWidth / 2;
    } else {
      const neededWidth = (count - 1) * minSpacingX;
      const availableWidth = Math.max(0, canvasWidth - marginX * 2);
      if (neededWidth <= availableWidth) {
        const startX = (canvasWidth - neededWidth) / 2;
        layer.forEach((node, i) => {
          node.x = startX + i * minSpacingX;
        });
      } else {
        const spacing = availableWidth / (count - 1);
        layer.forEach((node, i) => {
          node.x = marginX + i * spacing;
        });
      }
    }
    layer.forEach(node => {
      node.y = marginY + depth * layerHeight;
    });
  });
}

/* ============================================================
   星空画布管理器（背景渲染）
   ============================================================ */

class StarfieldRenderer {
  constructor(canvasId) {
    this.canvas = document.getElementById(canvasId);
    this.ctx = this.canvas.getContext('2d');
    this.stars = [];
    this.width = 0;
    this.height = 0;
    this.dpr = window.devicePixelRatio || 1;
    this.brightnessBoost = 0;

    this.resize();
    this.createStars(280);
  }

  resize() {
    const parent = this.canvas.parentElement;
    this.width = parent.clientWidth;
    this.height = parent.clientHeight;

    this.canvas.width = this.width * this.dpr;
    this.canvas.height = this.height * this.dpr;
    this.canvas.style.width = this.width + 'px';
    this.canvas.style.height = this.height + 'px';

    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
  }

  createStars(count) {
    this.stars = [];
    for (let i = 0; i < count; i++) {
      this.stars.push(this.makeStar());
    }
  }

  makeStar() {
    const isCross = Math.random() < 0.2;
    const hasGlow = Math.random() < 0.15;
    const palettes = [
      '#fef3d4',
      '#f5d67b',
      '#e2b96f',
      '#a89cc4',
      '#b8b2a0',
    ];

    return {
      x: Math.random() * this.width,
      y: Math.random() * this.height,
      baseRadius: isCross
        ? 1.2 + Math.random() * 1.6
        : 0.5 + Math.random() * 1.5,
      color: palettes[Math.floor(Math.random() * palettes.length)],
      isCross,
      hasGlow,
      twinklePhase: Math.random() * Math.PI * 2,
      twinkleSpeed: 0.3 + Math.random() * 0.8,
      twinkleAmp: 0.2 + Math.random() * 0.5,
      driftX: (Math.random() - 0.5) * 0.15,
      driftY: (Math.random() - 0.5) * 0.12,
    };
  }

  drawDotStar(ctx, star, opacity) {
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.baseRadius, 0, Math.PI * 2);
    ctx.fillStyle = star.color;
    ctx.globalAlpha = opacity;
    ctx.fill();
  }

  drawCrossStar(ctx, star, opacity) {
    const { x, y, baseRadius: r } = star;
    const inner = r * 0.35;

    ctx.beginPath();
    ctx.moveTo(x, y - r);
    ctx.lineTo(x + inner, y - inner);
    ctx.lineTo(x + r, y);
    ctx.lineTo(x + inner, y + inner);
    ctx.lineTo(x, y + r);
    ctx.lineTo(x - inner, y + inner);
    ctx.lineTo(x - r, y);
    ctx.lineTo(x - inner, y - inner);
    ctx.closePath();

    ctx.fillStyle = star.color;
    ctx.globalAlpha = opacity;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(x, y, r * 0.25, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.globalAlpha = opacity * 0.6;
    ctx.fill();
  }

  drawWithGlow(ctx, star, opacity, drawFn) {
    ctx.save();
    ctx.shadowBlur = 14 + star.baseRadius * 3;
    ctx.shadowColor = star.color;
    drawFn(ctx, star, opacity * 0.85);
    ctx.restore();
    drawFn(ctx, star, opacity);
  }

  render(timestamp) {
    const ctx = this.ctx;
    const t = timestamp / 1000;

    ctx.clearRect(0, 0, this.width, this.height);

    const grad = ctx.createLinearGradient(0, 0, 0, this.height);
    grad.addColorStop(0, '#10172a');
    grad.addColorStop(1, '#1b2443');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, this.width, this.height);

    for (const star of this.stars) {
      const twinkle = Math.sin(t * star.twinkleSpeed + star.twinklePhase);
      const opacity = 0.45 + star.twinkleAmp * twinkle;
      const clampedOpacity = Math.max(0.15, Math.min(1, opacity)) * (1 + this.brightnessBoost);

      star.x += star.driftX;
      star.y += star.driftY;

      if (star.x < -10) star.x = this.width + 10;
      if (star.x > this.width + 10) star.x = -10;
      if (star.y < -10) star.y = this.height + 10;
      if (star.y > this.height + 10) star.y = -10;

      const drawFn = star.isCross ? this.drawCrossStar : this.drawDotStar;
      if (star.hasGlow) {
        this.drawWithGlow(ctx, star, clampedOpacity, drawFn.bind(this));
      } else {
        drawFn.call(this, ctx, star, clampedOpacity);
      }
    }

    ctx.globalAlpha = 1;
  }
}

/* ============================================================
   小行星渲染引擎（行星、连线、交互）
   ============================================================ */

class PlanetRenderer {
  constructor(canvasId, starfield) {
    this.canvas = document.getElementById(canvasId);
    this.ctx = this.canvas.getContext('2d');
    this.starfield = starfield;
    this.planets = [];
    this.hoveredPlanet = null;
    this.selectedPlanet = null;
    this.currentDomain = null;
    this.ui = null;
    this.interactionLocked = false;
    this.rocketAnimator = null;
    this.lightAnimator = null;
    this.constellationAnimator = null;

    this.dpr = window.devicePixelRatio || 1;
    this.width = 0;
    this.height = 0;

    this.resize();
    this.bindEvents();
    this.startLoop();
  }

  setUI(ui) {
    this.ui = ui;
  }

  resize() {
    const parent = this.canvas.parentElement;
    this.width = parent.clientWidth;
    this.height = parent.clientHeight;

    this.canvas.width = this.width * this.dpr;
    this.canvas.height = this.height * this.dpr;
    this.canvas.style.width = this.width + 'px';
    this.canvas.style.height = this.height + 'px';

    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);

    // 同步更新 starfield
    this.starfield.width = this.width;
    this.starfield.height = this.height;
    this.starfield.canvas.width = this.width * this.dpr;
    this.starfield.canvas.height = this.height * this.dpr;
    this.starfield.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);

    if (this.currentDomain && this.planets.length > 0) {
      computeLayout(this.planets, this.width, this.height);
    }
  }

  loadDomain(domainData) {
    this.currentDomain = domainData;
    this.planets = domainData.nodes.map(n => ({
      ...n,
      x: 0,
      y: 0,
      hasRing: n.hasRing !== undefined ? n.hasRing : Math.random() < 0.35
    }));
    computeLayout(this.planets, this.width, this.height);
    this.selectedPlanet = null;
    this.hoveredPlanet = null;
  }

  render(timestamp) {
    // 1. 背景星空
    this.starfield.render(timestamp);

    // 2. 行星点亮动画层（鼓励卡片）
    if (this.lightAnimator) {
      this.lightAnimator.render(this.ctx, timestamp);
    }

    // 3. 星座连线动画（优先于默认连线）
    if (this.constellationAnimator && this.constellationAnimator.animating) {
      this.constellationAnimator.render(this.ctx, timestamp);
    } else {
      // 3a. 默认依赖连线
      this.renderLinks();
    }

    // 4. 行星与标签
    const t = timestamp / 1000;
    for (const planet of this.planets) {
      this.renderPlanet(planet, t);
    }
    for (const planet of this.planets) {
      this.renderLabel(planet);
    }

    // 5. 火箭动画层
    if (this.rocketAnimator) {
      this.rocketAnimator.render(this.ctx, timestamp);
    }
  }

  renderLinks() {
    const ctx = this.ctx;
    ctx.save();
    ctx.strokeStyle = 'rgba(226,185,111,0.3)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 6]);

    for (const planet of this.planets) {
      if (!planet.dependencies || planet.dependencies.length === 0) continue;
      for (const depId of planet.dependencies) {
        const dep = this.planets.find(p => p.id === depId);
        if (!dep) continue;
        ctx.beginPath();
        ctx.moveTo(dep.x, dep.y);
        ctx.lineTo(planet.x, planet.y);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  allTasksCompleted(planet) {
    if (!planet.tasks || planet.tasks.length === 0) return false;
    return planet.tasks.every(t => t.completed);
  }

  renderPlanet(planet, t) {
    const ctx = this.ctx;
    const isHover = this.hoveredPlanet === planet;
    const isSelected = this.selectedPlanet === planet;
    const scale = isHover ? 1.15 : 1;
    const baseR = planet.radius * scale;

    ctx.save();
    ctx.translate(planet.x, planet.y);

    // 脉动效果（已点亮 — 使用 lightAnimator 的呼吸脉动或默认）
    let pulseScale = 1;
    let breathOffset = 0;
    if (planet.lit) {
      if (planet._lightAnim) {
        breathOffset = planet._lightAnim.breathPulse;
        pulseScale = 1;
      } else {
        pulseScale = 1 + Math.sin(t * 2 + planet.x * 0.01) * 0.04;
      }
    }
    var r = baseR * pulseScale;

    // 全部任务完成但未点亮时的金色闪烁光点环绕
    const allDone = this.allTasksCompleted(planet);
    if (allDone && !planet.lit) {
      this.renderSparkles(planet, r, t);
    }

    // 小行星闪烁：未点亮的行星偶尔随机闪烁微弱紫光
    if (!planet.lit && !allDone) {
      var flicker = Math.sin(t * 0.5 + planet.x * 0.1);
      if (flicker > 0.92) {
        var flickerAlpha = (flicker - 0.92) / 0.08 * 0.35;
        var flickerGlow = ctx.createRadialGradient(0, 0, r * 0.5, 0, 0, r + 10);
        flickerGlow.addColorStop(0, 'rgba(168,156,196,' + flickerAlpha + ')');
        flickerGlow.addColorStop(1, 'rgba(168,156,196,0)');
        ctx.fillStyle = flickerGlow;
        ctx.beginPath();
        ctx.arc(0, 0, r + 10, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 光晕
    if (isHover || isSelected || planet.lit || allDone) {
      var glowExtra = planet.lit ? 18 : (allDone ? 22 : 12);
      var glowR = r + glowExtra + (planet._lightAnim ? Math.abs(planet._lightAnim.breathPulse) * 0.5 : 0);
      var glow = ctx.createRadialGradient(0, 0, r * 0.7, 0, 0, glowR);
      if (planet.lit) {
        glow.addColorStop(0, 'rgba(226,185,111,' + (0.35 + (planet._lightAnim ? 0.05 : 0)) + ')');
        glow.addColorStop(1, 'rgba(226,185,111,0)');
      } else if (allDone) {
        glow.addColorStop(0, 'rgba(245,214,123,0.45)');
        glow.addColorStop(1, 'rgba(245,214,123,0)');
      } else {
        glow.addColorStop(0, 'rgba(226,185,111,0.2)');
        glow.addColorStop(1, 'rgba(226,185,111,0)');
      }
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, glowR, 0, Math.PI * 2);
      ctx.fill();
    }

    // 行星主体
    if (planet.lit && planet._lightAnim && planet._lightAnim.colorT < 1) {
      // 点亮过渡动画：用 lerpColor
      var cc = planet._lightAnim.currentColor;
      var grad = ctx.createRadialGradient(-r * 0.25, -r * 0.25, r * 0.12, 0, 0, r);
      grad.addColorStop(0, rgbStr(lerpColor(cc, [255, 245, 214], 0.3)));
      grad.addColorStop(0.3, rgbStr(lerpColor(cc, [245, 214, 123], 0.2)));
      grad.addColorStop(0.7, rgbStr(cc));
      grad.addColorStop(1, rgbStr(lerpColor(cc, [184, 148, 63], 0.3)));
      ctx.fillStyle = grad;
    } else if (planet.lit) {
      var grad = ctx.createRadialGradient(-r * 0.25, -r * 0.25, r * 0.12, 0, 0, r);
      grad.addColorStop(0, '#fff5d6');
      grad.addColorStop(0.3, '#f5d67b');
      grad.addColorStop(0.7, '#e2b96f');
      grad.addColorStop(1, '#b8943f');
      ctx.fillStyle = grad;
    } else if (allDone) {
      var grad = ctx.createRadialGradient(-r * 0.25, -r * 0.25, r * 0.12, 0, 0, r);
      grad.addColorStop(0, '#f5e6b8');
      grad.addColorStop(0.4, '#d4b86a');
      grad.addColorStop(0.8, '#a88d4a');
      grad.addColorStop(1, '#7a6a35');
      ctx.fillStyle = grad;
    } else {
      var grad = ctx.createRadialGradient(-r * 0.25, -r * 0.25, r * 0.12, 0, 0, r);
      grad.addColorStop(0, '#8a9bb8');
      grad.addColorStop(0.4, '#5e6d8a');
      grad.addColorStop(0.8, '#3d4760');
      grad.addColorStop(1, '#2a3045');
      ctx.fillStyle = grad;
    }

    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();

    // 内阴影（体积感）
    var shadowGrad = ctx.createRadialGradient(r * 0.3, r * 0.3, 0, 0, 0, r);
    shadowGrad.addColorStop(0, 'rgba(0,0,0,0)');
    shadowGrad.addColorStop(0.6, 'rgba(0,0,0,0)');
    shadowGrad.addColorStop(1, 'rgba(0,0,0,0.4)');
    ctx.fillStyle = shadowGrad;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();

    // 星芒（点亮动画中）
    if (planet._lightAnim && planet._lightAnim.rayT > 0) {
      var rayT = planet._lightAnim.rayT;
      var rayLen = 10 * rayT;
      var rayAlpha = rayT;
      ctx.save();
      ctx.strokeStyle = 'rgba(254,243,212,' + rayAlpha + ')';
      ctx.lineWidth = 1.5;
      ctx.shadowBlur = 6;
      ctx.shadowColor = '#fef3d4';
      // 四条十字星芒
      for (var ri = 0; ri < 4; ri++) {
        var angle = (Math.PI / 4) * (ri * 2);
        ctx.beginPath();
        ctx.moveTo(Math.cos(angle) * (r + 4), Math.sin(angle) * (r + 4));
        ctx.lineTo(Math.cos(angle) * (r + 4 + rayLen), Math.sin(angle) * (r + 4 + rayLen));
        ctx.stroke();
      }
      ctx.restore();
    }

    // 星环
    if (planet.hasRing) {
      ctx.save();
      ctx.rotate(Math.PI / 5);
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 1.55, r * 0.32, 0, 0, Math.PI * 2);
      ctx.strokeStyle = planet.lit ? 'rgba(226,185,111,0.5)' : 'rgba(168,156,196,0.4)';
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.restore();
    }

    // 选中虚线环
    if (isSelected) {
      ctx.beginPath();
      ctx.arc(0, 0, r + 10, 0, Math.PI * 2);
      ctx.strokeStyle = '#e2b96f';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([3, 4]);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.restore();
  }

  renderSparkles(planet, r, t) {
    const ctx = this.ctx;
    const count = 6;
    for (let i = 0; i < count; i++) {
      const angle = t * 1.5 + (Math.PI * 2 * i / count);
      const dist = r + 12 + Math.sin(t * 3 + i) * 3;
      const sx = Math.cos(angle) * dist;
      const sy = Math.sin(angle) * dist;
      const alpha = 0.5 + Math.sin(t * 4 + i * 1.3) * 0.3;
      const size = 1.5 + Math.sin(t * 2 + i) * 0.8;

      ctx.save();
      ctx.shadowBlur = 8;
      ctx.shadowColor = '#f5d67b';
      ctx.fillStyle = `rgba(245,214,123,${alpha})`;
      ctx.beginPath();
      ctx.arc(sx, sy, size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  renderLabel(planet) {
    const ctx = this.ctx;
    const allDone = this.allTasksCompleted(planet);
    ctx.save();
    ctx.font = '13px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    if (planet.lit) {
      // 点亮过渡中颜色插值
      if (planet._lightAnim && planet._lightAnim.colorT < 1) {
        var tc = lerpColor([184, 178, 160], [245, 214, 123], planet._lightAnim.colorT);
        ctx.fillStyle = rgbStr(tc);
      } else {
        ctx.fillStyle = '#f5d67b';
      }
    } else if (allDone) {
      ctx.fillStyle = '#f5d67b';
    } else {
      ctx.fillStyle = '#b8b2a0';
    }
    ctx.fillText(planet.name, planet.x, planet.y + planet.radius * 1.15 + 18);
    ctx.restore();
  }

  bindEvents() {
    this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
    this.canvas.addEventListener('click', (e) => this.handleClick(e));
    this.canvas.addEventListener('mouseleave', () => {
      this.hoveredPlanet = null;
      this.canvas.style.cursor = 'default';
    });
    window.addEventListener('resize', () => this.resize());
  }

  handleMouseMove(e) {
    const rect = this.canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    let hovered = null;
    for (const planet of this.planets) {
      const dist = Math.hypot(mx - planet.x, my - planet.y);
      if (dist < planet.radius + 6) {
        hovered = planet;
        break;
      }
    }

    this.hoveredPlanet = hovered;
    this.canvas.style.cursor = hovered ? 'pointer' : 'default';
  }

  handleClick(e) {
    if (this.interactionLocked) return;
    const rect = this.canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    let clicked = null;
    for (const planet of this.planets) {
      const dist = Math.hypot(mx - planet.x, my - planet.y);
      if (dist < planet.radius + 6) {
        clicked = planet;
        break;
      }
    }

    if (clicked) {
      this.selectedPlanet = clicked;
      if (this.ui) {
        this.ui.showPlanetDetail(clicked);
      }
    } else {
      this.selectedPlanet = null;
      if (this.ui) {
        this.ui.showPlanetList();
      }
    }
  }

  startLoop() {
    const loop = (timestamp) => {
      this.render(timestamp);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
}

/* ============================================================
   童话火箭绘制函数 drawRocket
   （x,y = 火箭机身中心；scale 整体缩放；flameIntensity 0~1.2；
    wobble 火焰左右摇曳像素；parts 各部件出现进度 0~1）
   ============================================================ */

function drawRocket(ctx, x, y, scale, flameIntensity, wobble, parts) {
  var p = parts || {};
  var finsProg = p.fins !== undefined ? p.fins : 1;
  var bodyProg = p.body !== undefined ? p.body : 1;
  var headProg = p.head !== undefined ? p.head : 1;
  var portProg = p.porthole !== undefined ? p.porthole : 1;

  function bounce(t) {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    if (t < 0.7) return (t / 0.7) * 1.1;
    return 1.1 - ((t - 0.7) / 0.3) * 0.1;
  }

  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);

  /* ---- 暖金尾焰（蜡烛火焰风格，三层渐变） ---- */
  if (flameIntensity > 0.01) {
    var baseY = 28;
    var len = 14 + flameIntensity * 30;
    var tipY = baseY + len;
    var w = 5 + flameIntensity * 3.5;
    var wob = wobble;

    // 外层（玫瑰微红）
    ctx.beginPath();
    ctx.moveTo(-w, baseY);
    ctx.bezierCurveTo(-w * 0.6, baseY + len * 0.35, -w * 0.25 + wob * 0.4, baseY + len * 0.75, wob, tipY);
    ctx.bezierCurveTo(w * 0.25 + wob * 0.4, baseY + len * 0.75, w * 0.6, baseY + len * 0.35, w, baseY);
    ctx.closePath();
    var g0 = ctx.createLinearGradient(0, baseY, 0, tipY);
    g0.addColorStop(0, 'rgba(245,214,123,0.85)');
    g0.addColorStop(0.45, 'rgba(226,185,111,0.6)');
    g0.addColorStop(1, 'rgba(212,120,110,0)');
    ctx.fillStyle = g0;
    ctx.fill();

    // 中层（暖金）
    var mw = w * 0.62, mlen = len * 0.78;
    ctx.beginPath();
    ctx.moveTo(-mw, baseY);
    ctx.bezierCurveTo(-mw * 0.5, baseY + mlen * 0.35, -mw * 0.15 + wob * 0.3, baseY + mlen * 0.75, wob, baseY + mlen);
    ctx.bezierCurveTo(mw * 0.15 + wob * 0.3, baseY + mlen * 0.75, mw * 0.5, baseY + mlen * 0.35, mw, baseY);
    ctx.closePath();
    var g1 = ctx.createLinearGradient(0, baseY, 0, baseY + mlen);
    g1.addColorStop(0, 'rgba(254,243,212,0.95)');
    g1.addColorStop(0.5, 'rgba(226,185,111,0.8)');
    g1.addColorStop(1, 'rgba(245,214,123,0)');
    ctx.fillStyle = g1;
    ctx.fill();

    // 核心（白热）
    var cw = w * 0.32, clen = len * 0.5;
    ctx.beginPath();
    ctx.moveTo(-cw, baseY);
    ctx.bezierCurveTo(-cw * 0.3, baseY + clen * 0.4, wob * 0.2, baseY + clen * 0.8, wob, baseY + clen);
    ctx.bezierCurveTo(cw * 0.3, baseY + clen * 0.4, cw, baseY, cw, baseY);
    ctx.closePath();
    ctx.fillStyle = 'rgba(254,243,212,0.92)';
    ctx.fill();
  }

  /* ---- 弧形尾翼（左右，圆润无锐角） ---- */
  if (finsProg > 0.01) {
    var fs = bounce(finsProg);
    ctx.save();
    ctx.globalAlpha = Math.min(1, finsProg);
    ctx.translate(0, 22);
    ctx.scale(fs, fs);
    ctx.translate(0, -22);
    ctx.fillStyle = '#d4786e';
    // 左尾翼
    ctx.beginPath();
    ctx.moveTo(-10, 14);
    ctx.bezierCurveTo(-22, 18, -22, 34, -12, 31);
    ctx.bezierCurveTo(-11, 27, -10, 22, -10, 14);
    ctx.closePath();
    ctx.fill();
    // 右尾翼
    ctx.beginPath();
    ctx.moveTo(10, 14);
    ctx.bezierCurveTo(22, 18, 22, 34, 12, 31);
    ctx.bezierCurveTo(11, 27, 10, 22, 10, 14);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  /* ---- 机身主体（黄铜暖色，圆胖鼓起） ---- */
  if (bodyProg > 0.01) {
    var bs = bounce(bodyProg);
    ctx.save();
    ctx.globalAlpha = Math.min(1, bodyProg);
    ctx.translate(0, 3);
    ctx.scale(bs, bs);
    ctx.translate(0, -3);

    var bg = ctx.createLinearGradient(0, -22, 0, 28);
    bg.addColorStop(0, '#d4a55a');
    bg.addColorStop(0.5, '#b8893f');
    bg.addColorStop(1, '#8b6914');
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(-11, -22);
    ctx.bezierCurveTo(-14, -8, -14, 14, -10, 28);
    ctx.bezierCurveTo(-5, 30, 5, 30, 10, 28);
    ctx.bezierCurveTo(14, 14, 14, -8, 11, -22);
    ctx.bezierCurveTo(5, -20, -5, -20, -11, -22);
    ctx.closePath();
    ctx.fill();

    // 暖金色高光线（左边缘偏上）
    ctx.strokeStyle = 'rgba(245,214,123,0.55)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-9, -18);
    ctx.bezierCurveTo(-12, -6, -12, 10, -8, 22);
    ctx.stroke();
    ctx.restore();
  }

  /* ---- 圆锥形头部（暖金色，圆润弧顶） ---- */
  if (headProg > 0.01) {
    var hs = bounce(headProg);
    ctx.save();
    ctx.globalAlpha = Math.min(1, headProg);
    ctx.translate(0, -33);
    ctx.scale(hs, hs);
    ctx.translate(0, 33);

    var hg = ctx.createLinearGradient(0, -45, 0, -22);
    hg.addColorStop(0, '#fef3d4');
    hg.addColorStop(0.5, '#e2b96f');
    hg.addColorStop(1, '#d4a55a');
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.moveTo(-11, -22);
    ctx.bezierCurveTo(-10, -33, -5, -43, 0, -45);
    ctx.bezierCurveTo(5, -43, 10, -33, 11, -22);
    ctx.bezierCurveTo(5, -20, -5, -20, -11, -22);
    ctx.closePath();
    ctx.fill();

    // 顶部小圆点（星星装饰）
    ctx.beginPath();
    ctx.arc(0, -44, 2.2, 0, Math.PI * 2);
    ctx.fillStyle = '#fef3d4';
    ctx.shadowBlur = 6;
    ctx.shadowColor = '#f5d67b';
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  /* ---- 圆形舷窗（柔光内发光） ---- */
  if (portProg > 0.01) {
    var ps = bounce(portProg);
    ctx.save();
    ctx.globalAlpha = Math.min(1, portProg);
    ctx.translate(0, -6);
    ctx.scale(ps, ps);
    ctx.translate(0, 6);

    // 内部径向渐变（中心亮 → 边缘暗，像里面有一盏小灯）
    var pg = ctx.createRadialGradient(-2, -8, 1, 0, -6, 8);
    pg.addColorStop(0, '#fef3d4');
    pg.addColorStop(0.35, '#f5d67b');
    pg.addColorStop(0.7, '#e2b96f');
    pg.addColorStop(1, '#8b6914');
    ctx.fillStyle = pg;
    ctx.beginPath();
    ctx.arc(0, -6, 7, 0, Math.PI * 2);
    ctx.fill();

    // 外圈暖金边框
    ctx.strokeStyle = '#e2b96f';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, -6, 8, 0, Math.PI * 2);
    ctx.stroke();

    // 玻璃反射高光（左上角小白点）
    ctx.beginPath();
    ctx.arc(-3, -9, 2, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fill();
    ctx.restore();
  }

  ctx.restore();
}

/* ============================================================
   音效引擎（Web Audio API）
   ============================================================ */

class SoundEngine {
  constructor() {
    this.ctx = null;
  }

  ensure() {
    if (!this.ctx) {
      try {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) {
        return null;
      }
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
    return this.ctx;
  }

  // 建造完成：清脆"叮"声
  playDing() {
    var ctx = this.ensure();
    if (!ctx) return;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.25, ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.12);
  }

  // 点火瞬间：低沉"呼"声（白噪声 + 低通滤波）
  playIgnition() {
    var ctx = this.ensure();
    if (!ctx) return;
    var size = Math.floor(ctx.sampleRate * 0.3);
    var buf = ctx.createBuffer(1, size, ctx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < size; i++) {
      d[i] = Math.random() * 2 - 1;
    }
    var noise = ctx.createBufferSource();
    noise.buffer = buf;
    var filt = ctx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.value = 300;
    var gain = ctx.createGain();
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.35, ctx.currentTime + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
    noise.connect(filt).connect(gain).connect(ctx.destination);
    noise.start();
    noise.stop(ctx.currentTime + 0.3);
  }

  // 火箭抵达：温暖共鸣（双音竖琴泛音）
  playArrival() {
    var ctx = this.ensure();
    if (!ctx) return;
    [523, 659].forEach(function (f) {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = f;
      gain.gain.setValueAtTime(0, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.18, ctx.currentTime + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.52);
    });
  }
}

/* ============================================================
   工具函数
   ============================================================ */

function lerpColor(c1, c2, t) {
  // c1, c2: [r,g,b], t: 0~1
  return [
    Math.round(c1[0] + (c2[0] - c1[0]) * t),
    Math.round(c1[1] + (c2[1] - c1[1]) * t),
    Math.round(c1[2] + (c2[2] - c1[2]) * t)
  ];
}

function rgbStr(c) {
  return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
}

function rgbaStr(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
