/* ============================================================
   行星点亮动画管理器 PlanetLightAnimator
   ============================================================ */

var COLOR_DORMANT = [90, 109, 138];   // #5e6d8a
var COLOR_LIT     = [226, 185, 111];  // #e2b96f

class PlanetLightAnimator {
  constructor(planetRenderer) {
    this.pr = planetRenderer;
    this.animations = []; // { planet, startTime, breathingSpeed, breathingAmp, encouragement, encourageStart }
  }

  // 触发一颗行星的点亮动画
  triggerLight(planet) {
    // 深拷贝初始坐标
    var initPos = { x: planet.x, y: planet.y };
    this.animations.push({
      planet: planet,
      startTime: performance.now(),
      initPos: initPos,
      breathingSpeed: 2.0 + Math.random() * 0.6,
      breathingAmp: 3 + Math.random() * 2,
      encouragement: getRandomEncouragement(),
      encourageStart: performance.now(),
      phase: 'transition' // transition → breathing
    });
  }

  render(ctx, timestamp) {
    for (var i = this.animations.length - 1; i >= 0; i--) {
      var anim = this.animations[i];
      var elapsed = (timestamp - anim.startTime) / 1000;
      var planet = anim.planet;

      // 鼓励卡片（2.5 秒后淡出）
      var encElapsed = (timestamp - anim.encourageStart) / 1000;
      if (encElapsed < 2.5) {
        this._renderEncouragement(ctx, planet, anim.encouragement, encElapsed);
      }

      if (elapsed < 0.6) {
        // a) 颜色过渡 0-0.6s
        anim.phase = 'transition';
      } else if (elapsed < 0.8) {
        // b) 星芒绽放 0.3-0.8s（已进入星芒阶段）
        anim.phase = 'starRays';
      } else {
        // c) 呼吸脉动
        anim.phase = 'breathing';
      }

      // 颜色过渡比例
      var colorT = Math.min(1, elapsed / 0.6);
      var currentColor = lerpColor(COLOR_DORMANT, COLOR_LIT, colorT);

      // 星芒比例
      var rayT = 0;
      if (elapsed >= 0.3) {
        rayT = Math.min(1, (elapsed - 0.3) / 0.5);
      }

      // 呼吸脉动（点亮后持续）
      var breathPulse = 0;
      if (elapsed >= 0.6) {
        breathPulse = Math.sin(timestamp / 1000 * anim.breathingSpeed / 2.5 * Math.PI * 2) * anim.breathingAmp;
      }

      // 存储到 planet 上供 renderPlanet 使用
      planet._lightAnim = {
        colorT: colorT,
        currentColor: currentColor,
        rayT: rayT,
        breathPulse: breathPulse,
        phase: anim.phase
      };
    }

    // 清理完成鼓励卡片显示的旧动画（保留用于渲染的状态）
    // 动画一旦进入呼吸阶段，就不需要从数组中移除（持续循环）
  }

  _renderEncouragement(ctx, planet, text, elapsed) {
    var fadeAlpha = elapsed < 0.3 ? elapsed / 0.3 : (elapsed > 2.0 ? 1 - (elapsed - 2.0) / 0.5 : 1);
    fadeAlpha = Math.max(0, Math.min(1, fadeAlpha));
    var offsetY = elapsed < 0.3 ? (1 - elapsed / 0.3) * 10 : 0;

    var cx = planet.x;
    var cy = planet.y - planet.radius - 32 + offsetY;
    var w = 180, h = 60;

    ctx.save();
    ctx.globalAlpha = fadeAlpha;

    // 羊皮纸背景
    ctx.fillStyle = 'rgba(42,38,55,0.55)';
    this._roundRect(ctx, cx - w / 2, cy - h / 2, w, h, 12);
    ctx.fill();

    ctx.strokeStyle = 'rgba(226,185,111,0.3)';
    ctx.lineWidth = 1;
    this._roundRect(ctx, cx - w / 2, cy - h / 2, w, h, 12);
    ctx.stroke();

    // 文字
    ctx.font = '13px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fef3d4';
    ctx.shadowBlur = 6;
    ctx.shadowColor = 'rgba(226,185,111,0.4)';
    ctx.fillText(text, cx, cy);

    ctx.restore();
  }

  _roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  hasAnimation() {
    return this.animations.length > 0;
  }
}

/* ============================================================
   星座连线动画管理器 ConstellationAnimator
   ============================================================ */

class ConstellationAnimator {
  constructor(planetRenderer) {
    this.pr = planetRenderer;
    this.animating = false;
    this.links = [];        // { from, to, delay, startTime }
    this.frameAlpha = 0;    // 画框淡入
    this.titleAlpha = 0;    // 标题淡入
    this.startTime = 0;
    this.domain = null;
    this.completed = false;
    this.onComplete = null;
  }

  // 检查当前领域是否全部点亮
  checkAndTrigger(domain, onComplete) {
    if (this.animating) return false;
    var allLit = domain.nodes.every(function (n) { return n.lit; });
    if (!allLit) return false;

    this.domain = domain;
    this.animating = true;
    this.completed = false;
    this.onComplete = onComplete;
    this.startTime = performance.now();

    // 按依赖层级排序连线（从顶层依赖开始）
    var depthMap = new Map();
    function getDepth(node) {
      if (depthMap.has(node.id)) return depthMap.get(node.id);
      if (!node.dependencies || node.dependencies.length === 0) {
        depthMap.set(node.id, 0);
        return 0;
      }
      var maxD = -1;
      for (var depId of node.dependencies) {
        var dep = domain.nodes.find(function (n) { return n.id === depId; });
        if (dep) maxD = Math.max(maxD, getDepth(dep));
      }
      var d = maxD + 1;
      depthMap.set(node.id, d);
      return d;
    }
    domain.nodes.forEach(function (n) { getDepth(n); });

    this.links = [];
    var linkIndex = 0;
    for (var node of domain.nodes) {
      if (!node.dependencies || node.dependencies.length === 0) continue;
      for (var depId of node.dependencies) {
        var from = this.pr.planets.find(function (p) { return p.id === depId; });
        var to = this.pr.planets.find(function (p) { return p.id === node.id; });
        if (from && to) {
          this.links.push({
            from: from,
            to: to,
            delay: linkIndex * 400,
            duration: 600
          });
          linkIndex++;
        }
      }
    }

    return true;
  }

  render(ctx, timestamp) {
    if (!this.animating) return;
    var elapsed = (timestamp - this.startTime) / 1000;
    var allLinksDone = true;

    // 绘制连线
    for (var i = 0; i < this.links.length; i++) {
      var link = this.links[i];
      var linkElapsed = (timestamp - this.startTime - link.delay) / 1000;
      if (linkElapsed < 0) {
        allLinksDone = false;
        continue;
      }

      var progress = Math.min(1, linkElapsed / (link.duration / 1000));
      if (progress < 1) allLinksDone = false;

      var fromX = link.from.x, fromY = link.from.y;
      var toX = link.to.x, toY = link.to.y;
      var endX = fromX + (toX - fromX) * progress;
      var endY = fromY + (toY - fromY) * progress;

      var alpha = 0.2 + progress * 0.4;

      ctx.save();
      ctx.strokeStyle = 'rgba(226,185,111,' + alpha + ')';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 4]);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(fromX, fromY);
      ctx.lineTo(endX, endY);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }

    // 连线全部完成后：画框 + 标题
    if (allLinksDone) {
      var frameElapsed = (timestamp - this.startTime - this.links.length * 400 / 1000 - 0.6) * 1;
      if (frameElapsed > 0) {
        this.frameAlpha = Math.min(1, frameElapsed / 0.5);
        this.titleAlpha = Math.min(1, Math.max(0, (frameElapsed - 0.2) / 0.5));

        this._renderFrame(ctx);
        this._renderTitle(ctx);

        if (!this.completed && this.titleAlpha >= 1) {
          this.completed = true;
          if (this.onComplete) {
            var cb = this.onComplete;
            this.onComplete = null;
            cb(this.domain);
          }
        }
      }
    }
  }

  _renderFrame(ctx) {
    if (this.frameAlpha <= 0 || !this.pr.planets.length) return;
    var padding = 30;
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (var p of this.pr.planets) {
      if (p.x < minX) minX = p.x;
      if (p.y < minY) minY = p.y;
      if (p.x > maxX) maxX = p.x;
      if (p.y > maxY) maxY = p.y;
    }
    minX -= padding + 20;
    minY -= padding + 20;
    maxX += padding + 20;
    maxY += padding + 20;

    ctx.save();
    ctx.globalAlpha = this.frameAlpha * 0.5;
    ctx.strokeStyle = 'rgba(226,185,111,0.4)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([8, 4]);
    var w = maxX - minX, h = maxY - minY;
    var r = 16;
    ctx.beginPath();
    ctx.moveTo(minX + r, minY);
    ctx.lineTo(minX + w - r, minY);
    ctx.arcTo(minX + w, minY, minX + w, minY + r, r);
    ctx.lineTo(minX + w, minY + h - r);
    ctx.arcTo(minX + w, minY + h, minX + w - r, minY + h, r);
    ctx.lineTo(minX + r, minY + h);
    ctx.arcTo(minX, minY + h, minX, minY + h - r, r);
    ctx.lineTo(minX, minY + r);
    ctx.arcTo(minX, minY, minX + r, minY, r);
    ctx.closePath();
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  _renderTitle(ctx) {
    if (this.titleAlpha <= 0 || !this.domain) return;
    var domain = this.domain;
    var count = domain.nodes.length;
    var text = domain.name + ' · ' + count + '颗星辰';

    // 计算居中位置（星座上方）
    var minY = Infinity;
    for (var p of this.pr.planets) {
      if (p.y < minY) minY = p.y;
    }
    var cx = this.pr.width / 2;
    var cy = minY - 55;

    ctx.save();
    ctx.globalAlpha = this.titleAlpha;
    ctx.font = '600 18px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // 金色渐变文字
    var grad = ctx.createLinearGradient(cx - 80, cy, cx + 80, cy);
    grad.addColorStop(0, '#f5d67b');
    grad.addColorStop(0.5, '#fef3d4');
    grad.addColorStop(1, '#e2b96f');
    ctx.fillStyle = grad;
    ctx.shadowBlur = 12;
    ctx.shadowColor = 'rgba(226,185,111,0.5)';
    ctx.fillText(text, cx, cy);
    ctx.restore();
  }
}

/* ============================================================
   成就弹窗管理器 AchievementManager
   ============================================================ */

class AchievementManager {
  constructor(planetRenderer, ui) {
    this.pr = planetRenderer;
    this.ui = ui;
    this.overlay = document.getElementById('achievement-overlay');
    this.posterOverlay = document.getElementById('poster-overlay');
    this.els = {
      title: document.getElementById('achievement-title'),
      subtitle: document.getElementById('achievement-subtitle'),
      quoteText: document.getElementById('achievement-quote-text'),
      quoteSource: document.getElementById('achievement-quote-source'),
      posterBtn: document.getElementById('achievement-poster-btn'),
      closeBtn: document.getElementById('achievement-close-btn'),
      posterPreview: document.getElementById('poster-preview'),
      posterSaveBtn: document.getElementById('poster-save-btn'),
      posterCloseBtn: document.getElementById('poster-close-btn'),
      posterSidebarBtn: document.getElementById('poster-sidebar-btn'),
    };

    this._bindEvents();
    this.achievedDomains = new Set();
  }

  _bindEvents() {
    var self = this;
    this.els.closeBtn.addEventListener('click', function () { self.hide(); });
    this.els.posterBtn.addEventListener('click', function () { self.hide(); self.generatePoster(); });
    this.els.posterCloseBtn.addEventListener('click', function () { self.hidePoster(); });
    this.els.posterSaveBtn.addEventListener('click', function () { self.savePoster(); });
    this.els.posterSidebarBtn.addEventListener('click', function () { self.generatePoster(); });

    // 点击遮罩关闭
    this.overlay.addEventListener('click', function (e) {
      if (e.target === self.overlay) self.hide();
    });
    this.posterOverlay.addEventListener('click', function (e) {
      if (e.target === self.posterOverlay) self.hidePoster();
    });
  }

  show(domain) {
    if (this.achievedDomains.has(domain.id)) return;
    this.achievedDomains.add(domain.id);

    var quote = getRandomQuote();
    this.els.subtitle.textContent = '"' + domain.name + '" 已完整点亮';
    var count = domain.nodes.length;
    this.els.subtitle.textContent = '\u201c' + domain.name + '\u201d 已完整点亮\n共 ' + count + ' 颗知识星辰 全部苏醒';
    this.els.quoteText.textContent = '\u201c' + quote.text + '\u201d';
    this.els.quoteSource.textContent = quote.source;

    this.overlay.classList.add('show');

    // 显示侧边栏海报按钮
    this.updateSidebarButton();
  }

  hide() {
    this.overlay.classList.remove('show');
  }

  updateSidebarButton() {
    if (this.ui && this.ui.currentDomain) {
      var hasLit = this.ui.currentDomain.nodes.some(function (n) { return n.lit; });
      this.els.posterSidebarBtn.style.display = hasLit ? 'block' : 'none';
    }
  }

  generatePoster() {
    var canvas = document.getElementById('starmap-canvas');
    var dataURL = canvas.toDataURL('image/png');
    this.els.posterPreview.src = dataURL;
    this.posterOverlay.classList.add('show');
  }

  savePoster() {
    var canvas = document.getElementById('starmap-canvas');
    var dataURL = canvas.toDataURL('image/png');
    var link = document.createElement('a');
    link.download = '我的知识星图.png';
    link.href = dataURL;
    link.click();
  }

  hidePoster() {
    this.posterOverlay.classList.remove('show');
  }
}

/* ============================================================
   火箭动画管理器 RocketAnimator
   状态机：idle → building → ready → launching → idle
   ============================================================ */

var ROCKET_QUOTES = [
  '"正是你为这颗星球花费的时间，才让它变得如此珍贵。" ——《小王子》',
  '"星星发亮是为了让每一个人有一天都能找到属于自己的星星。"',
  '"只有用心灵才能看得清事物本质，真正重要的东西是肉眼无法看见的。"',
  '"如果你想要造一艘船，不要召集人们去收集木材，而要教他们渴望浩瀚无垠的大海。"',
  '"学习的旅程不是抵达终点，而是沿途亮起的每一颗星。"'
];

class RocketAnimator {
  constructor(planetRenderer) {
    this.pr = planetRenderer;
    this.state = 'idle';
    this.planet = null;
    this.startTime = 0;
    this.particles = [];
    this.trail = [];
    this.burst = [];
    this.flashStart = 0;
    this.arrivalTriggered = false;
    this.buildNotified = false;
    this.onBuildComplete = null;
    this.onLaunchComplete = null;
    this.sound = null;
  }

  _rocketCenter(planet) {
    return { x: planet.x, y: planet.y + planet.radius + 55 };
  }

  /* ---------- 建造阶段 ---------- */
  startBuilding(planet, onBuildComplete) {
    this.state = 'building';
    this.planet = planet;
    this.startTime = performance.now();
    this.onBuildComplete = onBuildComplete;
    this.buildNotified = false;
    this.arrivalTriggered = false;
    this.particles = [];
    this.trail = [];
    this.burst = [];
    this.flashStart = 0;

    var c = this._rocketCenter(planet);
    for (var i = 0; i < 25; i++) {
      var ang = Math.random() * Math.PI * 2;
      var dist = 120 + Math.random() * 100;
      this.particles.push({
        sx: planet.x + Math.cos(ang) * dist,
        sy: planet.y + Math.sin(ang) * dist,
        cx: planet.x + (Math.random() - 0.5) * 80,
        cy: c.y + (Math.random() - 0.5) * 80,
        ex: c.x + (Math.random() - 0.5) * 14,
        ey: c.y + (Math.random() - 0.5) * 24,
        delay: Math.random() * 1.4,
        dur: 0.6 + Math.random() * 0.5,
        size: 1.5 + Math.random() * 2.2
      });
    }
  }

  /* ---------- 发射阶段 ---------- */
  startLaunch(planet, onLaunchComplete) {
    this.state = 'launching';
    this.planet = planet;
    this.startTime = performance.now();
    this.onLaunchComplete = onLaunchComplete;
    this.arrivalTriggered = false;
    this.trail = [];
    this.burst = [];
    this.flashStart = 0;
    if (this.pr.starfield) {
      this.pr.starfield.brightnessBoost = 0.1;
    }
  }

  /* ---------- 强制停止（跳过） ---------- */
  forceStop() {
    this.state = 'idle';
    this.particles = [];
    this.trail = [];
    this.burst = [];
    this.flashStart = 0;
    if (this.pr.starfield) {
      this.pr.starfield.brightnessBoost = 0;
    }
  }

  _createBurst(x, y) {
    this.burst = [];
    for (var i = 0; i < 15; i++) {
      var ang = (Math.PI * 2 * i / 15) + Math.random() * 0.3;
      var sp = 1.5 + Math.random() * 2.5;
      this.burst.push({
        x: x, y: y,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp,
        life: 1,
        size: 2 + Math.random() * 2
      });
    }
  }

  /* ---------- 主渲染入口 ---------- */
  render(ctx, timestamp) {
    if (this.state === 'idle' || !this.planet) return;
    var t = (timestamp - this.startTime) / 1000;
    var planet = this.planet;
    var c = this._rocketCenter(planet);

    if (this.state === 'building' || this.state === 'ready') {
      this._renderBuilding(ctx, t, planet, c, timestamp);
    } else if (this.state === 'launching') {
      this._renderLaunching(ctx, t, planet, c, timestamp);
    }

    // 唤醒闪光（全屏暖白遮罩）
    if (this.flashStart > 0) {
      var elapsed = (timestamp - this.flashStart) / 1000;
      if (elapsed < 0.15) {
        var fa = elapsed < 0.075
          ? 0.15 * (elapsed / 0.075)
          : 0.15 * (1 - (elapsed - 0.075) / 0.075);
        ctx.save();
        ctx.fillStyle = 'rgba(254,243,212,' + fa + ')';
        ctx.fillRect(0, 0, this.pr.width, this.pr.height);
        ctx.restore();
      } else {
        this.flashStart = 0;
      }
    }

    // 抵达迸发粒子
    if (this.burst.length > 0) {
      ctx.save();
      for (var bi = 0; bi < this.burst.length; bi++) {
        var b = this.burst[bi];
        b.x += b.vx;
        b.y += b.vy;
        b.vx *= 0.96;
        b.vy *= 0.96;
        b.life -= 0.025;
        if (b.life > 0) {
          ctx.globalAlpha = b.life;
          ctx.shadowBlur = 8;
          ctx.shadowColor = '#f5d67b';
          ctx.fillStyle = '#f5d67b';
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.size * b.life, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.shadowBlur = 0;
      this.burst = this.burst.filter(function (b) { return b.life > 0; });
      ctx.restore();
    }
  }

  /* ---------- 建造渲染 ---------- */
  _renderBuilding(ctx, t, planet, c, timestamp) {
    // 星尘粒子
    this._renderParticles(ctx, t);

    // t=0~0.5s 虚线设计草图轮廓
    if (t < 0.5) {
      var alpha = 1 - (t / 0.5) * 0.6;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = 'rgba(226,185,111,0.5)';
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 4]);
      ctx.beginPath();
      ctx.moveTo(c.x - 11, c.y - 22);
      ctx.bezierCurveTo(c.x - 14, c.y - 8, c.x - 14, c.y + 14, c.x - 10, c.y + 28);
      ctx.bezierCurveTo(c.x - 5, c.y + 30, c.x + 5, c.y + 30, c.x + 10, c.y + 28);
      ctx.bezierCurveTo(c.x + 14, c.y + 14, c.x + 14, c.y - 8, c.x + 11, c.y - 22);
      ctx.bezierCurveTo(c.x + 5, c.y - 20, c.x - 5, c.y - 20, c.x - 11, c.y - 22);
      ctx.closePath();
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(c.x - 11, c.y - 22);
      ctx.bezierCurveTo(c.x - 10, c.y - 33, c.x - 5, c.y - 43, c.x, c.y - 45);
      ctx.bezierCurveTo(c.x + 5, c.y - 43, c.x + 10, c.y - 33, c.x + 11, c.y - 22);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
      return;
    }

    // 部件逐步实体化
    var finsProg = 0, bodyProg = 0, headProg = 0, portProg = 0;
    if (t >= 0.5) finsProg = Math.min(1, (t - 0.5) / 0.5);
    if (t >= 1.0) bodyProg = Math.min(1, (t - 1.0) / 1.0);
    if (t >= 1.8) { headProg = Math.min(1, (t - 1.8) / 0.7); portProg = headProg; }

    // 建造完成后浮动 + 尾焰微弱闪烁
    var floatY = 0;
    var flameI = 0;
    if (t >= 2.5) {
      floatY = Math.sin((t - 2.5) * 2.5) * 3;
      flameI = 0.4 + Math.sin((t - 2.5) * 8) * 0.1;
      if (!this.buildNotified) {
        this.buildNotified = true;
        this.state = 'ready';
        if (this.onBuildComplete) {
          var cb = this.onBuildComplete;
          this.onBuildComplete = null;
          cb();
        }
      }
    }

    var wob = Math.sin(t * 8 * Math.PI) * 1.5;
    drawRocket(ctx, c.x, c.y + floatY, 0.85, flameI, wob, {
      fins: finsProg, body: bodyProg, head: headProg, porthole: portProg
    });
  }

  _renderParticles(ctx, t) {
    ctx.save();
    for (var i = 0; i < this.particles.length; i++) {
      var p = this.particles[i];
      var localT = t - 0.5 - p.delay;
      if (localT < 0) continue;
      var prog = localT / p.dur;
      var alpha, px, py;
      if (prog <= 1) {
        var u = 1 - prog;
        px = u * u * p.sx + 2 * u * prog * p.cx + prog * prog * p.ex;
        py = u * u * p.sy + 2 * u * prog * p.cy + prog * prog * p.ey;
        alpha = 0.8 * (prog < 0.8 ? 1 : (1 - (prog - 0.8) / 0.2));
      } else {
        px = p.ex; py = p.ey;
        alpha = 0.8 * Math.max(0, 1 - (localT - p.dur) / 0.4);
      }
      if (alpha <= 0) continue;
      ctx.globalAlpha = alpha;
      ctx.shadowBlur = 6;
      ctx.shadowColor = '#f5d67b';
      ctx.fillStyle = '#f5d67b';
      ctx.beginPath();
      ctx.arc(px, py, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  /* ---------- 发射渲染 ---------- */
  _renderLaunching(ctx, t, planet, c, timestamp) {
    var startY = c.y;
    var endY = planet.y;

    var rocketY, flameI, rocketOpacity, rocketScale;
    var wob = 0;

    if (t < 0.5) {
      // 点火倒计时
      var ct = t / 0.5;
      flameI = 0.3 + ct * 0.9;
      rocketY = startY;
      rocketOpacity = 1;
      rocketScale = 0.85;
      wob = Math.sin(t * 8 * Math.PI) * 2;

      // 冲击波光环
      if (ct < 1) {
        var ringScale = ct * 2;
        var ringAlpha = 0.6 * (1 - ct);
        ctx.save();
        ctx.translate(c.x, c.y + 28);
        ctx.scale(ringScale, ringScale);
        ctx.strokeStyle = 'rgba(245,214,123,' + ringAlpha + ')';
        ctx.lineWidth = 3 / Math.max(0.01, ringScale);
        ctx.beginPath();
        ctx.arc(0, 0, 18, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    } else if (t < 2.8) {
      // 升空飞行
      var ft = (t - 0.5) / 2.3;
      var eased = 1 - Math.pow(1 - ft, 3);
      rocketY = startY + (endY - startY) * eased;
      flameI = 1.2;
      rocketOpacity = 1;
      rocketScale = 1.0;
      wob = Math.sin(t * 4 * Math.PI) * 5;

      // 拖曳星尘尾巴
      this.trail.unshift({ x: c.x + wob * 0.3, y: rocketY });
      if (this.trail.length > 12) this.trail.pop();

      ctx.save();
      for (var ti = 0; ti < this.trail.length; ti++) {
        var tr = this.trail[ti];
        var a = (1 - ti / this.trail.length) * 0.6;
        var sz = (1 - ti / this.trail.length) * 3 + 1;
        ctx.globalAlpha = a;
        ctx.shadowBlur = 6;
        ctx.shadowColor = '#f5d67b';
        ctx.fillStyle = '#f5d67b';
        ctx.beginPath();
        ctx.arc(tr.x, tr.y + 30, sz, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
      ctx.restore();

      // 抵达唤醒
      if (eased > 0.88 && !this.arrivalTriggered) {
        this.arrivalTriggered = true;
        this.flashStart = timestamp;
        this._createBurst(planet.x, planet.y);
        planet.lit = true;
        if (this.sound) this.sound.playArrival();
      }
    } else if (t < 3.3) {
      // 火箭淡出融入行星光芒
      var ft2 = (t - 2.8) / 0.5;
      rocketY = endY;
      flameI = 1.2 * (1 - ft2 * 0.6);
      rocketOpacity = 1 - ft2;
      rocketScale = 1.0;
      wob = 0;
    } else {
      // 动画结束
      this.state = 'idle';
      if (this.pr.starfield) this.pr.starfield.brightnessBoost = 0;
      if (this.onLaunchComplete) {
        var cb2 = this.onLaunchComplete;
        this.onLaunchComplete = null;
        cb2();
      }
      return;
    }

    ctx.save();
    ctx.globalAlpha = rocketOpacity;
    drawRocket(ctx, c.x + wob * 0.3, rocketY, rocketScale, flameI, wob, null);
    ctx.restore();
  }
}

/* ============================================================
   DOM 交互逻辑
   ============================================================ */

class StarmapUI {
  constructor(planetRenderer) {
    this.planetRenderer = planetRenderer;
    this.litCount = 0;
    this.totalCount = 0;
    this.sidebarOpen = false;
    this.sidebarCollapsed = false;
    this.currentDomain = null;
    this.savedData = loadStarmapData();
    this.sound = new SoundEngine();
    this.rocketAnimator = null;
    this.activeRocketPlanet = null;
    this.shakeTimeout = null;
    this.quoteTimeout = null;
    this.lightAnimator = null;
    this.constellationAnimator = null;
    this.achievementManager = null;

    this.els = {
      litCount: document.getElementById('lit-count'),
      statusLit: document.getElementById('status-lit'),
      statusText: document.getElementById('status-text'),
      exploreInput: document.getElementById('explore-input'),
      expandBtn: document.getElementById('expand-btn'),
      knowledgeList: document.getElementById('knowledge-list'),
      knowledgeGuide: document.getElementById('knowledge-guide'),
      sidebar: document.getElementById('sidebar'),
      sidebarToggle: document.getElementById('sidebar-toggle'),
      sidebarCollapseBtn: document.getElementById('sidebar-collapse-btn'),
      resetBtn: document.getElementById('reset-btn'),
      skipBtn: document.getElementById('skip-btn'),
      quoteOverlay: document.getElementById('quote-overlay'),
      progressBarFill: document.getElementById('progress-bar-fill'),
    };

    this.bindEvents();
  }

  bindEvents() {
    this.els.expandBtn.addEventListener('click', () => this.handleExpand());
    this.els.exploreInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') this.handleExpand();
    });
    this.els.sidebarToggle.addEventListener('click', () => this.toggleSidebar());
    this.els.sidebarCollapseBtn.addEventListener('click', () => this.toggleSidebarCollapse());
    this.els.resetBtn.addEventListener('click', () => this.resetProgress());
    this.els.skipBtn.addEventListener('click', () => this.skipAnimation());

    document.getElementById('starmap-canvas').addEventListener('click', (e) => {
      if (window.innerWidth <= 768 && this.sidebarOpen && !this.planetRenderer.hoveredPlanet) {
        this.toggleSidebar();
      }
    });

    // 引导卡片快捷按钮
    var quickBtns = document.querySelectorAll('.onboarding-quick-btn');
    quickBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        var keyword = btn.getAttribute('data-keyword');
        this.els.exploreInput.value = keyword;
        this.handleExpand();
        this.hideOnboarding();
      });
    });

    // 引导卡片自定义输入
    var onboardingInput = document.getElementById('onboarding-custom-input');
    var onboardingGoBtn = document.getElementById('onboarding-go-btn');
    if (onboardingGoBtn) {
      onboardingGoBtn.addEventListener('click', () => {
        var val = onboardingInput.value.trim();
        if (val) {
          this.els.exploreInput.value = val;
          // 尝试匹配已知领域
          var matched = false;
          for (const domain of knowledgeDomains) {
            if (domain.keywords.some(k => val.toLowerCase().includes(k))) {
              matched = true;
              break;
            }
          }
          if (!matched) {
            // 未知领域 - 仍展开通用模板并提示
            this.showGuide('当前仅支持预设星域。已为你展开通用模板，完整版将接入 AI 实时生成。试试：React、Python、产品设计');
          }
          this.handleExpand();
          this.hideOnboarding();
        }
      });
    }
    if (onboardingInput) {
      onboardingInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          onboardingGoBtn.click();
        }
      });
    }
  }

  hideOnboarding() {
    var overlay = document.getElementById('onboarding-overlay');
    if (overlay) {
      overlay.classList.add('hidden');
    }
  }

  /* ---------- 侧边栏折叠/展开 ---------- */

  toggleSidebarCollapse() {
    this.sidebarCollapsed = !this.sidebarCollapsed;
    this.els.sidebar.classList.toggle('collapsed', this.sidebarCollapsed);
    this.els.sidebarCollapseBtn.textContent = this.sidebarCollapsed ? '→' : '←';

    // 触发 resize 以重新计算 Canvas 大小
    setTimeout(() => {
      this.planetRenderer.resize();
    }, 360);
  }

  /* ---------- localStorage 持久化 ---------- */

  buildSaveData() {
    const data = {
      currentDomainId: this.currentDomain ? this.currentDomain.id : null,
      domains: {}
    };
    for (const domain of knowledgeDomains) {
      data.domains[domain.id] = {};
      for (const node of domain.nodes) {
        const taskState = {};
        for (const task of node.tasks) {
          taskState[task.id] = task.completed;
        }
        data.domains[domain.id][node.id] = {
          lit: node.lit,
          tasks: taskState
        };
      }
    }
    return data;
  }

  save() {
    const data = this.buildSaveData();
    saveStarmapData(data);
    this.savedData = data;
  }

  restoreFromStorage() {
    if (!this.savedData) return;
    const { domains } = this.savedData;
    if (!domains) return;

    for (const domain of knowledgeDomains) {
      const savedDomain = domains[domain.id];
      if (!savedDomain) continue;
      for (const node of domain.nodes) {
        const savedNode = savedDomain[node.id];
        if (!savedNode) continue;
        node.lit = savedNode.lit || false;
        if (savedNode.tasks) {
          for (const task of node.tasks) {
            if (savedNode.tasks[task.id] !== undefined) {
              task.completed = savedNode.tasks[task.id];
            }
          }
        }
      }
    }
  }

  /* ---------- 领域切换 ---------- */

  handleExpand() {
    // 无论后续是否成功，先隐藏引导卡片
    this.hideOnboarding();

    const query = this.els.exploreInput.value.trim().toLowerCase();
    if (!query) {
      this.shakeInput();
      return;
    }

    let matchedDomain = null;
    for (const domain of knowledgeDomains) {
      if (domain.keywords.some(k => query.includes(k))) {
        matchedDomain = domain;
        break;
      }
    }

    if (!matchedDomain) {
      this.showGuide('未找到对应的星域，试试：React、Python、产品设计');
      return;
    }

    this.currentDomain = matchedDomain;
    this.restoreFromStorage();
    this.planetRenderer.loadDomain(matchedDomain);

    if (this.els.knowledgeGuide) {
      this.els.knowledgeGuide.remove();
      this.els.knowledgeGuide = null;
    }

    this.showPlanetList();
    this.updateLitCount();
    this.els.exploreInput.value = '';
    this.save();
  }

  /* ---------- 列表与详情 ---------- */

  showPlanetList() {
    if (!this.currentDomain) return;

    const planets = this.planetRenderer.planets;
    this.els.knowledgeList.innerHTML = '';

    planets.forEach((planet, index) => {
      const card = document.createElement('div');
      card.className = 'knowledge-card';
      card.style.animation = `fadeIn 0.5s ease ${index * 0.05}s both`;

      const icon = planet.lit ? '🌕' : (this.allTasksCompleted(planet) ? '🌔' : '🌑');
      card.innerHTML = `
        <div class="knowledge-card-title">${icon} ${this.escapeHtml(planet.name)}</div>
        <div class="knowledge-card-desc">${this.escapeHtml(planet.description)}</div>
      `;

      card.addEventListener('click', () => {
        this.planetRenderer.selectedPlanet = planet;
        this.showPlanetDetail(planet);
      });

      this.els.knowledgeList.appendChild(card);
    });
  }

  showPlanetDetail(planet) {
    const prereqs = planet.dependencies
      .map(depId => this.planetRenderer.planets.find(p => p.id === depId))
      .filter(Boolean);

    const prereqTags = prereqs.length > 0
      ? prereqs.map(p => `<span class="prerequisite-tag">${this.escapeHtml(p.name)}</span>`).join('')
      : '<span class="prerequisite-tag prerequisite-tag--none">无前置星球</span>';

    const icon = planet.lit ? '🌕' : (this.allTasksCompleted(planet) ? '🌔' : '🌑');
    const completedCount = planet.tasks.filter(t => t.completed).length;
    const totalTasks = planet.tasks.length;
    const allDone = this.allTasksCompleted(planet);

    this.els.knowledgeList.innerHTML = `
      <div class="planet-detail" id="planet-detail-panel">
        <button class="back-btn" id="detail-back-btn">
          <span class="back-arrow">←</span> 返回星图
        </button>

        <div class="planet-detail-header">
          <div class="planet-emoji">${icon}</div>
          <h3 class="planet-name">${this.escapeHtml(planet.name)}</h3>
        </div>

        <p class="planet-description">${this.escapeHtml(planet.description)}</p>

        <div class="planet-section">
          <h4 class="section-title">前置星球</h4>
          <div class="prerequisite-list">${prereqTags}</div>
        </div>

        <div class="planet-section task-section">
          <div class="task-header">
            <div class="task-title-row">
              <h4 class="section-title" style="margin:0;">📜 学习任务</h4>
              <span class="task-count">（<span class="done" id="task-done-count">${completedCount}</span>/${totalTasks}）</span>
            </div>
          </div>
          <div class="task-list" id="task-list">
            ${this.renderTaskCards(planet)}
          </div>
          <div id="rocket-area" style="display:${allDone && !planet.lit ? 'block' : 'none'};">
            <div class="build-rocket-area">
              <button class="build-rocket-btn" id="build-rocket-btn">
                <span class="rocket-emoji">🚀</span> 为这颗星球建造火箭
              </button>
            </div>
          </div>
        </div>
      </div>
    `;

    document.getElementById('detail-back-btn').addEventListener('click', () => {
      this.planetRenderer.selectedPlanet = null;
      this.showPlanetList();
    });

    // 绑定任务卡片点击事件
    const taskCards = document.querySelectorAll('.task-card');
    taskCards.forEach(card => {
      card.addEventListener('click', (e) => {
        const taskId = card.dataset.taskId;
        this.toggleTask(planet, taskId);
      });
    });

    // 绑定火箭按钮
    const rocketBtn = document.getElementById('build-rocket-btn');
    if (rocketBtn) {
      rocketBtn.addEventListener('click', () => this.handleRocketClick(planet));
    }
  }

  renderTaskCards(planet) {
    if (!planet.tasks || planet.tasks.length === 0) {
      return '<div class="task-placeholder">暂无学习任务</div>';
    }
    return planet.tasks.map((task, idx) => {
      const checkedClass = task.completed ? 'checked' : '';
      const cardClass = task.completed ? 'task-card completed' : 'task-card';
      const checkmark = task.completed ? '✓' : '';
      return `
        <div class="${cardClass}" data-task-id="${task.id}" style="animation: fadeIn 0.4s ease ${idx * 0.06}s both;">
          <div class="task-checkbox ${checkedClass}">
            <span class="checkmark">${checkmark}</span>
          </div>
          <div class="task-card-content">
            <div class="task-card-title">${this.escapeHtml(task.title)}</div>
            <div class="task-card-desc">${this.escapeHtml(task.description)}</div>
          </div>
        </div>
      `;
    }).join('');
  }

  /* ---------- 任务管理 ---------- */

  allTasksCompleted(planet) {
    if (!planet.tasks || planet.tasks.length === 0) return false;
    return planet.tasks.every(t => t.completed);
  }

  toggleTask(planet, taskId) {
    const task = planet.tasks.find(t => t.id === taskId);
    if (!task) return;

    task.completed = !task.completed;
    this.save();
    this.updateLitCount();

    // 刷新当前详情面板（保持详情视图）
    this.showPlanetDetail(planet);
  }

  buildRocket(planet) {
    if (!this.allTasksCompleted(planet)) return;
    if (this.rocketAnimator && this.rocketAnimator.state !== 'idle') return;

    this.activeRocketPlanet = planet;
    this.planetRenderer.interactionLocked = true;
    this.showSkipButton();
    this.updateRocketButton('建造中…', true);
    this.rocketAnimator.startBuilding(planet, () => this.onBuildComplete(planet));
  }

  handleRocketClick(planet) {
    var st = this.rocketAnimator ? this.rocketAnimator.state : 'idle';
    if (st === 'idle') {
      this.buildRocket(planet);
    } else if (st === 'ready') {
      this.launchRocket();
    }
  }

  onBuildComplete(planet) {
    this.sound.playDing();
    this.updateRocketButton('点火发射！', false);
    var btn = document.getElementById('build-rocket-btn');
    if (btn) btn.classList.add('pulsing');
  }

  launchRocket() {
    var planet = this.activeRocketPlanet;
    if (!planet) return;
    this.updateRocketButton('发射中…', true);
    var btn = document.getElementById('build-rocket-btn');
    if (btn) btn.classList.remove('pulsing');
    this.sound.playIgnition();
    this.startShake();
    this.showQuote();
    this.rocketAnimator.startLaunch(planet, () => this.onLaunchComplete(planet));
    this.quoteTimeout = setTimeout(() => this.hideQuote(), 2400);
  }

  onLaunchComplete(planet) {
    planet.lit = true;
    this.syncPlanetLit(planet);
    this.save();
    this.updateLitCount();
    this.hideSkipButton();
    this.hideQuote();
    this.stopShake();
    this.planetRenderer.interactionLocked = false;
    this.activeRocketPlanet = null;

    // 触发行星点亮动画
    if (this.lightAnimator) {
      this.lightAnimator.triggerLight(planet);
    }

    // 检查星座连线
    this._checkConstellation();

    // 更新侧边栏海报按钮
    if (this.achievementManager) {
      this.achievementManager.updateSidebarButton();
    }

    this.showPlanetDetail(planet);
    this.showPlanetList();
  }

  skipAnimation() {
    this.rocketAnimator.forceStop();
    var planet = this.activeRocketPlanet;
    this.hideSkipButton();
    this.hideQuote();
    this.stopShake();
    if (planet) {
      planet.lit = true;
      this.syncPlanetLit(planet);
      // 跳过时仍然触发点亮动画
      if (this.lightAnimator) {
        this.lightAnimator.triggerLight(planet);
      }
    }
    this.save();
    this.updateLitCount();
    this.planetRenderer.interactionLocked = false;
    this.activeRocketPlanet = null;
    if (planet) {
      this.showPlanetDetail(planet);
      this.showPlanetList();
    }
    // 检查星座连线
    this._checkConstellation();
    if (this.achievementManager) {
      this.achievementManager.updateSidebarButton();
    }
  }

  syncPlanetLit(planet) {
    for (var i = 0; i < knowledgeDomains.length; i++) {
      for (var j = 0; j < knowledgeDomains[i].nodes.length; j++) {
        if (knowledgeDomains[i].nodes[j].id === planet.id) {
          knowledgeDomains[i].nodes[j].lit = true;
          return;
        }
      }
    }
  }

  updateRocketButton(text, disabled) {
    var btn = document.getElementById('build-rocket-btn');
    if (btn) {
      btn.innerHTML = '<span class="rocket-emoji">🚀</span> ' + text;
      btn.disabled = disabled;
    }
  }

  showSkipButton() {
    this.els.skipBtn.classList.add('visible');
  }

  hideSkipButton() {
    this.els.skipBtn.classList.remove('visible');
  }

  showQuote() {
    var q = ROCKET_QUOTES[Math.floor(Math.random() * ROCKET_QUOTES.length)];
    this.els.quoteOverlay.textContent = q;
    this.els.quoteOverlay.classList.add('show');
  }

  hideQuote() {
    this.els.quoteOverlay.classList.remove('show');
    if (this.quoteTimeout) {
      clearTimeout(this.quoteTimeout);
      this.quoteTimeout = null;
    }
  }

  startShake() {
    var area = document.querySelector('.canvas-area');
    if (area) area.classList.add('shaking');
    this.shakeTimeout = setTimeout(() => this.stopShake(), 500);
  }

  stopShake() {
    var area = document.querySelector('.canvas-area');
    if (area) area.classList.remove('shaking');
    if (this.shakeTimeout) {
      clearTimeout(this.shakeTimeout);
      this.shakeTimeout = null;
    }
  }

  /* ---------- 状态更新 ---------- */

  updateLitCount() {
    if (!this.currentDomain) return;
    let totalLit = 0;
    let totalPlanets = 0;

    for (const domain of knowledgeDomains) {
      for (const node of domain.nodes) {
        totalPlanets++;
        if (node.lit) totalLit++;
      }
    }

    this.els.litCount.textContent = totalLit;
    this.els.statusLit.textContent = totalLit;
    this.els.statusText.innerHTML = `已点亮 <span class="highlight">${totalLit}</span> / ${totalPlanets} 颗星球`;

    // 更新进度条（当前领域点亮比例）
    if (this.currentDomain) {
      var domainLit = 0;
      var domainTotal = this.currentDomain.nodes.length;
      for (const node of this.currentDomain.nodes) {
        if (node.lit) domainLit++;
      }
      var pct = domainTotal > 0 ? (domainLit / domainTotal * 100) : 0;
      this.els.progressBarFill.style.width = pct + '%';
    }

    // 动态更新 OG image
    this._updateOGImage();
  }

  _updateOGImage() {
    try {
      var canvas = document.getElementById('starmap-canvas');
      if (canvas && this.currentDomain) {
        // 延迟执行以等待渲染完成
        setTimeout(() => {
          var ogMeta = document.querySelector('meta[property="og:image"]');
          if (ogMeta && canvas.width > 0 && canvas.height > 0) {
            var dataURL = canvas.toDataURL('image/png');
            ogMeta.setAttribute('content', dataURL);
          }
        }, 1000);
      }
    } catch (e) {
      // 安全忽略
    }
  }

  /* ---------- 星座检查与成就触发 ---------- */

  _checkConstellation() {
    if (!this.currentDomain || !this.constellationAnimator || !this.achievementManager) return;
    var self = this;
    var triggered = this.constellationAnimator.checkAndTrigger(this.currentDomain, function (domain) {
      // 星座连线完成后，延迟 0.8 秒弹出成就弹窗
      setTimeout(function () {
        self.achievementManager.show(domain);
      }, 800);
    });
    if (!triggered) {
      // 即使不是完整星座，也要检查是否有已点亮的（显示海报按钮）
      this.achievementManager.updateSidebarButton();
    }
  }

  resetProgress() {
    if (!confirm('确定要清空所有学习进度吗？此操作不可恢复。')) return;

    for (const domain of knowledgeDomains) {
      for (const node of domain.nodes) {
        node.lit = false;
        for (const task of node.tasks) {
          task.completed = false;
        }
      }
    }

    localStorage.removeItem(STORAGE_KEY);
    this.savedData = null;

    if (this.currentDomain) {
      this.planetRenderer.loadDomain(this.currentDomain);
      this.showPlanetList();
    }

    this.updateLitCount();
  }

  /* ---------- 辅助方法 ---------- */

  showGuide(text) {
    this.els.knowledgeList.innerHTML = `
      <div class="knowledge-guide" style="animation: fadeIn 0.4s ease both;">
        ${this.escapeHtml(text)}
      </div>
    `;
  }

  shakeInput() {
    const input = this.els.exploreInput;
    input.style.transform = 'translateX(0)';
    input.animate([
      { transform: 'translateX(0)' },
      { transform: 'translateX(-6px)' },
      { transform: 'translateX(6px)' },
      { transform: 'translateX(-4px)' },
      { transform: 'translateX(4px)' },
      { transform: 'translateX(0)' },
    ], {
      duration: 400,
      easing: 'ease-out',
    });
  }

  toggleSidebar() {
    this.sidebarOpen = !this.sidebarOpen;
    this.els.sidebar.classList.toggle('open', this.sidebarOpen);
  }

  escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
}

/* ============================================================
   初始化
   ============================================================ */

document.addEventListener('DOMContentLoaded', () => {
  const starfield = new StarfieldRenderer('starmap-canvas');
  const planetRenderer = new PlanetRenderer('starmap-canvas', starfield);
  const ui = new StarmapUI(planetRenderer);
  planetRenderer.setUI(ui);

  // 火箭动画管理器接线
  const rocketAnimator = new RocketAnimator(planetRenderer);
  planetRenderer.rocketAnimator = rocketAnimator;
  ui.rocketAnimator = rocketAnimator;
  rocketAnimator.sound = ui.sound;

  // Session 5: 行星点亮动画管理器
  const lightAnimator = new PlanetLightAnimator(planetRenderer);
  planetRenderer.lightAnimator = lightAnimator;
  ui.lightAnimator = lightAnimator;

  // Session 5: 星座连线动画管理器
  const constellationAnimator = new ConstellationAnimator(planetRenderer);
  planetRenderer.constellationAnimator = constellationAnimator;
  ui.constellationAnimator = constellationAnimator;

  // Session 5: 成就弹窗管理器
  const achievementManager = new AchievementManager(planetRenderer, ui);
  ui.achievementManager = achievementManager;

  // 引导卡片逻辑：无 localStorage 数据时显示引导
  var saved = loadStarmapData();
  if (!saved) {
    // 无数据，显示引导卡片
    var onboardingOverlay = document.getElementById('onboarding-overlay');
    if (onboardingOverlay) {
      onboardingOverlay.classList.remove('hidden');
    }
  } else if (saved.currentDomainId) {
    // 有保存的领域，自动展开
    var domain = knowledgeDomains.find(d => d.id === saved.currentDomainId);
    if (domain) {
      // 隐藏引导卡片
      var onboardingOverlay = document.getElementById('onboarding-overlay');
      if (onboardingOverlay) {
        onboardingOverlay.classList.add('hidden');
      }

      ui.currentDomain = domain;
      ui.restoreFromStorage();
      planetRenderer.loadDomain(domain);
      if (ui.els.knowledgeGuide) {
        ui.els.knowledgeGuide.remove();
        ui.els.knowledgeGuide = null;
      }
      ui.showPlanetList();
      ui.updateLitCount();

      // 恢复后检查已点亮行星的呼吸动画 & 星座状态
      for (var node of domain.nodes) {
        if (node.lit) {
          lightAnimator.triggerLight(node);
        }
      }
      // 检查是否已有完整星座
      achievementManager.updateSidebarButton();
      setTimeout(function () {
        constellationAnimator.checkAndTrigger(domain, function (d) {
          setTimeout(function () { achievementManager.show(d); }, 800);
        });
      }, 500);
    }
  } else {
    // 有数据但无领域，隐藏引导卡片
    var onboardingOverlay = document.getElementById('onboarding-overlay');
    if (onboardingOverlay) {
      onboardingOverlay.classList.add('hidden');
    }
  }

  window.starfield = starfield;
  window.planetRenderer = planetRenderer;
  window.starmapUI = ui;
});
</script>
