<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搜索结果 - LinkForge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="lib/echarts.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
            mono: ['Geist Mono', 'monospace'],
          },
          colors: {
            zinc: {
              50: '#fafafa',
              100: '#f4f4f5',
              200: '#e4e4e7',
              300: '#d4d4d8',
              400: '#a1a1aa',
              500: '#71717a',
              600: '#52525b',
              700: '#3f3f46',
              800: '#27272a',
              900: '#18181b',
              950: '#09090b',
            },
            cyan: {
              400: '#22d3ee',
              500: '#06b6d4',
              600: '#0891b2',
              700: '#0e7490',
            },
            emerald: {
              400: '#34d399',
              500: '#10b981',
            },
          },
          animation: {
            'fade-in': 'fadeIn 0.3s ease-out',
            'slide-up': 'slideUp 0.3s ease-out',
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'bounce-dot': 'bounceDot 1.4s infinite ease-in-out both',
            'glow-pulse': 'glowPulse 2s ease-in-out infinite',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            bounceDot: {
              '0%, 80%, 100%': { transform: 'scale(0)', opacity: '0.5' },
              '40%': { transform: 'scale(1)', opacity: '1' },
            },
            glowPulse: {
              '0%, 100%': { filter: 'drop-shadow(0 0 20px rgba(6, 182, 212, 0.5))' },
              '50%': { filter: 'drop-shadow(0 0 40px rgba(6, 182, 212, 0.8))' },
            },
          },
        },
      },
    }
  </script>
</head>
<body class="bg-zinc-950 text-zinc-50">
  <canvas id="particleCanvas" class="particle-canvas"></canvas>
  <div class="dark-overlay"></div>

  <nav id="navbar" class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 bg-zinc-950 border-b border-white/10">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-2">
          <a href="index.html" class="flex items-center space-x-2">
            <div class="w-10 h-10 bg-gradient-to-br from-cyan-500 to-teal-500 rounded-xl flex items-center justify-center animate-glow-pulse">
              <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                <path d="M2 17l10 5 10-5"/>
                <path d="M2 12l10 5 10-5"/>
              </svg>
            </div>
            <span class="text-xl font-bold text-zinc-50">LinkForge</span>
          </a>
        </div>
        
        <div class="hidden md:flex flex-1 max-w-xl mx-8">
          <div class="relative w-full">
            <input type="text" id="searchInput" placeholder="搜索企业、能力或需求..." 
              class="w-full px-4 py-2.5 pl-10 rounded-xl border border-white/10 bg-zinc-900 text-zinc-50 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/20 focus:border-cyan-500 transition-all">
            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-zinc-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <div class="absolute right-2 top-1/2 -translate-y-1/2 px-2 py-0.5 bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 rounded-md text-xs font-mono font-semibold">AI</div>
          </div>
        </div>
        
        <div class="flex items-center space-x-3">
          <button onclick="window.location.href='inbox.html'" class="p-2 hover:bg-zinc-800 rounded-lg transition-colors relative">
            <svg class="w-6 h-6 text-zinc-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
            </svg>
            <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
          </button>
          <button onclick="window.location.href='onboard.html'" class="hidden sm:inline-flex px-4 py-2 text-zinc-400 font-medium hover:text-zinc-50 transition-colors">
            入驻企业
          </button>
        </div>
      </div>
    </div>
  </nav>

  <main class="relative content-layer pt-24 pb-24 lg:pb-12">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="md:hidden mb-6">
        <div class="relative w-full">
          <input type="text" id="mobileSearchInput" placeholder="搜索企业、能力或需求..." 
            class="w-full px-4 py-2.5 pl-10 rounded-xl border border-white/10 bg-zinc-900 text-zinc-50 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/20 focus:border-cyan-500 transition-all">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-zinc-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <div class="absolute right-2 top-1/2 -translate-y-1/2 px-2 py-0.5 bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 rounded-md text-xs font-mono font-semibold">AI</div>
        </div>
      </div>

      <div id="aiThinking" class="hidden mb-8 p-6 bg-gradient-to-r from-cyan-500/10 to-zinc-900/80 rounded-2xl border border-cyan-500/30 backdrop-blur-sm">
        <div class="flex items-center space-x-4">
          <div class="flex space-x-1.5">
            <span class="w-2 h-2 bg-cyan-400 rounded-full animate-bounce-dot"></span>
            <span class="w-2 h-2 bg-cyan-400 rounded-full animate-bounce-dot"></span>
            <span class="w-2 h-2 bg-cyan-400 rounded-full animate-bounce-dot"></span>
          </div>
          <div>
            <p class="text-zinc-50 font-medium">AI正在分析您的需求</p>
            <p class="text-sm text-zinc-400" id="thinkingText">正在提取关键信息...</p>
          </div>
        </div>
      </div>

      <div id="resultsHeader" class="mb-8">
        <h1 class="text-2xl font-bold text-zinc-50 mb-2">搜索结果</h1>
        <p class="text-zinc-400">找到 <span id="resultCount" class="font-mono font-semibold text-cyan-400">0</span> 家匹配企业，AI匹配度 <span id="avgMatchScore" class="font-mono font-semibold text-cyan-400">0</span>%+</p>
      </div>

      <div class="flex flex-col lg:flex-row gap-8">
        <aside id="sidebar" class="lg:w-64 flex-shrink-0">
          <div class="bg-zinc-900/80 backdrop-blur-sm rounded-2xl border border-white/10 p-6 sticky top-24">
            <h3 class="font-semibold text-zinc-50 mb-4">筛选条件</h3>
            
            <div class="mb-6">
              <h4 class="text-sm font-medium text-zinc-400 mb-3">行业</h4>
              <div class="space-y-2" id="industryFilters">
              </div>
            </div>
            
            <div class="mb-6">
              <h4 class="text-sm font-medium text-zinc-400 mb-3">最低评分</h4>
              <select id="minRatingFilter" class="w-full px-3 py-2 rounded-lg border border-white/10 bg-zinc-800 text-zinc-50 focus:outline-none focus:ring-2 focus:ring-cyan-500/20 focus:border-cyan-500 transition-all">
                <option value="">全部评分</option>
                <option value="90">90分以上</option>
                <option value="85">85分以上</option>
                <option value="80">80分以上</option>
              </select>
            </div>
            
            <div class="mb-6">
              <h4 class="text-sm font-medium text-zinc-400 mb-3">地区</h4>
              <select id="cityFilter" class="w-full px-3 py-2 rounded-lg border border-white/10 bg-zinc-800 text-zinc-50 focus:outline-none focus:ring-2 focus:ring-cyan-500/20 focus:border-cyan-500 transition-all">
                <option value="">全部地区</option>
              </select>
            </div>
            
            <div class="mb-6">
              <h4 class="text-sm font-medium text-zinc-400 mb-3">企业规模</h4>
              <select id="sizeFilter" class="w-full px-3 py-2 rounded-lg border border-white/10 bg-zinc-800 text-zinc-50 focus:outline-none focus:ring-2 focus:ring-cyan-500/20 focus:border-cyan-500 transition-all">
                <option value="">全部规模</option>
                <option value="50-100人">50-100人</option>
                <option value="100-200人">100-200人</option>
                <option value="200-500人">200-500人</option>
                <option value="500-1000人">500-1000人</option>
              </select>
            </div>
            
            <button id="resetFilters" class="w-full px-4 py-2 text-zinc-400 font-medium hover:text-zinc-50 hover:bg-zinc-800 rounded-lg transition-colors">
              重置筛选
            </button>
          </div>
        </aside>

        <div class="flex-1">
          <div class="flex items-center justify-between mb-6">
            <div class="flex items-center space-x-2">
              <span class="text-sm text-zinc-500">排序：</span>
              <button id="sortMatch" class="px-4 py-2 bg-cyan-500/20 text-cyan-400 rounded-lg text-sm font-medium border border-cyan-500/30">匹配度</button>
              <button id="sortRating" class="px-4 py-2 text-zinc-400 hover:bg-zinc-800 hover:text-zinc-50 rounded-lg text-sm font-medium transition-colors">评分</button>
              <button id="sortDate" class="px-4 py-2 text-zinc-400 hover:bg-zinc-800 hover:text-zinc-50 rounded-lg text-sm font-medium transition-colors">入驻时间</button>
            </div>
            <button id="mobileFilterBtn" class="lg:hidden px-4 py-2 bg-zinc-900/80 border border-white/10 rounded-lg text-sm font-medium text-zinc-400 flex items-center space-x-2">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/>
              </svg>
              <span>筛选</span>
            </button>
          </div>

          <div id="resultsList" class="space-y-6">
            <div class="text-center py-16">
              <div class="w-20 h-20 mx-auto mb-4 bg-zinc-800 rounded-full flex items-center justify-center border border-white/10">
                <svg class="w-10 h-10 text-zinc-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
              </div>
              <p class="text-zinc-500">输入关键词开始搜索</p>
            </div>
          </div>

          <div id="noResults" class="hidden text-center py-16">
            <div class="w-20 h-20 mx-auto mb-4 bg-zinc-800 rounded-full flex items-center justify-center border border-white/10">
              <svg class="w-10 h-10 text-zinc-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
            </div>
            <p class="text-zinc-500 mb-4">未找到匹配的企业</p>
            <button onclick="window.location.href='index.html'" class="btn-primary px-6 py-2 rounded-xl text-sm font-semibold">返回首页</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="mobileFilterPanel" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/50" onclick="closeMobileFilter()"></div>
    <div class="absolute bottom-0 left-0 right-0 bg-zinc-900 rounded-t-3xl max-h-[80vh] overflow-y-auto p-6 animate-slide-up border-t border-white/10">
      <div class="flex items-center justify-between mb-6">
        <h3 class="text-lg font-semibold text-zinc-50">筛选条件</h3>
        <button onclick="closeMobileFilter()" class="w-8 h-8 flex items-center justify-center hover:bg-zinc-800 rounded-full transition-colors">
          <svg class="w-5 h-5 text-zinc-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      
      <div class="space-y-6">
        <div>
          <h4 class="text-sm font-medium text-zinc-400 mb-3">行业</h4>
          <div class="space-y-2" id="mobileIndustryFilters"></div>
        </div>
        
        <div>
          <h4 class="text-sm font-medium text-zinc-400 mb-3">最低评分</h4>
          <select id="mobileMinRatingFilter" class="w-full px-3 py-2 rounded-lg border border-white/10 bg-zinc-800 text-zinc-50">
            <option value="">全部评分</option>
            <option value="90">90分以上</option>
            <option value="85">85分以上</option>
            <option value="80">80分以上</option>
          </select>
        </div>
        
        <div>
          <h4 class="text-sm font-medium text-zinc-400 mb-3">地区</h4>
          <select id="mobileCityFilter" class="w-full px-3 py-2 rounded-lg border border-white/10 bg-zinc-800 text-zinc-50">
            <option value="">全部地区</option>
          </select>
        </div>
        
        <div>
          <h4 class="text-sm font-medium text-zinc-400 mb-3">企业规模</h4>
          <select id="mobileSizeFilter" class="w-full px-3 py-2 rounded-lg border border-white/10 bg-zinc-800 text-zinc-50">
            <option value="">全部规模</option>
            <option value="50-100人">50-100人</option>
            <option value="100-200人">100-200人</option>
            <option value="200-500人">200-500人</option>
            <option value="500-1000人">500-1000人</option>
          </select>
        </div>
      </div>
      
      <div class="flex space-x-4 mt-8">
        <button onclick="closeMobileFilter()" class="flex-1 btn-secondary px-6 py-3 rounded-xl font-semibold">取消</button>
        <button onclick="applyMobileFilters()" class="flex-1 btn-primary px-6 py-3 rounded-xl font-semibold">应用筛选</button>
      </div>
    </div>
  </div>

  <nav class="mobile-bottom-nav lg:hidden">
    <div class="flex items-center justify-around">
      <a href="index.html" class="flex flex-col items-center gap-1 px-4 py-2 text-zinc-500 hover:text-cyan-400 transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        <span class="text-xs font-medium">首页</span>
      </a>
      <a href="search.html" class="flex flex-col items-center gap-1 px-4 py-2 text-cyan-400">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <span class="text-xs font-medium">搜索</span>
      </a>
      <a href="demand.html" class="flex flex-col items-center gap-1 px-4 py-2 text-zinc-500 hover:text-cyan-400 transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
        </svg>
        <span class="text-xs font-medium">发布</span>
      </a>
      <a href="inbox.html" class="flex flex-col items-center gap-1 px-4 py-2 text-zinc-500 hover:text-cyan-400 transition-colors relative">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
        </svg>
        <span class="text-xs font-medium">消息</span>
        <span class="absolute top-0 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
      </a>
    </div>
  </nav>

  <script src="js/particles.js"></script>
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/ai-engine.js"></script>
  <script src="js/search.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      ParticleSystem.init('particleCanvas');

      const navbar = document.getElementById('navbar');
      window.addEventListener('scroll', () => {
        if (window.scrollY > 20) {
          navbar.classList.add('shadow-lg', 'shadow-cyan-500/5');
        } else {
          navbar.classList.remove('shadow-lg', 'shadow-cyan-500/5');
        }
      });

      const mobileSearchInput = document.getElementById('mobileSearchInput');
      if (mobileSearchInput) {
        mobileSearchInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            const searchInput = document.getElementById('searchInput');
            searchInput.value = mobileSearchInput.value;
            const event = new Event('keypress');
            event.key = 'Enter';
            searchInput.dispatchEvent(event);
          }
        });
      }
    });
  </script>
</body>
</html>
