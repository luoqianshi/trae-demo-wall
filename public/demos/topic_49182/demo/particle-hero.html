<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkForge - 粒子动画Hero</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', system-ui, sans-serif; }

    :root {
      --bg-primary: #09090b;
      --text-primary: #fafafa;
      --text-secondary: #a1a1aa;
      --accent: #06b6d4;
    }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow-x: hidden;
      margin: 0;
    }

    /* Particle Canvas */
    #particleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Grid Background */
    .grid-bg {
      background-image:
        linear-gradient(rgba(6, 182, 212, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(6, 182, 212, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* Gradient Text */
    .gradient-text {
      background: linear-gradient(135deg, #22d3ee 0%, #10b981 50%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Hero Content */
    .hero-content {
      position: relative;
      z-index: 10;
    }

    /* Floating Orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.5;
      animation: orbFloat 8s ease-in-out infinite;
    }

    .orb-1 {
      width: 400px;
      height: 400px;
      background: linear-gradient(135deg, #06b6d4, #22d3ee);
      top: 10%;
      left: 10%;
      animation-delay: 0s;
    }

    .orb-2 {
      width: 350px;
      height: 350px;
      background: linear-gradient(135deg, #10b981, #34d399);
      top: 50%;
      right: 10%;
      animation-delay: -2s;
    }

    .orb-3 {
      width: 300px;
      height: 300px;
      background: linear-gradient(135deg, #0ea5e9, #38bdf8);
      bottom: 10%;
      left: 30%;
      animation-delay: -4s;
    }

    @keyframes orbFloat {
      0%, 100% {
        transform: translate(0, 0) scale(1);
      }
      25% {
        transform: translate(20px, -30px) scale(1.05);
      }
      50% {
        transform: translate(-20px, 20px) scale(0.95);
      }
      75% {
        transform: translate(30px, 10px) scale(1.02);
      }
    }

    /* Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(6, 182, 212, 0.1);
      border: 1px solid rgba(6, 182, 212, 0.2);
      border-radius: 50px;
      animation: badgePulse 2s ease-in-out infinite;
    }

    @keyframes badgePulse {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(6, 182, 212, 0.4);
      }
      50% {
        box-shadow: 0 0 0 10px rgba(6, 182, 212, 0);
      }
    }

    /* Button Styles */
    .btn-primary {
      background: linear-gradient(135deg, #06b6d4 0%, #14b8a6 100%);
      color: white;
      padding: 16px 32px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 16px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: left 0.5s ease;
    }

    .btn-primary:hover::before {
      left: 100%;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 20px 40px rgba(6, 182, 212, 0.4);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.05);
      color: white;
      padding: 16px 32px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 16px;
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.3s ease;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(6, 182, 212, 0.5);
      transform: translateY(-3px);
    }

    /* Stats Card */
    .stat-card {
      background: linear-gradient(145deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.01) 100%);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 24px;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .stat-card:hover {
      background: linear-gradient(145deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 100%);
      border-color: rgba(6, 182, 212, 0.3);
      transform: translateY(-4px);
    }

    /* Counter Animation */
    .counter {
      font-variant-numeric: tabular-nums;
    }

    /* Scroll Indicator */
    .scroll-indicator {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
      animation: scrollBounce 2s ease-in-out infinite;
    }

    @keyframes scrollBounce {
      0%, 100% {
        transform: translateX(-50%) translateY(0);
      }
      50% {
        transform: translateX(-50%) translateY(10px);
      }
    }

    /* Mouse Trail Effect */
    .mouse-trail {
      position: fixed;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.8) 0%, transparent 70%);
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: opacity 0.3s ease;
    }

    /* Scan Line Effect */
    .scan-line {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(6, 182, 212, 0.5), transparent);
      animation: scan 4s linear infinite;
    }

    @keyframes scan {
      0% { top: 0; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    /* Dark Overlay */
    .dark-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(ellipse at center, rgba(6, 182, 212, 0.08) 0%, transparent 60%),
        linear-gradient(180deg, rgba(9, 9, 11, 0.3) 0%, rgba(9, 9, 11, 0.6) 50%, rgba(9, 9, 11, 0.4) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* Glow Pulse */
    .glow-pulse {
      animation: glowPulse 3s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% {
        filter: drop-shadow(0 0 20px rgba(6, 182, 212, 0.5));
      }
      50% {
        filter: drop-shadow(0 0 40px rgba(6, 182, 212, 0.8));
      }
    }
  </style>
</head>
<body class="grid-bg">
  <!-- Particle Canvas -->
  <canvas id="particleCanvas"></canvas>

  <!-- Dark Overlay -->
  <div class="dark-overlay"></div>

  <!-- Mouse Trail -->
  <div id="mouseTrail" class="mouse-trail"></div>

  <!-- Main Content -->
  <main class="relative min-h-screen flex items-center justify-center overflow-hidden z-10">
    <!-- Floating Orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- Scan Line -->
    <div class="scan-line"></div>

    <!-- Hero Content -->
    <div class="hero-content max-w-6xl mx-auto px-6 text-center">
      <!-- Badge -->
      <div class="badge mb-8">
        <span class="w-2 h-2 bg-cyan-400 rounded-full animate-pulse"></span>
        <span class="text-cyan-400 text-sm font-medium">AI驱动的企业协作平台</span>
      </div>

      <!-- Headline -->
      <h1 class="text-5xl md:text-7xl font-bold mb-6 glow-pulse">
        <span class="gradient-text">智能匹配</span>
        <br>
        <span class="text-white">全球商业伙伴</span>
      </h1>

      <!-- Subheadline -->
      <p class="text-xl md:text-2xl text-zinc-400 max-w-3xl mx-auto mb-12 leading-relaxed">
        连接23个国家，10,000+家企业在这里找到了完美的商业伙伴。
        <br class="hidden md:block">
        告别繁琐的尽调流程，让AI为您精准配对。
      </p>

      <!-- CTA Buttons -->
      <div class="flex flex-col sm:flex-row gap-4 justify-center mb-20">
        <button class="btn-primary">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
          立即体验AI匹配
        </button>
        <button class="btn-secondary">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          观看演示视频
        </button>
      </div>

      <!-- Stats -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6 max-w-4xl mx-auto">
        <div class="stat-card">
          <div class="text-4xl md:text-5xl font-bold gradient-text counter" data-target="10247">0</div>
          <div class="text-zinc-500 text-sm mt-2">入驻企业</div>
        </div>
        <div class="stat-card">
          <div class="text-4xl md:text-5xl font-bold gradient-text counter" data-target="23">0</div>
          <div class="text-zinc-500 text-sm mt-2">覆盖国家</div>
        </div>
        <div class="stat-card">
          <div class="text-4xl md:text-5xl font-bold gradient-text counter" data-target="98.6" data-suffix="%">0%</div>
          <div class="text-zinc-500 text-sm mt-2">匹配准确率</div>
        </div>
        <div class="stat-card">
          <div class="text-4xl md:text-5xl font-bold gradient-text counter" data-target="48" data-suffix="h">0h</div>
          <div class="text-zinc-500 text-sm mt-2">平均匹配时长</div>
        </div>
      </div>
    </div>

    <!-- Scroll Indicator -->
    <div class="scroll-indicator">
      <span class="text-sm">向下滚动</span>
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"/>
      </svg>
    </div>
  </main>

  <script>
    // ========================
    // Particle System
    // ========================
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');

    let particles = [];
    let mouse = { x: null, y: null };
    const particleCount = 150;
    const connectionDistance = 120;
    const mouseRadius = 150;

    // Resize canvas
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Track mouse
    window.addEventListener('mousemove', (e) => {
      mouse.x = e.x;
      mouse.y = e.y;
      // Update mouse trail
      const trail = document.getElementById('mouseTrail');
      trail.style.left = e.clientX + 'px';
      trail.style.top = e.clientY + 'px';
    });

    window.addEventListener('mouseout', () => {
      mouse.x = null;
      mouse.y = null;
    });

    // Particle class
    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 1;
        this.speedX = (Math.random() - 0.5) * 0.5;
        this.speedY = (Math.random() - 0.5) * 0.5;
        this.color = this.getRandomColor();
      }

      getRandomColor() {
        const colors = [
          'rgba(6, 182, 212, 1)',   // Cyan
          'rgba(34, 211, 238, 1)',  // Sky
          'rgba(16, 185, 129, 1)',  // Emerald
          'rgba(14, 165, 233, 1)',  // Blue
        ];
        return colors[Math.floor(Math.random() * colors.length)];
      }

      update() {
        // Mouse interaction
        if (mouse.x && mouse.y) {
          const dx = mouse.x - this.x;
          const dy = mouse.y - this.y;
          const distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < mouseRadius) {
            const force = (mouseRadius - distance) / mouseRadius;
            const angle = Math.atan2(dy, dx);
            this.x -= Math.cos(angle) * force * 2;
            this.y -= Math.sin(angle) * force * 2;
          }
        }

        // Move
        this.x += this.speedX;
        this.y += this.speedY;

        // Bounce off edges
        if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
        if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
      }
    }

    // Create particles
    function initParticles() {
      particles = [];
      for (let i = 0; i < particleCount; i++) {
        particles.push(new Particle());
      }
    }

    // Connect particles with lines
    function connectParticles() {
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < connectionDistance) {
            const opacity = 1 - (distance / connectionDistance);
            ctx.beginPath();
            ctx.strokeStyle = `rgba(6, 182, 212, ${opacity * 0.3})`;
            ctx.lineWidth = 1;
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
          }
        }
      }
    }

    // Connect particles to mouse
    function connectToMouse() {
      if (mouse.x && mouse.y) {
        particles.forEach(particle => {
          const dx = mouse.x - particle.x;
          const dy = mouse.y - particle.y;
          const distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < mouseRadius) {
            const opacity = 1 - (distance / mouseRadius);
            ctx.beginPath();
            ctx.strokeStyle = `rgba(34, 211, 238, ${opacity * 0.6})`;
            ctx.lineWidth = 1.5;
            ctx.moveTo(particle.x, particle.y);
            ctx.lineTo(mouse.x, mouse.y);
            ctx.stroke();
          }
        });
      }
    }

    // Animation loop
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles.forEach(particle => {
        particle.update();
        particle.draw();
      });

      connectParticles();
      connectToMouse();

      requestAnimationFrame(animate);
    }

    initParticles();
    animate();

    // ========================
    // Counter Animation
    // ========================
    function animateCounters() {
      const counters = document.querySelectorAll('.counter');
      counters.forEach(counter => {
        const target = parseFloat(counter.dataset.target);
        const suffix = counter.dataset.suffix || '';
        const duration = 2000;
        const start = performance.now();

        function update(currentTime) {
          const elapsed = currentTime - start;
          const progress = Math.min(elapsed / duration, 1);
          const easeOut = 1 - Math.pow(1 - progress, 3);
          const current = target * easeOut;

          if (target % 1 !== 0) {
            counter.textContent = current.toFixed(1) + suffix;
          } else {
            counter.textContent = Math.floor(current).toLocaleString() + suffix;
          }

          if (progress < 1) {
            requestAnimationFrame(update);
          }
        }

        requestAnimationFrame(update);
      });
    }

    // Trigger counter animation when visible
    const counterObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          animateCounters();
          counterObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.5 });

    document.querySelectorAll('.counter').forEach(el => counterObserver.observe(el));

    // ========================
    // Mouse Trail Visibility
    // ========================
    const mouseTrail = document.getElementById('mouseTrail');
    document.addEventListener('mouseenter', () => {
      mouseTrail.style.opacity = '1';
    });
    document.addEventListener('mouseleave', () => {
      mouseTrail.style.opacity = '0';
    });
  </script>
</body>
</html>
