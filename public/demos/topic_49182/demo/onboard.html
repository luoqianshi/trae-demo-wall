<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企业入驻 - LinkForge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="lib/echarts.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
            mono: ['Geist Mono', 'monospace'],
          },
          colors: {
            zinc: {
              50: '#fafafa',
              100: '#f4f4f5',
              200: '#e4e4e7',
              300: '#d4d4d8',
              400: '#a1a1aa',
              500: '#71717a',
              600: '#52525b',
              700: '#3f3f46',
              800: '#27272a',
              900: '#18181b',
              950: '#09090b',
            },
            cyan: {
              400: '#22d3ee',
              500: '#06b6d4',
              600: '#0891b2',
              700: '#0e7490',
            },
            emerald: {
              400: '#34d399',
              500: '#10b981',
            },
          },
          animation: {
            'fade-in': 'fadeIn 0.3s ease-out',
            'slide-up': 'slideUp 0.3s ease-out',
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'bounce-dot': 'bounceDot 1.4s infinite ease-in-out both',
            'glow-pulse': 'glowPulse 2s ease-in-out infinite',
            'confetti': 'confetti 1s ease-out forwards',
            'float': 'float 3s ease-in-out infinite',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            bounceDot: {
              '0%, 80%, 100%': { transform: 'scale(0)', opacity: '0.5' },
              '40%': { transform: 'scale(1)', opacity: '1' },
            },
            glowPulse: {
              '0%, 100%': { filter: 'drop-shadow(0 0 20px rgba(6, 182, 212, 0.5))' },
              '50%': { filter: 'drop-shadow(0 0 40px rgba(6, 182, 212, 0.8))' },
            },
            confetti: {
              '0%': { transform: 'translateY(0) rotate(0deg)', opacity: '1' },
              '100%': { transform: 'translateY(100px) rotate(720deg)', opacity: '0' },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-10px)' },
            },
          },
        },
      },
    }
  </script>
</head>
<body class="bg-zinc-950 text-zinc-50">
  <canvas id="particleCanvas" class="particle-canvas"></canvas>
  <div class="dark-overlay"></div>

  <nav id="navbar" class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 bg-zinc-950 border-b border-white/10">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-2">
          <a href="index.html" class="flex items-center space-x-2">
            <div class="w-10 h-10 bg-gradient-to-br from-cyan-500 to-teal-500 rounded-xl flex items-center justify-center animate-glow-pulse">
              <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                <path d="M2 17l10 5 10-5"/>
                <path d="M2 12l10 5 10-5"/>
              </svg>
            </div>
            <span class="text-xl font-bold text-zinc-50">LinkForge</span>
          </a>
        </div>
        
        <div class="hidden md:flex flex-1 max-w-xl mx-8">
          <div class="relative w-full">
            <input type="text" id="searchInput" placeholder="搜索企业、能力或需求..." 
              class="w-full px-4 py-2.5 pl-10 rounded-xl border border-white/10 bg-zinc-900 text-zinc-50 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/20 focus:border-cyan-500 transition-all">
            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-zinc-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <div class="absolute right-2 top-1/2 -translate-y-1/2 px-2 py-0.5 bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 rounded-md text-xs font-mono font-semibold">AI</div>
          </div>
        </div>
        
        <div class="flex items-center space-x-3">
          <button onclick="window.location.href='inbox.html'" class="p-2 hover:bg-zinc-800 rounded-lg transition-colors relative">
            <svg class="w-6 h-6 text-zinc-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
            </svg>
            <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
          </button>
          <button onclick="window.location.href='demand.html'" class="btn-primary px-5 py-2 rounded-xl text-sm font-semibold">
            发布需求
          </button>
        </div>
      </div>
    </div>
  </nav>

  <main class="relative content-layer pt-24 pb-24 lg:pb-12">
    <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-center space-x-2 mb-10">
        <div class="flex items-center">
          <div id="step1Indicator" class="w-10 h-10 bg-cyan-500 text-white rounded-full flex items-center justify-center font-bold text-sm">1</div>
          <div id="step1Line" class="w-16 h-0.5 bg-cyan-500/30"></div>
        </div>
        <div class="flex items-center">
          <div id="step2Indicator" class="w-10 h-10 bg-zinc-800 text-zinc-500 rounded-full flex items-center justify-center font-bold text-sm border border-white/10">2</div>
          <div id="step2Line" class="w-16 h-0.5 bg-zinc-800"></div>
        </div>
        <div class="flex items-center">
          <div id="step3Indicator" class="w-10 h-10 bg-zinc-800 text-zinc-500 rounded-full flex items-center justify-center font-bold text-sm border border-white/10">3</div>
          <div id="step3Line" class="w-16 h-0.5 bg-zinc-800"></div>
        </div>
        <div class="flex items-center">
          <div id="step4Indicator" class="w-10 h-10 bg-zinc-800 text-zinc-500 rounded-full flex items-center justify-center font-bold text-sm border border-white/10">4</div>
        </div>
      </div>

      <div id="step1" class="bg-zinc-900/80 backdrop-blur-sm rounded-3xl p-8 border border-white/10 animate-fade-in">
        <div class="text-center mb-8">
          <div class="w-20 h-20 mx-auto mb-6 bg-gradient-to-br from-cyan-500 to-cyan-600 rounded-2xl flex items-center justify-center">
            <svg class="w-10 h-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
          </div>
          <h2 class="text-2xl font-bold text-zinc-50 mb-3">欢迎入驻 LinkForge</h2>
          <p class="text-zinc-400">AI自动分析企业信息，5分钟快速完成入驻</p>
        </div>

        <div class="space-y-6">
          <div>
            <label class="block text-sm font-medium text-zinc-400 mb-2">企业官网或名称</label>
            <div class="relative">
              <input type="text" id="companyInput" placeholder="https://www.yourcompany.com 或 公司名称" 
                class="w-full px-4 py-4 pl-12 rounded-xl border border-white/10 bg-zinc-800 text-zinc-50 placeholder-zinc-500 focus:outline-none focus:border-cyan-500 focus:ring-4 focus:ring-cyan-500/10 transition-all text-lg">
              <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-6 h-6 text-zinc-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/>
              </svg>
            </div>
          </div>

          <div class="flex items-start space-x-3 p-4 bg-amber-500/10 rounded-xl border border-amber-500/30">
            <svg class="w-5 h-5 text-amber-400 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <p class="text-sm text-amber-400">AI将自动分析您的企业信息，智能生成企业画像。您可以在下一步确认和编辑信息。</p>
          </div>

          <button id="startAnalysisBtn" class="btn-primary w-full py-4 rounded-xl text-lg font-semibold">
            开始AI分析
          </button>
        </div>
      </div>

      <div id="step2" class="hidden bg-zinc-900/80 backdrop-blur-sm rounded-3xl p-8 border border-white/10">
        <div class="text-center mb-8">
          <div class="relative w-24 h-24 mx-auto mb-6">
            <div class="absolute inset-0 bg-gradient-to-br from-cyan-500 to-cyan-600 rounded-full animate-pulse-slow opacity-20"></div>
            <div class="absolute inset-2 bg-gradient-to-br from-cyan-500 to-cyan-600 rounded-full flex items-center justify-center">
              <svg class="w-10 h-10 text-white animate-float" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
              </svg>
            </div>
          </div>
          <h2 class="text-2xl font-bold text-zinc-50 mb-3">AI正在分析您的企业</h2>
          <p class="text-zinc-400" id="analysisStatus">正在读取企业信息...</p>
        </div>

        <div class="relative h-2 bg-zinc-800 rounded-full overflow-hidden mb-8">
          <div id="progressBar" class="absolute left-0 top-0 h-full bg-gradient-to-r from-cyan-500 to-cyan-400 rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>

        <div class="grid grid-cols-3 gap-4">
          <div class="text-center">
            <div id="analysisStep1" class="w-12 h-12 mx-auto mb-2 bg-zinc-800 rounded-full flex items-center justify-center border border-white/10">
              <svg class="w-6 h-6 text-zinc-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
              </svg>
            </div>
            <p class="text-sm text-zinc-400">信息采集</p>
          </div>
          <div class="text-center">
            <div id="analysisStep2" class="w-12 h-12 mx-auto mb-2 bg-zinc-800 rounded-full flex items-center justify-center border border-white/10">
              <svg class="w-6 h-6 text-zinc-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </div>
            <p class="text-sm text-zinc-400">行业分析</p>
          </div>
          <div class="text-center">
            <div id="analysisStep3" class="w-12 h-12 mx-auto mb-2 bg-zinc-800 rounded-full flex items-center justify-center border border-white/10">
              <svg class="w-6 h-6 text-zinc-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/>
              </svg>
            </div>
            <p class="text-sm text-zinc-400">画像生成</p>
          </div>
        </div>
      </div>

      <div id="step3" class="hidden bg-zinc-900/80 backdrop-blur-sm rounded-3xl p-8 border border-white/10">
        <div class="text-center mb-8">
          <div class="w-20 h-20 mx-auto mb-6 bg-gradient-to-br from-emerald-500 to-emerald-600 rounded-2xl flex items-center justify-center">
            <svg class="w-10 h-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          </div>
          <h2 class="text-2xl font-bold text-zinc-50 mb-3">AI分析完成</h2>
          <p class="text-zinc-400">以下是AI为您生成的企业画像，请确认并编辑</p>
        </div>

        <div class="space-y-6" id="profileForm">
        </div>

        <div class="flex space-x-4 mt-8">
          <button id="backToStep1Btn" class="flex-1 btn-secondary py-3 rounded-xl font-semibold">
            返回修改
          </button>
          <button id="confirmProfileBtn" class="flex-1 btn-primary py-3 rounded-xl font-semibold">
            确认入驻
          </button>
        </div>
      </div>

      <div id="step4" class="hidden bg-zinc-900/80 backdrop-blur-sm rounded-3xl p-8 border border-white/10 text-center">
        <div class="relative">
          <div id="confettiContainer" class="absolute inset-0 pointer-events-none overflow-hidden">
          </div>
          <div class="w-24 h-24 mx-auto mb-6 bg-gradient-to-br from-emerald-500 to-emerald-600 rounded-full flex items-center justify-center animate-float">
            <svg class="w-12 h-12 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
          </div>
        </div>
        <h2 class="text-3xl font-bold text-zinc-50 mb-3">入驻成功！</h2>
        <p class="text-zinc-400 mb-8">恭喜您的企业已成功入驻LinkForge，AI已为您生成企业画像</p>

        <div class="bg-zinc-800/50 rounded-2xl p-6 border border-white/10 mb-8 text-left">
          <h3 class="font-semibold text-zinc-50 mb-4">企业信息</h3>
          <div id="successInfo" class="space-y-3">
          </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-4">
          <button onclick="window.location.href='index.html'" class="flex-1 btn-primary py-4 rounded-xl font-semibold">
            返回首页
          </button>
          <button onclick="window.location.href='company.html?id=new'" class="flex-1 btn-secondary py-4 rounded-xl font-semibold">
            查看企业主页
          </button>
        </div>
      </div>
    </div>
  </main>

  <nav class="mobile-bottom-nav lg:hidden">
    <div class="flex items-center justify-around">
      <a href="index.html" class="flex flex-col items-center gap-1 px-4 py-2 text-zinc-500 hover:text-cyan-400 transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        <span class="text-xs font-medium">首页</span>
      </a>
      <a href="search.html" class="flex flex-col items-center gap-1 px-4 py-2 text-zinc-500 hover:text-cyan-400 transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <span class="text-xs font-medium">搜索</span>
      </a>
      <a href="demand.html" class="flex flex-col items-center gap-1 px-4 py-2 text-zinc-500 hover:text-cyan-400 transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
        </svg>
        <span class="text-xs font-medium">发布</span>
      </a>
      <a href="inbox.html" class="flex flex-col items-center gap-1 px-4 py-2 text-zinc-500 hover:text-cyan-400 transition-colors relative">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
        </svg>
        <span class="text-xs font-medium">消息</span>
        <span class="absolute top-0 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
      </a>
    </div>
  </nav>

  <script src="js/particles.js"></script>
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/ai-engine.js"></script>
  <script src="js/onboard.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      ParticleSystem.init('particleCanvas');

      const navbar = document.getElementById('navbar');
      window.addEventListener('scroll', () => {
        if (window.scrollY > 20) {
          navbar.classList.add('shadow-lg', 'shadow-cyan-500/5');
        } else {
          navbar.classList.remove('shadow-lg', 'shadow-cyan-500/5');
        }
      });

      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            const query = searchInput.value.trim();
            if (query) {
              window.location.href = `search.html?q=${encodeURIComponent(query)}`;
            }
          }
        });
      }
    });
  </script>
</body>
</html>
