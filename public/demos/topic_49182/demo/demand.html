<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发布需求 - LinkForge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="lib/echarts.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
            mono: ['Geist Mono', 'monospace'],
          },
          colors: {
            zinc: {
              50: '#fafafa',
              100: '#f4f4f5',
              200: '#e4e4e7',
              300: '#d4d4d8',
              400: '#a1a1aa',
              500: '#71717a',
              600: '#52525b',
              700: '#3f3f46',
              800: '#27272a',
              900: '#18181b',
              950: '#09090b',
            },
            cyan: {
              400: '#22d3ee',
              500: '#06b6d4',
              600: '#0891b2',
              700: '#0e7490',
            },
            emerald: {
              400: '#34d399',
              500: '#10b981',
            },
          },
          animation: {
            'fade-in': 'fadeIn 0.3s ease-out',
            'slide-up': 'slideUp 0.3s ease-out',
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'bounce-dot': 'bounceDot 1.4s infinite ease-in-out both',
            'glow-pulse': 'glowPulse 2s ease-in-out infinite',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            bounceDot: {
              '0%, 80%, 100%': { transform: 'scale(0)', opacity: '0.5' },
              '40%': { transform: 'scale(1)', opacity: '1' },
            },
            glowPulse: {
              '0%, 100%': { filter: 'drop-shadow(0 0 20px rgba(6, 182, 212, 0.5))' },
              '50%': { filter: 'drop-shadow(0 0 40px rgba(6, 182, 212, 0.8))' },
            },
          },
        },
      },
    }
  </script>
</head>
<body class="bg-zinc-950 text-zinc-50">
  <canvas id="particleCanvas" class="particle-canvas"></canvas>
  <div class="dark-overlay"></div>

  <nav id="navbar" class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 bg-zinc-950 border-b border-white/10">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-2">
          <a href="index.html" class="flex items-center space-x-2">
            <div class="w-10 h-10 bg-gradient-to-br from-cyan-500 to-teal-500 rounded-xl flex items-center justify-center animate-glow-pulse">
              <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                <path d="M2 17l10 5 10-5"/>
                <path d="M2 12l10 5 10-5"/>
              </svg>
            </div>
            <span class="text-xl font-bold text-zinc-50">LinkForge</span>
          </a>
        </div>
        
        <div class="hidden md:flex flex-1 max-w-xl mx-8">
          <div class="relative w-full">
            <input type="text" id="searchInput" placeholder="搜索企业、能力或需求..." 
              class="w-full px-4 py-2.5 pl-10 rounded-xl border border-white/10 bg-zinc-900 text-zinc-50 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/20 focus:border-cyan-500 transition-all">
            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-zinc-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <div class="absolute right-2 top-1/2 -translate-y-1/2 px-2 py-0.5 bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 rounded-md text-xs font-mono font-semibold">AI</div>
          </div>
        </div>
        
        <div class="flex items-center space-x-3">
          <button onclick="window.location.href='inbox.html'" class="p-2 hover:bg-zinc-800 rounded-lg transition-colors relative">
            <svg class="w-6 h-6 text-zinc-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
            </svg>
            <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
          </button>
          <button onclick="window.location.href='onboard.html'" class="hidden sm:inline-flex px-4 py-2 text-zinc-400 font-medium hover:text-zinc-50 transition-colors">
            入驻企业
          </button>
        </div>
      </div>
    </div>
  </nav>

  <main class="relative content-layer pt-24 pb-24 lg:pb-12">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between mb-8">
        <div>
          <h1 class="text-2xl md:text-3xl font-bold text-zinc-50 mb-2">发布需求</h1>
          <p class="text-zinc-400">AI帮您精准匹配最合适的合作伙伴</p>
        </div>
        <button onclick="window.location.href='index.html'" class="hidden sm:inline-flex px-4 py-2 text-zinc-400 font-medium hover:bg-zinc-800 hover:text-zinc-50 rounded-xl transition-all">
          返回首页
        </button>
      </div>

      <div class="grid lg:grid-cols-3 gap-6">
        <div class="lg:col-span-2">
          <div class="bg-zinc-900/80 backdrop-blur-sm rounded-2xl border border-white/10 p-6">
            <form id="demand-form" class="space-y-6">
              <div>
                <label class="block text-sm font-semibold text-zinc-50 mb-2">需求标题 <span class="text-red-400">*</span></label>
                <input type="text" id="demand-title" placeholder="例如：寻找精密CNC加工供应商" class="w-full px-4 py-3 border border-white/10 bg-zinc-800 text-zinc-50 placeholder-zinc-500 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500/20 focus:border-cyan-500 transition-all">
              </div>

              <div>
                <label class="block text-sm font-semibold text-zinc-50 mb-2">需求描述 <span class="text-red-400">*</span></label>
                <textarea id="demand-description" rows="5" placeholder="详细描述您的需求，包括产品规格、技术要求、期望交付时间等..." class="w-full px-4 py-3 border border-white/10 bg-zinc-800 text-zinc-50 placeholder-zinc-500 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500/20 focus:border-cyan-500 transition-all resize-none"></textarea>
              </div>

              <div class="grid md:grid-cols-2 gap-4">
                <div>
                  <label class="block text-sm font-semibold text-zinc-50 mb-2">行业领域 <span class="text-red-400">*</span></label>
                  <select id="demand-industry" class="w-full px-4 py-3 border border-white/10 bg-zinc-800 text-zinc-50 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500/20 focus:border-cyan-500 transition-all">
                    <option value="">请选择行业</option>
                    <option value="电子制造">电子制造</option>
                    <option value="服装">服装</option>
                    <option value="机械">机械</option>
                    <option value="软件服务">软件服务</option>
                    <option value="设计">设计</option>
                    <option value="新能源">新能源</option>
                  </select>
                </div>
                <div>
                  <label class="block text-sm font-semibold text-zinc-50 mb-2">能力标签</label>
                  <input type="text" id="demand-capabilities" placeholder="用逗号分隔，如：CNC加工,快速打样" class="w-full px-4 py-3 border border-white/10 bg-zinc-800 text-zinc-50 placeholder-zinc-500 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500/20 focus:border-cyan-500 transition-all">
                </div>
              </div>

              <div class="grid md:grid-cols-3 gap-4">
                <div>
                  <label class="block text-sm font-semibold text-zinc-50 mb-2">预算范围</label>
                  <select id="demand-budget" class="w-full px-4 py-3 border border-white/10 bg-zinc-800 text-zinc-50 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500/20 focus:border-cyan-500 transition-all">
                    <option value="">请选择预算</option>
                    <option value="1万以下">1万以下</option>
                    <option value="1-5万">1-5万</option>
                    <option value="5-10万">5-10万</option>
                    <option value="10-50万">10-50万</option>
                    <option value="50万以上">50万以上</option>
                  </select>
                </div>
                <div>
                  <label class="block text-sm font-semibold text-zinc-50 mb-2">期望周期</label>
                  <select id="demand-period" class="w-full px-4 py-3 border border-white/10 bg-zinc-800 text-zinc-50 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500/20 focus:border-cyan-500 transition-all">
                    <option value="">请选择周期</option>
                    <option value="15天内">15天内</option>
                    <option value="30天内">30天内</option>
                    <option value="45天内">45天内</option>
                    <option value="60天内">60天内</option>
                    <option value="90天内">90天内</option>
                  </select>
                </div>
                <div>
                  <label class="block text-sm font-semibold text-zinc-50 mb-2">目标地区</label>
                  <select id="demand-region" class="w-full px-4 py-3 border border-white/10 bg-zinc-800 text-zinc-50 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500/20 focus:border-cyan-500 transition-all">
                    <option value="">不限地区</option>
                    <option value="深圳">深圳</option>
                    <option value="广州">广州</option>
                    <option value="东莞">东莞</option>
                    <option value="上海">上海</option>
                    <option value="杭州">杭州</option>
                    <option value="苏州">苏州</option>
                    <option value="北京">北京</option>
                    <option value="宁波">宁波</option>
                  </select>
                </div>
              </div>

              <div>
                <label class="block text-sm font-semibold text-zinc-50 mb-2">联系方式 <span class="text-red-400">*</span></label>
                <div class="grid md:grid-cols-2 gap-4">
                  <input type="text" id="demand-contact-name" placeholder="联系人姓名" class="w-full px-4 py-3 border border-white/10 bg-zinc-800 text-zinc-50 placeholder-zinc-500 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500/20 focus:border-cyan-500 transition-all">
                  <input type="text" id="demand-contact-phone" placeholder="联系电话" class="w-full px-4 py-3 border border-white/10 bg-zinc-800 text-zinc-50 placeholder-zinc-500 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500/20 focus:border-cyan-500 transition-all">
                </div>
                <div class="grid md:grid-cols-2 gap-4 mt-4">
                  <input type="text" id="demand-contact-wechat" placeholder="微信号（选填）" class="w-full px-4 py-3 border border-white/10 bg-zinc-800 text-zinc-50 placeholder-zinc-500 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500/20 focus:border-cyan-500 transition-all">
                  <input type="text" id="demand-contact-email" placeholder="邮箱（选填）" class="w-full px-4 py-3 border border-white/10 bg-zinc-800 text-zinc-50 placeholder-zinc-500 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500/20 focus:border-cyan-500 transition-all">
                </div>
              </div>

              <button type="submit" id="submit-btn" class="w-full py-4 btn-primary rounded-xl font-semibold text-lg flex items-center justify-center gap-2">
                <span>发布需求</span>
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                </svg>
              </button>
            </form>
          </div>
        </div>

        <div class="space-y-6">
          <div class="bg-gradient-to-br from-cyan-500/10 to-zinc-900/80 rounded-2xl p-6 border border-cyan-500/30 backdrop-blur-sm">
            <div class="flex items-center gap-2 mb-4">
              <div class="w-8 h-8 bg-cyan-500 rounded-lg flex items-center justify-center">
                <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path>
                </svg>
              </div>
              <h3 class="font-bold text-zinc-50">AI智能分析</h3>
            </div>

            <div id="ai-analysis" class="space-y-4">
              <div class="bg-zinc-800/60 rounded-xl p-4">
                <p class="text-sm text-zinc-400 mb-2">正在分析您的需求...</p>
                <div class="flex items-center gap-2">
                  <span class="w-2 h-2 bg-cyan-400 rounded-full animate-bounce-dot"></span>
                  <span class="w-2 h-2 bg-cyan-400 rounded-full animate-bounce-dot" style="animation-delay: 0.1s"></span>
                  <span class="w-2 h-2 bg-cyan-400 rounded-full animate-bounce-dot" style="animation-delay: 0.2s"></span>
                </div>
              </div>
            </div>
          </div>

          <div class="bg-zinc-900/80 backdrop-blur-sm rounded-2xl border border-white/10 p-6">
            <h3 class="font-semibold text-zinc-50 mb-4">AI提取标签</h3>
            <div id="ai-tags" class="flex flex-wrap gap-2 min-h-[60px]">
              <span class="text-sm text-zinc-500">输入描述后自动提取</span>
            </div>
          </div>

          <div class="bg-zinc-900/80 backdrop-blur-sm rounded-2xl border border-white/10 p-6">
            <h3 class="font-semibold text-zinc-50 mb-4">预计匹配企业</h3>
            <div class="flex items-end gap-4">
              <div class="text-center">
                <div class="text-4xl font-bold text-cyan-400" id="match-count">0</div>
                <div class="text-sm text-zinc-400">家企业</div>
              </div>
              <div class="flex-1">
                <div class="flex justify-between text-sm mb-1">
                  <span class="text-zinc-400">匹配度</span>
                  <span class="font-medium text-emerald-400">高</span>
                </div>
                <div class="h-2 bg-zinc-800 rounded-full overflow-hidden">
                  <div id="match-bar" class="h-full bg-gradient-to-r from-emerald-400 to-emerald-500 rounded-full" style="width: 0%"></div>
                </div>
              </div>
            </div>
          </div>

          <div class="bg-emerald-500/10 rounded-2xl p-4 border border-emerald-500/30">
            <div class="flex items-start gap-3">
              <svg class="w-5 h-5 text-emerald-400 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
              <p class="text-sm text-emerald-400">发布后，AI将自动为您匹配最适合的合作伙伴</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <nav class="mobile-bottom-nav lg:hidden">
    <div class="flex items-center justify-around">
      <a href="index.html" class="flex flex-col items-center gap-1 px-4 py-2 text-zinc-500 hover:text-cyan-400 transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        <span class="text-xs font-medium">首页</span>
      </a>
      <a href="search.html" class="flex flex-col items-center gap-1 px-4 py-2 text-zinc-500 hover:text-cyan-400 transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <span class="text-xs font-medium">搜索</span>
      </a>
      <a href="demand.html" class="flex flex-col items-center gap-1 px-4 py-2 text-cyan-400">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
        </svg>
        <span class="text-xs font-medium">发布</span>
      </a>
      <a href="inbox.html" class="flex flex-col items-center gap-1 px-4 py-2 text-zinc-500 hover:text-cyan-400 transition-colors relative">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
        </svg>
        <span class="text-xs font-medium">消息</span>
        <span class="absolute top-0 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
      </a>
    </div>
  </nav>

  <script src="js/particles.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ai-engine.js"></script>
  <script src="js/demand.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      ParticleSystem.init('particleCanvas');

      const navbar = document.getElementById('navbar');
      window.addEventListener('scroll', () => {
        if (window.scrollY > 20) {
          navbar.classList.add('shadow-lg', 'shadow-cyan-500/5');
        } else {
          navbar.classList.remove('shadow-lg', 'shadow-cyan-500/5');
        }
      });
    });
  </script>
</body>
</html>
