<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发起合作 - LinkForge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="lib/echarts.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
            mono: ['Geist Mono', 'monospace'],
          },
          colors: {
            zinc: {
              50: '#fafafa',
              100: '#f4f4f5',
              200: '#e4e4e7',
              300: '#d4d4d8',
              400: '#a1a1aa',
              500: '#71717a',
              600: '#52525b',
              700: '#3f3f46',
              800: '#27272a',
              900: '#18181b',
              950: '#09090b',
            },
            cyan: {
              400: '#22d3ee',
              500: '#06b6d4',
              600: '#0891b2',
              700: '#0e7490',
            },
            emerald: {
              400: '#34d399',
              500: '#10b981',
            },
          },
          animation: {
            'fade-in': 'fadeIn 0.3s ease-out',
            'slide-up': 'slideUp 0.3s ease-out',
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'bounce-dot': 'bounceDot 1.4s infinite ease-in-out both',
            'glow-pulse': 'glowPulse 2s ease-in-out infinite',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            bounceDot: {
              '0%, 80%, 100%': { transform: 'scale(0)', opacity: '0.5' },
              '40%': { transform: 'scale(1)', opacity: '1' },
            },
            glowPulse: {
              '0%, 100%': { filter: 'drop-shadow(0 0 20px rgba(6, 182, 212, 0.5))' },
              '50%': { filter: 'drop-shadow(0 0 40px rgba(6, 182, 212, 0.8))' },
            },
          },
        },
      },
    }
  </script>
</head>
<body class="bg-zinc-950 text-zinc-50">
  <canvas id="particleCanvas" class="particle-canvas"></canvas>
  <div class="dark-overlay"></div>

  <nav id="navbar" class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 bg-zinc-950 border-b border-white/10">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-2">
          <a href="index.html" class="flex items-center space-x-2">
            <div class="w-10 h-10 bg-gradient-to-br from-cyan-500 to-teal-500 rounded-xl flex items-center justify-center animate-glow-pulse">
              <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                <path d="M2 17l10 5 10-5"/>
                <path d="M2 12l10 5 10-5"/>
              </svg>
            </div>
            <span class="text-xl font-bold text-zinc-50">LinkForge</span>
          </a>
        </div>
        
        <div class="hidden md:flex flex-1 max-w-xl mx-8">
          <div class="relative w-full">
            <input type="text" id="searchInput" placeholder="搜索企业、能力或需求..." 
              class="w-full px-4 py-2.5 pl-10 rounded-xl border border-white/10 bg-zinc-900 text-zinc-50 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/20 focus:border-cyan-500 transition-all">
            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-zinc-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">

            </svg>
            <div class="absolute right-2 top-1/2 -translate-y-1/2 px-2 py-0.5 bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 rounded-md text-xs font-mono font-semibold">AI</div>
          </div>
        </div>
        
        <div class="flex items-center space-x-3">
          <button onclick="window.location.href='inbox.html'" class="p-2 hover:bg-zinc-800 rounded-lg transition-colors relative">
            <svg class="w-6 h-6 text-zinc-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
            </svg>
            <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
          </button>
          <button onclick="window.location.href='onboard.html'" class="hidden sm:inline-flex px-4 py-2 text-zinc-400 font-medium hover:text-zinc-50 transition-colors">
            入驻企业
          </button>
        </div>
      </div>
    </div>
  </nav>

  <main class="relative content-layer pt-24 pb-24 lg:pb-12">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center space-x-4 mb-8">
        <button onclick="window.history.back()" class="flex items-center space-x-1 text-zinc-400 hover:text-cyan-400 transition-colors">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
          <span class="text-sm font-medium">返回</span>
        </button>
        <span class="text-zinc-700">/</span>
        <span class="text-sm text-zinc-500">发起合作</span>
      </div>

      <div class="grid lg:grid-cols-3 gap-8">
        <div class="lg:col-span-2 space-y-8">
          <div class="bg-zinc-900/80 backdrop-blur-sm rounded-2xl border border-white/10 p-6">
            <h2 class="text-xl font-semibold text-zinc-50 mb-6">合作需求表单</h2>
            
            <form id="contactForm" class="space-y-6">
              <div>
                <label class="block text-sm font-medium text-zinc-400 mb-2">合作类型</label>
                <select id="cooperationType" class="w-full px-4 py-3 rounded-xl border border-white/10 bg-zinc-800 text-zinc-50 focus:outline-none focus:ring-2 focus:ring-cyan-500/20 focus:border-cyan-500 transition-all">
                  <option value="">请选择合作类型</option>
                  <option value="产品采购">产品采购</option>
                  <option value="服务外包">服务外包</option>
                  <option value="技术合作">技术合作</option>
                  <option value="OEM代工">OEM代工</option>
                  <option value="其他">其他</option>
                </select>
              </div>

              <div>
                <label class="block text-sm font-medium text-zinc-400 mb-2">产品/服务描述</label>
                <textarea id="description" rows="4" placeholder="请详细描述您的合作需求，包括产品规格、技术要求、数量等信息..." 
                  class="w-full px-4 py-3 rounded-xl border border-white/10 bg-zinc-800 text-zinc-50 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/20 focus:border-cyan-500 transition-all"></textarea>
              </div>

              <div class="grid sm:grid-cols-3 gap-4">
                <div>
                  <label class="block text-sm font-medium text-zinc-400 mb-2">数量</label>
                  <input type="text" id="quantity" placeholder="如：1000件" 
                    class="w-full px-4 py-3 rounded-xl border border-white/10 bg-zinc-800 text-zinc-50 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/20 focus:border-cyan-500 transition-all">
                </div>
                <div>
                  <label class="block text-sm font-medium text-zinc-400 mb-2">预算范围</label>
                  <select id="budgetRange" class="w-full px-4 py-3 rounded-xl border border-white/10 bg-zinc-800 text-zinc-50 focus:outline-none focus:ring-2 focus:ring-cyan-500/20 focus:border-cyan-500 transition-all">
                    <option value="">请选择预算</option>
                    <option value="1万以下">1万以下</option>
                    <option value="1-5万">1-5万</option>
                    <option value="5-10万">5-10万</option>
                    <option value="10万以上">10万以上</option>
                  </select>
                </div>
                <div>
                  <label class="block text-sm font-medium text-zinc-400 mb-2">期望周期</label>
                  <select id="expectedPeriod" class="w-full px-4 py-3 rounded-xl border border-white/10 bg-zinc-800 text-zinc-50 focus:outline-none focus:ring-2 focus:ring-cyan-500/20 focus:border-cyan-500 transition-all">
                    <option value="">请选择周期</option>
                    <option value="7天内">7天内</option>
                    <option value="15天内">15天内</option>
                    <option value="30天内">30天内</option>
                    <option value="45天内">45天内</option>
                    <option value="60天内">60天内</option>
                    <option value="90天内">90天内</option>
                  </select>
                </div>
              </div>

              <div class="border-t border-white/10 pt-6">
                <h3 class="text-sm font-medium text-zinc-400 mb-4">联系方式（至少填写一项）</h3>
                <div class="grid sm:grid-cols-3 gap-4">
                  <div>
                    <label class="block text-sm font-medium text-zinc-400 mb-2">微信</label>
                    <div class="relative">
                      <input type="text" id="wechat" placeholder="your_wechat" 
                        class="w-full px-4 py-3 pl-10 rounded-xl border border-white/10 bg-zinc-800 text-zinc-50 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/20 focus:border-cyan-500 transition-all">
                      <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-zinc-500" fill="currentColor" viewBox="0 0 24 24">

                      </svg>
                    </div>
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-zinc-400 mb-2">邮箱</label>
                    <div class="relative">
                      <input type="email" id="email" placeholder="your@email.com" 
                        class="w-full px-4 py-3 pl-10 rounded-xl border border-white/10 bg-zinc-800 text-zinc-50 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/20 focus:border-cyan-500 transition-all">
                      <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-zinc-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                      </svg>
                    </div>
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-zinc-400 mb-2">电话</label>
                    <div class="relative">
                      <input type="tel" id="phone" placeholder="138xxxx8888" 
                        class="w-full px-4 py-3 pl-10 rounded-xl border border-white/10 bg-zinc-800 text-zinc-50 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/20 focus:border-cyan-500 transition-all">
                      <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-zinc-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                      </svg>
                    </div>
                  </div>
                </div>
                <div class="grid sm:grid-cols-2 gap-4 mt-4">
                  <div>
                    <label class="block text-sm font-medium text-zinc-400 mb-2">Line</label>
                    <div class="relative">
                      <input type="text" id="line" placeholder="your_line_id" 
                        class="w-full px-4 py-3 pl-10 rounded-xl border border-white/10 bg-zinc-800 text-zinc-50 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/20 focus:border-cyan-500 transition-all">
                      <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-zinc-500" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20.87 17.46c-.15-1.58-.8-3.05-1.91-4.16-1.11-1.11-2.59-1.76-4.17-1.92l-.55-.05c-1.54-.14-3.01.32-4.22 1.39l-1.76 1.28-1.02-.34a2.12 2.12 0 00-2.54.67l-.18.3c-.19.31-.2.66-.03.96.16.29.42.49.74.58l1.1.37 1.44-.99c.36-.25.78-.39 1.2-.39.16 0 .32.02.48.05l.28.04c1.33.19 2.57.76 3.54 1.66l.1.09c.98.92 1.59 2.12 1.82 3.47l.05.55c.14 1.54-.32 3.01-1.39 4.22l-.33.33a1.9 1.9 0 01-.68.44l-.36.19c-.31.16-.67.18-.97.04l-.3-.16a2.09 2.09 0 00-.96-.03l-1.1.36-1.44-.99c-.36-.25-.78-.39-1.2-.39-.16 0-.32.02-.48.05l-.28.04c-1.33.19-2.57.76-3.54 1.66l-.1.09c-.98.92-1.59 2.12-1.82 3.47l-.05.55c-.14 1.54.32 3.01 1.39 4.22l1.38 1.38c1.11 1.11 2.59 1.76 4.17 1.92l.55.05c1.54.14 3.01-.32 4.22-1.39l1.76-1.28 1.02.34a2.12 2.12 0 002.54-.67l.18-.3c.19-.31.2-.66.03-.96l-.35-.84-1.09-.37c-.31-.1-.64-.06-.91.1l-.76.51c-.43.29-.7.79-.7 1.34v3.03c0 .6.49 1.09 1.09 1.09s1.09-.49 1.09-1.09v-3.91c0-1.08.46-2.12 1.3-2.87l1.58-1.35c.84-.71 1.39-1.79 1.46-3.01l.01-.18V19c0-.13-.01-.26-.04-.39zM8.5 14.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm7 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
                      </svg>
                    </div>
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-zinc-400 mb-2">WhatsApp</label>
                    <div class="relative">
                      <input type="text" id="whatsapp" placeholder="+86138xxxx8888" 
                        class="w-full px-4 py-3 pl-10 rounded-xl border border-white/10 bg-zinc-800 text-zinc-50 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/20 focus:border-cyan-500 transition-all">
                      <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-zinc-500" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.477 2 2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.879V14.89h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.989C18.343 21.129 22 16.99 22 12c0-5.523-4.477-10-10-10z"/>
                      </svg>
                    </div>
                  </div>
                </div>
              </div>

              <button type="submit" id="submitBtn" class="btn-primary w-full py-4 rounded-xl text-lg font-semibold">
                发送合作意向
              </button>
            </form>
          </div>
        </div>

        <div class="space-y-8">
          <div id="targetCompany" class="bg-zinc-900/80 backdrop-blur-sm rounded-2xl border border-white/10 p-6">
            <div class="flex items-center space-x-2 mb-6">
              <div class="w-8 h-8 bg-cyan-500/20 rounded-lg flex items-center justify-center border border-cyan-500/30">
                <svg class="w-4 h-4 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
              </div>
              <h2 class="text-lg font-semibold text-zinc-50">目标企业</h2>
            </div>
            <div class="text-center py-8">
              <p class="text-zinc-500">加载中...</p>
            </div>
          </div>

          <div class="bg-gradient-to-br from-cyan-500/10 to-zinc-900/80 rounded-2xl p-6 border border-cyan-500/30 backdrop-blur-sm">
            <div class="flex items-center space-x-2 mb-4">
              <div class="w-8 h-8 bg-cyan-500 rounded-lg flex items-center justify-center">
                <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
                </svg>
              </div>
              <h2 class="text-lg font-semibold text-zinc-50">AI智能推荐</h2>
            </div>
            <div id="aiSuggestion" class="space-y-4">
              <div class="flex items-center space-x-2 text-zinc-400">
                <span class="w-2 h-2 bg-cyan-400 rounded-full animate-bounce-dot"></span>
                <span class="text-sm">AI正在分析匹配点...</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      ParticleSystem.init('particleCanvas');

      const navbar = document.getElementById('navbar');
      window.addEventListener('scroll', () => {
        if (window.scrollY > 20) {
          navbar.classList.add('shadow-lg', 'shadow-cyan-500/5');
        } else {
          navbar.classList.remove('shadow-lg', 'shadow-cyan-500/5');
        }
      });

      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            const query = searchInput.value.trim();
            if (query) {
              window.location.href = `search.html?q=${encodeURIComponent(query)}`;
            }
          }
        });
      }
    });
  </script>
