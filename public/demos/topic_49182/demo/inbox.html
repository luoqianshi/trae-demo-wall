<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能收件箱 - LinkForge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="lib/echarts.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
            mono: ['Geist Mono', 'monospace'],
          },
          colors: {
            zinc: {
              50: '#fafafa',
              100: '#f4f4f5',
              200: '#e4e4e7',
              300: '#d4d4d8',
              400: '#a1a1aa',
              500: '#71717a',
              600: '#52525b',
              700: '#3f3f46',
              800: '#27272a',
              900: '#18181b',
              950: '#09090b',
            },
            cyan: {
              400: '#22d3ee',
              500: '#06b6d4',
              600: '#0891b2',
              700: '#0e7490',
            },
            emerald: {
              400: '#34d399',
              500: '#10b981',
            },
          },
          animation: {
            'fade-in': 'fadeIn 0.3s ease-out',
            'slide-up': 'slideUp 0.3s ease-out',
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'bounce-dot': 'bounceDot 1.4s infinite ease-in-out both',
            'glow-pulse': 'glowPulse 2s ease-in-out infinite',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            bounceDot: {
              '0%, 80%, 100%': { transform: 'scale(0)', opacity: '0.5' },
              '40%': { transform: 'scale(1)', opacity: '1' },
            },
            glowPulse: {
              '0%, 100%': { filter: 'drop-shadow(0 0 20px rgba(6, 182, 212, 0.5))' },
              '50%': { filter: 'drop-shadow(0 0 40px rgba(6, 182, 212, 0.8))' },
            },
          },
        },
      },
    }
  </script>
</head>
<body class="bg-zinc-950 text-zinc-50">
  <canvas id="particleCanvas" class="particle-canvas"></canvas>
  <div class="dark-overlay"></div>

  <nav id="navbar" class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 bg-zinc-950 border-b border-white/10">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-2">
          <a href="index.html" class="flex items-center space-x-2">
            <div class="w-10 h-10 bg-gradient-to-br from-cyan-500 to-teal-500 rounded-xl flex items-center justify-center animate-glow-pulse">
              <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                <path d="M2 17l10 5 10-5"/>
                <path d="M2 12l10 5 10-5"/>
              </svg>
            </div>
            <span class="text-xl font-bold text-zinc-50">LinkForge</span>
          </a>
        </div>
        
        <div class="hidden md:flex flex-1 max-w-xl mx-8">
          <div class="relative w-full">
            <input type="text" id="searchInput" placeholder="搜索企业、能力或需求..." 
              class="w-full px-4 py-2.5 pl-10 rounded-xl border border-white/10 bg-zinc-900 text-zinc-50 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/20 focus:border-cyan-500 transition-all">
            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-zinc-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <div class="absolute right-2 top-1/2 -translate-y-1/2 px-2 py-0.5 bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 rounded-md text-xs font-mono font-semibold">AI</div>
          </div>
        </div>
        
        <div class="flex items-center space-x-3">
          <button onclick="window.location.href='inbox.html'" class="p-2 hover:bg-zinc-800 rounded-lg transition-colors relative">
            <svg class="w-6 h-6 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
            </svg>
            <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
          </button>
          <button onclick="window.location.href='onboard.html'" class="hidden sm:inline-flex px-4 py-2 text-zinc-400 font-medium hover:text-zinc-50 transition-colors">
            入驻企业
          </button>
        </div>
      </div>
    </div>
  </nav>

  <main class="relative content-layer pt-24 pb-24 lg:pb-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between mb-8">
        <div>
          <h1 class="text-2xl md:text-3xl font-bold text-zinc-50 mb-2">智能收件箱</h1>
          <p class="text-zinc-400">AI帮您高效管理所有合作机会</p>
        </div>
        <div class="flex items-center gap-4">
          <span class="hidden sm:inline-flex px-3 py-1.5 bg-cyan-500/10 text-cyan-400 rounded-full text-sm font-medium items-center gap-2 border border-cyan-500/30">
            <span class="w-2 h-2 bg-cyan-400 rounded-full animate-pulse"></span>
            智能推荐已开启
          </span>
        </div>
      </div>

      <div class="flex gap-6">
        <div class="hidden lg:block w-72 flex-shrink-0">
          <div class="bg-zinc-900/80 backdrop-blur-sm rounded-2xl border border-white/10 p-4 sticky top-24">
            <div class="flex items-center gap-2 mb-4">
              <svg class="w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
              <span class="font-semibold text-zinc-50">我的机会</span>
            </div>
            
            <nav class="space-y-1">
              <button id="filter-all" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl bg-cyan-500/10 text-cyan-400 font-medium transition-all border border-cyan-500/30">
                <span>全部</span>
                <span id="count-all" class="px-2 py-0.5 bg-cyan-500/20 text-cyan-400 rounded-full text-xs">0</span>
              </button>
              <button id="filter-pending" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl hover:bg-zinc-800 text-zinc-400 font-medium transition-all">
                <span>新机会</span>
                <span id="count-pending" class="px-2 py-0.5 bg-red-500/20 text-red-400 rounded-full text-xs">0</span>
              </button>
              <button id="filter-viewed" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl hover:bg-zinc-800 text-zinc-400 font-medium transition-all">
                <span>已接洽</span>
                <span id="count-viewed" class="px-2 py-0.5 bg-blue-500/20 text-blue-400 rounded-full text-xs">0</span>
              </button>
              <button id="filter-accepted" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl hover:bg-zinc-800 text-zinc-400 font-medium transition-all">
                <span>已合作</span>
                <span id="count-accepted" class="px-2 py-0.5 bg-emerald-500/20 text-emerald-400 rounded-full text-xs">0</span>
              </button>
              <button id="filter-completed" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl hover:bg-zinc-800 text-zinc-400 font-medium transition-all">
                <span>已完成</span>
                <span id="count-completed" class="px-2 py-0.5 bg-zinc-800 text-zinc-400 rounded-full text-xs">0</span>
              </button>
            </nav>

            <div class="mt-6 pt-6 border-t border-white/10">
              <div class="flex items-center gap-2 mb-3">
                <svg class="w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span class="font-semibold text-zinc-50">快捷操作</span>
              </div>
              <button onclick="window.location.href='demand.html'" class="w-full flex items-center gap-2 px-3 py-2 rounded-xl hover:bg-zinc-800 text-zinc-400 hover:text-zinc-50 transition-all">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                </svg>
                <span>发布需求</span>
              </button>
              <button onclick="window.location.href='onboard.html'" class="w-full flex items-center gap-2 px-3 py-2 rounded-xl hover:bg-zinc-800 text-zinc-400 hover:text-zinc-50 transition-all">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
                </svg>
                <span>企业入驻</span>
              </button>
            </div>
          </div>
        </div>

        <div class="flex-1">
          <div id="inbox-list" class="space-y-4">
            <div class="bg-zinc-900/80 backdrop-blur-sm rounded-2xl border border-white/10 p-8 text-center">
              <div class="w-16 h-16 mx-auto mb-4 bg-zinc-800 rounded-full flex items-center justify-center border border-white/10">
                <svg class="w-8 h-8 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path>
                </svg>
              </div>
              <h3 class="text-lg font-semibold text-zinc-50 mb-2">暂无合作机会</h3>
              <p class="text-zinc-400 mb-4">发起合作或发布需求后，机会将出现在这里</p>
              <button onclick="window.location.href='index.html'" class="btn-primary px-6 py-2 rounded-xl font-medium">
                去搜索企业
              </button>
            </div>
          </div>

          <div id="inbox-detail" class="hidden mt-6">
            <div class="bg-zinc-900/80 backdrop-blur-sm rounded-2xl border border-white/10 p-6">
              <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-bold text-zinc-50">需求详情</h2>
                <button id="close-detail" class="lg:hidden p-2 hover:bg-zinc-800 rounded-lg transition-all">
                  <svg class="w-6 h-6 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                  </svg>
                </button>
              </div>

              <div id="detail-content">
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="mobile-filter" class="hidden lg:hidden fixed bottom-0 left-0 right-0 bg-zinc-900 border-t border-white/10 p-4 z-40">
    <div class="flex gap-2">
      <button id="mobile-filter-all" class="flex-1 px-4 py-2 bg-cyan-500 text-white rounded-xl font-medium text-sm">全部</button>
      <button id="mobile-filter-pending" class="flex-1 px-4 py-2 bg-zinc-800 text-zinc-400 rounded-xl font-medium text-sm">新机会</button>
      <button id="mobile-filter-accepted" class="flex-1 px-4 py-2 bg-zinc-800 text-zinc-400 rounded-xl font-medium text-sm">已合作</button>
    </div>
  </div>

  <nav class="mobile-bottom-nav lg:hidden">
    <div class="flex items-center justify-around">
      <a href="index.html" class="flex flex-col items-center gap-1 px-4 py-2 text-zinc-500 hover:text-cyan-400 transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        <span class="text-xs font-medium">首页</span>
      </a>
      <a href="search.html" class="flex flex-col items-center gap-1 px-4 py-2 text-zinc-500 hover:text-cyan-400 transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <span class="text-xs font-medium">搜索</span>
      </a>
      <a href="demand.html" class="flex flex-col items-center gap-1 px-4 py-2 text-zinc-500 hover:text-cyan-400 transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
        </svg>
        <span class="text-xs font-medium">发布</span>
      </a>
      <a href="inbox.html" class="flex flex-col items-center gap-1 px-4 py-2 text-cyan-400 relative">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
        </svg>
        <span class="text-xs font-medium">消息</span>
        <span class="absolute top-0 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
      </a>
    </div>
  </nav>

  <script src="js/particles.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/data.js"></script>
  <script src="js/inbox.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      ParticleSystem.init('particleCanvas');

      const navbar = document.getElementById('navbar');
      window.addEventListener('scroll', () => {
        if (window.scrollY > 20) {
          navbar.classList.add('shadow-lg', 'shadow-cyan-500/5');
        } else {
          navbar.classList.remove('shadow-lg', 'shadow-cyan-500/5');
        }
      });
    });
  </script>
</body>
</html>
