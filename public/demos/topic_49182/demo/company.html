<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企业详情 - LinkForge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="lib/echarts.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
            mono: ['Geist Mono', 'monospace'],
          },
          colors: {
            primary: '#fafafa',
            accent: '#06b6d4',
            ai: {
              50: 'rgba(6, 182, 212, 0.1)',
              100: 'rgba(6, 182, 212, 0.2)',
              500: '#06b6d4',
              600: '#0891b2',
            },
          },
          animation: {
            'fade-in': 'fadeIn 0.3s ease-out',
            'slide-up': 'slideUp 0.3s ease-out',
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'bounce-dot': 'bounceDot 1.4s infinite ease-in-out both',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            bounceDot: {
              '0%, 80%, 100%': { transform: 'scale(0)', opacity: '0.5' },
              '40%': { transform: 'scale(1)', opacity: '1' },
            },
          },
        },
      },
    }
  </script>
</head>
<body class="bg-zinc-950 text-zinc-50">
  <canvas id="particleCanvas" class="fixed inset-0 pointer-events-none z-0"></canvas>
  <div class="fixed inset-0 bg-gradient-to-b from-cyan-500/5 via-transparent to-transparent pointer-events-none z-0"></div>

  <nav id="navbar" class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 bg-zinc-950 border-b border-white/10">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-2">
          <a href="index.html" class="flex items-center space-x-2">
            <div class="w-10 h-10 bg-gradient-to-br from-cyan-500 to-blue-600 rounded-xl flex items-center justify-center">
              <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                <path d="M2 17l10 5 10-5"/>
                <path d="M2 12l10 5 10-5"/>
              </svg>
            </div>
            <span class="text-xl font-bold text-zinc-50">LinkForge</span>
          </a>
        </div>
        
        <div class="flex-1 max-w-xl mx-8 hidden md:block">
          <div class="relative w-full">
            <input type="text" id="searchInput" placeholder="搜索企业、能力或需求..." 
              class="w-full px-4 py-2.5 pl-10 rounded-xl border border-white/10 bg-zinc-900/80 text-zinc-50 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/20 focus:border-cyan-500/50 transition-all">
            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-zinc-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <div class="absolute right-2 top-1/2 -translate-y-1/2 px-2 py-0.5 bg-cyan-500/20 text-cyan-400 rounded-md text-xs font-mono font-semibold border border-cyan-500/30">AI</div>
          </div>
        </div>
        
        <div class="flex items-center space-x-3">
          <button onclick="window.location.href='inbox.html'" class="p-2 hover:bg-zinc-800/50 rounded-lg transition-colors relative">
            <svg class="w-6 h-6 text-zinc-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
            </svg>
            <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
          </button>
          <button onclick="window.location.href='onboard.html'" class="hidden sm:inline-flex px-4 py-2 text-zinc-400 font-medium hover:text-cyan-400 transition-colors">
            入驻企业
          </button>
        </div>
      </div>
    </div>
  </nav>

  <main class="pt-24 pb-24 lg:pb-12 relative z-10">
    <div id="companyDetail" class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center space-x-4 mb-8">
        <button onclick="window.history.back()" class="flex items-center space-x-1 text-zinc-400 hover:text-cyan-400 transition-colors">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
          <span class="text-sm font-medium">返回</span>
        </button>
        <span class="text-zinc-700">/</span>
        <span class="text-sm text-zinc-500" id="breadcrumb">企业详情</span>
      </div>

      <div class="bg-zinc-900/80 backdrop-blur-sm rounded-3xl p-8 mb-8 border border-white/10 card-hover">
        <div class="flex flex-col lg:flex-row gap-8">
          <div class="flex-shrink-0 text-center lg:text-left">
            <div class="relative inline-block">
              <div class="w-32 h-32 bg-gradient-to-br from-cyan-500 to-blue-600 rounded-2xl flex items-center justify-center">
                <svg class="w-16 h-16 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                </svg>
              </div>
              <div id="levelBadge" class="absolute -bottom-2 -right-2 px-3 py-1 rounded-full text-sm font-bold shadow-lg">
                A
              </div>
            </div>
          </div>

          <div class="flex-1">
            <div class="flex flex-wrap items-start justify-between gap-4 mb-4">
              <div>
                <h1 id="companyName" class="text-3xl font-bold text-zinc-50 mb-2">企业名称</h1>
                <div class="flex flex-wrap items-center gap-3 text-sm text-zinc-400">
                  <span id="companyIndustry" class="px-3 py-1 bg-cyan-500/10 text-cyan-400 rounded-full border border-cyan-500/20">行业</span>
                  <span id="companyCity">城市</span>
                  <span class="text-zinc-700">·</span>
                  <span id="companySize">规模</span>
                  <span class="text-zinc-700">·</span>
                  <span id="companyCooperation">合作次数</span>
                </div>
              </div>
              <button id="contactBtn" class="btn-primary px-6 py-3 rounded-xl font-semibold whitespace-nowrap">
                发起合作
              </button>
            </div>

            <p id="companyDescription" class="text-zinc-400 leading-relaxed mb-6">企业简介</p>

            <div class="flex items-center gap-8">
              <div class="relative">
                <div id="trustScoreChart" class="w-24 h-24"></div>
                <div class="absolute inset-0 flex flex-col items-center justify-center">
                  <span id="trustScore" class="text-2xl font-bold font-mono text-zinc-50">0</span>
                  <span class="text-xs text-zinc-500">信用分</span>
                </div>
              </div>
              <div>
                <div class="flex items-center space-x-1 mb-1">
                  <svg class="w-5 h-5 text-amber-500 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                  <svg class="w-5 h-5 text-amber-500 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                  <svg class="w-5 h-5 text-amber-500 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                  <svg class="w-5 h-5 text-amber-500 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                  <svg class="w-5 h-5 text-amber-500 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                </div>
                <p id="reviewCount" class="text-sm text-zinc-500">0条评价</p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="grid lg:grid-cols-3 gap-8">
        <div class="lg:col-span-2 space-y-8">
          <section class="bg-zinc-900/80 backdrop-blur-sm rounded-2xl border border-white/10 p-6 card-hover">
            <div class="flex items-center space-x-2 mb-6">
              <div class="w-8 h-8 bg-cyan-500/20 rounded-lg flex items-center justify-center border border-cyan-500/30">
                <svg class="w-4 h-4 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
                </svg>
              </div>
              <h2 class="text-lg font-semibold text-zinc-50">AI能力画像</h2>
            </div>
            <div class="flex flex-col lg:flex-row gap-8">
              <div class="w-full lg:w-64">
                <div id="radarChart" class="w-full h-64"></div>
              </div>
              <div class="flex-1">
                <div class="mb-4">
                  <h3 class="text-sm font-medium text-zinc-400 mb-2">AI生成简介</h3>
                  <p id="aiProfile" class="text-zinc-500 text-sm leading-relaxed">AI正在分析企业信息...</p>
                </div>
                <div>
                  <h3 class="text-sm font-medium text-zinc-400 mb-3">能力标签</h3>
                  <div id="capabilitiesTags" class="flex flex-wrap gap-2">
                  </div>
                </div>
              </div>
            </div>
          </section>

          <section class="bg-zinc-900/80 backdrop-blur-sm rounded-2xl border border-white/10 p-6 card-hover">
            <div class="flex items-center space-x-2 mb-6">
              <div class="w-8 h-8 bg-blue-500/20 rounded-lg flex items-center justify-center border border-blue-500/30">
                <svg class="w-4 h-4 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                </svg>
              </div>
              <h2 class="text-lg font-semibold text-zinc-50">信用评分详情</h2>
            </div>
            <div id="trustScoreDetails" class="space-y-4">
            </div>
          </section>

          <section class="bg-zinc-900/80 backdrop-blur-sm rounded-2xl border border-white/10 p-6 card-hover">
            <div class="flex items-center space-x-2 mb-6">
              <div class="w-8 h-8 bg-emerald-500/20 rounded-lg flex items-center justify-center border border-emerald-500/30">
                <svg class="w-4 h-4 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                </svg>
              </div>
              <h2 class="text-lg font-semibold text-zinc-50">合作评价</h2>
            </div>
            <div class="flex space-x-4 mb-6">
              <button id="reviewTabAll" class="px-4 py-2 bg-cyan-500/20 text-cyan-400 rounded-lg text-sm font-medium border border-cyan-500/30">全部</button>
              <button id="reviewTabHigh" class="px-4 py-2 text-zinc-400 hover:bg-zinc-800/50 hover:text-zinc-300 rounded-lg text-sm font-medium transition-colors border border-transparent">好评</button>
              <button id="reviewTabLow" class="px-4 py-2 text-zinc-400 hover:bg-zinc-800/50 hover:text-zinc-300 rounded-lg text-sm font-medium transition-colors border border-transparent">差评</button>
            </div>
            <div id="reviewsList" class="space-y-4">
            </div>
          </section>
        </div>

        <div class="space-y-8">
          <section class="bg-zinc-900/80 backdrop-blur-sm rounded-2xl border border-white/10 p-6 card-hover">
            <div class="flex items-center space-x-2 mb-6">
              <div class="w-8 h-8 bg-amber-500/20 rounded-lg flex items-center justify-center border border-amber-500/30">
                <svg class="w-4 h-4 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
              </div>
              <h2 class="text-lg font-semibold text-zinc-50">资质认证</h2>
            </div>
            <div id="certificationsGrid" class="grid grid-cols-2 gap-3">
            </div>
          </section>

          <section class="bg-zinc-900/80 backdrop-blur-sm rounded-2xl border border-white/10 p-6 card-hover">
            <div class="flex items-center space-x-2 mb-6">
              <div class="w-8 h-8 bg-purple-500/20 rounded-lg flex items-center justify-center border border-purple-500/30">
                <svg class="w-4 h-4 text-purple-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
              </div>
              <h2 class="text-lg font-semibold text-zinc-50">相似企业</h2>
            </div>
            <div id="similarCompanies" class="space-y-4">
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <nav class="mobile-bottom-nav lg:hidden fixed bottom-0 left-0 right-0 z-50 bg-zinc-950/95 backdrop-blur-md border-t border-white/10">
    <div class="flex items-center justify-around">
      <a href="index.html" class="flex flex-col items-center gap-1 px-4 py-2 text-zinc-500 hover:text-cyan-400 transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        <span class="text-xs font-medium">首页</span>
      </a>
      <a href="search.html" class="flex flex-col items-center gap-1 px-4 py-2 text-zinc-500 hover:text-cyan-400 transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <span class="text-xs font-medium">搜索</span>
      </a>
      <a href="demand.html" class="flex flex-col items-center gap-1 px-4 py-2 text-zinc-500 hover:text-cyan-400 transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>

        <span class="text-xs font-medium">发布</span>

      <a href="inbox.html" class="flex flex-col items-center gap-1 px-4 py-2 text-zinc-500 hover:text-cyan-400 transition-colors relative">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
        </svg>
        <span class="text-xs font-medium">消息</span>
        <span class="absolute top-0 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
      </a>
    </div>
  </nav>

  <script src="js/particles.js"></script>
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/ai-engine.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/company.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      ParticleSystem.init('particleCanvas');
      
      const navbar = document.getElementById('navbar');
      window.addEventListener('scroll', () => {
        if (window.scrollY > 20) {
          navbar.classList.add('shadow-lg', 'shadow-cyan-500/5');
        } else {
          navbar.classList.remove('shadow-lg', 'shadow-cyan-500/5');
        }
      });

      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            const query = searchInput.value.trim();
            if (query) {
              window.location.href = `search.html?q=${encodeURIComponent(query)}`;
            }
          }
        });
      }
    });
  </script>
</body>
</html>
