            { name: "选项C", category: "自定义", emoji: "©️", tags: ["cheap","good_value"], distance: 0.5, price: 30, rating: 4.0, reviews: 200, desc: "经济实惠" },

    const PERSONALITY_TAGS = ["rational"]; // 默认理性
    const HISTORY_TAGS = {"火锅": 3.0, "快餐": 2.0, "奶茶": 2.0};
    let RECENT_SELECTIONS = [];
    let HISTORY = JSON.parse(localStorage.getItem('decisionHistory') || '[]');

    // 评分函数
    function calcDistScore(d) {
        if (d <= 0.5) return 100;
        if (d >= 5) return 20;
        return 100 - (d - 0.5) / 4.5 * 80;
    }
    function calcPriceScore(p, min, max) {
        const mid = (min + max) / 2;
        if (p < min) return 70 + Math.min((min-p)/min, 1) * 20;
        if (p <= mid) return 100;
        if (p <= max) return 80 - (p - mid)/(max - mid) * 20;
        return Math.max(0, 50 - (p - max)/max * 50);
    }
    function calcRatingScore(r, c) {
        let base = r / 5 * 80;
        let bonus = c >= 1000 ? 20 : c >= 100 ? 15 : c >= 10 ? 10 : c/10*10;
        return Math.min(100, base + bonus);
    }
    function calcHabitScore(tags, hist) {
        if (!hist || Object.keys(hist).length === 0) return 60;
        let match = 0, total = 0;
        for (const [t, w] of Object.entries(hist)) {
            total += w;
            if (tags.includes(t)) match += w;
        }
        return total === 0 ? 60 : 50 + (match/total) * 50;
    }
    function calcPersonalityScore(tags) {
        // 简化版：根据标签匹配度
        const goodTags = { rational: ["high_rating","chain","famous"], explorer: ["new","special","niche"] };
        let maxMatch = 0;
        for (const pt of PERSONALITY_TAGS) {
            const matches = goodTags[pt] || [];
            for (const t of tags) if (matches.includes(t)) maxMatch = Math.max(maxMatch, 1.5);
        }
        return maxMatch > 1 ? Math.min(100, 60 + (maxMatch-1)*80) : 60;
    }
    function calcDiversityScore(cat) {
        const same = RECENT_SELECTIONS.filter(s => s === cat).length;
        if (same === 0) return 100;
        if (same === 1) return 70;
        if (same === 2) return 40;
        return 20;
    }

    function rank(candidates, mode, budgetMin, budgetMax) {
        const w = MODE_WEIGHTS[mode];
        const scored = candidates.map(c => {
            const sd = calcDistScore(c.distance);
            const sp = calcPriceScore(c.price, budgetMin, budgetMax);
            const sr = calcRatingScore(c.rating, c.reviews);
            const sh = calcHabitScore(c.tags, HISTORY_TAGS);
            const spe = calcPersonalityScore(c.tags);
            const sdiv = calcDiversityScore(c.category);
            let total = w.distance*sd + w.price*sp + w.rating*sr + w.habit*sh + w.personality*spe + w.diversity*sdiv;
            if (mode === 'random') {
                total = total * (1 - w.random) + (total*0.5+50) * w.random;
                total += (Math.random() - 0.5) * 30;
            }
            total = Math.max(0, Math.min(100, total));
            return { ...c, total: Math.round(total*10)/10, sd:Math.round(sd*10)/10, sp:Math.round(sp*10)/10, sr:Math.round(sr*10)/10, sh:Math.round(sh*10)/10, spe:Math.round(spe*10)/10, sdiv:Math.round(sdiv*10)/10 };
        });
        scored.sort((a,b) => b.total - a.total);
        return scored.slice(0, 3);
    }

    function getReason(c, isTop) {
        const reasons = [];
        if (c.sd >= 90) reasons.push("距离很近");
        if (c.sp >= 90) reasons.push("性价比很高");
        if (c.sr >= 85) reasons.push(`口碑不错(${c.rating}分)`);
        if (c.sh >= 80) reasons.push("符合你的口味");
        if (c.spe >= 80) reasons.push("很适合你");
        if (c.sdiv >= 90) reasons.push("换个口味试试");
        if (!reasons.length) reasons.push("综合表现不错");
        return (isTop ? "强烈推荐！" : "备选：") + reasons.slice(0,3).join("、") + "——" + c.name;
    }

    // ===== 页面逻辑 =====
    let currentScene = "food";
    let currentQuestion = "今天吃什么";
    let currentMode = "rational";

        if (mn > mx - 20) { bMin.value = mx - 20; mn = mx - 20; }
        bVal.textContent = `¥${mn} - ¥${mx}`;
    }
    bMin.addEventListener('input', updateBudget);
    bMax.addEventListener('input', updateBudget);

    document.querySelectorAll('.tab-item').forEach(el => {

        document.getElementById(id).classList.add('active');

    function goHome() {
        showPage('pageHome');
        document.getElementById('navTitle').textContent = '一键决策';

    function showToast(msg) {

        t.classList.add('show');

    // 执行决策
    function decide() {
        const budgetMin = parseInt(bMin.value);
        const budgetMax = parseInt(bMax.value);
        const candidates = CANDIDATES[currentScene] || CANDIDATES.food;

        // 显示加载
        const overlay = document.getElementById('loadingOverlay');
        overlay.classList.add('show');
        const tips = ["分析距离、性价比、好评率...", "匹配你的偏好习惯...", "计算各维度得分...", "生成推荐理由...", "马上就好..."];
        let tipIdx = 0;
        document.getElementById('loadingTip').textContent = tips[0];
        const tipInterval = setInterval(() => {
            tipIdx = (tipIdx + 1) % tips.length;
            document.getElementById('loadingTip').textContent = tips[tipIdx];
        }, 600);

        setTimeout(() => {
            clearInterval(tipInterval);
            overlay.classList.remove('show');

            const results = rank(candidates, currentMode, budgetMin, budgetMax);

            // 记录历史
            RECENT_SELECTIONS.unshift(results[0].category);
            if (RECENT_SELECTIONS.length > 5) RECENT_SELECTIONS.pop();
            HISTORY.unshift({
                question: currentQuestion,
                result: results[0].name,
                emoji: results[0].emoji,
                time: new Date().toLocaleString('zh-CN', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})
            });
            if (HISTORY.length > 20) HISTORY.pop();
            localStorage.setItem('decisionHistory', JSON.stringify(HISTORY));

            // 渲染结果
            const emojis = { rational: "🧠", comfort: "😊", random: "🎲" };
            const titles = { rational: "理性分析完成！", comfort: "舒适推荐！", random: "惊喜结果！" };
            document.getElementById('resultEmoji').textContent = emojis[currentMode] || "🎉";
            document.getElementById('resultTitle').textContent = titles[currentMode] || "为你推荐！";
            document.getElementById('resultSubtitle').textContent = currentQuestion + " · " + {rational:"理性模式",comfort:"舒适模式",random:"随机模式"}[currentMode];
            document.getElementById('matchScore').textContent = results[0].total;

            const badges = ["🏆 最佳推荐", "🥈 备选方案", "🥉 也不错哦"];
            const badgeCls = ["badge-1", "badge-2", "badge-3"];
            const ranks = ["NO.1", "NO.2", "NO.3"];
            const rankColors = ["#D97706", "#6B7280", "#C2410C"];

            let html = '';
            results.forEach((c, i) => {
                html += `
                <div class="recommend-card ${i===0?'top1':''}">
                    <div class="recommend-badge ${badgeCls[i]}">${badges[i]}</div>
                    <div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:10px;">
                        <span style="font-size:36px;">${c.emoji}</span>
                        <div style="flex:1;">
                            <div style="font-size:12px;font-weight:700;color:${rankColors[i]};margin-bottom:2px;">${ranks[i]}</div>
                            <div class="recommend-name">${c.name}</div>
                            <div class="recommend-tags">
                                <span class="tag">${c.category}</span>
                                <span class="tag match">${c.desc}</span>
                            </div>
                        </div>
                        <div style="text-align:right;">
                            <div style="font-size:24px;font-weight:800;color:var(--primary);">${c.total}</div>
                            <div style="font-size:10px;color:var(--text-secondary);">分</div>
                        </div>
                    </div>
                    <div class="recommend-meta">
                        <span class="meta-item">📍 ${c.distance}km</span>
                        <span class="meta-item">💰 ¥${c.price}</span>
                        <span class="meta-item">⭐ ${c.rating}分</span>
                        <span class="meta-item">💬 ${c.reviews}评价</span>
                    </div>
                    <div class="recommend-reason">${getReason(c, i===0)}</div>
                    <div class="score-bars">
                        <div class="score-bar-item">
                            <div class="score-bar-label">距离</div>
                            <div class="score-bar-track"><div class="score-bar-fill" style="width:${c.sd}%"></div></div>
                            <div class="score-bar-value">${c.sd}</div>
                        </div>
                        <div class="score-bar-item">
                            <div class="score-bar-label">性价比</div>
                            <div class="score-bar-track"><div class="score-bar-fill" style="width:${c.sp}%"></div></div>
                            <div class="score-bar-value">${c.sp}</div>
                        </div>
                        <div class="score-bar-item">
                            <div class="score-bar-label">好评率</div>
                            <div class="score-bar-track"><div class="score-bar-fill" style="width:${c.sr}%"></div></div>
                            <div class="score-bar-value">${c.sr}</div>
                        </div>
                    </div>
                </div>`;
            });
            document.getElementById('resultList').innerHTML = html;

            showPage('pageResult');
            document.getElementById('navTitle').textContent = '决策结果';
            document.getElementById('bottomActions').style.display = 'flex';
            document.getElementById('tabBar').style.display = 'none';
        }, 1800);
    }

    document.getElementById('btnDecide').addEventListener('click', decide);

    // 渲染历史
    function renderHistory() {
        if (HISTORY.length === 0) {
            document.getElementById('historyList').innerHTML = `

                    <div class="empty-text">还没有决策记录<br>快去试试吧！</div>

                <div class="history-info">

                    <div class="history-result">选择了：${h.result}</div>
                </div>
                <div class="history-time">${h.time}</div>
            </div>
        `).join('');
    }
    renderHistory();

    // 覆盖原始decide以刷新历史
    const _origDecide = decide;
    decide = function() {
        _origDecide();
        setTimeout(renderHistory, 2000);
    };
