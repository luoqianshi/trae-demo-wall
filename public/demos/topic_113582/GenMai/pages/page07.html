<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>根脉 - AI族谱</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="phone-container">
    <img class="page-bg" src="../images/07.jpg" alt="页面背景">
    <div class="hotspot" id="card-notice"
         style="left:4%;top:17%;width:92%;height:14%;"
         onclick="showDemoToast('家族公告栏（Demo演示）')"></div>
    <div class="hotspot" id="card-contacts"
         style="left:4%;top:33%;width:44%;height:18%;"
         onclick="showDemoToast('家族联系方式（Demo演示）')"></div>
    <div class="hotspot" id="card-invite"
         style="left:52%;top:33%;width:44%;height:18%;"
         onclick="showDemoToast('邀请家人加入（Demo演示）')"></div>
    <div class="hotspot" id="qr-area"
         style="left:56%;top:38%;width:36%;height:8%;"
         onclick="showQRModal()"></div>
    <div class="hotspot" id="btn-share-link"
         style="left:56%;top:48%;width:36%;height:3.5%;"
         onclick="showToast('邀请链接已复制！（Demo演示）')"></div>
    <div class="hotspot" id="share-options"
         style="left:52%;top:52%;width:44%;height:4%;"
         onclick="showToast('分享方式（Demo演示）')"></div>
    <div class="hotspot" id="card-message"
         style="left:4%;top:60%;width:92%;height:22%;"
         onclick="showDemoToast('家族留言板（Demo演示）')"></div>
    <div class="hotspot" id="btn-all-members"
         style="left:4%;top:51%;width:44%;height:3.5%;"
         onclick="showToast('查看全部成员（Demo演示）')"></div>
    <div class="hotspot" id="btn-all-messages"
         style="left:4%;top:82%;width:44%;height:3.5%;"
         onclick="showToast('查看全部留言（Demo演示）')"></div>
    <div class="hotspot" id="btn-write-msg"
         style="left:78%;top:60%;width:18%;height:3.5%;"
         onclick="showInputModal('写留言', '请输入留言内容', function(v){if(v)showToast('留言发布成功！（Demo演示）')})"></div>
    <div class="hotspot" id="btn-prev"
         style="left:4%;top:91%;width:22%;height:5.5%;"
         onclick="goTo('page06.html')"></div>
    <div class="hotspot" id="btn-save"
         style="left:28%;top:91%;width:44%;height:5.5%;"
         onclick="showToast('体验已完成，家族已保存！（Demo演示）');setTimeout(function(){goTo('page08.html')},800)"></div>
    <div class="hotspot" id="btn-home"
         style="left:74%;top:91%;width:22%;height:5.5%;"
         onclick="goTo('page01.html')"></div>

  <!-- 通用输入弹窗 -->
  <div class="modal-overlay" id="inputModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <div class="modal-title" id="modalTitle">编辑</div>
      <input class="modal-input" id="modalInput" type="text" placeholder="请输入">
      <div class="modal-actions">
        <button class="modal-btn cancel" onclick="closeModal()">取消</button>
        <button class="modal-btn confirm" onclick="confirmModal()">确认</button>
      </div>
    </div>
  </div>
  <!-- 商品详情弹窗 -->
  <div class="modal-overlay" id="productModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeProductModal()">&times;</button>
      <div class="product-modal-img">商品图片</div>
      <div class="product-name" id="productName">商品名称</div>
      <div class="product-price" id="productPrice">800 根脉币</div>
      <div class="modal-actions">
        <button class="modal-btn cancel" onclick="closeProductModal()">关闭</button>
        <button class="modal-btn confirm" onclick="exchangeProduct()">立即兑换</button>
      </div>
    </div>
  </div>
  <!-- QR Code弹窗 -->
  <div class="modal-overlay" id="qrModal">
    <div class="qr-modal-content">
      <button class="modal-close" onclick="closeQRModal()">&times;</button>
      <div class="modal-title">邀请家人加入</div>
      <div class="qr-placeholder">二维码占位</div>
      <div class="modal-actions">
        <button class="modal-btn cancel" onclick="closeQRModal()">关闭</button>
        <button class="modal-btn confirm" onclick="showToast('链接已复制！（Demo演示）');closeQRModal()">复制链接</button>
      </div>
    </div>
  </div>
  <!-- 录音动画覆盖层 -->
  <div class="recording-overlay" id="recordingOverlay">
    <div class="recording-circle">
      <span class="recording-icon">&#127908;</span>
    </div>
    <div class="recording-waves">
      <div class="recording-wave"></div>
      <div class="recording-wave"></div>
      <div class="recording-wave"></div>
      <div class="recording-wave"></div>
      <div class="recording-wave"></div>
      <div class="recording-wave"></div>
      <div class="recording-wave"></div>
    </div>
    <div class="recording-text">录音中...</div>
  </div>
  </div>
  <script src="../js/common.js"></script>
</body>
</html>
