<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>根脉 - AI族谱</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="phone-container">
    <img class="page-bg" src="../images/06.jpg" alt="页面背景">
    <div class="hotspot" id="card-tree"
         style="left:4%;top:18%;width:92%;height:16%;"
         onclick="showDemoToast('我的家族树（Demo演示）')"></div>
    <div class="hotspot" id="card-memory"
         style="left:4%;top:48%;width:44%;height:16%;"
         onclick="showDemoToast('时空记忆（Demo演示）')"></div>
    <div class="hotspot" id="card-mark"
         style="left:52%;top:48%;width:44%;height:16%;"
         onclick="showDemoToast('根脉印记（Demo演示）')"></div>
    <div class="hotspot" id="card-growth"
         style="left:4%;top:66%;width:92%;height:12%;"
         onclick="showDemoToast('贡献与成长（Demo演示）')"></div>
    <div class="hotspot" id="btn-report"
         style="left:20%;top:84%;width:60%;height:4%;"
         onclick="showToast('家族报告生成中...（Demo演示）')"></div>
    <div class="hotspot" id="btn-prev"
         style="left:4%;top:91%;width:22%;height:5.5%;"
         onclick="goTo('page05.html')"></div>
    <div class="hotspot" id="btn-save"
         style="left:28%;top:91%;width:44%;height:5.5%;"
         onclick="showToast('成果已保存！（Demo演示）');setTimeout(function(){goTo('page07.html')},800)"></div>
    <div class="hotspot" id="btn-home"
         style="left:74%;top:91%;width:22%;height:5.5%;"
         onclick="goTo('page01.html')"></div>

  <!-- 通用输入弹窗 -->
  <div class="modal-overlay" id="inputModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <div class="modal-title" id="modalTitle">编辑</div>
      <input class="modal-input" id="modalInput" type="text" placeholder="请输入">
      <div class="modal-actions">
        <button class="modal-btn cancel" onclick="closeModal()">取消</button>
        <button class="modal-btn confirm" onclick="confirmModal()">确认</button>
      </div>
    </div>
  </div>
  <!-- 商品详情弹窗 -->
  <div class="modal-overlay" id="productModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeProductModal()">&times;</button>
      <div class="product-modal-img">商品图片</div>
      <div class="product-name" id="productName">商品名称</div>
      <div class="product-price" id="productPrice">800 根脉币</div>
      <div class="modal-actions">
        <button class="modal-btn cancel" onclick="closeProductModal()">关闭</button>
        <button class="modal-btn confirm" onclick="exchangeProduct()">立即兑换</button>
      </div>
    </div>
  </div>
  <!-- QR Code弹窗 -->
  <div class="modal-overlay" id="qrModal">
    <div class="qr-modal-content">
      <button class="modal-close" onclick="closeQRModal()">&times;</button>
      <div class="modal-title">邀请家人加入</div>
      <div class="qr-placeholder">二维码占位</div>
      <div class="modal-actions">
        <button class="modal-btn cancel" onclick="closeQRModal()">关闭</button>
        <button class="modal-btn confirm" onclick="showToast('链接已复制！（Demo演示）');closeQRModal()">复制链接</button>
      </div>
    </div>
  </div>
  <!-- 录音动画覆盖层 -->
  <div class="recording-overlay" id="recordingOverlay">
    <div class="recording-circle">
      <span class="recording-icon">&#127908;</span>
    </div>
    <div class="recording-waves">
      <div class="recording-wave"></div>
      <div class="recording-wave"></div>
      <div class="recording-wave"></div>
      <div class="recording-wave"></div>
      <div class="recording-wave"></div>
      <div class="recording-wave"></div>
      <div class="recording-wave"></div>
    </div>
    <div class="recording-text">录音中...</div>
  </div>
  </div>
  <script src="../js/common.js"></script>
</body>
</html>
