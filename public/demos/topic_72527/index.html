<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4f46e5">
<title>高考志愿AI推荐 · 天津</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --primary: #4f46e5; --primary-light: #6366f1; --primary-dark: #4338ca;
  --bg: #f0f2f5; --card: #ffffff; --text: #1f2937; --text-light: #6b7280;
  --border: #e5e7eb; --safe: #22c55e; --moderate: #f59e0b; --reach: #f97316; --impossible: #ef4444;
}
html, body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.6; }
body { min-height: 100vh; padding-bottom: 40px; }

/* Header */
.header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); color: #fff; padding: 28px 20px 24px; text-align: center; }
.header h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
.header p { font-size: 13px; opacity: 0.92; }
.header .badge { display: inline-block; background: rgba(255,255,255,0.2); padding: 2px 10px; border-radius: 10px; font-size: 11px; margin-top: 8px; }

/* Container */
.container { max-width: 720px; margin: 0 auto; padding: 0 14px; }

/* Input Card */
.input-card { background: var(--card); border-radius: 14px; padding: 18px 16px; margin-top: -14px; box-shadow: 0 4px 14px rgba(0,0,0,0.08); position: relative; z-index: 2; }
.input-row { display: flex; gap: 10px; margin-bottom: 12px; }
.input-group { flex: 1; }
.input-group label { display: block; font-size: 12px; color: var(--text-light); margin-bottom: 4px; font-weight: 600; }
.input-group input, .input-group select { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 9px; font-size: 15px; background: #fff; color: var(--text); transition: border-color .2s; }
.input-group input:focus, .input-group select:focus { outline: none; border-color: var(--primary); }

.btn-query { width: 100%; padding: 13px; background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform .1s; }
.btn-query:active { transform: scale(0.98); }
.btn-query:disabled { opacity: 0.6; }

/* Tabs */
.tabs { display: flex; gap: 6px; margin: 16px 0 12px; background: var(--card); border-radius: 10px; padding: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
.tab { flex: 1; padding: 9px; text-align: center; font-size: 13px; font-weight: 600; color: var(--text-light); border-radius: 7px; cursor: pointer; transition: all .2s; }
.tab.active { background: var(--primary); color: #fff; }

/* Result Card */
.result-card { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border-left: 4px solid var(--safe); }
.result-card.safe { border-left-color: var(--safe); }
.result-card.moderate { border-left-color: var(--moderate); }
.result-card.reach { border-left-color: var(--reach); }
.result-card.impossible { border-left-color: var(--impossible); }
.result-card.very-safe { border-left-color: var(--safe); }

.rc-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.rc-name { font-size: 16px; font-weight: 700; }
.rc-city { font-size: 12px; color: var(--text-light); margin-top: 2px; }
.rc-prob { text-align: right; }
.rc-prob-num { font-size: 20px; font-weight: 700; }
.rc-prob-label { font-size: 11px; color: var(--text-light); }

.rc-tags { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0; }
.tag { font-size: 11px; padding: 2px 8px; border-radius: 5px; background: #eef2ff; color: var(--primary); font-weight: 500; }
.tag.level { color: #fff; }
.tag.level.very-safe, .tag.level.safe { background: var(--safe); }
.tag.level.moderate { background: var(--moderate); }
.tag.level.reach { background: var(--reach); }
.tag.level.impossible { background: var(--impossible); }

.rc-stats { display: flex; gap: 14px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-light); }
.rc-stats span b { color: var(--text); }

.rc-detail { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); font-size: 12px; color: var(--text-light); }
.rc-detail .history { display: flex; gap: 8px; margin-top: 4px; }
.rc-detail .history span { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; }

/* 专业推荐区域 */
.rc-majors, .rc-majors-empty { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
.rc-majors-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
.rc-majors-none { font-size: 12px; color: var(--text-light); padding: 8px 10px; background: #f9fafb; border-radius: 6px; line-height: 1.6; }
.rc-majors-list { display: flex; flex-direction: column; gap: 8px; }
.rc-major-item { background: #f9fafb; border-radius: 8px; padding: 8px 10px; }
.rc-major-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.rc-major-name { font-size: 13px; font-weight: 600; color: var(--text); }
.rc-major-prob { font-size: 14px; font-weight: 700; }
.rc-major-stats { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--text-light); align-items: center; }
.rc-major-stats b { color: var(--text); }
.rc-major-level { font-weight: 600; font-size: 11px; }
.rc-major-hist { font-size: 10px; color: #9ca3af; margin-top: 4px; line-height: 1.5; }

/* Policy Card */
.policy-card { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.policy-card h3 { font-size: 15px; margin-bottom: 6px; color: var(--primary-dark); }
.policy-card .ptype { display: inline-block; font-size: 11px; padding: 1px 7px; background: #fef3c7; color: #92400e; border-radius: 4px; margin-bottom: 6px; }
.policy-card .pdetail { font-size: 13px; color: var(--text); margin: 6px 0; }
.policy-card .preq, .policy-card .pben { font-size: 12px; color: var(--text-light); margin-top: 4px; }
.policy-card .preq b, .policy-card .pben b { color: var(--text); }

/* Qiangji Card */
.qj-card { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border-left: 4px solid #8b5cf6; }
.qj-card h3 { font-size: 15px; margin-bottom: 4px; }
.qj-card .qj-city { font-size: 12px; color: var(--text-light); }
.qj-card .qj-major { font-size: 13px; margin: 6px 0; }
.qj-card .qj-score { font-size: 12px; color: var(--text-light); }
.qj-card .qj-score b { color: #8b5cf6; font-size: 14px; }

/* Status */
.status { text-align: center; padding: 30px 20px; color: var(--text-light); }
.status .big { font-size: 40px; margin-bottom: 8px; }
.loading { text-align: center; padding: 20px; color: var(--primary); }
.loading .spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Summary Bar */
.summary { background: linear-gradient(135deg, #ecfdf5, #f0fdf4); border: 1px solid #bbf7d0; border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; font-size: 13px; }
.summary b { color: #166534; }

/* Disclaimer */
.disclaimer { background: #fff7ed; border: 1px solid #fed7aa; border-radius: 10px; padding: 12px 14px; margin: 16px 0; font-size: 12px; color: #9a3412; line-height: 1.7; }
.disclaimer b { color: #7c2d12; }

/* Footer */
.footer { text-align: center; font-size: 11px; color: var(--text-light); padding: 20px; }

/* Search box for policies */
.search-box { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 9px; font-size: 14px; margin-bottom: 10px; }

/* Empty */
.empty { text-align: center; padding: 40px 20px; color: var(--text-light); }

@media (min-width: 600px) {
  .input-row { gap: 14px; }
}
</style>
</head>

// ==================== 预测引擎 ====================
function weightedRegression(xs, ys, weights) {
  const n = xs.length;
  if (n < 2) return { slope: 0, intercept: ys[0] || 0, r2: 0 };
  let sumW=0, sumWX=0, sumWY=0, sumWXY=0, sumWX2=0;
  for (let i=0; i<n; i++) {
    const w = weights[i] || 1;
    sumW+=w; sumWX+=w*xs[i]; sumWY+=w*ys[i]; sumWXY+=w*xs[i]*ys[i]; sumWX2+=w*xs[i]*xs[i];
  }
  const denom = sumW*sumWX2 - sumWX*sumWX;
  if (Math.abs(denom) < 1e-10) return { slope:0, intercept: sumWY/sumW, r2:0 };
  const slope = (sumW*sumWXY - sumWX*sumWY) / denom;
  const intercept = (sumWX2*sumWY - sumWX*sumWXY) / denom;
  const yMean = sumWY/sumW;
  let ssRes=0, ssTot=0;
  for (let i=0; i<n; i++) {
    const w = weights[i]||1;
    const pred = slope*xs[i]+intercept;
    ssRes += w*(ys[i]-pred)**2;
    ssTot += w*(ys[i]-yMean)**2;
  }
  const r2 = ssTot>0 ? 1-ssRes/ssTot : 0;
  return { slope, intercept, r2 };
}

function normalCDF(z) {
  if (z < -8) return 0;
  if (z > 8) return 1;
  const t = 1/(1+0.2316419*Math.abs(z));
  const d = 0.3989423*Math.exp(-z*z/2);
  const p = d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));
  return z > 0 ? 1-p : p;
}

function calcProbability(userRank, predictedRank, stdDev) {
  const sd = Math.max(stdDev, 1);
  const z = (predictedRank - userRank) / sd;
  return normalCDF(z);
}

function probToLevel(p) {
  if (p >= 0.80) return { level:'极稳妥', cls:'very-safe', color:'#22c55e' };
  if (p >= 0.60) return { level:'稳妥', cls:'safe', color:'#16a34a' };
  if (p >= 0.40) return { level:'可冲刺', cls:'moderate', color:'#f59e0b' };
  if (p >= 0.20) return { level:'难冲刺', cls:'reach', color:'#f97316' };
  return { level:'基本无望', cls:'impossible', color:'#ef4444' };
}

function fmtProb(p) {
  if (p >= 0.9995) return '99.9%';
  if (p <= 0.0005) return '<0.1%';
  return (p*100).toFixed(1) + '%';
}

function scoreToRank(rankTable, score) {
  if (!rankTable || rankTable.length === 0) return null;
  for (let i=0; i<rankTable.length-1; i++) {
    if (score >= rankTable[i+1].score && score <= rankTable[i].score) {
      const s1=rankTable[i].score, r1=rankTable[i].cumulative_rank;
      const s2=rankTable[i+1].score, r2=rankTable[i+1].cumulative_rank;
      if (s1===s2) return Math.round((r1+r2)/2);
      return Math.round(r1 + (r2-r1)*(s1-score)/(s1-s2));
    }
  }
  if (score > rankTable[0].score) return rankTable[0].cumulative_rank;
  return rankTable[rankTable.length-1].cumulative_rank;
}

function rankToScore(rankTable, rank) {
  if (!rankTable || rankTable.length === 0) return null;
  for (let i=0; i<rankTable.length-1; i++) {
    if (rank >= rankTable[i].cumulative_rank && rank <= rankTable[i+1].cumulative_rank) {
      const s1=rankTable[i].score, r1=rankTable[i].cumulative_rank;
      const s2=rankTable[i+1].score, r2=rankTable[i+1].cumulative_rank;
      if (r1===r2) return s2;
      return Math.round(s2 + (s1-s2)*(r2-rank)/(r2-r1));
    }
  }
  if (rank < rankTable[0].cumulative_rank) return rankTable[0].score;
  return rankTable[rankTable.length-1].score;
}

  const raw = DATA.major_admission.filter(m => m.university_name === uniName);
  if (raw.length === 0) return [];

  // 按专业名分组
  const groups = {};
  raw.forEach(r => {
    const key = r.major_name;
    if (!groups[key]) groups[key] = [];
    groups[key].push({ year: r.year, score: r.min_score, rank: r.min_rank });
  });

  const results = [];
  for (const [majorName, history] of Object.entries(groups)) {
    history.sort((a,b) => a.year - b.year);
    const n = history.length;
    let xs, ys, ws;
    if (n >= 3) {
      xs = history.slice(-3).map(h => h.year);
      ys = history.slice(-3).map(h => h.rank);
      ws = [0.5, 0.3, 0.2];
    } else {
      xs = history.map(h => h.year);
      ys = history.map(h => h.rank);
      ws = xs.map((_, i) => 0.6 - i*0.2);
    }

    const reg = weightedRegression(xs, ys, ws);
    let predictedRank = reg.slope * 2026 + reg.intercept;
    const lastRank = ys[ys.length-1];
    if (predictedRank > lastRank * 1.25) predictedRank = lastRank * 1.25;
    if (reg.slope < 0 && predictedRank < lastRank * 0.7) predictedRank = lastRank * 0.7;
    const maxChange = lastRank * 0.15;
    if (Math.abs(predictedRank - lastRank) > maxChange) {
      predictedRank = lastRank + (predictedRank > lastRank ? maxChange : -maxChange);
    }
    predictedRank = Math.round(predictedRank);

    let stdDev;
    if (n >= 3) stdDev = Math.max(Math.abs(lastRank - ys[0])/3, lastRank*0.06);
    else stdDev = Math.max(lastRank*0.12, 400);

    const prob = calcProbability(userRank, predictedRank, stdDev);
    const levelInfo = probToLevel(prob);
    const predScore = rankToScore(rankTable, predictedRank);

    results.push({
      major_name: majorName,
      predicted_rank: predictedRank,
      predicted_score: predScore,
      probability: prob,
      probability_pct: fmtProb(prob),
      level: levelInfo.level,
      level_color: levelInfo.color,
      data_years: history.map(h => h.year),
      data_ranks: history.map(h => h.rank),
      data_scores: history.map(h => h.score),
    });
  }

  // 按概率降序
  results.sort((a,b) => b.probability - a.probability);
  return results;
}

function getRecommendations(score, rank, category, city) {
  let userRank = rank || null;
  const rankTable2026 = DATA.score_rank.filter(r => r.year === 2026);

  if (!userRank && score) {
    userRank = scoreToRank(rankTable2026, score);
  }
  if (!userRank) return { error: '无法确定位次，请输入有效分数或位次' };

  let universities = DATA.universities.slice();
  if (city) universities = universities.filter(u => u.city === city);
  if (category) {
    universities = universities.filter(u => {
      const tags = (u.tags||'').split(',');
      return tags.includes(category) ||
        (category==='985' && u.is_985) ||
        (category==='211' && u.is_211) ||
        (category==='双一流' && u.is_shuangyiliu);
    });
  }

  const recs = [];
  for (const uni of universities) {
    const adm = DATA.uni_admission.filter(a => a.university_name === uni.name)
      .map(a => ({ year:a.year, score:a.min_score, rank:a.min_rank }))
      .sort((a,b) => a.year - b.year);
    if (adm.length === 0) continue;

    let xs, ys, ws;
    const n = adm.length;
    if (n >= 3) {
      xs = adm.slice(-3).map(h => h.year);
      ys = adm.slice(-3).map(h => h.rank);
      ws = [0.5, 0.3, 0.2];
    } else {
      xs = adm.map(h => h.year);
      ys = adm.map(h => h.rank);
      ws = xs.map((_, i) => 0.6 - i*0.2);
    }

    const reg = weightedRegression(xs, ys, ws);
    let predictedRank = reg.slope * 2026 + reg.intercept;
    const lastRank = ys[ys.length-1];

    if (predictedRank > lastRank * 1.25) predictedRank = lastRank * 1.25;
    if (reg.slope < 0 && predictedRank < lastRank * 0.7) predictedRank = lastRank * 0.7;
    const maxChange = lastRank * 0.15;
    if (Math.abs(predictedRank - lastRank) > maxChange) {
      predictedRank = lastRank + (predictedRank > lastRank ? maxChange : -maxChange);
    }
    predictedRank = Math.round(predictedRank);

    let stdDev;
    if (n >= 3) stdDev = Math.max(Math.abs(lastRank - ys[0])/3, lastRank*0.06);
    else stdDev = Math.max(lastRank*0.12, 400);

    const prob = calcProbability(userRank, predictedRank, stdDev);
    const levelInfo = probToLevel(prob);
    const predScore = rankToScore(rankTable2026, predictedRank);

    const tags = [];
    if (uni.is_985) tags.push('985');
    if (uni.is_211) tags.push('211');
    if (uni.is_shuangyiliu) tags.push('双一流');
    if (uni.category) tags.push(uni.category);

    // 专业级推荐
    const majors = getMajorRecommendations(uni.name, userRank, rankTable2026);

    recs.push({
      name: uni.name, city: uni.city||'', tags,
      predicted_rank: predictedRank, predicted_score: predScore,
      probability: prob, probability_pct: fmtProb(prob),
      level: levelInfo.level, level_class: levelInfo.cls, level_color: levelInfo.color,
      trend_slope: Math.round(reg.slope*10)/10,
      r_squared: Math.round((reg.r2||0)*10000)/10000,
      std_dev: Math.round(stdDev),
      data_years: adm.map(h => h.year),
      data_ranks: adm.map(h => h.rank),
      majors: majors,
    });
  }

  recs.sort((a,b) => b.probability - a.probability);
  return { user_rank: userRank, user_score: score, total_count: recs.length, recommendations: recs };
}

// ==================== UI 交互 ====================
let currentTab = 'rec';

function initCities() {
  const citySet = new Set();
  DATA.universities.forEach(u => { if (u.city) citySet.add(u.city); });
  const cities = [...citySet].sort();
  const sel = document.getElementById('city');
  cities.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    sel.appendChild(opt);
  });
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  if (tab === 'rec') {
    renderRecPlaceholder();
  } else if (tab === 'qj') {
    renderQiangji();
  } else if (tab === 'policy') {
    renderPolicies();
  }
}

function renderRecPlaceholder() {
  const el = document.getElementById('content');
  el.innerHTML = `<div class="status"><div class="big">🎓</div><p>输入分数，获取智能推荐</p></div>`;
}

function doRecommend() {
  const score = parseInt(document.getElementById('score').value);
  const rank = parseInt(document.getElementById('rank').value);
  const category = document.getElementById('category').value;
  const city = document.getElementById('city').value;

  if (!score && !rank) {
    alert('请输入高考分数或位次');
    return;
  }
  if (score && (score < 300 || score > 750)) {
    alert('请输入合理的高考分数（300-750）');
    return;
  }

  // 切换到推荐tab
  if (currentTab !== 'rec') switchTab('rec');

  const el = document.getElementById('content');
  el.innerHTML = `<div class="loading"><div class="spinner"></div><p style="margin-top:10px">AI 分析中...</p></div>`;

  // 模拟异步，让loading显示
  setTimeout(() => {
    const result = getRecommendations(score, rank, category, city);
    renderRecommendations(result);
  }, 200);
}

function renderRecommendations(result) {
  const el = document.getElementById('content');
  if (result.error) {
    el.innerHTML = `<div class="status"><div class="big">⚠️</div><p>${result.error}</p></div>`;
    return;
  }
  if (result.recommendations.length === 0) {
    el.innerHTML = `<div class="empty"><p>没有找到匹配的院校</p><p style="margin-top:8px;font-size:13px">尝试更换筛选条件</p></div>`;
    return;
  }

  // 统计
  const safe = result.recommendations.filter(r => r.probability >= 0.6).length;
  const moderate = result.recommendations.filter(r => r.probability >= 0.4 && r.probability < 0.6).length;
  const reach = result.recommendations.filter(r => r.probability >= 0.2 && r.probability < 0.4).length;

  let html = `<div class="summary">
    你的位次：<b>第 ${result.user_rank.toLocaleString()} 名</b> · 
    共匹配 <b>${result.total_count}</b> 所院校 · 
    稳妥 <b>${safe}</b> · 冲刺 <b>${moderate}</b> · 难冲 <b>${reach}</b>
  </div>`;

  result.recommendations.forEach(r => {
    const tagsHtml = r.tags.map(t => `<span class="tag">${t}</span>`).join('');
    const historyHtml = r.data_years.map((y, i) => 
      `<span>${y}年: 第${r.data_ranks[i].toLocaleString()}名</span>`
    ).join('');

    html += `<div class="result-card ${r.level_class}">
      <div class="rc-head">
        <div>
          <div class="rc-name">${r.name}</div>
          <div class="rc-city">📍 ${r.city}</div>
        </div>
        <div class="rc-prob">
          <div class="rc-prob-num" style="color:${r.level_color}">${r.probability_pct}</div>
          <div class="rc-prob-label">录取概率</div>
        </div>
      </div>
      <div class="rc-tags">
        <span class="tag level ${r.level_class}">${r.level}</span>
        ${tagsHtml}
      </div>
      <div class="rc-stats">
        <span>预测位次 <b>第${r.predicted_rank.toLocaleString()}名</b></span>
        <span>预测分数 <b>${r.predicted_score||'-'}</b></span>
        <span>趋势 <b>${r.trend_slope > 0 ? '↑' : r.trend_slope < 0 ? '↓' : '→'} ${Math.abs(r.trend_slope)}</b></span>
      </div>
      <div class="rc-detail">
        历史数据：${historyHtml || '仅1年数据'}<br>
        拟合度 R²=${r.r_squared} · 波动σ=${r.std_dev}
      </div>
      ${renderMajorSection(r)}
    </div>`;
  });

  el.innerHTML = html;
}

// 渲染专业级推荐区域
function renderMajorSection(r) {
  if (!r.majors || r.majors.length === 0) {
    return `<div class="rc-majors-empty">
      <div class="rc-majors-title">📚 专业推荐</div>
      <div class="rc-majors-none">暂无该院校的专业级录取数据，建议参考院校组最低位次或查阅官方招生简章</div>
    </div>`;
  }

  let html = `<div class="rc-majors">
    <div class="rc-majors-title">📚 专业推荐（${r.majors.length} 个专业）</div>
    <div class="rc-majors-list">`;

  r.majors.forEach(m => {
    const histHtml = m.data_years.map((y, i) => 
      `${y}年:${m.data_scores[i]}分/第${m.data_ranks[i].toLocaleString()}名`
    ).join(' · ');

    html += `<div class="rc-major-item">
      <div class="rc-major-head">
        <span class="rc-major-name">${m.major_name}</span>
        <span class="rc-major-prob" style="color:${m.level_color}">${m.probability_pct}</span>
      </div>
      <div class="rc-major-stats">
        <span class="rc-major-level" style="color:${m.level_color}">${m.level}</span>
        <span>预测位次 <b>第${m.predicted_rank.toLocaleString()}名</b></span>
        <span>预测分 <b>${m.predicted_score||'-'}</b></span>
      </div>
      <div class="rc-major-hist">${histHtml}</div>
    </div>`;
  });

  html += `</div></div>`;
  return html;
}

function renderQiangji() {
  const el = document.getElementById('content');
  let html = `<div class="summary">2025年天津强基计划入围分数线（共 ${DATA.qiangji_plan.length} 所）</div>`;
  
  // 按分数排序（原始高考分优先）
  const sorted = [...DATA.qiangji_plan].sort((a, b) => {
    const sa = a.score_type.includes('原始') ? a.tianjin_score_2025 : 999;
    const sb = b.score_type.includes('原始') ? b.tianjin_score_2025 : 999;
    return sb - sa;
  });

  sorted.forEach(q => {
    html += `<div class="qj-card">
      <h3>${q.university_name}</h3>
      <div class="qj-city">📍 ${q.city} · ${q.major_type}</div>
      <div class="qj-major">招生专业：${q.major_name}</div>
      <div class="qj-score">2025天津入围线：<b>${q.tianjin_score_2025}</b> 分（${q.score_type}）</div>
      ${q.score_note ? `<div class="qj-score" style="margin-top:4px">📝 ${q.score_note}</div>` : ''}
    </div>`;
  });

  el.innerHTML = html;
}

function renderPolicies() {
  const el = document.getElementById('content');
  let html = `<div class="summary">特殊招生政策汇总（共 ${DATA.special_policy.length} 项）</div>`;
  
  // 按类型分组
  const groups = {};
  DATA.special_policy.forEach(p => {
    if (!groups[p.policy_type]) groups[p.policy_type] = [];
    groups[p.policy_type].push(p);
  });

  const typeLabels = {
    '强基计划': '🏛️ 强基计划',
    '单科破格': '🔥 单科破格（2025新）',
    '竞赛保送': '🏆 竞赛保送',
    '综合评价': '📊 综合评价',
    '外语保送': '🌐 外语保送',
    '高校专项': '🌾 高校专项',
  };

  for (const [type, items] of Object.entries(groups)) {
    items.forEach(p => {
      html += `<div class="policy-card">
        <span class="ptype">${typeLabels[type] || type}</span>
        <h3>${p.policy_name}</h3>
        <div class="pdetail">${p.policy_detail}</div>
        <div class="preq">📋 <b>要求：</b>${p.requirement}</div>
        <div class="pben">💰 <b>优惠：</b>${p.score_benefit}</div>
      </div>`;
    });
  }

  el.innerHTML = html;
}

// 初始化
initCities();
</script>
