<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>像素伙伴 Pixel Companion - 交互式 Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      color: #e8e8e8;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 28px;
      color: #ff85a2;
      margin-bottom: 8px;
      text-shadow: 2px 2px 0 #c44569;
    }

    .header p {
      font-size: 14px;
      color: #a0a0b0;
    }

    .main-container {
      display: flex;
      gap: 24px;
      align-items: flex-start;
      justify-content: center;
      flex-wrap: wrap;
      width: 100%;
      max-width: 900px;
    }

    .pet-area {
      position: relative;
      width: 260px;
      height: 260px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px dashed rgba(255, 133, 162, 0.3);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #petCanvas {
      cursor: pointer;
      image-rendering: pixelated;
      border-radius: 12px;
    }

    .bubble {
      position: absolute;
      bottom: 230px;
      left: 50%;
      transform: translateX(-50%);
      background: #fff;
      color: #333;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 13px;
      max-width: 200px;
      box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.2);
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
      z-index: 10;
      border: 2px solid #333;
    }

    .bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 8px solid #333;
    }

    .bubble.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-8px);
    }

    .panel {
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 133, 162, 0.2);
      border-radius: 16px;
      padding: 20px;
      width: 320px;
    }

    .panel h2 {
      font-size: 16px;
      color: #ff85a2;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-section {
      margin-bottom: 16px;
    }

    .panel-section label {
      display: block;
      font-size: 13px;
      color: #c0c0d0;
      margin-bottom: 8px;
    }

    .pet-selector {
      display: flex;
      gap: 10px;
    }

    .pet-option {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: 3px solid transparent;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    .pet-option:hover {
      transform: scale(1.1);
    }

    .pet-option.active {
      border-color: #fff;
      box-shadow: 0 0 0 2px #ff85a2;
    }

    .pet-option.pink { background: #ff85a2; }
    .pet-option.purple { background: #a78bfa; }
    .pet-option.blue { background: #60a5fa; }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .toggle-row span {
      font-size: 13px;
      color: #c0c0d0;
    }

    .switch {
      position: relative;
      width: 44px;
      height: 24px;
      background: #444;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .switch.on {
      background: #ff85a2;
    }

    .switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .switch.on::after {
      transform: translateX(20px);
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .input-row input {
      flex: 1;
      padding: 8px 12px;
      border: 2px solid rgba(255, 133, 162, 0.3);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.2);
      color: #fff;
      font-size: 13px;
      outline: none;
    }

    .input-row input::placeholder {
      color: #888;
    }

    .input-row button {
      padding: 8px 16px;
      background: #ff85a2;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
    }

    .input-row button:hover {
      background: #ff6b8a;
    }

    .tips {
      margin-top: 24px;
      padding: 16px;
      background: rgba(255, 133, 162, 0.1);
      border-left: 4px solid #ff85a2;
      border-radius: 0 12px 12px 0;
      max-width: 600px;
      font-size: 13px;
      line-height: 1.8;
      color: #d0d0e0;
    }

    .tips strong {
      color: #ff85a2;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      margin-top: 8px;
      background: rgba(255, 133, 162, 0.2);
      color: #ff85a2;
    }

    @media (max-width: 720px) {
      .main-container {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>像素伙伴 Pixel Companion</h1>
    <p>AI 一键生成的 Q 版像素风专属桌宠 · 交互式 Demo</p>
  </div>

  <div class="main-container">
    <div class="pet-area">
      <canvas id="petCanvas" width="200" height="200"></canvas>
      <div id="bubble" class="bubble">你好呀！我是你的像素伙伴～</div>
      <div class="status-badge" id="statusBadge">状态：idle</div>
    </div>

    <div class="panel">
      <h2>⚙️ 设置面板</h2>

      <div class="panel-section">
        <label>切换宠物</label>
        <div class="pet-selector">
          <div class="pet-option pink active" data-pet="pink" title="粉粉"></div>
          <div class="pet-option purple" data-pet="purple" title="紫紫"></div>
          <div class="pet-option blue" data-pet="blue" title="蓝蓝"></div>
        </div>
      </div>

      <div class="panel-section">
        <div class="toggle-row">
          <span>动画效果</span>
          <div class="switch on" id="animSwitch"></div>
        </div>
        <div class="toggle-row">
          <span>气泡自动消失</span>
          <div class="switch on" id="bubbleSwitch"></div>
        </div>
      </div>

      <div class="panel-section">
        <label>和宠物说句话</label>
        <div class="input-row">
          <input type="text" id="chatInput" placeholder="试试输入：你好 / 晚安 / 我好累 / 喜欢你">
          <button id="sendBtn">发送</button>
        </div>
      </div>

      <div class="panel-section">
        <label>快捷互动</label>
        <div class="input-row">
          <button id="pokeBtn" style="flex:1;background:#60a5fa">戳一下</button>
          <button id="petBtn" style="flex:1;background:#ff85a2">摸头</button>
        </div>
      </div>
    </div>
  </div>

  <div class="tips">
    <strong>操作提示：</strong><br>
    • 点击宠物头部 = 摸头（开心）<br>
    • 点击宠物身体 = 戳一下（生气/惊讶）<br>
    • 30 秒不互动，宠物会自动入睡，点击即可唤醒<br>
    • 本 Demo 为 HTML 交互演示，完整桌面端版本支持悬浮窗、系统托盘、配置持久化等功能
  </div>

  <script>
    const canvas = document.getElementById('petCanvas')
    const ctx = canvas.getContext('2d')
    const bubble = document.getElementById('bubble')
    const statusBadge = document.getElementById('statusBadge')

    const PETS = {
      pink: { main: '#ff85a2', dark: '#e05a7a', light: '#ffc2d1', eye: '#2d1b2e', cheek: '#ff9eb5' },
      purple: { main: '#a78bfa', dark: '#7c5ce5', light: '#d4c5ff', eye: '#2d1b2e', cheek: '#c4b5fd' },
      blue: { main: '#60a5fa', dark: '#3b82f6', light: '#bfdbfe', eye: '#2d1b2e', cheek: '#93c5fd' }
    }

    const DIALOGUES = {
      first_open: ['你好呀！我是你的像素伙伴～', '终于等到你啦！', '今天也要开心哦！'],
      pet: ['嘿嘿～好舒服 ❤️', '最喜欢被摸头了！', '再多摸一下嘛～'],
      poke: ['哎呀！别戳我啦！', '哼，我生气了！', '干嘛戳我呀～'],
      wake: ['啊！我醒啦！', '被你吵醒啦～', '早安呀！'],
      sleep: ['Zzz...', '呼噜噜...', '我在做梦呢...'],
      morning: ['早安！今天也要加油哦！', '一日之计在于晨～', '早上好呀！'],
      noon: ['午休时间到！', '吃点好吃的吧～', '休息一下，别太累哦'],
      evening: ['晚上好呀！', '今天辛苦啦～', '该休息休息啦'],
      night: ['晚安，好梦～', '早点睡哦，熬夜不好', '星星亮啦，晚安'],
      keyword_hello: ['你好呀！', '见到你很开心～', '哈喽哈喽！'],
      keyword_tired: ['累了吗？休息一下～', '摸摸头，放松放松', '辛苦了，抱抱你'],
      keyword_love: ['我也喜欢你！', '❤️ 羞羞～', '被你表白了好开心'],
      keyword_goodnight: ['晚安，明天见～', '做个好梦哦', 'Zzz... 晚安'],
      idle: ['好无聊呀...', '你在忙什么呢？', '我陪着你哦']
    }

    let currentPet = 'pink'
    let mood = 'idle'
    let animationEnabled = true
    let bubbleAutoHide = true
    let isSleeping = false
    let lastInteraction = Date.now()
    let totalInteractions = 0
    let bubbleTimer = null
    let sleepTimer = null
    let timeDialogueTimer = null
    let frameCount = 0

    function getRandom(arr) {
      return arr[Math.floor(Math.random() * arr.length)]
    }

    function showBubble(text, duration = 3000) {
      bubble.textContent = text
      bubble.classList.add('show')

      if (bubbleTimer) clearTimeout(bubbleTimer)
      if (bubbleAutoHide) {
        bubbleTimer = setTimeout(() => {
          bubble.classList.remove('show')
        }, duration)
      }
    }

    function setMood(newMood) {
      mood = newMood
      isSleeping = newMood === 'sleeping'
      statusBadge.textContent = `状态：${newMood}`
      draw()
    }

    function resetToIdle() {
      if (!isSleeping) {
        setMood('idle')
      }
    }

    function wakeUp() {
      isSleeping = false
      lastInteraction = Date.now()
      setMood('surprised')
      showBubble(getRandom(DIALOGUES.wake))
      setTimeout(resetToIdle, 3000)
    }

    function interact(type) {
      lastInteraction = Date.now()
      totalInteractions++

      if (isSleeping) {
        wakeUp()
        return
      }

      if (type === 'pet') {
        setMood('happy')
        showBubble(getRandom(DIALOGUES.pet))
      } else if (type === 'poke') {
        const moods = ['angry', 'surprised']
        setMood(getRandom(moods))
        showBubble(getRandom(DIALOGUES.poke))
      }

      setTimeout(resetToIdle, 3000)
    }

    function checkTimeDialogue() {
      const hour = new Date().getHours()
      let key = null
      if (hour >= 6 && hour < 11) key = 'morning'
      else if (hour >= 11 && hour < 14) key = 'noon'
      else if (hour >= 17 && hour < 22) key = 'evening'
      else if (hour >= 22 || hour < 2) key = 'night'

      if (key && Math.random() > 0.6 && !isSleeping) {
        showBubble(getRandom(DIALOGUES[key]))
      }
    }

    function checkKeyword(text) {
      const t = text.toLowerCase()
      if (t.includes('你好') || t.includes('哈喽') || t.includes('hi')) return 'keyword_hello'
      if (t.includes('累') || t.includes('辛苦') || t.includes('困')) return 'keyword_tired'
      if (t.includes('喜欢') || t.includes('爱')) return 'keyword_love'
      if (t.includes('晚安') || t.includes('睡觉')) return 'keyword_goodnight'
      return null
    }

    function sendChat(text) {
      if (!text.trim()) return
      lastInteraction = Date.now()
      totalInteractions++

      if (isSleeping) {
        wakeUp()
        return
      }

      const key = checkKeyword(text)
      if (key) {
        setMood('happy')
        showBubble(getRandom(DIALOGUES[key]))
      } else {
        const replies = [
          '嗯嗯，我在听呢～',
          '真的吗？好有趣！',
          '我也这么觉得！',
          '继续说嘛～',
          '哇，学到了！'
        ]
        setMood('surprised')
        showBubble(getRandom(replies))
      }
      setTimeout(resetToIdle, 3000)
    }

    function drawPixelRect(x, y, w, h, color) {
      ctx.fillStyle = color
      ctx.fillRect(x, y, w, h)
    }

    function drawPet() {
      const colors = PETS[currentPet]
      const t = animationEnabled ? frameCount * 0.08 : 0
      const breathY = animationEnabled ? Math.sin(t) * 3 : 0
      const blink = animationEnabled && Math.sin(t * 0.3) > 0.92

      ctx.clearRect(0, 0, 200, 200)

      // 阴影
      drawPixelRect(60, 175 + breathY * 0.3, 80, 10, 'rgba(0,0,0,0.15)')

      // 身体
      const bodyY = 60 + breathY
      drawPixelRect(50, bodyY, 100, 90, colors.main)
      drawPixelRect(45, bodyY + 20, 110, 70, colors.main)
      drawPixelRect(55, bodyY + 10, 90, 70, colors.light)
      drawPixelRect(70, bodyY + 30, 60, 50, colors.main)

      // 耳朵
      drawPixelRect(55, bodyY - 25, 25, 35, colors.main)
      drawPixelRect(120, bodyY - 25, 25, 35, colors.main)
      drawPixelRect(62, bodyY - 18, 12, 20, colors.light)
      drawPixelRect(127, bodyY - 18, 12, 20, colors.light)

      // 脚
      drawPixelRect(55, bodyY + 90, 25, 20, colors.dark)
      drawPixelRect(120, bodyY + 90, 25, 20, colors.dark)

      // 手
      drawPixelRect(30, bodyY + 45, 25, 20, colors.main)
      drawPixelRect(145, bodyY + 45, 25, 20, colors.main)

      // 表情区域
      const faceY = bodyY + 25

      // 眼睛
      const eyeColor = colors.eye
      if (mood === 'sleeping') {
        drawPixelRect(75, faceY + 10, 18, 4, eyeColor)
        drawPixelRect(107, faceY + 10, 18, 4, eyeColor)
      } else if (mood === 'angry') {
        drawPixelRect(72, faceY + 5, 22, 6, eyeColor)
        drawPixelRect(106, faceY + 5, 22, 6, eyeColor)
        drawPixelRect(75, faceY + 12, 16, 10, eyeColor)
        drawPixelRect(109, faceY + 12, 16, 10, eyeColor)
      } else if (blink) {
        drawPixelRect(75, faceY + 10, 18, 4, eyeColor)
        drawPixelRect(107, faceY + 10, 18, 4, eyeColor)
      } else {
        drawPixelRect(75, faceY + 8, 18, 18, eyeColor)
        drawPixelRect(107, faceY + 8, 18, 18, eyeColor)
        drawPixelRect(80, faceY + 12, 6, 6, '#fff')
        drawPixelRect(112, faceY + 12, 6, 6, '#fff')
      }

      // 腮红
      if (mood !== 'sleeping' && mood !== 'angry') {
        drawPixelRect(68, faceY + 30, 14, 8, colors.cheek)
        drawPixelRect(118, faceY + 30, 14, 8, colors.cheek)
      }

      // 嘴巴
      if (mood === 'happy') {
        drawPixelRect(92, faceY + 28, 16, 8, colors.eye)
        drawPixelRect(94, faceY + 26, 12, 4, '#fff')
      } else if (mood === 'sad') {
        drawPixelRect(92, faceY + 32, 16, 4, colors.eye)
        drawPixelRect(90, faceY + 28, 4, 4, colors.eye)
        drawPixelRect(106, faceY + 28, 4, 4, colors.eye)
      } else if (mood === 'surprised') {
        drawPixelRect(96, faceY + 28, 10, 12, colors.eye)
        drawPixelRect(98, faceY + 30, 6, 6, '#fff')
      } else if (mood === 'angry') {
        drawPixelRect(94, faceY + 30, 14, 6, colors.eye)
      } else if (mood === 'sleeping') {
        drawPixelRect(96, faceY + 32, 10, 4, colors.eye)
      } else {
        drawPixelRect(94, faceY + 30, 14, 4, colors.eye)
      }

      // 装饰效果
      if (mood === 'happy') {
        // 爱心
        drawPixelRect(160, faceY - 10, 8, 8, '#ff4757')
        drawPixelRect(156, faceY - 14, 6, 6, '#ff4757')
        drawPixelRect(166, faceY - 14, 6, 6, '#ff4757')
      } else if (mood === 'angry') {
        // 怒气符号
        drawPixelRect(155, faceY - 20, 4, 16, '#ff4757')
        drawPixelRect(165, faceY - 24, 4, 16, '#ff4757')
        drawPixelRect(175, faceY - 18, 4, 16, '#ff4757')
      } else if (mood === 'sleeping') {
        // Zzz
        ctx.fillStyle = '#a0a0c0'
        ctx.font = 'bold 16px monospace'
        ctx.fillText('Z', 150, faceY - 15)
        ctx.fillText('z', 162, faceY - 25)
      }
    }

    function draw() {
      drawPet()
    }

    function loop() {
      frameCount++

      // 30 秒无互动进入睡眠
      if (!isSleeping && Date.now() - lastInteraction > 30000) {
        setMood('sleeping')
        showBubble(getRandom(DIALOGUES.sleep), 2000)
      }

      if (animationEnabled) {
        draw()
      }
      requestAnimationFrame(loop)
    }

    // 事件监听
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect()
      const x = (e.clientX - rect.left) * (canvas.width / rect.width)
      const y = (e.clientY - rect.top) * (canvas.height / rect.height)

      // 头部区域 y < 90，身体区域 y >= 90
      if (y < 90) {
        interact('pet')
      } else {
        interact('poke')
      }
    })

    document.querySelectorAll('.pet-option').forEach(el => {
      el.addEventListener('click', () => {
        document.querySelectorAll('.pet-option').forEach(o => o.classList.remove('active'))
        el.classList.add('active')
        currentPet = el.dataset.pet
        draw()
      })
    })

    document.getElementById('animSwitch').addEventListener('click', function() {
      this.classList.toggle('on')
      animationEnabled = this.classList.contains('on')
      if (animationEnabled) loop()
    })

    document.getElementById('bubbleSwitch').addEventListener('click', function() {
      this.classList.toggle('on')
      bubbleAutoHide = this.classList.contains('on')
    })

    document.getElementById('sendBtn').addEventListener('click', () => {
      const input = document.getElementById('chatInput')
      sendChat(input.value)
      input.value = ''
    })

    document.getElementById('chatInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        document.getElementById('sendBtn').click()
      }
    })

    document.getElementById('pokeBtn').addEventListener('click', () => interact('poke'))
    document.getElementById('petBtn').addEventListener('click', () => interact('pet'))

    // 定时器
    timeDialogueTimer = setInterval(checkTimeDialogue, 30000)

    // 初始化
    draw()
    loop()
    setTimeout(() => {
      showBubble(getRandom(DIALOGUES.first_open), 4000)
    }, 500)
  </script>
</body>
</html>
