35967-10de6ba17061?w=800&q=80","https://images.unsplash.com/photo-1490645935967-10de6ba17061?w=800&q=80"],music:["https://images.unsplash.com/photo-1571260899304-425eee4c7efc?w=800&q=80","https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800&q=80","https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=800&q=80","https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=800&q=80","https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=800&q=80"]},iy=(t,r)=>{let i=0;for(let a=0;a<t.length;a++)i=i*31+t.charCodeAt(a)&4294967295;return Math.abs(i)%r},x=(t,r="landscape_4_3")=>{let a=t.toLowerCase().split(/[\s,_-]+/).find(p=>p in gc)||"walk";a in gc||(a="walk");const l=gc[a],c=iy(t,l.length);return l[c]},ss=[{id:"sh-coffee-yongkang",name:"永康路咖啡小馆",category:"coffee",duration:30,travelDuration:15,region:"徐汇",address:"徐汇区永康路 38 弄",hours:"09:00–19:00",price:"人均 ¥42",soloFriendly:3,needBooking:!1,tags:["安静","有窗位","可久坐"],cover:x("cozy minimalist coffee shop interior, warm wood, soft daylight from window, a single empty chair, editorial photography, muted tones"),images:[x("coffee shop counter with ceramic cups, warm light, film grain"),x("single chair by window with coffee cup, quiet afternoon, editorial"),x("espresso machine steam, close up, moody warm light")],oneLiner:"一杯手冲的功夫，足够把下午过慢一点。",reason:"永康路的梧桐树下，这家小馆只有四个座位。一个人来不会被注目，吧台对面就是咖啡师，想聊就聊两句，不想聊就看着水流冲下去。它适合你下班后不顺路地绕过来，点一杯浅烘，把今天还没散掉的情绪，慢慢放下来。",howToPlay:["从吧台点完单，端着杯子走到窗边的矮桌，阳光斜进来的时候刚好落在杯沿。","第一口喝原味，第二口闭上眼睛，让苦味在嘴里化开，再轻轻呼一口气。","临走前在门口站一会儿，看咖啡师擦杯子，听磨豆机的声音，把节奏带走。"],tips:"推荐坐在吧台对面，可以看咖啡师的手势，也不会被打扰。这里的 Wi-Fi 一般，正好把手机收起来。",recommendedItem:"冰美式",distance:"1.2km",openDays:"每日营业",coords:{lat:31.208,lng:121.453}},{id:"sh-book-shi",name:"思南书局",category:"book",duration:60,travelDuration:15,region:"黄浦",address:"黄浦区思南路 45 号",hours:"10:00–18:00",price:"免费",soloFriendly:3,needBooking:!1,tags:["老建筑","可久坐","有阅读区"],cover:x("elegant old shanghai villa bookstore, tall windows, wooden stairs, books on shelves, soft afternoon light, editorial"),images:[x("bookstore reading nook with single armchair, warm light"),x("tall bookshelf in historic villa, vertical composition"),x("open book on wooden table by window, quiet")],oneLiner:"在老洋房里翻一本书，时间会自己慢下来。",reason:"三层老洋房，砖红色的楼梯踩上去会咯吱响。一个人来不需要解释，挑一本没读完的诗集，在二楼的窗边坐下，光是从梧桐叶里漏下来的。这里不卖热闹，只卖「刚好可以一个人待着」的那种心安。",howToPlay:["进门后先在书架间慢慢走一圈，不拿书，只用眼睛扫过书脊的颜色和名字。","挑一本封面吸引你的书，绕过人流，在窗边的单人沙发或矮凳上坐下。","读到一个喜欢的段落就停下来，抬头看看窗外的树影，不必急着翻到下一章。"],tips:"建议在周二至周四的下午前往，那是店里阳光最通透也最安静的时间。这里的 Wi-Fi 较弱，适合放下手机。",recommendedItem:"二楼窗边的诗集",distance:"1.2km",openDays:"每日营业",coords:{lat:31.221,lng:121.47}},{id:"sh-walk-suzhou",name:"苏州河畔漫步",category:"walk",duration:60,travelDuration:20,region:"静安",address:"静安区苏州河北岸",hours:"全天",price:"免费",soloFriendly:3,needBooking:!1,tags:["临水","黄昏","无需消费"],cover:x("suzhou creek shanghai at dusk, soft sky, river reflection, quiet walking path, editorial"),images:[x("riverbank path at golden hour, lone walker silhouette"),x("old stone bridge over quiet river, warm light"),x("reflection of buildings in calm water, evening")],oneLiner:"黄昏时走一段河边，把一天的余响走掉。",reason:"从四行仓库往西走，河面慢慢变宽。黄昏的光会铺在水上，跑步的人会从你身边过去，但不打扰你。一个人走这条路的妙处在于：你不必和谁说话，也不必给谁解释你今天过得怎么样。河会替你接着。",howToPlay:["不要设终点，从路口开始沿着梧桐或河岸慢慢走，脚步比平常慢一半。","遇到一扇好看的门、一棵老树或一家小店，就停下来看十秒钟。","走到觉得够了就转身，或者随便跳上一辆公交，把余兴带到下一个路口。"],tips:"黄昏时光线最好，游客也少。穿一双舒服的鞋，带一副耳机但不要一直戴着。",recommendedItem:"临江路段",distance:"1.6km",openDays:"全年开放",coords:{lat:31.245,lng:121.46}},{id:"sh-exhibition-westbund",name:"西岸美术馆·当前展",category:"exhibition",duration:120,travelDuration:30,region:"徐汇",address:"徐汇区龙腾大道 2600 号",hours:"10:00–18:00",price:"人均 ¥120",soloFriendly:3,needBooking:!0,tags:["当代艺术","可久留","需预约"],cover:x("minimal contemporary art museum interior, concrete walls, single visitor watching painting, soft light, editorial"),images:[x("gallery hall with one painting, wooden floor, quiet"),x("museum window view to river, soft light"),x("abstract painting on white wall, single bench")],oneLiner:"一个人看展，是和自己签的一份短合约。",reason:"西岸的好处是空间够大，不会被打扰。一个人看展的好处是，你可以在一幅画前面站十分钟，也可以走开再回来，不需要向谁解释。看完走到江边坐一会儿，黄浦江的风会把展厅里的安静延续到外面。",howToPlay:["进门先在大厅站一会儿，让眼睛适应展厅里的光线和尺度。","拿一份导览册，但不要按顺序看，挑一件最先吸引你的作品走过去。","在一幅画或一件装置前停留久一点，看细节，也看自己的感受。"],tips:"工作日上午十点开馆时人最少，可以独享展厅。大部分展区允许拍照，但建议先认真看。",recommendedItem:"工作日上午场次",distance:"2.4km",openDays:"每日营业",coords:{lat:31.187,lng:121.453},validUntil:"2026-09-30T23:59:59"},{id:"sh-craft-ceramic",name:"陶艺工作室·拉胚体验",category:"craft",duration:120,travelDuration:25,region:"长宁",address:"长宁区愚园路 1107 号",hours:"工作日 14:00–18:00",price:"人均 ¥198",soloFriendly:2,needBooking:!0,tags:["手作","工作日闲时","需预约"],cover:x("ceramic studio wheel with clay, hands shaping bowl, warm window light, editorial"),images:[x("clay on wheel close up, wet and shiny"),x("shelf of unfinished ceramic bowls, soft light"),x("hands holding shaped clay cup, warm tones")],oneLiner:"把一团泥捏成一个东西，比想象中治愈。",reason:"工作日下午的工作室通常只有你和老师两个人。机器转起来之后，注意力会被拉到指尖，脑子里那些没头没尾的待办，会暂时离开你。两个小时之后，你手上多了一个不太完美但确实是你捏的杯子。这是一个具体的、有重量的下午。",howToPlay:["换好围裙，在拉胚机前坐下，老师会把一团泥放在转盘中央。","双手沾湿，轻轻扶住泥团，感受它在转速中慢慢变高、变稳。","最后决定做什么：杯子、小碗，或者什么都不做，只是体验泥在掌心的形状。"],tips:"建议穿深色衣服，袖子要能挽起来。指甲不要太长，方便塑形。",recommendedItem:"拉胚体验套餐",distance:"2.0km",openDays:"周一至周五 · 周末休",coords:{lat:31.223,lng:121.428}},{id:"sh-park-fuxing",name:"复兴公园·法式梧桐",category:"park",duration:30,travelDuration:15,region:"黄浦",address:"黄浦区皋兰路 2 号",hours:"全天",price:"免费",soloFriendly:3,needBooking:!1,tags:["梧桐","可躺草坪","清晨好"],cover:x("french style park with plane trees, gravel path, single bench, soft morning light, shanghai"),images:[x("plane tree canopy from below, dappled light"),x("empty park bench under big tree, peaceful"),x("gravel path through park, morning sun")],oneLiner:"早上的复兴公园，属于遛鸟的老人和刚下班的你。",reason:"这是上海最像巴黎的一块地。早上七点进去，法国梧桐的影子还斜着，长椅上是打盹的老人家和读报的中年人。一个人来这里不需要做任何事，坐着就好。城市还没完全醒，你能听见自己。",howToPlay:["挑一个工作日的上午，公园属于晨练的老人和慢跑的人。","在长椅上坐下，把手机收起来，看一只鸟在地上跳来跳去。","临走时捡一片叶子夹在手机壳里，当作这个下午的凭证。"],tips:"夏天带好驱蚊水，秋天银杏季最美，但黄叶期只有两周左右。",recommendedItem:"法式梧桐下的长椅",distance:"1.2km",openDays:"全年开放",coords:{lat:31.222,lng:121.473}},{id:"sh-tea-yueming",name:"月明茶室",category:"tea",duration:60,travelDuration:20,region:"静安",address:"静安区巨鹿路 845 号",hours:"13:00–22:00",price:"人均 ¥88",soloFriendly:3,needBooking:!1,tags:["安静","可久坐","茶单克制"],cover:x("minimal chinese tea room, wooden table, tea utensils, soft afternoon light, editorial"),images:[x("tea being poured into small cup, steam, close up"),x("tea table with single seat, bamboo mat"),x("window in tea room looking at garden, calm")],oneLiner:"一壶单丛，足够把一个下午过完。",reason:"茶室不大，三张矮桌。一个人来正合适，老板会根据你的心情推荐一泡茶。第一泡醒，第二泡香，第三泡开始你就不太想看手机了。这里的茶单不长，但每一泡都认真。安静不是规定出来的，是茶本身把节奏降下去。",howToPlay:["按约定时间到店，脱鞋或换拖鞋，在茶席前静静坐下。","茶师出汤后先闻杯盖香，再小口啜饮，让茶汤在舌面停留片刻。","喝到第三泡时，身体会慢慢松下来，这时候最适合发呆或轻声聊几句。"],tips:"不要喷太浓的香水，会影响自己和别人的嗅觉。喝茶时少说话，专注于味道。",recommendedItem:"正岩肉桂",distance:"1.6km",openDays:"每日营业",coords:{lat:31.227,lng:121.459}},{id:"sh-market-anshan",name:"鞍山菜市场·晚市",category:"market",duration:60,travelDuration:35,region:"杨浦",address:"杨浦区鞍山路 100 号",hours:"16:00–19:00",price:"人均 ¥30",soloFriendly:2,needBooking:!1,tags:["烟火气","傍晚","可吃小吃"],cover:x("shanghai wet market in late afternoon, warm lights, vegetables and fish, lively but not crowded, editorial"),images:[x("close up of fresh vegetables in basket, market light"),x("fish on ice, market stall, warm"),x("noodle stall steam, evening market")],oneLiner:"下班的路上拐进去，沾一身烟火气再回家。",reason:"一个人住久了，会觉得自己越来越轻。菜市场能把你拉回来。摊位的灯泡是暖的，鱼在盆里翻一下，老板娘招呼你尝一颗冬枣。你不必买很多，几块钱的青菜和一把葱，就足够让今晚的厨房亮起来。",howToPlay:["从市场入口开始慢慢走，不要直奔目标，先看每个摊位的颜色和摆放。","每家买少量：一把青菜、一块豆腐、一份现做小吃。","逛完一圈后，在门口的台阶或路边找个地方吃完，再带着剩下的菜回家。"],tips:"不用买太多，一个人的厨房装不下。重点在于感受烟火气，而不是满载而归。",recommendedItem:"现炸小吃与傍晚生鲜",distance:"2.5km",openDays:"每日开放",coords:{lat:31.278,lng:121.522},validUntil:"2026-06-30T23:59:59"},{id:"sh-film-daguangming",name:"大光明电影院·独立影展",category:"film",duration:120,travelDuration:20,region:"黄浦",address:"黄浦区南京西路 216 号",hours:"按场次",price:"人均 ¥60",soloFriendly:3,needBooking:!0,tags:["老影院","夜场","需购票"],cover:x("historic cinema interior, red seats, single empty seat, projection light, warm, editorial"),images:[x("cinema screen glowing in dark hall, empty seats"),x("art deco cinema facade at night, shanghai"),x("single cinema seat with popcorn, warm light")],oneLiner:"一个人看电影，是少有的、不必回应任何人的两小时。",reason:"大光明是 1933 年的影院，art deco 的门面，里面是翻新过的。挑一场工作日的夜场，买一张角落的票。灯一暗，你和银幕之间就只剩你自己的呼吸。一个人看电影的好，是看完之后不必立刻讨论，可以让它在你身上多停一会儿。",howToPlay:["提前在线上买好一张角落的票，下班或周末晚上独自前往。","进场前买一杯饮料或不买，找到自己的座位后把手机调成静音。","灯暗下来之后，把注意力完全交给银幕，这两小时只属于你和电影。"],tips:"如果影院有原版和配音版，尽量选原版。一个人看电影的好，是看完后可以让情绪多停一会儿。",recommendedItem:"工作日夜场票",distance:"1.6km",openDays:"按场次/演出安排开放",coords:{lat:31.233,lng:121.473},validUntil:"2026-07-31T23:59:59"},{id:"sh-write-jingan",name:"静安写作角",category:"write",duration:120,travelDuration:15,region:"静安",address:"静安区延庆路 23 号",hours:"10:00–20:00",price:"人均 ¥38（含一杯饮品）",soloFriendly:3,needBooking:!1,tags:["长桌","安静","可久坐"],cover:x("quiet writing cafe, long wooden table, lamps, paper and pen, soft light, editorial"),images:[x("open notebook with pen on wooden table, warm light"),x("long shared writing table, quiet cafe"),x("typewriter on desk with cup of tea, still life")],oneLiner:"把今天还没说出口的话，写下来。",reason:"这里有一张六米长的木桌，专门给一个人来写东西的人用。不强制消费，但点一杯茶会更安心。带一个本子，或者带一台电脑，把那些没机会说、也不想发朋友圈的东西写下来。两个小时的安静，足够你写完一封不会寄出去的信。",howToPlay:["带一个本子或电脑，点一杯茶或咖啡，在长桌的一端坐下。","先花五分钟发呆，不写，只看桌面上的木纹和窗外。","然后开始写，不用管主题，把今天想说但没说出口的话倒出来。"],tips:"如果不知道写什么，就从描述此刻眼前的物品开始。这里适合写不会寄出去的信。",recommendedItem:"一本空白笔记本",distance:"1.2km",openDays:"每日营业",coords:{lat:31.229,lng:121.464}},{id:"sh-book-madhaos",name:"玛黑书店",category:"book",duration:60,travelDuration:15,region:"静安",address:"静安区陕西南路 45 号",hours:"11:00–21:00",price:"免费",soloFriendly:3,needBooking:!1,tags:["小众杂志","可坐","选品好"],cover:x("indie bookstore with magazine wall, warm wood, single reader standing, editorial, shanghai"),images:[x("magazine shelf close up, colorful covers"),x("small reading bench by bookshelf, warm light"),x("indie book cover close up, soft focus")],oneLiner:"这里的杂志，比朋友圈有想象力得多。",reason:"店主选品很挑剔，艺术、设计、独立刊物的比例高于大众书店。你可以站着翻半小时，也可以坐在角落的小凳子上翻完一本。一个人逛书店的好，是没有目的也没有压力，看见什么是什么，反而容易撞见意外。",howToPlay:["从楼梯往上走，脚步轻一点，砖木楼梯的声响也是这里的一部分。","在三楼或二楼的角落找一张空椅子，把书摊开放在膝上，像在自己家一样。","离开时去一楼看看新到的独立刊物，有时候翻书比买书更重要。"],tips:"二楼靠窗的位置有限，看到空位就坐下。有些书可以拆开翻阅，不必问店员。",recommendedItem:"艺术与设计独立刊物",distance:"1.2km",openDays:"每日营业",coords:{lat:31.222,lng:121.466}},{id:"sh-coffee-mei",name:"美琪咖啡",category:"coffee",duration:30,travelDuration:15,region:"黄浦",address:"黄浦区茂名南路 173 号",hours:"08:00–20:00",price:"人均 ¥38",soloFriendly:3,needBooking:!1,tags:["早晨好","外带友好","梧桐"],cover:x("coffee shop storefront under plane trees, morning light, single cup on table outside, editorial"),images:[x("barista pouring latte art, close up, warm"),x("outdoor table with coffee cup, plane tree shadow"),x("coffee beans in bag, warm tones")],oneLiner:"上班前的一杯，让今天有一个不那么急的开始。",reason:"八点开门，门口的梧桐还带着晨露。吧台外带窗口正对街道，一个人来不用坐下也能把一杯拿铁喝掉。早上喝咖啡的好，是你给自己留了十分钟，不属任何人。这一小段时间，会让你今天下午对所有人都温柔一点。",howToPlay:["从吧台点完单，端着杯子走到窗边的矮桌，阳光斜进来的时候刚好落在杯沿。","第一口喝原味，第二口闭上眼睛，让苦味在嘴里化开，再轻轻呼一口气。","临走前在门口站一会儿，看咖啡师擦杯子，听磨豆机的声音，把节奏带走。"],tips:"推荐坐在吧台对面，可以看咖啡师的手势，也不会被打扰。这里的 Wi-Fi 一般，正好把手机收起来。",recommendedItem:"埃塞俄比亚耶加雪菲手冲",distance:"1.2km",openDays:"每日营业",coords:{lat:31.227,lng:121.464}},{id:"sh-walk-wukang",name:"武康路·梧桐散步",category:"walk",duration:60,travelDuration:25,region:"徐汇",address:"徐汇区武康路",hours:"全天",price:"免费",soloFriendly:3,needBooking:!1,tags:["老建筑","梧桐","拍照好"],cover:x("wukang road shanghai with plane trees canopy, historic villa, soft afternoon light, editorial"),images:[x("historic villa facade through tree branches, warm"),x("plane tree lined street, dappled light, no people"),x("old gate of shanghai villa, close up")],oneLiner:"走一段武康路，让眼睛换个频道。",reason:"从华山路走到淮海路，正好一个小时。两侧是老洋房和梧桐，光从叶子之间漏下来。一个人走这条路的好，是可以随时停下来看一扇门、一块砖、一只猫。没有目的，没有终点，路本身就是奖励。",howToPlay:["从地铁口出来后关掉导航，凭直觉选一条窄一点的马路往里走。","走累了就找一张长椅或石阶坐下，看来往的自行车和行人。","遇到弄堂口可以大胆拐进去，晾衣杆和老木门后藏着更真实的上海。"],tips:"不用把所有打卡点都走到，选一段最喜欢的路来回走两遍，反而更放松。",recommendedItem:"临江路段",distance:"2.0km",openDays:"全年开放",coords:{lat:31.213,lng:121.435}},{id:"sh-park-zhongshan",name:"中山公园·大草坪",category:"park",duration:60,travelDuration:25,region:"长宁",address:"长宁区长宁路 780 号",hours:"全天",price:"免费",soloFriendly:3,needBooking:!1,tags:["大草坪","可躺","周末好"],cover:x("large park lawn with single tree, people in distance, soft afternoon light, shanghai"),images:[x("picnic blanket on grass with book and cup, warm"),x("big old tree in park, shadow on grass"),x("park path with leaves, golden hour")],oneLiner:"周末的下午，把自己往草地上一放。",reason:"周末下午的大草坪，是属于「什么都不做」的。带一块垫子，或者就带一件外套。躺着看云，或者读几页书。一个人在公园的好处是：你不必表演给谁看你在放松。你就是真的，松弛地，待在那里。",howToPlay:["带一本薄书或一副耳机，找一块有树荫的草地或一张空长椅坐下。","不急着做任何事，先看一会儿云、树影和路过的人。","待够二十分钟，起身时在原地站一会儿，感受身体比来时轻了一点。"],tips:"清晨七点或傍晚五点人最少，空气也最舒服。大草坪周末人多，建议工作日来。",recommendedItem:"大草坪中央",distance:"2.0km",openDays:"全年开放",coords:{lat:31.226,lng:121.421}},{id:"sh-tea-song",name:"松风茶事",category:"tea",duration:60,travelDuration:40,region:"浦东",address:"浦东新区即墨路 8 号",hours:"13:00–22:00",price:"人均 ¥128",soloFriendly:3,needBooking:!0,tags:["预约制","茶席","安静"],cover:x("japanese chinese fusion tea ceremony room, tatami, tea ware, soft light, editorial"),images:[x("tea master hands preparing tea, close up, warm"),x("small tea room with single seat, window light"),x("tea utensils arranged on tray, still life")],oneLiner:"预约一场茶席，把自己交给两个小时。",reason:"预约制的好处是，你坐下的时候，茶已经为你准备好了。茶师不闲聊，只按节奏出汤。两个小时的茶席，足够你把一周的紧绷松开。浦东这一带高楼密集，茶室在闹中取静，反差之下，安静会显得更珍贵。",howToPlay:["按约定时间到店，脱鞋或换拖鞋，在茶席前静静坐下。","茶师出汤后先闻杯盖香，再小口啜饮，让茶汤在舌面停留片刻。","喝到第三泡时，身体会慢慢松下来，这时候最适合发呆或轻声聊几句。"],tips:"茶室通常需要预约，建议提前一天联系。空腹不宜喝茶太浓，可以先吃点东西。",recommendedItem:"凤凰单丛",distance:"2.5km",openDays:"每日营业",coords:{lat:31.241,lng:121.503}},{id:"sh-walk-wukangdafang",name:"武康大楼·武康路到安福路",category:"walk",duration:30,travelDuration:20,region:"徐汇",address:"徐汇区淮海中路1850号武康大楼",hours:"全天",price:"免费",soloFriendly:3,needBooking:!1,tags:["老建筑","梧桐","拍照"],cover:x("wukang building shanghai historic flatiron architecture, plane trees, soft afternoon light, editorial"),images:[x("historic shanghai villa facade through tree branches, warm light"),x("plane tree lined street, dappled light, no people"),x("old gate of shanghai villa, close up, quiet")],oneLiner:"从武康大楼走到安福路，把一公里走慢一点。",reason:"从武康大楼出发，沿武康路向北，一公里里藏着几十栋老建筑。黄兴故居、巴金故居、罗密欧阳台，一扇门一扇门地看过去。一个人走这条路的妙处，是随时可以停下来，看一块砖、一只猫，没人催你。走到安福路找个路边座位歇脚，下午就算没白过。",howToPlay:["选一个黄昏或清晨出发，光线会让老建筑的轮廓变得柔和。","沿着人行道内侧走，避开旅游人群，注意看墙上的爬山虎和门牌号。","在路口买一杯咖啡或一瓶水，边喝边走，不必急着拍照。"],tips:"下雨天其实更适合走，梧桐叶上的水珠和湿润的石板路会让老街区更安静。",recommendedItem:"雨后散步",distance:"1.6km",openDays:"全年开放",coords:{lat:31.2075,lng:121.4374}},{id:"sh-walk-xuhuibinjiang",name:"徐汇滨江·黄浦江日落",category:"walk",duration:30,travelDuration:25,region:"徐汇",address:"徐汇区龙腾大道徐汇滨江步道",hours:"全天",price:"免费",soloFriendly:3,needBooking:!1,tags:["临水","日落","跑步"],cover:x("xuhui riverside shanghai at sunset, wide river, empty walking path, warm golden light, editorial"),images:[x("riverside path at golden hour, lone walker silhouette"),x("long bench by river with sunset view, warm"),x("reflection of buildings in calm river water, evening")],oneLiner:"傍晚去滨江，让夕阳把一整天铺在水面上。",reason:"徐汇滨江的步道几乎没有游客，江面开阔，跑步道和散步道分开。傍晚五点半去，刚好看到日落。光会铺在水上，跑步的人从你身边过去，但不打扰你。一个人走这条路的妙处是：你不必和谁说话，江会替你接着。",howToPlay:["不要设终点，从路口开始沿着梧桐或河岸慢慢走，脚步比平常慢一半。","遇到一扇好看的门、一棵老树或一家小店，就停下来看十秒钟。","走到觉得够了就转身，或者随便跳上一辆公交，把余兴带到下一个路口。"],tips:"黄昏时光线最好，游客也少。穿一双舒服的鞋，带一副耳机但不要一直戴着。",recommendedItem:"雨后散步",distance:"2.0km",openDays:"全年开放",coords:{lat:31.173,lng:121.457}},{id:"sh-walk-yuyuan",name:"愚园路·弄堂深度漫步",category:"walk",duration:30,travelDuration:20,region:"静安",address:"静安区愚园路（静安寺至江苏路段）",hours:"全天",price:"免费",soloFriendly:3,needBooking:!1,tags:["弄堂","老上海","探索"],cover:x("yuyuan road shanghai old lane, hanging clothes, bicycle, soft afternoon light, editorial"),images:[x("narrow shanghai alley with old doors, warm light"),x("independent cafe storefront in old lane, quiet"),x("old brick wall with climbing vine, soft focus")],oneLiner:"从静安寺走进愚园路，像换了一个上海。",reason:"愚园路是被低估的散步路线。从静安寺地铁口出来向西，主路上是独立咖啡馆，但重点在弄堂里。岐山村、宏业花园，大胆走进去，晾衣杆和老木门后面是另一种生活。一个人逛弄堂的好，是不必给谁解释你为什么停下来看一扇窗。",howToPlay:["从地铁口出来后关掉导航，凭直觉选一条窄一点的马路往里走。","走累了就找一张长椅或石阶坐下，看来往的自行车和行人。", 出门后慢慢消化。"],tips:"如果只是想坐着发呆，选一楼杂志区，翻阅成本最低，也最容易被意外灵感击中。",recommendedItem:"日本与欧美生活方式杂志",distance:"1.6km",openDays:"每日营业",coords:{lat:31.205,lng:121.442}},{id:"sh-book-tushuguandong",name:"上海图书馆东馆",category:"book",duration:60,travelDuration:30,region:"浦东",address:"浦东新区迎春路300号",hours:"周二至周日 09:00–20:30（周一闭馆）",price:"免费",soloFriendly:3,needBooking:!1,tags:["图书馆","建筑","可久坐"],cover:x("shanghai library east branch, modern architecture, tall atrium, readers, soft light, editorial"),images:[x("reading hall with floor to ceiling windows, warm"),x("open book on wooden table by window, quiet"),x("modern library staircase, soft light")],oneLiner:"在巨大的阅读森林里，总能找到一个安静的角落。",reason:"上海图书馆东馆是2022年启用的世界级图书馆，像一个巨大的阅读森林。不需要任何手续，走进去找一张椅子就能坐下。三楼的阅读广场有巨大的落地窗，每层楼都有免费座位和电源插座。空间巨大的好处是，你总能找到一个安静的角落。",howToPlay:["从楼梯往上走，脚步轻一点，砖木楼梯的声响也是这里的一部分。","在三楼或二楼的角落找一张空椅子，把书摊开放在膝上，像在自己家一样。","离开时去一楼看看新到的独立刊物，有时候翻书比买书更重要。"],tips:"二楼靠窗的位置有限，看到空位就坐下。有些书可以拆开翻阅，不必问店员。",recommendedItem:"三楼阅读广场",distance:"2.4km",openDays:"周二至周日 · 周一闭馆",coords:{lat:31.21,lng:121.548}},{id:"sh-park-jingan",name:"静安公园",category:"park",duration:15,travelDuration:15,region:"静安",address:"静安区南京西路1649号",hours:"06:00–21:00",price:"免费",soloFriendly:3,needBooking:!1,tags:["市中心","悬铃木","发呆"],cover:x("jingan park shanghai, tall plane trees avenue, benches, soft morning light, editorial"),images:[x("tree lined path with single bench, warm"),x("small lake in park with reflection"),x("cat sleeping on park bench, soft light")],oneLiner:"藏在静安寺对面的口袋森林。",reason:"静安公园藏在静安寺对面，面积不大但树木参天，走进去温度立刻降两度。甬道两侧的悬铃木下有几张长椅，是绝佳的发呆位。公园里流浪猫很多而且亲人，有一只橘猫几乎每天下午都在甬道旁睡觉。一个人来这里不需要做任何事，坐着就好。",howToPlay:["挑一个工作日的上午，公园属于晨练的老人和慢跑的人。","在长椅上坐下，把手机收起来，看一只鸟在地上跳来跳去。"],tips:"夏天带好驱蚊水，秋天银杏季最美，但黄叶期只有两周左右。",recommendedItem:"悬铃木下的长椅",distance:"1.2km",openDays:"全年开放",coords:{lat:31.228,lng:121.447}},{id:"sh-park-qiantan",name:"前滩休闲公园",category:"park",duration:30,travelDuration:30,region:"浦东",address:"浦东新区前滩大道",hours:"全天",price:"免费",soloFriendly:3,needBooking:!1,tags:["滨江","草坪","野餐"],cover:x("qiantan riverside park shanghai, large lawn, river view, people in distance, soft afternoon light, editorial"),images:[x("picnic blanket on grass with book, warm"),x("riverside path at golden hour"),x("single tree on lawn, peaceful")],oneLiner:"江风加夕阳，是免费的心理治疗。",reason:"前滩休闲公园是上海最年轻也最松弛的滨江公园。巨大的草坪上永远有人在野餐、放风筝、躺着看书。一个人铺件外套就能躺一下午，江风吹着特别舒服。傍晚去最舒服，夕阳会把整个江面染成金色。",howToPlay:["带一本薄书或一副耳机，找一块有树荫的草地或一张空长椅坐下。","不急着做任何事，先看一会儿云、树影和路过的人。","待够二十分钟，起身时在原地站一会儿，感受身体比来时轻了一点。"],tips:"清晨七点或傍晚五点人最少，空气也最舒服。大草坪周末人多，建议工作日来。",recommendedItem:"滨江大草坪",distance:"2.4km",openDays:"全年开放",coords:{lat:31.155,lng:121.486}},{id:"sh-park-xujiahui",name:"徐家汇公园",category:"park",duration:20,travelDuration:15,region:"徐汇",address:"徐汇区肇嘉浜路889号",hours:"全天",price:"免费",soloFriendly:3,needBooking:!1,tags:["黑天鹅","玻璃栈道","市中心"],cover:x("xujiahui park shanghai, glass skywalk, black swan lake, soft afternoon light, editorial"),images:[x("black swan on lake, close up, warm"),x("elevated glass walkway through trees"),x("old chimney tower converted to landscape, soft light")],oneLiner:"看黑天鹅，走玻璃栈道，慢一圈二十分钟。",reason:"徐家汇公园由原大中华橡胶厂地块改建，园内有黑天鹅、小桥流水和一条空中玻璃栈道。走上栈道能看到公园全景，老唱片厂烟囱改造成了景观塔。公园不大，慢走一圈约二十分钟。周末的下午有很多人在草坪上看书，一个人来也不会显得突兀。",howToPlay:["带一本薄书或一副耳机，找一块有树荫的草地或一张空长椅坐下。","不急着做任何事，先看一会儿云、树影和路过的人。"],tips:"清晨七点或傍晚五点人最少，空气也最舒服。大草坪周末人多，建议工作日来。",recommendedItem:"空中玻璃栈道",distance:"1.2km",openDays:"全年开放",coords:{lat:31.198,lng:121.438}},{id:"sh-park-yanzhong",name:"延中绿地",category:"park",duration:15,travelDuration:15,region:"黄浦",address:"黄浦区延安中路延中绿地",hours:"全天",price:"免费",soloFriendly:3,needBooking:!1,tags:["竹林","隐秘","市中心"],cover:x("yanzhong greenway shanghai, bamboo grove, pond, winding path, soft afternoon light, editorial"),images:[x("bamboo forest path, dappled light"),x("small pond with reflection, quiet"),x("bench hidden in greenery, peaceful")],oneLiner:"延安高架下，藏着一座听不到车声的世外桃源。",reason:"延中绿地就在延安高架下面，但走进去完全听不到车声。竹林、池塘、蜿蜒小路，像一个小小的世外桃源。推荐走西段，靠近南北高架，有竹林和小池塘。绿地内有很多藏在树丛中的长椅，中午时段很多附近写字楼的上班族在这里散步。",howToPlay:["带一本薄书或一副耳机，找一块有树荫的草地或一张空长椅坐下。","不急着做任何事，先看一会儿云、树影和路过的人。"],tips:"清晨七点或傍晚五点人最少，空气也最舒服。大草坪周末人多，建议工作日来。",recommendedItem:"竹林小径旁的长椅",distance:"1.2km",openDays:"全年开放",coords:{lat:31.226,lng:121.465}},{id:"sh-park-shiji",name:"世纪公园·环湖步道",category:"park",duration:30,travelDuration:30,region:"浦东",address:"浦东新区锦绣路1001号",hours:"07:00–19:00",price:"免费",soloFriendly:3,needBooking:!1,tags:["湖景","跑步","大草坪"],cover:x("century park shanghai, large lake, cherry blossoms, people in distance, soft morning light, editorial"),images:[x("lakeside path at golden hour, lone walker"),x("large lawn with single tree, peaceful"),x("reflection of trees in calm lake water")],oneLiner:"冬天工作日人少，整个湖都是你的。",reason:"世纪公园是上海内环内最大的公园，环湖走一圈刚好半小时。春天樱花季和秋天银杏季格外好看，冬天工作日人少，整个湖都是你的。从1号门进，沿镜天湖顺时针走，约1.5公里。公园内有多个草坪区可以坐下休息，第一次去建议记住门号方便回来。",howToPlay:["从侧门进，避开主路上的人群，沿着小路往深处走。","找一棵大树，在树荫下铺开外套或垫子，躺下看树冠漏下的光。","如果园里有湖，绕湖走半圈，在湖边的长椅上坐一会儿。"],tips:"不必带太多东西，一本书、一瓶水就足够。公园的长椅是最好的座位。",recommendedItem:"镜天湖环湖步道",distance:"2.4km",openDays:"全年开放",coords:{lat:31.211,lng:121.546}},{id:"sh-park-renmin",name:"人民公园·北侧银杏林",category:"park",duration:20,travelDuration:15,region:"黄浦",address:"黄浦区南京西路75号",hours:"06:00–22:00",price:"免费",soloFriendly:3,needBooking:!1,tags:["银杏","发呆","市中心"],cover:x("peoples park shanghai, ginkgo trees golden leaves, quiet path, bench, soft autumn light, editorial"),images:[x("ginkgo leaves on ground, golden"),x("small pond with reflection, quiet"),x("old bench under big tree, peaceful")],oneLiner:"避开相亲角，北侧树林里完全忘了在南京路边上。",reason:"人民公园北侧有一片安静的树林区，几棵百年银杏、一个小池塘和几张长椅。坐在那里完全忘了自己在南京路边上。北侧游客极少，主要是晨练和遛鸟的本地老人。银杏季（11月中下旬）这里特别美，黄叶期大概只有两周，赶上就是运气。",howToPlay:["带一本薄书或一副耳机，找一块有树荫的草地或一张空长椅坐下。","不急着做任何事，先看一会儿云、树影和路过的人。"],tips:"清晨七点或傍晚五点人最少，空气也最舒服。大草坪周末人多，建议工作日来。",recommendedItem:"北侧银杏林下的长椅",distance:"1.2km",openDays:"全年开放",coords:{lat:31.2345,lng:121.473}},{id:"sh-exhibition-psa",name:"上海当代艺术博物馆",category:"exhibition",duration:60,travelDuration:20,region:"黄浦",address:"黄浦区花园港路200号",hours:"周二至周日 11:00–19:00（周一闭馆）",price:"常设展免费",soloFriendly:3,needBooking:!1,tags:["工业风","免费","建筑"],cover:x("power station of art shanghai, industrial building, tall chimney, contemporary art, editorial"),images:[x("industrial museum interior, concrete walls, large space"),x("art installation in huge hall, single visitor"),x("rooftop view of huangpu river, warm")],oneLiner:"由发电厂改造的美术馆，本身就是一件钢铁艺术品。",reason:"上海当代艺术博物馆由南市发电厂改造，本身就是一座水泥钢铁艺术品。常设展览免费，巨大的烟囱很远就能看到。一楼和二楼有免费展区，空间巨大，工业风强烈。五楼有免费观景台可以眺望黄浦江。即使不看展，纯逛建筑也很有意思。",howToPlay:["避开开幕和周末下午，工作日上午通常只有零星的观众。","穿一双走路安静的鞋，展厅里每一步都能听得见。","遇到不懂的作品也没关系，先看颜色、形状和光线，其他的可以留给导览文字。"],tips:"如果展览有语音导览，建议租一个；没有的话，slow looking 也是一种享受。",recommendedItem:"工作日上午场次",distance:"1.6km",openDays:"周二至周日 · 周一闭馆",coords:{lat:31.2,lng:121.498}},{id:"sh-exhibition-westbund-outdoor",name:"西岸美术馆·沿江公共空间",category:"exhibition",duration:30,travelDuration:25,region:"徐汇",address:"徐汇区龙腾大道2600号",hours:"户外全天（馆内周二至周日 10:00–17:00）",price:"户外免费",soloFriendly:3,needBooking:!1,tags:["滨江","建筑","免费"],cover:x("west bund museum shanghai riverside, large steps, public art, soft evening light, editorial"),images:[x("riverside steps with single person sitting, golden hour"),x("outdoor art installation by river"),x("modern museum facade at dusk")],oneLiner:"就算不进馆看展，在江边台阶上坐一会儿也值了。",reason:"西岸美术馆的沿江公共区域全天免费开放。江边巨大的台阶、观景平台和部分户外装置艺术，都是免费体验。傍晚这里的江景特别好看，太阳从江对岸落下。可以沿着滨江步道走到旁边的龙美术馆、余德耀美术馆一带。一个人来，坐一会儿就够。",howToPlay:["先坐电梯到最高层，从上往下逛，人流会少一些。","不拍照，只用眼睛看，让作品在记忆里留下一个模糊但深刻的印象。","结束后不要急着离开，在美术馆的台阶或江边坐十分钟，把展厅里的安静带出来。"],tips:"穿舒适的鞋，有些美术馆空间很大。看完展后可以去馆外的公共空间或江边休息一下。",recommendedItem:"江边大台阶日落",distance:"2.0km",openDays:"户外全天 · 馆内周二至周日",coords:{lat:31.168,lng:121.46}},{id:"sh-exhibition-1933",name:"1933老场坊",category:"exhibition",duration:30,travelDuration:25,region:"虹口",address:"虹口区溧阳路611号",hours:"全天（部分店铺至 22:00）",price:"免费",soloFriendly:3,needBooking:!1,tags:["工业风","建筑","拍照"],cover:x("1933 old millfun shanghai, concrete spiral ramp, industrial architecture, moody light, editorial"),images:[x("concrete labyrinth interior, dramatic light"),x("spiral ramp from above, warm"),x("umbrella columns in atrium, moody")],oneLiner:"在水泥迷宫里穿行，每一步都是新视角。",reason:"1933老场坊是远东最大屠宰场改造的创意园区，巴西利卡式水泥建筑像一个巨大的迷宫。一个人走在交错的廊桥和旋转坡道上，每一步都是新的视角。建筑内部光线偏暗，阴天去反而更有氛围。走一圈约三十分钟，免费、震撼、独一无二。",howToPlay:["进门先在大厅站一会儿，让眼睛适应展厅里的光线和尺度。","拿一份导览册，但不要按顺序看，挑一件最先吸引你的作品走过去。","在一幅画或一件装置前停留久一点，看细节，也看自己的感受。"],tips:"工作日上午十点开馆时人最少，可以独享展厅。大部分展区允许拍照，但建议先认真看。",recommendedItem:"水泥廊桥与旋转坡道",distance:"2.0km",openDays:"每日营业",coords:{lat:31.257,lng:121.492}},{id:"sh-exhibition-liuhaisu",name:"刘海粟美术馆",category:"exhibition",duration:30,travelDuration:25,region:"长宁",address:"长宁区延安西路1609号",hours:"周二至周日 09:00–17:00（周一闭馆）",price:"免费",soloFriendly:3,needBooking:!1,tags:["安静","文艺","小馆"],cover:x("liu haisu art museum shanghai, minimal modern building, soft afternoon light, editorial"),images:[x("small gallery hall with paintings, wooden floor, quiet"),x("oil painting close up, warm tones"),x("museum entrance with sculpture, soft light")],oneLiner:"人少、安静、展品精，半小时逛完一圈。",reason:"刘海粟美术馆以中国现代美术教育先驱刘海粟命名，是小型美术馆。人少、安静、展品精，没有大馆的压迫感。常设展以刘海粟本人的油画和书法为主，临时展通常偏现代。整个美术馆不大，逛完一圈三十到四十五分钟。一个人看画的好，是不必和谁讨论，让画自己说话。",howToPlay:["避开开幕和周末下午，工作日上午通常只有零星的观众。","穿一双走路安静的鞋，展厅里每一步都能听得见。","遇到不懂的作品也没关系，先看颜色、形状和光线，其他的可以留给导览文字。"],tips:"如果展览有语音导览，建议租一个；没有的话，slow looking 也是一种享受。",recommendedItem:"刘海粟油画与书法常设展",distance:"2.0km",openDays:"周二至周日 · 周一闭馆",coords:{lat:31.218,lng:121.42}},{id:"sh-exhibition-zhonghua",name:"中华艺术宫",category:"exhibition",duration:60,travelDuration:30,region:"浦东",address:"浦东新区上南路205号",hours:"周二至周日 10:00–18:00（周一闭馆）",price:"常设展免费",soloFriendly:3,needBooking:!1,tags:["世博","建筑","水墨"],cover:x("china art museum shanghai, giant red architecture, inverted pyramid, soft light, editorial"),images:[x("huge red atrium looking up, dramatic"),x("chinese ink painting on wall, quiet"),x("exhibition hall with paintings, wooden floor")],oneLiner:"巨大的红色斗拱本身就是地标。",reason:"中华艺术宫是2010年世博会中国馆改建的美术馆，那个巨大的红色斗拱本身就是一个地标。免费展区主要在49米层和41米层，展示海派书画和上海历史主题。建筑本身非常震撼，可以在中庭抬头看巨大的红色斗拱结构。光是感受这个空间就值得来一趟。",howToPlay:["避开开幕和周末下午，工作日上午通常只有零星的观众。","穿一双走路安静的鞋，展厅里每一步都能听得见。","遇到不懂的作品也没关系，先看颜色、形状和光线，其他的可以留给导览文字。"],tips:"如果展览有语音导览，建议租一个；没有的话，slow looking 也是一种享受。",recommendedItem:"49米层红色斗拱中庭",distance:"2.4km",openDays:"周二至周日 · 周一闭馆",coords:{lat:31.186,lng:121.49}},{id:"sh-exhibition-duolun",name:"多伦现代美术馆",category:"exhibition",duration:30,travelDuration:25,region:"虹口",address:"虹口区多伦路27号",hours:"周二至周日 10:00–18:00（周一闭馆）",price:"免费",soloFriendly:3,needBooking:!1,tags:["当代艺术","小众","先锋"],cover:x("duolun museum of modern art shanghai, small gallery, contemporary installation, soft light, editorial"),images:[x("empty gallery hall with installation, quiet"),x("contemporary art piece close up"),x("museum entrance on stone paved street")],oneLiner:"通常一个观众，能和整个展厅独处。",reason:"多伦现代美术馆是中国第一家公立当代美术馆，在多伦路文化名人街的尽头。规模不大但展览质量很高，以当代实验艺术为主。人很少，通常一个观众能和整个展厅独处。逛完可以直接在多伦路上继续散步，旧书店和老电影咖啡馆都在附近。",howToPlay:["避开开幕和周末下午，工作日上午通常只有零星的观众。","穿一双走路安静的鞋，展厅里每一步都能听得见。","遇到不懂的作品也没关系，先看颜色、形状和光线，其他的可以留给导览文字。"],tips:"如果展览有语音导览，建议租一个；没有的话，slow looking 也是一种享受。",recommendedItem:"工作日上午场次",distance:"2.0km",openDays:"周二至周日 · 周一闭馆",coords:{lat:31.264,lng:121.485}},{id:"sh-exhibition-bund",name:"外滩·万国建筑免费展览",category:"exhibition",duration:30,travelDuration:20,region:"黄浦",address:"黄浦区中山东一路18号",hours:"周二至周日 10:00–18:00",price:"免费",soloFriendly:3,needBooking:!1,tags:["外滩","老建筑","历史"],cover:x("bund shanghai historic buildings, neo classical facade, soft evening light, editorial"),images:[x("historic building interior with ornate details, warm"),x("old bank hall with marble columns, quiet"),x("exhibition space in historic building, soft light")],oneLiner:"外滩老建筑里，藏着普通人不知道的免费展览。",reason:"外滩沿线的老建筑里藏着几家免费的公共展览空间。外滩18号的久事艺术空间常有上海历史主题展，外滩1号亚细亚大楼内部大厅对外开放，可以进去看老建筑的内部装饰。一边看老建筑内部，一边看展，体验极好。晚上亮灯后建筑外观更美。",howToPlay:["避开开幕和周末下午，工作日上午通常只有零星的观众。","穿一双走路安静的鞋，展厅里每一步都能听得见。","遇到不懂的作品也没关系，先看颜色、形状和光线，其他的可以留给导览文字。"],tips:"如果展览有语音导览，建议租一个；没有的话，slow looking 也是一种享受。",recommendedItem:"外滩老建筑内部空间",distance:"1.6km",openDays:"周二至周日 · 周一休",coords:{lat:31.24,lng:121.49}},{id:"sh-coffee-mannernanyang",name:"Manner咖啡·南阳路店",category:"coffee",duration:15,travelDuration:15,region:"静安",address:"静安区南阳路205号",hours:"07:00–19:00",price:"人均 ¥20",soloFriendly:3,needBooking:!1,tags:["外带","平价","窗口店"],cover:x("manner coffee shanghai small storefront, takeaway window, plane trees, morning light, editorial"),images:[x("barista hands pouring latte art, close up"),x("coffee cup on street, plane tree shadow"),x("small coffee window with queue, warm")],oneLiner:"上海最小的咖啡窗口，买了站在路边喝反而自在。",reason:"Manner的第一家店，只有一个外卖窗口，没有座位。但正因为没有座位，买一杯站在路边喝反而自在。咖啡品质稳定，自带杯还能减五块。窗口对面的墙边可以靠着站一会儿，端着咖啡看南西白领来去匆匆。这是一杯属于一个人的、不属任何人的十分钟。",howToPlay:["选一个靠墙的单人位，把手机反扣在桌上，等手冲的时候看水流一圈圈绕开咖啡粉。","不用赶时间，喝完一杯再决定是否续水。这里适合把今天的某个念头想完。"],tips:"如果赶时间，外带一杯站在路边喝也很自在；若不赶，窗边的位置值得多等十分钟。",recommendedItem:"埃塞俄比亚耶加雪菲手冲",distance:"1.2km",openDays:"每日营业",coords:{lat:31.2285,lng:121.448}},{id:"sh-market-wulumuqi",name:"乌鲁木齐中路·一人食扫街",category:"market",duration:45,travelDuration:15,region:"徐汇",address:"徐汇区乌鲁木齐中路（常熟路至淮海中路段）",hours:"10:00–20:00",price:"人均 ¥50",soloFriendly:3,needBooking:!1,tags:["美食街","扫街","探索"],cover:x("wulumuqi middle road shanghai food street, small shops, warm afternoon light, editorial"),images:[x("scallion pancake close up, golden"),x("bakery storefront with fresh croissants, warm"),x("ice cream cone in hand, street view")],oneLiner:"每家买少量，一条街走下来刚好吃饱。",reason:"乌鲁木齐中路是上海最适合一个人边走边吃的一条街。从葱油饼到法式面包，从冰淇淋到牛油果，每家买少量，一条街走下来刚好吃饱。乌中市集也在路上，可以进去逛一圈看看五颜六色的蔬菜。一个人扫街的好，是不必和谁商量下一站吃什么，跟着眼睛走。",howToPlay:["周末上午去，摊位刚刚摆好，食物还冒着热气。","和摊主聊两句，问问今天什么最新鲜，然后跟着推荐买。","走累了就停下来，在人群边缘站着吃，看市场里的人生百态。"],tips:"不用买太多，一个人的厨房装不下。重点在于感受烟火气，而不是满载而归。",recommendedItem:"葱油饼、可颂与街头小食",distance:"1.2km",openDays:"每日开放",coords:{lat:31.213,lng:121.4435}},{id:"sh-walk-binjiang-sax",name:"滨江大道·民间萨克斯",category:"walk",duration:30,travelDuration:30,region:"浦东",address:"浦东新区滨江大道（正大广场后方江边步道）",hours:"全天（演奏通常 19:00–21:00）",price:"免费",soloFriendly:3,needBooking:!1,tags:["夜景","音乐","滨江"],cover:x("pudong riverside shanghai at night, street musician playing saxophone, city lights, editorial"),images:[x("silhouette of musician against city lights, warm"),x("river view with bund skyline at night"),x("crowd listening on riverside path, soft focus")],oneLiner:"路过、站定、听完几首，满足地离开。",reason:"浦东滨江大道上每晚有民间艺人自发来吹萨克斯。不是演出厅、不是音乐节，没有门票、没有座位号。你路过、站定、听完几首，然后满足地离开。即使没碰到演奏，滨江大道本身的夜景也值得走一趟。周五周六晚上遇到表演的概率最高。",howToPlay:["傍晚七点左右到滨江大道，先沿着江边慢慢走，找一处能听见萨克斯声的地方。","不需要挤到人群最前面，站在人群边缘或长椅旁，听完一两首完整的曲子。","音乐停下的间隙，看看对岸外滩的灯，然后继续往十六铺方向走。"],tips:"周五、周六晚上遇到演奏的概率最高。江边风大，建议带件外套；带一瓶水，站着听也不会渴。",recommendedItem:"日落后的黄金一小时",distance:"2.4km",openDays:"全年开放",coords:{lat:31.238,lng:121.501}},{id:"sh-park-luxun",name:"鲁迅公园·老年合唱团",category:"park",duration:30,travelDuration:25,region:"虹口",address:"虹口区四川北路2288号",hours:"06:00–18:00（合唱通常周末上午）",price:"免费",soloFriendly:3,needBooking:!1,tags:["周末","老上海","治愈"],cover:x("luxun park shanghai, elderly choir singing under trees, soft morning light, editorial"),images:[x("choir conductor with hands raised, warm"),x("group of elderly singers, focused"),x("park path with listeners, peaceful")],oneLiner:"一个老头拿着指挥棒，几十个退休阿姨叔叔唱得很认真。",reason:"每个周末上午，鲁迅公园里自发组织的老年合唱团准时开唱。不是舞台演出，就是一个老头拿着指挥棒，几十个退休阿姨叔叔站成几排，唱得很认真很好听。站着听不需要任何参与，很多年轻人周末专门来感受这种氛围。听完可以去旁边的鲁迅纪念馆看看。",howToPlay:["挑一个工作日的上午，公园属于晨练的老人和慢跑的人。","在长椅上坐下，把手机收起来，看一只鸟在地上跳来跳去。","临走时捡一片叶子夹在手机壳里，当作这个下午的凭证。"],tips:"夏天带好驱蚊水，秋天银杏季最美，但黄叶期只有两周左右。",recommendedItem:"周末上午的合唱角",distance:"2.0km",openDays:"每日开放",coords:{lat:31.272,lng:121.481}},{id:"sh-walk-bund-view",name:"外滩观景平台·看陆家嘴",category:"walk",duration:30,travelDuration:20,region:"黄浦",address:"黄浦区中山东一路外滩观景平台",hours:"全天",price:"免费",soloFriendly:3,needBooking:!1,tags:["夜景","城市观景","免费"],cover:x("the bund shanghai view of pudong skyline at dusk, river, soft golden light, editorial"),images:[x("lujiazui skyline at night, golden lights"),x("river boat passing between banks"),x("single person leaning on railing, silhouette")],oneLiner:"一个人靠着栏杆，看陆家嘴从灰白变成金色。",reason:"外滩观景平台所有上海人都去过，但很少一个人专门去。一个人靠着栏杆，看黄浦江对岸的陆家嘴三件套，江风吹着，轮船从中间穿过。建议傍晚去，看着陆家嘴从白天的灰白色变成夜晚的金色。往南走到十六铺方向人少很多，看江景效果一样好。",howToPlay:["不要设终点，从路口开始沿着梧桐或河岸慢慢走，脚步比平常慢一半。","遇到一扇好看的门、一棵老树或一家小店，就停下来看十秒钟。","走到觉得够了就转身，或者随便跳上一辆公交，把余兴带到下一个路口。"],tips:"黄昏时光线最好，游客也少。穿一双舒服的鞋，带一副耳机但不要一直戴着。",recommendedItem:"黄昏时分",distance:"1.6km",openDays:"全年开放",coords:{lat:31.24,lng:121.49}},{id:"sh-walk-beibund",name:"北外滩·小巨蛋日落",category:"walk",duration:30,travelDuration:25,region:"虹口",address:"虹口区东大名路与公平路交叉口",hours:"全天",price:"免费",soloFriendly:3,needBooking:!1,tags:["日落","小众","滨江"],cover:x("north bund shanghai, music gate spherical architecture, river view at sunset, editorial"),images:[x("golden river at sunset, lone walker"),x("modern spherical building against sky"),x("riverside path with few people, peaceful")],oneLiner:"比外滩人少十倍，江景一样震撼。",reason:"北外滩的「小巨蛋」（音乐之门建筑）旁边的滨江步道，看陆家嘴的角度独一无二。傍晚来这里，整个江面都是金色的。这个点位目前还比较小众，不用和外滩的人挤。看完日落可以去公平路渡口花两块钱坐轮渡到对岸陆家嘴。",howToPlay:["选一个黄昏或清晨出发，光线会让老建筑的轮廓变得柔和。","沿着人行道内侧走，避开旅游人群，注意看墙上的爬山虎和门牌号。","在路口买一杯咖啡或一瓶水，边喝边走，不必急着拍照。"],tips:"下雨天其实更适合走，梧桐叶上的水珠和湿润的石板路会让老街区更安静。",recommendedItem:"黄昏时分",distance:"2.0km",openDays:"全年开放",coords:{lat:31.254,lng:121.498}},{id:"sh-walk-ferry",name:"公平路渡口·两块钱横穿黄浦江",category:"walk",duration:15,travelDuration:25,region:"虹口",address:"虹口区公平路1号",hours:"07:00–19:00（约 15–20 分钟一班）",price:"单程 ¥2",soloFriendly:3,needBooking:!1,tags:["轮渡","平价","独特"],cover:x("shanghai ferry crossing huangpu river, boat, river view, soft evening light, editorial"),images:[x("ferry boat deck with passengers, warm"),x("pudong skyline from river, golden hour"),x("ticket gate at ferry pier, quiet")],oneLiner:"两块钱的轮渡，像做了一次微型旅行。",reason:"公平路渡口到对岸泰东路渡口，票价两元，船程五分钟。上船后去二楼甲板，站在船边看两岸的天际线。建议傍晚去，江上落日非常美。到了对岸可以沿着浦东滨江走一段，然后坐下一班船回来。来回四块钱，总共十五分钟的船程，却像做了一次微型旅行。",howToPlay:["从公平路渡口刷交通码进站，选一艘即将开船的轮渡，直接上二楼甲板。","站在船舷边，看北外滩和陆家嘴在江面上慢慢错开，风吹过来的时候眯起眼睛。"],tips:"傍晚五点到六点的班次最抢手，夕阳把江面染成金色。两块钱的轮渡支持公交卡和移动支付，不必提前买票。",recommendedItem:"二楼甲板位置",distance:"2.0km",openDays:"全年开放",coords:{lat:31.253,lng:121.498}},{id:"sh-market-wuzhong",name:"乌中市集",category:"market",duration:20,travelDuration:15,region:"徐汇",address:"徐汇区乌鲁木齐中路318号",hours:"07:00–19:00",price:"免费",soloFriendly:3,needBooking:!1,tags:["菜市场","烟火气","拍照"],cover:x("wuzhong market shanghai, clean wet market, colorful vegetables, warm light, editorial"),images:[x("vegetable stall with fresh produce, colorful"),x("flower shop inside market, soft light"),x("small noodle stall with steam, warm")],oneLiner:"干净漂亮的菜市场，看五颜六色的蔬菜心情变好。",reason:"乌中市集被Prada包过一次装之后爆火，但包装拆了之后它依然是一个很好的菜市场。干净、漂亮、菜新鲜。一楼是生鲜蔬果区，摊位摆放非常整齐，色彩丰富很适合拍照。即使不买菜，逛一圈看春天的荠菜夏天的丝瓜秋天的柿子也很治愈。",howToPlay:["周末上午去，摊位刚刚摆好，食物还冒着热气。","和摊主聊两句，问问今天什么最新鲜，然后跟着推荐买。"],tips:"穿不怕脏的鞋，雨天市场地面湿滑。现金不是必须，但老店可能更喜欢现金。",recommendedItem:"当季蔬果与现场小吃",distance:"1.2km",openDays:"每日开放",coords:{lat:31.213,lng:121.443}},{id:"sh-market-jiashan",name:"嘉善老市·周末市集",category:"market",duration:20,travelDuration:15,region:"徐汇",address:"徐汇区嘉善路259弄",hours:"周末 10:00–17:00（市集日）",price:"免费",soloFriendly:3,needBooking:!1,tags:["周末","手作","弄堂"],cover:x("jiashan market shanghai, small weekend market in alley, handmade goods, warm light, editorial"),images:[x("market stall with handmade crafts, close up"),x("courtyard with people browsing, soft light"),x("artisan bread close up, warm")],oneLiner:"藏在弄堂里的小型周末市集，氛围很chill。",reason:"嘉善老市藏在嘉善路弄堂里，是一个围合的小院子。周末有小型市集，手作、烘焙、旧物和少量农产品。规模不大但氛围很chill，一个人逛逛、和摊主聊两句，半小时刚刚好。市集不是每个周末都有，平时则是一些固定的小店铺。院子里有家面包店The Market很不错。",howToPlay:["周末下午走进弄堂，跟着人群拐进小院子，先绕场一周看所有摊位。","在手作摊前停下来试吃、试闻，和摊主聊几句创作灵感。"],tips:"市集不是每个周末都有，去之前先看社交媒体预告。下午两三点最热闹，人也最放松。",recommendedItem:"手工面包与手作饰品",distance:"1.2km",openDays:"周末开放 · 工作日休",coords:{lat:31.211,lng:121.457}},{id:"sh-food-erguang",name:"耳光馄饨",category:"food",duration:30,travelDuration:20,region:"黄浦",address:"黄浦区天津路251号",hours:"16:00–02:00",price:"人均 ¥25",soloFriendly:3,needBooking:!1,tags:["深夜食堂","小馄饨","市井"],cover:x("shanghai street food stall, small wonton soup, warm light, steam, editorial"),images:[x("wonton soup in bowl, close up, steaming"),x("street food stall at night, warm lights"),x("wooden table with bowl and chopsticks, simple")],oneLiner:"一碗小馄饨，把深夜的胃和心都暖起来。",reason:"耳光馄饨的名字很有意思，据说好吃到让人打耳光都不放手。深夜的天津路，这家小店门口永远有人排队。一碗现包的小馄饨，皮薄馅鲜，汤里飘着葱花和蛋皮。一个人坐在塑料板凳上，看着热气腾腾的汤，白天的累都跟着蒸汽散掉了。",howToPlay:["深夜到店门口排队，轮到你时直接报「小馄饨加辣油」，找空位坐下。","馄饨端上来后先吹一吹，薄皮在汤里晃，先喝汤再吃馄饨。","吃到最后一滴汤时放下勺子，坐一会儿，看门口还有人陆续进来。"],tips:"深夜十一点后是高峰，错峰去可以少排队。辣油很香但偏辣，第一次建议少放。",recommendedItem:"招牌小馄饨",distance:"1.6km",openDays:"每日营业",coords:{lat:31.236,lng:121.485}},{id:"sh-food-laodifang",name:"老地方面馆",category:"food",duration:45,travelDuration:20,region:"黄浦",address:"黄浦区天津路488号",hours:"07:00–20:00",price:"人均 ¥30",soloFriendly:3,needBooking:!1,tags:["本帮面","浇头","老字号"],cover:x("shanghai traditional noodle shop, bowl of noodles with braised pork, warm light, editorial"),images:[x("noodles with soy sauce and pork, close up"),x("old noodle shop interior, wooden tables"),x("chef adding scallions to bowl, warm")],oneLiner:"老上海的味道，都在这碗面里。",reason:"老地方面馆是上海最有名的本帮面馆之一，开了几十年。招牌是辣肉面和焖蹄面，浇头都是当天现做的。一个人来不必拘束，找个空位坐下，点一碗面加个荷包蛋。面是硬面，汤是酱油汤，吃起来就是老上海的味道。店里人多但不吵，都是低头吃面的街坊。",howToPlay:["进门看墙上的菜单，直接点招牌辣肉面或焖蹄面，再加一个荷包蛋。","等面的时候听老板和熟客聊天，面端上来后先拌开浇头。","低头吃面，不用说话，吃完把汤喝掉，胃和心都踏实了。"],tips:"中午饭点要排队，建议十一点前或下午两点后去。面偏硬，喜欢软面可以提前说。",recommendedItem:"辣肉面加荷包蛋",distance:"1.6km",openDays:"每日营业",coords:{lat:31.238,lng:121.482}},{id:"sh-food-wanshouzhai",name:"万寿斋小笼包",category:"food",duration:30,travelDuration:25,region:"虹口",address:"虹口区山阴路123号",hours:"06:00–19:00",price:"人均 ¥20",soloFriendly:3,needBooking:!1,tags:["小笼包","老字号","早餐"],cover:x("shanghai xiaolongbao dumplings in bamboo steamer, steam, warm light, editorial"),images:[x("xiaolongbao close up, thin skin with soup"),x("bamboo steamer with dumplings, warm"),x("small bowl of vinegar with ginger, traditional")],oneLiner:"皮薄汁多，一口下去全是满足。",reason:"万寿斋是虹口的老字号小笼包店，据说张爱玲也来过。小笼包皮薄汁多，肉馅紧实，蘸一点醋和姜丝，一口一个。店里只有几张桌子，一个人来很方便，坐下就能吃。吃完可以去旁边的鲁迅公园走一走，早晨的阳光特别好。",howToPlay:["早上进店，在窗边或墙角找张空桌坐下，点一笼现蒸的小笼包。","先咬开一个小口，轻轻吸一口汤，再蘸醋和姜丝，一口一个。","吃完一笼如果不够，可以加一笼蟹粉小笼，或者慢慢喝完杯中的茶。"],tips:"刚出笼的小笼包很烫，先开窗再喝汤。醋里加姜丝最解腻，早晨人相对少。",recommendedItem:"鲜肉小笼包",distance:"2.0km",openDays:"每日营业",coords:{lat:31.271,lng:121.482}},{id:"sh-food-convenience",name:"便利店关东煮",category:"food",duration:15,travelDuration:10,region:"静安",address:"静安区任意全家/7-11便利店",hours:"全天",price:"人均 ¥15",soloFriendly:3,needBooking:!1,tags:["暖身","深夜","便捷"],cover:x("convenience store oden soup pot, various ingredients, warm light, editorial"),images:[x("oden ingredients in soup, close up"),x("cup of oden with broth, steaming"),x("convenience store interior at night, warm")],oneLiner:"冬天的深夜，最治愈的就是这一杯热汤。",reason:"便利店的关东煮是一个人深夜回家路上最好的慰藉。萝卜、豆腐、鱼丸、海带，泡在热乎乎的昆布汤里。拿一杯热汤，站在店门口慢慢喝，看着街上的车来车往。不需要坐下，不需要说话，一杯热汤就足够让你觉得今天还不错。",howToPlay:["深夜走进便利店，径直走向热食柜，挑几样喜欢的关东煮装进纸杯。","在靠窗的高脚台前坐下，先喝一口汤，让热汤从喉咙暖到胃。"],tips:"晚上十点到凌晨两点最适合，店里有座位时更舒服。推荐萝卜和昆布汤底，冬天的治愈效果最佳。",recommendedItem:"萝卜、豆腐与昆布汤",distance:"0.8km",openDays:"24小时营业",coords:{lat:31.23,lng:121.45}},{id:"sh-music-yuyintang",name:"育音堂",category:"music",duration:120,travelDuration:25,region:"长宁",address:"长宁区凯旋路851号",hours:"按演出时间",price:"人均 ¥120",soloFriendly:3,needBooking:!0,tags:["现场音乐","独立乐队","夜场"],cover:x("live music venue shanghai, small stage with band, crowd, dim warm light, editorial"),images:[x("band performing on stage, energetic"),x("crowd dancing at live show, soft focus"),x("venue interior with posters, moody")],oneLiner:"一个人去看演出，站在人群里反而更自由。",reason:"育音堂是上海最老牌的独立音乐现场之一，从地下乐队到成名乐队都在这里演出过。一个人去看演出的好处是，你可以站在你想站的位置，跟着音乐晃，不需要和谁说话。结束后走在深夜的凯旋路上，耳朵里还响着刚才的鼓声。",howToPlay:["如果不确定喜欢什么乐队，可以先在场地外听一会儿再决定是否买票。","带少量现金，现场酒水和小周边通常只收现金或移动支付。","遇到喜欢的歌就闭上眼睛，这是属于你一个人的现场。"],tips:"livehouse 里通常比较热，建议少穿一点。演出开始前半小时到场，可以站到好位置。",recommendedItem:"预售票",distance:"2.0km",openDays:"按演出时间开放",coords:{lat:31.207,lng:121.41}},{id:"sh-music-street-perf",name:"静安寺街头艺人",category:"music",duration:60,travelDuration:15,region:"静安",address:"静安区静安寺广场周边",hours:"14:00–20:00",price:"免费（自愿打赏）",soloFriendly:3,needBooking:!1,tags:["街头音乐","即兴","免费"],cover:x("street musician shanghai jingan temple, guitarist playing, people listening, warm afternoon light, editorial"),images:[x("guitarist on street corner, playing"),x("crowd gathered to listen, soft focus"),x("street performer with instrument case, tips")],oneLiner:"路过、停下、听一首歌，然后继续走。",reason:"静安寺广场周边常有街头艺人表演，吉他、萨克斯、手风琴，什么都有。不需要买票，不需要预约，路过的时候觉得好听就停下来听一会儿。一个人听街头音乐的好，是你可以随时走，也可以一直听下去。听完继续逛旁边的久光百货或者静安公园，音乐还在脑子里绕。",howToPlay:["如果不确定喜欢什么乐队，可以先在场地外听一会儿再决定是否买票。","带少量现金，现场酒水和小周边通常只收现金或移动支付。","遇到喜欢的歌就闭上眼睛，这是属于你一个人的现场。"],tips:"一个人去演出反而更自由，不用商量站位和散场时间。保护好耳朵，别站太靠前。",recommendedItem:"预售票",distance:"1.2km",openDays:"每日演出",coords:{lat:31.23,lng:121.447}},{id:"sh-market-wenmiao",name:"文庙旧书市场",category:"market",duration:60,travelDuration:20,region:"黄浦",address:"黄浦区文庙路215号",hours:"周日 09:00–17:00",price:"免费",soloFriendly:3,needBooking:!1,tags:["旧书","周末","淘货"],cover:x("shanghai old book market, stalls with books, people browsing, soft morning light, editorial"),images:[x("old books on stall, close up"),x("browsing through book pile, warm"),x("market stall with vintage items, soft light")],oneLiner:"在旧书堆里，找到别人不要的时光。",reason:"文庙旧书市场每周日上午开市，几百个摊位摆满了旧书、老杂志、邮票和各种古董小玩意儿。一个人在书堆里慢慢翻，总能找到惊喜——一本几十年前的小说、一张旧明信片、或者一本泛黄的笔记本。淘书的乐趣在于不确定性，你永远不知道下一本会是什么。",howToPlay:["周日上午到文庙，先在外围转一圈，看地上摆开的旧书和杂志。","蹲下来慢慢翻，不要嫌弃灰尘，有时候好书就压在最下面。","遇到喜欢的书大胆还价，买一本带走，剩下的风景用眼睛收藏。"],tips:"早上九点刚开市时货最全，十一点后人多起来。带一瓶水和湿巾，旧书堆里灰尘不小。",recommendedItem:"旧书与 vintage 杂志",distance:"1.6km",openDays:"每周日开放",coords:{lat:31.225,lng:121.492}},{id:"sh-exhibition-m50",name:"M50创意园",category:"exhibition",duration:90,travelDuration:25,region:"长宁",address:"长宁区莫干山路50号",hours:"10:00–18:00（部分画廊至 20:00）",price:"免费",soloFriendly:3,needBooking:!1,tags:["艺术区","涂鸦","画廊"],cover:x("m50 art district shanghai, graffiti walls, galleries, industrial buildings, soft afternoon light, editorial"),images:[x("colorful graffiti on industrial wall, vibrant"),x("art gallery interior with contemporary art"),x("courtyard with sculptures and people")],oneLiner:"旧工厂里的艺术绿洲，每一面墙都在说话。",reason:"M50创意园由旧纺织厂改造，是上海最有名的艺术区之一。几十家画廊、工作室、咖啡馆散落其间，外墙画满了涂鸦。一个人逛这里的好处是，可以在喜欢的作品前面站很久，也可以随便走进一家工作室看看艺术家在做什么。逛累了可以在河边的咖啡馆坐下来，看苏州河的船来船往。",howToPlay:["避开开幕和周末下午，工作日上午通常只有零星的观众。","穿一双走路安静的鞋，展厅里每一步都能听得见。","遇到不懂的作品也没关系，先看颜色、形状和光线，其他的可以留给导览文字。"],tips:"如果展览有语音导览，建议租一个；没有的话，slow looking 也是一种享受。",recommendedItem:"涂鸦墙与河边画廊",distance:"2.0km",openDays:"每日营业",coords:{lat:31.238,lng:121.44}},{id:"sh-exhibition-postmuseum",name:"上海邮政博物馆",category:"exhibition",duration:60,travelDuration:15,region:"黄浦",address:"黄浦区天潼路395号",hours:"周二至周日 09:00–17:00（周一闭馆）",price:"免费",soloFriendly:3,needBooking:!1,tags:["历史","建筑","邮票"],cover:x("shanghai post museum, historic building interior, tall ceiling, vintage post boxes, editorial"),images:[x("grand hall with marble columns, warm"),x("vintage post office equipment, old"),x("stamp collection display, colorful")],oneLiner:"在百年邮局里，读一封信的旅程。",reason:"上海邮政博物馆设在1924年建成的上海邮政总局大楼里，建筑本身就是一件艺术品。大厅的大理石柱、马赛克地面、铜制邮筒，都保留着百年前的样子。二楼的展厅展示了中国邮政的历史和各种邮票。一个人逛这里的好，是可以慢慢看那些老照片和旧信件，想象一百年前人们是怎么通信的。",howToPlay:["避开开幕和周末下午，工作日上午通常只有零星的观众。","穿一双走路安静的鞋，展厅里每一步都能听得见。","遇到不懂的作品也没关系，先看颜色、形状和光线，其他的可以留给导览文字。"],tips:"如果展览有语音导览，建议租一个；没有的话，slow looking 也是一种享受。",recommendedItem:"百年邮政大厅",distance:"1.2km",openDays:"周二至周日 · 周一闭馆",coords:{lat:31.245,lng:121.488}},{id:"sh-coffee-manner-nanyang",name:"Manner咖啡·南阳路店",category:"coffee",duration:20,travelDuration:15,region:"静安",address:"静安区南阳路205号",hours:"07:00–19:00",price:"人均 ¥20",soloFriendly:3,needBooking:!1,tags:["外带","平价","窗口店"],cover:x("manner coffee shanghai small takeaway window, plane trees, morning light, editorial"),images:[x("barista pouring latte art, close up"),x("coffee cup on street, plane tree shadow"),x("small coffee window with queue, warm")],oneLiner:"上海最小的咖啡窗口，买了站在路边喝反而自在。",reason:"Manner的第一家店，只有一个外卖窗口，没有座位。但正因为没有座位，买一杯站在路边喝反而自在。咖啡品质稳定，自带杯还能减五块。窗口对面的墙边可以靠着站一会儿，端着咖啡看南西白领来去匆匆。这是一杯属于一个人的、不属任何人的十分钟。",howToPlay:["选一个靠墙的单人位，把手机反扣在桌上，等手冲的时候看水流一圈圈绕开咖啡粉。","不用赶时间，喝完一杯再决定是否续水。这里适合把今天的某个念头想完。"],tips:"如果赶时间，外带一杯站在路边喝也很自在；若不赶，窗边的位置值得多等十分钟。",recommendedItem:"当季限定手冲",distance:"1.2km",openDays:"每日营业",coords:{lat:31.2285,lng:121.448}}];function sy(t){return ss.find(r=>r.id===t)}function ay(t,r){var l;let i=0;const a=Xa.find(c=>c.key .trae-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  font-weight: 500;
  transition: all 0.2s ease;
  cursor: pointer;
  box-sizing: border-box;
  border-radius: 6px;
  position: fixed;
  padding: 8px 8px 8px 10px;
  height: 28px;
  width: 130px;
  z-index: 9999;
}

.trae-badge:hover.trae-badge--light {
  background-color: #EDEFF2;
}

.trae-badge:hover.trae-badge--dark {
  background-color: #2A2D31;
}

.trae-badge-content {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

.trae-badge-logo {
  flex-shrink: 0;
}

.trae-badge-share {
  flex-shrink: 0;
  color: rgba(78, 82, 87, 1);
}

.trae-badge:hover.trae-badge--light .trae-badge-share {
  color: rgba(38, 41, 44, 1);
}

.trae-badge:hover.trae-badge--dark .trae-badge-share {
  color: #D1D3DB;
}

.trae-badge-cancel {
  position: absolute;
  top: -8px;
  right: -8px;
  width: 16px;
  height: 16px;
  cursor: pointer;
  opacity: 0;
  visibility: hidden;
  z-index: 10001;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #000000;
}

.trae-badge:hover .trae-badge-cancel {
  opacity: 1 !important;
  visibility: visible !important;
}

@media (hover: none) and (pointer: coarse) {
  .trae-badge-cancel {
    opacity: 1 !important;
    visibility: visible !important;
  }
}

.trae-badge--light {
  background-color: rgba(255, 255, 255, 1);

}

.trae-badge--bottom-right { bottom: 20px; right: 20px; }

.trae-badge--top-right { top: 20px; right: 20px; }

          function getLuminance(r, g, b) {
            return 0.299 * r + 0.587 * g + 0.114 * b;
          }
          
          function parseColor(color) {
            const rgbaMatch = color.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*[\d.]+)?\)/);
            if (rgbaMatch) {
              return [parseInt(rgbaMatch[1]), parseInt(rgbaMatch[2]), parseInt(rgbaMatch[3])];
            }
            
            const hexMatch = color.match(/^#([0-9a-f]{6})$/i);
            if (hexMatch) {
              const hex = hexMatch[1];
              return [
                parseInt(hex.substr(0, 2), 16),
                parseInt(hex.substr(2, 2), 16),
                parseInt(hex.substr(4, 2), 16)
              ];
            }
            
            const hexShortMatch = color.match(/^#([0-9a-f]{3})$/i);
            if (hexShortMatch) {
              const hex = hexShortMatch[1];
              return [
                parseInt(hex[0] + hex[0], 16),
                parseInt(hex[1] + hex[1], 16),
                parseInt(hex[2] + hex[2], 16)
              ];
            }
            
            return null;
          }
          
          function detectBackgroundColor(element) {
            let targetElement;
            
            if (typeof element === 'string') {
              const found = document.querySelector(element);
              console.debug('Target element found:', found);
              if (!found) return 'rgb(255, 255, 255)';
              targetElement = found;
            } else if (element) {
              targetElement = element;
            } else {
              targetElement = document.body;
            }
            
            let currentElement = targetElement;
            
            while (currentElement && currentElement !== document.documentElement) {
              const computedStyle = window.getComputedStyle(currentElement);
              const backgroundColor = computedStyle.backgroundColor;
              
              console.debug('Checking element:', currentElement.tagName, currentElement.id, currentElement.className);
              console.debug('Background color:', backgroundColor);
              
              if (backgroundColor && backgroundColor !== 'rgba(0, 0, 0, 0)' && backgroundColor !== 'transparent') {
                console.debug('Found background color:', backgroundColor, 'on element:', currentElement);
                return backgroundColor;
              }
              
              currentElement = currentElement.parentElement;
            }
            
            const bodyStyle = window.getComputedStyle(document.body);
            const bodyBackground = bodyStyle.backgroundColor;
            console.debug('Body background:', bodyBackground);
            if (bodyBackground && bodyBackground !== 'rgba(0, 0, 0, 0)' && bodyBackground !== 'transparent') {
              return bodyBackground;
            }
            
            const htmlStyle = window.getComputedStyle(document.documentElement);
            const htmlBackground = htmlStyle.backgroundColor;
            console.debug('HTML background:', htmlBackground);
            if (htmlBackground && htmlBackground !== 'rgba(0, 0, 0, 0)' && htmlBackground !== 'transparent') {
              return htmlBackground;
            }
            
            console.debug('No background found, returning default white');
            return 'rgb(255, 255, 255)';
          }
          
          function autoSelectTheme(container) {
            const backgroundColor = detectBackgroundColor(container);
            const rgb = parseColor(backgroundColor);
            
            console.debug('TRAE Badge Plugin - Background detection:', {
              container,
              backgroundColor,
              rgb
            });
            
            if (!rgb) {
              console.debug('TRAE Badge Plugin - No RGB found, using dark theme');
              return 'dark';
            }
            
            const [r, g, b] = rgb;
            const luminance = getLuminance(r, g, b);
            const selectedTheme = luminance > 128 ? 'dark' : 'light';
            
            console.debug('TRAE Badge Plugin - Theme selection:', {
              luminance,
              selectedTheme,
              reason: luminance > 128 ? 'Light background -> Dark badge' : 'Dark background -> Light badge'
            });
            
            return selectedTheme;
          }
        
              
              // 注入样式
              const style = document.createElement('style');
              style.id = 'trae-badge-plugin-styles';
              style.textContent = css;
              document.head.appendChild(style);
              
              // 创建 Badge 函数
              function createBadge() {
                // 移除已存在的 badge
                const existingBadge = document.getElementById('trae-badge-plugin');
                if (existingBadge) {
                  existingBadge.remove();
                }
                
                // 确定主题
                let variant = 'dark';
                if (true) {
                  variant = autoSelectTheme('#root');
                }
                
                const isDarkBackground = variant === 'dark';
                const logoType = isDarkBackground ? 'light' : 'dark';
                const cancelIcon = isDarkBackground ? cancelLight : cancelDark;
                
                const badge = document.createElement('div');
                badge.id = 'trae-badge-plugin';
                badge.className = `trae-badge trae-badge--${variant} trae-badge--bottom-right`;
                badge.innerHTML = `
                  <div class="trae-badge-content">
                    <div class="trae-badge-logo">${logos[logoType]}</div>
                    <div class="trae-badge-share">${shareIcon}</div>
                  </div>
                  <div class="trae-badge-cancel">${cancelIcon}</div>
                `;
                
                // 添加点击事件
                
                badge.style.cursor = 'pointer';
                badge.addEventListener('click', (e) => {
                  if (e.target.closest('.trae-badge-cancel')) return;
                  window.open('https://www.trae.ai/solo?showJoin=1', '_blank');
                });
                
                
                // 添加取消按钮事件
                const cancelButton = badge.querySelector('.trae-badge-cancel');
                if (cancelButton) {
                  cancelButton.addEventListener('click', (e) => {
                    e.stopPropagation();
                    badge.remove();
                  });
                }
                
                document.body.appendChild(badge);
                return badge;
              }
              
              // 初始创建 badge
              // 等待 React 组件渲染完成后再创建 badge
              function initBadge() {
                // 使用 requestAnimationFrame 等待渲染完成
                requestAnimationFrame(() => {
                  // 再次检查目标元素是否存在
                  const targetElement = document.querySelector('#root');
                  if (targetElement) {
                    const badge = createBadge();
                  } else {
                    // 如果还没有找到，等待一段时间再试
                    setTimeout(() => {
                      const badge = createBadge();
                    }, 500);
                  }
                });
              }
              
              if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initBadge);
              } else {
                // DOM 已经加载完成，但 React 可能还没渲染
                initBadge();
              }
              
              window.TraeBadgePlugin = { 
                destroy: () => {
                  const badge = document.getElementById('trae-badge-plugin');
                  if (badge) badge.remove();
                  style.remove();
                  delete window.TraeBadgePlugin;
                },
                recreate: createBadge
              };
            })();
          </script>
        
</body>
