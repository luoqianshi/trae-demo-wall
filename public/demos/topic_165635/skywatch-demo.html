<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0e1a" />
<title>SkyWatch · 抬头看飞机</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" rel="stylesheet" />
<style>
  :root{
    --bg0:#070a14; --bg1:#0a0e1a; --bg2:#0f1729; --bg3:#141d33;
    --ink:#e8ecf4; --dim:#8b95a8; --faint:#5a6378;
    --amber:#f5b942; --soft:#ffd89b;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:radial-gradient(ellipse at 50% 0%, #0f1729 0%, #0a0e1a 55%, #070a14 100%);
    color:var(--ink);
    font-family:'LXGW WenKai','LXGW WenKai Screen',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
    min-height:100dvh;
  }
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-feature-settings:'tnum' 1}
  button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
  canvas{display:block}

  /* 星空 */
  .stars{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .stars span{position:absolute;border-radius:50%;background:#fff;animation:pulse 3s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.12}50%{opacity:.55}}

  /* 页面容器 */
  .app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100dvh}

  /* ===== 状态栏 ===== */
  .statusbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 16px;padding-top:calc(env(safe-area-inset-top) + 10px);
  }
  .sb-left{min-width:0;flex:1;display:flex;align-items:center;gap:8px}
  .sb-loc{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sb-demo{flex-shrink:0;font-size:10px;padding:2px 8px;border-radius:999px;border:1px solid rgba(245,185,66,.4);background:rgba(245,185,66,.1);color:var(--amber)}
  .sb-mid{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.05);padding:4px 12px;border-radius:999px}
  .sb-mid svg{width:14px;height:14px;color:var(--soft)}
  .sb-count{font-size:12px}
  .sb-unit{font-size:10px;color:var(--dim)}
  .sb-right{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:12px}
  .sb-fresh{font-size:10px;color:var(--faint)}
  .sb-fresh.stale{color:var(--amber)}
  .sb-set{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--dim)}
  .sb-set svg{width:20px;height:20px}

  /* ===== 天空盘区 ===== */
  .dome-area{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 16px 170px}
  .dome-wrap{display:flex;align-items:center;justify-content:center;width:100%}
  #skyDome{touch-action:manipulation;cursor:pointer}
  .hint{position:absolute;bottom:150px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--faint);pointer-events:none;text-align:center;white-space:nowrap}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 32px;pointer-events:none;animation:fadein .4s ease-out both}
  .overlay .big{font-size:18px}
  .overlay .small{font-size:12px;color:var(--faint);margin-top:8px}
  @keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  /* ===== 横幅 ===== */
  .banner{position:fixed;inset-x:0;top:0;z-index:20;padding:0 12px;padding-top:calc(env(safe-area-inset-top) + 52px)}
  .banner-inner{display:flex;align-items:center;gap:10px;max-width:480px;margin:0 auto;padding:9px 16px;border-radius:999px;border:1px solid rgba(245,185,66,.4);background:rgba(15,23,41,.9);backdrop-filter:blur(8px);animation:fadein .4s ease-out both}
  .banner-inner svg{width:14px;height:14px;flex-shrink:0;color:var(--amber);transform:rotate(-45deg)}
  .banner-txt{flex:1;min-width:0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .banner-txt b{color:var(--amber)}
  .banner-x{flex-shrink:0;color:var(--faint)}
  .banner-x svg{width:14px;height:14px;transform:none}

  /* ===== 即将飞过面板 ===== */
  .upcoming{position:fixed;inset-inline:0;bottom:0;z-index:20;transition:transform .3s cubic-bezier(.22,1,.36,1)}
  .upcoming.closed{transform:translateY(calc(100% - 56px))}
  .up-panel{max-width:480px;margin:0 auto;border-top:1px solid rgba(255,255,255,.1);background:rgba(10,14,26,.96);backdrop-filter:blur(10px);border-radius:24px 24px 0 0}
  .up-head{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 20px;padding-bottom:calc(env(safe-area-inset-bottom) + 12px)}
  .up-hl{display:flex;align-items:center;gap:8px}
  .up-dot{width:6px;height:6px;border-radius:50%;background:var(--amber);animation:pulseSoft 2.4s ease-in-out infinite}
  @keyframes pulseSoft{0%,100%{opacity:.6}50%{opacity:1}}
  .up-title{font-size:14px}
  .up-badge{font-size:10px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--dim)}
  .up-chev{transition:transform .3s}
  .up-chev svg{width:20px;height:20px;color:var(--dim)}
  .upcoming.closed .up-chev{transform:rotate(180deg)}
  .up-list{overflow-y:auto;max-height:55vh;padding:0 16px 16px}
  .upcoming.closed .up-list{max-height:0;padding:0 16px}
  .up-empty{padding:48px 0;text-align:center}
  .up-empty .big{font-size:14px;color:var(--faint)}
  .up-empty .small{font-size:11px;color:var(--faint);margin-top:6px;opacity:.7}
  .up-item{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 16px;border:1px solid rgba(255,255,255,.06);border-radius:16px;background:rgba(255,255,255,.03);margin-bottom:8px;transition:.2s}
  .up-item:active{transform:scale(.98);background:rgba(255,255,255,.07)}
  .up-cs{font-size:14px;font-weight:500}
  .up-from{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);margin-top:2px}
  .up-from svg{width:12px;height:12px;color:rgba(245,185,66,.7)}
  .up-meta{font-size:10px;color:var(--faint);margin-top:2px}
  .up-cd{display:flex;align-items:center;gap:6px;flex-shrink:0;padding:6px 12px;border-radius:999px;background:rgba(245,185,66,.12)}
  .up-cd svg{width:12px;height:12px;color:var(--amber)}
  .up-cd span{font-size:11px;color:var(--amber)}

  /* ===== 详情卡 ===== */
  .detail-mask{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
  .detail-bg{position:absolute;inset:0;background:rgba(0,0,0,.3);backdrop-filter:blur(2px)}
  .detail-card{position:relative;width:100%;max-width:480px;border-top:1px solid rgba(255,255,255,.1);background:rgba(10,14,26,.97);border-radius:28px 28px 0 0;padding:12px 20px calc(env(safe-area-inset-bottom) + 20px);box-shadow:0 -10px 40px rgba(0,0,0,.4);animation:slideup .3s cubic-bezier(.22,1,.36,1) both}
  @keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .detail-grab{width:40px;height:4px;border-radius:999px;background:rgba(255,255,255,.15);margin:0 auto 16px}
  .detail-x{position:absolute;right:16px;top:16px;color:var(--dim)}
  .detail-x svg{width:20px;height:20px}
  .detail-cs{font-size:24px;font-weight:600;letter-spacing:1px;margin-bottom:4px}
  .detail-loc{font-size:13px;color:var(--dim);margin-bottom:20px}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
  .dc{border:1px solid rgba(255,255,255,.06);border-radius:12px;background:rgba(255,255,255,.04);padding:10px 12px}
  .dc-l{display:flex;align-items:center;gap:6px;color:var(--faint)}
  .dc-l svg{width:14px;height:14px}
  .dc-l span{font-size:10px}
  .dc-v{font-size:14px;margin-top:4px}
  .metaphor{border:1px solid rgba(245,185,66,.3);background:rgba(245,185,66,.1);border-radius:16px;padding:14px 16px}
  .met-l{font-size:10px;letter-spacing:1.5px;color:rgba(245,185,66,.7);text-transform:uppercase;margin-bottom:6px}
  .met-big{display:flex;align-items:center;gap:8px;font-size:15px}
  .met-big span.emoji{font-size:18px}
  .met-tech{font-size:10px;color:var(--faint);margin-top:8px}

  /* ===== 设置抽屉 ===== */
  .set-mask{position:fixed;inset:0;z-index:40;display:flex;justify-content:flex-end}
  .set-bg{position:absolute;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(2px)}
  .set-panel{position:relative;height:100%;width:100%;max-width:380px;overflow-y:auto;border-left:1px solid rgba(255,255,255,.1);background:rgba(10,14,26,.98);padding:0 20px 40px;padding-top:calc(env(safe-area-inset-top) + 16px);animation:fadein .3s both}
  .set-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
  .set-title{font-size:18px}
  .set-x{color:var(--dim)}
  .set-x svg{width:20px;height:20px}
  .set-sec{margin-bottom:20px}
  .set-sec-h{display:flex;align-items:center;gap:8px;color:var(--dim);margin-bottom:10px}
  .set-sec-h svg{width:16px;height:16px}
  .set-sec-h span{font-size:14px}
  .seg{display:flex;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:3px}
  .seg button{flex:1;padding:8px 0;border-radius:9px;font-size:12px;color:var(--dim);transition:.2s}
  .seg button.on{background:var(--amber);color:#070a14;font-weight:500}
  .set-note{font-size:11px;color:var(--faint);margin-top:8px;line-height:1.6}
  .set-row{display:flex;align-items:center;justify-content:space-between}
  .toggle{position:relative;width:48px;height:28px;border-radius:999px;background:rgba(255,255,255,.12);transition:.2s}
  .toggle.on{background:var(--amber)}
  .toggle i{position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
  .toggle.on i{left:24px}
  .set-reset{display:flex;align-items:center;gap:8px;width:100%;padding:12px 16px;border:1px solid rgba(255,255,255,.08);border-radius:12px;margin-top:8px;font-size:14px}
  .set-reset svg{width:16px;height:16px;color:var(--dim)}
  .set-about{margin-top:24px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.04);border-radius:12px;padding:12px 16px}
  .set-about h4{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:12px;margin-bottom:6px}
  .set-about h4 svg{width:14px;height:14px}
  .set-about p{font-size:11px;color:var(--faint);line-height:1.7}
  .set-about .ver{font-size:10px;color:var(--faint);margin-top:8px}
  .preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
  .preset-grid button{text-align:left;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.04);border-radius:12px;padding:8px 12px;transition:.2s}
  .preset-grid button:active{border-color:rgba(245,185,66,.3)}
  .preset-grid .pc{font-size:12px}
  .preset-grid .pl{font-size:9px;color:var(--faint);margin-top:2px}

  /* ===== 欢迎页 ===== */
  .welcome{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;min-height:100dvh;padding:0 24px 40px;padding-top:calc(env(safe-area-inset-top) + 64px)}
  .radar{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .radar-scan{position:absolute;left:50%;top:96px;width:520px;height:520px;transform:translateX(-50%);border-radius:50%;background:conic-gradient(from 0deg,rgba(245,185,66,0) 0deg,rgba(245,185,66,.12) 40deg,rgba(245,185,66,0) 60deg);opacity:.4}
  .radar-scan.on{animation:scan 3s linear infinite}
  @keyframes scan{to{transform:translateX(-50%) rotate(360deg)}}
  .w-logo{position:relative;width:96px;height:96px;margin:0 auto 28px;border-radius:50%;border:1px solid rgba(255,255,255,.1);background:rgba(15,23,41,.6);box-shadow:0 0 28px 4px rgba(245,185,66,.18);display:flex;align-items:center;justify-content:center}
  .w-logo::before{content:"";position:absolute;inset:10px;border-radius:50%;border:1px solid rgba(255,255,255,.06)}
  .w-logo svg{width:42px;height:42px;transform:rotate(-45deg);color:var(--amber)}
  .w-h1{font-size:24px;text-align:center;line-height:1.5}
  .w-h1 b{color:var(--amber)}
  .w-sub{margin-top:12px;max-width:320px;font-size:14px;color:var(--dim);text-align:center;line-height:1.7}
  .w-btn{margin-top:32px;height:48px;width:100%;max-width:320px;border-radius:999px;background:var(--amber);color:#070a14;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
  .w-btn:active{transform:scale(.95)}
  .w-btn:disabled{opacity:.7}
  .w-btn svg{width:16px;height:16px}
  .w-denied{margin-top:12px;max-width:320px;font-size:12px;color:rgba(245,185,66,.8);text-align:center;animation:fadein .4s both}
  .w-presets{margin-top:40px;width:100%;max-width:320px}
  .w-pl{display:flex;align-items:center;gap:8px;padding:0 4px;font-size:11px;color:var(--faint);margin-bottom:12px}
  .w-pl svg{width:14px;height:14px}
  .w-pc{display:block;width:100%;text-align:left;border:1px solid rgba(255,255,255,.08);background:rgba(15,23,41,.4);border-radius:16px;padding:14px 16px;margin-bottom:10px;transition:.2s}
  .w-pc:active{transform:scale(.98);border-color:rgba(245,185,66,.4)}
  .w-pc .pn{font-size:14px}
  .w-pc .pg{font-size:10px;color:var(--faint);margin-top:2px}
  .w-pc .ph{float:right;font-size:10px;color:var(--amber);background:rgba(245,185,66,.1);padding:2px 8px;border-radius:999px;margin-top:2px}
</style>

<body>
<div class="stars" id="stars"></div>
<div id="root"></div>

<script>
// ===================== 计算模块 =====================
const EARTH_R=6371000, AIRCRAFT_LEN=38, DEG=Math.PI/180;
const DIRS=['北','东北','东','东南','南','西南','西','西北'];

function haversine(la1,lo1,la2,lo2){
  const dLa=(la2-la1)*DEG,dLo=(lo2-lo1)*DEG;
  const a=Math.sin(dLa/2)**2+Math.cos(la1*DEG)*Math.cos(la2*DEG)*Math.sin(dLo/2)**2;
  return EARTH_R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function azimuth(oLa,oLo,aLa,aLo){
  const dLo=(aLo-oLo)*DEG;
  const x=Math.sin(dLo)*Math.cos(aLa*DEG);
  const y=Math.cos(oLa*DEG)*Math.sin(aLa*DEG)-Math.sin(oLa*DEG)*Math.cos(aLa*DEG)*Math.cos(dLo);
  return (Math.atan2(x,y)*(180/Math.PI)+360)%360;
}
function elevSlant(ground,alt){
  const el=ground===0?90:Math.atan2(alt,ground)*(180/Math.PI);
  return {elevation:el,slant:Math.sqrt(ground**2+alt**2)};
}
function deadReckon(la,lo,v,hd,dt){
  if(dt<=0)return{lat:la,lon:lo};
  const d=v*dt;
  return{
    lat:la+((d*Math.cos(hd*DEG))/EARTH_R)*(180/Math.PI),
    lon:lo+((d*Math.sin(hd*DEG))/(EARTH_R*Math.cos(la*DEG)))*(180/Math.PI)
  };
}
function predictClosest(obs,ac){
  if(ac.velocity<10)return null;
  const cur=haversine(obs.lat,obs.lon,ac.latitude,ac.longitude);
  let min=cur,mt=0;
  for(let t=0;t<=1500;t+=10){
    const p=deadReckon(ac.latitude,ac.longitude,ac.velocity,ac.heading,t);
    const d=haversine(obs.lat,obs.lon,p.lat,p.lon);
    if(d<min){min=d;mt=t;}
    if(d>min*1.5&&t>mt+60)break;
  }
  return{secondsToClosest:mt,closestGroundDistance:min,closestSlantDistance:Math.sqrt(min**2+ac.altitude**2),isApproaching:min<cur*0.95,willPassOverhead:min<5000};
}
function angSize(slant){return slant<=0?0:(AIRCRAFT_LEN/slant)*(180/Math.PI);}
function sizeMeta(ang){
  if(ang>0.5)return{level:'huge',text:'比满月还大，非常醒目',emoji:'🌕'};
  if(ang>0.2)return{level:'moon',text:'约满月大小，很容易找到',emoji:'🌕'};
  if(ang>0.1)return{level:'rice',text:'像伸直手臂时的一粒米',emoji:'🔍'};
  if(ang>0.05)return{level:'sesame',text:'像伸直手臂时的一粒芝麻',emoji:'🔍'};
  return{level:'speck',text:'一个移动的小亮点，需仔细看',emoji:'✨'};
}
function dirName(az){return DIRS[Math.round(az/45)%8];}
function elevHuman(el){
  if(el>=75)return'几乎在头顶';
  if(el>=50)return'高高在上';
  if(el>=30)return'半空中';
  if(el>=15)return'半空中偏下';
  if(el>5)return'接近地平线';
  return'地平线附近';
}
function enhance(obs,raw,now){
  const dt=now-raw.time_position;
  const{lat,lon}=deadReckon(raw.latitude,raw.longitude,raw.velocity,raw.heading,dt>0?dt:0);
  const az=azimuth(obs.lat,obs.lon,lat,lon);
  const ground=haversine(obs.lat,obs.lon,lat,lon);
  const{elevation,slant}=elevSlant(ground,raw.altitude);
  const ang=angSize(slant);
  const meta=sizeMeta(ang);
  const pred=predictClosest(obs,{latitude:lat,longitude:lon,altitude:raw.altitude,velocity:raw.velocity,heading:raw.heading})||{secondsToClosest:0,closestGroundDistance:ground,closestSlantDistance:slant,isApproaching:false,willPassOverhead:false};
  return{icao24:raw.icao24,callsign:raw.callsign,latitude:lat,longitude:lon,altitude:raw.altitude,velocity:raw.velocity,heading:raw.heading,azimuth:az,elevation,elevation,distance:slant,direction:dirName(az),visible:elevation>5,angular_size:ang,size_metaphor:meta,prediction:pred};
}

// ===================== Mock 数据源 =====================
const PREFIXES=['CCA','CES','CSN','CPA','CKK'];
const RADIUS_KM=300;
const fleets=new Map();
function rand(a,b){return a+Math.random()*(b-a);}
function genCallsign(){return PREFIXES[Math.floor(Math.random()*PREFIXES.length)]+(100+Math.floor(Math.random()*900));}
function genIcao(){return Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0');}
function bearingFromObs(obs,km,br){
  const R=6371,b=br*DEG,l1=obs.lat*DEG,lo1=obs.lon*DEG;
  const l2=Math.asin(Math.sin(l1)*Math.cos(km/R)+Math.cos(l1)*Math.sin(km/R)*Math.cos(b));
  const lo2=lo1+Math.atan2(Math.sin(b)*Math.sin(km/R)*Math.cos(l1),Math.cos(km/R)-Math.sin(l1)*Math.sin(l2));
  return{lat:l2*180/Math.PI,lon:lo2*180/Math.PI};
}
function spawn(obs){
  const km=rand(30,150),br=rand(0,360);
  const pos=bearingFromObs(obs,km,br);
  const toObs=(br+180)%360;
  return{icao24:genIcao(),callsign:genCallsign(),latitude:pos.lat,longitude:pos.lon,altitude:rand(3000,11000),velocity:rand(180,260),heading:(toObs+rand(-40,40)+360)%360,vertical_rate:rand(-5,5),time_position:Math.floor(Date.now()/1000)};
}
function getMock(obs){
  const key=obs.lat.toFixed(1)+','+obs.lon.toFixed(1);
  let f=fleets.get(key);
  if(!f){f=Array.from({length:Math.floor(rand(10,16))},()=>spawn(obs));fleets.set(key,f);}
  const now=Math.floor(Date.now()/1000);
  const out=[];
  for(const p of f){
    const dt=now-p.time_position;
    if(dt>0){const np=deadReckon(p.latitude,p.longitude,p.velocity,p.heading,dt);p.latitude=np.lat;p.longitude=np.lon;p.time_position=now;}
    const d=haversine(obs.lat,obs.lon,p.latitude,p.longitude);
    if(d>RADIUS_KM*1000){Object.assign(p,spawn(obs));p.time_position=now;}
    out.push({...p});
  }
  return{time:now,aircraft:out};
}

// ===================== 天空盘绘制 =====================
function domeProject(az,el,cx,cy,R){
  const r=(90-el)/90;
  return{x:cx+r*Math.sin(az*DEG)*R,y:cy-r*Math.cos(az*DEG)*R};
}
function lerpAz(from,to){
  let d=to-from;
  if(d>180)to-=360;else if(d<-180)to+=360;
  return to;
}
const INTERP_WIN=9000;
function updInterp(prev,acs,now){
  const next=new Map();
  for(const ac of acs){
    const old=prev.get(ac.icao24);
    if(old){
      const fAz=old.curAz,tAz=lerpAz(fAz,ac.azimuth);
      next.set(ac.icao24,{icao:ac.icao24,fromAz:fAz,fromElev:old.curElev,toAz:tAz,toElev:ac.elevation,startTs:now,duration:INTERP_WIN,curAz:fAz,curElev:old.curElev,callsign:ac.callsign,heading:ac.heading});
    }else{
      next.set(ac.icao24,{icao:ac.icao24,fromAz:ac.azimuth,fromElev:ac.elevation,toAz:ac.azimuth,toElev:ac.elevation,startTs:now,duration:INTERP_WIN,curAz:ac.azimuth,curElev:ac.elevation,callsign:ac.callsign,heading:ac.heading});
    }
  }
  return next;
}
function stepInterp(st,now){
  for(const s of st.values()){
    const t=Math.min(1,Math.max(0,(now-s.startTs)/s.duration));
    s.curAz=(s.fromAz+(s.toAz-s.fromAz)*t+360)%360;
    s.curElev=s.fromElev+(s.toElev-s.fromElev)*t;
  }
}
function drawStatic(ctx,cx,cy,R){
  const g=ctx.createRadialGradient(cx,cy,R*0.1,cx,cy,R);
  g.addColorStop(0,'rgba(31,45,74,.55)');g.addColorStop(0.6,'rgba(15,23,41,.35)');g.addColorStop(1,'rgba(7,10,20,.2)');
  ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
  ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.strokeStyle='rgba(255,255,255,.1)';ctx.lineWidth=1;ctx.stroke();
  for(const e of[60,30]){const rr=((90-e)/90)*R;ctx.beginPath();ctx.arc(cx,cy,rr,0,Math.PI*2);ctx.strokeStyle='rgba(255,255,255,.06)';ctx.stroke();}
  ctx.strokeStyle='rgba(255,255,255,.04)';ctx.beginPath();ctx.moveTo(cx-R,cy);ctx.lineTo(cx+R,cy);ctx.moveTo(cx,cy-R);ctx.lineTo(cx,cy+R);ctx.stroke();
  const lbs=[['N',0],['E',90],['S',180],['W',270]];
  ctx.font='600 13px "JetBrains Mono",monospace';ctx.textAlign='center';ctx.textBaseline='middle';
  for(const[l,a]of lbs){const ag=a*DEG;const lx=cx+Math.sin(ag)*(R+18),ly=cy-Math.cos(ag)*(R+18);ctx.fillStyle=l==='N'?'rgba(245,185,66,.85)':'rgba(255,255,255,.4)';ctx.fillText(l,lx,ly);}
  ctx.beginPath();ctx.arc(cx,cy,2,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.25)';ctx.fill();
}
function drawAc(ctx,s,cx,cy,R,sel){
  if(s.curElev<0)return;
  const{x,y}=domeProject(s.curAz,s.curElev,cx,cy,R);
  ctx.save();ctx.translate(x,y);ctx.rotate((s.heading)*DEG);
  if(sel){ctx.beginPath();ctx.arc(0,0,11,0,Math.PI*2);ctx.fillStyle='rgba(245,185,66,.18)';ctx.fill();ctx.beginPath();ctx.arc(0,0,7,0,Math.PI*2);ctx.strokeStyle='rgba(245,185,66,.95)';ctx.lineWidth=1.5;ctx.stroke();}
  const gl=ctx.createRadialGradient(0,0,0,0,0,9);
  gl.addColorStop(0,'rgba(255,216,155,.9)');gl.addColorStop(0.4,'rgba(255,216,155,.35)');gl.addColorStop(1,'rgba(255,216,155,0)');
  ctx.fillStyle=gl;ctx.beginPath();ctx.arc(0,0,9,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.moveTo(0,-5.5);ctx.lineTo(3.2,4);ctx.lineTo(0,2.4);ctx.lineTo(-3.2,4);ctx.closePath();
  ctx.fillStyle=sel?'#fff4dc':'#ffd89b';ctx.fill();
  ctx.restore();
  if(sel){
    ctx.save();ctx.font='600 12px "JetBrains Mono",monospace';ctx.textAlign='center';ctx.textBaseline='bottom';
    const t=s.callsign||'----';const tw=ctx.measureText(t).width;
    ctx.fillStyle='rgba(10,14,26,.85)';ctx.beginPath();ctx.roundRect(x-tw/2-7,y-30,tw+14,18,9);ctx.fill();
    ctx.fillStyle='#ffd89b';ctx.fillText(t,x,y-16);ctx.restore();
  }
}
function hitTest(st,px,py,cx,cy,R){
  let best=null,bd=44;
  for(const s of st.values()){
    if(s.curElev<0)continue;
    const{x,y}=domeProject(s.curAz,s.curElev,cx,cy,R);
    const d=Math.hypot(x-px,y-py);
    if(d<bd){bd=d;best=s.icao;}
  }
  return best;
}

// ===================== 格式化 =====================
function fDist(m,u){if(u==='mi')return(m/1609.34).toFixed(1)+' mi';return m>=1000?(m/1000).toFixed(1)+' km':Math.round(m)+' m';}
function fAlt(m,u){return u==='mi'?Math.round(m/0.3048)+' ft':(m/1000).toFixed(1)+' km';}
function fSpd(ms,u){return u==='mi'?(ms*2.23694).toFixed(0)+' mph':(ms*3.6).toFixed(0)+' km/h';}
function fCountdown(s){if(s<=0)return'即将进入视野';const m=Math.round(s/60);return m<=0?`约 ${Math.round(s)} 秒后`:`约 ${m} 分钟后`;}
function fFresh(t,now){const d=now-t;if(d<10)return'刚刚更新';if(d<60)return`更新于 ${d} 秒前`;return`更新于 ${Math.floor(d/60)} 分钟前`;}
function dirSentence(ac){
  const w=ac.elevation>=75?'几乎在头顶':ac.elevation>=30?'半空中':'接近地平线';
  return`在你的${ac.direction}方，${w}`;
}

        <button class="set-reset" id="btnReset">${ic.reset}<span>重新选择位置</span></button>
        <div class="set-about">
          <h4>${ic.info}<span>关于 SkyWatch</span></h4>
          <p>一个让人抬头看飞机的应用。圆心是你头顶，边缘是地平线。数据有 10–30 秒延迟，已用航迹外推补偿。</p>
          <div class="ver mono">v1.0 · TRAE AI 创造力大赛参赛作品</div>
        </div>
        <div class="preset-grid">
          ${PRESETS.map((p,i)=>`<button data-preset="${i}"><div class="pc">${p.city}</div><div class="pl mono">${p.lat.toFixed(2)}, ${p.lon.toFixed(2)}</div></button>`).join('')}
        </div>
      </div>
    </div>`;
}

// ===================== Canvas 设置与渲染循环 =====================
function setupCanvas(){
  const cv=document.getElementById('skyDome');
  if(!cv)return;
  const wrap=cv.parentElement;
  const ctx=cv.getContext('2d');
  const DPR=window.devicePixelRatio||1;
  const w=wrap.clientWidth;
  const size=Math.max(240,Math.min(w,420));
  canvasSize=size;
  cv.style.width=size+'px';cv.style.height=size+'px';
  cv.width=Math.floor(size*DPR);cv.height=Math.floor(size*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  canvasCtx=ctx;

  cv.onclick=(e)=>{
    const rect=cv.getBoundingClientRect();
    const px=e.clientX-rect.left,py=e.clientY-rect.top;
    const cx=size/2,cy=size/2,R=size/2-22;
    const hit=hitTest(state.interp,px,py,cx,cy,R);
    selectAircraft(hit);
  };

  if(!window._rafStarted){
    window._rafStarted=true;
    rafLoop();
  }
  // ResizeObserver
  if(!window._ro){
    window._ro=new ResizeObserver(()=>{if(state.hasLoc)setupCanvas();});
    window._ro.observe(wrap);
  }
}

function rafLoop(){
  if(canvasCtx&&state.hasLoc){
    const ctx=canvasCtx,size=canvasSize;
    stepInterp(state.interp,performance.now());
    ctx.clearRect(0,0,size,size);
    const cx=size/2,cy=size/2,R=size/2-22;
    drawStatic(ctx,cx,cy,R);
    for(const s of state.interp.values()){
      drawAc(ctx,s,cx,cy,R,s.icao===state.selected);
    }
  }
  requestAnimationFrame(rafLoop);
}

// ===================== 交互处理 =====================
function setObserver(obs,name){
  state.observer=obs;state.locName=name;state.hasLoc=true;
  state.interp=new Map();state.selected=null;
  fetchData();
  render();
}
function selectAircraft(icao){
  state.selected=icao;
  if(icao)state.upcomingOpen=false;
  render();
  // 重新绑定详情/设置事件
  bindOverlayEvents();
}
function bindOverlayEvents(){
  document.querySelectorAll('[data-close]').forEach(el=>el.onclick=()=>{state.selected=null;render();bindOverlayEvents();});
  document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>selectAircraft(b.dataset.up));
  document.getElementById('btnUp')?.addEventListener('click',()=>{state.upcomingOpen=!state.upcomingOpen;render();bindOverlayEvents();});
  document.querySelectorAll('[data-setclose]').forEach(el=>el.onclick=()=>{state.settingsOpen=false;render();bindOverlayEvents();});
  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;fetchData();render();bindOverlayEvents();});
  document.querySelectorAll('[data-radius]').forEach(b=>b.onclick=()=>{state.radius=+b.dataset.radius;fetchData();render();bindOverlayEvents();});
  document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{state.unit=b.dataset.unit;render();bindOverlayEvents();});
  document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{state.notify=!state.notify;render();bindOverlayEvents();});
  document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{const p=PRESETS[+b.dataset.preset];state.settingsOpen=false;setObserver({lat:p.lat,lon:p.lon},p.name);});
  document.getElementById('btnReset')?.addEventListener('click',()=>{state.settingsOpen=false;state.hasLoc=false;state.observer=null;state.interp=new Map();render();});
}

function handleLocate(){
  state._locating=true;render();
  if(!('geolocation'in navigator)){
    state._locating=false;state._denied=true;render();return;
  }
  navigator.geolocation.getCurrentPosition(
    pos=>{state._locating=false;setObserver({lat:pos.coords.latitude,lon:pos.coords.longitude},'我的位置');},
    ()=>{state._locating=false;state._denied=true;render();},
    {enableHighAccuracy:false,timeout:8000,maximumAge:30000}
  );
}

// ===================== 数据拉取 =====================
let fetchTimer=null;
function fetchData(){
  if(!state.observer)return;
  if(fetchTimer)clearInterval(fetchTimer);
  const tick=()=>{
    // 纯前端演示版：只支持 demo 模式（不依赖后端）
    try{
      const raw=getMock(state.observer);
      const now=Math.floor(Date.now()/1000);
      const acs=raw.aircraft.map(a=>enhance(state.observer,a,now))
        .sort((a,b)=>a.distance-b.distance);
      state.visible=acs.filter(a=>a.visible);
      state.upcoming=acs.filter(a=>!a.visible&&a.prediction.isApproaching)
        .sort((a,b)=>a.prediction.secondsToClosest-b.prediction.secondsToClosest);
      state.time=raw.time;state.stale=false;state.error=null;state.loading=false;
      state.interp=updInterp(state.interp,state.visible,performance.now());
      render();bindOverlayEvents();
    }catch(e){state.loading=false;state.error='数据异常';render();bindOverlayEvents();}
  };
  state.loading=state.visible.length===0;
  tick();
  fetchTimer=setInterval(tick,10000);
}

// ===================== 星空 =====================
(function(){
  const box=document.getElementById('stars');
  for(let i=0;i<60;i++){
    const s=document.createElement('span');
    s.style.left=Math.random()*100+'%';
    s.style.top=Math.random()*70+'%';
    const r=Math.random()*1.2+.3;
    s.style.width=r+'px';s.style.height=r+'px';
    s.style.opacity=Math.random()*.5+.15;
    s.style.animationDelay=Math.random()*4+'s';
    box.appendChild(s);
  }
})();

// 兜底：roundRect 兼容
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    this.beginPath();
    this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this;
  };
}

// 启动
render();
</script>
