<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>点点鳄同步学 · 小程序界面预览</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Comic Sans MS','Nunito',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#1d3022;color:#1d3022;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.product-showcase{display:flex;flex-direction:column;align-items:center;gap:16px;max-width:100%}
.product-title{color:#e1eadc;font-size:15px;text-align:center;opacity:0.7;letter-spacing:1px}
.phone-frame{width:375px;height:740px;border-radius:44px;background:#000;padding:12px;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 120px rgba(34,197,94,.08);flex-shrink:0;position:relative;overflow:hidden}
.phone-frame::before{content:'';position:absolute;top:8px;left:50%;transform:translateX(-50%);width:120px;height:28px;border-radius:999px;background:#000;z-index:100}
.phone-inner{width:100%;height:100%;border-radius:36px;overflow:hidden;background:linear-gradient(180deg,#e8f8e0 0%,#f0fce8 40%,#f7fbf3 100%);position:relative;display:flex;flex-direction:column}
.particles-bg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden;}
.particle{position:absolute;border-radius:50%;opacity:0.6;animation:floatParticle 8s infinite ease-in-out;}
@keyframes floatParticle{
  0%,100%{transform:translateY(0) scale(1);opacity:0.6;}
  50%{transform:translateY(-30px) scale(1.2);opacity:0.3;}
}
/* 状态栏 */
.status-bar{height:44px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;flex-shrink:0;background:linear-gradient(90deg,#dcfce7,#ecfdf5,#f0fdf4)}
/* 内容区 - 改进5: 8px间距网格 */
.screen-area{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 16px 16px;-webkit-overflow-scrolling:touch}
.screen-area::-webkit-scrollbar{display:none}
/* === 改进3: 底部 tabBar SVG图标 === */
.tab-bar{display:flex;height:60px;background:#fff;border-top:1px solid #e1eadc;flex-shrink:0}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:#718074;cursor:pointer;transition:color .2s;min-height:44px}
.tab-item.active{color:#22c55e}
.tab-icon-wrap{width:24px;height:24px;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.tab-item.active .tab-icon-wrap{transform:scale(1.1)}
.tab-bar{transition:all .3s ease}
.tab-item{transition:all .2s ease;position:relative}
.tab-item:active{transform:scale(0.92)}
.tab-item.active::after{content:'';position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:20px;height:3px;border-radius:2px;background:#22c55e}
.tab-icon-wrap svg{width:22px;height:22px}
/* 通用卡片 - 改进5: 字号上调 */
.page{display:none}.page.active{display:block}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 4px 16px rgba(40,112,72,.08),0 1px 3px rgba(40,112,72,.06);border:1px solid #e1eadc;overflow:hidden}
/* === 改进2: 卡片左侧色条 === */
.card-typed{border-left:4px solid #22c55e}
.card-title{font-size:19px;font-weight:700;color:#1d3022;margin-bottom:8px}
.card-desc{font-size:14px;color:#718074;line-height:1.6}
.pill{display:inline-flex;align-items:center;gap:4px;background:#fff;border-radius:999px;padding:5px 14px;font-size:13px;color:#718074;border:1px solid #e1eadc;min-height:32px}
.pill b{color:#1d3022}
.status-pills{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.mid-growth{display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:12px;background:#fff;border:1px solid #e1eadc;margin-bottom:12px}
.mg-label{font-size:13px;color:#718074;font-weight:700;white-space:nowrap}
.mg-bar{flex:1;height:10px;border-radius:999px;background:#dcfce7;overflow:hidden}
.mg-bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#22c55e,#86efac,#fbbf24);transition:width .4s}
.mg-hint{font-size:12px;color:#22c55e;font-weight:700;white-space:nowrap}
/* === 改进5: 按钮触控≥44px === */
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
/* === 情绪选择卡片 === */
.mood-grid{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.mood-card{flex:1;min-width:55px;padding:10px 6px;border-radius:18px;background:#f7fbf3;border:2px solid #e1eadc;text-align:center;cursor:pointer;transition:all .2s;min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.mood-card:hover{border-color:#22c55e;background:#dcfce7}
.mood-card.active{background:#dcfce7;border-color:#22c55e;transform:scale(1.05);box-shadow:0 4px 12px rgba(47,138,85,.15)}
.mood-card .mood-icon{font-size:24px;line-height:1}
.mood-card .mood-label{font-size:12px;color:#1d3022;font-weight:700}
.mood-card.active .mood-label{color:#22c55e}
/* === 点点鳄成长展示区 === */
.croc-display{background:#fff;border-radius:16px;padding:20px;margin-bottom:12px;box-shadow:0 4px 16px rgba(40,112,72,.08),0 1px 3px rgba(40,112,72,.06);border:1px solid #e1eadc;text-align:center}
.croc-stage{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#e8f5e0,#d4edca);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;border:3px solid #22c55e;box-shadow:0 8px 24px rgba(47,138,85,.15),inset 0 -4px 8px rgba(47,138,85,.08)}
.croc-stage svg{width:90px;height:90px}
.croc-speech{background:#f7fbf3;border-radius:14px;padding:12px 16px;font-size:14px;color:#1d3022;line-height:1.5;margin-top:10px;border:1px solid #e1eadc;position:relative}
.croc-speech::before{content:'';position:absolute;top:-8px;left:50%;transform:translateX(-50%);border:6px solid transparent;border-bottom-color:#f7fbf3}
.croc-action-btn{margin-top:14px}
/* 鳄鱼思考气泡（头顶浮动图标） */
.croc-thought-bubble{position:absolute;top:-18px;right:-6px;width:44px;height:44px;background:#fff;border-radius:50% 50% 50% 10%;box-shadow:0 4px 12px rgba(47,138,85,.2),0 0 0 2px #22c55e;display:flex;align-items:center;justify-content:center;font-size:22px;animation:thoughtBob 2s ease-in-out infinite;z-index:5}
.croc-thought-bubble::before{content:'';position:absolute;bottom:-6px;left:8px;width:8px;height:8px;background:#fff;border-radius:50%;border:2px solid #22c55e}
.croc-thought-bubble::after{content:'';position:absolute;bottom:-14px;left:4px;width:5px;height:5px;background:#fff;border-radius:50%;border:2px solid #22c55e}
@keyframes thoughtBob{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-6px) rotate(5deg)}}
/* 需求标签 */
.croc-desire-tag{display:inline-flex;align-items:center;gap:4px;background:#dcfce7;border:1px solid #22c55e;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;color:#22c55e;margin-top:4px}
/* 回应按钮组 */
.croc-responses{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.croc-resp-btn{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:14px;background:#f7fbf3;border:2px solid #e1eadc;cursor:pointer;transition:all .2s;text-align:left;min-height:52px}
.croc-resp-btn:hover{border-color:#22c55e;background:#dcfce7;transform:translateX(4px)}
.croc-resp-btn:active{transform:scale(.97)}
.croc-resp-btn .resp-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.croc-resp-btn .resp-text{flex:1}
.croc-resp-btn .resp-label{font-size:15px;font-weight:700;color:#1d3022}
.croc-resp-btn .resp-hint{font-size:12px;color:#718074;margin-top:2px}
.croc-resp-btn.primary{background:linear-gradient(135deg,#dcfce7,#e0f0d8);border-color:#22c55e}
.croc-resp-btn.primary .resp-icon{background:#22c55e;color:#fff}
.croc-resp-btn.secondary .resp-icon{background:#e1eadc;color:#5a6b3e}
/* 需求倒计时条 */
.croc-desire-bar{height:3px;background:#e1eadc;border-radius:2px;margin-top:8px;overflow:hidden}
.croc-desire-bar-fill{height:100%;background:linear-gradient(90deg,#22c55e,#4ade80);border-radius:2px;transition:width .3s}
/* 背包投喂入口 */
.croc-feed-entry{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;background:#fff8e6;border:1.5px dashed #e8c84e;margin-top:10px;cursor:pointer;transition:all .2s;min-height:44px}
.croc-feed-entry:hover{background:#fff0c8;border-color:#d4a830}
.croc-feed-entry:active{transform:scale(.98)}
.croc-feed-entry .feed-entry-icon{font-size:18px}
.croc-feed-entry .feed-entry-text{flex:1;font-size:14px;font-weight:700;color:#8a6d1f}
.croc-feed-entry .feed-entry-count{min-width:24px;height:24px;border-radius:50%;background:#e8c84e;color:#5a4a10;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
/* 背包弹窗 */
.inv-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
.inv-modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:400px;padding:20px 16px 28px;max-height:70vh;overflow-y:auto;animation:slideUp .3s}
.inv-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.inv-title{font-size:18px;font-weight:800;color:#1d3022}
.inv-close{width:32px;height:32px;border-radius:50%;border:none;background:#f0f0f0;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.inv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.inv-item{display:flex;flex-direction:column;align-items:center;padding:12px 8px;border-radius:18px;background:#f7fbf3;border:2px solid #e1eadc;cursor:pointer;transition:all .15s;position:relative}
.inv-item:hover{border-color:#22c55e;background:#dcfce7;transform:translateY(-2px)}
.inv-item:active{transform:scale(.96)}
.inv-item .inv-icon{font-size:32px;margin-bottom:4px}
.inv-item .inv-name{font-size:13px;font-weight:700;color:#1d3022;text-align:center}
.inv-item .inv-satiety{font-size:11px;color:#22c55e;margin-top:2px}
.inv-item .inv-count{position:absolute;top:4px;right:4px;min-width:20px;height:20px;border-radius:50%;background:#22c55e;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.inv-empty{text-align:center;padding:32px 16px;color:#718074;font-size:14px}
.inv-empty-icon{font-size:48px;margin-bottom:8px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.btn-primary{background:linear-gradient(135deg,#4ade80,#22c55e);box-shadow:0 4px 14px rgba(34,197,94,.35),0 1px 3px rgba(0,0,0,.08);color:#fff;border:none;border-radius:999px;padding:12px 24px;font-size:15px;font-weight:700;cursor:pointer;text-align:center;min-height:44px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(34,197,94,.4)}
.btn-primary:active{transform:translateY(0) scale(.97);box-shadow:0 2px 8px rgba(34,197,94,.3)}
.btn-secondary{background:#fff;color:#16a34a;border:2.5px solid #22c55e;border-radius:999px;padding:10px 22px;font-size:15px;font-weight:700;cursor:pointer;text-align:center;min-height:44px;display:flex;align-items:center;justify-content:center}
.btn-ghost{background:transparent;color:#718074;border:none;font-size:13px;cursor:pointer;padding:8px 12px;min-height:36px}
/* === 改进2: 类型标签配色 === */
.mini-tag{display:inline-block;font-size:12px;padding:3px 12px;border-radius:999px;background:#dcfce7;color:#22c55e;font-weight:700;margin-right:4px}
.mini-tag.type-green{background:rgba(47,138,85,.12);color:#22c55e}
.mini-tag.type-orange{background:rgba(240,154,56,.12);color:#d97a1e}
.mini-tag.type-blue{background:rgba(59,130,246,.12);color:#2563eb}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.stat-box{text-align:center;padding:12px 6px;border-radius:12px;background:#dcfce7}
.stat-box .sv{font-size:22px;font-weight:700;color:#22c55e;line-height:1}
.stat-box .sl{font-size:11px;color:#718074;margin-top:4px}
.flow-steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.flow-chip{padding:5px 12px;border-radius:999px;background:#dcfce7;font-size:12px;color:#22c55e;font-weight:700}
.mood-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.mood-btn{flex:1;min-width:90px;padding:14px 10px;border-radius:12px;background:#f7fbf3;border:2px solid #e1eadc;text-align:center;font-size:14px;color:#1d3022;cursor:pointer;min-height:48px;display:flex;align-items:center;justify-content:center}
.mood-btn.active{background:#dcfce7;border-color:#22c55e;color:#22c55e;font-weight:700}
/* === 改进4: 旅程条三态 === */
.journey{display:flex;align-items:center;padding:10px;background:#fff;border-radius:12px;margin-bottom:12px;border:1px solid #e1eadc}
.j-step{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;transition:all .3s}
/* 已完成步骤 */
.j-step.done .j-dot{background:#22c55e;color:#fff}
.j-step.done .j-label{color:#718074;font-size:11px}
/* 当前步骤 - 放大+脉冲 */
.j-step.current .j-dot{background:#22c55e;color:#fff;width:28px;height:28px;box-shadow:0 0 0 4px rgba(47,138,85,.15);animation:pulse 1.5s ease-in-out infinite}
.j-step.current .j-label{color:#22c55e;font-weight:700;font-size:12px}
.j-step.current::after{content:'';position:absolute;bottom:-2px;width:30px;height:3px;border-radius:999px;background:#22c55e}
/* 锁定步骤 */
.j-step.locked{opacity:.4}
.j-step.locked .j-dot{background:#e1eadc;color:#718074}
.j-step.locked .j-label{color:#718074;font-size:11px}
/* 连接线 */
.j-line{flex:0 0 8px;height:2px;background:#e1eadc;margin:0 -2px;margin-top:-16px;transition:background .3s}
.j-line.done{background:#22c55e}
.j-dot{width:22px;height:22px;border-radius:50%;background:#dcfce7;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#718074;transition:all .3s}
.j-label{font-size:11px;color:#718074;transition:all .3s}
/* 卡片翻转 */
.flip-front,.flip-back{display:none}.flip-front.show,.flip-back.show{display:block;animation:fadeIn .3s}
.card-tags{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.card-title-lg{font-size:24px;font-weight:700;color:#1d3022;margin-bottom:10px}
.card-detail{font-size:14px;color:#718074;line-height:1.7}
.card-progress{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding-top:12px;border-top:1px solid #e1eadc}
.progress-text{font-size:13px;color:#718074}
/* 闯关 - 改进5: 触控目标 */
.game-round{display:flex;gap:8px;margin-bottom:12px}
.game-question{font-size:17px;font-weight:700;color:#1d3022;line-height:1.5;margin-bottom:16px}
.snack-grid{display:flex;flex-direction:column;gap:10px}
.option-btn{display:block;width:100%;text-align:left;padding:16px 16px;border-radius:12px;background:#fff;border:2px solid #e1eadc;font-size:16px;color:#1d3022;cursor:pointer;transition:all .2s;min-height:48px}
.option-btn.correct{background:#dcfce7;border-color:#22c55e;color:#15803d}
.option-btn.wrong{background:#fef2f2;border-color:#f87171;color:#dc2626}
.option-btn:disabled{opacity:.7;cursor:default}
.game-feedback{margin-top:16px;padding:14px 16px;border-radius:12px;background:#f7fbf3;border:1px solid #e1eadc;font-size:14px;color:#1d3022;line-height:1.6}
.safety-tip{margin-top:12px;padding:12px 16px;border-radius:12px;background:linear-gradient(135deg,#fef9c3,#fef08a);border-color:#facc15;box-shadow:0 2px 8px rgba(250,204,21,.2);font-size:13px;color:#71572b;font-weight:700;text-align:center;min-height:44px;display:flex;align-items:center;justify-content:center}
/* === 改进1: 吉祥物SVG === */
.croc{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.croc-avatar{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#e8f5e0,#d4edca);display:flex;align-items:center;justify-content:center;flex-shrink:0;border:2px solid #22c55e;box-shadow:0 4px 12px rgba(47,138,85,.12);overflow:visible;position:relative}
.croc-avatar svg{width:44px;height:44px}
.croc-bubble{flex:1;background:#fff;border:1px solid #e1eadc;border-radius:14px;padding:12px 16px;font-size:13px;color:#1d3022;line-height:1.5;position:relative}
.croc-bubble::before{content:'';position:absolute;left:-8px;top:50%;transform:translateY(-50%);border:6px solid transparent;border-right-color:#fff}
/* 弹窗 - 改进5: 字号 */
.modal-mask{position:absolute;inset:0;background:rgba(29,48,34,.5);z-index:200;display:none;align-items:center;justify-content:center;padding:32px}
.modal-mask.show{display:flex}
.modal-box{background:#fff;border-radius:32px;padding:32px 24px;text-align:center;animation:fadeUp .25s;width:100%;max-width:320px;border:3px dashed #86efac;box-shadow:0 8px 32px rgba(34,197,94,.15)}
.modal-box h2{font-size:22px;font-weight:700;margin-bottom:8px;color:#16a34a}
.modal-box>p{font-size:14px;color:#718074;margin-bottom:20px}
.review-stats{display:flex;gap:10px;margin-bottom:20px}
.review-stat{flex:1;padding:16px 8px;border-radius:16px;background:#dcfce7;border:1px solid #e1eadc}
.review-stat b{display:block;font-size:28px;font-weight:700;color:#22c55e;line-height:1;margin-bottom:4px}
.review-stat span{font-size:12px;color:#718074}
.modal-btns{display:flex;gap:10px}
.modal-btns button{flex:1}
/* 补漏 - 改进5: 字号 */
.diagnosis-item{padding:14px 16px;border-radius:16px;background:#f7fbf3;border:1px solid #e1eadc;margin-bottom:8px;cursor:pointer;transition:all .15s}
.diagnosis-item:hover{border-color:#a3c293;background:#f0f8e8}
.diagnosis-item:active{transform:scale(.99)}
.diagnosis-item.expanded{background:#dcfce7;border-color:#22c55e}
.diagnosis-expand{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed #e1eadc;font-size:13px;color:#4a5a3e;line-height:1.6;animation:fadeIn .2s}
.diagnosis-item.expanded .diagnosis-expand{display:block}
.diagnosis-arrow{float:right;font-size:14px;color:#718074;transition:transform .2s}
.diagnosis-item.expanded .diagnosis-arrow{transform:rotate(180deg)}
.diagnosis-label{font-size:12px;color:#718074;display:block;margin-bottom:4px}
.diagnosis-val{font-size:14px;font-weight:700;display:block}
.review-item{display:flex;align-items:center;justify-content:space-between;padding:16px;border-radius:16px;background:#f7fbf3;border:1px solid #e1eadc;margin-bottom:8px;cursor:pointer;min-height:48px;transition:all .15s}
.review-item:hover{border-color:#a3c293;background:#f0f8e8}
.review-item:active{transform:scale(.99)}
.review-item.expanded{background:#dcfce7;border-color:#22c55e}
.review-expand{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed #e1eadc;animation:fadeIn .2s}
.review-item.expanded .review-expand{display:block}
.review-detail-box{background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:8px;font-size:13px;color:#4a5a3e;line-height:1.6}
.review-detail-box b{color:#1d3022}
.review-quiz-btn{margin-top:8px}
.review-title{font-size:15px;font-weight:700}
.review-status{font-size:12px;color:#f09a38;font-weight:700}
/* 成果 */
.outcome-grid{display:flex;gap:10px}
.outcome-box{flex:1;text-align:center;padding:16px 8px;border-radius:16px;background:#dcfce7}
.outcome-val{font-size:24px;font-weight:700;color:#22c55e;display:block;line-height:1.2}
.outcome-label{font-size:11px;color:#718074;display:block;margin-top:4px}
/* 成果可视化 */
.growth-stage{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;margin-bottom:10px;transition:all .2s}
.growth-stage.active{background:#dcfce7;border:1px solid #22c55e}
.growth-stage.inactive{background:#f7fbf3;border:1px solid #e1eadc;opacity:.6}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.weak-tag{font-size:11px;color:#c24a3a;font-weight:700}
.empty{text-align:center;padding:24px;font-size:13px;color:#718074}
/* picker - 改进5: 触控 */

  {title:'李白', desc:'唐代伟大浪漫主义诗人，被誉为"诗仙"', detail:'李白（701-762），字太白，号青莲居士。代表作：《静夜思》《望庐山瀑布》《早发白帝城》《赠汪伦》等。诗风豪放飘逸，想象丰富，是中国文学史上最伟大的诗人之一。', type:'文学常识', skill:'识记', level:'必会'},
  {title:'杜甫', desc:'唐代伟大现实主义诗人，被誉为"诗圣"', detail:'杜甫（712-770），字子美，自号少陵野老。代表作：《春望》《登高》《茅屋为秋风所破歌》《绝句》等。其诗被称为"诗史"，深刻反映社会现实。', type:'文学常识', skill:'识记', level:'必会'},
  {title:'画龙点睛', desc:'比喻在关键处加上精辟之笔', detail:'典故：南朝画家张僧繇在金陵安乐寺画四条白龙，不点眼睛。人说点了眼睛龙会飞走。张僧繇点了两条龙的眼睛，果然雷电交加，两条龙腾空飞去。后比喻在关键处加上精辟的语句使内容更生动。', type:'成语', skill:'理解', level:'必会'},
  {title:'白居易', desc:'唐代现实主义诗人，主张"文章合为时而著"', detail:'白居易（772-846），字乐天，号香山居士。代表作：《赋得古原草送别》《长恨歌》《琵琶行》《忆江南》等。诗风通俗易懂，关心民生疾苦。', type:'文学常识', skill:'识记', level:'拓展'},
  {title:'苏轼', desc:'北宋文学家，诗词书画皆精通', detail:'苏轼（1037-1101），字子瞻，号东坡居士。代表作：《水调歌头》《念奴娇·赤壁怀古》《题西林壁》《饮湖上初晴后雨》等。文学成就极高，为"唐宋八大家"之一。', type:'文学常识', skill:'理解', level:'拓展'},
  {title:'修辞手法', desc:'比喻、拟人、夸张、对偶、反问等', detail:'比喻：用相似事物打比方。拟人：把事物当作人来写。夸张：故意夸大或缩小。对偶：字数相等、结构相同的对称句。反问：用疑问句表达肯定的意思。掌握修辞手法能让我们更好地理解和运用语言。', type:'好词好句', skill:'应用', level:'必会'},
  {title:'王维', desc:'唐代山水田园诗人，被誉为"诗佛"', detail:'王维（701-761），字摩诘。代表作：《九月九日忆山东兄弟》《山居秋暝》《鹿柴》《送元二使安西》等。诗中有画，画中有诗，苏轼评价"诗中有画，画中有诗"。', type:'文学常识', skill:'识记', level:'拓展'},
  {title:'陆游', desc:'南宋爱国诗人，一生主张抗金', detail:'陆游（1125-1210），字务观，号放翁。代表作：《示儿》《游山西村》《冬夜读书示子聿》《钗头凤》等。一生主张抗金，收复中原，至死不忘。', type:'文学常识', skill:'理解', level:'拓展'},
  {title:'常用成语', desc:'中华文化精粹，四字格的智慧结晶', detail:'成语是汉语中长期使用的固定短语，大多出自古代典故或文学作品。掌握成语的正确含义和用法，能大大提升表达能力和文化素养。如：画龙点睛、亡羊补牢、守株待兔、掩耳盗铃等。', type:'成语', skill:'理解', level:'必会'},
  {title:'孟浩然', desc:'唐代山水田园诗人，与王维并称"王孟"', detail:'孟浩然（689-740），代表作：《春晓》《过故人庄》《望洞庭湖赠张丞相》《宿建德江》等。诗风清淡自然，善于描写山水田园风光。', type:'文学常识', skill:'识记', level:'拓展'},
  {title:'杨万里', desc:'南宋诗人，以描写自然景色著称', detail:'杨万里（1127-1206），字廷秀，号诚斋。代表作：《小池》《晓出净慈寺送林子方》《宿新市徐公店》等。语言浅近明白、清新自然，自成"诚斋体"。', type:'文学常识', skill:'识记', level:'拓展'},
  {title:'荀子《劝学》', desc:'先秦思想家，强调学习和积累', detail:'荀子（约前313-前238），名况。代表作《劝学》："学不可以已""青取之于蓝而青于蓝""不积跬步，无以至千里"等名句，强调学习要坚持不懈、日积月累。', type:'文学常识', skill:'理解', level:'拓展'},
  {title:'排比修辞', desc:'结构相似、意思相关的三个以上句子排列', detail:'排比是把结构相同或相似、意思密切相关、语气一致的三个或以上的句子或短语排列起来的修辞手法。作用：增强气势、节奏感强、条理清晰。例："山朗润起来了，水涨起来了，太阳的脸红起来了。"（朱自清《春》）', type:'好词好句', skill:'应用', level:'必会'},
  {title:'《春晓》', desc:'孟浩然代表作，描写春天早晨的景象', detail:'《春晓》："春眠不觉晓，处处闻啼鸟。夜来风雨声，花落知多少。"这首诗通过春晨醒来时的所闻所想，表现了诗人对春天的喜爱和对落花飘零的淡淡惋惜。全诗语言平易自然，却韵味无穷。', type:'好词好句', skill:'理解', level:'必会'},
  {title:'守株待兔', desc:'比喻死守狭隘经验，不知变通', detail:'典故：战国时期宋国有个农夫，看见一只兔子撞在树桩上死了，便放下农具守在树桩旁，希望再得到兔子。结果再也没有兔子来，田地也荒芜了。后比喻死守狭隘经验，不知变通，或妄想不劳而获。', type:'成语', skill:'理解', level:'必会'},

function initParticles(){
  const container = document.querySelector('.phone-inner');
  if(!container) return;
  // 如果已经有粒子背景，先移除
  const old = container.querySelector('.particles-bg');
  if(old) old.remove();

  const bg = document.createElement('div');
  bg.className = 'particles-bg';
  const colors = ['#a8f0a0', '#7ee787', '#86efac', '#bbf7d0', '#ffd54f', '#ffb3ba'];
  for(let i = 0; i < 15; i++){
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 8 + 4;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.left = Math.random() * 100 + '%';
    p.style.top = Math.random() * 100 + '%';
    p.style.animationDelay = Math.random() * 8 + 's';
    p.style.animationDuration = (Math.random() * 4 + 6) + 's';
    bg.appendChild(p);
  }
  container.insertBefore(bg, container.firstChild);
}

// === localStorage 数据持久化 ===
const SAVE_KEY = 'diandiane_data_v1';
const SAVE_EXCLUDE = ['screen','flipped','answered','learnPhase','pkStatus','pkOpponent','pkQuestion','pkTimer','pkMyAnswer','pkOppAnswer','pkResult','pkStarsChange','shopCategory'];

function saveState(){
  const data = {};
  for(const k in S){
    if(SAVE_EXCLUDE.includes(k)) continue;
    if(typeof S[k] === 'function') continue;
    data[k] = S[k];
  }
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(data)); }catch(e){}
}

function loadState(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const data = JSON.parse(raw);
    for(const k in data){
      if(S.hasOwnProperty(k) && !SAVE_EXCLUDE.includes(k)){
        S[k] = data[k];
      }
    }
    // 恢复时间相关计算
    if(data.lastVisitTime){
      const hoursPassed = (Date.now() - data.lastVisitTime) / 3600000;
      if(hoursPassed > 0){
        S.satiety = Math.max(0, Math.round(S.satiety - hoursPassed * 3));
        if(S.satiety < 15) S.crocMood = 'hungry';
        else if(S.satiety < 30) S.crocMood = 'sleepy';
      }
    }
    S.lastVisitTime = Date.now();
    return true;
  }catch(e){ return false; }
}

// 自动保存：在关键数据变更后调用
function autoSave(){
  saveState();
  // 小学生版：显示"已保存"小提示
  const save=document.createElement('div');
  save.textContent='✅ 已保存';
  save.style.cssText='position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:4px 12px;border-radius:10px;z-index:9999;pointer-events:none;opacity:0;transition:opacity .3s';
  document.body.appendChild(save);
  requestAnimationFrame(()=>save.style.opacity='1');
  setTimeout(()=>{save.style.opacity='0';setTimeout(()=>save.remove(),300)},1500);
}

// === 卡通音效引擎 v3（Web Audio API + 动态压缩 + 全局音量 + 自动播放兼容）===
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let masterGain = null;
let compressor = null; // 动态压缩器，防止削波
let crocFilter = null; // 点点鳄专属声线滤波器
let panner3D = null;   // 3D空间音频节点
let audioReady = false; // 音频是否已初始化并可播放

// === 全局音量配置 ===
const VOL = {
  master: 0.75,      // 主音量
  sfx: 0.15,         // 音效默认音量
  sfxClick: 0.06,    // 按钮点击
  sfxSwitch: 0.05,   // 页面切换
  sfxFeed: 0.1,      // 喂食
  sfxPet: 0.07,      // 抚摸
  sfxToast: 0.04,    // 提示消息
  muted: false       // 静音开关
};

function toggleMute(){
  VOL.muted = !VOL.muted;
  if(masterGain) masterGain.gain.value = VOL.muted ? 0 : VOL.master;
  toast(VOL.muted ? '🔇 已静音' : '🔊 声音已开启');
  return VOL.muted;
}

function ensureAudio(){
  if(!audioCtx){
    audioCtx = new AudioCtx();
    // 动态压缩器（防止多音效叠加削波爆音）
    compressor = audioCtx.createDynamicsCompressor();
    compressor.threshold.value = -12;
    compressor.knee.value = 6;
    compressor.ratio.value = 8;
    compressor.attack.value = 0.003;
    compressor.release.value = 0.1;
    compressor.connect(audioCtx.destination);
    // 主音量控制
    masterGain = audioCtx.createGain();
    masterGain.gain.value = VOL.muted ? 0 : VOL.master;
    masterGain.connect(compressor);
    // 点点鳄声线滤波器链
    crocFilter = audioCtx.createBiquadFilter();
    crocFilter.type = 'peaking';
    crocFilter.frequency.value = 2800;
    crocFilter.Q.value = 2;
    crocFilter.gain.value = 3;
    const crocFilter2 = audioCtx.createBiquadFilter();
    crocFilter2.type = 'highshelf';
    crocFilter2.frequency.value = 3500;
    crocFilter2.gain.value = 1.5;
    crocFilter.connect(crocFilter2);
    crocFilter2.connect(masterGain);
    // 3D空间音频
    panner3D = audioCtx.createPanner();
    panner3D.panningModel = 'HRTF';
    panner3D.distanceModel = 'inverse';
    panner3D.refDistance = 1;
    panner3D.maxDistance = 10000;
    panner3D.rolloffFactor = 1;
    panner3D.coneInnerAngle = 360;
    panner3D.coneOuterAngle = 360;
    panner3D.positionX.value = 0;
    panner3D.positionY.value = 0;
    panner3D.positionZ.value = -1;
    panner3D.connect(masterGain);
    audioReady = true;
  }
  if(audioCtx.state === 'suspended'){
    audioCtx.resume().then(()=>{ audioReady = true; });
  }
  return audioReady;
}

// 检测浏览器是否允许自动播放
function canAutoPlay(){
  return audioCtx && audioCtx.state === 'running';
}

// 获取输出节点（普通音效→直达，鳄鱼音效→滤波器链）
function getOutput(useCrocFilter, use3D){
  ensureAudio();
  let node = masterGain;
  if(useCrocFilter) node = crocFilter;
  if(use3D) node = panner3D;
  return node;
}

// === 基础播放函数 ===

function playTone(freq, duration, type, volume, fadeOut, opts){
  ensureAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(Math.min(volume || 0.15, 0.3), audioCtx.currentTime);
  if(fadeOut !== false){
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  }
  const output = (opts && opts.useCrocFilter) ? crocFilter :
                  (opts && opts.use3D) ? panner3D : masterGain;
  osc.connect(gain);
  gain.connect(output);
  osc.start(audioCtx.currentTime);
  osc.stop(audioCtx.currentTime + duration);
}

function playSlide(startFreq, endFreq, duration, type, volume, opts){
  ensureAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(Math.max(endFreq, 1), audioCtx.currentTime + duration);
  gain.gain.setValueAtTime(Math.min(volume || 0.15, 0.3), audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  const output = (opts && opts.useCrocFilter) ? crocFilter :
                  (opts && opts.use3D) ? panner3D : masterGain;
  osc.connect(gain);
  gain.connect(output);
  osc.start(audioCtx.currentTime);
  osc.stop(audioCtx.currentTime + duration);
}

function playChord(freqs, duration, type, opts){
  freqs.forEach((f, i) => {
    setTimeout(() => playTone(f, duration, type, 0.12, true, opts), i * 30);
  });
}

// === 噪音生成器（用于特殊音效） ===
function playNoise(duration, volume, filterFreq, filterType){
  ensureAudio();
  const bufferSize = audioCtx.sampleRate * duration;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1);
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(volume, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  const filter = audioCtx.createBiquadFilter();
  filter.type = filterType || 'bandpass';
  filter.frequency.value = filterFreq || 1000;
  filter.Q.value = 1;
  src.connect(filter);
  filter.connect(gain);
  gain.connect(masterGain);
  src.start();
  src.stop(audioCtx.currentTime + duration);
}

// === 实时音频流：抚摸鳄鱼的"咕噜"声 ===
function playCrocGurgle(baseFreq){
  ensureAudio();
  const osc = audioCtx.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(baseFreq || 120, audioCtx.currentTime);
  // 随机"咕噜"频率变化
  const lfo = audioCtx.createOscillator();
  lfo.frequency.value = 8 + Math.random() * 6;
  const lfoGain = audioCtx.createGain();
  lfoGain.gain.value = 30 + Math.random() * 20;
  lfo.connect(lfoGain);
  lfoGain.connect(osc.frequency);
  lfo.start();
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 400 + Math.random() * 200;
  filter.Q.value = 5;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
  osc.connect(filter);
  filter.connect(gain);
  gain.connect(masterGain);
  osc.start();
  lfo.start();
  osc.stop(audioCtx.currentTime + 0.6);
  lfo.stop(audioCtx.currentTime + 0.6);
}

// === 3D空间音效：移动声源 ===
function moveSoundTo(x, y, z){
  ensureAudio();
  if(panner3D){
    panner3D.positionX.value = x;
    panner3D.positionY.value = y;
    panner3D.positionZ.value = z;
  }
}

// === AI智能错题讲解引擎 ===
function generateAIExplain(questionObj, userIdx){
  const q=questionObj;
  const wrongOpt=q.options[userIdx];
  const correctOpt=q.options[q.answer];

  // 错因分析模板库
  const wrongReasons={
    literary:[
      `"${wrongOpt}"虽然也是一位著名诗人/文人，但题目问的是"${q.question.match(/"([^"]+)"/)?.[1]||'特定称号'}"。要注意区分不同诗人的称号和代表作。`,
      `这道题考查的是文学常识的精准记忆。"${wrongOpt}"和"${correctOpt}"容易混淆，建议用"${correctOpt.substring(0,2)}→${correctOpt.substring(0,2)}"的口诀来记忆。`
    ],
    idiom:[
      `"${wrongOpt}"听起来好像有道理，但成语"${q.question.match(/"([^"]+)"/)?.[1]||'这个成语'}"的真正含义是比喻${correctOpt.includes('关键')?'在关键处加上精辟之笔':correctOpt.includes('补救')?'出了问题及时补救':'某种特定含义'}。不要望文生义哦！`,
      `选"${wrongOpt}"是常见的理解误区。成语故事告诉我们：${q.explain.substring(0,40)}...理解典故才能真正掌握成语。`
    ],
    expression:[
      `这道题考查的是对诗句的深层理解。"${wrongOpt}"是表面意思，而诗人真正想表达的是${correctOpt.includes('精神')?'一种精神品质':correctOpt.includes('哲理')?'一个深刻哲理':'更深层的含义'}。`,
      `选"${wrongOpt}"说明对诗句理解还不够深入。建议多读几遍原诗，体会诗人的情感和思想。`
    ]
  };

  const cat=q.category||'literary';
  const reasons=wrongReasons[cat]||wrongReasons.literary;
  const reason=reasons[Math.floor(Math.random()*reasons.length)];

  // 记忆口诀
  const mnemonics={
    '李白':'李白斗酒诗百篇，号称诗仙飞上天',
    '杜甫':'杜甫忧国忧民苦，诗圣称号要记住',
    '白居易':'白居易，乐天派，文章合为时而著',
    '苏轼':'苏轼东坡词豪放，唐宋八大家中棒',
    '王维':'王维山水诗中画，诗佛称号别忘啦',
    '孟浩然':'孟浩然春眠不觉晓，处处闻啼鸟',
    '杨万里':'杨万里小池诚斋体，清新自然好记忆',
    '陆游':'陆游爱国放翁号，示儿悲歌千古照',
    '画龙点睛':'画龙点睛张僧繇，关键一笔最重要',
    '亡羊补牢':'亡羊补牢为时未晚，出问题要及时补救',
    '掩耳盗铃':'掩耳盗铃自欺人，骗得了自己骗不了别人',
    '对牛弹琴':'对牛弹琴白费心，说话要看对象呀',
    '春风又绿江南岸':'春风又绿江南岸，绿字动词真好看',
    '飞流直下三千尺':'飞流直下三千尺，夸张手法要记住',
    '但愿人长久':'但愿人长久，千里共婵娟，中秋思念记心间',
    '不识庐山真面目':'不识庐山真面目，当局者迷旁观者清'
  };

  // 找相关口诀
  let mnemonic='';
  for(const [key,val] of Object.entries(mnemonics)){
    if(q.question.includes(key)||q.explain.includes(key)){mnemonic=val;break;}
  }
  if(!mnemonic){
    const mns=['读书百遍其义自见，多朗读多记忆','好记性不如烂笔头，记下来反复看','理解了才能记住，先懂后背效果更好'];
    mnemonic=mns[Math.floor(Math.random()*mns.length)];
  }

  // 举一反三：找一道同类别、同难度的相关题目
  const related=games.filter(gm=>gm.category===q.category&&gm.difficulty===q.difficulty&&gm.id!==q.id);
  const similar=related.length>0?related[Math.floor(Math.random()*related.length)]:null;

  // 宠物用自己的语言补充讲解
  const crocExplain={
    literary:'我小时候也分不清这些称号呢！记住"诗仙"是李白，"诗圣"是杜甫就好啦~',
    idiom:'成语故事就像小寓言，每个都藏着大道理！我们一起记住它~',
    expression:'诗句里的每个字都是诗人精心挑选的，细细品味就能感受到美~',
    general:'这道题的答案藏在细节里，下次要仔细看清楚再选哦~'
  };
  const cExplain=crocExplain[cat]||crocExplain.general;

  return {reason,mnemonic,similar,crocNote:cExplain};
}

function logActivity(action, detail){

  const now = new Date();
  const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;

// 每日打卡系统
function doCheckIn(){
  if(S.todayCheckedIn){toast('今天已经打卡了~');return}
  const today=new Date().toISOString().slice(0,10);
  if(!S.checkInDays)S.checkInDays=[];
  S.checkInDays.push(today);
  S.todayCheckedIn=true;
  S.stars+=3;
  checkAchievements();
  logActivity('每日打卡', '获得⭐3颗星星');
  toast('打卡成功！⭐+3 连续'+getCheckInStreak()+'天');
  sfxStar();
  autoSave();
  renderLaunch();
}

function getCheckInStreak(){
  if(!S.checkInDays||S.checkInDays.length===0)return 0;
  let streak=1;
  const sorted=[...S.checkInDays].sort().reverse();
  for(let i=1;i<sorted.length;i++){
    const prev=new Date(sorted[i-1]);
    const curr=new Date(sorted[i]);
    const diff=(prev-curr)/(1000*60*60*24);
    if(diff<=1.5)streak++;
    else break;
  }
  return streak;
}

// 每日重置打卡状态（跨天时）
function checkDailyReset(){
  const today=new Date().toISOString().slice(0,10);
  if(S._lastDate&&S._lastDate!==today){
    S.todayCheckedIn=false;
    // 重置每日数据（可选）
  }
  S._lastDate=today;
  // 根据答题风格初始化宠物性格
  if(!S.crocPersonality.personalityType || S.totalAttempts<5){
    if(S.correctAttempts/(S.totalAttempts||1)>0.8) S.crocPersonality.personalityType='scholar';
    else if(S.weakChars.length>3) S.crocPersonality.personalityType='guardian';
    else S.crocPersonality.personalityType='explorer';
  }
  autoSave();
}

  function renderStep(){

    overlay.innerHTML=`
      <div style="background:#fff;border-radius:24px;padding:28px 24px;width:320px;max-width:90vw;text-align:center;animation:popIn .3s">

        <button class="btn-primary" style="width:100%;min-height:44px;font-size:16px">${stepIdx===steps.length-1?'开始学习吧！':'下一步 →'}</button>

function finishOnboarding(){
  S.onboardingDone=true;

function checkAchievements(){
  if(!S.achievements) S.achievements=[];
  const unlock=(id)=>{
    if(!S.achievements.includes(id)){
      S.achievements.push(id);
      const a=ACHIEVEMENTS[id];
      showAchievementUnlock(a);
      autoSave();
    }
  };
  if(S.correctAttempts>=1) unlock('first_correct');
  if(S.consecutiveCorrect>=3) unlock('streak_3');
  if(S.gameScore>=totalRounds) unlock('all_cleared');
  if(S.learned>=cards.length) unlock('all_cards');
  if(S.stars>=50) unlock('rich_50');
  if(S.correctAttempts>=20) unlock('correct_20');
  if(S.crocLevel>=3) unlock('level_3');
  if(S.crocLevel>=4) unlock('level_4');
  if(S.equippedItems&&(S.equippedItems.hat!=='default_hat'||S.equippedItems.accessory!=='none')) unlock('first_dress');
  if(S.crocMood==='swim') unlock('swim_mood');
  if(S.totalAttempts>=10) unlock('attempt_10');
  // perfect_run: 通关且本次闯关零错误
}

const TEXTBOOK_VERSIONS=[{v:'pep',n:'部编版'},{v:'bs',n:'北师大版'},{v:'su',n:'苏教版'}];
const TEXTBOOK_GRADES=['一上','一下','二上','二下','三上','三下','四上','四下','五上','五下','六上','六下'];
const TEXTBOOK_CHAPTERS=['第一单元','第二单元','第三单元','第四单元','第五单元'];
function getTextbookTag(){
  const ver=TEXTBOOK_VERSIONS.find(t=>t.v===(S.textbookVersion||'pep'))||TEXTBOOK_VERSIONS[0];
  const grade=TEXTBOOK_GRADES[(S.gradeIdx||4)]||'三上';
  const idx=Math.min(Math.floor(S.cardIndex/TEXTBOOK_CHAPTERS.length),TEXTBOOK_CHAPTERS.length-1);
  return {name:ver.n,chapter:TEXTBOOK_CHAPTERS[idx],grade:grade};
}

// 难度自适应：根据连续答对/答错调整难度
function adaptDifficulty(){
  if(S.consecutiveCorrect>=2&&S.currentDifficulty<3){
    S.currentDifficulty++;
    S.consecutiveCorrect=0;
    sfxLevelUp();
    checkAchievements();
    toast('难度提升！⭐'.repeat(S.currentDifficulty)+' 更有挑战啦！');
  }
  if(S.consecutiveWrong>=2&&S.currentDifficulty>1){
    S.currentDifficulty--;
    S.consecutiveWrong=0;
    toast('别担心，换成简单一点的题目~');
  }
  S.maxDifficultyReached=Math.max(S.maxDifficultyReached,S.currentDifficulty);
  autoSave();
}

// 改进选题：避免重复，优先出未做过题
function pickGameForDifficulty(){
  const diff=S.currentDifficulty;
  // 如果有薄弱本题目且连续错过，优先出低一级复习题
  if(S.consecutiveWrong>=1&&S.weakChars.length>0){
    const weak=S.weakChars[S.weakChars.length-1];
    const reviewGame=games.find(g=>g.question.includes(weak.word)&&g.difficulty===Math.max(1,diff-1)&&!S.askedGameIds.includes(g.id));
    if(reviewGame)return{...reviewGame,isReview:true};
  }
  // 从当前难度池中选未出过的题
  const pool=games.filter(g=>g.difficulty===diff&&!S.askedGameIds.includes(g.id));
  if(pool.length>0){
    const pick=pool[Math.floor(Math.random()*pool.length)];
    return{...pick};
  }
  // 当前难度已出完，扩展到相邻难度
  const expanded=games.filter(g=>!S.askedGameIds.includes(g.id)&&Math.abs(g.difficulty-diff)<=1);
  if(expanded.length>0){
    const pick=expanded[Math.floor(Math.random()*expanded.length)];
    return{...pick,fromExpanded:true};
  }
  // 所有题都出过了，重置已出列表
  S.askedGameIds=[];
  const fallback=games.filter(g=>g.difficulty===diff);
  return fallback[Math.floor(Math.random()*fallback.length)]||games[0];
}

// AI动态出题：选项乱序包装器
function getDynamicQuestion(diff){
  S.currentDifficulty = S.currentDifficulty || diff;
  const game = pickGameForDifficulty();
  if(!game) return game;
  // 选项乱序（每次调用重新洗牌）
  const correctText = game.options[game.answer];
  const shuffled = [...game.options];
  for(let i = shuffled.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  game.options = shuffled;
  game.answer = shuffled.indexOf(correctText);
  return game;
}

// AI难度探测：首次进入用2道探测题快速定位
function getProbeQuestion(){
  // 探测题按顺序：第1道中等(diff=2)，根据结果决定第2道
  if(S.diffTestStep===0){
    // 第一道探测题：从中等难度随机选
    const pool = games.filter(g => g.difficulty === 2);
    return pool[Math.floor(Math.random() * pool.length)] || games[0];
  }else{
    // 第二道探测题：根据第一道结果选择
    if(S.consecutiveCorrect>=1){
      const pool = games.filter(g => g.difficulty === 3);
      return pool[Math.floor(Math.random() * pool.length)] || games[0];
    }else{
      const pool = games.filter(g => g.difficulty === 1);
      return pool[Math.floor(Math.random() * pool.length)] || games[0];
    }
  }
}

// 探测结束后确定初始难度
function finalizeDifficulty(){
  if(S.consecutiveCorrect>=2)S.currentDifficulty=3; // 都答对→挑战
  else if(S.consecutiveCorrect>=1)S.currentDifficulty=2; // 答对1道→进阶
  else S.currentDifficulty=1; // 都答错→基础
  S.difficultyTested=true;
  S.maxDifficultyReached=Math.max(S.maxDifficultyReached,S.currentDifficulty);
  const labels={1:'基础',2:'进阶',3:'挑战'};
  toast(`AI测评完成！你的水平是 ${labels[S.currentDifficulty]}，开始闯关吧！`);
  autoSave();
}

// 根据题目找到对应的知识卡片
function findCardForQuestion(game){
  if(!game) return cards[0];
  const kw = game.cardKeyword || '';
  let best = cards[0];
  let bestScore = 0;
  for(const c of cards){
    const score = (c.title.includes(kw) ? 3 : 0) + (c.detail.includes(kw) ? 2 : 0) + (c.desc.includes(kw) ? 1 : 0);
    if(score > bestScore){ bestScore = score; best = c; }
  }
  return best;
}

// 鳄鱼需求系统：根据游戏状态自动决定点点鳄想做什么
function getCrocDesire(){
  if(S.crocDesireId){
    const d=S.crocDesires.find(x=>x.id===S.crocDesireId);
    if(d) return d;
  }
  // 基于饱腹度、学习进度、答题情况自动决定
  let desireId;
  if(S.satiety<30) desireId='hungry';
  else if(S.learned>=5 && S.correct>=3) desireId='swim';
  else if(S.correct>0 && S.correct%3===0) desireId='hug';
  else if(S.satiety>70) desireId='happy';
  else desireId='sleepy';
  S.crocDesireId=desireId;
  S.crocMood=desireId;
  return S.crocDesires.find(x=>x.id===desireId);
}

// === 点击互动粒子特效 === */
const crocReactions=['嗷呜~好舒服！','嘿嘿，再摸摸~','咕噜咕噜~','点点鳄好开心！','呜哇，被戳到了！','嘻嘻嘻~','摸摸头，涨知识！','想吃零食~','点点鳄爱你哦~'];
function petCroc(e,el){
  e.stopPropagation();
  const rect=el.getBoundingClientRect();
  const x=e.clientX-rect.left;
  const y=e.clientY-rect.top;
  // 随机选择特效类型
  const fx=Math.random();
  if(fx<0.4){
    // 爱心飘起
    for(let i=0;i<3;i++){
      const h=document.createElement('span');
      h.className='click-heart';
      h.textContent=['❤','💕','💖','💗'][Math.floor(Math.random()*4)];
      h.style.left=(x+(Math.random()-0.5)*20)+'px';
      h.style.top=(y-10-Math.random()*10)+'px';
      h.style.animationDelay=(i*0.1)+'s';
      el.appendChild(h);
      setTimeout(()=>h.remove(),900);
    }
  } else if(fx<0.7){
    // 星星爆发
    for(let i=0;i<4;i++){
      const s=document.createElement('span');
      s.className='click-star';
      s.textContent='⭐';
      const angle=(i/4)*Math.PI*2;
      s.style.left=(x+Math.cos(angle)*15)+'px';
      s.style.top=(y+Math.sin(angle)*15)+'px';
      s.style.setProperty('--px',Math.cos(angle)*30+'px');
      s.style.setProperty('--py',Math.sin(angle)*30+'px');
      s.style.animationDelay=(i*0.05)+'s';
      el.appendChild(s);
      setTimeout(()=>s.remove(),700);
    }
  } else {
    // 彩色粒子
    const colors=['#4ade80','#fbbf24','#f87171','#60a5fa','#c084fc'];
    for(let i=0;i<6;i++){
      const p=document.createElement('span');
      p.className='click-particle';
      p.style.background=colors[Math.floor(Math.random()*colors.length)];
      const angle=Math.random()*Math.PI*2;
      const dist=15+Math.random()*25;
      p.style.left=x+'px';
      p.style.top=y+'px';
      p.style.setProperty('--px',Math.cos(angle)*dist+'px');
      p.style.setProperty('--py',Math.sin(angle)*dist+'px');
      p.style.width=(4+Math.random()*6)+'px';
      p.style.height=p.style.width;
      el.appendChild(p);
      setTimeout(()=>p.remove(),650);
    }
  }
  // 随机语音
  const reaction=crocReactions[Math.floor(Math.random()*crocReactions.length)];
  toast(reaction);
  sfxPet();
  // 小鳄鱼弹跳
  const body=el.querySelector('.croc-body-group');
  if(body){
    body.style.animation='none';
    body.offsetHeight;
    body.style.animation='crocBounce .4s ease';
    setTimeout(()=>body.style.animation='',500);
  }
}

function formatTimeAgo(timestamp){
  const diff = Date.now() - timestamp;
  const minutes = Math.floor(diff / 60000);
  if(minutes < 1) return '刚刚';
  if(minutes < 60) return `${minutes}分钟前`;
  const hours = Math.floor(minutes / 60);
  if(hours < 24) return `${hours}小时前`;
  return `${Math.floor(hours/24)}天前`;
}

            S.reviewList.push({title:w, status:'待复习', firstWrongTime:wrongItem.firstWrongTime, reviewCount:0});
          }
        }
      }
      adaptDifficulty();
      updateMastery();
      const sp=sa.querySelector('.status-pills');if(sp)sp.innerHTML=topBar();
      const gb=sa.querySelector('.mid-growth');if(gb){gb.outerHTML=growthBar()}
      // 闯关进度条
      const progWrap=document.createElement('div');
      progWrap.style.cssText='text-align:center;margin-top:10px';
      const progLabel=document.createElement('div');
      progLabel.style.cssText='font-size:11px;color:#718074';
      progLabel.textContent='闯关进度';
      progWrap.appendChild(progLabel);
      const progBars=document.createElement('div');
      progBars.style.cssText='display:flex;gap:4px;justify-content:center;margin-top:4px';
      for(let i=0;i<TOTAL_ROUNDS;i++){
        const bar=document.createElement('div');
        bar.style.cssText=`width:24px;height:6px;border-radius:3px;transition:all .3s;background:${i<S.cardIndex?'#22c55e':i===S.cardIndex?'#fbbf24':'#e5e7eb'}`;
        progBars.appendChild(bar);
      }
      progWrap.appendChild(progBars);
      sa.querySelector('.card').appendChild(progWrap);
      // 下一关按钮
      const nextDiv=document.createElement('div');nextDiv.className='btn-row';nextDiv.style.marginTop='8px';
      const nextBtn=document.createElement('button');nextBtn.className='btn-primary';
      if(si===g.answer){
        // 答对→直接下一关
        nextBtn.textContent=isLast?'🏆 查看今日回顾':'➡️ 下一关';
        nextBtn.onclick=()=>{if(isLast){showReview()}else{S.cardIndex++;S.learnPhase='quiz';S.answered=false;renderLearn()}};
      }else{
        // 答错→先看知识卡片
        const cardBtn=document.createElement('button');cardBtn.className='btn-secondary';
        cardBtn.textContent='📖 查看知识卡片';

        sa.appendChild(wc);
      }
    });
    return;

  // ========== 阶段2：知识卡片补充（答错后才展示） ==========

function feedCroc(itemId){
  if(!S.inventory[itemId]||S.inventory[itemId]<=0){
    toast('背包里没有这个食物了');
    return;
  }
  let item=null;
  Object.values(S.shopItems).forEach(cat=>cat.forEach(it=>{if(it.id===itemId)item=it}));
  if(!item||!item.satiety)return;
  // 消耗食物
  S.inventory[itemId]--;
  if(S.inventory[itemId]<=0)delete S.inventory[itemId];
  // 增加饱腹度
  const oldSat=S.satiety;
  S.satiety=Math.min(100,S.satiety+item.satiety);
  const gained=S.satiety-oldSat;
  S.lastFeedTime=Date.now();
  closeInventory();
  toast(`投喂成功！${item.icon} ${item.name} → 饱腹度 +${gained}%`);
  sfxFeed();
  logActivity('投喂食物', `投喂了${item.icon}${item.name}`);

  if(S.satiety>=70){

  if(S.screen==='launch'){

  const sp=sa.querySelector('.status-pills');
  if(sp)sp.innerHTML=topBar();
  autoSave();
}

// 艾宾浩斯遗忘曲线复习间隔（分钟）
const EBBINGHAUS_INTERVALS = [5, 30, 12*60, 24*60, 2*24*60, 4*24*60, 7*24*60, 15*24*60];

function getReviewPriority(item){
  if(!item.firstWrongTime) return 100; // 新错题，最高优先级
  const minutesPassed = (Date.now() - item.firstWrongTime) / 60000;
  const reviewCount = item.reviewCount || 0;
  const nextInterval = EBBINGHAUS_INTERVALS[Math.min(reviewCount, EBBINGHAUS_INTERVALS.length - 1)];
  const overdue = minutesPassed - nextInterval;
  if(overdue > 0) return Math.min(100, overdue / 10); // 越 overdue 优先级越高
  return 0; // 还没到时候
}

function sortReviewList(){
  if(!S.reviewList || S.reviewList.length === 0) return;
  S.reviewList.sort((a, b) => getReviewPriority(b) - getReviewPriority(a));
}

function generateAIAdvice(){
  const wrongCount = S.weakChars.length;
  const totalAttempts = S.totalAttempts || 1;
  const accuracy = Math.round((S.correctAttempts / totalAttempts) * 100);

  let weakPoint = '';
  let nextRecommend = '';

  if(wrongCount === 0){
    weakPoint = '当前表现很棒，暂无薄弱点！';
    nextRecommend = '继续保持，挑战更高难度的题目吧~';
  }else if(accuracy >= 80){
    weakPoint = `偶尔在${S.weakChars[0]?.word?.substring(0,10) || '某些知识点'}上出错`;
    nextRecommend = '巩固基础的同时，尝试挑战进阶题目';
  }else if(accuracy >= 50){
    weakPoint = `${S.weakChars[0]?.word?.substring(0,10) || '文学常识'}掌握不够牢固`;
    nextRecommend = `重点复习"${S.weakChars[0]?.word?.substring(0,8) || '薄弱知识点'}"`;
  }else{
    weakPoint = '基础知识点需要加强，别灰心！';
    nextRecommend = '从简单的题目开始，一步一步来~';
  }

  return {weakPoint, nextRecommend};
}

  sa.querySelectorAll('.diagnosis-item').forEach(item=>{

      e.stopPropagation();
      item.classList.toggle('expanded');

  sa.querySelectorAll('.review-item').forEach(item=>{

// 构建复习知识点详情
function buildReviewDetail(title){
  // 尝试匹配知识卡片
  const matchedCards=cards.filter(c=>title.includes(c.title)||c.title.includes(title.split(/[：:，,]/)[0]));
  // 尝试匹配题库中的相关题目
  const matchedGames=games.filter(g=>{
    const t=title.toLowerCase();
    return g.question.includes(title.split(/[：:，,]/)[0])||title.includes('诗仙')&&g.question.includes('李白')||title.includes('诗圣')&&g.question.includes('杜甫')||title.includes('画龙')&&g.question.includes('画龙点睛');
  });
  let html='';
  if(matchedCards.length>0){
    html+=`<div class="review-detail-box"><b>📖 知识点解析：</b><br>${matchedCards[0].detail}</div>`;
  }
  if(matchedGames.length>0){
    html+=`<div class="review-detail-box"><b>📝 相关题目：</b><br>Q: ${matchedGames[0].question}<br>A: ${matchedGames[0].options[matchedGames[0].answer]}<br><span style="color:#718074;font-size:12px">${matchedGames[0].explain}</span></div>`;
  }
  if(!html){
    html=`<div class="review-detail-box"><b>📌 复习建议：</b><br>这个知识点还没有对应的知识卡片。建议：<br>· 去学习板块学习相关知识卡片<br>· 做一道复习题检验掌握程度<br>· 扫一扫录入更多相关易错点</div>`;
  }
  return html;
}

// 开始复习题
function startReviewQuiz(title){
  // 匹配相关题目
  let quiz=games.find(g=>title.includes('诗仙')&&g.question.includes('李白'))
    ||games.find(g=>title.includes('诗圣')&&g.question.includes('杜甫'))
    ||games.find(g=>title.includes('画龙')&&g.question.includes('画龙点睛'))
    ||games.find(g=>g.question.includes(title.split(/[：:，,]/)[0]))
    ||games[Math.floor(Math.random()*games.length)];
  // 弹出复习题
  const overlay=document.createElement('div');
  overlay.className='scan-modal';overlay.id='reviewQuizModal';
  overlay.innerHTML=`
    <div class="scan-modal-box">
      <h3>📝 复习题</h3>
      <div style="font-size:15px;font-weight:700;color:#1d3022;margin-bottom:12px;line-height:1.5">${quiz.question}</div>
      <div class="snack-grid" id="quizOptions">
        ${quiz.options.map((o,i)=>`<button class="option-btn" data-si="${i}">${o}</button>`).join('')}
      </div>
      <div class="game-feedback" id="quizFeedback" style="margin-top:10px">选一个答案吧~</div>
      <div class="scan-actions">
        <button class="btn-secondary" style="flex:1;min-height:40px" onclick="closeReviewQuiz()">关闭</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.onclick=(e)=>{if(e.target===overlay)closeReviewQuiz()};
  overlay.querySelectorAll('[data-si]').forEach(btn=>{
    btn.onclick=()=>{
      const si=+btn.dataset.si;
      overlay.querySelectorAll('[data-si]').forEach(b=>b.disabled=true);
      if(si===quiz.answer){
        overlay.querySelectorAll('[data-si]').forEach((b,j)=>{if(j===quiz.answer)b.classList.add('correct')});
        $('#quizFeedback').textContent=`✅ 答对了！${quiz.explain} 星星 +2！`;
        S.stars+=2;
        addStars(0);
        // 更新复习状态
        const rIdx=S.reviewList.findIndex(r=>r.title===title);
        if(rIdx>=0)S.reviewList[rIdx].status='已掌握';
        toast('复习成功！星星 +2');
      }else{
        overlay.querySelectorAll('[data-si]').forEach((b,j)=>{if(j===si)b.classList.add('wrong');if(j===quiz.answer)b.classList.add('correct')});
        $('#quizFeedback').textContent=`❌ 答错了~ 正确答案是：${quiz.options[quiz.answer]}。${quiz.explain}`;
      }
    };
  });
}
function closeReviewQuiz(){
  const o=$('#reviewQuizModal');if(o)o.remove();
  renderReview(); // 刷新页面（更新复习状态）
}

// AI知识分类汇总
function buildKnowledgeSummary(){
  const catInfo={
    literary:{name:'📚 文学常识',css:'literary',badge:'识记类',badgeBg:'#dbeafe',badgeColor:'#1d4ed8'},
    idiom:{name:'📖 成语典故',css:'idiom',badge:'理解类',badgeBg:'#fef3c7',badgeColor:'#92400e'},
    expression:{name:'✍️ 表达应用',css:'expression',badge:'应用类',badgeBg:'#fee2e2',badgeColor:'#991b1b'},
    general:{name:'📝 其他薄弱',css:'general',badge:'综合类',badgeBg:'#dcfce7',badgeColor:'#166534'}
  };
  // 合并扫描录入 + 闯关错题 + 卡片知识到各分类
  const merged={literary:[],idiom:[],expression:[],general:[]};
  // 扫描录入的易错点
  S.scanItems.forEach(item=>{
    if(merged[item.type])merged[item.type].push({text:item.text,source:item.source==='scan'?'📷扫码':'✍️手动'});
  });
  // 闯关错题自动归类
  const keywordsMap={literary:['李白','杜甫','屈原','诗人','诗仙','诗圣'],idiom:['画龙点睛','亡羊','守株'],expression:['春风','绿','拂过','比喻','拟人']};
  S.weakChars.forEach(w=>{
    let placed=false;
    for(const[cat,kws]of Object.entries(keywordsMap)){
      if(kws.some(k=>w.word.includes(k))){merged[cat].push({text:w.word,source:'闯关错题'});placed=true;break}
    }
    if(!placed)merged.general.push({text:w.word,source:'闯关错题'});
  });
  // 卡片知识也纳入汇总
  cards.forEach(c=>{
    const typeMap={'文学常识':'literary','成语':'idiom','好词好句':'expression'};
    const cat=typeMap[c.type]||'general';
    if(merged[cat]&&!merged[cat].some(item=>item.text.includes(c.title))){
      merged[cat].push({text:c.title,source:'知识卡片'});
    }
  });

  // 渲染分类卡片（只显示有内容的分类）
  let html='';
  for(const[catKey,items]of Object.entries(merged)){
    if(items.length===0)continue;
    const info=catInfo[catKey];
    const scanCount=items.filter(i=>i.source.includes('扫码')).length;
    const gameCount=items.filter(i=>i.source.includes('闯关')).length;
    const cardCount=items.filter(i=>i.source.includes('卡片')).length;
    html+=`<div class="summary-card ${info.css}">
      <div class="summary-header">
        <div class="summary-title">${info.name}</div>
        <span class="summary-badge" style="background:${info.badgeBg};color:${info.badgeColor}">${info.badge}</span>
      </div>
      <div class="summary-items">${items.map(item=>`<span class="summary-tag" title="${item.source}">${item.text}</span>`).join('')}</div>
      <div class="summary-scan-count">共${items.length}项 ${scanCount?'· 扫码'+scanCount+'项 ':''}${gameCount?'· 错题'+gameCount+'项 ':''}${cardCount?'· 卡片'+cardCount+'项 ':''}</div>
    </div>`;
  }
  return html||'<div class="card"><div class="empty">暂无录入数据，快去扫一扫录入易错点吧！</div></div>';
}

// 保存录入的易错点
function saveScanItem(){
  const input=$('#scanInput');
  const activeChip=document.querySelector('.scan-type-chip.active');
  if(!input||!input.value.trim()){toast('请输入易错知识点');return}
  if(!activeChip){toast('请选择分类');return}
  const text=input.value.trim();
  const type=activeChip.dataset.type;
  // 支持多条录入（按行分割）
  const lines=text.split('\n').map(l=>l.replace(/^[-·•]\s*/,'').trim()).filter(l=>l.length>0);
  lines.forEach(line=>{
    const id='s'+Date.now()+'_'+Math.random().toString(36).substr(2,4);
    S.scanItems.push({id,text:line,type,source:'scan',time:'07-12'});
    // 同步到薄弱本（如果还没收录）
    if(!S.weakChars.some(w=>w.word===line)){
      S.weakChars.push({word:line,tag:'扫码录入'});
    }
    // 同步到待复习列表
    if(!S.reviewList.some(r=>r.title.includes(line))){
      S.reviewList.push({title:line,status:'待复习'});
    }
  });
  closeScanModal();
  toast(`已录入${lines.length}个易错点！`);
  renderReview();
  autoSave();
}

// SVG柱状图：闯关记录
function buildQuizBarChart(){
  // 模拟5关的闯关数据（基于实际状态推断）
  const totalRounds=5;
  const passedRounds=S.gameScore;
  const wrongRounds=Math.min(S.totalAttempts-passedRounds,totalRounds-passedRounds);
  const pendingRounds=totalRounds-passedRounds-wrongRounds;
  const barData=[
    {label:'第1关',correct:S.gameScore>=1,wrong:S.gameScore<1&&S.totalAttempts>0,pending:S.totalAttempts===0},
    {label:'第2关',correct:S.gameScore>=2,wrong:S.gameScore===1&&S.totalAttempts>1,pending:S.gameScore<1},
    {label:'第3关',correct:S.gameScore>=3,wrong:S.gameScore===2&&S.totalAttempts>2,pending:S.gameScore<2},
    {label:'第4关',correct:S.gameScore>=4,wrong:S.gameScore===3&&S.totalAttempts>3,pending:S.gameScore<3},
    {label:'第5关',correct:S.gameScore>=5,wrong:false,pending:S.gameScore<4}
  ];
  // 根据实际答题难度标记
  if(S.gameScore>0){
    barData.forEach((b,i)=>{
      if(b.correct)b.difficulty=S.currentDifficulty;
    });
  }
  let html='<div class="quiz-chart">';
  html+=`<div style="font-size:14px;font-weight:700;color:#1d3022;margin-bottom:12px">📊 闯关进度（共${totalRounds}关）</div>`;
  barData.forEach(b=>{
    const cls=b.correct?'correct':b.wrong?'wrong':'pending';
    const w=b.correct?100:b.wrong?60:15;
    const label=b.correct?'✅ 通过':b.wrong?'❌ 答错':'⏳ 待闯';
    const valueLabel=b.correct?'100%':b.wrong?'60%':'15%';
    html+=`<div class="quiz-bar-row">
      <div class="quiz-bar-label">${b.label}</div>
      <div class="quiz-bar-track"><div class="quiz-bar-fill ${cls}" style="width:${w}%" title="${valueLabel} ${label}">${label}</div><span style="margin-left:6px;font-size:11px;color:#718074;font-weight:700;align-self:center">${valueLabel}</span></div>
    </div>`;
  });
  const passRate=totalRounds>0?Math.round(passedRounds/totalRounds*100):0;
  html+=`<div style="display:flex;justify-content:space-between;margin-top:10px;font-size:12px;color:#718074">
    <span>通过 ${passedRounds}/${totalRounds}</span><span>正确率 ${passRate}%</span></div>`;
  html+='</div>';
  return html;
}

// 知识点关联图谱（SVG节点+连线）
function buildKnowledgeGraph(){
  const categories=[
    {id:'literary',name:'文学常识',color:'#3b82f6',bg:'#dbeafe',cards:['李白','杜甫','白居易','苏轼','王维','陆游','孟浩然','杨万里','荀子《劝学》']},
    {id:'idiom',name:'成语典故',color:'#f59e0b',bg:'#fef3c7',cards:['画龙点睛','常用成语','守株待兔']},
    {id:'expression',name:'表达应用',color:'#ef4444',bg:'#fee2e2',cards:['修辞手法','排比修辞','《春晓》']}
  ];
  // 判断每张卡片是否已学习
  const learnedCards=(S.shownCardIds||[]);
  const totalW=Math.min(360,350);
  const svgH=180;
  let svgContent=`<svg viewBox="0 0 ${totalW} ${svgH}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto">`;
  // 三个节点圆
  const cx=[totalW*0.2,totalW*0.5,totalW*0.8];
  const cy=svgH*0.4;
  const r=32;
  // 连线（先画线再画圆）
  svgContent+=`<line x1="${cx[0]+r}" y1="${cy}" x2="${cx[1]-r}" y2="${cy}" stroke="#d1d5db" stroke-width="2" stroke-dasharray="6 4"/>`;
  svgContent+=`<line x1="${cx[1]+r}" y1="${cy}" x2="${cx[2]-r}" y2="${cy}" stroke="#d1d5db" stroke-width="2" stroke-dasharray="6 4"/>`;
  // 节点
  categories.forEach((cat,i)=>{
    const learnedCount=cat.cards.filter(c=>learnedCards.includes(c)||S.learned>cards.findIndex(cd=>cd.title===c)).length;
    const progress=Math.min(1,learnedCount/cat.cards.length);
    svgContent+=`<circle cx="${cx[i]}" cy="${cy}" r="${r}" fill="${cat.bg}" stroke="${cat.color}" stroke-width="3"/>`;
    svgContent+=`<circle cx="${cx[i]}" cy="${cy}" r="${r}" fill="none" stroke="${cat.color}" stroke-width="3" stroke-dasharray="${2*Math.PI*r*progress} ${2*Math.PI*r}" transform="rotate(-90 ${cx[i]} ${cy})" stroke-linecap="round"/>`;
    svgContent+=`<text x="${cx[i]}" y="${cy-4}" text-anchor="middle" font-size="11" font-weight="800" fill="${cat.color}">${learnedCount}/${cat.cards.length}</text>`;
    svgContent+=`<text x="${cx[i]}" y="${cy+10}" text-anchor="middle" font-size="9" fill="${cat.color}">${cat.name}</text>`;
    // 下方卡片标签
    cat.cards.forEach((c,j)=>{
      const isLearned=learnedCards.includes(c)||S.learned>cards.findIndex(cd=>cd.title===c);
      const tx=cx[i]-((cat.cards.length-1)*12)+j*24;
      const ty=cy+r+20;
      svgContent+=`<rect x="${tx-10}" y="${ty-8}" width="20" height="16" rx="4" fill="${isLearned?cat.color:'#e5e7eb'}" opacity="${isLearned?1:0.5}"/>`;
      svgContent+=`<text x="${tx}" y="${ty+3}" text-anchor="middle" font-size="7" fill="#fff" font-weight="700">${c.substring(0,2)}</text>`;
    });
  });
  svgContent+=`</svg>`;
  return svgContent;
}

function buildHeatmap(){

// SVG饼图：难度分布
function buildDiffPieChart(){
  const total=S.totalAttempts||1;
  const correct=S.correctAttempts||0;
  // 按难度统计（基于已答题目数量估算）
  const easyCount=Math.min(correct,Math.floor(correct*0.4));
  const midCount=Math.min(correct-easyCount,Math.floor(correct*0.35));
  const hardCount=Math.max(0,correct-easyCount-midCount);
  const wrongCount=Math.max(0,S.totalAttempts-S.correctAttempts);
  const data=[
    {label:'⭐ 基础',value:easyCount,color:'#22c55e'},
    {label:'⭐⭐ 进阶',value:midCount,color:'#f59e0b'},
    {label:'⭐⭐⭐ 挑战',value:hardCount,color:'#ef4444'},
    {label:'❌ 答错',value:wrongCount,color:'#d1d5db'}
  ].filter(d=>d.value>0);
  if(data.length===0)data.push({label:'暂无数据',value:1,color:'#e1eadc'});
  const sum=data.reduce((a,d)=>a+d.value,0);
  let cumAngle=0;
  const cx=50,cy=50,r=38;
  let paths='';
  data.forEach(d=>{
    const angle=(d.value/sum)*360;
    const startAngle=cumAngle-90;
    const endAngle=cumAngle+angle-90;
    const rad=s=>s*Math.PI/180;
    const x1=cx+r*Math.cos(rad(startAngle));
    const y1=cy+r*Math.sin(rad(startAngle));
    const x2=cx+r*Math.cos(rad(endAngle));
    const y2=cy+r*Math.sin(rad(endAngle));
    const largeArc=angle>180?1:0;
    if(angle>=360){paths+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${d.color}" stroke="#fff" stroke-width="1.5"/>`}
    else{paths+=`<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${largeArc},1 ${x2},${y2} Z" fill="${d.color}" stroke="#fff" stroke-width="1.5"/>`}
    cumAngle+=angle;
  });
  let legendHtml=data.map(d=>`<div class="diff-legend-item"><div class="diff-legend-dot" style="background:${d.color}"></div>${d.label} ${d.value}题 (${Math.round(d.value/sum*100)}%)</div>`).join('');
  return `<div class="diff-pie-wrap">
    <svg class="diff-pie-svg" viewBox="0 0 100 100" width="100" height="100">${paths}<circle cx="${cx}" cy="${cy}" r="20" fill="#fff"/></svg>
    <div class="diff-legend">${legendHtml}</div>
  </div>`;
}

// SVG雷达图：能力维度
function buildSkillRadar(){
  const skills=[
    {name:'识记',val:S.correct>0?Math.min(100,S.correct*30):0},
    {name:'理解',val:S.gameScore>1?Math.min(100,S.gameScore*25):0},
    {name:'应用',val:S.gameScore>3?Math.min(100,(S.gameScore-2)*30):0},
    {name:'坚持',val:S.totalAttempts>0?Math.min(100,S.totalAttempts*15):0}
  ];
  const cx=100,cy=100,r=70;
  const n=skills.length;
  let gridLines='';
  let axisLines='';
  let polygonPoints='';
  let labelPoints='';
  for(let ring=1;ring<=4;ring++){
    const rr=r*(ring/4);
    let pts='';
    for(let i=0;i<n;i++){
      const angle=(Math.PI*2*i/n)-Math.PI/2;
      const x=cx+rr*Math.cos(angle);
      const y=cy+rr*Math.sin(angle);
      pts+=`${x},${y} `;
    }
    gridLines+=`<polygon points="${pts.trim()}" fill="none" stroke="#e1eadc" stroke-width="1"/>`;
  }
  let vertexDots='';
  for(let i=0;i<n;i++){
    const angle=(Math.PI*2*i/n)-Math.PI/2;
    axisLines+=`<line x1="${cx}" y1="${cy}" x2="${cx+r*Math.cos(angle)}" y2="${cy+r*Math.sin(angle)}" stroke="#e1eadc" stroke-width="1"/>`;
    const val=Math.max(5,skills[i].val);
    const vr=r*(val/100);
    polygonPoints+=`${cx+vr*Math.cos(angle)},${cy+vr*Math.sin(angle)} `;
    vertexDots+=`<circle cx="${cx+vr*Math.cos(angle)}" cy="${cy+vr*Math.sin(angle)}" r="3" fill="#22c55e" stroke="#fff" stroke-width="1.5"/>`;
    const lr=r+18;
    labelPoints+=`<text x="${cx+lr*Math.cos(angle)}" y="${cy+lr*Math.sin(angle)}" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="700" fill="#4a5a3e">${skills[i].name}</text>`;
  }
  return `<div class="skill-radar-wrap">
    <svg class="skill-radar-svg" viewBox="0 0 200 200" width="200" height="200">
      ${gridLines}${axisLines}
      <polygon points="${polygonPoints.trim()}" fill="rgba(47,138,85,.2)" stroke="#2f8a55" stroke-width="2"/>
      ${vertexDots}${labelPoints}
    </svg>
    <div style="font-size:12px;color:#718074;margin-top:6px">能力维度评估</div>
  </div>`;
}

    {name:'遗忘魔王',icon:'👹',desc:'专门考你记不住的知识',color:'#dc2626',weakCat:'idiom'},
    {name:'偷换概念怪',icon:'🦊',desc:'把正确答案伪装成错误选项',color:'#ea580c',weakCat:'expression'},
    {name:'知识黑洞',icon:'🌀',desc:'吞噬你所有不熟练的知识点',color:'#0891b2',weakCat:'general'}
  ];
  const weakness=S.weakChars&&S.weakChars.length>0?bossTypes.find(b=>b.weakCat===S.weakPoint)||bossTypes[0]:bossTypes[0];
  const bossLevel=Math.min(Math.floor(S.totalAttempts/20)+1,5);
  const boss=bossTypes[Math.floor(Math.random()*bossTypes.length)];
  boss.level=bossLevel;
  // Boss战：5轮，每轮一题，全部答对才算赢
  S.bossBattle={boss,round:1,maxRounds:5,score:0,bossScore:0,questions:[]};
  // 从题库中筛选Boss擅长类型的题目
  const relevantGames=games.filter(g=>!g.category||g.category===boss.weakCat||true).sort(()=>Math.random()-.5).slice(0,5);
  S.bossBattle.questions=relevantGames.map(g=>({
    ...g,
    // Boss变形：打乱选项顺序制造迷惑
    options:[...g.options].sort(()=>Math.random()-.5),
    // 重新计算变形后的answer
    answer:g.options.indexOf(g.options[g.answer])
  }));
  // Boss入场动画
  sa.innerHTML=`
    ${topBar()}${growthBar()}
    <div class="boss-entrance" style="text-align:center;padding:60px 20px;background:linear-gradient(180deg,#1e1b4b,#312e81);border-radius:20px;margin-bottom:12px;animation:bossShake .5s ease-in-out 3">
      <div style="font-size:64px;animation:bossPulse 1s ease-in-out infinite">${boss.icon}</div>
      <div style="font-size:22px;font-weight:900;color:#e0e7ff;margin-top:12px">${boss.name} Lv.${bossLevel}</div>
      <div style="font-size:13px;color:#a5b4fc;margin-top:6px">${boss.desc}</div>
      <div style="margin-top:16px;padding:10px 16px;background:rgba(0,0,0,.3);border-radius:12px">
        <div style="font-size:12px;color:#fbbf24">⚔️ 挑战规则</div>
        <div style="font-size:11px;color:#c4b5fd;margin-top:4px">共${S.bossBattle.maxRounds}轮，每轮一道变形题<br>全部答对 = Boss被击败！赢得⭐15</div>
      </div>
    </div>
    <div style="text-align:center;margin-bottom:12px">
      <button class="btn-primary" style="width:70%;min-height:50px;font-size:16px;background:linear-gradient(135deg,#6366f1,#7c3aed);border:none;box-shadow:0 4px 20px rgba(124,58,237,.5)" onclick="renderBossRound()">🚀 开始挑战</button>
    </div>`;
  // 添加Boss动画CSS（一次性）
  if(!document.getElementById('bossCSS')){
    const style=document.createElement('style');
    style.id='bossCSS';
    style.textContent=`@keyframes bossShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@keyframes bossPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}@keyframes bossHit{0%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.5}100%{transform:scale(1);opacity:1}}@keyframes bossDefeat{0%{transform:scale(1) rotate(0)}50%{transform:scale(.5) rotate(20deg)}100%{transform:scale(0) rotate(45deg);opacity:0}}`;
    document.head.appendChild(style);
  }
}

function submitBossAnswer(idx,g){
  const sa=$('#screenArea');
  sa.querySelectorAll('[data-boss]').forEach(btn=>{btn.disabled=true});
  const correct=idx===g.answer;
  const fb=$('#bossFeedback');
  sa.querySelectorAll('[data-boss]').forEach((btn,j)=>{if(j===idx)btn.classList.add(correct?'correct':'wrong');if(j===g.answer&&idx!==g.answer)btn.classList.add('correct')});
  const bossIcon=$('#bossIcon');
  if(correct){
    S.bossBattle.score++;
    fb.innerHTML='<span style="color:#22c55e">✅ 击中Boss！</span> Boss受到伤害！';
    if(bossIcon)bossIcon.style.animation='bossHit .4s ease';
    sfxCorrect();
  }else{
    S.bossBattle.bossScore++;
    fb.innerHTML='<span style="color:#ef4444">❌ Boss反击成功！</span> 这道变形题迷惑了你';
    if(bossIcon)bossIcon.style.animation='bossShake .3s ease 2';
    sfxWrong();
  }
  setTimeout(()=>{S.bossBattle.round++;renderBossRound()},1500);
}
function finalizeBossBattle(){
  const sa=$('#screenArea');
  const bb=S.bossBattle;
  const victory=bb.score>=Math.ceil(bb.maxRounds/2); // 小学生版：答对一半就算赢！
  if(victory){
    S.stars+=15;S.pkTotalWins++;S.totalAttempts+=bb.maxRounds;S.correctAttempts+=bb.score;
    S.bossBattle.boss.defeated=true;
    logActivity('Boss战胜利','击败了'+bb.boss.name+' Lv.'+bb.boss.level);
    toast('🎉 Boss被击败！获得⭐15');

  }else{
    S.pkTotalLosses++;S.totalAttempts+=bb.maxRounds;S.correctAttempts+=bb.score;
    logActivity('Boss战失败','败给了'+bb.boss.name+'，答对'+bb.score+'/'+bb.maxRounds);
    toast('😢 Boss战败北，下次再来！');
    sfxWrong();
  }

function startPKMatch(mode){

      <div class="pk-match-text">${matchText}</div>

    S.pkOpponent={name:names[idx],avatar:avatars[idx],level:Math.floor(Math.random()*3)+1,answerSpeed:Math.floor(Math.random()*5)+3};
    S.pkStatus='playing';
    S.pkMyAnswer=-1;S.pkOppAnswer=-1;
    S.pkQuestion=games[Math.floor(Math.random()*games.length)];
    S.pkTimer=10;

}

// PK倒计时
let pkTimerId=null;
function startPKCountdown(){
  sfxPKCountdown();
  if(pkTimerId)clearInterval(pkTimerId);
  pkTimerId=setInterval(()=>{
    S.pkTimer--;
    const t=$('#pkTimer');
    if(t)t.textContent=S.pkTimer;
    if(S.pkTimer<=0){
      clearInterval(pkTimerId);pkTimerId=null;
      // 时间到，判断胜负
      if(S.pkMyAnswer===-1)S.pkMyAnswer=-2; // 超时标记
      finalizePK();
    }
  },1000);
}

// 提交PK答案
function submitPKAnswer(idx){
  if(S.pkMyAnswer!==-1)return; // 已经答过了
  S.pkMyAnswer=idx;
  // 禁用所有按钮
  const sa=$('#screenArea');
  sa.querySelectorAll('[data-pk]').forEach(btn=>{btn.disabled=true});
  // 高亮我的选择
  sa.querySelectorAll('[data-pk]').forEach((btn,j)=>{if(j===idx)btn.classList.add(idx===S.pkQuestion.answer?'correct':'wrong')});
  $('#pkFeedback').textContent='已提交！等待对手...';
  // 模拟对手答题（根据对手速度）
  const oppDelay=S.pkOpponent.answerSpeed*1000;
  setTimeout(()=>{
    // 对手随机答对或答错（60%概率答对）
    const oppCorrect=Math.random()<0.6;
    S.pkOppAnswer=oppCorrect?S.pkQuestion.answer:Math.floor(Math.random()*4);
    finalizePK();
  },oppDelay);
  autoSave();
}

// 判定PK结果
function finalizePK(){
  if(pkTimerId){clearInterval(pkTimerId);pkTimerId=null}
  const g=S.pkQuestion;
  const myCorrect=S.pkMyAnswer===g.answer;
  const oppCorrect=S.pkOppAnswer===g.answer;
  let result,starsChange=0;
  if(myCorrect&&(!oppCorrect||S.pkMyAnswer!==-2)){
    result='win';starsChange=5;S.pkTotalWins++;
    S.stars+=5;S.growth=Math.min(100,S.growth+5);
  }else if(!myCorrect&&oppCorrect){
    result='lose';starsChange=-3;S.pkTotalLosses++;
    S.stars=Math.max(0,S.stars-3);
  }else if(myCorrect&&oppCorrect){
    result='draw';starsChange=2;S.pkTotalWins++;
    S.stars+=2;
  }else{
    result='lose';starsChange=-2;S.pkTotalLosses++;
    S.stars=Math.max(0,S.stars-2);
  }
  S.pkResult=result;S.pkStarsChange=starsChange;
  S.pkHistory.push(starsChange);
  addStars(0); // 刷新顶部栏
  if(result==='win') sfxPKWin();
  else if(result==='lose') sfxPKLose();
  else sfxClick();
  renderPKResult();
}

// === 成果分享功能 ===
function shareReport(){
  const canvas = document.createElement('canvas');
  const W = 750, H = 1334; // 手机海报尺寸
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');
  
  // 背景渐变
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#e8f8e0');
  grad.addColorStop(0.5, '#f0fce8');
  grad.addColorStop(1, '#dcfce7');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  
  // 标题
  ctx.fillStyle = '#166534';
  ctx.font = 'bold 42px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('🐊 点点鳄同步学', W/2, 100);
  ctx.font = '28px sans-serif';
  ctx.fillStyle = '#22c55e';
  ctx.fillText('今日学习报告', W/2, 155);
  
  // 日期
  ctx.font = '24px sans-serif';
  ctx.fillStyle = '#666';
  const today = new Date().toLocaleDateString('zh-CN', {year:'numeric',month:'long',day:'numeric'});
  ctx.fillText(today, W/2, 210);
  
  // 核心数据卡片
  const data = [
    {label:'掌握知识', value:S.learned+'张', color:'#22c55e'},
    {label:'获得星星', value:S.stars+'颗', color:'#ffd54f'},
    {label:'掌握度', value:S.mastery+'%', color:'#4ade80'},
    {label:'闯关进度', value:S.gameIndex+'/5关', color:'#86efac'}
  ];
  
  const cardW = 300, cardH = 80;
  const startX = (W - cardW * 2 - 30) / 2;
  data.forEach((d, i) => {
    const col = i % 2, row = Math.floor(i / 2);
    const x = startX + col * (cardW + 30);
    const y = 260 + row * (cardH + 20);
    
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.roundRect(x, y, cardW, cardH, 16);
    ctx.fill();
    ctx.strokeStyle = d.color;
    ctx.lineWidth = 2;
    ctx.stroke();
    
    ctx.fillStyle = '#333';
    ctx.font = '22px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(d.label, x + 20, y + 35);
    ctx.fillStyle = d.color;
    ctx.font = 'bold 32px sans-serif';
    ctx.fillText(d.value, x + 20, y + 65);
  });
  
  // 评语
  const remarks = [];
  if(S.learned >= 5) remarks.push('📚 学习了' + S.learned + '张知识卡片');
  if(S.stars >= 20) remarks.push('⭐ 累积获得' + S.stars + '颗星星');
  if(S.mastery >= 70) remarks.push('🎯 掌握度达到' + S.mastery + '%');
  if(S.pkTotalWins > 0) remarks.push('🏆 PK对战胜' + S.pkTotalWins + '场');
  if(remarks.length === 0) remarks.push('🌱 今天的学习才刚刚开始！');
  
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.roundRect(60, 560, W-120, 40 + remarks.length * 45, 16);
  ctx.fill();
  
  ctx.fillStyle = '#166534';
  ctx.font = 'bold 28px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('今日亮点', W/2, 605);
  
  ctx.font = '24px sans-serif';
  ctx.fillStyle = '#333';
  ctx.textAlign = 'left';
  remarks.forEach((r, i) => {
    ctx.fillText(r, 100, 655 + i * 45);
  });
  
  // 成长等级
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.roundRect(60, 560 + 40 + remarks.length * 45 + 20, W-120, 90, 16);
  ctx.fill();
  
  const levelY = 560 + 40 + remarks.length * 45 + 65;
  ctx.fillStyle = '#166534';
  ctx.font = 'bold 28px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('点点鳄成长等级：' + getCrocLevel(), W/2, levelY + 10);
  ctx.font = '22px sans-serif';
  ctx.fillStyle = '#666';
  ctx.fillText('成长值：' + S.growth + '/100', W/2, levelY + 50);
  
  // 底部二维码区域（模拟）
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.roundRect(W/2-120, H-280, 240, 240, 16);
  ctx.fill();
  ctx.strokeStyle = '#22c55e';
  ctx.lineWidth = 2;
  ctx.stroke();
  
  ctx.fillStyle = '#999';
  ctx.font = '20px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('扫码下载体验', W/2, H-220);
  
  // 画一个简单的二维码占位
  ctx.fillStyle = '#333';
  for(let r = 0; r < 8; r++){
    for(let c = 0; c < 8; c++){
      if(Math.random() > 0.4){
        ctx.fillRect(W/2-60+c*15, H-200+r*15, 12, 12);
      }
    }
  }
  
  // 导出为图片
  try{
    const dataUrl = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = '点点鳄学习报告_' + new Date().toISOString().slice(0,10) + '.png';
    a.click();
    toast('学习报告海报已保存！📱');
  }catch(e){
    toast('海报生成失败，请截图分享~');
  }
}

  ].join('\n');
  
  if(navigator.clipboard){

      toast('复制失败，请手动复制~');

    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('分享文案已复制到剪贴板！📋');
  }
}
