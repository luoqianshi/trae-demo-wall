<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Evolution Manager</title>
<style>
:root {
  --bg-primary: #0d1117;
  --bg-secondary: #161b22;
  --bg-tertiary: #21262d;
  --bg-elevated: #30363d;
  --text-primary: #e6edf3;
  --text-secondary: #8b949e;
  --text-muted: #6e7681;
  --border-default: #30363d;
  --border-muted: #21262d;
  --accent-green: #3fb950;
  --accent-yellow: #d29922;
  --accent-blue: #58a6ff;
  --accent-red: #f85149;
  --accent-gray: #6e7681;
  --radius-sm: 6px;
  --radius-md: 8px;
  --font-mono: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  --sidebar-width: 220px;
  --transition-fast: 120ms ease;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans); font-size: 14px; line-height: 1.5;
  color: var(--text-primary); background: var(--bg-primary);
  height: 100vh; overflow: hidden;
}
.app-layout { display: grid; grid-template-columns: var(--sidebar-width) 1fr; height: 100vh; }
.sidebar {
  background: var(--bg-secondary); border-right: 1px solid var(--border-default);
  padding: 16px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto;
}
.sidebar-logo {
  font-size: 15px; font-weight: 700; color: var(--text-primary);
  padding: 8px 12px; margin-bottom: 12px; border-bottom: 1px solid var(--border-muted);
}
.sidebar-nav-item {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px;
  border-radius: var(--radius-sm); color: var(--text-secondary);
  text-decoration: none; cursor: pointer; font-size: 13px;
  transition: background var(--transition-fast);
}
.sidebar-nav-item:hover { background: var(--bg-tertiary); color: var(--text-primary); }
.sidebar-nav-item.active { background: var(--bg-tertiary); color: var(--accent-blue); }
.sidebar-nav-item .badge {
  margin-left: auto; background: var(--accent-red); color: #fff;
  font-size: 11px; padding: 1px 6px; border-radius: 10px; min-width: 18px; text-align: center;
}
.main-content { padding: 24px; overflow-y: auto; height: 100vh; }
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.status-dot.in_sync { background: var(--accent-green); }
.status-dot.agent_modified { background: var(--accent-yellow); }
.status-dot.dev_modified { background: var(--accent-blue); }
.status-dot.conflict { background: var(--accent-red); }
.status-dot.draft { background: var(--accent-gray); }
.card { background: var(--bg-secondary); border: 1px solid var(--border-default); border-radius: var(--radius-md); padding: 16px; }
.stat-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
.stat-card { background: var(--bg-secondary); border: 1px solid var(--border-default); border-radius: var(--radius-md); padding: 16px; text-align: center; }
.stat-card .stat-value { font-size: 28px; font-weight: 700; color: var(--text-primary); }
.stat-card .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.stat-card.warning .stat-value { color: var(--accent-yellow); }
.stat-card.danger .stat-value { color: var(--accent-red); }
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border-default); margin-bottom: 16px; }
.tab-btn { padding: 8px 16px; background: none; border: none; border-bottom: 2px solid transparent; color: var(--text-secondary); cursor: pointer; font-size: 13px; transition: color var(--transition-fast), border-color var(--transition-fast); }
.tab-btn:hover { color: var(--text-primary); }
.tab-btn.active { color: var(--accent-blue); border-bottom-color: var(--accent-blue); }
.btn { padding: 6px 16px; border: 1px solid var(--border-default); border-radius: var(--radius-sm); background: var(--bg-tertiary); color: var(--text-primary); cursor: pointer; font-size: 13px; transition: background var(--transition-fast); }
.btn:hover { background: var(--bg-elevated); }
.btn-primary { background: var(--accent-green); border-color: var(--accent-green); color: #000; }
.btn-primary:hover { opacity: 0.9; }
.btn-danger { background: var(--accent-red); border-color: var(--accent-red); color: #fff; }
.btn-danger:hover { opacity: 0.9; }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.input { padding: 6px 12px; border: 1px solid var(--border-default); border-radius: var(--radius-sm); background: var(--bg-primary); color: var(--text-primary); font-size: 13px; width: 100%; }
.input:focus { outline: none; border-color: var(--accent-blue); }
.search-bar { margin-bottom: 16px; }
.filter-pills { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
.filter-pill { padding: 4px 12px; border-radius: 12px; background: var(--bg-tertiary); border: 1px solid var(--border-default); color: var(--text-secondary); cursor: pointer; font-size: 12px; }
.filter-pill:hover { color: var(--text-primary); }
.filter-pill.active { background: var(--accent-blue); border-color: var(--accent-blue); color: #fff; }
.panel-layout { display: grid; grid-template-columns: 300px 1fr; gap: 16px; height: calc(100vh - 100px); }
.panel-left { background: var(--bg-secondary); border: 1px solid var(--border-default); border-radius: var(--radius-md); overflow-y: auto; }
.panel-right { background: var(--bg-secondary); border: 1px solid var(--border-default); border-radius: var(--radius-md); padding: 20px; overflow-y: auto; }
.skill-list-item { display: flex; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border-muted); cursor: pointer; transition: background var(--transition-fast); }
.skill-list-item:hover { background: var(--bg-tertiary); }
.skill-list-item.selected { background: var(--bg-tertiary); border-left: 3px solid var(--accent-blue); }
.skill-list-item .skill-name { font-weight: 600; font-size: 13px; flex: 1; }
.skill-list-item .skill-meta { font-size: 11px; color: var(--text-muted); }
.diff-container { font-family: var(--font-mono); font-size: 12px; line-height: 1.6; }
.diff-side-by-side { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border-default); }
.diff-panel { overflow-x: auto; padding: 8px; background: var(--bg-primary); }
.diff-panel-title { font-weight: 600; font-size: 12px; color: var(--text-secondary); padding: 6px 8px; background: var(--bg-tertiary); border-bottom: 1px solid var(--border-default); }
.diff-line { padding: 0 8px; white-space: pre; min-height: 20px; }
.diff-line.added { background: rgba(63, 185, 80, 0.15); }
.diff-line.removed { background: rgba(248, 81, 73, 0.15); }
.diff-unified .diff-line.added { color: var(--accent-green); }
.diff-unified .diff-line.added::before { content: '+'; margin-right: 4px; }
.diff-unified .diff-line.removed { color: var(--accent-red); }
.diff-unified .diff-line.removed::before { content: '-'; margin-right: 4px; }
.diff-unified .diff-line.context::before { content: ' '; margin-right: 4px; }
.timeline { position: relative; padding-left: 24px; }
.timeline::before { content: ''; position: absolute; left: 8px; top: 0; bottom: 0; width: 2px; background: var(--border-default); }
.timeline-item { position: relative; padding-bottom: 20px; }
.timeline-item::before { content: ''; position: absolute; left: -20px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--bg-elevated); border: 2px solid var(--border-default); }
.timeline-item.agent_drift::before { border-color: var(--accent-yellow); background: var(--accent-yellow); }
.timeline-item.dev_edit::before { border-color: var(--accent-blue); background: var(--accent-blue); }
.timeline-item.merge_approve::before { border-color: var(--accent-green); background: var(--accent-green); }
.timeline-item.rollback::before { border-color: var(--accent-red); background: var(--accent-red); }
.timeline-item.deploy::before { border-color: var(--accent-blue); background: var(--accent-blue); }
.timeline-header { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
.timeline-meta { font-size: 11px; color: var(--text-muted); }
.review-item { background: var(--bg-secondary); border: 1px solid var(--border-default); border-radius: var(--radius-md); margin-bottom: 12px; padding: 16px; }
.review-item.conflict { border-color: var(--accent-red); }
.review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.review-skill-name { font-size: 15px; font-weight: 600; }
.review-actions { display: flex; gap: 8px; }
.review-trigger { font-size: 12px; color: var(--text-secondary); margin-bottom: 12px; padding: 8px 12px; background: var(--bg-tertiary); border-radius: var(--radius-sm); }
.empty-state { text-align: center; padding: 40px; color: var(--text-muted); }
.empty-state h3 { margin-bottom: 8px; font-weight: 500; }
.empty-state p { font-size: 13px; }
.settings-form { max-width: 480px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary); }
.history-filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.mb-16 { margin-bottom: 16px; }
.text-muted { color: var(--text-muted); font-size: 12px; }
.flex { display: flex; }
.items-center { align-items: center; }
.gap-8 { gap: 8px; }
</style>
</head>
<body>
<div class="app-layout">
  <nav id="sidebar" class="sidebar"></nav>
  <main id="app" class="main-content"></main>
</div>

<script type="module">
// ====== lib/db.js ======
const DB_NAME = 'skill-evo';
const DB_VERSION = 1;
let db = null;

async function openDB() {
  if (db) return db;
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = (event) => {
      const database = event.target.result;
      if (!database.objectStoreNames.contains('skills')) {
        const skillsStore = database.createObjectStore('skills', { keyPath: 'id' });
        skillsStore.createIndex('status', 'status', { unique: false });
        skillsStore.createIndex('updated_at', 'updated_at', { unique: false });
      }
      if (!database.objectStoreNames.contains('events')) {
        const eventsStore = database.createObjectStore('events', { keyPath: 'id', autoIncrement: true });
        eventsStore.createIndex('skill_id', 'skill_id', { unique: false });
        eventsStore.createIndex('event_type', 'event_type', { unique: false });
        eventsStore.createIndex('timestamp', 'timestamp', { unique: false });
      }
      if (!database.objectStoreNames.contains('snapshots')) {
        const snapshotsStore = database.createObjectStore('snapshots', { keyPath: 'id', autoIncrement: true });
        snapshotsStore.createIndex('skill_id', 'skill_id', { unique: false });
        snapshotsStore.createIndex('version', 'version', { unique: false });
      }
      if (!database.objectStoreNames.contains('settings')) {
        database.createObjectStore('settings', { keyPath: 'key' });
      }
    };
    request.onsuccess = (event) => { db = event.target.result; resolve(db); };
    request.onerror = (event) => reject(event.target.error);
  });
}
function getStore(name, mode = 'readonly') {
  if (!db) throw new Error('Database not opened. Call openDB() first.');
  const tx = db.transaction(name, mode);
  return tx.objectStore(name);
}
function getAll(storeName) {
  return new Promise((resolve, reject) => {
    const store = getStore(storeName);
    const request = store.getAll();
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}
function get(storeName, key) {
  return new Promise((resolve, reject) => {
    const store = getStore(storeName);
    const request = store.get(key);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}
function put(storeName, value) {
  return new Promise((resolve, reject) => {
    const store = getStore(storeName, 'readwrite');
    const request = store.put(value);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}
function count(storeName) {
  return new Promise((resolve, reject) => {
    const store = getStore(storeName);
    const request = store.count();
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}
function getAllFromIndex(storeName, indexName, value) {
  return new Promise((resolve, reject) => {
    const store = getStore(storeName);
    const index = store.index(indexName);
    const request = index.getAll(value);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}
function getSetting(key) { return get('settings', key); }
function setSetting(key, value) { return put('settings', { key, value }); }

// ====== lib/differ.js ======
function computeDiff(oldText, newText) {
  const oldLines = oldText.split('\n');
  const newLines = newText.split('\n');
  const lcs = buildLCS(oldLines, newLines);
  const result = [];
  let oldIdx = 0, newIdx = 0;
  for (const pair of lcs) {
    while (oldIdx < pair[0]) { result.push({ type: 'removed', value: oldLines[oldIdx] }); oldIdx++; }
    while (newIdx < pair[1]) { result.push({ type: 'added', value: newLines[newIdx] }); newIdx++; }
    result.push({ type: 'unchanged', value: oldLines[oldIdx] }); oldIdx++; newIdx++;
  }
  while (oldIdx < oldLines.length) { result.push({ type: 'removed', value: oldLines[oldIdx] }); oldIdx++; }
  while (newIdx < newLines.length) { result.push({ type: 'added', value: newLines[newIdx] }); newIdx++; }
  return result;
}
function buildLCS(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      if (a[i - 1] === b[j - 1]) { dp[i][j] = dp[i - 1][j - 1] + 1; }
      else { dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]); }
    }
  }
  const lcs = [];
  let i = m, j = n;
  while (i > 0 && j > 0) {
    if (a[i - 1] === b[j - 1]) { lcs.unshift([i - 1, j - 1]); i--; j--; }
    else if (dp[i - 1][j] > dp[i][j - 1]) { i--; } else { j--; }
  }
  return lcs;
}
function splitWords(line) { return line.match(/\S+|[ ]+/g) || []; }

// ====== lib/scanner.js ======
async function scanSkillDir(entry) {
  const skillId = entry.name;
  const files = [];
  await traverseEntry(entry, '', files);
  return { skillId, files };
}
async function traverseEntry(entry, basePath, files) {
  if (entry.isFile) {
    const content = await readFile(entry);
    const relPath = basePath ? basePath + '/' + entry.name : entry.name;
    const hash = await computeHash(content);
    files.push({ path: relPath, content, hash });
  } else if (entry.isDirectory) {
    const reader = entry.createReader();
    const entries = await readAllEntries(reader);
    const newBase = basePath ? basePath + '/' + entry.name : entry.name;
    for (const child of entries) { await traverseEntry(child, newBase, files); }
  }
}
function readAllEntries(reader) {
  return new Promise((resolve) => {
    const all = [];
    function readBatch() {
      reader.readEntries((entries) => {
        if (entries.length === 0) { resolve(all); }
        else { all.push(...entries); readBatch(); }
      });
    }
    readBatch();
  });
}
function readFile(fileEntry) {
  return new Promise((resolve, reject) => {
    fileEntry.file((file) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsText(file);
    }, reject);
  });
}
async function computeHash(content) {
  const encoder = new TextEncoder();
  const data = encoder.encode(content);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
}
async function computeDirHash(files) {
  const sorted = [...files].sort((a, b) => a.path.localeCompare(b.path));
  const concatenation = sorted.map(f => f.path + ':' + f.hash).join('\n');
  const encoder = new TextEncoder();
  const buf = await crypto.subtle.digest('SHA-256', encoder.encode(concatenation));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
function parseSkillMd(files) {
  const skillMd = files.find(f => f.path.toLowerCase() === 'skill.md');
  if (!skillMd) return { name: null, description: null };
  const content = skillMd.content.trim();
  if (!content.startsWith('---')) return { name: null, description: null };
  const endIndex = content.indexOf('---', 3);
  if (endIndex === -1) return { name: null, description: null };
  const yamlStr = content.substring(3, endIndex);
  const nameMatch = yamlStr.match(/^name:\s*(.+)$/m);
  const descMatch = yamlStr.match(/^description:\s*(.+)$/m);
  return { name: nameMatch ? nameMatch[1].trim() : null, description: descMatch ? descMatch[1].trim() : null };
}

// ====== lib/router.js ======
// Pure in-memory page router. No URL manipulation (location.hash / history.pushState
// both trigger CORS errors on file:// protocol). Pages are tracked as internal
// state with direct function dispatch.
let currentPage = 'dashboard';   // 'dashboard' | 'skills' | 'skill-detail' | 'review' | 'history' | 'settings'
let currentSkillId = null;       // set when on skill-detail page
let routeChangeListeners = [];

function initRouter(routes) {
  // Start with default page
  dispatchPage();
}
function navigate(page, skillId) {
  if (currentPage === page && currentSkillId === skillId) return; // no-op
  currentPage = page;
  currentSkillId = skillId || null;
  dispatchPage();
  routeChangeListeners.forEach(fn => fn());
}
function dispatchPage() {
  const app = document.getElementById('app');
  switch (currentPage) {
    case 'dashboard': renderDashboard(); break;
    case 'skills': renderSkillsPage(); break;
    case 'skill-detail': renderSkillPage(currentSkillId); break;
    case 'review': renderReviewPage(); break;
    case 'history': renderTimeline({}); break;
    case 'settings': renderSettings(); break;
    default: currentPage = 'dashboard'; renderDashboard(); break;
  }
}
function getCurrentPage() { return currentPage; }
function getCurrentSkillId() { return currentSkillId; }
function onRouteChange(callback) { routeChangeListeners.push(callback); }

// ====== lib/event-log.js ======
async function recordEvent(skillId, version, eventType, diff, hashBefore, hashAfter, options = {}) {
  const event = {
    skill_id: skillId, version, event_type: eventType,
    agent_id: options.agentId || null, trigger: options.trigger || null,
    diff: JSON.stringify(diff), content_hash_before: hashBefore, content_hash_after: hashAfter,
    quality_gate_passed: options.qualityGatePassed !== undefined ? options.qualityGatePassed : null,
    timestamp: new Date().toISOString()
  };
  return put('events', event);
}
async function getEvents(skillId) {
  const all = await getAllFromIndex('events', 'skill_id', skillId);
  return all.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
}
async function getRecentEvents(limit = 10) {
  const all = await getAll('events');
  return all.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)).slice(0, limit);
}
async function getEventsByType(eventType) { return getAllFromIndex('events', 'event_type', eventType); }

// ====== lib/registry.js ======
async function registerSkill(skillId, devPath, agentPath, devFiles, agentFiles) {
  const existing = await get('skills', skillId);
  const devDirHash = await computeDirHash(devFiles);
  const agentDirHash = agentFiles ? await computeDirHash(agentFiles) : devDirHash;
  const meta = parseSkillMd(devFiles);
  const skill = {
    id: skillId, name: meta.name || skillId, description: meta.description || '',
    current_version: existing ? existing.current_version : 1,
    source_path: devPath, agent_path: agentPath, content_hash: devDirHash,
    status: existing ? determineStatus(existing, devDirHash, agentDirHash) : 'draft',
    created_at: existing ? existing.created_at : new Date().toISOString(),
    updated_at: new Date().toISOString(), quality_score: existing ? existing.quality_score : null,
    _last_dev_hash: devDirHash, _last_agent_hash: agentDirHash
  };
  await put('skills', skill);
  return skill;
}
function determineStatus(existing, devDirHash, agentDirHash) {
  const lastDev = existing._last_dev_hash || existing.content_hash;
  const lastAgent = existing._last_agent_hash || existing.content_hash;
  if (devDirHash === agentDirHash) return 'in_sync';
  if (agentDirHash !== lastAgent && devDirHash === lastDev) return 'agent_modified';
  if (agentDirHash === lastAgent && devDirHash !== lastDev) return 'dev_modified';
  return 'conflict';
}
async function getReviewQueue() {
  const modified = await getAllFromIndex('skills', 'status', 'agent_modified');
  const conflicts = await getAllFromIndex('skills', 'status', 'conflict');
  return [...modified, ...conflicts];
}
async function getStats() {
  const all = await getAll('skills');
  const modified = all.filter(s => s.status === 'agent_modified').length;
  const conflicts = all.filter(s => s.status === 'conflict').length;
  return { total_skills: all.length, pending_review: modified + conflicts, conflicts };
}

// ====== components/sidebar.js ======
let lastStats = { total_skills: 0, pending_review: 0, conflicts: 0 };
function renderSidebar(stats = lastStats) {
  lastStats = stats;
  const sidebar = document.getElementById('sidebar');
  const page = getCurrentPage();
  const activePage = page === 'skill-detail' ? 'skills' : page;
  const navItems = [
    { page: 'dashboard', label: 'Dashboard', icon: '📊' },
    { page: 'skills', label: 'Skills', icon: '📁', badge: stats.total_skills },
    { page: 'review', label: 'Review', icon: '🔍', badge: stats.pending_review, badgeClass: 'warning' },
    { page: 'history', label: 'History', icon: '🕐' },
    { page: 'settings', label: 'Settings', icon: '⚙️' }
  ];
  sidebar.innerHTML =
    `<div class="sidebar-logo">🧬 Skill Evo</div>` +
    navItems.map(item =>
      `<a class="sidebar-nav-item ${activePage === item.page ? 'active' : ''}" data-page="${item.page}">
        <span>${item.icon}</span><span>${item.label}</span>
        ${item.badge !== undefined ? `<span class="badge ${item.badge > 0 && item.badgeClass ? item.badgeClass : ''}">${item.badge}</span>` : ''}
      </a>`
    ).join('');
  sidebar.querySelectorAll('.sidebar-nav-item').forEach(el => {
    el.addEventListener('click', () => navigate(el.dataset.page));
  });
}

// ====== components/settings.js ======
async function renderSettings() {
  const app = document.getElementById('app');
  const devPath = await getSetting('dev_path');
  const agentPath = await getSetting('agent_path');
  app.innerHTML = `<h2 style="margin-bottom:20px;">Settings</h2>
    <div class="settings-form">
      <div class="form-group">
        <label for="dev-path">Development Skill Root</label>
        <input type="text" id="dev-path" class="input" placeholder="e.g. D:/projects/.agents/skills" value="${(devPath && devPath.value) || ''}">

        <p class="text-muted">Path to the Hermes agent's skills directory.</p>

      <button id="save-settings" class="btn btn-primary">Save Settings</button>

// ====== components/diff-viewer.js ======
function renderDiff(containerId, oldText, newText, oldLabel, newLabel) {
  const container = document.getElementById(containerId);
  if (!container) return;
  const label1 = oldLabel || 'Dev';
  const label2 = newLabel || 'Agent';
  const diffs = computeDiff(oldText || '', newText || '');
  let oldHTML = '', newHTML = '';
  for (const chunk of diffs) {
    const escaped = escapeHTML(chunk.value);
    if (chunk.type === 'added') {
      newHTML += `<div class="diff-line added">${escaped}</div>`;
      oldHTML += `<div class="diff-line"></div>`;
    } else if (chunk.type === 'removed') {
      oldHTML += `<div class="diff-line removed">${escaped}</div>`;
      newHTML += `<div class="diff-line"></div>`;
    } else {
      oldHTML += `<div class="diff-line context">${escaped}</div>`;
      newHTML += `<div class="diff-line context">${escaped}</div>`;
    }
  }
  container.innerHTML = `<div class="diff-side-by-side">
    <div class="diff-panel"><div class="diff-panel-title">${escapeHTML(label1)}</div>${oldHTML}</div>
    <div class="diff-panel"><div class="diff-panel-title">${escapeHTML(label2)}</div>${newHTML}</div>
  </div>`;
}
function renderUnifiedDiff(containerId, oldText, newText) {
  const container = document.getElementById(containerId);
  if (!container) return;
  const diffs = computeDiff(oldText || '', newText || '');
  const html = diffs.map(chunk => {
    const escaped = escapeHTML(chunk.value);
    return `<div class="diff-line ${chunk.type === 'added' ? 'added' : chunk.type === 'removed' ? 'removed' : 'context'}">${escaped}</div>`;
  }).join('');
  container.innerHTML = `<div class="diff-unified diff-container">${html}</div>`;
}
function escapeHTML(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ====== components/skill-list.js ======
let allSkills = [];
let selectedId = null;
const STATUS_LABELS = { in_sync: 'In Sync', agent_modified: 'Agent Modified', dev_modified: 'Dev Modified', conflict: 'Conflict', draft: 'Draft' };
async function loadSkills() { allSkills = await getAll('skills'); }
function renderSkillList(containerId, onSelect) {
  const container = document.getElementById(containerId);
  const statuses = ['all', 'in_sync', 'agent_modified', 'dev_modified', 'conflict', 'draft'];
  let filterStatus = 'all';
  let searchQuery = '';
  function render() {
    let filtered = allSkills;
    if (filterStatus !== 'all') filtered = filtered.filter(s => s.status === filterStatus);
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      filtered = filtered.filter(s => s.name.toLowerCase().includes(q) || s.id.toLowerCase().includes(q));
    }
    container.innerHTML = `<div class="search-bar"><input type="text" id="skill-search" class="input" placeholder="Search skills..." value="${escapeAttr(searchQuery)}"></div>
      <div class="filter-pills">${statuses.map(s => `<span class="filter-pill ${filterStatus === s ? 'active' : ''}" data-status="${s}">${s === 'all' ? 'All' : STATUS_LABELS[s]}</span>`).join('')}</div>
      <div id="skill-items">
        ${filtered.length === 0 ? '<div class="empty-state"><p>No skills found</p></div>' : ''}
        ${filtered.map(s => `<div class="skill-list-item ${selectedId === s.id ? 'selected' : ''}" data-skill-id="${s.id}">
          <span class="status-dot ${s.status}"></span>
          <div><div class="skill-name">${escapeHTML(s.name)}</div><div class="skill-meta">v${s.current_version} · ${STATUS_LABELS[s.status]}</div></div>
          <div class="skill-meta">${formatTime(s.updated_at)}</div>
        </div>`).join('')}
      </div>`;
    document.getElementById('skill-search').addEventListener('input', (e) => { searchQuery = e.target.value; render(); });
    container.querySelectorAll('.filter-pill').forEach(pill => { pill.addEventListener('click', () => { filterStatus = pill.dataset.status; render(); }); });
    container.querySelectorAll('.skill-list-item').forEach(item => {
      item.addEventListener('click', () => { selectedId = item.dataset.skillId; onSelect(item.dataset.skillId); render(); });
    });
  }
  render();
}
function formatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const diff = Date.now() - d;
  if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
  if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
  return d.toLocaleDateString();
}
function escapeAttr(str) { return str.replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

// ====== components/skill-detail.js ======
let activeSkillId = null;
let activeTab = 'info';
async function renderSkillDetail(skillId) {
  activeSkillId = skillId;

async function renderPanel(container, skill) {
  container.innerHTML = `<h3 style="margin-bottom:4px;">${skill.name}</h3><p class="text-muted mb-16">${skill.description}</p>
    <div class="tabs">
      <button class="tab-btn ${activeTab === 'info' ? 'active' : ''}" data-tab="info">Info</button>

    btn.addEventListener('click', async () => { activeTab = btn.dataset.tab; await renderPanel(container, skill); });

async function renderTabContent(skill) {
  const content = document.getElementById('tab-content');
  if (!content) return;
  if (activeTab === 'info') {
    content.innerHTML = `<div class="card mb-16">
      <div style="margin-bottom:8px;"><strong>Status:</strong> <span class="status-dot ${skill.status}"></span> ${skill.status}</div>
      <div style="margin-bottom:8px;"><strong>Version:</strong> ${skill.current_version}</div>
      <div style="margin-bottom:8px;"><strong>Content Hash:</strong> <code class="text-muted">${skill.content_hash ? skill.content_hash.substring(0, 16) + '...' : 'N/A'}</code></div>
      <div style="margin-bottom:8px;"><strong>Source Path:</strong> <code class="text-muted">${skill.source_path || 'Not set'}</code></div>
      <div style="margin-bottom:8px;"><strong>Agent Path:</strong> <code class="text-muted">${skill.agent_path || 'Not set'}</code></div>
      <div style="margin-bottom:8px;"><strong>Last Updated:</strong> ${skill.updated_at ? new Date(skill.updated_at).toLocaleString() : 'N/A'}</div>
    </div>
    <div class="flex gap-8">
      ${skill.status === 'agent_modified' || skill.status === 'conflict'
        ? `<button id="approve-btn" class="btn btn-primary">Accept Agent Changes</button>
           <button id="reject-btn" class="btn btn-danger">Reject Agent Changes</button>` : ''}
      <button id="rollback-btn" class="btn">Rollback</button>
    </div><div id="action-status" class="text-muted" style="margin-top:12px;"></div>`;
  } else if (activeTab === 'diff') {
    content.innerHTML = `<div class="card">
      <p class="text-muted mb-16">Diff view requires skill content to be loaded during scan.</p>
      <p class="text-muted">Current status: <span class="status-dot ${skill.status}"></span> ${skill.status}</p>
      ${skill._last_dev_hash && skill._last_agent_hash && skill._last_dev_hash !== skill._last_agent_hash
        ? `<div style="margin-top:12px;" class="text-muted"><div>Dev hash: ${skill._last_dev_hash.substring(0, 12)}...</div><div>Agent hash: ${skill._last_agent_hash.substring(0, 12)}...</div></div>`
        : '<div style="margin-top:12px;" class="text-muted">Hashes match — no differences detected.</div>'}
    </div>`;
  } else if (activeTab === 'lineage') {
    const events = await getEvents(skill.id);
    content.innerHTML = events.length === 0
      ? '<div class="empty-state"><p>No events recorded for this skill.</p></div>'
      : `<div class="timeline">${events.map(e => `<div class="timeline-item ${e.event_type}">
        <div class="timeline-header">v${e.version} — ${formatEventType(e.event_type)}</div>
        <div class="timeline-meta">
          ${e.event_type === 'agent_drift' && e.agent_id ? `Agent: ${e.agent_id} · ` : ''}
          ${e.trigger ? `Reason: ${e.trigger} · ` : ''}${new Date(e.timestamp).toLocaleString()}
        </div>
        ${e.content_hash_before ? `<div class="text-muted" style="font-size:10px;">hash: ${e.content_hash_before.substring(0, 8)} → ${e.content_hash_after ? e.content_hash_after.substring(0, 8) : 'N/A'}</div>` : ''}
      </div>`).join('')}</div>`;
  }
}
function formatEventType(type) {
  const labels = { agent_drift: 'Agent Auto-Drift', dev_edit: 'Dev Edit', merge_approve: 'Merge Approved', rollback: 'Rollback', deploy: 'Deploy' };
  return labels[type] || type;
}

        ${skill._last_agent_hash ? `<br><small class="text-muted">Agent hash: ${skill._last_agent_hash.substring(0, 12)}...</small>` : ''}

// ====== components/timeline.js ======
const EVENT_LABELS = { agent_drift: 'Agent Auto-Drift', dev_edit: 'Dev Edit', merge_approve: 'Merge Approved', rollback: 'Rollback', deploy: 'Deploy' };
async function renderTimeline(filters = {}) {
  const app = document.getElementById('app');
  let events;
  if (filters.skillId) { events = await getEvents(filters.skillId); }
  else if (filters.eventType) { events = await getEventsByType(filters.eventType); }
  else { events = await getRecentEvents(100); }
  const eventTypes = ['agent_drift', 'dev_edit', 'merge_approve', 'rollback', 'deploy'];
  let activeType = filters.eventType || 'all';
  function render() {
    let filtered = events;
    if (activeType !== 'all') filtered = filtered.filter(e => e.event_type === activeType);
    app.innerHTML = `<h2 style="margin-bottom:20px;">Event History</h2>
      <div class="history-filters">
        <span class="filter-pill ${activeType === 'all' ? 'active' : ''}" data-type="all">All</span>
        ${eventTypes.map(t => `<span class="filter-pill ${activeType === t ? 'active' : ''}" data-type="${t}">${EVENT_LABELS[t]}</span>`).join('')}
      </div><div id="timeline-container">
        ${filtered.length === 0 ? '<div class="empty-state"><p>No events found.</p></div>' : ''}
        <div class="timeline">${filtered.map(e => `<div class="timeline-item ${e.event_type}">
          <div class="timeline-header"><strong>${e.skill_id}</strong> v${e.version} — ${EVENT_LABELS[e.event_type]}</div>
          <div class="timeline-meta">
            ${e.agent_id ? `Agent: ${e.agent_id} · ` : ''}${e.trigger ? `Reason: ${e.trigger} · ` : ''}${new Date(e.timestamp).toLocaleString()}
          </div>
          <div class="text-muted" style="font-size:10px;margin-top:2px;">${e.content_hash_before ? `${e.content_hash_before.substring(0, 8)} → ${e.content_hash_after ? e.content_hash_after.substring(0, 8) : 'N/A'}` : ''}</div>
        </div>`).join('')}</div>
      </div>`;
    app.querySelectorAll('.filter-pill').forEach(pill => { pill.addEventListener('click', () => { activeType = pill.dataset.type; render(); }); });
  }
  render();
}

// ====== APP ENTRY POINT ======
let lastDropEntry = null;

async function init() {
  await openDB();
  await refreshSidebar();
  initRouter(); // no routes object needed — dispatchPage() handles all pages
  document.addEventListener('click', async (e) => {
    if (e.target.id === 'scan-btn' || e.target.closest('#scan-btn')) { await enterScanMode(); }
  });
}

async function refreshSidebar() { renderSidebar(await getStats()); }

async function enterScanMode() {
  const app = document.getElementById('app');
  lastDropEntry = null;
  app.innerHTML = `<h2 style="margin-bottom:20px;">Scan Skills</h2>
    <div class="card" style="padding:40px;text-align:center;">
      <h3>Drop a skill folder here</h3>
      <p class="text-muted" style="margin-top:8px;">Drop the <strong>dev</strong> skill folder first, then drop the <strong>agent</strong> version</p>
      <div id="scan-status" style="margin-top:20px;"></div>
    </div>
    <div style="margin-top:16px;text-align:center;"><button id="cancel-scan" class="btn">Cancel</button></div>`;
  document.getElementById('cancel-scan').addEventListener('click', () => {
    document.body.ondragover = null; document.body.ondrop = null; navigate('dashboard');
  });
  document.body.ondragover = (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; };
  document.body.ondrop = async (e) => {
    e.preventDefault();
    const items = e.dataTransfer.items;
    if (!items) return;
    for (const item of items) {
      const entry = item.webkitGetAsEntry();
      if (!entry || !entry.isDirectory) continue;
      const statusEl = document.getElementById('scan-status');
      statusEl.innerHTML = '<p>Scanning...</p>';
      try {
        const { skillId, files } = await scanSkillDir(entry);
        if (lastDropEntry) {
          const devDirHash = await computeDirHash(lastDropEntry);
          const agentDirHash = await computeDirHash(files);
          await registerAndUpdate(skillId, lastDropEntry, files, devDirHash, agentDirHash);
          lastDropEntry = null;
          statusEl.innerHTML = `<p style="color:var(--accent-green);">✓ <strong>${skillId}</strong> registered successfully (${files.length} files)</p>
            <p class="text-muted">Drop another pair or <a href="#" onclick="window.skillEvoNavigate('skills');return false;" style="color:var(--accent-blue);">view all skills</a>.</p>`;
        } else {
          lastDropEntry = files;
          statusEl.innerHTML = `<p style="color:var(--accent-blue);">✓ Dev: <strong>${skillId}</strong> loaded (${files.length} files)</p>
            <p>Now drop the <strong>agent</strong> version of the same skill folder.</p>`;
        }
      } catch (err) { statusEl.innerHTML = `<p style="color:var(--accent-red);">Error: ${err.message}</p>`; }
    }
  };
}

async function registerAndUpdate(skillId, devFiles, agentFiles, devDirHash, agentDirHash) {
  const meta = parseSkillMd(devFiles);
  const existing = await get('skills', skillId);
  const status = existing ? determineStatus(existing, devDirHash, agentDirHash) : 'draft';
  const skill = {
    id: skillId, name: meta.name || skillId, description: meta.description || '',
    current_version: existing ? existing.current_version : 1,
    source_path: skillId, agent_path: skillId, content_hash: devDirHash, status,
    created_at: existing ? existing.created_at : new Date().toISOString(),
    updated_at: new Date().toISOString(), quality_score: null,
    _last_dev_hash: devDirHash, _last_agent_hash: agentDirHash
  };
  await put('skills', skill);
  if (status !== 'in_sync' && existing) {
    await recordEvent(skillId, skill.current_version, status === 'agent_modified' ? 'agent_drift' : 'dev_edit', [], existing.content_hash || devDirHash, devDirHash);
  }
  await refreshSidebar();
}

async function renderSkillsPage() {
  const app = document.getElementById('app');
  await loadSkills();
  app.innerHTML = `<h2 style="margin-bottom:20px;">Skills</h2>
    <div class="panel-layout">
      <div id="skill-list-panel" class="panel-left"></div>
      <div id="skill-detail-panel" class="panel-right"><div class="empty-state"><p>Select a skill to view details</p></div></div>
    </div>`;
  renderSkillList('skill-list-panel', (skillId) => navigate('skill-detail', skillId));
}

async function renderSkillPage(skillId) {
  const app = document.getElementById('app');
  await loadSkills();
  app.innerHTML = `<div class="flex items-center gap-8 mb-16"><button id="back-to-skills" class="btn btn-sm">← Back to Skills</button></div><div id="skill-detail-panel"></div>`;
  document.getElementById('back-to-skills').addEventListener('click', () => navigate('skills'));
  await renderSkillDetail(skillId);
  await wireActionButtons(skillId);
}

async function wireActionButtons(skillId) {
  document.addEventListener('click', async (e) => {
    if (e.target.id === 'approve-btn') { e.stopPropagation(); await handleAccept(skillId); await renderSkillDetail(skillId); await refreshSidebar(); }
    else if (e.target.id === 'reject-btn') { e.stopPropagation(); await handleReject(skillId); await renderSkillDetail(skillId); await refreshSidebar(); }
    else if (e.target.id === 'rollback-btn') { e.stopPropagation(); await handleRollback(skillId); await renderSkillDetail(skillId); await refreshSidebar(); }
  });
}

async function renderReviewPage() {
  await renderReviewQueue(
    async (skillId) => { await handleAccept(skillId); await refreshSidebar(); await renderReviewPage(); },
    async (skillId) => { await handleReject(skillId); await refreshSidebar(); await renderReviewPage(); }
  );
}

async function handleAccept(skillId) {
  const skill = await get('skills', skillId);
  if (!skill) return;
  const newVersion = skill.current_version + 1;
  const agentHash = skill._last_agent_hash || skill._last_dev_hash;
  skill.current_version = newVersion; skill.content_hash = agentHash; skill.status = 'in_sync';
  skill.updated_at = new Date().toISOString(); skill._last_dev_hash = agentHash; skill._last_agent_hash = agentHash;
  await put('skills', skill);
  await recordEvent(skillId, newVersion, 'merge_approve', [], skill.content_hash, agentHash, { trigger: 'Agent changes accepted by user' });
}

async function handleReject(skillId) {
  const skill = await get('skills', skillId);
  if (!skill) return;
  const revertedHash = skill._last_dev_hash;
  skill._last_agent_hash = skill._last_dev_hash; skill.status = 'in_sync';
  skill.content_hash = revertedHash; skill.updated_at = new Date().toISOString();
  await put('skills', skill);
  await recordEvent(skillId, skill.current_version, 'rollback', [], skill._last_agent_hash, revertedHash, { trigger: 'Agent changes rejected by user' });
}

async function handleRollback(skillId) {
  const skill = await get('skills', skillId);
  if (!skill) return;
  const events = await getEvents(skillId);
  if (events.length < 2) { alert('No previous version to roll back to.'); return; }
  const prevEvent = events.find(e => e.version < skill.current_version);
  if (!prevEvent) { alert('No previous version found.'); return; }
  skill.current_version = prevEvent.version; skill.content_hash = prevEvent.content_hash_before;
  skill.status = 'in_sync'; skill.updated_at = new Date().toISOString();
  skill._last_dev_hash = prevEvent.content_hash_before; skill._last_agent_hash = prevEvent.content_hash_before;
  await put('skills', skill);
  await recordEvent(skillId, prevEvent.version, 'rollback', [], skill.content_hash, prevEvent.content_hash_before, { trigger: 'Manual rollback by user' });
}

init();
window.skillEvoNavigate = navigate;
</script>
