<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>简易枪战游戏</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Press Start 2P', monospace;
      overflow: hidden;
      user-select: none;
    }
    .game-wrapper {
      position: relative;
      width: 960px;
      height: 540px;
      background: #1a1a2e;
      border: 3px solid #e94560;
      box-shadow: 0 0 30px rgba(233, 69, 96, 0.3), inset 0 0 30px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }
    .game-wrapper.fullscreen {
      width: 100vw;
      height: 100vh;
      border: none;
      box-shadow: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    /* ===== FULLSCREEN BUTTON ===== */
    .fullscreen-btn {
      position: absolute;
      bottom: 6px;
      right: 6px;
      z-index: 30;
      background: rgba(15,52,96,0.6);
      color: #4a4a7a;
      border: 1px solid #0f3460;
      padding: 4px 8px;
      font-family: 'Press Start 2P', monospace;
      font-size: 7px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .fullscreen-btn:hover {
      background: #0f3460;
      color: #fff;
    }

    /* ===== OVERLAY SCREENS ===== */
    .screen-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(10, 10, 26, 0.92);
      z-index: 10;
    }
    .screen-overlay.hidden { display: none; }

    .game-title {
      font-size: 32px; color: #e94560;
      text-shadow: 0 0 20px rgba(233,69,96,0.6), 0 0 40px rgba(233,69,96,0.3);
      margin-bottom: 10px; text-align: center; line-height: 1.4;
      animation: titlePulse 2s ease-in-out infinite;
    }
    @keyframes titlePulse {
      0%,100% { text-shadow: 0 0 20px rgba(233,69,96,0.6), 0 0 40px rgba(233,69,96,0.3); }
      50% { text-shadow: 0 0 30px rgba(233,69,96,0.9), 0 0 60px rgba(233,69,96,0.5); }
    }
    .game-subtitle { font-size: 10px; color: #4a4a7a; margin-bottom: 40px; letter-spacing: 4px; }

    .menu-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 14px; color: #fff;
      background: transparent; border: 2px solid #0f3460;
      padding: 14px 40px; margin: 8px 0;
      cursor: pointer; transition: all 0.2s ease;
      min-width: 260px; text-align: center;
    }
    .menu-btn:hover {
      background: #e94560; border-color: #e94560;
      box-shadow: 0 0 20px rgba(233,69,96,0.4); transform: scale(1.05);
    }
    .menu-btn.primary { border-color: #e94560; color: #e94560; }
    .menu-btn.primary:hover { background: #e94560; color: #fff; }
    .menu-btn.small { font-size: 10px; padding: 10px 24px; min-width: 180px; }
    .menu-btn.dark { border-color: #1a1a3e; color: #8a8aaa; }
    .menu-btn.dark:hover { background: #1a1a3e; border-color: #e94560; color: #fff; }

    .high-score {
      position: absolute; bottom: 30px;
      font-size: 10px; color: #4a4a7a;
    }
    .high-score span { color: #e94560; }

    .mode-title { font-size: 18px; color: #e94560; margin-bottom: 30px; }
    .mode-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 12px; color: #fff; background: transparent;
      border: 2px solid #1a1a3e; padding: 16px 36px; margin: 8px 0;
      cursor: pointer; transition: all 0.2s ease;
      min-width: 240px; text-align: center;
    }
    .mode-btn:hover { background: #1a1a3e; border-color: #e94560; box-shadow: 0 0 20px rgba(233,69,96,0.3); transform: scale(1.05); }
    .mode-desc { font-size: 7px; color: #6a6a9a; margin-top: 4px; }

    .gameover-title { font-size: 28px; color: #e94560; margin-bottom: 20px; text-shadow: 0 0 30px rgba(233,69,96,0.5); }
    .score-display { font-size: 14px; color: #fff; margin: 6px 0; }
    .score-display span { color: #e94560; }
    .best-score { font-size: 10px; color: #4a4a7a; margin-bottom: 30px; }
    .best-score span { color: #e94560; }

    .pause-title { font-size: 24px; color: #fff; margin-bottom: 30px; }

    .modal-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); z-index: 20;
      display: flex; justify-content: center; align-items: center;
    }
    .modal-overlay.hidden { display: none; }
    .modal-content {
      background: #1a1a2e; border: 2px solid #0f3460;
      padding: 30px; max-width: 600px; width: 80%; max-height: 80%; overflow-y: auto;
    }
    .modal-content h2 { font-size: 14px; color: #e94560; margin-bottom: 20px; text-align: center; }
    .modal-content p { font-size: 8px; color: #aaa; line-height: 2; margin-bottom: 8px; }
    .modal-content .key {
      display: inline-block; background: #0f3460; color: #fff;
      padding: 2px 8px; font-size: 7px; border: 1px solid #e94560;
    }
    .modal-close {
      font-family: 'Press Start 2P', monospace; font-size: 10px;
      color: #fff; background: #e94560; border: none;
      padding: 10px 30px; margin-top: 20px; cursor: pointer;
      display: block; margin-left: auto; margin-right: auto;
    }
    .modal-close:hover { background: #ff6b81; }

    /* ===== SKILL SELECT ===== */
    .skill-select-title { font-size: 16px; color: #e94560; margin-bottom: 10px; }
    .skill-select-sub { font-size: 8px; color: #6a6a9a; margin-bottom: 20px; }
    .skill-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
      width: 80%;
      max-width: 500px;
    }
    .skill-card {
      background: #0f0f2a;
      border: 2px solid #1a1a3e;
      padding: 14px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .skill-card:hover { border-color: #0f3460; background: #151535; }
    .skill-card.selected {
      border-color: #e94560;
      background: rgba(233,69,96,0.1);
      box-shadow: 0 0 15px rgba(233,69,96,0.2);
    }
    .skill-card.selected-f { border-color: #4ecdc4; box-shadow: 0 0 15px rgba(78,205,196,0.3); }
    .skill-card.selected-e { border-color: #ffdd57; box-shadow: 0 0 15px rgba(255,221,87,0.3); }
    .skill-card.disabled { opacity: 0.4; cursor: not-allowed; }
    .skill-icon { font-size: 24px; margin-bottom: 6px; }
    .skill-name { font-size: 9px; color: #fff; margin-bottom: 4px; }
    .skill-desc { font-size: 6px; color: #6a6a9a; line-height: 1.6; }
    .skill-key-hint {
      display: inline-block;
      font-size: 7px;
      padding: 2px 6px;
      margin-top: 6px;
      border: 1px solid #4a4a7a;
      color: #aaa;
    }
    .skill-card.selected-f .skill-key-hint { border-color: #4ecdc4; color: #4ecdc4; }
    .skill-card.selected-e .skill-key-hint { border-color: #ffdd57; color: #ffdd57; }
    .skill-select-confirm {
      font-family: 'Press Start 2P', monospace;
      font-size: 12px; color: #fff;
      background: #e94560; border: none;
      padding: 12px 40px; cursor: pointer;
      transition: all 0.2s;
    }
    .skill-select-confirm:hover { background: #ff6b81; box-shadow: 0 0 20px rgba(233,69,96,0.4); }
    .skill-select-confirm:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="game-wrapper" id="gameWrapper">
  <canvas id="gameCanvas" width="960" height="540"></canvas>
  <button class="fullscreen-btn" id="fullscreenBtn" onclick="toggleFullscreen()">⛶ 全屏</button>

  <!-- ===== MAIN MENU ===== -->
  <div class="screen-overlay" id="menuScreen">
    <div class="game-title">简易枪战</div>
    <div class="game-subtitle">GUN BATTLE</div>
    <button class="menu-btn primary" onclick="showModeSelect()">开 始 游 戏</button>
    <button class="menu-btn dark" onclick="showInstructions()">游 戏 说 明</button>
    <div class="high-score">最高分: <span id="highScoreDisplay">0</span></div>
  </div>

  <!-- ===== MODE SELECT ===== -->
  <div class="screen-overlay hidden" id="modeSelectScreen">
    <div class="mode-title">选 择 模 式</div>
    <button class="mode-btn" onclick="startGame('endless')">
      无 尽 模 式
      <div class="mode-desc">无限小怪 · 难度递增</div>
    </button>
    <button class="mode-btn" onclick="startGame('boss')">
      Boss 战 模 式
      <div class="mode-desc">连续Boss车轮战</div>
    </button>
    <button class="menu-btn small dark" style="margin-top:20px;" onclick="showMenu()">返 回 主 菜 单</button>
  </div>

  <!-- ===== SKILL SELECT ===== -->
  <div class="screen-overlay hidden" id="skillSelectScreen">
    <div class="skill-select-title">选 择 技 能</div>
    <div class="skill-select-sub">选择两个技能携带 · F键和E键各绑定一个</div>
    <div class="skill-grid" id="skillGrid"></div>
    <button class="skill-select-confirm" id="skillConfirmBtn" onclick="confirmSkills()" disabled>确 认 选 择</button>
  </div>

  <!-- ===== GAME OVER ===== -->
  <div class="screen-overlay hidden" id="gameOverScreen">
    <div class="gameover-title">游 戏 结 束</div>
    <div class="score-display">最终得分: <span id="finalScore">0</span></div>
    <div class="score-display">击杀数: <span id="finalKills">0</span></div>
    <div class="best-score">最高记录: <span id="bestScoreDisplay">0</span></div>
    <button class="menu-btn primary" onclick="restartGame()">重 新 开 始</button>
    <button class="menu-btn dark" onclick="showModeSelect()">返 回 模 式 选 择</button>
  </div>

  <!-- ===== PAUSE ===== -->
  <div class="screen-overlay hidden" id="pauseScreen">
    <div class="pause-title">暂 停</div>
    <button class="menu-btn primary" onclick="resumeGame()">继 续 游 戏</button>
    <button class="menu-btn dark" onclick="restartGame()">重 新 开 始</button>
    <button class="menu-btn dark" onclick="showMenu()">返 回 主 菜 单</button>
  </div>

  <!-- ===== INSTRUCTIONS ===== -->
  <div class="modal-overlay hidden" id="instructionsModal">
    <div class="modal-content">
      <h2>游 戏 说 明</h2>
      <p><span class="key">W A S D</span> 控制角色移动</p>
      <p><span class="key">鼠标移动</span> 瞄准方向</p>
      <p><span class="key">鼠标左键</span> 射击（长按连射）</p>
      <p><span class="key">鼠标右键</span> 闪现（消耗能量）</p>
      <p><span class="key">左 Shift</span> 加速移动</p>
      <p><span class="key">R</span> 手动装填弹药</p>
      <p><span class="key">F</span> 虚化技能（消耗能量）</p>
      <p><span class="key">E</span> 技能2（消耗能量）</p>
      <p><span class="key">Esc</span> 暂停/继续</p>
      <p style="margin-top:12px;color:#e94560;">虚化：受击前0.1秒内触发完美虚化获得更强效果</p>
      <p style="font-size:7px;color:#6a6a9a;">击败敌人获得分数，屏幕上方绿色为能量条</p>
      <button class="modal-close" onclick="hideInstructions()">关 闭</button>
    </div>
  </div>
</div>

<script>
// ============================================================
//  GAME ENGINE
// ============================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 960, H = 540;

// DOM refs
const menuScreen = document.getElementById('menuScreen');
const modeSelectScreen = document.getElementById('modeSelectScreen');
const skillSelectScreen = document.getElementById('skillSelectScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const pauseScreen = document.getElementById('pauseScreen');
const instructionsModal = document.getElementById('instructionsModal');
const highScoreDisplay = document.getElementById('highScoreDisplay');
const finalScore = document.getElementById('finalScore');
const finalKills = document.getElementById('finalKills');
const bestScoreDisplay = document.getElementById('bestScoreDisplay');
const skillGrid = document.getElementById('skillGrid');
const skillConfirmBtn = document.getElementById('skillConfirmBtn');

// State
let gameState = 'menu';
let gameMode = 'endless';
let score = 0;
let kills = 0;
let highScore = parseInt(localStorage.getItem('gunBattleHighScore')) || 0;
let gameTime = 0;
let bossWave = 0;
let isFullscreen = false;

// Game objects
let player = null;
let enemies = [];
let bullets = [];
let particles = [];
let afterimages = [];
let skillVortex = null;
let keys = {};
let mouse = { x: W/2, y: H/2, down: false, rightDown: false };
let spawnTimer = 0;
let spawnInterval = 60;
let frameCount = 0;
let animFrameId = null;
let timeStopActive = false;
let timeStopTimer = 0;
let timeStopDuration = 0;
let gameSpeed = 1;
let emptyAmmoMsgTimer = 0;

// Skill pool
const SKILL_POOL = [
  { id: 'void', name: '虚化', icon: '👻',
    desc: '消耗1/6能量\n无敌0.7s·完美触发3s\n完美时伤害x1.25' },
  { id: 'timestop', name: '时间停止', icon: '⏱',
    desc: '消耗1/3能量\n暂停时间3秒' },
  { id: 'heal', name: '回血', icon: '❤️',
    desc: '消耗1/2能量\n恢复30%生命值' },
  { id: 'multishot', name: '多重射击', icon: '🔫',
    desc: '消耗1/4能量\n5倍子弹·持续3秒' },
];
let selectedSkills = [];
let skillF = null; // F key skill
let skillE = null; // E key skill

// ============================================================
//  AUDIO
// ============================================================
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }
function playShootSound() {
  try { initAudio(); const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'square'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
    osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.05);
  } catch(e) {}
}
function playHitSound() {
  try { initAudio(); const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
    osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.15);
  } catch(e) {}
}
function playDamageSound() {
  try { initAudio(); const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sine'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
    osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.2);
  } catch(e) {}
}
function playSkillSound() {
  try { initAudio(); const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sine'; osc.frequency.setValueAtTime(100, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime + 0.2);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
    osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.5);
  } catch(e) {}
}
function playExplosionSound() {
  try { initAudio();
    const bufferSize = audioCtx.sampleRate * 0.3;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random()*2-1) * Math.exp(-i/(audioCtx.sampleRate*0.05));
    const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
    noise.connect(gain); gain.connect(audioCtx.destination);
    noise.start(audioCtx.currentTime);
  } catch(e) {}
}
function playVoidSound() {
  try { initAudio(); const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
    osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.3);
  } catch(e) {}
}
function playPerfectVoidSound() {
  try { initAudio(); const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
    osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.4);
  } catch(e) {}
}

// ============================================================
//  PLAYER
// ============================================================
function createPlayer() {
  return {
    x: W/2, y: H/2, size: 16,
    speed: 3.5,
    hp: 100, maxHp: 100,
    ammo: 30, maxAmmo: 30,
    angle: 0,
    energy: 1/3, maxEnergy: 1,
    // Physics
    vx: 0, vy: 0,
    moveDx: 0, moveDy: 0,
    // Void
    voidActive: false, voidTimer: 0, voidPerfect: false, voidDamageBoost: false,
    // Dash
    dashTimer: 0, dashCooldown: 0,
    // Multi-shot
    multiShotActive: false, multiShotTimer: 0,
    // Cooldowns
    shootCooldown: 0, invincibleTimer: 0,
    reloadTimer: 0, isReloading: false,
  };
}

// ============================================================
//  ENEMIES
// ============================================================
function spawnEnemy() {
  const side = Math.floor(Math.random() * 4);
  let x, y; const pad = 30;
  switch (side) {
    case 0: x = Math.random()*W; y = -pad; break;
    case 1: x = W+pad; y = Math.random()*H; break;
    case 2: x = Math.random()*W; y = H+pad; break;
    case 3: x = -pad; y = Math.random()*H; break;
  }
  const wave = Math.floor(gameTime / 600) + 1;
  const types = [
    { size:12, speed:1.8+wave*0.1, hp:50, damage:10, score:15, color:'#3498db' },
    { size:14, speed:0.96+wave*0.064, hp:75, damage:12, score:20, color:'#f1c40f' },
    { size:17, speed:0.6+wave*0.04, hp:125, damage:15, score:30, color:'#e74c3c' },
  ];
  const typeIdx = Math.random() < 0.4 ? 0 : Math.random() < 0.65 ? 1 : 2;
  const type = types[Math.min(typeIdx, types.length-1)];
  return {
    x, y, size: type.size, speed: type.speed, hp: type.hp, maxHp: type.hp,
    damage: type.damage, score: type.score, color: type.color,
    angle: 0, hitFlash: 0, isBoss: false, isTimeStopper: false,
    timeStopUsed: false, // can only use time stop once
    // Physics
    vx: 0, vy: 0, accel: 0.05,
  };
}

function spawnTimeStopEnemy() {
  const side = Math.floor(Math.random() * 4);
  let x, y; const pad = 30;
  switch (side) {
    case 0: x = Math.random()*W; y = -pad; break;
    case 1: x = W+pad; y = Math.random()*H; break;
    case 2: x = Math.random()*W; y = H+pad; break;
    case 3: x = -pad; y = Math.random()*H; break;
  }
  const wave = Math.floor(gameTime / 600) + 1;
  return {
    x, y, size: 16, speed: 0.8+wave*0.06, hp: 80, maxHp: 80,
    damage: 12, score: 40, color: '#8e44ad',
    angle: 0, hitFlash: 0, isBoss: false, isTimeStopper: true,
    timeStopUsed: false,
    vx: 0, vy: 0, accel: 0.05,
  };
}

function spawnBoss() {
  const side = Math.floor(Math.random() * 4);
  let x, y; const pad = 30;
  switch (side) {
    case 0: x = Math.random()*W; y = -pad; break;
    case 1: x = W+pad; y = Math.random()*H; break;
    case 2: x = Math.random()*W; y = H+pad; break;
    case 3: x = -pad; y = Math.random()*H; break;
  }
  bossWave++;
  const wave = bossWave;
  return {
    x, y, size: 22+Math.min(wave,8), speed: Math.min(0.6+wave*0.05, 1.8),
    hp: 150+wave*50, maxHp: 150+wave*50,
    damage: 20+wave*3, score: 100+wave*50,
    color: '#9b59b6', angle: 0, hitFlash: 0, isBoss: true, isTimeStopper: false,
    timeStopUsed: false, bossWave: wave,
    vx: 0, vy: 0, accel: 0.04,
  };
}

// ============================================================
//  BULLET
// ============================================================
function createBullet(px, py, angle) {
  return {
    x: px + Math.cos(angle)*20, y: py + Math.sin(angle)*20,
    vx: Math.cos(angle)*8, vy: Math.sin(angle)*8,
    size: 3, damage: 25, life: 120,
  };
}

// ============================================================
//  PARTICLES
// ============================================================
function spawnParticles(x, y, color, count, spread) {
  for (let i = 0; i < count; i++) {
    const a = Math.random()*Math.PI*2;
    const spd = 1+Math.random()*spread;
    particles.push({
      x, y, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd,
      life: 30+Math.random()*20, maxLife: 50,
      radius: 1.5+Math.random()*2.5, color,
    });
  }
}

// ============================================================
//  SKILL VORTEX (时空间灭相)
// ============================================================
function createVortex(px, py) {
  const s = {
    x: px, y: py, radius: 30, maxRadius: 130,
    duration: 45, maxDuration: 45,
    phase: 'suck', explodeTimer: 0, particles: [], angle: 0,
  };
  for (let i = 0; i < 50; i++) {
    const a = Math.random()*Math.PI*2, r = Math.random()*s.maxRadius;
    s.particles.push({ angle: a, dist: r, size: 2+Math.random()*4, speed: 0.02+Math.random()*0.03 });
  }
  return s;
}

  modeSelectScreen.classList.add('hidden');
  skillSelectScreen.classList.remove('hidden');
  renderSkillGrid();
}

function renderSkillGrid() {
  skillGrid.innerHTML = '';
  selectedSkills = [];
  skillF = null;
  skillE = null;
  skillConfirmBtn.disabled = true;

  SKILL_POOL.forEach(skill => {
    const card = document.createElement('div');
    card.className = 'skill-card';
    card.dataset.id = skill.id;
    card.innerHTML = `
      <div class="skill-icon">${skill.icon}</div>
      <div class="skill-name">${skill.name}</div>
      <div class="skill-desc">${skill.desc.replace(/\n/g, '<br>')}</div>
      <div class="skill-key-hint">点击选择</div>
    `;
    card.onclick = () => toggleSkillSelect(skill.id, card);
    skillGrid.appendChild(card);
  });
}

function toggleSkillSelect(skillId, card) {
  const idx = selectedSkills.indexOf(skillId);
  if (idx !== -1) {
    // Already selected - toggle key binding
    if (selectedSkills.length === 2) {
      // Swap the two skills' keys
      selectedSkills.reverse();
      updateSkillUI();
    } else {
      // Only one selected - deselect it
      selectedSkills.splice(idx, 1);
      card.classList.remove('selected', 'selected-f', 'selected-e');
      card.querySelector('.skill-key-hint').textContent = '点击选择';
    }
  } else {
    if (selectedSkills.length >= 2) return;
    selectedSkills.push(skillId);
  }
  updateSkillUI();
}

function updateSkillUI() {
  // Update key assignments
  if (selectedSkills.length >= 1) skillF = selectedSkills[0];
  else skillF = null;
  if (selectedSkills.length >= 2) skillE = selectedSkills[1];
  else skillE = null;

  // Update all cards
  document.querySelectorAll('.skill-card').forEach(c => {
    c.classList.remove('selected', 'selected-f', 'selected-e');
    const hint = c.querySelector('.skill-key-hint');
    const id = c.dataset.id;
    if (selectedSkills.length >= 1 && selectedSkills[0] === id) {
      c.classList.add('selected', 'selected-f');
      hint.textContent = 'F键';
    } else if (selectedSkills.length >= 2 && selectedSkills[1] === id) {
      c.classList.add('selected', 'selected-e');
      hint.textContent = 'E键';
    } else {
      hint.textContent = '点击选择';
    }
  });
  skillConfirmBtn.disabled = selectedSkills.length !== 2;
}

function confirmSkills() {
  if (selectedSkills.length !== 2) return;
  startGameActual();
}

    else if (gameState === 'paused') { resumeGame(); e.preventDefault(); }

    const skill = skillF;
    if (skill === 'void') activateVoid();
    else if (skill === 'timestop') activateTimeStop();
    else if (skill === 'heal') activateHeal();
    else if (skill === 'multishot') activateMultiShot();
  }
  if (e.key === 'e' && gameState === 'playing' && player && skillE) {
    const skill = skillE;
    if (skill === 'void') activateVoid();
    else if (skill === 'timestop') activateTimeStop();
    else if (skill === 'heal') activateHeal();
    else if (skill === 'multishot') activateMultiShot();
  }
});
document.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const sx = canvas.width/rect.width, sy = canvas.height/rect.height;
  mouse.x = (e.clientX - rect.left)*sx;
  mouse.y = (e.clientY - rect.top)*sy;
});
canvas.addEventListener('mousedown', (e) => {
  if (e.button === 0) { mouse.down = true; e.preventDefault(); }
  if (e.button === 2) { mouse.rightDown = true; e.preventDefault(); }
});
canvas.addEventListener('mouseup', (e) => {

  if (e.button === 2) mouse.rightDown = false;
});
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

// ============================================================
//  SKILL ACTIVATIONS
// ============================================================
function activateVoid() {
  if (!player || player.voidActive) return;
  // Check if perfect void (within 0.1s of being hit = 6 frames)
  if (player.invincibleTimer > 0 && player.invincibleTimer >= 24) {
    // Perfect void!
    player.voidActive = true;
    player.voidTimer = 180; // 3 seconds
    player.voidPerfect = true;
    player.voidDamageBoost = true;
    player.invincibleTimer = 180;
    // Brief time freeze for feedback
    timeStopActive = true;
    timeStopTimer = 10; // ~0.17s freeze
    gameSpeed = 0;
    spawnParticles(player.x, player.y, '#ffffff', 30, 6);
    playPerfectVoidSound();
  } else {
    // Normal void
    if (player.energy < 1/6) return;
    player.energy -= 1/6;
    player.voidActive = true;
    player.voidTimer = 42; // 0.7s
    player.voidPerfect = false;
    player.voidDamageBoost = false;
    player.invincibleTimer = 42;
    spawnParticles(player.x, player.y, '#4ecdc4', 15, 4);
    playVoidSound();
  }
}

function activateTimeStop() {
  if (!player || player.energy < 1/3 || timeStopActive) return;
  player.energy -= 1/3;
  timeStopActive = true;
  timeStopTimer = 180; // 3 seconds
  gameSpeed = 0;
  spawnParticles(player.x, player.y, '#8e44ad', 20, 5);
  playSkillSound();
}

function activateHeal() {
  if (!player || player.energy < 1/2) return;
  player.energy -= 1/2;
  player.hp = Math.min(player.maxHp, player.hp + 30);
  spawnParticles(player.x, player.y, '#e74c3c', 15, 3);
  playSkillSound();
}

function activateMultiShot() {
  if (!player || player.energy < 1/4) return;
  player.energy -= 1/4;
  player.multiShotActive = true;
  player.multiShotTimer = 120; // 2 seconds duration
  playSkillSound();
}

function activateDash() {
  if (!player || player.dashTimer > 0 || player.energy < 1/10) return;
  player.energy -= 1/10;
  const dist = 184;
  player.x += Math.cos(player.angle) * dist;
  player.y += Math.sin(player.angle) * dist;
  player.x = Math.max(player.size, Math.min(W-player.size, player.x));
  player.y = Math.max(player.size, Math.min(H-player.size, player.y));
  player.dashTimer = 8;
  player.invincibleTimer = 6;
  spawnParticles(player.x, player.y, '#4ecdc4', 10, 3);
  playSkillSound();
}

// ============================================================
//  UPDATE
// ============================================================
function update() {
  if (gameState !== 'playing') return;
  frameCount++;

  // Time stop logic
  if (timeStopActive) {
    timeStopTimer--;
    if (timeStopTimer <= 0) {
      timeStopActive = false;
      gameSpeed = 1;
    } else {
      gameSpeed = 0;
    }
  }

  // Enemy time stop ability
  for (const e of enemies) {
    if (e.isTimeStopper && !e.timeStopUsed && !timeStopActive) {
      const dist = Math.sqrt((player.x-e.x)**2 + (player.y-e.y)**2);
      if (dist < 200) {
        e.timeStopUsed = true;
        timeStopActive = true;
        timeStopTimer = 60; // 1 second
        gameSpeed = 0;
        spawnParticles(e.x, e.y, '#8e44ad', 25, 5);
        playSkillSound();
      }
    }
  }

  if (gameSpeed === 0) {
    // Still render particles during time stop
    render();
    return;
  }

  gameTime++;

  // ---- Player Physics ----
  let dx = 0, dy = 0;
  if (keys['w']||keys['arrowup']) dy = -1;
  if (keys['s']||keys['arrowdown']) dy = 1;
  if (keys['a']||keys['arrowleft']) dx = -1;
  if (keys['d']||keys['arrowright']) dx = 1;

  let targetSpeed = player.speed;
  if (keys['shift']) targetSpeed *= 1.3;
  if (player.voidActive && player.voidPerfect) targetSpeed *= 1.3;

  // Acceleration/deceleration
  if (dx !== 0 || dy !== 0) {
    if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }
    player.moveDx = dx;
    player.moveDy = dy;
    // Accelerate toward target velocity
    player.vx += (dx * targetSpeed - player.vx) * 0.15;
    player.vy += (dy * targetSpeed - player.vy) * 0.15;
  } else {
    // Decelerate
    player.vx *= 0.88;
    player.vy *= 0.88;
    if (Math.abs(player.vx) < 0.05) player.vx = 0;
    if (Math.abs(player.vy) < 0.05) player.vy = 0;
  }

  // Turning inertia - reduce speed when turning
  if (dx !== 0 || dy !== 0) {
    const currentAngle = Math.atan2(player.vy, player.vx);
    const targetAngle = Math.atan2(dy, dx);
    let angleDiff = targetAngle - currentAngle;
    if (angleDiff > Math.PI) angleDiff -= Math.PI*2;
    if (angleDiff < -Math.PI) angleDiff += Math.PI*2;
    const turnFactor = 1 - Math.min(Math.abs(angleDiff) / Math.PI, 0.5);
    player.vx *= turnFactor;
    player.vy *= turnFactor;
  }

  player.x += player.vx;
  player.y += player.vy;
  player.x = Math.max(player.size, Math.min(W-player.size, player.x));
  player.y = Math.max(player.size, Math.min(H-player.size, player.y));
  player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

  // ---- Dash (right-click) ----
  if (mouse.rightDown && player.dashCooldown === 0 && player.dashTimer === 0) {
    activateDash();
    mouse.rightDown = false;
  }
  if (player.dashTimer > 0) player.dashTimer--;
  if (player.dashCooldown > 0) player.dashCooldown--;

  // ---- Shooting ----
  if (player.shootCooldown > 0) player.shootCooldown--;
  if (player.reloadTimer > 0) {
    player.reloadTimer--;
    if (player.reloadTimer === 0) { player.ammo = player.maxAmmo; player.isReloading = false; }
  }
  if (mouse.down && player.shootCooldown === 0 && player.ammo > 0 && !player.isReloading) {
    if (player.multiShotActive) {
      for (let i = -2; i <= 2; i++) {
        const a = player.angle + i * 0.08;
        bullets.push(createBullet(player.x, player.y, a));
      }
    } else {
      bullets.push(createBullet(player.x, player.y, player.angle));
    }
    player.ammo--;
    player.shootCooldown = 18;
    playShootSound();
  }
  if (mouse.down && player.ammo === 0 && !player.isReloading && player.shootCooldown === 0) {
    emptyAmmoMsgTimer = 40;
  }
  if (emptyAmmoMsgTimer > 0) emptyAmmoMsgTimer--;
  if (keys['r'] && !player.isReloading && player.reloadTimer === 0 && player.ammo < player.maxAmmo) {
    player.isReloading = true;
    player.reloadTimer = 120;
    keys['r'] = false;
  }

  // ---- Void timer ----
  if (player.voidActive) {
    player.voidTimer--;
    if (player.voidTimer <= 0) {
      player.voidActive = false;
      player.voidPerfect = false;
      player.voidDamageBoost = false;
    }
  }
  if (player.invincibleTimer > 0) player.invincibleTimer--;

  // ---- Multi-shot timer ----
  if (player.multiShotActive) {
    player.multiShotTimer--;
    if (player.multiShotTimer <= 0) player.multiShotActive = false;
  }

  // ---- Afterimages (during void) ----
  if (player.voidActive && (player.vx !== 0 || player.vy !== 0)) {
    if (frameCount % 3 === 0) {
      afterimages.push({
        x: player.x, y: player.y, angle: player.angle, size: player.size,
        life: 15, maxLife: 15,
        alpha: player.voidPerfect ? 0.15 : 0.25,
      });
    }
  }
  for (let i = afterimages.length-1; i >= 0; i--) {
    afterimages[i].life--;
    if (afterimages[i].life <= 0) afterimages.splice(i, 1);
  }

  // ---- Enemy spawn ----
  if (gameMode === 'endless') {
    spawnTimer++;
    const diffMult = 1 + Math.floor(gameTime/1800)*0.2;
    const interval = Math.max(25, Math.floor(spawnInterval/diffMult));
    if (spawnTimer >= interval) {
      spawnTimer = 0;
      enemies.push(spawnEnemy());
      if (Math.random() < gameTime/8000) enemies.push(spawnEnemy());
      // Time-stop enemy at 300+ score
      if (score >= 300 && Math.random() < 0.05) {
        enemies.push(spawnTimeStopEnemy());
      }
    }
  } else if (gameMode === 'boss') {
    if (enemies.length === 0) enemies.push(spawnBoss());
  }

  // ---- Enemy AI ----
  for (let i = enemies.length-1; i >= 0; i--) {
    const e = enemies[i];
    const dx = player.x - e.x, dy = player.y - e.y;
    const dist = Math.sqrt(dx*dx+dy*dy);
    if (dist > 0) {
      // Accelerate toward player
      e.vx += ((dx/dist)*e.speed - e.vx) * e.accel;
      e.vy += ((dy/dist)*e.speed - e.vy) * e.accel;
    }
    e.x += e.vx; e.y += e.vy;
    e.angle = Math.atan2(dy, dx);
    if (e.hitFlash > 0) e.hitFlash--;

    // Enemy-player collision
    const pDist = Math.sqrt((player.x-e.x)**2 + (player.y-e.y)**2);
    if (pDist < player.size + e.size) {
      if (player.invincibleTimer === 0) {
        player.hp -= e.damage;
        player.invincibleTimer = 30;
        playDamageSound();
        spawnParticles(player.x, player.y, '#e94560', 8, 3);
        if (player.hp <= 0) { player.hp = 0; gameOver(); return; }
      }
      if (pDist > 0) { e.x -= (dx/pDist)*10; e.y -= (dy/pDist)*10; }
    }
    if (e.x < -100 || e.x > W+100 || e.y < -100 || e.y > H+100) enemies.splice(i,1);
  }

  // ---- Bullets ----
  for (let i = bullets.length-1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx; b.y += b.vy; b.life--;
    if (b.life <= 0 || b.x < -20 || b.x > W+20 || b.y < -20 || b.y > H+20) {
      bullets.splice(i,1); continue;
    }
    let hit = false;
    for (let j = enemies.length-1; j >= 0; j--) {
      const e = enemies[j];
      const dist = Math.sqrt((b.x-e.x)**2 + (b.y-e.y)**2);
      if (dist < b.size + e.size) {
        let damage = b.damage;
        if (player.voidDamageBoost) damage *= 1.25;
        e.hp -= damage;
        e.hitFlash = 6;
        spawnParticles(b.x, b.y, e.color, 5, 2);
        // Energy gain on hit
        player.energy = Math.min(player.maxEnergy, player.energy + 0.02);
        if (e.hp <= 0) {
          score += e.score; kills++;
          spawnParticles(e.x, e.y, e.color, 15, 4);
          playHitSound();
          // Energy gain on kill: 15%
          player.energy = Math.min(player.maxEnergy, player.energy + 0.15);
          enemies.splice(j, 1);
        }
        hit = true; break;
      }
    }
    if (hit) bullets.splice(i, 1);
  }

  // ---- Vortex skill ----
  if (skillVortex) {
    skillVortex.x = player.x; skillVortex.y = player.y;
    skillVortex.angle += 0.05;
    if (skillVortex.phase === 'suck') {
      skillVortex.duration--;
      skillVortex.radius = skillVortex.maxRadius * (1 - skillVortex.duration/skillVortex.maxDuration);
      for (const e of enemies) {
        const dx = skillVortex.x - e.x, dy = skillVortex.y - e.y;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if (dist < skillVortex.radius + e.size*2) {
          e.x += dx*0.15; e.y += dy*0.15;
          e.hp -= 0.3;
          if (e.hp <= 0) { score += e.score; kills++; spawnParticles(e.x, e.y, e.color, 10, 3); playHitSound(); }
        }
      }
      enemies = enemies.filter(e => e.hp > 0);
      if (skillVortex.duration <= 0) {
        skillVortex.phase = 'explode';
        skillVortex.explodeTimer = 20;
        playExplosionSound();
        for (const e of enemies) {
          const dx = skillVortex.x - e.x, dy = skillVortex.y - e.y;
          if (Math.sqrt(dx*dx+dy*dy) < skillVortex.radius + 30) {
            e.hp -= 50;
            if (e.hp <= 0) { score += e.score; kills++; spawnParticles(e.x, e.y, e.color, 12, 4); playHitSound(); }
          }
        }
        enemies = enemies.filter(e => e.hp > 0);
        spawnParticles(skillVortex.x, skillVortex.y, '#ffffff', 30, 6);
      }
    } else if (skillVortex.phase === 'explode') {
      skillVortex.explodeTimer--;
      skillVortex.radius += 5;
      if (skillVortex.explodeTimer <= 0) skillVortex = null;
    }
  }

  // ---- Particles ----
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.95; p.vy *= 0.95;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// ============================================================
//  RENDER
// ============================================================
function render() {
  ctx.clearRect(0, 0, W, H);

  // Background grid
  ctx.strokeStyle = 'rgba(15,52,96,0.15)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  // Time stop overlay
  if (timeStopActive) {
    ctx.fillStyle = 'rgba(142,68,173,0.08)';
    ctx.fillRect(0, 0, W, H);
  }

  // Vortex
  if (skillVortex && skillVortex.phase === 'suck') {
    ctx.save();
    ctx.filter = 'grayscale(1) contrast(1.5)';
    ctx.globalAlpha = 0.9;
    for (const p of skillVortex.particles) {
      const ang = p.angle + skillVortex.angle*p.dist*0.02;
      const px = skillVortex.x + Math.cos(ang)*p.dist*(skillVortex.radius/skillVortex.maxRadius);
      const py = skillVortex.y + Math.sin(ang)*p.dist*(skillVortex.radius/skillVortex.maxRadius);
      const gray = Math.floor(180 + Math.sin(p.angle+skillVortex.angle*3)*75);
      ctx.fillStyle = `rgb(${gray},${gray},${gray})`;
      ctx.beginPath(); ctx.arc(px, py, p.size*(skillVortex.radius/skillVortex.maxRadius), 0, Math.PI*2); ctx.fill();
      p.angle += p.speed;
    }
    ctx.strokeStyle = 'rgba(200,200,200,0.6)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(skillVortex.x, skillVortex.y, skillVortex.radius, 0, Math.PI*2); ctx.stroke();
    ctx.strokeStyle = 'rgba(200,200,200,0.3)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(skillVortex.x, skillVortex.y, skillVortex.radius*0.6, 0, Math.PI*2); ctx.stroke();
    for (let i = 0; i < 4; i++) {
      const sa = skillVortex.angle + i*Math.PI/2;
      ctx.strokeStyle = 'rgba(200,200,200,0.2)'; ctx.lineWidth = 1; ctx.beginPath();
      for (let r = 0; r < skillVortex.radius; r += 2) ctx.lineTo(skillVortex.x+Math.cos(sa+r*0.08)*r, skillVortex.y+Math.sin(sa+r*0.08)*r);
      ctx.stroke();
    }
    ctx.restore();
  }
  if (skillVortex && skillVortex.phase === 'explode') {
    ctx.save();
    ctx.globalCompositeOperation = 'difference';
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(skillVortex.x, skillVortex.y, skillVortex.radius, 0, Math.PI*2); ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
    const alpha = skillVortex.explodeTimer/20;
    ctx.strokeStyle = `rgba(255,255,255,${alpha})`; ctx.lineWidth = 3*alpha;
    ctx.beginPath(); ctx.arc(skillVortex.x, skillVortex.y, skillVortex.radius, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  // Afterimages
  for (const a of afterimages) {
    ctx.save();
    ctx.globalAlpha = a.alpha * (a.life/a.maxLife);
    ctx.translate(a.x, a.y);
    ctx.rotate(a.angle);
    ctx.fillStyle = '#4ecdc4';
    ctx.fillRect(-a.size+2, -a.size+2, a.size*2-4, a.size*2-4);
    ctx.restore();
  }

  // Enemies
  for (const e of enemies) {
    ctx.save();
    if (e.hitFlash > 0) ctx.filter = 'brightness(2)';
    if (e.isBoss) {
      ctx.shadowColor = '#9b59b6'; ctx.shadowBlur = 25;
      ctx.strokeStyle = 'rgba(155,89,182,0.3)'; ctx.lineWidth = 2;
      ctx.strokeRect(e.x-e.size-6, e.y-e.size-6, e.size*2+12, e.size*2+12);
      ctx.shadowBlur = 0;
    }
    if (e.isTimeStopper) {
      ctx.shadowColor = '#8e44ad'; ctx.shadowBlur = 20;
      ctx.strokeStyle = 'rgba(142,68,173,0.4)'; ctx.lineWidth = 2;
      ctx.strokeRect(e.x-e.size-6, e.y-e.size-6, e.size*2+12, e.size*2+12);
      ctx.shadowBlur = 0;
    }
    ctx.translate(e.x, e.y);
    ctx.rotate(e.angle);
    ctx.shadowColor = e.color; ctx.shadowBlur = e.isBoss ? 20 : 10;
    // Treads
    ctx.fillStyle = '#2a2a3a';
    ctx.fillRect(-e.size-3, -e.size*0.7, 5, e.size*1.4);
    ctx.fillRect(e.size-2, -e.size*0.7, 5, e.size*1.4);
    ctx.fillStyle = '#3a3a4a';
    for (let t = -4; t < 4; t++) {
      const ty = t*e.size*0.35;
      ctx.fillRect(-e.size-2, ty-1, 3, 2);
      ctx.fillRect(e.size-1, ty-1, 3, 2);
    }
    ctx.shadowBlur = 0;
    // Body
    ctx.fillStyle = e.color;
    ctx.fillRect(-e.size+2, -e.size+2, e.size*2-4, e.size*2-4);
    ctx.strokeStyle = e.isBoss ? 'rgba(255,215,0,0.5)' : e.isTimeStopper ? 'rgba(142,68,173,0.5)' : 'rgba(0,0,0,0.3)';
    ctx.lineWidth = e.isBoss||e.isTimeStopper ? 2 : 1;
    ctx.strokeRect(-e.size+2, -e.size+2, e.size*2-4, e.size*2-4);
    // Turret
    ctx.fillStyle = e.isBoss ? '#4a2a6a' : e.isTimeStopper ? '#3a1a4a' : '#2a2a3a';
    const tw = e.size*0.7, th = e.size*0.5;
    ctx.fillRect(-tw/2, -th/2, tw, th);
    // Barrel
    ctx.strokeStyle = e.isBoss ? '#ddaa00' : e.isTimeStopper ? '#c080e0' : '#555';
    ctx.lineWidth = e.isBoss||e.isTimeStopper ? 5 : 4;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(e.size*1.2,0); ctx.stroke();
    ctx.fillStyle = e.isBoss ? '#cc8800' : e.isTimeStopper ? '#a060c0' : '#444';
    ctx.fillRect(e.size*1.0, -3, e.size*0.3, 6);
    // Eyes
    ctx.fillStyle = '#fff';
    ctx.fillRect(tw*0.2, -4, 4, 4);
    ctx.fillRect(tw*0.2, 1, 4, 4);
    ctx.fillStyle = '#000';
    ctx.fillRect(tw*0.2+1, -3, 2, 2);
    ctx.fillRect(tw*0.2+1, 2, 2, 2);
    // Boss crown
    if (e.isBoss) {
      ctx.fillStyle = '#ffd700';
      const ch = e.size*0.3, cw = e.size*0.5;
      ctx.beginPath();
      ctx.moveTo(-cw, -e.size-2); ctx.lineTo(-cw*0.6, -e.size-ch-2);
      ctx.lineTo(-cw*0.2, -e.size-2); ctx.lineTo(0, -e.size-ch-4);
      ctx.lineTo(cw*0.2, -e.size-2); ctx.lineTo(cw*0.6, -e.size-ch-2);
      ctx.lineTo(cw, -e.size-2); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#aa8800'; ctx.lineWidth = 1; ctx.stroke();
    }
    // Time stopper icon
    if (e.isTimeStopper) {
      ctx.fillStyle = !e.timeStopUsed ? '#fff' : '#666';
      ctx.font = '10px "Press Start 2P"';
      ctx.textAlign = 'center';
      ctx.fillText('⏱', 0, -e.size-8);
    }
    ctx.restore();
    // HP bar
    if (e.maxHp > 1) {
      ctx.save();
      const bw = e.size*2, bh = e.isBoss ? 5 : 3;
      const bx = e.x-bw/2, by = e.y-e.size-(e.isBoss?16:10);
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = e.isBoss ? '#ffd700' : e.isTimeStopper ? '#8e44ad' : '#4ecdc4';
      ctx.fillRect(bx, by, bw*(e.hp/e.maxHp), bh);
      ctx.restore();
    }
  }

  // Bullets
  for (const b of bullets) {
    ctx.save();
    ctx.fillStyle = '#ffdd57'; ctx.shadowColor = '#ffdd57'; ctx.shadowBlur = 8;
    ctx.fillRect(b.x-3, b.y-3, 6, 6);
    ctx.restore();
  }

  // Player
  if (player) {
    ctx.save();
    // Void glow
    if (player.voidActive) {
      ctx.shadowColor = player.voidPerfect ? '#ffffff' : '#4ecdc4';
      ctx.shadowBlur = player.voidPerfect ? 30 : 20;
      ctx.strokeStyle = player.voidPerfect ? 'rgba(255,255,255,0.5)' : 'rgba(78,205,196,0.4)';
      ctx.lineWidth = 2;
      ctx.strokeRect(player.x-player.size-8, player.y-player.size-8, player.size*2+16, player.size*2+16);
      ctx.shadowBlur = 0;
    }
    // Invincibility flash
    if (player.invincibleTimer > 0 && player.invincibleTimer % 4 < 2 && !player.voidActive) {
      ctx.globalAlpha = 0.5;
    }
    // Void color shift
    if (player.voidActive && player.voidPerfect) {
      ctx.filter = 'hue-rotate(180deg) brightness(1.3)';
    }
    ctx.translate(player.x, player.y);
    ctx.rotate(player.angle);
    ctx.shadowColor = player.voidActive ? (player.voidPerfect ? '#fff' : '#4ecdc4') : '#4ecdc4';
    ctx.shadowBlur = player.voidActive ? 20 : 15;
    // Treads
    ctx.fillStyle = player.voidActive ? '#1a3a3a' : '#2a2a3a';
    ctx.fillRect(-player.size-3, -player.size*0.7, 5, player.size*1.4);
    ctx.fillRect(player.size-2, -player.size*0.7, 5, player.size*1.4);
    ctx.fillStyle = player.voidActive ? '#2a4a4a' : '#3a3a4a';
    for (let t = -4; t < 4; t++) {
      const ty = t*player.size*0.35;
      ctx.fillRect(-player.size-2, ty-1, 3, 2);
      ctx.fillRect(player.size-1, ty-1, 3, 2);
    }
    ctx.shadowBlur = 0;
    // Body
    ctx.fillStyle = player.voidActive ? (player.voidPerfect ? '#8e44ad' : '#4ecdc4') : '#4ecdc4';
    ctx.fillRect(-player.size+2, -player.size+2, player.size*2-4, player.size*2-4);
    ctx.strokeStyle = player.voidActive ? 'rgba(255,255,255,0.4)' : 'rgba(0,0,0,0.3)';
    ctx.lineWidth = player.voidActive ? 2 : 1;
    ctx.strokeRect(-player.size+2, -player.size+2, player.size*2-4, player.size*2-4);
    // Turret
    ctx.fillStyle = player.voidActive ? (player.voidPerfect ? '#5a2a7a' : '#2a6a6a') : '#2a6a6a';
    const tw = player.size*0.7, th = player.size*0.5;
    ctx.fillRect(-tw/2, -th/2, tw, th);
    // Barrel
    ctx.strokeStyle = player.voidActive ? (player.voidPerfect ? '#dda0ff' : '#ccc') : '#aaa';
    ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(player.size*1.4, 0); ctx.stroke();
    ctx.fillStyle = player.voidActive ? (player.voidPerfect ? '#bb80dd' : '#999') : '#888';
    ctx.fillRect(player.size*1.1, -4, player.size*0.4, 8);
    // Eyes
    ctx.fillStyle = '#fff';
    ctx.fillRect(tw*0.2, -5, 5, 5);
    ctx.fillRect(tw*0.2, 1, 5, 5);
    ctx.fillStyle = player.voidActive ? '#e94560' : '#000';
    ctx.fillRect(tw*0.2+1, -4, 3, 3);
    ctx.fillRect(tw*0.2+1, 2, 3, 3);
    ctx.restore();
  }

  // Particles
  for (const p of particles) {
    ctx.globalAlpha = p.life/p.maxLife;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.radius*(p.life/p.maxLife), 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  drawHUD();
}

// ============================================================
//  HUD
// ============================================================
function drawHUD() {
  if (!player) return;
  ctx.save();
  ctx.font = '11px "Press Start 2P"';

  // ---- HP Bar ----
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(10, 10, 204, 18);
  const hpPct = player.hp/player.maxHp;
  const hpColor = hpPct > 0.5 ? '#4ecdc4' : hpPct > 0.25 ? '#ffdd57' : '#e94560';
  ctx.fillStyle = hpColor;
  ctx.fillRect(12, 12, 200*hpPct, 14);
  ctx.strokeStyle = '#0f3460'; ctx.lineWidth = 1;
  ctx.strokeRect(10, 10, 204, 18);
  ctx.fillStyle = '#fff';
  ctx.fillText(`HP ${Math.ceil(player.hp)}`, 16, 25);

  // ---- Energy Bar (top-left) ----
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(10, 34, 204, 12);
  const energyPct = player.energy/player.maxEnergy;
  ctx.fillStyle = energyPct > 0.5 ? '#4ecdc4' : energyPct > 0.25 ? '#ffdd57' : '#e94560';
  ctx.fillRect(12, 36, 200*energyPct, 8);
  ctx.strokeStyle = '#0f3460'; ctx.lineWidth = 1;
  ctx.strokeRect(10, 34, 204, 12);
  ctx.fillStyle = '#aaa';
  ctx.font = '8px "Press Start 2P"';
  ctx.fillText(`能量 ${Math.floor(energyPct*100)}%`, 14, 45);
  ctx.font = '11px "Press Start 2P"';

  // ---- Score ----
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.fillText(`SCORE: ${score}`, W/2, 24);

  // ---- Mode ----
  ctx.textAlign = 'right';
  const modeLabel = gameMode === 'endless' ? '无尽' : 'Boss战';
  if (gameMode === 'boss') ctx.fillText(`${modeLabel} 第${bossWave}波`, W-10, 24);
  else { const wave = Math.floor(gameTime/600)+1; ctx.fillText(`${modeLabel} 第${wave}波`, W-10, 24); }

  // ---- Ammo ----
  ctx.textAlign = 'left';
  ctx.fillStyle = player.isReloading ? '#e94560' : '#fff';
  ctx.fillText(player.isReloading ? 'RELOAD...' : `AMMO: ${player.ammo}/${player.maxAmmo}`, 10, 65);

  // Empty ammo warning
  if (emptyAmmoMsgTimer > 0) {
    ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(233,69,96,${emptyAmmoMsgTimer/40})`;
    ctx.shadowColor = '#e94560'; ctx.shadowBlur = 15;
    ctx.font = '13px "Press Start 2P"';
    ctx.fillText('弹夹空! 按 R 换弹', W/2, 95);
    ctx.shadowBlur = 0;
    ctx.font = '11px "Press Start 2P"';
  }

  // ---- Skills status ----
  ctx.textAlign = 'center';
  let yOff = 50;
  function drawSkillStatus(key, skillId, yPos) {
    const label = key.toUpperCase();
    if (skillId === 'void') {
      if (player.voidActive) {
        ctx.fillStyle = '#ffffff'; ctx.shadowColor = '#fff'; ctx.shadowBlur = 10;
        ctx.fillText(player.voidPerfect ? '! 完美虚化 !' : '虚化中', W/2, yPos);
        ctx.shadowBlur = 0;
      } else {
        const canUse = player.energy >= 1/6;
        ctx.fillStyle = canUse ? '#4ecdc4' : '#4a4a7a';
        ctx.fillText(`[${label}] 虚化`, W/2, yPos);
      }
      return 18;
    } else if (skillId === 'timestop') {
      const canUse = player.energy >= 1/3 && !timeStopActive;
      ctx.fillStyle = canUse ? '#8e44ad' : '#4a4a7a';
      ctx.fillText(`[${label}] 时间停止`, W/2, yPos);
      return 18;
    } else if (skillId === 'heal') {
      const canUse = player.energy >= 1/2;
      ctx.fillStyle = canUse ? '#e74c3c' : '#4a4a7a';
      ctx.fillText(`[${label}] 回血`, W/2, yPos);
      return 18;
    } else if (skillId === 'multishot') {
      const canUse = player.energy >= 1/4;
      ctx.fillStyle = player.multiShotActive ? '#ffdd57' : (canUse ? '#aaa' : '#4a4a7a');
      ctx.fillText(player.multiShotActive ? '多重射击中' : `[${label}] 多重射击`, W/2, yPos);
      return 18;
    }
    return 0;
  }

  if (skillF) yOff += drawSkillStatus('f', skillF, yOff);
  if (skillE) yOff += drawSkillStatus('e', skillE, yOff);

  // Time stop countdown
  if (timeStopActive) {
    ctx.fillStyle = '#8e44ad';
    ctx.shadowColor = '#8e44ad'; ctx.shadowBlur = 15;
    ctx.font = '18px "Press Start 2P"';
    ctx.fillText(`⏱ ${Math.ceil(timeStopTimer/60)}`, W/2, H/2-40);
    ctx.shadowBlur = 0;
    ctx.font = '11px "Press Start 2P"';
  }

  // ---- Kills ----
  ctx.textAlign = 'right';
  ctx.fillStyle = '#aaa';
  ctx.font = '9px "Press Start 2P"';
  ctx.fillText(`击杀: ${kills}`, W-10, 50);
  ctx.font = '11px "Press Start 2P"';

  // ---- Crosshair ----
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1;
  const cx=mouse.x, cy=mouse.y;
  ctx.beginPath(); ctx.moveTo(cx-8,cy); ctx.lineTo(cx-3,cy);
  ctx.moveTo(cx+3,cy); ctx.lineTo(cx+8,cy);
  ctx.moveTo(cx,cy-8); ctx.lineTo(cx,cy-3);
  ctx.moveTo(cx,cy+3); ctx.lineTo(cx,cy+8); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.beginPath(); ctx.arc(cx,cy,10,0,Math.PI*2); ctx.stroke();

  ctx.restore();
}

// ============================================================
//  GAME LOOP
// ============================================================
function gameLoop() {
  update();
  render();
  if (gameState === 'playing' || gameState === 'paused') {
    animFrameId = requestAnimationFrame(gameLoop);
  } else {
    render();
  }
}

// ============================================================
//  INIT
// ============================================================
highScoreDisplay.textContent = highScore;
showMenu();
</script>
