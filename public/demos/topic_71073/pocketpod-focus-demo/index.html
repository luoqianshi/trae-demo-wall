    });
    html += '</div></div>';
    // Display
    html += '<div class="setting-section"><h5>显示</h5>';
    html += '<div class="setting-row"><span>亮度</span><div class="setting-slider"><div class="slider-track"><div class="slider-fill" style="width:' + state.brightness + '%"></div></div><span class="slider-val">' + state.brightness + '%</span></div></div>';
    html += '<div class="setting-row"><span>字体大小</span><div class="setting-slider"><div class="slider-track"><div class="slider-fill" style="width:' + ((state.readerSize-12)/10*100) + '%"></div></div><span class="slider-val">' + state.readerSize + 'px</span></div></div>';
    html += '<div class="setting-row"><span>行间距</span><div class="setting-slider"><div class="slider-track"><div class="slider-fill" style="width:' + ((state.lineSpacing-1.0)/1.0*100) + '%"></div></div><span class="slider-val">' + state.lineSpacing.toFixed(1) + '</span></div></div>';
    html += '</div>';
    // Playback
    html += '<div class="setting-section"><h5>播放</h5>';
    html += '<div class="setting-row"><span>随机播放</span><div class="toggle-switch ' + (state.shuffleMode ? 'on' : '') + '" onclick="app.toggleShuffle()"><div class="toggle-knob"></div></div></div>';
    html += '<div class="setting-row"><span>循环模式</span><span style="font-size:12px;color:var(--text-secondary)">' + (state.loopMode==='list'?'列表循环':state.loopMode==='single'?'单曲循环':'不循环') + '</span></div>';
    html += '</div>';
    // About
    html += '<div class="setting-section"><h5>关于</h5>';
    html += '<div class="about-info">';
    html += '<div class="about-row"><span>版本</span><span>1.0.0</span></div>';
    html += '<div class="about-row"><span>存储使用</span><span>' + usedStorage + ' KB</span></div>';
    html += '<div class="about-row"><span>歌曲</span><span>' + songs.length + ' 首</span></div>';
    html += '<div class="about-row"><span>书籍</span><span>' + books.length + ' 本</span></div>';
    html += '<div class="about-row"><span>笔记</span><span>' + (state.notes ? state.notes.length + ' 字' : '0 字') + '</span></div>';
    html += '</div></div>';
    // Data
    html += '<div class="setting-section"><h5>数据</h5>';
    html += '<div class="setting-row" style="cursor:pointer" onclick="app.exportData()"><span>导出所有数据</span><span style="color:var(--primary);font-size:12px">JSON</span></div>';
    html += '<div class="setting-row" style="cursor:pointer;color:var(--accent-coral)" onclick="app.resetAll()"><span>重置所有数据</span><span style="font-size:12px">谨慎操作</span></div>';
    html += '</div>';
    // Privacy
    html += '<div class="setting-section"><h5>隐私与数据</h5><ul class="privacy-list">';
    ['本地优先，所有数据存储在设备上','无需注册账号','无广告，无推广','无行为追踪','不上传任何个人数据'].forEach(p => {
      html += '<li><span class="check">✓</span> ' + p + '</li>';
    });
    html += '</ul></div></div>';
    $('#screenContent').innerHTML = html;
    setInfoPlain('Settings', '切换主题、调整显示与播放设置、查看设备信息、导出或重置数据。');
  }

  function enterModule() {
    const m = modules[state.menuIndex];
    state.previousView = state.appView;
    state.appView = null;
    state.currentModule = m.id;
    switch(m.id) {
      case 'nowplaying': renderNowPlaying(); break;
      case 'coverflow': renderCoverFlow(); break;
      case 'library': renderLibrary(); break;
      case 'workouts': renderWorkouts(); break;
      case 'reader': renderReader(); break;
      case 'capture': renderCapture(); break;
      case 'settings': renderSettings(); break;
    }
  }

  function backToMenu() {
    if (state.currentModule) {
      if (state.currentModule === 'nowplaying') {
        clearInterval(lyricTimer);
        clearInterval(progressTimer);
      }
      if (state.workoutActive) {
        clearInterval(workoutTimer);
        workoutTimer = null;
      }
      if (state.recording) {
        state.recording = false;
        state.recordingStart = 0;
      }
      state.currentModule = null;
      // Go back to where we came from
      if (state.previousView === 'home') {
        state.appView = 'home';
        transitionTo(renderHome);
      } else {
        state.appView = 'menu';
        transitionTo(renderMenu);
      }
    } else if (state.appView === 'menu') {
      transitionTo(renderHome);
    }
  }

  function startLyricSync() {
    clearInterval(lyricTimer);
    clearInterval(progressTimer);
    if (!state.isPlaying) return;
    // progress timer: update every second
    progressTimer = setInterval(() => {
      state.playProgress += 1;
      if (state.playProgress >= songs[state.songIndex].duration) {
        state.playProgress = 0;
        state.lyricIndex = 0;
        app.nextSong();
      }
      if (state.currentModule === 'nowplaying') renderNowPlaying();
    }, 1000);
    // lyric timer: switch every 45 seconds (225s / 5 lyrics = 45s each)
    lyricTimer = setInterval(() => {
      state.lyricIndex = (state.lyricIndex + 1) % lyrics.length;
      if (state.currentModule === 'nowplaying' && state.npMode === 'lyrics') renderNowPlaying();
    }, 45000);
  }

  function stopLyricSync() {
    clearInterval(lyricTimer);
    clearInterval(progressTimer);
  }

  function handleWheel(action) {
    flashWheel(action);
    if (!state.currentModule) {
      if (state.appView === 'home') {
        if (action === 'prev') {
          state.homeIndex = (state.homeIndex - 1 + carouselItems.length) % carouselItems.length;
          transitionTo(renderHome);
        } else if (action === 'next') {
          state.homeIndex = (state.homeIndex + 1) % carouselItems.length;
          transitionTo(renderHome);
        } else if (action === 'center') {
          const item = carouselItems[state.homeIndex];
          app.goModule(item.id);
        } else if (action === 'play') {
          if (carouselItems[state.homeIndex].id === 'nowplaying') {
            app.goModule('nowplaying');
            app.togglePlay();
          }
        } else if (action === 'menu') {
          // Already on home, show brief hint
          const hint = document.querySelector('.home-hint');
          if (hint) { hint.textContent = '已在首页'; hint.style.color = 'var(--primary)'; setTimeout(function(){ hint.textContent = '当前选中：' + carouselItems[state.homeIndex].name; hint.style.color = ''; }, 1200); }
        }
        return;
      }
      if (action === 'prev') { state.menuIndex = (state.menuIndex - 1 + modules.length) % modules.length; transitionTo(renderMenu); }
      else if (action === 'next') { state.menuIndex = (state.menuIndex + 1) % modules.length; transitionTo(renderMenu); }
      else if (action === 'center') { enterModule(); }
      else if (action === 'menu' && state.appView === 'menu') { transitionTo(renderHome); }
      return;
    }
    switch(state.currentModule) {
      case 'nowplaying':
        if (action === 'prev') app.prevSong();
        else if (action === 'next') app.nextSong();
        else if (action === 'play') app.togglePlay();
        else if (action === 'center') app.toggleNpMode();
        else if (action === 'menu') backToMenu();
        break;
      case 'coverflow':
        if (action === 'prev') { state.coverIndex = (state.coverIndex - 1 + albums.length) % albums.length; transitionTo(renderCoverFlow); }
        else if (action === 'next') { state.coverIndex = (state.coverIndex + 1) % albums.length; transitionTo(renderCoverFlow); }
        else if (action === 'center') { app.playItem(albums[state.coverIndex].title); }
        else if (action === 'menu') backToMenu();
        break;
      case 'workouts':
        if (action === 'play' || action === 'center') app.toggleWorkout();
        else if (action === 'menu') backToMenu();
        break;
      case 'reader':
        if (action === 'prev') app.readerPage(-1);
        else if (action === 'next') app.readerPage(1);
        else if (action === 'center') app.changeBook(1);
        else if (action === 'menu') backToMenu();
        break;
      case 'capture':
        if (action === 'menu') backToMenu();
        break;
      case 'library':
      case 'settings':
        if (action === 'menu') backToMenu();
        break;
    }
  }

  // Bind wheel events
  $$('.wheel-btn, .wheel-center').forEach(btn => {
    btn.classList.add('ripple');
    btn.addEventListener('click', () => {
      const action = btn.dataset.action;
      handleWheel(action);
    });
  });

  window.app = {
    prevSong() {
      if (state.shuffleMode) {
        state.songIndex = Math.floor(Math.random() * songs.length);
      } else if (state.loopMode === 'single') {
        // stay
      } else {
        state.songIndex = (state.songIndex - 1 + songs.length) % songs.length;
      }
      state.playProgress = 0;
      state.lyricIndex = 0;
      saveState();
      renderNowPlaying();
    },
    nextSong() {
      if (state.shuffleMode) {
        state.songIndex = Math.floor(Math.random() * songs.length);
      } else if (state.loopMode === 'single') {
        // stay on same song
      } else {
        state.songIndex = (state.songIndex + 1) % songs.length;
      }
      state.playProgress = 0;
      state.lyricIndex = 0;
      saveState();
      renderNowPlaying();
    },
    togglePlay() {
      state.isPlaying = !state.isPlaying;
      if (state.isPlaying) {
        startLyricSync();
      } else {
        stopLyricSync();
        saveState();
      }
      renderNowPlaying();
    },
    toggleNpMode() {
      state.npMode = state.npMode === 'cover' ? 'lyrics' : 'cover';
      saveState();
      renderNowPlaying();
    },
    setLibTab(tab) { state.libTab = tab; renderLibrary(); },
    toggleWorkout() {
      if (state.workoutActive) {
        state.workoutActive = false;
        const elapsed = Math.floor((Date.now()-state.workoutStart)/1000);
        state.workoutElapsed += elapsed;
        clearInterval(workoutTimer);
        // Record session
        addFocusSession(Math.round(elapsed / 60));
      } else {
        state.workoutActive = true;
        state.workoutStart = Date.now();
        workoutTimer = setInterval(() => { if (state.currentModule==='workouts') { renderWorkouts(); const wt = document.querySelector('.workout-time'); if (wt) { wt.classList.add('changed'); setTimeout(function(){ wt.classList.remove('changed'); }, 250); } } }, 1000);
      }
      renderWorkouts();
    },
    changeReaderSize(delta) {
      state.readerSize = Math.max(12, Math.min(22, state.readerSize + delta));
      saveState();
      renderReader();
    },
    setCaptureTool(tool) { state.captureTool = tool; renderCapture(); },
    updateNotes(val) { state.notes = val; saveState(); },
    toggleRecording() {
      if (state.recording) {
        // Stop recording and save
        const duration = Math.floor((Date.now() - state.recordingStart) / 1000);
        state.recordings.push({ date: new Date().toISOString(), duration: duration });
        state.recording = false;
        state.recordingStart = 0;
      } else {
        state.recording = true;
        state.recordingStart = Date.now();
      }
      renderCapture();
    },
    setTheme(id) {
      state.theme = id;
      document.body.className = id === 'classic-white' ? '' : 'theme-' + id;
      saveState();
      if (state.currentModule === 'settings') renderSettings();
    },
    goModule(moduleId) {
      state.previousView = state.appView;
      state.appView = null;
      state.menuIndex = modules.findIndex(m => m.id === moduleId);
      state.currentModule = moduleId;
      switch(moduleId) {
        case 'nowplaying': renderNowPlaying(); break;
        case 'coverflow': renderCoverFlow(); break;
        case 'library': renderLibrary(); break;
        case 'workouts': renderWorkouts(); break;
        case 'reader': renderReader(); break;
        case 'capture': renderCapture(); break;
        case 'settings': renderSettings(); break;
      }
    },
    playItem(title) {
      state.previousView = state.appView || 'home';
      state.appView = null;
      state.currentModule = 'nowplaying';
      state.npMode = 'cover';
      state.isPlaying = true;
      state.playProgress = 0;
      state.lyricIndex = 0;
      startLyricSync();
      renderNowPlaying();
      saveState();
    },
    readerPage(delta) {
      state.readerPage = Math.max(0, (state.readerPage || 0) + delta);
      renderReader();
    },
    changeBook(delta) {
      state.bookIndex = (state.bookIndex + delta + books.length) % books.length;
      state.readerPage = 0;
      saveState();
      renderReader();
    },
    toggleCalItem(idx) {
      calendarItems[idx].done = !calendarItems[idx].done;
      saveState();
      renderCapture();
    },
    toggleShuffle() {
      state.shuffleMode = !state.shuffleMode;
      saveState();
      if (state.currentModule === 'settings') renderSettings();
    },
    exportData() {
      const data = {
        pocketpod: true,
        exportDate: new Date().toISOString(),
        state: state,
        calendarItems: calendarItems,
        songs: songs.length,
        books: books.length
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'pocketpod-backup-' + new Date().toISOString().slice(0,10) + '.json';
      a.click();
      URL.revokeObjectURL(url);
      if (state.currentModule === 'settings') renderSettings();
    },
    resetAll() {
      if (!confirm('确定要重置所有数据吗？此操作不可撤销。')) return;
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    },
    takePhoto() {
      const flash = document.querySelector('.camera-flash');
      if (flash) {
        flash.style.opacity = '0.8';
        setTimeout(function() { flash.style.opacity = '0'; }, 150);
      }
      state.photos.push(Date.now());
      renderCapture();
    },
    hasBookmark() {
      return state.bookmarks.indexOf(state.bookIndex + ':' + state.readerPage) >= 0;
    },
    toggleBookmark() {
      const key = state.bookIndex + ':' + state.readerPage;
      const idx = state.bookmarks.indexOf(key);
      if (idx >= 0) state.bookmarks.splice(idx, 1);
      else state.bookmarks.push(key);
      saveState();
      renderReader();
    },
    setWorkoutType(type) {
      state.workoutType = type;
      saveState();
      if (state.currentModule === 'workouts') renderWorkouts();
    },
    exportNotes() {
      if (!state.notes) return;
      const blob = new Blob([state.notes], {type: 'text/plain'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'pocketpod-notes-' + new Date().toISOString().slice(0,10) + '.txt';
      a.click();
      URL.revokeObjectURL(url);
    }
  };

  // Recording timer
  let recordTimer = setInterval(function() {
    if (state.recording && state.currentModule === 'capture' && state.captureTool === 'voice') {
      const elapsed = Math.floor((Date.now() - state.recordingStart) / 1000);
      const el = document.getElementById('recordingTime');
      if (el) el.textContent = formatTime(elapsed);
    }
  }, 1000);

  // ===== Touch Swipe Support =====
  let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
  const SWIPE_THRESHOLD = 40;
  const SWIPE_TIME_LIMIT = 400;

  function getSwipeAction(view, moduleId, dx, dy) {
    const absX = Math.abs(dx), absY = Math.abs(dy);
    if (absX < SWIPE_THRESHOLD && absY < SWIPE_THRESHOLD) return null;
    if (absX > absY) {
      // Horizontal swipe
      if (dx > 0) {
        if (moduleId === 'nowplaying') return 'next';
        if (moduleId === 'reader') return 'reader_next';
        if (moduleId === 'coverflow') return 'cover_next';
        if (view === 'home') return 'next';
        return 'next';
      } else {
        if (moduleId === 'nowplaying') return 'prev';
        if (moduleId === 'reader') return 'reader_prev';
        if (moduleId === 'coverflow') return 'cover_prev';
        if (view === 'home') return 'prev';
        return 'prev';
      }
    } else {
      // Vertical swipe
      if (dy > 0) {
        // Swipe down
        if (moduleId === 'nowplaying') return 'np_mode_down';
        return null;
      } else {
        // Swipe up
        if (moduleId === 'nowplaying') return 'np_mode_up';
        return null;
      }
    }
  }

  const screenEl = document.querySelector('.screen');
  if (screenEl) {
    screenEl.addEventListener('touchstart', function(e) {
      const t = e.touches[0];
      touchStartX = t.clientX;
      touchStartY = t.clientY;
      touchStartTime = Date.now();
    }, {passive: true});

    screenEl.addEventListener('touchmove', function(e) {
      const t = e.touches[0];
      const dx = t.clientX - touchStartX;
      const dy = t.clientY - touchStartY;
      const sc = document.querySelector('.screen-content');
      if (!sc) return;
      sc.classList.remove('swiping-left','swiping-right','swiping-up','swiping-down');
      if (Math.abs(dx) > 15 && Math.abs(dx) > Math.abs(dy)) {
        sc.classList.add(dx > 0 ? 'swiping-right' : 'swiping-left');
      } else if (Math.abs(dy) > 15 && Math.abs(dy) > Math.abs(dx)) {
        sc.classList.add(dy > 0 ? 'swiping-down' : 'swiping-up');
      }
    }, {passive: true});

    screenEl.addEventListener('touchend', function(e) {
      const t = e.changedTouches[0];
      const dx = t.clientX - touchStartX;
      const dy = t.clientY - touchStartY;
      const dt = Date.now() - touchStartTime;
      const sc = document.querySelector('.screen-content');
      if (sc) sc.classList.remove('swiping-left','swiping-right','swiping-up','swiping-down');
      if (dt > SWIPE_TIME_LIMIT) return;
      const action = getSwipeAction(state.appView, state.currentModule, dx, dy);
      if (!action) return;
      switch(action) {
        case 'prev': handleWheel('prev'); break;
        case 'next': handleWheel('next'); break;
        case 'reader_prev': app.readerPage(-1); break;
        case 'reader_next': app.readerPage(1); break;
        case 'cover_prev': state.coverIndex = (state.coverIndex - 1 + albums.length) % albums.length; transitionTo(renderCoverFlow); break;
        case 'cover_next': state.coverIndex = (state.coverIndex + 1) % albums.length; transitionTo(renderCoverFlow); break;
        case 'np_mode_up':
        case 'np_mode_down': app.toggleNpMode(); break;
      }
    }, {passive: true});
  }

  // Keyboard support
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp') handleWheel('menu');
    if (e.key === 'ArrowLeft') handleWheel('prev');
    if (e.key === 'ArrowRight') handleWheel('next');
    if (e.key === 'ArrowDown') handleWheel('play');
    if (e.key === 'Enter') handleWheel('center');
  });

  // Splash screen
  setTimeout(() => {
    const splash = document.getElementById('splashScreen');
    if (splash) splash.classList.add('hidden');
    setTimeout(() => { if (splash) splash.remove(); }, 600);
  }, 1800);

  renderHome();

  // ===== 3D Tilt Effect =====
  const deviceWrap = document.querySelector('.device-wrap');
  const deviceEl = document.querySelector('.device');
  if (deviceWrap && deviceEl) {
    deviceWrap.addEventListener('mousemove', function(e) {
      const rect = deviceWrap.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width - 0.5;
      const y = (e.clientY - rect.top) / rect.height - 0.5;
      const rotX = -y * 12; // max 6 degrees
      const rotY = x * 12;
      deviceEl.style.transform = 'rotateX(' + rotX + 'deg) rotateY(' + rotY + 'deg)';
    });
    deviceWrap.addEventListener('mouseleave', function() {
      deviceEl.style.transform = 'rotateX(0deg) rotateY(0deg)';
    });
  }
})();
</script>
</body>
</html>
