<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>礼金纪 - 登录</title>
    <link href="./static/remixicon.css" rel="stylesheet" />
    <script src="./static/tailwindcss.js" defer></script>
    <style>
        :root {
            --primary-color: #c00;
            --primary-border-color: #ffaaaa;
            --primary-bg-light: #fff2f2;
            --button-bg-color: #dc2626;
            --button-bg-hover: #b91c1c;
            --focus-shadow-color: rgba(200, 0, 0, 0.1);
            --focus-border-color: #c00;
            --link-color: #c00;
        }

        body.black-theme {
            --primary-color: #2c3e50;
            --primary-border-color: #5a6d7d;
            --primary-bg-light: #2c3e50;
            --button-bg-color: #2c3e50;
            --button-bg-hover: #1a252f;
            --focus-shadow-color: rgba(44, 62, 80, 0.2);
            --focus-border-color: #2c3e50;
            --link-color: #5a7a9a;
        }

        body {
            font-family: "Arial", "Helvetica", "KaiTi", sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ffffff 0%, #dedede 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 200px;
            height: 200px;
            z-index: 100;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            max-width: 900px;
            width: 90%;
            display: flex;
            min-height: 500px;
        }

        .login-left {
            flex: 1;
            background: linear-gradient(135deg, #c00 0%, #8b0000 100%);
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .login-left::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .login-left h1 {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            z-index: 1;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .login-left p {
            font-size: 18px;
            opacity: 0.9;
            z-index: 1;
            text-align: center;
            line-height: 1.6;
        }

        .login-right {
            flex: 1;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-form h2 {
            font-size: 32px;
            color: #333;
            margin-bottom: 40px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--primary-border-color);
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--focus-border-color);
            box-shadow: 0 0 0 3px var(--focus-shadow-color);
        }

        .form-group input:hover {
            border-color: var(--primary-border-color);
        }

        body.black-theme .login-btn:hover {
            box-shadow: 0 5px 20px rgba(44, 62, 80, 0.4);
        }

        body.black-theme a:hover {
            text-decoration: underline;
        }

        body.black-theme .modal input:focus {
            border-color: var(--focus-border-color);
            box-shadow: 0 0 0 3px var(--focus-shadow-color);
        }

        body.black-theme .modal input:hover {
            border-color: var(--primary-border-color);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #c00 0%, #8b0000 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px var(--focus-shadow-color);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        body.black-theme .theme-toggle:hover {
            background: rgba(44, 62, 80, 0.5);
        }

        .features {
            margin-top: 30px;
            z-index: 1;
        }

        .feature-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .feature-item i {
            margin-right: 10px;
            font-size: 20px;
        }

        @media (max-width: 768px) {
            .login-container {
                flex-direction: column;
                max-width: 400px;
            }

            .login-left {
                padding: 40px 30px;
            }

            .login-left h1 {
                font-size: 36px;
            }

            .login-right {
                padding: 40px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="logo">
        <img src="./static/logo.png" alt="礼金纪">
    </div>
    <div class="login-container">
        <div class="login-left">
            <button class="theme-toggle" onclick="toggleTheme()">
                <i class="ri-palette-line"></i> 切换主题
            </button>
            <h1>礼金纪</h1>
            <p>离线无网红白事一站式礼金记账系统</p>
            <div class="features">
                <div class="feature-item">
                    <i class="ri-wifi-off-line"></i>
                    <span>完全离线可用</span>
                </div>
                <div class="feature-item">
                    <i class="ri-smartphone-line"></i>
                    <span>双端联动查账</span>
                </div>
                <div class="feature-item">
                    <i class="ri-file-list-3-line"></i>
                    <span>智能账目管理</span>
                </div>
                <div class="feature-item">
                    <i class="ri-download-2-line"></i>
                    <span>多格式导出</span>
                </div>
            </div>
        </div>
        <div class="login-right">
            <form class="login-form" onsubmit="handleLogin(event)">
                <h2>系统登录</h2>
                <div class="form-group">
                    <label for="username">
                        <i class="ri-user-line"></i> 用户名                    </label>
                    <input type="text" id="username" placeholder="请输入用户名" required>
                </div>
                <div class="form-group">
                    <label for="password">
                        <i class="ri-lock-line"></i> 密码
                    </label>
                    <input type="password" id="password" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="login-btn">
                    <i class="ri-login-box-line"></i> 登录系统
                </button>
                <p style="text-align: center; margin-top: 20px; color: #999; font-size: 14px;">
                    默认账号: admin / admin123 或 manager / manager123</p>
                <p style="text-align: center; margin-top: 10px; color: #666; font-size: 14px;">
                    <a href="#" onclick="showRegister(event)" style="color: var(--link-color); text-decoration: none;">注册新账号</a>
                </p>
            </form>
        </div>
    </div>

    <!-- 注册弹窗 -->
    <div class="modal" id="registerModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 1000; align-items: center; justify-content: center;">
        <div style="background: white; border-radius: 12px; padding: 30px; max-width: 400px; width: 90%;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="font-size: 20px; color: #333;">注册新账号</h3>
                <button onclick="closeRegister()" style="background: none; border: none; font-size: 24px; cursor: pointer; color: #999;">&times;</button>
            </div>
            <form onsubmit="handleRegister(event)">
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 8px; color: #555; font-weight: 500;">用户名</label>
                    <input type="text" id="regUsername" placeholder="请输入用户名" required style="width: 100%; padding: 12px; border: 2px solid var(--primary-border-color); border-radius: 8px; font-size: 14px; box-sizing: border-box; transition: all 0.3s;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 8px; color: #555; font-weight: 500;">密码</label>
                    <input type="password" id="regPassword" placeholder="请输入密码" required minlength="6" style="width: 100%; padding: 12px; border: 2px solid var(--primary-border-color); border-radius: 8px; font-size: 14px; box-sizing: border-box; transition: all 0.3s;">
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; color: #555; font-weight: 500;">确认密码</label>
                    <input type="password" id="regPasswordConfirm" placeholder="请再次输入密码" required style="width: 100%; padding: 12px; border: 2px solid var(--primary-border-color); border-radius: 8px; font-size: 14px; box-sizing: border-box; transition: all 0.3s;">
                </div>
                <button type="submit" class="login-btn" style="width: 100%;">
                    <i class="ri-user-add-line"></i> 注册
                </button>
            </form>
        </div>
    </div>

    <script>
        let currentTheme = 'red';
        let loginAttempts = 0;
        const MAX_ATTEMPTS = 5;
        const LOCKOUT_TIME = 60000; // 锁定1分钟

        // 默认用户账户 (实际项目中应该从后端获取或加密存储)
        const DEFAULT_USERS = {
            'admin': 'admin123',
            'manager': 'manager123'
        };

        function toggleTheme() {
            const loginLeft = document.querySelector('.login-left');
            const loginBtn = document.querySelector('.login-btn');
            const logoImg = document.querySelector('.logo img');

            if (currentTheme === 'red') {
                currentTheme = 'black';
                document.body.classList.add('black-theme');
                loginLeft.style.background = 'linear-gradient(135deg, #2c3e50 0%, #1a1a1a 100%)';
                loginBtn.style.background = 'linear-gradient(135deg, #2c3e50 0%, #1a1a1a 100%)';
                logoImg.style.filter = 'grayscale(100%)';
            } else {
                currentTheme = 'red';
                document.body.classList.remove('black-theme');
                loginLeft.style.background = 'linear-gradient(135deg, #c00 0%, #8b0000 100%)';
                loginBtn.style.background = 'linear-gradient(135deg, #c00 0%, #8b0000 100%)';
                logoImg.style.filter = 'none';
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            
            // 检查是否被锁定
            const lockUntil = localStorage.getItem('loginLockUntil');
            if (lockUntil && Date.now() < parseInt(lockUntil)) {
                const remaining = Math.ceil((parseInt(lockUntil) - Date.now()) / 1000);
                alert(`登录已被锁定，请 ${remaining} 秒后再试`);
                return;
            }

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            // 验证输入
            if (!username || !password) {
                alert('请输入用户名和密码');
                return;
            }

            // 验证用户名和密码
            const isValidUser = DEFAULT_USERS[username] === password;
            
            // 检查是否启用注册功能或自定义用户
            const customUsers = localStorage.getItem('customUsers');
            let customUserValid = false;
            if (customUsers) {
                const users = JSON.parse(customUsers);
                customUserValid = users[username] === password;
            }

            if (isValidUser || customUserValid) {
                // 登录成功，重置尝试次数
                localStorage.removeItem('loginAttempts');
                localStorage.removeItem('loginLockUntil');
                
                // 存储登录状态
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('username', username);
                localStorage.setItem('theme', currentTheme);

                // 跳转到礼簿列表页
                window.location.href = 'event-list.html';
            } else {
                // 登录失败
                loginAttempts++;
                localStorage.setItem('loginAttempts', loginAttempts);
                
                if (loginAttempts >= MAX_ATTEMPTS) {
                    // 锁定账户
                    const lockTime = Date.now() + LOCKOUT_TIME;
                    localStorage.setItem('loginLockUntil', lockTime);
                    alert(`登录失败次数过多，账户已被锁定1分钟`);
                    loginAttempts = 0;
                    localStorage.removeItem('loginAttempts');
                } else {
                    const remaining = MAX_ATTEMPTS - loginAttempts;
                    alert(`用户名或密码错误，剩余 ${remaining} 次尝试机会`);
                }
                
                // 清空密码框
                document.getElementById('password').value = '';
            }
        }

        // 检查登录状态
        window.onload = function() {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            if (isLoggedIn === 'true') {
                // 已登录直接跳转礼簿列表
                window.location.href = 'event-list.html';
            }
        }

        // 显示注册弹窗
        function showRegister(e) {
            if (e) e.preventDefault();
            document.getElementById('registerModal').style.display = 'flex';
        }

        // 关闭注册弹窗
        function closeRegister() {
            document.getElementById('registerModal').style.display = 'none';
            // 清空表单
            document.getElementById('regUsername').value = '';
            document.getElementById('regPassword').value = '';
            document.getElementById('regPasswordConfirm').value = '';
        }

        // 处理注册
        function handleRegister(event) {
            event.preventDefault();
            
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const passwordConfirm = document.getElementById('regPasswordConfirm').value;

            // 验证输入
            if (!username || !password) {
                alert('请填写所有字段');
                return;
            }

            if (password.length < 6) {
                alert('密码长度不能少于6位');
                return;
            }

            if (password !== passwordConfirm) {
                alert('两次输入的密码不一致');
                return;
            }

            // 检查是否与默认用户冲突
            if (DEFAULT_USERS[username]) {
                alert('该用户名已被使用，请选择其他用户名');
                return;
            }

            // 获取现有自定义用户
            let customUsers = {};
            const existingUsers = localStorage.getItem('customUsers');
            if (existingUsers) {
                customUsers = JSON.parse(existingUsers);
            }

            // 检查用户名是否已存在
            if (customUsers[username]) {
                alert('该用户名已被注册');
                return;
            }

            // 添加新用户
            customUsers[username] = password;
            localStorage.setItem('customUsers', JSON.stringify(customUsers));

            alert('注册成功！请使用新账号登录');
            closeRegister();
        }
    </script>
</body>
</html>
