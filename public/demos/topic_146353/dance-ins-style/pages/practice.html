<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled</title>
    <style id="theme-vars">
/* ============================================
   Brand CSS — Instagram-inspired Dance Practice App
   Style: Warm, trendy, minimal, editorial
   Tone: Warm/Human with fashion magazine feel
   ============================================ */

:root {
  /* === Color System === */
  /* Primary: Warm coral-rose */
  --primary: #E8646A;
  --primary-foreground: #FFFFFF;

  /* Background & Foreground */
  --background: #FAF8F6;
  --foreground: #1A1A1A;

  /* Card */
  --card: #FFFFFF;
  --card-foreground: #1A1A1A;

  /* Muted */
  --muted: #F2EFEC;
  --muted-foreground: #A39E99;

  /* Secondary text */
  --secondary-foreground: #6B6560;

  /* Border */
  --border: rgba(0, 0, 0, 0.06);
  --input: rgba(0, 0, 0, 0.06);
  --ring: #E8646A;

  /* Destructive */
  --destructive: #E05555;

  /* State Colors */
  --state-success: #4CAF82;
  --state-success-bg: rgba(76, 175, 130, 0.1);
  --state-warning: #F0A030;
  --state-warning-bg: rgba(240, 160, 48, 0.1);
  --state-error: #E05555;
  --state-error-bg: rgba(224, 85, 85, 0.1);
  --state-info: #6BA3D6;
  --state-info-bg: rgba(107, 163, 214, 0.1);

  /* Alias variables for custom usage */
  --color-primary: #E8646A;
  --color-primary-hover: #D4545A;
  --color-primary-light: rgba(232, 100, 106, 0.12);
  --color-primary-muted: rgba(232, 100, 106, 0.06);
  --color-bg: #FAF8F6;
  --color-bg-elevated: #FFFFFF;
  --color-bg-sunken: #F2EFEC;
  --color-bg-inset: #EBE8E4;
  --color-text: #1A1A1A;
  --color-text-secondary: #6B6560;
  --color-text-muted: #A39E99;
  --color-text-inverse: #FFFFFF;
  --color-border: rgba(0, 0, 0, 0.06);
  --color-border-strong: rgba(0, 0, 0, 0.12);
  --color-divider: rgba(0, 0, 0, 0.04);

  /* === Typography === */
  --font-display: 'DM Serif Display', Georgia, 'Noto Serif SC', serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --font-mono: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;

  /* Type Scale */
  --text-xs: 11px;
  --text-sm: 13px;
  --text-base: 15px;
  --text-md: 17px;
  --text-lg: 22px;
  --text-xl: 28px;
  --text-2xl: 36px;
  --text-3xl: 48px;

  /* Line Heights */
  --leading-tight: 1.2;
  --leading-snug: 1.35;
  --leading-normal: 1.5;
  --leading-relaxed: 1.65;

  /* Font Weights */
  --weight-normal: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;

  /* === Shape System === */
  --radius-sm: 4px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* === Spacing System === */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  /* === Surface & Depth === */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.06);
  --shadow-float: 0 16px 48px rgba(0, 0, 0, 0.1);
}

/* === Typography Classes === */
.font-display { font-family: var(--font-display); font-weight: var(--weight-bold); line-height: var(--leading-tight); }
.font-body { font-family: var(--font-body); font-weight: var(--weight-normal); line-height: var(--leading-normal); }
.font-mono { font-family: var(--font-mono); }

.text-xs { font-size: var(--text-xs); }
.text-sm { font-size: var(--text-sm); }
.text-base { font-size: var(--text-base); }
.text-md { font-size: var(--text-md); }
.text-lg { font-size: var(--text-lg); }
.text-xl { font-size: var(--text-xl); }
.text-2xl { font-size: var(--text-2xl); }
.text-3xl { font-size: var(--text-3xl); }

.font-medium { font-weight: var(--weight-medium); }
.font-semibold { font-weight: var(--weight-semibold); }
.font-bold { font-weight: var(--weight-bold); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-foreground: var(--primary-foreground);
  }
  @layer base {
    body { background: var(--primary-background); color: var(--primary-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased overflow-hidden" style="background:#1a1a2e;">
    <main class="relative flex flex-col h-screen">

      <!-- Video Area (fills most of screen) -->
      <div class="relative flex-1 min-h-0" style="background:linear-gradient(160deg,#1a1a2e 0%,#16213e 100%);">

        <!-- 1. Top Bar -->
        <div class="absolute top-0 inset-x-0 z-30 flex items-center justify-between px-4 pt-3 pb-2" style="background:rgba(26,26,26,0.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);">
          <!-- Back button -->
          <button data-dom-id="back-to-home-practice" class="flex items-center justify-center w-9 h-9 rounded-full" style="background:rgba(255,255,255,0.1);" aria-label="返回">
            <i data-lucide="chevron-left" class="w-5 h-5 text-white"></i>
          </button>
          <!-- Song Title -->
          <h1 class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 text-white text-base" style="font-family:'DM Serif Display',Georgia,serif;">Pink Venom</h1>
          <!-- Right spacer to balance -->
          <div class="w-9 h-9"></div>
        </div>

        <!-- 3a. Settings button (top right, below top bar) -->
        <button class="absolute top-16 right-4 z-20 flex items-center justify-center w-10 h-10 rounded-full" style="background:rgba(255,255,255,0.15);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);" aria-label="设置">
          <i data-lucide="settings" class="w-4 h-4 text-white"></i>
        </button>

        <!-- 3b. Beat switch (top left) -->
        <div class="absolute top-16 left-4 z-20 flex items-center gap-2 px-3 py-1.5 rounded-full" style="background:rgba(255,255,255,0.12);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);">
          <span class="text-xs text-white" style="opacity:0.8;">&#127925; 节拍器</span>
          <!-- Toggle switch (off state) -->
          <div class="relative w-9 h-5 rounded-full" style="background:rgba(255,255,255,0.25);">
            <div class="absolute top-0.5 left-0.5 w-4 h-4 rounded-full bg-white" style="opacity:0.6;"></div>
          </div>
        </div>

        <!-- 3c. Beat indicator (top center, shown) -->
        <div class="absolute top-28 left-1/2 -translate-x-1/2 z-20 flex items-center gap-1.5">
          <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-semibold text-white" style="background:var(--color-primary);">1</span>
          <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-medium text-white" style="background:rgba(255,255,255,0.15);opacity:0.5;">2</span>
          <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-medium text-white" style="background:rgba(255,255,255,0.15);opacity:0.5;">3</span>
          <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-medium text-white" style="background:rgba(255,255,255,0.15);opacity:0.5;">4</span>
          <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-medium text-white" style="background:rgba(255,255,255,0.15);opacity:0.5;">5</span>
          <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-medium text-white" style="background:rgba(255,255,255,0.15);opacity:0.5;">6</span>
          <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-medium text-white" style="background:rgba(255,255,255,0.15);opacity:0.5;">7</span>
          <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-medium text-white" style="background:rgba(255,255,255,0.15);opacity:0.5;">8</span>
        </div>

        <!-- 2. Center play button area -->
        <div class="absolute inset-0 flex flex-col items-center justify-center" style="padding-top:40px;">
          <!-- Large circular play button -->
          <button class="flex items-center justify-center w-16 h-16 rounded-full" style="background:linear-gradient(135deg,#E8646A 0%,#d4525a 100%);box-shadow:0 8px 32px rgba(232,100,106,0.35);" aria-label="播放">
            <span class="text-white text-2xl" style="margin-left:3px;">&#9654;</span>
          </button>
          <p class="mt-3 text-white text-xs tracking-wide" style="opacity:0.6;">点击播放视频</p>
        </div>

        <!-- 3f. Fullscreen button (bottom right of video) -->
        <button class="absolute bottom-36 right-4 z-20 flex items-center justify-center w-9 h-9 rounded-full" style="background:rgba(0,0,0,0.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);" aria-label="全屏">
          <i data-lucide="maximize" class="w-4 h-4 text-white"></i>
        </button>

        <!-- 3d. Segment chips (bottom of video, above progress) -->
        <div class="absolute bottom-28 inset-x-0 z-20 px-4">
          <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
            <span class="shrink-0 px-3 py-1 rounded-full text-xs font-medium text-white" style="border:1.5px solid var(--color-primary);background:rgba(232,100,106,0.15);">1-1</span>
            <span class="shrink-0 px-3 py-1 rounded-full text-xs text-white" style="background:rgba(255,255,255,0.1);opacity:0.5;">1-2</span>
            <span class="shrink-0 px-3 py-1 rounded-full text-xs text-white" style="background:rgba(255,255,255,0.1);opacity:0.5;">1-3</span>
            <span class="shrink-0 px-3 py-1 rounded-full text-xs text-white" style="background:rgba(255,255,255,0.1);opacity:0.5;">1-4</span>
            <span class="shrink-0 px-3 py-1 rounded-full text-xs text-white" style="background:rgba(255,255,255,0.1);opacity:0.5;">2-1</span>
            <span class="shrink-0 px-3 py-1 rounded-full text-xs text-white" style="background:rgba(255,255,255,0.1);opacity:0.5;">2-2</span>
            <span class="shrink-0 px-3 py-1 rounded-full text-xs text-white" style="background:rgba(255,255,255,0.1);opacity:0.5;">2-3</span>
            <span class="shrink-0 px-3 py-1 rounded-full text-xs text-white" style="background:rgba(255,255,255,0.1);opacity:0.5;">2-4</span>
            <span class="shrink-0 px-3 py-1 rounded-full text-xs text-white" style="background:rgba(255,255,255,0.1);opacity:0.5;">3-1</span>
            <span class="shrink-0 px-3 py-1 rounded-full text-xs text-white" style="background:rgba(255,255,255,0.1);opacity:0.5;">3-2</span>
            <span class="shrink-0 px-3 py-1 rounded-full text-xs text-white" style="background:rgba(255,255,255,0.1);opacity:0.5;">3-3</span>
            <span class="shrink-0 px-3 py-1 rounded-full text-xs text-white" style="background:rgba(255,255,255,0.1);opacity:0.5;">3-4</span>
            <span class="shrink-0 px-3 py-1 rounded-full text-xs text-white" style="background:rgba(255,255,255,0.1);opacity:0.5;">3-5</span>
            <span class="shrink-0 px-3 py-1 rounded-full text-xs text-white" style="background:rgba(255,255,255,0.1);opacity:0.5;">3-6</span>
            <span class="shrink-0 px-3 py-1 rounded-full text-xs text-white" style="background:rgba(255,255,255,0.1);opacity:0.5;">3-7</span>
            <span class="shrink-0 px-3 py-1 rounded-full text-xs text-white" style="background:rgba(255,255,255,0.1);opacity:0.5;">3-8</span>
          </div>
        </div>

        <!-- 3e. Progress bar -->
        <div class="absolute bottom-24 inset-x-0 z-20 px-4">
          <div class="w-full h-1 rounded-full" style="background:rgba(255,255,255,0.15);">
            <div class="relative h-full rounded-full" style="width:35%;background:var(--color-primary);">
              <div class="absolute -right-1.5 top-1/2 -translate-y-1/2 w-2.5 h-2.5 rounded-full bg-white" style="box-shadow:0 0 6px rgba(232,100,106,0.5);"></div>
            </div>
          </div>
          <!-- Time labels -->
          <div class="flex justify-between mt-1">
            <span class="text-white text-[10px]" style="opacity:0.4;">1:24</span>
            <span class="text-white text-[10px]" style="opacity:0.4;">3:56</span>
          </div>
        </div>
      </div>

      <!-- 4. Bottom Control Bar -->
      <div class="shrink-0 flex flex-col" style="background:var(--color-bg-elevated);border-top:1px solid var(--color-border);">
        <!-- Primary controls row -->
        <div class="flex items-center gap-3 px-5 py-3">
          <!-- Play/Pause button (primary) -->
          <button class="flex items-center justify-center w-11 h-11 rounded-full shrink-0" style="background:linear-gradient(135deg,#E8646A 0%,#d4525a 100%);box-shadow:0 4px 16px rgba(232,100,106,0.3);" aria-label="播放">
            <span class="text-white text-sm" style="margin-left:2px;">&#9654;</span>
          </button>

          <!-- AB Loop pill -->
          <button class="px-4 py-2 rounded-full text-xs font-medium shrink-0" style="background:var(--color-bg-sunken);color:var(--color-text);">AB循环</button>

          <!-- Speed pill -->
          <button class="px-4 py-2 rounded-full text-xs font-medium shrink-0" style="background:var(--color-bg-sunken);color:var(--color-text);">倍速 0.9x</button>
        </div>

        <!-- Mode switcher row -->
        <div class="flex items-center px-5 pb-4">
          <div class="flex rounded-full overflow-hidden" style="background:var(--color-bg-sunken);">
            <!-- Active tab -->
            <button class="px-4 py-2 rounded-full text-xs font-medium text-white" style="background:var(--color-primary);">&#127916; 学动作</button>
            <!-- Inactive tab -->
            <button class="px-4 py-2 rounded-full text-xs font-medium" style="color:var(--color-text-muted);">&#9878;&#65039; 技术分析</button>
          </div>
        </div>
      </div>

    </main>

    <style>
      /* Custom styles for practice page (free-explore, placed in body) */
      body {
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
    </style>

    <script>lucide.createIcons();</script>
</body>
</html>
