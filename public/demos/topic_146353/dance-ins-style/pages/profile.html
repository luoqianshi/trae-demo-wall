<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled</title>
    <style id="theme-vars">
/* ============================================
   Brand CSS — Instagram-inspired Dance Practice App
   Style: Warm, trendy, minimal, editorial
   Tone: Warm/Human with fashion magazine feel
   ============================================ */

:root {
  /* === Color System === */
  /* Primary: Warm coral-rose */
  --primary: #E8646A;
  --primary-foreground: #FFFFFF;

  /* Background & Foreground */
  --background: #FAF8F6;
  --foreground: #1A1A1A;

  /* Card */
  --card: #FFFFFF;
  --card-foreground: #1A1A1A;

  /* Muted */
  --muted: #F2EFEC;
  --muted-foreground: #A39E99;

  /* Secondary text */
  --secondary-foreground: #6B6560;

  /* Border */
  --border: rgba(0, 0, 0, 0.06);
  --input: rgba(0, 0, 0, 0.06);
  --ring: #E8646A;

  /* Destructive */
  --destructive: #E05555;

  /* State Colors */
  --state-success: #4CAF82;
  --state-success-bg: rgba(76, 175, 130, 0.1);
  --state-warning: #F0A030;
  --state-warning-bg: rgba(240, 160, 48, 0.1);
  --state-error: #E05555;
  --state-error-bg: rgba(224, 85, 85, 0.1);
  --state-info: #6BA3D6;
  --state-info-bg: rgba(107, 163, 214, 0.1);

  /* Alias variables for custom usage */
  --color-primary: #E8646A;
  --color-primary-hover: #D4545A;
  --color-primary-light: rgba(232, 100, 106, 0.12);
  --color-primary-muted: rgba(232, 100, 106, 0.06);
  --color-bg: #FAF8F6;
  --color-bg-elevated: #FFFFFF;
  --color-bg-sunken: #F2EFEC;
  --color-bg-inset: #EBE8E4;
  --color-text: #1A1A1A;
  --color-text-secondary: #6B6560;
  --color-text-muted: #A39E99;
  --color-text-inverse: #FFFFFF;
  --color-border: rgba(0, 0, 0, 0.06);
  --color-border-strong: rgba(0, 0, 0, 0.12);
  --color-divider: rgba(0, 0, 0, 0.04);

  /* === Typography === */
  --font-display: 'DM Serif Display', Georgia, 'Noto Serif SC', serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --font-mono: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;

  /* Type Scale */
  --text-xs: 11px;
  --text-sm: 13px;
  --text-base: 15px;
  --text-md: 17px;
  --text-lg: 22px;
  --text-xl: 28px;
  --text-2xl: 36px;
  --text-3xl: 48px;

  /* Line Heights */
  --leading-tight: 1.2;
  --leading-snug: 1.35;
  --leading-normal: 1.5;
  --leading-relaxed: 1.65;

  /* Font Weights */
  --weight-normal: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;

  /* === Shape System === */
  --radius-sm: 4px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* === Spacing System === */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  /* === Surface & Depth === */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.06);
  --shadow-float: 0 16px 48px rgba(0, 0, 0, 0.1);
}

/* === Typography Classes === */
.font-display { font-family: var(--font-display); font-weight: var(--weight-bold); line-height: var(--leading-tight); }
.font-body { font-family: var(--font-body); font-weight: var(--weight-normal); line-height: var(--leading-normal); }
.font-mono { font-family: var(--font-mono); }

.text-xs { font-size: var(--text-xs); }
.text-sm { font-size: var(--text-sm); }
.text-base { font-size: var(--text-base); }
.text-md { font-size: var(--text-md); }
.text-lg { font-size: var(--text-lg); }
.text-xl { font-size: var(--text-xl); }
.text-2xl { font-size: var(--text-2xl); }
.text-3xl { font-size: var(--text-3xl); }

.font-medium { font-weight: var(--weight-medium); }
.font-semibold { font-weight: var(--weight-semibold); }
.font-bold { font-weight: var(--weight-bold); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-foreground: var(--primary-foreground);
  }
  @layer base {
    body { background: var(--primary-background); color: var(--primary-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen antialiased" style="background: var(--color-bg); color: var(--color-text); font-family: var(--font-body);">

    <main class="pb-24">

        <!-- Profile Header -->
        <section class="flex flex-col items-center pt-12 pb-6 px-6">
            <!-- Avatar -->
            <div class="w-20 h-20 rounded-full flex items-center justify-center mb-4"
                 style="background: linear-gradient(135deg, #E8646A 0%, #F2A0A4 100%);">
                <span class="text-white text-3xl font-bold" style="font-family: var(--font-display);">S</span>
            </div>
            <!-- Name -->
            <h1 class="text-[22px] leading-tight mb-1.5" style="font-family: var(--font-display); color: var(--color-text);">
                练习生小冰
            </h1>
            <!-- Bio -->
            <p class="text-[13px] leading-relaxed" style="color: var(--color-text-muted);">
                坚持练习，遇见更好的自己
            </p>
        </section>

        <!-- Stats Grid -->
        <section class="mx-4 mb-5 rounded-2xl p-5" style="background: var(--color-bg-elevated); box-shadow: var(--shadow-md);">
            <div class="grid grid-cols-3 divide-x" style="border-color: var(--color-border);">
                <!-- Stat 1 -->
                <div class="flex flex-col items-center">
                    <span class="text-[26px] leading-tight" style="font-family: var(--font-display); color: var(--color-primary);">12</span>
                    <span class="text-[11px] mt-1 tracking-wide" style="color: var(--color-text-muted);">练习任务</span>
                </div>
                <!-- Stat 2 -->
                <div class="flex flex-col items-center">
                    <span class="text-[26px] leading-tight" style="font-family: var(--font-display); color: var(--color-primary);">8.5h</span>
                    <span class="text-[11px] mt-1 tracking-wide" style="color: var(--color-text-muted);">累计时长</span>
                </div>
                <!-- Stat 3 -->
                <div class="flex flex-col items-center">
                    <span class="text-[26px] leading-tight" style="font-family: var(--font-display); color: var(--color-primary);">3</span>
                    <span class="text-[11px] mt-1 tracking-wide" style="color: var(--color-text-muted);">已完成</span>
                </div>
            </div>
        </section>

        <!-- Menu Section 1 -->
        <section class="mx-4 mb-4 rounded-2xl overflow-hidden" style="background: var(--color-bg-elevated); box-shadow: var(--shadow-md);">
            <!-- Menu Item: 练习记录 -->
            <div class="flex items-center px-4 py-3.5" style="border-bottom: 1px solid var(--color-border);">
                <div class="w-9 h-9 rounded-[10px] flex items-center justify-center text-[16px] mr-3"
                     style="background: var(--color-bg-sunken);">
                    📊
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-[14px] font-medium leading-snug" style="color: var(--color-text);">练习记录</p>
                    <p class="text-[11px] mt-0.5 leading-snug" style="color: var(--color-text-muted);">查看练习历史</p>
                </div>
                <span class="text-[16px] ml-2 flex-shrink-0" style="color: var(--color-text-muted);">›</span>
            </div>
            <!-- Menu Item: 成长档案 -->
            <div class="flex items-center px-4 py-3.5" style="border-bottom: 1px solid var(--color-border);">
                <div class="w-9 h-9 rounded-[10px] flex items-center justify-center text-[16px] mr-3"
                     style="background: var(--color-bg-sunken);">
                    🏆
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-[14px] font-medium leading-snug" style="color: var(--color-text);">成长档案</p>
                    <p class="text-[11px] mt-0.5 leading-snug" style="color: var(--color-text-muted);">记录每一步进步</p>
                </div>
                <span class="text-[16px] ml-2 flex-shrink-0" style="color: var(--color-text-muted);">›</span>
            </div>
            <!-- Menu Item: 设置 -->
            <div class="flex items-center px-4 py-3.5">
                <div class="w-9 h-9 rounded-[10px] flex items-center justify-center text-[16px] mr-3"
                     style="background: var(--color-bg-sunken);">
                    ⚙️
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-[14px] font-medium leading-snug" style="color: var(--color-text);">设置</p>
                    <p class="text-[11px] mt-0.5 leading-snug" style="color: var(--color-text-muted);">预处理偏好、倍速设置</p>
                </div>
                <span class="text-[16px] ml-2 flex-shrink-0" style="color: var(--color-text-muted);">›</span>
            </div>
        </section>

        <!-- Menu Section 2 -->
        <section class="mx-4 mb-4 rounded-2xl overflow-hidden" style="background: var(--color-bg-elevated); box-shadow: var(--shadow-md);">
            <!-- Menu Item: 帮助与反馈 -->
            <div class="flex items-center px-4 py-3.5" style="border-bottom: 1px solid var(--color-border);">
                <div class="w-9 h-9 rounded-[10px] flex items-center justify-center text-[16px] mr-3"
                     style="background: var(--color-bg-sunken);">
                    ❓
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-[14px] font-medium leading-snug" style="color: var(--color-text);">帮助与反馈</p>
                    <p class="text-[11px] mt-0.5 leading-snug" style="color: var(--color-text-muted);">联系我们</p>
                </div>
                <span class="text-[16px] ml-2 flex-shrink-0" style="color: var(--color-text-muted);">›</span>
            </div>
            <!-- Menu Item: 使用教程 -->
            <div class="flex items-center px-4 py-3.5">
                <div class="w-9 h-9 rounded-[10px] flex items-center justify-center text-[16px] mr-3"
                     style="background: var(--color-bg-sunken);">
                    📖
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-[14px] font-medium leading-snug" style="color: var(--color-text);">使用教程</p>
                    <p class="text-[11px] mt-0.5 leading-snug" style="color: var(--color-text-muted);">扒舞方法论</p>
                </div>
                <span class="text-[16px] ml-2 flex-shrink-0" style="color: var(--color-text-muted);">›</span>
            </div>
        </section>

    </main>

    <!-- Bottom Tab Bar -->
    <nav class="fixed bottom-0 left-0 right-0 z-40" style="background: rgba(250, 248, 246, 0.88); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--color-border);">
        <div class="flex items-center justify-around min-h-[56px]">
            <!-- Home Tab (inactive) -->
            <button data-dom-id="nav-home-tab" class="flex flex-col items-center justify-center gap-0.5 flex-1 py-1" style="color: var(--color-text-muted);">
                <svg class="w-[22px] h-[22px]" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                <span class="text-[10px] leading-none">首页</span>
            </button>
            <!-- Practice Tab (hero logo, muted on profile page) -->
            <button data-dom-id="nav-practice-tab" class="flex flex-col items-center justify-center gap-1 flex-1 py-1" style="background: rgba(232,100,106,0.1); border-radius: 9999px; padding: 8px 18px;">
                <img src="../assets/logo-icon-v2.jpg" width="24" height="24" style="border-radius: 4px; opacity: 0.55;" alt="练习">
                <span class="text-[12px] leading-none" style="color: #E8646A; opacity: 0.55; font-weight: 700;">练习</span>
            </button>
            <!-- Profile Tab (Active) -->
            <button data-active="true" data-dom-id="nav-profile-tab" class="flex flex-col items-center justify-center gap-0.5 flex-1 py-1" style="color: var(--color-primary);">
                <svg class="w-[22px] h-[22px]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <span class="text-[10px] leading-none font-medium">我的</span>
            </button>
        </div>
        <!-- Safe area bottom -->
        <div class="h-[env(safe-area-inset-bottom,0px)]"></div>
    </nav>

    <script>lucide.createIcons();</script>
</body>
</html>
