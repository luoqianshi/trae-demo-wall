<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 - 扒舞助手</title>
    <style id="theme-vars">
/* ============================================
   Brand CSS — Instagram-inspired Dance Practice App
   Style: Warm, trendy, minimal, editorial
   Tone: Warm/Human with fashion magazine feel
   ============================================ */

:root {
  /* === Color System === */
  /* Primary: Warm coral-rose */
  --primary: #E8646A;
  --primary-foreground: #FFFFFF;

  /* Background & Foreground */
  --background: #FAF8F6;
  --foreground: #1A1A1A;

  /* Card */
  --card: #FFFFFF;
  --card-foreground: #1A1A1A;

  /* Muted */
  --muted: #F2EFEC;
  --muted-foreground: #A39E99;

  /* Secondary text */
  --secondary-foreground: #6B6560;

  /* Border */
  --border: rgba(0, 0, 0, 0.06);
  --input: rgba(0, 0, 0, 0.06);
  --ring: #E8646A;

  /* Destructive */
  --destructive: #E05555;

  /* State Colors */
  --state-success: #4CAF82;
  --state-success-bg: rgba(76, 175, 130, 0.1);
  --state-warning: #F0A030;
  --state-warning-bg: rgba(240, 160, 48, 0.1);
  --state-error: #E05555;
  --state-error-bg: rgba(224, 85, 85, 0.1);
  --state-info: #6BA3D6;
  --state-info-bg: rgba(107, 163, 214, 0.1);

  /* Alias variables for custom usage */
  --color-primary: #E8646A;
  --color-primary-hover: #D4545A;
  --color-primary-light: rgba(232, 100, 106, 0.12);
  --color-primary-muted: rgba(232, 100, 106, 0.06);
  --color-bg: #FAF8F6;
  --color-bg-elevated: #FFFFFF;
  --color-bg-sunken: #F2EFEC;
  --color-bg-inset: #EBE8E4;
  --color-text: #1A1A1A;
  --color-text-secondary: #6B6560;
  --color-text-muted: #A39E99;
  --color-text-inverse: #FFFFFF;
  --color-border: rgba(0, 0, 0, 0.06);
  --color-border-strong: rgba(0, 0, 0, 0.12);
  --color-divider: rgba(0, 0, 0, 0.04);

  /* === Typography === */
  --font-display: 'DM Serif Display', Georgia, 'Noto Serif SC', serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --font-mono: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;

  /* Type Scale */
  --text-xs: 11px;
  --text-sm: 13px;
  --text-base: 15px;
  --text-md: 17px;
  --text-lg: 22px;
  --text-xl: 28px;
  --text-2xl: 36px;
  --text-3xl: 48px;

  /* Line Heights */
  --leading-tight: 1.2;
  --leading-snug: 1.35;
  --leading-normal: 1.5;
  --leading-relaxed: 1.65;

  /* Font Weights */
  --weight-normal: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;

  /* === Shape System === */
  --radius-sm: 4px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* === Spacing System === */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  /* === Surface & Depth === */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.06);
  --shadow-float: 0 16px 48px rgba(0, 0, 0, 0.1);
}

/* === Typography Classes === */
.font-display { font-family: var(--font-display); font-weight: var(--weight-bold); line-height: var(--leading-tight); }
.font-body { font-family: var(--font-body); font-weight: var(--weight-normal); line-height: var(--leading-normal); }
.font-mono { font-family: var(--font-mono); }

.text-xs { font-size: var(--text-xs); }
.text-sm { font-size: var(--text-sm); }
.text-base { font-size: var(--text-base); }
.text-md { font-size: var(--text-md); }
.text-lg { font-size: var(--text-lg); }
.text-xl { font-size: var(--text-xl); }
.text-2xl { font-size: var(--text-2xl); }
.text-3xl { font-size: var(--text-3xl); }

.font-medium { font-weight: var(--weight-medium); }
.font-semibold { font-weight: var(--weight-semibold); }
.font-bold { font-weight: var(--weight-bold); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-foreground: var(--primary-foreground);
  }
  @layer base {
    body { background: var(--primary-background); color: var(--primary-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="background: var(--color-bg); color: var(--color-text);">
    <main class="pb-24">

      <!-- Profile Header Card -->
      <section class="mx-3 mt-4 rounded-[var(--radius-lg)] border bg-[var(--color-bg-elevated)]" style="border-color: var(--color-border); padding: 24px 14px 18px;">
        <div class="flex flex-col items-center text-center">
          <!-- Avatar -->
          <div class="flex items-center justify-center rounded-full text-white" style="width: 74px; height: 74px; background: linear-gradient(135deg, #E8646A, #F2A0A5); font-family: var(--font-display); font-size: 22px; font-weight: 700;">
            冰
          </div>
          <!-- Name -->
          <h1 class="mt-3" style="font-family: var(--font-display); font-size: 22px; font-weight: 700; line-height: 1.2; color: var(--color-text);">
            练习生小冰
          </h1>
          <!-- Bio -->
          <p class="mt-1.5" style="font-size: 13px; color: var(--color-text-muted); line-height: 1.4;">
            稳定复盘，动作会越来越干净
          </p>
        </div>
      </section>

      <!-- Stats Grid -->
      <section class="mx-3 mt-3 grid grid-cols-3 gap-0 rounded-[var(--radius-lg)] border bg-[var(--color-bg-elevated)] overflow-hidden" style="border-color: var(--color-border);">
        <!-- Stat: 练习任务 -->
        <div class="flex flex-col items-center py-4 border-r" style="border-color: var(--color-border);">
          <span class="font-bold" style="font-family: var(--font-display); font-size: 20px; color: var(--color-primary); line-height: 1.2;">12</span>
          <span class="mt-1" style="font-size: 12px; color: var(--color-text-muted);">练习任务</span>
        </div>
        <!-- Stat: 累计时长 -->
        <div class="flex flex-col items-center py-4 border-r" style="border-color: var(--color-border);">
          <span class="font-bold" style="font-family: var(--font-display); font-size: 20px; color: var(--color-primary); line-height: 1.2;">36.5h</span>
          <span class="mt-1" style="font-size: 12px; color: var(--color-text-muted);">累计时长</span>
        </div>
        <!-- Stat: 已完成 -->
        <div class="flex flex-col items-center py-4">
          <span class="font-bold" style="font-family: var(--font-display); font-size: 20px; color: var(--color-primary); line-height: 1.2;">9</span>
          <span class="mt-1" style="font-size: 12px; color: var(--color-text-muted);">已完成</span>
        </div>
      </section>

      <!-- Menu Section -->
      <section class="mx-3 mt-3 rounded-[var(--radius-lg)] border bg-[var(--color-bg-elevated)] overflow-hidden" style="border-color: var(--color-border);">
        <!-- 练习记录 -->
        <a href="#" class="flex items-center justify-between" style="height: 54px; padding: 0 16px; border-bottom: 1px solid var(--color-border);">
          <span style="font-size: 15px; font-weight: 800; color: var(--color-text);">练习记录</span>
          <i data-lucide="chevron-right" style="width: 18px; height: 18px; color: var(--color-text-muted);"></i>
        </a>
        <!-- 成长档案 -->
        <a href="#" class="flex items-center justify-between" style="height: 54px; padding: 0 16px; border-bottom: 1px solid var(--color-border);">
          <span style="font-size: 15px; font-weight: 800; color: var(--color-text);">成长档案</span>
          <i data-lucide="chevron-right" style="width: 18px; height: 18px; color: var(--color-text-muted);"></i>
        </a>
        <!-- 设置 -->
        <a href="#" class="flex items-center justify-between" style="height: 54px; padding: 0 16px; border-bottom: 1px solid var(--color-border);">
          <span style="font-size: 15px; font-weight: 800; color: var(--color-text);">设置</span>
          <i data-lucide="chevron-right" style="width: 18px; height: 18px; color: var(--color-text-muted);"></i>
        </a>
        <!-- 帮助反馈 -->
        <a href="#" class="flex items-center justify-between" style="height: 54px; padding: 0 16px; border-bottom: 1px solid var(--color-border);">
          <span style="font-size: 15px; font-weight: 800; color: var(--color-text);">帮助反馈</span>
          <i data-lucide="chevron-right" style="width: 18px; height: 18px; color: var(--color-text-muted);"></i>
        </a>
        <!-- 使用教程 -->
        <a href="#" class="flex items-center justify-between" style="height: 54px; padding: 0 16px;">
          <span style="font-size: 15px; font-weight: 800; color: var(--color-text);">使用教程</span>
          <i data-lucide="chevron-right" style="width: 18px; height: 18px; color: var(--color-text-muted);"></i>
        </a>
      </section>

      <!-- Bottom Spacer for Tab Bar -->
      <div style="height: 8px;"></div>

    </main>

    <!-- Bottom Tab Bar -->
    <nav class="fixed bottom-0 inset-x-0 z-40 border-t" style="background: rgba(255,255,255,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-color: var(--color-border); padding-bottom: env(safe-area-inset-bottom, 0px);">
      <div class="flex items-center justify-around" style="height: 52px;">
        <!-- 首页 Tab -->
        <a href="#" class="flex flex-col items-center justify-center gap-0.5 w-16" data-dom-id="nav-home-tab" style="color: var(--color-text-muted);">
          <i data-lucide="home" style="width: 22px; height: 22px;"></i>
          <span style="font-size: 10px; font-weight: 500;">首页</span>
        </a>
        <!-- 练习 Tab (Hero) -->
        <a href="#" class="flex flex-col items-center justify-center gap-0.5" data-dom-id="nav-practice-tab" style="opacity: 0.6;">
          <div class="flex items-center justify-center rounded-[var(--radius-full)]" style="width: 38px; height: 38px; background: var(--color-primary-light);">
            <img src="../assets/star-logo.jpg" alt="练习" style="width: 26px; height: 26px; border-radius: 6px;">
          </div>
          <span style="font-size: 10px; font-weight: 700; color: var(--color-primary);">练习</span>
        </a>
        <!-- 我的 Tab (Active) -->
        <a href="#" class="flex flex-col items-center justify-center gap-0.5 w-16" data-dom-id="nav-profile-tab" data-active="true" style="color: var(--color-primary);">
          <i data-lucide="user" style="width: 22px; height: 22px;"></i>
          <span style="font-size: 10px; font-weight: 700;">我的</span>
        </a>
      </div>
    </nav>

    <script>lucide.createIcons();</script>
</body>
</html>
