<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>练习 · Pink Venom</title>
    <style id="theme-vars">
/* ============================================
   Brand CSS — Instagram-inspired Dance Practice App
   Style: Warm, trendy, minimal, editorial
   Tone: Warm/Human with fashion magazine feel
   ============================================ */

:root {
  /* === Color System === */
  /* Primary: Warm coral-rose */
  --primary: #E8646A;
  --primary-foreground: #FFFFFF;

  /* Background & Foreground */
  --background: #FAF8F6;
  --foreground: #1A1A1A;

  /* Card */
  --card: #FFFFFF;
  --card-foreground: #1A1A1A;

  /* Muted */
  --muted: #F2EFEC;
  --muted-foreground: #A39E99;

  /* Secondary text */
  --secondary-foreground: #6B6560;

  /* Border */
  --border: rgba(0, 0, 0, 0.06);
  --input: rgba(0, 0, 0, 0.06);
  --ring: #E8646A;

  /* Destructive */
  --destructive: #E05555;

  /* State Colors */
  --state-success: #4CAF82;
  --state-success-bg: rgba(76, 175, 130, 0.1);
  --state-warning: #F0A030;
  --state-warning-bg: rgba(240, 160, 48, 0.1);
  --state-error: #E05555;
  --state-error-bg: rgba(224, 85, 85, 0.1);
  --state-info: #6BA3D6;
  --state-info-bg: rgba(107, 163, 214, 0.1);

  /* Alias variables for custom usage */
  --color-primary: #E8646A;
  --color-primary-hover: #D4545A;
  --color-primary-light: rgba(232, 100, 106, 0.12);
  --color-primary-muted: rgba(232, 100, 106, 0.06);
  --color-bg: #FAF8F6;
  --color-bg-elevated: #FFFFFF;
  --color-bg-sunken: #F2EFEC;
  --color-bg-inset: #EBE8E4;
  --color-text: #1A1A1A;
  --color-text-secondary: #6B6560;
  --color-text-muted: #A39E99;
  --color-text-inverse: #FFFFFF;
  --color-border: rgba(0, 0, 0, 0.06);
  --color-border-strong: rgba(0, 0, 0, 0.12);
  --color-divider: rgba(0, 0, 0, 0.04);

  /* === Typography === */
  --font-display: 'DM Serif Display', Georgia, 'Noto Serif SC', serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --font-mono: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;

  /* Type Scale */
  --text-xs: 11px;
  --text-sm: 13px;
  --text-base: 15px;
  --text-md: 17px;
  --text-lg: 22px;
  --text-xl: 28px;
  --text-2xl: 36px;
  --text-3xl: 48px;

  /* Line Heights */
  --leading-tight: 1.2;
  --leading-snug: 1.35;
  --leading-normal: 1.5;
  --leading-relaxed: 1.65;

  /* Font Weights */
  --weight-normal: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;

  /* === Shape System === */
  --radius-sm: 4px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* === Spacing System === */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  /* === Surface & Depth === */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.06);
  --shadow-float: 0 16px 48px rgba(0, 0, 0, 0.1);
}

/* === Typography Classes === */
.font-display { font-family: var(--font-display); font-weight: var(--weight-bold); line-height: var(--leading-tight); }
.font-body { font-family: var(--font-body); font-weight: var(--weight-normal); line-height: var(--leading-normal); }
.font-mono { font-family: var(--font-mono); }

.text-xs { font-size: var(--text-xs); }
.text-sm { font-size: var(--text-sm); }
.text-base { font-size: var(--text-base); }
.text-md { font-size: var(--text-md); }
.text-lg { font-size: var(--text-lg); }
.text-xl { font-size: var(--text-xl); }
.text-2xl { font-size: var(--text-2xl); }
.text-3xl { font-size: var(--text-3xl); }

.font-medium { font-weight: var(--weight-medium); }
.font-semibold { font-weight: var(--weight-semibold); }
.font-bold { font-weight: var(--weight-bold); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-foreground: var(--primary-foreground);
  }
  @layer base {
    body { background: var(--primary-background); color: var(--primary-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="min-h-screen" style="background: var(--color-bg); color: var(--color-text);">

      <!-- 1. Top Bar — sticky, frosted glass -->
      <header class="sticky top-0 z-40 border-b backdrop-blur-xl" style="background: rgba(250,248,246,0.88); border-color: var(--color-border);">
        <div class="flex items-center justify-between px-4" style="height: 52px;">
          <button data-dom-id="back-to-home-practice" class="inline-flex items-center justify-center rounded-full border" style="width: 38px; height: 38px; background: var(--color-bg-elevated); border-color: var(--color-border);" aria-label="返回">
            <i data-lucide="chevron-left" style="width: 20px; height: 20px; color: var(--color-text);"></i>
          </button>
          <h1 class="font-display text-base truncate px-3" style="font-size: var(--text-md); font-weight: 600; color: var(--color-text);">Pink Venom</h1>
          <button class="inline-flex items-center justify-center rounded-full border" style="width: 38px; height: 38px; background: var(--color-bg-elevated); border-color: var(--color-border);" aria-label="设置">
            <i data-lucide="settings" style="width: 18px; height: 18px; color: var(--color-text-secondary);"></i>
          </button>
        </div>
      </header>

      <!-- 2. Mode Tabs -->
      <div class="px-4 pt-3 pb-2">
        <div class="inline-flex items-center p-1 rounded-xl" style="background: var(--color-bg-sunken);">
          <button data-mode="single" class="flex items-center justify-center px-5 py-2 rounded-lg text-sm font-semibold transition-all" style="background: var(--color-bg-elevated); color: var(--color-primary); box-shadow: var(--shadow-sm); font-size: var(--text-sm); min-width: 72px;">学动作</button>
          <button data-mode="compare" class="flex items-center justify-center px-5 py-2 rounded-lg text-sm transition-all" style="color: var(--color-text-secondary); font-size: var(--text-sm); min-width: 72px;">技术分析</button>
        </div>
      </div>

      <!-- 3. Video Area — Single Mode Main View -->
      <div class="px-4 pt-2">
        <div class="relative rounded-2xl overflow-hidden" style="aspect-ratio: 9/16; max-height: calc(100vh - 260px); background: linear-gradient(180deg, #111827 0%, #020617 100%);">

          <!-- Grid overlay -->
          <div class="absolute inset-0 pointer-events-none" style="opacity: 0.3;">
            <div class="absolute inset-0 flex flex-col justify-between">
              <div class="border-b" style="border-color: rgba(255,255,255,0.12);"></div>
              <div class="border-b" style="border-color: rgba(255,255,255,0.12);"></div>
              <div class="border-b" style="border-color: rgba(255,255,255,0.12);"></div>
              <div class="border-b" style="border-color: rgba(255,255,255,0.12);"></div>
            </div>
            <div class="absolute inset-0 flex justify-between">
              <div class="border-r h-full" style="border-color: rgba(255,255,255,0.12);"></div>
              <div class="border-r h-full" style="border-color: rgba(255,255,255,0.12);"></div>
              <div class="border-r h-full" style="border-color: rgba(255,255,255,0.12);"></div>
            </div>
          </div>

          <!-- Center play content -->
          <div class="absolute inset-0 flex flex-col items-center justify-center">
            <button class="flex items-center justify-center rounded-full" style="width: 66px; height: 66px; background: var(--color-bg-elevated); box-shadow: 0 4px 24px rgba(0,0,0,0.3);" aria-label="播放">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11.36-6.86a1 1 0 0 0 0-1.72L9.5 4.28a1 1 0 0 0-1.5.86Z" fill="var(--color-primary)"/>
              </svg>
            </button>
            <p class="mt-4 text-sm font-semibold" style="color: rgba(255,255,255,0.9); font-size: var(--text-base);">9:16 练习视频</p>
            <p class="mt-1 text-xs" style="color: rgba(255,255,255,0.4); font-size: var(--text-xs);">上传本地视频后可真实播放</p>
          </div>

          <!-- Top-left overlay: metronome -->
          <div class="absolute top-3 left-3 flex items-center gap-2">
            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium" style="background: rgba(0,0,0,0.55); color: rgba(255,255,255,0.9); font-size: var(--text-xs); backdrop-filter: blur(8px);">节拍器</span>
            <div class="flex items-center gap-1.5 px-2 py-1 rounded-full" style="background: rgba(0,0,0,0.55); backdrop-filter: blur(8px);">
              <span class="block rounded-full" style="width: 8px; height: 8px; background: var(--state-warning);"></span>
              <span class="block rounded-full" style="width: 8px; height: 8px; background: rgba(255,255,255,0.3);"></span>
              <span class="block rounded-full" style="width: 8px; height: 8px; background: rgba(255,255,255,0.3);"></span>
              <span class="block rounded-full" style="width: 8px; height: 8px; background: rgba(255,255,255,0.3);"></span>
              <span class="block rounded-full" style="width: 8px; height: 8px; background: rgba(255,255,255,0.3);"></span>
              <span class="block rounded-full" style="width: 8px; height: 8px; background: rgba(255,255,255,0.3);"></span>
              <span class="block rounded-full" style="width: 8px; height: 8px; background: rgba(255,255,255,0.3);"></span>
              <span class="block rounded-full" style="width: 8px; height: 8px; background: rgba(255,255,255,0.3);"></span>
            </div>
          </div>

          <!-- Top-right overlay: fullscreen -->
          <div class="absolute top-3 right-3">
            <button class="inline-flex items-center justify-center px-3 py-1 rounded-full text-xs font-medium" style="background: rgba(0,0,0,0.55); color: rgba(255,255,255,0.9); font-size: var(--text-xs); backdrop-filter: blur(8px);" aria-label="全屏">
              <i data-lucide="maximize" style="width: 14px; height: 14px;"></i>
            </button>
          </div>

          <!-- Bottom-left overlay: speed/pause label -->
          <div class="absolute bottom-3 left-3">
            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium" style="background: rgba(0,0,0,0.55); color: rgba(255,255,255,0.9); font-size: var(--text-xs); backdrop-filter: blur(8px);">暂停 · 0.9x</span>
          </div>
        </div>
      </div>

      <!-- 4. Segment Chips -->
      <div class="mt-3 px-4">
        <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1" style="-webkit-overflow-scrolling: touch;">
          <button class="shrink-0 px-4 py-1.5 rounded-full text-xs font-semibold border transition-all" style="border-color: var(--color-primary); background: var(--color-primary-light); color: var(--color-primary); font-size: var(--text-xs);">1-1</button>
          <button class="shrink-0 px-4 py-1.5 rounded-full text-xs border transition-all" style="border-color: var(--color-border); background: transparent; color: var(--color-text-secondary); font-size: var(--text-xs);">1-2</button>
          <button class="shrink-0 px-4 py-1.5 rounded-full text-xs border transition-all" style="border-color: var(--color-border); background: transparent; color: var(--color-text-secondary); font-size: var(--text-xs);">1-3</button>
          <button class="shrink-0 px-4 py-1.5 rounded-full text-xs border transition-all" style="border-color: var(--color-border); background: transparent; color: var(--color-text-secondary); font-size: var(--text-xs);">1-4</button>
          <button class="shrink-0 px-4 py-1.5 rounded-full text-xs border transition-all" style="border-color: var(--color-border); background: transparent; color: var(--color-text-secondary); font-size: var(--text-xs);">2-1</button>
          <button class="shrink-0 px-4 py-1.5 rounded-full text-xs border transition-all" style="border-color: var(--color-border); background: transparent; color: var(--color-text-secondary); font-size: var(--text-xs);">2-2</button>
          <button class="shrink-0 px-4 py-1.5 rounded-full text-xs border transition-all" style="border-color: var(--color-border); background: transparent; color: var(--color-text-secondary); font-size: var(--text-xs);">2-3</button>
          <button class="shrink-0 px-4 py-1.5 rounded-full text-xs border transition-all" style="border-color: var(--color-border); background: transparent; color: var(--color-text-secondary); font-size: var(--text-xs);">2-4</button>
        </div>
      </div>

      <!-- 5. Progress Card -->
      <div class="mt-3 mx-4 p-4 rounded-2xl border" style="background: var(--color-bg-elevated); border-color: var(--color-border);">
        <div class="flex items-center justify-between mb-3">
          <span class="text-xs font-bold tabular-nums" style="font-size: var(--text-xs); color: var(--color-text); font-family: var(--font-mono);">00:00</span>
          <span class="text-xs font-bold tabular-nums" style="font-size: var(--text-xs); color: var(--color-text-muted); font-family: var(--font-mono);">02:10</span>
        </div>
        <div class="relative w-full h-1.5 rounded-full" style="background: var(--color-bg-sunken);">
          <div class="absolute left-0 top-0 h-full rounded-full" style="width: 0%; background: var(--color-primary);"></div>
          <div class="absolute top-1/2 -translate-y-1/2 rounded-full" style="left: 0%; width: 14px; height: 14px; background: var(--color-primary); box-shadow: 0 1px 4px rgba(232,100,106,0.3); transform: translate(-50%, -50%);"></div>
        </div>
      </div>

      <!-- Spacer for bottom control bar -->
      <div style="height: 88px;"></div>

      <!-- 6. Bottom Control Bar — fixed, frosted glass -->
      <div class="fixed bottom-0 inset-x-0 z-50 border-t backdrop-blur-xl" style="background: rgba(255,255,255,0.92); border-color: var(--color-border);">
        <div class="flex items-center justify-center gap-3 px-4" style="height: 72px; padding-bottom: env(safe-area-inset-bottom, 0px);">
          <!-- Speed pill -->
          <button class="shrink-0 inline-flex items-center justify-center px-3.5 py-1.5 rounded-full text-xs font-semibold border" style="background: var(--color-bg-elevated); border-color: var(--color-border); color: var(--color-text-secondary); font-size: var(--text-xs);">0.9x</button>

          <!-- AB segment pill -->
          <button class="shrink-0 inline-flex items-center justify-center px-3.5 py-1.5 rounded-full text-xs font-semibold border" style="background: var(--color-bg-elevated); border-color: var(--color-border); color: var(--color-text-secondary); font-size: var(--text-xs);">AB 1-1</button>

          <!-- Primary play button -->
          <button class="shrink-0 flex items-center justify-center rounded-full" style="width: 48px; height: 48px; background: var(--color-primary); box-shadow: 0 4px 16px rgba(232,100,106,0.3);" aria-label="播放">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11.36-6.86a1 1 0 0 0 0-1.72L9.5 4.28a1 1 0 0 0-1.5.86Z" fill="#FFFFFF"/>
            </svg>
          </button>

          <!-- Compare mode pill -->
          <button data-mode="compare-bottom" class="shrink-0 inline-flex items-center justify-center px-3.5 py-1.5 rounded-full text-xs font-semibold border" style="background: var(--color-bg-elevated); border-color: var(--color-border); color: var(--color-text-secondary); font-size: var(--text-xs);">技术分析</button>

          <!-- Spacer to balance -->
          <div class="shrink-0" style="width: 52px;"></div>
        </div>
      </div>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
