<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扒舞助手 - 首页</title>
    <style id="theme-vars">
/* ============================================
   Brand CSS — Instagram-inspired Dance Practice App
   Style: Warm, trendy, minimal, editorial
   Tone: Warm/Human with fashion magazine feel
   ============================================ */

:root {
  /* === Color System === */
  /* Primary: Warm coral-rose */
  --primary: #E8646A;
  --primary-foreground: #FFFFFF;

  /* Background & Foreground */
  --background: #FAF8F6;
  --foreground: #1A1A1A;

  /* Card */
  --card: #FFFFFF;
  --card-foreground: #1A1A1A;

  /* Muted */
  --muted: #F2EFEC;
  --muted-foreground: #A39E99;

  /* Secondary text */
  --secondary-foreground: #6B6560;

  /* Border */
  --border: rgba(0, 0, 0, 0.06);
  --input: rgba(0, 0, 0, 0.06);
  --ring: #E8646A;

  /* Destructive */
  --destructive: #E05555;

  /* State Colors */
  --state-success: #4CAF82;
  --state-success-bg: rgba(76, 175, 130, 0.1);
  --state-warning: #F0A030;
  --state-warning-bg: rgba(240, 160, 48, 0.1);
  --state-error: #E05555;
  --state-error-bg: rgba(224, 85, 85, 0.1);
  --state-info: #6BA3D6;
  --state-info-bg: rgba(107, 163, 214, 0.1);

  /* Alias variables for custom usage */
  --color-primary: #E8646A;
  --color-primary-hover: #D4545A;
  --color-primary-light: rgba(232, 100, 106, 0.12);
  --color-primary-muted: rgba(232, 100, 106, 0.06);
  --color-bg: #FAF8F6;
  --color-bg-elevated: #FFFFFF;
  --color-bg-sunken: #F2EFEC;
  --color-bg-inset: #EBE8E4;
  --color-text: #1A1A1A;
  --color-text-secondary: #6B6560;
  --color-text-muted: #A39E99;
  --color-text-inverse: #FFFFFF;
  --color-border: rgba(0, 0, 0, 0.06);
  --color-border-strong: rgba(0, 0, 0, 0.12);
  --color-divider: rgba(0, 0, 0, 0.04);

  /* === Typography === */
  --font-display: 'DM Serif Display', Georgia, 'Noto Serif SC', serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --font-mono: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;

  /* Type Scale */
  --text-xs: 11px;
  --text-sm: 13px;
  --text-base: 15px;
  --text-md: 17px;
  --text-lg: 22px;
  --text-xl: 28px;
  --text-2xl: 36px;
  --text-3xl: 48px;

  /* Line Heights */
  --leading-tight: 1.2;
  --leading-snug: 1.35;
  --leading-normal: 1.5;
  --leading-relaxed: 1.65;

  /* Font Weights */
  --weight-normal: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;

  /* === Shape System === */
  --radius-sm: 4px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* === Spacing System === */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  /* === Surface & Depth === */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.06);
  --shadow-float: 0 16px 48px rgba(0, 0, 0, 0.1);
}

/* === Typography Classes === */
.font-display { font-family: var(--font-display); font-weight: var(--weight-bold); line-height: var(--leading-tight); }
.font-body { font-family: var(--font-body); font-weight: var(--weight-normal); line-height: var(--leading-normal); }
.font-mono { font-family: var(--font-mono); }

.text-xs { font-size: var(--text-xs); }
.text-sm { font-size: var(--text-sm); }
.text-base { font-size: var(--text-base); }
.text-md { font-size: var(--text-md); }
.text-lg { font-size: var(--text-lg); }
.text-xl { font-size: var(--text-xl); }
.text-2xl { font-size: var(--text-2xl); }
.text-3xl { font-size: var(--text-3xl); }

.font-medium { font-weight: var(--weight-medium); }
.font-semibold { font-weight: var(--weight-semibold); }
.font-bold { font-weight: var(--weight-bold); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-foreground: var(--primary-foreground);
  }
  @layer base {
    body { background: var(--primary-background); color: var(--primary-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main style="background: var(--color-bg); padding-bottom: 80px;">

        <!-- Header -->
        <header style="padding: 20px 20px 16px;">
            <div style="display: flex; align-items: center; justify-content: space-between;">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div style="width: 44px; height: 44px; border-radius: 9999px; background: linear-gradient(135deg, #E8646A, #F2A6AD); display: flex; align-items: center; justify-content: center; color: #fff; font-family: var(--font-display); font-size: 18px; flex-shrink: 0;">S</div>
                    <div>
                        <h1 style="font-family: var(--font-display); font-size: 22px; color: var(--color-text); margin: 0; line-height: 1.3;">Hey, 练习生</h1>
                        <p style="font-size: 13px; color: var(--color-text-secondary); margin: 2px 0 0;">练习时长2年半</p>
                    </div>
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <button style="width: 38px; height: 38px; border-radius: 9999px; border: 1px solid var(--color-border); background: var(--color-bg-elevated); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--color-text-secondary);" aria-label="通知">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
                    </button>
                    <button style="width: 38px; height: 38px; border-radius: 9999px; border: 1px solid var(--color-border); background: var(--color-bg-elevated); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--color-text-secondary);" aria-label="设置">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- Quick Actions -->
        <section style="padding: 4px 20px 20px;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <!-- New Practice Card -->
                <div data-dom-id="cta-new-practice" style="background: linear-gradient(135deg, #E8646A 0%, #F28B8E 100%); border-radius: 16px; padding: 18px 16px; cursor: pointer; color: #fff; position: relative; overflow: hidden;">
                    <div style="position: absolute; top: -10px; right: -10px; width: 60px; height: 60px; border-radius: 9999px; background: rgba(255,255,255,0.12);"></div>
                    <div style="position: absolute; bottom: -16px; right: -16px; width: 48px; height: 48px; border-radius: 9999px; background: rgba(255,255,255,0.08);"></div>
                    <div style="width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,0.22); display: flex; align-items: center; justify-content: center; margin-bottom: 12px;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.912 5.813a2 2 0 0 0 1.275 1.275L21 12l-5.813 1.912a2 2 0 0 0-1.275 1.275L12 21l-1.912-5.813a2 2 0 0 0-1.275-1.275L3 12l5.813-1.912a2 2 0 0 0 1.275-1.275L12 3z"/></svg>
                    </div>
                    <p style="font-size: 15px; font-weight: 600; margin: 0 0 4px; line-height: 1.3;">新建练习</p>
                    <p style="font-size: 12px; opacity: 0.85; margin: 0; line-height: 1.4;">导入视频，开始扒舞</p>
                </div>

                <!-- Continue Practice Card -->
                <div data-dom-id="cta-continue-practice" style="background: linear-gradient(135deg, #4CAF82 0%, #7BC8A4 100%); border-radius: 16px; padding: 18px 16px; cursor: pointer; color: #fff; position: relative; overflow: hidden;">
                    <div style="position: absolute; top: -10px; right: -10px; width: 60px; height: 60px; border-radius: 9999px; background: rgba(255,255,255,0.12);"></div>
                    <div style="position: absolute; bottom: -16px; right: -16px; width: 48px; height: 48px; border-radius: 9999px; background: rgba(255,255,255,0.08);"></div>
                    <div style="width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,0.22); display: flex; align-items: center; justify-content: center; margin-bottom: 12px;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff" stroke="none"><polygon points="6,3 20,12 6,21"/></svg>
                    </div>
                    <p style="font-size: 15px; font-weight: 600; margin: 0 0 4px; line-height: 1.3;">继续练习</p>
                    <p style="font-size: 12px; opacity: 0.85; margin: 0; line-height: 1.4;">Pink Venom</p>
                </div>
            </div>
        </section>

        <!-- Recent Practice List -->
        <section style="padding: 0 20px;">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;">
                <h2 style="font-family: var(--font-display); font-size: 18px; color: var(--color-text); margin: 0; line-height: 1.3;">最近练习</h2>
                <a href="#" style="font-size: 13px; color: var(--color-primary); text-decoration: none; font-weight: 500;">查看全部</a>
            </div>

            <!-- Task List Container -->
            <div style="background: var(--color-bg-elevated); border-radius: 16px; border: 1px solid var(--color-border); overflow: hidden;">

                <!-- Task Item 1 -->
                <div data-dom-id="task-item-1" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--color-border);">
                    <div style="width: 40px; height: 40px; border-radius: 10px; background: var(--color-bg-sunken); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 18px;">🎵</div>
                    <div style="flex: 1; min-width: 0;">
                        <p style="font-size: 14px; font-weight: 600; color: var(--color-text); margin: 0; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">BLACKPINK - Pink Venom</p>
                        <p style="font-size: 12px; color: var(--color-text-muted); margin: 3px 0 0;">2小时前 · 节奏练习</p>
                    </div>
                    <span style="font-size: 12px; color: var(--color-text-secondary); background: var(--color-bg-sunken); padding: 3px 10px; border-radius: 9999px; white-space: nowrap; flex-shrink: 0;">2h</span>
                </div>

                <!-- Task Item 2 -->
                <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--color-border);">
                    <div style="width: 40px; height: 40px; border-radius: 10px; background: var(--color-bg-sunken); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 18px;">🎶</div>
                    <div style="flex: 1; min-width: 0;">
                        <p style="font-size: 14px; font-weight: 600; color: var(--color-text); margin: 0; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">NewJeans - Super Shy</p>
                        <p style="font-size: 12px; color: var(--color-text-muted); margin: 3px 0 0;">昨天 · 动作分解</p>
                    </div>
                    <span style="font-size: 12px; color: var(--color-text-secondary); background: var(--color-bg-sunken); padding: 3px 10px; border-radius: 9999px; white-space: nowrap; flex-shrink: 0;">1.5h</span>
                </div>

                <!-- Task Item 3 -->
                <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--color-border);">
                    <div style="width: 40px; height: 40px; border-radius: 10px; background: var(--color-bg-sunken); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 18px;">🎵</div>
                    <div style="flex: 1; min-width: 0;">
                        <p style="font-size: 14px; font-weight: 600; color: var(--color-text); margin: 0; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">IVE - Love Dive</p>
                        <p style="font-size: 12px; color: var(--color-text-muted); margin: 3px 0 0;">3天前 · 全曲练习</p>
                    </div>
                    <span style="font-size: 12px; color: var(--color-text-secondary); background: var(--color-bg-sunken); padding: 3px 10px; border-radius: 9999px; white-space: nowrap; flex-shrink: 0;">3h</span>
                </div>

                <!-- Task Item 4 -->
                <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px;">
                    <div style="width: 40px; height: 40px; border-radius: 10px; background: var(--color-bg-sunken); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 18px;">🎶</div>
                    <div style="flex: 1; min-width: 0;">
                        <p style="font-size: 14px; font-weight: 600; color: var(--color-text); margin: 0; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">aespa - Next Level</p>
                        <p style="font-size: 12px; color: var(--color-text-muted); margin: 3px 0 0;">1周前 · 全曲练习</p>
                    </div>
                    <span style="width: 28px; height: 28px; border-radius: 9999px; background: var(--state-success); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                    </span>
                </div>
            </div>
        </section>

    </main>

    <!-- Bottom Tab Bar -->
    <nav style="position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; background: rgba(250, 248, 246, 0.88); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--color-border);">
        <div style="display: flex; align-items: center; justify-content: space-around; height: 52px; max-width: 100%; padding: 0 8px;">
            <button data-active="true" style="display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: none; cursor: pointer; padding: 4px 12px; color: var(--color-primary);">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="var(--color-primary)" stroke="var(--color-primary)" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22" stroke="#fff" fill="none" stroke-width="1.5"/></svg>
                <span style="font-size: 11px; font-weight: 600; color: var(--color-primary);">首页</span>
            </button>
            <button data-dom-id="nav-practice-tab" style="display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: none; cursor: pointer; padding: 4px 12px; color: var(--color-text-muted);">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="15.5" r="2.5"/><path d="M8 17V5l12-2v12"/></svg>
                <span style="font-size: 11px; font-weight: 500; color: inherit;">练习</span>
            </button>
            <button data-dom-id="nav-profile-tab" style="display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: none; cursor: pointer; padding: 4px 12px; color: var(--color-text-muted);">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span style="font-size: 11px; font-weight: 500; color: inherit;">我的</span>
            </button>
        </div>
    </nav>
    <script>lucide.createIcons();</script>
</body>
</html>
