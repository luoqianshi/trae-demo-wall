<!-- =============================================
     灵光周报 - Lingguang Weekly
     Shared Navigation Shell (Partial)
     Cyberpunk / Future Street Style
     ============================================= -->

<!-- Google Fonts: Orbitron + Rajdhani -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Tailwind Config -->
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          cyber: {
            bg:       '#0a0a1a',
            elevated: '#12122a',
            surface:  '#1a1a3e',
            primary:  '#00f0ff',
            text:     '#f0f0ff',
            muted:    '#a0a0cc',
            dim:      '#6060a0',
          }
        },
        fontFamily: {
          display: ['Orbitron', 'Rajdhani', 'Noto Sans SC', 'sans-serif'],
          body:    ['Rajdhani', 'Noto Sans SC', 'system-ui', 'sans-serif'],
          mono:    ['JetBrains Mono', 'Fira Code', 'monospace'],
        }
      }
    }
  }
</script>

<!-- Shell-Specific Styles -->
<style>
  /* Header glassmorphism + fixed position */
  .site-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    background: rgba(10, 10, 26, 0.9);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(0, 240, 255, 0.15);
  }

  /* Logo neon glow */
  .logo-text {
    font-family: 'Orbitron', sans-serif;
    color: #00f0ff;
    text-shadow: 0 0 10px rgba(0, 240, 255, 0.5), 0 0 30px rgba(0, 240, 255, 0.2);
    letter-spacing: 0.1em;
  }

  /* Nav link base */
  .nav-link {
    position: relative;
    color: #a0a0cc;
    font-family: 'Rajdhani', 'Noto Sans SC', sans-serif;
    font-weight: 500;
    font-size: 1rem;
    letter-spacing: 0.05em;
    padding: 0.5rem 0.75rem;
    transition: color 0.2s ease, text-shadow 0.2s ease;
    text-decoration: none;
  }

  .nav-link:hover {
    color: #f0f0ff;
  }

  /* Active nav item: neon bottom border + glow */
  .nav-link[data-active="true"],
  .nav-link.is-active {
    color: #00f0ff;
    text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
  }

  .nav-link[data-active="true"]::after,
  .nav-link.is-active::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0;
    right: 0;
    height: 2px;
    background: #00f0ff;
    box-shadow: 0 0 8px rgba(0, 240, 255, 0.6), 0 0 20px rgba(0, 240, 255, 0.3);
    border-radius: 1px;
  }

  /* Search button */
  .search-btn {
    color: #a0a0cc;
    transition: color 0.2s ease, text-shadow 0.2s ease;
    padding: 0.375rem;
    border-radius: 4px;
  }

  .search-btn:hover {
    color: #00f0ff;
    text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
  }

  /* Footer scanline overlay */
  .site-footer {
    position: relative;
    background: #0a0a1a;
    border-top: 1px solid rgba(0, 240, 255, 0.15);
    overflow: hidden;
  }

  .site-footer::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0, 240, 255, 0.015) 2px,
      rgba(0, 240, 255, 0.015) 4px
    );
    pointer-events: none;
    z-index: 1;
  }
</style>


<!-- ===================== HEADER ===================== -->
<header class="site-header">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-14">

      <!-- Logo -->
      <a href="#" class="logo-text text-lg sm:text-xl font-bold flex-shrink-0 select-none">
        灵光周报
      </a>

      <!-- Center Navigation -->
      <nav class="hidden md:flex items-center space-x-1">
        <a href="#" class="nav-link" data-nav-key="home">首页</a>
        <a href="#" class="nav-link" data-nav-key="robot">AI黑科技</a>
        <a href="#" class="nav-link" data-nav-key="art">AI绘画建模</a>
        <a href="#" class="nav-link" data-nav-key="music">AI音乐</a>
        <a href="#" class="nav-link" data-nav-key="gaming">AI游戏</a>
      </nav>

      <!-- Right: Search Button -->
      <div class="flex items-center flex-shrink-0">
        <button class="search-btn" type="button" aria-label="搜索">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>

        <!-- Mobile Menu Button (hidden on md+) -->
        <button class="md:hidden search-btn ml-2" type="button" aria-label="菜单">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>

    </div>
  </div>

  <!-- Mobile Navigation (hidden by default) -->
  <nav class="md:hidden border-t border-white/5 hidden" id="mobile-nav">
    <div class="px-4 py-3 space-y-1">
      <a href="#" class="nav-link block" data-nav-key="home">首页</a>
      <a href="#" class="nav-link block" data-nav-key="robot">AI黑科技</a>
      <a href="#" class="nav-link block" data-nav-key="art">AI绘画建模</a>
      <a href="#" class="nav-link block" data-nav-key="music">AI音乐</a>
      <a href="#" class="nav-link block" data-nav-key="gaming">AI游戏</a>
    </div>
  </nav>
</header>


<!-- Spacer to offset fixed header -->
<div class="h-14"></div>


<!-- ===================== FOOTER ===================== -->
<footer class="site-footer">
  <div class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <p class="text-center text-sm" style="color: #6060a0; font-family: 'Rajdhani', 'Noto Sans SC', sans-serif; letter-spacing: 0.05em;">
      &copy; 2025 灵光周报 &middot; 你的AI资讯雷达
    </p>
  </div>
</footer>
