<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>家庭饮食记录</title>
<style>
  :root {
    --primary: #FF6B35;
    --primary-light: #FF8C5A;
    --primary-dark: #E55A25;
    --secondary: #4ECDC4;
    --secondary-light: #7EDDD6;
    --bg: #FFF8F0;
    --card: #FFFFFF;
    --text: #2D3436;
    --text-light: #636E72;
    --border: #F0E6DC;
    --danger: #FF6B6B;
    --success: #51CF66;
    --warning: #FFD93D;
    --shadow: 0 4px 20px rgba(0,0,0,0.08);
    --radius: 16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
    overflow-x: hidden;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    padding: 20px 20px 30px;
    color: white;
    position: relative;
    overflow: hidden;
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: -20px;
    left: 0;
    right: 0;
    height: 40px;
    background: var(--bg);
    border-radius: 20px 20px 0 0;
  }
  .header h1 {
    font-size: 24px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-top: 12px;
  }
  .header .date-nav button {
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .header .date-nav button:hover { background: rgba(255,255,255,0.3); }
  .header .current-date {
    font-size: 16px;
    font-weight: 600;
    min-width: 140px;
    text-align: center;
  }
  .today-btn {
    margin-top: 8px;
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    padding: 4px 14px;
    border-radius: 12px;
    font-size: 12px;
    cursor: pointer;
    display: block;
    margin-left: auto;
    margin-right: auto;
    margin-top: 6px;
  }
  .today-btn:hover { background: rgba(255,255,255,0.3); }

  /* Tab Bar */
  .tab-bar {
    display: flex;
    background: var(--card);
    padding: 4px;
    margin: 0 16px;
    border-radius: 12px;
    box-shadow: var(--shadow);
    position: relative;
    top: -10px;
    z-index: 10;
  }
  .tab-bar button {
    flex: 1;
    padding: 10px;
    border: none;
    background: transparent;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 10px;
    transition: all 0.3s;
  }
  .tab-bar button.active {
    background: var(--primary);
    color: white;
    box-shadow: 0 2px 10px rgba(255,107,53,0.3);
  }

  /* Content */
  .content {
    padding: 16px;
    padding-bottom: 80px;
  }
  .page { display: none; }
  .page.active { display: block; }

  /* Cards */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .card-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title .icon { font-size: 20px; }

  /* Member Tags */
  .member-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }
  .member-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    border: 2px solid transparent;
  }
  .member-tag .remove {
    font-size: 16px;
    opacity: 0.6;
    cursor: pointer;
    line-height: 1;
  }
  .member-tag .remove:hover { opacity: 1; }
  .member-tag:nth-child(6n+1) { background: #FFE8D6; color: #C75C2E; }
  .member-tag:nth-child(6n+2) { background: #D6F0FF; color: #2E7BC7; }
  .member-tag:nth-child(6n+3) { background: #D6FFE8; color: #2E8C5A; }
  .member-tag:nth-child(6n+4) { background: #FFE8F0; color: #C72E6B; }
  .member-tag:nth-child(6n+5) { background: #E8D6FF; color: #7B2EC7; }
  .member-tag:nth-child(6n+6) { background: #FFF3D6; color: #C7962E; }

  /* Add Member */
  .add-row {
    display: flex;
    gap: 8px;
  }
  .add-row input {
    flex: 1;
    padding: 10px 14px;
    border: 2px solid var(--border);
    border-radius: 12px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .add-row input:focus { border-color: var(--primary); }
  .btn-add {
    padding: 10px 18px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s;
  }
  .btn-add:hover { background: var(--primary-dark); }

  /* Meal Section */
  .meal-section {
    margin-bottom: 16px;
  }
  .meal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .meal-type {
    font-size: 15px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .meal-type .meal-icon { font-size: 20px; }
  .btn-add-meal {
    padding: 6px 14px;
    background: var(--secondary);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-add-meal:hover { background: #3DBDB5; }

  .food-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-height: 40px;
  }
  .food-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 6px 12px;
    background: #FFF3EB;
    border-radius: 16px;
    font-size: 13px;
    font-weight: 500;
    color: var(--primary-dark);
  }
  .food-chip .del {
    font-size: 14px;
    opacity: 0.5;
    cursor: pointer;
  }
  .food-chip .del:hover { opacity: 1; }
  .no-food {
    font-size: 13px;
    color: #B2BEC3;
    font-style: italic;
    padding: 8px 0;
  }

  /* Food Picker Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4);
    z-index: 100;
    justify-content: center;
    align-items: flex-end;
    max-width: 480px;
    margin: 0 auto;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--card);
    border-radius: 20px 20px 0 0;
    padding: 20px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .modal-header h3 {
    font-size: 18px;
    font-weight: 700;
  }
  .modal-close {
    width: 32px;
    height: 32px;
    border: none;
    background: #F0F0F0;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Category Tabs in Modal */
  .category-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
    overflow-x: auto;
    padding-bottom: 4px;
    -webkit-overflow-scrolling: touch;
  }
  .category-tabs::-webkit-scrollbar { display: none; }
  .cat-tab {
    padding: 6px 14px;
    border-radius: 16px;
    border: none;
    background: #F5F0EB;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-light);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .cat-tab.active {
    background: var(--primary);
    color: white;
  }

  .food-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .food-item {
    padding: 10px 4px;
    border-radius: 12px;
    border: 2px solid var(--border);
    text-align: center;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    background: white;
    position: relative;
  }
  .food-item:hover {
    border-color: var(--primary);
    background: #FFF5EE;
  }
  .food-item.selected {
    border-color: var(--primary);
    background: var(--primary);
    color: white;
  }

  .custom-food-row {
    display: flex;
    gap: 8px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .custom-food-row input {
    flex: 1;
    padding: 10px 14px;
    border: 2px solid var(--border);
    border-radius: 12px;
    font-size: 14px;
    outline: none;
  }
  .custom-food-row input:focus { border-color: var(--secondary); }
  .btn-custom {
    padding: 10px 18px;
    background: var(--secondary);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }

  /* Summary Page */
  .summary-stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }
  .stat-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
    text-align: center;
  }
  .stat-value {
    font-size: 28px;
    font-weight: 800;
    color: var(--primary);
  }
  .stat-label {
    font-size: 12px;
    color: var(--text-light);
    margin-top: 4px;
  }
  .top-foods {
    list-style: none;
  }
  .top-foods li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .top-foods li:last-child { border-bottom: none; }
  .food-rank {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    margin-right: 10px;
  }
  .rank-1 { background: #FFD93D; color: #8B6914; }
  .rank-2 { background: #E0E0E0; color: #666; }
  .rank-3 { background: #FFE0CC; color: #C75C2E; }
  .food-count {
    background: #FFF3EB;
    padding: 2px 10px;
    border-radius: 10px;
    font-size: 12px;
    color: var(--primary-dark);
    font-weight: 600;
  }

  /* Settings */
  .setting-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }
  .setting-item:last-child { border-bottom: none; }
  .setting-label {
    font-size: 14px;
    font-weight: 600;
  }
  .setting-desc {
    font-size: 12px;
    color: var(--text-light);
    margin-top: 2px;
  }
  .btn-danger {
    padding: 8px 16px;
    background: var(--danger);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-secondary {
    padding: 8px 16px;
    background: var(--secondary);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  /* Toast */
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: var(--text);
    color: white;
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    z-index: 200;
    transition: transform 0.3s ease;
    max-width: 300px;
    text-align: center;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
  }

  /* Calendar Mini */
  .calendar-strip {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 4px 0 8px;
    -webkit-overflow-scrolling: touch;
  }
  .calendar-strip::-webkit-scrollbar { display: none; }
  .cal-day {
    min-width: 44px;
    padding: 8px 4px;
    border-radius: 12px;
    text-align: center;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.2s;
  }
  .cal-day:hover { border-color: var(--primary-light); }
  .cal-day.active {
    border-color: var(--primary);
    background: #FFF5EE;
  }
  .cal-day.today {
    background: var(--primary);
    color: white;
  }
  .cal-day.today.active {
    background: var(--primary-dark);
  }
  .cal-day .day-num {
    font-size: 16px;
    font-weight: 700;
  }
  .cal-day .day-label {
    font-size: 11px;
    color: var(--text-light);
    margin-top: 2px;
  }
  .cal-day.today .day-label { color: rgba(255,255,255,0.8); }
  .cal-day .has-record {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--secondary);
    margin: 4px auto 0;
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-light);
  }
  .empty-state .empty-icon {
    font-size: 60px;
    margin-bottom: 12px;
  }
  .empty-state p {
    font-size: 14px;
    line-height: 1.6;
  }
</style>
</head>
<body>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Header -->
<div class="header">
  <h1>🏠 家庭饮食记录</h1>
  <div class="date-nav">
    <button onclick="changeDate(-1)">◀</button>
    <div class="current-date" id="currentDate"></div>
    <button onclick="changeDate(1)">▶</button>
  </div>
  <button class="today-btn" onclick="goToday()">回到今天</button>
</div>

<!-- Calendar Strip -->
<div style="padding: 10px 16px 0; margin-top: -4px;">
  <div class="calendar-strip" id="calendarStrip"></div>
</div>

<!-- Tab Bar -->
<div class="tab-bar" id="tabBar">
  <button class="active" data-tab="record">📝 记录</button>
  <button data-tab="summary">📊 统计</button>
  <button data-tab="settings">⚙️ 设置</button>
</div>

<!-- Content -->
<div class="content">

  <!-- Record Page -->
  <div class="page active" id="page-record">
    <!-- Members Card -->
    <div class="card">
      <div class="card-title"><span class="icon">👨‍👩‍👧‍👦</span> 家庭成员</div>
      <div class="member-tags" id="memberTags"></div>
      <div class="add-row">
        <input type="text" id="newMemberInput" placeholder="输入成员姓名..." maxlength="10">
        <button class="btn-add" onclick="addMember()">添加</button>
      </div>
    </div>

    <!-- Meals -->
    <div id="mealSections"></div>
  </div>

  <!-- Summary Page -->
  <div class="page" id="page-summary">
    <div class="summary-stats" id="summaryStats"></div>
    <div class="card">
      <div class="card-title"><span class="icon">🔥</span> 本月热门食物 TOP 10</div>
      <ul class="top-foods" id="topFoods"></ul>
      <div class="empty-state" id="emptySummary" style="display:none;">
        <div class="empty-icon">🍽️</div>
        <p>暂无饮食记录<br>快去记录今天的饮食吧！</p>
      </div>
    </div>
  </div>

  <!-- Settings Page -->
  <div class="page" id="page-settings">
    <div class="card">
      <div class="card-title"><span class="icon">📂</span> 数据管理</div>
      <div class="setting-item">
        <div>
          <div class="setting-label">清理过期数据</div>
          <div class="setting-desc">删除超过30天的饮食记录</div>
        </div>
        <button class="btn-secondary" onclick="cleanOldData()">清理</button>
      </div>
      <div class="setting-item">
        <div>
          <div class="setting-label">清除所有数据</div>
          <div class="setting-desc">删除全部记录、成员和自定义食物</div>
        </div>
        <button class="btn-danger" onclick="clearAllData()">清除</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title"><span class="icon">🍌</span> 自定义食物管理</div>
      <div id="customFoodList" class="food-list"></div>
      <div class="add-row" style="margin-top: 12px;">
        <input type="text" id="newFoodInput" placeholder="输入食物名称..." maxlength="20">
        <select id="newFoodCategory" style="padding:10px;border:2px solid var(--border);border-radius:12px;font-size:14px;outline:none;">
        </select>
        <button class="btn-add" onclick="addCustomFood()">添加</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title"><span class="icon">ℹ️</span> 关于</div>
      <div class="setting-item">
        <div>
          <div class="setting-label">家庭饮食记录 v1.0</div>
          <div class="setting-desc">记录保持在一个月内，数据存储在本地浏览器中</div>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- Food Picker Modal -->
<div class="modal-overlay" id="foodModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">选择食物</h3>
      <button class="modal-close" onclick="closeFoodModal()">✕</button>
    </div>
    <div class="category-tabs" id="categoryTabs"></div>
    <div class="food-grid" id="foodGrid"></div>
    <div style="text-align:center;margin-bottom:8px;">
      <button class="btn-add-meal" id="modalConfirmBtn" onclick="confirmFoodSelection()" style="padding:10px 30px;font-size:15px;">确认添加</button>
    </div>
    <div class="custom-food-row">
      <input type="text" id="modalCustomFood" placeholder="输入自定义食物名称..." maxlength="20">
      <button class="btn-custom" onclick="addCustomFoodFromModal()">快速添加</button>
    </div>
  </div>
</div>

<!-- Avatar Picker Modal -->
<div class="modal-overlay" id="avatarModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="avatarModalTitle">选择头像</h3>
      <button class="modal-close" onclick="closeAvatarModal()">✕</button>
    </div>
    <div style="font-size:12px;color:var(--text-light);margin-bottom:10px;">点击头像即可选择</div>
    <div class="food-grid" id="avatarGrid" style="grid-template-columns:repeat(8,1fr);"></div>
  </div>
</div>

<script>
// ==================== DATA ====================
const STORAGE_KEY = 'family_diet_app';
const DAYS_TO_KEEP = 30;

const PRESET_FOODS = {
  '主食': ['米饭', '馒头', '面条', '包子', '饺子', '馄饨', '粥', '面包', '饼', '炒饭', '炒面', '年糕', '粽子', '汤圆', '燕麦', '玉米'],
  '蔬菜': ['白菜', '菠菜', '西兰花', '胡萝卜', '番茄', '黄瓜', '豆角', '茄子', '青椒', '土豆', '洋葱', '生菜', '芹菜', '南瓜', '莲藕', '木耳'],
  '肉类': ['猪肉', '牛肉', '鸡肉', '鸭肉', '羊肉', '鱼', '虾', '排骨', '鸡翅', '火腿', '培根', '肉丸'],
  '蛋奶': ['鸡蛋', '鸭蛋', '鹌鹑蛋', '牛奶', '酸奶', '奶酪', '豆浆'],
  '水果': ['苹果', '香蕉', '橙子', '葡萄', '西瓜', '草莓', '桃子', '梨', '芒果', '猕猴桃', '樱桃', '蓝莓'],
  '汤类': ['紫菜蛋花汤', '番茄蛋汤', '排骨汤', '鸡汤', '鱼汤', '牛肉汤', '绿豆汤', '银耳汤'],
  '零食': ['饼干', '蛋糕', '冰淇淋', '巧克力', '坚果', '薯片', '果冻', '糖果'],
  '饮品': ['水', '茶', '果汁', '可乐', '咖啡', '奶茶', '椰汁']
};

const MEAL_TYPES = [
  { key: 'breakfast', label: '早餐', icon: '🌅' },
  { key: 'lunch',     label: '午餐', icon: '☀️' },
  { key: 'dinner',    label: '晚餐', icon: '🌙' },
  { key: 'snack',     label: '加餐', icon: '🍪' }
];

const AVATAR_OPTIONS = ['👦','👧','👨','👩','👴','👵','🧒','👶','🧑','👱','🧔','👸','🤴','🧑‍🦰','👩‍🦰','👨‍🦰','🧑‍🦱','👩‍🦱','👨‍🦱','🧑‍🦳','👩‍🦳','👨‍🦳','🧑‍🦲','👩‍🦲','👨‍🦲','🐶','🐱','🐰','🐻','🦊','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐧','🐦','🐔','🦄','🐺','🐴','🦋','🐙','🦀','🐢','🐳','🧸','🍴','🥢','🍰','🧁'];

// ==================== STATE ====================
let state = loadState();
let selectedDate = getTodayStr();
let activeMealType = null;
let selectedFoods = new Set();
let activeCategory = null;

function defaultState() {
  return {
    members: [], // [{name, avatar}]
    customFoods: [],
    records: {} // key: 'YYYY-MM-DD', value: { memberName: { breakfast:[], lunch:[], dinner:[], snack:[] } }
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const s = JSON.parse(raw);
    // Migration: convert old string members to object members
    if (s.members && s.members.length > 0 && typeof s.members[0] === 'string') {
      s.members = s.members.map(name => ({ name, avatar: '👤' }));
    }
    return { ...defaultState(), ...s };
  } catch(e) {
    return defaultState();
  }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

// ==================== DATE HELPERS ====================
function getTodayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function formatDateDisplay(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const weekdays = ['日','一','二','三','四','五','六'];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 周${weekdays[d.getDay()]}`;
}

function changeDate(delta) {
  const d = new Date(selectedDate + 'T00:00:00');
  d.setDate(d.getDate() + delta);
  selectedDate = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  renderAll();
}

function goToday() {
  selectedDate = getTodayStr();
  renderAll();
}

// ==================== MEMBERS ====================
function getMemberNames() {
  return state.members.map(m => m.name);
}

function addMember() {
  const input = document.getElementById('newMemberInput');
  const name = input.value.trim();
  if (!name) return showToast('请输入成员姓名');
  if (name.length > 10) return showToast('姓名不能超过10个字');
  if (getMemberNames().includes(name)) return showToast('该成员已存在');
  state.members.push({ name, avatar: '👤' });
  saveState();
  input.value = '';
  renderAll();
  openAvatarPicker(state.members.length - 1);
}

function removeMember(name) {
  if (!confirm(`确定要移除成员「${name}」吗？\n该成员的所有饮食记录也将被删除。`)) return;
  state.members = state.members.filter(m => m.name !== name);
  // Remove member records
  Object.keys(state.records).forEach(date => {
    if (state.records[date][name]) delete state.records[date][name];
  });
  saveState();
  renderAll();
  showToast(`已移除成员：${name}`);
}

function openAvatarPicker(memberIndex) {
  const member = state.members[memberIndex];
  if (!member) return;
  const overlay = document.getElementById('avatarModal');
  const title = document.getElementById('avatarModalTitle');
  title.textContent = `选择头像 - ${member.name}`;
  const grid = document.getElementById('avatarGrid');
  grid.innerHTML = AVATAR_OPTIONS.map(av =>
    `<div class="food-item ${member.avatar === av ? 'selected' : ''}" onclick="selectAvatar(${memberIndex}, '${av.replace(/'/g, "\\'")}')" style="font-size:28px;padding:12px 4px;">
      ${av}
    </div>`
  ).join('');
  overlay.classList.add('show');
}

function closeAvatarModal() {
  document.getElementById('avatarModal').classList.remove('show');
}

function selectAvatar(memberIndex, avatar) {
  if (!state.members[memberIndex]) return;
  state.members[memberIndex].avatar = avatar;
  saveState();
  closeAvatarModal();
  renderAll();
  showToast('头像已更新');
}

// ==================== FOODS ====================
function getAllCategories() {
  const cats = Object.keys(PRESET_FOODS);
  const customCats = new Set();
  state.customFoods.forEach(f => { if (f.category) customCats.add(f.category); });
  return [...cats, ...customCats];
}

function getFoodsByCategory(cat) {
  const foods = [];
  if (PRESET_FOODS[cat]) {
    PRESET_FOODS[cat].forEach(name => foods.push({ name, custom: false }));
  }
  state.customFoods.forEach(f => {
    if (f.category === cat) foods.push({ name: f.name, custom: true });
  });
  return foods;
}

function addCustomFood() {
  const input = document.getElementById('newFoodInput');
  const catSelect = document.getElementById('newFoodCategory');
  const name = input.value.trim();
  const category = catSelect.value;
  if (!name) return showToast('请输入食物名称');
  if (name.length > 20) return showToast('名称不能超过20个字');
  if (isFoodExists(name, category)) return showToast('该食物已存在');
  state.customFoods.push({ name, category });
  saveState();
  input.value = '';
  renderAll();
  showToast(`已添加自定义食物：${name}`);
}

function addCustomFoodFromModal() {
  const input = document.getElementById('modalCustomFood');
  const cat = activeCategory || Object.keys(PRESET_FOODS)[0];
  const name = input.value.trim();
  if (!name) return showToast('请输入食物名称');
  if (name.length > 20) return showToast('名称不能超过20个字');
  if (isFoodExists(name, cat)) return showToast('该食物已存在');
  state.customFoods.push({ name, category: cat });
  saveState();
  input.value = '';
  renderFoodGrid();
  showToast(`已添加：${name}`);
}

function removeCustomFood(index) {
  const food = state.customFoods[index];
  if (!food) return;
  if (!confirm(`确定要删除自定义食物「${food.name}」（分类：${food.category}）吗？`)) return;
  state.customFoods.splice(index, 1);
  saveState();
  renderAll();
  showToast(`已删除：${food.name}`);
}

function isFoodExists(name, category) {
  if (PRESET_FOODS[category] && PRESET_FOODS[category].includes(name)) return true;
  return state.customFoods.some(f => f.name === name && f.category === category);
}

// ==================== FOOD PICKER MODAL ====================
function openFoodModal(memberName, mealType) {
  activeMealType = { member: memberName, type: mealType };
  const mt = MEAL_TYPES.find(m => m.key === mealType);
  document.getElementById('modalTitle').textContent = `${memberName} - ${mt.label}`;
  activeCategory = Object.keys(PRESET_FOODS)[0];
  selectedFoods = new Set();
  renderCategoryTabs();
  renderFoodGrid();
  document.getElementById('foodModal').classList.add('show');
}

function closeFoodModal() {
  document.getElementById('foodModal').classList.remove('show');
  activeMealType = null;
  selectedFoods = new Set();
}

function renderCategoryTabs() {
  const container = document.getElementById('categoryTabs');
  const cats = getAllCategories();
  container.innerHTML = cats.map(cat =>
    `<button class="cat-tab ${cat === activeCategory ? 'active' : ''}" onclick="selectCategory('${cat}')">${cat}</button>`
  ).join('');
}

function selectCategory(cat) {
  activeCategory = cat;
  renderCategoryTabs();
  renderFoodGrid();
}

function renderFoodGrid() {
  const container = document.getElementById('foodGrid');
  const foods = getFoodsByCategory(activeCategory);
  if (foods.length === 0) {
    container.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:20px;color:#B2BEC3;">暂无食物</div>';
    return;
  }
  container.innerHTML = foods.map((f, idx) =>
    `<div class="food-item ${selectedFoods.has(f.name) ? 'selected' : ''}" onclick="toggleFood('${f.name.replace(/'/g, "\\'")}')">
      ${f.name}${f.custom ? ' ⭐' : ''}
      ${f.custom ? `<span class="del" style="position:absolute;top:2px;right:4px;font-size:12px;opacity:0.5;line-height:1;" onclick="event.stopPropagation();deleteCustomFoodInModal('${f.name.replace(/'/g, "\\'")}')">✕</span>` : ''}
    </div>`
  ).join('');
}

function toggleFood(name) {
  if (selectedFoods.has(name)) selectedFoods.delete(name);
  else selectedFoods.add(name);
  renderFoodGrid();
}

function deleteCustomFoodInModal(name) {
  if (!confirm(`确定要删除自定义食物「${name}」吗？`)) return;
  state.customFoods = state.customFoods.filter(f => !(f.name === name && f.category === activeCategory));
  selectedFoods.delete(name);
  saveState();
  renderFoodGrid();
  showToast(`已删除：${name}`);
}

function confirmFoodSelection() {
  if (!activeMealType) return;
  if (selectedFoods.size === 0) return showToast('请至少选择一种食物');

  const { member, type } = activeMealType;
  if (!state.records[selectedDate]) state.records[selectedDate] = {};
  if (!state.records[selectedDate][member]) state.records[selectedDate][member] = { breakfast: [], lunch: [], dinner: [], snack: [] };

  const count = selectedFoods.size;
  selectedFoods.forEach(food => {
    state.records[selectedDate][member][type].push(food);
  });

  saveState();
  closeFoodModal();
  renderAll();
  showToast(`已添加 ${count} 种食物`);
}

function removeMealFood(memberName, mealType, index) {
  if (!state.records[selectedDate] || !state.records[selectedDate][memberName]) return;
  state.records[selectedDate][memberName][mealType].splice(index, 1);
  saveState();
  renderAll();
}

// ==================== RENDER ====================
function renderAll() {
  renderDate();
  renderCalendar();
  renderMembers();
  renderMeals();
  renderSummary();
  renderCustomFoods();
  renderCategorySelect();
  cleanOldData(); // auto clean
}

function renderDate() {
  document.getElementById('currentDate').textContent = formatDateDisplay(selectedDate);
}

function renderCalendar() {
  const container = document.getElementById('calendarStrip');
  const today = new Date();
  const days = [];
  for (let i = -14; i <= 14; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() + i);
    days.push({
      dateStr: `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,
      num: d.getDate(),
      label: ['日','一','二','三','四','五','六'][d.getDay()],
      isToday: i === 0
    });
  }
  container.innerHTML = days.map(d => {
    const hasRecord = state.records[d.dateStr] && Object.values(state.records[d.dateStr]).some(m => MEAL_TYPES.some(mt => m[mt.key] && m[mt.key].length > 0));
    return `<div class="cal-day ${d.dateStr === selectedDate ? 'active' : ''} ${d.isToday ? 'today' : ''}" onclick="selectDate('${d.dateStr}')">
      <div class="day-num">${d.num}</div>
      <div class="day-label">${d.label}</div>
      ${hasRecord ? '<div class="has-record"></div>' : ''}
    </div>`;
  }).join('');
  // Scroll to active
  const active = container.querySelector('.active');
  if (active) active.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
}

function selectDate(dateStr) {
  selectedDate = dateStr;
  renderAll();
}

function renderMembers() {
  const container = document.getElementById('memberTags');
  if (state.members.length === 0) {
    container.innerHTML = '<div style="color:#B2BEC3;font-size:14px;">还没有添加家庭成员，请在下方添加 👇</div>';
    return;
  }
  container.innerHTML = state.members.map((m, i) =>
    `<span class="member-tag" onclick="openAvatarPicker(${i})" title="点击更换头像">
      <span style="font-size:20px;cursor:pointer;">${m.avatar}</span>
      ${m.name}
      <span class="remove" onclick="event.stopPropagation();removeMember('${m.name.replace(/'/g, "\\'")}')">✕</span>
    </span>`
  ).join('');
}

function renderMeals() {
  const container = document.getElementById('mealSections');
  if (state.members.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">👨‍👩‍👧‍👦</div><p>请先添加家庭成员</p></div>';
    return;
  }
  const dateRecord = state.records[selectedDate] || {};

  let html = '';
  state.members.forEach(member => {
    const memberRecord = dateRecord[member.name] || { breakfast: [], lunch: [], dinner: [], snack: [] };

    html += `<div class="card">
      <div class="card-title"><span class="icon">${member.avatar}</span> ${member.name}</div>`;

    MEAL_TYPES.forEach(mt => {
      const foods = memberRecord[mt.key] || [];
      html += `<div class="meal-section">
        <div class="meal-header">
          <span class="meal-type"><span class="meal-icon">${mt.icon}</span> ${mt.label}</span>
          <button class="btn-add-meal" onclick="openFoodModal('${member.name.replace(/'/g, "\\'")}', '${mt.key}')">+ 添加</button>
        </div>
        <div class="food-list">`;

      if (foods.length === 0) {
        html += '<span class="no-food">未记录</span>';
      } else {
        foods.forEach((food, idx) => {
          html += `<span class="food-chip">${food} <span class="del" onclick="removeMealFood('${member.name.replace(/'/g, "\\'")}','${mt.key}',${idx})">✕</span></span>`;
        });
      }

      html += `</div></div>`;
    });

    html += '</div>';
  });

  container.innerHTML = html;
}

function renderSummary() {
  const statsContainer = document.getElementById('summaryStats');
  const foodsContainer = document.getElementById('topFoods');
  const emptyEl = document.getElementById('emptySummary');

  // Count stats
  let totalDays = 0;
  let totalFoods = 0;
  const foodCount = {};

  Object.keys(state.records).forEach(date => {
    let hasAny = false;
    Object.values(state.records[date]).forEach(memberData => {
      MEAL_TYPES.forEach(mt => {
        const foods = memberData[mt.key] || [];
        foods.forEach(f => {
          foodCount[f] = (foodCount[f] || 0) + 1;
          totalFoods++;
          hasAny = true;
        });
      });
    });
    if (hasAny) totalDays++;
  });

  statsContainer.innerHTML = `
    <div class="stat-card">
      <div class="stat-value">${totalDays}</div>
      <div class="stat-label">记录天数</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${totalFoods}</div>
      <div class="stat-label">食物总条数</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${state.members.length}</div>
      <div class="stat-label">家庭成员</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${Object.keys(foodCount).length}</div>
      <div class="stat-label">不同食物</div>
    </div>
  `;

  const sorted = Object.entries(foodCount).sort((a, b) => b[1] - a[1]).slice(0, 10);
  if (sorted.length === 0) {
    foodsContainer.innerHTML = '';
    emptyEl.style.display = 'block';
  } else {
    emptyEl.style.display = 'none';
    foodsContainer.innerHTML = sorted.map(([name, count], i) => {
      const rankClass = i < 3 ? `rank-${i+1}` : '';
      return `<li>
        <span style="display:flex;align-items:center;">
          <span class="food-rank ${rankClass}">${i+1}</span>
          ${name}
        </span>
        <span class="food-count">${count}次</span>
      </li>`;
    }).join('');
  }
}

function renderCustomFoods() {
  const container = document.getElementById('customFoodList');
  if (state.customFoods.length === 0) {
    container.innerHTML = '<span class="no-food">暂无自定义食物</span>';
    return;
  }
  container.innerHTML = state.customFoods.map((f, i) =>
    `<span class="food-chip" style="background:#D6FFE8;color:#2E8C5A;">
      [${f.category}] ${f.name} ⭐ <span class="del" onclick="removeCustomFood(${i})">✕</span>
    </span>`
  ).join('');
}

function renderCategorySelect() {
  const sel = document.getElementById('newFoodCategory');
  const cats = getAllCategories();
  if (sel.children.length !== cats.length || sel.value === '') {
    sel.innerHTML = cats.map(c => `<option value="${c}">${c}</option>`).join('');
  }
}

// ==================== DATA CLEANUP ====================
function cleanOldData() {
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - DAYS_TO_KEEP);
  const cutoffStr = `${cutoff.getFullYear()}-${String(cutoff.getMonth()+1).padStart(2,'0')}-${String(cutoff.getDate()).padStart(2,'0')}`;
  
  let removed = 0;
  Object.keys(state.records).forEach(date => {
    if (date < cutoffStr) {
      delete state.records[date];
      removed++;
    }
  });
  if (removed > 0) saveState();
}

function clearAllData() {
  if (!confirm('确定要清除所有数据吗？\n此操作不可恢复！')) return;
  if (!confirm('再次确认：删除所有家庭成员、饮食记录和自定义食物？')) return;
  state = defaultState();
  saveState();
  renderAll();
  showToast('所有数据已清除');
}

// ==================== TAB SWITCH ====================
document.querySelectorAll('.tab-bar button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + btn.dataset.tab).classList.add('active');
  });
});

// ==================== TOAST ====================
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

// ==================== KEYBOARD ====================
document.getElementById('newMemberInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') addMember();
});
document.getElementById('newFoodInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') addCustomFood();
});
document.getElementById('modalCustomFood').addEventListener('keydown', e => {
  if (e.key === 'Enter') addCustomFoodFromModal();
});

// Close modal on overlay click
document.getElementById('foodModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeFoodModal();
});
document.getElementById('avatarModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeAvatarModal();
});

// ==================== INIT ====================
renderAll();
</script>
</body>
</html>
