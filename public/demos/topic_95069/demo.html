<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>羽智教练 · 交互Demo</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,"PingFang SC","SF Pro Text",sans-serif;background:#0a0e1a;color:#e8ecf4;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow-y:auto;}
.page-header{text-align:center;padding:40px 20px 24px;}
.page-header h1{font-size:2rem;font-weight:800;letter-spacing:-0.02em;background:linear-gradient(135deg,#00e676,#69f0ae);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.page-header p{color:#6b7591;font-size:0.9rem;margin-top:8px;}

/* iPhone Frame */
.ios-frame{width:411px;height:844px;background:#000;border-radius:60px;position:relative;box-shadow:0 0 0 2px #222,0 40px 100px rgba(0,0,0,0.7);margin:0 auto 60px;flex-shrink:0;}
.ios-screen{width:375px;height:760px;background:#0d1120;border-radius:48px;position:absolute;top:40px;left:18px;overflow:hidden;display:flex;flex-direction:column;}
.dynamic-island{width:124px;height:36px;background:#000;border-radius:20px;position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:100;}
.status-bar{height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px;font-size:12px;font-weight:700;flex-shrink:0;position:relative;z-index:50;}
.status-bar .time{width:52px;}
.status-bar .icons{display:flex;gap:5px;align-items:center;}
.status-bar .icons svg{width:14px;height:14px;}
.home-indicator{width:140px;height:5px;background:rgba(255,255,255,0.25);border-radius:3px;position:absolute;bottom:8px;left:50%;transform:translateX(-50%);z-index:100;}

/* Screen content */
.screen-content{flex:1;overflow:hidden;display:flex;flex-direction:column;position:relative;}
.app-scroll{flex:1;overflow-y:auto;padding:0 16px 16px;-webkit-overflow-scrolling:touch;}
.app-scroll::-webkit-scrollbar{display:none;}

/* Tab Bar */
.tab-bar{height:80px;background:rgba(13,17,32,0.96);backdrop-filter:blur(20px);border-top:1px solid #1e2640;display:flex;padding:6px 0 22px;flex-shrink:0;}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:#4a5470;transition:color 0.25s;background:none;border:none;font-family:inherit;-webkit-tap-highlight-color:transparent;}
.tab-item.active{color:#00e676;}
.tab-item svg{width:22px;height:22px;}
.tab-item span{font-size:10px;font-weight:600;}

/* Toast */
.toast{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(30,38,64,0.95);color:#e8ecf4;padding:10px 24px;border-radius:20px;font-size:13px;font-weight:600;border:1px solid #1e2640;z-index:200;animation:toastIn 0.3s ease,toastOut 0.3s ease 1.7s forwards;pointer-events:none;white-space:nowrap;}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
@keyframes toastOut{from{opacity:1;}to{opacity:0;}}

/* Cards */
.card{background:#161c30;border-radius:14px;padding:14px;margin-bottom:10px;border:1px solid #1e2640;}

/* Section title */
.stitle{font-size:12px;font-weight:700;color:#8892a8;text-transform:uppercase;letter-spacing:0.05em;margin:18px 0 10px;}

/* Modal sheet */
.modal-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.6);z-index:150;display:flex;align-items:flex-end;}
.modal-sheet{width:100%;background:#161c30;border-radius:20px 20px 0 0;padding:20px 16px 30px;max-height:85%;overflow-y:auto;animation:sheetUp 0.3s ease;}
@keyframes sheetUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.modal-handle{width:36px;height:4px;background:#2a3450;border-radius:2px;margin:0 auto 16px;}
.modal-title{font-size:18px;font-weight:800;margin-bottom:16px;}

/* Chips */
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.chip{padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;background:#1e2640;color:#8892a8;border:1px solid #2a3450;cursor:pointer;transition:all 0.2s;}
.chip:hover{border-color:#4a5470;}
.chip.sel{background:linear-gradient(135deg,#00e676,#00b0ff);color:#0a0e1a;border-color:transparent;}

/* Buttons */
.btn-primary{width:100%;padding:14px;border-radius:14px;border:none;font-size:15px;font-weight:700;background:linear-gradient(135deg,#00e676,#00b0ff);color:#0a0e1a;cursor:pointer;transition:opacity 0.2s;}
.btn-primary:hover{opacity:0.9;}
.btn-primary:disabled{opacity:0.4;cursor:not-allowed;}
.btn-secondary{width:100%;padding:12px;border-radius:14px;border:1px solid #1e2640;font-size:14px;font-weight:600;background:#1e2640;color:#e8ecf4;cursor:pointer;transition:all 0.2s;}
.btn-secondary:hover{border-color:#2a3450;}

/* Progress ring */
.ring{border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;}
.ring .inner{position:absolute;inset:4px;border-radius:50%;background:#0d1120;display:flex;align-items:center;justify-content:center;flex-direction:column;}
.ring .inner .score{font-size:22px;font-weight:800;}
.ring .inner .unit{font-size:10px;color:#6b7591;}

/* Tags */
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700;}
.tag-entry{background:#00e67618;color:#00e676;}
.tag-basic{background:#00b0ff18;color:#00b0ff;}
.tag-inter{background:#ff6d0018;color:#ff6d00;}
.tag-adv{background:#ff408118;color:#ff4081;}

/* Animations */
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@keyframes scanLine{0%{top:0;opacity:1;}100%{top:100%;opacity:0.3;}}
@keyframes pulse{0%,100%{opacity:0.4;}50%{opacity:1;}}
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.animate-in{animation:fadeSlideUp 0.35s ease both;}

/* Goal card gradient border */
.goal-border{position:relative;border-radius:14px;padding:1px;margin-bottom:12px;}
.goal-border-bg{background:linear-gradient(135deg,#00e676,#00b0ff);border-radius:14px;}
.goal-border-inner{background:#0d1120;border-radius:13px;padding:16px;}

/* Level route */
.level-route{display:flex;align-items:center;gap:0;overflow-x:auto;padding:10px 0 6px;-webkit-overflow-scrolling:touch;}
.level-route::-webkit-scrollbar{display:none;}
.lv-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;border:2px solid #2a3450;color:#4a5470;background:#1e2640;}
.lv-dot.current{border-color:#00e676;color:#00e676;background:#00e67618;box-shadow:0 0 12px #00e67644;}
.lv-dot.done{border-color:#00e676;color:#0d1120;background:#00e676;}
.lv-line{width:16px;height:2px;background:#2a3450;flex-shrink:0;}
.lv-line.done{background:#00e676;}

/* Task */
.task-item{display:flex;align-items:center;gap:10px;padding:12px;background:#161c30;border-radius:12px;margin-bottom:7px;border:1px solid #1e2640;cursor:pointer;transition:all 0.2s;}
.task-item:hover{border-color:#2a3450;}
.task-item.active{border-color:#00e676;background:#00e67612;}
.task-item.done{opacity:0.45;}
.task-check{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;}
.task-check.pending{background:#1e2640;border:1px dashed #2a3450;color:#4a5470;}
.task-check.active{background:#00e676;color:#0a0e1a;}
.task-check.done{background:#1e2640;color:#00e676;}
.task-info{flex:1;}
.task-info .name{font-size:13px;font-weight:700;}
.task-info .desc{font-size:10px;color:#6b7591;margin-top:2px;}

/* Course card */
.course-card{display:flex;gap:12px;padding:14px;background:#161c30;border-radius:14px;margin-bottom:10px;border:1px solid #1e2640;cursor:pointer;transition:all 0.2s;}
.course-card:hover{border-color:#2a3450;}
.course-thumb{width:72px;height:52px;border-radius:10px;background:linear-gradient(135deg,#1e2640,#2a3450);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px;}
.course-info{flex:1;display:flex;flex-direction:column;justify-content:center;}
.course-info .name{font-size:14px;font-weight:700;margin-bottom:4px;}
.course-meta{display:flex;gap:10px;align-items:center;font-size:11px;color:#6b7591;}
.course-diff{display:flex;gap:2px;}
.course-diff span{width:6px;height:6px;border-radius:50%;background:#2a3450;}
.course-diff span.filled{background:#00e676;}

/* Video player area */
.video-area{width:100%;height:180px;border-radius:14px;background:linear-gradient(135deg,#1a2038,#252d48);display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:14px;cursor:pointer;}
.play-btn-big{width:56px;height:56px;border-radius:50%;background:rgba(0,230,118,0.15);border:2px solid #00e676;display:flex;align-items:center;justify-content:center;}
.play-btn-big svg{color:#00e676;width:24px;height:24px;margin-left:2px;}
.slow-mo-badge{position:absolute;top:10px;right:10px;padding:3px 10px;border-radius:6px;background:rgba(0,176,255,0.2);color:#00b0ff;font-size:10px;font-weight:700;}
.video-progress{position:absolute;bottom:0;left:0;height:3px;width:65%;background:linear-gradient(90deg,#00e676,#00b0ff);border-radius:0 2px 0 0;}

/* Keypoint card */
.kp-card{display:flex;gap:10px;padding:12px;background:#161c30;border-radius:12px;margin-bottom:8px;border:1px solid #1e2640;}
.kp-num{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#00e676,#00b0ff);color:#0a0e1a;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;}
.kp-info .kp-title{font-size:13px;font-weight:700;}
.kp-info .kp-text{font-size:11px;color:#8892a8;margin-top:3px;line-height:1.4;}

/* Upload area */
.upload-area{border:2px dashed #2a3450;border-radius:14px;padding:32px 16px;text-align:center;cursor:pointer;transition:all 0.2s;margin-bottom:16px;}
.upload-area:hover{border-color:#00e676;background:#00e67608;}
.upload-area svg{width:36px;height:36px;color:#4a5470;margin-bottom:8px;}
.upload-area .text{font-size:14px;font-weight:700;color:#8892a8;}
.upload-area .hint{font-size:11px;color:#4a5470;margin-top:4px;}

/* File type tabs */
.ft-tabs{display:flex;gap:8px;margin-bottom:16px;}
.ft-tab{flex:1;padding:10px;border-radius:12px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;border:1px solid #1e2640;background:#1e2640;color:#6b7591;transition:all 0.2s;}
.ft-tab.active{background:#00e67615;border-color:#00e676;color:#00e676;}

/* Analysis skeleton */
.skeleton-area{width:100%;height:200px;border-radius:14px;background:linear-gradient(135deg,#1a2038,#252d48);position:relative;overflow:hidden;margin-bottom:16px;}
.scan-line{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#00e676,transparent);animation:scanLine 2s linear infinite;z-index:5;}
.skeleton-svg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
.skeleton-svg svg{width:120px;height:180px;opacity:0.3;}
.skeleton-svg svg .bone{stroke:#00e676;stroke-width:2;fill:none;}
.analyze-step{font-size:14px;font-weight:700;text-align:center;margin:12px 0;animation:pulse 1.5s ease infinite;}
.analyze-progress-bar{width:100%;height:6px;background:#1e2640;border-radius:3px;overflow:hidden;margin:8px 0;}
.analyze-progress-fill{height:100%;background:linear-gradient(90deg,#00e676,#00b0ff);border-radius:3px;transition:width 0.3s;}

/* Feedback items */
.fb-item{display:flex;align-items:flex-start;gap:10px;padding:12px;border-radius:12px;margin-bottom:8px;}
.fb-item.pass{background:#00e67610;border:1px solid #00e67630;}
.fb-item.warn{background:#ff6d0010;border:1px solid #ff6d0030;}
.fb-icon{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;font-weight:800;margin-top:1px;}
.fb-item.pass .fb-icon{background:#00e676;color:#0a0e1a;}
.fb-item.warn .fb-icon{background:#ff6d00;color:#fff;}
.fb-text .fb-title{font-size:13px;font-weight:700;}
.fb-text .fb-desc{font-size:11px;color:#8892a8;margin-top:3px;line-height:1.4;}

/* Level list */
.level-card{display:flex;gap:12px;padding:14px;background:#161c30;border-radius:14px;margin-bottom:8px;border:1px solid #1e2640;transition:all 0.2s;}
.level-card.current{border-color:#00e676;background:#00e67610;}
.level-card.done{border-color:#00e67640;}
.lv-num{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;flex-shrink:0;}
.lv-num.entry{background:#00e67618;color:#00e676;}
.lv-num.basic{background:#00b0ff18;color:#00b0ff;}
.lv-num.inter{background:#ff6d0018;color:#ff6d00;}
.lv-num.adv{background:#ff408118;color:#ff4081;}
.lv-detail{flex:1;}
.lv-detail .lv-name{font-size:15px;font-weight:700;}
.lv-detail .lv-desc{font-size:11px;color:#6b7591;margin-top:3px;line-height:1.4;}
.lv-detail .lv-focus{font-size:10px;color:#8892a8;margin-top:5px;}

/* Assess item */
.assess-item{display:flex;align-items:center;gap:10px;padding:12px;background:#161c30;border-radius:12px;margin-bottom:8px;border:1px solid #1e2640;}
.assess-item .ai-info{flex:1;}
.assess-item .ai-name{font-size:13px;font-weight:700;}
.assess-item .ai-desc{font-size:10px;color:#6b7591;margin-top:2px;}
.assess-btn{padding:6px 14px;border-radius:8px;font-size:11px;font-weight:700;border:none;cursor:pointer;transition:all 0.2s;}
.assess-btn.upload{background:#00e676;color:#0a0e1a;}
.assess-btn.analyzing{background:#1e2640;color:#00b0ff;border:1px solid #00b0ff;animation:pulse 1s infinite;}
.assess-btn.completed{background:#1e2640;color:#00e676;border:1px solid #00e67640;}

/* Profile avatar */
.profile-avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#00e676,#00b0ff);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#0a0e1a;}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:16px 0;}
.stat-item{background:#161c30;border-radius:12px;padding:14px;text-align:center;border:1px solid #1e2640;}
.stat-item .sv{font-size:22px;font-weight:800;}
.stat-item .sl{font-size:11px;color:#6b7591;margin-top:2px;}

/* Menu list */
.menu-item{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;transition:background 0.2s;}
.menu-item:hover{background:#ffffff06;}
.menu-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.menu-info{flex:1;}
.menu-info .mi-name{font-size:14px;font-weight:600;}
.menu-arrow{color:#4a5470;font-size:14px;}

/* Spinner */
.spinner{width:48px;height:48px;border:3px solid #1e2640;border-top-color:#00e676;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto;}

/* Assess result */
.result-score{font-size:56px;font-weight:800;background:linear-gradient(135deg,#00e676,#00b0ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.result-level{font-size:20px;font-weight:800;margin-top:8px;}
.result-sub{font-size:13px;color:#8892a8;margin-top:4px;}
.score-detail{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #1e264030;}
.score-detail .sd-name{font-size:13px;color:#8892a8;}
.score-detail .sd-score{font-size:14px;font-weight:700;}

/* Tip card */
.tip-card{display:flex;gap:10px;padding:14px;background:#00b0ff10;border:1px solid #00b0ff25;border-radius:14px;margin-bottom:16px;}
.tip-card svg{width:20px;height:20px;color:#00b0ff;flex-shrink:0;margin-top:2px;}
.tip-card .tip-text{font-size:12px;color:#8892a8;line-height:1.5;}

/* AI suggestion card */
.ai-suggest{background:linear-gradient(135deg,#00e67610,#00b0ff10);border:1px solid #00e67625;border-radius:14px;padding:16px;margin:12px 0;}
.ai-suggest .as-title{font-size:13px;font-weight:700;color:#00e676;margin-bottom:8px;}
.ai-suggest .as-text{font-size:12px;color:#8892a8;line-height:1.6;}

/* Recommend course mini */
.rec-course{display:flex;gap:10px;padding:12px;background:#161c30;border-radius:12px;margin-top:10px;border:1px solid #1e2640;cursor:pointer;}
.rec-course:hover{border-color:#2a3450;}
.rec-thumb{width:52px;height:38px;border-radius:8px;background:linear-gradient(135deg,#1e2640,#2a3450);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.rec-info{flex:1;display:flex;flex-direction:column;justify-content:center;}
.rec-info .rname{font-size:12px;font-weight:700;}
.rec-info .rmeta{font-size:10px;color:#6b7591;margin-top:2px;}

/* Back button */
.back-btn{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:600;color:#8892a8;cursor:pointer;margin-bottom:12px;background:none;border:none;font-family:inherit;padding:0;}
.back-btn:hover{color:#e8ecf4;}
.back-btn svg{width:18px;height:18px;}

/* File preview */
.file-preview{display:flex;align-items:center;gap:12px;padding:14px;background:#161c30;border-radius:12px;margin-bottom:16px;border:1px solid #1e2640;}
.file-preview .fp-icon{width:40px;height:40px;border-radius:10px;background:#00b0ff15;display:flex;align-items:center;justify-content:center;}
.file-preview .fp-icon svg{width:20px;height:20px;color:#00b0ff;}
.file-preview .fp-info{flex:1;}
.file-preview .fp-name{font-size:13px;font-weight:600;word-break:break-all;}
.file-preview .fp-size{font-size:11px;color:#6b7591;margin-top:2px;}
</style>
</head>

<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ============ MOCK DATA ============ */
const LEVELS = [

/* ============ TOAST COMPONENT ============ */
function Toast({ message }) {
  if (!message) return null;
  return <div className="toast">{message}</div>;
}

/* ============ TAG COMPONENT ============ */
function LvTag({ tag }) {
  const labels = { entry:'入门', basic:'基础', inter:'进阶', adv:'高级' };
  return <span className={`tag tag-${tag}`}>{labels[tag]}</span>;
}

/* ============ PROGRESS RING ============ */
function ProgressRing({ pct, size = 56, score, strokeWidth = 5, color = '#00e676' }) {
  const r = (size - strokeWidth) / 2;
  const c = 2 * Math.PI * r;
  const offset = c - (pct / 100) * c;
  return (
    <div className="ring" style={{ width: size, height: size, background: `conic-gradient(${color} ${pct*3.6}deg, #1e2640 0deg)` }}>
      <div className="inner" style={{ inset: strokeWidth }}>
        {score != null ? <>
          <span className="score" style={{color}}>{score}</span>
          <span className="unit">分</span>
        </> : <span className="score" style={{color,fontSize:14}}>{pct}%</span>}
      </div>
    </div>
  );
}

/* ============ PLAN PAGE ============ */
function PlanPage({ user, goal, setGoal, tasks, setTasks }) {
  const [showModal, setShowModal] = useState(false);
  const [goalType, setGoalType] = useState(null);
  const [targetLevel, setTargetLevel] = useState(null);
  const [targetSkill, setTargetSkill] = useState(null);
  const [goalDays, setGoalDays] = useState(null);

  const lv = LEVELS.find(l => l.num === user.level) || LEVELS[0];

  const toggleTask = (id) => {
    setTasks(tasks.map(t => {
      if (t.id !== id) return t;
      if (t.status === 'pending') return {...t, status:'active'};
      if (t.status === 'active') return {...t, status:'done'};
      return {...t, status:'pending'};
    }));
  };

  const handleCreateGoal = () => {
    if (!goalType) return;
    const g = {
      type: goalType,
      targetLevel: goalType === 'level' ? targetLevel : null,
      targetSkill: goalType === 'skill' ? targetSkill : null,
      days: goalDays || 30,
      progress: 35,
      remainDays: goalDays ? Math.round(goalDays * 0.65) : 20,
    };
    setGoal(g);
    setShowModal(false);
    setGoalType(null); setTargetLevel(null); setTargetSkill(null); setGoalDays(null);
  };

  const goalText = goal ? (goal.type==='level'
    ? `晋升至${goal.targetLevel}级「${LEVELS.find(l=>l.num===goal.targetLevel)?.name}」`
    : `掌握「${goal.targetSkill}」技术`) : '';

  return (
    <div className="app-scroll" style={{paddingTop:8}}>
      {/* Greeting */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
        <div>
          <div style={{fontSize:18,fontWeight:800}}>你好，{user.nickName}</div>
          <div style={{fontSize:11,color:'#6b7591',marginTop:2}}>今天也要加油训练</div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <LvTag tag={lv.tag} />
          <div style={{width:36,height:36,borderRadius:'50%',background:'linear-gradient(135deg,#00e676,#00b0ff)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,fontWeight:800,color:'#0a0e1a'}}>{user.nickName[0]}</div>
        </div>
      </div>

      {/* Goal Card or Empty */}
      {!goal ? (
        <div className="goal-empty" onClick={()=>setShowModal(true)}>
          <div className="icon">{Icons.target}</div>
          <div className="title">创建训练目标</div>
          <div className="desc">设定你的阶段性训练目标，追踪进步</div>
        </div>
      ) : (
        <div className="goal-border">
          <div className="goal-border-bg">
            <div className="goal-border-inner">
              <div style={{fontSize:10,color:'#00e676',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.08em'}}>当前目标</div>
              <div style={{fontSize:17,fontWeight:800,marginTop:5}}>{goalText}</div>
              <div className="progress-row">
                <ProgressRing pct={goal.progress} size={52} />
                <div style={{flex:1}}>
                  <div style={{fontSize:14,fontWeight:700}}>已完成 {goal.progress}%</div>
                  <div style={{fontSize:10,color:'#6b7591',marginTop:2}}>剩余 {goal.remainDays} 天</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* Daily Tasks */}
      <div className="stitle">每日任务</div>
      {tasks.map(t => (
        <div key={t.id} className={`task-item ${t.status}`} onClick={()=>toggleTask(t.id)}>
          <div className={`task-check ${t.status}`}>
            {t.status==='done' ? Icons.check : t.status==='active' ? <span style={{width:8,height:8,borderRadius:'50%',background:'#0a0e1a'}}></span> : null}
          </div>
          <div className="task-info">
            <div className="name">{t.name}</div>
            <div className="desc">{t.desc}</div>
          </div>
        </div>
      ))}

      {/* Level Route */}
      <div className="stitle">等级路线</div>
      <div className="level-route">
        {LEVELS.map((l,i) => (
          <React.Fragment key={l.num}>
            <div className={`lv-dot ${l.num < user.level ? 'done' : ''} ${l.num === user.level ? 'current' : ''}`}>{l.num}</div>
            {i < LEVELS.length - 1 && <div className={`lv-line ${l.num < user.level ? 'done' : ''}`}></div>}
          </React.Fragment>
        ))}
      </div>

      {/* Modal */}
      {showModal && (
        <div className="modal-overlay" onClick={()=>setShowModal(false)}>
          <div className="modal-sheet" onClick={e=>e.stopPropagation()}>
            <div className="modal-handle"></div>
            <div className="modal-title">创建训练目标</div>

            <div style={{fontSize:13,fontWeight:700,color:'#8892a8',marginBottom:8}}>目标类型</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:16}}>
              <div className={`chip ${goalType==='level'?'sel':''}`} onClick={()=>{setGoalType('level');setTargetSkill(null);}}>晋升等级</div>
              <div className={`chip ${goalType==='skill'?'sel':''}`} onClick={()=>{setGoalType('skill');setTargetLevel(null);}}>掌握技能</div>
            </div>

            {goalType === 'level' && (
              <>
                <div style={{fontSize:13,fontWeight:700,color:'#8892a8',marginBottom:8}}>目标等级</div>
                <div className="chip-row">
                  {[4,5,6,7].map(lv => (
                    <div key={lv} className={`chip ${targetLevel===lv?'sel':''}`} onClick={()=>setTargetLevel(lv)}>{lv}级</div>
                  ))}
                </div>
              </>
            )}

            {goalType === 'skill' && (
              <>
                <div style={{fontSize:13,fontWeight:700,color:'#8892a8',marginBottom:8}}>目标技能</div>
                <div className="chip-row">
                  {['正手高远球','正手杀球','反手后场','网前搓球','全场步法','劈吊滑板','平抽挡','双打轮转'].map(s => (
                    <div key={s} className={`chip ${targetSkill===s?'sel':''}`} onClick={()=>setTargetSkill(s)} style={{fontSize:12,padding:'6px 12px'}}>{s}</div>
                  ))}
                </div>
              </>
            )}

            <div style={{fontSize:13,fontWeight:700,color:'#8892a8',marginBottom:8}}>训练周期</div>
            <div className="chip-row">
              {[7,14,21,30,60,90].map(d => (
                <div key={d} className={`chip ${goalDays===d?'sel':''}`} onClick={()=>setGoalDays(d)}>{d}天</div>
              ))}
            </div>

            <button className="btn-primary" disabled={!goalType || (goalType==='level'&&!targetLevel) || (goalType==='skill'&&!targetSkill)} onClick={handleCreateGoal}>
              保存目标
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============ AI COACH PAGE ============ */
function CoachPage() {
  const [stage, setStage] = useState('idle');
  const [fileType, setFileType] = useState('video');
  const [analysisType, setAnalysisType] = useState(0);
  const [progress, setProgress] = useState(0);
  const [stepText, setStepText] = useState('检测骨骼关键点...');
  const [selectedFile, setSelectedFile] = useState(null);
  const fileRef = useRef(null);
  const timerRef = useRef(null);
  const progressRef = useRef(null);

  useEffect(()=>{
    return ()=>{clearInterval(timerRef.current);clearInterval(progressRef.current);};
  },[]);

  const handleFileSelect = (e) => {
    const f = e.target.files && e.target.files[0];
    if (f) {
      setSelectedFile({ name: f.name, size: (f.size / 1024 / 1024).toFixed(2) + ' MB' });
    }
    setStage('selected');
  };

  const handleUploadClick = () => {
    fileRef.current && fileRef.current.click();
  };

  const startAnalysis = () => {
    setStage('analyzing');
    setProgress(0);
    setStepText('检测骨骼关键点...');

    const steps = ['检测骨骼关键点...','分析动作轨迹...','对比标准模型...','生成改进建议...'];
    let si = 0;

    progressRef.current = setInterval(()=>{
      setProgress(p => {
        const np = p + Math.random() * 8 + 2;
        if (np >= 100) { clearInterval(progressRef.current); return 100; }
        return Math.min(np, 99);
      });
    }, 200);

    timerRef.current = setInterval(()=>{
      si++;
      if (si < steps.length) {
        setStepText(steps[si]);
      }
      if (si >= steps.length) {
        clearInterval(timerRef.current);
        clearInterval(progressRef.current);
        setProgress(100);
        setTimeout(()=>setStage('results'), 500);
      }
    }, 900);
  };

  const resetAnalysis = () => {
    setStage('idle');
    setProgress(0);
    setSelectedFile(null);
    setAnalysisType(0);
  };

  const feedbackPass = [
    { title:'握拍姿势正确', desc:'正手握拍角度标准，虎口位置准确' },
    { title:'击球点高度', desc:'击球点位于右肩上方，位置合理' },
    { title:'随挥动作完整', desc:'击球后随挥到左下方，动作流畅' },
  ];
  const feedbackWarn = [
    { title:'引拍不充分', desc:'侧身引拍幅度偏小，影响发力效果' },
    { title:'步法调整', desc:'击球后回动速度偏慢，建议加强步伐训练' },
  ];

  if (stage === 'idle') return (
    <div className="app-scroll" style={{paddingTop:8}}>
      <div style={{fontSize:20,fontWeight:800,marginBottom:2}}>AI 录像教练</div>
      <div style={{fontSize:12,color:'#6b7591',marginBottom:16}}>上传训练视频，AI帮你分析动作</div>

      <input type="file" ref={fileRef} accept="video/*,image/*" hidden onChange={handleFileSelect} />
      <div className="upload-area" onClick={handleUploadClick}>
        {Icons.upload}
        <div className="text">点击上传视频或照片</div>
        <div className="hint">支持 MP4、MOV、JPG 格式</div>
      </div>

      <div className="ft-tabs">
        <div className={`ft-tab ${fileType==='video'?'active':''}`} onClick={()=>setFileType('video')}>录制视频</div>
        <div className={`ft-tab ${fileType==='photo'?'active':''}`} onClick={()=>setFileType('photo')}>上传照片</div>
      </div>

      <div className="tip-card">
        {Icons.camera}
        <div className="tip-text">
          <strong style={{color:'#00b0ff'}}>拍摄建议</strong><br/>
          正面或侧面45度拍摄，确保全身可见。光线充足，背景简洁。每个动作重复3-5次效果最佳。
        </div>
      </div>
    </div>
  );

  if (stage === 'selected') return (
    <div className="app-scroll" style={{paddingTop:8}}>
      <button className="back-btn" onClick={()=>setStage('idle')}>
        {Icons.back} <span>重新选择</span>
      </button>
      <div style={{fontSize:18,fontWeight:800,marginBottom:14}}>确认上传文件</div>

      <div className="file-preview">
        <div className="fp-icon">{Icons.file}</div>
        <div className="fp-info">
          <div className="fp-name">{selectedFile ? selectedFile.name : '训练视频_mock.mp4'}</div>
          <div className="fp-size">{selectedFile ? selectedFile.size : '12.5 MB'}</div>

      </div>

      <div style={{fontSize:13,fontWeight:700,color:'#8892a8',marginBottom:8}}>选择分析类型</div>
      <div className="chip-row">
        {ANALYSIS_TYPES.map((t,i) => (
          <div key={i} className={`chip ${analysisType===i?'sel':''}`} style={{fontSize:12,padding:'8px 14px'}} onClick={()=>setAnalysisType(i)}>{t}</div>
        ))}
      </div>

      <button className="btn-primary" onClick={startAnalysis} style={{marginTop:8}}>
        开始 AI 分析
      </button>
    </div>
  );

  if (stage === 'analyzing') return (
    <div className="app-scroll" style={{paddingTop:8,display:'flex',flexDirection:'column',alignItems:'center'}}>
      <div style={{fontSize:18,fontWeight:800,marginBottom:16}}>AI 正在分析</div>
      <div className="skeleton-area">
        <div className="scan-line"></div>
        <div className="skeleton-svg">
          <svg viewBox="0 0 60 100">
            <circle className="bone" cx="30" cy="12" r="8"/>
            <line className="bone" x1="30" y1="20" x2="30" y2="50"/>
            <line className="bone" x1="30" y1="28" x2="15" y2="45"/>

      <div className="analyze-step">{stepText}</div>

        <div className="analyze-progress-fill" style={{width:`${progress}%`}}></div>

  );

  return (
    <div className="app-scroll" style={{paddingTop:8}}>
      <div style={{fontSize:18,fontWeight:800,marginBottom:4}}>分析报告</div>
      <div style={{fontSize:12,color:'#6b7591',marginBottom:16}}>{ANALYSIS_TYPES[analysisType]} · 动作分析</div>

      <div style={{display:'flex',justifyContent:'center',marginBottom:16}}>
        <ProgressRing pct={76} size={100} score={76} color="#00e676" />
      </div>

      <div className="skeleton-area" style={{height:140,marginBottom:16}}>
        <svg viewBox="0 0 60 100" style={{width:'60px',height:'100px',opacity:0.5}}>
          <circle stroke="#00e676" strokeWidth="2" fill="none" cx="30" cy="12" r="8"/>
          <line stroke="#00e676" strokeWidth="2" x1="30" y1="20" x2="30" y2="50"/>
          <line stroke="#00e676" strokeWidth="2" x1="30" y1="28" x2="15" y2="45"/>
          <line stroke="#00e676" strokeWidth="2" x1="30" y1="28" x2="45" y2="45"/>
          <line stroke="#00e676" strokeWidth="2" x1="30" y1="50" x2="18" y2="75"/>
          <line stroke="#00e676" strokeWidth="2" x1="30" y1="50" x2="42" y2="75"/>
          <line stroke="#ff6d00" strokeWidth="2" x1="30" y1="50" x2="10" y2="60" strokeDasharray="3"/>

/* ============ LEVEL PAGE ============ */
function LevelPage({ user, setUser }) {
  const [view, setView] = useState('main');
  const [assessView, setAssessView] = useState('list');
  const [assessItems, setAssessItems] = useState(ASSESSMENTS.map(a=>({...a, status:'pending', file:null})));
  const [assessScore, setAssessScore] = useState(null);
  const fileRef = useRef(null);
  const [activeIdx, setActiveIdx] = useState(null);

  const lv = LEVELS.find(l => l.num === user.level) || LEVELS[0];
  const nextLv = LEVELS.find(l => l.num === user.level + 1);
  const completedCount = assessItems.filter(a => a.status === 'completed').length;

  const handleAssessUpload = (idx) => {
    setActiveIdx(idx);
    if (fileRef.current) fileRef.current.click();
  };

  const handleAssessFileSelect = (e) => {
    const f = e.target.files && e.target.files[0];
    if (activeIdx === null) return;
    setAssessItems(prev => prev.map((item,i) => {
      if (i !== activeIdx) return item;
      return { ...item, status: 'analyzing', file: f ? f.name : 'mock_video.mp4' };
    }));
    setTimeout(() => {
      setAssessItems(prev => prev.map((item,i) => {
        if (i !== activeIdx) return item;
        return { ...item, status: 'completed' };
      }));
    }, 1500);
  };

  const handleSubmitAssess = () => {
    setAssessView('assessing');
    setTimeout(() => {
      const scores = ASSESSMENTS.map(() => Math.floor(Math.random() * 20) + 70);
      const avg = Math.round(scores.reduce((a,b)=>a+b,0) / scores.length);
      setAssessScore({ scores, avg });
      setAssessView('result');
    }, 2000);
  };

  const handleFinishAssess = () => {
    setUser({...user, isAssessed: true, level: assessScore ? assessScore.avg >= 75 ? Math.min(user.level + 1, 9) : user.level : user.level});
    setView('main');
    setAssessView('list');
    setAssessItems(ASSESSMENTS.map(a=>({...a, status:'pending', file:null})));
    setAssessScore(null);
  };

  const resetAssess = () => {
    setAssessItems(ASSESSMENTS.map(a=>({...a, status:'pending', file:null})));
    setAssessView('list');
    setAssessScore(null);
  };

  if (view === 'assess') {
    if (assessView === 'list') return (
      <div className="app-scroll" style={{paddingTop:8}}>
        <input type="file" ref={fileRef} accept="video/*,image/*" hidden onChange={handleAssessFileSelect} />
        <button className="back-btn" onClick={resetAssess}>
          {Icons.back} <span>返回等级页</span>
        </button>
        <div style={{fontSize:18,fontWeight:800,marginBottom:16}}>等级评定</div>

        <div style={{display:'flex',justifyContent:'center',marginBottom:20}}>
          <ProgressRing pct={Math.round(completedCount/assessItems.length*100)} size={80} />
        </div>
        <div style={{textAlign:'center',fontSize:12,color:'#6b7591',marginBottom:16}}>{completedCount}/{assessItems.length} 项已完成</div>

        {assessItems.map((a,i) => (
          <div key={i} className="assess-item">
            <div className="ai-info">
              <div className="ai-name">{a.name}</div>
              <div className="ai-desc">{a.desc}</div>
            </div>
            {a.status === 'pending' && <button className="assess-btn upload" onClick={()=>handleAssessUpload(i)}>上传</button>}
            {a.status === 'analyzing' && <button className="assess-btn analyzing">分析中</button>}
            {a.status === 'completed' && <button className="assess-btn completed">已完成 ✓</button>}
          </div>
        ))}

        {completedCount === assessItems.length && (
          <button className="btn-primary" onClick={handleSubmitAssess} style={{marginTop:16}}>提交评定</button>
        )}
      </div>
    );

    if (assessView === 'assessing') return (
      <div className="app-scroll" style={{paddingTop:8,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:400}}>
        <div className="spinner" style={{width:56,height:56,marginBottom:20}}></div>
        <div style={{fontSize:16,fontWeight:700}}>正在生成评定结果</div>
        <div style={{fontSize:12,color:'#6b7591',marginTop:8}}>AI 正在综合分析你的各项考核表现...</div>
      </div>
    );

    return (
      <div className="app-scroll" style={{paddingTop:8}}>
        <div style={{fontSize:18,fontWeight:800,marginBottom:4,marginTop:40}}>评定结果</div>
        <div style={{display:'flex',justifyContent:'center',marginTop:16,marginBottom:8}}>
          <div className="result-score">{assessScore?.avg}</div>
        </div>
        <div className="result-level" style={{textAlign:'center'}}>
          {user.isAssessed ? `恭喜晋级至 ${Math.min(user.level+1,9)} 级` : `你的初始等级为 ${user.level} 级`}
        </div>
        <div className="result-sub" style={{textAlign:'center',marginBottom:24}}>
          「{LEVELS.find(l=>l.num===user.isAssessed?Math.min(user.level+1,9):user.level)?.name}」
        </div>

        <div className="card" style={{padding:0,overflow:'hidden'}}>
          <div style={{padding:'12px 14px',fontSize:13,fontWeight:700,color:'#8892a8',background:'#1e264020'}}>考核明细</div>
          {assessItems.map((a,i) => (
            <div key={i} className="score-detail" style={{padding:'10px 14px'}}>
              <span className="sd-name">{a.name}</span>
              <span className="sd-score" style={{color:assessScore?.scores?.[i] >= 75 ? '#00e676' : '#ff6d00'}}>{assessScore?.scores?.[i]}分</span>
            </div>
          ))}
        </div>

        <button className="btn-primary" onClick={handleFinishAssess} style={{marginTop:20}}>返回等级页</button>
      </div>
    );
  }

  return (
    <div className="app-scroll" style={{paddingTop:8}}>
      <div style={{fontSize:20,fontWeight:800,marginBottom:4}}>等级体系</div>
      <div style={{fontSize:12,color:'#6b7591',marginBottom:14}}>中羽在线9级等级标准</div>

      {!user.isAssessed ? (
        <div className="goal-empty" onClick={()=>setView('assess')} style={{marginBottom:16}}>
          <div className="icon">{Icons.star}</div>
          <div className="title">首次等级评定</div>
          <div className="desc">完成考核项目，获取你的初始等级</div>
          <div style={{marginTop:12,display:'inline-block',padding:'8px 24px',borderRadius:'10px',background:'linear-gradient(135deg,#00e676,#00b0ff)',color:'#0a0e1a',fontSize:13,fontWeight:700}}>开始评定</div>
        </div>
      ) : (
        <>
          <div className="card" style={{position:'relative',overflow:'hidden'}}>
            <div style={{position:'absolute',top:0,right:0,width:80,height:80,background:'linear-gradient(135deg,#00e67615,transparent)',borderRadius:'0 14px 0 80px'}}></div>
            <div style={{display:'flex',alignItems:'center',gap:14}}>
              <div style={{width:56,height:56,borderRadius:16,display:'flex',alignItems:'center',justifyContent:'center',fontSize:28,fontWeight:900}} className={`lv-num ${lv.tag}`}>{user.level}</div>
              <div style={{flex:1}}>
                <div style={{fontSize:17,fontWeight:800}}>{lv.name}</div>
                <LvTag tag={lv.tag} />
                <div style={{fontSize:11,color:'#6b7591',marginTop:5,lineHeight:1.4}}>{lv.focus}</div>
              </div>
            </div>
            {nextLv && (
              <button className="btn-secondary" style={{marginTop:12,fontSize:13}} onClick={()=>setView('assess')}>
                晋级考核 → {nextLv.num}级
              </button>
            )}
          </div>
        </>
      )}

      <div className="stitle">全部等级</div>
      {LEVELS.map(l => (
        <div key={l.num} className={`level-card ${l.num===user.level?'current':''} ${user.isAssessed && l.num<user.level?'done':''}`}>
          <div className={`lv-num ${l.tag}`}>{l.num}</div>
          <div className="lv-detail">
            <div className="lv-name">{l.name} {l.num===user.level && <span style={{color:'#00e676',fontSize:11,fontWeight:700}}>← 当前</span>}</div>
            <div className="lv-desc">{l.desc}</div>
            <div className="lv-focus">训练重点：{l.focus}</div>
          </div>
        </div>
      ))}
    </div>
  );
}

  return (
    <div className="app-scroll" style={{paddingTop:8}}>
      {/* Header */}
      <div style={{display:'flex',alignItems:'center',gap:14,marginBottom:20,paddingTop:8}}>

          <div style={{display:'flex',alignItems:'center',gap:8,marginTop:4}}>

            <span style={{fontSize:12,color:'#6b7591'}}>{user.level}级 · {lv.name}</span>

      {/* Stats */}
      <div className="stat-grid">

          <div className="sv" style={{color:'#00e676'}}>28</div>
          <div className="sl">训练天数</div>
        </div>
        <div className="stat-item">
          <div className="sv" style={{color:'#00b0ff'}}>56</div>
          <div className="sl">完成任务</div>
        </div>
        <div className="stat-item">
          <div className="sv" style={{color:'#ff6d00'}}>12</div>
          <div className="sl">AI分析次数</div>
        </div>
        <div className="stat-item">
          <div className="sv" style={{color:'#ff4081'}}>{user.level}</div>
          <div className="sl">当前等级</div>
        </div>
      </div>

      {/* Menu */}
      <div className="card" style={{padding:0,overflow:'hidden'}}>
        {menuItems.map((m,i) => (
          <div key={i} className="menu-item" onClick={m.action}>
            <div className="menu-icon" style={{background:m.bg,color:m.color}}>{m.icon}</div>
            <div className="menu-info"><div className="mi-name">{m.name}</div></div>
            <div className="menu-arrow">{Icons.arrowRight}</div>

        ))}
      </div>

      <div style={{textAlign:'center',padding:'20px 0 40px',fontSize:11,color:'#4a5470'}}>
        羽智教练 v1.0.0
      </div>
    </div>
  );
}

/* ============ iOS FRAME ============ */
function IosFrame({ children }) {
  return (
    <div className="ios-frame">
      <div className="dynamic-island"></div>
      <div className="ios-screen">
        <StatusBar />
        {children}
        <div className="home-indicator"></div>
      </div>
    </div>
  );
}

/* ============ APP ============ */
function App() {
  const [tab, setTab] = useState('plan');
  const [toast, setToast] = useState('');
  const [user, setUser] = useState({ nickName:'小李', level:3, isAssessed:false });
  const [goal, setGoal] = useState(null);
  const [tasks, setTasks] = useState([
    { id:1, name:'高远球对拉练习', desc:'底线连续对拉20次', status:'pending' },
    { id:2, name:'六点步法训练', desc:'全场六点步法3组', status:'pending' },
    { id:3, name:'网前放网练习', desc:'正手反手放网各10次', status:'pending' },
    { id:4, name:'体能训练', desc:'跳绳500次 + 深蹲30', status:'pending' },
  ]);

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(()=>setToast(''), 2000);
  };

  return (
    <div>
      <div className="page-header">
        <h1>羽智教练</h1>
        <p>交互Demo · 单屏原型</p>
      </div>
      <IosFrame>
        <div className="screen-content">
          <div style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}}>
            {tab === 'plan' && <PlanPage user={user} goal={goal} setGoal={setGoal} tasks={tasks} setTasks={setTasks} />}
            {tab === 'teach' && <TeachPage />}
            {tab === 'coach' && <CoachPage />}
            {tab === 'level' && <LevelPage user={user} setUser={setUser} />}
            {tab === 'profile' && <ProfilePage user={user} setTab={setTab} />}
          </div>
          <TabBar tab={tab} setTab={setTab} />
          <Toast message={toast} />
        </div>
      </IosFrame>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
