                            </div>

                        <!-- Summary -->
                        <p class="t-body-large mb-6" style="color: var(--color-text-secondary);">从限流、缓存、消息队列到库存扣减，完整推演一个支撑 10 万 QPS 的秒杀架构</p>

                        <!-- Tags -->
                        <div class="flex flex-wrap gap-2 mb-8">
                            <span class="px-3 py-1 rounded-full text-xs font-medium" style="background: var(--color-primary-50); color: var(--color-primary);">#高并发</span>
                            <span class="px-3 py-1 rounded-full text-xs font-medium" style="background: var(--color-primary-50); color: var(--color-primary);">#架构设计</span>
                            <span class="px-3 py-1 rounded-full text-xs font-medium" style="background: var(--color-primary-50); color: var(--color-primary);">#Redis</span>
                        </div>

                        <!-- Chat Thread -->
                        <div class="space-y-4 mb-8">
                            <!-- User Bubble 1 -->
                            <div class="flex justify-end">
                                <div class="max-w-[80%] px-4 py-3 rounded-xl rounded-tr-sm text-sm" style="background: var(--color-primary-700); color: #fff;">
                                    我要设计一个秒杀系统，预期峰值 QPS 10 万，库存 1 万件。最核心的问题是怎么保证不超卖，同时系统不崩？
                                </div>
                            </div>
                            <!-- AI Bubble 1 -->
                            <div class="flex gap-3 items-start">
                                <div class="w-8 h-8 rounded-lg flex-shrink-0 flex items-center justify-center" style="background: var(--color-primary-50);">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--color-primary);"><path d="M12 2a4 4 0 0 1 4 4v2a4 4 0 0 1-8 0V6a4 4 0 0 1 4-4Z"/><path d="M16 14H8a4 4 0 0 0-4 4v2"/><path d="M18 8h2a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-2"/><circle cx="7" cy="18" r="2"/></svg>
                                </div>
                                <div class="max-w-[80%] px-4 py-3 rounded-xl rounded-tl-sm text-sm leading-relaxed" style="background: var(--color-bg-alt); color: var(--color-text-primary);">
                                    这是典型的热点库存高并发场景。核心思路是「分层过滤 + 异步削峰 + 最终一致」：<br><br>1) 前端按钮置灰+答题验证，挡住 60% 无效请求；<br>2) 网关层令牌桶限流，把 QPS 压到 2-3 万；<br>3) 应用层请求进消息队列（RocketMQ/Kafka），立即返回「排队中」；<br>4) 异步消费者从 MQ 消费，Redis Lua 脚本原子扣减库存；<br>5) 定时把 Redis 库存同步落库。<br><br>这样真正触达库存的只有 1 万有效请求，Redis Lua 保证不会超卖。
                                </div>
                            </div>
                            <!-- User Bubble 2 -->
                            <div class="flex justify-end">
                                <div class="max-w-[80%] px-4 py-3 rounded-xl rounded-tr-sm text-sm" style="background: var(--color-primary-700); color: #fff;">
                                    Redis 扣减库存如果 Redis 挂了怎么办？库存数据丢了就麻烦了。
                                </div>
                            </div>
                            <!-- AI Bubble 2 -->
                            <div class="flex gap-3 items-start">
                                <div class="w-8 h-8 rounded-lg flex-shrink-0 flex items-center justify-center" style="background: var(--color-primary-50);">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--color-primary);"><path d="M12 2a4 4 0 0 1 4 4v2a4 4 0 0 1-8 0V6a4 4 0 0 1 4-4Z"/><path d="M16 14H8a4 4 0 0 0-4 4v2"/><path d="M18 8h2a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-2"/><circle cx="7" cy="18" r="2"/></svg>
                                </div>
                                <div class="max-w-[80%] px-4 py-3 rounded-xl rounded-tl-sm text-sm leading-relaxed" style="background: var(--color-bg-alt); color: var(--color-text-primary);">
                                    好问题。建议 Redis Cluster 主从+哨兵，但更关键是兜底策略：<br><br>开售前预热库存到 Redis，同时 DB 保存一份；Redis 扣减成功后立即发 MQ，消费者异步写 DB（最终一致）；如果 Redis 全挂，降级走 DB 乐观锁（UPDATE stock SET num=num-1 WHERE id=? AND num&gt;0），QPS 会掉到几千但不超卖；监控 Redis 健康，挂了立即报警切换降级。<br><br>核心原则：Redis 是性能层，DB 是真相层，DB 库存任何时候不能小于真实剩余。
                                </div>

                                </div>

                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--color-primary);"><path d="M12 2a4 4 0 0 1 4 4v2a4 4 0 0 1-8 0V6a4 4 0 0 1 4-4Z"/><path d="M16 14H8a4 4 0 0 0-4 4v2"/><path d="M18 8h2a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-2"/><circle cx="7" cy="18" r="2"/></svg>
                                </div>

                                    要把库存状态拆开管理：<br><br>总库存（可售）1 万件开售前预热；预扣库存（下单未付款占用，5 分钟超时释放）；已售库存（付款成功确认）。<br><br>流程是 Redis 预扣 → 创建待支付订单 → 支付回调确认库存。支付超时则订单关闭、库存回补。少卖主要发生在预扣超时回补不及时，优化点是把预扣超时设短（3-5 分钟），用延迟队列自动关单回补，少卖率可控制在 1% 以内。
                                </div>

                                    多维度拦截：<br><br>1) 账号维度限制单账号 1 件，新号/低信誉号直接拒绝；<br>2) 设备指纹去重，同设备多账号拦截；<br>3) 行为维度，请求间隔过短或整点 0ms 请求判定为机器人；<br>4) 高风险请求弹滑块验证码增加脚本成本；<br>5) 单 IP 高频限流（阈值放宽避免误伤 NAT）。<br><br>建议用风控规则引擎实时打分：低分拒绝、中分验证码、高分放行，正常用户无感。

                    '<div class="space-y-3">' + relHtml + '</div>' +
                  '</div>' +
                '</div>' +
              '</div>' +
            '</div>' +
          '</div>';

        document.getElementById('page-content').innerHTML = html;
      })();
      // Mobile menu
      (function() {
        const btn = document.getElementById('mobile-menu-btn');
        const menu = document.getElementById('mobile-menu');
        if (btn && menu) {
          btn.addEventListener('click', function(e) { e.stopPropagation(); menu.classList.toggle('is-hidden'); });
          document.addEventListener('click', function(e) { if (!btn.contains(e.target) && !menu.contains(e.target)) menu.classList.add('is-hidden'); });
        }
      })();
      // Like toggle
      (function() {
        const btn = document.getElementById('like-btn');
        const count = document.getElementById('like-count');
        let liked = false;
        let base = Number(count.textContent);
        btn.addEventListener('click', () => {
          liked = !liked;
          count.textContent = liked ? base + 1 : base;
          btn.classList.toggle('is-active', liked);
          btn.style.color = liked ? 'var(--state-error)' : 'var(--color-text-secondary)';
        });
      })();
      // Bookmark toggle
      (function() {
        const btn = document.getElementById('bookmark-btn');
        const label = document.getElementById('bookmark-label');
        let saved = false;
        btn.addEventListener('click', () => {
          saved = !saved;
          label.textContent = saved ? '已收藏' : '收藏';
          btn.classList.toggle('is-active', saved);
          btn.style.color = saved ? 'var(--color-primary)' : 'var(--color-text-secondary)';
        });
      })();
      // Follow toggle
      (function() {
        const btn = document.getElementById('follow-btn');
        let following = false;
        btn.addEventListener('click', () => {
          following = !following;
          btn.textContent = following ? '已关注' : '关注创作者';
          if (following) {
            btn.style.background = 'var(--color-primary)';
            btn.style.color = '#fff';
            btn.style.borderColor = 'var(--color-primary)';
          } else {
            btn.style.background = 'transparent';
            btn.style.color = 'var(--color-primary)';
            btn.style.borderColor = 'var(--color-primary)';
          }
        });
      })();

      /* ── 评论功能 ── */
      (function() {
        const commentBtn = document.getElementById('comment-btn');
        const commentSection = document.getElementById('comment-section');
        const commentInput = document.getElementById('comment-input');
        const commentSubmit = document.getElementById('comment-submit');
        const commentList = document.getElementById('comment-list');
        const charCount = document.getElementById('comment-char-count');
        const commentCountEl = document.getElementById('comment-count');
        const sectionCountEl = document.getElementById('comment-section-count');
        let commentCount = Number(commentCountEl.textContent);

        // 预置示例评论（来自当前案例数据）
        const seedComments = (window.__case && window.__case.comments) || [];

        function escapeHtml(str) {
          return String(str).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
        }

        function renderComment(c, isNew) {
          const item = document.createElement('div');
          item.className = 'flex items-start gap-3' + (isNew ? ' msg-enter' : '');
          item.innerHTML = `
            <div class="w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-bold shrink-0" style="background:${c.color};">${escapeHtml(c.initial)}</div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 mb-1">
                <span class="text-sm font-medium" style="color: var(--color-text-primary);">${escapeHtml(c.name)}</span>
                <span class="text-xs" style="color: var(--color-text-tertiary);">${escapeHtml(c.time)}</span>
              </div>
              <p class="text-sm leading-relaxed mb-2" style="color: var(--color-text-secondary);">${escapeHtml(c.text)}</p>
              <button class="comment-like-btn flex items-center gap-1 text-xs transition-colors" style="color: var(--color-text-tertiary);">
                <svg class="heart-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                <span class="like-num">${c.likes}</span>
              </button>
            </div>
          `;
          // 点赞切换
          const likeBtn = item.querySelector('.comment-like-btn');
          const heartIcon = item.querySelector('.heart-icon');
          let liked = false;
          const likeNum = likeBtn.querySelector('.like-num');
          likeBtn.addEventListener('click', () => {
            liked = !liked;
            likeNum.textContent = liked ? Number(likeNum.textContent) + 1 : Number(likeNum.textContent) - 1;
            likeBtn.style.color = liked ? 'var(--state-error)' : 'var(--color-text-tertiary)';
            // 红心填充切换
            heartIcon.setAttribute('fill', liked ? 'currentColor' : 'none');
            // 点赞动画
            heartIcon.style.transform = liked ? 'scale(1.25)' : 'scale(1)';
          });
          likeBtn.addEventListener('mouseenter', () => { if (!liked) likeBtn.style.color = 'var(--state-error)'; });
          likeBtn.addEventListener('mouseleave', () => { if (!liked) likeBtn.style.color = 'var(--color-text-tertiary)'; });
          commentList.appendChild(item);
        }

        seedComments.forEach(c => renderComment(c, false));

        // 字符计数
        commentInput.addEventListener('input', () => {
          const len = commentInput.value.length;
          charCount.textContent = len + '/500';
          charCount.style.color = len > 450 ? 'var(--state-error)' : 'var(--color-text-tertiary)';
        });

        // 提交评论
        function submitComment() {
          const text = commentInput.value.trim();
          if (!text) { InspiroHub.toast('请输入评论内容'); return; }
          commentCount++;
          commentCountEl.textContent = commentCount;
          sectionCountEl.textContent = '(' + commentCount + ')';
          renderComment({ name: '我', initial: '我', color: 'var(--color-primary)', time: '刚刚', text, likes: 0 }, true);
          commentInput.value = '';
          charCount.textContent = '0/500';
          InspiroHub.toast('评论发表成功');
          // 滚动到新评论
          commentList.lastElementChild && commentList.lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        commentSubmit.addEventListener('click', submitComment);
        commentInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submitComment(); }
        });

        // comment-btn 滚动到评论区
        commentBtn.addEventListener('click', () => {
          commentSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
          setTimeout(() => commentInput.focus(), 400);
        });
      })();

      /* ── 分享功能 ── */
      (function() {
        const shareBtn = document.getElementById('share-btn');
        const url = window.location.href.split('?')[0];
        const title = document.title;
        shareBtn.addEventListener('click', () => {
          InspiroHub.modal({
            title: '分享对话',
            body: `
              <p style="margin-bottom:16px;">把这段精彩的 AI 对话分享给更多人：</p>
              <div style="display:flex;gap:8px;margin-bottom:16px;">
                <input id="share-url-input" readonly value="${url}" style="flex:1;padding:10px 12px;border:1px solid var(--color-border);border-radius:8px;font-size:13px;background:var(--color-bg-alt);color:var(--color-text-secondary);outline:none;" />
                <button id="share-copy-btn" style="padding:10px 16px;background:var(--color-primary);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;">复制链接</button>
              </div>
              <div style="display:flex;gap:10px;flex-wrap:wrap;">
                <button data-share="weibo" class="share-channel" style="flex:1;min-width:80px;padding:12px;border:1px solid var(--color-border);border-radius:8px;background:#fff;cursor:pointer;font-size:12px;color:var(--color-text-secondary);transition:background 150ms ease;">微博</button>
                <button data-share="wechat" class="share-channel" style="flex:1;min-width:80px;padding:12px;border:1px solid var(--color-border);border-radius:8px;background:#fff;cursor:pointer;font-size:12px;color:var(--color-text-secondary);transition:background 150ms ease;">微信</button>
                <button data-share="twitter" class="share-channel" style="flex:1;min-width:80px;padding:12px;border:1px solid var(--color-border);border-radius:8px;background:#fff;cursor:pointer;font-size:12px;color:var(--color-text-secondary);transition:background 150ms ease;">Twitter</button>
              </div>
            `,
            actions: [{ label: '关闭' }]
          });
          // 绑定复制
          setTimeout(() => {
            const copyBtn = document.getElementById('share-copy-btn');
            const urlInput = document.getElementById('share-url-input');
            if (copyBtn && urlInput) {
              copyBtn.addEventListener('click', () => {
                urlInput.select();
                if (navigator.clipboard) {
                  navigator.clipboard.writeText(url).then(() => { InspiroHub.toast('链接已复制到剪贴板'); });
                } else {
                  document.execCommand('copy');
                  InspiroHub.toast('链接已复制到剪贴板');
                }
              });
            }
            document.querySelectorAll('.share-channel').forEach(btn => {
              btn.addEventListener('mouseenter', () => btn.style.background = 'var(--color-primary-50)');
              btn.addEventListener('mouseleave', () => btn.style.background = '#fff');
              btn.addEventListener('click', () => {
                InspiroHub.toast(btn.textContent + '分享功能开发中');
              });
            });
          }, 50);
        });
      })();
      }); /* end load */
    </script>
</body>
</html>
