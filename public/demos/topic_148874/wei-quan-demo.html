<title>味圈 — 交互式Demo</title>
<style>
@font-face{font-family:'Instr';src:url('./_shared/fonts/InstrumentSans-Regular.ttf')format('truetype');font-weight:400}
@font-face{font-family:'Instr';src:url('./_shared/fonts/InstrumentSans-Bold.ttf')format('truetype');font-weight:700}
:root{--bg:#FFF8F0;--bg2:#FFF0E0;--ink:#2C1810;--muted:#8B7355;--rule:#E8D5C4;--accent:#E85D3E;--accent2:#FFB347;--green:#5CB85C;--blue:#4A90D9;--gold:#FF9800;--white:#fff;--shadow:rgba(44,24,16,.12)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}body{font-family:'Instr','PingFang SC','Microsoft YaHei',sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;overflow-x:hidden}
.phone-frame{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;overflow:hidden}

/* ===== Top Nav with Search ===== */
.top-nav{position:sticky;top:0;z-index:100;background:var(--white);padding:10px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px var(--shadow)}
.top-nav .logo{display:flex;align-items:center;gap:6px;flex-shrink:0}
.top-nav .logo-icon{width:30px;height:30px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px}
.top-nav .logo-text{font-size:18px;font-weight:700;color:var(--ink)}
.top-nav .search-box{flex:1;display:flex;align-items:center;background:var(--bg);border-radius:12px;padding:0 12px;height:36px;gap:8px}
.top-nav .search-box input{flex:1;border:none;background:transparent;font-size:13px;color:var(--ink);outline:none;font-family:inherit;height:100%}
.top-nav .search-box input::placeholder{color:var(--muted)}
.top-nav .search-box .search-btn{width:28px;height:28px;border-radius:50%;border:none;background:var(--accent);color:white;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nav-btn{width:36px;height:36px;border-radius:50%;border:none;background:var(--bg2);color:var(--ink);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.nav-btn:hover{background:var(--accent);color:white}

/* ===== Tab Bar ===== */
.tab-bar{position:sticky;top:52px;z-index:99;background:var(--white);display:flex;border-bottom:1px solid var(--rule)}
.tab-item{flex:1;text-align:center;padding:10px 0;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.tab-item.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ===== Map View ===== */
.map-view{width:100%;height:calc(100vh - 96px);background:#f0ebe4;position:relative;overflow:hidden;transition:filter .5s}
.map-view.blur{filter:blur(6px) brightness(.85)}
.map-wrapper{position:absolute;top:0;left:0;width:100%;height:100%;transform-origin:center center;cursor:grab;touch-action:none}
.map-wrapper:active{cursor:grabbing}
.map-wrapper.panning{cursor:grabbing}
.map-bg{width:100%;height:100%;background:linear-gradient(90deg,rgba(232,213,196,.3)1px,transparent 1px),linear-gradient(rgba(232,213,196,.3)1px,transparent 1px),linear-gradient(90deg,rgba(232,213,196,.15)1px,transparent 1px),linear-gradient(rgba(232,213,196,.15)1px,transparent 1px);background-size:100px 100px,100px 100px,20px 20px,20px 20px;background-color:#f5f0ea}
.map-roads{position:absolute;inset:0;overflow:hidden}
.road-h,.road-v{position:absolute;background:#fff;border:1px solid var(--rule)}
.road-h{height:24px;left:0;right:0}.road-v{width:24px;top:0;bottom:0}

/* Zoom controls */
.zoom-controls{position:absolute;right:12px;bottom:72px;z-index:15;display:flex;flex-direction:column;gap:6px}
.zoom-btn{width:38px;height:38px;border-radius:10px;border:none;background:var(--white);color:var(--ink);font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px var(--shadow);display:flex;align-items:center;justify-content:center;transition:all .2s}
.zoom-btn:hover{background:var(--accent);color:white}

/* Shop Markers */
.shop-marker{position:absolute;width:56px;height:56px;border-radius:50%;border:3px solid var(--white);box-shadow:0 3px 12px var(--shadow);cursor:pointer;overflow:hidden;transition:transform .2s,box-shadow .2s,opacity .3s;z-index:10}
.shop-marker:hover{transform:scale(1.15);box-shadow:0 6px 20px rgba(232,93,62,.3)}
.shop-marker.hidden{opacity:0;pointer-events:none;transform:scale(0.5)}
.shop-marker.highlighted{box-shadow:0 0 0 4px rgba(232,93,62,.4),0 6px 20px rgba(232,93,62,.3);animation:markerPulse 1.5s ease infinite}
@keyframes markerPulse{0%,100%{box-shadow:0 0 0 4px rgba(232,93,62,.4),0 6px 20px rgba(232,93,62,.3)}50%{box-shadow:0 0 0 8px rgba(232,93,62,.2),0 8px 24px rgba(232,93,62,.4)}}
.shop-marker .marker-img{width:100%;height:100%;object-fit:cover}
.shop-marker .marker-score{position:absolute;bottom:-2px;right:-2px;background:var(--accent);color:white;font-size:10px;font-weight:700;padding:1px 5px;border-radius:8px;min-width:20px;text-align:center;line-height:14px}
.shop-marker .marker-pulse{position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--accent);animation:pulse 2s ease infinite;pointer-events:none}
@keyframes pulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.4);opacity:0}}

/* Search toast */
.search-toast{position:fixed;top:58px;left:50%;transform:translateX(-50%) translateY(-60px);z-index:101;background:var(--ink);color:white;padding:8px 16px;border-radius:100px;font-size:12px;font-weight:600;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap}
.search-toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* Discover sheet — draggable bottom panel */
.discover-sheet{position:fixed;bottom:0;left:50%;max-width:430px;width:100%;background:var(--white);border-radius:20px 20px 0 0;box-shadow:0 -4px 20px var(--shadow);z-index:21;transform:translateX(-50%);transition:height .35s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow:hidden}
.discover-sheet.peek{height:52px}
.discover-sheet.half{height:50vh}
.discover-sheet.full{height:calc(100vh - 96px)}
.discover-sheet.hidden{transform:translateX(-50%) translateY(100%);transition:transform .35s cubic-bezier(.4,0,.2,1)}
.discover-drag-area{padding:14px 16px 0;flex-shrink:0;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}
.discover-drag-area:active{cursor:grabbing}
.discover-handle{width:40px;height:4px;background:var(--rule);border-radius:4px;margin:0 auto 10px}
.discover-sheet h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.discover-scroll{flex:1;overflow-y:auto;padding:10px 16px 24px;-webkit-overflow-scrolling:touch}
.discover-scroll::-webkit-scrollbar{display:none}
.discover-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.discover-card{background:var(--bg);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .2s}
.discover-card:active{transform:scale(.96)}
.discover-card .dc-img{width:100%;aspect-ratio:1;overflow:hidden}
.discover-card .dc-img img{width:100%;height:100%;object-fit:cover}
.discover-card .dc-info{padding:8px 10px}
.discover-card .dc-name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.discover-card .dc-meta{font-size:10px;color:var(--muted);margin-top:2px}
.discover-card .dc-rating{display:flex;align-items:center;gap:3px;margin-top:4px}
.dc-score{font-size:11px;font-weight:700;color:var(--accent)}
.dc-regular{font-size:9px;background:#FFF3CD;color:var(--gold);padding:1px 5px;border-radius:3px;font-weight:600}

/* ===== DETAIL PANEL ===== */
.detail-overlay{position:fixed;top:96px;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:50;opacity:0;pointer-events:none;transition:opacity .3s}
.detail-overlay.show{opacity:1;pointer-events:auto}
.detail-panel{position:fixed;top:96px;left:50%;max-width:430px;width:100%;height:0;background:var(--white);border-radius:20px 20px 0 0;z-index:51;overflow:hidden;transition:height .4s cubic-bezier(.4,0,.2,1);transform:translateX(-50%)}
.detail-panel.show{height:calc(100vh - 96px)}
.detail-scroll{height:100%;overflow-y:auto;padding:0 0 24px}
.detail-scroll::-webkit-scrollbar{display:none}
.detail-handle{width:40px;height:4px;background:var(--rule);border-radius:4px;margin:12px auto 0}
.detail-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;border:none;background:rgba(0,0,0,.1);color:var(--ink);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5}
.detail-section{padding:0 16px}
.detail-name{font-size:20px;font-weight:700;margin:8px 0 4px}
.detail-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.detail-tags .tag{background:var(--bg2);color:var(--muted);font-size:11px;padding:3px 10px;border-radius:100px}

/* Ratings */
.rating-section{background:var(--bg);border-radius:12px;padding:16px;margin-bottom:12px}
.rating-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.rating-row:last-child{margin-bottom:0}
.rating-label{width:72px;font-size:13px;font-weight:600;color:var(--ink);flex-shrink:0}
.rating-bar-bg{flex:1;height:8px;background:var(--rule);border-radius:100px;overflow:hidden}
.rating-bar-fill{height:100%;border-radius:100px}
.bar-food{background:linear-gradient(90deg,#E85D3E,#FF8A65)}
.bar-svc{background:linear-gradient(90deg,#4A90D9,#7BB3E0)}
.bar-env{background:linear-gradient(90deg,#5CB85C,#8FD68F)}
.bar-reg{background:linear-gradient(90deg,#FFB347,#FFD700)}
.rating-score{width:32px;font-size:14px;font-weight:700;text-align:right;flex-shrink:0}
.regular-highlight{background:linear-gradient(135deg,#FFF8E1,#FFF3CD);border:1.5px solid var(--accent2);border-radius:8px;padding:10px 12px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.regular-highlight .badge{background:var(--accent2);color:white;font-size:10px;font-weight:700;padding:2px 8px;border-radius:100px;white-space:nowrap}
.regular-highlight p{font-size:12px;color:var(--muted);line-height:1.5}

/* Reviews */
.review-section{margin-bottom:12px}
.review-section h3{font-size:15px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.review-card{background:var(--bg);border-radius:10px;padding:12px;margin-bottom:8px}
.review-card:last-child{margin-bottom:0}
.review-header{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.review-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:white;font-size:12px;font-weight:700}
.review-name{font-size:13px;font-weight:600}
.review-date{font-size:11px;color:var(--muted);margin-left:auto}
.review-text{font-size:13px;color:var(--muted);line-height:1.6}
.review-badge{background:#FFF3CD;color:var(--gold);font-size:10px;padding:1px 6px;border-radius:4px;font-weight:600}

/* Horizontal scroll sections */
.h-scroll-section{margin-bottom:12px}
.h-scroll-section h3{font-size:14px;font-weight:700;margin-bottom:8px;padding:0 16px;display:flex;align-items:center;gap:6px}
.h-scroll-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:0 6px}
.h-scroll-wrap::-webkit-scrollbar{display:none}
.h-scroll-flex{display:flex;gap:10px;padding:0 10px}
.h-scroll-card{flex-shrink:0;width:160px;border-radius:12px;overflow:hidden;background:var(--bg);border:1px solid var(--rule)}
.h-scroll-card .hsc-img{width:100%;height:120px;overflow:hidden}
.h-scroll-card .hsc-img img{width:100%;height:100%;object-fit:cover}
.h-scroll-card .hsc-info{padding:8px 10px}
.h-scroll-card .hsc-info .hsc-name{font-size:12px;font-weight:700}
.h-scroll-card .hsc-info .hsc-desc{font-size:10px;color:var(--muted);margin-top:2px}
.h-scroll-card .hsc-info .hsc-price{font-size:14px;font-weight:700;color:var(--accent);margin-top:2px}

/* ===== RANDOM VIEW ===== */
.random-overlay{position:fixed;top:96px;left:0;right:0;bottom:0;z-index:55;display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.random-overlay.show{display:flex;pointer-events:auto}
.random-center{display:flex;flex-direction:column;align-items:center;gap:16px;z-index:2;transition:opacity .4s,transform .4s}
.random-center.hide{opacity:0;transform:scale(.6);pointer-events:none}
.random-trigger{width:110px;height:110px;border-radius:50%;border:4px solid rgba(255,255,255,.8);background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;font-size:42px;cursor:pointer;box-shadow:0 0 40px rgba(232,93,62,.4),0 0 80px rgba(232,93,62,.2);transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden;pointer-events:auto}
.random-trigger::after{content:'';position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(255,255,255,.3);animation:trigPulse 2s ease infinite}
@keyframes trigPulse{0%,100%{transform:scale(1);opacity:.4}50%{transform:scale(1.12);opacity:0}}
.random-trigger:hover{transform:scale(1.05);box-shadow:0 0 50px rgba(232,93,62,.5),0 0 100px rgba(232,93,62,.3)}
.random-trigger:active{transform:scale(.95)}
.random-trigger:disabled{cursor:not-allowed;opacity:.7}
.input-area{display:flex;gap:8px;background:rgba(255,255,255,.15);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:14px;padding:10px 14px;border:1px solid rgba(255,255,255,.25);pointer-events:auto;min-width:300px}
.input-area .ia-left{flex:1;display:flex;align-items:center;gap:6px;border-right:1px solid rgba(255,255,255,.2);padding-right:10px}
.input-area .ia-left label{color:rgba(255,255,255,.8);font-size:13px;font-weight:600;white-space:nowrap}
.input-area .ia-left input{width:60px;height:32px;border:1px solid rgba(255,255,255,.3);border-radius:8px;text-align:center;font-size:15px;font-weight:700;color:var(--accent2);outline:none;background:rgba(255,255,255,.12);font-family:inherit}
.input-area .ia-left span{color:rgba(255,255,255,.6);font-size:12px}
.input-area .ia-right{display:flex;align-items:center;gap:4px;padding-left:6px}
.input-area .ia-right label{color:rgba(255,255,255,.8);font-size:13px;font-weight:600;white-space:nowrap}
.input-area .ia-right select{height:32px;border:1px solid rgba(255,255,255,.3);border-radius:8px;font-size:12px;color:var(--ink);outline:none;background:rgba(255,255,255,.9);font-family:inherit;padding:0 8px;cursor:pointer;min-width:90px}

/* Particle canvas */
#particleCanvas{position:fixed;top:96px;left:0;right:0;bottom:0;z-index:56;pointer-events:none}

/* Result card */
.result-card{display:none;position:fixed;top:96px;left:50%;max-width:430px;width:100%;height:calc(100vh - 96px);z-index:57;transform:translateX(-50%);flex-direction:column;border-radius:20px 20px 0 0;overflow:hidden;background:var(--white);animation:cardRise .5s ease}
.result-card.show{display:flex}
@keyframes cardRise{from{opacity:0;transform:translateX(-50%) translateY(40px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.result-card .rc-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;border:none;background:rgba(0,0,0,.1);color:var(--ink);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5}
.result-card .rc-body{flex:4;overflow-y:auto;padding:20px 16px}
.result-card .rc-body::-webkit-scrollbar{display:none}

.result-card .rc-footer .retry-btn{padding:12px 24px;border:2px solid var(--accent);border-radius:12px;background:transparent;color:var(--accent);font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;width:100%;max-width:360px}
.result-card .rc-footer .retry-btn:hover{background:var(--accent);color:white}
.rc-result-header{text-align:center;margin-bottom:16px}
.rc-result-header h2{font-size:20px;font-weight:700;color:var(--ink)}
.rc-result-header p{font-size:13px;color:var(--muted);margin-top:4px}
.rc-result-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg);border-radius:12px;margin-bottom:8px}
.rc-result-item .rci-img{width:52px;height:52px;border-radius:10px;overflow:hidden;flex-shrink:0}
.rc-result-item .rci-img img{width:100%;height:100%;object-fit:cover}
.rc-result-item .rci-info{flex:1;min-width:0}
.rc-result-item .rci-name{font-size:14px;font-weight:700}
.rc-result-item .rci-price{font-size:13px;color:var(--accent);font-weight:600}
.rc-result-item .rci-score{font-size:12px;color:var(--muted)}
.rc-nav-btn{display:block;width:100%;padding:12px;margin-top:12px;border:none;border-radius:12px;background:var(--accent);color:white;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}

/* Douyin FAB */
.douyin-fab{position:fixed;bottom:24px;right:24px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#000,#333);border:none;color:white;font-size:22px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.3);z-index:60;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.douyin-fab:hover{transform:scale(1.1)}
.douyin-fab .fab-badge{position:absolute;top:-2px;right:-2px;width:14px;height:14px;background:var(--accent);border-radius:50%;border:2px solid var(--white)}
.douyin-float-panel{position:fixed;bottom:88px;right:16px;width:calc(100% - 32px);max-width:380px;background:var(--white);border-radius:20px;box-shadow:0 8px 40px rgba(0,0,0,.2);z-index:61;transform:scale(.9) translateY(20px);opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.4,0,.2,1);overflow:hidden}
.douyin-float-panel.show{transform:scale(1) translateY(0);opacity:1;pointer-events:auto}
.dfp-header{padding:16px;display:flex;align-items:center;justify-content:space-between}
.dfp-header h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.dfp-close{width:28px;height:28px;border-radius:50%;border:none;background:var(--bg2);color:var(--muted);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.dfp-video{width:100%;height:180px;background:linear-gradient(180deg,#1a1a1a,#333);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.dfp-video img{width:85%;height:85%;object-fit:cover;border-radius:12px}
.dfp-scan-btn{position:absolute;bottom:12px;right:12px;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:white;font-size:20px;cursor:pointer;box-shadow:0 3px 12px rgba(232,93,62,.4);animation:floatBounce 2s ease infinite}
@keyframes floatBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.dfp-scan-overlay{position:absolute;inset:0;background:rgba(232,93,62,.95);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:10}
.dfp-scan-overlay.show{display:flex}
.dfp-scan-icon{width:60px;height:60px;border:3px solid white;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;animation:scanPulse 1s ease infinite}
@keyframes scanPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.dfp-scan-text{color:white;font-size:14px;font-weight:600}
.dfp-results{padding:12px 16px 16px;display:none}
.dfp-results.show{display:block}
.dfp-results h4{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.dfp-results h4 .detected{background:var(--accent);color:white;font-size:11px;padding:2px 8px;border-radius:100px}
.dfp-shop{display:flex;gap:10px;padding:10px;background:var(--bg);border-radius:10px;margin-bottom:8px;align-items:center}
.dfp-shop:last-child{margin-bottom:0}
.dfp-shop .ds-img{width:48px;height:48px;border-radius:10px;overflow:hidden;flex-shrink:0}
.dfp-shop .ds-img img{width:100%;height:100%;object-fit:cover}
.dfp-shop .ds-info{flex:1}
.dfp-shop .ds-name{font-size:13px;font-weight:700}
.dfp-shop .ds-meta{font-size:11px;color:var(--muted)}
.dfp-shop .ds-dist{font-size:11px;color:var(--accent);font-weight:600}
.dfp-shop .ds-nav{padding:5px 12px;background:var(--accent);color:white;border:none;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}

@media(max-width:430px){
  .phone-frame,.detail-panel,.result-card{max-width:100%}
  .detail-panel,.result-card{left:0;transform:none}
  .detail-panel.show{transform:none}
  .result-card{transform:none}

// ===== MAP PAN & ZOOM =====
var panX=0,panY=0,zoom=1;
var mapWrapper=document.getElementById('mapWrapper');
var mapPanning=false,mapPanStartX=0,mapPanStartY=0,mapPanStartX0=0,mapPanStartY0=0;

function updateMapTransform(){
  mapWrapper.style.transform='translate('+panX+'px,'+panY+'px) scale('+zoom+')';
}
function zoomIn(){zoom=Math.min(zoom+0.25,3);updateMapTransform()}
function zoomOut(){zoom=Math.max(zoom-0.25,0.5);updateMapTransform()}

(function(){
  var mapView=document.getElementById('view-map');
  function onDown(e){
    // Don't pan if clicking a marker or zoom button
    if(e.target.closest('.shop-marker')||e.target.closest('.zoom-controls'))return;
    mapPanning=true;
    mapWrapper.classList.add('panning');
    var clientX=e.touches?e.touches[0].clientX:e.clientX;
    var clientY=e.touches?e.touches[0].clientY:e.clientY;
    mapPanStartX=clientX;mapPanStartY=clientY;
    mapPanStartX0=panX;mapPanStartY0=panY;
  }
  function onMove(e){
    if(!mapPanning)return;
    e.preventDefault();
    var clientX=e.touches?e.touches[0].clientX:e.clientX;
    var clientY=e.touches?e.touches[0].clientY:e.clientY;
    var dx=clientX-mapPanStartX;
    var dy=clientY-mapPanStartY;
    panX=mapPanStartX0+dx;
    panY=mapPanStartY0+dy;
    updateMapTransform();
  }
  function onUp(){mapPanning=false;mapWrapper.classList.remove('panning')}
  mapView.addEventListener('mousedown',onDown);
  mapView.addEventListener('touchstart',onDown,{passive:false});
  document.addEventListener('mousemove',onMove);
  document.addEventListener('touchmove',onMove,{passive:false});
  document.addEventListener('mouseup',onUp);
  document.addEventListener('touchend',onUp);
})();

// ===== SEARCH =====
function doSearch(){
  var query=document.getElementById('searchInput').value.trim();
  var toast=document.getElementById('searchToast');
  if(!query){
    // Reset all markers
    document.querySelectorAll('.shop-marker').forEach(function(m){
      m.style.display='block';m.classList.remove('hidden','highlighted');
    });
    toast.textContent='已显示全部店铺';
    showToast();
    return;
  }
  var matchingIndices=[];
  // Match by shop name
  shops.forEach(function(s,i){
    if(s.name.includes(query))matchingIndices.push(i);
  });
  // If no shop match, match by dish name
  if(matchingIndices.length===0){
    dishes.forEach(function(d){
      if(d.name.includes(query)){
        var idx=shops.findIndex(function(s){return s.name===d.shop});
        if(idx!==-1&&matchingIndices.indexOf(idx)===-1)matchingIndices.push(idx);
      }
    });
  }
  document.querySelectorAll('.shop-marker').forEach(function(m,i){
    if(matchingIndices.indexOf(i)!==-1){
      m.style.display='block';m.classList.add('highlighted');m.classList.remove('hidden');
    }else{
      m.style.display='none';m.classList.add('hidden');m.classList.remove('highlighted');
    }
  });
  if(matchingIndices.length>0){
    toast.textContent='找到 '+matchingIndices.length+' 家匹配店铺';
  }else{
    toast.textContent='未找到匹配的店铺或美食';
  }
  showToast();
}
function showToast(){
  var t=document.getElementById('searchToast');
  t.classList.add('show');

}

(function(){
  var sheet=document.getElementById('discoverSheet');
  var drag=document.getElementById('discoverDrag');
  var scroll=document.getElementById('discoverScroll');
  var startY=0,startH=0,dragging=false;
  var mapH=window.innerHeight-96;
  var states={peek:52,half:window.innerHeight*.5,full:mapH};

  function setState(cls){
    sheet.classList.remove('peek','half','full');
    if(cls)sheet.classList.add(cls);
  }
  function snapTo(y){
    var best='peek',bestDist=Infinity;
    ['peek','half','full'].forEach(function(s){
      var d=Math.abs(y-states[s]);
      if(d<bestDist){bestDist=d;best=s}
    });
    setState(best);
  }
  function onDown(e){
    dragging=true;
    startY=e.touches?e.touches[0].clientY:e.clientY;
    startH=sheet.offsetHeight;
    sheet.style.transition='none';
  }
  function onMove(e){
    if(!dragging)return;
    var y=e.touches?e.touches[0].clientY:e.clientY;
    var dy=startY-y;
    var newH=Math.max(52,Math.min(mapH,startH+dy));
    sheet.style.height=newH+'px';
  }
  function onUp(){
    if(!dragging)return;
    dragging=false;
    sheet.style.transition='';
    snapTo(sheet.offsetHeight);
  }
  drag.addEventListener('mousedown',onDown);
  drag.addEventListener('touchstart',onDown,{passive:true});
  document.addEventListener('mousemove',onMove);
  document.addEventListener('touchmove',onMove,{passive:true});
  document.addEventListener('mouseup',onUp);
  document.addEventListener('touchend',onUp);

  // Pull down on scroll to collapse
  var scrollTouchStart=0,scrollTouchH=0;
  scroll.addEventListener('touchstart',function(e){
    if(scroll.scrollTop<=0){
      scrollTouchStart=e.touches[0].clientY;
      scrollTouchH=sheet.offsetHeight;
      sheet.style.transition='none';
    }
  },{passive:true});
  scroll.addEventListener('touchmove',function(e){
    if(scroll.scrollTop<=0 && scrollTouchStart){
      var y=e.touches[0].clientY;
      var dy=y-scrollTouchStart;
      if(dy>0){
        var newH=Math.max(52,Math.min(mapH,scrollTouchH-dy));
        sheet.style.height=newH+'px';
      }
    }
  },{passive:true});
  scroll.addEventListener('touchend',function(){
    scrollTouchStart=0;
    sheet.style.transition='';
    snapTo(sheet.offsetHeight);
  });
})();

// ===== RANDOM ORDER =====
var particles=[],particleRAF=null;
var particleColors=['#E85D3E','#FFB347','#FF7043','#FFD700','#FF8A65','#4A90D9','#5CB85C','#2C1810','#E8D5C4'];

function initParticles(cx,cy){
  var canvas=document.getElementById('particleCanvas');
  canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  particles=[];
  for(var i=0;i<50;i++){
    var angle=Math.random()*Math.PI*2;
    var speed=3+Math.random()*5;
    var dist=80+Math.random()*120;
    particles.push({
      x:cx,y:cy,angle:angle,speed:speed,dist:dist,
      size:4+Math.random()*6,
      color:particleColors[Math.floor(Math.random()*particleColors.length)],
      phase:Math.random()*Math.PI*2,life:0
    });
  }
}
function drawParticles(cx,cy,t,phase){
  var canvas=document.getElementById('particleCanvas');
  var ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(function(p){
    var a=p.angle+t*0.003*p.speed+p.phase;
    var d=p.dist+Math.sin(t*0.004+p.phase)*25;
    var x=cx+Math.cos(a)*d;
    var y=cy+Math.sin(a)*d;
    if(phase>0.5){
      var converge=(phase-0.5)*2;
      x=cx+(x-cx)*(1-converge);y=cy+(y-cy)*(1-converge);
    }
    var s=p.size*(1-Math.sin(t*0.006+p.phase)*0.3);
    if(phase>0.8)s*=(1-(phase-0.8)*5);
    ctx.beginPath();ctx.arc(x,y,Math.max(1,s),0,Math.PI*2);
    ctx.fillStyle=p.color;ctx.globalAlpha=0.85;ctx.fill();
    ctx.beginPath();ctx.arc(x,y,Math.max(1,s*0.5),0,Math.PI*2);
    ctx.fillStyle='#fff';ctx.globalAlpha=0.3;ctx.fill();
  });
  ctx.globalAlpha=1;
}

function triggerRandom(){
  var btn=document.getElementById('randomTrigger');
  var center=document.getElementById('randomCenter');
  btn.disabled=true;center.classList.add('hide');
  var rect=btn.getBoundingClientRect();
  var cx=rect.left+rect.width/2,cy=rect.top+rect.height/2+100;
  initParticles(cx,cy);
  var startTime=null,duration=1000;
  function animate(ts){
    if(!startTime)startTime=ts;
    var elapsed=ts-startTime;
    var phase=Math.min(elapsed/duration,1);
    drawParticles(cx,cy,elapsed,phase);
    if(phase<1){particleRAF=requestAnimationFrame(animate)}
    else{
      var canvas=document.getElementById('particleCanvas');
      canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);
      showResult();
    }
  }
  particleRAF=requestAnimationFrame(animate);
}

function showResult(){
  var maxPrice=parseInt(document.getElementById('priceInput').value)||30;
  var taste=document.getElementById('tasteSelect').value;
  var eligible=dishes.filter(function(d){
    if(d.price>maxPrice)return false;
    if(taste!=='all'&&d.taste!==taste)return false;
    return true;
  });
  if(!eligible.length)eligible=dishes.filter(function(d){return d.price<=maxPrice});
  if(!eligible.length)eligible=dishes;
  var chosen=eligible[Math.floor(Math.random()*eligible.length)];
  var shop=shops.find(function(s){return s.name===chosen.shop})||shops[0];

  var h='<div class="rc-result-header"><h2>'+shop.name+'</h2><p>'+chosen.name+' · 人均'+shop.tags[2].replace('人均','')+'元 · 回头客率'+shop.regularRate+'%</p></div>';
  dishes.filter(function(d){return d.shop===chosen.shop}).forEach(function(rd){
    var img=dishImages[rd.name]||'assets/food_noodles.jpg';
    h+='<div class="rc-result-item"><div class="rci-img"><img src="'+img+'" alt=""></div><div class="rci-info"><div class="rci-name">'+rd.name+'</div><div class="rci-price">&yen;'+rd.price+'</div><div class="rci-score">&#11088; '+shop.food+' · 回头客 '+shop.regular+'</div></div></div>';
  });
  h+='<button class="rc-nav-btn" onclick="alert(\'导航功能演示：正在为您导航到'+shop.name+'\')">&#128205; 一键导航到店</button>';
  document.getElementById('rcBody').innerHTML=h;
  document.getElementById('resultCard').classList.add('show');
  document.getElementById('randomTrigger').disabled=false;
}

function retryRandom(){
  document.getElementById('resultCard').classList.remove('show');
  triggerRandom();
}
function closeResult(){
  document.getElementById('resultCard').classList.remove('show');
  document.getElementById('randomCenter').classList.remove('hide');
  var canvas=document.getElementById('particleCanvas');
  canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);
  if(particleRAF)cancelAnimationFrame(particleRAF);
}
