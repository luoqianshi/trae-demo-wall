<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>闪薪 - AI对话首页</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style>
        :root {
            --color-brand-primary: #6366F1;
            --color-brand-primary-hover: #4F46E5;
            --color-brand-primary-light: #EEF2FF;
            --color-brand-primary-subtle: #F5F3FF;
            --color-brand-gradient-start: #6366F1;
            --color-brand-gradient-end: #8B5CF6;
            --color-bg-page: #F8FAFC;
            --color-bg-surface: #FFFFFF;
            --color-bg-elevated: #FFFFFF;
            --color-bg-chat: #F1F5F9;
            --color-text-primary: #0F172A;
            --color-text-secondary: #64748B;
            --color-text-tertiary: #94A3B8;
            --color-text-inverse: #FFFFFF;
            --color-border-default: #E2E8F0;
            --color-border-light: #F1F5F9;
            --color-ai-bubble: linear-gradient(135deg, #6366F1, #8B5CF6);
            --state-success: #22C55E;
            --state-warning: #F59E0B;
            --state-error: #EF4444;
            --state-info: #3B82F6;
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
            --radius-2xl: 20px;
            --radius-full: 9999px;
            --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.04);
            --shadow-elevated: 0 4px 12px rgba(15, 23, 42, 0.05);
            --shadow-floating: 0 8px 24px rgba(15, 23, 42, 0.08);
            --shadow-glow: 0 0 20px rgba(99, 102, 241, 0.15);
            --font-display: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-body: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html {
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font-body);
            color: var(--color-text-primary);
            background: var(--color-bg-page);
            line-height: 1.6;
            max-width: 375px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes pulse-ring {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(2); opacity: 0; }
        }
        .mic-pulse {
            animation: pulse-ring 1.2s ease-out infinite;
        }

        @keyframes fade-in {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fade-in 0.3s ease-out; }

        .recording-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(15, 23, 42, 0.7);
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            align-items: center;
            padding: 4px 0;
        }
        .typing-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.7);
            animation: typing-bounce 1.2s ease-in-out infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.15s; }
        .typing-dot:nth-child(3) { animation-delay: 0.3s; }
        @keyframes typing-bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        .user-bubble {
            background: var(--color-bg-surface);
            border-radius: 16px;
            border-top-right-radius: 4px;
            padding: 10px 14px;
            color: var(--color-text-primary);
            box-shadow: var(--shadow-card);
            max-width: calc(100% - 8px);
            word-break: break-word;
        }

        .ai-bubble {
            background: linear-gradient(135deg, #6366F1, #8B5CF6);
            border-radius: 16px;
            border-top-left-radius: 4px;
            padding: 10px 14px;
            color: #FFFFFF;
            max-width: calc(100% - 4px);
        }
    </style>
    <style type="text/tailwindcss">
@theme inline {
  --color-primary: var(--color-brand-primary);
  --color-primary-hover: var(--color-brand-primary-hover);
  --color-primary-light: var(--color-brand-primary-light);
  --color-primary-subtle: var(--color-brand-primary-subtle);
  --color-background: var(--color-bg-page);
  --color-surface: var(--color-bg-surface);
  --color-elevated: var(--color-bg-elevated);
  --color-chat-bg: var(--color-bg-chat);
  --color-foreground: var(--color-text-primary);
  --color-foreground-secondary: var(--color-text-secondary);
  --color-foreground-tertiary: var(--color-text-tertiary);
  --color-foreground-inverse: var(--color-text-inverse);
  --color-border: var(--color-border-default);
  --color-border-light: var(--color-border-light);
}
    </style>
</head>
<body>
    <div class="mobile-container">
        <main class="page-container relative" style="min-height: 100vh;">

            <!-- Status Bar -->
            <div style="height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: var(--color-bg-surface);" aria-hidden="true">
                <span style="font-size: 12px; font-weight: 600; color: var(--color-text-primary);">9:41</span>
                <div style="display: flex; align-items: center; gap: 4px;">
                    <i data-lucide="signal" style="width: 14px; height: 14px; color: var(--color-text-primary);"></i>
                    <i data-lucide="wifi" style="width: 14px; height: 14px; color: var(--color-text-primary);"></i>
                    <i data-lucide="battery-full" style="width: 18px; height: 14px; color: var(--color-text-primary);"></i>
                </div>
            </div>

            <!-- Top Bar: Logo + Settings -->
            <header style="height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: var(--color-bg-surface); border-bottom: 1px solid var(--color-border-light);">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <div style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, #6366F1, #8B5CF6);">
                        <i data-lucide="sparkles" style="width: 16px; height: 16px; color: #FFFFFF;"></i>
                    </div>
                    <span style="font-size: 16px; font-weight: 700; color: var(--color-text-primary);">闪薪</span>
                </div>
                <button style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; background: var(--color-bg-chat); border: 1px solid var(--color-border-default);" aria-label="设置">
                    <i data-lucide="settings" style="width: 16px; height: 16px; color: var(--color-text-secondary);"></i>
                </button>
            </header>

            <!-- Chat Area -->
            <div id="chatContainer" style="padding: 12px 16px; display: flex; flex-direction: column; gap: 16px; height: calc(100vh - 260px); overflow-y: auto;">

                <!-- AI Welcome Bubble -->
                <div style="display: flex; align-items: flex-start; gap: 8px;" class="animate-fade-in">
                    <div style="flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #6366F1, #8B5CF6);">
                        <i data-lucide="sparkles" style="width: 16px; height: 16px; color: #FFFFFF;"></i>
                    </div>
                    <div style="flex: 1; min-width: 0; padding-left: 4px;">
                        <span style="display: block; font-size: 11px; margin-bottom: 4px; font-weight: 500; color: var(--color-text-tertiary);">小薪</span>
                        <div class="ai-bubble">
                            <p style="font-size: 14px; line-height: 1.6;">Hi！我是小薪，你的AI技能助手。告诉我你想找什么技能，或者想接什么私活，我来帮你快速匹配。</p>
                        </div>
                    </div>
                </div>

                <!-- User Bubble -->
                <div style="display: flex; align-items: flex-start; justify-content: flex-end; gap: 8px;" class="animate-fade-in">
                    <div class="user-bubble">
                        <p style="font-size: 14px; line-height: 1.6;">我周末想接点PPT美化的私活</p>
                    </div>
                </div>

                <!-- AI Response: Matching -->
                <div style="display: flex; align-items: flex-start; gap: 8px;" class="animate-fade-in">
                    <div style="flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #6366F1, #8B5CF6);">
                        <i data-lucide="sparkles" style="width: 16px; height: 16px; color: #FFFFFF;"></i>
                    </div>
                    <div style="flex: 1; min-width: 0; padding-left: 4px;">
                        <span style="display: block; font-size: 11px; margin-bottom: 4px; font-weight: 500; color: var(--color-text-tertiary);">小薪</span>
                        <div class="ai-bubble">
                            <p style="font-size: 14px; line-height: 1.6;">收到！帮您快速匹配中...</p>
                        </div>
                    </div>
                </div>

                <!-- AI Follow-up -->
                <div style="display: flex; align-items: flex-start; gap: 8px;" class="animate-fade-in">
                    <div style="flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #6366F1, #8B5CF6);">
                        <i data-lucide="sparkles" style="width: 16px; height: 16px; color: #FFFFFF;"></i>
                    </div>
                    <div style="flex: 1; min-width: 0; padding-left: 4px;">
                        <span style="display: block; font-size: 11px; margin-bottom: 4px; font-weight: 500; color: var(--color-text-tertiary);">小薪</span>
                        <div class="ai-bubble">
                            <p style="font-size: 14px; line-height: 1.6;">请问您擅长哪种风格的PPT？商务简约还是创意设计？期望的交付时间是多久？</p>
                        </div>
                    </div>
                </div>

                <!-- Quick Option Pills -->
                <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-left: 40px;" class="animate-fade-in">
                    <span class="quick-tag" style="flex-shrink: 0; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 500; cursor: pointer; background: var(--color-brand-primary-light); color: var(--color-brand-primary);">商务简约</span>
                    <span class="quick-tag" style="flex-shrink: 0; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 500; cursor: pointer; background: var(--color-brand-primary-light); color: var(--color-brand-primary);">创意设计</span>
                    <span class="quick-tag" style="flex-shrink: 0; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 500; cursor: pointer; background: var(--color-brand-primary-light); color: var(--color-brand-primary);">24小时内</span>
                    <span class="quick-tag" style="flex-shrink: 0; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 500; cursor: pointer; background: var(--color-brand-primary-light); color: var(--color-brand-primary);">3天内</span>
                </div>

            </div>

            <!-- Fixed Bottom Input Area (above TabBar) -->
            <div style="position: fixed; bottom: 56px; left: 50%; transform: translateX(-50%); z-index: 30; width: 375px; max-width: 100vw; background: var(--color-bg-surface); border-top: 1px solid var(--color-border-default);">

                <!-- Quick Tags Row -->
                <div style="display: flex; gap: 8px; overflow-x: auto; padding: 8px 16px 4px;" class="no-scrollbar">
                    <span data-dom-id="quick-ppt" class="quick-tag" style="flex-shrink: 0; padding: 6px 12px; border-radius: 9999px; font-size: 12px; font-weight: 500; white-space: nowrap; cursor: pointer; background: var(--color-brand-primary-light); color: var(--color-brand-primary); border: 1px solid var(--color-brand-primary);">PPT美化</span>
                    <span data-dom-id="quick-copywrite" class="quick-tag" style="flex-shrink: 0; padding: 6px 12px; border-radius: 9999px; font-size: 12px; font-weight: 500; white-space: nowrap; cursor: pointer; background: var(--color-bg-surface); color: var(--color-text-secondary); border: 1px solid var(--color-border-default);">文案代写</span>
                    <span class="quick-tag" style="flex-shrink: 0; padding: 6px 12px; border-radius: 9999px; font-size: 12px; font-weight: 500; white-space: nowrap; cursor: pointer; background: var(--color-bg-surface); color: var(--color-text-secondary); border: 1px solid var(--color-border-default);">紧急找人</span>
                    <span class="quick-tag" style="flex-shrink: 0; padding: 6px 12px; border-radius: 9999px; font-size: 12px; font-weight: 500; white-space: nowrap; cursor: pointer; background: var(--color-bg-surface); color: var(--color-text-secondary); border: 1px solid var(--color-border-default);">AI绘画</span>
                </div>

                <!-- Text Input Row -->
                <div style="display: flex; align-items: center; gap: 8px; padding: 4px 16px 10px;">
                    <div style="flex: 1; display: flex; align-items: center; border-radius: 9999px; padding: 10px 16px; background: var(--color-bg-chat);">
                        <input type="text" id="chatInput" placeholder="用语音或文字描述你的需求..." style="flex: 1; background: transparent; outline: none; border: none; font-size: 14px; color: var(--color-text-primary); font-family: var(--font-body);">
                    </div>

                    <!-- Mic Button -->
                    <a data-dom-id="mic-btn" href="./voice-input.html" style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #6366F1, #8B5CF6); border: none; cursor: pointer; box-shadow: 0 4px 12px rgba(99,102,241,0.3); text-decoration: none;" aria-label="语音输入">
                        <i data-lucide="mic" style="width: 20px; height: 20px; color: #FFFFFF;"></i>
                    </a>
                </div>
            </div>

            <!-- Bottom Tab Bar -->
            <nav style="position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); z-index: 40; display: flex; align-items: center; justify-content: space-around; width: 375px; max-width: 100vw; height: 56px; background: var(--color-bg-surface); border-top: 1px solid var(--color-border-default); padding-bottom: env(safe-area-inset-bottom, 0px);">
                <!-- 对话 (Active) -->
                <a data-dom-id="tab-chat" href="./home.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; text-decoration: none; min-width: 0;">
                    <i data-lucide="message-square" style="width: 20px; height: 20px; color: #6366F1;"></i>
                    <span style="font-size: 10px; font-weight: 600; color: #6366F1;">对话</span>
                </a>
                <!-- 发现 -->
                <a data-dom-id="tab-discover" href="./market.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; text-decoration: none; min-width: 0;">
                    <i data-lucide="compass" style="width: 20px; height: 20px; color: var(--color-text-tertiary);"></i>
                    <span style="font-size: 10px; font-weight: 500; color: var(--color-text-tertiary);">发现</span>
                </a>
                <!-- 发布 (+) raised button -->
                <a data-dom-id="tab-publish" href="#" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; text-decoration: none; min-width: 0; margin-top: -12px;">
                    <div style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #6366F1, #8B5CF6); box-shadow: 0 4px 14px rgba(99,102,241,0.4);">
                        <i data-lucide="plus" style="width: 22px; height: 22px; color: #FFFFFF;"></i>
                    </div>
                    <span style="font-size: 10px; color: var(--color-text-tertiary); margin-top: -2px;">发布</span>
                </a>
                <!-- 我的 -->
                <a data-dom-id="tab-profile" href="./profile.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; text-decoration: none; min-width: 0;">
                    <i data-lucide="user" style="width: 20px; height: 20px; color: var(--color-text-tertiary);"></i>
                    <span style="font-size: 10px; font-weight: 500; color: var(--color-text-tertiary);">我的</span>
                </a>
            </nav>

        </main>
    </div>

    <!-- Initialize Lucide icons -->
    <script>lucide.createIcons();</script>

    <!-- Chat interaction script -->
    <script>
    (function() {
        // 1. Find elements
        var chatInput = document.getElementById('chatInput');
        var chatContainer = document.getElementById('chatContainer');
        var quickPpt = document.querySelector('[data-dom-id="quick-ppt"]');
        var quickCopywrite = document.querySelector('[data-dom-id="quick-copywrite"]');

        // 2. Create send button if missing
        var inputRow = chatInput.closest('div[style]');
        var sendBtn = inputRow.querySelector('[data-dom-id="send-btn"]');
        if (!sendBtn) {
            sendBtn = document.createElement('button');
            sendBtn.setAttribute('data-dom-id', 'send-btn');
            sendBtn.setAttribute('aria-label', '发送');
            sendBtn.style.cssText = 'flex-shrink:0;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#6366F1;border:none;cursor:pointer;box-shadow:0 2px 8px rgba(99,102,241,0.3);';
            sendBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>';
            // Insert before the mic button
            var micBtn = document.querySelector('[data-dom-id="mic-btn"]');
            micBtn.parentNode.insertBefore(sendBtn, micBtn);
        }

        // 3. Send function
        function sendMessage() {
            var text = chatInput.value.trim();
            if (!text) return;

            // User bubble
            var userBubbleWrap = document.createElement('div');
            userBubbleWrap.className = 'animate-fade-in';
            userBubbleWrap.style.cssText = 'display:flex;align-items:flex-start;justify-content:flex-end;gap:8px;';
            var userBubble = document.createElement('div');
            userBubble.className = 'user-bubble';
            var userP = document.createElement('p');
            userP.style.cssText = 'font-size:14px;line-height:1.6;';
            userP.textContent = text;
            userBubble.appendChild(userP);
            userBubbleWrap.appendChild(userBubble);
            chatContainer.appendChild(userBubbleWrap);

            // Clear input
            chatInput.value = '';

            // Scroll to bottom
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // AI response after 1 second
            setTimeout(function() {
                var aiWrap = document.createElement('div');
                aiWrap.className = 'animate-fade-in';
                aiWrap.style.cssText = 'display:flex;align-items:flex-start;gap:8px;';

                var aiAvatar = document.createElement('div');
                aiAvatar.style.cssText = 'flex-shrink:0;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#6366F1,#8B5CF6);';
                aiAvatar.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path><path d="M5 3v4"></path><path d="M19 17v4"></path><path d="M3 5h4"></path><path d="M17 19h4"></path></svg>';

                var aiContent = document.createElement('div');
                aiContent.style.cssText = 'flex:1;min-width:0;padding-left:4px;';
                var aiLabel = document.createElement('span');
                aiLabel.style.cssText = 'display:block;font-size:11px;margin-bottom:4px;font-weight:500;color:var(--color-text-tertiary);';
                aiLabel.textContent = '小薪';
                var aiBubble = document.createElement('div');
                aiBubble.className = 'ai-bubble';
                var aiP = document.createElement('p');
                aiP.style.cssText = 'font-size:14px;line-height:1.6;';
                aiP.textContent = '收到！让我帮你看看有什么合适的技能...';
                aiBubble.appendChild(aiP);
                aiContent.appendChild(aiLabel);
                aiContent.appendChild(aiBubble);

                aiWrap.appendChild(aiAvatar);
                aiWrap.appendChild(aiContent);
                chatContainer.appendChild(aiWrap);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 1000);
        }

        // 4. Enter key to send
        chatInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.keyCode === 13) {
                e.preventDefault();
                sendMessage();
            }
        });

        // 5. Send button click
        sendBtn.addEventListener('click', function(e) {
            e.preventDefault();
            sendMessage();
        });

        // 6. Quick tag clicks
        if (quickPpt) {
            quickPpt.addEventListener('click', function() {
                chatInput.value = 'PPT美化';
                chatInput.focus();
            });
        }
        if (quickCopywrite) {
            quickCopywrite.addEventListener('click', function() {
                chatInput.value = '文案代写';
                chatInput.focus();
            });
        }
    })();
    </script>

</body>
</html>
