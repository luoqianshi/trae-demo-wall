<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>语音输入 - 闪薪</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* ---- Brand Tokens ---- */
    :root {
      --primary: #6366F1;
      --gradient-end: #8B5CF6;
    }

    /* ---- Animations ---- */
    @keyframes pulse-ring {
      0%   { transform: scale(1); opacity: 0.4; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    @keyframes wave-bar {
      0%, 100% { transform: scaleY(0.5); }
      50%      { transform: scaleY(1); }
    }
    @keyframes slide-up {
      0%   { transform: translateY(100%); }
      100% { transform: translateY(0); }
    }

    /* ---- Background Overlay ---- */
    .overlay-bg {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 10;
    }

    /* ---- Top Bar (on overlay) ---- */
    .top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 88px;
      padding: 0 16px;
    }
    .top-bar .back-btn {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      transition: background 0.2s;
    }
    .top-bar .back-btn:active {
      background: rgba(255,255,255,0.2);
    }
    .top-bar .title {
      color: #ffffff;
      font-size: 17px;
      font-weight: 600;
    }

    /* ---- Bottom Sheet Modal ---- */
    .bottom-sheet {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 20;
      background: #ffffff;
      border-radius: 24px 24px 0 0;
      padding: 32px 24px 40px;
      animation: slide-up 0.35s cubic-bezier(0.32, 0.72, 0, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Drag handle */
    .drag-handle {
      width: 36px;
      height: 4px;
      border-radius: 2px;
      background: #E2E8F0;
      margin-bottom: 28px;
    }

    /* ---- Mic Button ---- */
    .mic-wrapper {
      position: relative;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .mic-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--gradient-end));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 24px rgba(99, 102, 241, 0.15);
      position: relative;
      z-index: 2;
      transition: transform 0.15s;
    }
    .mic-circle:active {
      transform: scale(0.95);
    }

    /* Pulse rings (hidden by default, shown when recording) */
    .pulse-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(99, 102, 241, 0.4);
      opacity: 0;
      pointer-events: none;
      z-index: 1;
    }
    .recording .pulse-ring {
      animation: pulse-ring 1.5s ease-out infinite;
    }
    .recording .pulse-ring:nth-child(2) {
      animation-delay: 0.4s;
    }
    .recording .pulse-ring:nth-child(3) {
      animation-delay: 0.8s;
    }

    /* ---- Waveform Bars ---- */
    .waveform {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 50px;
      margin-top: 24px;
    }
    .wave-bar {
      width: 4px;
      border-radius: 2px;
      transform-origin: bottom center;
      animation: wave-bar 0.8s ease-in-out infinite;
      animation-play-state: paused;
      opacity: 0.5;
    }
    /* Subtle idle animation */
    .wave-bar {
      animation: wave-bar 2s ease-in-out infinite;
      opacity: 0.35;
    }
    .wave-bar:nth-child(1) { height: 20px; background: var(--primary); animation-delay: 0s; }
    .wave-bar:nth-child(2) { height: 35px; background: var(--gradient-end); animation-delay: 0.1s; }
    .wave-bar:nth-child(3) { height: 50px; background: var(--primary); animation-delay: 0.2s; }
    .wave-bar:nth-child(4) { height: 35px; background: var(--gradient-end); animation-delay: 0.3s; }
    .wave-bar:nth-child(5) { height: 20px; background: var(--primary); animation-delay: 0.4s; }

    /* Active recording waveform */
    .recording .wave-bar {
      animation: wave-bar 0.6s ease-in-out infinite;
      opacity: 1;
    }
    .recording .wave-bar:nth-child(1) { animation-delay: 0s; }
    .recording .wave-bar:nth-child(2) { animation-delay: 0.08s; }
    .recording .wave-bar:nth-child(3) { animation-delay: 0.16s; }
    .recording .wave-bar:nth-child(4) { animation-delay: 0.24s; }
    .recording .wave-bar:nth-child(5) { animation-delay: 0.32s; }

    /* ---- State toggles ---- */
    .hint-idle { display: block; }
    .hint-recording { display: none; }
    .recording .hint-idle { display: none; }
    .recording .hint-recording { display: block; }

    /* ---- Cancel Button ---- */
    .cancel-btn {
      margin-top: 32px;
      padding: 12px 48px;
      border-radius: 9999px;
      border: 1px solid #E2E8F0;
      background: transparent;
      color: #64748B;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .cancel-btn:active {
      background: #F1F5F9;
      border-color: #CBD5E1;
    }
  </style>
</head>
<body>

  <!-- Dimmed/blurred background overlay simulating home page behind -->
  <div class="overlay-bg"></div>

  <!-- Top bar on overlay -->
  <div class="top-bar">
    <a data-dom-id="back-home-voice" href="./home.html" class="back-btn">
      <i data-lucide="arrow-left" style="width:20px;height:20px;"></i>
    </a>
    <span class="title">语音输入</span>
  </div>

  <!-- Bottom Sheet Modal -->
  <div class="bottom-sheet">

    <!-- Drag handle -->
    <div class="drag-handle"></div>

    <!-- Mic icon area -->
    <div class="mic-wrapper" id="mic-btn" role="button" aria-label="按住麦克风开始录音">
      <!-- Pulse rings -->
      <div class="pulse-ring"></div>
      <div class="pulse-ring"></div>
      <div class="pulse-ring"></div>
      <!-- Mic circle -->
      <div class="mic-circle">
        <i data-lucide="mic" style="width:28px;height:28px;color:#ffffff;"></i>
      </div>
    </div>

    <!-- Title text -->
    <p style="font-size:20px;font-weight:600;color:#0F172A;margin-top:16px;text-align:center;">小薪在听</p>
    <p style="font-size:14px;color:#64748B;margin-top:4px;text-align:center;">请说出你的需求</p>

    <!-- Waveform visualization -->
    <div class="waveform">
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
    </div>

    <!-- Hint text -->
    <div style="text-align:center;margin-top:24px;">
      <span class="hint-idle" style="font-size:13px;color:#94A3B8;">按住麦克风开始录音</span>
      <span class="hint-recording" style="font-size:15px;font-weight:600;color:#6366F1;">正在聆听...</span>
    </div>

    <!-- Cancel / Send buttons (hidden by default) -->
    <div id="action-btns" style="display:none; margin-top:32px; gap:16px;">
      <button class="cancel-btn" id="cancel-btn">取消</button>
      <button class="cancel-btn" id="send-btn" style="background:linear-gradient(135deg,#6366F1,#8B5CF6);color:#FFFFFF;border-color:transparent;">发送</button>
    </div>

    <!-- Idle cancel button (visible before recording) -->
    <button class="cancel-btn" id="cancel-btn-idle">取消</button>

  </div>

  <script>lucide.createIcons();</script>

</body>
</html>
