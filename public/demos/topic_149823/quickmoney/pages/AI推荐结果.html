<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI推荐结果 (Skill Recommend)</title>
    <style id="theme-vars">
/* 闪薪 - Brand CSS */
/* Tech-trust blue-purple gradient palette, clean minimal UI */

:root {
  /* === Color System === */
  --color-brand-primary: #6366F1;
  --color-brand-primary-hover: #4F46E5;
  --color-brand-primary-light: #EEF2FF;
  --color-brand-primary-subtle: #F5F3FF;
  --color-brand-gradient-start: #6366F1;
  --color-brand-gradient-end: #8B5CF6;

  --color-bg-page: #F8FAFC;
  --color-bg-surface: #FFFFFF;
  --color-bg-elevated: #FFFFFF;
  --color-bg-chat: #F1F5F9;

  --color-text-primary: #0F172A;
  --color-text-secondary: #64748B;
  --color-text-tertiary: #94A3B8;
  --color-text-inverse: #FFFFFF;

  --color-border-default: #E2E8F0;
  --color-border-light: #F1F5F9;

  --color-ai-bubble: linear-gradient(135deg, #6366F1, #8B5CF6);
  --color-user-bubble: #FFFFFF;
  --color-ai-bubble-text: #FFFFFF;
  --color-user-bubble-text: #0F172A;

  --state-success: #22C55E;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* === Radius Scale === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-2xl: 20px;
  --radius-full: 9999px;

  /* === Shadow System (static <= 0.05 alpha, floating only for modals) === */
  --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.04);
  --shadow-elevated: 0 4px 12px rgba(15, 23, 42, 0.05);
  --shadow-floating: 0 8px 24px rgba(15, 23, 42, 0.08);
  --shadow-glow: 0 0 20px rgba(99, 102, 241, 0.15);

  /* === Typography === */
  --font-display: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-body: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;

  --text-display-lg: 28px;
  --text-display-md: 24px;
  --text-display-sm: 20px;

  --text-title-lg: 18px;
  --text-title-md: 16px;
  --text-title-sm: 14px;

  --text-body-lg: 16px;
  --text-body-md: 14px;
  --text-body-sm: 12px;

  --text-caption: 11px;

  --leading-display: 1.3;
  --leading-title: 1.4;
  --leading-body: 1.6;
  --leading-tight: 1.2;

  --weight-bold: 700;
  --weight-semibold: 600;
  --weight-medium: 500;
  --weight-regular: 400;

  /* === Spacing === */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;
  --space-4xl: 40px;
}

/* Mini program viewport simulation */
html {
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  font-family: var(--font-body);
  color: var(--color-text-primary);
  background: var(--color-bg-page);
  line-height: var(--leading-body);
  margin: 0;
  padding: 0;
  max-width: 375px;
  margin: 0 auto;
  min-height: 100vh;
}

.page-container {
  padding-bottom: calc(60px + env(safe-area-inset-bottom));
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="page-container">

      <!-- 1. Simulated WeChat Status Bar -->
      <div class="h-11 flex items-center justify-between px-5 bg-transparent" aria-hidden="true">
        <span class="text-[12px] font-semibold" style="color:var(--color-text-primary)">9:41</span>
        <div class="flex items-center gap-1">
          <i data-lucide="signal" class="w-3.5 h-3.5" style="color:var(--color-text-primary)"></i>
          <i data-lucide="wifi" class="w-3.5 h-3.5" style="color:var(--color-text-primary)"></i>
          <i data-lucide="battery-full" class="w-4 h-3.5" style="color:var(--color-text-primary)"></i>
        </div>
      </div>

      <!-- 2. Top Navigation Bar -->
      <header class="sticky top-0 z-30 border-b" style="border-color:var(--color-border-default);background:rgba(248,250,252,0.95);backdrop-filter:blur(8px)">
        <div class="flex h-11 items-center px-4">
          <div class="flex w-[88px] items-center justify-start">
            <button data-dom-id="back-home" class="inline-flex h-8 w-8 items-center justify-center rounded-lg border" style="border-color:var(--color-border-default);background:var(--color-bg-surface)" aria-label="返回首页">
              <i data-lucide="chevron-left" class="h-4 w-4" style="color:var(--color-text-primary)"></i>
            </button>
          </div>
          <div class="min-w-0 flex-1 text-center font-semibold tracking-[-0.02em]" style="font-size:var(--text-title-lg);color:var(--color-text-primary)">推荐结果</div>
          <div class="flex h-8 w-[88px] items-center justify-center rounded-full border" style="border-color:var(--color-border-default);background:rgba(255,255,255,0.9)" aria-label="小程序菜单">
            <button class="flex h-full flex-1 items-center justify-center" aria-label="更多">
              <i data-lucide="more-horizontal" class="h-4 w-4" style="color:var(--color-text-primary)"></i>
            </button>
            <span class="h-4 w-px" style="background:var(--color-border-default)" aria-hidden="true"></span>
            <button class="flex h-full flex-1 items-center justify-center" aria-label="关闭">
              <i data-lucide="x" class="h-4 w-4" style="color:var(--color-text-primary)"></i>
            </button>
          </div>
        </div>
      </header>

      <!-- 3. Chat Area -->
      <div class="px-4 pt-3 pb-4 flex flex-col gap-3">

        <!-- AI Bubble: Opening Recommendation -->
        <div class="flex items-start gap-2">
          <!-- AI Avatar -->
          <div class="shrink-0 w-8 h-8 rounded-full flex items-center justify-center" style="background:var(--color-ai-bubble)">
            <i data-lucide="sparkles" class="w-4 h-4" style="color:var(--color-ai-bubble-text)"></i>
          </div>
          <div class="flex-1 min-w-0 pl-1">
            <span class="block text-[11px] mb-1 font-medium" style="color:var(--color-text-tertiary)">AI 助手</span>
            <div class="inline-block rounded-2xl rounded-tl-sm px-3.5 py-2.5" style="background:var(--color-ai-bubble);max-width:calc(100% - 4px)">
              <p class="text-[14px] leading-relaxed" style="color:var(--color-ai-bubble-text)">为你找到了 3 位优质卖家，均支持周末交付：</p>
            </div>
          </div>
        </div>

        <!-- Skill Card 1 (indented within AI response flow) -->
        <div class="ml-10">
          <a data-dom-id="recommend-card-1" href="./order-confirm.html" class="block rounded-lg p-3" style="background:var(--color-bg-surface);box-shadow:var(--shadow-card)">
            <!-- Top row: avatar + name + badges -->
            <div class="flex items-center gap-2 mb-2">
              <div class="shrink-0 w-8 h-8 rounded-full flex items-center justify-center" style="background:var(--color-brand-primary)">
                <span class="text-[12px] font-bold" style="color:var(--color-text-inverse)">林</span>
              </div>
              <div class="flex-1 min-w-0 flex items-center gap-1.5 flex-wrap">
                <span class="text-[14px] font-semibold truncate" style="color:var(--color-text-primary)">小林Design</span>
                <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-semibold whitespace-nowrap" style="background:rgba(34,197,94,0.1);color:var(--state-success)">信用96</span>
                <span class="text-[11px] whitespace-nowrap" style="color:var(--color-text-tertiary)">256单</span>
              </div>
            </div>
            <!-- Skill name -->
            <p class="text-[14px] font-medium mb-1.5 truncate" style="color:var(--color-text-primary)">PPT美化 | 商务简约风</p>
            <!-- Price -->
            <span class="text-[16px] font-bold" style="color:var(--color-brand-primary)">¥128起</span>
            <!-- Tags -->
            <div class="flex flex-nowrap overflow-x-auto gap-1.5 mt-2 no-scrollbar">
              <span class="shrink-0 px-2 py-0.5 rounded text-[11px] whitespace-nowrap" style="background:var(--color-brand-primary-light);color:var(--color-brand-primary)">#PPT</span>
              <span class="shrink-0 px-2 py-0.5 rounded text-[11px] whitespace-nowrap" style="background:var(--color-brand-primary-light);color:var(--color-brand-primary)">#商务</span>
              <span class="shrink-0 px-2 py-0.5 rounded text-[11px] whitespace-nowrap" style="background:var(--color-brand-primary-light);color:var(--color-brand-primary)">#路演</span>
            </div>
            <!-- Action link -->
            <p class="text-[13px] font-medium mt-2.5" style="color:var(--color-brand-primary)">查看详情 <span style="color:var(--color-brand-primary)">&rarr;</span></p>
          </a>
        </div>

        <!-- Skill Card 2 -->
        <div class="ml-10">
          <a data-dom-id="recommend-card-2" href="./order-confirm.html" class="block rounded-lg p-3" style="background:var(--color-bg-surface);box-shadow:var(--shadow-card)">
            <div class="flex items-center gap-2 mb-2">
              <div class="shrink-0 w-8 h-8 rounded-full flex items-center justify-center" style="background:var(--color-brand-gradient-end)">
                <span class="text-[12px] font-bold" style="color:var(--color-text-inverse)">赵</span>
              </div>
              <div class="flex-1 min-w-0 flex items-center gap-1.5 flex-wrap">
                <span class="text-[14px] font-semibold truncate" style="color:var(--color-text-primary)">赵PPT工坊</span>
                <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-semibold whitespace-nowrap" style="background:rgba(34,197,94,0.1);color:var(--state-success)">信用91</span>
                <span class="text-[11px] whitespace-nowrap" style="color:var(--color-text-tertiary)">89单</span>
              </div>
            </div>
            <p class="text-[14px] font-medium mb-1.5 truncate" style="color:var(--color-text-primary)">PPT美化 | 创意设计风</p>
            <span class="text-[16px] font-bold" style="color:var(--color-brand-primary)">¥98起</span>
            <div class="flex flex-nowrap overflow-x-auto gap-1.5 mt-2 no-scrollbar">
              <span class="shrink-0 px-2 py-0.5 rounded text-[11px] whitespace-nowrap" style="background:var(--color-brand-primary-light);color:var(--color-brand-primary)">#PPT</span>
              <span class="shrink-0 px-2 py-0.5 rounded text-[11px] whitespace-nowrap" style="background:var(--color-brand-primary-light);color:var(--color-brand-primary)">#创意</span>
              <span class="shrink-0 px-2 py-0.5 rounded text-[11px] whitespace-nowrap" style="background:var(--color-brand-primary-light);color:var(--color-brand-primary)">#设计</span>
            </div>
            <p class="text-[13px] font-medium mt-2.5" style="color:var(--color-brand-primary)">查看详情 <span style="color:var(--color-brand-primary)">&rarr;</span></p>
          </a>
        </div>

        <!-- Skill Card 3 -->
        <div class="ml-10">
          <a data-dom-id="recommend-card-3" href="./order-confirm.html" class="block rounded-lg p-3" style="background:var(--color-bg-surface);box-shadow:var(--shadow-card)">
            <div class="flex items-center gap-2 mb-2">
              <div class="shrink-0 w-8 h-8 rounded-full flex items-center justify-center" style="background:#3B82F6">
                <span class="text-[12px] font-bold" style="color:var(--color-text-inverse)">王</span>
              </div>
              <div class="flex-1 min-w-0 flex items-center gap-1.5 flex-wrap">
                <span class="text-[14px] font-semibold truncate" style="color:var(--color-text-primary)">演示大师Wang</span>
                <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-semibold whitespace-nowrap" style="background:rgba(34,197,94,0.1);color:var(--state-success)">信用94</span>
                <span class="text-[11px] whitespace-nowrap" style="color:var(--color-text-tertiary)">134单</span>
              </div>
            </div>
            <p class="text-[14px] font-medium mb-1.5 truncate" style="color:var(--color-text-primary)">PPT美化 | 数据可视化</p>
            <span class="text-[16px] font-bold" style="color:var(--color-brand-primary)">¥158起</span>
            <div class="flex flex-nowrap overflow-x-auto gap-1.5 mt-2 no-scrollbar">
              <span class="shrink-0 px-2 py-0.5 rounded text-[11px] whitespace-nowrap" style="background:var(--color-brand-primary-light);color:var(--color-brand-primary)">#PPT</span>
              <span class="shrink-0 px-2 py-0.5 rounded text-[11px] whitespace-nowrap" style="background:var(--color-brand-primary-light);color:var(--color-brand-primary)">#数据</span>
              <span class="shrink-0 px-2 py-0.5 rounded text-[11px] whitespace-nowrap" style="background:var(--color-brand-primary-light);color:var(--color-brand-primary)">#图表</span>
            </div>
            <p class="text-[13px] font-medium mt-2.5" style="color:var(--color-brand-primary)">查看详情 <span style="color:var(--color-brand-primary)">&rarr;</span></p>
          </a>
        </div>

        <!-- AI Follow-up Bubble -->
        <div class="flex items-start gap-2">
          <div class="shrink-0 w-8 h-8 rounded-full flex items-center justify-center" style="background:var(--color-ai-bubble)">
            <i data-lucide="sparkles" class="w-4 h-4" style="color:var(--color-ai-bubble-text)"></i>
          </div>
          <div class="flex-1 min-w-0 pl-1">
            <div class="inline-block rounded-2xl rounded-tl-sm px-3.5 py-2.5" style="background:var(--color-ai-bubble);max-width:calc(100% - 4px)">
              <p class="text-[14px] leading-relaxed" style="color:var(--color-ai-bubble-text)">你可以直接点击卡片查看详情下单，或者告诉我更多偏好，我帮你进一步筛选。</p>
            </div>
          </div>
        </div>

      </div>

      <!-- 4. Bottom Input Area -->
      <div class="fixed bottom-0 left-0 right-0 z-40 border-t" style="max-width:375px;margin:0 auto;background:var(--color-bg-surface);border-color:var(--color-border-default)">
        <!-- Quick tags -->
        <div class="flex gap-2 overflow-x-auto px-4 pt-2.5 pb-1.5 no-scrollbar">
          <span class="shrink-0 px-2.5 py-1 rounded-lg text-[12px] font-medium whitespace-nowrap" style="background:var(--color-brand-primary-light);color:var(--color-brand-primary)">便宜一点的</span>
          <span class="shrink-0 px-2.5 py-1 rounded-lg text-[12px] font-medium whitespace-nowrap" style="background:var(--color-brand-primary-light);color:var(--color-brand-primary)">评分最高的</span>
          <span class="shrink-0 px-2.5 py-1 rounded-lg text-[12px] font-medium whitespace-nowrap" style="background:var(--color-brand-primary-light);color:var(--color-brand-primary)">支持加急的</span>
          <span class="shrink-0 px-2.5 py-1 rounded-lg text-[12px] font-medium whitespace-nowrap" style="background:var(--color-brand-primary-light);color:var(--color-brand-primary)">有案例展示</span>
        </div>
        <!-- Text input + mic -->
        <div class="flex items-center gap-2 px-4 pb-2.5 pt-1">
          <div class="flex-1 flex items-center rounded-lg px-3 py-2" style="background:var(--color-bg-chat);border:1px solid var(--color-border-default)">
            <input type="text" placeholder="输入你的需求..." class="flex-1 bg-transparent outline-none text-[14px]" style="color:var(--color-text-primary)">
          </div>
          <button class="shrink-0 w-9 h-9 rounded-full flex items-center justify-center" style="background:var(--color-brand-primary)" aria-label="语音输入">
            <i data-lucide="mic" class="w-4 h-4" style="color:var(--color-text-inverse)"></i>
          </button>
        </div>
        <!-- Safe area -->
        <div class="h-[env(safe-area-inset-bottom,0px)]" style="background:var(--color-bg-surface)"></div>
      </div>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
