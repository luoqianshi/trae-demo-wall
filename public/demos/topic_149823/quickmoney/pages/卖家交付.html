<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交付订单 - 闪薪</title>
    <style id="theme-vars">
:root {
  --color-brand-primary: #6366F1;
  --color-brand-primary-hover: #4F46E5;
  --color-brand-primary-light: #EEF2FF;
  --color-brand-primary-subtle: #F5F3FF;
  --color-brand-gradient-start: #6366F1;
  --color-brand-gradient-end: #8B5CF6;
  --color-bg-page: #F8FAFC;
  --color-bg-surface: #FFFFFF;
  --color-bg-elevated: #FFFFFF;
  --color-bg-chat: #F1F5F9;
  --color-text-primary: #0F172A;
  --color-text-secondary: #64748B;
  --color-text-tertiary: #94A3B8;
  --color-text-inverse: #FFFFFF;
  --color-border-default: #E2E8F0;
  --color-border-light: #F1F5F9;
  --color-ai-bubble: linear-gradient(135deg, #6366F1, #8B5CF6);
  --color-user-bubble: #FFFFFF;
  --color-ai-bubble-text: #FFFFFF;
  --color-user-bubble-text: #0F172A;
  --state-success: #22C55E;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-2xl: 20px;
  --radius-full: 9999px;
  --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.04);
  --shadow-elevated: 0 4px 12px rgba(15, 23, 42, 0.05);
  --shadow-floating: 0 8px 24px rgba(15, 23, 42, 0.08);
  --shadow-glow: 0 0 20px rgba(99, 102, 241, 0.15);
  --font-display: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-body: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
  --text-display-lg: 28px; --text-display-md: 24px; --text-display-sm: 20px;
  --text-title-lg: 18px; --text-title-md: 16px; --text-title-sm: 14px;
  --text-body-lg: 16px; --text-body-md: 14px; --text-body-sm: 12px; --text-caption: 11px;
  --leading-display: 1.3; --leading-title: 1.4; --leading-body: 1.6; --leading-tight: 1.2;
  --weight-bold: 700; --weight-semibold: 600; --weight-medium: 500; --weight-regular: 400;
  --space-xs: 4px; --space-sm: 8px; --space-md: 12px; --space-lg: 16px; --space-xl: 20px; --space-2xl: 24px; --space-3xl: 32px; --space-4xl: 40px;
}
</style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-brand-primary);
  }
  @layer base {
    body { background: var(--color-bg-page); color: var(--color-text-primary); }
  }
    </style>
    <style>
      html {
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        font-family: var(--font-body);
        color: var(--color-text-primary);
        background: var(--color-bg-page);
        line-height: var(--leading-body);
        margin: 0;
        padding: 0;
        max-width: 375px;
        margin: 0 auto;
        min-height: 100vh;
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      .upload-zone {
        border: 2px dashed var(--color-border-default);
        border-radius: var(--radius-xl);
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        transition: border-color 0.2s, background 0.2s;
      }
      .upload-zone:hover,
      .upload-zone:active {
        border-color: var(--color-brand-primary);
        background: var(--color-brand-primary-subtle);
      }

      .file-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: var(--radius-lg);
        background: var(--color-bg-page);
        margin-top: 10px;
      }

      .file-item .file-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border-radius: var(--radius-md);
        background: var(--color-brand-primary-light);
        flex-shrink: 0;
      }

      .note-textarea {
        width: 100%;
        min-height: 100px;
        padding: 12px;
        border: 1px solid var(--color-border-default);
        border-radius: var(--radius-lg);
        background: var(--color-bg-page);
        font-family: var(--font-body);
        font-size: 13px;
        color: var(--color-text-primary);
        line-height: 1.6;
        resize: none;
        outline: none;
        box-sizing: border-box;
        transition: border-color 0.2s;
      }
      .note-textarea:focus {
        border-color: var(--color-brand-primary);
      }
      .note-textarea::placeholder {
        color: var(--color-text-tertiary);
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main style="padding-bottom: calc(80px + env(safe-area-inset-bottom));">

      <!-- Status bar spacer -->
      <div class="h-11 bg-transparent"></div>

      <!-- Navigation bar -->
      <header class="sticky top-0 z-30 border-b" style="border-color: var(--color-border-light); background: rgba(255,255,255,0.95); backdrop-filter: blur(12px);">
        <div class="flex h-11 items-center px-4">
          <div class="flex w-[88px] items-center justify-start">
            <button data-dom-id="back-seller-orders" class="inline-flex h-8 w-8 items-center justify-center rounded-lg border" style="border-color: var(--color-border-default); background: var(--color-bg-surface);" aria-label="返回">
              <i data-lucide="chevron-left" class="h-4 w-4" style="color: var(--color-text-primary);"></i>
            </button>
          </div>
          <div class="min-w-0 flex-1 text-center text-[16px] font-semibold tracking-[-0.02em]" style="color: var(--color-text-primary);">交付订单</div>
          <div class="flex h-8 w-[88px] items-center justify-center rounded-full border" style="border-color: var(--color-border-default); background: rgba(255,255,255,0.9);" aria-label="小程序菜单">
            <button class="flex h-full flex-1 items-center justify-center" aria-label="更多">
              <i data-lucide="more-horizontal" class="h-4 w-4" style="color: var(--color-text-primary);"></i>
            </button>
            <span class="h-4 w-px" style="background: var(--color-border-default);" aria-hidden="true"></span>
            <button class="flex h-full flex-1 items-center justify-center" aria-label="关闭">
              <i data-lucide="x" class="h-4 w-4" style="color: var(--color-text-primary);"></i>
            </button>
          </div>
        </div>
      </header>

      <!-- Page content -->
      <div class="px-4 pt-4 pb-4 space-y-3" style="background: var(--color-bg-page);">

        <!-- Order info section -->
        <section class="rounded-xl p-4" style="background: var(--color-bg-surface); box-shadow: var(--shadow-card);">
          <div class="flex items-center gap-2 mb-3">
            <div class="flex h-7 w-7 items-center justify-center rounded-lg" style="background: var(--color-brand-primary-light);">
              <i data-lucide="file-text" class="h-3.5 w-3.5" style="color: var(--color-brand-primary);"></i>
            </div>
            <h2 class="text-[15px] font-semibold" style="color: var(--color-text-primary);">订单信息</h2>
          </div>

          <!-- Skill row -->
          <div class="flex items-center justify-between">
            <span class="text-[13px]" style="color: var(--color-text-secondary);">技能</span>
            <span class="truncate text-[13px] font-medium ml-4 text-right" style="color: var(--color-text-primary);">PPT美化 — 标准版</span>
          </div>
          <div class="my-3 h-px" style="background: var(--color-border-light);"></div>

          <!-- Buyer row -->
          <div class="flex items-center justify-between">
            <span class="text-[13px]" style="color: var(--color-text-secondary);">买家</span>
            <span class="text-[13px] font-medium" style="color: var(--color-text-primary);">张三</span>
          </div>
          <div class="my-3 h-px" style="background: var(--color-border-light);"></div>

          <!-- Amount row -->
          <div class="flex items-center justify-between">
            <span class="text-[13px]" style="color: var(--color-text-secondary);">订单金额</span>
            <span class="text-[15px] font-semibold" style="color: var(--color-text-primary);">¥128.00</span>
          </div>
          <div class="my-3 h-px" style="background: var(--color-border-light);"></div>

          <!-- Seller income row -->
          <div class="flex items-center justify-between">
            <span class="text-[13px]" style="color: var(--color-text-secondary);">卖家收入</span>
            <div class="flex items-center gap-2">
              <span class="text-[15px] font-semibold" style="color: var(--color-brand-primary);">¥121.60</span>
              <span class="inline-flex items-center rounded px-1.5 py-0.5 text-[11px] font-medium" style="background: var(--color-brand-primary-light); color: var(--color-brand-primary);">已扣除5%服务费</span>
            </div>
          </div>
          <div class="my-3 h-px" style="background: var(--color-border-light);"></div>

          <!-- Deadline row -->
          <div class="flex items-center justify-between">
            <span class="text-[13px]" style="color: var(--color-text-secondary);">交付截止</span>
            <div class="flex items-center gap-1.5">
              <i data-lucide="clock" class="h-3.5 w-3.5" style="color: var(--state-warning);"></i>
              <span class="text-[13px] font-medium" style="color: var(--state-warning);">07-03 14:24</span>
            </div>
          </div>
        </section>

        <!-- Upload deliverables section -->
        <section class="rounded-xl p-4" style="background: var(--color-bg-surface); box-shadow: var(--shadow-card);">
          <div class="flex items-center gap-2 mb-3">
            <div class="flex h-7 w-7 items-center justify-center rounded-lg" style="background: var(--color-brand-primary-light);">
              <i data-lucide="upload-cloud" class="h-3.5 w-3.5" style="color: var(--color-brand-primary);"></i>
            </div>
            <h2 class="text-[15px] font-semibold" style="color: var(--color-text-primary);">上传交付物</h2>
          </div>

          <!-- Upload area -->
          <div class="upload-zone">
            <div class="flex h-10 w-10 items-center justify-center rounded-full" style="background: var(--color-brand-primary-light);">
              <i data-lucide="cloud-upload" class="h-5 w-5" style="color: var(--color-brand-primary);"></i>
            </div>
            <span class="text-[14px] font-medium" style="color: var(--color-text-secondary);">点击或拖拽上传文件</span>
          </div>

          <!-- Upload hint -->
          <p class="mt-2 text-center text-[12px]" style="color: var(--color-text-tertiary);">支持 pptx, pdf, zip 等格式，单个文件不超过50MB</p>

          <!-- Uploaded file mock -->
          <div class="file-item">
            <div class="file-icon">
              <i data-lucide="file-text" class="h-4 w-4" style="color: var(--color-brand-primary);"></i>
            </div>
            <div class="flex-1 min-w-0">
              <p class="truncate text-[13px] font-medium" style="color: var(--color-text-primary);">Q3季度汇报_PPT.pptx</p>
              <p class="text-[12px] mt-0.5" style="color: var(--color-text-tertiary);">2.3MB</p>
            </div>
            <button class="flex h-7 w-7 items-center justify-center rounded-lg" style="background: var(--color-bg-surface);" aria-label="删除文件">
              <i data-lucide="x" class="h-3.5 w-3.5" style="color: var(--color-text-tertiary);"></i>
            </button>
          </div>
        </section>

        <!-- Seller note section -->
        <section class="rounded-xl p-4" style="background: var(--color-bg-surface); box-shadow: var(--shadow-card);">
          <div class="flex items-center gap-2 mb-3">
            <div class="flex h-7 w-7 items-center justify-center rounded-lg" style="background: var(--color-brand-primary-light);">
              <i data-lucide="message-square-text" class="h-3.5 w-3.5" style="color: var(--color-brand-primary);"></i>
            </div>
            <h2 class="text-[15px] font-semibold" style="color: var(--color-text-primary);">交付说明</h2>
          </div>

          <!-- Textarea -->
          <textarea class="note-textarea" placeholder="向买家说明交付内容...">已完成10页PPT制作，按照商务简约风格设计</textarea>
        </section>

      </div>

      <!-- Bottom action bar (fixed) -->
      <footer class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full z-40 border-t" style="max-width: 375px; border-color: var(--color-border-light); background: var(--color-bg-surface); padding-bottom: env(safe-area-inset-bottom);">
        <div class="flex items-center gap-3 px-4 py-3">
          <button data-dom-id="btn-submit-deliver" class="flex-1 flex items-center justify-center h-11 rounded-full text-[15px] font-semibold text-white" style="background: linear-gradient(135deg, var(--color-brand-gradient-start) 0%, var(--color-brand-gradient-end) 100%); box-shadow: var(--shadow-glow);">
            提交交付
          </button>
        </div>
      </footer>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
