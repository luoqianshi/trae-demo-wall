<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 - 闪薪</title>
    <style id="theme-vars">
/* 闪薪 - Brand CSS */
/* Tech-trust blue-purple gradient palette, clean minimal UI */

:root {
  /* === Color System === */
  --color-brand-primary: #6366F1;
  --color-brand-primary-hover: #4F46E5;
  --color-brand-primary-light: #EEF2FF;
  --color-brand-primary-subtle: #F5F3FF;
  --color-brand-gradient-start: #6366F1;
  --color-brand-gradient-end: #8B5CF6;

  --color-bg-page: #F8FAFC;
  --color-bg-surface: #FFFFFF;
  --color-bg-elevated: #FFFFFF;
  --color-bg-chat: #F1F5F9;

  --color-text-primary: #0F172A;
  --color-text-secondary: #64748B;
  --color-text-tertiary: #94A3B8;
  --color-text-inverse: #FFFFFF;

  --color-border-default: #E2E8F0;
  --color-border-light: #F1F5F9;

  --color-ai-bubble: linear-gradient(135deg, #6366F1, #8B5CF6);
  --color-user-bubble: #FFFFFF;
  --color-ai-bubble-text: #FFFFFF;
  --color-user-bubble-text: #0F172A;

  --state-success: #22C55E;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* === Radius Scale === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-2xl: 20px;
  --radius-full: 9999px;

  /* === Shadow System (static <= 0.05 alpha, floating only for modals) === */
  --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.04);
  --shadow-elevated: 0 4px 12px rgba(15, 23, 42, 0.05);
  --shadow-floating: 0 8px 24px rgba(15, 23, 42, 0.08);
  --shadow-glow: 0 0 20px rgba(99, 102, 241, 0.15);

  /* === Typography === */
  --font-display: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-body: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;

  --text-display-lg: 28px;
  --text-display-md: 24px;
  --text-display-sm: 20px;

  --text-title-lg: 18px;
  --text-title-md: 16px;
  --text-title-sm: 14px;

  --text-body-lg: 16px;
  --text-body-md: 14px;
  --text-body-sm: 12px;

  --text-caption: 11px;

  --leading-display: 1.3;
  --leading-title: 1.4;
  --leading-body: 1.6;
  --leading-tight: 1.2;

  --weight-bold: 700;
  --weight-semibold: 600;
  --weight-medium: 500;
  --weight-regular: 400;

  /* === Spacing === */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;
  --space-4xl: 40px;
}

/* Mini program viewport simulation */
html {
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  font-family: var(--font-body);
  color: var(--color-text-primary);
  background: var(--color-bg-page);
  line-height: var(--leading-body);
  margin: 0;
  padding: 0;
  max-width: 375px;
  margin: 0 auto;
  min-height: 100vh;
}

.page-container {
  padding-bottom: calc(60px + env(safe-area-inset-bottom));
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="page-container">

      <!-- 1. Status bar spacer -->
      <div class="h-11"></div>

      <!-- 2. WeChat navigation bar (root tab page — centered title, no back button) -->
      <header class="sticky top-0 z-30 flex h-11 items-center px-4" style="background: linear-gradient(135deg, var(--color-brand-gradient-start), var(--color-brand-gradient-end));">
        <div class="w-[88px]"></div>
        <div class="min-w-0 flex-1 text-center text-[16px] font-semibold tracking-[-0.02em]" style="color: var(--color-text-inverse);">我的</div>
        <div class="flex h-8 w-[88px] items-center justify-center rounded-full border" style="border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.15); color: var(--color-text-inverse);">
          <button class="flex h-full flex-1 items-center justify-center" aria-label="更多">
            <i data-lucide="more-horizontal" class="h-4 w-4"></i>
          </button>
          <span class="h-4 w-px" style="background: rgba(255,255,255,0.3);" aria-hidden="true"></span>
          <button class="flex h-full flex-1 items-center justify-center" aria-label="关闭">
            <i data-lucide="x" class="h-4 w-4"></i>
          </button>
        </div>
      </header>

      <!-- 3. Profile Header — blue-purple gradient -->
      <section class="relative overflow-hidden" style="background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%); padding-top: 32px;">
        <!-- Decorative circles for depth -->
        <div class="absolute -top-12 -right-12 h-40 w-40 rounded-full opacity-20" style="background: rgba(255,255,255,0.15);"></div>
        <div class="absolute bottom-4 -left-8 h-24 w-24 rounded-full opacity-10" style="background: rgba(255,255,255,0.2);"></div>

        <div class="relative px-5 pb-5">
          <!-- Avatar + Name -->
          <div class="flex items-center gap-3.5">
            <div class="flex h-16 w-16 shrink-0 items-center justify-center rounded-full text-[22px] font-bold" style="background: rgba(255,255,255,0.2); color: var(--color-text-inverse); box-shadow: 0 0 0 3px rgba(255,255,255,0.1);">
              张
            </div>
            <div class="min-w-0 flex-1">
              <span class="block truncate text-[18px] font-bold" style="color: var(--color-text-inverse);">张小明</span>
              <span class="inline-flex shrink-0 items-center gap-1 whitespace-nowrap rounded-lg px-2 py-0.5 text-[12px] font-semibold mt-1" style="background: var(--state-success); color: var(--color-text-inverse);">
                <i data-lucide="shield-check" class="h-3 w-3"></i>
                信用分 92
              </span>
            </div>
          </div>

          <!-- Stats row -->
          <div class="mt-5 flex items-stretch rounded-lg" style="background: rgba(255,255,255,0.12);">
            <div class="flex flex-1 flex-col items-center py-3">
              <span class="text-[20px] font-bold whitespace-nowrap" style="color: var(--color-text-inverse);">3</span>
              <span class="mt-0.5 text-[11px]" style="color: rgba(255,255,255,0.7);">在售技能</span>
            </div>
            <div class="w-px self-stretch" style="background: rgba(255,255,255,0.15);"></div>
            <div class="flex flex-1 flex-col items-center py-3">
              <span class="text-[20px] font-bold whitespace-nowrap" style="color: var(--color-text-inverse);">47</span>
              <span class="mt-0.5 text-[11px]" style="color: rgba(255,255,255,0.7);">已完成</span>
            </div>
            <div class="w-px self-stretch" style="background: rgba(255,255,255,0.15);"></div>
            <div class="flex flex-1 flex-col items-center py-3">
              <span class="text-[20px] font-bold whitespace-nowrap" style="color: var(--color-text-inverse);">¥3,260</span>
              <span class="mt-0.5 text-[11px]" style="color: rgba(255,255,255,0.7);">收入</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 4. Wallet Card -->
      <section class="mx-4 -mt-1 rounded-xl" style="background: var(--color-bg-surface); box-shadow: var(--shadow-card);">
        <div class="flex items-center justify-between px-4 pt-4 pb-1">
          <span class="text-[15px] font-semibold" style="color: var(--color-text-primary);">我的钱包</span>
          <button class="flex h-7 w-7 items-center justify-center rounded-md" style="color: var(--color-text-tertiary);" aria-label="切换余额显示">
            <i data-lucide="eye" class="h-4 w-4"></i>
          </button>
        </div>
        <div class="px-4 pb-3">
          <span class="text-[28px] font-bold whitespace-nowrap" style="color: var(--color-text-primary); letter-spacing: -0.5px;">¥ 856.00</span>
        </div>
        <div class="flex gap-2.5 px-4 pb-4">
          <button class="flex flex-1 items-center justify-center rounded-lg py-2.5 text-[14px] font-medium" style="background: var(--color-brand-primary); color: var(--color-text-inverse);">提现</button>
          <button class="flex flex-1 items-center justify-center rounded-lg py-2.5 text-[14px] font-medium" style="border: 1px solid var(--color-brand-primary); background: transparent; color: var(--color-brand-primary);">充值</button>
        </div>
      </section>

      <!-- 5. Menu List -->
      <section class="mx-4 mt-4 rounded-xl overflow-hidden" style="background: var(--color-bg-surface); box-shadow: var(--shadow-card);">
        <!-- 我发布的技能 -->
        <a data-dom-id="menu-my-skills" class="flex items-center gap-3 px-4 py-3.5 active:opacity-70" style="border-bottom: 1px solid var(--color-border-light);" href="./market.html">
          <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg" style="background: var(--color-brand-primary-light);">
            <i data-lucide="package" class="h-4 w-4" style="color: var(--color-brand-primary);"></i>
          </div>
          <span class="min-w-0 flex-1 truncate text-[14px]" style="color: var(--color-text-primary);">我发布的技能</span>
          <i data-lucide="chevron-right" class="h-4 w-4 shrink-0" style="color: var(--color-text-tertiary);"></i>
        </a>
        <!-- 我的订单 -->
        <a data-dom-id="menu-my-orders" class="flex items-center gap-3 px-4 py-3.5 active:opacity-70" style="border-bottom: 1px solid var(--color-border-light);" href="./order-list.html">
          <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg" style="background: var(--color-brand-primary-light);">
            <i data-lucide="clipboard-list" class="h-4 w-4" style="color: var(--color-brand-primary);"></i>
          </div>
          <span class="min-w-0 flex-1 truncate text-[14px]" style="color: var(--color-text-primary);">我的订单</span>
          <i data-lucide="chevron-right" class="h-4 w-4 shrink-0" style="color: var(--color-text-tertiary);"></i>
        </a>
        <!-- 信用中心 -->
        <a data-dom-id="menu-credit" class="flex items-center gap-3 px-4 py-3.5 active:opacity-70" style="border-bottom: 1px solid var(--color-border-light);" href="./credit-center.html">
          <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg" style="background: var(--color-brand-primary-light);">
            <i data-lucide="shield" class="h-4 w-4" style="color: var(--color-brand-primary);"></i>
          </div>
          <span class="min-w-0 flex-1 truncate text-[14px]" style="color: var(--color-text-primary);">信用中心</span>
          <i data-lucide="chevron-right" class="h-4 w-4 shrink-0" style="color: var(--color-text-tertiary);"></i>
        </a>
        <!-- 邀请好友 -->
        <a class="flex items-center gap-3 px-4 py-3.5 active:opacity-70" style="border-bottom: 1px solid var(--color-border-light);" href="javascript:void(0)">
          <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg" style="background: var(--color-brand-primary-light);">
            <i data-lucide="user-plus" class="h-4 w-4" style="color: var(--color-brand-primary);"></i>
          </div>
          <span class="min-w-0 flex-1 truncate text-[14px]" style="color: var(--color-text-primary);">邀请好友</span>
          <i data-lucide="chevron-right" class="h-4 w-4 shrink-0" style="color: var(--color-text-tertiary);"></i>
        </a>
        <!-- 帮助与反馈 -->
        <a class="flex items-center gap-3 px-4 py-3.5 active:opacity-70" style="border-bottom: 1px solid var(--color-border-light);" href="javascript:void(0)">
          <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg" style="background: var(--color-brand-primary-light);">
            <i data-lucide="message-circle" class="h-4 w-4" style="color: var(--color-brand-primary);"></i>
          </div>
          <span class="min-w-0 flex-1 truncate text-[14px]" style="color: var(--color-text-primary);">帮助与反馈</span>
          <i data-lucide="chevron-right" class="h-4 w-4 shrink-0" style="color: var(--color-text-tertiary);"></i>
        </a>
        <!-- 设置 -->
        <a class="flex items-center gap-3 px-4 py-3.5 active:opacity-70" href="javascript:void(0)">
          <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg" style="background: var(--color-brand-primary-light);">
            <i data-lucide="settings" class="h-4 w-4" style="color: var(--color-brand-primary);"></i>
          </div>
          <span class="min-w-0 flex-1 truncate text-[14px]" style="color: var(--color-text-primary);">设置</span>
          <i data-lucide="chevron-right" class="h-4 w-4 shrink-0" style="color: var(--color-text-tertiary);"></i>
        </a>
      </section>

      <!-- Bottom spacing for TabBar -->
      <div class="h-4"></div>

      <!-- 6. Fixed Bottom Tab Bar -->
      <nav class="fixed bottom-0 left-1/2 z-40 flex h-[50px] -translate-x-1/2 items-center justify-around border-t" style="width:375px; max-width:100vw; border-color:var(--color-border-default); background:var(--color-bg-surface)">
        <!-- 对话 -->
        <a data-dom-id="tab-chat" href="./home.html" class="flex flex-col items-center gap-0.5 py-1 min-w-0">
          <i data-lucide="message-circle" class="h-5 w-5" style="color:var(--color-text-tertiary)"></i>
          <span class="text-[10px] font-medium" style="color:var(--color-text-tertiary)">对话</span>
        </a>
        <!-- 发现 -->
        <a data-dom-id="tab-discover" href="./market.html" class="flex flex-col items-center gap-0.5 py-1 min-w-0">
          <i data-lucide="compass" class="h-5 w-5" style="color:var(--color-text-tertiary)"></i>
          <span class="text-[10px] font-medium" style="color:var(--color-text-tertiary)">发现</span>
        </a>
        <!-- 发布 (+) -->
        <a data-dom-id="tab-publish" href="./publish-skill.html" class="flex flex-col items-center gap-0.5 py-1 min-w-0">
          <div class="flex h-10 w-10 -mt-4 items-center justify-center rounded-full" style="background:linear-gradient(135deg,var(--color-brand-gradient-start),var(--color-brand-gradient-end)); box-shadow:0 4px 12px rgba(99,102,241,0.35)">
            <i data-lucide="plus" class="h-5 w-5" style="color:#FFFFFF"></i>
          </div>
          <span class="text-[10px] -mt-0.5" style="color:var(--color-text-tertiary)">发布</span>
        </a>
        <!-- 我的 (active) -->
        <a data-dom-id="tab-profile" class="flex flex-col items-center gap-0.5 py-1 min-w-0" href="./profile.html">
          <i data-lucide="user" class="h-5 w-5" style="color:var(--color-brand-primary)"></i>
          <span class="text-[10px] font-semibold" style="color:var(--color-brand-primary)">我的</span>
        </a>
      </nav>
      <!-- Safe area bottom -->
      <div class="h-[env(safe-area-inset-bottom,34px)]"></div>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
