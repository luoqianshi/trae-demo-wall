<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布技能 - 闪薪</title>
    <style id="theme-vars">
/* 闪薪 - Brand CSS */
/* Tech-trust blue-purple gradient palette, clean minimal UI */

:root {
  /* === Color System === */
  --color-brand-primary: #6366F1;
  --color-brand-primary-hover: #4F46E5;
  --color-brand-primary-light: #EEF2FF;
  --color-brand-primary-subtle: #F5F3FF;
  --color-brand-gradient-start: #6366F1;
  --color-brand-gradient-end: #8B5CF6;

  --color-bg-page: #F8FAFC;
  --color-bg-surface: #FFFFFF;
  --color-bg-elevated: #FFFFFF;
  --color-bg-chat: #F1F5F9;

  --color-text-primary: #0F172A;
  --color-text-secondary: #64748B;
  --color-text-tertiary: #94A3B8;
  --color-text-inverse: #FFFFFF;

  --color-border-default: #E2E8F0;
  --color-border-light: #F1F5F9;

  --color-ai-bubble: linear-gradient(135deg, #6366F1, #8B5CF6);
  --color-user-bubble: #FFFFFF;
  --color-ai-bubble-text: #FFFFFF;
  --color-user-bubble-text: #0F172A;

  --state-success: #22C55E;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* === Radius Scale === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-2xl: 20px;
  --radius-full: 9999px;

  /* === Shadow System (static <= 0.05 alpha, floating only for modals) === */
  --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.04);
  --shadow-elevated: 0 4px 12px rgba(15, 23, 42, 0.05);
  --shadow-floating: 0 8px 24px rgba(15, 23, 42, 0.08);
  --shadow-glow: 0 0 20px rgba(99, 102, 241, 0.15);

  /* === Typography === */
  --font-display: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-body: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;

  --text-display-lg: 28px;
  --text-display-md: 24px;
  --text-display-sm: 20px;

  --text-title-lg: 18px;
  --text-title-md: 16px;
  --text-title-sm: 14px;

  --text-body-lg: 16px;
  --text-body-md: 14px;
  --text-body-sm: 12px;

  --text-caption: 11px;

  --leading-display: 1.3;
  --leading-title: 1.4;
  --leading-body: 1.6;
  --leading-tight: 1.2;

  --weight-bold: 700;
  --weight-semibold: 600;
  --weight-medium: 500;
  --weight-regular: 400;

  /* === Spacing === */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;
  --space-4xl: 40px;
}

/* Mini program viewport simulation */
html {
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  font-family: var(--font-body);
  color: var(--color-text-primary);
  background: var(--color-bg-page);
  line-height: var(--leading-body);
  margin: 0;
  padding: 0;
  max-width: 375px;
  margin: 0 auto;
  min-height: 100vh;
}

.page-container {
  padding-bottom: calc(60px + env(safe-area-inset-bottom));
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>
        <!-- Status bar spacer -->
        <div class="h-11 bg-transparent"></div>

        <!-- WeChat navigation bar -->
        <header class="sticky top-0 z-30 border-b border-[var(--color-border-light)] bg-[var(--color-bg-page)]/95 backdrop-blur">
            <div class="flex h-11 items-center px-4">
                <div class="flex w-[88px] items-center justify-start">
                    <button data-dom-id="back-home-pub" class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-[var(--color-border-default)] bg-[var(--color-bg-surface)]" aria-label="返回">
                        <i data-lucide="chevron-left" class="h-4 w-4" style="color: var(--color-text-primary);"></i>
                    </button>
                </div>
                <div class="min-w-0 flex-1 text-center text-[16px] font-semibold tracking-[-0.02em]" style="color: var(--color-text-primary);">发布技能</div>
                <div class="flex h-8 w-[88px] items-center justify-center rounded-full border border-[var(--color-border-default)] bg-[var(--color-bg-surface)]/90" style="color: var(--color-text-secondary);" aria-label="小程序菜单">
                    <button class="flex h-full flex-1 items-center justify-center" aria-label="更多">
                        <i data-lucide="more-horizontal" class="h-4 w-4"></i>
                    </button>
                    <span class="h-4 w-px bg-[var(--color-border-default)]" aria-hidden="true"></span>
                    <button class="flex h-full flex-1 items-center justify-center" aria-label="关闭">
                        <i data-lucide="x" class="h-4 w-4"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Chat-style AI guided content -->
        <div class="space-y-4 px-3 pt-4 pb-[88px]">

            <!-- AI bubble 1: Greeting -->
            <div class="flex items-start gap-2">
                <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full" style="background: linear-gradient(135deg, #6366F1, #8B5CF6);">
                    <i data-lucide="sparkles" class="h-4 w-4" style="color: #FFFFFF;"></i>
                </div>
                <div class="max-w-[85%] rounded-2xl rounded-tl-sm px-3.5 py-2.5" style="background: linear-gradient(135deg, #6366F1, #8B5CF6); color: #FFFFFF;">
                    <p class="text-[14px] leading-relaxed">让我帮你快速上架技能！先简单描述一下你擅长什么吧，比如：'我会PS修图和Python爬虫'</p>
                </div>
            </div>

            <!-- User bubble 1: User input -->
            <div class="flex items-start justify-end gap-2">
                <div class="max-w-[80%] rounded-2xl rounded-tr-sm px-3.5 py-2.5" style="background: var(--color-user-bubble); color: var(--color-user-bubble-text); box-shadow: var(--shadow-card);">
                    <p class="text-[14px] leading-relaxed">我平时喜欢修图，也会一点Python写爬虫</p>
                </div>
            </div>

            <!-- AI bubble 2: Generated tags -->
            <div class="flex items-start gap-2">
                <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full" style="background: linear-gradient(135deg, #6366F1, #8B5CF6);">
                    <i data-lucide="sparkles" class="h-4 w-4" style="color: #FFFFFF;"></i>
                </div>
                <div class="max-w-[85%]">
                    <div class="rounded-2xl rounded-tl-sm px-3.5 py-2.5" style="background: linear-gradient(135deg, #6366F1, #8B5CF6); color: #FFFFFF;">
                        <p class="text-[14px] leading-relaxed">AI 已为你生成技能标签：</p>
                    </div>
                    <!-- Tags below the bubble -->
                    <div class="mt-2 rounded-xl p-3" style="background: var(--color-bg-surface); box-shadow: var(--shadow-card);">
                        <div class="flex flex-wrap gap-2">
                            <span class="inline-flex items-center rounded-lg px-2.5 py-1 text-[12px] font-medium whitespace-nowrap" style="background: var(--color-brand-primary-light); color: var(--color-brand-primary);">#图像处理</span>
                            <span class="inline-flex items-center rounded-lg px-2.5 py-1 text-[12px] font-medium whitespace-nowrap" style="background: var(--color-brand-primary-light); color: var(--color-brand-primary);">#PS精修</span>
                            <span class="inline-flex items-center rounded-lg px-2.5 py-1 text-[12px] font-medium whitespace-nowrap" style="background: var(--color-brand-primary-light); color: var(--color-brand-primary);">#Python</span>
                            <span class="inline-flex items-center rounded-lg px-2.5 py-1 text-[12px] font-medium whitespace-nowrap" style="background: var(--color-brand-primary-light); color: var(--color-brand-primary);">#数据采集</span>
                            <span class="inline-flex items-center rounded-lg px-2.5 py-1 text-[12px] font-medium whitespace-nowrap" style="background: var(--color-brand-primary-light); color: var(--color-brand-primary);">#自动化脚本</span>
                        </div>
                        <p class="mt-2 text-[11px]" style="color: var(--color-text-tertiary);">点击标签可删除，也可以手动添加</p>
                    </div>
                </div>
            </div>

            <!-- AI bubble 3: Service info form -->
            <div class="flex items-start gap-2">
                <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full" style="background: linear-gradient(135deg, #6366F1, #8B5CF6);">
                    <i data-lucide="sparkles" class="h-4 w-4" style="color: #FFFFFF;"></i>
                </div>
                <div class="max-w-[85%]">
                    <div class="rounded-2xl rounded-tl-sm px-3.5 py-2.5" style="background: linear-gradient(135deg, #6366F1, #8B5CF6); color: #FFFFFF;">
                        <p class="text-[14px] leading-relaxed">接下来设置你的服务信息：</p>
                    </div>
                    <!-- Form card below the bubble -->
                    <div class="mt-2 rounded-xl p-4" style="background: var(--color-bg-surface); box-shadow: var(--shadow-card);">
                        <!-- 技能标题 -->
                        <div class="mb-3">
                            <label class="mb-1.5 block text-[13px] font-medium" style="color: var(--color-text-secondary);">技能标题</label>
                            <input type="text" class="w-full rounded-lg border px-3 py-2 text-[14px] focus:outline-none focus:ring-2" style="border-color: var(--color-border-default); background: var(--color-bg-page); color: var(--color-text-primary); --tw-ring-color: var(--color-brand-primary); font-family: var(--font-body);" placeholder="例如：PS精修 / 数据爬取" />
                        </div>
                        <!-- 起步价格 -->
                        <div class="mb-3">
                            <label class="mb-1.5 block text-[13px] font-medium" style="color: var(--color-text-secondary);">起步价格</label>
                            <div class="flex items-center rounded-lg border px-3 py-2" style="border-color: var(--color-border-default); background: var(--color-bg-page);">
                                <span class="text-[14px] font-medium" style="color: var(--color-brand-primary);">¥</span>
                                <input type="text" class="ml-1.5 flex-1 border-none bg-transparent text-[14px] focus:outline-none" style="color: var(--color-text-primary); font-family: var(--font-body);" placeholder="建议 ¥20 起" />
                            </div>
                        </div>
                        <!-- 交付时间 -->
                        <div class="mb-3">
                            <label class="mb-1.5 block text-[13px] font-medium" style="color: var(--color-text-secondary);">交付时间</label>
                            <div class="flex gap-2">
                                <span class="flex flex-1 items-center justify-center rounded-lg border py-2 text-[13px] font-medium whitespace-nowrap" style="border-color: var(--color-brand-primary); background: var(--color-brand-primary-light); color: var(--color-brand-primary);">24h</span>
                                <span class="flex flex-1 items-center justify-center rounded-lg border py-2 text-[13px] font-medium whitespace-nowrap" style="border-color: var(--color-border-default); background: var(--color-bg-page); color: var(--color-text-secondary);">3天</span>
                                <span class="flex flex-1 items-center justify-center rounded-lg border py-2 text-[13px] font-medium whitespace-nowrap" style="border-color: var(--color-border-default); background: var(--color-bg-page); color: var(--color-text-secondary);">7天</span>
                            </div>
                        </div>
                        <!-- 修改次数 -->
                        <div>
                            <label class="mb-1.5 block text-[13px] font-medium" style="color: var(--color-text-secondary);">修改次数</label>
                            <div class="flex gap-2">
                                <span class="flex flex-1 items-center justify-center rounded-lg border py-2 text-[13px] font-medium whitespace-nowrap" style="border-color: var(--color-brand-primary); background: var(--color-brand-primary-light); color: var(--color-brand-primary);">1次</span>
                                <span class="flex flex-1 items-center justify-center rounded-lg border py-2 text-[13px] font-medium whitespace-nowrap" style="border-color: var(--color-border-default); background: var(--color-bg-page); color: var(--color-text-secondary);">2次</span>
                                <span class="flex flex-1 items-center justify-center rounded-lg border py-2 text-[13px] font-medium whitespace-nowrap" style="border-color: var(--color-border-default); background: var(--color-bg-page); color: var(--color-text-secondary);">3次</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- AI bubble 4: Confirm publish -->
            <div class="flex items-start gap-2">
                <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full" style="background: linear-gradient(135deg, #6366F1, #8B5CF6);">
                    <i data-lucide="sparkles" class="h-4 w-4" style="color: #FFFFFF;"></i>
                </div>
                <div class="max-w-[85%] rounded-2xl rounded-tl-sm px-3.5 py-2.5" style="background: linear-gradient(135deg, #6366F1, #8B5CF6); color: #FFFFFF;">
                    <p class="text-[14px] leading-relaxed">确认发布吗？发布后即可被买家搜索到。</p>
                </div>
            </div>

        </div>

        <!-- Bottom action bar -->
        <div class="fixed bottom-0 left-0 right-0 z-30 border-t" style="border-color: var(--color-border-light); background: var(--color-bg-surface);">
            <div class="mx-auto flex h-[56px] max-w-[375px] items-center gap-3 px-4" style="padding-bottom: env(safe-area-inset-bottom, 0px);">
                <button class="shrink-0 text-[14px] font-medium whitespace-nowrap" style="color: var(--color-text-secondary);">返回</button>
                <button data-dom-id="btn-publish-confirm" class="flex-1 rounded-lg py-2.5 text-[15px] font-semibold whitespace-nowrap" style="background: linear-gradient(135deg, #6366F1, #8B5CF6); color: #FFFFFF;">发布技能</button>
            </div>
        </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
