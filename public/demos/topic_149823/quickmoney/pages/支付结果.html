<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付结果 - 闪薪</title>
    <style id="theme-vars">
:root {
  --color-brand-primary: #6366F1;
  --color-brand-primary-hover: #4F46E5;
  --color-brand-primary-light: #EEF2FF;
  --color-brand-primary-subtle: #F5F3FF;
  --color-brand-gradient-start: #6366F1;
  --color-brand-gradient-end: #8B5CF6;
  --color-bg-page: #F8FAFC;
  --color-bg-surface: #FFFFFF;
  --color-bg-elevated: #FFFFFF;
  --color-bg-chat: #F1F5F9;
  --color-text-primary: #0F172A;
  --color-text-secondary: #64748B;
  --color-text-tertiary: #94A3B8;
  --color-text-inverse: #FFFFFF;
  --color-border-default: #E2E8F0;
  --color-border-light: #F1F5F9;
  --color-ai-bubble: linear-gradient(135deg, #6366F1, #8B5CF6);
  --color-user-bubble: #FFFFFF;
  --color-ai-bubble-text: #FFFFFF;
  --color-user-bubble-text: #0F172A;
  --state-success: #22C55E;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-2xl: 20px;
  --radius-full: 9999px;
  --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.04);
  --shadow-elevated: 0 4px 12px rgba(15, 23, 42, 0.05);
  --shadow-floating: 0 8px 24px rgba(15, 23, 42, 0.08);
  --shadow-glow: 0 0 20px rgba(99, 102, 241, 0.15);
  --font-display: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-body: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
  --text-display-lg: 28px; --text-display-md: 24px; --text-display-sm: 20px;
  --text-title-lg: 18px; --text-title-md: 16px; --text-title-sm: 14px;
  --text-body-lg: 16px; --text-body-md: 14px; --text-body-sm: 12px; --text-caption: 11px;
  --leading-display: 1.3; --leading-title: 1.4; --leading-body: 1.6; --leading-tight: 1.2;
  --weight-bold: 700; --weight-semibold: 600; --weight-medium: 500; --weight-regular: 400;
  --space-xs: 4px; --space-sm: 8px; --space-md: 12px; --space-lg: 16px; --space-xl: 20px; --space-2xl: 24px; --space-3xl: 32px; --space-4xl: 40px;
}

/* Mini program viewport simulation */
html {
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  font-family: var(--font-body);
  color: var(--color-text-primary);
  background: var(--color-bg-page);
  line-height: var(--leading-body);
  margin: 0;
  padding: 0;
  max-width: 375px;
  margin: 0 auto;
  min-height: 100vh;
}

.page-container {
  padding-bottom: calc(80px + env(safe-area-inset-bottom));
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-brand-primary);
    --color-foreground: var(--color-text-primary);
    --color-background: var(--color-bg-page);
    --color-card: var(--color-bg-surface);
    --color-muted: var(--color-bg-page);
    --color-border: var(--color-border-default);
  }
  @layer base {
    body { background: var(--color-bg-page); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }

      /* Success check animation */
      @keyframes scaleIn {
        0% { transform: scale(0); opacity: 0; }
        60% { transform: scale(1.1); }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes fadeUp {
        0% { transform: translateY(12px); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
      }
      .anim-scale-in {
        animation: scaleIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      .anim-fade-up {
        animation: fadeUp 0.4s ease-out both;
      }
      .anim-delay-1 { animation-delay: 0.15s; }
      .anim-delay-2 { animation-delay: 0.25s; }
      .anim-delay-3 { animation-delay: 0.35s; }
      .anim-delay-4 { animation-delay: 0.45s; }
      .anim-delay-5 { animation-delay: 0.55s; }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="page-container">

      <!-- Status bar spacer -->
      <div class="h-11 bg-transparent"></div>

      <!-- Navigation Bar -->
      <header class="sticky top-0 z-30 border-b border-[var(--color-border-light)] bg-[var(--color-bg-surface)]/95 backdrop-blur">
        <div class="flex h-11 items-center px-4">
          <div class="flex w-[88px] items-center justify-start">
            <button data-dom-id="btn-back" class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-[var(--color-border-default)] bg-[var(--color-bg-surface)]" aria-label="返回">
              <i data-lucide="chevron-left" class="h-4 w-4" style="color: var(--color-text-primary);"></i>
            </button>
          </div>
          <div class="min-w-0 flex-1 text-center text-[16px] font-semibold tracking-[-0.02em]" style="color: var(--color-text-primary);">支付结果</div>
          <div class="w-[88px]"></div>
        </div>
      </header>

      <!-- Page content area -->
      <div class="px-4 pt-6 pb-4 space-y-3">

        <!-- Success State (Centered) -->
        <section class="flex flex-col items-center pt-6 pb-8 anim-fade-up">
          <!-- Large green checkmark circle -->
          <div class="anim-scale-in flex h-16 w-16 items-center justify-center rounded-full" style="background: var(--state-success);">
            <i data-lucide="check" class="h-8 w-8" style="color: var(--color-text-inverse);"></i>
          </div>
          <!-- Heading -->
          <h1 class="anim-fade-up anim-delay-1 mt-4 text-[22px] font-bold tracking-[-0.02em]" style="color: var(--color-text-primary); line-height: var(--leading-tight);">支付成功</h1>
          <!-- Amount -->
          <div class="anim-fade-up anim-delay-2 mt-2 text-[28px] font-bold tracking-tight" style="color: var(--color-brand-primary); line-height: var(--leading-tight);">¥134.40</div>
          <!-- Subtitle -->
          <p class="anim-fade-up anim-delay-3 mt-1 text-[13px]" style="color: var(--color-text-tertiary);">款项已由平台托管</p>
        </section>

        <!-- Order Summary Card -->
        <section class="anim-fade-up anim-delay-3 rounded-xl p-4" style="background: var(--color-bg-surface); box-shadow: var(--shadow-card);">
          <h2 class="text-[15px] font-semibold" style="color: var(--color-text-primary);">订单信息</h2>

          <!-- Divider -->
          <div class="mt-3 mb-3 h-px" style="background: var(--color-border-light);"></div>

          <!-- Info rows -->
          <div class="space-y-3">
            <!-- 技能名称 -->
            <div class="flex items-center justify-between">
              <span class="text-[13px] shrink-0" style="color: var(--color-text-tertiary);">技能名称</span>
              <span class="text-[13px] font-medium text-right" style="color: var(--color-text-primary);">PPT美化 — 标准版</span>
            </div>
            <!-- 卖家 -->
            <div class="flex items-center justify-between">
              <span class="text-[13px] shrink-0" style="color: var(--color-text-tertiary);">卖家</span>
              <span class="text-[13px] font-medium text-right" style="color: var(--color-text-primary);">小林Design</span>
            </div>
            <!-- 订单号 -->
            <div class="flex items-center justify-between">
              <span class="text-[13px] shrink-0" style="color: var(--color-text-tertiary);">订单号</span>
              <span class="text-[13px] text-right" style="color: var(--color-text-secondary); font-family: var(--font-mono);">SX20260630001</span>
            </div>
            <!-- 支付时间 -->
            <div class="flex items-center justify-between">
              <span class="text-[13px] shrink-0" style="color: var(--color-text-tertiary);">支付时间</span>
              <span class="text-[13px] text-right" style="color: var(--color-text-secondary);">2026-06-30 14:24</span>
            </div>
            <!-- 订单状态 -->
            <div class="flex items-center justify-between">
              <span class="text-[13px] shrink-0" style="color: var(--color-text-tertiary);">订单状态</span>
              <span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-[12px] font-medium" style="background: var(--color-brand-primary-light); color: var(--color-brand-primary);">进行中</span>
            </div>
          </div>
        </section>

        <!-- What's Next Card -->
        <section class="anim-fade-up anim-delay-4 rounded-xl p-4" style="background: var(--color-bg-surface); box-shadow: var(--shadow-card);">
          <h2 class="text-[15px] font-semibold" style="color: var(--color-text-primary);">接下来</h2>

          <!-- Divider -->
          <div class="mt-3 mb-3 h-px" style="background: var(--color-border-light);"></div>

          <!-- Timeline -->
          <div class="space-y-0">
            <!-- Step 1: Done -->
            <div class="flex gap-3">
              <!-- Timeline line + icon -->
              <div class="flex flex-col items-center">
                <div class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full" style="background: var(--state-success);">
                  <i data-lucide="check" class="h-3.5 w-3.5" style="color: var(--color-text-inverse);"></i>
                </div>
                <div class="w-px flex-1 mt-1" style="background: var(--state-success); min-height: 24px;"></div>
              </div>
              <!-- Content -->
              <div class="pb-4 min-w-0">
                <p class="text-[13px] font-semibold" style="color: var(--color-text-primary);">等待卖家接单</p>
                <p class="mt-0.5 text-[12px]" style="color: var(--color-text-tertiary);">卖家将在2小时内确认</p>
              </div>
            </div>

            <!-- Step 2: Pending -->
            <div class="flex gap-3">
              <div class="flex flex-col items-center">
                <div class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full" style="background: var(--color-bg-page); border: 1.5px solid var(--color-border-default);">
                  <i data-lucide="clock" class="h-3.5 w-3.5" style="color: var(--color-text-tertiary);"></i>
                </div>
                <div class="w-px flex-1 mt-1" style="background: var(--color-border-default); min-height: 24px;"></div>
              </div>
              <div class="pb-4 min-w-0">
                <p class="text-[13px] font-medium" style="color: var(--color-text-secondary);">卖家制作中</p>
                <p class="mt-0.5 text-[12px]" style="color: var(--color-text-tertiary);">预计72小时内交付</p>
              </div>
            </div>

            <!-- Step 3: Pending -->
            <div class="flex gap-3">
              <div class="flex flex-col items-center">
                <div class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full" style="background: var(--color-bg-page); border: 1.5px solid var(--color-border-default);">
                  <i data-lucide="package" class="h-3.5 w-3.5" style="color: var(--color-text-tertiary);"></i>
                </div>
              </div>
              <div class="min-w-0">
                <p class="text-[13px] font-medium" style="color: var(--color-text-secondary);">确认收货</p>
                <p class="mt-0.5 text-[12px]" style="color: var(--color-text-tertiary);">收到交付物后确认</p>
              </div>
            </div>
          </div>
        </section>

      </div>
    </main>

    <!-- Bottom Action Bar (Fixed) -->
    <footer class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[375px] z-40 border-t border-[var(--color-border-light)]" style="background: var(--color-bg-surface); padding-bottom: env(safe-area-inset-bottom);">
      <div class="flex items-center justify-center gap-4 px-4 py-3">
        <a href="#" data-dom-id="btn-back-home" class="text-[14px] font-medium shrink-0" style="color: var(--color-text-secondary); text-decoration: none;">返回首页</a>
        <button data-dom-id="btn-view-order" class="flex-1 flex items-center justify-center h-11 rounded-full text-[15px] font-semibold text-white shrink-0" style="background: linear-gradient(135deg, var(--color-brand-gradient-start) 0%, var(--color-brand-gradient-end) 100%); box-shadow: var(--shadow-glow);">
          查看订单
        </button>
      </div>
    </footer>

    <script>
      // Initialize Lucide icons
      lucide.createIcons();
    </script>
</body>
</html>
