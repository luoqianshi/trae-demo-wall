<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>闪薪 - 发现</title>
    <style id="theme-vars">
/* 闪薪 - Brand CSS */
/* Tech-trust blue-purple gradient palette, clean minimal UI */

:root {
  /* === Color System === */
  --color-brand-primary: #6366F1;
  --color-brand-primary-hover: #4F46E5;
  --color-brand-primary-light: #EEF2FF;
  --color-brand-primary-subtle: #F5F3FF;
  --color-brand-gradient-start: #6366F1;
  --color-brand-gradient-end: #8B5CF6;

  --color-bg-page: #F8FAFC;
  --color-bg-surface: #FFFFFF;
  --color-bg-elevated: #FFFFFF;
  --color-bg-chat: #F1F5F9;

  --color-text-primary: #0F172A;
  --color-text-secondary: #64748B;
  --color-text-tertiary: #94A3B8;
  --color-text-inverse: #FFFFFF;

  --color-border-default: #E2E8F0;
  --color-border-light: #F1F5F9;

  --color-ai-bubble: linear-gradient(135deg, #6366F1, #8B5CF6);
  --color-user-bubble: #FFFFFF;
  --color-ai-bubble-text: #FFFFFF;
  --color-user-bubble-text: #0F172A;

  --state-success: #22C55E;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* === Radius Scale === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-2xl: 20px;
  --radius-full: 9999px;

  /* === Shadow System (static <= 0.05 alpha, floating only for modals) === */
  --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.04);
  --shadow-elevated: 0 4px 12px rgba(15, 23, 42, 0.05);
  --shadow-floating: 0 8px 24px rgba(15, 23, 42, 0.08);
  --shadow-glow: 0 0 20px rgba(99, 102, 241, 0.15);

  /* === Typography === */
  --font-display: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-body: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;

  --text-display-lg: 28px;
  --text-display-md: 24px;
  --text-display-sm: 20px;

  --text-title-lg: 18px;
  --text-title-md: 16px;
  --text-title-sm: 14px;

  --text-body-lg: 16px;
  --text-body-md: 14px;
  --text-body-sm: 12px;

  --text-caption: 11px;

  --leading-display: 1.3;
  --leading-title: 1.4;
  --leading-body: 1.6;
  --leading-tight: 1.2;

  --weight-bold: 700;
  --weight-semibold: 600;
  --weight-medium: 500;
  --weight-regular: 400;

  /* === Spacing === */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;
  --space-4xl: 40px;
}

/* Mini program viewport simulation */
html {
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  font-family: var(--font-body);
  color: var(--color-text-primary);
  background: var(--color-bg-page);
  line-height: var(--leading-body);
  margin: 0;
  padding: 0;
  max-width: 375px;
  margin: 0 auto;
  min-height: 100vh;
}

.page-container {
  padding-bottom: calc(60px + env(safe-area-inset-bottom));
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="pb-[84px]">

      <!-- 1. Status bar spacer -->
      <div class="h-11" aria-hidden="true"></div>

      <!-- 2. Top bar: "发现" title centered, search icon on right -->
      <header class="sticky top-0 z-30 bg-[var(--color-bg-page)]/95 backdrop-blur">
        <div class="flex h-11 items-center px-4">
          <div class="w-[88px] flex items-center justify-start">
            <!-- Balancing area, root tab page — no back button -->
          </div>
          <div class="min-w-0 flex-1 text-center text-[16px] font-semibold truncate" style="color:var(--color-text-primary)">发现</div>
          <div class="flex h-8 w-[88px] items-center justify-center rounded-full border" style="border-color:var(--color-border-default); background:var(--color-bg-surface)/90" aria-label="小程序菜单">
            <button class="flex h-full flex-1 items-center justify-center" aria-label="更多">
              <i data-lucide="more-horizontal" class="h-4 w-4" style="color:var(--color-text-primary)"></i>
            </button>
            <span class="h-4 w-px" style="background:var(--color-border-default)" aria-hidden="true"></span>
            <button class="flex h-full flex-1 items-center justify-center" aria-label="关闭">
              <i data-lucide="x" class="h-4 w-4" style="color:var(--color-text-primary)"></i>
            </button>
          </div>
        </div>
      </header>

      <!-- 3. Category pills: horizontally scrollable, indigo active -->
      <div class="mt-3 flex flex-nowrap gap-2 overflow-x-auto px-4 no-scrollbar">
        <span class="shrink-0 inline-flex items-center rounded-lg px-3 py-1.5 text-[13px] font-medium whitespace-nowrap" style="background:var(--color-brand-primary); color:var(--color-text-inverse)">全部</span>
        <span class="shrink-0 inline-flex items-center rounded-lg px-3 py-1.5 text-[13px] font-medium whitespace-nowrap" style="background:var(--color-brand-primary-light); color:var(--color-text-secondary)">设计创意</span>
        <span class="shrink-0 inline-flex items-center rounded-lg px-3 py-1.5 text-[13px] font-medium whitespace-nowrap" style="background:var(--color-brand-primary-light); color:var(--color-text-secondary)">文案写作</span>
        <span class="shrink-0 inline-flex items-center rounded-lg px-3 py-1.5 text-[13px] font-medium whitespace-nowrap" style="background:var(--color-brand-primary-light); color:var(--color-text-secondary)">AI绘图</span>
        <span class="shrink-0 inline-flex items-center rounded-lg px-3 py-1.5 text-[13px] font-medium whitespace-nowrap" style="background:var(--color-brand-primary-light); color:var(--color-text-secondary)">数据开发</span>
      </div>

      <!-- 4. Skill card list: 4 cards, clean white -->
      <div class="mt-4 flex flex-col gap-3 px-4">

        <!-- Card 1 -->
        <a data-dom-id="market-card-1" href="./skill-detail.html" class="block rounded-lg p-3" style="background:var(--color-bg-surface); box-shadow:var(--shadow-card)">
          <!-- Seller row: avatar + name + credit badge -->
          <div class="flex items-center gap-2">
            <div class="h-8 w-8 shrink-0 rounded-full flex items-center justify-center text-[12px] font-bold" style="background:#6366F1; color:#FFFFFF">陈</div>
            <span class="text-[14px] font-medium truncate" style="color:var(--color-text-primary)">陈设计师</span>
            <span class="shrink-0 inline-flex items-center rounded px-1.5 py-0.5 text-[10px] font-medium whitespace-nowrap" style="background:#EEF2FF; color:#6366F1">信用98</span>
          </div>
          <!-- Skill title & tags -->
          <div class="mt-2">
            <h3 class="text-[15px] font-semibold truncate" style="color:var(--color-text-primary)">PPT定制美化</h3>
            <div class="mt-1.5 flex items-center gap-1.5">
              <span class="shrink-0 inline-flex items-center rounded px-2 py-0.5 text-[11px] whitespace-nowrap" style="background:var(--color-brand-primary-light); color:var(--color-brand-primary)">PPT</span>
              <span class="shrink-0 inline-flex items-center rounded px-2 py-0.5 text-[11px] whitespace-nowrap" style="background:var(--color-brand-primary-light); color:var(--color-brand-primary)">设计</span>
              <span class="shrink-0 inline-flex items-center rounded px-2 py-0.5 text-[11px] whitespace-nowrap" style="background:var(--color-brand-primary-light); color:var(--color-brand-primary)">商务</span>
            </div>
          </div>
          <!-- Bottom row: star rating + price -->
          <div class="mt-2 flex items-center justify-between">
            <div class="flex items-center gap-0.5">
              <i data-lucide="star" class="h-3.5 w-3.5" style="color:var(--color-brand-primary); fill:var(--color-brand-primary)"></i>
              <span class="text-[12px] font-medium" style="color:var(--color-brand-primary)">4.9</span>
              <span class="text-[11px] ml-1" style="color:var(--color-text-tertiary)">96单</span>
            </div>
            <div class="flex items-baseline gap-0.5">
              <span class="text-[16px] font-bold" style="color:var(--color-brand-primary)">¥68</span>
              <span class="text-[11px]" style="color:var(--color-text-tertiary)">起</span>
            </div>
          </div>
        </a>

        <!-- Card 2 -->
        <a data-dom-id="market-card-2" href="./skill-detail.html" class="block rounded-lg p-3" style="background:var(--color-bg-surface); box-shadow:var(--shadow-card)">
          <div class="flex items-center gap-2">
            <div class="h-8 w-8 shrink-0 rounded-full flex items-center justify-center text-[12px] font-bold" style="background:#8B5CF6; color:#FFFFFF">李</div>
            <span class="text-[14px] font-medium truncate" style="color:var(--color-text-primary)">李文案</span>
            <span class="shrink-0 inline-flex items-center rounded px-1.5 py-0.5 text-[10px] font-medium whitespace-nowrap" style="background:#F5F3FF; color:#8B5CF6">信用95</span>
          </div>
          <div class="mt-2">
            <h3 class="text-[15px] font-semibold truncate" style="color:var(--color-text-primary)">品牌故事文案撰写</h3>
            <div class="mt-1.5 flex items-center gap-1.5">
              <span class="shrink-0 inline-flex items-center rounded px-2 py-0.5 text-[11px] whitespace-nowrap" style="background:var(--color-brand-primary-light); color:var(--color-brand-primary)">文案</span>
              <span class="shrink-0 inline-flex items-center rounded px-2 py-0.5 text-[11px] whitespace-nowrap" style="background:var(--color-brand-primary-light); color:var(--color-brand-primary)">品牌</span>
            </div>
          </div>
          <div class="mt-2 flex items-center justify-between">
            <div class="flex items-center gap-0.5">
              <i data-lucide="star" class="h-3.5 w-3.5" style="color:var(--color-brand-primary); fill:var(--color-brand-primary)"></i>
              <span class="text-[12px] font-medium" style="color:var(--color-brand-primary)">4.8</span>
              <span class="text-[11px] ml-1" style="color:var(--color-text-tertiary)">210单</span>
            </div>
            <div class="flex items-baseline gap-0.5">
              <span class="text-[16px] font-bold" style="color:var(--color-brand-primary)">¥120</span>
              <span class="text-[11px]" style="color:var(--color-text-tertiary)">起</span>
            </div>
          </div>
        </a>

        <!-- Card 3 -->
        <a data-dom-id="market-card-3" href="./skill-detail.html" class="block rounded-lg p-3" style="background:var(--color-bg-surface); box-shadow:var(--shadow-card)">
          <div class="flex items-center gap-2">
            <div class="h-8 w-8 shrink-0 rounded-full flex items-center justify-center text-[12px] font-bold" style="background:#3B82F6; color:#FFFFFF">王</div>
            <span class="text-[14px] font-medium truncate" style="color:var(--color-text-primary)">王画师</span>
            <span class="shrink-0 inline-flex items-center rounded px-1.5 py-0.5 text-[10px] font-medium whitespace-nowrap" style="background:#EFF6FF; color:#3B82F6">信用92</span>
          </div>
          <div class="mt-2">
            <h3 class="text-[15px] font-semibold truncate" style="color:var(--color-text-primary)">AI头像插画定制</h3>
            <div class="mt-1.5 flex items-center gap-1.5">
              <span class="shrink-0 inline-flex items-center rounded px-2 py-0.5 text-[11px] whitespace-nowrap" style="background:var(--color-brand-primary-light); color:var(--color-brand-primary)">AI绘图</span>
              <span class="shrink-0 inline-flex items-center rounded px-2 py-0.5 text-[11px] whitespace-nowrap" style="background:var(--color-brand-primary-light); color:var(--color-brand-primary)">头像</span>
            </div>
          </div>
          <div class="mt-2 flex items-center justify-between">
            <div class="flex items-center gap-0.5">
              <i data-lucide="star" class="h-3.5 w-3.5" style="color:var(--color-brand-primary); fill:var(--color-brand-primary)"></i>
              <span class="text-[12px] font-medium" style="color:var(--color-brand-primary)">4.7</span>
              <span class="text-[11px] ml-1" style="color:var(--color-text-tertiary)">79单</span>
            </div>
            <div class="flex items-baseline gap-0.5">
              <span class="text-[16px] font-bold" style="color:var(--color-brand-primary)">¥45</span>
              <span class="text-[11px]" style="color:var(--color-text-tertiary)">起</span>
            </div>
          </div>
        </a>

        <!-- Card 4 -->
        <a data-dom-id="market-card-4" href="./skill-detail.html" class="block rounded-lg p-3" style="background:var(--color-bg-surface); box-shadow:var(--shadow-card)">
          <div class="flex items-center gap-2">
            <div class="h-8 w-8 shrink-0 rounded-full flex items-center justify-center text-[12px] font-bold" style="background:#7C3AED; color:#FFFFFF">赵</div>
            <span class="text-[14px] font-medium truncate" style="color:var(--color-text-primary)">赵数据</span>
            <span class="shrink-0 inline-flex items-center rounded px-1.5 py-0.5 text-[10px] font-medium whitespace-nowrap" style="background:#F5F3FF; color:#7C3AED">信用97</span>
          </div>
          <div class="mt-2">
            <h3 class="text-[15px] font-semibold truncate" style="color:var(--color-text-primary)">数据看板搭建</h3>
            <div class="mt-1.5 flex items-center gap-1.5">
              <span class="shrink-0 inline-flex items-center rounded px-2 py-0.5 text-[11px] whitespace-nowrap" style="background:var(--color-brand-primary-light); color:var(--color-brand-primary)">数据</span>
              <span class="shrink-0 inline-flex items-center rounded px-2 py-0.5 text-[11px] whitespace-nowrap" style="background:var(--color-brand-primary-light); color:var(--color-brand-primary)">开发</span>
            </div>
          </div>
          <div class="mt-2 flex items-center justify-between">
            <div class="flex items-center gap-0.5">
              <i data-lucide="star" class="h-3.5 w-3.5" style="color:var(--color-brand-primary); fill:var(--color-brand-primary)"></i>
              <span class="text-[12px] font-medium" style="color:var(--color-brand-primary)">4.9</span>
              <span class="text-[11px] ml-1" style="color:var(--color-text-tertiary)">180单</span>
            </div>
            <div class="flex items-baseline gap-0.5">
              <span class="text-[16px] font-bold" style="color:var(--color-brand-primary)">¥200</span>
              <span class="text-[11px]" style="color:var(--color-text-tertiary)">起</span>
            </div>
          </div>
        </a>

      </div>

      <!-- Bottom spacer -->
      <div class="h-4"></div>

    </main>

    <!-- 5. Bottom tab bar: 发现 tab active in indigo -->
    <nav class="fixed bottom-0 left-1/2 z-40 flex h-[50px] -translate-x-1/2 items-center justify-around border-t" style="width:375px; max-width:100vw; border-color:var(--color-border-default); background:var(--color-bg-surface)">
      <!-- 对话 -->
      <a data-dom-id="tab-chat" href="./home.html" class="flex flex-col items-center gap-0.5 py-1 min-w-0">
        <i data-lucide="message-circle" class="h-5 w-5" style="color:var(--color-text-tertiary)"></i>
        <span class="text-[10px] font-medium" style="color:var(--color-text-tertiary)">对话</span>
      </a>
      <!-- 发现 (active) -->
      <a data-dom-id="tab-discover" href="./market.html" class="flex flex-col items-center gap-0.5 py-1 min-w-0">
        <i data-lucide="compass" class="h-5 w-5" style="color:var(--color-brand-primary)"></i>
        <span class="text-[10px] font-semibold" style="color:var(--color-brand-primary)">发现</span>
      </a>
      <!-- 发布 (+) -->
      <a data-dom-id="tab-publish" href="./publish-skill.html" class="flex flex-col items-center gap-0.5 py-1 min-w-0">
        <div class="flex h-10 w-10 -mt-4 items-center justify-center rounded-full" style="background:linear-gradient(135deg,var(--color-brand-gradient-start),var(--color-brand-gradient-end)); box-shadow:0 4px 12px rgba(99,102,241,0.35)">
          <i data-lucide="plus" class="h-5 w-5" style="color:#FFFFFF"></i>
        </div>
        <span class="text-[10px] -mt-0.5" style="color:var(--color-text-tertiary)">发布</span>
      </a>
      <!-- 我的 -->
      <a data-dom-id="tab-profile" href="./profile.html" class="flex flex-col items-center gap-0.5 py-1 min-w-0">
        <i data-lucide="user" class="h-5 w-5" style="color:var(--color-text-tertiary)"></i>
        <span class="text-[10px] font-medium" style="color:var(--color-text-tertiary)">我的</span>
      </a>
    </nav>
    <!-- Safe area bottom -->
    <div class="h-[env(safe-area-inset-bottom,34px)]"></div>
    <script>lucide.createIcons();</script>
</body>
</html>
