<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>评价订单</title>
    <style id="theme-vars">
:root {
  --color-brand-primary: #6366F1;
  --color-brand-primary-hover: #4F46E5;
  --color-brand-primary-light: #EEF2FF;
  --color-brand-primary-subtle: #F5F3FF;
  --color-brand-gradient-start: #6366F1;
  --color-brand-gradient-end: #8B5CF6;
  --color-bg-page: #F8FAFC;
  --color-bg-surface: #FFFFFF;
  --color-bg-elevated: #FFFFFF;
  --color-bg-chat: #F1F5F9;
  --color-text-primary: #0F172A;
  --color-text-secondary: #64748B;
  --color-text-tertiary: #94A3B8;
  --color-text-inverse: #FFFFFF;
  --color-border-default: #E2E8F0;
  --color-border-light: #F1F5F9;
  --color-ai-bubble: linear-gradient(135deg, #6366F1, #8B5CF6);
  --color-user-bubble: #FFFFFF;
  --color-ai-bubble-text: #FFFFFF;
  --color-user-bubble-text: #0F172A;
  --state-success: #22C55E;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-2xl: 20px;
  --radius-full: 9999px;
  --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.04);
  --shadow-elevated: 0 4px 12px rgba(15, 23, 42, 0.05);
  --shadow-floating: 0 8px 24px rgba(15, 23, 42, 0.08);
  --shadow-glow: 0 0 20px rgba(99, 102, 241, 0.15);
  --font-display: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-body: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
  --text-display-lg: 28px; --text-display-md: 24px; --text-display-sm: 20px;
  --text-title-lg: 18px; --text-title-md: 16px; --text-title-sm: 14px;
  --text-body-lg: 16px; --text-body-md: 14px; --text-body-sm: 12px; --text-caption: 11px;
  --leading-display: 1.3; --leading-title: 1.4; --leading-body: 1.6; --leading-tight: 1.2;
  --weight-bold: 700; --weight-semibold: 600; --weight-medium: 500; --weight-regular: 400;
  --space-xs: 4px; --space-sm: 8px; --space-md: 12px; --space-lg: 16px; --space-xl: 20px; --space-2xl: 24px; --space-3xl: 32px; --space-4xl: 40px;
}
</style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-brand-primary);
  }
  @layer base {
    body { background: var(--color-bg-page); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
      .star-btn { cursor: pointer; transition: transform 0.15s ease; }
      .star-btn:active { transform: scale(0.9); }
      .tag-chip { cursor: pointer; transition: all 0.15s ease; user-select: none; }
      .tag-chip:active { transform: scale(0.95); }
      .review-textarea:focus { outline: none; box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); }
      .review-textarea::placeholder { color: var(--color-text-tertiary); }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="font-family: var(--font-body); color: var(--color-text-primary); background: var(--color-bg-page); max-width: 375px; margin: 0 auto; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;">
    <main>
      <!-- Status bar spacer -->
      <div style="height: 44px; background: transparent;"></div>

      <!-- Navigation bar -->
      <header style="position: sticky; top: 0; z-index: 30; border-bottom: 1px solid var(--color-border-default); background: rgba(248, 250, 252, 0.95); backdrop-filter: blur(8px);">
        <div style="display: flex; align-items: center; height: 44px; padding: 0 16px;">
          <div style="display: flex; width: 88px; align-items: flex-start; justify-content: flex-start;">
            <button data-dom-id="back-review" style="display: inline-flex; height: 32px; width: 32px; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid var(--color-border-default); background: var(--color-bg-surface); cursor: pointer;" aria-label="返回">
              <i data-lucide="chevron-left" style="width: 16px; height: 16px; color: var(--color-text-primary);"></i>
            </button>
          </div>
          <div style="flex: 1; text-align: center; font-size: 16px; font-weight: 600; letter-spacing: -0.02em; color: var(--color-text-primary);">评价订单</div>
          <div style="width: 88px;"></div>
        </div>
      </header>

      <!-- Page content -->
      <div style="padding: 16px 16px 120px 16px; background: var(--color-bg-page);">

        <!-- Order completed banner -->
        <div style="border-radius: 16px; padding: 20px; background: linear-gradient(135deg, var(--color-brand-gradient-start), var(--color-brand-gradient-end));">
          <div style="display: flex; align-items: center; gap: 8px;">
            <div style="display: flex; height: 32px; width: 32px; align-items: center; justify-content: center; border-radius: 9999px; background: rgba(255,255,255,0.2);">
              <i data-lucide="party-popper" style="width: 18px; height: 18px; color: var(--color-text-inverse);"></i>
            </div>
            <span style="font-size: 18px; font-weight: 600; color: var(--color-text-inverse);">交易完成</span>
          </div>
          <p style="margin-top: 8px; font-size: 13px; color: rgba(255,255,255,0.85); line-height: 1.5;">感谢你的评价，帮助其他买家做出选择</p>
        </div>

        <!-- Seller info + rating card -->
        <div style="margin-top: 16px; border-radius: 16px; padding: 16px; background: var(--color-bg-surface); box-shadow: var(--shadow-card);">
          <!-- Seller info -->
          <div style="display: flex; align-items: center; gap: 10px;">
            <div style="display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 9999px; background: linear-gradient(135deg, var(--color-brand-gradient-start), var(--color-brand-gradient-end)); color: var(--color-text-inverse); font-size: 14px; font-weight: 600; flex-shrink: 0;">林</div>
            <div style="display: flex; align-items: center; gap: 6px; min-width: 0;">
              <span style="font-size: 15px; font-weight: 600; color: var(--color-text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">小林Design</span>
              <span style="display: inline-flex; align-items: center; border-radius: 4px; padding: 2px 6px; font-size: 11px; font-weight: 500; white-space: nowrap; background: var(--color-brand-primary-light); color: var(--color-brand-primary);">信用96</span>
            </div>
          </div>

          <!-- Skill name -->
          <div style="margin-top: 12px; font-size: 13px; color: var(--color-text-secondary);">PPT美化 — 标准版</div>

          <!-- Divider -->
          <div style="margin: 16px 0; height: 1px; background: var(--color-border-light);"></div>

          <!-- Star rating -->
          <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
            <div id="star-rating" style="display: flex; gap: 6px;">
              <button class="star-btn" data-star="1" style="background: none; border: none; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;">
                <i data-lucide="star" style="width: 28px; height: 28px; color: #F59E0B; fill: #F59E0B;"></i>
              </button>
              <button class="star-btn" data-star="2" style="background: none; border: none; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;">
                <i data-lucide="star" style="width: 28px; height: 28px; color: #F59E0B; fill: #F59E0B;"></i>
              </button>
              <button class="star-btn" data-star="3" style="background: none; border: none; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;">
                <i data-lucide="star" style="width: 28px; height: 28px; color: #F59E0B; fill: #F59E0B;"></i>
              </button>
              <button class="star-btn" data-star="4" style="background: none; border: none; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;">
                <i data-lucide="star" style="width: 28px; height: 28px; color: #F59E0B; fill: #F59E0B;"></i>
              </button>
              <button class="star-btn" data-star="5" style="background: none; border: none; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;">
                <i data-lucide="star" style="width: 28px; height: 28px; color: #F59E0B; fill: #F59E0B;"></i>
              </button>
            </div>
            <span id="rating-label" style="font-size: 13px; font-weight: 500; color: #F59E0B;">非常满意</span>
          </div>
        </div>

        <!-- Tag selection card -->
        <div style="margin-top: 12px; border-radius: 16px; padding: 16px; background: var(--color-bg-surface); box-shadow: var(--shadow-card);">
          <h3 style="font-size: 15px; font-weight: 600; color: var(--color-text-primary); margin-bottom: 12px;">选择标签</h3>
          <div id="tag-container" style="display: flex; flex-wrap: wrap; gap: 8px;">
            <span class="tag-chip" data-tag="交付及时" data-selected="true" style="display: inline-flex; align-items: center; padding: 6px 14px; border-radius: 9999px; font-size: 13px; font-weight: 500; background: var(--color-brand-primary); color: var(--color-text-inverse); border: 1.5px solid var(--color-brand-primary); cursor: pointer; transition: all 0.15s ease;">交付及时</span>
            <span class="tag-chip" data-tag="沟通顺畅" data-selected="true" style="display: inline-flex; align-items: center; padding: 6px 14px; border-radius: 9999px; font-size: 13px; font-weight: 500; background: var(--color-brand-primary); color: var(--color-text-inverse); border: 1.5px solid var(--color-brand-primary); cursor: pointer; transition: all 0.15s ease;">沟通顺畅</span>
            <span class="tag-chip" data-tag="质量优秀" data-selected="true" style="display: inline-flex; align-items: center; padding: 6px 14px; border-radius: 9999px; font-size: 13px; font-weight: 500; background: var(--color-brand-primary); color: var(--color-text-inverse); border: 1.5px solid var(--color-brand-primary); cursor: pointer; transition: all 0.15s ease;">质量优秀</span>
            <span class="tag-chip" data-tag="物超所值" data-selected="false" style="display: inline-flex; align-items: center; padding: 6px 14px; border-radius: 9999px; font-size: 13px; font-weight: 500; background: var(--color-bg-surface); color: var(--color-text-secondary); border: 1.5px solid var(--color-border-default); cursor: pointer; transition: all 0.15s ease;">物超所值</span>
            <span class="tag-chip" data-tag="态度专业" data-selected="false" style="display: inline-flex; align-items: center; padding: 6px 14px; border-radius: 9999px; font-size: 13px; font-weight: 500; background: var(--color-bg-surface); color: var(--color-text-secondary); border: 1.5px solid var(--color-border-default); cursor: pointer; transition: all 0.15s ease;">态度专业</span>
            <span class="tag-chip" data-tag="推荐好友" data-selected="false" style="display: inline-flex; align-items: center; padding: 6px 14px; border-radius: 9999px; font-size: 13px; font-weight: 500; background: var(--color-bg-surface); color: var(--color-text-secondary); border: 1.5px solid var(--color-border-default); cursor: pointer; transition: all 0.15s ease;">推荐好友</span>
          </div>
        </div>

        <!-- Text review card -->
        <div style="margin-top: 12px; border-radius: 16px; padding: 16px; background: var(--color-bg-surface); box-shadow: var(--shadow-card);">
          <h3 style="font-size: 15px; font-weight: 600; color: var(--color-text-primary); margin-bottom: 12px;">写下你的评价</h3>
          <textarea class="review-textarea" style="width: 100%; min-height: 120px; padding: 12px; border-radius: 12px; border: 1.5px solid var(--color-border-default); background: var(--color-bg-page); color: var(--color-text-primary); font-family: var(--font-body); font-size: 14px; line-height: 1.6; resize: none; box-sizing: border-box; transition: box-shadow 0.15s ease;" placeholder="分享你的真实体验，帮助其他买家...">设计质量很高，完全符合商务简约风格的要求，交付也非常及时，沟通很顺畅，强烈推荐！</textarea>
          <div style="margin-top: 8px; text-align: right;">
            <span id="char-count" style="font-size: 12px; color: var(--color-text-tertiary);">54/500</span>
          </div>
        </div>

      </div>

      <!-- Bottom action bar -->
      <div style="position: fixed; bottom: 0; left: 0; right: 0; z-index: 40; max-width: 375px; margin: 0 auto;">
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--color-bg-surface); border-top: 1px solid var(--color-border-default); padding-bottom: calc(12px + env(safe-area-inset-bottom, 16px));">
          <button data-dom-id="btn-submit-review" style="flex: 1; border-radius: 12px; padding: 12px 16px; font-size: 14px; font-weight: 600; white-space: nowrap; background: linear-gradient(135deg, var(--color-brand-gradient-start), var(--color-brand-gradient-end)); color: var(--color-text-inverse); border: none; cursor: pointer; box-shadow: var(--shadow-glow);">提交评价</button>
        </div>
        <div style="text-align: center; padding-bottom: calc(4px + env(safe-area-inset-bottom, 8px));">
          <button data-dom-id="btn-skip-review" style="background: none; border: none; cursor: pointer; font-size: 13px; color: var(--color-text-tertiary); padding: 4px 12px;">稍后再说</button>
        </div>
      </div>
    </main>

    <script>
      // Initialize Lucide icons
      lucide.createIcons();

      // Star rating interaction
      const ratingLabels = { 1: '非常不满意', 2: '不满意', 3: '一般', 4: '满意', 5: '非常满意' };
      let currentRating = 5;

      function updateStars(rating) {
        currentRating = rating;
        const buttons = document.querySelectorAll('#star-rating .star-btn');
        buttons.forEach((btn, index) => {
          const icon = btn.querySelector('i') || btn.querySelector('svg');
          if (index < rating) {
            btn.style.color = '#F59E0B';
            if (icon) {
              icon.style.color = '#F59E0B';
              icon.style.fill = '#F59E0B';
            }
          } else {
            btn.style.color = '#CBD5E1';
            if (icon) {
              icon.style.color = '#CBD5E1';
              icon.style.fill = 'none';
            }
          }
        });
        const label = document.getElementById('rating-label');
        if (label) {
          label.textContent = ratingLabels[rating] || '';
        }
      }

      document.querySelectorAll('#star-rating .star-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const star = parseInt(btn.getAttribute('data-star'));
          updateStars(star);
        });
      });

      // Tag selection interaction
      document.querySelectorAll('.tag-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const isSelected = chip.getAttribute('data-selected') === 'true';
          if (isSelected) {
            chip.setAttribute('data-selected', 'false');
            chip.style.background = 'var(--color-bg-surface)';
            chip.style.color = 'var(--color-text-secondary)';
            chip.style.borderColor = 'var(--color-border-default)';
          } else {
            chip.setAttribute('data-selected', 'true');
            chip.style.background = 'var(--color-brand-primary)';
            chip.style.color = 'var(--color-text-inverse)';
            chip.style.borderColor = 'var(--color-brand-primary)';
          }
        });
      });

      // Character count for textarea
      const textarea = document.querySelector('.review-textarea');
      const charCount = document.getElementById('char-count');
      function updateCharCount() {
        if (textarea && charCount) {
          const len = textarea.value.length;
          charCount.textContent = len + '/500';
          if (len > 450) {
            charCount.style.color = 'var(--state-error)';
          } else if (len > 400) {
            charCount.style.color = 'var(--state-warning)';
          } else {
            charCount.style.color = 'var(--color-text-tertiary)';
          }
        }
      }
      if (textarea) {
        textarea.addEventListener('input', updateCharCount);
        updateCharCount();
      }
    </script>
</body>
</html>
