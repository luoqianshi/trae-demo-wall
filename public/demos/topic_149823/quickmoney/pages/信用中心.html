<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>信用中心 - 闪薪</title>
    <style id="theme-vars">
/* 闪薪 - Brand CSS */
/* Tech-trust blue-purple gradient palette, clean minimal UI */

:root {
  /* === Color System === */
  --color-brand-primary: #6366F1;
  --color-brand-primary-hover: #4F46E5;
  --color-brand-primary-light: #EEF2FF;
  --color-brand-primary-subtle: #F5F3FF;
  --color-brand-gradient-start: #6366F1;
  --color-brand-gradient-end: #8B5CF6;

  --color-bg-page: #F8FAFC;
  --color-bg-surface: #FFFFFF;
  --color-bg-elevated: #FFFFFF;
  --color-bg-chat: #F1F5F9;

  --color-text-primary: #0F172A;
  --color-text-secondary: #64748B;
  --color-text-tertiary: #94A3B8;
  --color-text-inverse: #FFFFFF;

  --color-border-default: #E2E8F0;
  --color-border-light: #F1F5F9;

  --color-ai-bubble: linear-gradient(135deg, #6366F1, #8B5CF6);
  --color-user-bubble: #FFFFFF;
  --color-ai-bubble-text: #FFFFFF;
  --color-user-bubble-text: #0F172A;

  --state-success: #22C55E;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* === Radius Scale === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-2xl: 20px;
  --radius-full: 9999px;

  /* === Shadow System (static <= 0.05 alpha, floating only for modals) === */
  --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.04);
  --shadow-elevated: 0 4px 12px rgba(15, 23, 42, 0.05);
  --shadow-floating: 0 8px 24px rgba(15, 23, 42, 0.08);
  --shadow-glow: 0 0 20px rgba(99, 102, 241, 0.15);

  /* === Typography === */
  --font-display: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-body: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;

  --text-display-lg: 28px;
  --text-display-md: 24px;
  --text-display-sm: 20px;

  --text-title-lg: 18px;
  --text-title-md: 16px;
  --text-title-sm: 14px;

  --text-body-lg: 16px;
  --text-body-md: 14px;
  --text-body-sm: 12px;

  --text-caption: 11px;

  --leading-display: 1.3;
  --leading-title: 1.4;
  --leading-body: 1.6;
  --leading-tight: 1.2;

  --weight-bold: 700;
  --weight-semibold: 600;
  --weight-medium: 500;
  --weight-regular: 400;

  /* === Spacing === */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;
  --space-4xl: 40px;
}

/* Mini program viewport simulation */
html {
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  font-family: var(--font-body);
  color: var(--color-text-primary);
  background: var(--color-bg-page);
  line-height: var(--leading-body);
  margin: 0;
  padding: 0;
  max-width: 375px;
  margin: 0 auto;
  min-height: 100vh;
}

.page-container {
  padding-bottom: calc(60px + env(safe-area-inset-bottom));
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>
      <!-- Status bar spacer -->
      <div style="height: 44px;"></div>

      <!-- WeChat navigation bar -->
      <header class="sticky top-0 z-30" style="border-bottom: 1px solid var(--color-border-light); background: rgba(248, 250, 252, 0.95); backdrop-filter: blur(12px);">
        <div class="flex items-center px-4" style="height: 44px;">
          <div class="flex items-center justify-start" style="width: 88px;">
            <button data-dom-id="back-profile-credit" class="inline-flex items-center justify-center" style="width: 32px; height: 32px; border-radius: var(--radius-lg); border: 1px solid var(--color-border-default); background: var(--color-bg-surface);" aria-label="返回">
              <i data-lucide="chevron-left" style="width: 16px; height: 16px; color: var(--color-text-primary);"></i>
            </button>
          </div>
          <div class="flex-1 text-center truncate" style="font-size: 16px; font-weight: var(--weight-semibold); letter-spacing: -0.02em; color: var(--color-text-primary);">信用中心</div>
          <div class="flex items-center justify-center" style="width: 88px; height: 32px; border-radius: var(--radius-full); border: 1px solid var(--color-border-default); background: rgba(248, 250, 252, 0.9); color: var(--color-text-primary);" aria-label="小程序菜单">
            <button class="flex items-center justify-center" style="flex: 1; height: 100%;" aria-label="更多">
              <i data-lucide="more-horizontal" style="width: 16px; height: 16px;"></i>
            </button>
            <span style="width: 1px; height: 16px; background: var(--color-border-default);" aria-hidden="true"></span>
            <button class="flex items-center justify-center" style="flex: 1; height: 100%;" aria-label="关闭">
              <i data-lucide="x" style="width: 16px; height: 16px;"></i>
            </button>
          </div>
        </div>
      </header>

      <!-- Page content -->
      <div class="page-container" style="padding: var(--space-lg) var(--space-lg) 0;">

        <!-- Credit score hero card -->
        <section style="background: var(--color-bg-surface); border-radius: var(--radius-xl); box-shadow: var(--shadow-elevated); padding: var(--space-3xl) var(--space-2xl); text-align: center; margin-bottom: var(--space-lg);">
          <!-- Circular progress indicator -->
          <div style="width: 140px; height: 140px; margin: 0 auto var(--space-lg); position: relative;">
            <svg width="140" height="140" viewBox="0 0 140 140" style="transform: rotate(-90deg);">
              <!-- Background ring -->
              <circle cx="70" cy="70" r="58" fill="none" stroke="#EEF2FF" stroke-width="10" />
              <!-- Progress ring with gradient -->
              <defs>
                <linearGradient id="credit-ring-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#6366F1" />
                  <stop offset="100%" stop-color="#8B5CF6" />
                </linearGradient>
              </defs>
              <circle cx="70" cy="70" r="58" fill="none" stroke="url(#credit-ring-gradient)" stroke-width="10" stroke-linecap="round" stroke-dasharray="364.42" stroke-dashoffset="29.15" />
            </svg>
            <!-- Score number centered -->
            <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(0deg); text-align: center;">
              <div style="font-size: 42px; font-weight: var(--weight-bold); color: var(--color-brand-primary); line-height: 1; font-family: var(--font-display);">92</div>
            </div>
          </div>
          <!-- Status text -->
          <div style="font-size: var(--text-title-lg); font-weight: var(--weight-semibold); color: var(--color-brand-primary); margin-bottom: var(--space-xs);">信用优秀</div>
          <!-- Comparison text -->
          <div style="font-size: var(--text-body-sm); color: var(--color-text-tertiary);">超过 85% 的用户</div>
        </section>

        <!-- Score breakdown card -->
        <section style="background: var(--color-bg-surface); border-radius: var(--radius-xl); box-shadow: var(--shadow-card); padding: var(--space-xl) var(--space-lg); margin-bottom: var(--space-lg);">
          <div style="font-size: var(--text-title-md); font-weight: var(--weight-semibold); color: var(--color-text-primary); margin-bottom: var(--space-lg);">信用评分构成</div>

          <!-- Metric row 1: 交付准时率 -->
          <div style="padding: var(--space-sm) 0; border-bottom: 1px solid var(--color-border-light);">
            <div class="flex items-center justify-between" style="margin-bottom: var(--space-xs);">
              <div class="flex items-center gap-2">
                <div style="width: 28px; height: 28px; border-radius: var(--radius-md); background: var(--color-brand-primary-light); display: flex; align-items: center; justify-content: center;">
                  <i data-lucide="clock" style="width: 14px; height: 14px; color: var(--color-brand-primary);"></i>
                </div>
                <span style="font-size: var(--text-body-md); color: var(--color-text-primary);">交付准时率</span>
              </div>
              <div class="flex items-center gap-1">
                <span style="font-size: var(--text-body-md); font-weight: var(--weight-semibold); color: var(--state-success);">95%</span>
                <span style="font-size: var(--text-caption); color: var(--color-text-tertiary);">权重30%</span>
              </div>
            </div>
            <div style="width: 100%; height: 6px; border-radius: var(--radius-full); background: var(--color-brand-primary-light); overflow: hidden;">
              <div style="width: 95%; height: 100%; border-radius: var(--radius-full); background: var(--state-success);"></div>
            </div>
          </div>

          <!-- Metric row 2: 好评率 -->
          <div style="padding: var(--space-sm) 0; border-bottom: 1px solid var(--color-border-light);">
            <div class="flex items-center justify-between" style="margin-bottom: var(--space-xs);">
              <div class="flex items-center gap-2">
                <div style="width: 28px; height: 28px; border-radius: var(--radius-md); background: var(--color-brand-primary-light); display: flex; align-items: center; justify-content: center;">
                  <i data-lucide="thumbs-up" style="width: 14px; height: 14px; color: var(--color-brand-primary);"></i>
                </div>
                <span style="font-size: var(--text-body-md); color: var(--color-text-primary);">好评率</span>
              </div>
              <div class="flex items-center gap-1">
                <span style="font-size: var(--text-body-md); font-weight: var(--weight-semibold); color: var(--state-success);">98%</span>
                <span style="font-size: var(--text-caption); color: var(--color-text-tertiary);">权重25%</span>
              </div>
            </div>
            <div style="width: 100%; height: 6px; border-radius: var(--radius-full); background: var(--color-brand-primary-light); overflow: hidden;">
              <div style="width: 98%; height: 100%; border-radius: var(--radius-full); background: var(--state-success);"></div>
            </div>
          </div>

          <!-- Metric row 3: 完成单数 -->
          <div style="padding: var(--space-sm) 0; border-bottom: 1px solid var(--color-border-light);">
            <div class="flex items-center justify-between" style="margin-bottom: var(--space-xs);">
              <div class="flex items-center gap-2">
                <div style="width: 28px; height: 28px; border-radius: var(--radius-md); background: var(--color-brand-primary-light); display: flex; align-items: center; justify-content: center;">
                  <i data-lucide="check-circle" style="width: 14px; height: 14px; color: var(--color-brand-primary);"></i>
                </div>
                <span style="font-size: var(--text-body-md); color: var(--color-text-primary);">完成单数</span>
              </div>
              <div class="flex items-center gap-1">
                <span style="font-size: var(--text-body-md); font-weight: var(--weight-semibold); color: var(--color-brand-primary);">47单</span>
                <span style="font-size: var(--text-caption); color: var(--color-text-tertiary);">权重20%</span>
              </div>
            </div>
            <div style="width: 100%; height: 6px; border-radius: var(--radius-full); background: var(--color-brand-primary-light); overflow: hidden;">
              <div style="width: 78%; height: 100%; border-radius: var(--radius-full); background: linear-gradient(90deg, var(--color-brand-primary), var(--color-brand-gradient-end));"></div>
            </div>
          </div>

          <!-- Metric row 4: 响应速度 -->
          <div style="padding: var(--space-sm) 0; border-bottom: 1px solid var(--color-border-light);">
            <div class="flex items-center justify-between" style="margin-bottom: var(--space-xs);">
              <div class="flex items-center gap-2">
                <div style="width: 28px; height: 28px; border-radius: var(--radius-md); background: var(--color-brand-primary-light); display: flex; align-items: center; justify-content: center;">
                  <i data-lucide="zap" style="width: 14px; height: 14px; color: var(--color-brand-primary);"></i>
                </div>
                <span style="font-size: var(--text-body-md); color: var(--color-text-primary);">响应速度</span>
              </div>
              <div class="flex items-center gap-1">
                <span style="font-size: var(--text-body-md); font-weight: var(--weight-semibold); color: var(--color-brand-primary);">平均12分钟</span>
                <span style="font-size: var(--text-caption); color: var(--color-text-tertiary);">权重15%</span>
              </div>
            </div>
            <div style="width: 100%; height: 6px; border-radius: var(--radius-full); background: var(--color-brand-primary-light); overflow: hidden;">
              <div style="width: 85%; height: 100%; border-radius: var(--radius-full); background: linear-gradient(90deg, var(--color-brand-primary), var(--color-brand-gradient-end));"></div>
            </div>
          </div>

          <!-- Metric row 5: 纠纷率 -->
          <div style="padding: var(--space-sm) 0;">
            <div class="flex items-center justify-between" style="margin-bottom: var(--space-xs);">
              <div class="flex items-center gap-2">
                <div style="width: 28px; height: 28px; border-radius: var(--radius-md); background: var(--color-brand-primary-light); display: flex; align-items: center; justify-content: center;">
                  <i data-lucide="shield-check" style="width: 14px; height: 14px; color: var(--color-brand-primary);"></i>
                </div>
                <span style="font-size: var(--text-body-md); color: var(--color-text-primary);">纠纷率</span>
              </div>
              <div class="flex items-center gap-1">
                <span style="font-size: var(--text-body-md); font-weight: var(--weight-semibold); color: var(--state-success);">0%</span>
                <span style="font-size: var(--text-caption); color: var(--color-text-tertiary);">权重10%</span>
              </div>
            </div>
            <div style="width: 100%; height: 6px; border-radius: var(--radius-full); background: var(--color-brand-primary-light); overflow: hidden;">
              <div style="width: 0%; height: 100%; border-radius: var(--radius-full); background: var(--state-success);"></div>
            </div>
          </div>
        </section>

        <!-- Tips card -->
        <section style="background: var(--color-brand-primary-light); border-radius: var(--radius-xl); padding: var(--space-xl) var(--space-lg); margin-bottom: var(--space-3xl);">
          <div class="flex items-center gap-2" style="margin-bottom: var(--space-md);">
            <div style="width: 28px; height: 28px; border-radius: var(--radius-md); background: var(--color-brand-primary); display: flex; align-items: center; justify-content: center;">
              <i data-lucide="lightbulb" style="width: 14px; height: 14px; color: var(--color-text-inverse);"></i>
            </div>
            <div style="font-size: var(--text-title-md); font-weight: var(--weight-semibold); color: var(--color-brand-primary);">提升信用分的小贴士</div>
          </div>

          <!-- Tip 1 -->
          <div class="flex items-start gap-2" style="padding: var(--space-sm) 0;">
            <div style="min-width: 6px; width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--color-brand-primary); margin-top: 7px;"></div>
            <span style="font-size: var(--text-body-md); color: var(--color-text-secondary); line-height: var(--leading-body);">保持交付准时率在90%以上</span>
          </div>

          <!-- Tip 2 -->
          <div class="flex items-start gap-2" style="padding: var(--space-sm) 0;">
            <div style="min-width: 6px; width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--color-brand-primary); margin-top: 7px;"></div>
            <span style="font-size: var(--text-body-md); color: var(--color-text-secondary); line-height: var(--leading-body);">及时回复买家消息</span>
          </div>

          <!-- Tip 3 -->
          <div class="flex items-start gap-2" style="padding: var(--space-sm) 0;">
            <div style="min-width: 6px; width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--color-brand-primary); margin-top: 7px;"></div>
            <span style="font-size: var(--text-body-md); color: var(--color-text-secondary); line-height: var(--leading-body);">减少取消订单次数</span>
          </div>
        </section>

      </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
