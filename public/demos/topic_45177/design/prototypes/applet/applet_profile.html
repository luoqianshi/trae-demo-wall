<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>选手服务小程序 - 个人中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../global-loading.css">
    <script src="../global-loading.js"></script>
    <script src="../global-system-switch.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');
        * { font-family: 'Noto Sans SC', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #E8E8E8; }
        .phone-frame { width: 375px; height: 812px; background: #F5F5F5; border-radius: 44px; box-shadow: 0 40px 80px rgba(0,0,0,0.18); overflow: hidden; position: relative; }
        :root { --brand: #FF6B35; --brand-dark: #E85A25; --brand-light: #FFF5F0; --brand-soft: #FFE8DC; --bg: #F5F5F5; --card: #FFFFFF; --text-1: #1A1A1A; --text-2: #666666; --text-3: #999999; --text-4: #CCCCCC; }
        .text-brand { color: var(--brand); }
        .bg-brand { background: var(--brand); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .tap { transition: opacity 0.15s; cursor: pointer; }
        .tap:active { opacity: 0.7; }
        .tab-bar { background: var(--card); border-top: 0.5px solid rgba(0,0,0,0.06); }
        .tab-item { color: var(--text-3); transition: color 0.2s; }
        .tab-item.active { color: var(--brand); }
        .menu-item { transition: background 0.15s; }
        .menu-item:active { background: #F9F9F9; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

<div class="phone-frame flex flex-col">

    <!-- 主内容 -->
    <div class="flex-1 overflow-y-auto hide-scrollbar" style="background:var(--bg);">

        <!-- 用户信息头部 -->
        <div style="background:var(--card);" class="relative overflow-hidden">
            <!-- 装饰背景 -->
            <div class="absolute top-0 right-0 w-40 h-40 rounded-full" style="background:var(--brand-light); filter:blur(50px); opacity:0.6; transform:translate(30%,-30%);"></div>

            <!-- 状态栏 -->
            <div class="flex items-center justify-between px-7 pt-3" style="height:48px;">
                <span class="text-sm font-semibold" style="color:var(--text-1);">9:41</span>
                <div class="flex items-center gap-1.5">
                    <i class="fas fa-signal text-xs" style="color:var(--text-2);"></i>
                    <i class="fas fa-wifi text-xs" style="color:var(--text-2);"></i>
                    <i class="fas fa-battery-full text-xs" style="color:var(--text-2);"></i>
                </div>
            </div>

            <!-- 用户信息 -->
            <div class="px-5 pt-2 pb-5 flex items-center gap-4">
                <div class="w-16 h-16 rounded-full overflow-hidden flex-shrink-0 ring-2 ring-white shadow-md">
                    <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=128&h=128&fit=crop&crop=face" class="w-full h-full object-cover" alt="头像">
                </div>
                <div class="flex-1 min-w-0">
                    <h2 class="font-bold text-lg" style="color:var(--text-1);">张明远</h2>
                    <div class="text-xs mt-0.5" style="color:var(--text-3);">ID: 20260001</div>
                </div>
                <button class="w-8 h-8 rounded-full flex items-center justify-center tap" style="background:var(--bg);" onclick="showToast('设置页面开发中')">
                    <i class="fas fa-cog text-sm" style="color:var(--text-3);"></i>
                </button>
            </div>
        </div>

        <!-- 数据统计 -->
        <div class="px-5 -mt-0 mb-3" style="background:var(--card);">
            <div class="flex items-center py-4 border-t" style="border-color:rgba(0,0,0,0.04);">
                <div class="flex-1 text-center">
                    <div class="text-brand font-bold text-xl">5</div>
                    <div class="text-[11px] mt-0.5" style="color:var(--text-3);">参赛</div>
                </div>
                <div class="w-px h-8" style="background:#E5E5E5;"></div>
                <div class="flex-1 text-center">
                    <div class="text-brand font-bold text-xl">3</div>
                    <div class="text-[11px] mt-0.5" style="color:var(--text-3);">完赛</div>
                </div>
                <div class="w-px h-8" style="background:#E5E5E5;"></div>
                <div class="flex-1 text-center">
                    <div class="text-brand font-bold text-xl">1</div>
                    <div class="text-[11px] mt-0.5" style="color:var(--text-3);">PB</div>
                </div>
                <div class="w-px h-8" style="background:#E5E5E5;"></div>
                <div class="flex-1 text-center">
                    <div class="text-brand font-bold text-xl">128</div>
                    <div class="text-[11px] mt-0.5" style="color:var(--text-3);">km</div>
                </div>
            </div>
        </div>

        <!-- 快捷功能 -->
        <div style="background:var(--card);" class="mx-5 rounded-2xl p-4 mb-3">
            <div class="grid grid-cols-4 gap-2">
                <button class="flex flex-col items-center py-2 tap" onclick="location.href='applet_register.html'">
                    <div class="w-10 h-10 rounded-xl flex items-center justify-center mb-1.5" style="background:var(--brand-light);"><i class="fas fa-pen-to-square text-brand text-sm"></i></div>
                    <span class="text-[11px]" style="color:var(--text-2);">我的报名</span>
                </button>
                <button class="flex flex-col items-center py-2 tap" onclick="location.href='applet_results.html'">
                    <div class="w-10 h-10 rounded-xl flex items-center justify-center mb-1.5" style="background:#ECFDF5;"><i class="fas fa-trophy text-sm" style="color:#059669;"></i></div>
                    <span class="text-[11px]" style="color:var(--text-2);">成绩证书</span>
                </button>
                <button class="flex flex-col items-center py-2 tap" onclick="showToast('领物功能开发中')">
                    <div class="w-10 h-10 rounded-xl flex items-center justify-center mb-1.5" style="background:#FEF3C7;"><i class="fas fa-box-open text-sm" style="color:#D97706;"></i></div>
                    <span class="text-[11px]" style="color:var(--text-2);">领物码</span>
                </button>
                <button class="flex flex-col items-center py-2 tap" onclick="showToast('收藏功能开发中')">
                    <div class="w-10 h-10 rounded-xl flex items-center justify-center mb-1.5" style="background:#EFF6FF;"><i class="fas fa-heart text-sm" style="color:#3B82F6;"></i></div>
                    <span class="text-[11px]" style="color:var(--text-2);">收藏</span>
                </button>
            </div>
        </div>

        <!-- 即将参赛 -->
        <div class="px-5 mb-3">
            <div class="flex items-center justify-between mb-2.5">
                <h3 class="font-bold text-sm" style="color:var(--text-1);">即将参赛</h3>
                <button class="text-[11px] tap" style="color:var(--brand);" onclick="location.href='applet_register.html'">查看全部 <i class="fas fa-chevron-right text-[9px]"></i></button>
            </div>
            <div style="background:var(--card);" class="rounded-2xl p-4 tap" onclick="location.href='applet_race.html'">
                <div class="flex items-center gap-3">
                    <div class="w-14 h-14 rounded-xl overflow-hidden flex-shrink-0">
                        <img src="https://images.unsplash.com/photo-1513593771513-7b58b6c4af38?w=112&h=112&fit=crop" class="w-full h-full object-cover" alt="成都马拉松">
                    </div>
                    <div class="flex-1 min-w-0">
                        <h4 class="font-bold text-[13px] truncate" style="color:var(--text-1);">2026成都马拉松</h4>
                        <div class="text-[11px] mt-0.5" style="color:var(--text-3);">半程马拉松</div>
                        <div class="flex items-center gap-2 mt-1">
                            <span class="text-[10px] px-2 py-0.5 rounded-full font-medium" style="background:var(--brand-light); color:var(--brand);">已报名</span>
                            <span class="text-[10px]" style="color:var(--text-3);">2026.10.20</span>
                        </div>
                    </div>
                    <i class="fas fa-chevron-right text-xs" style="color:var(--text-4);"></i>
                </div>
            </div>
        </div>

        <!-- 最近完赛 -->
        <div class="px-5 mb-3">
            <div class="flex items-center justify-between mb-2.5">
                <h3 class="font-bold text-sm" style="color:var(--text-1);">最近完赛</h3>
                <button class="text-[11px] tap" style="color:var(--brand);" onclick="location.href='applet_results.html'">查看全部 <i class="fas fa-chevron-right text-[9px]"></i></button>
            </div>
            <div style="background:var(--card);" class="rounded-2xl p-4 tap" onclick="location.href='applet_results.html'">
                <div class="flex items-center gap-3">
                    <div class="w-14 h-14 rounded-xl overflow-hidden flex-shrink-0">
                        <img src="https://images.unsplash.com/photo-1552674605-db6ffd4facb5?w=112&h=112&fit=crop" class="w-full h-full object-cover" alt="崇礼168">
                    </div>
                    <div class="flex-1 min-w-0">
                        <h4 class="font-bold text-[13px] truncate" style="color:var(--text-1);">崇礼168超级越野赛</h4>
                        <div class="text-[11px] mt-0.5" style="color:var(--text-3);">100km · 2025.07.20</div>
                        <div class="flex items-center gap-2 mt-1">
                            <span class="text-[10px] px-2 py-0.5 rounded-full font-medium" style="background:#ECFDF5; color:#059669;">已完赛</span>
                            <span class="text-[10px] font-medium" style="color:var(--text-2);">23:45:12</span>
                        </div>
                    </div>
                    <i class="fas fa-chevron-right text-xs" style="color:var(--text-4);"></i>
                </div>
            </div>
        </div>

        <!-- 功能菜单 -->
        <div style="background:var(--card);" class="mx-5 rounded-2xl overflow-hidden mb-6">
            <div class="menu-item flex items-center justify-between px-4 py-3.5 tap" onclick="showToast('个人信息编辑')">
                <div class="flex items-center gap-3"><i class="fas fa-user-edit text-sm" style="color:var(--brand); width:20px; text-align:center;"></i><span class="text-[13px]" style="color:var(--text-1);">个人信息</span></div>
                <i class="fas fa-chevron-right text-[10px]" style="color:var(--text-4);"></i>
            </div>
            <div class="mx-4 h-px" style="background:#F5F5F5;"></div>
            <div class="menu-item flex items-center justify-between px-4 py-3.5 tap" onclick="showToast('紧急联系人')">
                <div class="flex items-center gap-3"><i class="fas fa-phone-alt text-sm" style="color:#EF4444; width:20px; text-align:center;"></i><span class="text-[13px]" style="color:var(--text-1);">紧急联系人</span></div>
                <i class="fas fa-chevron-right text-[10px]" style="color:var(--text-4);"></i>
            </div>
            <div class="mx-4 h-px" style="background:#F5F5F5;"></div>
            <div class="menu-item flex items-center justify-between px-4 py-3.5 tap" onclick="showToast('实名认证')">
                <div class="flex items-center gap-3"><i class="fas fa-shield-alt text-sm" style="color:#3B82F6; width:20px; text-align:center;"></i><span class="text-[13px]" style="color:var(--text-1);">实名认证</span></div>
                <div class="flex items-center gap-2"><span class="text-[11px]" style="color:#059669;">已认证</span><i class="fas fa-chevron-right text-[10px]" style="color:var(--text-4);"></i></div>
            </div>
            <div class="mx-4 h-px" style="background:#F5F5F5;"></div>
            <div class="menu-item flex items-center justify-between px-4 py-3.5 tap" onclick="showToast('消息通知')">
                <div class="flex items-center gap-3"><i class="fas fa-bell text-sm" style="color:#D97706; width:20px; text-align:center;"></i><span class="text-[13px]" style="color:var(--text-1);">消息通知</span></div>
                <div class="flex items-center gap-2"><span class="w-4 h-4 rounded-full text-[9px] font-bold flex items-center justify-center" style="background:#EF4444; color:#fff;">3</span><i class="fas fa-chevron-right text-[10px]" style="color:var(--text-4);"></i></div>
            </div>
            <div class="mx-4 h-px" style="background:#F5F5F5;"></div>
            <div class="menu-item flex items-center justify-between px-4 py-3.5 tap" onclick="showToast('帮助与反馈')">
                <div class="flex items-center gap-3"><i class="fas fa-question-circle text-sm" style="color:var(--text-3); width:20px; text-align:center;"></i><span class="text-[13px]" style="color:var(--text-1);">帮助与反馈</span></div>
                <i class="fas fa-chevron-right text-[10px]" style="color:var(--text-4);"></i>
            </div>
        </div>

    </div>

    <!-- 底部导航 -->
    <div class="tab-bar px-2 pt-1.5 pb-7">
        <div class="flex items-center justify-around">
            <div class="tab-item flex flex-col items-center py-1 px-4 tap" onclick="location.href='applet_home.html'"><i class="fas fa-home text-[18px]"></i><span class="text-[10px] mt-0.5 font-medium">首页</span></div>
            <div class="tab-item flex flex-col items-center py-1 px-4 tap" onclick="location.href='applet_events.html'"><i class="fas fa-flag-checkered text-[18px]"></i><span class="text-[10px] mt-0.5 font-medium">赛事</span></div>
            <div class="tab-item flex flex-col items-center py-1 px-4 tap" onclick="location.href='applet_register.html'"><i class="fas fa-pen-to-square text-[18px]"></i><span class="text-[10px] mt-0.5 font-medium">报名</span></div>
            <div class="tab-item flex flex-col items-center py-1 px-4 tap" onclick="location.href='applet_results.html'"><i class="fas fa-trophy text-[18px]"></i><span class="text-[10px] mt-0.5 font-medium">成绩</span></div>
            <div class="tab-item active flex flex-col items-center py-1 px-4 tap"><i class="fas fa-user text-[18px]"></i><span class="text-[10px] mt-0.5 font-medium">我的</span></div>
        </div>
    </div>

</div>

<script>
function showToast(msg) {
    var t = document.createElement('div');
    t.className = 'fixed bottom-24 left-1/2 -translate-x-1/2 z-50 bg-gray-800 text-white px-5 py-2.5 rounded-xl text-sm shadow-lg';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function() { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(function() { document.body.removeChild(t); }, 300); }, 1800);
}
</script>
</body>
</html>
