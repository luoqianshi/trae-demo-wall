<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>选手服务小程序 - 通用组件</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../global-loading.css">
    <script src="../global-system-switch.js"></script>
    <script src="../global-loading.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        
        * {
            font-family: 'Noto Sans SC', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
            min-height: 100vh;
        }
        
        .phone-frame {
            width: 375px;
            height: 812px;
            background: #fff;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            position: relative;
        }
        
        .safe-area-top {
            height: 44px;
        }
        
        .safe-area-bottom {
            height: 34px;
        }
        
        .gradient-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .card-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        
        .btn-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .tap-scale {
            transition: transform 0.2s ease;
        }
        
        .tap-scale:active {
            transform: scale(0.95);
        }
        
        .nav-item.active {
            color: #667eea;
        }
        
        .nav-item.active .nav-icon {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .toast {
            animation: slideUp 0.3s ease-out;
        }
        
        @keyframes slideUp {
            from {
                transform: translateY(100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .spinner {
            animation: spin 1s linear infinite;
        }
        
        .modal-overlay {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal-content {
            animation: fadeIn 0.2s ease-out;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 bg-gray-100">
    
    <div class="phone-frame flex flex-col bg-gray-50">
        
        <div class="absolute top-12 right-4 z-50 flex space-x-2">
            <button class="w-9 h-9 rounded-full bg-gray-800/90 flex items-center justify-center text-gray-800 text-xs tap-scale" onclick="goToSystemSelect()">
                <i class="fas fa-th-large"></i>
            </button>
            <div class="relative">
                <button class="w-9 h-9 rounded-full bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center text-gray-800 text-xs tap-scale" onclick="toggleSystemMenu()">
                    <i class="fas fa-exchange-alt"></i>
                </button>
                <div id="systemMenu" class="absolute right-0 mt-2 w-48 bg-slate-900/95 border border-purple-400/30 rounded-lg shadow-xl z-50 hidden">
                    <div class="p-2">
                        <button class="w-full text-left px-4 py-2 text-sm text-slate-300 hover:bg-cyan-500/20 rounded flex items-center" onclick="switchToCommandSystem()">
                            <i class="fas fa-tachometer-alt mr-2"></i>
                            指挥调度系统
                        </button>
                        <button class="w-full text-left px-4 py-2 text-sm text-slate-300 hover:bg-blue-500/20 rounded flex items-center" onclick="switchToOperationSystem()">
                            <i class="fas fa-calendar-check-o mr-2"></i>
                            运营管理系统
                        </button>
                        <button class="w-full text-left px-4 py-2 text-sm text-slate-300 hover:bg-emerald-500/20 rounded flex items-center" onclick="switchToDeviceSystem()">
                            <i class="fas fa-cube mr-2"></i>
                            设备管理平台
                        </button>
                        <button class="w-full text-left px-4 py-2 text-sm text-purple-300 hover:bg-purple-500/20 rounded flex items-center" onclick="switchToAppletSystem()">
                            <i class="fas fa-mobile-alt mr-2"></i>
                            选手服务小程序
                            <span class="ml-auto text-xs text-purple-400">当前</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="safe-area-top bg-white flex items-center justify-between px-6 pt-10">
            <div class="text-sm font-medium text-gray-800">9:41</div>
            <div class="flex items-center space-x-1">
                <i class="fas fa-signal text-gray-600 text-xs"></i>
                <i class="fas fa-wifi text-gray-600 text-xs"></i>
                <i class="fas fa-battery-full text-gray-600 text-xs"></i>
            </div>
        </div>
        
        <div class="flex-1 overflow-y-auto bg-gray-50">
            
            <div class="gradient-header px-4 pb-6 pt-4">
                <h1 class="text-xl font-bold text-gray-800 mb-2">通用组件</h1>
                <p class="text-sm text-gray-800/80">点击下方按钮查看不同组件效果</p>
            </div>
            
            <div class="px-4 mt-4 space-y-4">
                
                <div class="bg-white rounded-2xl p-4 card-shadow">
                    <h3 class="text-base font-bold text-gray-800 mb-3">
                        <i class="fas fa-comment-dots text-purple-500 mr-2"></i>
                        Toast 消息提示
                    </h3>
                    <div class="space-y-2">
                        <button class="w-full px-4 py-3 bg-gradient-to-r from-green-400 to-green-500 text-gray-800 text-sm font-bold rounded-xl tap-scale" onclick="showToast('success')">
                            成功提示
                        </button>
                        <button class="w-full px-4 py-3 bg-gradient-to-r from-blue-400 to-blue-500 text-gray-800 text-sm font-bold rounded-xl tap-scale" onclick="showToast('info')">
                            信息提示
                        </button>
                        <button class="w-full px-4 py-3 bg-gradient-to-r from-red-400 to-red-500 text-gray-800 text-sm font-bold rounded-xl tap-scale" onclick="showToast('error')">
                            错误提示
                        </button>
                    </div>
                </div>
                
                <div class="bg-white rounded-2xl p-4 card-shadow">
                    <h3 class="text-base font-bold text-gray-800 mb-3">
                        <i class="fas fa-question-circle text-blue-500 mr-2"></i>
                        确认弹窗
                    </h3>
                    <button class="w-full px-4 py-3 btn-gradient text-gray-800 text-sm font-bold rounded-xl tap-scale" onclick="showConfirmModal()">
                        显示确认弹窗
                    </button>
                </div>
                
                <div class="bg-white rounded-2xl p-4 card-shadow">
                    <h3 class="text-base font-bold text-gray-800 mb-3">
                        <i class="fas fa-spinner text-purple-500 mr-2"></i>
                        加载状态
                    </h3>
                    <button class="w-full px-4 py-3 bg-gradient-to-r from-purple-400 to-purple-500 text-gray-800 text-sm font-bold rounded-xl tap-scale" onclick="showLoading()">
                        显示加载状态
                    </button>
                </div>
                
                <div class="bg-white rounded-2xl p-4 card-shadow">
                    <h3 class="text-base font-bold text-gray-800 mb-3">
                        <i class="fas fa-inbox text-gray-500 mr-2"></i>
                        无数据状态
                    </h3>
                    <button class="w-full px-4 py-3 bg-gradient-to-r from-gray-400 to-gray-500 text-gray-800 text-sm font-bold rounded-xl tap-scale" onclick="showEmptyState()">
                        显示空状态
                    </button>
                </div>
                
            </div>
            
        </div>
        
        <div class="bg-white border-t border-gray-100 px-6 py-2 safe-area-bottom">
            <div class="flex items-center justify-around">
                <div class="nav-item flex flex-col items-center tap-scale text-gray-600" onclick="location.href='applet_home.html'">
                    <div class="nav-icon w-7 h-7 rounded-lg flex items-center justify-center mb-0.5">
                        <i class="fas fa-home text-lg"></i>
                    </div>
                    <span class="text-xs font-medium">首页</span>
                </div>
                <div class="nav-item flex flex-col items-center tap-scale text-gray-600" onclick="location.href='applet_race.html'">
                    <div class="nav-icon w-7 h-7 rounded-lg flex items-center justify-center mb-0.5">
                        <i class="fas fa-map-marked-alt text-lg"></i>
                    </div>
                    <span class="text-xs font-medium">赛中</span>
                </div>
                <div class="nav-item flex flex-col items-center tap-scale text-gray-600" onclick="location.href='applet_results.html'">
                    <div class="nav-icon w-7 h-7 rounded-lg flex items-center justify-center mb-0.5">
                        <i class="fas fa-trophy text-lg"></i>
                    </div>
                    <span class="text-xs font-medium">成绩</span>
                </div>
                <div class="nav-item flex flex-col items-center tap-scale text-gray-600" onclick="location.href='applet_profile.html'">
                    <div class="nav-icon w-7 h-7 rounded-lg flex items-center justify-center mb-0.5">
                        <i class="fas fa-user text-lg"></i>
                    </div>
                    <span class="text-xs font-medium">我的</span>
                </div>
            </div>
        </div>
        
    </div>
    
    <div id="toastContainer" class="fixed bottom-20 left-1/2 transform -translate-x-1/2 z-50 pointer-events-none"></div>
    
    <div id="confirmModal" class="fixed inset-0 modal-overlay z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full modal-content">
            <div class="p-6">
                <div class="text-center mb-4">
                    <div class="w-16 h-16 mx-auto rounded-full bg-purple-100 flex items-center justify-center mb-3">
                        <i class="fas fa-question text-purple-600 text-2xl"></i>
                    </div>
                    <h3 class="text-lg font-bold text-gray-800 mb-2">确认操作</h3>
                    <p class="text-sm text-gray-700">确定要取消预约吗？此操作无法撤销。</p>
                </div>
            </div>
            <div class="flex space-x-3 px-4 pb-4">
                <button class="flex-1 px-4 py-3 bg-gray-100 text-gray-700 text-sm font-bold rounded-xl tap-scale hover:bg-gray-200 transition" onclick="hideConfirmModal()">
                    取消
                </button>
                <button class="flex-1 px-4 py-3 btn-gradient text-gray-800 text-sm font-bold rounded-xl tap-scale" onclick="hideConfirmModal()">
                    确认
                </button>
            </div>
        </div>
    </div>
    
    <div id="loadingOverlay" class="fixed inset-0 bg-white/90 z-50 hidden flex items-center justify-center">
        <div class="text-center">
            <div class="w-16 h-16 mx-auto mb-4 relative">
                <div class="absolute inset-0 border-4 border-purple-200 rounded-full"></div>
                <div class="absolute inset-0 border-4 border-purple-600 rounded-full spinner border-t-transparent"></div>
            </div>
            <p class="text-base font-medium text-gray-800">加载中...</p>
        </div>
    </div>
    
    <div id="emptyStateModal" class="fixed inset-0 modal-overlay z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full modal-content">
            <div class="p-8 text-center">
                <div class="w-32 h-32 mx-auto mb-6 rounded-full bg-gradient-to-br from-purple-100 to-pink-100 flex items-center justify-center">
                    <i class="fas fa-running text-purple-400 text-5xl"></i>
                </div>
                <h3 class="text-lg font-bold text-gray-800 mb-2">暂无赛事记录</h3>
                <p class="text-sm text-gray-700 mb-6">您还没有绑定任何赛事，快去绑定吧！</p>
                <button class="w-full px-4 py-3 btn-gradient text-gray-800 text-sm font-bold rounded-xl tap-scale" onclick="hideEmptyState()">
                    去绑定赛事
                </button>
            </div>
        </div>
    </div>
    
    <script>
        function toggleSystemMenu() {
            const menu = document.getElementById('systemMenu');
            menu.classList.toggle('hidden');
        }
        
        function showToast(type) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            let bgColor, icon, message;
            switch(type) {
                case 'success':
                    bgColor = 'bg-green-500';
                    icon = 'fa-check-circle';
                    message = '操作成功';
                    break;
                case 'info':
                    bgColor = 'bg-blue-500';
                    icon = 'fa-info-circle';
                    message = '预约成功';
                    break;
                case 'error':
                    bgColor = 'bg-red-500';
                    icon = 'fa-times-circle';
                    message = '操作失败';
                    break;
            }
            
            toast.className = `toast ${bgColor} text-gray-800 px-6 py-3 rounded-xl shadow-lg flex items-center space-x-2 mb-2`;
            toast.innerHTML = `
                <i class="fas ${icon}"></i>
                <span class="font-medium">${message}</span>
            `;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(20px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => {
                    container.removeChild(toast);
                }, 300);
            }, 2000);
        }
        
        function showConfirmModal() {
            document.getElementById('confirmModal').classList.remove('hidden');
        }
        
        function hideConfirmModal() {
            document.getElementById('confirmModal').classList.add('hidden');
        }
        
        function showLoading() {
            const overlay = document.getElementById('loadingOverlay');
            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 2000);
        }
        
        function showEmptyState() {
            document.getElementById('emptyStateModal').classList.remove('hidden');
        }
        
        function hideEmptyState() {
            document.getElementById('emptyStateModal').classList.add('hidden');
        }
        
        document.addEventListener('click', function(e) {
            const menu = document.getElementById('systemMenu');
            const button = e.target.closest('button');
            if (!menu.contains(e.target) && !button?.onclick?.toString().includes('toggleSystemMenu')) {
                menu.classList.add('hidden');
            }
        });
        
        document.getElementById('confirmModal').addEventListener('click', function(e) {
            if (e.target === this) {
                hideConfirmModal();
            }
        });
        
        document.getElementById('emptyStateModal').addEventListener('click', function(e) {
            if (e.target === this) {
                hideEmptyState();
            }
        });
    </script>
    
</body>
</html>
