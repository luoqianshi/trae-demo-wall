<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧赛事服务系统 - 统一登录入口</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- 自定义配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0F172A',
                        secondary: '#334155',
                        accent: '#0369A1',
                        success: '#22C55E',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                        dark: '#020617',
                        'dark-light': '#0F172A',
                        'dark-lighter': '#334155'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .bg-gradient-dark {
                background: linear-gradient(135deg, #020617 0%, #0F172A 100%);
            }
            .border-glow {
                box-shadow: 0 0 15px rgba(3, 105, 161, 0.5);
            }
            .text-glow {
                text-shadow: 0 0 10px rgba(3, 105, 161, 0.7);
            }
            .btn-primary {
                @apply bg-accent text-gray-800 px-4 py-2 rounded-md hover:bg-accent/90 transition-colors duration-300;
            }
            .btn-secondary {
                @apply bg-secondary text-gray-800 px-4 py-2 rounded-md hover:bg-secondary/80 transition-colors duration-300;
            }
        }
    </style>
    <script>
        // 系统切换功能
        document.addEventListener('DOMContentLoaded', function() {
            const commandSystemCard = document.querySelector('.group:nth-child(1)');
            const operationSystemCard = document.querySelector('.group:nth-child(2)');
            const appletSystemCard = document.querySelector('.group:nth-child(3)');
            const deviceSystemCard = document.querySelector('.group:nth-child(4)');
            const commandSystemBtn = commandSystemCard.querySelector('button');
            const operationSystemBtn = operationSystemCard.querySelector('button');
            const appletSystemBtn = appletSystemCard.querySelector('button');
            const deviceSystemBtn = deviceSystemCard.querySelector('button');
            
            // 系统选择状态管理
            let selectedSystem = 'operation'; // 默认选择运营系统
            
            // 系统切换函数
            function switchSystem(system) {
                selectedSystem = system;
                
                // 重置所有卡片样式
                [commandSystemCard, operationSystemCard, appletSystemCard, deviceSystemCard].forEach(card => {
                    card.classList.remove('border-2', 'border-accent', 'border-2', 'border-emerald-500', 'border-2', 'border-purple-500');
                    card.classList.add('border', 'border-light-darker');
                });
                
                // 重置所有按钮样式
                [commandSystemBtn, operationSystemBtn].forEach(btn => {
                    btn.classList.remove('bg-accent', 'text-gray-800', 'bg-emerald-500', 'bg-purple-500');
                    btn.classList.add('bg-accent/20', 'text-accent');
                });
                appletSystemBtn.classList.remove('bg-purple-500', 'text-gray-800');
                appletSystemBtn.classList.add('bg-purple-500/20', 'text-purple-400');
                deviceSystemBtn.classList.remove('bg-emerald-500', 'text-gray-800');
                deviceSystemBtn.classList.add('bg-emerald-500/20', 'text-emerald-400');
                
                // 设置选中系统样式
                if (system === 'command') {
                    commandSystemCard.classList.remove('border', 'border-light-darker');
                    commandSystemCard.classList.add('border-2', 'border-accent');
                    commandSystemBtn.classList.remove('bg-accent/20', 'text-accent');
                    commandSystemBtn.classList.add('bg-accent', 'text-gray-800');
                } else if (system === 'applet') {
                    appletSystemCard.classList.remove('border', 'border-light-darker');
                    appletSystemCard.classList.add('border-2', 'border-purple-500');
                    appletSystemBtn.classList.remove('bg-purple-500/20', 'text-purple-400');
                    appletSystemBtn.classList.add('bg-purple-500', 'text-gray-800');
                } else if (system === 'device') {
                    deviceSystemCard.classList.remove('border', 'border-light-darker');
                    deviceSystemCard.classList.add('border-2', 'border-emerald-500');
                    deviceSystemBtn.classList.remove('bg-emerald-500/20', 'text-emerald-400');
                    deviceSystemBtn.classList.add('bg-emerald-500', 'text-gray-800');
                } else {
                    operationSystemCard.classList.remove('border', 'border-light-darker');
                    operationSystemCard.classList.add('border-2', 'border-accent');
                    operationSystemBtn.classList.remove('bg-accent/20', 'text-accent');
                    operationSystemBtn.classList.add('bg-accent', 'text-gray-800');
                }
            }
            
            // 绑定系统选择事件
            commandSystemCard.addEventListener('click', function() {
                switchSystem('command');
            });
            
            commandSystemBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                switchSystem('command');
            });
            
            operationSystemCard.addEventListener('click', function() {
                switchSystem('operation');
            });
            
            operationSystemBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                switchSystem('operation');
            });
            
            appletSystemCard.addEventListener('click', function() {
                switchSystem('applet');
            });
            
            appletSystemBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                switchSystem('applet');
            });
            
            deviceSystemCard.addEventListener('click', function() {
                switchSystem('device');
            });
            
            deviceSystemBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                switchSystem('device');
            });
            
            // 登录功能
            const loginForm = document.querySelector('form');
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                
                // 简单的登录验证
                if (username && password) {
                    // 根据选择的系统跳转到相应的首页
                    if (selectedSystem === 'command') {
                        window.location.href = 'command/dashboard.html';
                    } else if (selectedSystem === 'applet') {
                        window.location.href = 'applet/applet_home.html';
                    } else if (selectedSystem === 'device') {
                        window.location.href = 'device/device_home.html';
                    } else {
                        window.location.href = 'operation/event_management.html';
                    }
                } else {
                    alert('请输入用户名和密码');
                }
            });
            
            // 密码显示/隐藏功能
            const passwordInput = document.getElementById('password');
            const passwordToggle = passwordInput.nextElementSibling.querySelector('button');
            
            passwordToggle.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                const icon = passwordToggle.querySelector('i');
                icon.className = type === 'password' ? 'fa fa-eye' : 'fa fa-eye-slash';
            });
        });
    </script>
</head>
<body class="bg-gradient-dark min-h-screen flex items-center justify-center p-4">
    <div class="max-w-6xl w-full flex flex-col md:flex-row gap-8">
        <!-- 左侧系统选择 -->
        <div class="md:w-1/2">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-8 text-center text-glow">
                <i class="fa fa-trophy mr-3 text-accent"></i>智慧赛事服务系统
            </h1>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- 1. 赛事指挥调度系统 -->
                <div class="bg-light-light border border-light-darker rounded-lg p-5 hover:border-accent transition-all duration-300 cursor-pointer group">
                    <div class="flex items-center mb-3">
                        <div class="w-12 h-12 bg-gradient-to-br from-cyan-500 to-blue-600 rounded-full flex items-center justify-center mr-3">
                            <i class="fa fa-cogs text-xl text-gray-800 group-hover:scale-110 transition-transform duration-300"></i>
                        </div>
                        <h3 class="text-lg font-semibold text-gray-800">指挥调度系统</h3>
                    </div>
                    <p class="text-gray-600 text-sm mb-3">实时监控赛事状态，智能调度资源</p>
                    <div class="flex justify-between items-center">
                        <span class="text-xs text-gray-700">现场指挥</span>
                        <button class="px-3 py-1.5 bg-accent/20 text-accent rounded-md hover:bg-accent/30 transition-colors duration-300 text-xs font-medium">
                            选择
                        </button>
                    </div>
                </div>
                
                <!-- 2. 赛事运营管理系统 -->
                <div class="bg-light-light border-2 border-accent rounded-lg p-5 hover:border-glow transition-all duration-300 cursor-pointer group">
                    <div class="flex items-center mb-3">
                        <div class="w-12 h-12 bg-gradient-to-br from-blue-500 to-accent rounded-full flex items-center justify-center mr-3">
                            <i class="fa fa-line-chart text-xl text-gray-800 group-hover:scale-110 transition-transform duration-300"></i>
                        </div>
                        <h3 class="text-lg font-semibold text-gray-800">运营管理系统</h3>
                    </div>
                    <p class="text-gray-600 text-sm mb-3">全生命周期赛事管理，选手管理</p>
                    <div class="flex justify-between items-center">
                        <span class="text-xs text-gray-700">运营管理</span>
                        <button class="px-3 py-1.5 bg-accent text-gray-800 rounded-md hover:bg-accent/90 transition-colors duration-300 text-xs font-medium">
                            选择
                        </button>
                    </div>
                </div>
                
                <!-- 3. 选手服务小程序 -->
                <div class="bg-light-light border border-light-darker rounded-lg p-5 hover:border-purple-500 transition-all duration-300 cursor-pointer group">
                    <div class="flex items-center mb-3">
                        <div class="w-12 h-12 bg-gradient-to-br from-purple-500 to-pink-500 rounded-full flex items-center justify-center mr-3">
                            <i class="fa fa-mobile text-xl text-gray-800 group-hover:scale-110 transition-transform duration-300"></i>
                        </div>
                        <h3 class="text-lg font-semibold text-gray-800">选手服务小程序</h3>
                    </div>
                    <p class="text-gray-600 text-sm mb-3">赛事报名，成绩查询，选手社交</p>
                    <div class="flex justify-between items-center">
                        <span class="text-xs text-gray-700">选手端</span>
                        <button class="px-3 py-1.5 bg-purple-500/20 text-purple-400 rounded-md hover:bg-purple-500/30 transition-colors duration-300 text-xs font-medium">
                            选择
                        </button>
                    </div>
                </div>
                
                <!-- 4. 智能设备管理平台 -->
                <div class="bg-light-light border border-light-darker rounded-lg p-5 hover:border-emerald-500 transition-all duration-300 cursor-pointer group">
                    <div class="flex items-center mb-3">
                        <div class="w-12 h-12 bg-gradient-to-br from-emerald-500 to-teal-500 rounded-full flex items-center justify-center mr-3">
                            <i class="fa fa-cube text-xl text-gray-800 group-hover:scale-110 transition-transform duration-300"></i>
                        </div>
                        <h3 class="text-lg font-semibold text-gray-800">智能设备管理</h3>
                    </div>
                    <p class="text-gray-600 text-sm mb-3">设备全生命周期管理，远程运维</p>
                    <div class="flex justify-between items-center">
                        <span class="text-xs text-gray-700">设备管理</span>
                        <button class="px-3 py-1.5 bg-emerald-500/20 text-emerald-400 rounded-md hover:bg-emerald-500/30 transition-colors duration-300 text-xs font-medium">
                            选择
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- 系统介绍 -->
            <div class="mt-10 bg-light-light border border-light-darker rounded-lg p-6">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">四大子系统功能概览</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="flex items-start">
                        <i class="fa fa-check-circle text-cyan-400 mt-1 mr-3"></i>
                        <div>
                            <h4 class="text-sm font-medium text-gray-800">赛事指挥调度</h4>
                            <p class="text-xs text-gray-600">数字孪生大屏，实时监控指挥</p>
                        </div>
                    </div>
                    <div class="flex items-start">
                        <i class="fa fa-check-circle text-accent mt-1 mr-3"></i>
                        <div>
                            <h4 class="text-sm font-medium text-gray-800">赛事运营管理</h4>
                            <p class="text-xs text-gray-600">全流程赛事管理，数据统计</p>
                        </div>
                    </div>
                    <div class="flex items-start">
                        <i class="fa fa-check-circle text-purple-400 mt-1 mr-3"></i>
                        <div>
                            <h4 class="text-sm font-medium text-gray-800">选手服务小程序</h4>
                            <p class="text-xs text-gray-600">赛事报名，成绩查询，社交互动</p>
                        </div>
                    </div>
                    <div class="flex items-start">
                        <i class="fa fa-check-circle text-emerald-400 mt-1 mr-3"></i>
                        <div>
                            <h4 class="text-sm font-medium text-gray-800">智能设备管理</h4>
                            <p class="text-xs text-gray-600">设备资产管理，远程运维监控</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 右侧登录表单 -->
        <div class="md:w-1/2">
            <div class="bg-light-light border border-light-darker rounded-lg p-8 shadow-xl">
                <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">用户登录</h2>
                
                <!-- 登录表单 -->
                <form class="space-y-6">
                    <div>
                        <label for="username" class="block text-sm font-medium text-gray-600 mb-2">用户名</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fa fa-user text-gray-700"></i>
                            </div>
                            <input type="text" id="username" name="username" class="block w-full pl-10 pr-3 py-3 bg-light border border-light-darker rounded-md text-gray-800 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-accent focus:border-transparent transition-all duration-300" placeholder="请输入用户名">
                        </div>
                    </div>
                    
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-600 mb-2">密码</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fa fa-lock text-gray-700"></i>
                            </div>
                            <input type="password" id="password" name="password" class="block w-full pl-10 pr-10 py-3 bg-light border border-light-darker rounded-md text-gray-800 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-accent focus:border-transparent transition-all duration-300" placeholder="请输入密码">
                            <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
                                <button type="button" class="text-gray-600 hover:text-gray-800 transition-colors duration-300">
                                    <i class="fa fa-eye"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-accent focus:ring-accent border-light-darker rounded bg-light">
                            <label for="remember-me" class="ml-2 block text-sm text-gray-600">记住我</label>
                        </div>
                        <div class="text-sm">
                            <a href="#" class="font-medium text-accent hover:text-accent/80 transition-colors duration-300">忘记密码?</a>
                        </div>
                    </div>
                    
                    <div>
                        <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-gray-800 bg-accent hover:bg-accent/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-accent transition-all duration-300">
                            登录系统
                        </button>
                    </div>
                    
                    <div class="text-center text-sm text-gray-700">
                        <p>还没有账号? <a href="#" class="font-medium text-accent hover:text-accent/80 transition-colors duration-300">联系管理员</a></p>
                    </div>
                </form>
                
                <!-- 系统状态 -->
                <div class="mt-8 pt-6 border-t border-light-darker">
                    <h3 class="text-sm font-medium text-gray-600 mb-3">系统状态</h3>
                    <div class="flex items-center space-x-4 flex-wrap gap-y-2">
                        <div class="flex items-center">
                            <span class="w-2 h-2 bg-success rounded-full mr-2"></span>
                            <span class="text-xs text-gray-600">服务正常</span>
                        </div>
                        <div class="flex items-center">
                            <span class="w-2 h-2 bg-accent rounded-full mr-2"></span>
                            <span class="text-xs text-gray-600">在线用户: 36</span>
                        </div>
                        <div class="flex items-center">
                            <span class="w-2 h-2 bg-warning rounded-full mr-2"></span>
                            <span class="text-xs text-gray-600">系统版本: v1.1.0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
