<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快速配置向导 - 赛事运营管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0369A1;
            --primary-light: #0EA5E9;
            --primary-dark: #075985;
            --accent: #F59E0B;
            --bg-gradient-start: #F0F9FF;
            --bg-gradient-end: #E0F2FE;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
        }

        .guide-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .guide-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s ease;
        }

        .guide-card:hover::before {
            transform: scaleX(1);
        }

        .guide-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 50px -12px rgba(3, 105, 161, 0.25);
        }

        .icon-wrapper {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s ease;
            position: relative;
        }

        .guide-card:hover .icon-wrapper {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            transform: scale(1.05) rotate(-3deg);
        }

        .guide-card:hover .icon-wrapper i {
            color: white;
        }

        .step-number {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 32px;
            height: 32px;
            background: var(--accent);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
        }

        .btn-configure {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-configure::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .btn-configure:hover::before {
            left: 100%;
        }

        .btn-configure:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(3, 105, 161, 0.35);
        }

        .btn-configure:active {
            transform: translateY(0);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.6s ease forwards;
        }

        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }
        .delay-300 { animation-delay: 0.3s; }
        .delay-400 { animation-delay: 0.4s; }

        .decorative-circle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(3, 105, 161, 0.1), rgba(14, 165, 233, 0.1));
            pointer-events: none;
        }

        .progress-line {
            position: absolute;
            top: 50%;
            left: 100%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, var(--primary-light), transparent);
            opacity: 0.3;
        }

        .header-decoration {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle-line {
            width: 60px;
            height: 4px;
            background: linear-gradient(90deg, var(--accent), transparent);
            border-radius: 2px;
        }

        @media (max-width: 768px) {
            .progress-line {
                display: none;
            }
        }
    </style>
</head>
<body class="min-h-screen relative overflow-x-hidden">
    <div class="decorative-circle" style="width: 400px; height: 400px; top: -100px; right: -100px;"></div>
    <div class="decorative-circle" style="width: 300px; height: 300px; bottom: -50px; left: -50px;"></div>
    <div class="decorative-circle" style="width: 200px; height: 200px; top: 50%; left: 10%; opacity: 0.5;"></div>

    <div class="container mx-auto px-4 py-12 relative z-10">
        <div class="text-center mb-16 animate-fade-in-up">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-white shadow-lg mb-6 animate-float">
                <i class="fa fa-rocket text-3xl" style="color: var(--primary);"></i>
            </div>
            <h1 class="text-4xl md:text-5xl font-bold mb-4 header-decoration">
                快速配置向导
            </h1>
            <div class="subtitle-line mx-auto mb-4"></div>
            <p class="text-gray-600 text-lg max-w-2xl mx-auto">
                按照以下步骤快速完成赛事运营管理系统的核心配置，让您的赛事管理更加高效
            </p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8 max-w-7xl mx-auto">
            <div class="guide-card rounded-2xl p-8 opacity-0 animate-fade-in-up delay-100">
                <div class="relative mb-6">
                    <div class="icon-wrapper">
                        <i class="fa fa-trophy text-3xl" style="color: var(--primary);"></i>
                    </div>
                    <div class="step-number">1</div>
                </div>
                <h3 class="text-xl font-semibold text-gray-800 mb-3">赛事创建</h3>
                <p class="text-gray-600 text-sm leading-relaxed mb-6">
                    创建新的赛事活动，设置赛事基本信息、时间地点、规模等核心参数，为后续配置奠定基础
                </p>
                <button class="btn-configure w-full" onclick="goToConfig('event_management.html')">
                    <i class="fa fa-arrow-right mr-2"></i>去配置
                </button>
            </div>

            <div class="guide-card rounded-2xl p-8 opacity-0 animate-fade-in-up delay-200 relative">
                <div class="progress-line hidden lg:block"></div>
                <div class="relative mb-6">
                    <div class="icon-wrapper">
                        <i class="fa fa-tasks text-3xl" style="color: var(--primary);"></i>
                    </div>
                    <div class="step-number">2</div>
                </div>
                <h3 class="text-xl font-semibold text-gray-800 mb-3">项目（组别）创建</h3>
                <p class="text-gray-600 text-sm leading-relaxed mb-6">
                    为赛事添加比赛项目或组别，如全程马拉松、半程马拉松、10公里等，设置各组别参数
                </p>
                <button class="btn-configure w-full" onclick="goToConfig('event_project.html')">
                    <i class="fa fa-arrow-right mr-2"></i>去配置
                </button>
            </div>

            <div class="guide-card rounded-2xl p-8 opacity-0 animate-fade-in-up delay-300 relative">
                <div class="progress-line hidden lg:block"></div>
                <div class="relative mb-6">
                    <div class="icon-wrapper">
                        <i class="fa fa-users text-3xl" style="color: var(--primary);"></i>
                    </div>
                    <div class="step-number">3</div>
                </div>
                <h3 class="text-xl font-semibold text-gray-800 mb-3">选手信息录入</h3>
                <p class="text-gray-600 text-sm leading-relaxed mb-6">
                    导入或录入参赛选手信息，包括姓名、号码布、组别等，支持批量导入和手动添加
                </p>
                <button class="btn-configure w-full" onclick="goToConfig('runner_management.html')">
                    <i class="fa fa-arrow-right mr-2"></i>去配置
                </button>
            </div>

            <div class="guide-card rounded-2xl p-8 opacity-0 animate-fade-in-up delay-400 relative">
                <div class="progress-line hidden lg:block"></div>
                <div class="relative mb-6">
                    <div class="icon-wrapper">
                        <i class="fa fa-certificate text-3xl" style="color: var(--primary);"></i>
                    </div>
                    <div class="step-number">4</div>
                </div>
                <h3 class="text-xl font-semibold text-gray-800 mb-3">成绩证书配置</h3>
                <p class="text-gray-600 text-sm leading-relaxed mb-6">
                    配置成绩证书模板，设置证书样式、字段、Logo等，为完赛选手生成个性化证书
                </p>
                <button class="btn-configure w-full" onclick="goToConfig('result_certificate_config.html')">
                    <i class="fa fa-arrow-right mr-2"></i>去配置
                </button>
            </div>
        </div>

        <div class="text-center mt-16 animate-fade-in-up" style="animation-delay: 0.6s; opacity: 0;">
            <div class="inline-flex items-center space-x-2 text-gray-500 text-sm">
                <i class="fa fa-info-circle"></i>
                <span>完成以上配置后，即可开始使用计时、成绩管理等核心功能</span>
            </div>
        </div>

        <div class="mt-12 text-center animate-fade-in-up" style="animation-delay: 0.7s; opacity: 0;">
            <button onclick="skipGuide()" class="text-gray-500 hover:text-gray-700 transition-colors">
                <i class="fa fa-sign-out mr-2"></i>跳过向导，直接进入系统
            </button>
        </div>
    </div>

    <div id="toast" class="fixed bottom-8 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-lg shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none">
        <i class="fa fa-check-circle mr-2 text-green-400"></i>
        <span id="toast-message">正在跳转...</span>
    </div>

    <script>
        function goToConfig(page) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            
            toastMessage.textContent = '正在跳转到配置页面...';
            toast.style.opacity = '1';
            
            setTimeout(() => {
                toast.style.opacity = '0';
                console.log('跳转到: ' + page);
                window.location.href = page;
            }, 800);
        }

        function skipGuide() {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            
            toastMessage.textContent = '正在进入系统首页...';
            toast.style.opacity = '1';
            
            setTimeout(() => {
                toast.style.opacity = '0';
                window.location.href = 'event_management.html';
            }, 800);
        }

        document.addEventListener('DOMContentLoaded', function() {
            const cards = document.querySelectorAll('.guide-card');
            cards.forEach((card, index) => {
                setTimeout(() => {
                    card.style.opacity = '1';
                }, 100 + index * 100);
            });
        });
    </script>
</body>
</html>
