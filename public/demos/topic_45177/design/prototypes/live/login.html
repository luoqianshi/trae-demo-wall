<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 赛事数据直播平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="live-nav.css">
    <style>
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 50%, #f8fafc 100%);
            min-height: 100vh;
        }
        
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }
        
        .input-group {
            position: relative;
        }
        
        .input-group input:focus + .input-icon {
            color: #3b82f6;
        }
        
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 32px;
        }
        
        .step-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #e2e8f0;
            transition: all 0.3s ease;
        }
        
        .step-dot.active {
            background: #3b82f6;
            width: 32px;
            border-radius: 5px;
        }
        
        .step-dot.completed {
            background: #10b981;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    
    <!-- 背景装饰 -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-20 left-20 w-64 h-64 bg-blue-100 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-pulse"></div>
        <div class="absolute bottom-20 right-20 w-64 h-64 bg-purple-100 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-pulse" style="animation-delay: 1s;"></div>
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-teal-100 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse" style="animation-delay: 2s;"></div>
    </div>
    
    <!-- 登录卡片 -->
    <div class="login-card w-full max-w-md rounded-2xl p-8 relative z-10">
        
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-500 to-blue-600 mb-4 shadow-lg">
                <i class="fas fa-broadcast-tower text-white text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-900">赛事数据直播平台</h1>
            <p class="text-sm text-slate-500 mt-2">2026北京马拉松</p>
        </div>
        
        <!-- 步骤指示器 -->
        <div class="step-indicator">
            <div id="step1Dot" class="step-dot active"></div>
            <div id="step2Dot" class="step-dot"></div>
        </div>
        
        <!-- 步骤1: 邀请码验证 -->
        <div id="step1" class="fade-in">
            <div class="mb-6">
                <h2 class="text-lg font-semibold text-slate-900 mb-2">输入邀请码</h2>
                <p class="text-sm text-slate-500">请输入组委会提供的邀请码以访问直播平台</p>
            </div>
            
            <div class="input-group mb-4">
                <input type="text" id="inviteCode" placeholder="请输入邀请码" maxlength="8" class="input-field w-full pl-12 pr-4 py-3 text-center text-lg tracking-widest font-mono">
                <i class="fas fa-key input-icon absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400 transition"></i>
            </div>
            
            <button onclick="verifyInviteCode()" class="btn-primary w-full py-3 text-sm font-semibold">
                验证邀请码
            </button>
            
            <div class="mt-6 text-center">
                <p class="text-xs text-slate-400">
                    <i class="fas fa-info-circle mr-1"></i>
                    邀请码由组委会统一发放，如未收到请联系组委会
                </p>
            </div>
        </div>
        
        <!-- 步骤2: 手机号验证 -->
        <div id="step2" class="hidden">
            <div class="mb-6">
                <h2 class="text-lg font-semibold text-slate-900 mb-2">验证手机号</h2>
                <p class="text-sm text-slate-500">请输入您的手机号进行二次验证</p>
            </div>
            
            <div class="input-group mb-4">
                <input type="tel" id="phoneNumber" placeholder="请输入手机号" maxlength="11" class="input-field w-full pl-12 pr-4 py-3">
                <i class="fas fa-mobile-alt input-icon absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400 transition"></i>
            </div>
            
            <div class="flex gap-3 mb-4">
                <div class="input-group flex-1">
                    <input type="text" id="verifyCode" placeholder="验证码" maxlength="6" class="input-field w-full px-4 py-3 text-center tracking-widest font-mono">
                </div>
                <button id="sendCodeBtn" onclick="sendVerifyCode()" class="btn-secondary px-4 py-3 text-sm font-medium whitespace-nowrap">
                    发送验证码
                </button>
            </div>
            
            <button onclick="verifyPhone()" class="btn-primary w-full py-3 text-sm font-semibold">
                登录
            </button>
            
            <div class="mt-4">
                <button onclick="goBackToStep1()" class="w-full text-sm text-slate-500 hover:text-slate-700 transition">
                    <i class="fas fa-arrow-left mr-1"></i>
                    返回上一步
                </button>
            </div>
        </div>
        
        <!-- 底部信息 -->
        <div class="mt-8 pt-6 border-t border-slate-200">
            <div class="flex items-center justify-center space-x-4 text-xs text-slate-400">
                <span><i class="fas fa-shield-alt mr-1"></i>安全登录</span>
                <span>•</span>
                <span><i class="fas fa-lock mr-1"></i>数据加密</span>
                <span>•</span>
                <span><i class="fas fa-user-shield mr-1"></i>隐私保护</span>
            </div>
        </div>
        
    </div>
    
    <!-- 提示消息 -->
    <div id="toast" class="fixed top-4 right-4 bg-slate-800 text-white px-6 py-3 rounded-lg shadow-lg transform translate-x-full transition-transform duration-300 z-50">
        <div class="flex items-center space-x-2">
            <i id="toastIcon" class="fas fa-info-circle"></i>
            <span id="toastMessage">提示消息</span>
        </div>
    </div>
    
    <script>
        // 显示提示消息
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');
            
            toastMessage.textContent = message;
            
            // 设置图标和颜色
            toast.className = 'fixed top-4 right-4 px-6 py-3 rounded-lg shadow-lg transform transition-transform duration-300 z-50';
            
            switch(type) {
                case 'success':
                    toast.classList.add('bg-green-500', 'text-white');
                    toastIcon.className = 'fas fa-check-circle';
                    break;
                case 'error':
                    toast.classList.add('bg-red-500', 'text-white');
                    toastIcon.className = 'fas fa-times-circle';
                    break;
                default:
                    toast.classList.add('bg-slate-800', 'text-white');
                    toastIcon.className = 'fas fa-info-circle';
            }
            
            // 显示
            toast.classList.remove('translate-x-full');
            toast.classList.add('translate-x-0');
            
            // 3秒后隐藏
            setTimeout(() => {
                toast.classList.remove('translate-x-0');
                toast.classList.add('translate-x-full');
            }, 3000);
        }
        
        // 验证邀请码
        function verifyInviteCode() {
            const code = document.getElementById('inviteCode').value.trim();
            
            if (!code) {
                showToast('请输入邀请码', 'error');
                return;
            }
            
            if (code.length < 6) {
                showToast('邀请码格式不正确', 'error');
                return;
            }
            
            // 模拟验证（静态展示，默认通过）
            showToast('邀请码验证成功', 'success');
            
            // 切换到步骤2
            setTimeout(() => {
                document.getElementById('step1').classList.add('hidden');
                document.getElementById('step2').classList.remove('hidden');
                document.getElementById('step2').classList.add('fade-in');
                
                // 更新步骤指示器
                document.getElementById('step1Dot').classList.remove('active');
                document.getElementById('step1Dot').classList.add('completed');
                document.getElementById('step2Dot').classList.add('active');
            }, 1000);
        }
        
        // 发送验证码
        let countdown = 0;
        function sendVerifyCode() {
            const phone = document.getElementById('phoneNumber').value.trim();
            
            if (!phone) {
                showToast('请输入手机号', 'error');
                return;
            }
            
            if (!/^1[3-9]\d{9}$/.test(phone)) {
                showToast('手机号格式不正确', 'error');
                return;
            }
            
            if (countdown > 0) {
                return;
            }
            
            // 模拟发送验证码
            showToast('验证码已发送', 'success');
            
            // 开始倒计时
            countdown = 60;
            const btn = document.getElementById('sendCodeBtn');
            btn.disabled = true;
            btn.textContent = `${countdown}s`;
            
            const timer = setInterval(() => {
                countdown--;
                btn.textContent = `${countdown}s`;
                
                if (countdown <= 0) {
                    clearInterval(timer);
                    btn.disabled = false;
                    btn.textContent = '发送验证码';
                }
            }, 1000);
        }
        
        // 验证手机号
        function verifyPhone() {
            const phone = document.getElementById('phoneNumber').value.trim();
            const code = document.getElementById('verifyCode').value.trim();
            
            if (!phone) {
                showToast('请输入手机号', 'error');
                return;
            }
            
            if (!/^1[3-9]\d{9}$/.test(phone)) {
                showToast('手机号格式不正确', 'error');
                return;
            }
            
            if (!code) {
                showToast('请输入验证码', 'error');
                return;
            }
            
            if (code.length < 4) {
                showToast('验证码格式不正确', 'error');
                return;
            }
            
            // 模拟验证（静态展示，默认通过）
            showToast('登录成功，正在跳转...', 'success');
            
            // 跳转到主页面
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1500);
        }
        
        // 返回步骤1
        function goBackToStep1() {
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step1').classList.remove('hidden');
            document.getElementById('step1').classList.add('fade-in');
            
            // 更新步骤指示器
            document.getElementById('step1Dot').classList.remove('completed');
            document.getElementById('step1Dot').classList.add('active');
            document.getElementById('step2Dot').classList.remove('active');
        }
        
        // 输入框自动格式化
        document.getElementById('inviteCode').addEventListener('input', function(e) {
            this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
        });
        
        document.getElementById('phoneNumber').addEventListener('input', function(e) {
            this.value = this.value.replace(/\D/g, '');
        });
        
        document.getElementById('verifyCode').addEventListener('input', function(e) {
            this.value = this.value.replace(/\D/g, '');
        });
    </script>
    
</body>
</html>
