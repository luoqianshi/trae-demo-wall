<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全屏地图 - 赛事数据直播平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="live-nav.css">
    <script src="live-nav.js"></script>
    <style>
        body {
            background: #f8fafc;
            overflow: hidden;
        }
        
        .map-fullscreen{
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    
    <div class="map-fullscreen relative">
        
        <!-- 顶部工具栏 -->
        <div class="absolute top-0 left-0 right-0 z-20 bg-white/95 backdrop-blur border-b border-slate-200 px-6 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <button onclick="goToDashboard()" class="w-10 h-10 rounded-lg bg-slate-100 hover:bg-slate-200 flex items-center justify-center transition">
                    <i class="fas fa-arrow-left text-slate-600"></i>
                </button>
                <div>
                    <h1 class="text-lg font-bold text-slate-900">全屏地图视图</h1>
                    <p class="text-xs text-slate-500">2026北京马拉松</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-3">
                <div class="flex items-center space-x-2 text-sm text-slate-600">
                    <i class="fas fa-clock text-slate-400"></i>
                    <span id="systemTime" class="number-font font-medium">2026-04-20 08:30:45</span>
                </div>
                
                <button onclick="toggleFullscreen()" class="w-10 h-10 rounded-lg bg-slate-100 hover:bg-slate-200 flex items-center justify-center transition">
                    <i class="fas fa-compress text-slate-600"></i>
                </button>
            </div>
        </div>
        
        <!-- 地图容器 -->
        <div id="mapContainer" class="w-full h-full" data-scale="1">
            <svg class="w-full h-full" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
                <defs>
                    <linearGradient id="routeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#1e40af;stop-opacity:0.8" />
                        <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.8" />
                    </linearGradient>
                    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.1"/>
                    </filter>
                </defs>
                
                <!-- 背景网格 -->
                <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
                    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
                </pattern>
                <rect width="100%" height="100%" fill="url(#grid)" />
                
                <!-- 赛道线 -->
                <path d="M 150,950 Q 300,800 450,700 T 750,550 T 1050,400 T 1350,300 T 1600,200" 
                      stroke="url(#routeGradient)" 
                      stroke-width="8" 
                      fill="none" 
                      stroke-linecap="round"
                      filter="url(#shadow)"/>
                
                <!-- 起点 -->
                <g transform="translate(150, 950)">
                    <circle cx="0" cy="0" r="28" fill="#15803d" class="pulse-marker" style="transform-origin: center;"/>
                    <circle cx="0" cy="0" r="18" fill="white"/>
                    <text x="0" y="6" text-anchor="middle" fill="#15803d" font-size="20" font-weight="bold">🏁</text>
                    <text x="0" y="55" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="600">起点</text>
                </g>
                
                <!-- CP1 5km -->
                <g transform="translate(450, 700)">
                    <circle cx="0" cy="0" r="22" fill="#c2410c"/>
                    <circle cx="0" cy="0" r="14" fill="white"/>
                    <text x="0" y="5" text-anchor="middle" fill="#c2410c" font-size="16" font-weight="bold">5K</text>
                    <text x="0" y="45" text-anchor="middle" fill="#0f172a" font-size="15" font-weight="500">CP1</text>
                </g>
                
                <!-- CP2 10km -->
                <g transform="translate(750, 550)">
                    <circle cx="0" cy="0" r="22" fill="#c2410c"/>
                    <circle cx="0" cy="0" r="14" fill="white"/>
                    <text x="0" y="5" text-anchor="middle" fill="#c2410c" font-size="15" font-weight="bold">10K</text>
                    <text x="0" y="45" text-anchor="middle" fill="#0f172a" font-size="15" font-weight="500">CP2</text>
                </g>
                
                <!-- CP3 15km -->
                <g transform="translate(1050, 400)">
                    <circle cx="0" cy="0" r="22" fill="#c2410c"/>
                    <circle cx="0" cy="0" r="14" fill="white"/>
                    <text x="0" y="5" text-anchor="middle" fill="#c2410c" font-size="15" font-weight="bold">15K</text>
                    <text x="0" y="45" text-anchor="middle" fill="#0f172a" font-size="15" font-weight="500">CP3</text>
                </g>
                
                <!-- 半程点 -->
                <g transform="translate(1350, 300)">
                    <circle cx="0" cy="0" r="22" fill="#7c3aed"/>
                    <circle cx="0" cy="0" r="14" fill="white"/>
                    <text x="0" y="5" text-anchor="middle" fill="#7c3aed" font-size="14" font-weight="bold">半程</text>
                    <text x="0" y="45" text-anchor="middle" fill="#0f172a" font-size="15" font-weight="500">半程</text>
                </g>
                
                <!-- 终点 -->
                <g transform="translate(1600, 200)">
                    <circle cx="0" cy="0" r="28" fill="#dc2626" class="pulse-marker" style="transform-origin: center;"/>
                    <circle cx="0" cy="0" r="18" fill="white"/>
                    <text x="0" y="6" text-anchor="middle" fill="#dc2626" font-size="20" font-weight="bold">🏁</text>
                    <text x="0" y="55" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="600">终点</text>
                </g>
                
                <!-- 补给站 -->
                <g transform="translate(300, 850)">
                    <circle cx="0" cy="0" r="16" fill="white" stroke="#0d9488" stroke-width="3"/>
                    <text x="0" y="5" text-anchor="middle" fill="#0d9488" font-size="16">🍶</text>
                    <text x="0" y="35" text-anchor="middle" fill="#475569" font-size="13">补给站</text>
                </g>
                
                <g transform="translate(900, 480)">
                    <circle cx="0" cy="0" r="16" fill="white" stroke="#0d9488" stroke-width="3"/>
                    <text x="0" y="5" text-anchor="middle" fill="#0d9488" font-size="16">🍶</text>
                    <text x="0" y="35" text-anchor="middle" fill="#475569" font-size="13">补给站</text>
                </g>
                
                <!-- 医疗站 -->
                <g transform="translate(600, 620)">
                    <circle cx="0" cy="0" r="16" fill="white" stroke="#dc2626" stroke-width="3"/>
                    <text x="0" y="5" text-anchor="middle" fill="#dc2626" font-size="16">🏥</text>
                    <text x="0" y="35" text-anchor="middle" fill="#475569" font-size="13">医疗站</text>
                </g>
                
                <g transform="translate(1200, 350)">
                    <circle cx="0" cy="0" r="16" fill="white" stroke="#dc2626" stroke-width="3"/>
                    <text x="0" y="5" text-anchor="middle" fill="#dc2626" font-size="16">🏥</text>
                    <text x="0" y="35" text-anchor="middle" fill="#475569" font-size="13">医疗站</text>
                </g>
                
                <!-- 摄像头 -->
                <g transform="translate(200, 900)">
                    <circle cx="0" cy="0" r="14" fill="white" stroke="#7c3aed" stroke-width="2"/>
                    <text x="0" y="4" text-anchor="middle" fill="#7c3aed" font-size="14">📹</text>
                </g>
                
                <g transform="translate(800, 520)">
                    <circle cx="0" cy="0" r="14" fill="white" stroke="#7c3aed" stroke-width="2"/>
                    <text x="0" y="4" text-anchor="middle" fill="#7c3aed" font-size="14">📹</text>
                </g>
                
                <!-- 选手位置 - 领先选手 -->
                <g transform="translate(620, 600)">
                    <circle cx="0" cy="0" r="12" fill="#1e40af" class="pulse-marker" style="transform-origin: center;"/>
                    <circle cx="0" cy="0" r="6" fill="white"/>
                </g>
                
                <!-- 选手位置 - 大部队 -->
                <g transform="translate(520, 660)">
                    <circle cx="0" cy="0" r="8" fill="#3b82f6"/>
                    <circle cx="30" cy="-15" r="8" fill="#3b82f6"/>
                    <circle cx="-20" cy="10" r="8" fill="#3b82f6"/>
                    <circle cx="40" cy="20" r="8" fill="#3b82f6"/>
                    <circle cx="-15" cy="-20" r="8" fill="#3b82f6"/>
                    <circle cx="50" cy="5" r="8" fill="#3b82f6"/>
                    <circle cx="-25" cy="25" r="8" fill="#3b82f6"/>
                    <circle cx="15" cy="30" r="8" fill="#3b82f6"/>
                </g>
                
                <!-- 告警事件 -->
                <g transform="translate(950, 450)">
                    <circle cx="0" cy="0" r="14" fill="#dc2626" class="pulse-alert"/>
                    <text x="0" y="5" text-anchor="middle" fill="white" font-size="16" font-weight="bold">!</text>
                </g>
            </svg>
            
            <!-- 地图控件 -->
            <div class="absolute top-20 right-6 flex flex-col space-y-2">
                <button onclick="zoomIn()" class="map-control w-12 h-12 flex items-center justify-center">
                    <i class="fas fa-plus text-slate-600 text-lg"></i>
                </button>
                <button onclick="zoomOut()" class="map-control w-12 h-12 flex items-center justify-center">
                    <i class="fas fa-minus text-slate-600 text-lg"></i>
                </button>
                <button onclick="resetMapView()" class="map-control w-12 h-12 flex items-center justify-center">
                    <i class="fas fa-crosshairs text-slate-600 text-lg"></i>
                </button>
            </div>
            
            <!-- 图层控制 -->
            <div class="absolute top-20 left-6 bg-white rounded-lg shadow-md p-4">
                <div class="text-xs font-semibold text-slate-500 uppercase mb-3">图层</div>
                <div class="flex flex-wrap gap-2">
                    <button class="layer-toggle active" onclick="toggleLayer('runners', this)">
                        <i class="fas fa-circle text-blue-500 text-xs mr-1"></i>
                        选手
                    </button>
                    <button class="layer-toggle active" onclick="toggleLayer('facilities', this)">
                        <i class="fas fa-map-marker-alt text-teal-500 text-xs mr-1"></i>
                        设施
                    </button>
                    <button class="layer-toggle" onclick="toggleLayer('heatmap', this)">
                        <i class="fas fa-fire text-red-500 text-xs mr-1"></i>
                        热力图
                    </button>
                    <button class="layer-toggle" onclick="toggleLayer('cameras', this)">
                        <i class="fas fa-video text-purple-500 text-xs mr-1"></i>
                        摄像头
                    </button>
                </div>
            </div>
            
            <!-- 图例 -->
            <div class="absolute bottom-6 left-6 bg-white/95 backdrop-blur rounded-lg shadow-md p-4 border border-slate-200">
                <div class="text-xs font-semibold text-slate-500 uppercase mb-3">图例</div>
                <div class="grid grid-cols-3 gap-3">
                    <div class="legend-item">
                        <div class="legend-dot bg-blue-600"></div>
                        <span>选手</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot bg-red-500"></div>
                        <span>告警</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot bg-green-600"></div>
                        <span>起终点</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot bg-orange-600"></div>
                        <span>计时点</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot bg-teal-500"></div>
                        <span>补给站</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot bg-red-500"></div>
                        <span>医疗站</span>
                    </div>
                </div>
            </div>
            
            <!-- 数据更新时间 -->
            <div class="absolute bottom-6 right-6 bg-white/95 backdrop-blur rounded-lg shadow-md px-4 py-2 border border-slate-200">
                <div class="flex items-center space-x-2 text-xs text-slate-500">
                    <i class="fas fa-sync-alt"></i>
                    <span>数据更新于 10秒前</span>
                </div>
            </div>
        </div>
        
    </div>
    
</body>
</html>
