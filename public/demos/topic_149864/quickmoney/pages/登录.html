/* 闪薪 - 共享样式文件 */
/* Tech-trust blue-purple gradient palette, clean minimal UI */

/* === Color System === */
:root {
  --color-brand-primary: #6366F1;
  --color-brand-primary-hover: #4F46E5;
  --color-brand-primary-light: #EEF2FF;
  --color-brand-primary-subtle: #F5F3FF;
  --color-brand-gradient-start: #6366F1;
  --color-brand-gradient-end: #8B5CF6;

  --color-bg-page: #F8FAFC;
  --color-bg-surface: #FFFFFF;
  --color-bg-elevated: #FFFFFF;
  --color-bg-chat: #F1F5F9;

  --color-text-primary: #0F172A;
  --color-text-secondary: #64748B;
  --color-text-tertiary: #94A3B8;
  --color-text-inverse: #FFFFFF;

  --color-border-default: #E2E8F0;
  --color-border-light: #F1F5F9;

  --color-ai-bubble: linear-gradient(135deg, #6366F1, #8B5CF6);
  --color-user-bubble: #FFFFFF;
  --color-ai-bubble-text: #FFFFFF;
  --color-user-bubble-text: #0F172A;

  --state-success: #22C55E;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* === Radius Scale === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-2xl: 20px;
  --radius-full: 9999px;

  /* === Shadow System === */
  --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.04);
  --shadow-elevated: 0 4px 12px rgba(15, 23, 42, 0.05);
  --shadow-floating: 0 8px 24px rgba(15, 23, 42, 0.08);
  --shadow-glow: 0 0 20px rgba(99, 102, 241, 0.15);

  /* === Typography === */
  --font-display: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-body: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;

  --text-display-lg: 28px;
  --text-display-md: 24px;
  --text-display-sm: 20px;

  --text-title-lg: 18px;
  --text-title-md: 16px;
  --text-title-sm: 14px;

  --text-body-lg: 16px;
  --text-body-md: 14px;
  --text-body-sm: 12px;

  --text-caption: 11px;

  --leading-display: 1.3;
  --leading-title: 1.4;
  --leading-body: 1.6;
  --leading-tight: 1.2;

  --weight-bold: 700;
  --weight-semibold: 600;
  --weight-medium: 500;
  --weight-regular: 400;

  /* === Spacing === */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;
  --space-4xl: 40px;
}

/* === Base Styles === */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  font-family: var(--font-body);
  color: var(--color-text-primary);
  background: var(--color-bg-page);
  line-height: var(--leading-body);
  margin: 0;
  padding: 0;
  min-height: 100vh;
}

/* === Scrollbar Hide === */
.no-scrollbar::-webkit-scrollbar {
  display: none;
}
.no-scrollbar {
  -ms-overflow-style: none;
  scrollbar-width: none;
}

/* === Lucide Icon Fix === */
[data-icon] {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  -webkit-mask-size: contain;
  mask-size: contain;
  -webkit-mask-repeat: no-repeat;
  mask-repeat: no-repeat;
  -webkit-mask-position: center;
  mask-position: center;
  background-color: currentColor;
}

/* === Page Container === */
.page-container {
  padding-bottom: calc(60px + env(safe-area-inset-bottom));
}

/* === Card Styles === */
.card {
  background: var(--color-bg-surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
}

.card-elevated {
  background: var(--color-bg-surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-elevated);
}

/* === Button Base === */
.btn-primary {
  background: var(--color-brand-primary);
  color: var(--color-text-inverse);
  border: none;
  border-radius: var(--radius-lg);
  padding: 12px 24px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: var(--font-body);
}

.btn-primary:hover {
  background: var(--color-brand-primary-hover);
}

.btn-primary:active {
  transform: scale(0.98);
}

.btn-gradient {
  background: linear-gradient(135deg, var(--color-brand-gradient-start), var(--color-brand-gradient-end));
  color: var(--color-text-inverse);
  border: none;
  border-radius: var(--radius-lg);
  padding: 12px 24px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: var(--font-body);
  box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
}

.btn-gradient:hover {
  box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
}

.btn-gradient:active {
  transform: scale(0.98);
}

.btn-secondary {
  background: transparent;
  color: var(--color-text-secondary);
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-lg);
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: var(--font-body);
}

.btn-secondary:active {
  opacity: 0.7;
}

/* === Tag Styles === */
.tag {
  display: inline-flex;
  align-items: center;
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 500;
  background: var(--color-brand-primary-light);
  color: var(--color-brand-primary);
}

.tag-primary {
  background: var(--color-brand-primary);
  color: var(--color-text-inverse);
}

.tag-success {
  background: rgba(52, 168, 83, 0.1);
  color: var(--state-success);
}

.tag-warning {
  background: #FEF3C7;
  color: var(--state-warning);
}

.tag-hot {
  background: var(--state-error);
  color: var(--color-text-inverse);
}

/* === Input Styles === */
.input {
  width: 100%;
  border: 1px solid var(--color-border-default);
  border-radius: var(--radius-md);
  padding: 10px 12px;
  font-size: 14px;
  background: var(--color-bg-page);
  color: var(--color-text-primary);
  font-family: var(--font-body);
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.input:focus {
  outline: none;
  border-color: var(--color-brand-primary);
  box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
}

.input::placeholder {
  color: var(--color-text-tertiary);
}

textarea.input {
  resize: none;
  line-height: 1.6;
}

/* === Badge === */
.badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: var(--radius-full);
  font-size: 10px;
  font-weight: 600;
  background: var(--state-error);
  color: var(--color-text-inverse);
}

/* === Avatar === */
.avatar {
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-full);
  font-weight: 600;
  background: var(--color-brand-primary-light);
  color: var(--color-brand-primary);
}

.avatar-sm {
  width: 32px;
  height: 32px;
  font-size: 12px;
}

.avatar-md {
  width: 40px;
  height: 40px;
  font-size: 14px;
}

.avatar-lg {
  width: 56px;
  height: 56px;
  font-size: 20px;
}

/* === Star Rating === */
.star {
  color: var(--state-warning);
  fill: var(--state-warning);
}

/* === Tab Bar === */
.tab-bar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 375px;
  max-width: 100vw;
  background: var(--color-bg-surface);
  border-top: 1px solid var(--color-border-default);
  z-index: 40;
}

.tab-bar-inner {
  display: flex;
  align-items: center;
  justify-content: space-around;
  height: 50px;
}

.tab-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 4px 0;
  color: var(--color-text-tertiary);
  text-decoration: none;
  transition: color 0.2s ease;
}

.tab-item.active {
  color: var(--color-brand-primary);
}

.tab-item span {
  font-size: 10px;
}

.tab-item.active span {
  font-weight: 600;
}

.tab-publish-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  margin-top: -16px;
  border-radius: var(--radius-full);
  background: linear-gradient(135deg, var(--color-brand-gradient-start), var(--color-brand-gradient-end));
  box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
  color: var(--color-text-inverse);
}

/* === Navigation Bar === */
.nav-bar {
  position: sticky;
  top: 0;
  z-index: 30;
  background: rgba(248, 250, 252, 0.95);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--color-border-light);
}

.nav-bar-inner {
  display: flex;
  align-items: center;
  height: 44px;
  padding: 0 16px;
}

.nav-bar-back {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: var(--radius-md);
  background: var(--color-bg-surface);
  border: 1px solid var(--color-border-default);
  color: var(--color-text-primary);
  cursor: pointer;
  text-decoration: none;
}

.nav-bar-back:active {
  opacity: 0.7;
}

.nav-bar-title {
  flex: 1;
  text-align: center;
  font-size: 16px;
  font-weight: 600;
  color: var(--color-text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* === List Item === */
.list-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  background: var(--color-bg-surface);
  text-decoration: none;
  transition: opacity 0.2s ease;
  cursor: pointer;
}

.list-item:active {
  opacity: 0.7;
}

.list-item + .list-item {
  border-top: 1px solid var(--color-border-light);
}

.list-item-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: var(--radius-md);
  background: var(--color-brand-primary-light);
  color: var(--color-brand-primary);
}

.list-item-content {
  flex: 1;
  min-width: 0;
}

.list-item-title {
  font-size: 14px;
  font-weight: 500;
  color: var(--color-text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.list-item-arrow {
  color: var(--color-text-tertiary);
}

/* === Chat Bubbles === */
.ai-bubble {
  background: var(--color-ai-bubble);
  color: var(--color-ai-bubble-text);
  border-radius: 20px 20px 20px 4px;
  padding: 12px 16px;
  max-width: 80%;
  font-size: 14px;
  line-height: 1.5;
}

.user-bubble {
  background: var(--color-user-bubble);
  color: var(--color-user-bubble-text);
  border-radius: 20px 20px 4px 20px;
  padding: 12px 16px;
  max-width: 80%;
  font-size: 14px;
  line-height: 1.5;
  box-shadow: var(--shadow-card);
}

/* === Animation === */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes pulse {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.5;
  }
}

@keyframes typing {
  0%, 60%, 100% {
    transform: translateY(0);
  }
  30% {
    transform: translateY(-4px);
  }
}

.animate-fade-in {
  animation: fadeIn 0.3s ease forwards;
}

.animate-slide-up {
  animation: slideUp 0.4s ease forwards;
}

.animate-pulse {
  animation: pulse 1.5s ease-in-out infinite;
}

/* === Typing Indicator === */
.typing-indicator {
  display: flex;
  gap: 4px;
  padding: 8px 12px;
}

.typing-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--color-text-tertiary);
  animation: typing 1.4s infinite;
}

.typing-dot:nth-child(2) {
  animation-delay: 0.2s;
}

.typing-dot:nth-child(3) {
  animation-delay: 0.4s;
}

/* === Toast === */
.toast {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  padding: 12px 24px;
  background: rgba(45, 42, 38, 0.85);
  color: var(--color-text-inverse);
  border-radius: var(--radius-md);
  font-size: 14px;
  z-index: 9999;
  animation: fadeIn 0.2s ease;
  pointer-events: none;
}

/* === Modal === */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.5);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s ease, visibility 0.3s ease;
}

.modal-overlay.active {
  opacity: 1;
  visibility: visible;
}

.modal {
  width: 300px;
  background: var(--color-bg-surface);
  border-radius: var(--radius-lg);
  overflow: hidden;
  transform: scale(0.9);
  transition: transform 0.3s ease;
}

.modal-overlay.active .modal {
  transform: scale(1);
}

/* === Safe Area === */
.safe-area-bottom {
  height: env(safe-area-inset-bottom, 0px);
}

/* === Responsive Container === */
.mobile-container {
  max-width: 375px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--color-bg-page);
}

/* === Flex Utilities === */
.flex {
  display: flex;
}

.flex-col {
  flex-direction: column;
}

.items-center {
  align-items: center;
}

.items-start {
  align-items: flex-start;
}

.items-end {
  align-items: flex-end;
}

.justify-center {
  justify-content: center;
}

.justify-between {
  justify-content: space-between;
}

.justify-end {
  justify-content: flex-end;
}

.flex-1 {
  flex: 1;
}

.flex-shrink-0 {
  flex-shrink: 0;
}

.flex-wrap {
  flex-wrap: wrap;
}

.gap-1 { gap: 4px; }
.gap-1\.5 { gap: 6px; }
.gap-2 { gap: 8px; }
.gap-3 { gap: 12px; }
.gap-4 { gap: 16px; }

/* === Grid Utilities === */
.grid {
  display: grid;
}

.grid-cols-2 {
  grid-template-columns: repeat(2, 1fr);
}

.grid-cols-4 {
  grid-template-columns: repeat(4, 1fr);
}

/* === Text Utilities === */
.text-center {
  text-align: center;
}

.text-left {
  text-align: left;
}

.text-right {
  text-align: right;
}

.text-xs { font-size: 12px; }
.text-sm { font-size: 12px; }
.text-base { font-size: 14px; }
.text-lg { font-size: 16px; }
.text-xl { font-size: 18px; }
.text-2xl { font-size: 20px; }
.text-3xl { font-size: 24px; }

.font-normal { font-weight: 400; }
.font-medium { font-weight: 500; }
.font-semibold { font-weight: 600; }
.font-bold { font-weight: 700; }

.text-primary { color: var(--color-text-primary); }
.text-secondary { color: var(--color-text-secondary); }
.text-tertiary { color: var(--color-text-tertiary); }
.text-inverse { color: var(--color-text-inverse); }
.text-brand { color: var(--color-brand-primary); }
.text-success { color: var(--state-success); }
.text-warning { color: var(--state-warning); }
.text-error { color: var(--state-error); }

/* === Truncate === */
.truncate {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* === Line Clamp === */
.line-clamp-1 {
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.line-clamp-2 {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.line-clamp-3 {
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* === Price Tag === */
.price {
  color: var(--color-brand-primary);
  font-weight: 700;
}

.price-lg {
  font-size: 18px;
}

/* === Active State === */
.active\:opacity-70:active {
  opacity: 0.7;
}

/* === Spacing Utilities === */
.p-0 { padding: 0; }
.p-1 { padding: 4px; }
.p-2 { padding: 8px; }
.p-3 { padding: 12px; }
.p-4 { padding: 16px; }
.p-5 { padding: 20px; }

.px-2 { padding-left: 8px; padding-right: 8px; }
.px-3 { padding-left: 12px; padding-right: 12px; }
.px-4 { padding-left: 16px; padding-right: 16px; }
.px-5 { padding-left: 20px; padding-right: 20px; }

.py-1 { padding-top: 4px; padding-bottom: 4px; }
.py-2 { padding-top: 8px; padding-bottom: 8px; }
.py-3 { padding-top: 12px; padding-bottom: 12px; }
.py-4 { padding-top: 16px; padding-bottom: 16px; }

.pt-2 { padding-top: 8px; }
.pt-3 { padding-top: 12px; }
.pt-4 { padding-top: 16px; }

.pb-2 { padding-bottom: 8px; }
.pb-3 { padding-bottom: 12px; }
.pb-4 { padding-bottom: 16px; }
.pb-28 { padding-bottom: 112px; }

.m-0 { margin: 0; }
.mt-1 { margin-top: 4px; }
.mt-2 { margin-top: 8px; }
.mt-3 { margin-top: 12px; }
.mt-4 { margin-top: 16px; }
.mt-5 { margin-top: 20px; }

.mb-1 { margin-bottom: 4px; }
.mb-2 { margin-bottom: 8px; }
.mb-3 { margin-bottom: 12px; }
.mb-4 { margin-bottom: 16px; }

.ml-1 { margin-left: 4px; }
.ml-2 { margin-left: 8px; }
.ml-10 { margin-left: 40px; }

.mr-1 { margin-right: 4px; }
.mr-2 { margin-right: 8px; }

.mx-auto { margin-left: auto; margin-right: auto; }
.-mt-1 { margin-top: -4px; }
.-mt-4 { margin-top: -16px; }
.-mt-12 { margin-top: -48px; }

/* === Size Utilities === */
.w-full { width: 100%; }
.h-full { height: 100%; }
.w-8 { width: 32px; }
.h-8 { height: 32px; }
.w-9 { width: 36px; }
.h-9 { height: 36px; }
.w-10 { width: 40px; }
.h-10 { height: 40px; }
.w-11 { width: 44px; }
.h-11 { height: 44px; }
.w-14 { width: 56px; }
.h-14 { height: 56px; }
.w-16 { width: 64px; }
.h-16 { height: 64px; }

.min-w-0 { min-width: 0; }
.min-h-screen { min-height: 100vh; }

.rounded-sm { border-radius: var(--radius-sm); }
.rounded-md { border-radius: var(--radius-md); }
.rounded-lg { border-radius: var(--radius-lg); }
.rounded-xl { border-radius: var(--radius-xl); }
.rounded-2xl { border-radius: var(--radius-2xl); }
.rounded-full { border-radius: var(--radius-full); }

.overflow-hidden { overflow: hidden; }
.overflow-x-auto { overflow-x: auto; }

/* === Position Utilities === */
.relative { position: relative; }
.absolute { position: absolute; }
.fixed { position: fixed; }
.sticky { position: sticky; }

.inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
.top-0 { top: 0; }
.bottom-0 { bottom: 0; }
.left-0 { left: 0; }
.right-0 { right: 0; }
.-top-12 { top: -48px; }
.-right-12 { right: -48px; }
.-left-8 { left: -32px; }
.bottom-4 { bottom: 16px; }
.-left-25 { left: -100px; }
.-top-30 { top: -120px; }
.-top-30 { top: -120px; }
.right-50 { right: 200px; }
.right-40 { right: 160px; }

/* === Z-Index === */
.z-20 { z-index: 20; }
.z-30 { z-index: 30; }
.z-40 { z-index: 40; }
.z-50 { z-index: 50; }

/* === Border === */
.border { border-width: 1px; border-style: solid; }
.border-t { border-top-width: 1px; border-top-style: solid; }
.border-b { border-bottom-width: 1px; border-bottom-style: solid; }
.border-l { border-left-width: 1px; border-left-style: solid; }
.border-r { border-right-width: 1px; border-right-style: solid; }

.border-default { border-color: var(--color-border-default); }
.border-light { border-color: var(--color-border-light); }

/* === Background === */
.bg-page { background: var(--color-bg-page); }
.bg-surface { background: var(--color-bg-surface); }
.bg-chat { background: var(--color-bg-chat); }
.bg-primary-light { background: var(--color-brand-primary-light); }
.bg-primary { background: var(--color-brand-primary); }
.bg-gradient { background: linear-gradient(135deg, var(--color-brand-gradient-start), var(--color-brand-gradient-end)); }
.bg-transparent { background: transparent; }
.bg-white { background: white; }
.bg-white\/20 { background: rgba(255, 255, 255, 0.2); }
.bg-white\/95 { background: rgba(255, 255, 255, 0.95); }

/* === Shadow === */
.shadow-card { box-shadow: var(--shadow-card); }
.shadow-elevated { box-shadow: var(--shadow-elevated); }
.shadow-floating { box-shadow: var(--shadow-floating); }

/* === Opacity === */
.opacity-20 { opacity: 0.2; }
.opacity-10 { opacity: 0.1; }

/* === Backdrop === */
.backdrop-blur { backdrop-filter: blur(8px); }

/* === Cursor === */
.cursor-pointer { cursor: pointer; }

/* === Display === */
.block { display: block; }
.inline-block { display: inline-block; }
.inline-flex { display: inline-flex; }
.hidden { display: none; }

/* === Whitespace === */
.whitespace-nowrap { white-space: nowrap; }

/* === User Select === */
.select-none { user-select: none; }

/* === Transition === */
.transition-all { transition: all 0.2s ease; }

/* === Desktop Optimization === */
@media (min-width: 768px) {
  body {
    background: #f0f0f8;
  }
  
  .mobile-container {
    margin-top: 20px;
    margin-bottom: 20px;
    border-radius: 24px;

    width: 375px;
    left: 50%;
    transform: translateX(-50%);
  }
}
