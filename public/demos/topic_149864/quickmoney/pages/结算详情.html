<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>结算详情 - 闪薪</title>
    <style id="theme-vars">
:root {
  --color-brand-primary: #6366F1;
  --color-brand-primary-hover: #4F46E5;
  --color-brand-primary-light: #EEF2FF;
  --color-brand-primary-subtle: #F5F3FF;
  --color-brand-gradient-start: #6366F1;
  --color-brand-gradient-end: #8B5CF6;
  --color-bg-page: #F8FAFC;
  --color-bg-surface: #FFFFFF;
  --color-bg-elevated: #FFFFFF;
  --color-bg-chat: #F1F5F9;
  --color-text-primary: #0F172A;
  --color-text-secondary: #64748B;
  --color-text-tertiary: #94A3B8;
  --color-text-inverse: #FFFFFF;
  --color-border-default: #E2E8F0;
  --color-border-light: #F1F5F9;
  --color-ai-bubble: linear-gradient(135deg, #6366F1, #8B5CF6);
  --color-user-bubble: #FFFFFF;
  --color-ai-bubble-text: #FFFFFF;
  --color-user-bubble-text: #0F172A;
  --state-success: #22C55E;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-2xl: 20px;
  --radius-full: 9999px;
  --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.04);
  --shadow-elevated: 0 4px 12px rgba(15, 23, 42, 0.05);
  --shadow-floating: 0 8px 24px rgba(15, 23, 42, 0.08);
  --shadow-glow: 0 0 20px rgba(99, 102, 241, 0.15);
  --font-display: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-body: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
  --text-display-lg: 28px; --text-display-md: 24px; --text-display-sm: 20px;
  --text-title-lg: 18px; --text-title-md: 16px; --text-title-sm: 14px;
  --text-body-lg: 16px; --text-body-md: 14px; --text-body-sm: 12px; --text-caption: 11px;
  --leading-display: 1.3; --leading-title: 1.4; --leading-body: 1.6; --leading-tight: 1.2;
  --weight-bold: 700; --weight-semibold: 600; --weight-medium: 500; --weight-regular: 400;
  --space-xs: 4px; --space-sm: 8px; --space-md: 12px; --space-lg: 16px; --space-xl: 20px; --space-2xl: 24px; --space-3xl: 32px; --space-4xl: 40px;
}
</style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-brand-primary);
  }
  @layer base {
    body { background: var(--color-bg-page); color: var(--color-text-primary); }
  }
    </style>
    <style>
      html {
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        font-family: var(--font-body);
        color: var(--color-text-primary);
        background: var(--color-bg-page);
        line-height: var(--leading-body);
        margin: 0;
        padding: 0;
        max-width: 375px;
        margin: 0 auto;
        min-height: 100vh;
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* Fade up animation */
      @keyframes fadeUp {
        0% { transform: translateY(12px); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
      }
      @keyframes scaleIn {
        0% { transform: scale(0); opacity: 0; }
        60% { transform: scale(1.1); }
        100% { transform: scale(1); opacity: 1; }
      }
      .anim-fade-up {
        animation: fadeUp 0.4s ease-out both;
      }
      .anim-scale-in {
        animation: scaleIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      .anim-delay-1 { animation-delay: 0.1s; }
      .anim-delay-2 { animation-delay: 0.2s; }
      .anim-delay-3 { animation-delay: 0.3s; }
      .anim-delay-4 { animation-delay: 0.4s; }
      .anim-delay-5 { animation-delay: 0.5s; }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main style="padding-bottom: calc(80px + env(safe-area-inset-bottom));">

      <!-- Status bar spacer -->
      <div class="h-11 bg-transparent"></div>

      <!-- Navigation bar -->
      <header class="sticky top-0 z-30 border-b" style="border-color: var(--color-border-light); background: rgba(255,255,255,0.95); backdrop-filter: blur(12px);">
        <div class="flex h-11 items-center px-4">
          <div class="flex w-[88px] items-center justify-start">
            <button data-dom-id="back-settlement" class="inline-flex h-8 w-8 items-center justify-center rounded-lg border" style="border-color: var(--color-border-default); background: var(--color-bg-surface);" aria-label="返回">
              <i data-lucide="chevron-left" class="h-4 w-4" style="color: var(--color-text-primary);"></i>
            </button>
          </div>
          <div class="min-w-0 flex-1 text-center text-[16px] font-semibold tracking-[-0.02em]" style="color: var(--color-text-primary);">结算详情</div>
          <div class="flex h-8 w-[88px] items-center justify-center rounded-full border" style="border-color: var(--color-border-default); background: rgba(255,255,255,0.9);" aria-label="小程序菜单">
            <button class="flex h-full flex-1 items-center justify-center" aria-label="更多">
              <i data-lucide="more-horizontal" class="h-4 w-4" style="color: var(--color-text-primary);"></i>
            </button>
            <span class="h-4 w-px" style="background: var(--color-border-default);" aria-hidden="true"></span>
            <button class="flex h-full flex-1 items-center justify-center" aria-label="关闭">
              <i data-lucide="x" class="h-4 w-4" style="color: var(--color-text-primary);"></i>
            </button>
          </div>
        </div>
      </header>

      <!-- Page content -->
      <div class="px-4 pt-4 pb-4 space-y-3" style="background: var(--color-bg-page);">

        <!-- Settlement summary banner -->
        <section class="rounded-xl p-5 anim-fade-up" style="background: linear-gradient(135deg, var(--color-brand-gradient-start), var(--color-brand-gradient-end));">
          <div class="flex items-center gap-2.5">
            <div class="flex h-9 w-9 items-center justify-center rounded-full" style="background: rgba(255,255,255,0.2);">
              <i data-lucide="wallet" class="h-4.5 w-4.5" style="color: var(--color-text-inverse);"></i>
            </div>
            <span class="text-[14px] font-medium" style="color: rgba(255,255,255,0.9);">结算金额</span>
          </div>
          <div class="mt-3 anim-scale-in anim-delay-1">
            <span class="text-[32px] font-bold tracking-tight" style="color: var(--color-text-inverse); line-height: var(--leading-tight);">¥121.60</span>
          </div>
          <div class="mt-1.5 flex items-center gap-1.5 anim-fade-up anim-delay-2">
            <i data-lucide="check-circle" class="h-3.5 w-3.5" style="color: rgba(255,255,255,0.8);"></i>
            <span class="text-[13px]" style="color: rgba(255,255,255,0.8);">已转入钱包余额</span>
          </div>
        </section>

        <!-- Fee breakdown card -->
        <section class="rounded-xl p-4 anim-fade-up anim-delay-2" style="background: var(--color-bg-surface); box-shadow: var(--shadow-card);">
          <div class="flex items-center gap-2 mb-3">
            <div class="flex h-7 w-7 items-center justify-center rounded-lg" style="background: var(--color-brand-primary-light);">
              <i data-lucide="receipt" class="h-3.5 w-3.5" style="color: var(--color-brand-primary);"></i>
            </div>
            <h2 class="text-[15px] font-semibold" style="color: var(--color-text-primary);">费用明细</h2>
          </div>

          <!-- Order amount -->
          <div class="flex items-center justify-between py-2">
            <span class="text-[13px]" style="color: var(--color-text-secondary);">订单金额</span>
            <span class="text-[14px] font-medium" style="color: var(--color-text-primary);">¥128.00</span>
          </div>

          <!-- Platform fee -->
          <div class="flex items-center justify-between py-2">
            <span class="text-[13px]" style="color: var(--color-text-secondary);">平台服务费 (5%)</span>
            <span class="text-[14px] font-medium" style="color: var(--state-error);">-¥6.40</span>
          </div>

          <!-- Separator -->
          <div class="my-2 h-px" style="background: var(--color-border-default);"></div>

          <!-- Actual income -->
          <div class="flex items-center justify-between py-1">
            <span class="text-[14px] font-semibold" style="color: var(--color-text-primary);">实际收入</span>
            <span class="text-[18px] font-bold" style="color: var(--color-brand-primary);">¥121.60</span>
          </div>

          <!-- Note -->
          <div class="mt-3 flex items-start gap-1.5 rounded-lg p-3" style="background: var(--color-bg-page);">
            <i data-lucide="info" class="h-3.5 w-3.5 mt-0.5 flex-shrink-0" style="color: var(--color-text-tertiary);"></i>
            <p class="text-[12px] leading-relaxed" style="color: var(--color-text-tertiary);">买家确认收货后，款项自动结算至钱包</p>
          </div>
        </section>

        <!-- Order info card -->
        <section class="rounded-xl p-4 anim-fade-up anim-delay-3" style="background: var(--color-bg-surface); box-shadow: var(--shadow-card);">
          <div class="flex items-center gap-2 mb-3">
            <div class="flex h-7 w-7 items-center justify-center rounded-lg" style="background: var(--color-brand-primary-light);">
              <i data-lucide="package" class="h-3.5 w-3.5" style="color: var(--color-brand-primary);"></i>
            </div>
            <h2 class="text-[15px] font-semibold" style="color: var(--color-text-primary);">订单信息</h2>
          </div>

          <!-- Skill name -->
          <div class="flex items-center justify-between">
            <span class="text-[13px]" style="color: var(--color-text-secondary);">技能名称</span>
            <span class="text-[13px] font-medium" style="color: var(--color-text-primary);">PPT美化 — 标准版</span>
          </div>
          <div class="my-3 h-px" style="background: var(--color-border-light);"></div>

          <!-- Buyer -->
          <div class="flex items-center justify-between">
            <span class="text-[13px]" style="color: var(--color-text-secondary);">买家</span>
            <span class="text-[13px] font-medium" style="color: var(--color-text-primary);">张三</span>
          </div>
          <div class="my-3 h-px" style="background: var(--color-border-light);"></div>

          <!-- Order number -->
          <div class="flex items-center justify-between">
            <span class="text-[13px]" style="color: var(--color-text-secondary);">订单号</span>
            <span class="text-[13px]" style="color: var(--color-text-secondary); font-family: var(--font-mono);">SX20260630001</span>
          </div>
          <div class="my-3 h-px" style="background: var(--color-border-light);"></div>

          <!-- Completion time -->
          <div class="flex items-center justify-between">
            <span class="text-[13px]" style="color: var(--color-text-secondary);">完成时间</span>
            <span class="text-[13px]" style="color: var(--color-text-secondary);">2026-07-03 10:05</span>
          </div>
        </section>

        <!-- Transaction record card -->
        <section class="rounded-xl p-4 anim-fade-up anim-delay-4" style="background: var(--color-bg-surface); box-shadow: var(--shadow-card);">
          <div class="flex items-center gap-2 mb-3">
            <div class="flex h-7 w-7 items-center justify-center rounded-lg" style="background: var(--color-brand-primary-light);">
              <i data-lucide="history" class="h-3.5 w-3.5" style="color: var(--color-brand-primary);"></i>
            </div>
            <h2 class="text-[15px] font-semibold" style="color: var(--color-text-primary);">交易记录</h2>
          </div>

          <!-- Record item -->
          <div class="flex items-center justify-between py-2">
            <div class="flex items-center gap-3">
              <div class="flex h-9 w-9 items-center justify-center rounded-full" style="background: rgba(34,197,94,0.1);">
                <i data-lucide="arrow-down-left" class="h-4 w-4" style="color: var(--state-success);"></i>
              </div>
              <div>
                <p class="text-[13px] font-medium" style="color: var(--color-text-primary);">收入 +¥121.60</p>
                <p class="text-[12px] mt-0.5" style="color: var(--color-text-tertiary);">07-03 10:05</p>
              </div>
            </div>
            <span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-[12px] font-medium" style="background: rgba(34,197,94,0.1); color: var(--state-success);">已到账</span>
          </div>
        </section>

      </div>

      <!-- Bottom action bar (fixed) -->
      <footer class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full z-40 border-t" style="max-width: 375px; border-color: var(--color-border-light); background: var(--color-bg-surface); padding-bottom: env(safe-area-inset-bottom);">
        <div class="flex items-center gap-3 px-4 py-3">
          <button data-dom-id="btn-view-wallet" class="flex-1 flex items-center justify-center h-11 rounded-full text-[15px] font-semibold text-white" style="background: linear-gradient(135deg, var(--color-brand-gradient-start) 0%, var(--color-brand-gradient-end) 100%); box-shadow: var(--shadow-glow);">
            查看钱包
          </button>
        </div>
      </footer>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
