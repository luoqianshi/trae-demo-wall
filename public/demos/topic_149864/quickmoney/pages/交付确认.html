<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交付确认</title>
    <style id="theme-vars">
/* 闪薪 - Brand CSS */
/* Tech-trust blue-purple gradient palette, clean minimal UI */

:root {
  /* === Color System === */
  --color-brand-primary: #6366F1;
  --color-brand-primary-hover: #4F46E5;
  --color-brand-primary-light: #EEF2FF;
  --color-brand-primary-subtle: #F5F3FF;
  --color-brand-gradient-start: #6366F1;
  --color-brand-gradient-end: #8B5CF6;

  --color-bg-page: #F8FAFC;
  --color-bg-surface: #FFFFFF;
  --color-bg-elevated: #FFFFFF;
  --color-bg-chat: #F1F5F9;

  --color-text-primary: #0F172A;
  --color-text-secondary: #64748B;
  --color-text-tertiary: #94A3B8;
  --color-text-inverse: #FFFFFF;

  --color-border-default: #E2E8F0;
  --color-border-light: #F1F5F9;

  --color-ai-bubble: linear-gradient(135deg, #6366F1, #8B5CF6);
  --color-user-bubble: #FFFFFF;
  --color-ai-bubble-text: #FFFFFF;
  --color-user-bubble-text: #0F172A;

  --state-success: #22C55E;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* === Radius Scale === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-2xl: 20px;
  --radius-full: 9999px;

  /* === Shadow System (static <= 0.05 alpha, floating only for modals) === */
  --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.04);
  --shadow-elevated: 0 4px 12px rgba(15, 23, 42, 0.05);
  --shadow-floating: 0 8px 24px rgba(15, 23, 42, 0.08);
  --shadow-glow: 0 0 20px rgba(99, 102, 241, 0.15);

  /* === Typography === */
  --font-display: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-body: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;

  --text-display-lg: 28px;
  --text-display-md: 24px;
  --text-display-sm: 20px;

  --text-title-lg: 18px;
  --text-title-md: 16px;
  --text-title-sm: 14px;

  --text-body-lg: 16px;
  --text-body-md: 14px;
  --text-body-sm: 12px;

  --text-caption: 11px;

  --leading-display: 1.3;
  --leading-title: 1.4;
  --leading-body: 1.6;
  --leading-tight: 1.2;

  --weight-bold: 700;
  --weight-semibold: 600;
  --weight-medium: 500;
  --weight-regular: 400;

  /* === Spacing === */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;
  --space-4xl: 40px;
}

/* Mini program viewport simulation */
html {
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  font-family: var(--font-body);
  color: var(--color-text-primary);
  background: var(--color-bg-page);
  line-height: var(--leading-body);
  margin: 0;
  padding: 0;
  max-width: 375px;
  margin: 0 auto;
  min-height: 100vh;
}

.page-container {
  padding-bottom: calc(60px + env(safe-area-inset-bottom));
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-brand-primary);
  }
  @layer base {
    body { background: var(--color-brand-background); color: var(--color-brand-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>
      <!-- Status bar spacer -->
      <div class="h-11 bg-transparent"></div>

      <!-- WeChat navigation bar -->
      <header class="sticky top-0 z-30 border-b border-[var(--color-border-default)] bg-[var(--color-bg-page)]/95 backdrop-blur">
        <div class="flex h-11 items-center px-4">
          <div class="flex w-[88px] items-center justify-start">
            <button data-dom-id="back-orders" class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-[var(--color-border-default)] bg-[var(--color-bg-surface)]" aria-label="返回">
              <i data-lucide="chevron-left" class="h-4 w-4" style="color: var(--color-text-primary)"></i>
            </button>
          </div>
          <div class="min-w-0 flex-1 text-center text-[16px] font-semibold tracking-[-0.02em]" style="color: var(--color-text-primary);">订单详情</div>
          <div class="flex h-8 w-[88px] items-center justify-center rounded-full border border-[var(--color-border-default)] bg-[var(--color-bg-surface)]/90 text-[var(--color-text-primary)]" aria-label="小程序菜单">
            <button class="flex h-full flex-1 items-center justify-center" aria-label="更多">
              <i data-lucide="more-horizontal" class="h-4 w-4"></i>
            </button>
            <span class="h-4 w-px bg-[var(--color-border-default)]" aria-hidden="true"></span>
            <button class="flex h-full flex-1 items-center justify-center" aria-label="关闭">
              <i data-lucide="x" class="h-4 w-4"></i>
            </button>
          </div>
        </div>
      </header>

      <!-- Page container -->
      <div class="px-4 pt-4 pb-28" style="background: var(--color-bg-page);">

        <!-- Order status banner -->
        <div class="rounded-xl p-5" style="background: linear-gradient(135deg, var(--color-brand-gradient-start), var(--color-brand-gradient-end));">
          <div class="flex items-center gap-2">
            <div class="flex h-8 w-8 items-center justify-center rounded-full bg-white/20">
              <i data-lucide="check" class="h-4 w-4" style="color: var(--color-text-inverse);"></i>
            </div>
            <span class="text-[18px] font-semibold" style="color: var(--color-text-inverse); text-wrap: balance;">卖家已交付</span>
          </div>
          <p class="mt-2 text-[12px]" style="color: rgba(255,255,255,0.85);">请在 7 天内确认收货，超时将自动确认</p>
        </div>

        <!-- Delivery info card -->
        <div class="mt-4 rounded-xl p-4" style="background: var(--color-bg-surface); box-shadow: var(--shadow-card);">
          <h2 class="text-[15px] font-semibold truncate" style="color: var(--color-text-primary);">交付物</h2>

          <!-- File attachment row -->
          <div class="mt-3 flex items-center gap-3 rounded-lg p-3" style="background: var(--color-bg-page);">
            <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg" style="background: var(--color-brand-primary-light);">
              <i data-lucide="file-text" class="h-4 w-4" style="color: var(--color-brand-primary);"></i>
            </div>
            <div class="min-w-0 flex-1">
              <p class="truncate text-[13px] font-medium" style="color: var(--color-text-primary);">Q3季度汇报_PPT.pptx</p>
              <p class="text-[11px]" style="color: var(--color-text-tertiary);">(2.3MB)</p>
            </div>
            <button class="shrink-0 rounded-lg px-3 py-1.5 text-[12px] font-medium" style="background: var(--color-brand-primary-light); color: var(--color-brand-primary);">下载</button>
          </div>

          <!-- Seller note -->
          <div class="mt-3 rounded-lg p-3" style="background: var(--color-bg-page);">
            <p class="text-[12px] font-medium" style="color: var(--color-text-secondary);">卖家留言</p>
            <p class="mt-1 text-[13px]" style="color: var(--color-text-primary); line-height: 1.6;">已完成10页PPT制作，按照商务简约风格设计，请查收</p>
          </div>
        </div>

        <!-- Order summary card -->
        <div class="mt-4 rounded-xl p-4" style="background: var(--color-bg-surface); box-shadow: var(--shadow-card);">
          <h2 class="text-[15px] font-semibold truncate" style="color: var(--color-text-primary);">订单信息</h2>

          <!-- Skill row -->
          <div class="mt-3 flex items-center justify-between">
            <span class="text-[13px]" style="color: var(--color-text-secondary);">技能</span>
            <span class="truncate text-[13px] font-medium" style="color: var(--color-text-primary);">PPT美化 — 标准版</span>
          </div>

          <!-- Divider -->
          <div class="my-3 h-px" style="background: var(--color-border-light);"></div>

          <!-- Seller row -->
          <div class="flex items-center justify-between">
            <span class="text-[13px]" style="color: var(--color-text-secondary);">卖家</span>
            <div class="flex min-w-0 flex-1 items-center justify-end gap-1">
              <span class="truncate text-[13px] font-medium" style="color: var(--color-text-primary);">小林Design</span>
              <span class="shrink-0 inline-flex items-center rounded px-1.5 py-0.5 text-[11px] font-medium" style="background: var(--color-brand-primary-light); color: var(--color-brand-primary);">信用96</span>
            </div>
          </div>

          <!-- Divider -->
          <div class="my-3 h-px" style="background: var(--color-border-light);"></div>

          <!-- Price row -->
          <div class="flex items-center justify-between">
            <span class="text-[13px]" style="color: var(--color-text-secondary);">金额</span>
            <div class="flex items-center gap-2">
              <span class="text-[15px] font-semibold" style="color: var(--color-text-primary);">¥134.40</span>
              <span class="inline-flex items-center rounded px-1.5 py-0.5 text-[11px] font-medium whitespace-nowrap" style="background: rgba(34,197,94,0.1); color: var(--state-success);">已托管</span>
            </div>
          </div>

          <!-- Divider -->
          <div class="my-3 h-px" style="background: var(--color-border-light);"></div>

          <!-- Timeline -->
          <div>
            <div class="flex items-start gap-3">
              <!-- Timeline items -->
              <div class="flex flex-col items-center">
                <div class="h-2 w-2 rounded-full" style="background: var(--color-brand-primary);"></div>
                <div class="flex-1 w-px" style="background: var(--color-border-default);"></div>
                <div class="h-2 w-2 rounded-full" style="background: var(--color-brand-primary);"></div>
                <div class="flex-1 w-px" style="background: var(--color-border-default);"></div>
                <div class="h-2 w-2 rounded-full" style="background: var(--color-brand-primary);"></div>
              </div>
              <div class="flex flex-col gap-4 pb-0">
                <div class="flex items-center justify-between">
                  <span class="text-[13px] font-medium" style="color: var(--color-text-primary);">下单</span>
                  <span class="text-[12px] whitespace-nowrap" style="color: var(--color-text-tertiary);">06-30 14:23</span>
                </div>
                <div class="flex items-center justify-between">
                  <span class="text-[13px] font-medium" style="color: var(--color-text-primary);">付款</span>
                  <span class="text-[12px] whitespace-nowrap" style="color: var(--color-text-tertiary);">06-30 14:24</span>
                </div>
                <div class="flex items-center justify-between">
                  <span class="text-[13px] font-medium" style="color: var(--color-text-primary);">交付</span>
                  <span class="text-[12px] whitespace-nowrap" style="color: var(--color-text-tertiary);">07-02 10:00</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Escrow trust note -->
        <div class="mt-4 flex items-center justify-center gap-2 py-2">
          <i data-lucide="shield-check" class="h-3.5 w-3.5" style="color: var(--color-brand-primary);"></i>
          <span class="text-[12px]" style="color: var(--color-text-tertiary);">款项由平台托管，确认收货后释放给卖家</span>
        </div>

      </div>

      <!-- Bottom action bar -->
      <div class="fixed bottom-0 inset-x-0 z-40" style="max-width: 375px; margin: 0 auto;">
        <div class="flex items-center gap-3 px-4 py-3" style="background: var(--color-bg-surface); border-top: 1px solid var(--color-border-default); padding-bottom: calc(12px + env(safe-area-inset-bottom, 16px));">
          <button class="flex-1 rounded-lg px-3 py-2.5 text-[14px] font-medium whitespace-nowrap" style="border: 1px solid var(--color-border-default); background: var(--color-bg-surface); color: var(--color-text-secondary);">有问题？申请售后</button>
          <button data-dom-id="btn-confirm" class="flex-1 rounded-lg px-3 py-2.5 text-[14px] font-semibold whitespace-nowrap" style="background: linear-gradient(135deg, var(--color-brand-gradient-start), var(--color-brand-gradient-end)); color: var(--color-text-inverse);">确认收货，释放款项</button>
        </div>
      </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
