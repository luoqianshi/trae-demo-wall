<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单详情 - 闪薪</title>
    <style id="theme-vars">
:root {
  --color-brand-primary: #6366F1;
  --color-brand-primary-hover: #4F46E5;
  --color-brand-primary-light: #EEF2FF;
  --color-brand-primary-subtle: #F5F3FF;
  --color-brand-gradient-start: #6366F1;
  --color-brand-gradient-end: #8B5CF6;
  --color-bg-page: #F8FAFC;
  --color-bg-surface: #FFFFFF;
  --color-bg-elevated: #FFFFFF;
  --color-bg-chat: #F1F5F9;
  --color-text-primary: #0F172A;
  --color-text-secondary: #64748B;
  --color-text-tertiary: #94A3B8;
  --color-text-inverse: #FFFFFF;
  --color-border-default: #E2E8F0;
  --color-border-light: #F1F5F9;
  --color-ai-bubble: linear-gradient(135deg, #6366F1, #8B5CF6);
  --color-user-bubble: #FFFFFF;
  --color-ai-bubble-text: #FFFFFF;
  --color-user-bubble-text: #0F172A;
  --state-success: #22C55E;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-2xl: 20px;
  --radius-full: 9999px;
  --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.04);
  --shadow-elevated: 0 4px 12px rgba(15, 23, 42, 0.05);
  --shadow-floating: 0 8px 24px rgba(15, 23, 42, 0.08);
  --shadow-glow: 0 0 20px rgba(99, 102, 241, 0.15);
  --font-display: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-body: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
  --text-display-lg: 28px; --text-display-md: 24px; --text-display-sm: 20px;
  --text-title-lg: 18px; --text-title-md: 16px; --text-title-sm: 14px;
  --text-body-lg: 16px; --text-body-md: 14px; --text-body-sm: 12px; --text-caption: 11px;
  --leading-display: 1.3; --leading-title: 1.4; --leading-body: 1.6; --leading-tight: 1.2;
  --weight-bold: 700; --weight-semibold: 600; --weight-medium: 500; --weight-regular: 400;
  --space-xs: 4px; --space-sm: 8px; --space-md: 12px; --space-lg: 16px; --space-xl: 20px; --space-2xl: 24px; --space-3xl: 32px; --space-4xl: 40px;
}
</style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-brand-primary);
  }
  @layer base {
    body { background: var(--color-bg-page); color: var(--color-text-primary); }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }

      /* Pulsing dot animation for "in progress" step */
      @keyframes pulse-ring {
        0% { transform: scale(1); opacity: 0.6; }
        70% { transform: scale(2.2); opacity: 0; }
        100% { transform: scale(2.2); opacity: 0; }
      }
      .pulse-dot::before {
        content: '';
        position: absolute;
        inset: -4px;
        border-radius: 9999px;
        background: var(--color-brand-primary);
        animation: pulse-ring 1.8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      /* Progress bar fill animation */
      @keyframes progress-fill {
        from { width: 0%; }
        to { width: 60%; }
      }
      .progress-fill {
        animation: progress-fill 1s ease-out forwards;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="font-family: var(--font-body); background: var(--color-bg-page); max-width: 375px; margin: 0 auto;">
    <main>
      <!-- Status bar spacer -->
      <div class="h-11 bg-transparent"></div>

      <!-- Navigation bar -->
      <header class="sticky top-0 z-30 border-b border-[var(--color-border-default)] bg-[var(--color-bg-page)]/95 backdrop-blur">
        <div class="flex h-11 items-center px-4">
          <div class="flex w-[88px] items-center justify-start">
            <button data-dom-id="back-orders" class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-[var(--color-border-default)] bg-[var(--color-bg-surface)]" aria-label="返回">
              <i data-lucide="chevron-left" class="h-4 w-4" style="color: var(--color-text-primary)"></i>
            </button>
          </div>
          <div class="min-w-0 flex-1 text-center text-[16px] font-semibold tracking-[-0.02em]" style="color: var(--color-text-primary);">订单详情</div>
          <div class="flex h-8 w-[88px] items-center justify-center rounded-full border border-[var(--color-border-default)] bg-[var(--color-bg-surface)]/90 text-[var(--color-text-primary)]" aria-label="小程序菜单">
            <button class="flex h-full flex-1 items-center justify-center" aria-label="更多">
              <i data-lucide="more-horizontal" class="h-4 w-4"></i>
            </button>
            <span class="h-4 w-px bg-[var(--color-border-default)]" aria-hidden="true"></span>
            <button class="flex h-full flex-1 items-center justify-center" aria-label="关闭">
              <i data-lucide="x" class="h-4 w-4"></i>
            </button>
          </div>
        </div>
      </header>

      <!-- Page content -->
      <div class="px-4 pt-4 pb-28" style="background: var(--color-bg-page);">

        <!-- Order status banner (brand gradient) -->
        <div class="rounded-xl p-5" style="background: linear-gradient(135deg, var(--color-brand-gradient-start), var(--color-brand-gradient-end));">
          <div class="flex items-center gap-2">
            <div class="flex h-8 w-8 items-center justify-center rounded-full bg-white/20">
              <i data-lucide="clock" class="h-4 w-4" style="color: var(--color-text-inverse);"></i>
            </div>
            <span class="text-[18px] font-semibold" style="color: var(--color-text-inverse); text-wrap: balance;">卖家制作中</span>
          </div>
          <p class="mt-2 text-[12px]" style="color: rgba(255,255,255,0.85);">预计 07-03 14:24 前交付</p>

          <!-- Progress bar -->
          <div class="mt-4 h-1.5 w-full rounded-full bg-white/20">
            <div class="progress-fill h-full rounded-full bg-white"></div>
          </div>
          <div class="mt-1.5 flex justify-end">
            <span class="text-[11px] font-medium" style="color: rgba(255,255,255,0.9);">60%</span>
          </div>
        </div>

        <!-- Progress timeline card -->
        <div class="mt-4 rounded-xl p-4" style="background: var(--color-bg-surface); box-shadow: var(--shadow-card);">
          <div class="flex flex-col">
            <!-- Step 1: 下单 (done) -->
            <div class="flex items-start gap-3">
              <div class="flex flex-col items-center">
                <div class="relative flex h-5 w-5 shrink-0 items-center justify-center rounded-full" style="background: var(--state-success);">
                  <i data-lucide="check" class="h-3 w-3" style="color: var(--color-text-inverse);"></i>
                </div>
                <div class="flex-1 w-px min-h-[24px]" style="background: var(--state-success);"></div>
              </div>
              <div class="flex flex-1 items-center justify-between pb-4">
                <span class="text-[13px] font-medium" style="color: var(--color-text-primary);">下单</span>
                <span class="text-[12px] whitespace-nowrap" style="color: var(--color-text-tertiary);">06-30 14:23</span>
              </div>
            </div>

            <!-- Step 2: 付款 (done) -->
            <div class="flex items-start gap-3">
              <div class="flex flex-col items-center">
                <div class="relative flex h-5 w-5 shrink-0 items-center justify-center rounded-full" style="background: var(--state-success);">
                  <i data-lucide="check" class="h-3 w-3" style="color: var(--color-text-inverse);"></i>
                </div>
                <div class="flex-1 w-px min-h-[24px]" style="background: var(--state-success);"></div>
              </div>
              <div class="flex flex-1 items-center justify-between pb-4">
                <span class="text-[13px] font-medium" style="color: var(--color-text-primary);">付款</span>
                <span class="text-[12px] whitespace-nowrap" style="color: var(--color-text-tertiary);">06-30 14:24</span>
              </div>
            </div>

            <!-- Step 3: 卖家接单 (done) -->
            <div class="flex items-start gap-3">
              <div class="flex flex-col items-center">
                <div class="relative flex h-5 w-5 shrink-0 items-center justify-center rounded-full" style="background: var(--state-success);">
                  <i data-lucide="check" class="h-3 w-3" style="color: var(--color-text-inverse);"></i>
                </div>
                <div class="flex-1 w-px min-h-[24px]" style="background: var(--color-border-default);"></div>
              </div>
              <div class="flex flex-1 items-center justify-between pb-4">
                <span class="text-[13px] font-medium" style="color: var(--color-text-primary);">卖家接单</span>
                <span class="text-[12px] whitespace-nowrap" style="color: var(--color-text-tertiary);">06-30 14:35</span>
              </div>
            </div>

            <!-- Step 4: 制作中 (in progress - pulsing) -->
            <div class="flex items-start gap-3">
              <div class="flex flex-col items-center">
                <div class="pulse-dot relative flex h-5 w-5 shrink-0 items-center justify-center rounded-full" style="background: var(--color-brand-primary);">
                  <div class="h-2 w-2 rounded-full bg-white"></div>
                </div>
                <div class="flex-1 w-px min-h-[24px]" style="background: var(--color-border-default);"></div>
              </div>
              <div class="flex flex-1 items-center justify-between pb-4">
                <span class="text-[13px] font-semibold" style="color: var(--color-brand-primary);">制作中</span>
                <span class="inline-flex items-center rounded-full px-2 py-0.5 text-[11px] font-medium" style="background: var(--color-brand-primary-light); color: var(--color-brand-primary);">进行中</span>
              </div>
            </div>

            <!-- Step 5: 交付验收 (pending) -->
            <div class="flex items-start gap-3">
              <div class="flex flex-col items-center">
                <div class="relative flex h-5 w-5 shrink-0 items-center justify-center rounded-full border-2" style="border-color: var(--color-border-default); background: var(--color-bg-surface);">
                </div>
                <div class="flex-1 w-px min-h-[24px]" style="background: var(--color-border-default);"></div>
              </div>
              <div class="flex flex-1 items-center justify-between pb-4">
                <span class="text-[13px]" style="color: var(--color-text-tertiary);">交付验收</span>
                <span class="text-[12px] whitespace-nowrap" style="color: var(--color-text-tertiary);">待处理</span>
              </div>
            </div>

            <!-- Step 6: 完成 (pending) -->
            <div class="flex items-start gap-3">
              <div class="flex flex-col items-center">
                <div class="relative flex h-5 w-5 shrink-0 items-center justify-center rounded-full border-2" style="border-color: var(--color-border-default); background: var(--color-bg-surface);">
                </div>
              </div>
              <div class="flex flex-1 items-center justify-between">
                <span class="text-[13px]" style="color: var(--color-text-tertiary);">完成</span>
                <span class="text-[12px] whitespace-nowrap" style="color: var(--color-text-tertiary);">待处理</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Order info card -->
        <div class="mt-4 rounded-xl p-4" style="background: var(--color-bg-surface); box-shadow: var(--shadow-card);">
          <h2 class="text-[15px] font-semibold truncate" style="color: var(--color-text-primary);">订单信息</h2>

          <!-- Skill row -->
          <div class="mt-3 flex items-center justify-between">
            <span class="text-[13px]" style="color: var(--color-text-secondary);">技能</span>
            <span class="truncate text-[13px] font-medium" style="color: var(--color-text-primary);">PPT美化 — 标准版</span>
          </div>

          <!-- Divider -->
          <div class="my-3 h-px" style="background: var(--color-border-light);"></div>

          <!-- Seller row -->
          <div class="flex items-center justify-between">
            <span class="text-[13px]" style="color: var(--color-text-secondary);">卖家</span>
            <div class="flex min-w-0 flex-1 items-center justify-end gap-1">
              <span class="truncate text-[13px] font-medium" style="color: var(--color-text-primary);">小林Design</span>
              <span class="shrink-0 inline-flex items-center rounded px-1.5 py-0.5 text-[11px] font-medium" style="background: var(--color-brand-primary-light); color: var(--color-brand-primary);">信用96</span>
            </div>
          </div>

          <!-- Divider -->
          <div class="my-3 h-px" style="background: var(--color-border-light);"></div>

          <!-- Price row -->
          <div class="flex items-center justify-between">
            <span class="text-[13px]" style="color: var(--color-text-secondary);">金额</span>
            <div class="flex items-center gap-2">
              <span class="text-[15px] font-semibold" style="color: var(--color-text-primary);">¥134.40</span>
              <span class="inline-flex items-center rounded px-1.5 py-0.5 text-[11px] font-medium whitespace-nowrap" style="background: rgba(34,197,94,0.1); color: var(--state-success);">已托管</span>
            </div>
          </div>

          <!-- Divider -->
          <div class="my-3 h-px" style="background: var(--color-border-light);"></div>

          <!-- Requirements -->
          <div>
            <span class="text-[13px]" style="color: var(--color-text-secondary);">需求描述</span>
            <p class="mt-1.5 text-[13px]" style="color: var(--color-text-primary); line-height: 1.6;">商务简约风格，包含公司介绍和产品展示两个部分</p>
          </div>
        </div>

        <!-- Communication area -->
        <div class="mt-4 rounded-xl p-4" style="background: var(--color-bg-surface); box-shadow: var(--shadow-card);">
          <h2 class="text-[15px] font-semibold" style="color: var(--color-text-primary);">与卖家沟通</h2>

          <!-- Chat input area -->
          <div class="mt-3 flex items-end gap-2">
            <div class="flex-1 rounded-lg px-3 py-2.5" style="background: var(--color-bg-page); border: 1px solid var(--color-border-default);">
              <span class="text-[13px]" style="color: var(--color-text-tertiary);">发送消息给卖家...</span>
            </div>
            <button class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg" style="background: linear-gradient(135deg, var(--color-brand-gradient-start), var(--color-brand-gradient-end));">
              <i data-lucide="send" class="h-4 w-4" style="color: var(--color-text-inverse);"></i>
            </button>
          </div>
        </div>

        <!-- Escrow trust note -->
        <div class="mt-4 flex items-center justify-center gap-2 py-2">
          <i data-lucide="shield-check" class="h-3.5 w-3.5" style="color: var(--color-brand-primary);"></i>
          <span class="text-[12px]" style="color: var(--color-text-tertiary);">款项由平台托管，确认收货后释放给卖家</span>
        </div>

      </div>

      <!-- Bottom action bar (fixed) -->
      <div class="fixed bottom-0 inset-x-0 z-40" style="max-width: 375px; margin: 0 auto;">
        <div class="flex items-center gap-3 px-4 py-3" style="background: var(--color-bg-surface); border-top: 1px solid var(--color-border-default); padding-bottom: calc(12px + env(safe-area-inset-bottom, 16px));">
          <button class="flex-1 rounded-lg px-3 py-2.5 text-[14px] font-medium whitespace-nowrap" style="border: 1px solid var(--color-border-default); background: var(--color-bg-surface); color: var(--color-text-secondary);">联系卖家</button>
          <button class="shrink-0 px-3 py-2.5 text-[14px] font-medium whitespace-nowrap" style="color: var(--color-text-secondary);">申请售后</button>
        </div>
      </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
