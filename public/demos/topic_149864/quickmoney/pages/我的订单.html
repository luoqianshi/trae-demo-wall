<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的订单 - 闪薪</title>
    <style id="theme-vars">
/* 闪薪 - Brand CSS */
/* Tech-trust blue-purple gradient palette, clean minimal UI */

:root {
  /* === Color System === */
  --color-brand-primary: #6366F1;
  --color-brand-primary-hover: #4F46E5;
  --color-brand-primary-light: #EEF2FF;
  --color-brand-primary-subtle: #F5F3FF;
  --color-brand-gradient-start: #6366F1;
  --color-brand-gradient-end: #8B5CF6;

  --color-bg-page: #F8FAFC;
  --color-bg-surface: #FFFFFF;
  --color-bg-elevated: #FFFFFF;
  --color-bg-chat: #F1F5F9;

  --color-text-primary: #0F172A;
  --color-text-secondary: #64748B;
  --color-text-tertiary: #94A3B8;
  --color-text-inverse: #FFFFFF;

  --color-border-default: #E2E8F0;
  --color-border-light: #F1F5F9;

  --color-ai-bubble: linear-gradient(135deg, #6366F1, #8B5CF6);
  --color-user-bubble: #FFFFFF;
  --color-ai-bubble-text: #FFFFFF;
  --color-user-bubble-text: #0F172A;

  --state-success: #22C55E;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* === Radius Scale === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-2xl: 20px;
  --radius-full: 9999px;

  /* === Shadow System (static <= 0.05 alpha, floating only for modals) === */
  --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.04);
  --shadow-elevated: 0 4px 12px rgba(15, 23, 42, 0.05);
  --shadow-floating: 0 8px 24px rgba(15, 23, 42, 0.08);
  --shadow-glow: 0 0 20px rgba(99, 102, 241, 0.15);

  /* === Typography === */
  --font-display: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-body: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;

  --text-display-lg: 28px;
  --text-display-md: 24px;
  --text-display-sm: 20px;

  --text-title-lg: 18px;
  --text-title-md: 16px;
  --text-title-sm: 14px;

  --text-body-lg: 16px;
  --text-body-md: 14px;
  --text-body-sm: 12px;

  --text-caption: 11px;

  --leading-display: 1.3;
  --leading-title: 1.4;
  --leading-body: 1.6;
  --leading-tight: 1.2;

  --weight-bold: 700;
  --weight-semibold: 600;
  --weight-medium: 500;
  --weight-regular: 400;

  /* === Spacing === */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;
  --space-4xl: 40px;
}

/* Mini program viewport simulation */
html {
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  font-family: var(--font-body);
  color: var(--color-text-primary);
  background: var(--color-bg-page);
  line-height: var(--leading-body);
  margin: 0;
  padding: 0;
  max-width: 375px;
  margin: 0 auto;
  min-height: 100vh;
}

.page-container {
  padding-bottom: calc(60px + env(safe-area-inset-bottom));
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-brand-primary);
  }
  @layer base {
    body { background: var(--color-brand-background); color: var(--color-brand-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="page-container">

      <!-- Status bar spacer -->
      <div class="h-11 bg-transparent"></div>

      <!-- WeChat Navigation Bar -->
      <header class="sticky top-0 z-30 border-b border-[var(--color-border-light)] bg-[var(--color-bg-surface)]/95 backdrop-blur">
        <div class="flex h-11 items-center px-4">
          <div class="flex w-[88px] items-center justify-start">
            <button data-dom-id="back-profile" class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-[var(--color-border-default)] bg-[var(--color-bg-surface)]" aria-label="返回">
              <i data-lucide="chevron-left" class="h-4 w-4" style="color: var(--color-text-primary);"></i>
            </button>
          </div>
          <div class="min-w-0 flex-1 text-center text-[16px] font-semibold tracking-[-0.02em]" style="color: var(--color-text-primary);">我的订单</div>
          <div class="flex h-8 w-[88px] items-center justify-center rounded-full border border-[var(--color-border-default)] bg-[var(--color-bg-surface)]/90 text-[var(--color-text-primary)]" aria-label="小程序菜单">
            <button class="flex h-full flex-1 items-center justify-center" aria-label="更多">
              <i data-lucide="more-horizontal" class="h-4 w-4"></i>
            </button>
            <span class="h-4 w-px bg-[var(--color-border-default)]" aria-hidden="true"></span>
            <button class="flex h-full flex-1 items-center justify-center" aria-label="关闭">
              <i data-lucide="x" class="h-4 w-4"></i>
            </button>
          </div>
        </div>
      </header>

      <!-- Tab Filter -->
      <nav class="sticky top-[88px] z-20 bg-[var(--color-bg-page)]">
        <div class="flex px-4 pt-3 pb-2">
          <button class="flex-1 h-9 rounded-lg text-[14px] font-semibold whitespace-nowrap" style="background: var(--color-brand-primary); color: var(--color-text-inverse);">全部</button>
          <button class="flex-1 h-9 rounded-lg text-[14px] font-medium whitespace-nowrap" style="color: var(--color-text-secondary);">待付款</button>
          <button class="flex-1 h-9 rounded-lg text-[14px] font-medium whitespace-nowrap" style="color: var(--color-text-secondary);">进行中</button>
          <button class="flex-1 h-9 rounded-lg text-[14px] font-medium whitespace-nowrap" style="color: var(--color-text-secondary);">已完成</button>
        </div>
      </nav>

      <!-- Order Cards -->
      <div class="px-4 pt-2 pb-4 space-y-3">

        <!-- Order Card 1: 待付款 -->
        <section class="rounded-xl p-4" style="background: var(--color-bg-surface); box-shadow: var(--shadow-card);">
          <!-- Top row: order number + status badge -->
          <div class="flex items-center justify-between">
            <span class="text-[12px] font-mono whitespace-nowrap" style="color: var(--color-text-tertiary);">SN20260630001</span>
            <span class="inline-flex items-center rounded-md px-2 py-0.5 text-[12px] font-medium whitespace-nowrap" style="background: #FEF3C7; color: var(--state-warning);">待付款</span>
          </div>

          <!-- Divider -->
          <div class="my-3" style="border-top: 1px solid var(--color-border-light);"></div>

          <!-- Skill info + price -->
          <div class="flex items-start gap-3">
            <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-lg" style="background: var(--color-brand-primary-light);">
              <span class="text-[11px] font-bold" style="color: var(--color-brand-primary);">小林</span>
            </div>
            <div class="min-w-0 flex-1">
              <div class="flex items-center justify-between">
                <div class="min-w-0 flex-1">
                  <div class="flex items-center gap-1.5">
                    <span class="text-[14px] font-semibold truncate" style="color: var(--color-text-primary);">小林Design</span>
                  </div>
                  <p class="mt-0.5 text-[13px] truncate" style="color: var(--color-text-secondary);">PPT美化 — 标准版</p>
                </div>
                <span class="ml-2 shrink-0 text-[16px] font-bold whitespace-nowrap" style="color: var(--color-text-primary);">¥134.40</span>
              </div>
            </div>
          </div>

          <!-- Timestamp -->
          <p class="mt-2.5 text-[11px]" style="color: var(--color-text-tertiary);">2026-06-30 14:23</p>

          <!-- Action buttons -->
          <div class="mt-3 flex items-center justify-end gap-2">
            <button class="h-8 px-3 rounded-lg text-[13px] font-medium whitespace-nowrap" style="border: 1px solid var(--color-border-default); color: var(--color-text-secondary); background: var(--color-bg-surface);">取消订单</button>
            <button class="h-8 px-4 rounded-lg text-[13px] font-semibold whitespace-nowrap" style="background: var(--color-brand-primary); color: var(--color-text-inverse);">去支付</button>
          </div>
        </section>

        <!-- Order Card 2: 进行中 -->
        <section class="rounded-xl p-4" style="background: var(--color-bg-surface); box-shadow: var(--shadow-card);">
          <!-- Top row: order number + status badge -->
          <div class="flex items-center justify-between">
            <span class="text-[12px] font-mono whitespace-nowrap" style="color: var(--color-text-tertiary);">SN20260630002</span>
            <span class="inline-flex items-center rounded-md px-2 py-0.5 text-[12px] font-medium whitespace-nowrap" style="background: var(--color-brand-primary-light); color: var(--color-brand-primary);">进行中</span>
          </div>

          <!-- Divider -->
          <div class="my-3" style="border-top: 1px solid var(--color-border-light);"></div>

          <!-- Skill info + price -->
          <div class="flex items-start gap-3">
            <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-lg" style="background: #ECFDF5;">
              <span class="text-[11px] font-bold" style="color: var(--state-success);">阿杰</span>
            </div>
            <div class="min-w-0 flex-1">
              <div class="flex items-center justify-between">
                <div class="min-w-0 flex-1">
                  <div class="flex items-center gap-1.5">
                    <span class="text-[14px] font-semibold truncate" style="color: var(--color-text-primary);">阿杰设计铺</span>
                  </div>
                  <p class="mt-0.5 text-[13px] truncate" style="color: var(--color-text-secondary);">Logo设计 — 基础版</p>
                </div>
                <span class="ml-2 shrink-0 text-[16px] font-bold whitespace-nowrap" style="color: var(--color-text-primary);">¥88.00</span>
              </div>
            </div>
          </div>

          <!-- Timestamp -->
          <p class="mt-2.5 text-[11px]" style="color: var(--color-text-tertiary);">2026-06-30 10:15</p>

          <!-- Action buttons -->
          <div class="mt-3 flex items-center justify-end gap-2">
            <button class="h-8 px-3 rounded-lg text-[13px] font-medium whitespace-nowrap" style="border: 1px solid var(--color-border-default); color: var(--color-text-secondary); background: var(--color-bg-surface);">联系卖家</button>
            <button class="h-8 px-4 rounded-lg text-[13px] font-semibold whitespace-nowrap" style="background: var(--color-brand-primary); color: var(--color-text-inverse);">查看详情</button>
          </div>
        </section>

        <!-- Empty state hint -->
        <div class="py-6 text-center">
          <p class="text-[13px]" style="color: var(--color-text-tertiary);">暂无更多订单</p>
        </div>

      </div>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
