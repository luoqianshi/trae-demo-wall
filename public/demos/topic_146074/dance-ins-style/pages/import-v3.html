<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导入练习 - 扒舞助手</title>
    <style id="theme-vars">
/* ============================================
   Brand CSS — Instagram-inspired Dance Practice App
   Style: Warm, trendy, minimal, editorial
   Tone: Warm/Human with fashion magazine feel
   ============================================ */

:root {
  /* === Color System === */
  /* Primary: Warm coral-rose */
  --primary: #E8646A;
  --primary-foreground: #FFFFFF;

  /* Background & Foreground */
  --background: #FAF8F6;
  --foreground: #1A1A1A;

  /* Card */
  --card: #FFFFFF;
  --card-foreground: #1A1A1A;

  /* Muted */
  --muted: #F2EFEC;
  --muted-foreground: #A39E99;

  /* Secondary text */
  --secondary-foreground: #6B6560;

  /* Border */
  --border: rgba(0, 0, 0, 0.06);
  --input: rgba(0, 0, 0, 0.06);
  --ring: #E8646A;

  /* Destructive */
  --destructive: #E05555;

  /* State Colors */
  --state-success: #4CAF82;
  --state-success-bg: rgba(76, 175, 130, 0.1);
  --state-warning: #F0A030;
  --state-warning-bg: rgba(240, 160, 48, 0.1);
  --state-error: #E05555;
  --state-error-bg: rgba(224, 85, 85, 0.1);
  --state-info: #6BA3D6;
  --state-info-bg: rgba(107, 163, 214, 0.1);

  /* Alias variables for custom usage */
  --color-primary: #E8646A;
  --color-primary-hover: #D4545A;
  --color-primary-light: rgba(232, 100, 106, 0.12);
  --color-primary-muted: rgba(232, 100, 106, 0.06);
  --color-bg: #FAF8F6;
  --color-bg-elevated: #FFFFFF;
  --color-bg-sunken: #F2EFEC;
  --color-bg-inset: #EBE8E4;
  --color-text: #1A1A1A;
  --color-text-secondary: #6B6560;
  --color-text-muted: #A39E99;
  --color-text-inverse: #FFFFFF;
  --color-border: rgba(0, 0, 0, 0.06);
  --color-border-strong: rgba(0, 0, 0, 0.12);
  --color-divider: rgba(0, 0, 0, 0.04);

  /* === Typography === */
  --font-display: 'DM Serif Display', Georgia, 'Noto Serif SC', serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --font-mono: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;

  /* Type Scale */
  --text-xs: 11px;
  --text-sm: 13px;
  --text-base: 15px;
  --text-md: 17px;
  --text-lg: 22px;
  --text-xl: 28px;
  --text-2xl: 36px;
  --text-3xl: 48px;

  /* Line Heights */
  --leading-tight: 1.2;
  --leading-snug: 1.35;
  --leading-normal: 1.5;
  --leading-relaxed: 1.65;

  /* Font Weights */
  --weight-normal: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;

  /* === Shape System === */
  --radius-sm: 4px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* === Spacing System === */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  /* === Surface & Depth === */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.06);
  --shadow-float: 0 16px 48px rgba(0, 0, 0, 0.1);
}

/* === Typography Classes === */
.font-display { font-family: var(--font-display); font-weight: var(--weight-bold); line-height: var(--leading-tight); }
.font-body { font-family: var(--font-body); font-weight: var(--weight-normal); line-height: var(--leading-normal); }
.font-mono { font-family: var(--font-mono); }

.text-xs { font-size: var(--text-xs); }
.text-sm { font-size: var(--text-sm); }
.text-base { font-size: var(--text-base); }
.text-md { font-size: var(--text-md); }
.text-lg { font-size: var(--text-lg); }
.text-xl { font-size: var(--text-xl); }
.text-2xl { font-size: var(--text-2xl); }
.text-3xl { font-size: var(--text-3xl); }

.font-medium { font-weight: var(--weight-medium); }
.font-semibold { font-weight: var(--weight-semibold); }
.font-bold { font-weight: var(--weight-bold); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-foreground: var(--primary-foreground);
  }
  @layer base {
    body { background: var(--primary-background); color: var(--primary-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="min-h-screen" style="background: var(--color-bg);">

      <!-- Top Row -->
      <div class="flex items-center justify-between px-5 pt-5 pb-3">
        <div>
          <h1 class="font-display text-[24px] leading-tight" style="color: var(--color-text);">导入练习</h1>
          <p class="mt-1 text-[13px]" style="color: var(--color-text-muted);">支持抖音、小红书、B站链接识别</p>
        </div>
        <button class="inline-flex items-center justify-center w-[38px] h-[38px] rounded-full border-none" style="background: var(--color-bg-elevated); box-shadow: var(--shadow-sm);" aria-label="下一步">
          <i data-lucide="arrow-right" class="w-[18px] h-[18px]" style="color: var(--color-text);"></i>
        </button>
      </div>

      <!-- Import Card -->
      <div class="mx-5 mt-2 rounded-2xl p-[14px]" style="background: var(--color-bg-elevated); border: 1px solid var(--color-border); border-radius: var(--radius-lg);">

        <!-- Tab Selector -->
        <div class="flex rounded-xl p-1" style="background: var(--color-bg-sunken); border-radius: 12px;">
          <button class="flex-1 py-[7px] text-[13px] font-semibold rounded-lg text-center" style="background: var(--color-bg-elevated); color: var(--color-primary); box-shadow: var(--shadow-sm); border-radius: var(--radius-md);">粘贴链接</button>
          <button class="flex-1 py-[7px] text-[13px] font-medium rounded-lg text-center" style="background: transparent; color: var(--color-text-muted);">本地上传</button>
        </div>

        <!-- Link Input Area -->
        <div class="mt-4">
          <label class="block text-[13px] font-semibold mb-2" style="color: var(--color-text);">视频链接</label>
          <textarea class="w-full rounded-2xl resize-none text-[13px] placeholder-opacity-60 focus:outline-none focus:ring-2" style="background: var(--color-bg-sunken); border: 1px solid var(--color-border); border-radius: 14px; min-height: 112px; padding: 12px; color: var(--color-text); font-family: var(--font-body); font-size: var(--text-sm);" placeholder="粘贴抖音 / 小红书 / B站链接"></textarea>
        </div>

        <!-- Platform Row -->
        <div class="flex items-center justify-between mt-3">
          <span class="text-[13px]" style="color: var(--color-text-muted);">等待识别链接来源</span>
          <span class="inline-flex items-center px-3 py-[3px] rounded-full text-[12px] font-bold" style="background: var(--color-primary); color: var(--color-text-inverse);">未知</span>
        </div>

        <!-- Divider -->
        <div class="my-4" style="border-top: 1px solid var(--color-divider);"></div>

        <!-- Switch List -->
        <div class="flex flex-col gap-4">
          <!-- Mirror Toggle -->
          <div class="flex items-center justify-between" data-feature="mirror">
            <span class="text-[14px]" style="color: var(--color-text);">镜面翻转</span>
            <div class="relative inline-flex items-center w-[44px] h-[24px] rounded-full cursor-pointer" style="background: var(--color-primary);">
              <div class="absolute top-[2px] left-[22px] w-[20px] h-[20px] rounded-full" style="background: var(--color-bg-elevated); box-shadow: var(--shadow-sm); transition: left 0.2s;"></div>
            </div>
          </div>
          <!-- Vocal Remove Toggle -->
          <div class="flex items-center justify-between">
            <span class="text-[14px]" style="color: var(--color-text);">人声消除</span>
            <div class="relative inline-flex items-center w-[44px] h-[24px] rounded-full cursor-pointer" style="background: var(--color-border-strong);">
              <div class="absolute top-[2px] left-[2px] w-[20px] h-[20px] rounded-full" style="background: var(--color-bg-elevated); box-shadow: var(--shadow-sm); transition: left 0.2s;"></div>
            </div>
          </div>
          <!-- Beat Detect Toggle -->
          <div class="flex items-center justify-between">
            <span class="text-[14px]" style="color: var(--color-text);">节拍识别</span>
            <div class="relative inline-flex items-center w-[44px] h-[24px] rounded-full cursor-pointer" style="background: var(--color-primary);">
              <div class="absolute top-[2px] left-[22px] w-[20px] h-[20px] rounded-full" style="background: var(--color-bg-elevated); box-shadow: var(--shadow-sm); transition: left 0.2s;"></div>
            </div>
          </div>
        </div>

        <!-- Submit Button -->
        <button data-dom-id="btn-start-practice" class="w-full mt-5 py-[12px] rounded-xl text-[15px] font-bold text-center border-none cursor-pointer" style="background: linear-gradient(135deg, #E8646A 0%, #D4545A 100%); color: var(--color-text-inverse); border-radius: var(--radius-md); min-height: 46px;">
          生成练习谱
        </button>
      </div>

      <!-- Bottom spacing for tab bar -->
      <div class="h-24"></div>

      <!-- Bottom Tab Bar -->
      <nav class="fixed bottom-0 left-0 right-0 z-40" style="background: rgba(250, 248, 246, 0.88); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--color-divider);">
        <div class="flex items-center justify-around h-[52px] px-6">
          <!-- Home Tab -->
          <button data-dom-id="nav-home-tab" class="flex flex-col items-center gap-[2px] py-1 bg-transparent border-none cursor-pointer">
            <i data-lucide="home" class="w-[22px] h-[22px]" style="color: var(--color-text-muted);"></i>
            <span class="text-[10px]" style="color: var(--color-text-muted);">首页</span>
          </button>
          <!-- Practice Tab (Hero) -->
          <button data-dom-id="nav-practice-tab" class="flex flex-col items-center gap-[2px] py-1 border-none cursor-pointer">
            <div class="flex flex-col items-center gap-[2px] px-4 py-[6px] rounded-full" style="background: var(--color-primary-light);">
              <img src="../assets/star-logo.jpg" alt="练习" class="w-[26px] h-[26px] rounded-full object-cover">
              <span class="text-[11px] font-bold" style="color: var(--color-primary);">练习</span>
            </div>
          </button>
          <!-- Profile Tab -->
          <button data-dom-id="nav-profile-tab" class="flex flex-col items-center gap-[2px] py-1 bg-transparent border-none cursor-pointer">
            <i data-lucide="user" class="w-[22px] h-[22px]" style="color: var(--color-text-muted);"></i>
            <span class="text-[10px]" style="color: var(--color-text-muted);">我的</span>
          </button>
        </div>
        <!-- Safe area spacer -->
        <div class="h-[env(safe-area-inset-bottom, 0px)]"></div>
      </nav>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
