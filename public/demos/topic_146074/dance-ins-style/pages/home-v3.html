<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>舞蹈练习生 - 首页</title>
    <style id="theme-vars">
/* ============================================
   Brand CSS — Instagram-inspired Dance Practice App
   Style: Warm, trendy, minimal, editorial
   Tone: Warm/Human with fashion magazine feel
   ============================================ */

:root {
  /* === Color System === */
  /* Primary: Warm coral-rose */
  --primary: #E8646A;
  --primary-foreground: #FFFFFF;

  /* Background & Foreground */
  --background: #FAF8F6;
  --foreground: #1A1A1A;

  /* Card */
  --card: #FFFFFF;
  --card-foreground: #1A1A1A;

  /* Muted */
  --muted: #F2EFEC;
  --muted-foreground: #A39E99;

  /* Secondary text */
  --secondary-foreground: #6B6560;

  /* Border */
  --border: rgba(0, 0, 0, 0.06);
  --input: rgba(0, 0, 0, 0.06);
  --ring: #E8646A;

  /* Destructive */
  --destructive: #E05555;

  /* State Colors */
  --state-success: #4CAF82;
  --state-success-bg: rgba(76, 175, 130, 0.1);
  --state-warning: #F0A030;
  --state-warning-bg: rgba(240, 160, 48, 0.1);
  --state-error: #E05555;
  --state-error-bg: rgba(224, 85, 85, 0.1);
  --state-info: #6BA3D6;
  --state-info-bg: rgba(107, 163, 214, 0.1);

  /* Alias variables for custom usage */
  --color-primary: #E8646A;
  --color-primary-hover: #D4545A;
  --color-primary-light: rgba(232, 100, 106, 0.12);
  --color-primary-muted: rgba(232, 100, 106, 0.06);
  --color-bg: #FAF8F6;
  --color-bg-elevated: #FFFFFF;
  --color-bg-sunken: #F2EFEC;
  --color-bg-inset: #EBE8E4;
  --color-text: #1A1A1A;
  --color-text-secondary: #6B6560;
  --color-text-muted: #A39E99;
  --color-text-inverse: #FFFFFF;
  --color-border: rgba(0, 0, 0, 0.06);
  --color-border-strong: rgba(0, 0, 0, 0.12);
  --color-divider: rgba(0, 0, 0, 0.04);

  /* === Typography === */
  --font-display: 'DM Serif Display', Georgia, 'Noto Serif SC', serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --font-mono: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;

  /* Type Scale */
  --text-xs: 11px;
  --text-sm: 13px;
  --text-base: 15px;
  --text-md: 17px;
  --text-lg: 22px;
  --text-xl: 28px;
  --text-2xl: 36px;
  --text-3xl: 48px;

  /* Line Heights */
  --leading-tight: 1.2;
  --leading-snug: 1.35;
  --leading-normal: 1.5;
  --leading-relaxed: 1.65;

  /* Font Weights */
  --weight-normal: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;

  /* === Shape System === */
  --radius-sm: 4px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* === Spacing System === */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  /* === Surface & Depth === */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.06);
  --shadow-float: 0 16px 48px rgba(0, 0, 0, 0.1);
}

/* === Typography Classes === */
.font-display { font-family: var(--font-display); font-weight: var(--weight-bold); line-height: var(--leading-tight); }
.font-body { font-family: var(--font-body); font-weight: var(--weight-normal); line-height: var(--leading-normal); }
.font-mono { font-family: var(--font-mono); }

.text-xs { font-size: var(--text-xs); }
.text-sm { font-size: var(--text-sm); }
.text-base { font-size: var(--text-base); }
.text-md { font-size: var(--text-md); }
.text-lg { font-size: var(--text-lg); }
.text-xl { font-size: var(--text-xl); }
.text-2xl { font-size: var(--text-2xl); }
.text-3xl { font-size: var(--text-3xl); }

.font-medium { font-weight: var(--weight-medium); }
.font-semibold { font-weight: var(--weight-semibold); }
.font-bold { font-weight: var(--weight-bold); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-foreground: var(--primary-foreground);
  }
  @layer base {
    body { background: var(--primary-background); color: var(--primary-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="background: var(--color-bg); color: var(--color-text);">

    <main class="px-5 pt-6 pb-24 max-w-md mx-auto">

      <!-- 1. Top Row -->
      <div class="flex items-start justify-between mb-5">
        <div>
          <h1 class="font-display text-[24px] leading-tight" style="color: var(--color-text);">舞蹈练习生</h1>
          <p class="mt-0.5 text-[13px]" style="color: var(--color-text-muted);">今天也把动作拆细一点</p>
        </div>
        <button class="flex items-center justify-center w-[38px] h-[38px] rounded-full border" style="background: var(--color-bg-elevated); border-color: var(--color-border);" aria-label="设置">
          <i data-lucide="more-horizontal" class="w-[18px] h-[18px]" style="color: var(--color-text-secondary);"></i>
        </button>
      </div>

      <!-- 2. User Card -->
      <div class="flex items-center gap-3.5 p-4 rounded-[var(--radius-lg)] border mb-5" style="background: var(--color-bg-elevated); border-color: var(--color-border);">
        <div class="flex items-center justify-center w-[52px] h-[52px] rounded-full shrink-0" style="background: linear-gradient(135deg, #E8646A, #F0A0B0);">
          <span class="font-display text-[20px] text-white">冰</span>
        </div>
        <div class="flex-1 min-w-0">
          <div class="text-[17px] font-bold leading-tight" style="color: var(--color-text);">练习生小冰</div>
          <div class="mt-1 text-[13px]" style="color: var(--color-text-muted);">本周已完成 5 次练习</div>
        </div>
        <div class="shrink-0 px-3 py-1 rounded-full text-[12px] font-bold" style="background: var(--color-primary-light); color: var(--color-primary);">36.5 小时</div>
      </div>

      <!-- 3. Quick Actions Grid (2x1) -->
      <div class="grid grid-cols-2 gap-3 mb-6">
        <!-- New Practice Card -->
        <div data-dom-id="cta-new-practice" class="relative overflow-hidden p-4 rounded-[var(--radius-lg)] cursor-pointer" style="background: linear-gradient(135deg, #E8646A, #F4A0A6);">
          <div class="text-[22px] mb-1.5">&#x2728;</div>
          <div class="text-[15px] font-bold text-white leading-snug">新建练习</div>
          <div class="mt-1.5 text-[11px] text-white/75 leading-snug">导入视频，自动拆分片段</div>
          <div class="mt-3 px-3 py-1 rounded-full text-[12px] font-semibold w-fit" style="background: rgba(255,255,255,0.25); color: #FFFFFF;">开始</div>
        </div>

        <!-- Continue Practice Card -->
        <div data-dom-id="cta-continue-practice" class="relative overflow-hidden p-4 rounded-[var(--radius-lg)] cursor-pointer" style="background: linear-gradient(135deg, #4CAF82, #7BC8A4);">
          <div class="flex items-center justify-center w-6 h-6 rounded-full mt-0.5 mb-1.5" style="background: rgba(255,255,255,0.25);">
            <i data-lucide="play" class="w-3 h-3 text-white fill-white"></i>
          </div>
          <div class="text-[15px] font-bold text-white leading-snug">继续练习</div>
          <div class="mt-1.5 text-[11px] text-white/75 leading-snug">继续 Pink Venom 练习</div>
          <div class="mt-3 px-3 py-1 rounded-full text-[12px] font-semibold w-fit" style="background: rgba(255,255,255,0.25); color: #FFFFFF;">0.9x 速度</div>
        </div>
      </div>

      <!-- 4. Recent Practice Section -->
      <section class="mb-6">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-[17px] font-bold" style="color: var(--color-text);">最近练习</h2>
          <span class="px-2.5 py-0.5 rounded-full text-[12px]" style="background: var(--color-bg-sunken); color: var(--color-text-muted);">共 12 条</span>
        </div>

        <div class="flex flex-col gap-2.5">
          <!-- Card 1 -->
          <div data-dom-id="task-item-1" class="flex items-center justify-between p-3.5 rounded-[var(--radius-lg)] border cursor-pointer" style="background: var(--color-bg-elevated); border-color: var(--color-border);">
            <div class="flex-1 min-w-0">
              <div class="text-[15px] font-bold leading-snug" style="color: var(--color-text);">BLACKPINK - Pink Venom</div>
              <div class="mt-1 text-[12px]" style="color: var(--color-text-muted);">今天 19:20 · 学动作 · 28 分钟</div>
            </div>
            <div class="shrink-0 ml-3 px-2.5 py-0.5 rounded-full text-[11px] font-semibold" style="background: var(--color-primary-light); color: var(--color-primary);">1-1</div>
          </div>

          <!-- Card 2 -->
          <div class="flex items-center justify-between p-3.5 rounded-[var(--radius-lg)] border cursor-pointer" style="background: var(--color-bg-elevated); border-color: var(--color-border);">
            <div class="flex-1 min-w-0">
              <div class="text-[15px] font-bold leading-snug" style="color: var(--color-text);">NewJeans - Super Shy</div>
              <div class="mt-1 text-[12px]" style="color: var(--color-text-muted);">昨天 21:04 · 技术分析 · 42 分钟</div>
            </div>
            <div class="shrink-0 ml-3 px-2.5 py-0.5 rounded-full text-[11px] font-semibold" style="background: var(--color-bg-sunken); color: var(--color-text-secondary);">2-3</div>
          </div>

          <!-- Card 3 -->
          <div class="flex items-center justify-between p-3.5 rounded-[var(--radius-lg)] border cursor-pointer" style="background: var(--color-bg-elevated); border-color: var(--color-border);">
            <div class="flex-1 min-w-0">
              <div class="text-[15px] font-bold leading-snug" style="color: var(--color-text);">IVE - Love Dive</div>
              <div class="mt-1 text-[12px]" style="color: var(--color-text-muted);">周六 16:30 · AB循环 · 18 分钟</div>
            </div>
            <div class="shrink-0 ml-3 px-2.5 py-0.5 rounded-full text-[11px] font-semibold" style="background: var(--color-bg-sunken); color: var(--color-text-secondary);">3-2</div>
          </div>
        </div>
      </section>

    </main>

    <!-- 5. Bottom Tab Bar (frosted glass) -->
    <nav class="fixed bottom-0 inset-x-0 z-40 border-t" style="background: rgba(250,248,246,0.82); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-color: var(--color-border);">
      <div class="flex items-end justify-around max-w-md mx-auto px-4 pt-1.5 pb-2" style="padding-bottom: max(8px, env(safe-area-inset-bottom));">
        <!-- 首页 tab (LEFT) -->
        <button class="flex flex-col items-center gap-0.5 w-16 py-1" aria-label="首页">
          <i data-lucide="home" class="w-[22px] h-[22px]" style="color: var(--color-primary);"></i>
          <span class="text-[11px] font-semibold" style="color: var(--color-primary);">首页</span>
          <span class="w-1 h-1 rounded-full mt-0.5" style="background: var(--color-primary);"></span>
        </button>

        <!-- 练习 tab (CENTER, HERO) -->
        <button data-dom-id="nav-practice-tab" class="flex flex-col items-center gap-0.5 w-16 py-1 -mt-3" aria-label="练习">
          <div class="flex flex-col items-center px-4 py-1.5 rounded-full" style="background: var(--color-primary-light);">
            <img src="../assets/star-logo.jpg" alt="" class="w-[26px] h-[26px] mb-0.5" style="object-fit: contain;">
            <span class="text-[12px] font-bold" style="color: var(--color-primary);">练习</span>
          </div>
        </button>

        <!-- 我的 tab (RIGHT) -->
        <button data-dom-id="nav-profile-tab" class="flex flex-col items-center gap-0.5 w-16 py-1" aria-label="我的">
          <i data-lucide="user" class="w-[22px] h-[22px]" style="color: var(--color-text-muted);"></i>
          <span class="text-[11px] font-medium" style="color: var(--color-text-muted);">我的</span>
        </button>
      </div>
    </nav>

    <script>lucide.createIcons();</script>
</body>
</html>
