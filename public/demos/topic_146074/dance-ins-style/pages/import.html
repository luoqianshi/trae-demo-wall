<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导入舞蹈视频 — 扒舞助手</title>
    <style id="theme-vars">
/* ============================================
   Brand CSS — Instagram-inspired Dance Practice App
   Style: Warm, trendy, minimal, editorial
   Tone: Warm/Human with fashion magazine feel
   ============================================ */

:root {
  /* === Color System === */
  /* Primary: Warm coral-rose */
  --primary: #E8646A;
  --primary-foreground: #FFFFFF;

  /* Background & Foreground */
  --background: #FAF8F6;
  --foreground: #1A1A1A;

  /* Card */
  --card: #FFFFFF;
  --card-foreground: #1A1A1A;

  /* Muted */
  --muted: #F2EFEC;
  --muted-foreground: #A39E99;

  /* Secondary text */
  --secondary-foreground: #6B6560;

  /* Border */
  --border: rgba(0, 0, 0, 0.06);
  --input: rgba(0, 0, 0, 0.06);
  --ring: #E8646A;

  /* Destructive */
  --destructive: #E05555;

  /* State Colors */
  --state-success: #4CAF82;
  --state-success-bg: rgba(76, 175, 130, 0.1);
  --state-warning: #F0A030;
  --state-warning-bg: rgba(240, 160, 48, 0.1);
  --state-error: #E05555;
  --state-error-bg: rgba(224, 85, 85, 0.1);
  --state-info: #6BA3D6;
  --state-info-bg: rgba(107, 163, 214, 0.1);

  /* Alias variables for custom usage */
  --color-primary: #E8646A;
  --color-primary-hover: #D4545A;
  --color-primary-light: rgba(232, 100, 106, 0.12);
  --color-primary-muted: rgba(232, 100, 106, 0.06);
  --color-bg: #FAF8F6;
  --color-bg-elevated: #FFFFFF;
  --color-bg-sunken: #F2EFEC;
  --color-bg-inset: #EBE8E4;
  --color-text: #1A1A1A;
  --color-text-secondary: #6B6560;
  --color-text-muted: #A39E99;
  --color-text-inverse: #FFFFFF;
  --color-border: rgba(0, 0, 0, 0.06);
  --color-border-strong: rgba(0, 0, 0, 0.12);
  --color-divider: rgba(0, 0, 0, 0.04);

  /* === Typography === */
  --font-display: 'DM Serif Display', Georgia, 'Noto Serif SC', serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --font-mono: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;

  /* Type Scale */
  --text-xs: 11px;
  --text-sm: 13px;
  --text-base: 15px;
  --text-md: 17px;
  --text-lg: 22px;
  --text-xl: 28px;
  --text-2xl: 36px;
  --text-3xl: 48px;

  /* Line Heights */
  --leading-tight: 1.2;
  --leading-snug: 1.35;
  --leading-normal: 1.5;
  --leading-relaxed: 1.65;

  /* Font Weights */
  --weight-normal: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;

  /* === Shape System === */
  --radius-sm: 4px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* === Spacing System === */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  /* === Surface & Depth === */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.06);
  --shadow-float: 0 16px 48px rgba(0, 0, 0, 0.1);
}

/* === Typography Classes === */
.font-display { font-family: var(--font-display); font-weight: var(--weight-bold); line-height: var(--leading-tight); }
.font-body { font-family: var(--font-body); font-weight: var(--weight-normal); line-height: var(--leading-normal); }
.font-mono { font-family: var(--font-mono); }

.text-xs { font-size: var(--text-xs); }
.text-sm { font-size: var(--text-sm); }
.text-base { font-size: var(--text-base); }
.text-md { font-size: var(--text-md); }
.text-lg { font-size: var(--text-lg); }
.text-xl { font-size: var(--text-xl); }
.text-2xl { font-size: var(--text-2xl); }
.text-3xl { font-size: var(--text-3xl); }

.font-medium { font-weight: var(--weight-medium); }
.font-semibold { font-weight: var(--weight-semibold); }
.font-bold { font-weight: var(--weight-bold); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-foreground: var(--primary-foreground);
  }
  @layer base {
    body { background: var(--primary-background); color: var(--primary-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">

    <!-- Brand tokens (inline since brand CSS is empty) -->
    <style>
      :root {
        --color-primary: #E8646A;
        --color-primary-light: rgba(232,100,106,0.12);
        --color-bg: #FAF8F6;
        --color-bg-elevated: #FFFFFF;
        --color-bg-sunken: #F2EFEC;
        --color-text: #1A1A1A;
        --color-text-secondary: #6B6560;
        --color-text-muted: #A39E99;
        --color-border: rgba(0,0,0,0.06);
        --state-success: #4CAF82;
        --font-display: 'DM Serif Display', Georgia, 'Noto Serif SC', serif;
        --radius-md: 10px;
        --radius-lg: 16px;
        --radius-xl: 20px;
        --radius-full: 9999px;
        --shadow-md: 0 2px 8px rgba(0,0,0,0.05);
      }
      body { background: var(--color-bg); color: var(--color-text); }
    </style>

    <main class="flex flex-col min-h-screen pb-24">

      <!-- ===== Top Navigation ===== -->
      <header class="sticky top-0 z-30 bg-[var(--color-bg)]/95 backdrop-blur-md">
        <div class="flex items-center justify-center h-12 px-4 relative">
          <button data-dom-id="back-to-home"
                  class="absolute left-4 top-1/2 -translate-y-1/2 inline-flex items-center justify-center w-9 h-9 rounded-full bg-[var(--color-bg-elevated)]"
                  style="box-shadow: var(--shadow-md);"
                  aria-label="返回首页">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>
          <h1 class="text-[17px] font-semibold tracking-[-0.01em]" style="font-family: var(--font-display);">导入舞蹈视频</h1>
        </div>
      </header>

      <!-- ===== Main Content Card ===== -->
      <div class="flex-1 px-4 pt-5">
        <div class="rounded-[var(--radius-xl)] bg-[var(--color-bg-elevated)] p-6" style="box-shadow: var(--shadow-md);">

          <!-- Import Method Selection -->
          <div class="grid grid-cols-2 gap-3 mb-6">
            <!-- Active card: 粘贴链接 -->
            <button class="flex flex-col items-center justify-center gap-2.5 rounded-[var(--radius-lg)] p-4 border-2 transition-all"
                    style="background: var(--color-primary-light); border-color: var(--color-primary);">
              <span class="text-2xl leading-none">&#x1F517;</span>
              <span class="text-[13px] font-semibold" style="color: var(--color-primary);">粘贴链接</span>
            </button>
            <!-- Default card: 本地上传 -->
            <button class="flex flex-col items-center justify-center gap-2.5 rounded-[var(--radius-lg)] p-4 border-2 transition-all"
                    style="background: var(--color-bg); border-color: var(--color-border);">
              <span class="text-2xl leading-none">&#x1F4C1;</span>
              <span class="text-[13px] font-medium" style="color: var(--color-text-secondary);">本地上传</span>
            </button>
          </div>

          <!-- Link Input -->
          <div class="relative mb-6">
            <input type="text"
                   placeholder="粘贴抖音、小红书、B站分享链接..."
                   readonly
                   class="w-full h-[52px] rounded-[var(--radius-lg)] pl-4 pr-16 text-[14px] outline-none placeholder:text-[var(--color-text-muted)]"
                   style="background: var(--color-bg-sunken); border: 1.5px solid var(--color-border); color: var(--color-text); font-family: system-ui, sans-serif;">
            <!-- Platform badge (demo visual) -->
            <span class="absolute right-3 top-1/2 -translate-y-1/2 inline-flex items-center px-2.5 py-1 rounded-full text-[12px] font-medium"
                  style="background: var(--color-primary-light); color: var(--color-primary);">
              &#x1F3A5; 抖音
            </span>
          </div>

          <!-- Preprocessing Settings -->
          <div class="mb-6">
            <h2 class="text-[13px] font-semibold mb-3 tracking-[-0.01em]" style="color: var(--color-text-secondary);">预处理设置</h2>
            <div class="flex flex-wrap gap-2.5">
              <!-- Active: 镜面翻转 -->
              <button class="inline-flex items-center gap-1.5 px-4 py-2 rounded-full text-[13px] font-medium transition-all"
                      style="border: 1.5px solid var(--color-primary); background: var(--color-primary-light); color: var(--color-primary);">
                <span class="w-1.5 h-1.5 rounded-full" style="background: var(--color-primary);"></span>
                镜面翻转
              </button>
              <!-- Active: 人声消除 -->
              <button class="inline-flex items-center gap-1.5 px-4 py-2 rounded-full text-[13px] font-medium transition-all"
                      style="border: 1.5px solid var(--color-primary); background: var(--color-primary-light); color: var(--color-primary);">
                <span class="w-1.5 h-1.5 rounded-full" style="background: var(--color-primary);"></span>
                人声消除
              </button>
              <!-- Active: 节拍识别 -->
              <button class="inline-flex items-center gap-1.5 px-4 py-2 rounded-full text-[13px] font-medium transition-all"
                      style="border: 1.5px solid var(--color-primary); background: var(--color-primary-light); color: var(--color-primary);">
                <span class="w-1.5 h-1.5 rounded-full" style="background: var(--color-primary);"></span>
                节拍识别
              </button>
            </div>
          </div>

          <!-- Start Button -->
          <button data-dom-id="btn-start-practice"
                  class="w-full h-[52px] rounded-full text-[16px] font-semibold text-white tracking-[-0.01em] transition-all active:scale-[0.98]"
                  style="background: linear-gradient(135deg, #E8646A 0%, #F0878C 100%); box-shadow: 0 4px 14px rgba(232,100,106,0.35);">
            开始练习
          </button>

        </div>
      </div>

    </main>

    <!-- ===== Bottom Tab Bar ===== -->
    <nav class="fixed bottom-0 left-0 right-0 z-40" style="background: rgba(250, 248, 246, 0.88); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--color-border);">
      <div class="flex items-center justify-around min-h-[56px] max-w-lg mx-auto">
        <!-- 首页 tab (inactive) -->
        <a href="#" data-dom-id="nav-home-tab" class="flex flex-col items-center justify-center gap-0.5 px-3 py-1" style="color: var(--color-text-muted);">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          <span class="text-[10px] font-medium">首页</span>
        </a>
        <!-- 练习 tab (hero / brand anchor) -->
        <a href="#" data-dom-id="nav-practice-tab" class="flex flex-col items-center justify-center gap-1 px-3 py-1" style="background: rgba(232,100,106,0.1); border-radius: 9999px; padding: 8px 18px;">
          <img src="../assets/logo-icon-v2.jpg" width="24" height="24" style="border-radius: 4px;" alt="练习">
          <span class="text-[12px] font-bold" style="color: #E8646A;">练习</span>
        </a>
        <!-- 我的 tab (inactive) -->
        <a href="#" data-dom-id="nav-profile-tab" class="flex flex-col items-center justify-center gap-0.5 px-3 py-1" style="color: var(--color-text-muted);">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <span class="text-[10px] font-medium">我的</span>
        </a>
      </div>
      <!-- Safe area spacer for iOS -->
      <div class="h-[env(safe-area-inset-bottom,0px)]"></div>
    </nav>

    <script>lucide.createIcons();</script>
</body>
</html>
