<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#16a34a" />
  <title>易售 E-Sale · 初赛 Demo</title>
  <style>
    :root {
      --green: #16a34a;
      --green-dark: #15803d;
      --green-soft: #dcfce7;
      --bg: #f4f5f7;
      --card: #fff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --warn: #f59e0b;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      box-shadow: 0 0 40px rgba(0,0,0,.08);
    }
    .topbar {
      background: var(--green);
      color: #fff;
      padding: 14px 16px 12px;
      flex: none;
    }
    .topbar h1 { font-size: 18px; font-weight: 700; }
    .topbar p { font-size: 12px; opacity: .88; margin-top: 2px; }
    .demo-tip {
      background: #fffbeb;
      border-bottom: 1px solid #fde68a;
      padding: 10px 14px;
      font-size: 12px;
      color: #92400e;
      flex: none;
    }
    .demo-tip strong { color: #b45309; }
    main { flex: 1; overflow: auto; padding-bottom: 72px; }
    .page { display: none; padding: 12px; }
    .page.active { display: block; }
    .cart-bar {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }
    .cart-bar .sum { font-size: 13px; color: var(--muted); }
    .cart-bar .sum b { display: block; font-size: 20px; color: var(--green-dark); }
    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: var(--green); color: #fff; }
    .btn-primary:disabled { opacity: .45; cursor: not-allowed; }
    .btn-ghost { background: #f3f4f6; color: var(--text); }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .product {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      cursor: pointer;
      transition: transform .12s, box-shadow .12s;
    }
    .product:active { transform: scale(.98); }
    .product.low { border-color: #fecaca; background: #fff5f5; }
    .product .emoji { font-size: 28px; }
    .product .name { font-size: 14px; font-weight: 600; margin: 6px 0 2px; }
    .product .meta { font-size: 12px; color: var(--muted); }
    .product .price { font-size: 15px; font-weight: 700; color: var(--green-dark); margin-top: 6px; }
    .badge {
      display: inline-block;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 999px;
      background: #fee2e2;
      color: var(--danger);
      margin-left: 4px;
    }
    .stat-cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
    }
    .stat-card .label { font-size: 12px; color: var(--muted); }
    .stat-card .value { font-size: 22px; font-weight: 700; color: var(--green-dark); margin-top: 4px; }
    .section-title {
      font-size: 14px;
      font-weight: 700;
      margin: 14px 0 8px;
      color: var(--text);
    }
    .list { display: flex; flex-direction: column; gap: 8px; }
    .list-item {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .list-item .left { flex: 1; min-width: 0; }
    .list-item .title { font-weight: 600; font-size: 14px; }
    .list-item .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .list-item .right { text-align: right; font-weight: 700; color: var(--green-dark); white-space: nowrap; }
    .tabbar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      display: flex;
      background: var(--card);
      border-top: 1px solid var(--line);
      padding: 6px 0 calc(6px + env(safe-area-inset-bottom, 0px));
      z-index: 10;
    }
    .tab {
      flex: 1;
      border: none;
      background: none;
      padding: 8px 4px;
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
    }
    .tab.active { color: var(--green-dark); font-weight: 700; }
    .tab .icon { display: block; font-size: 20px; margin-bottom: 2px; }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 20;
    }
    .overlay.show { display: flex; }
    .sheet {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border-radius: 18px 18px 0 0;
      padding: 18px 16px 24px;
      animation: slideUp .2s ease;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .sheet h3 { font-size: 17px; margin-bottom: 12px; }
    .sheet .row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; border-bottom: 1px dashed var(--line); }
    .sheet .row.total { border: none; font-size: 18px; font-weight: 700; color: var(--green-dark); padding-top: 12px; }
    .sheet-actions { display: flex; gap: 10px; margin-top: 16px; }
    .sheet-actions .btn { flex: 1; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 90px;
      transform: translateX(-50%);
      background: rgba(31,41,55,.92);
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
      z-index: 30;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }
    .empty { text-align: center; color: var(--muted); font-size: 13px; padding: 24px 12px; }
    .footer-note {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      padding: 16px 12px 8px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1 id="storeName">晨光文体</h1>
      <p>易售 E-Sale · 乡镇小店零售记账 Demo</p>
    </header>
    <div class="demo-tip">
      <strong>体验路径：</strong>收银点商品 → 收款完成 → 看库存减少 → 统计页查看今日毛利。
      数据保存在本机浏览器，可离线使用。
    </div>

    <main>
      <section class="page active" id="page-pos">
        <div class="cart-bar">
          <div class="sum">
            购物车 <span id="cartCount">0 件</span>
            <b id="cartTotal">¥0.00</b>
          </div>
          <button class="btn btn-primary" id="checkoutBtn" disabled>收款</button>
        </div>
        <div class="grid" id="posGrid"></div>
      </section>

      <section class="page" id="page-stock">
        <div class="section-title">商品库存 · 低库存预警</div>
        <div class="list" id="stockList"></div>
      </section>

      <section class="page" id="page-stats">
        <div class="stat-cards">
          <div class="stat-card">
            <div class="label">今日成交额</div>
            <div class="value" id="statRevenue">¥0.00</div>
          </div>
          <div class="stat-card">
            <div class="label">今日毛利</div>
            <div class="value" id="statProfit">¥0.00</div>
          </div>
          <div class="stat-card">
            <div class="label">毛利率</div>
            <div class="value" id="statMargin">—</div>
          </div>
          <div class="stat-card">
            <div class="label">成交笔数</div>
            <div class="value" id="statOrders">0</div>
          </div>
        </div>
        <div class="section-title">今日热销</div>
        <div class="list" id="rankList"></div>
        <div class="section-title">最近交易</div>
        <div class="list" id="orderList"></div>
        <div style="text-align:center;margin-top:12px;">
          <button class="btn btn-ghost" id="resetBtn" type="button">重置 Demo 示例数据</button>
        </div>
        <p class="footer-note">完整版含微信小程序 · 按斤售卖 · 批量进货 · 备份导出<br>源码见项目 miniprogram/ 目录</p>
      </section>
    </main>

    <nav class="tabbar">
      <button class="tab active" data-tab="pos" type="button"><span class="icon">🧾</span>收银</button>
      <button class="tab" data-tab="stock" type="button"><span class="icon">📦</span>库存</button>
      <button class="tab" data-tab="stats" type="button"><span class="icon">📊</span>统计</button>
    </nav>
  </div>

  <div class="overlay" id="checkoutOverlay">
    <div class="sheet">
      <h3>确认收款</h3>
      <div id="checkoutLines"></div>
      <div class="row total"><span>应收</span><span id="checkoutTotal">¥0.00</span></div>
      <p style="font-size:12px;color:var(--muted);margin-top:8px;">Demo 仅模拟记账，不接在线支付。完整版支持现金/扫码记账方式。</p>
      <div class="sheet-actions">
        <button class="btn btn-ghost" id="cancelCheckout" type="button">取消</button>
        <button class="btn btn-primary" id="confirmCheckout" type="button">完成记账</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    (function () {
      "use strict";

      const STORE_KEY = "esale_demo_v1";
      const LOW_STOCK = 15;

      const SAMPLE = {
        storeName: "晨光文体",
        products: [
          { id: "p1", name: "中性笔(支)", emoji: "✏️", price: 2, cost: 0.8, stock: 120, category: "文具" },
          { id: "p2", name: "A4作业本", emoji: "📒", price: 3, cost: 1.5, stock: 80, category: "文具" },
          { id: "p3", name: "2B铅笔(支)", emoji: "✏️", price: 1.5, cost: 0.6, stock: 100, category: "文具" },
          { id: "p4", name: "篮球", emoji: "🏀", price: 68, cost: 42, stock: 12, category: "体育" },
          { id: "p5", name: "羽毛球(筒)", emoji: "🏸", price: 35, cost: 22, stock: 8, category: "体育" },
          { id: "p6", name: "跳绳", emoji: "🪢", price: 15, cost: 8, stock: 25, category: "体育" },
          { id: "p7", name: "儿童书包", emoji: "🎒", price: 88, cost: 55, stock: 6, category: "百货" },
          { id: "p8", name: "透明胶带", emoji: "📦", price: 4, cost: 2, stock: 60, category: "文具" },
        ],
        orders: [],
      };

      let state = load();
      let cart = {};

      function load() {
        try {
          const raw = localStorage.getItem(STORE_KEY);
          if (raw) return JSON.parse(raw);
        } catch (e) {}
        return JSON.parse(JSON.stringify(SAMPLE));
      }

      function save() {
        localStorage.setItem(STORE_KEY, JSON.stringify(state));
      }

      function money(n) {
        return "¥" + (Math.round(n * 100) / 100).toFixed(2);
      }

      function toast(msg) {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.classList.add("show");
        setTimeout(() => el.classList.remove("show"), 1800);
      }

      function getProduct(id) {
        return state.products.find((p) => p.id === id);
      }

      function cartTotals() {
        let count = 0;
        let total = 0;
        for (const id in cart) {
          const p = getProduct(id);
          if (!p) continue;
          const qty = cart[id];
          count += qty;
          total += p.price * qty;
        }
        return { count, total };
      }

      function renderPos() {
        const grid = document.getElementById("posGrid");
        grid.innerHTML = state.products.map((p) => {
          const low = p.stock <= LOW_STOCK;
          const inCart = cart[p.id] || 0;
          return `<article class="product${low ? " low" : ""}" data-id="${p.id}">
            <div class="emoji">${p.emoji}</div>
            <div class="name">${p.name}${low ? '<span class="badge">待补货</span>' : ""}</div>
            <div class="meta">库存 ${p.stock} 件 · ${p.category}</div>
            <div class="price">${money(p.price)}${inCart ? ` · 已选 ${inCart}` : ""}</div>
          </article>`;
        }).join("");

        grid.querySelectorAll(".product").forEach((el) => {
          el.addEventListener("click", () => addToCart(el.dataset.id));
        });

        const { count, total } = cartTotals();
        document.getElementById("cartCount").textContent = count + " 件";
        document.getElementById("cartTotal").textContent = money(total);
        document.getElementById("checkoutBtn").disabled = count === 0;
      }

      function addToCart(id) {
        const p = getProduct(id);
        if (!p || p.stock <= 0) {
          toast("库存不足");
          return;
        }
        cart[id] = (cart[id] || 0) + 1;
        if (cart[id] > p.stock) cart[id] = p.stock;
        renderPos();
        toast("已加入：" + p.name);
      }

      function renderStock() {
        const list = document.getElementById("stockList");
        list.innerHTML = state.products.map((p) => {
          const low = p.stock <= LOW_STOCK;
          return `<div class="list-item">
            <div class="left">
              <div class="title">${p.emoji} ${p.name}${low ? ' <span class="badge">低库存</span>' : ""}</div>
              <div class="sub">${p.category} · 进价 ${money(p.cost)} · 售价 ${money(p.price)}</div>
            </div>
            <div class="right">${p.stock} 件</div>
          </div>`;
        }).join("");
      }

      function todayOrders() {
        const today = new Date().toDateString();
        return state.orders.filter((o) => new Date(o.time).toDateString() === today);
      }

      function renderStats() {
        const orders = todayOrders();
        let revenue = 0;
        let cost = 0;
        const sales = {};

        orders.forEach((o) => {
          revenue += o.total;
          cost += o.cost;
          o.items.forEach((it) => {
            sales[it.name] = (sales[it.name] || 0) + it.qty * it.price;
          });
        });

        const profit = revenue - cost;
        const margin = revenue > 0 ? ((profit / revenue) * 100).toFixed(1) + "%" : "—";

        document.getElementById("statRevenue").textContent = money(revenue);
        document.getElementById("statProfit").textContent = money(profit);
        document.getElementById("statMargin").textContent = margin;
        document.getElementById("statOrders").textContent = String(orders.length);

        const rank = Object.entries(sales).sort((a, b) => b[1] - a[1]).slice(0, 5);
        const rankList = document.getElementById("rankList");
        rankList.innerHTML = rank.length
          ? rank.map(([name, amt], i) => `<div class="list-item"><div class="left"><div class="title">${i + 1}. ${name}</div></div><div class="right">${money(amt)}</div></div>`).join("")
          : '<div class="empty">今天还没有成交，去收银页卖几笔吧</div>';

        const orderList = document.getElementById("orderList");
        const recent = [...orders].reverse().slice(0, 5);
        orderList.innerHTML = recent.length
          ? recent.map((o) => {
              const t = new Date(o.time).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
              return `<div class="list-item"><div class="left"><div class="title">${t} · ${o.items.length} 种商品</div><div class="sub">毛利 ${money(o.total - o.cost)}</div></div><div class="right">${money(o.total)}</div></div>`;
            }).join("")
          : '<div class="empty">暂无交易记录</div>';
      }

      function openCheckout() {
        const lines = [];
        let total = 0;
        let cost = 0;
        for (const id in cart) {
          const p = getProduct(id);
          const qty = cart[id];
          if (!p || !qty) continue;
          const lineTotal = p.price * qty;
          const lineCost = p.cost * qty;
          total += lineTotal;
          cost += lineCost;
          lines.push({ id, name: p.name, qty, price: p.price, cost: p.cost, lineTotal, lineCost });
        }
        document.getElementById("checkoutLines").innerHTML = lines.map((l) =>
          `<div class="row"><span>${l.name} × ${l.qty}</span><span>${money(l.lineTotal)}</span></div>`
        ).join("");
        document.getElementById("checkoutTotal").textContent = money(total);
        document.getElementById("checkoutOverlay").classList.add("show");
        document.getElementById("confirmCheckout").onclick = () => completeCheckout(lines, total, cost);
      }

      function completeCheckout(lines, total, cost) {
        lines.forEach((l) => {
          const p = getProduct(l.id);
          if (p) p.stock -= l.qty;
        });
        state.orders.push({
          time: Date.now(),
          total,
          cost,
          items: lines.map((l) => ({ name: l.name, qty: l.qty, price: l.price, cost: l.cost })),
        });
        cart = {};
        save();
        document.getElementById("checkoutOverlay").classList.remove("show");
        toast("记账完成 · 库存已更新");
        renderAll();
        switchTab("stats");
      }

      function switchTab(name) {
        document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t.dataset.tab === name));
        document.querySelectorAll(".page").forEach((p) => p.classList.toggle("active", p.id === "page-" + name));
        if (name === "stock") renderStock();
        if (name === "stats") renderStats();
      }

      function renderAll() {
        document.getElementById("storeName").textContent = state.storeName;
        renderPos();
        renderStock();
        renderStats();
      }

      document.querySelectorAll(".tab").forEach((t) => {
        t.addEventListener("click", () => switchTab(t.dataset.tab));
      });

      document.getElementById("checkoutBtn").addEventListener("click", openCheckout);
      document.getElementById("cancelCheckout").addEventListener("click", () => {
        document.getElementById("checkoutOverlay").classList.remove("show");
      });
      document.getElementById("checkoutOverlay").addEventListener("click", (e) => {
        if (e.target.id === "checkoutOverlay") e.target.classList.remove("show");
      });

      document.getElementById("resetBtn").addEventListener("click", () => {
        if (!confirm("重置后将恢复「晨光文体」示例商品与空订单，确定？")) return;
        state = JSON.parse(JSON.stringify(SAMPLE));
        cart = {};
        save();
        renderAll();
        switchTab("pos");
        toast("已重置 Demo 数据");
      });

      renderAll();
    })();
  </script>
</body>
</html>
