  var report = document.getElementById('mt-report');
  if (report) report.innerHTML = '<div class="hint">暂无核查结果</div>';
  resetReviewStatBar('mt');
  var exportBtn = document.getElementById('mt-export-btn');
  if (exportBtn) exportBtn.style.display = 'none';
}

function mtToggleFocus() {
  const box = document.getElementById('mt-ai-focus-box');
  const btn = document.getElementById('mt-focus-toggle');
  if (!box || !btn) return;
  const hidden = box.classList.toggle('hidden');
  btn.innerHTML = hidden ? iconText('plus', '添加自定义审查要点') : iconText('minus', '收起自定义审查要点');
}

var _mtLogTimer = null;
var _mtLogRecordId = null;
var _mtLogLastFp = '';

function mtRenderLogFromItem(progressItem, force) {
  var box = document.getElementById('mt-log-content');
  if (!box || !progressItem) return;
  var detail = progressItem.detail || {};
  var steps = detail.steps || [];
  var errors = detail.errors || [];
  var fp = reviewLogFingerprint(progressItem, steps, errors);
  if (!force && fp === _mtLogLastFp) return;
  _mtLogLastFp = fp;
  box.innerHTML = buildReviewLogHtml(progressItem, detail, steps, errors, _MT_STEP_LABELS, '处一致性风险');
}

function mtShowLog(recordId) {
  recordId = recordId || state.mtRunningRecordId || state.mtLastRecordId;
  if (!recordId) {
    var waitBox = document.getElementById('mt-log-content');
    var waitOl = document.getElementById('mt-log-overlay');
    if (waitOl) {
      waitOl.classList.remove('hidden');
      if (waitBox) {
        waitBox.innerHTML = '<div style="padding:16px;color:var(--ant-color-text-tertiary);text-align:center">正在创建审查任务，请稍候…</div>';
      }
    } else {
      showToast('正在创建审查任务，请稍候…', 'info');
    }
    return;
  }
  _mtLogRecordId = recordId;
  _mtLogLastFp = '';
  var ol = document.getElementById('mt-log-overlay');
  if (ol) {
    ol.classList.remove('hidden');
    var box = document.getElementById('mt-log-content');
    var cached = getReviewLogCache('multi', recordId);
    if (cached) {
      mtRenderLogFromItem(cached, true);
    } else if (box) {
      box.innerHTML = '<div style="padding:16px;color:var(--ant-color-text-tertiary);text-align:center">加载中...</div>';
    }
  }
  mtFetchLog(!getReviewLogCache('multi', recordId));
  if (_mtLogTimer) clearInterval(_mtLogTimer);
  _mtLogTimer = null;
  var activeTask = ReviewTaskManager.tasks.multi;
  if (!activeTask || String(activeTask.recordId) !== String(recordId)) {
    _mtLogTimer = setInterval(function() { mtFetchLog(false); }, 2000);
  }
}

function mtCloseLog() {
  var ol = document.getElementById('mt-log-overlay');
  if (ol) ol.classList.add('hidden');
  if (_mtLogTimer) { clearInterval(_mtLogTimer); _mtLogTimer = null; }
  _mtLogRecordId = null;
  _mtLogLastFp = '';
}

function mtStopLog() {
  if (_mtLogTimer) { clearInterval(_mtLogTimer); _mtLogTimer = null; }
}

var _MT_STEP_LABELS = [
  '文档解析',
  'AI语法审查',
  'AI格式审查',
  'AI文字校对',
  '目录结构审查',
  '参考资料一致性审查',
  'AI逻辑一致性审查',
  '专业常识审查',
  '自定义要点审查',
  '结果汇总去重',
];

async function mtFetchLog(forceRender) {
  if (!_mtLogRecordId) {
    var box = document.getElementById('mt-log-content');
    if (box) box.innerHTML = '<div style="padding:16px;color:#ef4444;text-align:center">未找到审查记录ID</div>';
    if (_mtLogTimer) { clearInterval(_mtLogTimer); _mtLogTimer = null; }
    return;
  }
  var box = document.getElementById('mt-log-content');
  if (!box) return;
  try {
    var resp = await fetch('/api/history/' + _mtLogRecordId + '/progress');
    if (handleAuthExpired(resp)) {
      mtCloseLog();
      return;
    }
    if (!resp.ok) { box.innerHTML = '<div class="hint">加载失败</div>'; return; }
    var respData = await resp.json();
    var item = respData.item || {};
    mtRenderLogFromItem(item, !!forceRender);
    if (item.status === 'done' || item.status === 'error' || item.status === 'cancelled') {
      mtStopLog();
    }
  } catch (e) { box.innerHTML = '<div class="hint" style="color:var(--ant-color-error);">加载失败: ' + e.message + '</div>'; }
}

function mtSeverityTag(sev) {
  const map = {high:['tag-high','高风险'],low:['tag-low','低风险']};
  const sevKey = normalizeSeverity(sev);
  const [cls, label] = map[sevKey];
  return `<span class="tag ${cls}">${label}</span>`;
}

function mtRenderDoc(markdown, activeIdx, tables, images, content, mammothHtml, opts) {
  opts = opts || {};
  const view = document.getElementById('mt-doc-view');
  if (!view) return;

  var viewMode = opts.viewMode || state.mtViewMode || 'preview';
  var hasContent = content && content.length;
  if (hasContent) {
    if (opts.forceContent) viewMode = 'positioning';
    state.mtViewMode = viewMode;
    updateDocModeBanner('mt', viewMode);
    view.innerHTML = wrapDocPage(buildContentHtml(content, activeIdx, 'mt-para-', 'mtSelectIssue', {
      addParaIds: true,
      anchorParagraphs: viewMode === 'positioning'
    }));
    scheduleMathJaxTypeset(view);
    if (activeIdx >= 0) mtHighlightParagraph(activeIdx);
    return;
  }

  state.mtViewMode = 'preview';
  updateDocModeBanner('mt', 'preview');

  if (mammothHtml) {
    view.innerHTML = wrapDocPage(renderMammothWithAnchors(mammothHtml, 'mt-para-', activeIdx, 'mtSelectIssue'));
    if (activeIdx >= 0) mtHighlightParagraph(activeIdx);
    return;
  }

  const paras = (markdown || '').split(/\n{2,}/g).map(function(p){return p.trim();}).filter(Boolean);
  if (!paras.length) {
    view.innerHTML = wrapDocPage('<div class="hint">文档内容为空</div>');
    return;
  }
  var parasHtml = paras.map(function(p, idx) {
    return '<p class="doc-para' + (idx === activeIdx ? ' active' : '') + '" id="mt-para-' + idx + '" onclick="mtSelectIssue(null,' + idx + ')">' + escapeHtml(p) + '</p>';
  }).join('');
  view.innerHTML = wrapDocPage(parasHtml);
  if (activeIdx >= 0) mtHighlightParagraph(activeIdx);
}

function mtHighlightParagraph(paraIdx) {
  var container = document.getElementById('mt-doc-view');
  if (!container) return;
  container.querySelectorAll('.doc-para, .doc-caption').forEach(function(el) {
    el.classList.remove('active');
  });
  var target = document.getElementById('mt-para-' + paraIdx);
  if (target) {
    target.classList.add('active');
    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function mtRenderReport(issues) {
  const box = document.getElementById('mt-report');
  if (!box) return;
  var suppressedCount = (state.mtResult && state.mtResult.ruleSuppressedCount) || 0;
  if ((!issues || !issues.length) && !suppressedCount) {
    box.innerHTML = '<div class="hint">未发现一致性问题</div>';
    return;
  }
  if (!issues || !issues.length) {
    issues = [];
  }
  const sevOrder = { high: 0, medium: 1, low: 2 };
  const sortedIssues = [...issues].sort((a, b) => {
    const sevA = sevOrder[a.severity] ?? 3;
    const sevB = sevOrder[b.severity] ?? 3;
    if (sevA !== sevB) return sevA - sevB;
    const idxA = a.docParagraphIndex ?? 9999;
    const idxB = b.docParagraphIndex ?? 9999;
    return idxA - idxB;
  });

  var groups = buildSimilarIssueGroups(sortedIssues);
  var renderedGroupKeys = {};
  var numCounter = 0;
  var html = '';

  sortedIssues.forEach(function(issue) {
    var key = _extractSimilarityKey(issue);
    var group = groups[key];

    if (group.issues.length < _SIMILAR_ISSUE_THRESHOLD) {
      numCounter++;
      html += _mtRenderOneIssueCard(issue, numCounter);
    } else {
      if (renderedGroupKeys[key]) return;
      renderedGroupKeys[key] = true;
      numCounter++;
      html += _mtRenderOneIssueCard(issue, numCounter);
      var restCount = group.issues.length - 1;
      var isGroupExpanded = state.mtExpandedSimilarGroups && state.mtExpandedSimilarGroups[key];
      html += renderSimilarIssuesBar(key, restCount, isGroupExpanded).replace('sgToggleSimilarGroup', 'mtToggleSimilarGroup');
      if (isGroupExpanded) {
        for (var i = 1; i < group.issues.length; i++) {
          numCounter++;
          html += _mtRenderOneIssueCard(group.issues[i], numCounter);
        }
      }
    }
  });

  box.innerHTML = html;

  if (suppressedCount > 0) {
    var expandLabel = state.mtShowSuppressed
      ? '收起已折叠的规则引擎项（' + suppressedCount + ' 条）'
      : '展开已折叠的规则引擎项（' + suppressedCount + ' 条低置信/重复）';
    box.innerHTML = '<div style="margin-bottom:10px;">'
      + '<button type="button" class="btn-outline btn-sm" onclick="mtToggleSuppressedIssues()">'
      + escapeHtml(expandLabel) + '</button></div>' + box.innerHTML;
  }

  var refNames = (state.mtResult && Array.isArray(state.mtResult.referenceNames))
    ? state.mtResult.referenceNames.filter(function(n) { return n && String(n).trim(); })
    : [];
  if (refNames.length) {
    box.innerHTML += '<div class="mt-reference-footer" style="margin-top:14px;padding:10px 12px;background:#f8fafc;border:1px solid var(--ant-color-border-secondary);border-radius:8px;font-size:12px;color:#475569;">'
      + '<div style="font-weight:700;color:#1e293b;margin-bottom:6px;display:flex;align-items:center;gap:6px;">'
      + icon('books', 'ui-icon-sm') + ' 参考资料</div>'
      + '<ul style="margin:0;padding-left:18px;">'
      + refNames.map(function(n) { return '<li style="margin:2px 0;">' + escapeHtml(String(n)) + '</li>'; }).join('')
      + '</ul></div>';
  }
}

function _mtRenderOneIssueCard(issue, index) {
  var isActive = issue.id === state.mtActiveIssueId;
  var hasEvidences = Array.isArray(issue.evidences) && issue.evidences.length > 0;
  var evidHtml = hasEvidences
    ? issue.evidences.map(function(ev) {
        return '<div class="evidence-block"><b>' + escapeHtml(ev.refName || '') + '：</b>' + escapeHtml(ev.refQuote || '') + '</div>';
      }).join('')
    : '';
  var srcCls = 'tag-neutral';
  var src = issue.source ? '<span class="' + srcCls + '">' + escapeHtml(issue.source) + '</span>' : '';
  var categoryLabel = escapeHtml(issue.category || issue.title || issue.source || '');
  var resolvedMtIdx = resolveParagraphIndexFromContent(
    state.mtIssuesPreview ? state.mtContent : (state.mtResult && state.mtResult.content),
    issue
  );
  var hasPara = resolvedMtIdx >= 0;
  var paraLocHtml = hasPara
    ? '<span class="sg-issue-loc">段落 ' + (resolvedMtIdx + 1) + '</span>'
    : '<span class="sg-issue-loc" style="opacity:.6;">—</span>';
  var clickParaIdx = resolvedMtIdx;
  var issueId = String(issue.id || '').replace(/'/g, "\\'");
  var feedbackStatus = getIssueFeedback(issue).status;
  var feedbackCls = feedbackStatus === 'accepted' ? ' feedback-accepted' : (feedbackStatus === 'rejected' ? ' feedback-rejected' : '');
  return '<div class="issue-item' + (isActive ? ' active' : '') + feedbackCls + '" data-severity="' + (issue.severity || 'low') + '" data-feedback="' + (feedbackStatus || '') + '" onclick="mtSelectIssue(\'' + issueId + '\',' + clickParaIdx + ')">' +
    '<div style="display:flex;gap:8px;align-items:center;justify-content:space-between;">' +
    '<div style="display:flex;gap:6px;align-items:center;"><span class="sg-issue-num">' + index + '</span>' + mtSeverityTag(issue.severity) + src + '<b style="font-size:13px;">' + categoryLabel + '</b></div>' +
    paraLocHtml +
    '</div>' +
    (isActive ? '<div style="margin-top:10px;">' +
      buildIssueTripleHtml(issue) +
      (evidHtml ? '<div style="font-size:12px;font-weight:700;color:#1e293b;margin:8px 0 4px;">参考依据</div>' + evidHtml : '') +
      buildFeedbackBarHtml(issue, 'mt') +
    '</div>' : '') +
    '</div>';
}

function mtToggleSimilarGroup(groupKey) {
  if (!state.mtExpandedSimilarGroups) state.mtExpandedSimilarGroups = {};
  state.mtExpandedSimilarGroups[groupKey] = !state.mtExpandedSimilarGroups[groupKey];
  mtRenderReport(mtGetFilteredIssues());
}

function str(v) { return String(v||''); }

function mtSelectIssue(id, paraIdx) {
  var togglingOff = state.mtActiveIssueId === id;
  state.mtActiveIssueId = togglingOff ? null : id;
  if (state.mtActiveIssueId) {
    state.mtPartialUiLockUntil = Date.now() + 8000;
  } else {
    state.mtPartialUiLockUntil = 0;
  }

  if (state.mtIssuesPreview) {
    mtRenderPartialIssueList(mtGetFilteredIssues());
  } else {
    mtRenderReport(mtGetFilteredIssues());
  }

  var mtIssue = null;
  if (state.mtIssuesPreview) {
    mtIssue = (state.mtPreviewIssues || []).find(function(x) { return String(x.id) === String(id); });
  } else if (state.mtResult && state.mtResult.issues) {
    mtIssue = state.mtResult.issues.find(function(x) { return String(x.id) === String(id); });
  }

  if (!state.mtActiveIssueId) {
    document.querySelectorAll('#mt-doc-view .doc-para').forEach(function(el) {
      el.classList.remove('active');
    });
    return;
  }

  if (mtIssue) {
    paraIdx = resolveParagraphIndexFromContent(
      state.mtIssuesPreview ? state.mtContent : (state.mtResult && state.mtResult.content),
      mtIssue
    );
  }
  if (paraIdx >= 0) {
    if (state.mtIssuesPreview && state.mtContent && state.mtContent.length) {
      state.mtViewMode = 'positioning';
      mtRenderDoc(
        state.mtDocText || '',
        paraIdx,
        state.mtTables || [],
        state.mtImages || [],
        state.mtContent,
        state.mtMammothHtml,
        { forceContent: true }
      );
    } else if (state.mtResult && state.mtResult.content && state.mtResult.content.length) {
      state.mtViewMode = 'positioning';
      mtRenderDoc(state.mtResult.docMarkdown, paraIdx, state.mtResult.tables, state.mtResult.images, state.mtResult.content, null, { forceContent: true });
    } else {
      mtHighlightParagraph(paraIdx);
    }
    if (mtIssue) {
      var mtContent = state.mtIssuesPreview ? state.mtContent : (state.mtResult && state.mtResult.content);
      var term = getIssueSourceTerm(mtIssue, paraIdx, mtContent);
      if (!term && mtIssue.snippet) term = String(mtIssue.snippet).trim().slice(0, 80);
      if (term) {
        scheduleIssueTermHighlight('mt-doc-view', paraIdx, term, { anchorOnly: true });
      }
    }
  } else {
    document.querySelectorAll('#mt-doc-view .doc-para').forEach(function(el) {
      el.classList.remove('active');
    });
  }
}

async function mtRun() {
  if (state.mtRunningRecordId || ReviewTaskManager.tasks.multi) {
    showToast('审查任务正在进行中，请等待完成后再试', 'warn');
    return;
  }

  if (!state.mtDocFile) { showToast('请先导入待审查文档', 'warn'); return; }
  if (!state.mtTemplateFile && !state.mtOtherRefFiles.length) { showToast('请先导入参考资料或模板文件', 'warn'); return; }

  state.mtLastError = null;
  state.mtIssuesPreview = false;
  state.mtPreviewIssues = [];
  state.mtActiveIssueId = null;
  state.mtPartialUiLockUntil = 0;
  state.mtLastPartialCount = 0;
  resetReviewStatBar('mt');
  var mtExportBtnReset = document.getElementById('mt-export-btn');
  if (mtExportBtnReset) mtExportBtnReset.style.display = 'none';
  setMtRunBtn(true);
  revealMtLogBtn();

  const stateEl = document.getElementById('mt-state');
  if (stateEl) stateEl.textContent = '核查中，请稍候...';

  mtAddReviewBanner();
  var initialSteps = _MT_STEP_LABELS.map(function(name) { return { name: name, status: 'pending' }; });
  mtEnsureReportLayout();
  mtRenderInlineProgress(initialSteps, 'running');

  try {
    const form = new FormData();
    form.append('doc', state.mtDocFile);
    if (state.mtTemplateFile) {
      form.append('templateFile', state.mtTemplateFile);
      if (state.mtTemplateFile.lastModified) {
        form.append('templateMtimeMs', String(Math.floor(state.mtTemplateFile.lastModified)));
      }
    }
    state.mtOtherRefFiles.forEach(f => form.append('references', f));
    form.append('aiMode', 'true');
    const focus = buildReviewFocus('mt-ai-focus');
    if (focus.trim()) { form.append('reviewFocus', focus.trim()); }

    const resp = await fetch('/api/check/multi', { method: 'POST', body: form });
    if (handleAuthExpired(resp)) return;
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      if (stateEl) stateEl.textContent = '核查失败：' + (err.detail || resp.status);
      if (box)  box.innerHTML = '';
      return;
    }
    const initData = await resp.json();
    var recordId = initData.recordId;

    setMtRunBtn(true);
    revealMtLogBtn();
    var mtCancelBtn = document.getElementById('mt-cancel-btn');
    if (mtCancelBtn) {
      mtCancelBtn.classList.remove('hidden');
      mtCancelBtn.onclick = function() { mtCancelReview(recordId); };
    }

    ReviewTaskManager.start('multi', recordId, state.mtDocFile ? state.mtDocFile.name : '');
    if (stateEl) stateEl.textContent = '核查中，可在其他页面继续浏览…';
    var mtLogOl = document.getElementById('mt-log-overlay');
    if (mtLogOl && !mtLogOl.classList.contains('hidden') && !_mtLogRecordId) {
      mtShowLog(recordId);
    }
  } catch(e) {
    mtStopLog();
    mtCloseLog();
    var msg = e.message || '核查失败';
    if (stateEl) stateEl.textContent = '核查失败：' + msg;
    showToast('核查失败: ' + msg, 'error');
    if (box) box.innerHTML = '';
  } finally {
    if (!state.mtRunningRecordId) {
      setMtRunBtn(false);
      mtRemoveReviewBanner();
      hideMtLogBtnIfIdle();
    }
  }
}

// History

function histRetentionLabel(days) {
  var n = Number(days);
  if (!Number.isFinite(n) || n < 0) return '—';
  if (n === 0) return '今日清除';
  return '剩余' + n + '天';
}

async function histLoad() {
  const filter = (document.getElementById('hist-filter') || {}).value || '';
  const tbody  = document.getElementById('hist-body');
  if (!tbody) return;
  if (!state.histPageSize) state.histPageSize = 20;
  if (!state.histPage) state.histPage = 1;
  try {
    var pageSize = state.histPageSize;
    var offset = (state.histPage - 1) * pageSize;
    let url = '/api/history?limit=' + pageSize + '&offset=' + offset;
    if (filter) url += '&mode=' + encodeURIComponent(filter);
    const resp = await fetch(url);
    if (handleAuthExpired(resp)) return;
    if (!resp.ok) { tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#ef4444">加载失败</td></tr>'; return; }
    const data = await resp.json();
    let items = data.items || [];
    state.histTotal = Number.isInteger(data.total) ? data.total : items.length;
    histRenderPager();
    if (!items.length) {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#94a3b8;padding:20px">' + (state.histPage > 1 ? '该页暂无记录' : '暂无记录') + '</td></tr>';
      return;
    }
    const typeLabel = {single:'单文档校对',multi:'多文档比对'};
    var pageSize = state.histPageSize || 20;
    var offset = ((state.histPage || 1) - 1) * pageSize;
    tbody.innerHTML = items.map((i, idx) => `<tr class="history-row" data-record-id="${i.id}" onclick="histRestoreToWorkspace(${i.id}, '${i.mode}')">
      <td>${offset + idx + 1}</td>
      <td><span class="tag ${i.mode==='single'?'tag-low':'tag-high'}">${typeLabel[i.mode]||i.mode}</span></td>
      <td>${escapeHtml(i.source_name||'')}</td>
      <td style="color:var(--ant-color-text-tertiary)">${escapeHtml(i.target_name||'—')}</td>
      <td>${renderStatusTag(i.status)}</td>
      <td><span class="badge">${i.issue_count}</span></td>
      <td class="hint">${escapeHtml(i.created_at_display || (i.created_at||'').replace('T','日'))}</td>
      <td><span class="tag tag-low">${escapeHtml(histRetentionLabel(i.retention_days_remaining))}</span></td>
    </tr>`).join('');
    if (!items.some(i => ['running', 'queued'].includes(String(i.status || '')))) {
      histStopAutoRefresh();
    } else if (state.page === 'history' && !state.histAutoTimer) {
      histStartAutoRefresh();
    }
  } catch(e) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#ef4444">加载失败: ' + escapeHtml(e.message || '未知错误') + '</td></tr>';
  }
}

function histRenderPager() {
  var info = document.getElementById('hist-pager-info');
  var stateEl = document.getElementById('hist-pager-state');
  var prev = document.getElementById('hist-page-prev');
  var next = document.getElementById('hist-page-next');
  var jump = document.getElementById('hist-page-jump');
  var total = state.histTotal || 0;
  var pageSize = state.histPageSize || 20;
  var totalPages = Math.max(1, Math.ceil(total / pageSize));
  if (state.histPage > totalPages) state.histPage = totalPages;
  if (state.histPage < 1) state.histPage = 1;
  if (info) info.textContent = '共 ' + total + ' 条记录';
  if (stateEl) stateEl.textContent = '第 ' + state.histPage + ' / ' + totalPages + ' 页';
  if (prev) prev.disabled = state.histPage <= 1;
  if (next) next.disabled = state.histPage >= totalPages;
  if (jump) jump.placeholder = '1-' + totalPages;
}

function histGoPage(delta) {
  state.histPage = (state.histPage || 1) + delta;
  if (state.histPage < 1) state.histPage = 1;
  histLoad();
}

function histJumpPage() {
  var jump = document.getElementById('hist-page-jump');
  if (!jump) return;
  var pageSize = state.histPageSize || 20;
  var totalPages = Math.max(1, Math.ceil((state.histTotal || 0) / pageSize));
  var v = parseInt(jump.value, 10);
  if (!v || v < 1) v = 1;
  if (v > totalPages) v = totalPages;
  state.histPage = v;
  jump.value = '';
  histLoad();
}

async function histRestoreToWorkspace(recordId, mode) {
  try {
    showToast('正在加载审查记录...', 'info');
    var resp = await fetch('/api/history/' + recordId + '?include_content=true');
    if (handleAuthExpired(resp)) return;
    if (!resp.ok) {
      showToast('加载失败 (HTTP ' + resp.status + ')', 'error');
      return;
    }
    var data = await resp.json();
    var item = data.item || {};
    var detail = item.detail || {};
    var docMode = item.mode || mode || 'single';
    var isRunning = item.status === 'running' || item.status === 'queued';

    if (!isRunning) {
      if (docMode === 'single') ReviewTaskManager.stop('single');
      else if (docMode === 'multi') ReviewTaskManager.stop('multi');
    }

    // 关闭历史详情弹层
    var overlay = document.getElementById('hist-detail-overlay');
    if (overlay) overlay.classList.add('hidden');

    if (docMode === 'single') {

      state.sgLastRecordId = recordId;
      state.sgLastError = null;
      state.sgDocText = detail.docText || detail.docMarkdown || '';

      if (isRunning) {

          } else {

      }

      state.sgRunningRecordId = null;
      state.sgAllIssues = sgIssuesFromDetail(detail);
      state.sgFilterMode = 'all';
      state.sgViewMode = 'positioning';
      navTo('single');
      if (recordId) {
        loadIssueFeedbackForRecord(recordId, state.sgAllIssues).then(function() {
          sgUpdateFilterCounts(state.sgAllIssues);
          if (state.page === 'single') sgRenderIssueList(sgGetFilteredIssues(), null);
        });
      }
    } else {
      state.mtDocFile = { name: item.source_name || '历史记录', _fromHistory: true };
      state.mtTemplateFile = null;
      state.mtOtherRefFiles = [];
      state.mtLastRecordId = recordId;
      state.mtLastError = null;
      state.mtMammothHtml = null;

      if (isRunning) {
        state.mtRunningRecordId = recordId;
        state.mtIssuesPreview = false;
        state.mtPreviewIssues = [];
        state.mtResult = null;
        state.mtContent = detail.content || [];
        state.mtDocText = detail.docText || detail.docMarkdown || '';
        state.mtTables = detail.tables || [];
        state.mtImages = detail.images || extractImagesFromContent(state.mtContent);
        state.mtActiveIssueId = null;
        state.mtFilterMode = 'all';
        state.mtViewMode = 'positioning';
        navTo('multi');
        ReviewTaskManager.start('multi', recordId, item.source_name || '');
        setMtRunBtn(true);
        var mtLogBtnRun = document.getElementById('mt-log-btn');
        if (mtLogBtnRun) mtLogBtnRun.classList.remove('hidden');
        var mtCancelBtnRun = document.getElementById('mt-cancel-btn');
        if (mtCancelBtnRun) {
          mtCancelBtnRun.classList.remove('hidden');
          mtCancelBtnRun.onclick = function() { mtCancelReview(recordId); };
        }
        mtAddReviewBanner();
        resetReviewStatBar('mt');
        if (detail.steps) {
          if (detail.partialIssues && detail.partialIssues.length) {
            mtApplyPartialReview(detail, detail.steps, item.status, ReviewTaskManager.tasks.multi);
          } else {
            mtRenderInlineProgress(detail.steps, item.status);
          }
        }
        ReviewTaskManager.ensurePolling();
        return;
      }

      state.mtRunningRecordId = null;
      state.mtResult = {
        issues: detail.issues || [],
        docMarkdown: detail.docMarkdown || detail.docText || '',
        tables: detail.tables || [],
        images: detail.images || extractImagesFromContent(detail.content || []),
        content: detail.content || [],
        referenceNames: detail.referenceNames || (item.target_name ? String(item.target_name).split(/[、,]/).map(function(s){return s.trim();}).filter(Boolean) : []),
        ruleSuppressedCount: detail.ruleSuppressedCount || 0,
      };
      try {
        state.mtShowSuppressed = sessionStorage.getItem('mtShowSuppressed') === '1';
      } catch (e) {
        state.mtShowSuppressed = false;
      }
      state.mtContent = state.mtResult.content;
      state.mtDocText = state.mtResult.docMarkdown;
      state.mtTables = state.mtResult.tables;
      state.mtImages = state.mtResult.images;
      state.mtActiveIssueId = null;
      state.mtFilterMode = 'all';
      state.mtViewMode = 'positioning';
      navTo('multi');
      if (recordId) {
        loadIssueFeedbackForRecord(recordId, state.mtResult.issues).then(function() {
          mtUpdateFilterCounts(state.mtResult.issues);
          if (state.page === 'multi') mtRenderReport(mtGetFilteredIssues());
        });

    }
  } catch (e) {
    showToast('加载失败：' + (e && e.message || e), 'error');
  }
}

function renderStatusTag(status) {
  const s = String(status || 'done');
  if (s === 'running' || s === 'queued') return '<span class="tag tag-running">审查中</span>';
  if (s === 'error') return '<span class="tag tag-error">失败</span>';
  if (s === 'cancelled') return '<span class="tag" style="color:#94a3b8;background:var(--ant-color-fill-quaternary);">已终止</span>';
  return '<span class="tag tag-done">已完成</span>';
}

function histCloseDetail() {
  const ol = document.getElementById('hist-detail-overlay');
  if (ol) ol.classList.add('hidden');
  if (state.histDetailAutoTimer) {
    clearInterval(state.histDetailAutoTimer);
    state.histDetailAutoTimer = null;
  }
  state.histDetailId = null;
  state.histDetailItem = null;
  state.histDetailPayload = null;
  state.histDetailActiveIssueId = null;
  state.histDetailActiveParaIdx = -1;
  state.histDetailContentLoaded = false;
}

function histExtractFindings(detail) {
  const findings = [];
  if (detail && Array.isArray(detail.issues)) {
    detail.issues.forEach((x, idx) => findings.push({
      id: 'm_' + idx,
      source: x.source || (String(x.id || '').startsWith('ai_') ? 'AI' : '规则'),
      severity: normalizeSeverity(x.severity),
      title: x.title || x.category || '问题',
      issue: x.rationale || x.issue || '',
      suggestion: x.suggestion || '',
      para: x.docParagraphText || '',
      docParagraphIndex: Number.isInteger(x.docParagraphIndex) ? x.docParagraphIndex : -1,
    }));
  }
  const sevOrder = { high: 0, medium: 1, low: 2 };
  return findings.sort((a, b) => {
    const sevA = sevOrder[a.severity] ?? 3;
    const sevB = sevOrder[b.severity] ?? 3;
    if (sevA !== sevB) return sevA - sevB;
    const idxA = a.docParagraphIndex ?? 9999;
    const idxB = b.docParagraphIndex ?? 9999;
    return idxA - idxB;
  });
}

function histSplitParagraphs(text) {
  if (!text || !String(text).trim()) return [];
  const s = String(text);
  let paras = s.split(/\n{2,}/g).map(p => p.trim()).filter(Boolean);
  if (!paras.length) paras = s.split('\n').map(p => p.trim()).filter(Boolean);
  return paras;
}

function histInferParagraphIndexFromSnippet(paras, issue) {
  if (!issue) return -1;
  if (Number.isInteger(issue.docParagraphIndex) && issue.docParagraphIndex >= 0) return issue.docParagraphIndex;
  const key = String(issue.para || issue.issue || '').trim();
  if (!key) return -1;
  for (let i = 0; i < paras.length; i++) {
    if (paras[i].includes(key) || key.includes(paras[i])) return i;
  }
  return -1;
}

function histBuildHighlightTerms(issue) {
  if (!issue) return [];
  const raw = [issue.para || '', issue.issue || '', issue.title || '']
    .map(x => String(x || '').trim())
    .filter(Boolean)
    .join(' ');
  const parts = raw
    .split(/[，。；、：,\.\s()（）\[\]【】《》“”"'‘’！？!?-]+/g)
    .map(x => x.trim())
    .filter(x => x.length >= 2 && x.length <= 20);
  const unique = [];
  for (const p of parts) {
    if (!unique.includes(p)) unique.push(p);
    if (unique.length >= 6) break;
  }
  return unique.sort((a, b) => b.length - a.length);
}

function histHighlightText(text, terms) {
  const src = String(text || '');
  if (!src || !terms || !terms.length) return escapeHtml(src);
  let pos = 0;
  let html = '';
  while (pos < src.length) {
    let hitIdx = -1;
    let hitTerm = '';
    for (const t of terms) {
      const i = src.indexOf(t, pos);
      if (i >= 0 && (hitIdx < 0 || i < hitIdx || (i === hitIdx && t.length > hitTerm.length))) {
        hitIdx = i;
        hitTerm = t;
      }
    }
    if (hitIdx < 0) {
      html += escapeHtml(src.slice(pos));
      break;
    }
    html += escapeHtml(src.slice(pos, hitIdx));
    html += `<mark class="hist-mark">${escapeHtml(hitTerm)}</mark>`;
    pos = hitIdx + hitTerm.length;
  }
  return html;
}

function histSelectIssue(id) {
  state.histDetailActiveIssueId = id;
  const findings = histExtractFindings(state.histDetailPayload || {});
  const paras = histSplitParagraphs((state.histDetailPayload || {}).docText || (state.histDetailPayload || {}).docMarkdown || '');
  const issue = findings.find(x => x.id === id);
  state.histDetailActiveParaIdx = histInferParagraphIndexFromSnippet(paras, issue);
  histRenderDetailIntoBox();
  if (state.histDetailActiveParaIdx >= 0) {
    const el = document.getElementById('hist-para-' + state.histDetailActiveParaIdx);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function histSelectPara(idx) {
  state.histDetailActiveParaIdx = idx;
  histRenderDetailIntoBox();
}

function histRenderDetail(item, detail) {
  const modeLabel = item.mode === 'single' ? '单文档校对' : '多文档比对';
  const findings = histExtractFindings(detail);
  const docText = detail.docText || detail.docMarkdown || '';
  const paras = histSplitParagraphs(docText);
  const activeIssue = findings.find(x => x.id === state.histDetailActiveIssueId) || null;
  const highlightTerms = histBuildHighlightTerms(activeIssue);
  const sevMap = { high: ['tag-high', '高风险'], low: ['tag-low', '低风险'] };
  const issueListHtml = findings.length ? findings.map(f => {
    const tag = sevMap[normalizeSeverity(f.severity)];
    const active = f.id === state.histDetailActiveIssueId ? ' active' : '';
    const paraIdx = histInferParagraphIndexFromSnippet(paras, f);
    var issueId = String(f.id || '').replace(/'/g, "\\'");
    return `<div class="hist-issue-item${active}" onclick="histSelectIssue('${issueId}')">
      <div class="row"><span class="tag ${tag[0]}">${tag[1]}</span><span class="tag">${escapeHtml(f.source)}</span><b>${escapeHtml(f.title)}</b></div>
      ${f.issue ? `<div class="hint" style="margin-top:6px;"><b>问题：</b>${escapeHtml(f.issue)}</div>` : ''}
      ${f.suggestion ? `<div class="hint" style="margin-top:4px;"><b>建议：</b>${escapeHtml(f.suggestion)}</div>` : ''}
      <div class="mono" style="margin-top:6px;">原文段落：${paraIdx >= 0 ? paraIdx + 1 : '未定位'}</div>
    </div>`;
  }).join('') : '<div class="hint">暂无可展示的审查结果（可能仍在处理中）</div>';
  let docHtml = '';
  const contentArr = detail.content;
  const hasDocText = !!(detail.docText || detail.docMarkdown || (contentArr && contentArr.length));
  if (!hasDocText && !state.histDetailContentLoaded) {
    docHtml = '<div class="hint" style="padding:16px;text-align:center;">'
      + '原文未加载（可加快打开速度）'
      + '<div style="margin-top:10px;"><button class="btn-outline btn-sm" onclick="histLoadDetailContent()">加载原文全文</button></div>'
      + '</div>';
  } else if (contentArr && contentArr.length) {
    docHtml = buildContentHtml(contentArr, state.histDetailActiveParaIdx, 'hist-para-', 'histSelectPara', {
      addParaIds: true,
      anchorParagraphs: true
    });
    if (state.histDetailActiveParaIdx >= 0 && activeIssue) {
      const paraItem = contentArr.filter(function(x) { return x.type === 'paragraph' || x.type === 'caption'; })[state.histDetailActiveParaIdx];
      if (paraItem && paraItem.text) {
        const highlighted = histHighlightText(paraItem.text, highlightTerms);
        const needle = ' id="hist-para-' + state.histDetailActiveParaIdx + '">';
        const pos = docHtml.indexOf(needle);
        if (pos >= 0) {
          const closePos = docHtml.indexOf('</p>', pos);
          if (closePos > pos) {
            docHtml = docHtml.slice(0, pos + needle.length) + highlighted + docHtml.slice(closePos);
          }
        }
      }
    }
  } else {
    docHtml = paras.length ? paras.map((p, idx) => {
      const active = idx === state.histDetailActiveParaIdx ? ' active' : '';
      const paraHtml = idx === state.histDetailActiveParaIdx ? histHighlightText(p, highlightTerms) : escapeHtml(p);
      return `<p class="doc-para${active}" id="hist-para-${idx}" onclick="histSelectPara(${idx})">${paraHtml}</p>`;
    }).join('') : '<div class="hint" style="padding:16px;">当前历史记录未保存原文全文（请使用最新记录）</div>';
  }
  return `
    <div class="card" style="padding:12px;">
      <div class="row">
        <span><b>记录ID：</b>${item.id}</span>
        <span><b>类型：</b>${modeLabel}</span>
        <span><b>状态：</b>${renderStatusTag(item.status)}</span>
      </div>
      <div class="hint" style="margin-top:8px;">文档：${escapeHtml(item.source_name || '')}</div>
      <div class="hint">参考文档：${escapeHtml(item.target_name || '—')}</div>
      <div class="hint">创建时间：${escapeHtml(item.created_at || '')}</div>
      <div class="hint">更新时间：${escapeHtml(item.updated_at || '')}</div>
      <hr class="divider">
      <div class="hist-detail-layout">
        <div>
          <div style="font-weight:700;margin-bottom:6px;">原文全文</div>
          <div class="hist-doc-wrap"><div class="doc-page">${docHtml}</div></div>
        </div>
        <div>
          <div style="font-weight:700;margin-bottom:6px;">审查发现（${findings.length}）</div>
          <div class="hist-issue-wrap">${issueListHtml}</div>
        </div>
      </div>
    </div>
  `;
}

function histRenderDetailIntoBox() {
  const box = document.getElementById('hist-detail-content');
  if (!box || !state.histDetailItem) return;
  box.innerHTML = histRenderDetail(state.histDetailItem, state.histDetailPayload || {});
  var histDoc = box.querySelector('.hist-doc-wrap');
  if (histDoc) scheduleMathJaxTypeset(histDoc);
}

async function histLoadDetailContent() {
  if (!state.histDetailId) return;
  const box = document.getElementById('hist-detail-content');
  if (box) {
    box.innerHTML = '<div style="padding:16px;color:var(--ant-color-text-tertiary);text-align:center">正在加载原文...</div>';
  }
  try {
    const resp = await fetch('/api/history/' + state.histDetailId + '?include_content=true');
    if (handleAuthExpired(resp)) return;
    if (!resp.ok) {
      if (box) box.innerHTML = '<div style="padding:16px;color:#ef4444;text-align:center">原文加载失败</div>';
      return;
    }
    const data = await resp.json();
    state.histDetailItem = data.item || state.histDetailItem;
    state.histDetailPayload = (data.item && data.item.detail) || {};
    state.histDetailContentLoaded = true;
    if (state.histDetailActiveIssueId) {
      const findings = histExtractFindings(state.histDetailPayload || {});
      const paras = histSplitParagraphs((state.histDetailPayload || {}).docText || (state.histDetailPayload || {}).docMarkdown || '');
      const issue = findings.find(x => x.id === state.histDetailActiveIssueId);
      state.histDetailActiveParaIdx = histInferParagraphIndexFromSnippet(paras, issue);
    }
    histRenderDetailIntoBox();
    if (state.histDetailActiveParaIdx >= 0) {
      const el = document.getElementById('hist-para-' + state.histDetailActiveParaIdx);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  } catch (e) {
    if (box) box.innerHTML = '<div style="padding:16px;color:#ef4444;text-align:center">原文加载失败：' + escapeHtml(e.message || '') + '</div>';
  }
}

async function histOpenDetail(id) {
  const ol = document.getElementById('hist-detail-overlay');
  const box = document.getElementById('hist-detail-content');
  if (!ol || !box) return;
  ol.classList.remove('hidden');
  box.innerHTML = '<div style="padding:16px;color:var(--ant-color-text-tertiary);text-align:center">加载中...</div>';
  state.histDetailContentLoaded = false;
  try {
    const resp = await fetch('/api/history/' + id);
    if (handleAuthExpired(resp)) {
      box.innerHTML = '<div style="padding:16px;color:#ef4444;text-align:center">登录已过期，请刷新页面重新登录</div>';
      return;
    }
    if (resp.status === 404) {
      box.innerHTML = '<div style="padding:16px;color:#ef4444;text-align:center">审查记录不存在（可能已被清理）</div>';
      return;
    }
    if (!resp.ok) {
      let msg = '';
      try {
        const err = await resp.json();
        msg = err.detail || err.message || '';
      } catch (_) {}
      box.innerHTML = '<div style="padding:16px;color:#ef4444;text-align:center">加载失败（HTTP ' + resp.status + '）' + (msg ? '：' + escapeHtml(msg) : '') + '</div>';
      return;
    }
  const data = await resp.json();
  const item = data.item || {};
  state.histDetailItem = item;
  state.histDetailPayload = item.detail || {};
  state.histDetailActiveIssueId = null;
  state.histDetailActiveParaIdx = -1;
  histRenderDetailIntoBox();
  state.histDetailId = id;
  if (state.histDetailAutoTimer) {
    clearInterval(state.histDetailAutoTimer);
    state.histDetailAutoTimer = null;
  }
  if (['running', 'queued'].includes(String(item.status || ''))) {
    state.histDetailAutoTimer = setInterval(async function() {
      const detailBox = document.getElementById('hist-detail-content');
      if (!detailBox || !state.histDetailId) return;
      const r = await fetch('/api/history/' + state.histDetailId);
      if (!r.ok) return;
      const d = await r.json();
      const it = d.item || {};
      state.histDetailItem = it;
      state.histDetailPayload = it.detail || {};
      histRenderDetailIntoBox();
      if (!['running', 'queued'].includes(String(it.status || ''))) {
        clearInterval(state.histDetailAutoTimer);
        state.histDetailAutoTimer = null;
        if (String(it.status || '') === 'done') {
          histLoadDetailContent();
        }
      }
      if (state.page === 'history') {
        histLoad();
      }
    }, 3000);
  } else if (String(item.status || '') === 'done') {
    var hasContent = !!(state.histDetailPayload.docText || state.histDetailPayload.docMarkdown || (state.histDetailPayload.content && state.histDetailPayload.content.length));
    if (!hasContent) {
      histLoadDetailContent();
    }
  }
  } catch (e) {
    box.innerHTML = '<div style="padding:16px;color:#ef4444;text-align:center">加载失败：' + escapeHtml(e.message || '网络错误或服务器异常') + '</div>';
  }
}

function histStartAutoRefresh() {
  if (state.histAutoTimer) return;
  state.histAutoTimer = setInterval(function() {
    if (state.page !== 'history') {
      histStopAutoRefresh();
      return;
    }
    histLoad();
  }, 5000);
}

function histStopAutoRefresh() {
  if (state.histAutoTimer) {
    clearInterval(state.histAutoTimer);
    state.histAutoTimer = null;
  }
}

// Export helpers（服务端生成标准 DOCX）
// ══════════════════════════════════════════════════
function _downloadBlob(blob, filename) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function _parseContentDispositionFilename(disp, fallback) {
  if (!disp) return fallback;
  var star = /filename\*=UTF-8''([^;]+)/i.exec(disp);
  if (star) {
    try { return decodeURIComponent(star[1].trim()); } catch (_) {}
  }
  var plain = /filename="?([^";]+)"?/i.exec(disp);
  return (plain && plain[1]) ? plain[1].trim() : fallback;
}

async function _exportReportDocx(opts) {
  var btn = opts.buttonEl;
  if (btn) btn.disabled = true;
  try {
    var resp = await fetch('/api/report/export', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        reportType: opts.reportType,
        docFilename: opts.docFilename || '',
        referenceNames: opts.referenceNames || [],
        issues: opts.issues
      })
    });
    if (handleAuthExpired(resp)) return;
    if (!resp.ok) {
      var err = {};
      try { err = await resp.json(); } catch (_) {}
      alert(err.message || err.detail || '导出失败');
      return;
    }
    var blob = await resp.blob();
    var filename = _parseContentDispositionFilename(
      resp.headers.get('Content-Disposition'),
      opts.fallbackFilename || '审查报告.docx'
    );
    _downloadBlob(blob, filename);
  } catch (e) {
    alert('导出失败：' + (e && e.message ? e.message : e));
  } finally {
    if (btn) btn.disabled = false;
  }
}

// ── 单文档导出 ──
function sgExportReport() {
  var issues = state.sgAllIssues || [];
  if (!issues.length) { alert('暂无可导出的审查结果'); return; }
  var stem = state.sgFile ? state.sgFile.name.replace(/\.[^.]+$/, '') : '文档';
  var fallback = stem + '_审查报告_' + new Date().toISOString().replace(/[-:T.Z]/g, '').slice(0, 12) + '.docx';
  _exportReportDocx({
    reportType: 'single',
    docFilename: state.sgFile ? state.sgFile.name : '',
    issues: issues,
    fallbackFilename: fallback,
    buttonEl: document.getElementById('sg-export-btn')
  });
}

// ── 多文档导出 ──
function mtExportReport() {
  var data = state.mtResult;
  if (!data || !data.issues || !data.issues.length) { alert('暂无可导出的比对结果'); return; }
  var stem = state.mtDocFile ? state.mtDocFile.name.replace(/\.[^.]+$/, '') : '文档';
  var fallback = stem + '_一致性比对报告_' + new Date().toISOString().replace(/[-:T.Z]/g, '').slice(0, 12) + '.docx';
  _exportReportDocx({
    reportType: 'multi',
    docFilename: state.mtDocFile ? state.mtDocFile.name : '',
    referenceNames: data.referenceNames || [],
    issues: data.issues,
    fallbackFilename: fallback,
    buttonEl: document.getElementById('mt-export-btn')
  });
}

function handleAuthExpired(resp) {
  if (!resp || resp.status !== 401) return false;
  state.user = null;
  ReviewTaskManager.clearAll();
  document.getElementById('sider-user').textContent = '游客';
  document.getElementById('topbar-user').textContent = '';
  document.getElementById('btn-logout').style.display = 'none';
  showToast('登录已过期，请重新登录。', 'warn');
  location.hash = '#/login';
  renderPage('login');
  return true;
}

  const item = e.target.closest('.menu-item');
  if (!item) return;
  navTo(item.dataset.page);
});

// SSO 自动登录：将平台 JWT 发送给后端换取本地会话
// ══════════════════════════════════════════════════
async function trySsoLogin(token) {
  try {
    const resp = await fetch('/api/sso', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sso_token: token }),
    });
    if (resp.ok) {
      const data = await resp.json();
      if (data.success) return data;
    }
  } catch (e) { /* 网络异常忽略 */ }
  return null;
}

// ══════════════════════════════════════════════════
// 记忆模块
// ══════════════════════════════════════════════════
let _focusPreferences = [];

function _normalizeFocusLine(text) {
  return (text || '').trim().replace(/[，。；：、！？,.!?;:]/g, '').replace(/\s+/g, '').toLowerCase();
}

function _getFocusLines(textareaId) {
  const el = document.getElementById(textareaId);
  if (!el) return [];
  return el.value.split('\n').map(s => s.trim()).filter(Boolean);
}

function _focusLineExists(lines, item) {
  const norm = _normalizeFocusLine(item);
  return lines.some(line => _normalizeFocusLine(line) === norm);
}

function renderFocusPreferenceTags(textareaId, tagsContainerId, wrapId) {
  const tagsEl = document.getElementById(tagsContainerId);
  const wrapEl = document.getElementById(wrapId);
  if (!tagsEl || !wrapEl) return;

  const prefs = Array.isArray(_focusPreferences) ? _focusPreferences.slice(0, 7) : [];
  tagsEl.innerHTML = '';
  if (!prefs.length) {
    wrapEl.classList.add('hidden');
    return;
  }

  wrapEl.classList.remove('hidden');
  const currentLines = _getFocusLines(textareaId);
  prefs.forEach(pref => {
    const item = (pref && pref.item) ? String(pref.item) : '';
    if (!item) return;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'focus-pref-tag' + (_focusLineExists(currentLines, item) ? ' active' : '');
    const freq = pref.frequency ? ` (${pref.frequency})` : '';
    btn.textContent = item + freq;
    btn.addEventListener('click', () => appendFocusPreference(textareaId, item));
    tagsEl.appendChild(btn);
  });
}

function appendFocusPreference(textareaId, item) {
  const el = document.getElementById(textareaId);
  if (!el || !item) return;
  const lines = _getFocusLines(textareaId);
  if (_focusLineExists(lines, item)) return;
  el.value = lines.length ? `${el.value.trim()}\n${item}` : item;
  renderFocusPreferenceTags(textareaId, textareaId === 'sg-ai-focus' ? 'sg-focus-pref-tags' : 'mt-focus-pref-tags', textareaId === 'sg-ai-focus' ? 'sg-focus-pref-wrap' : 'mt-focus-pref-wrap');
  saveUserPreferences(textareaId);
}

function bindFocusPreferenceRefresh(textareaId) {
  const el = document.getElementById(textareaId);
  if (!el || el._focusPrefBound) return;
  el.addEventListener('input', () => {
    renderFocusPreferenceTags(
      textareaId,
      textareaId === 'sg-ai-focus' ? 'sg-focus-pref-tags' : 'mt-focus-pref-tags',
      textareaId === 'sg-ai-focus' ? 'sg-focus-pref-wrap' : 'mt-focus-pref-wrap'
    );
  });
  el._focusPrefBound = true;
}

async function loadUserPreferences() {
    try {
        const resp = await fetch('/api/preferences');
        const data = await resp.json();
        if (data.success && data.preferences) {
            const rulesText = data.preferences.rulesText || '';
            const focusPrefs = data.preferences.focusPreferences;
            if (Array.isArray(focusPrefs) && focusPrefs.length) {
                _focusPreferences = focusPrefs;
            }
            if (rulesText) {
                const sgFocus = document.getElementById('sg-ai-focus');
                const mtFocus = document.getElementById('mt-ai-focus');
                if (sgFocus && !sgFocus.value.trim()) sgFocus.value = rulesText;
                if (mtFocus && !mtFocus.value.trim()) mtFocus.value = rulesText;
            }
            renderFocusPreferenceTags('sg-ai-focus', 'sg-focus-pref-tags', 'sg-focus-pref-wrap');
            renderFocusPreferenceTags('mt-ai-focus', 'mt-focus-pref-tags', 'mt-focus-pref-wrap');
        }
    } catch (e) {
        console.warn('加载用户偏好失败:', e);
    }
}

async function saveUserPreferences(textareaId) {
    const el = document.getElementById(textareaId);
    if (!el) return;
    const reviewFocus = el.value.trim();
    try {
        await fetch('/api/preferences', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ reviewFocus }),
        });
    } catch (e) {
        console.warn('保存用户偏好失败:', e);
    }
}

function attachFocusAutoSave() {
    ['sg-ai-focus', 'mt-ai-focus'].forEach(id => {
        const el = document.getElementById(id);
        if (el && !el._autoSaveBound) {
            el.addEventListener('blur', () => saveUserPreferences(id));
            el._autoSaveBound = true;
        }
        bindFocusPreferenceRefresh(id);
    });
}

/* ── 审查要点文件：上传 / 列表 / 勾选 / 注入 ── */
let _focusFiles = [];
let _selectedFocusFileIds = [];
const _focusFileItemsCache = {};  // fileId → 完整 items 数组

function _persistSelectedFocusFiles() {
    try { localStorage.setItem('reviewStar_selectedFocusFiles', JSON.stringify(_selectedFocusFileIds)); } catch(e) {}
}
function _restoreSelectedFocusFiles() {
    try { _selectedFocusFileIds = JSON.parse(localStorage.getItem('reviewStar_selectedFocusFiles') || '[]'); }
    catch(e) { _selectedFocusFileIds = []; }
}

async function loadFocusFiles() {
    try {
        const resp = await fetch('/api/preferences/focus-files');
        const data = await resp.json();
        if (!data.success) return;
        _focusFiles = data.files || [];
        _restoreSelectedFocusFiles();
        const validIds = new Set(_focusFiles.map(f => f.fileId));
        _selectedFocusFileIds = _selectedFocusFileIds.filter(id => validIds.has(id));
        _focusFiles.forEach(f => {
            if (f.items && f.items.length) _focusFileItemsCache[f.fileId] = f.items;
        });
        renderFocusFiles('sg');
        renderFocusFiles('mt');
    } catch(e) { console.warn('加载审查要点文件失败:', e); }
}

function _focusFileAllItems(fileId) {
    return _focusFileItemsCache[fileId] || [];
}

function renderFocusFiles(prefix) {
    const listEl = document.getElementById(prefix + '-focus-files-list');
    if (!listEl) return;
    if (!_focusFiles.length) {
        listEl.innerHTML = '<div class="hint" style="font-size:12px;padding:4px 0;">暂无已存要点文件，点击下方上传</div>';
        return;
    }
    listEl.innerHTML = '';
    _focusFiles.forEach(f => {
        const checked = _selectedFocusFileIds.includes(f.fileId) ? 'checked' : '';
        const tagHtml = f.docType ? `<span class="ff-tag">${escapeHtml(f.docType)}</span>` : '';
        const previewItems = _focusFileAllItems(f.fileId);
        const previewText = previewItems.slice(0, 5).join(' / ') + (previewItems.length > 5 ? ' / ...' : '');
        const row = document.createElement('div');
        row.className = 'focus-file-row';
        row.innerHTML = `
          <input type="checkbox" ${checked} data-file-id="${escapeHtml(f.fileId)}" onchange="toggleFocusFile('${escapeHtml(f.fileId)}', this.checked)">
          <div style="flex:1;min-width:0;">
            <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
              <span class="ff-name">${escapeHtml(f.displayName || f.fileId)}</span>
              ${tagHtml}
              <span class="ff-count">${f.itemsCount || 0} 条</span>
            </div>
            <div style="margin-top:4px;display:flex;gap:10px;align-items:center;">
              <span class="ff-toggle" onclick="toggleFocusFilePreview('${escapeHtml(f.fileId)}', this)">展开</span>
              <span class="ff-del" onclick="deleteFocusFile('${escapeHtml(f.fileId)}')">删除</span>
            </div>
            <div class="ff-preview hidden" data-preview-id="${escapeHtml(f.fileId)}">${escapeHtml(previewText)}</div>
          </div>
        `;
        listEl.appendChild(row);
    });
}

async function toggleFocusFile(fileId, checked) {
    if (checked) {
        if (!_selectedFocusFileIds.includes(fileId)) _selectedFocusFileIds.push(fileId);
        if (!_focusFileItemsCache[fileId]) {
            try {
                const resp = await fetch('/api/preferences/focus-files/' + encodeURIComponent(fileId));
                const data = await resp.json();
                if (data.success && data.file) {
                    _focusFileItemsCache[fileId] = data.file.items || [];
                }
            } catch(e) { console.warn('加载要点文件详情失败:', e); }
        }
    } else {
        _selectedFocusFileIds = _selectedFocusFileIds.filter(id => id !== fileId);
    }
    _persistSelectedFocusFiles();
}

function toggleFocusFilePreview(fileId, el) {
    const previewEl = document.querySelector('[data-preview-id="' + CSS.escape(fileId) + '"]');
    if (!previewEl) return;
    const items = _focusFileAllItems(fileId);
    if (previewEl.classList.contains('hidden')) {
        previewEl.classList.remove('hidden');
        previewEl.textContent = items.length ? items.join('\n') : '（加载中或无内容）';
        el.textContent = '收起';
    } else {
        previewEl.classList.add('hidden');
        el.textContent = '展开';
    }
}

async function deleteFocusFile(fileId) {
    if (!confirm('确定删除该审查要点文件？此操作不可恢复。')) return;
    try {
        const resp = await fetch('/api/preferences/focus-files/' + encodeURIComponent(fileId), { method: 'DELETE' });
        const data = await resp.json();
        if (data.success) {
            _selectedFocusFileIds = _selectedFocusFileIds.filter(id => id !== fileId);
            delete _focusFileItemsCache[fileId];
            _persistSelectedFocusFiles();
            await loadFocusFiles();
        } else {
            alert(data.message || '删除失败');
        }
    } catch(e) { alert('删除失败: ' + e); }
}

function promptUploadFocusFile(prefix) {
    const input = document.getElementById(prefix + '-focus-file-input');
    if (input) input.click();
}

async function uploadFocusFile(prefix, input) {
    if (!input || !input.files || !input.files.length) return;
    const file = input.files[0];
    const docType = (prompt('请输入文档类型标签（可留空，如：安全设计 / 接口规范）', '') || '').trim();
    const formData = new FormData();
    formData.append('file', file);
    formData.append('docType', docType);
    const listEl = document.getElementById(prefix + '-focus-files-list');
    const hintId = prefix + '-ff-uploading';
    if (listEl) {
        const hint = document.createElement('div');
        hint.className = 'ff-uploading'; hint.id = hintId;
        hint.textContent = '正在上传并解析「' + file.name + '」...';
        listEl.prepend(hint);
    }
    try {
        const resp = await fetch('/api/preferences/focus-files', { method: 'POST', body: formData });
        const data = await resp.json();
        const hintEl = document.getElementById(hintId);
        if (hintEl) hintEl.remove();
        if (data.success) {
            await loadFocusFiles();
            if (data.file && data.file.fileId) {
                _focusFileItemsCache[data.file.fileId] = data.file.items || [];
                if (!_selectedFocusFileIds.includes(data.file.fileId)) {
                    _selectedFocusFileIds.push(data.file.fileId);
                    _persistSelectedFocusFiles();
                    renderFocusFiles('sg');
                    renderFocusFiles('mt');
                }
            }
        } else {
            alert(data.message || '上传失败');
        }
    } catch(e) {
        const hintEl = document.getElementById(hintId);
        if (hintEl) hintEl.remove();
        alert('上传失败: ' + e);
    }
    input.value = '';
}

function buildReviewFocus(textareaId) {
    const ta = document.getElementById(textareaId);
    const lines = ta ? ta.value.split('\n').map(s => s.trim()).filter(Boolean) : [];
    const fileItems = [];
    for (const f of _focusFiles) {
        if (_selectedFocusFileIds.includes(f.fileId)) {
            const items = _focusFileAllItems(f.fileId);
            if (items && items.length) fileItems.push(...items);
        }
    }
    const seen = new Set();
    const merged = [];
    for (const it of [...lines, ...fileItems]) {
        const key = (it || '').replace(/[\s，。；：、！？,.!?;:]/g, '').toLowerCase();
        if (key && !seen.has(key)) { seen.add(key); merged.push(it); }
    }
    return merged.join('\n');
}

function _renderMemories(memories) {
    const container = document.getElementById('memory-list');
    if (!container) return;
    if (!memories || !memories.length) {
        container.innerHTML = '<div style="color:var(--ant-color-text-tertiary);text-align:center;padding:40px;">暂无历史记忆</div>';
        return;
    }
    container.innerHTML = memories.map(mem => {
            const c = mem.content || {};
            const focus = Array.isArray(c.reviewFocus) ? c.reviewFocus.join('、') : '';
            const topIssues = Array.isArray(c.topIssues) ? c.topIssues : [];
            const issuesHtml = topIssues.length > 0
                ? '<div style="margin-top:8px;">' + topIssues.map(iss =>
                    `<div style="font-size:12px;color:#666;padding:2px 0;">• [${iss.severity || ''}] ${escapeHtml(iss.title || '')}</div>`
                  ).join('') + '</div>'
                : '';
            return `<div style="border:1px solid var(--ant-color-border);border-radius:8px;padding:16px;background:#fafafa;">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <span style="font-weight:600;">${escapeHtml(c.fileName || '未知文档')}</span>
                    <span style="font-size:12px;color:var(--ant-color-text-tertiary);">${escapeHtml(c.reviewedAt || '')}</span>
                </div>
                <div style="margin-top:4px;font-size:13px;color:#555;">
                    模式: ${escapeHtml(c.mode || '')} | 发现 <strong>${c.issueCount || 0}</strong> 条问题
                </div>
                <div style="margin-top:4px;font-size:12px;color:#888;">审查要点: ${escapeHtml(focus)}</div>
                ${issuesHtml}
            </div>`;
        }).join('');
}

async function memoryLoad(opts) {
    opts = opts || {};
    const container = document.getElementById('memory-list');
    if (!container) return;
    if (!opts.silent) {
        container.innerHTML = '<div style="color:var(--ant-color-text-tertiary);text-align:center;padding:40px;">加载中...</div>';
    }
    try {
        const resp = await fetch('/api/memories');
        const data = await resp.json();
        const memories = (data && data.memories) || [];
        _prefCache().memories = memories;
        _renderMemories(memories);
    } catch (e) {
        console.error('获取历史记忆失败:', e);
        if (!opts.silent) {
            container.innerHTML = '<div style="color:#e74c3c;text-align:center;padding:40px;">加载失败，请重试</div>';
        }
    }
}

function memoryRefresh() {
    if (state.prefCache) {
        state.prefCache.habits = null;
        state.prefCache.templates = null;
        state.prefCache.feedback = {};
        state.prefCache.memories = null;
    }
    memoryLoad({});
    prefLoadHabits({});
    prefLoadTemplates({});
    prefLoadFeedback(state.prefFeedbackFilter || '', {});
}

function _prefCache() {
  if (!state.prefCache) {
    state.prefCache = { habits: null, templates: null, feedback: {}, memories: null };
  }
  return state.prefCache;
}

function prefSwitchTab(tab) {
    state.prefActiveTab = tab;
    document.querySelectorAll('.pref-tab').forEach(function(el) {
        el.classList.toggle('active', el.getAttribute('data-tab') === tab);
    });
    ['habits','templates','feedback','memories'].forEach(function(id) {
        var panel = document.getElementById('pref-tab-' + id);
        if (panel) panel.classList.toggle('hidden', id !== tab);
    });
    var cache = _prefCache();
    if (tab === 'habits') {
      if (Array.isArray(cache.habits)) {
        _renderHabits(cache.habits);
        prefLoadHabits({ silent: true });
      } else {
        prefLoadHabits({});
      }
    } else if (tab === 'templates') {
      if (Array.isArray(cache.templates)) {
        _renderTemplates(cache.templates);
        prefLoadTemplates({ silent: true });
      } else {
        prefLoadTemplates({});
      }
    } else if (tab === 'feedback') {
      var status = state.prefFeedbackFilter || '';
      var cached = cache.feedback && cache.feedback[status];
      if (Array.isArray(cached)) {
        _renderFeedback(cached, status);
        prefLoadFeedback(status, { silent: true });
      } else {
        prefLoadFeedback(status, {});
      }
    } else if (tab === 'memories') {
      if (Array.isArray(cache.memories)) {
        _renderMemories(cache.memories);
        memoryLoad({ silent: true });
      } else {
        memoryLoad({});
      }
    }
}

async function prefLoadTemplates(opts) {
    opts = opts || {};
    var container = document.getElementById('templates-list');
    if (!container) return;
    if (!opts.silent) {
        container.innerHTML = '<div style="color:var(--ant-color-text-tertiary);text-align:center;padding:32px;">加载中...</div>';
    }
    try {
        var resp = await fetch('/api/preferences/templates');
        if (handleAuthExpired(resp)) return;
        var data = await resp.json();
        var list = (data && data.templates) ? data.templates : [];
        _prefCache().templates = list;
        _renderTemplates(list);
    } catch (e) {
        if (!opts.silent) {
            container.innerHTML = '<div style="color:#e74c3c;text-align:center;padding:32px;">加载失败</div>';
        }
    }
}

function _renderTemplates(list) {
    var container = document.getElementById('templates-list');
    if (!container) return;
    if (!list || !list.length) {
        container.innerHTML = '<div style="color:var(--ant-color-text-tertiary);text-align:center;padding:32px;">暂无已分析模板（上传模板参与多文档比对后会出现在此）</div>';
        return;
    }
    container.innerHTML = list.map(function(t) {
        var name = escapeHtml(t.displayName || '未命名模板');
        var at = escapeHtml(t.analyzedAt || '');
        var sha = escapeHtml(t.sha256 || t.templateId || '');
        var meta = '章节 ' + (t.headingCount || 0) + ' · 要点 ' + (t.guidanceCount || 0) + ' · 条款 ' + (t.clauseCount || 0);
        return '<div class="pref-habit-row" style="align-items:center;">'
            + '<div style="flex:1;min-width:0;">'
            + '<div style="font-weight:600;">' + name + '</div>'
            + '<div class="hint" style="margin-top:4px;">' + meta + ' · ' + at + '</div>'
            + '<div class="hint" style="font-size:11px;">指纹 ' + escapeHtml(t.fingerprintShort || sha.slice(0, 12)) + '</div>'
            + '</div>'
            + '<button type="button" class="btn-sm" style="color:#e74c3c;border-color:#fecaca;" onclick="prefDeleteTemplate(\'' + sha + '\', \'' + name.replace(/'/g, '') + '\')">删除</button>'
            + '</div>';
    }).join('');
}

async function prefDeleteTemplate(sha256, displayName) {
    if (!sha256) return;
    var label = displayName || '该模板';
    if (!confirm('确定删除「' + label + '」的分析缓存？删除后同内容文件再次上传将重新分析。')) return;
    try {
        var resp = await fetch('/api/preferences/templates/' + encodeURIComponent(sha256), { method: 'DELETE' });
        if (handleAuthExpired(resp)) return;
        var data = await resp.json().catch(function() { return {}; });
        if (data.success) {
            if (state.prefCache) state.prefCache.templates = null;
            prefLoadTemplates({});
        } else {
            alert(data.message || '删除失败');
        }
    } catch (e) {
        alert('删除失败: ' + e);
    }
}

function _renderHabits(prefs) {
    var container = document.getElementById('habits-list');
    if (!container) return;
    if (!prefs || !prefs.length) {
        container.innerHTML = '<div style="color:var(--ant-color-text-tertiary);text-align:center;padding:32px;">暂无审查习惯记录</div>';
        return;
    }
    var sourceLabel = {
        'default': '默认',
        'algorithm': '使用频率',
        'llm': 'LLM 归并',
        'reject_feedback': '拒绝沉淀',
        'llm_habit': 'LLM 习惯分析',
    };
    container.innerHTML = prefs.map(function(p, idx) {
        var src = p.source || 'default';
        var label = sourceLabel[src] || src;
        var srcCls = 'pref-habit-source-' + src;
        return '<div class="pref-habit-row">'
            + '<span style="width:24px;text-align:center;color:#94a3b8;font-weight:700;">' + (idx + 1) + '</span>'
            + '<span style="flex:1;font-size:14px;color:#1e293b;">' + escapeHtml(p.item || '') + '</span>'
            + '<span class="pref-habit-source-tag ' + srcCls + '">' + escapeHtml(label) + '</span>'
            + '<span class="hint" style="min-width:60px;text-align:right;">频次 ' + (p.frequency || 0) + '</span>'
            + '</div>';
    }).join('');
}

async function prefLoadHabits(opts) {
    opts = opts || {};
    var container = document.getElementById('habits-list');
    if (!container) return;
    if (!opts.silent) {
        container.innerHTML = '<div style="color:var(--ant-color-text-tertiary);text-align:center;padding:32px;">加载中...</div>';
    }
    try {
        // 仅读取本地审查要点（无跨 Agent HTTP）
        var resp = await fetch('/api/preferences/focus');
        var data = await resp.json();
        var prefs = (data && data.focusPreferences) || [];
        _prefCache().habits = prefs;
        _focusPreferences = prefs;
        _renderHabits(prefs);
    } catch (e) {
        if (!opts.silent) {
            container.innerHTML = '<div style="color:#e74c3c;text-align:center;padding:32px;">加载失败：' + escapeHtml(e.message || e) + '</div>';
        }
    }
}

function _renderFeedback(items, status) {
    var container = document.getElementById('feedback-history-list');
    if (!container) return;
    document.querySelectorAll('.pref-fb-filter').forEach(function(el) {
        el.classList.toggle('active', (el.getAttribute('data-status') || '') === (status || ''));
    });
    if (!items || !items.length) {
        container.innerHTML = '<div style="color:var(--ant-color-text-tertiary);text-align:center;padding:32px;">暂无反馈记录</div>';
        return;
    }
    container.innerHTML = items.map(function(it) {
        var snap = it.issueSnapshot || {};
        var statusLabel = it.status === 'accepted' ? '已采纳' : (it.status === 'rejected' ? '已拒绝' : '未知');
        var statusCls = 'status-' + (it.status || '');
        var doc = it.documentName || '';
        return '<div class="pref-feedback-row ' + statusCls + '">'
            + '<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;">'
            + '<span style="font-weight:600;color:#1e293b;font-size:13px;">' + escapeHtml(snap.category || snap.title || '审查项') + '</span>'
            + '<span class="hint">' + escapeHtml(statusLabel) + ' · ' + escapeHtml(it.updatedAt || '') + '</span>'
            + '</div>'
            + (doc ? '<div class="hint" style="margin-top:4px;font-size:12px;">文档：' + escapeHtml(doc) + '</div>' : '')
            + (snap.docParagraphText ? '<div style="font-size:12px;color:#475569;margin-top:6px;background:#f8fafc;padding:6px 8px;border-radius:4px;">' + escapeHtml(String(snap.docParagraphText).slice(0, 200)) + '</div>' : '')
            + (it.reason ? '<div style="font-size:12px;color:var(--ant-color-text-tertiary);margin-top:6px;"><b>理由：</b>' + escapeHtml(it.reason) + '</div>' : '')
            + '</div>';
    }).join('');
}

async function prefLoadFeedback(status, opts) {
    opts = opts || {};
    state.prefFeedbackFilter = status || '';
    var container = document.getElementById('feedback-history-list');
    if (!container) return;
    if (!opts.silent) {
        container.innerHTML = '<div style="color:var(--ant-color-text-tertiary);text-align:center;padding:32px;">加载中...</div>';
    }
    try {
        var url = '/api/issues/feedback';
        if (status) url += '?status=' + encodeURIComponent(status);
        var resp = await fetch(url);
        var data = await resp.json();
        var items = (data && data.feedbacks) || [];
        if (!_prefCache().feedback) _prefCache().feedback = {};
        _prefCache().feedback[status || ''] = items;
        _renderFeedback(items, status);
    } catch (e) {
        if (!opts.silent) {
            container.innerHTML = '<div style="color:#e74c3c;text-align:center;padding:32px;">加载失败：' + escapeHtml(e.message || e) + '</div>';
        }
    }
}

// ══════════════════════════════════════════════════
// Boot：优先尝试自动登录，失败再显示登录页
// ══════════════════════════════════════════════════
function _setUserState(user) {
  state.user = user;
  document.getElementById('sider-user').textContent = '当前用户：' + (user.displayName || user.userId);
  document.getElementById('topbar-user').textContent = user.displayName || user.userId;
  document.getElementById('btn-logout').style.display = '';
}

(async () => {
  window.addEventListener('hashchange', function() {
    if (!state.user) return;
    var p = pageFromHash();
    if (p !== state.page) renderPage(p);
  });
  window.addEventListener('unhandledrejection', function(e) {
    console.error('Unhandled rejection:', e.reason);
  });
  window.addEventListener('error', function(e) {
    console.error('Global error:', e.error || e.message);
  });

  // 评审体验版：跳过登录，直接进入首页
  _setUserState({ userId: 'admin', displayName: '评审体验员' });
  ReviewTaskManager.restoreFromSession();
  await ReviewTaskManager.verifyRestoredTasks();
  if (!location.hash || location.hash === '#') location.hash = '#/home';
  try { await loadUserPreferences(); } catch(e) {}
  try { attachFocusAutoSave(); } catch(e) {}
  try { loadFocusFiles(); } catch(e) {}
  navTo(pageFromHash(), { skipHash: true });
})();
</script>
