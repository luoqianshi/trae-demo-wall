  }
  state.mtContent = state.mtResult.content || state.mtContent || [];
  state.mtDocText = detail.docText || state.mtDocText || state.mtResult.docMarkdown || '';
  state.mtTables = state.mtResult.tables || state.mtTables || [];
  state.mtImages = state.mtResult.images || state.mtImages || [];
  state.mtActiveIssueId = null;
  state.mtViewMode = 'positioning';
  state.mtLastError = null;

  state.mtFilterMode = 'all';
  if (state.page === 'multi') {
    mtRenderDoc(state.mtDocText, -1, state.mtTables, state.mtImages, state.mtContent, state.mtMammothHtml, { forceContent: true });
    mtUpdateFilterCounts(state.mtResult.issues);
    ['all','high','low','accepted','rejected'].forEach(function(f) {
      var pill = document.getElementById('mt-pill-' + f);
      if (pill) pill.classList.toggle('active', f === 'all');
    });
    var mtBox = document.getElementById('mt-report');
    if (mtBox) mtBox.innerHTML = '';
    mtRenderReport(state.mtResult.issues);
    if (stateEl) stateEl.textContent = '核查完成，发现 ' + (detail.issues || []).length + ' 处一致性风险';
    var mtExportBtn = document.getElementById('mt-export-btn');
    if (mtExportBtn) mtExportBtn.style.display = '';
    if (dedupStats && (dedupStats.previewCount > 0 || prevPreview > 0)) {
      var previewN = dedupStats.previewCount || prevPreview;
      if (previewN !== (detail.issues || []).length) {
        showToast('核查完成，已去重：预览 ' + previewN + ' 条 → 终稿 ' + (detail.issues || []).length + ' 条', 'info');
      }
    }
  } else {
    var mtToast = '多文档比对完成，发现 ' + (detail.issues || []).length + ' 处一致性风险';
    if (dedupStats && (dedupStats.previewCount > 0 || prevPreview > 0)) {
      var pN = dedupStats.previewCount || prevPreview;
      if (pN !== (detail.issues || []).length) mtToast += '（已去重：预览 ' + pN + ' 条）';
    }
    showToast(mtToast, 'info');
  }
  if (state.mtLastRecordId) {
    loadIssueFeedbackForRecord(state.mtLastRecordId, state.mtResult.issues).then(function() {
      mtUpdateFilterCounts(state.mtResult.issues);
      if (state.page === 'multi') mtRenderReport(mtGetFilteredIssues());
    });
  }
}

const ReviewTaskManager = {
  tasks: {},
  timer: null,
  ticking: false,

  persist: function() {
    try {
      var data = {};
      if (state.sgRunningRecordId) data.single = state.sgRunningRecordId;
      if (state.mtRunningRecordId) data.multi = state.mtRunningRecordId;
      sessionStorage.setItem(TASK_STORAGE_KEY, JSON.stringify(data));
    } catch (e) { /* ignore */ }
  },

  start: function(mode, recordId, label) {
    if (mode === 'single') {
      state.sgRunningRecordId = recordId;
      state.sgLastRecordId = recordId;
    } else {
      state.mtRunningRecordId = recordId;
      state.mtLastRecordId = recordId;
    }
    this.tasks[mode] = {
      recordId: recordId,
      pollCount: 0,
      intervalMs: 2000,
      maxPollCount: 900,
      label: label || '',
    };
    this.persist();
    this.ensurePolling();
    this.updateGlobalBanner();
  },

  stop: function(mode) {
    delete this.tasks[mode];
    if (mode === 'single') state.sgRunningRecordId = null;
    else state.mtRunningRecordId = null;
    this.persist();
    if (!Object.keys(this.tasks).length) {
      if (this.timer) {
        clearTimeout(this.timer);
        this.timer = null;
      }
    } else {
      this.scheduleNextTick();
    }
    this.updateGlobalBanner();
  },

  clearAll: function() {
    this.tasks = {};
    state.sgRunningRecordId = null;
    state.mtRunningRecordId = null;
    if (this.timer) {
      clearTimeout(this.timer);
      this.timer = null;
    }
    try { sessionStorage.removeItem(TASK_STORAGE_KEY); } catch (e) { /* ignore */ }
    this.updateGlobalBanner();
  },

  scheduleNextTick: function() {
    if (this.timer) {
      clearTimeout(this.timer);
      this.timer = null;
    }
    if (!Object.keys(this.tasks).length) return;
    var intervalMs = 2000;
    var modes = Object.keys(this.tasks);
    for (var i = 0; i < modes.length; i++) {
      intervalMs = Math.min(intervalMs, this.tasks[modes[i]].intervalMs || 2000);
    }
    var self = this;
    this.timer = setTimeout(function() {
      self.timer = null;
      self.tick();
    }, intervalMs);
  },

  ensurePolling: function() {
    this.scheduleNextTick();
  },

  tick: async function() {
    if (this.ticking) return;
    this.ticking = true;
    try {
      var modes = Object.keys(this.tasks);
      for (var i = 0; i < modes.length; i++) {
        await this.pollOne(modes[i]);
      }
    } finally {
      this.ticking = false;
      if (Object.keys(this.tasks).length) {
        this.scheduleNextTick();
      }
    }
  },

  pollOne: async function(mode) {
    var task = this.tasks[mode];
    if (!task) return;
    task.pollCount += 1;
    if (task.pollCount > task.maxPollCount) {
      // 软超时：提示用户但继续后台轮询，避免“界面失败但历史可见”的割裂感。
      if (!task._softTimedOut) {
        task._softTimedOut = true;
        try {
          if (mode === 'single') sgApplyReviewResult('timeout', null);
          else mtApplyReviewResult('timeout', null);
        } catch (e) {}
      }
      task.pollCount = 0;
      task.intervalMs = Math.max(task.intervalMs || 2000, 8000);
      this.scheduleNextTick();
      return;
    }
    try {
      var resp = await fetch('/api/history/' + task.recordId);
      if (handleAuthExpired(resp)) return;
      if (resp.status === 404 || resp.status === 403) {
        await this.handleTerminal(mode, 'error', {
          detail: { error: '审查记录不存在或无权访问（#' + task.recordId + '）' },
        });
        return;
      }
      if (!resp.ok) return;
      var data = await resp.json();
      if (data.pollConfig) {
        task.intervalMs = data.pollConfig.intervalMs || 2000;
        task.maxPollCount = data.pollConfig.maxPollCount || 900;
      }
      var item = data.item || {};
      task.lastProgressSnapshot = buildProgressSnapshotFromPollItem(item);
      if (_sgLogRecordId && String(_sgLogRecordId) === String(task.recordId) && mode === 'single') {
        sgRenderLogFromItem(task.lastProgressSnapshot, false);
      }
      if (_mtLogRecordId && String(_mtLogRecordId) === String(task.recordId) && mode === 'multi') {
        mtRenderLogFromItem(task.lastProgressSnapshot, false);
      }
      var st = String(item.status || '');
      if (mode === 'single' && state.page === 'single' && item.detail && item.detail.steps) {
        if (item.detail.partialIssues && item.detail.partialIssues.length) {
          sgApplyPartialReview(item.detail, item.detail.steps, st, task);
        } else {
          sgRenderInlineProgress(item.detail.steps, st);
        }
      }
      if (mode === 'multi' && state.page === 'multi' && item.detail && item.detail.steps) {
        if (item.detail.partialIssues && item.detail.partialIssues.length) {
          mtApplyPartialReview(item.detail, item.detail.steps, st, task);
        } else {
          mtRenderInlineProgress(item.detail.steps, st);
        }
      }
      if (st === 'done' || st === 'error' || st === 'cancelled') {
        await this.handleTerminal(mode, st, item);
      } else {
        this.updateGlobalBanner(item);
      }
    } catch (e) { /* ignore transient errors */ }
  },

  handleTerminal: async function(mode, st, item) {
    var task = this.tasks[mode];
    if (!task) return;
    if (st === 'done') {
      try {
        var resp = await fetch('/api/history/' + task.recordId + '?include_content=true');
        if (handleAuthExpired(resp)) return;
        if (resp.ok) {
          var data = await resp.json();
          item = data.item || item;
        }
      } catch (e) { /* use lightweight payload */ }
    }
    this.stop(mode);
    if (mode === 'single') sgApplyReviewResult(st, item);
    else mtApplyReviewResult(st, item);
    if (state.page === 'history') histLoad();
  },

  restoreFromSession: function() {
    try {
      var raw = sessionStorage.getItem(TASK_STORAGE_KEY);
      if (!raw) return;
      var data = JSON.parse(raw);
      if (data.single) {
        state.sgRunningRecordId = data.single;
        this.tasks.single = { recordId: data.single, pollCount: 0, intervalMs: 2000, maxPollCount: 900, label: '' };
      }
      if (data.multi) {
        state.mtRunningRecordId = data.multi;
        this.tasks.multi = { recordId: data.multi, pollCount: 0, intervalMs: 2000, maxPollCount: 900, label: '' };
      }
    } catch (e) { /* ignore */ }
  },

  verifyRestoredTasks: async function() {
    var modes = Object.keys(this.tasks);
    if (!modes.length) return;
    for (var i = 0; i < modes.length; i++) {
      var mode = modes[i];
      var task = this.tasks[mode];
      if (!task) continue;
      try {
        var resp = await fetch('/api/history/' + task.recordId);
        if (handleAuthExpired(resp)) return;
        if (resp.status === 404 || resp.status === 403) {
          this.stop(mode);
          showToast('审查任务 #' + task.recordId + ' 已失效，请到历史记录查看', 'warn');
          continue;
        }
        if (!resp.ok) {
          this.scheduleNextTick();
          continue;
        }
        var data = await resp.json();
        var item = data.item || {};
        var st = String(item.status || '');
        if (st === 'done' || st === 'error' || st === 'cancelled') {
          await this.handleTerminal(mode, st, item);
        } else if (st === 'running' || st === 'queued') {
          /* 仍在运行，继续轮询 */
        } else {
          this.stop(mode);
        }
      } catch (e) { /* 网络异常，稍后轮询 */ }
    }
    if (Object.keys(this.tasks).length) this.scheduleNextTick();
    this.updateGlobalBanner();
  },

  updateGlobalBanner: function(item) {
    var el = document.getElementById('topbar-review-status');
    if (!el) return;
    var modes = Object.keys(this.tasks);
    if (!modes.length) {
      el.innerHTML = '';
      el.classList.add('hidden');
      return;
    }
    el.classList.remove('hidden');
    el.innerHTML = modes.map(function(mode) {
      var t = ReviewTaskManager.tasks[mode];
      var label = mode === 'single' ? '单文档校对' : '多文档比对';
      var page = mode === 'single' ? 'single' : 'multi';
      var extra = '';
      if (item && item.id === t.recordId && item.detail && item.detail.steps) {
        var done = item.detail.steps.filter(function(s) {
          return s.status === 'done' || s.status === 'error' || s.status === 'cancelled';
        }).length;
        extra = ' (' + done + '/' + item.detail.steps.length + ')';
      }
      return '<span class="topbar-task" onclick="navTo(\'' + page + '\')">' + label + ' #' + t.recordId + extra + '</span>';
    }).join('');
  },
};

// ══════════════════════════════════════════════════
// Nav
// ══════════════════════════════════════════════════
function navTo(page, opts) {
  opts = opts || {};
  if (!state.user && page !== 'login') {
    if (!opts.skipHash) location.hash = '#/login';
    renderPage('login');
    return;
  }
  if (page !== 'login' && !opts.skipHash) {
    location.hash = '#/' + page;
  }
  renderPage(page);
}

function renderPage(page) {
  if (state.page === 'history' && page !== 'history') {
    histStopAutoRefresh();
  }

  if (state.page === 'single' && page !== 'single') {
    sgStopLog();
  }

  if (state.page === 'multi' && page !== 'multi') {
    mtStopLog();
  }

  if (page === 'single') {
    mtStopLog();
    if (_mtLogTimer) { clearInterval(_mtLogTimer); _mtLogTimer = null; }
    _mtLogRecordId = null;
  }
  if (page === 'multi') {
    sgStopLog();
    if (_sgLogTimer) { clearInterval(_sgLogTimer); _sgLogTimer = null; }
    _sgLogRecordId = null;
  }

  state.page = page;
  const area = document.getElementById('page-area');
  const tpl  = document.getElementById('tpl-' + page);
  if (!tpl) return;
  area.innerHTML = '';
  area.appendChild(tpl.content.cloneNode(true));
  document.querySelectorAll('.menu-item').forEach(el => el.classList.toggle('active', el.dataset.page === page));
  if (page === 'single')  { sgRestoreState(); wsRenderTree('sg'); renderFocusPreferenceTags('sg-ai-focus', 'sg-focus-pref-tags', 'sg-focus-pref-wrap'); attachFocusAutoSave(); }
  if (page === 'multi')   { mtRestoreState(); wsRenderTree('mt'); renderFocusPreferenceTags('mt-ai-focus', 'mt-focus-pref-tags', 'mt-focus-pref-wrap'); attachFocusAutoSave(); }
  if (page === 'history') {
    histLoad();
    histStartAutoRefresh();
  }
  if (page === 'memory') {
    var activeTab = state.prefActiveTab || 'habits';
    prefSwitchTab(activeTab);
  }
  ReviewTaskManager.updateGlobalBanner();
}

// ══════════════════════════════════════════════════
// Auth
// ══════════════════════════════════════════════════
async function doLogin() {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value.trim();
  const resp = await fetch('/api/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({username:u,password:p}) });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    document.getElementById('login-err').textContent = err.message || '账号或密码错误';
    return;
  }
  const data = await resp.json();
  state.user = { userId: data.userId, displayName: data.displayName };
  document.getElementById('sider-user').textContent = '当前用户：' + data.displayName;
  document.getElementById('topbar-user').textContent = data.displayName;
  document.getElementById('btn-logout').style.display = '';
  await loadUserPreferences();
  attachFocusAutoSave();
  loadFocusFiles();
  navTo(pageFromHash() || 'home');
}
async function logout() {
  await fetch('/api/logout', { method: 'POST' });
  state.user = null;
  try { sessionStorage.removeItem(TASK_STORAGE_KEY); } catch (e) {}
  if (ReviewTaskManager.timer) { clearInterval(ReviewTaskManager.timer); ReviewTaskManager.timer = null; }
  ReviewTaskManager.tasks = {};
  state.sgRunningRecordId = null;
  state.mtRunningRecordId = null;
  ReviewTaskManager.updateGlobalBanner();
  // 评审体验版：退出后重新自动登录，不显示登录页
  _setUserState({ userId: 'admin', displayName: '评审体验员' });
  try { await loadUserPreferences(); } catch(e) {}
  try { attachFocusAutoSave(); } catch(e) {}
  try { loadFocusFiles(); } catch(e) {}
  location.hash = '#/home';
  navTo('home');
}

var DOC_IMAGE_PLACEHOLDER_SRC = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';

function mammothConvertOptions() {
  return {
    convertImage: mammoth.images.imgElement(function() {
      return {
        src: DOC_IMAGE_PLACEHOLDER_SRC,
        className: 'doc-image-placeholder-mammoth'
      };
    })
  };
}

function docPreviewVisible(page) {
  if (page === 'sg') {
    return (state.sgContent && state.sgContent.length) || !!state.sgMammothHtml;
  }
  return (state.mtContent && state.mtContent.length) || !!state.mtMammothHtml;
}

function renderDocImagePlaceholder(rId) {
  var rIdAttr = rId ? ' data-r-id="' + escapeHtml(String(rId)) + '"' : '';
  return '<div class="doc-image-placeholder"' + rIdAttr + ' data-pending="1"></div>';
}

function shouldRenderImageAsPlaceholder(img) {
  if (!img) return true;
  if (img.pending) return true;
  if (img.type === 'placeholder') return true;
  if (!img.data || (typeof img.data === 'string' && !img.data.trim())) return true;
  return false;
}

function startMammothPreview(file, page, isSg) {
  function applyMammothHtml(html) {
    if (isSg) {
      state.sgMammothHtml = html;
      if (!state.sgContent || !state.sgContent.length) {
        sgRenderDocView('', [], [], -1, [], html);
      }
    } else {
      state.mtMammothHtml = html;
      if (!state.mtContent || !state.mtContent.length) {
        mtRenderDoc('', -1, [], [], [], html);
      }
    }
  }
  function runConvert(arrayBuffer) {
    mammoth.convertToHtml({ arrayBuffer: arrayBuffer }, mammothConvertOptions())
      .then(function(result) { applyMammothHtml(result.value); })
      .catch(function(err) {
        console.error('mammoth conversion error:', err);
        if (!docPreviewVisible(page)) {
          showDocPlaceholder(page, file.name, 'Word 预览失败，仍可点击校对按钮继续');
        }
      });
  }
  if (typeof mammoth === 'undefined') {
    var waited = 0;
    var waitTimer = setInterval(function() {
      waited += 200;
      if (typeof mammoth !== 'undefined') {
        clearInterval(waitTimer);
        var reader = new FileReader();
        reader.onload = function(e) { runConvert(e.target.result); };
        reader.readAsArrayBuffer(file);
      } else if (waited >= 8000) {
        clearInterval(waitTimer);
        if (!docPreviewVisible(page)) showMammothMissing(page, file.name);
      }
    }, 200);
    return;
  }
  var reader = new FileReader();
  reader.onload = function(e) { runConvert(e.target.result); };
  reader.readAsArrayBuffer(file);
}

function scheduleMathJaxTypeset(container) {
  if (!container || typeof MathJax === 'undefined' || !MathJax.typesetPromise) return;
  MathJax.typesetPromise([container]).catch(function(err) {
    console.warn('MathJax typeset failed:', err);
  });
}

function extractImagesFromContent(content) {
  var images = [];
  (content || []).forEach(function(item) {
    if (item.type === 'image' && item.data) {
      images.push({ data: item.data });
    } else if (item.type === 'table' && item.data) {
      item.data.forEach(function(row) {
        row.forEach(function(cell) {
          if (cell && cell.images && cell.images.length) {
            cell.images.forEach(function(img) { images.push(img); });
          }
        });
      });
    }
  });
  return images;
}

function renderTableCellContent(cell) {
  if (cell == null) return '';
  if (typeof cell === 'string') return escapeHtml(cell);
  var html = '';
  if (cell.text) html += escapeHtml(cell.text);
  if (cell.images && cell.images.length) {
    cell.images.forEach(function(img) {
      if (shouldRenderImageAsPlaceholder(img)) {
        html += renderDocImagePlaceholder(img.rId);
      } else {
        var rIdAttr = img.rId ? ' data-r-id="' + escapeHtml(String(img.rId)) + '"' : '';
        html += '<img src="' + img.data + '" alt="表格图片"' + rIdAttr + '>';
      }
    });
  }
  return html || '';
}

function renderTable(tableData, tableIdx) {
  if (!tableData || !tableData.length) return '';
  var rows = tableData;
  var maxCols = 0;
  rows.forEach(function(row) {
    if (row.length > maxCols) maxCols = row.length;
  });

  var spanMap = [];
  for (var r = 0; r < rows.length; r++) {
    spanMap[r] = [];
    for (var c = 0; c < maxCols; c++) {
      spanMap[r][c] = { rowspan: 1, colspan: 1, skip: false };
    }
  }

  for (var r = 0; r < rows.length; r++) {
    for (var c = 0; c < rows[r].length; c++) {
      var cell = rows[r][c];
      if (cell && typeof cell === 'object' && cell.colSpan && cell.colSpan > 1) {
        spanMap[r][c].colspan = cell.colSpan;
      }
    }
  }

  for (var c = 0; c < maxCols; c++) {
    for (var r = 0; r < rows.length; r++) {
      var cell = rows[r] ? rows[r][c] : null;
      if (cell && typeof cell === 'object' && cell.rowSpan === 'continue') {
        var startR = r - 1;
        while (startR >= 0 && rows[startR] && rows[startR][c] && typeof rows[startR][c] === 'object' && rows[startR][c].rowSpan === 'continue') {
          startR--;
        }
        if (startR >= 0 && spanMap[startR][c]) {
          spanMap[startR][c].rowspan++;
        }
        spanMap[r][c].skip = true;
      }
    }
  }

  var tableHtml = '<div style="margin:16px 0;overflow-x:auto;"><table class="doc-table"><thead>';
  tableHtml += '<tr>';
  for (var c = 0; c < (rows[0] ? rows[0].length : 0); c++) {
    if (spanMap[0][c].skip) continue;
    var attrs = '';
    if (spanMap[0][c].colspan > 1) attrs += ' colspan="' + spanMap[0][c].colspan + '"';
    if (spanMap[0][c].rowspan > 1) attrs += ' rowspan="' + spanMap[0][c].rowspan + '"';
    tableHtml += '<th' + attrs + '>' + renderTableCellContent(rows[0][c]) + '</th>';
  }
  tableHtml += '</tr></thead><tbody>';
  for (var r = 1; r < rows.length; r++) {
    tableHtml += '<tr>';
    for (var c = 0; c < (rows[r] ? rows[r].length : 0); c++) {
      if (spanMap[r][c].skip) continue;
      var attrs = '';
      if (spanMap[r][c].colspan > 1) attrs += ' colspan="' + spanMap[r][c].colspan + '"';
      if (spanMap[r][c].rowspan > 1) attrs += ' rowspan="' + spanMap[r][c].rowspan + '"';
      tableHtml += '<td' + attrs + '>' + renderTableCellContent(rows[r][c]) + '</td>';
    }
    tableHtml += '</tr>';
  }
  tableHtml += '</tbody></table></div>';
  return tableHtml;
}

function buildContentHtml(content, activeParaIdx, paraPrefix, onClickName, renderOpts) {
  renderOpts = renderOpts || {};
  var addParaIds = renderOpts.addParaIds !== false;
  var enableClick = renderOpts.anchorParagraphs !== false && !!onClickName;
  var html = '';
  var paraCounter = 0;
  (content || []).forEach(function(item) {
    if (item.type === 'image' || (item.data && typeof item.data === 'string' && item.data.startsWith('data:image/'))) {
      if (shouldRenderImageAsPlaceholder(item)) {
        html += '<div class="doc-image-wrap" style="text-align:center;">' + renderDocImagePlaceholder(item.rId) + '</div>';
      } else {
        var rIdAttr = item.rId ? ' data-r-id="' + escapeHtml(String(item.rId)) + '"' : '';
        html += '<div class="doc-image-wrap" style="text-align:center;margin:16px 0;">'
          + '<img src="' + item.data + '" alt="文档图片"' + rIdAttr
          + ' style="max-width:100%;max-height:400px;border:1px solid var(--ant-color-border-secondary);border-radius:8px;">'
          + '</div>';
      }
    } else if (item.type === 'formula' && item.mathml) {
      html += '<div class="doc-formula">' + item.mathml + '</div>';
    } else if (item.type === 'table') {
      html += renderTable(item.data, 0);
    } else if (item.type === 'paragraph' || item.type === 'caption') {
      var isCaption = item.type === 'caption';
      var isActive = paraCounter === activeParaIdx;
      var cls = isCaption ? 'doc-caption' : 'doc-para';
      var clickAttr = '';
      if (enableClick) {
        clickAttr = onClickName === 'histSelectPara'
          ? ' onclick="' + onClickName + '(' + paraCounter + ')"'
          : ' onclick="' + onClickName + '(null,' + paraCounter + ')"';
      }
      var idAttr = addParaIds ? ' id="' + paraPrefix + paraCounter + '"' : '';
      html += '<p class="' + cls + (isActive ? ' active' : '') + '"' + idAttr + clickAttr + '>'
        + escapeHtml(item.text) + '</p>';
      paraCounter++;
    }
  });
  return html;
}

function updateDocModeBanner(prefix, viewMode) {
  var el = document.getElementById(prefix + '-doc-mode-banner');
  if (!el) return;
  var hasContent = prefix === 'sg'
    ? (state.sgContent && state.sgContent.length)
    : (state.mtContent && state.mtContent.length);
  var toggleBtn = hasContent
    ? '<button type="button" class="doc-mode-toggle" onclick="' + (prefix === 'sg' ? 'sgToggleViewMode()' : 'mtToggleViewMode()') + '">'
      + (viewMode === 'positioning' ? '切换预览版式' : '切换定位视图') + '</button>'
    : '';
  if (viewMode === 'positioning') {
    el.className = 'doc-mode-banner doc-mode-positioning';
    el.classList.remove('hidden');
    el.innerHTML = icon('pin', 'ui-icon-sm') + ' <b>校对定位视图</b>：段落编号与问题定位一致，点击右侧问题可跳转' + toggleBtn;
  } else if (viewMode === 'preview') {
    el.className = 'doc-mode-banner doc-mode-preview';
    el.classList.remove('hidden');
    el.innerHTML = icon('eye', 'ui-icon-sm') + ' <b>预览版式</b>：服务端解析文档结构，图片/表格/公式完整展示' + toggleBtn;
  } else {
    el.classList.add('hidden');
    el.innerHTML = '';
  }
}

function sgToggleViewMode() {
  if (!state.sgContent || !state.sgContent.length) return;
  state.sgViewMode = state.sgViewMode === 'positioning' ? 'preview' : 'positioning';
  sgRenderDocView(state.sgDocText || '', state.sgTables || [], state.sgImages || [], -1, state.sgContent, state.sgMammothHtml, { viewMode: state.sgViewMode });
}

function mtToggleViewMode() {
  if (!state.mtContent || !state.mtContent.length) return;
  state.mtViewMode = state.mtViewMode === 'positioning' ? 'preview' : 'positioning';
  mtRenderDoc(state.mtDocText || '', -1, state.mtTables || [], state.mtImages || [], state.mtContent, state.mtMammothHtml, { viewMode: state.mtViewMode });
}

async function parseDocxOnServer(file, page) {
  var isSg = page === 'sg';
  if (!docPreviewVisible(page)) {
    showDocPlaceholder(page, file.name, '正在优化版式…');
  }
  state.docxParseToken = (state.docxParseToken || 0) + 1;
  var fetchToken = state.docxParseToken;
  try {
    var form = new FormData();
    form.append('file', file);
    var resp = await fetch('/api/docx/parse?mode=fast', { method: 'POST', body: form });
    if (handleAuthExpired(resp)) return;
    var data = null;
    try { data = await resp.json(); } catch (_) { data = null; }
    if (!resp.ok) {
      if (resp.status === 422 && data && data.parseWarningMessage) {
        if (fetchToken === state.docxParseToken) {
          showToast(data.parseWarningMessage, 'error');
          showDocPlaceholder(page, file.name, data.parseWarningMessage);
          if (isSg) state.sgFile = null; else state.mtDocFile = null;
        }
        return;
      }
      throw new Error((data && data.detail) || ('HTTP ' + resp.status));
    }
    if (!data) throw new Error('解析响应为空');
    if (data.parseWarningMessage) {
      showToast(data.parseWarningMessage, 'warn');
    }
    if (fetchToken !== state.docxParseToken) return; // 用户已切换文件
    if (isSg) {
      state.sgContent = data.content || [];
      state.sgDocText = data.text || '';
      state.sgTables = data.tables || [];
      state.sgImages = data.images || [];
      sgRenderDocView(state.sgDocText, state.sgTables, state.sgImages, -1, state.sgContent, state.sgMammothHtml);
    } else {
      state.mtContent = data.content || [];
      state.mtDocText = data.text || '';
      state.mtTables = data.tables || [];
      state.mtImages = data.images || [];
      mtRenderDoc(state.mtDocText, -1, state.mtTables, state.mtImages, state.mtContent, state.mtMammothHtml);
    }
  } catch (err) {
    console.error('docx parse error:', err);
    if (isSg && state.sgMammothHtml) {
      sgRenderDocView('', [], [], -1, [], state.sgMammothHtml);
    } else if (!isSg && state.mtMammothHtml) {
      mtRenderDoc('', -1, [], [], [], state.mtMammothHtml);
    } else {
      showDocPlaceholder(page, file.name, '文档解析失败，仍可点击校对按钮继续');
    }
  }
}

function hasPendingImages(images, content) {
  if (images && images.some(function(img) { return img && img.pending; })) return true;
  if (content && content.some(function(it) {
    if (!it) return false;
    if (it.type === 'image' && it.pending) return true;
    if (it.type === 'table' && it.data) {
      return it.data.some(function(row) {
        return row.some(function(cell) {
          return cell && cell.images && cell.images.some(function(img) { return img && img.pending; });
        });
      });
    }
    return false;
  })) return true;
  return false;
}

async function enrichPendingImages(file, page, fetchToken) {
  try {
    var form = new FormData();
    form.append('file', file);
    var resp = await fetch('/api/docx/parse?mode=images', { method: 'POST', body: form });
    if (!resp.ok) return;
    var data = await resp.json();
    if (fetchToken !== state.docxParseToken) return; // 用户已切换文件
    var isSg = page === 'sg';
    if (isSg) {
      state.sgContent = data.content || state.sgContent;
      state.sgImages = data.images || state.sgImages;
    } else {
      state.mtContent = data.content || state.mtContent;
      state.mtImages = data.images || state.mtImages;
    }
    applyImageEnrichmentToDom(page, data.images || []);
  } catch (err) {
    console.warn('images mode enrichment failed:', err);
  }
}

function applyImageEnrichmentToDom(page, images) {
  if (!images || !images.length) return;
  var viewId = page === 'sg' ? 'sg-doc-view' : 'mt-doc-view';
  var view = document.getElementById(viewId);
  if (!view) return;
  var byRid = {};
  images.forEach(function(img) {
    if (img && img.rId && !img.pending) byRid[img.rId] = img;
  });
  Array.prototype.forEach.call(view.querySelectorAll('img[data-r-id][data-pending="1"]'), function(el) {
    var rid = el.getAttribute('data-r-id');
    var info = byRid[rid];
    if (!info) return;
    el.setAttribute('src', info.data);
    el.removeAttribute('data-pending');
    el.style.opacity = '';
    var wrap = el.closest('.doc-image-pending');
    if (wrap) {
      wrap.classList.remove('doc-image-pending');
      var hint = wrap.querySelector('div');
      if (hint && hint.textContent.indexOf('矢量图') >= 0) hint.remove();
    }
  });
}

function wrapDocPage(innerHtml) {
  return '<div class="doc-page">' + innerHtml + '</div>';
}

function showDocPlaceholder(page, fileName, subtext) {
  var viewId = page === 'sg' ? 'sg-doc-view' : 'mt-doc-view';
  var view = document.getElementById(viewId);
  if (!view) return;
  updateDocModeBanner(page, null);
  view.innerHTML = wrapDocPage(
    '<div style="text-align:center;padding:80px 20px;color:#94a3b8;">'
    + '<p style="font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;">' + icon('file', 'ui-icon-sm') + ' ' + escapeHtml(fileName) + '</p>'
    + '<p style="font-size:13px;margin-top:8px;color:#cbd5e1;">' + escapeHtml(subtext || '') + '</p></div>'
  );
}

function showMammothMissing(page, fileName) {
  showDocPlaceholder(page, fileName, 'Word 预览组件未加载，请刷新页面；仍可点击「立即校对」');
}

function previewDocFile(file, page) {
  var ext = file.name.split('.').pop().toLowerCase();
  var isSg = page === 'sg';
  if (isSg) {
    state.sgFile = file;
    state.sgMammothHtml = null;
    state.sgFileText = null;
    state.sgContent = [];
    state.sgDocText = null;
    state.sgAllIssues = [];
    state.sgViewMode = 'preview';
    state.wsSgActivePath = file.webkitRelativePath || file.name;
    wsRenderTree('sg');
    var sgReportList = document.getElementById('sg-report-list');
    if (sgReportList) sgReportList.innerHTML = '<div class="sg-empty-hint">暂无校对结果</div>';
    ['sg-cnt-all','sg-cnt-high','sg-cnt-low','sg-cnt-accepted','sg-cnt-rejected'].forEach(function(id) {
      var n = document.getElementById(id);
      if (n) n.textContent = '0';
    });
    sgSetState('');
    var sgExportBtn = document.getElementById('sg-export-btn');
    if (sgExportBtn) sgExportBtn.style.display = 'none';
  } else {
    state.mtDocFile = file;
    state.mtMammothHtml = null;
    state.mtContent = [];
    state.mtDocText = null;
    state.mtTables = [];
    state.mtImages = [];
    state.mtResult = null;
    state.mtViewMode = 'preview';
    state.wsMtActivePath = file.webkitRelativePath || file.name;
    wsRenderTree('mt');
    var mtReport = document.getElementById('mt-report');
    if (mtReport) mtReport.innerHTML = '<div class="hint">暂无核查结果</div>';
    resetReviewStatBar('mt');
    var mtExportBtn = document.getElementById('mt-export-btn');
    if (mtExportBtn) mtExportBtn.style.display = 'none';
  }
  if (ext === 'txt') {
    var reader = new FileReader();
    reader.onload = function(e) {
      var text = e.target.result;
      if (isSg) {
        state.sgFileText = text;
        sgRenderDocView(text, [], [], -1, [], null);
      } else {
        mtRenderDoc(text, -1, [], [], [], null);
      }
    };
    reader.readAsText(file, 'utf-8');
    return;
  }
  if (ext === 'doc') {
    showDocPlaceholder(page, file.name, '正在转换并加载 Word 文档（.doc 格式需服务端转换）...');
    parseDocxOnServer(file, page);
    return;
  }
  if (ext === 'docx') {
    showDocPlaceholder(page, file.name, '正在加载 Word 文档...');
    parseDocxOnServer(file, page);
    startMammothPreview(file, page, isSg);
    return;
  }
  showDocPlaceholder(page, file.name, 'PDF 将在校对后按段落展示；点击「立即校对」开始');
}

function wsPickDirectory(page) {
  var input = document.getElementById(page === 'sg' ? 'sg-ws-input' : 'mt-ws-input');
  if (input) input.click();
}

function wsOnDirectoryChange(ev, page) {
  var files = Array.from(ev.target.files || []);
  ev.target.value = '';
  var docFiles = files.filter(function(f) {
    var ext = f.name.split('.').pop().toLowerCase();
    return ['docx', 'doc', 'txt', 'pdf'].indexOf(ext) >= 0;
  });
  if (!docFiles.length) {
    alert('所选文件夹中未找到 doc/docx/txt/pdf 文档');
    return;
  }
  var label = (files[0] && files[0].webkitRelativePath || '').split('/')[0] || '所选文件夹';
  var entries = docFiles.map(function(f) {
    return { path: f.webkitRelativePath || f.name, name: f.name, file: f };
  }).sort(function(a, b) { return a.path.localeCompare(b.path, 'zh'); });
  if (page === 'sg') {
    state.wsSgFiles = entries;
    state.wsSgLabel = label;
  } else {
    state.wsMtFiles = entries;
    state.wsMtLabel = label;
  }
  wsRenderTree(page);
}

function wsRenderTree(page) {
  var isSg = page === 'sg';
  var treeEl = document.getElementById(isSg ? 'sg-ws-tree' : 'mt-ws-tree');
  var labelEl = document.getElementById(isSg ? 'sg-ws-label' : 'mt-ws-label');
  var files = isSg ? state.wsSgFiles : state.wsMtFiles;
  var label = isSg ? state.wsSgLabel : state.wsMtLabel;
  var activePath = isSg ? state.wsSgActivePath : state.wsMtActivePath;
  if (labelEl) labelEl.innerHTML = label ? (icon('folder', 'ui-icon-sm') + ' ' + escapeHtml(label)) : '';
  if (!treeEl) return;
  if (!files.length) {
    treeEl.innerHTML = '<div class="ws-tree-empty">选择文件夹后可快速切换 doc/docx/txt/pdf</div>';
    return;
  }
  treeEl.innerHTML = files.map(function(entry, idx) {
    var sel = entry.path === activePath ? ' active' : '';
    return '<div class="ws-tree-item' + sel + '" data-idx="' + idx + '" title="' + escapeHtml(entry.path) + '" onclick="wsSelectFile(\'' + page + '\',' + idx + ')">'
      + escapeHtml(entry.name) + '</div>';
  }).join('');
}

function sgRestoreIdleDocView() {
  if (!state.sgFile) return;
  if (state.sgContent && state.sgContent.length) {
    sgRenderDocView(state.sgDocText || state.sgFileText || '', state.sgTables || [], state.sgImages || [], -1, state.sgContent, state.sgMammothHtml, { viewMode: state.sgViewMode || 'positioning' });
    return;
  }
  state.sgViewMode = 'preview';
  if (state.sgMammothHtml) {
    sgRenderDocView('', [], [], -1, [], state.sgMammothHtml);
  } else if (state.sgFileText) {
    sgRenderDocView(state.sgFileText, [], [], -1, [], null);
  }
}

function mtRestoreIdleDocView() {
  if (!state.mtDocFile) return;
  if (state.mtContent && state.mtContent.length) {
    mtRenderDoc(state.mtDocText || '', -1, state.mtTables || [], state.mtImages || [], state.mtContent, state.mtMammothHtml, { viewMode: state.mtViewMode || 'positioning' });
    return;
  }
  if (state.mtResult && state.mtResult.content && state.mtResult.content.length) {
    state.mtViewMode = 'positioning';
    mtRenderDoc(state.mtResult.docMarkdown, -1, state.mtResult.tables, state.mtResult.images, state.mtResult.content, null, { viewMode: 'positioning' });
    return;
  }
  state.mtViewMode = 'preview';
  if (state.mtMammothHtml) {
    mtRenderDoc('', -1, [], [], [], state.mtMammothHtml);
  }
}

function wsSelectFile(page, idx) {
  var files = page === 'sg' ? state.wsSgFiles : state.wsMtFiles;
  if (!files[idx]) return;
  var entry = files[idx];
  if (page === 'sg') {
    state.wsSgActivePath = entry.path;
    var el = document.getElementById('sg-filename');
    if (el) el.textContent = entry.name;
    var clearBtn = document.getElementById('sg-clear-btn');
    if (clearBtn) clearBtn.classList.remove('hidden');
    previewDocFile(entry.file, 'sg');
  } else {
    state.wsMtActivePath = entry.path;
    var nameEl = document.getElementById('mt-doc-name');
    if (nameEl) nameEl.textContent = entry.name;
    var clearBtn = document.getElementById('mt-doc-clear-btn');
    if (clearBtn) clearBtn.classList.remove('hidden');
    previewDocFile(entry.file, 'mt');
  }
  wsRenderTree(page);
}

function sgFileChange(input) {
  var file = input.files[0];
  if (!file) return;
  var ext = file.name.split('.').pop().toLowerCase();
  var allowed = ['txt', 'doc', 'docx', 'pdf'];
  if (!allowed.includes(ext)) {
    alert('不支持的文件格式，请上传 TXT、DOC、DOCX 或 PDF 文件');
    input.value = '';
    return;
  }
  const el = document.getElementById('sg-filename');
  if (el) el.textContent = file.name;
  const clearBtn = document.getElementById('sg-clear-btn');
  if (clearBtn) clearBtn.classList.remove('hidden');
  previewDocFile(file, 'sg');
}

function sgSwitchTab(tab) {
  state.sgTab = tab;
  ['rule','ai'].forEach(t => {
    const btn = document.getElementById('sg-tab-' + t);
    if (btn) btn.classList.toggle('active', t === tab);
  });
  const ruleRes = document.getElementById('sg-rule-results');
  const aiRes   = document.getElementById('sg-ai-results');
  const aiFocus = document.getElementById('sg-ai-focus-box');
  if (ruleRes) ruleRes.classList.toggle('hidden', tab === 'ai');
  if (aiRes)   aiRes.classList.toggle('hidden', tab === 'rule');
  if (aiFocus) aiFocus.classList.toggle('hidden', tab === 'rule');
}

function sgSetState(t) { const el = document.getElementById('sg-state'); if (el) el.textContent = t || ''; }

var _sgLogTimer = null;
var _sgLogRecordId = null;
var _sgLogLastFp = '';

function sgRenderLogFromItem(progressItem, force) {
  var box = document.getElementById('sg-log-content');
  if (!box || !progressItem) return;
  var detail = progressItem.detail || {};
  var steps = detail.steps || [];
  var errors = detail.errors || [];
  var fp = reviewLogFingerprint(progressItem, steps, errors);
  if (!force && fp === _sgLogLastFp) return;
  _sgLogLastFp = fp;
  box.innerHTML = buildReviewLogHtml(progressItem, detail, steps, errors, _SG_STEP_LABELS, '处问题');
}

function sgShowLog(recordId) {
  recordId = recordId || state.sgRunningRecordId || state.sgLastRecordId;
  if (!recordId) {
    var waitBox = document.getElementById('sg-log-content');
    var waitOl = document.getElementById('sg-log-overlay');
    if (waitOl) {
      waitOl.classList.remove('hidden');
      if (waitBox) {
        waitBox.innerHTML = '<div style="padding:16px;color:var(--ant-color-text-tertiary);text-align:center">正在创建审查任务，请稍候…</div>';
      }
    } else {
      showToast('正在创建审查任务，请稍候…', 'info');
    }
    return;
  }
  _sgLogRecordId = recordId;
  _sgLogLastFp = '';
  var ol = document.getElementById('sg-log-overlay');
  if (ol) {
    ol.classList.remove('hidden');
    var box = document.getElementById('sg-log-content');
    var cached = getReviewLogCache('single', recordId);
    if (cached) {
      sgRenderLogFromItem(cached, true);
    } else if (box) {
      box.innerHTML = '<div style="padding:16px;color:var(--ant-color-text-tertiary);text-align:center">加载中...</div>';
    }
  }
  sgFetchLog(!getReviewLogCache('single', recordId));
  if (_sgLogTimer) clearInterval(_sgLogTimer);
  _sgLogTimer = null;
  var activeTask = ReviewTaskManager.tasks.single;
  if (!activeTask || String(activeTask.recordId) !== String(recordId)) {
    _sgLogTimer = setInterval(function() { sgFetchLog(false); }, 2000);
  }
}

function sgCloseLog() {
  var ol = document.getElementById('sg-log-overlay');
  if (ol) ol.classList.add('hidden');
  if (_sgLogTimer) { clearInterval(_sgLogTimer); _sgLogTimer = null; }
  _sgLogRecordId = null;
  _sgLogLastFp = '';
}

function sgStopLog() {
  if (_sgLogTimer) { clearInterval(_sgLogTimer); _sgLogTimer = null; }
}

var _SG_STEP_LABELS = [
  '规则引擎检查',
  'AI语法审查',
  'AI格式审查',
  'AI文字校对',
  '自定义要点审查',
  '结果汇总去重',
];

async function sgFetchLog(forceRender) {
  if (!_sgLogRecordId) {
    var box = document.getElementById('sg-log-content');
    if (box) box.innerHTML = '<div style="padding:16px;color:#ef4444;text-align:center">未找到审查记录ID</div>';
    if (_sgLogTimer) { clearInterval(_sgLogTimer); _sgLogTimer = null; }
    return;
  }
  var box = document.getElementById('sg-log-content');
  if (!box) return;
  try {
    var resp = await fetch('/api/history/' + _sgLogRecordId + '/progress');
    if (handleAuthExpired(resp)) {
      if (_sgLogTimer) { clearInterval(_sgLogTimer); _sgLogTimer = null; }
      box.innerHTML = '<div style="padding:16px;color:#ef4444;text-align:center">登录已过期，请刷新页面重新登录</div>';
      return;
    }
    if (resp.status === 404) {
      if (_sgLogTimer) { clearInterval(_sgLogTimer); _sgLogTimer = null; }
      box.innerHTML = '<div style="padding:16px;color:#ef4444;text-align:center">审查记录不存在（可能已被清理）</div>';
      return;
    }
    if (!resp.ok) {
      if (_sgLogTimer) { clearInterval(_sgLogTimer); _sgLogTimer = null; }
      box.innerHTML = '<div style="padding:16px;color:#ef4444;text-align:center">加载失败（HTTP ' + resp.status + '），请稍后重试</div>';
      return;
    }
    var respData = await resp.json();
    var item = respData.item || {};
    sgRenderLogFromItem(item, !!forceRender);
    if (item.status === 'done' || item.status === 'error' || item.status === 'cancelled') {
      sgStopLog();
    }
  } catch (e) {
    if (_sgLogTimer) { clearInterval(_sgLogTimer); _sgLogTimer = null; }
    box.innerHTML = '<div style="padding:16px;color:#ef4444;text-align:center">加载失败：' + escapeHtml(e.message || '网络错误或服务器异常') + '</div>';
  }
}

function sgToggleFocus() {
  const box = document.getElementById('sg-ai-focus-box');
  const btn = document.getElementById('sg-focus-toggle');
  if (!box || !btn) return;
  const hidden = box.classList.toggle('hidden');
  btn.innerHTML = hidden ? iconText('plus', '添加自定义审查要点') : iconText('minus', '收起自定义审查要点');
}

async function sgRun() {
  if (!state.sgFile) { showToast('请先选择文档', 'warn'); return; }
  if (state.sgRunningRecordId || ReviewTaskManager.tasks.single) {
    showToast('审查任务正在进行中，请等待完成', 'warn');
    return;
  }
  state.sgLastError = null;
  state.sgIssuesPreview = false;
  state.sgExpandedIssueId = null;
  state.sgPartialUiLockUntil = 0;
  state.sgLastPartialCount = 0;
  resetReviewStatBar('sg');
  var sgExportBtn = document.getElementById('sg-export-btn');
  if (sgExportBtn) sgExportBtn.style.display = 'none';
  setSgRunBtn(true);
  revealSgLogBtn();
  try {
    sgSetState('处理中...');

    const progressEl = document.getElementById('sg-report-progress');
    const listEl     = document.getElementById('sg-report-list');
    if (progressEl) progressEl.classList.remove('hidden');
    if (listEl) {
      var sgInitialSteps = _SG_STEP_LABELS.map(function(name) { return { name: name, status: 'pending' }; });
      sgEnsureReportLayout();
      sgRenderInlineProgress(sgInitialSteps, 'running');
    }

    sgAddReviewBanner();

    const focus = buildReviewFocus('sg-ai-focus');
    const form = new FormData();
    form.append('file', state.sgFile);
    form.append('rules', JSON.stringify(ALL_RULES));
    form.append('aiMode', 'true');
    form.append('reviewFocus', focus);

    const resp = await fetch('/api/check/single', { method: 'POST', body: form });
    if (handleAuthExpired(resp)) return;

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      sgSetState('校对失败：' + (err.detail || resp.status));
      if (listEl) listEl.innerHTML = errorHintHtml('校对失败：' + (err.detail || resp.status));
      return;
    }
    const initData = await resp.json();
    var recordId = initData.recordId;

    setSgRunBtn(true);
    revealSgLogBtn();
    var sgCancelBtn = document.getElementById('sg-cancel-btn');
    if (sgCancelBtn) {
      sgCancelBtn.classList.remove('hidden');
      sgCancelBtn.onclick = function() { sgCancelReview(recordId); };
    }

    ReviewTaskManager.start('single', recordId, state.sgFile ? state.sgFile.name : '');
    sgSetState('审查中，可在其他页面继续浏览…');
    var sgLogOl = document.getElementById('sg-log-overlay');
    if (sgLogOl && !sgLogOl.classList.contains('hidden') && !_sgLogRecordId) {
      sgShowLog(recordId);
    }
  } catch(e) {
    sgSetState('校对失败：' + (e.message || e));
    showToast('校对失败: ' + (e.message || e), 'error');
  } finally {
    if (!state.sgRunningRecordId) {
      setSgRunBtn(false);
      sgRemoveReviewBanner();
      hideSgLogBtnIfIdle();
    }
  }
}

function renderMammothWithAnchors(mammothHtml, prefix, activeParaIdx, onClickName) {
  var wrap = document.createElement('div');
  wrap.innerHTML = mammothHtml || '';
  var paraCounter = 0;
  wrap.querySelectorAll('p, h1, h2, h3, h4, h5, h6, li').forEach(function(el) {
    if (!el.textContent || !el.textContent.trim()) return;
    el.classList.add('doc-para');
    el.id = prefix + paraCounter;
    if (paraCounter === activeParaIdx) el.classList.add('active');
    if (onClickName) el.setAttribute('onclick', onClickName + '(null,' + paraCounter + ')');
    paraCounter++;
  });
  return wrap.innerHTML;
}

function sgRenderDocView(text, tables, images, activeParaIdx, content, mammothHtml, opts) {
  opts = opts || {};
  const view = document.getElementById('sg-doc-view');
  if (!view) return;

  var viewMode = opts.viewMode || state.sgViewMode || 'preview';
  var hasContent = content && content.length;
  if (hasContent) {
    if (opts.forceContent) viewMode = 'positioning';
    state.sgViewMode = viewMode;
    updateDocModeBanner('sg', viewMode);
    view.innerHTML = wrapDocPage(buildContentHtml(content, activeParaIdx, 'sg-para-', null, {
      addParaIds: true,
      anchorParagraphs: viewMode === 'positioning'
    }));
    scheduleMathJaxTypeset(view);
    if (activeParaIdx >= 0) sgHighlightParagraph(activeParaIdx);
    return;
  }

  state.sgViewMode = 'preview';
  updateDocModeBanner('sg', 'preview');

  if (mammothHtml) {
    view.innerHTML = wrapDocPage(renderMammothWithAnchors(mammothHtml, 'sg-para-', activeParaIdx, null));
    if (activeParaIdx >= 0) sgHighlightParagraph(activeParaIdx);
    return;
  }

  if ((!text || !text.trim())) {
    view.innerHTML = wrapDocPage('<div class="hint" style="text-align:center;padding:60px 0;">文档内容为空</div>');
    return;
  }

  let html = '';
  if (images && images.length > 0) {
    images.forEach(function(img, idx) {
      html += '<div style="text-align:center;margin:16px 0;">'
        + '<img src="' + img.data + '" alt="文档图片 ' + (idx + 1) + '" style="max-width:100%;max-height:400px;border:1px solid var(--ant-color-border-secondary);border-radius:8px;">'
        + '</div>';
    });
  }
  var paras = text.split(/\n{2,}/g).map(function(p) { return p.trim(); }).filter(Boolean);
  if (!paras.length) {
    paras = text.split('\n').map(function(p) { return p.trim(); }).filter(Boolean);
  }
  paras.forEach(function(p, idx) {
    var isActive = idx === activeParaIdx;
    html += '<p class="doc-para' + (isActive ? ' active' : '') + '" id="sg-para-' + idx + '">' + escapeHtml(p) + '</p>';
  });
  view.innerHTML = wrapDocPage(html);
  if (activeParaIdx >= 0) sgHighlightParagraph(activeParaIdx);
}

function sgHighlightParagraph(paraIdx) {
  var container = document.getElementById('sg-doc-view');
  if (!container) return;
  container.querySelectorAll('.doc-para, .doc-caption').forEach(function(el) {
    el.classList.remove('active');
  });
  var target = document.getElementById('sg-para-' + paraIdx);
  if (target) {
    target.classList.add('active');
    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

var _SIMILAR_ISSUE_THRESHOLD = 7;
var _RE_SUGGESTION_PAIR = /建议将["\u201c\u2018'](.+?)["\u201d\u2019']改为["\u201c\u2018'](.+?)["\u201d\u2019']/;

function _normalizeForDedup(s) {
  return (s || '').replace(/[\s\u3000]+/g, '')
    .replace(/[，。！？；：\u201c\u201d\u2018\u2019【】《》（）()\[\]{}]/g, '')
    .toLowerCase();
}

function _detectModificationPattern(orig, mod) {
  var o = _normalizeForDedup(orig || '');
  var m = _normalizeForDedup(mod || '');
  if (!o || !m) return '';
  // （N）列表项 → 十进制章节号.N（如 (16)→3.1.6.16），仅序号位不同、正文相同结构
  if (/^[（(]\d+[)）]/.test(o) && /^\d+(?:\.\d+)+\.?\d*/.test(m)) {
    return 'paren-list-to-decimal-section';
  }
  // 仅数字不同、其余一致的替换（如多处相同错别字/格式）
  if (o.replace(/\d+/g, '#') === m.replace(/\d+/g, '#')) {
    return 'num-var|' + o.replace(/\d+/g, '#').slice(0, 60);
  }
  return '';
}

function _extractSimilarityKey(issue) {
  var title = (issue.title || issue.category || '').trim();
  var suggestion = issue.suggestion || '';
  var m = _RE_SUGGESTION_PAIR.exec(suggestion);
  if (m) {
    var pattern = _detectModificationPattern(m[1], m[2]);
    if (pattern) {
      return title + '|' + pattern;
    }
    return title + '|' + _normalizeForDedup(m[1]) + '|' + _normalizeForDedup(m[2]);
  }
  var snippet = issue.snippet || issue.docParagraphText || '';
  return title + '|' + _normalizeForDedup(snippet).slice(0, 80);
}

function buildSimilarIssueGroups(issues) {
  var groups = {};
  issues.forEach(function(issue) {
    var key = _extractSimilarityKey(issue);
    if (!groups[key]) {
      groups[key] = { key: key, issues: [] };
    }
    groups[key].issues.push(issue);
  });
  return groups;
}

function renderSimilarIssuesBar(groupKey, restCount, isExpanded) {
  var toggleText = isExpanded ? '收起 ▲' : '详细 ▼';
  var safeKey = String(groupKey).replace(/'/g, "\\'");
  return '<div class="similar-issues-bar" onclick="event.stopPropagation(); sgToggleSimilarGroup(\'' + safeKey + '\')">'
    + '<span class="similar-bar-text">'
    + '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'
    + '全文还检测到类似此问题 ' + restCount + ' 处'
    + '</span>'
    + '<span class="similar-bar-toggle">' + toggleText + '</span>'
    + '</div>';
}

function _getExpandedIdForSg() {
  if (state.sgExpandedIssueId) return state.sgExpandedIssueId;
  var selector = state.sgIssuesPreview
    ? '#sg-partial-issues-container .sg-issue-item'
    : '#sg-report-list .sg-issue-item';
  var allItems = document.querySelectorAll(selector);
  var expandedId = null;
  allItems.forEach(function(el) {
    if (el.classList.contains('expanded')) {
      var match = el.getAttribute('onclick').match(/'([^']+)'/);
      if (match) expandedId = match[1];
    }
  });
  return expandedId;
}

function sgRenderIssueList(issues, expandedId, targetId) {
  targetId = targetId || sgIssueListTargetId();
  const listEl = document.getElementById(targetId);
  if (!listEl) return;
  var scrollHost = _getIssueListScrollHost(targetId);
  var scrollTop = scrollHost ? scrollHost.scrollTop : 0;
  if (!issues || !issues.length) {
    listEl.innerHTML = '<div class="sg-empty-hint" style="display:flex;align-items:center;justify-content:center;gap:6px;">未发现问题 ' + icon('check', 'ui-icon-sm') + '</div>';
    return;
  }
  const sevOrder = { high: 0, medium: 1, low: 2 };
  const sortedIssues = [...issues].sort((a, b) => {
    const sevA = sevOrder[a.severity] ?? 3;
    const sevB = sevOrder[b.severity] ?? 3;
    if (sevA !== sevB) return sevA - sevB;
    const idxA = a.docParagraphIndex ?? 9999;
    const idxB = b.docParagraphIndex ?? 9999;
    return idxA - idxB;
  });

  var groups = buildSimilarIssueGroups(sortedIssues);
  var renderedGroupKeys = {};
  var numCounter = 0;
  var html = '';

  sortedIssues.forEach(function(issue) {
    var key = _extractSimilarityKey(issue);
    var group = groups[key];

    if (group.issues.length < _SIMILAR_ISSUE_THRESHOLD) {
      numCounter++;
      html += _sgRenderOneIssueCard(issue, numCounter, issue.id === expandedId);
    } else {
      if (renderedGroupKeys[key]) return;
      renderedGroupKeys[key] = true;
      numCounter++;
      html += _sgRenderOneIssueCard(issue, numCounter, issue.id === expandedId);
      var restCount = group.issues.length - 1;
      var isGroupExpanded = state.sgExpandedSimilarGroups && state.sgExpandedSimilarGroups[key];
      html += renderSimilarIssuesBar(key, restCount, isGroupExpanded);
      if (isGroupExpanded) {
        for (var i = 1; i < group.issues.length; i++) {
          numCounter++;
          html += _sgRenderOneIssueCard(group.issues[i], numCounter, false);
        }
      }
    }
  });

  listEl.innerHTML = html;
  if (scrollHost) scrollHost.scrollTop = scrollTop;
}

function _sgRenderOneIssueCard(issue, index, isExpanded) {
  var srcCls = 'tag-neutral';
  var sevMap = { high: ['tag-high', '高风险'], low: ['tag-low', '低风险'] };
  var sevKey = normalizeSeverity(issue.severity);
  var sevArr = sevMap[sevKey] || sevMap['low'];
  var sevCls = sevArr[0];
  var sevLabel = sevArr[1];
  var hasEvidences = Array.isArray(issue.evidences) && issue.evidences.length > 0;
  var evidHtml = hasEvidences
    ? '<div style="margin-top:8px;"><b style="font-size:12px;color:#1e293b;">参考依据：</b>' +
        issue.evidences.map(function(ev) {
          var refName = escapeHtml(ev.refName || '');
          var refQuote = escapeHtml(ev.refQuote || '');
          return '<div class="evidence-block"><b>' + refName + '：</b>' + refQuote + '</div>';
        }).join('') + '</div>'
    : '';
  var tripleHtml = buildIssueTripleHtml(issue);
  var detailHtml = isExpanded ? '<div class="sg-issue-detail">' +
    tripleHtml + evidHtml + buildFeedbackBarHtml(issue, 'sg') + '</div>' : '';
  var resolvedParaIdx = sgResolveParagraphIndex(issue);
  var paraNum = resolvedParaIdx >= 0 ? resolvedParaIdx + 1 : '';
  var paraLocHtml = paraNum ? '<span class="sg-issue-loc">段落 ' + paraNum + '</span>' : '';
  var categoryLabel = escapeHtml(issue.category || issue.title || issue.source || '');
  var issueId = String(issue.id || '').replace(/'/g, "\\'");
  var feedbackStatus = getIssueFeedback(issue).status;
  var feedbackCls = feedbackStatus === 'accepted' ? ' feedback-accepted' : (feedbackStatus === 'rejected' ? ' feedback-rejected' : '');
  return '<div class="sg-issue-item' + (isExpanded ? ' expanded' : '') + feedbackCls + '" data-severity="' + (issue.severity || 'low') + '" data-feedback="' + (feedbackStatus || '') + '" onclick="sgToggleIssue(\'' + issueId + '\')">' +
    '<div class="sg-issue-header">' +
    '<span class="sg-issue-num">' + index + '</span>' +
    '<span class="' + srcCls + '">' + escapeHtml(issue.source || '') + '</span>' +
    '<span class="tag ' + sevCls + '">' + sevLabel + '</span>' +
    '<span class="sg-issue-title">' + categoryLabel + '</span>' +
    paraLocHtml +
    '</div>' +
    detailHtml +
    '</div>';
}

function sgToggleSimilarGroup(groupKey) {
  if (!state.sgExpandedSimilarGroups) state.sgExpandedSimilarGroups = {};
  state.sgExpandedSimilarGroups[groupKey] = !state.sgExpandedSimilarGroups[groupKey];
  sgRenderIssueList(sgGetFilteredIssues(), _getExpandedIdForSg(), sgIssueListTargetId());
}

function buildInlineProgressHtml(steps, status) {
  var html = '<div class="sg-progress-panel">';
  html += '<div class="sg-progress-header"><span class="sg-progress-title">' + icon('clipboard', 'ui-icon-sm') + ' 审查进度</span>';
  if (status === 'cancelled') {
    html += '<span class="sg-progress-status" style="color:var(--ant-color-error);">已终止</span>';
  } else if (status === 'error') {
    html += '<span class="sg-progress-status" style="color:var(--ant-color-error);">失败</span>';
  } else {
    var doneCount = steps.filter(function(s){return s.status==='done';}).length;
    html += '<span class="sg-progress-status">' + doneCount + '/' + steps.length + '</span>';
  }
  html += '</div>';
  for (var i = 0; i < steps.length; i++) {
    var s = steps[i];
    var cls = 'pending';
    if (s.status === 'done') cls = 'done';
    else if (s.status === 'running') cls = 'running';
    else if (s.status === 'error') cls = 'error';
    else if (s.status === 'cancelled') cls = 'cancelled';
    var label = s.name || ('步骤' + (i + 1));
    var detailParts = [];
    if (s.status === 'done') {
      if (s.issues !== undefined && s.issues !== null) detailParts.push('检出 ' + s.issues + ' 条');
      if (s.elapsed_ms !== undefined && s.elapsed_ms !== null) detailParts.push((s.elapsed_ms / 1000).toFixed(1) + 's');
    } else if (s.status === 'running') {
      detailParts.push('进行中...');
    } else if (s.status === 'error') {
      detailParts.push('失败' + (s.error ? ': ' + escapeHtml(String(s.error)) : ''));
    }
    html += '<div class="sg-progress-step ' + cls + '">'
      + '<span class="step-icon">' + statusIcon(s.status || 'pending') + '</span>'
      + '<div class="step-info">'
      + '<span class="step-name">' + escapeHtml(label) + '</span>'
      + '<span class="step-detail">' + detailParts.join(' · ') + '</span>'
      + '</div></div>';
  }
  html += '</div>';
  return html;
}

function sgRenderInlineProgress(steps, status) {
  sgEnsureReportLayout();
  var progressEl = document.getElementById('sg-inline-progress');
  if (progressEl) {
    progressEl.innerHTML = buildInlineProgressHtml(steps, status);
    return;
  }
  var listEl = document.getElementById('sg-report-list');
  if (listEl) listEl.innerHTML = buildInlineProgressHtml(steps, status);
}

function mtRenderInlineProgress(steps, status) {
  mtEnsureReportLayout();
  var progressEl = document.getElementById('mt-inline-progress');
  if (progressEl) {
    progressEl.innerHTML = buildInlineProgressHtml(steps, status);
    return;
  }
  var box = document.getElementById('mt-report');
  if (box) box.innerHTML = buildInlineProgressHtml(steps, status);
}

function mtRenderPartialIssueList(issues) {
  var container = document.getElementById('mt-partial-issues-container');
  if (!container) return;
  var scrollHost = _getIssueListScrollHost('mt-partial-issues-container');
  var scrollTop = scrollHost ? scrollHost.scrollTop : 0;
  if (!issues || !issues.length) {
    container.innerHTML = '';
    return;
  }
  var sevOrder = { high: 0, medium: 1, low: 2 };
  var sortedIssues = issues.slice().sort(function(a, b) {
    var sevA = sevOrder[a.severity] ?? 3;
    var sevB = sevOrder[b.severity] ?? 3;
    if (sevA !== sevB) return sevA - sevB;
    return (a.docParagraphIndex ?? 9999) - (b.docParagraphIndex ?? 9999);
  });
  var html = '';
  var numCounter = 0;
  sortedIssues.forEach(function(issue) {
    numCounter++;
    html += _mtRenderOneIssueCard(issue, numCounter);
  });
  container.innerHTML = html;
  if (scrollHost) scrollHost.scrollTop = scrollTop;
}

function sgAddReviewBanner() {
  if (document.getElementById('sg-doc-review-banner')) return;
  var banner = document.createElement('div');
  banner.id = 'sg-doc-review-banner';
  banner.className = 'sg-doc-review-banner';
  banner.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-width:2px;"></div> AI审查进行中，请耐心等待...';
  var docViewWrap = document.getElementById('sg-doc-view-wrap');
  if (docViewWrap) docViewWrap.insertBefore(banner, docViewWrap.firstChild);
}

function sgRemoveReviewBanner() {
  var banner = document.getElementById('sg-doc-review-banner');
  if (banner) banner.remove();
}

function mtAddReviewBanner() {
  if (document.getElementById('mt-doc-review-banner')) return;
  var banner = document.createElement('div');

function sgToggleIssue(id) {
  const filtered = sgGetFilteredIssues();
  const clickedIssue = filtered.find(x => x.id === id);
  if (!clickedIssue) return;
  var newExpandedId = state.sgExpandedIssueId === id ? null : id;
  state.sgExpandedIssueId = newExpandedId;
  if (newExpandedId) {
    state.sgPartialUiLockUntil = Date.now() + 8000;
  } else {
    state.sgPartialUiLockUntil = 0;
  }
  sgRenderIssueList(filtered, newExpandedId, sgIssueListTargetId());

  if (newExpandedId) {
    var issue = (state.sgAllIssues || []).find(function(x) { return x.id === id; });
    if (issue) {
      var paraIdx = sgResolveParagraphIndex(issue);
      if (paraIdx < 0 && issue.position !== undefined && issue.position >= 0) {
        var docText = state.sgDocText || state.sgFileText || '';
        var paras = docText.split(/\n{2,}/g).filter(Boolean);
        var charCount = 0;
        for (var i = 0; i < paras.length; i++) {
          charCount += paras[i].length + 2;
          if (charCount > issue.position) {
            paraIdx = i;
            break;
          }
        }
      }
      if (paraIdx >= 0) {
        if (state.sgContent && state.sgContent.length) {
          sgRenderDocView(state.sgDocText, state.sgTables, state.sgImages, paraIdx, state.sgContent, null, { forceContent: true });
        } else {
          sgHighlightParagraph(paraIdx);
        }
        var term = getIssueSourceTerm(issue, paraIdx, state.sgContent);
        if (!term && issue.snippet) term = String(issue.snippet).trim().slice(0, 80);
        var paraEl = document.getElementById('sg-para-' + paraIdx);
        var domPreview = paraEl ? (paraEl.textContent || '').slice(0, 80) : '';
        var uiParaCount = document.querySelectorAll('#sg-doc-view .doc-para, #sg-doc-view .doc-caption').length;
        // region agent log
        agentDebugLog('index.html:sgToggleIssue', 'issue_click_highlight', {
          issueId: issue.id,
          backendIdx: issue.docParagraphIndex,
          paraIdx: paraIdx,
          idxRemapped: issue.docParagraphIndex >= 0 && paraIdx !== issue.docParagraphIndex,
          uiParaCount: uiParaCount,
          idxBeyondUi: paraIdx >= uiParaCount,
          viewMode: state.sgViewMode,
          snippetLen: String(issue.snippet || '').trim().length,
          term: (term || '').slice(0, 60),
          docParaPreview: String(issue.docParagraphText || '').slice(0, 80),
          domParaPreview: domPreview,
          textMatch: domPreview && issue.docParagraphText
            ? domPreview.indexOf(String(issue.docParagraphText).slice(0, 20)) >= 0
            : null
        }, paraIdx >= uiParaCount ? 'A' : (issue.docParagraphIndex >= 0 && paraIdx !== issue.docParagraphIndex ? 'B' : (domPreview && issue.docParagraphText && domPreview.indexOf(String(issue.docParagraphText).slice(0, 20)) < 0 ? 'D' : 'E')));
        // endregion
        if (term) {
          scheduleIssueTermHighlight('sg-doc-view', paraIdx, term, { anchorOnly: true });
        }
      }
    }
  } else {
    state.sgPartialUiLockUntil = 0;
    document.querySelectorAll('#sg-doc-view .doc-para').forEach(function(el) {
      el.classList.remove('active');
    });
  }
}

function sgGetFilteredIssues() {
  const mode = state.sgFilterMode || 'all';
  const all = state.sgAllIssues || [];
  if (mode === 'all') return all;
  if (mode === 'high') return all.filter(x => x.severity === 'high');
  if (mode === 'low') return all.filter(x => x.severity === 'low' || x.severity === 'medium');
  if (mode === 'accepted') return all.filter(x => (getIssueFeedback(x) || {}).status === 'accepted');
  if (mode === 'rejected') return all.filter(x => (getIssueFeedback(x) || {}).status === 'rejected');
  return all.filter(x => x.severity === mode);
}

function sgFilterReport(mode) {
  state.sgFilterMode = mode;
  state.sgExpandedSimilarGroups = {};
  ['all','high','low','accepted','rejected'].forEach(f => {
    const pill = document.getElementById('sg-pill-' + f);
    if (pill) pill.classList.toggle('active', f === mode);

  sgRenderIssueList(sgGetFilteredIssues(), state.sgExpandedIssueId, sgIssueListTargetId());
}

function mtTemplateChange(input) {
  var file = input.files[0];
  if (!file) return;
  var ext = file.name.split('.').pop().toLowerCase();

    alert('模板文件只支持 DOC、DOCX 或 PDF 格式');
    input.value = '';
    return;
  }
  _mtTempTemplateFile = file;
  _mtRenderTemplateInOverlay();
}

function mtOtherRefsChange(input) {
  var files = Array.from(input.files);
  var allowedExts = ['txt', 'doc', 'docx', 'pdf'];
  for (var i = 0; i < files.length; i++) {
    var ext = files[i].name.split('.').pop().toLowerCase();
    if (!allowedExts.includes(ext)) {
      alert('不支持的文件格式: ' + files[i].name + '，请上传 TXT、DOC、DOCX 或 PDF 文件');

  if (state.sgFile) {
    var el = document.getElementById('sg-filename');
    if (el) el.textContent = state.sgFile.name;
    var clearBtn = document.getElementById('sg-clear-btn');
    if (clearBtn) clearBtn.classList.remove('hidden');
  }

  if (state.sgRunningRecordId) {
    setSgRunBtn(true);
    var logBtn = document.getElementById('sg-log-btn');
    if (logBtn) { logBtn.classList.remove('hidden'); }
    var cancelBtn = document.getElementById('sg-cancel-btn');
    if (cancelBtn) { cancelBtn.classList.remove('hidden'); cancelBtn.onclick = function() { sgCancelReview(state.sgRunningRecordId); }; }
    var progressEl = document.getElementById('sg-report-progress');
    if (progressEl) progressEl.classList.remove('hidden');
    var listEl = document.getElementById('sg-report-list');
    if (listEl) listEl.innerHTML = '<div class="sg-empty-hint">加载进度中...</div>';
    if (state.sgContent && state.sgContent.length) {
      sgRenderDocView(state.sgDocText || '', state.sgTables || [], state.sgImages || [], -1, state.sgContent, null, { forceContent: true });
    } else if (state.sgMammothHtml) {
      state.sgViewMode = 'preview';
      sgRenderDocView('', [], [], -1, [], state.sgMammothHtml);
    } else {
      sgRenderDocView(state.sgDocText || state.sgFileText || '', state.sgTables || [], state.sgImages || [], -1, state.sgContent || [], null);
    }
    sgAddReviewBanner();
    resetReviewStatBar('sg');
    var sgExportBtnRestore = document.getElementById('sg-export-btn');
    if (sgExportBtnRestore) sgExportBtnRestore.style.display = 'none';
    sgSetState('审查中...');
    ReviewTaskManager.ensurePolling();
    if (ReviewTaskManager.tasks.single) {
      ReviewTaskManager.pollOne('single');
    }
    return;
  }

  if (state.sgLastError) {
    setSgRunBtn(false);
    var errListEl = document.getElementById('sg-report-list');
    sgSetState('校对失败：' + state.sgLastError);
    if (errListEl) {
      errListEl.innerHTML = errorHintHtml('校对失败：' + state.sgLastError);

      var errLogBtn = document.getElementById('sg-log-btn');
      if (errLogBtn) errLogBtn.classList.remove('hidden');
    }
    if (state.sgFile) {
      state.sgViewMode = 'preview';
      if (state.sgMammothHtml) {
        sgRenderDocView('', [], [], -1, [], state.sgMammothHtml);
      } else if (state.sgFileText) {
        sgRenderDocView(state.sgFileText, [], [], -1, [], null);
      }
    }
    wsRenderTree('sg');
    return;
  }

  if (state.sgAllIssues && state.sgAllIssues.length > 0) {
    sgUpdateFilterCounts(state.sgAllIssues);
    ['all','high','low','accepted','rejected'].forEach(function(f) {
      var pill = document.getElementById('sg-pill-' + f);
      if (pill) pill.classList.toggle('active', f === state.sgFilterMode);
    });
    sgRenderIssueList(state.sgAllIssues, null);
    state.sgViewMode = 'positioning';
    sgRenderDocView(state.sgDocText || state.sgFileText || '', state.sgTables || [], state.sgImages || [], -1, state.sgContent || [], null, { forceContent: !!(state.sgContent && state.sgContent.length) });
    sgSetState('校对完成，共发现 ' + state.sgAllIssues.length + ' 处问题');
    var exportBtn = document.getElementById('sg-export-btn');
    if (exportBtn) exportBtn.style.display = '';
    if (state.sgLastRecordId) {
      var sgLogBtn = document.getElementById('sg-log-btn');
      if (sgLogBtn) sgLogBtn.classList.remove('hidden');
    }
  } else if (state.sgFile) {
    state.sgViewMode = 'preview';
    if (state.sgMammothHtml) {
      sgRenderDocView('', [], [], -1, [], state.sgMammothHtml);
    } else if (state.sgFileText) {
      sgRenderDocView(state.sgFileText, [], [], -1, [], null);
    }
  }
  wsRenderTree('sg');
}
