<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>智慧家 AI · 家庭 AI 事务管家</title>
<link rel="icon" href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Crect width="64" height="64" rx="14" fill="%231c5f54"/%3E%3Cpath d="M13 29 32 14l19 15v22H13Z" fill="none" stroke="%23fff7df" stroke-width="4" stroke-linejoin="round"/%3E%3Cpath d="M26 28h16v20H26z" fill="%23fff7df"/%3E%3Cpath d="M30 34h8M30 40h6" stroke="%231c5f54" stroke-width="3" stroke-linecap="round"/%3E%3Cpath d="m40 22 5 5 9-10" fill="none" stroke="%23d9a441" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/%3E%3Ccircle cx="18" cy="48" r="5" fill="%23d9a441"/%3E%3C/svg%3E' />
<style>
  :root{
    /* 设计系统 - 字体 */
    --text-xs: 11px;
    --text-sm: 13px;
    --text-base: 14px;
    --text-lg: 16px;
    --text-xl: 20px;
    --text-2xl: 28px;

    /* 设计系统 - 间距 (4的倍数) */
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;
    --space-8: 32px;

    /* 设计系统 - 圆角 */
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --radius-xl: 16px;
    --radius-full: 999px;

    /* 设计系统 - 阴影 */
    --shadow-sm: 0 2px 8px rgba(18,33,29,.08);
    --shadow-md: 0 4px 16px rgba(18,33,29,.12);
    --shadow-lg: 0 8px 32px rgba(18,33,29,.18);

    /* 原有颜色系统 */
    --bg:#edf3f0;
    --surface:#fffdf8;
    --surface-2:#f7faf7;
    --surface-3:#edf4f1;
    --line:#dce5df;
    --line-strong:#b7c8bf;
    --ink:#17211f;
    --ink-soft:#5d6a66;
    --brand:#176b5d;
    --brand-deep:#0c3f37;
    --brand-soft:#e4f4ef;
    --brand-glow:rgba(23,107,93,.14);
    --gold:#d19a45;
    --gold-soft:#fff3d8;
    --blue:#4f7f9f;
    --blue-soft:#e8f1f6;
    --coral:#c96b5c;
    --coral-soft:#fff0eb;
    --ok:#2d865c;
    --ok-soft:#e6f5ec;
    --warn:#ad6726;
    --warn-soft:#fff1dc;
    --danger:#b94b43;
    --danger-soft:#fff0ed;
    --neutral:#5d6864;
    --neutral-soft:#edf1ee;
    --violet:#6b6488;
    --teal:#2f8075;
    --shadow:0 1px 2px rgba(18,33,29,.05),0 18px 42px rgba(18,33,29,.09);
    --shadow-lg:0 24px 76px rgba(18,33,29,.22);
    --ease:cubic-bezier(.2,.8,.2,1);
    --radius:8px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;overflow-x:hidden}
  body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,rgba(255,243,216,.58) 0%,rgba(255,243,216,0) 34%),linear-gradient(225deg,rgba(232,241,246,.74) 0%,rgba(232,241,246,0) 38%),linear-gradient(180deg,#fbfbf6 0%,var(--bg) 52%,#e5eee9 100%);color:var(--ink);font-size:var(--text-base);line-height:1.55;letter-spacing:0;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  button,input,textarea,select{font-family:inherit}
  button{cursor:pointer}
  input,textarea{outline:none}
  input::placeholder,textarea::placeholder{color:#8a9892}
  :where(button,[role="button"],a,input,textarea,select):focus-visible{outline:2px solid rgba(23,107,93,.36);outline-offset:2px}
  svg{display:block}

  /* 图标系统 - Apple级别的精致度 */
  [data-lucide]{
    stroke-width:2px;
    transition:all 0.24s var(--ease);
  }
  button:hover [data-lucide],
  a:hover [data-lucide],
  .nav-item:hover [data-lucide]{
    transform:translateY(-1px);
  }
  button:active [data-lucide],
  a:active [data-lucide],
  .nav-item:active [data-lucide]{
    transform:translateY(0);
  }
  .nav-item.active [data-lucide]{
    stroke-width:2.4px;
  }

  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#b9c8c0;border-radius:var(--radius-md)}
  ::-webkit-scrollbar-track{background:transparent}

  .app{display:flex;min-height:100vh;position:relative}
  .app-stage{flex:1;min-width:0;display:flex}
  .app-phone-shell{display:flex;flex:1;min-width:0}
  .app-phone-screen{position:relative;display:flex;flex:1;min-width:0;min-height:0;flex-direction:column}
  .app-sidebar-mask{display:none}
  .app-phone-hardware{display:none}
  .app-phone-status,.app-phone-status-end,.app-phone-signal,.app-phone-wifi,.app-phone-battery{display:flex;align-items:center}
  .app-phone-status{position:absolute;left:20px;right:20px;top:12px;z-index:48;justify-content:space-between;font-size:var(--text-xs);font-weight:850;color:#eef6f1;letter-spacing:0;text-shadow:0 1px 4px rgba(0,0,0,.28);pointer-events:none}
  .app-phone-status-end{gap:6px}
  .app-phone-signal{gap:2px;height:10px}
  .app-phone-signal i{display:block;width:3px;border-radius:var(--radius-full);background:currentColor;opacity:.92}
  .app-phone-signal i:nth-child(1){height:4px;align-self:flex-end}
  .app-phone-signal i:nth-child(2){height:6px;align-self:flex-end}
  .app-phone-signal i:nth-child(3){height:8px;align-self:flex-end}
  .app-phone-signal i:nth-child(4){height:10px;align-self:flex-end}
  .app-phone-wifi{position:relative;width:13px;height:10px;justify-content:center}
  .app-phone-wifi:before,.app-phone-wifi:after{content:"";position:absolute;border:1.8px solid currentColor;border-color:currentColor transparent transparent transparent;border-radius:50%}
  .app-phone-wifi:before{width:13px;height:13px;top:1px}
  .app-phone-wifi:after{width:7px;height:7px;top:4px}
  .app-phone-battery{position:relative;width:22px;height:11px;border:1.6px solid currentColor;border-radius:3px;padding:1px}
  .app-phone-battery:after{content:"";position:absolute;right:-3px;top:2px;width:2px;height:5px;border-radius:0 2px 2px 0;background:currentColor}
  .app-phone-battery b{display:block;flex:1;border-radius:1px;background:linear-gradient(90deg,#9bf0af,#e5ffef)}
  .app-phone-notch{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:132px;height:28px;border-radius:0 0 18px 18px;background:linear-gradient(180deg,#0c0f10,#1a1f1d 62%,#2a312d);box-shadow:0 8px 18px rgba(0,0,0,.34)}
  .app-phone-notch:before{content:"";position:absolute;left:50%;top:8px;transform:translateX(-50%);width:52px;height:7px;border-radius:var(--radius-full);background:rgba(91,106,101,.7)}
  .app-phone-notch:after{content:"";position:absolute;right:18px;top:8px;width:8px;height:8px;border-radius:var(--radius-full);background:radial-gradient(circle at 35% 35%,#3f626a 0%,#142228 55%,#050708 100%)}
  .sidebar{position:fixed;inset:0 auto 0 0;width:232px;background:linear-gradient(180deg,rgba(255,253,248,.97),rgba(248,252,249,.94));backdrop-filter:blur(18px);border-right:1px solid rgba(220,229,223,.9);z-index:42;display:flex;flex-direction:column;transition:transform .22s var(--ease);box-shadow:1px 0 0 rgba(18,33,29,.04)}
  .logo{padding:18px 16px 14px;display:flex;align-items:center;gap:11px}
  .logo-mark{width:36px;height:36px;border-radius:var(--radius-md);display:grid;place-items:center;background:linear-gradient(145deg,#f8e8bd,#e7f4ec 66%,#d9ecf3);border:1px solid rgba(209,154,69,.38);box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),0 10px 22px rgba(23,107,93,.08)}
  .brand-symbol{width:30px;height:30px}
  .logo-title{font-size:var(--text-lg);font-weight:850;letter-spacing:0;color:var(--brand-deep)}
  .logo-sub{font-size:var(--text-xs);color:var(--ink-soft);margin-top:1px;white-space:nowrap}
  .nav{padding:var(--space-2) 10px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
  .nav-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:10px 12px;border:1px solid transparent;background:none;color:#52635d;border-radius:var(--radius-md);font-size:var(--text-sm);font-weight:760;letter-spacing:0;transition:background-color .18s var(--ease),border-color .18s var(--ease),color .18s var(--ease),transform .18s var(--ease),box-shadow .18s var(--ease)}
  .nav-item:hover{background:rgba(255,255,255,.76);border-color:rgba(183,200,191,.72);color:var(--ink);transform:translateX(1px);box-shadow:0 8px 18px rgba(18,33,29,.05)}
  .nav-item.active{background:linear-gradient(90deg,var(--brand-soft),rgba(255,253,248,.95));border-color:rgba(23,107,93,.24);color:var(--brand-deep);box-shadow:inset 3px 0 0 var(--brand),0 10px 24px rgba(23,107,93,.08)}
  .nav-item .badge{margin-left:auto;background:#e1e7e2;color:#56635e;padding:1px 8px;border-radius:var(--radius-full);font-size:var(--text-xs);font-weight:850}
  .nav-item.active .badge{background:var(--brand);color:#fff}
  .sidebar-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .sidebar-links button{border:none;background:transparent;color:var(--brand-deep);font-size:var(--text-xs);font-weight:850;padding:2px 0;border-bottom:1px solid transparent;transition:color .18s var(--ease),border-color .18s var(--ease)}
  .sidebar-links button:hover{color:var(--brand);border-bottom-color:rgba(23,107,93,.34)}
  .sidebar-foot{margin-top:auto;padding:13px 16px;border-top:1px solid rgba(220,229,223,.9);font-size:var(--text-xs);color:var(--ink-soft);line-height:1.6;background:rgba(247,250,247,.72)}

  .main{flex:1;margin-left:232px;min-width:0;display:flex;flex-direction:column}
  .topbar{height:64px;background:rgba(255,253,248,.86);backdrop-filter:blur(18px);border-bottom:1px solid rgba(220,229,223,.86);display:flex;align-items:center;gap:14px;padding:0 22px;position:sticky;top:0;z-index:32;box-shadow:0 1px 0 rgba(255,255,255,.7),0 12px 30px rgba(18,33,29,.04)}
  .menu-toggle{display:none;border:none;background:none;font-size:var(--text-xl);color:var(--neutral)}
  .page-title{font-size:var(--text-xl);font-weight:850;letter-spacing:0}
  .page-sub{font-size:var(--text-xs);color:var(--ink-soft)}
  .search-global{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:310px;max-width:42vw;background:rgba(255,255,255,.88);border:1px solid rgba(220,229,223,.96);padding:7px 12px;border-radius:var(--radius-md);transition:border-color .18s var(--ease),box-shadow .18s var(--ease),background-color .18s var(--ease)}
  .search-global[hidden]{display:none}
  .search-global:focus-within{background:#fff;border-color:rgba(23,107,93,.42);box-shadow:0 0 0 3px rgba(23,107,93,.09),0 14px 34px rgba(18,33,29,.08)}
  .search-global input{border:none;background:transparent;flex:1;min-width:0;font-size:var(--text-sm);color:var(--ink)}
  .search-global .prefix{font-size:var(--text-xs);color:var(--ink-soft);font-weight:700}
  .top-pending-action{flex-shrink:0;white-space:nowrap}
  .top-pending-action[hidden]{display:none}
  .privacy-toggle{display:flex;align-items:center;gap:8px;font-size:var(--text-xs);color:var(--ink-soft);white-space:nowrap;user-select:none}
  .privacy-toggle[hidden]{display:none}
  .privacy-toggle input{appearance:none;width:34px;height:20px;border-radius:var(--radius-full);background:#d9e1dc;border:1px solid #c3d0c8;position:relative;transition:.18s var(--ease)}
  .privacy-toggle input:before{content:"";position:absolute;width:16px;height:16px;left:1px;top:1px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.18);transition:.16s}
  .privacy-toggle input:checked{background:linear-gradient(90deg,var(--brand),#2b8b78);border-color:var(--brand)}
  .privacy-toggle input:checked:before{transform:translateX(14px)}
  .content{padding:var(--space-5);max-width:1680px;width:100%;margin:0 auto;overflow-y:auto;min-height:calc(100vh - 64px);padding-bottom:80px}
  .content.full-screen{padding:0;overflow:hidden;height:calc(100vh - 64px);max-width:none}
  .content.dashboard-screen{padding:0;max-width:none;overflow-y:auto}

  .card{background:rgba(255,253,248,.94);border:1px solid rgba(220,229,223,.96);border-radius:var(--radius);box-shadow:var(--shadow);transition:border-color .18s var(--ease),box-shadow .18s var(--ease),background-color .18s var(--ease)}
  .card-h{padding:14px 16px;border-bottom:1px solid rgba(220,229,223,.88);display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:linear-gradient(180deg,rgba(255,253,248,.96),rgba(247,250,247,.9))}
  .card-h .t{font-size:var(--text-base);font-weight:850;letter-spacing:0}
  .card-h .sub{font-size:var(--text-xs);color:var(--ink-soft)}
  .card-b{padding:14px 16px}
  .grid{display:grid;gap:14px}
  .g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .span-2{grid-column:span 2}
  .span-3{grid-column:span 3}

  .btn{min-height:36px;border:1px solid transparent;border-radius:var(--radius-md);padding:var(--space-2) 14px;font-size:var(--text-sm);font-weight:780;letter-spacing:0;transition:background-color .18s var(--ease),border-color .18s var(--ease),box-shadow .18s var(--ease),transform .18s var(--ease),color .18s var(--ease);display:inline-flex;align-items:center;justify-content:center;gap:6px;background:#fff;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.72)}
  .btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(18,33,29,.1)}
  .btn:active{transform:translateY(0);box-shadow:none}
  .btn-primary{background:linear-gradient(180deg,#1d7868,var(--brand));color:#fff;box-shadow:0 10px 24px rgba(23,107,93,.2),inset 0 1px 0 rgba(255,255,255,.18)}
  .btn-primary:hover{background:linear-gradient(180deg,#1b6f61,var(--brand-deep))}
  .btn-outline{border-color:rgba(220,229,223,.96);color:var(--ink);background:rgba(255,255,255,.9)}
  .btn-outline:hover{border-color:rgba(23,107,93,.42);color:var(--brand-deep);background:#fbfffd}
  .btn-soft{background:linear-gradient(180deg,#effaf6,var(--brand-soft));color:var(--brand-deep);border-color:rgba(26,92,82,.16)}
  .btn-danger{background:linear-gradient(180deg,#c85d54,var(--danger));color:#fff;box-shadow:0 10px 22px rgba(185,75,67,.16)}
  .btn-sm{min-height:30px;padding:6px 10px;font-size:var(--text-xs)}
  .btn-block{width:100%}
  .btn-icon{width:32px;height:32px;padding:0}
  .btn:disabled{opacity:.52;cursor:not-allowed;transform:none;box-shadow:none}
  .tag{min-height:22px;display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:var(--radius-full);border:1px solid transparent;font-size:var(--text-xs);font-weight:850;letter-spacing:0;white-space:nowrap}
  .tag.brand{background:var(--brand-soft);border-color:rgba(23,107,93,.14);color:var(--brand-deep)}
  .tag.ok{background:var(--ok-soft);border-color:rgba(45,134,92,.14);color:var(--ok)}
  .tag.warn{background:var(--warn-soft);border-color:rgba(173,103,38,.16);color:var(--warn)}
  .tag.danger{background:var(--danger-soft);border-color:rgba(185,75,67,.16);color:var(--danger)}
  .tag.gray{background:var(--neutral-soft);border-color:rgba(93,104,100,.12);color:var(--neutral)}
  .tag.fail{background:#fff1f2;border-color:rgba(180,35,54,.14);color:#b42336}
  .muted{color:var(--ink-soft)}

  /* 低置信度档案样式 */
  .archive-low-confidence{border-color:rgba(173,103,38,.32) !important;background:linear-gradient(180deg,#fffbf2,#fff) !important;position:relative}
  .archive-low-confidence:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--warn),#d9a441);border-radius:var(--radius-md) 0 0 8px}
  .confidence-alert{display:flex;align-items:center;gap:8px;padding:var(--space-2) 10px;margin-bottom:10px;border-radius:var(--radius-sm);background:rgba(255,241,220,.72);border:1px solid rgba(173,103,38,.24)}
  .confidence-alert .icon{font-size:var(--text-lg);line-height:1}
  .confidence-alert strong{font-size:var(--text-xs);color:var(--warn);line-height:1.5}
  .missing-fields{margin-top:8px;padding:10px;border-radius:var(--radius-sm);background:rgba(255,255,255,.9);border:1px solid rgba(220,229,223,.9)}
  .missing-fields h4{margin:0 0 6px;font-size:var(--text-xs);font-weight:800;color:var(--ink)}
  .missing-fields ul{margin:0;padding:0 0 0 18px;list-style:disc}
  .missing-fields li{font-size:var(--text-xs);line-height:1.6;color:var(--ink-soft);margin:4px 0}
  .confidence-actions{display:flex;gap:8px;margin-top:10px}
  .confidence-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:var(--radius-full);background:rgba(255,241,220,.92);border:1px solid rgba(173,103,38,.24);font-size:var(--text-xs);font-weight:850;color:var(--warn)}

  /* 新手引导蒙层 */
  .tutorial-overlay{position:fixed;inset:0;background:rgba(12,20,18,.85);backdrop-filter:blur(6px);z-index:9999;display:none;align-items:center;justify-content:center;animation:tutorialFadeIn .3s ease}
  .tutorial-overlay.active{display:flex}
  .tutorial-spotlight{position:absolute;border:3px solid var(--gold);border-radius:var(--radius-lg);box-shadow:0 0 0 4px rgba(217,164,65,.18),0 0 0 9999px rgba(12,20,18,.85);pointer-events:none;transition:all .4s var(--ease);z-index:10000}
  .tutorial-tooltip{position:absolute;background:linear-gradient(145deg,#fffdf8,#f8faf7);border:2px solid var(--gold);border-radius:var(--radius-lg);padding:var(--space-4) 18px;max-width:320px;box-shadow:0 20px 54px rgba(18,33,29,.3);z-index:10001;animation:tutorialPop .4s var(--ease)}
  .tutorial-tooltip:before{content:"";position:absolute;width:16px;height:16px;background:inherit;border:inherit;border-width:2px 0 0 2px;transform:rotate(-45deg);z-index:-1}
  .tutorial-tooltip.top:before{bottom:-9px;left:50%;transform:translateX(-50%) rotate(225deg)}
  .tutorial-tooltip.bottom:before{top:-9px;left:50%;transform:translateX(-50%) rotate(45deg)}
  .tutorial-tooltip.left:before{right:-9px;top:50%;transform:translateY(-50%) rotate(135deg)}
  .tutorial-tooltip.right:before{left:-9px;top:50%;transform:translateY(-50%) rotate(-45deg)}
  .tutorial-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .tutorial-title{font-size:var(--text-lg);font-weight:900;color:var(--brand-deep);display:flex;align-items:center;gap:8px}
  .tutorial-step-badge{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 6px;border-radius:var(--radius-full);background:var(--gold);color:#fff;font-size:var(--text-xs);font-weight:900;line-height:1}
  .tutorial-content{font-size:var(--text-sm);line-height:1.65;color:var(--ink);margin-bottom:12px}
  .tutorial-actions{display:flex;gap:8px;justify-content:flex-end}
  .tutorial-skip{font-size:var(--text-xs);color:var(--ink-soft);text-decoration:underline;cursor:pointer;transition:color .18s ease}
  .tutorial-skip:hover{color:var(--brand-deep)}
  @keyframes tutorialFadeIn{from{opacity:0}to{opacity:1}}
  @keyframes tutorialPop{from{opacity:0;transform:scale(.9) translateY(-10px)}to{opacity:1;transform:scale(1) translateY(0)}}

  /* ========== 首页概览布局 - 乔布斯式克制精致 ========== */
  .home-overview{
    display:flex;
    flex-direction:column;
    height:calc(100vh - 64px);
    gap:var(--space-3);
    padding:var(--space-4) var(--space-5);
    overflow:hidden;
  }

  /* 上方：2D平面图 + 紧急任务 */
  .home-main{
    display:grid;
    grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);
    gap:var(--space-4);
    flex:1;
    min-height:0;
  }

  /* 2D 平面图 */
  .home-floorplan{
    display:flex;
    flex-direction:column;
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius-xl);
    overflow:hidden;
    box-shadow:var(--shadow);
  }
  .floorplan-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:var(--space-4) var(--space-5);
    background:var(--surface);
    border-bottom:1px solid var(--line);
  }
  .floorplan-header h2{
    font-size:var(--text-lg);
    font-weight:800;
    color:var(--ink);
    margin:0;
    letter-spacing:-0.01em;
  }
  .floorplan-canvas{
    flex:1;
    min-height:0;
    overflow:hidden;
    padding:var(--space-5);
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg, #fafcfb 0%, #f5f8f7 100%);
  }
  .floorplan-canvas svg{
    width:100%;
    height:100%;
    max-width:720px;
    max-height:560px;
  }
  .room-marker:hover circle:first-child{
    opacity:1;
    r:7;
    transition:all .2s;
  }
  .floorplan-legend{
    display:flex;
    align-items:center;
    gap:var(--space-5);
    padding:var(--space-3) var(--space-5);
    background:var(--surface);
    border-top:1px solid var(--line);
    font-size:var(--text-xs);
    color:var(--ink-soft);
    font-weight:500;
    white-space:nowrap;
    overflow:hidden;
  }
  .legend-dot{
    display:inline-block;
    width:8px;
    height:8px;
    border-radius:50%;
    margin-right:6px;
    vertical-align:middle;
  }
  .legend-dot.green{background:var(--brand)}
  .legend-dot.red{background:var(--danger)}
  .legend-tip{margin-left:auto;color:var(--ink-soft);font-weight:400}

  /* 紧急任务 */
  .home-urgent{
    display:flex;
    flex-direction:column;
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius-xl);
    overflow:hidden;
    box-shadow:var(--shadow);
  }
  .section-title{
    display:flex;
    align-items:center;
    gap:var(--space-2);
    padding:var(--space-4) var(--space-5);
    background:var(--surface);
    border-bottom:1px solid var(--line);
    font-size:var(--text-base);
    font-weight:700;
    margin:0;
    letter-spacing:-0.005em;
  }
  .badge{
    padding:2px var(--space-2);
    border-radius:var(--radius-sm);
    background:var(--neutral-soft);
    color:var(--neutral);
    font-size:var(--text-xs);
    font-weight:700;
    min-width:20px;
    text-align:center;
  }
  .badge.danger{background:var(--danger-soft);color:var(--danger)}

  .urgent-cards{
    flex:1;
    overflow-y:auto;
    padding:var(--space-3);
    display:flex;
    flex-direction:column;
    gap:var(--space-3);
  }
  .urgent-card{
    position:relative;
    padding:var(--space-3) var(--space-4);
    border:1px solid var(--line);
    border-left:3px solid var(--danger);
    border-radius:var(--radius-lg);
    background:linear-gradient(135deg, var(--surface) 0%, var(--danger-soft) 100%);
    transition:border-color .18s var(--ease),box-shadow .18s var(--ease),transform .18s var(--ease);
  }
  .urgent-card:hover{
    border-color:var(--line-strong);
    box-shadow:var(--shadow-md);
    transform:translateY(-1px);
  }
  .urgent-header{
    display:flex;
    gap:var(--space-3);
    margin-bottom:var(--space-2);
  }
  .urgent-icon{font-size:var(--text-xl);flex-shrink:0;line-height:1}
  .urgent-info{flex:1;min-width:0}
  .urgent-info h4{
    font-size:var(--text-base);
    font-weight:700;
    margin:0 0 4px;
    color:var(--ink);
    letter-spacing:-0.005em;
  }
  .urgent-time{
    display:inline-block;
    padding:2px var(--space-2);
    border-radius:var(--radius-sm);
    background:var(--danger-soft);
    color:var(--danger);
    font-size:var(--text-xs);
    font-weight:700;
  }
  .urgent-desc{
    font-size:var(--text-sm);
    color:var(--ink-soft);
    line-height:1.5;
    margin:0 0 var(--space-3);
  }

  /* 下方：待办 + 统计 */
  .home-bottom{
    display:grid;
    grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);
    gap:var(--space-4);
    height:200px;
    flex-shrink:0;
  }

  /* 待办列表 */
  .home-todo{
    display:flex;
    flex-direction:column;
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius-xl);
    overflow:hidden;
    box-shadow:var(--shadow);
  }
  .todo-grid{
    flex:1;
    overflow-y:auto;
    padding:var(--space-3);
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:var(--space-2);
    align-content:start;
  }
  .todo-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:var(--space-1);
    padding:var(--space-2) var(--space-3);
    border:1px solid var(--line);
    border-radius:var(--radius-md);
    background:#fff;
    cursor:pointer;
    transition:all .15s;
  }
  .todo-card:hover{
    border-color:var(--brand);
    background:var(--brand-soft);
  }
  .todo-icon{font-size:var(--text-lg);flex-shrink:0;line-height:1}
  .todo-info{text-align:center;width:100%}
  .todo-title{
    display:block;
    font-size:var(--text-xs);
    font-weight:600;
    color:var(--ink);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .todo-meta{
    display:block;
    font-size:var(--text-xs);
    color:var(--ink-soft);
    margin-top:2px;
  }

  /* 统计卡片 */
  .home-stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:var(--space-3);
  }
  .stat-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-sm);
    padding:var(--space-3);
    transition:transform .18s var(--ease),box-shadow .18s var(--ease);
  }
  .stat-card:hover{
    transform:translateY(-1px);
    box-shadow:var(--shadow-md);
  }
  .stat-num{
    font-size:30px;
    font-weight:800;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
    letter-spacing:-0.02em;
    line-height:1;
  }
  .stat-num.danger{color:var(--danger)}
  .stat-num.warn{color:var(--warn)}
  .stat-label{
    font-size:var(--text-xs);
    color:var(--ink-soft);
    font-weight:600;
    letter-spacing:0.02em;
    white-space:nowrap;
  }

  /* 空状态 */
  .empty-hint{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink-soft);
    font-size:var(--text-sm);
    padding:var(--space-6);
  }

  /* 空间页 */
  .space-immersive{width:100%;height:calc(100vh - 64px);overflow:hidden}
  .space-immersive .memory-card{height:100%;margin:0}
  .space-immersive .card-b{height:100%;padding:0}

  /* 档案页 */
  .archives-layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:0;height:calc(100vh - 64px);overflow:hidden}
  .archives-sidebar{border-right:1px solid var(--line);background:var(--surface);padding:var(--space-4);display:flex;flex-direction:column;overflow:hidden}
  .quick-filters{display:flex;flex-direction:column;gap:var(--space-2);margin-bottom:var(--space-4);flex-shrink:0}
  .filter-chip{width:100%;padding:var(--space-2) var(--space-3);border:1px solid transparent;border-radius:var(--radius-md);background:#fff;color:var(--ink-soft);font-size:var(--text-sm);font-weight:600;text-align:left;cursor:pointer;transition:all .15s ease}
  .filter-chip:hover{border-color:var(--line);color:var(--ink)}
  .filter-chip.active{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
  .category-tree,.member-tree{margin-bottom:var(--space-4);flex-shrink:0}
  .category-tree h3,.member-tree h3{font-size:var(--text-xs);font-weight:800;color:var(--ink-soft);margin:0 0 var(--space-2);text-transform:uppercase;letter-spacing:0.3px}
  .category-item,.member-item{display:flex;align-items:center;justify-content:space-between;padding:var(--space-2);border-radius:var(--radius-sm);cursor:pointer;transition:all .15s ease}
  .category-item:hover,.member-item:hover{background:rgba(255,255,255,.7)}
  .category-item.active,.member-item.active{background:#fff;font-weight:700;color:var(--brand-deep)}
  .category-label,.member-label{font-size:var(--text-sm);color:var(--ink)}
  .category-count,.member-count{font-size:var(--text-xs);color:var(--ink-soft);font-weight:700}

  .archives-main{display:flex;flex-direction:column;overflow:hidden;min-height:0}
  .archives-header{display:flex;align-items:center;justify-content:space-between;padding:var(--space-4);border-bottom:1px solid var(--line);flex-shrink:0}
  .archives-header h2{font-size:var(--text-lg);font-weight:900;color:var(--ink);margin:0}
  .archives-actions{display:flex;gap:var(--space-2);align-items:center}
  .archives-actions input{padding:var(--space-2) var(--space-3);border:1px solid var(--line);border-radius:var(--radius-md);font-size:var(--text-sm);width:240px}

  .archives-list{flex:1;overflow-y:auto;padding:var(--space-3) var(--space-3) 32px var(--space-3);display:flex;flex-direction:column;gap:var(--space-2);min-height:0}
  .archive-row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:var(--space-3);align-items:center;padding:var(--space-3);border:1px solid var(--line);border-radius:var(--radius-lg);background:#fff;cursor:pointer;transition:all .18s ease}
  .archive-row:hover{border-color:var(--brand);background:var(--brand-soft);transform:translateX(2px);box-shadow:var(--shadow-sm)}
  .archive-row-icon{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md);font-size:var(--text-xl);font-weight:900}
  .archive-row-main{flex:1;min-width:0}
  .archive-row-title{font-size:var(--text-base);font-weight:800;color:var(--ink);margin:0 0 var(--space-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .archive-row-meta{font-size:var(--text-xs);color:var(--ink-soft);display:flex;gap:var(--space-2)}
  .archive-row-tags{display:flex;gap:var(--space-2);align-items:center}

  /* 档案页折叠 */
  .tree-header{display:flex;align-items:center;justify-content:space-between;padding:var(--space-2) var(--space-3);cursor:pointer;user-select:none;border-radius:var(--radius-sm);transition:background .15s ease}
  .tree-header:hover{background:rgba(255,255,255,.5)}
  .tree-header h3{font-size:var(--text-xs);font-weight:900;color:var(--ink-soft);margin:0;text-transform:uppercase;letter-spacing:0.5px}
  .toggle-icon{font-size:var(--text-xs);color:var(--ink-soft);transition:transform .2s ease}
  .tree-content{max-height:500px;overflow:hidden;transition:max-height .3s ease,opacity .3s ease}
  .tree-content.collapsed{max-height:0;opacity:0}

  /* 档案页分页 */
  .archives-pagination{display:flex;align-items:center;justify-content:space-between;padding:var(--space-3) var(--space-4);border-top:1px solid var(--line);background:var(--surface);flex-shrink:0}
  .pagination-btn{padding:var(--space-2) var(--space-4);border:1px solid var(--line);border-radius:var(--radius-md);background:#fff;color:var(--ink);font-size:var(--text-sm);font-weight:700;cursor:pointer;transition:all .18s ease}
  .pagination-btn:hover:not([disabled]){border-color:var(--brand);background:var(--brand-soft);color:var(--brand-deep)}
  .pagination-btn[disabled]{opacity:.5;cursor:not-allowed}
  .pagination-info{font-size:var(--text-sm);color:var(--ink-soft);font-weight:600}

  /* 搜索实时预览 */
  .search-preview{position:absolute;top:100%;left:0;right:0;margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:0 12px 32px rgba(18,33,29,.15);max-height:420px;overflow-y:auto;z-index:100;display:none}
  .search-preview.active{display:block;animation:searchPreviewSlide .25s ease}
  .search-preview-header{padding:var(--space-3) 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .search-preview-header h4{font-size:var(--text-xs);font-weight:900;color:var(--ink-soft);margin:0;text-transform:uppercase;letter-spacing:0.5px}
  .search-preview-count{font-size:var(--text-xs);color:var(--ink-soft)}
  .search-preview-item{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 16px;cursor:pointer;transition:all .15s ease;border-bottom:1px solid rgba(220,229,223,.4)}
  .search-preview-item:last-child{border-bottom:none}
  .search-preview-item:hover{background:var(--brand-soft)}
  .search-preview-icon{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md);font-size:var(--text-xl);font-weight:900}
  .search-preview-main{flex:1;min-width:0}
  .search-preview-title{font-size:var(--text-sm);font-weight:800;color:var(--ink);margin:0 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .search-preview-meta{font-size:var(--text-xs);color:var(--ink-soft)}
  .search-preview-badge{font-size:var(--text-xs);padding:3px 6px;border-radius:4px;background:var(--neutral-soft);color:var(--neutral);font-weight:850}
  .search-preview-empty{padding:40px 20px;text-align:center;color:var(--ink-soft);font-size:var(--text-sm)}
  @keyframes searchPreviewSlide{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

  /* Slide-in 详情面板（替代抽屉） */
  .detail-panel{position:fixed;top:0;right:0;bottom:0;width:min(520px,90vw);background:#fff;box-shadow:-8px 0 32px rgba(18,33,29,.15);z-index:1001;transform:translateX(100%);transition:transform .35s cubic-bezier(.25,.8,.25,1);display:flex;flex-direction:column;overflow:hidden}
  .detail-panel.active{transform:translateX(0)}
  .detail-panel-overlay{position:fixed;inset:0;background:rgba(12,20,18,.4);backdrop-filter:blur(3px);z-index:1000;opacity:0;pointer-events:none;transition:opacity .35s ease}
  .detail-panel-overlay.active{opacity:1;pointer-events:auto}
  .detail-panel-header{display:flex;align-items:center;justify-content:space-between;padding:var(--space-5) 24px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--surface),#fff);flex-shrink:0}
  .detail-panel-title{font-size:var(--text-xl);font-weight:900;color:var(--ink);margin:0}
  .detail-panel-close{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:var(--radius-md);background:#fff;color:var(--ink-soft);font-size:var(--text-xl);cursor:pointer;transition:all .18s ease}
  .detail-panel-close:hover{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-deep);transform:rotate(90deg)}
  .detail-panel-body{flex:1;overflow-y:auto;padding:var(--space-6)}
  .detail-panel-section{margin-bottom:24px}
  .detail-panel-section:last-child{margin-bottom:0}
  .detail-panel-section h3{font-size:var(--text-base);font-weight:900;color:var(--ink);margin:0 0 12px;display:flex;align-items:center;gap:6px}
  .detail-panel-footer{padding:var(--space-4) 24px;border-top:1px solid var(--line);background:var(--surface);display:flex;gap:10px;flex-shrink:0}

  /* 空间热点悬停预览 */
  .hotspot-preview{position:absolute;padding:var(--space-3) 14px;background:rgba(255,253,248,.96);border:1px solid var(--gold);border-radius:var(--radius-lg);box-shadow:0 8px 24px rgba(18,33,29,.2);backdrop-filter:blur(12px);pointer-events:none;z-index:100;opacity:0;transform:translateY(8px);transition:all .2s ease;max-width:280px}
  .hotspot-preview.active{opacity:1;transform:translateY(0)}
  .hotspot-preview-title{font-size:var(--text-sm);font-weight:800;color:var(--ink);margin:0 0 4px}
  .hotspot-preview-meta{font-size:var(--text-xs);color:var(--ink-soft);margin:0 0 8px}
  .hotspot-preview-tags{display:flex;gap:4px;flex-wrap:wrap}
  .hotspot-preview-tag{font-size:var(--text-xs);padding:2px 6px;border-radius:4px;background:var(--brand-soft);color:var(--brand-deep);font-weight:850}

  /* Lucide 图标系统 */
  [data-lucide]{width:20px;height:20px;stroke-width:2;vertical-align:middle}
  .icon-urgent [data-lucide]{color:var(--danger)}
  .icon-warning [data-lucide]{color:var(--warn)}
  .icon-info [data-lucide]{color:var(--brand)}
  .icon-success [data-lucide]{color:var(--success)}
  .icon-neutral [data-lucide]{color:var(--ink-soft)}

  /* 详情面板辅助样式 */
  .flex{display:flex}
  .flex-1{flex:1}
  .gap8{gap:8px}
  .wrap{flex-wrap:wrap}
  .summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px}
  .summary-card{padding:10px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface)}
  .summary-k{display:block;font-size:var(--text-xs);color:var(--ink-soft);margin-bottom:4px}
  .summary-v{display:block;font-size:var(--text-sm);font-weight:800;color:var(--ink)}
  .reminder-card{padding:var(--space-3);border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface)}
  .reminder-card.urgent{border-color:var(--danger);background:var(--danger-soft)}
  .reminder-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .reminder-date{font-size:var(--text-xs);font-weight:800;color:var(--ink)}
  .reminder-action{font-size:var(--text-sm);color:var(--ink-soft)}
  .field-list{display:flex;flex-direction:column;gap:6px}
  .field-row{display:grid;grid-template-columns:120px 1fr auto;gap:10px;padding:var(--space-2);border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);align-items:center}
  .field-label{font-size:var(--text-xs);font-weight:800;color:var(--ink-soft)}
  .field-value{font-size:var(--text-sm);color:var(--ink)}
  .field-confidence{font-size:var(--text-xs);color:var(--ink-soft)}
  .low-confidence-box{padding:var(--space-3);border:1px solid var(--warn);border-radius:var(--radius-md);background:var(--warn-soft)}
  .low-confidence-box p{margin:6px 0;font-size:var(--text-xs);line-height:1.6;color:var(--ink)}
  .evidence-list{display:flex;flex-wrap:wrap;gap:6px}
  .evidence-tag{padding:6px 10px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);font-size:var(--text-xs);color:var(--ink)}
  .ai-explanation p{margin:8px 0;font-size:var(--text-xs);line-height:1.6;color:var(--ink-soft)}
  .mt8{margin-top:8px}.mt10{margin-top:10px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
  .flex{display:flex}.between{justify-content:space-between}.center{align-items:center}.gap8{gap:8px}.gap12{gap:12px}.wrap{flex-wrap:wrap}

  /* 服务页单屏布局 — Apple 风格：克制、留白、字体层级清晰 */
  .services-layout{display:flex;flex-direction:column;height:calc(100vh - 64px);overflow:hidden;background:var(--bg)}
  .services-tabs{
    display:flex;gap:6px;
    padding:14px 24px;
    border-bottom:1px solid var(--line);
    background:rgba(255,253,248,.92);
    backdrop-filter:saturate(180%) blur(12px);
    -webkit-backdrop-filter:saturate(180%) blur(12px);
    flex-shrink:0;
  }
  .service-tab{
    padding:7px 16px;
    border:1px solid transparent;
    border-radius:var(--radius-full);
    background:transparent;
    color:var(--ink-soft);
    font-size:var(--text-sm);font-weight:500;letter-spacing:.1px;
    cursor:pointer;
    transition:color .2s var(--ease),background-color .2s var(--ease);
  }
  .service-tab:hover{color:var(--ink);background:rgba(23,33,29,.04)}
  .service-tab.active{
    background:var(--ink);
    color:#fffdf8;
    font-weight:600;
  }
  .services-content{flex:1;overflow-y:auto;padding:0;background:var(--bg)}
  .services-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-3);max-width:1200px;margin:0 auto}
  .services-grid-real{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:18px;
    padding:28px 28px 36px;
    align-items:stretch;
    max-width:1440px;
    margin:0 auto;
  }

  /* 卡片本体 — 极简纯白，1px 细边框，几乎不可见的阴影 */
  .services-grid-real .service-card,
  .services-grid-real .service-scenario-card{
    display:flex;flex-direction:column;
    text-align:left;
    padding:22px 22px 20px;
    border:1px solid var(--line);
    border-radius:14px;
    background:#fffdf8;
    box-shadow:0 1px 2px rgba(18,33,29,.03);
    transition:border-color .25s var(--ease),box-shadow .25s var(--ease);
    cursor:default;
    min-height:auto;
    min-width:0;
  }
  .services-grid-real .service-card:hover,
  .services-grid-real .service-scenario-card:hover{
    border-color:rgba(23,107,93,.22);
    box-shadow:0 4px 16px rgba(18,33,29,.06);
    transform:none;
    background:#fffdf8;
  }
  .services-grid-real .service-card.active,
  .services-grid-real .service-scenario-card.active{
    border-color:rgba(23,107,93,.38);
    background:#fffdf8;
    box-shadow:0 6px 20px rgba(23,107,93,.08),inset 3px 0 0 var(--brand);
  }
  .services-grid-real .service-card.generated,
  .services-grid-real .service-scenario-card.generated{
    background:#fffefb;
  }
