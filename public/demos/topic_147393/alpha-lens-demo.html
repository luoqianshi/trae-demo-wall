<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpha Lens · 量化学习者社区 Demo</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
@font-face { font-family: 'Tektur'; font-weight: 400; src: url('./_shared/fonts/Tektur-Regular.ttf') format('truetype'); font-display: swap; }
@font-face { font-family: 'Tektur'; font-weight: 500; src: url('./_shared/fonts/Tektur-Medium.ttf') format('truetype'); font-display: swap; }
@font-face { font-family: 'JetBrainsMono'; font-weight: 400; src: url('./_shared/fonts/JetBrainsMono-Regular.ttf') format('truetype'); font-display: swap; }
@font-face { font-family: 'InstrumentSerif'; font-weight: 400; font-style: normal; src: url('./_shared/fonts/InstrumentSerif-Regular.ttf') format('truetype'); font-display: swap; }
@font-face { font-family: 'InstrumentSerif'; font-weight: 400; font-style: italic; src: url('./_shared/fonts/InstrumentSerif-Italic.ttf') format('truetype'); font-display: swap; }

:root {
  --bg: #0B0F14;
  --bg2: #111821;
  --bg3: #18222E;
  --bg4: #1E2A38;
  --ink: #CBD5E1;
  --ink2: #F1F5F9;
  --muted: #94A3B8;
  --muted2: #64748B;
  --rule: #1F2937;
  --rule2: #2A3A4D;
  --accent: #00E5C7;
  --accent-dim: rgba(0,229,199,0.12);
  --accent2: #6366F1;
  --warn: #F59E0B;
  --danger: #EF4444;
  --pink: #EC4899;
  --green: #10B981;

  --f-估值: #00E5C7;
  --f-动量: #6366F1;
  --f-情绪: #EC4899;
  --f-资金流: #F59E0B;
  --f-基本面: #10B981;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Tektur', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 15px;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  background-image:
    radial-gradient(at 0% 0%, rgba(0,229,199,0.06) 0px, transparent 45%),
    radial-gradient(at 100% 0%, rgba(99,102,241,0.06) 0px, transparent 45%),
    radial-gradient(at 50% 100%, rgba(236,72,153,0.04) 0px, transparent 50%);
  background-attachment: fixed;
  min-height: 100vh;
}

::selection { background: var(--accent); color: var(--bg); }

/* ===== Scrollbar ===== */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--rule2); border-radius: 5px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: var(--muted2); }

/* ===== Top Nav ===== */
.nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(11,15,20,0.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--rule);
}
.nav-inner {
  max-width: 1200px; margin: 0 auto; padding: 0 1.5rem;
  height: 60px; display: flex; align-items: center; gap: 2rem;
}
.brand { display: flex; align-items: center; gap: 0.6rem; cursor: pointer; text-decoration: none; }
.brand .logo {
  width: 30px; height: 30px; border-radius: 7px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  display: grid; place-items: center; color: var(--bg); font-weight: 700; font-size: 0.95rem;
  box-shadow: 0 0 18px rgba(0,229,199,0.35);
}
.brand .name { font-family: 'Tektur'; font-weight: 500; font-size: 1.15rem; color: var(--ink2); letter-spacing: -0.01em; }
.brand .name .a { color: var(--accent); }
.nav-links { display: flex; gap: 0.3rem; margin-left: auto; align-items: center; }
.nav-link {
  font-family: 'JetBrainsMono'; font-size: 0.78rem; color: var(--muted);
  padding: 0.45rem 0.85rem; border-radius: 6px; cursor: pointer;
  transition: all 0.18s; letter-spacing: 0.04em; text-decoration: none;
  border: 1px solid transparent;
}
.nav-link:hover { color: var(--ink2); background: var(--bg2); }
.nav-link.active { color: var(--accent); background: var(--accent-dim); border-color: rgba(0,229,199,0.25); }
.nav-link .badge {
  display: inline-block; min-width: 18px; height: 18px; line-height: 18px;
  background: var(--accent); color: var(--bg); border-radius: 9px;
  font-size: 0.65rem; font-weight: 700; padding: 0 5px; margin-left: 0.3rem; text-align: center;
}

/* ===== App ===== */
#app { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem 4rem; }

/* ===== Hero ===== */
.hero { padding: 3.5rem 0 2.5rem; border-bottom: 1px solid var(--rule); }
.hero .tag {
  display: inline-flex; align-items: center; gap: 0.5rem;
  font-family: 'JetBrainsMono'; font-size: 0.72rem; color: var(--accent);
  border: 1px solid rgba(0,229,199,0.4); background: var(--accent-dim);
  padding: 0.35rem 0.9rem; border-radius: 2rem; letter-spacing: 0.12em; margin-bottom: 1.4rem;
}
.hero .tag .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.hero h1 {
  font-family: 'Tektur'; font-weight: 500;
  font-size: clamp(2.2rem, 4.5vw, 3.4rem); line-height: 1.08; color: var(--ink2);
  letter-spacing: -0.025em; margin-bottom: 0.7rem;
}
.hero h1 .a { color: var(--accent); }
.hero .sub {
  font-family: 'InstrumentSerif'; font-style: italic;
  font-size: clamp(1.1rem, 2vw, 1.45rem); color: var(--muted);
  max-width: 580px; margin-bottom: 1.8rem;
}
.hero-stats { display: flex; gap: 2.5rem; flex-wrap: wrap; }
.hero-stat .n { font-family: 'Tektur'; font-weight: 500; font-size: 1.8rem; color: var(--accent); line-height: 1; }
.hero-stat .l { font-family: 'JetBrainsMono'; font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.15em; margin-top: 0.4rem; }

/* ===== Filter Bar ===== */
.filter-bar {
  position: sticky; top: 60px; z-index: 50;
  background: rgba(11,15,20,0.9); backdrop-filter: blur(10px);
  padding: 1rem 0; border-bottom: 1px solid var(--rule);
  display: flex; flex-direction: column; gap: 0.7rem;
}
.filter-row { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
.filter-label { font-family: 'JetBrainsMono'; font-size: 0.68rem; color: var(--muted2); text-transform: uppercase; letter-spacing: 0.12em; min-width: 52px; }
.pill {
  font-family: 'JetBrainsMono'; font-size: 0.76rem; color: var(--muted);
  padding: 0.35rem 0.8rem; border-radius: 2rem; cursor: pointer;
  border: 1px solid var(--rule2); background: var(--bg2); transition: all 0.16s;
}
.pill:hover { color: var(--ink2); border-color: var(--muted2); }
.pill.active { color: var(--bg); background: var(--accent); border-color: var(--accent); font-weight: 500; }
.chip {
  font-family: 'JetBrainsMono'; font-size: 0.74rem; padding: 0.3rem 0.75rem;
  border-radius: 2rem; cursor: pointer; border: 1px solid var(--rule2);
  background: var(--bg2); transition: all 0.16s; color: var(--muted);
}
.chip:hover { color: var(--ink2); }
.chip.active { color: var(--bg); font-weight: 500; }
.chip.active[data-factor="估值"] { background: var(--f-估值); border-color: var(--f-估值); }
.chip.active[data-factor="动量"] { background: var(--f-动量); border-color: var(--f-动量); }
.chip.active[data-factor="情绪"] { background: var(--f-情绪); border-color: var(--f-情绪); }
.chip.active[data-factor="资金流"] { background: var(--f-资金流); border-color: var(--f-资金流); }
.chip.active[data-factor="基本面"] { background: var(--f-基本面); border-color: var(--f-基本面); }
.search-box {
  flex: 1; min-width: 180px; position: relative;
}
.search-box input {
  width: 100%; font-family: 'JetBrainsMono'; font-size: 0.82rem; color: var(--ink2);
  background: var(--bg2); border: 1px solid var(--rule2); border-radius: 8px;
  padding: 0.5rem 0.9rem 0.5rem 2.2rem; outline: none; transition: border-color 0.16s;
}
.search-box input:focus { border-color: var(--accent); }
.search-box input::placeholder { color: var(--muted2); }
.search-box .ico { position: absolute; left: 0.7rem; top: 50%; transform: translateY(-50%); color: var(--muted2); font-size: 0.9rem; }

/* ===== Article Cards ===== */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 1rem; margin-top: 1.6rem; }
.card {
  background: var(--bg2); border: 1px solid var(--rule); border-radius: 10px;
  padding: 1.3rem; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden;
  display: flex; flex-direction: column;
}
.card::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: var(--card-color, var(--accent)); opacity: 0; transition: opacity 0.2s;
}
.card:hover { border-color: var(--card-color, var(--accent)); transform: translateY(-3px); box-shadow: 0 8px 30px rgba(0,0,0,0.3); }
.card:hover::before { opacity: 1; }
.card-head { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.7rem; flex-wrap: wrap; }
.tag-diff {
  font-family: 'JetBrainsMono'; font-size: 0.66rem; padding: 0.2rem 0.55rem; border-radius: 3px;
  letter-spacing: 0.05em; font-weight: 500;
}
.tag-diff.入门 { color: var(--green); background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.3); }
.tag-diff.进阶 { color: var(--warn); background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.3); }
.tag-diff.实战 { color: var(--pink); background: rgba(236,72,153,0.12); border: 1px solid rgba(236,72,153,0.3); }
.tag-factor {
  font-family: 'JetBrainsMono'; font-size: 0.66rem; padding: 0.2rem 0.55rem; border-radius: 3px;
  color: var(--card-color); background: rgba(255,255,255,0.03); border: 1px solid var(--card-color);
}
.card h3 { font-family: 'Tektur'; font-weight: 500; font-size: 1.05rem; color: var(--ink2); line-height: 1.4; margin-bottom: 0.5rem; }
.card p.sum { font-size: 0.85rem; color: var(--muted); line-height: 1.6; margin-bottom: 0.9rem; flex: 1; }
.card-foot { display: flex; align-items: center; justify-content: space-between; }
.card-meta { font-family: 'JetBrainsMono'; font-size: 0.72rem; color: var(--muted2); display: flex; gap: 0.8rem; }
.card-meta span { display: flex; align-items: center; gap: 0.25rem; }
.spark { height: 34px; margin: 0.4rem 0 0.8rem; }
.bookmark-flag { position: absolute; top: 0.9rem; right: 0.9rem; color: var(--accent); font-size: 0.95rem; opacity: 0; transition: opacity 0.2s; }
.card.is-saved .bookmark-flag { opacity: 1; }
.empty-state { grid-column: 1/-1; text-align: center; padding: 4rem 1rem; color: var(--muted2); }
.empty-state .ico { font-size: 2.5rem; margin-bottom: 0.8rem; opacity: 0.4; }

/* ===== Article Detail Layout ===== */
.detail-wrap { display: grid; grid-template-columns: 220px minmax(0,1fr) 340px; gap: 2rem; padding-top: 1.8rem; align-items: start; }
.toc { position: sticky; top: 80px; max-height: calc(100vh - 100px); overflow-y: auto; padding-right: 0.5rem; }
.toc .toc-title { font-family: 'JetBrainsMono'; font-size: 0.68rem; color: var(--muted2); text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 0.8rem; padding-left: 0.9rem; }
.toc a {
  display: block; font-size: 0.82rem; color: var(--muted); padding: 0.35rem 0.9rem;
  border-left: 2px solid var(--rule); cursor: pointer; transition: all 0.15s; line-height: 1.4;
}
.toc a:hover { color: var(--ink2); }
.toc a.active { color: var(--accent); border-left-color: var(--accent); background: var(--accent-dim); }

.article { min-width: 0; }
.back-link { display: inline-flex; align-items: center; gap: 0.4rem; font-family: 'JetBrainsMono'; font-size: 0.76rem; color: var(--muted); cursor: pointer; margin-bottom: 1.2rem; transition: color 0.15s; }
.back-link:hover { color: var(--accent); }
.article-head { margin-bottom: 1.8rem; padding-bottom: 1.4rem; border-bottom: 1px solid var(--rule); }
.article-head .tags { display: flex; gap: 0.5rem; margin-bottom: 0.9rem; }
.article-head h1 { font-family: 'Tektur'; font-weight: 500; font-size: clamp(1.7rem, 3vw, 2.3rem); color: var(--ink2); line-height: 1.2; letter-spacing: -0.02em; margin-bottom: 0.7rem; }
.article-head .meta { font-family: 'JetBrainsMono'; font-size: 0.76rem; color: var(--muted2); display: flex; gap: 1.2rem; flex-wrap: wrap; }
.article-head .meta span { display: flex; align-items: center; gap: 0.3rem; }

.section { margin-bottom: 2.4rem; scroll-margin-top: 80px; }
.section h2 { font-family: 'Tektur'; font-weight: 500; font-size: 1.35rem; color: var(--ink2); margin-bottom: 0.9rem; display: flex; align-items: center; gap: 0.6rem; }
.section h2::before { content: ''; width: 3px; height: 1.1em; background: var(--accent); border-radius: 2px; }
.section h3 { font-family: 'Tektur'; font-weight: 500; font-size: 1.05rem; color: var(--accent); margin: 1.3rem 0 0.7rem; }
.section p { color: var(--ink); margin-bottom: 1rem; }
.section p strong { color: var(--ink2); font-weight: 500; }
.section ul, .section ol { margin: 0.6rem 0 1.2rem 1.3rem; }
.section li { margin-bottom: 0.45rem; color: var(--ink); }
.section li strong { color: var(--accent); font-weight: 500; }
.section code { font-family: 'JetBrainsMono'; font-size: 0.84em; background: var(--bg3); border: 1px solid var(--rule); padding: 0.1rem 0.4rem; border-radius: 3px; color: var(--accent); }
.section .formula { margin: 1.2rem 0; padding: 1rem 1.4rem; background: var(--bg2); border: 1px solid var(--rule); border-radius: 8px; text-align: center; overflow-x: auto; }
.section blockquote { border-left: 3px solid var(--accent); padding: 0.4rem 0 0.4rem 1.1rem; margin: 1.2rem 0; font-family: 'InstrumentSerif'; font-style: italic; font-size: 1.05rem; color: var(--muted); background: linear-gradient(90deg, rgba(0,229,199,0.05) 0%, transparent 100%); }
.code-block { background: var(--bg2); border: 1px solid var(--rule); border-radius: 8px; margin: 1.1rem 0; overflow: hidden; }
.code-block .code-head { display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 1rem; background: var(--bg3); border-bottom: 1px solid var(--rule); }
.code-block .code-head .lang { font-family: 'JetBrainsMono'; font-size: 0.7rem; color: var(--muted2); text-transform: uppercase; letter-spacing: 0.1em; }
.code-block .copy { font-family: 'JetBrainsMono'; font-size: 0.7rem; color: var(--accent); cursor: pointer; background: none; border: none; padding: 0.2rem 0.5rem; border-radius: 3px; transition: background 0.15s; }
.code-block .copy:hover { background: var(--accent-dim); }
.code-block pre { padding: 1rem 1.2rem; overflow-x: auto; font-family: 'JetBrainsMono'; font-size: 0.8rem; line-height: 1.6; color: #B8C5D6; }
.code-block .k { color: #C792EA; }
.code-block .s { color: #C3E88D; }
.code-block .n { color: #F78C6C; }
.code-block .c { color: #546E7A; font-style: italic; }
.code-block .fn { color: #82AAFF; }
.chart-box { background: var(--bg2); border: 1px solid var(--rule); border-radius: 8px; padding: 1rem 1.2rem 0.6rem; margin: 1.2rem 0; }
.chart-box .chart-title { font-family: 'JetBrainsMono'; font-size: 0.74rem; color: var(--muted); margin-bottom: 0.6rem; letter-spacing: 0.05em; }
.chart-box .chart-canvas { width: 100%; height: 280px; }

/* ===== AI Panel ===== */
.ai-panel { position: sticky; top: 80px; background: var(--bg2); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; max-height: calc(100vh - 100px); }
.ai-head { padding: 0.9rem 1rem; border-bottom: 1px solid var(--rule); background: linear-gradient(135deg, rgba(0,229,199,0.08), rgba(99,102,241,0.06)); }
.ai-head .ai-title { display: flex; align-items: center; gap: 0.5rem; font-family: 'Tektur'; font-weight: 500; font-size: 0.95rem; color: var(--ink2); }
.ai-head .ai-bot { width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: grid; place-items: center; font-size: 0.8rem; }
.ai-head .ai-sub { font-family: 'JetBrainsMono'; font-size: 0.68rem; color: var(--muted); margin-top: 0.3rem; }
.ai-messages { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.8rem; min-height: 220px; max-height: 380px; }
.ai-msg { display: flex; flex-direction: column; gap: 0.3rem; }
.ai-msg .who { font-family: 'JetBrainsMono'; font-size: 0.66rem; color: var(--muted2); text-transform: uppercase; letter-spacing: 0.1em; }
.ai-msg.bot .who { color: var(--accent); }
.ai-msg .bubble { font-size: 0.84rem; line-height: 1.6; padding: 0.7rem 0.9rem; border-radius: 8px; }
.ai-msg.user .bubble { background: var(--bg3); color: var(--ink2); border: 1px solid var(--rule); }
.ai-msg.bot .bubble { background: var(--accent-dim); color: var(--ink2); border: 1px solid rgba(0,229,199,0.2); }
.ai-msg.bot .bubble .notcovered { color: var(--warn); font-family: 'JetBrainsMono'; font-size: 0.78rem; display: block; margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px dashed var(--rule2); }
.ai-msg.bot .bubble .sugg { color: var(--accent2); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.cursor { display: inline-block; width: 7px; height: 1em; background: var(--accent); vertical-align: text-bottom; animation: blink 0.9s infinite; margin-left: 1px; }
@keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
.ai-suggest { padding: 0 1rem 0.5rem; display: flex; flex-wrap: wrap; gap: 0.4rem; }
.ai-suggest .sq { font-family: 'JetBrainsMono'; font-size: 0.7rem; color: var(--muted); background: var(--bg3); border: 1px solid var(--rule2); padding: 0.3rem 0.6rem; border-radius: 4px; cursor: pointer; transition: all 0.15s; }
.ai-suggest .sq:hover { color: var(--accent); border-color: var(--accent); }
.ai-input { padding: 0.7rem 0.8rem 0.9rem; border-top: 1px solid var(--rule); display: flex; gap: 0.5rem; }
.ai-input input { flex: 1; font-family: 'JetBrainsMono'; font-size: 0.8rem; color: var(--ink2); background: var(--bg3); border: 1px solid var(--rule2); border-radius: 7px; padding: 0.55rem 0.8rem; outline: none; transition: border-color 0.15s; }
.ai-input input:focus { border-color: var(--accent); }
.ai-input input::placeholder { color: var(--muted2); }
.ai-input button { font-family: 'Jetektur','JetBrainsMono'; font-size: 0.78rem; color: var(--bg); background: var(--accent); border: none; border-radius: 7px; padding: 0.55rem 1rem; cursor: pointer; font-weight: 500; transition: opacity 0.15s; }
.ai-input button:disabled { opacity: 0.4; cursor: not-allowed; }

/* ===== Notes / Bookmark Bar ===== */
.action-bar { display: flex; align-items: center; gap: 0.7rem; margin: 2rem 0 0.5rem; padding-top: 1.4rem; border-top: 1px solid var(--rule); flex-wrap: wrap; }
.btn { font-family: 'Tektur','JetBrainsMono'; font-size: 0.82rem; padding: 0.5rem 1rem; border-radius: 7px; cursor: pointer; transition: all 0.16s; border: 1px solid var(--rule2); background: var(--bg2); color: var(--ink); display: inline-flex; align-items: center; gap: 0.4rem; }
.btn:hover { border-color: var(--muted2); color: var(--ink2); }
.btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 500; }
.btn.primary:hover { opacity: 0.85; }
.btn.saved { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
.notes-area { margin-top: 1rem; }
.notes-area .notes-label { font-family: 'JetBrainsMono'; font-size: 0.68rem; color: var(--muted2); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 0.5rem; }
.notes-area textarea { width: 100%; min-height: 90px; font-family: 'JetBrainsMono'; font-size: 0.8rem; color: var(--ink2); background: var(--bg2); border: 1px solid var(--rule2); border-radius: 8px; padding: 0.8rem 1rem; resize: vertical; outline: none; line-height: 1.6; transition: border-color 0.15s; }
.notes-area textarea:focus { border-color: var(--accent); }
.notes-area textarea::placeholder { color: var(--muted2); }
.save-hint { font-family: 'JetBrainsMono'; font-size: 0.7rem; color: var(--green); margin-top: 0.4rem; opacity: 0; transition: opacity 0.3s; }
.save-hint.show { opacity: 1; }

/* ===== Learning Path ===== */
.path-wrap { padding: 2rem 0; }
.path-head { text-align: center; margin-bottom: 3rem; }
.path-head h1 { font-family: 'Tektur'; font-weight: 500; font-size: clamp(1.8rem,3.5vw,2.6rem); color: var(--ink2); margin-bottom: 0.6rem; letter-spacing: -0.02em; }
.path-head p { font-family: 'InstrumentSerif'; font-style: italic; font-size: 1.15rem; color: var(--muted); }

    id: 'alpha-decay', title: '什么是 Alpha 衰减', difficulty: '入门', factor: '估值', readTime: 6,

    sections: [
      { id:'s1', title:'什么是 Alpha', body:`<p>在 WorldQuant 语境下，<strong>Alpha</strong> 是一个横截面信号：它对一篮子股票的未来收益做排序预测。一个 alpha 表达式输入量价/基本面数据，输出每只股票的"预测超额收益"权重。</p><blockquote>"Alpha 不是预测涨跌，而是预测谁比谁涨得多。"</blockquote>` },
      { id:'s2', title:'为什么会衰减', body:`<p>Alpha 衰减（<strong>Decay</strong>）指同一个因子在样本外或实盘中，预测能力随时间持续下降。常见来源：</p><ul><li><strong>拥挤交易</strong>：因子被更多人使用后，套利机会被快速抹平</li><li><strong>结构变化</strong>：市场微观结构、监管、参与者结构变化</li><li><strong>过拟合</strong>：样本内参数对噪声拟合，样本外失效</li><li><strong>数据老化</strong>：信号依赖的数据源更新延迟或质量下降</li></ul>` },
      { id:'s3', title:'如何检测衰减', body:`<p>最直观的方法是看<strong>滚动 Sharpe</strong> 与<strong>累计 PnL 斜率</strong>。如果一条 PnL 曲线前期陡峭、后期走平甚至回撤，就是典型衰减信号。</p><div class="chart-box"><div class="chart-title">累计 PnL · 典型衰减形态</div><div class="chart-canvas" data-chart="decay"></div></div><p>也可按年/季度分窗口计算 IC（信息系数），若 IC 单调下降则衰减成立。</p>` },
      { id:'s4', title:'如何缓解', body:`<p>衰减不可消除，但可延缓：</p><ol><li><strong>降低换手</strong>：用平滑/滞后减少交易，减少被前置套利</li><li><strong>组合因子</strong>：把衰减快的因子与稳定的因子加权组合</li><li><strong>动态权重</strong>：根据近期表现给因子分配时变权重</li><li><strong>数据迭代</strong>：引入新的另类数据源补充信息量</li></ol><blockquote>接受衰减，管理衰减，而不是消灭它。</blockquote>` },
    ],
    qa: [
      { keywords:['衰减','什么','意思'], a:'Alpha 衰减指一个因子的预测能力随时间递减——前期 Sharpe 高，后期走平甚至回撤。常见来源是拥挤交易、结构变化、过拟合和数据老化。' },
      { keywords:['检测','怎么看','判断'], a:'看滚动 Sharpe 与累计 PnL 斜率：若曲线前期陡、后期走平就是衰减信号。也可按窗口计算 IC，IC 单调下降即衰减成立。' },
      { keywords:['消除','避免','解决','缓解'], a:'衰减不可消除但可延缓：降低换手、组合多个因子、用动态时变权重、引入新数据源。核心是"管理衰减"而非"消灭它"。' },
      { keywords:['ic','信息系数'], a:'IC（Information Coefficient）是因子值与未来收益的相关系数，通常看 rank IC。IC > 0.03 可用，> 0.05 算不错，> 0.1 较强但需警惕过拟合。' },

  {

    summary: 'Sharpe 衡量每单位风险带来的超额收益。本文讲清公式、WorldQuant 标准、与 IR 的区别。',
    pnl: [1.0,1.05,1.09,1.14,1.18,1.24,1.28,1.33,1.37,1.42],
    sections: [
      { id:'s1', title:'定义与公式', body:`<p><strong>Sharpe Ratio</strong> 衡量每单位波动率获得的超额收益：</p><div class="formula">$$Sharpe = \\frac{R_p - R_f}{\\sigma_p}$$</div><p>其中 $R_p$ 是组合收益，$R_f$ 是无风险利率，$\\sigma_p$ 是收益标准差。在 WorldQuant Brain 平台，通常年化处理。</p>` },
      { id:'s2', title:'WorldQuant 的标准', body:`<p>Brain 平台对提交的 alpha 有明确门槛：</p><ul><li><strong>Sharpe ≥ 1.25</strong>（In-sample 与 Out-of-sample 均需达标）</li><li><strong>换手率</strong>不超过 70%（视 region 而定）</li><li><strong>回撤</strong>合理，不应超过 10%</li><li><strong>Fitness</strong> ≥ 1.0（综合指标）</li></ul><blockquote>Sharpe 1.25 不是终点，而是提交的入场券。</blockquote>` },
      { id:'s3', title:'Sharpe vs 信息比率', body:`<p>两者很像但分母不同：</p><ul><li><strong>Sharpe</strong>：超额收益 / 总波动</li><li><strong>IR（Information Ratio）</strong>：主动收益 / 跟踪误差</li></ul><p>对纯多 alpha 看 Sharpe；对相对基准的增强策略看 IR。</p><div class="chart-box"><div class="chart-title">收益与波动可视化</div><div class="chart-canvas" data-chart="sharpe"></div></div>` },
      { id:'s4', title:'常见误区', body:`<ol><li><strong>只看 Sharpe 不看回撤</strong>：高 Sharpe 可能来自少数极端月份</li><li><strong>忽视样本外</strong>：IS Sharpe 2.0、OS Sharpe 0.5 是过拟合</li><li><strong>年化口径不一致</strong>：日频 ×√252，月频 ×√12</li></ol>` },
    ],
    qa: [
      { keywords:['多少','好','标准','门槛'], a:'WorldQuant Brain 要求 Sharpe ≥ 1.25（IS 和 OS 都要达标），换手率 ≤ 70%，回撤 < 10%，Fitness ≥ 1.0。1.25 是入场券，不是终点。' },
      { keywords:['ir','信息比率','区别'], a:'Sharpe = 超额收益/总波动；IR = 主动收益/跟踪误差。纯多 alpha 看 Sharpe，相对基准的增强策略看 IR。两者分母不同。' },
      { keywords:['公式','计算'], a:'Sharpe = (Rp - Rf) / σp。Rp 是组合收益，Rf 无风险利率，σp 收益标准差。日频年化乘 √252，月频乘 √12。' },
      { keywords:['误区','注意'], a:'常见误区：只看 Sharpe 不看回撤（可能来自极端月份）、忽视样本外（IS 2.0 / OS 0.5 是过拟合）、年化口径不一致（日频×√252，月频×√12）。' },

  {
    id: 'momentum-ts-cs', title: '动量因子实战：时序 vs 截面', difficulty: '进阶', factor: '动量', readTime: 9,

    sections: [
      { id:'s1', title:'动量假说', body:`<p>动量（<strong>Momentum</strong>）假说：过去一段时间表现好的资产，未来一段时间仍会表现好。行为金融解释是反应不足与羊群效应。</p>` },
      { id:'s2', title:'时序动量', body:`<p><strong>时序动量（Time-Series Momentum）</strong>：看资产自身过去 N 天的收益正负，正则做多、负则做空。</p><div class="code-block"><div class="code-head"><span class="lang">python</span><span class="copy" onclick="copyCode(this)">复制</span></div><pre><code><span class="c"># 时序动量信号</span>

weight = np.sign(signal)  <span class="c"># +1 做多, -1 做空</span></code></pre></div>` },
      { id:'s3', title:'截面动量', body:`<p><strong>截面动量（Cross-Sectional Momentum）</strong>：在同一时点对所有股票按过去收益排序，做多 top 分位、做空 bottom 分位。这正是 WorldQuant alpha 的标准范式。</p><div class="code-block"><div class="code-head"><span class="lang">python</span><span class="copy" onclick="copyCode(this)">复制</span></div><pre><code><span class="c"># 截面动量：去均值后的排序权重</span>
ret_20 = close.pct_change(20)
weight = ret_20.sub(ret_20.mean(axis=1), axis=0)
weight = weight.div(weight.abs().sum(axis=1), axis=0)</code></pre></div><div class="chart-box"><div class="chart-title">时序 vs 截面动量 PnL 对比</div><div class="chart-canvas" data-chart="momentum"></div></div>` },
      { id:'s4', title:'回测对比', body:`<ul><li><strong>时序动量</strong>：在趋势市表现好，震荡市回撤大；多头空头都开</li><li><strong>截面动量</strong>：市场中性，震荡市更稳；依赖横截面分散度</li><li><strong>衰减速度</strong>：时序动量衰减更快（拥挤），截面动量相对稳定</li></ul><blockquote>WorldQuant 的 alpha 默认是截面范式——预测相对排序，不是绝对方向。</blockquote>` },
    ],
    qa: [
      { keywords:['区别','时序','截面','不同'], a:'时序动量看资产自身过去收益正负（正做多负做空）；截面动量在同一时点对所有股票排序，做多 top 做空 bottom。时序在趋势市好但震荡市回撤大，截面市场中性更稳。' },
      { keywords:['哪个','更稳','稳定'], a:'截面动量相对更稳——它是市场中性的，震荡市回撤更小；时序动量衰减更快（拥挤交易）。WorldQuant alpha 默认用截面范式。' },
      { keywords:['代码','实现','怎么写'], a:'时序：signal=close.pct_change(20), weight=np.sign(signal)。截面：ret_20 减去横截面均值再归一化。详见正文代码块。' },
    ]

  {
    id: 'backtest-report', title: '回测报告怎么看', difficulty: '进阶', factor: '动量', readTime: 8,
    summary: '一份回测报告包含 PnL、回撤、换手、Sharpe、Fitness。本文逐项讲清每个指标的含义与红线。',
    pnl: [1.0,1.06,1.03,1.12,1.18,1.14,1.22,1.28,1.26,1.34],
    sections: [
      { id:'s1', title:'关键指标速查', body:`<p>WorldQuant Brain 回测报告核心字段：</p><ul><li><strong>Sharpe</strong>：风险调整收益，门槛 1.25</li><li><strong>Turnover</strong>：换手率，红线 70%</li><li><strong>Drawdown</strong>：最大回撤，建议 < 10%</li><li><strong>Fitness</strong>：综合分，≥ 1.0</li><li><strong>Returns</strong>：年化收益</li><li><strong>Margin</strong>：每笔交易平均利润</li></ul>` },
      { id:'s2', title:'PnL 曲线与回撤', body:`<p>PnL 曲线看<strong>斜率稳定性</strong>而非终点高度。一条平稳上升的曲线优于一条大起大落的曲线。回撤（<strong>Drawdown</strong>）是从历史高点的最大跌幅。</p><div class="chart-box"><div class="chart-title">PnL 与回撤</div><div class="chart-canvas" data-chart="backtest"></div></div>` },
      { id:'s3', title:'换手率', body:`<p>换手率衡量每日权重变化幅度。换手过高意味着交易成本侵蚀收益，也可能暗示信号不稳定。一般控制在 <strong>30%-50%</strong> 为佳。</p><blockquote>高换手 + 高 Sharpe = 过拟合的常见形态。</blockquote>` },
      { id:'s4', title:'Fitness 综合分', body:`<p>Fitness 是 Sharpe、回撤、换手的综合：</p><div class="formula">$$Fitness \\approx \\frac{Sharpe \\times \\sqrt{|Returns|/|Drawdown|}}{\\max(Turnover, 0.125)}$$</div><p>它惩罚高换手和大回撤，是比 Sharpe 更严格的单一指标。</p>` },

      { keywords:['sharpe','回撤','哪个','重要'], a:'两个都要看。Sharpe 衡量风险调整收益（门槛 1.25），回撤衡量最坏情况（建议<10%）。高 Sharpe 但回撤大可能是少数极端月份撑起来的，不可持续。' },

    sections: [

<span class="k">from</span> transformers <span class="k">import</span> pipeline
clf = pipeline(<span class="s">"sentiment-analysis"</span>)

function drawSpark(el, data, color){
  const w = el.clientWidth || 260, h = 34;
  const svg = `https://www.w3.org/2000/svg`;
  // 用 canvas 简单画
  const c = document.createElement('canvas');
  c.width = w * 2; c.height = h * 2; c.style.width=w+'px'; c.style.height=h+'px';
  const ctx = c.getContext('2d'); ctx.scale(2,2);
  const min = Math.min(...data), max = Math.max(...data);
  const px = (i)=> i*(w/(data.length-1));
  const py = (v)=> h - 4 - ((v-min)/(max-min||1))*(h-8);
  // area
  ctx.beginPath(); ctx.moveTo(px(0),h);
  data.forEach((v,i)=>ctx.lineTo(px(i),py(v)));
  ctx.lineTo(px(data.length-1),h); ctx.closePath();
  const g = ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0, color+'40'); g.addColorStop(1, color+'00');
  ctx.fillStyle = g; ctx.fill();
  // line
  ctx.beginPath(); data.forEach((v,i)=>{ i?ctx.lineTo(px(i),py(v)):ctx.moveTo(px(i),py(v)); });
  ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.stroke();
  el.innerHTML=''; el.appendChild(c);
}

function answerQuery(q, article){
  const ql = q.toLowerCase();
  let best = null, bestScore = 0;
  article.qa.forEach(item=>{
    let score = 0;
    item.keywords.forEach(k=>{ if(ql.includes(k.toLowerCase())) score++; });
    if(score > bestScore){ bestScore = score; best = item; }
  });
  if(best && bestScore > 0){
    return best.a;
  }
  // 未命中
  const related = ARTICLES.filter(x=>x.id!==article.id && (q.includes(x.factor)||x.qa.some(item=>item.keywords.some(k=>ql.includes(k.toLowerCase()))))).slice(0,2);
  let sugg = related.length ? `<span class="notcovered">⚠ 当前文章没覆盖这个点，已记下，未来会补充。</span>` + (related.length?`<br><br>相关推荐：`+related.map(r=>`<span class="sugg" data-go="${r.id}">${r.title}</span>`).join('、'):'') : `<span class="notcovered">⚠ 当前文章没覆盖这个点，已记下，未来会补充。</span>`;
  return sugg;
}

function typeWriter(html){
  const box = $('#aiMsgs');
  const div = document.createElement('div');
  div.className = 'ai-msg bot';
  div.innerHTML = `<span class="who">AI</span><div class="bubble"><span class="cursor"></span></div>`;
  box.appendChild(div);
  const bubble = div.querySelector('.bubble');
  box.scrollTop = box.scrollHeight;
  // 简化：直接显示（含 HTML 片段），用渐入
  setTimeout(()=>{
    bubble.innerHTML = html;
    box.scrollTop = box.scrollHeight;
    // 绑定推荐跳转
    bubble.querySelectorAll('.sugg').forEach(s=>s.onclick=()=>{ location.hash='#/article/'+s.dataset.go; });
    $('#aiSend').disabled = false;
  }, 500);
}

/* ---------- 图表 ---------- */
function renderCharts(article){
  const dark = { textStyle:{color:'#94A3B8'}, splitLine:{lineStyle:{color:'#1F2937'}} };
  $$('.chart-canvas').forEach(el=>{
    const type = el.dataset.chart;
    const chart = echarts.init(el);
    let opt;
    const dates = ['D1','D2','D3','D4','D5','D6','D7','D8','D9','D10'];
    if(type==='decay'){
      opt = { ...dark, tooltip:{trigger:'axis'}, grid:{left:40,right:20,top:20,bottom:30}, xAxis:{type:'category',data:dates,axisLine:{lineStyle:{color:'#2A3A4D'}}}, yAxis:{type:'value',...dark}, series:[{type:'line',data:article.pnl,smooth:true,symbol:'none',lineStyle:{color:'#00E5C7',width:2.5},areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(0,229,199,0.3)'},{offset:1,color:'rgba(0,229,199,0)'}])}}] };
    } else if(type==='sharpe'){
      const ret = article.pnl.map((v,i)=>i?(v/article.pnl[i-1]-1)*100:0);
      opt = { ...dark, tooltip:{trigger:'axis'}, grid:{left:40,right:20,top:20,bottom:30}, legend:{data:['累计净值','日收益'],textStyle:{color:'#94A3B8'},top:0}, xAxis:{type:'category',data:dates,axisLine:{lineStyle:{color:'#2A3A4D'}}}, yAxis:[{type:'value',...dark},{type:'value',...dark,axisLabel:{formatter:'{value}%'}}], series:[{name:'累计净值',type:'line',data:article.pnl,smooth:true,symbol:'none',lineStyle:{color:'#00E5C7',width:2.5}},{name:'日收益',type:'bar',yAxisIndex:1,data:ret,itemStyle:{color:'rgba(99,102,241,0.5)'}}] };
    } else if(type==='momentum'){
      const ts = [1.0,1.05,1.12,1.18,1.10,1.22,1.15,1.28,1.20,1.34];
      const cs = [1.0,1.03,1.06,1.10,1.14,1.18,1.22,1.26,1.31,1.36];
      opt = { ...dark, tooltip:{trigger:'axis'}, grid:{left:40,right:20,top:30,bottom:30}, legend:{data:['时序动量','截面动量'],textStyle:{color:'#94A3B8'},top:0}, xAxis:{type:'category',data:dates,axisLine:{lineStyle:{color:'#2A3A4D'}}}, yAxis:{type:'value',...dark}, series:[{name:'时序动量',type:'line',data:ts,smooth:true,symbol:'none',lineStyle:{color:'#F59E0B',width:2}},{name:'截面动量',type:'line',data:cs,smooth:true,symbol:'none',lineStyle:{color:'#00E5C7',width:2}}] };
    } else if(type==='backtest'){
      const pnl = article.pnl;
      const dd = []; let peak = pnl[0]; pnl.forEach(v=>{ peak=Math.max(peak,v); dd.push((v/peak-1)*100); });
      opt = { ...dark, tooltip:{trigger:'axis'}, grid:{left:40,right:20,top:30,bottom:30}, legend:{data:['累计PnL','回撤%'],textStyle:{color:'#94A3B8'},top:0}, xAxis:{type:'category',data:dates,axisLine:{lineStyle:{color:'#2A3A4D'}}}, yAxis:[{type:'value',...dark},{type:'value',...dark,axisLabel:{formatter:'{value}%'}}], series:[{name:'累计PnL',type:'line',data:pnl,smooth:true,symbol:'none',lineStyle:{color:'#00E5C7',width:2.5},areaStyle:{color:'rgba(0,229,199,0.1)'}},{name:'回撤%',type:'line',yAxisIndex:1,data:dd,smooth:true,symbol:'none',lineStyle:{color:'#EF4444',width:1.5}}] };
    } else if(type==='sentiment'){
      const sent = [0.3,-0.1,0.5,0.2,-0.3,0.6,0.4,-0.2,0.5,0.3];
      const ret = [0.8,-0.3,1.2,0.4,-0.6,1.5,0.9,-0.4,1.1,0.7];
      opt = { ...dark, tooltip:{trigger:'axis'}, grid:{left:50,right:20,top:30,bottom:30}, legend:{data:['情绪指数','次日收益%'],textStyle:{color:'#94A3B8'},top:0}, xAxis:{type:'category',data:dates,axisLine:{lineStyle:{color:'#2A3A4D'}}}, yAxis:[{type:'value',...dark},{type:'value',...dark,axisLabel:{formatter:'{value}%'}}], series:[{name:'情绪指数',type:'bar',data:sent,itemStyle:{color:p=>p.value>=0?'rgba(236,72,153,0.6)':'rgba(99,102,241,0.6)'}},{name:'次日收益%',type:'line',yAxisIndex:1,data:ret,smooth:true,symbol:'circle',symbolSize:5,lineStyle:{color:'#00E5C7',width:2},itemStyle:{color:'#00E5C7'}}] };
    } else if(type==='heatmap'){
      const factors = ['动量','反转','波动','换手','情绪'];
      const data = [];
      for(let i=0;i<5;i++) for(let j=0;j<5;j++) data.push([i,j, i===j?1: +(Math.random()*0.8-0.4).toFixed(2)]);
      opt = { ...dark, tooltip:{position:'top'}, grid:{left:60,right:20,top:20,bottom:60}, xAxis:{type:'category',data:factors,axisLabel:{color:'#94A3B8'}}, yAxis:{type:'category',data:factors,axisLabel:{color:'#94A3B8'}}, visualMap:{min:-1,max:1,calculable:true,orient:'horizontal',left:'center',bottom:0,textStyle:{color:'#94A3B8'},inRange:{color:['#6366F1','#1E2A38','#00E5C7']}}, series:[{type:'heatmap',data:data,label:{show:true,color:'#fff',fontSize:10},emphasis:{itemStyle:{shadowBlur:10}}}] };
    } else if(type==='fundflow'){
      const inflow = [120,80,-50,200,150,-30,180,90,-60,220];
      opt = { ...dark, tooltip:{trigger:'axis'}, grid:{left:50,right:20,top:20,bottom:30}, xAxis:{type:'category',data:dates,axisLine:{lineStyle:{color:'#2A3A4D'}}}, yAxis:{type:'value',...dark,axisLabel:{formatter:'{value}'}}, series:[{type:'bar',data:inflow,itemStyle:{color:p=>p.value>=0?'#F59E0B':'#EF4444'}}] };
    } else if(type==='roe'){
      const bins = ['<0','0-5','5-10','10-15','15-20','20-25','>25'];
      const cnt = [8,15,22,28,18,6,3];
      opt = { ...dark, tooltip:{trigger:'axis'}, grid:{left:40,right:20,top:20,bottom:30}, xAxis:{type:'category',data:bins,axisLabel:{color:'#94A3B8'}}, yAxis:{type:'value',...dark}, series:[{type:'bar',data:cnt,itemStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'#10B981'},{offset:1,color:'rgba(16,185,129,0.2)'}])}}] };
    }
    chart.setOption(opt);
    window.addEventListener('resize',()=>chart.resize());
  });
}

/* ---------- 视图：收藏夹 ---------- */
function renderBookmarks(){
  const app = $('#app');
  const bm = store.get('bookmarks', []);
  const notes = store.get('notes', {});
  const list = ARTICLES.filter(a=>bm.includes(a.id));
  app.innerHTML = `
    <div class="bm-wrap">
      <div class="bm-head">
        <h1>我的收藏</h1>
        <p>已收藏 ${list.length} 篇文章 · 全部存储在浏览器本地</p>
      </div>
      <div class="bm-list" id="bmList"></div>
    </div>
  `;
  const box = $('#bmList');
  if(!list.length){
    box.innerHTML = `<div class="bm-empty"><div class="ico">★</div><p>还没有收藏的文章</p><p>在文章详情页点击"收藏文章"即可加入</p><div class="go-plaza" onclick="location.hash='#/'">去文章广场 →</div></div>`;
    return;
  }
  box.innerHTML = list.map(a=>{
    const c = factorColor(a.factor);
    const note = notes[a.id] || '';
    return `<div class="bm-item" data-id="${a.id}">
      <div class="bm-tags">
        <span class="tag-diff ${a.difficulty}">${a.difficulty}</span>
        <span class="tag-factor" style="color:${c};border-color:${c}">${a.factor}</span>
      </div>
      <div class="bm-info">
        <div class="bm-title">${a.title}</div>
        ${note?`<div class="bm-note">✎ ${note.slice(0,60)}${note.length>60?'…':''}</div>`:'<div class="bm-note" style="color:var(--muted2)">未写笔记</div>'}
      </div>
      <span class="bm-remove" data-rm="${a.id}">移除</span>
    </div>`;
  }).join('');
  $$('.bm-item').forEach(it=>{ it.onclick=(e)=>{ if(!e.target.classList.contains('bm-remove')) location.hash='#/article/'+it.dataset.id; }; });
  $$('.bm-remove').forEach(r=>r.onclick=(e)=>{
    e.stopPropagation();
    let arr = store.get('bookmarks',[]); arr = arr.filter(x=>x!==r.dataset.rm);
    store.set('bookmarks',arr); updateBmCount(); renderBookmarks(); toast('已移除');
  });
}

/* ---------- 收藏数 ---------- */
function updateBmCount(){
  $('#bmCount').textContent = store.get('bookmarks',[]).length;
}

/* ---------- 复制代码 ---------- */
function copyCode(btn){
  const code = btn.closest('.code-block').querySelector('pre').textContent;
  navigator.clipboard.writeText(code).then(()=>{ const t=btn.textContent; btn.textContent='已复制'; setTimeout(()=>btn.textContent=t,1500); });
}

/* ---------- 启动 ---------- */
updateBmCount();
route();
</script>
