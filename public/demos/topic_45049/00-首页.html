<script src="assets/common.js"></script>
<script>
(function(){
  const prodAll=AgrUtils.ALL_PRODS;
  const priceBase=AgrUtils.PRICE_BASE;
  let cat='all';
  let kw='';
  function render(){
    const grid=document.getElementById('prodGrid');
    let list=prodAll.filter(n=>{
      const matchCat=(cat==='all')?true:((priceBase[n]&&priceBase[n].category)===cat);
      const matchKw=!kw?true:n.includes(kw);
      return matchCat&&matchKw;
    });
    grid.innerHTML=list.map(n=>{
      const b=priceBase[n];
      return`<div class="prod-item"><div>${n}</div><span class="unit">${b.category||''}</span></div>`;
    }).join('');
    document.getElementById('resultTip').textContent=list.length?`共 ${list.length} 项 · 当前筛选：${cat==='all'?'全部':cat}${kw?' · 关键词「'+kw+'」':''}`:'暂无匹配';
  }
  document.getElementById('catTabs').addEventListener('click',function(e){
    const tab=e.target.closest('.tab');if(!tab)return;
    document.querySelectorAll('#catTabs .tab').forEach(x=>x.classList.remove('active'));
    tab.classList.add('active');
    cat=tab.dataset.cat;render();
  });
  window.doSearch=function(){kw=document.getElementById('kw').value.trim();render();};
  document.getElementById('kw').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});
  render();
})();
</script>
</body>
</html>
