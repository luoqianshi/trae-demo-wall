<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>农业种养殖分析 · 2/5 位置选择</title>
<link rel="stylesheet" href="assets/common.css"/>
</head>
<body>
<div class="nav-top">
  <a style="font-size:12px;color:#7F8C8D;text-decoration:none;" href="00-首页.html">← 首页</a>
  <div class="title">📍 位置选择 · 2/5</div>
  <a style="font-size:12px;color:#2E7D32;text-decoration:none;" href="02-预核评分.html">下一页 →</a>
</div>
<div class="page">
  <div class="header">
    <h1>选择位置<span class="badge">4 级联动</span></h1>
    <p>省 → 市 → 区县 → 品种，全部选择后可直接跳转预核评分</p>
  </div>

  <div class="section">
    <div class="section-title">① 省份</div>
    <select id="selProv"></select>
  </div>
  <div class="section">
    <div class="section-title">② 城市</div>
    <select id="selCity"></select>
  </div>
  <div class="section">
    <div class="section-title">③ 区县</div>
    <select id="selDist"></select>
  </div>
  <div class="section">
    <div class="section-title">④ 品种</div>
    <div class="tabs" id="prodCat">
      <div class="tab active" data-cat="planting">种植</div>
      <div class="tab" data-cat="breeding">养殖</div>
    </div>
    <div id="prodGrid" class="prod-grid"></div>
  </div>

  <div class="section">
    <div class="section-title">当前选择</div>
    <div class="card-line"><span class="k">省份</span><span class="v" id="sProv">-</span></div>
    <div class="card-line"><span class="k">城市</span><span class="v" id="sCity">-</span></div>
    <div class="card-line"><span class="k">区县</span><span class="v" id="sDist">-</span></div>
    <div class="card-line"><span class="k">品种</span><span class="v" id="sProd">-</span></div>
    <div style="margin-top:14px;display:flex;gap:10px;">
      <a class="btn btn-secondary" style="text-decoration:none;text-align:center;flex:1;" href="00-首页.html">← 上一页</a>
      <a id="goNext" class="btn btn-primary" style="text-decoration:none;text-align:center;" href="02-预核评分.html">去预核评分 →</a>
    </div>
  </div>

  <div class="pager">
    <div class="d"></div><div class="d active"></div><div class="d"></div><div class="d"></div><div class="d"></div>
  </div>
  <div class="footer">共 5 页 · 当前 2/5 位置选择</div>
</div>

<script src="assets/common.js"></script>
<script>
(function(){
  const U=AgrUtils;
  const selProv=document.getElementById('selProv');
  const selCity=document.getElementById('selCity');
  const selDist=document.getElementById('selDist');
  const grid=document.getElementById('prodGrid');

  let state={province:'',city:'',district:'',prod:'',cat:'planting'};

  function init(){
    const provs=Object.keys(U.LOC_MAP);
    selProv.innerHTML=provs.map(p=>`<option>${p}</option>`).join('');
    state.province=provs[0];
    syncCity();
    syncDist();
    renderProd();
    updateSummary();
    selProv.addEventListener('change',()=>{state.province=selProv.value;syncCity();syncDist();updateSummary();});
    selCity.addEventListener('change',()=>{state.city=selCity.value;syncDist();updateSummary();});
    selDist.addEventListener('change',()=>{state.district=selDist.value;updateSummary();});
    document.getElementById('prodCat').addEventListener('click',e=>{
      const t=e.target.closest('.tab');if(!t)return;
      document.querySelectorAll('#prodCat .tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');state.cat=t.dataset.cat;renderProd();
    });
  }

  function syncCity(){
    const cities=U.LOC_MAP[state.province]||[];
    selCity.innerHTML=cities.map(c=>`<option>${c}</option>`).join('');
    state.city=cities[0]||'';
  }
  function syncDist(){
    const dsts=U.DIST_MAP[state.city]||['默认区县'];
    selDist.innerHTML=dsts.map(d=>`<option>${d}</option>`).join('');
    state.district=dsts[0]||'';
  }

  function renderProd(){
    const list=state.cat==='planting'?U.PLANTING:U.BREEDING;
    grid.innerHTML=list.map(n=>`<div class="prod-item" data-n="${n}">${n}</div>`).join('');
    grid.querySelectorAll('.prod-item').forEach(el=>{
      el.addEventListener('click',()=>{
        grid.querySelectorAll('.prod-item').forEach(x=>x.classList.remove('selected'));
        el.classList.add('selected');
        state.prod=el.dataset.n;
        updateSummary();
      });
    });
  }

  function updateSummary(){
    document.getElementById('sProv').textContent=state.province||'-';
    document.getElementById('sCity').textContent=state.city||'-';
    document.getElementById('sDist').textContent=state.district||'-';
    document.getElementById('sProd').textContent=state.prod||'-';
    const qs=[state.province,state.city,state.district,state.prod].filter(Boolean).map(encodeURIComponent).join('/');
    document.getElementById('goNext').href=state.prod?('02-预核评分.html#p='+qs):'02-预核评分.html';
  }

  function loadFromHash(){
    const hash=location.hash.replace(/^#p=/,'');
    if(hash){
      const parts=hash.split('/').map(decodeURIComponent);
      if(parts.length>=4){
        const [p,c,d,n]=parts;
        if(U.LOC_MAP[p]){
          selProv.value=p;state.province=p;syncCity();
          if(U.LOC_MAP[p].includes(c)){selCity.value=c;state.city=c;syncDist();}
          if((U.DIST_MAP[c]||[]).includes(d)){selDist.value=d;state.district=d;}
          if(U.ALL_PRODS.includes(n)){state.prod=n;state.cat=U.PLANTING.includes(n)?'planting':'breeding';renderProd();}
          updateSummary();
        }
      }
    }
  }
  init();loadFromHash();
})();
</script>
</body>
</html>
