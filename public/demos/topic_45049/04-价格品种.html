<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>农业种养殖分析 · 5/5 品种价格</title>
<link rel="stylesheet" href="assets/common.css"/>
<style>
.list-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#F8FAF7;border-radius:12px;margin-bottom:8px;border:1px solid #ECECEC;}
.list-row .name{font-weight:600;color:#2C3E2E;}
.list-row .cat{font-size:11px;color:#7F8C8D;margin-left:6px;}
.list-row .price{font-size:18px;font-weight:700;color:#2E7D32;margin-right:6px;}
.list-row .yoy{font-size:12px;padding:2px 8px;border-radius:8px;}
.list-row .yoy.up{background:#E8F5E9;color:#2E7D32;}
.list-row .yoy.down{background:#FFF3E0;color:#F57C00;}
</style>
</head>
<body>
<div class="nav-top">
  <a style="font-size:12px;color:#7F8C8D;text-decoration:none;" href="03-可视化.html">← 上一页</a>
  <div class="title">🛒 品种价格 · 5/5</div>
  <div style="width:60px;"></div>
</div>
<div class="page">
  <div class="header">
    <h1>品种市场价<span class="badge">月度更新</span></h1>
    <p>16 类品种 · 确定性价格 + 同比变化</p>
  </div>

  <div class="section">
    <div class="section-title">位置 / 筛选</div>
    <div class="row">
      <div class="flex-1"><label class="field">省份</label><select id="sp"></select></div>
      <div class="flex-1"><label class="field">城市</label><select id="sc"></select></div>
    </div>
    <div class="search-box" style="margin-top:10px;">
      <input type="text" id="kw" placeholder="搜索品种，如：大豆、生猪"/>
      <button class="go" onclick="refresh()">搜索</button>
    </div>
    <div class="tabs" id="catTabs">
      <div class="tab active" data-cat="all">全部</div>
      <div class="tab" data-cat="种植">种植</div>
      <div class="tab" data-cat="养殖">养殖</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">价格列表 <span id="cnt" style="font-weight:400;color:#7F8C8D;font-size:12px;margin-left:4px;"></span></div>
    <div id="priceList"></div>
  </div>

  <div class="section">
    <div class="section-title">各品类概览</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;">
      <div style="flex:1;min-width:130px;background:#E8F5E9;padding:12px;border-radius:10px;text-align:center;">
        <div style="font-size:22px;font-weight:700;color:#2E7D32;">8</div>
        <div style="font-size:12px;color:#555;">种植品种</div>
      </div>
      <div style="flex:1;min-width:130px;background:#FFF3E0;padding:12px;border-radius:10px;text-align:center;">
        <div style="font-size:22px;font-weight:700;color:#F57C00;">8</div>
        <div style="font-size:12px;color:#555;">养殖品种</div>
      </div>
      <div style="flex:1;min-width:130px;background:#E3F2FD;padding:12px;border-radius:10px;text-align:center;">
        <div style="font-size:22px;font-weight:700;color:#1976D2;">8</div>
        <div style="font-size:12px;color:#555;">主产区</div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">导航</div>
    <div class="row" style="gap:8px;">
      <a class="btn btn-secondary" style="text-decoration:none;text-align:center;flex:1;" href="03-可视化.html">← 上一页</a>
      <a class="btn btn-primary" style="text-decoration:none;text-align:center;flex:1;" href="00-首页.html">回到首页</a>
    </div>
  </div>

  <div class="pager">
    <div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d active"></div>
  </div>
  <div class="footer">
    共 5 页 · 当前 5/5 品种价格<br/>
    💡 体验结束 · 建议打包 Zip 上传参赛社区
  </div>
</div>

<script src="assets/common.js"></script>
<script>
(function(){
  const U=AgrUtils;
  const sp=document.getElementById('sp'),sc=document.getElementById('sc');
  let cat='all',kw='';
  function init(){
    sp.innerHTML=Object.keys(U.LOC_MAP).map(p=>`<option>${p}</option>`).join('');
    sp.addEventListener('change',()=>{sc.innerHTML=(U.LOC_MAP[sp.value]||[]).map(c=>`<option>${c}</option>`).join('');refresh();});
    sc.innerHTML=(U.LOC_MAP[sp.value]||[]).map(c=>`<option>${c}</option>`).join('');
    document.getElementById('catTabs').addEventListener('click',e=>{
      const t=e.target.closest('.tab');if(!t)return;
      document.querySelectorAll('#catTabs .tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');cat=t.dataset.cat;refresh();
    });
    document.getElementById('kw').addEventListener('keydown',e=>{if(e.key==='Enter')refresh();});
    refresh();
  }

  window.refresh=function(){
    kw=document.getElementById('kw').value.trim();
    let prices=U.GET_PRICES(sp.value,sc.value,kw);
    if(cat!=='all')prices=prices.filter(p=>p.category===cat);
    const wrap=document.getElementById('priceList');
    if(!prices.length){wrap.innerHTML='<div style="padding:16px;text-align:center;color:#7F8C8D;">暂无匹配品种</div>';return;}
    wrap.innerHTML=prices.map(p=>{
      const cls=p.yoyNum>=0?'up':'down';
      const sym=p.yoyNum>=0?'+':'';
      const unitTxt=p.category==='种植'?'元/吨':'元/公斤';
      return`<div class="list-row">
        <div><span class="name">${p.name}</span><span class="cat">${p.category} · ${unitTxt}</span></div>
        <div><span class="price">${p.price}</span><span class="yoy ${cls}">${sym}${p.yoyNum.toFixed(2)}%</span></div>
      </div>`;
    }).join('');
    document.getElementById('cnt').textContent=`· 当前筛选：${cat==='all'?'全部':cat}${kw?' · 关键词「'+kw+'」':''} · 共 ${prices.length} 项`;
  };

  function loadFromHash(){
    const hash=location.hash.replace(/^#p=/,'');
    if(hash){
      const parts=hash.split('/').map(decodeURIComponent);
      if(parts.length>=2){
        const [p,c]=parts;
        if(U.LOC_MAP[p]){sp.value=p;sc.innerHTML=(U.LOC_MAP[p]||[]).map(x=>`<option>${x}</option>`).join('');}
        if((U.LOC_MAP[p]||[]).includes(c))sc.value=c;
      }
      if(parts[3])document.getElementById('kw').value=parts[3];
      refresh();
    }
  }
  init();loadFromHash();
})();
</script>
</body>
</html>
