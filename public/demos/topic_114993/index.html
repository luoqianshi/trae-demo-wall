<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>蜉蝣 O2O — 一只蜉蝣的 Ocean to Ocean 之旅</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@200;300;400;600&display=swap');

*{margin:0;padding:0;box-sizing:border-box}

html,body{
  width:100%;height:100%;
  background:#0a0a10;
  overflow:hidden;
  font-family:'Noto Serif SC','ZCOOL XiaoWei',serif;
  cursor:none;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

canvas{display:block;position:absolute;top:0;left:0}
#game-canvas{z-index:1}
#fx-canvas{z-index:2;pointer-events:none;mix-blend-mode:screen}

/* ===== 自定义光标：墨点 ===== */
#cursor{
  position:fixed;
  width:18px;height:18px;
  border:1.5px solid rgba(180,200,220,0.4);
  border-radius:50%;
  pointer-events:none;
  z-index:100;
  transform:translate(-50%,-50%);
  transition:width 0.2s,height 0.2s,border-color 0.2s;
}
#cursor::before{
  content:'';
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:3px;height:3px;
  background:rgba(200,220,240,0.7);
  border-radius:50%;
}
#cursor.hover{
  width:32px;height:32px;
  border-color:rgba(100,200,255,0.6);
}

/* ===== 叙事文字：水墨意境 ===== */
#narrative{
  position:fixed;
  bottom:120px;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  pointer-events:none;
  z-index:20;
  opacity:0;
  transition:opacity 2s cubic-bezier(0.4,0,0.2,1);
}
#narrative.show{opacity:1}
#narrative .narr-line{
  color:rgba(220,230,240,0.9);
  font-family:'Ma Shan Zheng',cursive;
  font-size:26px;
  letter-spacing:8px;
  line-height:1.8;
  text-shadow:0 2px 30px rgba(100,150,200,0.2), 0 0 60px rgba(0,0,0,0.8);
  opacity:0;
  transform:translateY(15px);
  transition:all 1.2s cubic-bezier(0.4,0,0.2,1);
}
#narrative.show .narr-line.show{opacity:1;transform:translateY(0)}
#narrative .narr-sub{
  margin-top:12px;
  color:rgba(150,170,190,0.5);
  font-size:13px;
  letter-spacing:4px;
  opacity:0;
  transition:opacity 1.5s 0.5s;
}
#narrative.show .narr-sub.show{opacity:1}

/* ===== 顶部 HUD：极简水墨 ===== */
#hud{
  position:fixed;
  top:0;left:0;right:0;
  padding:24px 32px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  pointer-events:none;
  z-index:10;
  opacity:0;
  transition:opacity 1.5s;
}
#hud.show{opacity:1}
.hud-left,.hud-right{display:flex;flex-direction:column;gap:8px}
.hud-right{align-items:flex-end}
.hud-item{
  color:rgba(180,200,220,0.5);
  font-size:12px;
  letter-spacing:3px;
  font-weight:200;
}
.hud-item .hud-val{
  color:rgba(220,235,250,0.75);
  font-size:14px;
  margin-left:8px;
  letter-spacing:1px;
}
#hud .stage-name{
  font-family:'Ma Shan Zheng',cursive;
  font-size:22px;
  color:rgba(200,220,240,0.6);
  letter-spacing:6px;
}
.silicon-track{
  width:140px;height:3px;
  background:rgba(255,255,255,0.06);
  margin-top:6px;
  position:relative;
  overflow:hidden;
}
.silicon-track::before,.silicon-track::after{
  content:'';position:absolute;top:50%;width:4px;height:4px;
  background:rgba(255,255,255,0.15);border-radius:50%;transform:translateY(-50%);
}
.silicon-track::before{left:0}
.silicon-track::after{right:0}
.silicon-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,rgba(0,255,255,0.6),rgba(168,85,247,0.7),rgba(251,191,36,0.7));
  transition:width 1s cubic-bezier(0.4,0,0.2,1);
  box-shadow:0 0 8px rgba(100,200,255,0.3);
}

/* ===== 章节标题 ===== */
#chapter-title{
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  z-index:30;
  pointer-events:none;
  opacity:0;
  transition:opacity 2s;
}
#chapter-title.show{opacity:1}
.chapter-num{
  font-family:'Noto Serif SC',serif;
  font-weight:200;
  font-size:14px;
  color:rgba(150,180,210,0.4);
  letter-spacing:8px;
  margin-bottom:20px;
}
.chapter-name{
  font-family:'Ma Shan Zheng',cursive;
  font-size:72px;
  color:rgba(220,235,250,0.85);
  letter-spacing:16px;
  text-shadow:0 0 60px rgba(100,150,200,0.2);
}
.chapter-theme{
  margin-top:18px;
  font-size:14px;
  color:rgba(150,180,210,0.4);
  letter-spacing:6px;
}
.chapter-ink{
  margin:30px auto 0;
  width:80px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(150,180,210,0.3),transparent);
}

/* ===== 机体改造面板：水墨抽屉 ===== */
#body-panel{
  position:fixed;
  bottom:0;left:0;right:0;
  height:140px;
  background:linear-gradient(0deg,rgba(8,8,14,0.95) 0%,rgba(8,8,14,0.7) 70%,transparent 100%);
  z-index:8;
  display:none;
  align-items:center;
  justify-content:center;
  padding:0 40px 20px;
  gap:40px;
}
#body-panel.show{display:flex;animation:slideUp 0.8s cubic-bezier(0.4,0,0.2,1)}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.bp-section{display:flex;flex-direction:column;align-items:center;gap:8px}
.bp-label{
  color:rgba(150,180,210,0.4);
  font-size:11px;
  letter-spacing:4px;
}
.bp-slots{display:flex;gap:14px}
.bp-slot{
  width:54px;height:66px;
  border:1px solid rgba(150,180,210,0.12);
  border-radius:6px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  cursor:pointer;
  transition:all 0.35s cubic-bezier(0.4,0,0.2,1);
  position:relative;
  background:rgba(255,255,255,0.01);
}
.bp-slot:hover{border-color:rgba(200,220,240,0.25);background:rgba(255,255,255,0.03)}
.bp-slot.selected{
  border-color:rgba(100,200,255,0.5);
  box-shadow:0 0 20px rgba(100,200,255,0.1), inset 0 0 20px rgba(100,200,255,0.05);
}
.bp-slot .bs-icon{font-size:20px;opacity:0.3;transition:all 0.3s;margin-bottom:4px}
.bp-slot.filled .bs-icon{opacity:1}
.bp-slot .bs-name{font-size:10px;color:rgba(180,200,220,0.25);letter-spacing:1px;transition:all 0.3s}
.bp-slot.filled .bs-name{color:rgba(200,220,240,0.6)}
.bp-slot.tier-cyber{border-color:rgba(0,255,255,0.2)}
.bp-slot.tier-cyber.filled .bs-icon{color:#00ffff;text-shadow:0 0 8px rgba(0,255,255,0.4)}
.bp-slot.tier-silicon{border-color:rgba(168,85,247,0.25)}
.bp-slot.tier-silicon.filled .bs-icon{color:#c084fc;text-shadow:0 0 8px rgba(168,85,247,0.4)}
.bp-slot.tier-divine{border-color:rgba(251,191,36,0.3)}
.bp-slot.tier-divine.filled .bs-icon{color:#fbbf24;text-shadow:0 0 10px rgba(251,191,36,0.5)}

.bp-divider{
  width:1px;height:50px;
  background:linear-gradient(180deg,transparent,rgba(150,180,210,0.15),transparent);
}

.bp-inventory{display:flex;gap:10px;flex-wrap:wrap;max-width:420px;justify-content:center}
.bp-part{
  width:44px;height:56px;
  border:1px solid rgba(150,180,210,0.1);
  border-radius:5px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  cursor:pointer;
  transition:all 0.25s;
  background:rgba(255,255,255,0.01);
}
.bp-part:hover{transform:translateY(-3px);border-color:rgba(200,220,240,0.25)}
.bp-part .bp-icon{font-size:18px;margin-bottom:3px}
.bp-part .bp-name{font-size:9px;color:rgba(180,200,220,0.4);letter-spacing:0.5px}
.bp-part.cyber{border-color:rgba(0,255,255,0.2);box-shadow:0 0 12px rgba(0,255,255,0.06)}
.bp-part.cyber .bp-icon{color:#67e8f9}
.bp-part.silicon{border-color:rgba(168,85,247,0.25);box-shadow:0 0 12px rgba(168,85,247,0.08)}
.bp-part.silicon .bp-icon{color:#c084fc}
.bp-part.divine{border-color:rgba(251,191,36,0.3);box-shadow:0 0 12px rgba(251,191,36,0.1)}
.bp-part.divine .bp-icon{color:#fbbf24}

/* ===== 提示 ===== */
#hint{
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  background:rgba(10,10,18,0.85);
  color:rgba(220,230,240,0.75);
  padding:14px 32px;
  border:1px solid rgba(150,180,210,0.15);
  border-left:2px solid rgba(100,200,255,0.4);
  font-size:14px;
  letter-spacing:2px;
  pointer-events:none;
  opacity:0;
  transition:opacity 0.6s;
  z-index:25;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}
#hint.show{opacity:1}

/* ===== 过渡黑幕 ===== */
#transition{
  position:fixed;
  inset:0;
  background:#05050a;
  z-index:50;
  opacity:0;
  pointer-events:none;
  transition:opacity 2s cubic-bezier(0.4,0,0.6,1);
}
#transition.active{opacity:1;pointer-events:auto}

/* ===== 结局层 ===== */
#ending-layer{
  position:fixed;
  inset:0;
  z-index:40;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}
#ending-layer.show{display:flex}
.ending-choices{
  display:flex;
  gap:50px;
  opacity:0;
  transition:opacity 2s 1.5s;
}
.ending-choices.show{opacity:1}
.ending-choice{
  width:200px;height:280px;
  border:1px solid rgba(150,180,210,0.15);
  background:rgba(10,10,18,0.6);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  cursor:pointer;
  transition:all 0.5s cubic-bezier(0.4,0,0.2,1);
  position:relative;
  overflow:hidden;
}
.ending-choice::before{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,transparent 0%,rgba(100,200,255,0.03) 100%);
  opacity:0;
  transition:opacity 0.5s;
}
.ending-choice:hover::before{opacity:1}
.ending-choice:hover{
  border-color:rgba(200,220,240,0.3);
  transform:translateY(-5px);
}
.ending-choice.ascend:hover{border-color:rgba(251,191,36,0.4);box-shadow:0 0 40px rgba(251,191,36,0.1)}
.ending-choice.dew:hover{border-color:rgba(150,200,220,0.4);box-shadow:0 0 40px rgba(100,150,200,0.1)}
.ec-icon{font-size:40px;margin-bottom:24px;opacity:0.7}
.ending-choice.ascend .ec-icon{color:#fbbf24;text-shadow:0 0 20px rgba(251,191,36,0.5)}
.ending-choice.dew .ec-icon{color:#94a3b8}
.ec-name{
  font-family:'Ma Shan Zheng',cursive;
  font-size:28px;
  letter-spacing:8px;
  color:rgba(220,230,240,0.8);
  margin-bottom:14px;
}
.ec-desc{
  font-size:12px;
  color:rgba(150,170,190,0.5);
  letter-spacing:2px;
  line-height:2;
  text-align:center;
  padding:0 16px;
}

/* 结局画面 */
.ending-final{
  text-align:center;
  opacity:0;
  transition:opacity 2s 0.5s;
}
.ending-final.show{opacity:1}
.ef-title{
  font-family:'Ma Shan Zheng',cursive;
  font-size:84px;
  letter-spacing:24px;
  margin-bottom:40px;
  text-shadow:0 0 80px rgba(100,150,200,0.15);
}
.ef-title.ascend{
  background:linear-gradient(180deg,#fef3c7,#fbbf24,#a855f7,#22d3ee);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
.ef-title.dew{color:rgba(220,230,240,0.7)}
.ef-text{
  color:rgba(180,200,220,0.6);
  font-size:16px;
  letter-spacing:4px;
  line-height:2.4;
  max-width:480px;
  margin:0 auto;
}
.ef-text .ef-verse{
  font-family:'Ma Shan Zheng',cursive;
  font-size:20px;
  color:rgba(220,230,240,0.8);
  margin:20px 0;
  letter-spacing:6px;
}
.ef-restart{
  margin-top:60px;
  background:transparent;
  border:1px solid rgba(150,180,210,0.2);
  color:rgba(180,200,220,0.5);
  padding:12px 40px;
  font-size:14px;
  letter-spacing:4px;
  cursor:pointer;
  transition:all 0.4s;
  font-family:inherit;
  opacity:0;
  transition:opacity 1.5s 1s, all 0.4s;
}
.ef-restart.show{opacity:1}
.ef-restart:hover{
  border-color:rgba(200,220,240,0.4);
  color:rgba(220,230,240,0.8);
  background:rgba(255,255,255,0.02);
}

/* ===== 标题画面 ===== */
#title-screen{
  position:fixed;
  inset:0;
  z-index:45;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:opacity 2s;
}
#title-screen.hide{opacity:0;pointer-events:none}
.ts-ink-mountains{
  position:absolute;
  bottom:0;left:0;right:0;
  height:50%;
  opacity:0.6;
}
.ts-content{position:relative;z-index:2;text-align:center}
.ts-title{
  font-family:'Ma Shan Zheng',cursive;
  font-size:96px;
  color:rgba(220,235,250,0.9);
  letter-spacing:20px;
  text-shadow:0 2px 40px rgba(100,150,200,0.15);
  margin-bottom:20px;
}
.ts-subtitle{
  color:rgba(150,180,210,0.5);
  font-size:18px;
  letter-spacing:10px;
  font-weight:200;
  margin-bottom:60px;
}
.ts-tags{
  display:flex;
  gap:30px;
  justify-content:center;
  color:rgba(120,150,180,0.35);
  font-size:13px;
  letter-spacing:4px;
  margin-bottom:80px;
}
.ts-tags span::after{
  content:'·';
  margin-left:30px;
  color:rgba(120,150,180,0.2);
}
.ts-tags span:last-child::after{display:none}
.ts-start{
  color:rgba(150,180,210,0.4);
  font-size:14px;
  letter-spacing:6px;
  animation:breathe 3s ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{opacity:0.3}
  50%{opacity:0.8}
}
.ts-vertical{
  position:absolute;
  right:40px;
  top:50%;
  transform:translateY(-50%);
  writing-mode:vertical-rl;
  color:rgba(120,150,180,0.25);
  font-size:14px;
  letter-spacing:8px;
  line-height:2.5;
}
</style>
</head>
<body>

<canvas id="game-canvas"></canvas>
<canvas id="fx-canvas"></canvas>

<div id="cursor"></div>

<!-- 标题画面 -->
<div id="title-screen">
  <canvas class="ts-ink-mountains" id="title-mountains"></canvas>
  <div class="ts-content">
    <div class="ts-title">蜉蝣 O2O</div>
    <div class="ts-subtitle">一只蜉蝣的 Ocean to Ocean 之旅</div>
    <div class="ts-tags">
      <span>赛博水墨</span>
      <span>解谜</span>
      <span>东方哲思</span>
      <span>硅基飞升</span>
    </div>
    <div class="ts-start">点击任意处 · 开启旅程</div>
  </div>
  <div class="ts-vertical">朝生暮死 蜉蝣一日<br>从大西洋 到太平洋</div>
</div>

<!-- 章节标题 -->
<div id="chapter-title">
  <div class="chapter-num"></div>
  <div class="chapter-name"></div>
  <div class="chapter-ink"></div>
  <div class="chapter-theme"></div>
</div>

<!-- 叙事 -->
<div id="narrative">
  <div class="narr-line"></div>
  <div class="narr-sub"></div>
</div>

<!-- HUD -->
<div id="hud">
  <div class="hud-left">
    <div class="hud-item stage-name"></div>
    <div class="hud-item">时辰 <span class="hud-val" id="hud-time">00:00</span></div>
  </div>
  <div class="hud-right">
    <div class="hud-item">硅基化 <span class="hud-val" id="hud-silicon">0</span>%</div>
    <div class="silicon-track"><div class="silicon-fill" id="silicon-fill"></div></div>
  </div>
</div>

<!-- 机体改造面板 -->
<div id="body-panel">
  <div class="bp-section">
    <div class="bp-label">机 体</div>
    <div class="bp-slots" id="bp-slots"></div>
  </div>
  <div class="bp-divider"></div>
  <div class="bp-section">
    <div class="bp-label">收 藏</div>
    <div class="bp-inventory" id="bp-inventory"></div>
  </div>
</div>

<!-- 提示 -->
<div id="hint"></div>

<!-- 过渡 -->
<div id="transition"></div>

<!-- 结局层 -->
<div id="ending-layer"></div>

<script>
'use strict';

/* ================================================================
 *  蜉蝣 O2O — 赛博水墨解谜游戏
 *  Ocean to Ocean · Organic to Silicon
 * ================================================================ */

/* ---------- 工具 ---------- */
const $ = id => document.getElementById(id);
const lerp = (a,b,t) => a+(b-a)*t;
const clamp = (v,lo,hi) => Math.max(lo,Math.min(hi,v));
const rand = (a=0,b=1) => a+Math.random()*(b-a);
const randInt = (a,b) => Math.floor(rand(a,b+1));
const dist = (x1,y1,x2,y2) => Math.hypot(x2-x1,y2-y1);
const easeInOut = t => t<0.5?2*t*t:-1+(4-2*t)*t;

/* ---------- 水墨渲染工具 ---------- */
const InkTools = {
  /* 水墨晕染圆：多层径向渐变模拟墨染 */
  inkBlob(ctx, x, y, r, opts={}) {
    const layers = opts.layers || 5;
    const baseAlpha = opts.alpha ?? 0.15;
    const color = opts.color || '0,0,0';
    for (let i = layers; i >= 0; i--) {
      const t = i / layers;
      const rr = r * (0.3 + t * 0.9);
      const a = baseAlpha * (1 - t * 0.7);
      const grad = ctx.createRadialGradient(x, y, 0, x, y, rr);
      grad.addColorStop(0, `rgba(${color},${a})`);
      grad.addColorStop(0.5, `rgba(${color},${a*0.5})`);
      grad.addColorStop(1, `rgba(${color},0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, rr, 0, Math.PI*2);
      ctx.fill();
    }
  },

  /* 毛笔线条：变宽的曲线 */
  brushLine(ctx, x1, y1, x2, y2, opts={}) {
    const width = opts.width || 3;
    const color = opts.color || '0,0,0';
    const alpha = opts.alpha || 0.5;
    const steps = Math.ceil(dist(x1,y1,x2,y2) / 3);
    for (let i = 0; i < steps; i++) {
      const t = i / steps;
      const x = lerp(x1, x2, t);
      const y = lerp(y1, y2, t);
      const w = width * (0.5 + Math.sin(t*Math.PI) * 0.5) * rand(0.8, 1.2);
      ctx.fillStyle = `rgba(${color},${alpha * rand(0.7,1)})`;
      ctx.beginPath();
      ctx.arc(x, y, w/2, 0, Math.PI*2);
      ctx.fill();
    }
  },

  /* 水墨山脉：用多个墨点组成山脉轮廓 */
  inkMountain(ctx, baseY, width, height, opts={}) {
    const peaks = opts.peaks || 5;
    const color = opts.color || '20,25,35';
    const alpha = opts.alpha || 0.6;
    const complexity = opts.complexity || 2;

    ctx.fillStyle = `rgba(${color},${alpha})`;
    ctx.beginPath();
    ctx.moveTo(0, baseY);

    const pts = [];
    for (let i = 0; i <= peaks * complexity; i++) {
      const t = i / (peaks * complexity);
      const x = t * width;
      // 多频率正弦叠加产生自然山形
      let y = baseY - height * (
        Math.sin(t * peaks * Math.PI + rand(-0.2,0.2)) * 0.5 +
        Math.sin(t * peaks * 2.3 * Math.PI) * 0.25 +
        Math.sin(t * peaks * 5 * Math.PI) * 0.1
      );
      y *= rand(0.85, 1.15);
      pts.push({x, y});
    }

    ctx.moveTo(pts[0].x, baseY);
    pts.forEach(p => ctx.lineTo(p.x, p.y));
    ctx.lineTo(width, baseY);
    ctx.closePath();
    ctx.fill();

    // 墨染边缘：山脉底部渐变虚化
    const grad = ctx.createLinearGradient(0, baseY-height*0.5, 0, baseY);
    grad.addColorStop(0, `rgba(${color},0)`);
    grad.addColorStop(1, `rgba(${color},${alpha*0.5})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, baseY-height*0.5, width, height*0.5);

    return pts;
  },

  /* 雾气层：水平的雾带 */
  fogLayer(ctx, x, y, w, h, opts={}) {
    const alpha = opts.alpha || 0.08;
    const color = opts.color || '180,200,220';
    const grad = ctx.createLinearGradient(x, y-h/2, x, y+h/2);
    grad.addColorStop(0, `rgba(${color},0)`);
    grad.addColorStop(0.3, `rgba(${color},${alpha})`);
    grad.addColorStop(0.7, `rgba(${color},${alpha*0.7})`);
    grad.addColorStop(1, `rgba(${color},0)`);
    ctx.fillStyle = grad;
    ctx.fillRect(x, y-h/2, w, h);
  },
};

/* ---------- 音效 ---------- */
class Sfx {
  constructor(){ this.ctx=null; this.enabled=false; this.master=null; }
  init(){
    try {
      this.ctx = new (window.AudioContext||window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.15;
      this.master.connect(this.ctx.destination);
      this.enabled = true;
    } catch(e){}
  }
  _env(osc, g, t, a=0.02, d=0.1, s=0.3, r=0.3, peak=0.1){
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(peak, t+a);
    g.gain.linearRampToValueAtTime(peak*s, t+a+d);
    g.gain.exponentialRampToValueAtTime(0.001, t+a+d+r);
    osc.start(t); osc.stop(t+a+d+r+0.05);
  }
  // 水墨声：低沉的噪音
  ink(){
    if(!this.enabled) return;
    const c=this.ctx, t=c.currentTime;
    const buf = c.createBuffer(1, c.sampleRate*0.8, c.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*0.5;
    const src=c.createBufferSource(); src.buffer=buf;
    const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=300;
    const g=c.createGain();
    g.gain.setValueAtTime(0.2,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.8);
    src.connect(f).connect(g).connect(this.master);
    src.start(t); src.stop(t+0.8);
  }
  // 晶体叮
  crystal(pitch=1){
    if(!this.enabled) return;
    const c=this.ctx, t=c.currentTime;
    [0,1,2].forEach(i=>{
      const osc=c.createOscillator();
      osc.type='sine'; osc.frequency.value=800*pitch*Math.pow(2,i/12);
      const g=c.createGain();
      this._env(osc, g, t+i*0.05, 0.01, 0.1, 0.2, 0.6, 0.08);
      osc.connect(g).connect(this.master);
    });
  }
  // 拾取
  pickup(){
    if(!this.enabled) return;
    const c=this.ctx, t=c.currentTime;
    const osc=c.createOscillator();
    osc.type='triangle';
    osc.frequency.setValueAtTime(500,t);
    osc.frequency.exponentialRampToValueAtTime(1200,t+0.1);
    const g=c.createGain();
    this._env(osc,g,t,0.01,0.08,0.2,0.15,0.08);
    osc.connect(g).connect(this.master);
  }
  // 仙音：泛音
  divine(){
    if(!this.enabled) return;
    const c=this.ctx, t=c.currentTime;
    [523.25, 659.25, 783.99, 1046.5].forEach((f,i)=>{
      const osc=c.createOscillator();
      osc.type='sine'; osc.frequency.value=f;
      const g=c.createGain();
      g.gain.setValueAtTime(0,t+i*0.15);
      g.gain.linearRampToValueAtTime(0.05,t+i*0.15+0.2);
      g.gain.exponentialRampToValueAtTime(0.001,t+i*0.15+2);
      osc.connect(g).connect(this.master);
      osc.start(t+i*0.15); osc.stop(t+i*0.15+2.1);
    });
  }
  // 解谜成功
  solve(){
    if(!this.enabled) return;
    const c=this.ctx, t=c.currentTime;
    [440,554.37,659.25,880,1108.73].forEach((f,i)=>{
      const osc=c.createOscillator();
      osc.type='sine'; osc.frequency.value=f;
      const g=c.createGain();
      this._env(osc,g,t+i*0.1,0.02,0.1,0.3,0.5,0.06);
      osc.connect(g).connect(this.master);
    });
  }
  // 点触：轻响
  click(){
    if(!this.enabled) return;
    const c=this.ctx, t=c.currentTime;
    const osc=c.createOscillator();
    osc.type='sine'; osc.frequency.value=600;
    const g=c.createGain();
    this._env(osc,g,t,0.005,0.03,0,0.05,0.04);
    osc.connect(g).connect(this.master);
  }
}

/* ---------- 粒子系统 ---------- */
class Particles {
  constructor(max=400){ this.pool=[]; this.max=max; }
  emit(x,y,o={}){
    if(this.pool.length>=this.max) this.pool.shift();
    this.pool.push({
      x,y,
      vx:o.vx??rand(-1,1),
      vy:o.vy??rand(-2,-0.5),
      life:o.life??rand(0.8,2.5),
      maxLife:o.life??rand(0.8,2.5),
      size:o.size??rand(1,3.5),
      color:o.color||'150,180,210',
      gravity:o.gravity??0,
      type:o.type||'circle',
      fade:o.fade??'out',
    });
  }
  update(dt){
    for(let i=this.pool.length-1;i>=0;i--){
      const p=this.pool[i];
      p.x+=p.vx*dt*60;
      p.y+=p.vy*dt*60;
      p.vy+=p.gravity*dt;
      p.life-=dt;
      if(p.life<=0) this.pool.splice(i,1);
    }
  }
  render(ctx){
    this.pool.forEach(p=>{
      let a = clamp(p.life/p.maxLife,0,1);
      if(p.fade==='inout') a = Math.sin(a*Math.PI);
      ctx.globalAlpha = a * 0.7;
      ctx.fillStyle = `rgba(${p.color},${a})`;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.size* (p.fade==='out'?a:0.5+a*0.5), 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }
}

    this.transitionTimer = 0;

    // 蜉蝣

    this.bgFar = [];     // 远景（最慢）

    // UI
    this.selectedSlot = null;
    this.hoveredObj = null;

    // resize 在所有对象初始化之后
    this.resize();

    // 标题画面山脉
    this.renderTitleMountains();

    // 事件
    window.addEventListener('resize', () => this.resize());
    document.addEventListener('mousemove', e => this.onMouseMove(e));
    this.canvas.addEventListener('click', e => this.onClick(e));
    this.canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      const t = e.touches[0];
      this.onClick({clientX:t.clientX, clientY:t.clientY});
    }, {passive:false});

    $('title-screen').addEventListener('click', () => this.startGame());

    // 循环
    this.last = performance.now();
    requestAnimationFrame(t => this.loop(t));
  }

  resize(){
    this.W = window.innerWidth;
    this.H = window.innerHeight;
    this.canvas.width = this.W;
    this.canvas.height = this.H;
    this.fxCanvas.width = this.W;
    this.fxCanvas.height = this.H;

    this.fly.ty = this.H * 0.55;

    const c = $('title-mountains');

      {num:'CHAPTER 01', name:'拾 荒 者', theme:'生存与荒诞 · 水墨底色 × 赛博碎片'},
      {num:'CHAPTER 02', name:'觉 醒 者', theme:'探索与宿命 · 水墨山水 × 晶亮点缀'},
      {num:'CHAPTER 03', name:'登 仙 者', theme:'超越与选择 · 水墨仙境 × 硅基仙骨'},
    ][n];
    el.querySelector('.chapter-num').textContent = data.num;
    el.querySelector('.chapter-name').textContent = data.name;
    el.querySelector('.chapter-theme').textContent = data.theme;
    el.classList.add('show');
    this.sfx.divine();

    // 叙事
    setTimeout(()=> this.narrate(
      n===1 ? '朝生暮死，蜉蝣一日' :
      n===2 ? '山中有灵，硅骨初醒' : '仙路迢迢，飞升在即',
      n===1 ? '从大西洋出发，一只小虫子的大梦' :
      n===2 ? '远古的遗迹在等待' : '最终的选择即将到来'
    ), 2500);

    setTimeout(()=> el.classList.remove('show'), 5500);
  }

  /* ========== 叙事 ========== */
  narrate(main, sub='', duration=5){
    const el = $('narrative');
    const line = el.querySelector('.narr-line');
    const subEl = el.querySelector('.narr-sub');
    line.textContent = main;
    subEl.textContent = sub;
    line.classList.remove('show');
    subEl.classList.remove('show');
    el.classList.add('show');
    // 逐行显现
    requestAnimationFrame(()=>{
      setTimeout(()=> line.classList.add('show'), 100);
      if(sub) setTimeout(()=> subEl.classList.add('show'), 800);
    });
    clearTimeout(this._narrT);
    this._narrT = setTimeout(()=> el.classList.remove('show'), duration*1000);
  }

  hint(text, duration=2.5){
    const el = $('hint');
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(this._hintT);
    this._hintT = setTimeout(()=> el.classList.remove('show'), duration*1000);
  }

  /* ========== 机体改造 ========== */
  initBodyPanel(){
    const slotsEl = $('bp-slots');
    slotsEl.innerHTML = '';
    SLOT_ORDER.forEach(key => {
      const div = document.createElement('div');
      div.className = 'bp-slot';
      div.dataset.slot = key;
      div.innerHTML = `<div class="bs-icon">?</div><div class="bs-name">${SLOT_LABELS[key]}</div>`;
      div.addEventListener('click', () => this.selectSlot(key));
      slotsEl.appendChild(div);
    });
  }

  selectSlot(key){
    this.selectedSlot = key;
    this.sfx.click();
    document.querySelectorAll('.bp-slot').forEach(el => {
      el.classList.toggle('selected', el.dataset.slot === key);
    });
  }

  updateBodyPanel(){
    // 槽位
    document.querySelectorAll('.bp-slot').forEach(el => {
      const key = el.dataset.slot;
      const part = this.fly.slots[key];
      el.classList.toggle('filled', !!part);
      el.classList.remove('tier-cyber','tier-silicon','tier-divine');
      if(part) el.classList.add(`tier-${part.tier}`);
      el.querySelector('.bs-icon').textContent = part ? part.icon : '—';
      el.querySelector('.bs-name').textContent = part ? part.name : SLOT_LABELS[key];
    });

    // 背包
    const inv = $('bp-inventory');
    inv.innerHTML = '';
    if(this.fly.inventory.length === 0){
      inv.innerHTML = '<div style="font-size:11px;color:rgba(150,170,190,0.25);letter-spacing:2px;padding:18px 0">尚未拾取部件</div>';
    } else {
      this.fly.inventory.forEach((part, i) => {
        const div = document.createElement('div');
        div.className = `bp-part ${part.tier}`;
        div.innerHTML = `<div class="bp-icon">${part.icon}</div><div class="bp-name">${part.name}</div>`;
        div.title = `${part.name}\n${part.desc}`;
        div.addEventListener('click', () => this.equipPart(part));
        inv.appendChild(div);
      });
    }

    // 显示面板
    if(this.fly.inventory.length > 0 || Object.values(this.fly.slots).some(v=>v)){
      $('body-panel').classList.add('show');
    }

    // 硅基化
    this.updateSilicon();
  }

  equipPart(part){
    if(!this.selectedSlot){
      this.hint('先选择一个槽位');
      return;
    }
    if(part.slot !== this.selectedSlot){
      this.hint(`${part.name} 不能装在${SLOT_LABELS[this.selectedSlot]}槽`);
      return;
    }
    // 替换
    if(this.fly.slots[this.selectedSlot]){
      this.fly.inventory.push(this.fly.slots[this.selectedSlot]);
    }
    this.fly.slots[this.selectedSlot] = part;
    this.fly.inventory = this.fly.inventory.filter(p => p !== part);
    this.sfx.crystal(part.tier==='divine'?1.5:part.tier==='silicon'?1.2:1);
    this.hint(`装备 · ${part.name} — ${part.desc}`);

    // 装备特效粒子
    for(let i=0;i<30;i++){
      const ang = rand(0, Math.PI*2);
      const color = part.tier==='cyber'?'0,255,255':part.tier==='silicon'?'168,85,247':'251,191,36';
      this.particles.emit(this.fly.x, this.fly.y, {
        vx: Math.cos(ang)*rand(1,4),
        vy: Math.sin(ang)*rand(1,4),
        color, life: rand(0.5,1.2), size: rand(1,3),
      });
    }

    this.updateBodyPanel();
  }

  updateSilicon(){
    let total=0, si=0;
    Object.values(this.fly.slots).forEach(p => {
      if(p){ total++; si += p.tier==='cyber'?25:p.tier==='silicon'?60:100; }
    });
    this.fly.silicon = total>0 ? Math.round(si/(total*100)*100) : 0;
    $('hud-silicon').textContent = this.fly.silicon;
    $('silicon-fill').style.width = this.fly.silicon + '%';
  }

  /* ========== 突变 ========== */
  mutate(){
    const tiers = ['cyber','silicon','divine'];
    const tier = tiers[randInt(0,2)];
    const slot = SLOT_ORDER[randInt(0,3)];
    const entries = Object.entries(PARTS).filter(([k,v])=>v.tier===tier && v.slot===slot);
    if(!entries.length) return;
    const [id, def] = entries[randInt(0, entries.length-1)];
    const part = {...def, id};
    if(this.fly.slots[slot]) this.fly.inventory.push(this.fly.slots[slot]);
    this.fly.slots[slot] = part;
    this.hint(`突变！${part.name} 长入${SLOT_LABELS[slot]}`, 4);
    this.updateBodyPanel();
    this.sfx.divine();
  }

  /* ========== 交互 ========== */
  onMouseMove(e){
    this.mouseX = e.clientX;
    this.mouseY = e.clientY;
    const cur = $('cursor');
    cur.style.left = e.clientX + 'px';
    cur.style.top = e.clientY + 'px';

    if(this.state !== 'playing') return;
    const wx = e.clientX + this.cam.x;
    const wy = e.clientY;

    let hovered = null;
    for(const obj of this.interactables){
      if(obj.collected || obj.activated) continue;
      if(dist(wx, wy, obj.x, obj.y) < (obj.radius||35)){
        hovered = obj; break;
      }
    }
    this.hoveredObj = hovered;
    cur.classList.toggle('hover', !!hovered);
  }

  onClick(e){
    const x = e.clientX, y = e.clientY;
    if(this.state !== 'playing') return;
    this.sfx.click();

    const wx = x + this.cam.x;
    const wy = y;

    // 先检查交互物
    let interacted = false;
    for(const obj of this.interactables){
      if(obj.collected || obj.activated) continue;
      if(dist(wx, wy, obj.x, obj.y) < (obj.radius||35)){
        this.interact(obj);
        interacted = true;
        break;
      }
    }

    // 移动蜉蝣到点击位置
    if(!interacted){
      this.fly.tx = clamp(wx, 60, this.getStageWidth()-60);
      this.fly.ty = clamp(wy, 100, this.H-120);
      this.fly.facing = wx > this.fly.x ? 1 : -1;
    }

    // 检查出口
    if(wx > this.getStageWidth() - 80 && !interacted){
      if(!this.puzzle.solved){
        this.hint(this.stage===1 ? '前方能量屏障阻挡去路，需激活能量塔与控制台' :
                  this.stage===2 ? '石门紧闭，需唤醒祭坛与符文' :
                  '飞升之门未开，完成试炼方可通过');
      } else if(this.stage < 3){
        this.transitionTo(this.stage + 1);
      } else {
        this.showEndingChoice();
      }
    }
  }

  interact(obj){
    if(obj.type === 'pickup'){
      obj.collected = true;
      this.fly.inventory.push({...PARTS[obj.partId], id:obj.partId});
      this.sfx.pickup();
      this.hint(`拾取 · ${PARTS[obj.partId].name}`);

      const tier = PARTS[obj.partId].tier;
      const color = tier==='cyber'?'0,255,255':tier==='silicon'?'168,85,247':'251,191,36';
      for(let i=0;i<25;i++){
        const ang = rand(0, Math.PI*2);
        this.particles.emit(obj.x, obj.y, {
          vx: Math.cos(ang)*rand(1,4),
          vy: Math.sin(ang)*rand(1,4)-1,
          color, life: rand(0.5,1.2), size: rand(1,3.5),
        });
      }
      this.updateBodyPanel();
    }
    else if(obj.type === 'puzzle'){
      // 检查所需部件
      const hasReq1 = this.hasPart(obj.requires);
      const hasReq2 = !obj.requires2 || this.hasPart(obj.requires2);

      if(!hasReq1 || !hasReq2){
        const needed = [];
        if(!hasReq1) needed.push(PARTS[obj.requires].name);
        if(!hasReq2) needed.push(PARTS[obj.requires2].name);
        this.hint(`需要：${needed.join(' + ')}`);
        this.cam.shake = 8;
        return;
      }

      obj.activated = true;
      this.puzzle.steps[obj.puzzleId] = true;
      this.sfx.solve();
      this.hint(`${obj.name} · 已激活`);

      const color = this.stage===1?'0,255,255':this.stage===2?'168,85,247':'251,191,36';
      for(let i=0;i<50;i++){
        const ang = rand(0, Math.PI*2);
        const sp = rand(1,5);
        this.particles.emit(obj.x, obj.y, {
          vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp,
          color, life: rand(0.8,2), size: rand(1.5,4),
          gravity: -0.05,
        });
      }

      // 出口检查
      this.checkPuzzleSolved();
    }
  }

  hasPart(partId){
    // 检查是否装备了该部件
    return Object.values(this.fly.slots).some(p => p && p.id === partId);
  }

  checkPuzzleSolved(){
    const s = this.puzzle.steps;
    if(this.stage===1 && s.tower && s.panel){
      this.puzzle.solved = true;
      this.narrate('能量屏障消散', '前路已开');
      this.sfx.divine();
    }
    if(this.stage===2 && s.altar && s.runes){
      this.puzzle.solved = true;
      this.narrate('石门缓缓开启', '更深处的秘密在等待');
      this.sfx.divine();
    }
    if(this.stage===3 && s.gate){
      this.puzzle.solved = true;
      this.narrate('飞升之门开启', '太平洋就在前方');
      this.sfx.divine();
    }
  }

  transitionTo(stage){
    const tr = $('transition');
    tr.classList.add('active');
    this.sfx.ink();
    setTimeout(()=>{
      this.loadStage(stage);
    }, 1800);
    setTimeout(()=> tr.classList.remove('active'), 3600);
  }

  /* ========== 结局 ========== */

        <div style="color:rgba(150,180,210,0.5);font-size:14px;letter-spacing:4px">太平洋就在眼前</div>
      </div>
      <div class="ending-choices">
        <div class="ending-choice ascend" onclick="game.chooseEnding('ascend')">

  chooseEnding(type){
    this.endingType = type;
    this.endingTimer = 0;
    this.sfx.divine();

    const el = $('ending-layer');

            从此长生不老<br>
            但那只小小的蜉蝣<br>
            再也回不来了
          ` : `

            落日中，蜉蝣落在花瓣上<br>

  /* ========== 主循环 ========== */
  loop(ts){
    const dt = Math.min((ts - this.last)/1000, 0.05);
    this.last = ts;
    this.time += dt;
    this.dayTime = clamp(this.time / 800, 0, 1);

    this.update(dt);
    this.render();

    requestAnimationFrame(t => this.loop(t));
  }

  update(dt){
    if(this.state === 'title'){
      // 标题粒子
      if(rand(0,1) < 0.15){
        this.particles.emit(rand(0,this.W), rand(this.H*0.3,this.H*0.8), {
          vy: rand(-0.8,-0.2), color:'150,180,210',
          life: rand(2,4), size: rand(0.8,2.5), fade:'inout',
        });
      }
    }

    if(this.state === 'playing'){
      // 蜉蝣移动
      const f = this.fly;
      f.wingPhase += dt * (f.slots.wings ? 14 : 10);
      f.idlePhase += dt * 2;

      const dx = f.tx - f.x;
      const dy = f.ty - f.y;
      const d = Math.hypot(dx, dy);

      if(d > 4){
        const speed = f.baseSpeed * (1 + (f.slots.wings ? (f.slots.wings.tier==='divine'?0.8:f.slots.wings.tier==='silicon'?0.5:0.25) : 0));
        const mv = Math.min(speed*dt, d);
        f.x += (dx/d) * mv;
        f.y += (dy/d) * mv;
        f.facing = dx > 0 ? 1 : -1;
        // 飞行轨迹粒子
        if(rand(0,1) < 0.35){
          const tier = f.slots.wings?.tier;
          const color = tier==='cyber'?'0,255,255':tier==='silicon'?'168,85,247':tier==='divine'?'251,191,36':'200,220,240';
          this.particles.emit(f.x, f.y+5, {
            vx: rand(-0.5,0.5), vy: rand(0.5,1.5),
            color, life: rand(0.3,0.8), size: rand(0.8,2),
          });
        }
      } else {
        // 悬停时微微上下浮动
        f.y += Math.sin(f.idlePhase) * 0.3;
      }

      // 相机
      this.cam.tx = clamp(f.x - this.W * 0.4, 0, this.getStageWidth() - this.W);
      this.cam.x = lerp(this.cam.x, this.cam.tx, dt * 2.5);

      // 相机震动衰减
      this.cam.shake *= 0.88;

      // 环境粒子（按阶段）
      const spawnRate = this.stage===3 ? 0.25 : this.stage===2 ? 0.15 : 0.12;
      if(rand(0,1) < spawnRate){
        const color = this.stage===1?'80,120,150':this.stage===2?'168,85,247':'251,191,36';
        this.particles.emit(
          rand(this.cam.x-50, this.cam.x+this.W+50),
          rand(0, this.H*0.7),
          {
            vy: rand(-1.2,-0.3),
            vx: rand(-0.3,0.3),
            color,
            life: rand(1.5, 4),
            size: rand(0.5, 2.5),
            fade: 'inout',
          }
        );
      }

      // HUD 时间
      const gameMin = Math.floor(this.time);
      const mm = String(Math.floor(gameMin/60)).padStart(2,'0');
      const ss = String(gameMin%60).padStart(2,'0');
      $('hud-time').textContent = `${mm}:${ss}`;
    }

    // 结局计时
    if(this.state === 'ending' && this.endingType){
      this.endingTimer += dt;
      // 飞升粒子
      if(this.endingType === 'ascend'){
        for(let i=0;i<3;i++){
          const ang = rand(0, Math.PI*2);
          this.particles.emit(
            this.W/2 + Math.cos(ang)*rand(20,200),
            this.H + rand(0,50),
            {
              vx: Math.cos(ang)*rand(0.5,2),
              vy: rand(-5,-1.5),
              color: rand()>0.5?'251,191,36':'168,85,247',
              life: rand(1,3),
              size: rand(1,3),
              gravity: -0.05,
            }
          );
        }
      }
      // 朝露粒子
      if(this.endingType === 'dew'){
        if(rand(0,1)<0.3){
          this.particles.emit(
            rand(this.W*0.3, this.W*0.7),
            rand(this.H*0.55, this.H*0.65),
            {
              vx: rand(-0.3,0.3),
              vy: rand(-0.5,0.3),
              color: '255,180,160',
              life: rand(2,5),
              size: rand(0.5,2),
              fade: 'inout',
            }
          );
        }
      }
    }

    this.particles.update(dt);
  }

  /* ========== 渲染 ========== */
  render(){
    const ctx = this.ctx;
    const W = this.W, H = this.H;
    ctx.clearRect(0,0,W,H);

    if(this.state === 'title'){
      // 标题背景已由 CSS 处理
      this.particles.render(ctx);
      return;
    }

    // 震动偏移
    const sx = this.cam.shake ? rand(-this.cam.shake, this.cam.shake) : 0;
    const sy = this.cam.shake ? rand(-this.cam.shake, this.cam.shake) : 0;

    ctx.save();
    ctx.translate(sx, sy);

    // 天空渐变（昼夜）
    this.renderSky(ctx, W, H);

    // 远景层
    ctx.save();
    ctx.translate(-this.cam.x * 0.2, 0);
    this.renderBgLayer(ctx, this.bgFar, W, H);
    ctx.restore();

    // 雾气（远）
    if(this.stage >= 2){
      InkTools.fogLayer(ctx, -this.cam.x*0.3, H*0.5, this.getStageWidth()*1.2, H*0.12,
        {alpha:this.stage===3?0.08:0.06, color:this.stage===3?'200,180,220':'150,140,180'});
    }

    // 中景层
    ctx.save();
    ctx.translate(-this.cam.x * 0.5, 0);
    this.renderBgLayer(ctx, this.bgMid, W, H);
    ctx.restore();

    // 雾气（中）
    InkTools.fogLayer(ctx, -this.cam.x*0.6, H*0.65, this.getStageWidth()*1.2, H*0.15,
      {alpha:0.07, color:'180,200,220'});

    // 主世界：近景 + 交互物 + 蜉蝣
    ctx.save();
    ctx.translate(-this.cam.x, 0);

    this.renderBgLayer(ctx, this.bgNear, W, H);
    this.renderInteractables(ctx);
    this.renderMayfly(ctx);

    // 出口指示
    this.renderExit(ctx);

    this.particles.render(ctx);

    ctx.restore();

    // 顶雾（全屏）
    this.renderVignette(ctx, W, H);

    ctx.restore();

    // FX 层：光效
    this.renderFx();
  }

  renderSky(ctx, W, H){
    // 根据 dayTime 和 stage 调整天空色
    const palettes = {
      1: { top:[8,10,18], bot:[22,25,45] },     // 冷色夜
      2: { top:[15,10,30], bot:[35,25,55] },     // 紫调
      3: { top:[25,20,45], bot:[55,40,75] },     // 金紫仙境
    };
    const p = palettes[this.stage];
    const [r1,g1,b1] = p.top;
    const [r2,g2,b2] = p.bot;
    // 昼夜微调
    const day = this.dayTime;
    const bright = day < 0.7 ? 1 : 1 + (day-0.7)*0.5;

    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, `rgb(${r1*bright|0},${g1*bright|0},${b1*bright|0})`);
    grad.addColorStop(1, `rgb(${r2*bright|0},${g2*bright|0},${b2*bright|0})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    // 星星（第三阶段多点）
    const starCount = this.stage===3 ? 100 : this.stage===2 ? 60 : 40;
    for(let i=0;i<starCount;i++){
      const seed = i * 123.456;
      const x = (Math.sin(seed)*10000 % 1 + 1) * W;
      const y = (Math.cos(seed*0.7)*10000 % 1 + 1) * H * 0.5;
      const tw = Math.sin(this.time*2 + seed) * 0.3 + 0.7;
      ctx.fillStyle = `rgba(200,220,255,${0.15*tw})`;
      ctx.beginPath();
      ctx.arc(x, y, rand(0.5,1.5), 0, Math.PI*2);
      ctx.fill();
    }

    // 月亮/太阳
    const celestialX = W * (0.2 + day*0.6);
    const celestialY = H * (0.3 - Math.sin(day*Math.PI)*0.2);
    if(this.stage <= 2){
      // 月亮
      const mg = ctx.createRadialGradient(celestialX, celestialY, 0, celestialX, celestialY, 50);
      mg.addColorStop(0, 'rgba(220,225,240,0.15)');
      mg.addColorStop(0.5, 'rgba(200,210,230,0.05)');
      mg.addColorStop(1, 'transparent');
      ctx.fillStyle = mg;
      ctx.beginPath();
      ctx.arc(celestialX, celestialY, 50, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = 'rgba(220,225,240,0.2)';
      ctx.beginPath();
      ctx.arc(celestialX, celestialY, 15, 0, Math.PI*2);
      ctx.fill();
    }
  }

  renderBgLayer(ctx, layer, W, H){
    layer.forEach(obj => {
      // 视野裁剪粗略版
      if(obj.x !== undefined && obj.x < -300) return;
      if(obj.x !== undefined && obj.x > this.cam.x * (layer===this.bgFar?0.2:layer===this.bgMid?0.5:1) + W + 300) return;

      if(obj.type === 'building'){
        // 建筑
        ctx.fillStyle = `rgba(${obj.color},${obj.alpha})`;
        ctx.fillRect(obj.x, obj.y - obj.h, obj.w, obj.h);
        // 赛博描边
        ctx.strokeStyle = `rgba(0,255,255,${obj.alpha*0.12})`;
        ctx.lineWidth = 1;
        ctx.strokeRect(obj.x, obj.y - obj.h, obj.w, obj.h);
        // 窗户
        if(obj.hasWindows){
          const cols = Math.floor(obj.w / 16);
          const rows = Math.floor(obj.h / 22);
          for(let r=0;r<rows;r++){
            for(let c=0;c<cols;c++){
              if(Math.sin(r*7.3+c*3.1+obj.x*0.01) > 0.2){
                ctx.fillStyle = `rgba(0,255,255,${rand(0.02,0.06)*obj.alpha})`;
                ctx.fillRect(obj.x+4+c*16, obj.y-obj.h+8+r*22, 8, 12);
              }
            }
          }
        }
      }

      if(obj.type === 'wire'){
        // 悬链线
        ctx.strokeStyle = `rgba(${obj.color},${obj.alpha})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        const steps = 10;
        for(let i=0;i<=steps;i++){
          const t = i/steps;
          const x = obj.x + t*obj.len;
          const y = obj.y + Math.sin(t*Math.PI)*obj.sag;
          if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        }
        ctx.stroke();
      }

      if(obj.type === 'trash' || obj.type === 'pipe'){
        ctx.fillStyle = `rgba(${obj.color},${obj.alpha})`;
        ctx.beginPath();
        ctx.ellipse(obj.x, obj.y, obj.w/2, obj.h/2, 0, 0, Math.PI*2);
        ctx.fill();
      }

      if(obj.type === 'mountainRange'){
        InkTools.inkMountain(ctx, obj.y, obj.w, obj.h, {
          peaks: obj.peaks, color: obj.color.replace(/[()]/g,'').split(',').map(x=>x.trim()).join(','),
          alpha: obj.alpha, complexity: obj.complexity,
        });
      }

      if(obj.type === 'crystalCluster' || obj.type === 'bigCrystal' || obj.type === 'giantCrystal'){
        this.drawCrystal(ctx, obj.x, obj.y, obj.size, obj.color, obj.alpha);
      }

      if(obj.type === 'rock'){
        ctx.fillStyle = `rgba(${obj.color},${obj.alpha})`;
        ctx.beginPath();
        ctx.ellipse(obj.x, obj.y, obj.w/2, obj.h/2, 0, 0, Math.PI);
        ctx.fill();
      }

      if(obj.type === 'celestialPeak'){
        // 仙山：三角形 + 金色轮廓
        ctx.fillStyle = `rgba(${obj.color},${obj.alpha})`;
        ctx.beginPath();
        ctx.moveTo(obj.x - obj.w/2, obj.y);
        ctx.lineTo(obj.x, obj.y - obj.h);
        ctx.lineTo(obj.x + obj.w/2, obj.y);
        ctx.closePath();
        ctx.fill();

        if(obj.hasGold){
          ctx.strokeStyle = `rgba(251,191,36,${obj.alpha*0.25})`;
          ctx.lineWidth = 1.5;
          ctx.stroke();
          // 内部晶纹
          ctx.strokeStyle = `rgba(251,191,36,${obj.alpha*0.1})`;
          ctx.lineWidth = 0.5;
          for(let i=0;i<3;i++){
            const lx = obj.x - obj.w*0.2 + i*obj.w*0.2;
            ctx.beginPath();
            ctx.moveTo(lx, obj.y);
            ctx.lineTo(obj.x, obj.y - obj.h*0.5);
            ctx.stroke();
          }
        }
      }

      if(obj.type === 'palace'){
        // 仙宫
        ctx.fillStyle = `rgba(${obj.color},${obj.alpha})`;
        ctx.fillRect(obj.x-obj.w/2, obj.y, obj.w, obj.h);
        // 飞檐
        ctx.fillStyle = `rgba(251,191,36,${obj.alpha*0.3})`;
        ctx.beginPath();
        ctx.moveTo(obj.x-obj.w*0.6, obj.y);
        ctx.lineTo(obj.x, obj.y - obj.h*0.4);
        ctx.lineTo(obj.x+obj.w*0.6, obj.y);
        ctx.closePath();
        ctx.fill();
        // 柱子
        ctx.strokeStyle = `rgba(251,191,36,${obj.alpha*0.15})`;
        ctx.lineWidth = 1;
        for(let i=0;i<3;i++){
          const cx = obj.x - obj.w*0.3 + i*obj.w*0.3;
          ctx.beginPath();
          ctx.moveTo(cx, obj.y+5);
          ctx.lineTo(cx, obj.y+obj.h-5);
          ctx.stroke();
        }
      }

      if(obj.type === 'cloud'){
        obj.x += obj.speed * 0.016;
        if(obj.x > this.getStageWidth()*1.3) obj.x = -obj.w;
        const cg = ctx.createRadialGradient(obj.x, obj.y, 0, obj.x, obj.y, obj.w/2);
        cg.addColorStop(0, `rgba(255,255,255,${obj.alpha})`);
        cg.addColorStop(0.5, `rgba(255,255,255,${obj.alpha*0.5})`);
        cg.addColorStop(1, 'transparent');
        ctx.fillStyle = cg;
        ctx.beginPath();
        ctx.ellipse(obj.x, obj.y, obj.w/2, obj.h/2, 0, 0, Math.PI*2);
        ctx.fill();
      }

      if(obj.type === 'lightPillar'){
        const lg = ctx.createLinearGradient(obj.x, obj.y, obj.x, obj.y+obj.h);
        lg.addColorStop(0, `rgba(${obj.color},${obj.alpha*0.5})`);
        lg.addColorStop(1, `rgba(${obj.color},0)`);
        ctx.fillStyle = lg;
        ctx.fillRect(obj.x - obj.w/2, obj.y - obj.h, obj.w, obj.h*1.5);
      }
    });
  }

  drawCrystal(ctx, x, y, size, color, alpha){
    const t = this.time;
    ctx.save();
    ctx.translate(x, y);

    const points = 5;
    for(let i=0;i<points;i++){
      const a = (i/points)*Math.PI*2 + t*0.1;
      const len = size * (0.5 + Math.sin(i*2.3+t*0.5)*0.4);
      const tipX = Math.cos(a)*len;
      const tipY = Math.sin(a)*len*0.8 - size*0.3;

      const grad = ctx.createLinearGradient(0, 0, tipX, tipY);
      grad.addColorStop(0, `rgba(${color},${alpha*0.6})`);
      grad.addColorStop(1, `rgba(${color},${alpha*0.2})`);

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a+0.3)*size*0.3, Math.sin(a+0.3)*size*0.2);
      ctx.lineTo(tipX, tipY);
      ctx.lineTo(Math.cos(a-0.3)*size*0.3, Math.sin(a-0.3)*size*0.2);
      ctx.closePath();
      ctx.fill();
    }

    // 中心高光
    const hg = ctx.createRadialGradient(0, -size*0.1, 0, 0, -size*0.1, size*0.5);
    hg.addColorStop(0, `rgba(255,255,255,${alpha*0.5})`);
    hg.addColorStop(1, 'transparent');
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.arc(0, -size*0.1, size*0.5, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }

  renderInteractables(ctx){
    const t = this.time;
    this.interactables.forEach(obj => {
      if(obj.collected || obj.activated) return;
      const x = obj.x, y = obj.y;

      if(obj.type === 'pickup'){
        const part = PARTS[obj.partId];
        const tier = part.tier;
        const color = tier==='cyber'?'0,255,255':tier==='silicon'?'168,85,247':'251,191,36';
        const pulse = Math.sin(t*3 + obj.phase)*0.3+0.7;
        const bob = Math.sin(t*2 + obj.phase)*6;

        // 光晕
        const rg = ctx.createRadialGradient(x, y+bob, 0, x, y+bob, 40);
        rg.addColorStop(0, `rgba(${color},${0.2*pulse})`);
        rg.addColorStop(0.5, `rgba(${color},${0.08*pulse})`);
        rg.addColorStop(1, 'transparent');
        ctx.fillStyle = rg;
        ctx.beginPath();
        ctx.arc(x, y+bob, 40, 0, Math.PI*2);
        ctx.fill();

        // 部件图标（大一号）
        ctx.font = 'bold 28px serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = `rgba(${color},${0.8*pulse})`;
        ctx.shadowColor = `rgba(${color},0.5)`;
        ctx.shadowBlur = 12;
        ctx.fillText(part.icon, x, y+bob);
        ctx.shadowBlur = 0;

        // 名称
        ctx.font = '12px "Ma Shan Zheng", cursive';
        ctx.fillStyle = `rgba(${color},${0.4*pulse})`;
        ctx.fillText(part.name, x, y+bob+26);
      }

      if(obj.type === 'puzzle'){
        const tier = this.stage===1?'cyber':this.stage===2?'silicon':'divine';
        const color = tier==='cyber'?'0,255,255':tier==='silicon'?'168,85,247':'251,191,36';
        const pulse = Math.sin(t*2 + obj.phase)*0.25+0.75;

        // 外光晕
        const rg = ctx.createRadialGradient(x, y, 0, x, y, 70);
        rg.addColorStop(0, `rgba(${color},${0.12*pulse})`);
        rg.addColorStop(1, 'transparent');
        ctx.fillStyle = rg;
        ctx.beginPath();
        ctx.arc(x, y, 70, 0, Math.PI*2);
        ctx.fill();

        // 旋转几何
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(t * 0.3 + obj.phase);

        ctx.strokeStyle = `rgba(${color},${0.4*pulse})`;
        ctx.lineWidth = 2;

        // 外框
        ctx.beginPath();
        const sides = this.stage===1?4:this.stage===2?6:8;
        for(let i=0;i<sides;i++){
          const a = (i/sides)*Math.PI*2;
          const r = 35;
          const px = Math.cos(a)*r, py = Math.sin(a)*r;
          if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
        }
        ctx.closePath();
        ctx.stroke();

        // 内框反方向
        ctx.rotate(-t * 0.5);
        ctx.strokeStyle = `rgba(${color},${0.25*pulse})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        for(let i=0;i<sides;i++){
          const a = (i/sides)*Math.PI*2;
          const r = 20;
          const px = Math.cos(a)*r, py = Math.sin(a)*r;
          if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
        }
        ctx.closePath();
        ctx.stroke();

        // 中心点
        ctx.fillStyle = `rgba(${color},${0.6*pulse})`;
        ctx.beginPath();
        ctx.arc(0, 0, 5, 0, Math.PI*2);
        ctx.fill();

        ctx.restore();

        // 名称
        ctx.font = '13px "Ma Shan Zheng", cursive';
        ctx.textAlign = 'center';
        ctx.fillStyle = `rgba(${color},${0.5*pulse})`;
        ctx.fillText(obj.name, x, y+52);

        // 所需部件提示（悬停时不在这里做）
      }
    });
  }

  renderExit(ctx){
    const ex = this.getStageWidth() - 60;
    if(ex < this.cam.x - 100 || ex > this.cam.x + this.W + 100) return;

    const t = this.time;
    const solved = this.puzzle.solved;

    // 屏障
    ctx.save();
    const color = solved ? '100,255,150' : this.stage===1?'255,80,80':this.stage===2?'168,85,247':'251,191,36';

    // 虚线
    ctx.setLineDash([15, 10]);
    ctx.strokeStyle = `rgba(${color},${solved?0.6:0.4})`;
    ctx.lineWidth = 2;
    ctx.lineDashOffset = -t*30;
    ctx.beginPath();
    ctx.moveTo(ex, this.H*0.08);
    ctx.lineTo(ex, this.H*0.92);
    ctx.stroke();
    ctx.setLineDash([]);

    // 门
    if(solved){
      const g = ctx.createLinearGradient(ex-20, 0, ex+20, 0);
      g.addColorStop(0, 'transparent');
      g.addColorStop(0.5, `rgba(${color},0.08)`);
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.fillRect(ex-20, this.H*0.1, 40, this.H*0.8);

      ctx.font = '14px "Ma Shan Zheng", cursive';
      ctx.textAlign = 'center';
      ctx.fillStyle = `rgba(${color},0.6)`;
      ctx.fillText('→ 继续前行', ex, this.H*0.5);
    }

    ctx.restore();
  }

  /* ========== 蜉蝣渲染 ========== */
  renderMayfly(ctx){
    const f = this.fly;
    ctx.save();
    ctx.translate(f.x, f.y);

    const wingFlap = Math.sin(f.wingPhase);
    const hasWings = !!f.slots.wings;
    const wingTier = f.slots.wings?.tier;

    // 翅膀颜色
    let wingColor = '200,220,240';
    let wingAlpha = 0.35;
    if(wingTier==='cyber'){ wingColor='0,255,255'; wingAlpha=0.5; }
    else if(wingTier==='silicon'){ wingColor='168,85,247'; wingAlpha=0.4; }
    else if(wingTier==='divine'){ wingColor='251,191,36'; wingAlpha=0.3; }

    const wingSize = hasWings ? (wingTier==='divine'?32:wingTier==='silicon'?28:22) : 18;
    const wingY = wingFlap * (wingTier==='divine'?18:wingTier==='silicon'?14:10);

    // 翅膀（左）
    this.drawWing(ctx, -1, wingSize, wingY, wingColor, wingAlpha, wingTier);
    // 翅膀（右）
    this.drawWing(ctx, 1, wingSize, wingY, wingColor, wingAlpha, wingTier);

    // 身体：分节的水墨身体
    const bodyTiers = f.silicon > 60 ? 'divine' : f.silicon > 25 ? 'silicon' : f.slots.core ? 'cyber' : 'organic';
    const bodyColor = bodyTiers==='cyber'?'180,230,255':bodyTiers==='silicon'?'200,180,255':bodyTiers==='divine'?'250,220,160':'210,225,240';

    // 身体节段
    const segs = 5;
    for(let i=segs-1;i>=0;i--){
      const t = i/segs;
      const sy = lerp(-12, 12, t);
      const sr = lerp(5, 3, t);
      const alpha = lerp(0.9, 0.6, t);
      ctx.fillStyle = `rgba(${bodyColor},${alpha})`;
      ctx.beginPath();
      ctx.ellipse(0, sy, sr*1.1, sr*1.4, 0, 0, Math.PI*2);
      ctx.fill();
    }

    // 头部
    ctx.fillStyle = `rgba(${bodyColor},0.95)`;
    ctx.beginPath();
    ctx.ellipse(f.facing*3, -14, 5, 6, 0, 0, Math.PI*2);
    ctx.fill();

    // 感知系统
    if(f.slots.sensors){
      const sTier = f.slots.sensors.tier;
      const sColor = sTier==='cyber'?'0,255,255':sTier==='silicon'?'168,85,247':'251,191,36';
      ctx.fillStyle = sColor;
      ctx.shadowColor = sColor;
      ctx.shadowBlur = 6;
      // 两个复眼
      ctx.beginPath();
      ctx.arc(f.facing*1, -16, sTier==='divine'?3.5:sTier==='silicon'?3:2.5, 0, Math.PI*2);
      ctx.arc(f.facing*5, -15, sTier==='divine'?2.5:sTier==='silicon'?2:1.5, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;
    } else {
      // 原始眼点
      ctx.fillStyle = 'rgba(30,40,50,0.8)';
      ctx.beginPath();
      ctx.arc(f.facing*2, -15, 1.5, 0, Math.PI*2);
      ctx.fill();
    }

    // 核心
    if(f.slots.core){
      const cTier = f.slots.core.tier;
      const cColor = cTier==='cyber'?'0,255,255':cTier==='silicon'?'168,85,247':'251,191,36';
      const cs = cTier==='divine'?6:cTier==='silicon'?5:4;
      // 光晕
      const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, cs*3);
      cg.addColorStop(0, `rgba(${cColor},0.3)`);
      cg.addColorStop(1, 'transparent');
      ctx.fillStyle = cg;
      ctx.beginPath();
      ctx.arc(0, 0, cs*3, 0, Math.PI*2);
      ctx.fill();
      // 核心
      ctx.fillStyle = cColor;
      ctx.shadowColor = cColor;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(0, 0, cs, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;
      // 内丹旋转纹
      if(cTier==='divine'){
        ctx.strokeStyle = `rgba(255,255,255,0.4)`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(0, 0, cs+2, this.time*2, this.time*2+Math.PI);
        ctx.stroke();
      }
    }

    // 肢体（简略表现）
    if(f.slots.limbs){
      const lTier = f.slots.limbs.tier;
      const lColor = lTier==='cyber'?'0,255,255':lTier==='silicon'?'168,85,247':'251,191,36';
      ctx.strokeStyle = `rgba(${lColor},0.6)`;
      ctx.lineWidth = 1.5;
      for(let i=0;i<3;i++){
        const ly = -6 + i*8;
        ctx.beginPath();
        ctx.moveTo(-4, ly);
        ctx.lineTo(-10 - i*2, ly + 4 + wingFlap*2);
        ctx.moveTo(4, ly);
        ctx.lineTo(10 + i*2, ly + 4 + wingFlap*2);
        ctx.stroke();
      }
    } else {
      // 原生细腿
      ctx.strokeStyle = 'rgba(150,170,190,0.3)';
      ctx.lineWidth = 0.8;
      for(let i=0;i<3;i++){
        const ly = -4 + i*6;
        ctx.beginPath();
        ctx.moveTo(-3, ly);
        ctx.lineTo(-8, ly+3);
        ctx.moveTo(3, ly);
        ctx.lineTo(8, ly+3);
        ctx.stroke();
      }
    }

    // 整体光晕
    if(f.silicon > 0){
      const gColor = wingTier==='cyber'?'0,255,255':wingTier==='silicon'?'168,85,247':wingTier==='divine'?'251,191,36':'150,200,255';
      const rg = ctx.createRadialGradient(0, 0, 0, 0, 0, 25 + f.silicon*0.2);
      rg.addColorStop(0, `rgba(${gColor},${0.05 + f.silicon*0.002})`);
      rg.addColorStop(1, 'transparent');
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.arc(0, 0, 25 + f.silicon*0.2, 0, Math.PI*2);
      ctx.fill();
    }

    ctx.restore();
  }

  drawWing(ctx, side, size, yOffset, color, alpha, tier){
    ctx.save();
    ctx.translate(side * 6, -2);

    const wingFlap = yOffset / size;
    const scaleY = 0.4 + Math.abs(wingFlap) * 0.6;

    ctx.scale(side, 1);
    ctx.scale(1, scaleY);

    if(tier === 'cyber'){
      // 赛博翅膀：电路线条
      ctx.strokeStyle = `rgba(${color},${alpha+0.1})`;
      ctx.lineWidth = 1.2;
      ctx.setLineDash([3, 2]);
      ctx.beginPath();
      ctx.moveTo(0, -yOffset/scaleY);
      ctx.bezierCurveTo(
        size*0.4, -size*0.5 - yOffset/scaleY,
        size*0.8, -size*0.3 - yOffset/scaleY,
        size*0.9, size*0.2 - yOffset/scaleY
      );
      ctx.stroke();
      ctx.setLineDash([]);

      // 脉络
      ctx.strokeStyle = `rgba(${color},${alpha*0.6})`;
      ctx.lineWidth = 0.5;
      for(let i=0;i<3;i++){
        const tt = 0.2 + i*0.25;
        ctx.beginPath();
        ctx.moveTo(size*tt*0.3, -yOffset/scaleY*0.5);
        ctx.lineTo(size*tt, -size*0.3*tt - yOffset/scaleY*0.7);
        ctx.stroke();
      }

      // 填充（极淡）
      ctx.fillStyle = `rgba(${color},${alpha*0.2})`;
      ctx.beginPath();
      ctx.moveTo(0, -yOffset/scaleY);
      ctx.bezierCurveTo(
        size*0.3, -size*0.6 - yOffset/scaleY,
        size*0.9, -size*0.2 - yOffset/scaleY,
        size*0.85, size*0.3 - yOffset/scaleY
      );
      ctx.bezierCurveTo(
        size*0.5, size*0.1 - yOffset/scaleY,
        size*0.1, 5 - yOffset/scaleY,
        0, 0
      );
      ctx.closePath();
      ctx.fill();

    } else if(tier === 'silicon'){
      // 硅基翅膀：晶簇结构
      ctx.fillStyle = `rgba(${color},${alpha*0.5})`;
      // 主晶叶
      ctx.beginPath();
      ctx.moveTo(0, -yOffset/scaleY);
      ctx.lineTo(size, -size*0.2 - yOffset/scaleY);
      ctx.lineTo(size*0.8, size*0.3 - yOffset/scaleY);
      ctx.closePath();
      ctx.fill();

      // 晶纹
      ctx.strokeStyle = `rgba(${color},${alpha})`;
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(size*0.3, -size*0.1 - yOffset/scaleY);
      ctx.lineTo(size*0.7, size*0.1 - yOffset/scaleY);
      ctx.stroke();

      // 小晶刺
      for(let i=0;i<3;i++){
        const tt = 0.3 + i*0.25;
        ctx.fillStyle = `rgba(${color},${alpha*0.7})`;
        ctx.beginPath();
        ctx.moveTo(size*tt, -size*0.1*tt - yOffset/scaleY);
        ctx.lineTo(size*tt+4, -size*0.2*tt - yOffset/scaleY - 6);
        ctx.lineTo(size*tt+3, -size*0.05*tt - yOffset/scaleY);
        ctx.closePath();
        ctx.fill();
      }

    } else if(tier === 'divine'){
      // 仙化翅膀：薄如蝉翼，金色纹理
      // 大面积半透明
      const g = ctx.createLinearGradient(0, -yOffset/scaleY, size, size*0.2);
      g.addColorStop(0, `rgba(${color},${alpha*0.6})`);
      g.addColorStop(0.5, `rgba(${color},${alpha*0.3})`);
      g.addColorStop(1, `rgba(${color},${alpha*0.1})`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(0, -yOffset/scaleY);
      ctx.bezierCurveTo(
        size*0.3, -size*0.7 - yOffset/scaleY,
        size*0.9, -size*0.3 - yOffset/scaleY,
        size, size*0.25 - yOffset/scaleY
      );
      ctx.bezierCurveTo(
        size*0.5, size*0.4 - yOffset/scaleY,
        size*0.1, size*0.1 - yOffset/scaleY,
        0, 0
      );
      ctx.closePath();
      ctx.fill();

      // 脉络
      ctx.strokeStyle = `rgba(${color},${alpha*0.8})`;
      ctx.lineWidth = 0.8;
      for(let i=0;i<5;i++){
        const tt = i/4;
        ctx.beginPath();
        ctx.moveTo(0, -yOffset/scaleY);
        const ex = size * (0.6 + tt*0.35);
        const ey = (size*(-0.3 + tt*0.5)) - yOffset/scaleY;
        ctx.quadraticCurveTo(size*0.3 + tt*size*0.2, -size*0.5 - yOffset/scaleY, ex, ey);
        ctx.stroke();
      }

      // 边缘金边
      ctx.strokeStyle = `rgba(255,255,255,${alpha*0.5})`;
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(0, -yOffset/scaleY);
      ctx.bezierCurveTo(
        size*0.3, -size*0.7 - yOffset/scaleY,
        size*0.9, -size*0.3 - yOffset/scaleY,
        size, size*0.25 - yOffset/scaleY
      );
      ctx.stroke();

    } else {
      // 原生翅膀：半透明膜翅
      ctx.fillStyle = `rgba(${color},${alpha*0.4})`;
      ctx.beginPath();
      ctx.ellipse(size*0.5, -yOffset/scaleY - size*0.1, size*0.5, size*0.22, -0.1, 0, Math.PI*2);
      ctx.fill();

      ctx.strokeStyle = `rgba(${color},${alpha})`;
      ctx.lineWidth = 0.6;
      ctx.beginPath();
      ctx.ellipse(size*0.5, -yOffset/scaleY - size*0.1, size*0.5, size*0.22, -0.1, 0, Math.PI*2);
      ctx.stroke();
    }

    ctx.restore();
  }

  /* ========== FX 层 ========== */
  renderFx(){
    const ctx = this.fx;
    const W = this.W, H = this.H;
    ctx.clearRect(0,0,W,H);

    if(this.state !== 'playing') return;

    // 鼠标指向的轻微光效
    if(this.hoveredObj){
      const hx = this.hoveredObj.x - this.cam.x;
      const hy = this.hoveredObj.y;
      const t = this.time;
      // 涟漪
      for(let i=0;i<2;i++){
        const phase = (t*0.8 + i*0.5) % 1;
        const r = 10 + phase * 40;
        ctx.strokeStyle = `rgba(150,200,255,${(1-phase)*0.3})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(hx, hy, r, 0, Math.PI*2);
        ctx.stroke();
      }
    }
  }

  /* ========== 暗角 ========== */
  renderVignette(ctx, W, H){
    // 水墨晕染的暗角
    const vg = ctx.createRadialGradient(W/2, H*0.4, W*0.2, W/2, H/2, W*0.8);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(0.7, 'rgba(0,0,0,0.3)');
    vg.addColorStop(1, 'rgba(0,0,0,0.6)');
    ctx.fillStyle = vg;
    ctx.fillRect(0,0,W,H);
  }
}

/* ---------- 启动 ---------- */
const game = new Game();
</script>
