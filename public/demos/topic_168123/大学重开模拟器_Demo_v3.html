<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>大学重开模拟器</title>
<style>
  /* ============ 字体引入 ============ */
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@500;700;900&display=swap');

  /* ============ 主题变量 ============ */
  :root {
    --bg: #1a1a2e;
    --bg-deep: #12121f;
    --brand-1: #6D28D9;
    --brand-2: #7C3AED;
    --text: #f5f5fa;
    --text-dim: rgba(245, 245, 250, 0.6);
    --glass: rgba(255, 255, 255, 0.06);
    --glass-border: rgba(255, 255, 255, 0.12);
    --theme: #7C3AED;          /* 当前学期主题色，JS 动态切换 */
    --theme-soft: rgba(124, 58, 237, 0.18);
  }

  /* 学期主题色 */
  .sem-0 { --theme: #3B82F6; --theme-soft: rgba(59, 130, 246, 0.18); }
  .sem-1 { --theme: #10B981; --theme-soft: rgba(16, 185, 129, 0.18); }
  .sem-2 { --theme: #F59E0B; --theme-soft: rgba(245, 158, 11, 0.18); }
  .sem-3 { --theme: #A855F7; --theme-soft: rgba(168, 85, 247, 0.18); }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; }

  body {
    font-family: "Noto Sans SC", system-ui, -apple-system, sans-serif;
    color: var(--text);
    background: var(--bg);
    overflow: hidden;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  /* ============ 背景层 ============ */
  .bg-layer {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse at 20% 10%, var(--theme-soft) 0%, transparent 45%),
      radial-gradient(ellipse at 85% 90%, rgba(109, 40, 217, 0.22) 0%, transparent 50%),
      linear-gradient(160deg, var(--bg-deep) 0%, var(--bg) 60%, #0d0d18 100%);
    transition: background 1.2s ease;
  }
  /* 浮动几何装饰 */
  .floaters { position: fixed; inset: 0; z-index: 1; overflow: hidden; pointer-events: none; }
  .floater {
    position: absolute; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, var(--theme), transparent 70%);
    opacity: 0.14; filter: blur(2px);
    animation: drift 18s ease-in-out infinite;
  }
  .floater:nth-child(1){ width: 220px; height: 220px; left: -60px; top: 10%; animation-delay: 0s;}
  .floater:nth-child(2){ width: 140px; height: 140px; right: 8%; top: 18%; animation-delay: -4s; opacity:0.10;}
  .floater:nth-child(3){ width: 300px; height: 300px; left: 30%; bottom: -80px; animation-delay: -8s; opacity:0.08;}
  .floater:nth-child(4){ width: 90px; height: 90px; right: 20%; bottom: 12%; animation-delay: -12s; opacity:0.12;}
  @keyframes drift {
    0%,100% { transform: translate(0,0) scale(1); }
    33% { transform: translate(30px,-40px) scale(1.08); }
    66% { transform: translate(-25px,25px) scale(0.95); }
  }

  /* ============ 主容器 ============ */
  #app {
    position: relative; z-index: 2;
    height: 100%; width: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 18px;
  }
  .stage {
    width: 100%; max-width: 720px;
    display: flex; flex-direction: column;
    min-height: 0;
  }

  /* ============ 通用：打字机 ============ */
  .typewriter::after {
    content: "▍"; margin-left: 2px; opacity: 0.7;
    animation: blink 0.9s steps(1) infinite; color: var(--theme);
  }
  .typewriter.done::after { content: ""; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ============ 标题画面 ============ */
  .title-scene { text-align: center; }
  .title-scene .kicker {
    font-size: 13px; letter-spacing: 8px; text-transform: uppercase;
    color: var(--text-dim); margin-bottom: 22px; font-weight: 300;
  }
  .title-scene h1 {
    font-family: "Noto Serif SC", serif;
    font-weight: 900; font-size: clamp(38px, 9vw, 64px);
    letter-spacing: 4px; line-height: 1.2;
    background: linear-gradient(120deg, #fff 0%, #c4b5fd 50%, var(--theme) 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    min-height: 1.2em;
  }
  .title-scene .subtitle {
    margin-top: 18px; font-size: clamp(15px, 3.5vw, 18px);
    color: var(--text-dim); font-weight: 300; min-height: 1.7em;
  }
  .start-btn {
    margin-top: 56px;
    padding: 15px 52px; border: none; cursor: pointer;
    font-family: inherit; font-size: 16px; font-weight: 500; letter-spacing: 4px;
    color: #fff; border-radius: 999px;
    background: linear-gradient(120deg, var(--brand-1), var(--brand-2));
    box-shadow: 0 0 0 0 var(--theme-soft), 0 8px 30px rgba(109,40,217,0.45);
    animation: breathe 2.6s ease-in-out infinite;
    transition: transform 0.2s ease;
    opacity: 0; transform: translateY(10px);
  }
  .start-btn.show { opacity: 1; transform: translateY(0); transition: opacity .8s ease, transform .8s ease; }
  .start-btn:hover { transform: scale(1.05); }
  .start-btn:active { transform: scale(0.97); }
  @keyframes breathe {
    0%,100% { box-shadow: 0 0 0 0 rgba(124,58,237,0.5), 0 8px 30px rgba(109,40,217,0.45); }
    50% { box-shadow: 0 0 0 18px rgba(124,58,237,0), 0 8px 30px rgba(109,40,217,0.45); }
  }
  .title-scene .hint {
    margin-top: 28px; font-size: 12px; color: var(--text-dim); opacity: 0.6;
  }

  /* ============ 属性分配画面 ============ */
  .attr-scene { text-align: center; }
  .attr-scene .label {
    font-size: 13px; letter-spacing: 6px; color: var(--text-dim);
    margin-bottom: 8px; text-transform: uppercase;
  }
  .attr-scene h2 {
    font-family: "Noto Serif SC", serif; font-weight: 700;
    font-size: clamp(24px, 5vw, 32px); margin-bottom: 32px;
  }
  .attr-grid {
    display: grid; grid-template-columns: repeat(1, 1fr); gap: 14px;
    text-align: left;
  }
  .attr-row {
    display: grid; grid-template-columns: 90px 1fr 56px;
    align-items: center; gap: 14px;
    padding: 14px 18px; border-radius: 14px;
    background: var(--glass); border: 1px solid var(--glass-border);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    position: relative; overflow: hidden;
  }
  .attr-name { font-size: 15px; font-weight: 500; }
  .attr-name .ic { margin-right: 6px; }
  .attr-bar {
    height: 8px; border-radius: 999px;
    background: rgba(255,255,255,0.08); overflow: hidden;
  }
  .attr-fill {
    height: 100%; width: 0%; border-radius: 999px;
    background: linear-gradient(90deg, var(--brand-1), var(--theme));
    transition: width 0.08s linear;
  }
  .attr-val {
    font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 22px;
    text-align: right; color: var(--theme);
  }
  .attr-tooltip {
    position: absolute; left: 18px; bottom: -2px;
    font-size: 11px; color: var(--text-dim); opacity: 0;
    transition: opacity 0.25s; pointer-events: none;
  }
  .attr-row:hover .attr-tooltip { opacity: 0.85; }
  .attr-scene .continue-btn {
    margin-top: 36px; padding: 13px 44px; border: none; cursor: pointer;
    font-family: inherit; font-size: 15px; letter-spacing: 3px; color: #fff;
    border-radius: 999px;
    background: linear-gradient(120deg, var(--brand-1), var(--brand-2));
    box-shadow: 0 8px 26px rgba(109,40,217,0.4);
    transition: transform 0.2s ease; opacity: 0; pointer-events: none;
  }
  .attr-scene .continue-btn.show { opacity: 1; pointer-events: auto; transition: opacity .6s ease; }
  .attr-scene .continue-btn:hover { transform: scale(1.04); }
  .attr-scene .continue-btn:active { transform: scale(0.97); }

  /* ============ 事件画面 ============ */
  .event-scene { display: flex; flex-direction: column; height: 100%; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 22px; flex-shrink: 0;
  }
  .sem-tag {
    font-size: 13px; letter-spacing: 3px; padding: 6px 14px;
    border-radius: 999px; color: #fff; font-weight: 500;
    background: var(--theme-soft); border: 1px solid var(--theme);
  }
  .dots { display: flex; gap: 8px; }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: rgba(255,255,255,0.18); transition: all 0.3s;
  }
  .dot.active { background: var(--theme); transform: scale(1.3); box-shadow: 0 0 8px var(--theme); }
  .dot.done { background: rgba(255,255,255,0.4); }

  .event-title {
    font-family: "Noto Serif SC", serif; font-size: 18px; font-weight: 500;
    color: var(--text-dim); margin-bottom: 14px; letter-spacing: 1px;
  }
  .event-desc {
    font-size: clamp(16px, 3.6vw, 19px); line-height: 1.9; font-weight: 300;
    min-height: 120px; padding: 24px 26px; border-radius: 18px;
    background: var(--glass); border: 1px solid var(--glass-border);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    flex-shrink: 0; cursor: pointer;
    box-shadow: 0 10px 40px rgba(0,0,0,0.25);
  }
  .skip-hint { font-size: 11px; color: var(--text-dim); opacity: 0.5; text-align: right; margin-top: 6px; }

  .feedback {
    margin: 16px 0; padding: 14px 18px; border-radius: 14px;
    background: var(--theme-soft); border-left: 3px solid var(--theme);
    font-size: 15px; line-height: 1.8; font-weight: 300;
    opacity: 0; transform: translateY(8px); transition: all 0.4s ease;
  }
  .feedback.show { opacity: 1; transform: translateY(0); }

  .options { display: flex; flex-direction: column; gap: 12px; margin-top: auto; padding-top: 18px; }
  .opt-btn {
    padding: 16px 20px; border-radius: 14px; cursor: pointer;
    font-family: inherit; font-size: 16px; font-weight: 400; text-align: left;
    color: var(--text);
    background: var(--glass); border: 1px solid var(--glass-border);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: transform 0.2s ease, border-color 0.2s, background 0.2s;
    opacity: 0; transform: translateY(24px);
    display: flex; align-items: center; gap: 12px;
  }
  .opt-btn.show { opacity: 1; transform: translateY(0); transition: opacity .5s ease, transform .5s ease; }
  .opt-btn:hover { border-color: var(--theme); background: var(--theme-soft); transform: translateY(-2px); }
  .opt-btn:active { transform: scale(0.98); }
  .opt-btn .arrow { margin-left: auto; color: var(--theme); transition: transform 0.2s; }
  .opt-btn:hover .arrow { transform: translateX(4px); }

  /* 左下角属性面板 */
  .attr-panel {
    position: fixed; left: 18px; bottom: 18px; z-index: 5;
    padding: 12px 14px; border-radius: 12px;
    background: rgba(18,18,31,0.7); border: 1px solid var(--glass-border);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 12px; display: flex; gap: 12px; flex-wrap: wrap;
    max-width: 260px; transition: opacity 0.3s;
  }
  .attr-panel .pi { display: flex; align-items: center; gap: 4px; color: var(--text-dim); }
  .attr-panel .pi b { color: var(--text); font-weight: 500; }

  /* 属性变化飘动 */
  .delta {
    position: fixed; z-index: 50; pointer-events: none;
    font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 18px;
    animation: floatUp 1.4s ease-out forwards;
  }
  .delta.plus { color: #34d399; text-shadow: 0 0 10px rgba(52,211,153,0.6); }
  .delta.minus { color: #f87171; text-shadow: 0 0 10px rgba(248,113,113,0.6); }
  @keyframes floatUp {
    0% { opacity: 0; transform: translateY(0) scale(0.8); }
    20% { opacity: 1; transform: translateY(-10px) scale(1.1); }
    100% { opacity: 0; transform: translateY(-70px) scale(1); }
  }

  /* ============ 学期过渡 ============ */
  .transition-scene {
    position: fixed; inset: 0; z-index: 100;
    background: var(--bg-deep);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.7s ease;
  }
  .transition-scene.show { opacity: 1; pointer-events: auto; }
  .transition-scene .sem-name {
    font-family: "Noto Serif SC", serif; font-weight: 900;
    font-size: clamp(40px, 11vw, 80px); letter-spacing: 8px;
    background: linear-gradient(120deg, #fff, var(--theme));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    transform: translateY(20px); opacity: 0; transition: all 0.8s ease 0.2s;
  }
  .transition-scene.show .sem-name { transform: translateY(0); opacity: 1; }
  .transition-scene .sem-sub {
    margin-top: 14px; font-size: 14px; letter-spacing: 6px; color: var(--text-dim);
    opacity: 0; transition: opacity 0.8s ease 0.5s;
  }
  .transition-scene.show .sem-sub { opacity: 0.8; }

  /* ============ 结局画面 ============ */
  .ending-scene { text-align: center; }
  .ending-scene .end-icon { font-size: 56px; margin-bottom: 8px; }
  .ending-scene .end-kicker {
    font-size: 12px; letter-spacing: 8px; color: var(--text-dim); margin-bottom: 14px;
  }
  .ending-scene h2 {
    font-family: "Noto Serif SC", serif; font-weight: 900;
    font-size: clamp(30px, 7vw, 46px); letter-spacing: 3px;
    background: linear-gradient(120deg, #fff, var(--theme));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 28px;
  }
  .end-narrative {
    font-size: clamp(15px, 3.4vw, 17px); line-height: 2; font-weight: 300;
    text-align: left; padding: 22px 24px; border-radius: 16px;
    background: var(--glass); border: 1px solid var(--glass-border);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    min-height: 80px; margin-bottom: 22px;
  }
  .truth-card {
    position: relative; padding: 26px 24px; border-radius: 16px;
    background: linear-gradient(135deg, var(--theme-soft), rgba(255,255,255,0.03));
    border: 1px solid var(--theme); margin-bottom: 26px;
  }
  .truth-card .quote {
    font-family: "Noto Serif SC", serif; font-size: 36px; color: var(--theme);
    line-height: 0.5; opacity: 0.5;
  }
  .truth-card .truth-text {
    font-family: "Noto Serif SC", serif; font-size: clamp(17px, 4vw, 20px);
    font-weight: 500; line-height: 1.8; margin: 6px 0 0;
  }
  .truth-card .truth-label {
    font-size: 11px; letter-spacing: 4px; color: var(--theme); margin-top: 14px; opacity: 0.8;
  }
  .final-attrs {
    display: flex; justify-content: center; flex-wrap: wrap; gap: 10px;
    margin-bottom: 30px;
  }
  .fa-chip {
    padding: 7px 13px; border-radius: 999px; font-size: 12px;
    background: var(--glass); border: 1px solid var(--glass-border);
  }
  .fa-chip b { color: var(--theme); font-family: "Noto Serif SC", serif; }
  .fa-total {
    font-family: "Noto Serif SC", serif; font-weight: 700;
    padding: 7px 16px; border-radius: 999px; font-size: 13px;
    background: var(--theme-soft); border: 1px solid var(--theme); color: #fff;
  }
  .restart-btn {
    padding: 14px 46px; border: none; cursor: pointer;
    font-family: inherit; font-size: 15px; letter-spacing: 3px; color: #fff;
    border-radius: 999px;
    background: linear-gradient(120deg, var(--brand-1), var(--brand-2));
    box-shadow: 0 8px 26px rgba(109,40,217,0.4);
    transition: transform 0.2s ease;
  }
  .restart-btn:hover { transform: scale(1.04); }
  .restart-btn:active { transform: scale(0.97); }
  .ending-scene .ending-hint { margin-top: 20px; font-size: 12px; color: var(--text-dim); opacity: 0.6; }

  /* ============ 响应式 ============ */
  @media (max-width: 600px) {
    .attr-row { grid-template-columns: 78px 1fr 46px; padding: 12px 14px; }
    .attr-val { font-size: 19px; }
    .attr-panel { max-width: 200px; font-size: 11px; padding: 9px 11px; }
    .event-desc { padding: 18px 18px; }
    .opt-btn { padding: 14px 16px; font-size: 15px; }
  }
  @media (max-width: 380px) {
    .attr-panel { display: none; }
  }

  /* 无障碍：减少动画 */
  @media (prefers-reduced-motion: reduce) {
    .floater, .start-btn, .delta { animation: none !important; }
    * { transition-duration: 0.01ms !important; }
  }

  .hidden { display: none !important; }
</style>
</head>
<body>
  <!-- 背景层 -->
  <div class="bg-layer"></div>
  <div class="floaters">
    <div class="floater"></div><div class="floater"></div>
    <div class="floater"></div><div class="floater"></div>
  </div>

  <!-- 左下角属性面板 -->
  <div class="attr-panel hidden" id="attrPanel"></div>

  <!-- 主舞台 -->
  <div id="app"><div class="stage" id="stage"></div></div>

  <!-- 学期过渡层 -->
  <div class="transition-scene" id="transition">
    <div class="sem-name" id="transName"></div>
    <div class="sem-sub" id="transSub"></div>
  </div>

<script>
/* ============================================================
   大学重开模拟器 — 单文件 Demo
   说明：纯原生 JS 实现，数据驱动事件与结局
   ============================================================ */

/* ---------- 属性元信息 ---------- */
const ATTR_META = {
  charm:    { name: '魅力', icon: '✨', tip: '影响表白、社交第一印象' },
  iq:       { name: '智商', icon: '🧠', tip: '影响考试、实习、技能学习' },
  resource: { name: '资源', icon: '💎', tip: '影响可获得的机会与人脉' },
  luck:     { name: '运气', icon: '🍀', tip: '影响随机事件成败' },
  social:   { name: '社交', icon: '🤝', tip: '影响社团竞选、人脉积累' }
};

/* ---------- 学期信息 ---------- */
const SEMESTERS = [
  { name: '大一 · 上', sub: 'AUTUMN', color: 'sem-0' },
  { name: '大一 · 下', sub: 'SPRING', color: 'sem-1' },
  { name: '大二 · 上', sub: 'AUTUMN', color: 'sem-2' },
  { name: '大二 · 下', sub: 'SPRING', color: 'sem-3' }
];

/* ---------- 事件数据（4学期 × 3事件）----------
   option.effects: 属性增减
   option.flags:   条件标记设置
   option.cond:    选项是否可选的条件函数（返回布尔）
   option.outcome: 动态反馈（函数，返回 {feedback, effects, flags}）
------------------------------------------------ */
const EVENTS = [
  // ============ 大一上 ============
  [
    {
      title: '选专业方向',
      desc: '九月的阳光透过梧桐叶洒在柏油路上，你拖着行李箱走进宿舍。录取通知书上的专业并不是你的第一志愿。辅导员说，大一成绩好的同学可以申请转专业。摆在你面前的是一个选择：是接受现实先学着看，还是从第一天起就开始准备转专业？',
      options: [
        { text: '接受现实，先学着看', feedback: '你决定先适应现状，毕竟大学才刚开始，慢慢来也好。' },
        { text: '暗暗准备转专业', feedback: '你在心里埋下一颗种子：期末一定要拿到好成绩。', effects: { iq: 1 }, flags: { 准备转专业: true } }
      ]
    },
    {
      title: '军训社交',
      desc: '军训第三天，烈日当头。方阵休息时，旁边那个总是笑得很爽朗的同学主动递来一瓶水。你俩聊了几句，发现竟然是老乡。要不要趁这个机会多认识几个人？',
      options: [
        { text: '主动搭话，扩大圈子', feedback: '你和几个同学很快熟络起来，军训的日子好像也没那么难熬了。', effects: { social: 2 } },
        { text: '先休息，社恐发作', feedback: '你接过水道了声谢，靠在树荫下闭眼休息。一个人也挺好。' }
      ]
    },
    {
      title: '第一次期末考试',
      desc: '转眼到了期末周，图书馆里全是通宵复习的人。高数这门课你一直学得磕磕绊绊。室友喊你一起去自习室冲刺，但你也听说过有人纯靠运气也能过。怎么选？',
      options: [
        { text: '认真复习，去图书馆死磕', feedback: '连续一周泡在图书馆，你竟然把高数啃下来了。', effects: { iq: 1 } },
        { text: '靠运气，佛系迎考', outcome: (s) => s.attributes.luck >= 5
            ? { feedback: '运气不错，重点刚好都考了，你低空掠过。', effects: { luck: 1 } }
            : { feedback: '运气用光了，高数这门课…你挂了。补考见。', effects: { iq: -1 } } }
      ]
    }
  ],

  // ============ 大一下 ============
  [
    {
      title: '转专业抉择',

/* ============================================================
   游戏状态
   ============================================================ */
let state = null;

function newState() {
  return {
    sem: 0,          // 当前学期 0-3
    ev: 0,           // 当前学期内事件索引 0-2
    attributes: { charm: 0, iq: 0, resource: 0, luck: 0, social: 0 },
    flags: { 表白成功: false, 转专业: false, 准备转专业: false },
    history: []
  };
}

function total(s) {
  const a = s.attributes;
  return a.charm + a.iq + a.resource + a.luck + a.social;
}
const clampAttr = v => Math.max(0, Math.min(15, v));

/* ============================================================
   打字机引擎
   ============================================================ */
let typingTimer = null;
let typingTarget = null;     // { el, text, onDone, skipped }
const TYPE_SPEED = 50;

function typeWrite(el, text, onDone) {
  stopTyping();
  el.textContent = '';
  el.classList.add('typewriter');
  el.classList.remove('done');
  let i = 0;
  typingTarget = { el, text, onDone, done: false };
  typingTimer = setInterval(() => {
    if (!typingTarget || typingTarget.done) return;
    i++;
    el.textContent = text.slice(0, i);
    if (i >= text.length) finishTyping();
  }, TYPE_SPEED);
}

function stopTyping() {
  if (typingTimer) { clearInterval(typingTimer); typingTimer = null; }
}

function finishTyping() {
  if (!typingTarget) return;
  stopTyping();
  typingTarget.el.classList.add('done');
  const cb = typingTarget.onDone;
  typingTarget.done = true;
  typingTarget = null;
  if (cb) cb();
}

// 点击描述区可跳过打字
function skipTyping() {
  if (typingTarget && !typingTarget.done) {
    typingTarget.el.textContent = typingTarget.text;
    finishTyping();
    return true;
  }
  return false;
}

/* ============================================================
   工具
   ============================================================ */
const $ = id => document.getElementById(id);
const stage = $('stage');
const attrPanel = $('attrPanel');

function setSemesterClass(sem) {
  document.body.className = SEMESTERS[sem].color;
}

function renderAttrPanel() {
  attrPanel.innerHTML = Object.keys(ATTR_META).map(k => {
    const m = ATTR_META[k];
    return `<span class="pi">${m.icon}<b>${state.attributes[k]}</b></span>`;
  }).join('');
}

function showDelta(attr, delta) {
  if (delta === 0) return;
  const panel = attrPanel.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'delta ' + (delta > 0 ? 'plus' : 'minus');
  el.textContent = (delta > 0 ? '+' : '') + delta + ' ' + ATTR_META[attr].name;
  el.style.left = (panel.left + 10 + Math.random() * 120) + 'px';
  el.style.top = (panel.top - 6) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

function applyEffects(effects) {
  if (!effects) return;
  Object.keys(effects).forEach(k => {
    const old = state.attributes[k];
    state.attributes[k] = clampAttr(old + effects[k]);
    showDelta(k, effects[k]);
  });
  renderAttrPanel();
}

function applyFlags(flags) {
  if (!flags) return;
  Object.keys(flags).forEach(k => { state.flags[k] = flags[k]; });
}

function renderAttrAlloc() {
  setSemesterClass(0);
  attrPanel.classList.add('hidden');
  stage.innerHTML = `
    <div class="attr-scene">
      <div class="label">INITIAL ATTRIBUTES</div>
      <h2>命运正在为你随机分配属性…</h2>
      <div class="attr-grid" id="attrGrid"></div>
      <button class="continue-btn" id="contBtn">进 入 大 学</button>
    </div>`;
  const grid = $('attrGrid');
  const keys = Object.keys(ATTR_META);
  // 先渲染结构
  grid.innerHTML = keys.map(k => {
    const m = ATTR_META[k];
    return `<div class="attr-row" data-key="${k}">
      <div class="attr-name"><span class="ic">${m.icon}</span>${m.name}</div>
      <div class="attr-bar"><div class="attr-fill"></div></div>
      <div class="attr-val">0</div>
      <div class="attr-tooltip">${m.tip}</div>
    </div>`;
  }).join('');

  // 随机生成目标值（1-10）
  const targets = {};
  keys.forEach(k => { targets[k] = 1 + Math.floor(Math.random() * 10); });

  // 依次跳动
  const rows = grid.querySelectorAll('.attr-row');
  let idx = 0;
  function animateOne() {
    if (idx >= rows.length) {
      $('contBtn').classList.add('show');
      return;
    }
    const row = rows[idx];
    const k = row.dataset.key;
    const fill = row.querySelector('.attr-fill');
    const val = row.querySelector('.attr-val');
    const target = targets[k];
    let cur = 0;
    state.attributes[k] = target;
    const iv = setInterval(() => {
      cur += 1;
      if (cur >= target) { cur = target; clearInterval(iv); idx++; setTimeout(animateOne, 180); }
      val.textContent = cur;
      fill.style.width = (cur * 10) + '%';
    }, 70);
  }
  setTimeout(animateOne, 400);

  $('contBtn').addEventListener('click', () => {
    renderAttrPanel();
    attrPanel.classList.remove('hidden');
    transitionTo(0, () => renderEvent());
  });
}

/* ============================================================
   场景：事件
   ============================================================ */
function renderEvent() {
  setSemesterClass(state.sem);
  renderAttrPanel();
  const ev = EVENTS[state.sem][state.ev];
  stage.innerHTML = `
    <div class="event-scene">
      <div class="topbar">
        <div class="sem-tag" id="semTag"></div>
        <div class="dots" id="dots"></div>
      </div>
      <div class="event-title" id="evTitle"></div>
      <div class="event-desc" id="evDesc"></div>
      <div class="skip-hint">点击文字可跳过 ▸</div>
      <div class="feedback hidden" id="feedback"></div>
      <div class="options" id="options"></div>
    </div>`;
  $('semTag').textContent = SEMESTERS[state.sem].name;
  // 圆点
  $('dots').innerHTML = [0,1,2].map(i => {
    let cls = 'dot';
    if (i < state.ev) cls += ' done';
    else if (i === state.ev) cls += ' active';
    return `<span class="${cls}"></span>`;
  }).join('');

  // 打字显示事件标题与描述
  $('evTitle').textContent = '— ' + ev.title + ' —';
  const descEl = $('evDesc');
  descEl.addEventListener('click', () => { if (!skipTyping()) {} });

  typeWrite(descEl, ev.desc, () => {
    renderOptions(ev);
  });
}

function renderOptions(ev) {
  const box = $('options');
  // 过滤掉不满足条件的选项
  const opts = ev.options.filter(o => !o.cond || o.cond(state));
  box.innerHTML = '';
  opts.forEach((o, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = `<span>${o.text}</span><span class="arrow">▸</span>`;
    btn.addEventListener('click', () => chooseOption(ev, o));
    box.appendChild(btn);
    setTimeout(() => btn.classList.add('show'), i * 300);
  });
}

function chooseOption(ev, o) {
  // 停止可能还在进行的打字
  stopTyping();
  // 解析动态结果
  let feedback = o.feedback, effects = o.effects, flags = o.flags;
  if (o.outcome) {
    const r = o.outcome(state);
    feedback = r.feedback;
    effects = r.effects;
    flags = r.flags;
  }
  // 记录历史
  state.history.push({ sem: state.sem, ev: state.ev, title: ev.title, choice: o.text });
  // 应用效果与标记
  applyEffects(effects);
  applyFlags(flags);

  // 显示反馈，然后推进
  const fb = $('feedback');
  fb.textContent = feedback || '';
  fb.classList.remove('hidden');
  // 隐藏选项
  $('options').querySelectorAll('.opt-btn').forEach(b => b.style.pointerEvents = 'none');

  setTimeout(() => { fb.classList.add('show'); }, 10);

  // 1.8s 后进入下一事件或下一学期
  setTimeout(() => advance(), feedback ? 1900 : 600);
}

function advance() {
  state.ev++;
  if (state.ev >= 3) {
    // 当前学期结束
    state.ev = 0;
    state.sem++;
    if (state.sem >= 4) {
      // 全部结束，进入结局
      renderEnding();
      return;
    }
    transitionTo(state.sem, () => renderEvent());
  } else {
    renderEvent();
  }
}

/* ============================================================
   场景：学期过渡
   ============================================================ */
function transitionTo(sem, onDone) {
  const trans = $('transition');
  $('transName').textContent = SEMESTERS[sem].name;
  $('transSub').textContent = SEMESTERS[sem].sub + '  ·  SEMESTER ' + (sem + 1);
  setSemesterClass(sem);
  trans.classList.add('show');
  setTimeout(() => {
    trans.classList.remove('show');
    setTimeout(onDone, 700);
  }, 1900);
}

/* ============================================================
   场景：结局
   ============================================================ */
function renderEnding() {
  attrPanel.classList.add('hidden');
  // 判定结局
  const ending = ENDINGS.find(e => e.cond(state)) || ENDINGS[ENDINGS.length - 1];
  // 记录到 localStorage（已解锁结局）
  try {
    const unlocked = JSON.parse(localStorage.getItem('urs_unlocked') || '[]');
    if (!unlocked.includes(ending.id)) unlocked.push(ending.id);
    localStorage.setItem('urs_unlocked', JSON.stringify(unlocked));
  } catch (e) {}

  const t = total(state);
  const unlockedCount = (() => { try { return JSON.parse(localStorage.getItem('urs_unlocked')||'[]').length; } catch(e){ return 1; } })();

  stage.innerHTML = `
    <div class="ending-scene">
      <div class="end-icon">${ending.icon}</div>
      <div class="end-kicker">YOUR ENDING</div>
      <h2 id="endTitle"></h2>
      <div class="end-narrative" id="endNarr"></div>
      <div class="truth-card">
        <div class="quote">"</div>
        <div class="truth-text" id="truthText"></div>
        <div class="truth-label">大 学 真 相</div>
      </div>
      <div class="final-attrs" id="finalAttrs"></div>
      <button class="restart-btn" id="restartBtn">再 来 一 局</button>
      <div class="ending-hint">已解锁结局 ${unlockedCount} / ${ENDINGS.length}　·　不同选择会通向不同结局</div>
    </div>`;

  typeWrite($('endTitle'), ending.name, () => {
    typeWrite($('endNarr'), ending.narrative, () => {
      typeWrite($('truthText'), ending.truth, () => {
        // 显示最终属性
        const fa = $('finalAttrs');
        fa.innerHTML = Object.keys(ATTR_META).map(k =>
          `<span class="fa-chip">${ATTR_META[k].icon} ${ATTR_META[k].name} <b>${state.attributes[k]}</b></span>`
        ).join('') + `<span class="fa-total">总分 ${t}</span>`;
      });
    });
  });

  $('restartBtn').addEventListener('click', () => {
    state = newState();
    renderAttrAlloc();
  });
}
