<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#FAF8F5" />
<title>芽记 · 宝宝的成长日记</title>
<style>
  /* =========================================================
     Reset & Base
     ========================================================= */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", "Hiragino Sans GB", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 800px at 20% 0%, #E9DCC9 0%, transparent 60%),
      radial-gradient(1000px 700px at 100% 100%, #D4C2A6 0%, transparent 60%),
      linear-gradient(135deg, #E8DDD0 0%, #D9C7B0 100%);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: hidden;
    overscroll-behavior: none;
  }
  button { font-family: inherit; }
  img { display: block; }

  :root {
    --bg: #FAF8F5;
    --bg2: #F5F0EB;
    --bg3: #FBF7F2;
    --ink: #3D3229;
    --ink-soft: #5A4D42;
    --ink-faint: #7A6E63;
    --muted: #9A918A;
    --muted-light: #C5BBB2;
    --rule: #E8E0D8;
    --rule-soft: #F0EAE3;
    --accent: #A8C090;
    --accent-soft: #C8DCB5;
    --accent-softest: #EBF1E3;
    --accent2: #E8C4A2;
    --accent-dark: #7A9A6A;
    --danger: #D4847C;
    --white: #FFFFFF;

    /* Type scale (5 levels) */
    --fs-xs: 11px;
    --fs-sm: 12.5px;
    --fs-md: 14px;
    --fs-lg: 17px;
    --fs-xl: 20px;

    --shadow-sm: 0 2px 8px rgba(61, 50, 41, 0.04);
    --shadow: 0 4px 20px rgba(61, 50, 41, 0.06);
    --shadow-lg: 0 18px 50px rgba(61, 50, 41, 0.12);

    --radius: 14px;
    --radius-lg: 20px;
    --radius-pill: 999px;

    --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }

  /* =========================================================
     App container & phone frame
     ========================================================= */
  .app {
    width: 100%;
    max-width: 430px;
    height: 100dvh;
    max-height: 100dvh;
    margin: 0 auto;
    background: var(--bg);
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(0,0,0,0.08);
  }
  @media (min-width: 640px) {
    .app {
      margin: 28px auto;
      height: calc(100dvh - 56px);
      max-height: 920px;
      border-radius: 44px;
      border: 1px solid rgba(255,255,255,0.4);
      outline: 10px solid #1F1B17;
      outline-offset: -1px;
      box-shadow: 0 40px 90px rgba(20, 14, 8, 0.35), inset 0 0 0 2px #2A2520;
    }
    body::before {
      content: '';
      position: fixed;
      top: 18px; left: 50%;
      transform: translateX(-50%);
      width: 110px; height: 28px;
      background: #1F1B17;
      border-radius: 0 0 16px 16px;
      z-index: 10;
    }
  }

  /* Decorative grain on app background */
  .app::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(168, 192, 144, 0.05) 0%, transparent 45%),
      radial-gradient(circle at 80% 80%, rgba(232, 196, 162, 0.06) 0%, transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(250, 240, 225, 0.04) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* =========================================================
     Views
     ========================================================= */
  .view {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    z-index: 1;
  }
  .view.active {
    display: flex;
    animation: viewIn 380ms cubic-bezier(0.16, 0.84, 0.36, 1);
  }
  @keyframes viewIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .view-content {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overflow-x: hidden;
    scrollbar-width: none;
  }
  .view-content::-webkit-scrollbar { width: 0; height: 0; }

  /* =========================================================
     Date bar (Today view)
     ========================================================= */
  .date-bar {
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px 0 8px;
    background: rgba(250, 248, 245, 0.92);
    backdrop-filter: saturate(180%) blur(12px);
    -webkit-backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid var(--rule-soft);
    position: sticky;
    top: 0;
    z-index: 20;
    flex-shrink: 0;
  }
  .icon-btn {
    width: 38px; height: 38px;
    border: none; background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: background 200ms, transform 150ms, color 200ms;
  }
  .icon-btn:hover { background: var(--bg2); transform: scale(1.05); }
  .icon-btn:active { transform: scale(0.9); }
  .icon-btn svg { width: 20px; height: 20px; transition: transform 220ms var(--ease); }
  .icon-btn:hover svg { transform: scale(1.08); }

  .date-display {
    font-family: "Georgia", "Songti SC", "Source Han Serif SC", serif;
    font-size: 17px;
    font-weight: 500;
    color: var(--ink);
    letter-spacing: 1.2px;
    font-feature-settings: "tnum" 1;
  }
  .date-display .weekday {
    font-size: 12px;
    color: var(--muted);
    margin-left: 8px;
    font-style: italic;
    font-weight: 400;
  }
  .date-bar .brand-mark {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--accent-dark);
    font-family: "Georgia", "Songti SC", serif;
    font-style: italic;
    font-size: 15px;
    letter-spacing: 1.5px;
    padding-left: 4px;
  }
  .date-bar .brand-mark .leaf {
    width: 18px; height: 18px;
    background: var(--accent);
    border-radius: 50% 0 50% 50%;
    transform: rotate(-45deg);
    position: relative;
  }
  .date-bar .brand-mark .leaf::after {
    content: '';
    position: absolute;
    width: 2px; height: 8px;
    background: var(--accent-dark);
    bottom: -2px; right: 50%;
    transform: translateX(50%) rotate(45deg);
    border-radius: 1px;
  }

  /* Season pill (decorative) */
  .date-bar .season-pill {
    position: absolute;
    right: 60px;
    top: 50%;
    transform: translateY(-50%);
    font-family: "Georgia", "Songti SC", serif;
    font-size: 10px;
    color: var(--muted);
    background: var(--bg2);
    border: 1px solid var(--rule-soft);
    padding: 3px 9px;
    border-radius: 100px;
    letter-spacing: 1.5px;
    pointer-events: none;
    transition: color 350ms var(--ease), background 350ms var(--ease);
  }
  .date-bar .season-pill.spring { color: #7A9A6A; background: rgba(168, 192, 144, 0.12); }
  .date-bar .season-pill.summer { color: #5B8B5A; background: rgba(123, 154, 106, 0.12); }
  .date-bar .season-pill.autumn { color: #A06848; background: rgba(212, 132, 124, 0.12); }
  .date-bar .season-pill.winter { color: #6B7E80; background: rgba(200, 210, 215, 0.18); }

  .date-nav {
    display: flex;
    align-items: center;
    gap: 2px;
  }

  /* =========================================================
     Today Section / Card
     ========================================================= */
  .today-section {
    padding: 18px 16px 8px;
  }
  .section-eyebrow {
    font-family: "Georgia", "Songti SC", serif;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 10px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-eyebrow::before {
    content: '';
    width: 14px; height: 1px;
    background: var(--muted-light);
  }

  .card {
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    padding: 22px;
    border: 1px solid var(--rule-soft);
    position: relative;
    animation: cardIn 420ms var(--ease) backwards;
    animation-delay: 120ms;
  }

  .empty-today {
    text-align: center;
    padding: 28px 18px 18px;
  }
  .empty-today .emoji-wrap {
    width: 64px; height: 64px;
    margin: 0 auto 14px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent-softest), var(--bg2));
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0); }
    50%      { transform: translateY(-6px) rotate(-3deg); }
  }
  .empty-today h3 {
    font-family: "Georgia", "Songti SC", serif;
    font-size: 19px;
    color: var(--ink);
    margin-bottom: 6px;
    font-weight: 500;
    letter-spacing: 0.5px;
  }
  .empty-today p {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 22px;
    line-height: 1.7;
  }
  .add-photo-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 26px;
    background: var(--bg2);
    border: 1px dashed var(--accent);
    border-radius: var(--radius);
    color: var(--accent-dark);
    font-size: 14px;
    cursor: pointer;
    transition: all 200ms;
    margin-bottom: 22px;
    font-weight: 500;
  }
  .add-photo-btn:hover { background: var(--accent-softest); border-color: var(--accent-dark); }
  .add-photo-btn:active { transform: scale(0.97); }
  .add-photo-btn svg { width: 16px; height: 16px; }

  .today-question {
    font-family: "Brush Script MT", "Snell Roundhand", "Apple Chancery", "KaiTi", "STKaiti", cursive;
    font-style: italic;
    color: var(--ink-soft);
    font-size: 20px;
    line-height: 1.5;
    margin-top: 8px;
    padding: 12px 16px;
    position: relative;
    background: linear-gradient(180deg, transparent 0%, rgba(168, 192, 144, 0.05) 100%);
    border-radius: 10px;
  }
  .today-question::before, .today-question::after {
    color: var(--accent);
    font-size: 18px;
    opacity: 0.6;
  }
  .today-question::before { content: '"'; margin-right: 2px; }
  .today-question::after  { content: '"'; margin-left: 2px; }

  /* Filled today state */
  .diary-content { position: relative; }
  .diary-menu {
    position: absolute;
    top: -8px; right: -6px;
    width: 32px; height: 32px;
    border: none;
    background: var(--bg2);
    color: var(--ink-soft);
    cursor: pointer;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: all 200ms;
    z-index: 2;
  }
  .diary-menu:hover { background: var(--rule); }
  .diary-menu:active { transform: scale(0.9); }
  .diary-menu svg { width: 16px; height: 16px; }

  .photo-row {
    display: flex;
    gap: 6px;
    margin: 0 -4px 16px;
  }
  .photo-row .photo {
    flex: 1;
    aspect-ratio: 1;
    border-radius: 10px;
    overflow: hidden;
    background: linear-gradient(135deg, var(--bg2), var(--rule-soft));
    position: relative;
    box-shadow: var(--shadow-sm);
  }
  .photo-row .photo img { width: 100%; height: 100%; object-fit: cover; transition: transform 400ms; }
  .photo-row .photo:hover img { transform: scale(1.04); }
  .photo-row.single .photo { aspect-ratio: 4/3; }

  .diary-text {
    font-family: "Georgia", "Songti SC", serif;
    font-size: 18px;
    color: var(--ink);
    line-height: 1.75;
    margin-bottom: 12px;
    letter-spacing: 0.2px;
  }
  .diary-meta {
    font-size: 12.5px;
    color: var(--muted);
    font-style: italic;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .diary-meta::before {
    content: '';
    width: 16px; height: 1px;
    background: var(--muted-light);
  }

  .action-bar {
    display: flex;
    border-top: 1px solid var(--rule-soft);
    margin: 18px -22px -22px;
    padding: 4px 12px 4px;
  }
  .action-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 14px 8px;
    background: transparent;
    border: none;
    color: var(--ink-soft);
    font-size: 13px;
    cursor: pointer;
    border-radius: 10px;
    transition: all 200ms;
    font-weight: 500;
  }
  .action-btn:hover { background: var(--bg2); color: var(--ink); transform: translateY(-1px); }
  .action-btn:active { transform: scale(0.97); }
  .action-btn + .action-btn { border-left: 1px solid var(--rule-soft); border-radius: 0; }
  .action-btn:first-child { border-radius: 0 0 0 14px; }
  .action-btn:last-child { border-radius: 0 0 14px 0; }
  .action-btn svg { width: 16px; height: 16px; }

  /* =========================================================
     Last Year Today Banner & Card
     ========================================================= */
  .last-year-banner {
    margin: 0 16px 14px;
    padding: 14px 16px;
    background: linear-gradient(135deg, var(--bg2) 0%, var(--bg3) 100%);
    border-left: 3px solid var(--accent);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    transition: all 200ms;
    animation: cardIn 420ms var(--ease) backwards;
    animation-delay: 40ms;
  }
  .last-year-banner:hover { transform: translateX(2px); }
  .last-year-banner.expanded { border-radius: 10px 10px 0 0; margin-bottom: 0; }
  .last-year-banner .banner-text {
    font-size: 13.5px;
    color: var(--accent-dark);
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 500;
  }
  .last-year-banner .banner-arrow {
    color: var(--accent-dark);
    transition: transform 250ms var(--ease);
    width: 14px; height: 14px;
  }
  .last-year-banner.expanded .banner-arrow { transform: rotate(90deg); }

  .last-year-card {
    margin: 0 16px 24px;
    background: var(--white);
    border: 1px solid var(--rule-soft);
    border-top: none;
    border-radius: 0 0 10px 10px;
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    transition: max-height 350ms var(--ease), opacity 250ms, padding 250ms;
    padding: 0 18px;
  }
  .last-year-card.expanded {
    max-height: 900px;
    opacity: 1;
    padding: 18px;
  }
  .ly-date-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }
  .ly-date {
    font-family: "Georgia", "Songti SC", serif;
    font-size: 16px;
    color: var(--ink);
    font-weight: 500;
  }
  .ly-age {
    font-size: 12px;
    color: var(--accent-dark);
    background: var(--accent-softest);
    padding: 3px 10px;
    border-radius: 100px;
    margin-bottom: 14px;
    display: inline-block;
  }
  .ly-photo {
    width: 100%;
    aspect-ratio: 16/10;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 14px;
    background: var(--bg2);
  }
  .ly-photo img { width: 100%; height: 100%; object-fit: cover; }
  .ly-text {
    font-family: "Georgia", "Songti SC", serif;
    font-size: 16px;
    line-height: 1.7;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .ly-meta {
    font-size: 12px;
    color: var(--muted);
    font-style: italic;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .ly-actions {
    display: flex;
    gap: 8px;
  }
  .ly-actions .btn {
    flex: 1;
    padding: 10px 14px;
    border-radius: 100px;
    border: 1px solid var(--rule);
    background: var(--white);
    color: var(--ink-soft);
    font-size: 13px;
    cursor: pointer;
    transition: all 200ms;
  }
  .ly-actions .btn:hover { background: var(--bg2); border-color: var(--accent); color: var(--accent-dark); }

  .last-year-empty {
    text-align: center;
    padding: 24px 12px;
  }
  .last-year-empty .leaf {
    font-size: 28px;
    margin-bottom: 10px;
    display: inline-block;
    animation: float 4s ease-in-out infinite;
  }
  .last-year-empty h4 {
    font-family: "Georgia", "Songti SC", serif;
    font-size: 16px;
    color: var(--ink);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .last-year-empty p {
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.7;
    margin-bottom: 14px;
  }
  .last-year-empty .go-record {
    padding: 9px 18px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 100px;
    font-size: 13px;
    cursor: pointer;
    transition: all 200ms;
  }
  .last-year-empty .go-record:hover { background: var(--accent-dark); }
  .last-year-empty .go-record:active { transform: scale(0.97); }

  /* =========================================================
     Sprout (今日萌芽) Card
     ========================================================= */
  .sprout-card {
    margin: 0 16px 24px;
    padding: 22px 20px 18px;
    background:
      linear-gradient(135deg, rgba(232, 240, 220, 0.6) 0%, rgba(251, 247, 242, 0.8) 100%);
    border-radius: var(--radius);
    border: 1px solid rgba(168, 192, 144, 0.25);
    position: relative;
    overflow: hidden;
    animation: cardIn 460ms var(--ease) backwards;
    animation-delay: 200ms;
  }
  .sprout-card::before {
    content: '';
    position: absolute;
    top: -30px; right: -30px;
    width: 120px; height: 120px;
    background: radial-gradient(circle, rgba(168, 192, 144, 0.18) 0%, transparent 70%);
    border-radius: 50%;
  }
  .sprout-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    position: relative;
  }
  .sprout-header .leaf-icon {
    width: 18px; height: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .sprout-header .leaf-icon svg { width: 100%; height: 100%; }
  .sprout-header .label {
    font-family: "Georgia", "Songti SC", serif;
    font-size: 13px;
    color: var(--accent-dark);
    letter-spacing: 2px;
    font-weight: 500;
  }
  .sprout-tag {
    display: inline-block;
    padding: 4px 12px;
    background: var(--accent);
    color: white;
    border-radius: 100px;
    font-size: 11.5px;
    margin-bottom: 12px;
    letter-spacing: 0.5px;
    position: relative;
  }
  .sprout-title {
    font-family: "Georgia", "Songti SC", serif;
    font-size: 17px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 10px;
    letter-spacing: 0.3px;
    position: relative;
  }
  .sprout-body {
    font-size: 13.5px;
    line-height: 1.85;
    color: var(--ink-soft);
    margin-bottom: 16px;
    position: relative;
  }
  .sprout-actions {
    display: flex;
    gap: 18px;
    padding-top: 12px;
    border-top: 1px dashed var(--rule);
    position: relative;
  }
  .sprout-actions button {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 0;
    transition: color 200ms;
  }
  .sprout-actions button.done { color: var(--accent-dark); }
  .sprout-actions button.favorited { color: var(--danger); }
  .sprout-actions button:hover { color: var(--ink); }
  .sprout-actions button svg { width: 14px; height: 14px; }
  .sprout-actions button.like-anim { animation: heartPop 400ms var(--ease); }
  @keyframes heartPop {
    0% { transform: scale(1); }
    50% { transform: scale(1.4); }
    100% { transform: scale(1); }
  }

  /* =========================================================
     Streak (连续小火苗)
     ========================================================= */
  .streak-bar {
    margin: 0 16px 16px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    background: linear-gradient(135deg, var(--bg3) 0%, var(--bg2) 100%);
    border-radius: var(--radius);
    border: 1px solid var(--rule-soft);
  }
  .streak-bar .flame {
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    color: var(--accent-dark);
    transition: color 400ms var(--ease), transform 400ms var(--ease), opacity 400ms var(--ease);
  }
  .streak-bar .flame svg { width: 100%; height: 100%; }
  .streak-bar.dim .flame { color: var(--muted-light); transform: scale(0.92); opacity: 0.7; }
  .streak-bar .flame .flicker {
    transform-origin: 50% 90%;
    animation: flicker 3s ease-in-out infinite;
  }
  .streak-bar.dim .flame .flicker { animation: none; }
  @keyframes flicker {
    0%, 100% { transform: scale(1) rotate(-1deg); }
    50%      { transform: scale(1.04) rotate(1deg); }
  }
  .streak-bar .streak-text {
    font-family: "Georgia", "Songti SC", serif;
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.4;
    flex: 1;
  }
  .streak-bar .streak-text strong {
    color: var(--ink);
    font-weight: 500;
    font-size: 15px;
    margin-right: 4px;
    letter-spacing: 0.3px;

  .calendar-card {

  .calendar-day {

  .fp-quote {

  /* =========================================================
     Growth view
     ========================================================= */
  .growth-content { padding: 18px 16px 28px; }
  .growth-poem {
    text-align: center;
    font-family: "Brush Script MT", "Snell Roundhand", "Apple Chancery", "KaiTi", "STKaiti", cursive;
    font-style: italic;

  .growth-tree-card {
    background: var(--white);
    border: 1px solid var(--rule-soft);
    border-radius: var(--radius);
    padding: 16px 18px 18px;
    margin-bottom: 18px;
    box-shadow: var(--shadow-sm);
    position: relative;
    overflow: hidden;
    animation: cardIn 480ms var(--ease) backwards;
    animation-delay: 100ms;

  .growth-tree-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 100%, rgba(168, 192, 144, 0.08) 0%, transparent 60%),
      radial-gradient(circle at 80% 15%, rgba(232, 196, 162, 0.07) 0%, transparent 50%);
    pointer-events: none;
  }
  .growth-tree-wrap-new {
    width: 100%;
    aspect-ratio: 9/7;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .growth-tree-wrap-new svg { width: 100%; height: 100%; overflow: visible; display: block; }
  .growth-tree-wrap-new .gt-leaf {
    transform-origin: center;
    transform-box: fill-box;
    animation: leafIn 500ms var(--ease) backwards;
  }
  .growth-tree-wrap-new .gt-flower {
    transform-origin: center;
    transform-box: fill-box;
    animation: leafIn 600ms var(--ease) backwards;
  }
  .growth-tree-wrap-new .gt-branch,
  .growth-tree-wrap-new .gt-trunk {
    stroke-dasharray: 600;
    stroke-dashoffset: 600;
    animation: drawLine 900ms var(--ease) forwards;
  }
  @keyframes drawLine {
    to { stroke-dashoffset: 0; }
  }

  /* Tree sway (whole tree, transform-origin at base) */
  .growth-tree-wrap-new .gt-tree-sway {
    transform-origin: 180px 240px;
    transform-box: view-box;
    animation: treeSway 6s ease-in-out infinite;
  }
  @keyframes treeSway {
    0%, 100% { transform: rotate(-1.2deg); }
    50%      { transform: rotate(1.2deg); }
  }
  /* Single leaves gentle wobble with phase variation */
  .growth-tree-wrap-new .gt-leaf {
    transform-origin: center;
    transform-box: fill-box;
    animation: leafIn 500ms var(--ease) backwards, leafWobble 5s ease-in-out infinite;
  }
  .growth-tree-wrap-new .gt-flower {
    transform-origin: center;
    transform-box: fill-box;
    animation: leafIn 600ms var(--ease) backwards, leafWobble 6s ease-in-out infinite;
  }
  @keyframes leafWobble {
    0%, 100% { transform: rotate(-2deg) scale(1); }
    50%      { transform: rotate(2deg) scale(1.02); }
  }
  .growth-tree-wrap-new .gt-leaf:hover,
  .growth-tree-wrap-new .gt-flower:hover {
    transform: scale(1.2) rotate(0deg);
    transition: transform 220ms var(--ease);
    cursor: pointer;
    filter: drop-shadow(0 2px 4px rgba(168, 192, 144, 0.4));
  }

  .growth-tree-card {
    transition: transform 280ms var(--ease), box-shadow 280ms var(--ease);
  }
  .growth-tree-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(168, 192, 144, 0.2);
  }
  .growth-tree-card:active {
    transform: scale(0.99);
  }
  .growth-tree-hint {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
    font-family: "Georgia", "Songti SC", serif;
    font-style: italic;
    margin: -8px 0 18px;
    letter-spacing: 0.5px;

    width: 14px;
    height: 14px;
    color: var(--accent);
    animation: hintBounce 1.6s ease-in-out infinite;
  }
  @keyframes hintBounce {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(3px); }
  }

  /* Ambient drifting/falling elements removed per design update */

  .growth-stats {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
  }
  .growth-stat {
    flex: 1;
    background: var(--white);
    border: 1px solid var(--rule-soft);
    border-radius: 12px;

  .growth-stat:nth-child(1) { animation-delay: 100ms; }
  .growth-stat:nth-child(2) { animation-delay: 160ms; }
  .growth-stat:nth-child(3) { animation-delay: 220ms; }
  .growth-stat .num {

  /* =========================================================
     Bottom Tab Bar
     ========================================================= */
  .tab-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 68px;
    background: rgba(250, 248, 245, 0.96);
    backdrop-filter: saturate(180%) blur(24px);
    -webkit-backdrop-filter: saturate(180%) blur(24px);
    border-top: 1px solid var(--rule-soft);
    display: flex;
    z-index: 50;
    padding-bottom: env(safe-area-inset-bottom);

  .tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 11px;
    cursor: pointer;
    position: relative;
    transition: color 280ms var(--ease);
    font-weight: 500;
    letter-spacing: 1.2px;
    padding-top: 2px;

  .tab:hover { color: var(--ink-soft); }
  .tab.active { color: var(--accent-dark); }
  .tab.active::before {
    content: '';
    position: absolute;
    top: 4px;
    left: 50%;
    transform: translateX(-50%);
    width: 22px; height: 3px;
    background: linear-gradient(90deg, transparent, var(--accent) 50%, transparent);

    opacity: 0.85;
    transition: all 320ms var(--ease);

  .tab .icon {
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 320ms var(--ease), color 280ms var(--ease);
    color: var(--muted);
    position: relative;
  }
  .tab .icon::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0;
    transition: opacity 280ms var(--ease);
    z-index: -1;

  .tab .icon svg { width: 100%; height: 100%; transition: transform 320ms var(--ease); }
  .tab.active .icon {

    font-size: 10.5px;

    transition: all 200ms;
  }
  .template-chip:hover { border-color: var(--accent); color: var(--accent-dark); background: var(--accent-softest); }
  .template-chip:active { transform: scale(0.96); }

  /* =========================================================
     Toast
     ========================================================= */
  .toast {
    position: absolute;
    top: 76px; left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: rgba(45, 36, 28, 0.94);
    color: white;
    padding: 12px 22px;
    border-radius: 100px;
    font-size: 13.5px;
    opacity: 0;
    pointer-events: none;
    transition: all 280ms var(--ease);
    z-index: 300;
    box-shadow: 0 8px 28px rgba(0,0,0,0.25);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* =========================================================
     Timeline view
     ========================================================= */
  .timeline-header {
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    background: rgba(250, 248, 245, 0.92);
    backdrop-filter: saturate(180%) blur(12px);
    -webkit-backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid var(--rule-soft);
    position: sticky;
    top: 0;
    z-index: 20;
    flex-shrink: 0;
  }
  .brand {
    font-family: "Georgia", "Songti SC", serif;
    font-size: 18px;
    color: var(--accent-dark);
    font-style: italic;
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .brand .leaf {
    width: 16px; height: 16px;
    background: var(--accent);
    border-radius: 50% 0 50% 50%;
    transform: rotate(-45deg);
    display: inline-block;
  }
  .month-btn {
    padding: 8px 14px;
    background: var(--white);
    border: 1px solid var(--rule);
    border-radius: 100px;
    font-size: 13px;
    color: var(--ink-soft);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: all 200ms;
    font-family: inherit;
  }
  .month-btn:hover { border-color: var(--accent); color: var(--accent-dark); }
  .month-btn svg { width: 12px; height: 12px; transition: transform 200ms; }
  .month-btn.open svg { transform: rotate(180deg); }

  .timeline-list {
    padding: 20px 16px 8px;
  }
  .month-block {
    margin-bottom: 28px;
  }
  .month-label {
    font-family: "Georgia", "Songti SC", serif;
    font-size: 13px;
    color: var(--ink);
    margin-bottom: 12px;
    padding-left: 4px;
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .month-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--rule) 0%, transparent 100%);
  }
  .tl-day {
    margin-bottom: 12px;
    animation: cardIn 380ms var(--ease) backwards;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .tl-day-header {
    font-family: "Georgia", "Songti SC", serif;
    font-size: 13.5px;
    color: var(--ink);
    margin-bottom: 8px;
    padding-left: 4px;
    font-weight: 500;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .tl-day-header .weekday {
    font-size: 11px;
    color: var(--muted);
    font-style: italic;
    font-weight: 400;
  }
  .tl-card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 12px;
    display: flex;
    gap: 12px;
    cursor: pointer;
    transition: all 200ms;
    border: 1px solid var(--rule-soft);
    box-shadow: var(--shadow-sm);
  }
  .tl-card:hover { transform: translateY(-1px); box-shadow: var(--shadow); border-color: var(--accent-soft); }
  .tl-card .tl-photos {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }
  .tl-card .tl-photo {
    width: 70px; height: 70px;
    border-radius: 8px;
    overflow: hidden;
    background: var(--bg2);
  }
  .tl-card .tl-photo img { width: 100%; height: 100%; object-fit: cover; }
  .tl-card .tl-body {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .tl-card .tl-text {
    font-family: "Georgia", "Songti SC", serif;
    font-size: 14px;
    color: var(--ink);
    line-height: 1.55;
    margin-bottom: 6px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .tl-card .tl-meta {
    font-size: 11.5px;
    color: var(--muted);
    font-style: italic;
  }
  .tl-empty-state {
    text-align: center;
    padding: 80px 30px;
    color: var(--muted);
  }
  .tl-empty-state .leaf {
    font-size: 56px;
    margin-bottom: 16px;
    display: inline-block;
    animation: float 4s ease-in-out infinite;
  }
  .tl-empty-state h4 {
    font-family: "Georgia", "Songti SC", serif;
    font-size: 17px;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .tl-empty-state p {
    font-size: 13px;
    line-height: 1.7;
  }

  /* =========================================================
     Action menu (small popover for edit/delete)
     ========================================================= */
  .action-menu {
    position: absolute;
    background: var(--white);
    border-radius: 12px;
    box-shadow: 0 12px 36px rgba(0,0,0,0.18);
    padding: 6px;
    min-width: 120px;
    z-index: 200;
    animation: menuIn 200ms var(--ease);
  }
  @keyframes menuIn {
    from { opacity: 0; transform: scale(0.9) translateY(-4px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  .action-menu button {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 10px 14px;
    background: transparent;
    border: none;
    text-align: left;
    font-size: 13.5px;
    color: var(--ink);
    border-radius: 8px;
    cursor: pointer;
    transition: background 150ms;
    font-family: inherit;
  }
  .action-menu button:hover { background: var(--bg2); }
  .action-menu button.danger { color: var(--danger); }
  .action-menu button svg { width: 14px; height: 14px; }

  /* Month picker grid */
  .month-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding: 4px 0 8px;
  }
  .month-cell {
    padding: 14px 8px;
    background: var(--white);
    border: 1px solid var(--rule-soft);
    border-radius: 12px;
    text-align: center;
    cursor: pointer;
    font-size: 13px;
    color: var(--ink-soft);
    transition: all 200ms;
  }
  .month-cell:hover { border-color: var(--accent); color: var(--accent-dark); }
  .month-cell.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .month-cell .count {
    display: block;
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 2px;
  }
  .month-cell.active .count { color: rgba(255,255,255,0.7); }

  /* Confirm modal */
  .confirm-modal {
    position: absolute;
    inset: 0;
    background: rgba(40, 30, 20, 0.5);
    z-index: 250;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 200ms;
    padding: 30px;
  }
  .confirm-modal.open { opacity: 1; pointer-events: auto; }
  .confirm-box {
    width: 100%;
    max-width: 280px;
    background: var(--white);
    border-radius: 16px;
    padding: 24px 20px 16px;
    text-align: center;
    transform: scale(0.95);
    transition: transform 200ms var(--ease);
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  }
  .confirm-modal.open .confirm-box { transform: scale(1); }
  .confirm-box h4 {
    font-family: "Georgia", "Songti SC", serif;
    font-size: 16px;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .confirm-box p {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 20px;
  }
  .confirm-actions {
    display: flex;
    gap: 10px;
  }
  .confirm-actions button {
    flex: 1;
    padding: 11px;
    border-radius: 100px;
    border: 1px solid var(--rule);
    background: var(--white);
    color: var(--ink-soft);
    font-size: 13.5px;
    cursor: pointer;
    transition: all 200ms;
    font-family: inherit;
  }
  .confirm-actions button:hover { background: var(--bg2); }
  .confirm-actions button.primary {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .confirm-actions button.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  .confirm-actions button.primary.danger {
    background: var(--danger);
    border-color: var(--danger);
  }
  .confirm-actions button.primary.danger:hover { background: #BE726A; border-color: #BE726A; }

  /* Hide file input */
  .file-input { display: none; }

  /* Date bar back btn variant */
  .back-btn-wrap { width: 38px; display: flex; align-items: center; justify-content: center; }

  /* Voucher mini (date-bar) */
  .voucher-mini {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 10px 5px 8px;
    background: linear-gradient(135deg, rgba(232, 196, 162, 0.18) 0%, rgba(212, 132, 124, 0.12) 100%);
    border: 1px solid rgba(232, 196, 162, 0.35);
    border-radius: 100px;
    font-family: "Georgia", "Songti SC", serif;
    font-size: 12.5px;
    color: var(--accent2);
    font-weight: 500;
    cursor: pointer;
    transition: transform 200ms var(--ease), background 200ms;
    font-family: inherit;
  }
  .voucher-mini svg { width: 14px; height: 14px; color: var(--accent2); }
  .voucher-mini:hover { transform: scale(1.05); background: linear-gradient(135deg, rgba(232, 196, 162, 0.32) 0%, rgba(212, 132, 124, 0.22) 100%); }
  .voucher-mini:active { transform: scale(0.95); }
  .voucher-mini.bump { animation: voucherBump 600ms var(--ease); }

  /* =========================================================
     Community view
     ========================================================= */
  .community-header {
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    background: rgba(250, 248, 245, 0.92);
    backdrop-filter: saturate(180%) blur(12px);
    -webkit-backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid var(--rule-soft);
    position: sticky;
    top: 0;
    z-index: 20;
    flex-shrink: 0;
  }
  .community-header-text { display: flex; flex-direction: column; }
  .community-header-text .sub-title {
    font-family: "Georgia", "Songti SC", serif;
    font-size: 17px;
    color: var(--ink);
    font-weight: 500;
    letter-spacing: 3px;
  }
  .community-header-text .sub-sub {
    font-size: 11px;
    color: var(--muted);
    font-style: italic;
    margin-top: 1px;
    letter-spacing: 0.5px;
  }
  .voucher-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 12px;
    background: linear-gradient(135deg, rgba(232, 196, 162, 0.18) 0%, rgba(212, 132, 124, 0.12) 100%);
    border: 1px solid rgba(232, 196, 162, 0.35);
    border-radius: 100px;
    font-family: "Georgia", "Songti SC", serif;
    font-size: 12.5px;
    color: var(--accent2);
    font-weight: 500;
    letter-spacing: 0.5px;
    transition: transform 200ms var(--ease);
  }
  .voucher-chip svg { width: 14px; height: 14px; color: var(--accent2); }
  .voucher-chip.bump { animation: voucherBump 600ms var(--ease); }
  @keyframes voucherBump {
    0% { transform: scale(1); }
    40% { transform: scale(1.18); background: linear-gradient(135deg, rgba(232, 196, 162, 0.32) 0%, rgba(212, 132, 124, 0.22) 100%); }
    100% { transform: scale(1); }
  }

  .community-content { padding: 16px 16px 96px; }
  .community-section-title {
    font-family: "Georgia", "Songti SC", serif;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin: 8px 0 12px 4px;
    font-weight: 500;
  }

  .post-card {
    background: var(--white);
    border: 1px solid var(--rule-soft);
    border-radius: var(--radius);
    padding: 16px 18px 14px;
    margin-bottom: 14px;
    box-shadow: var(--shadow-sm);
    transition: transform 200ms var(--ease), box-shadow 200ms var(--ease);
    animation: cardIn 420ms var(--ease) backwards;
  }
  .post-card:active { transform: scale(0.99); }
  .post-card:hover { box-shadow: var(--shadow); }
  .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .post-avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent-soft), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    color: white;
    font-weight: 500;
    font-size: 14px;
    flex-shrink: 0;
    font-family: "Georgia", "Songti SC", serif;
  }
  .post-author { flex: 1; }
  .post-name { font-size: 13.5px; color: var(--ink); font-weight: 500; }
  .post-meta { font-size: 11px; color: var(--muted); margin-top: 1px; font-style: italic; }
  .post-text {
    font-family: "Georgia", "Songti SC", serif;
    font-size: 14.5px;
    line-height: 1.75;
    color: var(--ink);
    margin-bottom: 10px;
    letter-spacing: 0.2px;
  }
  .post-images {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    margin-bottom: 10px;
    border-radius: 10px;
    overflow: hidden;
  }
  .post-images.cols-2 { grid-template-columns: repeat(2, 1fr); }
  .post-images.cols-1 { grid-template-columns: 1fr; max-width: 70%; }
  .post-images .pi {
    aspect-ratio: 1;
    overflow: hidden;
    background: var(--bg2);
    position: relative;
  }
  .post-images .pi img { width: 100%; height: 100%; object-fit: cover; transition: transform 400ms; }
  .post-images .pi:hover img { transform: scale(1.05); }
  .post-actions {
    display: flex;
    align-items: center;
    gap: 18px;
    padding-top: 8px;
    border-top: 1px solid var(--rule-soft);
  }
  .post-action {
    display: flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 12.5px;
    cursor: pointer;
    padding: 4px 0;
    transition: color 200ms;
    font-family: inherit;
  }
  .post-action svg { width: 16px; height: 16px; transition: transform 200ms var(--ease); }
  .post-action:hover { color: var(--ink-soft); }
  .post-action.liked { color: var(--danger); }
  .post-action.liked svg { transform: scale(1.05); fill: currentColor; }
  .post-action.like-anim { animation: heartPop 400ms var(--ease); }
  .post-action .count { font-size: 12.5px; min-width: 14px; }

  .community-fab {
    position: absolute;
    right: 20px;
    bottom: 80px;
    width: 52px; height: 52px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
    color: white;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(122, 154, 106, 0.4);
    transition: transform 200ms var(--ease), box-shadow 200ms;
    z-index: 30;
  }
  .community-fab:hover { transform: translateY(-2px) scale(1.04); box-shadow: 0 12px 30px rgba(122, 154, 106, 0.5); }
  .community-fab:active { transform: scale(0.95); }
  .community-fab svg { width: 22px; height: 22px; }

  .community-empty {
    text-align: center;
    padding: 60px 24px;
    color: var(--muted);
  }
  .community-empty .leaf {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent-softest), var(--bg2));
    display: inline-flex; align-items: center; justify-content: center;
    margin-bottom: 14px;
    animation: float 4s ease-in-out infinite;
  }
  .community-empty h4 { font-family: "Georgia", "Songti SC", serif; font-size: 16px; color: var(--ink); margin-bottom: 6px; font-weight: 500; }
  .community-empty p { font-size: 13px; line-height: 1.7; }

  /* Post composer sheet */
  .composer-textarea {
    width: 100%;
    min-height: 100px;
    border: 1px solid var(--rule);
    background: var(--bg2);
    border-radius: 12px;
    padding: 12px 14px;
    font-family: "Georgia", "Songti SC", serif;
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink);
    resize: none;
    outline: none;
    transition: border-color 200ms, background 200ms;
  }
  .composer-textarea:focus { border-color: var(--accent); background: var(--white); }
  .composer-counter {
    text-align: right;
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 6px;
    font-family: "Georgia", "Songti SC", serif;
  }
  .composer-counter.warn { color: var(--danger); }

  /* Memory diary sheet (成长树点击) */
  .memory-sheet-content { padding: 4px 0 12px; }
  .memory-date {
    font-family: "Georgia", "Songti SC", serif;
    font-size: 14px;
    color: var(--muted);
    letter-spacing: 1.5px;
    text-align: center;
    margin-bottom: 12px;
    font-style: italic;
  }
  .memory-photos {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    margin-bottom: 14px;
    border-radius: 10px;
    overflow: hidden;
  }
  .memory-photos.cols-2 { grid-template-columns: repeat(2, 1fr); }
  .memory-photos.cols-1 { grid-template-columns: 1fr; max-width: 80%; margin-left: auto; margin-right: auto; }
  .memory-photos .mp {
    aspect-ratio: 1;
    background: var(--bg2);
    overflow: hidden;
  }
  .memory-photos .mp img { width: 100%; height: 100%; object-fit: cover; }
  .memory-text {
    font-family: "Georgia", "Songti SC", serif;
    font-size: 15.5px;
    line-height: 1.85;
    color: var(--ink);
    padding: 0 4px;
    text-align: center;
    letter-spacing: 0.3px;
  }
  .memory-actions {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 20px;
  }
  .memory-actions .btn {
    padding: 9px 20px;
    border-radius: 100px;
    border: 1px solid var(--rule);
    background: var(--white);
    color: var(--ink-soft);
    font-size: 13px;
    cursor: pointer;
    transition: all 200ms;
    font-family: inherit;
  }
  .memory-actions .btn:hover { background: var(--bg2); border-color: var(--accent); color: var(--accent-dark); }
  .memory-actions .btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
  .memory-actions .btn.primary:hover { background: var(--accent-dark); }

  /* 补记 banner (footprints 中无记录日期) */
  .voucher-redeem-banner {
    margin: 0 16px 14px;
    padding: 16px 18px;
    background: linear-gradient(135deg, rgba(232, 196, 162, 0.18) 0%, rgba(168, 192, 144, 0.12) 100%);
    border: 1px dashed rgba(232, 196, 162, 0.6);
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .voucher-redeem-banner .icon {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent2) 0%, var(--danger) 100%);
    color: white;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .voucher-redeem-banner .icon svg { width: 18px; height: 18px; }
  .voucher-redeem-banner .text { flex: 1; }
  .voucher-redeem-banner .text .t1 { font-size: 14px; color: var(--ink); font-weight: 500; }
  .voucher-redeem-banner .text .t2 { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .voucher-redeem-banner .redeem-btn {
    background: var(--accent2);
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 100px;
    font-size: 12.5px;
    cursor: pointer;
    font-weight: 500;
    transition: all 200ms;
    font-family: inherit;
  }
  .voucher-redeem-banner .redeem-btn:hover { background: var(--accent); transform: translateY(-1px); }
  .voucher-redeem-banner .redeem-btn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>

  /* =========================================================
     Data layer
     ========================================================= */
  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { /* ignore */ }
    return null;
  }
  function saveData(data) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
    catch (e) { console.warn('localStorage 写入失败', e); }
  }
  function initData() {
    let data = loadData();
    if (!data) {
      data = {
        baby: { ...DEFAULT_BABY },
        diaries: PRESET_DIARIES.map(d => ({
          ...d,
          createdAt: d.date + 'T20:30:00'
        })),
        settings: { firstVisit: false }
      };
      saveData(data);
    }
    return data;
  }
  function getAppData() { return loadData() || initData(); }
  function getDiary(date) {
    const data = getAppData();
    return data.diaries.find(d => d.date === date) || null;
  }
  function upsertDiary(date, diary) {
    const data = getAppData();
    const idx = data.diaries.findIndex(d => d.date === date);
    if (idx >= 0) {
      data.diaries[idx] = { ...data.diaries[idx], ...diary, createdAt: data.diaries[idx].createdAt };
    } else {
      data.diaries.unshift({ date, ...diary, createdAt: new Date().toISOString() });
    }
    data.diaries.sort((a, b) => b.date.localeCompare(a.date));
    saveData(data);
  }
  function deleteDiary(date) {
    const data = getAppData();
    data.diaries = data.diaries.filter(d => d.date !== date);
    saveData(data);
  }
  function getDiariesByMonth(monthKey) {
    return getAppData().diaries.filter(d => d.date.startsWith(monthKey));
  }
  function getAllDiaries() {
    return [...getAppData().diaries].sort((a, b) => b.date.localeCompare(a.date));
  }
  function getAllMonthKeys() {
    const set = new Set(getAppData().diaries.map(d => d.date.substring(0, 7)));
    // Also include the current month even if empty so user can navigate to it
    set.add(DEMO_TODAY.substring(0, 7));
    return Array.from(set).sort().reverse();
  }

  /* =========================================================
     Date utilities
     ========================================================= */
  function pad(n) { return String(n).padStart(2, '0'); }
  function parseDate(s) {
    const [y, m, d] = s.split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  function formatYMD(d) {
    return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())}`;
  }
  function formatYMDChinese(d) {
    return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
  }
  function getWeekday(d) {
    return ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][d.getDay()];
  }
  function getShortWeekday(d) {
    return ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
  }
  function addDays(dateStr, n) {
    const d = parseDate(dateStr);
    d.setDate(d.getDate() + n);
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }
  function dayOfYear(d) {
    const start = new Date(d.getFullYear(), 0, 0);
    return Math.floor((d - start) / 86400000);
  }
  function getBabyAge(birthdayStr, currentDateStr) {
    const b = parseDate(birthdayStr);
    const c = parseDate(currentDateStr);
    let months = (c.getFullYear() - b.getFullYear()) * 12 + (c.getMonth() - b.getMonth());
    let days = c.getDate() - b.getDate();
    if (days < 0) {
      months -= 1;
      const prevMonth = new Date(c.getFullYear(), c.getMonth(), 0);
      days += prevMonth.getDate();
    }
    if (months < 0) return { months: 0, days: 0, label: '未出生' };
    if (months >= 12) {
      const years = Math.floor(months / 12);
      const m = months % 12;
      return { months, days, label: m === 0 ? `${years}岁` : `${years}岁${m}个月` };
    }
    if (months === 0) {
      return { months, days, label: `${days}天` };
    }
    return { months, days, label: days === 0 ? `${months}个月` : `${months}个月${days}天` };
  }
  function getSproutForAge(months) {
    return SPROUT_LIBRARY.find(s => months >= s.min && months < s.max) || SPROUT_LIBRARY[SPROUT_LIBRARY.length - 1];
  }
  function getTodayQuestion(dateStr) {
    const d = parseDate(dateStr);
    return QUESTIONS[dayOfYear(d) % QUESTIONS.length];
  }
  function formatTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function formatDiaryMeta(diary) {
    const time = formatTime(diary.createdAt);
    return `—— ${diary.author || '我'}${time ? ' · ' + time : ''}`;
  }

  /* =========================================================

  const $ = (id) => document.getElementById(id);
  const el = (tag, attrs = {}, children = []) => {
    const e = document.createElement(tag);
    Object.entries(attrs).forEach(([k, v]) => {
      if (k === 'class') e.className = v;
      else if (k === 'html') e.innerHTML = v;
      else if (k.startsWith('on')) e.addEventListener(k.substring(2), v);
      else if (v !== null && v !== undefined) e.setAttribute(k, v);
    });
    (Array.isArray(children) ? children : [children]).forEach(c => {
      if (c == null) return;
      if (typeof c === 'string') e.appendChild(document.createTextNode(c));
      else e.appendChild(c);
    });
    return e;
  };

    }
  }

  /* =========================================================

  function calculateStreak() {
    const all = getAllDiaries();
    if (all.length === 0) return { current: 0, dimmed: true, lit: false };
    const dates = new Set(all.map(d => d.date));
    const today = state.currentDate;
    let cursor = dates.has(today) ? today : addDays(today, -1);
    let current = 0;
    while (dates.has(cursor)) {
      current++;
      cursor = addDays(cursor, -1);
    }
    const lit = dates.has(today) && current > 0;
    return { current, dimmed: !lit, lit };
  }

  // 里程碑关键词（命中即在枝头绽放花苞）
  const MILESTONE_KEYWORDS = [
    ['叫妈妈', '叫爸爸', '第一次叫'],
    ['笑出声', '第一次笑', '笑了'],
    ['翻身', '翻过来'],
    ['会爬', '爬行'],
    ['扶站', '扶着站', '站起来'],
    ['走路', '走了一步', '会走', '学步'],
    ['第一口辅食', '辅食'],
    ['第一次', '第一次']
  ];

  function isMilestone(diary) {
    const text = diary.content || '';
    return MILESTONE_KEYWORDS.some(group => group.some(k => text.indexOf(k) >= 0));
  }

  function renderFootprintsView() {
    const root = $('footprintsContent');
    root.innerHTML = '';

    const all = getAllDiaries();
    const [y, m] = state.calendarMonth.split('-').map(Number);
    const monthDiaries = all.filter(d => d.date.startsWith(state.calendarMonth));
    const datesInMonth = new Set(monthDiaries.map(d => d.date));

    const { current: streak } = calculateStreak();
    const totalRecords = all.length;

    // Stats card
    const statsWrap = el('div', { class: 'fp-stats' });
    statsWrap.innerHTML = `
      <div class="fp-stat">
        <div class="num">${streak}<span class="unit">天</span></div>
        <div class="label">连续记录</div>
      </div>
      <div class="fp-stat">
        <div class="num">${monthDiaries.length}<span class="unit">天</span></div>
        <div class="label">本月足迹</div>
      </div>
      <div class="fp-stat">
        <div class="num">${totalRecords}<span class="unit">则</span></div>
        <div class="label">累计记录</div>
      </div>
    `;
    root.appendChild(statsWrap);

    // Month bar
    const monthBar = el('div', { class: 'fp-month-bar' });
    monthBar.innerHTML = `
      <div class="fp-month-label">${y}年${m}月</div>
      <div class="fp-month-nav">
        <button class="icon-btn" id="fpPrevMonth" aria-label="上个月">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <button class="icon-btn" id="fpNextMonth" aria-label="下个月">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>
    `;
    root.appendChild(monthBar);

    // Calendar card
    const calCard = el('div', { class: 'calendar-card' });

    const weekdays = el('div', { class: 'calendar-weekdays' });
    const wdLabels = ['日', '一', '二', '三', '四', '五', '六'];
    wdLabels.forEach((d, i) => {
      const cls = i === 0 ? 'wd sun' : (i === 6 ? 'wd sat' : 'wd');
      weekdays.innerHTML += `<div class="${cls}">${d}</div>`;
    });
    calCard.appendChild(weekdays);

    const grid = el('div', { class: 'calendar-grid' });
    const firstDay = new Date(y, m - 1, 1).getDay();
    const daysInMonth = new Date(y, m, 0).getDate();
    const todayStr = state.currentDate;

    for (let i = 0; i < firstDay; i++) {
      grid.innerHTML += `<div class="calendar-day empty"></div>`;
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${y}-${pad(m)}-${pad(d)}`;
      const hasRecord = datesInMonth.has(dateStr);
      const isToday = dateStr === todayStr;
      const classes = ['calendar-day'];
      if (hasRecord) classes.push('has-record');
      if (isToday) classes.push('today');

      const leafMark = hasRecord
        ? `<span class="leaf-mark"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19.2 2.96c1.4 1 2 5.04 2 7.04 0 5.52-4.48 10-10 10Z"/></svg></span>`
        : '';

      grid.innerHTML += `<div class="${classes.join(' ')}" data-date="${dateStr}">
        <span class="date-num">${d}</span>
        ${leafMark}
      </div>`;
    }
    calCard.appendChild(grid);
    root.appendChild(calCard);

    grid.querySelectorAll('.calendar-day').forEach(day => {
      if (day.classList.contains('empty')) return;
      const date = day.dataset.date;
      day.addEventListener('click', () => {
        if (day.classList.contains('has-record')) {
          goToDate(date);
        } else {
          // No record — offer to redeem with voucher
          // Don't allow future dates
          if (date > state.currentDate) {
            showToast('未来还没到呢 ✨');
            return;
          }
          if (date === state.currentDate) {
            // Today: just open the editor directly
            openEdit(date);
            return;
          }
          tryRedeemVoucher(date);
        }
      });
    });

    // Quote
    const quote = el('div', { class: 'fp-quote' });
    if (totalRecords === 0) {
      quote.textContent = '每一天都值得被记住';
    } else if (streak === 0) {
      quote.textContent = '种下的小苗在等你回来';
    } else {
      quote.textContent = `${streak} 天的连续，是最长情的告白`;
    }
    root.appendChild(quote);

    $('fpPrevMonth').addEventListener('click', () => {
      const [yy, mm] = state.calendarMonth.split('-').map(Number);
      const prev = new Date(yy, mm - 2, 1);
      state.calendarMonth = `${prev.getFullYear()}-${pad(prev.getMonth() + 1)}`;
      renderFootprintsView();
    });
    $('fpNextMonth').addEventListener('click', () => {
      const [yy, mm] = state.calendarMonth.split('-').map(Number);
      const next = new Date(yy, mm, 1);
      state.calendarMonth = `${next.getFullYear()}-${pad(next.getMonth() + 1)}`;
      renderFootprintsView();
    });
  }

  function getDaysSpan(diaries) {
    if (diaries.length < 2) return diaries.length;
    const times = diaries.map(d => parseDate(d.date).getTime()).sort((a, b) => a - b);
    return Math.round((times[times.length - 1] - times[0]) / 86400000) + 1;
  }

  function renderGrowthView() {
    const root = $('growthContent');
    root.innerHTML = '';

    const all = getAllDiaries();
    const milestones = all.filter(isMilestone);

    // Poem
    const poem = el('div', { class: 'growth-poem' });
    if (all.length === 0) {
      poem.textContent = '种下第一颗种子，看它慢慢发芽';
    } else if (all.length < 5) {
      poem.textContent = '小苗渐渐冒出了头';
    } else if (all.length < 15) {
      poem.textContent = '枝叶繁茂了一些';
    } else if (all.length < 30) {
      poem.textContent = '已是郁郁葱葱的小树';
    } else {
      poem.textContent = '每一笔记录，都是你为它浇下的水';
    }
    root.appendChild(poem);

    // Tree card
    const treeCard = el('div', { class: 'growth-tree-card' });
    treeCard.style.cursor = 'pointer';
    const treeWrap = el('div', { class: 'growth-tree-wrap-new' });
    treeWrap.innerHTML = buildGrowthSvg(all);
    treeCard.appendChild(treeWrap);
    root.appendChild(treeCard);

    // Click hint
    const hint = el('div', { class: 'growth-tree-hint' });
    hint.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>
      </svg>
      <span>点击树身，翻开一段旧时光</span>
    `;
    root.appendChild(hint);

    // Tree card click → open a random memory
    treeCard.addEventListener('click', (e) => {
      console.log('[treeCard click] target:', e.target.tagName, 'closest gt-memory:', e.target.closest('.gt-memory'));
      // Don't trigger when clicking on a specific memory leaf (those have their own handler)
      if (e.target.closest('.gt-memory')) return;
      const diary = pickRandomMemoryDiary();
      if (diary) {
        openMemorySheet(diary);
      } else {
        showToast('还没有故事，先去记录第一则吧 ✨');
      }
    });

    // Bind memory leaf click: show "这是 N 天前的故事" + go to date
    treeWrap.querySelectorAll('.gt-memory[data-leaf-date]').forEach(node => {
      node.addEventListener('click', (e) => {
        e.stopPropagation();
        const date = node.dataset.leafDate;
        const d = getDiary(date);
        if (d) {
          showToast(`跳转到 ${date} 的故事 ✨`);
          goToDate(date);
        }
      });
    });

    // Stats
    const statsWrap = el('div', { class: 'growth-stats' });
    statsWrap.innerHTML = `
      <div class="growth-stat">
        <div class="num">${all.length}</div>
        <div class="label">记录</div>
      </div>
      <div class="growth-stat">
        <div class="num">${milestones.length}</div>
        <div class="label">里程碑</div>
      </div>
      <div class="growth-stat">
        <div class="num">${getDaysSpan(all)}</div>
        <div class="label">天</div>
      </div>
    `;
    root.appendChild(statsWrap);

    // Milestones
    const msCard = el('div', { class: 'growth-milestones' });
    msCard.appendChild(el('div', { class: 'growth-milestones-title' }, '枝头的花苞'));
    if (milestones.length === 0) {
      const empty = el('div', { class: 'growth-milestone-empty' });
      empty.textContent = all.length === 0
        ? '写下第一则故事，看看会不会在枝头绽放一朵花'
        : '记录中还没有里程碑，继续写下宝宝的"第一次"吧';
      msCard.appendChild(empty);
    } else {
      milestones.slice(0, 6).forEach((d, i) => {
        const item = el('div', { class: 'growth-milestone-item', style: `animation-delay: ${i * 50 + 200}ms;` });
        item.innerHTML = `
          <div class="m-mark"></div>
          <div class="m-date">${d.date.substring(5).replace('-', '月')}日</div>
          <div class="m-text">${escapeHtml(d.content || '')}</div>
        `;
        item.style.cursor = 'pointer';
        item.addEventListener('click', () => goToDate(d.date));
        msCard.appendChild(item);
      });
    }
    root.appendChild(msCard);
  }

  // Season palette (based on month)
  function getSeason(month) {
    if (month >= 3 && month <= 5) return 'spring';
    if (month >= 6 && month <= 8) return 'summer';
    if (month >= 9 && month <= 11) return 'autumn';
    return 'winter';
  }
  const SEASON_PALETTE = {
    spring: { leaves: ['#BFD4A8', '#C8DCB5', '#9CB088', '#A8C090', '#D4E4B8'], branch: '#9B8568', flower: '#F0C5B0', glow: '#EBF1E3', sun: '#E8D4A2', grass: '#A8C090' },
    summer: { leaves: ['#A8C090', '#7A9A6A', '#9CB088', '#5B8B5A', '#B5CFA0'], branch: '#9B8568', flower: '#E8C4A2', glow: '#EBF1E3', sun: '#E8C4A2', grass: '#7A9A6A' },
    autumn: { leaves: ['#D4847C', '#C99060', '#B58460', '#C8A878', '#A06848'], branch: '#8B6E48', flower: '#D4847C', glow: '#F5E6D5', sun: '#E8A878', grass: '#A06848' },
    winter: { leaves: ['#8B6E48', '#7A6A55', '#6B5848'], branch: '#6B5848', flower: '#FFFFFF', glow: '#E8EEF0', sun: '#E8EEF0', grass: '#A8B5B5' }
  };

  function buildGrowthSvg(diaries, date) {
    const W = 360, H = 280;
    const cx = W / 2;
    const groundY = H * 0.86;

    const n = diaries.length;
    const milestones = diaries.filter(isMilestone);
    const refDate = date ? parseDate(date) : new Date();
    const season = getSeason(refDate.getMonth() + 1);
    const pal = SEASON_PALETTE[season];
    const isBare = season === 'winter' && n > 0;
    const bareFactor = isBare ? 0.35 : 1;
    const flowerChance = season === 'spring' ? 0.3 : 0;

    // Tree growth: 0 = sapling, full at 30+ records
    const growth = n === 0 ? 0.35 : Math.min(0.5 + n * 0.02, 1);
    const trunkH = 100 * growth;
    const canopyW = 110 * growth;
    const canopyH = 90 * growth;
    const canopyY = groundY - trunkH;

    const trunkPath = `M ${cx - 3} ${groundY} C ${cx - 5} ${groundY - trunkH * 0.5} ${cx - 2} ${groundY - trunkH * 0.75} ${cx} ${canopyY}`;
    const branchLeft = `M ${cx} ${canopyY + trunkH * 0.35} Q ${cx - 35 * growth} ${canopyY + trunkH * 0.25} ${cx - 55 * growth} ${canopyY + trunkH * 0.05}`;
    const branchRight = `M ${cx} ${canopyY + trunkH * 0.3} Q ${cx + 35 * growth} ${canopyY + trunkH * 0.2} ${cx + 55 * growth} ${canopyY}`;
    const branchTopLeft = `M ${cx - 4} ${canopyY + trunkH * 0.15} Q ${cx - 20 * growth} ${canopyY - 5 * growth} ${cx - 38 * growth} ${canopyY - 12 * growth}`;
    const branchTopRight = `M ${cx + 4} ${canopyY + trunkH * 0.1} Q ${cx + 20 * growth} ${canopyY - 5 * growth} ${cx + 38 * growth} ${canopyY - 18 * growth}`;

    // Leaves
    let leaves = '';
    if (n === 0) {
      const seedColor = season === 'spring' ? '#B5CFA0' : season === 'autumn' ? '#C99060' : season === 'winter' ? '#8B6E48' : '#A8C090';
      leaves = `<g class="gt-leaf" transform="translate(${cx}, ${groundY - 32}) rotate(-30)" style="animation-delay: 0ms;">
          <path d="M 0 0 C -3 -2 -5 -10 0 -18 C 5 -10 3 -2 0 0 Z" fill="${seedColor}" opacity="0.9"/>
        </g>
        <g class="gt-leaf" transform="translate(${cx}, ${groundY - 32}) rotate(30)" style="animation-delay: 180ms;">
          <path d="M 0 0 C -3 -2 -5 -10 0 -18 C 5 -10 3 -2 0 0 Z" fill="${seedColor}" opacity="0.75"/>
        </g>
        <text x="${cx}" y="${groundY + 22}" text-anchor="middle" font-size="11" fill="#9A918A" font-style="italic" font-family="Georgia, serif">种下第一颗种子</text>`;
    } else {
      const leafCount = Math.max(Math.floor(n * 2 * bareFactor), 8);
      const offsets = [
        { dx: -0.5, dy: -0.2, size: 1.0 },
        { dx: -0.35, dy: -0.55, size: 1.1 },
        { dx: -0.15, dy: -0.7, size: 1.15 },
        { dx: 0.05, dy: -0.75, size: 1.2 },
        { dx: 0.25, dy: -0.65, size: 1.1 },
        { dx: 0.45, dy: -0.45, size: 1.05 },
        { dx: 0.55, dy: -0.15, size: 0.95 },
        { dx: -0.6, dy: 0.0, size: 0.9 },
        { dx: -0.4, dy: 0.15, size: 0.95 },
        { dx: -0.2, dy: 0.2, size: 1.0 },
        { dx: 0.0, dy: 0.25, size: 1.0 },
        { dx: 0.2, dy: 0.2, size: 0.95 },
        { dx: 0.4, dy: 0.1, size: 0.95 },
        { dx: -0.3, dy: -0.35, size: 1.0 },
        { dx: 0.3, dy: -0.4, size: 1.05 },
        { dx: -0.15, dy: -0.5, size: 1.0 },
        { dx: 0.15, dy: -0.5, size: 1.0 },
        { dx: 0.0, dy: -0.3, size: 0.9 },
        { dx: -0.5, dy: -0.4, size: 0.95 },
        { dx: 0.5, dy: -0.3, size: 0.95 }
      ];
      for (let i = 0; i < leafCount; i++) {
        const o = offsets[i % offsets.length];
        const lx = cx + o.dx * canopyW;
        const ly = canopyY + o.dy * canopyH - 5;
        const rot = (i * 47) % 360;
        const size = o.size;
        const color = pal.leaves[i % pal.leaves.length];
        const delay = (i % 14) * 40;
        // Some spring positions become small flowers
        if (flowerChance > 0 && (i % 3 === 0)) {
          leaves += `<g class="gt-flower" transform="translate(${lx.toFixed(1)}, ${ly.toFixed(1)})" style="animation-delay: ${delay + 600}ms;">
            <circle r="3.5" fill="${pal.flower}" opacity="0.9"/>
            <circle r="1.2" fill="#FAF8F5"/>
          </g>`;
        } else {
          // Every 6th leaf is a "memory leaf" with click target
          const memoryAttr = (i > 0 && i % 6 === 0 && diaries[i % n])
            ? ` data-leaf-date="${String(diaries[i % n].date).replace(/'/g, '')}"`
            : '';
          leaves += `<g class="gt-leaf${memoryAttr ? ' gt-memory' : ''}"${memoryAttr} transform="translate(${lx.toFixed(1)}, ${ly.toFixed(1)}) rotate(${rot}) scale(${size.toFixed(2)})" style="animation-delay: ${delay}ms;">
            <path d="M 0 0 C -3 -2 -5 -10 0 -18 C 5 -10 3 -2 0 0 Z" fill="${color}" opacity="0.88"/>
          </g>`;
        }
      }
    }

    // Milestone flowers (only outside winter, more visible in spring)
    let flowers = '';
    if (season !== 'winter') {
      milestones.slice(0, 5).forEach((m, i) => {
        const angle = Math.PI * (0.4 + i * 0.5);
        const fx = cx + Math.cos(angle) * canopyW * 0.35;
        const fy = canopyY + Math.sin(angle) * canopyH * 0.35 - 8;
        const delay = 900 + i * 150;
        const fcolor = season === 'autumn' ? '#D4847C' : pal.flower;
        const safeDate = String(m.date).replace(/'/g, '');
        flowers += `<g class="gt-flower gt-memory" data-leaf-date="${safeDate}" transform="translate(${fx.toFixed(1)}, ${fy.toFixed(1)})" style="animation-delay: ${delay}ms;">
          <circle r="4.5" fill="${fcolor}" opacity="0.95"/>
          <circle r="1.8" fill="#FAF8F5"/>
        </g>`;
      });
    }

    // Ambient drifting/falling elements (disabled per design update)
    let ambient = '';

    // Sky tint for season
    const skyTints = {
      spring: '#F0F5E5',
      summer: '#FBF7F2',
      autumn: '#F5E6D5',
      winter: '#E8EEF0'
    };

    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#7A6A55"/>
          <stop offset="50%" stop-color="#A89580"/>
          <stop offset="100%" stop-color="#7A6A55"/>
        </linearGradient>
        <radialGradient id="canopyGlow" cx="50%" cy="50%">
          <stop offset="0%" stop-color="${pal.glow}" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="${pal.glow}" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="sunGlow" cx="50%" cy="50%">
          <stop offset="0%" stop-color="${pal.sun}" stop-opacity="0.28"/>
          <stop offset="100%" stop-color="${pal.sun}" stop-opacity="0"/>
        </radialGradient>
        <rect id="skyRect" width="${W}" height="${H}" fill="${skyTints[season]}" opacity="0.0"/>
      </defs>

      <g class="gt-tree-sway">
        <circle cx="${W - 70}" cy="50" r="44" fill="url(#sunGlow)"/>

        <ellipse cx="${cx}" cy="${canopyY - 5}" rx="${canopyW + 30}" ry="${canopyH + 20}" fill="url(#canopyGlow)"/>

        <ellipse cx="${cx}" cy="${groundY + 6}" rx="${50 + canopyW * 0.3}" ry="4" fill="#9A918A" opacity="0.18"/>

        <path d="M ${cx - 65} ${groundY + 3} q 3 -9 6 0" stroke="${pal.grass}" stroke-width="1.2" fill="none" opacity="0.55"/>
        <path d="M ${cx - 50} ${groundY + 3} q 3 -11 6 0" stroke="${pal.grass}" stroke-width="1.2" fill="none" opacity="0.55"/>
        <path d="M ${cx + 48} ${groundY + 3} q 3 -10 6 0" stroke="${pal.grass}" stroke-width="1.2" fill="none" opacity="0.55"/>
        <path d="M ${cx + 62} ${groundY + 3} q 3 -8 6 0" stroke="${pal.grass}" stroke-width="1.2" fill="none" opacity="0.55"/>

        ${n > 0 ? `
          <path class="gt-trunk" d="${trunkPath}" stroke="url(#trunkGrad)" stroke-width="${8 * growth}" fill="none" stroke-linecap="round"/>
          <path class="gt-branch" d="${branchLeft}" stroke="${pal.branch}" stroke-width="${3 * growth}" fill="none" stroke-linecap="round" opacity="0.85" style="animation-delay: 400ms;"/>
          <path class="gt-branch" d="${branchRight}" stroke="${pal.branch}" stroke-width="${3 * growth}" fill="none" stroke-linecap="round" opacity="0.85" style="animation-delay: 500ms;"/>
          <path class="gt-branch" d="${branchTopLeft}" stroke="${pal.branch}" stroke-width="${2.2 * growth}" fill="none" stroke-linecap="round" opacity="0.7" style="animation-delay: 600ms;"/>
          <path class="gt-branch" d="${branchTopRight}" stroke="${pal.branch}" stroke-width="${2.2 * growth}" fill="none" stroke-linecap="round" opacity="0.7" style="animation-delay: 700ms;"/>
        ` : `
          <path class="gt-trunk" d="M ${cx} ${groundY} L ${cx} ${groundY - 30}" stroke="url(#trunkGrad)" stroke-width="2.8" fill="none" stroke-linecap="round"/>
        `}

        ${leaves}
        ${flowers}
      </g>

      ${ambient}
    </svg>`;
  }

  /* =========================================================
     Timeline
     ========================================================= */
  function renderTimeline() {
    const root = $('timelineList');
    root.innerHTML = '';
    const diaries = getDiariesByMonth(state.selectedMonth);

    $('monthBtnText').textContent =
      `${state.selectedMonth.split('-')[0]}年${parseInt(state.selectedMonth.split('-')[1])}月`;

    if (diaries.length === 0) {
      const empty = el('div', { class: 'tl-empty-state' });
      empty.innerHTML = `
        <div class="leaf">📖</div>
        <h4>这个月还没有记录</h4>
        <p>从今天开始写下第一个故事吧 🌱</p>
      `;
      root.appendChild(empty);
      return;
    }

    const block = el('div', { class: 'month-block' });
    const label = el('div', { class: 'month-label' });
    label.textContent = `${state.selectedMonth.split('-')[0]}年${parseInt(state.selectedMonth.split('-')[1])}月 · ${diaries.length}则`;
    block.appendChild(label);

    diaries.forEach((d, i) => {
      block.appendChild(renderTimelineItem(d, i));
    });
    root.appendChild(block);
  }

  function renderTimelineItem(d, idx) {
    const wrap = el('div', { class: 'tl-day', style: `animation-delay: ${idx * 40}ms;` });
    const dt = parseDate(d.date);
    const header = el('div', { class: 'tl-day-header' });
    header.innerHTML = `
      <span>${dt.getMonth() + 1}月${dt.getDate()}日</span>
      <span class="weekday">${getWeekday(dt)}</span>
    `;
    wrap.appendChild(header);

    const card = el('div', {
      class: 'tl-card',
      onclick: () => goToDate(d.date)
    });
    const photos = (d.photos || []).slice(0, 3);
    let photosHtml = '<div class="tl-photos">';
    photos.forEach(p => {
      photosHtml += `<div class="tl-photo"><img src="${p}" alt="" onerror="this.parentElement.style.background='${FALLBACK_BG}';this.style.display='none';"></div>`;
    });
    photosHtml += '</div>';
    card.innerHTML = photosHtml + `

  function pickPhoto(idx) {
    const input = $('fileInput');
    input.value = '';
    input.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      // Resize before storing to keep localStorage reasonable
      resizeImage(file, 800).then(dataUrl => {
        state.editPhotos[idx] = dataUrl;
        renderPhotoUploader();
      });
    };
    input.click();
  }
  function resizeImage(file, maxSide) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > maxSide || height > maxSide) {
            if (width > height) { height = height * (maxSide / width); width = maxSide; }
            else { width = width * (maxSide / height); height = maxSide; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', 0.78));
        };
        img.onerror = () => resolve(e.target.result);
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function getMyPosts() {

    return [];

  function bumpVoucher(delta) {

  function handleLike(btn) {

    const newCount = effectiveLikes(post);
    btn.classList.toggle('liked', !wasLiked);
    btn.querySelector('.count').textContent = newCount;
    const svg = btn.querySelector('svg');
    svg.setAttribute('fill', !wasLiked ? 'currentColor' : 'none');

      btn.classList.add('like-anim');
      setTimeout(() => btn.classList.remove('like-anim'), 400);

  function formatTimeAgo(iso) {
    if (!iso) return '';
    const t = new Date(iso).getTime();
    const now = new Date('2026-07-06T12:00:00').getTime(); // Fixed demo now
    const diff = Math.max(0, now - t);
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return '刚刚';
    if (mins < 60) return `${mins} 分钟前`;
    const hours = Math.floor(mins / 60);
    if (hours < 24) return `${hours} 小时前`;
    const days = Math.floor(hours / 24);
    if (days < 7) return `${days} 天前`;
    return iso.substring(0, 10);
  }

  /* =========================================================

     ========================================================= */
  function pickRandomMemoryDiary() {
    const all = getAllDiaries();
    if (all.length === 0) return null;
    // Reset used list when all have been shown
    const used = new Set(state.usedDiaryIds || []);
    const remaining = all.filter(d => !used.has(d.date));
    let pick;
    if (remaining.length > 0) {
      pick = remaining[Math.floor(Math.random() * remaining.length)];
    } else {
      // All shown — reset
      state.usedDiaryIds = [];
      pick = all[Math.floor(Math.random() * all.length)];
    }
    state.usedDiaryIds = state.usedDiaryIds || [];
    state.usedDiaryIds.push(pick.date);
    return pick;
  }

    $('sheetCloseBtn').addEventListener('click', () => {
      hideSheet('editSheet');
      state.editing = null;
    });
    const overlayDismiss = () => {
      if ($('editSheet').classList.contains('open')) {
        hideSheet('editSheet');
        state.editing = null;
      } else if ($('monthSheet').classList.contains('open')) {
        closeMonthPicker();
      } else if ($('composerSheet').classList.contains('open')) {
        hideSheet('composerSheet');
      } else if ($('memorySheet').classList.contains('open')) {
        hideSheet('memorySheet');
      }
    };
    $('sheetOverlay').addEventListener('click', overlayDismiss);
    $('monthOverlay').addEventListener('click', overlayDismiss);
    $('composerOverlay').addEventListener('click', overlayDismiss);
    $('memoryOverlay').addEventListener('click', overlayDismiss);
    $('saveDiaryBtn').addEventListener('click', saveDiary);

    // Community composer (发帖)
    $('newPostBtn').addEventListener('click', openComposer);
    $('composerCloseBtn').addEventListener('click', () => hideSheet('composerSheet'));
    $('composerSendBtn').addEventListener('click', submitPost);
    $('composerText').addEventListener('input', updateComposerCounter);

    // Memory sheet (成长树随机故事)
    $('memorySheetCloseBtn').addEventListener('click', () => hideSheet('memorySheet'));

    // Templates
    document.querySelectorAll('.template-chip').forEach(c => {
      c.addEventListener('click', () => {
        const tpl = c.dataset.tpl;
        const ta = $('diaryText');
        const idx = tpl.indexOf('___');
        if (idx >= 0) {
          ta.value = tpl;
          ta.focus();
          ta.setSelectionRange(idx, idx + 3);
        } else {
          ta.value = tpl;
        }
      });
    });

    // Month picker
    $('monthBtn').addEventListener('click', openMonthPicker);
    $('monthCloseBtn').addEventListener('click', closeMonthPicker);

    // Confirm
    $('confirmCancel').addEventListener('click', hideConfirm);
    $('confirmOk').addEventListener('click', () => {
      if (confirmCallback) confirmCallback();
      hideConfirm();
    });

    // Expose for inline handlers
    window.__yaji_openEdit = openEdit;
    window.__yaji_toast = showToast;
    window.__yaji_goToday = goToDate;
  }

  /* =========================================================
     Init
     ========================================================= */
  function init() {
    initData();
    setupEvents();
    renderApp();
  }

  init();
})();
</script>
</body>
</html>
