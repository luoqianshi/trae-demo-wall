<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML Visual Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/editor.css">
</head>
<body>

<!-- ========== 导入首页 ========== -->
<div class="import-page" id="importPage">
  <div class="import-card">
    <h1 class="import-title">粘贴 HTML，<em>即刻精修</em></h1>
    <p class="import-subtitle">把 AI 生成的 HTML 代码粘贴到下方，像改 PPT 一样修改每一个细节</p>

    <div class="import-url-row" style="display:flex;gap:8px;margin-bottom:12px;">
      <input type="url" id="urlInput" class="import-url-input" placeholder="或粘贴网页 URL（如 https://example.com/page.html）" style="flex:1;height:38px;padding:0 12px;background:var(--bg-base);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);color:var(--text-secondary);font-size:13px;outline:none;" />
      <button id="urlImportBtn" class="btn-secondary" style="white-space:nowrap;">URL 导入</button>
    </div>

    <textarea class="import-textarea" id="importTextarea" placeholder="将 AI 生成的 HTML 代码粘贴到这里..."></textarea>

    <div class="import-actions">
      <div class="import-left">
        <button class="btn-secondary" id="loadDemoBtn">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12M2 8h12M2 12h8"/></svg>
          加载示例
        </button>
        <button class="btn-secondary" id="uploadFileBtn">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v8m0 0L5 7m3 3l3-3M2 12v2h12v-2"/></svg>
          上传文件
        </button>
        <input type="file" id="fileInput" accept=".html,.htm" style="display:none">
      </div>
      <button class="btn-primary" id="startEditBtn">
        开始编辑
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8h10m0 0L9 4m4 4l-4 4"/></svg>
      </button>
    </div>

    <div class="import-divider">或者</div>
    <p style="font-size:12px;color:var(--text-disabled);">支持粘贴 URL · 响应式预览 · 一键导出</p>
  </div>
</div>

<!-- ========== 顶部工具栏 ========== -->
<div class="topbar">
  <div class="brand">
    <div class="brand-mark">H</div>
    <span class="brand-name">HTML Editor</span>
  </div>

  <div class="topbar-divider"></div>

  <div class="topbar-section">
    <button class="tb-btn disabled" id="undoBtn" title="撤销 (Ctrl+Z)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 7h7a4 4 0 1 1 0 8H5M3 7l3-3M3 7l3 3"/></svg>
    </button>
    <button class="tb-btn disabled" id="redoBtn" title="重做 (Ctrl+Shift+Z)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13 7H6a4 4 0 1 0 0 8h5M13 7l-3-3M13 7l-3 3"/></svg>
    </button>
  </div>

  <div class="topbar-divider"></div>

  <div class="breakpoint-group">
    <button class="bp-btn active" data-bp="desktop" title="桌面端">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="8" rx="1"/><path d="M6 14h4M8 11v3"/></svg>
      <span>1280</span>
    </button>
    <button class="bp-btn" data-bp="tablet" title="平板">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="2" width="10" height="12" rx="1"/><path d="M7 12h2"/></svg>
      <span>768</span>
    </button>
    <button class="bp-btn" data-bp="mobile" title="手机">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="2" width="6" height="12" rx="1"/><path d="M7 12h2"/></svg>
      <span>375</span>
    </button>
  </div>

  <div class="topbar-divider"></div>

  <button class="tb-btn" id="previewBtn" title="预览">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1.5 8s2.5-5 6.5-5 6.5 5 6.5 5-2.5 5-6.5 5-6.5-5-6.5-5z"/><circle cx="8" cy="8" r="2"/></svg>
    预览
  </button>

  <div class="topbar-right">
    <div style="position:relative;">
      <button class="btn-secondary" id="exportBtn">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v8m0 0L5 7m3 3l3-3M2 12v2h12v-2"/></svg>
        导出
      </button>
      <div class="export-menu" id="exportMenu">
        <button id="exportDownload">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v8m0 0L5 7m3 3l3-3M2 12v2h12v-2"/></svg>
          下载 HTML 文件
        </button>
        <button id="exportCopy">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="8" height="8" rx="1"/><path d="M3 11V3h8"/></svg>
          复制 HTML 代码
        </button>
        <div class="export-divider"></div>
        <button id="exportHandoff">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2l1.5 4.5L14 8l-4.5 1.5L8 14l-1.5-4.5L2 8l4.5-1.5z"/></svg>
          导出 AI 交接文件
        </button>
      </div>
    </div>
    <button class="btn-primary" id="shareBtn">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 8.5l4-4M10 8.5l-4 4M6 4.5h6a2 2 0 0 1 0 4M10 11.5H4a2 2 0 0 1 0-4"/></svg>
      分享
    </button>
  </div>
</div>

<!-- ========== 主体三栏 ========== -->
<div class="workspace">

  <!-- 左侧素材面板 -->
  <div class="left-panel" id="leftPanel">
    <div class="panel-header">
      <span class="panel-title">素材</span>
      <button class="panel-toggle" id="leftPanelToggle">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" style="width:14px;height:14px"><path d="M10 4L6 8l4 4"/></svg>
      </button>
    </div>
    <div class="material-list">
      <div class="material-hint">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" style="width:14px;height:14px;flex-shrink:0;"><path d="M8 2v8m0 0L5 7m3 3l3-3M2 12v2h12v-2"/></svg>
        <span>点击或拖拽素材到页面</span>
      </div>
      <div class="material-group">
        <div class="material-group-title">文字</div>
        <div class="material-item" draggable="true" data-add="heading">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12M2 4l1.5 9M14 4l-1.5 9M5 9h6"/></svg>
          <span>标题</span>
        </div>
        <div class="material-item" draggable="true" data-add="paragraph">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12M2 7h10M2 10h12M2 13h8"/></svg>
          <span>段落</span>
        </div>
        <div class="material-item" draggable="true" data-add="label">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h8M6 8h4M5 12h6"/></svg>
          <span>标签</span>
        </div>
      </div>
      <div class="material-group">
        <div class="material-group-title">媒体</div>
        <div class="material-item" draggable="true" data-add="image">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="12" height="12" rx="1"/><circle cx="6" cy="6" r="1.5"/><path d="M2 11l3-3 4 4 2-2 3 3"/></svg>
          <span>图片</span>
        </div>
        <div class="material-item" draggable="true" data-add="video">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="1"/><path d="M7 6v4l3-2z"/></svg>
          <span>视频</span>
        </div>
        <div class="material-item" draggable="true" data-add="icon">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2L4 8h3l-1 6 4-6H7z"/></svg>
          <span>图标</span>
        </div>
      </div>
      <div class="material-group">
        <div class="material-group-title">组件</div>
        <div class="material-item" draggable="true" data-add="button">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="5" width="12" height="6" rx="3"/><circle cx="11" cy="8" r="1" fill="currentColor"/></svg>
          <span>按钮</span>
        </div>
        <div class="material-item" draggable="true" data-add="divider">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 8h12"/></svg>
          <span>分割线</span>
        </div>
        <div class="material-item" draggable="true" data-add="container">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="12" height="12" rx="1"/><path d="M2 6h12"/></svg>
          <span>容器</span>
        </div>
      </div>
      <div class="material-group">
        <div class="material-group-title">嵌入</div>
        <div class="material-item" draggable="true" data-add="form">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12v8H2z"/><path d="M2 4l6 5 6-5"/><path d="M5 8h2M9 8h2"/></svg>
          <span>表单</span>
        </div>
        <div class="material-item" draggable="true" data-add="map">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 5c0-1 1-2 2-2h8c1 0 2 1 2 2v5c0 1-1 2-2 2H4c-1 0-2-1-2-2z"/></svg>
          <span>地图</span>
        </div>
        <div class="material-item" draggable="true" data-add="linkcard">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="1"/><path d="M5 6h6M5 9h4"/></svg>
          <span>链接卡片</span>
        </div>
      </div>
      <div class="material-group">
        <div class="material-group-title">品牌</div>
        <div class="material-item" draggable="true" data-add="logo">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="10" height="10" rx="2"/></svg>
          <span>Logo 占位</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 中央画布区 -->
  <div class="canvas-area">
    <div class="canvas-info-bar" id="canvasInfoBar">
      <div class="breadcrumb" id="breadcrumb">
        <span style="color:var(--text-disabled);font-size:11px;">点击元素查看层级</span>
      </div>
      <div class="canvas-meta">
        <span class="canvas-meta-item" id="canvasDimensions">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" style="width:12px;height:12px"><rect x="2" y="2" width="12" height="12" rx="1"/></svg>
          960 × 自动
        </span>
        <span class="canvas-meta-item" id="annotationCount" style="color:var(--success);">
          <span style="width:6px;height:6px;background:var(--success);border-radius:50%;display:inline-block;"></span>
          等待加载
        </span>
      </div>
    </div>

    <div class="canvas-container">
      <div class="iframe-wrapper" id="iframeWrapper">
        <iframe id="editor-iframe" sandbox="allow-same-origin"></iframe>

        <!-- 覆盖层 -->
        <div class="overlay" id="overlay">
          <!-- 悬停高亮 -->
          <div class="hover-box" id="hoverBox"></div>
          <div class="hover-label" id="hoverLabel"></div>

          <!-- 选中框 -->
          <div class="select-box" id="selectBox">
            <div class="drag-hint" id="dragHint">⠿ 拖拽移动</div>
            <div class="handle handle-nw"></div>
            <div class="handle handle-n"></div>
            <div class="handle handle-ne"></div>
            <div class="handle handle-e"></div>
            <div class="handle handle-se"></div>
            <div class="handle handle-s"></div>
            <div class="handle handle-sw"></div>
            <div class="handle handle-w"></div>

            <!-- 浮层工具条 -->
            <div class="float-toolbar" id="floatToolbar">
              <button data-action="duplicate" title="复制">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="8" height="8" rx="1"/><path d="M3 11V3h8"/></svg>
              </button>
              <button data-action="free-move" title="自由定位（可随意拖动位置）">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v3M8 11v3M2 8h3M11 8h3"/><circle cx="8" cy="8" r="2.5"/><path d="M5 5l-2-2M11 5l2-2M5 11l-2 2M11 11l2 2"/></svg>
              </button>
              <button data-action="move-up" title="上移层级">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 10l4-4 4 4"/></svg>
              </button>
              <button data-action="move-down" title="下移层级">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6l4 4 4-4"/></svg>
              </button>
              <div class="float-toolbar-divider"></div>
              <button class="ai" data-action="ai" title="AI 助手 (Ctrl+I)">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2l1.5 4.5L14 8l-4.5 1.5L8 14l-1.5-4.5L2 8l4.5-1.5z"/></svg>
              </button>
              <div class="float-toolbar-divider"></div>
              <button class="danger" data-action="delete" title="删除 (Delete)">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 5h10M6 5V3h4v2M5 5l1 9h4l1-9"/></svg>
              </button>
            </div>
          </div>

          <!-- 插入指示线 -->
          <div class="insert-indicator" id="insertIndicator"></div>
        </div>
      </div>
    </div>

    <!-- 预览态徽章 -->
    <div class="preview-badge" id="previewBadge">
      <span class="dot"></span>
      预览模式 · 点击退出
    </div>
  </div>

  <!-- 右侧属性面板 -->
  <div class="right-panel" id="rightPanel">
    <div class="panel-header">
      <span class="panel-title">属性</span>
    </div>
    <div class="property-content" id="propertyContent">
      <div style="padding: 40px 16px; text-align: center; color: var(--text-tertiary);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" style="width:32px;height:32px;margin-bottom:8px;opacity:0.4;">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M9 9h6M9 13h6M9 17h3"/>
        </svg>
        <p style="font-size:12px;">点击页面元素开始编辑</p>
      </div>
    </div>
  </div>
</div>

<!-- ========== 脚本（按依赖顺序加载） ========== -->
<script src="js/event-bus.js"></script>
<script src="js/undo-redo.js"></script>
<script src="js/iframe-manager.js"></script>
<script src="js/dom-annotator.js"></script>
<script src="js/element-factory.js"></script>
<script src="js/selection.js"></script>
<script src="js/inline-editor.js"></script>
<script src="js/property-panel.js"></script>
<script src="js/exporter.js"></script>
<script src="js/layout-detector.js"></script>
<script src="js/drag-manager.js"></script>
<script src="js/main.js"></script>
</body>
</html>
