<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Atlas｜记忆地图</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#FAFAF8;--bg2:#F2F1ED;--line:#E5E4DF;--line2:#DDDCD7;
  --ink:#1A1A1A;--muted:#8A8882;--dim:#B5B3AB;
  --accent:#2B6E5A;--accent2:#3A7FA8;
  --serif:Georgia,"Noto Serif SC","Songti SC",serif;
  --sans:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --r:4px;
}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--ink);text-decoration:none}
img{max-width:100%;display:block}

/* ====== HEADER ====== */
.hdr{position:sticky;top:0;z-index:90;background:rgba(250,250,248,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hdr-inner{max-width:1200px;margin:0 auto;padding:.9rem 2rem;display:flex;align-items:center;justify-content:space-between}
.hdr-brand{font-family:var(--serif);font-size:1rem;letter-spacing:.02em}
.hdr-brand em{font-style:italic;color:var(--accent)}
.hdr-nav{display:flex;gap:1.8rem;font-size:.82rem}
.hdr-nav a{color:var(--muted);transition:color .2s}
.hdr-nav a:hover,.hdr-nav a.active{color:var(--ink)}

/* ====== HERO ====== */
.hero{max-width:1200px;margin:0 auto;padding:3.5rem 2rem 1rem;display:grid;grid-template-columns:1fr 1fr;gap:2rem;align-items:center;min-height:70vh}
.hero-left h1{font-family:var(--serif);font-size:clamp(2.6rem,5vw,4.2rem);font-weight:400;letter-spacing:-.02em;line-height:1.1;margin-bottom:.6rem}
.hero-left h1 em{font-style:italic;color:var(--accent)}
.hero-left p{color:var(--muted);font-size:1.05rem;max-width:320px;line-height:1.7;margin-bottom:1.5rem}
.hero-cta{display:inline-block;font-size:.8rem;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:.15rem;transition:color .2s}
.hero-cta:hover{color:var(--ink)}
.hero-wall{display:grid;grid-template-columns:1.2fr 1fr;grid-template-rows:3fr 1fr 2.5fr;gap:.5rem;height:480px}
.hero-wall img{width:100%;height:100%;object-fit:cover;border-radius:var(--r);transition:transform .4s}
.hero-wall img:hover{transform:scale(1.02)}
.hero-wall .w-1{grid-row:1/3;grid-column:1}
.hero-wall .w-2{grid-row:1;grid-column:2}
.hero-wall .w-3{grid-row:2/4;grid-column:2}
.hero-wall .w-4{grid-row:3;grid-column:1}

/* ====== SECTIONS ====== */
.sec{max-width:1200px;margin:0 auto;padding:2.5rem 2rem}
.sec-head{margin-bottom:2rem}
.sec-title{font-family:var(--serif);font-size:1.3rem;font-weight:400;letter-spacing:.02em;margin-bottom:.3rem}
.sec-desc{font-size:.88rem;color:var(--muted)}
.rule{border:none;border-top:1px solid var(--line);max-width:1200px;margin:0 auto}

/* ====== TIMELINE ====== */
.timeline-h{display:flex;align-items:flex-start;justify-content:space-between;position:relative;padding:1.8rem 0 1.5rem}
.timeline-h::before{content:'';position:absolute;top:calc(1.8rem + 5px);left:5%;right:5%;height:1px;background:var(--line)}
.tl-h-item{text-align:center;cursor:pointer;position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center}
.tl-h-item:hover .tl-h-city{color:var(--ink)}
.tl-h-dot{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);flex-shrink:0}
.tl-h-item:hover .tl-h-dot{border-color:var(--ink)}
.tl-h-date{font-size:.72rem;color:var(--dim);margin-bottom:.5rem;white-space:nowrap}
.tl-h-city{font-family:var(--serif);font-size:.88rem;color:var(--muted);transition:color .2s;white-space:nowrap;margin-top:.5rem}
.map-wrap{position:relative;background:var(--bg2);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);max-width:720px;margin:0 auto}
.map-wrap svg{width:100%;height:auto;display:block}
.map-point{cursor:pointer}
.map-point .dot{transition:r .3s}
.map-point .ring{transition:r .3s,opacity .3s}
.map-point:hover .dot{r:6}
.map-point:hover .ring{r:14;opacity:.3}
.map-point .lbl{opacity:0;transition:opacity .2s;pointer-events:none}
.map-point:hover .lbl{opacity:1}
.map-hint{font-size:.72rem;color:var(--muted);margin-top:.5rem;text-align:center}

/* ====== WORKS GRID ====== */
.works-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem}
.work-card{cursor:pointer;transition:opacity .3s}
.work-card:hover{opacity:.85}
.work-card img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r);background:var(--bg2);margin-bottom:.75rem}
.work-meta{display:flex;align-items:baseline;gap:.6rem;margin-bottom:.15rem}
.work-city{font-family:var(--serif);font-size:1.05rem;font-weight:400}
.work-date{font-size:.72rem;color:var(--dim)}
.work-note{font-size:.82rem;color:var(--muted);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.work-tags{display:flex;gap:.25rem;margin-top:.4rem;flex-wrap:wrap}
.work-tag{font-size:.65rem;padding:.1rem .4rem;border-radius:999px;border:1px solid var(--line);color:var(--dim)}

/* ====== PLACES ====== */
.places-wrap{display:flex;flex-direction:column;gap:2rem}
.place-country{font-family:var(--serif);font-size:1.15rem;margin-bottom:.3rem}
.place-city{font-size:.9rem;color:var(--muted);margin-bottom:.6rem}
.place-group{margin-bottom:.5rem}
.place-group-title{font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:.3rem}
.place-list{display:flex;flex-wrap:wrap;gap:.4rem}
.place-chip{padding:.25rem .7rem;border-radius:999px;border:1px solid var(--line);font-size:.78rem;color:var(--muted);cursor:pointer;transition:all .2s;background:var(--bg)}
.place-chip:hover{border-color:var(--ink);color:var(--ink)}
.place-chip .pl-type{font-size:.65rem;color:var(--dim);margin-left:.3rem}

/* ====== DETAIL OVERLAY ====== */
.detail-overlay{position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .35s}
.detail-overlay.show{opacity:1;pointer-events:auto}
.detail-back{position:sticky;top:0;z-index:2;padding:1rem 2rem;cursor:pointer;font-size:.82rem;color:var(--muted);display:inline-flex;align-items:center;gap:.4rem;background:var(--bg);border-bottom:1px solid var(--line);transition:color .2s}
.detail-back:hover{color:var(--ink)}
.detail-inner{max-width:720px;margin:0 auto;padding:1.5rem 2rem 4rem}
.detail-hero-img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:var(--r);background:var(--bg2);margin-bottom:1.5rem}
.detail-city-big{font-family:var(--serif);font-size:clamp(1.8rem,4vw,2.8rem);font-weight:400;letter-spacing:-.01em;margin-bottom:.2rem}
.detail-meta{font-size:.85rem;color:var(--muted);margin-bottom:1.25rem}
.detail-note{font-size:.95rem;color:var(--ink);line-height:1.85;margin-bottom:1.5rem}
.detail-gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin-bottom:2rem}
.detail-gallery img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:var(--r);background:var(--bg2);cursor:pointer;transition:opacity .25s}
.detail-gallery img:hover{opacity:.8}
.detail-saved h4{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:.6rem}
.saved-item{display:flex;align-items:center;gap:.6rem;padding:.4rem 0;border-bottom:1px solid var(--line);cursor:pointer;transition:color .2s}
.saved-item:last-child{border-bottom:none}
.saved-item:hover{color:var(--accent)}
.saved-name{font-size:.88rem}
.saved-type{font-size:.65rem;color:var(--dim);border:1px solid var(--line);padding:.06rem .35rem;border-radius:999px;white-space:nowrap}

/* ====== COMMENTS ====== */
.detail-comments{margin-top:2rem}
.detail-comments h4{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:.75rem}
.cmt-list{margin-bottom:1rem}
.cmt-item{padding:.6rem 0;border-bottom:1px solid var(--line);display:flex;gap:.6rem}
.cmt-item:last-child{border-bottom:none}
.cmt-avatar{width:28px;height:28px;border-radius:50%;background:var(--bg2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.68rem;color:var(--dim);border:1px solid var(--line)}
.cmt-body{flex:1;min-width:0}
.cmt-name{font-size:.78rem;font-weight:500;margin-bottom:.1rem}
.cmt-text{font-size:.82rem;color:var(--muted);line-height:1.6}
.cmt-time{font-size:.68rem;color:var(--dim);margin-top:.15rem}
.cmt-form{display:flex;gap:.6rem;margin-top:.75rem}
.cmt-input{flex:1;border:1px solid var(--line);border-radius:999px;padding:.45rem 1rem;font-size:.82rem;background:var(--bg);color:var(--ink);outline:none;font-family:var(--sans)}
.cmt-input:focus{border-color:var(--dim)}
.cmt-input::placeholder{color:var(--dim)}
.cmt-submit{padding:.45rem 1rem;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:.8rem;color:var(--muted);cursor:pointer;transition:all .2s;white-space:nowrap;font-family:var(--sans)}
.cmt-submit:hover{border-color:var(--ink);color:var(--ink)}

/* ====== MODAL ====== */
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:1.5rem;width:90%;max-width:340px;transform:translateY(8px);transition:transform .25s}
.modal-overlay.show .modal{transform:translateY(0)}
.modal h3{font-family:var(--serif);font-size:1.1rem;margin-bottom:.15rem}
.modal .m-city{font-size:.78rem;color:var(--muted);margin-bottom:.4rem}
.modal .m-type{display:inline-block;font-size:.68rem;padding:.12rem .45rem;border-radius:999px;border:1px solid var(--line);color:var(--dim);margin-bottom:.75rem}
.modal .m-note{font-size:.85rem;color:var(--muted);line-height:1.65;margin-bottom:1.25rem}
.modal-close{width:100%;padding:.5rem;border:1px solid var(--line);border-radius:999px;background:none;font-size:.8rem;color:var(--muted);cursor:pointer;transition:all .2s}
.modal-close:hover{border-color:var(--ink);color:var(--ink)}

/* ====== FOOTER ====== */
.ftr{max-width:1200px;margin:0 auto;padding:3rem 2rem;text-align:center}
.ftr p{font-size:.78rem;color:var(--muted);line-height:1.8}
.ftr-rule{border:none;border-top:1px solid var(--line);max-width:1200px;margin:0 auto}

/* ====== RESPONSIVE ====== */
@media(max-width:860px){
  .hero{grid-template-columns:1fr;padding:2rem 1.5rem 1rem;min-height:auto}
  .hero-wall{height:320px}
  .works-grid{grid-template-columns:repeat(2,1fr)}
  .sec{padding:2.5rem 1.5rem}
  .hdr-inner{padding:.7rem 1.5rem}
  .detail-gallery{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:560px){
  .works-grid{grid-template-columns:1fr}
  .hero-wall{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;height:280px}
  .hero-wall .w-1{grid-row:1;grid-column:1}
  .hero-wall .w-2{grid-row:1;grid-column:2}
  .hero-wall .w-3{grid-row:2;grid-column:1}
  .hero-wall .w-4{grid-row:2;grid-column:2}
  .hdr-nav{gap:1.2rem;font-size:.78rem}
  .timeline-h{overflow-x:auto;-webkit-overflow-scrolling:touch;justify-content:flex-start;gap:0}
  .timeline-h::before{left:40px;right:40px}
  .tl-h-item{flex-shrink:0;min-width:84px;padding:0 .5rem}
}
</style>
</head>

// ====== INIT ======
(function() {
  renderMapPoints();
  renderWorks();
  renderTimeline();
  renderCollection();
  bindNav();
  bindModal();
})();

// ====== MAP ======
function renderMapPoints() {
  var g = document.getElementById('mapPoints');
  g.innerHTML = '';
  var coords = {
    shanghai:{x:548,y:168,c:'#2B6E5A'},
    beijing:{x:525,y:120,c:'#2B6E5A'},
    hongkong:{x:520,y:200,c:'#2B6E5A'},
    kyoto:{x:588,y:145,c:'#3A7FA8'},
    barcelona:{x:338,y:155,c:'#3A7FA8'},
    bangkok:{x:498,y:215,c:'#2B6E5A'}
  };
  var ns = 'http://www.w3.org/2000/svg';
  places.forEach(function(p) {
    var c = coords[p.id];
    if (!c) return;
    var group = document.createElementNS(ns, 'g');
    group.setAttribute('class', 'map-point');
    group.setAttribute('data-id', p.id);
    var ring = document.createElementNS(ns, 'circle');
    ring.setAttribute('class', 'ring'); ring.setAttribute('cx', c.x); ring.setAttribute('cy', c.y);
    ring.setAttribute('r', '10'); ring.setAttribute('fill', 'none');
    ring.setAttribute('stroke', c.c); ring.setAttribute('stroke-width', '1'); ring.setAttribute('opacity', '0.15');
    var dot = document.createElementNS(ns, 'circle');
    dot.setAttribute('class', 'dot'); dot.setAttribute('cx', c.x); dot.setAttribute('cy', c.y);
    dot.setAttribute('r', '4'); dot.setAttribute('fill', c.c);
    var lbl = document.createElementNS(ns, 'text');
    lbl.setAttribute('class', 'lbl'); lbl.setAttribute('x', c.x); lbl.setAttribute('y', c.y - 16);
    lbl.setAttribute('text-anchor', 'middle'); lbl.setAttribute('font-size', '11');
    lbl.setAttribute('fill', c.c); lbl.setAttribute('font-family', 'PingFang SC, sans-serif');
    lbl.textContent = p.city;
    group.appendChild(ring); group.appendChild(dot); group.appendChild(lbl);
    group.addEventListener('click', function() { openDetail(p.id); });
    g.appendChild(group);
  });
}

// ====== WORKS ======
function renderWorks() {
  var grid = document.getElementById('worksGrid');
  grid.innerHTML = '';
  var sorted = places.slice().sort(function(a, b) { return b.sortDate - a.sortDate; });
  sorted.forEach(function(p) {
    var card = document.createElement('div');
    card.className = 'work-card';
    card.onclick = function() { openDetail(p.id); };
    var tagsHtml = p.tags.map(function(t) { return '<span class="work-tag">' + esc(t) + '</span>'; }).join('');
    card.innerHTML = '<img src="' + p.cover + '" alt="' + esc(p.city) + '" loading="lazy">'
      + '<div class="work-meta"><span class="work-city">' + esc(p.city) + '</span><span class="work-date">' + esc(p.date) + '</span></div>'
      + '<div class="work-note">' + esc(p.note) + '</div>'
      + '<div class="work-tags">' + tagsHtml + '</div>';
    grid.appendChild(card);
  });
}

// ====== TIMELINE ======
function renderTimeline() {
  var list = document.getElementById('timelineList');
  list.innerHTML = '';
  var sorted = places.slice().sort(function(a, b) { return b.sortDate - a.sortDate; });
  sorted.forEach(function(p) {
    var item = document.createElement('div');
    item.className = 'tl-h-item';
    item.onclick = function() { openDetail(p.id); };
    item.innerHTML = '<div class="tl-h-date">' + esc(p.date) + '</div>'
      + '<div class="tl-h-dot"></div>'
      + '<div class="tl-h-city">' + esc(p.city) + '</div>';
    list.appendChild(item);
  });
}

// ====== COLLECTION ======
function renderCollection() {
  var wrap = document.getElementById('placesContent');
  var grouped = {};
  places.forEach(function(p) {
    if (!grouped[p.country]) grouped[p.country] = {};
    if (!grouped[p.country][p.city]) grouped[p.country][p.city] = p;
  });
  var html = '';
  Object.keys(grouped).sort().forEach(function(country) {
    html += '<div class="place-country">' + esc(country) + '</div>';
    Object.keys(grouped[country]).forEach(function(city) {
      var p = grouped[country][city];
      html += '<div class="place-city">' + esc(city) + '</div>';
      var spots = p.savedPlaces.filter(function(s) { return s.type === '景点'; });
      var foods = p.savedPlaces.filter(function(s) { return s.type !== '景点'; });
      if (spots.length) {
        html += '<div class="place-group"><div class="place-group-title">景点</div><div class="place-list">';
        spots.forEach(function(s) {
          html += '<span class="place-chip" onclick="openModal(\'' + esc(s.name) + '\',\'' + esc(p.city) + '\',\'' + esc(s.type) + '\',\'' + esc(s.note) + '\')">' + esc(s.name) + '<span class="pl-type">' + esc(s.type) + '</span></span>';
        });
        html += '</div></div>';
      }
      if (foods.length) {
        html += '<div class="place-group"><div class="place-group-title">美食</div><div class="place-list">';
        foods.forEach(function(s) {
          html += '<span class="place-chip" onclick="openModal(\'' + esc(s.name) + '\',\'' + esc(p.city) + '\',\'' + esc(s.type) + '\',\'' + esc(s.note) + '\')">' + esc(s.name) + '<span class="pl-type">' + esc(s.type) + '</span></span>';
        });
        html += '</div></div>';
      }
    });
  });
  wrap.innerHTML = html;
}

// ====== DETAIL ======
function openDetail(id) {
  var p = places.find(function(x) { return x.id === id; });
  if (!p) return;
  var galleryHtml = p.gallery.map(function(url) { return '<img src="' + url + '" alt="' + esc(p.city) + '" loading="lazy">'; }).join('');
  var savedHtml = '<div class="detail-saved"><h4>收藏地点</h4>';
  p.savedPlaces.forEach(function(s) {
    savedHtml += '<div class="saved-item" onclick="openModal(\'' + esc(s.name) + '\',\'' + esc(p.city) + '\',\'' + esc(s.type) + '\',\'' + esc(s.note) + '\')">'
      + '<span class="saved-name">' + esc(s.name) + '</span>'
      + '<span class="saved-type">' + esc(s.type) + '</span></div>';
  });
  savedHtml += '</div>';

  var cmts = p.comments || [];
  var cmtHtml = '<div class="detail-comments"><h4>留言</h4><div class="cmt-list">';
  if (cmts.length === 0) {
    cmtHtml += '<div style="font-size:.82rem;color:var(--dim);padding:.3rem 0">还没有留言，说点什么吧。</div>';
  } else {
    cmts.forEach(function(c) {
      cmtHtml += '<div class="cmt-item"><div class="cmt-avatar">' + esc(c.name.charAt(0)) + '</div><div class="cmt-body"><div class="cmt-name">' + esc(c.name) + '</div><div class="cmt-text">' + esc(c.text) + '</div><div class="cmt-time">' + esc(c.time) + '</div></div></div>';
    });
  }
  cmtHtml += '</div><div class="cmt-form"><input class="cmt-input" id="cmtInput" placeholder="写一条留言…" maxlength="200"><button class="cmt-submit" onclick="submitComment(\'' + p.id + '\')">发送</button></div></div>';

  document.getElementById('detailInner').innerHTML =
    '<img class="detail-hero-img" src="' + p.cover + '" alt="' + esc(p.city) + '">'
    + '<div class="detail-city-big">' + esc(p.city) + '</div>'
    + '<div class="detail-meta">' + esc(p.country) + ' · ' + esc(p.date) + '</div>'
    + '<div class="detail-note">' + esc(p.note) + '</div>'
    + '<div class="detail-gallery">' + galleryHtml + '</div>'
    + savedHtml
    + cmtHtml;

  document.getElementById('detailOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeDetail() {
  document.getElementById('detailOverlay').classList.remove('show');
  document.body.style.overflow = '';
}

function submitComment(placeId) {
  var input = document.getElementById('cmtInput');
  var text = input.value.trim();
  if (!text) return;
  var p = places.find(function(x) { return x.id === placeId; });
  if (!p) return;
  if (!p.comments) p.comments = [];
  var now = new Date();
  var timeStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
  p.comments.push({name:'访客', text:text, time:timeStr});
  var list = document.getElementById('cmtList');
  var item = document.createElement('div');
  item.className = 'cmt-item';
  item.innerHTML = '<div class="cmt-avatar">访</div><div class="cmt-body"><div class="cmt-name">访客</div><div class="cmt-text">' + esc(text) + '</div><div class="cmt-time">' + esc(timeStr) + '</div></div>';
  list.appendChild(item);
  input.value = '';
  // Remove empty hint if it existed
  var hint = list.querySelector('div[style]');
  if (hint && hint !== item) hint.remove();
}

// ====== MODAL ======
function bindModal() {
  document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') { closeModal(); closeDetail(); }
  });
}

function openModal(name, city, type, note) {
  document.getElementById('modalName').textContent = name;
  document.getElementById('modalCity').textContent = city;
  document.getElementById('modalType').textContent = type;
  document.getElementById('modalNote').textContent = note;
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

// ====== NAV ======
function bindNav() {
  var links = document.querySelectorAll('.hdr-nav a');
  var secs = ['footprint','works','collection'];
  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        links.forEach(function(l) { l.classList.remove('active'); });
        var a = document.querySelector('.hdr-nav a[href="#' + entry.target.id + '"]');
        if (a) a.classList.add('active');
      }
    });
  }, { threshold: 0.25 });
  secs.forEach(function(id) {
    var el = document.getElementById(id);
    if (el) observer.observe(el);
  });
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
</script>
