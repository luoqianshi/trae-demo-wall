const pythonChapters=[
{id:1,title:'认识Python',phase:'探索期',phaseIndex:0,concepts:['Python','解释型语言','应用领域','开发环境'],
content:'## 什么是Python？\n\nPython是一种**高级编程语言**，由Guido van Rossum于1991年创建。它的设计哲学强调代码的**可读性**和**简洁性**，让程序员能够用更少的代码行表达想法。\n\n### 为什么职场人需要学Python？\n\n想象一下这个场景：你每天需要从Excel中整理50份日报数据，手动复制粘贴需要**2小时**。\n\n而用Python，只需要这样的代码：\n\n```python\nimport pandas as pd\n\nreports = []\nfor i in range(1, 51):\n    df = pd.read_excel(f\'日报_{i:03d}.xlsx\')\n    reports.append(df)\n\nsummary = pd.concat(reports).groupby(\'部门\').sum()\nsummary.to_excel(\'日报汇总.xlsx\')\nprint(\'汇总完成！\')\n```\n\n> **同样的工作，Python只需30秒完成。**\n\n这就是为什么越来越多的职场人开始学习Python — 它不是为了让你成为程序员，而是为了让你**更高效地完成工作**。\n\n### Python能做什么？\n\n| 应用领域 | 常见用途 | 职业场景 |\n|---------|---------|--------|\n| 数据处理 | Excel自动化、数据清洗 | 财务、运营 |\n| 数据分析 | 统计分析、可视化报表 | 产品、市场 |\n| 自动化办公 | 邮件群发、文件整理 | 行政、HR |\n| 网络爬虫 | 信息采集、竞品监控 | 市场、销售 |\n\nPython的**语法接近自然语言**，即使没有编程基础也能快速上手。让我们从最基础的概念开始吧！',

{id:2,title:'变量与数据类型',phase:'探索期',phaseIndex:0,concepts:['变量','int','float','str','bool','类型转换'],
content:'## 什么是变量？\n\n想象你在做**电商运营**，每天要记录各种数据：\n\n- 今天的**订单数**：156\n- 今天的**销售额**：28500.50\n- 今天的**活动名称**："618大促"\n- 今天是否**包邮**：是\n\n在Python中，我们用**变量**来存储这些数据：\n\n```python\norders = 156\nsales = 28500.50\nevent_name = "618大促"\nfree_shipping = True\n```\n\n> 变量就像一个**带标签的盒子**，你可以把数据放进去，随时取出来用。\n\n### Python中的数据类型\n\n| 类型 | 英文名 | 示例 | 说明 |\n|-----|--------|------|------|\n| 整数 | `int` | `42`, `-7`, `0` | 没有小数点的数字 |\n| 浮点数 | `float` | `3.14`, `-0.5` | 带小数点的数字 |\n| 字符串 | `str` | `"你好"`, `\'hello\'` | 文本信息 |\n| 布尔值 | `bool` | `True`, `False` | 是或否 |\n\n### 类型很重要！\n\n不同类型之间不能随意运算。比如数字和字符串相加会**报错**：\n\n```python\nx = 10\ny = "20"\nprint(x + y)  # TypeError: 不支持 int + str 的运算\n```\n\n因为Python不知道你是想把它们加起来得到 **30**，还是把它们拼接成 **"1020"**。你需要**明确告诉Python**你想怎么做：\n\n```python\nprint(x + int(y))   # 输出: 30\nprint(str(x) + y)   # 输出: "1020"\n```\n\n> 在实际工作中，**数据类型转换**是最常见的操作之一。',
quiz:{question:'下面这段代码的输出是什么？\n\n```python\nx = 10\ny = "20"\nprint(x + y)\n```',options:[{label:'A',text:'30'},{label:'B',text:'"1020"'},{label:'C',text:'会报错（TypeError）'},{label:'D',text:'1020（不带引号）'}],correctIndex:2,explanation:'x是整数类型（int），y是字符串类型（str），Python不支持直接将不同类型相加，会抛出 TypeError。'}},
{id:3,title:'条件判断与循环',phase:'建构期',phaseIndex:1,concepts:['if / elif / else','for 循环','while 循环','break / continue','缩进规则'],
content:'## 让程序学会"思考"\n\n前面我们学会了存储数据，现在让程序根据数据做**判断**和**重复操作**。\n\n### if 语句：程序的分叉路口\n\n想象你是**运营经理**，需要根据用户消费金额决定折扣：\n\n```python\namount = 580\n\nif amount >= 500:\n    discount = 0.8\nelif amount >= 200:\n    discount = 0.9\nelse:\n    discount = 1.0\n\nfinal_price = amount * discount\nprint(f"实付金额：{final_price}元")\n```\n\n> Python用**缩进**（4个空格）来表示代码块的层级关系。\n\n### for 循环：批量处理数据\n\n```python\nusers = ["张三", "李四", "王五", "赵六"]\nfor user in users:\n    print(f"正在处理 {user} 的数据...")\n```\n\n### 循环中的 break 与 continue\n\n```python\ndata = [150, 0, 200, 0, 300, 50]\nfor value in data:\n    if value == 0:\n        continue\n    if value > 250:\n        print(f"异常数据：{value}")\n        break\n    print(f"处理数据：{value}")\n```\n\n> **关键理解**：if 是"选择走哪条路"，for 是"对每个东西做同样的事"，while 是"满足条件就继续做"。',
quiz:{question:'下面代码的输出是什么？\n\n```python\nfor i in range(1, 6):\n    if i == 3:\n        continue\n    print(i, end=" ")\n```',options:[{label:'A',text:'1 2 3 4 5'},{label:'B',text:'1 2 4 5'},{label:'C',text:'1 2'},{label:'D',text:'4 5'}],correctIndex:1,explanation:'当 i==3 时，continue 跳过了本次循环的 print 语句，所以 3 不会被输出。最终输出为：1 2 4 5'}},
{id:4,title:'函数与模块',phase:'建构期',phaseIndex:1,concepts:['def','参数','返回值','import','pip','第三方库'],
content:'## 把代码"打包"成可复用的工具\n\n当你的代码越来越长，你会发现有些操作在**反复出现**。这时候就该用**函数**了。\n\n### 定义函数\n\n```python\ndef calculate_tax(income, rate=0.1):\n    tax = income * rate\n    return income - tax\n\nafter_tax = calculate_tax(10000)\nprint(f"税后收入：{after_tax}")\n```\n\n> **函数的本质**：把一段有名字的代码封装起来，给它起个名字，需要的时候叫它就行。\n\n### 模块：站在别人的肩膀上\n\n```python\nimport pandas as pd\ndf = pd.read_excel("销售数据.xlsx")\nimport matplotlib.pyplot as plt\nplt.plot(df["月份"], df["销售额"])\n```\n\n### lambda 匿名函数\n\n```python\nusers = [{"name": "张三", "amount": 1500}, {"name": "李四", "amount": 3800}]\nsorted_users = sorted(users, key=lambda u: u["amount"], reverse=True)\n```',

{id:5,title:'文件操作与异常处理',phase:'精通期',phaseIndex:2,concepts:['open / close','with 语句','try / except','JSON','CSV','异常类型'],
content:'## 与外部世界交互\n\n真正的工作场景需要**读写文件**，而文件操作可能出错 — 这就需要**异常处理**。\n\n### 读取文件\n\n```python\n# 推荐！with语句自动关闭\nwith open("data.txt", "r", encoding="utf-8") as f:\n    content = f.read()\n```\n\n### 异常处理：让程序"不崩"\n\n```python\ndef safe_read(filepath):\n    try:\n        with open(filepath, "r", encoding="utf-8") as f:\n            return f.read()\n    except FileNotFoundError:\n        return f"错误：文件 {filepath} 不存在"\n    except Exception as e:\n        return f"未知错误：{e}"\n\nresult = safe_read("不存在的文件.txt")\nprint(result)\n```\n\n> **核心原则**：只捕获你预期可能发生的异常，不要用 except Exception 困住所有错误。\n\n### 处理JSON数据\n\n```python\nimport json\ndata = {"name": "智学", "users": 1000}\njson_str = json.dumps(data, ensure_ascii=False, indent=2)\nparsed = json.loads(json_str)\n```',
quiz:{question:'下面代码中，如果 data.csv 文件不存在，程序会怎样？\n\n```python\ntry:\n    with open("data.csv", "r") as f:\n        data = f.read()\nexcept FileNotFoundError:\n    print("文件不存在")\n    data = None\nfinally:\n    print("操作完成")\n```',options:[{label:'A',text:'程序崩溃'},{label:'B',text:'输出 "文件不存在"，然后输出 "操作完成"，data为None'},{label:'C',text:'输出 "操作完成"，data为空字符串'},{label:'D',text:'finally块不会执行'}],correctIndex:1,explanation:'try 中 open 抛出 FileNotFoundError，被 except 捕获。finally 块无论是否发生异常都会执行。'}},
{id:6,title:'综合实战项目',phase:'精通期',phaseIndex:2,concepts:['项目结构','函数组合','数据处理管道','自动化报表','实战思维'],
content:'## 从零到一：自动化周报生成器\n\n让我们把前面学到的所有知识串联起来，做一个**真正能用的工具**。\n\n### 完整代码\n\n```python\nimport csv\nimport json\nfrom datetime import datetime\n\ndef read_csv(filepath):\n    try:\n        with open(filepath, "r", encoding="utf-8") as f:\n            return list(csv.DictReader(f))\n    except FileNotFoundError:\n        print(f"警告：{filepath} 不存在")\n        return []\n\ndef calculate_metrics(orders, users):\n    total_sales = sum(float(o.get("amount", 0)) for o in orders)\n    new_users = len([u for u in users if u.get("type") == "new"])\n    conversion = len(orders) / len(users) * 100 if users else 0\n    return {"total_sales": round(total_sales, 2), "new_users": new_users, "conversion": round(conversion, 1)}\n\nif __name__ == "__main__":\n    orders = read_csv("orders.csv")\n    users = read_csv("users.csv")\n    metrics = calculate_metrics(orders, users)\n    print("=" * 30)\n    print(f"销售额：{metrics[\'total_sales\']}元")\n    print(f"新用户：{metrics[\'new_users\']}人")\n    print(f"转化率：{metrics[\'conversion\']}%")\n```\n\n### 代码设计思路\n\n| 模块 | 学到的知识点 |\n|------|------------|\n| `read_csv` | 文件操作 + 异常处理 + 函数 |\n| `calculate_metrics` | 变量 + 类型转换 + 列表推导式 |\n| 主流程 | 顺序执行 + 条件判断 |\n\n> **恭喜你完成了全部课程！** 编程能力来自**持续的练习**。',
quiz:{question:'在周报生成器项目中，read_csv 函数返回 []（空列表）最可能的原因是什么？',options:[{label:'A',text:'CSV文件中没有数据'},{label:'B',text:'CSV文件不存在，触发了 FileNotFoundError'},{label:'C',text:'csv.DictReader 返回的默认就是空列表'},{label:'D',text:'文件编码不对'}],correctIndex:1,explanation:'read_csv 函数中，当文件不存在时会捕获 FileNotFoundError 并返回空列表。'}}

{id:1,title:'Excel基础与数据录入',phase:'探索期',phaseIndex:0,concepts:['数据规范','数据验证','快捷键','冻结窗格','筛选'],
content:'## Excel：职场人的第一生产力工具\n\n无论你从事销售、财务、运营还是人力资源工作，**Excel都是不可替代的基础工具**。\n\n### 高效的数据录入规范\n\n| 规范 | 错误示范 | 正确做法 |\n|-----|---------|---------|\n| 表头 | 合并单元格写标题 | 每列一个字段，第一行是字段名 |\n| 日期 | "2024年3月" | 统一为 **2024-03-15** 格式 |\n| 金额 | "1,250元" | 纯数字 **1250** |\n| 空值 | 留空白或写 "无" | 统一留空 |\n\n### 快捷键：效率提升10倍\n\n| 操作 | 快捷键 | 使用场景 |\n|-----|--------|--------|\n| 快速填充 | Ctrl + E | 从示例中提取规律填充整列 |\n| 绝对引用 | F4 | 写公式时锁定行列 |\n| 定位空值 | Ctrl + G | 批量填充缺失值 |\n\n> **核心原则**：数据录入阶段的5分钟规范，能节省后期分析阶段的5小时返工。',
quiz:{question:'在Excel中录入销售数据时，以下哪种做法最符合数据分析规范？',options:[{label:'A',text:'金额列写 "12,500元"，日期列写 "3月15日"'},{label:'B',text:'合并A1:D1单元格作为大标题'},{label:'C',text:'金额列用纯数字12500，日期统一为2024-03-15格式'},{label:'D',text:'用红色背景标记异常数据'}],correctIndex:2,explanation:'规范的数据录入要求：数值不带单位、日期统一标准格式、空值保持空白。'}},
{id:2,title:'公式与函数入门',phase:'探索期',phaseIndex:0,concepts:['SUM / AVERAGE','IF','SUMIF / COUNTIF','单元格引用','嵌套函数'],
content:'## 从手动计算到自动计算\n\n### 引用类型\n\n| 引用类型 | 写法 | 复制时的行为 |\n|---------|------|------------|\n| 相对引用 | A1 | 行列都会自动偏移 |\n| 绝对引用 | $A$1 | 行列都锁定不变 |\n| 混合引用 | $A1 或 A$1 | 锁定列或锁定行 |\n\n> **记忆口诀**：加 $ 的就像钉在墙上，复制时不会动。\n\n### 职场必备五大函数\n\n```excel\n=SUM(C2:C100)           # 求和\n=AVERAGE(D2:D100)       # 平均值\n=IF(B2>=10000, "优秀", "待提升")\n=SUMIF(区域, "华东", 销售额列)\n=ROUND(A1, 2)            # 保留两位小数\n```\n\n> **实践建议**：写复杂公式时，从内向外一层一层写，每写一层就验证结果是否正确。',
quiz:{question:'在C2单元格输入公式 =A2*$B$2 后，向下拖动填充到C10，公式会变成什么样？',options:[{label:'A',text:'所有行都是 =A2*$B$2'},{label:'B',text:'变成 =A3*$B$3'},{label:'C',text:'变成 =A3*$B$2，A列变，B列锁定'},{label:'D',text:'变成 =A2*B3'}],correctIndex:2,explanation:'$B$2 是绝对引用，行和列都被锁定；A2是相对引用，向下填充时行号会自动递增。'}},
{id:3,title:'数据透视表与汇总',phase:'建构期',phaseIndex:1,concepts:['数据透视表','行/列/值/筛选器','分组','切片器','值显示方式'],
content:'## 数据分析的"瑞士军刀"\n\n数据透视表能在几秒钟内，把几千行的原始数据转换成清晰的多维度汇总报表。\n\n### 创建数据透视表\n\n```excel\n选中数据区域 -> 插入 -> 数据透视表 -> 新工作表\n行区域：销售区域\n值区域：订单金额（求和）\n筛选器：订单状态 = "已完成"\n```\n\n### 值字段设置\n\n| 汇总方式 | 适用场景 | 示例 |\n|---------|---------|------|\n| 求和 | 金额、数量 | 总销售额 |\n| 计数 | 统计次数 | 订单笔数 |\n| 平均值 | 客单价 | 平均订单金额 |\n| 占比 | 结构分布 | 各区域销售占比 |\n\n> **核心理解**：数据透视表的本质是**快速分组 + 聚合计算**。',
quiz:{question:'在数据透视表中，将"订单金额"拖到"值"区域后默认显示为"求和项"。如果想看每个销售区域的订单笔数，应该如何操作？',options:[{label:'A',text:'把"订单金额"改成"订单编号"'},{label:'B',text:'把值字段设置改为"计数"'},{label:'C',text:'新增一列"笔数"，全部填1'},{label:'D',text:'只能用 COUNTIF 函数'}],correctIndex:1,explanation:'数据透视表的"值"区域可以通过"值字段设置"切换汇总方式。'}},
{id:4,title:'VLOOKUP与数据匹配',phase:'建构期',phaseIndex:1,concepts:['VLOOKUP','INDEX+MATCH','XLOOKUP','IFERROR','跨表关联'],
content:'## 跨表关联：Excel里的"数据库查询"\n\n### VLOOKUP 基础语法\n\n```excel\n=VLOOKUP(查找值, 查找区域, 返回第几列, 精确/模糊匹配)\n```\n\n| 参数 | 说明 | 常见陷阱 |\n|-----|------|--------|\n| 查找值 | 你要查什么 | 格式必须一致 |\n| 查找区域 | 从哪张表查 | 查找值必须在第一列 |\n| 返回列号 | 返回第几列 | 从区域第一列开始数 |\n| 匹配方式 | FALSE=精确 | 99%场景用FALSE |\n\n### INDEX + MATCH\n\n```excel\n=INDEX(返回列, MATCH(查找值, 查找列, 0))\n```\n\n> **避坑指南**：VLOOKUP返回 #N/A 的三大原因：格式不一致、查找值不在第一列、隐藏空格。',

const productChapters=[
{id:1,title:'认识产品经理的角色',phase:'探索期',phaseIndex:0,concepts:['产品经理职责','需求本质','C端/B端','能力模型','用户洞察'],
content:'## 产品经理：为什么被称为"迷你CEO"？\n\n产品经理的核心使命：**在正确的时机，用正确的方式，把正确的产品交付给正确的用户**。\n\n### 产品经理的核心职责\n\n| 职责维度 | 具体工作 | 常见误区 |\n|---------|---------|--------|\n| 需求管理 | 收集、分析、筛选用户需求 | 用户说什么就做什么 |\n| 产品规划 | 制定产品路线图和版本计划 | 缺乏长期视野 |\n| 方案设计 | 输出原型和PRD文档 | 过度追求精美原型 |\n| 数据分析 | 监控上线效果 | 只关注虚荣指标 |\n\n> **案例**：销售反馈"客户要求增加Excel导出功能"。产品经理追问后发现80%客户是为了把数据导入另一个系统 — 最终解决方案是API对接。\n\n### 产品经理的能力模型\n\n```\n【底层】逻辑思维 + 学习能力 + 沟通表达\n    ↓\n【中层】用户研究 + 数据分析 + 原型设计\n    ↓\n【顶层】商业洞察 + 行业理解 + 战略思维\n```',
quiz:{question:'销售部门反馈"很多客户要求增加Excel导出功能"，以下哪种处理方式最体现产品经理的核心价值？',options:[{label:'A',text:'立即将需求加入开发排期'},{label:'B',text:'统计要导出的客户数量，超过50%才做'},{label:'C',text:'深入了解客户导出后的使用场景，判断是否有更优方案'},{label:'D',text:'建议客户使用截图功能'}],correctIndex:2,explanation:'产品经理的核心价值不是被动执行需求，而是透过需求表象找到问题本质。'}},
{id:2,title:'需求分析与用户画像',phase:'探索期',phaseIndex:0,concepts:['Y模型','用户画像','KANO模型','需求收集','优先级'],
content:'## 从"我觉得"到"用户觉得"\n\n### 需求的三个层次：Y模型\n\n| 层次 | 例子："更快的马" | 产品经理的思考 |\n|-----|------------------|--------------|\n| 用户说的 | "我需要一匹更快的马" | 不可直接采纳 |\n| 产品功能 | 设计一辆汽车 | 用更好方案满足同一目标 |\n| 目标动机 | "想更快到达目的地" | 问题的本质 |\n\n> **经典案例**：福特没有给用户更快的马，而是给了他们汽车。\n\n### 用户画像\n\n```\n【用户画像：小王】\n- 28岁，二线城市，电商运营，月薪8K\n- 核心痛点：Excel操作慢、容易出错\n- 目标：10分钟内搞定日报\n```\n\n### KANO模型\n\n| 需求类型 | 用户反应 | 处理策略 |\n|---------|---------|--------|\n| 基本型 | 没有会极度不满 | 必须做 |\n| 期望型 | 有则满意，没有则不满 | 按性价比投入 |\n| 兴奋型 | 有则惊喜 | 差异化亮点 |',
quiz:{question:'用户反馈说"你们App的搜索功能太难用了"。按照Y模型分析，本质目标是？',options:[{label:'A',text:'想要更复杂的筛选条件'},{label:'B',text:'增加多层筛选功能'},{label:'C',text:'想更快更准地找到想要的内容'},{label:'D',text:'引入Elasticsearch'}],correctIndex:2,explanation:'Y模型中"更快更准找到内容"是本质目标。"复杂筛选"只是用户提出的解决方案，未必最优。'}},
{id:3,title:'原型设计与PRD撰写',phase:'建构期',phaseIndex:1,concepts:['原型 fidelity','PRD','用例描述','需求评审','流程图'],
content:'## 把想法变成可执行的方案\n\n### 原型的三个 fidelity 层级\n\n| 层级 | 形式 | 适用阶段 |\n|-----|------|--------|\n| 低保真 | 手绘草图 | 头脑风暴 |\n| 中保真 | 可点击原型 | 团队评审 |\n| 高保真 | 接近真实产品 | 最终确认 |\n\n### PRD核心模块\n\n| 模块 | 内容要点 | 常见错误 |\n|-----|---------|--------|\n| 背景与目标 | 为什么要做 | 只写功能列表 |\n| 需求范围 | 本期做哪些 | 范围模糊 |\n| 功能详述 | 逻辑、规则、校验 | 只画原型不写文字 |\n| 数据埋点 | 监控哪些指标 | 上线后才发现没埋点 |\n| 验收标准 | 什么算做完了 | 没有明确标准 |\n\n> **核心建议**：PRD写完后，先给一位开发同事看。如果他问了超过3个"什么意思"的问题，说明文档还需要改进。',
quiz:{question:'以下关于PRD的说法，哪一项是正确的？',options:[{label:'A',text:'PRD主要是写给老板看的'},{label:'B',text:'PRD只需要功能列表和原型图'},{label:'C',text:'PRD核心读者是设计师、开发和测试，需清晰描述逻辑和边界情况'},{label:'D',text:'PRD一旦评审通过就不应该再修改'}],correctIndex:2,explanation:'PRD是产品落地的执行手册，核心读者是执行团队。'}},
{id:4,title:'数据驱动的产品决策',phase:'建构期',phaseIndex:1,concepts:['指标体系','漏斗分析','A/B测试','北极星指标','虚荣指标'],
content:'## 告别拍脑袋，拥抱数据\n\n### 漏斗分析：定位流失环节\n\n| 步骤 | 用户数 | 转化率 |\n|-----|--------|--------|\n| 浏览商品详情 | 30,000 | 30% |\n| 加入购物车 | 8,000 | 26.7% |\n| 提交订单 | 3,000 | 37.5% |\n| 完成支付 | 2,000 | 66.7% |\n\n> **洞察**：从"浏览详情"到"加购"的流失最严重（26.7%），优先优化详情页。\n\n### A/B测试\n\n```\n场景：团队争论按钮用红色还是绿色\nA/B测试：50%用户看到红色，50%看到绿色\n运行1周，对比点击率\n```\n\n### 虚荣指标 vs 可行动指标\n\n| 虚荣指标 | 可行动指标 |\n|---------|----------|\n| 总下载量 | 次日留存率 |\n| 页面访问量 | 关键流程转化率 |',
quiz:{question:'通过漏斗分析发现：浏览详情3000人，加购800人，提交订单300人，完成支付200人。哪个环节优化优先级最高？',options:[{label:'A',text:'支付环节，人数最少'},{label:'B',text:'首页到详情页，流失最多'},{label:'C',text:'详情页到加购，转化率最低26.7%'},{label:'D',text:'所有环节同时优化'}],correctIndex:2,explanation:'详情页到加购的转化率最低，优化这一环节投资回报率通常最高。'}},
{id:5,title:'项目管理与跨团队协作',phase:'精通期',phaseIndex:2,concepts:['需求评审','跨团队协作','风险管理','敏捷开发','沟通策略'],
content:'## 没有实权，如何推动一群人做事？\n\n### 需求评审：产品经理的"渡劫"\n\n| 常见问题 | 应对策略 |\n|---------|--------|\n| "技术上做不了" | 追问具体卡点，探讨替代方案 |\n| "工期太紧" | 拆解MVP版本 |\n| "用户真的需要吗？" | 拿出调研数据 |\n| "功能太复杂" | 画出流程图，一起拆解 |\n\n### 跨团队协作四秘诀\n\n1. **建立共同目标**：让每个人看到自己的工作如何贡献大局\n2. **信息透明化**：使用项目管理工具、即时通讯、文档空间\n3. **管理预期**：坏消息尽早说，承诺要保守\n4. **解决冲突**：回到用户目标和业务价值上做判断\n\n### 风险管理\n\n| 风险类型 | 应对策略 |\n|---------|--------|\n| 技术风险 | 准备降级方案 |\n| 需求风险 | 预留20%缓冲时间 |\n| 人员风险 | 知识文档化 |\n\n> **黄金法则**：评审前提前和核心开发一对一沟通。',
quiz:{question:'需求评审会上开发说"这个需求技术上做不了"，产品经理最好的应对是？',options:[{label:'A',text:'让老板出面施压'},{label:'B',text:'追问具体卡点，共同探讨替代方案'},{label:'C',text:'直接砍掉这个需求'},{label:'D',text:'延期到下个版本再讨论'}],correctIndex:1,explanation:'追问具体卡点能找到真正的障碍，有时"做不了"只是成本太高或时间不够，通过拆解需求或寻找替代方案往往能达成共识。'}}

// ==================== ACTION HANDLERS ====================
function doLogin(){S.userProfile={position:'产品经理',industry:'互联网',education:'本科',workYears:'3-5年',goal:'晋升管理'};S.courses=JSON.parse(JSON.stringify(defaultCourses));S.categories=[{id:'cat1',name:'技术技能'},{id:'cat2',name:'软技能'}];initCompleted();S.step='dashboard';render();}
function initCompleted(){S.completedChapters=new Set();S.courses.forEach(function(c){for(var i=0;i<c.completedChapters;i++)S.completedChapters.add(c.id+'-'+i);});}
function doRegNext(){if(S.regStep===1){if(!validEmail(S.regEmail)){S.regEmailError='请输入有效的邮箱地址';render();return;}S.regEmailError='';S.regDirection='forward';S.regStep=2;render();}else{if(!S.regEducation||!S.regIndustry||!S.regPosition||!S.regWorkYears||!S.regGoal)return;S.userProfile={position:S.regPosition,industry:S.regIndustry,education:S.regEducation,workYears:S.regWorkYears,goal:S.regGoal};S.courses=JSON.parse(JSON.stringify(defaultCourses));S.categories=[{id:'cat1',name:'技术技能'},{id:'cat2',name:'软技能'}];initCompleted();S.step='dashboard';render();}}
function doStartLearning(id){S.currentCourseId=id;var c=S.courses.find(function(x){return x.id===id;})||defaultCourses.find(function(x){return x.id===id;});var ch=getChapters(id);if(c&&c.completedChapters>0&&c.completedChapters<ch.length){S.currentChapter=c.completedChapters;}else{S.currentChapter=0;}S.selectedAnswer=null;S.showResult=false;S.conceptsOpen=false;S.wrongQuestions=[];S.step='attention-check';render();}
function doOpenErrorBook(id){var titles={'python-intro':'Python编程入门','excel-analysis':'Excel数据分析实战','product-thinking':'产品思维方法论'};S.ebDetailCourseId=id;S.ebDetailTitle=titles[id]||id;S.step='error-book-detail';render();}
function doOpenErrorBookFromLearning(){doOpenErrorBook(S.currentCourseId);}
function doCreateCat(){var n=S.newCategoryName.trim();if(!n)return;S.categories.push({id:'cat_'+Date.now(),name:n});S.showNewCategoryInput=false;S.newCategoryName='';render();}
function doRenameCat(){var n=S.editingCategoryName.trim();if(!n){S.editingCategoryId=null;render();return;}var c=S.categories.find(function(x){return x.id===S.editingCategoryId;});if(c)c.name=n;S.editingCategoryId=null;render();}
function doAssignCourse(cid,catid){var c=S.courses.find(function(x){return x.id===cid;});if(c){if(!c.categories)c.categories=[];if(!c.categories.includes(catid))c.categories.push(catid);else c.categories=c.categories.filter(function(x){return x!==catid;});}S.courseMenuOpenId=null;render();}
function doGoHome(){if(S.learningTimer){clearInterval(S.learningTimer);S.learningTimer=null;}S.step='dashboard';render();}
function doChapterSelect(idx){S.currentChapter=idx;S.selectedAnswer=null;S.showResult=false;S.conceptsOpen=false;render();}
function doAnswerSelect(idx){if(S.showResult)return;S.selectedAnswer=idx;S.showResult=true;var ch=getChapters(S.currentCourseId)[S.currentChapter];if(ch.quiz&&idx!==ch.quiz.correctIndex){S.wrongQuestions.push({courseId:S.currentCourseId,chapterId:ch.id,question:ch.quiz.question,options:ch.quiz.options,correctIndex:ch.quiz.correctIndex,explanation:ch.quiz.explanation});}render();}
function doNextChapter(){var chs=getChapters(S.currentCourseId);var c=S.courses.find(function(x){return x.id===S.currentCourseId;});if(c)c.completedChapters=Math.max(c.completedChapters,S.currentChapter+1);S.completedChapters.add(S.currentCourseId+'-'+S.currentChapter);if(S.currentChapter<chs.length-1){S.currentChapter++;S.selectedAnswer=null;S.showResult=false;S.conceptsOpen=false;render();}else{if(c)c.completedChapters=chs.length;S.completedChapters.add(S.currentCourseId+'-'+(chs.length-1));render();}}
function toggleStory(id){if(S.ebExpandedStories.has(id)){S.ebExpandedStories.delete(id);}else{S.ebExpandedStories.clear();S.ebExpandedStories.add(id);}render();}
function startLearningTimer(){S.learningStartTime=Date.now();S.elapsedSeconds=0;if(S.learningTimer)clearInterval(S.learningTimer);S.learningTimer=setInterval(function(){S.elapsedSeconds=Math.floor((Date.now()-S.learningStartTime)/1000);var el=document.getElementById('learning-timer');if(el)el.textContent=ft(S.elapsedSeconds);},1000);}
function startStroop(){S.acPhase='stroop';S.acStroopCount=0;S.acStroopCorrect=0;S.acStroopTotal=5;nextStroopQ();}
function nextStroopQ(){if(S.acStroopCount>=S.acStroopTotal){finishStroop();return;}var colors=shuf([...COLOR_NAMES]);S.acStroopQuestion={text:colors[0],color:COLOR_MAP2[colors[1]],answer:colors[1]};S.acStroopCount++;if(S.acStroopTimer)clearTimeout(S.acStroopTimer);S.acStroopTimer=setTimeout(function(){S.acStroopQuestion=null;S.acStroopTotal=5;render();},3000);render();}
function doStroopAnswer(color){if(S.acStroopTimer)clearTimeout(S.acStroopTimer);if(color===S.acStroopQuestion.answer)S.acStroopCorrect++;S.acStroopQuestion=null;setTimeout(nextStroopQ,300);}
function finishStroop(){S.acPhase='transition';S.acTransitionTarget='memory';render();setTimeout(startMemory,1500);}
function startMemory(){S.acPhase='memory';S.acMemoryRound=0;S.acMemoryCorrectRounds=0;nextMemRound();}
function nextMemRound(){if(S.acMemoryRound>=2){finishMemory();return;}var words=pick(MEMORY_POOL,3);var distractors=pick(MEMORY_POOL.filter(function(w){return words.indexOf(w)<0;}),3);S.acMemoryWords=words;S.acMemoryOptions=shuf([...words,...distractors]);S.acMemorySelected=[];S.acPhase='memory-show';render();setTimeout(function(){S.acPhase='memory-select';render();},3000);}
function doMemorySelect(word){var idx=S.acMemorySelected.indexOf(word);if(idx>=0)S.acMemorySelected.splice(idx,1);else S.acMemorySelected.push(word);if(S.acMemorySelected.length===3){var correct=S.acMemoryWords.every(function(w){return S.acMemorySelected.indexOf(w)>=0;});if(correct)S.acMemoryCorrectRounds++;S.acMemoryRound++;setTimeout(nextMemRound,800);}}
function finishMemory(){S.acPhase='transition';S.acTransitionTarget='reaction';render();setTimeout(startReaction,1500);}
function startReaction(){S.acPhase='reaction';S.acReactionRound=0;S.acReactionTimes=[];nextReactRound();}
function nextReactRound(){if(S.acReactionRound>=3){finishReaction();return;}S.acPhase='reaction-wait';S.acReactionClickedEarly=false;var delay=1000+Math.random()*2000;S.acReactionGreenTime=Date.now()+delay;S.acReactionTimer=setTimeout(function(){S.acPhase='reaction-go';render();},delay);render();}
function doReactionClick(){if(S.acPhase==='reaction-wait'){S.acReactionClickedEarly=true;if(S.acReactionTimer)clearTimeout(S.acReactionTimer);S.acReactionRound++;render();setTimeout(nextReactRound,1500);return;}if(S.acPhase==='reaction-go'){var rt=Date.now()-S.acReactionGreenTime;S.acReactionTimes.push(rt);S.acReactionRound++;render();setTimeout(nextReactRound,1500);}}
function finishReaction(){var ss=S.acStroopCorrect*20;var ms2=S.acMemoryCorrectRounds*50;var avgRt=S.acReactionTimes.length>0?S.acReactionTimes.reduce(function(a,b){return a+b;},0)/S.acReactionTimes.length:999;var rs=rts(avgRt);var ov=Math.round((ss+ms2+rs)/3);S.attentionResult={stroopCorrect:S.acStroopCorrect,stroopTotal:5,stroopScore:ss,memoryCorrect:S.acMemoryCorrectRounds,memoryTotal:2,memoryScore:ms2,reactionTimes:S.acReactionTimes,avgReactionTime:Math.round(avgRt),reactionScore:rs,overallScore:ov};S.acPhase='result';render();}
function doGenerateCourse(){S.gcIsGenerating=true;render();setTimeout(function(){var newId='course-'+Date.now();S.courses.unshift({id:newId,title:'新课程：'+(S.gcSelectedFile||'上传文档'),fileName:S.gcSelectedFile||'document.pdf',industry:S.userProfile?S.userProfile.industry:'互联网',phase:'探索期',totalChapters:5,completedChapters:0,totalStudyTime:0,wrongCount:0,lastStudyDate:new Date().toISOString().slice(0,10),learningGoal:S.gcSelectedGoal||'独立完成日常工作'});S.gcIsGenerating=false;S.gcSelectedFile=null;S.gcSelectedGoal=null;S.gcStep2Expanded=false;S.gcStep3Expanded=false;S.gcSelfRating=5;S.gcWorkScene='';S.step='dashboard';render();},2000);}
function doResetGC(){S.gcSelectedFile=null;S.gcIsParsing=false;S.gcDragOver=false;S.gcSelectedGoal=null;S.gcStep2Expanded=false;S.gcStep3Expanded=false;S.gcSelfRating=5;S.gcWorkScene='';S.gcIsGenerating=false;}
function render(){var app=document.getElementById('app');switch(S.step){case'registration':app.innerHTML=renderRegistration();break;case'dashboard':app.innerHTML=renderDashboard();break;case'generate-course':app.innerHTML=renderGenerateCourse();break;case'attention-check':app.innerHTML=renderAttentionCheck();break;case'learning':app.innerHTML=renderLearning();break;case'error-book-dashboard':app.innerHTML=renderErrorBookDashboard();break;case'error-book-detail':app.innerHTML=renderCourseErrorBook();break;}}
document.addEventListener('click',function(e){var t=e.target.closest('[data-action]');if(t)handleAction(t.dataset.action,t.dataset,e);});
document.addEventListener('mousedown',function(e){if(S.courseMenuOpenId&&!e.target.closest('[data-course-menu]')){S.courseMenuOpenId=null;render();}if(S.categoryMenuOpenId&&!e.target.closest('[data-cat-menu]')){S.categoryMenuOpenId=null;render();}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){S.showNewCategoryInput=false;S.editingCategoryId=null;S.courseMenuOpenId=null;S.categoryMenuOpenId=null;render();}});
function handleAction(a,d,e){
if(a==='toggle-theme'){S.isDark=!S.isDark;document.documentElement.setAttribute('data-theme',S.isDark?'dark':'light');render();}
else if(a==='reg-login')doLogin();
else if(a==='reg-next')doRegNext();
else if(a==='reg-back'){S.regDirection='back';S.regStep=Math.max(1,S.regStep-1);render();}
else if(a==='reg-option'){var f=d.field;var key='reg'+f.charAt(0).toUpperCase()+f.slice(1);S[key]=d.value;var btns=document.querySelectorAll('[data-field="'+f+'"]');btns.forEach(function(btn){var isSel=btn.getAttribute('data-value')===d.value;btn.style.background=isSel?'var(--accent-blue)':'var(--bg-input)';btn.style.color=isSel?'#fff':'var(--text-secondary)';btn.style.borderColor=isSel?'var(--accent-blue)':'var(--border-main)';});var canFinish=S.regEducation&&S.regIndustry&&S.regPosition&&S.regWorkYears&&S.regGoal;var finishBtn=document.querySelector('button[data-action="reg-next"]');if(finishBtn){finishBtn.disabled=!canFinish;finishBtn.style.opacity=canFinish?'1':'0.5';finishBtn.style.cursor=canFinish?'pointer':'not-allowed';}}
else if(a==='gen-course'){S.step='generate-course';doResetGC();render();}
else if(a==='start-learning')doStartLearning(d.id);
else if(a==='open-error-book')doOpenErrorBook(d.id);
else if(a==='open-error-book-dashboard'){S.step='error-book-dashboard';render();}
else if(a==='set-filter'){S.activeFilter=d.value;S.courseMenuOpenId=null;render();}
else if(a==='set-cat-filter'){S.activeCategoryFilter=S.activeCategoryFilter===d.id?'all':d.id;S.categoryMenuOpenId=null;render();}
else if(a==='new-cat'){S.showNewCategoryInput=true;S.newCategoryName='';render();setTimeout(function(){var i=document.querySelector('.new-cat-input');if(i)i.focus();},50);}
else if(a==='create-cat')doCreateCat();
else if(a==='cancel-cat'){S.showNewCategoryInput=false;render();}
else if(a==='cat-menu'){e.stopPropagation();S.categoryMenuOpenId=S.categoryMenuOpenId===d.id?null:d.id;S.courseMenuOpenId=null;render();}
else if(a==='cat-rename'){e.stopPropagation();S.editingCategoryId=d.id;S.editingCategoryName=d.name;S.categoryMenuOpenId=null;render();setTimeout(function(){var i=document.querySelector('.edit-cat-input');if(i){i.focus();i.select();}},50);}
else if(a==='cat-delete'){e.stopPropagation();S.categories=S.categories.filter(function(c){return c.id!==d.id;});if(S.activeCategoryFilter===d.id)S.activeCategoryFilter='all';S.categoryMenuOpenId=null;render();}
else if(a==='cat-rename-save')doRenameCat();
else if(a==='cat-rename-cancel'){S.editingCategoryId=null;render();}
else if(a==='course-menu'){e.stopPropagation();S.courseMenuOpenId=S.courseMenuOpenId===d.id?null:d.id;S.categoryMenuOpenId=null;render();}
else if(a==='assign-course')doAssignCourse(d.courseId,d.catId);
else if(a==='gc-back'){S.step='dashboard';render();}
else if(a==='gc-goal'){S.gcSelectedGoal=d.value;setTimeout(function(){S.gcStep3Expanded=true;render();},300);}
else if(a==='gc-generate')doGenerateCourse();
else if(a==='gc-upload'){var inp=document.createElement('input');inp.type='file';inp.accept='.pdf,.docx,.txt,.md';inp.onchange=function(ev){if(ev.target.files.length>0){S.gcSelectedFile=ev.target.files[0].name;S.gcIsParsing=true;render();setTimeout(function(){S.gcIsParsing=false;S.gcStep2Expanded=true;render();},1500);}};inp.click();}
else if(a==='ac-skip'){S.step='learning';S.attentionResult=null;startLearningTimer();render();}
else if(a==='ac-start')startStroop();
else if(a==='stroop-answer')doStroopAnswer(d.color);
else if(a==='mem-select')doMemorySelect(d.word);
else if(a==='reaction-click')doReactionClick();
else if(a==='ac-complete'){S.step='learning';startLearningTimer();render();}
else if(a==='learn-home')doGoHome();
else if(a==='learn-chapter')doChapterSelect(parseInt(d.idx));
else if(a==='learn-concepts'){S.conceptsOpen=!S.conceptsOpen;render();}
else if(a==='learn-answer')doAnswerSelect(parseInt(d.idx));
else if(a==='learn-retry'){S.selectedAnswer=null;S.showResult=false;render();}
else if(a==='learn-next')doNextChapter();
else if(a==='learn-errbook')doOpenErrorBookFromLearning();
else if(a==='toggle-sidebar'){S.sidebarOpen=!S.sidebarOpen;render();}
else if(a==='eb-back'){S.step='dashboard';render();}
else if(a==='eb-story')toggleStory(d.id);
else if(a==='eb-course-stop'){e.stopPropagation();S.ebDetailCourseId=d.id;S.ebDetailTitle=d.title;S.step='error-book-detail';render();}
else if(a==='eb-course'){S.ebDetailCourseId=d.id;S.ebDetailTitle=d.title;S.step='error-book-detail';render();}
else if(a==='ceb-back'){S.step='error-book-dashboard';render();}
else if(a==='ceb-tab'){S.ebActiveTab=d.value;S.ebSelectedCardId=null;S.ebSelectedOption=null;S.ebShowAnswer=false;render();}
else if(a==='ceb-card'){S.ebSelectedCardId=parseInt(d.id);S.ebSelectedOption=null;S.ebShowAnswer=false;render();}
else if(a==='ceb-option'){if(!S.ebShowAnswer){S.ebSelectedOption=parseInt(d.idx);S.ebShowAnswer=true;render();}}
else if(a==='ceb-retry'){S.ebSelectedOption=null;S.ebShowAnswer=false;render();}
else if(a==='ceb-status'){S.ebCardStatuses[d.cardId]=d.status;render();}
}
function setupDragDrop(el){if(!el)return;el.addEventListener('dragover',function(e){e.preventDefault();S.gcDragOver=true;render();});el.addEventListener('dragleave',function(e){e.preventDefault();S.gcDragOver=false;render();});el.addEventListener('drop',function(e){e.preventDefault();S.gcDragOver=false;var files=e.dataTransfer.files;if(files.length>0){var f=files[0];if(/\.(pdf|docx|txt|md)$/i.test(f.name)){S.gcSelectedFile=f.name;S.gcIsParsing=true;render();setTimeout(function(){S.gcIsParsing=false;S.gcStep2Expanded=true;render();},1500);}else{S.gcSelectedFile=null;render();}}});}

function selField(label,opts,field){
  var h='<div style="margin-bottom:20px"><label style="font-size:14px;color:var(--text-secondary);display:block;margin-bottom:10px">'+label+'</label>';

      h+='<span style="font-size:14px;color:'+textColor+';white-space:pre-wrap">'+opt.text+'</span>';
      if(showFeedback&&correct)h+='<span style="margin-left:auto;color:var(--accent-green)">'+ic('CheckCircle',18)+'</span>';
      if(showFeedback&&selected&&!correct)h+='<span style="margin-left:auto;color:var(--accent-red)">'+ic('XCircle',18)+'</span>';

    });
    h+='</div>';
    if(S.showResult){
      var isCorrect=S.selectedAnswer===ch.quiz.correctIndex;
      if(!isCorrect){
        h+='<div style="padding:16px;border-radius:12px;background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.2);margin-bottom:16px">';

        h+='<p style="font-size:12px;color:var(--accent-red);margin-top:8px">'+ic('BookMarked',12)+' 已自动加入错题本</p>';
        h+='</div>';
        h+='<button class="btn btn-sm" data-action="learn-retry" style="margin-right:8px">'+ic('RotateCcw',14)+' 再试一次</button>';
        h+='<button class="btn btn-sm" data-action="learn-next">'+ic('ChevronRight',14)+' 下一章</button>';
      } else {
        h+='<div style="padding:16px;border-radius:12px;background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.2);margin-bottom:16px">';
        h+='<p style="font-size:14px;color:var(--accent-green);font-weight:600">回答正确！ '+ic('CheckCircle',14)+'</p>';
        h+='<p style="font-size:13px;color:var(--text-secondary);line-height:1.6">'+ch.quiz.explanation+'</p></div>';
        if(isLast){
          h+='<div style="text-align:center;padding:32px 0"><div style="font-size:48px;color:var(--accent-yellow);margin-bottom:16px">'+ic('Trophy',48)+'</div>';
          h+='<h3 style="font-size:24px;font-weight:700;color:var(--accent-yellow)">恭喜完成全部课程！</h3>';
          h+='<p style="color:var(--text-secondary);margin-top:8px">你已经完成了所有章节的学习</p>';
          h+='<button class="btn" style="margin-top:24px" data-action="learn-home">'+ic('Home',16)+' 返回首页</button></div>';
        } else {
          h+='<button class="btn btn-sm" data-action="learn-next">'+ic('ChevronRight',14)+' 下一章</button>';
        }
      }
    }
    h+='</div>';
  }
  h+='</div></div></div>';
  return h;
}

  h+='</div></div>';
  // Course cards - 3 column grid style matching original demo
  h+='<h3 style="font-size:18px;font-weight:700;margin-bottom:16px">课程错题本</h3>';

  defaultCourses.forEach(function(c){
    var mastered2=Math.floor(c.wrongCount*0.2);

    var ccolor=colorMap[c.id]||'var(--accent-blue)';

function renderCourseErrorBook(){
  var questions=getEbData(S.ebDetailCourseId);
  var variants=getVariantData(S.ebDetailCourseId);
  var scenarios=getScenarioData(S.ebDetailCourseId);
  var allQuestions=questions.concat(variants).concat(scenarios);
  var totalQ=allQuestions.length;
  var reviewed=0,pending=0,mastered=0;
  allQuestions.forEach(function(q){var st=S.ebCardStatuses[q.id]||q.status;if(st==='review')reviewed++;else if(st==='mastered')mastered++;else pending++;});
  var colorMap={'python-intro':'var(--accent-blue)','excel-analysis':'var(--accent-green)','product-thinking':'var(--accent-purple)'};
  var ccolor=colorMap[S.ebDetailCourseId]||'var(--accent-blue)';
  var h='<div class="page-enter"><div class="nav-bar"><div style="display:flex;align-items:center;gap:16px"><button data-action="ceb-back" class="btn btn-ghost btn-sm">'+ic('ArrowLeft',14)+' 返回错题本</button>';
  h+='<div style="display:flex;align-items:center;gap:8px">'+ic('BookMarked',20).replace('currentColor','var(--accent-red)')+'<span style="font-size:15px;font-weight:600">'+S.ebDetailTitle+'</span></div></div></div>';
  h+='<div style="padding-top:88px;padding-bottom:40px"><div class="container" style="max-width:1100px">';

  h+='<div class="card" style="padding:16px;text-align:center"><p style="font-size:12px;color:var(--text-muted)">总题数</p><p style="font-size:20px;font-weight:700;margin-top:4px">'+totalQ+'</p></div>';
  h+='<div class="card" style="padding:16px;text-align:center"><p style="font-size:12px;color:var(--accent-blue)">需要复习</p><p style="font-size:20px;font-weight:700;margin-top:4px;color:var(--accent-blue)">'+reviewed+'</p></div>';
  h+='<div class="card" style="padding:16px;text-align:center"><p style="font-size:12px;color:var(--accent-yellow)">待全部掌握</p><p style="font-size:20px;font-weight:700;margin-top:4px;color:var(--accent-yellow)">'+pending+'</p></div>';
  h+='<div class="card" style="padding:16px;text-align:center"><p style="font-size:12px;color:var(--accent-green)">已掌握</p><p style="font-size:20px;font-weight:700;margin-top:4px;color:var(--accent-green)">'+mastered+'</p></div>';
  h+='</div>';

  var tabs=[{v:'knowledge',icon:'Brain',label:'错误知识点',color:'var(--accent-red)'},{v:'variants',icon:'Shuffle',label:'变式测试题',color:'var(--accent-purple)'},{v:'scenarios',icon:'Briefcase',label:'职场场景题',color:'var(--accent-blue)'}];
  h+='<div style="display:flex;gap:8px;margin-bottom:24px">';
  tabs.forEach(function(t){var act=S.ebActiveTab===t.v;h+='<button data-action="ceb-tab" data-value="'+t.v+'" style="display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:10px;font-size:13px;border:1px solid '+(act?t.color:'var(--border-main)')+';background:'+(act?t.color+'15':'var(--bg-input)')+';color:'+(act?t.color:'var(--text-secondary)')+';cursor:pointer">'+ic(t.icon,16)+' '+t.label+'</button>';});
  h+='</div>';

  var tabQuestions=S.ebActiveTab==='knowledge'?questions:S.ebActiveTab==='variants'?variants:scenarios;
  h+='<div style="display:grid;grid-template-columns:1fr 1.5fr;gap:16px;align-items:start">';
  // Left: question list
  h+='<div style="display:flex;flex-direction:column;gap:8px">';
  tabQuestions.forEach(function(q){
    var st=S.ebCardStatuses[q.id]||q.status;
    var active=S.ebSelectedCardId===q.id;
    var statusIcon=st==='mastered'?ic('CheckCircle',14).replace('currentColor','var(--accent-green)'):st==='review'?ic('AlertTriangle',14).replace('currentColor','var(--accent-yellow)'):ic('XCircle',14).replace('currentColor','var(--text-muted)');
    h+='<button data-action="ceb-card" data-id="'+q.id+'" style="display:flex;align-items:flex-start;gap:8px;padding:12px;border-radius:12px;border:1px solid '+(active?'var(--accent-blue)':'var(--border-main)')+';background:'+(active?'rgba(56,189,248,0.05)':'var(--bg-surface)')+';cursor:pointer;text-align:left;width:100%">';
    h+='<span style="margin-top:2px;flex-shrink:0">'+statusIcon+'</span>';
    h+='<span style="font-size:13px;color:var(--text-primary);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">'+q.question.split('\n')[0]+'</span></button>';
  });
  h+='</div>';
  // Right: question detail
  if(S.ebSelectedCardId!==null){
    var q=tabQuestions.find(function(x){return x.id===S.ebSelectedCardId;});

      h+='<div class="card" style="position:sticky;top:88px">';
      if(q.scene) h+='<span style="display:inline-block;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:500;background:rgba(56,189,248,0.1);color:var(--accent-blue);margin-bottom:12px">'+ic('Briefcase',12)+' '+q.scene+'</span>';

        else if(show&&selected&&!correct){bg='rgba(248,113,113,0.1)';border='var(--accent-red)';tc='var(--accent-red)';}
        else if(selected){bg='rgba(56,189,248,0.1)';border='var(--accent-blue)';tc='var(--accent-blue)';}
        h+='<button data-action="ceb-option" data-idx="'+i+'" style="display:flex;align-items:center;gap:10px;padding:12px;border-radius:10px;border:1px solid '+border+';background:'+bg+';cursor:'+(show?'default':'pointer')+';text-align:left;width:100%">';
        h+='<span style="width:26px;height:26px;border-radius:50%;border:2px solid '+(show&&correct?'var(--accent-green)':show&&selected?'var(--accent-red)':'var(--border-main)')+';display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;color:'+(show&&correct?'var(--accent-green)':show&&selected?'var(--accent-red)':'var(--text-muted)')+'">'+opt.label+'</span>';
        h+='<span style="font-size:14px;color:'+tc+'">'+opt.text+'</span>';
        if(show&&correct)h+='<span style="margin-left:auto">'+ic('CheckCircle',16)+'</span>';
        if(show&&selected&&!correct)h+='<span style="margin-left:auto">'+ic('XCircle',16)+'</span>';
        h+='</button>';
      });
      h+='</div>';
      if(S.ebShowAnswer){
        h+='<div style="padding:12px;border-radius:10px;background:rgba(56,189,248,0.05);border:1px solid rgba(56,189,248,0.15);margin-bottom:16px"><p style="font-size:13px;color:var(--text-secondary);line-height:1.6">'+q.explanation+'</p></div>';
        h+='<button class="btn btn-sm" data-action="ceb-retry" style="margin-right:8px">'+ic('RotateCcw',14)+' 再试一次</button>';
      }
      // Status buttons
      var curSt=S.ebCardStatuses[q.id]||q.status;
      h+='<div style="display:flex;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border-main)">';
      [{s:'review',label:'需要复习',color:'var(--accent-blue)'},{s:'pending',label:'待全部掌握',color:'var(--accent-yellow)'},{s:'mastered',label:'已掌握',color:'var(--accent-green)'}].forEach(function(sb){
        var act=curSt===sb.s;
        h+='<button data-action="ceb-status" data-card-id="'+q.id+'" data-status="'+sb.s+'" style="flex:1;padding:8px;border-radius:8px;font-size:12px;border:1px solid '+(act?sb.color:'var(--border-main)')+';background:'+(act?sb.color+'15':'transparent')+';color:'+(act?sb.color:'var(--text-muted)')+';cursor:pointer">'+sb.label+'</button>';
      });
      h+='</div></div>';
    }
  } else {
    h+='<div class="card" style="text-align:center;padding:40px"><p style="color:var(--text-muted)">选择左侧的题目查看详情</p></div>';
  }
  h+='</div></div></div></div>';
  return h;
}
