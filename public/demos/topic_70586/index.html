<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>鸭力山大</title>
<style>
:root {
  --bg: #0d0805;
  --surface: #1a0f06;
  --surface2: #261a0e;
  --card: #2d1f12;
  --ink: #fbe9d0;
  --muted: #c4a880;
  --hint: #7a6440;
  --rule: #3d2c18;
  --divider: #2a1d10;
  --accent: #ff8c2b;
  --accent2: #4ade80;
  --gold: #fbbf24;
  --danger: #f87171;
  --ok: #86efac;
  --blue: #6cb6e8;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-xl: 24px;
  --shadow: 0 4px 16px rgba(0,0,0,0.4);
  --shadow-glow: 0 0 16px rgba(255,140,43,0.25);
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-tap-highlight-color: transparent; }
body {
  font-family: var(--font);
  color: var(--ink);
  background: #050200;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 0.5rem;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
.game-frame {
  background: var(--bg);
  border-radius: var(--r-xl);
  overflow: hidden;
  width: 100%;
  max-width: 390px;
  height: 92vh;
  max-height: 780px;
  box-shadow: 0 16px 48px rgba(0,0,0,0.7), 0 0 0 1px var(--rule);
  position: relative;
  display: flex;
  flex-direction: column;
}
.frame-inner { position: relative; overflow: hidden; flex: 1; display: flex; flex-direction: column; }

/* Status Bar */
.statusbar {
  background: var(--bg);
  padding: 5px 14px;
  font-size: 11px;
  display: flex;
  justify-content: space-between;
  color: var(--hint);
  flex-shrink: 0;
  z-index: 10;
}

/* Scene */
.scene {
  position: relative;
  flex: 1;
  overflow: hidden;
  background: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(255,140,43,0.08), transparent 70%), linear-gradient(180deg, var(--bg) 0%, var(--surface) 60%, var(--surface2) 100%);
  display: flex;
  flex-direction: column;
}

/* HUD */
.hud {
  position: absolute;
  top: 0; left: 0; right: 0;
  padding: 6px 10px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  z-index: 20;
  pointer-events: none;
}
.hud-left { display: flex; flex-direction: column; gap: 4px; }
.hud-right { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
.hud-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: rgba(26,15,6,0.88);
  border: 1px solid var(--rule);
  border-radius: 999px;
  padding: 3px 10px;
  font-size: 12px;
  font-weight: 600;
  backdrop-filter: blur(8px);
}
.hud-badge .v { color: var(--gold); font-weight: 700; }
.hud-badge .v.rep { color: var(--ok); }
.hud-badge .v.money { color: var(--accent); }
.hud-day {
  background: rgba(26,15,6,0.88);
  border: 1px solid var(--rule);
  border-radius: 999px;
  padding: 3px 12px;
  font-size: 12px;
  color: var(--blue);
  font-weight: 600;
  backdrop-filter: blur(8px);
}

/* Content */
.content {
  flex: 1;
  overflow-y: auto;
  padding: 80px 12px 140px;
  -webkit-overflow-scrolling: touch;
}
.content::-webkit-scrollbar { width: 0; }

/* Section Label */
.sec-lb {
  font-size: 11px;
  color: var(--hint);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-weight: 600;
  margin: 14px 0 8px;
  padding-left: 2px;
}

/* Cards */
.card {
  background: var(--card);
  border: 1px solid var(--rule);
  border-radius: var(--r-md);
  padding: 12px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
}
.card.hl { border-color: var(--accent); box-shadow: var(--shadow-glow); }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  background: var(--accent);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  padding: 10px 16px;
  border-radius: var(--r-md);
  border: none;
  cursor: pointer;
  transition: transform 0.12s, opacity 0.12s;
  user-select: none;
  font-family: var(--font);
}
.btn:active { transform: scale(0.96); opacity: 0.88; }
.btn.green { background: var(--accent2); }
.btn.gold { background: var(--gold); color: #1a0f06; }
.btn.danger { background: var(--danger); }
.btn.ghost { background: var(--card); color: var(--ink); border: 1px solid var(--rule); }
.btn.sm { font-size: 12px; padding: 6px 12px; border-radius: var(--r-sm); }
.btn.lg { font-size: 16px; padding: 14px 24px; }
.btn:disabled { opacity: 0.4; pointer-events: none; }

/* Action Bar */
.actionbar {
  position: absolute;
  bottom: 52px;
  left: 0; right: 0;
  display: flex;
  gap: 8px;
  padding: 6px 10px;
  background: linear-gradient(180deg, transparent, rgba(13,8,5,0.9) 40%);
  z-index: 25;
}
.actionbar .btn { flex: 1; }

/* Nav */
.nav {
  display: flex;
  background: var(--surface);
  border-top: 1px solid var(--divider);
  height: 52px;
  flex-shrink: 0;
  position: relative;
  z-index: 30;
}
.nav-item {
  flex: 1;
  text-align: center;
  padding: 5px 0 3px;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  cursor: pointer;
}
.nav-item .ic { font-size: 18px; opacity: 0.4; transition: opacity 0.2s; }
.nav-item .lb { font-size: 10px; color: var(--hint); transition: color 0.2s; }
.nav-item.active .ic { opacity: 1; }
.nav-item.active .lb { color: var(--accent); font-weight: 700; }
.nav-item.active::before {
  content: "";
  position: absolute;
  top: 0; left: 25%; right: 25%;
  height: 3px;
  background: var(--accent);
  border-radius: 0 0 3px 3px;
}

/* Food Icon */
.food-icon {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
  border: 2px solid rgba(255,255,255,0.08);
  transition: transform 0.15s, box-shadow 0.15s;
  cursor: pointer;
}
.food-icon:active { transform: scale(0.92); }
.food-icon.duck { background: radial-gradient(circle at 35% 30%, #f4c430, #b8860b); }      /* 烤鸭金黄 */
.food-icon.goose { background: radial-gradient(circle at 35% 30%, #c0392b, #6e1a14); }     /* 烧鹅暗红 */
.food-icon.chicken { background: radial-gradient(circle at 35% 30%, #f5deb3, #c4a96a); }   /* 白斩鸡米黄 */
.food-icon.turkey { background: radial-gradient(circle at 35% 30%, #8b6f47, #4e3a20); }    /* 火鸡深棕 */
.food-icon.ostrich { background: radial-gradient(circle at 35% 30%, #8e4585, #4a2440); }   /* 鸵鸟紫红 */
.food-icon.mystery { background: radial-gradient(circle at 35% 30%, #6b6b6b, #2a2a2a); }
.food-icon.correct-flash { box-shadow: 0 0 24px var(--ok); border-color: var(--ok); }
.food-icon.wrong-flash { box-shadow: 0 0 24px var(--danger); border-color: var(--danger); }
.scene.hard .food-icon { filter: saturate(0.5) brightness(0.92); }

/* Food Tile (market) */
.food-tile { text-align: center; cursor: pointer; }
.food-tile .food-icon { margin: 0 auto 6px; }
.food-tile .fn { font-size: 12px; font-weight: 600; }
.food-tile .fp { font-size: 11px; color: var(--gold); font-weight: 600; }
.food-tile .stock { font-size: 10px; color: var(--hint); }
.food-tile.selected .food-icon { border-color: var(--accent); box-shadow: var(--shadow-glow); }

/* Shelf */
.shelf {
  background: var(--card);
  border: 1px solid var(--rule);
  border-radius: var(--r-md);
  padding: 10px;
  margin-bottom: 10px;
}
.shelf-row { display: flex; gap: 8px; justify-content: space-around; }

/* Timer */
.timer-wrap {
  position: absolute;
  top: 130px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
}
.timer-ring {
  width: 100px;
  height: 100px;
  position: relative;
}
.timer-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.timer-text {
  position: absolute; inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 34px;
  font-weight: 800;
  color: var(--gold);
  text-shadow: 0 0 16px rgba(251,191,36,0.4);
}

/* Combo */
.combo-display {
  position: absolute;
  top: 44px;
  right: 10px;
  text-align: right;
  z-index: 20;
}
.combo-display .cv {
  font-size: 26px;
  font-weight: 800;
  color: var(--accent);
  text-shadow: 0 0 14px rgba(255,140,43,0.4);
  line-height: 1;
}
.combo-display .cl {
  font-size: 10px;
  color: var(--gold);
  font-weight: 700;
  letter-spacing: 0.08em;
}

/* Customer */
.customer {
  position: absolute;
  top: 250px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  z-index: 15;
  animation: customerIn 0.3s ease-out;
}
@keyframes customerIn {
  from { opacity: 0; transform: translateX(-50%) translateY(20px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
.customer .face { font-size: 36px; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5)); }
.customer .bubble {
  background: var(--card);
  border: 1px solid var(--rule);
  border-radius: var(--r-sm);
  padding: 4px 10px;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  white-space: nowrap;
  position: relative;
  margin-bottom: 4px;
  box-shadow: var(--shadow);
}
.customer .bubble::after {
  content: "";
  position: absolute;
  bottom: -5px; left: 50%;
  transform: translateX(-50%);
  border: 4px solid transparent;
  border-top-color: var(--card);
}

/* Identify choices */
.choices {
  position: absolute;
  bottom: 115px;
  left: 0; right: 0;
  display: flex;
  justify-content: center;
  gap: 20px;
  z-index: 15;
}

/* Stall counter */
.stall-counter {
  position: absolute;
  top: 44px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--card);
  border: 1px solid var(--rule);
  border-radius: var(--r-md);
  padding: 6px 16px;
  box-shadow: var(--shadow);
  z-index: 10;
  white-space: nowrap;
}
.stall-counter .sn { font-size: 13px; font-weight: 700; color: var(--accent); }

/* Dialog (Event) */
.dialog {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: var(--card);
  border-top: 2px solid var(--accent);
  padding: 16px;
  padding-top: 20px;
  z-index: 30;
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  box-shadow: 0 -4px 24px rgba(0,0,0,0.5);
  animation: dialogIn 0.25s ease-out;
}
@keyframes dialogIn { from { transform: translateY(100%); } to { transform: translateY(0); } }
.dialog .portrait {
  position: absolute;
  top: -24px; left: 16px;
  width: 44px; height: 44px;
  background: var(--surface);
  border: 2px solid var(--accent);
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  box-shadow: var(--shadow-glow);
}
.dialog .dname {
  color: var(--accent);
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 6px;
  margin-left: 56px;
}
.dialog .dtext {
  color: var(--ink);
  font-size: 13px;
  line-height: 1.6;
  margin-left: 56px;
  margin-bottom: 12px;
}
.dialog .dchoices { display: flex; flex-direction: column; gap: 8px; }

/* Stats */
.stats { display: flex; gap: 8px; }
.stats .stat {
  flex: 1;
  background: var(--card);
  border: 1px solid var(--rule);
  border-radius: var(--r-md);
  padding: 10px 8px;
  text-align: center;
}
.stats .sv { font-size: 18px; font-weight: 700; color: var(--gold); }
.stats .sv.green { color: var(--ok); }
.stats .sv.red { color: var(--danger); }
.stats .sv.blue { color: var(--blue); }
.stats .sl { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* Progress */
.progress {
  height: 6px;
  background: var(--divider);
  border-radius: 3px;
  overflow: hidden;
}
.progress span {
  display: block;
  height: 100%;
  border-radius: 3px;
  transition: width 0.3s;
}

/* Tabs */
.tabs { display: flex; gap: 6px; margin-bottom: 12px; }
.tab {
  flex: 1;
  text-align: center;
  padding: 8px;
  border-radius: var(--r-sm);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}
.tab.active { background: var(--accent); color: #fff; }
.tab:not(.active) { background: var(--card); color: var(--muted); border: 1px solid var(--rule); }

/* Achievement */
.ach-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ach {
  aspect-ratio: 1;
  border-radius: var(--r-md);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  gap: 2px;
  padding: 4px;
}
.ach .al {
  font-size: 8px;
  color: var(--muted);
  font-weight: 600;
  text-align: center;
  line-height: 1.1;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.ach.unlocked {
  background: linear-gradient(145deg, var(--surface2), var(--card));
  border: 1px solid var(--accent);
  box-shadow: var(--shadow-glow);
}
.ach.locked {
  background: var(--surface);
  border: 1px solid var(--divider);
  opacity: 0.3;
  filter: grayscale(1);
}

/* Title Screen */
.title-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1;
  text-align: center;
  padding: 2rem;
}
.title-screen .game-title {
  font-size: 3rem;
  font-weight: 900;
  color: var(--accent);
  text-shadow: 0 4px 24px rgba(255,140,43,0.4);
  letter-spacing: 0.05em;
  margin-bottom: 0.5rem;
  animation: titleGlow 2s ease-in-out infinite alternate;
}
@keyframes titleGlow {
  from { text-shadow: 0 4px 20px rgba(255,140,43,0.3); }
  to { text-shadow: 0 4px 32px rgba(255,140,43,0.6); }
}
.title-screen .subtitle {
  color: var(--muted);
  font-size: 0.95rem;
  margin-bottom: 2rem;
  max-width: 16rem;
}
.title-screen .btn { width: 80%; margin-bottom: 0.75rem; }

/* Game Over */
.gameover {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1;
  text-align: center;
  padding: 2rem;
}
.gameover h2 { font-size: 1.8rem; color: var(--danger); margin-bottom: 1rem; }
.gameover p { color: var(--muted); margin-bottom: 0.5rem; }

/* Toast */
#toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(-100px);
  background: var(--card);
  border: 1px solid var(--accent);
  border-radius: var(--r-md);
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
  box-shadow: var(--shadow);
  z-index: 9999;
  transition: transform 0.3s;
  pointer-events: none;
}
#toast.show { transform: translateX(-50%) translateY(0); }
#toast.ok { border-color: var(--ok); color: var(--ok); }
#toast.err { border-color: var(--danger); color: var(--danger); }

/* Feedback flash */
.flash-overlay {
  position: absolute;
  inset: 0;
  z-index: 50;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
}
.flash-overlay.correct { background: radial-gradient(circle, rgba(74,222,128,0.3), transparent 70%); }
.flash-overlay.wrong { background: radial-gradient(circle, rgba(248,113,113,0.3), transparent 70%); }
.flash-overlay.show { opacity: 1; }

/* Lantern decorations */
.lantern {
  position: absolute;
  font-size: 28px;
  opacity: 0.3;
  animation: sway 3s ease-in-out infinite alternate;
}
@keyframes sway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }

/* Game Feel: Float Score */
.float-score { position: absolute; pointer-events: none; z-index: 9999; font-weight: 800; font-size: 22px; color: var(--gold); text-shadow: 0 2px 6px rgba(0,0,0,0.6); transform: translate(-50%,-50%) scale(1); animation: floatScore 1s ease-out forwards; }
.float-score.gold { color: var(--gold); }
.float-score.danger { color: var(--danger); }
.float-score.bonus { color: var(--accent2); }
@keyframes floatScore { 0% { opacity: 0; transform: translate(-50%,-50%) scale(0.7); } 15% { opacity: 1; transform: translate(-50%,-50%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, calc(-50% - 60px)) scale(1.3); } }

/* Game Feel: Shake */
.shake { animation: shake 0.4s ease-in-out; }
@keyframes shake { 0%,100% { transform: translate(0,0); } 15% { transform: translate(-7px,4px); } 30% { transform: translate(7px,-4px); } 45% { transform: translate(-6px,3px); } 60% { transform: translate(6px,-3px); } 75% { transform: translate(-3px,2px); } 90% { transform: translate(3px,-2px); } }

/* Game Feel: Combo Bar */
.combo-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.12); border-radius: 4px; overflow: hidden; margin-top: 4px; }
.combo-bar-fill { height: 100%; width: 0; transition: width 0.25s ease, background 0.25s ease; background: var(--muted); border-radius: 4px; }
.combo-bar[data-level="accent"] .combo-bar-fill { background: var(--accent2); }
.combo-bar[data-level="gold"] .combo-bar-fill { background: var(--gold); }
.combo-bar[data-level="danger"] .combo-bar-fill { background: var(--danger); }

/* Game Feel: Customer React */
.customer.reacting .face { animation: faceBounce 0.5s ease; }
@keyframes faceBounce { 0% { transform: scale(1); } 30% { transform: scale(1.45); } 60% { transform: scale(0.88); } 100% { transform: scale(1); } }
.customer.vip .face { box-shadow: 0 0 12px 3px rgba(251,191,36,0.85); border-radius: 50%; }
.customer.vip .bubble { border: 2px solid var(--gold); box-shadow: 0 0 8px rgba(251,191,36,0.55); color: var(--gold); }
.customer.scammer .face { filter: hue-rotate(20deg) saturate(1.3); }
.customer.scammer .bubble { border-style: dashed; border-color: var(--danger); }

/* Game Feel: Gamble Bar */
.gamble-bar { display: flex; gap: 8px; align-items: center; padding: 10px 12px; background: rgba(0,0,0,0.42); border-radius: var(--r-md); }
.gamble-bar .gb-info { flex: 1; font-size: 12px; }
.gamble-bar .gb-pot { color: var(--gold); font-weight: 700; font-size: 16px; }
.gamble-bar .gb-streak { color: var(--accent); font-weight: 600; }

/* Game Feel: Particles */
.particle { position: absolute; width: 6px; height: 6px; border-radius: 50%; pointer-events: none; background: var(--gold); box-shadow: 0 0 4px rgba(255,209,102,0.8); animation: particleBurst 0.6s ease-out forwards; z-index: 9999; }
@keyframes particleBurst { 0% { opacity: 1; transform: translate(0,0) scale(1); } 100% { opacity: 0; transform: translate(var(--dx,0), var(--dy,0)) scale(0.2); } }

/* Daily Mod Badge */
.mod-badge { display: inline-flex; align-items: center; gap: 4px; background: rgba(108,182,232,0.15); border: 1px solid rgba(108,182,232,0.4); border-radius: 999px; padding: 3px 10px; font-size: 11px; color: var(--blue); font-weight: 600; }
.mod-badge.rain { background: rgba(108,182,232,0.15); border-color: rgba(108,182,232,0.4); }
.mod-badge.festival { background: rgba(255,140,43,0.15); border-color: rgba(255,140,43,0.4); color: var(--accent); }
.mod-badge.inspection { background: rgba(248,113,113,0.15); border-color: rgba(248,113,113,0.4); color: var(--danger); }

/* Market Price Tag */
.price-tag { font-size: 11px; font-weight: 700; }
.price-tag.up { color: var(--danger); }
.price-tag.down { color: var(--ok); }
.price-tag.flash { color: var(--gold); animation: flashPulse 1s ease-in-out infinite alternate; }
@keyframes flashPulse { from { opacity: 0.6; } to { opacity: 1; } }

/* Helpers */
.row { display: flex; gap: 8px; }
.row > * { flex: 1; }
.center { display: flex; flex-direction: column; align-items: center; }
.tc { text-align: center; }
.mt8 { margin-top: 8px; }
.mt12 { margin-top: 12px; }
.mt16 { margin-top: 16px; }
.mb8 { margin-bottom: 8px; }
.muted { color: var(--muted); }
.bold { font-weight: 700; }
.accent { color: var(--accent); }
.gold { color: var(--gold); }
.green { color: var(--ok); }
.red { color: var(--danger); }

/* Result text */
.result-text {
  font-size: 14px;
  padding: 10px;

function generateDailyPrices() {
  dailyPrices = {};
  flashSaleItem = null;
  for (var key in FOODS) {
    if (!FOODS.hasOwnProperty(key)) continue;
    var base = FOODS[key].cost;
    var factor = 1 + (Math.random() * 0.6 - 0.3);
    dailyPrices[key] = { cost: Math.max(1, Math.round(base * factor)), flashSale: false };
  }
  var keys = Object.keys(dailyPrices);
  if (keys.length > 0 && Math.random() < 0.35) {
    flashSaleItem = keys[Math.floor(Math.random() * keys.length)];
    dailyPrices[flashSaleItem].flashSale = true;
    dailyPrices[flashSaleItem].cost = Math.max(1, Math.round(dailyPrices[flashSaleItem].cost * 0.5));
  }
}

function getDailyCost(key) {
  if (dailyPrices[key]) return dailyPrices[key].cost;
  return FOODS[key] ? FOODS[key].cost : 0;
}

function getMarketSummary() {
  var lines = [];
  var maxUp = null, maxDown = null;
  for (var key in dailyPrices) {
    if (!dailyPrices.hasOwnProperty(key)) continue;
    var base = FOODS[key].cost;
    var pct = Math.round((dailyPrices[key].cost / base - 1) * 100);
    if (pct > 0 && (!maxUp || pct > maxUp.pct)) maxUp = { name: FOODS[key].name, pct: pct };
    else if (pct < 0 && key !== flashSaleItem && (!maxDown || -pct > maxDown.pct)) maxDown = { name: FOODS[key].name, pct: -pct };
  }
  if (maxUp) lines.push(maxUp.name + '↑' + maxUp.pct + '%');
  if (maxDown) lines.push(maxDown.name + '↓' + maxDown.pct + '%');
  if (flashSaleItem) lines.push('闪购:' + FOODS[flashSaleItem].name + '半价!');
  if (lines.length === 0) lines.push('市场平稳');
  return lines.join(' ');
}

function getPriceTagHTML(key) {
  if (!dailyPrices[key]) return '';
  var base = FOODS[key].cost;
  var now = dailyPrices[key].cost;
  var pct = Math.round((now / base - 1) * 100);
  if (dailyPrices[key].flashSale) return '<span class="price-tag flash">闪购¥' + now + '</span>';
  if (pct > 0) return '<span class="price-tag up">↑' + pct + '%</span>';
  if (pct < 0) return '<span class="price-tag down">↓' + (-pct) + '%</span>';
  return '';
}

function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function fmtMoney(n) { return '¥' + (n >= 0 ? n : n); }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

function getAvailableFoods() {
  return FOOD_KEYS.filter(function(k){ return S.day >= FOODS[k].unlock; });

function getOptionCount() {
  if (S.day < 10) return 2;
  if (S.day < 20) return 3;
  return 4;
}

function getTimeLimit() {
  if (S.day <= 5) return 5;
  if (S.day <= 15) return 3.5;
  if (S.day <= 30) return 2;
  return 1.5;
}

function getCustomerCount() {
  var base = 8 + Math.floor(S.day * 0.6);
  return Math.min(base, 30 + Math.floor(S.day / 3));
}

function getEventRate() {
  if (S.day < 7) return 0;
  if (S.day < 16) return 0.10;
  return 0.15;
}

  customer.classList.add('reacting');
  setTimeout(function() { customer.classList.remove('reacting'); }, 500);
}

    var angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
    var dist = 40 + Math.random() * 30;
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    p.style.setProperty('--dx', Math.round(Math.cos(angle) * dist) + 'px');
    p.style.setProperty('--dy', Math.round(Math.sin(angle) * dist) + 'px');
    document.body.appendChild(p);
    (function(node) {
      setTimeout(function() { if (node.parentNode) node.parentNode.removeChild(node); }, 600);
    })(p);
  }
}

function comboBarHTML(combo) {
  combo = Number(combo) || 0;
  var pct = Math.min(combo / 10, 1) * 100;
  var level = '';
  if (combo >= 10) level = 'danger';
  else if (combo >= 5) level = 'gold';
  else if (combo >= 3) level = 'accent';
  return '<div class="combo-bar" data-level="' + level + '">' +
         '<div class="combo-bar-fill" style="width:' + pct + '%"></div></div>';
}

// ============ TOAST ============

var toastTimer = null;
function toast(msg, type) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = type || '';
  el.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2000);
}

// ============ SCREEN MANAGEMENT ============

function showScreen(name) {
  S.screen = name;
  var scene = document.getElementById('scene');
  scene.className = 'scene';
  if (S.day >= 16) scene.classList.add('hard');

  // Stop any running timer
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

  switch(name) {
    case 'title':   renderTitle(); break;
    case 'market':  renderMarket(); break;
    case 'home':    renderHome(); break;
    case 'identify':renderIdentify(); break;
    case 'event':   renderEvent(); break;
    case 'settle':  renderSettle(); break;
    case 'upgrade': renderUpgrade(); break;
    case 'profile': renderProfile(); break;

// ============ RENDER: IDENTIFY ============

function renderIdentify() {
  var scene = document.getElementById('scene');
  var c = S.currentCustomer;
  if (!c) return;

  var orderFood = FOODS[c.order];
  var available = getAvailableFoods();
  var numOptions = Math.min(getOptionCount(), available.length);

  // Build options: correct answer + distractors
  var options = [c.order];
  var pool = available.filter(function(k){ return k !== c.order; });
  shuffle(pool);
  for (var i = 0; i < numOptions - 1 && i < pool.length; i++) {
    options.push(pool[i]);
  }

  // Auto-remove one wrong option if hint equipment is owned
  if (getEquipLevel('hint') > 0 && options.length > 2) {
    var wrongIdx = -1;
    for (var j = 0; j < options.length; j++) {
      if (options[j] !== c.order) { wrongIdx = j; break; }
    }
    if (wrongIdx >= 0) options.splice(wrongIdx, 1);
  }

  shuffle(options);

  var choicesHTML = '';
  options.forEach(function(k){
    choicesHTML += '<div class="food-icon ' + k + '" onclick="window._pick(\'' + k + '\')">' + FOODS[k].emoji + '</div>';
  });

  // Scammer gets a "report" button
  if (c.scammer) {
    choicesHTML += '<div class="food-icon" style="background:radial-gradient(circle,#ef4444,#7f1d1d);font-size:28px;border:2px solid var(--danger);" onclick="window._reportScam()">🚫</div>';
  }

  S.timeLimit = getTimeLimitWithEquip();
  S.timeLeft = S.timeLimit;

  // Customer bubble text
  var bubbleText = '要 ' + orderFood.name;
  if (c.vip) bubbleText = '👑 ' + orderFood.name + '（3倍）';
  if (c.scammer) bubbleText = '要 ' + orderFood.name + '（大钞）';

  // Customer class
  var custClass = 'customer';
  if (c.vip) custClass += ' vip';
  if (c.scammer) custClass += ' scammer';

  // Combo bar (below stall counter)
  var comboBar = S.combo > 0 ?
    '<div style="position:absolute;top:76px;left:50%;transform:translateX(-50%);width:140px;z-index:10;">' +
    '<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:2px;">' +
      '<span>连击 ' + S.combo + '</span><span>' + (S.combo >= 10 ? 'MAX' : S.combo + '/10') + '</span></div>' +
    comboBarHTML(S.combo) + '</div>' : '';

  scene.innerHTML = updateHUD() +
    '<div class="flash-overlay" id="flash"></div>' +
    // Customer
    '<div class="' + custClass + '">' +
      '<div class="bubble">' + bubbleText + '</div>' +
      '<div class="face">' + c.face + '</div>' +
    '</div>' +
    // Stall counter
    '<div class="stall-counter"><span class="sn">🏮 ' + S.sign.substring(0, 10) + '</span></div>' +
    // Timer
    '<div class="timer-wrap"><div class="timer-ring">' +
      '<svg viewBox="0 0 100 100">' +
        '<circle cx="50" cy="50" r="45" fill="none" stroke="var(--divider)" stroke-width="5"/>' +
        '<circle id="ring" cx="50" cy="50" r="45" fill="none" stroke="' + (c.vip ? 'var(--gold)' : 'var(--accent)') + '" stroke-width="5" stroke-linecap="round" stroke-dasharray="282.74" stroke-dashoffset="0" style="transition:stroke-dashoffset 0.1s linear;"/>' +
      '</svg>' +
      '<div class="timer-text" id="timer-text" style="' + (c.vip ? 'color:var(--gold);' : '') + '">' + Math.ceil(S.timeLeft) + '</div>' +
    '</div></div>' +
    // Combo display
    (S.combo > 1 ?
      '<div class="combo-display"><div class="cv">×' + S.combo + '</div><div class="cl">COMBO</div></div>' : '') +
    comboBar +
    // Choices
    '<div class="choices">' + choicesHTML + '</div>' +
    // Gamble bar or hint
    (S.gambling ?
      '<div class="actionbar"><div class="gamble-bar" style="width:100%;">' +
        '<div class="gb-info"><div class="gb-pot">池 ¥' + S.gamblePot + '</div><div class="gb-streak">押注 ' + S.gambleStreak + '/5</div></div>' +
        '<button class="btn sm gold" onclick="window._gambleCollect()">✅ 收下</button>' +
      '</div></div>' :
      '<div class="actionbar">' +
        (S.combo >= 2 ?
          '<button class="btn ghost sm" onclick="window._gambleStart()">🎲 押注双倍</button>' : '') +
        '<button class="btn ghost sm" onclick="window._hint()">💡 提示</button>' +
      '</div>');

  startTimer();
}

// ============ GAME LOGIC ============

function startTimer() {
  var ring = document.getElementById('ring');
  var text = document.getElementById('timer-text');
  if (!ring || !text) return;

  var circumference = 282.74;
  var startTime = Date.now();

  timerInterval = setInterval(function(){
    var elapsed = (Date.now() - startTime) / 1000;
    S.timeLeft = S.timeLimit - elapsed;

    if (S.timeLeft <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      onTimeUp();
      return;
    }

    var progress = S.timeLeft / S.timeLimit;
    var offset = circumference * (1 - progress);
    ring.style.strokeDashoffset = offset;
    text.textContent = Math.ceil(S.timeLeft);

    // Color change
    if (progress < 0.3) {
      ring.style.stroke = 'var(--danger)';
      text.style.color = 'var(--danger)';
    } else if (progress < 0.6) {
      ring.style.stroke = 'var(--gold)';
      text.style.color = 'var(--gold)';
    }
  }, 50);
}

function onTimeUp() {
  handleAnswer(null);
}

function generateCustomer() {
  var r = Math.random();
  var type = CUSTOMER_TYPES[0];
  var acc = 0;
  for (var i = 0; i < CUSTOMER_TYPES.length; i++) {
    acc += CUSTOMER_TYPES[i].prob;
    if (r < acc) { type = CUSTOMER_TYPES[i]; break; }
  }

  var available = getAvailableFoods();
  var inStock = available.filter(function(k){ return (S.inventory[k] || 0) > 0; });
  var orderPool = inStock.length > 0 ? inStock : available;
  var order = pick(orderPool);
  var face = pick(type.face);

  var customer = {
    type: type.type,
    order: order,
    face: face,
    patience: type.patience,
    tipMul: type.tipMul,
    vip: false,
    scammer: false
  };

  // 8% chance VIP (from day 3+)
  if (S.day >= 3 && Math.random() < 0.08) {
    customer.vip = true;
    customer.tipMul = 3;
    customer.face = pick(['🤵','👸','🤴']);
    customer.patience = 0.5;
  }

  // 10% chance scammer (from day 5+)
  if (S.day >= 5 && !customer.vip && Math.random() < 0.10) {
    customer.scammer = true;
    customer.face = pick(['😏','😬','🤥']);
  }

  return customer;
}

function openStall() {
  var count = getCustomerCount();
  if (currentMod && currentMod.customerMul) count = Math.round(count * currentMod.customerMul);
  S.customerQueue = [];
  for (var i = 0; i < count; i++) {
    S.customerQueue.push(generateCustomer());
  }
  S.customerIdx = 0;
  S.dailyEarned = 0;
  S.dailyCorrect = 0;
  S.dailyWrong = 0;
  S.customersServed = 0;
  S.combo = 0;
  S.maxCombo = 0;
  S.eventTriggeredToday = false;
  S.shieldUsed = false;
  S.gambling = false;
  S.gamblePot = 0;
  S.gambleStreak = 0;

  // Show tutorial on day 1
  if (S.day === 1 && !S.tutorialShown) {
    showTutorial();
  } else {
    serveNextCustomer();
  }
}

function showTutorial() {

  foods.forEach(function(k){

      '<div class="food-demo">' + demo + '</div>' +
      '<p style="color:var(--muted);font-size:12px;margin-bottom:24px;">提示：鸭腿是金黄色，鹅腿是暗红色，注意区分色相！</p>' +
      '<button class="btn lg" onclick="window._endTutorial()">开始营业！</button>' +
    '</div>';

function serveNextCustomer() {
  if (S.customerIdx >= S.customerQueue.length) {
    // All customers served
    endDay();
    return;
  }

  // Check game over
  if (S.money <= 0 || S.rep <= 0) {
    gameOver();
    return;
  }

  // Check inventory
  var totalStock = 0;
  Object.keys(S.inventory).forEach(function(k){ totalStock += S.inventory[k]; });
  if (totalStock === 0) {
    toast('库存卖完了！', 'err');
    endDay();
    return;
  }

  S.currentCustomer = S.customerQueue[S.customerIdx];

  // If the customer's order is out of stock, regenerate
  if ((S.inventory[S.currentCustomer.order] || 0) <= 0) {
    S.currentCustomer = generateCustomer();
  }

  showScreen('identify');
}

function handleAnswer(picked) {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  if (!S.currentCustomer) return;

  var c = S.currentCustomer;
  var correct = picked === c.order;
  var flash = document.getElementById('flash');

  // Flash feedback
  if (flash) {
    flash.className = 'flash-overlay ' + (correct ? 'correct' : 'wrong') + ' show';
    setTimeout(function(){ flash.classList.remove('show'); }, 500);
  }

  // Highlight chosen
  if (picked) {
    var els = document.querySelectorAll('.food-icon');
    els.forEach(function(el){
      if (el.classList.contains(picked)) {
        el.classList.add(correct ? 'correct-flash' : 'wrong-flash');
      }
    });
  }

  // Customer reaction
  reactCustomer(correct);

  if (correct) {
    var f = FOODS[c.order];
    var earnings = f.price;

    // Daily mod pay multiplier
    if (currentMod && currentMod.payMul) earnings = Math.round(earnings * currentMod.payMul);

    // Combo bonus
    S.combo++;
    var comboMul = 1;
    if (S.combo >= 10) comboMul = 1.5;
    else if (S.combo >= 5) comboMul = 1.2;
    else if (S.combo >= 3) comboMul = 1.1;
    earnings = Math.round(earnings * comboMul);

    // Tip bonus
    earnings = Math.round(earnings * c.tipMul);

    // Deduct from inventory
    S.inventory[c.order] = Math.max(0, (S.inventory[c.order] || 0) - 1);

    // Gamble: if gambling, add to pot and double it
    if (S.gambling) {
      S.gamblePot += earnings;
      S.gambleStreak++;
      if (S.gambleStreak >= 5) {
        // Force collect at 5
        earnings = S.gamblePot;
        S.gambling = false;
        S.gambleStreak = 0;
        S.gamblePot = 0;
        toast('🎰 5连押注到顶！收下 ¥' + earnings, 'ok');
      } else {
        // Double or nothing continues
        showFloatScore(window.innerWidth / 2, window.innerHeight / 3, '+¥' + earnings + ' 🎲', 'gold');
        spawnParticles(window.innerWidth / 2, window.innerHeight / 3, 10);
        S.money += earnings;
        S.totalEarned += earnings;
        S.dailyEarned += earnings;
        S.dailyCorrect++;
        S.totalCorrect++;
        S.rep = clamp(S.rep + 2, 0, 100);
        S.maxCombo = Math.max(S.maxCombo, S.combo);
        S.customersServed++;
        S.customerIdx++;
        checkAchievements();
        if (S.money <= 0 || S.rep <= 0) { setTimeout(function(){ gameOver(); }, 800); return; }
        setTimeout(function(){ serveNextCustomer(); }, 800);
        return;
      }
    }

    S.money += earnings;
    S.totalEarned += earnings;
    S.dailyEarned += earnings;
    S.dailyCorrect++;
    S.totalCorrect++;
    S.rep = clamp(S.rep + 2, 0, 100);
    S.maxCombo = Math.max(S.maxCombo, S.combo);

    // Game feel: float score + particles
    var rect = document.querySelector('.choices') ? document.querySelector('.choices').getBoundingClientRect() : null;
    var fx = rect ? rect.left + rect.width / 2 : window.innerWidth / 2;
    var fy = rect ? rect.top : window.innerHeight / 2;
    showFloatScore(fx, fy, '+¥' + earnings + (S.combo >= 3 ? ' x' + S.combo : ''), S.combo >= 5 ? 'gold' : '');
    if (S.combo >= 3) spawnParticles(fx, fy, 8);
    if (S.combo >= 5) shakeScreen();
  } else {
    // Check shield
    if (getEquipLevel('shield') > 0 && !S.shieldUsed) {
      S.shieldUsed = true;
      S.combo++;
      toast('🛡️ 护盾激活！连击不断', 'ok');
      // Treat as correct from here
      var f2 = FOODS[c.order];
      var e2 = f2.price;
      if (currentMod && currentMod.payMul) e2 = Math.round(e2 * currentMod.payMul);
      var cm2 = 1;
      if (S.combo >= 10) cm2 = 1.5;
      else if (S.combo >= 5) cm2 = 1.2;
      else if (S.combo >= 3) cm2 = 1.1;
      e2 = Math.round(e2 * cm2 * c.tipMul);
      S.inventory[c.order] = Math.max(0, (S.inventory[c.order] || 0) - 1);
      S.money += e2;
      S.totalEarned += e2;
      S.dailyEarned += e2;
      S.dailyCorrect++;
      S.totalCorrect++;
      S.rep = clamp(S.rep + 1, 0, 100);
      S.maxCombo = Math.max(S.maxCombo, S.combo);
      toast('+' + fmtMoney(e2) + ' (护盾)', 'ok');
    } else {
      // Gamble loss
      if (S.gambling) {
        var lost = S.gamblePot;
        S.gambling = false;
        S.gamblePot = 0;
        S.gambleStreak = 0;
        S.combo = 0;
        S.dailyWrong++;
        S.totalWrong++;
        S.rep = clamp(S.rep - 8, 0, 100);
        toast('🎲 押注失败！损失 ¥' + lost, 'err');
        shakeScreen();
        showFloatScore(window.innerWidth / 2, window.innerHeight / 3, '-¥' + lost, 'danger');
      } else {
        S.combo = 0;
        S.money = Math.max(0, S.money - 5);
        S.dailyWrong++;
        S.totalWrong++;
        S.rep = clamp(S.rep - 5, 0, 100);
        var correctName = FOODS[c.order].name;
        toast('答错！是' + correctName + ' -¥5', 'err');
      }
    }
  }

  S.customersServed++;
  S.customerIdx++;

  checkAchievements();

  if (S.money <= 0 || S.rep <= 0) {
    setTimeout(function(){ gameOver(); }, 800);
    return;
  }

  var eventRate = getEventRate();
  if (!S.eventTriggeredToday && Math.random() < eventRate && S.customerIdx < S.customerQueue.length) {
    setTimeout(function(){
      var evt = pick(EVENTS);
      S.currentEvent = evt;
      S.eventTriggeredToday = true;
      showScreen('event');
    }, 800);
  } else {
    setTimeout(function(){ serveNextCustomer(); }, 800);
  }
}

function handleReportScam() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  var c = S.currentCustomer;
  if (!c) return;
  reactCustomer(true);
  var reward = Math.round(FOODS[c.order].price * 2);
  S.money += reward;
  S.totalEarned += reward;
  S.dailyEarned += reward;
  S.rep = clamp(S.rep + 5, 0, 100);
  S.combo++;
  S.maxCombo = Math.max(S.maxCombo, S.combo);
  showFloatScore(window.innerWidth / 2, window.innerHeight / 3, '🚫 举报骗子 +¥' + reward, 'bonus');
  spawnParticles(window.innerWidth / 2, window.innerHeight / 3, 10);
  toast('举报成功！奖励 ¥' + reward, 'ok');
  S.customersServed++;
  S.customerIdx++;
  checkAchievements();
  setTimeout(function(){ serveNextCustomer(); }, 800);
}

function onEventChoice(idx) {
  var e = S.currentEvent;
  if (!e || !e.choices[idx]) return;

  var ch = e.choices[idx];
  var resultText = ch.res;

  // Apply effects
  if (ch.fx.money) S.money = Math.max(0, S.money + ch.fx.money);
  if (ch.fx.rep) S.rep = clamp(S.rep + ch.fx.rep, 0, 100);

  // Track rejections for achievements
  if (ch.ok) {
    if (e.id === 'E03') S.rejectedE03++;
    if (e.id === 'E08' || e.id === 'E12') S.rejectedSupplier++;
    if (e.id === 'E06') S.rejectedPrepaid = true;
    if (e.id === 'E14') S.rejectedGroupBuy = true;
  }

  // Show result toast
  toast(resultText, ch.ok ? 'ok' : 'err');

  S.currentEvent = null;
  checkAchievements();

  // Check game over
  if (S.money <= 0 || S.rep <= 0) {
    setTimeout(function(){ gameOver(); }, 1000);
    return;
  }

  // Continue to next customer
  setTimeout(function(){ serveNextCustomer(); }, 1500);
}

function endDay() {
  S.maxDailyCustomers = Math.max(S.maxDailyCustomers, S.customersServed);
  save();
  showScreen('settle');
}

function nextDay() {
  S.day++;
  S.combo = 0;
  S.shieldUsed = false;
  S.gambling = false;
  S.gamblePot = 0;
  S.gambleStreak = 0;
  generateDailyPrices();
  rollDailyMod();
  S.dailyMod = currentMod;
  toast(currentMod.emoji + ' ' + currentMod.name + '：' + currentMod.desc, '');
  save();
  showScreen('market');
}

function gameOver() {
  S.gameOver = true;
  try { localStorage.removeItem(SAVE_KEY); } catch(e) {}
  showScreen('gameover');
}

};

  if (S.gameOver) return;
  // Can't go to market/upgrade/profile during identify
  if (S.screen === 'identify' || S.screen === 'event' || S.screen === 'settle') return;
  showScreen(screen);
};

window._selectBuy = function(key) {

  renderMarket();
};

window._buy = function(key, qty) {
  var f = FOODS[key];
  var unitCost = getDailyCost(key);
  var cost = unitCost * qty;
  if (S.money < cost) {
    toast('钱不够！需¥' + cost, 'err');
    return;
  }
  S.money -= cost;
  S.inventory[key] = (S.inventory[key] || 0) + qty;
  toast('买入 ' + f.name + ' ×' + qty + ' (-¥' + cost + ')', 'ok');
  renderMarket();
};

window._buyMystery = function() {
  if (S.money < 20) { toast('钱不够！', 'err'); return; }
  S.money -= 20;
  var allFoods = FOOD_KEYS;
  var random = pick(allFoods);
  S.inventory[random] = (S.inventory[random] || 0) + 1;
  toast('🎁 开出 ' + FOODS[random].name + '！', 'ok');
  renderMarket();
};

window._reportScam = function() {
  handleReportScam();
};

window._buyEquip = function(id) {
  var cost = getEquipCost(id);
  if (cost === null) { toast('已满级', 'err'); return; }
  if (S.money < cost) { toast('钱不够！¥' + cost, 'err'); return; }
  S.money -= cost;
  if (!S.equipLevels) S.equipLevels = {};
  S.equipLevels[id] = getEquipLevel(id) + 1;
  for (var i = 0; i < EQUIPMENT.length; i++) {
    if (EQUIPMENT[i].id === id) { toast(EQUIPMENT[i].emoji + ' ' + EQUIPMENT[i].name + ' 升级！', 'ok'); break; }
  }
  renderUpgrade();
};

// ============ INIT ============

function init() {
  newGame();
  showScreen('title');

  // Update status bar time
  function updateTime() {
    var now = new Date();
    var h = String(now.getHours()).padStart(2, '0');
    var m = String(now.getMinutes()).padStart(2, '0');
    var el = document.getElementById('sb-time');
    if (el) el.textContent = h + ':' + m;
  }
  updateTime();
  setInterval(updateTime, 60000);
}

// Start when DOM is ready
if (document.readyState !== 'loading') {
  init();
} else {
  document.addEventListener('DOMContentLoaded', init);
}

})();
</script>
