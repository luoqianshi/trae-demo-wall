<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>赛车么 - GPS赛道辅助</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0F; --bg2:#1C1C24; --bg3:#2A2A35;
  --red:#FF1E1E; --red-d:#B81414;
  --yellow:#FFD600; --green:#00E676; --orange:#FF6D00;
  --t1:#F5F5F7; --t2:#8E8E93; --t3:#5A5A63;
  --border:#2A2A35;
  --fd:'Orbitron',monospace; --fb:'Noto Sans SC',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:var(--fb);
  background:#000;
  color:var(--t1);
  display:flex;align-items:center;justify-content:center;
  position:fixed;inset:0;
}
/* 手机外壳 */
#phone{
  width:100%;max-width:420px;height:100%;max-height:860px;
  position:relative;overflow:hidden;
  background:var(--bg);
  background-image:
    repeating-linear-gradient(45deg,rgba(255,255,255,0.012) 0,rgba(255,255,255,0.012) 1px,transparent 1px,transparent 3px),
    radial-gradient(circle at 30% 10%,rgba(255,30,30,0.06),transparent 50%);
}
@media(min-width:480px){
  #phone{
    border-radius:42px;
    border:10px solid #1a1a1f;
    box-shadow:0 0 0 2px #333,0 30px 80px rgba(255,30,30,0.15),0 0 120px rgba(255,30,30,0.08);
    height:860px;
  }
}
#app{width:100%;height:100%;position:relative;overflow:hidden;}
.page{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transform:translateX(20px);transition:opacity .3s,transform .3s;}
.page.active{opacity:1;pointer-events:auto;transform:translateX(0);}

/* 顶部 */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px 10px;flex-shrink:0;
}
.topbar .ttl{font-family:var(--fd);font-size:18px;font-weight:900;letter-spacing:1px;text-align:center;flex:1;}
.topbar .sub{font-size:11px;color:var(--t2);margin-top:2px;}
.icon-btn{
  width:38px;height:38px;border-radius:50%;
  background:var(--bg2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--t1);flex-shrink:0;
}
.icon-btn:active{transform:scale(0.92);}
.icon-btn svg{width:18px;height:18px;}

.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px 20px;-webkit-overflow-scrolling:touch;}
.content::-webkit-scrollbar{width:0;}

/* 首页 */
.brand{display:flex;align-items:center;gap:10px;padding:6px 16px 14px;}
.brand-logo{
  width:40px;height:40px;border-radius:12px;
  background:linear-gradient(135deg,var(--red),var(--red-d));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(255,30,30,0.4);
}
.brand-logo svg{width:22px;height:22px;}
.brand .name{font-family:var(--fd);font-size:17px;font-weight:900;}
.brand .tag{font-size:9px;color:var(--yellow);font-weight:700;letter-spacing:2px;}

.track-card{
  margin:0 16px 14px;background:var(--bg2);border:1px solid var(--border);
  border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;cursor:pointer;
}
.track-card:active{transform:scale(0.98);}
.track-thumb{width:48px;height:48px;border-radius:10px;background:var(--bg3);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.track-thumb svg{width:36px;height:36px;}
.track-info{flex:1;min-width:0;}
.track-info .tn{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.track-info .tm{font-size:11px;color:var(--t2);margin-top:2px;}
.track-info .tm b{color:var(--yellow);font-family:var(--fd);}

.btns{padding:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn{
  background:var(--bg2);border:1px solid var(--border);border-radius:14px;
  padding:16px 12px;cursor:pointer;display:flex;flex-direction:column;gap:8px;
  transition:transform .15s;
}
.btn:active{transform:scale(0.97);}
.btn.primary{
  grid-column:1/-1;flex-direction:row;align-items:center;padding:18px 16px;
  background:linear-gradient(135deg,var(--red),var(--red-d));border-color:var(--red);
  box-shadow:0 8px 24px rgba(255,30,30,0.3);
}
.btn .bi{width:38px;height:38px;border-radius:10px;background:var(--bg3);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.btn.primary .bi{background:rgba(255,255,255,0.2);}
.btn .bi svg{width:20px;height:20px;color:var(--yellow);}
.btn.primary .bi svg{color:#fff;}
.btn .bl{font-size:14px;font-weight:700;}
.btn.primary .bl{font-size:17px;font-family:var(--fd);letter-spacing:1px;}
.btn .bd{font-size:11px;color:var(--t2);margin-top:1px;}
.btn.primary .bd{color:rgba(255,255,255,0.85);}

/* HUD */
.hud{flex:1;display:flex;flex-direction:column;position:relative;overflow:hidden;}
.hud-speed{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 16px;position:relative;}
.gear{position:absolute;top:4px;right:16px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:6px 12px;text-align:center;}
.gear .l{font-size:9px;color:var(--t2);letter-spacing:1px;}
.gear .v{font-family:var(--fd);font-size:22px;font-weight:900;color:var(--yellow);line-height:1;}
.ring{width:200px;height:200px;position:relative;display:flex;align-items:center;justify-content:center;}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg);}
.ring .rb{fill:none;stroke:var(--bg3);stroke-width:6;}
.ring .rf{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .3s;}
.spd{text-align:center;position:relative;z-index:1;}
.spd .n{font-family:var(--fd);font-size:64px;font-weight:900;line-height:1;background:linear-gradient(180deg,#fff,var(--yellow));-webkit-background-clip:text;background-clip:text;color:transparent;}
.spd .u{font-family:var(--fd);font-size:12px;color:var(--t2);letter-spacing:3px;margin-top:3px;}
.hud-next{margin:0 16px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:12px 14px;}
.hud-next .cn{font-size:12px;font-weight:700;color:var(--yellow);display:flex;align-items:center;gap:6px;}
.hud-next .cn .dot{width:7px;height:7px;border-radius:50%;background:var(--yellow);box-shadow:0 0 8px var(--yellow);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
.hud-next .cd{font-family:var(--fd);font-size:28px;font-weight:900;margin-top:4px;}
.hud-next .cd span{font-size:13px;color:var(--t2);font-weight:400;}
.hud-next .cb{height:4px;background:var(--bg3);border-radius:2px;margin-top:8px;overflow:hidden;}
.hud-next .cb i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--yellow),var(--red));transition:width .3s;}
.hud-adv{margin:0 16px 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.ac{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;}
.ac .l{font-size:9px;color:var(--t2);letter-spacing:1px;text-transform:uppercase;}
.ac .v{font-family:var(--fd);font-size:18px;font-weight:700;margin-top:3px;}
.btag{display:inline-flex;align-items:center;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;font-family:var(--fb);}
.btag.none{background:rgba(142,142,147,0.15);color:var(--t2);}
.btag.light{background:rgba(0,230,118,0.15);color:var(--green);}
.btag.medium{background:rgba(255,109,0,0.15);color:var(--orange);}
.btag.heavy{background:rgba(255,30,30,0.15);color:var(--red);}
.hud-corner{margin:0 16px 10px;background:linear-gradient(135deg,rgba(255,214,0,0.1),rgba(255,30,30,0.1));border:1px solid rgba(255,214,0,0.3);border-radius:10px;padding:12px;}
.hud-corner .l{font-size:9px;color:var(--yellow);letter-spacing:1px;text-transform:uppercase;font-weight:700;}
.hud-corner .t{font-size:14px;font-weight:700;margin-top:4px;line-height:1.4;}
.hud-minimap{margin:0 16px 80px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.hud-minimap .mm-bg{width:100%;height:120px;background:#0F0F14;position:relative;}
.hud-minimap .mm-track{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0.6;}
.hud-minimap .mm-track svg{width:95%;height:95%;}
.hud-minimap .mm-cp{position:absolute;width:8px;height:8px;background:var(--yellow);border-radius:50%;transform:translate(-50%,-50%);opacity:0.4;transition:opacity .3s;box-shadow:0 0 6px var(--yellow);}
.hud-minimap .mm-car{position:absolute;width:12px;height:12px;background:var(--red);border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 10px var(--red);transition:left .3s,top .3s;z-index:5;}
.hud-minimap .mm-info{padding:6px 10px;font-size:10px;color:var(--t2);display:flex;justify-content:center;gap:8px;font-family:var(--fd);}
.hud-ctrls{position:absolute;bottom:0;left:0;right:0;padding:14px 16px;display:flex;gap:8px;background:linear-gradient(0deg,var(--bg),transparent);}
.hb{flex:1;padding:13px;border-radius:10px;border:1px solid var(--border);background:var(--bg2);color:var(--t1);font-size:13px;font-weight:700;cursor:pointer;text-align:center;}
.hb:active{transform:scale(0.97);}
.hb.danger{background:var(--red);border-color:var(--red);}

/* 编辑器 */
.tools{padding:0 16px 10px;display:flex;gap:8px;flex-shrink:0;}
.tb{flex:1;padding:9px;border-radius:10px;border:1px solid var(--border);background:var(--bg2);color:var(--t1);font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;}
.tb svg{width:13px;height:13px;}
.tb.active{background:var(--red);border-color:var(--red);color:#fff;}
.tb.save{background:var(--yellow);border-color:var(--yellow);color:#000;}
.map{margin:0 16px;flex:1;position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:#0F0F14;min-height:280px;}
.map-canvas{position:absolute;inset:0;overflow:hidden;cursor:crosshair;}
.map-canvas.dragging{cursor:grabbing;}
.map-content{width:100%;height:100%;position:relative;transform-origin:0 0;transition:transform .12s;}
.map-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.04) 1px,transparent 1px);background-size:30px 30px;}
.sticker{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.sticker svg{width:90%;height:90%;opacity:0.85;}
.cp-mark{position:absolute;transform:translate(-50%,-50%);cursor:pointer;z-index:5;}
.cp-mark .pin{width:26px;height:26px;background:var(--red);border:2px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(255,30,30,0.5);}
.cp-mark .pn{transform:rotate(45deg);font-family:var(--fd);font-size:10px;font-weight:900;color:#fff;}
.cp-mark .pl{position:absolute;top:-20px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--border);padding:2px 6px;border-radius:4px;font-size:9px;white-space:nowrap;color:var(--yellow);font-weight:700;}
.map-ctrls{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:5px;z-index:10;}
.mc{width:32px;height:32px;border-radius:8px;background:rgba(28,28,36,0.9);border:1px solid var(--border);color:var(--t1);display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(8px);}
.mc:active{background:var(--red);}
.mc svg{width:14px;height:14px;}
.map-hint{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(255,30,30,0.9);color:#fff;font-size:10px;font-weight:700;padding:5px 12px;border-radius:16px;z-index:10;}
.cp-list{padding:10px 16px 0;flex-shrink:0;max-height:140px;overflow-y:auto;}
.cp-list::-webkit-scrollbar{width:0;}
.cp-list .lt{font-size:11px;color:var(--t2);margin-bottom:6px;}
.cp-list .lt b{color:var(--yellow);font-family:var(--fd);}
.cpi{display:flex;align-items:center;gap:8px;padding:9px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;margin-bottom:5px;}
.cpi .n{width:26px;height:26px;border-radius:7px;background:var(--red);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:11px;font-weight:900;flex-shrink:0;}
.cpi .info{flex:1;min-width:0;}
.cpi .info .i{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cpi .info .d{font-size:10px;color:var(--t2);margin-top:1px;}
.cpi .act{width:28px;height:28px;border-radius:7px;background:var(--bg3);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t2);}
.cpi .act:active{background:var(--red);color:#fff;}
.cpi .act svg{width:13px;height:13px;}

/* 浮窗 */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,0.5);z-index:100;opacity:0;pointer-events:none;transition:opacity .25s;}
.overlay.show{opacity:1;pointer-events:auto;}
.sheet{position:absolute;bottom:0;left:0;right:0;background:var(--bg2);border-radius:20px 20px 0 0;padding:18px;z-index:101;transform:translateY(100%);transition:transform .3s cubic-bezier(0.32,0.72,0,1);max-height:88%;overflow-y:auto;border-top:1px solid var(--border);}
.sheet.show{transform:translateY(0);}
.sheet::-webkit-scrollbar{width:0;}
.handle{width:36px;height:4px;background:var(--bg3);border-radius:2px;margin:0 auto 14px;}
.stitle{font-family:var(--fd);font-size:16px;font-weight:900;margin-bottom:14px;display:flex;align-items:center;gap:6px;}
.stitle .badge{background:var(--red);color:#fff;font-size:10px;padding:2px 7px;border-radius:5px;font-family:var(--fb);}
.fg{margin-bottom:12px;}
.fl{font-size:11px;color:var(--t2);margin-bottom:5px;display:block;font-weight:500;}
.fi,.fta{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:11px 12px;color:var(--t1);font-size:13px;font-family:var(--fb);outline:none;}
.fi:focus,.fta:focus{border-color:var(--red);}
.fta{resize:none;min-height:60px;line-height:1.5;}
.fr{display:flex;gap:8px;}
.fr .fg{flex:1;}
.bsel{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.bo{padding:10px 6px;border-radius:10px;border:1px solid var(--border);background:var(--bg);text-align:center;cursor:pointer;font-size:12px;font-weight:700;transition:all .15s;}
.bo .lv{font-size:9px;color:var(--t2);margin-top:1px;font-weight:400;}
.bo.active.none{background:rgba(142,142,147,0.15);border-color:var(--t2);color:var(--t2);}
.bo.active.light{background:rgba(0,230,118,0.15);border-color:var(--green);color:var(--green);}
.bo.active.medium{background:rgba(255,109,0,0.15);border-color:var(--orange);color:var(--orange);}
.bo.active.heavy{background:rgba(255,30,30,0.15);border-color:var(--red);color:var(--red);}
.sact{display:flex;gap:8px;margin-top:16px;}
.bp{flex:1;padding:13px;border-radius:10px;background:linear-gradient(135deg,var(--red),var(--red-d));border:none;color:#fff;font-size:14px;font-weight:700;cursor:pointer;}
.bs{flex:1;padding:13px;border-radius:10px;background:var(--bg3);border:1px solid var(--border);color:var(--t1);font-size:14px;font-weight:700;cursor:pointer;}

/* 列表 */
.li{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;cursor:pointer;}
.li:active{transform:scale(0.98);border-color:var(--red);}
.li .th{width:44px;height:44px;border-radius:10px;background:var(--bg3);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.li .th svg{width:26px;height:26px;color:var(--yellow);}
.li .info{flex:1;min-width:0;}
.li .info .t{font-size:13px;font-weight:700;}
.li .info .s{font-size:11px;color:var(--t2);margin-top:2px;}
.li .info .s b{color:var(--yellow);font-family:var(--fd);}
.li .m{font-family:var(--fd);font-size:12px;color:var(--yellow);font-weight:700;}
.tag{display:inline-block;font-size:9px;padding:1px 5px;border-radius:4px;font-weight:700;margin-left:4px;}
.tag.official{background:rgba(255,214,0,0.15);color:var(--yellow);}
.tag.user{background:rgba(0,230,118,0.15);color:var(--green);}
.tag.custom{background:rgba(255,30,30,0.15);color:var(--red);}

/* 论坛 */
.post{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer;}
.post:active{transform:scale(0.98);}
.post .h{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.post .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--yellow));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#fff;flex-shrink:0;}
.post .au{font-size:11px;font-weight:700;}
.post .at{font-size:10px;color:var(--t3);}
.post .tt{font-size:14px;font-weight:700;line-height:1.4;margin-bottom:3px;}
.post .ex{font-size:11px;color:var(--t2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.post .st{display:flex;gap:12px;margin-top:8px;font-size:10px;color:var(--t2);}
.post .st span{display:flex;align-items:center;gap:3px;}
.post .st svg{width:11px;height:11px;}

.fab{position:absolute;bottom:18px;right:16px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--red-d));border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 24px rgba(255,30,30,0.4);z-index:20;}
.fab:active{transform:scale(0.9);}
.fab svg{width:22px;height:22px;}

/* 排行榜 */
.tabs{display:flex;gap:6px;padding:0 16px 10px;overflow-x:auto;flex-shrink:0;}
.tabs::-webkit-scrollbar{width:0;height:0;}
.tab{padding:7px 14px;border-radius:18px;background:var(--bg2);border:1px solid var(--border);font-size:11px;font-weight:700;white-space:nowrap;cursor:pointer;color:var(--t2);}
.tab.active{background:var(--red);border-color:var(--red);color:#fff;}
.ri{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;margin-bottom:6px;}
.ri .p{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:15px;font-weight:900;flex-shrink:0;background:var(--bg3);color:var(--t2);}
.ri.gold .p{background:linear-gradient(135deg,#FFD700,#FFA000);color:#000;}
.ri.silver .p{background:linear-gradient(135deg,#E0E0E0,#9E9E9E);color:#000;}
.ri.bronze .p{background:linear-gradient(135deg,#CD7F32,#8D6E63);color:#fff;}
.ri .w{flex:1;min-width:0;}
.ri .w .nm{font-size:13px;font-weight:700;}
.ri .w .vh{font-size:10px;color:var(--t2);margin-top:1px;}
.ri .tm{font-family:var(--fd);font-size:15px;font-weight:900;color:var(--yellow);}

.empty{text-align:center;padding:36px 16px;color:var(--t2);}
.empty svg{width:44px;height:44px;margin-bottom:10px;opacity:0.3;}
.empty .t{font-size:13px;font-weight:700;}
.empty .s{font-size:11px;margin-top:3px;}

.toast{position:absolute;top:50px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--bg2);border:1px solid var(--red);color:var(--t1);padding:9px 18px;border-radius:22px;font-size:12px;font-weight:700;z-index:200;opacity:0;pointer-events:none;transition:all .3s;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="phone">
  <div id="app"></div>
  <div class="toast" id="toast"></div>
</div>
<script>

const R={routes:{},on(h,f){this.routes[h]=f;},go(h){location.hash=h;},handle(){
  const h=location.hash.slice(1)||'/home';
  // 清理驾驶计时器
  if(window.driveTimer){clearInterval(window.driveTimer);window.driveTimer=null;}
  $$('.overlay').forEach(o=>o.remove());
  // 精确匹配
  if(this.routes[h])return this.routes[h]();
  // 参数路由
  for(const r in this.routes){
    if(!r.includes(':'))continue;
    const rp=r.split('/').filter(Boolean),hp=h.split('/').filter(Boolean);
    if(rp.length!==hp.length)continue;
    const p={};let ok=true;
    for(let i=0;i<rp.length;i++){if(rp[i].startsWith(':'))p[rp[i].slice(1)]=hp[i];else if(rp[i]!==hp[i]){ok=false;break;}}
    if(ok)return this.routes[r](p);
  }
  this.routes['/home']?.();
}};
window.addEventListener('hashchange',()=>R.handle());

let dState={};
function startDrive(t){
  dState={i:0,spd:0,dist:t.checkpoints[0]?.dist||100,run:true,start:Date.now(),lap:1};
  window.driveTimer=setInterval(()=>{
    if(!dState.run)return;
    const cp=t.checkpoints[dState.i];
    if(!cp){
      dState.lap++;
      dState.i=0;
      const lap=Date.now()-dState.start;
      D.laps.unshift({id:'l'+Date.now(),tid:t.id,tn:t.name,time:lap,veh:'高尔夫GTI',time_created:Date.now()});
      save();
      dState.start=Date.now();
      dState.spd=0;
      dState.dist=t.checkpoints[0]?.dist||100;
      toast('完成第 '+dState.lap+' 圈！');
      const nx=t.checkpoints[0];
      $('#cpn').textContent=nx.name;
      $('#cpd').textContent=nx.dist||0;
      $('#as').textContent=nx.speed||0;
      const ab=$('#ab');ab.className='btag '+nx.brake;ab.textContent=BL[nx.brake];
      $('#ac').textContent=nx.advice;
      $('#mmlap').textContent='第 '+dState.lap+' 圈';
      $('#mmcp').textContent='CP 1/'+t.checkpoints.length;
      return;
    }
    const tg=cp.speed+Math.random()*15;
    dState.spd+=Math.min(4,tg-dState.spd);
    if(dState.spd<0)dState.spd=0;
    dState.dist-=Math.max(1,dState.spd/3.6*0.3);
    const pr=Math.max(0,Math.min(1,dState.dist/(cp.dist||100)));
    $('#sn')&&($('#sn').textContent=Math.round(dState.spd));
    const arc=$('#arc');if(arc)arc.setAttribute('stroke-dashoffset',276-276*Math.min(1,dState.spd/200));
    $('#gear')&&($('#gear').textContent=Math.max(1,Math.min(6,Math.floor(dState.spd/35)+1)));
    $('#cpd')&&($('#cpd').textContent=Math.round(Math.max(0,dState.dist)));
    $('#cpb')&&($('#cpb').style.width=(pr*100)+'%');
    // 更新小地图车辆位置
    const car=$('#mmcar');
    if(car){
      const nextCp=t.checkpoints[dState.i+1]||t.checkpoints[0];
      const progress=1-pr;
      const cx=cp.x+(nextCp.x-cp.x)*progress;
      const cy=cp.y+(nextCp.y-cp.y)*progress;
      car.style.left=cx+'%';car.style.top=cy+'%';
    }
    // 更新检查点高亮
    $$('.mm-cp').forEach((el,j)=>el.style.opacity=dState.i===j?1:0.4);
    if(dState.dist<=0){
      dState.i++;
      const nx=t.checkpoints[dState.i];
      if(nx){
        $('#cpn').textContent=nx.name;
        $('#cpd').textContent=nx.dist||0;
        $('#as').textContent=nx.speed||0;
        const ab=$('#ab');ab.className='btag '+nx.brake;ab.textContent=BL[nx.brake];
        $('#ac').textContent=nx.advice;
        dState.dist=nx.dist||100;
        $('#mmcp').textContent='CP '+(dState.i+1)+'/'+t.checkpoints.length;
        toast('通过 '+cp.name);
      }
    }
  },300);
}
function pauseDrive(){dState.run=!dState.run;const b=$('#pb');if(b)b.textContent=dState.run?'暂停':'继续';}
function stopDrive(){if(window.driveTimer){clearInterval(window.driveTimer);window.driveTimer=null;}R.go('/home');}

          <div class="info"><div class="t">${t.name}<span class="tag ${t.type}">${{official:'官方',user:'用户',custom:'我的'}[t.type]}</span></div><div class="s">${t.checkpoints.length} 检查点 · ${t.author} ${t.bestLap?'· <b>'+ft(t.bestLap)+'</b>':''}</div></div>
          <div class="m">${I.fwd}</div>
        </div>
        ${t.type==='custom'?`<div class="act" onclick="delTrack('${t.id}')" style="width:36px;height:36px;border-radius:9px;background:var(--bg3);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t2);margin-left:8px;">${I.del}</div>`:''}
      </div>`).join('')}
    </div>
    <div class="fab" onclick="newTrackSheet()">${I.plus}</div>
  </div>`;
});

// 新建赛道命名
function newTrackSheet(){
  const o=document.createElement('div');
  o.className='overlay show';
  o.innerHTML=`<div class="sheet show" onclick="event.stopPropagation()">
    <div class="handle"></div>
    <div class="stitle">${I.flag} 新建赛道</div>
    <div class="fg"><label class="fl">赛道名称</label><input class="fi" id="ntn" placeholder="例如：我的小区赛道" maxlength="20"></div>
    <div class="sact"><button class="bs" onclick="closeSheet()">取消</button><button class="bp" onclick="createTrack()">创建并编辑</button></div>
  </div>`;
  o.onclick=closeSheet;
  $('#app').appendChild(o);
  setTimeout(()=>$('#ntn')?.focus(),300);
}
function createTrack(){
  const n=$('#ntn').value.trim();
  if(!n)return toast('请输入赛道名称');
  const t={id:'u'+Date.now(),name:n,author:'我',type:'custom',bestLap:null,checkpoints:[]};
  D.tracks.push(t);D.curTrack=t.id;save();
  closeSheet();R.go('/editor/edit/'+t.id);
}
function closeSheet(){$$('.overlay').forEach(o=>{o.classList.remove('show');setTimeout(()=>o.remove(),300);});}

// ========== 编辑器 ==========
let mState={scale:1,tx:0,ty:0,place:true};
R.on('/editor/edit/:id',p=>{
  const t=getT(p.id);
  if(!t)return R.go('/editor/list');
  D.curTrack=t.id;save();
  $('#app').innerHTML=`<div class="page active">
    <div class="topbar">
      <div class="icon-btn" onclick="R.go('/editor/list')">${I.back}</div>
      <div><div class="ttl">${t.name}</div><div class="sub">${t.checkpoints.length} 检查点 · 点击地图添加</div></div>
      <div class="icon-btn" onclick="saveTrack()">${I.target}</div>
    </div>
    <div class="tools">
      <div class="tb active" id="ab" onclick="togglePlace()">${I.plus} 新建检查点</div>
      <div class="tb save" onclick="saveTrack()">保存赛道</div>
    </div>
    <div class="map">
      <div class="map-canvas" id="mc">
        <div class="map-content" id="mco">
          <div class="map-grid"></div>
          <div class="sticker">${TRACK}</div>
          ${t.checkpoints.map((c,i)=>`<div class="cp-mark" style="left:${c.x}%;top:${c.y}%" onclick="editCP('${c.id}')"><div class="pl">${c.name}</div><div class="pin"><span class="pn">${i+1}</span></div></div>`).join('')}
        </div>
      </div>
      <div class="map-ctrls">
        <div class="mc" onclick="mZoom(1.25)">${I.zi}</div>
        <div class="mc" onclick="mZoom(0.8)">${I.zo}</div>
        <div class="mc" onclick="mReset()" style="font-size:13px">⌂</div>
      </div>
      <div class="map-hint" id="mh">${I.pin} 点击地图设置检查点</div>
    </div>
    <div class="cp-list">
      <div class="lt">检查点列表 <b>${t.checkpoints.length}</b></div>
      ${t.checkpoints.length?t.checkpoints.map((c,i)=>`<div class="cpi"><div class="n">${i+1}</div><div class="info"><div class="i">${c.name}</div><div class="d">${c.dist}m · ${c.speed}km/h · ${BL[c.brake]}</div></div><div class="act" onclick="editCP('${c.id}')">${I.edit}</div><div class="act" onclick="delCP('${c.id}')">${I.del}</div></div>`).join(''):`<div class="empty">${I.pin}<div class="t">还没有检查点</div><div class="s">点击上方地图开始添加</div></div>`}
    </div>
  </div>`;
  mState={scale:1,tx:0,ty:0,place:true};
  initMap();
});
function initMap(){
  const mc=$('#mc'),mco=$('#mco');
  if(!mc)return;
  applyM();
  // 点击放置
  mc.addEventListener('click',e=>{
    if(!mState.place||e.target.closest('.cp-mark'))return;
    const r=mco.getBoundingClientRect();
    const x=((e.clientX-r.left)/r.width)*100,y=((e.clientY-r.top)/r.height)*100;
    if(x<0||x>100||y<0||y>100)return;
    cpSheet(null,{x:Math.max(2,Math.min(98,x)),y:Math.max(2,Math.min(98,y))});
  });
  // 滚轮缩放
  mc.addEventListener('wheel',e=>{e.preventDefault();mZoom(e.deltaY<0?1.1:0.9);},{passive:false});
  // 拖拽
  let ds=null;
  mc.addEventListener('mousedown',e=>{
    if(mState.place||e.target.closest('.cp-mark'))return;
    ds={x:e.clientX,y:e.clientY,tx:mState.tx,ty:mState.ty};mc.classList.add('dragging');
  });
  addEventListener('mousemove',e=>{if(!ds)return;mState.tx=ds.tx+(e.clientX-ds.x);mState.ty=ds.ty+(e.clientY-ds.y);applyM();});
  addEventListener('mouseup',()=>{if(ds){ds=null;mc.classList.remove('dragging');}});
  // 触摸
  mc.addEventListener('touchstart',e=>{if(!mState.place&&e.touches.length===1&&!e.target.closest('.cp-mark'))ds={x:e.touches[0].clientX,y:e.touches[0].clientY,tx:mState.tx,ty:mState.ty};},{passive:true});
  mc.addEventListener('touchmove',e=>{if(!ds||e.touches.length!==1)return;mState.tx=ds.tx+(e.touches[0].clientX-ds.x);mState.ty=ds.ty+(e.touches[0].clientY-ds.y);applyM();},{passive:true});
  mc.addEventListener('touchend',()=>{ds=null;});
}
function applyM(){const c=$('#mco');if(c)c.style.transform=`translate(${mState.tx}px,${mState.ty}px) scale(${mState.scale})`;}
function mZoom(f){mState.scale=Math.max(0.5,Math.min(3,mState.scale*f));applyM();}
function mReset(){mState={scale:1,tx:0,ty:0,place:mState.place};applyM();}
function togglePlace(){mState.place=!mState.place;const b=$('#ab'),h=$('#mh'),c=$('#mc');if(b)b.classList.toggle('active',mState.place);if(c)c.style.cursor=mState.place?'crosshair':'grab';if(h)h.style.display=mState.place?'block':'none';}

// 检查点浮窗
let pendCoord=null,selBrake='light';
function cpSheet(id,coord){
  const t=curT();if(!t)return;
  const cp=id?t.checkpoints.find(c=>c.id===id):null;
  selBrake=cp?cp.brake:'light';
  pendCoord=coord;
  const o=document.createElement('div');
  o.className='overlay show';
  o.innerHTML=`<div class="sheet show" onclick="event.stopPropagation()">
    <div class="handle"></div>
    <div class="stitle">${I.pin} ${cp?'编辑':'新建'}检查点 <span class="badge">CP ${cp?t.checkpoints.indexOf(cp)+1:t.checkpoints.length+1}</span></div>
    <div class="fg"><label class="fl">检查点名称</label><input class="fi" id="cpn" placeholder="如：T1入弯" value="${cp?cp.name:''}" maxlength="12"></div>
    <div class="fr">
      <div class="fg"><label class="fl">刹车距离 (米)</label><input class="fi" id="cpd" type="number" placeholder="50" value="${cp?cp.dist:''}" min="0"></div>
      <div class="fg"><label class="fl">建议时速 (km/h)</label><input class="fi" id="cps" type="number" placeholder="80" value="${cp?cp.speed:''}" min="0"></div>
    </div>
    <div class="fg"><label class="fl">刹车力度</label>
      <div class="bsel">
        <div class="bo ${cp&&cp.brake==='none'?'active none':''}" onclick="selB(this,'none')">无<span class="lv">不刹车</span></div>
        <div class="bo ${cp&&cp.brake==='light'?'active light':''}" onclick="selB(this,'light')">轻度<span class="lv">轻踩</span></div>
        <div class="bo ${cp&&cp.brake==='medium'?'active medium':''}" onclick="selB(this,'medium')">中度<span class="lv">半刹</span></div>
        <div class="bo ${cp&&cp.brake==='heavy'?'active heavy':''}" onclick="selB(this,'heavy')">重度<span class="lv">重刹</span></div>
      </div>
    </div>
    <div class="fg"><label class="fl">过弯建议（自定义文字）</label><textarea class="fta" id="cpa" placeholder="如：离路肩1米准备过弯，切弯心，出弯走外侧">${cp?cp.advice:''}</textarea></div>
    <div class="sact"><button class="bs" onclick="closeSheet()">取消</button><button class="bp" onclick="saveCP('${id||''}')">保存</button></div>
  </div>`;
  o.onclick=closeSheet;
  $('#app').appendChild(o);
  setTimeout(()=>$('#cpn')?.focus(),300);
}
function selB(el,l){$$('.bo').forEach(o=>o.classList.remove('active','light','medium','heavy'));el.classList.add('active',l);selBrake=l;}
function saveCP(id){
  const t=curT();if(!t)return;
  const n=$('#cpn').value.trim(),d=parseInt($('#cpd').value)||0,s=parseInt($('#cps').value)||0,a=$('#cpa').value.trim()||'保持当前走线';
  if(!n)return toast('请输入检查点名称');
  let newCp;
  if(id){const c=t.checkpoints.find(c=>c.id===id);if(c)Object.assign(c,{name:n,dist:d,speed:s,brake:selBrake,advice:a});toast('检查点已更新');}
  else{
    newCp={id:'c'+Date.now(),x:pendCoord.x,y:pendCoord.y,name:n,dist:d,speed:s,brake:selBrake,advice:a};
    t.checkpoints.push(newCp);toast('检查点已添加');
  }
  save();closeSheet();
  // 直接在地图上插入标记，不依赖页面重新渲染
  const mco=$('#mco');
  if(mco&&newCp){
    const i=t.checkpoints.length;
    const mk=document.createElement('div');
    mk.className='cp-mark';
    mk.style.cssText=`left:${newCp.x}%;top:${newCp.y}%`;
    mk.onclick=()=>editCP(newCp.id);
    mk.innerHTML=`<div class="pl">${newCp.name}</div><div class="pin"><span class="pn">${i}</span></div>`;
    mco.appendChild(mk);
  }
  // 更新检查点列表和计数
  const listEl=$('.cp-list');
  if(listEl){
    listEl.innerHTML=`<div class="lt">检查点列表 <b>${t.checkpoints.length}</b></div>
    ${t.checkpoints.map((c,i)=>`<div class="cpi"><div class="n">${i+1}</div><div class="info"><div class="i">${c.name}</div><div class="d">${c.dist}m · ${c.speed}km/h · ${BL[c.brake]}</div></div><div class="act" onclick="editCP('${c.id}')">${I.edit}</div><div class="act" onclick="delCP('${c.id}')">${I.del}</div></div>`).join('')}`;
  }
  // 更新副标题
  const sub=$('.topbar .sub');
  if(sub)sub.textContent=t.checkpoints.length+' 检查点 · 点击地图添加';
}
function editCP(id){cpSheet(id,null);}
function delCP(id){
  const t=curT();if(!t)return;
  t.checkpoints=t.checkpoints.filter(c=>c.id!==id);save();
  // 移除地图上的标记并重新编号
  $$('.cp-mark').forEach((mk,i)=>{
    const cp=t.checkpoints[i];
    if(!cp){mk.remove();return;}
    mk.style.cssText=`left:${cp.x}%;top:${cp.y}%`;
    mk.querySelector('.pl').textContent=cp.name;
    mk.querySelector('.pn').textContent=i+1;
    mk.onclick=()=>editCP(cp.id);
  });
  // 如果有多余的标记移除
  const marks=$$('.cp-mark');
  for(let i=t.checkpoints.length;i<marks.length;i++)marks[i].remove();
  // 更新列表
  const listEl=$('.cp-list');
  if(listEl)listEl.innerHTML=`<div class="lt">检查点列表 <b>${t.checkpoints.length}</b></div>${t.checkpoints.map((c,i)=>`<div class="cpi"><div class="n">${i+1}</div><div class="info"><div class="i">${c.name}</div><div class="d">${c.dist}m · ${c.speed}km/h · ${BL[c.brake]}</div></div><div class="act" onclick="editCP('${c.id}')">${I.edit}</div><div class="act" onclick="delCP('${c.id}')">${I.del}</div></div>`).join('')}`;
  const sub=$('.topbar .sub');if(sub)sub.textContent=t.checkpoints.length+' 检查点 · 点击地图添加';
  toast('已删除');
}
function saveTrack(){const t=curT();if(!t||!t.checkpoints.length)return toast('请至少添加一个检查点');save();toast('赛道已保存');setTimeout(()=>R.go('/editor/list'),800);}
function delTrack(id){
  const t=getT(id);
  if(!t)return;
  if(t.type!=='custom')return toast('只能删除自定义赛道');
  D.tracks=D.tracks.filter(tr=>tr.id!==id);
  if(D.curTrack===id)D.curTrack=D.tracks[0]?.id||null;
  save();
  R.go('/editor/list');
  toast('赛道已删除');
}

// ========== 论坛 ==========
R.on('/forum',()=>{
  $('#app').innerHTML=`<div class="page active">
    <div class="topbar">
      <div class="icon-btn" onclick="R.go('/home')">${I.back}</div>
      <div><div class="ttl">车友论坛</div><div class="sub">${D.posts.length} 个话题</div></div>
      <div style="width:38px"></div>
    </div>
    <div class="content">
      ${D.posts.map(p=>`<div class="post" onclick="toast('帖子详情Demo')">
        <div class="h"><div class="av">${p.av}</div><div style="flex:1"><div class="au">${p.author}</div><div class="at">${fa(p.time)}</div></div></div>
        <div class="tt">${p.title}</div><div class="ex">${p.content}</div>
        <div class="st"><span>${I.chat} ${p.rep}</span><span>${I.heart} ${p.like}</span></div>
      </div>`).join('')}
    </div>
    <div class="fab" onclick="postSheet()">${I.plus}</div>
  </div>`;
});
function postSheet(){
  const o=document.createElement('div');
  o.className='overlay show';
  o.innerHTML=`<div class="sheet show" onclick="event.stopPropagation()">
    <div class="handle"></div>
    <div class="stitle">${I.edit} 发布新帖</div>
    <div class="fg"><label class="fl">标题</label><input class="fi" id="pt" placeholder="一句话说清你的话题" maxlength="40"></div>
    <div class="fg"><label class="fl">正文</label><textarea class="fta" id="pc" placeholder="分享你的赛道心得、提问或讨论..." style="min-height:100px"></textarea></div>
    <div class="sact"><button class="bs" onclick="closeSheet()">取消</button><button class="bp" onclick="pubPost()">发布</button></div>
  </div>`;
  o.onclick=closeSheet;
  $('#app').appendChild(o);
  setTimeout(()=>$('#pt')?.focus(),300);
}
function pubPost(){
  const t=$('#pt').value.trim(),c=$('#pc').value.trim();
  if(!t)return toast('请输入标题');if(!c)return toast('请输入正文');
  D.posts.unshift({id:'p'+Date.now(),title:t,author:'我',av:'我',content:c,rep:0,like:0,time:Date.now()});
  save();closeSheet();toast('发布成功');R.go('/forum');
}

// ========== 历史圈速 ==========
R.on('/history',()=>{
  const l=D.laps;
  $('#app').innerHTML=`<div class="page active">
    <div class="topbar">
      <div class="icon-btn" onclick="R.go('/home')">${I.back}</div>
      <div><div class="ttl">历史圈速</div><div class="sub">共 ${l.length} 条记录</div></div>
      <div style="width:38px"></div>
    </div>
    <div class="content">
      ${l.length?l.map(x=>{
        const best=Math.min(...l.filter(i=>i.tid===x.tid).map(i=>i.time));
        return `<div class="li"><div class="th">${I.clock}</div><div class="info"><div class="t">${x.tn} ${x.time===best?'<span class="tag custom">PB</span>':''}</div><div class="s">${x.veh} · ${fa(x.time_created)}</div></div><div class="m">${ft(x.time)}</div></div>`;
      }).join(''):`<div class="empty">${I.clock}<div class="t">还没有圈速记录</div><div class="s">开始驾驶后会自动记录</div></div>`}
    </div>
  </div>`;
});

// ========== 排行榜 ==========
R.on('/leaderboard',()=>{
  const ids=Object.keys(D.board);
  const tid=ids[D.curTab]||ids[0];
  const t=getT(tid);
  const b=[...(D.board[tid]||[])].sort((a,b)=>a.t-b.t);
  $('#app').innerHTML=`<div class="page active">
    <div class="topbar">
      <div class="icon-btn" onclick="R.go('/home')">${I.back}</div>
      <div><div class="ttl">排行榜</div><div class="sub">圈速 PK</div></div>
      <div style="width:38px"></div>
    </div>
    <div class="tabs">
      ${ids.map((id,i)=>{const tt=getT(id);return `<div class="tab ${i===D.curTab?'active':''}" onclick="D.curTab=${i};save();R.go('/leaderboard')">${tt?tt.name:''}</div>`;}).join('')}
    </div>
    <div class="content">
      ${b.length?b.map((r,i)=>{
        const c=i===0?'gold':i===1?'silver':i===2?'bronze':'';
        return `<div class="ri ${c}"><div class="p">${i+1}</div><div class="w"><div class="nm">${r.d}${r.d==='我'?' (我)':''}</div><div class="vh">${r.v}</div></div><div class="tm">${ft(r.t)}</div></div>`;
      }).join(''):`<div class="empty">${I.trophy}<div class="t">暂无排行数据</div></div>`}
    </div>
  </div>`;
});

// ========== 启动 ==========
if(!location.hash)location.hash='#/home';
else R.handle();
</script>
