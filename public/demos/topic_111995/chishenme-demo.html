// ============================================================
// RULE ENGINE (Recommender)
// ============================================================
const Recommender = {
  byMoodAndWeather(mood, weatherKey) {
    const scored = MockData.dishes.map(d => {
      let score = 0;
      if (d.moods && d.moods.includes(mood)) score += 50;
      if (d.weathers && d.weathers.includes(weatherKey)) score += 40;
      score += Math.random() * 10;
      return { ...d, score };
    });
    return scored.sort((a, b) => b.score - a.score).slice(0, 4);
  },

  byFilter(cuisine) {
    if (cuisine === '全部') return MockData.restaurants.slice().sort((a,b) => b.matchScore - a.matchScore);
    return MockData.restaurants.filter(r => r.cuisine === cuisine).sort((a,b) => b.matchScore - a.matchScore);
  },

  byIngredients(selected) {
    if (!selected || selected.length === 0) return [];
    const scored = MockData.dishes.map(d => {
      const recipe = MockData.recipes[d.id];
      if (!recipe) return { ...d, score: 0 };
      const matchCount = recipe.ingredients.filter(ing =>
        selected.some(sel => ing.includes(sel) || sel.includes(ing))
      ).length;
      return { ...d, score: matchCount, recipe };
    }).filter(d => d.score > 0);
    return scored.sort((a, b) => b.score - a.score).slice(0, 3);
  },

  socialCompromise() {
    return {
      name: '老张牛肉面馆',
      emoji: '🍜',
      reason: '综合5人口味偏好分析：满足3人面食需求，辣度可调兼顾不吃辣的小王，出餐快适合午休时间'
    };
  }
};

// ============================================================
// ROUTER
// ============================================================
const Router = {
  init() {
    window.addEventListener('hashchange', () => this.handle());
    this.handle();
  },
  handle() {
    const hash = location.hash.slice(1) || '/home';
    const parts = hash.split('/').filter(Boolean);
    const route = parts[0] || 'home';
    const param = parts[1];

    // Update tab bar
    const tabBar = document.getElementById('tabBar');
    const isDetail = route === 'detail';
    tabBar.classList.toggle('hidden', isDetail);

    // Update active tab
    document.querySelectorAll('.tab-item').forEach(tab => {
      tab.classList.toggle('active', tab.dataset.route === route);
    });

    // Render page
    const container = document.getElementById('app-content');
    const noTab = isDetail ? ' no-tab' : '';
    container.innerHTML = `<div class="page${noTab}" id="currentPage"></div>`;
    const page = document.getElementById('currentPage');

    switch(route) {
      case 'home': Pages.home(page); break;
      case 'delivery': Pages.delivery(page); break;
      case 'cooking': Pages.cooking(page); break;
      case 'social': Pages.social(page); break;
      case 'profile': Pages.profile(page); break;
      case 'detail': Pages.detail(page, param); break;
      default: Pages.home(page);
    }
  },
  go(path) {
    location.hash = path;
  }
};

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

function gradientForId(id) {
  const gradients = ['gradient-1','gradient-2','gradient-3','gradient-4','gradient-5'];
  return gradients[id % gradients.length];
}

function difficultyTag(diff) {
  if (diff === '新手') return 'tag-green';
  if (diff === '进阶') return 'tag-yellow';
  return 'tag-pink';
}

function skeletonHTML(count) {
  let html = '';
  for (let i = 0; i < count; i++) {
    html += `<div class="skel-card"><div class="skel-img skeleton"></div><div class="skel-body"><div class="skel-line skeleton w60"></div><div class="skel-line skeleton w80"></div><div class="skel-line skeleton w40"></div></div></div>`;
  }
  return html;
}

    const radar = u.tasteRadar;
    const maxVal = 100;
    el.innerHTML = `
      <div class="profile-header">
        <div class="profile-avatar">😋</div>
        <div class="profile-info">
          <div class="name">${u.name}</div>
          <div class="level">美食探索者 LV.${u.level}</div>
        </div>
      </div>
      <div class="page-body">
        <div class="section-title">📊 本周数据</div>
        <div class="stat-grid">
          <div class="stat-card">
            <div class="stat-num">${u.stats.weekOrders}</div>
            <div class="stat-label">选餐次数</div>
          </div>
          <div class="stat-card">
            <div class="stat-num">${u.stats.savedTime}</div>
            <div class="stat-label">节省分钟</div>
          </div>
          <div class="stat-card">
            <div class="stat-num">${u.stats.topCuisine}</div>
            <div class="stat-label">最爱菜系</div>
          </div>
        </div>
        <div class="section-title">👅 口味画像</div>
        <div class="radar-container">
          <h4>你的口味偏好分析</h4>
          <div class="radar-chart">
            ${this._radarSVG(radar, maxVal)}
          </div>
          <div style="display:flex;justify-content:space-around;margin-top:12px;flex-wrap:wrap;gap:8px">
            ${Object.entries(radar).map(([k, v]) => `
              <div style="text-align:center">
                <div style="font-size:16px;font-weight:800;color:var(--accent)">${v}</div>
                <div style="font-size:11px;color:var(--muted)">${k}</div>
              </div>
            `).join('')}
          </div>
        </div>
        <div class="section-title">⚙️ 偏好设置</div>
        <div style="background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden">
          <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--rule)">
            <span style="font-size:14px;font-weight:600;color:var(--ink)">🚫 饮食禁忌</span>
            <span style="font-size:13px;color:var(--muted)">无</span>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--rule)">
            <span style="font-size:14px;font-weight:600;color:var(--ink)">💰 预算范围</span>
            <span style="font-size:13px;color:var(--muted)">¥15-40</span>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--rule)">
            <span style="font-size:14px;font-weight:600;color:var(--ink)">🎯 健康目标</span>
            <span style="font-size:13px;color:var(--muted)">均衡饮食</span>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px">
            <span style="font-size:14px;font-weight:600;color:var(--ink)">📍 常用地址</span>
            <span style="font-size:13px;color:var(--muted)">公司 · 家</span>
          </div>
        </div>
      </div>
    `;
  },

  _radarSVG(data, maxVal) {
    const keys = Object.keys(data);
    const vals = Object.values(data);
    const n = keys.length;
    const cx = 100, cy = 100, r = 70;
    // Grid lines
    let grid = '';
    for (let g = 1; g <= 4; g++) {
      const gr = r * g / 4;
      let pts = '';
      for (let i = 0; i < n; i++) {
        const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
        pts += `${cx + gr * Math.cos(angle)},${cy + gr * Math.sin(angle)} `;
      }
      grid += `<polygon points="${pts}" fill="none" stroke="var(--rule)" stroke-width="1"/>`;
    }
    // Axes
    let axes = '';
    let labels = '';
    for (let i = 0; i < n; i++) {
      const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
      const x = cx + r * Math.cos(angle);
      const y = cy + r * Math.sin(angle);
      axes += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--rule)" stroke-width="1"/>`;
      const lx = cx + (r + 15) * Math.cos(angle);
      const ly = cy + (r + 15) * Math.sin(angle);
      labels += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="var(--ink2)" font-weight="600">${keys[i]}</text>`;
    }
    // Data polygon
    let dataPts = '';
    for (let i = 0; i < n; i++) {
      const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
      const dr = r * vals[i] / maxVal;
      dataPts += `${cx + dr * Math.cos(angle)},${cy + dr * Math.sin(angle)} `;
    }
    const dataPoly = `<polygon points="${dataPts}" fill="rgba(255,107,53,0.2)" stroke="var(--accent)" stroke-width="2"/>`;
    // Data points
    let dots = '';
    for (let i = 0; i < n; i++) {
      const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
      const dr = r * vals[i] / maxVal;
      const x = cx + dr * Math.cos(angle);
      const y = cy + dr * Math.sin(angle);
      dots += `<circle cx="${x}" cy="${y}" r="3" fill="var(--accent)"/>`;
    }
    return `<svg viewBox="0 0 200 200">${grid}${axes}${dataPoly}${dots}${labels}</svg>`;
  },

  detail(el, id) {
    const dish = MockData.dishes.find(d => d.id == id) || MockData.dishes[0];
    const recipe = MockData.recipes[dish.id];
    el.innerHTML = `
      <button class="detail-back" onclick="history.back()">‹</button>
      <div class="detail-hero ${gradientForId(dish.id)}">${dish.emoji}</div>
      <div class="page-body">
        <div class="detail-info">
          <div class="detail-title">${dish.name}</div>
          <div class="detail-subtitle">${dish.cuisine} · ${dish.tastes.join(' / ')} · ¥${dish.price}</div>
          <div class="food-card-tags" style="margin-top:8px">
            <span class="tag tag-orange">${dish.cuisine}</span>
            ${dish.tastes.map(t => `<span class="tag tag-yellow">${t}</span>`).join('')}
            <span class="tag ${difficultyTag(dish.difficulty)}">${dish.difficulty}</span>
          </div>
        </div>
        <div class="section-title">💡 推荐理由</div>
        <div class="food-card-reason" style="margin-bottom:16px">
          ${this._moodReason(dish, MockData.currentMood, MockData.currentWeather.key)}。这道菜热量${dish.calories}卡，${dish.cookTime > 0 ? '制作约需' + dish.cookTime + '分钟' : '即食无需烹饪'}。
        </div>
        <div class="section-title">📊 营养信息</div>
        <div class="nutrition-ring-container">
          <div class="nutrition-ring" style="--progress:${Math.min(dish.calories / 10, 95)}">
            <div class="ring-content">
              <div class="ring-value">${dish.calories}</div>
              <div class="ring-label">千卡</div>
            </div>
          </div>
          <div class="nutrition-bars">
            <div class="nutrient-bar">
              <div class="nutrient-bar-header"><span>蛋白质</span><span>${dish.protein}g</span></div>
              <div class="nutrient-bar-track"><div class="nutrient-bar-fill protein" style="width:${Math.min(dish.protein * 2, 100)}%"></div></div>
            </div>
            <div class="nutrient-bar">
              <div class="nutrient-bar-header"><span>碳水化合物</span><span>${dish.carbs}g</span></div>
              <div class="nutrient-bar-track"><div class="nutrient-bar-fill carbs" style="width:${Math.min(dish.carbs * 1.2, 100)}%"></div></div>
            </div>
            <div class="nutrient-bar">
              <div class="nutrient-bar-header"><span>脂肪</span><span>${dish.fat}g</span></div>
              <div class="nutrient-bar-track"><div class="nutrient-bar-fill fat" style="width:${Math.min(dish.fat * 2, 100)}%"></div></div>
            </div>
          </div>
        </div>
        ${recipe ? `
          <div class="section-title">👨‍🍳 做法步骤</div>
          <div class="recipe-card">
            <div class="recipe-section" style="padding-top:14px">
              <h4>所需食材</h4>
              <div class="recipe-ingredients">
                ${recipe.ingredients.map(ing => `<span class="ingredient-tag">${ing}</span>`).join('')}
              </div>
            </div>
            <div class="recipe-section" style="padding-bottom:14px">
              <h4>烹饪步骤</h4>
              <div class="recipe-steps">
                ${recipe.steps.map((s, idx) => `
                  <div class="recipe-step">
                    <span class="step-num">${idx + 1}</span>
                    <span>${s}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        ` : ''}
        <div class="food-card-action" style="margin-top:16px;margin-bottom:30px">
          <button class="btn-secondary" onclick="showToast('菜谱已收藏！')">📋 收藏</button>
          <button class="btn-primary" onclick="showToast('正在跳转美团下单...')">🛵 去外卖</button>
        </div>
      </div>
    `;
  }
};

Router.init();
</script>
</body>
