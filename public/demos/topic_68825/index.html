  <style>

    body {

      margin-bottom: 22px;

    h1 {

    }

    .intro {

    .today-pill {

    .stats-card {

    }

    .calendar-card {
      padding: 24px;

    .calendar-toolbar {
      display: flex;

    .month-title {

      font-weight: 800;
    }

    .legend {
      display: flex;

    }

    .legend-item {
      display: inline-flex;

    .dot {
      width: 10px;

      border-radius: 50%;

    }

    .dot.done { background: var(--accent); }
    .dot.missed { background: var(--accent2); }
    .dot.today { background: var(--amber); }

    .weekdays,
    .calendar-grid {
      display: grid;

      padding: 12px;

      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease, color 160ms ease, box-shadow 160ms ease;
      font: inherit;
    }

    .day:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px var(--shadow);
      border-color: var(--amber);

    .day:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--amber) 45%, transparent);
      outline-offset: 3px;
    }

    .day.empty {
      cursor: default;
      opacity: 0;
      pointer-events: none;
    }

    .day-number {
      display: inline-flex;
      width: 34px;
      height: 34px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-weight: 800;
      background: color-mix(in srgb, var(--rule) 55%, transparent);
    }

    .day-status {
      display: block;
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .day.done {
      background: color-mix(in srgb, var(--accent) 14%, var(--bg2));
      border-color: color-mix(in srgb, var(--accent) 45%, var(--rule));
    }

    .day.done .day-number {
      background: var(--accent);
      color: var(--bg2);
    }

    .day.done .day-status {
      color: var(--accent);
    }

    .day.missed {
      background: color-mix(in srgb, var(--accent2) 13%, var(--bg2));
      border-color: color-mix(in srgb, var(--accent2) 45%, var(--rule));
    }

    .day.missed .day-number {
      background: var(--accent2);
      color: var(--bg2);
    }

    .day.missed .day-status {
      color: var(--accent2);
    }

    .day.today:not(.done):not(.missed) {
      border-color: var(--amber);
      background: color-mix(in srgb, var(--amber) 12%, var(--bg2));
    }

    .day.today:not(.done):not(.missed) .day-number {
      background: var(--amber);
      color: var(--bg2);
    }

    .stats-card {
      position: sticky;
      top: 24px;
      padding: 24px;
    }

    .stats-card h2 {
      font-size: 1.25rem;
      margin-bottom: 16px;
    }

    .big-stat {
      padding: 22px;
      border-radius: 22px;
      background: color-mix(in srgb, var(--accent) 10%, var(--bg));
      border: 1px solid color-mix(in srgb, var(--accent) 28%, var(--rule));
      margin-bottom: 16px;
    }

    .big-number {
      font-size: 4.5rem;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.08em;
      color: var(--accent);
    }

    .big-label {
      color: var(--muted);
      margin-top: 6px;

    }

    .metric-list {
      display: grid;
      gap: 10px;
      margin: 16px 0;
    }

    .metric {
      display: flex;
      justify-content: space-between;

      border-bottom: 1px solid var(--rule);
      padding: 11px 0;
      color: var(--muted);
    }

    .metric strong {
      color: var(--ink);
      font-size: 1.15rem;
    }

    .progress {
      height: 12px;
      border-radius: 999px;
      background: var(--rule);
      overflow: hidden;
      margin: 18px 0 8px;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--amber));
      transition: width 220ms ease;
    }

    .hint {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.65;
      margin-top: 14px;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .btn {
      border: 1px solid var(--rule);
      background: var(--bg);
      color: var(--ink);
      border-radius: 999px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 800;
      transition: transform 160ms ease, border-color 160ms ease;
      font: inherit;
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: var(--amber);
    }

    @media (max-width: 900px) {
      .hero {
        display: block;
      }

      .today-pill {
        display: inline-flex;
        margin-top: 16px;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .stats-card {
        position: static;
      }
    }

    @media (max-width: 620px) {
      body {
        padding: 18px 12px;
      }

      .calendar-card,
      .stats-card {
        border-radius: 22px;
        padding: 16px;
      }

      .calendar-toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .weekdays,
      .calendar-grid {
        gap: 6px;
      }

      .weekday {
        font-size: 0.75rem;
      }

      .day {
        min-height: 70px;
        border-radius: 14px;
        padding: 8px;
      }

      .day-number {
        width: 28px;
        height: 28px;
        font-size: 0.9rem;
      }

      .day-status {
        margin-top: 10px;
        font-size: 0.72rem;
      }
    }
  </style>
</head>
<body>
  <article class="page" aria-labelledby="page-title">
    <header class="hero">
      <div>
        <p class="eyebrow">DAILY READING CHECK-IN</p>
        <h1 id="page-title">6月每日阅读打卡</h1>
        <p class="intro">点击日期即可标记为已阅读，再次点击可取消。已打卡日期显示为绿色；当前日期之前仍未打卡的日期会自动显示为红色。</p>
      </div>
      <div class="today-pill" id="todayLabel">今天</div>
    </header>

    <main>
      <div class="layout">
        <section class="calendar-card" aria-label="6月阅读打卡日历">
          <div class="calendar-toolbar">
            <h2 class="month-title" id="monthTitle">2026年6月</h2>
            <div class="legend" aria-label="状态说明">
              <span class="legend-item"><span class="dot done"></span>已打卡</span>
              <span class="legend-item"><span class="dot missed"></span>过期未打卡</span>
              <span class="legend-item"><span class="dot today"></span>今天</span>
            </div>
          </div>

          <div class="weekdays" aria-hidden="true">
            <div class="weekday">一</div>
            <div class="weekday">二</div>
            <div class="weekday">三</div>
            <div class="weekday">四</div>
            <div class="weekday">五</div>
            <div class="weekday">六</div>
            <div class="weekday">日</div>
          </div>
          <div class="calendar-grid" id="calendarGrid"></div>
        </section>

        <aside class="stats-card" aria-label="阅读统计">
          <h2>本月统计</h2>
          <div class="big-stat">
            <div class="big-number" id="completedCount">0</div>
            <div class="big-label">本月阅读总天数</div>
          </div>
          <div class="progress" aria-label="阅读完成进度">
            <div class="progress-bar" id="progressBar"></div>
          </div>
          <div class="metric-list">
            <div class="metric"><span>本月总天数</span><strong id="totalDays">30</strong></div>
            <div class="metric"><span>完成比例</span><strong id="completionRate">0%</strong></div>
            <div class="metric"><span>过期未打卡</span><strong id="missedCount">0</strong></div>
            <div class="metric"><span>剩余未打卡</span><strong id="remainingCount">0</strong></div>
          </div>
          <p class="hint">打卡数据会自动保存在当前浏览器中。若更换浏览器或设备，状态不会同步。</p>
          <div class="actions">
            <button class="btn" id="checkAllBtn" type="button">一键全勤</button>
            <button class="btn" id="resetBtn" type="button">清空记录</button>
          </div>
        </aside>
      </div>
    </main>
  </article>

  <script>
    (function () {
      var targetYear = 2026;
      var targetMonth = 5;
      var storageKey = "reading-checkin-2026-06";
      var dayNames = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
      var today = new Date();
      today.setHours(0, 0, 0, 0);
      var daysInMonth = new Date(targetYear, targetMonth + 1, 0).getDate();
      var firstDay = new Date(targetYear, targetMonth, 1).getDay();
      var leadingEmpty = firstDay === 0 ? 6 : firstDay - 1;
      var completed = loadCompleted();

      var calendarGrid = document.getElementById("calendarGrid");
      var completedCount = document.getElementById("completedCount");
      var totalDays = document.getElementById("totalDays");
      var completionRate = document.getElementById("completionRate");
      var missedCount = document.getElementById("missedCount");
      var remainingCount = document.getElementById("remainingCount");
      var progressBar = document.getElementById("progressBar");
      var todayLabel = document.getElementById("todayLabel");
      var resetBtn = document.getElementById("resetBtn");
      var checkAllBtn = document.getElementById("checkAllBtn");

      todayLabel.textContent = "今天：" + today.getFullYear() + "年" + (today.getMonth() + 1) + "月" + today.getDate() + "日 " + dayNames[today.getDay()];
      totalDays.textContent = String(daysInMonth);

      function loadCompleted() {
        try {
          var saved = JSON.parse(localStorage.getItem(storageKey) || "[]");
          return new Set(saved.filter(function (day) {
            return Number.isInteger(day) && day >= 1 && day <= daysInMonth;
          }));
        } catch (error) {
          return new Set();
        }
      }

      function saveCompleted() {
        localStorage.setItem(storageKey, JSON.stringify(Array.from(completed).sort(function (a, b) {
          return a - b;
        })));
      }

      function isPast(date) {
        return date.getTime() < today.getTime();
      }

      function isToday(date) {
        return date.getTime() === today.getTime();
      }

      function renderCalendar() {
        calendarGrid.innerHTML = "";

        for (var i = 0; i < leadingEmpty; i += 1) {
          var empty = document.createElement("div");
          empty.className = "day empty";
          calendarGrid.appendChild(empty);
        }

        for (var day = 1; day <= daysInMonth; day += 1) {
          var date = new Date(targetYear, targetMonth, day);
          date.setHours(0, 0, 0, 0);

          var button = document.createElement("button");
          button.type = "button";
          button.className = "day";
          button.dataset.day = String(day);

          var status = "未打卡";
          if (completed.has(day)) {
            button.classList.add("done");
            status = "已打卡";
          } else if (isPast(date)) {
            button.classList.add("missed");
            status = "过期未打卡";
          } else if (isToday(date)) {
            button.classList.add("today");
            status = "今日待打卡";
          }

          button.setAttribute("aria-label", "6月" + day + "日，" + status + "，点击切换状态");
          button.innerHTML = '<span class="day-number">' + day + '</span><span class="day-status">' + status + '</span>';
          button.addEventListener("click", function (event) {
            var selectedDay = Number(event.currentTarget.dataset.day);
            if (completed.has(selectedDay)) {
              completed.delete(selectedDay);
            } else {
              completed.add(selectedDay);
            }
            saveCompleted();
            renderCalendar();
            updateStats();
          });
          calendarGrid.appendChild(button);
        }
      }

      function updateStats() {
        var completedTotal = completed.size;
        var missedTotal = 0;
        var remainingTotal = 0;

        for (var day = 1; day <= daysInMonth; day += 1) {
          var date = new Date(targetYear, targetMonth, day);
          date.setHours(0, 0, 0, 0);
          if (!completed.has(day)) {
            if (isPast(date)) {
              missedTotal += 1;
            } else {
              remainingTotal += 1;
            }
          }
        }

        var rate = Math.round((completedTotal / daysInMonth) * 100);
        completedCount.textContent = String(completedTotal);
        completionRate.textContent = rate + "%";
        missedCount.textContent = String(missedTotal);
        remainingCount.textContent = String(remainingTotal);
        progressBar.style.width = rate + "%";
      }

      resetBtn.addEventListener("click", function () {
        if (confirm("确定要清空 6 月的所有阅读打卡记录吗？")) {
          completed.clear();
          saveCompleted();
          renderCalendar();
          updateStats();
        }
      });

      checkAllBtn.addEventListener("click", function () {
        for (var day = 1; day <= daysInMonth; day += 1) {
          completed.add(day);
        }
        saveCompleted();
        renderCalendar();
        updateStats();
      });

      renderCalendar();
      updateStats();
    })();
  </script>
</body>
</html>
