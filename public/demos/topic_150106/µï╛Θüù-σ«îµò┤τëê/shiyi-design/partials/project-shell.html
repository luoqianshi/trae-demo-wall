<!-- ========================================
     拾遗 ShiYi — Project Shell (shared fragment)
     Include this fragment in every page's HTML body.
     ======================================== -->
<div id="project-shell">

  <!-- ── Fixed Header Bar ── -->
  <header class="fixed top-0 left-0 right-0 z-50 h-14 flex items-center px-6 bg-white border-b border-[#e7e5e4]" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;">

    <!-- Left: Logo -->
    <div class="flex items-center gap-1 shrink-0">
      <span class="text-[#1c1917] text-xl font-bold tracking-tight" style="font-family: 'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', serif;">
        拾遗
      </span>
      <span class="inline-block w-2 h-2 rounded-full bg-[#2563eb] opacity-60 translate-y-[-4px]"></span>
    </div>

    <!-- Center: Search Bar -->
    <div class="flex-1 flex justify-center px-8">
      <div class="relative w-full max-w-md">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-[#a8a29e] pointer-events-none" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
        </svg>
        <input
          type="text"
          placeholder="搜索诗人、诗词、地点..."
          class="w-full pl-10 pr-4 py-2 bg-[#f5f3ef] border-0 rounded-full text-sm text-[#1c1917] placeholder-[#a8a29e] outline-none focus:ring-2 focus:ring-[#2563eb]/20 transition-shadow duration-200"
        />
      </div>
    </div>

    <!-- Right: Tab Navigation -->
    <nav class="flex items-center gap-1 shrink-0">
      <!-- SLOT: activeNavItem — default is "探索" -->
      <a
        href="#"
        data-dom-id="nav-explore"
        class="bg-[#2563eb] text-white rounded-full px-4 py-1.5 text-sm font-medium transition-colors duration-200"
      >
        探索
      </a>
      <a
        href="#"
        data-dom-id="nav-discover"
        class="text-[#57534e] hover:bg-[#f5f3ef] rounded-full px-4 py-1.5 text-sm transition-colors duration-200"
      >
        发现
      </a>
    </nav>

  </header>

  <!-- Page content is rendered below the 56px header -->
  <main class="pt-14 min-h-screen bg-[#fafaf9]">
    <!-- SLOT: pageContent -->
  </main>

</div>
