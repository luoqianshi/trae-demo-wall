<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>老板今天几点走</title>
<style>
:root{
  --bg:#0f1117;--card:#1a1d28;--card2:#222639;--border:#2e3348;
  --text:#e8eaf0;--text2:#9498ad;--accent:#ff6b35;--accent2:#ff9f1c;
  --green:#2ec4b6;--red:#e71d36;--blue:#4895ef;--purple:#9b5de5;
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;font-size:15px;line-height:1.6}
.app{max-width:560px;margin:0 auto;padding:16px 16px 60px}
.header{text-align:center;padding:20px 0 4px}
.header h1{font-size:26px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header p{color:var(--text2);font-size:12px;margin-top:2px}
.header-sub{font-size:16px;font-weight:600;color:var(--accent2);letter-spacing:2px;margin-top:4px}
.summary-box{text-align:center;padding:18px 16px;background:linear-gradient(135deg,var(--card2),var(--card));border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px}
.summary-box .summary-text{font-size:20px;font-weight:800;color:var(--text);line-height:1.3}
.tabs{display:flex;gap:4px;margin:14px 0;background:var(--card);border-radius:10px;padding:3px}
.tab{flex:1;padding:9px 0;text-align:center;border-radius:8px;cursor:pointer;font-size:11px;font-weight:600;color:var(--text2);transition:all .2s;border:none;background:transparent}
.tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.tab:hover:not(.active){color:var(--text)}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-left:3px;vertical-align:middle;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.section{display:none}.section.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:12px;animation:fi .25s ease}
.card-title{font-size:13px;color:var(--text2);margin-bottom:10px;display:flex;align-items:center;gap:6px;font-weight:600}
.hero-pred{text-align:center;padding:24px 16px;background:linear-gradient(145deg,var(--card),var(--card2));border-radius:var(--radius);border:1px solid var(--border);margin-bottom:10px;position:relative;overflow:hidden}
.hero-pred::before{content:'';position:absolute;top:-50px;right:-50px;width:120px;height:120px;border-radius:50%;background:rgba(255,107,53,.06)}
.hero-pred .date{font-size:13px;color:var(--text2);margin-bottom:4px}
.hero-pred .time{font-size:52px;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.1}
.hero-pred .conf{margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px}
.conf-bar{width:100px;height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.conf-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--green),var(--accent2));transition:width .5s}
.conf-text{font-size:12px;font-weight:600;color:var(--text2)}
.factor-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;justify-content:center}
.factor-tag{padding:2px 8px;border-radius:10px;font-size:10px;background:rgba(255,107,53,.1);color:var(--accent);border:1px solid rgba(255,107,53,.15)}
.pred-detail{font-size:11px;color:var(--blue);margin-top:4px;text-align:center}
.fun-phrase{text-align:center;font-size:11px;color:var(--text2);margin:6px 0 2px;font-style:italic}
.form-group{margin-bottom:12px}
.form-label{display:block;font-size:11px;color:var(--text2);margin-bottom:5px;font-weight:500}
.form-input{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s}
.form-input:focus{border-color:var(--accent)}
.form-row{display:flex;gap:8px}.form-row .form-input{flex:1}
.tag-sel{display:flex;flex-wrap:wrap;gap:5px}
.tag-opt{padding:4px 10px;border-radius:12px;font-size:11px;border:1px solid var(--border);cursor:pointer;transition:all .2s;background:transparent;color:var(--text2);user-select:none}
.tag-opt.on{background:rgba(255,107,53,.15);border-color:var(--accent);color:var(--accent)}
.tag-opt:hover{border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:9px 18px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-pri{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-pri:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(255,107,53,.25)}
.btn-sec{background:var(--card2);color:var(--text);border:1px solid var(--border)}
.btn-sec:hover{border-color:var(--accent)}
.btn-blk{width:100%}.btn-sm{padding:6px 12px;font-size:11px}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:6px}
.wk-cell{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 2px;text-align:center;cursor:pointer;transition:all .2s;min-height:60px}
.wk-cell:hover{border-color:var(--accent)}
.wk-cell.today{border-color:var(--accent);box-shadow:0 0 10px rgba(255,107,53,.12)}
.wk-cell.past{opacity:.55}
.wk-cell.off{background:var(--card2);opacity:.4;cursor:default}
.wk-cell .wd{font-size:10px;color:var(--text2)}
.wk-cell .wt{font-size:14px;font-weight:700;margin:2px 0 1px}
.wk-cell .ws{font-size:9px;color:var(--text2)}
.hist-nav{display:flex;align-items:center;justify-content:space-between;padding:10px 0 4px;gap:8px}
.hist-nav .nav-btn{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:6px 14px;cursor:pointer;color:var(--text);font-size:13px;transition:all .15s;line-height:1}
.hist-nav .nav-btn:hover{border-color:var(--accent);color:var(--accent)}
.hist-nav .nav-btn:disabled{opacity:.3;cursor:default;border-color:var(--border);color:var(--text2)}
.hist-nav .nav-label{font-size:13px;font-weight:600;color:var(--text2);text-align:center;flex:1}
.hist-nav .nav-label span{color:var(--accent)}
.setup-banner{background:linear-gradient(135deg,rgba(255,107,53,.1),rgba(255,159,28,.08));border:1px solid rgba(255,107,53,.2);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;text-align:center}
.setup-banner .banner-title{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:2px}
.setup-banner .banner-text p{font-size:11px;color:var(--text2)}
.file-hid{display:none}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:10px 20px;font-size:12px;z-index:100;transition:transform .3s;box-shadow:0 6px 20px rgba(0,0,0,.4);white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
.mod-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);z-index:50;align-items:center;justify-content:center;padding:16px}
.mod-overlay.on{display:flex}
.mod{background:var(--card);border-radius:var(--radius);padding:20px;max-width:440px;width:100%;max-height:85vh;overflow-y:auto;border:1px solid var(--border)}
.mod h3{margin-bottom:4px;font-size:16px}
.mod .mod-desc{font-size:12px;color:var(--text2);margin-bottom:14px}
.stat-r{display:flex;gap:8px;margin-bottom:8px}
.stat-b{flex:1;text-align:center;padding:10px 6px;background:var(--card2);border-radius:8px}
.sv{font-size:16px;font-weight:700;color:var(--accent)}
.sl{font-size:10px;color:var(--text2);margin-top:2px}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:400px){
  .app{padding:12px 12px 50px}
  .hero-pred .time{font-size:42px}
  .wk-cell{min-height:52px}
}
.chart-container{width:100%;height:200px;margin-top:10px;position:relative}
.chart-canvas{width:100%;height:100%}
.chart-grid{stroke:var(--border);stroke-width:1;opacity:.3}
.chart-line{fill:none;stroke:var(--accent);stroke-width:2}
.chart-area{fill:url(#chartGradient);opacity:.3}
.chart-bar{fill:var(--accent);opacity:.7}
.chart-bar:hover{opacity:1}
.chart-point{fill:var(--accent);stroke:#fff;stroke-width:2}
.chart-label{font-size:10px;fill:var(--text2)}
.level-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600}
.level-0{background:rgba(148,152,173,.1);color:var(--text2);border:1px solid rgba(148,152,173,.2)}
.level-1{background:rgba(46,51,72,.2);color:#b8c5d6;border:1px solid rgba(72,149,239,.3)}
.level-2{background:rgba(72,149,239,.1);color:var(--blue);border:1px solid rgba(72,149,239,.3)}
.level-3{background:rgba(155,93,229,.1);color:var(--purple);border:1px solid rgba(155,93,229,.3)}
.level-4{background:rgba(255,159,28,.1);color:var(--accent2);border:1px solid rgba(255,159,28,.3)}
.level-5{background:rgba(46,196,182,.1);color:var(--green);border:1px solid rgba(46,196,182,.3)}
.corr-item{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;background:var(--card2);margin-bottom:6px}
.corr-date{font-size:12px;color:var(--text2);min-width:70px}
.corr-pred{font-size:13px;font-weight:600;color:var(--accent)}
.corr-actual{font-size:13px;font-weight:600;color:var(--green)}
.corr-diff{font-size:11px;padding:2px 6px;border-radius:4px}
.corr-diff.good{background:rgba(46,196,182,.1);color:var(--green)}
.corr-diff.bad{background:rgba(231,29,54,.1);color:var(--red)}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>老板今天几点走</h1>
    <p>科学预测 · 精准摸鱼</p>

<script>
// ========== 工具函数模块 ==========
function today(){return new Date().toISOString().slice(0,10)}
function parseD(s){const [y,m,d]=s.split('-');return new Date(y,parseInt(m)-1,parseInt(d))}
function t2m(t){const [h,m]=t.split(':');return parseInt(h)*60+parseInt(m)}
function m2t(m){const h=Math.floor(m/60),mn=m%60;return`${h.toString().padStart(2,'0')}:${mn.toString().padStart(2,'0')}`}
function dow(ds){return parseD(ds).getDay()||7}
function dn(d){return['日','一','二','三','四','五','六'][d%7]}
function wn(ds){const d=parseD(ds);const wd=new Date(d.getFullYear(),0,1);return Math.ceil((d-wd)/86400000/7)}
function wom(ds){const d=parseD(ds);return Math.ceil(d.getDate()/7)}
function fd(s){const d=parseD(s);return (d.getMonth()+1)+'/'+d.getDate()}
function avgTime(recs){
  if(!recs.length)return 0;
  return Math.round(recs.reduce((s,r)=>s+t2m(r.time),0)/recs.length);
}
function stdTime(recs){
  if(recs.length<2)return 0;
  const avg=avgTime(recs);
  const variance=recs.reduce((s,r)=>s+Math.pow(t2m(r.time)-avg,2),0)/(recs.length-1);
  return Math.sqrt(variance);
}
function medianTime(recs){
  if(!recs.length)return 0;
  const sorted=[...recs].map(r=>t2m(r.time)).sort((a,b)=>a-b);
  const mid=Math.floor(sorted.length/2);
  return sorted.length%2===0?Math.round((sorted[mid-1]+sorted[mid])/2):sorted[mid];
}
function linearRegression(recs){
  if(recs.length<2)return null;
  const sorted=[...recs].sort((a,b)=>a.date.localeCompare(b.date));
  const n=sorted.length;
  let sumX=0,sumY=0,sumXY=0,sumX2=0;
  sorted.forEach((r,i)=>{
    const x=i;const y=t2m(r.time);
    sumX+=x;sumY+=y;sumXY+=x*y;sumX2+=x*x;
  });
  const denom=n*sumX2-sumX*sumX;
  if(Math.abs(denom)<0.0001)return null;
  const slope=(n*sumXY-sumX*sumY)/denom;
  const intercept=(sumY-slope*sumX)/n;
  const r2=calcR2(sorted,slope,intercept);
  return {slope,intercept,prediction:Math.round(intercept+slope*(n)),r2};
}
function calcR2(recs,slope,intercept){
  const n=recs.length;
  const meanY=recs.reduce((s,r)=>s+t2m(r.time),0)/n;
  let ssTot=0,ssRes=0;
  recs.forEach((r,i)=>{
    const y=t2m(r.time);const yPred=intercept+slope*i;
    ssTot+=Math.pow(y-meanY,2);ssRes+=Math.pow(y-yPred,2);
  });
  return ssTot===0?1:1-ssRes/ssTot;
}
function kernelDensityEstimation(recs,bandwidth=20){
  if(recs.length<2)return [];
  const times=recs.map(r=>t2m(r.time));
  const minTime=Math.min(...times)-60;
  const maxTime=Math.max(...times)+60;
  const points=[];
  const step=5;
  for(let x=minTime;x<=maxTime;x+=step){
    let density=0;
    times.forEach(t=>{
      density+=Math.exp(-0.5*Math.pow((x-t)/bandwidth,2))/(bandwidth*Math.sqrt(2*Math.PI));
    });
    density/=times.length;
    points.push({time:x,density});
  }
  return points;
}
function detectModes(kdePoints){
  if(kdePoints.length<3)return [];
  const modes=[];
  for(let i=1;i<kdePoints.length-1;i++){
    if(kdePoints[i].density>kdePoints[i-1].density&&kdePoints[i].density>kdePoints[i+1].density){
      modes.push({time:kdePoints[i].time,density:kdePoints[i].density});
    }
  }
  modes.sort((a,b)=>b.density-a.density);
  return modes;
}

// ========== 数据层模块 ==========
const STORE_KEY='boss_time_db';
let DB=null;
let dbFileHandle=null;

const HOLIDAYS={
  '2026-01-01':'元旦','2026-01-29':'春节','2026-01-30':'春节','2026-01-31':'春节',
  '2026-02-01':'春节','2026-02-02':'春节','2026-02-03':'春节','2026-02-04':'春节',
  '2026-04-05':'清明节','2026-05-01':'劳动节','2026-05-02':'劳动节','2026-05-03':'劳动节',
  '2026-06-19':'端午节','2026-09-26':'中秋节',
  '2026-10-01':'国庆节','2026-10-02':'国庆节','2026-10-03':'国庆节','2026-10-04':'国庆节',
  '2026-10-05':'国庆节','2026-10-06':'国庆节','2026-10-07':'国庆节'
};

function isHoliday(ds){return HOLIDAYS[ds]||false;}
function getHolidayName(ds){return HOLIDAYS[ds]||'';}

function getDefaultAtt(){
  return {endTime:'18:00',workSystem:'5',flexEnabled:false,flexEarly:0,flexLate:0,overtimeDays:[],activityDays:[]};
}
function getAtt(){return DB.attendance||getDefaultAtt();}

function getDayOfWeek(ds){return parseD(ds).getDay()||7;}
function getWeekNum(ds){const d=parseD(ds);const wd=new Date(d.getFullYear(),0,1);return Math.ceil((d-wd)/86400000/7);}

function isWorkday(ds){
  if(isHoliday(ds))return false;
  const att=getAtt(),d=getDayOfWeek(ds);
  if(att.workSystem==='5')return d>=1&&d<=5;
  if(att.workSystem==='6')return d>=1&&d<=6;
  if(att.workSystem==='5b'||att.workSystem==='6b'){
    const par=getWeekNum(ds)%2;
    if(att.workSystem==='6b')return par===0?(d>=1&&d<=6):(d>=1&&d<=5);
    return par===0?(d>=1&&d<=5):(d===7?false:true);
  }
  return true;
}

function getBaseEndTime(ds){
  const att=getAtt();
  let base=t2m(att.endTime||'18:00');
  if(att.flexEnabled){
    if(att.flexEarly)base-=att.flexEarly;
    if(att.flexLate)base+=att.flexLate;
  }
  return base;
}

function isOvertimeDay(ds){
  const att=getAtt(),d=getDayOfWeek(ds);
  return (att.overtimeDays||[]).includes(d);
}

function isActivityDay(ds){
  const att=getAtt(),d=getDayOfWeek(ds);
  return (att.activityDays||[]).includes(d);
}

function allRecs(){return DB.records;}
function allRules(){return DB.rules;}
function recByDate(d){return DB.records.find(r=>r.date===d)||null;}

function ruleByDate(ds){
  const dv=getDayOfWeek(ds),wv=Math.ceil(parseD(ds).getDate()/7),dayVal=parseD(ds).getDate();
  return DB.rules.find(r=>{
    if(r.type==='dayOfMonth'&&dayVal===r.dayOfMonth)return true;
    if(r.type==='weekOfMonth'&&r.dayOfWeek===dv&&(r.weekOfMonth===0||r.weekOfMonth===wv))return true;
    if(r.type==='weekOfYear'){
      const wNum=getWeekNum(ds),wFromStart=Math.ceil(dayVal/7);
      return r.dayOfWeek===dv&&(r.weekOfMonth===0||r.weekOfMonth===wFromStart||r.weekOfMonth===wNum);
    }
    return r.dayOfWeek===dv&&(r.weekOfMonth===0||r.weekOfMonth===wv);
  })||null;
}

// ========== 预测引擎模块 ==========
function predict(ds,preTags){
  const d=dow(ds),w=wom(ds);
  const weights=DB.weights;
  const rule=ruleByDate(ds);
  if(rule)return{time:rule.time,conf:95,factors:[{name:'自定义规则',eff:'hit',desc:rule.desc||`${rule.time}固定模式`}],src:'rule',modes:[]};

  const baseMin=getBaseEndTime(ds);
  let comps=[];

  const sameDay=DB.records.filter(r=>dow(r.date)===d);
  if(sameDay.length){
    const sameDayStd=stdTime(sameDay);
    const sameDayMed=medianTime(sameDay);
    const useMedian=sameDayStd>30&&sameDay.length>=3;
    comps.push({key:'sameWeekday',val:useMedian?sameDayMed:avgTime(sameDay),w:weights.sameWeekday,label:'同星期'+(useMedian?'中位数':'均值'),n:sameDay.length,std:sameDayStd});
  }

  const womRecs=DB.records.filter(r=>dow(r.date)===d&&wom(r.date)===w);
  if(womRecs.length){
    const womStd=stdTime(womRecs);
    const womMed=medianTime(womRecs);
    const useMedian=womStd>25&&womRecs.length>=3;
    comps.push({key:'weekOfMonth',val:useMedian?womMed:avgTime(womRecs),w:weights.weekOfMonth,label:'同月同周'+(useMedian?'中位数':'均值'),n:womRecs.length,std:womStd});
  }

  const recent=[...DB.records].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,7);
  if(recent.length>=2){
    let ts=0,div=0;
    recent.forEach((r,i)=>{const f=1-i*.1;ts+=t2m(r.time)*f;div+=f;});
    comps.push({key:'recentTrend',val:Math.round(ts/div),w:weights.recentTrend,label:'近期趋势',n:recent.length});
  }

  const lrResult=linearRegression(DB.records);
  if(lrResult&&lrResult.r2>=0.3&&DB.records.length>=5){
    comps.push({key:'linearTrend',val:lrResult.prediction,w:weights.linearTrend||0.15,label:'线性趋势',n:DB.records.length,r2:lrResult.r2});
  }

  const par=wn(ds)%2;
  const bi=DB.records.filter(r=>wn(r.date)%2===par);
  if(bi.length>=2){
    const biStd=stdTime(bi);
    const biMed=medianTime(bi);
    const useMedian=biStd>25&&bi.length>=3;
    comps.push({key:'biweekly',val:useMedian?biMed:avgTime(bi),w:weights.biweekly,label:(par?'双周':'单周')+'模式'+(useMedian?'中位数':'均值'),n:bi.length,std:biStd});
  }

  if(preTags&&preTags.length){
    const tagRecs=DB.records.filter(r=>r.tags&&r.tags.some(t=>preTags.includes(t)));
    if(tagRecs.length)comps.push({key:'tagInfluence',val:avgTime(tagRecs),w:weights.tagInfluence,label:preTags.join('+'),n:tagRecs.length});
  }

  const extras=[];
  if(isOvertimeDay(ds))extras.push({name:'固定加班日',eff:'up'});
  if(isActivityDay(ds))extras.push({name:'活动日',eff:'down'});
  if(d===5)extras.push({name:'周五效应',eff:'down'});
  if(isME(ds))extras.push({name:'月末效应',eff:'up'});
  if(isQE(ds))extras.push({name:'季末冲刺',eff:'up'});
  if(d===1)extras.push({name:'周一综合征',eff:'up'});
  if(preTags&&preTags.includes('节前'))extras.push({name:'节前效应',eff:'down'});
  if(preTags&&preTags.includes('应酬'))extras.push({name:'应酬效应',eff:'down'});

  if(!comps.length){
    let predMin=baseMin;
    extras.forEach(f=>{if(f.eff==='down')predMin-=15;if(f.eff==='up')predMin+=20;});
    predMin=Math.max(predMin,baseMin);
    return{time:m2t(predMin),conf:15,factors:extras.length?extras:[{name:'基准时间',eff:'none'}],src:'default',modes:[]};
  }

  let tw=0,ws=0;
  comps.forEach(c=>{ws+=c.val*c.w;tw+=c.w;});
  let predMin=Math.round(ws/tw);

  const totalRecs=comps.reduce((s,c)=>s+c.n,0);
  if(totalRecs<5){
    const blend=0.3+totalRecs*0.14;
    predMin=Math.round(predMin*blend+baseMin*(1-blend));
  }

  extras.forEach(f=>{if(f.eff==='down')predMin-=15;if(f.eff==='up')predMin+=20;});

  const hasEarlyRecs=DB.records.some(r=>t2m(r.time)<baseMin);
  if(!hasEarlyRecs)predMin=Math.max(predMin,baseMin);

  let conf=Math.min(95,Math.round(20+totalRecs*5+comps.length*8));

  const overallStd=stdTime(DB.records);
  if(overallStd>45)conf=Math.max(20,conf-15);
  else if(overallStd>30)conf=Math.max(25,conf-8);
  else if(overallStd<=15)conf=Math.min(95,conf+5);

  const compsWithStd=comps.filter(c=>c.std);
  if(compsWithStd.length){
    const avgStd=compsWithStd.reduce((s,c)=>s+c.std,0)/compsWithStd.length;
    if(avgStd>30)conf=Math.max(20,conf-5);
  }

  if(extras.length)conf=Math.min(95,conf+5);
  if(totalRecs<3)conf=Math.min(conf,40);

  conf=calibrateConfidence(conf,overallStd);

  const kdePoints=kernelDensityEstimation(DB.records);
  const modes=detectModes(kdePoints).slice(0,3).map(m=>({time:m2t(m.time),density:m.density}));

  const factors=comps.map(c=>{
    let desc=`基于${c.n}条`;
    if(c.std)desc+=` · 波动${Math.round(c.std)}min`;
    if(c.r2)desc+=` · R²=${c.r2.toFixed(2)}`;
    return{name:c.label,eff:c.val>predMin?'up':'down',desc};
  }).concat(extras);

  return{time:m2t(predMin),conf,factors,src:'calculated',overallStd:Math.round(overallStd),modes};
}

function calibrateConfidence(rawConf,std){
  const calibration={
    15:10,20:12,25:15,30:18,35:22,40:28,
    45:35,50:42,55:50,60:58,65:65,70:72,
    75:78,80:83,85:87,90:91,95:94
  };
  if(std>45){
    const penalty=Math.round((std-45)/10)*3;
    return Math.max(10,calibration[rawConf]||rawConf-penalty);
  }else if(std<=15){
    return Math.min(95,(calibration[rawConf]||rawConf)+3);
  }
  return calibration[rawConf]||rawConf;
}

function isME(ds){const d=parseInt(ds.split('-')[2]);return d>=26;}
function isQE(ds){const m=parseInt(ds.split('-')[1]);return(m===3||m===6||m===9||m===12)&&isME(ds);}

function updateAdaptiveWeights(){
  if(DB.records.length<10)return;
  const sorted=[...DB.records].sort((a,b)=>a.date.localeCompare(b.date));
  const weights=DB.weights;
  const newWeights={...weights};
  const dimensionErrors={};
  const dims=['sameWeekday','weekOfMonth','recentTrend','linearTrend','biweekly','tagInfluence'];
  dims.forEach(dim=>{dimensionErrors[dim]=[];});

  for(let i=5;i<sorted.length;i++){
    const trainData=sorted.slice(0,i);
    const testRec=sorted[i];
    const testTags=testRec.tags||[];
    dims.forEach(dim=>{
      const pred=predictUsingSingleDimension(trainData,dim,testRec.date,testTags);
      if(pred){
        const error=Math.abs(t2m(pred)-t2m(testRec.time));
        dimensionErrors[dim].push(error);
      }
    });
  }

  dims.forEach(dim=>{
    if(dimensionErrors[dim].length>0){
      const avgErr=dimensionErrors[dim].reduce((s,e)=>s+e,0)/dimensionErrors[dim].length;
      const quality=Math.max(0.1,1-avgErr/60);
      newWeights[dim]=Math.max(0.05,Math.min(0.4,weights[dim]*quality));
    }
  });

  const totalWeight=Object.values(newWeights).reduce((s,w)=>s+w,0);
  Object.keys(newWeights).forEach(k=>{
    newWeights[k]=newWeights[k]/totalWeight;
  });

  DB.weights=newWeights;
}

function predictUsingSingleDimension(records,dim,ds,tags){
  const d=dow(ds),w=wom(ds);
  const par=wn(ds)%2;
  switch(dim){
    case 'sameWeekday':{
      const recs=records.filter(r=>dow(r.date)===d);
      return recs.length?m2t(avgTime(recs)):null;
    }
    case 'weekOfMonth':{
      const recs=records.filter(r=>dow(r.date)===d&&wom(r.date)===w);
      return recs.length?m2t(avgTime(recs)):null;
    }
    case 'recentTrend':{
      const recent=[...records].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,7);
      if(recent.length<2)return null;
      let ts=0,div=0;
      recent.forEach((r,i)=>{const f=1-i*.1;ts+=t2m(r.time)*f;div+=f;});
      return m2t(Math.round(ts/div));
    }
    case 'linearTrend':{
      const lr=linearRegression(records);
      return lr&&lr.r2>=0.3?m2t(Math.round(lr.intercept+lr.slope*records.length)):null;
    }
    case 'biweekly':{
      const recs=records.filter(r=>wn(r.date)%2===par);
      return recs.length>=2?m2t(avgTime(recs)):null;
    }
    case 'tagInfluence':{
      if(!tags||!tags.length)return null;
      const recs=records.filter(r=>r.tags&&r.tags.some(t=>tags.includes(t)));
      return recs.length?m2t(avgTime(recs)):null;
    }
    default:return null;
  }
}

function getModeAnalysis(){
  const kdePoints=kernelDensityEstimation(DB.records);
  const modes=detectModes(kdePoints);
  return modes.slice(0,3).map(m=>({
    time:m2t(m.time),density:m.density,
    count:DB.records.filter(r=>Math.abs(t2m(r.time)-m.time)<=15).length
  }));
}

function getWeekDays(w){
  const days=[];
  const d=new Date();
  const diff=d.getDay()||7;
  const monday=new Date(d);
  monday.setDate(d.getDate()-diff+1);
  monday.setDate(monday.getDate()+(w-wn(today()))*7);
  for(let i=0;i<7;i++){
    const day=new Date(monday);
    day.setDate(monday.getDate()+i);
    days.push(day.toISOString().slice(0,10));
  }
  return days;
}

function renderHome(){
  const d=today();
  document.getElementById('todayDate').textContent=d+' 周'+dn(dow(d));

  if(!isWorkday(d)){
    const holiday=getHolidayName(d);
    const restPhrases=[
      '卷不动了，今天休息！','休息日兄弟，出去走走吧',
      holiday?`${holiday}快乐！`:'周末愉快，老板也下班了',
      '今天不上班，躺平吧','休息日=法定摸鱼日','出门晒晒太阳吧',
      '打工人也要充电呀','今天是快乐星球，没有老板',
      '休息日的你，闪闪发光','别卷了，睡个懒觉先',
      '周末快乐，去玩！','今天不预测，只负责开心',
      '休息日=充电日','老板今天也不上班','放下工作，拥抱生活'
    ];
    document.getElementById('todayTime').textContent=holiday?'节假日':'休息中';
    document.getElementById('confFill').style.width='0%';
    document.getElementById('confText').textContent=holiday?'节假日':'休息日';
    document.getElementById('factorTags').innerHTML=`<span class="factor-tag">${holiday||'休息日'}</span>`;
    const stdEl=document.getElementById('predStd');
    stdEl.style.display='none';
    document.getElementById('funPhrase').textContent=restPhrases[Math.floor(Math.random()*restPhrases.length)];
    document.getElementById('corrCard').style.display='none';
    document.getElementById('modeCard').style.display='none';
    document.getElementById('trendCard').style.display='none';
    document.getElementById('histCard').style.display='none';
    renderLevel();
    return;
  }

  const p=predict(d);
  document.getElementById('todayTime').textContent=p.time;
  document.getElementById('confFill').style.width=p.conf+'%';
  document.getElementById('confText').textContent=p.conf+'%';
  document.getElementById('factorTags').innerHTML=p.factors.map(f=>`<span class="factor-tag">${f.name}</span>`).join('');

  const stdEl=document.getElementById('predStd');
  if(p.overallStd){
    stdEl.style.display='block';
    stdEl.textContent=`波动程度 ${p.overallStd<=15?'稳定':p.overallStd<=30?'一般':'较大'}`;
  }else{
    stdEl.style.display='none';
  }

  const tm=t2m(p.time);
  const base=getBaseEndTime(d);
  let k='unknown';
  if(p.src!=='default')k=tm<base-30?'early':tm<base+30?'normal':'late';
  const arr=FUN[k];
  document.getElementById('funPhrase').textContent=arr[Math.floor(Math.random()*arr.length)];

  renderCorr();
  renderModes();
  renderLevel();
}

function renderCorr(){
  const card=document.getElementById('corrCard');
  const body=document.getElementById('corrBody');
  let html='';
  for(let i=1;i<=3;i++){
    const dd=new Date();dd.setDate(dd.getDate()-i);
    const s=dd.toISOString().slice(0,10);
    const r=recByDate(s);
    if(r){
      const pr=predict(s,r.tags||[]);
      const diff=Math.abs(t2m(r.time)-t2m(pr.time));
      if(diff>15){
        html+=`<div class="corr-item"><div class="corr-date">${fd(s)}</div><div class="corr-pred">预测${pr.time}</div><div class="corr-actual">实际${r.time}</div><div class="corr-diff bad">误差${diff}min</div></div>`;
      }else{
        html+=`<div class="corr-item"><div class="corr-date">${fd(s)}</div><div class="corr-pred">预测${pr.time}</div><div class="corr-actual">实际${r.time}</div><div class="corr-diff good">准确</div></div>`;
      }
    }
  }
  card.style.display=html?'block':'none';
  body.innerHTML=html;
}

function renderModes(){
  const modes=getModeAnalysis();
  const card=document.getElementById('modeCard');
  const body=document.getElementById('modeBody');
  if(modes.length<2){
    card.style.display='none';
    return;
  }
  card.style.display='block';
  let html='';
  modes.forEach((m,i)=>{
    html+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px solid var(--border);${i===modes.length-1?'border-bottom:none':''}"><span>${m.time}</span><span style="font-size:12px;color:var(--text2)">出现${m.count}次</span></div>`;
  });
  body.innerHTML=html;
}

function renderLevel(){
  const total=allRecs().length;
  const level=LEVELS.find((l,i)=>total>=l.threshold&&(i===LEVELS.length-1||total<LEVELS[i+1].threshold))||LEVELS[0];
  document.getElementById('userLevel').innerHTML=`<span class="level-badge ${level.color}">${level.name}</span>`;
}

function renderWeek(){
  const days=getWeekDays(wn(today()));
  const html=days.map(d=>{
    const r=recByDate(d);
    const isToday=d===today();
    const isPast=parseD(d)<parseD(today());
    const isOff=!isWorkday(d);
    const pr=r?null:isWorkday(d)?predict(d):null;
    return `<div class="wk-cell ${isToday?'today':''} ${isPast?'past':''} ${isOff?'off':''}" onclick="${!isPast&&!isOff?'openRecordModal(\''+d+'\')':''}">
      <div class="wd">周${dn(dow(d))}</div>
      <div class="wt">${parseD(d).getDate()}</div>
      <div class="ws">${r?r.time:pr?pr.time:''}</div>
    </div>`;
  }).join('');
  document.getElementById('weekGrid').innerHTML=html;
}

function renderHistory(){
  const days=getWeekDays(curHistWeek);
  const html=days.map(d=>{
    const r=recByDate(d);
    const isOff=!isWorkday(d);
    return `<div class="wk-cell ${isOff?'off':''}">
      <div class="wd">周${dn(dow(d))}</div>
      <div class="wt">${parseD(d).getDate()}</div>
      <div class="ws">${r?r.time:''}</div>
    </div>`;
  }).join('');
  document.getElementById('histGrid').innerHTML=html;
  document.getElementById('histWeek').textContent=`第${curHistWeek}周`;
  document.getElementById('prevBtn').disabled=curHistWeek<=1;
  document.getElementById('nextBtn').disabled=curHistWeek>=wn(today());
}

function renderSettings(){
  renderAttConfig();
  renderStats();
}

function renderAttConfig(){
  const att=getAtt();
  const html=`
    <div class="card-title">⚙️ 考勤配置</div>
    <div class="form-group">
      <label class="form-label">标准下班时间</label>
      <input type="time" class="form-input" id="cfgEndTime" value="${att.endTime}">
    </div>
    <div class="form-group">
      <label class="form-label">工作制度</label>
      <select class="form-input" id="cfgWorkSys">
        <option value="5" ${att.workSystem==='5'?'selected':''}>每周5天（周一至周五）</option>
        <option value="6" ${att.workSystem==='6'?'selected':''}>每周6天（周一至周六）</option>
        <option value="6b" ${att.workSystem==='6b'?'selected':''}>大小周（大周6天，小周5天）</option>
        <option value="5b" ${att.workSystem==='5b'?'selected':''}>大小周（大周5天，小周4天）</option>
        <option value="1" ${att.workSystem==='1'?'selected':''}>单休（周日休息）</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">弹性工时</label>
      <div class="form-row">
        <input type="checkbox" id="cfgFlex" ${att.flexEnabled?'checked':''} onchange="toggleFlex()">
        <label for="cfgFlex" style="font-size:12px;color:var(--text2)">启用弹性工时</label>
      </div>
    </div>
    <div id="flexSettings" style="display:${att.flexEnabled?'block':'none'}">
      <div class="form-group">
        <label class="form-label">提前下班（分钟）</label>
        <input type="number" class="form-input" id="cfgFlexEarly" value="${att.flexEarly||0}" min="0" max="120">
      </div>
      <div class="form-group">
        <label class="form-label">延后下班（分钟）</label>
        <input type="number" class="form-input" id="cfgFlexLate" value="${att.flexLate||0}" min="0" max="120">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">固定加班日</label>
      <div class="tag-sel">
        ${[1,2,3,4,5,6,7].map(d=>`<span class="tag-opt ${(att.overtimeDays||[]).includes(d)?'on':''}" onclick="toggleOvertime(${d})">周${dn(d)}</span>`).join('')}
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">活动日/家庭日</label>
      <div class="tag-sel">
        ${[1,2,3,4,5,6,7].map(d=>`<span class="tag-opt ${(att.activityDays||[]).includes(d)?'on':''}" onclick="toggleActivity(${d})">周${dn(d)}</span>`).join('')}
      </div>
    </div>
    <button class="btn btn-pri btn-blk" onclick="saveAtt()">保存配置</button>
    <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
      <div class="card-title">📋 自定义规则</div>
      <div id="ruleList"></div>
      <button class="btn btn-sec btn-blk" onclick="openRuleModal()" style="margin-top:8px">➕ 添加规则</button>
    </div>
  `;
  document.getElementById('attConfigCard').innerHTML=html;
  renderRuleList();
}

function toggleFlex(){
  const el=document.getElementById('flexSettings');
  el.style.display=document.getElementById('cfgFlex').checked?'block':'none';
}

function toggleOvertime(d){
  const att=getAtt();
  const idx=att.overtimeDays.indexOf(d);
  if(idx>=0)att.overtimeDays.splice(idx,1);
  else att.overtimeDays.push(d);
  saveDB();
}

function toggleActivity(d){
  const att=getAtt();
  const idx=att.activityDays.indexOf(d);
  if(idx>=0)att.activityDays.splice(idx,1);
  else att.activityDays.push(d);
  saveDB();
}

function saveAtt(){
  const att=getAtt();
  att.endTime=document.getElementById('cfgEndTime').value;
  att.workSystem=document.getElementById('cfgWorkSys').value;
  att.flexEnabled=document.getElementById('cfgFlex').checked;
  att.flexEarly=parseInt(document.getElementById('cfgFlexEarly').value)||0;
  att.flexLate=parseInt(document.getElementById('cfgFlexLate').value)||0;
  att._setupDone=true;
  saveDB();refreshAll();
  toast('✅ 配置已保存');
}

function renderRuleList(){
  const rules=allRules();
  const html=rules.length?rules.map((r,i)=>{
    let desc='';
    if(r.type==='dayOfMonth')desc=`每月${r.dayOfMonth}号 ${r.time}`;
    else if(r.type==='weekOfMonth')desc=`${r.weekOfMonth?'每月第'+r.weekOfMonth+'周':'每周'}周${dn(r.dayOfWeek)} ${r.time}`;
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)">
      <span style="font-size:12px">${desc}${r.desc?' · '+r.desc:''}</span>
      <button class="btn btn-sec btn-sm" onclick="delRule(${i})">删除</button>
    </div>`;
  }).join(''):'<p style="font-size:12px;color:var(--text2)">暂无规则</p>';
  document.getElementById('ruleList').innerHTML=html;
}

function renderStats(){
  const recs=allRecs();
  document.getElementById('stTotal').textContent=recs.length;
  if(recs.length){
    const times=recs.map(r=>t2m(r.time));
    const avg=Math.round(times.reduce((s,t)=>s+t,0)/times.length);
    const min=Math.min(...times);
    const max=Math.max(...times);
    document.getElementById('stAvg').textContent=m2t(avg);
    document.getElementById('stEar').textContent=m2t(min);
    document.getElementById('stLat').textContent=m2t(max);
    let accurate=0;
    let streak=0,maxStreak=0;
    recs.forEach(r=>{
      const pr=predict(r.date,r.tags||[]);
      const diff=Math.abs(t2m(r.time)-t2m(pr.time));
      if(diff<=30){accurate++;streak++;maxStreak=Math.max(maxStreak,streak);}
      else{streak=0;}
    });
    document.getElementById('stAcc').textContent=Math.round(accurate/recs.length*100)+'%';
    document.getElementById('stStr').textContent=maxStreak;
  }else{
    document.getElementById('stAcc').textContent='--';
    document.getElementById('stAvg').textContent='--';
    document.getElementById('stEar').textContent='--';
    document.getElementById('stLat').textContent='--';
    document.getElementById('stStr').textContent='0';
  }
}

function finishWizard(){
  const att=getAtt();
  att.endTime=document.getElementById('wizTime').value;
  att.workSystem=document.getElementById('wizSys').value;
  att._setupDone=true;
  saveDB();
  closeSetupModal();
  refreshAll();
}

function closeSetupModal(){
  document.getElementById('setupModal').classList.remove('on');
}

function refreshAll(){
  renderHome();
  renderWeek();
  renderHistory();
  renderSettings();
}

// ========== 初始化 ==========
(function(){
  loadDB().then(()=>{
    refreshAll();
    if(!getAtt()._setupDone){
      setTimeout(()=>{
        const el=document.getElementById('setupModContent');
        el.innerHTML=`<h3>👋 欢迎使用"老板今天几点走"</h3>
          <p class="mod-desc">先花1分钟配置单位考勤信息，预测会更准确。也可以稍后在"⚙️ 设置"页面设置。</p>
          <div class="form-group">

              <option value="5b">大小周（大周5天，小周4天）</option>
