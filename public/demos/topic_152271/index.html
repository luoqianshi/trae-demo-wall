<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>诗轴画布·唐诗流转</title>
  <style>
    :root {
      --bg: #0f0c08;
      --bg-soft: #16110b;
      --paper: #f5f0e0;
      --paper-shadow: #ded4bb;
      --gold: #d7ad5d;
      --gold-strong: #f0d08c;
      --gold-dim: rgba(215, 173, 93, 0.28);
      --ink: #2f2113;
      --ink-soft: #5a4730;
      --mist: rgba(255, 242, 220, 0.08);
      --hud: rgba(22, 17, 11, 0.74);
      --hud-border: rgba(215, 173, 93, 0.22);
      --card-width: 118px;
      --card-height: 166px;
      --open-height: 420px;
      --transition: 800ms ease;
      --font-serif: "STKaiti", "Kaiti SC", "KaiTi", "Songti SC", "SimSun", serif;
      --font-ui: "Songti SC", "STSong", "Noto Serif SC", serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: #f8ead0;
      font-family: var(--font-ui);
    }

    body {
      position: relative;
      background:
        radial-gradient(circle at 20% 20%, rgba(215, 173, 93, 0.08), transparent 30%),
        radial-gradient(circle at 80% 28%, rgba(255, 255, 255, 0.06), transparent 24%),
        radial-gradient(circle at 60% 80%, rgba(215, 173, 93, 0.06), transparent 36%),
        linear-gradient(180deg, #100d08 0%, #0b0906 100%);
    }

    body::before,
    body::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      background-image:
        radial-gradient(circle at 15% 25%, rgba(255, 248, 230, 0.55) 0 1px, transparent 1px),
        radial-gradient(circle at 25% 65%, rgba(215, 173, 93, 0.5) 0 1px, transparent 1px),
        radial-gradient(circle at 72% 32%, rgba(255, 248, 230, 0.42) 0 1px, transparent 1px),
        radial-gradient(circle at 83% 73%, rgba(215, 173, 93, 0.5) 0 1px, transparent 1px),
        radial-gradient(circle at 44% 14%, rgba(255, 248, 230, 0.4) 0 1px, transparent 1px),
        radial-gradient(circle at 58% 57%, rgba(255, 248, 230, 0.35) 0 1px, transparent 1px);
      opacity: 0.5;
    }

    body::after {
      background:
        radial-gradient(circle at center, transparent 0%, rgba(0, 0, 0, 0.3) 70%, rgba(0, 0, 0, 0.58) 100%);
      mix-blend-mode: multiply;
    }

    #particleCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.9;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      perspective: 1200px;
      perspective-origin: 50% 48%;
      overflow: hidden;
    }

    .constellation {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.9;
      overflow: visible;
    }

    .constellation line {
      stroke-linecap: round;
      transition:
        stroke 280ms ease,
        stroke-opacity 280ms ease,
        stroke-width 280ms ease;
    }

    .world {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
      z-index: 2;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .scroll-card {
      position: absolute;
      width: var(--card-width);
      height: var(--card-height);
      margin-left: calc(var(--card-width) / -2);
      margin-top: calc(var(--card-height) / -2);
      transform-style: preserve-3d;
      transition:
        transform var(--transition),
        filter 400ms ease,
        opacity 400ms ease,
        box-shadow 400ms ease;
      cursor: pointer;
      opacity: var(--base-opacity, 0.96);
      transform-origin: center center;
    }

    .scroll-card::before,
    .scroll-card::after {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(90deg, #6a4b18, var(--gold-strong), #6a4b18);
      box-shadow: 0 0 18px rgba(215, 173, 93, 0.24);
      z-index: 4;
    }

    .scroll-card::before {
      top: 6px;
    }

    .scroll-card::after {
      bottom: 6px;
    }

    .scroll-rod {
      position: absolute;
      top: 10px;
      bottom: 10px;
      width: 8px;
      border-radius: 999px;
      background: linear-gradient(180deg, #805b25, #d4a24b 50%, #6d4918);
      box-shadow: inset 0 0 0 1px rgba(60, 30, 10, 0.35), 0 0 18px rgba(215, 173, 93, 0.15);
      z-index: 3;
    }

    .scroll-rod.left {
      left: 5px;
    }

    .scroll-rod.right {
      right: 5px;
    }

    .scroll-shell {
      position: absolute;
      inset: 12px;
      border-radius: 14px;
      border: 1px solid rgba(104, 73, 28, 0.5);
      background:
        linear-gradient(180deg, rgba(255, 250, 241, 0.1), rgba(0, 0, 0, 0.12)),
        linear-gradient(135deg, rgba(245, 240, 224, 0.2), rgba(245, 240, 224, 0.05));
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.05),
        0 24px 36px rgba(0, 0, 0, 0.34);
      overflow: visible;
      backdrop-filter: blur(3px);
    }

    .scroll-paper {
      position: absolute;
      left: 8px;
      right: 8px;
      top: 6px;
      bottom: 6px;
      border-radius: 10px;
      background:
        radial-gradient(circle at 16% 12%, rgba(255, 255, 255, 0.66), transparent 18%),
        repeating-linear-gradient(
          180deg,
          rgba(143, 110, 53, 0.05) 0 1px,
          rgba(245, 240, 224, 0.92) 1px 8px
        ),
        linear-gradient(180deg, #faf5e9 0%, var(--paper) 100%);
      border: 1px solid rgba(194, 158, 90, 0.45);
      color: var(--ink);
      box-shadow:
        inset 0 0 26px rgba(161, 126, 63, 0.12),
        inset 0 0 0 1px rgba(255, 255, 255, 0.45);
      overflow: hidden;
    }

    .scroll-paper::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 70% 20%, rgba(255, 255, 255, 0.45), transparent 16%),
        radial-gradient(circle at 24% 76%, rgba(175, 125, 52, 0.12), transparent 20%);
      opacity: 0.8;
      pointer-events: none;
    }

    .scroll-ribbon {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 24px;
      height: 94px;
      transform: translate(-50%, -50%);
      border-radius: 999px;
      background: linear-gradient(180deg, #5d240d, #8d3416 35%, #622410);
      box-shadow:
        inset 0 0 0 1px rgba(255, 208, 146, 0.15),
        0 12px 24px rgba(0, 0, 0, 0.28);
      z-index: 5;
      transition:
        transform 520ms ease,
        background 500ms ease,
        box-shadow 500ms ease,
        opacity 400ms ease,
        filter 400ms ease;
    }

    .ribbon-knot,
    .ribbon-thread {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      transition:
        transform 520ms ease,
        opacity 420ms ease,
        filter 420ms ease;
    }

    .ribbon-knot {
      width: 18px;
      height: 9px;
      border-radius: 999px;
      background: linear-gradient(90deg, #c4a168, #f2dfaa, #c4a168);
      box-shadow: 0 0 10px rgba(242, 223, 170, 0.18);
    }

    .ribbon-knot-top {
      top: 12px;
    }

    .ribbon-knot-bottom {
      bottom: 12px;
    }

    .ribbon-thread {
      width: 3px;
      height: 42px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(222, 183, 101, 0.95), rgba(140, 82, 26, 0.95));
      box-shadow: 0 0 12px rgba(242, 223, 170, 0.18);
      top: 50%;
      transform-origin: 50% 6px;
    }

    .ribbon-thread-left {
      transform: translate(-50%, -50%) rotate(18deg);
    }

    .ribbon-thread-right {
      transform: translate(-50%, -50%) rotate(-18deg);
    }

    .scroll-card.is-visited .scroll-ribbon {
      background: linear-gradient(180deg, #8b6a1f, #f0c977 40%, #9a7320);
      box-shadow:
        inset 0 0 0 1px rgba(255, 251, 227, 0.28),
        0 0 22px rgba(240, 201, 119, 0.3);
    }

    .card-front {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px 10px;
      pointer-events: none;
    }

    .front-inner {
      display: flex;
      flex-direction: column;
      gap: 9px;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 12px 10px;
      border-radius: 10px;
      border: 1px solid rgba(194, 158, 90, 0.28);
      background: linear-gradient(180deg, rgba(245, 240, 224, 0.74), rgba(245, 240, 224, 0.58));
      backdrop-filter: blur(2px);
    }

    .front-title {
      font-size: 18px;
      letter-spacing: 3px;
      color: var(--ink);
      font-family: var(--font-serif);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .front-author {
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--ink-soft);
    }

    .front-group {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 999px;
      color: #6d4e20;
      border: 1px solid rgba(194, 158, 90, 0.34);
      background: rgba(255, 249, 232, 0.52);
    }

    .scroll-card.is-open {
      z-index: 300;
    }

    .scroll-card.is-untying {
      z-index: 260;
    }

    .scroll-card.is-untying .scroll-ribbon {
      transform: translate(-50%, -50%) scaleY(0.2);
      opacity: 0.2;
      filter: blur(1px);
    }

    .scroll-card.is-untying .ribbon-knot-top {
      transform: translate(-50%, -20px) scale(1.08);
      filter: drop-shadow(0 0 8px rgba(255, 226, 170, 0.42));
    }

    .scroll-card.is-untying .ribbon-knot-bottom {
      transform: translate(-50%, 20px) scale(1.08);
      filter: drop-shadow(0 0 8px rgba(255, 226, 170, 0.42));
    }

    .scroll-card.is-untying .ribbon-thread-left {
      transform: translate(-52px, -16px) rotate(54deg);
      opacity: 0.32;
    }

    .scroll-card.is-untying .ribbon-thread-right {
      transform: translate(18px, -16px) rotate(-54deg);
      opacity: 0.32;
    }

    .scroll-card.is-open .scroll-ribbon,
    .scroll-card.is-open .card-front {
      opacity: 0.2;
    }

    .scroll-card.is-open .ribbon-thread,
    .scroll-card.is-open .ribbon-knot {
      opacity: 0;
    }

    .page-overlay {
      position: fixed;
      inset: 0;
      z-index: 120;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      background: radial-gradient(circle at center, rgba(20, 14, 8, 0.34), rgba(9, 8, 6, 0.72));
      opacity: 0;
      pointer-events: none;
      transition: opacity 320ms ease;
      backdrop-filter: blur(10px);
    }

    .page-overlay.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .page-stage {
      position: relative;
      width: min(860px, 86vw);
      min-height: min(620px, 80vh);
      transform: translateY(26px) scale(0.94);
      transition: transform 680ms cubic-bezier(0.2, 0.8, 0.15, 1);
      filter: drop-shadow(0 28px 42px rgba(0, 0, 0, 0.34));
    }

    .page-overlay.is-visible .page-stage {
      transform: translateY(0) scale(1);
    }

    .page-roller {
      position: absolute;
      left: 50%;
      width: calc(100% - 48px);
      height: 16px;
      border-radius: 999px;
      transform: translateX(-50%);
      background: linear-gradient(90deg, #6e4818, var(--gold-strong), #6e4818);
      box-shadow: 0 0 18px rgba(215, 173, 93, 0.28);
      z-index: 3;
    }

    .page-roller.top {
      top: 12px;
    }

    .page-roller.bottom {
      bottom: 12px;
    }

    .page-canvas {
      position: absolute;
      inset: 24px;
      border-radius: 24px;
      border: 1px solid rgba(194, 158, 90, 0.54);
      background:
        radial-gradient(circle at 25% 16%, rgba(255, 255, 255, 0.6), transparent 18%),
        repeating-linear-gradient(
          180deg,
          rgba(166, 128, 61, 0.05) 0 1px,
          rgba(245, 240, 224, 0.98) 1px 10px
        ),
        linear-gradient(180deg, #faf6eb 0%, var(--paper) 100%);
      color: var(--ink);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.45),
        inset 0 0 34px rgba(156, 121, 65, 0.14);
      overflow: hidden;
      transform-origin: center top;
      transform: scaleY(0.02);
      opacity: 0;
      transition:
        transform 760ms cubic-bezier(0.2, 0.8, 0.15, 1),
        opacity 300ms ease;
    }

    .page-overlay.is-visible .page-canvas {
      transform: scaleY(1);
      opacity: 1;
    }

    .page-canvas::before,
    .page-canvas::after {
      content: "";
      position: absolute;
      left: 14px;
      right: 14px;
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, #815821, var(--gold-strong), #815821);
      box-shadow: 0 0 14px rgba(215, 173, 93, 0.28);
    }

    .page-canvas::before {
      top: 10px;
    }

    .page-canvas::after {
      bottom: 10px;
    }

    .page-header {
      position: absolute;
      left: 26px;
      right: 26px;
      top: 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      z-index: 2;
    }

    .page-header .tag {
      font-size: 12px;
      letter-spacing: 2px;
      padding: 6px 10px;
      border-radius: 999px;
      color: #6e4e22;
      background: rgba(255, 247, 225, 0.72);
      border: 1px solid rgba(194, 158, 90, 0.4);
    }

    .page-close-btn {
      width: 32px;
      height: 32px;
      border: 1px solid rgba(194, 158, 90, 0.4);
      border-radius: 50%;
      background: rgba(255, 249, 234, 0.85);
      color: #6b451d;
      font-size: 18px;
      font-family: inherit;
      cursor: pointer;
      transition: transform 200ms ease, background 200ms ease;
    }

    .page-close-btn:hover {
      transform: rotate(90deg);
      background: rgba(255, 255, 255, 0.95);
    }

    .page-body {
      position: absolute;
      inset: 70px 26px 34px 26px;
      display: grid;
      grid-template-columns: 90px 1fr 170px;
      gap: 20px;
    }

    .page-poem-meta {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 10px;
      align-items: center;
      padding-top: 10px;
      border-right: 1px solid rgba(194, 158, 90, 0.28);
    }

    .page-meta-title {
      font-size: 28px;
      letter-spacing: 6px;
      font-family: var(--font-serif);
      writing-mode: vertical-rl;
      text-orientation: mixed;
    }

    .page-meta-author {
      font-size: 13px;
      letter-spacing: 3px;
      color: var(--ink-soft);
      writing-mode: vertical-rl;
      text-orientation: mixed;
    }

    .page-poem-columns {
      display: flex;
      justify-content: center;
      align-items: stretch;
      gap: 10px;
      padding: 8px 2px 0;
      overflow: hidden;
    }

    .page-poem-line {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-family: var(--font-serif);
      font-size: 22px;
      letter-spacing: 4px;
      line-height: 1.9;
      color: #23170d;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
      padding: 8px 0;
      min-height: 100%;
    }

    .page-poem-side {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 10px;
      border-left: 1px solid rgba(194, 158, 90, 0.28);
    }

    .page-side-block {
      padding: 10px 10px 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(194, 158, 90, 0.24);
      background: rgba(255, 248, 230, 0.58);
    }

    .page-side-label {
      font-size: 11px;
      letter-spacing: 2px;
      color: #86602c;
      margin-bottom: 6px;
    }

    .page-side-text {
      font-size: 12px;
      line-height: 1.65;
      color: var(--ink-soft);
    }

    .scroll-card.is-focused {
      filter: drop-shadow(0 0 24px rgba(240, 208, 140, 0.35));
    }

    .scroll-card.is-dimmed {
      opacity: calc(var(--base-opacity, 0.96) * 0.62);
      filter: saturate(0.82) brightness(0.9);
    }

    .hud {
      position: absolute;
      z-index: 40;
      border: 1px solid var(--hud-border);
      background: var(--hud);
      backdrop-filter: blur(10px);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.24);
      color: #f4e8cf;
    }

    .panel {
      border-radius: 18px;
      padding: 14px 16px;
      min-width: 220px;
    }

    .hud-top-left {
      top: 18px;
      left: 18px;
    }

    .hud-top-right {
      top: 18px;
      right: 18px;
      max-width: 360px;
    }

    .hud-bottom-left {
      left: 18px;
      bottom: 18px;
      max-width: min(42vw, 520px);
    }

    .hud-bottom-right {
      right: 18px;
      bottom: 18px;
      display: flex;
      gap: 12px;
      align-items: flex-end;
      background: transparent;
      border: none;
      box-shadow: none;
      backdrop-filter: none;
    }

    .hud-title {
      font-size: 12px;
      letter-spacing: 4px;
      color: var(--gold-strong);
      margin-bottom: 8px;
    }

    .progress-value {
      font-size: 28px;
      letter-spacing: 2px;
      font-family: var(--font-serif);
    }

    .progress-sub {
      margin-top: 6px;
      font-size: 12px;
      color: rgba(244, 232, 207, 0.68);
      line-height: 1.6;
    }

    .reason-text,
    .path-text {
      font-size: 14px;
      line-height: 1.7;
      color: #f2e5c7;
    }

    .path-text {
      max-height: 112px;
      overflow: auto;
      padding-right: 4px;
    }

    .status-line {
      margin-top: 8px;
      font-size: 12px;
      color: rgba(244, 232, 207, 0.72);
      line-height: 1.6;
    }

    .action-btn {
      border: 1px solid rgba(215, 173, 93, 0.42);
      border-radius: 999px;
      padding: 12px 18px;
      background: rgba(22, 17, 11, 0.82);
      color: #f5e7ca;
      font-family: inherit;
      font-size: 14px;
      letter-spacing: 2px;
      cursor: pointer;
      transition:
        transform 220ms ease,
        background 220ms ease,
        box-shadow 220ms ease;
    }

    .action-btn:hover {
      transform: translateY(-2px);
      background: rgba(40, 30, 18, 0.92);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.22);
    }

    .legend {
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid var(--hud-border);
      background: rgba(22, 17, 11, 0.8);
      color: rgba(244, 232, 207, 0.72);
      font-size: 12px;
      line-height: 1.7;
      min-width: 180px;
    }

    .legend strong {
      color: #f5e7ca;
      font-weight: 400;
    }

    .loading {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: #f6ecd8;
      letter-spacing: 4px;
      background: radial-gradient(circle at center, rgba(16, 13, 8, 0.74), rgba(15, 12, 8, 0.92));
      transition: opacity 300ms ease;
    }

    .loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-ring {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 2px solid rgba(215, 173, 93, 0.2);
      border-top-color: var(--gold);
      animation: spin 1.2s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 1100px) {
      .hud-top-right {
        max-width: 280px;
      }

      .hud-bottom-left {
        max-width: 48vw;
      }
    }

    @media (max-width: 860px) {
      .paper-body {
        grid-template-columns: 56px 1fr 92px;
      }

      .poem-line {
        font-size: 18px;
      }

      .meta-title {
        font-size: 24px;
      }

      .hud-top-right {
        right: 14px;
        left: auto;
        max-width: 240px;
      }

      .panel {
        min-width: auto;
      }
    }

    @media (max-width: 720px) {
      .hud-top-left,
      .hud-top-right,
      .hud-bottom-left {
        max-width: calc(100vw - 28px);
      }

      .hud-top-left {
        top: 14px;
        left: 14px;
      }

      .hud-top-right {
        top: auto;
        left: 14px;
        right: 14px;
        bottom: 108px;
      }

      .hud-bottom-left {
        left: 14px;
        right: 14px;
        bottom: 14px;
        max-width: none;
      }

      .hud-bottom-right {
        right: 14px;
        bottom: 164px;
        flex-direction: column;
        align-items: stretch;
      }

      .legend {
        display: none;
      }
    }
  </style>
</head>
<body>
  <canvas id="particleCanvas"></canvas>

  <div class="scene">
    <svg class="constellation" id="constellation" aria-hidden="true"></svg>
    <div class="world" id="world"></div>
  </div>

  <div class="hud panel hud-top-left">

        {"id": "p30", "title": "过零丁洋", "author": "文天祥", "content": "辛苦遭逢起一经，干戈寥落四周星。\n山河破碎风飘絮，身世浮沉雨打萍。\n惶恐滩头说惶恐，零丁洋里叹零丁。\n人生自古谁无死，留取丹心照汗青。", "lines": ["辛苦遭逢起一经", "干戈寥落四周星", "山河破碎风飘絮", "身世浮沉雨打萍", "惶恐滩头说惶恐", "零丁洋里叹零丁", "人生自古谁无死", "留取丹心照汗青"], "keywords": ["干戈", "山河破碎", "零丁洋", "丹心", "汗青", "身世"], "themes": ["历史", "爱国", "气节"], "style": "豪放", "imagery": "历史"}
      ]
    }
  ]
}
  </script>

  <script>
    const world = document.getElementById("world");
    const constellation = document.getElementById("constellation");
    const progressText = document.getElementById("progressText");
    const currentLabel = document.getElementById("currentLabel");
    const reasonText = document.getElementById("reasonText");
    const pathText = document.getElementById("pathText");
    const restartBtn = document.getElementById("restartBtn");
    const loading = document.getElementById("loading");
    const pageOverlay = document.getElementById("pageOverlay");
    const pageCloseBtn = document.getElementById("pageCloseBtn");
    const pageTag = document.getElementById("pageTag");
    const pageTitle = document.getElementById("pageTitle");
    const pageAuthor = document.getElementById("pageAuthor");
    const pageLines = document.getElementById("pageLines");
    const pageAnalysis = document.getElementById("pageAnalysis");
    const pageKeywords = document.getElementById("pageKeywords");
    const pageThemes = document.getElementById("pageThemes");

    const styleTable = {
      "婉约": {"婉约": 1, "豪放": 0.35, "沉郁": 0.45, "朴实": 0.55, "哲理": 0.4},
      "豪放": {"婉约": 0.35, "豪放": 1, "沉郁": 0.6, "朴实": 0.45, "哲理": 0.5},
      "沉郁": {"婉约": 0.45, "豪放": 0.6, "沉郁": 1, "朴实": 0.4, "哲理": 0.55},
      "朴实": {"婉约": 0.55, "豪放": 0.45, "沉郁": 0.4, "朴实": 1, "哲理": 0.5},
      "哲理": {"婉约": 0.4, "豪放": 0.5, "沉郁": 0.55, "朴实": 0.5, "哲理": 1}
    };

    const keywordAlias = {
      "故乡": "思乡",
      "乡音": "思乡",
      "归乡": "思乡",
      "异乡": "思乡",
      "客愁": "思乡",
      "知己": "友情",
      "故人": "友情",
      "离别": "离别",
      "玉门关": "边塞",
      "孤城": "边塞",
      "明月": "明月",
      "月夜": "明月",
      "月落": "明月",
      "月近": "明月",
      "月黑": "明月",
      "黄河": "黄河",
      "山水": "山水",
      "春山": "山水",
      "庐山": "山水",
      "瀑布": "山水",
      "烽火": "历史",
      "国破": "历史",
      "山河破碎": "历史",
      "丹心": "历史",
      "辛苦": "民生",
      "农人": "民生",
      "盘中餐": "民生",
      "清白": "品格",
      "清气": "品格"
    };

    const stopChars = new Set(["，", "。", "！", "？", "；", "：", "、", ",", ".", "!", "?", ";", ":", " ", "\n", "\t"]);
    const state = {
      poems: [],
      matrix: [],
      reasons: [],
      positions: [],
      links: [],
      cards: [],
      cardMap: new Map(),
      currentIndex: null,
      pendingOpenIndex: null,
      path: [],
      visited: new Set(),
      mode: "idle",
      dataMode: "remote",
      camera: { tx: 0, ty: 0, tz: -1420, rx: -11, ry: -18 },
      lineAnimationFrame: null,
      constellationFrame: null,
      cameraAnimationFrame: null,
      openTimer: null,
      flowTimer: null,
      pageVisible: false
    };

    function flattenPoems(data) {
      return data.groups.flatMap((group) =>
        group.poems.map((poem) => ({
          ...poem,
          group: group.name,
          groupId: group.id,
          groupImagery: group.imagery
        }))
      );
    }

    function getEmbeddedPoems() {
      return JSON.parse(document.getElementById("embedded-poems").textContent);
    }

    async function loadJson(url) {
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`读取失败: ${url}`);
      }
      return response.json();
    }

    function normalizeKeyword(keyword) {
      return keywordAlias[keyword] || keyword;
    }

    function getKeywordSet(poem) {
      return new Set(poem.keywords.map(normalizeKeyword));
    }

    function getSharedKeywords(poemA, poemB) {
      const a = getKeywordSet(poemA);
      const b = getKeywordSet(poemB);
      return [...a].filter((item) => b.has(item));
    }

    function keywordScore(poemA, poemB) {
      const a = getKeywordSet(poemA);
      const b = getKeywordSet(poemB);
      const union = new Set([...a, ...b]);
      if (!union.size) {
        return [0, []];
      }
      const shared = [...a].filter((item) => b.has(item));
      return [shared.length / union.size, shared];
    }

    function charCounter(text) {
      const counter = new Map();
      [...text].forEach((char) => {
        if (stopChars.has(char)) {
          return;
        }
        counter.set(char, (counter.get(char) || 0) + 1);
      });
      return counter;
    }

    function charOverlap(poemA, poemB) {
      const counterA = charCounter(poemA.content);
      const counterB = charCounter(poemB.content);
      const chars = new Set([...counterA.keys(), ...counterB.keys()]);
      if (!chars.size) {
        return 0;
      }
      let overlap = 0;
      let total = 0;
      chars.forEach((char) => {
        const countA = counterA.get(char) || 0;
        const countB = counterB.get(char) || 0;
        overlap += Math.min(countA, countB);
        total += Math.max(countA, countB);
      });
      return total ? overlap / total : 0;
    }

    function buildReason(poemA, poemB, sharedKeywords, weighted) {
      if (poemA.id === poemB.id) {
        return "同一首诗，作为流转起点与回环锚点。";
      }
      const ranked = Object.entries(weighted).sort((a, b) => b[1] - a[1]);
      const lead = ranked[0][0];
      if (lead === "keywords") {
        return sharedKeywords.length
          ? `共享关键词“${sharedKeywords.slice(0, 3).join("、")}”，诗意意象衔接最强。`
          : "关键词场域接近，意象迁移自然。";
      }
      if (lead === "semantic") {
        return "字词与语气重合度较高，展开后的读感衔接顺滑。";
      }
      if (lead === "style") {
        return `风格从“${poemA.style}”流向“${poemB.style}”，情绪调性相互呼应。`;
      }
      if (lead === "author") {
        return `同为${poemA.author}作品，作者气质与表达方式彼此照映。`;
      }
      return `同属“${poemA.imagery}”意象类别，卷轴切换时画面保持连贯。`;
    }

    function buildSimilarity(poems) {
      const matrix = [];
      const reasons = [];
      poems.forEach((poemA) => {
        const row = [];
        const reasonRow = [];
        poems.forEach((poemB) => {
          const [keyword, shared] = keywordScore(poemA, poemB);
          const semantic = charOverlap(poemA, poemB);
          const style = styleTable[poemA.style][poemB.style];
          const author = poemA.author === poemB.author ? 1 : 0;
          const imagery = poemA.imagery === poemB.imagery ? 1 : 0;
          const weighted = {
            keywords: keyword * 0.4,
            semantic: semantic * 0.25,
            style: style * 0.15,
            author: author * 0.1,
            imagery: imagery * 0.1
          };
          const score = Object.values(weighted).reduce((sum, value) => sum + value, 0);
          row.push(Number(score.toFixed(4)));
          reasonRow.push(buildReason(poemA, poemB, shared, weighted));
        });
        matrix.push(row);
        reasons.push(reasonRow);
      });
      return { poems, matrix, reasons };
    }

    async function loadProjectData() {
      let poemsData;
      let similarityData;
      let mode = "remote";

      try {
        poemsData = await loadJson("./poems.json");
      } catch (error) {
        poemsData = getEmbeddedPoems();
        mode = "embedded";
      }

      const poems = flattenPoems(poemsData);

      try {
        similarityData = await loadJson("./similarity_matrix.json");
      } catch (error) {
        similarityData = buildSimilarity(poems);
        mode = "embedded";
      }

      return {
        poems,
        matrix: similarityData.matrix,
        reasons: similarityData.reasons,
        mode
      };
    }

    function seededValue(seed) {
      const value = Math.sin(seed * 12.9898 + 78.233) * 43758.5453;
      return value - Math.floor(value);
    }

    function createScatterPositions(total) {
      const positions = [];
      for (let index = 0; index < total; index += 1) {
        let bestCandidate = null;
        let bestDistance = -1;
        for (let attempt = 0; attempt < 120; attempt += 1) {
          const seedBase = index * 173 + attempt * 29 + 11;
          const depthBandIndex = Math.floor(seededValue(seedBase + 20) * 3);
          const depthBands = [-360, -40, 320];
          const z = depthBands[depthBandIndex] + (seededValue(seedBase + 2) - 0.5) * 180;
          const scale = depthBandIndex === 0 ? 0.74 : depthBandIndex === 1 ? 0.94 : 1.16;
          const opacity = depthBandIndex === 0 ? 0.72 : depthBandIndex === 1 ? 0.88 : 1;
          const candidate = {
            x: (seededValue(seedBase) - 0.5) * 1500,
            y: (seededValue(seedBase + 1) - 0.5) * 720 + (depthBandIndex - 1) * 36,
            z,
            rotateY: (seededValue(seedBase + 3) - 0.5) * 28,
            tilt: (seededValue(seedBase + 4) - 0.5) * 10,
            scale,
            opacity,
            band: depthBandIndex
          };

          let nearestDistance = Infinity;
          positions.forEach((position) => {
            const dx = candidate.x - position.x;
            const dy = candidate.y - position.y;
            const dz = candidate.z - position.z;
            const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);
            nearestDistance = Math.min(nearestDistance, distance);
          });

          if (!positions.length || nearestDistance > 300) {
            bestCandidate = candidate;
            break;
          }

          if (nearestDistance > bestDistance) {
            bestDistance = nearestDistance;
            bestCandidate = candidate;
          }
        }
        positions.push(bestCandidate);
      }
      return positions;
    }

    function buildLinks() {
      const strongestMap = new Map();
      for (let from = 0; from < state.poems.length; from += 1) {
        const topPeers = state.matrix[from]
          .map((score, index) => ({ score, index }))
          .filter((item) => item.index !== from)
          .sort((a, b) => b.score - a.score)
          .slice(0, 3)
          .map((item) => item.index);
        strongestMap.set(from, new Set(topPeers));
      }

      const links = [];
      for (let from = 0; from < state.poems.length; from += 1) {
        for (let to = from + 1; to < state.poems.length; to += 1) {
          const score = state.matrix[from][to];
          const primary = strongestMap.get(from).has(to) || strongestMap.get(to).has(from);
          links.push({
            from,
            to,
            score,
            primary,
            phase: seededValue((from + 1) * 53 + (to + 1) * 97),
            speed: 0.38 + score * 0.92
          });
        }
      }
      return links;
    }

    function updateWorldTransform() {
      world.style.transition = "none";
      world.style.transform = `translate3d(${state.camera.tx}px, ${state.camera.ty}px, ${state.camera.tz}px) rotateX(${state.camera.rx}deg) rotateY(${state.camera.ry}deg)`;
    }

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function animateCameraTo(target, duration = 900) {
      if (state.cameraAnimationFrame) {
        cancelAnimationFrame(state.cameraAnimationFrame);
      }

      if (!duration) {
        state.camera = { ...target };
        updateWorldTransform();
        return;
      }

      const start = performance.now();
      const from = { ...state.camera };
      const tick = (now) => {
        const progress = Math.min(1, (now - start) / duration);
        const eased = easeInOutCubic(progress);
        state.camera = {
          tx: from.tx + (target.tx - from.tx) * eased,
          ty: from.ty + (target.ty - from.ty) * eased,
          tz: from.tz + (target.tz - from.tz) * eased,
          rx: from.rx + (target.rx - from.rx) * eased,
          ry: from.ry + (target.ry - from.ry) * eased
        };
        updateWorldTransform();
        if (progress < 1) {
          state.cameraAnimationFrame = requestAnimationFrame(tick);
        } else {
          state.cameraAnimationFrame = null;
        }
      };
      state.cameraAnimationFrame = requestAnimationFrame(tick);
    }

    function rotatePoint(point, rxDeg, ryDeg) {
      const rx = (rxDeg * Math.PI) / 180;
      const ry = (ryDeg * Math.PI) / 180;

      const cosY = Math.cos(ry);
      const sinY = Math.sin(ry);
      const x1 = point.x * cosY + point.z * sinY;
      const z1 = -point.x * sinY + point.z * cosY;

      const cosX = Math.cos(rx);
      const sinX = Math.sin(rx);
      const y2 = point.y * cosX - z1 * sinX;
      const z2 = point.y * sinX + z1 * cosX;

      return { x: x1, y: y2, z: z2 };
    }

    function projectPosition(position) {
      const rotated = rotatePoint(position, state.camera.rx, state.camera.ry);
      const x = rotated.x + state.camera.tx;
      const y = rotated.y + state.camera.ty;
      const z = rotated.z + state.camera.tz;
      const perspective = 1200;
      const safeDepth = Math.max(-900, z);
      const scale = perspective / (perspective - safeDepth);
      return {
        x: window.innerWidth * 0.5 + x * scale,
        y: window.innerHeight * 0.48 + y * scale,
        scale,
        z: safeDepth
      };
    }

    function lineStyle(link, now) {
      const pulse = 0.55 + 0.45 * Math.sin(now * 0.0022 + link.phase * Math.PI * 2);
      const currentIndex = state.currentIndex;
      const involvesCurrent = currentIndex !== null && (link.from === currentIndex || link.to === currentIndex);
      const visitedLink = state.visited.has(link.from) && state.visited.has(link.to);
      return {
        opacity: involvesCurrent
          ? 0.54 + link.score * 0.46 + pulse * 0.12
          : link.primary
            ? 0.2 + link.score * 0.22 + pulse * 0.08
            : visitedLink
              ? 0.11 + link.score * 0.12
              : 0.02 + link.score * 0.05,
        width: involvesCurrent
          ? 1.85 + link.score * 2.7
          : link.primary
            ? 1 + link.score * 1.45
            : 0.42 + link.score * 0.62,
        color: involvesCurrent
          ? "#f6e5b2"
          : link.primary
            ? "#d7ad5d"
            : visitedLink
              ? "#c89a49"
              : "#6983ab"
      };
    }

    function starStyle(index, point, now) {
      const isCurrent = index === state.currentIndex || index === state.pendingOpenIndex;
      const isVisited = state.visited.has(index);
      const twinkle = 0.62 + 0.38 * Math.sin(now * 0.0024 + index * 0.8);
      return {
        radius: isCurrent ? 4.8 : isVisited ? 3.4 : 2 + point.scale * 1.4,
        glow: isCurrent ? 16 : isVisited ? 10 : 6 + point.scale * 3,
        opacity: isCurrent ? 1 : isVisited ? 0.88 : 0.34 + twinkle * 0.28,
        color: isCurrent ? "#fff2c8" : isVisited ? "#e0bb6d" : "#cdd9f3"
      };
    }

    function drawConnectionLines(now = performance.now()) {
      if (!state.positions.length) {
        return;
      }

      const points = state.positions.map((position) => projectPosition(position));
      constellation.setAttribute("viewBox", `0 0 ${window.innerWidth} ${window.innerHeight}`);
      const defs = `
        <defs>
          <filter id="constellationGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4.6" result="blur"></feGaussianBlur>
            <feMerge>
              <feMergeNode in="blur"></feMergeNode>
              <feMergeNode in="SourceGraphic"></feMergeNode>
            </feMerge>
          </filter>
          <filter id="constellationSoftGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="10" result="blur"></feGaussianBlur>
            <feMerge>
              <feMergeNode in="blur"></feMergeNode>
              <feMergeNode in="SourceGraphic"></feMergeNode>
            </feMerge>
          </filter>
        </defs>
      `;

      const content = state.links.map((link) => {
        const from = points[link.from];
        const to = points[link.to];
        const style = lineStyle(link, now);
        return `<line x1="${from.x.toFixed(2)}" y1="${from.y.toFixed(2)}" x2="${to.x.toFixed(2)}" y2="${to.y.toFixed(2)}" stroke="${style.color}" stroke-opacity="${style.opacity.toFixed(3)}" stroke-width="${style.width.toFixed(2)}" filter="${link.primary || style.opacity > 0.35 ? "url(#constellationGlow)" : ""}" />`;
      }).join("");

      const particles = state.links.filter((link) => {
        const involvesCurrent = state.currentIndex !== null && (link.from === state.currentIndex || link.to === state.currentIndex);
        return link.primary || involvesCurrent;
      }).map((link) => {
        const from = points[link.from];
        const to = points[link.to];
        const count = link.primary && link.score > 0.48 ? 2 : 1;
        return Array.from({ length: count }, (_, particleIndex) => {
          const progress = (now * 0.00011 * link.speed + link.phase + particleIndex / count) % 1;
          const x = from.x + (to.x - from.x) * progress;
          const y = from.y + (to.y - from.y) * progress;
          const radius = state.currentIndex !== null && (link.from === state.currentIndex || link.to === state.currentIndex) ? 3.2 : 2.35;
          const opacity = 0.58 + 0.32 * Math.sin(now * 0.004 + particleIndex + link.phase * 3);
          return `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="${radius.toFixed(2)}" fill="#f8e7bb" fill-opacity="${opacity.toFixed(3)}" filter="url(#constellationSoftGlow)" />`;
        }).join("");
      }).join("");

      const stars = points.map((point, index) => {
        const style = starStyle(index, point, now);
        return `
          <circle cx="${point.x.toFixed(2)}" cy="${point.y.toFixed(2)}" r="${(style.radius + 3.2).toFixed(2)}" fill="${style.color}" fill-opacity="${(style.opacity * 0.14).toFixed(3)}" filter="url(#constellationSoftGlow)" />
          <circle cx="${point.x.toFixed(2)}" cy="${point.y.toFixed(2)}" r="${style.radius.toFixed(2)}" fill="${style.color}" fill-opacity="${style.opacity.toFixed(3)}" filter="url(#constellationGlow)" />
        `;
      }).join("");

      constellation.innerHTML = `${defs}<g>${content}</g><g>${particles}</g><g>${stars}</g>`;
    }

    function startConstellationLoop() {
      if (state.constellationFrame) {
        cancelAnimationFrame(state.constellationFrame);
      }
      const tick = (now) => {
        drawConnectionLines(now);
        state.constellationFrame = requestAnimationFrame(tick);
      };
      state.constellationFrame = requestAnimationFrame(tick);
    }

    function buildAnalysis(poem) {
      const themes = poem.themes.slice(0, 2).join("、");
      const keywords = poem.keywords.slice(0, 3).join("、");
      return `这首诗以${themes}为轴，围绕“${keywords}”展开，在${poem.style}气质中铺陈出${poem.imagery}意象的层次感。`;
    }

    function fillPage(poem) {
      pageTag.textContent = `${poem.imagery} · ${poem.style}`;
      pageTitle.textContent = poem.title;
      pageAuthor.textContent = poem.author;
      pageLines.innerHTML = poem.lines.map((line) => `<div class="page-poem-line">${line}</div>`).join("");
      pageAnalysis.textContent = buildAnalysis(poem);
      pageKeywords.textContent = poem.keywords.join(" · ");
      pageThemes.textContent = poem.themes.join(" / ");
    }

    function showPage(poem) {
      fillPage(poem);
      state.pageVisible = true;
      pageOverlay.classList.add("is-visible");
      pageOverlay.setAttribute("aria-hidden", "false");
      pageCloseBtn.disabled = false;
      pageCloseBtn.tabIndex = 0;
      pageCloseBtn.setAttribute("aria-hidden", "false");
    }

    function hidePage() {
      state.pageVisible = false;
      pageOverlay.classList.remove("is-visible");
      pageOverlay.setAttribute("aria-hidden", "true");
      pageCloseBtn.disabled = true;
      pageCloseBtn.tabIndex = -1;
      pageCloseBtn.setAttribute("aria-hidden", "true");
    }

    function createCard(poem, index, position) {
      const card = document.createElement("article");
      card.className = "scroll-card";
      card.dataset.index = index;
      card.setAttribute("role", "button");
      card.setAttribute("tabindex", "0");
      card.setAttribute("aria-label", `打开诗轴 ${poem.title}，作者 ${poem.author}`);
      card.style.setProperty("--base-opacity", position.opacity.toFixed(2));
      card.style.transform = `translate3d(${position.x}px, ${position.y}px, ${position.z}px) rotateY(${position.rotateY}deg) rotateX(${position.tilt}deg) scale(${position.scale})`;
      card.style.zIndex = `${100 + position.band * 40 + Math.round(position.scale * 10)}`;
      card.innerHTML = `
        <div class="scroll-rod left"></div>
        <div class="scroll-rod right"></div>
        <div class="scroll-shell">
          <div class="scroll-paper"></div>
          <div class="card-front">
            <div class="front-inner">
              <div class="front-title">${poem.title}</div>
              <div class="front-author">${poem.author}</div>
              <div class="front-group">${poem.group}</div>
            </div>
          </div>
          <div class="scroll-ribbon">
            <span class="ribbon-knot ribbon-knot-top"></span>
            <span class="ribbon-knot ribbon-knot-bottom"></span>
            <span class="ribbon-thread ribbon-thread-left"></span>
            <span class="ribbon-thread ribbon-thread-right"></span>
          </div>
        </div>
      `;

      card.addEventListener("click", () => openPoem(index, false));
      card.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openPoem(index, false);
        }
      });
      return card;
    }

    function renderWorld() {
      world.innerHTML = "";
      constellation.innerHTML = "";
      state.cards = [];
      state.cardMap = new Map();
      state.positions = createScatterPositions(state.poems.length);
      state.links = buildLinks();
      state.poems.forEach((poem, index) => {
        const card = createCard(poem, index, state.positions[index]);
        state.cards.push(card);
        state.cardMap.set(index, card);
        world.appendChild(card);
      });
      applyCameraPanorama(true);
      startConstellationLoop();
      refreshHud();
    }

    function applyCameraPanorama(initial = false) {
      animateCameraTo({ tx: 0, ty: 0, tz: -1360, rx: -8, ry: 7 }, initial ? 0 : 1050);
    }

    function focusCamera(index) {
      const position = state.positions[index];
      const yaw = Math.max(-10, Math.min(10, position.x / 85));
      const pitch = Math.max(-6, Math.min(4, -position.y / 120));
      const depth = -(position.z + 720);
      animateCameraTo({
        tx: -position.x,
        ty: -position.y + 10,
        tz: depth,
        rx: pitch,
        ry: yaw
      }, 900);
    }

    function clearOpenTimers() {
      if (state.openTimer) {
        clearTimeout(state.openTimer);
        state.openTimer = null;
      }
      if (state.flowTimer) {
        clearTimeout(state.flowTimer);
        state.flowTimer = null;
      }
    }

    function setCardStates() {
      const selectedIndex = state.pendingOpenIndex !== null ? state.pendingOpenIndex : state.currentIndex;
      state.cards.forEach((card, index) => {
        card.classList.toggle("is-open", state.currentIndex === index);
        card.classList.toggle("is-untying", state.pendingOpenIndex === index);
        card.classList.toggle("is-focused", selectedIndex === index);
        card.classList.toggle("is-visited", state.visited.has(index));
        card.classList.toggle("is-dimmed", selectedIndex !== null && selectedIndex !== index);
      });
    }

    function appendPath(title) {
      if (state.path[state.path.length - 1] !== title) {
        state.path.push(title);
      }
    }

    function refreshHud() {
      progressText.textContent = `诗轴 ${state.visited.size}/${state.poems.length}`;
      pathText.textContent = state.path.length ? state.path.join(" → ") : "尚未开始浏览";

      if (state.pendingOpenIndex !== null) {
        const poem = state.poems[state.pendingOpenIndex];
        currentLabel.textContent = `${poem.title} · 解带中`;
      } else if (state.currentIndex === null) {
        currentLabel.textContent = "全景视角 · 等待翻开第一卷";
      } else {
        const poem = state.poems[state.currentIndex];
        currentLabel.textContent = `${poem.title} · ${poem.author}`;
      }

    }

    function openPoem(index, autoFlow) {
      if (state.currentIndex === index || state.pendingOpenIndex === index) {
        return;
      }

      clearOpenTimers();
      state.currentIndex = null;
      state.pendingOpenIndex = index;
      state.mode = autoFlow ? "auto" : "manual";
      hidePage();
      focusCamera(index);
      setCardStates();
      reasonText.textContent = autoFlow
        ? `星轨正牵引至《${state.poems[index].title}》，先解开金色绑带，再展开诗卷。`
        : `《${state.poems[index].title}》的绑带正在解开，诗卷即将缓缓展开。`;
      refreshHud();

      state.openTimer = window.setTimeout(() => {
        state.pendingOpenIndex = null;
        state.currentIndex = index;
        state.visited.add(index);
        appendPath(state.poems[index].title);
        setCardStates();
        showPage(state.poems[index]);
        reasonText.textContent = autoFlow
          ? `自动流转至《${state.poems[index].title}》：${state.path.length > 1 ? state.reasons[getPreviousIndex(index)][index] : "延续当前诗意路径。"}`
          : `《${state.poems[index].title}》已在独立画布中展开，可阅读全文并继续沿诗意网络流转。`;
        refreshHud();
        state.openTimer = null;
      }, 420);
    }

    function getPreviousIndex(currentIndex) {
      if (state.path.length < 2) {
        return currentIndex;
      }
      const previousTitle = state.path[state.path.length - 2];
      return state.poems.findIndex((poem) => poem.title === previousTitle);
    }

    function findNextIndex(currentIndex) {
      let bestIndex = -1;
      let bestScore = -1;
      state.matrix[currentIndex].forEach((score, index) => {
        if (index === currentIndex || state.visited.has(index)) {
          return;
        }
        if (score > bestScore) {
          bestScore = score;
          bestIndex = index;
        }
      });

      if (bestIndex !== -1) {
        return bestIndex;
      }

      state.matrix[currentIndex].forEach((score, index) => {
        if (index === currentIndex) {
          return;
        }
        if (score > bestScore) {
          bestScore = score;
          bestIndex = index;
        }
      });
      return bestIndex;
    }

    function closeCurrentAndFlow() {
      if (state.currentIndex === null) {
        return;
      }

      const fromIndex = state.currentIndex;
      const fromPoem = state.poems[fromIndex];
      clearOpenTimers();
      state.currentIndex = null;
      state.pendingOpenIndex = null;
      hidePage();
      setCardStates();
      reasonText.textContent = `《${fromPoem.title}》合拢，正在沿相似度矩阵寻找下一卷……`;

      const nextIndex = findNextIndex(fromIndex);
      if (nextIndex === -1) {
        applyCameraPanorama();
        refreshHud();
        return;
      }

      const nextPoem = state.poems[nextIndex];
      const flowReason = state.reasons[fromIndex][nextIndex];
      focusCamera(nextIndex);
      refreshHud();

      state.flowTimer = window.setTimeout(() => {
        reasonText.textContent = `《${fromPoem.title}》 → 《${nextPoem.title}》：${flowReason}`;
        openPoem(nextIndex, true);
        state.flowTimer = null;
      }, 820);
    }

    function restartExperience() {
      clearOpenTimers();
      state.currentIndex = null;
      state.pendingOpenIndex = null;
      state.path = [];
      state.visited = new Set();
      state.mode = "idle";
      hidePage();
      applyCameraPanorama();
      setCardStates();
      reasonText.textContent = "已回到全景视角。点击任意卷轴，重新开启一条新的唐诗流转路径。";
      refreshHud();
    }

    function initParticles() {
      const canvas = document.getElementById("particleCanvas");
      const context = canvas.getContext("2d");
      const particles = [];
      let width = 0;
      let height = 0;

      function resize() {
        width = canvas.width = window.innerWidth * window.devicePixelRatio;
        height = canvas.height = window.innerHeight * window.devicePixelRatio;
        canvas.style.width = `${window.innerWidth}px`;
        canvas.style.height = `${window.innerHeight}px`;
        context.setTransform(1, 0, 0, 1, 0, 0);
        context.scale(window.devicePixelRatio, window.devicePixelRatio);
      }

      function makeParticle() {
        return {
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          r: Math.random() * 1.8 + 0.6,
          speedY: Math.random() * 0.35 + 0.08,
          drift: (Math.random() - 0.5) * 0.18,
          alpha: Math.random() * 0.45 + 0.15
        };
      }

      resize();
      for (let index = 0; index < 90; index += 1) {
        particles.push(makeParticle());
      }

      function tick() {
        context.clearRect(0, 0, window.innerWidth, window.innerHeight);
        particles.forEach((particle) => {
          particle.y -= particle.speedY;
          particle.x += Math.sin((particle.y + particle.x) * 0.002) * particle.drift;
          if (particle.y < -20) {
            Object.assign(particle, makeParticle(), { y: window.innerHeight + 20 });
          }
          context.beginPath();
          context.fillStyle = `rgba(215, 173, 93, ${particle.alpha})`;
          context.shadowBlur = 12;
          context.shadowColor = "rgba(215, 173, 93, 0.35)";
          context.arc(particle.x, particle.y, particle.r, 0, Math.PI * 2);
          context.fill();
        });
        requestAnimationFrame(tick);
      }

      window.addEventListener("resize", resize);
      tick();
    }

    restartBtn.addEventListener("click", restartExperience);
    pageCloseBtn.addEventListener("click", closeCurrentAndFlow);
    pageOverlay.addEventListener("click", (event) => {
      if (event.target === pageOverlay) {
        closeCurrentAndFlow();
      }
    });
    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && state.pageVisible) {
        closeCurrentAndFlow();
      }
    });

    async function init() {
      initParticles();
      const projectData = await loadProjectData();
      state.poems = projectData.poems;
      state.matrix = projectData.matrix;
      state.reasons = projectData.reasons;
      state.dataMode = projectData.mode;
      renderWorld();
      loading.classList.add("hidden");
      reasonText.textContent = "点击任意卷轴，先解开绑带，再展开诗卷；星座连线会以流光展示诗与诗之间的联系。";
      refreshHud();
    }

    init().catch((error) => {
      loading.classList.add("hidden");
      reasonText.textContent = "数据初始化失败，请检查文件是否完整。";
    });
  </script>
