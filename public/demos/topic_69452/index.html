<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>紧急求助 - 社区老友记</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="page-header">
            <a href="index.html" class="back-btn">←</a>
            <h1 class="page-title" style="color: #E74C3C;">紧急求助</h1>
        </div>

        <div class="sos-wrapper" id="sosInitial">
            <p class="sos-tip">
                如果您遇到突发情况<br>
                按下下方按钮，附近邻居会立即收到通知
            </p>

            <button class="sos-button" onclick="startCountdown()">
                SOS
            </button>

            <p class="sos-warning">
                ⚠️ 仅在紧急情况下使用<br>
                误触会浪费邻居们的宝贵时间
            </p>
        </div>

        <!-- 倒计时中 -->
        <div class="sos-wrapper" id="sosCounting" style="display: none;">
            <p class="sos-tip" style="color: #E74C3C; font-weight: 600;">
                正在发送求助信号...
            </p>
            <div class="sos-countdown" id="countdownNum">3</div>
            <button class="cancel-btn" onclick="cancel()">
                ✕ 取消求助
            </button>
        </div>

        <!-- 发送成功 -->
        <div class="sos-wrapper" id="sosSuccess" style="display: none;">
            <div class="success-card">
                <div class="success-icon">✅</div>
                <p class="success-text">已通知附近 3 位志愿者</p>
                <p class="success-tip">他们正在赶来，请保持电话畅通</p>
            </div>

            <div class="emergency-contact">
                <div class="contact-avatar">👨</div>
                <div class="contact-info">
                    <div class="contact-name">李建国</div>
                    <div class="contact-relation">儿子 · 紧急联系人</div>
                </div>
                <button class="call-btn">📞</button>
            </div>

            <div class="emergency-contact">
                <div class="contact-avatar" style="background: #FFE0E0;">🏘️</div>
                <div class="contact-info">
                    <div class="contact-name">王秀英</div>
                    <div class="contact-relation">社区志愿者 · 距离 80 米</div>
                </div>
                <button class="call-btn" style="background: #E74C3C;">📞</button>
            </div>

            <div class="emergency-contact">
                <div class="contact-avatar" style="background: #FFE0E0;">🏃</div>
                <div class="contact-info">
                    <div class="contact-name">赵明亮</div>
                    <div class="contact-relation">社区志愿者 · 距离 150 米</div>
                </div>
                <button class="call-btn" style="background: #E74C3C;">📞</button>
            </div>

            <div class="emergency-contact">
                <div class="contact-avatar" style="background: #FFE0E0;">👨‍⚕️</div>
                <div class="contact-info">
                    <div class="contact-name">陈医生</div>
                    <div class="contact-relation">社区卫生服务站 · 距离 200 米</div>
                </div>
                <button class="call-btn" style="background: #E74C3C;">📞</button>
            </div>

            <a href="index.html" class="submit-btn" style="display: block; text-align: center; text-decoration: none; margin-top: 32px; background: var(--color-green);">
                ✓ 我已没事
            </a>
        </div>
    </div>

    <script>
        let countdownTimer = null;
        let currentCount = 3;

        function startCountdown() {
            document.getElementById('sosInitial').style.display = 'none';
            document.getElementById('sosCounting').style.display = 'block';
            currentCount = 3;
            document.getElementById('countdownNum').textContent = currentCount;

            countdownTimer = setInterval(() => {
                currentCount--;
                if (currentCount <= 0) {
                    clearInterval(countdownTimer);
                    showSuccess();
                } else {
                    document.getElementById('countdownNum').textContent = currentCount;
                }
            }, 1000);
        }

        function cancel() {
            clearInterval(countdownTimer);
            document.getElementById('sosCounting').style.display = 'none';
            document.getElementById('sosInitial').style.display = 'block';
        }

        function showSuccess() {
            document.getElementById('sosCounting').style.display = 'none';
            document.getElementById('sosSuccess').style.display = 'block';
        }
    </script>
</body>
</html>
