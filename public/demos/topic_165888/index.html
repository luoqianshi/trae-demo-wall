<script>
// =====================================================
// 数据层 — 存储适配器
// =====================================================
const STORAGE_KEY = 'lone_echo_letters';
class LocalStorageAdapter {
  async getAll() {
    try {
      const data = localStorage.getItem(STORAGE_KEY);
      const letters = data ? JSON.parse(data) : [];
      return letters.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    } catch { return []; }
  }
  async getById(id) { const letters = await this.getAll(); return letters.find(l => l.id === id) || null; }
  async save(letter) { const letters = await this.getAll(); letters.unshift(letter); localStorage.setItem(STORAGE_KEY, JSON.stringify(letters)); }
  async delete(id) { const letters = await this.getAll(); const filtered = letters.filter(l => l.id !== id); localStorage.setItem(STORAGE_KEY, JSON.stringify(filtered)); }
}
const storageAdapter = new LocalStorageAdapter();

// =====================================================
// 逻辑层 — 样式生成器
// =====================================================
const stylePresets = [
  { name:'vintage-warm',  primary:'#d4a574', secondary:'#f5e6d3', pattern:'linen',    size:'220px' },
  { name:'ocean-breeze',  primary:'#7ec8e3', secondary:'#e0f0f8', pattern:'waves',    size:'200px' },
  { name:'forest-mist',   primary:'#8fbc8f', secondary:'#e8f5e9', pattern:'leaves',   size:'210px' },
  { name:'sunset-glow',   primary:'#e8945a', secondary:'#fde8d0', pattern:'dots',     size:'230px' },
  { name:'lavender-dream',primary:'#b39ddb', secondary:'#ede7f6', pattern:'stripes',  size:'205px' },
  { name:'rose-blush',    primary:'#e57373', secondary:'#fce4ec', pattern:'hearts',   size:'215px' },
  { name:'tea-stain',     primary:'#c9b99a', secondary:'#f0ebe0', pattern:'flecks',   size:'225px' },
  { name:'midnight-sky',  primary:'#5c6bc0', secondary:'#e8eaf6', pattern:'stars',    size:'195px' },
  { name:'autumn-leaf',   primary:'#c77944', secondary:'#fbe9e7', pattern:'veins',    size:'210px' },
  { name:'frosted-glass', primary:'#a5d6a7', secondary:'#e0f2f1', pattern:'crystals', size:'220px' },
];
function getRandomPreset() { const idx = Math.floor(Math.random() * stylePresets.length); return { ...stylePresets[idx] }; }
function generateLetterStyle() {
  const preset = getRandomPreset();
  const rotation = (Math.random() * 6 - 3).toFixed(1);
  const shadowColor = preset.primary + '44';
  return { primary: preset.primary, secondary: preset.secondary, pattern: preset.pattern, size: preset.size, rotation: parseFloat(rotation), shadowColor };
}
function getPatternCss(pattern) {
  const patterns = {
    linen:'repeating-linear-gradient(0deg,rgba(0,0,0,0.03) 0px,rgba(0,0,0,0.03) 1px,transparent 1px,transparent 3px)',
    waves:'radial-gradient(circle at 50% 50%,rgba(255,255,255,0.15) 0%,transparent 60%)',
    leaves:'repeating-linear-gradient(45deg,rgba(0,0,0,0.02) 0px,rgba(0,0,0,0.02) 2px,transparent 2px,transparent 6px)',
    dots:'radial-gradient(rgba(0,0,0,0.04) 1px,transparent 1px)',
    stripes:'repeating-linear-gradient(90deg,rgba(255,255,255,0.1) 0px,rgba(255,255,255,0.1) 4px,transparent 4px,transparent 12px)',
    hearts:'radial-gradient(ellipse at 50% 40%,rgba(255,255,255,0.12) 30%,transparent 40%)',
    flecks:'repeating-conic-gradient(rgba(0,0,0,0.02) 0% 25%,transparent 0% 50%)',
    stars:'radial-gradient(circle,rgba(255,255,255,0.2) 1px,transparent 1px)',
    veins:'repeating-linear-gradient(-45deg,rgba(0,0,0,0.03) 0px,rgba(0,0,0,0.03) 1px,transparent 1px,transparent 5px)',
    crystals:'linear-gradient(135deg,rgba(255,255,255,0.15) 0%,transparent 50%,rgba(255,255,255,0.05) 100%)',
  };
  return patterns[pattern] || patterns.linen;
}

// =====================================================
// 逻辑层 — 动画控制器
// =====================================================
const animConfig = { foldDuration:1200, unfoldDuration:500, easing:'cubic-bezier(.17,.67,.83,.67)' };
function getAnimConfig() { return { ...animConfig }; }
function updateAnimConfig(overrides) { Object.assign(animConfig, overrides); }
function transitionStr(duration) { return `${duration||animConfig.foldDuration}ms ${animConfig.easing}`; }

// =====================================================
// 逻辑层 — 信件管理器
// =====================================================
const listeners = {};
function onEvent(event, callback) { if(!listeners[event]) listeners[event]=[]; listeners[event].push(callback); }
function emitEvent(event, data) { (listeners[event]||[]).forEach(fn => fn(data)); }
async function createLetter(content, imageData) {
  const letter = {
    id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2),
    content, imageData, style: generateLetterStyle(),
    createdAt: new Date().toISOString(),
  };
  await storageAdapter.save(letter);
  emitEvent('letters-changed', await storageAdapter.getAll());
  return letter;
}
async function getAllLetters() { return storageAdapter.getAll(); }
async function deleteLetter(id) { await storageAdapter.delete(id); emitEvent('letters-changed', await storageAdapter.getAll()); }

// =====================================================
// 效果 — 背景粒子系统
// =====================================================
const PARTICLE_COUNT = 60;
class Particle {
  constructor(w,h) { this.reset(w,h); }
  reset(w,h) {
    this.x=Math.random()*w; this.y=Math.random()*h; this.size=2+Math.random()*6;
    this.speedX=(Math.random()-0.5)*0.3; this.speedY=-0.1-Math.random()*0.2;
    this.opacity=0.15+Math.random()*0.35; this.pulseSpeed=0.005+Math.random()*0.01;
    this.pulseOffset=Math.random()*Math.PI*2; this.isFeather=Math.random()>0.6;
    this.rotation=Math.random()*Math.PI*2; this.rotationSpeed=(Math.random()-0.5)*0.005;
  }
  update(w,h,time) {
    this.x+=this.speedX; this.y+=this.speedY; this.rotation+=this.rotationSpeed;
    this.currentOpacity=this.opacity*(0.6+0.4*Math.sin(time*this.pulseSpeed+this.pulseOffset));
    if(this.y<-20||this.x<-20||this.x>w+20) { this.reset(w,h); this.y=h+10; }
  }
  draw(ctx) {
    ctx.save(); ctx.globalAlpha=this.currentOpacity; ctx.translate(this.x,this.y); ctx.rotate(this.rotation);
    if(this.isFeather){ctx.fillStyle='#e8ddd0';ctx.beginPath();ctx.ellipse(0,0,this.size*0.5,this.size*2,0,0,Math.PI*2);ctx.fill()}
    else{const g=ctx.createRadialGradient(0,0,0,0,0,this.size);g.addColorStop(0,'rgba(255,255,240,0.8)');g.addColorStop(0.4,'rgba(220,215,200,0.3)');g.addColorStop(1,'rgba(220,215,200,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,this.size,0,Math.PI*2);ctx.fill()}
    ctx.restore();
  }
}
let particles = [], particleAnimId = null;
function startParticles() {
  const canvas = document.getElementById('particleCanvas'); if(!canvas) return;
  const ctx = canvas.getContext('2d');
  function resize(){const dpr=window.devicePixelRatio||1;canvas.width=window.innerWidth*dpr;canvas.height=window.innerHeight*dpr;canvas.style.width=window.innerWidth+'px';canvas.style.height=window.innerHeight+'px';ctx.scale(dpr,dpr)}
  window.addEventListener('resize',resize); resize();
  particles = Array.from({length:PARTICLE_COUNT},()=>new Particle(window.innerWidth,window.innerHeight));
  let startTime=Date.now();
  function animate(){const w=window.innerWidth,h=window.innerHeight,elapsed=Date.now()-startTime;ctx.clearRect(0,0,w,h);for(const p of particles){p.update(w,h,elapsed);p.draw(ctx)}particleAnimId=requestAnimationFrame(animate)}
  animate();
}

// =====================================================
// UI — 创作区
// =====================================================
const PROMPTS = [
  '亲爱的自己，今天我想对你说……','此刻的你，过得好吗？',
  '如果有一个拥抱可以留到以后……','窗外有风，心里有句话……',
  '写给未来的自己：','今天，我原谅了自己一件事……',
  '我最想记住的是……','在这个安静的夜晚，我想对你说……',
];
function renderComposer(container) {
  const initialPrompt = PROMPTS[Math.floor(Math.random()*PROMPTS.length)];
  container.innerHTML = `
    <div class="composer" id="composer">
      <div class="composer-candle"></div>
      <h1 class="composer-title">给自己写一封信</h1>
      <p class="composer-subtitle">有些话，只说给自己听</p>
      <div class="composer-envelope-wrapper" id="envelopeWrapper">
        <div class="env-shell-top"></div>
        <div class="env-shell-body">
          <div class="env-shell-stamp"></div>
          <textarea id="letterInput" class="composer-textarea" placeholder="写点什么吧……" rows="2"></textarea>
        </div>
        <div class="env-shell-bottom"></div>
      </div>
      <div class="composer-guide-text" id="guideText">${initialPrompt}</div>
      <div class="composer-actions">
        <label class="composer-photo-btn" id="photoBtn" title="附一张照片">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>
          </svg>
          <span>照片</span>
          <input type="file" id="photoInput" accept="image/*" hidden>
        </label>
        <button class="composer-submit" id="submitBtn"><span class="btn-icon">✎</span><span class="btn-text">封缄</span></button>
      </div>
      <div id="photoPreview" class="photo-preview hidden"><img id="photoPreviewImg" alt=""><button id="photoRemove" class="photo-remove">&times;</button></div>
    </div>`;
  const textarea = container.querySelector('#letterInput'), guideText = container.querySelector('#guideText');
  const submitBtn = container.querySelector('#submitBtn'), photoInput = container.querySelector('#photoInput');
  const photoPreview = container.querySelector('#photoPreview'), photoPreviewImg = container.querySelector('#photoPreviewImg'), photoRemove = container.querySelector('#photoRemove');
  let currentImageData = null;
  guideText.addEventListener('click',()=>{textarea.value=guideText.textContent+'\n\n';textarea.focus();guideText.style.opacity='0';textarea.style.height='auto';textarea.style.height=Math.min(textarea.scrollHeight,160)+'px'});
  textarea.addEventListener('input',()=>{guideText.style.opacity=textarea.value.trim()?'0':'0.8';textarea.style.height='auto';textarea.style.height=Math.min(textarea.scrollHeight,160)+'px'});
  textarea.addEventListener('focus',()=>document.querySelector('.env-shell-body').classList.add('focused'));
  textarea.addEventListener('blur',()=>document.querySelector('.env-shell-body').classList.remove('focused'));
  photoInput.addEventListener('change',(e)=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=(ev)=>{currentImageData=ev.target.result;photoPreviewImg.src=currentImageData;photoPreview.classList.remove('hidden')};r.readAsDataURL(f)});
  photoRemove.addEventListener('click',()=>{currentImageData=null;photoPreview.classList.add('hidden');photoInput.value=''});
  submitBtn.addEventListener('click',async()=>{const c=textarea.value.trim();if(!c){guideText.style.animation='none';guideText.offsetHeight;guideText.style.animation='guidePulse 0.6s ease 2';return}
    submitBtn.disabled=true;submitBtn.querySelector('.btn-text').textContent='⋯'
    await foldIntoEnvelope(container,c,currentImageData);await createLetter(c,currentImageData)
    textarea.value='';textarea.style.height='auto';currentImageData=null;photoPreview.classList.add('hidden');photoInput.value='';guideText.style.opacity='0.8';submitBtn.disabled=false;submitBtn.querySelector('.btn-text').textContent='封缄'});
}
async function foldIntoEnvelope(container,content,imageData){
  const wrapper=container.querySelector('.composer-envelope-wrapper'),rect=wrapper.getBoundingClientRect()
  const paper=document.createElement('div');paper.className='fold-paper'
  const previewText=content.length>40?content.slice(0,40)+'…':content
  paper.innerHTML=`<div class="fold-paper-inner"><div class="fold-paper-content">${escapeHtml(previewText)}</div>${imageData?`<img class="fold-paper-img" src="${imageData}" alt="">`:''}</div>`
  const inner=paper.querySelector('.fold-paper-inner')
  paper.style.top=rect.top+'px';paper.style.left=rect.left+'px';paper.style.width=rect.width+'px';paper.style.height=rect.height+'px'
  document.body.appendChild(paper)
  requestAnimationFrame(()=>{paper.style.opacity='1';inner.style.transform='translateZ(40px)'})
  await delay(400)
  paper.style.transition='all 600ms cubic-bezier(.17,.67,.83,.67)';paper.style.perspective='900px'
  inner.style.transition='transform 600ms cubic-bezier(.17,.67,.83,.67)';inner.style.transform='translateZ(0) rotateX(180deg) scaleY(0.3)'
  await delay(700)
  paper.style.transition='all 500ms cubic-bezier(.17,.67,.83,.67)';paper.style.width='100px';paper.style.height='70px'
  paper.style.top='50%';paper.style.left='50%';paper.style.transform='translate(-50%,-50%) rotate(5deg)'
  paper.style.borderRadius='6px';paper.style.boxShadow='0 6px 24px rgba(0,0,0,0.15)'
  inner.style.transform='translateZ(0) rotateX(180deg) scaleY(0.15)'
  await delay(600)
  const flap=document.createElement('div');flap.className='fold-envelope-flap'
  flap.style.cssText='position:absolute;top:0;left:-2%;width:104%;height:100%;clip-path:polygon(0 0,100% 0,50% 70%);background:linear-gradient(145deg,#d4a574,#c4956a);border-radius:6px 6px 0 0;transform-origin:top center;transition:transform 400ms cubic-bezier(.17,.67,.83,.67);transform:rotateX(0deg);z-index:2'
  paper.appendChild(flap)
  const seal=document.createElement('div');seal.style.cssText='position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);width:18px;height:18px;background:#e8a87c;border-radius:50%;border:1px solid rgba(0,0,0,0.06);z-index:3;opacity:0;transition:opacity 300ms 200ms'
  paper.appendChild(seal);requestAnimationFrame(()=>seal.style.opacity='1')
  await delay(500);paper.style.opacity='0';await delay(300);paper.remove()
}

// =====================================================
// UI — 信封 + 取出动画 + 全屏
// =====================================================
let _unfoldDur = 600;
function createEnvelopeElement(letter) {
  const {style,content,imageData,id,createdAt}=letter;
  const el=document.createElement('div');el.className='gallery-envelope';el.dataset.id=id
  const patternCss=getPatternCss(style.pattern)
  const offsetX=(Math.random()-0.5)*40,offsetY=(Math.random()-0.5)*20
  el.style.setProperty('--env-primary',style.primary);el.style.setProperty('--env-secondary',style.secondary)
  el.style.width='120px';el.style.height='80px';el.style.setProperty('--env-rotation',style.rotation+'deg')
  el.style.boxShadow=`0 4px 14px ${style.shadowColor}`;el.style.marginTop=offsetY+'px';el.style.marginLeft=offsetX+'px'
  const dateStr=new Date(createdAt).toLocaleDateString('zh-CN',{month:'short',day:'numeric'})
  el.innerHTML=`<div class="env-flap" style="background:linear-gradient(135deg,${style.primary}aa,${style.secondary})"></div>
    <div class="env-body" style="background-color:${style.secondary};background-image:${patternCss};"></div>
    <div class="env-stamp" style="background:${style.primary}"></div>
    <div class="env-date">${dateStr}</div>
    <div class="env-preview"><span>${escapeHtml(content.slice(0,60))}${content.length>60?'…':''}</span>${imageData?'<span class="env-has-photo">📷</span>':''}</div>`
  let hoverTimer=null
  el.addEventListener('mouseenter',()=>{clearTimeout(hoverTimer);hoverTimer=setTimeout(()=>el.classList.add('env-expanded'),100)})
  el.addEventListener('mouseleave',()=>{clearTimeout(hoverTimer);el.classList.remove('env-expanded')})
  el.addEventListener('click',(e)=>{if(e.target.closest('.env-delete-btn'))return;takeOutAndOpen(letter,el)})
  return el
}
async function takeOutAndOpen(letter,el){
  const rect=el.getBoundingClientRect()
  const ae=document.createElement('div');ae.className='takeout-animation-envelope'
  ae.style.top=rect.top+'px';ae.style.left=rect.left+'px';ae.style.width=rect.width+'px';ae.style.height=rect.height+'px'
  const bodyBg = el.querySelector('.env-body').style.backgroundColor
  const bodyImg = el.querySelector('.env-body').style.backgroundImage
  ae.style.backgroundColor=bodyBg;ae.style.backgroundImage=bodyImg;ae.style.borderRadius='8px'
  const flapBg = el.querySelector('.env-flap').style.background
  ae.style.transform=`rotate(${getComputedStyle(el).getPropertyValue('--env-rotation')})`
  ae.style.boxShadow=el.style.boxShadow;ae.style.transformOrigin='center center'
  const flap=document.createElement('div');flap.className='takeout-flap'
  flap.style.cssText=`position:absolute;top:0;left:0;right:0;height:34%;clip-path:polygon(0 0,100% 0,50% 100%);background:${flapBg};transform-origin:top center`
  ae.appendChild(flap);document.body.appendChild(ae);el.style.visibility='hidden'
  await delay(10)
  ae.style.transition=`all ${transitionStr(_unfoldDur)}`
  ae.style.top='50%';ae.style.left='50%';ae.style.width='280px';ae.style.height='180px'
  ae.style.transform='translate(-50%,-50%) rotate(0deg)';ae.style.borderRadius='12px'
  ae.style.boxShadow='0 16px 48px rgba(0,0,0,0.16)'
  await delay(_unfoldDur+50)
  flap.style.transition=`transform ${transitionStr(_unfoldDur-100)}`;flap.style.transform='rotateX(-45deg)'
  await delay(_unfoldDur)
  ae.style.opacity='0';await delay(200);ae.remove();el.style.visibility=''
  showFullscreen(letter)
}
function showFullscreen(letter){
  document.body.style.overflow='hidden'
  const ov=document.createElement('div');ov.className='fullscreen-overlay'
  const hasImage=!!letter.imageData
  const imageAreaHtml=hasImage?`<div class="fullscreen-image-area"><img src="${letter.imageData}" alt="信中照片" class="fullscreen-image-img"></div>`:''
  ov.innerHTML=`<div class="fullscreen-letter${hasImage?' has-image':''}"><button class="fullscreen-close" aria-label="关闭">&times;</button>
    <div class="fullscreen-letter-inner">
      ${imageAreaHtml}
      <div class="fullscreen-text-area">
        <div class="fullscreen-stamp" style="background:${letter.style.primary}"></div>
        <div class="fullscreen-meta"><span class="fullscreen-date">${new Date(letter.createdAt).toLocaleString('zh-CN')}</span></div>
        <div class="fullscreen-content">${escapeHtml(letter.content)}</div>
        <button class="fullscreen-delete" data-id="${letter.id}">丢弃这封信</button>
      </div>
    </div></div>`
  document.body.appendChild(ov);requestAnimationFrame(()=>ov.classList.add('visible'))
  ov.querySelector('.fullscreen-close').addEventListener('click',()=>closeFullscreen(ov))
  ov.querySelector('.fullscreen-delete').addEventListener('click',async()=>{await deleteLetter(letter.id);closeFullscreen(ov)})
  ov.addEventListener('click',(e)=>{if(e.target===ov)closeFullscreen(ov)})
}
function closeFullscreen(ov){ov.classList.remove('visible');setTimeout(()=>{ov.remove();document.body.style.overflow=''},400)}

// =====================================================
// UI — 画廊
// =====================================================
function renderGallery(container){
  container.innerHTML=`<div class="gallery" id="gallery"><div class="gallery-header">
    <h2 class="gallery-title">寄往孤岛的信</h2><p class="gallery-subtitle">把鼠标移到信封上，它便会为你展开</p></div>
    <div class="gallery-stream" id="galleryStream"></div></div>`
  const stream=container.querySelector('#galleryStream')
  return { async refresh(){const letters=await getAllLetters();renderLetterStream(stream,letters)} }
}
function renderLetterStream(stream,letters){
  stream.innerHTML=''
  if(letters.length===0){stream.innerHTML='<div class="gallery-empty"><p>还没有写好的信</p><p class="gallery-empty-hint">在纸上写下你此刻的心情吧</p></div>';return}
  letters.forEach(l=>{const env=createEnvelopeElement(l);stream.appendChild(env)})
}

// =====================================================
// 辅助函数
// =====================================================
function escapeHtml(str){const d=document.createElement('div');d.textContent=str;return d.innerHTML}
function delay(ms){return new Promise(r=>setTimeout(r,ms))}

// =====================================================
// 入口
// =====================================================
document.addEventListener('DOMContentLoaded',async()=>{
  startParticles()
  renderComposer(document.getElementById('composerContainer'))
  const galleryCtrl=renderGallery(document.getElementById('galleryContainer'))
  await galleryCtrl.refresh()
  onEvent('letters-changed',()=>galleryCtrl.refresh())
  document.body.classList.add('page-entered')
});
</script>
</body>
