<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>乡链 · 农家直供 - 消费者端</title>
<style>
/* ===== CSS Reset & Variables ===== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #2E7D32;
  --primary-light: #4CAF50;
  --primary-dark: #1B5E20;
  --accent: #FF8F00;
  --accent-light: #FFB300;
  --bg: #F5F5F5;
  --card: #FFFFFF;
  --text: #212121;
  --text-secondary: #757575;
  --text-light: #9E9E9E;
  --border: #E0E0E0;
  --radius: 12px;
  --shadow: 0 2px 8px rgba(0,0,0,0.1);
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
}
html, body {
  height: 100%;
  font-family: var(--font);
  background: #E8E8E8;
  color: var(--text);
  overflow: hidden;
}

/* ===== Phone Frame ===== */
.phone-wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  perspective: 1000px;
}
.phone-frame {
  width: 375px;
  height: 812px;
  background: var(--bg);
  border-radius: 44px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3), 0 0 0 2px #333, inset 0 0 0 2px #555;
  position: relative;
  overflow: hidden;
}
/* Notch */
.phone-frame::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 150px;
  height: 30px;
  background: #333;
  border-radius: 0 0 20px 20px;
  z-index: 1000;
}

/* ===== Status Bar ===== */
.status-bar {
  height: 44px;
  background: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 16px;
  padding-top: 6px;
  position: relative;
  z-index: 100;
}
.status-bar .title {
  color: #fff;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 1px;
}
.status-bar .back-btn {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(calc(-50% + 3px));
  color: #fff;
  font-size: 22px;
  cursor: pointer;
  display: none;
  background: none;
  border: none;
  padding: 4px 8px;
  line-height: 1;
}
.status-bar .back-btn.visible { display: block; }
.status-bar .status-icons {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(calc(-50% + 3px));
  color: #fff;
  font-size: 12px;
  display: flex;
  gap: 4px;
  align-items: center;
}

/* ===== Main Content Area ===== */
.main-content {
  height: calc(812px - 44px - 56px);
  overflow: hidden;
  position: relative;
}
.page {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  background: var(--bg);
  transition: transform 0.35s cubic-bezier(0.4,0,0.2,1), opacity 0.35s ease;
  -webkit-overflow-scrolling: touch;
}
.page.hidden {
  transform: translateX(100%);
  opacity: 0;
  pointer-events: none;
}
.page.hidden-left {
  transform: translateX(-30%);
  opacity: 0;
  pointer-events: none;
}
.page.active {
  transform: translateX(0);
  opacity: 1;
  pointer-events: auto;
}

/* Detail page overlay */
.detail-page {
  z-index: 50;
}

/* ===== Bottom Tab Bar ===== */
.tab-bar {
  height: 56px;
  background: var(--card);
  display: flex;
  align-items: center;
  justify-content: space-around;
  border-top: 1px solid var(--border);
  position: relative;
  z-index: 100;
  padding-bottom: 4px;
}
.tab-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  padding: 4px 0;
  flex: 1;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.tab-item .tab-icon {
  width: 24px;
  height: 24px;
  margin-bottom: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.tab-item .tab-icon svg {
  width: 22px;
  height: 22px;
  fill: var(--text-light);
  transition: fill 0.2s;
}
.tab-item.active .tab-icon svg { fill: var(--primary); }
.tab-item .tab-label {
  font-size: 10px;
  color: var(--text-light);
  transition: color 0.2s;
}
.tab-item.active .tab-label { color: var(--primary); font-weight: 600; }

/* ===== Tab1: 认证商家 ===== */
.search-bar {
  padding: 12px 16px 8px;
  background: var(--primary);
}
.search-input-wrap {
  display: flex;
  align-items: center;
  background: rgba(255,255,255,0.95);
  border-radius: 24px;
  padding: 8px 14px;
  gap: 8px;
}
.search-input-wrap svg { width: 18px; height: 18px; fill: var(--text-light); flex-shrink: 0; }
.search-input-wrap input {
  border: none;
  outline: none;
  font-size: 14px;
  width: 100%;
  background: transparent;
  font-family: var(--font);
}
.search-input-wrap input::placeholder { color: var(--text-light); }

/* View Toggle */
.view-toggle-bar {
  display: flex;
  justify-content: flex-end;
  padding: 10px 16px 6px;
  gap: 8px;
}
.view-toggle-btn {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 12px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text-secondary);
  transition: all 0.25s;
}
.view-toggle-btn.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}
.view-toggle-btn svg { width: 14px; height: 14px; }

/* Merchant List */
.merchant-list {
  padding: 8px 16px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.merchant-list.fade-out {
  opacity: 0;
  transform: scale(0.97);
  transition: all 0.3s;
}
.merchant-list.fade-in {
  opacity: 1;
  transform: scale(1);
  transition: all 0.3s;
}
.merchant-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}
.merchant-card:active { transform: scale(0.98); }
.merchant-card .card-img {
  height: 130px;
  position: relative;
}
.merchant-card .card-img .badge {
  position: absolute;
  top: 10px;
  left: 10px;
  background: var(--primary);
  color: #fff;
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  gap: 3px;
}
.merchant-card .card-img .badge svg { width: 12px; height: 12px; fill: #fff; }
.merchant-card .card-body {
  padding: 12px;
}
.merchant-card .card-body .name {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 6px;
}
.merchant-card .card-body .meta {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 8px;
}
.merchant-card .card-body .meta .rating {
  color: var(--accent);
  font-weight: 600;
}
.merchant-card .card-body .tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.merchant-card .card-body .tags span {
  background: #E8F5E9;
  color: var(--primary);
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 8px;
}

/* Map View */
.map-view {
  display: none;
  padding: 12px 16px;
  animation: fadeIn 0.35s ease;
}
.map-view.visible { display: block; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.map-container {
  width: 100%;
  height: 480px;
  border-radius: var(--radius);
  overflow: hidden;
  position: relative;
  box-shadow: var(--shadow);
  background: #E8F5E9;
}
.map-bg {
  width: 100%;
  height: 100%;
  position: absolute;
  top: 0; left: 0;
  background:
    linear-gradient(90deg, rgba(46,125,50,0.06) 1px, transparent 1px),
    linear-gradient(rgba(46,125,50,0.06) 1px, transparent 1px),
    linear-gradient(135deg, #E8F5E9 0%, #C8E6C9 30%, #DCEDC8 60%, #F1F8E9 100%);
  background-size: 30px 30px, 30px 30px, 100% 100%;
}
/* Simulated roads */
.map-road {
  position: absolute;
  background: rgba(255,255,255,0.7);
}
.map-road.h1 { top: 30%; left: 0; width: 100%; height: 3px; }
.map-road.h2 { top: 60%; left: 0; width: 100%; height: 4px; background: rgba(255,255,255,0.85); }
.map-road.v1 { left: 25%; top: 0; height: 100%; width: 3px; }
.map-road.v2 { left: 55%; top: 0; height: 100%; width: 4px; background: rgba(255,255,255,0.85); }
.map-road.v3 { left: 80%; top: 0; height: 100%; width: 3px; }
/* Map blocks */
.map-block {
  position: absolute;
  border-radius: 4px;
  opacity: 0.35;
}
/* Map markers */
.map-marker {
  position: absolute;
  cursor: pointer;
  z-index: 10;
  transition: transform 0.2s;
  animation: markerDrop 0.5s ease-out;
}
.map-marker:hover { transform: scale(1.2); }
@keyframes markerDrop {
  from { transform: translateY(-30px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.map-marker .pin {
  width: 32px;
  height: 40px;
  position: relative;
}
.map-marker .pin-head {
  width: 32px;
  height: 32px;
  background: var(--primary);
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}
.map-marker .pin-head svg {
  transform: rotate(45deg);
  width: 16px;
  height: 16px;
  fill: #fff;
}
.map-marker .pin-shadow {
  width: 14px;
  height: 4px;
  background: rgba(0,0,0,0.2);
  border-radius: 50%;
  margin: 2px auto 0;
}
.map-marker .pin-label {
  position: absolute;
  top: -8px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--card);
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 10px;
  white-space: nowrap;
  box-shadow: 0 1px 4px rgba(0,0,0,0.15);
  font-weight: 500;
}
/* Map popup */
.map-popup {
  display: none;
  position: absolute;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  padding: 14px;
  z-index: 20;
  width: 220px;
  animation: popIn 0.25s ease;
}
.map-popup.show { display: block; }
@keyframes popIn {
  from { transform: scale(0.8); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.map-popup .popup-close {
  position: absolute;
  top: 8px;
  right: 10px;
  background: none;
  border: none;
  font-size: 16px;
  cursor: pointer;
  color: var(--text-light);
}
.map-popup .popup-name {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 4px;
}
.map-popup .popup-info {
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 8px;
}
.map-popup .popup-link {
  color: var(--primary);
  font-size: 12px;
  cursor: pointer;
  font-weight: 500;
}

/* ===== Detail Page ===== */
.detail-page {
  background: var(--bg);
}
.detail-hero {
  height: 200px;
  position: relative;
}
.detail-hero .overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 60px;
  background: linear-gradient(transparent, rgba(0,0,0,0.4));
}
.detail-content {
  padding: 16px;
  padding-bottom: 80px;
}
.detail-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.detail-header .d-name {
  font-size: 20px;
  font-weight: 700;
}
.detail-header .d-badge {
  background: var(--primary);
  color: #fff;
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  gap: 3px;
}
.detail-header .d-badge svg { width: 12px; height: 12px; fill: #fff; }
.detail-address {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  padding: 12px;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.detail-address .addr-text {
  font-size: 13px;
  color: var(--text-secondary);
  flex: 1;
}
.detail-address .nav-btn {
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--primary);
  color: #fff;
  border: none;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
}
.detail-address .nav-btn svg { width: 14px; height: 14px; fill: #fff; }

/* Section */
.section {
  margin-bottom: 20px;
}
.section-title {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.section-title .icon {
  width: 20px;
  height: 20px;
  background: var(--primary);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.section-title .icon svg { width: 12px; height: 12px; fill: #fff; }

/* Procurement Records */
.procurement-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.procurement-item {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--card);
  padding: 12px;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.procurement-item .p-thumb {
  width: 50px;
  height: 50px;
  border-radius: 8px;
  flex-shrink: 0;
}
.procurement-item .p-info {
  flex: 1;
}
.procurement-item .p-date {
  font-size: 11px;
  color: var(--text-light);
  margin-bottom: 3px;
}
.procurement-item .p-desc {
  font-size: 13px;
  font-weight: 500;
}
.procurement-item .p-farmer {
  font-size: 11px;
  color: var(--primary);
  margin-top: 2px;
}

/* Traceable Dishes */
.dish-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.dish-item {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--card);
  padding: 12px;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.dish-item .dish-thumb {
  width: 56px;
  height: 56px;
  border-radius: 8px;
  flex-shrink: 0;
}
.dish-item .dish-info { flex: 1; }
.dish-item .dish-name {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 4px;
}
.dish-item .dish-source {
  font-size: 11px;
  color: var(--text-secondary);
}
.dish-item .trace-tag {
  background: #E8F5E9;
  color: var(--primary);
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  gap: 3px;
  white-space: nowrap;
}
.dish-item .trace-tag svg { width: 10px; height: 10px; fill: var(--primary); }

/* Reviews */
.review-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.review-item {
  background: var(--card);
  padding: 14px;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.review-item .r-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.review-item .r-user {
  font-size: 13px;
  font-weight: 600;
}
.review-item .r-stars {
  color: var(--accent);
  font-size: 13px;
  letter-spacing: 1px;
}
.review-item .r-text {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.5;
}
.review-item .r-date {
  font-size: 11px;
  color: var(--text-light);
  margin-top: 6px;
}

/* Write Review Button */
.write-review-btn {
  position: fixed;
  bottom: 70px;
  left: 50%;
  transform: translateX(calc(-50% + 0px));
  width: 343px;
  padding: 14px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 28px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(255,143,0,0.4);
  z-index: 60;
  display: none;
  font-family: var(--font);
  transition: transform 0.2s;
}
.write-review-btn:active { transform: translateX(-50%) scale(0.97); }
.write-review-btn.visible { display: block; }

/* ===== Review Modal ===== */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  justify-content: center;
  align-items: flex-end;
}
.modal-overlay.show { display: flex; }
.modal-content {
  background: var(--card);
  width: 375px;
  border-radius: 20px 20px 0 0;
  padding: 24px 20px 32px;
  animation: slideUp 0.35s ease;
  max-height: 70vh;
  overflow-y: auto;
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.modal-header h3 { font-size: 18px; font-weight: 600; }
.modal-close {
  background: none;
  border: none;
  font-size: 22px;
  cursor: pointer;
  color: var(--text-light);
  padding: 4px;
}
.modal-label {
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 10px;
  color: var(--text);
}
.star-rating {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}
.star-rating .star {
  width: 36px;
  height: 36px;
  cursor: pointer;
  transition: transform 0.15s;
}
.star-rating .star:hover { transform: scale(1.15); }
.star-rating .star svg { width: 36px; height: 36px; fill: var(--border); }
.star-rating .star.active svg { fill: var(--accent); }
.review-textarea {
  width: 100%;
  height: 100px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  font-size: 14px;
  font-family: var(--font);
  resize: none;
  outline: none;
  margin-bottom: 16px;
  transition: border-color 0.2s;
}
.review-textarea:focus { border-color: var(--primary); }
.submit-review-btn {
  width: 100%;
  padding: 14px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 28px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  font-family: var(--font);
  transition: background 0.2s;
}
.submit-review-btn:active { background: var(--primary-dark); }

/* ===== Tab2: 溯源地图 ===== */
.trace-map-intro {
  padding: 16px;
  text-align: center;
}
.trace-map-intro p {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.6;
  background: var(--card);
  padding: 14px;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.trace-map-container {
  margin: 0 16px 16px;
  height: 320px;
  border-radius: var(--radius);
  overflow: hidden;
  position: relative;
  box-shadow: var(--shadow);
}
.trace-recommend {
  padding: 0 16px 16px;
}
.trace-recommend .section-title { margin-bottom: 12px; }
.recommend-card {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--card);
  padding: 14px;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 10px;
  cursor: pointer;
  transition: transform 0.2s;
}
.recommend-card:active { transform: scale(0.98); }
.recommend-card .rc-img {
  width: 56px;
  height: 56px;
  border-radius: 10px;
  flex-shrink: 0;
}
.recommend-card .rc-info { flex: 1; }
.recommend-card .rc-name {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 4px;
}
.recommend-card .rc-record {
  font-size: 11px;
  color: var(--text-secondary);
}
.recommend-card .rc-arrow {
  color: var(--text-light);
  font-size: 18px;
}

/* ===== Tab3: 我的 ===== */
.profile-header {
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  padding: 30px 20px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.profile-avatar {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: linear-gradient(135deg, #FFB74D, #FF8F00);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  color: #fff;
  font-weight: 700;
  border: 3px solid rgba(255,255,255,0.4);
}

// ===== State =====
var currentTab = 'merchants';
var currentView = 'list';
var currentDetailId = null;
var reviewRating = 0;
var popupMerchantId = null;

// ===== Init =====
function init() {
  renderMerchantList();
  renderMapMarkers();
  renderTraceMapMarkers();
  renderTraceRecommend();
  initStarRating();
}

// ===== Render Merchant List =====
function renderMerchantList() {
  var html = '';
  merchants.forEach(function(m) {
    html += '<div class="merchant-card" onclick="openDetail(' + m.id + ')">';
    html += '  <div class="card-img" style="background:' + m.gradient + ';">';
    html += '    <div class="badge"><svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>平台实地验真</div>';
    html += '  </div>';
    html += '  <div class="card-body">';
    html += '    <div class="name">' + m.name + '</div>';
    html += '    <div class="meta">';
    html += '      <span class="rating">&#9733; ' + m.rating + '分</span>';
    html += '      <span>' + m.distance + '</span>';
    html += '    </div>';
    html += '    <div class="tags">';
    m.tags.forEach(function(t) { html += '<span>' + t + '</span>'; });
    html += '    </div>';
    html += '  </div>';
    html += '</div>';
  });
  document.getElementById('merchantList').innerHTML = html;
}

// ===== Render Map Markers =====
function renderMapMarkers() {
  var container = document.getElementById('mapContainer');
  merchants.forEach(function(m, i) {
    var marker = document.createElement('div');
    marker.className = 'map-marker';
    marker.style.top = m.mapPos.top;
    marker.style.left = m.mapPos.left;
    marker.style.animationDelay = (i * 0.1) + 's';
    marker.innerHTML = '<div class="pin-label">' + m.name + '</div>' +
      '<div class="pin"><div class="pin-head"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg></div></div>' +
      '<div class="pin-shadow"></div>';
    marker.onclick = function(e) {
      e.stopPropagation();
      showMapPopup(m.id, m.mapPos.top, m.mapPos.left);
    };
    container.appendChild(marker);
  });
}

// ===== Render Trace Map Markers =====
function renderTraceMapMarkers() {
  var container = document.querySelector('.trace-map-container');
  merchants.forEach(function(m, i) {
    var marker = document.createElement('div');
    marker.className = 'map-marker';
    marker.style.top = m.traceMapPos.top;
    marker.style.left = m.traceMapPos.left;
    marker.style.animationDelay = (i * 0.12) + 's';
    marker.innerHTML = '<div class="pin-label">' + m.name + '</div>' +
      '<div class="pin"><div class="pin-head" style="background:var(--accent);"><svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg></div></div>' +
      '<div class="pin-shadow"></div>';
    marker.onclick = function(e) {
      e.stopPropagation();
      showTraceMapPopup(m, marker);
    };
    container.appendChild(marker);
  });
}

function showTraceMapPopup(m, markerEl) {
  var existing = document.querySelector('.trace-map-container .map-popup');
  if (existing) existing.remove();

  var popup = document.createElement('div');
  popup.className = 'map-popup show';
  var rect = markerEl.getBoundingClientRect();
  var containerRect = document.querySelector('.trace-map-container').getBoundingClientRect();
  var top = parseFloat(markerEl.style.top) + 12;
  var left = parseFloat(markerEl.style.left) - 10;
  if (left + 60 > 90) left = parseFloat(markerEl.style.left) - 55;
  popup.style.top = top + '%';
  popup.style.left = left + '%';
  popup.innerHTML = '<button class="popup-close" onclick="this.parentElement.remove()">&times;</button>' +
    '<div class="popup-name">' + m.name + '</div>' +
    '<div class="popup-info">最近采购：' + m.procurement[0].date + ' | ' + m.procurement[0].farmer + ' | ' + m.procurement[0].item + '</div>' +
    '<div class="popup-link" onclick="openDetail(' + m.id + ')">查看详情 &rarr;</div>';
  document.querySelector('.trace-map-container').appendChild(popup);
}

// ===== Render Trace Recommend =====
function renderTraceRecommend() {
  var html = '';
  var recommended = [merchants[0], merchants[2], merchants[3]];
  recommended.forEach(function(m) {
    html += '<div class="recommend-card" onclick="openDetail(' + m.id + ')">';
    html += '  <div class="rc-img" style="background:' + m.gradient + ';"></div>';
    html += '  <div class="rc-info">';
    html += '    <div class="rc-name">' + m.name + ' &nbsp;<span style="color:var(--accent);font-size:12px;">&#9733; ' + m.rating + '</span></div>';
    html += '    <div class="rc-record">今日采购：' + m.procurement[0].farmer + ' - ' + m.procurement[0].item + '</div>';
    html += '  </div>';
    html += '  <div class="rc-arrow">&#8250;</div>';
    html += '</div>';
  });
  document.getElementById('traceRecommendList').innerHTML = html;
}

// ===== Tab Switching =====
function switchTab(tab) {
  if (tab === currentTab) return;
  // Close detail if open
  if (currentDetailId !== null) {
    closeDetail();
  }

  var tabs = { merchants: 'pageMerchants', traceMap: 'pageTraceMap', profile: 'pageProfile' };
  // Hide all pages
  Object.keys(tabs).forEach(function(key) {
    var el = document.getElementById(tabs[key]);
    if (key === tab) {
      el.className = 'page active';
    } else {
      el.className = 'page hidden';
    }
  });

  // Update tab bar
  document.querySelectorAll('.tab-item').forEach(function(item) {
    if (item.dataset.tab === tab) {
      item.classList.add('active');
    } else {
      item.classList.remove('active');
    }
  });

  currentTab = tab;
  document.getElementById('statusTitle').textContent = '乡链 · 农家直供';
  document.getElementById('backBtn').classList.remove('visible');
  document.getElementById('writeReviewBtn').classList.remove('visible');
  document.getElementById('tabBar').style.display = 'flex';
}

// ===== View Switching =====
function switchView(view) {
  if (view === currentView) return;
  var listEl = document.getElementById('merchantList');
  var mapEl = document.getElementById('mapView');
  var listBtn = document.getElementById('listViewBtn');
  var mapBtn = document.getElementById('mapViewBtn');

  if (view === 'map') {
    listEl.classList.add('fade-out');
    setTimeout(function() {
      listEl.style.display = 'none';
      listEl.classList.remove('fade-out');
      mapEl.classList.add('visible');
    }, 300);
    listBtn.classList.remove('active');
    mapBtn.classList.add('active');
  } else {
    mapEl.classList.remove('visible');
    listEl.style.display = 'flex';
    listEl.classList.add('fade-in');
    setTimeout(function() { listEl.classList.remove('fade-in'); }, 300);
    mapBtn.classList.remove('active');
    listBtn.classList.add('active');
  }
  currentView = view;
}

// ===== Map Popup =====
function showMapPopup(merchantId, top, left) {
  var m = merchants.find(function(x) { return x.id === merchantId; });
  if (!m) return;
  popupMerchantId = merchantId;
  var popup = document.getElementById('mapPopup');
  document.getElementById('popupName').textContent = m.name;
  document.getElementById('popupInfo').innerHTML = '&#9733; ' + m.rating + '分 | ' + m.distance + '<br>最近采购：' + m.procurement[0].farmer + ' - ' + m.procurement[0].item;
  var pTop = parseFloat(top) + 8;
  var pLeft = parseFloat(left) - 5;
  if (pLeft + 60 > 95) pLeft = parseFloat(left) - 55;
  if (pTop + 25 > 90) pTop = parseFloat(top) - 25;
  popup.style.top = pTop + '%';
  popup.style.left = pLeft + '%';
  popup.classList.add('show');
}

function closePopup() {
  document.getElementById('mapPopup').classList.remove('show');
  popupMerchantId = null;
}

function openDetailFromPopup() {
  if (popupMerchantId) {
    closePopup();
    openDetail(popupMerchantId);
  }
}

// ===== Detail Page =====

  var m = merchants.find(function(x) { return x.id === id; });

  html += '<div class="detail-header">';

    html += '</div>';

  html += '</div>';

  // Dishes Section
  html += '<div class="section">';
  html += '  <div class="section-title"><span class="icon"><svg viewBox="0 0 24 24"><path d="M8.1 13.34l2.83-2.83L3.91 3.5c-1.56 1.56-1.56 4.09 0 5.66l4.19 4.18zm6.78-1.81c1.53.71 3.68.21 5.27-1.38 1.91-1.91 2.28-4.65.81-6.12-1.46-1.46-4.2-1.1-6.12.81-1.59 1.59-2.09 3.74-1.38 5.27L3.7 19.87l1.41 1.41L12 14.41l6.88 6.88 1.41-1.41L13.41 13l1.47-1.47z"/></svg></span>溯源菜品</div>';

    html += '  <div class="dish-info">';

    html += '    <div class="dish-source">' + d.source + '</div>';
    html += '  </div>';
    html += '  <div class="trace-tag"><svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>可溯源</div>';

function closeDetail() {
  currentDetailId = null;
  document.getElementById('pageDetail').className = 'page detail-page hidden';
  document.getElementById('writeReviewBtn').classList.remove('visible');
  document.getElementById('backBtn').classList.remove('visible');
  document.getElementById('tabBar').style.display = 'flex';
  // Restore correct page
  switchTab(currentTab);
}

function goBack() {
  if (currentDetailId !== null) {
    closeDetail();
  }
}

// ===== Review Modal =====
function initStarRating() {
  var html = '';
  for (var i = 1; i <= 5; i++) {
    html += '<div class="star" data-value="' + i + '" onclick="setRating(' + i + ')">';
    html += '<svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>';
    html += '</div>';
  }
  document.getElementById('starRating').innerHTML = html;
}

function setRating(val) {
  reviewRating = val;
  var stars = document.querySelectorAll('#starRating .star');
  stars.forEach(function(s, i) {
    if (i < val) {
      s.classList.add('active');
    } else {
      s.classList.remove('active');
    }
  });
}

function openReviewModal() {
  reviewRating = 0;
  document.querySelectorAll('#starRating .star').forEach(function(s) { s.classList.remove('active'); });
  document.getElementById('reviewText').value = '';
  document.getElementById('reviewModal').classList.add('show');
}

function closeReviewModal() {
  document.getElementById('reviewModal').classList.remove('show');
}

function submitReview() {
  if (reviewRating === 0) {
    showToast('请先选择评分');
    return;
  }
  var text = document.getElementById('reviewText').value.trim();
  if (!text) {
    showToast('请填写评价内容');
    return;
  }
  closeReviewModal();
  showToast('评价提交成功，感谢您的反馈！');
}

// ===== Toast =====
function showToast(msg) {
  var toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(function() { toast.classList.remove('show'); }, 2000);
}

// ===== Click outside map popup to close =====
document.addEventListener('click', function(e) {
  if (!e.target.closest('.map-marker') && !e.target.closest('.map-popup')) {
    closePopup();
    var tracePopup = document.querySelector('.trace-map-container .map-popup');
    if (tracePopup) tracePopup.remove();
  }
});

// ===== Start =====
init();
</script>
