<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>乡链 · 企业端</title>
<style>
/* ========== RESET & BASE ========== */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  background: #E8E8E8;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px 0;
}

/* ========== PHONE FRAME ========== */
.phone-frame {
  width: 375px;
  height: 812px;
  background: #F5F5F5;
  border-radius: 40px;
  border: 8px solid #1a1a1a;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3), inset 0 0 0 2px #333;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ========== STATUS BAR ========== */
.status-bar {
  height: 44px;
  background: #2E7D32;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}
.status-bar::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 120px; height: 24px;
  background: #1a1a1a;
  border-radius: 0 0 16px 16px;
}
.status-bar-text {
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 1px;
  z-index: 1;
}

/* ========== MAIN CONTENT AREA ========== */
.main-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  position: relative;
}
.main-content::-webkit-scrollbar { display: none; }

.tab-page {
  display: none;
  padding: 16px;
  padding-bottom: 20px;
  min-height: 100%;
  animation: fadeIn 0.25s ease;
}
.tab-page.active { display: block; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ========== BOTTOM TAB BAR ========== */
.tab-bar {
  height: 64px;
  background: #fff;
  display: flex;
  align-items: stretch;
  border-top: 1px solid #e0e0e0;
  flex-shrink: 0;
  padding-bottom: 8px;
}
.tab-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  cursor: pointer;
  color: #999;
  transition: color 0.2s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.tab-item.active { color: #2E7D32; }
.tab-item svg { width: 22px; height: 22px; }
.tab-item span { font-size: 10px; font-weight: 500; }

/* ========== COMMON COMPONENTS ========== */
.card {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  padding: 14px;
  margin-bottom: 12px;
}
.btn-primary {
  background: #2E7D32;
  color: #fff;
  border: none;
  border-radius: 12px;
  padding: 12px 24px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.btn-primary:active { transform: scale(0.96); opacity: 0.85; }
.btn-orange {
  background: #FF8F00;
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-orange:active { transform: scale(0.96); opacity: 0.85; }
.btn-outline {
  background: #fff;
  color: #2E7D32;
  border: 1.5px solid #2E7D32;
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-outline:active { transform: scale(0.96); background: #f0f7f0; }
.btn-small {
  padding: 6px 12px;
  font-size: 12px;
  border-radius: 6px;
}
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
}
.badge-green { background: #E8F5E9; color: #2E7D32; }
.badge-orange { background: #FFF3E0; color: #FF8F00; }
.badge-gray { background: #EEEEEE; color: #757575; }
.section-title {
  font-size: 16px;
  font-weight: 700;
  color: #333;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ========== MODAL ========== */
.modal-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.45);
  z-index: 100;
  display: none;
  align-items: flex-end;
  justify-content: center;
  animation: fadeInOverlay 0.2s;
}
.modal-overlay.show { display: flex; }
@keyframes fadeInOverlay {
  from { opacity: 0; } to { opacity: 1; }
}
.modal-content {
  background: #fff;
  width: 100%;
  border-radius: 16px 16px 0 0;
  padding: 20px 16px 28px;
  max-height: 85%;
  overflow-y: auto;
  animation: slideUp 0.3s ease;
}
@keyframes slideUp {
  from { transform: translateY(100%); } to { transform: translateY(0); }
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.modal-title { font-size: 17px; font-weight: 700; color: #333; }
.modal-close {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: #f0f0f0;
  border: none;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #666;
}
.modal-close:active { background: #ddd; }

/* Center modal variant */
.modal-overlay.center-modal {
  align-items: center;
  padding: 24px;
}
.modal-overlay.center-modal .modal-content {
  border-radius: 16px;
  max-height: 70%;
}

/* ========== TOAST ========== */
.toast {
  position: absolute;
  top: 60px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: rgba(46,125,50,0.92);
  color: #fff;
  padding: 10px 22px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 500;
  z-index: 200;
  opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ============================================ */
/* TAB 1: 需求管理                               */
/* ============================================ */
.publish-btn-wrap { margin-bottom: 16px; }
.publish-btn {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.demand-card { position: relative; }
.demand-card .demand-title {
  font-size: 15px;
  font-weight: 700;
  color: #333;
  margin-bottom: 6px;
}
.demand-card .demand-spec {
  font-size: 12px;
  color: #888;
  margin-bottom: 8px;
}
.demand-card .demand-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
}
.demand-card .demand-info {
  display: flex;
  gap: 12px;
  font-size: 13px;
  color: #555;
}
.demand-card .demand-info strong { color: #FF8F00; }
.demand-card .demand-right {
  display: flex;
  align-items: center;
  gap: 8px;
}
.demand-card .respond-count {
  font-size: 12px;
  color: #2E7D32;
  font-weight: 600;
}

/* Form styles */
.form-group {
  margin-bottom: 14px;
}
.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: #555;
  margin-bottom: 6px;
}
.form-group input,
.form-group textarea,
.form-group select {
  width: 100%;
  padding: 10px 12px;
  border: 1.5px solid #ddd;
  border-radius: 8px;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
  font-family: inherit;
}
.form-group input:focus,
.form-group textarea:focus {
  border-color: #2E7D32;
}
.form-group textarea { resize: none; height: 60px; }
.form-row {
  display: flex;
  gap: 10px;
}
.form-row .form-group { flex: 1; }
.voice-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
  padding: 10px;
  border: 1.5px dashed #2E7D32;
  border-radius: 8px;
  background: #f0f7f0;
  color: #2E7D32;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.voice-btn:active { background: #e0efe0; }
.voice-btn.recording {
  background: #E8F5E9;
  border-color: #1B5E20;
  animation: pulse 1s infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(46,125,50,0.3); }
  50% { box-shadow: 0 0 0 8px rgba(46,125,50,0); }
}
.voice-wave {
  display: none;
  align-items: center;
  justify-content: center;
  gap: 3px;
  height: 20px;
}
.voice-btn.recording .voice-wave { display: flex; }
.voice-btn.recording .voice-text { display: none; }
.voice-bar {
  width: 3px;
  background: #2E7D32;
  border-radius: 2px;
  animation: wave 0.6s ease-in-out infinite;
}
.voice-bar:nth-child(1) { height: 8px; animation-delay: 0s; }
.voice-bar:nth-child(2) { height: 14px; animation-delay: 0.1s; }
.voice-bar:nth-child(3) { height: 10px; animation-delay: 0.2s; }
.voice-bar:nth-child(4) { height: 16px; animation-delay: 0.3s; }
.voice-bar:nth-child(5) { height: 8px; animation-delay: 0.4s; }
@keyframes wave {
  0%, 100% { transform: scaleY(1); }
  50% { transform: scaleY(0.4); }
}

/* ============================================ */
/* TAB 2: 接单大厅                               */
/* ============================================ */
.farmer-card {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.farmer-avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: #E8F5E9;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
  color: #2E7D32;
  border: 2px solid #C8E6C9;
}
.farmer-info { flex: 1; }
.farmer-name {
  font-size: 15px;
  font-weight: 700;
  color: #333;
  margin-bottom: 4px;
}
.farmer-tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 6px;
}
.farmer-tag {
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 4px;
  background: #FFF8E1;
  color: #F57F17;
}
.farmer-tag.green {
  background: #E8F5E9;
  color: #2E7D32;
}
.farmer-quote {
  font-size: 14px;
  color: #FF8F00;
  font-weight: 700;
  margin-bottom: 8px;
}
.farmer-actions {
  display: flex;
  gap: 8px;
}
.call-modal-body {
  text-align: center;
  padding: 10px 0;
}
.virtual-number {
  font-size: 28px;
  font-weight: 800;
  color: #2E7D32;
  letter-spacing: 2px;
  margin: 12px 0;
}
.call-timer {
  font-size: 18px;
  color: #666;
  margin-bottom: 16px;
  font-variant-numeric: tabular-nums;
}
.call-status {
  font-size: 13px;
  color: #999;
  margin-bottom: 16px;
}
.hangup-btn {
  width: 56px; height: 56px;
  border-radius: 50%;
  background: #f44336;
  border: none;
  color: #fff;
  font-size: 22px;
  cursor: pointer;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}
.hangup-btn:active { transform: scale(0.92); }

/* ============================================ */
/* TAB 3: 账单                                   */
/* ============================================ */
.bill-summary {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
}
.bill-summary-card {
  flex: 1;
  background: #fff;
  border-radius: 12px;
  padding: 14px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.bill-summary-card .label {
  font-size: 12px;
  color: #999;
  margin-bottom: 6px;
}
.bill-summary-card .amount {
  font-size: 22px;
  font-weight: 800;
}
.bill-summary-card .amount.orange { color: #FF8F00; }
.bill-summary-card .amount.green { color: #2E7D32; }
.bill-card .bill-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.bill-card .bill-farmer {
  font-size: 15px;
  font-weight: 700;
  color: #333;
}
.bill-card .bill-detail {
  font-size: 13px;
  color: #666;
  margin-bottom: 4px;
}
.bill-card .bill-amount {
  font-size: 18px;
  font-weight: 800;
  color: #FF8F00;
  margin-bottom: 8px;
}
.bill-card .bill-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.bill-card .bill-left {
  display: flex;
  align-items: center;
  gap: 8px;
}
.checkin-thumb {
  width: 32px;
  height: 32px;
  border-radius: 6px;
  background: #E8F5E9;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}
.confirm-modal-body {
  text-align: center;
  padding: 10px 0;
}
.confirm-modal-body .confirm-icon {
  font-size: 48px;
  margin-bottom: 10px;
}
.confirm-modal-body .confirm-text {
  font-size: 15px;
  color: #555;
  margin-bottom: 6px;
}
.confirm-modal-body .confirm-amount {
  font-size: 24px;
  font-weight: 800;
  color: #FF8F00;
  margin-bottom: 16px;
}

/* ============================================ */
/* TAB 4: 商家主页                               */
/* ============================================ */
.shop-header {
  text-align: center;
  padding: 10px 0 6px;
}
.shop-avatar {
  width: 64px;
  height: 64px;
  border-radius: 16px;
  background: linear-gradient(135deg, #2E7D32, #43A047);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  margin: 0 auto 10px;
  box-shadow: 0 4px 12px rgba(46,125,50,0.3);
}
.shop-name {
  font-size: 18px;
  font-weight: 800;
  color: #333;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.verified-badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  background: #E8F5E9;
  color: #2E7D32;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 10px;
}
.shop-address {
  font-size: 13px;
  color: #888;
  margin-bottom: 4px;
}
.publicity-item {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid #f0f0f0;
}
.publicity-item:last-child { border-bottom: none; }
.publicity-thumb {
  width: 48px;
  height: 48px;
  border-radius: 8px;
  background: linear-gradient(135deg, #C8E6C9, #A5D6A7);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}
.publicity-info { flex: 1; }
.publicity-title {
  font-size: 14px;
  font-weight: 600;
  color: #333;
  margin-bottom: 2px;
}
.publicity-date {
  font-size: 12px;
  color: #999;
}
.publicity-check {
  color: #2E7D32;
  font-size: 12px;
  font-weight: 600;
}
.forward-btn {
  width: 100%;
  margin: 12px 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.review-card {
  padding: 12px 0;
  border-bottom: 1px solid #f0f0f0;
}
.review-card:last-child { border-bottom: none; }
.review-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.review-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #FFF3E0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}
.review-name { font-size: 13px; font-weight: 600; color: #333; }
.review-stars { color: #FF8F00; font-size: 12px; letter-spacing: 1px; }
.review-text { font-size: 13px; color: #555; line-height: 1.5; }
.review-date { font-size: 11px; color: #bbb; margin-top: 4px; }
</style>
</head>
<body>

<!-- ==================== PHONE FRAME ==================== -->
<div class="phone-frame">

  <!-- STATUS BAR -->
  <div class="status-bar">
    <span class="status-bar-text">乡链 · 企业端</span>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <!-- MAIN CONTENT -->
  <div class="main-content">

    <!-- ========== TAB 1: 需求管理 ========== -->
    <div class="tab-page active" id="page-demand">
      <div class="publish-btn-wrap">
        <button class="btn-primary publish-btn" onclick="openPublishModal()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          发布新需求
        </button>
      </div>
      <div class="section-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        我的需求
      </div>
      <div id="demand-list">
        <!-- Demand cards rendered by JS -->
      </div>
    </div>

    <!-- ========== TAB 2: 接单大厅 ========== -->
    <div class="tab-page" id="page-hall">
      <div class="section-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        响应农户
      </div>
      <div id="farmer-list">
        <!-- Farmer cards rendered by JS -->
      </div>
    </div>

    <!-- ========== TAB 3: 账单 ========== -->
    <div class="tab-page" id="page-bill">
      <div class="section-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        账单中心
      </div>
      <div class="bill-summary">
        <div class="bill-summary-card">
          <div class="label">本月应付</div>
          <div class="amount orange">¥12,680</div>
        </div>
        <div class="bill-summary-card">
          <div class="label">已付款</div>
          <div class="amount green">¥8,450</div>
        </div>
      </div>
      <div id="bill-list">
        <!-- Bill cards rendered by JS -->
      </div>
    </div>

    <!-- ========== TAB 4: 商家主页 ========== -->
    <div class="tab-page" id="page-shop">
      <div class="card">
        <div class="shop-header">
          <div class="shop-avatar">🍜</div>
          <div class="shop-name">
            老王餐厅
            <span class="verified-badge">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="#2E7D32"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
              平台实地验真
            </span>
          </div>
          <div class="shop-address">📍 贵州省遵义市播州区桂花路128号</div>
        </div>
      </div>

      <div class="section-title" style="margin-top:4px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        今日采购公示
      </div>
      <div class="card" id="publicity-list">
        <!-- Publicity items rendered by JS -->
      </div>

      <button class="btn-primary forward-btn" onclick="showToast('已转发到商家主页')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><polyline points="15 3 21 3 21 9"/><line x1="21" y1="3" x2="14" y2="10"/><path d="M21 14v5a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/></svg>
        一键转发到商家主页
      </button>

      <div class="section-title">

<script>
/* ========================================
   DATA
   ======================================== */
var demands = [
  { id: 1, name: '散养土鸡', spec: '1年以上 | 3斤以上 | 需活禽现杀', qty: '30', unit: '只', price: '65', respond: 3, status: 'recruiting' },
  { id: 2, name: '新鲜时令蔬菜', spec: '当季品种 | 无农药残留 | 当日采摘', qty: '100', unit: '斤', price: '3.5', respond: 7, status: 'dealt' },
  { id: 3, name: '优质大米', spec: '稻花香 | 当年新米 | 含水量≤14%', qty: '500', unit: '斤', price: '4.2', respond: 0, status: 'closed' },
  { id: 4, name: '黑毛猪五花肉', spec: '散养黑猪 | 肥瘦相间 | 每块2斤起', qty: '50', unit: '斤', price: '28', respond: 5, status: 'recruiting' }
];

var farmers = [
  { name: '李大叔', avatar: '👨‍🌾', score: 4.8, distance: '3.2km', quote: '58元/只', product: '散养土鸡', phone: '139****6721' },
  { name: '张大爷', avatar: '👴', score: 4.9, distance: '1.8km', quote: '2.8元/斤', product: '新鲜时令蔬菜', phone: '158****3314' },
  { name: '王大姐', avatar: '👩‍🌾', score: 4.6, distance: '5.1km', quote: '25元/斤', product: '黑毛猪五花肉', phone: '176****9082' },
  { name: '赵大哥', avatar: '🧑‍🌾', score: 4.7, distance: '2.5km', quote: '62元/只', product: '散养土鸡', phone: '133****4456' }
];

var bills = [
  { id: 1, farmer: '张大爷', product: '新鲜时令蔬菜', qty: '100斤', amount: 350, status: 'pending', date: '2026-07-07' },
  { id: 2, farmer: '李大叔', product: '散养土鸡', qty: '20只', amount: 1300, status: 'paid', date: '2026-07-05' },
  { id: 3, farmer: '王大姐', product: '黑毛猪五花肉', qty: '30斤', amount: 840, status: 'paid', date: '2026-07-03' },
  { id: 4, farmer: '赵大哥', product: '优质大米', qty: '200斤', amount: 840, status: 'pending', date: '2026-07-08' }
];

var publicity = [
  { farmer: '张大爷', product: '土鸡30只', date: '2026-07-08', icon: '🐔' },
  { farmer: '李大叔', product: '新鲜蔬菜50斤', date: '2026-07-08', icon: '🥬' },
  { farmer: '王大姐', product: '黑毛猪肉20斤', date: '2026-07-07', icon: '🥩' },
  { farmer: '赵大哥', product: '优质大米200斤', date: '2026-07-07', icon: '🌾' }
];

var reviews = [
  { name: '陈女士', avatar: '👩', stars: 5, text: '食材非常新鲜，尤其是土鸡，炖出来的汤味道特别好！能溯源到农户，吃着放心。', date: '2026-07-06' },
  { name: '刘先生', avatar: '👨', stars: 5, text: '蔬菜当天采摘当天送，比超市的新鲜太多了。价格也很实惠，会继续支持！', date: '2026-07-05' },
  { name: '周同学', avatar: '🧑', stars: 4, text: '大米口感不错，粒粒分明。包装也很用心，好评！', date: '2026-07-03' }
];

/* ========================================
   TAB SWITCHING
   ======================================== */
var tabPages = ['page-demand', 'page-hall', 'page-bill', 'page-shop'];
var currentTab = 0;

function switchTab(index) {
  currentTab = index;
  var tabs = document.querySelectorAll('.tab-item');
  tabs.forEach(function(t, i) {
    t.classList.toggle('active', i === index);
  });
  tabPages.forEach(function(id, i) {
    var el = document.getElementById(id);
    if (i === index) {
      el.classList.add('active');
      el.style.display = 'block';
    } else {
      el.classList.remove('active');
      el.style.display = 'none';
    }
  });
  // scroll to top
  document.querySelector('.main-content').scrollTop = 0;
}

/* ========================================
   RENDER FUNCTIONS
   ======================================== */
function getStatusBadge(status) {
  var map = {
    recruiting: { text: '招募中', cls: 'badge-green' },
    dealt: { text: '已成交', cls: 'badge-orange' },
    closed: { text: '已关闭', cls: 'badge-gray' },
    pending: { text: '待确认', cls: 'badge-orange' },
    paid: { text: '已付款', cls: 'badge-green' }
  };
  var s = map[status] || { text: status, cls: 'badge-gray' };
  return '<span class="badge ' + s.cls + '">' + s.text + '</span>';
}

function renderDemands() {
  var html = '';
  demands.forEach(function(d) {
    html += '<div class="card demand-card">' +
      '<div class="demand-title">' + d.name + '</div>' +
      '<div class="demand-spec">' + d.spec + '</div>' +
      '<div class="demand-meta">' +
        '<div class="demand-info">' +
          '<span>' + d.qty + d.unit + '</span>' +
          '<span>期望 <strong>¥' + d.price + '</strong>/' + d.unit + '</span>' +
        '</div>' +
        '<div class="demand-right">' +
          (d.respond > 0 ? '<span class="respond-count">' + d.respond + '人响应</span>' : '') +
          getStatusBadge(d.status) +
        '</div>' +
      '</div>' +
    '</div>';
  });
  document.getElementById('demand-list').innerHTML = html;
}

function renderFarmers() {
  var html = '';
  farmers.forEach(function(f, i) {
    html += '<div class="card farmer-card">' +
      '<div class="farmer-avatar">' + f.avatar + '</div>' +
      '<div class="farmer-info">' +
        '<div class="farmer-name">' + f.name + '</div>' +
        '<div class="farmer-tags">' +
          '<span class="farmer-tag green">信誉 ' + f.score + '</span>' +
          '<span class="farmer-tag">📍 ' + f.distance + '</span>' +
          '<span class="farmer-tag">' + f.product + '</span>' +
        '</div>' +
        '<div class="farmer-quote">报价：' + f.quote + '</div>' +
        '<div class="farmer-actions">' +
          '<button class="btn-outline btn-small" onclick="openCallModal(' + i + ')">📞 隐私号联系</button>' +
          '<button class="btn-orange btn-small" onclick="confirmFarmer(\'' + f.name + '\')">✓ 确认接单</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  });
  document.getElementById('farmer-list').innerHTML = html;
}

function renderBills() {
  var html = '';
  bills.forEach(function(b, i) {
    var actionBtn = '';
    if (b.status === 'pending') {
      actionBtn = '<button class="btn-orange btn-small" onclick="openConfirmModal(' + i + ')">确认应付</button>';
    } else {
      actionBtn = '<span class="badge badge-green">已付款</span>';
    }
    html += '<div class="card bill-card">' +
      '<div class="bill-header">' +
        '<span class="bill-farmer">' + b.farmer + '</span>' +
        getStatusBadge(b.status) +
      '</div>' +
      '<div class="bill-detail">' + b.product + ' · ' + b.qty + ' · ' + b.date + '</div>' +
      '<div class="bill-amount">¥' + b.amount.toLocaleString() + '</div>' +
      '<div class="bill-footer">' +
        '<div class="bill-left">' +
          '<div class="checkin-thumb">📸</div>' +
          '<span style="font-size:12px;color:#999;">打卡记录</span>' +
        '</div>' +
        actionBtn +
      '</div>' +
    '</div>';
  });
  document.getElementById('bill-list').innerHTML = html;
}

function renderPublicity() {
  var html = '';
  publicity.forEach(function(p) {
    html += '<div class="publicity-item">' +
      '<div class="publicity-thumb">' + p.icon + '</div>' +
      '<div class="publicity-info">' +
        '<div class="publicity-title">' + p.farmer + ' - ' + p.product + '</div>' +
        '<div class="publicity-date">' + p.date + '</div>' +
      '</div>' +
      '<div class="publicity-check">✓ 已打卡</div>' +
    '</div>';
  });
  document.getElementById('publicity-list').innerHTML = html;
}

function renderReviews() {
  var html = '';
  reviews.forEach(function(r) {
    var stars = '';
    for (var i = 0; i < r.stars; i++) stars += '★';
    for (var j = 0; j < 5 - r.stars; j++) stars += '☆';
    html += '<div class="review-card">' +
      '<div class="review-header">' +
        '<div class="review-avatar">' + r.avatar + '</div>' +
        '<div>' +
          '<div class="review-name">' + r.name + '</div>' +
          '<div class="review-stars">' + stars + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="review-text">' + r.text + '</div>' +
      '<div class="review-date">' + r.date + '</div>' +
    '</div>';
  });
  document.getElementById('review-list').innerHTML = html;
}

/* ========================================
   MODAL HELPERS
   ======================================== */
function openModal(id) {
  document.getElementById(id).classList.add('show');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}
function closeModalOnOverlay(e, id) {
  if (e.target.classList.contains('modal-overlay')) {
    closeModal(id);
  }
}

/* ========================================
   TAB 1: PUBLISH DEMAND
   ======================================== */
function openPublishModal() {
  openModal('modal-publish');
}

var isRecording = false;
var voiceTimer = null;

function toggleVoice() {
  var btn = document.getElementById('voiceBtn');
  if (!isRecording) {
    isRecording = true;
    btn.classList.add('recording');
    var labels = btn.querySelectorAll('.voice-text');
    labels[0].style.display = 'none';
    labels[1].style.display = 'inline';
    // Auto stop after 3s
    voiceTimer = setTimeout(function() {
      stopVoice();
      showToast('语音输入完成');
    }, 3000);
  } else {
    stopVoice();
  }
}

function stopVoice() {
  isRecording = false;
  clearTimeout(voiceTimer);
  var btn = document.getElementById('voiceBtn');
  btn.classList.remove('recording');
  var labels = btn.querySelectorAll('.voice-text');
  labels[0].style.display = 'inline';
  labels[1].style.display = 'none';
}

function submitDemand() {
  var name = document.getElementById('form-name').value.trim();
  var spec = document.getElementById('form-spec').value.trim();
  var qty = document.getElementById('form-qty').value.trim();
  var unit = document.getElementById('form-unit').value;
  var price = document.getElementById('form-price').value.trim();

  if (!name) { showToast('请输入品名'); return; }
  if (!spec) { showToast('请输入规格/标准'); return; }
  if (!qty) { showToast('请输入数量'); return; }
  if (!price) { showToast('请输入期望价格'); return; }

  demands.unshift({
    id: Date.now(),
    name: name,
    spec: spec,
    qty: qty,
    unit: unit,
    price: price,
    respond: 0,
    status: 'recruiting'
  });

  renderDemands();
  closeModal('modal-publish');

  // Reset form
  document.getElementById('form-name').value = '';
  document.getElementById('form-spec').value = '';
  document.getElementById('form-qty').value = '';
  document.getElementById('form-price').value = '';
  stopVoice();

  showToast('需求发布成功！');
}

/* ========================================
   TAB 2: CALL MODAL
   ======================================== */
var callTimerInterval = null;
var callSeconds = 0;

function openCallModal(index) {
  var f = farmers[index];
  document.getElementById('virtualNumber').textContent = f.phone;
  document.getElementById('callTarget').textContent = f.name;
  callSeconds = 0;
  document.getElementById('callTimer').textContent = '00:00';
  openModal('modal-call');

  // Start timer
  clearInterval(callTimerInterval);
  callTimerInterval = setInterval(function() {
    callSeconds++;
    var m = String(Math.floor(callSeconds / 60)).padStart(2, '0');
    var s = String(callSeconds % 60).padStart(2, '0');
    document.getElementById('callTimer').textContent = m + ':' + s;
  }, 1000);
}

function closeCallModal() {
  clearInterval(callTimerInterval);
  closeModal('modal-call');
  if (callSeconds > 0) {
    showToast('通话结束，时长 ' + document.getElementById('callTimer').textContent);
  }
}

function confirmFarmer(name) {
  showToast('已确认接单：' + name);
}

/* ========================================
   TAB 3: CONFIRM BILL
   ======================================== */
var currentBillIndex = -1;

function openConfirmModal(index) {
  currentBillIndex = index;
  var b = bills[index];
  document.getElementById('confirmText').textContent = '确认应付给 ' + b.farmer + '（' + b.product + '）';
  document.getElementById('confirmAmount').textContent = '¥' + b.amount.toLocaleString();
  openModal('modal-confirm');
}

function confirmBill() {
  if (currentBillIndex >= 0 && currentBillIndex < bills.length) {
    bills[currentBillIndex].status = 'paid';
    renderBills();
    closeModal('modal-confirm');
    showToast('已确认应付！');
  }
}

/* ========================================
   TOAST
   ======================================== */
var toastTimer = null;
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() {
    t.classList.remove('show');
  }, 2000);
}

/* ========================================
   INIT
   ======================================== */
renderDemands();
renderFarmers();
renderBills();
renderPublicity();
renderReviews();
</script>
