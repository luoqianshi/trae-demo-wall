<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>利率小岛经济模拟器</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f5f7fa;--bg2:#fff;--ink:#0e1322;--muted:#5a647a;--rule:#e2e6ee;
  --accent:#4a36e3;--accent2:#ece8ff;--accent-d:#3928b8;
  --green:#2ecc71;--blue:#3498db;--orange:#e67e22;--red:#e74c3c;--purple:#9b59b6;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","Fira Code","Courier New",monospace;
  --radius:8px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.6;-webkit-font-smoothing:antialiased}
.page{max-width:1200px;margin:0 auto;padding:1.5rem 1rem 3rem}

/* Top bar */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:0.5rem 0 1rem;border-bottom:2px solid var(--accent);margin-bottom:1.5rem}
.topbar h1{font-size:1.5rem;font-weight:700}
.topbar a{color:var(--accent);text-decoration:none;font-size:0.85rem;border:1px solid var(--accent);padding:0.3rem 0.8rem;border-radius:var(--radius);transition:all .15s}
.topbar a:hover{background:var(--accent);color:#fff}
.topbar-hint{font-size:1.5rem;color:var(--red);font-weight:700;text-align:center;margin-bottom:1.5rem}

/* KPI cards */
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.5rem}
.kpi{background:var(--bg2);border:1px solid var(--rule);border-radius:var(--radius);padding:1rem 1.25rem;text-align:center}
.kpi .label{font-size:0.75rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);margin-bottom:0.3rem}
.kpi .value{font-size:1.8rem;font-weight:700;font-family:var(--mono);color:var(--ink)}
.kpi .sub{font-size:0.75rem;color:var(--muted);margin-top:0.2rem}

/* Control panel */
.panel{background:var(--bg2);border:1px solid var(--rule);border-radius:var(--radius);padding:1.25rem 1.5rem;margin-bottom:1.5rem}
.panel-title{font-size:0.8rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin-bottom:0.75rem}
.control-row{display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap}
.slider-group{flex:1;min-width:280px}
.slider-group label{font-size:0.85rem;font-weight:600;margin-right:0.5rem}
.slider-group input[type=range]{width:calc(100% - 120px);vertical-align:middle;accent-color:var(--accent)}
.rate-display{font-family:var(--mono);font-size:1.1rem;font-weight:700;color:var(--accent);min-width:60px;display:inline-block}
.control-bottom{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin-top:0.85rem;padding-top:0.85rem;border-top:1px solid var(--rule)}
.btn-cluster{display:flex;gap:0.4rem;flex-wrap:wrap;align-items:center}
.btn-cluster-label{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);margin-right:0.35rem;white-space:nowrap}
button{font-family:var(--font);font-size:0.85rem;font-weight:600;padding:0.5rem 1rem;border:1px solid var(--rule);border-radius:var(--radius);background:var(--bg2);color:var(--ink);cursor:pointer;transition:all .15s}
button:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.primary:hover{background:var(--accent-d);color:#fff}
button:disabled{opacity:0.4;cursor:not-allowed}
select{font-family:var(--font);font-size:0.85rem;padding:0.4rem 0.6rem;border:1px solid var(--rule);border-radius:var(--radius);background:var(--bg2)}
.turn-display{font-family:var(--mono);font-size:0.9rem;color:var(--muted);margin-left:auto}
.turn-display strong{color:var(--ink);font-size:1.1rem}
.extinct-banner{display:none;background:#fef3f2;border:1px solid var(--red);border-radius:var(--radius);padding:0.75rem 1rem;margin-top:0.75rem;color:var(--red);font-size:0.85rem;font-weight:600;text-align:center}
.extinct-banner.show{display:block}

/* Charts */
.chart-section{margin-bottom:1.5rem}
.chart-section-title{font-size:0.75rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin-bottom:0.6rem;padding-left:0.15rem}
.chart-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.chart-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem}
.chart-card{background:var(--bg2);border:1px solid var(--rule);border-radius:var(--radius);padding:1rem 1.25rem}
.chart-card h3{font-size:0.9rem;font-weight:600;margin-bottom:0.5rem;color:var(--ink)}
.chart-card .chart-box{position:relative;height:220px}
.chart-card.full{grid-column:1/-1}
.chart-card.full .chart-box{height:260px}

/* Resident search */
.search-section{background:var(--bg2);border:1px solid var(--rule);border-radius:var(--radius);padding:1.25rem 1.5rem;margin-bottom:1.5rem}
.search-box{display:flex;gap:0.5rem;margin-bottom:1rem}
.search-box input{flex:1;padding:0.5rem 0.75rem;border:1px solid var(--rule);border-radius:var(--radius);font-size:0.9rem;font-family:var(--font)}
.search-box input:focus{outline:none;border-color:var(--accent)}
.search-results{max-height:240px;overflow-y:auto;border:1px solid var(--rule);border-radius:var(--radius);margin-bottom:1rem;display:none}
.search-results.show{display:block}
.search-item{padding:0.6rem 0.9rem;border-bottom:1px solid var(--rule);cursor:pointer;font-size:0.85rem;display:flex;justify-content:space-between;align-items:center;gap:0.75rem}
.search-item:hover{background:var(--accent2)}
.search-item:last-child{border-bottom:none}
.search-item .item-info{display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap}
.search-item .item-id{font-family:var(--mono);font-weight:700;color:var(--muted);font-size:0.8rem}
.search-item .item-name{font-weight:600}
.search-item .item-prof{font-size:0.75rem;color:var(--muted);background:var(--bg);padding:0.1rem 0.45rem;border-radius:4px;border:1px solid var(--rule)}
.search-item .item-gender{font-size:0.75rem;color:var(--muted)}
.search-item .status-badge{font-size:0.72rem;font-weight:700;padding:0.15rem 0.55rem;border-radius:12px;white-space:nowrap;flex-shrink:0}
.search-item .status-badge.alive{color:var(--green);background:#e8fbee;border:1px solid #abebc1}
.search-item .status-badge.dead{color:var(--red);background:#fdeaea;border:1px solid #f5c6c6}
.resident-detail{display:none}
.resident-detail.show{display:block}
.detail-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0.75rem;margin-bottom:1rem}
.detail-card{background:var(--bg);border:1px solid var(--rule);border-radius:var(--radius);padding:0.6rem 0.8rem}
.detail-card .label{font-size:0.7rem;text-transform:uppercase;color:var(--muted);letter-spacing:0.04em}
.detail-card .value{font-size:1rem;font-weight:600;font-family:var(--mono)}
.family-section{margin-top:0.75rem}
.family-section h4{font-size:0.85rem;font-weight:600;margin-bottom:0.4rem;color:var(--muted)}
.family-list{display:flex;flex-wrap:wrap;gap:0.4rem}
.family-tag{padding:0.3rem 0.6rem;border:1px solid var(--rule);border-radius:var(--radius);font-size:0.8rem;cursor:pointer;background:var(--bg);transition:all .15s}
.family-tag:hover{border-color:var(--accent);color:var(--accent);background:var(--accent2)}
.family-tag.deceased{opacity:0.6}
#residentChartBox{position:relative;height:300px;margin-top:0.5rem}

/* Footer */
footer{text-align:center;padding:1.5rem 0;color:var(--muted);font-size:0.75rem;border-top:1px solid var(--rule)}

@media(max-width:760px){
  .kpi-row{grid-template-columns:1fr}
  .chart-grid-2,.chart-grid-3{grid-template-columns:1fr}
  .control-row,.control-bottom{flex-direction:column;align-items:stretch}
  .turn-display{margin-left:0}
}
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <h1>利率小岛经济模拟器</h1>
    <a href="island-economy-rulebook.html" target="_blank">查看完整规则书</a>
  </div>
  <p class="topbar-hint">你能控制的只有利率！！！</p>

  <div class="kpi-row">
    <div class="kpi"><div class="label">总人口</div><div class="value" id="kpiPop">120</div><div class="sub" id="kpiPopSub">农72 工36 商12</div></div>
    <div class="kpi"><div class="label">GDP</div><div class="value" id="kpiGdp">0.0</div><div class="sub">本回合成交总额</div></div>
    <div class="kpi"><div class="label">平均幸福度</div><div class="value" id="kpiHappy">0.60</div><div class="sub" id="kpiHappySub">饱食 0.80 · 效率 1.00</div></div>
  </div>

  <div class="panel">
    <div class="panel-title">控制面板</div>
    <div class="control-row">
      <div class="slider-group">
        <label>居民现金利率</label>
        <input type="range" id="rateSlider" min="-10" max="10" step="0.5" value="0">
        <span class="rate-display" id="rateDisplay">0.0%</span>
      </div>
      <div class="turn-display">回合 <strong id="turnDisplay">0</strong></div>
    </div>
    <div class="control-bottom">
      <div class="btn-cluster">
        <span class="btn-cluster-label">模拟控制</span>
        <button class="primary" id="btnAuto">自动推进</button>
        <button id="btnPause" disabled>暂停</button>
        <button id="btnStep1">推进1回合</button>
        <button id="btnStep10">推进10回合</button>
      </div>
      <div class="btn-cluster">
        <span class="btn-cluster-label">速度</span>
        <select id="speedSel">
          <option value="400">慢速</option>
          <option value="150" selected>中速</option>
          <option value="50">快速</option>
        </select>
      </div>
      <div class="btn-cluster">
        <button id="btnReset">重置</button>
      </div>
    </div>
    <div class="extinct-banner" id="extinctBanner">种群已灭绝 — 模拟已停止，仍可查看历史数据和搜索居民信息</div>
  </div>

  <div class="chart-section">
    <div class="chart-section-title">GDP 与价格</div>
    <div class="chart-grid-2">
      <div class="chart-card full"><h3>GDP 与价格走势</h3><div class="chart-box"><canvas id="chartGdp"></canvas></div></div>
    </div>
  </div>

  <div class="chart-section">
    <div class="chart-section-title">人口与属性</div>
    <div class="chart-grid-2">
      <div class="chart-card"><h3>人口统计</h3><div class="chart-box"><canvas id="chartPop"></canvas></div></div>
      <div class="chart-card"><h3>居民属性</h3><div class="chart-box"><canvas id="chartAttr"></canvas></div></div>
    </div>
  </div>

  <div class="chart-section">
    <div class="chart-section-title">商品供需</div>
    <div class="chart-grid-3">
      <div class="chart-card"><h3>商品产量</h3><div class="chart-box"><canvas id="chartProd"></canvas></div></div>
      <div class="chart-card"><h3>商品销量</h3><div class="chart-box"><canvas id="chartSales"></canvas></div></div>
      <div class="chart-card"><h3>商品库存量</h3><div class="chart-box"><canvas id="chartStock"></canvas></div></div>
    </div>
  </div>

  <div class="search-section">
    <div class="panel-title">居民历史检索</div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="输入居民 ID 或姓名搜索（支持模糊匹配）...">
      <button id="btnSearch">搜索</button>
    </div>
    <div class="search-results" id="searchResults"></div>
    <div class="resident-detail" id="residentDetail">
      <div class="detail-cards" id="detailCards"></div>
      <div class="family-section">
        <h4>父母</h4>
        <div class="family-list" id="familyParents"></div>
      </div>
      <div class="family-section">
        <h4>子女</h4>
        <div class="family-list" id="familyChildren"></div>
      </div>
      <div class="chart-card" style="margin-top:0.75rem"><h3 id="residentChartTitle">个人属性曲线</h3><div id="residentChartBox"><canvas id="chartResident"></canvas></div></div>
    </div>
  </div>

  <footer>利率小岛经济模拟器 · 基于规则书开发 · 2026</footer>
</div>

<script>
"use strict";
/* ============================================================ Configuration */
const CFG = {
  initPop: 120,
  profRatio: { agri: 0.60, ind: 0.30, comm: 0.10 },
  ageBands: [
    { min: 0, max: 19, ratio: 0.20 },
    { min: 20, max: 39, ratio: 0.45 },
    { min: 40, max: 69, ratio: 0.25 },
    { min: 70, max: 100, ratio: 0.10 },
  ],
  jobBase: { agri: 0.83, ind: 0.40, comm: 2.5 },
  dFood: 0.20, aFood: 0.50, rhoH: 0.92, aCons: 0.25,
  sSafe: 0.75, hTarget: 0.70, sHunger: 0.65, sStarve: 0.15,
  starveTurns: 2,
  priceFloor: 0.01, eta: 0.90,
  keepRate: { food: 0.20, ind: 0.30, consume: 0.10 },
  reserveRatio: { food: 0.40, ind: 0.50, consume: 0.30 },
  baseBirth: 0.22, salvageRate: 0.50, alpha: 0.25,
  maxAge: 100,
  marriageAgeMin: 20, marriageAgeMax: 40,
  marriageS: 0.55, marriageH: 0.45, marriageNoStarve: 3,
  marriageCashMult: 4, birthCashMinMult: 1.5,
  initStock: { food: 30, ind: 8, consume: 5 },
  initPRef: { food: 1.0, ind: 1.5, consume: 1.0 },
  pRefDecay: 0.7, pRefUpdate: 0.3,
  cashFactorLo: 0.6, cashFactorHi: 2.0, cashNormMult: 10,
  rateMoneyMult: 0.05,
};
const PROF_GOOD = { agri: "food", ind: "ind", comm: "consume" };
const GOOD_LABEL = { food: "农产品", ind: "工业品", consume: "消费品" };
const PROF_LABEL = { agri: "农业", ind: "工业", comm: "商业" };
const COLORS = { food: "#2ecc71", ind: "#3498db", consume: "#e67e22", agri: "#2ecc71", ind_prof: "#3498db", comm: "#e67e22", total: "#2c3e50", gdp: "#9b59b6" };

/* ============================================================ Utilities */
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const sum = arr => arr.reduce((s, x) => s + x, 0);

const SURNAMES = "张王李赵刘陈杨黄周吴徐孙马朱胡林郭何高罗郑梁谢宋唐许韩冯邓曹彭潘袁蔡蒋余杜叶程苏魏吕丁任沈姚卢姜崔";
const GIVEN_M = "伟强磊军洋勇杰涛明超刚建华飞宇豪瀚轩博晨鑫鹏昊天逸";
const GIVEN_F = "芳娜敏静丽艳娟霞平秀英玲桂萍燕蕾颖婷雪欣怡梦琪婉清";

/* ============================================================ State */
let state, charts = {}, autoTimer = null, currentResidentId = null;

function freshState() {
  return {
    turn: 0, rate: 0, residents: [], nextId: 1,
    carry: { ...CFG.initStock },
    pRef: { ...CFG.initPRef },
    pClear: { ...CFG.initPRef },
    lastSales: { food: 0, ind: 0, consume: 0 },
    lastProd: { food: 0, ind: 0, consume: 0 },
    lastGdp: 0,
    hist: {
      turns: [],
      pop: [], popAgri: [], popInd: [], popComm: [],
      gdp: [],
      priceFood: [], priceInd: [], priceConsume: [],
      salesFood: [], salesInd: [], salesConsume: [],
      stockFood: [], stockInd: [], stockConsume: [],
      prodFood: [], prodInd: [], prodConsume: [],
      avgS: [], avgEff: [], avgH: [], avgMoney: [],
    },
  };
}

/* ============================================================ Resident */
function makeResident(opts = {}) {
  const id = state.nextId++;
  const gender = opts.gender ?? (Math.random() < 0.5 ? "M" : "F");
  const surname = SURNAMES[Math.floor(Math.random() * SURNAMES.length)];
  const given = gender === "M" ? pick([...GIVEN_M]) : pick([...GIVEN_F]);
  return {
    id, name: surname + given, gender,
    profession: opts.profession ?? "agri",
    age: opts.age ?? 0,
    money: opts.money ?? rand(8, 16),
    S: opts.S ?? rand(0.65, 0.95),
    H: opts.H ?? rand(0.45, 0.75),
    I: opts.I ?? rand(0, 2),
    starve: 0, noStarveTurns: opts.noStarveTurns ?? 99,
    alive: true,
    spouse: null,
    parents: opts.parents ?? [],
    children: [],
    birthTurn: opts.birthTurn ?? 0,
    deathTurn: null,
    efficiency: 0, output: 0,
    bought: { food: 0, ind: 0, consume: 0 },
    history: [],
  };
}

function getResident(id) {
  return state.residents.find(r => r.id === id);
}

/* ============================================================ Initialization */
function initWorld() {
  state = freshState();
  const n = CFG.initPop;
  const counts = {
    agri: Math.round(n * CFG.profRatio.agri),
    ind: Math.round(n * CFG.profRatio.ind),
    comm: n - Math.round(n * CFG.profRatio.agri) - Math.round(n * CFG.profRatio.ind),
  };
  const profs = [];
  for (const [p, c] of Object.entries(counts))
    for (let i = 0; i < c; i++) profs.push(p);
  // Shuffle
  for (let i = profs.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [profs[i], profs[j]] = [profs[j], profs[i]];
  }

  for (let i = 0; i < n; i++) {
    const prof = profs[i];
    // Age from bands
    const roll = Math.random();
    let acc = 0, band = CFG.ageBands[0];
    for (const b of CFG.ageBands) { acc += b.ratio; if (roll <= acc) { band = b; break; } }
    const age = randInt(band.min, band.max);

    // Profession-specific adjustments (<10-15%)
    let money = rand(8, 16) * state.pRef.food;
    let S = rand(0.65, 0.95);
    let H = rand(0.45, 0.75);
    let I = rand(0, 2);
    if (prof === "agri") { money *= 0.92; S += 0.05; }
    else if (prof === "ind") { I += 0.5; }
    else { money *= 1.08; H += 0.05; }

    const r = makeResident({ profession: prof, age, money, S: clamp(S, 0, 1), H: clamp(H, 0, 1), I, birthTurn: -age });
    state.residents.push(r);
  }
  // Initial pRef is already set; pClear = pRef
  recordHistory();
  updateUI();
  updateAllCharts();
}

/* ============================================================ Efficiency */
function eAge(age) {
  if (age < 20) return 0.6 + 0.02 * age;
  if (age < 40) return 1.0 + 0.005 * (age - 20);
  return 1.1 - 0.01 * (age - 40);
}
function eInd(I) { return 1 + CFG.alpha * Math.log(1 + I); }
function eTotal(r) {
  return eAge(r.age) * eInd(r.I) * (0.3 + 0.7 * r.S) * (0.9 + 0.2 * r.H);
}

/* ============================================================ Cash Factor */
function cashFactor(r) {
  const norm = CFG.cashNormMult * state.pRef.food;
  return clamp(r.money / norm, CFG.cashFactorLo, CFG.cashFactorHi);
}

/* ============================================================ Bidding */
function bidFood(r, cf, availCash) {
  const sAfter = r.S - CFG.dFood;
  if (sAfter >= CFG.sHunger) return { qty: 0, unitBid: 0 };
  const gap = Math.max(0, CFG.sSafe - sAfter);
  const qty = Math.max(1, Math.ceil(gap / CFG.aFood));
  const survival = r.S < 0.3 ? 3 : 0;
  const value = state.pRef.food * (1 + 2 * gap + 6 * gap * gap + survival);
  const cashLimit = availCash / qty;
  return { qty, unitBid: Math.max(0, Math.min(cashLimit, value * cf)) };
}

function bidInd(r, cf, availCash) {
  const dE = CFG.alpha * Math.log(1 + 1 / (1 + r.I));
  const Lage = Math.max(1, (65 - r.age) / 3);
  const discount = 1 - 6.0 * Math.max(state.rate, 0) + 5.0 * Math.max(-state.rate, 0);
  const ownGood = PROF_GOOD[r.profession];
  const value = dE * CFG.jobBase[r.profession] * state.pRef[ownGood] * Lage * discount;
  return { qty: 1, unitBid: Math.max(0, Math.min(availCash, value * cf)) };
}

function bidConsume(r, cf, availCash) {
  const gap = Math.max(0, CFG.hTarget - r.H);
  if (gap <= 0) return { qty: 0, unitBid: 0 };
  const qty = Math.max(1, Math.ceil(gap / CFG.aCons));
  const interestFactor = 1 - 7.0 * Math.max(state.rate, 0) + 5.0 * Math.max(-state.rate, 0);
  if (interestFactor <= 0) return { qty: 0, unitBid: 0 };
  const value = state.pRef.consume * (1 + 1.8 * gap) * interestFactor;
  const cashLimit = availCash / qty;
  return { qty, unitBid: Math.max(0, Math.min(cashLimit, value * cf)) };
}

/* ============================================================ Market Clearing */
function clearMarket(good) {
  const alive = state.residents.filter(r => r.alive);
  const producers = alive.filter(r => PROF_GOOD[r.profession] === good);
  const newOutput = sum(producers.map(r => r.output));
  const supply = state.carry[good] + newOutput;
  const Q = Math.round(supply);

  // Collect bids
  const units = [];
  for (const r of alive) {
    const cf = cashFactor(r);
    let bid;
    if (good === "food") {
      bid = bidFood(r, cf, r.money);
    } else {
      const foodReserve = state.pRef.food * 2;
      const avail = Math.max(0, r.money - foodReserve);
      if (good === "ind") bid = bidInd(r, cf, avail);
      else bid = bidConsume(r, cf, avail);
    }
    for (let k = 0; k < bid.qty; k++)
      if (bid.unitBid > 0.001) units.push({ id: r.id, bid: bid.unitBid });
  }
  units.sort((a, b) => b.bid - a.bid);

  const D = units.length;
  let pClear, soldTotal;
  const alloc = {};

  if (Q <= 0) {
    pClear = state.pClear[good]; soldTotal = 0;
  } else if (D === 0) {
    pClear = state.pClear[good]; soldTotal = 0;
  } else if (D >= Q) {
    pClear = Math.max(CFG.priceFloor, units[Q - 1].bid);
    soldTotal = Q;
    for (let i = 0; i < Q; i++) alloc[units[i].id] = (alloc[units[i].id] || 0) + 1;
  } else {
    const reserve = CFG.reserveRatio[good] * state.pRef[good];
    pClear = Math.max(CFG.priceFloor, reserve + (state.pRef[good] - reserve) * Math.pow(D / Q, CFG.eta));
    soldTotal = D;
    for (let i = 0; i < D; i++) alloc[units[i].id] = (alloc[units[i].id] || 0) + 1;
  }

  // Buyers pay & receive goods
  for (const [id, cnt] of Object.entries(alloc)) {
    const r = getResident(+id);
    r.money = Math.max(0, r.money - cnt * pClear);
    r.bought[good] = cnt;
  }

  // Producers receive income
  const totalProd = newOutput;
  if (totalProd > 0 && soldTotal > 0) {
    for (const r of producers) {
      r.money += soldTotal * pClear * (r.output / totalProd);
    }
  } else if (soldTotal > 0) {
    const share = (soldTotal * pClear) / alive.length;
    for (const r of alive) r.money += share;
  }

  // Inventory carry
  const unsold = Math.max(0, supply - soldTotal);
  state.carry[good] = unsold * CFG.keepRate[good];

  // Price memory
  state.pClear[good] = pClear;
  state.pRef[good] = Math.max(0.25, CFG.pRefDecay * state.pRef[good] + CFG.pRefUpdate * pClear);
  state.lastSales[good] = soldTotal;
  state.lastProd[good] = newOutput;
}

/* ============================================================ Turn Execution */
function runTurn() {
  // Stop if population is extinct
  if (state.residents.filter(r => r.alive).length === 0) return false;
  state.turn++;
  const alive = state.residents.filter(r => r.alive);

  // 1. Interest settlement (reduced multiplier — behavioral effects dominate)
  const mult = 1 + state.rate * CFG.rateMoneyMult;
  for (const r of alive) r.money *= mult;

  // 2. Production
  for (const r of alive) {
    r.efficiency = eTotal(r);
    r.output = CFG.jobBase[r.profession] * r.efficiency;
    r.bought = { food: 0, ind: 0, consume: 0 };
  }

  // 3-5. Sequential market clearing (food → ind → consume)
  clearMarket("food");
  clearMarket("ind");
  clearMarket("consume");

  // 6. Attribute updates
  for (const r of alive) {
    r.S = clamp(r.S - CFG.dFood + CFG.aFood * r.bought.food, 0, 1);
    const penH = Math.max(0, 0.3 - r.S) * 0.5;
    r.H = clamp(CFG.rhoH * r.H + CFG.aCons * r.bought.consume - penH, 0, 1);
    r.I += r.bought.ind;
    r.age += 1;
    if (r.S < CFG.sStarve) { r.starve++; r.noStarveTurns = 0; }
    else { r.starve = 0; r.noStarveTurns++; }
    // Record personal history
    r.history.push({ turn: state.turn, age: r.age, money: r.money, S: r.S, H: r.H, I: r.I, eff: r.efficiency });
  }

  // 7. Death & inheritance
  handleDeath(alive);

  // 8. Marriage & birth
  handleMarriageBirth();

  // GDP
  state.lastGdp = ["food", "ind", "consume"].reduce((s, g) => s + state.lastSales[g] * state.pClear[g], 0);

  // History
  recordHistory();
  return true;
}

function handleDeath(aliveList) {
  const dead = aliveList.filter(r => r.age >= CFG.maxAge || r.S <= 0.001 || r.starve >= CFG.starveTurns);
  for (const r of dead) {
    r.alive = false;
    r.deathTurn = state.turn;
    const estate = r.money + CFG.salvageRate * r.I * state.pRef.ind;
    r.money = 0;
    // Widow spouse
    if (r.spouse != null) {
      const sp = getResident(r.spouse);
      if (sp) sp.spouse = null;
      r.spouse = null;
    }
    // Distribute estate
    const children = r.children.map(getResident).filter(c => c && c.alive);
    let heirs;
    if (children.length > 0) heirs = children;
    else heirs = state.residents.filter(x => x.alive && x.id !== r.id);
    if (heirs.length > 0 && estate > 0) {
      const share = estate / heirs.length;
      for (const h of heirs) h.money += share;
    }
  }
}

function handleMarriageBirth() {
  const alive = state.residents.filter(r => r.alive);
  // Marriage: find eligible unmarried residents
  const eligible = alive.filter(r =>
    r.spouse == null &&
    r.age >= CFG.marriageAgeMin && r.age <= CFG.marriageAgeMax &&
    r.S >= CFG.marriageS && r.H >= CFG.marriageH &&
    r.noStarveTurns >= CFG.marriageNoStarve &&
    r.money >= CFG.marriageCashMult * state.pRef.food
  );
  // Match by gender
  const males = eligible.filter(r => r.gender === "M");
  const females = eligible.filter(r => r.gender === "F");
  const pairs = Math.min(males.length, females.length);
  // Shuffle
  for (let i = males.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [males[i], males[j]] = [males[j], males[i]]; }
  for (let i = females.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [females[i], females[j]] = [females[j], females[i]]; }

  for (let i = 0; i < pairs; i++) {
    const m = males[i], f = females[i];
    if (m.spouse != null || f.spouse != null) continue;
    m.spouse = f.id; f.spouse = m.id;
  }

  // Birth: for each married couple
  const processed = new Set();
  for (const r of alive) {
    if (r.spouse == null || processed.has(r.id)) continue;
    const sp = getResident(r.spouse);
    if (!sp || !sp.alive) continue;
    processed.add(r.id); processed.add(sp.id);

    // Birth conditions
    if (r.age < CFG.marriageAgeMin || r.age > CFG.marriageAgeMax) continue;
    if (sp.age < CFG.marriageAgeMin || sp.age > CFG.marriageAgeMax) continue;
    if (r.S < CFG.marriageS || sp.S < CFG.marriageS) continue;
    if (r.H < CFG.marriageH || sp.H < CFG.marriageH) continue;

    const avgS = (r.S + sp.S) / 2;
    const avgH = (r.H + sp.H) / 2;
    const familyCash = r.money + sp.money;
    const affordability = clamp(familyCash / (10 * state.pRef.food), 0, 1);
    const pBirth = CFG.baseBirth * avgS * avgH * affordability * (1 - 2.0 * Math.max(state.rate, 0) + 1.5 * Math.max(-state.rate, 0));
    if (pBirth <= 0 || Math.random() >= pBirth) continue;

    // Check post-birth cash
    const transferRate = rand(0.10, 0.50);
    const transfer = familyCash * transferRate;
    const remaining = familyCash - transfer;
    const rShare = remaining * (r.money / familyCash);
    const spShare = remaining * (sp.money / familyCash);
    if (rShare < CFG.birthCashMinMult * state.pRef.food || spShare < CFG.birthCashMinMult * state.pRef.food) continue;

    // Create child
    const allProfs = ["agri", "ind", "comm"];
    let childProf;
    if (Math.random() < 0.9) childProf = Math.random() < 0.5 ? r.profession : sp.profession;
    else {
      const others = allProfs.filter(p => p !== r.profession && p !== sp.profession);
      childProf = others.length > 0 ? pick(others) : pick(allProfs.filter(p => p !== r.profession));
    }
    const child = makeResident({
      profession: childProf, age: 0, money: transfer,
      S: 0.7, H: 0.6, I: 0, noStarveTurns: 99,
      parents: [r.id, sp.id], birthTurn: state.turn,
    });
    state.residents.push(child);
    r.children.push(child.id);
    sp.children.push(child.id);
    r.money = rShare;
    sp.money = spShare;
  }
}

/* ============================================================ History */
function recordHistory() {
  const alive = state.residents.filter(r => r.alive);
  const h = state.hist;
  h.turns.push(state.turn);
  h.pop.push(alive.length);
  h.popAgri.push(alive.filter(r => r.profession === "agri").length);
  h.popInd.push(alive.filter(r => r.profession === "ind").length);
  h.popComm.push(alive.filter(r => r.profession === "comm").length);
  h.gdp.push(state.lastGdp);
  h.priceFood.push(state.pClear.food);
  h.priceInd.push(state.pClear.ind);
  h.priceConsume.push(state.pClear.consume);
  h.salesFood.push(state.lastSales.food);
  h.salesInd.push(state.lastSales.ind);
  h.salesConsume.push(state.lastSales.consume);
  h.stockFood.push(state.carry.food);
  h.stockInd.push(state.carry.ind);
  h.stockConsume.push(state.carry.consume);
  h.prodFood.push(state.lastProd.food);
  h.prodInd.push(state.lastProd.ind);
  h.prodConsume.push(state.lastProd.consume);
  if (alive.length > 0) {
    h.avgS.push(alive.reduce((s, r) => s + r.S, 0) / alive.length);
    h.avgEff.push(alive.reduce((s, r) => s + r.efficiency, 0) / alive.length);
    h.avgH.push(alive.reduce((s, r) => s + r.H, 0) / alive.length);
    h.avgMoney.push(alive.reduce((s, r) => s + r.money, 0) / alive.length);
  } else {
    h.avgS.push(0); h.avgEff.push(0); h.avgH.push(0); h.avgMoney.push(0);
  }
}

/* ============================================================ UI Update */
function updateUI() {
  const alive = state.residents.filter(r => r.alive);
  const extinct = alive.length === 0;
  document.getElementById("kpiPop").textContent = alive.length;
  const pa = alive.filter(r => r.profession === "agri").length;
  const pi = alive.filter(r => r.profession === "ind").length;
  const pc = alive.filter(r => r.profession === "comm").length;
  document.getElementById("kpiPopSub").textContent = `农${pa} 工${pi} 商${pc}`;
  document.getElementById("kpiGdp").textContent = state.lastGdp.toFixed(1);
  const avgH = alive.length > 0 ? alive.reduce((s, r) => s + r.H, 0) / alive.length : 0;
  const avgS = alive.length > 0 ? alive.reduce((s, r) => s + r.S, 0) / alive.length : 0;
  const avgEff = alive.length > 0 ? alive.reduce((s, r) => s + r.efficiency, 0) / alive.length : 0;
  document.getElementById("kpiHappy").textContent = avgH.toFixed(2);
  document.getElementById("kpiHappySub").textContent = `饱食 ${avgS.toFixed(2)} · 效率 ${avgEff.toFixed(2)}`;
  document.getElementById("turnDisplay").textContent = state.turn;
  // Extinct banner
  const banner = document.getElementById("extinctBanner");
  if (extinct) {
    banner.classList.add("show");
    document.getElementById("btnAuto").disabled = true;
    document.getElementById("btnStep1").disabled = true;
    document.getElementById("btnStep10").disabled = true;
  } else {
    banner.classList.remove("show");
  }
}

/* ============================================================ Charts */
Chart.defaults.font.size = 11;
Chart.defaults.color = "#5a647a";

function lineDataset(label, data, color, yAxisID) {
  return {
    label, data, borderColor: color, backgroundColor: color + "20",
    borderWidth: 1.5, pointRadius: 0, pointHoverRadius: 4,
    tension: 0.3, yAxisID: yAxisID || "y", fill: false,
  };
}

function commonOptions(yLabel, y1Label) {
  const opts = {
    responsive: true, maintainAspectRatio: false,
    interaction: { mode: "index", intersect: false },
    plugins: {
      legend: { position: "top", labels: { boxWidth: 12, boxHeight: 12, font: { size: 10 } } },
      tooltip: { backgroundColor: "rgba(14,19,34,0.9)", titleFont: { size: 11 }, bodyFont: { size: 10 } },
    },
    scales: {
      x: { title: { display: false }, grid: { display: false } },
      y: { title: { display: !!yLabel, text: yLabel, font: { size: 10 } }, grid: { color: "#e2e6ee55" } },
    },
  };
  if (y1Label) {
    opts.scales.y1 = {
      position: "right", title: { display: true, text: y1Label, font: { size: 10 } },
      grid: { display: false },
    };
  }
  return opts;
}

function initCharts() {
  const labels = state.hist.turns;
  // 1. Population
  charts.pop = new Chart(document.getElementById("chartPop"), {
    type: "line",
    data: { labels, datasets: [
      lineDataset("总人口", state.hist.pop, COLORS.total),
      lineDataset("农业", state.hist.popAgri, COLORS.agri),
      lineDataset("工业", state.hist.popInd, COLORS.blue),
      lineDataset("商业", state.hist.popComm, COLORS.orange),
    ]},
    options: commonOptions("人口"),
  });
  // 2. GDP & Prices (dual axis)
  charts.gdp = new Chart(document.getElementById("chartGdp"), {
    type: "line",
    data: { labels, datasets: [
      lineDataset("GDP", state.hist.gdp, COLORS.gdp, "y"),
      lineDataset("农产品价格", state.hist.priceFood, COLORS.food, "y1"),
      lineDataset("工业品价格", state.hist.priceInd, COLORS.blue, "y1"),
      lineDataset("消费品价格", state.hist.priceConsume, COLORS.orange, "y1"),
    ]},
    options: commonOptions("GDP", "价格"),
  });
  // 3. Sales
  charts.sales = new Chart(document.getElementById("chartSales"), {
    type: "line",
    data: { labels, datasets: [
      lineDataset("农产品", state.hist.salesFood, COLORS.food),
      lineDataset("工业品", state.hist.salesInd, COLORS.blue),
      lineDataset("消费品", state.hist.salesConsume, COLORS.orange),
    ]},
    options: commonOptions("销量"),
  });
  // 4. Stock
  charts.stock = new Chart(document.getElementById("chartStock"), {
    type: "line",
    data: { labels, datasets: [
      lineDataset("农产品", state.hist.stockFood, COLORS.food),
      lineDataset("工业品", state.hist.stockInd, COLORS.blue),
      lineDataset("消费品", state.hist.stockConsume, COLORS.orange),
    ]},
    options: commonOptions("库存量"),
  });
  // 5. Production
  charts.prod = new Chart(document.getElementById("chartProd"), {
    type: "line",
    data: { labels, datasets: [
      lineDataset("农产品", state.hist.prodFood, COLORS.food),
      lineDataset("工业品", state.hist.prodInd, COLORS.blue),
      lineDataset("消费品", state.hist.prodConsume, COLORS.orange),
    ]},
    options: commonOptions("产量"),
  });
  // 6. Resident attributes
  charts.attr = new Chart(document.getElementById("chartAttr"), {
    type: "line",
    data: { labels, datasets: [
      lineDataset("平均饱食度", state.hist.avgS, COLORS.food),
      lineDataset("平均生产效率", state.hist.avgEff, COLORS.blue),
      lineDataset("平均幸福度", state.hist.avgH, COLORS.orange),
      lineDataset("平均现金", state.hist.avgMoney, COLORS.gdp),
    ]},
    options: commonOptions("数值"),
  });
}

function updateAllCharts() {
  for (const k in charts) {
    if (k === "resident") continue;
    charts[k].update("none");
  }
}

/* ============================================================ Resident Search */
function searchResidents(query) {
  const q = query.trim().toLowerCase();
  if (!q) return [];
  return state.residents.filter(r =>
    r.name.toLowerCase().includes(q) || String(r.id).includes(q)
  ).slice(0, 50);
}

function showResidentDetail(id) {
  const r = getResident(id);
  if (!r) return;
  currentResidentId = id;

  // Detail cards
  const lifespan = r.deathTurn != null ? r.deathTurn - r.birthTurn : state.turn - r.birthTurn;
  const estate = r.alive ? r.money : (r.money + CFG.salvageRate * r.I * state.pRef.ind);
  const cards = [
    { label: "ID", value: `#${r.id}` },
    { label: "姓名", value: r.name },
    { label: "职业", value: PROF_LABEL[r.profession] },
    { label: "性别", value: r.gender === "M" ? "男" : "女" },
    { label: "状态", value: r.alive ? "存活" : "已故" },
    { label: "出生回合", value: r.birthTurn },
    { label: "死亡回合", value: r.deathTurn ?? "—" },
    { label: "总寿命", value: lifespan + " 回合" },
    { label: "后代数量", value: r.children.length },
    { label: "最终资产", value: estate.toFixed(1) },
  ];
  document.getElementById("detailCards").innerHTML = cards.map(c =>
    `<div class="detail-card"><div class="label">${c.label}</div><div class="value">${c.value}</div></div>`
  ).join("");

  // Family
  const renderFamily = (ids) => {
    if (!ids || ids.length === 0) return `<span style="color:var(--muted);font-size:0.8rem">无</span>`;
    return ids.map(pid => {
      const p = getResident(pid);
      if (!p) return "";
      const cls = p.alive ? "" : " deceased";
      return `<span class="family-tag${cls}" data-id="${p.id}">${p.name} #${p.id}${p.alive ? "" : " (已故)"}</span>`;
    }).join("");
  };
  document.getElementById("familyParents").innerHTML = renderFamily(r.parents);
  document.getElementById("familyChildren").innerHTML = renderFamily(r.children);

  // Personal chart
  document.getElementById("residentChartTitle").textContent = `${r.name} #${r.id} · 个人属性曲线`;
  if (charts.resident) charts.resident.destroy();
  const labels = r.history.map(h => h.turn);
  charts.resident = new Chart(document.getElementById("chartResident"), {
    type: "line",
    data: { labels, datasets: [
      lineDataset("饱食度", r.history.map(h => h.S), COLORS.food),
      lineDataset("生产效率", r.history.map(h => h.eff), COLORS.blue),
      lineDataset("幸福度", r.history.map(h => h.H), COLORS.orange),
      lineDataset("现金", r.history.map(h => h.money), COLORS.gdp),
      lineDataset("工业积累", r.history.map(h => h.I), COLORS.total),
    ]},
    options: commonOptions("数值"),
  });

  document.getElementById("residentDetail").classList.add("show");
  document.getElementById("searchResults").classList.remove("show");
}

/* ============================================================ Event Handlers */
function setupEvents() {
  const slider = document.getElementById("rateSlider");
  const display = document.getElementById("rateDisplay");
  slider.addEventListener("input", () => {
    state.rate = parseFloat(slider.value) / 100;
    display.textContent = (state.rate * 100).toFixed(1) + "%";
  });

  const btnAuto = document.getElementById("btnAuto");
  const btnPause = document.getElementById("btnPause");
  const speedSel = document.getElementById("speedSel");

  function setAutoButtons(running) {
    btnAuto.disabled = running;
    btnPause.disabled = !running;
  }

  btnAuto.addEventListener("click", () => {
    setAutoButtons(true);
    const speed = parseInt(speedSel.value);
    autoTimer = setInterval(() => {
      const ok = runTurn();
      updateUI();
      updateAllCharts();
      if (!ok) { clearInterval(autoTimer); autoTimer = null; setAutoButtons(false); }
    }, speed);
  });

  btnPause.addEventListener("click", () => {
    clearInterval(autoTimer);
    autoTimer = null;
    setAutoButtons(false);
  });

  document.getElementById("btnStep1").addEventListener("click", () => {
    runTurn(); updateUI(); updateAllCharts();
  });

  document.getElementById("btnStep10").addEventListener("click", () => {
    for (let i = 0; i < 10; i++) { if (!runTurn()) break; }
    updateUI(); updateAllCharts();
  });

  document.getElementById("btnReset").addEventListener("click", () => {
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
    setAutoButtons(false);
    document.getElementById("btnStep1").disabled = false;
    document.getElementById("btnStep10").disabled = false;
    for (const k in charts) { if (charts[k]) charts[k].destroy(); }
    charts = {};
    initWorld();
    initCharts();
    document.getElementById("residentDetail").classList.remove("show");
  });

  speedSel.addEventListener("change", () => {
    if (autoTimer) {
      clearInterval(autoTimer);
      const speed = parseInt(speedSel.value);
      autoTimer = setInterval(() => {
        const ok = runTurn();
        updateUI();
        updateAllCharts();
        if (!ok) { clearInterval(autoTimer); autoTimer = null; setAutoButtons(false); }
      }, speed);
    }
  });

  // Search
  const searchInput = document.getElementById("searchInput");
  const searchResults = document.getElementById("searchResults");

  function doSearch() {
    const q = searchInput.value.trim();
    if (!q) { searchResults.classList.remove("show"); return; }
    const results = searchResidents(q);
    if (results.length === 0) {
      searchResults.innerHTML = `<div class="search-item" style="cursor:default;color:var(--muted);justify-content:center">未找到匹配居民</div>`;
    } else {
      searchResults.innerHTML = results.map(r => `
        <div class="search-item" data-id="${r.id}">
          <div class="item-info">
            <span class="item-id">#${r.id}</span>
            <span class="item-name">${r.name}</span>
            <span class="item-prof">${PROF_LABEL[r.profession]}</span>
            <span class="item-gender">${r.gender === "M" ? "男" : "女"}</span>
          </div>
          <span class="status-badge ${r.alive ? "alive" : "dead"}">${r.alive ? "存活" : "已故"}</span>
        </div>
      `).join("");
    }
    searchResults.classList.add("show");
  }

  document.getElementById("btnSearch").addEventListener("click", doSearch);
  searchInput.addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });
  searchInput.addEventListener("input", () => { if (searchInput.value.trim().length >= 1) doSearch(); });

  searchResults.addEventListener("click", e => {
    const item = e.target.closest(".search-item");
    if (item && item.dataset.id) showResidentDetail(+item.dataset.id);
  });

  document.getElementById("familyParents").addEventListener("click", e => {
    const tag = e.target.closest(".family-tag");
    if (tag) showResidentDetail(+tag.dataset.id);
  });
  document.getElementById("familyChildren").addEventListener("click", e => {
    const tag = e.target.closest(".family-tag");
    if (tag) showResidentDetail(+tag.dataset.id);
  });
}

/* ============================================================ Boot */
initWorld();
initCharts();
setupEvents();
</script>
