<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>AI Portal — 大模型门户</title>
<style>
/* ===== CSS Variables ===== */
:root{
  --accent:#16c3c9;--accent2:#0ea5ad;--accent3:#0b8a91;--accent4:#37bdb6;
  --gradient:linear-gradient(135deg,#16c3c9,#0ea5ad 50%,#37bdb6);
  --bg-primary:#fafafa;--bg-secondary:#fff;
  --bg-card:rgba(255,255,255,0.9);--bg-card-hover:#fff;
  --border:rgba(22,195,201,0.12);
  --text-primary:#1a282a;--text-secondary:#5a787b;--text-muted:#9ab5b8;
  --shadow:0 4px 24px rgba(22,195,201,0.12);
  --radius:16px;--radius-sm:10px;--radius-xs:6px;
  --tab-height:56px;--safe-bottom:env(safe-area-inset-bottom,0px);
}
.dark{
  --bg-primary:#1a1a2e;--bg-secondary:#16213e;
  --bg-card:rgba(255,255,255,0.06);--bg-card-hover:rgba(255,255,255,0.1);
  --border:rgba(22,195,201,0.15);
  --text-primary:#e0e8f0;--text-secondary:#8899aa;--text-muted:#556677;
  --shadow:0 4px 24px rgba(0,0,0,0.3);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px;color:var(--text-primary);background:var(--bg-primary);
  line-height:1.5;overflow:hidden;height:100vh;width:100vw;
  -webkit-font-smoothing:antialiased;
}
#app{display:flex;flex-direction:column;height:100vh;max-width:480px;margin:0 auto;position:relative;overflow:hidden}

/* ===== Tab Bar ===== */
.tab-bar{
  display:flex;align-items:center;justify-content:space-around;
  height:var(--tab-height);padding-bottom:var(--safe-bottom);
  background:var(--bg-secondary);border-top:1px solid var(--border);
  flex-shrink:0;z-index:10;
}
.tab-item{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:10px;color:var(--text-muted);gap:2px;cursor:pointer;
  padding:4px 12px;transition:color 0.2s;
}
.tab-item.active{color:var(--accent);font-weight:600}
.tab-item .tab-icon{font-size:20px;line-height:1}

/* ===== Page Content ===== */
.page-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px 16px}
.page-content::-webkit-scrollbar{display:none}
.page-panel{display:none}
.page-panel.active{display:block}

/* ===== Search Bar ===== */
.search-bar{
  display:flex;align-items:center;gap:8px;background:var(--bg-card);
  border:1px solid var(--border);border-radius:24px;padding:10px 16px;
  margin-bottom:16px;box-shadow:0 1px 8px rgba(22,195,201,0.06);
}
.search-bar .s-icon{font-size:16px;flex-shrink:0}
.search-bar input{flex:1;background:none;border:none;outline:none;font-size:14px;color:var(--text-primary)}
.search-bar input::placeholder{color:var(--text-muted)}

/* ===== Filter Chips ===== */
.filter-row{display:flex;margin-bottom:12px;flex-wrap:wrap;gap:6px}
.filter-chip{
  padding:6px 14px;border-radius:20px;background:var(--bg-card);
  border:1px solid var(--border);font-size:12px;cursor:pointer;
  transition:all 0.2s;white-space:nowrap;user-select:none;
}
.filter-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.filter-group{margin-bottom:10px}
.filter-parent{display:flex;align-items:center;margin-bottom:6px;gap:8px}
.filter-label{font-size:13px;font-weight:700;color:var(--text-primary);flex-shrink:0;min-width:40px}
.filter-children{padding-left:10px;display:flex;flex-wrap:wrap;gap:4px;border-left:2px solid var(--border)}
.filter-children .filter-chip{font-size:11px;padding:5px 10px}

/* ===== Section Title ===== */
.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-title .title-text{font-size:17px;font-weight:700}
.section-title .more{font-size:12px;color:var(--accent2);cursor:pointer}

/* ===== Cards Grid ===== */
.cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-bottom:20px}
.model-card,.agent-card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:14px;position:relative;cursor:pointer;
  transition:transform 0.15s,box-shadow 0.15s;
}
.model-card:hover,.agent-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.card-logo{
  width:40px;height:40px;border-radius:10px;display:flex;
  align-items:center;justify-content:center;font-size:20px;flex-shrink:0;
}
.card-info{overflow:hidden}
.card-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-company{font-size:11px;color:var(--text-secondary)}
.card-country{
  font-size:10px;padding:2px 8px;border-radius:10px;
  background:rgba(22,195,201,0.12);color:var(--accent);display:inline-block;margin-bottom:6px;
}
.card-features{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.card-feat{
  font-size:10px;padding:3px 8px;border-radius:12px;
  background:rgba(22,195,201,0.1);color:var(--accent2);
}
.card-desc{font-size:11px;color:var(--text-secondary);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.fav-btn{
  position:absolute;bottom:8px;right:8px;width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;cursor:pointer;z-index:2;color:#d0d0d0;
}
.fav-btn.faved{color:#e74c3c}
.card-rating{font-size:11px;color:var(--accent);font-weight:600;margin-bottom:4px}
.card-rating-count{font-size:9px;color:var(--text-muted);font-weight:400}

/* ===== Hero Swiper ===== */
.hero-banner{
  height:180px;border-radius:var(--radius);overflow:hidden;margin-bottom:20px;
  position:relative;background:var(--gradient);color:#fff;
}
.hero-slide{
  height:100%;display:flex;flex-direction:column;justify-content:flex-end;
  padding:20px;cursor:pointer;display:none;
}
.hero-slide.active{display:flex}
.hero-slide .tag{
  display:inline-block;padding:4px 12px;background:rgba(255,255,255,0.2);
  border-radius:20px;font-size:11px;margin-bottom:8px;width:fit-content;
}
.hero-slide .title{font-size:20px;font-weight:700;margin-bottom:4px}
.hero-slide .desc{font-size:13px;opacity:0.9}
.hero-dots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.hero-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.4);cursor:pointer}
.hero-dot.active{background:#fff;width:16px;border-radius:3px}

/* Day cards in news swiper */
.day-card-slide{justify-content:space-between!important;padding:18px 20px!important;cursor:pointer}
.day-card-header{display:flex;align-items:baseline;gap:8px}
.day-card-label{font-size:20px;font-weight:700}
.day-card-date{font-size:13px;opacity:0.75}
.day-card-count{font-size:14px;opacity:0.85;margin-top:8px}
.day-card-headline{margin-top:10px;padding:10px 14px;background:rgba(255,255,255,0.15);border-radius:8px}
.day-card-tag{font-size:11px;display:block;opacity:0.8;margin-bottom:4px}
.day-card-title{font-size:14px;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.day-card-hint{font-size:12px;opacity:0.6;text-align:right;margin-top:auto}

/* Daily news detail modal */
.daily-news-sheet{max-height:80vh}
.daily-news-header{text-align:center;padding:4px 0 12px;border-bottom:1px solid var(--border);margin-bottom:12px}
.daily-news-day{font-size:22px;font-weight:700;display:block}
.daily-news-date{font-size:14px;color:var(--text-secondary);margin-top:4px;display:block}
.daily-news-list{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.daily-news-item{padding:14px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm)}
.dni-tag{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:4px;display:block}
.dni-title{font-size:15px;font-weight:700;margin-bottom:6px;line-height:1.4}
.dni-detail{font-size:13px;color:var(--text-secondary);line-height:1.8;margin-bottom:8px}
.dni-footer{display:flex;align-items:center;justify-content:space-between}
.dni-source{font-size:11px;color:var(--text-muted)}
.dni-copy-link{font-size:12px;color:var(--accent2);cursor:pointer;padding:2px 8px}
.dni-copy-link:hover{text-decoration:underline}

/* ===== Stats Row ===== */
.stats-row{display:flex;gap:8px;margin-bottom:24px}
.stat-card{
  flex:1;padding:14px;border-radius:var(--radius-sm);background:var(--bg-card);
  border:1px solid var(--border);text-align:center;cursor:pointer;
}
.stat-card .stat-num{
  font-size:22px;font-weight:700;
  background:linear-gradient(135deg,#16c3c9,#0ea5ad 50%,#37bdb6);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
}
.stat-card .stat-label{font-size:10px;color:var(--text-secondary);margin-top:2px}

/* ===== Knowledge Grid ===== */
.knowledge-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.knowledge-card{
  background:var(--bg-card);border:1px solid var(--border);border-top:3px solid var(--accent);
  border-radius:var(--radius-sm);padding:14px;cursor:pointer;
}
.knowledge-card .kc-icon{font-size:28px;margin-bottom:10px}
.knowledge-card .kc-title{font-size:14px;font-weight:600;margin-bottom:4px}
.knowledge-card .kc-desc{font-size:11px;color:var(--text-secondary);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.knowledge-card .kc-level{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;color:#fff;margin-top:8px}
.knowledge-card .kc-level.beginner{background:#37bdb6}
.knowledge-card .kc-level.intermediate{background:#f0ad4e}
.knowledge-card .kc-level.advanced{background:#e74c3c}

/* ===== Timeline ===== */
.timeline{position:relative;padding-left:20px;margin-bottom:24px}
.timeline::before{
  content:'';position:absolute;left:6px;top:4px;bottom:4px;width:2px;
  background:linear-gradient(180deg,var(--accent),var(--accent2),var(--accent4));border-radius:1px;
}
.timeline-item{position:relative;margin-bottom:16px;padding-left:16px;cursor:pointer}
.timeline-item::before{
  content:'';position:absolute;left:-17px;top:6px;width:10px;height:10px;
  border-radius:50%;background:var(--accent);border:2px solid var(--bg-primary);
}
.timeline-item .tl-date{font-size:11px;color:var(--accent2);margin-bottom:2px}
.timeline-item .tl-title{font-size:14px;font-weight:600}
.timeline-item .tl-desc{font-size:12px;color:var(--text-secondary);margin-top:2px}

/* ===== Trending ===== */
.trending-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.trending-chip{
  padding:5px 10px;border-radius:20px;background:var(--bg-card);
  border:1px solid var(--border);font-size:11px;cursor:pointer;text-align:center;
}

/* ===== Rank Items ===== */
.rank-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer}
.rk-num{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--bg-card);color:var(--text-muted);flex-shrink:0}
.rk-num.g{background:linear-gradient(135deg,#ffd700,#ffb800);color:#fff}
.rk-num.s{background:linear-gradient(135deg,#c0c0c0,#a0a0a0);color:#fff}
.rk-num.b{background:linear-gradient(135deg,#cd7f32,#b8722f);color:#fff}
.rk-info{flex:1;overflow:hidden}
.rk-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-score{font-size:14px;font-weight:700;color:var(--accent);flex-shrink:0}
.rk-star{color:#ffc107}

/* ===== Bench Tabs ===== */
.bench-tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.bench-tab{padding:6px 12px;border-radius:16px;background:var(--bg-card);border:1px solid var(--border);font-size:11px;cursor:pointer}
.bench-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ===== Compare Table ===== */
.pick-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pick-chip{padding:4px 10px;border-radius:12px;background:var(--bg-card);border:1px solid var(--border);font-size:11px;cursor:pointer}
.pick-chip.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.cmp-table{overflow-x:auto;margin-bottom:12px}
.cmp-row{display:flex;border-bottom:1px solid var(--border);min-width:300px}
.cmp-label{width:70px;padding:8px 6px;font-size:12px;font-weight:600;color:var(--accent2);flex-shrink:0;background:rgba(22,195,201,0.04)}
.cmp-cell{flex:1;padding:8px 6px;font-size:12px;text-align:center;min-width:80px}
.cmp-name{font-weight:600;font-size:13px}
.dim{color:var(--text-muted)}

/* ===== Learning Path ===== */
.path-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.path-card{
  background:var(--bg-card);border:1px solid var(--border);border-top:3px solid var(--accent);
  border-radius:var(--radius-sm);padding:14px;cursor:pointer;
}
.path-card .kc-icon{font-size:28px;margin-bottom:10px}
.path-name{font-size:14px;font-weight:600;margin-bottom:4px}
.path-desc{font-size:11px;color:var(--text-secondary);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.path-step{font-size:10px;color:var(--accent);margin-top:8px}

/* ===== Detail Page ===== */
.detail-header{display:flex;align-items:center;gap:16px;margin-bottom:20px;padding:20px;background:var(--bg-card);border-radius:var(--radius);border:1px solid var(--border)}
.detail-logo{width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:36px;flex-shrink:0}
.detail-name{font-size:22px;font-weight:700}
.detail-company{font-size:13px;color:var(--text-secondary);margin-top:2px}
.detail-rating{font-size:14px;color:var(--accent);font-weight:600;margin-top:4px}
.detail-section{margin-bottom:20px;padding:16px;background:var(--bg-card);border-radius:var(--radius);border:1px solid var(--border)}
.detail-section-title{font-size:16px;font-weight:700;margin-bottom:12px}
.detail-specs{display:flex;flex-direction:column;gap:8px}
.spec-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.spec-label{font-size:13px;color:var(--text-secondary)}
.spec-value{font-size:13px;font-weight:500;text-align:right;max-width:60%}
.detail-tags{display:flex;flex-wrap:wrap;gap:6px}
.detail-tag{padding:4px 12px;border-radius:12px;background:rgba(22,195,201,0.1);color:var(--accent2);font-size:12px}
.detail-text{font-size:13px;color:var(--text-secondary);line-height:1.8;white-space:pre-line}
.code-tabs{display:flex;gap:4px;margin-bottom:12px}
.code-tab{padding:6px 14px;border-radius:16px;background:var(--bg-card);border:1px solid var(--border);font-size:12px;cursor:pointer}
.code-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.code-block{background:#1a1a2e;color:#e0e8f0;padding:16px;border-radius:10px;font-size:12px;line-height:1.6;overflow-x:auto;white-space:pre;font-family:'SF Mono','Fira Code',monospace}
.code-text{color:#e0e8f0}
.detail-link{padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;font-size:13px}
.detail-link:hover{color:var(--accent)}
.bench-grid{display:flex;flex-direction:column;gap:10px}
.bench-item{display:flex;align-items:center;gap:10px}
.bench-label{min-width:80px;flex-shrink:0}
.bench-name{font-size:12px;font-weight:600;display:block}
.bench-desc{font-size:10px;color:var(--text-muted)}
.bench-bar-bg{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.bench-bar-fill{height:100%;background:var(--gradient);border-radius:3px;transition:width 0.5s}
.bench-val{font-size:12px;font-weight:600;color:var(--accent);min-width:45px;text-align:right}
.ver-timeline{padding-left:16px;border-left:2px solid var(--border)}
.ver-item{position:relative;margin-bottom:12px;padding-left:12px}
.ver-dot{position:absolute;left:-21px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.ver-name{font-weight:600;font-size:13px}
.ver-date{font-size:11px;color:var(--text-muted)}
.ver-desc{font-size:12px;color:var(--text-secondary);margin-top:2px}

/* ===== My Page ===== */
.my-section{margin-bottom:20px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;cursor:pointer}
.section-header .title{font-size:15px;font-weight:600}
.expand-arrow{font-size:12px;color:var(--text-muted)}
.clear-btn{font-size:11px;color:var(--text-muted);padding:4px 10px;border-radius:12px;border:1px solid var(--border);background:var(--bg-card);cursor:pointer}
.fav-list{display:flex;flex-direction:column;gap:8px}
.fav-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--radius-sm);background:var(--bg-card);border:1px solid var(--border);cursor:pointer}
.fav-card-left{display:flex;align-items:center;gap:10px;flex:1;overflow:hidden}
.fav-card-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;background:rgba(22,195,201,0.1);flex-shrink:0}
.fav-card-info{flex:1;overflow:hidden}
.fav-card-name{font-size:13px;font-weight:500}
.fav-card-meta{font-size:11px;color:var(--text-secondary)}
.fav-card-del{font-size:16px;color:var(--text-muted);cursor:pointer;padding:4px;flex-shrink:0;z-index:2}
.fav-card-del:hover{color:#e74c3c}
.calc-input-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:10px 14px;background:var(--bg-card);border-radius:10px;border:1px solid var(--border)}
.calc-label{font-size:13px;color:var(--text-secondary)}
.calc-input-row input{width:120px;text-align:right;border:none;background:none;font-size:14px;color:var(--text-primary);outline:none}
.calc-results{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.calc-item{display:flex;justify-content:space-between;padding:8px 12px;cursor:pointer;border-radius:8px}
.calc-item:hover{background:var(--bg-card)}
.calc-item .calc-name{font-size:13px}
.calc-item .calc-cost{font-size:13px;font-weight:600}

/* ===== Text Viewer ===== */
.viewer-file-info{display:flex;align-items:center;padding:8px 12px;background:var(--bg-card);border-radius:8px;margin-bottom:8px;font-size:13px}
.viewer-content-area{margin-top:8px}
.json-viewer{background:#fafafa;border-radius:8px;padding:8px;max-height:400px;overflow:auto;font-family:Consolas,Monaco,monospace;font-size:12px;line-height:1.6}
.json-viewer table{width:100%;border-collapse:collapse}
.json-viewer .jv-ln{width:40px;text-align:right;padding-right:12px;color:#999;user-select:none;vertical-align:top}
.json-viewer .jv-code{white-space:pre-wrap;word-break:break-all}
.json-viewer .jv-key{color:#0451a5}
.json-viewer .jv-str{color:#a31515}
.json-viewer .jv-num{color:#098658}
.json-viewer .jv-bool{color:#0000ff}

/* ===== Section Group ===== */
.section-group{margin-bottom:24px;padding:0 0 8px 0;border-bottom:1px solid var(--border)}
.section-group:last-child{border-bottom:none}
.section-group-title{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:12px;padding:4px 0}

/* ===== Selector ===== */
.selector-steps{display:flex;flex-direction:column;gap:12px}
.selector-step-label{font-size:12px;font-weight:600;color:var(--text-primary);margin-bottom:6px}
.selector-opts{display:flex;flex-wrap:wrap;gap:6px}
.selector-opt{padding:5px 12px;border-radius:14px;background:var(--bg-card);border:1px solid var(--border);font-size:12px;cursor:pointer;transition:all 0.2s}
.selector-opt.active{background:var(--accent);border-color:var(--accent);color:#fff}
.selector-opt:hover:not(.active){border-color:var(--accent)}
.selector-result{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;margin-bottom:8px;border-radius:10px;background:var(--bg-card);border:1px solid var(--border);cursor:pointer}
.selector-result-num{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.selector-result-info{flex:1;overflow:hidden}
.selector-result-name{font-size:13px;font-weight:600}
.selector-result-reason{font-size:11px;color:var(--text-secondary);margin-top:2px}

/* ===== Code Block ===== */
.code-block{margin:8px 0;padding:12px;background:#1e1e2e;border-radius:10px;overflow-x:auto;font-size:12px;line-height:1.6}
.code-block pre{margin:0;white-space:pre-wrap;word-break:break-all}
.code-block code{color:#cdd6f4;font-family:'Consolas','Monaco','Courier New',monospace}
.copy-btn{padding:6px 14px;border-radius:8px;background:var(--accent);color:#fff;border:none;font-size:12px;cursor:pointer;margin-top:4px}

/* ===== Prompt Templates ===== */
.tpl-item{margin-bottom:14px}
.tpl-title{font-size:13px;font-weight:600;margin-bottom:4px}
.tpl-textarea{width:100%;padding:10px;border-radius:8px;background:var(--bg-card);border:1px solid var(--border);font-size:12px;line-height:1.6;resize:vertical;font-family:'Consolas','Monaco',monospace;color:var(--text-primary);box-sizing:border-box}

/* ===== Price Trend ===== */
.price-bar-row{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer}
.price-bar-name{width:120px;font-size:12px;text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.price-bar-track{flex:1;height:14px;background:var(--bg-card);border-radius:7px;overflow:hidden}
.price-bar-fill{height:100%;border-radius:7px;transition:width 0.4s}
.price-bar-val{width:60px;font-size:12px;font-weight:600;color:var(--accent);flex-shrink:0}

/* ===== Token Result ===== */
.token-result{margin-top:12px;padding:14px;background:var(--bg-card);border:1px solid var(--border);border-radius:10px}
.token-result-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.token-result-label{color:var(--text-secondary)}
.token-result-val{font-weight:600;color:var(--accent)}

/* ===== Empty State ===== */
.empty-state{text-align:center;padding:40px 20px;color:var(--text-muted)}
.empty-state .empty-icon{font-size:40px;margin-bottom:12px}
.empty-state .empty-text{font-size:13px}

/* ===== Modal / Sheet ===== */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal-sheet{width:100%;max-width:480px;max-height:85vh;background:var(--bg-secondary);border-radius:16px 16px 0 0;padding:20px 16px 28px;overflow-y:auto}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.modal-section{margin-bottom:16px}
.modal-section-title{font-size:14px;font-weight:700;margin-bottom:8px}
.modal-text{font-size:13px;color:var(--text-secondary);line-height:1.8}
.modal-tags{display:flex;flex-wrap:wrap;gap:6px}
.modal-tag{padding:4px 12px;border-radius:12px;background:rgba(22,195,201,0.1);color:var(--accent2);font-size:12px}
.platform-link{padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px}
.platform-link:hover{color:var(--accent)}
.modal-close-btn{width:100%;padding:12px;border-radius:14px;background:var(--gradient);color:#fff;border:none;font-size:15px;cursor:pointer;margin-top:8px}
.resource-url{font-size:12px;color:var(--accent);word-break:break-all;cursor:pointer}
.level-badge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:10px;color:#fff;margin-top:4px}
.level-badge.beginner{background:#37bdb6}
.level-badge.intermediate{background:#f0ad4e}
.level-badge.advanced{background:#e74c3c}

/* ===== FAB ===== */
.fab-btn{
  position:fixed;width:52px;height:52px;border-radius:50%;
  background:var(--gradient);box-shadow:0 4px 20px rgba(22,195,201,0.35);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;z-index:50;cursor:pointer;right:16px;bottom:100px;
  user-select:none;touch-action:none;transition:transform 0.15s;
}
.fab-btn:active{transform:scale(0.92)}

/* ===== Chat Panel ===== */
.chat-container{
  position:fixed;inset:0;z-index:200;background:var(--bg-secondary);
  display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);
}
.chat-container.open{transform:translateY(0)}
.chat-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.chat-title{font-size:16px;font-weight:700}
.header-actions{display:flex;align-items:center;gap:8px}
.clear-chat-btn,.close-btn{
  width:32px;height:32px;border-radius:50%;background:var(--bg-card);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
  font-size:14px;cursor:pointer;
}
.chat-body{flex:1;padding:12px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.msg{max-width:85%;padding:8px 12px;border-radius:14px;font-size:13px;line-height:1.7;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--bg-card);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.loading{align-self:flex-start;background:var(--bg-card);border:1px solid var(--border);padding:10px 16px}
.loading-dots{display:flex;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:dotBounce 1.4s infinite ease-in-out both}
.dot:nth-child(2){animation-delay:0.16s}
.dot:nth-child(3){animation-delay:0.32s}
@keyframes dotBounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
.question-list{padding:6px 14px 0}
.ql-title{font-size:11px;color:var(--text-muted);margin-bottom:4px;display:block}
.ql-scroll{display:flex;flex-wrap:wrap;gap:4px}
.ql-chip{display:flex;align-items:center;border-radius:10px;background:rgba(22,195,201,0.08);padding:2px 4px 2px 10px;font-size:11px}
.ql-chip-text{color:var(--accent);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.ql-chip-del{font-size:12px;color:var(--text-muted);padding:2px 6px;cursor:pointer}
.chat-input-row{display:flex;align-items:flex-end;padding:8px 12px;border-top:1px solid var(--border);gap:8px;background:var(--bg-primary);padding-bottom:calc(8px + var(--safe-bottom))}
.quick-search-btn{width:36px;height:36px;border-radius:8px;background:rgba(22,195,201,0.08);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;flex-shrink:0}
.chat-input-row textarea{flex:1;min-height:36px;max-height:120px;padding:8px 12px;border-radius:8px;background:var(--bg-secondary);border:1px solid var(--border);font-size:14px;line-height:1.4;resize:none;outline:none;font-family:inherit;color:var(--text-primary)}
.send-btn{width:52px;height:36px;border-radius:8px;background:var(--accent);color:#fff;border:none;font-size:13px;cursor:pointer;flex-shrink:0}
.quick-panel-mask{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,0.4);display:flex;align-items:flex-end}
.quick-panel{width:100%;max-width:480px;max-height:60vh;background:var(--bg-secondary);border-radius:16px 16px 0 0;display:flex;flex-direction:column;margin:0 auto}
.quick-panel-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--border);flex-shrink:0}
.quick-panel-title{font-size:14px;font-weight:600}
.quick-panel-close{font-size:18px;color:var(--text-muted);cursor:pointer;padding:4px}
.quick-panel-tabs{display:flex;padding:0 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.qp-tab{flex:1;text-align:center;padding:10px 0;font-size:12px;color:var(--text-secondary);border-bottom:2px solid transparent;cursor:pointer}
.qp-tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.quick-panel-body{flex:1;padding:10px 14px 20px;overflow-y:auto}
.qp-item{display:block;font-size:13px;padding:10px 0;border-bottom:1px solid var(--border);color:var(--text-primary);cursor:pointer}
.qp-item:hover{color:var(--accent)}

/* ===== Toast ===== */
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;z-index:500;opacity:0;transition:opacity 0.3s;pointer-events:none}
.toast.show{opacity:1}

/* ===== Confirm Dialog ===== */
.confirm-mask{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:400;display:flex;align-items:center;justify-content:center}
.confirm-box{background:var(--bg-secondary);border-radius:14px;padding:24px 20px 16px;width:280px;text-align:center}
.confirm-title{font-size:16px;font-weight:700;margin-bottom:8px}
.confirm-content{font-size:13px;color:var(--text-secondary);margin-bottom:20px}
.confirm-btns{display:flex;gap:10px}
.confirm-btns button{flex:1;padding:10px;border-radius:10px;font-size:14px;cursor:pointer;border:none}
.confirm-cancel{background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border)!important}
.confirm-ok{background:var(--accent);color:#fff}

/* ===== Extra Panel ===== */
.extra-panel{margin-bottom:20px;padding:14px;background:var(--bg-card);border-radius:var(--radius);border:1px solid var(--border)}

/* ===== Detail Back ===== */
.back-btn{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--accent);cursor:pointer;margin-bottom:12px;padding:4px 0}
.back-btn:hover{opacity:0.8}

/* ===== Dark Mode Toggle ===== */
.theme-toggle{position:fixed;top:12px;right:12px;z-index:40;width:36px;height:36px;border-radius:50%;background:var(--bg-card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.08)}

/* ===== Desktop tweaks ===== */
@media(min-width:481px){
  #app{border-left:1px solid var(--border);border-right:1px solid var(--border)}
  .fab-btn{right:calc(50% - 240px + 16px)}
}
</style>

  <!-- Tab: Models -->

  <div id="modalContainer"></div>

  <div class="toast" id="toast"></div>

</div>

const qaDatabase = [
  {keywords:['推荐','大模型','国内','国产','哪个好','选哪个','选择'],question:'推荐几个国内大模型',answer:'**国内主流大模型推荐**：\n\n1. **DeepSeek-V4 Pro** — 深度求索出品，1.6T MoE架构，MIT开源，SWE-bench打平Claude Opus，API价格仅为生成式预训练模型-5.5的1/20\n2. **DeepSeek-R1** — 推理增强版，思维链透明，数学/编程能力极强，适合复杂推理任务\n3. **Qwen3.7-Max** — 阿里云出品，多规格开源(0.5B-110B)，阿里云生态深度集成\n4. **Kimi K2.7 Code** — 月之暗面出品，200万字超长上下文，论文阅读和长文档处理能力一流\n5. **文心大模型 5.1** — 百度出品，中文深度优化，百度搜索增强，插件生态丰富\n6. **GLM-5.2** — 智谱AI出品，All-Tools多工具调用，AutoGLM手机操控Agent\n7. **豆包 2.1 Pro** — 字节跳动出品，语音对话流畅，图片生成，App免费使用\n\n选择建议：追求性价比选DeepSeek，长文档选Kimi，中文创作选文心一言，多模态选通义千问或智谱GLM'},
  {keywords:['国际','国外','最强','顶级','Claude','Gemini','生成式预训练模型'],question:'国际顶级大模型有哪些',answer:'**国际顶级大模型**：\n\n1. **生成式预训练模型-5.5** (OpenAI) — 博士级推理，1M上下文，多模态理解，代码SOTA，综合评分4.9\n2. **Claude Opus 4.8** (Anthropic) — 顶级推理能力，200K上下文，安全对齐最好，复杂任务首选\n3. **Claude Sonnet 4.6** (Anthropic) — 深度推理+Computer Use，性价比高于Opus\n4. **Gemini 3.5 Flash** (Google) — 原生多模态，1M上下文，Google生态集成\n5. **Llama 4 Maverick** (Meta) — 128B MoE开源可商用，社区生态最丰富\n6. **Mistral Large 3** (Mistral AI) — 欧洲最强，多语言支持(含中文)，函数调用优秀\n\n注意：国际模型在国内可能无法直接访问，建议使用国内替代方案或通过合规渠道接入'},
  {keywords:['编程','代码','开发','编程助手','coding'],question:'有哪些AI编程助手',answer:'**主流AI编程助手**：\n\n**国内**：\n- **Trae** — 字节跳动出品，AI原生IDE，中文友好，免费使用\n- **CodeBuddy** — 腾讯云出品，微信生态深度集成\n- **通义灵码** — 阿里云出品，代码补全+自然语言编程\n- **Baidu Comate** — 百度出品，安全合规，企业定制\n- **MarsCode** — 字节跳动出品，云端IDE，豆包AI驱动\n\n**国际**：\n- **GitHub Copilot** — 最流行，IDE深度集成，Agent模式\n- **Cursor** — AI原生IDE，Composer多文件编辑\n- **Devin Desktop** — Cascade流式Agent，超快补全\n- **Claude Code** — Anthropic出品，终端+IDE集成，全栈开发\n- **Devin** — 全自主编程，PR提交+测试修复+部署\n\n个人开发者推荐：Trae(免费)或Cursor(功能最强)'},
  {keywords:['开源','免费','商用','私有化','部署'],question:'有哪些开源可商用的大模型',answer:'**开源可商用的大模型**：\n\n**国内**：\n- **DeepSeek-V4 Pro** — 1.6T MoE，SWE-bench打平Claude Opus，MIT协议\n- **DeepSeek-R1** — 推理增强版，开源可商用\n- **Qwen3.7-Max** — 0.5B-110B多规格，Apache 2.0\n- **Qwen3-Coder** — 代码专用，1.5B-32B可选\n- **Step 3.7 Flash** — 万亿参数MoE，开源\n- **Yi系列** — 零一万物出品，多规格可选\n- **BGE-M3** — 智源出品，嵌入模型，MIT协议\n\n**国际**：\n- **Llama 4 Maverick/Scout** — Meta出品，社区生态最丰富\n- **Mixtral 8x22B** — Mistral AI，Apache 2.0\n- **Whisper Large v3** — OpenAI，语音识别\n\n部署工具推荐：Ollama(最简单)、vLLM(高性能)、llama.cpp(CPU友好)'},
  {keywords:['微调','fine-tuning','finetune','LoRA','QLoRA','P-Tuning','训练'],question:'大模型微调是什么',answer:'**大模型微调（Fine-tuning）** 是在预训练模型基础上，使用特定领域数据继续训练的过程，让通用模型适配垂直领域需求。\n\n**常见微调方法**：\n1. **全量微调（Full Fine-tuning）** — 更新所有参数，效果最好但显存需求最大（需8×A100）\n2. **LoRA（Low-Rank Adaptation）** — 只训练低秩矩阵，将可训练参数降至原来的0.1%-1%，显存需求大幅降低\n3. **QLoRA** — LoRA + 4bit量化，消费级GPU(如RTX 4090)即可微调70B模型\n4. **P-Tuning v2** — 在输入层添加可学习的软提示（Soft Prompt），不修改模型本体\n5. **Adapter** — 在Transformer层之间插入小型适配器模块\n6. **IA3** — 仅训练3个向量，极致轻量\n\n**推荐工具**：\n- LLaMA-Factory：中文友好，一键微调\n- Hugging Face PEFT：主流PEFT库\n- Axolotl：功能强大的微调框架\n- Unsloth：2-5倍加速，显存减半'},
  {keywords:['RAG','检索增强','知识库','向量','embedding','检索'],question:'什么是RAG技术',answer:'**RAG（检索增强生成）** 是将信息检索与文本生成结合的技术，让大模型能访问外部知识库来回答问题。\n\n**RAG工作流程**：\n1. **文档解析** — 将PDF/Word/网页等文档解析为纯文本\n2. **文本分块（Chunking）** — 将长文本切分为适当大小的块（通常256-1024 tokens）\n3. **向量嵌入（Embedding）** — 用嵌入模型将文本块转为向量\n4. **向量存储** — 存入向量数据库（Milvus/Pinecone/Chroma/Qdrant）\n5. **检索** — 用户提问时，将问题转为向量，在库中搜索最相似的top-K文本块\n6. **生成** — 将检索结果作为上下文注入Prompt，让LLM基于此生成答案\n\n**进阶技术**：\n- **混合检索**：稠密向量 + 稀疏(BM25) + 关键词，综合召回\n- **Reranking**：用重排序模型对检索结果精排，提升准确度\n- **Graph RAG**：基于知识图谱的多跳检索\n- **Agentic RAG**：Agent自主规划检索策略'},
  {keywords:['Transformer','注意力','attention','原理','架构'],question:'Transformer架构原理是什么',answer:'**Transformer** 是2017年Google提出的神经网络架构，彻底改变了NLP领域，是所有现代大模型的基础。\n\n**核心组件**：\n1. **自注意力机制（Self-Attention）** — 让每个词关注序列中所有其他词，捕获长距离依赖关系\n2. **多头注意力（Multi-Head Attention）** — 并行运行多个注意力头，每个头关注不同的表示子空间\n3. **位置编码（Positional Encoding）** — 为序列注入位置信息（Transformer本身不感知顺序）\n4. **前馈网络（FFN）** — 每个位置的独立非线性变换\n5. **残差连接 + 层归一化** — 稳定深层网络训练\n\n**架构变体**：\n- **Encoder-Only**（BERT）：双向注意力，适合理解任务\n- **Decoder-Only**（GPT系列）：单向(因果)注意力，适合生成任务 — 当前主流\n- **Encoder-Decoder**（T5/BART）：适合翻译、摘要等seq2seq任务'},
  {keywords:['MoE','混合专家','mixture of experts'],question:'什么是MoE混合专家架构',answer:'**MoE（Mixture of Experts，混合专家）** 是一种模型架构，将模型分为多个"专家"子网络，每次推理只激活其中一部分。\n\n**工作原理**：\n1. 模型包含N个专家（Expert）子网络，如DeepSeek-V4 Pro有384个专家\n2. 每个token通过门控网络（Gate/Router）选择top-K个专家（通常K=2~8）\n3. 只有被选中的专家参与计算，其他专家处于休眠状态\n4. 不同专家可能擅长不同类型的任务\n\n**优势**：\n- **效率**：总参数量大但活跃参数少。如DeepSeek-V4 Pro总参1.6T，每次仅激活49B\n- **成本**：推理成本远低于同等质量的稠密模型\n- **扩展性**：增加专家数量即可扩展模型容量\n\n**代表模型**：DeepSeek-V4 Pro、Mixtral 8x22B、Llama 4 Maverick'},
  {keywords:['幻觉','hallucination','胡编','编造','不准确'],question:'大模型为什么会"幻觉"',answer:'**大模型幻觉（Hallucination）** 是指模型生成看似合理但实际错误或虚构的内容。\n\n**产生原因**：\n1. **训练数据局限性** — 训练数据可能包含错误、过时或不完整的信息\n2. **概率生成本质** — 模型本质是"预测下一个最可能的token"，而非"事实验证"\n3. **知识截止日期** — 训练数据有截止时间，之后的事件模型不知道但可能"编造"\n4. **对齐税** — 过度对齐可能导致模型过于"讨好"用户而牺牲事实准确性\n5. **上下文误导** — 有偏见的提示词可能引导模型输出错误方向\n\n**缓解方法**：\n- **RAG**：接入外部知识库，基于事实检索而非模型记忆\n- **联网搜索**：实时查询最新信息\n- **来源引用**：要求模型标注信息来源\n- **多模型交叉验证**：用不同模型验证同一事实\n- **降低Temperature**：减少随机性，更保守的输出'},
  {keywords:['对齐','alignment','RLHF','DPO','安全','价值观'],question:'什么是大模型对齐',answer:'**AI对齐（Alignment）** 是确保大模型的行为符合人类价值观、意图和伦理规范的技术。\n\n**主要对齐技术**：\n1. **RLHF（基于人类反馈的强化学习）**\n   - 收集人类对模型回答的偏好数据\n   - 训练奖励模型（Reward Model）预测人类偏好\n   - 用PPO算法优化模型，使其输出更符合人类偏好\n   - 代表：生成式预训练转换器、Claude的训练方法\n\n2. **DPO（直接偏好优化）**\n   - 直接从偏好数据中学习，无需训练独立的奖励模型\n   - 更简单、更稳定、计算成本更低\n   - 逐渐取代RLHF成为主流\n\n3. **Constitutional AI（宪法AI）**\n   - Anthropic的方法：让模型根据一套原则"自我批评和改进"\n   - 减少对人类标注的依赖'},
  {keywords:['量化','quantization','GGUF','GPTQ','AWQ','精度'],question:'什么是模型量化',answer:'**模型量化（Quantization）** 是将模型参数从高精度（如FP16）转换为低精度（如INT8/INT4）的技术，大幅降低模型体积和推理资源需求。\n\n**常见量化方案**：\n1. **GGUF/GGML**（llama.cpp）— 最流行的本地部署格式\n   - q4_K_M：4bit量化，质量损失极低，最推荐的平衡点\n   - q8_0：8bit量化，几乎无损\n   - q2_K：2bit量化，极致压缩但质量下降明显\n2. **GPTQ** — GPU推理优化，性能好，适合批量推理\n3. **AWQ** — 激活感知量化，保护重要权重通道\n4. **bitsandbytes** — Hugging Face集成，支持QLoRA微调\n\n**量化的实际效果**（以70B模型为例）：\n- FP16：需要约140GB显存，A100×2\n- INT8：需要约70GB显存，A100×1\n- INT4：需要约35GB显存，RTX 4090可运行\n- Q4_K_M GGUF：CPU推理需约40GB RAM'},
  {keywords:['上下文','context','窗口','长文本'],question:'什么是上下文窗口',answer:'**上下文窗口（Context Window）** 是大模型在一次推理中能"看到"的最大token数量，包括输入(prompt)和输出(completion)。\n\n**当前主流模型的上下文窗口**：\n- 生成式预训练模型-5.5：100万tokens（约75万英文单词）\n- Gemini 3.5 Flash：100万tokens（即将200万）\n- Claude Sonnet/Opus 4：20万tokens\n- Kimi K2.7 Code：200万汉字\n- DeepSeek-V4 Pro/Flash：1M tokens（384K输出）\n- DeepSeek-R1：128K tokens\n- Llama 4：256K tokens\n\n**长上下文的实际意义**：\n- 128K tokens ≈ 能一次读完《三体》三部曲\n- 100万tokens ≈ 能一次处理完整的代码库或多本技术书籍\n- 200万汉字 ≈ 能一次加载整本长篇论文集合'},
  {keywords:['Token','token','分词','tokenizer'],question:'什么是Token',answer:'**Token（令牌/标记）** 是大模型处理文本的基本单位。模型不直接处理字符或单词，而是将文本切分为token序列。\n\n**Token与文字的换算**：\n- 英文：1 token ≈ 0.75个单词，或约4个字符\n- 中文：1个汉字 ≈ 1.5-2个token（取决于分词器）\n- 1000 tokens ≈ 750英文单词 ≈ 500-700个汉字\n\n**分词方式**：\n- **BPE（Byte Pair Encoding）**：GPT系列使用\n- **WordPiece**：BERT使用\n- **SentencePiece**：Llama/Mistral使用\n\n**为什么Token重要**：\n- API按token计费（输入+输出token数）\n- 上下文窗口大小以token衡量（如128K tokens）\n- 中文分词效率影响成本估算'},
  {keywords:['Prompt','提示词','提示工程','prompt engineering'],question:'什么是Prompt Engineering',answer:'**Prompt Engineering（提示工程）** 是设计和优化输入提示词，以引导大模型产生更高质量输出的技术。\n\n**核心技巧**：\n1. **零样本提示（Zero-shot）** — 直接提问，不给示例\n2. **少样本提示（Few-shot）** — 提供2-5个示例，让模型学习模式\n3. **思维链（Chain-of-Thought, CoT）** — 要求模型"一步步思考"，展示推理过程\n4. **ReAct模式** — 交替进行推理(Thought)和行动(Action)，适合工具调用场景\n5. **角色设定（Role Prompting）** — 给模型设定专业角色\n6. **结构化输出** — 要求以JSON/Markdown/表格等特定格式输出\n7. **自我一致性（Self-Consistency）** — 多次采样，投票选择最佳答案'},
  {keywords:['Agent','智能体','agent','自主'],question:'什么是AI Agent智能体',answer:'**AI Agent（智能体）** 是能够自主感知环境、制定计划、使用工具并执行复杂任务的AI系统。\n\n**Agent核心能力**：\n1. **感知（Perceive）** — 接收用户指令和外部环境信息\n2. **规划（Plan）** — 将复杂任务分解为可执行的步骤序列\n3. **推理（Reason）** — 运用ReAct等模式进行逻辑推理\n4. **行动（Act）** — 调用工具(Function Call)、执行代码、操控设备\n5. **记忆（Memory）** — 短期记忆(对话上下文)、长期记忆(向量库/知识库)\n\n**开发框架**：LangChain、LangGraph、CrewAI、AutoGPT、Dify、Coze\n\n**典型应用**：\n- AutoGLM：手机自主操控（点外卖、订票）\n- Devin：全自主编程+PR提交\n- Claude Computer Use：AI操控电脑桌面'},
  {keywords:['预训练','pretrain','SFT','训练流程','构建'],question:'大模型是怎么训练出来的',answer:'**大模型训练流程**分为四个主要阶段：\n\n**1. 数据准备**\n- 从互联网、书籍、论文、代码库等收集PB级原始数据\n- 数据清洗：去重、去噪、过滤低质量/有害内容\n- 数据混合：按比例混合不同来源和领域的数据\n- 分词器训练：构建词汇表（通常5万-25万tokens）\n\n**2. 预训练（Pre-training）**\n- 在海量数据上训练基础模型，使用自监督学习（预测下一个token）\n- 需要大规模GPU集群（千卡A100/H100级别），训练数周至数月\n- 计算成本：70B模型约需数百万美元\n- 输出：Base Model（基础模型），能续写文本但不会对话\n\n**3. 监督微调（SFT）**\n- 使用人工标注的高质量"指令-回答"对训练\n- 教模型遵循指令、进行对话、完成特定任务\n- 数据量通常在1万-100万条\n- 输出：Chat Model（对话模型）\n\n**4. 对齐训练（RLHF/DPO）**\n- 使模型输出符合人类偏好和价值观\n- 减少有害、偏见、不准确的内容\n- 提升有用性、诚实性和安全性'},
  {keywords:['对比','比较','区别','Claude','哪个好','vs','生成式预训练模型'],question:'生成式预训练模型-5.5和Claude有什么区别',answer:'**生成式预训练模型-5.5 vs Claude** 对比分析：\n\n| 维度 | 生成式预训练模型-5.5 | Claude Opus 4.8 | Claude Sonnet 4.6 |\n|------|--------|--------------|----------------|\n| 公司 | OpenAI | Anthropic | Anthropic |\n| 上下文 | 128K | 200K | 200K |\n| 多模态 | 支持(输入+输出) | 支持(输入) | 支持(输入) |\n| 推理能力 | 很强 | 顶级 | 强 |\n| 代码能力 | 优秀 | 优秀 | 优秀 |\n| 安全对齐 | 好 | 最好 | 最好 |\n| 价格 | ￥18/￥72 | ￥108/￥540 | ￥22/￥108 |\n| 特色 | 实时语音、GPTs商店 | Computer Use、Artifacts | 性价比高 |\n\n**选择建议**：\n- 复杂推理/研究分析 → Claude Opus 4.8\n- 日常编程/内容创作 → Claude Sonnet 4.6（性价比更高）\n- 多模态应用 → 生成式预训练模型-5.5\n- 预算敏感 → DeepSeek-V4 Flash（性能接近，价格1/20）'},
  {keywords:['DeepSeek','深度求索','R1','V3'],question:'DeepSeek-V4和R1有什么区别',answer:'**DeepSeek-V4 Pro vs DeepSeek-R1**：\n\n**DeepSeek-V4 Pro**（通用旗舰模型）：\n- 1.6T总参/49B活跃，MoE架构，MIT开源\n- 1M上下文窗口，FP4/FP8混合精度\n- 擅长：代码开发（SWE-bench 80.6%）、学术研究、企业应用、Agent开发\n- 定价：输入￥12/输出￥24（每百万tokens）\n- 华为昇腾950原生适配\n\n**DeepSeek-R1**（推理增强版）：\n- 基于V3的推理增强版本\n- 核心特色：思维链透明（可看到完整推理过程）\n- 擅长：数学证明、编程竞赛、复杂逻辑推理、科学研究\n- 定价：输入￥4.00/输出￥16.00（每百万tokens）\n\n**选型建议**：\n- 旗舰性能/复杂推理 → V4 Pro（综合最强，编程SOTA）\n- 数学证明/需要推理过程可视化 → R1（思维链透明）\n- 日常任务/成本敏感 → V4 Flash（价格仅为Pro的1/10）'},
  {keywords:['API','调用','接口','对接','接入'],question:'如何调用大模型API',answer:'**调用大模型API的一般步骤**：\n\n**1. 选择平台并注册**\n- 国内：DeepSeek Platform、阿里云百炼(DashScope)、智谱BigModel、百度千帆、月之暗面Moonshot\n- 国际：OpenAI Platform、Anthropic Console、Google AI Studio、Mistral Cloud\n\n**2. 获取API Key**\n- 在平台控制台创建API Key\n- 注意保管：不要将Key提交到公开的代码仓库\n\n**3. 发送请求（OpenAI兼容格式）**\n多数国内平台兼容OpenAI API格式，只需修改base_url和model：\n```python\nfrom openai import OpenAI\nclient = OpenAI(api_key="your-key", base_url="https://api.deepseek.com")\nresponse = client.chat.completions.create(\n    model="deepseek-chat",\n    messages=[{"role":"user","content":"你好"}]\n)\n```'},
  {keywords:['Kimi','月之暗面','moonshot'],question:'Kimi Chat有什么特点',answer:'**Kimi K2.7 Code** 是由月之暗面（Moonshot AI）开发的AI助手，以超长上下文处理能力著称。\n\n**核心优势**：\n1. **200万字超长上下文** — 业界最长，可一次加载整本《三体》三部曲\n2. **文件分析** — 支持PDF/Word/PPT/Excel/TXT等多种格式上传分析\n3. **联网搜索** — 支持实时联网获取最新信息\n4. **Kimi+插件** — 浏览器插件、学术助手等扩展功能\n5. **阅读辅助** — 支持长文档的跨章节分析和问题解答\n\n**适用场景**：学术研究、法律合同审查、财报分析、代码库理解\n**获取方式**：Web(kimi.moonshot.cn) / iOS / Android / 浏览器插件'},
  {keywords:['部署','本地','Ollama','vLLM','GPU','显存'],question:'如何本地部署大模型',answer:'**本地部署大模型的几种方式**：\n\n**1. Ollama（最简单，推荐入门）**\n```\nollama run deepseek-r1:7b\nollama run qwen2.5:14b\nollama run llama3.1:8b\n```\n优点：安装简单、自动下载、API兼容、支持GGUF量化\n硬件需求：7B模型约需6GB RAM，70B量化约需40GB RAM\n\n**2. vLLM（高性能生产推理）**\n- 高吞吐、低延迟，支持PagedAttention\n- 适合构建API服务\n- 需要GPU（A100/H100推荐）\n\n**3. llama.cpp（CPU友好）**\n- 纯C++实现，支持CPU推理和GPU加速\n- GGUF格式量化模型\n- 无需GPU即可运行7B/13B模型\n\n**消费级GPU部署能力参考**：\n- RTX 3060 12GB：7B FP16 / 14B Q4量化\n- RTX 4090 24GB：14B FP16 / 34B Q4量化\n- MacBook M2 16GB：7B Q4量化模型'},
  {keywords:['应用','场景','用途','落地','案例'],question:'大模型有哪些实际应用场景',answer:'**大模型的主要应用场景**：\n\n**内容创作**：文案写作、翻译校对、创意策划\n\n**企业服务**：\n- 智能客服：7×24小时自动客服，多轮对话\n- 知识管理：企业知识库问答、文档智能检索\n- 数据分析：自然语言查询、报告自动生成\n- 会议纪要：语音转文字+自动总结\n\n**软件开发**：\n- 代码生成与补全\n- Bug检测与修复\n- 代码审查与重构\n- 技术文档自动生成\n\n**教育科研**：\n- 个性化辅导：自适应学习、作文批改\n- 论文写作辅助：文献综述、实验设计\n- 知识问答：24小时AI教师\n\n**医疗健康**：辅助诊断、健康咨询、医学知识问答\n\n**金融法律**：合同审查、合规检查、投资研究'},
  {keywords:['费用','价格','成本','多少钱','收费','token价格'],question:'使用大模型需要多少钱',answer:'**各大模型API定价参考**（每百万tokens，人民币估算）：\n\n**国内模型**：\n- DeepSeek-V4 Flash：输入￥1 / 输出￥2（性价比最高）\n- DeepSeek-V4 Pro：输入￥12 / 输出￥24\n- DeepSeek-R1：输入￥4 / 输出￥16\n- Qwen3.7-Max：按量计费，开源版免费\n- 文心大模型 5.1：按量计费，有免费额度\n- GLM-5.2：竞争性定价，有免费额度\n- Kimi K2.7 Code：有免费额度，付费按token\n- 豆包 2.1 Pro：App免费，API按量\n\n**国际模型**：\n- 生成式预训练模型-5.5：Pro ￥1440/月无限\n- Claude Opus 4.8：输入￥108 / 输出￥540\n- Claude Sonnet 4.6：输入￥22 / 输出￥108\n- Gemini 3.5 Flash：有免费层，按量计费\n\n**成本节省技巧**：\n- 优先使用国内模型（价格为国际的1/5~1/20）\n- 简单任务用便宜模型，复杂任务用贵的\n- 利用Prompt压缩减少输入token\n- 开源模型自部署（仅需承担算力成本）'},
  {keywords:['学习','入门','怎么学','路线','资料','教程'],question:'如何系统学习大模型',answer:'**大模型学习路径**：\n\n**入门阶段（1-2个月）**：\n1. 学习Python基础（numpy, pytorch基本使用）\n2. 了解机器学习基础概念（监督/无监督/强化学习）\n3. 学习Prompt Engineering（OpenAI指南、Anthropic Prompt Library）\n4. 熟练使用主流AI产品（生成式预训练转换器/Claude/DeepSeek/Kimi）\n推荐资源：吴恩达《AI For Everyone》、fast.ai课程\n\n**进阶阶段（2-4个月）**：\n1. 深度学习基础（CNN/RNN/Transformer）\n2. NLP核心技术（分词/嵌入/BERT/GPT原理）\n3. Hugging Face生态（Transformers/PEFT/Datasets）\n4. RAG技术栈（LangChain/LlamaIndex/Milvus）\n推荐资源：吴恩达深度学习课程、HuggingFace NLP Course\n\n**高级阶段（4-6个月）**：\n1. 模型微调实操（LoRA/QLoRA/全量微调）\n2. 模型部署（Ollama/vLLM/TGI/Triton）\n3. Agent开发（工具调用/多Agent/记忆管理）\n4. 模型评估与安全（Benchmark/红队测试/幻觉治理）\n推荐：动手微调一个开源模型（LLaMA-Factory）+ 部署上线'},
  {keywords:['多模态','视觉','图像','视频','语音','多模态模型'],question:'什么是多模态大模型',answer:'**多模态大模型** 是能够同时理解和生成多种数据类型（文本、图像、音频、视频）的AI模型。\n\n**主流架构方案**：\n1. **视觉编码器 + LLM桥接** — 最主流方案\n   - 用CLIP/SigLIP等视觉编码器将图像转为特征向量\n   - 通过投影层(Q-Former/MLP)将视觉特征映射到LLM的输入空间\n   - 代表：LLaVA、Qwen-VL、CogVLM、生成式预训练模型-5.5\n2. **原生多模态** — 从预训练阶段就融合多模态数据\n   - 代表：Gemini系列（Google宣称）\n3. **扩散模型** — 图像/视频生成\n   - 代表：Stable Diffusion、DALL·E、Midjourney、Sora\n\n**代表模型**：\n- **国内**：通义千问(多模态版)、智谱CogVLM、讯飞星火(语音)、可灵(视频)、即梦(视频)\n- **国际**：生成式预训练模型-5.5、Gemini 3.5 Flash、Claude(图像理解)'},
  {keywords:['生成式预训练模型-5','最新','前沿','趋势','发展','未来'],question:'大模型最新发展趋势',answer:'**大模型领域最新趋势（2025-2026）**：\n\n1. **推理增强** — 模型学会"慢思考"\n   - DeepSeek-R1带火了思维链推理\n   - 从"快回答"到"深思熟虑后回答"\n   - 生成式预训练模型-5.5和Claude 4都加强了推理能力\n\n2. **Agent化** — 从对话到行动\n   - Computer Use（AI操控电脑）\n   - 手机Agent（AutoGLM）\n   - MCP协议（Model Context Protocol）标准化工具调用\n\n3. **超长上下文** — 从128K到100万+\n   - 生成式预训练模型-5.5支持100万tokens\n   - Gemini 3.5 Flash支持100万+\n   - "一本书级别的上下文"成为标配\n\n4. **开源追赶闭源** — 差距缩小\n   - DeepSeek-V4性能对标顶级闭源模型\n   - Llama 4持续开源\n   - 开源生态前所未有的繁荣\n\n5. **多模态深度融合** — 图文音视频一体化\n6. **成本极速下降** — AI民主化\n7. **AI原生IDE** — 编程范式变革'},
  {keywords:['Sora','视频生成','可灵','即梦'],question:'AI视频生成有哪些产品',answer:'**主流AI视频生成产品**：\n\n**国内**：\n1. **可灵（Kling）** — 快手出品，支持文生视频、图生视频，1080P高清输出\n2. **即梦（Jimeng）** — 字节跳动出品，文生视频、图生视频，智能运镜\n\n**国际**：\n3. **Sora** — OpenAI出品，业界最高真实感和物理模拟，目前仅向Plus/Pro订阅用户开放\n\n**其他值得关注**：\n- Runway Gen-3：专业视频编辑\n- Pika：轻量易用\n- 腾讯混元：文生视频\n\n**注意**：视频生成目前仍处于快速迭代阶段，生成质量和可控性在持续提升中'},
  {keywords:['Temperature','temperature','温度','随机性','创造性'],question:'Temperature参数有什么作用',answer:'**Temperature（温度）** 是控制大模型输出随机性和创造性的参数。\n\n**取值范围与效果**：\n- **0 ~ 0.3**：输出非常确定和保守，适合数学、代码、事实问答\n- **0.5 ~ 0.7**：平衡创造性和准确性，适合日常对话和写作\n- **0.8 ~ 1.0**：输出更随机多样，适合创意写作和头脑风暴\n- **1.0+**：高度随机，可能产生不连贯或荒谬的内容\n\n**技术原理**：\n- 模型输出的是每个token的概率分布\n- Temperature在softmax之前除以这个值\n- 低Temperature使高概率token更突出（"贪婪"）\n- 高Temperature使分布更平坦（"冒险"）'},
  {keywords:'Grok Grok4.5 xAI',question:'Grok 4.5 有什么特点？',answer:'Grok 4.5是xAI发布的最新旗舰模型，1.5T参数MoE架构。**编程能力登顶**：SWE-bench Pro 64.7%、Terminal-bench 2.1 83.3%。**性价比极高**：输入￥14输出￥43/1M tokens。**实时信息**：X平台深度集成，获取最新资讯。**架构优势**：基于V9底座，数万块GB300 GPU训练。'},
  {keywords:'Claude Fable 5 Fable5',question:'Claude Fable 5 是什么？',answer:'Claude Fable 5是Anthropic于2026年6月发布的旗舰编程模型，与Mythos 5同架构。**SWE-bench Verified 95%**，编程能力登顶。**发布即被禁**：6月9日发布，6月12日被美国出口管制强制下架，史上首次商用AI被政府封禁。**7月1日解禁**：限时限额回归，引发争议。定价：输入￥72输出￥360/1M tokens。'},
  {keywords:'可灵 Kling 融资',question:'可灵AI最近有什么动态？',answer:'可灵是快手旗下的AI视频生成平台，最新版本可灵3.0支持1080P高清画质。**融资创纪录**：2026年7月完成近30亿美元首轮融资，创AI视频赛道融资纪录。**技术领先**：画质和时长达到行业领先水平。**生态布局**：通过快手开放平台提供API接入。'},
  {keywords:'LongCat 美团 长猫',question:'美团LongCat模型有什么特点？',answer:'LongCat-2.0是美团发布的大模型，1.6T参数MoE架构。**全国产算力**：基于华为昇腾910C集群训练，零英伟达含量。**Agent能力**：Claude Code场景全球调用量第二，接近Opus 4.6。**1M上下文**：原生支持百万token长文本处理。**即将开源**：Infra框架、推理引擎、模型参数将陆续开源。'},
  {keywords:'豆包2.1 豆包 Pro',question:'豆包2.1 Pro 有什么提升？',answer:'豆包2.1 Pro是字节跳动于2026年6月发布的最新大模型。**质变点突破**：官方称能力已跨越"质变点"，全面对标国际一线模型。**多模态交互**：支持文本、图像、语音等多种交互方式。**生态集成**：深度集成抖音、飞书等字节生态。**高性价比**：App免费使用，API按量计费。'},
  {keywords:'Qwen3.7-Plus Qwen Plus',question:'Qwen3.7-Plus 有什么新功能？',answer:'Qwen3.7-Plus是阿里云发布的多模态Agent基座模型。**Vision Arena国产第一**：视觉理解能力领先。**全链路开发**：11小时自主完成10000+行代码完整应用。**GUI操控**：理解移动端/桌面端界面，支持控件定位和多步操作。**跨框架泛化**：在Claude Code/OpenClaw/Qwen Code等框架稳定运行。定价：￥2.5/￥7.5/1M tokens。'}

// ===== QA FUZZY MATCHING =====
function findBestMatch(userQuery){
  var q=userQuery.toLowerCase(),bestScore=0,bestEntry=null;
  for(var i=0;i<qaDatabase.length;i++){
    var e=qaDatabase[i],score=0;
    for(var j=0;j<e.keywords.length;j++){
      if(q.indexOf(e.keywords[j].toLowerCase())>=0) score+=(j===0?3:2);
    }
    var qtokens=q.match(/[一-龥]+|[a-z0-9]+/g)||[];
    for(var k=0;k<qtokens.length;k++){
      if(qtokens[k].length>=2&&e.question.toLowerCase().indexOf(qtokens[k].toLowerCase())>=0) score+=1;
    }
    if(score>bestScore){bestScore=score;bestEntry=e;}
  }
  return bestScore>=2?bestEntry:null;
}

function getLocalReply(query){
  var result=null;
  var match=findBestMatch(query);
  if(match){result=match.answer;}
  if(!result){
    var q=query.toLowerCase(),matched=null;
    for(var i=0;i<models.length;i++){
      var m=models[i];
      if(m.name.toLowerCase().indexOf(q)>=0||m.company.toLowerCase().indexOf(q)>=0){matched=m;break;}
      if(m.features)for(var j=0;j<m.features.length;j++){if(m.features[j].toLowerCase().indexOf(q)>=0){matched=m;break;}}
      if(matched)break;
    }
    if(matched){
      var m=matched;

    }
  }
  if(!result){
    var qa=query.toLowerCase(),matchedA=null;
    for(var i=0;i<agents.length;i++){
      var a=agents[i];
      if(a.name.toLowerCase().indexOf(qa)>=0){matchedA=a;break;}

    }

      result='找到了相关智能体 **'+a.name+'**（'+a.company+'）：\n\n功能：'+(a.features?a.features.join('、'):'')+'\n平台：'+(a.platforms||'')+'\n访问：'+(a.links&&a.links.web?a.links.web:'');
    }
  }
  if(!result){
    var qk=query.toLowerCase(),matchedK=null;
    for(var i=0;i<knowledgeCategories.length;i++){
      var k=knowledgeCategories[i];
      if(k.title.toLowerCase().indexOf(qk)>=0){matchedK=k;break;}
      if(k.topics)for(var j=0;j<k.topics.length;j++){if(k.topics[j].toLowerCase().indexOf(qk)>=0){matchedK=k;break;}}
      if(matchedK)break;
    }
    if(matchedK) result='在知识分类中找到了 **'+matchedK.title+'**：\n\n'+matchedK.detail;
  }
  return result;
}

// ===== MARKDOWN TO HTML =====
function markdownToHtml(text){
  if(!text)return'';
  var t=text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  t=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  t=t.replace(/\`([^\`]+)\`/g,'<code style="background:rgba(22,195,201,0.12);padding:1px 5px;border-radius:3px;font-size:0.9em">$1</code>');
  t=t.replace(/^### (.+)$/gm,'<strong>$1</strong>');
  t=t.replace(/^## (.+)$/gm,'<strong style="font-size:1.05em">$1</strong>');
  t=t.replace(/^# (.+)$/gm,'<strong style="font-size:1.1em">$1</strong>');
  t=t.replace(/^[\-\*] (.+)$/gm,'• $1');
  t=t.replace(/\n{2,}/g,'<br/><br/>');
  t=t.replace(/\n/g,'<br/>');
  return t;
}

  var f=getFavorites();

function getDateSeed(ds){var h=0;for(var i=0;i<ds.length;i++){h=((h<<5)-h)+ds.charCodeAt(i);h=h&h;}return Math.abs(h);}
function pickNewsBySeed(seed,count){var pool=newsPool.slice(),sel=[],used={},cs=seed;while(sel.length<count&&sel.length<pool.length){cs=(cs*1103515245+12345)&0x7fffffff;var idx=cs%pool.length;if(!used[idx]){used[idx]=true;sel.push(pool[idx]);}}return sel;}
function getTodayStr(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function getDateStrBefore(days){var d=new Date();d.setDate(d.getDate()-days);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function getNewsForDate(dateStr){var key=NEWS_PREFIX+dateStr;var c=lsGet(key,null);if(c&&c.length)return c;var seed=getDateSeed(dateStr);var n=pickNewsBySeed(seed,3);lsSet(key,n);return n;}
function getTodayNews(){return getNewsForDate(getTodayStr());}
function cleanOldNews(){var cutoff=getDateStrBefore(NEWS_MAX_DAYS);for(var i=0;i<NEWS_MAX_DAYS+3;i++){var ds=getDateStrBefore(i);if(ds<cutoff){try{localStorage.removeItem(NEWS_PREFIX+ds);}catch(e){}}}}
function buildDayCard(dateStr,daysAgo){var newsList=getNewsForDate(dateStr);var d=new Date();d.setDate(d.getDate()-daysAgo);var dayLabels=['今天','昨天','前天'];var weekDays=['周日','周一','周二','周三','周四','周五','周六'];var dayLabel=daysAgo<3?dayLabels[daysAgo]:weekDays[d.getDay()];var dateLabel=(d.getMonth()+1)+'月'+d.getDate()+'日';return{dateStr:dateStr,dayLabel:dayLabel,dateLabel:dateLabel,newsCount:newsList.length,topTitle:newsList.length>0?newsList[0].title:'暂无新闻',topTag:newsList.length>0?newsList[0].tag:'',newsList:newsList};}
function buildWeekCards(){var cards=[];for(var i=0;i<NEWS_MAX_DAYS;i++){cards.push(buildDayCard(getDateStrBefore(i),i));}return cards;}

var generalState={
  bannerIdx:0, knowledgeLevel:'all',
  showCompare:false, compareSelected:[], compareList:[],
  showRankings:false, benchIdx:0, rankList:[],
  showCalc:false, calcInput:'100', calcOutput:'50', calcResults:[],

};

function renderGeneral(){
  var state=generalState;
  var html='';
  // ===== 每日要闻（横幅轮播） =====
  cleanOldNews();
  state.dayCards=buildWeekCards();
  html+='<div class="news-section"><div class="section-title"><span class="title-text">📰 每日要闻</span><span class="more">每日 7:00 更新 · 共 '+state.dayCards.length+' 天</span></div>';
  html+='<div class="hero-banner">';
  for(var i=0;i<state.dayCards.length;i++){
    var c=state.dayCards[i];
    html+='<div class="hero-slide day-card-slide'+(i===0?' active':'')+'" onclick="generalDayCardTap('+i+')">';
    html+='<div class="day-card-header"><span class="day-card-label">'+c.dayLabel+'</span><span class="day-card-date">'+c.dateLabel+'</span></div>';
    if(c.topTitle)html+='<div class="day-card-headline"><div class="day-card-headline-text">'+c.topTitle+'</div></div>';
    html+='<div class="day-card-stats"><span>📋 '+c.newsCount+' 条 AI 新闻</span></div>';
    html+='<div class="day-card-hint">点击查看详情 →</div>';
    html+='</div>';
  }
  html+='</div></div>';
  // Stats
  html+='<div class="stats-row"><div class="stat-card" onclick="scrollToKnowledge()"><div class="stat-num">'+knowledgeCategories.length+'</div><div class="stat-label">知识分类</div></div><div class="stat-card" onclick="switchTab(\'models\')"><div class="stat-num">'+models.length+'</div><div class="stat-label">收录模型</div></div><div class="stat-card" onclick="switchTab(\'agents\')"><div class="stat-num">'+agents.length+'</div><div class="stat-label">智能体应用</div></div></div>';
  // Knowledge grid
  html+='<div class="section-title" id="knowledge-section"><span class="title-text">📚 知识分类</span><span class="more" onclick="switchTab(\'models\')">查看更多 →</span></div>';
  html+='<div class="filter-row"><span class="filter-chip'+(state.knowledgeLevel==='all'?' active':'')+'" onclick="generalFilterKnowledge(\'all\')">全部</span><span class="filter-chip'+(state.knowledgeLevel==='beginner'?' active':'')+'" onclick="generalFilterKnowledge(\'beginner\')">🟢 入门</span><span class="filter-chip'+(state.knowledgeLevel==='intermediate'?' active':'')+'" onclick="generalFilterKnowledge(\'intermediate\')">🟠 进阶</span><span class="filter-chip'+(state.knowledgeLevel==='advanced'?' active':'')+'" onclick="generalFilterKnowledge(\'advanced\')">🔴 高级</span></div>';
  html+='<div class="knowledge-grid">';
  var filteredK=state.knowledgeLevel==='all'?knowledgeCategories:knowledgeCategories.filter(function(k){return k.level===state.knowledgeLevel;});
  for(var i=0;i<filteredK.length;i++){
    var k=filteredK[i];
    html+='<div class="knowledge-card" onclick="generalKnowledgeTap(\''+k.title.replace(/'/g,"\\'")+'\')"><div class="kc-icon">'+k.icon+'</div><div class="kc-title">'+k.title+'</div><div class="kc-desc">'+k.desc+'</div><span class="kc-level '+k.level+'">'+(k.level==='beginner'?'入门':k.level==='intermediate'?'进阶':'高级')+'</span></div>';
  }
  html+='</div>';
  // Learning paths
  html+='<div class="section-title"><span class="title-text">🗺️ 学习路径</span></div><div class="path-grid">';
  for(var i=0;i<learningPaths.length;i++){var p=learningPaths[i];html+='<div class="path-card" onclick="generalPathTap(\''+p.id+'\')"><div class="kc-icon">'+p.icon+'</div><div class="path-name">'+p.name+'</div><div class="path-desc">'+p.desc+'</div><div class="path-step">'+p.steps.length+' 个阶段 →</div></div>';}
  html+='</div>';

  document.getElementById('panel-general').innerHTML=html;
  // Start banner carousel with touch swipe
  if(state.bannerTimer)clearInterval(state.bannerTimer);
  var totalSlides=state.dayCards.length;
  function advanceSlide(){
    state.bannerIdx=(state.bannerIdx+1)%totalSlides;
    var slides=document.querySelectorAll('#panel-general .hero-slide');
    if(slides.length){slides.forEach(function(s,i){s.classList.toggle('active',i===state.bannerIdx);});}
  }
  state.bannerTimer=setInterval(advanceSlide,4000);
  // Touch swipe support
  var banner=document.querySelector('#panel-general .hero-banner');
  if(banner){
    state.touchStartX=0;
    banner.addEventListener('touchstart',function(e){state.touchStartX=e.touches[0].clientX;});
    banner.addEventListener('touchend',function(e){
      var dx=e.changedTouches[0].clientX-state.touchStartX;
      if(Math.abs(dx)>50){
        if(state.bannerTimer)clearInterval(state.bannerTimer);
        state.bannerIdx=dx>0?(state.bannerIdx-1+totalSlides)%totalSlides:(state.bannerIdx+1)%totalSlides;
        var slides=document.querySelectorAll('#panel-general .hero-slide');
        if(slides.length){slides.forEach(function(s,i){s.classList.toggle('active',i===state.bannerIdx);});}
        state.bannerTimer=setInterval(advanceSlide,4000);
      }
    });
  }
}

function generalDayCardTap(idx){

  var html='<div class="modal-mask" onclick="closeModal()"><div class="modal-sheet daily-news-sheet" onclick="event.stopPropagation()"><div class="modal-handle"></div>';
  html+='<div class="daily-news-header"><span class="daily-news-day">'+card.dayLabel+'</span><span class="daily-news-date">'+card.dateLabel+'</span></div>';
  html+='<div class="daily-news-list">';
  for(var i=0;i<card.newsList.length;i++){
    var n=card.newsList[i];
    html+='<div class="daily-news-item"><span class="dni-tag">'+n.tag+'</span><div class="dni-title">'+n.title+'</div><div class="dni-detail">'+(n.detail||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/。/g,'。<br/><br/>')+'</div><div class="dni-footer"><span class="dni-source">'+(n.source||'')+'</span><span class="dni-copy-link" onclick="event.stopPropagation();copyText(\''+(n.url||'').replace(/'/g,"\\'")+'\')">📋 复制链接</span></div></div>';
  }
  html+='</div><button class="modal-close-btn" onclick="closeModal()">关闭</button></div></div>';
  document.getElementById('modalContainer').innerHTML=html;
}

function generalFilterKnowledge(level){generalState.knowledgeLevel=level;renderGeneral();}
function generalToggleCompare(){generalState.showCompare=!generalState.showCompare;renderGeneral();}
function generalToggleCmpModel(id){var sel=generalState.compareSelected;var idx=sel.indexOf(id);if(idx>=0)sel.splice(idx,1);else if(sel.length<4)sel.push(id);generalState.compareSelected=sel;generalState.compareList=sel.map(function(id){var m=models.find(function(x){return x.id===id;});if(!m)return null;return{id:m.id,name:m.name,company:m.company,country:m.country,category:m.category,params:m.params,contextWindow:m.contextWindow,pricing:m.pricing,rating:m.rating,hasDeploy:!!m.deployInfo};}).filter(Boolean);renderGeneral();}
function generalToggleRankings(){generalState.showRankings=!generalState.showRankings;if(generalState.showRankings)generalBuildRank(generalState.benchIdx);renderGeneral();}
function generalSwitchBench(idx){generalState.benchIdx=idx;generalBuildRank(idx);renderGeneral();}
function generalBuildRank(idx){var key=benchmarks[idx].id;generalState.rankList=models.filter(function(m){return benchmarkScores[m.id]&&benchmarkScores[m.id][key]!=null;}).map(function(m){return{id:m.id,name:m.name,company:m.company,_score:benchmarkScores[m.id][key]};}).sort(function(a,b){return b._score-a._score;}).slice(0,10);}
function generalToggleCalc(){generalState.showCalc=!generalState.showCalc;renderGeneral();}
function generalCalcUpdate(){
  var inputEl=document.getElementById('generalCalcInput'),outputEl=document.getElementById('generalCalcOutput');
  if(!inputEl||!outputEl)return;
  generalState.calcInput=inputEl.value;generalState.calcOutput=outputEl.value;
  var inputM=parseFloat(generalState.calcInput)/100||0,outputM=parseFloat(generalState.calcOutput)/100||0;
  var list=models.filter(function(m){return modelPrice.hasOwnProperty(m.id);}).map(function(m){return{id:m.id,name:m.name,input:modelPrice[m.id].input,output:modelPrice[m.id].output};});
  var results=[],maxCost=1;
  for(var i=0;i<list.length;i++){var m=list[i];var cost=inputM*m.input+outputM*m.output;results.push({id:m.id,name:m.name,cost:(m.input===0&&m.output===0)?'免费开源':'￥'+cost.toFixed(2)+'/月',_cost:cost});if(cost>maxCost)maxCost=cost;}
  results.sort(function(a,b){return a._cost-b._cost;});
  var resEl=document.getElementById('generalCalcResults');
  if(resEl){var h='';for(var i=0;i<results.length;i++){var r=results[i];h+='<div class="calc-item" onclick="showDetail(\'model\','+r.id+')"><span class="calc-name">'+r.name+'</span><span class="calc-cost" style="color:'+(r._cost===0?'var(--accent)':'')+'">'+r.cost+'</span></div>';}resEl.innerHTML=h;}
}

function generalKnowledgeTap(title){

  addHistory('knowledge',knowledgeCategories.indexOf(cat),cat.title,'知识分类');
  var intl=[],domestic=[];
  for(var i=0;i<cat.platforms.length;i++){var p=cat.platforms[i];if(p.type==='official'||p.type==='community'||p.type==='course')intl.push(p);else domestic.push(p);}

  html+='<div style="display:flex;gap:8px">';
  if(step>0)html+='<button onclick="pathPrevStep()" style="flex:1;padding:10px;border-radius:12px;border:1px solid var(--border);background:var(--bg-card);cursor:pointer;font-size:13px">← 上一步</button>';
  html+='<button onclick="pathNextStep()" style="flex:1;padding:10px;border-radius:12px;background:var(--gradient);color:#fff;border:none;cursor:pointer;font-size:13px">'+(step+1<path.steps.length?'下一步 →':'完成 ✓')+'</button>';
  html+='</div></div></div>';
  modal.innerHTML=html;
}
function jumpToStep(idx){generalState.pathStep=idx;renderPathModal();clearTimeout(window._pathTimer);window._pathTimer=setTimeout(function(){pathNextStep();},3000);}
function pathPrevStep(){if(generalState.pathStep>0){generalState.pathStep--;renderPathModal();clearTimeout(window._pathTimer);window._pathTimer=setTimeout(function(){pathNextStep();},3000);}}
function pathNextStep(){
  var path=generalState.pathModal;if(!path)return;
  clearTimeout(window._pathTimer);
  if(generalState.pathStep+1<path.steps.length){
    generalState.pathStep++;renderPathModal();
    window._pathTimer=setTimeout(function(){pathNextStep();},3000);
  }else{
    generalState.pathModal=null;generalState.pathStep=0;closeModal();
  }
}
function closePathModal(){clearTimeout(window._pathTimer);generalState.pathModal=null;generalState.pathStep=0;closeModal();}

function mineViewerRender(){
  var content=mineState.viewerContent||'';
  var mode=mineState.viewerMode;
  if(mode==='text'){
    return '<pre style="white-space:pre-wrap;word-break:break-all;font-size:12px;line-height:1.8;font-family:Consolas,Monaco,monospace;padding:8px;background:#fafafa;border-radius:8px;max-height:400px;overflow-y:auto">'+content.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</pre>';
  }
  if(mode==='json'){
    try{var obj=JSON.parse(content);content=JSON.stringify(obj,null,2);}catch(e){}
    var lines=content.split('\n');
    var html='<div class="json-viewer"><table>';
    for(var i=0;i<lines.length;i++){
      var line=lines[i].replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      line=line.replace(/(\s*)"([^"]+)":/g,'$1<span class="jv-key">"$2"</span>:');
      line=line.replace(/: "([^"]*)"/g,': <span class="jv-str">"$1"</span>');
      line=line.replace(/: (\d+\.?\d*)/g,': <span class="jv-num">$1</span>');
      line=line.replace(/: (true|false|null)/g,': <span class="jv-bool">$1</span>');
      html+='<tr><td class="jv-ln">'+(i+1)+'</td><td class="jv-code">'+line+'</td></tr>';
    }
    html+='</table></div>';
    return html;
  }
  if(mode==='markdown'){
    var html=content.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    html=html.replace(/^#### (.+)$/gm,'<h4 style="font-size:14px;margin:12px 0 4px">$1</h4>');
    html=html.replace(/^### (.+)$/gm,'<h3 style="font-size:16px;margin:14px 0 6px">$1</h3>');
    html=html.replace(/^## (.+)$/gm,'<h2 style="font-size:18px;margin:16px 0 8px;border-bottom:1px solid var(--border);padding-bottom:4px">$1</h2>');
    html=html.replace(/^# (.+)$/gm,'<h1 style="font-size:20px;margin:18px 0 10px">$1</h1>');
    html=html.replace(/^> (.+)$/gm,'<blockquote style="border-left:3px solid var(--accent);padding:4px 12px;margin:8px 0;color:var(--text-secondary);font-size:13px">$1</blockquote>');
    html=html.replace(/^\- (.+)$/gm,'<li style="margin-left:20px;font-size:13px">$1</li>');
    html=html.replace(/^(\d+)\. (.+)$/gm,'<li style="margin-left:20px;font-size:13px;list-style-type:decimal">$2</li>');
    html=html.replace(/^---$/gm,'<hr style="border:none;border-top:1px solid var(--border);margin:12px 0">');
    html=html.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    html=html.replace(/\*(.+?)\*/g,'<em>$1</em>');
    html=html.replace(/`([^`]+)`/g,'<code style="background:rgba(22,195,201,0.1);padding:1px 4px;border-radius:3px;font-family:monospace;font-size:12px">$1</code>');
    html=html.replace(/\n\n/g,'<br/><br/>');
    html=html.replace(/\n/g,'<br/>');
    return '<div style="font-size:13px;line-height:1.8;padding:8px;max-height:400px;overflow-y:auto">'+html+'</div>';
  }
  if(mode==='html'){
    var safe=content.replace(/<script[\s\S]*?<\/script>/gi,'').replace(/<iframe[\s\S]*?<\/iframe>/gi,'').replace(/on\w+="[^"]*"/gi,'').replace(/on\w+='[^']*'/gi,'');
    return '<div style="max-height:400px;overflow-y:auto;padding:8px;border:1px solid var(--border);border-radius:8px">'+safe+'</div>';
  }
  return '';
}

function computeSelector(){
  var scene=mineState.selectorScene,budget=mineState.selectorBudget,deploy=mineState.selectorDeploy;
  var sceneLabels={code:'编程开发',write:'写作创作',research:'学术研究',agent:'Agent自动化',daily:'日常对话',design:'设计多媒体'};
  var candidates=models.slice();
  if(scene==='code')candidates=candidates.filter(function(m){return m.category==='llm'||m.category==='code';});
  else if(scene==='write')candidates=candidates.filter(function(m){return m.category==='llm'&&m.country==='china';});
  else if(scene==='research')candidates=candidates.filter(function(m){return m.rating>=4.6;});
  else if(scene==='agent')candidates=candidates.filter(function(m){return m.rating>=4.5&&(m.category==='llm'||m.category==='code');});
  else if(scene==='design')candidates=candidates.filter(function(m){return m.category==='multimodal'||m.category==='image'||m.category==='video';});
  if(budget==='free')candidates=candidates.filter(function(m){return m.pricing&&(m.pricing.indexOf('免费')>=0||m.pricing.indexOf('开源免费')>=0);});
  else if(budget==='low')candidates=candidates.filter(function(m){return m.rating>=4.2;});
  else if(budget==='mid')candidates=candidates.filter(function(m){return m.rating>=4.4;});
  if(deploy==='local')candidates=candidates.filter(function(m){return m.hasDeploy||(m.pricing&&m.pricing.indexOf('开源')>=0);});
  else if(deploy==='api')candidates=candidates.filter(function(m){return m.links&&(m.links.api||m.links.web);});
  candidates.sort(function(a,b){return(b.rating||0)-(a.rating||0);});
  var results=candidates.slice(0,5);
  return results.map(function(m){
    var reason='';
    if(m.rating>=4.8)reason='综合评分最高，行业公认旗舰模型';
    else if(m.pricing&&m.pricing.indexOf('免费')>=0)reason='完全免费使用，零成本入门';
    else if(m.country==='china')reason='国内模型，中文优化，访问稳定';
    else if(m.pricing&&m.pricing.indexOf('￥0.')===0)reason='极低成本，性价比之选';
    else reason='综合能力均衡，适合'+(sceneLabels[scene]||'')+'场景';
    return{id:m.id,name:m.name,company:m.company,rating:m.rating,reason:reason};
  });
}

  return {deepseek:'DeepSeek',qwen:'Qwen',kimi:'Kimi',glm:'GLM',gpt:'GPT',llama:'Llama 4',gemini:'Gemini',claude:'Claude',bpe:'BPE',wordpiece:'WordPiece',unigram:'Unigram',sentencepiece:'SentencePiece'};
}
function calcTokenResult(){
  var text=mineState.tokenInput;
  if(!text){mineState.tokenResult=null;renderMine();return;}
  var cn=0,en=0,other=0;
  for(var i=0;i<text.length;i++){var c=text.charCodeAt(i);if((c>=0x4E00&&c<=0x9FFF)||(c>=0x3400&&c<=0x4DBF)||(c>=0xF900&&c<=0xFAFF)||(c>=0xFF00&&c<=0xFFFF))cn++;else if((c>=65&&c<=90)||(c>=97&&c<=122))en++;else other++;}
  var ratios=getTokenRatios();
  var r=ratios[mineState.tokenMethod];
  var tokens=cn*r.cn+en*r.en+other*r.other;
  if(tokens===0&&(cn+en+other)>0)tokens=0.5;
  mineState.tokenResult={tokens:tokens.toFixed(2),total:cn+en+other,cn:cn,en:en,other:other,desc:r.desc};
  renderMine();
}

  html+='<div class="msg bot">你好！我是智能助手 👋<br/>我可以帮你了解大模型知识。<br/>可以点击左下角 🔍 使用快捷搜索快速提问</div>';
  for(var i=0;i<s.messages.length;i++){
    var m=s.messages[i];
    if(m.role==='loading')html+='<div class="msg loading"><div class="loading-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>';
    else html+='<div class="msg '+m.role+'">'+m.htmlContent+'</div>';
  }
  html+='</div>';
  if(s.questions.length){
    html+='<div class="question-list"><span class="ql-title">📋 本会话问题</span><div class="ql-scroll">';
    for(var i=0;i<s.questions.length;i++){var q=s.questions[i];html+='<div class="ql-chip"><span class="ql-chip-text" onclick="chatScrollTo('+q.id+')">'+q.text+'</span><span class="ql-chip-del" onclick="chatDeleteQ('+q.id+')">✕</span></div>';}
    html+='</div></div>';
  }
  if(s.showQuickPanel){
    html+='<div class="quick-panel-mask" onclick="chatToggleQuick()"><div class="quick-panel" onclick="event.stopPropagation()"><div class="quick-panel-header"><span class="quick-panel-title">🔍 快捷提问</span><span class="quick-panel-close" onclick="chatToggleQuick()">✕</span></div><div class="quick-panel-tabs"><span class="qp-tab'+(s.qpTab===0?' active':'')+'" onclick="chatSwitchQpTab(0)">📚 通用</span><span class="qp-tab'+(s.qpTab===1?' active':'')+'" onclick="chatSwitchQpTab(1)">🔬 模型库</span><span class="qp-tab'+(s.qpTab===2?' active':'')+'" onclick="chatSwitchQpTab(2)">🤖 智能体</span></div><div class="quick-panel-body">';
    var qs0=['如何系统学习大模型','Transformer架构原理是什么','什么是RAG技术','什么是AI Agent','大模型微调是什么','什么是Token','大模型幻觉是什么意思','什么是MoE混合专家架构','什么是Prompt Engineering','什么是上下文窗口','什么是模型量化','大模型是怎么训练出来的'];
    var qs1=['推荐几个国内大模型','国际顶级大模型有哪些','开源大模型有哪些','DeepSeek-V4和R1有什么区别','生成式预训练模型-5.5和Claude有什么区别','通义千问有哪些版本','Kimi K2.7有什么特点','文心一言有什么优势','怎么部署本地大模型','使用大模型需要多少钱','如何调用大模型API','什么是Scaling Law'];
    var qs2=['有哪些AI编程助手','GLM-5.2有哪些能力','AI视频生成有哪些产品','大模型有哪些实际应用场景','大模型最新发展趋势','什么是大模型对齐','Temperature参数有什么作用','什么是多模态大模型','大模型安全吗','Llama模型有什么特点','AI绘画工具有哪些'];
    var qlist=s.qpTab===0?qs0:s.qpTab===1?qs1:qs2;
    for(var i=0;i<qlist.length;i++)html+='<span class="qp-item" onclick="chatQuickAsk(\''+qlist[i].replace(/'/g,"\\'")+'\')">'+qlist[i]+'</span>';
    html+='</div></div></div>';
  }
  html+='<div class="chat-input-row"><span class="quick-search-btn" onclick="chatToggleQuick()">🔍</span><textarea placeholder="输入你的问题..." id="chatInput" rows="1" onkeydown="chatKeyDown(event)"></textarea><button class="send-btn" onclick="chatSend()">发送</button></div></div>';
  panel.innerHTML=html;
}

function openChat(){chatState.visible=true;renderChat();}
function closeChat(){chatState.visible=false;renderChat();}
function chatToggleQuick(){chatState.showQuickPanel=!chatState.showQuickPanel;renderChat();}
function chatSwitchQpTab(idx){chatState.qpTab=idx;renderChat();}

function chatQuickAsk(q){
  chatState.showQuickPanel=false;
  chatState.inputValue=q;
  chatSend();
}
function chatKeyDown(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();chatSend();}}

function chatSend(){
  var inputEl=document.getElementById('chatInput');
  var text=inputEl?inputEl.value.trim():chatState.inputValue;
  if(!text)return;
  var msgId=++chatState.msgIdCounter;
  var userMsg={id:msgId,role:'user',htmlContent:markdownToHtml(text)};
  var loadingMsg={id:msgId+1,role:'loading',htmlContent:''};
  chatState.messages.push(userMsg,loadingMsg);
  chatState.questions.push({id:msgId,text:text.length>20?text.substring(0,20)+'...':text});
  chatState.inputValue='';
  renderChat();
  if(inputEl)inputEl.value='';
  setTimeout(function(){chatState.messages=chatState.messages.filter(function(m){return m.role!=='loading';});var reply=getLocalReply(text)||getFallbackReply(text);var mid=++chatState.msgIdCounter;chatState.messages.push({id:mid,role:'bot',htmlContent:markdownToHtml(reply)});renderChat();},600);
}
function chatClear(){showConfirm('清除对话','确定要清除所有对话记录吗？',function(){chatState.messages=[];chatState.questions=[];chatState.msgIdCounter=0;renderChat();showToast('已清除');});}
function chatScrollTo(id){/* scroll handled by render */ renderChat();}
function chatDeleteQ(qid){chatState.messages=chatState.messages.filter(function(m){return m.id!==qid&&m.id!==qid+1&&m.id!==qid+2;});chatState.questions=chatState.questions.filter(function(q){return q.id!==qid;});renderChat();}

// ===== FAB DRAG =====
(function(){
  var fab=document.getElementById('fabBtn'),dragging=false,startX,startY,origRight,origBottom;
  fab.addEventListener('touchstart',function(e){dragging=false;startX=e.touches[0].clientX;startY=e.touches[0].clientY;origRight=parseInt(fab.style.right)||16;origBottom=parseInt(fab.style.bottom)||100;});
  fab.addEventListener('touchmove',function(e){var dx=Math.abs(startX-e.touches[0].clientX);var dy=Math.abs(startY-e.touches[0].clientY);if(dx>6||dy>6)dragging=true;if(!dragging)return;fab.style.right=Math.max(4,Math.min(200,origRight+(startX-e.touches[0].clientX)))+'px';fab.style.bottom=Math.max(70,Math.min(400,origBottom+(startY-e.touches[0].clientY)))+'px';});
  fab.addEventListener('touchend',function(){if(dragging){fab.style.right='16px';}dragging=false;});
})();

// ===== INITIALIZATION =====
function init(){
  applyTheme(getTheme());
  // 初始化 AI 每日新闻
  getNewsForDate(getTodayStr());
  cleanOldNews();
  renderGeneral();
}

document.addEventListener('DOMContentLoaded',init);
</script>
