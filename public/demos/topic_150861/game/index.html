<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵物归乡·第一关</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        img {
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
            user-drag: none;
            pointer-events: none;
        }

        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #000;
            overflow: hidden;
        }

        #game-wrapper {
            position: relative;
            width: 1280px;
            height: 720px;
            transform-origin: center center;
            background: #000;
        }

        #ui-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2%;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
            color: #ffffff;
        }

        #level-title {
            font-size: 1.4vw;
            font-weight: bold;
            letter-spacing: 0.1em;
            text-shadow: 0 0 10px rgba(255,200,100,0.5);
            white-space: nowrap;
        }

        #enemy-queue-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(60,20,20,0.7);
            border: 2px solid #8B4513;
            border-radius: 6px;
            padding: 4px 12px;
        }

        #enemy-lingyun-display {
            font-size: 1vw;
            color: #ff6644;
            text-shadow: 0 0 8px rgba(255,80,40,0.7);
            white-space: nowrap;
            margin-right: 8px;
        }

        .enemy-preview {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0.8;
        }

        .enemy-preview canvas {
            width: 32px;
            height: 32px;
            image-rendering: pixelated;
        }

        .enemy-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(40, 15, 15, 0.85);
            border: 2px solid #8B4513;
            border-radius: 6px;
            padding: 4px 8px;
            min-width: 64px;
            gap: 2px;
        }

        .enemy-card-preview {
            width: 40px;
            height: 40px;
            image-rendering: pixelated;
        }

        .enemy-card-name {
            font-size: 0.75vw;
            color: #ffdddd;
            white-space: nowrap;
        }

        .enemy-card-cost {
            font-size: 0.9vw;
            font-weight: bold;
            color: #ff6644;
            text-shadow: 0 0 5px rgba(255, 80, 40, 0.5);
        }

        #timer {
            font-size: 1.8vw;
            font-weight: bold;
            color: #ffcc00;
            text-shadow: 0 0 10px rgba(255,200,0,0.8);
        }

        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            background-color: #0a0a0a;
        }

        #ui-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 15%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1%;
            z-index: 10;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            padding-bottom: 1%;
        }

        #player-lingyun-panel {
            position: absolute;
            left: 3%;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(20,15,5,0.85);
            border: 2px solid #B8860B;
            border-radius: 10px;
            padding: 6px 16px;
            box-shadow: 0 0 15px rgba(255,180,0,0.3);
        }

        .lingyun-icon {
            font-size: 2vw;
            filter: drop-shadow(0 0 6px rgba(255,150,0,0.8));
        }

        #lingyun-display {
            font-size: 2.2vw;
            font-weight: bold;
            color: #ffcc00;
            text-shadow: 0 0 12px rgba(255,200,0,0.8);
            white-space: nowrap;
            min-width: 40px;
            text-align: center;
        }

        .card-slot {
            width: 22%;
            height: 90%;
            border: 2px solid #444444;
            border-radius: 8px;
            background: rgba(20,20,30,0.8);
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
            color: #cccccc;
            transition: all 0.2s ease;
            cursor: pointer;
            padding: 6px 16px 6px 150px;
            gap: 12px;
            overflow: visible;
            position: relative;
        }

        .card-slot:hover:not(.disabled) {
            border-color: #00ffcc;
            background: rgba(0,255,200,0.15);
            box-shadow: 0 0 15px rgba(0,255,200,0.3);
        }

        .card-slot.selected {
            border-color: #00ffcc;
            background: rgba(0,255,200,0.2);
            box-shadow: 0 0 20px rgba(0,255,200,0.5);
        }

        .card-slot.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(0.7);
        }

        .card-slot.ultimate {
            border-color: #ffd700;
            border-width: 3px;
            background: linear-gradient(135deg, rgba(255, 200, 50, 0.25), rgba(255, 140, 0, 0.18));
            box-shadow:
                0 0 20px rgba(255, 215, 0, 0.6),
                0 0 40px rgba(255, 180, 0, 0.4),
                0 0 60px rgba(255, 120, 0, 0.2),
                inset 0 0 30px rgba(255, 215, 0, 0.15);
            animation: ultimateGlow 0.9s ease-in-out infinite, ultimateFloat 2.5s ease-in-out infinite;
            overflow: visible;
            z-index: 10;
        }

        .card-slot.ultimate::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                120deg,
                transparent 0%,
                rgba(255, 255, 200, 0.1) 40%,
                rgba(255, 255, 255, 0.35) 50%,
                rgba(255, 255, 200, 0.1) 60%,
                transparent 100%
            );
            animation: ultimateShimmer 2.2s ease-in-out infinite;
            pointer-events: none;
            z-index: 5;
        }

        .card-slot.ultimate::after {
            content: '必杀！';
            position: absolute;
            top: -8px;
            right: -8px;
            width: 52px;
            height: 52px;
            background: radial-gradient(circle, #ff2222 0%, #cc0000 70%, #990000 100%);
            color: #fff;
            font-size: 13px;
            font-weight: 900;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 2px solid #fff;
            transform: rotate(-12deg);
            box-shadow:
                0 0 10px rgba(255, 50, 50, 0.8),
                0 0 20px rgba(255, 0, 0, 0.5),
                0 2px 6px rgba(0, 0, 0, 0.5);
            animation: stampBounce 0.6s ease-out infinite alternate;
            z-index: 20;
            letter-spacing: 0.05em;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        }

        .card-slot.ultimate .card-name {
            color: #ffd700;
            font-size: 1.15vw;
            font-weight: bold;
            text-shadow:
                0 0 8px rgba(255, 215, 0, 0.9),
                0 0 16px rgba(255, 180, 0, 0.7),
                0 0 24px rgba(255, 120, 0, 0.5);
            animation: nameGlow 1.2s ease-in-out infinite alternate;
        }

        .card-slot.ultimate .card-cost {
            color: #ffd700;
            font-size: 1.3vw;
            font-weight: 900;
            text-shadow:
                0 0 10px rgba(255, 215, 0, 0.9),
                0 0 20px rgba(255, 180, 0, 0.7);
        }

        .card-slot.ultimate .card-cost .fire-icon {
            display: inline-block;
            animation: fireShake 0.4s ease-in-out infinite alternate;
        }

        .card-slot.ultimate .card-preview {
            filter: drop-shadow(0 0 8px rgba(255, 200, 50, 0.8))
                    drop-shadow(0 0 16px rgba(255, 150, 0, 0.5));
            animation: previewPulse 1.5s ease-in-out infinite;
        }

        @keyframes ultimateGlow {
            0%, 100% {
                box-shadow:
                    0 0 20px rgba(255, 215, 0, 0.5),
                    0 0 40px rgba(255, 180, 0, 0.35),
                    0 0 60px rgba(255, 120, 0, 0.2),
                    inset 0 0 30px rgba(255, 215, 0, 0.12);
            }
            50% {
                box-shadow:
                    0 0 30px rgba(255, 215, 0, 0.8),
                    0 0 55px rgba(255, 180, 0, 0.6),
                    0 0 80px rgba(255, 120, 0, 0.35),
                    inset 0 0 40px rgba(255, 215, 0, 0.2);
            }
        }

        @keyframes ultimateShimmer {
            0% { left: -100%; }
            60% { left: 150%; }
            100% { left: 150%; }
        }

        @keyframes ultimateFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        @keyframes nameGlow {
            0% {
                text-shadow:
                    0 0 8px rgba(255, 215, 0, 0.8),
                    0 0 14px rgba(255, 180, 0, 0.6),
                    0 0 22px rgba(255, 120, 0, 0.4);
            }
            100% {
                text-shadow:
                    0 0 12px rgba(255, 230, 100, 1),
                    0 0 22px rgba(255, 200, 50, 0.9),
                    0 0 35px rgba(255, 140, 0, 0.7);
            }
        }

        @keyframes fireShake {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(1px, -1px) scale(1.1); }
        }

        @keyframes stampBounce {
            0% { transform: rotate(-12deg) scale(1); }
            100% { transform: rotate(-12deg) scale(1.08); }
        }

        @keyframes previewPulse {
            0%, 100% {
                filter: drop-shadow(0 0 6px rgba(255, 200, 50, 0.6))
                        drop-shadow(0 0 12px rgba(255, 150, 0, 0.4));
            }
            50% {
                filter: drop-shadow(0 0 12px rgba(255, 220, 80, 0.9))
                        drop-shadow(0 0 22px rgba(255, 170, 20, 0.7));
            }
        }

        .card-preview {
            width: 150px;
            height: 150px;
            position: absolute;
            left: -15px;
            bottom: 0;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 100%;
            flex: 1;
            gap: 6px;
        }

        .card-name {
            font-size: 1vw;
            color: #ffffff;
            white-space: nowrap;
        }

        .card-cost {
            font-size: 1.1vw;
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 5px rgba(0,255,200,0.5);
        }

        .ultimate-progress {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
            margin-top: 2px;
        }

        .ult-progress-icon {
            font-size: 0.9vw;
            filter: drop-shadow(0 0 3px rgba(255, 200, 50, 0.6));
            flex-shrink: 0;
        }

        .ult-progress-bar {
            flex: 1;
            height: 9px;
            background: rgba(30, 25, 15, 0.9);
            border: 1px solid rgba(120, 90, 40, 0.6);
            border-radius: 5px;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.5);
        }

        .ult-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, rgba(180, 130, 30, 0.8), rgba(255, 200, 80, 0.9));
            border-radius: 4px;
            transition: width 0.3s ease;
            box-shadow: 0 0 6px rgba(255, 180, 50, 0.5);
        }

        .ultimate-progress.progress-low .ult-progress-fill {
            background: linear-gradient(90deg, rgba(120, 80, 20, 0.7), rgba(180, 130, 40, 0.75));
            box-shadow: 0 0 3px rgba(200, 150, 50, 0.3);
        }

        .ultimate-progress.progress-mid .ult-progress-fill {
            background: linear-gradient(90deg, rgba(180, 130, 30, 0.85), rgba(255, 200, 80, 0.9));
            box-shadow: 0 0 5px rgba(255, 180, 50, 0.5);
        }

        .ultimate-progress.progress-high .ult-progress-fill {
            background: linear-gradient(90deg, rgba(220, 160, 40, 1), rgba(255, 220, 100, 1));
            box-shadow: 0 0 8px rgba(255, 200, 50, 0.7);
            animation: progressGlow 1.2s ease-in-out infinite alternate;
        }

        .ultimate-progress.progress-high .ult-progress-icon {
            animation: iconBounce 0.8s ease-in-out infinite alternate;
        }

        .ultimate-progress.progress-full .ult-progress-fill {
            background: linear-gradient(90deg, rgba(255, 200, 50, 1), rgba(255, 240, 150, 1));
            box-shadow: 0 0 12px rgba(255, 220, 80, 0.9), 0 0 20px rgba(255, 180, 30, 0.6);
            animation: progressFullGlow 0.5s ease-in-out infinite alternate;
        }

        .ultimate-progress.progress-full .ult-progress-icon {
            animation: iconBounceFast 0.3s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 6px rgba(255, 220, 80, 1));
        }

        .ult-progress-text {
            font-size: 0.75vw;
            font-weight: bold;
            color: rgba(220, 180, 80, 0.85);
            white-space: nowrap;
            flex-shrink: 0;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
            letter-spacing: 0.03em;
        }

        .ultimate-progress.progress-high .ult-progress-text {
            color: rgba(255, 210, 100, 1);
            text-shadow: 0 0 6px rgba(255, 180, 50, 0.7), 0 1px 2px rgba(0, 0, 0, 0.6);
        }

        .ultimate-progress.progress-full .ult-progress-text {
            color: #fff5c0;
            text-shadow: 0 0 8px rgba(255, 220, 80, 1), 0 0 14px rgba(255, 180, 30, 0.8);
            animation: textFlash 0.6s ease-in-out infinite alternate;
        }

        @keyframes progressGlow {
            0% { box-shadow: 0 0 6px rgba(255, 180, 50, 0.5); }
            100% { box-shadow: 0 0 12px rgba(255, 200, 70, 0.8); }
        }

        @keyframes progressFullGlow {
            0% {
                box-shadow: 0 0 10px rgba(255, 220, 80, 0.8), 0 0 18px rgba(255, 180, 30, 0.5);
            }
            100% {
                box-shadow: 0 0 16px rgba(255, 240, 120, 1), 0 0 28px rgba(255, 200, 50, 0.8);
            }
        }

        @keyframes iconBounce {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }

        @keyframes iconBounceFast {
            0% { transform: scale(1) rotate(-5deg); }
            100% { transform: scale(1.2) rotate(5deg); }
        }

        @keyframes textFlash {
            0% { opacity: 0.85; }
            100% { opacity: 1; }
        }

        .ultimate-hint {
            font-size: 0.85em;
            font-weight: normal;
            color: rgba(255, 200, 80, 0.55);
            margin-left: 4px;
            letter-spacing: 0.05em;
        }

        .card-slot.ultimate .ultimate-hint.ultimate-active {
            color: #ffd700;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.8);
            font-weight: bold;
            animation: hintPulse 1.2s ease-in-out infinite;
        }

        @keyframes hintPulse {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 1; text-shadow: 0 0 12px rgba(255, 215, 0, 1); }
        }

        #restart-btn {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            padding: 12px 40px;
            font-size: 1.5vw;
            font-family: "Microsoft YaHei", sans-serif;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(135deg, #8b6914, #cd853f);
            border: 2px solid #ffcc00;
            border-radius: 8px;
            cursor: pointer;
            display: none;
            transition: all 0.2s ease;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            box-shadow: 0 0 20px rgba(255,200,0,0.3);
        }

        #restart-btn:hover {
            background: linear-gradient(135deg, #cd853f, #daa520);
            box-shadow: 0 0 30px rgba(255,200,0,0.5);
            transform: translate(-50%, -50%) scale(1.05);
        }

        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            color: #ffffff;
            font-size: 3vw;
            letter-spacing: 0.2em;
        }

        #main-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.85)), url('assets/plaza_bg_1280x720.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            pointer-events: auto;
        }

        #main-menu h1 {
            font-size: 72px;
            font-family: "STSong", "SimSun", "Songti SC", "Noto Serif SC", serif;
            font-weight: bold;
            color: #ffd700;
            text-shadow:
                0 0 10px rgba(255, 215, 0, 0.8),
                0 0 20px rgba(255, 200, 0, 0.6),
                0 0 40px rgba(255, 180, 0, 0.4),
                0 0 60px rgba(255, 150, 0, 0.3),
                0 2px 4px rgba(0, 0, 0, 0.8);
            margin-bottom: 16px;
            letter-spacing: 0.3em;
        }

        #main-menu .subtitle {
            font-size: 24px;
            color: rgba(255, 215, 120, 0.85);
            letter-spacing: 0.2em;
            margin-bottom: 100px;
            text-shadow: 0 0 10px rgba(255, 200, 100, 0.3);
        }

        #start-btn {
            padding: 16px 48px;
            font-size: 24px;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            font-weight: bold;
            color: #ffd700;
            background: rgba(20, 15, 5, 0.75);
            border: 2px solid #cc9900;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-shadow: 0 0 10px rgba(255, 200, 0, 0.5);
            box-shadow:
                0 0 15px rgba(204, 153, 0, 0.3),
                inset 0 0 15px rgba(255, 200, 0, 0.1);
            letter-spacing: 0.15em;
        }

        #start-btn:hover {
            color: #ffffff;
            background: rgba(60, 45, 10, 0.85);
            border-color: #ffd700;
            box-shadow:
                0 0 25px rgba(255, 215, 0, 0.6),
                0 0 50px rgba(255, 180, 0, 0.3),
                inset 0 0 20px rgba(255, 200, 0, 0.15);
            transform: scale(1.05);
            text-shadow:
                0 0 15px rgba(255, 255, 255, 0.8),
                0 0 30px rgba(255, 215, 0, 0.6);
        }

        #start-btn:active {
            transform: scale(0.98);
            box-shadow:
                0 0 10px rgba(255, 215, 0, 0.4),
                inset 0 0 25px rgba(0, 0, 0, 0.4);
        }

        #version-info {
            position: absolute;
            bottom: 20px;
            right: 24px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.05em;
        }

        #end-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 25;
            pointer-events: auto;
        }

        #end-screen h2 {
            font-size: 56px;
            color: #ffd700;
            text-shadow: 0 0 25px rgba(255, 179, 71, 0.8);
            margin-bottom: 20px;
        }

        #end-screen .end-text {
            font-size: 24px;
            color: #daa520;
            margin-bottom: 60px;
        }

        #back-to-menu-btn {
            padding: 12px 40px;
            font-size: 24px;
            font-family: "Microsoft YaHei", sans-serif;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(135deg, #8b6914, #cd853f);
            border: 2px solid #ffcc00;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            box-shadow: 0 0 15px rgba(255,200,0,0.3);
        }

        #back-to-menu-btn:hover {
            background: linear-gradient(135deg, #cd853f, #daa520);
            box-shadow: 0 0 25px rgba(255,200,0,0.5);
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="game-wrapper">
            <div id="ui-top">
                <div id="level-title">灵物归乡·第一关</div>
                <div id="enemy-queue-bar">
                    <div id="enemy-lingyun-display">敌方灵韵: 0</div>
                    <div class="enemy-card" data-enemy="enemy_knife">
                        <canvas class="enemy-card-preview" width="48" height="48"></canvas>
                        <div class="enemy-card-name"></div>
                        <div class="enemy-card-cost"></div>
                    </div>
                    <div class="enemy-card" data-enemy="enemy_gun">
                        <canvas class="enemy-card-preview" width="48" height="48"></canvas>
                        <div class="enemy-card-name"></div>
                        <div class="enemy-card-cost"></div>
                    </div>
                </div>
                <div id="timer">03:00</div>
            </div>

            <canvas id="game-canvas" width="1280" height="720"></canvas>

            <canvas id="cutscene-canvas" width="1280" height="720" style="position:absolute;top:0;left:0;width:100%;height:100%;image-rendering:pixelated;display:none;z-index:15;"></canvas>

            <div id="main-menu">
                <h1>灵物归乡</h1>
                <div class="subtitle">第一关 · 博物馆广场</div>
                <button id="start-btn">开始游戏</button>
                <div id="version-info">Demo v1.1</div>
            </div>
