<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计算页</title>
    <style id="theme-vars">
/* Human Token - Doodle Graffiti Style */
:root {
  /* Paper & Ink */
  --paper-bg: #faf6ed;
  --paper-surface: #fffdf7;
  --paper-muted: #f0e9da;
  --paper-dark: #e8dfcc;
  --ink-primary: #1a1613;
  --ink-secondary: #4a4039;
  --ink-tertiary: #7a6e63;
  --ink-soft: rgba(26, 22, 19, 0.12);
  --ink-border: rgba(26, 22, 19, 0.85);
  --ink-border-light: rgba(26, 22, 19, 0.25);

  /* Doodle Accents - playful splashes of color */
  --accent-yellow: #f4c95d;
  --accent-pink: #e87a8f;
  --accent-green: #6bae7d;
  --accent-blue: #5b8fb9;
  --accent-orange: #e8955a;
  --accent-purple: #9b7bb8;

  /* Semantic states */
  --state-good: #4a7c59;
  --state-warn: #c99a3b;
  --state-low: #b85450;
  --state-info: #4a7c9b;

  /* Typography */
  --font-display: "Caveat", "Kalam", "Comic Sans MS", "Noto Sans SC", cursive;
  --font-body: "Kalam", "Noto Sans SC", "PingFang SC", sans-serif;
  --font-marker: "Permanent Marker", "Caveat", "Noto Sans SC", cursive;

  /* Doodle shape system */
  --radius-doodle-sm: 10px 14px 12px 16px;
  --radius-doodle-md: 18px 22px 20px 24px;
  --radius-doodle-lg: 28px 32px 26px 34px;
  --radius-doodle-pill: 999px;

  /* Spacing */
  --space-1: 6px;
  --space-2: 10px;
  --space-3: 14px;
  --space-4: 18px;
  --space-5: 24px;
  --space-6: 32px;

  /* Shadow - hand-drawn feel */
  --shadow-doodle-sm: 3px 3px 0 rgba(26, 22, 19, 0.15);
  --shadow-doodle-md: 5px 6px 0 rgba(26, 22, 19, 0.12);
  --shadow-doodle-lg: 8px 10px 0 rgba(26, 22, 19, 0.1);
  --shadow-float: 0 12px 28px rgba(26, 22, 19, 0.1);
}

/* Doodle background texture */
body {
  background:
    radial-gradient(circle at 20% 15%, rgba(244, 201, 93, 0.12), transparent 25%),
    radial-gradient(circle at 85% 75%, rgba(232, 122, 143, 0.08), transparent 20%),
    linear-gradient(180deg, #faf6ed 0%, #f3ecdd 100%);
}

/* Notebook grid lines */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0.06;
  background-image:
    linear-gradient(rgba(26, 22, 19, 1) 1px, transparent 1px);
  background-size: 100% 28px;
  z-index: 0;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-muted: var(--paper-muted);
  }
  @layer base {
    body { background: var(--paper-surface); color: var(--paper-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen antialiased">
    <!-- Google Fonts for doodle typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Kalam:wght@300;400;700&family=Permanent+Marker&display=swap" rel="stylesheet">

    <main class="relative z-10 min-h-screen pb-24" style="font-family: var(--font-body); color: var(--ink-primary);">
      <!-- Status Bar -->
      <div class="flex items-center justify-between px-6 pt-3 pb-1" style="font-family: var(--font-body); font-size: 14px; color: var(--ink-primary);">
        <span class="font-bold" style="font-family: var(--font-marker);">9:41</span>
        <div class="flex items-center gap-1">
          <!-- Signal bars doodle -->
          <div class="flex items-end gap-0.5 h-3">
            <div class="w-1" style="height: 4px; background: var(--ink-primary); border-radius: 1px;"></div>
            <div class="w-1" style="height: 7px; background: var(--ink-primary); border-radius: 1px;"></div>
            <div class="w-1" style="height: 10px; background: var(--ink-primary); border-radius: 1px;"></div>
            <div class="w-1" style="height: 12px; background: var(--ink-primary); border-radius: 1px;"></div>
          </div>
          <!-- Battery doodle -->
          <div class="ml-1 flex items-center">
            <div class="relative w-6 h-3" style="border: 1.5px solid var(--ink-primary); border-radius: 3px;">
              <div class="absolute left-0.5 top-0.5 bottom-0.5" style="width: 70%; background: var(--ink-primary); border-radius: 1px;"></div>
            </div>
            <div class="w-0.5 h-1.5 -ml-px" style="background: var(--ink-primary); border-radius: 0 1px 1px 0;"></div>
          </div>
        </div>
      </div>

      <!-- Header -->
      <header class="flex items-center justify-between px-5 py-3">
        <div class="flex items-center gap-2">
          <!-- Doodle token icon -->
          <div class="relative w-8 h-8 flex items-center justify-center" style="transform: rotate(-5deg);">
            <svg viewBox="0 0 32 32" class="w-8 h-8">
              <circle cx="16" cy="16" r="13" fill="var(--accent-yellow)" stroke="var(--ink-primary)" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 0"/>
              <path d="M16 6 L16 26 M11 11 Q16 6 21 11 M11 21 Q16 26 21 21" fill="none" stroke="var(--ink-primary)" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </div>
          <h1 class="text-xl font-bold tracking-tight" style="font-family: var(--font-display); font-size: 28px; line-height: 1;">Human Token</h1>
        </div>
        <!-- Weather pill -->
        <div class="flex items-center gap-1 px-3 py-1" style="background: var(--paper-surface); border: 2px solid var(--ink-primary); border-radius: 999px; transform: rotate(2deg); box-shadow: 2px 2px 0 rgba(26,22,19,0.15);">
          <span class="text-base">☀</span>
          <span class="text-sm font-bold" style="font-family: var(--font-body);">晴</span>
        </div>
      </header>

      <!-- Decorative doodle elements -->
      <div class="deco-float absolute top-20 right-4 opacity-60" style="--rot: 15deg; transform: rotate(15deg);">
        <svg width="24" height="24" viewBox="0 0 24 24">
          <path d="M12 2 L14 10 L22 12 L14 14 L12 22 L10 14 L2 12 L10 10 Z" fill="var(--accent-pink)" stroke="var(--ink-primary)" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="deco-float delay-1 absolute top-32 left-3 opacity-50" style="--rot: -10deg; transform: rotate(-10deg);">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3" fill="var(--accent-green)" stroke="var(--ink-primary)" stroke-width="1.5"/>
          <path d="M12 2v3 M12 19v3 M2 12h3 M19 12h3 M4.9 4.9l2.1 2.1 M17 17l2.1 2.1 M4.9 19.1L7 17 M17 7l2.1-2.1" stroke="var(--ink-primary)" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>

      <!-- Hero Battery Card -->
      <section class="px-5 mt-3">
        <div class="relative p-6 pt-8" style="background: var(--paper-surface); border: 2.5px solid var(--ink-primary); border-radius: var(--radius-doodle-lg); box-shadow: var(--shadow-doodle-md); transform: rotate(-1deg);">
          <!-- Tape decoration -->
          <div class="absolute -top-3 left-1/2 -translate-x-1/2 w-16 h-6" style="background: var(--accent-yellow); opacity: 0.7; transform: rotate(-3deg); border: 1px dashed rgba(26,22,19,0.2);"></div>

          <!-- Mood emoji -->
          <div class="flex justify-center mb-2">
            <div class="text-5xl" style="filter: drop-shadow(1px 2px 0 rgba(26,22,19,0.1)); transform: rotate(3deg);">😌</div>
          </div>

          <!-- Token number -->
          <div class="text-center mb-1">
            <span class="token-number font-bold tabular-nums" style="font-family: var(--font-marker); font-size: 72px; line-height: 1; color: var(--ink-primary); letter-spacing: -0.02em;">72</span>
            <span class="text-2xl font-bold ml-1" style="font-family: var(--font-display); color: var(--ink-secondary);">%</span>
          </div>
          <p class="text-center mb-5 text-sm" style="font-family: var(--font-body); color: var(--ink-tertiary);">今日能量值 · 状态不错</p>

          <!-- Doodle battery bar -->
          <div class="relative mx-auto" style="max-width: 260px;">
            <!-- Battery outline with hand-drawn feel -->
            <div class="relative h-8" style="border: 2.5px solid var(--ink-primary); border-radius: 999px; background: var(--paper-muted); overflow: hidden;">
              <!-- Battery fill -->
              <div class="battery-fill absolute left-1 top-1 bottom-1" style="width: 72%; background: linear-gradient(90deg, var(--accent-green), var(--accent-yellow)); border-radius: 999px; transition: width 0.4s ease;">
                <!-- Doodle texture on fill -->
                <div class="absolute inset-0 opacity-30" style="background: repeating-linear-gradient(45deg, transparent, transparent 4px, rgba(255,255,255,0.3) 4px, rgba(255,255,255,0.3) 8px);"></div>
              </div>
              <!-- Doodle lines on battery -->
              <svg class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 260 32" preserveAspectRatio="none">
                <path d="M5 16 Q20 12 35 16 T65 16 T95 16 T125 16 T155 16 T185 16 T215 16 T245 16" fill="none" stroke="rgba(26,22,19,0.1)" stroke-width="1" stroke-linecap="round"/>
              </svg>
            </div>
            <!-- Battery tip -->
            <div class="absolute -right-2 top-1/2 -translate-y-1/2 w-2 h-5" style="background: var(--ink-primary); border-radius: 0 3px 3px 0;"></div>

            <!-- Battery markers -->
            <div class="flex justify-between mt-2 px-2 text-xs" style="font-family: var(--font-body); color: var(--ink-tertiary); font-size: 11px;">
              <span>0</span>
              <span>25</span>
              <span>50</span>
              <span>75</span>
              <span>100</span>
            </div>
          </div>

          <!-- Decorative sparkles -->
          <div class="absolute -right-2 top-1/4" style="transform: rotate(20deg);">
            <svg width="16" height="16" viewBox="0 0 24 24">
              <path d="M12 2 L14 10 L22 12 L14 14 L12 22 L10 14 L2 12 L10 10 Z" fill="var(--accent-orange)" stroke="var(--ink-primary)" stroke-width="1.5"/>
            </svg>
          </div>
          <div class="absolute -left-1 bottom-1/3" style="transform: rotate(-15deg);">
            <svg width="14" height="14" viewBox="0 0 24 24">
              <path d="M12 3 L13.5 10.5 L21 12 L13.5 13.5 L12 21 L10.5 13.5 L3 12 L10.5 10.5 Z" fill="var(--accent-blue)" stroke="var(--ink-primary)" stroke-width="1.5"/>
            </svg>
          </div>
        </div>
      </section>

      <!-- Quick Actions Title -->
      <section class="px-5 mt-7 mb-3">
        <div class="flex items-center gap-2">
          <h2 class="text-lg font-bold" style="font-family: var(--font-display); font-size: 22px; color: var(--ink-primary);">快速记录</h2>
          <div class="flex-1 h-0.5" style="background: repeating-linear-gradient(90deg, var(--ink-border-light) 0, var(--ink-border-light) 6px, transparent 6px, transparent 12px);"></div>
        </div>
      </section>

      <!-- Quick Action Grid 2x2 -->
      <section class="px-5">
        <div class="grid grid-cols-2 gap-4">
          <!-- +50 Big Energy Button -->
          <button class="action-btn relative group" data-dom-id="btn-plus-50" aria-label="增加50能量">
            <div class="flex flex-col items-center justify-center p-5 h-full" style="background: var(--paper-surface); border: 2.5px solid var(--ink-primary); border-radius: var(--radius-doodle-md); box-shadow: var(--shadow-doodle-sm); transform: rotate(-2deg); transition: transform 0.15s ease, box-shadow 0.15s ease;">
              <!-- Doodle icon: spark/burst -->
              <div class="mb-2" style="transform: rotate(-5deg);">
                <svg width="40" height="40" viewBox="0 0 48 48">
                  <path d="M24 4 L28 20 L44 24 L28 28 L24 44 L20 28 L4 24 L20 20 Z" fill="var(--accent-green)" stroke="var(--ink-primary)" stroke-width="2.5" stroke-linejoin="round"/>
                  <circle cx="24" cy="24" r="5" fill="var(--paper-surface)" stroke="var(--ink-primary)" stroke-width="2"/>
                </svg>
              </div>
              <span class="text-2xl font-bold" style="font-family: var(--font-marker); color: var(--ink-primary);">+30</span>
              <span class="text-xs mt-1" style="font-family: var(--font-body); color: var(--ink-tertiary);">大补给</span>
            </div>
          </button>

          <!-- +5 Small Energy Button -->
          <button class="action-btn relative group" data-dom-id="btn-plus-5" aria-label="增加5能量">
            <div class="flex flex-col items-center justify-center p-5 h-full" style="background: var(--paper-surface); border: 2.5px solid var(--ink-primary); border-radius: var(--radius-doodle-md); box-shadow: var(--shadow-doodle-sm); transform: rotate(1.5deg); transition: transform 0.15s ease, box-shadow 0.15s ease;">
              <!-- Doodle icon: small sparkles -->
              <div class="mb-2 flex gap-1 items-end" style="transform: rotate(5deg);">
                <svg width="16" height="16" viewBox="0 0 24 24">
                  <path d="M12 3 L14 10 L21 12 L14 14 L12 21 L10 14 L3 12 L10 10 Z" fill="var(--accent-yellow)" stroke="var(--ink-primary)" stroke-width="2" stroke-linejoin="round"/>
                </svg>
                <svg width="22" height="22" viewBox="0 0 24 24">
                  <path d="M12 2 L14 10 L22 12 L14 14 L12 22 L10 14 L2 12 L10 10 Z" fill="var(--accent-yellow)" stroke="var(--ink-primary)" stroke-width="2" stroke-linejoin="round"/>
                </svg>
              </div>
              <span class="text-2xl font-bold" style="font-family: var(--font-marker); color: var(--ink-primary);">+10</span>
              <span class="text-xs mt-1" style="font-family: var(--font-body); color: var(--ink-tertiary);">小补给</span>
            </div>
          </button>

          <!-- -50 Big Drain Button -->
          <button class="action-btn relative group" data-dom-id="btn-minus-50" aria-label="减少50能量">
            <div class="flex flex-col items-center justify-center p-5 h-full" style="background: var(--paper-surface); border: 2.5px solid var(--ink-primary); border-radius: var(--radius-doodle-md); box-shadow: var(--shadow-doodle-sm); transform: rotate(1deg); transition: transform 0.15s ease, box-shadow 0.15s ease;">
              <!-- Doodle icon: tired/cloud -->
              <div class="mb-2" style="transform: rotate(-3deg);">
                <svg width="44" height="36" viewBox="0 0 52 44">
                  <path d="M12 30 Q6 30 6 24 Q6 18 12 18 Q14 10 24 10 Q34 10 36 18 Q46 18 46 26 Q46 34 38 34 L14 34 Q12 34 12 30 Z" fill="var(--accent-pink)" stroke="var(--ink-primary)" stroke-width="2.5" stroke-linejoin="round"/>
                  <!-- Zzz -->
                  <text x="36" y="16" style="font-family: var(--font-marker); font-size: 10px; fill: var(--ink-primary);">z</text>
                  <text x="40" y="10" style="font-family: var(--font-marker); font-size: 8px; fill: var(--ink-primary);">z</text>
                </svg>
              </div>
              <span class="text-2xl font-bold" style="font-family: var(--font-marker); color: var(--ink-primary);">-20</span>
              <span class="text-xs mt-1" style="font-family: var(--font-body); color: var(--ink-tertiary);">大消耗</span>
            </div>
          </button>

          <!-- -5 Small Drain Button -->
          <button class="action-btn relative group" data-dom-id="btn-minus-5" aria-label="减少5能量">
            <div class="flex flex-col items-center justify-center p-5 h-full" style="background: var(--paper-surface); border: 2.5px solid var(--ink-primary); border-radius: var(--radius-doodle-md); box-shadow: var(--shadow-doodle-sm); transform: rotate(-1.5deg); transition: transform 0.15s ease, box-shadow 0.15s ease;">
              <!-- Doodle icon: wavy line / drain -->
              <div class="mb-2" style="transform: rotate(3deg);">
                <svg width="44" height="32" viewBox="0 0 52 36">
                  <path d="M4 18 Q10 8 16 18 T28 18 T40 18 T48 18" fill="none" stroke="var(--accent-blue)" stroke-width="4" stroke-linecap="round"/>
                  <path d="M4 18 Q10 8 16 18 T28 18 T40 18 T48 18" fill="none" stroke="var(--ink-primary)" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 4" opacity="0.5"/>
                </svg>
              </div>
              <span class="text-2xl font-bold" style="font-family: var(--font-marker); color: var(--ink-primary);">-8</span>
              <span class="text-xs mt-1" style="font-family: var(--font-body); color: var(--ink-tertiary);">小消耗</span>
            </div>
          </button>
        </div>
      </section>

      <!-- Today's Log Preview -->
      <section class="px-5 mt-7">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-lg font-bold" style="font-family: var(--font-display); font-size: 22px; color: var(--ink-primary);">今日记录</h2>
          <button class="text-sm font-bold underline-offset-2 hover:underline" style="font-family: var(--font-body); color: var(--accent-blue);" data-dom-id="btn-view-all">查看全部 →</button>
        </div>

        <div class="flex flex-col gap-2">
          <!-- Log item 1 -->
          <div class="log-item flex items-center justify-between p-3" style="background: var(--paper-surface); border: 2px solid var(--ink-primary); border-radius: var(--radius-doodle-sm); transform: rotate(-0.5deg);">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 flex items-center justify-center text-lg" style="background: var(--accent-green); border: 2px solid var(--ink-primary); border-radius: 50%; transform: rotate(-5deg);">✦</div>
              <div>
                <p class="text-sm font-bold" style="font-family: var(--font-body); color: var(--ink-primary);">午间小憩</p>
                <p class="text-xs" style="font-family: var(--font-body); color: var(--ink-tertiary);">14:30</p>
              </div>
            </div>
            <span class="font-bold" style="font-family: var(--font-marker); color: var(--state-good); font-size: 18px;">+30</span>
          </div>

          <!-- Log item 2 -->
          <div class="flex items-center justify-between p-3" style="background: var(--paper-surface); border: 2px solid var(--ink-primary); border-radius: var(--radius-doodle-sm); transform: rotate(0.5deg);">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 flex items-center justify-center text-lg" style="background: var(--accent-pink); border: 2px solid var(--ink-primary); border-radius: 50%; transform: rotate(5deg);">☁</div>
              <div>
                <p class="text-sm font-bold" style="font-family: var(--font-body); color: var(--ink-primary);">项目会议</p>
                <p class="text-xs" style="font-family: var(--font-body); color: var(--ink-tertiary);">10:00</p>
              </div>
            </div>
            <span class="font-bold" style="font-family: var(--font-marker); color: var(--state-low); font-size: 18px;">-15</span>
          </div>

          <!-- Log item 3 -->
          <div class="flex items-center justify-between p-3" style="background: var(--paper-surface); border: 2px solid var(--ink-primary); border-radius: var(--radius-doodle-sm); transform: rotate(-0.3deg);">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 flex items-center justify-center text-lg" style="background: var(--accent-yellow); border: 2px solid var(--ink-primary); border-radius: 50%; transform: rotate(3deg);">☀</div>
              <div>
                <p class="text-sm font-bold" style="font-family: var(--font-body); color: var(--ink-primary);">晨间拉伸</p>
                <p class="text-xs" style="font-family: var(--font-body); color: var(--ink-tertiary);">07:30</p>
              </div>
            </div>
            <span class="font-bold" style="font-family: var(--font-marker); color: var(--state-good); font-size: 18px;">+7</span>
          </div>
        </div>
      </section>

      <!-- Bottom spacer for tab bar -->
      <div class="h-6"></div>
    </main>

    <!-- Bottom Tab Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 z-50" style="background: var(--paper-surface); border-top: 2.5px solid var(--ink-primary); padding-bottom: env(safe-area-inset-bottom, 0);">
      <div class="flex items-stretch justify-around px-2 py-2">
        <!-- 账单 Tab -->
        <button class="tab-btn flex-1 flex flex-col items-center justify-center gap-1 py-2" data-dom-id="tab-bill" data-tab-key="bill" aria-label="账单">
          <svg width="24" height="24" viewBox="0 0 24 24" class="tab-icon" style="color: var(--ink-tertiary);">
            <path d="M4 4h16v16l-3-2-3 2-3-2-3 2-4-2V4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <path d="M8 9h8 M8 13h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span class="text-xs font-bold" style="font-family: var(--font-body); color: var(--ink-tertiary); font-size: 11px;">账单</span>
        </button>

        <!-- 计算 Tab (Active) -->
        <button class="tab-btn flex-1 flex flex-col items-center justify-center gap-1 py-2 relative" data-dom-id="tab-calculator" data-tab-key="calculator" data-active="true" aria-label="计算">
          <!-- Active indicator: doodle circle -->
          <div class="absolute -top-1 left-1/2 -translate-x-1/2 w-12 h-12" style="background: var(--accent-yellow); border: 2.5px solid var(--ink-primary); border-radius: 50%; transform: rotate(-3deg); box-shadow: 2px 2px 0 rgba(26,22,19,0.15);"></div>
          <svg width="24" height="24" viewBox="0 0 24 24" class="tab-icon relative z-10" style="color: var(--ink-primary);">
            <rect x="4" y="3" width="16" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M8 7h8 M7 12h2 M11 12h2 M15 12h2 M7 16h2 M11 16h2 M15 16h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span class="text-xs font-bold relative z-10" style="font-family: var(--font-body); color: var(--ink-primary); font-size: 11px;">计算</span>
        </button>

        <!-- 设置 Tab -->
        <button class="tab-btn flex-1 flex flex-col items-center justify-center gap-1 py-2" data-dom-id="tab-settings" data-tab-key="settings" aria-label="设置">
          <svg width="24" height="24" viewBox="0 0 24 24" class="tab-icon" style="color: var(--ink-tertiary);">
            <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M12 2v2 M12 20v2 M2 12h2 M20 12h2 M4.9 4.9l1.4 1.4 M17.7 17.7l1.4 1.4 M4.9 19.1l1.4-1.4 M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span class="text-xs font-bold" style="font-family: var(--font-body); color: var(--ink-tertiary); font-size: 11px;">设置</span>
        </button>

    </nav>

    <!-- Page-specific doodle styles -->
    <style>
      /* Action button hover/active states */
      .action-btn {
        cursor: pointer;
        outline: none;
        -webkit-tap-highlight-color: transparent;
      }
      .action-btn > div {
        transition: transform 0.15s cubic-bezier(.2,.8,.2,1), box-shadow 0.15s cubic-bezier(.2,.8,.2,1);
      }
      .action-btn:hover > div {
        transform: rotate(0deg) translateY(-2px);
        box-shadow: 4px 5px 0 rgba(26,22,19,0.2);
      }
      .action-btn:active > div {
        transform: rotate(0deg) translateY(1px);
        box-shadow: 1px 1px 0 rgba(26,22,19,0.15);
      }
      .action-btn:focus-visible > div {
        outline: 3px solid var(--accent-blue);
        outline-offset: 2px;
      }

      /* Tab button hover states */
      .tab-btn {
        cursor: pointer;
        outline: none;
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.15s ease;
      }
      .tab-btn:hover {
        transform: translateY(-1px);
      }
      .tab-btn:active {
        transform: translateY(0);
      }
      .tab-btn:focus-visible {
        outline: 2px solid var(--accent-blue);
        outline-offset: 2px;
        border-radius: var(--radius-doodle-sm);
      }

      /* Battery fill pulse animation on load */
      @keyframes batteryFill {
        0% { width: 0%; }
        60% { width: 76%; }
        100% { width: 72%; }
      }
      .battery-fill {
        animation: batteryFill 1.2s cubic-bezier(.2,.8,.2,1) both;
      }

      /* Token number count-up feel via subtle scale */
      @keyframes tokenPop {
        0% { transform: scale(0.8); opacity: 0; }
        60% { transform: scale(1.05); }
        100% { transform: scale(1); opacity: 1; }
      }
      .token-number {
        display: inline-block;
        animation: tokenPop 0.8s cubic-bezier(.2,.8,.2,1) 0.2s both;
      }

      /* Floating decoration animation */
      @keyframes floaty {
        0%, 100% { transform: translateY(0) rotate(var(--rot, 0deg)); }
        50% { transform: translateY(-4px) rotate(calc(var(--rot, 0deg) + 3deg)); }
      }
      .deco-float {
        animation: floaty 3s ease-in-out infinite;
      }
      .deco-float.delay-1 { animation-delay: 0.5s; }
      .deco-float.delay-2 { animation-delay: 1s; }

      /* Log item hover */
      .log-item {
        transition: transform 0.15s ease;
      }
      .log-item:hover {
        transform: rotate(0deg) translateX(2px);
      }

      /* Doodle underline for section titles */
      .doodle-underline {
        position: relative;
        display: inline-block;
      }
      .doodle-underline::after {
        content: '';
        position: absolute;
        left: -4px;
        right: -4px;
        bottom: -2px;
        height: 4px;
        background: var(--accent-yellow);
        opacity: 0.5;
        transform: skewX(-8deg);
        z-index: -1;
      }

      /* Reduced motion */
      @media (prefers-reduced-motion: reduce) {
        .action-btn > div,
        .tab-btn,
        .log-item,
        .battery-fill,
        .token-number,
        .deco-float {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>

    <script>lucide.createIcons();</script>
</body>
</html>
