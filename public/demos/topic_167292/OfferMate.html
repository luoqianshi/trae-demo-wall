**五险（社保）：**
- 养老保险：个人8%，公司16% → 退休领养老金
- 医疗保险：个人2%，公司8-10% → 看病报销用
- 失业保险：个人0.5%，公司0.5-1% → 失业时领补助
- 工伤保险：公司全额缴纳 → 工作中受伤保障
- 生育保险：公司全额缴纳 → 生育津贴

**一金：**
- 住房公积金：个人5-12%，公司同比例 → 买房/租房/装修都能用

**⚠️ 避坑提醒：**
1. 问清缴费基数：是按实际工资还是最低基数？
2. 试用期也应缴纳社保，这是法律规定
3. 公积金比例越高越好，相当于强制储蓄

**法律规定：**
- 合同期3个月-1年：试用期≤1个月
- 合同期1-3年：试用期≤2个月
- 合同期3年以上：试用期≤6个月
- 试用期工资≥转正工资的80%

**常见陷阱：**
❌ 试用期不缴社保 → 违法！
❌ 试用期随意辞退 → 需证明不符合录用条件
❌ 延长试用期 → 同一公司只能约定一次
❌ 试用期合同单独签 → 应包含在正式合同中

**自我保护：**
- 入职时确认考核标准和转正条件
- 保留工作成果和沟通记录
- 被辞退时要求书面说明理由

**谈薪前准备：**
1. 调研市场价：Boss直聘、脉脉、看准网查同岗位薪资
2. 明确自己的底线和期望
3. 准备支撑材料：过往项目成果、其他offer（如有）

**谈薪话术模板：**
> "感谢公司的认可。根据我调研的市场行情，这个岗位的市场价位在X-Y之间。结合我的项目经验和技能匹配度，期望薪资是Z。当然，我也看重公司的平台和成长空间，如果薪资方面有一定弹性，我们可以再聊聊。"

**注意事项：**
- 问清薪资结构：基本工资+绩效+补贴+年终奖
- 确认五险一金缴纳基数
- 年终奖/绩效的发放规则
- 是否有期权/股权

**面试前必做：**
1. 研究公司：产品、竞品、行业地位、近期新闻
2. 复盘简历：每个项目都要能展开讲5分钟
3. 准备案例：用STAR法则（情境-任务-行动-结果）

**高频问题准备：**
- "自我介绍" → 1-2分钟，突出与岗位匹配的经历
- "为什么选择我们公司" → 体现诚意和了解
- "你的优缺点" → 缺点要真诚+改进措施
- "期望薪资" → 提前调研，给出区间

**反问环节必问：**
- 团队规模和架构
- 岗位的核心考核指标
- 培养机制和晋升通道

**五险（社会保险）：**
- **养老保险**：个人缴纳8%，公司缴纳16%。退休后按月领取养老金，累计缴满15年可享受。
- **医疗保险**：个人缴纳2%，公司缴纳8-10%。看病就医可报销，个人账户可用于药店购药。
- **失业保险**：个人缴纳0.5%，公司缴纳0.5-1%。非本人意愿失业可领取失业金。
- **工伤保险**：公司全额缴纳。工作中受伤、职业病可享受工伤待遇。
- **生育保险**：公司全额缴纳。生育时可领取生育津贴，报销生育医疗费。

**一金（住房公积金）：**
- 个人和公司各缴纳5-12%。可用于购房贷款、租房提取、装修等。

## 缴费基数怎么算？

缴费基数一般是你的**上年度月平均工资**，但有上下限：
- 下限：当地社会平均工资的60%
- 上限：当地社会平均工资的300%

**⚠️ 避坑提醒**：有些公司按最低基数缴纳，这样你的社保待遇会大打折扣！

## 官方权威来源

- [高校毕业生，请收下这份入职攻略 - 中国就业网](https://chinajob.mohrss.gov.cn/h5/c/2026-06-11/555978.shtml)
- [高校毕业生，请收下这份入职攻略 - 新华网](http://www.hn.xinhuanet.com/20260610/0813a82b89e14b34a75ea913b19021af/c.html)`,tags:["基础概念","社保"]},{id:"si-2",title:"试用期也要缴五险一金吗？",summary:"答案是肯定的，这是法律规定的",content:`## 试用期必须缴纳五险一金

根据《社会保险法》和《住房公积金管理条例》：

**劳动关系建立之日起30日内**，用人单位必须为员工办理社保登记。

也就是说：
- 入职第一天起，公司就应该为你缴纳五险一金
- **试用期不是免责期**！
- 如果公司说"转正后补缴"，这是不合法的

## 公司不缴怎么办？

1. **先沟通**：向HR说明法律规定，要求补缴
2. **保留证据**：保存劳动合同、工资条、考勤记录
3. **投诉渠道**：
   - 社保：拨打12333或到当地社保局投诉
   - 公积金：到当地住房公积金管理中心投诉
4. **法律途径**：劳动仲裁

## 补缴计算

如果公司未缴，你可以要求：
- 补缴应缴未缴的社保费用
- 赔偿因未缴社保导致的损失（如无法报销的医疗费）

## 官方权威来源

- [试用期可以不签劳动合同、不缴社保?教你避坑 - 人社部](https://www.mohrss.gov.cn/wap/xw/rsxw/202204/t20220406_442562.html)
- [@毕业生，从求职到入职，这份避坑指南请收好 - 新华网](https://app.xinhuanet.com/news/article.html?articleId=2284c2d5-b21d-4b5c-aa3c-e93baf4dc29e)
- [提醒应聘者!10大就业陷阱，一定要当心 - 新华网](http://www.xinhuanet.com/forum/topic/zhuanti/20188/iframe_1847_m.html)`,tags:["试用期","维权"]},{id:"si-3",title:"公积金怎么用最划算？",summary:"买房、租房、装修都能用，别让它躺着睡大觉",content:`## 公积金的N种用法

### 1. 购房贷款（最划算）
- 利率远低于商业贷款（目前约2.85% vs 4%以上）
- 最高可贷额度各地不同（一般60-120万）
- 可贷额度与账户余额和缴存年限挂钩

### 2. 租房提取
- 无房职工可提取公积金支付房租
- 一般每年可提一次，额度各地不同
- 线上即可办理，非常方便

### 3. 装修/翻修
- 大修自有住房可提取
- 需提供装修合同和发票

### 4. 离职提取
- 非本地户籍离职满6个月可全额提取
- 本地户籍需退休或完全丧失劳动能力

## 小 tips

- 公积金缴存比例越高越好（相当于强制储蓄+免税）
- 换城市工作可办理转移接续
- 公积金贷款有次数限制，首次使用最划算

## 官方权威来源

- [人社政策待遇"看得懂算得清" - 人社部](https://www.mohrss.gov.cn/SYrlzyhshbzb/rdzt/rszcdykddsdq/)
- [中华人民共和国劳动争议调解仲裁法 - 人社部](https://www.mohrss.gov.cn/SYrlzyhshbzb/ztzl/ldrszytjzc/fgzc/202207/t20220714_457857.html)`,tags:["公积金","理财"]}]},{id:"labor-contract",title:"劳动合同",icon:"FileText",description:"签合同前必看的避坑指南",articles:[{id:"lc-1",title:"劳动合同必须包含哪些条款？",summary:"9大必备条款，缺一条都可能是坑",content:`## 劳动合同9大必备条款

根据《劳动合同法》第17条，劳动合同必须包含：

1. **用人单位信息**：名称、住所、法定代表人
2. **劳动者信息**：姓名、住址、身份证号
3. **合同期限**：固定期限/无固定期限/完成一定工作任务
4. **工作内容和工作地点**：岗位名称、工作职责、工作地点
5. **工作时间和休息休假**：标准工时/综合工时/不定时
6. **劳动报酬**：工资数额、支付方式、支付时间
7. **社会保险**：五险一金的缴纳约定
8. **劳动保护**：工作条件、防护措施
9. **其他**：法律规定的其他事项

## 常见陷阱

❌ **空白合同**：让你先签字，公司后填内容
❌ **阴阳合同**：一份给公司，一份给员工，内容不一致
❌ ** missing 关键条款**：如工作地点写"全国"、工资只写基本工资

## 签约前 checklist

- [ ] 合同主体与offer一致
- [ ] 岗位名称、薪资明确
- [ ] 工作地点具体（不接受"全国"）
- [ ] 试用期条款符合法律规定
- [ ] 违约金条款合理

## 官方权威来源

- [中华人民共和国劳动合同法 - 人力资源和社会保障部](https://www.mohrss.gov.cn/xxgk2020/fdzdgknr/zcfg/fl/202011/t20201102_394622.html)
- [高校毕业生，请收下这份入职攻略 - 人社部](https://www.mohrss.gov.cn/SYrlzyhshbzb/dongtaixinwen/buneiyaowen/rsxw/202606/t20260610_578047.html)
- [高校毕业生，请收下这份入职攻略 - 新华网](http://www.hn.xinhuanet.com/20260610/0813a82b89e14b34a75ea913b19021af/c.html)`,tags:["合同","法律"]},{id:"lc-2",title:"竞业协议签不签？",summary:"签了可能会限制你未来2年的就业选择",content:`## 什么是竞业限制？

竞业限制是指：离职后一定期限内（不超过2年），不能到与原单位有竞争关系的企业工作，也不能自己经营同类业务。

## 谁能签竞业协议？

根据法律规定，竞业限制只适用于：
- 高级管理人员
- 高级技术人员
- 其他负有保密义务的人员

**普通岗位一般不需要签！**

## 签了有什么好处？

公司必须按月支付**竞业补偿金**（一般为离职前工资的30-50%）。

## 不签会怎样？

如果公司强制要求签：
- 可以协商不签（如果你是普通岗位）
- 如果必须签，确保补偿金条款明确

## 违约后果

如果签了又违约：
- 需支付违约金（可能高达年薪的数倍）
- 公司可能要求继续履行竞业义务

## 建议

- 普通岗位：争取不签
- 核心技术岗：确认补偿金标准，评估对未来发展的影响
- 仔细审阅竞业范围（不能太宽泛）

## 官方权威来源

- [中华人民共和国劳动合同法 - 人力资源和社会保障部](https://www.mohrss.gov.cn/xxgk2020/fdzdgknr/zcfg/fl/202011/t20201102_394622.html)
- [@毕业生，从求职到入职，这份避坑指南请收好 - 新华网](https://app.xinhuanet.com/news/article.html?articleId=2284c2d5-b21d-4b5c-aa3c-e93baf4dc29e)`,tags:["竞业","合同"]}]},{id:"probation",title:"试用期",icon:"Clock",description:"试用期权益和转正攻略",articles:[{id:"pb-1",title:"试用期的法律规定",summary:"试用期长度、工资、社保都有明确规定",content:`## 试用期法定上限

| 合同期限 | 试用期上限 |
|---------|-----------|
| 3个月-1年 | 1个月 |
| 1年-3年 | 2个月 |
| 3年以上或无固定期限 | 6个月 |

**注意**：
- 同一用人单位与同一劳动者**只能约定一次**试用期
- 试用期包含在劳动合同期限内
- 单独签试用期合同是违法的

## 试用期工资

- 不得低于本单位相同岗位最低档工资的80%
- 不得低于劳动合同约定工资的80%
- 不得低于用人单位所在地最低工资标准

## 试用期社保

**必须缴纳！** 从入职第一天起就应缴纳五险一金。

## 试用期辞退

公司要证明你"不符合录用条件"才能辞退：
- 必须有明确的录用条件
- 必须提前告知你考核标准
- 必须有考核记录证明你不合格

如果无故辞退，可以要求：
- 赔偿金（2倍经济补偿金）
- 或要求恢复劳动关系

## 官方权威来源

- [中华人民共和国劳动合同法 - 人力资源和社会保障部](https://www.mohrss.gov.cn/xxgk2020/fdzdgknr/zcfg/fl/202011/t20201102_394622.html)
- [试用期可以不签劳动合同、不缴社保?教你避坑 - 人社部](https://www.mohrss.gov.cn/wap/xw/rsxw/202204/t20220406_442562.html)
- [社会新人初入职 试用期规定要知晓 - 中国就业网](https://chinajob.mohrss.gov.cn/h5/c/2021-07-19/315592.shtml)
- [高校毕业生，请收下这份入职攻略 - 人社部](https://www.mohrss.gov.cn/SYrlzyhshbzb/dongtaixinwen/buneiyaowen/rsxw/202606/t20260610_578047.html)`,tags:["试用期","法律"]}]},{id:"salary",title:"谈薪技巧",icon:"DollarSign",description:"如何优雅地谈出理想薪资",articles:[{id:"sal-1",title:"谈薪前要做哪些准备？",summary:"知己知彼，才能谈出好价钱",content:`## 谈薪前必做的3件事

### 1. 调研市场价
- Boss直聘、脉脉、看准网查同岗位薪资
- 关注行业报告（如脉脉人才报告）
- 询问学长学姐的真实薪资水平

### 2. 明确自己的价值
- 梳理过往项目成果和量化数据
- 准备2-3个其他offer（如有）
- 确定自己的底线和期望区间

### 3. 了解薪资结构
- 基本工资（固定部分）
- 绩效奖金（浮动部分）
- 年终奖（几个月？是否固定？）
- 股票/期权（如有）
- 补贴（餐补、交通补、通讯补等）

## 谈薪话术模板

> "感谢公司的认可。通过前期了解，这个岗位的市场价位在15-20K之间。结合我的项目经验和技能匹配度，我的期望薪资是18K。当然，我也非常看重公司的平台和成长机会，如果整体package有竞争力，我们可以再聊聊。"

## 注意事项

- 不要先亮底牌，让对方先报价
- 谈的是"年薪"不是"月薪"，要把年终奖算进去
- 五险一金缴纳基数也要问清
- 如果薪资达不到期望，可以争取其他福利（如培训、调薪周期）

## 官方权威来源

- [中华人民共和国劳动合同法 - 人力资源和社会保障部](https://www.mohrss.gov.cn/xxgk2020/fdzdgknr/zcfg/fl/202011/t20201102_394622.html)
- [高校毕业生，请收下这份入职攻略 - 人社部](https://www.mohrss.gov.cn/SYrlzyhshbzb/dongtaixinwen/buneiyaowen/rsxw/202606/t20260610_578047.html)`,tags:["谈薪","技巧"]}]},{id:"resign",title:"离职维权",icon:"AlertTriangle",description:"被辞退、想离职时如何保护自己",articles:[{id:"res-1",title:"被公司辞退怎么办？",summary:"先判断是合法辞退还是违法辞退",content:`## 先判断辞退类型

### 合法辞退（需支付经济补偿金）
- 不胜任工作，经培训或调岗后仍不胜任
- 客观情况发生重大变化（如部门撤销）
- 经济性裁员

**经济补偿金 = 工作年限 × 月工资**
- 工作满1年 = 1个月工资
- 满6个月不满1年 = 1个月工资
- 不满6个月 = 0.5个月工资

### 违法辞退（需支付赔偿金）
- 无理由辞退
- 试用期随意辞退
- 女员工孕期/产期/哺乳期辞退

**赔偿金 = 2 × 经济补偿金**

## 被辞退时的应对

1. **要求书面辞退通知**：口头辞退无效
2. **不要签"自愿离职"**：签了就拿不到补偿
3. **核对补偿金额**：按离职前12个月平均工资计算
4. **要求离职证明**：影响下一份工作需要
5. **社保转移**：确认公司办理社保减员

## 维权渠道

- 劳动监察大队投诉（快，但力度有限）
- 劳动仲裁（免费，一般45天内出结果）
- 法院诉讼（对仲裁结果不满时）

## 准备材料

- 劳动合同
- 工资流水/工资条
- 考勤记录
- 辞退通知（书面或录音）
- 工作成果/邮件往来

阴阳怪气版",content:'哇，这个薪资真的很有"竞争力"呢。我在招聘软件上搜了一下，同岗位普遍能给到20K左右。不过没关系，或许贵司的"企业文化"能补上这个差价吧？要不您再去和老板争取一下？'},{type:"据理力争版",content:"感谢offer。不过我提前做了市场调研，这个岗位在同行业的薪资范围是15-22K。您给的这个数，老实说不太有吸引力。我已经拿到了另一个offer，薪资更有诚意。如果您这边能匹配，我当然优先考虑贵司。"},{type:"直球怼人版",content:"感谢offer。但我直说了吧，这个薪资和市场价差距挺大的，和我的能力也不太匹配。找一个性价比高的人不难，但找一个真正能胜任的人值得多花点钱。希望贵司重新考虑一下这个预算。"}],"reject-offer":[{type:"阴阳怪气版",content:'感谢贵司的offer。不过仔细看了一下，薪资低于市场均值，工作时间却高于行业平均，这个"性价比"确实需要一些勇气才能接受。我就不耽误贵司了，祝早日找到愿意接受的人。'},{type:"据理力争版",content:"感谢贵司的认可。经过综合评估，我认为这个岗位的薪资水平和发展空间与我的预期差距较大。与其勉强接受后续再跳槽浪费双方时间，不如现在坦诚说明。感谢面试过程中的交流。"},{type:"直球怼人版",content:"感谢offer，但经过考虑我无法接受。坦白说，岗位描述和实际面试中透露的工作强度不匹配，薪资也没有体现出相应的诚意。我选择对自己负责，也希望贵司能找到真正合适的候选人。"}],"ask-for-leave":[{type:"阴阳怪气版",content:'领导，我今身体有点不舒服，需要请假一天去看医生。别担心，该做的工作已经安排好了，不会耽误进度。毕竟身体好了才能更好地"为团队创造价值"嘛。感谢理解。'},{type:"据理力争版",content:"领导，我今天因身体原因需要请假一天。手头XX项目的XX部分已完成，剩余工作已交接给XX同事。如无紧急情况，我明天正常上班。感谢批准。"},{type:"直球怼人版",content:"领导，我今天身体不舒服要请一天假。工作已经安排好了，不会影响项目。生病请假是正常权利，希望不要有什么误解。有急事电话联系即可。"}],overtime:[{type:"阴阳怪气版",content:"领导，这个活儿明天上午做绰绰有余，今晚加班属实有点形式主义了。效率不是靠堆时间证明的，而且 Studies 也证明过疲劳工作产出反而更低。明天我保证高质量交付，今晚就先放我一马吧。"},{type:"据理力争版",content:"领导，我评估了一下这个任务，明天上午可以完成并提交。今晚因为个人安排无法加班。如果项目确实有紧急情况，请明确哪些部分最优先，我明天第一优先处理。"},{type:"直球怼人版",content:"领导，这个任务明天上午就能搞定，没必要今晚加班。长期靠加班赶进度是不可持续的，合理安排时间线才是正道。明天我按时交付，今晚就不留了。"}],resign:[{type:"阴阳怪气版",content:'领导，经过这段时间的"深入体验"，我发现公司的实际方向和当初面试时描述的有一定差距。与其继续互相内耗，不如趁早体面分开。我会把交接做得漂漂亮亮的，这点职业素养还是有的。'},{type:"据理力争版",content:"领导，经过慎重考虑，我决定于X月X日离职。我的职业规划方向与公司目前的业务重点有较大差异，继续下去对双方都不利。我会按法定要求提前30天通知，并完成全部交接工作。感谢这段时间的关照。"},{type:"直球怼人版",content:"领导，我决定离职了。直说原因：工作内容与面试时承诺的不一致，薪资也低于同行业水平。我不是来受委屈的，希望公司以后对候选人更诚实一些。交接我会认真完成，这是底线。"}],"follow-up":[{type:"阴阳怪气版",content:'您好，我是X月X日面试XX岗位的XX。想问一下面试结果，已经过去一周多了。如果贵司流程比较慢的话，我也能理解——毕竟"好饭不怕晚"嘛。但如果已经有了更合适的人选，也希望能给个明确回复，方便我安排后续。'},{type:"据理力争版",content:"您好，我是X月X日面试XX岗位的XX。距离面试已经一周，想跟进一下进度。我对这个岗位依然很感兴趣，如果需要补充任何材料请告知。如已有其他候选人，也希望能给个明确的反馈，方便我安排后续求职计划。"},{type:"直球怼人版",content:"您好，我是X月X日面试XX岗位的XX。已经一周了没有收到任何反馈，不知道目前是什么情况？如果面试未通过，请直接告知即可，我能接受。但一直不回复确实不太好，希望大家都能尊重彼此的时间。"}],"ask-question":[{type:"阴阳怪气版",content:'领导，XX需求文档里有几个地方写得比较"抽象"，如果按我的理解直接做的话，返工概率大概80%以上。与其到时候互相说"这不是我要的"，不如现在花10分钟对齐一下？磨刀不误砍柴工嘛。'},{type:"据理力争版",content:"领导，XX项目需求中有几个关键点需要确认，如果不确定就开工，后续返工成本会很高。建议我们花10分钟快速对齐一下需求细节。您看今天什么时候方便？"},{type:"直球怼人版",content:"领导，XX项目需求里有些地方不清晰，直接做大概率要返工。上次就是因为需求没对齐导致返工了两天，希望这次能先明确再动手。您看什么时候方便花几分钟过一下？"}],apologize:[{type:"阴阳怪气版",content:"领导，今天的错误确实是我的问题，已经修正了。不过话说回来，这个数据源的格式和上一版完全不一样，如果有人提前通知一下格式变更，可能就不会出这个问题了。建议后续格式调整时同步通知相关人员，这样大家都省心。"},{type:"据理力争版",content:"领导，今天报告中的错误我已修正并重新提交。问题出在我遗漏了交叉验证，后续我会增加自查环节。另外，如果数据模板能统一规范一下，出错概率会大大降低。我会整理一份注意事项文档供参考。"},{type:"直球怼人版",content:"领导，报告的错误已经改了。是我的疏忽，不推脱。但也想提一下，这次的临时加的需求导致时间很紧，这才是出错的根本原因。希望以后能尽量给够时间，质量才更有保障。"}]};return n[e]||n["negotiate-salary"]},Ua={"negotiate-salary":{versions:[{type:"温和版",content:"您好，非常感谢公司的认可。在正式回复之前，我想和您沟通一下薪资方面的事情。通过我对市场行情的了解，以及综合考虑我的经验和技能匹配度，期望的薪资范围是18-20K。不知道公司在这方面是否还有一定的讨论空间？"},{type:"直接版",content:"感谢您的offer。我对这个岗位很有兴趣，但薪资与我的期望有一定差距。基于市场调研和个人能力评估，我的期望薪资是20K。如果公司能匹配这个期望，我可以尽快确认入职。"},{type:"专业版",content:"感谢您和团队对我的认可。在接受offer前，我想就薪酬 package 进行一次坦诚的沟通。通过对比同行业同岗位的薪酬数据（15-22K区间），并结合我的项目经验和技能栈，我认为20K是一个合理的期望。同时，我也希望了解公司的绩效考核机制和调薪周期，以便做全面的评估。"}],tips:["谈薪时先让对方出价，不要先亮底牌","用市场数据支撑你的期望，更有说服力","如果薪资无法调整，可以尝试争取其他福利（如培训、调薪周期）","保持礼貌但坚定的态度，避免显得过于急切"]},"reject-offer":{versions:[{type:"温和版",content:"非常感谢贵公司给予我这次机会，团队和岗位都让我印象深刻。经过慎重考虑，由于个人职业规划方向的调整，我不得不遗憾地放弃这个offer。希望未来还有合作的机会，祝团队一切顺利！"},{type:"直接版",content:"感谢贵公司的offer。经过认真考虑，我认为这个岗位与我的职业发展方向不太匹配，所以无法接受。感谢面试过程中各位的时间，祝招聘顺利。"},{type:"专业版",content:"非常感谢贵公司的认可和offer。经过对岗位内容、团队架构和个人职业发展路径的综合评估，我目前更适合其他方向的机会。再次感谢贵司在招聘过程中付出的时间和精力，期待未来可能的合作。"}],tips:["拒绝时不要拖太久，尽早告知对方，给对方时间继续招聘","态度真诚但不解释太多原因，避免对方追问","即使拒绝也可以保持良好关系，圈子很小",'如果对方是你想去的公司，可以表达"希望未来有机会合作"']},"ask-for-leave":{versions:[{type:"温和版",content:"领导好，我最近身体有些不舒服，想去医院检查一下，想请本周五请一天病假。手头的工作我会在周四下班前做好交接，不会影响项目进度。给您添麻烦了，感谢理解。"},{type:"直接版",content:"领导，我这周五需要请一天病假去医院。目前手头的XX项目已完成XX部分，剩余部分已和XX同事交接好了，不会影响进度。"},{type:"专业版",content:"领导您好，因身体原因需在本周五（X月X日）请假一天。现将工作安排汇报如下：1）XX项目当前进度及后续计划已整理在文档中；2）紧急事项已委托XX同事代为处理；3）如有重要问题可电话联系我。感谢批准。"}],tips:["请假要提前说，不要临时才通知","一定要交代清楚工作交接","病假不需要太多细节，但事假要说明原因","如果是急事，事后第一时间补请假流程"]},overtime:{versions:[{type:"温和版",content:"领导，我理解项目时间比较紧。不过我今晚已经有一些个人安排了，这个任务我明天一早优先处理，预计上午下班前能完成，您看可以吗？"},{type:"直接版",content:"领导，这个任务我明天上午可以完成，但今晚我确实有其他安排无法加班。如果有非常紧急的部分，请告诉我，我优先处理。"},{type:"专业版",content:"领导，关于这个需求，我评估了一下工作量，明天上午可以完成并提交。今晚因个人安排无法加班，但我会确保明天按时交付。如果项目有其他紧急需求，我们可以一起梳理优先级，确保关键节点不受影响。"}],tips:['不要直接说"不加"，而是给出替代方案（明天完成）',"如果是偶尔加班，适当配合也没关系","如果长期加班，要找合适时机和领导沟通工作量","保留加班的证据，维护自己的权益"]},resign:{versions:[{type:"温和版",content:"领导，想找个时间和您聊一下。经过这段时间的思考，我决定接下来 pursue 一个新的职业方向，计划在下个月底离职。这段时间我会做好所有工作的交接，确保团队不会受影响。感谢您一直以来的指导和照顾。"},{type:"直接版",content:"领导，我计划在下个月底离职，这是我的正式通知。接下来我会配合完成所有交接工作，包括文档整理和知识转移。感谢这段时间的栽培。"},{type:"专业版",content:"领导您好，经过慎重考虑，我决定于X月X日正式离职，现按规定提前30天通知。我已开始整理负责的项目文档和交接清单，会在离职前完成全部交接工作。感谢公司这段时间的培养和信任，祝愿团队未来发展越来越好。"}],tips:["提前30天书面通知是法定义务","不要在微信/口头说，要有书面记录","离职前做好完整的交接文档","不要在离职时和同事撕破脸，保持专业态度"]},"follow-up":{versions:[{type:"温和版",content:"您好，我是X月X日参加XX岗位面试的XX。非常感谢面试当天的交流，让我对团队和业务有了更深入的了解。想了解一下目前的面试进展，如果需要我补充任何材料，请随时告知。期待您的回复！"},{type:"直接版",content:"您好，我是XX岗位的候选人XX，X月X日完成了面试。想跟进一下面试结果和后续流程，请问目前有进展吗？"},{type:"专业版",content:"您好，我是XX，X月X日参加了贵司XX岗位的面试。非常感谢面试官的时间，交流中对贵司的产品方向和技术架构印象很深。想跟进一下目前的招聘进度，如果需要我补充任何信息或完成其他流程，请随时联系。再次感谢。"}],tips:["面试后3-5天是跟进的合适时间","跟进一次即可，不要反复催","跟进时可以再次表达对岗位的兴趣","如果被拒，可以礼貌回复表示理解，留个好印象"]},"ask-question":{versions:[{type:"温和版",content:"领导，关于XX项目有个问题想请教您。我看到需求文档里提到XX功能，但技术实现上可能需要更多时间评估。您看我们是不是可以约个时间简单碰一下？"},{type:"直接版",content:"领导，关于XX项目的需求有几个地方想确认一下：1）XX功能优先级是否可以调整？2）XX时间节点是否可以延后一周？方便的话我们今天对齐一下。"},{type:"专业版",content:"领导，在推进XX项目的过程中，我发现以下几个问题需要确认：1）需求中XX模块的边界范围；2）第三方接口的对接时间线；3）测试资源的安排。建议我们开一个简短的会对齐，避免后续返工。您看什么时候方便？"}],tips:["提问前先自己思考过，不要什么问题都问","最好一次把相关问题集中问完","给出你自己的初步建议，而不是只抛问题","如果是跨部门的问题，建议拉个会当面沟通"]},apologize:{versions:[{type:"温和版",content:"领导，关于今天XX报告中的那个错误，真的非常抱歉。我已经重新核对并修正了数据，修改后的版本已发到群里。后续我会增加一道自查环节，确保类似问题不再发生。给您添麻烦了。"},{type:"直接版",content:"领导，今天XX报告出现了数据错误，我的失误。已修正并重新发送。我会增加检查流程避免再犯。"},{type:"专业版",content
