<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阳台种植助手</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- 顶部导航 -->
  <nav class="top-nav" id="topNav">
    <div class="nav-inner">
      <a href="#home" class="nav-logo">
        <span class="nav-logo-icon">🌱</span>
        <span class="nav-logo-text">阳台种植助手</span>
      </a>
      <div class="nav-links">
        <a href="#home" class="nav-link active" data-nav="home">植物库</a>
        <a href="#garden" class="nav-link" data-nav="garden">我的花园</a>
        <a href="#reminders" class="nav-link nav-reminder-link" data-nav="reminders">
          提醒
          <span class="nav-badge" id="reminderBadge" style="display:none">0</span>
        </a>
        <a href="#about" class="nav-link" data-nav="about">关于</a>
      </div>
    </div>
  </nav>

  <!-- 主内容区 -->
  <main class="main-content" id="mainContent">
    <!-- JS 动态渲染 -->
  </main>

  <!-- 底部导航（移动端） -->
  <nav class="bottom-nav" id="bottomNav">
    <a href="#home" class="bottom-nav-item active" data-nav="home">
      <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>植物库</span>
    </a>
    <a href="#garden" class="bottom-nav-item" data-nav="garden">
      <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span>花园</span>
    </a>
    <a href="#reminders" class="bottom-nav-item" data-nav="reminders">
      <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span>提醒</span>
    </a>
    <a href="#about" class="bottom-nav-item" data-nav="about">
      <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      <span>关于</span>
    </a>
  </nav>

  <!-- Toast 容器 -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- 图片预览模态框 -->
  <div class="modal-overlay" id="imageModal" style="display:none">
    <div class="modal-image-content">
      <button class="modal-close" onclick="closeImageModal()">&times;</button>
      <img id="modalImage" src="" alt="预览图片">
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
