<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>🧠 情绪人格解码器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            background: linear-gradient(160deg, #faf0ea 0%, #f0ded4 100%);
            padding: 16px 12px 40px;
        }
        .app { max-width: 420px; margin: 0 auto; }

        .header { text-align: center; padding: 16px 0 6px; }
        .header .icon { font-size: 40px; display: block; }
        .header h1 { font-size: 24px; font-weight: 700; color: #3d2c2a; letter-spacing: 1px; margin-top: 2px; }
        .header .sub { color: #a0847e; font-size: 13px; margin-top: 2px; letter-spacing: 2px; }

        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 24px 20px;
            margin-top: 14px;
            box-shadow: 0 8px 40px rgba(120, 80, 70, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* 引导语 */
        .intro-text {
            text-align: center;
            font-size: 14px;
            color: #7a5f5a;
            line-height: 1.8;
            padding: 0 4px 16px;
            border-bottom: 1px solid #f0e8e4;
            margin-bottom: 16px;
        }
        .intro-text strong { color: #3d2c2a; }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #f0e8e4;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #f0b8a0, #e09880);
            border-radius: 4px;
            transition: width 0.5s ease;
            width: 0%;
        }
        .question-counter {
            text-align: center;
            font-size: 13px;
            color: #a0847e;
            margin-bottom: 16px;
        }
        .question-text {
            font-size: 19px;
            font-weight: 600;
            color: #3d2c2a;
            line-height: 1.6;
            margin-bottom: 20px;
            min-height: 56px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-btn {
            padding: 14px 18px;
            border-radius: 16px;
            border: 2px solid #f0e8e4;
            background: white;
            font-size: 15px;
            color: #3d2c2a;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
            text-align: left;
            line-height: 1.4;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            position: relative;
        }
        .option-btn:active { transform: scale(0.97); }
        .option-btn:hover { border-color: #d4b8ae; background: #fcf6f3; }
        .option-btn.selected {
            border-color: #e09880;
            background: #fdf0ea;
            box-shadow: 0 0 0 3px rgba(224, 152, 128, 0.15);
        }
        .option-btn .label {
            font-weight: 600;
            color: #c4a8a0;
            margin-right: 8px;
        }
        .option-btn .check-mark {
            display: none;
            margin-left: 8px;
            color: #e09880;
        }
        .option-btn.selected .check-mark {
            display: inline;
        }
        .option-btn.disabled {
            pointer-events: none;
        }

        .result-card {
            display: none;
            animation: fadeUp 0.6s ease;
        }
        .result-card.show { display: block; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-badge {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.10);
        }
        .result-name {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            color: #3d2c2a;
        }
        .result-sub {
            text-align: center;
            font-size: 18px;
            color: #a0847e;
            margin-top: 2px;
        }
        .result-tag {
            text-align: center;
            font-size: 14px;
            color: #7a5f5a;
            background: #f5edea;
            padding: 4px 16px;
            border-radius: 20px;
            display: inline-block;
            margin: 8px auto 12px;
        }
        .result-desc {
            font-size: 15px;
            line-height: 1.8;
            color: #4d3a36;
            padding: 12px 0;
            border-top: 1px solid #f0e8e4;
            margin-top: 12px;
        }
        .result-detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 12px 0;
        }
        .result-detail-grid .item {
            background: #f8f2ee;
            border-radius: 12px;
            padding: 10px 12px;
            text-align: center;
            font-size: 13px;
            color: #5a403c;
        }
        .result-detail-grid .item strong { display: block; font-size: 15px; color: #3d2c2a; margin-bottom: 2px; }

        .result-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .result-actions button {
            padding: 12px 28px;
            border-radius: 30px;
            border: none;
            font-size: 15px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
            transition: all 0.2s;
            flex: 1;
            min-width: 100px;
        }
        .result-actions .btn-primary {
            background: #3d2c2a;
            color: white;
        }
        .result-actions .btn-primary:active { transform: scale(0.96); }
        .result-actions .btn-share {
            background: #e09880;
            color: white;
        }
        .result-actions .btn-share:active { transform: scale(0.96); }
        .result-actions .btn-outline {
            background: transparent;
            color: #7a5f5a;
            border: 1.5px solid #e0d4ce;
        }
        .result-actions .btn-outline:active { transform: scale(0.96); }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #c4b0aa;
            letter-spacing: 1px;
        }
        .btn-restart {
            background: none;
            border: none;
            color: #a0847e;
            font-size: 14px;
            cursor: pointer;
            font-family: inherit;
            text-decoration: underline;
            margin-top: 8px;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #3d2c2a;
            color: white;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            z-index: 999;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .center { text-align: center; }
        .hidden { display: none !important; }
        .mt-8 { margin-top: 8px; }

        /* 复盘弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: white;
            border-radius: 28px;
            max-width: 400px;
            width: 100%;
            padding: 28px 24px;
            max-height: 90vh;
            overflow-y: auto;
            animation: fadeUp 0.3s ease;
        }
        .modal-box h3 {
            font-size: 20px;
            color: #3d2c2a;
            text-align: center;
            margin-bottom: 4px;
        }
        .modal-box .modal-sub {
            text-align: center;
            color: #a0847e;
            font-size: 13px;
            margin-bottom: 16px;
        }
        .dimension-bar {
            margin-bottom: 12px;
        }
        .dimension-bar .dim-label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #4d3a36;
            margin-bottom: 3px;
        }
        .dimension-bar .dim-track {
            width: 100%;
            height: 8px;
            background: #f0e8e4;
            border-radius: 8px;
            overflow: hidden;
        }
        .dimension-bar .dim-fill {
            height: 100%;
            border-radius: 8px;
            transition: width 1s ease;
            width: 0%;
        }
        .modal-box .modal-explain {
            background: #f8f2ee;
            border-radius: 16px;
            padding: 14px 16px;
            font-size: 14px;
            line-height: 1.7;
            color: #4d3a36;
            margin-top: 12px;
        }
        .modal-box .modal-close-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 30px;
            background: #3d2c2a;
            color: white;
            font-size: 15px;
            cursor: pointer;
            font-family: inherit;
            margin-top: 16px;
        }
        .modal-box .modal-close-btn:active { transform: scale(0.97); }

        @media (max-width: 400px) {
            .card { padding: 18px 14px; }
            .question-text { font-size: 17px; }
            .option-btn { font-size: 14px; padding: 12px 14px; }
            .modal-box { padding: 20px 16px; }
        }
    </style>
</head>
<body>

<div class="app" id="app">

                <button class="btn-share" id="shareResultBtn">📤 分享结果</button>
            </div>
            <div class="result-actions" style="margin-top:8px;">
                <button class="btn-primary" id="restartBtn">🔄 重新测试</button>
            </div>
            <button class="btn-restart" id="historyBtn">📖 查看历史记录</button>
        </div>
    </div>

    <div class="footer">💛 每一个情绪都值得被看见 · Made with TRAE</div>
</div>

<!-- 复盘弹窗 -->
<div class="modal-overlay" id="analyzeModal">

        <div class="modal-sub">你的情绪运作方式 · 4个维度得分</div>

        <div class="modal-explain" id="modalExplain"></div>

    </div>
</div>

<div class="toast" id="toast"></div>

        color: '#A29BFE', bg: '#F2F0FA',
        desc: '白天属于世界，深夜属于自己。你有独特的审美和感受力，浪漫又忧郁，像月亮一样——远看很美，近看有坑，但那就是你。',
        details: { perceive: '高敏感', express: '内收型', recover: '独处型', reappraise: '分析型' }
    },
    mountain: {
        id: 'mountain', emoji: '⛰️', name: '山系', sub: '定海神针', symbol: '🪨 大石头',
        color: '#B8957A', bg: '#F5F0EB',
        desc: '全慌了就你没慌。你是朋友的最后一道防线，情绪稳得像山。有时候别人觉得你太冷淡，但你只是——不需要用情绪解决所有问题。',
        details: { perceive: '低敏感', express: '稳定型', recover: '独处型', reappraise: '接纳型' }
    }
};

// ---------- 计算逻辑 ----------
function calculateType(scores) {
    const p = scores.perceive || 3, e = scores.express || 3, r = scores.recover || 3, re = scores.reappraise || 3;
    if (p >= 4 && e >= 4 && re <= 2) return 'fire';
    if (p >= 4 && e <= 2 && re <= 2) return 'water';
    if (p >= 2 && p <= 4 && e <= 3 && r >= 4 && re >= 4) return 'grass';
    if (p <= 3 && e >= 4 && r >= 4 && re >= 4) return 'light';
    if (p >= 4 && e <= 2 && r >= 2 && r <= 4) return 'moon';
    if (p <= 3 && e >= 2 && e <= 4 && r >= 4) return 'mountain';
    const maxDim = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
    if (maxDim === 'perceive' || maxDim === 'express') return 'fire';
    if (maxDim === 'reappraise') return 'grass';
    if (maxDim === 'recover') return 'mountain';
    return 'light';
}

function getDimensionLabel(dim) {
    const map = {
        perceive: '情绪感知力',
        express: '情绪表达倾向',
        recover: '情绪恢复策略',
        reappraise: '认知重评倾向'
    };
    return map[dim] || dim;
}

function getDimensionDesc(dim, score) {
    const maxScore = 50;
    const pct = Math.round((score / maxScore) * 100);
    if (pct >= 70) {
        const map = {
            perceive: '你对情绪信号非常敏感，能捕捉到细微变化',
            express: '你倾向于把情绪表达出来，藏不住',
            recover: '你需要通过社交或倾诉来恢复能量',
            reappraise: '你会主动调整看待事情的角度，善于转念'
        };
        return map[dim] || '';
    } else if (pct >= 40) {
        const map = {
            perceive: '你能感知情绪，但不至于被淹没',
            express: '你会在适当的时候表达情绪',
            recover: '你既需要独处也需要社交来恢复',
            reappraise: '你有时会转念，有时会陷进去'
        };
        return map[dim] || '';
    } else {
        const map = {
            perceive: '你对情绪不太敏感，更关注事实和行动',
            express: '你倾向于把情绪收起来，不太外露',
            recover: '你主要通过独处来恢复能量',
            reappraise: '你倾向于接受情绪本身，不太分析为什么'
        };
        return map[dim] || '';
    }
}

// ---------- DOM ----------
const questionText = document.getElementById('questionText');
const optionsContainer = document.getElementById('optionsContainer');
const counter = document.getElementById('counter');
const progressFill = document.getElementById('progressFill');
const questionArea = document.getElementById('questionArea');
const resultCard = document.getElementById('resultCard');
const toast = document.getElementById('toast');
const introText = document.getElementById('introText');

let currentQuestion = 0, answers = [], resultType = null, isAnswering = false;
let lastScores = null;

function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(window.toastTimer);
    window.toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

function renderQuestion(index) {
    const q = QUESTIONS[index];
    if (!q) return;
    questionText.textContent = q.text;
    counter.textContent = `第 ${index + 1} / ${QUESTIONS.length} 题`;
    progressFill.style.width = `${(index / QUESTIONS.length) * 100}%`;
    optionsContainer.innerHTML = '';
    const labels = ['A', 'B', 'C', 'D'];
    q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="label">${labels[i]}.</span> ${opt.text}<span class="check-mark"> ✅</span>`;
        btn.dataset.optIndex = i;
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            selectOption(index, i);
        });
        optionsContainer.appendChild(btn);
    });
    isAnswering = false;
    // 隐藏引导语（第一次答题后）
    if (index > 0) introText.style.display = 'none';
}

function selectOption(qIndex, optIndex) {
    if (isAnswering) return;
    isAnswering = true;
    const q = QUESTIONS[qIndex];
    if (!q) { isAnswering = false; return; }
    answers[qIndex] = q.options[optIndex].scores;
    const btns = optionsContainer.querySelectorAll('.option-btn');
    btns.forEach((b, i) => {
        b.classList.toggle('selected', i === optIndex);
        b.classList.add('disabled');
    });
    setTimeout(() => {
        if (qIndex < QUESTIONS.length - 1) {
            currentQuestion = qIndex + 1;
            renderQuestion(currentQuestion);
        } else {
            showResult();
        }
        isAnswering = false;
    }, 400);
}

function showResult() {
    const total = { perceive: 0, express: 0, recover: 0, reappraise: 0 };
    let answeredCount = 0;
    answers.forEach(a => {
        if (a) {
            total.perceive += a.perceive || 0;
            total.express += a.express || 0;
            total.recover += a.recover || 0;
            total.reappraise += a.reappraise || 0;
            answeredCount++;
        }
    });
    if (answeredCount < QUESTIONS.length) {
        for (let i = 0; i < QUESTIONS.length; i++) {
            if (!answers[i]) {
                answers[i] = { perceive: 3, express: 3, recover: 3, reappraise: 3 };
                total.perceive += 3; total.express += 3; total.recover += 3; total.reappraise += 3;
            }
        }
    }
    lastScores = { ...total };
    const typeId = calculateType(total);
    resultType = typeId;
    const type = TYPES[typeId] || TYPES.light;
    fillResult(type);
    saveHistory(typeId);
    questionArea.classList.add('hidden');
    resultCard.classList.add('show');
    progressFill.style.width = '100%';
    counter.textContent = '🎉 测试完成！';
    setTimeout(() => resultCard.scrollIntoView({ behavior: 'smooth', block: 'center' }), 150);
}

function fillResult(type) {
    document.getElementById('resultEmoji').textContent = type.emoji;
    document.getElementById('resultEmoji').style.background = type.bg || '#f5f0eb';
    document.getElementById('resultName').textContent = type.name;
    document.getElementById('resultSub').textContent = type.sub;
    document.getElementById('resultSymbol').textContent = type.symbol;
    document.getElementById('resultDesc').textContent = type.desc;
    const grid = document.getElementById('resultGrid');
    grid.innerHTML = `
        <div class="item"><strong>情绪感知</strong>${type.details.perceive}</div>
        <div class="item"><strong>表达倾向</strong>${type.details.express}</div>
        <div class="item"><strong>恢复策略</strong>${type.details.recover}</div>
        <div class="item"><strong>重评倾向</strong>${type.details.reappraise}</div>
    `;
}

// ---------- 复盘功能 ----------
document.getElementById('analyzeBtn').addEventListener('click', function() {
    if (!lastScores) { showToast('请先完成测试'); return; }
    const modal = document.getElementById('analyzeModal');
    const container = document.getElementById('modalDimensions');
    const explain = document.getElementById('modalExplain');
    const total = lastScores;
    const maxScore = 50;

    const dims = ['perceive', 'express', 'recover', 'reappraise'];
    const colors = ['#FF6B6B', '#4A8FBE', '#6BCB77', '#FFB347'];
    let html = '';
    dims.forEach((d, i) => {
        const val = total[d] || 0;
        const pct = Math.min(Math.round((val / maxScore) * 100), 100);
        const label = getDimensionLabel(d);
        const desc = getDimensionDesc(d, val);
        html += `
            <div class="dimension-bar">
                <div class="dim-label"><span>${label}</span><span>${pct}%</span></div>
                <div class="dim-track"><div class="dim-fill" style="width:${pct}%;background:${colors[i]};"></div></div>
                <div style="font-size:12px;color:#a0847e;margin-top:2px;">${desc}</div>
            </div>
        `;
    });
    container.innerHTML = html;

    const type = TYPES[resultType];
    explain.innerHTML = `
        <strong>🔍 综合判定：</strong>你的情绪模式属于 <strong>${type.emoji} ${type.name}</strong>。<br>
        ${type.desc}
    `;
    modal.classList.add('show');
});

document.getElementById('modalCloseBtn').addEventListener('click', function() {
    document.getElementById('analyzeModal').classList.remove('show');
});
document.getElementById('analyzeModal').addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('show');
});

// ---------- 历史记录 ----------
function saveHistory(typeId) {
    try {
        const history = JSON.parse(localStorage.getItem('emotion_history') || '[]');
        history.unshift({ typeId, date: new Date().toLocaleString('zh-CN', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }) });
        if (history.length > 20) history.pop();
        localStorage.setItem('emotion_history', JSON.stringify(history));
    } catch (e) {}
}

document.getElementById('restartBtn').addEventListener('click', function() {
    currentQuestion = 0; answers = []; resultType = null; isAnswering = false; lastScores = null;
    questionArea.classList.remove('hidden');
    resultCard.classList.remove('show');
    introText.style.display = 'block';
    renderQuestion(0);
    window.scrollTo({ top: 0, behavior: 'smooth' });
});

document.getElementById('shareResultBtn').addEventListener('click', function() {
    if (!resultType) { showToast('请先完成测试'); return; }
    const t = TYPES[resultType];
    if (!t) { showToast('请先完成测试'); return; }
    const text = `🧠 我的情绪人格是 ${t.emoji} ${t.name}（${t.sub}）${t.symbol}\n「${t.desc}」\n你是哪个系？来测测看！\n#情绪人格解码器 #TRAE创造力大赛`;
    if (navigator.share) {
        navigator.share({ title: '我的情绪人格', text }).catch(() => {});
    } else {
        navigator.clipboard.writeText(text).then(() => showToast('📋 文案已复制，快去分享吧'))
            .catch(() => showToast('📋 ' + text));
    }
});

document.getElementById('historyBtn').addEventListener('click', function() {
    let history = [];
    try { history = JSON.parse(localStorage.getItem('emotion_history') || '[]'); } catch (e) {}
    if (history.length === 0) { showToast('还没有历史记录，快测一次吧'); return; }
    const lines = history.slice(0, 10).map((h, i) => {
        const t = TYPES[h.typeId];
        return `${i+1}. ${t ? t.emoji + t.name : '未知'}  ${h.date}`;
    }).join('\n');
    alert('📖 我的情绪人格历史：\n\n' + lines + '\n\n（共 ' + history.length + ' 次记录）');
});

renderQuestion(0);
</script>
