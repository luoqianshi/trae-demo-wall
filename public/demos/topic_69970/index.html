<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KernelLens - Linux 内核源码智能查询助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0d1117;
    --bg-secondary: #161b22;
    --bg-tertiary: #21262d;
    --border: #30363d;
    --text: #c9d1d9;
    --text-secondary: #8b949e;
    --text-muted: #484f58;
    --accent: #58a6ff;
    --accent-soft: #1f6feb;
    --accent-dim: rgba(88, 166, 255, 0.15);
    --success: #3fb950;
    --warning: #d29922;
    --danger: #f85149;
    --code-bg: #161b22;
    --code-border: #30363d;
    --keyword: #ff7b72;
    --function: #d2a8ff;
    --string: #a5d6ff;
    --comment: #8b949e;
    --number: #79c0ff;
    --type: #ffa657;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  header {
    height: 56px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 16px;
    flex-shrink: 0;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
  }
  .logo-icon {
    width: 28px; height: 28px;
    background: linear-gradient(135deg, var(--accent-soft), var(--accent));
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: #fff;
  }
  .search-box {
    flex: 1;
    max-width: 560px;
    position: relative;
  }
  .search-box input {
    width: 100%;
    height: 36px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0 36px 0 12px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-box input:focus {
    border-color: var(--accent);
  }
  .search-box input::placeholder {
    color: var(--text-muted);
  }
  .search-clear {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: var(--text-muted);
    font-size: 16px;
    display: none;
  }
  .search-clear.visible { display: block; }
  .header-tag {
    font-size: 12px;
    color: var(--text-secondary);
    background: var(--bg-tertiary);
    padding: 4px 10px;
    border-radius: 12px;
    border: 1px solid var(--border);
    white-space: nowrap;
  }

  /* Layout */
  .container {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Sidebar */
  aside {
    width: 280px;
    background: var(--bg-secondary);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    flex-shrink: 0;
    padding: 16px 0;
  }
  .sidebar-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-secondary);
    padding: 0 16px 8px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 16px 7px 20px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-secondary);
    transition: all 0.15s;
    border-left: 2px solid transparent;
    user-select: none;
  }
  .nav-item:hover {
    background: var(--bg-tertiary);
    color: var(--text);
  }
  .nav-item.active {
    background: var(--accent-dim);
    color: var(--accent);
    border-left-color: var(--accent);
  }
  .nav-item .arrow {
    font-size: 10px;
    transition: transform 0.2s;
    width: 12px;
    text-align: center;
  }
  .nav-item.expanded .arrow {
    transform: rotate(90deg);
  }
  .nav-icon {
    font-size: 14px;
    width: 18px;
    text-align: center;
  }
  .nav-children {
    display: none;
  }
  .nav-children.open {
    display: block;
  }
  .nav-child {
    padding: 6px 16px 6px 48px;
    cursor: pointer;
    font-size: 12px;
    color: var(--text-muted);
    transition: all 0.15s;
    border-left: 2px solid transparent;
  }
  .nav-child:hover {
    color: var(--text);
    background: var(--bg-tertiary);
  }
  .nav-child.active {
    color: var(--accent);
    background: var(--accent-dim);
    border-left-color: var(--accent);
  }

  /* Main Content */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 24px 32px;
  }
  .welcome {
    max-width: 720px;
  }
  .welcome h1 {
    font-size: 28px;
    font-weight: 600;
    margin-bottom: 8px;
    background: linear-gradient(90deg, var(--accent), var(--success));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .welcome p.desc {
    color: var(--text-secondary);
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 24px;
  }
  .stat-cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }
  .stat-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
  }
  .stat-card .num {
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
    font-family: "JetBrains Mono", monospace;
  }
  .stat-card .label {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 4px;
  }
  .section-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin: 24px 0 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .hot-questions {
    display: grid;
    gap: 8px;
  }
  .hot-q {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .hot-q:hover {
    border-color: var(--accent);
    background: var(--accent-dim);
  }
  .hot-q-text {
    font-size: 13px;
    color: var(--text);
  }
  .hot-q-tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--bg-tertiary);
    color: var(--text-secondary);
    white-space: nowrap;
  }

  /* Search Results */
  .results-header {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 16px;
  }
  .result-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .result-card:hover {
    border-color: var(--accent);
  }
  .result-card .q-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 6px;
  }
  .result-card .q-meta {
    display: flex;
    gap: 12px;
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 10px;
  }
  .result-card .q-meta span {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .result-card .q-summary {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.5;
  }
  .subsystem-badge {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--accent-dim);
    color: var(--accent);
    font-weight: 500;
  }

  /* Detail View */
  .detail-view {
    max-width: 860px;
  }
  .detail-view .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--accent);
    cursor: pointer;
    margin-bottom: 16px;
    padding: 4px 0;
  }
  .detail-view .back-btn:hover {
    text-decoration: underline;
  }
  .detail-view h2 {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 16px;
    line-height: 1.4;
  }
  .detail-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
  }
  .detail-meta .meta-tag {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 6px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    color: var(--text-secondary);
  }
  .detail-section {
    margin-bottom: 24px;
  }
  .detail-section h3 {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .detail-section p, .detail-section li {
    font-size: 14px;
    line-height: 1.8;
    color: var(--text-secondary);
  }
  .detail-section ul {
    padding-left: 20px;
  }
  .detail-section li {
    margin-bottom: 4px;
  }

  /* Code Block */
  .code-block {
    background: var(--code-bg);
    border: 1px solid var(--code-border);
    border-radius: 8px;
    overflow: hidden;
    margin: 12px 0;
  }
  .code-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    background: var(--bg-tertiary);
    border-bottom: 1px solid var(--code-border);
    font-size: 12px;
    color: var(--text-secondary);
  }
  .code-header .filename {
    font-family: "JetBrains Mono", monospace;
  }
  .code-body {
    padding: 12px 14px;
    overflow-x: auto;
    font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.7;
  }
  .code-line {
    display: flex;
    gap: 12px;
    padding: 0 4px;
    border-radius: 3px;
  }
  .code-line.highlight {
    background: rgba(217, 119, 50, 0.15);
  }
  .line-num {
    color: var(--text-muted);
    min-width: 28px;
    text-align: right;
    user-select: none;
    font-size: 12px;
  }
  .line-content {
    color: var(--text);
    white-space: pre;
  }
  .line-content .kw { color: var(--keyword); }
  .line-content .fn { color: var(--function); }
  .line-content .str { color: var(--string); }
  .line-content .cm { color: var(--comment); }
  .line-content .num { color: var(--number); }
  .line-content .tp { color: var(--type); }
  .code-annotation {
    background: var(--bg-tertiary);
    border-top: 1px solid var(--code-border);
    padding: 10px 14px;
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.6;
  }
  .code-annotation strong {
    color: var(--warning);
  }

  /* Call Chain */
  .call-chain {
    display: flex;
    flex-direction: column;
    gap: 0;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    margin: 10px 0;
  }
  .chain-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
    font-family: "JetBrains Mono", monospace;
    font-size: 13px;
  }
  .chain-item .fn-name {
    color: var(--function);
    font-weight: 500;
  }
  .chain-item .fn-file {
    color: var(--text-muted);
    font-size: 11px;
  }
  .chain-arrow {
    color: var(--text-muted);
    font-size: 12px;
    padding-left: 4px;
  }

  /* Subsystem Detail */
  .subsys-detail h2 {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .subsys-detail .subsys-desc {
    color: var(--text-secondary);
    font-size: 14px;
    line-height: 1.7;
    margin-bottom: 20px;
  }
  .key-files {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 10px 0 16px;
  }
  .key-file {
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    padding: 4px 10px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-secondary);
  }
  .key-concepts {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 10px 0;
  }
  .key-concept {
    font-size: 12px;
    padding: 4px 10px;
    background: var(--accent-dim);
    border-radius: 6px;
    color: var(--accent);
    font-weight: 500;
  }

  /* Key Files Table */
  .files-table {
    width: 100%;
    border-collapse: collapse;
    margin: 10px 0;
    font-size: 13px;
  }
  .files-table th, .files-table td {
    text-align: left;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
  }
  .files-table th {
    color: var(--text-secondary);
    font-weight: 500;
    font-size: 12px;
    background: var(--bg-tertiary);
  }
  .files-table td {
    color: var(--text);
  }
  .files-table td:first-child {
    font-family: "JetBrains Mono", monospace;
    color: var(--accent);
    font-size: 12px;
  }
  .files-table tr:hover td {
    background: var(--bg-tertiary);
  }

  /* Empty State */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  .empty-state .icon {
    font-size: 48px;
    margin-bottom: 16px;
  }
  .empty-state h3 {
    font-size: 16px;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }
  .empty-state p {
    font-size: 13px;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

  /* Responsive */
  @media (max-width: 768px) {
    aside { display: none; }
    .stat-cards { grid-template-columns: 1fr; }
    main { padding: 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">KL</div>
    <span>KernelLens</span>
  </div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜索内核问题，如：进程调度、内存分配、TCP握手..." autocomplete="off">
    <span class="search-clear" id="searchClear">&times;</span>
  </div>
  <div class="header-tag">Linux Kernel 6.x</div>
</header>

<div class="container">
  <aside id="sidebar">
    <div class="sidebar-title">内核子系统</div>
    <div id="navTree"></div>
  </aside>

  <main id="mainContent">
    <div class="welcome" id="welcomeView">
      <h1>KernelLens</h1>
      <p class="desc">Linux 内核源码智能查询助手 —— 面向内核开发者、驱动工程师和系统 SRE，快速定位源码问题，理解内核机制。</p>
      <div class="stat-cards">
        <div class="stat-card">
          <div class="num">12</div>
          <div class="label">精选问题案例</div>
        </div>
        <div class="stat-card">
          <div class="num">8</div>
          <div class="label">核心子系统</div>
        </div>
        <div class="stat-card">
          <div class="num">30M+</div>
          <div class="label">行源码覆盖</div>
        </div>
      </div>
      <div class="section-title">热门问题</div>
      <div class="hot-questions" id="hotQuestions"></div>
    </div>

    <div class="detail-view" id="detailView" style="display:none;"></div>
    <div id="searchResults" style="display:none;"></div>
    <div class="subsys-detail" id="subsysView" style="display:none;"></div>
  </main>
</div>

<script>
// ===================== 知识库数据 =====================
const KB = {
  subsystems: [
    {
      id: 'process', name: '进程管理', icon: '⚙️',
      desc: '负责进程的创建、调度、销毁以及 CPU 时间片的分配。核心包括进程描述符 task_struct、调度器（CFS/RT/BPF）、fork/exec 机制、命名空间与 CGroup。',
      keyFiles: [
        { path: 'kernel/sched/core.c', desc: '调度器核心入口' },
        { path: 'kernel/fork.c', desc: '进程创建 fork/clone' },
        { path: 'kernel/exit.c', desc: '进程退出与资源回收' },
        { path: 'kernel/cgroup/cgroup.c', desc: 'CGroup 控制组' }
      ],
      keyConcepts: ['task_struct', 'CFS', 'need_resched', 'context_switch', 'namespace']
    },
    {
      id: 'memory', name: '内存管理', icon: '🧠',
      desc: '管理物理内存与虚拟地址空间的映射、页面分配与回收、SLAB/SLUB 对象缓存、页缓存与 swap 机制。',
      keyFiles: [
        { path: 'mm/page_alloc.c', desc: '伙伴系统页面分配' },
        { path: 'mm/slub.c', desc: 'SLUB 对象分配器' },
        { path: 'mm/vmscan.c', desc: '页面回收 (kswapd)' },
        { path: 'mm/memory.c', desc: '缺页异常处理' }
      ],
      keyConcepts: ['page', 'slab', 'vm_area_struct', 'pgtable', 'kswapd']
    },
    {
      id: 'fs', name: '文件系统', icon: '📁',
      desc: '提供统一的文件访问接口，包含 VFS 虚拟层、具体文件系统实现（ext4/xfs）、页缓存、目录缓存与文件映射。',
      keyFiles: [
        { path: 'fs/open.c', desc: '文件打开/创建' },
        { path: 'fs/namei.c', desc: '路径名解析' },
        { path: 'fs/ext4/', desc: 'ext4 文件系统' },
        { path: 'fs/vfs/', desc: 'VFS 通用层' }
      ],
      keyConcepts: ['inode', 'dentry', 'super_block', 'page_cache', 'VFS']
    },
    {
      id: 'block', name: '块设备与 I/O', icon: '💾',
      desc: '块设备抽象、I/O 调度器、请求队列管理、多队列块层（blk-mq）以及 DMA 与直接 I/O 支持。',
      keyFiles: [
        { path: 'block/blk-core.c', desc: '块设备核心' },
        { path: 'block/blk-mq.c', desc: '多队列块层' },
        { path: 'drivers/scsi/', desc: 'SCSI 驱动框架' }
      ],
      keyConcepts: ['request_queue', 'bio', 'blk-mq', 'I/O scheduler']
    },
    {
      id: 'net', name: '网络子系统', icon: '🌐',
      desc: '网络协议栈实现，包含 socket 层、TCP/IP 协议、网卡驱动接口、netfilter 框架、eBPF 网络程序以及 XDP 快速数据路径。',
      keyFiles: [
        { path: 'net/ipv4/tcp_input.c', desc: 'TCP 输入处理' },
        { path: 'net/ipv4/tcp_output.c', desc: 'TCP 输出处理' },
        { path: 'net/core/sock.c', desc: 'socket 通用层' },
        { path: 'kernel/bpf/', desc: 'eBPF 虚拟机' }
      ],
      keyConcepts: ['sk_buff', 'tcp_sock', 'netfilter', 'eBPF', 'XDP']
    },
    {
      id: 'driver', name: '设备驱动', icon: '🔌',
      desc: '内核与硬件交互的桥梁，包含设备模型（bus/device/driver）、平台驱动、PCI/USB 总线、电源管理与热插拔。',
      keyFiles: [
        { path: 'drivers/base/driver.c', desc: '驱动注册核心' },
        { path: 'drivers/base/platform.c', desc: '平台设备驱动' },
        { path: 'drivers/pci/', desc: 'PCI 总线驱动' }
      ],
      keyConcepts: ['device', 'driver', 'bus_type', 'devtmpfs', 'platform_device']
    },
    {
      id: 'irq', name: '中断与时钟', icon: '⏰',
      desc: '硬件中断分发、软中断（softirq）、tasklet、工作队列（workqueue）以及高精度时钟（hrtimer）与 tick 调度。',
      keyFiles: [
        { path: 'kernel/irq/irqdesc.c', desc: 'IRQ 描述符管理' },
        { path: 'kernel/softirq.c', desc: '软中断子系统' },
        { path: 'kernel/time/hrtimer.c', desc: '高精度定时器' }
      ],
      keyConcepts: ['IRQ', 'softirq', 'tasklet', 'workqueue', 'hrtimer']
    },
    {
      id: 'security', name: '安全子系统', icon: '🔒',
      desc: '内核安全机制，包含 LSM 安全框架、SELinux/AppArmor、 capabilities、seccomp 与密钥管理。',
      keyFiles: [
        { path: 'security/selinux/', desc: 'SELinux 实现' },
        { path: 'security/lsm/', desc: 'LSM 框架 Hook' },

// ===================== 渲染逻辑 =====================
const $ = id => document.getElementById(id);
let currentView = 'welcome';
let searchQuery = '';

function renderNav() {
  const container = $('navTree');
  container.innerHTML = '';
  KB.subsystems.forEach(sys => {
    const item = document.createElement('div');
    item.className = 'nav-item';
    item.dataset.id = sys.id;
    item.innerHTML = `<span class="arrow">▶</span><span class="nav-icon">${sys.icon}</span><span>${sys.name}</span>`;
    item.onclick = (e) => {
      e.stopPropagation();
      toggleNav(sys.id);
    };
    container.appendChild(item);

    const children = document.createElement('div');
    children.className = 'nav-children';
    children.id = `nav-children-${sys.id}`;
    const related = KB.qa.filter(q => q.subsystem === sys.id);
    related.forEach(q => {
      const child = document.createElement('div');
      child.className = 'nav-child';
      child.textContent = q.question.length > 22 ? q.question.slice(0, 22) + '...' : q.question;
      child.onclick = () => showDetail(q.id);
      children.appendChild(child);
    });
    container.appendChild(children);
  });
}

function toggleNav(id) {
  const item = document.querySelector(`.nav-item[data-id="${id}"]`);
  const children = $(`nav-children-${id}`);
  const isOpen = children.classList.contains('open');
  document.querySelectorAll('.nav-children').forEach(c => c.classList.remove('open'));
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('expanded'));
  if (!isOpen) {
    children.classList.add('open');
    item.classList.add('expanded');
    showSubsystem(id);
  }
}

function renderHotQuestions() {
  const container = $('hotQuestions');
  const hot = KB.qa.slice(0, 6);
  container.innerHTML = hot.map(q => {
    const sys = KB.subsystems.find(s => s.id === q.subsystem);
    return `<div class="hot-q" onclick="showDetail('${q.id}')">
      <span class="hot-q-text">${q.question}</span>
      <span class="hot-q-tag">${sys ? sys.name : ''}</span>
    </div>`;
  }).join('');
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function highlightCode(code) {
  return escapeHtml(code)
    .replace(/\b(void|int|long|struct|static|if|else|while|for|return|union|enum|const|goto|break|continue|switch|case|default|sizeof|typeof|inline|__always_inline|asmlinkage|__visible|__init|__sched)\b/g, '<span class="kw">$1</span>')
    .replace(/\b([a-zA-Z_][a-zA-Z0-9_]*)\s*\(/g, '<span class="fn">$1</span>(')
    .replace(/"[^"]*"/g, '<span class="str">$&</span>')
    .replace(/'[^']*'/g, '<span class="str">$&</span>')
    .replace(/\b\d+\b/g, '<span class="num">$&</span>')
    .replace(/\/\/.*$/gm, '<span class="cm">$&</span>')
    .replace(/\/\*[\s\S]*?\*\//g, '<span class="cm">$&</span>');
}

function showDetail(qid) {
  const q = KB.qa.find(x => x.id === qid);
  if (!q) return;
  const sys = KB.subsystems.find(s => s.id === q.subsystem);

  $('welcomeView').style.display = 'none';
  $('searchResults').style.display = 'none';
  $('subsysView').style.display = 'none';
  $('detailView').style.display = 'block';
  currentView = 'detail';

  const a = q.answer;
  const codeHtml = a.codeSnippet.map((line, idx) => {
    const isHigh = a.highlight.includes(line.num);
    return `<div class="code-line ${isHigh ? 'highlight' : ''}">
      <span class="line-num">${line.num}</span>
      <span class="line-content">${highlightCode(line.text)}</span>
    </div>`;
  }).join('');

  const chainHtml = a.callChain.map((step, i) => `
    <div class="chain-item">
      <span class="fn-name">${escapeHtml(step.fn)}</span>
      <span class="fn-file">${escapeHtml(step.file)}</span>
      ${i < a.callChain.length - 1 ? '<span class="chain-arrow">↓</span>' : ''}
    </div>
  `).join('');

  const keyFilesHtml = a.keyFiles.map(f => `<span class="key-file">${escapeHtml(f)}</span>`).join('');

  $('detailView').innerHTML = `
    <div class="back-btn" onclick="goBack()">← 返回</div>
    <h2>${escapeHtml(q.question)}</h2>
    <div class="detail-meta">
      <span class="meta-tag" style="color:var(--accent);border-color:var(--accent)">${sys ? sys.name : ''}</span>
      <span class="meta-tag">${a.keyFunctions.length} 个关键函数</span>
      <span class="meta-tag">${a.keyFiles.length} 个源文件</span>
    </div>
    <div class="detail-section">
      <h3>答案概要</h3>
      <p style="color:var(--text);font-size:14px;line-height:1.8;">${escapeHtml(q.summary)}</p>
    </div>
    <div class="detail-section">
      <h3>详细解答</h3>
      ${a.paragraphs.map(p => `<p>${escapeHtml(p)}</p>`).join('')}
    </div>
    <div class="detail-section">
      <h3>关键源文件</h3>
      <div class="key-files">${keyFilesHtml}</div>
    </div>
    <div class="detail-section">
      <h3>调用链路</h3>
      <div class="call-chain">${chainHtml}</div>
    </div>
    <div class="detail-section">
      <h3>源码片段</h3>
      <div class="code-block">
        <div class="code-header">
          <span class="filename">${escapeHtml(a.keyFiles[0])}</span>
          <span>Linux Kernel 6.x</span>
        </div>
        <div class="code-body">${codeHtml}</div>
        <div class="code-annotation"><strong>关键行解读：</strong>${escapeHtml(a.annotation)}</div>
      </div>
    </div>
  `;
}

function showSubsystem(sid) {
  const sys = KB.subsystems.find(s => s.id === sid);
  if (!sys) return;

  $('welcomeView').style.display = 'none';
  $('searchResults').style.display = 'none';
  $('detailView').style.display = 'none';
  $('subsysView').style.display = 'block';
  currentView = 'subsys';

  const related = KB.qa.filter(q => q.subsystem === sid);
  const conceptsHtml = sys.keyConcepts.map(c => `<span class="key-concept">${escapeHtml(c)}</span>`).join('');
  const filesTable = sys.keyFiles.map(f => `
    <tr><td>${escapeHtml(f.path)}</td><td>${escapeHtml(f.desc)}</td></tr>
  `).join('');

  $('subsysView').innerHTML = `
    <div class="back-btn" onclick="goBack()">← 返回首页</div>
    <h2><span style="font-size:28px">${sys.icon}</span> ${escapeHtml(sys.name)}</h2>
    <p class="subsys-desc">${escapeHtml(sys.desc)}</p>
    <div class="detail-section">
      <h3>核心概念</h3>
      <div class="key-concepts">${conceptsHtml}</div>
    </div>
    <div class="detail-section">
      <h3>关键源文件</h3>
      <table class="files-table">
        <tr><th>文件路径</th><th>说明</th></tr>
        ${filesTable}
      </table>
    </div>
    <div class="detail-section">
      <h3>相关问题 (${related.length})</h3>
      <div class="hot-questions" style="margin-top:8px">
        ${related.map(q => `
          <div class="hot-q" onclick="showDetail('${q.id}')">
            <span class="hot-q-text">${escapeHtml(q.question)}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function goBack() {
  $('detailView').style.display = 'none';
  $('subsysView').style.display = 'none';
  $('searchResults').style.display = 'none';
  $('welcomeView').style.display = 'block';
  currentView = 'welcome';
  if (searchQuery) {
    $('searchInput').value = '';
    searchQuery = '';
    $('searchClear').classList.remove('visible');
  }
}

function doSearch(query) {
  query = query.trim().toLowerCase();
  searchQuery = query;
  if (!query) {
    goBack();
    return;
  }
  $('searchClear').classList.add('visible');
  $('welcomeView').style.display = 'none';
  $('detailView').style.display = 'none';
  $('subsysView').style.display = 'none';
  $('searchResults').style.display = 'block';
  currentView = 'search';

  const results = KB.qa.filter(q => {
    return q.question.toLowerCase().includes(query) ||
      q.keywords.some(k => k.toLowerCase().includes(query)) ||
      q.summary.toLowerCase().includes(query);
  });

  const sys = KB.subsystems.find(s => s.name.toLowerCase().includes(query) || s.id === query);

  let html = `<div class="results-header">找到 ${results.length} 个相关问题</div>`;
  if (results.length === 0) {
    html += `<div class="empty-state">
      <div class="icon">🔍</div>
      <h3>未找到匹配结果</h3>
      <p>尝试使用其他关键词，如 "调度器"、"TCP"、"内存分配" 等</p>
    </div>`;
  } else {
    html += results.map(q => {
      const s = KB.subsystems.find(x => x.id === q.subsystem);
      return `<div class="result-card" onclick="showDetail('${q.id}')">
        <div class="q-title">${escapeHtml(q.question)}</div>
        <div class="q-meta">
          <span><span style="color:var(--accent)">●</span> ${s ? s.name : ''}</span>
          <span>${q.answer.keyFunctions.length} 个函数</span>
          <span>${q.answer.keyFiles.length} 个文件</span>
        </div>
        <div class="q-summary">${escapeHtml(q.summary)}</div>
      </div>`;
    }).join('');
  }

  if (sys) {
    html += `<div class="results-header" style="margin-top:20px">匹配到子系统</div>
    <div class="result-card" onclick="showSubsystem('${sys.id}')">
      <div class="q-title">${sys.icon} ${sys.name}</div>
      <div class="q-summary">${sys.desc}</div>
    </div>`;
  }

  $('searchResults').innerHTML = html;
}

// ===================== 事件绑定 =====================
$('searchInput').addEventListener('input', e => {
  doSearch(e.target.value);
});

$('searchClear').addEventListener('click', () => {
  $('searchInput').value = '';
  goBack();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') goBack();
  if (e.key === '/' && document.activeElement !== $('searchInput')) {
    e.preventDefault();
    $('searchInput').focus();
  }
});

// ===================== 初始化 =====================
renderNav();
renderHotQuestions();
</script>

</html>
