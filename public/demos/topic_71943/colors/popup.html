<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ColorFlow v5</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="header-left">
      <div class="logo">🎨</div>
      <span class="title">ColorFlow</span>
      <span class="version">v5</span>
    </div>
  </div>

  <nav class="tabs">
    <button class="tab active" data-tab="theme">🎨 主题</button>
    <button class="tab" data-tab="extract">⚡ 提取</button>
    <button class="tab" data-tab="saved">💾 我的</button>
  </nav>

  <!-- ===== 主题面板 ===== -->
  <div class="tab-panel active" id="panelTheme">
    <div class="mode-bar">
      <button class="mode-btn active" data-mode="five" id="modeFive">五色模式</button>
      <button class="mode-btn" data-mode="three" id="modeThree">三色模式</button>
    </div>
    <div class="themes" id="themes"></div>
    <div class="colors" id="colors"></div>
    <div class="actions">
      <button class="btn btn-ghost" id="btnRandom">随机</button>
      <button class="btn btn-ghost" id="btnCopy">复制</button>
      <button class="btn btn-primary" id="btnApply">应用</button>
      <button class="btn btn-danger" id="btnRevert">撤销</button>
    </div>
    <div class="bridge-bar">
      <button class="btn btn-accent btn-full" id="btnFromExtract">⚡ 从提取生成主题</button>
    </div>
  </div>

  <!-- ===== 提取面板 ===== -->
  <div class="tab-panel" id="panelExtract">
    <div class="extract-intro">
      <p>结构化提取当前网页配色与图标</p>
      <p class="hint">输出标准 ExtractResult 数据</p>
    </div>
    <button class="btn btn-primary btn-full" id="btnExtract">开始提取</button>
    <div class="extract-result" id="extractResult" style="display:none">
      <!-- 颜色分类 -->
      <div class="section-title">🎨 提取颜色</div>
      <div class="color-entries" id="colorEntries"></div>
      <!-- 图标分类 -->
      <div class="section-title">🖼 提取图标</div>
      <div class="icon-entries" id="iconEntries"></div>
      <!-- 操作 -->
      <div class="actions">
        <button class="btn btn-accent" id="btnGenTheme">生成主题</button>
        <button class="btn btn-primary" id="btnSaveExtract">💾 保存提取</button>
      </div>
    </div>
  </div>

  <!-- ===== 我的主题面板 ===== -->
  <div class="tab-panel" id="panelSaved">
    <div class="saved-list" id="savedList">
      <div class="empty-state">暂无保存的提取结果<br><span class="hint">在「提取」面板中保存网站配色</span></div>
    </div>
  </div>

  <div class="status-bar" id="statusBar"></div>
  <div class="toast" id="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
