<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>古方·一帖 — 交互演示</title>
<style>
:root {
  --bg: #F5F0E8;
  --bg2: #EFE9DF;
  --ink: #3A3530;
  --muted: #8B7E70;
  --rule: #E5DDD3;
  --accent: #A67B5B;
  --accent2: #7BA88A;
  --accent3: #C4956A;
  --danger: #C75050;
  --gold: #C9A961;
  --white: #FFFFFF;
  --paper: #FBF6EC;
  --paper-edge: #F0E8D8;
  --envelope: #F3E9D8;
  --seal-red: #B83A3A;
  --warn: #D4A648;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  background: #E8E2D8;
  color: var(--ink);
  font-size: 15px;
  line-height: 1.7;
  overflow-x: hidden;
  min-height: 100vh;
}

/* ===== Page Title ===== */
.page-title {
  text-align: center;
  padding: 32px 20px 12px;
  font-size: 24px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: 4px;
  font-family: "KaiTi", "STKaiti", "楷体", serif;
}
.page-subtitle {
  text-align: center;
  padding: 0 20px 24px;
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 2px;
}

/* ===== Phone Frame ===== */
.phone-frame {
  width: 375px;
  height: 750px;
  margin: 0 auto 40px;
  background: var(--bg);
  border-radius: 40px;
  border: 6px solid #2A2520;
  overflow: hidden;
  position: relative;
  box-shadow: 0 24px 80px rgba(0,0,0,0.25), 0 4px 16px rgba(0,0,0,0.12), inset 0 0 0 2px rgba(255,255,255,0.08);
}
.phone-notch {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 126px;
  height: 30px;
  background: #2A2520;
  border-radius: 0 0 18px 18px;
  z-index: 1001;
}
.phone-notch::after {
  content: '';
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #3A3530;
}
.phone-inner {
  width: 100%;
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding-top: 44px;
  padding-bottom: 0;
}
.phone-inner::-webkit-scrollbar { display: none; }

/* ===== Top Bar ===== */
.top-bar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 44px;
  background: var(--bg);
  border-bottom: 1px solid var(--rule);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
.top-bar-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: 3px;
  font-family: "KaiTi", "STKaiti", "楷体", serif;
}

/* ===== Tab Nav ===== */
.tab-nav {
  display: flex;
  overflow-x: auto;
  background: var(--bg);
  border-bottom: 1px solid var(--rule);
  padding: 0 4px;
  position: sticky;
  top: 0;
  z-index: 100;
  -ms-overflow-style: none;
  scrollbar-width: none;
}
.tab-nav::-webkit-scrollbar { display:none; }
.tab-item {
  flex-shrink: 0;
  padding: 12px 18px;
  font-size: 14px;
  color: var(--muted);
  position: relative;
  cursor: pointer;
  transition: color 0.25s;
  white-space: nowrap;
  user-select: none;
}
.tab-item.active { color: var(--accent); font-weight: 600; }
.tab-item.active::after {
  content:'';position:absolute;bottom:0;left:18px;right:18px;height:3px;
  background:var(--accent);border-radius:3px 3px 0 0;
  animation: tabLine 0.3s ease;
}
@keyframes tabLine { from{transform:scaleX(0)} to{transform:scaleX(1)} }

/* ===== Panels ===== */
.panel { padding: 16px; display:none; animation: panelIn 0.35s ease; }
.panel.active { display:block; }
@keyframes panelIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

/* ===== Section Card ===== */
.section-card {
  background: var(--white);border-radius: 16px;padding: 20px 18px;margin-bottom: 14px;
  box-shadow: 0 2px 12px rgba(58,53,48,0.06);cursor:pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}
.section-card:active { transform: scale(0.98); box-shadow: 0 1px 6px rgba(58,53,48,0.08); }
.section-label { font-size:12px;color:var(--accent);font-weight:600;letter-spacing:2px;margin-bottom:10px; }
.quote-text { font-size:18px;color:var(--ink);line-height:1.6;font-weight:500;margin-bottom:8px;font-family:"KaiTi","STKaiti","楷体",serif;letter-spacing:1px; }
.quote-source { font-size:13px;color:var(--muted); }
.card-hint { font-size:12px;color:var(--accent);margin-top:12px;font-weight:500; }

/* ===== Mood Grid ===== */
.mood-section { margin-bottom: 18px; }
.section-title { font-size:16px;color:var(--ink);font-weight:600;margin-bottom:14px; }
.mood-grid { display:flex;flex-wrap:wrap;gap:10px; }
.mood-tag {
  padding:10px 20px;border-radius:28px;font-size:14px;color:var(--ink);
  background:var(--bg2);cursor:pointer;transition:all 0.25s;user-select:none;
  border: 1.5px solid transparent;
}
.mood-tag.selected { background:var(--accent);color:var(--white);border-color:var(--accent);box-shadow:0 2px 10px rgba(166,123,91,0.3); }

/* ===== Action Button ===== */
.action-btn {
  width:100%;height:50px;line-height:50px;text-align:center;border-radius:25px;
  font-size:16px;font-weight:600;background:var(--bg2);color:var(--muted);
  margin-bottom:14px;cursor:pointer;transition:all 0.3s;user-select:none;
  letter-spacing: 2px;
}
.action-btn.active { background:var(--accent);color:var(--white);box-shadow:0 4px 18px rgba(166,123,91,0.3); }
.action-btn:active { opacity:0.85;transform:scale(0.98); }

/* ===== Mirror Panel ===== */
.mirror-hero { text-align:center;padding:28px 0 20px; }
.mirror-title { font-size:24px;font-weight:700;color:var(--ink);margin-bottom:8px;font-family:"KaiTi","STKaiti","楷体",serif;letter-spacing:2px; }
.mirror-desc { font-size:14px;color:var(--muted); }
.mirror-input-wrap {
  background:var(--white);border-radius:16px;padding:18px;margin-bottom:18px;
  box-shadow:0 2px 12px rgba(58,53,48,0.06);
  border: 1.5px solid var(--rule);
  transition: border-color 0.2s;
}
.mirror-input-wrap:focus-within { border-color: var(--accent); }
.mirror-input {
  width:100%;min-height:80px;font-size:15px;line-height:1.6;color:var(--ink);
  border:none;outline:none;resize:none;font-family:inherit;background:transparent;
}
.mirror-input::placeholder { color: var(--muted); opacity: 0.7; }
.mirror-char-count { text-align:right;font-size:12px;color:var(--muted);margin-top:8px; }
.mirror-cat-label { font-size:13px;color:var(--muted);margin-bottom:10px; }
.mirror-cat-grid { display:flex;flex-wrap:wrap;gap:10px; }
.mirror-cat-tag {
  padding:8px 18px;border-radius:22px;font-size:13px;color:var(--ink);
  background:var(--bg2);cursor:pointer;transition:all 0.25s;user-select:none;
  border: 1.5px solid transparent;
}
.mirror-cat-tag.selected { background:var(--accent2);color:var(--white);border-color:var(--accent2); }

/* ===== Daily Panel ===== */
.daily-hero { display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding:8px 0; }
.daily-streak-badge { background:rgba(201,80,80,0.1);color:#C75050;font-size:12px;font-weight:600;padding:5px 14px;border-radius:18px;letter-spacing:1px; }
.daily-date { font-size:13px;color:var(--muted); }
.daily-card {
  background:var(--white);border-radius:18px;padding:32px 22px;margin-bottom:18px;
  box-shadow:0 2px 12px rgba(58,53,48,0.06);text-align:center;
  transition: transform 0.3s;
}
.daily-card.changing { transform: scale(0.96); opacity: 0.7; }
.daily-quote-mark { font-size:48px;color:var(--accent);opacity:0.2;margin-bottom:10px;line-height:1;font-family:Georgia,serif; }
.daily-quote-text { font-size:20px;color:var(--ink);line-height:1.7;font-weight:500;margin-bottom:14px;font-family:"KaiTi","STKaiti","楷体",serif;letter-spacing:1px; }
.daily-quote-source { font-size:13px;color:var(--muted);margin-bottom:4px; }
.daily-quote-dynasty { font-size:12px;color:var(--accent); }
.daily-quote-interp {
  font-size:13px;color:var(--muted);line-height:1.9;margin-top:18px;padding-top:18px;
  border-top:1px solid var(--rule);text-align:justify;
}
.daily-actions { text-align:center;margin-bottom:14px; }
.daily-change-btn {
  display:inline-block;padding:9px 32px;border-radius:22px;font-size:14px;
  color:var(--accent2);background:rgba(123,168,138,0.1);border:1px solid rgba(123,168,138,0.3);
  cursor:pointer;user-select:none;transition:all 0.2s;
}
.daily-change-btn:active { opacity:0.7;transform:scale(0.96); }
.checkin-btn {
  display:inline-block;padding:13px 52px;border-radius:25px;font-size:15px;font-weight:600;
  background:var(--accent);color:var(--white);box-shadow:0 4px 18px rgba(166,123,91,0.3);
  cursor:pointer;user-select:none;transition:all 0.2s;letter-spacing:2px;
}
.checkin-btn:active { transform:scale(0.96); }
.checkin-btn.checked { background:var(--bg2);color:var(--muted);box-shadow:none; }
.checkin-hint { font-size:12px;color:var(--muted);margin-top:12px;text-align:center; }
.daily-philosophy {
  text-align:center;font-size:12px;color:var(--muted);line-height:1.9;padding:14px 18px;
  background:var(--bg2);border-radius:14px;margin-top:18px;font-family:"KaiTi","STKaiti","楷体",serif;
}

/* ===== Calendar ===== */
.calendar-card { background:var(--white);border-radius:16px;padding:18px;margin-bottom:18px;box-shadow:0 2px 12px rgba(58,53,48,0.06); }
.calendar-header { display:flex;align-items:center;justify-content:space-between;margin-bottom:14px; }
.calendar-month { font-size:15px;font-weight:600;color:var(--ink); }
.calendar-streak { font-size:12px;color:var(--accent2);font-weight:500; }
.calendar-weekdays { display:flex;margin-bottom:8px; }
.cal-weekday { flex:1;text-align:center;font-size:11px;color:var(--muted);padding:5px 0; }
.calendar-grid { display:flex;flex-wrap:wrap; }
.cal-day {
  width:calc(100%/7);height:38px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;font-size:13px;color:var(--ink);position:relative;cursor:default;
}
.cal-day.empty { visibility:hidden; }
.cal-day.checked { color:var(--accent2);font-weight:600; }
.cal-day.checked::after {
  content:'';position:absolute;bottom:5px;width:6px;height:6px;border-radius:50%;
  background:var(--accent2);
}
.cal-day.today { background:var(--accent);color:var(--white);border-radius:10px;font-weight:700; }
.cal-day.today.checked { background:var(--accent2); }
.cal-day.today.checked::after { background:var(--white); }

/* ===== Story Panel ===== */
.story-hero { text-align:center;padding:20px 0 16px; }
.story-title-lg { font-size:22px;font-weight:700;color:var(--ink);margin-bottom:8px;font-family:"KaiTi","STKaiti","楷体",serif;letter-spacing:2px; }
.story-desc { font-size:13px;color:var(--muted); }
.story-list { margin-top:14px; }
.story-card {
  display:flex;background:var(--white);border-radius:16px;padding:18px;margin-bottom:14px;
  box-shadow:0 2px 12px rgba(58,53,48,0.06);cursor:pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}
.story-card:active { transform: scale(0.98); }
.story-card-thumb {
  width:56px;height:56px;margin-right:14px;flex-shrink:0;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-family:"KaiTi","STKaiti","楷体",serif;font-size:28px;font-weight:700;color:rgba(255,255,255,0.9);
}
.story-card-body { flex:1; }
.story-card-title { font-size:16px;font-weight:600;color:var(--ink);margin-bottom:4px; }
.story-card-source { font-size:12px;color:var(--accent);margin-bottom:6px; }
.story-card-summary { font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:8px; }
.story-card-scenes { font-size:11px;color:var(--accent2);font-weight:600; }

/* ===== Word Panel ===== */
.word-hero { text-align:center;padding:20px 0 16px; }
.word-title-lg { font-size:22px;font-weight:700;color:var(--ink);margin-bottom:8px;font-family:"KaiTi","STKaiti","楷体",serif;letter-spacing:2px; }
.word-desc { font-size:13px;color:var(--muted); }
.word-list { margin-top:14px; }
.word-card {
  background:var(--white);border-radius:16px;padding:18px;margin-bottom:14px;
  box-shadow:0 2px 12px rgba(58,53,48,0.06);cursor:pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}
.word-card:active { transform: scale(0.98); }
.word-card-header { display:flex;align-items:center;justify-content:space-between;margin-bottom:6px; }
.word-card-title { font-size:16px;font-weight:600;color:var(--ink); }
.word-card-dynasty { font-size:11px;color:var(--white);background:var(--accent);padding:3px 12px;border-radius:12px; }
.word-card-source { font-size:12px;color:var(--accent);margin-bottom:10px; }
.word-card-intro { font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:10px; }
.word-card-count { font-size:11px;color:var(--accent2);font-weight:600; }

/* ===== Sub-Pages (Modal Overlay) ===== */
.modal-page {
  position:absolute;top:0;left:0;right:0;bottom:0;background:var(--bg);
  z-index:901;display:none;flex-direction:column;
}
.modal-page.show { display:flex;animation:slideUp 0.3s cubic-bezier(0.22, 0.61, 0.36, 1); }
@keyframes slideUp { from{opacity:0;transform:translateY(40px)} to{opacity:1;transform:translateY(0)} }

/* Modal Nav */
.modal-nav {
  display:flex;align-items:center;padding:12px 16px;flex-shrink:0;
  border-bottom:1px solid var(--rule);background:var(--bg);
}
.modal-nav-back {
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:18px;color:var(--ink);border-radius:50%;
  transition:background 0.15s;
}
.modal-nav-back:active { background:var(--bg2); }
.modal-nav-title { flex:1;text-align:center;font-size:16px;font-weight:600;color:var(--ink);letter-spacing:1px; }
.modal-nav-placeholder { width:36px; }

/* Modal Content */
.modal-body { flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;padding-bottom:32px; }
.modal-body::-webkit-scrollbar { display:none; }

/* ===== Result Page ===== */
.result-quote-card {
  background:var(--white);border-radius:18px;padding:32px 24px;margin-bottom:18px;
  box-shadow:0 2px 12px rgba(58,53,48,0.06);text-align:center;
}
.result-quote-deco { font-size:36px;color:var(--accent);opacity:0.2;line-height:1;font-family:Georgia,serif; }
.result-quote-text { font-size:22px;color:var(--ink);line-height:1.7;font-weight:500;margin:10px 0;font-family:"KaiTi","STKaiti","楷体",serif;letter-spacing:1px; }
.result-quote-source { font-size:13px;color:var(--muted); }
.result-interp-card {
  background:var(--white);border-radius:16px;padding:20px 18px;margin-bottom:18px;
  box-shadow:0 2px 12px rgba(58,53,48,0.06);
}
.result-interp-label { font-size:12px;color:var(--accent);font-weight:600;letter-spacing:2px;margin-bottom:10px; }
.result-interp-text { font-size:14px;color:var(--ink);line-height:1.9; }
.result-person-card {
  background:var(--bg2);border-radius:16px;padding:20px 18px;margin-bottom:18px;
  border-left:4px solid var(--accent);
}
.result-person-name { font-size:17px;font-weight:600;color:var(--ink);font-family:"KaiTi","STKaiti","楷体",serif; }
.result-person-title { font-size:13px;color:var(--muted);margin-bottom:10px; }
.result-person-story { font-size:13px;color:var(--ink);line-height:1.9; }
.result-save-btn {
  display:block;width:100%;height:48px;line-height:48px;text-align:center;border-radius:24px;
  font-size:15px;font-weight:600;background:var(--accent);color:var(--white);
  box-shadow:0 4px 18px rgba(166,123,91,0.3);cursor:pointer;margin-bottom:12px;
  transition:all 0.2s;letter-spacing:2px;
}
.result-save-btn:active { transform:scale(0.98); }
.result-save-btn.saved { background:var(--accent2); }

/* ===== Mirror Result ===== */
.envelope {
  background:var(--envelope);border-radius:14px;padding:30px 22px;margin-bottom:18px;
  box-shadow:0 4px 20px rgba(58,53,48,0.1);border:1px solid var(--paper-edge);
  transform:rotate(-0.8deg);
}
.envelope-flap {
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:0;height:0;border-left:100px solid transparent;border-right:100px solid transparent;
  border-top:60px solid rgba(166,123,91,0.08);border-radius:14px 14px 0 0;
}
.envelope { position:relative;overflow:hidden; }
.envelope-label {
  display:inline-block;font-size:11px;color:var(--white);background:var(--accent);
  padding:4px 14px;border-radius:14px;letter-spacing:3px;margin-bottom:16px;
}
.envelope-question { font-size:18px;font-weight:600;color:var(--ink);line-height:1.6;margin-bottom:10px;font-family:"KaiTi","STKaiti","楷体",serif;letter-spacing:1px; }
.envelope-user { font-size:13px;color:var(--accent);font-family:"KaiTi","STKaiti","楷体",serif;margin-bottom:10px;font-style:italic; }
.envelope-date { font-size:11px;color:var(--muted);text-align:right; }

.postmark { display:flex;justify-content:center;padding:16px 0; }
.postmark-circle {
  width:64px;height:64px;border-radius:50%;border:2px dashed var(--accent);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transform:rotate(-12deg);opacity:0.7;
}
.postmark-line { font-size:10px;color:var(--accent);line-height:1.2;font-family:"KaiTi","STKaiti","楷体",serif; }
.postmark-line-mid { font-size:12px;font-weight:600; }

.letter {
  background:var(--paper);border-radius:12px;padding:30px 22px;margin-bottom:18px;
  box-shadow:0 6px 24px rgba(58,53,48,0.1);border:1px solid var(--paper-edge);
  position:relative;
  background-image: repeating-linear-gradient(0deg,transparent 0,transparent 29px,rgba(166,123,91,0.04) 29px,rgba(166,123,91,0.04) 30px),linear-gradient(180deg,#FFFEF7 0%,#FBF3E6 100%);
}
.letter::before {
  content:'';position:absolute;top:24px;left:14px;bottom:24px;width:3px;
  background:repeating-linear-gradient(180deg,var(--paper-edge) 0,var(--paper-edge) 5px,transparent 5px,transparent 28px);
  opacity:0.4;
}
.letter-header { display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;padding-left:14px; }
.person-name { font-size:24px;font-weight:700;color:var(--ink);font-family:"KaiTi","STKaiti","楷体",serif;letter-spacing:1px; }
.person-title-badge {
  font-size:10px;color:var(--accent);background:rgba(166,123,91,0.12);border:1px solid rgba(166,123,91,0.3);
  padding:3px 12px;border-radius:14px;margin-left:12px;
}
.dynasty-badge {
  font-size:12px;color:var(--white);background:var(--accent);padding:4px 14px;border-radius:8px;
  font-family:"KaiTi","STKaiti","楷体",serif;letter-spacing:1px;
}
.letter-greeting { font-size:15px;color:#4A4540;font-family:"KaiTi","STKaiti","楷体",serif;margin-bottom:24px;padding-left:14px;letter-spacing:1px; }
.letter-quote-wrap { display:flex;align-items:flex-start;padding:10px 14px 8px;margin-bottom:6px; }
.quote-mark { font-size:30px;color:var(--accent);font-weight:600;line-height:1;font-family:"KaiTi","STKaiti","楷体",serif; }
.letter-quote-text {
  flex:1;font-size:26px;font-weight:700;color:var(--ink);line-height:1.5;letter-spacing:2px;
  font-family:"KaiTi","STKaiti","楷体",serif;margin:0 3px;
}
.letter-quote-source { font-size:12px;color:var(--muted);text-align:right;padding-right:14px;margin-bottom:24px;font-family:"KaiTi","STKaiti","楷体",serif; }
.letter-divider { display:flex;align-items:center;justify-content:center;margin:0 14px 24px; }
.divider-line { flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--paper-edge) 20%,var(--paper-edge) 80%,transparent); }
.divider-dot { width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:0.5;margin:0 10px; }
.letter-body { font-size:15px;color:#4A4540;line-height:2.1;text-align:justify;text-indent:2em;padding:0 14px;font-family:"KaiTi","STKaiti","楷体",serif;letter-spacing:0.5px; }

/* Popup */
.popup-mask {

/* ===== Toast ===== */
.toast {
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);

var SCENARIOS = [
  {id:'s001',category:'职场',keywords:['辞职','换工作','跳槽','离职','不想干了','不想上班','工作累','想走','辞掉','裸辞','不干了'],question:'要不要辞职？',replyPerson:'陶渊明',personTitle:'隐逸诗人',replyQuote:'归去来兮，田园将芜胡不归？',replySource:'《归去来兮辞》',dynasty:'晋',replyBody:'你问我要不要辞职，我当年也面临过同样的选择。彭泽县令做了八十多天，我终于受不了为五斗米折腰，连夜辞官归家。你知道我辞官后过的什么日子吗？"晨兴理荒秽，带月荷锄归。"辛苦，但心里踏实。辞职不是逃避，是你终于听见了自己内心的声音。'},
  {id:'s002',category:'职场',keywords:['领导','批评','被骂','指责','委屈','被说','否定','不认可','被怼','挨骂'],question:'被领导批评了，很难受。',replyPerson:'刘禹锡',personTitle:'诗人',replyQuote:'沉舟侧畔千帆过，病树前头万木春。',replySource:'《酬乐天扬州初逢席上见赠》',dynasty:'唐',replyBody:'我被贬了二十三年，从朗州到连州，从夔州到和州。你以为我只被批评了一次吗？我被人从长安赶到偏远之地，一去就是半辈子。但你看我写的诗："沉舟侧畔千帆过，病树前头万木春。"我是那艘沉舟，但江面上的千帆照样过。'},
  {id:'s003',category:'人际',keywords:['孤独','没朋友','不合群','没人理解','寂寞','一个人','没人陪','孤立','被排挤'],question:'觉得自己很孤独，没人理解我。',replyPerson:'王维',personTitle:'山水诗人',replyQuote:'独坐幽篁里，弹琴复长啸。',replySource:'《竹里馆》',dynasty:'唐',replyBody:'你说你孤独，我也是。我常常一个人走进竹林深处，坐在那里弹琴、长啸，没有人听见，也不需要人听见。"深林人不知，明月来相照。"孤独不是病，是你终于和自己待在了一起。'},
  {id:'s004',category:'迷茫',keywords:['迷茫','方向','困惑','不知道做什么','没有目标','找不到方向','茫然'],question:'不知道未来该往哪里走。',replyPerson:'王维',personTitle:'山水诗人',replyQuote:'行到水穷处，坐看云起时。',replySource:'《终南别业》',dynasty:'唐',replyBody:'我走到溪水尽头，没有路了。换一个人，也许会焦虑。但我没有——我坐下来，看天上的云。水变成了云，路不是断了，是换了形态。迷茫不是因为你没有路，是你在用旧的地图找新的方向。'},
  {id:'s005',category:'情感',keywords:['分手','失恋','感情','前任','忘不掉','被甩','放不下'],question:'失恋了，心里放不下。',replyPerson:'苏轼',personTitle:'旷达词人',replyQuote:'回首向来萧瑟处，归去，也无风雨也无晴。',replySource:'《定风波》',dynasty:'宋',replyBody:'我在黄州被贬，妻子远在千里之外，朋友也日渐疏远。一个人在东坡种地、酿酒、写诗。回头看那些风雨和晴天，其实也没什么区别——都过去了。放不下的不是那个人，是你还在怀念中的自己。'},
  {id:'s006',category:'自我',keywords:['自卑','没用','差','不够优秀','比不过','能力不行','自我否定'],question:'觉得自己什么都做不好。',replyPerson:'李白',personTitle:'诗仙',replyQuote:'天生我材必有用，千金散尽还复来。',replySource:'《将进酒》',dynasty:'唐',replyBody:'我在长安做翰林，唐玄宗让我写诗助兴——说白了，我就是个写歌词的。赐金放还，体面扫地。但我是什么人？我是李白。才必有用，不是"或许有用"，是"必定有用"。你觉得做不好，是因为你还没找到让自己发光的地方。'},
  {id:'s007',category:'压力',keywords:['压力','大','重担','负担','受不了','快疯了','窒息','喘不过气'],question:'压力太大了，快承受不住了。',replyPerson:'陶渊明',personTitle:'隐逸诗人',replyQuote:'纵浪大化中，不喜亦不惧。',replySource:'《形影神》',dynasty:'晋',replyBody:'你被压力压得喘不过气，我理解。我当年在彭泽，上面派来的督邮要我来行礼，我选择了辞官。不是因为我扛不住，是因为我选择了不扛。"纵浪大化中，不喜亦不惧"——浪头来了，不用喜也不用惧，因为浪终会过去。'},
  {id:'s008',category:'选择',keywords:['选择','纠结','选不了','左右为难','怕选错','下不了决心'],question:'两个选择，不知道该怎么选。',replyPerson:'陶渊明',personTitle:'隐逸诗人',replyQuote:'悟已往之不谏，知来者之可追。',replySource:'《归去来兮辞》',dynasty:'晋',replyBody:'我当年也站在人生的十字路口——是继续做官还是归隐田园？纠结了很久。最后我想明白了：悟已往之不谏，知来者之可追。过去的选择已经不可挽回，但未来的路还来得及追。与其纠结选A还是选B，不如想想你到底想成为什么样的人。'},
  {id:'s009',category:'焦虑',keywords:['焦虑','紧张','心慌','坐立不安','担忧','胡思乱想'],question:'总是焦虑，控制不住地胡思乱想。',replyPerson:'洪应明',personTitle:'处世智者',replyQuote:'宠辱不惊，闲看庭前花开花落。',replySource:'《菜根谭》',dynasty:'明',replyBody:'你焦虑是因为你太在意结果——怕失去、怕得不到。但花开花落你管不了，你只能选择坐在院子里看。该来的来，该走的走，你不慌就行。焦虑的解药不是控制结果，是学会看花。'},
  {id:'s010',category:'成长',keywords:['努力','白费','看不到成果','没有收获','回报太少','白费力气'],question:'努力了很久，却看不到成果。',replyPerson:'郑燮',personTitle:'书画家',replyQuote:'千磨万击还坚劲，任尔东西南北风。',replySource:'《竹石》',dynasty:'清',replyBody:'竹子扎根在破岩里，被风吹了、被石头磨了千万次，还是站着。不是风不大，是根扎得深。你觉得努力白费了，但也许你的根正在往下扎——只是现在还看不到枝叶的变化。'}

function initDaily() {
  var now = new Date();
  document.getElementById('dailyDate').textContent = now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日';
  var di = DAILY[dailyIndex];
  document.getElementById('dailyText').textContent = di.quote;
  document.getElementById('dailySource').textContent = '—— ' + di.source;
  document.getElementById('dailyDynasty').textContent = di.dynasty + ' · ' + di.author;
  document.getElementById('dailyInterp').textContent = di.interpretation;
  if (dailyStreak > 0) {
    document.getElementById('streakBadge').style.display = 'inline-block';
    document.getElementById('streakNum').textContent = dailyStreak;
  }
  buildCalendar();
}

function buildCalendar() {
  var now = new Date();
  var y = now.getFullYear(), m = now.getMonth(), today = now.getDate();
  var firstDay = new Date(y, m, 1).getDay();
  var daysInMonth = new Date(y, m+1, 0).getDate();
  var html = '<div class="calendar-header"><span class="calendar-month">' + y + '年' + (m+1) + '月</span>' +
    (dailyStreak > 0 ? '<span class="calendar-streak">连续 ' + dailyStreak + ' 天</span>' : '') + '</div>';
  html += '<div class="calendar-weekdays">';
  ['日','一','二','三','四','五','六'].forEach(function(d) { html += '<span class="cal-weekday">' + d + '</span>'; });
  html += '</div><div class="calendar-grid">';
  for (var i = 0; i < firstDay; i++) html += '<div class="cal-day empty"></div>';
  for (var d = 1; d <= daysInMonth; d++) {
    var cls = '';
    if (d === today) cls += ' today';
    if (checkInDates.indexOf(d) >= 0) cls += ' checked';
    html += '<div class="cal-day' + cls + '">' + d + '</div>';
  }
  html += '</div>';
  document.getElementById('calendarCard').innerHTML = html;
}

function matchScenario(input) {
  var q = input.trim();
  if (!q) return null;
  var best = null, bestScore = 0;
  SCENARIOS.forEach(function(s) {
    var score = 0;
    s.keywords.forEach(function(kw) { if (q.indexOf(kw) >= 0) score++; });
    if (score > bestScore) { bestScore = score; best = s; }
  });
  if (best && bestScore > 0) return best;
  var catMatch = SCENARIOS.filter(function(s) { return s.category && q === s.category; });
  if (catMatch.length > 0) return catMatch[Math.floor(Math.random() * catMatch.length)];
  var fuzzy = SCENARIOS.filter(function(s) { return s.category && q.indexOf(s.category) >= 0; });
  if (fuzzy.length > 0) return fuzzy[Math.floor(Math.random() * fuzzy.length)];
  return SCENARIOS[Math.floor(Math.random() * SCENARIOS.length)];
}

    '<div class="envelope-date">' + dateStr + '</div></div>' +
    '<div class="postmark"><div class="postmark-circle">' +
    '<div class="postmark-line">古方</div><div class="postmark-line postmark-line-mid">回信</div>' +
    '<div class="postmark-line">' + dateStr + '</div></div></div>' +
    '<div class="letter"><div class="letter-header">' +
    '<div class="letter-person"><span class="person-name">' + sc.replyPerson + '</span>' +
    '<span class="person-title-badge">' + sc.personTitle + '</span></div>' +
    '<div class="dynasty-badge">' + sc.dynasty + '</div></div>' +
    '<div class="letter-greeting">见信如晤：</div>' +
    '<div class="letter-quote-wrap"><span class="quote-mark">「</span>' +
    '<span class="letter-quote-text">' + sc.replyQuote + '</span><span class="quote-mark">」</span></div>' +
    '<div class="letter-quote-source">—— ' + sc.replySource + '</div>' +
    '<div class="letter-divider"><div class="divider-dot"></div><div class="divider-line"></div><div class="divider-dot"></div></div>' +
    '<div class="letter-body">' + sc.replyBody + '</div>' +
    '<div class="letter-footer"><div style="text-align:right;margin-right:14px">' +
    '<div class="letter-sign">—— ' + sc.replyPerson + ' 顿首</div>' +
    '<div class="letter-date">' + dateStr + '</div></div>' +
    '<div class="seal"><div class="seal-inner"><span class="seal-text">' + sc.replyPerson + '</span></div></div>' +
    '</div></div>' +
    '<div class="mirror-again-btn" onclick="closeSubPage(\'mirrorPage\');resetMirror()">再问一封</div>';
  document.getElementById('mirrorBody').innerHTML = html;

}

function resetMirror() {
  document.getElementById('mirrorInput').value = '';
  document.getElementById('mirrorCount').textContent = '0';
  document.getElementById('mirrorBtn').className = 'action-btn';
  selectedCat = '';
  document.querySelectorAll('.mirror-cat-tag').forEach(function(t) { t.className = 'mirror-cat-tag'; });
}

// ===== DAILY =====
function changeDaily() {
  var card = document.getElementById('dailyCard');
  card.className = 'daily-card changing';
  setTimeout(function() {
    if (dailyViewed.length >= DAILY.length) dailyViewed = [dailyIndex];
    var avail = [];
    for (var i = 0; i < DAILY.length; i++) { if (dailyViewed.indexOf(i) < 0) avail.push(i); }
    if (avail.length === 0) return;
    dailyIndex = avail[Math.floor(Math.random() * avail.length)];
    dailyViewed.push(dailyIndex);
    var di = DAILY[dailyIndex];
    document.getElementById('dailyText').textContent = di.quote;
    document.getElementById('dailySource').textContent = '—— ' + di.source;
    document.getElementById('dailyDynasty').textContent = di.dynasty + ' · ' + di.author;
    document.getElementById('dailyInterp').textContent = di.interpretation;
    card.className = 'daily-card';
  }, 200);
}

function doCheckIn() {
  if (dailyChecked) { showToast('今日已打卡'); return; }
  dailyChecked = true;
  dailyStreak++;
  var now = new Date();
  checkInDates.push(now.getDate());
  document.getElementById('checkinBtn').textContent = '今日已打卡 ✓';
  document.getElementById('checkinBtn').className = 'checkin-btn checked';
  document.getElementById('checkinHint').textContent = dailyStreak >= 7
    ? '🎉 已坚持 ' + dailyStreak + ' 天！恭喜获得徽章'
    : '🎉 已坚持 ' + dailyStreak + ' 天！连续 7 天获得徽章';
  document.getElementById('streakBadge').style.display = 'inline-block';
  document.getElementById('streakNum').textContent = dailyStreak;
  buildCalendar();
  showToast(dailyStreak >= 7 ? '打卡成功！获得坚持徽章' : '打卡成功！');
}

// ===== STORY =====
function showStory(id) {
  currentStoryId = id;
  currentSceneIndex = 0;
  renderStory();
  document.getElementById('storyNavTitle').textContent = STORIES.find(function(s){return s.id===id;}).title;
  openSubPage('storyPage');
}

function renderStory() {
  var story = STORIES.find(function(s){return s.id===currentStoryId;});
  if (!story) return;

  // Check if showing insight page
  if (currentSceneIndex >= story.scenes.length) {
    renderInsight(story);
    return;
  }

  var scene = story.scenes[currentSceneIndex];
  var html = '<div class="story-header">' +
    '<div class="story-title">' + story.title + '</div>' +
    '<div class="story-meta"><span class="dynasty-badge">' + story.dynasty + '</span>' +
    '<span>' + story.author + '</span><span>·</span><span>' + story.source + '</span></div>' +
    '<div class="story-summary">' + story.summary + '</div></div>' +
    '<div class="scene-card">' +
    '<div class="scene-frame scene-theme-' + (scene.artTheme||'nature') + '">' +
    '<div class="scene-art-word">' + scene.artWord + '</div></div>' +
    '<div class="scene-num">第' + (currentSceneIndex+1) + '镜 · ' + scene.title + '</div>' +
    '<div class="scene-name">' + scene.title + '</div>' +
    '<div class="scene-narration">' + scene.narration + '</div></div>';
  // Progress dots
  html += '<div class="progress"><div class="dots">';
  story.scenes.forEach(function(s,i) {
    var cls = i < currentSceneIndex ? ' done' : (i === currentSceneIndex ? ' active' : '');
    html += '<div class="dot' + cls + '"></div>';
  });
  html += '<div class="dot-insight' + (currentSceneIndex===story.scenes.length-1?' active':'') + '"><span>悟</span></div></div>';
  html += '<div class="progress-text">' + (currentSceneIndex+1) + ' / ' + story.scenes.length + ' 镜</div></div>';
  // Nav
  html += '<div class="scene-nav">' +
    '<div class="nav-btn' + (currentSceneIndex===0?' disabled':'') + '" onclick="prevScene()"><span>←</span> 上一镜</div>' +
    '<div class="nav-btn' + (currentSceneIndex>=story.scenes.length?' disabled':'') + '" onclick="nextScene()">' +
    (currentSceneIndex===story.scenes.length-1?'见悟 →':'下一镜 →') + '</div></div>';
  html += '<div class="swipe-hint">左右翻阅 · 沉浸分镜</div>';
  html += '<div class="reader-footer"><div class="btn-secondary" onclick="changeStory()">换一篇</div><div class="btn-secondary" onclick="closeSubPage(\'storyPage\')">返回</div></div>';
  document.getElementById('storyBody').innerHTML = html;
  // Scroll to top
  document.getElementById('storyBody').scrollTop = 0;
}

function renderInsight(story) {
  var html = '<div style="padding-top:20px">' +
    '<div class="insight-card">' +
    '<div class="insight-seal">悟</div>' +
    '<div class="insight-label">一帖感悟</div>' +
    '<div class="insight-divider"></div>' +
    '<div class="insight-text">' + story.insight + '</div>' +
    '<div class="insight-source">—— ' + story.source + '</div></div></div>';
  // Progress - all done
  html += '<div class="progress"><div class="dots">';
  story.scenes.forEach(function(s,i) {
    html += '<div class="dot done"></div>';
  });
  html += '<div class="dot-insight active"><span>悟</span></div></div>';
  html += '<div class="progress-text">全篇完</div></div>';
  html += '<div class="reader-footer"><div class="btn-secondary" onclick="currentSceneIndex=0;renderStory()">重读</div><div class="btn-secondary" onclick="changeStory()">换一篇</div><div class="btn-secondary" onclick="closeSubPage(\'storyPage\')">返回</div></div>';
  document.getElementById('storyBody').innerHTML = html;
  document.getElementById('storyBody').scrollTop = 0;
}

function prevScene() { if (currentSceneIndex > 0) { currentSceneIndex--; renderStory(); } }
function nextScene() {
  var story = STORIES.find(function(s){return s.id===currentStoryId;});
  if (currentSceneIndex < story.scenes.length) { currentSceneIndex++; renderStory(); }
}
function changeStory() {
  var avail = STORIES.filter(function(s){return s.id!==currentStoryId;});
  if (avail.length > 0) showStory(avail[Math.floor(Math.random()*avail.length)].id);
}

// ===== WORD =====
function showWord(id) {
  var article = WORDS.find(function(w){return w.id===id;});
  if (!article) return;
  wordUnlocked = wordUnlocked || {};
  currentWordArticle = article;
  document.getElementById('wordNavTitle').textContent = article.title;
  renderWord();
  openSubPage('wordPage');
}

function renderWord() {
  var article = currentWordArticle;
  var unlocked = wordUnlocked[article.id] || [];
  var total = article.words.length;
  var count = unlocked.length;
  var pct = total > 0 ? Math.round(count/total*100) : 0;
  var allDone = count >= total;
  // Build segments
  var segments = buildSegments(article.fullText, article.words, unlocked);
  var segHtml = '';
  segments.forEach(function(seg) {
    if (seg.type === 'text') {
      segHtml += '<span class="seg-text">' + seg.content + '</span>';
    } else {
      segHtml += '<span class="seg-word' + (seg.unlocked ? ' is-unlocked' : '') + '" onclick="onTapChar(\'' + seg.char + '\')">' + seg.content + '</span>';
    }
  });
  var html = '<div class="article-header">' +
    '<div class="article-title">' + article.title + '</div>' +
    '<div class="article-meta"><span class="dynasty-badge">' + article.dynasty + '</span>' +
    '<span>' + article.author + '</span><span>·</span><span>' + article.source + '</span></div>' +
    '<div class="article-intro">' + article.intro + '</div></div>' +
    '<div class="progress-card"><div class="progress-top">' +
    '<span class="progress-label">已解锁 <span class="progress-num">' + count + '</span>/' + total + ' 字</span>' +
    '<span class="progress-hint' + (allDone?' done':'') + '">' + (allDone?'已全部解锁':'点击下划线字词查看释义') + '</span></div>' +
    '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div></div>' +
    '<div class="text-card"><div class="text-card-tag">原文</div>' +
    '<div class="text-segments">' + segHtml + '</div>' +
    '<div class="legend-text">下划线为生僻字，点击即可解锁释义</div></div>';
  if (allDone) {
    html += '<div class="congrats"><div class="congrats-seal">通</div>' +
      '<div class="congrats-title">字字皆通</div>' +
      '<div class="congrats-text">你已解锁本篇全部 ' + total + ' 个字词。古人说读书百遍其义自见，你已经迈出了第一步。</div></div>';
  }
  // Overview grid
  html += '<div class="word-overview"><div class="word-overview-title">字词总览</div><div class="overview-grid">';
  article.words.forEach(function(w) {
    var isL = unlocked.indexOf(w.char) >= 0;
    html += '<div class="overview-item">' +
      '<div class="overview-char ' + (isL ? 'is-learned' : 'is-locked') + '">' + w.char + '</div>' +
      '<div class="overview-label">' + (isL?'已学':'未学') + '</div></div>';
  });
  html += '</div></div>';
  html += '<div class="reader-footer"><div class="btn-secondary" onclick="changeWord()">换一篇</div><div class="btn-secondary" onclick="closeSubPage(\'wordPage\')">返回</div></div>';
  document.getElementById('wordBody').innerHTML = html;
  document.getElementById('wordBody').scrollTop = 0;
}

function buildSegments(text, words, unlocked) {
  var arr = words || [];
  var positions = [];
  arr.forEach(function(w) {
    var firstPos = -1;
    if (w.context) { var ci = text.indexOf(w.context); if (ci>=0) { var cc = w.context.indexOf(w.char); if (cc>=0) firstPos = ci+cc; } }
    if (firstPos < 0) firstPos = text.indexOf(w.char);
    if (firstPos >= 0) {
      positions.push({pos:firstPos, char:w.char, word:w});
      var sf = firstPos + w.char.length;
      while (sf < text.length) { var np = text.indexOf(w.char, sf); if (np<0) break; positions.push({pos:np, char:w.char, word:w}); sf = np+w.char.length; }
    }
  });
  positions.sort(function(a,b){return a.pos-b.pos;});
  var segs = [];
  var cur = 0;
  positions.forEach(function(p) {
    if (p.pos < cur) return;
    if (p.pos > cur) segs.push({type:'text',content:text.slice(cur,p.pos)});
    var isUnlocked = unlocked.indexOf(p.char)>=0;
    segs.push({type:'word',content:p.char,char:p.char,unlocked:isUnlocked});
    cur = p.pos + p.char.length;
  });
  if (cur < text.length) segs.push({type:'text',content:text.slice(cur)});
  return segs;
}

function onTapChar(ch) {
  if (!currentWordArticle) return;
  var word = currentWordArticle.words.find(function(w){return w.char===ch;});
  if (!word) return;
  if (!wordUnlocked[currentWordArticle.id]) wordUnlocked[currentWordArticle.id] = [];
  if (wordUnlocked[currentWordArticle.id].indexOf(ch) < 0) wordUnlocked[currentWordArticle.id].push(ch);
  document.getElementById('popupChar').textContent = ch;
  document.getElementById('popupContext').textContent = '原文语境：' + word.context;
  document.getElementById('popupMeaning').textContent = word.meaning;
  document.getElementById('wordPopup').style.display = 'flex';
  setTimeout(function(){ renderWord(); }, 200);
}
function closeWordPopup() { document.getElementById('wordPopup').style.display = 'none'; }

function changeWord() {
  var avail = WORDS.filter(function(w){return w.id!==currentWordArticle.id;});
  if (avail.length > 0) showWord(avail[Math.floor(Math.random()*avail.length)].id);
}

// ===== SUB PAGE NAV =====
function openSubPage(id) { document.getElementById(id).classList.add('show'); }
function closeSubPage(id) { document.getElementById(id).classList.remove('show'); }
</script>
