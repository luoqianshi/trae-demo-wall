<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>暖岛AI - 聊天体验</title>
    <link rel="stylesheet" href="chat.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <button class="back-btn" onclick="goBack()">
                <i data-lucide="arrow-left"></i>
            </button>
            <div class="header-info">
                <div class="avatar-wrapper">
                    <svg viewBox="0 0 80 80" class="avatar-cat">
                        <circle cx="40" cy="38" r="20" fill="#2D2D2D"/>
                        <polygon points="24,28 30,12 36,26" fill="#2D2D2D"/>
                        <polygon points="27,24 30,15 33,24" fill="#FFB7C5"/>
                        <polygon points="44,26 50,12 56,28" fill="#2D2D2D"/>
                        <polygon points="47,24 50,15 53,24" fill="#FFB7C5"/>
                        <circle cx="32" cy="36" r="4" fill="#FFD700"/>
                        <circle cx="48" cy="36" r="4" fill="#FFD700"/>
                        <circle cx="33" cy="35" r="1.5" fill="#000"/>
                        <circle cx="49" cy="35" r="1.5" fill="#000"/>
                        <line x1="26" y1="38" x2="18" y2="36" stroke="#FFF" stroke-width="1" opacity="0.8"/>
                        <line x1="26" y1="40" x2="18" y2="40" stroke="#FFF" stroke-width="1" opacity="0.8"/>
                        <line x1="54" y1="38" x2="62" y2="36" stroke="#FFF" stroke-width="1" opacity="0.8"/>
                        <line x1="54" y1="40" x2="62" y2="40" stroke="#FFF" stroke-width="1" opacity="0.8"/>
                        <circle cx="40" cy="44" r="2" fill="#FF6B8A"/>
                        <circle cx="34" cy="42" r="3" fill="#FFB7C5" opacity="0.6"/>
                        <circle cx="46" cy="42" r="3" fill="#FFB7C5" opacity="0.6"/>
                    </svg>
                    <span class="online-dot"></span>
                </div>
                <div class="header-text">
                    <h1 class="bot-name">暖岛喵</h1>
                    <p class="bot-status">在线 - 随时陪伴你</p>
                </div>
            </div>
            <button class="more-btn">
                <i data-lucide="more-horizontal"></i>
            </button>
        </header>

        <div class="quick-actions">
            <div class="action-item" onclick="sendQuickMessage('今天心情不太好')">
                <i data-lucide="heart"></i>
                <span>情感陪伴</span>
            </div>
            <div class="action-item" onclick="sendQuickMessage('早安')">
                <i data-lucide="sunrise"></i>
                <span>每日问候</span>
            </div>
            <div class="action-item" onclick="sendQuickMessage('讲个笑话')">
                <i data-lucide="sparkles"></i>
                <span>趣味互动</span>
            </div>
            <div class="action-item" onclick="sendQuickMessage('给我一些生活建议')">
                <i data-lucide="clipboard-list"></i>
                <span>生活建议</span>
            </div>
            <div class="action-item" onclick="sendQuickMessage('给我讲个睡前故事')">
                <i data-lucide="moon"></i>
                <span>睡前故事</span>
            </div>
        </div>

        <main class="chat-messages" id="messagesContainer">
            <div class="cat-stage">
                <div class="cat-mood" id="catMood">😊</div>
                <div class="cat-glow"></div>
                <svg viewBox="0 0 200 200" class="black-cat" id="mainCat">
                    <defs>
                        <linearGradient id="earInner" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#FFB7C5"/>
                            <stop offset="100%" style="stop-color:#FF6B8A"/>
                        </linearGradient>
                        <linearGradient id="eyeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#FFD700"/>
                            <stop offset="100%" style="stop-color:#FFA500"/>
                        </linearGradient>
                        <radialGradient id="blushGradient" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" style="stop-color:#FFB7C5;stop-opacity:0.8"/>
                            <stop offset="100%" style="stop-color:#FFB7C5;stop-opacity:0"/>
                        </radialGradient>
                    </defs>
                    <ellipse cx="100" cy="160" rx="60" ry="12" fill="#8B5A2B" opacity="0.15"/>
                    <ellipse cx="100" cy="120" rx="55" ry="35" fill="#2D2D2D" class="cat-body"/>
                    <ellipse cx="65" cy="145" rx="18" ry="12" fill="#2D2D2D"/>
                    <ellipse cx="135" cy="145" rx="18" ry="12" fill="#2D2D2D"/>
                    <circle cx="100" cy="75" r="38" fill="#2D2D2D" class="cat-head"/>
                    <polygon points="62,55 75,25 88,52" fill="#2D2D2D" class="ear-left"/>
                    <polygon points="68,48 75,30 82,48" fill="url(#earInner)"/>
                    <polygon points="112,52 125,25 138,55" fill="#2D2D2D" class="ear-right"/>
                    <polygon points="118,48 125,30 132,48" fill="url(#earInner)"/>
                    <ellipse cx="82" cy="70" rx="10" ry="12" fill="#FFF" class="eye-white-left"/>
                    <ellipse cx="118" cy="70" rx="10" ry="12" fill="#FFF" class="eye-white-right"/>
                    <circle cx="82" cy="70" r="6" fill="url(#eyeGradient)" class="eye-left"/>
                    <circle cx="118" cy="70" r="6" fill="url(#eyeGradient)" class="eye-right"/>
                    <circle cx="84" cy="68" r="2" fill="#000" class="eye-pupil-left"/>
                    <circle cx="120" cy="68" r="2" fill="#000" class="eye-pupil-right"/>
                    <line x1="72" y1="72" x2="55" y2="68" stroke="#FFF" stroke-width="1.5" opacity="0.8"/>
                    <line x1="72" y1="76" x2="55" y2="76" stroke="#FFF" stroke-width="1.5" opacity="0.8"/>
                    <line x1="72" y1="80" x2="55" y2="84" stroke="#FFF" stroke-width="1.5" opacity="0.8"/>
                    <line x1="128" y1="72" x2="145" y2="68" stroke="#FFF" stroke-width="1.5" opacity="0.8"/>
                    <line x1="128" y1="76" x2="145" y2="76" stroke="#FFF" stroke-width="1.5" opacity="0.8"/>
                    <line x1="128" y1="80" x2="145" y2="84" stroke="#FFF" stroke-width="1.5" opacity="0.8"/>
                    <ellipse cx="100" cy="85" rx="4" ry="3" fill="#FF6B8A"/>
                    <path d="M96 92 Q100 96 104 92" stroke="#FF6B8A" stroke-width="2" fill="none" class="cat-mouth"/>
                    <circle cx="68" cy="82" r="8" fill="url(#blushGradient)" class="blush-left"/>
                    <circle cx="132" cy="82" r="8" fill="url(#blushGradient)" class="blush-right"/>
                    <path d="M140 135 Q175 120 165 95 Q160 75 145 70" fill="none" stroke="#2D2D2D" stroke-width="8" stroke-linecap="round" class="cat-tail"/>
                    <path d="M145 130 Q170 115 160 90" fill="none" stroke="#4A4A4A" stroke-width="4" stroke-linecap="round"/>
                </svg>
                <div class="cat-status" id="catStatus">喵～ 我在听你说哦～</div>
                
                <div class="cat-speech-bubble" id="catSpeechBubble">
                    <div class="bubble-arrow"></div>
                    <div class="bubble-content" id="bubbleContent"></div>
                </div>
            </div>
            
            <div class="messages-list" id="messagesList">
                <div class="welcome-message">
                    <h2>你好呀～ 我是暖岛喵 ☺️</h2>
                    <p>很高兴认识你！无论你是想聊天、寻求安慰，还是想听个故事，我都在这里陪着你。</p>
                    <div class="welcome-tips">
                        <span>💡 试试说："我好累"、"讲个笑话"、"睡不着"</span>
                    </div>
                </div>
            </div>
        </main>

        <footer class="chat-footer">
            <div class="input-wrapper">
                <input type="text" id="messageInput" placeholder="说点什么吧..." onkeypress="handleKeyPress(event)">
                <button class="emoji-btn">
                    <i data-lucide="smile"></i>
                </button>
            </div>
            <button class="send-btn" onclick="sendMessage()">
                <i data-lucide="send"></i>
            </button>
        </footer>
    </div>

    <script src="chat.js?v=10"></script>
</body>
</html>
