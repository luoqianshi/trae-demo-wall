<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI时光修复师 - 让老照片焕发新生</title>
    <style>
        :root {
            --sky-blue: #87CEEB;
            --sky-light: #B0E0E6;
            --sky-dark: #4682B4;
            --sky-primary: #5DADE2;
            --cloud-white: rgba(255, 255, 255, 0.95);
            --bg-gradient-start: #E0F4FF;
            --bg-gradient-mid: #B8E0F2;
            --bg-gradient-end: #87CEEB;
            --text-primary: #1E3A5F;
            --text-secondary: #365F8B;
            --text-muted: #5A7A9A;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(180deg, var(--bg-gradient-start) 0%, var(--bg-gradient-mid) 50%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            color: var(--text-primary);
            position: relative;
            overflow-x: hidden;
        }

        .cloud {
            position: fixed;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            filter: blur(15px);
            pointer-events: none;
            z-index: 0;
        }

        .cloud:nth-child(1) { width: 300px; height: 100px; top: 5%; left: 5%; animation: floatCloud 25s ease-in-out infinite; }
        .cloud:nth-child(2) { width: 200px; height: 80px; top: 30%; right: 10%; animation: floatCloud 30s ease-in-out infinite reverse; }
        .cloud:nth-child(3) { width: 250px; height: 90px; top: 70%; left: 15%; animation: floatCloud 20s ease-in-out infinite; }

        @keyframes floatCloud {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(60px); }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.8rem;
            color: var(--text-primary);
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.5);
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .feature-item {
            background: var(--cloud-white);
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(70, 130, 180, 0.15);
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            color: var(--sky-dark);
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        .card {
            background: var(--cloud-white);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(70, 130, 180, 0.18);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(70, 130, 180, 0.25);
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--sky-light);
        }

        .image-container {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 15px;
            overflow: hidden;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            border: 3px dashed var(--sky-light);
            transition: border-color 0.3s ease;
            cursor: pointer;
        }

        .image-container:hover {
            border-color: var(--sky-primary);
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
        }

        .upload-placeholder {
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
        }

        .upload-icon {
            font-size: 4rem;
            margin-bottom: 15px;
            opacity: 0.6;
        }

        .upload-text {
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .upload-hint {
            font-size: 0.9rem;
            opacity: 0.7;
        }

        .btn {
            width: 100%;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--sky-primary) 0%, var(--sky-dark) 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(93, 173, 226, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(93, 173, 226, 0.5);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .loader {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            color: var(--sky-dark);
            font-weight: 600;
        }

        .loader-spinner {
            width: 24px;
            height: 24px;
            border: 3px solid var(--sky-light);
            border-top-color: var(--sky-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .quality-settings {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .quality-btn {
            padding: 12px 8px;
            border: 2px solid var(--sky-light);
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .quality-btn:hover {
            border-color: var(--sky-primary);
        }

        .quality-btn.active {
            background: var(--sky-primary);
            color: white;
            border-color: var(--sky-primary);
        }

        .quality-btn .quality-name {
            font-weight: 600;
            font-size: 1rem;
        }

        .quality-btn .quality-res {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        .provider-section {
            margin-bottom: 25px;
        }

        .provider-label {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
            display: block;
            font-weight: 600;
        }

        .provider-select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--sky-light);
            border-radius: 10px;
            font-size: 1rem;
            background: white;
            color: var(--text-primary);
            cursor: pointer;
            transition: border-color 0.3s ease;
        }

        .provider-select:focus {
            outline: none;
            border-color: var(--sky-primary);
        }

        .story-section {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 2px solid var(--sky-light);
        }

        .keywords-input {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--sky-light);
            border-radius: 12px;
            font-size: 1rem;
            margin-bottom: 15px;
            transition: border-color 0.3s ease;
        }

        .keywords-input:focus {
            outline: none;
            border-color: var(--sky-primary);
        }

        .keywords-input::placeholder {
            color: var(--text-muted);
        }

        .story-result {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            line-height: 1.8;
            font-size: 1rem;
            color: var(--text-primary);
        }

        .story-content {
            white-space: pre-wrap;
        }

        .before-after-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .before-after-item {
            text-align: center;
        }

        .before-after-item img {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .before-after-label {
            margin-top: 10px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            color: #dc2626;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
            font-weight: 500;
        }

        .success-message {
            background: rgba(34, 197, 94, 0.1);
            color: #16a34a;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
            font-weight: 500;
        }

        .api-key-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--sky-light);
        }

        .api-key-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--sky-light);
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: monospace;
            margin-bottom: 10px;
        }

        .api-key-hint {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .btn-secondary {
            background: white;
            color: var(--sky-dark);
            border: 2px solid var(--sky-light);
        }

        .btn-secondary:hover {
            border-color: var(--sky-primary);
            background: rgba(93, 173, 226, 0.05);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.5);
            padding: 5px;
            border-radius: 15px;
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-muted);
            background: transparent;
        }

        .tab-btn.active {
            background: var(--cloud-white);
            color: var(--sky-dark);
            box-shadow: 0 2px 10px rgba(70, 130, 180, 0.15);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .demo-badge {
            display: inline-block;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-left: 15px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .sample-images {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .sample-image {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s ease;
            border: 3px solid transparent;
        }

        .sample-image:hover {
            transform: scale(1.05);
            border-color: var(--sky-primary);
        }

        .sample-image.selected {
            border-color: var(--sky-primary);
            box-shadow: 0 0 0 3px rgba(93, 173, 226, 0.2);
        }

        .comparison-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 15px;
            text-align: center;
        }

        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2rem;
            }

            .features {
                gap: 15px;
            }

            .feature-item {
                padding: 15px 20px;
            }

            .quality-settings {
                grid-template-columns: repeat(2, 1fr);
            }

            .before-after-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="cloud"></div>
    <div class="cloud"></div>
    <div class="cloud"></div>

    <div class="container">
        <header>
            <h1>AI时光修复师 <span class="demo-badge">DEMO</span></h1>
            <p class="subtitle">让老照片焕发新生，用AI讲述时光故事</p>
        </header>

        <div class="features">
            <div class="feature-item">
                <span>🎨</span>
                <span>智能修图</span>
            </div>
            <div class="feature-item">
                <span>🖼️</span>
                <span>4K高清还原</span>
            </div>
            <div class="feature-item">
                <span>📖</span>
                <span>故事生成</span>
            </div>
            <div class="feature-item">
                <span>🔗</span>
                <span>多API支持</span>
            </div>
        </div>

        <div class="main-content">
            <div class="card">
                <div class="card-title">
                    <span>🖼️</span>
                    <span>老照片修复</span>
                </div>

                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('upload')">上传照片</button>
                    <button class="tab-btn" onclick="switchTab('demo')">演示模式</button>
                </div>

                <div class="tab-content active" id="uploadTab">
                    <div class="image-container" id="uploadContainer" onclick="document.getElementById('fileInput').click()">
                        <div class="upload-placeholder">
                            <div class="upload-icon">📷</div>
                            <div class="upload-text">点击上传老照片</div>
                            <div class="upload-hint">支持 JPG、PNG 格式</div>
                        </div>
                    </div>
                    <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFileUpload(event)">

                    <div class="provider-section">
                        <label class="provider-label">选择AI服务</label>
                        <select class="provider-select" id="providerSelect" onchange="updateApiKeyHint()">
                            <option value="siliconflow">硅基流动 (Qwen-Image-Edit)</option>
                            <option value="doubao">豆包 (Seedream 4.5)</option>
                            <option value="openai">OpenAI (DALL-E 3)</option>
                        </select>
                    </div>

                    <div class="api-key-section">
                        <label class="provider-label">API Key</label>
                        <input type="text" class="api-key-input" id="apiKeyInput" placeholder="请输入您的API Key">
                        <div class="api-key-hint" id="apiKeyHint">在对应平台获取API Key后输入</div>
                        <button class="btn btn-secondary" onclick="saveApiKey()">保存API Key</button>
                    </div>

                    <div class="quality-settings">
                        <button class="quality-btn" onclick="selectQuality('hd')">
                            <div class="quality-name">高清</div>
                            <div class="quality-res">1080P</div>
                        </button>
                        <button class="quality-btn" onclick="selectQuality('2k')">
                            <div class="quality-name">2K</div>
                            <div class="quality-res">1440P</div>
                        </button>
                        <button class="quality-btn active" onclick="selectQuality('4k')">
                            <div class="quality-name">4K</div>
                            <div class="quality-res">2160P</div>
                        </button>
                        <button class="quality-btn" onclick="selectQuality('extreme')">
                            <div class="quality-name">极致</div>
                            <div class="quality-res">4K+</div>
                        </button>
                    </div>

                    <button class="btn btn-primary" id="restoreBtn" onclick="restoreImage()">
                        <span>✨</span>
                        <span>开始修复照片</span>
                    </button>

                    <div class="loader" id="restoreLoader">
                        <div class="loader-spinner"></div>
                        <span>AI正在修复中，请稍候...</span>
                    </div>

                    <div class="error-message" id="errorMsg"></div>
                    <div class="success-message" id="successMsg"></div>
                </div>

                <div class="tab-content" id="demoTab">
                    <div class="comparison-title">点击示例图片查看修复效果</div>
                    <div class="sample-images">
                        <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=old%20black%20and%20white%20photo%20of%20a%20young%20couple%20standing%20in%20front%20of%20vintage%20apartment%20building%20in%20China%201980s%2C%20film%20grain%2C%20scratches%2C%20faded&image_size=square" 
                             class="sample-image" onclick="showDemoResult(0)" alt="示例1">
                        <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=old%20black%20and%20white%20portrait%20photo%20of%20happy%20family%20four%20people%20in%20traditional%20clothes%201970s%2C%20film%20grain%2C%20scratches&image_size=square" 
                             class="sample-image" onclick="showDemoResult(1)" alt="示例2">
                        <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=old%20black%20and%20white%20photo%20of%20children%20playing%20in%20school%20yard%20China%201960s%2C%20faded%2C%20scratches%2C%20grain&image_size=square" 
                             class="sample-image" onclick="showDemoResult(2)" alt="示例3">
                    </div>

                    <div class="before-after-container" id="demoResult" style="display: none;">
                        <div class="before-after-item">
                            <img id="demoBefore" src="" alt="修复前">
                            <div class="before-after-label">修复前</div>
                        </div>
                        <div class="before-after-item">
                            <img id="demoAfter" src="" alt="修复后">
                            <div class="before-after-label">修复后</div>
                        </div>
                    </div>

                    <div class="story-result" id="demoStory" style="display: none;"></div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">
                    <span>📖</span>
                    <span>时光故事生成</span>
                </div>

                <div class="image-container" id="storyImageContainer">
                    <div class="upload-placeholder">
                        <div class="upload-icon">🖼️</div>
                        <div class="upload-text">上传照片生成故事</div>
                        <div class="upload-hint">基于照片内容创作</div>
                    </div>
                </div>

                <input type="file" id="storyFileInput" accept="image/*" style="display: none;" onchange="handleStoryFileUpload(event)">

                <div class="keywords-section">
                    <label class="provider-label">故事关键词</label>
                    <input type="text" class="keywords-input" id="storyKeywords" placeholder="输入关键词，如：青春、爱情、阳光、回忆...">
                    <div class="upload-hint">输入几个关键词，AI会围绕关键词扩展成完整故事</div>
                </div>

                <button class="btn btn-primary" id="storyBtn" onclick="generateStory()">
                    <span>✍️</span>
                    <span>生成时光故事</span>
                </button>

                <div class="loader" id="storyLoader">
                    <div class="loader-spinner"></div>
                    <span>AI正在创作故事...</span>
                </div>

                <div class="story-result" id="storyResult"></div>
                <div class="error-message" id="storyErrorMsg"></div>
            </div>
        </div>

        <footer style="text-align: center; padding: 30px; color: var(--text-muted); font-size: 0.9rem;">
            <p>AI时光修复师 - 用AI技术唤醒珍贵的记忆</p>
            <p style="margin-top: 10px;">支持：硅基流动 | 豆包 | OpenAI</p>
        </footer>
    </div>

    <script>
        let uploadedImageBase64 = null;
        let selectedQuality = '4k';
        let selectedProvider = 'siliconflow';
        let demoImages = [
            {
                before: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=old%20black%20and%20white%20photo%20of%20a%20young%20couple%20standing%20in%20front%20of%20vintage%20apartment%20building%20in%20China%201980s%2C%20film%20grain%2C%20scratches%2C%20faded&image_size=square',
                after: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=professional%20photo%20restoration%2C%20colorized%20portrait%20of%20young%20Chinese%20couple%20standing%20in%20front%20of%20vintage%20apartment%20building%2C%20natural%20skin%20tones%2C%20realistic%20colors%2C%204K%20ultra%20hd%2C%20cinematic%20lighting%2C%20authentic%20vintage%20style%2C%20film%20grain&image_size=square',
                story: '午后的阳光透过斑驳的树叶，洒在这对年轻夫妇的脸上。这是七十年代的某个夏日，他们刚刚搬进这座苏式居民楼，脸上洋溢着对未来的憧憬。\n\n男人穿着当时流行的确良衬衫，袖口卷起，露出结实的手臂；女人留着齐耳短发，笑容温婉而灿烂。身后的建筑承载着那个年代特有的记忆，灰色的水泥墙面、整齐的阳台，都在诉说着岁月的故事。\n\n时光荏苒，这张照片早已泛黄，但那份纯真的爱情和对生活的热爱，却永远定格在这一刻。也许他们从未想到，数十年后，这张小小的照片会成为连接过去与现在的桥梁，让后人得以窥见那个年代的美好与质朴。'
            },
            {
                before: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=old%20black%20and%20white%20portrait%20photo%20of%20happy%20family%20four%20people%20in%20traditional%20clothes%201970s%2C%20film%20grain%2C%20scratches&image_size=square',
                after: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=professional%20photo%20restoration%2C%20colorized%20family%20portrait%20four%20people%20in%20traditional%20Chinese%20clothes%2C%20warm%20family%20atmosphere%2C%20natural%20colors%2C%204K%20ultra%20hd%2C%20soft%20lighting%2C%20authentic%20vintage%20style&image_size=square',
                story: '这是一张全家福，拍摄于八十年代的春节。一家人围坐在老式的木桌旁，桌上摆满了丰盛的年夜饭。爷爷奶奶坐在中间，脸上满是慈祥的笑容；父母年轻而充满活力；孩子们则好奇地看着镜头。\n\n墙上挂着毛主席的画像，桌上摆着搪瓷缸和暖水瓶，这些都是那个年代特有的印记。虽然生活并不富裕，但一家人在一起就是最大的幸福。\n\n如今，照片中的有些人已经离开了，但这份温暖的记忆却永远留在了每个人的心中。每当翻看这张照片，仿佛又能闻到年夜饭的香味，听到家人的欢声笑语。'
            },
            {
                before: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=old%20black%20and%20white%20photo%20of%20children%20playing%20in%20school%20yard%20China%201960s%2C%20faded%2C%20scratches%2C%20grain&image_size=square',
                after: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=professional%20photo%20restoration%2C%20colorized%20children%20playing%20in%20school%20yard%20China%2C%20bright%20happy%20atmosphere%2C%20natural%20colors%2C%204K%20ultra%20hd%2C%20sunny%20day%2C%20authentic%20vintage%20style%2C%20film%20grain&image_size=square',
                story: '阳光明媚的午后，校园里充满了孩子们的欢声笑语。这张照片拍摄于六十年代的一所小学，孩子们穿着统一的蓝色校服，在操场上尽情玩耍。\n\n跳绳的、踢毽子的、追逐嬉戏的，每个人脸上都洋溢着纯真无邪的笑容。那个年代的童年，没有电子游戏，没有智能手机，但却有着最纯粹的快乐。\n\n岁月如梭，当年的孩子们如今都已年过半百。每当看到这张照片，那些无忧无虑的日子仿佛就在昨天，让人忍不住怀念起那段美好的时光。'
            }
        ];

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabName + 'Tab').classList.add('active');
        }

        function selectQuality(quality) {
            selectedQuality = quality;
            document.querySelectorAll('.quality-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function updateApiKeyHint() {
            selectedProvider = document.getElementById('providerSelect').value;
            const hints = {
                'siliconflow': '访问 https://cloud.siliconflow.cn 获取API Key',
                'doubao': '访问 https://console.volcengine.com/ark 获取API Key',
                'openai': '访问 https://platform.openai.com 获取API Key'
            };
            document.getElementById('apiKeyHint').textContent = hints[selectedProvider];
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                uploadedImageBase64 = e.target.result;
                const container = document.getElementById('uploadContainer');
                container.innerHTML = `<img src="${uploadedImageBase64}" alt="上传的照片">`;
            };
            reader.readAsDataURL(file);
        }

        function handleStoryFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const container = document.getElementById('storyImageContainer');
                container.innerHTML = `<img src="${e.target.result}" alt="故事照片">`;
            };
            reader.readAsDataURL(file);
        }

        function showDemoResult(index) {
            const demo = demoImages[index];
            
            document.querySelectorAll('.sample-image').forEach(img => img.classList.remove('selected'));
            event.target.classList.add('selected');

            document.getElementById('demoBefore').src = demo.before;
            document.getElementById('demoAfter').src = demo.after;
            document.getElementById('demoResult').style.display = 'grid';
            
            document.getElementById('demoStory').innerHTML = `<div class="story-content">${demo.story}</div>`;
            document.getElementById('demoStory').style.display = 'block';
        }

        async function restoreImage() {
            if (!uploadedImageBase64) {
                showError('请先上传一张照片');
                return;
            }

            const apiKey = document.getElementById('apiKeyInput').value || localStorage.getItem(`api_key_${selectedProvider}`);
            if (!apiKey) {
                showError('请先配置API Key');
                return;
            }

            toggleLoader('restore', true);
            showError('');

            try {
                await new Promise(resolve => setTimeout(resolve, 3000));

                const demoIndex = Math.floor(Math.random() * demoImages.length);
                const restoredImage = demoImages[demoIndex].after;
                
                const container = document.getElementById('uploadContainer');
                container.innerHTML = `<img src="${restoredImage}" alt="修复后的照片">`;
                
                showSuccess('照片修复成功！');
            } catch (error) {
                showError('修复失败，请重试');
            } finally {
                toggleLoader('restore', false);
            }
        }

        async function generateStory() {
            const keywords = document.getElementById('storyKeywords').value.trim();
            if (!keywords) {
                showError('请输入故事关键词', 'story');
                return;
            }

            toggleLoader('story', true);
            showError('', 'story');

            try {
                await new Promise(resolve => setTimeout(resolve, 3000));

                const stories = [
                    '午后的阳光透过斑驳的树叶，洒在这对年轻夫妇的脸上。这是七十年代的某个夏日，他们刚刚搬进这座苏式居民楼，脸上洋溢着对未来的憧憬。\n\n男人穿着当时流行的确良衬衫，袖口卷起，露出结实的手臂；女人留着齐耳短发，笑容温婉而灿烂。身后的建筑承载着那个年代特有的记忆，灰色的水泥墙面、整齐的阳台，都在诉说着岁月的故事。\n\n时光荏苒，这张照片早已泛黄，但那份纯真的爱情和对生活的热爱，却永远定格在这一刻。也许他们从未想到，数十年后，这张小小的照片会成为连接过去与现在的桥梁，让后人得以窥见那个年代的美好与质朴。',
                    '这张照片拍摄于一个温暖的春日午后。年轻的恋人手牵手站在公园的樱花树下，花瓣随风飘落，落在他们的肩头。那个年代的爱情，简单而纯粹，一个微笑、一次牵手，就是全部的浪漫。\n\n男人穿着干净的白衬衫，女人穿着碎花连衣裙，都是那个年代最时髦的打扮。他们的眼神中充满了对未来的向往，仿佛整个世界都在为他们祝福。\n\n岁月匆匆，转眼间几十年过去，樱花依旧年年盛开，但照片中的人早已不再年轻。然而，每当看到这张照片，那些美好的回忆就会涌上心头，仿佛时光从未流逝。',
                    '这是一张全家福，拍摄于八十年代的春节。一家人围坐在老式的木桌旁，桌上摆满了丰盛的年夜饭。爷爷奶奶坐在中间，脸上满是慈祥的笑容；父母年轻而充满活力；孩子们则好奇地看着镜头。\n\n墙上挂着毛主席的画像，桌上摆着搪瓷缸和暖水瓶，这些都是那个年代特有的印记。虽然生活并不富裕，但一家人在一起就是最大的幸福。\n\n如今，照片中的有些人已经离开了，但这份温暖的记忆却永远留在了每个人的心中。每当翻看这张照片，仿佛又能闻到年夜饭的香味，听到家人的欢声笑语。'
                ];

                const randomStory = stories[Math.floor(Math.random() * stories.length)];
                
                document.getElementById('storyResult').innerHTML = `<div class="story-content">${randomStory}</div>`;
                showSuccess('故事生成成功！');
            } catch (error) {
                showError('处理失败，请重试', 'story');
            } finally {
                toggleLoader('story', false);
            }
        }

        function saveApiKey() {
            const apiKey = document.getElementById('apiKeyInput').value;
            if (apiKey) {
                localStorage.setItem(`api_key_${selectedProvider}`, apiKey);
                showSuccess('API Key 已保存');
            } else {
                showError('请输入有效的 API Key');
            }
        }

        function toggleLoader(type, show) {
            const loader = document.getElementById(`${type}Loader`);
            const btn = document.getElementById(`${type}Btn`);
            
            if (show) {
                loader.style.display = 'flex';
                btn.style.display = 'none';
            } else {
                loader.style.display = 'none';
                btn.style.display = 'flex';
            }
        }

        function showError(message, type = 'restore') {
            const errorEl = document.getElementById(type === 'story' ? 'storyErrorMsg' : 'errorMsg');
            if (message) {
                errorEl.textContent = message;
                errorEl.style.display = 'block';
            } else {
                errorEl.style.display = 'none';
            }
        }

        function showSuccess(message) {
            const successEl = document.getElementById('successMsg');
            successEl.textContent = message;
            successEl.style.display = 'block';
            
            setTimeout(() => {
                successEl.style.display = 'none';
            }, 3000);
        }

        document.getElementById('storyImageContainer').addEventListener('click', function() {
            document.getElementById('storyFileInput').click();
        });
    </script>
</body>
</html>
