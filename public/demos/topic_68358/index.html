<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>童画星球 - AI涂鸦创作Demo</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');

    :root {
      --bg: #FFFDF7;
      --bg2: #FFF7ED;
      --ink: #2D1B0E;
      --muted: #8B7355;
      --rule: #F0E6D6;
      --accent: #FF6B35;
      --accent2: #4ECDC4;
      --accent3: #FFE66D;
      --font: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #FF6B35 0%, #FFE66D 50%, #4ECDC4 100%);
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .header-logo {
      width: 48px;
      height: 48px;
      background: rgba(255,255,255,0.9);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }
    .header-title {
      color: #fff;
      font-size: 1.5rem;
      font-weight: 900;
      text-shadow: 0 2px 10px rgba(0,0,0,0.15);
    }
    .header-badge {
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 100px;
      padding: 0.4rem 1rem;
      font-size: 0.8rem;
      color: #fff;
      font-weight: 500;
    }

    /* Main Layout */
    .main-container {
      display: flex;
      min-height: calc(100vh - 80px);
    }

    /* Canvas Area */
    .canvas-section {
      flex: 1;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .canvas-wrapper {
      flex: 1;
      background: #fff;
      border: 2px solid var(--rule);
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
      min-height: 400px;
    }

    #drawingCanvas {
      width: 100%;
      height: 100%;
      cursor: crosshair;
      display: block;
    }

    .canvas-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      gap: 1rem;
      pointer-events: none;
    }
    .canvas-placeholder.hidden { display: none; }
    .canvas-placeholder-icon { font-size: 4rem; opacity: 0.5; }
    .canvas-placeholder-text { font-size: 1.1rem; }
    .canvas-placeholder-hint { font-size: 0.85rem; opacity: 0.7; }

    /* AI Magic Bar */
    .ai-magic-bar {
      background: linear-gradient(135deg, #E8FAF7 0%, #FFF9E0 100%);
      border-radius: var(--radius);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      border: 1px solid var(--rule);
    }
    .ai-magic-bar label {
      font-weight: 700;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .ai-magic-btn {
      background: linear-gradient(135deg, var(--accent) 0%, #FF8F5A 100%);
      color: #fff;
      border: none;
      border-radius: 100px;
      padding: 0.6rem 1.5rem;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      font-family: var(--font);
    }
    .ai-magic-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255,107,53,0.3);
    }
    .ai-magic-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .ai-magic-status {
      margin-left: auto;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .ai-magic-status.processing {
      color: var(--accent);
    }

    /* Toolbar */
    .toolbar {
      background: #fff;
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      padding: 1rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .tool-group-label {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 500;
    }

    .brush-btn {
      width: 40px;
      height: 40px;
      border: 2px solid var(--rule);
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: all 0.2s;
    }
    .brush-btn:hover { border-color: var(--accent); }
    .brush-btn.active {
      border-color: var(--accent);
      background: #FFF0E8;
      box-shadow: 0 0 0 3px rgba(255,107,53,0.2);
    }

    .color-picker-wrapper {
      position: relative;
    }
    .color-preview {
      width: 40px;
      height: 40px;
      border: 2px solid var(--rule);
      border-radius: 10px;
      cursor: pointer;
      overflow: hidden;
    }
    .color-preview input {
      width: 60px;
      height: 60px;
      border: none;
      cursor: pointer;
      margin: -10px;
    }

    .size-slider {
      width: 100px;
      accent-color: var(--accent);
    }

    .tool-btn {
      padding: 0.5rem 1rem;
      border: 2px solid var(--rule);
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--ink);
      transition: all 0.2s;
      font-family: var(--font);
    }
    .tool-btn:hover { border-color: var(--accent); }
    .tool-btn.danger { color: #e74c3c; border-color: #e74c3c; }
    .tool-btn.danger:hover { background: #ffeaea; }

    .divider-v {
      width: 1px;
      height: 30px;
      background: var(--rule);
      margin: 0 0.5rem;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: #fff;
      border-left: 1px solid var(--rule);
      padding: 1.5rem;
      overflow-y: auto;
    }

    .sidebar-section {
      margin-bottom: 1.5rem;
    }
    .sidebar-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .template-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.8rem;
    }
    .template-card {
      aspect-ratio: 1;
      border: 2px solid var(--rule);
      border-radius: 12px;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
    }
    .template-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .template-card.active {
      border-color: var(--accent);
      background: #FFF0E8;
    }
    .template-icon { font-size: 2rem; margin-bottom: 0.3rem; }
    .template-name { font-size: 0.75rem; font-weight: 600; color: var(--muted); }

    .sticker-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
    }
    .sticker-btn {
      aspect-ratio: 1;
      border: 1px solid var(--rule);
      border-radius: 8px;
      background: var(--bg);
      cursor: pointer;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .sticker-btn:hover {
      background: var(--bg2);
      transform: scale(1.1);
    }

    .gallery-list {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .gallery-item {
      background: var(--bg);
      border: 1px solid var(--rule);
      border-radius: 10px;
      padding: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .gallery-item:hover {
      border-color: var(--accent);
      background: #FFF9E0;
    }
    .gallery-item-title {
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
    }
    .gallery-item-meta {
      font-size: 0.75rem;
      color: var(--muted);
    }

    /* AI Result Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-content {
      background: #fff;
      border-radius: var(--radius);
      padding: 2rem;
      max-width: 500px;
      width: 90%;
      text-align: center;
      transform: scale(0.9);
      transition: transform 0.3s;
    }
    .modal-overlay.active .modal-content {
      transform: scale(1);
    }
    .modal-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }
    .modal-canvas-wrapper {
      background: var(--bg);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 1rem;
    }
    .modal-canvas-wrapper canvas {
      width: 100%;
      display: block;
    }
    .modal-buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }
    .modal-btn {
      padding: 0.6rem 1.5rem;
      border-radius: 100px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      font-family: var(--font);
    }
    .modal-btn.primary {
      background: linear-gradient(135deg, var(--accent) 0%, #FF8F5A 100%);
      color: #fff;
    }
    .modal-btn.secondary {
      background: var(--bg2);
      color: var(--ink);
      border: 1px solid var(--rule);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--ink);
      color: #fff;
      padding: 0.8rem 1.5rem;
      border-radius: 100px;
      font-size: 0.9rem;
      font-weight: 500;
      z-index: 1001;
      transition: transform 0.3s;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .main-container { flex-direction: column; }
      .sidebar { width: 100%; border-left: none; border-top: 1px solid var(--rule); }
      .template-grid { grid-template-columns: repeat(4, 1fr); }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-brand">
      <div class="header-logo">&#127912;</div>
      <span class="header-title">童画星球</span>
    </div>
    <span class="header-badge">&#10024; AI 涂鸦创作Demo</span>
  </header>

  <div class="main-container">
    <!-- Canvas Area -->
    <section class="canvas-section">
      <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="drawingCanvas"></canvas>
        <div class="canvas-placeholder" id="canvasPlaceholder">
          <div class="canvas-placeholder-icon">&#127912;</div>
          <div class="canvas-placeholder-text">在画布上自由涂鸦创作</div>
          <div class="canvas-placeholder-hint">选择画笔和颜色，开始你的创意之旅</div>
        </div>
      </div>

      <div class="ai-magic-bar">
        <label>&#10024; AI 魔法：</label>
        <button class="ai-magic-btn" id="aiBeautifyBtn" onclick="aiBeautify()">&#x2728; 智能美化</button>
        <button class="ai-magic-btn" id="aiAnimateBtn" onclick="aiAnimate()" style="background: linear-gradient(135deg, var(--accent2) 0%, #6EE7DE 100%);">&#x1F3A5; 涂鸦变动画</button>
        <span class="ai-magic-status" id="aiStatus">AI 已就绪</span>
      </div>

      <div class="toolbar">
        <div class="tool-group">
          <span class="tool-group-label">画笔</span>
          <button class="brush-btn active" data-brush="crayon" title="蜡笔" onclick="selectBrush('crayon')">&#129392;</button>
          <button class="brush-btn" data-brush="watercolor" title="水彩" onclick="selectBrush('watercolor')">&#127912;</button>
          <button class="brush-btn" data-brush="oil" title="油画棒" onclick="selectBrush('oil')">&#128396;</button>
          <button class="brush-btn" data-brush="marker" title="马克笔" onclick="selectBrush('marker')">&#128204;</button>
        </div>

        <div class="divider-v"></div>

        <div class="tool-group">
          <span class="tool-group-label">颜色</span>
          <div class="color-picker-wrapper">
            <div class="color-preview" id="colorPreview" style="background: #FF6B35;">
              <input type="color" id="colorPicker" value="#FF6B35" onchange="changeColor(this.value)">
            </div>
          </div>
          <button class="brush-btn" style="background:#FF6B35;" onclick="setColor('#FF6B35')"></button>
          <button class="brush-btn" style="background:#4ECDC4;" onclick="setColor('#4ECDC4')"></button>
          <button class="brush-btn" style="background:#FFE66D;" onclick="setColor('#FFE66D')"></button>
          <button class="brush-btn" style="background:#9B59B6;" onclick="setColor('#9B59B6')"></button>
          <button class="brush-btn" style="background:#3498DB;" onclick="setColor('#3498DB')"></button>
          <button class="brush-btn" style="background:#2ECC71;" onclick="setColor('#2ECC71')"></button>
          <button class="brush-btn" style="background:#E74C3C;" onclick="setColor('#E74C3C')"></button>
          <button class="brush-btn" style="background:#2D1B0E;" onclick="setColor('#2D1B0E')"></button>
        </div>

        <div class="divider-v"></div>

        <div class="tool-group">
          <span class="tool-group-label">大小</span>
          <input type="range" class="size-slider" id="sizeSlider" min="2" max="30" value="8" oninput="changeSize(this.value)">
          <span id="sizeValue" style="font-size:0.8rem;color:var(--muted);">8px</span>
        </div>

        <div class="divider-v"></div>

        <div class="tool-group">
          <button class="tool-btn" onclick="undo()">&#9102; 撤销</button>
          <button class="tool-btn danger" onclick="clearCanvas()">&#128465; 清空</button>
        </div>
      </div>
    </section>

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-title">&#127912; 创意模板</div>
        <div class="template-grid">
          <div class="template-card" onclick="loadTemplate('animal')">
            <div class="template-icon">&#128054;</div>
            <div class="template-name">动物</div>
          </div>
          <div class="template-card" onclick="loadTemplate('plant')">
            <div class="template-icon">&#127807;</div>
            <div class="template-name">植物</div>
          </div>
          <div class="template-card" onclick="loadTemplate('car')">
            <div class="template-icon">&#128663;</div>
            <div class="template-name">汽车</div>
          </div>
          <div class="template-card" onclick="loadTemplate('space')">
            <div class="template-icon">&#128761;</div>
            <div class="template-name">太空</div>
          </div>
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-title">&#127873; 趣味贴纸</div>
        <div class="sticker-grid">
          <button class="sticker-btn" onclick="addSticker('&#10024;')">&#10024;</button>
          <button class="sticker-btn" onclick="addSticker('&#128150;')">&#128150;</button>
          <button class="sticker-btn" onclick="addSticker('&#127881;')">&#127881;</button>
          <button class="sticker-btn" onclick="addSticker('&#128079;')">&#128079;</button>
          <button class="sticker-btn" onclick="addSticker('&#128148;')">&#128148;</button>
          <button class="sticker-btn" onclick="addSticker('&#127942;')">&#127942;</button>
          <button class="sticker-btn" onclick="addSticker('&#128170;')">&#128170;</button>
          <button class="sticker-btn" onclick="addSticker('&#128172;')">&#128172;</button>
          <button class="sticker-btn" onclick="addSticker('&#127873;')">&#127873;</button>
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-title">&#128444; 我的画廊</div>
        <div class="gallery-list">
          <div class="gallery-item" onclick="showToast('作品已保存到画廊')">
            <div class="gallery-item-title">&#128444; 小星星</div>
            <div class="gallery-item-meta">今天 10:30</div>
          </div>
          <div class="gallery-item" onclick="showToast('作品已保存到画廊')">
            <div class="gallery-item-title">&#128054; 我的小狗</div>
            <div class="gallery-item-meta">今天 09:15</div>
          </div>
          <div class="gallery-item" onclick="showToast('作品已保存到画廊')">
            <div class="gallery-item-title">&#127807; 花园</div>
            <div class="gallery-item-meta">昨天 16:45</div>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <!-- AI Result Modal -->
  <div class="modal-overlay" id="aiModal">
    <div class="modal-content">
      <div class="modal-title" id="modalTitle">&#10024; AI 美化效果</div>
      <div class="modal-canvas-wrapper">
        <canvas id="modalCanvas" width="400" height="300"></canvas>
      </div>
      <div class="modal-buttons">
        <button class="modal-btn secondary" onclick="closeModal()">取消</button>
        <button class="modal-btn primary" onclick="applyAIEffect()">&#10003; 应用效果</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // State
    let currentBrush = 'crayon';
    let currentColor = '#FF6B35';
    let currentSize = 8;
    let isDrawing = false;
    let lastX = 0;
    let lastY = 0;
    let hasDrawn = false;
    let history = [];

    const canvas = document.getElementById('drawingCanvas');
    const ctx = canvas.getContext('2d');
    const placeholder = document.getElementById('canvasPlaceholder');

    // Initialize
    function initCanvas() {
      const wrapper = document.getElementById('canvasWrapper');
      canvas.width = wrapper.clientWidth;
      canvas.height = wrapper.clientHeight;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      redraw();
    }

    function redraw() {
      if (hasDrawn && history.length > 0) {
        const img = new Image();
        img.onload = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0);
        };
        img.src = history[history.length - 1];
      }
    }

    // Save state
    function saveState() {
      history.push(canvas.toDataURL());
      if (history.length > 20) history.shift();
    }

    // Drawing
    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX || e.touches[0].clientX) - rect.left;
      const y = (e.clientY || e.touches[0].clientY) - rect.top;
      return { x, y };
    }

    function startDraw(e) {
      e.preventDefault();
      isDrawing = true;
      const pos = getPos(e);
      lastX = pos.x;
      lastY = pos.y;
      placeholder.classList.add('hidden');
      hasDrawn = true;
    }

    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const pos = getPos(e);

      ctx.strokeStyle = currentColor;
      ctx.lineWidth = currentSize;
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);

      lastX = pos.x;
      lastY = pos.y;
    }

    function endDraw(e) {
      if (isDrawing) {
        isDrawing = false;
        ctx.beginPath();
        saveState();
      }
    }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', endDraw);
    canvas.addEventListener('mouseleave', endDraw);
    canvas.addEventListener('touchstart', startDraw);
    canvas.addEventListener('touchmove', draw);
    canvas.addEventListener('touchend', endDraw);

    // Tools
    function selectBrush(brush) {
      currentBrush = brush;
      document.querySelectorAll('.brush-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.brush === brush);
      });
      // Apply brush effects
      if (brush === 'watercolor') {
        ctx.globalAlpha = 0.4;
        ctx.globalCompositeOperation = 'source-over';
      } else if (brush === 'oil') {
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
      } else {
        ctx.globalAlpha = 1;
      }
    }

    function setColor(color) {
      currentColor = color;
      document.getElementById('colorPicker').value = color;
      document.getElementById('colorPreview').style.background = color;
    }

    function changeColor(color) {
      setColor(color);
    }

    function changeSize(size) {
      currentSize = parseInt(size);
      document.getElementById('sizeValue').textContent = size + 'px';
    }

    function undo() {
      if (history.length > 1) {
        history.pop();
        const img = new Image();
        img.onload = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          if (history.length > 0) {
            ctx.drawImage(img, 0, 0);
          } else {
            placeholder.classList.remove('hidden');
            hasDrawn = false;
          }
        };
        img.src = history.length > 0 ? history[history.length - 1] : '';
      } else {
        history = [];
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        placeholder.classList.remove('hidden');
        hasDrawn = false;
      }
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      history = [];
      placeholder.classList.remove('hidden');
      hasDrawn = false;
    }

    // Templates
    function loadTemplate(type) {
      clearCanvas();
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      ctx.strokeStyle = '#E0E0E0';
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 5]);

      const templateDrawings = {
        animal: function() {
          // 画一个简单的小狗轮廓
          ctx.beginPath();
          ctx.arc(cx, cy - 30, 40, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(cx - 25, cy - 70, 15, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(cx + 25, cy - 70, 15, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.ellipse(cx, cy + 20, 50, 35, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(cx + 50, cy + 20);
          ctx.quadraticCurveTo(cx + 90, cy + 10, cx + 80, cy + 50);
          ctx.stroke();
        },
        plant: function() {
          // 画一朵简单的花
          ctx.beginPath();
          ctx.moveTo(cx, cy + 100);
          ctx.lineTo(cx, cy + 20);
          ctx.stroke();
          for (let i = 0; i < 5; i++) {
            ctx.beginPath();
            ctx.ellipse(cx, cy - 20, 25, 15, (i * Math.PI * 2) / 5, 0, Math.PI * 2);
            ctx.stroke();
          }
          ctx.beginPath();
          ctx.arc(cx, cy - 20, 15, 0, Math.PI * 2);
          ctx.stroke();
        },
        car: function() {
          // 画一辆简单的汽车
          ctx.beginPath();
          ctx.roundRect(cx - 80, cy - 30, 160, 60, 10);
          ctx.stroke();
          ctx.beginPath();
          ctx.roundRect(cx - 50, cy - 50, 80, 30, 5);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(cx - 45, cy + 30, 18, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(cx + 45, cy + 30, 18, 0, Math.PI * 2);
          ctx.stroke();
        },
        space: function() {
          // 画一个简单的火箭
          ctx.beginPath();
          ctx.moveTo(cx, cy - 80);
          ctx.lineTo(cx - 20, cy);
          ctx.lineTo(cx - 20, cy + 40);
          ctx.lineTo(cx - 40, cy + 60);
          ctx.lineTo(cx + 40, cy + 60);
          ctx.lineTo(cx + 20, cy + 40);
          ctx.lineTo(cx + 20, cy);
          ctx.closePath();
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(cx, cy + 80, 15, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(cx - 30, cy - 40, 10, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(cx + 30, cy - 40, 10, 0, Math.PI * 2);
          ctx.stroke();
        }
      };

      if (templateDrawings[type]) {
        templateDrawings[type]();
        hasDrawn = true;
        placeholder.classList.add('hidden');
        saveState();
        showToast('已加载模板，开始描摹吧！');
      }
    }

    // Stickers
    function addSticker(emoji) {
      hasDrawn = true;
      placeholder.classList.add('hidden');
      const x = canvas.width / 2 + Math.random() * 100 - 50;
      const y = canvas.height / 2 + Math.random() * 100 - 50;
      ctx.font = '40px serif';
      ctx.fillText(emoji, x, y);
      saveState();
      showToast('贴纸已添加');
    }

    // AI Functions
    function aiBeautify() {
      if (!hasDrawn) {
        showToast('请先画点什么');
        return;
      }
      const status = document.getElementById('aiStatus');
      status.textContent = '&#127777; AI 美化中...';
      status.classList.add('processing');
      document.getElementById('aiBeautifyBtn').disabled = true;

      setTimeout(() => {
        const modal = document.getElementById('aiModal');
        const modalCanvas = document.getElementById('modalCanvas');
        const modalCtx = modalCanvas.getContext('2d');
        modalCanvas.width = canvas.width;
        modalCanvas.height = canvas.height;
        modalCtx.drawImage(canvas, 0, 0);

        // Simulate AI beautification
        modalCtx.filter = 'saturate(1.3) contrast(1.1)';
        modalCtx.drawImage(canvas, 0, 0);
        modalCtx.filter = 'none';

        document.getElementById('modalTitle').innerHTML = '&#10024; AI 智能美化效果';
        modal.classList.add('active');
        status.innerHTML = '&#10024; AI 已就绪';
        status.classList.remove('processing');
        document.getElementById('aiBeautifyBtn').disabled = false;
      }, 1500);
    }

    function aiAnimate() {
      if (!hasDrawn) {
        showToast('请先画点什么');
        return;
      }
      const status = document.getElementById('aiStatus');
      status.textContent = '&#127777; AI 生成动画中...';
      status.classList.add('processing');
      document.getElementById('aiAnimateBtn').disabled = true;

      setTimeout(() => {
        const modal = document.getElementById('aiModal');
        const modalCanvas = document.getElementById('modalCanvas');
        const modalCtx = modalCanvas.getContext('2d');
        modalCanvas.width = canvas.width;
        modalCanvas.height = canvas.height;
        modalCtx.drawImage(canvas, 0, 0);

        document.getElementById('modalTitle').innerHTML = '&#x1F3A5; 涂鸦变动画效果预览';
        modal.classList.add('active');
        status.innerHTML = '&#10024; AI 已就绪';
        status.classList.remove('processing');
        document.getElementById('aiAnimateBtn').disabled = false;
      }, 2000);
    }

    function applyAIEffect() {
      const modalCanvas = document.getElementById('modalCanvas');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(modalCanvas, 0, 0, canvas.width, canvas.height);
      saveState();
      closeModal();
      showToast('&#10004; AI 效果已应用');
    }

    function closeModal() {
      document.getElementById('aiModal').classList.remove('active');
    }

    // Toast
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerHTML = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // Resize
    window.addEventListener('resize', () => {
      const img = canvas.toDataURL();
      initCanvas();
      const tempImg = new Image();
      tempImg.onload = () => {
        ctx.drawImage(tempImg, 0, 0, canvas.width, canvas.height);
      };
      tempImg.src = img;
    });

    // Init
    initCanvas();
    saveState();
  </script>

</body>
</html>
