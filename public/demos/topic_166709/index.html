    return;
    var content = document.getElementById('interior-overlay-content');
    var html = '';

    html += '<div class="panel-card" style="max-width:400px;margin:0 auto;">';
    html += '<div class="panel-header"><span class="panel-header__title">🛒 市场采购</span></div>';
    html += '<p style="color:var(--dim);font-size:11px;margin-bottom:6px;">当前持有: <span style="color:var(--gold);">' + state.money + ' 旧币</span></p>';

    // 当前库存
    html += '<div style="margin-bottom:8px;padding:6px;background:var(--bg3);border-radius:4px;font-size:11px;color:var(--accent);">';
    html += '🌾 现有食材: 面粉' + (state.ingredients.flour || 0) + ' 肉' + (state.ingredients.meat || 0) + ' 菜' + (state.ingredients.veg || 0) + ' 调料' + (state.ingredients.spice || 0);
    html += '</div>';

    // 今日菜单所需食材（提示）
    var menuNeeds = { flour: 0, meat: 0, veg: 0, spice: 0 };
    for (var chenSi = 0; chenSi < state._chenMenu.length; chenSi++) {
      var chenSid = state._chenMenu[chenSi];
      for (var chenSj = 0; chenSj < RECIPES.length; chenSj++) {
        if (RECIPES[chenSj].id === chenSid) {
          menuNeeds.flour += RECIPES[chenSj].flour;
          menuNeeds.meat += RECIPES[chenSj].meat;
          menuNeeds.veg += RECIPES[chenSj].veg;
          menuNeeds.spice += RECIPES[chenSj].spice;
          break;
        }
      }
    }
    html += '<div style="margin-bottom:6px;font-size:11px;color:var(--muted);">每份食材可做5份面，建议至少买各' + Math.max(1, menuNeeds.flour) + '份</div>';

    // 食材选择
    if (!state._chenShoppingQty) {
      state._chenShoppingQty = { flour: 0, meat: 0, veg: 0, spice: 0 };
    }

    var ingKeys = ['flour', 'meat', 'veg', 'spice'];
    for (var chenIk = 0; chenIk < ingKeys.length; chenIk++) {
      var chenKey = ingKeys[chenIk];
      var chenInfo = INGREDIENT_INFO[chenKey];
      var chenQty = state._chenShoppingQty[chenKey] || 0;
      html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 6px;border-bottom:1px solid var(--rule);">';
      html += '<div><span>' + chenInfo.icon + ' ' + chenInfo.name + '</span>';
      html += '<span style="font-size:10px;color:var(--dim);margin-left:6px;">' + chenInfo.price + '旧币/份</span></div>';
      html += '<div style="display:flex;align-items:center;gap:6px;">';
      html += '<button class="btn btn-sm" onclick="Game.chenShoppingAdjust(\'' + chenKey + '\', -1)" style="font-size:14px;width:28px;height:28px;padding:0;">−</button>';
      html += '<span style="width:28px;text-align:center;font-size:14px;font-weight:bold;" id="chen-qty-' + chenKey + '">' + chenQty + '</span>';
      html += '<button class="btn btn-sm" onclick="Game.chenShoppingAdjust(\'' + chenKey + '\', 1)" style="font-size:14px;width:28px;height:28px;padding:0;">+</button>';
      html += '</div></div>';
    }

    // 总计和确认按钮
    html += '<div style="margin-top:10px;padding:6px;font-size:13px;text-align:center;">';
    html += '总计: <span id="chen-shopping-total" style="color:var(--gold);font-weight:bold;">0</span> 旧币';
    html += '</div>';
    html += '<div style="display:flex;gap:8px;margin-top:4px;">';
    html += '<button class="btn btn-sm" onclick="Game.showRestaurantPanel()" style="flex:1;">← 返回</button>';
    html += '<button class="btn btn-sm btn-primary" onclick="Game.chenBuyIngredients()" id="chen-buy-btn" style="flex:1;">✅ 确认购买</button>';
    html += '</div>';

    html += '</div>';
    content.innerHTML = html;
    document.getElementById('interior-overlay').classList.add('active');
    interiorOverlay = 'market';
    chenUpdateShoppingTotal();
  }

  function chenShoppingAdjust(key, delta) {
    if (!state._chenShoppingQty) state._chenShoppingQty = { flour: 0, meat: 0, veg: 0, spice: 0 };
    var qty = (state._chenShoppingQty[key] || 0) + delta;
    if (qty < 0) qty = 0;
    if (qty > 99) qty = 99;
    state._chenShoppingQty[key] = qty;
    var el = document.getElementById('chen-qty-' + key);
    if (el) el.textContent = qty;
    chenUpdateShoppingTotal();
  }

  function chenUpdateShoppingTotal() {
    var total = 0;
    if (!state._chenShoppingQty) return;
    for (var chenGk in state._chenShoppingQty) {
      if (state._chenShoppingQty[chenGk] > 0) {
        var ingInfo = INGREDIENT_INFO[chenGk];
        if (ingInfo) {
          total += ingInfo.price * state._chenShoppingQty[chenGk];
        }
      }
    }
    var totalEl = document.getElementById('chen-shopping-total');
    if (totalEl) totalEl.textContent = total;
    var buyBtn = document.getElementById('chen-buy-btn');
    if (buyBtn) {
      if (total <= 0) {
        buyBtn.textContent = '选点东西吧';
        buyBtn.disabled = true;
      } else if (total > state.money) {
        buyBtn.textContent = '钱不够 (' + total + ' 旧币)';
        buyBtn.disabled = true;
      } else {
        buyBtn.textContent = '✅ 确认购买 (' + total + ' 旧币)';
        buyBtn.disabled = false;
      }
    }
  }

  function chenBuyIngredients() {
    if (!state._chenShoppingQty) return;
    var totalCost = 0;
    for (var chenGk in state._chenShoppingQty) {
      if (state._chenShoppingQty[chenGk] > 0) {
        var ingInfo = INGREDIENT_INFO[chenGk];
        if (ingInfo) {
          totalCost += ingInfo.price * state._chenShoppingQty[chenGk];
        }
      }
    }
    if (totalCost <= 0) { showNotification('请选择要购买的食材。', 1500); return; }
    if (state.money < totalCost) { showNotification('钱不够！', 1500); return; }

    state.money -= totalCost;
    for (var chenGk2 in state._chenShoppingQty) {
      if (state._chenShoppingQty[chenGk2] > 0) {
        state.ingredients[chenGk2] = (state.ingredients[chenGk2] || 0) + state._chenShoppingQty[chenGk2];
      }
    }
    state._chenHasBought = true;
    state._chenShoppingQty = { flour: 0, meat: 0, veg: 0, spice: 0 };
    showNotification('采购完成，花了 ' + totalCost + ' 旧币！', 2000);
    renderStatusBar();
    showRestaurantPanel();
  }

  function chenStartCooking(recipeId) {
    // 查找食谱
    var chenRecipe = null;
    for (var chenCi = 0; chenCi < RECIPES.length; chenCi++) {
      if (RECIPES[chenCi].id === recipeId) { chenRecipe = RECIPES[chenCi]; break; }
    }
    if (!chenRecipe) { showNotification('未知食谱。', 1500); return; }

    // 每次烹饪做5份，消耗5倍食材
    var portions = 5;
    if ((state.ingredients.flour || 0) < chenRecipe.flour * portions ||
        (state.ingredients.meat || 0) < chenRecipe.meat * portions ||
        (state.ingredients.veg || 0) < chenRecipe.veg * portions ||
        (state.ingredients.spice || 0) < chenRecipe.spice * portions) {
      showNotification('食材不足！需要 ' + (chenRecipe.flour * portions) + '面粉 ' + (chenRecipe.meat * portions) + '肉 ' + (chenRecipe.veg * portions) + '菜 ' + (chenRecipe.spice * portions) + '调料。', 2000);
      return;
    }

    // 消耗食材
    state.ingredients.flour -= chenRecipe.flour * portions;
    state.ingredients.meat -= chenRecipe.meat * portions;
    state.ingredients.veg -= chenRecipe.veg * portions;
    state.ingredients.spice -= chenRecipe.spice * portions;

    // 设置烹饪状态
    state._chenCookingRecipe = chenRecipe;
    state._chenCookingPortions = portions;
    state._chenCookingStep = 1; // 开始备料
    _chenGameScore = { chopping: 0, heat: 0, seasoning: 0 };
    _chenGameData = {};

    showNotification('开始烹饪 ' + chenRecipe.name + '（做5份）！', 1500);
    showKitchenPanel();
  }

  function chenRenderCookingGame() {
    var chenRecipe = state._chenCookingRecipe;
    if (!chenRecipe) return '<p style="color:var(--danger);">烹饪数据异常</p>';

    var stepLabels = ['备料', '烹饪', '调味'];
    var stepIcons = ['🔪', '🔥', '🧂'];
    var stepNames = ['Step 1: 备料', 'Step 2: 烹饪', 'Step 3: 调味'];
    var stepDesc = ['快速点击下落的食材！', '在绿色区域按下！', '选择正确的调料！'];

    var html = '<div class="chen-cooking-container">';

    // 进度条
    html += '<div class="chen-cooking-progress">';
    for (var chenPi = 1; chenPi <= 3; chenPi++) {
      var pClass = 'chen-progress-step';
      if (chenPi < state._chenCookingStep) pClass += ' done';
      else if (chenPi === state._chenCookingStep) pClass += ' active';
      html += '<div class="' + pClass + '">' + stepIcons[chenPi - 1] + '</div>';
    }
    html += '</div>';

    // 食谱名称
    html += '<div class="chen-cooking-recipe-name">' + chenRecipe.name + '</div>';

    // 当前步骤
    var step = state._chenCookingStep;
    html += '<div class="chen-cooking-step">' + stepNames[step - 1] + '</div>';
    html += '<div class="chen-cooking-hint">' + stepDesc[step - 1] + '</div>';

    if (step === 1) {
      // Step 1: 备料 - 砍切QTE
      html += chenRenderChoppingGame();
    } else if (step === 2) {
      // Step 2: 烹饪 - 火力控制
      html += chenRenderHeatGame();
    } else if (step === 3) {
      // Step 3: 调味 - 选择调料
      html += chenRenderSeasoningGame();
    } else if (step >= 4) {
      // 完成！
      html += chenRenderCookingResult();
    }

    html += '</div>';
    return html;
  }

  // ===== Step 1: 备料 (Chopping QTE) =====
  function chenRenderChoppingGame() {
    var html = '';
    html += '<div id="chen-chopping-area" class="chen-cooking-area" onclick="Game.chenChoppingHit()">';
    html += '<div class="chen-chopping-target"></div>';
    html += '<div id="chen-chopping-falling" class="chen-chopping-fall" style="top:0;left:50%;">🥬</div>';
    html += '<div id="chen-chopping-result" class="chen-chopping-result" style="display:none;"></div>';
    html += '</div>';
    html += '<div style="font-size:12px;color:var(--dim);margin-top:4px;">点击食材切菜！命中: <span id="chen-chopping-hit">0</span>/5</div>';
    html += '<div style="font-size:11px;color:var(--muted);margin-top:2px;">完成5次精准切割进入下一步</div>';
    return html;
  }

  function chenChoppingHit() {
    if (state._chenCookingStep !== 1) return;
    var falling = document.getElementById('chen-chopping-falling');
    var result = document.getElementById('chen-chopping-result');
    var area = document.getElementById('chen-chopping-area');

    // 每次点击都算一次切菜，简单可靠
    _chenGameScore.chopping = (_chenGameScore.chopping || 0) + 1;

    // 更新命中计数
    var hitEl = document.getElementById('chen-chopping-hit');
    if (hitEl) hitEl.textContent = _chenGameScore.chopping;

    if (result) {
      result.textContent = '✅ 切菜！(' + _chenGameScore.chopping + '/5)';
      result.style.display = 'block';
      result.style.color = 'var(--success)';
    }

    // 重置食材位置（视觉反馈）
    if (falling) {
      falling.style.top = '0px';
      var icons = ['🥬', '🥕', '🧅', '🌶️', '🧄'];
      falling.textContent = icons[Math.floor(Math.random() * icons.length)];
    }

    // 隐藏结果文字
    setTimeout(function() {
      if (result) result.style.display = 'none';
    }, 300);

    // 检查是否完成
    if (_chenGameScore.chopping >= 5) {
      _chenGameScore.chopping = 5;
      state._chenCookingStep = 2;
      if (_chenChoppingInterval) {
        clearInterval(_chenChoppingInterval);
        _chenChoppingInterval = null;
      }
      showNotification('✅ 备料完成！开始烹饪！', 1000);
      setTimeout(function() { showKitchenPanel(); }, 500);
    }
  }

  function chenStartChoppingAnimation() {
    if (_chenChoppingInterval) {
      clearInterval(_chenChoppingInterval);
      _chenChoppingInterval = null;
    }
    _chenChoppingInterval = setInterval(function() {
      var falling = document.getElementById('chen-chopping-falling');
      if (!falling) return;
      var area = document.getElementById('chen-chopping-area');
      var areaHeight = area ? area.offsetHeight : 120;
      var currentTop = parseFloat(falling.style.top) || 0;
      // 下落速度
      currentTop += 3;
      if (currentTop > areaHeight) {
        currentTop = 0;
      }
      falling.style.top = currentTop + 'px';
    }, 30);
  }

  // ===== Step 2: 烹饪 (Heat Gauge) =====
  function chenRenderHeatGame() {
    var chenRecipe = state._chenCookingRecipe;
    var greenWidth = 'bar-green';
    if (chenRecipe && chenRecipe.quality >= 3) greenWidth += ' tiny';
    else if (chenRecipe && chenRecipe.quality >= 2) greenWidth += ' small';

    var html = '';
    html += '<div id="chen-heat-area" class="chen-cooking-area">';
    html += '<div class="bar-bg"></div>';
    html += '<div id="chen-heat-green" class="' + greenWidth + '" style="left:80px;"></div>';
    html += '<div id="chen-heat-needle" class="bar-needle" style="left:0px;"></div>';
    html += '</div>';
    html += '<div style="font-size:12px;color:var(--dim);margin-top:4px;">得分: <span id="chen-heat-score">0</span>/3</div>';
    html += '<div style="font-size:11px;color:var(--muted);margin-top:2px;">在指针到达绿色区域时点击！完成3次成功</div>';
    html += '<button id="chen-heat-btn" class="chen-cooking-btn" onclick="Game.chenHeatHit()">🔥 点击停火</button>';
    return html;
  }

  function chenHeatHit() {
    if (state._chenCookingStep !== 2) return;
    var needle = document.getElementById('chen-heat-needle');
    var green = document.getElementById('chen-heat-green');

    // 每次点击都算一次火候控制
    _chenGameScore.heat = (_chenGameScore.heat || 0) + 1;

    // 检查是否在绿色区域中（如果DOM存在）
    if (needle && green) {
      var needleLeft = parseFloat(needle.style.left) || 0;
      var greenLeft = parseFloat(green.style.left) || 0;
      var greenWidth = green.offsetWidth || 60;
      if (needleLeft >= greenLeft && needleLeft <= greenLeft + greenWidth) {
        showNotification('🔥 火候完美！(' + _chenGameScore.heat + '/3)', 800);
      } else {
        showNotification('❌ 火候不对！', 600);
      }
    } else {
      showNotification('🔥 火候尝试！(' + _chenGameScore.heat + '/3)', 800);
    }

    // 更新得分
    var scoreEl = document.getElementById('chen-heat-score');
    if (scoreEl) scoreEl.textContent = _chenGameScore.heat;

    if (_chenGameScore.heat >= 3) {
      _chenGameScore.heat = 3;
      state._chenCookingStep = 3;
      if (_chenHeatInterval) {
        clearInterval(_chenHeatInterval);
        _chenHeatInterval = null;
      }
      showNotification('✅ 烹饪完成！开始调味！', 1000);
      setTimeout(function() { showKitchenPanel(); }, 500);
    }
  }

  function chenStartHeatAnimation() {
    if (_chenHeatInterval) {
      clearInterval(_chenHeatInterval);
      _chenHeatInterval = null;
    }
    _chenHeatInterval = setInterval(function() {
      var needle = document.getElementById('chen-heat-needle');
      var area = document.getElementById('chen-heat-area');
      if (!needle || !area) return;
      var areaWidth = area.offsetWidth - 4;
      var currentLeft = parseFloat(needle.style.left) || 0;
      var direction = _chenGameData.heatDir || 1;
      currentLeft += direction * 3;
      if (currentLeft >= areaWidth) {
        currentLeft = areaWidth;
        _chenGameData.heatDir = -1;
      } else if (currentLeft <= 0) {
        currentLeft = 0;
        _chenGameData.heatDir = 1;
      }
      needle.style.left = currentLeft + 'px';
    }, 20);
  }

  // ===== Step 3: 调味 (Seasoning Choice) =====
  function chenRenderSeasoningGame() {
    var chenRecipe = state._chenCookingRecipe;
    // 确定正确答案
    var allSeasonings = ['盐', '酱油', '辣椒', '醋', '糖', '味精'];
    var correctSeasoning = '盐';
    if (chenRecipe) {
      if (chenRecipe.id === 'meat') correctSeasoning = '酱油';
      else if (chenRecipe.id === 'special') correctSeasoning = '辣椒';
    }
    // 随机选3个选项，确保包含正确答案
    var options = [correctSeasoning];
    var others = [];
    for (var chenOi = 0; chenOi < allSeasonings.length; chenOi++) {
      if (allSeasonings[chenOi] !== correctSeasoning) others.push(allSeasonings[chenOi]);
    }
    // 打乱
    while (options.length < 3 && others.length > 0) {
      var randIdx = Math.floor(Math.random() * others.length);
      options.push(others.splice(randIdx, 1)[0]);
    }
    // 再打乱选项顺序
    for (var chenShuf = options.length - 1; chenShuf > 0; chenShuf--) {
      var chenJ = Math.floor(Math.random() * (chenShuf + 1));
      var chenTmp = options[chenShuf];
      options[chenShuf] = options[chenJ];
      options[chenJ] = chenTmp;
    }

    _chenGameData.seasoningOptions = options;
    _chenGameData.correctSeasoning = correctSeasoning;
    _chenGameData.seasoningAnswered = false;
    _chenGameData.seasoningTimeLeft = 5;

    var html = '';
    html += '<div class="chen-seasoning-timer" id="chen-seasoning-timer">5</div>';
    html += '<div class="chen-seasoning-grid" id="chen-seasoning-grid">';
    for (var chenOi2 = 0; chenOi2 < options.length; chenOi2++) {
      html += '<button class="chen-seasoning-btn" id="chen-seasoning-btn-' + chenOi2 + '" onclick="Game.chenSeasoningChoose(' + chenOi2 + ')">' + options[chenOi2] + '</button>';
    }
    html += '</div>';
    html += '<div id="chen-seasoning-result" style="font-size:13px;margin-top:6px;color:var(--dim);"></div>';
    return html;
  }

  function chenSeasoningChoose(idx) {
    if (state._chenCookingStep !== 3) return;
    if (_chenGameData.seasoningAnswered) return;
    _chenGameData.seasoningAnswered = true;

    // 停止倒计时
    if (_chenSeasoningTimeout) {
      clearInterval(_chenSeasoningTimeout);
      _chenSeasoningTimeout = null;
    }

    var chosen = _chenGameData.seasoningOptions[idx];
    var correct = _chenGameData.correctSeasoning;

    // 禁用所有按钮
    for (var chenBi = 0; chenBi < 3; chenBi++) {
      var btn = document.getElementById('chen-seasoning-btn-' + chenBi);
      if (btn) {
        btn.disabled = true;
        if (chenBi === idx) {
          btn.classList.add(chosen === correct ? 'correct' : 'wrong');
        } else if (_chenGameData.seasoningOptions[chenBi] === correct) {
          btn.classList.add('correct');
        }
      }
    }

    var resultEl = document.getElementById('chen-seasoning-result');
    if (chosen === correct) {
      _chenGameScore.seasoning = 1;
      if (resultEl) {
        resultEl.textContent = '✅ 调味精准！' + correct + '放得恰到好处！';
        resultEl.style.color = 'var(--success)';
      }
      showNotification('✅ 调味完美！', 1000);
    } else {
      _chenGameScore.seasoning = 0;
      if (resultEl) {
        resultEl.textContent = '❌ 调味失误...正确应该是 ' + correct;
        resultEl.style.color = 'var(--danger)';
      }
      showNotification('❌ 调味不太对...', 1000);
    }

    // 2秒后完成
    setTimeout(function() {
      state._chenCookingStep = 4; // 完成
      showKitchenPanel();
    }, 1500);
  }

  function chenStartSeasoningTimer() {
    if (_chenSeasoningTimeout) {
      clearInterval(_chenSeasoningTimeout);
    }
    _chenGameData.seasoningTimeLeft = 5;
    _chenSeasoningTimeout = setInterval(function() {
      _chenGameData.seasoningTimeLeft--;
      var timerEl = document.getElementById('chen-seasoning-timer');
      if (timerEl) timerEl.textContent = _chenGameData.seasoningTimeLeft;

      if (_chenGameData.seasoningTimeLeft <= 0) {
        clearInterval(_chenSeasoningTimeout);
        _chenSeasoningTimeout = null;
        // 超时，自动选择错误
        if (!_chenGameData.seasoningAnswered) {
          _chenGameData.seasoningAnswered = true;
          // 禁用所有按钮
          for (var chenBi2 = 0; chenBi2 < 3; chenBi2++) {
            var btn = document.getElementById('chen-seasoning-btn-' + chenBi2);
            if (btn) btn.disabled = true;
          }
          _chenGameScore.seasoning = 0;
          var resultEl = document.getElementById('chen-seasoning-result');
          if (resultEl) {
            resultEl.textContent = '⏰ 时间到！正确应该是 ' + _chenGameData.correctSeasoning;
            resultEl.style.color = 'var(--danger)';
          }
          setTimeout(function() {
            state._chenCookingStep = 4;
            showKitchenPanel();
          }, 1500);
        }
      }
    }, 1000);
  }

  // ===== Cooking Result =====
  function chenRenderCookingResult() {
    var chenRecipe = state._chenCookingRecipe;
    var totalScore = _chenGameScore.chopping + _chenGameScore.heat + _chenGameScore.seasoning;
    var maxScore = 5 + 3 + 1; // 9
    var quality = '普通';
    var qualityIcon = '🍜';
    var qualityColor = 'var(--dim)';
    var bonusPercent = 0;

    if (totalScore >= 8) {
      quality = '完美';
      qualityIcon = '🌟';
      qualityColor = 'var(--gold)';
      bonusPercent = 30;
    } else if (totalScore >= 6) {
      quality = '优秀';
      qualityIcon = '✨';
      qualityColor = 'var(--success)';
      bonusPercent = 15;
    } else if (totalScore >= 4) {
      quality = '良好';
      qualityIcon = '👍';
      qualityColor = 'var(--accent)';
      bonusPercent = 5;
    }

    var basePrice = chenRecipe ? chenRecipe.price : 10;
    var finalPrice = Math.round(basePrice * (1 + bonusPercent / 100));

    var html = '';
    html += '<div class="chen-result-box">';
    html += '<div class="chen-result-icon">' + qualityIcon + '</div>';
    html += '<div class="chen-result-label" style="color:' + qualityColor + ';">' + chenRecipe.name + ' - ' + quality + '</div>';
    html += '<div class="chen-result-detail">';
    html += '备料: ' + _chenGameScore.chopping + '/5 | ';
    html += '火候: ' + _chenGameScore.heat + '/3 | ';
    html += '调味: ' + (_chenGameScore.seasoning ? '✓' : '✗');
    html += '</div>';
    html += '<div class="chen-result-detail">';
    html += '每份售价: ' + basePrice + ' → ' + finalPrice + ' 旧币 (品质加成 +' + bonusPercent + '%)';
    html += '</div>';

    // 放入保温柜
    html += '<div style="margin-top:10px;font-size:12px;color:var(--success);">✅ 已放入保温柜 5 份</div>';

    html += '<div style="display:flex;gap:8px;margin-top:12px;justify-content:center;">';
    html += '<button class="chen-cooking-btn" onclick="Game.chenFinishCooking()">✅ 完成烹饪</button>';
    html += '</div>';
    html += '</div>';

    return html;
  }

  function chenFinishCooking() {
    var chenRecipe = state._chenCookingRecipe;
    if (!chenRecipe) { showNotification('烹饪数据异常', 1500); return; }

    // 计算品质加成后的价格
    var totalScore = _chenGameScore.chopping + _chenGameScore.heat + _chenGameScore.seasoning;
    var bonusPercent = 0;
    if (totalScore >= 8) bonusPercent = 30;
    else if (totalScore >= 6) bonusPercent = 15;
    else if (totalScore >= 4) bonusPercent = 5;
    var finalPrice = Math.round(chenRecipe.price * (1 + bonusPercent / 100));

    var savedName = chenRecipe.name;

    // 放入保温柜（5份）
    for (var chenPi = 0; chenPi < 5; chenPi++) {
      state.foodContainer.push({
        recipeId: chenRecipe.id,
        recipeName: chenRecipe.name,
        price: finalPrice
      });
    }

    // 重置烹饪状态
    state._chenCookingStep = 0;
    state._chenCookingRecipe = null;
    state._chenCookingPortions = 0;
    _chenGameScore = { chopping: 0, heat: 0, seasoning: 0 };
    _chenGameData = {};

    showNotification('✅ ' + savedName + '（5份）已放入保温柜！品质加成 +' + bonusPercent + '%', 2000);
    renderStatusBar();
    showKitchenPanel();
  }

  // ===== Cook Recipe (legacy, kept for backward compatibility) =====
  function cookRecipe(recipeId) {
    // 支持数字索引（0=素面, 1=肉丝面, 2=招牌面）
    if (typeof recipeId === 'number') {
      if (recipeId >= 0 && recipeId < RECIPES.length) {
        recipeId = RECIPES[recipeId].id;
      } else {
        showNotification('未知食谱。', 1500); return;
      }
    }
    var recipe = null;
    for (var i = 0; i < RECIPES.length; i++) {
      if (RECIPES[i].id === recipeId) { recipe = RECIPES[i]; break; }
    }
    if (!recipe) { showNotification('未知食谱。', 1500); return; }

    var portions = 5;
    var flourNeeded = recipe.flour * portions;
    var meatNeeded = recipe.meat * portions;
    var vegNeeded = recipe.veg * portions;
    var spiceNeeded = recipe.spice * portions;

    if ((state.ingredients.flour || 0) < flourNeeded ||
        (state.ingredients.meat || 0) < meatNeeded ||
        (state.ingredients.veg || 0) < vegNeeded ||
        (state.ingredients.spice || 0) < spiceNeeded) {
      showNotification('食材不足！至少需要面粉x' + flourNeeded + '等。', 1500);
      return;
    }

    // Consume ingredients
    state.ingredients.flour -= flourNeeded;
    state.ingredients.meat -= meatNeeded;
    state.ingredients.veg -= vegNeeded;
    state.ingredients.spice -= spiceNeeded;

    // 加到保温柜（每份食物记录食谱信息）
    for (var pi = 0; pi < 5; pi++) {
      state.foodContainer.push({ recipeId: recipe.id, recipeName: recipe.name, price: recipe.price });
    }

    showNotification('做了5份' + recipe.name + '，放入保温柜。', 2000);
    renderStatusBar();
    showKitchenPanel();
  }

  // ===== Serve Food to Customer =====
  function serveFood(customerId) {
    var customer = null;
    for (var i = 0; i < state.customers.length; i++) {
      if (state.customers[i].id === customerId) { customer = state.customers[i]; break; }
    }
    if (!customer) { showNotification('没有这个顾客。', 1500); return; }
    if (customer.served) { showNotification('这位顾客已经吃过了。', 1500); return; }
    if (state.foodContainer.length < 1) { showNotification('保温柜没有食物了。', 1500); return; }

    // 从保温柜取1份食物
    var food = state.foodContainer.shift();
    customer.served = true;
    customer.recipeEaten = food.recipeName;
    customer.mealPrice = food.price;
    customer.status = 'eating';
    state.servedToday = (state.servedToday || 0) + 1;
    state.reputation = (state.reputation || 0) + 1;

    showNotification('给了 ' + customer.name + ' 一份食物。', 2000);

    // 顾客吃完后自动变为 paying
    setTimeout(function() {

        customer.status = 'paying';
        showNotification(customer.name + ' 吃完了，等待结账。', 2000);
        updateCustomerLabels();
      }

    updateCustomerLabels();
    renderStatusBar();
    showRestaurantPanel();

  // ===== Exploration System =====
  var _explorationPlayer = { x: 200, y: 200 };
  var _explorationKeys = { w: false, a: false, s: false, d: false };
  var _explorationLoopId = null;
  var _explorationShootCooldown = 0;

  function enterTunnel() {
    stopInteriorLoop();
    state._explorationActive = true;
    state._tunnelOpen = true;
    _explorationPlayer = { x: 200, y: 200 };

    // Tutorial: 首次探索提示
    showTutorialOnce('exploration_rewards', '击杀燃灰可获得灰烬残骸+燃灰核心！每3击杀=1核心，可用于武器附魔。', 5000);

    // Generate initial ash creatures
    state._ashCreatures = [];
    for (var ec = 0; ec < 3; ec++) {
      spawnAshCreature();
    }

    // Show exploration overlay
    var container = document.getElementById('location-content');
    container.innerHTML = '';
    var html = '<div id="exploration-container" style="width:100%;height:100%;position:relative;background:#0a0a0a;overflow:hidden;">';
    html += '<canvas id="exploration-canvas" width="800" height="600" style="width:100%;height:100%;display:block;cursor:crosshair;"></canvas>';
    html += '<div id="exploration-hud" style="position:absolute;top:8px;left:8px;color:var(--muted);font-size:12px;z-index:10;">';
    html += '<div>HP: <span id="exploration-hp" style="color:var(--success);">' + state.playerHp + '/' + state.playerMaxHp + '</span></div>';
    html += '<div>击杀: <span id="exploration-kills" style="color:var(--accent);">' + (state._explorationLog ? state._explorationLog.length : 0) + '</span></div>';
    html += '<div style="margin-top:4px;font-size:10px;color:var(--dim);">WASD移动 | 鼠标点击射击 | 击杀燃灰获得残骸</div>';
    html += '<button class="btn btn-sm" onclick="Game.exitExploration()" style="margin-top:6px;font-size:10px;">← 返回面馆</button>';
    html += '</div>';
    html += '</div>';
    container.innerHTML = html;

    var lh3 = document.getElementById('location-header'); if (lh3) lh3.style.display = 'none';

    // Start exploration loop
    _explorationKeys = { w: false, a: false, s: false, d: false };
    _explorationShootCooldown = 0;
    document.addEventListener('keydown', _explorationKeyDown);
    document.addEventListener('keyup', _explorationKeyUp);
    document.addEventListener('click', _explorationShoot);
    startExplorationLoop();
  }

  function _explorationKeyDown(e) {
    var key = e.key.toLowerCase();
    if (key === 'w') _explorationKeys.w = true;
    if (key === 'a') _explorationKeys.a = true;
    if (key === 's') _explorationKeys.s = true;
    if (key === 'd') _explorationKeys.d = true;
    if (key === 'e') { e.preventDefault(); exitExploration(); }
  }

  function _explorationKeyUp(e) {
    var key = e.key.toLowerCase();
    if (key === 'w') _explorationKeys.w = false;
    if (key === 'a') _explorationKeys.a = false;
    if (key === 's') _explorationKeys.s = false;
    if (key === 'd') _explorationKeys.d = false;
  }

  function _explorationShoot(e) {
    if (_explorationShootCooldown > 0) return;
    var canvas = document.getElementById('exploration-canvas');
    if (!canvas) return;
    var rect = canvas.getBoundingClientRect();
    var scaleX = canvas.width / rect.width;
    var scaleY = canvas.height / rect.height;
    var targetX = (e.clientX - rect.left) * scaleX;
    var targetY = (e.clientY - rect.top) * scaleY;

    _explorationShootCooldown = 15; // frames

    // Check if hit any creature
    var remaining = [];
    for (var i = 0; i < state._ashCreatures.length; i++) {
      var cr = state._ashCreatures[i];
      var dx = targetX - cr.x;
      var dy = targetY - cr.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 25) {
        // Hit!
        if (!state._explorationLog) state._explorationLog = [];
        state._explorationLog.push('ash_residue');
        showNotification('击杀了一只燃灰！获得灰烬残骸。', 1500);
        updateExplorationHUD();
      } else {
        remaining.push(cr);
      }
    }
    state._ashCreatures = remaining;

    // Maybe spawn a new creature
    if (state._ashCreatures.length < 3 && Math.random() < 0.3) {
      spawnAshCreature();
    }
  }

  function spawnAshCreature() {
    var x = rand(50, 750);
    var y = rand(50, 550);
    // Keep away from player
    if (Math.abs(x - _explorationPlayer.x) < 100 && Math.abs(y - _explorationPlayer.y) < 100) {
      x = (x + 400) % 800;
      y = (y + 300) % 600;
    }
    state._ashCreatures.push({
      x: x, y: y,
      hp: 1,
      speed: 0.5 + Math.random() * 0.5,
      dir: Math.random() * Math.PI * 2,
      wanderTimer: 0
    });
  }

  function startExplorationLoop() {
    if (_explorationLoopId) return;
    explorationLoop();
  }

  function stopExplorationLoop() {
    if (_explorationLoopId) {
      cancelAnimationFrame(_explorationLoopId);
      _explorationLoopId = null;
    }
  }

  function explorationLoop() {
    if (!state._explorationActive) return;
    updateExploration();
    renderExploration();
    _explorationLoopId = requestAnimationFrame(explorationLoop);
  }

  function updateExploration() {
    // Player movement
    var dx = 0, dy = 0;
    if (_explorationKeys.w) dy -= 3;
    if (_explorationKeys.s) dy += 3;
    if (_explorationKeys.a) dx -= 3;
    if (_explorationKeys.d) dx += 3;
    if (dx !== 0 && dy !== 0) {
      dx = Math.round(dx / 1.414);
      dy = Math.round(dy / 1.414);
    }
    _explorationPlayer.x = Math.max(10, Math.min(790, _explorationPlayer.x + dx));
    _explorationPlayer.y = Math.max(10, Math.min(590, _explorationPlayer.y + dy));

    // Cooldown
    if (_explorationShootCooldown > 0) _explorationShootCooldown--;

    // Update creatures
    for (var i = 0; i < state._ashCreatures.length; i++) {
      var cr = state._ashCreatures[i];
      cr.wanderTimer--;
      if (cr.wanderTimer <= 0) {
        cr.dir = Math.random() * Math.PI * 2;
        cr.wanderTimer = rand(30, 120);
      }

      // Check if player is close -> chase
      var distToPlayer = Math.sqrt(
        Math.pow(cr.x - _explorationPlayer.x, 2) +
        Math.pow(cr.y - _explorationPlayer.y, 2)
      );
      if (distToPlayer < 120) {
        // Chase player
        var angle = Math.atan2(_explorationPlayer.y - cr.y, _explorationPlayer.x - cr.x);
        cr.x += Math.cos(angle) * cr.speed * 1.5;
        cr.y += Math.sin(angle) * cr.speed * 1.5;
      } else {
        // Wander
        cr.x += Math.cos(cr.dir) * cr.speed;
        cr.y += Math.sin(cr.dir) * cr.speed;
      }

      // Keep in bounds
      cr.x = Math.max(10, Math.min(790, cr.x));
      cr.y = Math.max(10, Math.min(590, cr.y));

      // Check collision with player
      if (distToPlayer < 25) {
        state.playerHp--;
        if (state.playerHp <= 0) {
          state.playerHp = 0;
          showNotification('你被燃灰击倒了...', 2000);
          exitExploration();
          return;
        }
        // Push creature away
        var pushAngle = Math.atan2(cr.y - _explorationPlayer.y, cr.x - _explorationPlayer.x);
        cr.x += Math.cos(pushAngle) * 30;
        cr.y += Math.sin(pushAngle) * 30;
        updateExplorationHUD();
      }
    }

    // Respawn creatures if too few
    while (state._ashCreatures.length < 2) {
      spawnAshCreature();
    }
  }

  function renderExploration() {
    var canvas = document.getElementById('exploration-canvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, 800, 600);

    // Background
    ctx.fillStyle = '#1a1410';
    ctx.fillRect(0, 0, 800, 600);

    // Ground texture
    ctx.fillStyle = '#2a2018';
    for (var gx = 0; gx < 800; gx += 40) {
      for (var gy = 0; gy < 600; gy += 40) {
        if ((gx + gy) % 80 === 0) {
          ctx.fillRect(gx, gy, 40, 40);
        }
      }
    }

    // Draw ruins/obstacles
    ctx.fillStyle = '#3a2a1a';
    ctx.fillRect(100, 80, 60, 40);
    ctx.fillRect(300, 400, 80, 30);
    ctx.fillRect(600, 150, 40, 80);
    ctx.fillRect(500, 450, 70, 40);

    // Draw creatures
    for (var i = 0; i < state._ashCreatures.length; i++) {
      var cr = state._ashCreatures[i];
      // Glowing effect
      var glow = ctx.createRadialGradient(cr.x, cr.y, 0, cr.x, cr.y, 20);
      glow.addColorStop(0, 'rgba(200, 100, 50, 0.6)');
      glow.addColorStop(1, 'rgba(200, 100, 50, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(cr.x, cr.y, 20, 0, Math.PI * 2);
      ctx.fill();

      // Creature body
      ctx.fillStyle = '#4a2a1a';
      ctx.beginPath();
      ctx.arc(cr.x, cr.y, 10, 0, Math.PI * 2);
      ctx.fill();

      // Eyes
      ctx.fillStyle = '#e87c3a';
      ctx.beginPath();
      ctx.arc(cr.x - 4, cr.y - 3, 3, 0, Math.PI * 2);
      ctx.arc(cr.x + 4, cr.y - 3, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    // Draw player
    ctx.fillStyle = '#7ca8e8';
    ctx.beginPath();
    ctx.arc(_explorationPlayer.x, _explorationPlayer.y, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#e8e6e3';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('你', _explorationPlayer.x, _explorationPlayer.y + 4);

    // Crosshair following mouse
    // (implicit via click)
  }

  function updateExplorationHUD() {
    var hpEl = document.getElementById('exploration-hp');
    if (hpEl) hpEl.textContent = state.playerHp + '/' + state.playerMaxHp;
    var killsEl = document.getElementById('exploration-kills');
    if (killsEl) killsEl.textContent = state._explorationLog ? state._explorationLog.length : 0;
  }

  function exitExploration() {
    state._explorationActive = false;
    stopExplorationLoop();
    document.removeEventListener('keydown', _explorationKeyDown);
    document.removeEventListener('keyup', _explorationKeyUp);
    document.removeEventListener('click', _explorationShoot);

    var lh4 = document.getElementById('location-header'); if (lh4) lh4.style.display = 'flex';

    // Count kills
    var killCount = 0;
    if (state._explorationLog) {
      for (var ki = 0; ki < state._explorationLog.length; ki++) {
        if (state._explorationLog[ki] === 'ash_residue') { killCount++; }
      }
    }
    state._explorationLog = [];

    // === New Exploration Rewards (裂缝三修复) ===

    // 1. Always: 旧币奖励（直接收入）
    var coinReward = rand(10, 30);
    state.money += coinReward;

    // 2. Always: 变异食材（稀有食谱原料，探索专属）
    var mutantIngredient = rand(1, 2);
    state.ingredients.veg = (state.ingredients.veg || 0) + mutantIngredient;

    // 3. Per 3 kills: 灰烬残骸 (for disassembly) + 燃灰核心 (new: weapon enchantment)
    var residueGained = Math.floor(killCount / 3);
    if (residueGained > 0) {
      for (var ri = 0; ri < residueGained; ri++) {
        state._explorationLog.push('ash_residue');
      }
      state._ashCores = (state._ashCores || 0) + residueGained;
    }

    // 4. Lucky: 军用零件（探索专属，精度60-80，远高于废品站零件）
    if (killCount >= 3 && Math.random() < 0.5 && window.DarkFurnace) {
      var militaryPart = window.DarkFurnace.generateRandomScrap();
      militaryPart.precision = Math.min(95, 60 + Math.floor(Math.random() * 21));
      militaryPart.durability = Math.min(95, 60 + Math.floor(Math.random() * 21));
      militaryPart.rustLevel = 'none';
      militaryPart.name = '军用' + militaryPart.name;
      if (!state._militaryParts) state._militaryParts = [];
      state._militaryParts.push(militaryPart);
    }

    // Build reward summary
    var rewardMsg = '探索归来！';
    rewardMsg += ' 旧币+' + coinReward;
    if (mutantIngredient > 0) rewardMsg += ' 变异食材+' + mutantIngredient;
    if (residueGained > 0) rewardMsg += ' 灰烬残骸+' + residueGained + ' 燃灰核心+' + residueGained;
    if (state._militaryParts && state._militaryParts.length > 0) {
      var lastPart = state._militaryParts[state._militaryParts.length - 1];
      if (lastPart && lastPart.precision >= 60) rewardMsg += ' 军用零件获取!';
    }
    showNotification(rewardMsg, 3000);

    // Return to restaurant
    var container = document.getElementById('location-content');
    renderRestaurant(container);
    showNotification('从暗道回到了面馆。', 2000);
  }

  function checkoutAll() {
    var payingCustomers = [];
    for (var pci2 = 0; pci2 < state.customers.length; pci2++) {
      if (state.customers[pci2].status === 'paying') {
        payingCustomers.push(state.customers[pci2]);
      }

    var totalIncome = 0;
    for (var cpi2 = 0; cpi2 < payingCustomers.length; cpi2++) {
      var pc = payingCustomers[cpi2];
      var income = pc.mealPrice || 10;
      totalIncome += income;
      state.money += income;
      state._todayIncome = (state._todayIncome || 0) + income;
      state.reputation = (state.reputation || 0) + 1;
      // 偏好小费

        state.money += 3;

            state.tableDirty[state.customers[ci].tableId] = true;
          }
          state.customers.splice(ci, 1);
        }
      }
      updateCustomerLabels();
    }, 2000);
  }

  function drawCustomerSprite(canvas, customerIndex, isSuspicious) {

    ctx.clearRect(0, 0, W, H);

    // Color variants for different customers
    var colors = [
      { body: '#4a7ab5', hair: '#8a6a3a', skin: '#d4c4a8' },
      { body: '#b56a4a', hair: '#3a2a1a', skin: '#e8d4b8' },
      { body: '#6a8a4a', hair: '#6a5a3a', skin: '#d0c0a8' },
      { body: '#8a4a8a', hair: '#2a1a2a', skin: '#dcc8b0' },
      { body: '#c07040', hair: '#5a4a3a', skin: '#f0d8b0' },
      { body: '#4a8a8a', hair: '#4a3a2a', skin: '#d4c8b0' }
    ];
    var pal = colors[customerIndex % colors.length];

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse ? ctx.ellipse(16, 38, 10, 3, 0, 0, Math.PI * 2) : ctx.arc(16, 38, 6, 0, Math.PI * 2);
    ctx.fill();

    // Legs
    ctx.fillStyle = '#3a4a5a';
    ctx.fillRect(9, 32, 5, 6);
    ctx.fillRect(18, 32, 5, 6);

    // Shoes
    ctx.fillStyle = '#2a2a2a';
    ctx.fillRect(8, 37, 7, 3);
    ctx.fillRect(17, 37, 7, 3);

    // Body (colored shirt)
    ctx.fillStyle = pal.body;
    ctx.fillRect(7, 14, 18, 20);

    // Arms
    ctx.fillStyle = pal.skin;
    ctx.fillRect(4, 17, 4, 8);
    ctx.fillRect(24, 17, 4, 8);

    // Head
    ctx.fillStyle = pal.skin;
    ctx.fillRect(9, 3, 14, 12);

    // Hair
    ctx.fillStyle = pal.hair;
    ctx.fillRect(8, 1, 16, 5);
    ctx.fillRect(7, 3, 18, 3);

    // Eyes
    ctx.fillStyle = '#fff';
    ctx.fillRect(11, 7, 3, 3);
    ctx.fillRect(18, 7, 3, 3);
    ctx.fillStyle = '#222';
    ctx.fillRect(12, 8, 2, 2);
    ctx.fillRect(19, 8, 2, 2);

    // Mouth
    ctx.fillStyle = '#8a6a5a';
    ctx.fillRect(14, 12, 4, 1);

    // Suspicious customer: dark hat and coat overlay
    if (isSuspicious) {
      // Dark hat
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(6, 0, 20, 5);
      ctx.fillRect(5, 2, 22, 3);
      // Dark coat overlay
      ctx.fillStyle = 'rgba(20,20,20,0.6)';
      ctx.fillRect(7, 14, 18, 20);
      // Dark sunglasses
      ctx.fillStyle = '#111';
      ctx.fillRect(10, 7, 5, 3);
      ctx.fillRect(17, 7, 5, 3);
    }
  }

  // ===== Update Customer Labels on Restaurant Map =====
  function updateCustomerLabels() {
    var container = document.getElementById('interior-restaurant');
    if (!container) return;

    // Remove existing customer labels
    var oldLabels = container.querySelectorAll('.customer-label');
    oldLabels.forEach(function(el) { el.remove(); });

    // Get zone positions
    var tableZones = RESTAURANT_ZONES.filter(function(z) { return z.action === 'serve'; });
    var doorZone = RESTAURANT_ZONES.find(function(z) { return z.action === 'exit'; });
    var counterZone = RESTAURANT_ZONES.find(function(z) { return z.action === 'earnings'; });
    var doorX = doorZone ? doorZone.x + doorZone.w / 2 : 80;
    var doorY = doorZone ? doorZone.y : 490;
    var counterX = counterZone ? counterZone.x + counterZone.w / 2 : 460;
    var counterY = counterZone ? counterZone.y : 70;

    state.customers.forEach(function(c, idx) {
      if (c.status === 'leaving') return;

      var wrapper = document.createElement('div');
      wrapper.className = 'customer-label';

      var leftPos = 0;
      var topPos = 0;
      var floorX = 0;
      var floorY = 0;
      var statusText = '';
      var statusColor = 'var(--accent)';

      if (c.status === 'entering') {
        var tz = tableZones.find(function(z) { return z.id === c.tableId; });
        if (tz) {
          leftPos = tz.x + (tz.w - 32) / 2;
          topPos = tz.y - 48;
          floorX = tz.x + tz.w / 2;
          floorY = tz.y + tz.h / 2;
        } else {
          leftPos = doorX - 16;
          topPos = doorY - 56;
          floorX = doorX;
          floorY = doorY;
        }
        statusText = '入座';
        statusColor = 'var(--accent)';
      } else if (c.status === 'seated') {
        var tz = tableZones.find(function(z) { return z.id === c.tableId; });
        if (tz) {
          leftPos = tz.x + (tz.w - 32) / 2;
          topPos = tz.y - 48;
          floorX = tz.x + tz.w / 2;
          floorY = tz.y + tz.h / 2;
        }
        statusText = '等待';
        statusColor = 'var(--warn)';
      } else if (c.status === 'eating') {
        var tz = tableZones.find(function(z) { return z.id === c.tableId; });
        if (tz) {
          leftPos = tz.x + (tz.w - 32) / 2;
          topPos = tz.y - 48;
          floorX = tz.x + tz.w / 2;
          floorY = tz.y + tz.h / 2;
        }
        statusText = '用餐中';
        statusColor = 'var(--success)';
      } else if (c.status === 'paying') {
        leftPos = counterX - 16;
        topPos = counterY - 48;
        floorX = counterX;
        floorY = counterY + 10;
        statusText = '结账';
        statusColor = 'var(--gold)';
      }

      wrapper.style.cssText = 'position:absolute;left:0;top:0;width:0;height:0;z-index:50;pointer-events:none;';

      // Floor dot - colored circle on the restaurant floor at table position
      var dot = document.createElement('div');
      dot.style.cssText = 'position:absolute;left:' + Math.round(floorX - 7) + 'px;top:' + Math.round(floorY - 7) + 'px;width:14px;height:14px;border-radius:50%;background:' + (c.suspicious ? '#e05050' : '#4a9eff') + ';opacity:0.85;z-index:48;pointer-events:none;transition:all 0.8s ease;border:2px solid ' + (c.suspicious ? '#ff2222' : '#88ccff') + ';';
      wrapper.appendChild(dot);

      // Suspicious customer: pulsing danger ring
      if (c.suspicious) {
        var ring = document.createElement('div');
        ring.style.cssText = 'position:absolute;left:' + Math.round(floorX - 11) + 'px;top:' + Math.round(floorY - 11) + 'px;width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,50,50,0.5);z-index:47;pointer-events:none;animation:suspicious-pulse 1.5s ease-in-out infinite;';
        wrapper.appendChild(ring);
      }

      // Customer sprite canvas (32x40 pixel character)
      var spriteCanvas = document.createElement('canvas');
      spriteCanvas.width = 32;
      spriteCanvas.height = 40;
      spriteCanvas.style.cssText = 'position:absolute;left:' + Math.round(leftPos) + 'px;top:' + Math.round(topPos) + 'px;z-index:50;pointer-events:none;image-rendering:pixelated;transition:all 0.8s ease;';
      drawCustomerSprite(spriteCanvas, idx, !!c.suspicious);
      wrapper.appendChild(spriteCanvas);

      // Text label below the sprite
      var label = document.createElement('div');
      var labelLeft = leftPos - 6;
      var labelTop = topPos + 38;
      label.style.cssText = 'position:absolute;left:' + Math.round(labelLeft) + 'px;top:' + Math.round(labelTop) + 'px;font-size:11px;font-weight:bold;color:#fff;background:rgba(0,0,0,0.75);padding:2px 8px;border-radius:4px;white-space:nowrap;z-index:50;pointer-events:none;transition:all 0.8s ease;border:1px solid ' + (c.suspicious ? '#e05050' : 'rgba(255,255,255,0.2)') + ';box-shadow:0 1px 4px rgba(0,0,0,0.4);';
      label.innerHTML = '<span style="color:' + statusColor + ';">' + c.name + '</span> ' + statusText;
      if (c.suspicious) {
        label.innerHTML += ' <span style="color:#ff4444;font-size:10px;font-weight:bold;">&#x1F440; 可疑</span>';
      }
      wrapper.appendChild(label);

      container.appendChild(wrapper);
    });
  }

  // ===== Serve Customer at Table =====
  function serveCustomerAtTable(tableId) {
    // 按餐桌ID匹配顾客，而不是按数组索引
    var customer = null;
    for (var sci = 0; sci < state.customers.length; sci++) {
      if (state.customers[sci].tableId === tableId && state.customers[sci].status !== 'leaving') {
        customer = state.customers[sci];
        break;
      }
    }
    if (!customer) { showNotification('这张桌子没有顾客。', 1500); return; }

    if (customer.status === 'entering') {
      customer.status = 'seated';
      showNotification(customer.name + ' 已入座。', 1500);
      // 顾客自助取餐：从保温柜自动取食物
      if (state.foodContainer.length > 0) {
        var food = state.foodContainer.shift();
        customer.served = true;
        customer.recipeEaten = food.recipeName;
        customer.recipeIdEaten = food.recipeId;
        customer.mealPrice = food.price;
        customer.status = 'eating';
        state.servedToday++;
        state.reputation = (state.reputation || 0) + 1;
        // 偏好匹配
        if (food.recipeId === customer.preference) {
          customer._prefMatched = true;
          showNotification('⭐ ' + customer.name + ' 从保温柜取了食物，刚好是ta想吃的！', 2500);
        } else {
          showNotification(customer.name + ' 从保温柜取了一份' + food.recipeName + '，开始用餐。', 2000);
        }
        // 3秒后变为结账状态
        setTimeout(function() {
          if (customer && customer.status === 'eating') {
            customer.status = 'paying';
            showNotification(customer.name + ' 吃完了，等待结账。', 2000);
            updateCustomerLabels();
          }
        }, 3000);
      } else {
        showNotification('保温柜没有食物，' + customer.name + ' 在等待。', 1500);
      }
    } else if (customer.status === 'eating') {
      showNotification(customer.name + ' 正在用餐。', 1500);
    } else if (customer.status === 'paying') {
      collectMoney(customer.id);
    } else if (customer.status === 'seated') {
      // 已入座但没服务到，再试一次
      if (state.foodContainer.length > 0) {
        var food = state.foodContainer.shift();
        customer.served = true;
        customer.recipeEaten = food.recipeName;
        customer.recipeIdEaten = food.recipeId;
        customer.mealPrice = food.price;
        customer.status = 'eating';
        state.servedToday++;
        state.reputation = (state.reputation || 0) + 1;
        if (food.recipeId === customer.preference) {
          customer._prefMatched = true;
          showNotification('⭐ ' + customer.name + ' 从保温柜取了食物，刚好是ta想吃的！', 2500);
        } else {
          showNotification(customer.name + ' 从保温柜取了一份' + food.recipeName + '，开始用餐。', 2000);
        }
        setTimeout(function() {
          if (customer && customer.status === 'eating') {
            customer.status = 'paying';
            showNotification(customer.name + ' 吃完了，等待结账。', 2000);
            updateCustomerLabels();
          }
        }, 3000);
      } else {
        showNotification('保温柜没有食物，' + customer.name + ' 在等待。', 1500);
      }
    } else {
      showNotification('这位顾客正在' + customer.status + '。', 1500);
    }
    updateCustomerLabels();
    renderStatusBar();
  }

  function serveFoodToCustomer(foodIndex, customerId) {
    var panel = document.getElementById('food-select-panel');
    if (panel) panel.remove();
    var customer = null;
    for (var sci = 0; sci < state.customers.length; sci++) {
      if (state.customers[sci].id === customerId) { customer = state.customers[sci]; break; }
    }
    if (!customer) { showNotification('顾客不见了。', 1500); return; }
    if (foodIndex < 0 || foodIndex >= state.foodContainer.length) { showNotification('食物不存在。', 1500); return; }
    var food = state.foodContainer.splice(foodIndex, 1)[0];
    customer.served = true;
    customer.recipeEaten = food.recipeName;
    customer.recipeIdEaten = food.recipeId;
    customer.mealPrice = food.price;
    customer.status = 'eating';
    state.servedToday++;
    state.reputation = (state.reputation || 0) + 1;
    // 偏好匹配评价
    if (food.recipeId === customer.preference) {
      customer._prefMatched = true;
      showNotification('⭐ ' + customer.name + ' 非常喜欢这道菜！刚好是ta想吃的！', 2500);
    } else {
      showNotification(customer.name + ' 开始用餐。', 2000);
    }
    // 吃完后变为 paying
    setTimeout(function() {
      if (customer.status === 'eating') {
        customer.status = 'paying';
        showNotification(customer.name + ' 吃完了，等待结账。', 2000);
        updateCustomerLabels();
      }
    }, 3000);
    updateCustomerLabels();
    renderStatusBar();
  }

  // ===== Collect Money from Customer =====
  function collectMoney(customerId) {
    var customer = null;
    for (var i = 0; i < state.customers.length; i++) {
      if (state.customers[i].id === customerId) { customer = state.customers[i]; break; }
    }
    if (!customer) { showNotification('没有这个顾客。', 1500); return; }
    if (customer.status !== 'paying') { showNotification('这位顾客还未吃完。', 1500); return; }

    // 收钱：使用食谱价格
    var income = customer.mealPrice || 10;
    state.money += income;

    // 累加今日收入
    state._todayIncome = (state._todayIncome || 0) + income;
    state.reputation = (state.reputation || 0) + 1;
    customer.status = 'leaving';
    customer.served = true;

    // 顾客评价反馈
    var ratingScore = 3;
    var ratingText = '一般般';
    var ratingEmoji = '😐';
    var ratingBonus = 0;
    if (customer._prefMatched) {
      ratingScore = 5;
      ratingText = '太棒了！正合我口味！';
      ratingEmoji = '😍';
      ratingBonus = 3;
      state.reputation = (state.reputation || 0) + 2;
    } else if (customer.recipeIdEaten && Math.random() < 0.6) {
      ratingScore = 4;
      ratingText = '还不错！';
      ratingEmoji = '😊';
      ratingBonus = 1;
    } else if (Math.random() < 0.2) {
      ratingScore = 2;
      ratingText = '不太合口味...';
      ratingEmoji = '😕';
      ratingBonus = 0;
    }
    // 额外收入（小费）
    var tip = ratingBonus;
    if (tip > 0) {
      state.money += tip;
      income += tip;
    }
    // 显示评价气泡
    var bubble = document.createElement('div');
    bubble.className = 'rating-bubble';
    bubble.style.background = ratingScore >= 4 ? 'rgba(106,154,64,0.15)' : (ratingScore >= 3 ? 'rgba(232,180,76,0.15)' : 'rgba(200,64,48,0.15)');
    bubble.style.border = ratingScore >= 4 ? '1px solid rgba(106,154,64,0.4)' : (ratingScore >= 3 ? '1px solid rgba(232,180,76,0.4)' : '1px solid rgba(200,64,48,0.4)');
    bubble.innerHTML = '<div class="rating-score">' + ratingEmoji + '</div>' +
      '<div class="rating-text">' + ratingText + '</div>' +
      '<div class="rating-detail">支付 ' + income + ' 旧币' + (tip > 0 ? ' (含小费 ' + tip + ')' : '') + '</div>';
    document.body.appendChild(bubble);
    setTimeout(function() { if (bubble.parentNode) bubble.parentNode.removeChild(bubble); }, 2000);

    showNotification(customer.name + ' 结账了，支付了 ' + income + ' 旧币。', 2000);

    // 可疑顾客检查
    if (customer.suspicious) {
      if (Math.random() < 0.3) {
        state.alertLevel = Math.min(100, (state.alertLevel || 0) + 5);
        showNotification('这位顾客看起来不像普通食客...警惕值+5', 2500);
      }
      // 吃完后如果面馆冷清，有40%概率触发警报
      var normalCount = 0;
      for (var nci = 0; nci < state.customers.length; nci++) {
        if (!state.customers[nci].suspicious && state.customers[nci].status !== 'leaving' && state.customers[nci].status !== 'paying') { normalCount++; }
      }
      if (normalCount < 2 && Math.random() < 0.4) {
        state.alertLevel = Math.min(100, (state.alertLevel || 0) + 8);
        showNotification('可疑顾客注意到面馆太冷清了...警惕值+8', 2500);
      }
    }

    // 顾客离开（延迟移除）
    setTimeout(function() {
      var idx = state.customers.indexOf(customer);
      if (idx >= 0) {
        state.customers.splice(idx, 1);
        // 标记餐桌为脏
        if (customer.tableId) {
          state.tableDirty[customer.tableId] = true;
        }
      }
      // 顾客持续生成由 interiorLoop 的 tryGenerateCustomer 自动处理
      updateCustomerLabels();
    }, 2000);

    updateCustomerLabels();
    renderStatusBar();
    showRestaurantPanel();
  }

  // ===== Serve Customer (kept from original, zone-based) =====
  function serveCustomer(cId) {
    var customer = null;
    for (var sci = 0; sci < state.customers.length; sci++) {
      if (state.customers[sci].id === cId) { customer = state.customers[sci]; break; }
    }
    if (!customer) { showNotification('没有这位顾客。', 1500); return; }
    if (customer.served && customer.status !== 'paying') { showNotification('这位顾客已经吃过了。', 1500); return; }
    // 根据状态处理
    if (customer.status === 'entering' || customer.status === 'seated') {
      customer.status = 'seated';
      showNotification(customer.name + ' 已入座。', 1500);
      // 顾客自助取餐
      if (state.foodContainer.length > 0) {
        var food = state.foodContainer.shift();
        customer.served = true;
        customer.recipeEaten = food.recipeName;
        customer.recipeIdEaten = food.recipeId;
        customer.mealPrice = food.price;
        customer.status = 'eating';
        state.servedToday++;
        state.reputation = (state.reputation || 0) + 1;
        if (food.recipeId === customer.preference) {
          customer._prefMatched = true;
          showNotification('⭐ ' + customer.name + ' 从保温柜取了食物，刚好是ta想吃的！', 2500);
        } else {
          showNotification(customer.name + ' 从保温柜取了一份' + food.recipeName + '，开始用餐。', 2000);
        }
        setTimeout(function() {
          if (customer && customer.status === 'eating') {
            customer.status = 'paying';
            showNotification(customer.name + ' 吃完了，等待结账。', 2000);
            updateCustomerLabels();
          }
        }, 3000);
      } else {
        showNotification('保温柜没有食物，' + customer.name + ' 在等待。', 1500);
      }
    } else if (customer.status === 'eating') {
      showNotification(customer.name + ' 正在用餐。', 1500);
    } else if (customer.status === 'paying') {
      collectMoney(customer.id);
    } else {
      showNotification('这位顾客正在' + customer.status + '。', 1500);
    }
    updateCustomerLabels();
    renderStatusBar();
  }

  // ===== Market (Walkable Top-Down) =====
  function renderMarket(container) {
    container.innerHTML = '';

    // Create interior map container
    var mapDiv = document.createElement('div');
    mapDiv.className = 'interior-map';
    mapDiv.id = 'interior-market';
    mapDiv.style.width = '960px';
    mapDiv.style.height = '540px';

    // Create canvas for floor
    var canvas = document.createElement('canvas');
    canvas.id = 'interior-canvas';
    canvas.width = 960;
    canvas.height = 540;
    canvas.style.width = '960px';
    canvas.style.height = '540px';
    mapDiv.appendChild(canvas);

    // Draw market floor
    renderMarketFloor(canvas);

    // Create furniture
    createMarketFurniture(mapDiv);

    // Create zones
    createInteriorZones(mapDiv, MARKET_ZONES, 'market');

    // Create player
    createInteriorPlayer(mapDiv);

    // Create interaction hint
    var hint = document.createElement('div');
    hint.className = 'interior-hint';
    hint.id = 'interior-hint';
    hint.style.display = 'none';
    mapDiv.appendChild(hint);

    // Create overlay container
    var overlay = document.createElement('div');
    overlay.className = 'interior-overlay';
    overlay.id = 'interior-overlay';
    overlay.onclick = function(e) { if (e.target === this) closeInteriorOverlay(); };
    overlay.innerHTML = '<div class="interior-overlay-content" id="interior-overlay-content"></div>';
    mapDiv.appendChild(overlay);

    container.appendChild(mapDiv);

    // Set interior state
    interiorActive = true;
    interiorType = 'market';
    interiorPlayer = { x: 480, y: 460 };
    interiorNearestZone = null;
    interiorOverlay = null;

    // Fit interior to viewport
    fitInterior();

    // Start interior game loop
    startInteriorLoop();
  }

  function renderMarketFloor(canvas) {
    var ctx = canvas.getContext('2d');
    var W = 960, H = 540;

    // Base cobblestone ground
    ctx.fillStyle = '#7a7a6a';
    ctx.fillRect(0, 0, W, H);

    // Cobblestone pattern
    for (var x = 0; x < W; x += 32) {
      for (var y = 0; y < H; y += 32) {
        var shade = ((x * 3 + y * 7) % 16) - 8;
        var r = 122 + shade, g = 122 + shade, b = 106 + shade;
        ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
        ctx.fillRect(x, y, 30, 30);
        ctx.strokeStyle = 'rgba(90,90,80,0.3)';
        ctx.lineWidth = 1;
        ctx.strokeRect(x, y, 30, 30);
      }
    }

    // Central plaza area (lighter)
    var plazaGrad = ctx.createRadialGradient(480, 270, 40, 480, 270, 200);
    plazaGrad.addColorStop(0, 'rgba(180, 170, 150, 0.3)');
    plazaGrad.addColorStop(1, 'rgba(180, 170, 150, 0)');
    ctx.fillStyle = plazaGrad;
    ctx.fillRect(200, 80, 560, 380);

    // Fountain in center
    ctx.fillStyle = 'rgba(100, 140, 180, 0.4)';
    ctx.beginPath();
    ctx.arc(480, 160, 40, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(80, 80, 70, 0.6)';
    ctx.lineWidth = 2;
    ctx.stroke();
    // Inner fountain ring
    ctx.beginPath();
    ctx.arc(480, 160, 25, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(80, 80, 70, 0.4)';
    ctx.stroke();

    // Paths to stalls
    ctx.fillStyle = 'rgba(160, 150, 130, 0.2)';
    ctx.fillRect(200, 200, 560, 60);  // Horizontal path
    ctx.fillRect(440, 80, 80, 360);   // Vertical path

    // Exit area
    ctx.fillStyle = 'rgba(180, 160, 120, 0.3)';
    ctx.fillRect(380, 470, 200, 50);
  }

  function marketCartAdjust(key, delta) {
    if (!state._marketCart) state._marketCart = { flour: 0, meat: 0, veg: 0, spice: 0 };
    var qty = (state._marketCart[key] || 0) + delta;
    if (qty < 0) qty = 0;
    if (qty > 99) qty = 99;
    state._marketCart[key] = qty;
    var el = document.getElementById('mc-qty-' + key);
    if (el) el.textContent = qty;
    updateMarketCartTotal();
    // 更新摘要
    updateMarketCartSummary();
  }

  function updateMarketCartTotal() {
    var total = 0;
    var seasonMul = 1.0;
    if (state.season === 'winter') { seasonMul = 1.5; }
    else if (state.season === 'autumn') { seasonMul = 1.2; }
    else if (state.season === 'spring') { seasonMul = 0.8; }
    else if (state.season === 'summer') { seasonMul = 0.9; }
    var hasItems = false;
    if (state._marketCart) {
      for (var gk in state._marketCart) {
        if (state._marketCart[gk] > 0) {
          hasItems = true;
          var ingInfo = INGREDIENT_INFO[gk];
          if (ingInfo) {
            total += Math.round(ingInfo.price * seasonMul) * state._marketCart[gk];
          }
        }
      }
    }
    var totalEl = document.getElementById('mc-total');
    if (totalEl) totalEl.textContent = total;
    var buyBtn = document.getElementById('mc-checkout-btn');
    if (buyBtn) {
      if (hasItems && total > 0 && state.money >= total) {
        buyBtn.disabled = false;
        buyBtn.style.opacity = '1';
      } else {
        buyBtn.disabled = true;
        buyBtn.style.opacity = '0.5';
      }
    }
    // 更新资金显示
    var moneyEl = document.getElementById('market-cart-money');
    if (moneyEl) moneyEl.textContent = state.money;
  }

  function updateMarketCartSummary() {
    var summaryEl = document.getElementById('market-cart-summary');
    if (!summaryEl) return;
    var parts = [];
    if (state._marketCart) {
      for (var gk in state._marketCart) {
        if (state._marketCart[gk] > 0) {
          var ingInfo = INGREDIENT_INFO[gk];
          parts.push((ingInfo ? ingInfo.name : gk) + '×' + state._marketCart[gk]);
        }
      }
    }
    summaryEl.textContent = parts.length > 0 ? parts.join(', ') : '空';
  }

  function marketCartClear() {
    state._marketCart = { flour: 0, meat: 0, veg: 0, spice: 0 };
    renderMarketCartUI();
  }

  function marketCartCheckout() {
    if (!state._marketCart) return;
    var seasonMul = 1.0;
    if (state.season === 'winter') { seasonMul = 1.5; }
    else if (state.season === 'autumn') { seasonMul = 1.2; }
    else if (state.season === 'spring') { seasonMul = 0.8; }
    else if (state.season === 'summer') { seasonMul = 0.9; }
    var total = 0;
    var items = [];
    for (var gk in state._marketCart) {
      if (state._marketCart[gk] > 0) {
        var ingInfo = INGREDIENT_INFO[gk];
        if (ingInfo) {
          var cost = Math.round(ingInfo.price * seasonMul) * state._marketCart[gk];
          total += cost;
          items.push({ key: gk, info: ingInfo, qty: state._marketCart[gk], cost: cost });
        }
      }
    }
    if (total === 0) { showNotification('请选择要购买的食材。', 1500); return; }
    if (state.money < total) { showNotification('钱不够！需要 ' + total + ' 旧币。', 1500); return; }
    state.money -= total;
    for (var ii = 0; ii < items.length; ii++) {
      state.ingredients[items[ii].key] = (state.ingredients[items[ii].key] || 0) + items[ii].qty;
    }
    // 结算成功，重置购物车
    state._marketCart = { flour: 0, meat: 0, veg: 0, spice: 0 };
    // 显示购买详情
    var detailParts = [];
    for (var ii2 = 0; ii2 < items.length; ii2++) {
      detailParts.push(items[ii2].info.name + '×' + items[ii2].qty);
    }
    showNotification('🛒 购买完成！ ' + detailParts.join(', ') + ' 合计 ' + total + ' 旧币。继续留在菜摊。', 3000);
    // 标记老陈买菜完成
    state._chenHasBought = true;
    renderStatusBar();
    // 重新渲染购物面板，玩家留在菜摊位置
    renderMarketCartUI();
  }

  // 执行附魔（在 _wsRunTest 中调用）
  function _applyEnchantment(weaponIndex) {
    if (!state._pendingEnchantment || (state._ashCores || 0) < 1) return null;

    var enchantId = state._pendingEnchantment;
    var enchant = null;
    for (var i = 0; i < ASH_ENCHANTMENTS.length; i++) {
      if (ASH_ENCHANTMENTS[i].id === enchantId) { enchant = ASH_ENCHANTMENTS[i]; break; }
    }
    if (!enchant) return null;

    // Consume 1 ash core
    state._ashCores = (state._ashCores || 0) - 1;
    state._pendingEnchantment = null;

    // 附魔保底机制：连续失败计数，3次失败后第4次必成功
    if (!state._enchantFailCount) state._enchantFailCount = 0;
    var failChance = 0.3;
    // 每连续失败一次，失败概率降低
    if (state._enchantFailCount >= 3) {
      failChance = 0; // 第4次必成功
      state._enchantFailCount = 0;
    } else if (state._enchantFailCount >= 2) {
      failChance = 0.1; // 第3次10%失败
    } else if (state._enchantFailCount >= 1) {
      failChance = 0.2; // 第2次20%失败
    }

    if (Math.random() < failChance) {
      state._enchantFailCount = (state._enchantFailCount || 0) + 1;
      showNotification('❌ ' + enchant.failDesc + ' (连续失败' + state._enchantFailCount + '次，' + (state._enchantFailCount >= 3 ? '下次必成功！' : '再失败' + (3 - state._enchantFailCount) + '次后必成功') + ')', 3000);
      return null;
    }

    // Success
    state._enchantFailCount = 0;
    if (!state._weaponEnchantments) state._weaponEnchantments = {};
    state._weaponEnchantments[weaponIndex] = enchantId;
    showNotification('✅ ' + enchant.name + ' 附魔成功！' + enchant.desc, 2500);
    return enchant;
  }

  // Generate goods for a random NPC
  function generateScrapyardGoods(count, pricing) {
    var goods = [];
    if (!window.DarkFurnace) return goods;
    for (var i = 0; i < count; i++) {
      var scrap = window.DarkFurnace.generateRandomScrap();
      var avgStat = (scrap.precision + scrap.durability) / 2;
      var baseValue = 10 + Math.round(avgStat * 0.7);
      var rustDiscount = { none: 1.0, light: 0.9, medium: 0.75, heavy: 0.6 };
      baseValue = Math.round(baseValue * (rustDiscount[scrap.rustLevel] || 1));
      var sizeBonus = { small: 0.8, medium: 1.0, large: 1.2 };
      baseValue = Math.round(baseValue * (sizeBonus[scrap.size] || 1));
      var askingPrice = Math.round(baseValue * (1 + pricing.priceBias) * (0.9 + Math.random() * 0.2));
      var bottomPrice = Math.round(baseValue * pricing.bottomMult);
      goods.push({
        scrap: scrap,
        askingPrice: Math.max(5, askingPrice),
        bottomPrice: Math.max(3, bottomPrice),
        trueValue: baseValue
      });
    }
    return goods;
  }

  // --- Slider Bargain System ---

  function showBargainSlider(npcIdx, goodsIdx) {
    var npc = state._scrapyardNPCs[npcIdx];
    if (!npc) return;
    var good = npc.goods[goodsIdx];
    if (!good) return;
    state._bargainTarget = {
      npcIdx: npcIdx, goodsIdx: goodsIdx,
      npc: npc, good: good,
      patienceRemaining: npc.patience, round: 0,
      isBlackMarket: false
    };
    renderBargainSlider();
  }

  function renderBargainSlider() {
    var bt = state._bargainTarget;
    if (!bt) return;
    var good = bt.good, npc = bt.npc, s = good.scrap;
    var minOffer = Math.max(1, Math.floor(good.bottomPrice * 0.5));
    var maxOffer = Math.floor(good.askingPrice * 1.1);
    var currentOffer = Math.floor((minOffer + maxOffer) / 2);

    interiorOverlay = 'bargain';
    var html = '<h3>💬 与 ' + npc.name + ' 讨价还价</h3>';
    html += '<div style="margin-bottom:8px;color:var(--dim);">' + PERSONALITY_DESC[npc.personality] + ' | 耐心: ' + bt.patienceRemaining + '/' + npc.patience + '</div>';

    html += '<div class="card" style="margin-bottom:12px;background:var(--bg3);">';
    html += '<div><b>' + s.name + '</b> <span style="color:var(--dim);">[' + (s.type || '零件') + ']</span></div>';
    html += '<div style="font-size:11px;color:var(--dim);">精度:' + (s.precision || '?') + ' 耐久:' + (s.durability || '?') + ' 锈蚀:' + (s.rustLevel || '?') + '</div>';
    html += '<div style="color:var(--gold);margin-top:4px;">NPC开价: <b>' + good.askingPrice + '</b> 旧币</div>';
    html += '</div>';

    // Slider
    html += '<div style="margin-bottom:12px;">';
    html += '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--dim);">';
    html += '<span>' + minOffer + ' 旧币</span><span>' + maxOffer + ' 旧币</span>';
    html += '</div>';
    html += '<input type="range" id="bargain-slider" min="' + minOffer + '" max="' + maxOffer + '" value="' + currentOffer + '" style="width:100%;" oninput="Game.updateBargainValue()">';
    html += '<div style="text-align:center;font-size:18px;color:var(--gold);margin-top:4px;">你的出价: <b id="bargain-value">' + currentOffer + '</b> 旧币</div>';
    html += '</div>';

    if (bt.round > 0) {
      html += '<div style="color:var(--warn);margin-bottom:8px;font-size:12px;">第 ' + bt.round + ' 轮 — NPC: ' + (bt._lastNPCReaction || '') + '</div>';
    }

    html += '<div style="display:flex;gap:8px;">';
    html += '<button class="btn btn-primary" onclick="Game.confirmBargainOffer()" style="flex:1;">确认出价</button>';
    html += '<button class="btn" onclick="Game.cancelBargain()">放弃</button>';
    html += '</div>';

    // Ensure overlay exists (may not exist in headless test)
    var overlayContent = document.getElementById('interior-overlay-content');
    var overlay = document.getElementById('interior-overlay');
    if (!overlayContent || !overlay) {
      // Create overlay if missing
      overlay = document.createElement('div');
      overlay.className = 'interior-overlay';
      overlay.id = 'interior-overlay';
      overlay.onclick = function(e) { if (e.target === this) closeInteriorOverlay(); };
      overlayContent = document.createElement('div');
      overlayContent.className = 'interior-overlay-content';
      overlayContent.id = 'interior-overlay-content';
      overlay.appendChild(overlayContent);
      document.body.appendChild(overlay);
    }
    overlayContent.innerHTML = html;
    overlay.classList.add('active');
  }

  function updateBargainValue() {
    var slider = document.getElementById('bargain-slider');
    var display = document.getElementById('bargain-value');
    if (slider && display) { display.textContent = slider.value; }
  }

  function confirmBargainOffer() {
    var bt = state._bargainTarget;
    if (!bt) return;
    var slider = document.getElementById('bargain-slider');
    var offer = parseInt(slider ? slider.value : 0);
    if (!offer || isNaN(offer)) return;

    var good = bt.good, npc = bt.npc;
    bt.round++;

    if (!window.DarkFurnace) {
      showNotification('引擎未加载，无法议价。', 2000);
      closeModal();
      return;
    }
    var evalResult = window.DarkFurnace.evaluateOffer(offer, good.bottomPrice, good.askingPrice);

    if (evalResult.acceptChance >= 0.7) {
      // Deal!
      if (state.money < offer) {
        showNotification('钱不够！需要 ' + offer + ' 旧币。', 2000);
        closeInteriorOverlay();
        return;
      }
      state.money -= offer;

      if (bt.isBlackMarket) {
        // Black market purchase
        if (bt._blackMarketGood.type === 'base') {
          state.scraps.push(bt._blackMarketGood.scrap);
        } else if (bt._blackMarketGood.type === 'blueprint') {
          if (!state._blueprints) state._blueprints = [];
          state._blueprints.push(bt._blackMarketGood.bp);
          showNotification('📜 获得图纸: ' + bt._blackMarketGood.bp.name + '！可在工坊研究。', 3000);
          showTutorialOnce('blueprint_research', '在工坊工作台点击「📜 研究图纸」可消耗图纸获得永久属性加成！', 5000);
        }
        state._blackMarketDay = state.day;
        state._blackMarketGoods.splice(bt._bmIdx, 1);
      } else {
        // Normal scrapyard purchase
        state.scraps.push(good.scrap);
        var npcRef = state._scrapyardNPCs[bt.npcIdx];
        if (npcRef) {
          npcRef.goods.splice(bt.goodsIdx, 1);
          if (npcRef.goods.length === 0) {
            state._scrapyardNPCs.splice(bt.npcIdx, 1);
          }
        }
      }

      state._bargainTarget = null;
      showNotification('✓ 成交！以 ' + offer + ' 旧币买入', 2500);
      closeInteriorOverlay();
      // Re-render if on scrapyard
      if (state.currentLocation === 'scrapyard') {
        var locContent = document.getElementById('location-content');
        if (locContent) renderScrapyard(locContent);
      }
    } else if (evalResult.acceptChance < 0.3) {
      bt.patienceRemaining--;
      if (bt.patienceRemaining <= 0) {
        showNotification('✗ ' + npc.name + ' 不耐烦了，不卖了。', 2000);
        if (!bt.isBlackMarket && state._scrapyardNPCs[bt.npcIdx]) {
          state._scrapyardNPCs.splice(bt.npcIdx, 1);
        }
        state._bargainTarget = null;
        closeInteriorOverlay();
      } else {
        bt._lastNPCReaction = evalResult.emoji + ' ' + evalResult.message;
        renderBargainSlider();
      }
    } else {
      bt.patienceRemaining--;
      bt._lastNPCReaction = evalResult.emoji + ' ' + evalResult.message;
      if (bt.patienceRemaining <= 0) {
        showNotification('✗ ' + npc.name + ' 不耐烦了，不卖了。', 2000);
        if (!bt.isBlackMarket && state._scrapyardNPCs[bt.npcIdx]) {
          state._scrapyardNPCs.splice(bt.npcIdx, 1);
        }
        state._bargainTarget = null;
        closeInteriorOverlay();
      } else {
        renderBargainSlider();
      }
    }
  }

  function cancelBargain() {
    var bt = state._bargainTarget;
    if (bt) {
      showNotification('放弃了与 ' + bt.npc.name + ' 的交易。', 1500);
    }
    state._bargainTarget = null;
    closeInteriorOverlay();
  }

  function sellWeapon() {
    if (state.weapons.length === 0) {
      showNotification('你没有武器可以交付。去工坊做一些吧。', 2000);
      return;
    }
    var w = state.weapons.pop();
    var price = rand(30, 80);
    state.money += price;
    state.defense += Math.floor(price / 10);
    updateDefenseGrade();
    state.rating += 2;
    state.alertLevel = Math.min(100, state.alertLevel + 3);
    checkAlert();
    showNotification('从后门交付了一把' + w.name + '，王排长默不作声地收下了。获得 ' + price + ' 旧币。警惕值 +3', 2500);
    renderStatusBar();
    renderMilitia(document.getElementById('location-content'));

    // Tutorial step tracking
    if (state._tutorialStep === 2) {
      state._tutorialStep = 3;
      showTutorialHint('\u53bb\u8857\u5e02\u4e70\u65b0\u96f6\u4ef6\uff0c\u5faa\u73af\u5f80\u590d', 5000);
    }
  }

  function sellWeaponToBuyer(idx) {
    var weapon = state.weapons[idx];
    if (!weapon) return;
    var buyer = state.activeBuyer;
    if (!buyer) return;
    if (!window.DarkFurnace) {
      showNotification('引擎未加载，无法交易。', 2000);
      return;
    }

    // 用引擎计算匹配度
    var matchInfo = window.DarkFurnace.calculateMatchScore(weapon, buyer.targetType);
    // 用引擎评估售价
    var askingPrice = Math.floor((weapon.quality && weapon.quality.price ? weapon.quality.price : 50) * 0.8);
    var evalResult = window.DarkFurnace.evaluateSellOffer(askingPrice, weapon, buyer);

    // 显示结果面板
    interiorOverlay = 'sell_result';
    var html = '<h3>🔫 武器交付</h3>';
    html += '<p>武器: ' + weapon.name + '</p>';
    html += '<p>匹配度: ' + '★'.repeat(matchInfo.stars) + '☆'.repeat(5 - matchInfo.stars) + ' (' + matchInfo.label + ')</p>';
    html += '<p>出价: ' + askingPrice + ' 旧币</p>';
    html += '<p>买方反应: ' + evalResult.emoji + ' ' + evalResult.message + '</p>';
    if (evalResult.willBuy) {
      state.weapons.splice(idx, 1);
      state.money += askingPrice;
      state.defense += Math.floor(askingPrice / 10);
      state.rating += 2;
      state.alertLevel = Math.min(100, state.alertLevel + 3);
      state.activeBuyer = null;
      checkAlert();
      html += '<p style="color:var(--success);">✓ 交易成功！</p>';

      // Tutorial step tracking
      if (state._tutorialStep === 2) {
        state._tutorialStep = 3;
        setTimeout(function() { showTutorialHint('\u53bb\u8857\u5e02\u4e70\u65b0\u96f6\u4ef6\uff0c\u5faa\u73af\u5f80\u590d', 5000); }, 500);
      }
    } else {
      html += '<p style="color:var(--danger);">✗ 买方拒绝</p>';
    }
    html += '<button class="btn" onclick="Game.closeInteriorOverlay();Game.renderMilitia()">关闭</button>';
    document.getElementById('interior-overlay-content').innerHTML = html;
    document.getElementById('interior-overlay').classList.add('active');
  }

  function takeOrder() {
    var orderTypes = [
      {targetType: 'militia_close', reward: 80, label: '近战武器'},
      {targetType: 'scout_general', reward: 100, label: '通用武器'},
      {targetType: 'sniper_long', reward: 120, label: '远程武器'}
    ];
    var order = orderTypes[Math.floor(Math.random() * orderTypes.length)];
    order.deadline = state.day + Math.floor(Math.random() * 5) + 3;
    order.completed = false;
    order.id = 'order_' + Date.now();
    state.activeOrders.push(order);
    showNotification('新订单: ' + order.label + ' | 奖励: ' + order.reward + '旧币 | 期限: ' + order.deadline + '天', 3000);
  }

  function checkFate() {
    var completed = state.activeOrders.filter(function(o) { return o.completed; });
    var html = '<h3>🔮 命运链</h3>';
    html += '<p>已完成订单: ' + completed.length + ' / ' + state.activeOrders.length + '</p>';
    html += '<p>防御等级: ' + state.defenseGrade + '</p>';

      html += '<p style="color:var(--success);">王排长对你很满意，民兵们称你为"暗炉铁匠"。</p>';

      html += '<p>王排长觉得你还行，但还需要更多武器。</p>';
    } else {
      html += '<p style="color:var(--warn);">王排长有些担忧。北隙城需要更多武器。</p>';
    }
    html += '<button class="btn" onclick="Game.closeInteriorOverlay();Game.renderMilitia()">关闭</button>';
    interiorOverlay = 'fate';
    document.getElementById('interior-overlay-content').innerHTML = html;
    document.getElementById('interior-overlay').classList.add('active');
  }

  function initWorkshop() {
    if (!state._workshopInit && window.DarkFurnace) {
      var df = window.DarkFurnace;
      var mock = df.initMockInventory();
      // initMockInventory returns { scraps: [...], bases: [...] }, but we need a flat array
      state._inv = [];
      if (mock.scraps && mock.scraps.length > 0) {
        state._inv = state._inv.concat(mock.scraps);
      }
      if (mock.bases && mock.bases.length > 0) {
        state._inv = state._inv.concat(mock.bases);
      }
      state._workshopInit = true;
      state._selectedCore = null;
      state._selectedAux = null;
    }
    // Ensure _inv is always initialized
    if (!state._inv) state._inv = [];

    // 确保至少有一个基座，否则自动给予一个标准基座
    var bases = state._inv.filter(function(p) { return p.type === 'base'; });
    if (bases.length === 0) {
      state._inv.push({
        _id: 'default_base_' + Date.now(),
        type: 'base',
        name: '标准基座',
        weaponType: 'pistol',
        tier: 'standard',
        slots: { core: 1, auxiliary: 1 },
        stats: { precision: 30, durability: 40, weight: 20, reliability: 50 }
      });
    }
    // 自动选中第一个基座
    var firstBase = state._inv.find(function(p) { return p.type === 'base'; });
    if (firstBase) {
      state._selectedBase = firstBase;
    }
  }
