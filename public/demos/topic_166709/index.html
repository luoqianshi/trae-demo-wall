  function renderWorkshopFloor(canvas) {
    var ctx = canvas.getContext('2d');
    var W = 960, H = 540;

    // Base stone floor
    ctx.fillStyle = '#4a4a4a';
    ctx.fillRect(0, 0, W, H);

    // Stone tile pattern
    var tileSize = 64;
    for (var x = 0; x < W; x += tileSize) {
      for (var y = 0; y < H; y += tileSize) {
        var shade = ((x * 11 + y * 17) % 16) - 8;
        var r = 74 + shade, g = 74 + shade, b = 74 + shade;
        ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
        ctx.fillRect(x + 1, y + 1, tileSize - 2, tileSize - 2);
        // Stone border
        ctx.strokeStyle = '#3a3a3a';
        ctx.lineWidth = 1;
        ctx.strokeRect(x, y, tileSize, tileSize);
        // Stone crack details
        ctx.strokeStyle = 'rgba(30, 30, 30, 0.2)';
        ctx.lineWidth = 1;
        if ((x + y) % 3 === 0) {
          ctx.beginPath();
          ctx.moveTo(x + 8, y + 4);
          ctx.lineTo(x + 20, y + 12);
          ctx.stroke();
        }
      }
    }

    // Darker area near furnace
    ctx.fillStyle = 'rgba(30, 20, 10, 0.2)';
    ctx.fillRect(60, 190, 140, 80);

    // Workbench area lighter
    ctx.fillStyle = 'rgba(80, 70, 50, 0.15)';
    ctx.fillRect(400, 200, 120, 70);

    // Trapdoor area
    ctx.fillStyle = 'rgba(30, 30, 30, 0.3)';
    ctx.fillRect(460, 480, 40, 40);

    // Furnace glow
    var glow = ctx.createRadialGradient(130, 230, 5, 130, 230, 50);
    glow.addColorStop(0, 'rgba(255, 150, 50, 0.15)');
    glow.addColorStop(1, 'rgba(255, 150, 50, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(60, 180, 140, 100);
  }

  function _wsRenderInventory() {
    var container = document.getElementById('wsInventoryScroll');
    if (!container) return;
    container.innerHTML = '';
    var items = state._inv || [];
    if (items.length === 0) {
      container.innerHTML = '<div class="ws-empty-hint">库存为空。去废品站收购一些废件。</div>';
      return;
    }
    items.forEach(function(scrap) {
      var card = document.createElement('div');
      card.className = 'ws-part-card';
      card.setAttribute('draggable', 'true');
      card.setAttribute('data-id', scrap.id || scrap._id);

      var sid = scrap.id || scrap._id;
      var inSlot = (state._selectedCore && (state._selectedCore.id === sid || state._selectedCore._id === sid)) ||
                   (state._selectedAux && (state._selectedAux.id === sid || state._selectedAux._id === sid));
      if (inSlot) {
        card.classList.add('ws-in-slot');
        card.setAttribute('draggable', 'false');
      }

      // Drag events
      card.addEventListener('dragstart', function(e) {
        e.dataTransfer.setData('text/plain', scrap.id || scrap._id);
        card.classList.add('ws-dragging');
        _wsClearPartSelection();
      });
      card.addEventListener('dragend', function() {
        card.classList.remove('ws-dragging');
      });

      // Click to select
      card.addEventListener('click', function(e) {
        e.stopPropagation();
        if (card.classList.contains('ws-in-slot')) return;
        _wsSelectPart(scrap.id || scrap._id);
      });

      var rustLabel = '';
      if (scrap.rustLevel === 'heavy') rustLabel = ' [重度锈蚀]';
      else if (scrap.rustLevel === 'medium') rustLabel = ' [中度锈蚀]';

      var catLabel = scrap.category || scrap.type || '废件';
      var srcLabel = scrap.source || '未知来源';

      card.innerHTML =
        '<div class="ws-part-card-header">' +
          '<span class="ws-part-card-name" title="' + (scrap.name || '') + '">' + (scrap.name || catLabel) + '</span>' +
          '<span class="ws-part-card-type">' + catLabel + '</span>' +
        '</div>' +
        '<div class="ws-part-card-source">来源：' + srcLabel + rustLabel + '</div>' +
        '<div class="ws-part-card-bars">' +
          _wsBuildBarHTML('精度', scrap.precision || 0, 'ws-precision') +
          _wsBuildBarHTML('耐久', scrap.durability || 0, 'ws-durability') +
          _wsBuildBarHTML('重量', scrap.weight || 0, 'ws-weight') +
        '</div>';

      container.appendChild(card);
    });
  }

  function _wsBuildBarHTML(label, value, type) {
    return '<div class="ws-part-bar-row">' +
      '<span class="ws-part-bar-label">' + label + '</span>' +
      '<div class="ws-part-bar-track"><div class="ws-part-bar-fill ' + type + '" style="width:' + Math.min(value, 100) + '%"></div></div>' +
      '<span class="ws-part-bar-value">' + value + '</span>' +
    '</div>';
  }

  function _wsFindItemById(id) {
    var items = state._inv || [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].id === id || items[i]._id === id) return items[i];
    }
    return null;
  }

  var _ws_selectedPart = null;

  function _wsSelectPart(partId) {
    var scrap = _wsFindItemById(partId);
    if (!scrap) return;
    if (_ws_selectedPart && _ws_selectedPart._id === scrap._id) {
      _wsClearPartSelection();
      _wsShowToast('已取消选择', '');
      return;
    }
    _ws_selectedPart = scrap;
    _wsClearPartSelection();
    var cards = document.querySelectorAll('.ws-part-card');
    cards.forEach(function(c) {
      if (c.getAttribute('data-id') === scrap._id) {
        c.classList.add('ws-selected');
      }
    });
    _wsShowToast('已选择：' + scrap.name + '，请点击目标槽位', '');
  }

  function _wsClearPartSelection() {
    _ws_selectedPart = null;
    var cards = document.querySelectorAll('.ws-part-card.ws-selected');
    cards.forEach(function(c) { c.classList.remove('ws-selected'); });
  }

  function _wsHandleSlotClick(slotType) {
    if (_ws_selectedPart) {
      _wsTryEquip(slotType, _ws_selectedPart);
    }
  }

  function _wsTryEquip(slotType, scrap) {
    if (!state._selectedBase) {
      _wsShowToast('请先选择一个基座', 'ws-error');
      return;
    }

    var compatResult = { compatible: true, errors: [] };
    if (window.DarkFurnace && window.DarkFurnace.checkPartCompatibility) {
      compatResult = window.DarkFurnace.checkPartCompatibility(state._selectedBase, scrap, slotType);
    } else {
      // Basic compatibility check
      if (slotType === 'core' && scrap.type === 'scope') {
        compatResult = { compatible: false, errors: ['瞄准镜不能装入核心槽'] };
      }
      if (state._selectedBase.weaponType === 'pistol' && scrap.size === 'large') {
        compatResult = { compatible: false, errors: ['手枪基座无法容纳大型部件'] };
      }
    }

    if (!compatResult.compatible) {
      var slotLabel = slotType === 'core' ? '核心槽' : '辅助槽';
      _wsShowToast('不兼容' + slotLabel + '：' + compatResult.errors.join('；'), 'ws-error');
      return;
    }

    if (slotType === 'core') {
      if (state._selectedCore && (state._selectedCore.id === scrap.id || state._selectedCore._id === scrap._id)) return;
      state._selectedCore = scrap;
      _wsShowToast('核心槽已装入：' + scrap.name, 'ws-success');
    } else {
      if (state._selectedAux && (state._selectedAux.id === scrap.id || state._selectedAux._id === scrap._id)) return;
      state._selectedAux = scrap;
      _wsShowToast('辅助槽已装入：' + scrap.name, 'ws-success');
    }

    _ws_selectedPart = null;
    _wsClearPartSelection();
    _wsUpdateAll();
  }

  function _wsUnequipSlot(slotType) {
    if (slotType === 'core' && state._selectedCore) {
      _wsShowToast('已卸下：' + state._selectedCore.name, '');
      state._selectedCore = null;
    } else if (slotType === 'auxiliary' && state._selectedAux) {
      _wsShowToast('已卸下：' + state._selectedAux.name, '');
      state._selectedAux = null;
    }
    _wsUpdateAll();
  }

  function _wsUpdateAll() {
    _wsUpdateWeaponPreview();
    _wsUpdateSlots();
    _wsUpdateStats();
    _wsRenderInventory();
    _wsUpdateTestButton();
  }

  function _wsUpdateWeaponPreview() {
    var baseShape = document.getElementById('wsWeaponBaseShape');
    var corePart = document.getElementById('wsWeaponCorePart');
    var auxPart = document.getElementById('wsWeaponAuxPart');
    var typeTag = document.getElementById('wsWeaponTypeTag');

    if (!baseShape) return;
    baseShape.className = 'ws-weapon-base-shape';
    if (corePart) corePart.className = 'ws-weapon-core-part';
    if (auxPart) auxPart.className = 'ws-weapon-aux-part';

    if (!state._selectedBase) {
      if (typeTag) typeTag.textContent = '未选择基座';
      return;
    }

    baseShape.classList.add(state._selectedBase.weaponType || 'pistol');

    if (state._selectedCore && corePart) {
      corePart.classList.add('ws-active');
    }

    if (state._selectedAux && auxPart) {
      auxPart.classList.add('ws-active');
      if (state._selectedAux.type === 'grip') {
        auxPart.classList.add('ws-grip');
      } else if (state._selectedAux.type === 'stock') {
        auxPart.classList.add('ws-stock');
      }
    }

    var typeName = state._selectedBase.weaponType === 'pistol' ? '手枪' : '步枪';
    var tierLabel = (state._selectedBase.tier === 'rough' || state._selectedBase.tier === '简陋') ? '简陋' : '标准';
    if (typeTag) typeTag.textContent = typeName + ' · ' + tierLabel;
  }

  function _wsUpdateSlots() {
    _wsUpdateSlotBox('wsSlotCore', 'core', state._selectedCore);
    _wsUpdateSlotBox('wsSlotAux', 'auxiliary', state._selectedAux);
  }

  function _wsUpdateSlotBox(elId, slotType, part) {
    var el = document.getElementById(elId);
    if (!el) return;
    if (part) {
      el.classList.add('ws-occupied');
      el.innerHTML =
        '<button class="ws-slot-remove-btn" onclick="event.stopPropagation();Game._wsUnequipSlot(\'' + slotType + '\')" title="卸下部件">x</button>' +
        '<span class="ws-slot-label">' + (slotType === 'core' ? '核心槽' : '辅助槽') + '</span>' +
        '<span class="ws-slot-part-name">' + (part.name || '部件') + '</span>' +
        '<div class="ws-slot-part-stats">' +
          '<span class="ws-slot-mini-stat" style="color:var(--success);">精' + (part.precision || 0) + '</span>' +
          '<span class="ws-slot-mini-stat" style="color:var(--accent);">耐' + (part.durability || 0) + '</span>' +
          '<span class="ws-slot-mini-stat" style="color:var(--accent2);">重' + (part.weight || 0) + '</span>' +
        '</div>';

        '<span class="ws-slot-label">' + (slotType === 'core' ? '核心槽' : '辅助槽') + '</span>' +
        '<span class="ws-slot-hint">' + hintText + '</span>';
    }

  function _wsUpdateStats() {
    var precision = 0, durability = 0, weight = 0, reliability = 0, qualityScore = 0;
    var gradeLabel = '--';
    var gradeColor = 'var(--muted)';

    if (state._selectedBase && (state._selectedCore || state._selectedAux)) {
      try {
        var result;
        if (window.DarkFurnace && window.DarkFurnace.assembleWeapon) {
          result = window.DarkFurnace.assembleWeapon(state._selectedBase, state._selectedCore, state._selectedAux, 'scout_general');
        }
        if (result && result.weapon && result.weapon.computedStats) {
          var stats = result.weapon.computedStats;
          precision = stats.precision || 0;
          durability = stats.durability || 0;
          weight = Math.min(Math.round((stats.weight || 0) / 5 * 100), 100);
          reliability = stats.reliability || 0;
          if (result.quality) {
            qualityScore = result.quality.score || 0;
            // 应用韩墨白的技术升级
            if (state._npcUnlocked['tech_level']) {
              qualityScore = Math.min(100, qualityScore + 10 * state._npcUnlocked['tech_level']);
            }
            gradeLabel = result.quality.grade || '--';
          }
          var gradeColorMap = { '残次品': '#ef4444', '可用': '#e8a87c', '精良': '#4ade80', '军用级': '#60a5fa' };
          gradeColor = gradeColorMap[gradeLabel] || 'var(--muted)';
        }
      } catch(e) {}
    }

    _wsSetStatBar('wsStatPrecisionFill', 'wsStatPrecisionVal', precision);
    _wsSetStatBar('wsStatDurabilityFill', 'wsStatDurabilityVal', durability);
    _wsSetStatBar('wsStatWeightFill', 'wsStatWeightVal', weight);
    _wsSetStatBar('wsStatReliabilityFill', 'wsStatReliabilityVal', reliability);

    var gradeEl = document.getElementById('wsQualityGradeDisplay');
    if (gradeEl) {
      gradeEl.textContent = gradeLabel;
      gradeEl.style.color = gradeColor;
      gradeEl.style.background = qualityScore > 0 ? (gradeColor + '18') : 'transparent';
      gradeEl.style.border = qualityScore > 0 ? ('1px solid ' + gradeColor + '40') : 'none';
    }
  }

  function _wsSetStatBar(fillId, valId, value) {
    var fill = document.getElementById(fillId);
    var val = document.getElementById(valId);
    if (fill) fill.style.width = value + '%';
    if (val) val.textContent = value;
  }

  function _wsUpdateTestButton() {
    var btn = document.getElementById('wsTestBtn');
    var hint = document.getElementById('wsTestHint');
    if (!btn || !hint) return;
    if (state._selectedCore && state._selectedBase) {
      btn.disabled = false;
      hint.textContent = '核心+基座已就绪，可以测试';
      hint.style.color = 'var(--success)';
    } else {
      btn.disabled = true;
      if (!state._selectedCore && !state._selectedBase) {
        hint.textContent = '需要装入核心和基座部件';
      } else if (!state._selectedCore) {
        hint.textContent = '需要装入核心部件';
      } else {
        hint.textContent = '需要装入基座部件';
      }
      hint.style.color = 'var(--muted)';
    }
  }

  function _wsRunTest() {
    if (!state._selectedCore) return;
    if (!state._selectedBase) return;

    var result;
    if (window.DarkFurnace && window.DarkFurnace.assembleWeapon) {
      result = window.DarkFurnace.assembleWeapon(state._selectedBase, state._selectedCore, state._selectedAux, 'scout_general');
    }
    if (!result) {
      _wsShowToast('组装失败，请检查部件兼容性。', 'ws-error');
      return;
    }

    var stats = result.weapon.computedStats;
    var quality = result.quality;

    // Apply blueprint research bonuses
    if (state._blueprintBonuses && Object.keys(state._blueprintBonuses).length > 0) {
      var bonuses = state._blueprintBonuses;
      var bonusKeys = Object.keys(bonuses);
      for (var bki = 0; bki < bonusKeys.length; bki++) {
        var bonus = bonuses[bonusKeys[bki]];
        if (bonus.type === 'precision') { stats.precision = Math.min(100, (stats.precision || 0) + bonus.value); }
        else if (bonus.type === 'stability') { stats.stability = (stats.stability || 0) + bonus.value; }
        else if (bonus.type === 'fireRate') { stats.fireRate = (stats.fireRate || 0) + bonus.value; }
        else if (bonus.type === 'ammo') { stats.ammo = (stats.ammo || 0) + bonus.value; }
        else if (bonus.type === 'damage') { stats.damage = Math.round((stats.damage || 0) * (1 + bonus.value / 100)); }
        else if (bonus.type === 'handling') { stats.handling = (stats.handling || 0) + bonus.value; }
        // noiseReduction is handled at alertLevel increase time
      }
      // Recalculate quality score with bonuses
      if (quality) {
        var bonusScore = 0;
        var bonusKeys2 = Object.keys(bonuses);
        for (var bki2 = 0; bki2 < bonusKeys2.length; bki2++) {
          bonusScore += Math.floor(bonuses[bonusKeys2[bki2]].value / 5);
        }
        quality.score = (quality.score || 0) + bonusScore;
        quality.price = (quality.price || 0) + bonusScore * 2;
      }
    }

    // Apply ash core enchantment bonus
    var weaponIndex = state.weapons.length; // 当前武器索引（入队前，即为入队后索引）
    var enchantResult = _applyEnchantment(weaponIndex);
    if (enchantResult) {
      if (enchantResult.type === 'precision') { stats.precision = Math.min(100, (stats.precision || 0) + enchantResult.value); }
      else if (enchantResult.type === 'stability') { stats.stability = (stats.stability || 0) + enchantResult.value; }
      else if (enchantResult.type === 'fireRate') { stats.fireRate = (stats.fireRate || 0) + enchantResult.value; }
      else if (enchantResult.type === 'damage') { stats.damage = Math.round((stats.damage || 0) * (1 + enchantResult.value / 100)); }
      if (quality) {
        quality.score = (quality.score || 0) + Math.floor(enchantResult.value / 5);
        quality.price = (quality.price || 0) + Math.floor(enchantResult.value / 2);
      }
    }

    var precisionGrade = stats.precision >= 80 ? 'A' : stats.precision >= 60 ? 'B' : stats.precision >= 40 ? 'C' : 'D';
    var recoilLabel = (stats.weight || 0) > 3.5 ? '较大' : (stats.weight || 0) >= 2.5 ? '中等' : '较小';
    var reliabilityLabel = stats.reliability > 75 ? '优秀' : stats.reliability >= 50 ? '良好' : '较差';

    var gradeColorMap = { '残次品': '#ef4444', '可用': '#e8a87c', '精良': '#4ade80', '军用级': '#60a5fa' };
    var gradeColor = gradeColorMap[quality.grade] || '#e8a87c';

    var dotCount = 15 + Math.floor(Math.random() * 6);
    var spreadDots = [];
    var spreadFactor = Math.max(5, 45 - stats.precision * 0.4);
    for (var i = 0; i < dotCount; i++) {
      var angle = Math.random() * Math.PI * 2;
      var radius = (Math.random() + Math.random() + Math.random()) / 3 * spreadFactor;
      var x = 50 + radius * Math.cos(angle);
      var y = 50 + radius * Math.sin(angle);
      x = Math.max(2, Math.min(98, x));
      y = Math.max(2, Math.min(98, y));
      spreadDots.push({ x: x, y: y, isCenter: Math.sqrt((x - 50) * (x - 50) + (y - 50) * (y - 50)) < 8 });
    }

    var evaluation = _wsGenerateEvaluation(quality.score, stats, result.errors);

    var testResult = {
      precision: stats.precision,
      precisionGrade: precisionGrade,
      recoilLabel: recoilLabel,
      reliability: stats.reliability,
      reliabilityLabel: reliabilityLabel,
      grade: quality.grade,
      gradeColor: gradeColor,
      price: quality.price || 0,
      evaluation: evaluation,
      spreadDots: spreadDots,
      errors: result.errors
    };

    _wsRenderSpreadMap(testResult.spreadDots);
    _wsRenderResultDetails(testResult);
    document.getElementById('wsTestModalOverlay').classList.add('ws-visible');

    // Auto-add to weapons cabinet
    state.weapons.push(result);
    state._lastTestResult = result; // 更新测试结果，供靶场使用
    state.rating += result.quality ? Math.floor((result.quality.score || 0) / 10) : 5;
    renderStatusBar();

    // Add to workshop weapons and update defense（使用同一把武器的结果）
    if (result && result.weapon) {
      var qualityScore = result.quality ? (result.quality.score || 30) : 30;
      state.workshopWeapons.push(result);
      // 平滑防御加成：qualityScore 0-100 → 防御 0-10
      var defBonus = Math.round(qualityScore * 0.1);
      state.defense += defBonus;
      updateDefenseGrade();
      _wsShowToast('武器已入库！防御+' + defBonus, 'ws-success');
    }
  }

  function _wsGenerateEvaluation(score, stats, errors) {
    if (errors && errors.length > 0) {
      return '这把武器存在兼容性问题：' + errors.join('；') + '。勉强拼凑，难堪大用。';
    }
    if (score >= 71) {
      return '一把令人满意的武器。精度、耐久和重量达到了出色的平衡，足以在废土上立足。';
    } else if (score >= 51) {
      return '尚可的成品。各项属性较为均衡，能满足一般的作战需求，但还有提升空间。';
    } else if (score >= 31) {
      return '勉强可用的凑合货。虽然能响，但精度和可靠性都让人捏把汗。';
    } else {
      return '这堆废铁勉强能叫武器吗？也许能用来吓唬野狗，但别指望它能打中什么。';
    }
  }

  function _wsRenderSpreadMap(dots) {
    var map = document.getElementById('wsSpreadMap');
    if (!map) return;
    var oldDots = map.querySelectorAll('.ws-spread-dot');
    oldDots.forEach(function(d) { d.remove(); });
    dots.forEach(function(dot) {
      var el = document.createElement('div');
      el.className = 'ws-spread-dot' + (dot.isCenter ? ' ws-center' : '');
      el.style.left = dot.x + '%';
      el.style.top = dot.y + '%';
      map.appendChild(el);
    });
  }

  function _wsRenderResultDetails(result) {
    var details = document.getElementById('wsResultDetails');
    if (!details) return;
    details.innerHTML =
      '<div class="ws-result-row">' +
        '<span class="ws-result-label">精度评级</span>' +
        '<span class="ws-result-value" style="color:var(--success);">' + result.precisionGrade + '（' + result.precision + '）</span>' +
      '</div>' +
      '<div class="ws-result-row">' +
        '<span class="ws-result-label">后坐力</span>' +
        '<span class="ws-result-value">' + result.recoilLabel + '</span>' +
      '</div>' +
      '<div class="ws-result-row">' +
        '<span class="ws-result-label">可靠性</span>' +
        '<span class="ws-result-value" style="color:var(--accent3);">' + result.reliabilityLabel + '（' + result.reliability + '）</span>' +
      '</div>';

    var gradeEl = document.getElementById('wsResultQualityGrade');
    if (gradeEl) {
      gradeEl.textContent = result.grade;
      gradeEl.style.color = result.gradeColor;
    }
    var priceEl = document.getElementById('wsResultPriceValue');
    if (priceEl) priceEl.textContent = result.price;
    var evalEl = document.getElementById('wsResultEvaluation');
    if (evalEl) evalEl.textContent = '"' + result.evaluation + '"';
  }

  function _wsShowToast(message, type) {
    var container = document.getElementById('wsToastContainer');
    if (!container) return;
    var toast = document.createElement('div');
    toast.className = 'ws-toast' + (type ? ' ' + type : '');
    toast.textContent = message;
    container.appendChild(toast);
    setTimeout(function() {
      if (toast.parentNode) toast.parentNode.removeChild(toast);
    }, 2300);
  }

    var overlay = document.getElementById('wsTestModalOverlay');

  }

  // ===== Blueprint Research System =====
  function researchBlueprint(bpIndex) {
    if (!state._blueprints || state._blueprints.length <= bpIndex) {
      showNotification('没有这张图纸。', 1500);
      return;
    }
    var bp = state._blueprints[bpIndex];
    var bonus = BLUEPRINT_BONUSES[bp.id];
    if (!bonus) {
      showNotification('这张图纸无法研究。', 1500);
      return;
    }
    // Remove blueprint from inventory
    state._blueprints.splice(bpIndex, 1);
    // Apply permanent bonus
    state._blueprintBonuses[bp.id] = bonus;
    showNotification('📜 研究完成！' + bonus.desc + '（永久生效）', 3000);
    renderStatusBar();
    // Refresh workshop overlay if open
    if (interiorOverlay === 'workshop') {
      showWorkshopCraftOverlay();
    }
  }

  function disassembleResidue() {
    if (!state._explorationLog || state._explorationLog.length < 1) {
      showNotification('没有灰烬残骸可以拆卸。', 1500);
      return;
    }
    // Consume 1 residue
    state._explorationLog.shift();

    // Generate 1-3 random parts
    var partCount = rand(1, 3);
    var partTypes = ['barrel', 'grip', 'stock', 'trigger', 'magazine', 'scope', 'muzzle', 'receiver'];
    for (var di = 0; di < partCount; di++) {
      var partType = pick(partTypes);
      var part = {
        type: partType,
        name: '拆卸零件 (' + partType + ')',
        _id: genId(),
        id: genId(),
        precision: rand(10, 40),
        durability: rand(10, 40),
        weight: rand(1, 3),
        rustLevel: 'medium',
        category: partType,
        source: '灰烬残骸'
      };
      if (!state._inv) state._inv = [];
      state._inv.push(part);
    }

    showNotification('拆卸完成！获得 ' + partCount + ' 个随机零件。', 2000);
    renderStatusBar();
    showWorkshopCraftOverlay();
  }

  function forgePart(type, cost) {
    if (!state._inv || state._inv.length < cost) {
      showNotification('废件不够！', 1500);
      return;
    }
    for (var i = 0; i < cost; i++) {
      state._inv.shift();
    }
    var partNames = {
      barrel: '锻造枪管', trigger: '锻造扳机组', receiver: '锻造机匣',
      stock: '锻造枪托', grip: '锻造握把', muzzle: '锻造消音器', scope: '锻造瞄准镜'
    };
    // 生成带属性的零件
    var part = {
      type: type,
      name: partNames[type] || '锻造部件',
      id: genId(),
      forged: true,
      precision: rand(30, 70),
      durability: rand(30, 70),
      weight: rand(1, 3),
      rustLevel: 'none',
      size: type === 'stock' || type === 'barrel' ? 'large' : type === 'scope' || type === 'receiver' ? 'medium' : 'small',
      material: 'forged_steel'
    };
    state._inv.push(part);
    showNotification('🔨 锻造完成！获得 ' + part.name + ' (精度:' + part.precision + ' 耐久:' + part.durability + ')', 2000);
    renderStatusBar();
  }

      type: 'refined',

  function testWeapon(idx) {
    var weapon = state.weapons[idx];
    if (!weapon) {
      showNotification('没有这个武器。', 1500);
      return;
    }
    var damage = weapon.damage || rand(5, 30);
    var accuracy = rand(30, 95);
    var handling = rand(20, 90);
    var noise = rand(10, 100);

    var report = '';
    report += '⚔️ 伤害: ' + damage + '/100\n';
    report += '🎯 精度: ' + accuracy + '/100\n';
    report += '🤲 操控: ' + handling + '/100\n';
    report += '🔊 噪音: ' + noise + '/100\n';

    if (accuracy > 70) report += '\n✅ 精度优秀，适合远距离射击。';
    else if (accuracy > 40) report += '\n📌 精度尚可，中距离可用。';
    else report += '\n⚠️ 精度较差，建议近距离使用。';

    if (handling > 60) report += '\n👍 操控性好，易于控制。';
    else report += '\n👎 操控性一般，需要练习。';

    report += '\n\n💬 "这把' + (weapon.name || '武器') + '还算凑合。"';

    // 存储为对象结构，兼容靶场系统的期望格式
    state._lastTestResult = {
      weapon: {
        computedStats: {
          precision: accuracy,
          qualityScore: damage
        }
      },
      quality: {
        grade: accuracy > 70 ? '精良' : accuracy > 40 ? '可用' : '残次品',
        score: damage
      },
      report: report
    };
    showNotification('测试完成！查看测试报告。', 1500);
  }

  function searchJunk() {
    var found = Math.floor(Math.random() * 4);
    if (found > 0) {
      state.rawMaterials = (state.rawMaterials || 0) + found;
      showNotification('🔍 在废品堆中找到 ' + found + ' 个可用零件', 1500);
    } else {
      showNotification('🔍 废品堆里什么都没有', 1000);
    }
    renderStatusBar();
  }

  function triggerRatingAssessment() {
    state.ratingDaysLeft = 30;
    state.ratingHistory.push(state.rating);
    state.rating = Math.floor(state.rating / 2); // reset for next cycle

    // Calculate grade
    var avg = state.ratingHistory.length > 0 ?
      state.ratingHistory.reduce(function(a, b) { return a + b; }) / state.ratingHistory.length : 0;
    var grade = '丁等';
    if (avg >= 85) grade = '甲等';
    else if (avg >= 70) grade = '乙等';
    else if (avg >= 50) grade = '丙等';
    state.ratingGrade = grade;

    // 评级奖惩
    var rewardMoney = 0;
    var penaltyMoney = 0;
    if (grade === '甲等') {
      rewardMoney = rand(80, 150);
      state.money += rewardMoney;
      state.reputation = (state.reputation || 0) + 10;
      showNotification('🏆 甲等评级！奖励 ' + rewardMoney + ' 旧币，声誉 +10！', 3500);
    } else if (grade === '乙等') {
      rewardMoney = rand(30, 60);
      state.money += rewardMoney;
      state.reputation = (state.reputation || 0) + 3;
      showNotification('👍 乙等评级，奖励 ' + rewardMoney + ' 旧币。', 3000);
    } else if (grade === '丙等') {
      penaltyMoney = rand(20, 40);
      state.money -= penaltyMoney;
      if (state.money < 0) state.money = 0;
      showNotification('⚠ 丙等评级，被罚款 ' + penaltyMoney + ' 旧币。', 3000);
    } else {
      penaltyMoney = rand(40, 80);
      state.money -= penaltyMoney;
      if (state.money < 0) state.money = 0;
      state.reputation = Math.max(0, (state.reputation || 0) - 5);
      showNotification('❌ 丁等评级！被罚款 ' + penaltyMoney + ' 旧币，声誉 -5！', 3500);
    }

    showModal('📋 军需评估报告', buildRatingHTML(avg, grade));
    renderStatusBar();
  }

  function buildRatingHTML(score, grade) {
    var gradeClass = grade === '甲等' ? 'S' : grade === '乙等' ? 'A' : grade === '丙等' ? 'B' : 'D';
    return '<div class="rating-panel">' +
      '<p style="color:var(--muted);">北隙城战时物资管制委员会 · 月度评估报告</p>' +
      '<div class="rating-grade ' + gradeClass + '">' + grade + '</div>' +
      '<p style="color:var(--muted);font-size:13px;">综合评分: ' + Math.round(score) + '/100</p>' +
      '<div class="rating-detail">' +
        '<div class="rating-item"><div class="r-label">工坊实力</div><div class="r-val">' + rand(40, 80) + '</div></div>' +
        '<div class="rating-item"><div class="r-label">餐厅口碑</div><div class="r-val">' + state.reputation + '</div></div>' +
        '<div class="rating-item"><div class="r-label">情报网络</div><div class="r-val">' + state.intel.length * 10 + '</div></div>' +
        '<div class="rating-item"><div class="r-label">武器交付</div><div class="r-val">' + state.weapons.length * 10 + '</div></div>' +
      '</div>' +
      '<div style="margin-top:16px;font-size:13px;color:var(--muted);">"维持当前评级，下月继续评估。"</div>' +
      '<div style="margin-top:4px;font-size:12px;color:var(--dim);">—— 北隙城战时物资管制委员会</div>' +
      '<button class="btn btn-primary" style="margin-top:16px;" onclick="Game.closeModal()">继续经营</button>' +
    '</div>';
  }

  // ============================================================
  //  11. UI Functions
  // ============================================================

  function renderStatusBar() {
    var dayEl = document.getElementById('s-day');
    if (dayEl) dayEl.textContent = state.day;
    var moneyEl = document.getElementById('s-money');
    if (moneyEl) moneyEl.textContent = state.money;
    var ratingEl = document.getElementById('s-rating');
    if (ratingEl) ratingEl.textContent = state.ratingGrade;
    var nextRatingEl = document.getElementById('s-next-rating');
    if (nextRatingEl) nextRatingEl.textContent = state.ratingDaysLeft;
    var seasonEl = document.getElementById('s-season');
    var seasonInfo = SEASONS.find(function(s) { return s.id === state.season; }) || SEASONS[0];
    if (seasonEl) seasonEl.textContent = seasonInfo.label;
    var alertEl = document.getElementById('s-alert');
    if (alertEl) {
      alertEl.textContent = state.alertLevel;
      alertEl.style.color = state.alertLevel < 30 ? 'var(--success)' : state.alertLevel < 60 ? 'var(--warn)' : 'var(--danger)';
    }
    var defenseEl = document.getElementById('s-defense');
    if (defenseEl) {
      defenseEl.innerHTML = '🛡 防御: <span style="color:' + (state.defense >= 50 ? 'var(--success)' : state.defense >= 20 ? 'var(--warn)' : 'var(--danger)') + ';">' + state.defenseGrade + ' (' + state.defense + ')</span>';
    }
  }

  function updateClockDisplay() {
    var clock = document.getElementById('time-clock');
    var icon = document.getElementById('time-icon');
    var period = document.getElementById('time-period-label');
    var box = document.getElementById('time-display-box');
    if (!clock) return;
    clock.textContent = ('0' + state.gameHour).slice(-2) + ':' + ('0' + state.gameMinute).slice(-2);
    var periodIcons = { dawn: '🌅', morning: '☀️', afternoon: '🔧', night: '🌙' };
    var periodLabels = { dawn: '清晨', morning: '营业', afternoon: '研发', night: '夜晚' };
    if (icon) icon.textContent = periodIcons[state.dayTime] || '🌅';
    if (period) period.textContent = periodLabels[state.dayTime] || '清晨';
    if (box) {
      box.className = 'stat-item ' + (state.dayTime || 'dawn');
      box.classList.add('time-minute-change');
      setTimeout(function() { if (box) box.classList.remove('time-minute-change'); }, 300);
    }
  }

  function renderTimeBar() {
    var bar = document.getElementById('time-bar');
    if (!bar) return;
    bar.innerHTML = '';
    var seasonInfo = SEASONS.find(function(s) { return s.id === state.season; }) || SEASONS[0];
    var currentDt = DAY_TIMES.find(function(t) { return t.id === state.dayTime; }) || DAY_TIMES[0];
    var timeDisplay = document.createElement('span');
    timeDisplay.style.cssText = 'font-size:15px;font-weight:700;color:var(--ink);text-shadow:0 1px 4px rgba(0,0,0,0.5);';
    timeDisplay.textContent = seasonInfo.label.replace(/[🌸☀️🍂❄️\s]/g, '') + ' 第' + state.day + '天 ' + ('0' + state.gameHour).slice(-2) + ':' + ('0' + state.gameMinute).slice(-2);
    bar.appendChild(timeDisplay);
    updateClockDisplay();
  }

  function getPhaseFromHour(hour) {
    if (hour >= 6 && hour <= 9) return 'dawn';
    if (hour >= 10 && hour <= 14) return 'morning';
    if (hour >= 15 && hour <= 17) return 'afternoon';
    return 'night';
  }

  function startRealTimeFlow() {
    if (state._timeFlowActive) return;
    state._timeFlowActive = true;
    state._timeFlowInterval = setInterval(function() {
      if (!state._timeFlowActive) return;
      tickGameTime();
    }, TIME_RATE * 1000);
  }

  function stopRealTimeFlow() {
    state._timeFlowActive = false;
    if (state._timeFlowInterval) {
      clearInterval(state._timeFlowInterval);
      state._timeFlowInterval = null;
    }
  }

  function tickGameTime() {
    // Advance 1 game minute
    state.gameMinute++;
    if (state.gameMinute >= 60) {
      state.gameMinute = 0;
      state.gameHour++;
    }

    // Handle phase transitions based on hour
    var newPhase = getPhaseFromHour(state.gameHour);
    if (newPhase !== state.dayTime) {
      var oldPhase = state.dayTime;
      state.dayTime = newPhase;
      // Flash effect on phase change
      var box = document.getElementById('time-display-box');
      if (box) {
        box.classList.add('time-period-change');
        setTimeout(function() { if (box) box.classList.remove('time-period-change'); }, 800);
      }
      // Phase transition logic
      handlePhaseTransition(oldPhase, newPhase);
    }

    // End of day check (22:00 → advance to next day)
    if (state.gameHour >= 22 && state.gameMinute >= 0) {
      advanceDay();
      return;
    }

    // Forced opening check (10:00)
    if (state.gameHour === 10 && state.gameMinute === 1 && !state._hasOpenedToday && state.currentLocation === 'restaurant') {
      if (!state._isOpen) {
        openRestaurant();
        showNotification('⏰ 10点已到，面馆自动开门营业！', 2500);
      }
    }

    // Suspicious character event check (random during morning/afternoon, every 2-3 days)
    if (state.dayTime === 'morning' || state.dayTime === 'afternoon') {
      if (state._suspiciousEventCheckDay !== state.day && Math.random() < 0.02) {
        state._suspiciousEventCheckDay = state.day;
        triggerSuspiciousEvent();
      }
    }

    updateClockDisplay();
    renderStatusBar();
  }

  function handlePhaseTransition(oldPhase, newPhase) {
    // Morning phase auto-open if in restaurant
    if (newPhase === 'morning' && state.currentLocation === 'restaurant') {
      if (!state._isOpen && !state._hasOpenedToday) {
        openRestaurant();
        showNotification('⏰ 营业时间到了！面馆自动开门。', 2000);
      }
    }
    // Afternoon phase - close restaurant, show workshop hint
    if (newPhase === 'afternoon') {
      if (state._isOpen) {
        state._isOpen = false;
        state.customers = [];
        var todayIncome = state._todayIncome || 0;
        if (todayIncome > 0) {
          showNotification('🔧 营业结束。今日收入：' + todayIncome + ' 旧币。下午可以去工坊研发武器。', 3000);
        }
      }
    }
    // Night phase - alert level check
    if (newPhase === 'night') {
      showNotification('🌙 夜幕降临，注意安全。警惕值：' + state.alertLevel + '%', 2000);
    }
  }

  function triggerSuspiciousEvent() {
    if (state.currentLocation !== 'restaurant') return;
    var events = [
      { text: '一个穿灰外套的人在面馆门口徘徊，眼神躲闪。', result: 'alert_up' },
      { text: '街对面有人在盯着你的店面。', result: 'none' },
      { text: '一个陌生人走进来，只点了一杯水，四处打量。', result: 'alert_up' },
      { text: '后巷里有人在翻找什么东西，看到你后迅速离开。', result: 'alert_up' }
    ];
    var evt = events[Math.floor(Math.random() * events.length)];
    showNotification('⚠️ ' + evt.text, 4000);
    if (evt.result === 'alert_up') {
      state.alertLevel = Math.min(100, state.alertLevel + rand(3, 8));
      renderStatusBar();
    }
  }

  function getSeasonLabel() {
    var s = SEASONS.find(function(s) { return s.id === state.season; });
    return s ? s.label : '春';
  }

  function updateDefenseGrade() {
    if (state.defense >= 80) state.defenseGrade = '铜墙铁壁';
    else if (state.defense >= 50) state.defenseGrade = '坚固防线';
    else if (state.defense >= 20) state.defenseGrade = '基本防御';
    else state.defenseGrade = '无防备';
  }

  function getNextTimeLabel() {
    var currentDtIdx = DAY_TIMES.findIndex(function(t) { return t.id === state.dayTime; });
    if (currentDtIdx < 0 || currentDtIdx >= DAY_TIMES.length - 1) return '下一天';
    return DAY_TIMES[currentDtIdx + 1].label;
  }

  function showNotification(text, duration) {
    var el = document.getElementById('notification');
    if (!el) return;
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(el._timer);
    el._timer = setTimeout(function() { el.classList.remove('show'); }, duration || 2000);
  }

  function showModal(title, body) {
    var mb = document.getElementById('modal-body');
    if (mb) mb.innerHTML = '<h3>' + title + '</h3>' + body;
    var mo = document.getElementById('modal-overlay');
    if (mo) mo.classList.add('active');
  }

  function closeModal() {
    var mo = document.getElementById('modal-overlay');
    if (mo) mo.classList.remove('active');
  }

  // ============================================================
  //  12. Init
  // ============================================================

  // Public API
  return {
    // State
    state: state,

    // Init
    init: initGame,

    // Navigation
    goToMap: goToMap,
    goToLocation: goToLocation,
    advanceTime: advanceTime,

    // Dialogue
    PROLOGUE_LINES: PROLOGUE_LINES,
    RADIO_LINES: RADIO_LINES,
    NPC_DIALOGUES: NPC_DIALOGUES,
    HUNTER_EVENTS: HUNTER_EVENTS,
    DAY_NARRATIVES: DAY_NARRATIVES,
    DAILY_RADIO_CALLS: DAILY_RADIO_CALLS,
    triggerDayNarrative: triggerDayNarrative,
    triggerDailyRadio: triggerDailyRadio,
    showPrologue: showPrologue,
    showRadioDialogue: showRadioDialogue,
    showNPCDialogue: showNPCDialogue,
    closeNPCDialogue: closeNPCDialogue,
    showFoodSelectionPanel: showFoodSelectionPanel,
    serveFoodToCustomer: serveFoodToCustomer,
    marketCartAdjust: marketCartAdjust,
    marketCartClear: marketCartClear,
    marketCartCheckout: marketCartCheckout,
    showTutorialHint: showTutorialHint,
    showTutorialOnce: showTutorialOnce,
    hideTutorialHint: hideTutorialHint,
    updateMissionPanel: updateMissionPanel,

    // Time Flow (实时时间系统)
    advanceDay: advanceDay,
    triggerRatingAssessment: triggerRatingAssessment,
    startTimeFlow: startTimeFlow,
    stopTimeFlow: stopTimeFlow,
    startRealTimeFlow: startRealTimeFlow,
    stopRealTimeFlow: stopRealTimeFlow,
    tickGameTime: tickGameTime,
    getPhaseFromHour: getPhaseFromHour,
    updateClockDisplay: updateClockDisplay,
    advanceTime: advanceTime,
    DAY_TIMES: DAY_TIMES,
    PHASE_DURATIONS: PHASE_DURATIONS,
    PHASE_HOURS: PHASE_HOURS,
    TIME_RATE: TIME_RATE,
    currentPhaseDuration: currentPhaseDuration,
    LOCATIONS: LOCATIONS,
    SEASONS: SEASONS,

    // Restaurant (Interior)
    showRestaurantPanel: showRestaurantPanel,
    openRestaurant: openRestaurant,
    generateDayCustomers: generateDayCustomers,
    selectMenu: selectMenu,
    serveCustomerAtTable: serveCustomerAtTable,
    serveCustomer: serveCustomer,
    checkoutAll: checkoutAll,
    closeInteriorOverlay: closeInteriorOverlay,
    showKitchenPanel: showKitchenPanel,
    cookRecipe: cookRecipe,
    serveFood: serveFood,
    collectMoney: collectMoney,
    cleanTable: cleanTable,
    buyIngredient: buyIngredient,

    // 老陈 Cooking System
    chenToggleMenu: chenToggleMenu,
    chenConfirmMenu: chenConfirmMenu,
    chenGoShopping: chenGoShopping,
    chenShoppingAdjust: chenShoppingAdjust,
    chenBuyIngredients: chenBuyIngredients,
    chenStartCooking: chenStartCooking,
    chenChoppingHit: chenChoppingHit,
    chenHeatHit: chenHeatHit,
    chenSeasoningChoose: chenSeasoningChoose,
    chenFinishCooking: chenFinishCooking,

    // Zone Data
    RESTAURANT_ZONES: RESTAURANT_ZONES,
    MARKET_ZONES: MARKET_ZONES,
    MARKET_COLLISIONS: MARKET_COLLISIONS,
    WORKSHOP_ZONES: WORKSHOP_ZONES,

    // Recipe Data
    RECIPES: RECIPES,
    INGREDIENT_INFO: INGREDIENT_INFO,

    // Scrapyard Data
    SCRAPYARD_NPC_POOL: SCRAPYARD_NPC_POOL,
    BLUEPRINT_POOL: BLUEPRINT_POOL,
    BLUEPRINT_BONUSES: BLUEPRINT_BONUSES,
    PERSONALITY_DESC: PERSONALITY_DESC,
    refreshScrapyardNPCs: refreshScrapyardNPCs,
    searchJunk: searchJunk,

    // Blueprint Research
    researchBlueprint: researchBlueprint,
    showBlueprintResearch: showBlueprintResearch,

    // Ash Enchantment
    ASH_ENCHANTMENTS: ASH_ENCHANTMENTS,
    showEnchantmentPanel: showEnchantmentPanel,
    selectEnchantment: selectEnchantment,
    cancelEnchantment: cancelEnchantment,
    _applyEnchantment: _applyEnchantment,

    // Fridge
    FRIDGE_LEVELS: FRIDGE_LEVELS,
    buyFridge: buyFridge,
    buyMilitaryFridge: buyMilitaryFridge,

    // Exploration
    enterTunnel: enterTunnel,
    exitExploration: exitExploration,
    disassembleResidue: disassembleResidue,

    // Workshop (Interior)
    leaveWorkshop: leaveWorkshop,
    forge: forgePart,       // alias for test compatibility
    forgePart: forgePart,
    smeltMaterials: smeltMaterials,
    smeltMaterialsAdvanced: smeltMaterialsAdvanced,
    testWeapon: testWeapon,
    generateRandomScraps: generateRandomScraps,
    showWorkshopShopOverlay: showWorkshopShopOverlay,
    craftWeapon: showWorkshopCraftOverlay, // alias for test compatibility
    showWorkshopCraftOverlay: showWorkshopCraftOverlay,
    showWorkshopWeaponsOverlay: showWorkshopWeaponsOverlay,
    showWorkshopForgeOverlay: showWorkshopForgeOverlay,
    showWorkshopSmeltOverlay: showWorkshopSmeltOverlay,
    showWorkshopTestOverlay: showWorkshopTestOverlay,

    // Workshop (New drag-drop system)
    _wsHandleSlotClick: _wsHandleSlotClick,
    _wsRunTest: _wsRunTest,
    _wsUnequipSlot: _wsUnequipSlot,
    _wsCloseTestModal: _wsCloseTestModal,

    // Market
    renderMarket: renderMarket,
    showMarketScrapShop: showMarketScrapShop,
    showMarketIngredientsOverlay: showMarketIngredientsOverlay,
    buyScrapPart: buyScrapPart,
    showMarketGossipOverlay: showMarketGossipOverlay,
    showBuyers: showMarketBuyersOverlay, // alias for test compatibility
    showMarketBuyersOverlay: showMarketBuyersOverlay,

    // Militia
    sellWeapon: sellWeapon,
    sellWeaponToBuyer: sellWeaponToBuyer,
    takeOrder: takeOrder,
    showMilitiaOrders: takeOrder, // alias for test compatibility
    checkFate: checkFate,

    // Scrapyard (Reworked: Random NPC + Slider Bargain + Black Market)
    renderScrapyard: renderScrapyard,
    showBargainSlider: showBargainSlider,
    updateBargainValue: updateBargainValue,
    confirmBargainOffer: confirmBargainOffer,
    cancelBargain: cancelBargain,
    showBlackMarket: showBlackMarket,
    bargainBlackMarket: bargainBlackMarket,

    // Militia
    renderMilitia: renderMilitia,

    // Combat
    startWeaponTest: startWeaponTest,
    triggerRaid: triggerRaid,
    closeCombat: closeCombat,
    showRaidLog: showRaidLog,
    updateCombatUI: updateCombatUI,

    // Alert
    checkAlert: checkAlert,
    updateTimeAdvanceBtn: updateTimeAdvanceBtn,

    // UI
    showNotification: showNotification,
    renderStatusBar: renderStatusBar,
    renderTimeBar: renderTimeBar,
    showEarningsPopup: showEarningsPopup,
    showModal: showModal,
    closeModal: closeModal,
    getSeasonLabel: getSeasonLabel,
    showRestaurantPanel: showRestaurantPanel,
    updateDefenseGrade: updateDefenseGrade,

    // NPC Recruitment
    checkNPCJoining: checkNPCJoining,
    _npcRecruited: state._npcRecruited,
    _npcUnlocked: state._npcUnlocked,
  };

})();

// ============================================================
//  Start game on load
// ============================================================
window.onload = function() {
  Game.init();
};
</script>

</div>
