<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>谷哒 · 谷子柜</title>
    <style id="theme-vars">
/* 谷哒 · 方向C — 暖阳活力 */
:root {
  --bg: #FFFCF5;
  --bg-secondary: #FFF8EB;
  --bg-tertiary: #FFF4DE;
  --surface: #FFFFFF;
  --surface-hover: #FFFBF0;
  --surface-inset: #FFF8EB;
  --text-primary: #3D2E10;
  --text-secondary: #7A6530;
  --text-tertiary: #B8A870;
  --text-inverse: #FFFFFF;
  --brand-primary: #FF7E5F;
  --brand-primary-light: #FFA48C;
  --brand-primary-bg: #FFF3EF;
  --brand-primary-hover: #FF6A48;
  --state-success: #6BCB77;
  --state-success-bg: #EEFBF0;
  --state-warning: #FFB347;
  --state-warning-bg: #FFF8EC;
  --state-error: #FF6B6B;
  --state-error-bg: #FFF0F0;
  --state-info: #7EB6FF;
  --state-info-bg: #F0F6FF;
  --border: #F0E4C8;
  --border-light: #FAF3E5;
  --border-focus: #FF7E5F;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-full: 9999px;
  --shadow-sm: 0 1px 3px rgba(61,46,16,0.04);
  --shadow-md: 0 4px 12px rgba(61,46,16,0.06);
  --shadow-lg: 0 8px 24px rgba(61,46,16,0.08);
  --shadow-float: 0 12px 32px rgba(61,46,16,0.12);
  --font-display: 'Baloo 2', 'Noto Sans SC', -apple-system, sans-serif;
  --font-body: 'Baloo 2', 'Noto Sans SC', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --space-2xl: 48px;
  --nav-height: 64px;
  --tabbar-height: 68px;
  --container-max: 480px;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--text-primary);
    --color-secondary: var(--text-secondary);
  }
  @layer base {
    body { background: var(--text-background); color: var(--text-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="mx-auto max-w-[480px] min-h-screen pb-[100px]" style="background: var(--bg); font-family: var(--font-body);">

        <!-- ====== 1. Header ====== -->
        <header class="relative flex items-center justify-between px-5 py-4" style="background: var(--brand-primary); border-radius: 0 0 var(--radius-lg) var(--radius-lg);">
            <button class="flex items-center justify-center w-10 h-10 rounded-lg" style="background: rgba(255,255,255,0.25); color: var(--text-inverse);" aria-label="返回">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </button>
            <h1 class="text-xl font-bold" style="color: var(--text-inverse); font-family: var(--font-display); text-wrap: balance;">谷子柜</h1>
            <button class="flex items-center justify-center w-10 h-10 rounded-lg" style="background: rgba(255,255,255,0.25); color: var(--text-inverse);" aria-label="添加谷子">
                <i data-lucide="plus" class="w-5 h-5"></i>
            </button>
        </header>

        <!-- ====== 2. Filter Tabs ====== -->
        <section class="px-4 pt-4" aria-label="筛选">
            <div class="flex flex-nowrap overflow-x-auto gap-2 no-scrollbar">
                <button class="shrink-0 inline-flex items-center justify-center px-4 py-2 text-sm font-bold whitespace-nowrap" style="background: var(--brand-primary); color: var(--text-inverse); border-radius: var(--radius-full);" aria-pressed="true">全部(5)</button>
                <button class="shrink-0 inline-flex items-center justify-center px-4 py-2 text-sm font-medium whitespace-nowrap" style="background: var(--bg-secondary); color: var(--text-secondary); border-radius: var(--radius-full);" aria-pressed="false">在柜(3)</button>
                <button class="shrink-0 inline-flex items-center justify-center px-4 py-2 text-sm font-medium whitespace-nowrap" style="background: var(--bg-secondary); color: var(--text-secondary); border-radius: var(--radius-full);" aria-pressed="false">出门中(1)</button>
                <button class="shrink-0 inline-flex items-center justify-center px-4 py-2 text-sm font-medium whitespace-nowrap" style="background: var(--bg-secondary); color: var(--text-secondary); border-radius: var(--radius-full);" aria-pressed="false">已借出(1)</button>
            </div>
        </section>

        <!-- ====== 3. Search Bar ====== -->
        <section class="px-4 pt-3" aria-label="搜索">
            <div class="relative">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4" style="color: var(--text-tertiary);"></i>
                <input type="search" placeholder="搜索谷子名称..." class="w-full py-2.5 pl-10 pr-4 text-sm font-medium outline-none" style="background: var(--surface); border: 2px solid var(--border-light); border-radius: var(--radius-md); color: var(--text-primary);" aria-label="搜索谷子">
            </div>
        </section>

        <!-- ====== 4. Merch List ====== -->
        <section class="px-4 pt-4 space-y-3" aria-label="谷子列表">

            <!-- Item 1: 五条悟亚克力牌 - 在柜 -->
            <article class="flex gap-3 p-3" style="background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);">
                <div class="shrink-0 flex items-center justify-center w-14 h-14" style="background: var(--bg-secondary); border-radius: var(--radius-md);">
                    <span class="text-2xl leading-none" aria-hidden="true">🔮</span>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex items-start justify-between gap-2">
                        <div class="min-w-0 flex-1">
                            <h3 class="text-base font-bold truncate" style="color: var(--text-primary);">五条悟亚克力牌</h3>
                            <p class="text-xs truncate mt-0.5" style="color: var(--text-secondary);">咒术回战</p>
                        </div>
                        <div class="shrink-0 flex flex-col items-end gap-1">
                            <span class="inline-flex items-center px-2 py-0.5 text-[10px] font-bold whitespace-nowrap" style="background: var(--state-success-bg); color: var(--state-success); border-radius: var(--radius-sm);">在柜</span>
                            <span class="text-sm font-bold" style="color: var(--brand-primary);">¥128</span>
                        </div>
                    </div>
                    <div class="flex items-center justify-between mt-2 pt-2" style="border-top: 1px solid var(--border-light);">
                        <span class="inline-flex items-center px-2 py-0.5 text-[10px] font-medium whitespace-nowrap" style="background: var(--bg-tertiary); color: var(--text-secondary); border-radius: var(--radius-sm);">亚克力</span>
                        <button class="inline-flex items-center justify-center px-3 py-1 text-xs font-bold whitespace-nowrap" style="background: var(--brand-primary-bg); color: var(--brand-primary); border-radius: var(--radius-sm);">带出门</button>
                    </div>
                </div>
            </article>

            <!-- Item 2: 祢豆子吧唧 - 出门中 -->
            <article class="flex gap-3 p-3" style="background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);">
                <div class="shrink-0 flex items-center justify-center w-14 h-14" style="background: var(--bg-tertiary); border-radius: var(--radius-md);">
                    <span class="text-2xl leading-none" aria-hidden="true">🎭</span>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex items-start justify-between gap-2">
                        <div class="min-w-0 flex-1">
                            <h3 class="text-base font-bold truncate" style="color: var(--text-primary);">祢豆子吧唧</h3>
                            <p class="text-xs truncate mt-0.5" style="color: var(--text-secondary);">鬼灭之刃</p>
                        </div>
                        <div class="shrink-0 flex flex-col items-end gap-1">
                            <span class="inline-flex items-center px-2 py-0.5 text-[10px] font-bold whitespace-nowrap" style="background: var(--state-info-bg); color: var(--state-info); border-radius: var(--radius-sm);">出门中</span>
                            <span class="text-sm font-bold" style="color: var(--brand-primary);">¥68</span>
                        </div>
                    </div>
                    <div class="flex items-center justify-between mt-2 pt-2" style="border-top: 1px solid var(--border-light);">
                        <span class="inline-flex items-center px-2 py-0.5 text-[10px] font-medium whitespace-nowrap" style="background: var(--bg-tertiary); color: var(--text-secondary); border-radius: var(--radius-sm);">吧唧</span>
                        <button class="inline-flex items-center justify-center px-3 py-1 text-xs font-bold whitespace-nowrap" style="background: var(--state-info-bg); color: var(--state-info); border-radius: var(--radius-sm);">归位</button>
                    </div>
                </div>
            </article>

            <!-- Item 3: 吉伊卡哇挂件 - 在柜 -->
            <article class="flex gap-3 p-3" style="background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);">
                <div class="shrink-0 flex items-center justify-center w-14 h-14" style="background: var(--bg-secondary); border-radius: var(--radius-md);">
                    <span class="text-2xl leading-none" aria-hidden="true">🌸</span>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex items-start justify-between gap-2">
                        <div class="min-w-0 flex-1">
                            <h3 class="text-base font-bold truncate" style="color: var(--text-primary);">吉伊卡哇挂件</h3>
                            <p class="text-xs truncate mt-0.5" style="color: var(--text-secondary);">吉伊卡哇</p>
                        </div>
                        <div class="shrink-0 flex flex-col items-end gap-1">
                            <span class="inline-flex items-center px-2 py-0.5 text-[10px] font-bold whitespace-nowrap" style="background: var(--state-success-bg); color: var(--state-success); border-radius: var(--radius-sm);">在柜</span>
                            <span class="text-sm font-bold" style="color: var(--brand-primary);">¥45</span>
                        </div>
                    </div>
                    <div class="flex items-center justify-between mt-2 pt-2" style="border-top: 1px solid var(--border-light);">
                        <span class="inline-flex items-center px-2 py-0.5 text-[10px] font-medium whitespace-nowrap" style="background: var(--bg-tertiary); color: var(--text-secondary); border-radius: var(--radius-sm);">挂件</span>
                        <button class="inline-flex items-center justify-center px-3 py-1 text-xs font-bold whitespace-nowrap" style="background: var(--brand-primary-bg); color: var(--brand-primary); border-radius: var(--radius-sm);">带出门</button>
                    </div>
                </div>
            </article>

            <!-- Item 4: 蓝色监狱卡牌 - 在柜 -->
            <article class="flex gap-3 p-3" style="background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);">
                <div class="shrink-0 flex items-center justify-center w-14 h-14" style="background: var(--bg-tertiary); border-radius: var(--radius-md);">
                    <span class="text-2xl leading-none" aria-hidden="true">⭐</span>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex items-start justify-between gap-2">
                        <div class="min-w-0 flex-1">
                            <h3 class="text-base font-bold truncate" style="color: var(--text-primary);">蓝色监狱卡牌</h3>
                            <p class="text-xs truncate mt-0.5" style="color: var(--text-secondary);">蓝色监狱</p>
                        </div>
                        <div class="shrink-0 flex flex-col items-end gap-1">
                            <span class="inline-flex items-center px-2 py-0.5 text-[10px] font-bold whitespace-nowrap" style="background: var(--state-success-bg); color: var(--state-success); border-radius: var(--radius-sm);">在柜</span>
                            <span class="text-sm font-bold" style="color: var(--brand-primary);">¥35</span>
                        </div>
                    </div>
                    <div class="flex items-center justify-between mt-2 pt-2" style="border-top: 1px solid var(--border-light);">
                        <span class="inline-flex items-center px-2 py-0.5 text-[10px] font-medium whitespace-nowrap" style="background: var(--bg-tertiary); color: var(--text-secondary); border-radius: var(--radius-sm);">卡牌</span>
                        <button class="inline-flex items-center justify-center px-3 py-1 text-xs font-bold whitespace-nowrap" style="background: var(--brand-primary-bg); color: var(--brand-primary); border-radius: var(--radius-sm);">带出门</button>
                    </div>
                </div>
            </article>

            <!-- Item 5: 排球少年徽章 - 已借出 -->
            <article class="flex gap-3 p-3" style="background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);">
                <div class="shrink-0 flex items-center justify-center w-14 h-14" style="background: var(--bg-secondary); border-radius: var(--radius-md);">
                    <span class="text-2xl leading-none" aria-hidden="true">🎪</span>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex items-start justify-between gap-2">
                        <div class="min-w-0 flex-1">
                            <h3 class="text-base font-bold truncate" style="color: var(--text-primary);">排球少年徽章</h3>
                            <p class="text-xs truncate mt-0.5" style="color: var(--text-secondary);">排球少年!!</p>
                        </div>
                        <div class="shrink-0 flex flex-col items-end gap-1">
                            <span class="inline-flex items-center px-2 py-0.5 text-[10px] font-bold whitespace-nowrap" style="background: var(--bg-secondary); color: var(--text-tertiary); border-radius: var(--radius-sm);">已借出</span>
                            <span class="text-sm font-bold" style="color: var(--brand-primary);">¥55</span>
                        </div>
                    </div>
                    <div class="flex items-center justify-between mt-2 pt-2" style="border-top: 1px solid var(--border-light);">
                        <span class="inline-flex items-center px-2 py-0.5 text-[10px] font-medium whitespace-nowrap" style="background: var(--bg-tertiary); color: var(--text-secondary); border-radius: var(--radius-sm);">徽章</span>
                        <button class="inline-flex items-center justify-center px-3 py-1 text-xs font-bold whitespace-nowrap" style="background: var(--bg-secondary); color: var(--text-tertiary); border-radius: var(--radius-sm);">已借出</button>
                    </div>
                </div>
            </article>

            <!-- Item 6: 阿尼亚钥匙扣 - 在柜 -->
            <article class="flex gap-3 p-3" style="background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);">
                <div class="shrink-0 flex items-center justify-center w-14 h-14" style="background: var(--bg-tertiary); border-radius: var(--radius-md);">
                    <span class="text-2xl leading-none" aria-hidden="true">🦊</span>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex items-start justify-between gap-2">
                        <div class="min-w-0 flex-1">
                            <h3 class="text-base font-bold truncate" style="color: var(--text-primary);">阿尼亚钥匙扣</h3>
                            <p class="text-xs truncate mt-0.5" style="color: var(--text-secondary);">间谍过家家</p>
                        </div>
                        <div class="shrink-0 flex flex-col items-end gap-1">
                            <span class="inline-flex items-center px-2 py-0.5 text-[10px] font-bold whitespace-nowrap" style="background: var(--state-success-bg); color: var(--state-success); border-radius: var(--radius-sm);">在柜</span>
                            <span class="text-sm font-bold" style="color: var(--brand-primary);">¥42</span>
                        </div>
                    </div>
                    <div class="flex items-center justify-between mt-2 pt-2" style="border-top: 1px solid var(--border-light);">
                        <span class="inline-flex items-center px-2 py-0.5 text-[10px] font-medium whitespace-nowrap" style="background: var(--bg-tertiary); color: var(--text-secondary); border-radius: var(--radius-sm);">钥匙扣</span>
                        <button class="inline-flex items-center justify-center px-3 py-1 text-xs font-bold whitespace-nowrap" style="background: var(--brand-primary-bg); color: var(--brand-primary); border-radius: var(--radius-sm);">带出门</button>
                    </div>
                </div>
            </article>

        </section>

        <div class="h-4"></div>
    </main>

    <!-- ====== 5. Floating Action Button ====== -->
    <button class="fixed z-40 flex items-center justify-center w-14 h-14" style="bottom: calc(var(--tabbar-height) + 12px); right: max(16px, calc((100vw - 480px) / 2 + 16px)); background: var(--brand-primary); color: var(--text-inverse); border-radius: var(--radius-full); box-shadow: var(--shadow-float);" aria-label="快速添加谷子">
        <i data-lucide="plus" class="w-6 h-6"></i>
    </button>

    <!-- ====== 6. Game-style Bottom Nav ====== -->
    <nav class="fixed bottom-0 inset-x-0 mx-auto z-30" style="max-width: 480px;" aria-label="主导航">
        <div class="flex items-start justify-around pt-2 pb-1" style="background: var(--surface); border-top: 2px solid var(--border-light); height: var(--tabbar-height);">
            <button data-dom-id="nav-home" class="flex flex-col items-center gap-1 px-2 pt-1" aria-label="首页">
                <span class="flex items-center justify-center w-9 h-9 rounded-md" style="background: var(--bg-secondary); color: var(--text-tertiary);">
                    <i data-lucide="home" class="w-5 h-5"></i>
                </span>
                <span class="text-[10px] font-medium" style="color: var(--text-tertiary);">首页</span>
            </button>
            <button data-dom-id="nav-cabinet" class="flex flex-col items-center gap-1 px-2 pt-1" aria-label="谷子柜" aria-current="page">
                <span class="flex items-center justify-center w-9 h-9 rounded-md" style="background: var(--brand-primary); color: var(--text-inverse);">
                    <i data-lucide="archive" class="w-5 h-5"></i>
                </span>
                <span class="text-[10px] font-bold" style="color: var(--brand-primary);">谷子柜</span>
            </button>
            <button data-dom-id="nav-presale" class="flex flex-col items-center gap-1 px-2 pt-1" aria-label="预售">
                <span class="flex items-center justify-center w-9 h-9 rounded-md" style="background: var(--bg-secondary); color: var(--text-tertiary);">
                    <i data-lucide="clock" class="w-5 h-5"></i>
                </span>
                <span class="text-[10px] font-medium" style="color: var(--text-tertiary);">预售</span>
            </button>
            <button data-dom-id="nav-ootd" class="flex flex-col items-center gap-1 px-2 pt-1" aria-label="搭配">
                <span class="flex items-center justify-center w-9 h-9 rounded-md" style="background: var(--bg-secondary); color: var(--text-tertiary);">
                    <i data-lucide="sparkles" class="w-5 h-5"></i>
                </span>
                <span class="text-[10px] font-medium" style="color: var(--text-tertiary);">搭配</span>
            </button>
            <button data-dom-id="nav-studio" class="flex flex-col items-center gap-1 px-2 pt-1" aria-label="工坊">
                <span class="flex items-center justify-center w-9 h-9 rounded-md" style="background: var(--bg-secondary); color: var(--text-tertiary);">
                    <i data-lucide="wrench" class="w-5 h-5"></i>
                </span>
                <span class="text-[10px] font-medium" style="color: var(--text-tertiary);">工坊</span>
            </button>
        </div>
    </nav>

    <style>
        nav button[aria-current="page"] span:first-child {
            box-shadow: 0 2px 10px rgba(255, 126, 95, 0.35);
            transition: box-shadow 0.2s ease;
        }
        nav button[aria-current="page"] span:first-child:hover {
            box-shadow: 0 3px 16px rgba(255, 126, 95, 0.5);
        }
        nav button:not([aria-current]) span:first-child {
            transition: background-color 0.15s ease;
        }
        nav button:not([aria-current]):hover span:first-child {
            background: var(--bg-tertiary) !important;
        }
        header button { transition: background-color 0.15s ease; }
        header button:hover { background: rgba(255,255,255,0.4) !important; }
        section[aria-label="筛选"] button {
            transition: background-color 0.15s ease, color 0.15s ease;
        }
        section[aria-label="筛选"] button:hover {
            opacity: 0.85;
        }
        section[aria-label="搜索"] input {
            transition: border-color 0.15s ease;
        }
        section[aria-label="搜索"] input:focus {
            border-color: var(--border-focus);
        }
        section[aria-label="谷子列表"] > article {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            cursor: pointer;
        }
        section[aria-label="谷子列表"] > article:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md) !important;
        }
        section[aria-label="谷子列表"] > article:active {
            transform: scale(0.98);
        }
        button[aria-label="快速添加谷子"] {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        button[aria-label="快速添加谷子"]:hover {
            transform: scale(1.08);
            box-shadow: 0 16px 40px rgba(61,46,16,0.18) !important;
        }
        button[aria-label="快速添加谷子"]:active {
            transform: scale(0.95);
        }
        section[aria-label="谷子列表"] button[style*="brand-primary-bg"] {
            transition: background-color 0.15s ease;
        }
        section[aria-label="谷子列表"] button[style*="brand-primary-bg"]:hover {
            background: var(--brand-primary) !important;
            color: var(--text-inverse) !important;
        }
        button:focus-visible, a:focus-visible, input:focus-visible {
            outline: 2px solid var(--border-focus);
            outline-offset: 2px;
            border-radius: var(--radius-sm);
        }
        @media (min-width: 481px) {
            body { background: var(--bg-secondary); }
