<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>谷哒 · AI 搭配推荐</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style id="theme-vars">
/* 谷哒 · 方向C — 暖阳活力 */
:root {
  --bg: #FFFCF5;
  --bg-secondary: #FFF8EB;
  --bg-tertiary: #FFF4DE;
  --surface: #FFFFFF;
  --surface-hover: #FFFBF0;
  --surface-inset: #FFF8EB;
  --text-primary: #3D2E10;
  --text-secondary: #7A6530;
  --text-tertiary: #B8A870;
  --text-inverse: #FFFFFF;
  --brand-primary: #FF7E5F;
  --brand-primary-light: #FFA48C;
  --brand-primary-bg: #FFF3EF;
  --brand-primary-hover: #FF6A48;
  --state-success: #6BCB77;
  --state-success-bg: #EEFBF0;
  --state-warning: #FFB347;
  --state-warning-bg: #FFF8EC;
  --state-error: #FF6B6B;
  --state-error-bg: #FFF0F0;
  --state-info: #7EB6FF;
  --state-info-bg: #F0F6FF;
  --border: #F0E4C8;
  --border-light: #FAF3E5;
  --border-focus: #FF7E5F;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-full: 9999px;
  --shadow-sm: 0 1px 3px rgba(61,46,16,0.04);
  --shadow-md: 0 4px 12px rgba(61,46,16,0.06);
  --shadow-lg: 0 8px 24px rgba(61,46,16,0.08);
  --shadow-float: 0 12px 32px rgba(61,46,16,0.12);
  --font-display: 'Baloo 2', 'Noto Sans SC', -apple-system, sans-serif;
  --font-body: 'Baloo 2', 'Noto Sans SC', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --space-2xl: 48px;
  --nav-height: 64px;
  --tabbar-height: 68px;
  --container-max: 480px;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--text-primary);
    --color-secondary: var(--text-secondary);
  }
  @layer base {
    body { background: var(--text-background); color: var(--text-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="mx-auto max-w-[480px] min-h-screen pb-[100px]" style="background: var(--bg); font-family: var(--font-body);">

        <!-- ====== 1. Header ====== -->
        <header class="relative flex items-center justify-between px-5 pt-6 pb-5" style="background: var(--brand-primary); border-radius: 0 0 var(--radius-lg) var(--radius-lg);">
            <div class="flex items-center gap-3">
                <span class="text-2xl leading-none" aria-hidden="true">🐦</span>
                <h1 class="text-2xl font-bold" style="color: var(--text-inverse); font-family: var(--font-display); text-wrap: balance;">AI 搭配</h1>
            </div>
            <button class="flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-bold whitespace-nowrap" style="background: rgba(255,255,255,0.25); color: var(--text-inverse);" aria-label="换一批推荐">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                <span>换一批</span>
            </button>
        </header>

        <div class="h-3"></div>

        <!-- ====== 2. AI Recommendation Hero Card ====== -->
        <section class="px-4" aria-label="AI推荐搭配">
            <div class="relative overflow-hidden px-5 py-5" style="background: linear-gradient(135deg, var(--brand-primary-bg) 0%, var(--bg-secondary) 100%); border-radius: var(--radius-lg); box-shadow: var(--shadow-md);">
                <div class="flex gap-4">
                    <!-- Speech bubble -->
                    <div class="flex-1 min-w-0">
                        <div class="flex items-start gap-2 mb-3">
                            <span class="text-2xl leading-none shrink-0" aria-hidden="true">🐦</span>
                            <div class="flex-1 min-w-0 px-3 py-2.5" style="background: var(--surface); border-radius: var(--radius-md) var(--radius-md) var(--radius-md) 4px; box-shadow: var(--shadow-sm);">
                                <p class="text-sm font-bold leading-relaxed" style="color: var(--text-primary);">今天天气晴朗，推荐带上金属质感的吧唧~</p>
                            </div>
                        </div>
                        <!-- Preview tiles -->
                        <div class="flex gap-2 ml-8">
                            <div class="w-12 h-12 rounded-lg flex items-center justify-center text-xl shrink-0" style="background: var(--surface); box-shadow: var(--shadow-sm);">
                                <span aria-hidden="true">🪙</span>
                            </div>
                            <div class="w-12 h-12 rounded-lg flex items-center justify-center text-xl shrink-0" style="background: var(--surface); box-shadow: var(--shadow-sm);">
                                <span aria-hidden="true">🎀</span>
                            </div>
                            <div class="w-12 h-12 rounded-lg flex items-center justify-center text-xl shrink-0" style="background: var(--surface); box-shadow: var(--shadow-sm);">
                                <span aria-hidden="true">👜</span>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Match score badge -->
                <div class="flex items-center gap-1.5 mt-4">
                    <span class="inline-flex items-center justify-center px-3 py-1.5 text-sm font-bold whitespace-nowrap" style="background: var(--brand-primary); color: var(--text-inverse); border-radius: var(--radius-sm);">匹配度 92%</span>
                    <span class="text-xs font-medium" style="color: var(--text-tertiary);">基于天气、场景和你的收藏分析</span>
                </div>
            </div>
        </section>

        <div class="h-4"></div>

        <!-- ====== 3. Selected Outfit Detail ====== -->
        <section class="px-4" aria-label="推荐搭配详情">
            <h2 class="text-lg font-bold px-1 mb-3" style="color: var(--text-primary); font-family: var(--font-display); text-wrap: balance;">推荐搭配</h2>
            <div class="flex gap-3 overflow-x-auto no-scrollbar pb-2">
                <!-- Item 1 -->
                <div class="flex flex-col items-center shrink-0 w-[120px] py-4 px-3 relative" style="background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-md);">
                    <span class="absolute top-2 right-2 inline-flex items-center justify-center w-5 h-5 rounded-full text-[10px] font-bold" style="background: var(--state-success); color: var(--text-inverse);">
                        <i data-lucide="check" class="w-3 h-3"></i>
                    </span>
                    <span class="text-4xl leading-none mb-2" aria-hidden="true">🪙</span>
                    <span class="text-sm font-bold text-center truncate w-full" style="color: var(--text-primary);">金属吧唧</span>
                    <span class="text-xs text-center truncate w-full mt-0.5" style="color: var(--text-tertiary);">吧唧系列</span>
                    <button class="mt-2 px-3 py-1 text-xs font-bold rounded-lg whitespace-nowrap" style="background: var(--bg-secondary); color: var(--text-secondary);" aria-label="替换金属吧唧">替换</button>
                </div>
                <!-- Item 2 -->
                <div class="flex flex-col items-center shrink-0 w-[120px] py-4 px-3 relative" style="background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-md);">
                    <span class="absolute top-2 right-2 inline-flex items-center justify-center w-5 h-5 rounded-full text-[10px] font-bold" style="background: var(--state-success); color: var(--text-inverse);">
                        <i data-lucide="check" class="w-3 h-3"></i>
                    </span>
                    <span class="text-4xl leading-none mb-2" aria-hidden="true">🎀</span>
                    <span class="text-sm font-bold text-center truncate w-full" style="color: var(--text-primary);">丝带挂件</span>
                    <span class="text-xs text-center truncate w-full mt-0.5" style="color: var(--text-tertiary);">挂件系列</span>
                    <button class="mt-2 px-3 py-1 text-xs font-bold rounded-lg whitespace-nowrap" style="background: var(--bg-secondary); color: var(--text-secondary);" aria-label="替换丝带挂件">替换</button>
                </div>
                <!-- Item 3 -->
                <div class="flex flex-col items-center shrink-0 w-[120px] py-4 px-3 relative" style="background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-md);">
                    <span class="absolute top-2 right-2 inline-flex items-center justify-center w-5 h-5 rounded-full text-[10px] font-bold" style="background: var(--state-success); color: var(--text-inverse);">
                        <i data-lucide="check" class="w-3 h-3"></i>
                    </span>
                    <span class="text-4xl leading-none mb-2" aria-hidden="true">👜</span>
                    <span class="text-sm font-bold text-center truncate w-full" style="color: var(--text-primary);">痛包挂饰</span>
                    <span class="text-xs text-center truncate w-full mt-0.5" style="color: var(--text-tertiary);">挂饰系列</span>
                    <button class="mt-2 px-3 py-1 text-xs font-bold rounded-lg whitespace-nowrap" style="background: var(--bg-secondary); color: var(--text-secondary);" aria-label="替换痛包挂饰">替换</button>
                </div>
            </div>
        </section>

        <div class="h-4"></div>

        <!-- ====== 4. Photography Suggestion Card ====== -->
        <section class="px-4" aria-label="拍摄建议">
            <div class="px-5 py-5" style="background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);">
                <div class="flex items-center gap-2 mb-3">
                    <span class="text-xl leading-none" aria-hidden="true">📸</span>
                    <h2 class="text-base font-bold" style="color: var(--text-primary); font-family: var(--font-display);">拍摄建议</h2>
                </div>
                <p class="text-sm leading-relaxed" style="color: var(--text-secondary);">推荐在户外咖啡馆旁，利用自然光线拍摄金属吧唧的反光效果。搭配白色桌面对比度最佳。</p>
                <div class="flex gap-2 mt-3 flex-wrap">
                    <span class="inline-flex items-center px-3 py-1 text-xs font-bold whitespace-nowrap" style="background: var(--bg-secondary); color: var(--text-secondary); border-radius: var(--radius-sm);">自然光</span>
                    <span class="inline-flex items-center px-3 py-1 text-xs font-bold whitespace-nowrap" style="background: var(--bg-secondary); color: var(--text-secondary); border-radius: var(--radius-sm);">浅色背景</span>
                    <span class="inline-flex items-center px-3 py-1 text-xs font-bold whitespace-nowrap" style="background: var(--bg-secondary); color: var(--text-secondary); border-radius: var(--radius-sm);">45度角</span>
                </div>
            </div>
        </section>

        <div class="h-4"></div>

        <!-- ====== 5. Alternative Suggestions ====== -->
        <section class="px-4 pb-4" aria-label="其他搭配方案">
            <h2 class="text-lg font-bold px-1 mb-3" style="color: var(--text-primary); font-family: var(--font-display); text-wrap: balance;">其他搭配方案</h2>

            <!-- Card 1: 校园风 -->
            <div class="px-5 py-4 mb-3 relative" style="background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);">
                <div class="flex items-center justify-between mb-3">
                    <span class="text-base font-bold" style="color: var(--text-primary);">校园风</span>
                    <span class="inline-flex items-center justify-center px-2.5 py-1 text-xs font-bold whitespace-nowrap" style="background: var(--brand-primary-bg); color: var(--brand-primary); border-radius: var(--radius-sm);">匹配度 85%</span>
                </div>
                <div class="flex gap-2 mb-3">
                    <div class="w-11 h-11 rounded-lg flex items-center justify-center text-lg shrink-0" style="background: var(--bg-secondary);">
                        <span aria-hidden="true">🎒</span>
                    </div>
                    <div class="w-11 h-11 rounded-lg flex items-center justify-center text-lg shrink-0" style="background: var(--bg-secondary);">
                        <span aria-hidden="true">📝</span>
                    </div>
                    <div class="w-11 h-11 rounded-lg flex items-center justify-center text-lg shrink-0" style="background: var(--bg-secondary);">
                        <span aria-hidden="true">☕</span>
                    </div>
                </div>
                <button class="w-full py-2.5 text-sm font-bold rounded-lg whitespace-nowrap" style="background: var(--brand-primary); color: var(--text-inverse);" aria-label="选用校园风方案">选用此方案</button>
            </div>

            <!-- Card 2: 街拍风 -->
            <div class="px-5 py-4 relative" style="background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);">
                <div class="flex items-center justify-between mb-3">
                    <span class="text-base font-bold" style="color: var(--text-primary);">街拍风</span>
                    <span class="inline-flex items-center justify-center px-2.5 py-1 text-xs font-bold whitespace-nowrap" style="background: var(--bg-secondary); color: var(--text-secondary); border-radius: var(--radius-sm);">匹配度 78%</span>
                </div>
                <div class="flex gap-2 mb-3">
                    <div class="w-11 h-11 rounded-lg flex items-center justify-center text-lg shrink-0" style="background: var(--bg-secondary);">
                        <span aria-hidden="true">🧢</span>
                    </div>
                    <div class="w-11 h-11 rounded-lg flex items-center justify-center text-lg shrink-0" style="background: var(--bg-secondary);">
                        <span aria-hidden="true">🕶️</span>
                    </div>
                    <div class="w-11 h-11 rounded-lg flex items-center justify-center text-lg shrink-0" style="background: var(--bg-secondary);">
                        <span aria-hidden="true">🛹</span>
                    </div>
                </div>
                <button class="w-full py-2.5 text-sm font-bold rounded-lg whitespace-nowrap" style="background: var(--brand-primary); color: var(--text-inverse);" aria-label="选用街拍风方案">选用此方案</button>
            </div>
        </section>

    </main>

    <!-- ====== 6. Bottom Tab Bar ====== -->
    <nav class="fixed bottom-0 inset-x-0 mx-auto z-30" style="max-width: 480px;" aria-label="主导航">
        <div class="flex items-start justify-around pt-2 pb-1" style="background: var(--surface); border-top: 2px solid var(--border-light); height: var(--tabbar-height);">
            <button data-dom-id="nav-home" class="flex flex-col items-center gap-1 px-2 pt-1" aria-label="首页">
                <span class="flex items-center justify-center w-9 h-9 rounded-md" style="background: var(--bg-secondary); color: var(--text-tertiary);">
                    <i data-lucide="home" class="w-5 h-5"></i>
                </span>
                <span class="text-[10px] font-medium" style="color: var(--text-tertiary);">首页</span>
            </button>
            <button data-dom-id="nav-cabinet" class="flex flex-col items-center gap-1 px-2 pt-1" aria-label="谷子柜">
                <span class="flex items-center justify-center w-9 h-9 rounded-md" style="background: var(--bg-secondary); color: var(--text-tertiary);">
                    <i data-lucide="archive" class="w-5 h-5"></i>
                </span>
                <span class="text-[10px] font-medium" style="color: var(--text-tertiary);">谷子柜</span>
            </button>
            <button data-dom-id="nav-presale" class="flex flex-col items-center gap-1 px-2 pt-1" aria-label="预售">
                <span class="flex items-center justify-center w-9 h-9 rounded-md" style="background: var(--bg-secondary); color: var(--text-tertiary);">
                    <i data-lucide="clock" class="w-5 h-5"></i>
                </span>
                <span class="text-[10px] font-medium" style="color: var(--text-tertiary);">预售</span>
            </button>
            <button data-dom-id="nav-ootd" class="flex flex-col items-center gap-1 px-2 pt-1" aria-label="搭配" aria-current="page">
                <span class="flex items-center justify-center w-9 h-9 rounded-md" style="background: var(--brand-primary); color: var(--text-inverse);">
                    <i data-lucide="sparkles" class="w-5 h-5"></i>
                </span>
                <span class="text-[10px] font-bold" style="color: var(--brand-primary);">搭配</span>
            </button>
            <button data-dom-id="nav-studio" class="flex flex-col items-center gap-1 px-2 pt-1" aria-label="工坊">
                <span class="flex items-center justify-center w-9 h-9 rounded-md" style="background: var(--bg-secondary); color: var(--text-tertiary);">
                    <i data-lucide="wrench" class="w-5 h-5"></i>
                </span>
                <span class="text-[10px] font-medium" style="color: var(--text-tertiary);">工坊</span>
            </button>
        </div>
    </nav>

    <style>
        /* Tab bar active glow */
        nav button[aria-current="page"] span:first-child {
            box-shadow: 0 2px 10px rgba(255, 126, 95, 0.35);
            transition: box-shadow 0.2s ease;
        }
        nav button[aria-current="page"] span:first-child:hover {
            box-shadow: 0 3px 16px rgba(255, 126, 95, 0.5);
        }
        nav button:not([aria-current]) span:first-child {
            transition: background-color 0.15s ease;
        }
        nav button:not([aria-current]):hover span:first-child {
            background: var(--bg-tertiary) !important;
        }

        /* Header button hover */
        header button { transition: background-color 0.15s ease; }
        header button:hover { background: rgba(255,255,255,0.4) !important; }

        /* Card hover */
        section[aria-label="推荐搭配详情"] > div > div {
            transition: transform 0.2s ease; cursor: pointer;
        }
        section[aria-label="推荐搭配详情"] > div > div:hover { transform: translateY(-2px); }
        section[aria-label="推荐搭配详情"] > div > div button {
            transition: background-color 0.15s ease;
        }
        section[aria-label="推荐搭配详情"] > div > div button:hover {
            background: var(--bg-tertiary) !important;
        }

        /* Alt suggestion card hover */
        section[aria-label="其他搭配方案"] > div {
            transition: transform 0.15s ease; cursor: pointer;
        }
        section[aria-label="其他搭配方案"] > div:hover { transform: translateY(-1px); }
        section[aria-label="其他搭配方案"] > div button {
            transition: background-color 0.15s ease;
        }
        section[aria-label="其他搭配方案"] > div button:hover {
            background: var(--brand-primary-hover) !important;
        }

        /* Hero card hover */
        section[aria-label="AI推荐搭配"] > div {
            transition: box-shadow 0.2s ease;
        }
        section[aria-label="AI推荐搭配"] > div:hover {
            box-shadow: var(--shadow-lg) !important;
        }

        /* Focus visible */
        button:focus-visible, a:focus-visible {
            outline: 2px solid var(--border-focus);
            outline-offset: 2px;
            border-radius: var(--radius-sm);
        }

        /* Responsive: wider screens */
        @media (min-width: 481px) {
            body { background: var(--bg-secondary); }
            main { box-shadow: var(--shadow-lg); border-radius: var(--radius-lg); overflow: hidden; }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }
    </style>

    <script>lucide.createIcons();</script>
</body>
</html>
