<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>谷哒 · 内容工坊</title>
    <style id="theme-vars">
/* 谷哒 · 方向C — 暖阳活力 */
:root {
  --bg: #FFFCF5;
  --bg-secondary: #FFF8EB;
  --bg-tertiary: #FFF4DE;
  --surface: #FFFFFF;
  --surface-hover: #FFFBF0;
  --surface-inset: #FFF8EB;
  --text-primary: #3D2E10;
  --text-secondary: #7A6530;
  --text-tertiary: #B8A870;
  --text-inverse: #FFFFFF;
  --brand-primary: #FF7E5F;
  --brand-primary-light: #FFA48C;
  --brand-primary-bg: #FFF3EF;
  --brand-primary-hover: #FF6A48;
  --state-success: #6BCB77;
  --state-success-bg: #EEFBF0;
  --state-warning: #FFB347;
  --state-warning-bg: #FFF8EC;
  --state-error: #FF6B6B;
  --state-error-bg: #FFF0F0;
  --state-info: #7EB6FF;
  --state-info-bg: #F0F6FF;
  --border: #F0E4C8;
  --border-light: #FAF3E5;
  --border-focus: #FF7E5F;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-full: 9999px;
  --shadow-sm: 0 1px 3px rgba(61,46,16,0.04);
  --shadow-md: 0 4px 12px rgba(61,46,16,0.06);
  --shadow-lg: 0 8px 24px rgba(61,46,16,0.08);
  --shadow-float: 0 12px 32px rgba(61,46,16,0.12);
  --font-display: 'Baloo 2', 'Noto Sans SC', -apple-system, sans-serif;
  --font-body: 'Baloo 2', 'Noto Sans SC', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --space-2xl: 48px;
  --nav-height: 64px;
  --tabbar-height: 68px;
  --container-max: 480px;
}
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--text-primary);
    --color-secondary: var(--text-secondary);
  }
  @layer base {
    body { background: var(--text-background); color: var(--text-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="mx-auto max-w-[480px] min-h-screen pb-[100px]" style="background: var(--bg); font-family: var(--font-body);">

        <!-- ====== 1. Header ====== -->
        <header class="relative flex items-center justify-between px-5 pt-6 pb-8" style="background: var(--brand-primary); border-radius: 0 0 var(--radius-lg) var(--radius-lg);">
            <div class="flex items-center gap-3">
                <span class="text-3xl leading-none" aria-hidden="true">🐦</span>
                <h1 class="text-2xl font-bold" style="color: var(--text-inverse); font-family: var(--font-display); text-wrap: balance;">内容工坊</h1>
            </div>
            <button class="flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-bold whitespace-nowrap" style="background: rgba(255,255,255,0.25); color: var(--text-inverse);" aria-label="我的作品">
                <i data-lucide="folder-open" class="w-4 h-4"></i>
                <span>我的作品</span>
            </button>
        </header>

        <!-- ====== 2. Tool Grid (2x2) ====== -->
        <section class="px-4 mt-6" aria-label="创作工具">
            <div class="grid grid-cols-2 gap-3">

                <!-- Card: 拍照模板 -->
                <button class="flex flex-col items-start py-5 px-4 text-left" style="background: var(--bg-secondary); border-radius: var(--radius-lg);">
                    <span class="text-[40px] leading-none mb-2" aria-hidden="true">📸</span>
                    <span class="text-base font-bold truncate w-full" style="color: var(--text-primary); font-family: var(--font-display);">拍照模板</span>
                    <span class="text-xs truncate w-full mt-1" style="color: var(--text-secondary);">AI生成拍照构图参考</span>
                    <span class="shrink-0 inline-flex items-center mt-3 px-2 py-0.5 rounded-md text-[10px] font-bold whitespace-nowrap" style="background: var(--brand-primary); color: var(--text-inverse);">12个模板</span>
                </button>

                <!-- Card: OOTD卡片 -->
                <button class="flex flex-col items-start py-5 px-4 text-left" style="background: var(--brand-primary-bg); border-radius: var(--radius-lg);">
                    <span class="text-[40px] leading-none mb-2" aria-hidden="true">🎨</span>
                    <span class="text-base font-bold truncate w-full" style="color: var(--text-primary); font-family: var(--font-display);">OOTD卡片</span>
                    <span class="text-xs truncate w-full mt-1" style="color: var(--text-secondary);">制作搭配展示卡片</span>
                    <span class="shrink-0 inline-flex items-center mt-3 px-2 py-0.5 rounded-md text-[10px] font-bold whitespace-nowrap" style="background: var(--brand-primary); color: var(--text-inverse);">一键生成</span>
                </button>

                <!-- Card: 拼贴创作 -->
                <button class="flex flex-col items-start py-5 px-4 text-left" style="background: var(--bg-tertiary); border-radius: var(--radius-lg);">
                    <span class="text-[40px] leading-none mb-2" aria-hidden="true">✂️</span>
                    <span class="text-base font-bold truncate w-full" style="color: var(--text-primary); font-family: var(--font-display);">拼贴创作</span>
                    <span class="text-xs truncate w-full mt-1" style="color: var(--text-secondary);">多图拼贴与排版</span>
                    <span class="shrink-0 inline-flex items-center mt-3 px-2 py-0.5 rounded-md text-[10px] font-bold whitespace-nowrap" style="background: var(--state-success); color: var(--text-inverse);">自由创作</span>
                </button>

                <!-- Card: 小剧场 (Coming Soon) -->
                <button class="relative flex flex-col items-start py-5 px-4 text-left opacity-80" style="background: var(--state-info-bg); border-radius: var(--radius-lg);">
                    <span class="absolute top-3 right-3 inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-bold whitespace-nowrap" style="background: var(--state-info); color: var(--text-inverse);">即将上线</span>
                    <span class="text-[40px] leading-none mb-2" aria-hidden="true">🎬</span>
                    <span class="text-base font-bold truncate w-full" style="color: var(--text-primary); font-family: var(--font-display);">小剧场</span>
                    <span class="text-xs truncate w-full mt-1" style="color: var(--text-secondary);">制作谷子定格动画</span>
                    <span class="shrink-0 inline-flex items-center mt-3 px-2 py-0.5 rounded-md text-[10px] font-bold whitespace-nowrap" style="background: var(--border-light); color: var(--text-tertiary);">敬请期待</span>
                </button>

            </div>
        </section>

        <!-- ====== 3. Recent Works ====== -->
        <section class="mt-8" aria-label="我的最近作品">
            <div class="flex items-center justify-between px-4 mb-3">
                <h2 class="text-lg font-bold" style="color: var(--text-primary); font-family: var(--font-display); text-wrap: balance;">我的最近作品</h2>
                <button class="flex items-center gap-1 text-xs font-bold whitespace-nowrap" style="color: var(--brand-primary);" aria-label="查看全部作品">
                    <span>查看全部</span>
                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </button>
            </div>
            <div class="flex gap-3 overflow-x-auto px-4 no-scrollbar pb-1">

                <!-- Recent Work Card 1 -->
                <div class="shrink-0 w-[140px]" style="background: var(--surface); border-radius: var(--radius-md); box-shadow: var(--shadow-md);">
                    <div class="flex items-center justify-center w-full aspect-square rounded-t-md" style="background: linear-gradient(135deg, var(--brand-primary-bg) 0%, var(--bg-tertiary) 100%);">
                        <span class="text-5xl leading-none" aria-hidden="true">🧿</span>
                    </div>
                    <div class="p-3">
                        <p class="text-sm font-bold truncate" style="color: var(--text-primary);">五条悟 OOTD卡</p>
                        <p class="text-[10px] mt-0.5" style="color: var(--text-tertiary);">7月9日</p>
                        <button class="mt-2 w-full flex items-center justify-center gap-1 py-1.5 rounded-md text-[10px] font-bold whitespace-nowrap" style="background: var(--bg-secondary); color: var(--text-secondary);" aria-label="分享五条悟 OOTD卡">
                            <i data-lucide="share-2" class="w-3 h-3"></i>
                            <span>分享</span>
                        </button>
                    </div>
                </div>

                <!-- Recent Work Card 2 -->
                <div class="shrink-0 w-[140px]" style="background: var(--surface); border-radius: var(--radius-md); box-shadow: var(--shadow-md);">
                    <div class="flex items-center justify-center w-full aspect-square rounded-t-md" style="background: linear-gradient(135deg, var(--state-info-bg) 0%, var(--bg-secondary) 100%);">
                        <span class="text-5xl leading-none" aria-hidden="true">🌙</span>
                    </div>
                    <div class="p-3">
                        <p class="text-sm font-bold truncate" style="color: var(--text-primary);">祢豆子拍照模板</p>
                        <p class="text-[10px] mt-0.5" style="color: var(--text-tertiary);">7月8日</p>
                        <button class="mt-2 w-full flex items-center justify-center gap-1 py-1.5 rounded-md text-[10px] font-bold whitespace-nowrap" style="background: var(--bg-secondary); color: var(--text-secondary);" aria-label="分享祢豆子拍照模板">
                            <i data-lucide="share-2" class="w-3 h-3"></i>
                            <span>分享</span>
                        </button>
                    </div>
                </div>

                <!-- Recent Work Card 3 -->
                <div class="shrink-0 w-[140px]" style="background: var(--surface); border-radius: var(--radius-md); box-shadow: var(--shadow-md);">
                    <div class="flex items-center justify-center w-full aspect-square rounded-t-md" style="background: linear-gradient(135deg, var(--bg-tertiary) 0%, var(--state-success-bg) 100%);">
                        <span class="text-5xl leading-none" aria-hidden="true">🎭</span>
                    </div>
                    <div class="p-3">
                        <p class="text-sm font-bold truncate" style="color: var(--text-primary);">谷子拼贴 #3</p>
                        <p class="text-[10px] mt-0.5" style="color: var(--text-tertiary);">7月5日</p>
                        <button class="mt-2 w-full flex items-center justify-center gap-1 py-1.5 rounded-md text-[10px] font-bold whitespace-nowrap" style="background: var(--bg-secondary); color: var(--text-secondary);" aria-label="分享谷子拼贴">
                            <i data-lucide="share-2" class="w-3 h-3"></i>
                            <span>分享</span>
                        </button>
                    </div>
                </div>

            </div>
        </section>

        <!-- ====== 4. Weekly Challenge Banner ====== -->
        <section class="mx-4 mt-8 flex flex-col items-center py-6 px-5" style="background: linear-gradient(135deg, var(--brand-primary) 0%, var(--brand-primary-light) 100%); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);" aria-label="每周挑战">
            <span class="text-3xl leading-none mb-2" aria-hidden="true">🏆</span>
            <h2 class="text-lg font-bold text-center" style="color: var(--text-inverse); font-family: var(--font-display); text-wrap: balance;">本周挑战: 夏日谷子摄影</h2>
            <p class="text-sm text-center mt-1" style="color: rgba(255,255,255,0.85);">带谷子去户外拍照，赢取限定勋章</p>
            <button class="mt-4 flex items-center gap-1.5 px-6 py-2.5 rounded-lg text-sm font-bold whitespace-nowrap" style="background: var(--text-inverse); color: var(--brand-primary); box-shadow: var(--shadow-sm);" aria-label="参加挑战">
                <i data-lucide="trophy" class="w-4 h-4"></i>
                <span>参加挑战</span>
            </button>
        </section>

        <div class="h-6"></div>
    </main>

    <!-- ====== 5. Game-style Bottom Nav ====== -->
    <nav class="fixed bottom-0 inset-x-0 mx-auto z-30" style="max-width: 480px;" aria-label="主导航">
        <div class="flex items-start justify-around pt-2 pb-1" style="background: var(--surface); border-top: 2px solid var(--border-light); height: var(--tabbar-height);">
            <button data-dom-id="nav-home" class="flex flex-col items-center gap-1 px-2 pt-1" aria-label="首页">
                <span class="flex items-center justify-center w-9 h-9 rounded-md" style="background: var(--bg-secondary); color: var(--text-tertiary);">
                    <i data-lucide="home" class="w-5 h-5"></i>
                </span>
                <span class="text-[10px] font-medium" style="color: var(--text-tertiary);">首页</span>
            </button>
            <button data-dom-id="nav-cabinet" class="flex flex-col items-center gap-1 px-2 pt-1" aria-label="谷子柜">
                <span class="flex items-center justify-center w-9 h-9 rounded-md" style="background: var(--bg-secondary); color: var(--text-tertiary);">
                    <i data-lucide="archive" class="w-5 h-5"></i>
                </span>
                <span class="text-[10px] font-medium" style="color: var(--text-tertiary);">谷子柜</span>
            </button>
            <button data-dom-id="nav-presale" class="flex flex-col items-center gap-1 px-2 pt-1" aria-label="预售">
                <span class="flex items-center justify-center w-9 h-9 rounded-md" style="background: var(--bg-secondary); color: var(--text-tertiary);">
                    <i data-lucide="clock" class="w-5 h-5"></i>
                </span>
                <span class="text-[10px] font-medium" style="color: var(--text-tertiary);">预售</span>
            </button>
            <button data-dom-id="nav-ootd" class="flex flex-col items-center gap-1 px-2 pt-1" aria-label="搭配">
                <span class="flex items-center justify-center w-9 h-9 rounded-md" style="background: var(--bg-secondary); color: var(--text-tertiary);">
                    <i data-lucide="sparkles" class="w-5 h-5"></i>
                </span>
                <span class="text-[10px] font-medium" style="color: var(--text-tertiary);">搭配</span>
            </button>
            <button data-dom-id="nav-studio" class="flex flex-col items-center gap-1 px-2 pt-1" aria-label="工坊" aria-current="page">
                <span class="flex items-center justify-center w-9 h-9 rounded-md" style="background: var(--brand-primary); color: var(--text-inverse);">
                    <i data-lucide="wrench" class="w-5 h-5"></i>
                </span>
                <span class="text-[10px] font-bold" style="color: var(--brand-primary);">工坊</span>
            </button>
        </div>
    </nav>

    <style>
        nav button[aria-current="page"] span:first-child {
            box-shadow: 0 2px 10px rgba(255, 126, 95, 0.35);
            transition: box-shadow 0.2s ease;
        }
        nav button[aria-current="page"] span:first-child:hover {
            box-shadow: 0 3px 16px rgba(255, 126, 95, 0.5);
        }
        nav button:not([aria-current]) span:first-child {
            transition: background-color 0.15s ease;
        }
        nav button:not([aria-current]):hover span:first-child {
            background: var(--bg-tertiary) !important;
        }
        section[aria-label="创作工具"] button {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }
        section[aria-label="创作工具"] button:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }
        section[aria-label="创作工具"] button:active {
            transform: translateY(0) scale(0.98);
        }
        section[aria-label="我的最近作品"] > div > div {
            transition: transform 0.2s ease;
            cursor: pointer;
        }
        section[aria-label="我的最近作品"] > div > div:hover {
            transform: translateY(-2px);
        }
        section[aria-label="每周挑战"] button {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            cursor: pointer;
        }
        section[aria-label="每周挑战"] button:hover {
            transform: scale(1.04);
            box-shadow: var(--shadow-md);
        }
        section[aria-label="每周挑战"] button:active {
            transform: scale(0.97);
        }
        header button { transition: background-color 0.15s ease; }
        header button:hover { background: rgba(255,255,255,0.4) !important; }
        button:focus-visible, a:focus-visible {
            outline: 2px solid var(--border-focus);
            outline-offset: 2px;
            border-radius: var(--radius-sm);
        }
        @media (min-width: 481px) {
            body { background: var(--bg-secondary); }
            main { box-shadow: var(--shadow-lg); border-radius: var(--radius-lg); overflow: hidden; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }
    </style>

    <script>lucide.createIcons();</script>
</body>
</html>
