<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>谷哒 · 首页</title>
    <style id="theme-vars">
/* 谷哒 · 方向C — 暖阳活力 */
:root {
  --bg: #FFFCF5;
  --bg-secondary: #FFF8EB;
  --bg-tertiary: #FFF4DE;
  --surface: #FFFFFF;
  --surface-hover: #FFFBF0;
  --surface-inset: #FFF8EB;
  --text-primary: #3D2E10;
  --text-secondary: #7A6530;
  --text-tertiary: #B8A870;
  --text-inverse: #FFFFFF;
  --brand-primary: #FF7E5F;
  --brand-primary-light: #FFA48C;
  --brand-primary-bg: #FFF3EF;
  --brand-primary-hover: #FF6A48;
  --state-success: #6BCB77;
  --state-success-bg: #EEFBF0;
  --state-warning: #FFB347;
  --state-warning-bg: #FFF8EC;
  --state-error: #FF6B6B;
  --state-error-bg: #FFF0F0;
  --state-info: #7EB6FF;
  --state-info-bg: #F0F6FF;
  --border: #F0E4C8;
  --border-light: #FAF3E5;
  --border-focus: #FF7E5F;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-full: 9999px;
  --shadow-sm: 0 1px 3px rgba(61,46,16,0.04);
  --shadow-md: 0 4px 12px rgba(61,46,16,0.06);
  --shadow-lg: 0 8px 24px rgba(61,46,16,0.08);
  --shadow-float: 0 12px 32px rgba(61,46,16,0.12);
  --font-display: 'Baloo 2', 'Noto Sans SC', -apple-system, sans-serif;
  --font-body: 'Baloo 2', 'Noto Sans SC', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --space-2xl: 48px;
  --nav-height: 64px;
  --tabbar-height: 68px;
  --container-max: 480px;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--text-primary);
    --color-secondary: var(--text-secondary);
  }
  @layer base {
    body { background: var(--text-background); color: var(--text-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="mx-auto max-w-[480px] min-h-screen pb-[100px]" style="background: var(--bg); font-family: var(--font-body);">

        <!-- ====== 1. Bold Chunky Header with Character ====== -->
        <header class="relative flex items-center justify-between px-5 pt-6 pb-8" style="background: var(--brand-primary); border-radius: 0 0 var(--radius-lg) var(--radius-lg);">
            <div class="flex items-center gap-3">
                <span class="text-3xl leading-none" aria-hidden="true">🐦</span>
                <h1 class="text-2xl font-bold" style="color: var(--text-inverse); font-family: var(--font-display); text-wrap: balance;">谷哒</h1>
            </div>
            <button class="flex items-center justify-center w-10 h-10 rounded-lg" style="background: rgba(255,255,255,0.25); color: var(--text-inverse);" aria-label="搜索">
                <i data-lucide="search" class="w-5 h-5"></i>
            </button>
            <!-- Speech bubble overlapping header -->
            <div class="absolute left-5 -bottom-4 bg-white px-4 py-2 rounded-2xl flex items-center gap-1" style="box-shadow: var(--shadow-md); border-radius: var(--radius-md) var(--radius-md) var(--radius-md) 4px;">
                <span class="text-sm font-bold" style="color: var(--brand-primary);">咕咕哒~</span>
            </div>
        </header>

        <!-- spacer for speech bubble -->
        <div class="h-6"></div>

        <!-- ====== 2. Weather + OOTD 2-block Hero ====== -->
        <section class="px-4" aria-label="天气与今日推荐">
            <div class="grid grid-cols-2 gap-3">
                <!-- Weather tile -->
                <div class="flex flex-col items-center justify-center py-6 px-3" style="background: var(--bg-secondary); border-radius: var(--radius-lg);">
                    <span class="text-5xl leading-none mb-2" aria-hidden="true">☀️</span>
                    <span class="text-3xl font-bold leading-none" style="color: var(--text-primary); font-family: var(--font-display);">28°C</span>
                    <span class="text-xs mt-1 font-medium" style="color: var(--text-secondary);">晴朗 · 适合拍照</span>
                </div>
                <!-- OOTD tile -->
                <div class="flex flex-col justify-between py-6 px-4 relative" style="background: var(--brand-primary-bg); border-radius: var(--radius-lg);">
                    <span class="text-xs font-bold" style="color: var(--brand-primary);">今日推荐</span>
                    <div>
                        <p class="text-sm font-bold leading-snug" style="color: var(--text-primary);">适合带金属吧唧出门</p>
                        <span class="inline-flex items-center justify-center mt-2 w-7 h-7 rounded-md" style="background: var(--brand-primary); color: var(--text-inverse);">
                            <i data-lucide="arrow-right" class="w-4 h-4"></i>
                        </span>
                    </div>
                </div>
            </div>
        </section>

        <!-- ====== 3. Stats as Bold Number Tiles 2x2 ====== -->
        <section class="px-4 mt-6" aria-label="收藏统计">
            <div class="grid grid-cols-2 gap-3">
                <div class="flex flex-col items-center justify-center py-5 px-3" style="background: var(--bg-secondary); border-radius: var(--radius-lg);">
                    <span class="text-xs font-medium" style="color: var(--text-tertiary);">谷子总数</span>
                    <span class="text-[40px] leading-none font-bold mt-1" style="color: var(--brand-primary); font-family: var(--font-display);">5</span>
                    <span class="text-lg mt-1" aria-hidden="true">📦</span>
                </div>
                <div class="flex flex-col items-center justify-center py-5 px-3" style="background: var(--bg-tertiary); border-radius: var(--radius-lg);">
                    <span class="text-xs font-medium" style="color: var(--text-tertiary);">待补款</span>
                    <span class="text-[40px] leading-none font-bold mt-1" style="color: var(--brand-primary); font-family: var(--font-display);">3</span>
                    <span class="text-lg mt-1" aria-hidden="true">💰</span>
                </div>
                <div class="flex flex-col items-center justify-center py-5 px-3" style="background: var(--bg-tertiary); border-radius: var(--radius-lg);">
                    <span class="text-xs font-medium" style="color: var(--text-tertiary);">待收货</span>
                    <span class="text-[40px] leading-none font-bold mt-1" style="color: var(--brand-primary); font-family: var(--font-display);">2</span>
                    <span class="text-lg mt-1" aria-hidden="true">🚚</span>
                </div>
                <div class="flex flex-col items-center justify-center py-5 px-3" style="background: var(--bg-secondary); border-radius: var(--radius-lg);">
                    <span class="text-xs font-medium" style="color: var(--text-tertiary);">出门装备</span>
                    <span class="text-[40px] leading-none font-bold mt-1" style="color: var(--brand-primary); font-family: var(--font-display);">1</span>
                    <span class="text-lg mt-1" aria-hidden="true">🎒</span>
                </div>
            </div>
        </section>

        <!-- ====== 4. Pre-orders as Bold Warning Banners ====== -->
        <section class="mt-8" aria-label="预售提醒">
            <h2 class="text-lg font-bold px-4 mb-3" style="color: var(--text-primary); font-family: var(--font-display); text-wrap: balance;">预售补款提醒</h2>
            <div class="mx-4 mb-3 flex items-center justify-between px-4 py-4" style="background: var(--state-error-bg); border-radius: var(--radius-md);">
                <div class="flex-1 min-w-0 mr-3">
                    <p class="text-base font-bold truncate" style="color: var(--state-error);">祢豆子吧唧 · 最终补款</p>
                    <p class="text-xs truncate mt-0.5" style="color: var(--text-secondary);">鬼灭之刃 / 吧唧系列</p>
                </div>
                <span class="shrink-0 inline-flex items-center justify-center px-3 py-1.5 text-xs font-bold whitespace-nowrap" style="background: var(--state-error); color: var(--text-inverse); border-radius: var(--radius-sm);">明天截止</span>
            </div>
            <div class="mx-4 mb-3 flex items-center justify-between px-4 py-4" style="background: var(--surface); border-radius: var(--radius-md); box-shadow: var(--shadow-sm);">
                <div class="flex-1 min-w-0 mr-3">
                    <p class="text-base font-bold truncate" style="color: var(--text-primary);">五条悟立牌 · 二期尾款</p>
                    <p class="text-xs truncate mt-0.5" style="color: var(--text-secondary);">咒术回战 / 立牌系列</p>
                </div>
                <span class="shrink-0 inline-flex items-center justify-center px-3 py-1.5 text-xs font-bold whitespace-nowrap" style="background: var(--state-warning-bg); color: var(--state-warning); border-radius: var(--radius-sm);">7月15日</span>
            </div>
            <div class="mx-4 mb-3 flex items-center justify-between px-4 py-4" style="background: var(--surface); border-radius: var(--radius-md); box-shadow: var(--shadow-sm);">
                <div class="flex-1 min-w-0 mr-3">
                    <p class="text-base font-bold truncate" style="color: var(--text-primary);">阿尼亚钥匙扣 · 全款</p>
                    <p class="text-xs truncate mt-0.5" style="color: var(--text-secondary);">间谍过家家 / 周边系列</p>
                </div>
                <span class="shrink-0 inline-flex items-center justify-center px-3 py-1.5 text-xs font-bold whitespace-nowrap" style="background: var(--state-info-bg); color: var(--state-info); border-radius: var(--radius-sm);">7月20日</span>
            </div>
        </section>

        <!-- ====== 5. Recent Items as Tilted Polaroid Cards ====== -->
        <section class="mt-8 px-4" aria-label="最近谷子">
            <h2 class="text-lg font-bold mb-4" style="color: var(--text-primary); font-family: var(--font-display); text-wrap: balance;">最近入手</h2>
            <div class="relative" style="min-height: 280px;">
                <div class="absolute left-2 top-0 w-[52%]" style="transform: rotate(-2deg);">
                    <div class="flex flex-col items-center py-5 px-3" style="background: var(--surface); border-radius: var(--radius-md); box-shadow: var(--shadow-lg);">
                        <span class="text-4xl leading-none mb-2" aria-hidden="true">🔮</span>
                        <span class="text-sm font-bold text-center truncate w-full" style="color: var(--text-primary);">咒术回战亚克力</span>
                    </div>
                </div>
                <div class="absolute right-0 top-4 w-[44%]" style="transform: rotate(1.5deg);">
                    <div class="flex flex-col items-center py-5 px-3" style="background: var(--surface); border-radius: var(--radius-md); box-shadow: var(--shadow-lg);">
                        <span class="text-4xl leading-none mb-2" aria-hidden="true">🎭</span>
                        <span class="text-sm font-bold text-center truncate w-full" style="color: var(--text-primary);">排球少年徽章</span>
                    </div>
                </div>
                <div class="absolute left-8 top-[150px] w-[46%]" style="transform: rotate(1deg);">
                    <div class="flex flex-col items-center py-5 px-3" style="background: var(--surface); border-radius: var(--radius-md); box-shadow: var(--shadow-lg);">
                        <span class="text-4xl leading-none mb-2" aria-hidden="true">🌸</span>
                        <span class="text-sm font-bold text-center truncate w-full" style="color: var(--text-primary);">吉伊卡哇挂件</span>
                    </div>
                </div>
                <div class="absolute right-4 top-[160px] w-[40%]" style="transform: rotate(-1.5deg);">
                    <div class="flex flex-col items-center py-5 px-3" style="background: var(--surface); border-radius: var(--radius-md); box-shadow: var(--shadow-lg);">
                        <span class="text-4xl leading-none mb-2" aria-hidden="true">⭐</span>
                        <span class="text-sm font-bold text-center truncate w-full" style="color: var(--text-primary);">蓝色监狱卡牌</span>
                    </div>
                </div>
            </div>
        </section>

        <div class="h-4"></div>
    </main>

    <!-- ====== 6. Game-style Bottom Nav ====== -->
    <nav class="fixed bottom-0 inset-x-0 mx-auto z-30" style="max-width: 480px;" aria-label="主导航">
        <div class="flex items-start justify-around pt-2 pb-1" style="background: var(--surface); border-top: 2px solid var(--border-light); height: var(--tabbar-height);">
            <button data-dom-id="nav-home" class="flex flex-col items-center gap-1 px-2 pt-1" aria-label="首页" aria-current="page">
                <span class="flex items-center justify-center w-9 h-9 rounded-md" style="background: var(--brand-primary); color: var(--text-inverse);">
                    <i data-lucide="home" class="w-5 h-5"></i>
                </span>
                <span class="text-[10px] font-bold" style="color: var(--brand-primary);">首页</span>
            </button>
            <button data-dom-id="nav-cabinet" class="flex flex-col items-center gap-1 px-2 pt-1" aria-label="谷子柜">
                <span class="flex items-center justify-center w-9 h-9 rounded-md" style="background: var(--bg-secondary); color: var(--text-tertiary);">
                    <i data-lucide="archive" class="w-5 h-5"></i>
                </span>
                <span class="text-[10px] font-medium" style="color: var(--text-tertiary);">谷子柜</span>
            </button>
            <button data-dom-id="nav-presale" class="flex flex-col items-center gap-1 px-2 pt-1" aria-label="预售">
                <span class="flex items-center justify-center w-9 h-9 rounded-md" style="background: var(--bg-secondary); color: var(--text-tertiary);">
                    <i data-lucide="clock" class="w-5 h-5"></i>
                </span>
                <span class="text-[10px] font-medium" style="color: var(--text-tertiary);">预售</span>
            </button>
            <button data-dom-id="nav-ootd" class="flex flex-col items-center gap-1 px-2 pt-1" aria-label="搭配">
                <span class="flex items-center justify-center w-9 h-9 rounded-md" style="background: var(--bg-secondary); color: var(--text-tertiary);">
                    <i data-lucide="sparkles" class="w-5 h-5"></i>
                </span>
                <span class="text-[10px] font-medium" style="color: var(--text-tertiary);">搭配</span>
            </button>
            <button data-dom-id="nav-studio" class="flex flex-col items-center gap-1 px-2 pt-1" aria-label="工坊">
                <span class="flex items-center justify-center w-9 h-9 rounded-md" style="background: var(--bg-secondary); color: var(--text-tertiary);">
                    <i data-lucide="wrench" class="w-5 h-5"></i>
                </span>
                <span class="text-[10px] font-medium" style="color: var(--text-tertiary);">工坊</span>
            </button>
        </div>
    </nav>

    <style>
        nav button[aria-current="page"] span:first-child {
            box-shadow: 0 2px 10px rgba(255, 126, 95, 0.35);
            transition: box-shadow 0.2s ease;
        }
        nav button[aria-current="page"] span:first-child:hover {
            box-shadow: 0 3px 16px rgba(255, 126, 95, 0.5);
        }
        nav button:not([aria-current]) span:first-child {
            transition: background-color 0.15s ease;
        }
        nav button:not([aria-current]):hover span:first-child {
            background: var(--bg-tertiary) !important;
        }
        section[aria-label="最近谷子"] > div > div > div {
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            cursor: pointer;
        }
        section[aria-label="最近谷子"] > div > div > div:hover {
            box-shadow: 0 12px 32px rgba(61,46,16,0.15) !important;
        }
        header button { transition: background-color 0.15s ease; }
        header button:hover { background: rgba(255,255,255,0.4) !important; }
        section[aria-label="收藏统计"] > div > div {
            transition: transform 0.2s ease; cursor: pointer;
        }
        section[aria-label="收藏统计"] > div > div:hover { transform: scale(1.03); }
        section[aria-label="预售提醒"] > div:not(h2) {
            transition: transform 0.15s ease; cursor: pointer;
        }
        section[aria-label="预售提醒"] > div:not(h2):hover { transform: translateX(2px); }
        section[aria-label="天气与今日推荐"] > div > div {
            transition: transform 0.2s ease; cursor: pointer;
        }
        section[aria-label="天气与今日推荐"] > div > div:hover { transform: translateY(-2px); }
        button:focus-visible, a:focus-visible {
            outline: 2px solid var(--border-focus);
            outline-offset: 2px;
            border-radius: var(--radius-sm);
        }
        @media (min-width: 481px) {
            body { background: var(--bg-secondary); }
            main { box-shadow: var(--shadow-lg); border-radius: var(--radius-lg); overflow: hidden; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }
    </style>

    <script>lucide.createIcons();</script>
</body>
</html>
