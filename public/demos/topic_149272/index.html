    <!-- 浏览器体验版模拟API：模拟Electron的electronAPI，让HTML版本可交互体验 -->
    <script>
    (function() {
      // 模拟宠物图片SVG data URI（体验版占位图）
      var petSvg = 'data:image/svg+xml;utf8,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">' +
        '<defs><radialGradient id="g" cx="50%" cy="40%"><stop offset="0%" stop-color="#f5d4a8"/><stop offset="100%" stop-color="#d4a574"/></radialGradient></defs>' +
        '<ellipse cx="200" cy="260" rx="110" ry="90" fill="url(#g)"/>' +
        '<circle cx="200" cy="160" r="85" fill="url(#g)"/>' +
        '<path d="M135 110 L145 60 L175 100 Z" fill="#c4956a"/>' +
        '<path d="M265 110 L255 60 L225 100 Z" fill="#c4956a"/>' +
        '<circle cx="172" cy="155" r="11" fill="#3a2a1a"/>' +
        '<circle cx="228" cy="155" r="11" fill="#3a2a1a"/>' +
        '<circle cx="175" cy="152" r="4" fill="white"/>' +
        '<circle cx="231" cy="152" r="4" fill="white"/>' +
        '<ellipse cx="200" cy="178" rx="9" ry="6" fill="#3a2a1a"/>' +
        '<path d="M188 192 Q200 202 212 192" stroke="#3a2a1a" stroke-width="2.5" fill="none"/>' +
        '<circle cx="152" cy="172" r="13" fill="#ffb0b0" opacity="0.5"/>' +
        '<circle cx="248" cy="172" r="13" fill="#ffb0b0" opacity="0.5"/>' +
        '</svg>'
      );
      // 模拟对话回复池
      var replies = ['主人你来啦！我好想你呀~','（摇摇尾巴）今天过得怎么样？','嘿嘿，主人陪我玩吗？','（蹭蹭你的手）最喜欢主人了~','主人今天开心吗？我超开心的！','汪汪！主人抱抱我嘛~','（歪头看着你）主人在想什么呢？','（打了个哈欠）主人...可以陪我躺一会儿吗？','主人主人！我今天乖乖吃饭了哦~','（用头蹭你）别走嘛，再陪我玩一会儿~'];
      function delay(ms){return new Promise(function(r){setTimeout(r,ms);});}
      function pick(a){return a[Math.floor(Math.random()*a.length)];}
      // 模拟 electronAPI（与 preload.js 接口完全对应）
      window.electronAPI = {
        minimize:function(){},maximize:function(){},close:function(){},quitApp:function(){},
        isMaximized:function(){return Promise.resolve(false);},onMaximizeChange:function(){},
        generatePetFromPhoto:async function(){await delay(3000);return{success:true,imageUrl:petSvg,description:'一只可爱的小宠物'};},
        generatePetFromInfo:async function(){await delay(3000);return{success:true,imageUrl:petSvg};},
        chatWithPet:async function(){await delay(1500);return{success:true,reply:pick(replies)};},
        generateDiary:async function(){await delay(2000);return{success:true,content:'亲爱的日记，今天主人又来看我了！我们一起晒太阳，一起玩耍，好开心呀。主人摸摸我的头的时候，我觉得自己是世界上最幸福的小动物。希望明天主人也会来陪我~'};},
        generateDreamStory:async function(){await delay(2000);return{success:true,content:'（揉揉眼睛）主人...我刚做了个好梦...梦见我们一起在草地上跑，你扔出飞盘我接住，风暖暖的，阳光金灿灿的...然后你就来了，真好~'};},
        ttsSynthesize:async function(){return{success:false};},
        getApiUsage:async function(){return{date:'2026-07-14',usedToday:156,remaining:1844,totalUsed:2380,quota:2000};},
        resetApiUsage:async function(){return{date:'2026-07-14',usedToday:0,remaining:2000,totalUsed:0,quota:2000};},
        sendMessage:function(){},onMessage:function(){}
      };
    })();
    </script>
