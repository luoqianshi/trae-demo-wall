<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 情绪星球 - 你的情绪，正在创造一颗星球</title>
<style>
/* ===== CSS Variables ===== */
:root {
  --bg-deep: #0a0a1a;
  --bg-mid: #151530;
  --purple-light: #b388ff;
  --purple-mid: #7c4dff;
  --purple-deep: #4a148c;
  --golden: #ffd54f;
  --golden-glow: #ffb300;
  --calm-blue: #64b5f6;
  --calm-glow: #42a5f5;
  --sad-purple: #9e9e9e;
  --sad-glow: #757575;
  --anxious-orange: #ff8a65;
  --anxious-glow: #ff7043;
  --angry-red: #ef5350;
  --angry-glow: #c62828;
  --text-primary: #e8e0f0;
  --text-secondary: #b0a0c8;
  --card-bg: rgba(20, 15, 40, 0.7);
  --card-border: rgba(120, 80, 200, 0.25);
  --glow-soft: 0 0 60px rgba(124, 77, 255, 0.3);
  --glow-medium: 0 0 80px rgba(124, 77, 255, 0.5);
  --planet-size: 220px;
}

*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  font-size: 16px;
}

body {
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  background: var(--bg-deep);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ===== Stars Background ===== */
.stars-container {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
}
.star {
  position: absolute;
  background: #fff;
  border-radius: 50%;
  animation: twinkle var(--dur) ease-in-out infinite;
  animation-delay: var(--delay);
  opacity: 0;
}
@keyframes twinkle {
  0%, 100% { opacity: 0.2; transform: scale(1); }
  50% { opacity: 0.9; transform: scale(1.3); }
}

/* Floating nebula blobs */
.nebula {
  position: fixed;
  border-radius: 50%;
  filter: blur(120px);
  opacity: 0.12;
  pointer-events: none;
  z-index: 0;
  animation: floatNebula 20s ease-in-out infinite;
}
.nebula-1 {
  width: 500px; height: 500px;
  background: radial-gradient(circle, #7c4dff 0%, transparent 70%);
  top: -10%; left: -5%;
  animation-delay: 0s;
}
.nebula-2 {
  width: 400px; height: 400px;
  background: radial-gradient(circle, #e040fb 0%, transparent 70%);
  top: 50%; right: -8%;
  animation-delay: -7s;
}
.nebula-3 {
  width: 350px; height: 350px;
  background: radial-gradient(circle, #448aff 0%, transparent 70%);
  bottom: -5%; left: 30%;
  animation-delay: -14s;
}
@keyframes floatNebula {
  0%, 100% { transform: translate(0, 0) scale(1); }
  25% { transform: translate(30px, -40px) scale(1.08); }
  50% { transform: translate(-20px, 20px) scale(0.95); }
  75% { transform: translate(-40px, -10px) scale(1.04); }
}

/* ===== Main Layout ===== */
.main-container {
  position: relative;
  z-index: 1;
  max-width: 900px;
  margin: 0 auto;
  padding: 0 20px;
}

/* ===== Hero Section ===== */
.hero {
  text-align: center;
  padding: 60px 20px 30px;
}

.hero-title {
  font-size: clamp(2rem, 6vw, 3.5rem);
  font-weight: 800;
  background: linear-gradient(135deg, #e0c3fc 0%, #b388ff 40%, #7c4dff 70%, #448aff 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 0.04em;
  margin-bottom: 12px;
  animation: titleGlow 3s ease-in-out infinite;
}
@keyframes titleGlow {
  0%, 100% { filter: drop-shadow(0 0 12px rgba(124,77,255,0.4)); }
  50% { filter: drop-shadow(0 0 24px rgba(124,77,255,0.7)); }
}

.hero-tagline {
  font-size: clamp(1rem, 2.5vw, 1.3rem);
  color: var(--text-secondary);
  font-weight: 300;
  letter-spacing: 0.08em;
  animation: fadeInUp 1s ease-out;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== Planet Section ===== */
.planet-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 10px 0 30px;
}

.planet-stage {
  position: relative;
  width: 320px;
  height: 320px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 8px;
}

/* Orbit ring */
.orbit-ring {
  position: absolute;
  width: 290px; height: 290px;
  border: 1px solid rgba(180, 140, 255, 0.18);
  border-radius: 50%;
  animation: orbitSpin 20s linear infinite;
}
.orbit-ring::before {
  content: '';
  position: absolute;
  width: 10px; height: 10px;
  background: #c0b0ff;
  border-radius: 50%;
  top: -5px;
  left: 50%;
  transform: translateX(-50%);
  box-shadow: 0 0 10px rgba(180,140,255,0.6);
}
@keyframes orbitSpin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* Second orbit ring */
.orbit-ring-2 {
  position: absolute;
  width: 250px; height: 120px;
  border: 1px solid rgba(180, 140, 255, 0.12);
  border-radius: 50%;
  animation: orbitTilt 15s linear infinite;
  transform: rotateX(65deg);
}
.orbit-ring-2::after {
  content: '';
  position: absolute;
  width: 8px; height: 8px;
  background: #e0b0ff;
  border-radius: 50%;
  top: -4px;
  right: 30%;
  box-shadow: 0 0 8px rgba(200,160,255,0.5);
}
@keyframes orbitTilt {
  from { transform: rotateX(65deg) rotate(0deg); }
  to { transform: rotateX(65deg) rotate(360deg); }
}

/* Main Planet */
.planet {
  position: relative;
  width: var(--planet-size);
  height: var(--planet-size);
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, 
    #9370db 0%, 
    #6a3fb5 25%, 
    #4a2080 55%, 
    #2a1050 100%);
  box-shadow: 
    inset -20px -20px 60px rgba(0,0,0,0.5),
    inset 10px 10px 30px rgba(255,255,255,0.08),
    0 0 60px rgba(124, 77, 255, 0.35),
    0 0 120px rgba(124, 77, 255, 0.15);
  transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  animation: planetPulse 4s ease-in-out infinite;
  cursor: pointer;
  z-index: 2;
}

@keyframes planetPulse {
  0%, 100% { box-shadow: inset -20px -20px 60px rgba(0,0,0,0.5),inset 10px 10px 30px rgba(255,255,255,0.08),0 0 60px var(--planet-glow, rgba(124,77,255,0.35)),0 0 120px var(--planet-glow, rgba(124,77,255,0.15)); }
  50% { box-shadow: inset -20px -20px 60px rgba(0,0,0,0.5),inset 10px 10px 30px rgba(255,255,255,0.08),0 0 80px var(--planet-glow, rgba(124,77,255,0.5)),0 0 150px var(--planet-glow, rgba(124,77,255,0.22)); }
}

/* Planet atmosphere ring */
.planet-atmosphere {
  position: absolute;
  top: -12px; left: -12px;
  width: calc(var(--planet-size) + 24px);
  height: calc(var(--planet-size) + 24px);
  border-radius: 50%;
  background: transparent;
  box-shadow: 0 0 40px rgba(124,77,255,0.2);
  transition: box-shadow 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  pointer-events: none;
}

/* Floating particles around planet */
.floating-particle {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  animation: floatAround var(--fdur) ease-in-out infinite;
  animation-delay: var(--fdelay);
}
@keyframes floatAround {
  0%, 100% { transform: translate(var(--fx), var(--fy)) scale(1); opacity: 0.6; }
  25% { transform: translate(var(--fx2), var(--fy2)) scale(1.4); opacity: 0.9; }
  50% { transform: translate(var(--fx3), var(--fy3)) scale(0.8); opacity: 0.4; }
  75% { transform: translate(var(--fx4), var(--fy4)) scale(1.2); opacity: 0.7; }
}

/* ===== Emotion Wheel ===== */
.emotion-section {
  text-align: center;
  padding: 10px 0 30px;
}

.emotion-label {
  font-size: 0.95rem;
  color: var(--text-secondary);
  margin-bottom: 18px;
  letter-spacing: 0.05em;
  animation: fadeInUp 1s ease-out 0.2s both;
}

.emotion-wheel {
  display: flex;
  justify-content: center;
  gap: clamp(8px, 2vw, 18px);
  flex-wrap: wrap;
}

.emotion-btn {
  position: relative;
  width: 72px;
  height: 72px;
  border-radius: 50%;
  border: 2px solid rgba(180, 140, 255, 0.3);
  background: var(--card-bg);
  cursor: pointer;
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  color: var(--text-secondary);
  font-size: 0.8rem;
  font-weight: 500;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  animation: fadeInUp 1s ease-out calc(var(--btn-idx) * 0.1s) both;
}

.emotion-btn:hover {
  transform: translateY(-6px) scale(1.08);
  border-color: rgba(200, 160, 255, 0.6);
  box-shadow: 0 8px 30px rgba(124, 77, 255, 0.25);
}

.emotion-btn:active {
  transform: scale(0.95);
}

.emotion-btn.active {
  border-color: rgba(255, 255, 255, 0.7);
  box-shadow: 0 0 30px var(--btn-glow);
  transform: translateY(-4px);
  color: #fff;
}

.emotion-emoji {
  font-size: 1.5rem;
  line-height: 1;
}

.emotion-btn:nth-child(1) { --btn-glow: rgba(255,213,79,0.5); }
.emotion-btn:nth-child(2) { --btn-glow: rgba(100,181,246,0.5); }
.emotion-btn:nth-child(3) { --btn-glow: rgba(158,158,158,0.5); }
.emotion-btn:nth-child(4) { --btn-glow: rgba(255,138,101,0.5); }
.emotion-btn:nth-child(5) { --btn-glow: rgba(239,83,80,0.5); }

/* ===== Affirmation Message ===== */
.affirmation-box {
  text-align: center;
  max-width: 500px;
  margin: 0 auto 30px;
  min-height: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.affirmation-text {
  font-size: 1.1rem;
  font-weight: 400;
  line-height: 1.8;
  color: var(--text-primary);
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 24px;
  padding: 18px 28px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

.affirmation-text.show {
  opacity: 1;
  transform: translateY(0);
}

/* ===== Section Divider ===== */
.section-divider {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 30px 0;
  opacity: 0.6;
}
.section-divider::before,
.section-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(180,140,255,0.4), transparent);
}
.section-divider span {
  font-size: 0.8rem;
  color: var(--text-secondary);
  letter-spacing: 0.1em;
}

/* ===== Emotion Calendar ===== */
.calendar-section {
  padding: 20px 0;
}

.section-title {
  text-align: center;
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--purple-light);
  margin-bottom: 8px;
}

.section-subtitle {
  text-align: center;
  font-size: 0.85rem;
  color: var(--text-secondary);
  margin-bottom: 24px;
}

.calendar-grid {
  display: flex;
  justify-content: center;
  gap: clamp(10px, 2.5vw, 20px);
  flex-wrap: wrap;
}

.calendar-day {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  animation: fadeInUp 0.6s ease-out var(--cdelay) both;
}

.calendar-mini-planet {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  transition: all 0.4s ease;
  cursor: pointer;
  position: relative;
}

.calendar-mini-planet:hover {
  transform: scale(1.15);
}

.calendar-mini-planet.today {
  box-shadow: 0 0 20px rgba(255,255,255,0.3);
  border: 2px solid rgba(255,255,255,0.5);
}

.calendar-date {
  font-size: 0.75rem;
  color: var(--text-secondary);
}

.calendar-emoji {
  font-size: 0.9rem;
}

/* ===== Journal / Streak Section ===== */
.journal-section {
  padding: 20px 0 60px;
}

.streak-display {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  margin-bottom: 30px;
}

.streak-number {
  font-size: 3rem;
  font-weight: 800;
  background: linear-gradient(135deg, #ffd54f, #ffab00);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.streak-label {
  font-size: 0.9rem;
  color: var(--text-secondary);
}

/* Growing tree */
.tree-container {
  display: flex;
  justify-content: center;
  align-items: flex-end;
  height: 200px;
  position: relative;
  overflow: hidden;
}

.tree {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
}

.tree-trunk {
  width: 12px;
  height: 60px;
  background: linear-gradient(180deg, #8d6e63, #5d4037);
  border-radius: 4px 4px 0 0;
}

.tree-crown {
  position: relative;
  width: 100px;
  height: 100px;
  margin-bottom: -10px;
}

.tree-leaf {
  position: absolute;
  border-radius: 50%;
  transition: all 0.6s ease;
}

.tree-leaf-1 {
  width: 50px; height: 50px;
  background: radial-gradient(circle at 40% 40%, #66bb6a, #2e7d32);
  top: 10px; left: 25px;
  animation: leafSway 3s ease-in-out infinite;
}

.tree-leaf-2 {
  width: 40px; height: 40px;
  background: radial-gradient(circle at 40% 40%, #81c784, #388e3c);
  top: 30px; left: 5px;
  animation: leafSway 3s ease-in-out 0.5s infinite;
}

.tree-leaf-3 {
  width: 40px; height: 40px;
  background: radial-gradient(circle at 40% 40%, #a5d6a7, #43a047);
  top: 30px; right: 5px;
  animation: leafSway 3s ease-in-out 1s infinite;
}

.tree-leaf-4 {
  width: 35px; height: 35px;
  background: radial-gradient(circle at 40% 40%, #c8e6c9, #4caf50);
  top: 0px; left: 30px;
  animation: leafSway 3s ease-in-out 1.5s infinite;
}

.tree-leaf-5 {
  width: 30px; height: 30px;
  background: radial-gradient(circle at 40% 40%, #e8f5e9, #66bb6a);
  top: 15px; left: 40px;
  animation: leafSway 3s ease-in-out 2s infinite;
}

.tree-petal {
  position: absolute;
  width: 8px; height: 8px;
  border-radius: 50%;
  opacity: 0;
  transition: all 0.5s ease;
}

@keyframes leafSway {
  0%, 100% { transform: rotate(0deg) translateY(0); }
  50% { transform: rotate(3deg) translateY(-3px); }
}

/* Glowing orb on tree */
.tree-orb {
  position: absolute;
  width: 14px; height: 14px;
  border-radius: 50%;
  top: 25px;
  left: 43px;
  background: var(--orb-color, #ffd54f);
  box-shadow: 0 0 15px var(--orb-glow, rgba(255,213,79,0.6));
  animation: orbFloat 2s ease-in-out infinite;
  opacity: 0;
  transition: opacity 0.5s ease;
}

.tree-orb.visible {
  opacity: 1;
}

@keyframes orbFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

/* ===== Journal Entries ===== */
.journal-entries {
  display: flex;
  flex-direction: column;
  gap: 14px;
  max-width: 500px;
  margin: 30px auto 0;
}

.journal-entry {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  padding: 16px 20px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: all 0.3s ease;
  animation: fadeInUp 0.5s ease-out var(--jdelay) both;
}

.journal-entry:hover {
  border-color: rgba(180,140,255,0.5);
  transform: translateX(4px);
}

.journal-dot {
  width: 12px; height: 12px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 4px;
}

.journal-content {
  flex: 1;
}

.journal-date {
  font-size: 0.75rem;
  color: var(--text-secondary);
  margin-bottom: 4px;
}

.journal-text {
  font-size: 0.9rem;
  color: var(--text-primary);
  line-height: 1.6;
}

/* ===== Footer ===== */
.footer {
  text-align: center;
  padding: 40px 20px;
  font-size: 0.8rem;
  color: rgba(180, 160, 200, 0.5);
  letter-spacing: 0.05em;
}

/* ===== Scrollbar ===== */
::-webkit-scrollbar {
  width: 6px;
}
::-webkit-scrollbar-track {
  background: var(--bg-deep);
}
::-webkit-scrollbar-thumb {
  background: rgba(124, 77, 255, 0.3);
  border-radius: 3px;
}

/* ===== Responsive ===== */
@media (max-width: 600px) {
  .planet-stage {
    width: 260px;
    height: 260px;
  }
  :root { --planet-size: 170px; }
  .orbit-ring { width: 230px; height: 230px; }
  .orbit-ring-2 { width: 200px; height: 100px; }
  .emotion-btn {
    width: 58px;
    height: 58px;
    font-size: 0.7rem;
  }
  .emotion-emoji { font-size: 1.3rem; }
  .calendar-mini-planet {
    width: 40px;
    height: 40px;
  }
  .hero-title { font-size: 1.8rem; }
}

@media (max-width: 380px) {
  .emotion-btn {
    width: 50px;
    height: 50px;
    font-size: 0.65rem;
  }
  .emotion-emoji { font-size: 1.1rem; }
}
</style>
</head>
<body>

<!-- Stars Background -->
<div class="stars-container" id="starsContainer"></div>

<!-- Nebula effects -->
<div class="nebula nebula-1"></div>
<div class="nebula nebula-2"></div>
<div class="nebula nebula-3"></div>

<!-- Main Content -->
<div class="main-container">

  <!-- Hero -->
  <section class="hero">
    <h1 class="hero-title">AI 情绪星球</h1>
    <p class="hero-tagline">你的情绪，正在创造一颗星球 ✦</p>
  </section>

  <!-- Planet Stage -->
  <section class="planet-section">
    <div class="planet-stage">
      <div class="orbit-ring"></div>
      <div class="orbit-ring-2"></div>
      <div class="planet" id="mainPlanet">
        <div class="planet-atmosphere" id="planetAtmosphere"></div>
      </div>
    </div>
  </section>

  <!-- Emotion Selection -->
  <section class="emotion-section">
    <p class="emotion-label">今天你的心情是怎样的？</p>
    <div class="emotion-wheel" id="emotionWheel">
      <button class="emotion-btn" data-emotion="happy" style="--btn-idx:0">
        <span class="emotion-emoji">😊</span>开心
      </button>
      <button class="emotion-btn" data-emotion="calm" style="--btn-idx:1">
        <span class="emotion-emoji">😌</span>平静
      </button>
      <button class="emotion-btn" data-emotion="sad" style="--btn-idx:2">
        <span class="emotion-emoji">😢</span>难过
      </button>
      <button class="emotion-btn" data-emotion="anxious" style="--btn-idx:3">
        <span class="emotion-emoji">😰</span>焦虑
      </button>
      <button class="emotion-btn" data-emotion="angry" style="--btn-idx:4">
        <span class="emotion-emoji">😤</span>愤怒
      </button>
    </div>
  </section>

  <!-- Affirmation -->
  <section class="affirmation-box">
    <div class="affirmation-text" id="affirmationText">
      点击情绪按钮，让星球感受你的温度 🌙
    </div>
  </section>

  <div class="section-divider"><span>✦ 情绪日历 ✦</span></div>

  <!-- Emotion Calendar -->
  <section class="calendar-section">
    <h2 class="section-title">📅 情绪日历</h2>
    <p class="section-subtitle">回顾过去一周的心情轨迹</p>
    <div class="calendar-grid" id="calendarGrid"></div>
  </section>

  <div class="section-divider"><span>✦ 星球日记 ✦</span></div>

  <!-- Journal -->
  <section class="journal-section">
    <h2 class="section-title">🌱 星球日记</h2>
    <p class="section-subtitle">坚持打卡，培育你的专属星球生态</p>

    <div class="streak-display">
      <div class="streak-number" id="streakNumber">7</div>
      <div class="streak-label">天连续打卡</div>
    </div>

    <div class="tree-container">
      <div class="tree" id="streakTree">
        <div class="tree-crown">
          <div class="tree-leaf tree-leaf-1"></div>
          <div class="tree-leaf tree-leaf-2"></div>
          <div class="tree-leaf tree-leaf-3"></div>
          <div class="tree-leaf tree-leaf-4"></div>
          <div class="tree-leaf tree-leaf-5"></div>
          <div class="tree-orb visible" id="treeOrb"></div>
        </div>
        <div class="tree-trunk"></div>
      </div>
    </div>

    <div class="journal-entries" id="journalEntries"></div>
  </section>

  <footer class="footer">
    AI 情绪星球 · 用心守护每一颗小小星球 ✦
  </footer>
</div>

<script>
// ===== Starfield Generator =====
(function generateStars() {
  const container = document.getElementById('starsContainer');
  const count = 150;
  const frag = document.createDocumentFragment();
  for (let i = 0; i < count; i++) {
    const star = document.createElement('div');
    star.classList.add('star');
    const size = Math.random() * 2.5 + 0.8;
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.setProperty('--dur', (Math.random() * 3 + 2) + 's');
    star.style.setProperty('--delay', (Math.random() * 4) + 's');
    frag.appendChild(star);
  }
  container.appendChild(frag);
})();

// ===== Emotion Data =====
const emotionData = {
  happy: {
    name: '开心',
    emoji: '😊',
    gradient: 'radial-gradient(circle at 35% 35%, #ffe082 0%, #ffb300 25%, #ff8f00 55%, #e65100 100%)',
    glow: 'rgba(255,179,0,0.45)',
    atmosphereGlow: 'rgba(255,179,0,0.3)',
    orbColor: '#ffd54f',
    orbGlow: 'rgba(255,213,79,0.7)',
    color: '#ffb300',
    affirmations: [
      '你的笑容像阳光一样，正在让星球绽放金色的花海 🌻',
      '快乐的你散发着温暖能量，星球上的小生命也在为你欢呼 ✨',
      '今天的你像一颗闪闪发亮的小太阳，照亮了整片宇宙 🌟',
      '开心的情绪是最珍贵的养分，星球因为你变得生机勃勃 🌈'
    ]
  },
  calm: {
    name: '平静',
    emoji: '😌',
    gradient: 'radial-gradient(circle at 35% 35%, #90caf9 0%, #42a5f5 25%, #1e88e5 55%, #0d47a1 100%)',
    glow: 'rgba(66,165,245,0.45)',
    atmosphereGlow: 'rgba(66,165,245,0.3)',
    orbColor: '#64b5f6',
    orbGlow: 'rgba(100,181,246,0.7)',
    color: '#42a5f5',
    affirmations: [
      '内心平静如水，星球上飘起了温柔的蓝色雪花 ❄️',
      '静谧的力量最强大，你的星球正在安静地生长 🌊',
      '深呼吸，感受这份宁静——整颗星球都陪你一起慢慢呼吸 🧘',
      '平静是一种超能力，你的星球拥有了最纯净的海洋 💙'
    ]
  },
  sad: {
    name: '难过',
    emoji: '😢',
    gradient: 'radial-gradient(circle at 35% 35%, #b39ddb 0%, #7e57c2 25%, #5c6bc0 55%, #311b92 100%)',
    glow: 'rgba(126,87,194,0.4)',
    atmosphereGlow: 'rgba(126,87,194,0.25)',
    orbColor: '#b39ddb',
    orbGlow: 'rgba(179,157,219,0.6)',
    color: '#7e57c2',
    affirmations: [
      '没关系，乌云只是暂时的——你的星球在下雨，但彩虹就要来了 🌧️',
      '悲伤也是力量，它让星球拥有了深邃的海洋 🌊',
      '哭出来也没关系，你的眼泪正在浇灌星球上最美的花 🥀',
      '今天星球和你一样安静——它在积蓄力量，明天会更好 🌙'
    ]
  },
  anxious: {
    name: '焦虑',
    emoji: '😰',
    gradient: 'radial-gradient(circle at 35% 35%, #ffab91 0%, #ff7043 25%, #f4511e 55%, #bf360c 100%)',
    glow: 'rgba(255,112,67,0.45)',
    atmosphereGlow: 'rgba(255,112,67,0.3)',
    orbColor: '#ff8a65',
    orbGlow: 'rgba(255,138,101,0.7)',
    color: '#ff7043',
    affirmations: [
      '你的心跳星球能感受到——它相信你一定能跨过这道坎 💪',
      '焦虑只是大脑在过度保护你，放轻松，呼吸一下 🌬️',
      '星球上的风虽然大，但根基很深——你也很坚强 🏔️',
      '把担心的事情写下来吧，星球会帮你分担一半的重量 📝'
    ]
  },
  angry: {
    name: '愤怒',
    emoji: '😤',
    gradient: 'radial-gradient(circle at 35% 35%, #ef9a9a 0%, #ef5350 25%, #c62828 55%, #7f0000 100%)',
    glow: 'rgba(239,83,80,0.45)',
    atmosphereGlow: 'rgba(239,83,80,0.3)',
    orbColor: '#ef5350',
    orbGlow: 'rgba(239,83,80,0.7)',
    color: '#ef5350',
    affirmations: [
      '这股火焰很有力量！不如把它变成让星球更燃的能量 🔥',
      '愤怒是正常的——星球用火山帮你释放，然后一起平静下来 🌋',
      '你的愤怒说明你在乎——这是一种珍贵的能量 ⚡',
      '深呼吸三次，看看星球上的火焰如何变成绚丽的极光 🌌'
    ]
  }
};

// ===== Calendar Data (simulated 7 days) =====
const dayNames = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
const pastEmotions = ['happy', 'happy', 'calm', 'anxious', 'happy', 'sad', 'calm'];

function getDateStr(daysAgo) {
  const d = new Date();
  d.setDate(d.getDate() - daysAgo);
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

// ===== Journal Data =====
const journalData = [
  { date: '6月15日', emotion: 'calm', text: '今天在图书馆看了一下午书，心里很平静。星球上的海洋又扩大了。' },
  { date: '6月14日', emotion: 'sad', text: '考试没考好有点失落，但晚上朋友发消息安慰我，感觉好多了。' },
  { date: '6月13日', emotion: 'happy', text: '和好朋友一起去公园野餐了！星球上的花开了一大片。' },
  { date: '6月12日', emotion: 'anxious', text: '明天有演讲比赛，紧张到手心出汗。不过我相信自己可以的。' }
];

// ===== State =====
let currentEmotion = 'calm';
const planet = document.getElementById('mainPlanet');
const atmosphere = document.getElementById('planetAtmosphere');
const affirmationText = document.getElementById('affirmationText');
const treeOrb = document.getElementById('treeOrb');

// ===== Initialize Calendar =====
function renderCalendar() {
  const grid = document.getElementById('calendarGrid');
  const today = new Date();
  grid.innerHTML = '';

  for (let i = 6; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const emoKey = pastEmotions[i];
    const emo = emotionData[emoKey];
    const isToday = i === 0;
    const dayName = dayNames[d.getDay()];
    const dateStr = `${d.getMonth() + 1}/${d.getDate()}`;

    const dayEl = document.createElement('div');
    dayEl.classList.add('calendar-day');
    dayEl.style.setProperty('--cdelay', (6 - i) * 0.08 + 's');

    const miniPlanet = document.createElement('div');
    miniPlanet.classList.add('calendar-mini-planet');
    if (isToday) miniPlanet.classList.add('today');
    miniPlanet.style.background = emo.gradient;
    miniPlanet.style.boxShadow = `0 0 15px ${emo.glow}`;

    const dateLabel = document.createElement('div');
    dateLabel.classList.add('calendar-date');
    dateLabel.textContent = dateStr;

    const emojiLabel = document.createElement('div');
    emojiLabel.classList.add('calendar-emoji');
    emojiLabel.textContent = emo.emoji;

    dayEl.appendChild(miniPlanet);
    dayEl.appendChild(dateLabel);
    dayEl.appendChild(emojiLabel);
    grid.appendChild(dayEl);
  }
}

// ===== Initialize Journal =====
function renderJournal() {
  const entriesEl = document.getElementById('journalEntries');
  entriesEl.innerHTML = '';

  journalData.forEach((entry, idx) => {
    const emo = emotionData[entry.emotion];
    const entryEl = document.createElement('div');
    entryEl.classList.add('journal-entry');
    entryEl.style.setProperty('--jdelay', idx * 0.12 + 's');

    const dot = document.createElement('div');
    dot.classList.add('journal-dot');
    dot.style.background = emo.color;
    dot.style.boxShadow = `0 0 8px ${emo.glow}`;

    const content = document.createElement('div');
    content.classList.add('journal-content');

    const dateEl = document.createElement('div');
    dateEl.classList.add('journal-date');
    dateEl.textContent = `${entry.date} · ${emo.emoji} ${emo.name}`;

    const textEl = document.createElement('div');
    textEl.classList.add('journal-text');
    textEl.textContent = entry.text;

    content.appendChild(dateEl);
    content.appendChild(textEl);

    entryEl.appendChild(dot);
    entryEl.appendChild(content);
    entriesEl.appendChild(entryEl);
  });
}

// ===== Emotion Selection Handler =====
function selectEmotion(emotionKey) {
  if (currentEmotion === emotionKey && document.querySelector('.emotion-btn.active')) return;
  currentEmotion = emotionKey;
  const emo = emotionData[emotionKey];

  // Update buttons
  document.querySelectorAll('.emotion-btn').forEach(btn => {
    btn.classList.remove('active');
    if (btn.dataset.emotion === emotionKey) btn.classList.add('active');
  });

  // Update planet
  planet.style.background = emo.gradient;
  planet.style.setProperty('--planet-glow', emo.glow);
  atmosphere.style.boxShadow = `0 0 50px ${emo.atmosphereGlow}`;

  // Update tree orb
  treeOrb.style.setProperty('--orb-color', emo.orbColor);
  treeOrb.style.setProperty('--orb-glow', emo.orbGlow);
  treeOrb.classList.add('visible');

  // Show affirmation
  const affirmation = emo.affirmations[Math.floor(Math.random() * emo.affirmations.length)];
  affirmationText.textContent = affirmation;
  affirmationText.classList.remove('show');
  void affirmationText.offsetWidth;
  affirmationText.classList.add('show');

  // Update today in calendar
  const todayMini = document.querySelector('.calendar-mini-planet.today');
  if (todayMini) {
    todayMini.style.background = emo.gradient;
    todayMini.style.boxShadow = `0 0 15px ${emo.glow}`;
  }
}

// ===== Event Listeners =====
document.querySelectorAll('.emotion-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    selectEmotion(btn.dataset.emotion);
  });
});

// ===== Initialize =====
renderCalendar();
renderJournal();

// Show initial affirmation after a short delay
setTimeout(() => {
  affirmationText.classList.add('show');
}, 600);

// Auto-activate first emotion button (calm as default)
setTimeout(() => {
  selectEmotion('calm');
  document.querySelector('.emotion-btn[data-emotion="calm"]').classList.add('active');
}, 400);
</script>
</body>
</html>
