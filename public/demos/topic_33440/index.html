<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>垃圾分类2048</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #2d5a27 0%, #1a3d1c 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            color: #fff;
        }

        .game-header {
            text-align: center;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 32px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 8px;
        }

        .game-desc {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .score-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 10px;
        }

        .score-box {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            padding: 8px 15px;
            border-radius: 8px;
            min-width: 80px;
        }

        .score-box span {
            display: block;
            font-size: 10px;
            text-transform: uppercase;
        }

        .score-box strong {
            font-size: 20px;
        }

        .btn {
            background: #4CAF50;
            color: #fff;
            border: none;
            padding: 8px 20px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #45a049;
            transform: translateY(-2px);
        }

        /* Game Area */
        .game-area {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Game Container */
        .game-container {
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 10px;
            position: relative;
            width: 352px;
            height: 352px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 80px);
            grid-template-rows: repeat(4, 80px);
            gap: 8px;
        }

        .grid-cell {
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            width: 80px;
            height: 80px;
            border: 2px solid rgba(255,255,255,0.3);
            position: relative;
        }

        /* 虚线出口标记 - 在特定格子的特定边 */
        .grid-cell[data-x="0"][data-y="0"]::before {
            content: '';
            position: absolute;
            left: -2px;
            top: 0;
            bottom: 0;
            width: 2px;
            border-left: 3px dashed #2196F3;
            z-index: 5;
        }

        .grid-cell[data-x="3"][data-y="0"]::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 0;
            right: 0;
            height: 2px;
            border-top: 3px dashed #8BC34A;
            z-index: 5;
        }

        .grid-cell[data-x="0"][data-y="3"]::before {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            border-bottom: 3px dashed #f44336;
            z-index: 5;
        }

        .grid-cell[data-x="3"][data-y="3"]::before {
            content: '';
            position: absolute;
            right: -2px;
            top: 0;
            bottom: 0;
            width: 2px;
            border-right: 3px dashed #9E9E9E;
            z-index: 5;
        }

        .tile-container {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 332px;
            height: 332px;
            pointer-events: none;
        }

        .tile {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            z-index: 10;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
            will-change: transform;
        }

        .tile .item-name {
            font-size: 10px;
            margin-top: 2px;
            text-align: center;
            line-height: 1.1;
        }

        .tile .bag-indicator {
            position: absolute;
            top: 2px;
            right: 2px;
            font-size: 12px;
        }

        .tile.recyclable { background: linear-gradient(135deg, #64B5F6 0%, #2196F3 100%); }
        .tile.recyclable.bag-small { background: linear-gradient(135deg, #42A5F5 0%, #1976D2 100%); }
        .tile.recyclable.bag-large { background: linear-gradient(135deg, #1E88E5 0%, #0D47A1 100%); }

        .tile.kitchen { background: linear-gradient(135deg, #AED581 0%, #8BC34A 100%); }
        .tile.kitchen.bag-small { background: linear-gradient(135deg, #9CCC65 0%, #689F38 100%); }
        .tile.kitchen.bag-large { background: linear-gradient(135deg, #7CB342 0%, #33691E 100%); }

        .tile.hazardous { background: linear-gradient(135deg, #EF5350 0%, #f44336 100%); }
        .tile.hazardous.bag-small { background: linear-gradient(135deg, #E53935 0%, #d32f2f 100%); }
        .tile.hazardous.bag-large { background: linear-gradient(135deg, #C62828 0%, #b71c1c 100%); }

        .tile.other { background: linear-gradient(135deg, #BDBDBD 0%, #9E9E9E 100%); }
        .tile.other.bag-small { background: linear-gradient(135deg, #757575 0%, #616161 100%); }
        .tile.other.bag-large { background: linear-gradient(135deg, #424242 0%, #212121 100%); }

        .tile-new { animation: appear 0.3s ease-out; }
        .tile-merged { animation: pop 0.3s ease-out; }
        .tile-sliding { transition: transform 0.2s ease-in-out; }
        .tile-exit { animation: exitToTrash 0.4s ease-out forwards; }

        @keyframes appear {
            0% { opacity: 0; transform: translate(var(--pos-x), var(--pos-y)) scale(0); }
            100% { opacity: 1; transform: translate(var(--pos-x), var(--pos-y)) scale(1); }
        }

        @keyframes pop {
            0% { transform: translate(var(--pos-x), var(--pos-y)) scale(1); }
            50% { transform: translate(var(--pos-x), var(--pos-y)) scale(1.2); }
            100% { transform: translate(var(--pos-x), var(--pos-y)) scale(1); }
        }

        @keyframes exitToTrash {
            0% { transform: translate(var(--start-x), var(--start-y)) scale(1); opacity: 1; }
            50% { transform: translate(var(--mid-x), var(--mid-y)) scale(0.8); opacity: 0.8; }
            100% { transform: translate(var(--end-x), var(--end-y)) scale(0); opacity: 0; }
        }

        /* Trash Cans - 放在虚线出口旁边 */
        .trash-can {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: transform 0.2s;
            z-index: 20;
        }

        .trash-can .can-icon { font-size: 24px; }
        .trash-can .can-label { font-size: 11px; margin-top: 2px; }

        /* 可回收垃圾桶 - 放在左上角格子左边 */
        .trash-can.recyclable {
            width: 45px;
            height: 80px;
            background: linear-gradient(180deg, #2196F3 0%, #1976D2 100%);
            left: -50px;
            top: 10px;
        }

        /* 易腐垃圾桶 - 放在右上角格子上边 */
        .trash-can.kitchen {
            width: 80px;
            height: 45px;
            background: linear-gradient(180deg, #8BC34A 0%, #689F38 100%);
            right: 10px;
            top: -50px;
        }

        /* 有害垃圾桶 - 放在左下角格子下边 */
        .trash-can.hazardous {
            width: 80px;
            height: 45px;
            background: linear-gradient(180deg, #f44336 0%, #d32f2f 100%);
            left: 10px;
            bottom: -50px;
        }

        /* 其他垃圾桶 - 放在右下角格子右边 */
        .trash-can.other {
            width: 45px;
            height: 80px;
            background: linear-gradient(180deg, #9E9E9E 0%, #616161 100%);
            right: -50px;
            bottom: 10px;
        }

        .trash-can:hover { transform: scale(1.05); }
        .trash-can.active { animation: pulse 0.5s ease; }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
            50% { transform: scale(1.1); box-shadow: 0 6px 25px rgba(255,255,255,0.5); }
        }

        .legend {
            margin-top: 15px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            font-size: 11px;
            max-width: 400px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(255,255,255,0.1);
            padding: 5px 10px;
            border-radius: 5px;
        }

        .legend-icon { font-size: 16px; }
        .legend-text { opacity: 0.9; }

        .game-message {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
        }

        .game-message.visible { display: flex; }
        .game-message p { font-size: 32px; font-weight: bold; margin-bottom: 20px; }

        .score-popup {
            position: absolute;
            font-size: 20px;
            font-weight: bold;
            color: #FFD700;
            pointer-events: none;
            animation: scoreFloat 1s ease-out forwards;
            z-index: 100;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        @keyframes scoreFloat {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-40px) scale(1.3); }
        }

        /* 垃圾清运特效 */
        .garbage-truck-effect {
            position: absolute;
            font-size: 40px;
            pointer-events: none;
            animation: truckMove 0.8s ease-out forwards;
            z-index: 100;
        }

        @keyframes truckMove {
            0% { 
                opacity: 1; 
                transform: scale(0.5) translateX(-30px);
            }
            50% { 
                opacity: 1; 
                transform: scale(1.2) translateX(0);
            }
            100% { 
                opacity: 0; 
                transform: scale(0.8) translateX(30px);
            }
        }

        .clear-flash {
            position: absolute;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            animation: flashExpand 0.5s ease-out forwards;
            z-index: 50;
        }

        @keyframes flashExpand {
            0% { 
                opacity: 1; 
                transform: scale(0.5);
            }
            100% { 
                opacity: 0; 
                transform: scale(2);
            }
        }

        @media (max-width: 500px) {
            h1 { font-size: 24px; }
            
            .game-container {
                width: 268px;
                height: 268px;
                padding: 8px;
            }

            .grid-container {
                grid-template-columns: repeat(4, 60px);
                grid-template-rows: repeat(4, 60px);
                gap: 6px;
            }

            .grid-cell { width: 60px; height: 60px; }

            .tile-container {
                top: 8px;
                left: 8px;
                width: 252px;
                height: 252px;
            }

            .tile { width: 60px; height: 60px; font-size: 18px; }
            .tile .item-name { font-size: 8px; }

            .trash-can.recyclable, .trash-can.other {
                width: 35px;
                height: 60px;
            }

            .trash-can.kitchen, .trash-can.hazardous {
                width: 60px;
                height: 35px;
            }

            .trash-can.recyclable { left: -40px; top: 8px; }
            .trash-can.kitchen { right: 8px; top: -40px; }
            .trash-can.hazardous { left: 8px; bottom: -40px; }
            .trash-can.other { right: -40px; bottom: 8px; }

            .trash-can .can-icon { font-size: 18px; }
            .trash-can .can-label { font-size: 9px; }
        }
    </style>
</head>
<body>
    <div class="game-header">
        <h1>🗑️ 垃圾分类2048</h1>
        <p class="game-desc">将对应类型垃圾移至角落投放 | 同类垃圾合并成袋 | 两个大袋合成触发🚛垃圾清运+50分</p>
        <div class="score-container">
            <div class="score-box">
                <span>得分</span>
                <strong id="score">0</strong>
            </div>
            <div class="score-box">
                <span>最高分</span>
                <strong id="best-score">0</strong>
            </div>
        </div>
        <button class="btn" onclick="game.restart()">新游戏</button>
    </div>

    <div class="game-area">
        <div class="game-container">
            <!-- 垃圾桶 - 放在虚线出口旁边 -->
            <div class="trash-can recyclable" data-type="recyclable">
                <span class="can-icon">♻️</span>
                <span class="can-label">可回收</span>
            </div>
            <div class="trash-can kitchen" data-type="kitchen">
                <span class="can-icon">🥬</span>
                <span class="can-label">易腐</span>
            </div>
            <div class="trash-can hazardous" data-type="hazardous">
                <span class="can-icon">☠️</span>
                <span class="can-label">有害</span>
            </div>
            <div class="trash-can other" data-type="other">
                <span class="can-icon">🗑️</span>
                <span class="can-label">其他</span>
            </div>

            <div class="grid-container">
                <div class="grid-cell" data-x="0" data-y="0"></div>
                <div class="grid-cell" data-x="1" data-y="0"></div>
                <div class="grid-cell" data-x="2" data-y="0"></div>
                <div class="grid-cell" data-x="3" data-y="0"></div>
                <div class="grid-cell" data-x="0" data-y="1"></div>
                <div class="grid-cell" data-x="1" data-y="1"></div>
                <div class="grid-cell" data-x="2" data-y="1"></div>
                <div class="grid-cell" data-x="3" data-y="1"></div>
                <div class="grid-cell" data-x="0" data-y="2"></div>
                <div class="grid-cell" data-x="1" data-y="2"></div>
                <div class="grid-cell" data-x="2" data-y="2"></div>
                <div class="grid-cell" data-x="3" data-y="2"></div>
                <div class="grid-cell" data-x="0" data-y="3"></div>
                <div class="grid-cell" data-x="1" data-y="3"></div>
                <div class="grid-cell" data-x="2" data-y="3"></div>
                <div class="grid-cell" data-x="3" data-y="3"></div>
            </div>
            <div class="tile-container" id="tile-container"></div>
        </div>
    </div>

    <div class="legend">
        <div class="legend-item">
            <span class="legend-icon">♻️</span>
            <span class="legend-text">←左出口：纸张、塑料瓶、玻璃瓶</span>
        </div>
        <div class="legend-item">
            <span class="legend-icon">🥬</span>
            <span class="legend-text">↑上出口：剩菜、果皮、菜叶</span>
        </div>
        <div class="legend-item">
            <span class="legend-icon">☠️</span>
            <span class="legend-text">↓下出口：电池、灯泡、药品</span>
        </div>
        <div class="legend-item">
            <span class="legend-icon">🗑️</span>
            <span class="legend-text">→右出口：纸巾、烟蒂、陶瓷</span>
        </div>
    </div>

    <div class="game-message" id="game-message">
        <p id="message-text"></p>
        <button class="btn" onclick="game.restart()">再试一次</button>
    </div>

    <script>
        const TRASH_TYPES = {
            RECYCLABLE: 'recyclable',
            KITCHEN: 'kitchen',
            HAZARDOUS: 'hazardous',
            OTHER: 'other'
        };

        const TRASH_ITEMS = {
            [TRASH_TYPES.RECYCLABLE]: [
                { icon: '📄', name: '纸张' },
                { icon: '🥤', name: '塑料瓶' },
                { icon: '🍾', name: '玻璃瓶' },
                { icon: '🥫', name: '易拉罐' },
                { icon: '📦', name: '纸箱' },
                { icon: '📰', name: '报纸' }
            ],
            [TRASH_TYPES.KITCHEN]: [
                { icon: '🍖', name: '剩菜' },
                { icon: '🍎', name: '果皮' },
                { icon: '🥬', name: '菜叶' },
                { icon: '🦴', name: '骨头' },
                { icon: '🥚', name: '蛋壳' },
                { icon: '🍵', name: '茶叶' }
            ],
            [TRASH_TYPES.HAZARDOUS]: [
                { icon: '🔋', name: '电池' },
                { icon: '💡', name: '灯泡' },
                { icon: '💊', name: '药品' },
                { icon: '🌡️', name: '温度计' },
                { icon: '🎨', name: '油漆' },
                { icon: '📱', name: '旧手机' }
            ],
            [TRASH_TYPES.OTHER]: [
                { icon: '🧻', name: '纸巾' },
                { icon: '🚬', name: '烟蒂' },
                { icon: '🏺', name: '陶瓷' },
                { icon: '🧹', name: '尘土' },
                { icon: '🖊️', name: '笔' },
                { icon: '🧤', name: '手套' }
            ]
        };

        const BAG_LEVELS = { NONE: 0, SMALL: 1, LARGE: 2 };
        const SCORES = { [BAG_LEVELS.NONE]: 1, [BAG_LEVELS.SMALL]: 5, [BAG_LEVELS.LARGE]: 20 };

        const GRID_CONFIG = {
            desktop: { cellSize: 80, gap: 8, padding: 10 },
            mobile: { cellSize: 60, gap: 6, padding: 8 }
        };

        class TrashItem {
            constructor(x, y, type, bagLevel = BAG_LEVELS.NONE) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.bagLevel = bagLevel;
                this.id = TrashItem.id++;
                this.mergedFrom = null;
                this.isNew = true;
                const items = TRASH_ITEMS[type];
                this.item = items[Math.floor(Math.random() * items.length)];
            }

            savePosition() {
                this.previousPosition = { x: this.x, y: this.y };
            }

            updatePosition(x, y) {
                this.x = x;
                this.y = y;
            }

            getClassName() {
                let className = `tile ${this.type}`;
                if (this.bagLevel === BAG_LEVELS.SMALL) className += ' bag-small';
                if (this.bagLevel === BAG_LEVELS.LARGE) className += ' bag-large';
                return className;
            }

            getDisplayContent() {
                if (this.bagLevel === BAG_LEVELS.NONE) {
                    return { icon: this.item.icon, name: this.item.name };
                } else if (this.bagLevel === BAG_LEVELS.SMALL) {
                    return { icon: '🛍️', name: '小袋' };
                } else {
                    return { icon: '📦', name: '大袋' };
                }
            }

            getNextLevel() {
                if (this.bagLevel === BAG_LEVELS.NONE) return BAG_LEVELS.SMALL;
                if (this.bagLevel === BAG_LEVELS.SMALL) return BAG_LEVELS.LARGE;
                return null;
            }
        }
        TrashItem.id = 0;

        class TrashSortingGame {
            constructor() {
                this.size = 4;
                this.grid = [];
                this.score = 0;
                this.bestScore = parseInt(localStorage.getItem('trashBestScore')) || 0;
                this.over = false;
                
                this.tileContainer = document.getElementById('tile-container');
                this.scoreElement = document.getElementById('score');
                this.bestScoreElement = document.getElementById('best-score');
                this.messageContainer = document.getElementById('game-message');
                this.messageText = document.getElementById('message-text');

                this.updateConfig();
                window.addEventListener('resize', () => {
                    this.updateConfig();
                    this.updateDisplay();
                });

                this.init();
            }

            updateConfig() {
                const isMobile = window.innerWidth <= 500;
                this.config = isMobile ? GRID_CONFIG.mobile : GRID_CONFIG.desktop;
                this.cellSize = this.config.cellSize;
                this.gap = this.config.gap;
            }

            init() {
                this.bestScoreElement.textContent = this.bestScore;
                this.setupInput();
                this.restart();
            }

            restart() {
                this.grid = Array(this.size).fill(null).map(() => Array(this.size).fill(null));
                this.score = 0;
                this.over = false;
                TrashItem.id = 0;
                this.updateScore();
                this.hideMessage();
                this.clearTiles();
                
                this.addRandomTrash();
                this.addRandomTrash();
                this.addRandomTrash();
                
                this.updateDisplay();
            }

            setupInput() {
                document.addEventListener('keydown', (e) => {
                    if (this.over) return;

                    switch(e.key) {
                        case 'ArrowUp':
                        case 'w':
                        case 'W':
                            e.preventDefault();
                            this.move(0, -1);
                            break;
                        case 'ArrowDown':
                        case 's':
                        case 'S':
                            e.preventDefault();
                            this.move(0, 1);
                            break;
                        case 'ArrowLeft':
                        case 'a':
                        case 'A':
                            e.preventDefault();
                            this.move(-1, 0);
                            break;
                        case 'ArrowRight':
                        case 'd':
                        case 'D':
                            e.preventDefault();
                            this.move(1, 0);
                            break;
                    }
                });

                let touchStartX = 0;
                let touchStartY = 0;

                document.addEventListener('touchstart', (e) => {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                }, { passive: true });

                document.addEventListener('touchend', (e) => {
                    if (this.over) return;

                    const touchEndX = e.changedTouches[0].clientX;
                    const touchEndY = e.changedTouches[0].clientY;

                    const dx = touchEndX - touchStartX;
                    const dy = touchEndY - touchStartY;

                    const minSwipeDistance = 50;

                    if (Math.abs(dx) > Math.abs(dy)) {
                        if (Math.abs(dx) > minSwipeDistance) {
                            this.move(dx > 0 ? 1 : -1, 0);
                        }
                    } else {
                        if (Math.abs(dy) > minSwipeDistance) {
                            this.move(0, dy > 0 ? 1 : -1);
                        }
                    }
                }, { passive: true });
            }

            // 检查是否可以消除 - 只有虚线位置的对应类型垃圾才能消除
            checkTrashCanElimination(dx, dy) {
                const eliminated = [];
                
                // 向左移动 - 检查(0,0)左上角格子是否有可回收垃圾
                if (dx === -1) {
                    const item = this.grid[0][0];
                    if (item && item.type === TRASH_TYPES.RECYCLABLE) {
                        eliminated.push({ x: 0, y: 0, item, score: SCORES[item.bagLevel], direction: 'left' });
                    }
                }
                // 向右移动 - 检查(3,3)右下角格子是否有其他垃圾
                else if (dx === 1) {
                    const item = this.grid[3][3];
                    if (item && item.type === TRASH_TYPES.OTHER) {
                        eliminated.push({ x: 3, y: 3, item, score: SCORES[item.bagLevel], direction: 'right' });
                    }
                }
                // 向上移动 - 检查(3,0)右上角格子是否有易腐垃圾
                else if (dy === -1) {
                    const item = this.grid[0][3];
                    if (item && item.type === TRASH_TYPES.KITCHEN) {
                        eliminated.push({ x: 3, y: 0, item, score: SCORES[item.bagLevel], direction: 'up' });
                    }
                }
                // 向下移动 - 检查(0,3)左下角格子是否有有害垃圾
                else if (dy === 1) {
                    const item = this.grid[3][0];
                    if (item && item.type === TRASH_TYPES.HAZARDOUS) {
                        eliminated.push({ x: 0, y: 3, item, score: SCORES[item.bagLevel], direction: 'down' });
                    }
                }
                
                return eliminated;
            }

            async move(dx, dy) {
                if (this.over) return;

                this.eachCell((x, y, item) => {
                    if (item) {
                        item.savePosition();
                        item.mergedFrom = null;
                        item.isNew = false;
                    }
                });

                const vector = { x: dx, y: dy };
                const traversals = this.buildTraversals(vector);
                let moved = false;
                const movingItems = [];
                const garbageTruckClears = []; // 垃圾清运记录

                traversals.y.forEach(y => {
                    traversals.x.forEach(x => {
                        const item = this.grid[y][x];
                        if (item) {
                            const positions = this.findFarthestPosition({ x, y }, vector);
                            const next = positions.next;
                            const farthest = positions.farthest;

                            if (next && this.grid[next.y][next.x]) {
                                const nextItem = this.grid[next.y][next.x];
                                
                                // 检查是否可以合并（同类型、同等级、未合并过）
                                if (nextItem.type === item.type && 
                                    item.bagLevel === nextItem.bagLevel &&
                                    !nextItem.mergedFrom) {
                                    
                                    // 特殊情况：两个大袋合并 -> 垃圾清运
                                    if (item.bagLevel === BAG_LEVELS.LARGE) {
                                        // 记录垃圾清运
                                        garbageTruckClears.push({
                                            x: next.x,
                                            y: next.y,
                                            type: item.type,
                                            item1: item,
                                            item2: nextItem
                                        });
                                        this.grid[y][x] = null;
                                        this.grid[next.y][next.x] = null;
                                        
                                        movingItems.push({
                                            item: item,
                                            from: { x, y },
                                            to: { x: next.x, y: next.y },
                                            isMerge: true,
                                            isGarbageTruck: true
                                        });
                                        moved = true;
                                    } else {
                                        // 普通合并
                                        const newLevel = item.getNextLevel();
                                        const merged = new TrashItem(next.x, next.y, item.type, newLevel);
                                        merged.mergedFrom = [item, nextItem];
                                        merged.isNew = false;

                                        this.grid[next.y][next.x] = merged;
                                        this.grid[y][x] = null;

                                        movingItems.push({
                                            item: item,
                                            from: { x, y },
                                            to: { x: next.x, y: next.y },
                                            isMerge: true
                                        });
                                        moved = true;
                                    }
                                } else if (farthest.x !== x || farthest.y !== y) {
                                    this.grid[farthest.y][farthest.x] = item;
                                    this.grid[y][x] = null;
                                    item.updatePosition(farthest.x, farthest.y);
                                    
                                    movingItems.push({
                                        item: item,
                                        from: { x, y },
                                        to: { x: farthest.x, y: farthest.y },
                                        isMerge: false
                                    });
                                    moved = true;
                                }
                            } else if (farthest.x !== x || farthest.y !== y) {
                                this.grid[farthest.y][farthest.x] = item;
                                this.grid[y][x] = null;
                                item.updatePosition(farthest.x, farthest.y);
                                
                                movingItems.push({
                                    item: item,
                                    from: { x, y },
                                    to: { x: farthest.x, y: farthest.y },
                                    isMerge: false
                                });
                                moved = true;
                            }
                        }
                    });
                });

                if (movingItems.length > 0) {
                    await this.animateMoves(movingItems);
                }

                // 处理垃圾清运效果
                if (garbageTruckClears.length > 0) {
                    await this.animateGarbageTruck(garbageTruckClears);
                    
                    garbageTruckClears.forEach(({ x, y, type }) => {
                        this.score += 50;
                        this.showScorePopup(x, y, 50, '🚛');
                        this.highlightTrashCan(type);
                    });
                    moved = true;
                }

                const eliminated = this.checkTrashCanElimination(dx, dy);
                let eliminatedScore = 0;
                
                if (eliminated.length > 0) {
                    this.updateDisplay();
                    await this.animateEliminations(eliminated);
                    
                    eliminated.forEach(({ x, y, item, score }) => {
                        this.grid[y][x] = null;
                        eliminatedScore += score;
                        this.showScorePopup(x, y, score);
                        this.highlightTrashCan(item.type);
                    });
                }

                if (eliminatedScore > 0) {
                    this.score += eliminatedScore;
                    moved = true;
                }

                if (moved) {
                    this.addRandomTrash();
                    this.updateDisplay();
                    this.updateScore();
                }

                // 每次移动尝试后都检查是否还有合法操作
                if (this.isGameOver()) {
                    this.over = true;
                    setTimeout(() => this.showMessage('游戏结束！'), 300);
                }
            }

            animateMoves(movingItems) {
                return new Promise(resolve => {
                    // 清空并重新渲染所有方块在旧位置
                    this.clearTiles();
                    
                    // 渲染所有方块
                    this.eachCell((x, y, item) => {
                        if (item) {
                            // 使用旧位置渲染
                            const oldPos = item.previousPosition || { x: item.x, y: item.y };
                            this.createItemElementAtPosition(item, oldPos, true);
                        }
                    });
                    
                    // 获取所有方块
                    const tiles = this.tileContainer.querySelectorAll('.tile');
                    
                    // 等待一帧后更新到新位置
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            tiles.forEach(tile => {
                                const x = parseInt(tile.dataset.x);
                                const y = parseInt(tile.dataset.y);
                                const item = this.grid[y][x];
                                if (item) {
                                    const newPos = this.getPosition({ x: item.x, y: item.y });
                                    tile.style.transform = `translate(${newPos.x}px, ${newPos.y}px)`;
                                }
                            });
                            
                            setTimeout(() => {
                                this.updateDisplay();
                                resolve();
                            }, 200);
                        });
                    });
                });
            }
            
            createItemElementAtPosition(item, position, withTransition = false) {
                const wrapper = document.createElement('div');
                wrapper.className = item.getClassName();
                wrapper.dataset.x = item.x;
                wrapper.dataset.y = item.y;
                
                if (withTransition) {
                    wrapper.classList.add('tile-sliding');
                }

                const content = item.getDisplayContent();
                
                const icon = document.createElement('span');
                icon.textContent = content.icon;
                
                const name = document.createElement('span');
                name.className = 'item-name';
                name.textContent = content.name;

                if (item.bagLevel !== BAG_LEVELS.NONE) {
                    const bagInd = document.createElement('span');
                    bagInd.className = 'bag-indicator';
                    bagInd.textContent = item.bagLevel === BAG_LEVELS.SMALL ? 'S' : 'L';
                    wrapper.appendChild(bagInd);
                }

                wrapper.appendChild(icon);
                wrapper.appendChild(name);

                const pos = this.getPosition(position);
                wrapper.style.setProperty('--pos-x', `${pos.x}px`);
                wrapper.style.setProperty('--pos-y', `${pos.y}px`);
                wrapper.style.transform = `translate(${pos.x}px, ${pos.y}px)`;

                this.tileContainer.appendChild(wrapper);
            }

            animateEliminations(eliminated) {
                return new Promise(resolve => {
                    eliminated.forEach(({ x, y, item, direction }) => {
                        const tiles = this.tileContainer.querySelectorAll('.tile');
                        tiles.forEach(tile => {
                            const transform = tile.style.transform || '';
                            const matchX = transform.match(/translate\((\d+(?:\.\d+)?)px/);
                            const matchY = transform.match(/,\s*(\d+(?:\.\d+)?)px/);
                            
                            if (!matchX || !matchY) return;
                            
                            const tileX = parseFloat(matchX[1]) / (this.cellSize + this.gap);
                            const tileY = parseFloat(matchY[1]) / (this.cellSize + this.gap);
                            
                            if (Math.abs(tileX - x) < 0.5 && Math.abs(tileY - y) < 0.5) {
                                const startX = x * (this.cellSize + this.gap);
                                const startY = y * (this.cellSize + this.gap);
                                let endX = startX;
                                let endY = startY;
                                let midX = startX;
                                let midY = startY;
                                
                                const offset = 150;
                                switch(direction) {
                                    case 'left': 
                                        endX = startX - offset; 
                                        midX = startX - offset / 2;
                                        break;
                                    case 'right': 
                                        endX = startX + offset; 
                                        midX = startX + offset / 2;
                                        break;
                                    case 'up': 
                                        endY = startY - offset; 
                                        midY = startY - offset / 2;
                                        break;
                                    case 'down': 
                                        endY = startY + offset; 
                                        midY = startY + offset / 2;
                                        break;
                                }
                                
                                tile.style.setProperty('--start-x', `${startX}px`);
                                tile.style.setProperty('--start-y', `${startY}px`);
                                tile.style.setProperty('--mid-x', `${midX}px`);
                                tile.style.setProperty('--mid-y', `${midY}px`);
                                tile.style.setProperty('--end-x', `${endX}px`);
                                tile.style.setProperty('--end-y', `${endY}px`);
                                tile.classList.add('tile-exit');
                            }
                        });
                    });

                    setTimeout(resolve, 400);
                });
            }

            showScorePopup(x, y, score, icon = '') {
                const popup = document.createElement('div');
                popup.className = 'score-popup';
                popup.textContent = icon ? `${icon}+${score}` : `+${score}`;
                popup.style.left = `${x * (this.cellSize + this.gap) + this.cellSize/2 - 25}px`;
                popup.style.top = `${y * (this.cellSize + this.gap) + this.cellSize/2 - 10}px`;
                this.tileContainer.appendChild(popup);
                
                setTimeout(() => {
                    if (popup.parentNode) {
                        popup.parentNode.removeChild(popup);
                    }
                }, 1000);
            }

            animateGarbageTruck(clears) {
                return new Promise(resolve => {
                    clears.forEach(({ x, y, type, item1, item2 }) => {
                        // 创建垃圾清运特效
                        const effect = document.createElement('div');
                        effect.className = 'garbage-truck-effect';
                        effect.innerHTML = '🚛';
                        effect.style.left = `${x * (this.cellSize + this.gap) + this.cellSize/2 - 20}px`;
                        effect.style.top = `${y * (this.cellSize + this.gap) + this.cellSize/2 - 20}px`;
                        this.tileContainer.appendChild(effect);
                        
                        // 创建闪光效果
                        const flash = document.createElement('div');
                        flash.className = 'clear-flash';
                        flash.style.left = `${x * (this.cellSize + this.gap)}px`;
                        flash.style.top = `${y * (this.cellSize + this.gap)}px`;
                        flash.style.width = `${this.cellSize}px`;
                        flash.style.height = `${this.cellSize}px`;
                        this.tileContainer.appendChild(flash);
                        
                        setTimeout(() => {
                            if (effect.parentNode) effect.parentNode.removeChild(effect);
                            if (flash.parentNode) flash.parentNode.removeChild(flash);
                        }, 800);
                    });
                    
                    setTimeout(resolve, 500);
                });
            }

            highlightTrashCan(type) {
                const can = document.querySelector(`.trash-can.${type}`);
                if (can) {
                    can.classList.add('active');
                    setTimeout(() => can.classList.remove('active'), 500);
                }
            }

            buildTraversals(vector) {
                const traversals = { x: [], y: [] };
                for (let i = 0; i < this.size; i++) {
                    traversals.x.push(i);
                    traversals.y.push(i);
                }
                if (vector.x === 1) traversals.x.reverse();
                if (vector.y === 1) traversals.y.reverse();
                return traversals;
            }

            findFarthestPosition(cell, vector) {
                let previous;
                let current = { x: cell.x, y: cell.y };

                do {
                    previous = current;
                    current = { x: previous.x + vector.x, y: previous.y + vector.y };
                } while (this.withinBounds(current) && !this.grid[current.y][current.x]);

                return {
                    farthest: previous,
                    next: this.withinBounds(current) ? current : null
                };
            }

            withinBounds(position) {
                return position.x >= 0 && position.x < this.size &&
                       position.y >= 0 && position.y < this.size;
            }

            addRandomTrash() {
                const emptyCells = [];
                for (let y = 0; y < this.size; y++) {
                    for (let x = 0; x < this.size; x++) {
                        if (!this.grid[y][x]) {
                            emptyCells.push({ x, y });
                        }
                    }
                }

                if (emptyCells.length > 0) {
                    const randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                    const types = Object.values(TRASH_TYPES);
                    const randomType = types[Math.floor(Math.random() * types.length)];
                    const trash = new TrashItem(randomCell.x, randomCell.y, randomType, BAG_LEVELS.NONE);
                    this.grid[randomCell.y][randomCell.x] = trash;
                }
            }

            isGameOver() {
                // 1. 检查是否还有空格
                for (let y = 0; y < this.size; y++) {
                    for (let x = 0; x < this.size; x++) {
                        if (!this.grid[y][x]) return false;
                    }
                }
                
                // 2. 检查是否存在相邻同类型且等级相同的垃圾（可合并）
                for (let y = 0; y < this.size; y++) {
                    for (let x = 0; x < this.size; x++) {
                        const item = this.grid[y][x];
                        if (!item) continue;
                        
                        // 检查右边
                        if (x < this.size - 1) {
                            const rightItem = this.grid[y][x + 1];
                            if (rightItem && rightItem.type === item.type && rightItem.bagLevel === item.bagLevel) {
                                return false;
                            }
                        }
                        
                        // 检查下边
                        if (y < this.size - 1) {
                            const belowItem = this.grid[y + 1][x];
                            if (belowItem && belowItem.type === item.type && belowItem.bagLevel === item.bagLevel) {
                                return false;
                            }
                        }
                    }
                }
                
                // 3. 检查角落格子是否有对应类型的垃圾（可消除）
                // 左上角(0,0) - 可回收物
                if (this.grid[0][0] && this.grid[0][0].type === TRASH_TYPES.RECYCLABLE) {
                    return false;
                }
                // 右上角(3,0) - 易腐垃圾
                if (this.grid[0][3] && this.grid[0][3].type === TRASH_TYPES.KITCHEN) {
                    return false;
                }
                // 左下角(0,3) - 有害垃圾
                if (this.grid[3][0] && this.grid[3][0].type === TRASH_TYPES.HAZARDOUS) {
                    return false;
                }
                // 右下角(3,3) - 其他垃圾
                if (this.grid[3][3] && this.grid[3][3].type === TRASH_TYPES.OTHER) {
                    return false;
                }
                
                // 以上都不满足，游戏结束
                return true;
            }

            updateDisplay() {
                this.clearTiles();
                this.eachCell((x, y, item) => {
                    if (item) {
                        this.createItemElement(item);
                    }
                });
            }

            createItemElement(item) {
                const wrapper = document.createElement('div');
                wrapper.className = item.getClassName();
                if (item.isNew) wrapper.classList.add('tile-new');
                if (item.mergedFrom) wrapper.classList.add('tile-merged');

                const content = item.getDisplayContent();
                
                const icon = document.createElement('span');
                icon.textContent = content.icon;
                
                const name = document.createElement('span');
                name.className = 'item-name';
                name.textContent = content.name;

                if (item.bagLevel !== BAG_LEVELS.NONE) {
                    const bagInd = document.createElement('span');
                    bagInd.className = 'bag-indicator';
                    bagInd.textContent = item.bagLevel === BAG_LEVELS.SMALL ? 'S' : 'L';
                    wrapper.appendChild(bagInd);
                }

                wrapper.appendChild(icon);
                wrapper.appendChild(name);

                const pos = this.getPosition({ x: item.x, y: item.y });
                
                // 设置 CSS 变量用于动画
                wrapper.style.setProperty('--pos-x', `${pos.x}px`);
                wrapper.style.setProperty('--pos-y', `${pos.y}px`);
                wrapper.style.transform = `translate(${pos.x}px, ${pos.y}px)`;

                this.tileContainer.appendChild(wrapper);

                if (item.mergedFrom) {
                    item.mergedFrom.forEach((mergedItem) => {
                        if (!mergedItem.previousPosition) return;
                        
                        const mergedWrapper = document.createElement('div');
                        mergedWrapper.className = mergedItem.getClassName();
                        
                        const mergedContent = mergedItem.getDisplayContent();
                        const mergedIcon = document.createElement('span');
                        mergedIcon.textContent = mergedContent.icon;
                        const mergedName = document.createElement('span');
                        mergedName.className = 'item-name';
                        mergedName.textContent = mergedContent.name;
                        
                        mergedWrapper.appendChild(mergedIcon);
                        mergedWrapper.appendChild(mergedName);

                        const mergedPos = this.getPosition({ x: mergedItem.previousPosition.x, y: mergedItem.previousPosition.y });
                        mergedWrapper.style.transform = `translate(${mergedPos.x}px, ${mergedPos.y}px)`;
                        mergedWrapper.style.zIndex = 5;
                        mergedWrapper.classList.add('tile-sliding');

                        this.tileContainer.appendChild(mergedWrapper);

                        requestAnimationFrame(() => {
                            const targetPos = this.getPosition({ x: item.x, y: item.y });
                            mergedWrapper.style.transform = `translate(${targetPos.x}px, ${targetPos.y}px)`;
                            mergedWrapper.style.opacity = '0';
                        });

                        setTimeout(() => {
                            if (mergedWrapper.parentNode) {
                                mergedWrapper.parentNode.removeChild(mergedWrapper);
                            }
                        }, 200);
                    });
                }
            }

            getPosition(position) {
                return {
                    x: position.x * (this.cellSize + this.gap),
                    y: position.y * (this.cellSize + this.gap)
                };
            }

            eachCell(callback) {
                for (let y = 0; y < this.size; y++) {
                    for (let x = 0; x < this.size; x++) {
                        callback(x, y, this.grid[y][x]);
                    }
                }
            }

            clearTiles() {
                this.tileContainer.innerHTML = '';
            }

            updateScore() {
                this.scoreElement.textContent = this.score;
                if (this.score > this.bestScore) {
                    this.bestScore = this.score;
                    this.bestScoreElement.textContent = this.bestScore;
                    localStorage.setItem('trashBestScore', this.bestScore);
                }
            }

            showMessage(text) {
                this.messageText.textContent = text;
                this.messageContainer.className = 'game-message visible';
            }

            hideMessage() {
                this.messageContainer.className = 'game-message';
            }
        }

        const game = new TrashSortingGame();
    </script>
