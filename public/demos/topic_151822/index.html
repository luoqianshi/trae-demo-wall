<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家电生命周期管家</title>
    <style id="theme-vars">
/* ==========================================
   家电生命周期管家 — Brand CSS
   Warm Home Utility aesthetic
   ========================================== */

/* --- Brand Prefix --- */
:root {
  --color-primary: #E8733A;
  --color-primary-light: #F09D6B;
  --color-primary-dark: #C85A25;
  --color-primary-50: #FEF3ED;
  --color-primary-100: #FDDDD0;
  --color-primary-200: #FBB89E;
  --color-primary-300: #F8936C;
  --color-primary-400: #E8733A;
  --color-primary-500: #D45E28;
  --color-primary-600: #B04A1E;
  --color-primary-700: #8C3B18;
  --color-primary-800: #6A2D12;
  --color-primary-900: #4A1F0D;

  --color-neutral-50: #FAFAF8;
  --color-neutral-100: #F7F3EE;
  --color-neutral-200: #EDE8E2;
  --color-neutral-300: #DDD7CF;
  --color-neutral-400: #B5ADA3;
  --color-neutral-500: #8E867C;
  --color-neutral-600: #6B6560;
  --color-neutral-700: #4A4541;
  --color-neutral-800: #2D3142;
  --color-neutral-900: #1A1C26;

  --state-success: #2ECC71;
  --state-success-light: #D4EFDF;
  --state-warning: #F39C12;
  --state-warning-light: #FEF3D0;
  --state-error: #E74C3C;
  --state-error-light: #FADBD8;
  --state-info: #3498DB;
  --state-info-light: #D4E6F7;

  --background: #F7F3EE;
  --foreground: #2D3142;
  --card: #FFFFFF;
  --card-foreground: #2D3142;
  --popover: #FFFFFF;
  --popover-foreground: #2D3142;
  --primary: #E8733A;
  --primary-foreground: #FFFFFF;
  --primary-50: #FEF3ED;
  --primary-100: #FDDDD0;
  --primary-200: #FBB89E;
  --muted: #EDE8E2;
  --muted-foreground: #8E867C;
  --border: #EDE8E2;
  --input: #EDE8E2;
  --ring: #E8733A;

  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;
}

.dark {
  --background: #1A1C26;
  --foreground: #F7F3EE;
  --card: #2D3142;
  --card-foreground: #F7F3EE;
  --popover: #2D3142;
  --popover-foreground: #F7F3EE;
  --primary: #E8733A;
  --primary-foreground: #FFFFFF;
  --muted: #4A4541;
  --muted-foreground: #B5ADA3;
  --border: #4A4541;
  --input: #4A4541;
  --ring: #E8733A;
}

@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap');

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: var(--foreground);
  background-color: var(--background);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.typography-display {
  font-weight: 700;
  font-size: 24px;
  line-height: 1.3;
  letter-spacing: -0.02em;
}

.typography-title {
  font-weight: 600;
  font-size: 20px;
  line-height: 1.4;
}

.typography-subtitle {
  font-weight: 600;
  font-size: 16px;
  line-height: 1.5;
}

.typography-body {
  font-weight: 400;
  font-size: 14px;
  line-height: 1.6;
}

.typography-caption {
  font-weight: 400;
  font-size: 12px;
  line-height: 1.5;
  color: var(--muted-foreground);
}

.typography-numeral {
  font-family: 'Noto Sans SC', ui-monospace, 'Cascadia Code', monospace;
  font-variant-numeric: tabular-nums;
  font-weight: 700;
}

.card {
  background: var(--card);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  box-shadow: 0 1px 3px rgba(45, 49, 66, 0.04);
}

.card-elevated {
  background: var(--card);
  border-radius: var(--radius-xl);
  box-shadow: 0 2px 8px rgba(45, 49, 66, 0.05);
}

.btn-primary {
  background: var(--primary);
  color: var(--primary-foreground);
  border-radius: var(--radius-lg);
  font-weight: 600;
  font-size: 14px;
  padding: 10px 20px;
  border: none;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.btn-primary:active {
  transform: scale(0.97);
}

.btn-secondary {
  background: transparent;
  color: var(--primary);
  border: 1.5px solid var(--primary);
  border-radius: var(--radius-lg);
  font-weight: 600;
  font-size: 14px;
  padding: 9px 20px;
  cursor: pointer;
  transition: background-color 0.15s ease;
}

.btn-secondary:hover {
  background: var(--primary-50);
}

.btn-secondary:active {
  transform: scale(0.97);
}

.pill {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--radius-full);
  font-size: 12px;
  font-weight: 500;
}

.pill-success {
  background: var(--state-success-light);
  color: #1E8449;
}

.pill-warning {
  background: var(--state-warning-light);
  color: #B7950B;
}

.pill-error {
  background: var(--state-error-light);
  color: #C0392B;
}

.pill-info {
  background: var(--state-info-light);
  color: var(--state-info);
}

.progress-bar {
  width: 100%;
  height: 6px;
  background: var(--muted);
  border-radius: var(--radius-full);
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  border-radius: var(--radius-full);
  transition: width 0.6s ease;
}

.fab {
  position: fixed;
  bottom: 80px;
  right: 20px;
  width: 52px;
  height: 52px;
  border-radius: var(--radius-full);
  background: var(--primary);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 12px rgba(232, 115, 58, 0.3);
  transition: transform 0.15s ease;
  z-index: 40;
  border: none;
  cursor: pointer;
}

.fab:active {
  transform: scale(0.92);
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 56px;
  background: var(--card);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-around;
  z-index: 50;
  padding-bottom: env(safe-area-inset-bottom);
}

.bottom-nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  flex: 1;
  height: 100%;
  color: var(--muted-foreground);
  text-decoration: none;
  font-size: 11px;
  transition: color 0.15s ease;
  cursor: pointer;
}

.bottom-nav-item.active {
  color: var(--primary);
  font-weight: 600;
}

.bottom-nav-item svg,
.bottom-nav-item i {
  width: 22px;
  height: 22px;
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes breathe {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.animate-fade-in-up {
  animation: fadeInUp 0.4s ease forwards;
}

.animate-breathe {
  animation: breathe 2s ease-in-out infinite;
}

.stagger-1 { animation-delay: 0ms; }
.stagger-2 { animation-delay: 80ms; }
.stagger-3 { animation-delay: 160ms; }
.stagger-4 { animation-delay: 240ms; }
.stagger-5 { animation-delay: 320ms; }
.stagger-6 { animation-delay: 400ms; }

.page {
  display: none;
}

.page.active {
  display: block;
}

.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

.custom-scrollbar::-webkit-scrollbar {
  width: 6px;
}
.custom-scrollbar::-webkit-scrollbar-track {
  background: transparent;
}
.custom-scrollbar::-webkit-scrollbar-thumb {
  background: var(--muted);
  border-radius: 3px;
}
.custom-scrollbar::-webkit-scrollbar-thumb:hover {
  background: var(--muted-foreground);
}

.tutorial-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--background);
  z-index: 200;
  display: flex;
  flex-direction: column;
}

.tutorial-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  text-align: center;
}

.tutorial-icon {
  width: 120px;
  height: 120px;
  border-radius: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 32px;
  font-size: 56px;
}

.tutorial-title {
  font-size: 24px;
  font-weight: 700;
  color: var(--foreground);
  margin-bottom: 12px;
}

.tutorial-desc {
  font-size: 15px;
  color: var(--muted-foreground);
  line-height: 1.6;
  max-width: 320px;
}

.tutorial-tip {
  margin-top: 20px;
  padding: 12px 16px;
  background: var(--state-warning-light);
  border-radius: 12px;
  font-size: 13px;
  color: var(--state-warning);
  line-height: 1.5;
  max-width: 300px;
}

.tutorial-dots {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-bottom: 24px;
}

.tutorial-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--muted);
  transition: all 0.3s ease;
}

.tutorial-dot.active {
  width: 24px;
  border-radius: 4px;
  background: var(--primary);
}

.tutorial-footer {
  padding: 24px;
  padding-bottom: calc(24px + env(safe-area-inset-bottom));
}

.tutorial-btn {
  width: 100%;
  padding: 14px;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: transform 0.15s ease;
}

.tutorial-btn:active {
  transform: scale(0.97);
}

.tutorial-btn-primary {
  background: var(--primary);
  color: white;
}

.tutorial-btn-secondary {
  background: transparent;
  color: var(--muted-foreground);
  margin-top: 8px;
}

.tutorial-skip {
  position: absolute;
  top: 16px;
  right: 16px;
  padding: 8px 16px;
  font-size: 14px;
  color: var(--muted-foreground);
  background: transparent;
  border: none;
  cursor: pointer;
  z-index: 10;
}

<body class="min-h-screen font-sans antialiased">

<!-- 1. 首页仪表盘 -->
<div id="page-home" class="page active">
    <main class="pb-[72px]">
        <div class="flex items-center justify-between px-4 pt-4 pb-2">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full flex items-center justify-center" style="background-color: var(--primary-50);">
                    <i data-lucide="user" class="w-5 h-5" style="color: var(--primary);"></i>
                </div>
                <span id="home-username" class="typography-subtitle" style="color: var(--foreground);">小明的家</span>
            </div>
            <div class="flex items-center gap-2">
                <button id="exit-demo-btn" class="flex items-center gap-1 px-3 py-1.5 rounded-full text-xs font-medium" style="background: var(--state-warning-light); color: var(--state-warning);" data-action="exit-demo-mode">
                    <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                    <span>退出示例</span>
                </button>
                <button class="relative w-6 h-6 flex items-center justify-center" style="color: var(--foreground);" data-action="view-reminders" aria-label="提醒通知">
                    <i data-lucide="bell" class="w-6 h-6"></i>
                    <span id="bell-dot" class="absolute top-0 right-0 w-2 h-2 rounded-full animate-breathe" style="background-color: var(--state-error);"></span>
                </button>
            </div>
        </div>

        <div class="flex gap-[10px] px-4 mt-3 overflow-x-auto no-scrollbar">
            <div class="card animate-fade-in-up stagger-1 flex-shrink-0 rounded-2xl p-4 px-[14px]" style="min-width: 100px; background-color: var(--primary-50); border-color: transparent;">
                <span id="stat-total" class="typography-numeral text-2xl block" style="color: var(--primary);">12</span>
                <span class="typography-caption">台家电</span>
            </div>
            <div class="card animate-fade-in-up stagger-2 flex-shrink-0 rounded-2xl p-4 px-[14px]" style="min-width: 100px; background-color: var(--state-success-light); border-color: transparent;">
                <span id="stat-warranty" class="typography-numeral text-2xl block" style="color: var(--state-success);">8</span>
                <span class="typography-caption">台保修中</span>
            </div>
            <div class="card animate-fade-in-up stagger-3 flex-shrink-0 rounded-2xl p-4 px-[14px]" style="min-width: 100px; background-color: var(--state-warning-light); border-color: transparent;">
                <span id="stat-pending" class="typography-numeral text-2xl block" style="color: var(--state-warning);">3</span>
                <span class="typography-caption">项提醒</span>
            </div>
        </div>

        <div class="px-4 mt-5">
            <h2 class="typography-subtitle mb-3" style="color: var(--foreground);">需要你关注</h2>
            <div id="home-attention-list"></div>
        </div>

        <div class="text-center mt-2">
            <button class="text-sm font-medium" style="color: var(--primary);" data-action="view-appliances">查看全部</button>
        </div>

        <button class="fab" data-action="view-add" aria-label="添加家电">
            <i data-lucide="plus" class="w-6 h-6" style="color: white;"></i>
        </button>
    </main>
</div>

<!-- 2. 我的家电 -->
<div id="page-appliances" class="page">
    <main class="pb-[72px]">
        <header class="flex items-center justify-between px-4 pt-4 pb-3">
            <h1 class="typography-display" style="color: var(--foreground);">我的家电</h1>
            <button class="flex h-7 w-7 items-center justify-center rounded-full bg-[var(--muted)]" aria-label="搜索" data-action="toggle-search">
                <i data-lucide="search" class="w-4 h-4" style="color: var(--foreground);"></i>
            </button>
        </header>

        <div id="search-bar" class="hidden px-4 pb-3">
            <div class="relative">
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2" style="color: var(--muted-foreground);"></i>
                <input type="text" id="search-input" placeholder="搜索家电名称、品牌..." class="w-full pl-9 pr-4 py-2.5 rounded-xl border border-[var(--border)] bg-[var(--card)] text-sm" style="color: var(--foreground);">
            </div>
        </div>

        <nav class="flex items-center gap-2 overflow-x-auto px-4 pb-4 no-scrollbar" aria-label="房间分类筛选">
            <button class="filter-btn shrink-0 rounded-full bg-[var(--primary)] px-4 py-1.5 text-[13px] font-semibold text-white whitespace-nowrap" data-filter="all">全部</button>
            <button class="filter-btn shrink-0 rounded-full border border-[var(--border)] bg-[var(--card)] px-4 py-1.5 text-[13px] font-medium text-[var(--foreground)] whitespace-nowrap" data-filter="kitchen">厨房</button>
            <button class="filter-btn shrink-0 rounded-full border border-[var(--border)] bg-[var(--card)] px-4 py-1.5 text-[13px] font-medium text-[var(--foreground)] whitespace-nowrap" data-filter="living">客厅</button>
            <button class="filter-btn shrink-0 rounded-full border border-[var(--border)] bg-[var(--card)] px-4 py-1.5 text-[13px] font-medium text-[var(--foreground)] whitespace-nowrap" data-filter="bedroom">卧室</button>
            <button class="filter-btn shrink-0 rounded-full border border-[var(--border)] bg-[var(--card)] px-4 py-1.5 text-[13px] font-medium text-[var(--foreground)] whitespace-nowrap" data-filter="bathroom">卫生间</button>
            <button class="filter-btn shrink-0 rounded-full border border-[var(--border)] bg-[var(--card)] px-4 py-1.5 text-[13px] font-medium text-[var(--foreground)] whitespace-nowrap" data-filter="other">其他</button>
        </nav>

        <section class="flex flex-col gap-3 px-4 pb-4" id="appliances-list"></section>

        <button class="fab" data-action="view-add" aria-label="添加家电">
            <i data-lucide="plus" class="w-6 h-6" style="color: white;"></i>
        </button>
    </main>
</div>

<!-- 3. 家电详情 -->
<div id="page-appliance-detail" class="page">
    <main class="pb-24">
        <header class="sticky top-0 z-30 border-b border-[var(--border)] bg-[var(--background)]/95 backdrop-blur-sm">
            <div class="flex h-12 items-center px-4">
                <button data-action="back-appliances" class="inline-flex h-9 w-9 items-center justify-center rounded-lg" aria-label="返回">
                    <i data-lucide="arrow-left" class="h-5 w-5" style="color: var(--foreground);"></i>
                </button>
