<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双树心境 · 烦恼树+开心树 视觉测试 Demo</title>
<style>
  @font-face { font-family:'B'; src:url('./_shared/fonts/BricolageGrotesque-Regular.ttf') format('truetype'); font-weight:400; }
  @font-face { font-family:'B'; src:url('./_shared/fonts/BricolageGrotesque-Bold.ttf') format('truetype'); font-weight:700; }
  :root {
    --bg:#faf7f2; --card:#fff; --ink:#3a3329; --muted:#8a7d6e; --rule:#e8dccb;
    --green:#88b89a; --pink:#f3a4b5; --yellow:#f6c873; --purple:#b8a4d4;
    --apple-green:#a8c98a; --apple-red:#e07a5f; --r:16px; --rs:10px;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'B','PingFang SC','Microsoft YaHei',sans-serif; background:var(--bg); color:var(--ink); line-height:1.7; min-height:100vh; }
  .wrap { max-width:1100px; margin:0 auto; padding:16px; }

  /* Header */
  .topbar { display:flex; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
  .topbar h1 { font-size:20px; font-weight:700; }
  .topbar .badge { font-size:12px; padding:3px 10px; border-radius:999px; background:rgba(136,184,154,0.15); color:#4f7d63; font-weight:700; }

  /* Tree Stage */
  .tree-stage { background:linear-gradient(180deg,#d4f0e0 0%,#fef5f5 50%,#fff 100%); border-radius:var(--r); border:1px solid var(--rule); padding:16px; position:relative; overflow:hidden; min-height:480px; }
  .tree-stage::before { content:"✦ ✧ ⋆ ✦ ✧ ⋆"; position:absolute; top:10px; left:0; right:0; text-align:center; color:rgba(246,200,115,0.6); font-size:14px; letter-spacing:8px; }

  /* Two trees side by side */
  .trees-wrap { display:grid; grid-template-columns:1fr 1fr; gap:20px; position:relative; z-index:1; }
  @media(max-width:700px){ .trees-wrap{grid-template-columns:1fr;} }

  .tree-box { text-align:center; position:relative; }
  .tree-label { display:inline-block; padding:4px 14px; border-radius:999px; font-size:12px; font-weight:700; margin-bottom:8px; }
  .tree-label.worry { background:rgba(136,184,154,0.15); color:#4f7d63; }
  .tree-label.happy { background:rgba(243,164,181,0.15); color:#b85c75; }
  .tree-svg { width:100%; max-width:420px; height:380px; }

  /* Pet between trees (desktop) */
  .pet-center { position:absolute; left:50%; bottom:20px; transform:translateX(-50%); z-index:2; text-align:center; }
  .pet-center img { width:72px; height:72px; border-radius:50%; border:3px solid var(--green); box-shadow:0 4px 16px rgba(136,184,154,0.3); background:var(--card); }
  .pet-center .pet-speech { font-size:11px; color:var(--muted); margin-top:4px; background:rgba(255,255,255,0.85); padding:2px 10px; border-radius:999px; }
  @media(max-width:700px){ .pet-center{position:relative;left:auto;bottom:auto;transform:none;margin-top:10px;} }

  /* Controls */
  .controls { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:16px; }
  .ctrl-btn { padding:12px; border-radius:var(--r); border:none; cursor:pointer; font-family:inherit; font-size:14px; font-weight:700; color:#fff; transition:transform .15s; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .ctrl-btn:active { transform:scale(0.97); }
  .ctrl-btn .icon { font-size:24px; }
  .ctrl-btn.green { background:linear-gradient(135deg,var(--green),#6fa38a); }
  .ctrl-btn.pink { background:linear-gradient(135deg,var(--pink),#e88aa3); }
  .ctrl-btn.yellow { background:linear-gradient(135deg,var(--yellow),#e8b85a); color:var(--ink); }
  .ctrl-btn.purple { background:linear-gradient(135deg,var(--purple),#9a82b8); }

  /* Form overlay */
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:200; display:none; align-items:flex-end; justify-content:center; }
  .overlay.show { display:flex; }
  .sheet { background:var(--card); width:100%; max-width:500px; border-radius:var(--r) var(--r) 0 0; padding:20px; transform:translateY(100%); transition:transform .3s ease; max-height:80vh; overflow-y:auto; }
  .overlay.show .sheet { transform:translateY(0); }
  .sheet h3 { margin-bottom:12px; font-size:16px; }
  .sheet input, .sheet textarea, .sheet select { width:100%; font-family:inherit; font-size:13px; padding:10px 12px; border:1px solid var(--rule); border-radius:var(--rs); margin-bottom:10px; color:var(--ink); background:var(--bg); }
  .sheet input:focus, .sheet textarea:focus { outline:2px solid var(--green); border-color:transparent; }
  .sheet .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .sheet .btns { display:flex; gap:8px; margin-top:4px; }
  .sheet .btns button { flex:1; padding:10px; border:none; border-radius:999px; font-family:inherit; font-size:13px; font-weight:700; cursor:pointer; }
  .sheet .btns .primary { background:var(--green); color:#fff; }
  .sheet .btns .ghost { background:var(--bg); color:var(--muted); border:1px solid var(--rule); }

  /* Lists */
  .list-panel { background:var(--card); border-radius:var(--r); border:1px solid var(--rule); padding:14px; margin-top:12px; }
  .list-panel h4 { font-size:14px; margin-bottom:8px; }
  .list-item { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; padding:8px 0; border-bottom:1px dashed var(--rule); font-size:13px; }
  .list-item:last-child { border-bottom:none; }
  .list-item .text { flex:1; }
  .list-item .meta { font-size:10px; color:var(--muted); }
  .list-item .resolve-btn { padding:4px 10px; border:none; border-radius:999px; background:var(--apple-green); color:#fff; font-size:11px; cursor:pointer; white-space:nowrap; }
  .list-item .resolve-btn:hover { background:var(--apple-red); }
  .list-item.resolved .text { text-decoration:line-through; opacity:0.6; }
  .list-item.resolved .resolve-btn { display:none; }

  /* Harvest bar */
  .harvest-bar { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .harvest-btn { padding:8px 16px; border-radius:999px; border:1px solid var(--rule); background:var(--card); font-family:inherit; font-size:12px; font-weight:700; cursor:pointer; transition:all .2s; }
  .harvest-btn:hover { background:var(--yellow); border-color:var(--yellow); }

  /* Toast + star fly */
  .toast { position:fixed; top:60px; left:50%; transform:translateX(-50%); z-index:300; padding:10px 20px; border-radius:999px; background:var(--ink); color:#fff; font-size:13px; font-weight:600; box-shadow:0 4px 16px rgba(0,0,0,0.15); opacity:0; transition:opacity .3s; pointer-events:none; }
  .toast.show { opacity:1; }
  .star-fly { position:fixed; pointer-events:none; z-index:250; font-size:22px; animation:floatStar .9s ease-out forwards; }
  @keyframes floatStar { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-70px) scale(1.4)} }

  /* Month badge */
  .month-badge { text-align:center; font-size:13px; color:var(--muted); margin-top:8px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <h1>🌳🌸 双树心境 · 视觉互动测试</h1>
    <span class="badge" id="monthBadge">📅 第 1 棵烦恼树 · 第 1 棵开心树</span>
  </div>

  <!-- Tree Stage -->
  <div class="tree-stage">
    <div class="trees-wrap">
      <!-- Worry Tree -->
      <div class="tree-box">
        <div class="tree-label worry">🌳 烦恼树</div>
        <svg class="tree-svg" id="worrySvg" viewBox="0 0 400 380" xmlns="http://www.w3.org/2000/svg">
          <!-- Ground shadow -->
          <ellipse cx="200" cy="365" rx="140" ry="10" fill="rgba(95,128,80,0.12)"/>
          <!-- Trunk -->
          <path d="M200 365 L192 240 L185 170 L200 90 L215 170 L208 240 Z" fill="#8b6f4e" stroke="#6e553a" stroke-width="1.5"/>
          <!-- Branches -->
          <path d="M200 220 Q150 180 120 160 M200 200 Q250 160 280 140 M200 260 Q160 230 130 220 M200 250 Q240 220 270 210" stroke="#8b6f4e" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          <!-- Leaves canopy (3 layers) -->
          <ellipse cx="200" cy="145" rx="110" ry="85" fill="#a8c98a" opacity="0.85"/>
          <ellipse cx="140" cy="125" rx="60" ry="50" fill="#9ec07d" opacity="0.85"/>
          <ellipse cx="260" cy="125" rx="60" ry="50" fill="#b8d49b" opacity="0.85"/>
          <ellipse cx="200" cy="105" rx="65" ry="48" fill="#c2dba8" opacity="0.85"/>
          <!-- Apples layer -->
          <g id="appleLayer"></g>
        </svg>
        <div class="month-badge" id="worryCount">青苹果 0 · 红苹果 0</div>
      </div>

      <!-- Happy Tree -->
      <div class="tree-box">
        <div class="tree-label happy">🌸 开心树</div>
        <svg class="tree-svg" id="happySvg" viewBox="0 0 400 380" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="200" cy="365" rx="140" ry="10" fill="rgba(150,80,100,0.1)"/>
          <path d="M200 365 L192 240 L185 170 L200 90 L215 170 L208 240 Z" fill="#8b6f4e" stroke="#6e553a" stroke-width="1.5"/>
          <path d="M200 220 Q150 180 120 160 M200 200 Q250 160 280 140 M200 260 Q160 230 130 220 M200 250 Q240 220 270 210" stroke="#8b6f4e" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          <ellipse cx="200" cy="145" rx="110" ry="85" fill="#fbd0d8" opacity="0.85"/>
          <ellipse cx="140" cy="125" rx="60" ry="50" fill="#fcdbe1" opacity="0.85"/>
          <ellipse cx="260" cy="125" rx="60" ry="50" fill="#f9c4cf" opacity="0.85"/>
          <ellipse cx="200" cy="105" rx="65" ry="48" fill="#fde2e7" opacity="0.85"/>
          <!-- Flowers layer -->
          <g id="flowerLayer"></g>
        </svg>
        <div class="month-badge" id="happyCount">花朵 0</div>
      </div>
    </div>

    <!-- Pet in center -->
    <div class="pet-center">
      <img src="assets/pet_mascot_1024x1024.jpg" alt="宠物">
      <div class="pet-speech" id="petSpeech">我在两棵树中间等你 🌱</div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="ctrl-btn green" onclick="openForm('worry')"><span class="icon">🌳</span>记一笔烦心事<br><span style="font-size:11px;font-weight:400">长出青苹果</span></button>
    <button class="ctrl-btn pink" onclick="openForm('happy')"><span class="icon">🌸</span>记一笔开心事<br><span style="font-size:11px;font-weight:400">开出一朵花</span></button>
    <button class="ctrl-btn yellow" onclick="harvestMonth()"><span class="icon">🍎</span>收获本月果实<br><span style="font-size:11px;font-weight:400">存入庄园</span></button>
    <button class="ctrl-btn purple" onclick="resetMonth()"><span class="icon">✦</span>开启新月份<br><span style="font-size:11px;font-weight:400">新树生长</span></button>
  </div>

  <!-- Lists -->
  <div class="list-panel">
    <h4>📝 本月记录</h4>
    <div id="recordList"><div style="font-size:12px;color:var(--muted);text-align:center;padding:12px">还没有记录，点击上方按钮开始吧</div></div>
  </div>

  <!-- Manor preview -->
  <div class="list-panel" style="margin-top:12px">
    <h4>🏡 心境庄园（已收获的月树）</h4>
    <div class="harvest-bar" id="manorBar"><span style="font-size:12px;color:var(--muted)">收获本月果实后，这里会显示你的庄园</span></div>
  </div>

</div>

<!-- Form Overlay -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeForm()">
  <div class="sheet">
    <h3 id="formTitle">记一笔</h3>
    <div id="formBody"></div>
    <div class="btns">
      <button class="primary" onclick="submitForm()">提交</button>
      <button class="ghost" onclick="closeForm()">取消</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="starContainer" style="position:fixed;inset:0;pointer-events:none;z-index:250"></div>

<script>
// ===== STATE =====
const S = { month:1, worries:[], happies:[], manor:[] };
const APPLE_SPOTS = [
  [130,80],[170,65],[210,75],[250,90],[100,120],[150,140],[200,125],[250,135],[120,170],[180,180],[230,165],[280,150],[140,100],[190,95],[240,110],[110,150],[260,120],[170,155]
];
const FLOWER_SPOTS = [
  [130,80],[170,65],[210,75],[250,90],[100,120],[150,140],[200,125],[250,135],[120,170],[180,180],[230,165],[280,150],[140,100],[190,95],[240,110],[110,150],[260,120],[170,155]
];

function save(){ try{localStorage.setItem('tree_demo',JSON.stringify(S))}catch(e){} }
function load(){ try{const d=localStorage.getItem('tree_demo'); if(d){Object.assign(S,JSON.parse(d)); fix()}}catch(e){} }
function fix(){ if(!S.manor)S.manor=[]; if(!S.month)S.month=1; }
load();

// ===== UI HELPERS =====
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }
function flyStar(x,y,emoji){ const el=document.createElement('div'); el.className='star-fly'; el.textContent=emoji; el.style.left=x+'px'; el.style.top=y+'px'; document.getElementById('starContainer').appendChild(el); setTimeout(()=>el.remove(),1000); }

// ===== RENDER TREES =====
function renderApples(){
  const g=document.getElementById('appleLayer'); g.innerHTML='';
  const ns='http://www.w3.org/2000/svg';
  S.worries.forEach((w,i)=>{
    const spot=APPLE_SPOTS[i%APPLE_SPOTS.length];
    const ox=Math.floor(i/APPLE_SPOTS.length)*10;
    const x=spot[0]+ox, y=spot[1];
    const color=w.resolved?'#e07a5f':'#a8c98a';
    const stroke=w.resolved?'#b85c40':'#7a9b5b';
    const grp=document.createElementNS(ns,'g');
    grp.setAttribute('transform','translate('+x+','+y+')');
    grp.style.cursor=w.resolved?'default':'pointer';
    // Leaf
    const leaf=document.createElementNS(ns,'path');
    leaf.setAttribute('d','M0 -12 Q5 -16 10 -12 Q5 -8 0 -12 Z');
    leaf.setAttribute('fill','#7a9b5b');
    // Stem
    const stem=document.createElementNS(ns,'rect');
    stem.setAttribute('x',-1.5); stem.setAttribute('y',-12);
    stem.setAttribute('width',3); stem.setAttribute('height',6);
    stem.setAttribute('fill','#7a4f2e');
    // Apple body
    const apple=document.createElementNS(ns,'circle');
    apple.setAttribute('r',9);
    apple.setAttribute('fill',color);
    apple.setAttribute('stroke',stroke);
    apple.setAttribute('stroke-width',1.5);
    // Shine
    const shine=document.createElementNS(ns,'ellipse');
    shine.setAttribute('cx',-2.5); shine.setAttribute('cy',-2.5);
    shine.setAttribute('rx',2); shine.setAttribute('ry',1.2);
    shine.setAttribute('fill','rgba(255,255,255,0.7)');
    grp.appendChild(leaf); grp.appendChild(stem); grp.appendChild(apple); grp.appendChild(shine);
    if(!w.resolved){
      grp.addEventListener('mouseenter',()=>apple.setAttribute('r',11));
      grp.addEventListener('mouseleave',()=>apple.setAttribute('r',9));
      grp.addEventListener('click',()=>resolveWorry(i));
    }
    g.appendChild(grp);
  });
}

function renderFlowers(){
  const g=document.getElementById('flowerLayer'); g.innerHTML='';
  const ns='http://www.w3.org/2000/svg';
  S.happies.forEach((h,i)=>{
    const spot=FLOWER_SPOTS[i%FLOWER_SPOTS.length];
    const ox=Math.floor(i/FLOWER_SPOTS.length)*10;
    const x=spot[0]+ox, y=spot[1];
    const grp=document.createElementNS(ns,'g');
    grp.setAttribute('transform','translate('+x+','+y+')');
    // 5 petals
    for(let p=0;p<5;p++){
      const petal=document.createElementNS(ns,'ellipse');
      const ang=(p*72)*Math.PI/180;
      petal.setAttribute('cx',Math.cos(ang)*5);
      petal.setAttribute('cy',Math.sin(ang)*5);
      petal.setAttribute('rx',4.5);
      petal.setAttribute('ry',3);
      petal.setAttribute('fill','#fda4b8');
      petal.setAttribute('opacity',0.92);
      grp.appendChild(petal);
    }
    const center=document.createElementNS(ns,'circle');
    center.setAttribute('r',3);
    center.setAttribute('fill','#f6c873');
    grp.appendChild(center);
    g.appendChild(grp);
  });
}

function renderList(){
  const box=document.getElementById('recordList');
  if(S.worries.length===0&&S.happies.length===0){
    box.innerHTML='<div style="font-size:12px;color:var(--muted);text-align:center;padding:12px">还没有记录，点击上方按钮开始吧</div>';
    return;
  }
  let html='';
  S.worries.slice().reverse().forEach((w,idx)=>{
    const realIdx=S.worries.length-1-idx;
    html+=`<div class="list-item ${w.resolved?'resolved':''}">
      <div class="text">
        <div>🌳 ${escapeHtml(w.what)}</div>
        <div class="meta">${escapeHtml(w.when)} · ${escapeHtml(w.where)} · ${escapeHtml(w.feel)} ${w.resolved?'· ✅ 已化解':''}</div>
      </div>
      ${!w.resolved?`<button class="resolve-btn" onclick="resolveWorry(${realIdx})">想开了 +⭐</button>`:''}
    </div>`;
  });
  S.happies.slice().reverse().forEach(h=>{
    html+=`<div class="list-item">
      <div class="text">
        <div>🌸 ${escapeHtml(h.text)}</div>
        <div class="meta">${escapeHtml(h.type)} · ${escapeHtml(h.time)}</div>
      </div>
    </div>`;
  });
  box.innerHTML=html;
}

function renderManor(){
  const bar=document.getElementById('manorBar');
  if(S.manor.length===0){ bar.innerHTML='<span style="font-size:12px;color:var(--muted)">收获本月果实后，这里会显示你的庄园</span>'; return; }
  bar.innerHTML=S.manor.map(m=>`<button class="harvest-btn">${m.month}月 · 🍎${m.apples} · 🌸${m.flowers}</button>`).join('');
}

function updateCounts(){
  const green=S.worries.filter(w=>!w.resolved).length;
  const red=S.worries.filter(w=>w.resolved).length;
  document.getElementById('worryCount').textContent=`青苹果 ${green} · 红苹果 ${red}`;
  document.getElementById('happyCount').textContent=`花朵 ${S.happies.length}`;
  document.getElementById('monthBadge').textContent=`📅 第 ${S.month} 棵烦恼树 · 第 ${S.month} 棵开心树`;
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }

function updateAll(){ renderApples(); renderFlowers(); renderList(); renderManor(); updateCounts(); save(); }

// ===== FORM =====
let formType='';
function openForm(type){
  formType=type;
  const overlay=document.getElementById('overlay');
  const title=document.getElementById('formTitle');
  const body=document.getElementById('formBody');
  if(type==='worry'){
    title.textContent='🌳 记一笔烦心事';
    body.innerHTML=`<div class="row2">
      <input id="fwWhen" type="text" placeholder="时间（如：今天下午3点）">
      <input id="fwWhere" type="text" placeholder="地点（如：学校教室）">
    </div>
    <input id="fwFeel" type="text" placeholder="感受词（如：焦虑、烦躁、委屈）">
    <textarea id="fwWhat" rows="3" placeholder="发生了什么（请完整描述，≥6字）"></textarea>`;
  } else {
    title.textContent='🌸 记一笔开心事';
    body.innerHTML=`<select id="fhType" style="margin-bottom:10px">
      <option value="小事喜悦">小事喜悦</option>
      <option value="自我突破">自我突破</option>
      <option value="收获成长">收获成长</option>
      <option value="被善待">被善待</option>
      <option value="完成新事">完成新事</option>
    </select>
    <textarea id="fhText" rows="3" placeholder="今天有什么暖心瞬间？"></textarea>`;
  }
  overlay.classList.add('show');
}
function closeForm(){ document.getElementById('overlay').classList.remove('show'); }
function submitForm(){
  if(formType==='worry'){
    const when=document.getElementById('fwWhen').value.trim();
    const where=document.getElementById('fwWhere').value.trim();
    const feel=document.getElementById('fwFeel').value.trim();
    const what=document.getElementById('fwWhat').value.trim();
    if(!when||!where||!feel||what.length<6){ showToast('请填写完整四要素'); return; }
    S.worries.push({when,where,what,feel,resolved:false});
    showToast('🌳 青苹果已长出');
    document.getElementById('petSpeech').textContent='烦恼放进树里了，它不再只待在你心里 🌳';
  } else {
    const type=document.getElementById('fhType').value;
    const text=document.getElementById('fhText').value.trim();
    if(text.length<3){ showToast('请至少写3个字'); return; }
    const time=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
    S.happies.push({type,text,time});
    showToast('🌸 开出一朵花 +1 美好星');
    flyStar(window.innerWidth/2,window.innerHeight/2,'🌸');
    document.getElementById('petSpeech').textContent='这一刻真好，我帮你记住了 🌸';
  }
  closeForm(); updateAll();
}

// ===== ACTIONS =====
function resolveWorry(idx){
  if(S.worries[idx].resolved) return;
  S.worries[idx].resolved=true;
  showToast('🍎 想开了！青苹果变红 +1 勇气星');
  flyStar(window.innerWidth/2,window.innerHeight/2,'🍎');
  document.getElementById('petSpeech').textContent='你看，你一直在长大 ✨';
  updateAll();
}

function harvestMonth(){
  const red=S.worries.filter(w=>w.resolved).length;
  const flowers=S.happies.length;
  if(red===0&&flowers===0){ showToast('本月还没有可收获的果实'); return; }
  S.manor.push({month:S.month,apples:red,flowers:flowers});
  showToast(`🍎 第${S.month}月已收获！红苹果 ${red} · 花朵 ${flowers}`);
  document.getElementById('petSpeech').textContent=`第${S.month}月的果实已存入庄园 🏡`;
  updateAll();
}

function resetMonth(){
  if(S.worries.length>0||S.happies.length>0){
    const red=S.worries.filter(w=>w.resolved).length;
    if(red>0||S.happies.length>0){
      if(!confirm(`本月还有未收获的果实，确定开启新月份吗？`)) return;
    }
  }
  S.month++;
  S.worries=[];
  S.happies=[];
  showToast(`✨ 第 ${S.month} 个月开始了！新树正在生长`);
  document.getElementById('petSpeech').textContent='新的一月，新的树，慢慢来 🌱';
  updateAll();
}

// ===== INIT =====
updateAll();
console.log('🌳🌸 双树视觉Demo已加载');
</script>
