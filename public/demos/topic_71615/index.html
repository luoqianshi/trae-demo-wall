<!DOCTYPE html>
<html lang="zh-CN" data-theme="ancient">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI剧情沉浸小说阅读器</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <!-- ========== 顶部导航栏 ========== -->
  <header class="top-bar">
    <div class="logo">
      <i class="fas fa-book-open"></i>
      <span>AI剧情沉浸阅读器</span>
    </div>
    <nav class="theme-switcher">
      <span class="theme-label">主题皮肤</span>
      <button class="theme-btn active" data-theme="ancient" title="古风">
        <i class="fas fa-fan"></i> 古风
      </button>
      <button class="theme-btn" data-theme="campus" title="校园">
        <i class="fas fa-graduation-cap"></i> 校园
      </button>
      <button class="theme-btn" data-theme="cyber" title="赛博">
        <i class="fas fa-microchip"></i> 赛博
      </button>
      <button class="theme-btn" data-theme="republic" title="民国">
        <i class="fas fa-landmark"></i> 民国
      </button>
    </nav>
    <div class="top-actions">
      <button id="btn-reset-atmosphere" class="action-btn" title="重置氛围到默认">
        <i class="fas fa-undo"></i> 重置氛围
      </button>
      <button id="btn-save-config" class="action-btn" title="保存当前主题配置">
        <i class="fas fa-save"></i> 保存配置
      </button>
      <button id="btn-upload" class="action-btn" title="上传小说文件">
        <i class="fas fa-file-upload"></i> 上传文件
      </button>
      <input type="file" id="file-input" accept=".txt,.text,.md" hidden />
    </div>
  </header>

  <!-- ========== 主体三栏布局 ========== -->
  <main class="app-main">

    <!-- 左栏：小说文本区 -->
    <section class="panel panel-left">
      <div class="panel-header">
        <h2><i class="fas fa-scroll"></i> 小说阅读区</h2>
        <div class="mood-indicator">
          <span class="mood-label">当前情绪：</span>
          <span id="current-mood" class="mood-tag">--</span>
        </div>
      </div>
      <div class="panel-body">
        <!-- 空状态提示 -->
        <div id="empty-state" class="empty-state">
          <i class="fas fa-feather-alt"></i>
          <p>粘贴或上传小说文本开始阅读</p>
          <p class="hint">支持 .txt / .md 格式，AI将自动识别段落情绪</p>
        </div>
        <!-- 文本输入区 -->
        <div id="text-input-area" class="text-input-area">
          <textarea id="novel-input" placeholder="在此粘贴小说文本，或点击右上角上传文件..."></textarea>
          <button id="btn-parse" class="btn-primary">
            <i class="fas fa-magic"></i> 开始沉浸阅读
          </button>
        </div>
        <!-- 阅读展示区 -->
        <div id="reader-area" class="reader-area hidden">
          <div id="novel-content" class="novel-content"></div>
        </div>
      </div>
    </section>

    <!-- 中栏：氛围控制面板 -->
    <section class="panel panel-center">
      <div class="panel-header">
        <h2><i class="fas fa-sliders-h"></i> 氛围控制</h2>
      </div>
      <div class="panel-body atmosphere-controls">
        <!-- 情绪识别结果 -->
        <div class="control-group">
          <h3><i class="fas fa-heart-pulse"></i> 情绪识别</h3>
          <div class="emotion-grid">
            <div class="emotion-card" data-emotion="sweet">
              <div class="emotion-icon">💕</div>
              <span>甜宠</span>
              <div class="emotion-bar"><div class="emotion-fill" data-emotion="sweet"></div></div>
            </div>
            <div class="emotion-card" data-emotion="angsty">
              <div class="emotion-icon">💔</div>
              <span>虐心</span>
              <div class="emotion-bar"><div class="emotion-fill" data-emotion="angsty"></div></div>
            </div>
            <div class="emotion-card" data-emotion="passionate">
              <div class="emotion-icon">🔥</div>
              <span>热血</span>
              <div class="emotion-bar"><div class="emotion-fill" data-emotion="passionate"></div></div>
            </div>
            <div class="emotion-card" data-emotion="suspense">
              <div class="emotion-icon">🔮</div>
              <span>悬疑</span>
              <div class="emotion-bar"><div class="emotion-fill" data-emotion="suspense"></div></div>
            </div>
          </div>
        </div>

        <!-- 背景动效 -->
        <div class="control-group">
          <h3><i class="fas fa-image"></i> 动态背景</h3>
          <div class="bg-selector">
            <button class="bg-btn active" data-bg="auto">自动匹配</button>
            <button class="bg-btn" data-bg="sunset">落日余晖</button>
            <button class="bg-btn" data-bg="rain">雨夜忧伤</button>
            <button class="bg-btn" data-bg="cherry">樱花飘落</button>
            <button class="bg-btn" data-bg="stars">星空璀璨</button>
          </div>
        </div>

        <!-- 光影滤镜 -->
        <div class="control-group">
          <h3><i class="fas fa-sun"></i> 光影滤镜</h3>
          <div class="filter-slider">
            <label>暖光强度</label>
            <input type="range" id="filter-warmth" min="0" max="100" value="50" />
          </div>
          <div class="filter-slider">
            <label>暗角效果</label>
            <input type="range" id="filter-vignette" min="0" max="100" value="30" />
          </div>
          <div class="filter-slider">
            <label>阅读亮度</label>
            <input type="range" id="filter-brightness" min="30" max="120" value="90" />
          </div>
        </div>

        <!-- 背景音乐 -->
        <div class="control-group">
          <h3><i class="fas fa-music"></i> 配套轻音乐</h3>
          <div class="music-selector">
            <button class="music-btn" data-music="sweet">
              <i class="fas fa-play"></i> 甜宠BGM
            </button>
            <button class="music-btn" data-music="angsty">
              <i class="fas fa-play"></i> 虐心BGM
            </button>
            <button class="music-btn" data-music="passionate">
              <i class="fas fa-play"></i> 热血BGM
            </button>
            <button class="music-btn" data-music="suspense">
              <i class="fas fa-play"></i> 悬疑BGM
            </button>
          </div>
          <div class="volume-control">
            <i class="fas fa-volume-low"></i>
            <input type="range" id="music-volume" min="0" max="100" value="40" />
            <i class="fas fa-volume-high"></i>
          </div>
        </div>

        <!-- 阅读设置 -->
        <div class="control-group">
          <h3><i class="fas fa-text-height"></i> 排版设置</h3>
          <div class="slider-row">
            <label>字号 <span id="font-size-val" class="slider-val">16px</span></label>
            <input type="range" id="font-size-slider" min="12" max="28" value="16" step="1" />
          </div>
          <div class="slider-row">
            <label>行距 <span id="line-height-val" class="slider-val">1.8</span></label>
            <input type="range" id="line-height-slider" min="1.2" max="3.0" value="1.8" step="0.1" />
          </div>
        </div>

        <!-- 性能优化 -->
        <div class="control-group">
          <h3><i class="fas fa-tachometer-alt"></i> 性能模式</h3>
          <label class="toggle-label">
            <input type="checkbox" id="reduced-motion-toggle" />
            <span class="toggle-switch"></span>
            <span>减少动画（低配设备）</span>
          </label>
        </div>
      </div>
    </section>

    <!-- 右栏：角色对话 -->
    <section class="panel panel-right">
      <div class="panel-header">
        <h2><i class="fas fa-comments"></i> 角色对话</h2>
      </div>
      <div class="panel-body">
        <!-- 角色选择 -->
        <div class="character-selector">
          <div class="instruction">
            <i class="fas fa-hand-pointer"></i>
            <span>在左侧小说中<strong>选中人物名字</strong>，即可与此角色对话</span>
          </div>
          <div id="character-list" class="character-list">
            <div class="no-character">
              <i class="fas fa-user-plus"></i>
              <p>暂无角色，请在小说中选中文本</p>
            </div>
          </div>
        </div>

        <!-- 对话区域 -->
        <div id="chat-area" class="chat-area hidden">
          <div class="chat-header">
            <div class="chat-character-info">
              <div id="chat-avatar" class="chat-avatar"><i class="fas fa-user"></i></div>
              <div>
                <span id="chat-character-name" class="chat-name">角色名</span>
                <span class="chat-status">在线</span>
              </div>
            </div>
            <div class="chat-actions">
              <button id="btn-export-chat" class="btn-icon" title="导出对话"><i class="fas fa-download"></i></button>
              <button id="btn-clear-chat" class="btn-icon" title="清除对话"><i class="fas fa-trash-alt"></i></button>
              <button id="btn-close-chat" class="btn-icon" title="关闭对话"><i class="fas fa-times"></i></button>
            </div>
          </div>
          <div id="chat-messages" class="chat-messages"></div>
          <div class="chat-input-area">
            <div class="chat-mode-tabs">
              <button class="chat-mode active" data-mode="chat">💬 聊天</button>
              <button class="chat-mode" data-mode="branch">📜 续写支线</button>
            </div>
            <textarea id="chat-input" placeholder="输入消息与角色互动..."></textarea>
            <button id="btn-send-chat" class="btn-primary btn-send">
              <i class="fas fa-paper-plane"></i> 发送
            </button>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- ========== 动态背景层 ========== -->
  <div id="dynamic-bg" class="dynamic-bg"></div>
  <div id="filter-overlay" class="filter-overlay"></div>

  <!-- ========== 角色选中文本气泡 ========== -->
  <div id="selection-popup" class="selection-popup hidden">
    <button id="btn-add-character" class="selection-action">
      <i class="fas fa-plus-circle"></i> 添加为角色并对话
    </button>
  </div>

  <!-- ========== Toast提示 ========== -->
  <div id="toast-container" class="toast-container"></div>

  <!-- ========== JavaScript ========== -->
  <script src="js/emotion-engine.js"></script>
  <script src="js/theme-manager.js"></script>
  <script src="js/music-player.js"></script>
  <script src="js/character-chat.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
