<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>非遗绒花·指尖上的AI工作坊</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/animation.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- 粒子效果背景 -->
    <canvas id="particles-canvas"></canvas>

    <!-- 主容器 -->
    <div class="main-container">
        <!-- 绒花奶奶角色（左下角） -->
        <div class="grandma-character" id="grandmaCharacter">
            <div class="grandma-speech-bubble" id="grandmaSpeechBubble">
                <div class="speech-text" id="speechText"></div>
                <div class="speech-tail"></div>
            </div>
            <div class="grandma-body" id="grandmaBody">
                <div class="grandma-head">
                    <div class="grandma-hair"></div>
                    <div class="grandma-face">
                        <div class="grandma-eyes">
                            <div class="grandma-eye left">
                                <div class="grandma-pupil"></div>
                            </div>
                            <div class="grandma-eye right">
                                <div class="grandma-pupil"></div>
                            </div>
                        </div>
                        <div class="grandma-eyebrows">
                            <div class="grandma-eyebrow left"></div>
                            <div class="grandma-eyebrow right"></div>
                        </div>
                        <div class="grandma-nose"></div>
                        <div class="grandma-mouth" id="grandmaMouth"></div>
                        <div class="grandma-glasses">
                            <div class="grandma-glass left"></div>
                            <div class="grandma-glass-bridge"></div>
                            <div class="grandma-glass right"></div>
                        </div>
                        <div class="grandma-wrinkles">
                            <div class="wrinkle w1"></div>
                            <div class="wrinkle w2"></div>
                            <div class="wrinkle w3"></div>
                        </div>
                    </div>
                    <div class="grandma-hair-bun"></div>
                </div>
                <div class="grandma-dress">
                    <div class="grandma-collar"></div>
                    <div class="grandma-embroidery"></div>
                </div>
                <div class="grandma-arms">
                    <div class="grandma-arm left"></div>
                    <div class="grandma-arm right"></div>
                </div>
            </div>
        </div>

        <!-- 步骤容器 -->
        <div class="steps-container" id="stepsContainer">
            <!-- 步骤1：欢迎页 -->
            <div class="step" id="step-welcome" data-step="0">
                <div class="step-content">
                    <h1 class="step-title">非遗绒花·指尖上的AI工作坊</h1>
                    <p class="step-description">绒花是中国的传统手工艺，已有上千年历史。今天，绒花奶奶将教你制作一朵属于自己的绒花。</p>
                    <button class="btn-primary" id="btnStart">开始制作</button>
                </div>
            </div>

            <!-- 步骤2：配色染色 -->
            <div class="step hidden" id="step-dyeing" data-step="1">
                <div class="step-header">
                    <h2 class="step-title">第一步：配色染色</h2>
                    <p class="step-hint">将蚕丝拖入染缸，选择你喜欢的颜色</p>
                </div>
                <div class="step-content dyeing-area">
                    <div class="silk-container">
                        <div class="silk" id="silk">
                            <div class="silk-strand"></div>
                            <div class="silk-strand"></div>
                            <div class="silk-strand"></div>
                        </div>
                        <div class="silk-label">蚕丝</div>
                    </div>
                    <div class="dye-pots">
                        <div class="dye-pot" data-color="#c8553d" data-name="朱砂红">
                            <div class="pot-liquid" style="background: #c8553d;"></div>
                            <div class="pot-label">朱砂红</div>
                        </div>
                        <div class="dye-pot" data-color="#2d5f5d" data-name="黛青">
                            <div class="pot-liquid" style="background: #2d5f5d;"></div>
                            <div class="pot-label">黛青</div>
                        </div>
                        <div class="dye-pot" data-color="#e8b84a" data-name="鹅黄">
                            <div class="pot-liquid" style="background: #e8b84a;"></div>
                            <div class="pot-label">鹅黄</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 步骤3：打尖造型 -->
            <div class="step hidden" id="step-shaping" data-step="2">
                <div class="step-header">
                    <h2 class="step-title">第二步：打尖造型</h2>
                    <p class="step-hint">选择绒毛形状，用剪刀修剪</p>
                </div>
                <div class="step-content shaping-area">
                    <div class="fur-container">
                        <div class="fur" id="fur"></div>
                    </div>
                    <div class="shape-options">
                        <div class="shape-option" data-shape="round">
                            <div class="shape-preview round"></div>
                            <div class="shape-label">圆形</div>
                        </div>
                        <div class="shape-option" data-shape="pointed">
                            <div class="shape-preview pointed"></div>
                            <div class="shape-label">尖形</div>
                        </div>
                        <div class="shape-option" data-shape="wavy">
                            <div class="shape-preview wavy"></div>
                            <div class="shape-label">波浪形</div>
                        </div>
                    </div>
                    <div class="scissors-container">
                        <div class="scissors" id="scissors">✂️</div>
                        <div class="scissors-label">剪刀</div>
                    </div>
                </div>
            </div>

            <!-- 步骤4：传花定型 -->
            <div class="step hidden" id="step-assembling" data-step="3">
                <div class="step-header">
                    <h2 class="step-title">第三步：传花定型</h2>
                    <p class="step-hint">将花瓣拖到花蕊周围，围成一圈</p>
                </div>
                <div class="step-content assembling-area">
                    <div class="flower-center">
                        <div class="pistil" id="pistil"></div>
                        <div class="petal-slots" id="petalSlots"></div>
                    </div>
                    <div class="petals-container" id="petalsContainer"></div>
                </div>
            </div>

            <!-- 步骤5：组合成花 -->
            <div class="step hidden" id="step-completing" data-step="4">
                <div class="step-header">
                    <h2 class="step-title">第四步：组合成花</h2>
                    <p class="step-hint">将花朵装到花枝上，添加叶子</p>
                </div>
                <div class="step-content completing-area">
                    <div class="flower-branch">
                        <div class="branch" id="branch"></div>
                        <div class="branch-drop-zone" id="flowerDropZone">
                            <div class="drop-hint">将花朵拖到这里</div>
                        </div>
                        <div class="leaves-drop-zone" id="leavesDropZone">
                            <div class="drop-hint">将叶子拖到这里</div>
                        </div>
                    </div>
                    <div class="assembly-items">
                        <div class="flower-head" id="flowerHead"></div>
                        <div class="leaf" id="leaf1">🍃</div>
                        <div class="leaf" id="leaf2">🍃</div>
                    </div>
                </div>
            </div>

            <!-- 步骤6：成品展示 -->
            <div class="step hidden" id="step-finished" data-step="5">
                <div class="step-content finished-area">
                    <h2 class="finished-title">恭喜你完成了一朵绒花！</h2>
                    <div class="finished-flower" id="finishedFlower"></div>
                    <div class="finished-actions">
                        <button class="btn-secondary" id="btnRestart">重新制作</button>
                        <button class="btn-primary" id="btnShare">分享作品</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 进度指示器 -->
        <div class="progress-indicator" id="progressIndicator">
            <div class="progress-step active" data-step="0">
                <div class="progress-dot"></div>
                <div class="progress-label">开始</div>
            </div>
            <div class="progress-line"></div>
            <div class="progress-step" data-step="1">
                <div class="progress-dot"></div>
                <div class="progress-label">染色</div>
            </div>
            <div class="progress-line"></div>
            <div class="progress-step" data-step="2">
                <div class="progress-dot"></div>
                <div class="progress-label">造型</div>
            </div>
            <div class="progress-line"></div>
            <div class="progress-step" data-step="3">
                <div class="progress-dot"></div>
                <div class="progress-label">定型</div>
            </div>
            <div class="progress-line"></div>
            <div class="progress-step" data-step="4">
                <div class="progress-dot"></div>
                <div class="progress-label">组合</div>
            </div>
            <div class="progress-line"></div>
            <div class="progress-step" data-step="5">
                <div class="progress-dot"></div>
                <div class="progress-label">完成</div>
            </div>
        </div>
    </div>

    <!-- interact.js 拖拽库（本地） -->
    <script src="js/interact.min.js"></script>
    <!-- 引入JavaScript模块 -->
    <script src="js/state.js"></script>
    <script src="js/voice.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/canvas.js"></script>
    <script src="js/drag.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
