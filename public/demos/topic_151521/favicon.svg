<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 背景圆形渐变 -->
  <circle cx="32" cy="32" r="30" fill="url(#grad1)" filter="url(#glow)" />

  <!-- 思想健身房核心：大脑轮廓代表健身房 -->
  <g transform="translate(12, 12)">
    <!-- 大脑形状 -->
    <path d="M5 20 C5 12 12 5 20 5 C28 5 40 12 40 20 C40 28 35 35 28 40 C22 45 10 38 5 30 C0 24 5 28 5 20 Z"
          fill="none"
          stroke="#ffffff"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round" />
    <!-- 闪电代表锻炼/辩论交锋 -->
    <path d="M20 5 L32 16 L26 18 L36 28 L30 30 L40 40"
          fill="none"
          stroke="#ffffff"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </g>
</svg>
