<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聚栖 AgentCove — 灵动岛 · 可体验 Demo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

  :root {
    /* Light editor palette — matches creative proposal HTML */
    --bg: #fbfaf7;
    --bg-elev: #ffffff;
    --bg-sunken: #f3f0e9;
    --ink: #1a1a1a;
    --ink-2: #4a4a4a;
    --ink-3: #8a8580;
    --rule: #e6e1d6;
    --rule-2: #d8d2c4;
    --accent: #c8501e;
    --accent-soft: #f4e8df;

    /* Island palette — V6Palette from source */
    --island-ink: #000000;
    --island-paper: #f1ead9;
    --paper-60: rgba(241, 234, 217, 0.6);
    --paper-46: rgba(241, 234, 217, 0.46);
    --paper-40: rgba(241, 234, 217, 0.4);
    --paper-20: rgba(241, 234, 217, 0.2);
    --paper-10: rgba(241, 234, 217, 0.1);
    --paper-08: rgba(241, 234, 217, 0.08);
    --paper-055: rgba(241, 234, 217, 0.055);
    --blue: #6ea7ff;
    --green: #6fb982;
    --red: #f25148;
    --pink: #f4a4a4;
    --amber: #f0a868;

    --diff-add-bg: rgba(45, 90, 61, 0.25);
    --diff-del-bg: rgba(90, 45, 45, 0.25);
    --diff-add-text: #7ee29c;
    --diff-del-text: #f4a4a4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', -apple-system, "PingFang SC", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  .serif { font-family: 'Newsreader', Georgia, serif; }
  .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }

  /* ============ Top menubar — simulated system bar ============ */
  .menubar {
    background: var(--bg);
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 100;
    border-bottom: 1px solid var(--rule);
  }
  .menubar .mb-left {
    position: absolute; left: 14px;
    display: flex; gap: 14px; align-items: center;
    font-size: 12px; font-weight: 600;
    color: var(--ink);
  }
  .menubar .mb-left .bold { font-weight: 700; }
  .menubar .mb-right {
    position: absolute; right: 14px;
    display: flex; gap: 10px; align-items: center;
    font-size: 11px;
    color: var(--ink-2);
    font-family: 'JetBrains Mono', monospace;
  }

  /* ============ Hero — the live island ============ */
  .stage {
    min-height: calc(100vh - 28px);
    display: grid;
    grid-template-rows: 1fr auto;
    padding: 0 28px 32px;
    position: relative;
  }

  .stage-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 0 24px;
    position: relative;
  }

  /* Hero copy */
  .hero-copy {
    text-align: center;
    margin-bottom: 36px;
    max-width: 720px;
  }
  .hero-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.06em;
    margin-bottom: 14px;
    text-transform: uppercase;
  }
  .hero-title {
    font-family: 'Newsreader', serif;
    font-size: clamp(32px, 4.2vw, 48px);
    font-weight: 500;
    line-height: 1.05;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin-bottom: 16px;
  }
  .hero-title em {
    font-style: italic;
    font-weight: 400;
    color: var(--accent);
  }
  .hero-sub {
    font-size: 15px;
    color: var(--ink-2);
    line-height: 1.55;
    max-width: 540px;
    margin: 0 auto;
  }

  /* ============ The Island ============ */
  .island-wrap {
    position: relative;
    width: 100%;
    max-width: 720px;
    display: flex;
    justify-content: center;
  }

  .island {
    background: var(--island-ink);
    overflow: hidden;
    transition: width 0.42s cubic-bezier(0.34, 1.56, 0.64, 1),
                height 0.42s cubic-bezier(0.34, 1.56, 0.64, 1),
                border-radius 0.42s ease;
    position: relative;
    cursor: pointer;
    box-shadow: 0 24px 70px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.04);
  }

  /* Compact state */
  .island.compact {
    width: 244px;
    height: 32px;
    border-radius: 0 0 16px 16px;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 0 12px;
  }
  .island.compact:hover { height: 34px; width: 250px; }

  /* Expanded state */
  .island.expanded {
    width: 630px;
    border-radius: 0 0 24px 24px;
  }

  /* ============ Compact content ============ */
  .compact-bars {
    display: flex; align-items: flex-end; gap: 2.5px; height: 13px;
    flex-shrink: 0;
  }
  .compact-bars span {
    width: 2.5px; border-radius: 2px;
    background: var(--island-paper);
  }
  .compact-bars.idle span:nth-child(1) { height: 3px; }
  .compact-bars.idle span:nth-child(2) { height: 5px; }
  .compact-bars.idle span:nth-child(3) { height: 3px; opacity: 0.46; }

  .compact-bars.running span { animation: bwave 0.9s ease-in-out infinite; }
  .compact-bars.running span:nth-child(1) { animation-delay: 0s; }
  .compact-bars.running span:nth-child(2) { animation-delay: 0.15s; }
  .compact-bars.running span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bwave {
    0%,100% { height: 4px; } 50% { height: 12px; }
  }

  .compact-bars.waiting span:nth-child(1) { height: 10px; animation: wpulse 1.8s ease-in-out 0s infinite; }
  .compact-bars.waiting span:nth-child(2) { height: 0; opacity: 0; }
  .compact-bars.waiting span:nth-child(3) { height: 10px; animation: wpulse 1.8s ease-in-out 0.9s infinite; }
  @keyframes wpulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }

  .compact-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; font-weight: 600;
    color: var(--island-paper);
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .compact-text.idle { color: var(--paper-46); }
  .compact-text.running { color: var(--blue); }
  .compact-text.waiting { color: var(--pink); }

  .compact-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; font-weight: 600;
    color: var(--paper-46);
    margin-left: auto;
  }

  /* ============ Expanded header ============ */
  .island-head {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 18px; height: 32px;
    border-bottom: 1px solid var(--paper-08);
  }
  .island-head .head-bars {
    display: flex; align-items: flex-end; gap: 2.5px; height: 13px;
  }
  .island-head .head-bars span {
    width: 2.5px; border-radius: 2px;
    background: var(--island-paper);
  }
  .island-head .head-bars.idle span:nth-child(1) { height: 3px; }
  .island-head .head-bars.idle span:nth-child(2) { height: 5px; }
  .island-head .head-bars.idle span:nth-child(3) { height: 3px; opacity: 0.46; }
  .island-head .head-bars.running span { animation: bwave 0.9s ease-in-out infinite; }
  .island-head .head-bars.running span:nth-child(1) { animation-delay: 0s; }
  .island-head .head-bars.running span:nth-child(2) { animation-delay: 0.15s; }
  .island-head .head-bars.running span:nth-child(3) { animation-delay: 0.3s; }
  .island-head .head-bars.waiting span:nth-child(1) { height: 10px; animation: wpulse 1.8s ease-in-out 0s infinite; }
  .island-head .head-bars.waiting span:nth-child(2) { height: 0; opacity: 0; }
  .island-head .head-bars.waiting span:nth-child(3) { height: 10px; animation: wpulse 1.8s ease-in-out 0.9s infinite; }

  .island-logo {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; font-weight: 700; letter-spacing: 0.8px;
    color: var(--paper-46);
  }
  .island-usage {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; font-weight: 500;
    color: var(--island-paper);
  }
  .island-spacer { flex: 1; }
  .island-btn {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--paper-055);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: var(--paper-60);
    cursor: pointer; border: none;
    font-family: inherit;
    transition: background 0.15s;
  }
  .island-btn:hover { background: rgba(241,234,217,0.12); }

  /* ============ Session list ============ */
  .session-list {
    max-height: 460px;
    overflow-y: auto;
    padding: 2px 0;
  }
  .session-list::-webkit-scrollbar { width: 0; }

  /* Permission card — approvalRow() */
  .perm-card {
    margin: 6px 10px; padding: 13px 18px;
    background: rgba(71, 20, 20, 0.72);
    border-left: 3px solid #f57566;
    animation: slideDown 0.3s ease;
  }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .perm-head {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 9px;
    font-family: 'JetBrains Mono', monospace; font-size: 9px;
    font-weight: 700; letter-spacing: 0.8px; color: var(--island-paper);
  }
  .perm-head .pdot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--island-paper);
    animation: pdot 1.5s ease-in-out infinite;
  }
  @keyframes pdot { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .perm-head .prov {
    margin-left: auto; color: var(--paper-46); font-weight: 400;
  }
  .perm-tool {
    font-size: 12px; font-weight: 500; margin-bottom: 9px;
    color: var(--island-paper);
    line-height: 1.4;
  }
  .diff-box {
    background: rgba(0,0,0,0.45); border-radius: 6px;
    padding: 8px 10px; margin-bottom: 10px;
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px;
    line-height: 1.55; overflow-x: auto;
  }
  .diff-box::-webkit-scrollbar { height: 4px; }
  .diff-box::-webkit-scrollbar-thumb { background: var(--paper-20); border-radius: 2px; }
  .diff-file { color: var(--paper-46); font-size: 9.5px; margin-bottom: 4px; }
  .diff-line { white-space: pre; padding: 0 4px; border-radius: 2px; }
  .diff-add { background: var(--diff-add-bg); color: var(--diff-add-text); }
  .diff-del { background: var(--diff-del-bg); color: var(--diff-del-text); }
  .diff-ctx { color: var(--paper-60); }
  .diff-stat { color: var(--paper-46); font-size: 9.5px; margin-top: 4px; }
  .perm-actions {
    display: flex; gap: 8px; justify-content: flex-end;
  }
  .perm-btn {
    padding: 0 12px; height: 27px; border-radius: 999px;
    font-size: 10.5px; font-weight: 600;
    cursor: pointer; border: none;
    font-family: -apple-system, sans-serif;
    transition: all 0.15s;
    display: flex; align-items: center;
  }
  .perm-btn.deny {
    background: var(--paper-08); color: var(--paper-60);
  }
  .perm-btn.deny:hover {
    background: rgba(242,81,72,0.15); color: var(--island-paper);
  }
  .perm-btn.allow {
    background: var(--island-paper); color: var(--island-ink);
  }
  .perm-btn.allow:hover { background: #fff; }
  .perm-btn .key {
    opacity: 0.45; margin-left: 5px; font-size: 9.5px;
    font-family: 'JetBrains Mono', monospace;
  }

  /* Ask card — askRow() */
  .ask-card {
    margin: 6px 10px; padding: 13px 18px;
    background: rgba(110,167,255,0.09);
    border-left: 3px solid var(--blue);
    animation: slideDown 0.3s ease;
  }
  .ask-head {
    font-family: 'JetBrains Mono', monospace; font-size: 9px;
    font-weight: 700; letter-spacing: 0.8px; color: var(--blue);
    margin-bottom: 8px; display: flex; align-items: center; gap: 8px;
  }
  .ask-head .adot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--blue);
    animation: pdot 1.5s ease-in-out infinite;
  }
  .ask-head .prov { margin-left: auto; color: var(--paper-46); font-weight: 400; }
  .ask-q { font-size: 12px; margin-bottom: 9px; color: var(--island-paper); line-height: 1.4; }
  .ask-opts { display: flex; flex-direction: column; gap: 4px; }
  .ask-opt {
    padding: 7px 11px; border-radius: 6px;
    background: var(--paper-08);
    font-size: 11px; cursor: pointer;
    display: flex; align-items: center; gap: 9px;
    transition: background 0.15s; color: var(--island-paper);
    border: none; text-align: left;
    font-family: inherit;
  }
  .ask-opt:hover { background: rgba(110,167,255,0.15); }
  .ask-opt .key {
    font-family: 'JetBrains Mono', monospace; font-size: 9px;
    color: var(--paper-46); background: rgba(0,0,0,0.35);
    padding: 1px 5px; border-radius: 3px;
  }

  /* Session row — sessionRow() */
  .session {
    display: flex; align-items: flex-start; gap: 11px;
    padding: 11px 18px; cursor: pointer;
    position: relative;
    transition: background 0.12s;
  }
  .session::after {
    content: ''; position: absolute;
    bottom: 0; left: 50px; right: 0; height: 1px;
    background: var(--paper-08);
  }
  .session:last-child::after { display: none; }
  .session:hover { background: rgba(241,234,217,0.03); }
  .session.selected { background: rgba(241,234,217,0.05); }

  .s-dot {
    width: 24px; height: 24px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
  }
  .s-dot i {
    width: 6px; height: 6px; border-radius: 50%; display: block;
  }
  .s-dot.working { background: rgba(110,167,255,0.14); }
  .s-dot.working i { background: var(--blue); animation: sblink 1.4s infinite; }
  .s-dot.waiting { background: rgba(244,164,164,0.14); }
  .s-dot.waiting i { background: var(--pink); animation: spulse 1s infinite; }
  .s-dot.done { background: rgba(111,185,130,0.14); }
  .s-dot.done i { background: var(--green); }
  .s-dot.failed { background: rgba(242,81,72,0.14); }
  .s-dot.failed i { background: var(--red); }
  @keyframes sblink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  @keyframes spulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.4); } }

  .s-body { flex: 1; min-width: 0; }
  .s-row1 {
    display: flex; align-items: center; gap: 7px; margin-bottom: 4px;
  }
  .s-title {
    font-size: 12px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: var(--island-paper);
  }
  .s-prov {
    font-family: 'JetBrains Mono', monospace; font-size: 8px; font-weight: 700;
    letter-spacing: 0.7px; color: var(--paper-46); text-transform: uppercase;
    flex-shrink: 0;
  }
  .s-term {
    font-family: 'JetBrains Mono', monospace; font-size: 8px;
    color: var(--paper-46); flex-shrink: 0;
  }
  .s-status {
    font-family: 'JetBrains Mono', monospace; font-size: 9.5px;
    margin-left: auto; flex-shrink: 0;
  }
  .s-status.running { color: var(--blue); }
  .s-status.waiting { color: var(--pink); }
  .s-status.done { color: var(--green); }
  .s-status.failed { color: var(--red); }

  .s-detail {
    font-size: 10.5px; color: var(--paper-60);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .s-detail .done-link { color: var(--green); cursor: pointer; }

  /* Empty state */
  .empty-state {
    padding: 36px 20px; text-align: center;
    color: var(--paper-46);
  }
  .empty-state .es-bars {
    display: flex; gap: 2.5px; height: 16px;
    justify-content: center; margin-bottom: 10px;
  }
  .empty-state .es-bars span {
    width: 2.5px; border-radius: 2px; background: var(--paper-20);
  }
  .empty-state .es-bars span:nth-child(1) { height: 5px; }
  .empty-state .es-bars span:nth-child(2) { height: 7px; }
  .empty-state .es-bars span:nth-child(3) { height: 5px; }
  .empty-state .t {
    font-family: 'JetBrains Mono', monospace; font-size: 9px;
    font-weight: 700; letter-spacing: 0.8px; margin-bottom: 3px;
    color: var(--paper-60);
  }
  .empty-state .d { font-size: 10.5px; color: var(--paper-46); }

  /* ============ Activity pulse — signature element ============ */
  .pulse-strip {
    width: 100%;
    max-width: 720px;
    margin-top: 28px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 8px;
  }
  .pulse-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-3);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .pulse-bars {
    flex: 1;
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 28px;
  }
  .pulse-bars span {
    flex: 1;
    background: var(--accent);
    border-radius: 1px;
    transition: height 0.4s ease, opacity 0.4s ease;
    min-height: 2px;
    opacity: 0.7;
  }
  .pulse-stat {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink);
    font-weight: 600;
    flex-shrink: 0;
  }
  .pulse-stat em {
    font-style: normal;
    color: var(--accent);
  }

  /* ============ Control panel ============ */
  .controls {
    display: flex;
    gap: 10px;
    margin-top: 28px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .ctrl-btn {
    background: var(--bg-elev);
    border: 1px solid var(--rule-2);
    border-radius: 8px;
    padding: 10px 16px;
    color: var(--ink);
    font-size: 13px; font-weight: 500;
    cursor: pointer; font-family: inherit;
    transition: all 0.15s;
    display: flex; align-items: center; gap: 8px;
  }
  .ctrl-btn:hover {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }
  .ctrl-btn.primary {
    background: var(--accent); color: #fff;
    border-color: var(--accent);
  }
  .ctrl-btn.primary:hover {
    background: #b3461a;
    color: #fff;
  }
  .ctrl-btn .ic {
    font-size: 14px; font-weight: 600;
    font-family: 'JetBrains Mono', monospace;
  }
  .ctrl-btn .kbd {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-3);
    background: var(--bg-sunken);
    padding: 1px 5px;
    border-radius: 3px;
    margin-left: 4px;
  }
  .ctrl-btn.primary .kbd {
    color: rgba(255,255,255,0.7);
    background: rgba(0,0,0,0.15);
  }

  /* ============ Footer hint ============ */
  .stage-foot {
    margin-top: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 0 0;
    border-top: 1px solid var(--rule);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-3);
  }
  .stage-foot .kbd-group {
    display: flex; gap: 14px;
  }
  .stage-foot .kbd-group span {
    display: flex; align-items: center; gap: 5px;
  }
  .stage-foot .kbd {
    background: var(--bg-sunken);
    color: var(--ink-2);
    padding: 2px 6px;
    border-radius: 3px;
    border: 1px solid var(--rule);
  }
  .stage-foot .credit {
    color: var(--ink-3);
  }
  .stage-foot .credit em {
    color: var(--accent);
    font-style: normal;
  }

  /* ============ Toast ============ */
  .toast {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.92);
    background: var(--ink);
    color: #fff;
    border-radius: 10px;
    padding: 14px 22px;
    font-size: 13px; font-weight: 500;
    opacity: 0; pointer-events: none;
    transition: all 0.25s ease;
    z-index: 500;
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }
  .toast.show {
    opacity: 1; transform: translate(-50%, -50%) scale(1);
  }
  .toast .ti {
    font-size: 16px;
    color: var(--accent);
    font-weight: 600;
  }

  @media (max-width: 768px) {
    .stage { padding: 0 16px 24px; }
    .island.expanded { width: calc(100vw - 24px); max-width: 630px; }
    .pulse-strip { flex-wrap: wrap; }
    .stage-foot { flex-direction: column; gap: 10px; }
    .stage-foot .kbd-group { flex-wrap: wrap; justify-content: center; }
  }
</style>
</head>
<body>

<!-- Top menubar -->
<div class="menubar">
  <div class="mb-left">
    <span class="bold">聚栖</span>
    <span>File</span>
    <span>Edit</span>
    <span>View</span>
    <span>Window</span>
    <span>Help</span>
  </div>
  <div class="mb-right">
    <span>🔋 87%</span>
    <span>📶</span>
    <span>🔍</span>
    <span id="clock">Thu 11:10 AM</span>
  </div>
</div>

<!-- Stage -->
<div class="stage">
  <div class="stage-center">
    <div class="hero-copy">
      <div class="hero-eyebrow">§ Live Demo — 灵动岛 · 可体验</div>
      <h1 class="hero-title">让多智能体工作流<em>一眼可见</em>。</h1>
      <p class="hero-sub">点击下方的岛展开，体验权限审批、智能体问答、多会话管理。这是真实产品的浏览器模拟版。</p>
    </div>

    <!-- The Island -->
    <div class="island-wrap">
      <div class="island compact" id="island" onclick="toggleIsland(event)"></div>
    </div>

    <!-- Activity pulse — signature element -->
    <div class="pulse-strip">
      <span class="pulse-label">Activity</span>
      <div class="pulse-bars" id="pulseBars"></div>
      <span class="pulse-stat"><em id="pulseActive">3</em> / <span id="pulseTotal">3</span> active</span>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn primary" onclick="triggerPermission(event)">
        <span class="ic">⚠</span> 触发权限请求 <span class="kbd">P</span>
      </button>
      <button class="ctrl-btn" onclick="triggerAsk(event)">
        <span class="ic">?</span> 触发智能体提问 <span class="kbd">Q</span>
      </button>
      <button class="ctrl-btn" onclick="addSession(event)">
        <span class="ic">+</span> 添加会话 <span class="kbd">A</span>
      </button>
      <button class="ctrl-btn" onclick="resetDemo(event)">
        <span class="ic">↻</span> 重置 <span class="kbd">R</span>
      </button>
    </div>
  </div>

  <!-- Footer hint -->
  <div class="stage-foot">
    <div class="kbd-group">
      <span><span class="kbd">Space</span> 展开/收起</span>
      <span><span class="kbd">Esc</span> 收起</span>
      <span><span class="kbd">⌘Y</span> 批准</span>
      <span><span class="kbd">⌘N</span> 拒绝</span>
      <span><span class="kbd">⌘1-9</span> 选择回答</span>
    </div>
    <div class="credit">聚栖 AgentCove · <em>TRAE AI 创造力大赛 2026</em> · 学习工作赛道</div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  <span class="ti" id="toastIcon">✓</span>
  <span id="toastMsg">Done</span>
</div>

<script>
// ===== State =====
let isExpanded = false;
let sessions = [];
let selectedId = null;
let counter = 0;

const provs = ['claude', 'codex', 'gemini', 'cursor', 'zcode', 'qwen', 'kimi', 'deepseek'];
const provLabels = { claude:'Claude', codex:'Codex', gemini:'Gemini', cursor:'Cursor', zcode:'ZCode', qwen:'Qwen', kimi:'Kimi', deepseek:'DeepSeek' };
const terminals = ['iTerm2', 'Terminal', 'Ghostty', 'Warp', 'WezTerm', 'Kitty'];
const projects = ['fix-auth-bug', 'backend-server', 'optimize-queries', 'frontend-app', 'ml-pipeline', 'cli-tool', 'docs-site', 'api-gateway'];

const toolTemplates = {
  claude: [
    { tool:'Read', arg:'src/auth/middleware.ts', result:'2.4 KB' },
    { tool:'Search', arg:'6 patterns in src/', result:'12 matches' },
    { tool:'Grep', arg:'"token" --type ts', result:'8 results' },
    { tool:'Edit', arg:'src/auth/middleware.ts', result:'Updated (+3 −1)' },
    { tool:'Write', arg:'src/auth/utils.ts', result:'New file (24 lines)' },
    { tool:'Bash', arg:'npm test -- --grep auth', result:'5 passed' },
  ],
  codex: [
    { tool:'Write', arg:'src/routes/users.ts', result:'New file (47 lines)' },
    { tool:'Write', arg:'src/routes/auth.ts', result:'New file (32 lines)' },
    { tool:'Bash', arg:'npm test', result:'3 passed' },
    { tool:'Edit', arg:'src/db/schema.ts', result:'Updated (+8 −2)' },
    { tool:'Read', arg:'src/index.ts', result:'3.1 KB' },
  ],
  gemini: [
    { tool:'Read', arg:'schema.prisma', result:'1.2 KB' },
    { tool:'Edit', arg:'src/db/queries.ts', result:'Updated (+8 −23)' },
    { tool:'Bash', arg:'npx prisma validate', result:'Schema valid' },
    { tool:'Write', arg:'src/db/optimized.ts', result:'New file (18 lines)' },
  ],
  cursor: [
    { tool:'Edit', arg:'src/App.tsx', result:'Updated (+12 −4)' },
    { tool:'Read', arg:'src/components/Login.tsx', result:'2.1 KB' },
    { tool:'Bash', arg:'tsc --noEmit', result:'0 errors' },
  ],
  zcode: [
    { tool:'Read', arg:'zcode-session.json', result:'0.4 KB' },
    { tool:'Write', arg:'.zcode/hooks.json', result:'New file (15 lines)' },
    { tool:'Bash', arg:'zcode --version', result:'1.2.0' },
  ],
  qwen: [
    { tool:'Edit', arg:'src/api/qwen.ts', result:'Updated (+5 −1)' },
    { tool:'Read', arg:'src/config.ts', result:'0.9 KB' },
  ],
  kimi: [
    { tool:'Write', arg:'src/kimi/client.ts', result:'New file (28 lines)' },
    { tool:'Bash', arg:'kimi --check', result:'OK' },
  ],
  deepseek: [
    { tool:'Read', arg:'src/model/ds.ts', result:'1.5 KB' },
    { tool:'Edit', arg:'src/infer.ts', result:'Updated (+3 −0)' },
  ],
};

const permTemplates = [
  { tool:'Edit', file:'src/auth/middleware.ts', diff:[
    { ctx:'12  const verify = (token) =>' },
    { del:'13-   jwt.verify(token);' },
    { add:"13+   if (!token) throw new" },
    { add:"14+   AuthError('missing');" },
    { add:'15+   return jwt.verify(token);' },
  ], stat:'+3 −1' },
  { tool:'Bash', file:'rm -rf node_modules && npm install', diff:[
    { ctx:'# Running shell command' },
    { del:'- rm -rf node_modules' },
    { add:'+ npm install --verbose' },
  ], stat:'shell' },
  { tool:'Write', file:'src/routes/users.ts (47 lines)', diff:[
    { ctx:'# Creating new file' },
    { add:"+ import { Router } from 'express';" },
    { add:"+ const router = Router();" },
    { add:'+ router.get("/users", ...);' },
    { add:'+ export default router;' },
  ], stat:'new file' },
  { tool:'Bash', file:'git push origin main', diff:[
    { ctx:'# Git operation' },
    { del:'- git push origin main (forced)' },
  ], stat:'git' },
  { tool:'Edit', file:'package.json — update dependencies', diff:[
    { ctx:'  "dependencies": {' },
    { del:'-   "express": "4.18.0",' },
    { add:'+   "express": "4.19.0",' },
    { del:'-   "prisma": "5.1.0"' },
    { add:'+   "prisma": "5.8.0"' },
  ], stat:'+2 −2' },
];

const askTemplates = [
  { q:'Which deployment target?', opts:['Production', 'Staging', 'Local only'] },
  { q:'Which database should I use?', opts:['PostgreSQL', 'MySQL', 'SQLite', 'MongoDB'] },
  { q:'Should I add tests for this?', opts:['Yes, full coverage', 'Yes, basic only', 'No, skip tests'] },
  { q:'Which styling approach?', opts:['Tailwind CSS', 'CSS Modules', 'styled-components'] },
  { q:'Found 3 similar bugs. Fix all?', opts:['Fix all 3', 'Fix the first one', 'Show me the list'] },
];

// ===== Init =====
function init() {
  sessions = [
    makeSession('claude', 'fix-auth-bug', 'iTerm2'),
    makeSession('codex', 'backend-server', 'Terminal'),
    makeSession('gemini', 'optimize-queries', 'Ghostty'),
  ];
  selectedId = sessions[0].id;
  render();
  startSim();
  startPulse();
}

function makeSession(prov, project, term) {
  counter++;
  const tools = toolTemplates[prov] || toolTemplates.claude;
  return {
    id: 's' + counter,
    prov, project, term,
    status: 'working',
    toolIdx: 0,
    tools: [...tools],
    pendingPerm: null,
    pendingAsk: null,
    elapsed: Math.floor(Math.random() * 50) + 5,
  };
}

// ===== Render =====
function render() {
  const island = document.getElementById('island');
  const active = sessions.filter(s => s.status === 'working' || s.status === 'waiting');
  const hasWaiting = sessions.some(s => s.status === 'waiting');

  if (!isExpanded) {
    island.className = 'island compact';
    let barsClass = 'idle';
    let text = 'Ready';
    let textClass = 'idle';

    if (hasWaiting) {
      barsClass = 'waiting';
      text = 'Approval';
      textClass = 'waiting';
    } else if (active.length > 0) {
      barsClass = 'running';
      text = active.length + ' running';
      textClass = 'running';
    }

    island.innerHTML = `
      <div class="compact-bars ${barsClass}">
        <span></span><span></span><span></span>
      </div>
      <span class="compact-text ${textClass}">${text}</span>
      ${sessions.length > 1 ? `<span class="compact-count">×${sessions.length}</span>` : ''}
    `;
  } else {
    island.className = 'island expanded';
    const barsClass = hasWaiting ? 'waiting' : (active.length > 0 ? 'running' : 'idle');

    let html = `
      <div class="island-head">
        <div class="head-bars ${barsClass}">
          <span></span><span></span><span></span>
        </div>
        <span class="island-logo">聚栖 AGENTCOVE</span>
        <span class="island-usage">Claude 42% · Codex 18%</span>
        <span class="island-spacer"></span>
        <button class="island-btn" onclick="event.stopPropagation();showToast('🔊','Sound toggled')">🔊</button>
        <button class="island-btn" onclick="event.stopPropagation();showToast('⚙','Settings (demo)')">⚙</button>
      </div>
      <div class="session-list">
    `;

    // Permission cards
    for (const s of sessions.filter(s => s.pendingPerm)) {
      const p = s.pendingPerm;
      let diffHtml = '';
      for (const line of p.diff) {
        if (line.ctx) diffHtml += `<div class="diff-line diff-ctx">${esc(line.ctx)}</div>`;
        if (line.del) diffHtml += `<div class="diff-line diff-del">${esc(line.del)}</div>`;
        if (line.add) diffHtml += `<div class="diff-line diff-add">${esc(line.add)}</div>`;
      }
      html += `
        <div class="perm-card">
          <div class="perm-head">
            <span class="pdot"></span> PERMISSION REQUIRED
            <span class="prov">${provLabels[s.prov].toUpperCase()} · ${s.term}</span>
          </div>
          <div class="perm-tool">${p.tool} — ${p.file}</div>
          <div class="diff-box">
            <div class="diff-file">${p.file}</div>
            ${diffHtml}
            <div class="diff-stat">${p.stat}</div>
          </div>
          <div class="perm-actions">
            <button class="perm-btn deny" onclick="event.stopPropagation();resolvePerm('${s.id}','deny')">Deny<span class="key">⌘N</span></button>
            <button class="perm-btn allow" onclick="event.stopPropagation();resolvePerm('${s.id}','allow')">Allow<span class="key">⌘Y</span></button>
          </div>
        </div>
      `;
    }

    // Ask cards
    for (const s of sessions.filter(s => s.pendingAsk)) {
      const a = s.pendingAsk;
      let optsHtml = '';
      a.opts.forEach((opt, i) => {
        optsHtml += `<button class="ask-opt" onclick="event.stopPropagation();resolveAsk('${s.id}',${i})"><span class="key">⌘${i+1}</span>${esc(opt)}</button>`;
      });
      html += `
        <div class="ask-card">
          <div class="ask-head">
            <span class="adot"></span> ${provLabels[s.prov].toUpperCase()} ASKS
            <span class="prov">${s.term}</span>
          </div>
          <div class="ask-q">${esc(a.q)}</div>
          <div class="ask-opts">${optsHtml}</div>
        </div>
      `;
    }

    // Session rows
    if (sessions.length === 0) {
      html += `
        <div class="empty-state">
          <div class="es-bars"><span></span><span></span><span></span></div>
          <div class="t">NO ACTIVE SESSIONS</div>
          <div class="d">Start an agent to see it here</div>
        </div>
      `;
    } else {
      for (const s of sessions) {
        const statusLabel = { working:'RUNNING', waiting:'WAITING', done:'DONE', failed:'FAILED', idle:'IDLE' }[s.status];
        const cur = s.tools[s.toolIdx % s.tools.length];

        let detail = '';
        if (s.status === 'done') {
          detail = '<span class="done-link">✓ Done — click to jump</span>';
        } else if (s.status === 'waiting' && s.pendingPerm) {
          detail = `Waiting: ${s.pendingPerm.tool} — ${s.pendingPerm.file.substring(0, 40)}`;
        } else if (s.status === 'waiting' && s.pendingAsk) {
          detail = `Question: ${s.pendingAsk.q}`;
        } else if (cur) {
          detail = `${cur.tool}(${cur.arg}) · ${cur.result}`;
        }

        const timeStr = s.elapsed < 60 ? s.elapsed + 'm' : Math.floor(s.elapsed/60) + 'h';
        const dotClass = s.status === 'waiting' ? 'waiting' : s.status;

        html += `
          <div class="session ${selectedId===s.id?'selected':''}" onclick="event.stopPropagation();selectSession('${s.id}')">
            <div class="s-dot ${dotClass}"><i></i></div>
            <div class="s-body">
              <div class="s-row1">
                <span class="s-title">${s.project}</span>
                <span class="s-prov">${provLabels[s.prov]}</span>
                <span class="s-term">${s.term}</span>
                <span class="s-status ${s.status==='waiting'?'waiting':s.status==='working'?'running':s.status}">${timeStr}</span>
              </div>
              <div class="s-detail">${detail}</div>
            </div>
          </div>
        `;
      }
    }

    html += '</div>';
    island.innerHTML = html;
  }

  updatePulseStat();
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ===== Activity pulse — signature element =====
function updatePulseStat() {
  const active = sessions.filter(s => s.status === 'working' || s.status === 'waiting').length;
  document.getElementById('pulseActive').textContent = active;
  document.getElementById('pulseTotal').textContent = sessions.length;
}

function startPulse() {
  const bars = document.getElementById('pulseBars');
  // 32 bars
  for (let i = 0; i < 32; i++) {
    const s = document.createElement('span');
    s.style.height = '4px';
    bars.appendChild(s);
  }
  updatePulseBars();
  setInterval(updatePulseBars, 600);
}

function updatePulseBars() {
  const bars = document.querySelectorAll('.pulse-bars span');
  const active = sessions.filter(s => s.status === 'working' || s.status === 'waiting').length;
  const intensity = active === 0 ? 0.15 : Math.min(1, active / 5);
  bars.forEach((b, i) => {
    if (Math.random() < intensity) {
      const h = 6 + Math.random() * 22 * intensity;
      b.style.height = h + 'px';
      b.style.opacity = 0.6 + Math.random() * 0.4;
    } else {
      b.style.height = '3px';
      b.style.opacity = 0.3;
    }
  });
}

// ===== Interactions =====
function toggleIsland(e) {
  if (e) e.stopPropagation();
  isExpanded = !isExpanded;
  render();
}

function selectSession(id) {
  selectedId = id;
  const s = sessions.find(x => x.id === id);
  if (s && s.status === 'done') {
    showToast('↗', `Jumping to ${s.term} — ${s.project}`);
  }
  render();
}

function resolvePerm(sid, decision) {
  const s = sessions.find(x => x.id === sid);
  if (!s) return;
  s.pendingPerm = null;
  if (decision === 'allow') {
    s.status = 'working';
    s.toolIdx++;
    showToast('✓', `Allowed — ${provLabels[s.prov]} continues`);
  } else {
    s.status = 'idle';
    showToast('✕', `Denied — ${provLabels[s.prov]} stopped`);
  }
  render();
}

function resolveAsk(sid, optIdx) {
  const s = sessions.find(x => x.id === sid);
  if (!s || !s.pendingAsk) return;
  const answer = s.pendingAsk.opts[optIdx];
  s.pendingAsk = null;
  s.status = 'working';
  s.toolIdx++;
  showToast('✓', `Answered: "${answer}"`);
  render();
}

function triggerPermission(e) {
  if (e) e.stopPropagation();
  const working = sessions.filter(s => s.status === 'working');
  if (working.length === 0) {
    showToast('⚠', 'No working agents');
    return;
  }
  const s = working[Math.floor(Math.random() * working.length)];
  s.pendingPerm = permTemplates[Math.floor(Math.random() * permTemplates.length)];
  s.status = 'waiting';
  if (!isExpanded) isExpanded = true;
  showToast('⚠', `${provLabels[s.prov]} needs permission`);
  render();
}

function triggerAsk(e) {
  if (e) e.stopPropagation();
  const working = sessions.filter(s => s.status === 'working');
  if (working.length === 0) {
    showToast('⚠', 'No working agents');
    return;
  }
  const s = working[Math.floor(Math.random() * working.length)];
  s.pendingAsk = askTemplates[Math.floor(Math.random() * askTemplates.length)];
  s.status = 'waiting';
  if (!isExpanded) isExpanded = true;
  showToast('?', `${provLabels[s.prov]} asks a question`);
  render();
}

function addSession(e) {
  if (e) e.stopPropagation();
  if (sessions.length >= 10) {
    showToast('⚠', 'Max 10 sessions');
    return;
  }
  const usedProj = sessions.map(s => s.project);
  const availProj = projects.filter(p => !usedProj.includes(p));
  const proj = availProj.length > 0 ? availProj[0] : 'project-' + (sessions.length + 1);

  const counts = {};
  provs.forEach(p => counts[p] = 0);
  sessions.forEach(s => counts[s.prov]++);
  const prov = provs.sort((a,b) => counts[a] - counts[b])[0];
  const term = terminals[Math.floor(Math.random() * terminals.length)];

  sessions.push(makeSession(prov, proj, term));
  if (!isExpanded) isExpanded = true;
  showToast('+', `Added ${provLabels[prov]} — ${proj}`);
  render();
}

function resetDemo(e) {
  if (e) e.stopPropagation();
  sessions = [];
  counter = 0;
  selectedId = null;
  isExpanded = false;
  init();
  showToast('↻', 'Demo reset');
}

// ===== Toast =====
let toastTimer = null;
function showToast(icon, msg) {
  const t = document.getElementById('toast');
  document.getElementById('toastIcon').textContent = icon;
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

// ===== Simulation =====
let simTimer = null;
function startSim() {
  if (simTimer) clearInterval(simTimer);
  simTimer = setInterval(() => {
    for (const s of sessions) {
      s.elapsed++;
      if (s.status === 'working') {
        if (Math.random() < 0.35) s.toolIdx = (s.toolIdx + 1) % s.tools.length;
        if (Math.random() < 0.04) {
          s.status = 'done';
        }
        if (Math.random() < 0.06 && !s.pendingPerm) {
          s.pendingPerm = permTemplates[Math.floor(Math.random() * permTemplates.length)];
          s.status = 'waiting';
        }
      } else if (s.status === 'done') {
        if (Math.random() < 0.12) {
          s.status = 'working';
          s.toolIdx = 0;
          s.elapsed = 1;
        }
      }
    }
    render();
  }, 2800);
}

// ===== Keyboard =====
document.addEventListener('keydown', (e) => {
  if (e.target.matches('input,textarea')) return;

  if (e.key === 'Escape' && isExpanded) {
    e.preventDefault();
    isExpanded = false; render();
  }
  if (e.key === ' ' && !e.metaKey && !e.ctrlKey) {
    e.preventDefault();
    isExpanded = !isExpanded; render();
  }

  // ⌘Y / ⌘N for approval
  if ((e.metaKey || e.ctrlKey) && (e.key === 'y' || e.key === 'Y')) {
    e.preventDefault();
    const waiting = sessions.find(s => s.pendingPerm);
    if (waiting) resolvePerm(waiting.id, 'allow');
  }
  if ((e.metaKey || e.ctrlKey) && (e.key === 'n' || e.key === 'N')) {
    e.preventDefault();
    const waiting = sessions.find(s => s.pendingPerm);
    if (waiting) resolvePerm(waiting.id, 'deny');
  }
  // ⌘1-9 for ask options
  if ((e.metaKey || e.ctrlKey) && e.key >= '1' && e.key <= '9') {
    e.preventDefault();
    const asking = sessions.find(s => s.pendingAsk);
    if (asking) {
      const idx = parseInt(e.key) - 1;
      if (idx < asking.pendingAsk.opts.length) resolveAsk(asking.id, idx);
    }
  }

  // Single-key shortcuts (no modifier)
  if (!e.metaKey && !e.ctrlKey && !e.altKey) {
    if (e.key === 'p' || e.key === 'P') { e.preventDefault(); triggerPermission(); }
    if (e.key === 'q' || e.key === 'Q') { e.preventDefault(); triggerAsk(); }
    if (e.key === 'a' || e.key === 'A') { e.preventDefault(); addSession(); }
    if (e.key === 'r' || e.key === 'R') { e.preventDefault(); resetDemo(); }
  }
});

// Click outside to close
document.addEventListener('click', (e) => {
  const island = document.getElementById('island');
  if (isExpanded && !island.contains(e.target) && !e.target.closest('.ctrl-btn')) {
    isExpanded = false; render();
  }
});

// Clock
function updateClock() {
  const now = new Date();
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const h = now.getHours();
  const m = now.getMinutes().toString().padStart(2,'0');
  const ampm = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 || 12;
  document.getElementById('clock').textContent = `${days[now.getDay()]} ${h12}:${m} ${ampm}`;
}
updateClock();
setInterval(updateClock, 30000);

// Start
init();
</script>

</body>
</html>
