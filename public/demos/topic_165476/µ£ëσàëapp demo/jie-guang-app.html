<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#FFFBF5">
  <title>有光 - 视障生活辅助 App Demo</title>
  <style>
    :root{
      --primary:#E88A2C;
      --primary-light:#F5B85A;
      --primary-soft:#FFF4E5;
      --blue:#2563EB;
      --green:#059669;
      --purple:#7C3AED;
      --red:#D92D20;
      --ink:#2A2118;
      --muted:#7D6F5F;
      --line:#F2E6D6;
      --glass:rgba(255,255,255,.82);
      --white:#fff;
      --bg:#FFFBF5;
      --bg-warm:#FFF6E8;
      --radius:8px;
      --nav-h:88px;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;background:#F2E6D6;color:var(--ink)}
    button,input,select{font:inherit;color:inherit}
    button{border:0;background:none;cursor:pointer}
    button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid rgba(232,138,44,.45);outline-offset:2px}
    svg{width:28px;height:28px;display:block}
    #app{width:100%;max-width:430px;min-height:100%;margin:0 auto;position:relative;overflow:hidden;background:var(--bg);box-shadow:0 0 0 1px rgba(0,0,0,.06)}

    .camera-shell{min-height:100vh;position:relative;color:#fff;background:#0B1020;overflow:hidden}
    .video-feed{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;z-index:2}
    .video-feed.active{display:block}
    .topbar{position:absolute;top:0;left:0;right:0;height:92px;display:flex;align-items:center;justify-content:space-between;padding:28px 20px 14px;z-index:5}
    .brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:850;text-shadow:0 2px 12px rgba(0,0,0,.4)}
    .round-btn{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.62);color:#fff;backdrop-filter:blur(12px)}
    .sound-btn{position:absolute;right:22px;top:188px;width:76px;height:76px;border-radius:50%;background:#050505;color:#F5B85A;display:flex;align-items:center;justify-content:center;z-index:4;box-shadow:0 10px 30px rgba(0,0,0,.32)}
    .mode-chip{position:absolute;top:96px;left:20px;z-index:4;background:rgba(0,0,0,.56);backdrop-filter:blur(12px);border-radius:999px;padding:9px 13px;font-weight:800;font-size:16px}
    .mode-chip b{color:#F5B85A}

    .result-card{position:absolute;left:0;right:0;bottom:var(--nav-h);background:linear-gradient(180deg,rgba(44,44,44,.83),rgba(30,30,30,.92));backdrop-filter:blur(18px);border-radius:16px 16px 0 0;padding:26px 24px 22px;z-index:6;box-shadow:0 -12px 40px rgba(0,0,0,.35)}
    .result-card.compact{padding:18px 20px}
    .close{position:absolute;right:18px;top:16px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.82);color:#111;font-size:30px;line-height:1}
    .result-title{font-size:16px;font-weight:850;color:#F5D0A0;margin-bottom:12px}
    .result-text{font-size:24px;line-height:1.45;letter-spacing:0;color:#fff;padding-right:34px;max-height:48vh;overflow:auto}
    .result-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
    .primary-pill,.ghost-pill{height:64px;border-radius:18px;font-size:22px;font-weight:850}
    .followup-wrap{display:flex;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.15)}
    .followup-wrap input{flex:1;height:52px;border-radius:12px;border:0;padding:0 14px;background:rgba(255,255,255,.12);color:#fff;font-size:16px}
    .followup-wrap input::placeholder{color:rgba(255,255,255,.6)}
    .followup-wrap button{width:52px;height:52px;border-radius:50%;background:#fff;color:var(--primary);display:flex;align-items:center;justify-content:center}
    .primary-pill{background:var(--primary);color:#fff}
    .ghost-pill{background:rgba(255,255,255,.08);color:#fff;border:2px solid rgba(255,255,255,.82)}
    .bottom-nav{position:absolute;left:0;right:0;bottom:0;height:var(--nav-h);z-index:8;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
    .bottom-nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:16px;font-weight:700;padding:8px 2px;position:relative}
    .bottom-nav button.active{color:var(--primary)}
    .bottom-nav button.active::after{content:"";position:absolute;top:-1px;left:20%;right:20%;height:3px;background:var(--primary);border-radius:0 0 4px 4px}
    .bottom-nav svg{width:24px;height:24px}
    .page-enter{animation:slideIn .25s ease-out}
    @keyframes slideIn{from{opacity:.6;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}
    .page-back{animation:slideBack .22s ease-out}
    @keyframes slideBack{from{opacity:.6;transform:translateX(-18px)}to{opacity:1;transform:translateX(0)}}
    .home-shell{min-height:100vh;background:#0B0B0F;color:#fff;display:flex;flex-direction:column;position:relative;overflow:hidden;padding-bottom:calc(var(--nav-h) + 12px)}
    .home-shell::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% -10%,rgba(232,138,44,.18),transparent 45%),radial-gradient(circle at 80% 20%,rgba(217,45,32,.12),transparent 35%);pointer-events:none}
    .home-topbar{position:relative;z-index:1;display:flex;align-items:flex-start;justify-content:space-between;padding:52px 20px 18px}
    .home-brand{display:flex;align-items:center;gap:12px}
    .home-logo-wrap{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;color:#E88A2C;flex-shrink:0}
    .home-logo-wrap svg{width:26px;height:26px}
    .home-brand-text{display:flex;flex-direction:column}
    .home-title{font-size:24px;font-weight:900;letter-spacing:1px;color:#fff;line-height:1.2}
    .home-slogan{font-size:13px;color:rgba(255,255,255,.62);margin-top:4px;line-height:1.4}
    .home-mode-btn{height:40px;border-radius:999px;padding:0 14px;display:flex;align-items:center;gap:6px;background:transparent;border:1.5px solid rgba(255,255,255,.55);color:#fff;font-size:14px;font-weight:700;flex-shrink:0;white-space:nowrap}
    .home-mode-btn svg{width:18px;height:18px}
    .home-cards{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;gap:12px;padding:0 16px 18px;min-height:0}
    .home-card{width:100%;flex:1;min-height:96px;border-radius:24px;padding:0 22px;display:flex;align-items:center;gap:16px;text-align:left;color:#fff;border:0;box-shadow:0 10px 28px rgba(0,0,0,.28);transition:transform .12s}
    .home-card:active{transform:scale(.985)}
    .home-card.sos{background:#D92D20}
    .home-card.ai{background:#E88A2C}
    .home-card.volunteer{background:#0D9488}
    .home-card.jobs{background:#EA580C}
    .home-card-icon{width:58px;height:58px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.2);backdrop-filter:blur(6px);flex-shrink:0}
    .home-card-icon svg{width:32px;height:32px}
    .home-card-text{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
    .home-card-text strong{font-size:22px;font-weight:900}
    .home-card-text span{font-size:14px;font-weight:500;opacity:.88;line-height:1.4}
    .home-card-chevron{margin-left:auto;opacity:.8}
    .home-card-chevron svg{width:26px;height:26px}
    .voice-bubble{position:relative;margin:8px 24px 24px;background:var(--white);border:1px solid var(--line);border-radius:24px;padding:24px;text-align:center;box-shadow:0 8px 30px rgba(139,109,72,.08)}
    .voice-bubble .hint{font-size:16px;color:var(--muted);margin-bottom:10px}
    .voice-bubble .example{font-size:18px;font-weight:700;color:var(--primary)}
    .voice-btn{width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg,var(--primary-light),var(--primary));color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;box-shadow:0 12px 40px rgba(232,138,44,.38);position:relative}
    .voice-btn::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid rgba(232,138,44,.35);animation:voiceRing 1.8s infinite}
    @keyframes voiceRing{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.18);opacity:0}}
    .home-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 20px 18px;flex:1}
    .home-grid button{min-height:110px;border-radius:20px;background:var(--white);border:1px solid var(--line);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:800;box-shadow:0 4px 18px rgba(139,109,72,.06)}
    .home-grid button svg{width:36px;height:36px;color:var(--primary)}
    .home-grid button.sos-tile{background:#D94838;color:#fff;border-color:#D94838;animation:sosPulse 1.6s infinite}
    .home-grid button.sos-tile svg{color:#fff}
    .home-section{padding:0 4px 8px}
    .home-section-title{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:900;color:var(--ink);padding:14px 24px 10px}
    .section-dot{width:10px;height:10px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
    .section-dot.volunteer{background:#12B76A;box-shadow:0 0 0 4px #D1FADF}
    .volunteer-section{background:linear-gradient(180deg,rgba(18,183,106,.04),transparent);border-radius:20px;margin:0 16px 18px;border:1px solid rgba(18,183,106,.1)}
    .float-mic{position:fixed;right:18px;bottom:calc(var(--nav-h) + 16px);width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--primary-light),var(--primary));color:#fff;display:flex;align-items:center;justify-content:center;z-index:7;box-shadow:0 10px 32px rgba(232,138,44,.45);border:3px solid rgba(255,255,255,.35);animation:micPulse 2.4s infinite}
    .float-mic svg{width:34px;height:34px}
    .float-mic.active{background:#D94838;border-color:rgba(255,255,255,.6);animation:none}
    .float-mic:focus-visible{outline:5px solid rgba(232,138,44,.65);outline-offset:4px}
    @keyframes micPulse{0%{box-shadow:0 0 0 0 rgba(232,138,44,.55)}70%{box-shadow:0 0 0 18px rgba(232,138,44,0)}100%{box-shadow:0 0 0 0 rgba(232,138,44,0)}}
    .dest-voice-btn{width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .dest-input-wrap{display:flex;gap:10px;align-items:center}
    .dest-input-wrap input{flex:1}

    .drawer-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.48);z-index:20}
    .drawer{position:absolute;left:0;top:0;bottom:0;width:82%;max-width:344px;background:#fff;color:var(--ink);z-index:21;padding:22px 18px;box-shadow:18px 0 60px rgba(0,0,0,.24);display:flex;flex-direction:column;gap:14px}
    .drawer-head{padding:12px 4px 8px}
    .drawer-head h1{font-size:32px;line-height:1;font-weight:900;margin-bottom:8px}
    .drawer-head p{font-size:15px;color:var(--muted)}
    .drawer-item{min-height:64px;border:1px solid var(--line);border-radius:var(--radius);display:flex;align-items:center;gap:14px;padding:12px;text-align:left;background:#fff}
    .drawer-item strong{display:block;font-size:17px}
    .drawer-item span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
    .drawer-section-title{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:8px 4px 4px}
    .drawer-sos{min-height:72px;border-radius:var(--radius);background:#D92D20;color:#fff;display:flex;align-items:center;gap:14px;padding:14px;font-size:17px;font-weight:900;margin-bottom:6px}
    .drawer-foot{margin-top:auto;padding:12px;border-radius:var(--radius);background:var(--bg);color:var(--muted);font-size:13px;line-height:1.55}

    .panel-page{min-height:100vh;background:var(--bg);color:var(--ink);padding-bottom:calc(var(--nav-h) + 18px);position:relative}
    .panel-header{height:72px;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:18px 16px 8px}
    .panel-header h1{font-size:22px;font-weight:850}
    .back-btn{width:48px;height:48px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;color:var(--primary)}
    .panel-content{padding:16px;display:flex;flex-direction:column;gap:12px}
    .card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:0 4px 18px rgba(139,109,72,.06)}
    .card h2{font-size:21px;margin-bottom:8px;color:var(--ink)}
    .card p{font-size:16px;color:var(--muted);line-height:1.65}
    .big-action{height:72px;border-radius:var(--radius);font-size:22px;font-weight:850;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 20px rgba(232,138,44,.25)}
    .outline-action{height:60px;border-radius:var(--radius);font-size:18px;font-weight:850;background:var(--white);color:var(--ink);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:10px}
    .simple-list{display:flex;flex-direction:column;gap:8px}
    .simple-row{padding:14px;border-radius:var(--radius);background:var(--bg);font-size:16px}
    .simple-row b{display:block;color:var(--ink);margin-bottom:4px}
    .toast{position:fixed;left:50%;top:20px;transform:translateX(-50%) translateY(-12px);width:min(390px,calc(100% - 28px));background:var(--ink);color:#fff;border-radius:var(--radius);padding:14px 16px;z-index:100;opacity:0;pointer-events:none;transition:.22s;font-weight:800}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:30}
    .sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;color:var(--ink);z-index:31;border-radius:16px 16px 0 0;padding:20px;box-shadow:0 -16px 50px rgba(0,0,0,.24)}
    .sheet h2{font-size:24px;margin-bottom:8px}
    .sheet p{font-size:16px;line-height:1.65;color:var(--muted)}
    .sheet button{margin-top:16px}
    .sheet-list{background:#0B1020;color:#fff}
    .sheet-list h2{color:#fff}
    .sheet-items{display:flex;flex-direction:column;gap:12px;margin-top:12px}
    .sheet-item{width:100%;min-height:72px;border-radius:16px;background:#151B2E;border:0;padding:14px 16px;display:flex;align-items:center;gap:14px;color:#fff;text-align:left}
    .sheet-item-icon{width:40px;height:40px;border-radius:12px;background:rgba(245,176,65,.18);display:flex;align-items:center;justify-content:center;color:#F5B041;flex-shrink:0}
    .sheet-item-icon svg{width:22px;height:22px;stroke:currentColor}
    .sheet-item-text{display:flex;flex-direction:column;gap:4px}
    .sheet-item-text strong{font-size:17px;font-weight:800}
    .sheet-item-text span{font-size:13px;color:rgba(255,255,255,.72)}
    .sheet-item:active{transform:scale(.985)}
    input,select{width:100%;height:56px;border:1px solid var(--line);border-radius:var(--radius);padding:0 12px;background:#fff}
    .call{min-height:100vh;background:#0B1220;color:#fff;display:flex;flex-direction:column;position:relative}
    .call-main{flex:1;display:flex;align-items:center;justify-content:center;position:relative;background:radial-gradient(circle at 50% 32%,#7A4A1F,#2A2118 58%);padding:150px 0 150px}
    .avatar{width:112px;height:112px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#F5B041;color:#000;font-size:52px;font-weight:900}
    .call-caption{position:absolute;left:18px;right:18px;bottom:22px;background:rgba(0,0,0,.66);border-radius:var(--radius);padding:16px;font-size:18px;line-height:1.45}
    .call-actions{position:absolute;left:0;right:0;bottom:0;background:#000;padding:18px 16px 34px;display:flex;justify-content:center;gap:18px;z-index:20}
    .call-actions button{min-height:64px;border-radius:999px;font-weight:900;font-size:18px;border:0;padding:0 28px}
    .call-actions .danger{background:#D92D20;color:#fff;min-width:160px;box-shadow:0 8px 24px rgba(217,45,20,.35)}
    .call-actions .secondary{background:#1C1C1E;color:#fff;min-width:90px}
    .danger{background:#D92D20;color:#fff}
    .toggle{position:relative;width:80px;height:48px;background:var(--line);border-radius:999px;transition:background .2s}
    .toggle.active{background:var(--primary)}
    .toggle::after{content:"";position:absolute;left:5px;top:5px;width:38px;height:38px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.18)}
    .toggle.active::after{transform:translateX(32px)}
    .setting-row{display:flex;align-items:center;justify-content:space-between;min-height:60px;padding:12px 0;border-bottom:1px solid var(--line)}
    .setting-row:last-child{border-bottom:none}
    .setting-row .label{font-size:17px;font-weight:700;color:var(--ink)}
    .setting-row .desc{font-size:15px;color:var(--muted);margin-top:2px}
    .history-item{padding:14px;border-bottom:1px solid var(--line);font-size:15px;line-height:1.6}
    .history-item:last-child{border-bottom:none}
    .history-time{font-size:12px;color:var(--muted);margin-bottom:4px}
    .photo-history-page,.photo-preview-page{background:#0B1020;color:#fff}
    .photo-history-page .panel-header,.photo-preview-page .panel-header{background:#0B1020;border-color:rgba(255,255,255,.1);color:#fff}
    .photo-history-page .panel-header h1,.photo-preview-page .panel-header h1{color:#fff}
    .photo-history-page .back-btn,.photo-preview-page .back-btn{color:#F5B85A}
    .photo-history-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:0 16px 16px}
    .photo-history-item{background:#151B2E;border-radius:18px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08)}
    .photo-history-thumb{width:100%;aspect-ratio:1;background:#0d0d0d;background-size:cover;background-position:center}
    .photo-history-meta{padding:12px}
    .photo-history-time{font-size:13px;color:#F5B85A;margin-bottom:6px;font-weight:700}
    .photo-history-text{font-size:14px;color:rgba(255,255,255,.75);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .photo-preview-img{width:100%;aspect-ratio:3/4;background:#0d0d0d;background-size:contain;background-position:center;background-repeat:no-repeat;border-radius:18px;margin-bottom:16px;border:1px solid rgba(255,255,255,.1)}
    .sos-card{background:#FEF3F2;border:1px solid #FECACA;border-radius:var(--radius);padding:16px}
    .sos-card h3{color:#B42318;font-size:18px;margin-bottom:6px}
    .sos-card p{font-size:14px;color:#7A271A;line-height:1.5}
    .contact-row{display:flex;align-items:center;gap:12px;padding:12px;background:#F2F4F7;border-radius:var(--radius);margin-top:8px}
    .contact-row .avatar{width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}
    .sos-float{position:fixed;right:18px;bottom:calc(var(--nav-h) + 90px);width:76px;height:76px;border-radius:50%;background:#D92D20;color:#fff;display:flex;align-items:center;justify-content:center;z-index:9;box-shadow:0 8px 28px rgba(217,45,32,.45);font-size:13px;font-weight:900;animation:sosPulse 1.6s infinite;user-select:none;-webkit-user-select:none}
    .sos-float:active{transform:scale(.95)}
    .sos-float::after{content:"SOS";font-size:18px;letter-spacing:1px}
    @keyframes sosPulse{0%{box-shadow:0 0 0 0 rgba(217,45,32,.55)}70%{box-shadow:0 0 0 18px rgba(217,45,32,0)}100%{box-shadow:0 0 0 0 rgba(217,45,32,0)}}
    .nav-status{background:#ECFDF3;border:1px solid #A6F4C5;border-radius:var(--radius);padding:14px 16px;display:flex;align-items:center;gap:10px}
    .nav-status.active{background:#FEF3F2;border-color:#FECACA}
    .nav-status .dot{width:10px;height:10px;border-radius:50%;background:#12B76A}
    .nav-status.active .dot{background:#D92D20;animation:pulseDot 1.2s infinite}
    .segment{display:flex;gap:8px;background:#F2F4F7;border-radius:var(--radius);padding:4px}
    .segment button{flex:1;height:48px;border-radius:6px;font-size:16px;font-weight:700;background:transparent;color:var(--muted)}
    .segment button.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
    .facility-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
    .facility-row:last-child{border-bottom:none}
    .facility-row b{font-size:16px}
    .facility-row span{font-size:15px;color:var(--muted)}

    .crosswalk-status{position:absolute;left:18px;right:18px;bottom:calc(var(--nav-h) + 130px);background:rgba(30,30,30,.9);border-radius:18px;padding:20px;text-align:center;border:1px solid rgba(255,255,255,.1)}
    .crosswalk-status .state{font-size:26px;font-weight:900;margin-bottom:8px}
    .crosswalk-status .guide{font-size:17px;line-height:1.6;color:#E9D8BE}
    .crosswalk-actions{position:absolute;left:16px;right:16px;bottom:calc(var(--nav-h) + 16px);display:flex;flex-direction:column;gap:12px;z-index:5}
    .crosswalk-actions button{min-height:56px;border-radius:16px;font-size:18px;font-weight:800;border:0}
    .crosswalk-actions .connect{background:var(--red);color:#fff}
    .crosswalk-actions .secondary{background:#1C1C1E;color:#fff}
    .pedestrian-hint{position:absolute;left:50%;top:62%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;padding:8px 16px;border-radius:999px;font-size:15px;font-weight:700;white-space:nowrap}

    /* POI search */
    .poi-chips{display:flex;gap:10px;overflow-x:auto;padding:4px 2px;scrollbar-width:none}
    .poi-chips::-webkit-scrollbar{display:none}
    .poi-chip{white-space:nowrap;height:48px;padding:0 16px;border-radius:999px;background:#F2F4F7;font-size:16px;font-weight:700;color:var(--muted);border:1px solid var(--line);flex-shrink:0}
    .poi-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
    .poi-result{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
    .poi-result:last-child{border-bottom:none}
    .poi-result .name{font-size:17px;font-weight:800;color:var(--ink)}
    .poi-result .meta{font-size:14px;color:var(--muted);margin-top:3px}
    .poi-result button{height:42px;padding:0 16px;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-size:15px;font-weight:800}

    /* Network status */
    .network-bar{position:absolute;top:0;left:0;right:0;height:52px;background:#000;display:flex;align-items:center;justify-content:center;gap:10px;z-index:30;padding-top:28px}
    .network-dot{width:10px;height:10px;border-radius:50%;background:#34c759}
    .network-dot.poor{background:#ff3b30}
    .network-dot.good{background:#ffcc00}
    .network-bar span{font-size:15px;font-weight:700;color:#fff}
    .quality-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
    .quality-actions button{height:48px;border-radius:12px;font-size:16px;font-weight:800;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.3)}
    .quality-actions button.active{background:#fff;color:#0B1220}

    /* Call quality buttons below top network bar */
    .call-quality-bar{position:absolute;top:80px;left:16px;right:16px;height:64px;display:flex;gap:10px;z-index:20;background:rgba(0,0,0,.55);border-radius:18px;padding:8px}
    .call-quality-bar button{flex:1;height:100%;border:none;border-radius:12px;font-size:17px;font-weight:800;color:#fff;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px}
    .call-quality-bar button.active{background:#F5B041;color:#000}
    .call-quality-bar button:active{transform:scale(.985)}
    .call-quality-bar .q-hint{font-size:12px;font-weight:700;opacity:.78}
    .call-quality-bar button.active .q-hint{opacity:.9;color:#000}

    

    /* Call volunteer page */
    .call-volunteer-shell{min-height:100vh;background:#0B1020;padding-bottom:calc(var(--nav-h) + 12px);color:#fff}
    .call-volunteer-shell .panel-header{background:#0B1020;border-color:rgba(255,255,255,.1);color:#fff}
    .call-volunteer-shell .panel-header h1{color:#fff}
    .call-volunteer-shell .back-btn{color:#fff}
    .cv-list{display:flex;flex-direction:column;gap:16px;padding:18px}
    .cv-big-btn{position:relative;width:100%;min-height:132px;border-radius:24px;border:0;padding:20px 22px;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:8px;box-shadow:0 14px 40px rgba(0,0,0,.35);overflow:hidden}
    .cv-big-btn:active{transform:scale(.985)}
    .cv-big-btn .cv-icon{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:rgba(0,0,0,.2);margin-bottom:4px}
    .cv-big-btn .cv-icon svg{width:26px;height:26px;stroke:#fff;stroke-width:2.4}
    .cv-big-btn strong{font-size:22px;font-weight:900;color:#fff}
    .cv-big-btn span{font-size:15px;font-weight:500;color:rgba(255,255,255,.82);line-height:1.45}
    .cv-big-btn.online{background:linear-gradient(135deg,#2E86DE,#1B5FAA)}
    .cv-big-btn.offline{background:linear-gradient(135deg,#27AE60,#146E3A)}
    .cv-big-btn.purchase{background:linear-gradient(135deg,#FF8C00,#E67E00)}

    /* Social page only social */
    .enter-room-centered{display:flex;justify-content:center;padding:10px 0 18px}
    .enter-room-centered .big-action{width:240px;min-height:88px;border-radius:26px;font-size:28px;font-weight:900;background:#7C3AED;color:#fff;box-shadow:0 14px 40px rgba(124,58,237,.4)}
    .enter-room-centered .big-action:active{transform:scale(.98)}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
    .blink-hint{animation:blink 1.5s infinite}

    /* Home logo redesign */
    .home-brand{cursor:pointer;display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left;color:inherit}
    .home-brand:focus-visible{outline:4px solid rgba(232,138,44,.55);outline-offset:3px}
    .home-brand:active{transform:scale(.98)}
    .home-logo-wrap{width:46px;height:46px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
    .logo-sun{width:46px;height:46px;border-radius:50%;border:3px solid #fff;position:relative;display:flex;align-items:center;justify-content:center}
    .logo-core{width:18px;height:18px;border-radius:50%;background:#F5B041;box-shadow:0 0 16px #F5B041,0 0 32px #F5B041}
    .logo-glow{position:absolute;inset:-12px;border-radius:50%;border:2px solid rgba(245,176,65,.5);animation:glowOut 2s infinite}
    .logo-glow:nth-child(2){animation-delay:.6s}
    .logo-glow:nth-child(3){animation-delay:1.2s}
    @keyframes glowOut{0%{transform:scale(.8);opacity:.7}100%{transform:scale(1.8);opacity:0}}
    .home-title{font-size:28px;font-weight:900;letter-spacing:1px;color:#fff;line-height:1.2}
    .home-slogan{font-size:14px;color:rgba(255,255,255,.72);margin-top:4px;line-height:1.4}

    /* Camera page redesign — 3-part layout */
    .camera-shell{
      --nav-h:60px;
      --controls-h:152px;
      --mode-h:82px;
      --topbar-h:56px;
      --top-gap:12px;
      background:#0B1020
    }
    /* Global mic on camera page: keep above bottom controls so it does not block the shutter/history/ask buttons */
    .camera-shell ~ .float-mic{bottom:calc(var(--nav-h) + 170px)}
    /* Part 0: Top bar */
    .camera-topbar{position:absolute;top:0;left:0;right:0;height:var(--topbar-h);z-index:6;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
    .camera-back-btn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;display:flex;align-items:center;justify-content:center;border:0;backdrop-filter:blur(4px)}
    .camera-back-btn svg{width:24px;height:24px}
    .camera-back-btn:active{transform:scale(.95)}
    .camera-topbar-spacer{width:44px}
    /* Part 1: Top mode buttons */
    .camera-mode-btns{position:absolute;top:calc(var(--topbar-h) + var(--top-gap));left:16px;right:16px;height:var(--mode-h);z-index:5;display:flex;gap:12px}
    .camera-mode-btns button{flex:1;height:100%;border-radius:20px;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:10px;font-size:20px;font-weight:800;border:0;box-shadow:0 8px 24px rgba(0,0,0,.28)}
    .camera-mode-btns button svg{width:34px;height:34px;flex-shrink:0}
    .camera-mode-btns button.crosswalk{background:#F5B041;color:#000}
    .camera-mode-btns button.crosswalk svg{stroke:#fff}
    .camera-mode-btns button.travel{background:#2E86DE;color:#fff}
    .camera-mode-btns button.travel svg{stroke:#fff}
    .camera-mode-btns button:active{transform:scale(.98)}
    /* Part 2: Viewfinder */
    .viewfinder{position:absolute;left:16px;right:16px;top:calc(var(--topbar-h) + var(--top-gap) + var(--mode-h) + 12px);bottom:calc(var(--controls-h) + var(--nav-h) + 12px);z-index:3;display:flex}
    .viewfinder-inner{flex:1;border-radius:22px;position:relative;overflow:hidden;background:#070a14;border:2px solid #F5B041;box-shadow:0 20px 60px rgba(0,0,0,.45)}
    .viewfinder-brackets{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
    .viewfinder-brackets path{stroke:#F5B041;stroke-width:2.5;fill:none;stroke-linecap:round}
    .viewfinder-sound{position:absolute;right:14px;top:14px;width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.55);color:#F5B041;display:flex;align-items:center;justify-content:center;border:0;backdrop-filter:blur(4px);z-index:4}
    .viewfinder-sound svg{width:24px;height:24px}
    /* Part 3: Bottom controls */
    .camera-bottom-controls{position:absolute;left:0;right:0;bottom:var(--nav-h);height:var(--controls-h);z-index:4;display:flex;align-items:center;justify-content:space-between;padding:0 20px 12px;gap:14px}
    .history-card{flex:0 0 72px;height:110px;border-radius:18px;background:#151B2E;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:8px 8px 7px;border:0;box-shadow:0 6px 18px rgba(0,0,0,.28)}
    .history-card .history-thumb{width:100%;flex:1;border-radius:12px;overflow:hidden;position:relative;background:#0d0d0d;margin-bottom:6px;background-size:cover;background-position:center}
    .history-card .history-thumb::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,rgba(255,214,112,.55),transparent 40%),radial-gradient(circle at 70% 35%,rgba(255,255,255,.35),transparent 35%),linear-gradient(180deg,#1a1d22,#0d0d0d);opacity:.9}
    .history-card .history-thumb[style*="background-image"]::before{opacity:.15}
    .history-card .history-thumb::after{content:"";position:absolute;left:0;right:0;bottom:0;height:60%;background:repeating-linear-gradient(90deg,transparent,transparent 5px,rgba(245,184,90,.8) 5px,rgba(245,184,90,.8) 11px,transparent 11px,transparent 14px);transform:perspective(40px) rotateX(35deg);transform-origin:bottom center;opacity:.85}
    .history-card .history-thumb[style*="background-image"]::after{opacity:.3}
    .history-card .history-thumb-icon{position:absolute;left:4px;bottom:4px;width:16px;height:16px;color:#fff;z-index:2}
    .history-card .history-thumb-icon svg{width:100%;height:100%}
    .history-card span{font-size:14px;font-weight:800}
    .history-card:active{transform:scale(.96)}
    .ask-more-card{flex:0 0 72px;height:110px;border-radius:18px;background:#151B2E;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:800;border:0;box-shadow:0 6px 18px rgba(0,0,0,.28)}
    .ask-more-card svg{width:30px;height:30px}
    .ask-more-card:active{transform:scale(.96)}
    .capture-main-wrap{flex:1;display:flex;align-items:center;justify-content:center}
    .capture-btn{width:124px;height:124px;border-radius:50%;background:#FF8C00;color:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;font-weight:900;border:4px solid #fff;box-shadow:0 0 0 6px rgba(255,140,0,.25),0 0 0 12px rgba(255,140,0,.12),0 14px 40px rgba(0,0,0,.55)}
    .capture-btn svg{width:34px;height:34px;margin-bottom:2px;stroke:#000}
    .capture-btn span{margin-top:-2px}
    .capture-btn:active{transform:scale(.96)}
    /* Camera bottom nav override */
    .camera-shell .bottom-nav{background:#0B1020;border-top:1px solid rgba(255,255,255,.08);backdrop-filter:none;height:var(--nav-h)}
    .camera-shell .bottom-nav button{color:rgba(255,255,255,.72);font-weight:600;min-height:0;height:100%;padding:6px 2px}
    .camera-shell .bottom-nav button.active{color:#F5B041}
    .camera-shell .bottom-nav button.active::after{display:none}
    /* Travel page redesign - blind-friendly */
    .travel-shell{min-height:100vh;position:relative;background:#0B1020;color:#fff;overflow-y:auto;padding-bottom:calc(var(--nav-h) + 12px)}
    .travel-topbar{display:flex;align-items:center;justify-content:space-between;padding:52px 16px 12px;position:relative;z-index:2}
    .travel-back-btn{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;border:0;flex-shrink:0}
    .travel-back-btn svg{width:24px;height:24px}
    .travel-title{font-size:22px;font-weight:900;color:#fff;position:absolute;left:50%;transform:translateX(-50%)}
    .travel-speaker-btn{width:48px;height:48px;border-radius:50%;background:#F5B041;color:#000;display:flex;align-items:center;justify-content:center;border:0;flex-shrink:0}
    .travel-speaker-btn svg{width:24px;height:24px}
    /* Input section */
    .travel-input-section{display:flex;flex-direction:column;gap:12px;padding:0 16px 16px;position:relative;z-index:2}
    .travel-input-row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.15);border-radius:16px;padding:6px 6px 6px 16px;min-height:56px}
    .travel-input-row:focus-within{border-color:#F5B85A;box-shadow:0 0 0 4px rgba(245,184,90,.15)}
    .travel-input-row .input-prefix{font-size:15px;font-weight:800;color:rgba(255,255,255,.5);flex-shrink:0;min-width:48px}
    .travel-input-row input{flex:1;background:transparent;border:0;color:#fff;font-size:18px;font-weight:700;outline:none;min-width:0}
    .travel-input-row input::placeholder{color:rgba(255,255,255,.3);font-weight:500}
    .travel-input-row .voice-mini-btn{width:44px;height:44px;border-radius:50%;background:#F5B041;color:#000;display:flex;align-items:center;justify-content:center;border:0;flex-shrink:0}
    .travel-input-row .voice-mini-btn svg{width:22px;height:22px}
    .travel-input-row .voice-mini-btn.listening{background:#D94838;animation:pulseVoice 1.2s infinite}
    .travel-input-row .voice-mini-btn:active{transform:scale(.93)}
    .travel-swap-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);color:#F5B85A;display:flex;align-items:center;justify-content:center;border:0;margin:0 auto;flex-shrink:0}
    .travel-swap-btn svg{width:20px;height:20px}
    .travel-swap-btn:active{transform:scale(.9)}
    .travel-search-btn{width:100%;min-height:60px;border-radius:18px;background:linear-gradient(135deg,#F5B041,#E88A2C);color:#000;font-size:20px;font-weight:900;border:0;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 24px rgba(232,138,44,.3)}
    .travel-search-btn:active{transform:scale(.98)}
    .travel-search-btn svg{width:26px;height:26px}
    /* Route comparison section */
    .travel-route-section{padding:0 16px;position:relative;z-index:2}
    .travel-route-section h3{font-size:20px;font-weight:900;color:#fff;margin-bottom:12px;display:flex;align-items:center;gap:8px}
    .travel-route-section h3 .badge{font-size:14px;background:rgba(245,184,90,.18);color:#F5B85A;padding:4px 10px;border-radius:999px;font-weight:700}
    .route-card{background:#111827;border:1.5px solid rgba(255,255,255,.08);border-radius:20px;padding:18px;margin-bottom:12px;cursor:pointer}
    .route-card.selected{border-color:#F5B85A;box-shadow:0 0 0 3px rgba(245,184,90,.2)}
    .route-card .route-summary{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .route-card .route-num{font-size:15px;font-weight:700;color:rgba(255,255,255,.5)}
    .route-card .route-tactile-pct{font-size:28px;font-weight:900;color:#F5B85A}
    .route-card .route-tactile-pct span{font-size:16px;color:rgba(245,184,90,.7)}
    .route-card .route-one-line{font-size:15px;font-weight:700;color:#fff;margin-bottom:14px;line-height:1.5}
    .route-card .route-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
    .route-stat{padding:12px;border-radius:14px;background:rgba(255,255,255,.04)}
    .route-stat .stat-val{font-size:22px;font-weight:900;color:#fff}
    .route-stat .stat-label{font-size:13px;color:rgba(255,255,255,.5);margin-top:2px}
    .route-stat.tactile .stat-val{color:#F5B85A}
    .route-stat.rest .stat-val{color:#2E86DE}
    .route-stat.no-tactile .stat-val{color:rgba(255,255,255,.4)}
    .route-tactile-bar{height:14px;border-radius:7px;background:rgba(255,255,255,.08);overflow:hidden;display:flex;margin-bottom:10px}
    .route-tactile-bar .tactile-seg{background:#F5B041;height:100%;border-radius:2px;transition:width .3s}
    .route-tactile-bar .tactile-seg.gap{background:rgba(255,255,255,.15)}
    .route-rest-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
    .route-rest-chip{padding:5px 12px;border-radius:999px;background:rgba(46,134,222,.15);color:#2E86DE;font-size:13px;font-weight:700;display:flex;align-items:center;gap:4px}
    .route-rest-chip svg{width:14px;height:14px}
    .route-select-btn{width:100%;min-height:52px;border-radius:16px;background:#F5B041;color:#000;font-size:18px;font-weight:900;border:0;margin-top:10px}
    .route-select-btn:active{transform:scale(.98)}
    /* Route detail map */
    .travel-map-section{margin:0 16px 16px;position:relative;z-index:2}
    .travel-map-section h3{font-size:20px;font-weight:900;color:#fff;margin-bottom:12px}
    .travel-route-map{background:#111827;border-radius:20px;padding:18px;position:relative;overflow:hidden}
    .travel-route-map .route-visual{position:relative;height:180px;margin-bottom:10px}
    .travel-route-map .route-line{position:absolute;left:0;right:0;top:50%;height:8px;border-radius:4px;background:rgba(255,255,255,.1);transform:translateY(-50%)}
    .travel-route-map .segment{position:absolute;height:100%;top:0;border-radius:4px}
    .travel-route-map .segment.tactile{background:#F5B041;box-shadow:0 0 8px rgba(245,184,90,.5)}
    .travel-route-map .segment.normal{background:rgba(255,255,255,.2)}
    .travel-route-map .rest-dot{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#2E86DE;transform:translate(-50%,-50%);box-shadow:0 0 8px rgba(46,134,222,.6);z-index:2}
    .travel-route-map .rest-dot::after{content:attr(data-label);position:absolute;bottom:20px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;color:#2E86DE;font-weight:700}
    .travel-route-map .start-marker,.travel-route-map .end-marker{position:absolute;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:3;font-size:11px;font-weight:900}
    .travel-route-map .start-marker{left:0;background:#2E86DE;color:#fff;margin-left:-12px}
    .travel-route-map .end-marker{right:0;background:#F5B041;color:#000;margin-right:-12px}
    .travel-route-map .legend{display:flex;gap:16px;font-size:13px;color:rgba(255,255,255,.5)}
    .travel-route-map .legend span{display:flex;align-items:center;gap:4px}
    .travel-route-map .legend .swatch{width:10px;height:10px;border-radius:2px;flex-shrink:0}
    /* Start nav button */
    .travel-start-nav{display:flex;gap:10px;padding:0 16px 16px;position:relative;z-index:2}
    .travel-start-nav button{min-height:64px;border-radius:18px;font-size:19px;font-weight:900;border:0;display:flex;align-items:center;justify-content:center;gap:8px}
    .travel-start-nav .btn-nav{flex:2;background:#F5B041;color:#000}
    .travel-start-nav .btn-nav svg{width:28px;height:28px}
    .travel-start-nav .btn-refresh{flex:1;background:#1A2040;color:#F5B85A;border:2px solid #F5B85A}
    .travel-start-nav .btn-nav:disabled{background:#555;color:#aaa}
    .travel-start-nav button:active{transform:scale(.98)}
    .travel-network-bar{position:absolute;top:0;left:0;right:0;height:46px;background:#000;display:flex;align-items:center;justify-content:center;gap:8px;z-index:20;padding-top:28px}
    .travel-network-bar.offline{background:#7A1F1F}
    .travel-network-bar span{font-size:15px;font-weight:800;color:#fff}
    .travel-network-dot{width:10px;height:10px;border-radius:50%;background:#34c759}
    .travel-network-dot.offline{background:#ff3b30}
    /* Navigation overlay */
    .travel-nav-overlay{position:fixed;inset:0;background:#0B1020;z-index:50;display:flex;flex-direction:column;padding-top:74px;padding-bottom:calc(var(--nav-h) + 16px)}
    .travel-nav-overlay .nav-top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#000}
    .travel-nav-overlay .nav-direction{font-size:42px;font-weight:900;color:#F5B041}
    .travel-nav-overlay .nav-distance{font-size:24px;font-weight:800;color:#fff}
    .travel-nav-overlay .nav-instruction{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}

    function getAudioContext(){
      if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      if(audioCtx.state==='suspended')audioCtx.resume();
      return audioCtx;
    }
    function tone(freq,duration,type='sine',startGain=0.0001,endGain=0.0001){
      const ctx=getAudioContext();
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.type=type;
      osc.frequency.setValueAtTime(freq,ctx.currentTime);
      gain.gain.setValueAtTime(startGain,ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.5,ctx.currentTime+0.02);
      gain.gain.exponentialRampToValueAtTime(endGain,ctx.currentTime+duration);
      osc.connect(gain);gain.connect(ctx.destination);
      osc.start(ctx.currentTime);osc.stop(ctx.currentTime+duration);
    }
    function playEarcon(type){
      try{
        const ctx=getAudioContext();
        const t=ctx.currentTime;
        if(type==='sos'){
          [0,0.35,0.7].forEach(o=>{tone(280,0.22,'square',0.0001,0.0001);});
        }else if(type==='ai'){
          tone(440,0.18,'sine');setTimeout(()=>tone(880,0.22,'sine'),180);
        }else if(type==='camera'){
          const n=ctx.createWhiteNoise?ctx.createWhiteNoise():null;
          if(n){const g=ctx.createGain();g.gain.setValueAtTime(0.4,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.08);n.connect(g);g.connect(ctx.destination);n.start(t);n.stop(t+0.08);}
          else{tone(800,0.05,'square');setTimeout(()=>tone(600,0.05,'square'),60);}
        }else if(type==='success'){
          tone(523,0.12,'sine');setTimeout(()=>tone(659,0.12,'sine'),120);setTimeout(()=>tone(784,0.18,'sine'),240);
        }else if(type==='error'){
          tone(300,0.18,'sawtooth');setTimeout(()=>tone(200,0.24,'sawtooth'),180);
        }else if(type==='navigate'){
          tone(600,0.12,'sine');
        }else if(type==='social'){
          tone(392,0.18,'sine');setTimeout(()=>tone(494,0.18,'sine'),180);
        }else if(type==='volunteer'){
          tone(440,0.25,'sine');
        }else if(type==='warning'){
          tone(250,0.3,'sawtooth');
        }
      }catch(e){}
    }

    window.updateTravelInputs=()=>{
      const oi=document.getElementById('travelOriginInput');const di=document.getElementById('travelDestInput');
      if(oi)state.travelOrigin=oi.value.trim();
      if(di)state.travelDestination=di.value.trim();

      const tmp=state.travelOrigin;state.travelOrigin=state.travelDestination;state.travelDestination=tmp;
      haptic('SUCCESS');playEarcon('success');
      render();say('已交换起始地和目的地');
    };
    window.toggleTravelVoiceInput=(field)=>{
      if(state.travelVoiceListening===field){stopTravelVoice();return;}
      state.travelVoiceListening=field;render();
      startTravelVoiceInput(field);
    };
    function startTravelVoiceInput(field){
      if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)){show('当前浏览器不支持语音输入');say('请使用支持语音识别的浏览器');stopTravelVoice();return;}
      if(travelVoiceRec){try{travelVoiceRec.stop();}catch(err){}travelVoiceRec=null;}
      const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
      const rec=new SR();rec.lang='zh-CN';rec.interimResults=false;rec.maxAlternatives=1;
      travelVoiceRec=rec;
      haptic('AI_RECOGNIZE');playEarcon('ai');
      say(field==='origin'?'请说起始地':'请说目的地');
      rec.onresult=(e)=>{
        const text=e.results[0][0].transcript.trim();
        state.travelVoiceListening=null;travelVoiceRec=null;
        render();
        showVoiceResultPopup(field,text);
      };
      rec.onerror=(e)=>{
        state.travelVoiceListening=null;travelVoiceRec=null;render();
        if(e.error==='no-speech'||e.error==='audio-capture'){say('没听清，请靠近麦克风再说一次');}
        else{say('语音识别失败，请重试');}
      };
      rec.onend=()=>{
        if(travelVoiceRec===rec){travelVoiceRec=null;state.travelVoiceListening=null;}
        if(!pendingVoiceResult)render();
      };
      try{rec.start();}catch(err){state.travelVoiceListening=null;travelVoiceRec=null;render();}
    }
    let pendingVoiceResult=null;
    function showVoiceResultPopup(field,text){
      haptic('AI_SUCCESS');playEarcon('success');
      pendingVoiceResult={field,text,confirmed:false};
      if(field==='origin'){state.travelOrigin=text;}else{state.travelDestination=text;}
      render();
      say('识别到：'+text+'，确认使用吗？');
      const popup='<div class="voice-result-popup" id="voiceResultPopup" role="dialog" aria-label="语音识别结果">'+
        '<div class="voice-result-card">'+
        '<div class="vr-icon">'+icon.mic+'</div>'+
        '<div class="vr-title">'+(field==='origin'?'起始地识别结果':'目的地识别结果')+'</div>'+
        '<div class="vr-text">'+escapeHtml(text)+'</div>'+
        '<div class="vr-actions">'+
        '<button class="vr-btn-cancel" onclick="cancelVoiceResult()" aria-label="取消" role="button">取消</button>'+
        '<button class="vr-btn-retry" onclick="retryVoiceResult()" aria-label="重新说一次" role="button">重说</button>'+
        '<button class="vr-btn-confirm" onclick="confirmVoiceResult()" aria-label="确认使用识别结果" role="button">确认</button>'+
        '</div></div></div>';
      app.insertAdjacentHTML('beforeend',popup);
      const input=document.getElementById(field==='origin'?'travelOriginInput':'travelDestInput');
      if(input){input.focus();input.setSelectionRange(text.length,text.length);}
    }
    window.confirmVoiceResult=()=>{
      const popup=document.getElementById('voiceResultPopup');
      if(popup)popup.remove();
      if(!pendingVoiceResult)return;
      const {field,text}=pendingVoiceResult;
      pendingVoiceResult=null;
      if(field==='origin'){state.travelOrigin=text;}else{state.travelDestination=text;}
      haptic('SUCCESS');playEarcon('success');
      render();say((field==='origin'?'起始地':'目的地')+'已设置为'+text);
    };
    window.retryVoiceResult=()=>{
      const popup=document.getElementById('voiceResultPopup');
      if(popup)popup.remove();
      const field=pendingVoiceResult?pendingVoiceResult.field:'dest';
      pendingVoiceResult=null;
      say('请重新说一次');
      state.travelVoiceListening=field;render();
      startTravelVoiceInput(field);

    window.cancelVoiceResult=()=>{
      const popup=document.getElementById('voiceResultPopup');
      if(popup)popup.remove();
      if(pendingVoiceResult){
        const field=pendingVoiceResult.field;
        pendingVoiceResult=null;
        if(field==='origin'){state.travelOrigin='';}else{state.travelDestination='';}

      say('已取消');

    let travelVoiceRec=null;
    window.searchTravelRoutes=()=>{
      updateTravelInputs();
      const origin=state.travelOrigin||'当前位置';
      const dest=state.travelDestination;
      if(!dest){say('请输入目的地');return;}
      haptic('NAVIGATE');playEarcon('navigate');
      show('正在搜索无障碍路线');say('正在搜索从'+origin+'到'+dest+'的无障碍路线');
      state.travelRoutes=generateBlindRoutes(origin,dest);
      state.selectedRouteIndex=0;state.destination=dest;

    function generateBlindRoutes(origin,dest){
      const routes=[];
      const totalDist=Math.floor(Math.random()*300)+250;
      const restTypes=[
        {name:'无障碍卫生间',icon:'♿',keyword:'无障碍卫生间'},
        {name:'休息长椅',icon:'🪑',keyword:'休息长椅'},
        {name:'盲道休息区',icon:'📍',keyword:'盲道休息区'},
        {name:'饮水点',icon:'💧',keyword:'饮水点'},
        {name:'志愿者服务站',icon:'🤝',keyword:'志愿者服务站'},
        {name:'无障碍电梯',icon:'🛗',keyword:'无障碍电梯'},
        {name:'便利店',icon:'🏪',keyword:'便利店'},
        {name:'公交站台',icon:'🚌',keyword:'公交站台'}
      ];
      // Route 1: high tactile coverage
      const pct1=Math.min(92,Math.max(75,80+Math.floor(Math.random()*10)));
      const dist1=totalDist;
      const count1=Math.floor(Math.random()*2)+3;
      const facs1=[];
      const used1=new Set();
      for(let j=0;j<count1;j++){
        let pos;do{pos=Math.floor(Math.random()*(dist1-40))+20;}while(used1.has(pos));
        used1.add(pos);
        const rt=restTypes[j%restTypes.length];
        facs1.push({name:rt.name,icon:rt.icon,keyword:rt.keyword,atDistance:pos});
      }
      facs1.sort((a,b)=>a.atDistance-b.atDistance);
      const segs1=generateTactileSegments(dist1,pct1);
      const keyNames1=facs1.slice(0,3).map(f=>f.keyword);
      routes.push({
        totalDistance:dist1,tactileDistance:Math.floor(dist1*pct1/100),tactilePercent:pct1,
        restFacilities:facs1,tactileSegments:segs1,
        summary:'盲道最多，途经'+keyNames1.join('、')
      });
      // Route 2: shorter distance, balanced tactile
      const dist2=Math.floor(totalDist*(0.82+Math.random()*0.1));
      const pct2=Math.min(78,Math.max(55,65+Math.floor(Math.random()*10)));
      const count2=Math.floor(Math.random()*2)+2;
      const facs2=[];
      const used2=new Set();
      for(let j=0;j<count2;j++){
        let pos;do{pos=Math.floor(Math.random()*(dist2-40))+20;}while(used2.has(pos));
        used2.add(pos);
        const rt=restTypes[(j+3)%restTypes.length];
        facs2.push({name:rt.name,icon:rt.icon,keyword:rt.keyword,atDistance:pos});
      }
      facs2.sort((a,b)=>a.atDistance-b.atDistance);
      const segs2=generateTactileSegments(dist2,pct2);
      const keyNames2=facs2.slice(0,3).map(f=>f.keyword);
      routes.push({
        totalDistance:dist2,tactileDistance:Math.floor(dist2*pct2/100),tactilePercent:pct2,
        restFacilities:facs2,tactileSegments:segs2,
        summary:'距离较短，途经'+keyNames2.join('、')
      });
      routes.sort((a,b)=>b.tactilePercent-a.tactilePercent);
      return routes;
    }
    function generateTactileSegments(totalDist,tactilePct){
      const segs=[];
      const tactileCount=Math.floor(Math.random()*3)+3;
      const tactileSegDist=Math.floor(totalDist*tactilePct/100);
      const avgSegDist=Math.floor(tactileSegDist/tactileCount);
      let remaining=tactileSegDist;
      for(let i=0;i<tactileCount;i++){
        const segLen=i===tactileCount-1?remaining:Math.floor(avgSegDist*(0.6+Math.random()*0.8));
        remaining=Math.max(0,remaining-segLen);
        segs.push({tactile:true,percent:Math.round(segLen/totalDist*10000)/100,length:segLen});
      }
      // Add gaps
      const gapTotal=totalDist-tactileSegDist;
      const gapCount=tactileCount+(Math.random()>0.5?1:0);
      const avgGap=Math.floor(gapTotal/gapCount);
      let gapRemaining=gapTotal;
      const result=[];
      let gapIdx=0;
      for(let i=0;i<segs.length;i++){
        const gapLen=gapIdx===gapCount-1?gapRemaining:Math.floor(avgGap*(0.4+Math.random()*1.2));
        gapRemaining=Math.max(0,gapRemaining-gapLen);
        result.push({tactile:false,percent:Math.round(gapLen/totalDist*10000)/100,length:gapLen});
        result.push(segs[i]);
        gapIdx++;
      }
      if(gapRemaining>0){result.push({tactile:false,percent:Math.round(gapRemaining/totalDist*10000)/100,length:gapRemaining});}
      return result;
    }

    function computeVolunteerLevel(score){
      if(score>=2000)return 'S';
      if(score>=1000)return 'A';
      return 'B';
    }
    function volunteerLevelName(score){
      if(score>=2000)return '微光大使';
      if(score>=1000)return '黄金';
      if(score>=500)return '白银';
      return '青铜';
    }
    function volunteerLevelProgress(score){
      if(score>=2000)return 100;
      if(score>=1000)return Math.min(99,Math.round(50+(score-1000)/1000*50));
      if(score>=500)return Math.min(99,Math.round(20+(score-500)/500*30));
      return Math.min(99,Math.round(score/500*20));
    }
    function volunteerBadges(score){
      return [
        {name:'青铜',threshold:0,current:score<500},
        {name:'白银',threshold:500,current:score>=500&&score<1000},
        {name:'黄金',threshold:1000,current:score>=1000&&score<2000},
        {name:'微光大使',threshold:2000,current:score>=2000}
      ];
    }
    function formatRestriction(until){
      if(!until)return '';
      const left=until-Date.now();
      if(left<=0)return '';
      const h=Math.floor(left/3600000);
      const m=Math.ceil((left%3600000)/60000);
      return h+'小时'+m+'分钟';
    }
    function isRestricted(){return state.restrictedUntil>Date.now();}
    function updateVolunteerScore(delta,reason){
      state.volunteerScore=Math.max(0,state.volunteerScore+delta);
      const oldLevel=state.volunteerLevel;
      state.volunteerLevel=computeVolunteerLevel(state.volunteerScore);
      saveVolunteerScore();
      if(delta>0){haptic('SUCCESS');playEarcon('success');}
      else if(delta<0){haptic('ERROR');playEarcon('error');}
      let msg=(delta>0?'+':'')+delta+'积分，'+reason+'，当前'+state.volunteerScore+'分';
      if(state.volunteerLevel!==oldLevel){msg+='，恭喜升级为'+state.volunteerLevel+'级'+volunteerLevelName(state.volunteerScore);playEarcon('success');haptic('SUCCESS');}
      show((delta>0?'+':'')+delta+' 积分：'+reason+'，当前 '+state.volunteerScore+' 分');
      say(msg);
    }
    function saveVolunteerScore(){
      try{localStorage.setItem('jieguang_volunteer',JSON.stringify({score:state.volunteerScore,level:state.volunteerLevel,restrictedUntil:state.restrictedUntil}));}catch(e){}
    }
    function loadVolunteerScore(){
      try{
        const raw=localStorage.getItem('jieguang_volunteer');
        if(!raw)return;
        const v=JSON.parse(raw);
        if(typeof v.score==='number')state.volunteerScore=v.score;
        if(v.level)state.volunteerLevel=v.level;
        if(v.restrictedUntil)state.restrictedUntil=v.restrictedUntil;
      }catch(e){}
    }

    function generateMicroRoute(destination){
      const landmarks=['盲道','斑马线','无障碍电梯','台阶','坡道','共享单车停放区','公交站','树荫路段','建筑物入口'];
      const clocks=['12','1','2','3','9','10','11','12'];
      const route=[];
      let remaining=Math.floor(Math.random()*150)+80;
      let stepCount=Math.floor(Math.random()*4)+3;
      for(let i=0;i<stepCount;i++){
        const dist=Math.min(remaining,Math.floor(Math.random()*40)+25);
        remaining-=dist;
        const clock=clocks[i%clocks.length];
        const landmark=landmarks[Math.floor(Math.random()*landmarks.length)];
        route.push({clock,distance:dist,landmark:i===stepCount-1?'到达'+destination:'前方有'+landmark,instruction:clockToText(clock)+'，'+dist+'米处'});
      }
      route[route.length-1].instruction='即将到达';
      route[route.length-1].landmark=destination+'就在'+clockToText(route[route.length-1].clock)+'，请放慢脚步';
      return route;
    }
    function formatNavStep(step){if(!step)return'正在规划路线';return '你的'+clockToText(step.clock)+'，'+step.clock+'点钟方向，'+step.distance+'米处。'+step.landmark;}
    function announceWithHaptic(step){

    function directionHaptic(clock){
      if(!navigator.vibrate)return;
      const c=parseInt(clock);
      if(c===12){navigator.vibrate(60);}
      else if(c>=1&&c<=2){navigator.vibrate([60,80,60]);}
      else if(c===3){navigator.vibrate([60,80,60,80,60]);}
      else if(c>=4&&c<=5){navigator.vibrate([120,80,60]);}
      else if(c===6){navigator.vibrate(300);}
      else if(c>=7&&c<=8){navigator.vibrate([60,80,120]);}
      else if(c===9){navigator.vibrate([60,80,60,80,120]);}
      else if(c>=10&&c<=11){navigator.vibrate([60,120]);}
    }
    function advanceNavStep(){

      state.navCurrentStep++;
      if(state.navCurrentStep>=state.navRoute.length){
        state.navCurrentStep=state.navRoute.length-1;
        announceArrival();return;
      }
      const step=state.navRoute[state.navCurrentStep];
      const text=formatNavStep(step);
      say(text);announceWithHaptic(step);render();
      state.navLog.push(text);if(state.navLog.length>20)state.navLog.shift();
    }

    function parseRoomVoice(text){
      let name='';let topic='';
      const nameMatch=text.match(/房间(?:名称|叫|是|为)?[\s为：:]?(.*?)(?:[，,。；;]|话题|聊|关于|$)/);
      if(nameMatch&&nameMatch[1]&&nameMatch[1].trim()){name=nameMatch[1].trim();}
      const topicMatch=text.match(/(?:话题|聊|关于|说)[\s为：:]?(.*)/);
      if(topicMatch&&topicMatch[1]&&topicMatch[1].trim()){topic=topicMatch[1].trim();}
      if(!name&&topic){name=topic.slice(0,12);}
      if(name&&!topic){topic=name;}
      return{name,topic};
    }

    function startSpeechCommand(globalMode=false){
      if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)){
        haptic('ERROR');playEarcon('error');
        show('当前浏览器不支持语音识别');say('请使用 Chrome 或 Safari 体验语音命令');stopGlobalVoice('不支持');return;
      }
      const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
      if(globalRec){try{globalRec.stop();}catch(err){}globalRec=null;}
      const rec=new SR();
      globalRec=rec;
      rec.lang='zh-CN';
      rec.interimResults=false;
      rec.maxAlternatives=1;
      rec.continuous=false;
      const sessionId=voiceSessionCount;
      rec.onresult=(e)=>{
        if(sessionId!==voiceSessionCount)return;
        const cmd=e.results[0][0].transcript.trim();
        if(!cmd){stopGlobalVoice('空命令');return;}
        state.voiceActive=false;
        renderGlobalMic();
        haptic('AI_SUCCESS');playEarcon('success');
        show('识别到：'+cmd);
        handleGlobalCommand(cmd);
      };
      rec.onerror=(e)=>{
        if(sessionId!==voiceSessionCount)return;
        state.voiceActive=false;
        renderGlobalMic();
        if(e.error==='no-speech'||e.error==='audio-capture'){
          haptic('WARNING');playEarcon('warning');
          show('没听清，请靠近麦克风再说一次');say('没听清，请靠近麦克风再说一次');
        }else if(e.error==='not-allowed'){
          haptic('ERROR');playEarcon('error');
          show('麦克风权限被拒绝');say('无法使用麦克风，请在浏览器设置中允许权限');
        }else{
          haptic('ERROR');playEarcon('error');
          show('语音识别失败，请重试');say('语音识别失败，请重试');
        }
      };
      rec.onend=()=>{
        if(sessionId!==voiceSessionCount)return;
        globalRec=null;
        state.voiceActive=false;
        renderGlobalMic();
      };
      try{rec.start();}catch(err){stopGlobalVoice('启动失败');}
    }
    window.startSpeechCommand=startSpeechCommand;
    function handleGlobalCommand(cmd){
      // 1. Handle arrival scenario follow-up
      if(state.pendingScenario==='arrival'){
        if(cmd.includes('识别')||cmd.includes('拍照')||cmd.includes('拍')||cmd.includes('读')){
          state.pendingScenario=null;
          setMode('商品识别');
          return;
        }
        if(cmd.includes('不用')||cmd.includes('不')||cmd.includes('返回')){
          state.pendingScenario=null;
          say('好的，保持在出行模式');
          return;
        }
      }
      // 2. Handle pending voice navigation confirmation
      if(state.pendingVoiceCommand){
        const confirmWords=/确认|好|是的|去|打开|跳转|可以|行|没错|对|进入|开始|执行|同意/;
        const cancelWords=/取消|不|否|算了|返回|回去|不用|停止|结束|拒绝/;
        if(confirmWords.test(cmd)){
          const action=state.pendingVoiceCommand;
          state.pendingVoiceCommand=null;
          clearTimeout(state.pendingVoiceTimer);
          if(action.execute){action.execute();}
          return;
        }
        if(cancelWords.test(cmd)){
          state.pendingVoiceCommand=null;
          clearTimeout(state.pendingVoiceTimer);
          haptic('SUCCESS');playEarcon('success');
          show('已取消');say('已取消，需要时请重新唤醒语音助手');
          return;
        }
        say('没听清，请说确认或取消');
        listenForConfirmation(1);
        return;
      }
      // 3. Resolve command to action
      const action=resolveVoiceAction(cmd);
      if(!action){
        say('未识别的命令，你可以说：我要去超市、拍照、出行游玩、语音房间、紧急求助、返回');
        return;
      }
      if(action.direct){
        action.execute();
        return;
      }
      // 4. Need confirmation before executing
      state.pendingVoiceCommand=action;
      show('即将'+action.text+'，请说确认或取消');
      if(state.pendingVoiceTimer)clearTimeout(state.pendingVoiceTimer);
      say('即将'+action.text+'，请说确认，或说取消',()=>listenForConfirmation(0));
    }
    function listenForConfirmation(retry){
      if(!state.pendingVoiceCommand)return;
      setTimeout(()=>{
        if(!state.pendingVoiceCommand)return;
        startSpeechCommand(true);
        state.pendingVoiceTimer=setTimeout(()=>{
          if(state.pendingVoiceCommand){
            state.pendingVoiceCommand=null;
            show('语音确认已超时');say('没有听到确认，已取消');
          }
        },8000);
      },retry?400:200);
    }

      if(cmd.includes('用药')||cmd.includes('吃药')){return{text:'打开用药管理',execute:()=>goPanel('medicine')};}
      if(cmd.includes('证件')){return{text:'打开证件识别',execute:()=>goPanel('idcard')};}
      if(cmd.includes('创建房间')||cmd.includes('开房间')||cmd.includes('新建房间')){return{text:'创建语音房间',execute:()=>openCreateRoom()};}
      if(cmd.includes('斑马线')||cmd.includes('红绿灯')||cmd.includes('过街')){return{text:'打开斑马线助手',execute:()=>openCrosswalk()};}
      if(cmd.includes('帮助')||cmd.includes('怎么用')){return{text:'打开帮助',execute:()=>goPanel('help')};}
      return null;
    }
    function processTravelScenario(dest){
      state.destination=dest;
      state.navType='walk';
      state.navTypeText='步行导航';
      state.pendingScenario='traveling';
      navigateTo('travel');
      setTimeout(()=>{
        say('已为你规划去'+dest+'的无障碍步行路线，前方路况将自动播报。');
        startTravelNav();
        state.travelAutoRefresh=true;
        if(state.travelRefreshTimer)clearInterval(state.travelRefreshTimer);
        state.travelRefreshTimer=setInterval(()=>{
          if(state.route!=='travel'||!state.travelAutoRefresh){clearInterval(state.travelRefreshTimer);state.travelRefreshTimer=null;return;}
          refreshMapDataSilent(true);
        },30000);
        if(state.arrivalTimer)clearTimeout(state.arrivalTimer);
        state.arrivalTimer=setTimeout(()=>{
          state.pendingScenario='arrival';
          say('已到达'+dest+'附近，是否需要切换到 AI 识物模式？请说“识别”或“拍照”。');
        },12000);
      },400);
    }
    window.inputDestinationByVoice=()=>{toggleTravelVoiceInput('dest');};
    window.refreshMapDataSilent=async(announce=false)=>{
      try{const data=await mapAPI.fetchNearby(39.9042,116.4074);state.nearbyFacilities=data;state.offlineMode=false;if(state.route==='travel')render();if(announce){say('附近设施已刷新，共'+data.length+'处');}}
      catch(e){state.offlineMode=true;if(state.route==='travel')render();if(announce){say('网络断开，使用离线缓存数据');}}
    };
    window.reportBarrier=()=>{haptic('WARNING');playEarcon('warning');state.sheet={title:'障碍上报',body:'你可以直接说：盲道被共享单车挡住了。系统会记录位置、时间和照片，交给志愿者或城市维护方核实。'};render();say('请描述障碍')};
    window.requestVolunteerEscort=()=>{haptic('SOCIAL');playEarcon('volunteer');state.call=true;render();say('正在为你连接远程陪行志愿者')};
    window.scanMedicine=()=>{
      const meds=[
        {name:'布洛芬缓释胶囊',usage:'成人一次一粒，一日两次，饭后服用',expiry:'2027-08',reminder:'08:00,20:00'},
        {name:'复方甘草片',usage:'一次两片，一日三次，含服',expiry:'2026-12',reminder:'08:00,12:00,18:00'}
      ];
      const m=meds[Math.floor(Math.random()*meds.length)];
      state.medicines.unshift({id:Date.now(),...m});
      haptic('AI_SUCCESS');playEarcon('success');
      render();say('识别到药品：'+m.name+'，'+m.usage+'，有效期至'+m.expiry);
    };
    window.addMedicineReminder=()=>{haptic('AI_RECOGNIZE');playEarcon('ai');state.sheet={title:'添加用药提醒',body:'你可以说：每天早上 8 点提醒我吃药。系统会自动识别药品名称、时间和剂量，并在指定时间语音提醒。'};render();say('请说出用药提醒')};
    window.scanIdCard=()=>{
      const cards=[
        {type:'身份证',number:'110101********5678',name:'识别成功',note:'姓名已脱敏，仅本地存储'},
        {type:'银行卡',number:'6228 **** **** 9012',name:'建设银行储蓄卡',note:'仅显示后四位'}
      ];
      const c=cards[Math.floor(Math.random()*cards.length)];
      state.idcards.unshift(c);
      haptic('AI_SUCCESS');playEarcon('success');
      render();say('识别到'+c.type+'，'+c.name+'，号码已脱敏处理');
    };
    window.startIndoorNav=()=>{haptic('NAVIGATE');playEarcon('navigate');state.sheet={title:'开始室内导航',body:'已进入朝阳大悦城室内导航。前方 10 米有无障碍电梯，可直达 7 楼餐饮区。右侧 5 米处有无障碍卫生间。'};render();say('已开始室内导航，前方 10 米有无障碍电梯')};
    window.searchIndoorBuilding=()=>{haptic('AI_RECOGNIZE');playEarcon('ai');state.sheet={title:'搜索建筑',body:'你可以语音搜索：协和医院、西直门地铁站、朝阳大悦城。系统会显示该建筑的无障碍路线图。'};render();say('请说出要搜索的建筑名称')};
    window.shareLocationNow=()=>{haptic('SUCCESS');playEarcon('success');show('位置已共享给家人');say('你的实时位置已共享给家人')};
    window.shareLocationWith=(id)=>{const m=state.familyMembers.find(x=>x.id===id);if(m){haptic('SUCCESS');playEarcon('success');show('已向 '+m.name+' 共享位置');say('已向'+m.name+'共享位置')}};
    window.addFamilyMember=()=>{haptic('AI_RECOGNIZE');playEarcon('ai');state.sheet={title:'添加家人',body:'输入家人手机号并设置称呼。授权后，家人可以在紧急情况下查看你的位置，并接收 SOS 通知。'};render();say('请添加家人信息')};
    window.refreshTransit=()=>{
      state.transitLines.forEach(t=>{t.arrival=(Math.floor(Math.random()*8)+1)+'分钟';t.next=(Math.floor(Math.random()*15)+8)+'分钟';});
      haptic('SUCCESS');playEarcon('success');
      render();say('到站信息已刷新');
    };
    window.setTransitAlert=()=>{haptic('WARNING');playEarcon('warning');state.sheet={title:'设置到站提醒',body:'选择线路后，系统会在车辆到达前 2 分钟语音提醒你准备上车，并播报无障碍设施位置。'};render();say('请设置到站提醒线路')};
    function attachGestures(){
      const appEl=document.getElementById('app');
      if(!appEl||appEl._gesturesAttached)return;
      appEl._gesturesAttached=true;
      const EDGE=34,LONG_PRESS=800,DOUBLE_TAP_GAP=350;
      let startX=0,startY=0,startTime=0,startCount=0;
      let longTimer=null,lastTwoTap=0;
      let gestureHandled=false;
      function showGesture(text){
        if(gestureIndicator){gestureIndicator.textContent=text;gestureIndicator.classList.add('show');setTimeout(()=>gestureIndicator.classList.remove('show'),900);}
        if(gestureAnnounce){gestureAnnounce.textContent=text;}
        announceGesture(text);
      }
      function clearLong(){if(longTimer){clearTimeout(longTimer);longTimer=null;}}
      function isNearEdge(t){const w=window.innerWidth,h=window.innerHeight;return {bottom:t.clientY>h-EDGE,left:t.clientX<EDGE,right:t.clientX>w-EDGE};}
      appEl.addEventListener('touchstart',e=>{
        if(state.call)return;
        const t=e.touches;
        startCount=t.length;
        gestureHandled=false;
        if(t.length===5){
          clearLong();
          longTimer=setTimeout(()=>{
            gestureHandled=true;clearLong();
            haptic('SOS');playEarcon('sos');showGesture('五指长按：触发 SOS 紧急求助');
            setTimeout(triggerSOS,80);
          },LONG_PRESS);
        }else if(t.length===2){
          const now=Date.now();
          if(now-lastTwoTap<DOUBLE_TAP_GAP){
            gestureHandled=true;clearLong();lastTwoTap=0;
            haptic('AI_RECOGNIZE');playEarcon('ai');showGesture('双指双击：打开 AI 识物导航');
            setTimeout(goCamera,80);
          }else{lastTwoTap=now;}
        }else if(t.length===3){
          startX=t[0].clientX;startY=t[0].clientY;startTime=Date.now();
        }else if(t.length===1){
          startX=t[0].clientX;startY=t[0].clientY;startTime=Date.now();
        }else{startX=0;startY=0;startTime=0;}
      },{passive:false});
      appEl.addEventListener('touchmove',e=>{
        if(state.call)return;
        const t=e.touches;
        if(t.length===5&&longTimer){clearLong();}
      },{passive:true});
      appEl.addEventListener('touchend',e=>{
        if(state.call)return;
        clearLong();
        if(gestureHandled){startX=0;startY=0;startCount=0;return;}
        const t=e.changedTouches[0];
        const endX=t.clientX,endY=t.clientY;
        const dx=endX-startX,dy=endY-startY;
        const absX=Math.abs(dx),absY=Math.abs(dy);
        const edge=isNearEdge({clientX:startX,clientY:startY});
        const duration=Date.now()-startTime;
        if(startCount===3&&absX>70&&absY<90&&dx<0){
          gestureHandled=true;
          haptic('NAVIGATE');playEarcon('navigate');showGesture('三指向左滑：打开无障碍设施出行页');
          setTimeout(()=>goPanel('travel'),80);
          startX=0;startY=0;startCount=0;return;
        }
        if(startCount===1){
          if(edge.bottom&&absY>60&&dy<-40){
            gestureHandled=true;e.preventDefault();
            haptic('SOCIAL');playEarcon('volunteer');showGesture('底部上滑：呼叫志愿者');
            setTimeout(()=>goPanel('callVolunteer'),80);
            startX=0;startY=0;startCount=0;return;
          }
          if(edge.left&&absX>60&&dx>40){
            gestureHandled=true;e.preventDefault();
            haptic('NAVIGATE');playEarcon('navigate');showGesture('左边缘右滑：返回上一页');
            setTimeout(goBack,80);
            startX=0;startY=0;startCount=0;return;
          }
          if(edge.right&&absX>60&&dx<-40){
            gestureHandled=true;e.preventDefault();
            haptic('AI_RECOGNIZE');playEarcon('ai');showGesture('右边缘左滑：打开全局语音助手');
            setTimeout(startGlobalVoice,80);
            startX=0;startY=0;startCount=0;return;
          }
          if(absX>80&&absY<60&&duration<500){
            if(dx>0&&state.route!=='camera'){if(state.drawer)closeDrawer();else goCamera();}
            else if(dx<0&&!state.drawer&&state.route==='camera')openDrawer();
          }
        }
        startX=0;startY=0;startCount=0;
      },{passive:false});
      appEl.addEventListener('touchcancel',()=>{clearLong();startX=0;startY=0;startCount=0;},{passive:true});
    }
    let speechReady=false;
    function attachButtonSpeech(){
      const appEl=document.getElementById('app');
      if(!appEl||appEl._buttonSpeechAttached)return;
      appEl._buttonSpeechAttached=true;
      appEl.addEventListener('click',(e)=>{
        if(!speechReady){
          speechReady=true;
          if('speechSynthesis' in window){window.speechSynthesis.cancel();window.speechSynthesis.resume();}
        }
        const btn=e.target.closest('button,[role="button"]');
        if(!btn)return;
        if(btn.id==='globalMic')return;
        const label=(btn.getAttribute('aria-label')||btn.textContent||'按钮').replace(/\s+/g,' ').trim();
        if(!label)return;
        if(state.lastSpoken&&state.lastSpoken.includes(label))return;
        const urgent=/SOS|紧急|求助|挂断|停止导航/.test(label);
        if(urgent){haptic('WARNING');playEarcon('warning');}
        else{haptic('LIGHT');}
        say(label);
      },true);
    }
    loadState();
    if(location.hash&&location.hash.length>1){
      const r=location.hash.slice(1);
      if(routeNames[r]){state.route=r;state.historyStack=[r];}
    }
    attachButtonSpeech();
    render();
  </script>
