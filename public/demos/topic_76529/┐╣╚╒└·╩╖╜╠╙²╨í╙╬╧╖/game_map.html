<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>解放全中国 - 爱国教育小游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", "SimHei", sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }
        .game-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        /* 游戏标题 */
        .game-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .game-title {
            font-size: 36px;
            font-weight: bold;
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
            margin-bottom: 8px;
            letter-spacing: 4px;
        }
        .game-subtitle {
            font-size: 14px;
            color: #8899aa;
            letter-spacing: 2px;
        }
        /* 状态栏 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status-label {
            font-size: 13px;
            color: #8899aa;
        }
        .status-value {
            font-size: 20px;
            font-weight: bold;
            color: #ffd700;
        }
        .progress-bar {
            flex: 1;
            max-width: 300px;
            height: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            overflow: hidden;
            margin: 0 20px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #de2910 0%, #ff6b6b 100%);
            border-radius: 6px;
            transition: width 0.5s ease;
            width: 35%;
        }
        /* 主游戏区域 */
        .game-main {
            display: flex;
            gap: 20px;
        }
        .map-wrapper {
            flex: 1;
            background: linear-gradient(135deg, #f5e6d3 0%, #e8d4b8 100%);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 3px solid #8b4513;
            position: relative;
            overflow: hidden;
        }
        /* 复古纸张纹理 */
        .map-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(ellipse at 20% 30%, rgba(139, 69, 19, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(139, 69, 19, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
        }
        .map-wrapper svg {
            width: 100%;
            height: auto;
            position: relative;
            z-index: 2;
        }
        /* 省份样式 */
        .province {
            fill: #e8d4b8;
            stroke: #8b4513;
            stroke-width: 1;
            transition: fill 0.3s ease;
            cursor: default;
        }
        .province:hover {
            fill: #d4c4a8;
        }
        /* 城市样式 */
        .city {
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .city:hover {
            transform: scale(1.15);
        }
        .city-hitarea {
            fill: transparent;
        }
        .city-base {
            fill: #fff;
            stroke: #333;
            stroke-width: 2;
        }
        .city-name {
            font-size: 11px;
            fill: #333;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
            pointer-events: none;
        }
        /* 城市状态颜色 */
        .city-occupied .city-base {
            fill: #ffcccc;
            stroke: #cc0000;
        }
        .city-occupied .city-name {
            fill: #8b0000;
        }
        .city-free .city-base {
            fill: #ccffcc;
            stroke: #00aa00;
        }
        .city-free .city-name {
            fill: #006600;
        }
        .city-battle .city-base {
            fill: #ffddaa;
            stroke: #ff6600;
        }
        .city-battle .city-name {
            fill: #cc5500;
        }
        /* 侧边栏 */
        .sidebar {
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .panel {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 18px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .panel-title {
            font-size: 16px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
        }
        /* 图例 */
        .legend-list {
            list-style: none;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            font-size: 13px;
        }
        .legend-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
        }
        .legend-icon.occupied {
            background: #ffcccc;
            border: 2px solid #cc0000;
        }
        .legend-icon.free {
            background: #ccffcc;
            border: 2px solid #00aa00;
        }
        .legend-icon.battle {
            background: #ffddaa;
            border: 2px solid #ff6600;
        }
        /* 城市信息面板 */
        .city-info {
            display: none;
        }
        .city-info.active {
            display: block;
        }
        .city-info-name {
            font-size: 22px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 5px;
        }
        .city-info-province {
            font-size: 13px;
            color: #8899aa;
            margin-bottom: 15px;
        }
        .city-info-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .status-occupied {
            background: rgba(204, 0, 0, 0.2);
            color: #ff6666;
            border: 1px solid #cc0000;
        }
        .status-free {
            background: rgba(0, 170, 0, 0.2);
            color: #66ff66;
            border: 1px solid #00aa00;
        }
        .status-battle {
            background: rgba(255, 102, 0, 0.2);
            color: #ffaa44;
            border: 1px solid #ff6600;
        }
        .city-info-desc {
            font-size: 13px;
            color: #aabbcc;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        .action-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .btn-battle {
            background: linear-gradient(135deg, #de2910 0%, #ff6b6b 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(222, 41, 16, 0.4);
        }
        .btn-battle:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(222, 41, 16, 0.5);
        }
        .btn-battle:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-learn {
            background: linear-gradient(135deg, #1890ff 0%, #40a9ff 100%);
            color: white;
            margin-top: 10px;
        }
        .btn-learn:hover {
            transform: translateY(-2px);
        }
        /* 默认提示 */
        .default-tip {
            text-align: center;
            padding: 30px 10px;
            color: #667788;
            font-size: 13px;
            line-height: 1.8;
        }
        .default-tip .icon {
            font-size: 40px;
            margin-bottom: 15px;
            opacity: 0.5;
        }
        /* 成就面板 */
        .achievement-list {
            list-style: none;
        }
        .achievement-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            font-size: 12px;
            color: #667788;
        }
        .achievement-item.unlocked {
            color: #ffd700;
        }
        .achievement-icon {
            font-size: 18px;
            width: 28px;
            text-align: center;
        }
        /* 地图装饰 */
        .map-title {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
            font-weight: bold;
            color: #8b0000;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
            z-index: 10;
            letter-spacing: 4px;
        }
        .compass {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            z-index: 10;
        }
        /* 动画效果 */
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        .city-battle {
            animation: pulse 1s infinite;
        }
    </style>
</head>

        };
        
        // 城市详细描述
        const cityDescriptions = {
            '哈尔滨': '哈尔滨是东北重镇，1931年九一八事变后沦陷，是东北抗日联军的主要活动区域之一。',

            '北京': '北平（今北京）是华北重镇，1937年七七事变后沦陷，抗日战争全面爆发。',
            '天津': '天津是北方重要港口城市，1937年沦陷，是日本侵略华北的重要据点。',
            '石家庄': '石家庄是华北交通枢纽，是晋察冀抗日根据地的重要区域。',

            '济南': '济南是山东省会，是华北抗战的重要城市，台儿庄战役就在山东发生。',
            '南京': '南京是民国首都，1937年南京大屠杀是中华民族永远的伤痛，30万同胞遇难。',
            '上海': '上海是中国最大城市，淞沪会战是抗战初期规模最大、战斗最惨烈的战役。',
            '杭州': '杭州是浙江省会，是东南沿海的重要城市，1937年底沦陷。',
            '武汉': '武汉是华中战略要地，1938年武汉会战是抗战中规模最大的战役，此后抗战进入相持阶段。',
            '长沙': '长沙是湖南省会，三次长沙会战是抗战中的重要胜利，沉重打击了日军。',
            '广州': '广州是华南最大城市，1938年沦陷，是日本侵略华南的重要据点。',
            '成都': '成都是四川省会，是抗战大后方，是中国战时的重要文化和经济中心。',
            '重庆': '重庆是抗战时期的陪都，是中国抗战的指挥中心，遭受了日军长达5年的大轰炸。',
            '西安': '西安是陕西省会，是西北战略要地，是八路军总部所在地，也是抗战的重要后方基地。',
            '兰州': '兰州是甘肃省会，是西北交通枢纽，是抗战时期重要的国际援华通道。',
            '昆明': '昆明是云南省会，是西南大后方，是滇缅公路的起点，也是飞虎队的主要基地。',
            '乌鲁木齐': '乌鲁木齐是新疆首府，是西北边疆重镇，抗战时期始终在我国控制之下。'
        };
        
        // DOM元素
        const cities = document.querySelectorAll('.city');
        const defaultTip = document.getElementById('defaultTip');
        const cityInfo = document.getElementById('cityInfo');
        const cityName = document.getElementById('cityName');
        const cityProvince = document.getElementById('cityProvince');
        const cityStatus = document.getElementById('cityStatus');
        const cityDesc = document.getElementById('cityDesc');
        const battleBtn = document.getElementById('battleBtn');
        
        // 点击城市
        cities.forEach(city => {
            city.addEventListener('click', function() {
                const name = this.dataset.city;
                const status = this.dataset.status;
                const data = citiesData[name];
                
                // 显示城市信息
                defaultTip.style.display = 'none';
                cityInfo.classList.add('active');
                
                cityName.textContent = name;
                cityProvince.textContent = data.province;
                cityDesc.textContent = cityDescriptions[name] || '暂无详细描述';
                
                // 更新状态标签
                cityStatus.className = 'city-info-status';
                if (status === 'occupied') {
                    cityStatus.classList.add('status-occupied');
                    cityStatus.textContent = '🇯🇵 已沦陷';
                    battleBtn.textContent = '⚔️ 开始战斗';
                    battleBtn.disabled = false;
                } else if (status === 'free') {
                    cityStatus.classList.add('status-free');
                    cityStatus.textContent = '🇨🇳 已解放';
                    battleBtn.textContent = '✅ 已解放';
                    battleBtn.disabled = true;
                } else if (status === 'battle') {
                    cityStatus.classList.add('status-battle');
                    cityStatus.textContent = '⚔️ 战斗中';
                    battleBtn.textContent = '⚔️ 继续战斗';
                    battleBtn.disabled = false;
                }
            });
        });
        
        // 战斗按钮
        battleBtn.addEventListener('click', function() {
            if (!this.disabled) {
                alert('🎮 进入战斗模式！\n\n先学习历史知识，然后通过答题获得子弹，消灭日本侵略者，解放这座城市！');
            }
        });
        
        // 计算进度
        function updateProgress() {
            const total = cities.length;
            let free = 0;
            cities.forEach(city => {
                if (city.dataset.status === 'free') free++;
            });
            const percent = (free / total * 100).toFixed(0);
            document.getElementById('freeCount').textContent = `${free} / ${total}`;
            document.getElementById('progressFill').style.width = percent + '%';
        }
        
        updateProgress();
    </script>
