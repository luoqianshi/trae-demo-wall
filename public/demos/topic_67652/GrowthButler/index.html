<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#FF9F43" />
  <title>宝宝成长积分管家</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- 顶部栏：宝宝选择器 + 操作人选择器 -->
    <header class="app-header">
      <div class="header-left">
        <button id="babySelectorBtn" class="baby-selector" aria-label="切换宝宝">
          <span id="currentBabyAvatar" class="baby-avatar-sm">👶</span>
          <span id="currentBabyName" class="baby-name-sm">未选择</span>
          <span class="caret">▾</span>
        </button>
      </div>
      <div class="header-right">
        <button id="operatorSelectorBtn" class="operator-selector" aria-label="切换操作人">
          <span class="op-label">操作人</span>
          <span id="currentOperatorName" class="op-name">未选择</span>
          <span class="caret">▾</span>
        </button>
      </div>
    </header>

    <main class="app-main">
      <!-- 首页视图 -->
      <section id="view-home" class="view view-active">
        <!-- 总积分卡片 -->
        <div class="total-points-card">
          <div class="baby-info">
            <span id="homeBabyAvatar" class="baby-avatar-lg">👶</span>
            <div class="baby-meta">
              <div id="homeBabyName" class="baby-name-lg">未选择宝宝</div>
              <div id="homeBabyBirthday" class="baby-birthday"></div>
            </div>
          </div>
          <div class="total-points-wrap">
            <div id="totalPoints" class="total-points">0</div>
            <div class="total-points-label">总积分</div>
          </div>
        </div>

        <!-- 今日摘要 -->
        <div class="today-summary card">
          <div class="card-title">今日摘要</div>
          <div class="summary-grid">
            <div class="summary-item add">
              <div id="todayAddCount" class="summary-num">0</div>
              <div class="summary-label">加分次数</div>
            </div>
            <div class="summary-item deduct">
              <div id="todayDeductCount" class="summary-num">0</div>
              <div class="summary-label">扣分次数</div>
            </div>
            <div class="summary-item net">
              <div id="todayNetPoints" class="summary-num">0</div>
              <div class="summary-label">净积分</div>
            </div>
          </div>
        </div>

        <!-- 趋势图 -->
        <div class="trend-card card">
          <div class="card-title-row">
            <div class="card-title">积分趋势</div>
            <div class="trend-tabs">
              <button class="trend-tab active" data-range="7">7天</button>
              <button class="trend-tab" data-range="30">30天</button>
            </div>
          </div>
          <canvas id="trendChart" width="320" height="180"></canvas>
        </div>

        <!-- 快捷加分/扣分 -->
        <div class="quick-actions card">
          <div class="card-title">快捷操作</div>
          <div id="quickAddList" class="quick-group">
            <div class="quick-group-label">加分行为</div>
            <div class="quick-btns"></div>
          </div>
          <div id="quickDeductList" class="quick-group">
            <div class="quick-group-label">扣分行为</div>
            <div class="quick-btns"></div>
          </div>
        </div>

        <!-- 无宝宝引导 -->
        <div id="homeEmptyGuide" class="empty-guide hidden">
          <div class="empty-emoji">👶</div>
          <div class="empty-text">还没有添加宝宝，先去设置页添加第一个宝宝吧～</div>
          <button class="btn btn-primary" id="goSettingsFromHome">去添加宝宝</button>
        </div>
      </section>

      <!-- 记录视图 -->
      <section id="view-records" class="view">
        <div class="filter-tabs card">
          <button class="filter-tab active" data-range="today">今天</button>
          <button class="filter-tab" data-range="7">近7天</button>
          <button class="filter-tab" data-range="30">近30天</button>
          <button class="filter-tab" data-range="all">全部</button>
        </div>
        <div id="timelineList" class="timeline-list"></div>
        <div id="recordsEmpty" class="empty-state hidden">
          <div class="empty-emoji">📝</div>
          <div class="empty-text">暂无记录</div>
        </div>
      </section>

      <!-- 奖励视图 -->
      <section id="view-rewards" class="view">
        <div class="rewards-section">
          <div class="section-header">
            <div class="section-title">奖励列表</div>
            <button class="btn btn-small btn-primary" id="addRewardBtn">+ 新增</button>
          </div>
          <div id="rewardList" class="reward-list"></div>
          <div id="rewardsEmpty" class="empty-state hidden">
            <div class="empty-emoji">🎁</div>
            <div class="empty-text">还没有奖励，点击新增添加一个吧</div>
          </div>
        </div>

        <div class="exchanges-section">
          <div class="section-header">
            <div class="section-title">兑换申请</div>
          </div>
          <div id="exchangeList" class="exchange-list"></div>
          <div id="exchangesEmpty" class="empty-state hidden">
            <div class="empty-emoji">📭</div>
            <div class="empty-text">暂无兑换申请</div>
          </div>
        </div>
      </section>

      <!-- 设置视图 -->
      <section id="view-settings" class="view">
        <!-- 宝宝管理 -->
        <div class="settings-section">
          <div class="section-header">
            <div class="section-title">宝宝管理</div>
            <button class="btn btn-small btn-primary" id="addBabyBtn">+ 添加</button>
          </div>
          <div id="babyList" class="baby-list"></div>
          <div id="babiesEmpty" class="empty-state hidden">
            <div class="empty-emoji">👶</div>
            <div class="empty-text">还没有宝宝，点击添加创建第一个</div>
          </div>
        </div>

        <!-- 行为管理 -->
        <div class="settings-section">
          <div class="section-header">
            <div class="section-title">行为管理</div>
            <button class="btn btn-small btn-primary" id="addBehaviorBtn">+ 新增</button>
          </div>
          <div id="behaviorList" class="behavior-list"></div>
        </div>

        <!-- 操作人管理 -->
        <div class="settings-section">
          <div class="section-header">
            <div class="section-title">操作人管理</div>
            <button class="btn btn-small btn-primary" id="addOperatorBtn">+ 添加</button>
          </div>
          <div id="operatorList" class="operator-list"></div>
        </div>
      </section>
    </main>

    <!-- 底部导航栏 -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-view="home">
        <span class="nav-icon">🏠</span>
        <span class="nav-text">首页</span>
      </button>
      <button class="nav-item" data-view="records">
        <span class="nav-icon">📝</span>
        <span class="nav-text">记录</span>
      </button>
      <button class="nav-item" data-view="rewards">
        <span class="nav-icon">🎁</span>
        <span class="nav-text">奖励</span>
      </button>
      <button class="nav-item" data-view="settings">
        <span class="nav-icon">⚙️</span>
        <span class="nav-text">设置</span>
      </button>
    </nav>
  </div>

  <!-- Toast 容器 -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- 通用 Modal 容器 -->
  <div id="modalRoot" class="modal-root hidden">
    <div class="modal-mask"></div>
    <div class="modal-box">
      <div id="modalTitle" class="modal-title">提示</div>
      <div id="modalBody" class="modal-body"></div>
      <div id="modalFooter" class="modal-footer"></div>
    </div>
  </div>

  <!-- 宝宝选择下拉 -->
  <div id="babyDropdown" class="dropdown hidden">
    <div id="babyDropdownList" class="dropdown-list"></div>
    <button class="dropdown-add" id="dropdownAddBaby">+ 添加宝宝</button>
  </div>

  <!-- 操作人选择下拉 -->
  <div id="operatorDropdown" class="dropdown hidden">
    <div id="operatorDropdownList" class="dropdown-list"></div>
  </div>

  <!-- JS 文件按依赖顺序加载：utils → storage → 各业务模块 → app -->
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/baby.js"></script>
  <script src="js/behavior.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/reward.js"></script>
  <script src="js/record.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
