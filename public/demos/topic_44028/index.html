    function renderTabbar() {
      const device = document.getElementById('device');
      // 移除已存在
      const old = device.querySelector('.tabbar');
      if (old) old.remove();
      const html = `
        <div class="tabbar">
          ${TABS.map(t => {
            if (t.key === '__fab__') {
              return `<button class="fab" data-action="open-type-chooser" aria-label="新建">
                ${icon('plus', { size: 24, color: '#fff', stroke: 2.5 })}
              </button>`;
            }
            const active = state.activeTab === t.key;
            return `<button class="tab ${active ? 'tab--active' : ''}" data-action="tab-${t.key}" aria-label="${t.label}">
              ${icon(t.icon, { size: 22, color: active ? 'var(--blue)' : 'var(--text-2)', stroke: active ? 2.5 : 1.8 })}
              <span class="tab__label">${t.label}</span>
            </button>`;
          }).join('')}
        </div>
      `;
      device.insertAdjacentHTML('beforeend', html);
    }

    function renderFab() {
      // FAB 已在 renderTabbar 中渲染（占位），这里无需重复
    }

    /* ============================================================
       14. 模态弹层
       ============================================================ */
    function renderModals() {
      const device = document.getElementById('device');
      // 移除已存在
      const old = device.querySelectorAll('.modal, .toast');
      old.forEach(n => n.remove());
      state.modals.forEach((m, idx) => {
        const mhtml = modalHTML(m);
        device.insertAdjacentHTML('beforeend', mhtml);
      });
      bindModalEvents();
      // 弹层中的三列滚轮（年/月/日）
      bindThreeColScrolls();
    }

    /** 通用底部弹层（居中弹窗）：用于选择器（重复/周/月/年/单日等）
     *  params: { title, cancelText, confirmText, bodyHTML }
     *  data-action 约定：
     *    pop-cancel   - 取消
     *    pop-confirm  - 完成（formModal 自动处理）
     *  其余 data-action 由内层 bodyHTML 自行处理（点选/切换）
     */
    function popLayerHTML(params) {
      const title = params.title || '请选择';
      const cancelText = params.cancelText || '取消';
      const confirmText = params.confirmText || '完成';
      const bodyHTML = params.bodyHTML || '';
      return `
        <div class="modal modal--center" data-modal-idx="${state.modals.length - 1}">
          <div class="sheet" style="background:#FAFAFA;border-radius:20px;width:340px;max-width:88%;">
            <div class="sheet__header" style="border-bottom:1px solid var(--border);">
              <button class="sheet__btn sheet__btn--ghost" data-action="pop-cancel">${cancelText}</button>
              <span class="sheet__title">${esc(title)}</span>
              <button class="sheet__btn sheet__btn--primary" data-action="pop-confirm">${confirmText}</button>
            </div>
            <div class="sheet__body">${bodyHTML}</div>
          </div>
        </div>
      `;
    }

    function modalHTML(m) {
      const k = m.key;
      const closeBtn = `<button class="sheet__close" data-action="close-modal">${icon('x', { size: 18 })}</button>`;
      const handle = `<div class="sheet__handle"></div>`;
      if (k === 'type-chooser') {
        return `
          <div class="modal" data-modal-idx="${state.modals.length - 1}">
            <div class="sheet">
              ${handle}
              <div class="sheet__header">
                <span class="sheet__title">选择闹钟类型</span>
                ${closeBtn}
              </div>
              <div class="sheet__body">
                <div class="type-chooser">
                  <div class="type-card" data-action="new-regular">
                    <div class="type-card__icon type-card__icon--blue">${icon('bell-ring', { size: 22, color: '#fff' })}</div>
                    <div>
                      <div class="type-card__title">常规闹钟</div>
                      <div class="type-card__sub">设置日常提醒，可重复，可邀请好友</div>
                    </div>
                    <span style="margin-left:auto;color:var(--text-3);">${icon('chevron-right', { size: 18 })}</span>
                  </div>
                  <div class="type-card" data-action="new-capsule">
                    <div class="type-card__icon type-card__icon--violet">${icon('mail', { size: 22, color: '#fff' })}</div>
                    <div>
                      <div class="type-card__title">慢递闹钟</div>
                      <div class="type-card__sub">它会静静潜伏在你的闹钟列表底部，直到那天才会响铃。</div>
                    </div>
                    <span style="margin-left:auto;color:var(--text-3);">${icon('chevron-right', { size: 18 })}</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }
      if (k === 'new-alarm' || k === 'edit-alarm') {
        const isEdit = k === 'edit-alarm';
        const a = isEdit ? (m.params && m.params.alarm) : null;
        const timeVal = (a && a.time) || (m.params && m.params.time) || '08:00';
        const t = timeParts(timeVal);
        // 重复：从 params 取（优先）/ 从 alarm 归一化
        let repeatCode;
        if (m.params && m.params.repeatCode) {
          repeatCode = m.params.repeatCode;
        } else if (a) {
          const n = normalizeRepeat(a);
          repeatCode = n.code;
        } else {
          repeatCode = '9999'; // 新建闹钟默认"每天"
        }
        // 重复字段显示：仅显示类型名（不重复/每天/工作日/每周/每月/每年/仅单日）
        const repeatDisplay = parseRepeatLabelToText(repeatCode);
        
        // 日期字段显示：根据重复类型显示不同的日期内容
        // 不重复/每天/工作日：不显示日期字段
        // 每周/每月/每年/仅单日：显示具体日期
        const showDateSelector = repeatCode !== 'NONE' && repeatCode !== '9999' && repeatCode !== '0';
        const dateDisplay = showDateSelector ? repeatCodeToDateText(repeatCode) : '';
        const label = (a && a.label) || (m.params && m.params.label) || '';
        const imgs = (a && a.images) ? a.images.length : 0;
        const participants = (m.params && m.params.participants) || [{ name: '我', isSelf: true }];

        const hhDigits = Array.from({ length: 24 }, (_, i) => String(i).padStart(2, '0'));
        const mmDigits = Array.from({ length: 60 }, (_, i) => String(i).padStart(2, '0'));
        const hhIdx = parseInt(t.h, 10);
        const mmIdx = parseInt(t.m, 10);

        return `
          <div class="modal" data-modal-idx="${state.modals.length - 1}">
            <div class="sheet" style="background:#FAFAFA;border-radius:24px 24px 0 0;max-height:92%;">
              <div style="display:flex;justify-content:center;padding:12px 0 8px;">
                <div style="width:40px;height:4px;border-radius:2px;background:#DBEAFE;"></div>
              </div>
              <div class="sheet__header" style="border-bottom:none;">
                <span class="sheet__title">${isEdit ? '编辑闹钟' : '新建闹钟'}</span>
                ${closeBtn}
              </div>
              <div class="sheet__body">
                <!-- 1. 时间（iOS 滚轮 + 点击数字直接选中，与 frontEnd time-picker-section 一致） -->
                <div class="ios-time-picker" id="ios-time-picker" data-h="${t.h}" data-m="${t.m}">
                  <div class="ios-time-picker__row">
                    <div class="ios-time-picker__indicator"></div>
                    <div class="ios-time-picker__col" data-col="hh">
                      <div class="ios-time-picker__col-inner" id="ios-col-hh" style="transform: translateY(-${(hhIdx - 1) * 56}px);">
                        ${hhDigits.map((d, i) => `<div class="ios-time-picker__digit ${i === hhIdx ? 'ios-time-picker__digit--active' : ''}" data-action="pick-time-digit" data-col="hh" data-val="${d}">${d}</div>`).join('')}
                      </div>
                    </div>
                    <div class="ios-time-picker__separator">:</div>
                    <div class="ios-time-picker__col" data-col="mm">
                      <div class="ios-time-picker__col-inner" id="ios-col-mm" style="transform: translateY(-${(mmIdx - 1) * 56}px);">
                        ${mmDigits.map((d, i) => `<div class="ios-time-picker__digit ${i === mmIdx ? 'ios-time-picker__digit--active' : ''}" data-action="pick-time-digit" data-col="mm" data-val="${d}">${d}</div>`).join('')}
                      </div>
                    </div>
                  </div>
                  <div class="ios-time-picker__hint">点击或滑动选择时间</div>
                </div>

                <!-- 2. 重复规则选择框（始终显示，与 frontEnd setting-item repeat 一致） -->
                <div class="form-block" data-action="open-repeat-picker" style="background:#fff;border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;border:1px solid var(--border-active);">
                  <span class="form-label" style="margin:0;color:var(--text-2);">重复</span>
                  <span style="display:flex;align-items:center;gap:6px;color:var(--text-1);font-size:15px;font-weight:600;">
                    <span>${esc(repeatDisplay)}</span>
                    <span style="color:var(--text-3);">${icon('chevron-right', { size: 16 })}</span>
                  </span>
                </div>

                <!-- 3. 日期选择框（除不重复/每天/工作日外都显示） -->
                ${showDateSelector ? `
                <div class="form-block" data-action="open-date-picker" style="background:#fff;border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;border:1px solid var(--border-active);">
                  <span class="form-label" style="margin:0;color:var(--text-2);">日期</span>
                  <span style="display:flex;align-items:center;gap:6px;color:var(--text-1);font-size:15px;font-weight:600;">
                    <span>${esc(dateDisplay)}</span>
                    <span style="color:var(--text-3);">${icon('chevron-right', { size: 16 })}</span>
                  </span>
                </div>
                ` : ''}

                <!-- 4. 标签（与 frontEnd label-textarea 一致，50字内多行输入 + 语音录制） -->
                <div class="form-block">
                  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
                    <div class="form-label" style="color:var(--text-2);margin:0;">标签</div>
                    <button class="voice-record-btn" data-action="record-voice" title="录制语音">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                      </svg>
                      <span class="voice-record-btn__text">录音</span>
                    </button>
                  </div>
                  <textarea class="blue-input blue-textarea" placeholder="闹钟标签（最多50个字）" maxlength="50" style="width:100%;min-height:60px;padding:10px 12px;border:1px solid var(--border-active);border-radius:12px;font-size:14px;color:var(--text-1);background:#fff;resize:none;line-height:1.5;">${esc(label)}</textarea>
                </div>

                <!-- 5. 提醒对象（chip 形式展示已选好友，可点 + 号继续添加） -->
                <div class="form-block">
                  <div class="form-label" style="color:var(--text-2);">提醒对象</div>
                  <div style="display:flex;flex-wrap:wrap;gap:8px;">
                    ${participants.map(p => {
                      const colorMap = ['linear-gradient(135deg,#60A5FA,#3B82F6)','linear-gradient(135deg,#F472B6,#EC4899)','linear-gradient(135deg,#A78BFA,#8B5CF6)','linear-gradient(135deg,#34D399,#10B981)','linear-gradient(135deg,#FBBF24,#F59E0B)'];
                      const idx = (p.name || '我').charCodeAt(0) % colorMap.length;
                      return `
                        <div class="participant-chip">
                          <span class="participant-chip__avatar" style="background:${colorMap[idx]};">${esc(initial(p.name))}</span>
                          <span class="participant-chip__name">${esc(p.name)}</span>
                          ${!p.isSelf ? `<button class="participant-chip__remove" data-action="remove-participant">${icon('x', { size: 14 })}</button>` : ''}
                        </div>
                      `;
                    }).join('')}
                    <button class="add-friend-chip" data-action="open-friend-picker">${icon('plus', { size: 14 })} 添加好友</button>
                  </div>
                </div>

                <!-- 6. 图片 -->
                <div class="form-block">
                  <div class="form-label" style="color:var(--text-2);">${icon('image', { size: 14, color: 'var(--text-2)' })} 添加图片</div>
                  <div class="image-grid">
                    ${Array.from({ length: imgs }).map((_, i) => `<div class="image-grid__cell alarm-card__img--${i + 1}"></div>`).join('')}
                    ${imgs < 3 ? `<button class="image-grid__cell image-grid__add" data-action="add-image">${icon('plus', { size: 20, color: 'var(--text-3)' })}</button>` : ''}
                  </div>
                </div>
              </div>
              <div class="alarm-footer">
                <button class="alarm-footer__btn alarm-footer__btn--ghost" data-action="close-modal">取消</button>
                <button class="alarm-footer__btn alarm-footer__btn--primary" data-action="save-alarm">${isEdit ? '保存' : '创建闹钟'}</button>
              </div>
            </div>
          </div>
        `;
      }
      /* ---- 闹钟表单的子弹层：重复选择 / 周 / 月 / 年 / 仅单日 ---- */
      if (k === 'alarm-repeat-picker') {
        const currentCode = (m.params && m.params.repeatCode) || '9999';
        // 选项顺序：不重复 → 仅单日 → 工作日 → 每天 → 每周 → 每月 → 每年
        const items = [
          { code: 'NONE',       label: '不重复' },
          { code: 'SINGLE_DAY', label: '仅单日' },
          { code: '0',          label: '工作日' },
          { code: '9999',       label: '每天' },
          { code: 'WEEKLY',     label: '每周' },
          { code: 'MONTHLY',    label: '每月' },
          { code: 'YEARLY',     label: '每年' },
        ];
        return popLayerHTML({
          title: '选择重复',
          cancelText: '取消',
          confirmText: '完成',
          bodyHTML: `
            <div class="repeat-list">
              ${items.map(it => {
                // 精确匹配：仅当 code 完全相等时高亮
                let active = it.code === currentCode;
                // 兼容正则编码：将当前 code 映射到对应类型
                if (!active) {
                  // 每周：1,2,3,4,5 等格式
                  if (it.code === 'WEEKLY' && /^[1-7](,[1-7])*$/.test(currentCode)) active = true;
                  // 每月：01,02,99 等格式
                  else if (it.code === 'MONTHLY' && /^(\d{2},)*\d{2}$/.test(currentCode)) active = true;
                  // 每年：4位数字月日，但排除 9999（每天）
                  else if (it.code === 'YEARLY' && /^\d{4}$/.test(currentCode) && currentCode !== '9999') active = true;
                  // 仅单日：8位数字年月日
                  else if (it.code === 'SINGLE_DAY' && /^\d{8}$/.test(currentCode)) active = true;
                }
                return `
                  <div class="repeat-list__item ${active ? 'repeat-list__item--active' : ''}" data-action="pop-pick-repeat" data-code="${it.code}">
                    <span>${it.label}</span>
                    ${active ? `<span class="repeat-list__check">✓</span>` : ''}
                  </div>`;
              }).join('')}
            </div>
          `,
        });
      }
      if (k === 'alarm-week-picker') {
        // 当前多选：例如 1,2,3,4,5
        const currentCode = (m.params && m.params.repeatCode) || '1,2,3,4,5';
        const cur = new Set(currentCode.split(',').map(s => parseInt(s)).filter(n => n >= 1 && n <= 7));
        const labels = ['周一','周二','周三','周四','周五','周六','周日'];
        return popLayerHTML({
          title: '选择周几',
          cancelText: '取消',
          confirmText: '完成',
          bodyHTML: `
            <div class="week-grid">
              ${labels.map((lb, i) => {
                const v = i + 1;
                const active = cur.has(v);
                return `
                  <div class="week-grid__row ${active ? 'week-grid__row--active' : ''}" data-action="pop-toggle-week" data-day="${v}">
                    <span>${lb}</span>
                    ${active ? `<span class="week-grid__check">✓</span>` : ''}
                  </div>`;
              }).join('')}
            </div>
          `,
        });
      }
      if (k === 'alarm-month-picker') {
        // 多选 + 月底（99）；code 例 "01,15,99"
        const currentCode = (m.params && m.params.repeatCode) || '01';
        const parts = currentCode.split(',');
        const selectedDays = new Set(parts.filter(p => p !== '99').map(p => parseInt(p)));
        const lastDay = parts.includes('99');
        const items = [];
        for (let i = 1; i <= 31; i++) {
          items.push({ v: i, label: i + '日' });
        }
        return popLayerHTML({
          title: '选择每月日期',
          cancelText: '取消',
          confirmText: '完成',
          bodyHTML: `
            <div class="month-grid">
              ${items.map(it => `
                <div class="month-grid__item ${selectedDays.has(it.v) ? 'month-grid__item--active' : ''}" data-action="pop-toggle-month-day" data-day="${it.v}">${it.label}</div>
              `).join('')}
              <div class="month-grid__item month-grid__item--last ${lastDay ? 'month-grid__item--active' : ''}" data-action="pop-toggle-month-last">每月最后一天</div>
            </div>
          `,
        });
      }
      if (k === 'alarm-yearly-picker') {
        // 公历 m月d日：4 位 code 例 0618
        const currentCode = (m.params && m.params.repeatCode) || '0618';
        const month = parseInt(currentCode.substring(0, 2)) || 1;
        const day   = parseInt(currentCode.substring(2, 4)) || 1;
        // 每年都用同一年 2026 来算当月天数（避免闰年歧义；本项目每年用 2 月 29 日场景按 28 兜底）
        const maxDay = month === 2 ? 29 : getDaysInMonth(2026, month);
        const safeDay = Math.min(day, maxDay);
        return popLayerHTML({
          title: '选择每年日期',
          cancelText: '取消',
          confirmText: '完成',
          bodyHTML: threeColHTML({ month, day: safeDay }, 'md', 'yearly', 'yearly-cols'),
        });
      }
      if (k === 'alarm-date-picker') {
        // 仅单日：8 位 code 例 20260618；最早只能是明天
        const tomorrow = shiftDateStr(TODAY_STR, 1);
        const currentCode = (m.params && m.params.repeatCode) || ymdToEight(tomorrow);
        const draft = {
          year:  parseInt(currentCode.substring(0, 4)) || parseInt(tomorrow.split('-')[0]),
          month: parseInt(currentCode.substring(4, 6)) || parseInt(tomorrow.split('-')[1]),
          day:   parseInt(currentCode.substring(6, 8)) || parseInt(tomorrow.split('-')[2]),
        };
        // 仅单日限制：>= 明天
        // 把"明天"换算成 ymd 对象注入 pop 状态
        if (!m.params) m.params = {};
        m.params.minDate = tomorrow;
        m.params.maxDate = MAX_DATE;
        return popLayerHTML({
          title: '选择日期',
          cancelText: '取消',
          confirmText: '完成',
          bodyHTML: threeColHTML(draft, 'ymd', 'singleday', 'singleday-cols'),
        });
      }
      if (k === 'date-popup') {
        // mine 页面切换器打开的年/月/日弹层
        const cur = (m.params && m.params.date) || state.ui.selectedDate || TODAY_STR;
        const draft = parseYmd(cur);
        return popLayerHTML({
          title: '选择日期',
          cancelText: '取消',
          confirmText: '完成',
          bodyHTML: threeColHTML(draft, 'ymd', 'mine-date', 'mine-date-cols'),
        });
      }
      if (k === 'new-capsule' || k === 'edit-capsule') {
        const isEdit = k === 'edit-capsule';
        const c = isEdit ? (m.params && m.params.capsule) : null;
        const timeVal = c ? c.time : '12:00';
        const dateVal = c ? c.date : '2028-08-08';
        const label = c ? c.label : '';
        const recipients = (m.params && m.params.recipients) || (c && c.recipients) || [];
        const t = timeParts(timeVal);
        const hhDigits = Array.from({ length: 24 }, (_, i) => String(i).padStart(2, '0'));
        const mmDigits = Array.from({ length: 60 }, (_, i) => String(i).padStart(2, '0'));
        const hhIdx = parseInt(t.h, 10);
        const mmIdx = parseInt(t.m, 10);
        const lunarInfo = LUNAR_INFO[dateVal];
        return `
          <div class="modal" data-modal-idx="${state.modals.length - 1}">
            <div class="sheet" style="background:#FAFAFA;border-radius:24px 24px 0 0;max-height:92%;">
              <div style="display:flex;justify-content:center;padding:12px 0 8px;">
                <div style="width:40px;height:4px;border-radius:2px;background:#DDD6FE;"></div>
              </div>
              <div class="sheet__header" style="border-bottom:none;">
                <span class="sheet__title">${isEdit ? '编辑慢递' : '新建慢递'}</span>
                ${closeBtn}
              </div>
              <div class="sheet__body">
                <!-- iOS 风格时间选择器 -->
                <div class="ios-time-picker" id="ios-time-picker" data-h="${hhIdx}" data-m="${mmIdx}" style="background:linear-gradient(135deg,rgba(139,92,246,0.05) 0%,rgba(139,92,246,0.10) 100%);border-color:rgba(139,92,246,0.15);">
                  <div class="ios-time-picker__row">
                    <div class="ios-time-picker__indicator" style="background:rgba(139,92,246,0.08);"></div>
                    <div class="ios-time-picker__col" data-col="hh">
                      <div class="ios-time-picker__col-inner" id="ios-col-hh" style="transform: translateY(-${(hhIdx - 1) * 56}px);">
                        ${hhDigits.map((d, i) => `<div class="ios-time-picker__digit ${i === hhIdx ? 'ios-time-picker__digit--active' : ''}" data-val="${d}" style="${i === hhIdx ? 'color:var(--violet);' : ''}">${d}</div>`).join('')}
                      </div>
                    </div>
                    <div class="ios-time-picker__separator" style="color:var(--violet);">:</div>
                    <div class="ios-time-picker__col" data-col="mm">
                      <div class="ios-time-picker__col-inner" id="ios-col-mm" style="transform: translateY(-${(mmIdx - 1) * 56}px);">
                        ${mmDigits.map((d, i) => `<div class="ios-time-picker__digit ${i === mmIdx ? 'ios-time-picker__digit--active' : ''}" data-val="${d}" style="${i === mmIdx ? 'color:var(--violet);' : ''}">${d}</div>`).join('')}
                      </div>
                    </div>
                  </div>
                  <div class="ios-time-picker__hint">上下滑动选择时间</div>
                </div>

                <!-- 日期：公历 + 农历 -->
                <div class="form-block">
                  <div class="form-label form-label--violet">${icon('calendar', { size: 14, color: 'var(--violet)' })} 日期</div>
                  <div class="violet-input-wrap">
                    <span class="violet-input-wrap__icon">${icon('calendar', { size: 18 })}</span>
                    <input class="violet-input" type="date" value="${esc(dateVal)}" min="${esc(new Date().toISOString().slice(0,10))}" />
                  </div>
                  ${lunarInfo ? `<div style="margin-top:6px;font-size:12px;color:var(--violet);display:flex;align-items:center;gap:6px;">
                    ${icon('calendar', { size: 12, color: 'var(--violet)' })}
                    农历 ${esc(lunarInfo.lunar)}${lunarInfo.holiday ? ` · ${lunarInfo.holiday}` : ''}
                  </div>` : ''}
                </div>

                <!-- 寄语（标签） -->
                <div class="form-block">
                  <div class="form-label form-label--violet">寄语</div>
                  <textarea class="violet-input" rows="3" style="resize:none;line-height:1.5;">${esc(label)}</textarea>
                </div>

                <!-- 发给（多选） -->
                <div class="form-block">
                  <div class="form-label form-label--violet">${icon('send-horizontal', { size: 14, color: 'var(--violet)' })} 发给（可选）</div>
                  ${recipients.length > 0 ? `
                    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;">
                      ${recipients.map(r => `
                        <span class="participant-chip" style="background:var(--violet-bg);border-color:rgba(139,92,246,0.20);color:var(--violet);">
                          <span class="participant-chip__avatar" style="background:linear-gradient(135deg,#A78BFA,#8B5CF6);">${esc(initial(r))}</span>
                          <span class="participant-chip__name" style="color:var(--text-1);">${esc(r)}</span>
                        </span>
                      `).join('')}
                    </div>
                  ` : ''}
                  <button class="invite-chip" data-action="open-friend-picker" style="background:var(--violet-bg);color:var(--violet);">${icon('plus', { size: 14 })} 选择好友</button>
                </div>
              </div>
              <div class="capsule-footer">
                <button class="capsule-footer__btn capsule-footer__btn--ghost" data-action="close-modal">取消</button>
                <button class="capsule-footer__btn capsule-footer__btn--primary" data-action="save-capsule">${isEdit ? '保存' : '封存'}</button>
              </div>
            </div>
          </div>
        `;
      }
      if (k === 'friend-picker') {
        const list = state.data.friends;
        const picked = m.params && m.params.picked || [];
        return `
          <div class="modal" data-modal-idx="${state.modals.length - 1}">
            <div class="sheet" style="max-height:80%;">
              <div class="sheet__header">
                <span class="sheet__title">选择好友</span>
                ${closeBtn}
              </div>
              <div class="sheet__body">
                ${list.map(f => {
                  const checked = picked.indexOf(f.id) >= 0;
                  return `
                    <div class="picker-row ${checked ? 'picker-row--checked' : ''}" data-action="toggle-pick-friend" data-id="${f.id}">
                      ${avatar(f.name)}
                      <div style="flex:1;min-width:0;">
                        <div class="friend-row__name">${esc(f.name)}${f.remark ? ` <span style="color:var(--text-2);font-size:12px;font-weight:400;">(${esc(f.remark)})</span>` : ''}</div>
                        <div class="friend-row__uid">ID: ${esc(f.userId)}</div>
                      </div>
                      <span class="picker-row__check">${checked ? icon('check', { size: 14, color: '#fff' }) : ''}</span>
                    </div>
                  `;
                }).join('')}
              </div>
              <div class="form-footer">
                <button class="form-footer__btn form-footer__btn--primary" data-action="confirm-pick-friend">确定（${picked.length}）</button>
              </div>
            </div>
          </div>
        `;
      }
      // 添加好友：粘贴用户码
      if (k === 'add-friend') {
        const myId = state.data.profile.userId;
        return `
          <div class="modal" data-modal-idx="${state.modals.length - 1}">
            <div class="sheet" style="max-height:85%;">
              <div class="sheet__header">
                <span class="sheet__title">添加好友</span>
                ${closeBtn}
              </div>
              <div class="sheet__body">
                <!-- 我的用户码（可分享） -->
                <div style="background:linear-gradient(135deg,rgba(59,130,246,0.05),rgba(59,130,246,0.12));border:1px solid #DBEAFE;border-radius:14px;padding:16px;text-align:center;margin-bottom:20px;">
                  <div style="font-size:12px;color:var(--blue);font-weight:600;margin-bottom:6px;display:flex;align-items:center;justify-content:center;gap:6px;">
                    ${icon('user', { size: 14, color: 'var(--blue)' })} 我的用户码
                  </div>
                  <div style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:22px;font-weight:800;color:var(--blue);letter-spacing:2px;margin:4px 0;">${esc(myId)}</div>
                  <button class="invite-chip" data-action="copy-my-id" style="margin-top:8px;background:rgba(255,255,255,0.8);">${icon('copy', { size: 12 })} 复制我的用户码</button>
                </div>

                <!-- 输入好友用户码 -->
                <div style="font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:8px;display:flex;align-items:center;gap:6px;">
                  ${icon('plus', { size: 14 })} 粘贴好友的用户码
                </div>
                <input class="blue-input" type="text" id="friend-code-input" placeholder="例如：fa12345" style="margin-bottom:8px;text-align:center;font-size:18px;letter-spacing:2px;font-family:ui-monospace,monospace;" />

                <!-- 模拟的搜索建议 -->
                <div id="friend-code-result" style="display:none;background:var(--blue-bg);border:1px solid #DBEAFE;border-radius:14px;padding:14px;margin-top:12px;text-align:center;">
                  <div style="font-size:12px;color:var(--text-2);margin-bottom:8px;">找到以下用户：</div>
                  <div style="display:flex;align-items:center;gap:12px;text-align:left;">
                    <div class="avatar avatar--lg" style="background:linear-gradient(135deg,#F472B6,#EC4899);">小</div>
                    <div style="flex:1;">
                      <div style="font-size:15px;font-weight:700;color:var(--text-1);">小张</div>
                      <div style="font-size:12px;color:var(--text-2);font-family:ui-monospace,monospace;">fa88001</div>
                    </div>
                  </div>
                </div>

                <div style="font-size:11px;color:var(--text-3);margin-top:14px;line-height:1.5;text-align:center;">
                  对方会收到你的好友申请通知<br/>长按用户码可复制
                </div>
              </div>
              <div class="alarm-footer">
                <button class="alarm-footer__btn alarm-footer__btn--ghost" data-action="close-modal">取消</button>
                <button class="alarm-footer__btn alarm-footer__btn--primary" data-action="submit-friend-code">发送申请</button>
              </div>
            </div>
          </div>
        `;
      }
      if (k === 'logout-confirm') {
        return `
          <div class="modal modal--center" data-modal-idx="${state.modals.length - 1}">
            <div class="sheet" style="max-width:300px;">
              <div class="sheet__body" style="padding-top:24px;">
                <div class="confirm-text">确认退出登录吗？<br/>退出后将无法接收闹钟通知。</div>
              </div>
              <div class="form-footer" style="border-top:none;">
                <button class="form-footer__btn form-footer__btn--ghost" data-action="close-modal">取消</button>
                <button class="form-footer__btn form-footer__btn--primary" data-action="confirm-logout" style="background:linear-gradient(135deg,var(--red),#DC2626);">退出登录</button>
              </div>
            </div>
          </div>
        `;
      }
      return '';
    }

    function bindModalEvents() {
      // 由统一的 screen.onclick 统一处理（在 bindScreenEvents 中）
    }

    /* ============================================================
       15. Toast
       ============================================================ */
    function showToast(msg) {
      const device = document.getElementById('device');
      const old = device.querySelector('.toast');
      if (old) old.remove();
      device.insertAdjacentHTML('beforeend', `<div class="toast" id="toast">${esc(msg)}</div>`);
      const t = device.querySelector('#toast');
      requestAnimationFrame(() => t.classList.add('toast--show'));
      clearTimeout(state.ui.toastTimer);
      state.ui.toastTimer = setTimeout(() => {
        t.classList.remove('toast--show');
        setTimeout(() => t.remove(), 250);
      }, 1800);
    }

    /* ============================================================
       16. 屏幕事件委托（含模态）
       点击监听挂在 #device 上而非 #screen，
       因为 tabbar / 模态层都是 #screen 的兄弟节点，注入到 #device 内。
       ============================================================ */
    function bindScreenEvents() {
      const device = document.getElementById('device');
      device.onclick = handleClick;
      bindGestures();
    }

    function handleClick(e) {
      // 优先匹配最近祖先 data-action
      const t = e.target.closest('[data-action]');
      if (!t) return;
      const a = t.dataset.action;
      const id = t.dataset.id;
      const kind = t.dataset.kind;
      const label = t.dataset.label;

      // Tab 切换
      if (a === 'tab-mine')         return navigate({ tab: 'mine' });
      if (a === 'tab-sent')         return navigate({ tab: 'sent' });
      if (a === 'tab-friends')      return navigate({ tab: 'friends' });
      if (a === 'tab-center')       return navigate({ tab: 'center' });

      // mine 子视图切换
      if (a === 'open-capsule-view') {
        state.ui.mineView = 'capsule';
        state.ui.swipeOpenId = null;
        render();
        return;
      }
      if (a === 'back-to-list') {
        state.ui.mineView = 'list';
        state.ui.swipeOpenId = null;
        render();
        return;
      }
      if (a === 'sent-back-to-list') {
        state.ui.sentView = 'list';
        state.ui.swipeOpenId = null;
        render();
        return;
      }
      // 日期选择
      if (a === 'pick-date') {
        const d = t.dataset.date;
        if (d) {
          state.ui.selectedDate = d;
          render();
        }
        return;
      }
      // 胶囊开关
      if (a === 'toggle-capsule') {
        const kind = t.dataset.kind;
        const list = kind === 'sent' ? state.data.sentCapsules : state.data.myCapsules;
        const c = list.find(x => x.id === id);
        if (c) { c.enabled = !c.enabled; render(); }
        return;
      }
      // 胶囊编辑/删除
      if (a === 'edit-capsule') {
        const kind = t.dataset.kind;
        const list = kind === 'sent' ? state.data.sentCapsules : state.data.myCapsules;
        const c = list.find(x => x.id === id);
        if (c) navigate({ modal: { key: 'edit-capsule', params: { capsule: c, kind } } });
        return;
      }
      if (a === 'delete-capsule') {
        const kind = t.dataset.kind;
        const list = kind === 'sent' ? state.data.sentCapsules : state.data.myCapsules;
        const idx = list.findIndex(x => x.id === id);
        if (idx >= 0) list.splice(idx, 1);
        state.ui.swipeOpenId = null;
        navigate({ toast: '已删除慢递' });
        return;
      }

      // 返回
      if (a === 'back')             return navigate({ back: true });

      // 模态
      if (a === 'close-modal')      return navigate({ back: true });
      if (a === 'open-type-chooser') return navigate({ modal: { key: 'type-chooser' } });
      if (a === 'new-regular') {
        state.modals.pop(); // 关闭 type-chooser
        return navigate({ modal: { key: 'new-alarm' } });
      }
      if (a === 'new-capsule') {
        state.modals.pop();
        return navigate({ modal: { key: 'new-capsule' } });
      }
      if (a === 'open-friend-picker') {
        // 在 new-alarm/new-capsule 之上叠加
        return navigate({ modal: { key: 'friend-picker', params: { picked: [] } } });
      }
      if (a === 'toggle-pick-friend') {
        const modal = state.modals[state.modals.length - 1];
        if (modal && modal.key === 'friend-picker') {
          const picked = modal.params.picked;
          const idx = picked.indexOf(id);
          if (idx >= 0) picked.splice(idx, 1);
          else picked.push(id);
          render();
        }
        return;
      }
      if (a === 'confirm-pick-friend') {
        const modal = state.modals[state.modals.length - 1];
        const picked = (modal && modal.params && modal.params.picked) || [];
        navigate({ back: true, toast: `已选择 ${picked.length} 位好友` });
        return;
      }

      if (a === 'save-alarm') {
        // 将 iOS 时间选择器当前值回写到 formModal.params
        const modal = state.modals[state.modals.length - 1];
        if (modal) {
          const picker = document.getElementById('ios-time-picker');
          if (picker) {
            if (!modal.params) modal.params = {};
            // data-h/data-m 存储的是值（如 "08"），不是索引
            modal.params.time = `${picker.dataset.h}:${picker.dataset.m}`;
          }
        }
        // 创建闹钟对象并保存到 state.data.myAlarms
        if (modal && modal.params) {
          const p = modal.params;
          const repeatCode = p.repeatCode || '9999';
          // 根据重复类型决定 date 字段
          let dateVal = null;
          if (repeatCode === 'NONE' || /^\d{8}$/.test(repeatCode)) {
            // 不重复/仅单日：使用选中日期
            dateVal = state.ui.selectedDate || TODAY_STR;
          }
          // 每天/工作日/每周/每月/每年：date 为 null，靠 repeatKey 过滤
          const newAlarm = {
            id: 'alarm_' + Date.now(),
            date: dateVal,
            time: p.time || '08:00',
            repeatKey: repeatCode,
            repeatText: parseRepeatLabelToText(repeatCode),
            label: p.label || '',
            creator: { name: '我' },
            isSelf: true,
            enabled: true,
            muted: false,
            updatedAt: new Date().toISOString().replace('T', ' ').substring(0, 19),
          };
          state.data.myAlarms.unshift(newAlarm);
        }
        return navigate({ back: true, toast: '已创建闹钟' });
      }
      if (a === 'save-capsule') return navigate({ back: true, toast: '已封存慢递' });
      if (a === 'add-image')    return navigate({ toast: '演示：附件已添加' });
      if (a === 'pick-repeat') {
        // 新版重复下拉（new-alarm modal）：更新当前 modal params 的 repeatKey/repeatLabel
        const modal = state.modals[state.modals.length - 1];
        if (modal) {
          if (!modal.params) modal.params = {};
          modal.params.repeatKey = t.dataset.key;
          modal.params.repeatLabel = t.dataset.label;
          modal.params.repeatOpen = false;
          render();
        }
        return;
      }
      if (a === 'toggle-repeat') {
        const modal = state.modals[state.modals.length - 1];
        if (modal) {
          if (!modal.params) modal.params = {};
          modal.params.repeatOpen = !modal.params.repeatOpen;
          render();
        }
        return;
      }
      if (a === 'remove-participant') {
        // 演示：移除提醒对象（这里只是 toast）
        navigate({ toast: '已移除' });
        return;
      }
      if (a === 'record-voice') {
        // 演示：模拟语音录入（点击切换录音状态）
        const btn = document.querySelector('[data-action="record-voice"]');
        if (!btn) return;
        const isRec = btn.classList.toggle('voice-record-btn--recording');
        const textEl = btn.querySelector('.voice-record-btn__text');
        if (textEl) textEl.textContent = isRec ? '停止' : '录音';
        // 只显示 toast，不触发 render（避免弹层闪烁）
        showToast(isRec ? '开始录音…再次点击结束' : '已保存 15" 语音');
        return;
      }
      // 公历/农历切换
      if (a === 'set-calendar-mode') {
        const modal = state.modals[state.modals.length - 1];
        if (modal) {
          if (!modal.params) modal.params = {};
          modal.params.calendarMode = t.dataset.mode;
          render();
        }
        return;
      }
      // 周几多选
      if (a === 'toggle-weekday') {
        const modal = state.modals[state.modals.length - 1];
        if (modal) {
          if (!modal.params) modal.params = {};
          if (!modal.params.weekDays) modal.params.weekDays = [];
          const day = parseInt(t.dataset.day, 10);
          const idx = modal.params.weekDays.indexOf(day);
          if (idx >= 0) modal.params.weekDays.splice(idx, 1);
          else modal.params.weekDays.push(day);
          modal.params.weekDays.sort();
          render();
        }
        return;
      }
      // 每月几号 / 每年月日 / 仅单日 / 农历月日
      const valueHandlers = {
        'pick-month-day':   'monthDay',
        'pick-solar-month': 'lunarMonth',
        'pick-solar-day':   'lunarDay',
        'lunar-month':      'lunarMonth',
        'lunar-day':        'lunarDay',
        'pick-single-date': 'singleDate',
        'pick-month':       'monthDay',
      };
      if (valueHandlers[a]) {
        const modal = state.modals[state.modals.length - 1];
        if (modal) {
          if (!modal.params) modal.params = {};
          modal.params[valueHandlers[a]] = t.value;
          // 不重绘（select 已经在 DOM 中），但同步标签可能需要
          render();
        }
        return;
      }

      // 闹钟卡相关
      if (a === 'edit-alarm') {
        const list = kind === 'sent' ? state.data.sentAlarms : state.data.myAlarms;
        const alarm = list.find(x => x.id === id);
        navigate({ modal: { key: 'edit-alarm', params: { alarm } } });
        return;
      }
      if (a === 'delete-alarm') {
        const list = kind === 'sent' ? state.data.sentAlarms : state.data.myAlarms;
        const idx = list.findIndex(x => x.id === id);
        if (idx >= 0) list.splice(idx, 1);
        state.ui.swipeOpenId = null;
        navigate({ toast: '已删除闹钟' });
        return;
      }
      if (a === 'toggle-alarm') {
        const list = kind === 'sent' ? state.data.sentAlarms : state.data.myAlarms;
        const alarm = list.find(x => x.id === id);
        if (alarm) {
          alarm.enabled = !alarm.enabled;
          render();
        }
        return;
      }
      // 切换静音（点击响铃图标）
      if (a === 'toggle-mute') {
        // 阻止冒泡到卡片的 swipe 监听
        e.stopPropagation();
        const list = kind === 'sent' ? state.data.sentAlarms : state.data.myAlarms;
        const alarm = list.find(x => x.id === id);
        if (alarm) {
          alarm.muted = !alarm.muted;
          render();
        }
        return;
      }

      // ---- 新版日期选择器：我的页面的日期切换（mine 列表上方） ----
      if (a === 'shift-day') {
        const delta = parseInt(t.dataset.delta, 10) || 0;
        const cur = state.ui.selectedDate || TODAY_STR;
        const next = shiftDateStr(cur, delta);
        if (cmpYmdStr(next, MIN_DATE) >= 0 && cmpYmdStr(next, MAX_DATE) <= 0) {
          state.ui.selectedDate = next;
          // 只更新日期条显示，不触发全量 render（避免弹层闪烁）
          updateDateBar();
        }
        return;
      }
      if (a === 'shift-today') {
        state.ui.selectedDate = TODAY_STR;
        // 只更新日期条显示
        updateDateBar();
        return;
      }
      if (a === 'open-date-popup') {
        return navigate({ modal: { key: 'date-popup', params: { date: state.ui.selectedDate } } });
      }

      // ---- 闹钟表单：弹层（重复选择） ----
      if (a === 'open-repeat-picker') {
        // 找到底部的 new-alarm / edit-alarm modal
        const formModal = [...state.modals].reverse().find(x => x.key === 'new-alarm' || x.key === 'edit-alarm');
        if (!formModal) return;
        if (!formModal.params) formModal.params = {};
        return navigate({ modal: {
          key: 'alarm-repeat-picker',
          params: { repeatCode: formModal.params.repeatCode || '9999' },
        } });
      }
      if (a === 'open-date-picker') {
        // 根据当前重复类型打开对应的日期选择面板
        const formModal = [...state.modals].reverse().find(x => x.key === 'new-alarm' || x.key === 'edit-alarm');
        if (!formModal) return;
        if (!formModal.params) formModal.params = {};
        const repeatCode = formModal.params.repeatCode || '9999';
        // 根据重复类型决定打开哪个子面板
        let popKey;
        if (repeatCode === 'WEEKLY' || /^[1-7](,[1-7])*$/.test(repeatCode)) {
          popKey = 'alarm-week-picker';
        } else if (repeatCode === 'MONTHLY' || /^(\d{2},)*\d{2}$/.test(repeatCode)) {
          popKey = 'alarm-month-picker';
        } else if (repeatCode === 'YEARLY' || /^\d{4}$/.test(repeatCode)) {
          popKey = 'alarm-yearly-picker';
        } else if (repeatCode === 'SINGLE_DAY' || /^\d{8}$/.test(repeatCode)) {
          popKey = 'alarm-single-day-picker';
        } else {
          return; // 不重复/每天/工作日不需要日期选择
        }
        return navigate({ modal: {
          key: popKey,
          params: { repeatCode: repeatCode },
        } });
      }

      // 弹层内部交互
      if (a === 'pop-cancel') {
        // 取消子弹层
        navigate({ back: true });
        return;
      }
      if (a === 'pop-confirm') {
        // 提交：把弹层结果写回到下层 new-alarm/edit-alarm
        const popModal = state.modals[state.modals.length - 1];
        const formModal = [...state.modals.slice(0, -1)].reverse().find(x => x.key === 'new-alarm' || x.key === 'edit-alarm');
        if (popModal) {
          if (!popModal.params) popModal.params = {};
          // 重复选择：直接覆盖
          if (popModal.key === 'alarm-repeat-picker') {
            const next = popModal.params.repeatCode;
            if (next && formModal) {
              if (!formModal.params) formModal.params = {};
              formModal.params.repeatCode = next;
              formModal.params.repeatText = parseRepeatLabelToText(next);
            }
          }
          // 周：当前在 popModal.params.repeatCode（已实时更新）
          if (popModal.key === 'alarm-week-picker' && formModal) {
            if (!formModal.params) formModal.params = {};
            formModal.params.repeatCode = popModal.params.repeatCode || '1,2,3,4,5';
            formModal.params.repeatText = parseRepeatLabelToText(formModal.params.repeatCode);
          }
          // 月：同上
          if (popModal.key === 'alarm-month-picker' && formModal) {
            if (!formModal.params) formModal.params = {};
            formModal.params.repeatCode = popModal.params.repeatCode || '01';
            formModal.params.repeatText = parseRepeatLabelToText(formModal.params.repeatCode);
          }
          // 年：组装 4 位 m月d日
          if (popModal.key === 'alarm-yearly-picker' && formModal) {
            if (!formModal.params) formModal.params = {};
            const m = popModal.params.month || 1;
            const d = popModal.params.day || 1;
            const code = mdToFour(m, d);
            formModal.params.repeatCode = code;
            formModal.params.repeatText = parseRepeatLabelToText(code);
          }
          // 仅单日：组装 8 位 code
          if (popModal.key === 'alarm-date-picker' && formModal) {
            if (!formModal.params) formModal.params = {};
            const y = popModal.params.year || parseInt(TODAY_STR.split('-')[0]);
            const m = popModal.params.month || 1;
            const d = popModal.params.day || 1;
            const code = String(y) + pad2(m) + pad2(d);
            // 至少明天
            const codeStr = clampYmdObj({ year: y, month: m, day: d });
            const codeSafe = ymdToEight(formatYmd(codeStr));
            formModal.params.repeatCode = codeSafe;
            formModal.params.repeatText = parseRepeatLabelToText(codeSafe);
          }
          // 日期弹层（mine 页面打开）：回写到 selectedDate
          if (popModal.key === 'date-popup') {
            const y = popModal.params.year;
            const m = popModal.params.month;
            const d = popModal.params.day;
            if (y && m && d) {
              const dateStr = formatYmd(clampYmdObj({ year: y, month: m, day: d }));
              if (cmpYmdStr(dateStr, MIN_DATE) >= 0 && cmpYmdStr(dateStr, MAX_DATE) <= 0) {
                state.ui.selectedDate = dateStr;
              }
            }
          }
        }
        navigate({ back: true });
        return;
      }
      if (a === 'pop-pick-repeat') {
        const code = t.dataset.code;
        const popModal = state.modals[state.modals.length - 1];
        const formModal = [...state.modals.slice(0, -1)].reverse().find(x => x.key === 'new-alarm' || x.key === 'edit-alarm');
        if (popModal) {
          if (!popModal.params) popModal.params = {};
          // 简单类型：不重复/每天/工作日 → 直接关闭并回显
          if (code === 'NONE' || code === '9999' || code === '0') {
            popModal.params.repeatCode = code;
            popModal.params.repeatText = parseRepeatLabelToText(code);
            if (formModal) {
              if (!formModal.params) formModal.params = {};
              formModal.params.repeatCode = code;
              formModal.params.repeatText = parseRepeatLabelToText(code);
            }
            navigate({ back: true });
            return;
          }
          // 复杂类型：设置默认 code（基于今天日期，与 frontEnd selectRepeat 一致），然后直接关闭
          if (code === 'WEEKLY') {
            // 默认选中今天的星期几（单天），转换：0(周日) → 7, 1(周一) → 1
            const now = new Date();
            const weekValue = now.getDay() === 0 ? 7 : now.getDay();
            popModal.params.repeatCode = String(weekValue);
          } else if (code === 'MONTHLY') {
            // 默认选中今天的日期；如果是 29-31 日则选"月底"
            const now = new Date();
            const currentDay = now.getDate();
            popModal.params.repeatCode = currentDay >= 29 ? '99' : String(currentDay).padStart(2, '0');
          } else if (code === 'YEARLY') {
            // 默认选中今天的月日
            const now = new Date();
            popModal.params.repeatCode = String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0');
          } else if (code === 'SINGLE_DAY') {
            // 仅单日：默认明天
            popModal.params.repeatCode = ymdToEight(shiftDateStr(TODAY_STR, 1));
          }
          // 回写到 formModal
          if (formModal) {
            if (!formModal.params) formModal.params = {};
            formModal.params.repeatCode = popModal.params.repeatCode;
            formModal.params.repeatText = parseRepeatLabelToText(popModal.params.repeatCode);
          }
          // 直接关闭重复类型面板（不自动打开子面板，用户需点击"日期"行才能修改具体日期）
          navigate({ back: true });
          return;
        }
        render();
        return;
      }
      if (a === 'pop-toggle-week') {
        const day = parseInt(t.dataset.day, 10);
        const popModal = state.modals[state.modals.length - 1];
        if (popModal) {
          if (!popModal.params) popModal.params = {};
          if (!popModal.params.repeatCode) popModal.params.repeatCode = '1,2,3,4,5';
          const set = new Set(popModal.params.repeatCode.split(',').filter(Boolean).map(s => parseInt(s)));
          if (set.has(day)) set.delete(day);
          else set.add(day);
          // 至少保留 1 个：删空了则保持现状
          if (set.size === 0) {
            navigate({ toast: '至少选择一天' });
            return;
          }
          // 周一~周日 排序
          popModal.params.repeatCode = Array.from(set).sort((a, b) => a - b).join(',');
          render();
        }
        return;
      }
      if (a === 'pop-toggle-month-day') {
        const day = parseInt(t.dataset.day, 10);
        const popModal = state.modals[state.modals.length - 1];
        if (popModal) {
          if (!popModal.params) popModal.params = {};
          if (!popModal.params.repeatCode) popModal.params.repeatCode = '01';
          const parts = popModal.params.repeatCode.split(',');
          // 拆分"数字"和"99"（月底）
          const nums = parts.filter(p => p !== '99').map(p => parseInt(p));
          const set = new Set(nums);
          if (set.has(day)) set.delete(day);
          else set.add(day);
          if (set.size === 0 && !parts.includes('99')) {
            navigate({ toast: '至少选择一天' });
            return;
          }
          const sortNums = Array.from(set).sort((a, b) => a - b);
          const has99 = parts.includes('99');
          popModal.params.repeatCode = sortNums.map(n => pad2(n)).concat(has99 ? ['99'] : []).join(',');
          render();
        }
        return;
      }
      if (a === 'pop-toggle-month-last') {
        const popModal = state.modals[state.modals.length - 1];
        if (popModal) {
          if (!popModal.params) popModal.params = {};
          if (!popModal.params.repeatCode) popModal.params.repeatCode = '01';
          const parts = popModal.params.repeatCode.split(',');
          if (parts.includes('99')) {
            const newParts = parts.filter(p => p !== '99');
            if (newParts.length === 0) {
              navigate({ toast: '至少选择一天' });
              return;
            }
            popModal.params.repeatCode = newParts.join(',');
          } else {
            popModal.params.repeatCode = parts.concat('99').join(',');
          }
          render();
        }
        return;
      }
      if (a === 'pop-col-select') {
        // 三列滚轮：点击某项，标记 active
        const col = t.dataset.col;
        const popModal = state.modals[state.modals.length - 1];
        if (popModal) {
          if (!popModal.params) popModal.params = {};
          const val = parseInt(t.dataset.val, 10);
          if (col === 'year')  popModal.params.year  = val;
          if (col === 'month') popModal.params.month = val;
          if (col === 'day')   popModal.params.day   = val;
          // 同步 scroll 中心：item 高度 56，indicator 中心 110px
          // translateY = 82 - idx*56
          const colInner = t.parentElement;
          if (colInner) {
            const items = Array.from(colInner.children);
            const idx = items.indexOf(t);
            colInner.style.transform = `translateY(${(82 - idx * 56)}px)`;
            items.forEach(el => el.classList.toggle('col__item--active', el === t));
          }
          // 联动"日"列：年份/月份变了重渲染当前弹层
          if (col === 'year' || col === 'month') {
            render();
          }
        }
        return;
      }
      // iOS 时间选择：点击某个数字直接选中
      if (a === 'pick-time-digit') {
        const col = t.dataset.col; // hh | mm
        const val = t.dataset.val;
        const picker = t.closest('.ios-time-picker');
        if (picker) {
          if (col === 'hh') picker.dataset.h = val;
          if (col === 'mm') picker.dataset.m = val;
          const colInner = document.getElementById('ios-col-' + col);
          if (colInner) {
            const items = Array.from(colInner.children);
            const idx = items.findIndex(el => el.dataset.val === val);
            if (idx >= 0) {
              colInner.style.transform = `translateY(-${(idx - 1) * 56}px)`;
              items.forEach(el => el.classList.toggle('ios-time-picker__digit--active', el.dataset.val === val));
            }
          }
        }
        return;
      }

      // 闹友相关
      if (a === 'open-friend-requests') return navigate({ push: { key: 'friends/requests' } });
      if (a === 'open-friend-config') {
        const f = state.data.friends.find(x => x.id === id);
        return navigate({ push: { key: 'friends/config', params: { friend: f, allowSet: true, allowRing: true } } });
      }
      if (a === 'add-friend') return navigate({ modal: { key: 'add-friend' } });
      if (a === 'copy-my-id') {
        const id = state.data.profile.userId;
        // 演示：直接 toast 提示
        navigate({ toast: '已复制用户码 ' + id });
        return;
      }
      if (a === 'submit-friend-code') {
        const input = document.getElementById('friend-code-input');
        const code = input ? input.value.trim() : '';
        if (!code) {
          navigate({ toast: '请输入好友的用户码' });
          return;
        }
        if (code === state.data.profile.userId) {
          navigate({ toast: '不能添加自己为好友' });
          return;
        }
        // 演示：假设该用户码是新用户，加入好友列表
        const newFriend = {
          id: 'f' + Date.now(),
          userId: code,
          name: '新好友 ' + code.slice(-2),
          remark: '',
        };
        state.data.friends.push(newFriend);
        navigate({ back: true, toast: '已发送好友申请给 ' + code });
        return;
      }
      if (a === 'accept-request') {
        const idx = state.data.friendRequests.findIndex(x => x.id === id);
        if (idx >= 0) {
          const r = state.data.friendRequests[idx];
          state.data.friendRequests.splice(idx, 1);
          state.data.friends.push({ id: 'f' + r.id, userId: r.userId, name: r.name, remark: '' });
          navigate({ toast: '已接受好友申请' });
        }
        return;
      }
      if (a === 'reject-request') {
        const idx = state.data.friendRequests.findIndex(x => x.id === id);
        if (idx >= 0) state.data.friendRequests.splice(idx, 1);
        navigate({ toast: '已拒绝' });
        return;
      }
      if (a === 'toggle-allow-set') {
        const scr = state.stack[state.stack.length - 1];
        if (scr && scr.params) scr.params.allowSet = !scr.params.allowSet;
        render();
        return;
      }
      if (a === 'toggle-allow-ring') {
        const scr = state.stack[state.stack.length - 1];
        if (scr && scr.params) scr.params.allowRing = !scr.params.allowRing;
        render();
        return;
      }
      if (a === 'delete-friend') {
        const idx = state.data.friends.findIndex(x => x.id === id);
        if (idx >= 0) state.data.friends.splice(idx, 1);
        navigate({ back: true, toast: '已删除好友' });
        return;
      }

      // 个人中心
      if (a === 'menu-click') return navigate({ toast: '演示：菜单项' });
      if (a === 'open-logout') return navigate({ modal: { key: 'logout-confirm' } });
      if (a === 'confirm-logout') return navigate({ logout: true, toast: '已退出登录' });
      // 个人快捷开关
      if (a === 'toggle-profile-setting') {
        const key = t.dataset.key;
        if (state.data.profileSettings && key) {
          state.data.profileSettings[key] = !state.data.profileSettings[key];
          render();
        }
        return;
      }

      // 分享
      if (a === 'share') return navigate({ toast: '演示：复制用户ID，分享给好友' });
    }

    /* ============================================================
       17. 手势：闹钟卡左滑编辑/删除
       ============================================================ */
    const swipeState = new WeakMap();

    function bindGestures() {
      // 闹钟卡左滑
      const faces = document.querySelectorAll('.alarm-card__face');
      faces.forEach(face => {
        const card = face.closest('.alarm-card');

      });

      const capsuleFaces = document.querySelectorAll('.capsule-card-v2__face');
      capsuleFaces.forEach(face => {
        const card = face.closest('.capsule-card-v2');
        if (!card) return;
        const id = 'cap_' + card.dataset.id;
        if (state.ui.swipeOpenId === id) {
          face.style.transform = 'translateX(-144px)';
        } else {

        attachSwipe(face, id);

      // iOS 时间选择器两列

        const hhCol = document.getElementById('ios-col-hh');

        if (hhCol) attachIosColScroll(hhCol, 24, parseInt(iosPicker.dataset.h, 10) || 0, 'h');

      }

    /** sent tab 专用下拉切换（独立函数，因为状态字段是 sentView） */
    function attachSentPull(bodyEl, indicatorEl) {
      let startY = 0, dy = 0, dragging = false, triggered = false;
      const pullText = indicatorEl.querySelector('#sent-pull-text') || indicatorEl;
      const onDown = (e) => {
        if (bodyEl.scrollTop > 0) return;
        const p = e.touches ? e.touches[0] : e;
        startY = p.clientY; dy = 0; dragging = true; triggered = false;
        indicatorEl.style.transition = 'none';
      };
      const onMove = (e) => {
        if (!dragging) return;
        const p = e.touches ? e.touches[0] : e;
        dy = Math.max(0, p.clientY - startY);
        if (dy < 6) return;
        if (e.cancelable) e.preventDefault();
        const visual = Math.min(dy, 150);
        indicatorEl.style.height = (32 + visual * 0.7) + 'px';
        if (dy > 150 && !triggered) {
          triggered = true;
          pullText.textContent = '松开关闭慢递';
          indicatorEl.classList.add('mine-pull-indicator--ready');
        } else if (dy <= 150) {
          pullText.textContent = state.ui.sentView === 'capsule' ? '继续下拉关闭慢递' : '继续下拉查看发出的慢递';
          indicatorEl.classList.remove('mine-pull-indicator--ready');
        }
      };
      const onUp = () => {
        if (!dragging) return;
        dragging = false;
        indicatorEl.style.transition = '';
        if (triggered && dy > 150) {
          state.ui.sentView = state.ui.sentView === 'capsule' ? 'list' : 'capsule';
          render();
          showToast(state.ui.sentView === 'capsule' ? '已查看发出的慢递' : '已返回闹钟列表');
        } else {
          indicatorEl.style.height = '32px';
        }
      };
      bodyEl.addEventListener('touchstart', onDown, { passive: true });
      bodyEl.addEventListener('touchmove', onMove, { passive: false });
      bodyEl.addEventListener('touchend', onUp);
      bodyEl.addEventListener('mousedown', onDown);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
    }

    /**
     * iOS 时间选择器单列拖动 + 惯性吸附
     * @param {HTMLElement} colEl - .ios-time-picker__col-inner
     * @param {number} count - 该列的数字总数（24 或 60）
     * @param {number} initialIdx - 初始下标
     * @param {string} key - 'h' 或 'm'，用于回写到 dataset
     */
    function attachIosColScroll(colEl, count, initialIdx, key) {
      const DIGIT_H = 56;
      let startY = 0, baseY = 0, dragging = false, currentIdx = initialIdx;
      const setTransform = (idx, withTransition) => {
        if (idx < 0) idx = 0;
        if (idx > count - 1) idx = count - 1;
        currentIdx = idx;
        colEl.style.transition = withTransition ? 'transform 0.25s cubic-bezier(0.16,1,0.3,1)' : 'none';
        // 让 active 数字居中显示（y=56，对齐指示器位置）
        colEl.style.transform = `translateY(-${(idx - 1) * DIGIT_H}px)`;
        // 更新 active digit
        const parent = colEl.parentElement;
        const digits = parent.querySelectorAll('.ios-time-picker__digit');
        digits.forEach((d, i) => d.classList.toggle('ios-time-picker__digit--active', i === idx));
        // 写到外层 dataset（存储值而不是索引，与初始渲染一致）
        const picker = colEl.closest('.ios-time-picker');
        if (picker) {
          const val = String(idx).padStart(2, '0');
          picker.dataset[key] = val;
          const h = picker.dataset.h;
          const m = picker.dataset.m;
          picker.dataset.time = `${h}:${m}`;
        }
      };

      const onDown = (e) => {
        const p = e.touches ? e.touches[0] : e;
        startY = p.clientY;
        baseY = -(currentIdx - 1) * DIGIT_H;
        dragging = true;
        colEl.style.transition = 'none';
      };
      const onMove = (e) => {
        if (!dragging) return;
        const p = e.touches ? e.touches[0] : e;
        const dy = p.clientY - startY;
        let next = baseY + dy;
        // 边界阻尼
        if (next > 56) next = 56 + (next - 56) * 0.3;
        const minY = -(count - 2) * DIGIT_H;
        if (next < minY) next = minY + (next - minY) * 0.3;
        colEl.style.transform = `translateY(${next}px)`;
        if (e.cancelable) e.preventDefault();
      };
      const onUp = () => {
        if (!dragging) return;
        dragging = false;
        const matrix = new DOMMatrixReadOnly(getComputedStyle(colEl).transform);
        const curY = matrix.m42;
        // setTransform 使用 (idx - 1) * DIGIT_H，所以 curY = -(idx - 1) * DIGIT_H
        // 反推：idx = 1 - curY / DIGIT_H
        let idx = Math.round(1 - curY / DIGIT_H);
        setTransform(idx, true);
      };
      // 滚轮支持（桌面调试）
      const onWheel = (e) => {
        e.preventDefault();
        const delta = Math.sign(e.deltaY);
        setTransform(currentIdx + delta, true);
      };
      // 点击某个 digit 直接选中
      const onClickDigit = (e) => {
        const digit = e.target.closest('.ios-time-picker__digit');
        if (!digit) return;
        const idx = Array.from(digit.parentElement.children).indexOf(digit);
        setTransform(idx, true);
      };

      colEl.parentElement.addEventListener('touchstart', onDown, { passive: true });
      colEl.parentElement.addEventListener('touchmove', onMove, { passive: false });
      colEl.parentElement.addEventListener('touchend', onUp);
      colEl.parentElement.addEventListener('mousedown', onDown);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
      colEl.parentElement.addEventListener('wheel', onWheel, { passive: false });
      colEl.parentElement.addEventListener('click', onClickDigit);
      
      // 初始化时只同步高亮状态，不改变 transform（避免和初始渲染冲突）
      const parent = colEl.parentElement;
      const digits = parent.querySelectorAll('.ios-time-picker__digit');
      digits.forEach((d, i) => d.classList.toggle('ios-time-picker__digit--active', i === currentIdx));
    }

    /**
     * 三列滚轮（年/月/日 或 月/日）单列拖动 + 惯性吸附
     * 与 iOS 时间选择器不同的只是 item 高度与公式
     * @param {HTMLElement} colEl - .col__inner
     * @param {number} count - 该列项数
     * @param {number} initialIdx - 初始下标
     * @param {string} colKey - 'year' | 'month' | 'day'
     */
    function attachThreeColScroll(colEl, count, initialIdx, colKey) {
      const ITEM_H = 56;
      let startY = 0, baseY = 0, dragging = false, currentIdx = initialIdx;
      const setTransform = (idx, withTransition) => {
        if (idx < 0) idx = 0;
        if (idx > count - 1) idx = count - 1;
        currentIdx = idx;
        colEl.style.transition = withTransition ? 'transform 0.25s cubic-bezier(0.16,1,0.3,1)' : 'none';
        // item 高度 56，indicator 中心 110px
        colEl.style.transform = `translateY(${(82 - idx * ITEM_H)}px)`;
        // 更新 active
        const items = colEl.querySelectorAll('.col__item');
        items.forEach((d, i) => d.classList.toggle('col__item--active', i === idx));
        // 写回 modal params
        const modal = state.modals[state.modals.length - 1];
        if (modal) {
          if (!modal.params) modal.params = {};
          const val = parseInt(items[idx] && items[idx].dataset.val, 10);
          if (!isNaN(val)) {
            if (colKey === 'year')  modal.params.year  = val;
            if (colKey === 'month') modal.params.month = val;
            if (colKey === 'day')   modal.params.day   = val;
          }
        }
      };
      const onDown = (e) => {
        const p = e.touches ? e.touches[0] : e;
        startY = p.clientY;
        baseY = 82 - currentIdx * ITEM_H;
        dragging = true;
        colEl.style.transition = 'none';
      };
      const onMove = (e) => {
        if (!dragging) return;
        const p = e.touches ? e.touches[0] : e;
        const dy = p.clientY - startY;
        let next = baseY + dy;
        if (next > 82) next = 82 + (next - 82) * 0.3;
        const minY = 82 - (count - 1) * ITEM_H;
        if (next < minY) next = minY + (next - minY) * 0.3;
        colEl.style.transform = `translateY(${next}px)`;
        if (e.cancelable) e.preventDefault();
      };
      const onUp = () => {
        if (!dragging) return;
        dragging = false;
        const matrix = new DOMMatrixReadOnly(getComputedStyle(colEl).transform);
        const curY = matrix.m42;
        const idx = Math.round((82 - curY) / ITEM_H);
        setTransform(idx, true);
        // 年/月变化 → 重渲染以联动"日"列
        if (colKey === 'year' || colKey === 'month') render();
      };
      const onWheel = (e) => {
        e.preventDefault();
        const delta = Math.sign(e.deltaY);
        setTransform(currentIdx + delta, true);
        if (colKey === 'year' || colKey === 'month') render();
      };
      const parent = colEl.parentElement;
      parent.addEventListener('touchstart', onDown, { passive: true });
      parent.addEventListener('touchmove', onMove, { passive: false });
      parent.addEventListener('touchend', onUp);
      parent.addEventListener('mousedown', onDown);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
      parent.addEventListener('wheel', onWheel, { passive: false });
    }
    /** 为弹层中所有 .col__inner 绑定滚轮 */
    function bindThreeColScrolls() {
      const popModal = state.modals[state.modals.length - 1];
      if (!popModal) return;
      document.querySelectorAll('.modal--center .col__inner').forEach(colEl => {
        const key = colEl.dataset.col;
        if (!key) return;
        // 用当前 params 计算 idx
        let idx = 0;
        const items = colEl.querySelectorAll('.col__item');
        if (key === 'year' && popModal.params && popModal.params.year) {
          for (let i = 0; i < items.length; i++) {
            if (parseInt(items[i].dataset.val, 10) === popModal.params.year) { idx = i; break; }
          }
        } else if (key === 'month' && popModal.params && popModal.params.month) {
          for (let i = 0; i < items.length; i++) {
            if (parseInt(items[i].dataset.val, 10) === popModal.params.month) { idx = i; break; }
          }
        } else if (key === 'day' && popModal.params && popModal.params.day) {
          for (let i = 0; i < items.length; i++) {
            if (parseInt(items[i].dataset.val, 10) === popModal.params.day) { idx = i; break; }
          }
        }
        attachThreeColScroll(colEl, items.length, idx, key);
      });
    }

    function attachSwipe(face, id) {
      let startX = 0, startY = 0, dx = 0, dy = 0, dragging = false, baseX = 0, locked = null;
      const onDown = (e) => {
        const p = e.touches ? e.touches[0] : e;
        startX = p.clientX; startY = p.clientY;
        baseX = state.ui.swipeOpenId === id ? -144 : 0;
        dx = 0; dy = 0; dragging = true; locked = null;
        face.style.transition = 'none';
      };
      const onMove = (e) => {
        if (!dragging) return;
        const p = e.touches ? e.touches[0] : e;
        dx = p.clientX - startX;
        dy = p.clientY - startY;
        if (locked == null) {
          if (Math.abs(dy) > 6 && Math.abs(dy) > Math.abs(dx)) { dragging = false; return; }
          if (Math.abs(dx) > 6) locked = 'h';
        }
        if (locked !== 'h') return;
        let next = baseX + dx;
        if (next > 0) next = 0;
        if (next < -144) next = -144;
        face.style.transform = `translateX(${next}px)`;
        if (e.cancelable) e.preventDefault();
      };
      const onUp = () => {
        if (!dragging) return;
        dragging = false;
        face.style.transition = '';
        const finalX = baseX + dx;
        if (finalX < -72) {
          face.style.transform = 'translateX(-144px)';
          state.ui.swipeOpenId = id;
        } else {
          face.style.transform = '';
          state.ui.swipeOpenId = null;
        }
      };
      face.addEventListener('touchstart', onDown, { passive: true });
      face.addEventListener('touchmove', onMove, { passive: false });
      face.addEventListener('touchend', onUp);
      face.addEventListener('mousedown', onDown);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
    }

    /**
     * mine tab 顶部 pull-down 指示器手势
     * - list 模式下拉到 150px → 切到 capsule
     * - capsule 模式下拉到 150px → 切回 list
     * 阈值 150 来自 Figma 源码：G > 150 时切换文本提示
     */
    function attachMinePull(bodyEl, indicatorEl) {
      let startY = 0, dy = 0, dragging = false, triggered = false;
      const pullText = indicatorEl.querySelector('#mine-pull-text') || indicatorEl;

      const onDown = (e) => {
        // 只在滚动到顶部时启动下拉
        if (bodyEl.scrollTop > 0) return;
        const p = e.touches ? e.touches[0] : e;
        startY = p.clientY; dy = 0; dragging = true; triggered = false;
        indicatorEl.style.transition = 'none';
      };
      const onMove = (e) => {
        if (!dragging) return;
        const p = e.touches ? e.touches[0] : e;
        dy = Math.max(0, p.clientY - startY);
        if (dy < 6) return;
        if (e.cancelable) e.preventDefault();
        // 视觉：indicator 高度随 dy 增长（32px 基础 + dy，最高 150px）
        const visual = Math.min(dy, 150);
        indicatorEl.style.height = (32 + visual * 0.7) + 'px';
        if (dy > 150 && !triggered) {
          triggered = true;
          pullText.textContent = state.ui.mineView === 'capsule' ? '松开关闭慢递' : '松开查看慢递';
          indicatorEl.classList.add('mine-pull-indicator--ready');
        } else if (dy <= 150) {
          pullText.textContent = state.ui.mineView === 'capsule' ? '继续下拉关闭慢递' : '继续下拉查看慢递';
          indicatorEl.classList.remove('mine-pull-indicator--ready');
        }
      };
      const onUp = () => {
        if (!dragging) return;
        dragging = false;
        indicatorEl.style.transition = '';
        if (triggered && dy > 150) {
          // 触发切换
          state.ui.mineView = state.ui.mineView === 'capsule' ? 'list' : 'capsule';
          render();
          showToast(state.ui.mineView === 'capsule' ? '已查看慢递' : '已返回闹钟列表');
        } else {
          // 弹性回到原位
          indicatorEl.style.height = '32px';
        }
      };
      bodyEl.addEventListener('touchstart', onDown, { passive: true });
      bodyEl.addEventListener('touchmove', onMove, { passive: false });
      bodyEl.addEventListener('touchend', onUp);
      // 鼠标兜底（方便桌面测试）
      bodyEl.addEventListener('mousedown', onDown);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
    }

    /* ============================================================
       18. 启动
       ============================================================ */
    // 点击模态背景关闭
    document.addEventListener('click', (e) => {
      if (e.target.classList && e.target.classList.contains('modal')) {
        navigate({ back: true });
      }
    });

    // ESC 键关闭模态/返回
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (state.modals.length) navigate({ back: true });
        else if (state.stack.length > 1) navigate({ back: true });
      }
    });

    // 首次渲染
    render();

    // 调试用：?click=xxx 在渲染后自动模拟一次点击，方便回归测试
    const _clickAction = _qa.get('click');
    if (_clickAction) {
      setTimeout(() => {
        const target = document.querySelector(`[data-action="${_clickAction}"]`);
        if (target) target.click();
        else console.warn('click target not found:', _clickAction);
      }, 50);
    }
  })();
  </script>
</body>
</html>
