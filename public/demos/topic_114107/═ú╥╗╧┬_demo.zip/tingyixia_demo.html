<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>《停一下》功能演示</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Microsoft YaHei", "PingFang SC", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      background: linear-gradient(135deg, #e8f0fe 0%, #d4e4fc 45%, #c9d8f0 100%);
      background-attachment: fixed;
      color: #241c17;
      line-height: 1.8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
      animation: fadeDown 0.8s ease-out;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .header-logo {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #ffb347 0%, #ff8c5a 30%, #ff6b35 70%, #ff5722 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
      position: relative;
      overflow: hidden;
    }

    .header-logo::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.3) 0%, transparent 50%);
    }

    @keyframes fadeDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header h1 {
      font-size: 48px;
      letter-spacing: -3px;
      margin-bottom: 8px;
    }

    .header .tagline {
      font-size: 16px;
      color: #7a6658;
    }

    .header .highlight {
      color: #ff6b35;
      font-weight: 600;
    }

    .phone {
      background: linear-gradient(145deg, #2a211c, #1a1410);
      border-radius: 48px;
      padding: 14px;
      box-shadow:
        0 40px 100px rgba(120, 70, 30, 0.25),
        0 0 0 2px rgba(255, 255, 255, 0.05),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      width: 380px;
      position: relative;
      animation: phoneSlide 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
    }

    .phone::before {
      content: "";
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 32px;
      background: #1a1410;
      border-radius: 20px;
      z-index: 20;
    }

    .phone::after {
      content: "";
      position: absolute;
      right: -4px;
      top: 120px;
      width: 4px;
      height: 60px;
      background: linear-gradient(90deg, #2a211c, #1a1410);
      border-radius: 0 4px 4px 0;
      box-shadow:
        0 80px 0 -1px #2a211c,
        0 110px 0 -1px #2a211c;
    }

    .phone-side-left {
      position: absolute;
      left: -4px;
      top: 100px;
      width: 4px;
      height: 40px;
      background: linear-gradient(90deg, #1a1410, #2a211c);
      border-radius: 4px 0 0 4px;
      box-shadow:
        0 60px 0 -1px #2a211c,
        0 100px 0 -1px #2a211c;
    }

    @keyframes phoneSlide {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .phone-inner {
      background: linear-gradient(160deg, #fffaf4, #f0fff9);
      border-radius: 36px;
      min-height: 720px;
      padding: 52px 20px 32px;
      position: relative;
      overflow: hidden;
    }

    .phone-inner::before {
      content: "";
      position: absolute;
      top: -50%;
      right: -30%;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(255, 107, 53, 0.06), transparent);
      border-radius: 50%;
    }

    .home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 134px;
      height: 5px;
      background: rgba(36, 28, 23, 0.3);
      border-radius: 999px;
      z-index: 5;
    }

    .status {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
      color: #241c17;
      margin-bottom: 20px;
      padding: 0 8px;
      position: absolute;
      top: 12px;
      right: 24px;
      z-index: 30;
      transition: color 0.3s ease;
    }

    .status.on-home {
      color: #fff;
    }

    .status-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-icon {
      font-size: 14px;
    }

    .card {
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid #ead8c6;
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 10px 35px rgba(120, 70, 30, 0.08);
      position: relative;
      overflow: hidden;
    }

    .card h3 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .btn-row {
      margin-bottom: 16px;
    }

    .btn-row:last-child {
      margin-bottom: 0;
    }

    .btn-label {
      display: block;
      font-size: 12px;
      color: #a89888;
      font-weight: 500;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .row-btn {
      flex: 1;
      min-width: 70px;
      padding: 8px 6px;
      border: 1px solid #ead8c6;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.8);
      color: #6e5f55;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .row-btn:hover {
      border-color: #ffb38d;
      background: #fff5ee;
      color: #241c17;
    }

    .row-btn.active {
      border-color: #ff6b35;
      background: #ffe4d5;
      color: #241c17;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(255, 107, 53, 0.2);
    }

    .demo-trigger {
      text-align: center;
      padding: 20px;
      margin-bottom: 16px;
    }

    .demo-btn {
      display: inline-block;
      background: linear-gradient(135deg, #ff6b35, #ff8c5a);
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
    }

    .demo-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 107, 53, 0.4);
    }

    .demo-note {
      display: block;
      color: #a89888;
      font-size: 13px;
      margin-top: 8px;
    }

    /* 灰屏遮罩 */
    .gray-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(36, 28, 23, 0.85);
      z-index: 10;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease;
    }

    .gray-overlay.show {
      display: flex;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .overlay-content {
      text-align: center;
      width: 100%;
      padding: 113px 20px 20px;
    }

    /* 小宠物 */
    .pet-reminder {
      display: none;
      align-items: center;
      gap: 12px;
      position: absolute;
      top: 137px;
      left: 24px;
    }

    .pet-reminder.show {
      display: flex;
      animation: petAppear 0.5s ease-out;
    }

    @keyframes petAppear {
      from { opacity: 0; transform: scale(0.5); }
      to { opacity: 1; transform: scale(1); }
    }

    .pet {
      font-size: 48px;
      animation: petBounce 0.6s ease-in-out infinite;
    }

    @keyframes petBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .pet-voice {
      background: rgba(255, 255, 255, 0.15);
      color: #fffaf4;
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(10px);
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: voicePop 0.4s ease-out 0.2s both;
    }

    @keyframes voicePop {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }

    /* AI提醒文案 - 艺术字 */
    .ai-message {
      display: none;
      position: absolute;
      top: 263px;
      left: 0;
      right: 0;
      padding: 0 20px;
    }

    .ai-message.show {
      display: block;
      animation: messageFade 0.5s ease-out;
    }

    @keyframes messageFade {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-text {
      font-size: 22px;
      color: #fffaf4;
      font-weight: 700;
      line-height: 1.6;
      text-shadow:
        0 0 20px rgba(255, 107, 53, 0.5),
        0 2px 8px rgba(0, 0, 0, 0.3);
      letter-spacing: 1px;
    }

    /* 运动引导 - 动画小人 */
    .exercise-guide {
      display: none;
      position: absolute;
      top: 413px;
      left: 0;
      right: 0;
      text-align: center;
    }

    .exercise-guide.show {
      display: block;
      animation: exerciseFade 0.5s ease-out;
    }

    @keyframes exerciseFade {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .exercise-text {
      color: rgba(255, 250, 244, 0.8);
      font-size: 14px;
      margin-top: 12px;
    }

    /* 动画小人 - 可爱卡通版 */
    .dancer {
      display: inline-block;
      position: relative;
      width: 100px;
      height: 130px;
    }

    /* 头部 */
    .dancer-head {
      width: 56px;
      height: 56px;
      background: linear-gradient(180deg, #ffe8d5 0%, #ffd4b8 100%);
      border-radius: 50%;
      margin: 0 auto;
      position: relative;
      z-index: 2;
      border: 3px solid #ffb890;
      box-shadow: 0 4px 12px rgba(255, 107, 53, 0.2);
    }

    /* 眼睛 */
    .dancer-eye-left, .dancer-eye-right {
      position: absolute;
      top: 20px;
      width: 8px;
      height: 10px;
      background: #2d2016;
      border-radius: 50%;
    }

    .dancer-eye-left { left: 14px; }
    .dancer-eye-right { right: 14px; }

    .dancer-eye-left::after, .dancer-eye-right::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 3px;
      height: 3px;
      background: #fff;
      border-radius: 50%;
    }

    /* 腮红 */
    .dancer-cheek-left, .dancer-cheek-right {
      position: absolute;
      top: 30px;
      width: 10px;
      height: 6px;
      background: #ffb3a0;
      border-radius: 50%;
      opacity: 0.7;
    }

    .dancer-cheek-left { left: 8px; }
    .dancer-cheek-right { right: 8px; }

    /* 嘴巴 */
    .dancer-mouth {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 6px;
      border: 2px solid #e8745a;
      border-top: none;
      border-radius: 0 0 12px 12px;
    }

    /* 身体 */
    .dancer-body {
      width: 44px;
      height: 48px;
      background: linear-gradient(180deg, #ff8a5c 0%, #ff6b35 100%);
      border-radius: 20px 20px 16px 16px;
      margin: -4px auto 0;
      position: relative;
      z-index: 1;
      border: 3px solid #e85a20;
    }

    /* 手臂 */
    .dancer-arm-left, .dancer-arm-right {
      position: absolute;
      top: 4px;
      width: 14px;
      height: 36px;
      background: linear-gradient(180deg, #ffe8d5 0%, #ffd4b8 100%);
      border-radius: 7px;
      transform-origin: top center;
      border: 2px solid #ffb890;
      z-index: 3;
    }

    .dancer-arm-left {
      left: -12px;
    }

    .dancer-arm-right {
      right: -12px;
    }

    .dancer-hand-left, .dancer-hand-right {
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 12px;
      background: #ffe8d5;
      border-radius: 50%;
      border: 2px solid #ffb890;
    }

    /* 腿 */
    .dancer-leg-left, .dancer-leg-right {
      position: absolute;
      bottom: -28px;
      width: 14px;
      height: 28px;
      background: linear-gradient(180deg, #5c88ff 0%, #3d66e8 100%);
      border-radius: 7px 7px 5px 5px;
      transform-origin: top center;
      border: 2px solid #2d4dcc;
    }

    .dancer-leg-left { left: 30px; }
    .dancer-leg-right { right: 30px; }

    .dancer-foot-left, .dancer-foot-right {
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 18px;
      height: 8px;
      background: #2d2016;
      border-radius: 4px;
    }

    /* 默认动作 - 全身摇摆 */
    .dancer.action-default .dancer-head {
      animation: headBob 1s ease-in-out infinite;
    }

    .dancer.action-default .dancer-body {
      animation: bodySway 1s ease-in-out infinite;
    }

    .dancer.action-default .dancer-arm-left {
      animation: armSwingLeft 1s ease-in-out infinite;
    }

    .dancer.action-default .dancer-arm-right {
      animation: armSwingRight 1s ease-in-out infinite;
    }

    .dancer.action-default .dancer-leg-left {
      animation: legTapLeft 1s ease-in-out infinite;
    }

    .dancer.action-default .dancer-leg-right {
      animation: legTapRight 1s ease-in-out infinite;
    }

    @keyframes headBob {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50% { transform: translateY(-4px) rotate(5deg); }
    }

    @keyframes bodySway {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }

    @keyframes armSwingLeft {
      0%, 100% { transform: rotate(30deg); }
      50% { transform: rotate(-20deg); }
    }

    @keyframes armSwingRight {
      0%, 100% { transform: rotate(-30deg); }
      50% { transform: rotate(20deg); }
    }

    @keyframes legTapLeft {
      0%, 100% { transform: rotate(10deg); }
      50% { transform: rotate(-10deg); }
    }

    @keyframes legTapRight {
      0%, 100% { transform: rotate(-10deg); }
      50% { transform: rotate(10deg); }
    }

    /* 放松眼睛 - 眨眼动作 */
    .dancer.action-eyes .dancer-eye-left,
    .dancer.action-eyes .dancer-eye-right {
      animation: blink 2s ease-in-out infinite;
    }

    .dancer.action-eyes .dancer-head {
      animation: headSlowTurn 3s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 45%, 55%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.1); }
    }

    @keyframes headSlowTurn {
      0%, 100% { transform: rotate(-8deg); }
      50% { transform: rotate(8deg); }
    }

    /* 放松头颈 - 点头转头 */
    .dancer.action-neck .dancer-head {
      animation: headNod 1.5s ease-in-out infinite;
    }

    .dancer.action-neck .dancer-body {
      animation: bodyStill 1s linear infinite;
    }

    @keyframes headNod {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      25% { transform: rotate(15deg) translateY(2px); }
      50% { transform: rotate(-15deg) translateY(2px); }
      75% { transform: rotate(0deg) translateY(-4px); }
    }

    @keyframes bodyStill {
      0%, 100% { transform: rotate(0deg); }
    }

    /* 放松肩背 - 扩胸运动 */
    .dancer.action-shoulder .dancer-arm-left {
      animation: armChestLeft 1.2s ease-in-out infinite;
    }

    .dancer.action-shoulder .dancer-arm-right {
      animation: armChestRight 1.2s ease-in-out infinite;
    }

    .dancer.action-shoulder .dancer-body {
      animation: chestExpand 1.2s ease-in-out infinite;
    }

    .dancer.action-shoulder .dancer-head {
      animation: headUp 1.2s ease-in-out infinite;
    }

    @keyframes armChestLeft {
      0%, 100% { transform: rotate(20deg) translateX(0); }
      50% { transform: rotate(90deg) translateX(-6px); }
    }

    @keyframes armChestRight {
      0%, 100% { transform: rotate(-20deg) translateX(0); }
      50% { transform: rotate(-90deg) translateX(6px); }
    }

    @keyframes chestExpand {
      0%, 100% { transform: scaleX(1); }
      50% { transform: scaleX(1.05); }
    }

    @keyframes headUp {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-2px) rotate(-5deg); }
    }

    /* 放松腰臀 - 扭腰 */
    .dancer.action-waist .dancer-body {
      animation: waistTwist 0.8s ease-in-out infinite;
    }

    .dancer.action-waist .dancer-head {
      animation: waistHead 0.8s ease-in-out infinite;
    }

    .dancer.action-waist .dancer-arm-left,
    .dancer.action-waist .dancer-arm-right {
      animation: armHip 0.8s ease-in-out infinite;
    }

    @keyframes waistTwist {
      0%, 100% { transform: rotate(-12deg) translateX(-2px); }
      50% { transform: rotate(12deg) translateX(2px); }
    }

    @keyframes waistHead {
      0%, 100% { transform: rotate(6deg); }
      50% { transform: rotate(-6deg); }
    }

    @keyframes armHip {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(20deg); }
    }

    /* 自由放松 - 全身跳跃 */
    .dancer.action-free {
      animation: fullJump 0.8s ease-in-out infinite;
    }

    .dancer.action-free .dancer-head {
      animation: freeHead 0.8s ease-in-out infinite;
    }

    .dancer.action-free .dancer-arm-left {
      animation: freeArmLeft 0.8s ease-in-out infinite;
    }

    .dancer.action-free .dancer-arm-right {
      animation: freeArmRight 0.8s ease-in-out infinite;
    }

    .dancer.action-free .dancer-leg-left,
    .dancer.action-free .dancer-leg-right {
      animation: freeLeg 0.8s ease-in-out infinite;
    }

    @keyframes fullJump {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    @keyframes freeHead {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-10deg); }
      75% { transform: rotate(10deg); }
    }

    @keyframes freeArmLeft {
      0%, 100% { transform: rotate(20deg); }
      50% { transform: rotate(-60deg); }
    }

    @keyframes freeArmRight {
      0%, 100% { transform: rotate(-20deg); }
      50% { transform: rotate(60deg); }
    }

    @keyframes freeLeg {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(15deg); }
    }

    /* 运动状态文字 */
    .exercise-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }

    .music-notes {
      font-size: 20px;
      animation: noteFloat 1s ease-in-out infinite;
    }

    @keyframes noteFloat {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.7; }
      50% { transform: translateY(-8px) scale(1.2); opacity: 1; }
    }

    /* 倒计时进度条 */
    .progress-bar {
      width: 200px;
      height: 6px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      margin: 12px auto 0;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ffb347, #ff6b35);
      border-radius: 999px;
      transform-origin: left center;
    }

    .progress-fill.animate {
      animation: progressCountdown 60s linear forwards;
    }

    @keyframes progressCountdown {
      from { transform: scaleX(1); }
      to { transform: scaleX(0); }
    }

    /* 完成提示弹窗 */
    .complete-popup {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 32px 28px;
      text-align: center;
      z-index: 25;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      opacity: 0;
      transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
      width: 260px;
    }

    .complete-popup.show {
      display: block;
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .complete-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #ffb347 0%, #ff6b35 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 16px;
      box-shadow: 0 4px 16px rgba(255, 107, 53, 0.4);
    }

    .complete-title {
      font-size: 20px;
      font-weight: 700;
      color: #2d2016;
      margin-bottom: 4px;
    }

    .complete-desc {
      font-size: 14px;
      color: #7a6658;
    }

    /* 重新演示按钮 */
    .restart-btn {
      display: none;
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);

        },
        free: {
          gentle: '是时候休息一下了，让身体和心灵都放个假。',
          funny: '停停停！再看下去你就要和手机融为一体了！',
          direct: '休息时间到，请暂停用屏。',
          worker: '摸鱼时间到！放下手机，给身体充个电。',
          custom: '自定义提醒文案'
        }
      };

      var exerciseMap = {
        eyes: '播放舒缓音乐，带你做眼部放松操...',
        neck: '播放轻柔音乐，带你做颈部拉伸...',
        shoulder: '播放轻柔音乐，带你完成肩颈放松...',
        waist: '播放轻快音乐，带你起身活动腰部...',
        free: '播放白噪音，自由选择放松方式...'
      };

      function getCurrentSelection() {
        var relaxBtn = document.querySelector('.row-btn[data-type="relax"].active');
        var toneBtn = document.querySelector('.row-btn[data-type="tone"].active');
        return {
          relax: relaxBtn ? relaxBtn.getAttribute('data-relax') : 'shoulder',
          tone: toneBtn ? toneBtn.getAttribute('data-tone') : 'funny'
        };
      }

      function updateContent() {
        var selection = getCurrentSelection();
        var relax = selection.relax;
        var tone = selection.tone;

        if (messageMap[relax] && messageMap[relax][tone]) {
          messageText.textContent = messageMap[relax][tone];
        }
        if (exerciseMap[relax]) {
          exerciseText.textContent = exerciseMap[relax];
        }
      }

      var audioCtx = null;
      var musicGain = null;
      var musicInterval = null;
      var speechTimers = [];
      var synth = window.speechSynthesis;
      var selectedVoice = null;

      function initVoice() {
        var voices = synth.getVoices();
        var zhVoices = voices.filter(function(v) {
          return v.lang.indexOf('zh') >= 0 || v.lang.indexOf('CN') >= 0;
        });

        var preferredNames = ['晓晓', '晓伊', '小燕', 'Yaoyao', 'Xiaoxiao', 'Tingting', 'Sinji', 'Mei-jia', 'Kangkang', 'Huihui'];
        for (var i = 0; i < preferredNames.length; i++) {
          for (var j = 0; j < zhVoices.length; j++) {
            if (zhVoices[j].name.indexOf(preferredNames[i]) >= 0) {
              selectedVoice = zhVoices[j];
              return;
            }
          }
        }

        if (zhVoices.length > 0) {
          selectedVoice = zhVoices[0];
        } else if (voices.length > 0) {
          selectedVoice = voices[0];
        }
      }

      if (synth.onvoiceschanged !== undefined) {
        synth.onvoiceschanged = initVoice;
      }
      initVoice();

      function initAudio() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      function playNote(frequency, duration, time, gainValue) {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = frequency;
        gain.gain.setValueAtTime(0, time);
        gain.gain.linearRampToValueAtTime(gainValue, time + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, time + duration);
        osc.connect(gain);
        gain.connect(musicGain);
        osc.start(time);
        osc.stop(time + duration);
      }

      function startMusic() {
        initAudio();
        if (musicInterval) clearTimeout(musicInterval);

        musicGain = audioCtx.createGain();
        musicGain.gain.value = 0;
        musicGain.connect(audioCtx.destination);
        musicGain.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.8);

        var melody = [
          { note: 523.25, dur: 0.5 },
          { note: 587.33, dur: 0.5 },
          { note: 659.25, dur: 0.5 },
          { note: 698.46, dur: 0.5 },
          { note: 783.99, dur: 1 },
          { note: 698.46, dur: 0.5 },
          { note: 659.25, dur: 0.5 },
          { note: 587.33, dur: 1 },
          { note: 523.25, dur: 0.5 },
          { note: 659.25, dur: 0.5 },
          { note: 783.99, dur: 1 },
          { note: 659.25, dur: 0.5 },
          { note: 587.33, dur: 0.5 },
          { note: 523.25, dur: 1 }
        ];

        var bassNotes = [261.63, 196.00, 220.00, 246.94];
        var noteIndex = 0;
        var bassIndex = 0;
        var bassTimer = 0;

        function playNextNote() {
          var now = audioCtx.currentTime;
          var noteInfo = melody[noteIndex];

          playNote(noteInfo.note, noteInfo.dur * 0.9, now, 0.35);
          playNote(noteInfo.note / 2, noteInfo.dur * 0.9, now, 0.12);

          bassTimer += noteInfo.dur;
          if (bassTimer >= 2) {
            bassTimer = 0;
            playNote(bassNotes[bassIndex], 1.5, now, 0.2);
            bassIndex = (bassIndex + 1) % bassNotes.length;
          }

          noteIndex = (noteIndex + 1) % melody.length;
          musicInterval = setTimeout(playNextNote, noteInfo.dur * 600);
        }

        playNextNote();
      }

      function stopMusic() {
        if (musicGain) {
          musicGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
        }
        if (musicInterval) {
          clearTimeout(musicInterval);
          musicInterval = null;
        }
      }

      function speak(text, delay, clear) {
        if (clear === undefined) clear = true;
        var timer = setTimeout(function() {
          if (clear && synth.speaking) {
            synth.cancel();
          }
          var utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'zh-CN';
          utterance.rate = 0.85;
          utterance.pitch = 1.3;
          utterance.volume = 1;
          if (selectedVoice) {
            utterance.voice = selectedVoice;
          }
          synth.speak(utterance);
        }, delay);
        speechTimers.push(timer);
      }

      function stopSpeech() {
        speechTimers.forEach(function(timer) {
          clearTimeout(timer);
        });
        speechTimers = [];
        if (synth.speaking) {
          synth.cancel();
        }
      }

      var exerciseScripts = {
        eyes: [
          { text: '放松眼睛，请闭眼', delay: 0 },
          { text: '眼球左转，一，二，三', delay: 1500 },
          { text: '四，五，六，七', delay: 4500 },
          { text: '好，右转，一，二，三', delay: 8000 },
          { text: '四，五，六，七', delay: 11000 },
          { text: '再左转，一，二，三', delay: 14500 },
          { text: '四，五，六，七', delay: 17500 }
        ],
        neck: [
          { text: '放松头颈，请坐直', delay: 0 },
          { text: '向前点头，一，二，三', delay: 1500 },
          { text: '向后点头，一，二，三', delay: 5000 },
          { text: '向左点，向右点', delay: 8500 },
          { text: '向左点，向右点', delay: 11000 },
          { text: '向左绕圈，一，二，三', delay: 13500 },
          { text: '向右绕圈，一，二，三', delay: 17000 }
        ],
        shoulder: [
          { text: '放松肩背，深呼吸', delay: 0 },
          { text: '双肩向上，一，二，三', delay: 1500 },
          { text: '放下', delay: 4500 },
          { text: '再向上，一，二，三', delay: 5500 },
          { text: '放下', delay: 8500 },
          { text: '向前绕肩，一，二，三', delay: 9500 },
          { text: '向后绕肩，一，二，三', delay: 13000 },
          { text: '扩胸运动，一，二，三', delay: 16500 }
        ],
        waist: [
          { text: '放松腰臀，请起身', delay: 0 },
          { text: '向左转体，一，二，三', delay: 1500 },
          { text: '回到正中', delay: 4500 },
          { text: '向右转体，一，二，三', delay: 5500 },
          { text: '回到正中', delay: 8500 },
          { text: '髋部绕环，向左，一，二，三', delay: 9500 },
          { text: '向右，一，二，三', delay: 13500 },
          { text: '深呼吸，放松', delay: 17500 }
        ],
        free: [
          { text: '自由放松，深呼吸', delay: 0 },
          { text: '吸气', delay: 1500 },
          { text: '呼气', delay: 4000 },
          { text: '再吸气', delay: 6500 },
          { text: '再呼气', delay: 9000 },
          { text: '感受身体的放松', delay: 11500 },
          { text: '让每一块肌肉都软下来', delay: 15000 },
          { text: '很好，继续保持', delay: 18000 }
        ]
      };

      var exerciseNames = {
        eyes: '眼部放松',
        neck: '头颈放松',
        shoulder: '肩背放松',
        waist: '腰臀放松',
        free: '自由放松'
      };

      var totalTimer = null;
      var currentExerciseIndex = 0;
      var exerciseQueue = [];
      var currentExerciseStartTime = 0;

      function getSelectedRelaxTypes() {
        var selected = [];
        document.querySelectorAll('.row-btn[data-type="relax"].active').forEach(function(btn) {
          selected.push(btn.getAttribute('data-relax'));
        });
        return selected;
      }

      function buildExerciseQueue() {
        var selected = getSelectedRelaxTypes();
        if (selected.length === 0) {
          selected = ['shoulder'];
        }
        if (selected.length === 1) {
          return [selected[0], selected[0], selected[0]];
        }
        var queue = [];
        var idx = 0;
        while (queue.length < 3 && idx < selected.length) {
          queue.push(selected[idx]);
          idx++;
        }
        while (queue.length < 3) {
          queue.push(selected[0]);
        }
        return queue;
      }

      function playOneExercise(relaxType, baseDelay) {
        var script = exerciseScripts[relaxType];
        if (!script) return;

        script.forEach(function(item) {
          speak(item.text, baseDelay + item.delay);
        });
      }

      function updateExerciseDisplay(relaxType) {
        if (exerciseNames[relaxType]) {
          exerciseText.textContent = exerciseNames[relaxType] + ' · 60秒跟练';
        }
        setDancerAction(relaxType);
      }

      function startExerciseSequence() {
        exerciseQueue = buildExerciseQueue();
        currentExerciseIndex = 0;

        function playNext() {
          if (currentExerciseIndex >= exerciseQueue.length) {
            return;
          }
          var relaxType = exerciseQueue[currentExerciseIndex];
          updateExerciseDisplay(relaxType);
          playOneExercise(relaxType, 0);
          currentExerciseIndex++;

          if (currentExerciseIndex < exerciseQueue.length) {
            setTimeout(playNext, 20000);
          }
        }

        playNext();
      }

      function startDemo() {
        if (isPlaying) return;
        isPlaying = true;

        var selection = getCurrentSelection();
        updateContent();

        demoTrigger.style.display = 'none';
        restartBtn.classList.remove('show');

        grayOverlay.classList.add('show');

        setTimeout(function() {
          petReminder.classList.add('show');
          speak('停一下', 300, false);
        }, 500);

        setTimeout(function() {
          aiMessage.classList.add('show');

          setTimeout(function() {
            exerciseGuide.classList.add('show');
            progressFill.classList.remove('animate');
            void progressFill.offsetWidth;
            progressFill.classList.add('animate');
            startMusic();
            startExerciseSequence();
          }, 1500);
        }, 2500);

        totalTimer = setTimeout(function() {
          stopMusic();
          setTimeout(function() {
            speak('运动结束了，为自律的你点赞', 0, false);
            completePopup.classList.add('show');
            setTimeout(function() {
              restartBtn.classList.add('show');
              isPlaying = false;
            }, 2000);
            setTimeout(function() {
              completePopup.classList.remove('show');
              closeApp();
            }, 4500);
          }, 600);
        }, 62500);
      }

      function resetDemo() {
        stopMusic();
        stopSpeech();
        if (totalTimer) {
          clearTimeout(totalTimer);
          totalTimer = null;
        }
        exerciseQueue = [];
        currentExerciseIndex = 0;
        grayOverlay.classList.remove('show');
        petReminder.classList.remove('show');
        aiMessage.classList.remove('show');
        exerciseGuide.classList.remove('show');
        restartBtn.classList.remove('show');
        progressFill.classList.remove('animate');
        completePopup.classList.remove('show');
        demoTrigger.style.display = 'block';
        setDancerAction('default');
        isPlaying = false;
      }

      demoTrigger.addEventListener('click', startDemo);
      restartBtn.addEventListener('click', resetDemo);

      document.querySelectorAll('.row-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var type = this.getAttribute('data-type');
          if (type === 'relax') {
            this.classList.toggle('active');
            var activeCount = document.querySelectorAll('.row-btn[data-type="relax"].active').length;
            if (activeCount === 0) {
              this.classList.add('active');
            }
          } else {
            document.querySelectorAll('.row-btn[data-type="' + type + '"]').forEach(function(otherBtn) {
              otherBtn.classList.remove('active');
            });
            this.classList.add('active');
          }
        });
      });
    })();
  </script>
</body>
