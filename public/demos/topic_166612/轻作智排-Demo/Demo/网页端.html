<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>轻作智排 LitePlanner</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== 顶部工具栏 ===== -->
<header id="top-toolbar">
  <div class="toolbar-left">
    <div class="logo">轻作智排</div>
  </div>
  <div class="toolbar-center">
    <button class="tool-btn active" data-tool="select" title="选择/移动">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 3l14 9-6 1 3 7-2 1-4-8-5 4z" fill="currentColor"/></svg>
      <span>选择</span>
    </button>
    <button class="tool-btn" id="btn-open-draw" title="绘制新零件">
      <svg viewBox="0 0 24 24" width="18" height="18"><polygon points="12,3 21,20 3,20" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span>绘制零件</span>
    </button>
    <button class="tool-btn" id="btn-import" title="导入SVG">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 21h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>导入SVG</span>
    </button>
    <input type="file" id="svg-file-input" accept=".svg" style="display:none">
  </div>
  <div class="toolbar-right">
    <button class="action-btn primary" id="btn-nest">自动排样</button>
    <button class="action-btn" id="btn-stop-nest" style="display:none">停止</button>
    <button class="action-btn" id="btn-export">导出SVG</button>
    <button class="action-btn danger" id="btn-clear">清空</button>
  </div>
</header>

<!-- ===== 主体区域 ===== -->
<div id="main-body">
  <!-- 左侧：单位 + 形状库 + 设置 -->
  <aside id="left-panel">
    <!-- 单位选择器 -->
    <div class="panel-section unit-section">
      <div class="form-row">
        <label class="unit-label-text">单位</label>
        <select id="unit-select" class="unit-selector" title="选择尺寸单位">
          <option value="mm">毫米 (mm)</option>
          <option value="cm" selected>厘米 (cm)</option>
          <option value="m">米 (m)</option>
        </select>
      </div>
    </div>

    <div class="panel-section">
      <div class="section-title parts-title-row">
        <span>零件库</span>
        <div class="parts-title-actions">
          <button class="title-mini-btn" id="btn-new-part" title="绘制新零件">+ 绘制零件</button>
          <button class="title-mini-btn" id="btn-import-2" title="导入SVG文件">+ 导入SVG</button>
        </div>
      </div>
      <div id="parts-list"></div>
    </div>
    <div class="panel-section">
      <div class="section-title">板材尺寸</div>
      <div class="form-row">
        <select id="sheet-preset">
          <option value="custom">自定义</option>
          <option value="A4-h" selected>A4 横向 (297×210)</option>
          <option value="A4-v">A4 纵向 (210×297)</option>
          <option value="A3-h">A3 横向 (420×297)</option>
          <option value="A3-v">A3 纵向 (297×420)</option>
          <option value="A2-h">A2 横向 (594×420)</option>
          <option value="A2-v">A2 纵向 (420×594)</option>
          <option value="A1-h">A1 横向 (841×594)</option>
          <option value="A1-v">A1 纵向 (594×841)</option>
          <option value="2440x1220">木板 2440×1220mm</option>
          <option value="1220x610">木板 1220×610mm</option>
          <option value="1830x915">木板 1830×915mm</option>
          <option value="1525x1525">木板 1525×1525mm</option>
          <option value="600x400">600×400mm</option>
          <option value="1200x800">1200×800mm</option>
        </select>
      </div>
      <div class="form-row">
        <label>宽</label><input type="number" id="sheet-width" value="297" min="0.01" step="0.01"><span class="unit" id="unit-label-1">mm</span>
      </div>
      <div class="form-row">
        <label>高</label><input type="number" id="sheet-height" value="210" min="0.01" step="0.01"><span class="unit" id="unit-label-2">mm</span>
      </div>
    </div>
    <div class="panel-section">
      <div class="section-title">排样设置</div>
      <div class="form-row">
        <label>间距</label><input type="number" id="nest-spacing" value="2" min="0" step="0.5"><span class="unit" id="unit-label-3">mm</span>
      </div>
      <div class="form-row">
        <label>旋转</label>
        <div class="rot-group">
          <label><input type="checkbox" id="rot-0" checked>0°</label>
          <label><input type="checkbox" id="rot-45">45°</label>
          <label><input type="checkbox" id="rot-90" checked>90°</label>
        </div>
      </div>
    </div>
    <div class="panel-section" id="props-panel" style="display:none">
      <div class="section-title">选中零件 <span id="prop-inst-label" class="prop-inst-tag"></span></div>
      <div class="form-row"><label>名称</label><input type="text" id="prop-name" placeholder="零件名"></div>
      <div class="form-row"><label>X</label><input type="number" id="prop-x" step="0.1"><span class="unit" id="unit-label-4">mm</span></div>
      <div class="form-row"><label>Y</label><input type="number" id="prop-y" step="0.1"><span class="unit" id="unit-label-5">mm</span></div>
      <div class="form-row"><label>角度</label><input type="number" id="prop-rot" step="1"><span class="unit">°</span></div>
      <div class="form-row"><label>缩放</label><input type="number" id="prop-scale" step="0.1" min="0.1" value="1.0"><span class="unit">×</span></div>
      <div class="form-row prop-quick-rot">
        <label>快速旋转</label>
        <button class="mini-btn prop-rot-btn" data-rot="0">0°</button>
        <button class="mini-btn prop-rot-btn" data-rot="45">45°</button>
        <button class="mini-btn prop-rot-btn" data-rot="90">90°</button>
        <button class="mini-btn prop-rot-btn" data-rot="180">180°</button>
      </div>
      <button class="mini-btn danger" id="btn-delete-inst">删除此零件</button>
    </div>
  </aside>

  <!-- 中间：排布画布 -->
  <main id="canvas-area">
    <!-- 纸张切换栏 -->
    <div id="page-bar">
      <button class="page-btn" id="prev-page" title="上一页">‹</button>
      <span id="page-info">第 1 页</span>
      <button class="page-btn" id="next-page" title="下一页">›</button>
      <button class="page-btn" id="add-page" title="添加空白页">+</button>
      <select id="page-layout-mode" class="page-layout-select" title="页面显示模式">
        <option value="single" selected>单页显示</option>
        <option value="horizontal">横向排列</option>
        <option value="vertical">纵向排列</option>
      </select>
    </div>
    <div id="canvas-container">
      <canvas id="dot-grid"></canvas>
      <svg id="nest-svg" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div id="status-bar">
      <span id="st-coords">X: 0.0  Y: 0.0 mm</span>
      <span id="st-zoom">缩放: 100%</span>
      <span id="st-count">零件: 0</span>
      <span id="st-util">利用率: --</span>
    </div>
  </main>
</div>

<!-- ===== 绘图弹窗 ===== -->
<div id="draw-modal" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title">绘制零件</span>
      <button class="modal-close" id="btn-close-draw">✕</button>
    </div>

    <!-- 画布尺寸设置 -->
    <div class="modal-size-bar">
      <span class="size-label">画布尺寸</span>
      <label>宽</label><input type="number" id="draw-canvas-w" value="50" min="0.01" step="0.01" class="size-input">
      <span class="size-unit" id="draw-unit-w">mm</span>
      <label>高</label><input type="number" id="draw-canvas-h" value="50" min="0.01" step="0.01" class="size-input">
      <span class="size-unit" id="draw-unit-h">mm</span>
      <button class="dtool-btn" id="btn-apply-size">应用</button>
      <div class="size-presets">
        <button class="preset-btn" data-size="10">10×10</button>
        <button class="preset-btn" data-size="20">20×20</button>
        <button class="preset-btn" data-size="50">50×50</button>
        <button class="preset-btn" data-size="100">100×100</button>
      </div>
    </div>

    <!-- 绘图工具栏 -->
    <div class="modal-toolbar">
      <button class="dtool-btn active" data-dtool="line" title="画线模式">
        <svg viewBox="0 0 24 24" width="16" height="16"><line x1="4" y1="20" x2="20" y2="4" stroke="currentColor" stroke-width="2"/><circle cx="4" cy="20" r="2" fill="currentColor"/><circle cx="20" cy="4" r="2" fill="currentColor"/></svg>
        <span>画线</span>
      </button>
      <button class="dtool-btn" data-dtool="edit" title="调整并编辑线段">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M3 18l6-6 4 4 8-8" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="12" r="2" fill="currentColor"/><circle cx="13" cy="16" r="2" fill="currentColor"/></svg>
        <span>调整</span>
      </button>
      <button class="dtool-btn" data-dtool="select" title="选择闭合区域">
        <svg viewBox="0 0 24 24" width="16" height="16"><polygon points="12,3 21,9 18,20 6,20 3,9" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <span>选区</span>
      </button>
      <div class="modal-toolbar-sep"></div>
      <button class="dtool-btn" id="btn-undo-vertex" title="撤销 (Ctrl+Z)">↶ 撤销</button>
      <button class="dtool-btn" id="btn-redo-vertex" title="重做 (Ctrl+Y)">↷ 重做</button>
      <button class="dtool-btn" id="btn-clear-draw" title="清空">清空</button>
      <div class="modal-toolbar-sep"></div>
      <div class="draw-param-inline" id="draw-param-panel">
        <label>长度</label><input type="number" id="dp-length" step="0.1" class="dp-input" placeholder="--">
        <span class="dp-unit" id="dp-unit-1">mm</span>
        <label>角度</label><input type="number" id="dp-angle" step="1" class="dp-input" placeholder="--">
        <span class="dp-unit">°</span>
        <div class="dp-sep"></div>
        <label>端点X</label><input type="number" id="dp-px" step="0.1" class="dp-input" placeholder="--">
        <span class="dp-unit" id="dp-unit-px">mm</span>
        <label>端点Y</label><input type="number" id="dp-py" step="0.1" class="dp-input" placeholder="--">
        <span class="dp-unit" id="dp-unit-py">mm</span>
        <button class="dp-btn" id="dp-apply">应用</button>
        <button class="dp-btn" id="dp-apply-pt" style="display:none">应用端点</button>
      </div>
    </div>

    <!-- 画布区域 -->
    <div class="modal-canvas-wrap">
      <canvas id="draw-dot-grid"></canvas>
      <svg id="draw-svg" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="draw-hint" id="draw-hint">点击画布放置线段起点，移动后再次点击放置终点</div>
      <div class="draw-coord-tip" id="draw-coord-tip" style="display:none"></div>
    </div>

    <!-- 底部信息 -->
    <div class="modal-footer">
      <div class="draw-info" id="draw-info">线段: 0</div>
      <div class="modal-footer-btns">
        <input type="text" id="draw-name" class="draw-name-input" placeholder="零件名称" value="">
        <button class="action-btn" id="btn-cancel-draw">取消</button>
        <button class="action-btn primary" id="btn-save-part">保存到零件库</button>
      </div>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
