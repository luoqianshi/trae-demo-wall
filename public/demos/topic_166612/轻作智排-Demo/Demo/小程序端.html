<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>轻作智排 - 小程序端原型</title>
<style>
/* ==================== CSS Variables ==================== */
:root {
  --accent: #6B9E3F;
  --accent-dark: #4A7A2A;
  --accent-light: #E8F0DC;
  --accent-gradient: linear-gradient(135deg, #6B9E3F, #4A7A2A);
  --warn: #D4A017;
  --danger: #D4584E;
  --info: #3A7BD5;
  --bg: #F2F2F2;
  --card-bg: #FFFFFF;
  --ink: #2C2C2C;
  --ink-secondary: #666;
  --muted: #999;
  --rule: #E8E8E8;
  --tag-bg: #F5F5F5;
  --phone-width: 375px;
  --nav-height: 44px;
  --tabbar-height: 56px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --shadow-card: 0 1px 4px rgba(0,0,0,0.06);
  --shadow-float: 0 4px 16px rgba(0,0,0,0.12);
}

/* ==================== Reset ==================== */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: #FAF7F0;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  color: var(--ink);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ==================== Phone Shell ==================== */
.phone-shell {
  width: var(--phone-width);
  height: 760px;
  background: #fff;
  border-radius: 40px;
  border: 8px solid #1a1a1a;
  box-shadow: 0 20px 60px rgba(0,0,0,0.25), 0 0 0 1px rgba(0,0,0,0.05);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* ==================== Status Bar ==================== */
.status-bar {
  height: 24px;
  background: var(--accent);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  flex-shrink: 0;
}
.status-bar .sb-time { font-size: 13px; }
.status-bar .sb-icons { font-size: 11px; letter-spacing: 1px; }

/* ==================== Nav Bar ==================== */
.nav-bar {
  height: var(--nav-height);
  background: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  flex-shrink: 0;
}
.nav-bar .nav-title {
  color: #fff;
  font-size: 17px;
  font-weight: 600;
}
.nav-bar .nav-back {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: #fff;
  font-size: 22px;
  cursor: pointer;
  padding: 4px 8px;
  user-select: none;
}

/* ==================== Content Area ==================== */
.content-area {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  background: var(--bg);
  -webkit-overflow-scrolling: touch;
}
.content-area::-webkit-scrollbar { width: 0; }

.page-content {
  min-height: 100%;
  padding-bottom: 10px;
}
.page-content.has-tabbar { padding-bottom: 70px; }
.page-content.has-bottombar { padding-bottom: 80px; }

/* ==================== Slide-in Animation ==================== */
@keyframes slideIn {
  from { opacity: 0; transform: translateX(30px); }
  to { opacity: 1; transform: translateX(0); }
}
.slide-in { animation: slideIn 0.25s ease-out; }

/* ==================== TabBar ==================== */
.tab-bar {
  height: var(--tabbar-height);
  background: #fff;
  border-top: 1px solid var(--rule);
  display: flex;
  flex-shrink: 0;
}
.tab-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--muted);
  font-size: 10px;
  gap: 2px;
  user-select: none;
}
.tab-item.active { color: var(--accent); }
.tab-item svg { width: 22px; height: 22px; }

/* ==================== Card ==================== */
.card {
  background: var(--card-bg);
  border-radius: var(--radius-md);
  padding: 16px;
  box-shadow: var(--shadow-card);
  margin: 12px;
}

/* ==================== Buttons ==================== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: none;
  border-radius: var(--radius-sm);
  padding: 12px 24px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s;
  user-select: none;
}
.btn:active { opacity: 0.85; }
.btn-primary {
  background: var(--accent);
  color: #fff;
}
.btn-primary:disabled {
  background: #ccc;
  color: #fff;
  cursor: not-allowed;
}
.btn-secondary {
  background: #fff;
  color: var(--accent);
  border: 1px solid var(--accent);
}
.btn-gradient {
  background: var(--accent-gradient);
  color: #fff;
}
.btn-block { display: flex; width: 100%; }
.btn-sm { padding: 8px 16px; font-size: 13px; }

/* ==================== Chip / Tag ==================== */
.chip {
  display: inline-flex;
  align-items: center;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 12px;
  background: var(--tag-bg);
  color: var(--ink);
  cursor: pointer;
  white-space: nowrap;
  user-select: none;
  transition: all 0.15s;
  border: 1px solid transparent;
}
.chip.active {
  background: var(--accent);
  color: #fff;
}
.chip-outline {
  background: transparent;
  border: 1px solid var(--rule);
  color: var(--ink-secondary);
}
.chip-outline.active {
  background: var(--accent-light);
  border-color: var(--accent);
  color: var(--accent-dark);
}

/* ==================== Tag Badge ==================== */
.tag-free {
  background: var(--accent-light);
  color: var(--accent-dark);
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
}
.tag-paid {
  background: #FFF3E0;
  color: var(--warn);
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
}
.tag-status {
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
}
.tag-status.pending { background: #FFF3E0; color: var(--warn); }
.tag-status.paid { background: var(--accent-light); color: var(--accent-dark); }
.tag-status.shipped { background: #E3F2FD; color: var(--info); }
.tag-status.done { background: #F5F5F5; color: var(--muted); }

/* ==================== Toast ==================== */
.toast {
  position: absolute;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--accent-dark);
  color: #fff;
  padding: 10px 24px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  white-space: nowrap;
  opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
  z-index: 999;
  box-shadow: var(--shadow-float);
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ==================== Bottom Action Bar ==================== */
.bottom-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: #fff;
  border-top: 1px solid var(--rule);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  z-index: 50;
}
.bottom-bar .bb-price {
  display: flex;
  flex-direction: column;
}
.bottom-bar .bb-price .label { font-size: 11px; color: var(--muted); }
.bottom-bar .bb-price .value { font-size: 20px; font-weight: 700; color: var(--danger); }
.bottom-bar .bb-price .value small { font-size: 12px; }

/* ==================== Input / Form ==================== */
.form-input, .form-textarea {
  width: 100%;
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  font-size: 14px;
  background: #FAFAFA;
  outline: none;
  transition: border-color 0.2s;
  font-family: inherit;
}
.form-input:focus, .form-textarea:focus {
  border-color: var(--accent);
  background: #fff;
}
.form-textarea { resize: none; min-height: 72px; }
.form-label {
  font-size: 13px;
  color: var(--ink-secondary);
  margin-bottom: 6px;
  display: block;
  font-weight: 500;
}
.form-group { margin-bottom: 14px; }

/* ==================== Misc Utility ==================== */
.text-muted { color: var(--muted); }
.text-secondary { color: var(--ink-secondary); }
.text-accent { color: var(--accent); }
.text-danger { color: var(--danger); }
.text-warn { color: var(--warn); }
.text-center { text-align: center; }
.text-right { text-align: right; }
.font-bold { font-weight: 700; }
.font-sm { font-size: 12px; }
.font-lg { font-size: 16px; }
.font-xl { font-size: 20px; }
.flex { display: flex; }
.flex-col { flex-direction: column; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.justify-center { justify-content: center; }
.flex-1 { flex: 1; }
.gap-4 { gap: 4px; }
.gap-8 { gap: 8px; }
.gap-12 { gap: 12px; }
.mt-4 { margin-top: 4px; }
.mt-8 { margin-top: 8px; }
.mt-12 { margin-top: 12px; }
.mb-4 { margin-bottom: 4px; }
.mb-8 { margin-bottom: 8px; }
.mb-12 { margin-bottom: 12px; }
.p-0 { padding: 0; }
.divider { height: 1px; background: var(--rule); margin: 12px 0; }
.divider-light { height: 1px; background: rgba(255,255,255,0.2); margin: 10px 0; }
.hidden { display: none !important; }

/* ==================== Home Page ==================== */
.welcome-card {
  background: var(--accent-gradient);
  border-radius: var(--radius-lg);
  padding: 24px 20px;
  margin: 12px;
  color: #fff;
  position: relative;
  overflow: hidden;
}
.welcome-card .wc-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
.welcome-card .wc-sub { font-size: 14px; opacity: 0.9; }
.cta-card {
  background: #fff;
  border-radius: var(--radius-md);
  padding: 18px;
  margin: 12px;
  box-shadow: var(--shadow-card);
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  transition: transform 0.15s;
}
.cta-card:active { transform: scale(0.98); }
.cta-card .cta-icon {
  width: 48px; height: 48px;
  background: var(--accent-light);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  flex-shrink: 0;
}
.cta-card .cta-body { flex: 1; }
.cta-card .cta-title { font-size: 15px; font-weight: 600; color: var(--ink); }
.cta-card .cta-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
.cta-card .cta-arrow { color: var(--muted); font-size: 18px; }
.section-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
  padding: 8px 16px 4px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.section-title .st-more { font-size: 12px; color: var(--muted); font-weight: 400; }

/* Horizontal scroll */
.h-scroll {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 8px 12px;
  -webkit-overflow-scrolling: touch;
}
.h-scroll::-webkit-scrollbar { display: none; }
.mat-card-mini {
  min-width: 72px;
  background: #fff;
  border-radius: var(--radius-sm);
  padding: 12px 8px;
  text-align: center;
  box-shadow: var(--shadow-card);
  flex-shrink: 0;
}
.mat-card-mini .mcm-icon { font-size: 28px; }
.mat-card-mini .mcm-name { font-size: 12px; color: var(--ink); margin-top: 4px; font-weight: 500; }
.mat-card-mini .mcm-price { font-size: 10px; color: var(--muted); margin-top: 2px; }

/* Empty state */
.empty-state {
  text-align: center;
  padding: 32px 20px;
  color: var(--muted);
}
.empty-state .es-icon { font-size: 40px; opacity: 0.4; }
.empty-state .es-text { font-size: 13px; margin-top: 8px; }

/* ==================== Upload Page ==================== */
.upload-zone {
  border: 2px dashed var(--rule);
  border-radius: var(--radius-md);
  padding: 32px 20px;
  text-align: center;
  margin: 12px;
  background: #FAFAFA;
  cursor: pointer;
  transition: border-color 0.2s;
}
.upload-zone:active { border-color: var(--accent); }
.upload-zone .uz-icon { font-size: 40px; color: var(--muted); }
.upload-zone .uz-text { font-size: 14px; color: var(--ink-secondary); margin-top: 8px; }
.upload-zone .uz-hint { font-size: 12px; color: var(--muted); margin-top: 4px; }

.bp-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 0 12px;
}
.bp-grid-item {
  background: #fff;
  border-radius: var(--radius-md);
  overflow: hidden;
  box-shadow: var(--shadow-card);
  cursor: pointer;
  transition: transform 0.15s;
}
.bp-grid-item:active { transform: scale(0.97); }
.bp-grid-item .bpg-thumb {
  width: 100%;
  height: 100px;
  background: var(--accent-light);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px;
}
.bp-grid-item .bpg-thumb svg { max-width: 100%; max-height: 100%; }
.bp-grid-item .bpg-info { padding: 8px 10px; }
.bp-grid-item .bpg-title { font-size: 13px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bp-grid-item .bpg-pages { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* ==================== Material Page ==================== */
.material-page-card {
  background: #fff;
  border-radius: var(--radius-md);
  padding: 14px;
  margin: 12px;
  box-shadow: var(--shadow-card);
}
.mat-btn-row {
  display: flex;
  gap: 8px;
  margin: 8px 0;
}
.mat-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 10px 4px;
  border-radius: var(--radius-sm);
  background: var(--tag-bg);
  cursor: pointer;
  transition: all 0.15s;
  user-select: none;
  border: 2px solid transparent;
}
.mat-btn.active {
  background: var(--accent-light);
  border-color: var(--accent);
}
.mat-btn .mb-icon { font-size: 22px; }
.mat-btn .mb-name { font-size: 11px; color: var(--ink); margin-top: 3px; }
.mat-btn.active .mb-name { color: var(--accent-dark); font-weight: 600; }

.thickness-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 8px 0;
}

.page-price-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--rule);
}
.page-price-info .ppi-label { font-size: 12px; color: var(--muted); }
.page-price-info .ppi-value { font-size: 16px; font-weight: 700; color: var(--accent-dark); }

.page-index-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  margin-right: 8px;
}

/* ==================== Address Page ==================== */
.addr-item {
  background: #fff;
  border-radius: var(--radius-md);
  padding: 14px;
  margin: 10px 12px;
  box-shadow: var(--shadow-card);
  border: 2px solid transparent;
  cursor: pointer;
  transition: border-color 0.15s;
}
.addr-item.active { border-color: var(--accent); }
.addr-item .ai-name { font-size: 15px; font-weight: 600; }
.addr-item .ai-phone { font-size: 13px; color: var(--ink-secondary); margin-left: 8px; }
.addr-item .ai-addr { font-size: 13px; color: var(--ink-secondary); margin-top: 4px; }
.addr-item .ai-default { display: inline-block; background: var(--accent-light); color: var(--accent-dark); font-size: 10px; padding: 1px 6px; border-radius: 3px; margin-left: 6px; }
.addr-item .ai-radio {
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 2px solid var(--rule);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.addr-item.active .ai-radio { border-color: var(--accent); background: var(--accent); }
.addr-item.active .ai-radio::after { content: '✓'; color: #fff; font-size: 12px; }

/* ==================== Confirm Page ==================== */
.confirm-item {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 8px 0;
  border-bottom: 1px solid var(--rule);
}
.confirm-item:last-child { border-bottom: none; }
.confirm-item .ci-label { font-size: 13px; color: var(--ink-secondary); }
.confirm-item .ci-value { font-size: 13px; color: var(--ink); text-align: right; }
.confirm-total {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 10px;
  margin-top: 4px;
  border-top: 2px solid var(--ink);
}
.confirm-total .ct-label { font-size: 14px; font-weight: 600; }
.confirm-total .ct-value { font-size: 22px; font-weight: 700; color: var(--danger); }

/* ==================== Order Success ==================== */
.success-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px 20px;
}
.success-check {
  width: 72px; height: 72px;
  border-radius: 50%;
  background: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
  color: #fff;
  box-shadow: 0 4px 20px rgba(107,158,63,0.4);
}
.success-title { font-size: 20px; font-weight: 700; color: var(--ink); margin-top: 16px; }
.success-info { font-size: 13px; color: var(--muted); margin-top: 8px; text-align: center; }

/* ==================== Community Page ==================== */
.search-bar {
  display: flex;
  align-items: center;
  background: #fff;
  border-radius: 20px;
  padding: 8px 14px;
  margin: 12px;
  box-shadow: var(--shadow-card);
  gap: 8px;
}
.search-bar .sb-icon { color: var(--muted); font-size: 16px; }
.search-bar .sb-input { flex: 1; border: none; outline: none; font-size: 13px; background: transparent; }

.filter-bar {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 12px 8px;
  -webkit-overflow-scrolling: touch;
}
.filter-bar::-webkit-scrollbar { display: none; }

.waterfall {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 0 12px;
}
.wf-card {
  background: #fff;
  border-radius: var(--radius-md);
  overflow: hidden;
  box-shadow: var(--shadow-card);
  cursor: pointer;
  transition: transform 0.15s;
}
.wf-card:active { transform: scale(0.97); }
.wf-card .wfc-thumb {
  width: 100%;
  background: var(--accent-light);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px;
}
.wf-card .wfc-thumb svg { max-width: 100%; max-height: 100%; }
.wf-card .wfc-info { padding: 8px 10px; }
.wf-card .wfc-title { font-size: 13px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wf-card .wfc-author { font-size: 11px; color: var(--muted); margin-top: 2px; }
.wf-card .wfc-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
.wf-card .wfc-likes { font-size: 11px; color: var(--muted); }

.fab {
  position: absolute;
  bottom: 70px;
  right: 16px;
  width: 48px; height: 48px;
  border-radius: 50%;
  background: var(--accent-gradient);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  box-shadow: var(--shadow-float);
  cursor: pointer;
  z-index: 40;
  user-select: none;
  transition: transform 0.15s;
}
.fab:active { transform: scale(0.92); }

/* ==================== Detail Page ==================== */
.detail-preview {
  width: 100%;
  height: 240px;
  background: var(--accent-light);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.detail-preview svg { max-width: 80%; max-height: 80%; }
.detail-preview .dp-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 36px; height: 36px;
  border-radius: 50%;
  background: rgba(255,255,255,0.8);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: var(--accent-dark);
  cursor: pointer;
  box-shadow: var(--shadow-card);
  user-select: none;
}
.detail-preview .dp-arrow.left { left: 10px; }
.detail-preview .dp-arrow.right { right: 10px; }
.detail-preview .dp-page-dots {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 4px;
}
.detail-preview .dp-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: rgba(107,158,63,0.3);
}
.detail-preview .dp-dot.active { background: var(--accent); }

.detail-thumb-row {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 8px 12px;
  -webkit-overflow-scrolling: touch;
}

/* ==================== Navigation ==================== */
function navigate(viewId, params) {
  state.viewStack.push({ view: state.currentView, params: state.currentParams });
  state.currentView = viewId;
  state.currentParams = params || {};
  render();
}

function goBack() {
  if (state.viewStack.length > 0) {
    var prev = state.viewStack.pop();
    state.currentView = prev.view;
    state.currentParams = prev.params;
    render();
  }
}

function switchTab(tabId) {
  state.viewStack = [];

}

/* ==================== Helper Functions ==================== */
function getBlueprintById(bpId) {
  for (var i = 0; i < BLUEPRINTS.length; i++) {
    if (BLUEPRINTS[i].id === bpId) return BLUEPRINTS[i];
  }
  return null;
}

function getMaterialById(matId) {
  for (var i = 0; i < MATERIALS.length; i++) {
    if (MATERIALS[i].id === matId) return MATERIALS[i];
  }
  return null;
}

function getThicknessPrice(matId, thicknessValue) {
  var mat = getMaterialById(matId);
  if (!mat) return 0;
  for (var i = 0; i < mat.thicknesses.length; i++) {
    if (mat.thicknesses[i].value === thicknessValue) return mat.thicknesses[i].price;
  }
  return 0;
}

function getThicknessLabel(matId, thicknessValue) {
  var mat = getMaterialById(matId);
  if (!mat) return '';
  for (var i = 0; i < mat.thicknesses.length; i++) {
    if (mat.thicknesses[i].value === thicknessValue) return mat.thicknesses[i].label;
  }
  return '';
}

function isOwned(bpId) {
  return USER.ownedBlueprints.indexOf(bpId) !== -1;
}

function calcPagePrice(page, materialId, thicknessValue) {
  if (!materialId || !thicknessValue) return 0;
  var areaCm2 = (page.width / 10) * (page.height / 10);
  var unitPrice = getThicknessPrice(materialId, thicknessValue);
  return Math.round(areaCm2 * unitPrice * 100) / 100;
}

function calcTotalPrice() {
  var bp = state.orderDraft.blueprint;
  if (!bp) return 0;
  var total = 0;
  for (var i = 0; i < bp.pages_detail.length; i++) {
    var pg = bp.pages_detail[i];
    var sel = state.orderDraft.pages[pg.id];
    if (sel) {
      total += calcPagePrice(pg, sel.materialId, sel.thicknessValue);
    }
  }
  return Math.round(total * 100) / 100;
}

function calcMaterialFee() {
  return calcTotalPrice();
}

function calcProcessingFee() {
  return 10;
}

function calcShippingFee() {
  return 8;
}

function calcOrderTotal() {
  return Math.round((calcMaterialFee() + calcProcessingFee() + calcShippingFee()) * 100) / 100;
}

function allPagesSelected() {
  var bp = state.orderDraft.blueprint;
  if (!bp) return false;
  for (var i = 0; i < bp.pages_detail.length; i++) {
    var pg = bp.pages_detail[i];
    var sel = state.orderDraft.pages[pg.id];
    if (!sel || !sel.materialId || !sel.thicknessValue) return false;
  }
  return true;
}

function generateOrderNo() {
  var d = new Date();
  var ts = '' + d.getFullYear() + (d.getMonth()+1) + d.getDate() + d.getHours() + d.getMinutes() + d.getSeconds();
  return 'LZZP' + ts + Math.floor(Math.random() * 1000);
}

function formatTime() {
  var d = new Date();
  var pad = function(n) { return n < 10 ? '0' + n : '' + n; };
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function acquireBlueprint(bpId) {
  var bp = getBlueprintById(bpId);
  if (!bp) return false;
  if (isOwned(bpId)) {
    showToast('您已拥有该图纸');
    return true;
  }
  if (bp.price === 0) {
    USER.ownedBlueprints.push(bpId);
    USER.pointsRecords.unshift({ amount: 0, desc: '免费获取图纸: ' + bp.title, time: formatTime() });
    showToast('免费获取成功');
    return true;
  }
  if (USER.points < bp.price) {
    showToast('积分不足，无法兑换');
    return false;
  }
  USER.points -= bp.price;
  USER.ownedBlueprints.push(bpId);
  USER.pointsRecords.unshift({ amount: -bp.price, desc: '兑换图纸: ' + bp.title, time: formatTime() });
  showToast('兑换成功！消耗' + bp.price + '积分');
  return true;
}

/* ==================== Event Delegation ==================== */
function initEventListeners() {
  document.getElementById('page-content').addEventListener('click', function(e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.dataset.action;
    switch (action) {
      case 'navigate': {
        var view = el.dataset.view;
        var params = {};
        if (el.dataset.bpid) params.bpid = el.dataset.bpid;
        if (el.dataset.clearTab) { state.activeTab = el.dataset.clearTab; }
        if (view === 'detail') { state.detailPageIndex = 0; }
        navigate(view, params);
        break;
      }
      case 'goBack':
        goBack();
        break;
      case 'switchTab':
        switchTab(el.dataset.tab);
        break;
      case 'toast':
        showToast(el.dataset.msg || '提示');
        break;
      case 'selectBlueprint': {
        var bpId = el.dataset.bpid;
        var bp = getBlueprintById(bpId);
        if (bp) {
          state.orderDraft.blueprint = bp;
          state.orderDraft.pages = {};
          // Auto-select first material and thickness for each page
          for (var i = 0; i < bp.pages_detail.length; i++) {
            var pg = bp.pages_detail[i];
            state.orderDraft.pages[pg.id] = { materialId: null, thicknessValue: null };
          }
          navigate('material');
        }
        break;
      }
      case 'selectMaterial': {
        var pageId = el.dataset.pageid;
        var matId = el.dataset.matid;
        if (!state.orderDraft.pages[pageId]) {
          state.orderDraft.pages[pageId] = { materialId: null, thicknessValue: null };
        }
        var cur = state.orderDraft.pages[pageId];
        if (cur.materialId !== matId) {
          cur.materialId = matId;
          cur.thicknessValue = null; // Reset thickness when material changes
        }
        render();
        break;
      }
      case 'selectThickness': {
        var pageId2 = el.dataset.pageid;
        var thVal = el.dataset.thickness;
        if (state.orderDraft.pages[pageId2]) {
          state.orderDraft.pages[pageId2].thicknessValue = thVal;
        }
        render();
        break;
      }
      case 'goAddress':
        if (allPagesSelected()) navigate('address');
        break;
      case 'selectAddress':
        state.selectedAddressId = el.dataset.addrid;
        render();
        break;
      case 'saveNewAddress': {
        var name = document.getElementById('new-addr-name').value.trim();
        var phone = document.getElementById('new-addr-phone').value.trim();
        var detail = document.getElementById('new-addr-detail').value.trim();
        if (!name || !phone || !detail) {
          showToast('请填写完整地址信息');
          return;
        }
        var newId = 'a' + (USER.addresses.length + 1);
        var newAddr = { id: newId, name: name, phone: phone, address: detail, isDefault: false };
        USER.addresses.push(newAddr);
        state.selectedAddressId = newId;
        showToast('地址已保存');
        render();
        break;
      }
      case 'goConfirm':
        if (state.selectedAddressId) navigate('confirm');
        break;
      case 'submitOrder': {
        var bp2 = state.orderDraft.blueprint;
        var orderNo = generateOrderNo();
        var pagesDetail = [];
        for (var j = 0; j < bp2.pages_detail.length; j++) {
          var pg2 = bp2.pages_detail[j];
          var sel = state.orderDraft.pages[pg2.id];
          pagesDetail.push({ pageId: pg2.id, materialId: sel.materialId, thicknessValue: sel.thicknessValue });
        }
        var order = {
          orderNo: orderNo,
          bpId: bp2.id,
          status: 'pending',
          pagesDetail: pagesDetail,
          amount: calcOrderTotal(),
          time: formatTime()
        };
        USER.myOrders.unshift(order);
        state.orderDraft = { blueprint: null, pages: {} };
        navigate('order-success', { orderNo: orderNo });
        break;
      }
      case 'setFilter':
        state.communityFilter = el.dataset.filter;
        render();
        break;
      case 'detailPrevPage': {
        if (state.detailPageIndex > 0) {
          state.detailPageIndex--;
          render();
        }
        break;
      }
      case 'detailNextPage': {
        var bp3 = getBlueprintById(state.currentParams.bpid);
        if (bp3 && state.detailPageIndex < bp3.pages_detail.length - 1) {
          state.detailPageIndex++;
          render();
        }
        break;
      }
      case 'detailSelectPage':
        state.detailPageIndex = parseInt(el.dataset.index, 10);
        render();
        break;
      case 'acquireBP': {
        var bpId3 = el.dataset.bpid;
        var success = acquireBlueprint(bpId3);
        if (success) render();
        break;
      }
      case 'startOrder': {
        var bpId4 = el.dataset.bpid;
        var bp4 = getBlueprintById(bpId4);
        if (bp4) {
          state.orderDraft.blueprint = bp4;
          state.orderDraft.pages = {};
          for (var k = 0; k < bp4.pages_detail.length; k++) {
            state.orderDraft.pages[bp4.pages_detail[k].id] = { materialId: null, thicknessValue: null };
          }
          navigate('material');
        }
        break;
      }
      case 'selectShareBP':
        state.shareSelectedBp = el.dataset.bpid;
        render();
        break;
      case 'setShareCategory':
        state.shareCategory = el.dataset.cat;
        render();
        break;
      case 'setSharePrice':
        state.sharePrice = parseInt(el.dataset.price, 10);
        render();
        break;
      case 'publishShare': {
        if (!state.shareSelectedBp) {
          showToast('请先选择要分享的图纸');
          return;
        }
        var title = document.getElementById('share-title').value.trim();
        if (!title) {
          showToast('请填写分享标题');
          return;
        }
        var desc = document.getElementById('share-desc').value.trim();
        var bp5 = getBlueprintById(state.shareSelectedBp);
        if (bp5) {
          // Update blueprint info
          bp5.title = title;
          if (desc) bp5.desc = desc;
          bp5.category = state.shareCategory;
          bp5.price = state.sharePrice;
          bp5.likes = 0;
          bp5.downloads = 0;
          // Add to myShares if not already there
          if (USER.myShares.indexOf(bp5.id) === -1) {
            USER.myShares.push(bp5.id);
          }
          showToast('发布成功！图纸已分享到社区');
          goBack();
        }
        break;
      }
      default:
        break;
    }
  });

  document.getElementById('tab-bar').addEventListener('click', function(e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.dataset.action;
    switch (action) {
      case 'switchTab':
        switchTab(el.dataset.tab);
        break;
      default:
        break;
    }
  });
}

/* ==================== Init ==================== */
function init() {
  initEventListeners();
  render();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

// Expose for debugging
window.__app = { state: state, navigate: navigate, goBack: goBack, switchTab: switchTab, render: render };

})();
</script>
