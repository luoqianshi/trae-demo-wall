</head>
<body>
<a class="sr-only sr-only-focusable" href="#mainContent">跳转到主要内容</a>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">BD</div>
      <div>
        <h1>达人协作管家</h1>
        <p>企业内部商务对接提效系统</p>
      </div>
    </div>
    <nav class="nav" aria-label="主导航">
      <a href="index.html" id="nav-overview"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span>流程总览</a>
      <a href="tasks.html" id="nav-tasks"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 14l2 2 4-4"/></svg></span>任务管理</a>
      <a href="creators.html" id="nav-creators"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>达人库</a>
      <a href="recommendations.html" id="nav-recommendations"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></span>达人推荐</a>
      <a href="collabs.html" id="nav-collabs"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></span>对接单管理</a>
      <a href="kanban.html" id="nav-kanban"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="3" width="5" height="18" rx="1"/><rect x="10" y="3" width="5" height="18" rx="1"/><rect x="17" y="3" width="5" height="18" rx="1"/></svg></span>进度流转看板</a>
      <a href="alerts.html" id="nav-alerts"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span>逾期与异常</a>
      <a href="stats.html" id="nav-stats"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span>商务效率统计</a>
      <a href="demo.html" id="nav-demo"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></span>Demo 说明</a>
    </nav>
  </aside>

  <main class="main" id="mainContent">
    <div class="role-switcher" id="roleSwitcher"></div>
    <div class="page-header">
      <h2>达人推荐</h2>
      <p>商务从达人库推荐达人到达人任务，商家同意后自动生成合作对接单。</p>
    </div>

    <div class="content">
      <section class="section">
        <div class="card">
          <div class="list-header">
            <div class="toolbar" style="margin-bottom:0;flex:1">
              <input class="input" id="q" type="search" placeholder="搜索达人、任务、商务" aria-label="搜索推荐记录" autocomplete="off" />
              <select class="select" id="statusFilter" style="width:150px" aria-label="推荐状态筛选"><option value="">全部状态</option><option>待商家确认</option><option>商家已同意</option><option>商家已拒绝</option></select>
            </div>
          </div>
          <div class="table-wrap">
            <table class="wide-table">
              <thead>
                <tr>
                  <th>达人信息</th>
                  <th>类目</th>
                  <th>等级</th>
                  <th>推荐商务</th>
                  <th>关联任务</th>
                  <th>来源</th>
                  <th>状态</th>
                  <th>报价</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="recommendationList"></tbody>
            </table>
          </div>
        </div>
      </section>
    </div>
  </main>
</div>

<div class="drawer-overlay" id="drawerOverlay"></div>
<div class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
  <div class="drawer-head">
    <div><h3 id="drawerTitle">详情</h3><p id="drawerSub"></p></div>
    <button class="close" type="button" aria-label="关闭详情抽屉">×</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-actions" id="drawerActions"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite">已更新</div>

<script src="js/app.js"></script>
</body>
</html>
