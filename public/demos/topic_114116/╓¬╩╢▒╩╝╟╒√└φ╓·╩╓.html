<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识笔记整理助手 - 交互体验</title>
    <style>
        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --primary-light: #a78bfa;
            --primary-gradient: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            --primary-gradient-alt: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
            
            --text-primary: #2d3436;
            --text-secondary: #666666;
            --text-tertiary: #aaaaaa;
            
            --bg-page: #f8f9fa;
            --bg-card: #ffffff;
            --bg-chip: #f3e5f5;
            --bg-chip-active: #ede7f6;
            
            --border-color: #ede7f6;
            --border-input: #d1c4e9;
            
            --shadow-card: 0 3px 12px rgba(102, 126, 234, 0.08);
            --shadow-phone: 0 20px 60px rgba(80, 40, 120, 0.28);
            
            --danger: #e74c3c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--primary-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 24px 12px;
            color: var(--text-primary);
        }

        .phone {
            width: 100%;
            max-width: 390px;
            background: var(--bg-card);
            border-radius: 36px;
            box-shadow: var(--shadow-phone);
            overflow: hidden;
            min-height: 720px;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            background: var(--primary-gradient);
            color: #fff;
            padding: 34px 20px 18px;
            text-align: center;
        }
        .topbar h1 { font-size: 1.4rem; font-weight: 700; }
        .topbar p { font-size: 0.78rem; opacity: 0.92; margin-top: 4px; }

        .tabbar {
            display: flex;
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
            padding: 8px 0 14px;
        }
        .tab {
            flex: 1; text-align: center;
            font-size: 0.72rem; color: var(--text-tertiary);
            cursor: pointer; user-select: none;
        }
        .tab .tab-icon { font-size: 1.4rem; display: block; margin-bottom: 3px; }
        .tab.active { color: var(--primary); font-weight: 700; }

        .screen {
            flex: 1; overflow-y: auto;
            padding: 0; background: var(--bg-page);
        }

        .search-bar {
            padding: 12px 16px;
            background: var(--bg-card);
            display: flex; gap: 8px;
            border-bottom: 1px solid var(--border-color);
        }
        .search-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border-input);
            border-radius: 20px;
            font-size: 0.85rem;
            outline: none;
        }
        .search-input:focus { border-color: var(--primary); }
        .add-btn {
            width: 42px; height: 42px;
            border: none; border-radius: 50%;
            background: var(--primary-gradient);
            color: #fff; font-size: 1.4rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        .tag-filter {
            display: flex; gap: 8px;
            padding: 10px 16px;
            background: var(--bg-card);
            overflow-x: auto;
            border-bottom: 1px solid var(--border-color);
        }
        .tag-filter::-webkit-scrollbar { display: none; }
        .tchip {
            flex-shrink: 0;
            padding: 6px 14px;
            border-radius: 16px;
            background: var(--bg-chip);
            font-size: 0.75rem;
            color: var(--primary-dark);
            cursor: pointer;
        }
        .tchip.active { background: var(--primary); color: #fff; }

        .note-list { padding: 12px 16px; }
        .note-card {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 10px;
            box-shadow: var(--shadow-card);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .note-card:active { transform: scale(0.98); }
        .nc-head {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 6px;
        }
        .nc-title { font-size: 0.95rem; font-weight: 700; color: var(--text-primary); flex: 1; }
        .nc-del {
            font-size: 0.9rem; color: var(--text-tertiary);
            cursor: pointer; padding: 0 4px;
        }
        .nc-del:hover { color: var(--danger); }
        .nc-content {
            font-size: 0.8rem; color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .nc-foot {
            display: flex; justify-content: space-between; align-items: center;
        }
        .nc-tags { display: flex; gap: 5px; flex-wrap: wrap; }
        .nc-tag {
            font-size: 0.62rem; padding: 2px 8px;
            border-radius: 8px; background: var(--bg-chip-active); color: var(--primary-dark);
        }
        .nc-date { font-size: 0.65rem; color: var(--text-tertiary); }

        .stats-overview {
            display: flex; gap: 10px;
            padding: 16px;
        }
        .stat-card {
            flex: 1; background: var(--bg-card);
            border-radius: 14px; padding: 16px 8px;
            text-align: center;
            box-shadow: var(--shadow-card);
        }
        .stat-num { font-size: 1.6rem; font-weight: 800; color: var(--primary); }
        .stat-lbl { font-size: 0.7rem; color: var(--text-secondary); margin-top: 2px; }

        .section-title {
            font-size: 0.9rem; color: var(--primary-dark); font-weight: 700;
            margin: 14px 16px 8px;
            border-left: 4px solid var(--primary); padding-left: 10px;
        }

        .knowledge-cards { padding: 0 16px 16px; }
        .kc-card {
            background: var(--primary-gradient);
            color: #fff;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 12px;
            position: relative;
        }
        .kc-card:nth-child(even) {
            background: var(--primary-gradient-alt);
        }
        .kc-q { font-size: 0.95rem; font-weight: 700; margin-bottom: 8px; padding-right: 60px; }
        .kc-a { font-size: 0.8rem; line-height: 1.7; opacity: 0.95; }
        .kc-tag {
            position: absolute; top: 14px; right: 14px;
            font-size: 0.6rem; padding: 2px 8px;
            background: rgba(255,255,255,0.25);
            border-radius: 8px;
        }

        .modal-mask {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center; align-items: flex-end;
            z-index: 100;
        }
        .modal-mask.show { display: flex; }
        .modal {
            width: 100%; max-width: 390px;
            background: var(--bg-card);
            border-radius: 24px 24px 0 0;
            max-height: 88vh; overflow-y: auto;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-header {
            padding: 18px 20px;
            background: var(--primary-gradient);
            color: #fff;
            position: sticky; top: 0;
            display: flex; justify-content: space-between; align-items: center;
        }
        .modal-header h2 { font-size: 1.1rem; }
        .modal-header .close { font-size: 1.4rem; cursor: pointer; opacity: 0.85; }
        .modal-body { padding: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-label { font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 6px; display: block; }
        .form-input, .form-textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-input);
            border-radius: 12px;
            font-size: 0.88rem;
            outline: none;
            font-family: inherit;
        }
        .form-input:focus, .form-textarea:focus { border-color: var(--primary); }
        .form-textarea { min-height: 120px; resize: vertical; line-height: 1.6; }
        .tag-suggestions {
            display: flex; flex-wrap: wrap; gap: 6px;
            margin-top: 8px;
        }
        .tag-suggest {
            font-size: 0.7rem; padding: 4px 10px;
            border-radius: 12px; background: var(--bg-chip);
            color: var(--primary-dark); cursor: pointer;
        }
        .save-btn {
            width: 100%; padding: 14px;
            background: var(--primary-gradient);
            color: #fff; border: none; border-radius: 14px;
            font-size: 1rem; font-weight: 700;
            cursor: pointer; margin-top: 8px;
        }
        .save-btn:active { transform: scale(0.97); }

        .empty-tip { text-align: center; padding: 50px 20px; color: var(--text-tertiary); font-size: 0.85rem; }
        .empty-tip .e-icon { font-size: 3rem; margin-bottom: 8px; }

        .tag-cloud { padding: 0 16px 16px; }
        .tag-cloud-item {
            display: inline-block;
            margin: 4px;
            padding: 6px 14px;
            background: var(--bg-card);
            border-radius: 16px;
            font-size: 0.78rem;
            color: var(--primary-dark);
            box-shadow: var(--shadow-card);
        }
        .tag-cloud-item .tc-count { color: var(--text-tertiary); font-size: 0.68rem; margin-left: 4px; }

        .theme-grid {
            display: grid; grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }
        .theme-item {
            display: flex; flex-direction: column; align-items: center;
            padding: 10px 4px;
            border-radius: 12px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }
        .theme-item:hover { transform: scale(1.05); }
        .theme-item.active { background: var(--bg-chip); }
        .theme-preview {
            width: 40px; height: 40px;
            border-radius: 10px;
            margin-bottom: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }
        .theme-name {
            font-size: 0.62rem; color: var(--text-secondary);
            text-align: center;
        }
        .theme-check {
            position: absolute; top: 4px; right: 4px;
            width: 16px; height: 16px;
            background: var(--primary);
            color: #fff;
            border-radius: 50%;
            font-size: 0.55rem;
            display: flex; align-items: center; justify-content: center;
        }

        .action-card {
            display: flex; align-items: center; gap: 12px;
            background: var(--bg-card);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 10px;
            box-shadow: var(--shadow-card);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .action-card:active { transform: scale(0.98); }
        .action-icon { font-size: 1.5rem; }
        .action-info { flex: 1; }
        .action-title { font-size: 0.88rem; font-weight: 700; color: var(--text-primary); }
        .action-desc { font-size: 0.7rem; color: var(--text-tertiary); margin-top: 2px; }
        .action-arrow { font-size: 1.2rem; color: var(--text-tertiary); }

        .about-card {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 20px;
            box-shadow: var(--shadow-card);
            text-align: center;
        }
        .about-title { font-size: 0.95rem; font-weight: 700; color: var(--text-primary); }
        .about-version { font-size: 0.7rem; color: var(--text-tertiary); margin-top: 4px; }
        .about-desc { font-size: 0.75rem; color: var(--text-secondary); margin-top: 8px; }
    </style>
</head>
<body>
    <div class="phone">
        <div class="topbar">
            <h1>📚 知识笔记整理助手</h1>
            <p>让知识管理像整理书架一样简单</p>
        </div>

        <div class="screen" id="screen"></div>

        <div class="tabbar">
            <div class="tab active" data-tab="notes" onclick="switchTab('notes')">
                <span class="tab-icon">📝</span>笔记
            </div>
            <div class="tab" data-tab="cards" onclick="switchTab('cards')">
                <span class="tab-icon">🎴</span>卡片
            </div>
            <div class="tab" data-tab="stats" onclick="switchTab('stats')">
                <span class="tab-icon">📊</span>统计
            </div>
            <div class="tab" data-tab="profile" onclick="switchTab('profile')">
                <span class="tab-icon">👤</span>我的
            </div>
        </div>
    </div>

    <!-- 编辑弹层 -->
    <div class="modal-mask" id="modalMask" onclick="closeModal(event)">
        <div class="modal" id="modalContent"></div>
    </div>

    <script>
        /* ==================== 主题调色板 ==================== */
        const THEMES = {
            'purple': {
                name: '优雅紫',
                '--primary': '#667eea',
                '--primary-dark': '#764ba2',
                '--primary-light': '#a78bfa',
                '--text-primary': '#2d3436',
                '--text-secondary': '#666666',
                '--text-tertiary': '#aaaaaa',
                '--bg-page': '#f8f9fa',
                '--bg-card': '#ffffff',
                '--bg-chip': '#f3e5f5',
                '--bg-chip-active': '#ede7f6',
                '--border-color': '#ede7f6',
                '--border-input': '#d1c4e9',
                '--shadow-card': '0 3px 12px rgba(102, 126, 234, 0.08)',
                '--shadow-phone': '0 20px 60px rgba(80, 40, 120, 0.28)'
            },
            'ocean': {
                name: '海洋蓝',
                '--primary': '#4facfe',
                '--primary-dark': '#00f2fe',
                '--primary-light': '#7dd3fc',
                '--text-primary': '#1e293b',
                '--text-secondary': '#64748b',
                '--text-tertiary': '#94a3b8',
                '--bg-page': '#f1f5f9',
                '--bg-card': '#ffffff',
                '--bg-chip': '#e0f2fe',
                '--bg-chip-active': '#bae6fd',
                '--border-color': '#e2e8f0',
                '--border-input': '#93c5fd',
                '--shadow-card': '0 3px 12px rgba(79, 172, 254, 0.08)',
                '--shadow-phone': '0 20px 60px rgba(0, 60, 120, 0.28)'
            },
            'forest': {
                name: '森林绿',
                '--primary': '#11998e',
                '--primary-dark': '#38ef7d',
                '--primary-light': '#4fd1c5',
                '--text-primary': '#1f2937',
                '--text-secondary': '#4b5563',
                '--text-tertiary': '#9ca3af',
                '--bg-page': '#f0fdf4',
                '--bg-card': '#ffffff',
                '--bg-chip': '#dcfce7',
                '--bg-chip-active': '#bbf7d0',
                '--border-color': '#d1fae5',
                '--border-input': '#86efac',
                '--shadow-card': '0 3px 12px rgba(17, 153, 142, 0.08)',
                '--shadow-phone': '0 20px 60px rgba(20, 100, 80, 0.28)'
            },
            'sunset': {
                name: '日落橙',
                '--primary': '#fa709a',
                '--primary-dark': '#fee140',
                '--primary-light': '#fb923c',
                '--text-primary': '#451a03',
                '--text-secondary': '#78350f',
                '--text-tertiary': '#b45309',
                '--bg-page': '#fff7ed',
                '--bg-card': '#ffffff',
                '--bg-chip': '#ffedd5',
                '--bg-chip-active': '#fed7aa',
                '--border-color': '#ffedd5',
                '--border-input': '#fdba74',
                '--shadow-card': '0 3px 12px rgba(250, 112, 154, 0.08)',
                '--shadow-phone': '0 20px 60px rgba(180, 60, 80, 0.28)'
            },
            'dark': {
                name: '暗黑模式',
                '--primary': '#8b5cf6',
                '--primary-dark': '#6d28d9',
                '--primary-light': '#a78bfa',
                '--text-primary': '#f1f5f9',
                '--text-secondary': '#cbd5e1',
                '--text-tertiary': '#64748b',
                '--bg-page': '#0f172a',
                '--bg-card': '#1e293b',
                '--bg-chip': '#312e81',
                '--bg-chip-active': '#4c1d95',
                '--border-color': '#334155',
                '--border-input': '#475569',
                '--shadow-card': '0 3px 12px rgba(139, 92, 246, 0.15)',
                '--shadow-phone': '0 20px 60px rgba(0, 0, 0, 0.6)'
            }
        };

        /* ==================== 主题切换 ==================== */
        const THEME_KEY = 'note_organizer_theme';
        function loadTheme() {
            try {
                const saved = localStorage.getItem(THEME_KEY);
                if (saved && THEMES[saved]) return saved;
            } catch(e) {}
            return 'purple';
        }
        function saveTheme(key) {
            localStorage.setItem(THEME_KEY, key);
        }
        function applyTheme(key) {
            const theme = THEMES[key];
            if (!theme) return;
            Object.keys(theme).forEach(k => {
                if (k.startsWith('--')) {
                    document.documentElement.style.setProperty(k, theme[k]);
                }
            });
            saveTheme(key);
        }

        /* ==================== 预置标签建议 ==================== */
        const TAG_SUGGESTIONS = ['学习方法','工作技巧','读书笔记','思维模型','技术笔记','生活感悟','英语','考研'];

        /* ==================== 状态管理 ==================== */
        const STORE_KEY = 'note_organizer_state';
        function loadState() {
            try {
                const raw = localStorage.getItem(STORE_KEY);
                if (raw) return JSON.parse(raw);
            } catch(e) {}
            // 初始预置示例笔记，让用户打开即有内容可体验
            return {
                notes: [
                    { id:'n1', title:'番茄工作法核心要点', content:'番茄工作法将工作切分为25分钟专注+5分钟休息的循环。核心在于：1.一次只做一件事；2.记录被打断的次数；3.每日复盘完成番茄钟数量。长期坚持可显著提升专注力与时间感知能力。', tags:['学习方法','工作技巧'], date: Date.now()-86400000*2 },
                    { id:'n2', title:'费曼学习法四步骤', content:'费曼学习法：1.选择要学习的概念；2.假装把它教给一个完全不懂的人；3.遇到讲不清的地方回到资料重新学习；4.简化语言用类比表达。本质是通过"输出"倒逼"输入"。', tags:['学习方法','思维模型'], date: Date.now()-86400000 },
                    { id:'n3', title:'《深度工作》读书摘录', content:'深度工作是指在无干扰状态下专注进行职业活动，使个人认知能力达到极限。关键策略：1.仪式化工作习惯；2.拥抱无聊训练专注；3.远离社交媒体；4.减少浅层工作。', tags:['读书笔记','工作技巧'], date: Date.now()-3600000*3 }
                ]
            };
        }
        function saveState() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

        let state = loadState();
        let currentTab = 'notes';
        let searchKw = '';
        let activeTag = '全部';
        let editingId = null;

        /* ==================== 标签切换 ==================== */
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => {
                t.classList.toggle('active', t.dataset.tab === tab);
            });
            render();
        }

        /* ==================== 主渲染 ==================== */
        function render() {
            const screen = document.getElementById('screen');
            if (currentTab === 'notes') renderNotes(screen);
            else if (currentTab === 'cards') renderCards(screen);
            else if (currentTab === 'stats') renderStats(screen);
            else renderProfile(screen);
        }

        /* ==================== 获取全部标签 ==================== */
        function getAllTags() {
            const set = new Set();
            state.notes.forEach(n => n.tags.forEach(t => set.add(t)));
            return [...set];
        }

        /* ==================== 渲染笔记列表 ==================== */
        function renderNotes(screen) {
            let html = `<div class="search-bar">
                <input class="search-input" placeholder="搜索标题或内容..." value="${searchKw}" oninput="doSearch(this.value)"/>
                <button class="add-btn" onclick="openEditor()">+</button>
            </div>`;

            const tags = ['全部', ...getAllTags()];
            html += '<div class="tag-filter">';
            tags.forEach(t => {
                html += `<div class="tchip ${activeTag===t?'active':''}" onclick="setTag('${t}')">${t}</div>`;
            });
            html += '</div>';

            const list = filterNotes();
            html += '<div class="note-list">';
            if (list.length === 0) {
                html += `<div class="empty-tip"><div class="e-icon">📝</div><p>暂无笔记<br>点击右上角 + 创建第一条</p></div>`;
            } else {
                list.forEach(n => {
                    const d = new Date(n.date);
                    const dateStr = `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${d.getMinutes().toString().padStart(2,'0')}`;
                    html += `<div class="note-card" onclick="openEditor('${n.id}')">
                        <div class="nc-head">
                            <span class="nc-title">${escapeHtml(n.title)}</span>
                            <span class="nc-del" onclick="delNote(event,'${n.id}')">🗑</span>
                        </div>
                        <div class="nc-content">${escapeHtml(n.content)}</div>
                        <div class="nc-foot">
                            <div class="nc-tags">${n.tags.map(t=>`<span class="nc-tag">${t}</span>`).join('')}</div>
                            <span class="nc-date">${dateStr}</span>
                        </div>
                    </div>`;
                });
            }
            html += '</div>';
            screen.innerHTML = html;
        }

        /* ==================== 搜索与筛选 ==================== */
        function doSearch(v) { searchKw = v; render(); }
        function setTag(t) { activeTag = t; render(); }

        function filterNotes() {
            const kw = searchKw.trim().toLowerCase();
            return state.notes.filter(n => {
                if (activeTag !== '全部' && !n.tags.includes(activeTag)) return false;
                if (kw && !n.title.toLowerCase().includes(kw) && !n.content.toLowerCase().includes(kw)) return false;
                return true;
            }).sort((a,b) => b.date - a.date);
        }

        /* ==================== 删除笔记 ==================== */
        function delNote(e, id) {
            e.stopPropagation();
            state.notes = state.notes.filter(n => n.id !== id);
            saveState();
            render();
        }

        /* ==================== 编辑器弹层 ==================== */
        function openEditor(id) {
            editingId = id || null;
            const n = id ? state.notes.find(x => x.id === id) : { title:'', content:'', tags:[] };
            let html = `
                <div class="modal-header">
                    <h2>${id?'编辑笔记':'新建笔记'}</h2>
                    <span class="close" onclick="closeModal()">×</span>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label class="form-label">标题</label>
                        <input class="form-input" id="editTitle" value="${escapeAttr(n.title)}" placeholder="输入笔记标题"/>
                    </div>
                    <div class="form-group">
                        <label class="form-label">内容</label>
                        <textarea class="form-textarea" id="editContent" placeholder="记录你的知识...">${escapeHtml(n.content)}</textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">标签（逗号分隔）</label>
                        <input class="form-input" id="editTags" value="${n.tags.join(', ')}" placeholder="如：学习方法, 读书笔记"/>
                        <div class="tag-suggestions">
                            ${TAG_SUGGESTIONS.map(t=>`<span class="tag-suggest" onclick="addTag('${t}')">+ ${t}</span>`).join('')}
                        </div>
                    </div>
                    <button class="save-btn" onclick="saveNote()">💾 保存笔记</button>
                </div>`;
            document.getElementById('modalContent').innerHTML = html;
            document.getElementById('modalMask').classList.add('show');
        }

        function addTag(t) {
            const input = document.getElementById('editTags');
            const cur = input.value.trim();
            input.value = cur ? `${cur}, ${t}` : t;
        }

        function saveNote() {
            const title = document.getElementById('editTitle').value.trim();
            const content = document.getElementById('editContent').value.trim();
            const tags = document.getElementById('editTags').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean);
            if (!title) { alert('请输入标题'); return; }
            if (editingId) {
                const n = state.notes.find(x => x.id === editingId);
                n.title = title; n.content = content; n.tags = tags; n.date = Date.now();
            } else {
                state.notes.push({ id:'n'+Date.now(), title, content, tags, date: Date.now() });
            }
            saveState();
            closeModal();
            render();
        }

        function closeModal(e) {
            if (e && e.target.id !== 'modalMask') return;
            document.getElementById('modalMask').classList.remove('show');
        }

        /* ==================== 知识卡片页 ==================== */
        function renderCards(screen) {
            // 将笔记转为问答卡片（取首句为问题，全文为答案）
            let html = `<div class="section-title">🎴 知识卡片（基于笔记自动生成）</div>`;
            const cards = state.notes.filter(n => n.content.length > 0);
            if (cards.length === 0) {
                html += `<div class="empty-tip"><div class="e-icon">🎴</div><p>创建笔记后将自动生成知识卡片<br>方便复习与分享</p></div>`;
            } else {
                html += '<div class="knowledge-cards">';
                cards.forEach(n => {
                    const firstLine = n.content.split(/[。；;\n]/)[0];
                    html += `<div class="kc-card">
                        <span class="kc-tag">${n.tags[0]||'知识'}</span>
                        <div class="kc-q">❓ ${escapeHtml(firstLine)}？</div>
                        <div class="kc-a">${escapeHtml(n.content)}</div>
                    </div>`;
                });
                html += '</div>';
            }
            screen.innerHTML = html;
        }

        /* ==================== 统计页 ==================== */
        function renderStats(screen) {
            const total = state.notes.length;
            const tagCount = getAllTags().length;
            const todayCount = state.notes.filter(n => {
                const d = new Date(n.date);
                const now = new Date();
                return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate();
            }).length;

            let html = `<div class="stats-overview">
                <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-lbl">笔记总数</div></div>
                <div class="stat-card"><div class="stat-num">${tagCount}</div><div class="stat-lbl">标签数</div></div>
                <div class="stat-card"><div class="stat-num">${todayCount}</div><div class="stat-lbl">今日新增</div></div>
            </div>`;

            // 标签云（按使用频次）
            html += `<div class="section-title">🏷️ 标签云</div>`;
            const tagFreq = {};
            state.notes.forEach(n => n.tags.forEach(t => tagFreq[t] = (tagFreq[t]||0)+1));
            const sortedTags = Object.entries(tagFreq).sort((a,b)=>b[1]-a[1]);
            html += '<div class="tag-cloud">';
            if (sortedTags.length === 0) {
                html += '<div class="empty-tip" style="padding:20px;">暂无标签</div>';
            } else {
                sortedTags.forEach(([t,c]) => {
                    html += `<span class="tag-cloud-item">${t}<span class="tc-count">${c}</span></span>`;
                });
            }
            html += '</div>';

            // 最近活跃
            html += `<div class="section-title">📅 最近笔记</div>`;
            html += '<div class="note-list">';
            state.notes.slice().sort((a,b)=>b.date-a.date).slice(0,3).forEach(n => {
                const d = new Date(n.date);
                const dateStr = `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${d.getMinutes().toString().padStart(2,'0')}`;
                html += `<div class="note-card" onclick="switchTab('notes')">
                    <div class="nc-head"><span class="nc-title">${escapeHtml(n.title)}</span></div>
                    <div class="nc-content">${escapeHtml(n.content)}</div>
                    <div class="nc-foot">
                        <div class="nc-tags">${n.tags.map(t=>`<span class="nc-tag">${t}</span>`).join('')}</div>
                        <span class="nc-date">${dateStr}</span>
                    </div>
                </div>`;
            });
            html += '</div>';
            screen.innerHTML = html;
        }

        /* ==================== 我的页面 ==================== */
        function renderProfile(screen) {
            const currentTheme = loadTheme();
            let html = `<div class="stats-overview">
                <div class="stat-card"><div class="stat-num">${state.notes.length}</div><div class="stat-lbl">笔记总数</div></div>
                <div class="stat-card"><div class="stat-num">${getAllTags().length}</div><div class="stat-lbl">标签数</div></div>
            </div>`;

            html += `<div class="section-title">🎨 主题颜色</div>`;
            html += `<div class="note-list"><div class="theme-grid">`;
            Object.entries(THEMES).forEach(([key, theme]) => {
                const isActive = key === currentTheme;
                html += `<div class="theme-item ${isActive?'active':''}" onclick="applyTheme('${key}');render()">
                    <div class="theme-preview" style="background: linear-gradient(135deg, ${theme['--primary']} 0%, ${theme['--primary-dark']} 100%);"></div>
                    <div class="theme-name">${theme.name}</div>
                    ${isActive?'<div class="theme-check">✓</div>':''}
                </div>`;
            });
            html += `</div></div>`;

            html += `<div class="section-title">⚙️ 数据管理</div>`;
            html += `<div class="note-list">
                <div class="action-card" onclick="exportData()">
                    <div class="action-icon">📤</div>
                    <div class="action-info">
                        <div class="action-title">导出数据</div>
                        <div class="action-desc">将笔记导出为 JSON 文件</div>
                    </div>
                    <div class="action-arrow">›</div>
                </div>
                <div class="action-card" onclick="clearData()">
                    <div class="action-icon">🗑️</div>
                    <div class="action-info">
                        <div class="action-title">清空数据</div>
                        <div class="action-desc">删除所有笔记（不可恢复）</div>
                    </div>
                    <div class="action-arrow">›</div>
                </div>
            </div>`;

            html += `<div class="section-title">ℹ️ 关于</div>`;
            html += `<div class="note-list">
                <div class="about-card">
                    <div class="about-title">知识笔记整理助手</div>
                    <div class="about-version">版本 1.0.0</div>
                    <div class="about-desc">让知识管理像整理书架一样简单</div>
                </div>
            </div>`;

            screen.innerHTML = html;
        }

        function exportData() {
            const data = JSON.stringify(state, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'knowledge-notes-backup.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        function clearData() {
            if (confirm('确定要清空所有笔记吗？此操作不可恢复！')) {
                state.notes = [];
                saveState();
                alert('数据已清空');
                render();
            }
        }

        /* ==================== HTML 转义（防 XSS） ==================== */
        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }
        function escapeAttr(s) { return escapeHtml(s); }

        /* ==================== 初始化 ==================== */
        applyTheme(loadTheme());
        render();
    </script>
</body>
</html>
