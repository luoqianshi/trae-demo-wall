<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业个人信息保护合规审计平台 - 登录</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="login-logo">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <h1 class="login-title">企业个人信息保护合规审计平台</h1>
                <p class="login-subtitle">请登录您的账户</p>
            </div>
            
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label class="form-label">用户名</label>
                    <input type="text" class="form-control" id="username" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input type="password" class="form-control" id="password" placeholder="请输入密码">
                </div>
                <div class="form-group">
                    <label class="form-label">登录类型</label>
                    <select class="form-control" id="loginType">
                        <option value="enterprise">企业用户</option>
                        <option value="supervisor">监管人员</option>
                        <option value="admin">管理员</option>
                    </select>
                </div>
            </form>

            <div class="login-links">
                <label class="form-label">
                    <input type="checkbox" id="rememberMe"> 记住我
                </label>
                <a href="#">忘记密码？</a>
            </div>

            <button class="btn btn-primary btn-lg login-button" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i> 登录
            </button>

            <div style="text-align: center; margin-top: 20px;">
                <span class="login-subtitle">还没有账户？</span>
                <a href="index.html" class="btn btn-secondary btn-sm" style="margin-left: 10px;">
                    <i class="fas fa-user-plus"></i> 注册
                </a>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginBtn = document.getElementById('loginBtn');
            const loginForm = document.getElementById('loginForm');
            
            loginBtn.addEventListener('click', () => {
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const loginType = document.getElementById('loginType').value;
                
                let validUser = null;
                const users = {
                    admin: { username: 'admin', password: 'admin123', name: '管理员', role: 'admin' },
                    enterprise: { username: 'user', password: 'user123', name: '企业用户', role: 'enterprise' },
                    supervisor: { username: 'supervisor', password: 'supervisor123', name: '监管人员', role: 'supervisor' }
                };
                
                const user = users[loginType];
                if (user && username === user.username && password === user.password) {
                    localStorage.setItem('currentUser', JSON.stringify(user));
                    window.location.href = 'dashboard.html';
                } else {
                    App.showToast('用户名或密码错误', 'error');
                }
            });

            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                loginBtn.click();
            });
        });
    </script>
</body>
</html>
