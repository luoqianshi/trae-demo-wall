    <div class="page-container">

                    </li>
                    <li>

                    </li>
                    <li>

        <main class="main-content">
            <header class="top-header">

                </div>
                <div class="top-header-right">

                    </div>

            <div class="content-area">

                    <div class="col-4">

                                <div style="width: 60px; height: 60px; background: linear-gradient(135deg, #005EB8, #0096C7); border-radius: 12px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
                                    <i class="fas fa-question-circle" style="font-size: 28px; color: #fff;"></i>
                                </div>
                                <h3 style="font-size: 18px; font-weight: 600; margin-bottom: 10px;">问题管理</h3>
                                <p style="color: var(--text-muted); font-size: 14px;">增加、删除、修改审计问题</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="card" style="cursor: pointer;" onclick="showTab('score')">
                            <div style="text-align: center;">
                                <div style="width: 60px; height: 60px; background: linear-gradient(135deg, #28A745, #218838); border-radius: 12px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
                                    <i class="fas fa-star" style="font-size: 28px; color: #fff;"></i>
                                </div>
                                <h3 style="font-size: 18px; font-weight: 600; margin-bottom: 10px;">评分管理</h3>
                                <p style="color: var(--text-muted); font-size: 14px;">修改评分规则和权重</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="card" style="cursor: pointer;" onclick="showTab('laws')">

                                <div style="width: 60px; height: 60px; background: linear-gradient(135deg, #FFC107, #FF8F00); border-radius: 12px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">

                                </div>
                                <h3 style="font-size: 18px; font-weight: 600; margin-bottom: 10px;">法律知识库</h3>
                                <p style="color: var(--text-muted); font-size: 14px;">导入法律法规和标准</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row" style="margin-top: 30px;">
                    <div class="col-4">
                        <div class="card" style="cursor: pointer;" onclick="showTab('enterprises')">

                                <div style="width: 60px; height: 60px; background: linear-gradient(135deg, #17A2B8, #138496); border-radius: 12px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
                                    <i class="fas fa-building" style="font-size: 28px; color: #fff;"></i>
                                </div>
                                <h3 style="font-size: 18px; font-weight: 600; margin-bottom: 10px;">企业管理</h3>
                                <p style="color: var(--text-muted); font-size: 14px;">管理企业账号和信息</p>
                            </div>
                        </div>

                                </div>

                                <p style="color: var(--text-muted); font-size: 14px;">管理用户账号和角色</p>
                            </div>

    <div class="modal-overlay" id="enterpriseModal">

            <div class="modal-header">

            </div>
            <div class="modal-body">
                <p style="text-align: center; color: var(--text-muted);">请在仪表盘页面填写企业信息</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('enterpriseModal')">关闭</button>
                <a href="dashboard.html" class="btn btn-primary">前往填写</a>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="rectificationModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">整改建议</h3>
                <button class="modal-close"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <p style="text-align: center; color: var(--text-muted);">请先完成审计流程获取整改建议</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('rectificationModal')">关闭</button>
                <a href="audit.html" class="btn btn-primary">开始审计</a>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            App.init();
            
            const toggleSidebar = document.getElementById('toggleSidebar');
            const sidebar = document.getElementById('sidebar');
            toggleSidebar.addEventListener('click', () => {
                sidebar.classList.toggle('collapsed');
            });

            const themeToggle = document.getElementById('themeToggle');
            themeToggle.addEventListener('click', () => {
                const current = document.documentElement.getAttribute('data-theme');
                const newTheme = current === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                themeToggle.innerHTML = newTheme === 'dark' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
            });
        });

        function showTab(tab) {
            const tabContent = document.getElementById('tabContent');
            const tabTitle = document.getElementById('tabTitle');
            const tabBody = document.getElementById('tabBody');
            
            tabContent.style.display = 'block';
            
            switch(tab) {
                case 'question':
                    tabTitle.textContent = '问题管理';
                    tabBody.innerHTML = generateQuestionTable();
                    break;
                case 'score':
                    tabTitle.textContent = '评分管理';
                    tabBody.innerHTML = generateScoreTable();
                    break;
                case 'laws':
                    tabTitle.textContent = '法律知识库';
                    tabBody.innerHTML = generateLawsTable();
                    break;
                case 'enterprises':
                    tabTitle.textContent = '企业管理';
                    tabBody.innerHTML = generateEnterpriseTable();
                    break;
                case 'accounts':
                    tabTitle.textContent = '账号管理';
                    tabBody.innerHTML = generateAccountsTable();
                    break;
                case 'logs':
                    tabTitle.textContent = '操作日志';
                    tabBody.innerHTML = generateLogsTable();
                    break;
            }
        }

        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }
    </script>
</body>
</html>
