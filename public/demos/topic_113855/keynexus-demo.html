<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KeyNexus 智钥管家</title>
<style>
  /* ========== CSS 变量 ========== */
  :root {
    /* 背景色 */
    --bg-primary: #181825;
    --bg-secondary: #1e1e2e;
    --bg-tertiary: #313244;
    --bg-overlay: rgba(30, 30, 50, 0.85);

    /* 主色调 - 蓝紫渐变 */
    --primary: #89b4fa;
    --primary-hover: #a6c8ff;
    --primary-active: #6a93e0;
    --gradient-start: #89b4fa;
    --gradient-end: #cba6f7;

    /* 文字灰度 */
    --text-primary: #ffffff;
    --text-secondary: #cdd6f4;
    --text-tertiary: #a6adc8;
    --text-muted: #6c7086;
    --text-disabled: #45475a;

    /* 功能色 */
    --success: #a6e3a1;
    --warning: #f9e2af;
    --error: #f38ba8;
    --info: #89dceb;

    /* 边框 */
    --border-color: #45475a;
    --border-light: #313244;

    /* 字号 */
    --font-xs: 12px;
    --font-sm: 13px;
    --font-base: 14px;
    --font-md: 15px;
    --font-lg: 16px;
    --font-xl: 20px;
    --font-2xl: 24px;
    --font-3xl: 32px;

    /* 间距 */
    --spacing-xs: 4px;
    --spacing-sm: 8px;
    --spacing-md: 12px;
    --spacing-base: 16px;
    --spacing-lg: 20px;
    --spacing-xl: 24px;
    --spacing-2xl: 32px;
    --spacing-3xl: 48px;

    /* 圆角 */
    --radius-sm: 4px;
    --radius-md: 6px;
    --radius-lg: 8px;
    --radius-xl: 12px;
    --radius-2xl: 16px;
    --radius-full: 9999px;

    /* 阴影 */
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
    --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.5);
    --shadow-xl: 0 16px 48px rgba(0, 0, 0, 0.6);

    /* 高度 */
    --header-height: 56px;
  }

  /* ========== 全局 Reset ========== */
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100vh;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: var(--font-base);
    color: var(--text-primary);
    background: var(--bg-primary);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ========== Toast 提示 ========== */
  .toast-container {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
    max-width: 340px;
  }

  .toast {
    padding: 10px 16px;
    border-radius: var(--radius-md);
    background: var(--bg-secondary);
    color: var(--text-primary);
    font-size: var(--font-sm);
    box-shadow: var(--shadow-lg);
    animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
    border: 1px solid var(--border-color);
    border-left-width: 3px;
    pointer-events: auto;
    line-height: 1.5;
  }

  .toast.info { border-left-color: var(--info); }
  .toast.warning { border-left-color: var(--warning); }
  .toast.error { border-left-color: var(--error); }
  .toast.success { border-left-color: var(--success); }

  @keyframes toastIn {
    from { opacity: 0; transform: translateX(40px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @keyframes toastOut {
    from { opacity: 1; transform: translateX(0); }
    to { opacity: 0; transform: translateX(40px); }
  }

  /* ========== 解锁页 ========== */
  .unlock-wrap {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  }

  .unlock-card {
    width: 420px;
    background: var(--bg-overlay);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: var(--radius-xl);
    padding: var(--spacing-2xl);
    border: 1px solid var(--border-light);
    box-shadow: var(--shadow-xl);
  }

  .brand {
    text-align: center;
    margin-bottom: var(--spacing-xl);
  }

  .brand .logo {
    font-size: 48px;
    margin-bottom: var(--spacing-sm);
  }

  .brand h2 {
    margin: 0 0 var(--spacing-xs);
    color: var(--text-primary);
    font-size: var(--font-xl);
    font-weight: 600;
  }

  .brand .sub {
    color: var(--text-tertiary);
    margin: 0;
    font-size: var(--font-sm);
  }

  .form-group {
    margin-bottom: var(--spacing-base);
  }

  .form-label {
    display: block;
    font-size: var(--font-sm);
    color: var(--text-secondary);
    margin-bottom: var(--spacing-sm);
  }

  .input-wrapper {
    position: relative;
  }

  .input-wrapper input[type="password"],
  .input-wrapper input[type="text"] {
    width: 100%;
    height: 38px;
    padding: 0 var(--spacing-md);
    padding-right: 40px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    color: var(--text-primary);
    font-size: var(--font-base);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .input-wrapper input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(137, 180, 250, 0.2);
  }

  .input-wrapper input::placeholder {
    color: var(--text-muted);
  }

  .toggle-password {
    position: absolute;
    right: var(--spacing-sm);
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--text-tertiary);
    cursor: pointer;
    padding: var(--spacing-xs);
    font-size: var(--font-md);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .toggle-password:hover {
    color: var(--text-secondary);
  }

  .checkbox-group {
    display: flex;
    align-items: flex-start;
    gap: var(--spacing-sm);
    margin-bottom: var(--spacing-base);
    cursor: pointer;
  }

  .checkbox-group input[type="checkbox"] {
    margin-top: 2px;
    width: 16px;
    height: 16px;
    cursor: pointer;
    accent-color: var(--primary);
  }

  .checkbox-group label {
    font-size: var(--font-sm);
    color: var(--text-tertiary);
    cursor: pointer;
    line-height: 1.5;
  }

  .btn {
    width: 100%;
    height: 40px;
    border: none;
    border-radius: var(--radius-md);
    font-size: var(--font-base);
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--spacing-sm);
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
    color: #1e1e2e;
    font-weight: 600;
  }

  .btn-primary:hover:not(:disabled) {
    opacity: 0.9;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(137, 180, 250, 0.3);
  }

  .btn-primary:active:not(:disabled) {
    transform: translateY(0);
  }

  .btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .btn-ghost {
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--border-color);
  }

  .btn-ghost:hover {
    background: var(--bg-tertiary);
    color: var(--text-primary);
  }

  .tip {
    color: var(--text-muted);
    font-size: var(--font-xs);
    margin-top: var(--spacing-base);
    text-align: center;
    line-height: 1.6;
  }

  /* ========== 主布局 ========== */
  .app-root {
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .header {
    display: flex;
    align-items: center;
    padding: 0 var(--spacing-lg);
    height: var(--header-height);
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-light);
    flex-shrink: 0;
  }

  .header .brand {
    display: flex;
    align-items: center;
    gap: var(--spacing-sm);
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 0;
    text-align: left;
  }

  .header .brand .logo {
    font-size: 22px;
    margin-bottom: 0;
  }

  .header .brand .name {
    font-size: var(--font-lg);
  }

  .tabs {
    flex: 1;
    margin-left: var(--spacing-2xl);
    display: flex;
    align-items: center;
    height: 100%;
    gap: var(--spacing-lg);
  }

  .tab-item {
    position: relative;
    padding: 0 var(--spacing-sm);
    height: 100%;
    display: flex;
    align-items: center;
    color: var(--text-tertiary);
    font-size: var(--font-base);
    cursor: pointer;
    transition: color 0.2s;
    user-select: none;
  }

  .tab-item:hover {
    color: var(--text-secondary);
  }

  .tab-item.active {
    color: var(--text-primary);
  }

  .tab-item.active::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--gradient-start), var(--gradient-end));
    border-radius: 1px 1px 0 0;
  }

  .tab-badge {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    right: -8px;
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    background: var(--error);
    color: #fff;
    font-size: 10px;
    font-weight: 600;
    border-radius: var(--radius-full);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .tab-label {
    position: relative;
    padding-right: var(--spacing-lg);
  }

  .actions {
    margin-left: var(--spacing-base);
  }

  .btn-lock {
    height: 32px;
    padding: 0 var(--spacing-base);
    background: transparent;
    border: 1px solid var(--border-color);
    color: var(--text-tertiary);
    font-size: var(--font-sm);
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-lock:hover {
    background: var(--bg-tertiary);
    color: var(--text-secondary);
    border-color: var(--border-color);
  }

  .content {
    height: calc(100vh - var(--header-height));
    overflow: auto;
    padding: var(--spacing-lg);
    background: var(--bg-primary);
    flex: 1;
  }

  .tab-panel {
    display: none;
  }

  .tab-panel.active {
    display: block;
  }

  .tab-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 300px;
    color: var(--text-muted);
    font-size: var(--font-lg);
  }

  /* 滚动条样式 */
  .content::-webkit-scrollbar {
    width: 8px;
  }

  .content::-webkit-scrollbar-track {
    background: transparent;
  }

  .content::-webkit-scrollbar-thumb {
    background: var(--border-color);
    border-radius: 4px;
  }

  .content::-webkit-scrollbar-thumb:hover {
    background: var(--text-muted);
  }

  /* 隐藏类 */
  .hidden {
    display: none !important;
  }

  /* ========== 条目列表 ========== */
  .entry-list-wrap {
    max-width: 960px;
    margin: 0 auto;
  }

  .entry-toolbar {
    display: flex;
    align-items: center;
    gap: var(--spacing-md);
    margin-bottom: var(--spacing-lg);
  }

  .btn-add {
    height: 34px;
    padding: 0 var(--spacing-base);
    background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
    color: #1e1e2e;
    border: none;
    border-radius: var(--radius-md);
    font-size: var(--font-sm);
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: var(--spacing-xs);
    transition: all 0.2s;
  }

  .btn-add:hover {
    opacity: 0.9;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(137, 180, 250, 0.3);
  }

  .btn-refresh {
    height: 34px;
    padding: 0 var(--spacing-md);
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    font-size: var(--font-sm);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: var(--spacing-xs);
    transition: all 0.2s;
  }

  .btn-refresh:hover {
    background: var(--bg-tertiary);
    color: var(--text-primary);
  }

  .entry-count {
    margin-left: auto;
    color: var(--text-muted);
    font-size: var(--font-sm);
  }

  .entry-empty {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 300px;
    color: var(--text-muted);
    font-size: var(--font-lg);
  }

  .entry-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
    padding: var(--spacing-base);
    margin-bottom: var(--spacing-md);
    transition: border-color 0.2s;
  }

  .entry-card:hover {
    border-color: var(--border-color);
  }

  .entry-card-head {
    display: flex;
    align-items: center;
    gap: var(--spacing-sm);
    margin-bottom: var(--spacing-md);
  }

  .entry-kind-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: var(--radius-md);
    background: var(--bg-tertiary);
    color: var(--text-secondary);
    flex-shrink: 0;
  }

  .entry-tag {
    display: inline-flex;
    align-items: center;
    height: 22px;
    padding: 0 var(--spacing-sm);
    background: rgba(137, 180, 250, 0.15);
    color: var(--primary);
    font-size: var(--font-xs);
    font-weight: 500;
    border-radius: var(--radius-sm);
  }

  .entry-kind-tag {
    display: inline-flex;
    align-items: center;
    height: 20px;
    padding: 0 var(--spacing-xs);
    background: var(--bg-tertiary);
    color: var(--text-tertiary);
    font-size: var(--font-xs);
    border-radius: var(--radius-sm);
  }

  .entry-expiry {
    margin-left: auto;
    font-size: var(--font-sm);
    font-weight: 600;
  }

  .urgency-expired { color: #ff4d4f; }
  .urgency-danger { color: #ff7a45; }
  .urgency-warn { color: #faad14; }
  .urgency-ok { color: #52c41a; }

  .entry-card-body {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--spacing-sm) var(--spacing-xl);
    margin-bottom: var(--spacing-md);
    padding-top: var(--spacing-md);
    border-top: 1px solid var(--border-light);
  }

  .entry-field {
    font-size: var(--font-sm);
    display: flex;
    gap: var(--spacing-sm);
  }

  .entry-field .field-label {
    color: var(--text-muted);
    flex-shrink: 0;
    min-width: 56px;
  }

  .entry-field .field-value {
    color: var(--text-secondary);
    word-break: break-all;
  }

  .entry-field .field-value.note {
    color: var(--text-tertiary);
  }

  .entry-card-actions {
    display: flex;
    gap: var(--spacing-sm);
    flex-wrap: wrap;
    padding-top: var(--spacing-md);
    border-top: 1px solid var(--border-light);
  }

  .btn-card {
    height: 28px;
    padding: 0 var(--spacing-md);
    background: var(--bg-tertiary);
    color: var(--text-secondary);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-md);
    font-size: var(--font-xs);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: var(--spacing-xs);
    transition: all 0.2s;
  }

  .btn-card:hover {
    background: var(--border-light);
    color: var(--text-primary);
  }

  .btn-card.danger {
    color: var(--error);
  }

  .btn-card.danger:hover {
    background: rgba(243, 139, 168, 0.1);
    border-color: var(--error);
  }

  .btn-card:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* ========== 新增/编辑表单 ========== */
  .form-wrap {
    max-width: 640px;
    margin: 0 auto;
  }

  .form-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-xl);
    padding: var(--spacing-xl);
  }

  .form-title {
    margin: 0 0 var(--spacing-xl);
    color: var(--text-primary);
    font-size: var(--font-xl);
    font-weight: 600;
  }

  .form-row {
    margin-bottom: var(--spacing-base);
  }

  .form-row-label {
    display: block;
    font-size: var(--font-sm);
    color: var(--text-secondary);
    margin-bottom: var(--spacing-sm);
  }

  .form-row-label .required {
    color: var(--error);
    margin-left: var(--spacing-xs);
  }

  .form-input {
    width: 100%;
    height: 38px;
    padding: 0 var(--spacing-md);
    background: var(--bg-tertiary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    color: var(--text-primary);
    font-size: var(--font-base);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    font-family: inherit;
  }

  .form-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(137, 180, 250, 0.2);
  }

  .form-input::placeholder {
    color: var(--text-muted);
  }

  textarea.form-input {
    height: auto;
    min-height: 72px;
    padding: var(--spacing-sm) var(--spacing-md);
    resize: vertical;
    line-height: 1.6;
  }

  .form-radio-group {
    display: flex;
    gap: var(--spacing-lg);
    padding: var(--spacing-sm) 0;
  }

  .form-radio {
    display: flex;
    align-items: center;
    gap: var(--spacing-xs);
    cursor: pointer;
    font-size: var(--font-base);
    color: var(--text-secondary);
  }

  .form-radio input {
    width: 16px;
    height: 16px;
    cursor: pointer;
    accent-color: var(--primary);
  }

  .form-error {
    color: var(--error);
    font-size: var(--font-xs);
    margin-top: var(--spacing-xs);
    display: none;
  }

  .form-error.show {
    display: block;
  }

  .form-divider {
    height: 1px;
    background: var(--border-light);
    margin: var(--spacing-lg) 0;
  }

  .form-actions {
    display: flex;
    justify-content: flex-end;
    gap: var(--spacing-md);
    margin-top: var(--spacing-xl);
  }

  .btn-save {
    height: 38px;
    padding: 0 var(--spacing-xl);
    background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
    color: #1e1e2e;
    border: none;
    border-radius: var(--radius-md);
    font-size: var(--font-base);
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-save:hover {
    opacity: 0.9;
    transform: translateY(-1px);
  }

  .btn-cancel {
    height: 38px;
    padding: 0 var(--spacing-xl);
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    font-size: var(--font-base);
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-cancel:hover {
    background: var(--bg-tertiary);
    color: var(--text-primary);
  }

  /* 动态字段显示/隐藏 */
  [data-kind="promo"] .only-key,
  [data-kind="account"] .only-key { display: none; }
  [data-kind="promo"] .not-promo { display: none; }
  [data-kind="account"] .not-account { display: none; }

  /* ========== 模态框 ========== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 9000;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.2s ease;
  }

  .modal {
    width: 520px;
    max-width: calc(100vw - 32px);
    max-height: calc(100vh - 64px);
    overflow: auto;
    background: var(--bg-secondary);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-xl);
    animation: modalIn 0.25s ease;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--spacing-lg) var(--spacing-xl);
    border-bottom: 1px solid var(--border-light);
  }

  .modal-title {
    font-size: var(--font-lg);
    font-weight: 600;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: var(--spacing-sm);
  }

  .modal-title svg { color: var(--primary); flex-shrink: 0; }

  .modal-close {
    background: none;
    border: none;
    color: var(--text-tertiary);
    cursor: pointer;
    padding: var(--spacing-xs);
    display: flex;
    align-items: center;
    border-radius: var(--radius-sm);
  }

  .modal-close:hover { color: var(--text-primary); background: var(--bg-tertiary); }

  /* 显示凭证模态框 */

  /* ========== 今日简报 ========== */

<body>

<!-- Toast 容器 -->
<div id="toast-container" class="toast-container"></div>

<!-- 解锁页 -->
<div id="unlock-screen" class="unlock-wrap">
  <div class="unlock-card">
    <div class="brand">
      <div class="logo">🔑</div>
      <h2>KeyNexus 智钥管家</h2>
      <p class="sub" id="unlock-subtitle">首次使用，请设置主密码</p>
      <div class="demo-badge">DEMO 演示版</div>
    </div>

    <div class="form-group">
      <label class="form-label" for="password-input">主密码</label>
      <div class="input-wrapper">
        <input
          type="password"
          id="password-input"
          placeholder="设置主密码（至少 6 位）"
          autocomplete="off"
        />
        <button type="button" class="toggle-password" id="toggle-password" title="显示/隐藏密码">
          <span id="eye-icon">👁️</span>
        </button>
      </div>
    </div>

    <div class="checkbox-group" id="confirm-group">
      <input type="checkbox" id="confirm-checkbox" />
      <label for="confirm-checkbox">我已了解：主密码丢失后数据无法恢复</label>
    </div>

    <button class="btn btn-primary" id="submit-btn" disabled>
      <span id="submit-btn-text">创建金库</span>
    </button>

    <p class="tip" id="tip-text">
      主密码用于加密所有 API Key、账号与密码，仅保存在本机，不会上传。
    </p>
  </div>
</div>

<!-- 主布局 -->
<div id="main-layout" class="app-root hidden">
  <header class="header">
    <div class="brand">
      <span class="logo">🔑</span>
      <span class="name">KeyNexus 智钥管家</span>
    </div>

    <nav class="tabs" id="tabs">
      <div class="tab-item active" data-tab="list">
        <span class="tab-label">凭证列表</span>
      </div>
      <div class="tab-item" data-tab="add">
        <span class="tab-label" id="tab-add-label">新增</span>
      </div>
      <div class="tab-item" data-tab="brief">
        <span class="tab-label">
          今日简报
          <span class="tab-badge" id="brief-badge" style="display:none">0</span>
        </span>
      </div>
      <div class="tab-item" data-tab="settings">
        <span class="tab-label">设置</span>
      </div>
    </nav>

    <div class="actions">
      <button class="btn-lock" id="lock-btn">锁定</button>
    </div>
  </header>

  <main class="content">
    <div class="tab-panel active" id="panel-list">
      <!-- 由 renderEntryList() 动态渲染 -->
    </div>
    <div class="tab-panel" id="panel-add">
      <!-- 由 renderEntryForm() 动态渲染 -->
    </div>
    <div class="tab-panel" id="panel-brief">
      <!-- 由 renderBrief() 动态渲染 -->
    </div>
    <div class="tab-panel" id="panel-settings"></div>
  </main>
</div>

<script>
  // ========== 状态管理 ==========
  const STORAGE_KEYS = {
    VAULT_INITIALIZED: 'keynexus_vault_initialized',
    VAULT_UNLOCKED: 'keynexus_vault_unlocked',
    ENTRIES: 'keynexus_entries',
    ACKS: 'keynexus_acks',
    CONFIG: 'keynexus_config',
    MOCK_INJECTED: 'keynexus_mock_injected'
  };

  const DEFAULT_CONFIG = {
    alert_key_days: 7,
    alert_promo_days: 3,
    alert_token_pct: 10,
    scan_interval_hours: 4,
    autostart: false,
    scan_without_unlock: false
  };

  function configGet() {
    const raw = localStorage.getItem(STORAGE_KEYS.CONFIG);
    if (!raw) return { ...DEFAULT_CONFIG };
    try {
      const parsed = JSON.parse(raw);
      return { ...DEFAULT_CONFIG, ...parsed };
    } catch {
      return { ...DEFAULT_CONFIG };
    }
  }

  function configSave(config) {
    const merged = { ...DEFAULT_CONFIG, ...config };
    localStorage.setItem(STORAGE_KEYS.CONFIG, JSON.stringify(merged));
    return merged;
  }

  const state = {
    currentTab: 'list',
    editingId: null,
    alerts: [],
    entries: [],
    formData: getEmptyForm()
  };

  let ALERT_CONFIG = {
    keyDays: 7,
    promoDays: 3,
    tokenPct: 10
  };

  function updateAlertConfig() {
    const cfg = configGet();
    ALERT_CONFIG = {
      keyDays: cfg.alert_key_days,
      promoDays: cfg.alert_promo_days,
      tokenPct: cfg.alert_token_pct
    };
  }

  // ========== Toast 工具 ==========
  function showToast(message, type = 'info') {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.textContent = message;
    container.appendChild(toast);

    setTimeout(() => {
      toast.remove();
    }, 3000);
  }

  // ========== 解锁页逻辑 ==========
  const unlockScreen = document.getElementById('unlock-screen');
  const mainLayout = document.getElementById('main-layout');
  const passwordInput = document.getElementById('password-input');
  const togglePasswordBtn = document.getElementById('toggle-password');
  const eyeIcon = document.getElementById('eye-icon');
  const confirmGroup = document.getElementById('confirm-group');
  const confirmCheckbox = document.getElementById('confirm-checkbox');
  const submitBtn = document.getElementById('submit-btn');
  const submitBtnText = document.getElementById('submit-btn-text');
  const unlockSubtitle = document.getElementById('unlock-subtitle');
  const tipText = document.getElementById('tip-text');

  // 密码显示/隐藏切换
  let passwordVisible = false;
  togglePasswordBtn.addEventListener('click', () => {
    passwordVisible = !passwordVisible;
    passwordInput.type = passwordVisible ? 'text' : 'password';
    eyeIcon.textContent = passwordVisible ? '🙈' : '👁️';
  });

  // 获取当前模式
  function getMode() {
    return localStorage.getItem(STORAGE_KEYS.VAULT_INITIALIZED) ? 'unlock' : 'init';
  }

  // 切换解锁页模式
  function setUnlockMode(mode) {
    if (mode === 'init') {
      unlockSubtitle.textContent = '首次使用，请设置主密码';
      passwordInput.placeholder = '设置主密码（至少 6 位）';
      confirmGroup.style.display = 'flex';
      submitBtnText.textContent = '创建金库';
      tipText.style.display = 'block';
      submitBtn.disabled = !confirmCheckbox.checked || !passwordInput.value;
    } else {
      unlockSubtitle.textContent = '金库已锁定，请输入主密码解锁';
      passwordInput.placeholder = '请输入主密码';
      confirmGroup.style.display = 'none';
      submitBtnText.textContent = '解锁';
      tipText.style.display = 'none';
      submitBtn.disabled = !passwordInput.value;
    }
  }

  // 密码输入监听
  passwordInput.addEventListener('input', () => {
    const mode = getMode();
    if (mode === 'init') {
      submitBtn.disabled = !confirmCheckbox.checked || !passwordInput.value;
    } else {
      submitBtn.disabled = !passwordInput.value;
    }
  });

  // 确认勾选框监听
  confirmCheckbox.addEventListener('change', () => {
    submitBtn.disabled = !confirmCheckbox.checked || !passwordInput.value;
  });

  // 回车提交
  passwordInput.addEventListener('keyup', (e) => {
    if (e.key === 'Enter' && !submitBtn.disabled) {
      handleSubmit();
    }
  });

  // 提交按钮
  submitBtn.addEventListener('click', handleSubmit);

  function handleSubmit() {
    const mode = getMode();
    const password = passwordInput.value.trim();

    if (!password) {
      showToast('请输入主密码', 'warning');
      return;
    }

    if (mode === 'init' && password.length < 6) {
      showToast('主密码至少需要 6 位', 'warning');
      return;
    }

    if (mode === 'init') {
      // 模拟创建金库
      localStorage.setItem(STORAGE_KEYS.VAULT_INITIALIZED, 'true');
      localStorage.setItem(STORAGE_KEYS.VAULT_UNLOCKED, 'true');
      showToast('金库已创建', 'success');

      if (!localStorage.getItem(STORAGE_KEYS.MOCK_INJECTED)) {
        injectMockData();
      }
    } else {
      // 模拟解锁
      localStorage.setItem(STORAGE_KEYS.VAULT_UNLOCKED, 'true');
      showToast('已解锁', 'success');
    }

    passwordInput.value = '';
    confirmCheckbox.checked = false;
    passwordVisible = false;
    passwordInput.type = 'password';
    eyeIcon.textContent = '👁️';

    // 切换到主布局
    setTimeout(() => {
      showMainLayout();
    }, 300);
  }

  // ========== 主布局逻辑 ==========
  const lockBtn = document.getElementById('lock-btn');
  const tabItems = document.querySelectorAll('.tab-item');
  const tabPanels = document.querySelectorAll('.tab-panel');
  const tabAddLabel = document.getElementById('tab-add-label');

  // Tab 切换
  tabItems.forEach(tab => {
    tab.addEventListener('click', () => {
      const tabName = tab.dataset.tab;

    tabItems.forEach(tab => {
      if (tab.dataset.tab === tabName) {
        tab.classList.add('active');
      } else {
        tab.classList.remove('active');

    });

    tabPanels.forEach(panel => {
      panel.classList.remove('active');

    document.getElementById(`panel-${tabName}`).classList.add('active');

    // 渲染对应面板内容
    if (tabName === 'list') {
      renderEntryList();
    } else if (tabName === 'add') {

  // ========== 数据层 — localStorage CRUD ==========
  function entryList() {
    const raw = localStorage.getItem(STORAGE_KEYS.ENTRIES);
    if (!raw) return [];
    try { return JSON.parse(raw); } catch { return []; }
  }

  function entrySave(entries) {
    localStorage.setItem(STORAGE_KEYS.ENTRIES, JSON.stringify(entries));
  }

  function entryAdd(input) {
    const entries = entryList();
    const entry = {
      id: Date.now() + '-' + Math.random().toString(36).slice(2, 8),
      kind: input.kind || 'key',
      provider: input.provider || '',
      api_key: input.api_key || '',
      account: input.account || '',
      password: input.password || '',
      website: input.website || '',
      token_balance: input.token_balance !== '' && input.token_balance != null ? Number(input.token_balance) : null,
      token_total: input.token_total !== '' && input.token_total != null ? Number(input.token_total) : null,
      expiry_date: input.expiry_date || '',
      promo_end: input.promo_end || '',
      note: input.note || ''
    };
    entries.push(entry);
    entrySave(entries);
    return entry;
  }

  function entryUpdate(id, input) {
    const entries = entryList();
    const idx = entries.findIndex(e => e.id === id);
    if (idx === -1) return null;
    entries[idx] = {
      ...entries[idx],
      kind: input.kind || entries[idx].kind,
      provider: input.provider || '',
      api_key: input.api_key || '',
      account: input.account || '',
      password: input.password || '',
      website: input.website || '',
      token_balance: input.token_balance !== '' && input.token_balance != null ? Number(input.token_balance) : null,
      token_total: input.token_total !== '' && input.token_total != null ? Number(input.token_total) : null,
      expiry_date: input.expiry_date || '',
      promo_end: input.promo_end || '',
      note: input.note || ''
    };
    entrySave(entries);
    return entries[idx];
  }

  function entryDelete(id) {
    const entries = entryList();
    entrySave(entries.filter(e => e.id !== id));
  }

  function entryReveal(id) {
    const entries = entryList();
    return entries.find(e => e.id === id) || null;
  }

  // ========== 辅助函数 ==========
  function daysTo(dateStr) {
    if (!dateStr) return null;
    const now = new Date(); now.setHours(0, 0, 0, 0);
    const t = new Date(dateStr); t.setHours(0, 0, 0, 0);
    return Math.round((t - now) / 86400000);
  }

  function urgencyRank(entry) {
    let r = 0;
    const dateField = entry.kind === 'promo' ? entry.promo_end : entry.expiry_date;
    const d = daysTo(dateField);
    if (d !== null) {
      if (d < 0) r += 100000 + (1000 - Math.min(1000, -d));
      else if (d <= 7) r += 10000 - d;
    }
    if (entry.token_balance != null && entry.token_total > 0) {
      const pct = entry.token_balance / entry.token_total;
      if (pct <= 0.1) r += 5000 + Math.round((1 - pct) * 1000);
    }
    const p = daysTo(entry.promo_end);
    if (p !== null && p <= 3 && entry.kind !== 'promo') r += 2000 - Math.min(2000, p);
    return r;
  }

  function urgencyClass(entry) {
    const dateField = entry.kind === 'promo' ? entry.promo_end : entry.expiry_date;
    let worstClass = 'urgency-ok';

    if (dateField) {
      const d = daysTo(dateField);
      if (d !== null) {
        if (d < 0) return 'urgency-expired';
        if (d <= 3) worstClass = 'urgency-danger';
        else if (d <= 7) worstClass = 'urgency-warn';
      }
    }

    if (entry.kind === 'key' && entry.token_balance != null && entry.token_total != null && entry.token_total > 0) {
      const pct = entry.token_balance / entry.token_total * 100;
      if (pct <= ALERT_CONFIG.tokenPct) {
        if (worstClass === 'urgency-ok') worstClass = 'urgency-warn';
      }
    }

    return worstClass;
  }

  function expiryText(entry) {
    const dateField = entry.kind === 'promo' ? entry.promo_end : entry.expiry_date;
    const label = entry.kind === 'promo' ? '优惠' : 'Key';
    if (!dateField) return entry.kind === 'account' ? '无到期日' : `无${label}到期日`;
    const d = daysTo(dateField);
    if (d === null) return `无${label}到期日`;
    if (d < 0) return `${label}已过期 ${-d} 天`;
    if (d === 0) return `${label}今日到期`;
    if (d <= 7) return `${d} 天后到期`;
    return dateField;
  }

  function kindLabel(k) {
    return { key: 'Key 凭证', promo: '优惠备忘', account: '账号备忘' }[k] || 'Key 凭证';
  }

  function kindIconSvg(k) {
    const icons = {
      key: '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg>',
      promo: '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>',
      account: '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>'
    };
    return icons[k] || icons.key;
  }

  function tokenText(e) {
    if (e.token_balance == null || e.token_total == null) return '—';
    const pct = e.token_total > 0 ? (e.token_balance / e.token_total * 100).toFixed(0) : '—';
    const fmtWan = (n) => n >= 10000 ? (n / 10000).toFixed(1) + ' 万' : String(n);
    return `${fmtWan(e.token_balance)} / ${fmtWan(e.token_total)}（${pct}%）`;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ========== 条目列表渲染 ==========
  function renderEntryList() {
    const entries = entryList();
    state.entries = entries;
    const panel = document.getElementById('panel-list');
    const count = entries.length;

    const plusIcon = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5v14"/></svg>';
    const refreshIcon = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>';

    if (count === 0) {
      panel.innerHTML = `
        <div class="entry-list-wrap">
          <div class="entry-toolbar">
            <button class="btn-add" id="btn-add-entry">${plusIcon} 新增条目</button>
            <button class="btn-refresh" id="btn-refresh">${refreshIcon} 刷新</button>
            <span class="entry-count">共 0 条</span>
          </div>
          <div class="entry-empty">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h6"/><path d="m9 11 3 3L22 4"/></svg>
            <div class="empty-text">还没有任何条目，点击右上角新增</div>
          </div>
        </div>`;
    } else {
      const sorted = [...entries].sort((a, b) => urgencyRank(b) - urgencyRank(a));
      panel.innerHTML = `
        <div class="entry-list-wrap">
          <div class="entry-toolbar">
            <button class="btn-add" id="btn-add-entry">${plusIcon} 新增条目</button>
            <button class="btn-refresh" id="btn-refresh">${refreshIcon} 刷新</button>
            <span class="entry-count">共 ${count} 条</span>
          </div>
          <div class="entry-cards">
            ${sorted.map(renderEntryCard).join('')}
          </div>
        </div>`;
    }

    // 绑定工具栏事件
    document.getElementById('btn-add-entry').addEventListener('click', startAdd);
    document.getElementById('btn-refresh').addEventListener('click', () => {
      renderEntryList();
      refreshAlerts();
      showToast('已刷新', 'success');
    });

    // 绑定卡片操作（事件委托）
    panel.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        handleCardAction(btn.dataset.action, btn.dataset.id);
      });
    });
  }

  function renderEntryCard(e) {
    const uClass = urgencyClass(e);
    const expText = expiryText(e);

    // 卡片体字段
    const fields = [];
    fields.push(`<div class="entry-field"><span class="field-label">网站</span><span class="field-value">${escapeHtml(e.website) || '—'}</span></div>`);
    if (e.kind === 'key') {
      fields.push(`<div class="entry-field"><span class="field-label">Token</span><span class="field-value">${tokenText(e)}</span></div>`);
    }
    if (e.kind !== 'account') {
      fields.push(`<div class="entry-field"><span class="field-label">优惠截止</span><span class="field-value">${escapeHtml(e.promo_end) || '—'}</span></div>`);
    }
    if (e.note) {
      fields.push(`<div class="entry-field"><span class="field-label">备注</span><span class="field-value note">${escapeHtml(e.note)}</span></div>`);
    }

    // 操作按钮
    const actions = [];
    if (e.kind === 'key') {
      actions.push(`<button class="btn-card" data-action="copy" data-id="${e.id}">复制 Key</button>`);
    }
    actions.push(`<button class="btn-card" data-action="open" data-id="${e.id}"${!e.website ? ' disabled' : ''}>跳转网站</button>`);
    actions.push(`<button class="btn-card" data-action="reveal" data-id="${e.id}">${e.kind === 'key' ? '显示凭证' : '查看详情'}</button>`);
    actions.push(`<button class="btn-card" data-action="edit" data-id="${e.id}">编辑</button>`);
    actions.push(`<button class="btn-card danger" data-action="delete" data-id="${e.id}">删除</button>`);

    return `
    <div class="entry-card">
      <div class="entry-card-head">
        <span class="entry-kind-icon">${kindIconSvg(e.kind)}</span>
        <span class="entry-tag">${escapeHtml(e.provider)}</span>
        <span class="entry-kind-tag">${kindLabel(e.kind)}</span>
        <span class="entry-expiry ${uClass}">${expText}</span>
      </div>
      <div class="entry-card-body">
        ${fields.join('')}
      </div>
      <div class="entry-card-actions">
        ${actions.join('')}
      </div>
    </div>`;
  }

  function handleCardAction(action, id) {
    switch (action) {
      case 'copy': {
        const entry = entryReveal(id);
        if (!entry || !entry.api_key) {
          showToast('该条目未保存 Key', 'warning');
          return;
        }
        copyToClipboard(entry.api_key, 'API Key 已复制到剪贴板');
        break;
      }
      case 'open': {
        const entry = entryReveal(id);
        if (!entry || !entry.website) {
          showToast('未设置网站', 'warning');
          return;
        }
        window.open(entry.website, '_blank');
        openRevealModal(id);
        break;
      }
      case 'reveal':
        openRevealModal(id);
        break;
      case 'edit':
        startEdit(id);
        break;
      case 'delete':
        openConfirmModal('确认删除该条目？删除后无法恢复。', () => {
          entryDelete(id);
          renderEntryList();
          refreshAlerts();
          showToast('已删除', 'success');
        });
        break;
    }
  }

  // ========== 提醒引擎 ==========
  function todayStr() {
    const d = new Date();
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd}`;
  }

  function ackList() {
    const raw = localStorage.getItem(STORAGE_KEYS.ACKS);
    if (!raw) return [];
    try { return JSON.parse(raw); } catch { return []; }
  }

  function ackSave(acks) {
    localStorage.setItem(STORAGE_KEYS.ACKS, JSON.stringify(acks));
  }

  function isAcked(entryId, eventKind, acks, today) {
    return acks.some(a => a.entry_id === entryId && a.event_kind === eventKind && a.ack_date === today);
  }

  // 标记某条目某事件当天已查看
  function alertAck(entryId, eventKind) {
    const acks = ackList();
    const today = todayStr();
    if (!isAcked(entryId, eventKind, acks, today)) {
      acks.push({ entry_id: entryId, event_kind: eventKind, ack_date: today });
      ackSave(acks);
    }
  }

  // 扫描所有条目，生成 alert 数组（过滤当天已 ack 的）
  function alertsScan() {
    const entries = entryList();
    const acks = ackList();
    const today = todayStr();
    const alerts = [];

    entries.forEach(e => {
      // Key 到期检测（仅 key 类型有 expiry_date）
      if (e.expiry_date) {
        const d = daysTo(e.expiry_date);
        if (d !== null) {
          let eventKind = null, sub = '';
          if (d < 0) { eventKind = 'key_overdue'; sub = '已过期'; }
          else if (d === 0) { eventKind = 'key_today'; sub = '今日到期'; }
          else if (d <= ALERT_CONFIG.keyDays) { eventKind = 'key_advance'; sub = '即将到期'; }

          if (eventKind && !isAcked(e.id, eventKind, acks, today)) {
            let message;
            if (d < 0) message = `${e.provider} API Key 已过期 ${-d} 天，请续费或更换`;
            else if (d === 0) message = `${e.provider} API Key 今天到期`;
            else message = `${e.provider} API Key 还有 ${d} 天到期`;
            alerts.push({
              entry_id: e.id,
              event_kind: eventKind,
              alert_kind: 'key_expiring',
              title: `Key 到期 · ${sub}`,
              message
            });
          }
        }
      }

      // 优惠截止检测（有 promo_end 的条目）
      if (e.promo_end) {
        const d = daysTo(e.promo_end);
        if (d !== null) {
          let eventKind = null, sub = '';
          if (d < 0) { eventKind = 'promo_overdue'; sub = '已截止'; }
          else if (d === 0) { eventKind = 'promo_today'; sub = '今日截止'; }
          else if (d <= ALERT_CONFIG.promoDays) { eventKind = 'promo_advance'; sub = '即将截止'; }

          if (eventKind && !isAcked(e.id, eventKind, acks, today)) {
            let message;
            if (d < 0) message = `${e.provider} 优惠已截止 ${-d} 天`;
            else if (d === 0) message = `${e.provider} 优惠今天截止`;
            else message = `${e.provider} 优惠还有 ${d} 天截止`;
            alerts.push({
              entry_id: e.id,
              event_kind: eventKind,
              alert_kind: 'promo_expiring',
              title: `优惠截止 · ${sub}`,
              message
            });
          }
        }
      }

      // Token 不足检测（仅 key 类型）
      if (e.kind === 'key' && e.token_balance != null && e.token_total != null && e.token_total > 0) {
        const pct = e.token_balance / e.token_total * 100;
        if (pct <= ALERT_CONFIG.tokenPct) {
          const eventKind = 'token_low';
          if (!isAcked(e.id, eventKind, acks, today)) {
            alerts.push({
              entry_id: e.id,
              event_kind: eventKind,
              alert_kind: 'token_low',
              title: 'Token 不足',
              message: `${e.provider} Token 仅剩 ${pct.toFixed(0)}%（${e.token_balance} / ${e.token_total}）`
            });
          }
        }
      }
    });

    return alerts;
  }

  // ========== 剪贴板工具 ==========
  function copyToClipboard(text, successMsg) {
    if (!text) {
      showToast('内容为空，无法复制', 'warning');
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => {
        showToast(successMsg || '已复制', 'success');
      }).catch(() => {
        fallbackCopy(text, successMsg);
      });
    } else {
      fallbackCopy(text, successMsg);
    }
  }

  function fallbackCopy(text, successMsg) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      showToast(successMsg || '已复制', 'success');
    } catch {
      showToast('复制失败，请手动复制', 'error');
    }
    ta.remove();
  }

    }
    if (entry.account) {
      rows.push(`<div class="reveal-row"><span class="reveal-label">账号</span><span class="reveal-value">${escapeHtml(entry.account)}</span><button class="btn-copy-small" data-copy="${escapeHtml(entry.account)}">${copyIcon} 复制</button></div>`);
    }
    if (entry.password) {
      rows.push(`<div class="reveal-row"><span class="reveal-label">密码</span><span class="reveal-value">${escapeHtml(entry.password)}</span><button class="btn-copy-small" data-copy="${escapeHtml(entry.password)}">${copyIcon} 复制</button></div>`);
    }
    if (entry.website) {
      rows.push(`<div class="reveal-row"><span class="reveal-label">网址</span><span class="reveal-value">${escapeHtml(entry.website)}</span><button class="btn-copy-small" data-copy="${escapeHtml(entry.website)}">${copyIcon} 复制</button></div>`);
    }
    if (entry.note) {
      rows.push(`<div class="reveal-row"><span class="reveal-label">备注</span><span class="reveal-value text">${escapeHtml(entry.note)}</span></div>`);
    }

    const warn = entry.kind === 'key'
      ? `<div class="reveal-warn">${warnIcon} 查看后请及时关闭，避免明文长期暴露</div>`
      : '';

    const modalHtml = `
      <div class="modal-overlay" id="reveal-overlay">
        <div class="modal">
          <div class="modal-header">
            <div class="modal-title">${kindIconSvg(entry.kind)} ${escapeHtml(entry.provider)} · ${titleKind}</div>
            <button class="modal-close" id="reveal-close">${closeIcon}</button>
          </div>
          <div class="modal-body">
            ${rows.join('')}
            ${warn}
          </div>
        </div>
      </div>`;

    const existing = document.getElementById('reveal-overlay');
    if (existing) existing.remove();

    document.body.insertAdjacentHTML('beforeend', modalHtml);

    const overlay = document.getElementById('reveal-overlay');
    document.getElementById('reveal-close').addEventListener('click', closeRevealModal);
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closeRevealModal();
    });
    overlay.querySelectorAll('[data-copy]').forEach(btn => {
      btn.addEventListener('click', () => {
        copyToClipboard(btn.dataset.copy, '已复制');
      });
    });
    document.addEventListener('keydown', escCloseReveal);
  }

  function escCloseReveal(e) {
    if (e.key === 'Escape') closeRevealModal();
  }

  function closeRevealModal() {
    const overlay = document.getElementById('reveal-overlay');
    if (overlay) overlay.remove();
    document.removeEventListener('keydown', escCloseReveal);
  }

  // ========== 确认模态框（删除） ==========
  function openConfirmModal(message, onConfirm) {
    const closeIcon = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
    const warnIcon = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--error);flex-shrink:0"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4M12 17h.01"/></svg>';

    const modalHtml = `
      <div class="modal-overlay" id="confirm-overlay">
        <div class="modal" style="width: 400px">
          <div class="modal-header">
            <div class="modal-title">${warnIcon} 确认操作</div>
            <button class="modal-close" id="confirm-close">${closeIcon}</button>
          </div>
          <div class="modal-body">
            <div class="confirm-msg">${escapeHtml(message)}</div>
          </div>
          <div class="modal-footer">
            <button class="btn-modal-cancel" id="confirm-cancel">取消</button>
            <button class="btn-danger" id="confirm-ok">确认删除</button>
          </div>
        </div>
      </div>`;

    const existing = document.getElementById('confirm-overlay');
    if (existing) existing.remove();

    document.body.insertAdjacentHTML('beforeend', modalHtml);

    const overlay = document.getElementById('confirm-overlay');
    const escHandler = (e) => { if (e.key === 'Escape') close(); };
    const close = () => {
      overlay.remove();
      document.removeEventListener('keydown', escHandler);
    };

    document.getElementById('confirm-close').addEventListener('click', close);
    document.getElementById('confirm-cancel').addEventListener('click', close);
    document.getElementById('confirm-ok').addEventListener('click', () => {
      close();
      onConfirm();
    });
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
    document.addEventListener('keydown', escHandler);
  }

  // ========== 初始化 ==========
  function init() {
    updateAlertConfig();
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('reset') === '1') {
      Object.values(STORAGE_KEYS).forEach(k => localStorage.removeItem(k));
    }
    const isUnlocked = localStorage.getItem(STORAGE_KEYS.VAULT_UNLOCKED);
    if (isUnlocked) {
      showMainLayout();
    } else {
      showUnlockScreen();
    }
  }

  init();
</script>
</body>
</html>
