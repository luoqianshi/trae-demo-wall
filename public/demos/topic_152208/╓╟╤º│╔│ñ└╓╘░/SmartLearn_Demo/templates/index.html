<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智学成长乐园 - 自适应学习系统</title>
  <style>
    :root {
      --bg: #0f172a;
      --bg-2: #1e293b;
      --card: rgba(30, 41, 59, 0.8);
      --card-border: rgba(148, 163, 184, 0.15);
      --text: #f1f5f9;
      --text-2: #cbd5e1;
      --text-3: #94a3b8;
      --accent: #f97316;
      --accent-2: #8b5cf6;
      --math: #f97316;
      --english: #06b6d4;
      --chinese: #22c55e;
      --sports: #fbbf24;
      --success: #22c55e;
      --error: #ef4444;
      --warning: #f59e0b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      line-height: 1.7;
    }
    .nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(15,23,42,0.92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 24px;
      display: flex; align-items: center; gap: 12px;
      flex-wrap: wrap;
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      font-size: 18px; font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .logo-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; -webkit-text-fill-color: white;
    }
    .nav-tabs { display: flex; gap: 4px; margin-left: 16px; flex-wrap: wrap; }
    .nav-tab {
      padding: 7px 14px; border-radius: 9px; border: none;
      background: transparent; color: var(--text-2); cursor: pointer;
      font-size: 13px; font-weight: 500; transition: all 0.2s;
      display: flex; align-items: center; gap: 5px;
    }
    .nav-tab:hover { background: var(--card); color: var(--text); }
    .nav-tab.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
    }
    .user-badge { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .level-badge {
      background: linear-gradient(135deg, var(--accent), var(--warning));
      color: white; padding: 3px 10px; border-radius: 20px; font-weight: 700;
    }
    .xp-bar-container { width: 80px; height: 6px; background: var(--bg-2); border-radius: 3px; overflow: hidden; }
    .xp-bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--warning)); border-radius: 3px; transition: width 0.5s; }
    .streak-badge { display: flex; align-items: center; gap: 3px; color: var(--warning); }
    .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
    .page { display: none; animation: fadeIn 0.3s ease; }
    .page.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(10px);
    }
    .welcome-banner {
      background: linear-gradient(135deg, rgba(249,115,22,0.12), rgba(139,92,246,0.12));
      border: 1px solid var(--card-border); border-radius: 18px;
      padding: 24px 28px; margin-bottom: 20px;
      position: relative; overflow: hidden;
    }
    .welcome-banner h1 { font-size: 24px; margin-bottom: 6px; }
    .welcome-banner p { color: var(--text-2); font-size: 14px; }
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px; margin-bottom: 20px;
    }
    .stat-card {
      background: var(--card); border: 1px solid var(--card-border);
      border-radius: 14px; padding: 16px; text-align: center;
    }
    .stat-value { font-size: 28px; font-weight: 800; background: linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .stat-label { font-size: 12px; color: var(--text-3); margin-top: 2px; }
    .section-title { font-size: 18px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .subjects-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px; margin-bottom: 20px;
    }
    .subject-card {
      background: var(--card); border: 1px solid var(--card-border);
      border-radius: 16px; padding: 20px; cursor: pointer;
      transition: all 0.3s; position: relative; overflow: hidden;
    }
    .subject-card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 8px 30px rgba(249,115,22,0.15); }
    .subject-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    }
    .subject-card.math::before { background: linear-gradient(90deg, var(--math), #fb923c); }
    .subject-card.english::before { background: linear-gradient(90deg, var(--english), #22d3ee); }
    .subject-card.chinese::before { background: linear-gradient(90deg, var(--chinese), #4ade80); }
    .subject-card.sports::before { background: linear-gradient(90deg, var(--sports), #fcd34d); }
    .subject-icon { font-size: 36px; margin-bottom: 8px; }
    .subject-name { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .subject-stats { font-size: 12px; color: var(--text-3); }
    .subject-progress { margin-top: 10px; height: 6px; background: var(--bg-2); border-radius: 3px; overflow: hidden; }
    .subject-progress-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
    .today-section { margin-bottom: 20px; }
    .task-list { display: flex; flex-direction: column; gap: 8px; }
    .task-item {
      display: flex; align-items: center; gap: 12px;
      background: var(--card); border: 1px solid var(--card-border);
      border-radius: 12px; padding: 14px 16px;
      transition: all 0.2s;
    }
    .task-item.completed { opacity: 0.6; }
    .task-item.completed .task-title { text-decoration: line-through; }
    .task-checkbox {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid var(--text-3); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all 0.2s;
      background: transparent;
    }
    .task-checkbox.checked { background: var(--success); border-color: var(--success); }
    .task-checkbox.checked::after { content: '✓'; color: white; font-size: 13px; font-weight: bold; }
    .task-info { flex: 1; }
    .task-title { font-weight: 600; font-size: 14px; }
    .task-desc { font-size: 12px; color: var(--text-3); }
    .task-duration { font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 4px; }
    .task-action-btn {
      padding: 6px 14px; border-radius: 8px; border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .quick-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    .quick-btn {
      padding: 10px 18px; border-radius: 10px; border: 1px solid var(--card-border);
      background: var(--card); color: var(--text); cursor: pointer;
      font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px;
      transition: all 0.2s;
    }
    .quick-btn:hover { border-color: var(--accent); background: rgba(249,115,22,0.1); }
    .calendar-week {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 20px;
    }
    .cal-day {
      background: var(--card); border: 1px solid var(--card-border);
      border-radius: 12px; padding: 12px 8px; text-align: center;
      cursor: pointer; transition: all 0.2s; min-height: 120px;
    }
    .cal-day:hover { border-color: var(--accent); }
    .cal-day.today { border-color: var(--accent); box-shadow: 0 0 20px rgba(249,115,22,0.2); }
    .cal-day.past { opacity: 0.7; }
    .cal-day-header { font-size: 12px; color: var(--text-3); margin-bottom: 4px; }
    .cal-day-icon { font-size: 20px; margin-bottom: 4px; }
    .cal-day-date { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
    .cal-task { font-size: 10px; padding: 3px 4px; margin: 2px 0; border-radius: 4px; background: var(--bg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cal-task.done { background: rgba(34,197,94,0.2); color: var(--success); }
    .cal-progress { font-size: 11px; color: var(--text-3); margin-top: 4px; }
    .quiz-container { max-width: 700px; margin: 0 auto; }
    .quiz-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--card-border);
    }
    .quiz-progress { font-size: 14px; color: var(--text-2); }
    .quiz-timer { font-size: 14px; color: var(--text-3); }
    .quiz-score { font-size: 14px; color: var(--success); }
    .back-btn {
      padding: 8px 16px; border-radius: 10px; border: 1px solid var(--card-border);
      background: var(--card); color: var(--text); cursor: pointer; font-size: 13px;
      display: inline-flex; align-items: center; gap: 6px; margin-bottom: 16px;
    }
    .question-card {
      background: var(--card); border: 1px solid var(--card-border);
      border-radius: 16px; padding: 28px;
    }
    .kp-tag {
      display: inline-block; padding: 4px 10px; border-radius: 20px;
      font-size: 12px; font-weight: 500; margin-bottom: 14px;
    }
    .kp-tag.math { background: rgba(249,115,22,0.15); color: var(--math); }
    .kp-tag.english { background: rgba(6,182,212,0.15); color: var(--english); }
    .kp-tag.chinese { background: rgba(34,197,94,0.15); color: var(--chinese); }
    .kp-tag.sports { background: rgba(251,191,36,0.15); color: var(--sports); }
    .question-text { font-size: 18px; font-weight: 600; margin-bottom: 24px; line-height: 1.6; }
    .options-grid { display: flex; flex-direction: column; gap: 10px; }
    .option-btn {
      padding: 14px 18px; border-radius: 12px; border: 2px solid var(--card-border);
      background: var(--bg-2); color: var(--text); cursor: pointer;
      font-size: 15px; text-align: left; transition: all 0.2s;
      display: flex; align-items: center; gap: 12px;
    }
    .option-btn:hover:not(:disabled) { border-color: var(--accent); background: rgba(249,115,22,0.08); }
    .option-btn:disabled { cursor: default; }
    .option-btn.correct { border-color: var(--success); background: rgba(34,197,94,0.15); color: var(--success); }
    .option-btn.wrong { border-color: var(--error); background: rgba(239,68,68,0.15); color: var(--error); }
    .option-label {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--card); display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 13px; flex-shrink: 0;
    }
    .feedback-box {
      margin-top: 20px; padding: 16px; border-radius: 12px;
      animation: fadeIn 0.3s ease;
    }
    .feedback-box.correct { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); }
    .feedback-box.wrong { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); }
    .feedback-title { font-weight: 700; margin-bottom: 6px; font-size: 15px; }
    .feedback-explain { font-size: 14px; color: var(--text-2); line-height: 1.7; margin-bottom: 8px; }
    .principle-box {
      margin-top: 10px; padding: 12px; border-radius: 8px;
      background: rgba(139,92,246,0.1); border-left: 3px solid var(--accent-2);
      font-size: 13px; color: var(--text-2); line-height: 1.7;
    }
    .principle-label { color: var(--accent-2); font-weight: 600; }
    .points-earned {
      display: inline-flex; align-items: center; gap: 4px;
      margin-top: 8px; font-weight: 700; color: var(--warning);
    }
    .next-btn {
      margin-top: 16px; padding: 12px 28px; border-radius: 10px; border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .reading-card {
      background: var(--card); border: 1px solid var(--card-border);
      border-radius: 16px; padding: 24px; margin-bottom: 20px;
    }
    .reading-header { margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--card-border); }
    .reading-title { font-size: 20px; font-weight: 700; }
    .reading-author { font-size: 13px; color: var(--text-3); margin-top: 4px; }
    .reading-content {
      font-size: 15px; line-height: 2; color: var(--text-2);
      padding: 16px; background: var(--bg-2); border-radius: 12px;
      white-space: pre-wrap; max-height: 300px; overflow-y: auto;
    }
    .reading-questions-header {
      font-size: 14px; font-weight: 600; color: var(--accent); margin: 16px 0 10px;
      display: flex; align-items: center; gap: 6px;
    }
    .knowledge-grid {
      display: grid; gap: 10px;
    }
    .kp-item {
      background: var(--card); border: 1px solid var(--card-border);
      border-radius: 12px; padding: 14px;
    }
    .kp-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .kp-name { font-weight: 600; font-size: 14px; }
    .kp-level { font-size: 12px; padding: 2px 8px; border-radius: 10px; }
    .kp-bar { height: 6px; background: var(--bg-2); border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
    .kp-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; background: linear-gradient(90deg, var(--error), var(--warning), var(--success)); }
    .kp-meta { font-size: 11px; color: var(--text-3); display: flex; gap: 12px; }
    .review-due {
      background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3);
      color: var(--warning); font-size: 11px; padding: 2px 8px; border-radius: 10px;
    }
    .wrong-list { display: flex; flex-direction: column; gap: 10px; }
    .wrong-item {
      background: var(--card); border: 1px solid var(--card-border);
      border-radius: 12px; padding: 14px;
    }
    .wrong-q { font-size: 14px; margin-bottom: 8px; }
    .wrong-ans { font-size: 12px; color: var(--text-3); }
    .sports-timer {
      text-align: center; padding: 40px;
    }
    .timer-display {
      font-size: 72px; font-weight: 800;
      background: linear-gradient(135deg, var(--sports), var(--warning));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin: 20px 0;
    }
    .exercise-name { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .exercise-icon { font-size: 48px; margin-bottom: 12px; }
    .exercise-desc { font-size: 15px; color: var(--text-2); margin-bottom: 24px; }
    .timer-controls { display: flex; gap: 12px; justify-content: center; }
    .timer-btn {
      padding: 14px 32px; border-radius: 12px; border: none;
      font-size: 16px; font-weight: 600; cursor: pointer;
    }
    .timer-btn.start { background: linear-gradient(135deg, var(--success), #4ade80); color: white; }
    .timer-btn.skip { background: var(--bg-2); color: var(--text); border: 1px solid var(--card-border); }
    .exercise-list { margin-top: 20px; text-align: left; }
    .exercise-step {
      display: flex; align-items: center; gap: 12px;
      padding: 10px; border-radius: 8px;
      font-size: 13px;
    }
    .exercise-step.active { background: rgba(249,115,22,0.1); border: 1px solid var(--accent); }
    .exercise-step.done { opacity: 0.5; }
    .step-num { width: 24px; height: 24px; border-radius: 50%; background: var(--bg-2); display: flex; align-items: center; justify-content: center; font-size: 11px; }
    .achievements-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
    }
    .achievement-card {
      background: var(--card); border: 1px solid var(--card-border);
      border-radius: 14px; padding: 20px; text-align: center;
      opacity: 0.4;
    }
    .achievement-card.unlocked { opacity: 1; border-color: var(--warning); box-shadow: 0 4px 20px rgba(245,158,11,0.15); }
    .achievement-icon { font-size: 40px; margin-bottom: 8px; }
    .achievement-name { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
    .achievement-desc { font-size: 11px; color: var(--text-3); }
    .subject-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .subj-tab {
      padding: 8px 16px; border-radius: 10px; border: 1px solid var(--card-border);
      background: var(--card); color: var(--text-2); cursor: pointer; font-size: 13px;
    }
    .subj-tab.active { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; border-color: transparent; }
    .empty-state { text-align: center; padding: 40px; color: var(--text-3); }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .achievement-toast {
      position: fixed; top: 80px; right: 20px; z-index: 200;
      background: linear-gradient(135deg, var(--warning), var(--accent));
      color: white; padding: 16px 24px; border-radius: 14px;
      box-shadow: 0 10px 40px rgba(245,158,11,0.3);
      animation: slideIn 0.4s ease, fadeOut 0.4s ease 2.6s forwards;
      display: flex; align-items: center; gap: 12px;
    }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes fadeOut { to { opacity: 0; transform: translateX(100%); } }
    .content-stats-bar {
      background: var(--card); border: 1px solid var(--card-border);
      border-radius: 12px; padding: 12px 16px; margin-bottom: 16px;
      display: flex; gap: 20px; flex-wrap: wrap; font-size: 13px;
    }
    .content-stat { display: flex; align-items: center; gap: 6px; color: var(--text-2); }
    .content-stat b { color: var(--text); }
    .subject-select {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px;
    }
    .subject-select-btn {
      padding: 16px; border-radius: 12px; border: 2px solid var(--card-border);
      background: var(--card); color: var(--text); cursor: pointer;
      text-align: center; transition: all 0.2s;
    }
    .subject-select-btn:hover { border-color: var(--accent); transform: translateY(-2px); }
    .subject-select-btn .icon { font-size: 28px; margin-bottom: 4px; }
    .subject-select-btn .name { font-weight: 600; font-size: 14px; }
    @media (max-width: 768px) {
      .calendar-week { grid-template-columns: repeat(7, 1fr); gap: 4px; }
      .cal-day { padding: 6px 4px; min-height: 90px; }
      .cal-task { font-size: 9px; }
      .subjects-grid { grid-template-columns: repeat(2, 1fr); }
      .nav-tabs { gap: 2px; margin-left: 0; }
      .nav-tab { padding: 6px 10px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="logo">
      <div class="logo-icon">🎓</div>
      <span>智学成长乐园</span>
    </div>
    <div class="nav-tabs">
      <button class="nav-tab active" data-page="home">🏠 首页</button>
      <button class="nav-tab" data-page="calendar">📅 学习日历</button>
      <button class="nav-tab" data-page="knowledge">📊 知识图谱</button>
      <button class="nav-tab" data-page="review">🔄 复习中心</button>
      <button class="nav-tab" data-page="wrong">📝 错题本</button>
      <button class="nav-tab" data-page="sports">⚽ 体育锻炼</button>
      <button class="nav-tab" data-page="achievements">🏆 成就</button>
    </div>
    <div class="user-badge">
      <div class="streak-badge">🔥 <span id="streakDays">0</span>天</div>
      <div class="level-badge">Lv.<span id="userLevel">1</span></div>
      <div class="xp-bar-container"><div class="xp-bar" id="xpBar" style="width:0%"></div></div>
    </div>
  </nav>

  <div class="container">
    <div id="page-home" class="page active">
      <div class="welcome-banner">
        <h1 id="welcomeTitle">你好，学习者！</h1>
        <p id="welcomeSubtitle">今天也要加油学习哦 💪</p>
      </div>
      <div class="content-stats-bar" id="contentStatsBar"></div>
      <div class="stats-grid" id="statsGrid"></div>
      <div class="section-title">📋 今日任务</div>
      <div class="task-list" id="todayTasks"></div>
      <div style="height:20px"></div>
      <div class="section-title">📚 学科练习</div>
      <div class="subjects-grid" id="subjectsGrid"></div>
      <div class="section-title">⚡ 快捷入口</div>
      <div class="quick-actions">
        <button class="quick-btn" onclick="showPage('calendar')">📅 查看周计划</button>
        <button class="quick-btn" onclick="showPage('review')">🔄 待复习 (<span id="dueCount2">0</span>)</button>
        <button class="quick-btn" onclick="showPage('wrong')">📝 错题本 (<span id="wrongCount2">0</span>)</button>
      </div>
    </div>

    <div id="page-calendar" class="page">
      <button class="back-btn" onclick="showPage('home')">← 返回首页</button>
      <div class="section-title" id="calendarTitle">📅 本周学习计划</div>
      <div class="calendar-week" id="calendarWeek"></div>
    </div>

    <div id="page-quiz" class="page">
      <button class="back-btn" onclick="exitQuiz()">← 返回</button>
      <div class="quiz-container" id="quizContainer"></div>
    </div>

    <div id="page-knowledge" class="page">
      <button class="back-btn" onclick="showPage('home')">← 返回首页</button>
      <div class="section-title">📊 知识图谱</div>
      <div class="subject-tabs" id="kpSubjectTabs"></div>
      <div class="knowledge-grid" id="knowledgeGrid"></div>
    </div>

    <div id="page-review" class="page">
      <button class="back-btn" onclick="showPage('home')">← 返回首页</button>
      <div class="section-title">🔄 复习中心</div>
      <div class="subject-tabs" id="reviewTabs"></div>
      <div id="reviewContent"></div>
    </div>

    <div id="page-wrong" class="page">
      <button class="back-btn" onclick="showPage('home')">← 返回首页</button>
      <div class="section-title">📝 错题本</div>
      <div class="subject-tabs" id="wrongTabs"></div>
      <div id="wrongContent"></div>
    </div>

    <div id="page-sports" class="page">
      <button class="back-btn" onclick="showPage('home')">← 返回首页</button>
      <div class="card sports-timer" id="sportsContainer"></div>
    </div>

    <div id="page-achievements" class="page">
      <button class="back-btn" onclick="showPage('home')">← 返回首页</button>
      <div class="section-title">🏆 成就殿堂</div>
      <div class="achievements-grid" id="achievementsGrid"></div>
    </div>
  </div>

  <script>
    const SUBJECTS = {
      math: {name:'数学',icon:'📐',color:'#f97316'},
      english: {name:'英语',icon:'🔤',color:'#06b6d4'},
      chinese: {name:'语文',icon:'📚',color:'#22c55e'},
      sports: {name:'体育',icon:'⚽',color:'#fbbf24'}
    };

    let currentUser = null;
    let quizState = null;
    let sportsState = null;
    let timerInterval = null;

    document.querySelectorAll('.nav-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        const page = tab.dataset.page;
        showPage(page);
      });
    });

    document.addEventListener('click', (e) => {
      const btn = e.target.closest('.option-btn');
      if (!btn || btn.disabled) return;
      const idx = parseInt(btn.dataset.optIdx);
      if (isNaN(idx) || !quizState || !quizState.currentQuestion) return;
      const cq = quizState.currentQuestion;
      if (cq.type === 'reading') {
        answerReadingQ(idx);
      } else {
        answerChoiceQ(idx);
      }
    });

    function showPage(page) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      const targetPage = document.getElementById('page-' + page);
      if (targetPage) targetPage.classList.add('active');
      const tab = document.querySelector(`.nav-tab[data-page="${page}"]`);
      if (tab) tab.classList.add('active');
      if (page === 'home') loadDashboard();
      if (page === 'calendar') loadCalendar();
      if (page === 'knowledge') loadKnowledgePage();
      if (page === 'review') loadReviewPage();
      if (page === 'wrong') loadWrongPage();
      if (page === 'sports') loadSportsPage();
      if (page === 'achievements') loadAchievementsPage();
    }

    async function fetchAPI(url, options) {
      const resp = await fetch(url, options);
      return resp.json();
    }

    async function loadDashboard() {
      const data = await fetchAPI('/api/dashboard');
      currentUser = data.user;
      document.getElementById('streakDays').textContent = data.user.streak_days;
      document.getElementById('userLevel').textContent = data.user.level;
      document.getElementById('xpBar').style.width = (data.user.current_xp / data.user.xp_needed * 100) + '%';

      const now = new Date();
      const hour = now.getHours();
      const greeting = hour < 6 ? '夜深了' : hour < 12 ? '早上好' : hour < 14 ? '中午好' : hour < 18 ? '下午好' : '晚上好';
      const weekdayNames = ['日','一','二','三','四','五','六'];
      document.getElementById('welcomeTitle').textContent = greeting + '，' + data.user.name + '！今天是周' + weekdayNames[now.getDay()];
      const dueMsg = data.due_review_count > 0 ? `，还有${data.due_review_count}个知识点待复习` : '';
      document.getElementById('welcomeSubtitle').textContent = `本周已学习${data.week_days_studied}天，累计做题${data.total_questions}道${dueMsg}`;

      const cs = data.content_stats;
      document.getElementById('contentStatsBar').innerHTML = `
        <div class="content-stat">📚 题库总量：<b>${cs.total_questions}</b> 道选择题 + <b>${cs.total_readings}</b> 篇阅读</div>
        <div class="content-stat">✅ 已完成：<b>${data.total_questions}</b> 道</div>
        <div class="content-stat">🎯 正确率：<b>${data.overall_accuracy}%</b></div>
      `;

      document.getElementById('statsGrid').innerHTML = `
        <div class="stat-card"><div class="stat-value">${data.user.streak_days}</div><div class="stat-label">🔥 连续天数</div></div>
        <div class="stat-card"><div class="stat-value">${data.total_questions}</div><div class="stat-label">📝 做题总数</div></div>
        <div class="stat-card"><div class="stat-value">${data.overall_accuracy}%</div><div class="stat-label">🎯 正确率</div></div>
        <div class="stat-card"><div class="stat-value">${data.user.total_points}</div><div class="stat-label">⭐ 总积分</div></div>
        <div class="stat-card"><div class="stat-value">${data.due_review_count}</div><div class="stat-label">🔄 待复习</div></div>
        <div class="stat-card"><div class="stat-value">${data.user.wrong_count}</div><div class="stat-label">❌ 错题数</div></div>
      `;

      document.getElementById('dueCount2').textContent = data.due_review_count;
      document.getElementById('wrongCount2').textContent = data.user.wrong_count;

      const tasksHtml = data.today_tasks.map(task => {
        const subj = SUBJECTS[task.subject] || {icon:'📖',name:''};
        const done = task.completed;
        return `
          <div class="task-item ${done?'completed':''}">
            <button class="task-checkbox ${done?'checked':''}" onclick="toggleTask('${task.id}','${todayStr()}')"></button>
            <div style="font-size:20px">${task.type==='sports'?'⚽':task.type==='review'?'🔄':subj.icon}</div>
            <div class="task-info">
              <div class="task-title">${task.title}</div>
              <div class="task-desc">${task.desc}</div>
            </div>
            <div class="task-duration">⏱️ ${task.duration}分钟</div>
            ${!done && task.type==='study' ? `<button class="task-action-btn" onclick="startSubject('${task.subject}')">开始</button>` : ''}
            ${!done && task.type==='sports' ? `<button class="task-action-btn" onclick="showPage('sports')">开始</button>` : ''}
            ${!done && task.type==='review' ? `<button class="task-action-btn" onclick="showPage('review')">开始</button>` : ''}
          </div>
        `;
      }).join('');
      document.getElementById('todayTasks').innerHTML = tasksHtml || '<div class="empty-state"><div class="empty-icon">🎉</div>今日无任务</div>';

      const subjHtml = Object.entries(data.subject_stats).map(([key, s]) => {
        const accuracy = s.accuracy;
        const mastery = s.avg_mastery;
        return `
          <div class="subject-card ${key}" onclick="startSubject('${key}')">
            <div class="subject-icon">${s.icon}</div>
            <div class="subject-name">${s.name}</div>
            <div class="subject-stats">${s.q_count}道题 · ${s.r_count}篇阅读 · ${s.kp_count}个知识点</div>
            <div class="subject-stats" style="margin-top:4px">正确率${accuracy}%</div>
            <div class="subject-progress">
              <div class="subject-progress-fill" style="width:${mastery}%;background:${s.color}"></div>
            </div>
            <div class="subject-stats" style="text-align:right;margin-top:4px">掌握度${mastery}%</div>
          </div>
        `;
      }).join('');
      document.getElementById('subjectsGrid').innerHTML = subjHtml;
    }

    function todayStr() { return new Date().toISOString().slice(0,10); }

    async function toggleTask(taskId, dateStr) {
      await fetchAPI('/api/task/complete', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({task_id: taskId, date: dateStr, completed: true})
      });
      loadDashboard();
    }

    async function loadCalendar() {
      const data = await fetchAPI('/api/calendar');
      const week = data.week;
      const dateRange = `${week[0].date.slice(5)} - ${week[6].date.slice(5)}`;
      document.getElementById('calendarTitle').textContent = `📅 本周学习计划 · ${dateRange}`;
      document.getElementById('calendarWeek').innerHTML = week.map(day => {
        const tasks = day.tasks.map(t => {
          const subj = SUBJECTS[t.subject] || {icon:'📖'};
          const icon = t.type==='sports'?'⚽':t.type==='review'?'🔄':subj.icon;
          return `<div class="cal-task ${t.completed?'done':''}">${icon} ${t.title}</div>`;
        }).join('');
        return `
          <div class="cal-day ${day.is_today?'today':''} ${day.is_past?'past':''}">
            <div class="cal-day-header">${day.weekday_name}</div>
            <div class="cal-day-icon">${day.weekday_icon}</div>
            <div class="cal-day-date">${day.date.slice(8)}</div>
            ${tasks}
            <div class="cal-progress">${day.completed_tasks}/${day.total_tasks} 完成</div>
          </div>
        `;
      }).join('');
    }

    async function startSubject(subject) {
      const data = await fetchAPI(`/api/subjects/${subject}/recommend?count=5`);
      quizState = {
        subject: subject,
        subjectInfo: data.subject,
        items: data.items,
        currentItemIndex: 0,
        currentSubIndex: 0,
        correctCount: 0,
        totalCount: data.total_questions,
        answered: 0,
        startTime: Date.now(),
        questionStart: Date.now()
      };
      showPage('quiz');
      renderQuizItem();
    }

    function renderQuizItem() {
      const qs = quizState;
      const item = qs.items[qs.currentItemIndex];
      const container = document.getElementById('quizContainer');

      if (!item) {
        const timeSpent = Math.round((Date.now() - qs.startTime) / 1000);
        const acc = Math.round(qs.correctCount / qs.totalCount * 100);
        container.innerHTML = `
          <div class="card" style="text-align:center;padding:40px">
            <div style="font-size:64px;margin-bottom:16px">🎉</div>
            <h2 style="margin-bottom:12px">练习完成！</h2>
            <div style="font-size:18px;color:var(--text-2);margin-bottom:24px">
              ${qs.subjectInfo.icon} ${qs.subjectInfo.name}练习结束<br>
              答对 ${qs.correctCount}/${qs.totalCount} 题，正确率 ${acc}%<br>
              用时 ${timeSpent} 秒
            </div>
            <button class="next-btn" onclick="showPage('home')">返回首页</button>
          </div>
        `;
        return;
      }

      if (item.item_type === 'reading') {
        renderReadingItem(item.reading);
      } else {
        renderQuestionItem(item.question, false);
      }
    }

    function renderReadingItem(reading) {
      const qs = quizState;
      const container = document.getElementById('quizContainer');
      const currentQIdx = qs.currentSubIndex;
      const totalRQ = reading.questions.length;

      if (currentQIdx >= totalRQ) {
        qs.currentItemIndex++;
        qs.currentSubIndex = 0;
        renderQuizItem();
        return;
      }

      const q = reading.questions[currentQIdx];
      const timeSpent = Math.round((Date.now() - qs.startTime) / 1000);
      const cleanQOpts = q.options.map(o => cleanOpt(o));

      qs.currentQuestion = {
        type: 'reading',
        idx: currentQIdx,
        options: cleanQOpts,
        ans: q.ans,
        explain: q.explain || '仔细阅读文章，找到相关内容分析作答。',
        q: q.q,
        reading: reading
      };

      container.innerHTML = `
        <div class="quiz-header">
          <div class="quiz-progress">${qs.subjectInfo.icon} ${qs.subjectInfo.name} · 阅读理解 ${currentQIdx+1}/${totalRQ} · 总进度 ${qs.answered+1}/${qs.totalCount}</div>
          <div class="quiz-timer">⏱️ ${timeSpent}s</div>
          <div class="quiz-score">✅ ${qs.correctCount}</div>
        </div>
        <div class="reading-card">
          <div class="reading-header">
            <div class="reading-title">📖 ${reading.title}</div>
            ${reading.author ? `<div class="reading-author">—— ${reading.author}</div>` : ''}
          </div>
          <div class="reading-content">${reading.content}</div>
        </div>
        <div class="question-card">
          <span class="kp-tag ${qs.subject}" style="margin-bottom:10px">📖 阅读理解</span>
          <div class="question-text">${currentQIdx+1}. ${q.q}</div>
          <div class="options-grid">
            ${cleanQOpts.map((opt, i) => `
              <button class="option-btn" data-opt-idx="${i}">
                <span class="option-label">${String.fromCharCode(65+i)}</span>
                <span>${opt}</span>
              </button>
            `).join('')}
          </div>
          <div id="readingFeedback"></div>
        </div>
      `;
      qs.questionStart = Date.now();
    }

    function cleanOpt(text) {
      return String(text).replace(/^[A-D][\.、)\s]\s*/, '').trim();
    }

    function renderQuestionItem(q, isReadingSub) {
      const qs = quizState;
      const container = document.getElementById('quizContainer');
      const timeSpent = Math.round((Date.now() - qs.startTime) / 1000);
      const kpTagClass = qs.subject;
      const cleanOptions = q.options.map(o => cleanOpt(o));

      qs.currentQuestion = {
        type: 'choice',
        options: cleanOptions,
        ans: q.ans,
        explain: q.explain || '',
        kp: q.kp,
        q: q.q
      };

      container.innerHTML = `
        <div class="quiz-header">
          <div class="quiz-progress">${qs.subjectInfo.icon} ${qs.subjectInfo.name} · 进度 ${qs.answered+1}/${qs.totalCount}</div>
          <div class="quiz-timer">⏱️ ${timeSpent}s</div>
          <div class="quiz-score">✅ ${qs.correctCount}</div>
        </div>
        <div class="question-card">
          <span class="kp-tag ${kpTagClass}">${q.kp ? q.kp.toUpperCase() : ''}</span>
          <div class="question-text">${q.q}</div>
          <div class="options-grid">
            ${cleanOptions.map((opt, i) => `
              <button class="option-btn" data-opt-idx="${i}">
                <span class="option-label">${String.fromCharCode(65+i)}</span>
                <span>${opt}</span>
              </button>
            `).join('')}
          </div>
          <div id="questionFeedback"></div>
        </div>
      `;
      qs.questionStart = Date.now();
    }

    async function answerChoiceQ(selected) {
      const qs = quizState;
      const cq = qs.currentQuestion;
      const timeTaken = Math.round((Date.now() - qs.questionStart) / 1000);
      const correct = selected === cq.ans;
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(b => b.disabled = true);
      buttons[cq.ans].classList.add('correct');
      if (!correct) buttons[selected].classList.add('wrong');

      const result = await fetchAPI(`/api/subjects/${qs.subject}/answer`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          kp_id: cq.kp,
          correct: correct,
          time_taken: timeTaken,
          question: cq.q,
          options: cq.options,
          ans: cq.ans,
          explain: cq.explain,
          is_reading: false
        })
      });

      if (result.achievements && result.achievements.length > 0) {
        result.achievements.forEach(a => showAchievementToast(a));
      }

      document.getElementById('userLevel').textContent = result.level;
      document.getElementById('xpBar').style.width = (result.current_xp / result.xp_needed * 100) + '%';

      qs.answered++;
      if (correct) qs.correctCount++;

      const fbClass = correct ? 'correct' : 'wrong';
      const fbIcon = correct ? '✅' : '❌';
      const fbTitle = correct ? '回答正确！' : '回答错误';
      document.getElementById('questionFeedback').innerHTML = `
        <div class="feedback-box ${fbClass}">
          <div class="feedback-title">${fbIcon} ${fbTitle} ${result.points_earned > 0 ? `<span class="points-earned">+${result.points_earned}积分</span>` : ''}</div>
          <div class="feedback-explain">${cq.explain}</div>
          ${result.principle ? `<div class="principle-box"><span class="principle-label">💡 知其然知其所以然：</span>${result.principle}</div>` : ''}
          <button class="next-btn" onclick="nextQuestion()">${qs.answered >= qs.totalCount ? '查看结果' : '下一题 →'}</button>
        </div>
      `;
    }

    async function answerReadingQ(selected) {
      const qs = quizState;
      const cq = qs.currentQuestion;
      const reading = cq.reading;
      const timeTaken = Math.round((Date.now() - qs.questionStart) / 1000);
      const correct = selected === cq.ans;
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(b => b.disabled = true);
      buttons[cq.ans].classList.add('correct');
      if (!correct) buttons[selected].classList.add('wrong');

      const kpId = qs.subject === 'english' ? 'e9' : 'c9';
      const result = await fetchAPI(`/api/subjects/${qs.subject}/answer`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          kp_id: kpId,
          correct: correct,
          time_taken: timeTaken,
          question: cq.q,
          options: cq.options,
          ans: cq.ans,
          explain: cq.explain,
          is_reading: true
        })
      });

      if (result.achievements && result.achievements.length > 0) {
        result.achievements.forEach(a => showAchievementToast(a));
      }

      document.getElementById('userLevel').textContent = result.level;
      document.getElementById('xpBar').style.width = (result.current_xp / result.xp_needed * 100) + '%';

      qs.answered++;
      if (correct) qs.correctCount++;

      const fbClass = correct ? 'correct' : 'wrong';
      const fbIcon = correct ? '✅' : '❌';
      const fbTitle = correct ? '回答正确！' : '回答错误';
      const isLastRQ = qs.currentSubIndex + 1 >= reading.questions.length;
      document.getElementById('readingFeedback').innerHTML = `
        <div class="feedback-box ${fbClass}">
          <div class="feedback-title">${fbIcon} ${fbTitle} <span class="points-earned">+${result.points_earned}积分</span></div>
          <div class="feedback-explain">${cq.explain}</div>
          <button class="next-btn" onclick="nextReadingQuestion()">${isLastRQ ? (qs.answered >= qs.totalCount ? '查看结果' : '继续 →') : '下一题 →'}</button>
        </div>
      `;
    }

    function nextQuestion() {
      quizState.currentItemIndex++;
      quizState.currentSubIndex = 0;
      renderQuizItem();
    }

    function nextReadingQuestion() {
      quizState.currentSubIndex++;
      renderReadingItem(quizState.items[quizState.currentItemIndex].reading);
    }

    function exitQuiz() {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      showPage('home');
    }

    function showAchievementToast(a) {
      const toast = document.createElement('div');
      toast.className = 'achievement-toast';
      toast.innerHTML = `<span style="font-size:28px">${a.icon}</span><div><div style="font-weight:700">🏆 成就解锁！</div><div>${a.name}</div></div>`;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3200);
    }

    async function loadKnowledgePage() {
      const tabs = Object.entries(SUBJECTS).map(([k,s]) =>
        `<button class="subj-tab ${k==='math'?'active':''}" onclick="showKnowledge('${k}')">${s.icon} ${s.name}</button>`
      ).join('');
      document.getElementById('kpSubjectTabs').innerHTML = tabs;
      showKnowledge('math');
    }

    async function showKnowledge(subject) {
      document.querySelectorAll('#kpSubjectTabs .subj-tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      const data = await fetchAPI(`/api/knowledge/${subject}`);
      document.getElementById('knowledgeGrid').innerHTML = data.knowledge_points.map(kp => {
        const masteryPct = Math.round(kp.mastery * 100);
        const levelColors = ['#ef4444','#f59e0b','#22c55e'];
        return `
          <div class="kp-item">
            <div class="kp-header">
              <span class="kp-name">${kp.name}</span>
              <span class="kp-level" style="background:${levelColors[kp.level-1]||'#888'}22;color:${levelColors[kp.level-1]||'#888'}">Lv.${kp.level}</span>
            </div>
            <div class="kp-bar"><div class="kp-bar-fill" style="width:${masteryPct}%"></div></div>
            <div class="kp-meta">
              <span>掌握度 ${masteryPct}%</span>
              <span>✅ ${kp.correct}</span>
              <span>❌ ${kp.wrong}</span>
              <span>🔄 ${kp.review_count}次复习</span>
              ${kp.needs_review ? '<span class="review-due">待复习</span>' : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    async function loadReviewPage() {
      const tabs = Object.entries(SUBJECTS).map(([k,s]) =>
        `<button class="subj-tab ${k==='math'?'active':''}" onclick="showReview('${k}')">${s.icon} ${s.name}</button>`
      ).join('');
      document.getElementById('reviewTabs').innerHTML = tabs;
      showReview('math');
    }

    async function showReview(subject) {
      document.querySelectorAll('#reviewTabs .subj-tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      const data = await fetchAPI('/api/review/due');
      const due = data.due_reviews[subject] || [];
      const content = document.getElementById('reviewContent');
      if (due.length === 0) {
        content.innerHTML = '<div class="empty-state"><div class="empty-icon">🎉</div>太棒了！暂无需要复习的知识点</div>';
      } else {
        content.innerHTML = `
          <div style="margin-bottom:12px;color:var(--text-2);font-size:14px">共 ${due.length} 个知识点需要复习：</div>
          <div class="knowledge-grid">
            ${due.map(kp => `
              <div class="kp-item">
                <div class="kp-header"><span class="kp-name">${kp.is_wrong?'❌ ':''}${kp.name}</span>
                <span style="font-size:12px;color:var(--text-3)">掌握度${Math.round(kp.mastery*100)}%</span></div>
                <div style="font-size:13px;color:var(--text-3);margin-top:6px">${kp.desc||''}</div>
                <button class="quick-btn" style="margin-top:8px" onclick="startSubject('${subject}')">开始复习</button>
              </div>
            `).join('')}
          </div>
        `;
      }
    }

    async function loadWrongPage() {
      const tabs = Object.entries(SUBJECTS).map(([k,s]) =>
        `<button class="subj-tab ${k==='math'?'active':''}" onclick="showWrong('${k}')">${s.icon} ${s.name}</button>`
      ).join('');
      document.getElementById('wrongTabs').innerHTML = tabs;
      showWrong('math');
    }

    async function showWrong(subject) {
      document.querySelectorAll('#wrongTabs .subj-tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      const data = await fetchAPI('/api/wrong-questions');
      const wrongs = data.wrong_questions[subject] || [];
      const content = document.getElementById('wrongContent');
      if (wrongs.length === 0) {
        content.innerHTML = '<div class="empty-state"><div class="empty-icon">✨</div>还没有错题，继续保持！</div>';
      } else {
        content.innerHTML = `<div class="wrong-list">${wrongs.map(w => `
          <div class="wrong-item">
            <div class="wrong-q">${w.q}</div>
            <div class="wrong-ans">正确答案：${String.fromCharCode(65+w.ans)}. ${w.options[w.ans]}</div>
            <div class="wrong-ans" style="margin-top:4px;color:var(--text-2)">${w.explain}</div>
            <div class="wrong-ans" style="margin-top:4px">错误 ${w.wrong_count||1} 次</div>
          </div>
        `).join('')}</div>`;
      }
    }

    async function loadSportsPage() {
      const data = await fetchAPI('/api/sports/exercises');
      sportsState = { exercises: data.exercises, currentIdx: 0, timeLeft: data.exercises[0].duration, running: false };
      renderSports();
    }

    function renderSports() {
      const s = sportsState;
      const ex = s.exercises[s.currentIdx];
      const stepsHtml = s.exercises.map((e, i) => `
        <div class="exercise-step ${i===s.currentIdx?'active':''} ${i<s.currentIdx?'done':''}">
          <div class="step-num">${i<s.currentIdx?'✓':i+1}</div>
          <span>${e.icon} ${e.name} (${e.duration}秒)</span>
        </div>
      `).join('');
      document.getElementById('sportsContainer').innerHTML = `
        <div class="exercise-icon">${ex.icon}</div>
        <div class="exercise-name">${ex.name}</div>
        <div class="exercise-desc">${ex.desc}${ex.reps?' · '+ex.reps:''}</div>
        <div class="timer-display">${s.timeLeft}</div>
        <div class="timer-controls">
          <button class="timer-btn start" onclick="toggleSportsTimer()">${s.running?'暂停':'开始'}</button>
          <button class="timer-btn skip" onclick="nextExercise()">跳过 →</button>
        </div>
        <div class="exercise-list">${stepsHtml}</div>
      `;
    }

    function toggleSportsTimer() {
      sportsState.running = !sportsState.running;
      if (sportsState.running) {
        timerInterval = setInterval(() => {
          sportsState.timeLeft--;
          if (sportsState.timeLeft <= 0) { nextExercise(); return; }
          const display = document.querySelector('.timer-display');
          if (display) display.textContent = sportsState.timeLeft;
        }, 1000);
      } else {
        clearInterval(timerInterval);
      }
      renderSports();
    }

    function nextExercise() {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      sportsState.currentIdx++;
      if (sportsState.currentIdx >= sportsState.exercises.length) {
        document.getElementById('sportsContainer').innerHTML = `
          <div style="font-size:64px;margin-bottom:16px">🏆</div>
          <h2>锻炼完成！</h2>
          <p style="color:var(--text-2);margin:16px 0">太棒了！今天的体育锻炼完成了，记得补充水分哦 💧</p>
          <button class="timer-btn start" onclick="loadSportsPage()">再来一次</button>
          <button class="timer-btn skip" style="margin-left:10px" onclick="showPage('home')">返回首页</button>
        `;
        return;
      }
      sportsState.timeLeft = sportsState.exercises[sportsState.currentIdx].duration;
      sportsState.running = false;
      renderSports();
    }

    async function loadAchievementsPage() {
      await loadDashboard();
      const unlocked = new Set(currentUser.achievements.map(a => a.id));
      const allAchievements = [
        {id:'first_step',name:'迈出第一步',desc:'完成第一次学习',icon:'🎯'},
        {id:'streak_3',name:'三天打鱼',desc:'连续学习3天',icon:'🔥'},
        {id:'streak_7',name:'一周坚持',desc:'连续学习7天',icon:'💪'},
        {id:'streak_30',name:'月度学霸',desc:'连续学习30天',icon:'🏅'},
        {id:'points_100',name:'知识猎手',desc:'总积分达到100',icon:'🏆'},
        {id:'points_500',name:'学霸初成',desc:'总积分达到500',icon:'👑'},
        {id:'points_2000',name:'学神附体',desc:'总积分达到2000',icon:'🚀'},
        {id:'all_subjects',name:'全面发展',desc:'四个学科都学习过',icon:'🌟'},
        {id:'marathon',name:'马拉松',desc:'累计学习10次',icon:'🏃'},
        {id:'marathon_50',name:'学习达人',desc:'累计学习50次',icon:'🎖️'},
        {id:'daily_complete',name:'今日达标',desc:'完成今日所有任务',icon:'✅'},
        {id:'wrong_master',name:'知错能改',desc:'错题本中收录题目',icon:'📝'}
      ];
      document.getElementById('achievementsGrid').innerHTML = allAchievements.map(a => `
        <div class="achievement-card ${unlocked.has(a.id)?'unlocked':''}">
          <div class="achievement-icon">${a.icon}</div>
          <div class="achievement-name">${a.name}</div>
          <div class="achievement-desc">${a.desc}</div>
        </div>
      `).join('');
    }

    loadDashboard();
  </script>
</body>
</html>
