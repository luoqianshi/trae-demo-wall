  '</div>';
  qs.questionStart = Date.now();
}

function answerChoiceQ(idx) {
  const qs = quizState;
  if (!qs || !qs.currentQuestion) return;
  const cq = qs.currentQuestion;
  const correct = idx === cq.ans;
  const buttons = document.querySelectorAll('.option-btn');
  buttons.forEach(function(b) { b.disabled = true; });
  buttons[idx].classList.add(correct ? 'correct' : 'wrong');
  if (!correct && buttons[cq.ans]) buttons[cq.ans].classList.add('correct');
  
  const kpId = cq.kp;
  if (kpId && user.subject_mastery[cq.subject] && user.subject_mastery[cq.subject][kpId]) {
    const m = user.subject_mastery[cq.subject][kpId];
    if (correct) {
      m.correct_count = (m.correct_count || 0) + 1;
    } else {
      m.wrong_count = (m.wrong_count || 0) + 1;
      if (!user.wrong_questions) user.wrong_questions = [];
      const exists = user.wrong_questions.some(function(w) { return w.q === cq.q && w.subject === cq.subject; });
      if (!exists) {
        user.wrong_questions.push({
          subject: cq.subject, kp: kpId, q: cq.q,
          your_ans: idx, correct_ans: cq.ans,
          options: cq.options, explain: cq.explain,
          added_at: new Date().toISOString()
        });
      }
    }
    spacedRepetitionUpdate(m, correct);
  }
  
  const points = correct ? 10 : 3;
  user.xp = (user.xp || 0) + points;
  user.total_points = (user.total_points || 0) + points;
  qs.answered++;
  if (correct) qs.correctCount++;
  
  const feedback = document.getElementById('choiceFeedback');
  let fbHtml = '<div class="feedback-box ' + (correct ? 'correct' : 'wrong') + '">' +
    '<div class="feedback-title">' + (correct ? '✅ 回答正确！+' + points + '积分' : '❌ 回答错误') + '</div>';
  if (cq.explain) fbHtml += '<div class="feedback-explain">' + cq.explain + '</div>';
  if (cq.principle) fbHtml += '<div class="principle-box"><span class="principle-label">💡 知识点：</span>' + cq.principle + '</div>';
  fbHtml += '<div class="points-earned">⭐ +' + points + ' 积分</div></div>';
  fbHtml += '<button class="next-btn" id="nextQBtn">下一题 →</button>';
  feedback.innerHTML = fbHtml;
  
  const newAchievements = checkAchievements();
  saveUser();
  updateUserBadge();
  if (newAchievements.length > 0) newAchievements.forEach(function(a) { showAchievementToast(a); });
  
  document.getElementById('nextQBtn').addEventListener('click', function() {
    qs.currentItemIndex++;
    qs.currentSubIndex = 0;
    renderQuizItem();
  });
}

function loadKnowledgePage() {
  const tabs = document.getElementById('kpSubjectTabs');
  let tabsHtml = '';
  for (const [key, s] of Object.entries(SUBJECTS)) {
    tabsHtml += '<button class="subj-tab ' + (key === kpSubjectTab ? 'active' : '') + '" data-kp-tab="' + key + '">' + s.icon + ' ' + s.name + '</button>';
  }
  tabs.innerHTML = tabsHtml;
  
  const kps = KNOWLEDGE_MAP[kpSubjectTab] || [];
  const mastery = user.subject_mastery[kpSubjectTab] || {};
  const now = new Date();
  let kpHtml = '';
  
  for (const kp of kps) {
    const m = mastery[kp.id] || { mastery: 0, correct_count: 0, wrong_count: 0 };
    const pct = Math.round((m.mastery || 0) * 100);
    const isDue = m.next_review && new Date(m.next_review) <= now && (m.correct_count + m.wrong_count) > 0;
    kpHtml += '<div class="kp-item">' +
      '<div class="kp-header">' +
        '<div class="kp-name">' + kp.name + '</div>' +
        '<div class="kp-level" style="background:' + (pct >= 70 ? 'rgba(34,197,94,0.2);color:#22c55e' : pct >= 40 ? 'rgba(245,158,11,0.2);color:#f59e0b' : 'rgba(239,68,68,0.2);color:#ef4444') + '">' + pct + '%</div>' +
      '</div>' +
      '<div class="kp-bar"><div class="kp-bar-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="kp-meta">' +
        '<span>✅ ' + (m.correct_count || 0) + '</span>' +
        '<span>❌ ' + (m.wrong_count || 0) + '</span>' +
        '<span>🔄 复习' + (m.review_count || 0) + '次</span>' +
        (isDue ? '<span class="review-due">待复习</span>' : '') +
      '</div>' +
    '</div>';
  }
  document.getElementById('knowledgeGrid').innerHTML = kpHtml || '<div class="empty-state"><div class="empty-icon">📚</div>暂无知识点数据</div>';
}

function loadReviewPage() {
  const tabs = document.getElementById('reviewSubjectTabs');
  let tabsHtml = '';
  for (const [key, s] of Object.entries(SUBJECTS)) {
    tabsHtml += '<button class="subj-tab ' + (key === reviewSubjectFilter ? 'active' : '') + '" data-review-tab="' + key + '">' + s.icon + ' ' + s.name + '</button>';
  }
  tabs.innerHTML = tabsHtml;
  
  const kps = KNOWLEDGE_MAP[reviewSubjectFilter] || [];
  const mastery = user.subject_mastery[reviewSubjectFilter] || {};
  const now = new Date();
  const dueKps = [];
  
  for (const kp of kps) {
    const m = mastery[kp.id];
    if (m && m.next_review && new Date(m.next_review) <= now && (m.correct_count + m.wrong_count) > 0) {
      dueKps.push({ kp: kp, m: m });
    }
  }
  
  let html = '';
  if (dueKps.length > 0) {
    html += '<div style="margin-bottom:16px"><button class="next-btn" data-action="start-subject" data-subject="' + reviewSubjectFilter + '">开始复习 ' + SUBJECTS[reviewSubjectFilter].name + ' →</button></div>';
    for (const item of dueKps) {
      const pct = Math.round((item.m.mastery || 0) * 100);
      html += '<div class="kp-item">' +
        '<div class="kp-header"><div class="kp-name">' + item.kp.name + '</div><span class="review-due">🔄 待复习</span></div>' +
        '<div class="kp-bar"><div class="kp-bar-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="kp-meta"><span>掌握度 ' + pct + '%</span><span>下次间隔 ' + (item.m.interval_days || 1) + '天</span></div>' +
      '</div>';
    }
  } else {
    html = '<div class="empty-state"><div class="empty-icon">🎉</div>太棒了！' + SUBJECTS[reviewSubjectFilter].name + '暂时没有需要复习的知识点</div>';
  }
  document.getElementById('reviewList').innerHTML = html;
}

function loadWrongPage() {
  const tabs = document.getElementById('wrongSubjectTabs');
  let tabsHtml = '';
  for (const [key, s] of Object.entries(SUBJECTS)) {
    tabsHtml += '<button class="subj-tab ' + (key === wrongSubjectFilter ? 'active' : '') + '" data-wrong-tab="' + key + '">' + s.icon + ' ' + s.name + '</button>';
  }
  tabs.innerHTML = tabsHtml;
  
  const wrongs = (user.wrong_questions || []).filter(function(w) { return w.subject === wrongSubjectFilter; });
  let html = '';
  
  if (wrongs.length > 0) {
    html += '<div style="margin-bottom:16px"><button class="next-btn" data-action="start-subject" data-subject="' + wrongSubjectFilter + '">开始练习攻克错题 →</button></div>';
    for (const w of wrongs) {
      html += '<div class="wrong-item">' +
        '<div class="wrong-q">' + w.q + '</div>' +
        '<div class="wrong-ans">你的答案: ' + String.fromCharCode(65 + w.your_ans) + ' | 正确答案: ' + String.fromCharCode(65 + w.correct_ans) + '</div>' +
        (w.explain ? '<div class="wrong-ans" style="margin-top:4px">' + w.explain + '</div>' : '') +
      '</div>';
    }
  } else {
    html = '<div class="empty-state"><div class="empty-icon">🎉</div>' + SUBJECTS[wrongSubjectFilter].name + '暂无错题，继续保持！</div>';
  }
  document.getElementById('wrongList').innerHTML = html;
}

function loadSportsPage() {
  if (!sportsState) {
    sportsState = {
      exercises: SPORTS_EXERCISES,
      currentIdx: 0,
      timeLeft: SPORTS_EXERCISES[0].duration,
      running: false
    };
  }
  renderSports();
}

function renderSports() {
  const s = sportsState;
  const container = document.getElementById('sportsContainer');
  const ex = s.exercises[s.currentIdx];
  
  let stepsHtml = '';
  for (let i = 0; i < s.exercises.length; i++) {
    const e = s.exercises[i];
    const cls = i === s.currentIdx ? 'active' : (i < s.currentIdx ? 'done' : '');
    stepsHtml += '<div class="exercise-step ' + cls + '">' +
      '<div class="step-num">' + (i+1) + '</div>' +
      '<span>' + e.icon + ' ' + e.name + '</span>' +
      '<span style="margin-left:auto;color:var(--text-3)">' + e.duration + 's</span>' +
    '</div>';
  }
  
  container.innerHTML = '<div class="exercise-icon">' + ex.icon + '</div>' +
    '<div class="exercise-name">' + ex.name + '</div>' +
    '<div class="exercise-desc">' + ex.desc + (ex.reps ? ' · ' + ex.reps : '') + '</div>' +
    '<div class="timer-display">' + s.timeLeft + '</div>' +
    '<div class="timer-controls">' +
      '<button class="timer-btn start" id="timerStartBtn">' + (s.running ? '暂停' : '开始') + '</button>' +
      '<button class="timer-btn skip" id="timerSkipBtn">跳过 →</button>' +
    '</div>' +
    '<div class="exercise-list">' + stepsHtml + '</div>';
  
  document.getElementById('timerStartBtn').addEventListener('click', toggleSportsTimer);
  document.getElementById('timerSkipBtn').addEventListener('click', nextExercise);
}

function toggleSportsTimer() {
  sportsState.running = !sportsState.running;
  if (sportsState.running) {
    timerInterval = setInterval(function() {
      sportsState.timeLeft--;
      if (sportsState.timeLeft <= 0) { nextExercise(); return; }
      const display = document.querySelector('.timer-display');
      if (display) display.textContent = sportsState.timeLeft;
    }, 1000);
  } else {
    clearInterval(timerInterval);
  }
  renderSports();
}

function nextExercise() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  sportsState.currentIdx++;
  if (sportsState.currentIdx >= sportsState.exercises.length) {
    document.getElementById('sportsContainer').innerHTML =
      '<div style="font-size:64px;margin-bottom:16px">🏆</div>' +
      '<h2>锻炼完成！</h2>' +
      '<p style="color:var(--text-2);margin:16px 0">太棒了！今天的体育锻炼完成了，记得补充水分哦 💧</p>' +
      '<button class="timer-btn start" id="sportsRestartBtn">再来一次</button>' +
      '<button class="timer-btn skip" style="margin-left:10px" id="sportsHomeBtn">返回首页</button>';
    document.getElementById('sportsRestartBtn').addEventListener('click', function() {
      sportsState = null;
      loadSportsPage();
    });
    document.getElementById('sportsHomeBtn').addEventListener('click', function() {
      user.xp = (user.xp || 0) + 15;
      user.total_points = (user.total_points || 0) + 15;
      const today = todayStr();
      if (user.last_study_date !== today) {
        user.streak_days = (user.streak_days || 0) + 1;
        user.last_study_date = today;
      }
      const newAchievements = checkAchievements();
      saveUser();
      updateUserBadge();
      if (newAchievements.length > 0) newAchievements.forEach(function(a) { showAchievementToast(a); });
      showPage('home');
    });
    return;
  }
  sportsState.timeLeft = sportsState.exercises[sportsState.currentIdx].duration;
  sportsState.running = false;
  renderSports();
}

function loadAchievementsPage() {
  loadDashboard();
  const unlocked = new Set((user.achievements || []).map(function(a) { return a.id; }));
  let achHtml = '';
  for (const a of ALL_ACHIEVEMENTS) {
    achHtml += '<div class="achievement-card ' + (unlocked.has(a.id) ? 'unlocked' : '') + '">' +
      '<div class="achievement-icon">' + a.icon + '</div>' +
      '<div class="achievement-name">' + a.name + '</div>' +
      '<div class="achievement-desc">' + a.desc + '</div>' +
    '</div>';
  }
  document.getElementById('achievementsGrid').innerHTML = achHtml;
}

document.querySelectorAll('.nav-tab').forEach(function(tab) {
  tab.addEventListener('click', function() {
    const page = tab.dataset.page;
    if (page === 'quiz') return;
    showPage(page);
  });
});

document.addEventListener('click', function(e) {
  const optBtn = e.target.closest('.option-btn');
  if (optBtn && !optBtn.disabled && quizState && quizState.currentQuestion) {
    const idx = parseInt(optBtn.dataset.optIdx);
    if (!isNaN(idx)) {
      if (quizState.currentQuestion.type === 'reading') {
        answerReadingQ(idx);
      } else {
        answerChoiceQ(idx);
      }
    }
    return;
  }
  
  const actionEl = e.target.closest('[data-action]');
  if (actionEl) {
    const action = actionEl.dataset.action;
    if (action === 'goto-page') {
      showPage(actionEl.dataset.page);
    } else if (action === 'start-subject') {
      startSubject(actionEl.dataset.subject);
    } else if (action === 'toggle-task') {
      toggleTask(actionEl.dataset.taskId, actionEl.dataset.date);
    }
    return;
  }
  
  const kpTab = e.target.closest('[data-kp-tab]');
  if (kpTab) {
    kpSubjectTab = kpTab.dataset.kpTab;
    loadKnowledgePage();
    return;
  }
  
  const reviewTab = e.target.closest('[data-review-tab]');
  if (reviewTab) {
    reviewSubjectFilter = reviewTab.dataset.reviewTab;
    loadReviewPage();
    return;
  }
  
  const wrongTab = e.target.closest('[data-wrong-tab]');
  if (wrongTab) {
    wrongSubjectFilter = wrongTab.dataset.wrongTab;
    loadWrongPage();
    return;
  }
});

document.getElementById('resetBtn').addEventListener('click', resetUser);

loadUser();
showPage('home');
  </script>
