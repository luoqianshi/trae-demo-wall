<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智学成长乐园 - 自适应学习系统</title>
  <style>:root {
  --bg: #0f172a;
  --bg-2: #1e293b;
  --card: rgba(30, 41, 59, 0.8);
  --card-border: rgba(148, 163, 184, 0.15);
  --text: #f1f5f9;
  --text-2: #cbd5e1;
  --text-3: #94a3b8;
  --accent: #f97316;
  --accent-2: #8b5cf6;
  --math: #f97316;
  --english: #06b6d4;
  --chinese: #22c55e;
  --sports: #fbbf24;
  --success: #22c55e;
  --error: #ef4444;
  --warning: #f59e0b;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
  background-attachment: fixed;
  color: var(--text);
  min-height: 100vh;
  line-height: 1.7;
}
.nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(15,23,42,0.92);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--card-border);
  padding: 12px 24px;
  display: flex; align-items: center; gap: 12px;
  flex-wrap: wrap;
}
.logo {
  display: flex; align-items: center; gap: 10px;
  font-size: 18px; font-weight: 700;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.logo-icon {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; -webkit-text-fill-color: white;
}
.nav-tabs { display: flex; gap: 4px; margin-left: 16px; flex-wrap: wrap; }
.nav-tab {
  padding: 7px 14px; border-radius: 9px; border: none;
  background: transparent; color: var(--text-2); cursor: pointer;
  font-size: 13px; font-weight: 500; transition: all 0.2s;
  display: flex; align-items: center; gap: 5px;
}
.nav-tab:hover { background: var(--card); color: var(--text); }
.nav-tab.active {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: white;
}
.user-badge { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; }
.level-badge {
  background: linear-gradient(135deg, var(--accent), var(--warning));
  color: white; padding: 3px 10px; border-radius: 20px; font-weight: 700;
}
.xp-bar-container { width: 80px; height: 6px; background: var(--bg-2); border-radius: 3px; overflow: hidden; }
.xp-bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--warning)); border-radius: 3px; transition: width 0.5s; }
.streak-badge { display: flex; align-items: center; gap: 3px; color: var(--warning); }
.reset-btn {
  padding: 6px 12px; border-radius: 8px; border: 1px solid var(--error);
  background: transparent; color: var(--error); cursor: pointer; font-size: 12px;
}
.reset-btn:hover { background: rgba(239,68,68,0.1); }
.container { max-width: 1100px; margin: 0 auto; padding: 20px; }
.page { display: none; animation: fadeIn 0.3s ease; }
.page.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  padding: 24px;
  backdrop-filter: blur(10px);
}
.welcome-banner {
  background: linear-gradient(135deg, rgba(249,115,22,0.12), rgba(139,92,246,0.12));
  border: 1px solid var(--card-border); border-radius: 18px;
  padding: 24px 28px; margin-bottom: 20px;
  position: relative; overflow: hidden;
}
.welcome-banner h1 { font-size: 24px; margin-bottom: 6px; }
.welcome-banner p { color: var(--text-2); font-size: 14px; }
.stats-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px; margin-bottom: 20px;
}
.stat-card {
  background: var(--card); border: 1px solid var(--card-border);
  border-radius: 14px; padding: 16px; text-align: center;
}
.stat-value { font-size: 28px; font-weight: 800; background: linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.stat-label { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.section-title { font-size: 18px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.subjects-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px; margin-bottom: 20px;
}
.subject-card {
  background: var(--card); border: 1px solid var(--card-border);
  border-radius: 16px; padding: 20px; cursor: pointer;
  transition: all 0.3s; position: relative; overflow: hidden;
}
.subject-card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 8px 30px rgba(249,115,22,0.15); }
.subject-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
}
.subject-card.math::before { background: linear-gradient(90deg, var(--math), #fb923c); }
.subject-card.english::before { background: linear-gradient(90deg, var(--english), #22d3ee); }
.subject-card.chinese::before { background: linear-gradient(90deg, var(--chinese), #4ade80); }
.subject-card.sports::before { background: linear-gradient(90deg, var(--sports), #fcd34d); }
.subject-icon { font-size: 36px; margin-bottom: 8px; }
.subject-name { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.subject-stats { font-size: 12px; color: var(--text-3); }
.subject-progress { margin-top: 10px; height: 6px; background: var(--bg-2); border-radius: 3px; overflow: hidden; }
.subject-progress-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.today-section { margin-bottom: 20px; }
.task-list { display: flex; flex-direction: column; gap: 8px; }
.task-item {
  display: flex; align-items: center; gap: 12px;
  background: var(--card); border: 1px solid var(--card-border);
  border-radius: 12px; padding: 14px 16px;
  transition: all 0.2s;
}
.task-item.completed { opacity: 0.6; }
.task-item.completed .task-title { text-decoration: line-through; }
.task-checkbox {
  width: 22px; height: 22px; border-radius: 50%;
  border: 2px solid var(--text-3); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all 0.2s;
  background: transparent;
}
.task-checkbox.checked { background: var(--success); border-color: var(--success); }
.task-checkbox.checked::after { content: '✓'; color: white; font-size: 13px; font-weight: bold; }
.task-info { flex: 1; }
.task-title { font-weight: 600; font-size: 14px; }
.task-desc { font-size: 12px; color: var(--text-3); }
.task-duration { font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 4px; }
.task-action-btn {
  padding: 6px 14px; border-radius: 8px; border: none;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: white; font-size: 12px; font-weight: 600; cursor: pointer;
}
.quick-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
.quick-btn {
  padding: 10px 18px; border-radius: 10px; border: 1px solid var(--card-border);
  background: var(--card); color: var(--text); cursor: pointer;
  font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px;
  transition: all 0.2s;
}
.quick-btn:hover { border-color: var(--accent); background: rgba(249,115,22,0.1); }
.calendar-week {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 20px;
}
.cal-day {
  background: var(--card); border: 1px solid var(--card-border);
  border-radius: 12px; padding: 12px 8px; text-align: center;
  cursor: pointer; transition: all 0.2s; min-height: 120px;
}
.cal-day:hover { border-color: var(--accent); }
.cal-day.today { border-color: var(--accent); box-shadow: 0 0 20px rgba(249,115,22,0.2); }
.cal-day.past { opacity: 0.7; }
.cal-day-header { font-size: 12px; color: var(--text-3); margin-bottom: 4px; }
.cal-day-icon { font-size: 20px; margin-bottom: 4px; }
.cal-day-date { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
.cal-task { font-size: 10px; padding: 3px 4px; margin: 2px 0; border-radius: 4px; background: var(--bg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-task.done { background: rgba(34,197,94,0.2); color: var(--success); }
.cal-progress { font-size: 11px; color: var(--text-3); margin-top: 4px; }
.quiz-container { max-width: 700px; margin: 0 auto; }
.quiz-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--card-border);
}
.quiz-progress { font-size: 14px; color: var(--text-2); }
.quiz-timer { font-size: 14px; color: var(--text-3); }
.quiz-score { font-size: 14px; color: var(--success); }
.back-btn {
  padding: 8px 16px; border-radius: 10px; border: 1px solid var(--card-border);
  background: var(--card); color: var(--text); cursor: pointer; font-size: 13px;
  display: inline-flex; align-items: center; gap: 6px; margin-bottom: 16px;
}
.question-card {
  background: var(--card); border: 1px solid var(--card-border);
  border-radius: 16px; padding: 28px;
}
.kp-tag {
  display: inline-block; padding: 4px 10px; border-radius: 20px;
  font-size: 12px; font-weight: 500; margin-bottom: 14px;
}
.kp-tag.math { background: rgba(249,115,22,0.15); color: var(--math); }
.kp-tag.english { background: rgba(6,182,212,0.15); color: var(--english); }
.kp-tag.chinese { background: rgba(34,197,94,0.15); color: var(--chinese); }
.kp-tag.sports { background: rgba(251,191,36,0.15); color: var(--sports); }
.question-text { font-size: 18px; font-weight: 600; margin-bottom: 24px; line-height: 1.6; }
.options-grid { display: flex; flex-direction: column; gap: 10px; }
.option-btn {
  padding: 14px 18px; border-radius: 12px; border: 2px solid var(--card-border);
  background: var(--bg-2); color: var(--text); cursor: pointer;
  font-size: 15px; text-align: left; transition: all 0.2s;
  display: flex; align-items: center; gap: 12px;
}
.option-btn:hover:not(:disabled) { border-color: var(--accent); background: rgba(249,115,22,0.08); }
.option-btn:disabled { cursor: default; }
.option-btn.correct { border-color: var(--success); background: rgba(34,197,94,0.15); color: var(--success); }
.option-btn.wrong { border-color: var(--error); background: rgba(239,68,68,0.15); color: var(--error); }
.option-label {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--card); display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13px; flex-shrink: 0;
}
.feedback-box {
  margin-top: 20px; padding: 16px; border-radius: 12px;
  animation: fadeIn 0.3s ease;
}
.feedback-box.correct { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); }
.feedback-box.wrong { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); }
.feedback-title { font-weight: 700; margin-bottom: 6px; font-size: 15px; }
.feedback-explain { font-size: 14px; color: var(--text-2); line-height: 1.7; margin-bottom: 8px; }
.principle-box {
  margin-top: 10px; padding: 12px; border-radius: 8px;
  background: rgba(139,92,246,0.1); border-left: 3px solid var(--accent-2);
  font-size: 13px; color: var(--text-2); line-height: 1.7;
}
.principle-label { color: var(--accent-2); font-weight: 600; }
.points-earned {
  display: inline-flex; align-items: center; gap: 4px;
  margin-top: 8px; font-weight: 700; color: var(--warning);
}
.next-btn {
  margin-top: 16px; padding: 12px 28px; border-radius: 10px; border: none;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: white; font-size: 15px; font-weight: 600; cursor: pointer;
}
.reading-card {
  background: var(--card); border: 1px solid var(--card-border);
  border-radius: 16px; padding: 24px; margin-bottom: 20px;
}
.reading-header { margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--card-border); }
.reading-title { font-size: 20px; font-weight: 700; }
.reading-author { font-size: 13px; color: var(--text-3); margin-top: 4px; }
.reading-content {
  font-size: 15px; line-height: 2; color: var(--text-2);
  padding: 16px; background: var(--bg-2); border-radius: 12px;
  white-space: pre-wrap; max-height: 300px; overflow-y: auto;
}
.reading-questions-header {
  font-size: 14px; font-weight: 600; color: var(--accent); margin: 16px 0 10px;
  display: flex; align-items: center; gap: 6px;
}
.knowledge-grid {
  display: grid; gap: 10px;
}
.kp-item {
  background: var(--card); border: 1px solid var(--card-border);
  border-radius: 12px; padding: 14px;
}
.kp-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.kp-name { font-weight: 600; font-size: 14px; }
.kp-level { font-size: 12px; padding: 2px 8px; border-radius: 10px; }
.kp-bar { height: 6px; background: var(--bg-2); border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
.kp-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; background: linear-gradient(90deg, var(--error), var(--warning), var(--success)); }
.kp-meta { font-size: 11px; color: var(--text-3); display: flex; gap: 12px; }
.review-due {
  background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3);
  color: var(--warning); font-size: 11px; padding: 2px 8px; border-radius: 10px;
}
.wrong-list { display: flex; flex-direction: column; gap: 10px; }
.wrong-item {
  background: var(--card); border: 1px solid var(--card-border);
  border-radius: 12px; padding: 14px;
}
.wrong-q { font-size: 14px; margin-bottom: 8px; }
.wrong-ans { font-size: 12px; color: var(--text-3); }
.sports-timer {
  text-align: center; padding: 40px;
}
.timer-display {
  font-size: 72px; font-weight: 800;
  background: linear-gradient(135deg, var(--sports), var(--warning));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin: 20px 0;
}
.exercise-name { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
.exercise-icon { font-size: 48px; margin-bottom: 12px; }
.exercise-desc { font-size: 15px; color: var(--text-2); margin-bottom: 24px; }
.timer-controls { display: flex; gap: 12px; justify-content: center; }
.timer-btn {
  padding: 14px 32px; border-radius: 12px; border: none;
  font-size: 16px; font-weight: 600; cursor: pointer;
}
.timer-btn.start { background: linear-gradient(135deg, var(--success), #4ade80); color: white; }
.timer-btn.skip { background: var(--bg-2); color: var(--text); border: 1px solid var(--card-border); }
.exercise-list { margin-top: 20px; text-align: left; }
.exercise-step {
  display: flex; align-items: center; gap: 12px;
  padding: 10px; border-radius: 8px;
  font-size: 13px;
}
.exercise-step.active { background: rgba(249,115,22,0.1); border: 1px solid var(--accent); }
.exercise-step.done { opacity: 0.5; }
.step-num { width: 24px; height: 24px; border-radius: 50%; background: var(--bg-2); display: flex; align-items: center; justify-content: center; font-size: 11px; }
.achievements-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 12px;
}
.achievement-card {
  background: var(--card); border: 1px solid var(--card-border);
  border-radius: 14px; padding: 20px; text-align: center;
  opacity: 0.4;
}
.achievement-card.unlocked { opacity: 1; border-color: var(--warning); box-shadow: 0 4px 20px rgba(245,158,11,0.15); }
.achievement-icon { font-size: 40px; margin-bottom: 8px; }
.achievement-name { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
.achievement-desc { font-size: 11px; color: var(--text-3); }
.subject-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.subj-tab {
  padding: 8px 16px; border-radius: 10px; border: 1px solid var(--card-border);
  background: var(--card); color: var(--text-2); cursor: pointer; font-size: 13px;
}
.subj-tab.active { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; border-color: transparent; }
.empty-state { text-align: center; padding: 40px; color: var(--text-3); }
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.achievement-toast {
  position: fixed; top: 80px; right: 20px; z-index: 200;
  background: linear-gradient(135deg, var(--warning), var(--accent));
  color: white; padding: 16px 24px; border-radius: 14px;
  box-shadow: 0 10px 40px rgba(245,158,11,0.3);
  animation: slideIn 0.4s ease, fadeOut 0.4s ease 2.6s forwards;
  display: flex; align-items: center; gap: 12px;
}
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes fadeOut { to { opacity: 0; transform: translateX(100%); } }
.content-stats-bar {
  background: var(--card); border: 1px solid var(--card-border);
  border-radius: 12px; padding: 12px 16px; margin-bottom: 16px;
  display: flex; gap: 20px; flex-wrap: wrap; font-size: 13px;
}
.content-stat { display: flex; align-items: center; gap: 6px; color: var(--text-2); }
.content-stat b { color: var(--text); }
@media (max-width: 768px) {
  .calendar-week { grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-day { padding: 6px 4px; min-height: 90px; }
  .cal-task { font-size: 9px; }
  .subjects-grid { grid-template-columns: repeat(2, 1fr); }
  .nav-tabs { gap: 2px; margin-left: 0; }
  .nav-tab { padding: 6px 10px; font-size: 12px; }
}</style>
</head>
<body>
  <nav class="nav">
    <div class="logo">
      <div class="logo-icon">🎓</div>
      <span>智学成长乐园</span>
    </div>
    <div class="nav-tabs">
      <button class="nav-tab active" data-page="home">🏠 首页</button>
      <button class="nav-tab" data-page="calendar">📅 日历</button>
      <button class="nav-tab" data-page="knowledge">📚 知识点</button>
      <button class="nav-tab" data-page="review">🔄 复习</button>
      <button class="nav-tab" data-page="wrong">❌ 错题本</button>
      <button class="nav-tab" data-page="sports">⚽ 体育</button>
      <button class="nav-tab" data-page="achievements">🏆 成就</button>
    </div>
    <div class="user-badge">
      <div class="streak-badge">🔥 <span id="streakDays">0</span></div>
      <div class="level-badge">Lv.<span id="userLevel">1</span></div>
      <div class="xp-bar-container"><div class="xp-bar" id="xpBar" style="width:0%"></div></div>
      <button class="reset-btn" id="resetBtn">重置</button>
    </div>
  </nav>

  <div class="container">
    <div class="page active" id="page-home">
      <div class="welcome-banner">
        <h1 id="welcomeTitle">欢迎回来！</h1>
        <p id="welcomeSubtitle">开始今天的学习吧</p>
      </div>
      <div class="content-stats-bar" id="contentStatsBar"></div>
      <div class="stats-grid" id="statsGrid"></div>
      <div class="quick-actions">
        <button class="quick-btn" data-action="goto-page" data-page="review">🔄 <span>待复习 <b id="dueCount2">0</b></span></button>
        <button class="quick-btn" data-action="goto-page" data-page="wrong">❌ <span>错题本 <b id="wrongCount2">0</b></span></button>
        <button class="quick-btn" data-action="goto-page" data-page="sports">⚽ 开始锻炼</button>
      </div>
      <div class="today-section">
        <div class="section-title">📋 今日任务</div>
        <div class="task-list" id="todayTasks"></div>
      </div>
      <div>
        <div class="section-title">📚 选择学科开始学习</div>
        <div class="subjects-grid" id="subjectsGrid"></div>
      </div>
    </div>

    <div class="page" id="page-calendar">
      <div class="section-title" id="calendarTitle">📅 本周学习计划</div>
      <div class="calendar-week" id="calendarWeek"></div>
    </div>

    <div class="page" id="page-knowledge">
      <div class="section-title">📚 知识点掌握情况</div>
      <div class="subject-tabs" id="kpSubjectTabs"></div>
      <div class="knowledge-grid" id="knowledgeGrid"></div>
    </div>

    <div class="page" id="page-review">
      <div class="section-title">🔄 待复习知识点</div>
      <div class="subject-tabs" id="reviewSubjectTabs"></div>
      <div id="reviewList"></div>
    </div>

    <div class="page" id="page-wrong">
      <div class="section-title">❌ 错题本</div>
      <div class="subject-tabs" id="wrongSubjectTabs"></div>
      <div class="wrong-list" id="wrongList"></div>
    </div>

    <div class="page" id="page-quiz">
      <button class="back-btn" data-action="goto-page" data-page="home">← 返回</button>
      <div class="quiz-container" id="quizContainer"></div>
    </div>

    <div class="page" id="page-sports">
      <div class="section-title">⚽ 体育锻炼</div>
      <div class="card sports-timer" id="sportsContainer"></div>

const QUESTION_BANK = JSON.parse('{"math":[{"kp":"m1","q":"计算：(-3) + (-5) 的结果是？","options":["A. -8","B. -2","C. 2","D. 8"],"ans":0,"explain":"根据有理数加法法则：同号两数相加，取相同的符号，并把绝对值相加。(-3)和(-5)都是负数，符号为负，绝对值3+5=8，所以结果是-8。","difficulty":1,"type":"choice"},{"kp":"m1","q":"计算：(-2) × (-4) × (-1) 的结果是？","options":["A. -8","B. -7","C. 7","D. 8"],"ans":0,"explain":"根据有理数乘法法则：几个不为0的数相乘，负因数的个数是偶数时，积为正数；负因数的个数是奇数时，积为负数。这里有3个负因数（奇数），结果为负。绝对值2×4×1=8，所以结果是-8。","difficulty":1,"type":"choice"},{"kp":"m1","q":"计算：(-2)³ 的结果是？","options":["A. -6","B. -8","C. 6","D. 8"],"ans":1,"explain":"根据乘方的定义，(-2)³表示3个-2相乘，即(-2)×(-2)×(-2)。先算前两个：(-2)×(-2)=4，再乘以-2得4×(-2)=-8。注意：负数的奇数次幂是负数。","difficulty":1,"type":"choice"},{"kp":"m1","q":"若|a|=3，|b|=2，且a<b，则a+b的值是？","options":["A. -5","B. -1","C. -5或-1","D. 1或5"],"ans":2,"explain":"由|a|=3得a=±3，由|b|=2得b=±2。因为a<b，所以a必须是-3（如果a=3则3>2和3>-2都不满足）。当a=-3时，b可以是2或-2：若b=2，则a+b=-3+2=-1；若b=-2，则a+b=-3+(-2)=-5。所以答案是-5或-1。","difficulty":2,"type":"choice"},{"kp":"m1","q":"计算：-1⁴ - (-2)² 的结果是？","options":["A. -5","B. -3","C. 3","D. 5"],"ans":0,"explain":"注意运算顺序：-1⁴表示-(1⁴)=-1（负号在乘方外面），(-2)²=4。所以原式=-1-4=-5。易错点：-1⁴≠(-1)⁴，(-1)⁴=1。","difficulty":2,"type":"choice"},{"kp":"m1","q":"某冷库温度是-4℃，现有一批食品需要在-28℃冷藏，如果每小时降温3℃，问几小时后能降到所要求的温度？","options":["A. 6小时","B. 8小时","C. 10小时","D. 12小时"],"ans":1,"explain":"需要降低的温度为：-4 - (-28) = -4 + 28 = 24℃。每小时降3℃，所需时间为24÷3=8小时。这是有理数运算的实际应用，关键是求出温差。","difficulty":2,"type":"choice"},{"kp":"m2","q":"解方程：2x + 5 = 11，x的值是？","options":["A. 2","B. 3","C. 4","D. 5"],"ans":1,"explain":"移项得2x=11-5=6，两边同除以2得x=3。验证：2×3+5=6+5=11，正确。解一元一次方程的基本步骤：移项要变号。","difficulty":1,"type":"choice"},{"kp":"m2","q":"解方程：3(x-2) = 2x + 1，x的值是？","options":["A. 5","B. 6","C. 7","D. 8"],"ans":2,"explain":"先去括号：3x-6=2x+1，移项得3x-2x=1+6，合并同类项得x=7。验证：3×(7-2)=3×5=15，2×7+1=14+1=15，正确。","difficulty":1,"type":"choice"},{"kp":"m2","q":"一件商品按成本价提高40%后标价，再打8折销售，售价为224元。这件商品的成本价是多少？","options":["A. 180元","B. 200元","C. 220元","D. 240元"],"ans":1,"explain":"设成本价为x元。提高40%后标价为x(1+40%)=1.4x，打8折后售价为1.4x×0.8=1.12x。由题意1.12x=224，解得x=224÷1.12=200元。这是一元一次方程的利润问题应用。","difficulty":2,"type":"choice"},{"kp":"m2","q":"某车间有22名工人，每人每天可以生产1200个螺钉或2000个螺母。1个螺钉需要配2个螺母，为使每天生产的螺钉和螺母刚好配套，应安排生产螺钉的工人多少名？","options":["A. 8名","B. 10名","C. 12名","D. 14名"],"ans":1,"explain":"设应安排x名工人生产螺钉，则(22-x)名工人生产螺母。每天生产螺钉1200x个，生产螺母2000(22-x)个。因为1个螺钉配2个螺母，所以螺母数量应是螺钉的2倍，列方程：2000(22-x)=2×1200x，化简得44000-2000x=2400x，4400x=44000，x=10。所以应安排10名工人生产螺钉，12名生产螺母。验证：螺钉10×1200=12000个，螺母12×2000=24000个，24000÷12000=2，刚好配套。","difficulty":3,"type":"choice"},{"kp":"m2","q":"关于x的方程2x+a=5的解是x=-1，则a等于？","options":["A. -7","B. -3","C. 3","D. 7"],"ans":3,"explain":"因为x=-1是方程的解，将x=-1代入方程得：2×(-1)+a=5，即-2+a=5，解得a=7。这是方程解的概念：使方程左右两边相等的未知数的值。","difficulty":1,"type":"choice"},{"kp":"m3","q":"下列说法正确的是？","options":["A. 两点之间，直线最短","B. 连接两点的线段叫做两点间的距离","C. 过一点有且只有一条直线与已知直线垂直","D. 过直线外一点有且只有一条直线与已知直线平行"],"ans":3,"explain":"A选项错误：两点之间，线段最短，不是直线；B选项错误：连接两点的线段的长度叫做两点间的距离，距离是数量不是图形；C选项错误：必须在同一平面内，过一点才有且只有一条直线与已知直线垂直；D选项正确：这是平行公理。","difficulty":2,"type":"choice"},{"kp":"m3","q":"一个角的补角比它的余角的3倍少20°，这个角的度数是？","options":["A. 30°","B. 35°","C. 40°","D. 45°"],"ans":1,"explain":"设这个角为x°，则它的补角为(180-x)°，余角为(90-x)°。根据题意：180-x=3(90-x)-20，展开得180-x=270-3x-20=250-3x，移项得2x=70，x=35°。验证：补角145°，余角55°，3×55-20=165-20=145°，正确。","difficulty":2,"type":"choice"},{"kp":"m3","q":"已知线段AB=8cm，在直线AB上画线段BC=3cm，则线段AC的长度是？","options":["A. 11cm","B. 5cm","C. 11cm或5cm","D. 8cm或11cm"],"ans":2,"explain":"题目说的是在直线AB上画BC，所以C点可能在线段AB上，也可能在AB的延长线上：(1)C在AB延长线上时，AC=AB+BC=8+3=11cm；(2)C在线段AB上时，AC=AB-BC=8-3=5cm。所以答案是11cm或5cm，注意关键词是直线AB不是线段AB。","difficulty":2,"type":"choice"},{"kp":"m3","q":"三角形的三条高所在直线的交点一定在？","options":["A. 三角形内部","B. 三角形外部","C. 三角形内部或外部","D. 三角形内部、外部或顶点"],"ans":3,"explain":"锐角三角形的三条高交于三角形内部；直角三角形的三条高交于直角顶点；钝角三角形的三条高所在直线交于三角形外部。所以交点可能在三角形内部、外部或顶点。","difficulty":2,"type":"choice"},{"kp":"m3","q":"如果一个多边形的内角和是外角和的3倍，那么这个多边形是？","options":["A. 六边形","B. 七边形","C. 八边形","D. 九边形"],"ans":2,"explain":"多边形外角和恒为360°，所以内角和为3×360°=1080°。根据n边形内角和公式(n-2)×180°，得(n-2)×180=1080，n-2=6，n=8，所以是八边形。","difficulty":2,"type":"choice"},{"kp":"m3","q":"等腰三角形两边长分别为3和7，则它的周长为？","options":["A. 13","B. 17","C. 13或17","D. 以上都不对"],"ans":1,"explain":"需要分情况讨论：(1)若腰长为3，底边长为7，则3+3=6<7，不满足三角形两边之和大于第三边，不能构成三角形；(2)若腰长为7，底边长为3，则7+7>7，7+3>7，可以构成三角形，周长=7+7+3=17。所以答案是17，注意三角形三边关系是隐含条件。","difficulty":2,"type":"choice"},{"kp":"m4","q":"方程组{x+y=5, 2x-y=1}的解是？","options":["A. {x=1,y=4}","B. {x=2,y=3}","C. {x=3,y=2}","D. {x=4,y=1}"],"ans":1,"explain":"用加减消元法：两个方程相加得(x+y)+(2x-y)=5+1，即3x=6，x=2。将x=2代入第一个方程：2+y=5，y=3。验证：2×2-3=4-3=1，正确。","difficulty":1,"type":"choice"},{"kp":"m4","q":"解方程组{3x+4y=16, 5x-6y=33}，x的值是？","options":["A. 4","B. 5","C. 6","D. 7"],"ans":2,"explain":"用加减消元法，先消去y：第一个方程×3得9x+12y=48，第二个方程×2得10x-12y=66，两式相加得19x=114，x=6。代入得y=(16-18)/4=-1/2。验证：5×6-6×(-1/2)=30+3=33，正确。","difficulty":2,"type":"choice"},{"kp":"m4","q":"某班有40名同学去看演出，购买甲、乙两种票共用去370元，其中甲种票每张10元，乙种票每张8元。设购买甲种票x张，乙种票y张，所列方程组正确的是？","options":["A. {x+y=40, 8x+10y=370}","B. {x+y=40, 10x+8y=370}","C. {x+y=370, 10x+8y=40}","D. {x+y=370, 8x+10y=40}"],"ans":1,"explain":"第一个等量关系：总人数=甲票数+乙票数，即x+y=40；第二个等量关系：总费用=甲票钱+乙票钱，甲票每张10元共10x元，乙票每张8元共8y元，所以10x+8y=370。因此选B。","difficulty":1,"type":"choice"},{"kp":"m4","q":"已知{x=2,y=1}是方程组{ax+by=7, ax-by=1}的解，则a-b的值是？","options":["A. -1","B. 1","C. 2","D. 3"],"ans":0,"explain":"将x=2,y=1代入方程组得：{2a+b=7, 2a-b=1}，两式相加得4a=8，a=2；代入得2×2+b=7，b=3。所以a-b=2-3=-1。","difficulty":2,"type":"choice"},{"kp":"m4","q":"用代入法解方程组{y=2x-3, 3x+2y=8}时，将第一个方程代入第二个方程，得到的方程是？","options":["A. 3x+4y-3=8","B. 3x+4x-6=8","C. 3x+2x-3=8","D. 3x-2x-6=8"],"ans":1,"explain":"代入法就是把y=2x-3代入3x+2y=8中的y，得到3x+2(2x-3)=8，展开括号：3x+4x-6=8，即7x=14，x=2。所以选B。注意代入时要给2x-3加上括号，避免符号错误。","difficulty":1,"type":"choice"},{"kp":"m5","q":"不等式2x-4<0的解集是？","options":["A. x>-2","B. x<-2","C. x>2","D. x<2"],"ans":3,"explain":"移项得2x<4，两边同除以2得x<2。解不等式时，两边同除以正数，不等号方向不变。","difficulty":1,"type":"choice"},{"kp":"m5","q":"不等式-3x+6≥0的正整数解有几个？","options":["A. 1个","B. 2个","C. 3个","D. 4个"],"ans":1,"explain":"移项得-3x≥-6，两边同除以-3（注意：除以负数不等号方向改变）得x≤2。正整数解为1和2，共2个。易错点：忘记改变不等号方向；漏掉x=2这个解（因为是≥）。","difficulty":2,"type":"choice"},{"kp":"m5","q":"不等式组{x+1>0, x-1≤0}的解集在数轴上表示正确的是？","options":["A. -1<x≤1","B. -1≤x<1","C. x<-1","D. x≥1"],"ans":0,"explain":"解第一个不等式x+1>0得x>-1；解第二个不等式x-1≤0得x≤1。根据不等式组解集口诀：大小小大中间找，解集为-1<x≤1。","difficulty":1,"type":"choice"},{"kp":"m5","q":"若a<b，则下列各式中一定成立的是？","options":["A. a-1<b-1","B. -a<-b","C. ac<bc","D. a²<b²"],"ans":0,"explain":"A选项：不等式两边减同一个数，不等号方向不变，正确；B选项：不等式两边乘负数，不等号方向应改变，应该是-a>-b，错误；C选项：当c≤0时不成立，若c=0则ac=bc，若c<0则ac>bc，错误；D选项：举反例a=-3,b=1时a<b但a²=9>1=b²，错误。","difficulty":2,"type":"choice"},{"kp":"m5","q":"某次知识竞赛共有20道题，每一题答对得10分，答错或不答都扣5分。小明得分要超过90分，他至少要答对多少道题？","options":["A. 12道","B. 13道","C. 14道","D. 15道"],"ans":1,"explain":"设答对x道题，则答错或不答(20-x)道。得分=10x-5(20-x)=10x-100+5x=15x-100。要超过90分，即15x-100>90，15x>190，x>12.67。因为题数是整数，所以x至少为13道。验证：13道得分为15×13-100=195-100=95>90；12道得分为180-100=80<90。","difficulty":3,"type":"choice"},{"kp":"m6","q":"在圆的周长公式C=2πr中，下列说法正确的是？","options":["A. 常量是2，变量是C、π、r","B. 常量是2π，变量是C、r","C. 常量是2，变量是π、r","D. 常量是2、r，变量是C、π"],"ans":1,"explain":"常量是在变化过程中不变的量，2和π都是常数，所以常量是2π；变量是可以取不同数值的量，半径r变化时周长C也变化，所以C和r是变量。注意π是一个固定的常数（约3.14159...），不是变量。","difficulty":1,"type":"choice"},{"kp":"m6","q":"下列各曲线中，表示y是x的函数的是？","options":["A. 垂直于x轴的直线x=1","B. 开口向上的抛物线y=x²","C. 圆心在原点的圆x²+y²=1","D. 以上都不是"],"ans":1,"explain":"函数的定义：对于x的每一个确定的值，y都有唯一确定的值与之对应。判断方法：作垂直于x轴的直线，左右平移时与图像最多只有一个交点就是函数。A选项x=1一个x对应无数y，不是函数；B选项y=x²每个x对应唯一y，是函数；C选项圆x²+y²=1，对x在(-1,1)内的每个值，y有两个值（正负），不是函数。","difficulty":2,"type":"choice"},{"kp":"m6","q":"点P(-2,3)关于x轴对称的点的坐标是？","options":["A. (-2,-3)","B. (2,3)","C. (2,-3)","D. (3,-2)"],"ans":0,"explain":"关于x轴对称的点：横坐标不变，纵坐标互为相反数。所以P(-2,3)关于x轴对称的点是(-2,-3)。记忆口诀：关于谁对称谁不变，另一个变号；关于原点对称都变号。","difficulty":1,"type":"choice"},{"kp":"m6","q":"若一次函数y=kx+b的图像经过第一、三、四象限，则k、b的符号是？","options":["A. k>0,b>0","B. k>0,b<0","C. k<0,b>0","D. k<0,b<0"],"ans":1,"explain":"一次函数y=kx+b中：k决定直线倾斜方向，k>0时直线从左下到右上（经过一、三象限），k<0时从左上到右下；b是y轴截距，b>0交y轴正半轴，b<0交y轴负半轴。经过一、三、四象限：说明过一、三（k>0），过四说明与y轴负半轴相交（b<0）。所以k>0,b<0。","difficulty":2,"type":"choice"},{"kp":"m6","q":"某游客为爬上3千米高的山顶看日出，先用1小时爬了2千米，休息0.5小时后，用1小时爬上山顶。游客爬山所用时间t与山高h之间的函数关系用图像表示是？","options":["A. 一条直线上升","B. 先上升，再水平，再上升","C. 先上升，再下降，再上升","D. 以上都不对"],"ans":1,"explain":"分析过程：(1)0-1小时：时间增加1小时，高度从0升到2千米，图像上升；(2)1-1.5小时：休息0.5小时，时间增加但高度不变，图像是水平线段；(3)1.5-2.5小时：用1小时从2千米爬到3千米，图像再次上升。所以图像是先上升、再水平、再上升。","difficulty":2,"type":"choice"},{"kp":"m7","q":"计算：a²·a³的结果是？","options":["A. a⁵","B. a⁶","C. a⁸","D. a⁹"],"ans":0,"explain":"根据同底数幂乘法法则：a^m·a^n=a^(m+n)（底数不变，指数相加）。所以a²·a³=a^(2+3)=a⁵。注意区分：同底数幂相乘是指数相加，幂的乘方才是指数相乘。","difficulty":1,"type":"choice"},{"kp":"m7","q":"计算：(-2a²)³的结果是？","options":["A. -6a⁵","B. -8a⁶","C. 6a⁵","D. 8a⁶"],"ans":1,"explain":"根据积的乘方法则：(ab)^n=a^n·b^n，幂的乘方：(a^m)^n=a^(mn)。所以(-2a²)³=(-2)³·(a²)³=-8·a^(2×3)=-8a⁶。注意：(-2)³=-8，不要忘了负号。","difficulty":1,"type":"choice"},{"kp":"m7","q":"计算：(x+2)(x-3)的结果是？","options":["A. x²-x-6","B. x²+x-6","C. x²-5x-6","D. x²+5x-6"],"ans":0,"explain":"根据多项式乘法法则（FOIL法）：(x+2)(x-3)=x·x+x·(-3)+2·x+2·(-3)=x²-3x+2x-6=x²-x-6。也可用公式(x+a)(x+b)=x²+(a+b)x+ab，这里a=2,b=-3，a+b=-1，ab=-6。","difficulty":1,"type":"choice"},{"kp":"m7","q":"计算：(2x+3y)²的结果是？","options":["A. 4x²+9y²","B. 4x²+6xy+9y²","C. 4x²+12xy+9y²","D. 2x²+12xy+3y²"],"ans":2,"explain":"根据完全平方公式：(a+b)²=a²+2ab+b²。这里a=2x,b=3y，所以(2x+3y)²=(2x)²+2·(2x)·(3y)+(3y)²=4x²+12xy+9y²。注意：完全平方公式展开是三项，中间项2ab不要漏掉，也不要算成6xy。","difficulty":2,"type":"choice"},{"kp":"m7","q":"下列计算正确的是？","options":["A. (a+b)²=a²+b²","B. (a-b)²=a²-b²","C. (a+m)(b+n)=ab+mn","D. (a+b)(a-b)=a²-b²"],"ans":3,"explain":"A选项是常见错误，漏掉了中间项2ab，应该是a²+2ab+b²；B选项错误，应该是a²-2ab+b²；C选项错误，多项式乘多项式应该是ab+an+bm+mn；D选项是平方差公式，正确。","difficulty":1,"type":"choice"},{"kp":"m7","q":"计算：2021²-2020×2022的结果是？","options":["A. -1","B. 0","C. 1","D. 2"],"ans":2,"explain":"用简便方法：2020×2022=(2021-1)(2021+1)=2021²-1²=2021²-1（平方差公式）。所以原式=2021²-(2021²-1)=2021²-2021²+1=1。这是整式乘法公式的简便运算应用。","difficulty":2,"type":"choice"},{"kp":"m8","q":"下列从左边到右边的变形，属于因式分解的是？","options":["A. (x+1)(x-1)=x²-1","B. x²-2x+1=x(x-2)+1","C. x²-4y²=(x+4y)(x-4y)","D. x²-x-6=(x-3)(x+2)"],"ans":3,"explain":"因式分解的定义：把一个多项式化成几个整式的积的形式。A选项是整式乘法（从积到和差），与因式分解相反；B选项右边不是积的形式，还有加法；C选项分解错误，应该是(x+2y)(x-2y)；D选项正确，把多项式化成了两个整式的积，且分解正确。","difficulty":1,"type":"choice"},{"kp":"m8","q":"多项式8a³b²-12ab³c的公因式是？","options":["A. 4ab","B. 4ab²","C. 4a²b","D. 4a²b²"],"ans":1,"explain":"确定公因式三步骤：(1)系数：各项系数的最大公约数，8和12的最大公约数是4；(2)字母：各项都含有的相同字母，有a和b；(3)指数：相同字母取最低次幂，a的最低次是1次，b的最低次是2次。所以公因式是4ab²。","difficulty":1,"type":"choice"},{"kp":"m8","q":"分解因式：x²-9的结果是？","options":["A. (x-3)²","B. (x+3)²","C. (x+3)(x-3)","D. (x-9)(x+1)"],"ans":2,"explain":"x²-9符合平方差公式a²-b²=(a+b)(a-b)，其中a=x,b=3（因为9=3²），所以x²-9=x²-3²=(x+3)(x-3)。注意区分平方差和完全平方：x²-9是两项，用平方差；x²-6x+9是三项，才是完全平方。","difficulty":1,"type":"choice"},{"kp":"m8","q":"分解因式：x²-6x+9的结果是？","options":["A. (x-3)²","B. (x+3)²","C. (x-9)(x+1)","D. (x-3)(x+3)"],"ans":0,"explain":"x²-6x+9是一个完全平方式，符合a²-2ab+b²=(a-b)²，其中a=x,b=3（因为2ab=2·x·3=6x，b²=9）。所以x²-6x+9=(x-3)²。完全平方式的特征：三项；首平方，尾平方，首尾两倍在中央。","difficulty":1,"type":"choice"},{"kp":"m8","q":"分解因式：x³-4x的结果是？","options":["A. x(x²-4)","B. x(x-2)²","C. x(x+2)(x-2)","D. x(x+4)(x-4)"],"ans":2,"explain":"因式分解步骤：一提（提公因式）二套（套公式），分解到不能再分解为止。首先提公因式x得x(x²-4)，x²-4还可以用平方差公式继续分解为(x+2)(x-2)，所以结果是x(x+2)(x-2)。注意：A选项没有分解彻底。","difficulty":2,"type":"choice"},{"kp":"m8","q":"若x²+2(m-3)x+16是完全平方式，则m的值是？","options":["A. 3","B. 7","C. -1","D. 7或-1"],"ans":3,"explain":"完全平方式有两种：a²+2ab+b²和a²-2ab+b²。这里a=x,b²=16，所以b=±4。当b=4时，2(m-3)=2×4=8，m-3=4，m=7；当b=-4时，2(m-3)=-8，m-3=-4，m=-1。所以m的值是7或-1，容易漏解。","difficulty":3,"type":"choice"},{"kp":"m8","q":"分解因式：a³-2a²+a的结果是？","options":["A. a(a²-2a)","B. a²(a-2)","C. a(a-1)²","D. a(a+1)²"],"ans":2,"explain":"按步骤分解：先提公因式a，得到a(a²-2a+1)；再看括号里的a²-2a+1，是完全平方式，等于(a-1)²。所以最终结果是a(a-1)²。注意：因式分解一定要分解到每个因式都不能再分解为止。","difficulty":2,"type":"choice"}],"english":[{"kp":"e1","q":"My favorite ______ at school is English because it\'s interesting.","options":["A. food","B. subject","C. sport","D. color"],"ans":1,"explain":"本题考查名词词义辨析。food意为\\"食物\\"，subject意为\\"科目\\"，sport意为\\"运动\\"，color意为\\"颜色\\"。根据句中\\"English\\"（英语）可知这是一门学科，故选B。","difficulty":1,"type":"choice"},{"kp":"e1","q":"I often ______ books in the school library after class.","options":["A. read","B. watch","C. look","D. see"],"ans":0,"explain":"本题考查动词词义辨析。read意为\\"阅读（书、报等）\\"，watch意为\\"观看（电视、比赛等）\\"，look意为\\"看（强调动作，后接at）\\"，see意为\\"看见（强调结果）\\"。\\"读书\\"用read books，故选A。","difficulty":1,"type":"choice"},{"kp":"e1","q":"The math problem is very ______. I can\'t work it out.","options":["A. easy","B. difficult","C. interesting","D. boring"],"ans":1,"explain":"本题考查形容词词义辨析。easy意为\\"容易的\\"，difficult意为\\"困难的\\"，interesting意为\\"有趣的\\"，boring意为\\"无聊的\\"。根据后句\\"我做不出来\\"可知题目很难，故选B。","difficulty":1,"type":"choice"},{"kp":"e1","q":"______ is my best friend. ______ often helps me with my homework.","options":["A. This; He","B. She; Her","C. He; Him","D. Her; She"],"ans":0,"explain":"本题考查代词用法。第一空作主语且介绍人用This is...句型；第二空作主语需要用主格，He是主格，Her和Him是宾格。故选A。","difficulty":2,"type":"choice"},{"kp":"e1","q":"—Is this ______ pencil? —No, it\'s not ______. It\'s Lily\'s.","options":["A. your; my","B. yours; mine","C. your; mine","D. yours; my"],"ans":2,"explain":"本题考查物主代词。第一空后有名词pencil，需要用形容词性物主代词your；第二空后无名词，需要用名词性物主代词mine（=my pencil）。故选C。","difficulty":2,"type":"choice"},{"kp":"e1","q":"My birthday is ______ October 15th, and I usually have a party ______ the evening.","options":["A. in; on","B. on; in","C. at; in","D. on; at"],"ans":1,"explain":"本题考查介词用法。具体日期前用介词on；泛指在早上/下午/晚上用in the morning/afternoon/evening。故选B。","difficulty":2,"type":"choice"},{"kp":"e1","q":"I go to school ______ bike every day, but sometimes I go ______ foot with my classmates.","options":["A. by; by","B. on; on","C. by; on","D. on; by"],"ans":2,"explain":"本题考查固定搭配。\\"by+交通工具\\"表示交通方式，by bike意为\\"骑自行车\\"；on foot是固定搭配，意为\\"步行\\"。故选C。","difficulty":2,"type":"choice"},{"kp":"e1","q":"Tom is very ______. He always says \\"hello\\" to teachers politely.","options":["A. shy","B. quiet","C. polite","D. lazy"],"ans":2,"explain":"本题考查形容词词义辨析。shy意为\\"害羞的\\"，quiet意为\\"安静的\\"，polite意为\\"有礼貌的\\"，lazy意为\\"懒惰的\\"。根据\\"礼貌地向老师问好\\"可知Tom很有礼貌，故选C。","difficulty":2,"type":"choice"},{"kp":"e2","q":"My mother ______ breakfast for our family every morning.","options":["A. cook","B. cooks","C. cooking","D. cooked"],"ans":1,"explain":"本题考查一般现在时。every morning是一般现在时的标志，主语My mother是第三人称单数，谓语动词要用第三人称单数形式cooks，故选B。","difficulty":1,"type":"choice"},{"kp":"e2","q":"—______ you often ______ basketball after school? —Yes, I do.","options":["A. Do; play","B. Does; play","C. Are; play","D. Do; plays"],"ans":0,"explain":"本题考查一般现在时的一般疑问句。often是一般现在时标志，主语是you，用助动词Do开头，后面的实义动词用原形play，故选A。","difficulty":1,"type":"choice"},{"kp":"e2","q":"Tom ______ like math because he thinks it\'s too difficult.","options":["A. don\'t","B. doesn\'t","C. isn\'t","D. aren\'t"],"ans":1,"explain":"本题考查一般现在时的否定句。主语Tom是第三人称单数，谓语动词是实义动词like，变否定句要借助助动词doesn\'t，后面动词用原形，故选B。","difficulty":1,"type":"choice"},{"kp":"e2","q":"The earth ______ around the sun.","options":["A. go","B. goes","C. going","D. went"],"ans":1,"explain":"本题考查一般现在时的用法。表示客观真理、科学事实时用一般现在时，主语The earth是第三人称单数，谓语动词用goes，故选B。","difficulty":2,"type":"choice"},{"kp":"e2","q":"If it ______ tomorrow, we will stay at home and read books.","options":["A. rain","B. rains","C. will rain","D. rained"],"ans":1,"explain":"本题考查一般现在时在条件状语从句中的用法。在if引导的条件状语从句中，主句用一般将来时，从句用一般现在时表将来，主语it是第三人称单数，故选B。","difficulty":3,"type":"choice"},{"kp":"e3","q":"Look! The students ______ English in the classroom now.","options":["A. read","B. reads","C. are reading","D. is reading"],"ans":2,"explain":"本题考查现在进行时。Look!和now是现在进行时的标志，结构为am/is/are+doing，主语The students是复数，用are reading，故选C。","difficulty":1,"type":"choice"},{"kp":"e3","q":"—What is your sister doing? —She ______ a letter to her pen pal.","options":["A. writes","B. write","C. is writing","D. writing"],"ans":2,"explain":"本题考查现在进行时。问句用现在进行时提问，答句也要用现在进行时，主语She是第三人称单数，用is writing，故选C。","difficulty":1,"type":"choice"},{"kp":"e3","q":"Be quiet! The baby ______ in the bedroom.","options":["A. sleeps","B. sleep","C. is sleeping","D. slept"],"ans":2,"explain":"本题考查现在进行时。\\"Be quiet!\\"提示动作正在发生，用现在进行时，主语The baby是单数，用is sleeping，故选C。","difficulty":1,"type":"choice"},{"kp":"e3","q":"Listen! Someone ______ in the next room. Who is it?","options":["A. sing","B. sings","C. sang","D. is singing"],"ans":3,"explain":"本题考查现在进行时。Listen!是现在进行时的标志词，表示此刻正在进行的动作，结构为is/are+doing，主语Someone是不定代词，视为单数，故选D。","difficulty":2,"type":"choice"},{"kp":"e3","q":"These days we ______ for the coming English test.","options":["A. prepare","B. prepares","C. are preparing","D. prepared"],"ans":2,"explain":"本题考查现在进行时。These days表示\\"现阶段\\"，常与现在进行时连用，表示现阶段正在进行的动作，故选C。","difficulty":2,"type":"choice"},{"kp":"e4","q":"I ______ a funny movie last night with my family.","options":["A. watch","B. watches","C. watched","D. am watching"],"ans":2,"explain":"本题考查一般过去时。last night是一般过去时的标志，谓语动词用过去式，watch的过去式是watched，故选C。","difficulty":1,"type":"choice"},{"kp":"e4","q":"—______ you ______ to the Great Wall last summer? —Yes, I did.","options":["A. Do; go","B. Did; go","C. Are; going","D. Did; went"],"ans":1,"explain":"本题考查一般过去时的一般疑问句。last summer是过去时间标志，一般过去时的一般疑问句用Did开头，后面的实义动词用原形go，故选B。","difficulty":1,"type":"choice"},{"kp":"e4","q":"Tom ______ to school yesterday because he was ill.","options":["A. doesn\'t come","B. don\'t come","C. didn\'t come","D. came"],"ans":2,"explain":"本题考查一般过去时的否定句。yesterday是过去时间标志，主语Tom，一般过去时否定句用didn\'t+动词原形，根据\\"生病了\\"可知没来上学，故选C。","difficulty":1,"type":"choice"},{"kp":"e4","q":"Yesterday I ______ an old friend on my way home. We ______ happily.","options":["A. meet; talk","B. met; talked","C. meet; talked","D. met; talk"],"ans":1,"explain":"本题考查一般过去时。Yesterday是过去时间标志，两个动作都发生在过去，都要用过去式，meet的过去式是met，talk的过去式是talked，故选B。","difficulty":2,"type":"choice"},{"kp":"e4","q":"There ______ a lot of people in the park yesterday morning.","options":["A. is","B. are","C. was","D. were"],"ans":3,"explain":"本题考查there be句型的一般过去时。yesterday morning是过去时间，a lot of people是复数，所以用were，故选D。","difficulty":2,"type":"choice"},{"kp":"e5","q":"I ______ my grandparents this weekend.","options":["A. visit","B. visits","C. will visit","D. visited"],"ans":2,"explain":"本题考查一般将来时。this weekend表示将来的时间，一般将来时结构为will+动词原形或be going to+动词原形，故选C。","difficulty":1,"type":"choice"},{"kp":"e5","q":"—______ you ______ soccer with us tomorrow? —Yes, I\'d love to.","options":["A. Will; play","B. Do; play","C. Did; play","D. Are; play"],"ans":0,"explain":"本题考查一般将来时的一般疑问句。tomorrow是将来时间标志，一般将来时的一般疑问句将Will提前，后面动词用原形，故选A。","difficulty":1,"type":"choice"},{"kp":"e5","q":"Look at the dark clouds! It ______ rain soon.","options":["A. is","B. will","C. is going to","D. was"],"ans":2,"explain":"本题考查be going to表将来的用法。根据现在的迹象（乌云）推断即将发生的事，用be going to结构，表示有预兆的将来，故选C。","difficulty":2,"type":"choice"},{"kp":"e5","q":"My sister ______ twelve years old next month.","options":["A. is","B. was","C. will be","D. is being"],"ans":2,"explain":"本题考查一般将来时。next month是将来时间，表示将要发生的状态，用will be，故选C。","difficulty":1,"type":"choice"},{"kp":"e6","q":"Look! There are five ______ and three ______ on the farm.","options":["A. sheeps; childs","B. sheep; children","C. sheeps; children","D. sheep; child"],"ans":1,"explain":"本题考查名词复数。sheep（绵羊）单复数同形；child（孩子）的复数是children，是不规则变化，故选B。","difficulty":1,"type":"choice"},{"kp":"e6","q":"I brush my ______ twice a day, and I have two good ______ at school.","options":["A. tooth; friends","B. teeth; friend","C. teeth; friends","D. tooths; friends"],"ans":2,"explain":"本题考查名词复数。tooth（牙齿）的复数是teeth（不规则变化）；friend（朋友）的复数是friends（规则变化，直接加s），故选C。","difficulty":1,"type":"choice"},{"kp":"e6","q":"There are many ______ and ______ in the basket.","options":["A. tomatoes; potatoes","B. tomatos; potatos","C. tomatoes; potatos","D. tomatos; potatoes"],"ans":0,"explain":"本题考查以o结尾的名词复数。有生命的以o结尾的名词变复数时加es，tomato→tomatoes，potato→potatoes，故选A。（无生命的如photo→photos加s）","difficulty":2,"type":"choice"},{"kp":"e6","q":"These ______ are from different ______. They all study hard.","options":["A. boy; class","B. boys; classes","C. boies; classes","D. boys; class"],"ans":1,"explain":"本题考查名词复数。boy是元音字母+y结尾，直接加s变boys；class以s结尾，加es变classes，故选B。（辅音+y结尾才变y为i加es）","difficulty":2,"type":"choice"},{"kp":"e7","q":"Tina is ______ than any other student in her class. She always gets good grades.","options":["A. tall","B. taller","C. hard-working","D. more hard-working"],"ans":3,"explain":"本题考查比较级。than是比较级的标志，多音节形容词hard-working的比较级是在前面加more，构成more hard-working。根据\\"成绩好\\"可知是更努力，故选D。","difficulty":1,"type":"choice"},{"kp":"e7","q":"Which subject do you like ______, math, English or Chinese?","options":["A. well","B. better","C. best","D. good"],"ans":2,"explain":"本题考查最高级。在三者或三者以上进行比较时用最高级，本题在math, English, Chinese三科中选择，用最高级best，故选C。","difficulty":1,"type":"choice"},{"kp":"e7","q":"Tom runs ______ in our class. He won first place in the sports meeting.","options":["A. fast","B. faster","C. fastest","D. the fastest"],"ans":3,"explain":"本题考查副词最高级。in our class表示范围，副词最高级前可以加the也可以不加，但在初中阶段常用the+最高级表示\\"最……\\"，故选D。","difficulty":2,"type":"choice"},{"kp":"e7","q":"My hair is ______ than my sister\'s, but my eyes are ______ than hers.","options":["A. long; big","B. longer; bigger","C. longest; biggest","D. longer; biggest"],"ans":1,"explain":"本题考查比较级。than是比较级的标志，两者之间比较用比较级。long的比较级是longer，big的比较级是bigger（重读闭音节双写最后一个字母加er），故选B。","difficulty":2,"type":"choice"},{"kp":"e8","q":"—Hello! May I speak to Jim? —______","options":["A. I\'m Jim.","B. Who are you?","C. This is Jim speaking.","D. Yes, I am."],"ans":2,"explain":"本题考查电话用语。打电话时表示\\"我是……\\"要用\\"This is... speaking.\\"，不能用I\'m...，问对方是谁用\\"Who is that?\\"，故选C。","difficulty":1,"type":"choice"},{"kp":"e8","q":"—How are you today? —______","options":["A. I\'m Tom.","B. I\'m fine, thank you.","C. Nice to meet you.","D. I\'m 13 years old."],"ans":1,"explain":"本题考查日常问候。How are you?意为\\"你好吗？\\"，回答用\\"I\'m fine/OK, thank you.\\"，故选B。","difficulty":1,"type":"choice"},{"kp":"e8","q":"—Thank you for helping me with my English! —______","options":["A. It doesn\'t matter.","B. That\'s right.","C. You\'re welcome.","D. The same to you."],"ans":2,"explain":"本题考查感谢应答。回答别人的感谢用\\"You\'re welcome.\\"（不客气）。It doesn\'t matter.用于回答道歉；That\'s right.意为\\"那是对的\\"；The same to you.用于节日祝福回应，故选C。","difficulty":1,"type":"choice"},{"kp":"e8","q":"—Would you like to come to my birthday party this Saturday? —______","options":["A. Yes, I\'d love to.","B. I don\'t like parties.","C. No, I\'m busy.","D. That\'s all right."],"ans":0,"explain":"本题考查邀请应答。对\\"Would you like to...?\\"的邀请，肯定回答用\\"Yes, I\'d love/like to.\\"，礼貌拒绝用\\"I\'d love to, but...\\"，故选A。","difficulty":2,"type":"choice"},{"kp":"e1","q":"We have three ______ a day: breakfast, lunch and dinner.","options":["A. meals","B. classes","C. subjects","D. fruits"],"ans":0,"explain":"本题考查名词词义辨析。meal意为\\"一餐，一顿饭\\"，class意为\\"课\\"，subject意为\\"科目\\"，fruit意为\\"水果\\"。根据breakfast, lunch and dinner可知是一日三餐，故选A。","difficulty":1,"type":"choice"},{"kp":"e1","q":"Students should ______ the teacher carefully in class.","options":["A. hear","B. listen","C. listen to","D. hear to"],"ans":2,"explain":"本题考查动词辨析。listen to意为\\"听（强调动作，后接宾语）\\"，hear意为\\"听见（强调结果）\\"。\\"听老师讲课\\"用listen to the teacher，故选C。","difficulty":2,"type":"choice"}],"chinese":[{"kp":"c1","q":"下列词语中加点字的读音完全正确的一项是","options":["A. 酝酿(niàng) 窠巢(kē) 黄晕(yūn) 发髻(jì)","B. 吝啬(lìn) 棱镜(léng) 静谧(mì) 高邈(miǎo)","C. 莅临(wèi) 菜畦(qí) 竦峙(zhì) 碣石(jié)","D. 澹澹(chán) 萧瑟(sè) 残夜(cán) 夜郎(láng)"],"ans":1,"explain":"A项\\"黄晕\\"的\\"晕\\"应读yùn；C项\\"莅临\\"的\\"莅\\"应读lì；D项\\"澹澹\\"的\\"澹\\"应读dàn。B项全部正确。","difficulty":1,"type":"choice"},{"kp":"c1","q":"下列词语中没有错别字的一项是","options":["A. 喉咙 健壮 宽敞 花枝召展","B. 娇媚 化妆 骄媚 咄咄逼人","C. 屋檐 凄冷 化妆 淅淅沥沥","D. 干涩 草垛 铃当 翻来覆去"],"ans":2,"explain":"A项\\"花枝召展\\"应为\\"花枝招展\\"；B项\\"骄媚\\"应为\\"娇媚\\"；D项\\"铃当\\"应为\\"铃铛\\"。C项无错别字。","difficulty":1,"type":"choice"},{"kp":"c1","q":"下列加点字注音有误的一项是","options":["A. 确凿(záo) 菜畦(qí) 桑葚(shèn) 轻捷(jié)","B. 油蛉(líng) 斑蝥(máo) 缠络(lào) 攒成(cuán)","C. 收敛(liǎn) 脑髓(suǐ) 鉴赏(jiàn) 秕谷(bǐ)","D. 倜傥(tì) 盔甲(kuī) 锡箔(bó) 蝉蜕(tuì)"],"ans":1,"explain":"B项\\"缠络\\"的\\"络\\"应读luò，不是lào。","difficulty":2,"type":"choice"},{"kp":"c1","q":"下列词语书写完全正确的一项是","options":["A. 云宵 倘若 感慨 美不胜收","B. 搓捻 绽开 奥秘 由然而生","C. 悔恨 激荡 拼凑 截然不同","D. 企盼 惭槐 争执 疲倦不堪"],"ans":2,"explain":"A项\\"云宵\\"应为\\"云霄\\"；B项\\"由然而生\\"应为\\"油然而生\\"；D项\\"惭槐\\"应为\\"惭愧\\"。C项全部正确。","difficulty":1,"type":"choice"},{"kp":"c2","q":"依次填入下列句子横线处的词语，最恰当的一项是：春天像刚落地的娃娃，从头到脚都是新的，他____着；春天像小姑娘，花枝招展的，笑着，走着；春天像健壮的青年，有铁一般的胳膊和腰脚，他____着我们上前去。","options":["A. 生长 带动","B. 生长 引领","C. 生长 领着","D. 生长 引导"],"ans":2,"explain":"出自朱自清《春》原文：\\"春天像刚落地的娃娃，从头到脚都是新的，他生长着\\"\\"领着我们上前去\\"。\\"领着\\"更符合原文语境和口语化的表达特点。","difficulty":1,"type":"choice"},{"kp":"c2","q":"下列句子中加点词语使用不恰当的一项是","options":["A. 听到这个幽默的故事，他忍俊不禁地笑了起来。","B. 这个消息来得太突然，他一时间不知所措。","C. 他学习非常刻苦，成绩总是名列前茅，这是毋庸置疑的。","D. 春天的植物园里百花齐放，争奇斗艳，真是美不胜收。"],"ans":0,"explain":"A项\\"忍俊不禁\\"本身就是\\"忍不住笑\\"的意思，与后面的\\"笑了起来\\"语义重复，使用不恰当。","difficulty":2,"type":"choice"},{"kp":"c2","q":"依次填入下面横线处的词语，最恰当的一组是：成熟是一种明亮而不刺眼的光辉，一种圆润而不腻耳的音响，一种不再需要对别人____的从容，一种终于停止向周围申诉求告的大气，一种不理会哄闹的微笑，一种洗刷了偏激的____。","options":["A. 察言观色 淡然","B. 和颜悦色 淡然","C. 察言观色 淡漠","D. 和颜悦色 淡漠"],"ans":0,"explain":"\\"察言观色\\"指观察言语脸色来揣摩对方心意，符合语境；\\"淡然\\"形容不经心、不在意，是褒义，符合成熟的境界。\\"淡漠\\"指冷淡、不热情，多含贬义。","difficulty":2,"type":"choice"},{"kp":"c3","q":"下列句子没有语病的一项是","options":["A. 通过这次社会实践活动，使我们磨练了意志，增长了见识。","B. 止咳祛痰片的主要成分是远志、桔梗、贝母、氯化铵等配制而成的。","C. 一个人能否成为真正的读者，关键在于他青少年时期是否养成良好的读书习惯。","D. 为了防止这类交通事故不再发生，我们加强了交通安全的教育和管理。"],"ans":2,"explain":"A项缺主语，删去\\"通过\\"或\\"使\\"；B项句式杂糅，删去\\"配制而成的\\"；D项否定不当，删去\\"不\\"。C项两面对两面，正确。","difficulty":2,"type":"choice"},{"kp":"c3","q":"下列句子中没有语病的一项是","options":["A. 同学们写作文，要有真情实感，切忌不要胡编乱造。","B. 这位建筑师的出色工作和独特设计，已被有关单位采用。","C. 在本届世界杯决赛上，中国队将与美国队争夺冠亚军。","D. 近几年，他记录下来的文字大约有600页。"],"ans":3,"explain":"A项\\"切忌\\"与\\"不要\\"双重否定不当；B项\\"出色工作\\"与\\"采用\\"搭配不当；C项两队争夺的是冠军而非冠亚军。D项正确。","difficulty":2,"type":"choice"},{"kp":"c3","q":"下列句子中，没有语病、句意明确的一项是","options":["A. 我断定他可能生病了，所以今天没来上学。","B. 我们要养成爱读书，特别是读经典，读名著，让书香满城成为城市特色。","C. 不仅中草药能与一般抗菌素媲美，而且副作用小，成本也较低。","D. 只有走好人生的每一步，我们才能真正拥有一个灿烂的明天。"],"ans":3,"explain":"A项\\"断定\\"与\\"可能\\"矛盾；B项成分残缺，\\"养成\\"缺少宾语中心语，应在\\"读名著\\"后加\\"的习惯\\"；C项语序不当，\\"不仅\\"应放在\\"中草药\\"之后。D项正确。","difficulty":2,"type":"choice"},{"kp":"c4","q":"下列句子使用的修辞手法判断有误的一项是","options":["A. 那点薄雪好像忽然害了羞，微微露出点粉色。（拟人）","B. 飞流直下三千尺，疑是银河落九天。（比喻、夸张）","C. 怎样才能把一种劳作做到圆满呢？唯一的秘诀就是忠实。（反问）","D. 山舞银蛇，原驰蜡象，欲与天公试比高。（比喻、拟人）"],"ans":2,"explain":"C项是设问，自问自答，不是反问。反问是只问不答，答案暗含在问句中。","difficulty":1,"type":"choice"},{"kp":"c4","q":"\\"盼望着，盼望着，东风来了，春天的脚步近了\\"使用的修辞手法是","options":["A. 反复、拟人","B. 排比、拟人","C. 夸张、比喻","D. 反复、比喻"],"ans":0,"explain":"\\"盼望着，盼望着\\"是反复；\\"春天的脚步近了\\"把春天当作人来写，是拟人。","difficulty":1,"type":"choice"},{"kp":"c4","q":"对下列句子使用的修辞手法判断正确的一项是：①将军百战死，壮士十年归。②飞流直下三千尺，疑是银河落九天。③油蛉在这里低唱，蟋蟀们在这里弹琴。④他饿得都可以把一头大象给吃了。","options":["A. 互文 比喻 夸张 拟人","B. 互文 比喻、夸张 拟人 夸张","C. 对偶 比喻 拟人 夸张","D. 对偶 夸张 比喻 拟人"],"ans":1,"explain":"①是互文，指将军和壮士身经百战，有的战死，有的归来；②前句夸张，后句比喻；③\\"低唱\\"\\"弹琴\\"是拟人；④是夸张修辞。","difficulty":3,"type":"choice"},{"kp":"c5","q":"下列加点文言实词解释有误的一项是","options":["A. 人不知而不愠（生气，恼怒）","B. 吾日三省吾身（三次）","C. 学而不思则罔（迷惑，意思是感到迷茫而无所适从）","D. 思而不学则殆（疑惑）"],"ans":1,"explain":"B项\\"三\\"在文言文中多表示多次、虚数，不是实指\\"三次\\"。","difficulty":1,"type":"choice"},{"kp":"c5","q":"下列句子中加点词的意义相同的一组是","options":["A. 温故而知新 / 故曰：教学相长也","B. 学而时习之 / 其不善者而改之","C. 知之者不如好之者 / 逝者如斯夫","D. 可以为师矣 / 为人谋而不忠乎"],"ans":1,"explain":"A项故：旧的知识/所以；B项而：都表顺承；C项者：……的人/语气词；D项为：成为/替。B项相同。","difficulty":3,"type":"choice"},{"kp":"c5","q":"\\"学而时习之，不亦说乎\\"中\\"说\\"的意思是","options":["A. 说话","B. 高兴、愉快","C. 解释","D. 劝说"],"ans":1,"explain":"\\"说\\"通\\"悦\\"，是通假字，意思是高兴、愉快。","difficulty":1,"type":"choice"},{"kp":"c5","q":"下列句子朗读停顿划分正确的一项是","options":["A. 人不知/而不愠，不亦/君子乎","B. 温故/而知新，可以/为师矣","C. 知之者/不如好/之者","D. 三军可/夺帅也，匹夫不/可夺志也"],"ans":0,"explain":"B项正确停顿应为\\"温故/而知新，可/以为师矣\\"；C项应为\\"知之者/不如/好之者\\"；D项应为\\"三军/可夺帅也，匹夫/不可夺志也\\"。A项正确。","difficulty":2,"type":"choice"},{"kp":"c6","q":"记叙文的六要素是","options":["A. 时间、地点、人物、起因、经过、结果","B. 时间、地点、人物、环境、情节、主题","C. 时间、地点、人物、事件、原因、结局","D. 开头、发展、高潮、结局、人物、环境"],"ans":0,"explain":"记叙文六要素包括时间、地点、人物、事情的起因、经过、结果，是叙事性文章的基本要素。","difficulty":1,"type":"choice"},{"kp":"c6","q":"下列关于记叙文的叙述顺序，说法错误的是","options":["A. 顺叙是按照事情发展的先后顺序来写","B. 倒叙是把事情的结局或某个最重要、最突出的片段提到前面叙述","C. 插叙是在叙述中心事件的过程中，暂时中断叙述的线索，插入一段与主要情节相关的回忆或故事","D. 补叙就是插叙，两者没有区别"],"ans":3,"explain":"补叙和插叙不同。补叙是行文中用三两句话补充交代上文提到的人或事，一般没有情节；插叙则插入具体的情节，对主要情节起补充衬托作用。","difficulty":2,"type":"choice"},{"kp":"c6","q":"\\"他的面孔黄里带白，瘦得教人担心，好像大病新愈的人，但是精神很好，没有一点颓唐的样子。头发约莫一寸长，显然好久没剪了，却一根一根精神抖擞地直竖着。\\"这段文字主要使用的人物描写方法是","options":["A. 动作描写","B. 语言描写","C. 外貌描写","D. 心理描写"],"ans":2,"explain":"这段文字细致描写了人物的面孔、头发等外部特征，属于外貌描写（肖像描写）。","difficulty":1,"type":"choice"},{"kp":"c6","q":"对文章中环境描写的作用分析不当的一项是","options":["A. 交代故事发生的时间、地点、背景","B. 渲染气氛，烘托人物心情","C. 推动故事情节发展","D. 只是为了增加文章篇幅，没有实际作用"],"ans":3,"explain":"环境描写是记叙文重要的表达手段，具有交代背景、渲染气氛、烘托人物、推动情节等作用，不是多余的。","difficulty":1,"type":"choice"},{"kp":"c7","q":"下列标点符号使用正确的一项是","options":["A. \\"哎呀，真是美极了！\\"皇帝说：\\"我十分满意！\\"","B. 然后他呆在那儿，头靠着墙壁，话也不说，只向我们做了一个手势：\\"放学了，——你们走吧。\\"","C. 我不知道这条路是否能走通？但我仍然要坚定不移地走下去。","D. 参加会议的有教师、学生、和家长。"],"ans":1,"explain":"A项\\"说\\"后应该用逗号；C项虽有疑问词但不是疑问句，问号改为逗号；D项\\"和\\"前面的顿号多余。B项正确。","difficulty":2,"type":"choice"},{"kp":"c7","q":"下列句子中，标点符号使用有误的一项是","options":["A. 什么是故乡？生在哪里，哪里就是故乡。","B. 据说，在一千万只昆虫中才能发现一只这样的变异品种，自然是\\"物以稀为贵。\\"","C. 多么美丽啊，祖国的山河！","D. 写研究性文章跟文学创作不同，不能摊开稿纸搞\\"即兴\\"。"],"ans":1,"explain":"B项句号应该放在引号外面，因为这里是部分引用，引文作为自己话语的一部分。","difficulty":2,"type":"choice"},{"kp":"c7","q":"依次填入下面一段文字横线处的标点，最恰当的一项是：你读过篇幅短小却蕴含丰富的短诗吗？这种诗被称为____小诗____，五四运动后____它曾盛行一时，其中最引人注目的是冰心的《繁星》和《春水》____这两部作品以宣扬\\"爱的哲学\\"而著称。","options":["A. \\"\\" ， 。","B. 《》 ， 。","C. \\"\\" 、 ，","D. 《》 、 ，"],"ans":0,"explain":"\\"小诗\\"是特定称谓，用引号；\\"五四运动后\\"后面是句中停顿，用逗号；最后一句话完结，用句号。","difficulty":2,"type":"choice"},{"kp":"c8","q":"下列关于文学常识的表述，有误的一项是","options":["A. 《春》的作者是朱自清，字佩弦，现代著名散文家、诗人、学者。","B. 《论语》是儒家经典著作，记录了孔子及其弟子的言行。","C. 李白，字太白，号青莲居士，唐代浪漫主义诗人，被称为\\"诗圣\\"。","D. 《世说新语》是南朝宋临川王刘义庆组织编写的一部志人小说集。"],"ans":2,"explain":"李白被称为\\"诗仙\\"，\\"诗圣\\"是杜甫。","difficulty":1,"type":"choice"},{"kp":"c8","q":"\\"四书\\"不包括下列哪一部著作","options":["A. 《大学》","B. 《春秋》","C. 《中庸》","D. 《孟子》"],"ans":1,"explain":"\\"四书\\"指的是《大学》《中庸》《论语》《孟子》，《春秋》是\\"五经\\"之一。","difficulty":1,"type":"choice"},{"kp":"c8","q":"下列作家与作品对应正确的一项是","options":["A. 鲁迅——《济南的冬天》","B. 老舍——《从百草园到三味书屋》","C. 海伦·凯勒——《再塑生命的人》","D. 王湾——《天净沙·秋思》"],"ans":2,"explain":"A项《济南的冬天》作者是老舍；B项《从百草园到三味书屋》作者是鲁迅；D项《天净沙·秋思》作者是马致远。C项正确。","difficulty":1,"type":"choice"},{"kp":"c8","q":"下列有关文学文化常识的说法，错误的一项是","options":["A. \\"尊君\\"是对别人父亲的尊称，\\"家君\\"是对别人谦称自己的父亲。","B. 《闻王昌龄左迁龙标遥有此寄》中\\"左迁\\"指降职贬官。","C. 孔子，名丘，字仲尼，战国时期鲁国人，儒家学派创始人。","D. 《天净沙·秋思》作者马致远，元代戏曲作家、散曲家。天净沙是曲牌名。"],"ans":2,"explain":"孔子是春秋时期鲁国人，不是战国时期。","difficulty":2,"type":"choice"},{"kp":"c1","q":"下列词语中，加点字读音全部正确的一项是","options":["A. 朗润(rùn) 宛转(wǎn) 抖擞(shù) 镶上(xiāng)","B. 吝啬(sè) 粗犷(kuàng) 侍弄(shì) 憔悴(cuì)","C. 絮叨(dao) 诀别(jué) 淡雅(yǎ) 烂漫(màn)","D. 分歧(qí) 一霎(chà) 粼粼(lín) 匿笑(nì)"],"ans":2,"explain":"A项\\"抖擞\\"的\\"擞\\"应读sǒu；B项\\"粗犷\\"的\\"犷\\"应读guǎng；D项\\"一霎\\"的\\"霎\\"应读shà。C项正确。","difficulty":2,"type":"choice"},{"kp":"c2","q":"下列句子中加点成语使用恰当的一项是","options":["A. 他在大会上的即兴讲话逻辑严密、语无伦次，博得了与会专家的一致好评。","B. 正因为他具有海誓山盟的崇高理想，才在工作中取得了出色的成就。","C. 它们发现自己陷入了峰回路转的绝境，一片惊慌，胡乱蹦跳。","D. 学生的学习水平是参差不齐的，因此教师的教学要尽可能做到因材施教。"],"ans":3,"explain":"A项\\"语无伦次\\"指话讲得乱七八糟，与\\"逻辑严密\\"矛盾；B项\\"海誓山盟\\"多指男女相爱时立下的誓言，用在这里对象不当；C项\\"峰回路转\\"形容山水名胜路径曲折复杂，也比喻事情出现转机，与\\"绝境\\"矛盾。D项正确。","difficulty":2,"type":"choice"},{"kp":"c3","q":"下列句子中没有语病的一项是","options":["A. 过了一会儿，汽车突然渐渐地放慢了速度。","B. 由于革命潮流的冲击和进步思想的影响，使他形成了初步的民主主义思想。","C. 我们要引导青少年用美的眼光去看世界，用美的心灵去感受世界。","D. 他的学习成绩不仅在全校拔尖，而且在班里也名列前茅。"],"ans":2,"explain":"A项\\"突然\\"与\\"渐渐\\"矛盾；B项缺主语，删去\\"由于\\"或\\"使\\"；D项逻辑顺序不当，应改为\\"不仅在班里名列前茅，而且在全校拔尖\\"。C项正确。","difficulty":2,"type":"choice"},{"kp":"c4","q":"下列句子没有使用比喻修辞的一项是","options":["A. 他长得很像他的父亲。","B. 那又浓又翠的景色，简直就是一幅青山绿水画。","C. 春风像慈祥的母亲，拂着你的脸颊，使你感到舒畅。","D. 知识是沙石下的泉水，挖得越深，泉水越清。"],"ans":0,"explain":"A项\\"像\\"表示比较，不是比喻句。比喻句必须有本体和喻体，且两者是不同性质的事物。","difficulty":1,"type":"choice"},{"kp":"c5","q":"下列文言句子翻译有误的一项是","options":["A. 温故而知新，可以为师矣。翻译：温习学过的知识，可以得到新的理解和体会，就可以凭借这一点做老师了。","B. 三人行，必有我师焉。翻译：三个人一起走路，其中一定有可以做我老师的人。","C. 逝者如斯夫，不舍昼夜。翻译：逝去的一切像河水一样流去，日夜不停。","D. 学而不思则罔，思而不学则殆。翻译：只读书却不思考，就会迷茫而无所得；只是空想却不读书，就会疑惑。"],"ans":1,"explain":"B项\\"三人\\"在文言文中是虚指，指几个人，不是确指\\"三个人\\"。","difficulty":2,"type":"choice"},{"kp":"c6","q":"《散步》一文中，\\"我的母亲又熬过了一个严冬\\"中的\\"熬\\"字用得很好，下列对这个字理解最准确的一项是","options":["A. 冬天太冷了，母亲难以忍受","B. 母亲在冬天生活很艰难","C. 表现母亲度过严冬的不容易，同时也体现了\\"我\\"为母亲平安度过冬天而庆幸","D. 母亲不喜欢冬天"],"ans":2,"explain":"\\"熬\\"字既写出了母亲忍受痛苦度过严冬的艰难，又写出了\\"我\\"为母亲最终平安无恙而庆幸的心情。","difficulty":2,"type":"choice"},{"kp":"c8","q":"下列关于《朝花夕拾》的表述，错误的一项是","options":["A. 《朝花夕拾》原名《旧事重提》，是鲁迅的回忆性散文集。","B. 《从百草园到三味书屋》《阿长与〈山海经〉》都出自这部集子。","C. 这部作品记录了鲁迅从幼年到青年时期的生活道路和心路历程。","D. 《朝花夕拾》是一部小说集，共收录了十篇小说。"],"ans":3,"explain":"《朝花夕拾》是回忆性散文集，不是小说集。","difficulty":1,"type":"choice"},{"kp":"c2","q":"在下面语段中，依次填入关联词语最恰当的一项是：____说早期的环境污染是由于人类认识水平的历史局限，____近十多年来随着人类活动范围的扩大和全球经济一体化进程的加速，国际污染日益严重了。这不是某个国家能独自解决的，____国际间的共同协调和联合行动，____实现人类与自然的重新和谐。","options":["A. 如果 那么 只要 就能","B. 尽管 那么 只有 才能","C. 尽管 所以 只要 就","D. 如果 那么 只有 才能"],"ans":3,"explain":"第一、二分句是假设关系，用\\"如果……那么……\\"；第三、四分句是条件关系，表示必要条件，用\\"只有……才能……\\"。","difficulty":3,"type":"choice"}],"sports":[{"kp":"s1","q":"运动前热身的主要目的是什么？","options":["让身体出汗","提高体温、激活肌肉、预防运动损伤","消耗体力","让心跳减慢"],"ans":1,"explain":"热身可以提高身体温度，增加关节灵活性，激活肌肉群，使心血管系统逐渐适应运动状态，有效预防运动损伤。","difficulty":1,"type":"choice"},{"kp":"s1","q":"以下哪种热身方式最适合在跑步前进行？","options":["直接开始快跑","原地高抬腿、小步跑、关节活动","静坐5分钟","做大量力量训练"],"ans":1,"explain":"跑步前应进行动态热身，如原地高抬腿、小步跑、踝关节环绕等，逐步提高心率和肌肉温度。","difficulty":1,"type":"choice"},{"kp":"s2","q":"下列哪项运动属于有氧运动？","options":["举重","慢跑","俯卧撑","跳远"],"ans":1,"explain":"有氧运动是指人体在氧气充分供应情况下进行的运动，慢跑、游泳、骑自行车等都属于典型有氧运动，能有效提升心肺耐力。","difficulty":1,"type":"choice"},{"kp":"s2","q":"有氧运动每次至少持续多长时间才能达到较好的锻炼效果？","options":["1分钟","20-30分钟以上","5分钟","10秒"],"ans":1,"explain":"有氧运动需要持续20-30分钟以上，才能有效燃烧脂肪、增强心肺功能，建议初中生每次运动30-60分钟。","difficulty":2,"type":"choice"},{"kp":"s3","q":"初中生进行力量训练时，以下哪种做法是正确的？","options":["使用大重量负重训练","以自重训练为主，如俯卧撑、深蹲","每天都训练同一个部位","憋气完成动作"],"ans":1,"explain":"初中生骨骼肌肉尚未发育完全，应以自重训练为主，避免大负重，注意动作标准和呼吸配合，劳逸结合。","difficulty":2,"type":"choice"},{"kp":"s3","q":"俯卧撑主要锻炼哪块肌肉？","options":["大腿肌肉","胸肌、肱三头肌和核心肌群","小腿肌肉","颈部肌肉"],"ans":1,"explain":"俯卧撑是经典的上肢推力训练，主要锻炼胸大肌、肱三头肌、三角肌前束，同时核心肌群也会参与稳定身体。","difficulty":1,"type":"choice"},{"kp":"s4","q":"运动后拉伸放松的最佳时间是？","options":["运动后立即进行","运动后1小时再做","运动前做","不需要拉伸"],"ans":0,"explain":"运动后肌肉温度较高，此时进行静态拉伸效果最好，能帮助放松肌肉、减少乳酸堆积、增加柔韧性。","difficulty":1,"type":"choice"},{"kp":"s4","q":"以下哪种拉伸方式是错误的？","options":["静态拉伸保持15-30秒","弹震式拉伸（快速反复抖动）","拉伸时呼吸平稳","拉伸到有轻微牵拉感即可"],"ans":1,"explain":"弹震式拉伸容易造成肌肉拉伤，运动后应采用静态拉伸，缓慢拉伸到有轻微牵拉感并保持，避免疼痛。","difficulty":2,"type":"choice"},{"kp":"s7","q":"运动中如果出现岔气（侧腹痛），应该怎么处理？","options":["继续剧烈运动","减速、加深呼吸、按压疼痛部位","立即躺下","大量喝水"],"ans":1,"explain":"岔气多由呼吸肌痉挛引起，应降低运动强度，加深呼吸，用手按压疼痛部位，调整呼吸节奏，待缓解后再决定是否继续。","difficulty":2,"type":"choice"},{"kp":"s7","q":"运动中补水的正确方式是？","options":["口渴时一次性大量饮水","少量多次，每隔15-20分钟喝几口","运动中不能喝水","只喝冰水"],"ans":1,"explain":"运动中应少量多次补水，每次100-200ml，避免一次性大量饮水增加心脏和肠胃负担，水温以常温或微凉为宜。","difficulty":1,"type":"choice"},{"kp":"s7","q":"运动前多久不宜进食过饱？","options":["10分钟","30分钟-1小时","5分钟","可以吃饱马上运动"],"ans":1,"explain":"运动前1小时内不宜进食过饱，否则会影响消化，容易引起腹痛、呕吐等不适，空腹或过饱状态都不适合剧烈运动。","difficulty":1,"type":"choice"},{"kp":"s7","q":"踝关节扭伤后正确的紧急处理方法是？","options":["马上揉搓、热敷","立即停止运动、冰敷、加压包扎、抬高患肢","继续活动","不管它自然恢复"],"ans":1,"explain":"踝关节扭伤应遵循RICE原则：Rest（休息）、Ice（冰敷）、Compression（加压）、Elevation（抬高），24小时内避免热敷和揉搓。","difficulty":2,"type":"choice"},{"kp":"s5","q":"跳绳时正确的落地方式是？","options":["全脚掌重重落地","前脚掌着地、膝盖微屈缓冲","脚后跟先落地","直腿落地"],"ans":1,"explain":"跳绳时应用前脚掌起跳和落地，膝盖自然微屈缓冲，避免脚后跟落地和直腿跳，减少对关节的冲击力。","difficulty":1,"type":"choice"},{"kp":"s5","q":"跳绳时绳子的长度应该调节到什么位置最合适？","options":["越长越好","单脚踩绳，手柄到腋下位置","越短越好","手柄到腰部位置"],"ans":1,"explain":"合适的绳长是：单脚踩住绳子中间，双手握柄向上拉，手柄位置到达腋下附近较为合适，初学者可稍长一些。","difficulty":2,"type":"choice"},{"kp":"s5","q":"以下关于跳绳的说法错误的是？","options":["跳绳能有效提高心肺功能","跳绳时跳得越高越好","跳绳前要活动手腕脚踝","初学者可以从单摇开始"],"ans":1,"explain":"跳绳时跳起高度以绳子能通过脚下为宜（约3-5cm），跳得过高会增加关节负担，浪费体力，降低运动效率。","difficulty":2,"type":"choice"},{"kp":"s2","q":"下列关于跑步姿势的描述，正确的是？","options":["身体后仰，脚跟着地","上身挺直稍前倾，用中前脚掌落地","低头弯腰跑","左右摇晃身体"],"ans":1,"explain":"正确跑步姿势：上身自然挺直稍前倾，目光平视前方，手臂自然摆动，用中前脚掌或全脚掌落地缓冲，避免过度跨步。","difficulty":2,"type":"choice"},{"kp":"s2","q":"以下哪个是跑步时常见的错误呼吸方式？","options":["口鼻配合呼吸","节奏均匀地呼吸","全程憋气不呼吸","两三步一吸、两三步一呼"],"ans":2,"explain":"跑步时应保持有节奏的呼吸，口鼻配合，一般采用2-3步一吸、2-3步一呼的节奏，全程憋气会导致缺氧和疲劳。","difficulty":1,"type":"choice"},{"kp":"s6","q":"立定跳远主要考查人体的什么能力？","options":["柔韧性","下肢爆发力和身体协调能力","平衡能力","心肺耐力"],"ans":1,"explain":"立定跳远是测试下肢爆发力和全身协调能力的经典项目，需要下肢蹬地力量、腰腹力量和上肢摆动的协调配合。","difficulty":1,"type":"choice"},{"kp":"s6","q":"立定跳远落地时，正确的动作是？","options":["膝盖伸直、重心后移","屈膝缓冲、重心前移","直接坐在地上","单脚落地"],"ans":1,"explain":"立定跳远落地时应屈膝缓冲，同时小腿前伸，重心前移，避免后坐，双脚同时落地，这样既能跳得远又能保护膝盖。","difficulty":2,"type":"choice"},{"kp":"s6","q":"立定跳远的预摆动作要点是？","options":["手臂随便摆动","两臂自然前后摆动，两腿配合弹性屈伸","只摆腿不摆臂","身体僵硬不动"],"ans":1,"explain":"预摆时两臂自然前后摆动，两腿随之弹性屈伸，摆臂与呼吸配合，起跳前两臂向后上方摆起，两腿屈膝半蹲为起跳蓄力。","difficulty":2,"type":"choice"},{"kp":"s8","q":"篮球运动中，传球时应该用什么部位发力？","options":["只用手指","手腕和手指力量配合手臂协调发力","只用大臂","只用小臂"],"ans":1,"explain":"篮球传球需要手腕、手指的弹拨力量配合手臂协调发力，指腕控制球的方向和旋转，保证传球准确到位。","difficulty":2,"type":"choice"},{"kp":"s8","q":"足球运球时，应该用脚的哪个部位触球比较合适？","options":["脚尖捅球","脚内侧和正脚背","脚后跟","脚底踩球"],"ans":1,"explain":"足球运球常用脚内侧（短距离、变向）和正脚背（直线快速运球），能更好地控制球的方向和力量。","difficulty":1,"type":"choice"},{"kp":"s8","q":"篮球运动中，以下哪种行为属于犯规？","options":["投篮","传球","打手推人","运球"],"ans":2,"explain":"篮球比赛中，打手、推人、拉人、阻挡等身体接触属于侵人犯规，应遵守规则，文明比赛，注意安全。","difficulty":1,"type":"choice"},{"kp":"s7","q":"进行体育锻炼时，以下哪种做法是错误的？","options":["穿合适的运动服和运动鞋","运动前做好热身","身体不适时坚持剧烈运动","运动后做放松活动"],"ans":2,"explain":"身体不适（如感冒、发烧、严重疲劳）时应暂停或减少运动，强行锻炼会加重身体负担，甚至引发危险。","difficulty":1,"type":"choice"},{"kp":"s3,s4","q":"关于运动频率，以下说法正确的是？","options":["每天都要练到筋疲力尽","每周锻炼3-5次，劳逸结合，循序渐进","一个月练一次就行","想起来才练一次"],"ans":1,"explain":"科学的运动频率是每周3-5次，每次30-60分钟，循序渐进，给身体恢复的时间，过度训练反而有害健康。","difficulty":2,"type":"choice"},{"kp":"s2,s7","q":"运动后出现肌肉酸痛（延迟性肌肉酸痛），以下哪种处理方式不合适？","options":["轻柔拉伸","适当休息和轻度活动","继续高强度训练同一部位","热敷促进血液循环"],"ans":2,"explain":"延迟性肌肉酸痛一般在运动后24-72小时出现，应适当休息、轻柔拉伸、轻度活动或热敷，继续高强度训练会加重肌肉损伤。","difficulty":3,"type":"choice"}]}');
const READING_BANK = JSON.parse('{"math":[],"english":[{"id":"read1_en","title":"My First Day at School","content":"Today is my first day at middle school. I am very happy but a little nervous. My new teacher, Ms. Wang, is kind and friendly. She tells us about our class rules. Then I meet a girl named Li Mei. She sits next to me. We talk about our favorite subjects. I like English and she likes math. After class, we play games together on the playground. I think I will enjoy my school life here.","questions":[{"q":"What is the main idea of this passage?","options":["A. The writer\'s favorite subject","B. The writer\'s first day at middle school","C. How to play games on the playground","D. A new teacher named Ms. Wang"],"ans":1,"explain":"主旨大意题。全文讲述了作者第一天上学的经历，包括见到新老师、认识新朋友等，因此选B。","type":"reading_question","kp":"e9","difficulty":2},{"q":"Who sits next to the writer?","options":["A. Ms. Wang","B. A boy","C. Li Mei","D. No one"],"ans":2,"explain":"细节理解题。根据文中Then I meet a girl named Li Mei. She sits next to me.可知，李梅坐在作者旁边，选C。","type":"reading_question","kp":"e9","difficulty":2},{"q":"What does the underlined word \\"nervous\\" probably mean in Chinese?","options":["A. 紧张的","B. 兴奋的","C. 悲伤的","D. 愤怒的"],"ans":0,"explain":"词义猜测题。根据上下文，第一天上学应该是既高兴又有点紧张，nervous意为紧张的，选A。","type":"reading_question","kp":"e9","difficulty":2}],"type":"reading"},{"id":"read2_en","title":"The Basketball Game","content":"Last Friday, our class had a basketball game against Class Two. Everyone was excited. My best friend Zhang Wei is on our team. He practices basketball every day after school, so he plays very well. The game started at 4:00 p.m. At first, Class Two was winning. Their captain, Da Ming, is a tall and strong player. But our team didn\'t give up. With five minutes left, Zhang Wei scored three points and helped us win. We were so happy that we jumped and cheered. After the game, we bought some ice cream for Zhang Wei. He is really a hero in our heart.","questions":[{"q":"When did the basketball game take place?","options":["A. Last Monday","B. Last Friday","C. Last Saturday","D. Last Sunday"],"ans":1,"explain":"细节理解题。根据第一句Last Friday, our class had a basketball game against Class Two.可知，比赛是在上周五，选B。","type":"reading_question","kp":"e9","difficulty":2},{"q":"Why does Zhang Wei play basketball well?","options":["A. He is tall and strong","B. He practices every day","C. His father is a coach","D. He is the captain"],"ans":1,"explain":"细节理解题。根据文中He practices basketball every day after school, so he plays very well.可知，他每天练习所以球打得好，选B。","type":"reading_question","kp":"e9","difficulty":2},{"q":"What can we infer from the passage?","options":["A. Our team won the game easily","B. Da Ming is on our team","C. We were disappointed after the game","D. Teamwork and never giving up are important"],"ans":3,"explain":"推理判断题。根据文中But our team didn\'t give up. With five minutes left, Zhang Wei scored...可知，不放弃和团队合作很重要，选D。","type":"reading_question","kp":"e9","difficulty":2},{"q":"What does the underlined word \\"scored\\" mean in Chinese?","options":["A. 传球","B. 投篮得分","C. 犯规","D. 抢篮板"],"ans":1,"explain":"词义猜测题。根据上下文，scored three points意为得三分，选B。","type":"reading_question","kp":"e9","difficulty":2}],"type":"reading"},{"id":"read3_en","title":"A Weekend to Remember","content":"I used to hate doing housework because I thought it was boring and tiring. However, something changed my mind last weekend. My parents had to work overtime on Saturday, so they left me a note asking me to clean the house and cook dinner. At first, I wanted to order takeout, but then I decided to try cooking by myself. I followed the recipes online and made tomato and egg noodles with some vegetables. When my parents came back, they were surprised to see the tidy house and the warm meal on the table. My mother hugged me and said I had grown up. That evening, I felt a strong sense of satisfaction. Now I understand that sharing housework is not only a way to help my parents, but also a responsibility as a family member.","questions":[{"q":"What is the best title for this passage?","options":["A. How to Cook Noodles","B. My Busy Parents","C. A Lesson from Housework","D. Why I Hate Cooking"],"ans":2,"explain":"主旨大意题。文章讲述了作者从讨厌做家务到主动做家务并从中领悟道理的故事，C选项最贴合主旨，选C。","type":"reading_question","kp":"e9","difficulty":2},{"q":"Why did the writer\'s parents ask him to do housework?","options":["A. They wanted to punish him","B. They had to work overtime","C. They were sick in bed","D. They wanted to test his cooking skills"],"ans":1,"explain":"细节理解题。根据文中My parents had to work overtime on Saturday, so they left me a note asking me to clean the house and cook dinner.可知，父母要加班所以让作者做家务，选B。","type":"reading_question","kp":"e9","difficulty":2},{"q":"What can we learn from the passage?","options":["A. The writer is good at cooking","B. Parents should do all the housework","C. Takeout food is not delicious","D. Doing housework helps us understand responsibility"],"ans":3,"explain":"推理判断题。根据文章最后一句Now I understand that sharing housework is not only a way to help my parents, but also a responsibility as a family member.可推断出做家务能让我们理解责任，选D。","type":"reading_question","kp":"e9","difficulty":2},{"q":"What does the underlined word \\"satisfaction\\" probably mean?","options":["A. 疲惫感","B. 满足感","C. 挫败感","D. 饥饿感"],"ans":1,"explain":"词义猜测题。根据上下文，作者做了饭、打扫了房间，父母很感动，他应该感到强烈的满足感，satisfaction意为满足感，选B。","type":"reading_question","kp":"e9","difficulty":2}],"type":"reading"}],"chinese":[{"id":"read1_zh","title":"秋日的黄昏","author":"佚名","content":"秋日的黄昏，总是来得格外温柔。天边的晚霞像打翻了的颜料盘，橙红、绛紫、浅金交织在一起，把半边天空染得绚烂夺目。晚风带着桂花的甜香，轻轻拂过脸庞，吹落几片金黄的银杏叶，它们像蝴蝶般在空中旋舞，最后静静落在青石板路上。\\n远处的稻田翻涌着金色的波浪，农人扛着锄头走在田埂上，身影被夕阳拉得很长。炊烟从农家的烟囱里袅袅升起，与暮色融在一起，给小山村披上了一层朦胧的轻纱。归鸟扑棱着翅膀掠过天际，留下几声清脆的鸣叫。\\n我坐在老槐树下，看着这一切，心里满是宁静。原来最动人的风景，不在远方，而在这寻常的黄昏里，在每一片落叶、每一缕炊烟中。","questions":[{"q":"这篇文章主要描写的是什么时候的景色？","options":["春日的清晨","夏日的午后","秋日的黄昏","冬日的夜晚"],"ans":2,"explain":"文章标题和开头都明确点出描写的是“秋日的黄昏”。","type":"reading_question","kp":"c9","difficulty":2},{"q":"文中画线句“它们像蝴蝶般在空中旋舞”中的“它们”指的是什么？","options":["晚霞","银杏叶","归鸟","炊烟"],"ans":1,"explain":"前文提到“吹落几片金黄的银杏叶”，紧接着用比喻描写银杏叶飘落的姿态，所以“它们”指银杏叶。","type":"reading_question","kp":"c9","difficulty":2},{"q":"下面对文章写法的分析，不正确的一项是？","options":["文章按照由远及近的顺序描写景物","文中多处运用比喻的修辞手法","文章从视觉、嗅觉、听觉多角度描写","结尾直抒胸臆，表达了对秋日黄昏的喜爱"],"ans":0,"explain":"文章先写天边的晚霞（远景），再写近处的银杏叶，然后又写远处的稻田和炊烟，并非严格按由远及近的顺序。","type":"reading_question","kp":"c9","difficulty":2},{"q":"这篇文章表达了作者怎样的情感？","options":["对秋天萧瑟景象的伤感","对秋日黄昏美景的喜爱与赞美","对农人辛勤劳作的同情","对远方风景的向往"],"ans":1,"explain":"作者用“温柔”“绚烂夺目”“动人”等词语描绘景色，结尾说“心里满是宁静”“最动人的风景”，直接表达了对秋日黄昏的喜爱与赞美。","type":"reading_question","kp":"c9","difficulty":2}],"type":"reading"},{"id":"read2_zh","title":"一本旧字典","author":"佚名","content":"初二上学期，我从乡下转学到城里。第一次语文课前，我翻遍书包才发现，新买的《新华字典》落在了老家的桌子上。望着同学们桌上崭新的字典，我窘迫得红了脸，只能低着头假装翻书。\\n“用我的吧。”一本封面磨得发白的字典轻轻推到我面前。我抬头，看见同桌林晓明亮的眼睛。整节课，我们头挨着头，共用那本旧字典，她还特意把字推到我这边。\\n下课后，我连声道谢，她笑着说：“我爷爷说，字典就是用来帮人的。这本旧字典陪了我五年，现在它又多了一个新朋友。”\\n学期结束时，我也买了一本新字典送给林晓。但那本旧字典我始终记得——它不仅帮我认识了陌生的字词，更让我在陌生的环境里，感受到了第一份温暖。","questions":[{"q":"“我”为什么在语文课上感到窘迫？","options":["没有带语文课本","新字典落在老家了","不会读课文","被老师批评了"],"ans":1,"explain":"文章开头明确写“新买的《新华字典》落在了老家的桌子上”，这是“我”窘迫的原因。","type":"reading_question","kp":"c9","difficulty":2},{"q":"文中画线句“一本封面磨得发白的字典轻轻推到我面前”体现了林晓怎样的特点？","options":["粗心大意","善良热心","谦虚好学","勤俭节约"],"ans":1,"explain":"在“我”遇到困难时，林晓主动把自己的字典借给“我”，体现了她善良热心、乐于助人的品质。","type":"reading_question","kp":"c9","difficulty":2},{"q":"对文章最后一段理解不正确的一项是？","options":["“我”买新字典送给林晓是为了回报她的帮助","那本旧字典对“我”来说意义非凡","“我”很怀念在乡下的生活","林晓的帮助让“我”感受到了温暖"],"ans":2,"explain":"最后一段主要表达对林晓帮助的感激，没有提到怀念乡下生活。","type":"reading_question","kp":"c9","difficulty":2},{"q":"这篇文章的主旨是什么？","options":["告诉我们要爱护学习用品","赞美同学之间真诚互助的美好情谊","说明字典是学习的好帮手","讲述转学遇到的困难"],"ans":1,"explain":"文章通过讲述林晓借字典给“我”的故事，赞美了同学之间真诚互助的美好情谊，这是文章的核心主旨。","type":"reading_question","kp":"c9","difficulty":2}],"type":"reading"},{"id":"read3_zh","title":"会\\"害羞\\"的含羞草","author":"佚名","content":"你见过一碰就会\\"害羞\\"地合拢叶子的植物吗？它就是含羞草。\\n含羞草是一种多年生草本植物，原产于南美洲热带地区，如今在我国各地都很常见。它的叶子是羽状复叶，由许多小叶片整齐排列组成。只要轻轻触碰一下，小叶片就会立刻向上闭合，紧接着整片叶子也垂了下来，就像一个害羞的小姑娘低下了头，过了几分钟才慢慢恢复原状。\\n为什么含羞草会\\"害羞\\"呢？原来，它的叶柄基部有一个膨大的器官叫\\"叶枕\\"，叶枕里有许多薄壁细胞，这些细胞对外界刺激非常敏感。一旦叶子被触碰，刺激就会迅速传到叶枕，薄壁细胞里的细胞液就会向细胞间隙流动，细胞的膨胀能力减弱，叶片就闭合下垂了。这是含羞草长期适应环境形成的自我保护本领，可以躲避狂风暴雨和动物的伤害。\\n含羞草不仅有趣，还能入药，有清热利尿、化痰止咳的功效呢。","questions":[{"q":"含羞草的原产地是哪里？","options":["亚洲热带地区","南美洲热带地区","非洲热带地区","欧洲温带地区"],"ans":1,"explain":"文章第二段明确提到含羞草“原产于南美洲热带地区”。","type":"reading_question","kp":"c9","difficulty":2},{"q":"含羞草\\"害羞\\"的关键器官是什么？","options":["叶片","叶柄","叶枕","茎"],"ans":2,"explain":"文章第三段说明，含羞草叶柄基部的“叶枕”是让它能够闭合叶片的关键器官。","type":"reading_question","kp":"c9","difficulty":2},{"q":"含羞草一碰就合拢叶子，最根本的原因是什么？","options":["它真的会害羞","叶枕的薄壁细胞液流动导致细胞膨胀能力变化","它的叶子很脆弱","这是一种光合作用"],"ans":1,"explain":"文章科学解释了原理：触碰后叶枕薄壁细胞的细胞液流动，细胞膨胀能力减弱，导致叶片闭合。","type":"reading_question","kp":"c9","difficulty":2},{"q":"下面对文章内容的理解，正确的一项是？","options":["含羞草是一种一年生木本植物","含羞草的叶子被触碰后会永远闭合","含羞草合拢叶子是一种自我保护本领","含羞草只有观赏价值，没有其他用途"],"ans":2,"explain":"文章第三段说“这是含羞草长期适应环境形成的自我保护本领”；其他选项都与原文不符：它是多年生草本，叶子几分钟后会恢复，还能入药。","type":"reading_question","kp":"c9","difficulty":2}],"type":"reading"}],"sports":[]}');

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function loadUser() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      user = JSON.parse(saved);
      let needSave = false;
      if (!user.subject_mastery) user.subject_mastery = {};
      for (const s of Object.keys(SUBJECTS)) {
        if (!user.subject_mastery[s]) user.subject_mastery[s] = {};
        for (const kp of KNOWLEDGE_MAP[s] || []) {
          if (!user.subject_mastery[s][kp.id]) {
            user.subject_mastery[s][kp.id] = {
              mastery: 0.0, correct_count: 0, wrong_count: 0,
              next_review: new Date().toISOString(), review_count: 0,
              ease_factor: 2.5, interval_days: 1
            };
            needSave = true;

      }
      if (!user.daily_tasks) user.daily_tasks = {};
      const today = todayStr();
      if (!user.daily_tasks[today]) {

  user = {

function resetUser() {

    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }

function generateDailyTasks(weekday) {
  const plan = DEFAULT_WEEKLY_PLAN[weekday] || DEFAULT_WEEKLY_PLAN[0];
  const now = Date.now();
  return plan.map((item, i) => ({
    id: 'task_' + now + '_' + i,
    type: item.type, subject: item.subject,
    title: item.title, desc: item.desc, duration: item.duration,
    completed: false, completed_at: null
  }));
}

function calculateLevel(xp) {
  let level = 1, remaining = xp, threshold = 100;
  while (remaining >= threshold) {
    remaining -= threshold;
    level++;
    threshold = Math.floor(threshold * 1.5);
  }
  return { level, current_xp: remaining, xp_needed: threshold };
}

function spacedRepetitionUpdate(masteryData, correct) {
  const now = new Date();
  let ef = masteryData.ease_factor || 2.5;
  let interval = masteryData.interval_days || 1;
  
  if (correct) {
    if (masteryData.review_count === 0) interval = 1;
    else if (masteryData.review_count === 1) interval = 3;
    else interval = Math.round(interval * ef);
    ef = ef + 0.1;
    masteryData.mastery = Math.min(1.0, (masteryData.mastery || 0) + 0.12);
  } else {
    interval = 1;
    ef = Math.max(1.3, ef - 0.2);
    masteryData.mastery = Math.max(0.0, (masteryData.mastery || 0) - 0.08);
  }
  
  masteryData.ease_factor = Math.round(ef * 100) / 100;
  masteryData.interval_days = interval;
  masteryData.next_review = new Date(now.getTime() + interval * 86400000).toISOString();
  masteryData.review_count = (masteryData.review_count || 0) + 1;
  return masteryData;
}

function recommendQuestions(subject, count) {
  const mastery = user.subject_mastery[subject] || {};
  const availableQs = QUESTION_BANK[subject] ? QUESTION_BANK[subject].slice() : [];
  const availableReadings = READING_BANK[subject] ? READING_BANK[subject].slice() : [];
  
  const resultItems = [];
  const wrongKpIds = new Set();
  for (const w of user.wrong_questions || []) {
    if (w.subject === subject) wrongKpIds.add(w.kp);
  }
  
  const scoredQs = [];
  const now = new Date();
  
  for (const q of availableQs) {
    const kpId = q.kp;
    if (!kpId) continue;
    const kpMastery = (mastery[kpId] && mastery[kpId].mastery) || 0.5;
    const nextReviewStr = mastery[kpId] && mastery[kpId].next_review;
    let needsReview = 1.0;
    const isWrong = wrongKpIds.has(kpId);
    
    if (nextReviewStr) {
      const nextReview = new Date(nextReviewStr);
      if (now >= nextReview) {
        needsReview = isWrong ? 3.0 : 2.0;
      } else {
        needsReview = 0.5;
      }
    }
    
    const score = (1 - kpMastery) * needsReview * (isWrong ? 2.5 : 1.0) * (0.8 + Math.random() * 0.4);
    scoredQs.push({ score, q, kpId, type: 'choice' });
  }
  
  const includeReading = SUBJECTS[subject] && SUBJECTS[subject].has_reading && availableReadings.length > 0 && Math.random() < 0.35;
  
  if (includeReading) {
    const reading = availableReadings[Math.floor(Math.random() * availableReadings.length)];
    const readingQuestions = reading.questions || [];
    if (readingQuestions.length > 0) {
      const rqCount = Math.min(readingQuestions.length, 2 + Math.floor(Math.random() * 2));
      const shuffled = readingQuestions.slice().sort(() => Math.random() - 0.5);
      const selectedRqs = shuffled.slice(0, rqCount);
      resultItems.push({
        item_type: 'reading',
        reading: {
          id: reading.id, title: reading.title || '', author: reading.author || '',
          content: reading.content || '', questions: selectedRqs
        }
      });
    }
  }
  
  scoredQs.sort((a, b) => b.score - a.score);
  const usedKps = new Set();
  const selectedQs = [];
  const wrongCount = (user.wrong_questions || []).filter(w => w.subject === subject).length;
  
  for (const item of scoredQs) {
    if (selectedQs.length < Math.min(2, wrongCount) && wrongKpIds.has(item.kpId) && !usedKps.has(item.kpId)) {
      selectedQs.push(item.q);
      usedKps.add(item.kpId);
    }
  }
  
  const readingQCount = resultItems.reduce((sum, r) => sum + (r.reading && r.reading.questions ? r.reading.questions.length : 0), 0);
  const neededQs = count - readingQCount;
  
  for (const item of scoredQs) {
    if (!usedKps.has(item.kpId)) {
      selectedQs.push(item.q);
      usedKps.add(item.kpId);
    }
    if (selectedQs.length >= neededQs) break;
  }
  
  while (selectedQs.length < neededQs && availableQs.length > 0) {
    const q = availableQs[Math.floor(Math.random() * availableQs.length)];
    if (selectedQs.indexOf(q) === -1) selectedQs.push(q);
  }
  
  for (const q of selectedQs) {
    resultItems.push({ item_type: 'question', question: q });
  }
  
  for (let i = resultItems.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = resultItems[i];
    resultItems[i] = resultItems[j];
    resultItems[j] = tmp;
  }
  
  return resultItems;
}

function checkAchievements() {
  const achievements = [];
  const total = user.total_points || 0;
  const sessions = (user.study_sessions || []).length;
  const today = todayStr();
  const todayTasks = (user.daily_tasks && user.daily_tasks[today]) || [];
  const todayCompleted = todayTasks.filter(t => t.completed).length;
  const wrongCount = (user.wrong_questions || []).length;
  
  const hasAllSubjects = Object.keys(SUBJECTS).every(s => {
    const ms = user.subject_mastery[s] || {};
    return Object.values(ms).some(m => (m.correct_count || 0) + (m.wrong_count || 0) > 0);
  });
  
  const conds = {
    first_step: sessions >= 1,
    streak_3: (user.streak_days || 0) >= 3,
    streak_7: (user.streak_days || 0) >= 7,
    streak_30: (user.streak_days || 0) >= 30,
    points_100: total >= 100,
    points_500: total >= 500,
    points_2000: total >= 2000,
    all_subjects: hasAllSubjects,
    marathon: sessions >= 10,
    marathon_50: sessions >= 50,
    daily_complete: todayCompleted >= 3 && todayTasks.length > 0,
    wrong_master: wrongCount >= 1
  };
  
  const currentIds = new Set((user.achievements || []).map(a => a.id));
  for (const a of ALL_ACHIEVEMENTS) {
    if (conds[a.id] && !currentIds.has(a.id)) {
      achievements.push(a);
      if (!user.achievements) user.achievements = [];
      user.achievements.push(a);
    }
  }
  return achievements;
}

function toggleTask(taskId, dateStr) {
  if (!user.daily_tasks) user.daily_tasks = {};
  if (!user.daily_tasks[dateStr]) return;
  for (const task of user.daily_tasks[dateStr]) {
    if (task.id === taskId) {
      task.completed = !task.completed;
      task.completed_at = task.completed ? new Date().toISOString() : null;
      if (task.completed) {
        const todayTasks = user.daily_tasks[todayStr()] || [];
        const allDone = todayTasks.length > 0 && todayTasks.every(function(t) { return t.completed; });
        if (allDone) {
          user.xp = (user.xp || 0) + 20;
          user.total_points = (user.total_points || 0) + 20;
        }
      }
      break;
    }
  }
  const newAchievements = checkAchievements();
  saveUser();
  if (newAchievements.length > 0) newAchievements.forEach(function(a) { showAchievementToast(a); });
  loadDashboard();
}

function loadCalendar() {
  const now = new Date();
  const startOfWeek = new Date(now);
  startOfWeek.setDate(now.getDate() - now.getDay() + 1);
  if (now.getDay() === 0) startOfWeek.setDate(now.getDate() - 6);
  
  let needSave = false;
  const week = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(startOfWeek);
    d.setDate(startOfWeek.getDate() + i);
    const dStr = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    let tasks = (user.daily_tasks && user.daily_tasks[dStr]) || [];
    if (!tasks || tasks.length === 0) {
      tasks = generateDailyTasks(i === 6 ? 0 : i + 1);
      if (!user.daily_tasks) user.daily_tasks = {};
      user.daily_tasks[dStr] = tasks;
      needSave = true;
    }
    const completedCount = tasks.filter(function(t) { return t.completed; }).length;
    const today = todayStr();
    week.push({
      date: dStr, weekday: i, weekday_name: WEEKDAY_NAMES[i === 6 ? 6 : i], weekday_icon: WEEKDAY_ICONS[i === 6 ? 6 : i],
      is_today: dStr === today, is_past: dStr < today, tasks: tasks,
      total_tasks: tasks.length, completed_tasks: completedCount
    });
  }
  if (needSave) saveUser();
  
  const dateRange = week[0].date.slice(5) + ' - ' + week[6].date.slice(5);
  document.getElementById('calendarTitle').textContent = '📅 本周学习计划 · ' + dateRange;
  
  let calHtml = '';
  for (const day of week) {
    let tasksHtml = '';
    for (const t of day.tasks) {
      const subj = SUBJECTS[t.subject] || {icon:'📖'};
      const icon = t.type === 'sports' ? '⚽' : t.type === 'review' ? '🔄' : subj.icon;
      tasksHtml += '<div class="cal-task ' + (t.completed ? 'done' : '') + '">' + icon + ' ' + t.title + '</div>';
    }
    calHtml += '<div class="cal-day ' + (day.is_today ? 'today' : '') + ' ' + (day.is_past ? 'past' : '') + '">' +
      '<div class="cal-day-header">' + day.weekday_name + '</div>' +
      '<div class="cal-day-icon">' + day.weekday_icon + '</div>' +
      '<div class="cal-day-date">' + day.date.slice(8) + '</div>' +
      tasksHtml +
      '<div class="cal-progress">' + day.completed_tasks + '/' + day.total_tasks + ' 完成</div>' +
    '</div>';
  }
  document.getElementById('calendarWeek').innerHTML = calHtml;
}

  if (!SUBJECTS[subject]) return;
  const items = recommendQuestions(subject, 5);
  let totalQ = 0;
  for (const item of items) {
    if (item.item_type === 'reading') totalQ += (item.reading && item.reading.questions) ? item.reading.questions.length : 0;
    else totalQ += 1;
  }
  quizState = {
    subject: subject, subjectInfo: SUBJECTS[subject], items: items,
    currentItemIndex: 0, currentSubIndex: 0,
    correctCount: 0, totalCount: totalQ, answered: 0,
    startTime: Date.now(), questionStart: Date.now()
  };
  showPage('quiz');
  renderQuizItem();
}

    '<div class="quiz-timer">⏱️ ' + timeSpent + 's</div>' +
