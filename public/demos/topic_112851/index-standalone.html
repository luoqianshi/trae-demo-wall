<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>海屿解忧馆 - 让心事随海浪远去</title>
  <style>
    :root {
      --color-ocean-50: #f0f9ff;
      --color-ocean-100: #e0f2fe;
      --color-ocean-200: #bae6fd;
      --color-ocean-300: #7dd3fc;
      --color-ocean-400: #38bdf8;
      --color-ocean-500: #0ea5e9;
      --color-ocean-600: #0284c7;
      --color-ocean-700: #0369a1;
      --color-ocean-800: #075985;
      --color-ocean-900: #0c4a6e;
      
      --color-emotion-anxiety: #f87171;
      --color-emotion-confused: #9ca3af;
      --color-emotion-wronged: #fbbf24;
      --color-emotion-depressed: #6b7280;
      --color-emotion-tired: #a78bfa;
      --color-emotion-lonely: #60a5fa;
      
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-sans);
      background: linear-gradient(180deg, #e0f2fe 0%, #f0f9ff 100%);
      min-height: 100vh;
      color: #334155;
      overflow-x: hidden;
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    .btn-primary {
      padding: 14px 32px;
      background: linear-gradient(135deg, #6366f1 0%, #818cf8 100%);
      color: #ffffff;
      border: none;
      border-radius: 32px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.3);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .ocean-bg {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .wave {
      position: absolute;
      bottom: -20px;
      left: -100%;
      width: 200%;
      height: 60px;
      background: rgba(56, 189, 248, 0.15);
      border-radius: 50%;
      animation: wave-move 10s linear infinite;
    }

    .wave:nth-child(2) {
      animation-delay: -3s;
      opacity: 0.8;
    }

    .wave:nth-child(3) {
      animation-delay: -6s;
      opacity: 0.6;
    }

    @keyframes wave-move {
      0% { left: -100%; }
      100% { left: 0%; }
    }

    .bubble {
      position: absolute;
      bottom: -20px;
      width: 10px;
      height: 10px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      animation: bubble-rise 8s ease-in-out infinite;
    }

    @keyframes bubble-rise {
      0% {
        bottom: -20px;
        opacity: 0;
        transform: translateX(0);
      }
      20% {
        opacity: 0.8;
      }
      100% {
        bottom: 100%;
        opacity: 0;
        transform: translateX(50px);
      }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 40px 0 20px;
      animation: fade-in 0.8s ease;
    }

    header h1 {
      font-size: 32px;
      font-weight: 300;
      color: #0c4a6e;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }

    header p {
      font-size: 14px;
      color: rgba(6, 78, 59, 0.5);
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .tabs button {
      padding: 10px 24px;
      border-radius: 24px;
      border: none;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: rgba(255, 255, 255, 0.6);
      color: #64748b;
    }

    .tabs button.active {
      background: rgba(99, 102, 241, 0.8);
      color: #ffffff;
    }

    .tabs button:hover {
      background: rgba(255, 255, 255, 0.8);
    }

    .tabs button.active:hover {
      background: rgba(99, 102, 241, 1);
    }

    .emotion-picker {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .emotion-item {
      padding: 20px 12px;
      border-radius: 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      opacity: 0.7;
    }

    .emotion-item:hover {
      transform: translateY(-4px);
    }

    .emotion-item.selected {
      opacity: 1;
      transform: scale(1.05);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }

    .emotion-item .emoji {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .emotion-item .name {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      display: block;
    }

    .emotion-item .label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.8);
      display: block;
      margin-top: 4px;
    }

    .note-input {
      background: #fffbeb;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      position: relative;
    }

    .note-input::before {
      content: '';
      position: absolute;
      top: 24px;
      left: 24px;
      right: 24px;
      bottom: 24px;
      background: repeating-linear-gradient(
        transparent,
        transparent 28px,
        rgba(0, 0, 0, 0.05) 28px,
        rgba(0, 0, 0, 0.05) 30px
      );
      pointer-events: none;
    }

    .note-input textarea {
      width: 100%;
      min-height: 160px;
      border: none;
      outline: none;
      background: transparent;
      font-size: 15px;
      line-height: 30px;
      color: #334155;
      font-family: inherit;
      resize: none;
      position: relative;
      z-index: 1;
    }

    .note-input textarea::placeholder {
      color: #94a3b8;
    }

    .note-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .char-count {
      font-size: 13px;
      color: #94a3b8;
    }

    .animation-mask {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(147, 197, 253, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      animation: fade-in 0.3s ease;
    }

    .bottle-container {
      position: relative;
      width: 200px;
      height: 300px;
    }

    .bottle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: float 2s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translate(-50%, -50%) translateY(0); }
      50% { transform: translate(-50%, -50%) translateY(-10px); }
    }

    .bottle-body {
      width: 90px;
      height: 120px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 0 0 30px 30px;
      border: 2px solid rgba(255, 255, 255, 0.5);
      position: relative;
      overflow: hidden;
    }

    .paper {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 50px;
      height: 60px;
      background: #fffbeb;
      border-radius: 2px;
      transition: all 1s ease;
    }

    .paper.folding {
      transform: translateX(-50%) translateY(-10px) scale(0.8);
    }

    .bottle-neck {
      width: 30px;
      height: 40px;
      background: rgba(255, 255, 255, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.5);
      margin: 0 auto;
    }

    .bottle-cap {
      width: 35px;
      height: 15px;
      background: #9ca3af;
      border-radius: 3px;
      margin: 0 auto;
    }

    .reply-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 20px;
      animation: fade-in 0.3s ease;
    }

    .reply-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      animation: slide-up 0.4s ease;
    }

    @keyframes slide-up {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .reply-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .reply-title {
      font-size: 24px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 24px;
    }

    .reply-content {
      background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 100%);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      text-align: left;
    }

    .reply-content p {
      font-size: 15px;
      line-height: 1.8;
      color: #64748b;
    }

    .fishing-area {
      text-align: center;
      padding: 60px 20px;
    }

    .fishing-icon {
      font-size: 80px;
      margin-bottom: 24px;
      animation: bounce 2s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    .fishing-text {
      font-size: 20px;
      color: #334155;
      margin-bottom: 8px;
    }

    .fishing-hint {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 32px;
    }

    .bottle-card {
      background: rgba(255, 255, 255, 0.8);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .bottle-card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .bottle-card-icon {
      font-size: 28px;
    }

    .bottle-card-title {
      font-size: 18px;
      font-weight: 600;
      color: #334155;
    }

    .bottle-card-content {
      background: #fffbeb;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .bottle-card-content p {
      font-size: 15px;
      color: #334155;
      line-height: 1.6;
    }

    .bottle-card-reply {
      background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 100%);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .bottle-card-reply .label {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 4px;
    }

    .bottle-card-reply p {
      font-size: 14px;
      color: #64748b;
      line-height: 1.6;
    }

    .bottle-card-actions {
      display: flex;
      gap: 16px;
    }

    .bottle-card-actions button {
      flex: 1;
      padding: 12px;
      border-radius: 24px;
      border: none;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-hug {
      background: linear-gradient(135deg, #fda4af 0%, #f9a8d4 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-refish {
      background: rgba(255, 255, 255, 0.5);
      color: #64748b;
    }

    .btn-hug:active, .btn-refish:active {
      transform: scale(0.98);
    }

    .stats-section {
      padding: 20px 0;
    }

    .stats-title {
      font-size: 20px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 8px;
    }

    .stats-subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 24px;
    }

    .calendar-card {
      background: rgba(255, 255, 255, 0.7);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      margin-bottom: 16px;
    }

    .weekdays span {
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
    }

    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .day {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-size: 14px;
      color: #64748b;
    }

    .day .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-top: 4px;
    }

    .stats-grid {
      background: rgba(255, 255, 255, 0.7);
      border-radius: 16px;
      padding: 24px;
    }

    .stats-grid-title {
      font-size: 16px;
      font-weight: 500;
      color: #334155;
      margin-bottom: 20px;
    }

    .stats-items {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-bar {
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
    }

    .stat-name {
      font-size: 12px;
      color: #94a3b8;
    }

    .archive-list {
      padding: 20px 0;
    }

    .archive-title {
      font-size: 20px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 24px;
    }

    .archive-item {
      background: rgba(255, 255, 255, 0.7);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .archive-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .emotion-tag {
      padding: 4px 16px;
      border-radius: 20px;
      font-size: 12px;
      color: #ffffff;
    }

    .archive-date {
      font-size: 12px;
      color: #94a3b8;
    }

    .archive-content {
      font-size: 14px;
      color: #334155;
      line-height: 1.6;
      margin-bottom: 12px;
    }

    .archive-reply {
      background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 100%);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .archive-reply-label {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 4px;
    }

    .archive-reply-text {
      font-size: 13px;
      color: #64748b;
      line-height: 1.6;
    }

    .archive-actions {
      display: flex;
      gap: 16px;
    }

    .archive-actions button {
      padding: 8px 20px;
      border-radius: 20px;
      border: none;
      font-size: 13px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.5);
      color: #64748b;
      transition: all 0.2s ease;
    }

    .archive-actions button:active {
      transform: scale(0.98);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
    }

    .empty-icon {
      font-size: 64px;
      margin-bottom: 16px;
    }

    .empty-text {
      font-size: 16px;
      color: #64748b;
      margin-bottom: 8px;
    }

    .empty-hint {
      font-size: 14px;
      color: #94a3b8;
    }

    .tip-panel {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 24px;
      border-radius: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      z-index: 50;
      max-width: 90%;
      text-align: center;
    }

    .tip-text {
      font-size: 13px;
      color: #64748b;
      display: block;
      margin-bottom: 4px;
    }

    .tip-disclaimer {
      font-size: 11px;
      color: #94a3b8;
    }

    .privacy {
      text-align: center;
      padding: 20px 0 30px;
      font-size: 13px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .footer {
      text-align: center;
      padding: 20px 0;
      font-size: 12px;
      color: rgba(56, 189, 248, 0.5);
    }

    @media (max-width: 480px) {
      .container {
        padding: 15px;
      }

      header h1 {
        font-size: 28px;
      }

      .emotion-picker {
        grid-template-columns: repeat(2, 1fr);
      }

      .stats-items {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="ocean-bg" id="ocean-bg"></div>
  
  <div class="container">
    <header>
      <h1>🌊 海屿解忧馆</h1>
      <p>让心事随海浪远去，留下温柔与平静</p>
    </header>

    <nav class="tabs">
      <button class="active" data-tab="throw">📝 扔漂流瓶</button>
      <button data-tab="fish">🎣 捞漂流瓶</button>
      <button data-tab="stats">📊 情绪记录</button>
      <button data-tab="archive">📜 档案馆</button>
    </nav>

    <main id="main-content">
    </main>

    <div class="privacy">
      <span>🔒</span>
      <span>所有心事仅保存在本地，不会上传云端泄露</span>
    </div>

    <div class="footer">
      <p>🌊 在这里，你的心事安全又自由</p>
    </div>
  </div>

  <div class="tip-panel" id="tip-panel">
    <span class="tip-text" id="tip-text">允许自己不开心，情绪没有对错</span>
    <span class="tip-disclaimer">本网站仅为情绪舒缓工具，不替代专业心理咨询</span>
  </div>

  <script>
    const emotions = [
      { id: 'anxiety', name: '焦虑', color: '#f87171', label: '感到焦虑', emoji: '😰' },
      { id: 'confused', name: '迷茫', color: '#9ca3af', label: '有些迷茫', emoji: '😕' },
      { id: 'wronged', name: '委屈', color: '#fbbf24', label: '心里委屈', emoji: '🥺' },
      { id: 'depressed', name: '压抑', color: '#6b7280', label: '感觉压抑', emoji: '😔' },
      { id: 'tired', name: '疲惫', color: '#a78bfa', label: '身心疲惫', emoji: '😫' },
      { id: 'lonely', name: '孤独', color: '#60a5fa', label: '觉得孤独', emoji: '🥀' }
    ];

    const comfortMessages = {
      anxiety: [
        '我知道现在的你感到很焦虑，好像有很多事情压在心头。试着先深呼吸，让自己慢慢平静下来。',
        '焦虑就像海浪一样，有时会很高，但总会退去。你已经做得很好了。',
        '请允许自己感到焦虑，这不是你的错。每个人都会有这样的时刻。',
        '不要被焦虑淹没，试着把注意力放回当下，一步一步来。'
      ],
      confused: [
        '迷茫是很正常的，人生就像在大海中航行，有时会看不清方向。但请相信，总会找到灯塔。',
        '不知道该往哪里走的时候，停下来也没关系。听听内心的声音。',
        '迷茫不是你的问题，而是成长的机会，你正在变得更加了解自己。',
        '给自己一些时间，答案会慢慢浮现的。'
      ],
      wronged: [
        '我知道你感到很委屈，好像没有人理解你。但请记住，你的感受是真实的。',
        '委屈的时候，找一个信任的朋友聊聊吧。倾诉本身就是一种治愈。',
        '你值得被温柔对待，也值得被理解。不要压抑自己的情绪。',
        '被误解确实很难受，但时间会证明一切。'
      ],
      depressed: [
        '压抑的感觉就像胸口压了一块石头，让人喘不过气来。请允许自己释放这些情绪。',
        '压抑的时候，试着做一些能让你感到轻松的事情。听一首治愈的歌。',
        '你不需要时刻坚强，脆弱也是一种力量。承认自己的感受。',
        '给自己一个拥抱，你已经很不容易了。'
      ],
      tired: [
        '我知道你很累，身心俱疲。请停下来休息一下，不要对自己太苛刻。',
        '疲惫的时候，什么都不用做也没关系。好好睡一觉。',
        '你已经做得很好了，不要因为疲惫而自责。休息一下，明天会更好。',
        '累了就歇会儿，这不是偷懒，这是对自己的温柔。'
      ],
      lonely: [
        '孤独的感觉确实很难熬，但请记住，你并不是一个人。',
        '孤独的时候，试着做一些自己喜欢的事情。读书、听音乐。',
        '你是独一无二的，你的存在本身就很珍贵。',
        '即使一个人，也要好好照顾自己。'
      ]
    };

    const mockBottles = [
      { id: '1', content: '最近工作压力好大，每天都睡不好觉，感觉喘不过气来...', emotion: 'anxiety', reply: '我能感受到你的压力和疲惫。工作重要，但你的健康更重要。试着每天给自己留一点时间。', hugs: 23 },
      { id: '2', content: '毕业两年了，还是不知道自己想要什么，感觉人生很迷茫...', emotion: 'confused', reply: '迷茫是成长的必经之路，很多人都和你一样。不要着急，慢慢探索。', hugs: 45 },
      { id: '3', content: '明明是为了大家好，却被误解了，心里好委屈...', emotion: 'wronged', reply: '被误解的感觉真的很难受，但请相信，时间会证明一切。你的善意终会被看见。', hugs: 67 },
      { id: '4', content: '感觉心里压了好多事，想找人说又不知道该找谁...', emotion: 'depressed', reply: '压抑的情绪需要被释放，不要把它们憋在心里。如果你愿意，可以在这里倾诉。', hugs: 89 },
      { id: '5', content: '每天都很累，不知道这样的日子什么时候才是个头...', emotion: 'tired', reply: '我知道你很累，但请不要放弃。每一个难熬的日子，都是在为更好的明天铺路。', hugs: 112 },
      { id: '6', content: '一个人在陌生的城市，有时候真的觉得好孤独...', emotion: 'lonely', reply: '在陌生城市打拼确实不容易，但你不是一个人。试着多出去走走，认识一些新朋友。', hugs: 156 },
      { id: '7', content: '考试快到了，复习得一团糟，好焦虑...', emotion: 'anxiety', reply: '考试焦虑是正常的，说明你很重视。试着制定一个合理的复习计划，一步一步来。', hugs: 78 },
      { id: '8', content: '和家人吵架了，不知道该怎么和解...', emotion: 'wronged', reply: '家人之间难免有摩擦，给彼此一些时间冷静一下。爱你的人总会理解你的。', hugs: 95 }
    ];

    const tips = [
      '允许自己不开心，情绪没有对错',
      '焦虑是对未来的过度想象，试着把注意力放回当下',
      '倾诉本身就是一种治愈',
      '每一种情绪都值得被温柔对待',
      '给自己一些时间和空间，你可以慢慢来',
      '累了就休息，这不是放弃，是为了更好地出发'
    ];

    let currentEmotion = null;
    let noteContent = '';
    let currentTab = 'throw';
    let currentFishBottle = null;

    function initOceanBg() {
      const bg = document.getElementById('ocean-bg');
      for (let i = 0; i < 3; i++) {
        const wave = document.createElement('div');
        wave.className = 'wave';
        bg.appendChild(wave);
      }
      for (let i = 0; i < 15; i++) {
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.style.left = Math.random() * 100 + '%';
        bubble.style.animationDelay = Math.random() * 8 + 's';
        bubble.style.animationDuration = (6 + Math.random() * 4) + 's';
        bubble.style.width = (4 + Math.random() * 8) + 'px';
        bubble.style.height = bubble.style.width;
        bg.appendChild(bubble);
      }
    }

    function initTipPanel() {
      const tipText = document.getElementById('tip-text');
      let index = 0;
      setInterval(() => {
        index = (index + 1) % tips.length;
        tipText.textContent = tips[index];
      }, 5000);
    }

    function getComfortMessage(emotionId) {
      const messages = comfortMessages[emotionId] || comfortMessages.lonely;
      return messages[Math.floor(Math.random() * messages.length)];
    }

    function getRandomFishBottle() {
      return mockBottles[Math.floor(Math.random() * mockBottles.length)];
    }

    function renderThrowTab() {
      return `
        <div class="emotion-picker">
          ${emotions.map(e => `
            <div class="emotion-item ${currentEmotion?.id === e.id ? 'selected' : ''}" 
                 style="background-color: ${e.color}"
                 onclick="selectEmotion('${e.id}')">
              <div class="emoji">${e.emoji}</div>
              <span class="name">${e.name}</span>
              <span class="label">${e.label}</span>
            </div>
          `).join('')}
        </div>
        ${currentEmotion ? `
          <div class="note-input">
            <textarea 
              placeholder="在这里倾诉你的心事，大海会替你保管..." 
              maxlength="200"
              oninput="updateContent(this.value)"
              onfocus="this.select()"
            >${noteContent}</textarea>
          </div>
          <div class="note-footer">
            <span class="char-count">${noteContent.length}/200</span>
            <button class="btn-primary" ${!noteContent.trim() ? 'disabled' : ''} onclick="submitBottle()">
              扔入大海 🌊
            </button>
          </div>
          <button style="margin-top: 16px; padding: 8px 24px; background: transparent; border: none; color: #0ea5e9; font-size: 14px; cursor: pointer;" onclick="resetSelection()">
            重新选择情绪
          </button>
        ` : ''}
      `;
    }

    function renderFishTab() {
      if (!currentFishBottle) {
        return `
          <div class="fishing-area">
            <div class="fishing-icon">🎣</div>
            <div class="fishing-text">大海里有很多漂流瓶</div>
            <div class="fishing-hint">点击捞取一个，倾听陌生人的心事</div>
            <button class="btn-primary" onclick="fishBottle()">开始捞取</button>
          </div>
        `;
      }
      
      const emotion = emotions.find(e => e.id === currentFishBottle.emotion);
      return `
        <div class="bottle-card">
          <div class="bottle-card-header">
            <span class="bottle-card-icon">💌</span>
            <span class="bottle-card-title">陌生人的心事</span>
          </div>
          <div class="bottle-card-content">
            <p>${currentFishBottle.content}</p>
          </div>
          <div class="bottle-card-reply">
            <div class="label">🌊 大海的回信：</div>
            <p>${currentFishBottle.reply}</p>
          </div>
          <div class="bottle-card-actions">
            <button class="btn-hug" onclick="giveHug()">
              🤗 温柔抱抱 <span>${currentFishBottle.hugs}</span>
            </button>
            <button class="btn-refish" onclick="fishBottle()">再捞一个</button>
          </div>
        </div>
        <p style="text-align: center; font-size: 13px; color: #94a3b8;">💡 所有内容已自动脱敏，保护个人隐私</p>
      `;
    }

    function renderStatsTab() {
      const records = JSON.parse(localStorage.getItem('emotionRecords') || '[]');
      const today = new Date();
      const year = today.getFullYear();
      const month = today.getMonth();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const firstDay = new Date(year, month, 1).getDay();
      
      const days = [];
      for (let i = 0; i < firstDay; i++) days.push(null);
      for (let i = 1; i <= daysInMonth; i++) days.push(i);

      const stats = {};
      records.forEach(r => {
        if (r.date.startsWith(`${year}-${String(month + 1).padStart(2, '0')}`)) {
          stats[r.emotion] = (stats[r.emotion] || 0) + 1;
        }
      });

      const statsHtml = Object.entries(stats).map(([emotion, count]) => {
        const e = emotions.find(x => x.id === emotion);
        return e ? `
          <div class="stat-item">
            <div class="stat-bar" style="background-color: ${e.color}">${count}</div>
            <div class="stat-name">${e.name}</div>
          </div>
        ` : '';
      }).join('');

      return `
        <div class="stats-section">
          <div class="stats-title">📅 本月情绪记录</div>
          <div class="stats-subtitle">原来你也悄悄撑过了很多时刻，辛苦啦</div>
          
          <div class="calendar-card">
            <div class="weekdays">
              <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
            </div>
            <div class="days">
              ${days.map(day => {
                if (!day) return '<div class="day"></div>';
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const record = records.find(r => r.date === dateStr);
                return `
                  <div class="day">
                    ${day}
                    ${record ? `<div class="dot" style="background-color: ${record.emotionColor}"></div>` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <div class="stats-grid">
            <div class="stats-grid-title">情绪占比</div>
            <div class="stats-items">
              ${statsHtml || '<div style="grid-column: 1/-1; text-align: center; color: #94a3b8;">本月还没有记录</div>'}
            </div>
          </div>
        </div>
      `;
    }

    function renderArchiveTab() {
      const history = JSON.parse(localStorage.getItem('bottleHistory') || '[]');
      
      if (history.length === 0) {
        return `
          <div class="empty-state">
            <div class="empty-icon">🌊</div>
            <div class="empty-text">还没有漂流瓶</div>
            <div class="empty-hint">去扔一个吧</div>
          </div>
        `;
      }

      return `
        <div class="archive-list">
          <div class="archive-title">漂流瓶档案馆</div>
          ${history.map(item => {
            const emotion = emotions.find(e => e.id === item.emotion);
            return `
              <div class="archive-item">
                <div class="archive-item-header">
                  <span class="emotion-tag" style="background-color: ${item.emotionColor}">${emotion?.name || '未知'}</span>
                  <span class="archive-date">${new Date(item.createdAt).toLocaleDateString()}</span>
                </div>
                <div class="archive-content">${item.content}</div>
                <div class="archive-reply">
                  <div class="archive-reply-label">💌 回信：</div>
                  <div class="archive-reply-text">${item.reply}</div>
                </div>
                <div class="archive-actions">
                  <button onclick="toggleFavorite('${item.id}')">${item.isFavorite ? '❤️ 已收藏' : '🤍 收藏'}</button>
                  <button onclick="deleteBottle('${item.id}')">🗑️ 删除</button>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function render() {
      const main = document.getElementById('main-content');
      switch (currentTab) {
        case 'throw':
          main.innerHTML = renderThrowTab();
          break;
        case 'fish':
          main.innerHTML = renderFishTab();
          break;
        case 'stats':
          main.innerHTML = renderStatsTab();
          break;
        case 'archive':
          main.innerHTML = renderArchiveTab();
          break;
      }
    }

    window.selectEmotion = function(id) {
      currentEmotion = emotions.find(e => e.id === id);
      render();
    };

    window.updateContent = function(value) {
      noteContent = value;
      const countEl = document.querySelector('.char-count');
      if (countEl) {
        countEl.textContent = `${value.length}/200`;
      }
      const submitBtn = document.querySelector('.note-footer .btn-primary');
      if (submitBtn) {
        submitBtn.disabled = !value.trim();
      }
    };

    window.resetSelection = function() {
      currentEmotion = null;
      noteContent = '';
      render();
    };

    window.submitBottle = function() {
      if (!currentEmotion || !noteContent.trim()) return;

      const mask = document.createElement('div');
      mask.className = 'animation-mask';
      mask.innerHTML = `
        <div class="bottle-container">
          <div class="bottle">
            <div class="bottle-body">
              <div class="paper"></div>
            </div>
            <div class="bottle-neck"></div>
            <div class="bottle-cap"></div>
          </div>
        </div>
      `;
      document.body.appendChild(mask);

      setTimeout(() => {
        mask.querySelector('.paper').classList.add('folding');
      }, 1000);

      setTimeout(() => {
        const reply = getComfortMessage(currentEmotion.id);
        
        const bottle = {
          id: Date.now().toString(),
          content: noteContent,
          emotion: currentEmotion.id,
          emotionColor: currentEmotion.color,
          reply: reply,
          createdAt: Date.now(),
          isFavorite: false
        };

        const history = JSON.parse(localStorage.getItem('bottleHistory') || '[]');
        history.unshift(bottle);
        localStorage.setItem('bottleHistory', JSON.stringify(history));

        const today = new Date();
        const dateStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
        const records = JSON.parse(localStorage.getItem('emotionRecords') || '[]');
        const existingIndex = records.findIndex(r => r.date === dateStr);
        if (existingIndex >= 0) {
          records[existingIndex] = { date: dateStr, emotion: currentEmotion.id, emotionColor: currentEmotion.color };
        } else {
          records.push({ date: dateStr, emotion: currentEmotion.id, emotionColor: currentEmotion.color });
        }
        localStorage.setItem('emotionRecords', JSON.stringify(records));

        mask.remove();
        
        showReply(reply);
      }, 3000);
    };

    function showReply(message) {
      const modal = document.createElement('div');
      modal.className = 'reply-modal';
      modal.innerHTML = `
        <div class="reply-card">
          <div class="reply-icon">💌</div>
          <div class="reply-title">来自大海的回信</div>
          <div class="reply-content">
            <p>${message}</p>
          </div>
          <button class="btn-primary" onclick="closeReply(this)">收下这份温暖</button>
        </div>
      `;
      document.body.appendChild(modal);
    }

    window.closeReply = function(btn) {
      const modal = btn.closest('.reply-modal');
      modal.remove();
      currentEmotion = null;
      noteContent = '';
      render();
    };

    window.fishBottle = function() {
      currentFishBottle = getRandomFishBottle();
      render();
    };

    window.giveHug = function() {
      if (currentFishBottle) {
        currentFishBottle.hugs++;
        render();
      }
    };

    window.toggleFavorite = function(id) {
      const history = JSON.parse(localStorage.getItem('bottleHistory') || '[]');
      const index = history.findIndex(item => item.id === id);
      if (index >= 0) {
        history[index].isFavorite = !history[index].isFavorite;
        localStorage.setItem('bottleHistory', JSON.stringify(history));
        render();
      }
    };

    window.deleteBottle = function(id) {
      if (confirm('删除后无法恢复，确定要删除吗？')) {
        const history = JSON.parse(localStorage.getItem('bottleHistory') || '[]');
        const filtered = history.filter(item => item.id !== id);
        localStorage.setItem('bottleHistory', JSON.stringify(filtered));
        render();
      }
    };

    document.querySelectorAll('.tabs button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTab = btn.dataset.tab;
        render();
      });
    });

    initOceanBg();
    initTipPanel();
    render();
  </script>
</body>
</html>
