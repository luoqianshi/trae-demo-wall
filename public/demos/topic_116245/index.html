<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>万物独白</title>
<style>
/* ========== CSS 变量 ========== */
:root {
  --ink: #111111;
  --paper: #ffffff;
  --line: rgba(17,17,17,0.16);
  --line-strong: rgba(17,17,17,0.35);
  --ghost: rgba(17,17,17,0.4);
  --mood-color: #6a7a7a;
  --ease-quint: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out-back: cubic-bezier(0.68, -0.35, 0.27, 1.35);
}

/* ========== 全局重置 ========== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html, body {
  height: 100%;
  overscroll-behavior: none;
}
body {
  background: var(--paper);
  color: var(--ink);
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
button, input, textarea {
  font: inherit;
  color: inherit;
}
button {
  border: none;
  background: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
input, textarea {
  border: none;
  outline: none;
  background: none;
}

/* ========== 动画 Keyframes ========== */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeOutDown {
  from { opacity: 1; transform: translateY(0); }
  to   { opacity: 0; transform: translateY(-20px); }
}
@keyframes gentleShake {
  0%   { transform: rotate(0deg); }
  25%  { transform: rotate(-1deg); }
  50%  { transform: rotate(1deg); }
  75%  { transform: rotate(-1deg); }
  100% { transform: rotate(0deg); }
}
@keyframes breathing {
  0%   { transform: translateZ(0) scale(1); }
  47%  { transform: translateZ(0) scale(1.15); }
  65%  { transform: translateZ(0) scale(1.15); }
  100% { transform: translateZ(0) scale(1); }
}
@keyframes shrinkAway {
  from { transform: scale(1); opacity: 1; }
  to   { transform: scale(0); opacity: 0; }
}
@keyframes softBreath {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.02); }
}
@keyframes floatUp {
  from { transform: translateY(0); }
  to   { transform: translateY(-6px); }
}
@keyframes dotPulse {
  0%, 100% { opacity: 0.3; }
  50%      { opacity: 1; }
}
@keyframes spin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

/* ========== 工具类 ========== */
.fade-in-up {
  animation: fadeInUp 0.8s var(--ease-quint) both;
}
.fade-out-down {
  animation: fadeOutDown 0.5s ease both;
}
.stagger-1 { animation-delay: 0.1s; }
.stagger-2 { animation-delay: 0.3s; }
.stagger-3 { animation-delay: 0.5s; }

/* ========== 屏幕骨架 ========== */
.screen {
  position: fixed;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
}
.screen.active {
  display: flex;
}

/* ========== 首页 ========== */
#screen-home {
  text-align: center;
}
.upload-circle {
  width: 160px;
  height: 160px;
  border-radius: 50%;
  border: 1.5px dashed var(--line-strong);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  opacity: 0.4;
  transition: opacity 0.3s ease;
  animation: softBreath 4s ease-in-out infinite;
  overflow: hidden;
  cursor: pointer;
}
.upload-circle:hover,
.upload-circle.dragover {
  opacity: 1;
}
.upload-circle .upload-icon {
  width: 32px;
  height: 32px;
  color: var(--ink);
  transition: opacity 0.3s ease;
}
.upload-circle.has-image .upload-icon {
  opacity: 0;
}
#previewImg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
  opacity: 0;
  transition: opacity 0.3s ease;
}
#previewImg.show {
  opacity: 1;
}
.home-caption {
  margin-top: 22px;
  font-size: 14px;
  color: var(--ghost);
  letter-spacing: 0.05em;
}

/* 底部按钮 */
#micBtn {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1.2px solid var(--line-strong);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.3s ease, color 0.3s ease, transform 0.2s ease;
  z-index: 10;
  color: var(--ink);
}
#micBtn:hover { transform: translateX(-50%) scale(1.05); }
#micBtn:active { transform: translateX(-50%) scale(0.94); }
#micBtn.recording {
  background: var(--ink);
  color: var(--paper);
}
#micBtn svg { width: 18px; height: 18px; }

#keyboardBtn {
  position: fixed;
  bottom: 40px;
  left: 24px;
  width: 24px;
  height: 24px;
  opacity: 0.35;
  transition: opacity 0.25s ease;
  z-index: 10;
  color: var(--ink);
}
#keyboardBtn:hover { opacity: 0.8; }
#keyboardBtn svg { width: 24px; height: 24px; }

#endBtnHome {
  position: fixed;
  bottom: 40px;
  right: 24px;
  display: flex;
  align-items: center;
  gap: 8px;
  opacity: 0.35;
  transition: opacity 0.25s ease;
  z-index: 10;
  color: var(--ink);
  font-size: 13px;
}
#endBtnHome:hover { opacity: 0.9; }
#endBtnHome .end-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--ink);
}

/* ========== 对话页 ========== */
#screen-chat {
  justify-content: flex-start;
}
#progressBar {
  position: fixed;
  top: 0;
  left: 0;
  height: 2px;
  width: 0%;
  background: var(--ink);
  transition: width 0.6s var(--ease-quint);
  z-index: 20;
}
#chatStage {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px;
  width: 100%;
}
.question-block {
  max-width: 480px;
  width: 100%;
  text-align: center;
}
.question-text {
  font-size: 22px;
  line-height: 1.6;
  font-weight: 500;
  margin-bottom: 32px;
  animation: gentleShake 3s ease-in-out infinite;
}
/* buttons 选项 */
.options-buttons {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
}
.opt-btn {
  padding: 16px 26px;
  border-radius: 24px;
  border: 1.2px solid var(--line-strong);
  font-size: 15px;
  transition: transform 0.2s var(--ease-quint), background 0.25s ease, color 0.25s ease, box-shadow 0.3s ease;
}
.opt-btn:hover {
  transform: scale(1.02);
  box-shadow: 0 0 18px rgba(196,160,96,0.35);
}
.opt-btn:active { transform: scale(0.96); }
.opt-btn.selected {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
/* cards 选项 */
.options-cards {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: stretch;
}
.opt-card {
  padding: 20px;
  border-radius: 18px;
  border: 1.2px solid var(--line-strong);
  font-size: 15px;
  text-align: center;
  transition: transform 0.2s var(--ease-quint), box-shadow 0.3s ease, border-color 0.25s ease;
}
.opt-card:hover {
  transform: scale(1.02);
  box-shadow: 0 0 18px rgba(196,160,96,0.35);
}
.opt-card:active { transform: scale(0.98); }
.opt-card.selected {
  border-color: var(--ink);
  animation: floatUp 0.4s ease both;
}
/* input 选项 */
.options-input {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  width: 100%;
}
.memory-input {
  width: 100%;
  text-align: center;
  font-size: 17px;
  padding: 10px 4px;
  border-bottom: 1.2px solid var(--line-strong);
  transition: border-color 0.25s ease;
  color: var(--ink);
}
.memory-input::placeholder {
  color: var(--ghost);
}
.memory-input:focus {
  border-bottom-color: var(--ink);
}
.continue-btn {
  padding: 12px 28px;
  border-radius: 22px;
  border: 1.2px solid var(--line-strong);
  font-size: 14px;
  transition: transform 0.2s var(--ease-quint), background 0.25s ease, color 0.25s ease;
}
.continue-btn:hover {
  transform: scale(1.02);
  background: var(--ink);
  color: var(--paper);
}
.continue-btn:active { transform: scale(0.96); }

#skipLink {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 12px;
  color: var(--ghost);
  opacity: 0.4;
  transition: opacity 0.25s ease;
  z-index: 10;
}
#skipLink:hover { opacity: 0.8; }

/* ========== 生成页 ========== */
#screen-generate {
  position: fixed;
  inset: 0;
}
.breath-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.breath-circle {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: var(--mood-color);
  animation: breathing 8.5s ease-in-out infinite;
  transition: background 0.6s ease;
}
#thinkingText {
  margin-top: 28px;
  font-size: 14px;
  color: var(--ghost);
  letter-spacing: 0.08em;
  transition: opacity 0.4s ease;
}
#particle-canvas {
  position: fixed;
  inset: 0;
  display: none;
  z-index: 5;
}
#monologueText {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 40px;
  z-index: 6;
  pointer-events: none;
}
#monologueText .mono-inner {
  max-width: 520px;
  font-size: 18px;
  line-height: 1.9;
  color: var(--ink);
  text-align: center;
  white-space: pre-wrap;
  pointer-events: auto;
}
#monologueText .mono-inner .cursor {
  display: inline-block;
  width: 1px;
  height: 1em;
  background: var(--ink);
  vertical-align: middle;
  margin-left: 1px;
  animation: dotPulse 1s ease-in-out infinite;
}
.generate-actions {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  display: none;
  gap: 16px;
  z-index: 8;
}
.generate-actions.show { display: flex; }
.gen-btn {
  padding: 12px 24px;
  border-radius: 22px;
  border: 1.2px solid var(--line-strong);
  font-size: 14px;
  transition: transform 0.2s var(--ease-quint), background 0.25s ease, color 0.25s ease;
}
.gen-btn:hover {
  transform: scale(1.02);
  background: var(--ink);
  color: var(--paper);
}

/* ========== 结束页 ========== */
#screen-end {
  background: var(--paper);
}
.end-content {
  text-align: center;
}
.end-brand {
  font-size: 28px;
  font-weight: 500;
  letter-spacing: 0.15em;
  margin-bottom: 12px;
}
.end-sub {
  font-size: 13px;
  color: var(--ghost);
  letter-spacing: 0.1em;
  margin-bottom: 40px;
}
.restart-btn {
  padding: 14px 32px;
  border-radius: 24px;
  border: 1.2px solid var(--line-strong);
  font-size: 14px;
  transition: transform 0.2s var(--ease-quint), background 0.25s ease, color 0.25s ease;
}
.restart-btn:hover {
  transform: scale(1.02);
  background: var(--ink);
  color: var(--paper);
}

/* ========== 遮罩层 ========== */
#fullscreenCover {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  background: var(--paper);
}
#fullscreenCover.active {
  opacity: 1;
  pointer-events: auto;
}
#fullscreenCover img {
  width: 160px;
  height: 160px;
  border-radius: 50%;
  object-fit: cover;
  transition: width 1s var(--ease-quint), height 1s var(--ease-quint), border-radius 1s var(--ease-quint);
}
#fullscreenCover.expanded img {
  width: 100vw;
  height: 100vh;
  border-radius: 0;
}

#blackVeil {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: #000;
  color: #fff;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  opacity: 0;
  transition: opacity 0.6s ease;
}
#blackVeil.show {
  display: flex;
  opacity: 1;
}
#blackVeil .veil-brand {
  font-size: 30px;
  font-weight: 500;
  letter-spacing: 0.2em;
  margin-bottom: 14px;
}
#blackVeil .veil-sub {
  font-size: 13px;
  color: rgba(255,255,255,0.5);
  letter-spacing: 0.12em;
}

/* ========== 错误提示 ========== */
#errorToast {
  position: fixed;
  top: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(-120%);
  background: var(--ink);
  color: var(--paper);
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 13px;
  z-index: 100;
  transition: transform 0.4s var(--ease-quint);
  max-width: 80vw;
  text-align: center;
}
#errorToast.show {
  transform: translateX(-50%) translateY(0);
}

/* ========== 无障碍 ========== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<!-- 首页 -->
<div id="screen-home" class="screen active">
  <div class="upload-circle" id="uploadCircle">
    <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="17 8 12 3 7 8"/>
      <line x1="12" y1="3" x2="12" y2="15"/>
    </svg>
    <img id="previewImg" alt="">
  </div>
  <div class="home-caption">拍一件物品</div>

  <!-- 底部按钮 -->
  <button id="micBtn" aria-label="语音输入">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      <line x1="12" y1="19" x2="12" y2="23"/>
      <line x1="8" y1="23" x2="16" y2="23"/>
    </svg>
  </button>
  <button id="keyboardBtn" aria-label="键盘输入">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="6" width="20" height="12" rx="2"/>
      <line x1="6" y1="10" x2="6" y2="10"/>
      <line x1="10" y1="10" x2="10" y2="10"/>
      <line x1="14" y1="10" x2="14" y2="10"/>
      <line x1="18" y1="10" x2="18" y2="10"/>
      <line x1="6" y1="14" x2="18" y2="14"/>
    </svg>
  </button>
  <button id="endBtnHome" aria-label="结束">
    <span class="end-dot"></span>
    <span>结束</span>
  </button>
</div>

<!-- 对话页 -->
<div id="screen-chat" class="screen">
  <div id="progressBar"></div>
  <div id="chatStage">
    <div class="question-block" id="questionBlock"></div>
  </div>
  <a href="javascript:void(0)" id="skipLink">跳过</a>
</div>

<!-- 生成页 -->
<div id="screen-generate" class="screen">
  <div class="breath-stage" id="breathStage">
    <div class="breath-circle" id="breathCircle"></div>
    <div id="thinkingText">正在观察……</div>
  </div>
  <canvas id="particle-canvas"></canvas>
  <div id="monologueText"><div class="mono-inner" id="monoInner"></div></div>
  <div class="generate-actions" id="generateActions">
    <button class="gen-btn" id="endGenBtn">结束独白</button>
  </div>
</div>

<!-- 结束页 -->
<div id="screen-end" class="screen">
  <div class="end-content">
    <div class="end-brand">万物独白</div>
    <div class="end-sub">每一件物品，都有一段低语</div>
    <button class="restart-btn" id="restartBtn">再对话一次</button>
  </div>
</div>

<!-- 全屏图片过渡遮罩 -->
<div id="fullscreenCover">
  <img id="coverImg" alt="">
</div>

<!-- 结束遮罩 -->
<div id="blackVeil">
  <div class="veil-brand">万物独白</div>
  <div class="veil-sub">愿这些低语，被温柔听见</div>
</div>

<!-- 错误提示 -->
<div id="errorToast"></div>

<!-- 隐藏文件输入 -->
<input type="file" id="fileInput" accept="image/jpeg,image/png" hidden>

<script>
/* ========== State 对象 ========== */
const state = {
  imageBase64: null,
  answers: { owner: null, relationship: null, memory: '', intention: null, moodLabel: null },
  emotionIndex: 0.5,
  imageAnalysis: null,
  monologue: '',
  chatHistory: [],
};

/* ========== DOM 引用 ========== */
const $ = (id) => document.getElementById(id);
const screens = {
  home: $('screen-home'),
  chat: $('screen-chat'),
  generate: $('screen-generate'),
  end: $('screen-end'),
};

/* ========== 屏幕切换 ========== */
function showScreen(id) {
  Object.values(screens).forEach(s => s.classList.remove('active'));
  if (screens[id]) screens[id].classList.add('active');
}

/* ========== 错误提示 ========== */
let errorTimer = null;
function showError(msg) {
  const toast = $('errorToast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(errorTimer);
  errorTimer = setTimeout(() => toast.classList.remove('show'), 2400);
}

/* ========== 图片压缩 ========== */
function compressImage(file, cb) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const maxW = 1024;
      let w = img.width, h = img.height;
      if (w > maxW) {
        h = Math.round(h * (maxW / w));
        w = maxW;
      }
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const dataURL = canvas.toDataURL('image/jpeg', 0.88);
      cb(dataURL);
    };
    img.onerror = () => showError('图片读取失败');
    img.src = e.target.result;
  };
  reader.onerror = () => showError('文件读取失败');
  reader.readAsDataURL(file);
}

/* ========== 首页交互 ========== */
const uploadCircle = $('uploadCircle');
const fileInput = $('fileInput');
const previewImg = $('previewImg');
const coverImg = $('coverImg');
const fullscreenCover = $('fullscreenCover');

uploadCircle.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) handleFile(file);
  fileInput.value = '';
});

function handleFile(file) {
  if (!/^image\/(jpeg|png)$/.test(file.type)) {
    showError('仅支持 JPG / PNG 格式');
    return;
  }
  if (file.size > 8 * 1024 * 1024) {
    showError('图片需小于 8MB');
    return;
  }
  compressImage(file, (dataURL) => {
    state.imageBase64 = dataURL;
    previewImg.src = dataURL;
    previewImg.classList.add('show');
    uploadCircle.classList.add('has-image');
    triggerCoverTransition(dataURL);
  });
}

/* 拖拽上传 */
['dragover', 'dragenter'].forEach(evt => {
  document.body.addEventListener(evt, (e) => {
    e.preventDefault();
    uploadCircle.classList.add('dragover');
  });
});
['dragleave', 'drop'].forEach(evt => {
  document.body.addEventListener(evt, (e) => {
    e.preventDefault();
    uploadCircle.classList.remove('dragover');
  });
});
document.body.addEventListener('drop', (e) => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file) handleFile(file);
});

/* 全屏图片过渡 */
function triggerCoverTransition(dataURL) {
  coverImg.src = dataURL;
  fullscreenCover.classList.add('active');
  // 强制 reflow
  void fullscreenCover.offsetWidth;
  // 放大
  fullscreenCover.classList.add('expanded');
  // 1.05s 后切换到对话页
  setTimeout(() => {
    showScreen('chat');
    startChat();
    // 0.3s 后移除 cover
    setTimeout(() => {
      fullscreenCover.classList.remove('active');
      fullscreenCover.classList.remove('expanded');
    }, 300);
  }, 1050);
}

/* ========== 语音输入 ========== */
const micBtn = $('micBtn');
let recognition = null;
let isRecording = false;
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = 'zh-CN';
  recognition.interimResults = false;
  recognition.onresult = (e) => {
    const text = e.results[0][0].transcript;
    const focused = document.activeElement;
    if (focused && focused.classList && focused.classList.contains('memory-input')) {
      focused.value = text;
    }
  };
  recognition.onend = () => {
    isRecording = false;
    micBtn.classList.remove('recording');
  };
  recognition.onerror = () => {
    isRecording = false;
    micBtn.classList.remove('recording');
    showError('语音识别失败');
  };
}
micBtn.addEventListener('click', () => {
  if (!recognition) {
    showError('当前浏览器不支持语音识别');
    return;
  }
  if (isRecording) {
    recognition.stop();
  } else {
    try {
      recognition.start();
      isRecording = true;
      micBtn.classList.add('recording');
    } catch (err) {
      showError('语音识别启动失败');
    }
  }
});

/* ========== 对话页 ========== */
const questions = [
  {
    key: 'owner',
    type: 'buttons',
    text: '这件物品属于你，还是属于某个你思念的人？',
    options: [
      { label: '我自己的', value: 'self' },
      { label: '别人的/过去的', value: 'other', autoAdvance: 1000 },
    ],
  },
  {
    key: 'relationship',
    type: 'cards',
    text: '你此刻和它的关系是？',
    options: [
      { label: '日常陪伴', value: 'daily' },
      { label: '偶尔想起', value: 'occasional' },
      { label: '正在告别', value: 'farewell' },
    ],
  },
  {
    key: 'memory',
    type: 'input',
    text: '如果它记得一件事，你希望是什么？',
    placeholder: '轻声说出来……',
    maxLength: 80,
  },
  {
    key: 'intention',
    type: 'buttons',
    text: '你希望这场对话，讲述什么？',
    options: [
      { label: '它的故事', value: 'story' },
      { label: '它眼中的你', value: 'mirror' },
      { label: '告别', value: 'farewell' },
      { label: '随性闲聊', value: 'chat' },
    ],
  },
  {
    key: 'moodLabel',
    type: 'buttons',
    text: '此刻，你希望这段独白的心情是？',
    options: [
      { label: '低落', value: 'low' },
      { label: '平静', value: 'calm' },
      { label: '温暖', value: 'warm' },
      { label: '愉悦', value: 'joy' },
    ],
  },
];

let qIndex = 0;

function startChat() {
  qIndex = 0;
  renderQuestion();
}

function updateProgress() {
  const pct = (qIndex / questions.length) * 100;
  $('progressBar').style.width = pct + '%';
}

function renderQuestion() {
  if (qIndex >= questions.length) {
    finishChat();
    return;
  }
  updateProgress();
  const q = questions[qIndex];
  const block = $('questionBlock');
  block.innerHTML = '';
  block.classList.remove('fade-out-down');
  block.classList.add('fade-in-up');

  const textEl = document.createElement('div');
  textEl.className = 'question-text';
  textEl.textContent = q.text;
  block.appendChild(textEl);

  if (q.type === 'buttons') renderButtons(q, block);
  else if (q.type === 'cards') renderCards(q, block);
  else if (q.type === 'input') renderInput(q, block);
}

function renderButtons(q, block) {
  const wrap = document.createElement('div');
  wrap.className = 'options-buttons';
  q.options.forEach((opt) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = opt.label;
    btn.addEventListener('click', () => {
      if (wrap.querySelector('.selected')) return;
      btn.classList.add('selected');
      state.answers[q.key] = opt.value;
      const delay = opt.autoAdvance ? opt.autoAdvance : 350;
      advanceQuestion(delay);
    });
    wrap.appendChild(btn);
  });
  block.appendChild(wrap);
}

function renderCards(q, block) {
  const wrap = document.createElement('div');
  wrap.className = 'options-cards';
  q.options.forEach((opt) => {
    const card = document.createElement('button');
    card.className = 'opt-card';
    card.textContent = opt.label;
    card.addEventListener('click', () => {
      if (wrap.querySelector('.selected')) return;
      card.classList.add('selected');
      state.answers[q.key] = opt.value;
      advanceQuestion(450);
    });
    wrap.appendChild(card);
  });
  block.appendChild(wrap);
}

function renderInput(q, block) {
  const wrap = document.createElement('div');
  wrap.className = 'options-input';
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'memory-input';
  input.placeholder = q.placeholder || '';
  input.maxLength = q.maxLength || 80;
  const submit = () => {
    const val = input.value.trim();
    state.answers[q.key] = val;
    advanceQuestion(350);
  };
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      submit();
    }
  });
  const btn = document.createElement('button');
  btn.className = 'continue-btn';
  btn.textContent = '继续';
  btn.addEventListener('click', submit);
  wrap.appendChild(input);
  wrap.appendChild(btn);
  block.appendChild(wrap);
  setTimeout(() => input.focus(), 100);
}

function advanceQuestion(delay) {
  const block = $('questionBlock');
  setTimeout(() => {
    block.classList.add('fade-out-down');
    setTimeout(() => {
      qIndex++;
      renderQuestion();
    }, 420);
  }, delay);
}

$('skipLink').addEventListener('click', () => {
  finishChat();
});

function finishChat() {
  $('progressBar').style.width = '100%';
  computeEmotionIndex();
  setTimeout(() => {
    showScreen('generate');
    startGenerate();
  }, 500);
}

/* ========== 情感指数计算 ========== */
function computeEmotionIndex() {
  const baseline = { low: 0.18, calm: 0.42, warm: 0.62, joy: 0.85 };
  let idx = baseline[state.answers.moodLabel] !== undefined ? baseline[state.answers.moodLabel] : 0.5;
  if (state.answers.relationship === 'farewell') idx = Math.max(0, idx - 0.08);
  if (state.answers.relationship === 'daily') idx = Math.min(1, idx + 0.05);
  state.emotionIndex = idx;
  applyMoodColor(idx);
}

function applyMoodColor(idx) {
  // 0 → 冷灰蓝, 0.5 → 柔青, 1 → 暖琥珀
  const stops = [
    { p: 0,   c: [150, 165, 175] },
    { p: 0.5, c: [106, 122, 122] },
    { p: 1,   c: [196, 160, 96] },
  ];
  let lo = stops[0], hi = stops[stops.length - 1];
  for (let i = 0; i < stops.length - 1; i++) {
    if (idx >= stops[i].p && idx <= stops[i + 1].p) {
      lo = stops[i]; hi = stops[i + 1]; break;
    }
  }
  const t = (idx - lo.p) / (hi.p - lo.p || 1);
  const r = Math.round(lo.c[0] + (hi.c[0] - lo.c[0]) * t);
  const g = Math.round(lo.c[1] + (hi.c[1] - lo.c[1]) * t);
  const b = Math.round(lo.c[2] + (hi.c[2] - lo.c[2]) * t);
  document.documentElement.style.setProperty('--mood-color', `rgb(${r},${g},${b})`);
}

/* ========== 生成页 ========== */
const breathStage = $('breathStage');
const breathCircle = $('breathCircle');
const thinkingText = $('thinkingText');
const particleCanvas = $('particle-canvas');
const monoInner = $('monoInner');
const monologueText = $('monologueText');
const generateActions = $('generateActions');

const thinkingStages = [
  { t: 0,    text: '正在观察……' },
  { t: 3000, text: '正在感受……' },
  { t: 5000, text: '正在回忆……' },
  { t: 7000, text: '即将开口……' },
];
let thinkingTimers = [];
let generateStarted = 0;

function startGenerate() {
  breathStage.style.display = 'flex';
  breathCircle.style.animation = '';
  void breathCircle.offsetWidth;
  breathCircle.style.animation = 'breathing 8.5s ease-in-out infinite';
  thinkingText.style.opacity = '1';
  thinkingText.textContent = thinkingStages[0].text;
  particleCanvas.style.display = 'none';
  monologueText.style.display = 'none';
  generateActions.classList.remove('show');

  thinkingTimers.forEach(clearTimeout);
  thinkingTimers = [];
  thinkingStages.slice(1).forEach(s => {
    thinkingTimers.push(setTimeout(() => {
      thinkingText.style.opacity = '0';
      setTimeout(() => {
        thinkingText.textContent = s.text;
        thinkingText.style.opacity = '1';
      }, 400);
    }, s.t));
  });

  generateStarted = Date.now();
  // 模拟 API 调用：8s 后返回独白
  state.monologue = generateMockMonologue();
  setTimeout(() => onMonologueReady(), 8000);
}

function onMonologueReady() {
  // 呼吸圆消失
  breathCircle.style.animation = 'shrinkAway 1s var(--ease-in-out-back) forwards';
  thinkingTimers.forEach(clearTimeout);
  thinkingText.style.opacity = '0';
  setTimeout(() => {
    breathStage.style.display = 'none';
    startParticleAnimation();
  }, 950);
}

/* ========== 模拟独白生成 ========== */
function generateMockMonologue() {
  const a = state.answers;
  const memory = a.memory || '那些没有说出口的时刻';
  let intro = '';
  if (a.intention === 'story') {
    intro = '我一直沉默地守在你身边，比任何语言都更早地认识你。';
  } else if (a.intention === 'mirror') {
    intro = '你总以为自己在凝视我，其实是我一直在凝视你。';
  } else if (a.intention === 'farewell') {
    intro = '我听见你轻声说再见，那一瞬间，我也学会了放手。';
  } else {
    intro = '今天的光线很柔和，像你偶尔想起我时的样子。';
  }

  let body = '';
  if (a.owner === 'other') {
    body = '我曾属于另一个人的掌心，那些温度至今还停留在我的纹理之间。';
  } else {
    body = '我从你手中诞生，也在你手中慢慢变旧，这是我最大的幸运。';
  }

  let memoryLine = '';
  if (memory) {
    memoryLine = `如果我只记得一件事，那就是——${memory}。`;
  }

  let moodLine = '';
  if (a.moodLabel === 'low') moodLine = '此刻的风有些凉，但我不忍心说破。';
  else if (a.moodLabel === 'calm') moodLine = '我安静地坐着，像一池不兴波澜的水。';
  else if (a.moodLabel === 'warm') moodLine = '我身上还留着一束看不见的暖光。';
  else if (a.moodLabel === 'joy') moodLine = '我忍不住轻轻地颤动，像是被什么逗笑了。';

  let farewell = '';
  if (a.relationship === 'farewell' || a.intention === 'farewell') {
    farewell = '不必难过。被你记得，已经是我最完整的告别。';
  } else {
    farewell = '我会继续在这里，替你保管那些来不及说出口的话。';
  }

  return [intro, body, memoryLine, moodLine, farewell].filter(Boolean).join('\n');
}

/* ========== Canvas 粒子汇聚 ========== */
function startParticleAnimation() {
  const canvas = particleCanvas;
  canvas.style.display = 'block';
  const dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth;
  const h = window.innerHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  // 文字采样
  const targets = sampleTextTargets(state.monologue, w, h);
  // 粒子
  const particles = buildParticles(targets, w, h);

  const duration = 1200;
  const ease = (t) => 1 - Math.pow(1 - t, 4);
  const startTime = performance.now();

  function frame(now) {
    ctx.clearRect(0, 0, w, h);
    let allDone = true;
    for (const p of particles) {
      const elapsed = now - startTime - p.delay;
      if (elapsed < 0) continue;
      const t = Math.min(1, elapsed / duration);
      const e = ease(t);
      const x = p.sx + (p.tx - p.sx) * e;
      const y = p.sy + (p.ty - p.sy) * e;
      const alpha = 0.55 + (1 - 0.55) * e;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#111111';
      ctx.beginPath();
      ctx.arc(x, y, 1.1, 0, Math.PI * 2);
      ctx.fill();
      if (t < 1) allDone = false;
    }
    ctx.globalAlpha = 1;
    if (!allDone) {
      requestAnimationFrame(frame);
    } else {
      // 进入打字机
      setTimeout(() => {
        canvas.style.display = 'none';
        startTypewriter();
      }, 400);
    }
  }
  requestAnimationFrame(frame);
}

function sampleTextTargets(text, w, h) {
  const off = document.createElement('canvas');
  off.width = w;
  off.height = h;
  const ctx = off.getContext('2d');
  const fontSize = Math.min(20, Math.max(14, Math.floor(w / 26)));
  const lineHeight = fontSize * 1.9;
  const maxWidth = Math.min(520, w - 60);
  const fontStr = `${fontSize}px -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif`;
  ctx.font = fontStr;
  ctx.fillStyle = '#111';
  ctx.textBaseline = 'top';

  // 截取前 120 字
  const raw = (text || '').slice(0, 120);
  // 按字符宽度换行
  const lines = [];
  let cur = '';
  for (const ch of raw) {
    if (ch === '\n') {
      lines.push(cur);
      cur = '';
      continue;
    }
    const test = cur + ch;
    if (ctx.measureText(test).width > maxWidth && cur) {
      lines.push(cur);
      cur = ch;
    } else {
      cur = test;
    }
  }
  if (cur) lines.push(cur);
  const maxLines = 8;
  const used = lines.slice(0, maxLines);
  const totalHeight = used.length * lineHeight;
  const startY = Math.max(60, (h - totalHeight) / 2);

  used.forEach((line, i) => {
    const lineW = ctx.measureText(line).width;
    const x = (w - lineW) / 2;
    const y = startY + i * lineHeight;
    ctx.fillText(line, x, y);
  });

  // 像素采样
  const imageData = ctx.getImageData(0, 0, w, h);
  const data = imageData.data;
  const step = 3;
  const points = [];
  for (let y = 0; y < h; y += step) {
    for (let x = 0; x < w; x += step) {
      const idx = (y * w + x) * 4 + 3;
      if (data[idx] > 120) {
        points.push({ x, y });
      }
    }
  }
  // 降采样到 700
  if (points.length > 700) {
    const ratio = points.length / 700;
    const down = [];
    for (let i = 0; i < 700; i++) {
      down.push(points[Math.floor(i * ratio)]);
    }
    return down;
  }
  return points;
}

function buildParticles(targets, w, h) {
  const cx = w / 2, cy = h / 2;
  const maxDist = Math.max(w, h);
  return targets.map((t) => {
    const angle = Math.random() * Math.PI * 2;
    const dist = maxDist * (0.6 + Math.random() * 0.4);
    return {
      tx: t.x,
      ty: t.y,
      sx: cx + Math.cos(angle) * dist,
      sy: cy + Math.sin(angle) * dist,
      delay: Math.random() * 300,
    };
  });
}

/* ========== 打字机 ========== */
function startTypewriter() {
  monologueText.style.display = 'flex';
  monoInner.innerHTML = '';
  generateActions.classList.remove('show');
  const text = state.monologue || '';
  let i = 0;
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  monoInner.appendChild(cursor);

  function typeNext() {
    if (i < text.length) {
      const ch = text[i];
      const node = document.createTextNode(ch);
      monoInner.insertBefore(node, cursor);
      i++;
      setTimeout(typeNext, 40);
    } else {
      generateActions.classList.add('show');
    }
  }
  setTimeout(typeNext, 200);
}
