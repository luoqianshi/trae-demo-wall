<title>宿舍凉席大战 - 用游戏化解宿舍矛盾</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none}
body{background:#0f0f23;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}
#gameWrapper{position:relative;width:100vw;height:100vh;max-width:100vw;max-height:100vh;overflow:hidden}
canvas{display:block;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);image-rendering:pixelated;image-rendering:crisp-edges}
#uiOverlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
.touchBtn{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:12px;font-weight:bold;pointer-events:auto;backdrop-filter:blur(5px);transition:transform 0.1s}
.touchBtn:active{transform:scale(0.85)}
#countdown{position:absolute;top:20px;left:50%;transform:translateX(-50%);font-size:28px;font-weight:bold;color:white;text-shadow:0 2px 10px rgba(0,0,0,0.5);z-index:15;pointer-events:none;display:none;font-family:monospace}
#countdown.low{color:#FF5252;animation:countdownPulse 0.5s ease-in-out infinite}
@keyframes countdownPulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.1)}}
#tutorial{position:absolute;bottom:150px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);color:white;padding:10px 20px;border-radius:20px;font-size:13px;z-index:15;pointer-events:none;animation:tutorialBounce 2s ease-in-out infinite;display:none;white-space:nowrap}
@keyframes tutorialBounce{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-5px)}}
.float-text{position:absolute;font-weight:bold;pointer-events:none;z-index:20;animation:floatUp 1.5s ease-out forwards}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-60px) scale(1.2)}}
#skipBtn{position:absolute;top:15px;right:15px;padding:8px 20px;background:rgba(0,0,0,0.6);color:white;border:1px solid rgba(255,255,255,0.3);border-radius:20px;font-size:13px;z-index:50;cursor:pointer;pointer-events:auto;display:none}
#skipBtn:hover{background:rgba(255,255,255,0.15)}
#exitBtn{position:absolute;top:15px;left:15px;padding:8px 20px;background:rgba(255,80,80,0.6);color:white;border:1px solid rgba(255,100,100,0.5);border-radius:20px;font-size:13px;z-index:50;cursor:pointer;pointer-events:auto;display:none}
#exitBtn:hover{background:rgba(255,100,100,0.8)}
#teamIndicator{position:absolute;top:60px;left:15px;z-index:15;pointer-events:none;display:none}

#controlsBar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.55);color:#fff;padding:6px 16px;border-radius:14px;font-size:12px;z-index:15;pointer-events:none;display:none;letter-spacing:0.5px;white-space:nowrap}

// ========== 音效系统（极简克制版） ==========
const AudioCtx=window.AudioContext||window.webkitAudioContext;
let audioCtx=null;
let sfxEnabled=true,sfxVolume=0.4;
let sfxGain=null;

function initAudio(){if(!audioCtx){audioCtx=new AudioCtx();sfxGain=audioCtx.createGain();sfxGain.gain.value=sfxVolume;sfxGain.connect(audioCtx.destination)}}

function playSFX(type){
if(!sfxEnabled||!audioCtx)return;
const now=audioCtx.currentTime;
// 极简克制：只保留场景氛围音效，不用 square 波，音量极低
switch(type){
case'textPop':{ // 剧情文字弹出：极轻水滴感
const osc=audioCtx.createOscillator();const g=audioCtx.createGain();
osc.type='sine';osc.frequency.setValueAtTime(1600,now);osc.frequency.exponentialRampToValueAtTime(2200,now+0.025);
g.gain.setValueAtTime(0.03,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.04);
osc.connect(g);g.connect(sfxGain);osc.start(now);osc.stop(now+0.04);break;}
case'inspectorWarn':{ // 宿管警告：低频嗡鸣，不刺耳
const osc=audioCtx.createOscillator();const g=audioCtx.createGain();
osc.type='triangle';osc.frequency.setValueAtTime(180,now);osc.frequency.exponentialRampToValueAtTime(90,now+0.35);
g.gain.setValueAtTime(0.06,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.45);
osc.connect(g);g.connect(sfxGain);osc.start(now);osc.stop(now+0.45);break;}
case'gameover':{ // 结束：极简两个下降音
[360,280].forEach((f,i)=>{
const o=audioCtx.createOscillator();const g2=audioCtx.createGain();
o.type='sine';o.frequency.value=f;
g2.gain.setValueAtTime(0.05,now+i*0.25);g2.gain.exponentialRampToValueAtTime(0.001,now+i*0.25+0.2);
o.connect(g2);g2.connect(sfxGain);
o.start(now+i*0.25);o.stop(now+i*0.25+0.2);
});break;}
}
}

function setSFXVol(v){sfxVolume=v;if(sfxGain)sfxGain.gain.value=v}

}e.preventDefault()});

const joystickKnob=document.createElement('div');
joystickKnob.style.cssText='position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,0.4)';

joystick.addEventListener('touchstart',e=>{e.preventDefault();joystickActive=true;const r=joystick.getBoundingClientRect();joystickStartX=r.left+r.width/2;joystickStartY=r.top+r.height/2});
joystick.addEventListener('touchmove',e=>{e.preventDefault();if(!joystickActive)return;const t=e.touches[0];let dx=t.clientX-joystickStartX;let dy=t.clientY-joystickStartY;const dist=Math.sqrt(dx*dx+dy*dy);const max=50;if(dist>max){dx=dx/dist*max;dy=dy/dist*max}joystickDX=dx/max;joystickDY=dy/max;joystickKnob.style.transform='translate(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px))'});
joystick.addEventListener('touchend',e=>{e.preventDefault();joystickActive=false;joystickDX=0;joystickDY=0;joystickKnob.style.transform='translate(-50%,-50%)'});

// ========== 游戏状态 ==========
let gameState='intro',players=[],weapons=[],projectiles=[],effects=[],tickleNumbers=[],foodItems=[],gamePaused=false,pauseTimer=0,pauseText='',pauseSubtext='',pauseColor='#FFF',pauseFloatY=0,settingsOpen=false;
let cameraShake=0,shakeIntensity=0,animTime=0,pickupAvailable=null;
let currentEvent=null,eventTimer=0,nextEventTime=8000;
let inspector=null,takeawayGuy=null;
let gameTime=GAME_TIME,gameTimeInterval=null;
let tutorialStep=0,lastTime=0;
let introPhase=0,introTimer=0,storyTextIdx=0;
let transitionProgress=0;

// ========== 工具函数 ==========
function lightenColor(hex,amount){
const num=parseInt(hex.replace('#',''),16);
const r=Math.min(255,Math.round(((num>>16)&255)*(1+amount)));
const g=Math.min(255,Math.round(((num>>8)&255)*(1+amount)));
const b=Math.min(255,Math.round((num&255)*(1+amount)));
return '#'+(r*65536+g*256+b).toString(16).padStart(6,'0');
}
function darkenColor(hex,amount){
const num=parseInt(hex.replace('#',''),16);
const r=Math.max(0,Math.round(((num>>16)&255)*(1-amount)));
const g=Math.max(0,Math.round(((num>>8)&255)*(1-amount)));
const b=Math.max(0,Math.round((num&255)*(1-amount)));
return '#'+(r*65536+g*256+b).toString(16).padStart(6,'0');
}

// ========== 像素风开场（左右对飘交融） ==========
const DORM_WARM=[
'帮我带个外卖','开黑吗开黑吗','生日蛋糕！',
'借我抄抄作业','谁有充电宝','一起吃泡面',
'帮我占个座','五排缺一个','今天去打球吗',
'走！干饭去','分享耳机听','帮我答个到',
'明天早八帮我','周末去看电影','夜宵走起',
'帮我带瓶水','一起复习吧','今天好开心',
];
const DORM_RANT=[
'他又打呼噜！','谁拿了我零食','半夜打电话吵死了',
'空调太冷了啊','袜子能不能别乱扔','你闹钟响了一早上',
'又用我洗发水','厕所能不能冲','外卖盒子堆三天了',
'能不能别外放','谁把我衣服碰地上了','晚上打游戏小点声',
]
const WARM_COLORS=['#ffd54f','#ffcc80','#ffe0b2','#ffab91','#fff59d','#ffb74d'];
const RANT_COLORS=['#7986cb','#90caf9','#64b5f6','#5c6bc0','#42a5f5','#9fa8da'];

function lerpHex(a,b,t){
	const ar=parseInt(a.slice(1,3),16),ag=parseInt(a.slice(3,5),16),ab=parseInt(a.slice(5,7),16);
	const br=parseInt(b.slice(1,3),16),bg=parseInt(b.slice(3,5),16),bb=parseInt(b.slice(5,7),16);
	const r=Math.round(ar+(br-ar)*t),g=Math.round(ag+(bg-ag)*t),bl=Math.round(ab+(bb-ab)*t);
	return '#'+r.toString(16).padStart(2,'0')+g.toString(16).padStart(2,'0')+bl.toString(16).padStart(2,'0');
}

let floatTexts=[];
let mergeProgress=0;
let floatTextsFading=false;
let floatTextsFadeTimer=0;

function makeFloatText(isWarm){
	const pool=isWarm?DORM_WARM:DORM_RANT;
	const colors=isWarm?WARM_COLORS:RANT_COLORS;
	const halfW=CANVAS_W/2;
	return{
		text:pool[Math.floor(Math.random()*pool.length)],
		isWarm:isWarm,
		x:isWarm?halfW+Math.random()*halfW:Math.random()*halfW,
		y:50+Math.random()*(CANVAS_H-100),
		vx:isWarm?-0.8-Math.random()*0.6:0.8+Math.random()*0.6,
		vy:(Math.random()-0.5)*0.4,
		size:13+Math.random()*6,
		alpha:0,
		targetAlpha:0.55+Math.random()*0.3,
		rot:(Math.random()-0.5)*0.02,
		color:colors[Math.floor(Math.random()*colors.length)],
		bobOffset:Math.random()*Math.PI*2,
		bobSpeed:0.002+Math.random()*0.002,
		bobAmp:0.15+Math.random()*0.1,
		wanderAngle:Math.random()*Math.PI*2,
		wanderSpeed:0.003+Math.random()*0.002,
	};
}

function initFloatTexts(){
	floatTexts=[];
	mergeProgress=0;
	for(let i=0;i<12;i++)floatTexts.push(makeFloatText(false));
	for(let i=0;i<12;i++)floatTexts.push(makeFloatText(true));
}
initFloatTexts();

function updateFloatTexts(dt){
	const halfW=CANVAS_W/2;
	// 消散动画：文字四散飘走+淡出
	if(floatTextsFading){
		floatTextsFadeTimer+=dt;
		for(let t of floatTexts){
			// 有的往上飘，有的往下掉，随机方向飞散
			t.x+=t.vx*2.5;
			t.y+=t.vy*2.5;
			t.alpha=Math.max(0,t.alpha-0.015);
			t.rot+=0.05;
			t.size*=0.995;
		}
		return;
	}
	for(let t of floatTexts){
		t.alpha=Math.min(t.targetAlpha,t.alpha+0.008);
		t.wanderAngle+=t.wanderSpeed+(Math.random()-0.5)*0.1;
		t.vx+=Math.cos(t.wanderAngle)*0.02;
		t.vy+=Math.sin(t.wanderAngle)*0.02;
		const maxV=1.2;
		const spd=Math.sqrt(t.vx*t.vx+t.vy*t.vy);
		if(spd>maxV){t.vx=t.vx/spd*maxV; t.vy=t.vy/spd*maxV;}
		t.vx+=t.isWarm?-0.01:0.01;
		t.x+=t.vx;
		t.y+=t.vy+Math.sin(animTime*t.bobSpeed+t.bobOffset)*t.bobAmp;
		t.rot=Math.sin(animTime*t.bobSpeed+t.bobOffset)*0.03;
	}
	// 碰撞分离：避免文字重叠
	const minDist=45;
	for(let i=0;i<floatTexts.length;i++){
		for(let j=i+1;j<floatTexts.length;j++){
			const a=floatTexts[i],b=floatTexts[j];
			const dx=b.x-a.x,dy=b.y-a.y;
			const dist=Math.sqrt(dx*dx+dy*dy);
			if(dist<minDist){
				const overlap=minDist-dist;
				const nx=dx/dist,ny=dy/dist;
				a.x-=nx*overlap*0.5;
				a.y-=ny*overlap*0.5;
				b.x+=nx*overlap*0.5;
				b.y+=ny*overlap*0.5;
			}
		}
	}
	// 边界处理
	for(let t of floatTexts){
		if(t.x<20)t.x=20;
		if(t.x>CANVAS_W-20)t.x=CANVAS_W-20;
		if(t.y<30)t.y=30;
		if(t.y>CANVAS_H-30)t.y=CANVAS_H-30;
	}
	if(mergeProgress<1){
		mergeProgress=Math.min(1,mergeProgress+dt/6000);
	}
}

function drawFloatTexts(ctx){
	for(let t of floatTexts){
		ctx.save();
		ctx.translate(t.x,t.y);
		ctx.rotate(t.rot);
		ctx.globalAlpha=t.alpha;
		ctx.fillStyle=t.color;
		ctx.font='bold '+t.size+'px monospace';
		ctx.textAlign='center';
		ctx.shadowColor=t.color;
		ctx.shadowBlur=4;
		ctx.fillText(t.text,0,0);
		ctx.restore();
	}
}

function drawVoxelBlock(ctx,x,y,w,h,color,topColor,sideColor){
ctx.fillStyle=color;
ctx.fillRect(x,y,w,h);
ctx.fillStyle=topColor||lightenColor(color,0.2);
ctx.fillRect(x,y,w,Math.max(3,h*0.15));
ctx.fillStyle=sideColor||darkenColor(color,0.15);
ctx.fillRect(x+w-Math.max(3,w*0.08),y,Math.max(3,w*0.08),h);
ctx.strokeStyle=darkenColor(color,0.3);
ctx.lineWidth=1;
ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);
}

ctx.fillRect(x-5*px,cy-18*px,2*px,3*px);
ctx.fillRect(x+3*px,cy-18*px,2*px,3*px);

ctx.fillStyle='#333';
ctx.fillRect(x-2.5*px,cy-15*px,1.5*px,1.5*px);
ctx.fillRect(x+1*px,cy-15*px,1.5*px,1.5*px);

drawVoxelBlock(ctx,x-4*px,cy,3*px,8*px,'#5C6BC0','#7986CB','#3949AB');
drawVoxelBlock(ctx,x+1*px,cy,3*px,8*px,'#5C6BC0','#7986CB','#3949AB');

}

const PX=2;
function px(ctx,x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x*PX,y*PX,w*PX,h*PX);}

function drawPixelDorm(ctx,animTime,isDark=false){
	const W=CANVAS_W/PX,H=CANVAS_H/PX;
	const mp=isDark?0:mergeProgress;
	ctx.save();

	// 背景：冷色→暖色随融合进度渐变（更温馨）
	const c0=lerpHex('#2a2a3e','#4a3528',mp);
	const c1=lerpHex('#352f44','#5a3d28',mp);
	const c2=lerpHex('#3d3550','#6a4830',mp);
	const c3=lerpHex('#453a58','#7a5238',mp);
	const bgGrad=ctx.createLinearGradient(0,0,0,CANVAS_H);
	bgGrad.addColorStop(0,c0);
	bgGrad.addColorStop(0.4,c1);
	bgGrad.addColorStop(0.7,c2);
	bgGrad.addColorStop(1,c3);
	ctx.fillStyle=bgGrad;ctx.fillRect(0,0,CANVAS_W,CANVAS_H);

	// 整体环境光（熄灯时使用冷光）
	if(isDark){
		const ambientGlow=ctx.createRadialGradient(CANVAS_W/2,CANVAS_H*0.6,50,CANVAS_W/2,CANVAS_H*0.6,500);
		ambientGlow.addColorStop(0,'rgba(100,150,200,0.1)');
		ambientGlow.addColorStop(0.5,'rgba(80,120,180,0.05)');
		ambientGlow.addColorStop(1,'rgba(60,100,160,0)');
		ctx.fillStyle=ambientGlow;ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
	}else{
		const ambientGlow=ctx.createRadialGradient(CANVAS_W/2,CANVAS_H*0.6,50,CANVAS_W/2,CANVAS_H*0.6,500);
		ambientGlow.addColorStop(0,'rgba(255,200,120,'+(0.15+mp*0.2)+')');
		ambientGlow.addColorStop(0.5,'rgba(255,180,100,'+(0.08+mp*0.1)+')');
		ambientGlow.addColorStop(1,'rgba(255,160,80,0)');
		ctx.fillStyle=ambientGlow;ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
	}

	// 窗户方向的光照射（熄灯时使用冷光）
	if(isDark){
		const windowGlow=ctx.createRadialGradient(330*PX,80*PX,20,330*PX,80*PX,350);
		windowGlow.addColorStop(0,'rgba(120,180,220,0.15)');
		windowGlow.addColorStop(0.4,'rgba(100,160,200,0.08)');
		windowGlow.addColorStop(1,'rgba(80,140,180,0)');
		ctx.fillStyle=windowGlow;ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
	}else{
		const windowGlow=ctx.createRadialGradient(330*PX,80*PX,20,330*PX,80*PX,350);
		windowGlow.addColorStop(0,'rgba(255,220,160,'+(0.25+mp*0.2)+')');
		windowGlow.addColorStop(0.4,'rgba(255,200,140,'+(0.12+mp*0.1)+')');
		windowGlow.addColorStop(1,'rgba(255,180,120,0)');
		ctx.fillStyle=windowGlow;ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
	}

	// 中央主光
	if(mp>0.2){
		const glowAlpha=(mp-0.2)*0.5;
		const glow=ctx.createRadialGradient(CANVAS_W/2,CANVAS_H/2+50,50,CANVAS_W/2,CANVAS_H/2+50,350+mp*150);
		glow.addColorStop(0,'rgba(255,240,200,'+glowAlpha+')');
		glow.addColorStop(0.5,'rgba(255,220,160,'+(glowAlpha*0.5)+')');
		glow.addColorStop(1,'rgba(255,200,140,0)');
		ctx.fillStyle=glow;ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
	}

	// 体积光（从窗户透进来的光束）
	if(mp>0.3){
		const volAlpha=(mp-0.3)*0.25;
		ctx.save();
		ctx.globalCompositeOperation='lighter';
		const volGrad=ctx.createLinearGradient(330*PX,80*PX,300*PX,350*PX);
		volGrad.addColorStop(0,'rgba(255,240,200,'+volAlpha+')');
		volGrad.addColorStop(0.3,'rgba(255,230,180,'+(volAlpha*0.6)+')');
		volGrad.addColorStop(1,'rgba(255,220,160,0)');
		ctx.fillStyle=volGrad;
		ctx.beginPath();
		ctx.moveTo(280*PX,80*PX);
		ctx.lineTo(400*PX,80*PX);
		ctx.lineTo(480*PX,350*PX);
		ctx.lineTo(220*PX,350*PX);
		ctx.closePath();
		ctx.fill();
		ctx.restore();
	}

	// 漂浮灰尘粒子
	const dustCount=25;
	for(let i=0;i<dustCount;i++){
		const seed=i*137.5;
		const dx=((animTime*0.02+seed*7)%W+W)%W;
		const dy=((animTime*0.015+seed*11)%H+H)%H;
		const size=(i%3===0?2:1);
		const alpha=0.15+Math.sin(animTime*0.002+i)*0.1;
		px(ctx,Math.floor(dx),Math.floor(dy),size,size,'rgba(255,240,200,'+alpha+')');
	}

const floorY=300;
drawRealFloor(ctx,W,floorY,H);

drawLeftDesks(ctx,0,195,floorY,animTime);

drawRightBeds(ctx,420,100,floorY,animTime);

drawBalcony(ctx,W-80,80,floorY,animTime);

drawWindow(ctx,260,30,140,95,animTime);

drawRoomDetails(ctx,animTime);

drawPixelVignette(ctx);

ctx.restore();
}

function drawRealFloor(ctx,W,floorY,H){
const floorH=H-floorY;
// 地板底色渐变
const fg=ctx.createLinearGradient(0,floorY*PX,0,H*PX);
fg.addColorStop(0,'#b89870');
fg.addColorStop(0.5,'#9c8060');
fg.addColorStop(1,'#7e6048');
ctx.fillStyle=fg;
ctx.fillRect(0,floorY*PX,W*PX,floorH*PX);
// 地板缝
ctx.strokeStyle='rgba(60,40,25,0.3)';
ctx.lineWidth=1;
for(let x=0;x<W;x+=28){
ctx.beginPath();
ctx.moveTo(x*PX,floorY*PX);
ctx.lineTo(x*PX,H*PX);
ctx.stroke();
}
for(let y=floorY;y<H;y+=14){
ctx.beginPath();
ctx.moveTo(0,y*PX);
ctx.lineTo(W*PX,y*PX);
ctx.stroke();
}
// 地板高光
ctx.fillStyle='rgba(255,220,180,0.15)';
ctx.fillRect(0,floorY*PX,W*PX,2*PX);
// 木纹
ctx.fillStyle='rgba(70,50,30,0.15)';
for(let x=0;x<W;x+=28){
ctx.fillRect((x+5)*PX,(floorY+3)*PX,15*PX,1*PX);
ctx.fillRect((x+8)*PX,(floorY+8)*PX,12*PX,1*PX);
}
}

function drawLeftDesks(ctx,startX,startY,floorY,animTime){
	const deskW=75,deskH=floorY-startY;
	const gap=25;
	for(let i=0;i<3;i++){
		const dx=startX+i*(deskW+gap);
		drawOneDesk(ctx,dx,startY,deskW,deskH,i,animTime);
	}
}

function drawOneDesk(ctx,x,y,w,h,idx,animTime){
const wood1='#8b7355';
const wood2='#6b5340';
const wood3='#a08060';
const wood4='#5a4535';
const wood5='#7a6048';

// 桌面：增加厚度感和高光边缘
for(let dx=0;dx<w;dx++){
for(let dy=0;dy<6;dy++){
let c;
if(dy===0)c=lightenColor(wood3,0.2);
else if(dy===1)c=wood3;
else if(dy===5)c=wood2;
else c=wood1;
px(ctx,x+dx,y+dy,1,1,c);
}
}

// 桌腿加粗，增加立体感
for(let dy=6;dy<h-4;dy++){
px(ctx,x+2,y+dy,6,1,wood2);
px(ctx,x+3,y+dy,4,1,dy%8===0?wood4:wood1);
px(ctx,x+w-8,y+dy,6,1,wood2);
px(ctx,x+w-7,y+dy,4,1,dy%8===0?wood4:wood1);
}

// 底部支撑条
for(let dx=0;dx<w;dx++){
for(let dy=0;dy<4;dy++){
px(ctx,x+dx,y+h-4+dy,1,1,dy===0?wood4:wood3);
}
}

// 中间抽屉
const dw=28,dh=16;
const dx=x+Math.floor((w-dw)/2),dy=y+Math.floor((h-dh)/2);
for(let ddy=0;ddy<dh;ddy++){
for(let ddx=0;ddx<dw;ddx++){
let c;
if(ddx<1||ddx>dw-2||ddy<1||ddy>dh-2)c=wood4;
else c=ddy===1?lightenColor(wood1,0.1):wood1;
px(ctx,dx+ddx,dy+ddy,1,1,c);
}
}
// 抽屉把手
px(ctx,dx+Math.floor(dw/2)-2,dy+Math.floor(dh/2),6,1,'#c0a070');
px(ctx,dx+Math.floor(dw/2)-1,dy+Math.floor(dh/2)-1,4,1,lightenColor('#c0a070',0.2));

drawDeskItems(ctx,x,y,idx,animTime);

drawChair(ctx,x+w+5,y+h-5,animTime);
}

function drawDeskItems(ctx,x,y,idx,animTime){
const items=[
[{type:'cup',c:'#e53935'},{type:'phone',c:'#1a1a1a'},{type:'book',c:'#1565c0'}],
[{type:'cup',c:'#43a047'},{type:'pen',c:'#ff9800'},{type:'glasses',c:'#333'}],
[{type:'cup',c:'#fb8c00'},{type:'phone',c:'#424242'},{type:'mouse',c:'#333'}],
];
const deskItems=items[idx]||items[0];
let ix=x+5;
for(let item of deskItems){
if(item.type==='cup'){
for(let dy=0;dy<12;dy++){
for(let dx=0;dx<8;dx++){
if(dx===0||dx===7||dy===0||dy===11){
px(ctx,ix+dx,y-20+dy,1,1,darkenColor(item.c,0.2));
}else{
px(ctx,ix+dx,y-20+dy,1,1,item.c);
}
}
}
px(ctx,ix+2,y-28,4,1,'rgba(255,255,255,0.4)');
px(ctx,ix+3,y-30,2,1,'rgba(255,255,255,0.3)');
ix+=12;
}else if(item.type==='phone'){
for(let dy=0;dy<20;dy++){
for(let dx=0;dx<10;dx++){
if(dx===0||dx===9||dy===0||dy===19){
px(ctx,ix+dx,y-28+dy,1,1,'#1a1a1a');
}else{
px(ctx,ix+dx,y-28+dy,1,1,'#2a2a2a');
}
}
}
for(let dy=2;dy<17;dy++){
for(let dx=2;dx<8;dx++){
const n=(dy*7+dx*3)%10;
px(ctx,ix+dx,y-26+dy,1,1,n<5?'#1565c0':'#1976d2');
}
}
ix+=14;
}else if(item.type==='book'){
for(let dy=0;dy<5;dy++){
for(let dx=0;dx<16;dx++){
if(dx<1||dx>14)px(ctx,ix+dx,y-10+dy,1,1,darkenColor(item.c,0.2));
else if(dy<1)px(ctx,ix+dx,y-10+dy,1,1,lightenColor(item.c,0.15));
else px(ctx,ix+dx,y-10+dy,1,1,item.c);
}
}
ix+=20;
}else if(item.type==='pen'){
px(ctx,ix,y-8,2,8,'#ffcc00');
px(ctx,ix,y-12,2,4,'#333');
ix+=6;
}else if(item.type==='glasses'){
for(let side=0;side<2;side++){
const ox=side*8;
px(ctx,ix+ox,y-5,5,3,'rgba(50,50,50,0.8)');
px(ctx,ix+ox+1,y-4,3,1,'rgba(100,100,100,0.5)');
}
ix+=18;
}else if(item.type==='mouse'){
for(let dy=0;dy<10;dy++){
for(let dx=0;dx<8;dx++){
const w=dy<2||dy>8?6:7;
if(dx<w){
px(ctx,ix+dx,y-12+dy,1,1,dx<1||dx>w-2||dy<1||dy>9?'#2a2a2a':'#3a3a3a');
}
}
}
px(ctx,ix+3,y-8,2,4,'#4a4a4a');
ix+=12;
}
}
}

function drawChair(ctx,x,y,animTime){
const seatY=y-20;
const seatC='#4a6572';
const seatD=darkenColor(seatC,0.2);
const seatL=lightenColor(seatC,0.15);

// 椅面：增加立体感
for(let dx=0;dx<26;dx++){
for(let dy=0;dy<9;dy++){
let c;
if(dx<2||dx>23)c=seatD;
else if(dy===0)c=seatL;
else if(dy===8)c=darkenColor(seatC,0.3);
else c=seatC;
px(ctx,x+dx,seatY+dy,1,1,c);
}
}

// 椅背：增加弧度感
const backY=seatY-24;
for(let dy=0;dy<24;dy++){
for(let dx=4;dx<22;dx++){
let c;
if(dx<5||dx>20||dy<1||dy>22)c=seatD;
else if(dy===1||dy===2)c=seatL;
else if(dy>18)c=darkenColor(seatC,0.15);
else c=seatC;
// 中间凹槽效果
if(dx>9&&dx<16&&dy>5&&dy<18)c=darkenColor(c,0.05);
px(ctx,x+dx,backY+dy,1,1,c);
}
}

// 椅背顶部圆角
px(ctx,x+4,backY,1,1,'transparent');
px(ctx,x+21,backY,1,1,'transparent');

// 椅腿：增加金属质感
const legC='#2a3540';
const legH='#3a4550';
for(let dx=8;dx<18;dx++){
px(ctx,x+dx,seatY+9,1,1,legH);
px(ctx,x+dx,y,1,1,legC);
}
for(let dy=seatY+9;dy<y;dy++){
px(ctx,x+9,dy,1,1,dy%3===0?legH:legC);
px(ctx,x+10,dy,1,1,dy%3===0?legH:legC);
px(ctx,x+15,dy,1,1,dy%3===0?legH:legC);
px(ctx,x+16,dy,1,1,dy%3===0?legH:legC);
}

// 扶手
for(let dx=2;dx<6;dx++){
px(ctx,x+dx,seatY-5,1,1,seatD);
px(ctx,x+dx,seatY-4,1,1,seatC);
px(ctx,x+20+dx,seatY-5,1,1,seatD);
px(ctx,x+20+dx,seatY-4,1,1,seatC);
}
for(let dy=seatY-18;dy<seatY-4;dy++){
px(ctx,x+3,dy,1,1,dy%4===0?seatL:seatC);
px(ctx,x+24,dy,1,1,dy%4===0?seatL:seatC);
}
}

function drawRightBeds(ctx,startX,startY,floorY,animTime){
const bedW=100,bedH=floorY-startY;
const gap=12;
for(let i=0;i<2;i++){
const bx=startX+i*(bedW+gap);
drawBunkBed(ctx,bx,startY,bedW,bedH,i,animTime);
}
}

function drawBunkBed(ctx,x,y,w,h,idx,animTime){
const wood1='#7a5d48';
const wood2='#6a4d38';
const wood3='#9a7d68';
const wood4='#4a3528';
const wood5='#8a6d58';
const wood6='#a08068';

for(let tier=0;tier<2;tier++){
const ty=y+(1-tier)*Math.floor(h/2);
const isTop=tier===1;

// 床柱 - 更精致
for(let dx=0;dx<6;dx++){
for(let dy=0;dy<Math.floor(h/2);dy++){
let c;
if(dx<2)c=wood3;
else if(dx>3)c=wood2;
else c=wood1;
if(dy<3)c=lightenColor(c,0.12);
if(dy%8<2)c=darkenColor(c,0.05);
px(ctx,x+dx,ty+dy,1,1,c);
px(ctx,x+w-6+dx,ty+dy,1,1,dx<2?wood2:dx>3?wood3:wood1);
}
}
// 床柱装饰线
for(let i=0;i<3;i++){
const ly=ty+10+i*30;
for(let dx=0;dx<6;dx++){
px(ctx,x+dx,ly,1,1,wood4);
px(ctx,x+dx,ly+1,1,1,wood6);
px(ctx,x+w-6+dx,ly,1,1,wood4);
px(ctx,x+w-6+dx,ly+1,1,1,wood6);
}
}

// 床板 - 更有层次
for(let dx=0;dx<w;dx++){
for(let dy=0;dy<8;dy++){
let c;
if(dy===0)c=lightenColor(wood6,0.15);
else if(dy===1)c=wood6;
else if(dy===2)c=wood3;
else if(dy===7)c=wood4;
else c=wood1;
if(dx<2||dx>w-3)c=wood4;
if(dx===2||dx===w-3)c=wood2;
px(ctx,x+dx,ty+dy,1,1,c);
}
}
// 床板木纹
for(let dx=5;dx<w-5;dx+=12){
for(let dy=2;dy<7;dy++){
px(ctx,x+dx,ty+dy,1,1,darkenColor(wood1,0.08));
}
}

// 床头挡板
for(let dy=0;dy<22;dy++){
for(let dx=0;dx<9;dx++){
let c;
if(dx<1||dx>7||dy<1||dy>20)c=wood4;
else if(dx===1||dx===7)c=wood2;
else c=wood5;
if(dy<3)c=lightenColor(c,0.1);
// 挡板纹理
if(dx>2&&dx<6&&dy>4&&dy<18&&(dy===8||dy===14))c=darkenColor(c,0.1);
px(ctx,x+dx,ty+dy,1,1,c);
}
}

// 床垫 - 更精致
const mattY=ty+10;
const mattC=tier===0?'#5a8ac0':'#c07070';
const mattC2=tier===0?'#4a70a0':'#a05858';
const mattC3=tier===0?'#7aa0d8':'#e09090';
const mattC4=tier===0?'#3a5880':'#804848';

for(let dy=0;dy<16;dy++){
for(let dx=0;dx<w-15;dx++){
const p=dy/16;
let c;
if(p<0.25)c=lerpColor(mattC3,mattC,p/0.25);
else if(p<0.75)c=mattC;
else c=lerpColor(mattC,mattC2,(p-0.75)/0.25);
if(dx<1||dx>w-17)c=mattC4;
if(dy>14)c=mattC4;
px(ctx,x+7+dx,mattY+dy,1,1,c);
}
}

// 床单条纹
for(let dx=2;dx<w-18;dx++){
for(let dy=0;dy<3;dy++){
const bright=(dx+dy)%6<3;
px(ctx,x+8+dx,mattY+2+dy,1,1,bright?lightenColor(mattC,0.15):darkenColor(mattC,0.08));
}
}

// 被子（叠好的）
const quiltX=x+w-35,quiltY=mattY+5;
const quiltC=tier===0?'#8b7355':'#a0522d';
for(let dy=0;dy<8;dy++){
for(let dx=0;dx<22;dx++){
let c=quiltC;
if(dx<1||dx>20||dy<1||dy>6)c=darkenColor(quiltC,0.2);
else if(dx<2||dy<2)c=lightenColor(quiltC,0.15);
if(dy===3||dy===4)c=darkenColor(c,0.1);
px(ctx,quiltX+dx,quiltY+dy,1,1,c);
}
}

// 枕头 - 更精致
const pillowX=x+10,pillowY=mattY+2;
const pc=tier===0?'#f5deb3':'#90ee90';
for(let dy=0;dy<10;dy++){
for(let dx=0;dx<22;dx++){
if(dx<1||dx>20||dy<1||dy>8){
px(ctx,pillowX+dx,pillowY+dy,1,1,darkenColor(pc,0.2));
}else if(dx<3||dy<2){
px(ctx,pillowX+dx,pillowY+dy,1,1,lightenColor(pc,0.15));
}else{
// 枕头花纹
let c=pc;
if((dx+dy)%8<2)c=darkenColor(pc,0.1);
px(ctx,pillowX+dx,pillowY+dy,1,1,c);
}
}
}

// 上铺护栏 - 更精致
if(isTop){
for(let dx=8;dx<w-8;dx++){
px(ctx,x+dx,ty+22,1,1,wood4);
px(ctx,x+dx,ty+23,1,1,wood2);
px(ctx,x+dx,ty+24,1,1,wood3);
}

for(let y=wy-i;y<wy+wh+i;y++){
px(ctx,wx-i,y,1,1,i<1?frame3:frame);

g=Math.floor(80+p*250);
b=Math.floor(120+p*100);
}else if(p<0.6){
r=Math.floor(255-(p-0.3)*60);
g=Math.floor(180-(p-0.3)*30);
b=Math.floor(180-(p-0.3)*50);

function drawPixelFloor(ctx,W,floorY,H,animTime){
const baseY=floorY;
for(let y=baseY;y<H;y++){
const rowProg=(y-baseY)/(H-baseY);
for(let x=0;x<W;x++){
const tileX=Math.floor(x/24);
const tileY=Math.floor((y-baseY)/12);
const isEdge=(x%24===0)||((y-baseY)%12===0);
let c;
if(isEdge){
c=rowProg<0.3?'#5a3a20':'#4a2e18';
}else{
const n=((tileX*17+tileY*23+x%3+y%2)%10)/10;
if(rowProg<0.3){
c=n<0.3?'#7a5030':n<0.7?'#6b4423':'#603d20';
}else if(rowProg<0.6){
c=n<0.3?'#6a4020':n<0.7?'#5a3518':'#502e15';
}else{
c=n<0.3?'#553515':n<0.7?'#482a12':'#3d2210';
}
}
px(ctx,x,y,1,1,c);
}
}
const highlightY=baseY;
for(let x=0;x<W;x++){
const n=Math.sin(x*0.1+animTime*0.001)*0.5+0.5;
px(ctx,x,highlightY,1,1,'rgba(255,200,150,'+(0.15+n*0.1)+')');
if(x%8===0)px(ctx,x,highlightY+1,1,1,'rgba(255,200,150,0.08)');
}
}

function drawPixelCurtain(ctx,x,y,w,h,animTime,side){
const sway=Math.sin(animTime*0.0015+side*2)*2;
const c1=side===0?'#7a3d5e':'#6a3552';
const c2=side===0?'#9a5d7e':'#8a4d6e';
const c3=side===0?'#5a2d42':'#4a2536';
for(let i=0;i<3;i++){
const cx=Math.floor(x+i*(w/3)+sway*(i%2?0.5:-0.5));
for(let yy=y;yy<y+h;yy++){
for(let xx=cx;xx<cx+w/3-1;xx++){
const fold=(xx-cx)%4;
if(fold===0)px(ctx,xx,yy,1,1,c2);
else if(fold===3)px(ctx,xx,yy,1,1,c3);
else px(ctx,xx,yy,1,1,c1);
}
}
}
for(let xx=x-1;xx<x+w+1;xx++){
for(let yy=y;yy<y+4;yy++){
px(ctx,xx,yy,1,1,c3);
}
}
}

function lerpColor(c1,c2,t){
const r1=parseInt(c1.slice(1,3),16),g1=parseInt(c1.slice(3,5),16),b1=parseInt(c1.slice(5,7),16);
const r2=parseInt(c2.slice(1,3),16),g2=parseInt(c2.slice(3,5),16),b2=parseInt(c2.slice(5,7),16);
const r=Math.round(r1+(r2-r1)*t),g=Math.round(g1+(g2-g1)*t),b=Math.round(b1+(b2-b1)*t);
return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

function drawPixelCharBlock(ctx,x,y,w,h,ch,cols,animTime,seed){
const [c1,c2,c3,c4]=cols;

for(let dy=0;dy<h;dy++){
for(let dx=0;dx<w;dx++){
const xx=x+dx,yy=y+dy;
if(dx===0||dx===w-1||dy===0||dy===h-1){
px(ctx,xx,yy,1,1,c4);
}else if(dx===1||dx===w-2||dy===1||dy===h-2){
px(ctx,xx,yy,1,1,c3);
}else{
const p=dy/h;
let c;
if(p<0.35)c=lerpColor(c2,c1,p/0.35);
else if(p<0.7)c=c1;
else c=lerpColor(c1,c3,(p-0.7)/0.3);
px(ctx,xx,yy,1,1,c);
}
}
}

for(let i=0;i<3;i++){
px(ctx,x+2+i,y+2+i,1,1,c2);
px(ctx,x+w-3-i,y+2+i,1,1,c4);
px(ctx,x+2+i,y+h-3-i,1,1,c4);
}

ctx.fillStyle='white';
ctx.font='bold 20px monospace';
ctx.textAlign='center';
ctx.shadowColor=c4;
ctx.shadowBlur=3;
ctx.fillText(ch,(x+w/2)*PX,(y+h/2+7)*PX);
ctx.shadowBlur=0;

}

function drawStoryOverlay(ctx){
	if(introPhase!==1)return;
	const alpha=Math.min(1,introTimer/500);

	let darkness=0.7;
	if(storyTextIdx>=3&&storyTextIdx<=4){
		darkness=0.7+(storyTextIdx-2)*0.15;
	}
	if(storyTextIdx===5){
		darkness=1.0;
	}
	if(storyTextIdx>=6){

		darkness=1.0-0.75*lightUp;
	}

	const overlayGrad=ctx.createLinearGradient(0,0,0,CANVAS_H);
	overlayGrad.addColorStop(0,'rgba(5,5,15,'+darkness+')');
	overlayGrad.addColorStop(0.5,'rgba(10,10,30,'+(darkness-0.05)+')');

	ctx.fillRect(0,0,CANVAS_W,CANVAS_H);

	if(storyTextIdx>=6){

t.vx=Math.cos(angle)*speed;
t.vy=Math.sin(angle)*speed-1; // 稍微往上飘
}
}

this.laughing=false;this.laughTimer=0;this.squash=1;this.stretch=1;this.throwCooldown=0;
this.skillEnergy=0;this.maxSkillEnergy=100;this.skillActive=false;this.skillTimer=0;
this.combo=0;this.comboTimer=0;this.rageMode=false;this.rageTimer=0;
this.stunned=0;this.speedBoost=0;this.invisible=false;this.invisTimer=0;
this.climbing=false;this.climbTimer=0;this.climbDirection=0;
this.capturing=false;this.captureTimer=0;this.currentCaptureBed=null;
this.buffTimer=0;this.currentBuff=null;
this.aiSkillCooldown=Math.random()*3000;this.aiJumpCooldown=0;
this.team=-1; // -1 = no team, 0+ = team id
this.jumpCount=0;this.maxJumps=2; // 二段跳
this.aiPattern=0;this.aiPatternTimer=0;this.aiDashCooldown=0;this.aiFeintTimer=0;
this.fakingSurrender=false;this.surrenderTimer=0;this.surrenderCooldown=0; // 假装投降和冷却
}

update(dt){
if(this.laughing){this.laughTimer+=dt;return}
this.animTime+=dt;
if(this.invuln>0)this.invuln-=dt;if(this.hurtTimer>0)this.hurtTimer-=dt;
if(this.attackCooldown>0)this.attackCooldown-=dt;if(this.throwCooldown>0)this.throwCooldown-=dt;
if(this.surrenderCooldown>0)this.surrenderCooldown-=dt;
if(this.stunned>0)this.stunned-=dt;if(this.invisTimer>0){this.invisTimer-=dt;if(this.invisTimer<=0)this.invisible=false}
if(this.speedBoost>0)this.speedBoost-=dt;if(this.rageTimer>0){this.rageTimer-=dt;if(this.rageTimer<=0)this.rageMode=false}
if(this.comboTimer>0){this.comboTimer-=dt;if(this.comboTimer<=0)this.combo=0}
if(this.skillActive){this.skillTimer-=dt;if(this.skillTimer<=0)this.skillActive=false}
if(this.buffTimer>0){this.buffTimer-=dt;if(this.buffTimer<=0)this.currentBuff=null}
if(this.capturing){this.captureTimer+=dt;if(this.captureTimer>=1500){this.captureComplete();this.capturing=false;this.captureTimer=0}}
if(this.fakingSurrender){this.surrenderTimer-=dt;if(this.surrenderTimer<=0){this.fakingSurrender=false;this.surrenderTimer=0;spawnFloatText('不装了!',this.x,this.y-60,'#FF9800')}}

if(inspector&&inspector.active&&!this.invisible&&this.isAI){
const dx=this.x-inspector.x;
if(Math.abs(dx)<350){const escapeDir=dx>0?1:-1;this.vx=escapeDir*MOVE_SPEED*1.5;if(Math.random()<0.05&&this.onGround){this.vy=-JUMP_POWER;this.onGround=false}return;}
}

this.checkLadder();
if(this.climbing){this.climbTimer+=dt;this.y+=this.climbDirection*3;this.vx=0;this.vy=0;
if(this.climbDirection<0){
if(this.y<=200-this.height){this.onBed=true;this.climbing=false;this.y=200-this.height;this.currentBed='top'}
else if(this.y<=400-this.height&&this.y>393-this.height&&this._wantStopAtBottom){this.onBed=true;this.climbing=false;this.y=400-this.height;this.currentBed='bottom'}
}
if(this.climbDirection>0){
if(this.y>=400-this.height&&this.y<408-this.height&&this._wantStopAtBottom){this.onBed=true;this.climbing=false;this.y=400-this.height;this.currentBed='bottom'}
else if(this.y>=GROUND_Y-this.height){this.onGround=true;this.climbing=false;this.y=GROUND_Y-this.height;this._wantsLeaveBed=false;}
}
return;}

if(this.isAI)this.updateAI(dt);
this.vy+=GRAVITY;this.x+=this.vx;this.y+=this.vy;
if(this.onBed){
const bedY=this.currentBed==='top'?200:400;
const playerBedY=bedY-this.height;
if(this.y<playerBedY-2){this.y=playerBedY;this.vy=0}
if(this.y>playerBedY+2){this.y=playerBedY;this.vy=0;this.onBed=false}
}
// 平台碰撞检测（桌子、椅子、窗户、床等）
this.onPlatform=false;
const allPlatforms=[...PLATFORMS,...BED_PLATFORMS];
for(let pf of allPlatforms){
if(this.vy>=0&&this.x>pf.x&&this.x<pf.x+pf.w){
const platformTop=pf.y;
const playerBottom=this.y+this.height;
if(playerBottom>=platformTop&&playerBottom<=platformTop+this.vy+5){
this.y=platformTop-this.height;
this.vy=0;
this.onGround=true;
this.onPlatform=true;
this.jumpCount=0;
spawnLandEffect(this.x,this.y+this.height);
break;
}
}
}
if(this.y>=GROUND_Y-this.height){this.y=GROUND_Y-this.height;this.vy=0;if(!this.onGround){this.onGround=true;this.squash=0.7;this.stretch=1.3;this.jumpCount=0;spawnLandEffect(this.x,this.y+this.height)}}
else if(!this.onPlatform)this.onGround=false;
this.x=Math.max(60,Math.min(CANVAS_W-60,this.x));
if(this.onGround)this.vx*=0.8;
this.squash+=(1-this.squash)*0.15;this.stretch+=(1-this.stretch)*0.15;
this.walking=Math.abs(this.vx)>1&&this.onGround;
if(this.attacking){this.attackTimer+=dt;if(this.attackTimer>300){this.attacking=false;this.attackTimer=0}}
if(this.currentBuff==='regen'&&this.buffTimer>0&&Math.floor(this.animTime/500)%1===0){if(this.happiness<this.maxHappiness)this.happiness=Math.min(this.maxHappiness,this.happiness+1.5)}
}

checkLadder(){for(let l of LADDERS){if(Math.abs(this.x-l.x)<30&&this.y>l.y-20&&this.y<l.y+l.h+20){
if(!this.isAI){
if((keys['w']||keys['arrowup']||joystickDY<-0.5)&&this.onGround){
this.climbing=true;this.climbDirection=-1;this.climbTimer=0;this._wantStopAtBottom=false;
}
else if(this.onBed){
if((keys['s']||keys['arrowdown']||joystickDY>0.5)){
this.climbing=true;this.climbDirection=1;this.climbTimer=0;this.onBed=false;this._wantStopAtBottom=false;
}
if((keys['w']||keys['arrowup']||joystickDY<-0.5)&&this.currentBed==='bottom'){
this.climbing=true;this.climbDirection=-1;this.climbTimer=0;this.onBed=false;this._wantStopAtBottom=false;
}
}
else if(this.climbing&&(keys[' ']||keys['Space'])){
if(this.y>200&&this.y<400){this._wantStopAtBottom=true}
}
}
else{
// AI爬梯子策略：更智能、更主动
// 0. 要下床时：接近梯子就开始爬
if(this.onBed&&this._wantsLeaveBed){
this.climbing=true;this.climbDirection=1;this.climbTimer=0;this.onBed=false;this._wantStopAtBottom=false;
}
// 1. 床上的AI：敌人在地面时爬下去
else if(this.onBed&&this.currentBed==='top'&&this.aiTarget&&this.aiTarget.y>this.y+150&&Math.random()<0.025){
this.climbing=true;this.climbDirection=1;this.climbTimer=0;this.onBed=false;this._wantStopAtBottom=false;
}
else if(this.onBed&&this.currentBed==='bottom'&&this.aiTarget&&this.aiTarget.y>this.y+150&&Math.random()<0.03){
this.climbing=true;this.climbDirection=1;this.climbTimer=0;this.onBed=false;this._wantStopAtBottom=false;
}
// 2. 血量低时爬上去躲
else if(this.onGround&&this.happiness<this.maxHappiness*0.35&&Math.random()<0.018){
this.climbing=true;this.climbDirection=-1;this.climbTimer=0;this._wantStopAtBottom=false;
}
// 3. 下铺的AI：敌人在上铺时爬上去
else if(this.onBed&&this.currentBed==='bottom'&&this.aiTarget&&this.aiTarget.y<this.y-100&&Math.random()<0.03){
this.climbing=true;this.climbDirection=-1;this.climbTimer=0;this.onBed=false;this._wantStopAtBottom=false;
}
// 4. 地面AI：敌人在床上时主动爬梯子攻击
else if(this.onGround&&this.aiTarget&&this.aiTarget.y<this.y-100&&Math.random()<0.03){
this.climbing=true;this.climbDirection=-1;this.climbTimer=0;this._wantStopAtBottom=false;
}
// 5. 床上的AI：敌人靠近时爬下来
else if(this.onBed&&this.aiTarget&&Math.abs(this.aiTarget.x-this.x)<200&&this.aiTarget.y>this.y+50&&Math.random()<0.02){
this.climbing=true;this.climbDirection=1;this.climbTimer=0;this.onBed=false;this._wantStopAtBottom=false;
}
}
}}}

updateAI(dt){
this.aiThinkTimer+=dt;if(this.aiThinkTimer<70)return;this.aiThinkTimer=0;

// 坐着时：有敌人靠近就站起来
if(this.sitting){
let enemyNear=false;
for(let p of players){
if(p===this||p.laughing)continue;
if(this.team>=0&&p.team===this.team)continue;
if(Math.abs(p.x-this.x)<300){enemyNear=true;break;}
}
if(enemyNear){this.sitting=false;}
else{this.facing=Math.random()<0.5?1:-1;return;}
}

// === 床上AI主动出击逻辑：不蹲床 ===
if(this.onBed){
this._bedStayTimer=(this._bedStayTimer||0)+dt;
// buff过期后必须下床
const buffExpired=this.buffTimer<=0||!this.currentBuff;
// 床上停留超过4秒就主动出击（不论buff是否过期）
const stayedTooLong=this._bedStayTimer>4000;
// 有敌人在地面且距离不远，主动下床攻击
let groundEnemyNear=null;
for(let p of players){
if(p===this||p.laughing)continue;
if(this.team>=0&&p.team===this.team)continue;
if(p.y>this.y+80&&Math.abs(p.x-this.x)<500){groundEnemyNear=p;break;}
}
// 满足任一条件就标记要下床（实际下床在checkLadder+updateAI中处理）
if(buffExpired||stayedTooLong||(groundEnemyNear&&this.happiness>this.maxHappiness*0.5)){
this._wantsLeaveBed=true;
this._bedStayTimer=0;
if(groundEnemyNear)spawnFloatText('出击!',this.x,this.y-60,'#FF9800');
}
}

// === AI剧情：随机时间加入玩家或背刺 ===
this._aiStoryTimer=(this._aiStoryTimer||0)+dt;
// 30秒后，AI可能会有剧情行为
if(this._aiStoryTimer>30000&&this.team<0&&Math.random()<0.001){
// 有概率加入玩家队伍
const player=players[0];
if(player&&player.team<0&&Math.abs(player.x-this.x)<300&&Math.random()<0.5){
this.team=0;player.team=0;
spawnFloatText(this.skin.name+' 加入了你的队伍!',CANVAS_W/2,150,'#4CAF50');
updateTeamIndicator();
showEventPause('盟友加入',this.skin.name+' 加入了你的队伍！','#4CAF50');
this._aiStoryTimer=0;
}
}
// 如果在队伍中，有概率背刺
if(this.team>=0&&this._aiStoryTimer>20000&&Math.random()<0.0008){
const wasTeam=this.team;
this.team=-1;
// 解除队友
for(let p of players){if(p.team===wasTeam&&p!==this)p.team=-1;}
spawnFloatText(this.skin.name+' 背刺了!',CANVAS_W/2,150,'#D32F2F');
showEventPause('背刺!',this.skin.name+' 叛变了！','#D32F2F');
this._aiStoryTimer=0;
updateTeamIndicator();
}

// === 躲避宿管：任何时候都主动避开 ===
if(inspector&&inspector.active){
const id=Math.abs(this.x-inspector.x);
if(id<250){
const escDir=this.x>inspector.x?1:-1;
this.vx=escDir*MOVE_SPEED*2.0;
this.facing=escDir;
this.aiTarget=null;
if(this.onGround&&this.jumpCount<this.maxJumps){this.vy=-JUMP_POWER;this.onGround=false;this.jumpCount++;}
else if(this.jumpCount<this.maxJumps){this.vy=-JUMP_POWER*0.7;this.jumpCount++;}
return;
}
}

// === 熄灯时：蹲下不动（如果宿管已经走远）===
const isBlackout=currentEvent&&currentEvent.id==='blackout';
if(isBlackout){
this.vx*=0.5;
if(Math.abs(this.vx)<0.3)this.vx=0;
return;
}

// === 选择目标：优先追杀残血敌人，否则选最近的 ===
let nearest=null,minDist=Infinity;
let weakest=null,lowestHP=Infinity,weakestDist=Infinity;
for(let p of players){if(p===this||p.laughing)continue;
if(this.team>=0&&p.team===this.team)continue;
const d=Math.abs(p.x-this.x);
if(d<minDist){minDist=d;nearest=p}
// 残血敌人（<35%）且距离不远（<400）优先追杀
if(p.happiness<this.maxHappiness*0.35&&d<400&&p.happiness<lowestHP){lowestHP=p.happiness;weakest=p;weakestDist=d}
}
// AI血量健康时主动追杀残血；血量低时保守选最近
if(weakest&&this.happiness>this.maxHappiness*0.4){nearest=weakest;minDist=weakestDist}
this.aiTarget=nearest;
let targetBed=null;
for(let b of BEDS){if(b.owner===null){const d=Math.abs(b.x+100-this.x);if(d<400&&(!targetBed||d<Math.abs(targetBed.x+100-this.x)))targetBed=b}}

// 寻找更好的武器（开局4秒后才去找）
let targetWeapon=null;
if(this.weapon==='mat'&&this._spawnTimer>4000){
for(let w of weapons){if(w.type==='pole'&&!w.pickedUp){const d=Math.abs(w.x-this.x);if(d<350&&(!targetWeapon||d<Math.abs(targetWeapon.x-this.x)))targetWeapon=w}}
}

const dist=minDist;const baseDir=nearest?nearest.x>this.x?1:-1:0;

// 如果目标在床上，AI需要先移动到最近的梯子位置
let dir=baseDir;
if(nearest&&nearest.y<this.y-100&&this.onGround){
// 找到最近的梯子
let nearestLadder=null,minLadderDist=Infinity;
for(let l of LADDERS){
const d=Math.abs(l.x-this.x);
if(d<minLadderDist){minLadderDist=d;nearestLadder=l;}
}
if(nearestLadder&&minLadderDist>30){
dir=nearestLadder.x>this.x?1:-1;
}
}

this.facing=dir||1;
const spd=MOVE_SPEED*(this.rageMode?1.3:1)*(this.speedBoost>0?1.5:1)*(this.currentBuff==='speed'?1.3:1);

if(this.aiJumpCooldown>0)this.aiJumpCooldown-=dt;
if(this.aiDashCooldown>0)this.aiDashCooldown-=dt;
if(this.aiFeintTimer>0)this.aiFeintTimer-=dt;

// 道具拾取：开局4秒内不拾取更好的武器，给玩家机会
this._spawnTimer=(this._spawnTimer||0)+dt;
if(!this.hasWeapon){for(let w of weapons){if(Math.abs(w.x-this.x)<60){this.weapon=w.type;this.hasWeapon=true;w.pickedUp=true;break}}}
// 已经有武器但可以升级到晾衣杆（开局4秒后才能拾取）
else if(this.weapon==='mat'&&this._spawnTimer>4000){for(let w of weapons){if(w.type==='pole'&&Math.abs(w.x-this.x)<60){this.weapon='pole';w.pickedUp=true;break}}}

// === 躲避投射物 - 反应更快 ===
for(let proj of projectiles){if(proj.owner===this)continue;const pdx=proj.x-this.x,pdy=proj.y-this.y;const pdist=Math.sqrt(pdx*pdx+pdy*pdy);
if(pdist<180&&Math.abs(pdy)<80){
if(this.onGround&&this.jumpCount<this.maxJumps){
// 二段跳闪避
this.vy=-JUMP_POWER*0.9;this.onGround=false;this.jumpCount=1;this.aiJumpCooldown=600;
// 闪避后横向拉开
this.vx=proj.vx>0?-spd*1.3:spd*1.3;this.facing=proj.vx>0?-1:1;
break;
}else if(this.jumpCount<this.maxJumps){
// 空中二段跳闪避
this.vy=-JUMP_POWER*0.7;this.jumpCount++;
this.vx=proj.vx>0?-spd:spd;
break;
}
}
}

// === 躲避其他AI的攻击（预判闪避）===
if(nearest&&nearest.attacking&&dist<150&&this.onGround&&this.aiDashCooldown<=0){
// 预判敌人攻击，后撤闪避
this.vx=-dir*spd*1.2;this.facing*=-1;
if(Math.random()<0.5){this.vy=-JUMP_POWER*0.8;this.onGround=false;this.jumpCount=1;}
this.aiDashCooldown=800;
}

// === 行为模式切换 ===
this.aiPatternTimer+=dt;
if(this.aiPatternTimer>2000+Math.random()*2000){
this.aiPattern=Math.floor(Math.random()*4);this.aiPatternTimer=0;
}

// === 床上AI要下床：走向最近梯子 ===
if(this.onBed&&this._wantsLeaveBed){
let nearestLadder=null,minLadderDist=Infinity;
for(let l of LADDERS){const d=Math.abs(l.x-this.x);if(d<minLadderDist){minLadderDist=d;nearestLadder=l;}}
if(nearestLadder){
this.facing=nearestLadder.x>this.x?1:-1;
this.vx=this.facing*spd;
// checkLadder在下一帧检测到接近梯子时会自动开始爬
}
}
else if(targetWeapon&&(!nearest||dist>300)){
const weaponDir=targetWeapon.x>this.x?1:-1;this.vx=weaponDir*spd;
}else if(targetBed&&(!nearest||dist>250)&&this.happiness<this.maxHappiness*0.7){
const bedDir=targetBed.x+100>this.x?1:-1;this.vx=bedDir*spd*0.9;
if(Math.abs(targetBed.x+100-this.x)<60&&this.onGround&&!this.capturing){this.vx=0;this.captureBed(targetBed)}
}else if(nearest){
if(dist>350){
// === 远距离：快速接近 + 偶尔跳跃 ===
// 预判目标位置（提前量）
const predictedX=nearest.x+nearest.vx*10;
const predDir=predictedX>this.x?1:-1;
this.vx=predDir*spd;
if(Math.random()<0.03&&this.onGround){this.vy=-JUMP_POWER;this.onGround=false;this.jumpCount=1;}
// 偶尔冲刺
if(this.aiDashCooldown<=0&&Math.random()<0.02){this.vx=predDir*spd*1.6;this.aiDashCooldown=3000;}
}else if(dist>150){
// === 中距离：蛇形走位 + 骚操作 ===
this.aiSinTimer=(this.aiSinTimer||0)+dt;
const sinOffset=Math.sin(this.aiSinTimer*0.012)*35;
this.vx=dir*spd*0.75+sinOffset*0.2;
// 随机跳跃骚扰
if(Math.random()<0.04&&this.onGround){
this.vy=-JUMP_POWER;this.onGround=false;this.jumpCount=1;
// 跳起来投掷
if(Math.random()<0.3&&this.hasWeapon&&this.throwCooldown<=0){
setTimeout(()=>{if(!this.laughing&&this.hasWeapon)this.throwWeapon()},200);
}
}
// 偶尔二段跳变向
if(!this.onGround&&this.jumpCount<this.maxJumps&&Math.random()<0.03){
this.vy=-JUMP_POWER*0.7;this.jumpCount++;
this.vx*=-0.8;this.facing*=-1;
}
}else if(dist>80){
// === 近距离：灵活博弈 ===
if(this.aiPattern===0){
// 模式0：假动作+攻击
this.vx=dir*spd*0.5;
if(this.aiFeintTimer<=0&&Math.random()<0.04){
// 假动作：突然反向
this.vx=-dir*spd*1.2;this.facing*=-1;this.aiFeintTimer=800+Math.random()*600;
if(this.onGround){this.vy=-JUMP_POWER*0.8;this.onGround=false;this.jumpCount=1;}
}
if(this.attackCooldown<=0&&Math.abs(this.vx)<spd*0.6&&Math.random()<0.06)this.attack();
}else if(this.aiPattern===1){
// 模式1：跳跃劈砍
if(this.onGround&&this.aiJumpCooldown<=0&&Math.random()<0.06){
this.vy=-JUMP_POWER*1.05;this.onGround=false;this.jumpCount=1;this.aiJumpCooldown=1500;
this.vx=dir*spd*0.6;
// 落地时攻击
setTimeout(()=>{if(!this.laughing&&this.attackCooldown<=0)this.attack()},350);
}
this.vx=dir*spd*0.4;
}else if(this.aiPattern===2){
// 模式2：侧步闪避+反击
this.aiSinTimer=(this.aiSinTimer||0)+dt;
this.vx=Math.sin(this.aiSinTimer*0.02)*spd*0.9;
if(this.attackCooldown<=0&&dist<120&&Math.random()<0.05)this.attack();
}else{
// 模式3：投掷+后撤
if(this.hasWeapon&&this.throwCooldown<=0&&Math.random()<0.04){
this.throwWeapon();this.vx=-dir*spd*0.8;this.facing*=-1;
}else{this.vx=dir*spd*0.3;}
}
}else{
// === 极近距离：激烈交锋 ===
this.vx*=0.4;
if(this.attackCooldown<=0){
const r=Math.random();
if(r<0.6)this.attack();
else if(r<0.75&&this.hasWeapon&&this.throwCooldown<=0)this.throwWeapon();
else if(r<0.85&&this.onGround){
// 后跳闪避
this.vx=-dir*spd*1.1;this.facing*=-1;
this.vy=-JUMP_POWER*0.8;this.onGround=false;this.jumpCount=1;
}else if(r<0.95&&this.onGround){
// 二段跳反击
this.vy=-JUMP_POWER;this.onGround=false;this.jumpCount=1;
setTimeout(()=>{if(!this.laughing&&this.attackCooldown<=0)this.attack()},300);
}
}
}
}

// 技能使用
this.aiSkillCooldown-=dt;
if(this.skillEnergy>=60&&this.aiSkillCooldown<=0){
if(dist<250||this.skinIndex===5){this.useSkill();this.aiSkillCooldown=4000+Math.random()*4000;}
}

// === 假装投降策略 ===
if(this.happiness<this.maxHappiness*0.18&&nearest&&dist<200&&!this.fakingSurrender&&this.surrenderCooldown<=0&&Math.random()<0.008){
// 血量极低时，假装投降骗敌人靠近
this.toggleSurrender();
}

// === 攻击投降的敌人 ===

// ========== 宿管BOSS ==========
class Inspector{
constructor(){

this.width=50;this.height=70;
this.vx=3;this.active=false;
this.enterTimer=0;this.leaveTimer=0;
this.rageMode=false;this.rageTimer=0;
this.direction=1;this.speed=3.5;
// 手电筒巡查
this.flashAngle=0;this.flashDir=1;
this.flashRange=220;this.flashWidth=0.35;
this.spotted=null;this.spotTimer=0;
this.throwFlashlight=false;this.throwTarget=null;this.throwTimer=0;
this._lightOn=false;
}

// === 核心判断：角色是否真的在动（提高阈值到3.0，避免微小抖动）===
isTrulyMoving(p){
// 1. 移动速度必须大于3.0（肉眼明显能看到移动）
const movingFast=Math.abs(p.vx)>3.0;
// 2. 在空中且速度大于2.0（跳跃中）
const jumping=!p.onGround&&Math.abs(p.vx)>2.0;
// 3. 正在攻击或爬梯子
const acting=p.attacking||p.climbing;
return movingFast||jumping||acting;
}

update(dt){
if(!this.active){this.enterTimer+=dt;return}
this.x+=this.vx*this.direction;

// 方向切换
if(this.x<-50){this.direction=1;this.speed=3.5}
if(this.x>CANVAS_W+50){
this.leaveTimer+=dt;
if(this.leaveTimer>=3000){
this.active=false;this.enterTimer=0;this.leaveTimer=0;
}
}

const isBlackout=currentEvent&&currentEvent.id==='blackout';

// === 黑灯逻辑：宿管走完全程才亮灯 ===
if(isBlackout&&!this._lightOn&&this.x>=CANVAS_W-50){
this._lightOn=true;
currentEvent=null;eventTimer=0;
spawnFloatText('灯亮了！',CANVAS_W/2,150,'#FFD54F');
}
if(!isBlackout)this._lightOn=false;

// === 360度巡查 ===
this.flashAngle+=this.flashDir*0.04;
if(this.flashAngle>Math.PI)this.flashDir=-1;
if(this.flashAngle<-Math.PI)this.flashDir=1;

// === 碰到人直接打死 ===
for(let p of players){
if(p.laughing)continue;
const dx=p.x-this.x;
const dy=p.y-this.y;
const dist=Math.sqrt(dx*dx+dy*dy);
if(dist<60){
p.happiness=0;
p.laughing=true;
p.laughTimer=0;
p.vy=-25;
p.vx=(p.x>this.x?1:-1)*15;
cameraShake=0.6;shakeIntensity=25;
spawnHitEffect(p.x,p.y-30,999);

this.rageMode=true;
this.rageTimer=2500;
this.speed=7;
}
}

if(this.rageTimer>0){
this.rageTimer-=dt;
if(this.rageTimer<=0){
this.rageMode=false;
this.speed=3.5;
}
}
}

// 身体

ctx.fillStyle='#ECEFF1';ctx.fillRect(-18,-48,36,46);
ctx.fillStyle='#FFAB91';ctx.fillRect(-15,-25,30,20);
ctx.fillStyle='#37474F';ctx.fillRect(-10,-10,20,35);ctx.fillRect(-15,-5,8,30);ctx.fillRect(7,-5,8,30);
ctx.fillStyle='#5D4037';ctx.fillRect(-12,30,24,8);
// 头

ctx.fillStyle='#3E2723';ctx.fillRect(-22,-72,44,12);
ctx.fillStyle='#333';ctx.fillRect(-10,-68,20,2);
ctx.beginPath();ctx.arc(-8,-60,3,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.arc(8,-60,3,0,Math.PI*2);ctx.fill();
ctx.strokeStyle='#8D6E63';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-8,-50);ctx.lineTo(8,-50);ctx.stroke();

// 手电筒（手里拿着）
ctx.save();ctx.translate(25*this.direction,-55);ctx.rotate(0.3*this.direction);
ctx.fillStyle=this.rageMode?'#FF5252':'#FFD54F';
ctx.fillRect(0,-5,30,10);
ctx.fillStyle='#FFF9C4';ctx.beginPath();ctx.arc(30,0,8,0,Math.PI*2);ctx.fill();ctx.restore();

// 手电筒光束（熄灯时）

if(isBlackout&&!this.throwFlashlight){
const beamAngle=this.flashAngle*this.direction;
ctx.save();
ctx.translate(25*this.direction,-30);
ctx.rotate(beamAngle);
// 光锥

grad.addColorStop(0,'rgba(255,245,180,0.35)');
grad.addColorStop(0.5,'rgba(255,235,150,0.2)');
grad.addColorStop(1,'rgba(255,220,120,0)');
ctx.fillStyle=grad;
ctx.beginPath();
ctx.moveTo(0,0);
const w=Math.tan(this.flashWidth)*this.flashRange;
ctx.lineTo(this.flashRange,-w);
ctx.lineTo(this.flashRange,w);
ctx.closePath();
ctx.fill();
// 光束中心线
ctx.strokeStyle='rgba(255,255,200,0.15)';ctx.lineWidth=2;
ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(this.flashRange,0);ctx.stroke();
// 如果照到目标，显示锁定标记
if(this.spotted){
ctx.fillStyle='rgba(255,82,82,'+(0.5+Math.sin(this.spotTimer*0.02)*0.4)+')';
ctx.font='bold 20px sans-serif';ctx.textAlign='center';
const tx=this.spotted.x-this.x-25*this.direction;
const ty=this.spotted.y+this.spotted.height/2-this.y+30;
ctx.translate(tx,ty);
ctx.fillText('!',0,-5);
}
ctx.restore();
}

// 丢手电筒动画
if(this.throwFlashlight){
const t=this.throwTimer/300;
const tx=this.throwTarget?(this.throwTarget.x-this.x):0;
const ty=this.throwTarget?(this.throwTarget.y-this.y):-30;
ctx.save();
ctx.translate(tx*t,ty*t-100*Math.sin(t*Math.PI));
ctx.rotate(t*Math.PI*4);
ctx.fillStyle='#FF5252';ctx.fillRect(-15,-5,30,10);
ctx.fillStyle='#FFF9C4';ctx.beginPath();ctx.arc(15,0,8,0,Math.PI*2);ctx.fill();

}

if(this.rageMode){ctx.fillStyle='rgba(255,0,0,0.25)';ctx.beginPath();ctx.arc(0,-30,55,0,Math.PI*2);ctx.fill()}
ctx.restore();}
}

function spawnHitEffect(x,y,damage){const count=Math.min(25,10+damage);for(let i=0;i<count;i++){const angle=Math.random()*Math.PI*2;const speed=4+Math.random()*6;effects.push({type:'star',x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-2,life:600,maxLife:600,size:7+Math.random()*9,rotation:Math.random()*Math.PI,color:['#FFD700','#FFA500','#FF6347','#FF4500','#FF1744'][Math.floor(Math.random()*5)]})}for(let i=0;i<10;i++){const angle=Math.random()*Math.PI*2;const speed=5+Math.random()*7;effects.push({type:'spark',x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-1,life:400,maxLife:400,size:3+Math.random()*5,color:'#FFF'})}for(let i=0;i<4;i++)effects.push({type:'shockwave',x,y,radius:8+i*8,maxRadius:50+i*18,life:350,maxLife:350,delay:i*40});if(damage>18)for(let i=0;i<8;i++){const angle=(i/8)*Math.PI*2;effects.push({type:'flash',x,y,vx:Math.cos(angle)*4,vy:Math.sin(angle)*4,life:250,maxLife:250,size:10})}}
function spawnThrowEffect(x,y){for(let i=0;i<8;i++)effects.push({type:'spark',x,y,vx:(Math.random()-0.5)*5,vy:-Math.random()*4,life:300,maxLife:300,size:3,color:'#AAA'})}
function spawnLandEffect(x,y){for(let i=0;i<12;i++)effects.push({type:'dust',x,y,vx:(Math.random()-0.5)*8,vy:-Math.random()*4,life:500,maxLife:500,size:6+Math.random()*6,color:'rgba(200,200,200,0.6)'})}
function spawnDoubleJumpEffect(x,y){for(let i=0;i<12;i++){const a=(i/12)*Math.PI*2;effects.push({type:'spark',x,y,vx:Math.cos(a)*5,vy:Math.sin(a)*5-1,life:400,maxLife:400,size:4+Math.random()*4,color:['#4FC3F7','#81D4FA','#B3E5FC'][i%3]})}effects.push({type:'shockwave',x,y,radius:5,maxRadius:35,life:300,maxLife:300,delay:0})}
function spawnTickleNumber(x,y,amount){tickleNumbers.push({x,y,vy:-4,life:900,maxLife:900,text:'😂'+Math.floor(amount),offset:(Math.random()-0.5)*30})}
function spawnHealEffect(x,y){for(let i=0;i<15;i++){const a=Math.random()*Math.PI*2;effects.push({type:'heal',x,y,vx:Math.cos(a)*4,vy:Math.sin(a)*4-3,life:700,maxLife:700,size:6+Math.random()*6,color:'#66BB6A'})}}
function spawnStunEffect(x,y){for(let i=0;i<10;i++){const a=(i/10)*Math.PI*2;effects.push({type:'star',x:x+Math.cos(a)*22,y:y+Math.sin(a)*22,vx:Math.cos(a)*2.5,vy:Math.sin(a)*2.5-1,life:1200,maxLife:1200,size:6,rotation:0,color:'#FFEB3B'})}}

function spawnSkillText(x,y,text){tickleNumbers.push({x,y,vy:-2,life:1500,maxLife:1500,text,offset:0,isSkill:true})}

function updateEffects(dt){
for(let i=effects.length-1;i>=0;i--){const e=effects[i];e.life-=dt;if(e.life<=0){effects.splice(i,1);continue}
if(e.type==='star'||e.type==='spark'||e.type==='flash'||e.type==='flame'){e.x+=e.vx;e.y+=e.vy;e.vy+=0.25;e.vx*=0.94;if(e.rotation!==undefined)e.rotation+=0.18}
if(e.type==='shockwave'){if(e.delay>0){e.delay-=dt;continue}e.radius+=(e.maxRadius-e.radius)*0.18}
if(e.type==='dust'||e.type==='smoke'){e.x+=e.vx;e.y+=e.vy;e.vy+=0.12;e.vx*=0.9}
if(e.type==='heal'){e.x+=e.vx;e.y+=e.vy;e.vy+=0.12;e.vx*=0.9}
if(e.type==='soundwave'){if(e.delay>0){e.delay-=dt;continue}e.radius+=(e.maxRadius-e.radius)*0.22}
if(e.type==='tornado'){e.angle+=0.12;e.radius+=(e.maxRadius-e.radius)*0.12}
if(e.type==='capture'){e.x+=e.vx;e.y+=e.vy;e.vy+=0.12;e.vx*=0.9}
}
for(let i=tickleNumbers.length-1;i>=0;i--){const d=tickleNumbers[i];d.y+=d.vy;d.vy+=d.isSkill?0:0.08;d.life-=dt;if(d.life<=0)tickleNumbers.splice(i,1)}
for(let i=projectiles.length-1;i>=0;i--){if(!projectiles[i].update(dt))projectiles.splice(i,1)}
for(let i=weapons.length-1;i>=0;i--){if(weapons[i].pickedUp){weapons.splice(i,1);continue}}
for(let i=foodItems.length-1;i>=0;i--){const f=foodItems[i];if(f.pickedUp){foodItems.splice(i,1);continue}for(let p of players){if(p.laughing)continue;if(Math.abs(f.x-p.x)<100&&Math.abs(f.y-p.y+30)<100){p.currentBuff=f.type;p.buffTimer=15000;f.pickedUp=true;spawnCaptureCompleteEffect(f.x,f.y-10);let bn='';if(f.type==='regen')bn='欢乐';if(f.type==='attack')bn='逗笑';if(f.type==='speed')bn='疾风';if(f.type==='defense')bn='铁壁';spawnFloatText(p.skin.name+'抢到了'+bn+'餐!',f.x,f.y-60,'#FF9800');break;}}}
}

// ========== 随机事件 ==========
function triggerRandomEvent(){
const r=Math.random();
if(r<0.45){
const evt={id:'blackout',name:'熄灯了！宿管马上到！',duration:8000,color:'rgba(0,0,0,0.1)'};
currentEvent=evt;eventTimer=evt.duration;
// 触发暂停效果
showEventPause('熄灯警告！', '宿管阿姨要来查房了！', '#FF5252');
setTimeout(()=>{if(gameState!=='playing')return;inspector.active=true;inspector.x=-100;inspector.direction=1;inspector.rageMode=false;playSFX('inspectorWarn');spawnFloatText('宿管夜袭！',CANVAS_W/2,150,'#FF5252');},3000);
}else{
const evt={id:'takeaway',name:'外卖到了！',duration:10000,color:'rgba(255,200,100,0.02)'};
currentEvent=evt;eventTimer=evt.duration;
spawnFloatText('外卖小哥来了！',CANVAS_W/2,150,'#FF9800');
takeawayGuy={x:-80,y:GROUND_Y-65,vx:3.5,delivered:false,leaving:false,buff:['speed','attack','regen','defense'][Math.floor(Math.random()*4)]};
}
}

function showEventPause(title, subtitle, color){
gamePaused=true;
pauseTimer=2500;
pauseText=title;
pauseSubtext=subtitle;
pauseColor=color;
pauseFloatY=CANVAS_H/2;
}

function updateEvents(dt){
if(gamePaused){
pauseTimer-=dt;
if(pauseTimer<=0){
gamePaused=false;
pauseText='';
pauseSubtext='';
}
return;
}
if(currentEvent){eventTimer-=dt;if(eventTimer<=0)currentEvent=null}
nextEventTime-=dt;
if(nextEventTime<=0){triggerRandomEvent();nextEventTime=18000+Math.random()*8000}
if(takeawayGuy){if(!takeawayGuy.delivered){takeawayGuy.x+=takeawayGuy.vx;if(takeawayGuy.x>=420){takeawayGuy.delivered=true;foodItems.push({x:450,y:GROUND_Y-15,type:takeawayGuy.buff,pickedUp:false,bounce:0,animTime:0});spawnFloatText('外卖放下了！快去抢！',450,GROUND_Y-100,'#FF9800');setTimeout(()=>{if(takeawayGuy)takeawayGuy.leaving=true},1500);}}else if(takeawayGuy.leaving){takeawayGuy.x-=takeawayGuy.vx*1.2;if(takeawayGuy.x<-100)takeawayGuy=null;}}
}

function drawHead(skin,animTime,hurt){
const faceShape=skin.face;let hw=24,hh=24;if(faceShape==='oval'){hw=22;hh=26}if(faceShape==='square'){hw=26;hh=24}
ctx.fillStyle=skin.hair;const hs=skin.hairStyle;
if(hs==='short'){ctx.beginPath();ctx.arc(0,-2,hw+2,Math.PI,0);ctx.fill();ctx.fillRect(-hw-2,-2,hw*2+4,4)}
if(hs==='spiky'){ctx.beginPath();ctx.arc(0,-2,hw+2,Math.PI,0);ctx.fill();for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*8,-hw);ctx.lineTo(i*8+4,-hw-10);ctx.lineTo(i*8+8,-hw);ctx.fill()}}
if(hs==='buzz')ctx.beginPath();ctx.arc(0,-2,hw,Math.PI,0);ctx.fill();
if(hs==='twintail'){ctx.beginPath();ctx.arc(0,-2,hw+3,Math.PI,0);ctx.fill();ctx.save();ctx.translate(-hw,5);ctx.rotate(-0.3+Math.sin(animTime*0.01)*0.1);ctx.beginPath();ctx.ellipse(0,15,8,20,0,0,Math.PI*2);ctx.fill();ctx.restore();ctx.save();ctx.translate(hw,5);ctx.rotate(0.3+Math.sin(animTime*0.01)*0.1);ctx.beginPath();ctx.ellipse(0,15,8,20,0,0,Math.PI*2);ctx.fill();ctx.restore()}
if(hs==='long'){ctx.beginPath();ctx.arc(0,-2,hw+3,Math.PI,0);ctx.fill();ctx.fillRect(-hw-3,-2,9,32);ctx.fillRect(hw-6,-2,9,32)}
if(hs==='afro')ctx.beginPath();ctx.arc(0,-2,hw+7,0,Math.PI*2);ctx.fill();
ctx.fillStyle=hurt?'#FFCDD2':'#FFE0D0';ctx.beginPath();if(faceShape==='square')ctx.roundRect(-hw,-2,hw*2,hh,8);else ctx.arc(0,hh/2-2,hw,0,Math.PI*2);ctx.fill();
const acc=skin.acc;
if(acc==='glasses'){ctx.strokeStyle='#37474F';ctx.lineWidth=2;ctx.beginPath();ctx.arc(-7,10,7,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(7,10,7,0,Math.PI*2);ctx.stroke();ctx.fillStyle='rgba(255,255,255,0.35)';ctx.beginPath();ctx.arc(-9,8,3,0,Math.PI*2);ctx.fill()}
if(acc==='headband'){ctx.fillStyle='#E53935';ctx.fillRect(-hw-2,-2,hw*2+4,7);ctx.fillStyle='#FFD700';ctx.beginPath();ctx.arc(0,1,3,0,Math.PI*2);ctx.fill()}
if(acc==='bow'){ctx.fillStyle='#E91E63';ctx.save();ctx.translate(0,-hw-2);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-9,-6);ctx.lineTo(-9,6);ctx.fill();ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(9,-6);ctx.lineTo(9,6);ctx.fill();ctx.beginPath();ctx.arc(0,0,3.5,0,Math.PI*2);ctx.fill();ctx.restore()}
if(acc==='hood'){ctx.fillStyle=skin.hair;ctx.beginPath();ctx.arc(0,-5,hw+6,Math.PI*0.15,Math.PI*0.85,true);ctx.fill()}
if(acc==='cap'){ctx.save();ctx.translate(0,-hw+2);ctx.fillStyle=skin.hair;ctx.beginPath();ctx.ellipse(0,0,hw+4,9,0,Math.PI,0);ctx.fill();ctx.fillRect(-hw-4,-2,hw*2+8,9);ctx.fillStyle='#FFF';ctx.fillRect(hw-1,2,14,3);ctx.restore()}
const eyeY=10,eyeOffset=7;
if(hurt){ctx.fillStyle='#EF5350';ctx.beginPath();ctx.arc(-eyeOffset,eyeY,5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(eyeOffset,eyeY,5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#D32F2F';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-eyeOffset-7,eyeY-8);ctx.lineTo(-eyeOffset+2,eyeY-5);ctx.stroke();ctx.beginPath();ctx.moveTo(eyeOffset+7,eyeY-8);ctx.lineTo(eyeOffset-2,eyeY-5);ctx.stroke()}
else if(skin.eye==='big'){ctx.fillStyle='#333';ctx.beginPath();ctx.arc(-eyeOffset,eyeY,7,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(eyeOffset,eyeY,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#FFF';ctx.beginPath();ctx.arc(-eyeOffset-2,eyeY-2,2.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(eyeOffset-2,eyeY-2,2.5,0,Math.PI*2);ctx.fill()}
else if(skin.eye==='cool'){ctx.fillStyle='#333';ctx.fillRect(-eyeOffset-5,eyeY-2,10,4);ctx.fillRect(eyeOffset-5,eyeY-2,10,4)}
else if(skin.eye==='angry'){ctx.fillStyle='#333';ctx.beginPath();ctx.arc(-eyeOffset,eyeY+2,4.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(eyeOffset,eyeY+2,4.5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#333';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(-eyeOffset-6,eyeY-7);ctx.lineTo(-eyeOffset+1,eyeY-4);ctx.stroke();ctx.beginPath();ctx.moveTo(eyeOffset+6,eyeY-7);ctx.lineTo(eyeOffset-1,eyeY-4);ctx.stroke()}
else if(skin.eye==='sly'){ctx.fillStyle='#333';ctx.beginPath();ctx.ellipse(-eyeOffset,eyeY,5.5,3.5,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(eyeOffset,eyeY,5.5,3.5,0,0,Math.PI*2);ctx.fill()}
else{ctx.fillStyle='#333';ctx.beginPath();ctx.arc(-eyeOffset,eyeY,4.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(eyeOffset,eyeY,4.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#FFF';ctx.beginPath();ctx.arc(-eyeOffset-1,eyeY-1,1.8,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(eyeOffset-1,eyeY-1,1.8,0,Math.PI*2);ctx.fill()}
if(!hurt){const ba=0.45+Math.sin(animTime*0.005)*0.1;ctx.fillStyle='rgba(255,105,135,'+ba+')';ctx.beginPath();ctx.arc(-13,17,5.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(13,17,5.5,0,Math.PI*2);ctx.fill()}
ctx.strokeStyle='#8D6E63';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,18,5,0,Math.PI);ctx.stroke();
}

function drawEffects(){

else if(e.type==='flame'){ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(e.x,e.y,e.size*alpha,0,Math.PI*2);ctx.fill()}
else if(e.type==='shockwave'){if(e.delay>0)continue;ctx.strokeStyle='rgba(255,255,255,'+alpha*0.65+')';ctx.lineWidth=3.5;ctx.beginPath();ctx.ellipse(e.x,e.y,e.radius,e.radius*0.5,0,0,Math.PI*2);ctx.stroke()}
else if(e.type==='flash'){ctx.fillStyle='rgba(255,255,255,'+alpha+')';ctx.beginPath();ctx.arc(e.x,e.y,e.size,0,Math.PI*2);ctx.fill()}
else if(e.type==='dust'||e.type==='smoke'){ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(e.x,e.y,e.size,0,Math.PI*2);ctx.fill()}
else if(e.type==='heal'){ctx.fillStyle=e.color;ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.life*0.012);drawStar(0,0,e.size,5);ctx.restore()}
else if(e.type==='soundwave'){if(e.delay>0)continue;ctx.strokeStyle='rgba(255,200,100,'+alpha*0.55+')';ctx.lineWidth=5;ctx.beginPath();ctx.arc(e.x,e.y,e.radius,0,Math.PI*2);ctx.stroke()}
else if(e.type==='tornado'){const tx=e.x+Math.cos(e.angle)*e.radius;const ty=e.y+Math.sin(e.angle)*e.radius*0.5;ctx.fillStyle=e.color;ctx.globalAlpha=alpha*0.65;ctx.beginPath();ctx.arc(tx,ty,9,0,Math.PI*2);ctx.fill()}
else if(e.type==='capture'){ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(e.x,e.y,e.size,0,Math.PI*2);ctx.fill()}
}
ctx.globalAlpha=1;
for(let d of tickleNumbers){const alpha=d.life/d.maxLife;ctx.globalAlpha=alpha;
if(d.isSkill){ctx.fillStyle='#FFD700';ctx.font='bold 30px sans-serif';ctx.strokeStyle='#FF6F00';ctx.lineWidth=5}else{ctx.fillStyle='#FFA726';ctx.font='bold 24px sans-serif';ctx.strokeStyle='white';ctx.lineWidth=3.5}
ctx.textAlign='center';ctx.strokeText(d.text,d.x+d.offset,d.y);ctx.fillText(d.text,d.x+d.offset,d.y)}
ctx.globalAlpha=1;
}

function drawStar(cx,cy,r,points){ctx.beginPath();for(let i=0;i<points*2;i++){const r2=i%2===0?r:r/2;const a=(i/(points*2))*Math.PI*2-Math.PI/2;const x=cx+Math.cos(a)*r2;const y=cy+Math.sin(a)*r2;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.closePath();ctx.fill()}

// ========== 新手引导 ==========
function showTutorial(text){const t=document.getElementById('tutorial');t.textContent=text;t.style.display='block';clearTimeout(t._timer);}

// ========== 组队系统 ==========
function tryTeamUp(){
const p=players[0];if(!p||p.laughing)return;
// find nearest player without team or different team
let nearest=null,minDist=80;
for(let pl of players){if(pl===p||pl.laughing)continue;const d=Math.abs(pl.x-p.x);if(d<minDist){minDist=d;nearest=pl}}
if(nearest){
if(p.team<0){
// create new team
const newTeamId=players.filter(pl=>pl.team>=0).length;
p.team=newTeamId;nearest.team=newTeamId;
spawnFloatText(p.skin.name+' 和 '+nearest.skin.name+' 组队了!',p.x,p.y-70,'#2196F3');
}else{
// join nearest's team or invite
if(nearest.team<0){nearest.team=p.team;spawnFloatText(nearest.skin.name+' 加入了队伍!',nearest.x,nearest.y-70,'#2196F3')}
else if(nearest.team!==p.team){spawnFloatText('对方已有队伍!',p.x,p.y-70,'#FF5252')}
else{
// 同队玩家，按T退出并背刺！
p.team=-1;
spawnFloatText('背刺!',p.x,p.y-70,'#D32F2F');
// 立即攻击队友
if(p.hasWeapon&&p.attackCooldown<=0){
p.facing=p.x>nearest.x?1:-1;
p.attack();
}
}
}
}else{
// leave team
if(p.team>=0){
// 退出队伍时，检查附近是否有队友可以背刺
let teammateNearby=null;
for(let pl of players){if(pl===p||pl.laughing)continue;if(pl.team===p.team){teammateNearby=pl;break}}
if(teammateNearby){
p.team=-1;
spawnFloatText('背刺!',p.x,p.y-70,'#D32F2F');
if(p.hasWeapon&&p.attackCooldown<=0){
p.facing=p.x>teammateNearby.x?1:-1;
p.attack();
}
}else{
p.team=-1;
spawnFloatText('退出队伍',p.x,p.y-70,'#999');
}
}else{spawnFloatText('附近无人可组队',p.x,p.y-70,'#999')}
}
updateTeamIndicator();
}

function updateTeamIndicator(){
const el=document.getElementById('teamIndicator');
const p=players[0];if(!p||p.team<0){el.innerHTML='';el.style.display='none';return}
const tc=['红队','蓝队','绿队','橙队'][p.team%4];
const cc=['#E53935','#1E88E5','#43A047','#FB8C00'][p.team%4];
el.innerHTML='<span class="team-badge" style="background:'+cc+'">'+tc+'</span>';
el.style.display='block';
}

// ========== 游戏循环 ==========
function gameLoop(timestamp){
const dt=Math.min(33,timestamp-lastTime);lastTime=timestamp;
animTime+=1;

if(gameState==='intro'){
updateIntro(dt);
drawIntroScene(ctx,animTime);
requestAnimationFrame(gameLoop);return;
}

if(gameState==='transition'){
updateTransition(dt);
drawTransition();
requestAnimationFrame(gameLoop);return;
}

if(gameState==='menu'){
drawMenu();
requestAnimationFrame(gameLoop);return;
}

if(gameState==='gameover'){
renderGameOver();
requestAnimationFrame(gameLoop);return;
}

if(gameState==='ending'){
// 结束中：只渲染画面，不更新逻辑
ctx.save();
if(cameraShake>0){const sx=(Math.random()-0.5)*shakeIntensity;const sy=(Math.random()-0.5)*shakeIntensity;ctx.translate(sx,sy);cameraShake-=dt/1000;if(cameraShake<=0){cameraShake=0;shakeIntensity=0}}
drawScene();
for(let proj of projectiles)proj.draw(ctx);
const sortedPlayers=[...players].sort((a,b)=>a.y-b.y);
for(let p of sortedPlayers)drawPlayer(p);
drawEffects();
ctx.restore();
// 半透明遮罩
ctx.save();
ctx.fillStyle='rgba(0,0,0,'+(0.3+Math.sin(Date.now()*0.003)*0.1)+')';
ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
ctx.textAlign='center';
ctx.fillStyle='#FFD54F';
ctx.font='bold 36px sans-serif';
ctx.fillText('对决结束...',CANVAS_W/2,CANVAS_H/2);
ctx.restore();
requestAnimationFrame(gameLoop);return;
}

if(gameState==='playing'){
if(settingsOpen){requestAnimationFrame(gameLoop);return;}
// 检测玩家是否靠近武器
const p=players[0];
if(p&&!p.laughing&&!p.hasWeapon){
pickupAvailable=null;
for(let w of weapons){
if(Math.abs(w.x-p.x)<60){pickupAvailable=w;break;}
}
}

if(!gamePaused){
if(p&&!p.laughing&&!p.climbing){
const spd=MOVE_SPEED*(p.rageMode?1.3:1)*(p.speedBoost>0?1.5:1)*(p.currentBuff==='speed'?1.3:1);
if(keys['a']||keys['arrowleft']||joystickDX<-0.3){p.vx=-spd;p.facing=-1}
if(keys['d']||keys['arrowright']||joystickDX>0.3){p.vx=spd;p.facing=1}
if((keys['w']||keys[' ']||keys['arrowup']||joystickDY<-0.5)){
if(!p._jumpHeld){
p._jumpHeld=true;
if(p.onGround){p.vy=-JUMP_POWER;p.onGround=false;p.squash=1.25;p.stretch=0.75;p.jumpCount=1;if(tutorialStep===0){showTutorial('跳跃成功！空中再按可二段跳');tutorialStep=1}}
else if(p.jumpCount<p.maxJumps){p.vy=-JUMP_POWER*0.85;p.squash=1.25;p.stretch=0.75;p.jumpCount++;spawnDoubleJumpEffect(p.x,p.y);}
}
}else{p._jumpHeld=false;}
if(keys['j']){p.attack();keys['j']=false;if(tutorialStep===1){showTutorial('攻击！按K投掷');tutorialStep=2}}
if(keys['k']){p.throwWeapon();keys['k']=false;if(tutorialStep===2){showTutorial('投掷！靠近武器按E拾取');tutorialStep=3}}
if(keys['u']){p.useSkill();keys['u']=false}
if(keys['t']){tryTeamUp();keys['t']=false}
if(keys['s']){p.toggleSurrender();keys['s']=false}
if(keys['e']){
for(let b of BEDS){if(b.owner===null&&Math.abs(b.x+100-p.x)<60&&p.onGround){p.captureBed(b);if(tutorialStep===3){showTutorial('占领床位！获得Buff');tutorialStep=4}break}}
// 尝试拾取武器
if(pickupAvailable&&!p.hasWeapon){
p.weapon=pickupAvailable.type;p.hasWeapon=true;pickupAvailable.pickedUp=true;
pickupAvailable=null;
}
keys['e']=false;
}
}

for(let pl of players)pl.update(dt);
if(inspector)inspector.update(dt);
updateEffects(dt);
}
updateEvents(dt);

const alive=players.filter(p=>!p.laughing);
if(alive.length<=1&&gameState==='playing'){
gameState='ending';
clearInterval(gameTimeInterval);
document.getElementById('controlsBar').style.display='none';
// 暂停1.5秒后再判断最终结果
setTimeout(()=>{
const finalAlive=players.filter(p=>!p.laughing);
drawGameOver(finalAlive[0]||null);
},1500);
}
}

ctx.save();
if(cameraShake>0){const sx=(Math.random()-0.5)*shakeIntensity;const sy=(Math.random()-0.5)*shakeIntensity;ctx.translate(sx,sy);cameraShake-=dt/1000;if(cameraShake<=0){cameraShake=0;shakeIntensity=0}}
drawScene();
for(let proj of projectiles)proj.draw(ctx);
const sortedPlayers=[...players].sort((a,b)=>a.y-b.y);
for(let p of sortedPlayers)drawPlayer(p);
drawEffects();
ctx.restore();

// 暂停效果
if(gamePaused){
ctx.save();
ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
ctx.textAlign='center';
// 文字往上飘
pauseFloatY-=0.8;
const progress=pauseTimer/2500;
const alpha=progress;
ctx.fillStyle=pauseColor;
ctx.font='bold 48px sans-serif';
ctx.globalAlpha=alpha;
ctx.fillText(pauseText,CANVAS_W/2,pauseFloatY-40);
ctx.globalAlpha=alpha*0.8;
ctx.font='24px sans-serif';
ctx.fillStyle='#FFF';
ctx.fillText(pauseSubtext,CANVAS_W/2,pauseFloatY+20);
ctx.restore();
}

// 永久按键提示
if(gameState==='playing'){
ctx.save();
ctx.textAlign='center';
ctx.font='14px sans-serif';
ctx.fillStyle='rgba(0,0,0,0.5)';
ctx.fillText('[ A/D 移动 ] [ W/空格 二段跳 ] [ J 攻击 ] [ K 投掷 ] [ E 拾取/占领 ] [ U 技能 ] [ T 组队/背刺 ] [ S 投降 ]',CANVAS_W/2,CANVAS_H-28);
// 拾取提示
if(pickupAvailable&&!players[0].hasWeapon){
ctx.fillStyle='#FF9800';
ctx.font='bold 18px sans-serif';
ctx.fillText('按 E 拾取武器！',CANVAS_W/2,CANVAS_H-50);
}
ctx.restore();

// social welfare footer
ctx.fillStyle='rgba(0,0,0,0.3)';ctx.font='11px sans-serif';ctx.textAlign='center';
ctx.fillText('宿舍关系好，大学生活才好 · 这只是游戏，现实请用沟通解决矛盾',CANVAS_W/2,CANVAS_H-8);

// === 设置/暂停菜单 ===
if(settingsOpen){
ctx.save();
ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
ctx.textAlign='center';
ctx.fillStyle='#FFF';ctx.font='bold 40px sans-serif';
ctx.fillText('暂停',CANVAS_W/2,CANVAS_H/2-120);
// 音效开关
ctx.font='20px sans-serif';
ctx.fillStyle=sfxEnabled?'#4CAF50':'#666';
ctx.fillText('音效: '+(sfxEnabled?'开':'关'),CANVAS_W/2,CANVAS_H/2-50);
// 音效音量
ctx.fillStyle='#FFD54F';
ctx.fillText('音效音量: '+'■'.repeat(Math.round(sfxVolume*10))+'□'.repeat(10-Math.round(sfxVolume*10)),CANVAS_W/2,CANVAS_H/2);
// 操作提示
ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';
ctx.fillText('N-开关音效 | ↑↓调节音量 | ESC-继续',CANVAS_W/2,CANVAS_H/2+60);
ctx.restore();
}
}

requestAnimationFrame(gameLoop);
}

// ========== 倒计时 ==========
function updateCountdown(){
if(gameState!=='playing')return;gameTime--;
const el=document.getElementById('countdown');const m=Math.floor(gameTime/60);const s=gameTime%60;
el.textContent=m+':'+(s<10?'0':'')+s;
if(gameTime<=30)el.classList.add('low');else el.classList.remove('low');
if(gameTime<=0)endGameByTime();
}
function endGameByTime(){
gameState='ending';
clearInterval(gameTimeInterval);
document.getElementById('controlsBar').style.display='none';
// 暂停1.5秒后再判断最终结果
setTimeout(()=>{
let maxHappiness=-1,winner=null;
for(let p of players){
if(p.laughing)continue;
if(p.happiness>maxHappiness){
maxHappiness=p.happiness;
winner=p;
}
}
drawGameOver(winner,true);
},1500);
}

// ========== 游戏结束 ==========
let gameOverWinner=null,gameOverByTime=false;
function drawGameOver(winner,byTime){
gameOverWinner=winner;
gameOverByTime=byTime;
gameState='gameover';
playSFX('gameover');
}

function renderGameOver(){
ctx.save();
ctx.fillStyle='rgba(0,0,0,0.75)';
ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
ctx.textAlign='center';
const player=players[0];
const isPlayerWin=gameOverWinner&&!gameOverWinner.isAI;
const isPlayerDead=player&&player.laughing;

if(gameOverWinner){
if(isPlayerWin){
ctx.fillStyle='#4CAF50';
ctx.font='bold 56px sans-serif';
ctx.fillText('🎉 你获胜了！',CANVAS_W/2,CANVAS_H/2-80);
}else{
ctx.fillStyle='#FF5252';
ctx.font='bold 56px sans-serif';
ctx.fillText('💀 你失败了！',CANVAS_W/2,CANVAS_H/2-80);
ctx.fillStyle='#FFD700';
ctx.font='bold 32px sans-serif';
ctx.fillText(gameOverWinner.skin.name+' 获胜！',CANVAS_W/2,CANVAS_H/2-30);
}
ctx.fillStyle='rgba(255,255,255,0.85)';
ctx.font='18px sans-serif';
ctx.fillText(gameOverByTime?'时间到！':'趣味对决结束！',CANVAS_W/2,CANVAS_H/2+10);
}else{
ctx.fillStyle='#FF9800';
ctx.font='bold 48px sans-serif';
ctx.fillText('🤝 平局！',CANVAS_W/2,CANVAS_H/2-40);
}
// 退出引导
ctx.fillStyle='rgba(255,255,255,0.6)';
ctx.font='16px sans-serif';
ctx.fillText('点击左上角「退出游戏」返回',CANVAS_W/2,CANVAS_H/2+60);
ctx.restore();
}

// ========== skip ==========
function skipIntro(){
	if(gameState==='intro'){
		if(introPhase===0){startStory();}
		else if(introPhase===1){startTransition();}
	}
}

function exitGame(){
	if(gameState==='playing'||gameState==='gameover'||gameState==='ending'){
		clearInterval(gameTimeInterval);
		gameState='intro';
		introPhase=0;
		introTimer=0;
		storyTextIdx=0;
		mergeProgress=0;
		document.getElementById('exitBtn').style.display='none';
		document.getElementById('countdown').style.display='none';
		document.getElementById('teamIndicator').style.display='none';
document.getElementById('controlsBar').style.display='none';
document.getElementById('skipBtn').style.display='block';
		document.getElementById('tutorial').style.display='none';
		if(joystick)joystick.style.display='none';
		if(btnAttack)btnAttack.style.display='none';
		if(btnJump)btnJump.style.display='none';
		if(btnThrow)btnThrow.style.display='none';
		if(btnSkill)btnSkill.style.display='none';
		if(btnCapture)btnCapture.style.display='none';
		if(btnTeam)btnTeam.style.display='none';
		initFloatTexts();
	}
}

function handleIntroClick(mx,my){
if(gameState!=='intro')return false;
if(introPhase===0){
const btnY=265;
const bw=150,bh=38;
const bx=Math.floor(CANVAS_W/PX/2-bw/2);
const by=btnY-Math.floor(bh/2);
if(mx>bx*PX&&mx<(bx+bw)*PX&&my>by*PX&&my<(by+bh)*PX){
startStory();
return true;
}
}
return false;
}

// ========== 开始游戏 ==========
function startGame(){
document.getElementById('skipBtn').style.display='none';
document.getElementById('exitBtn').style.display='block';
document.getElementById('countdown').style.display='block';
document.getElementById('controlsBar').style.display='block';
initAudio();
resetGame();
// 类似宿管入场的暂停效果
showEventPause('全员集结！', '宿舍大乱斗开始！', '#FFD54F');
setTimeout(()=>{
if(gameState!=='playing')return;
spawnFloatText('开始！',CANVAS_W/2,150,'#FFD54F');
},2500);
gameState='playing';
if('ontouchstart'in window){joystick.style.display='block';btnAttack.style.display='flex';btnJump.style.display='flex';btnThrow.style.display='flex';btnSkill.style.display='flex';btnCapture.style.display='flex';btnTeam.style.display='flex';}
}

function resetGame(){
players=[];weapons=[];projectiles=[];effects=[];tickleNumbers=[];foodItems=[];takeawayGuy=null;
cameraShake=0;currentEvent=null;eventTimer=0;nextEventTime=6000;
inspector=new Inspector();
for(let b of BEDS)b.owner=null;
gameTime=GAME_TIME;
document.getElementById('countdown').classList.remove('low');
clearInterval(gameTimeInterval);gameTimeInterval=setInterval(updateCountdown,1000);

const skinIndices=[0,1,2,5];

// 玩家在左侧 - 初始拿凉席狙击枪
const player=new Player(150,GROUND_Y-48,skinIndices[0],false);
player.weapon='mat';player.hasWeapon=true;
players.push(player);

// 地面AI在右侧，面对玩家 - 拿凉席狙击枪
const ai1=new Player(550,GROUND_Y-48,skinIndices[1],true);
ai1.facing=-1;
ai1.weapon='mat';ai1.hasWeapon=true;
players.push(ai1);

// 床上的两个AI：上铺和下铺各一个，直接站立 - 拿凉席狙击枪
for(let i=0;i<2;i++){
const bed=BEDS[i];
const ai=new Player(bed.x+110,bed.y-48,skinIndices[i+2],true);
ai.onBed=true;ai.onGround=false;
ai.currentBed=i===0?'bottom':'top';
ai.weapon='mat';ai.hasWeapon=true;
bed.owner=skinIndices[i+2];
ai.currentBuff=bed.buff;
ai.buffTimer=12000;
ai._bedStayTimer=0;
players.push(ai);
}

// 武器放在合理的位置（地上放晾衣杆狙击枪让玩家可以拾取升级）
weapons.push({x:150,y:440,type:'hanger',pickedUp:false,animOffset:Math.random()*100});
weapons.push({x:380,y:GROUND_Y-10,type:'cane',pickedUp:false,animOffset:Math.random()*100});
weapons.push({x:650,y:GROUND_Y-10,type:'pole',pickedUp:false,animOffset:Math.random()*100});
weapons.push({x:900,y:GROUND_Y-10,type:'pole',pickedUp:false,animOffset:Math.random()*100});
weapons.push({x:1150,y:GROUND_Y-40,type:'pillow',pickedUp:false,animOffset:Math.random()*100});
lastTime=performance.now();tutorialStep=0;
updateTeamIndicator();
}

// polyfill
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){if(typeof r==='number')r=[r,r,r,r];this.beginPath();this.moveTo(x+r[0],y);this.lineTo(x+w-r[1],y);this.quadraticCurveTo(x+w,y,x+w,y+r[1]);this.lineTo(x+w,y+h-r[2]);this.quadraticCurveTo(x+w,y+h,x+w-r[2],y+h);this.lineTo(x+r[3],y+h);this.quadraticCurveTo(x,y+h,x,y+h-r[3]);this.lineTo(x,y+r[0]);this.quadraticCurveTo(x,y,x+r[0],y);this.closePath();return this;}}

// ========== 启动 ==========
document.getElementById('skipBtn').style.display='block';
canvas.onclick=e=>{
const rect=canvas.getBoundingClientRect();
const mx=(e.clientX-rect.left)/scale;
const my=(e.clientY-rect.top)/scale;
if(handleIntroClick(mx,my))return;
if(gameState==='menu'){
if(mx>CANVAS_W/2-100&&mx<CANVAS_W/2+100&&my>450&&my<510){startGame();}
}else if(gameState==='gameover'||gameState==='ending'){
resetGame();
}
};
lastTime=performance.now();
requestAnimationFrame(gameLoop);
</script>
