<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>钢铁行业智能助手 - 贾维斯</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #f5f7fa;
            --bg-white: #ffffff;
            --bg-sidebar: #1d1e2c;
            --bg-sidebar-hover: #2a2b3d;
            --bg-sidebar-active: #323347;
            --bg-bubble-user: #409eff;
            --bg-bubble-assistant: #ffffff;
            --bg-thinking: #f0f5ff;
            --bg-code: #f6f8fa;
            --bg-input: #ffffff;
            --text-primary: #303133;
            --text-regular: #606266;
            --text-secondary: #909399;
            --text-white: #ffffff;
            --text-sidebar: #a3a6b7;
            --text-sidebar-active: #ffffff;
            --border-color: #e4e7ed;
            --border-light: #ebeef5;
            --accent-blue: #409eff;
            --accent-green: #67c23a;
            --accent-orange: #e6a23c;
            --accent-red: #f56c6c;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition: all 0.25s ease;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        /* ===== Sidebar ===== */
        .sidebar {
            width: 260px;
            background: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: var(--transition);
        }

        .sidebar-header {
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .sidebar-logo {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, #409eff, #67c23a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: white;
            font-weight: 700;
        }

        .sidebar-brand {
            color: var(--text-white);
            font-size: 1.05rem;
            font-weight: 600;
        }

        .sidebar-brand small {
            display: block;
            font-size: 0.75rem;
            color: var(--text-sidebar);
            font-weight: 400;
            margin-top: 2px;
        }

        .sidebar-nav {
            flex: 1;
            padding: 12px 8px;
            overflow-y: auto;
        }

        .nav-section {
            margin-bottom: 8px;
        }

        .nav-section-title {
            padding: 8px 16px;
            font-size: 0.7rem;
            color: var(--text-sidebar);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            color: var(--text-sidebar);
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.9rem;
        }

        .nav-item:hover {
            background: var(--bg-sidebar-hover);
            color: var(--text-sidebar-active);
        }

        .nav-item.active {
            background: var(--bg-sidebar-active);
            color: var(--text-sidebar-active);
        }

        .nav-icon {
            width: 20px;
            text-align: center;
            font-size: 1rem;
        }

        .new-chat-btn {
            margin: 8px 12px 12px;
            padding: 10px;
            background: rgba(64, 158, 255, 0.15);
            border: 1px dashed rgba(64, 158, 255, 0.4);
            border-radius: var(--radius-sm);
            color: var(--accent-blue);
            text-align: center;
            cursor: pointer;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .new-chat-btn:hover {
            background: rgba(64, 158, 255, 0.25);
        }

        .session-list {
            flex: 1;
            padding: 4px 8px;
            overflow-y: auto;
        }

        .session-item {
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            color: var(--text-sidebar);
            cursor: pointer;
            font-size: 0.85rem;
            transition: var(--transition);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .session-item:hover { background: var(--bg-sidebar-hover); }
        .session-item.active { background: var(--bg-sidebar-active); color: var(--text-white); }

        /* ===== Main Content ===== */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: var(--bg-primary);
        }

        .main-header {
            height: 56px;
            background: var(--bg-white);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            flex-shrink: 0;
        }

        .header-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 500;
        }

        .badge-knowledge { background: #ecf5ff; color: #409eff; }
        .badge-data { background: #f0f9eb; color: #67c23a; }
        .badge-hybrid { background: #fdf6ec; color: #e6a23c; }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .header-btn {
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-white);
            color: var(--text-regular);
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .header-btn:hover { border-color: var(--accent-blue); color: var(--accent-blue); }

        /* ===== Chat Area ===== */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        .welcome-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }

        .welcome-icon {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            background: linear-gradient(135deg, #409eff, #67c23a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: white;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(64, 158, 255, 0.3);
        }

        .welcome-title {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .welcome-desc {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 600px;
            width: 100%;
        }

        .quick-action {
            padding: 16px;
            background: var(--bg-white);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            cursor: pointer;
            text-align: left;
            transition: var(--transition);
        }

        .quick-action:hover {
            border-color: var(--accent-blue);
            box-shadow: var(--shadow-sm);
            transform: translateY(-1px);
        }

        .quick-action-icon {
            font-size: 1.2rem;
            margin-bottom: 8px;
        }

        .quick-action-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .quick-action-desc {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Messages */
        .message {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            animation: msgIn 0.3s ease-out;
        }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user { flex-direction: row-reverse; }

        .msg-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 600;
            flex-shrink: 0;
        }

        .message.user .msg-avatar {
            background: linear-gradient(135deg, #409eff, #66b1ff);
            color: white;
        }

        .message.assistant .msg-avatar {
            background: linear-gradient(135deg, #67c23a, #85ce61);
            color: white;
        }

        .msg-body {
            max-width: 70%;
            min-width: 0;
        }

        .msg-bubble {
            padding: 14px 18px;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            line-height: 1.7;
            word-break: break-word;
        }

        .message.user .msg-bubble {
            background: var(--bg-bubble-user);
            color: white;
            border-top-right-radius: 4px;
        }

        .message.assistant .msg-bubble {
            background: var(--bg-bubble-assistant);
            color: var(--text-primary);
            border: 1px solid var(--border-light);
            border-top-left-radius: 4px;
            box-shadow: var(--shadow-sm);
        }

        /* Thinking Steps */
        .thinking-steps {
            margin-bottom: 12px;
            border: 1px solid #d9ecff;
            border-radius: var(--radius-sm);
            overflow: hidden;
        }

        .thinking-header {
            padding: 10px 14px;
            background: var(--bg-thinking);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--accent-blue);
            font-weight: 500;
        }

        .thinking-header .arrow {
            transition: transform 0.2s;
            font-size: 0.75rem;
        }

        .thinking-header .arrow.open { transform: rotate(90deg); }

        .thinking-body {
            padding: 12px 14px;
            background: #fafcff;
            border-top: 1px solid #d9ecff;
        }

        .thinking-step {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 6px 0;
            font-size: 0.83rem;
            color: var(--text-regular);
        }

        .step-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-blue);
            flex-shrink: 0;
            margin-top: 6px;
        }

        .step-dot.done { background: var(--accent-green); }
        .step-dot.active {
            background: var(--accent-blue);
            animation: pulse 1.4s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 80%, 100% { opacity: 0.5; transform: scale(0.85); }
            40% { opacity: 1; transform: scale(1.1); }
        }

        /* References */
        .references {
            margin-top: 12px;
            border-top: 1px dashed var(--border-color);
            padding-top: 10px;
        }

        .ref-title {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .ref-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .ref-tag {
            padding: 3px 10px;
            background: #ecf5ff;
            color: var(--accent-blue);
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .ref-tag:hover { background: #d9ecff; }

        /* SQL Trace */
        .sql-trace {
            margin-top: 12px;
            border-top: 1px dashed var(--border-color);
            padding-top: 10px;
        }

        .sql-title {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .sql-code {
            background: var(--bg-code);
            padding: 10px 14px;
            border-radius: 6px;
            font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
            font-size: 0.82rem;
            color: #c7254e;
            line-height: 1.6;
            overflow-x: auto;
        }

        /* Chart */
        .chart-container {
            margin-top: 14px;
            background: var(--bg-white);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            padding: 16px;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .chart-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .chart-type-tabs {
            display: flex;
            gap: 4px;
        }

        .chart-tab {
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            color: var(--text-secondary);
            border: 1px solid var(--border-light);
            background: var(--bg-white);
            transition: var(--transition);
        }

        .chart-tab.active {
            background: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
        }

        .chart-area {
            height: 200px;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: 0 4px;
        }

        .chart-bar-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: flex-end;
        }

        .chart-bar {
            width: 100%;
            max-width: 48px;
            background: linear-gradient(180deg, #409eff 0%, #79bbff 100%);
            border-radius: 4px 4px 0 0;
            transition: height 0.6s ease-out;
            position: relative;
            min-height: 4px;
        }

        .chart-bar-val {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .chart-bar-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 6px;
            white-space: nowrap;
        }

        /* Data Table */
        .data-table-wrap {
            margin-top: 12px;
            overflow-x: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
        }

        .data-table th {
            background: #f5f7fa;
            padding: 8px 12px;
            text-align: left;
            font-weight: 600;
            color: var(--text-regular);
            border-bottom: 2px solid var(--border-light);
        }

        .data-table td {
            padding: 7px 12px;
            border-bottom: 1px solid var(--border-light);
            color: var(--text-primary);
        }

        .data-table tr:hover td { background: #f5f7fa; }

        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 0;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-blue);
            animation: typingBounce 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        /* ===== Input Area ===== */
        .input-area {
            padding: 16px 24px 20px;
            background: var(--bg-white);
            border-top: 1px solid var(--border-light);
            flex-shrink: 0;
        }

        .input-config {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .config-select {
            padding: 5px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.8rem;
            color: var(--text-regular);
            background: var(--bg-white);
            cursor: pointer;
            outline: none;
        }

        .config-select:focus { border-color: var(--accent-blue); }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .input-field {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            outline: none;
            resize: none;
            min-height: 46px;
            max-height: 120px;
            line-height: 1.5;
            font-family: inherit;
            transition: var(--transition);
        }

        .input-field:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(64, 158, 255, 0.1);
        }

        .input-field::placeholder { color: var(--text-secondary); }

        .send-btn {
            width: 46px;
            height: 46px;
            border-radius: var(--radius-md);
            border: none;
            background: var(--accent-blue);
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .send-btn:hover { background: #66b1ff; }
        .send-btn:disabled { background: #c0c4cc; cursor: not-allowed; }

        .input-hint {
            margin-top: 6px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-align: center;
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .msg-body { max-width: 85%; }
            .quick-actions { grid-template-columns: 1fr; }
            .chat-area { padding: 16px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">贾</div>
            <div class="sidebar-brand">
                贾维斯
                <small>Steel Industry Agent</small>
            </div>
        </div>

        <div class="new-chat-btn" onclick="newChat()">+ 新建对话</div>

        <div class="nav-section">
            <div class="nav-section-title">功能导航</div>
            <div class="nav-item active">
                <span class="nav-icon">💬</span> 智能对话
            </div>
            <div class="nav-item">
                <span class="nav-icon">📚</span> 知识管理
            </div>
            <div class="nav-item">
                <span class="nav-icon">📊</span> 数据管理
            </div>
            <div class="nav-item">
                <span class="nav-icon">⚙️</span> 系统设置
            </div>
        </div>

        <div class="nav-section">
            <div class="nav-section-title">历史对话</div>
        </div>
        <div class="session-list" id="sessionList">
            <div class="session-item active">转炉炼钢工艺知识查询</div>
            <div class="session-item">10月份生产数据分析</div>
            <div class="session-item">高炉炉况打分融合分析</div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="main-header">
            <div class="header-title">
                💬 智能对话
                <span class="header-badge badge-hybrid" id="intentBadge" style="display:none;"></span>
            </div>
            <div class="header-actions">
                <button class="header-btn" onclick="clearChat()">清空对话</button>
                <button class="header-btn" onclick="exportChat()">导出记录</button>
            </div>
        </div>

        <div class="chat-area" id="chatArea">
            <!-- Welcome -->
            <div class="welcome-section" id="welcomeSection">
                <div class="welcome-icon">贾</div>
                <div class="welcome-title">你好，我是钢铁行业智能助手贾维斯</div>
                <div class="welcome-desc">我可以帮你查询工艺知识、分析生产数据，或同时进行融合推理</div>
                <div class="quick-actions">
                    <div class="quick-action" onclick="askQuestion('高炉炼铁的还原过程是什么？')">
                        <div class="quick-action-icon">📖</div>
                        <div class="quick-action-title">查询工艺知识</div>
                        <div class="quick-action-desc">高炉炼铁的还原过程是什么？</div>
                    </div>
                    <div class="quick-action" onclick="askQuestion('展示2024年10月的转炉钢产量')">
                        <div class="quick-action-icon">📊</div>
                        <div class="quick-action-title">查询生产数据</div>
                        <div class="quick-action-desc">展示2024年10月的转炉钢产量</div>
                    </div>
                    <div class="quick-action" onclick="askQuestion('转炉炼钢的吹炼制度有哪些？统计一下2024年10月的冶炼炉数')">
                        <div class="quick-action-icon">🧠</div>
                        <div class="quick-action-title">融合推理分析</div>
                        <div class="quick-action-desc">知识解答 + 数据分析同步进行</div>
                    </div>
                    <div class="quick-action" onclick="askQuestion('折线图展示2024年10月每日的炉况打分值')">
                        <div class="quick-action-icon">📈</div>
                        <div class="quick-action-title">可视化图表</div>
                        <div class="quick-action-desc">自动推荐图表类型并渲染</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-config">
                <select class="config-select" id="kbSelect">
                    <option value="">选择知识库</option>
                    <option value="1" selected>钢铁工艺知识库</option>
                    <option value="2">高炉操作规程</option>
                </select>
                <select class="config-select" id="dsSelect">
                    <option value="">选择数据源</option>
                    <option value="1" selected>钢铁行业生产数据库</option>
                    <option value="2">炉况打分数据库</option>
                </select>
            </div>
            <div class="input-wrapper">
                <textarea class="input-field" id="inputField" placeholder="输入您的问题，例如：查询今天的炉况打分情况..." rows="1" onkeydown="handleKeyDown(event)"></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
            </div>
            <div class="input-hint">按 Enter 发送，Shift+Enter 换行 | 支持知识问答、智能问数、融合推理</div>
        </div>

async function sendMessage() {
    if (isProcessing) return;
    const input = document.getElementById('inputField');
    const question = input.value.trim();
    if (!question) return;

    isProcessing = true;
    document.getElementById('sendBtn').disabled = true;
    input.value = '';

    // Remove welcome
    const welcome = document.getElementById('welcomeSection');
    if (welcome) welcome.remove();

    const chatArea = document.getElementById('chatArea');

    // Add user message
    chatArea.appendChild(createUserMessage(question));
    scrollToBottom();

    // Determine response type
    let responseType = 'knowledge';
    if (question.includes('产量') || question.includes('炉数') || question.includes('打分') || question.includes('数据') || question.includes('统计')) {
        if (question.includes('制度') || question.includes('过程') || question.includes('什么') || question.includes('原理') || question.includes('哪些')) {
            responseType = 'hybrid';
        } else {
            responseType = 'data';
        }
    }
    if (question.includes('折线图') || question.includes('炉况打分')) {
        responseType = 'chart';
    }

    const response = RESPONSES[responseType];

    // Show intent badge
    const badge = document.getElementById('intentBadge');
    const intentMap = { knowledge: '知识问答', data: '智能问数', hybrid: '融合推理', chart: '智能问数' };
    const badgeClassMap = { knowledge: 'badge-knowledge', data: 'badge-data', hybrid: 'badge-hybrid', chart: 'badge-data' };
    badge.textContent = intentMap[response.intent] || intentMap[responseType];
    badge.className = 'header-badge ' + (badgeClassMap[response.intent] || badgeClassMap[responseType]);
    badge.style.display = 'inline-block';

    // Add assistant message with thinking
    const assistantMsg = createAssistantMessage(response);
    chatArea.appendChild(assistantMsg);
    scrollToBottom();

    // Animate thinking steps
    await animateThinking(assistantMsg, response);

    // Stream answer text
    const answerEl = assistantMsg.querySelector('.answer-text');
    const fullAnswer = responseType === 'hybrid'
        ? response.knowledgeAnswer + '\n' + response.dataAnswer
        : response.answer;

    await streamText(answerEl, fullAnswer);

    // Show extras (references, SQL, chart, table)
    await showExtras(assistantMsg, response, responseType);

    isProcessing = false;
    document.getElementById('sendBtn').disabled = false;
    scrollToBottom();
}

// ===== DOM Builders =====
function createUserMessage(text) {

function createAssistantMessage(response) {
    const div = document.createElement('div');
    div.className = 'message assistant';
    div.innerHTML = `
        <div class="msg-avatar">贾</div>
        <div class="msg-body">
            <div class="thinking-steps">
                <div class="thinking-header" onclick="toggleThinking(this)">
                    <span class="arrow">▶</span> 思考过程
                </div>

                    ${response.thinking.map((s, i) => `
                        <div class="thinking-step" data-step="${i}">
                            <div class="step-dot"></div>
                            <div>
                                <strong>${s.title}</strong><br>
                                <span style="color:var(--text-secondary);font-size:0.8rem;">${s.desc}</span>
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>
            <div class="msg-bubble">
                <div class="answer-text"></div>
                <div class="extras-container"></div>
            </div>
        </div>
    `;
    return div;
}

function toggleThinking(header) {
    const body = header.nextElementSibling;
    const arrow = header.querySelector('.arrow');
    if (body.style.display === 'none') {
        body.style.display = 'block';
        arrow.classList.add('open');
    } else {
        body.style.display = 'none';
        arrow.classList.remove('open');
    }
}

// ===== Animations =====
async function animateThinking(msgEl, response) {
    const steps = msgEl.querySelectorAll('.thinking-step');
    const body = msgEl.querySelector('.thinking-body');
    const arrow = msgEl.querySelector('.arrow');

    // Auto-open thinking
    body.style.display = 'block';
    arrow.classList.add('open');

    for (let i = 0; i < steps.length; i++) {
        const dot = steps[i].querySelector('.step-dot');
        dot.classList.add('active');
        await sleep(600);
        dot.classList.remove('active');
        dot.classList.add('done');
    }

    // Auto-collapse after done
    await sleep(800);
    body.style.display = 'none';
    arrow.classList.remove('open');
}

async function streamText(el, text) {
    let displayed = '';
    const chars = text.split('');
    const chunkSize = 3;
    for (let i = 0; i < chars.length; i += chunkSize) {
        displayed += chars.slice(i, i + chunkSize).join('');
        el.innerHTML = formatAnswer(displayed);
        scrollToBottom();
        await sleep(30);
    }
}

// ===== Chart Helpers =====
function switchChart(chartId, type) {
    const chartArea = document.getElementById(chartId);
    if (!chartArea) return;
    const bars = chartArea.querySelectorAll('.chart-bar');

    // Update tabs
    const tabs = chartArea.closest('.chart-container').querySelectorAll('.chart-tab');
    tabs.forEach(t => t.classList.remove('active'));
    if (type === 'bar') tabs[0].classList.add('active');
    else tabs[1].classList.add('active');

    if (type === 'bar') {
        bars.forEach(bar => {
            bar.style.height = bar.dataset.height;
            bar.style.borderRadius = '4px 4px 0 0';
            bar.style.background = 'linear-gradient(180deg, #409eff 0%, #79bbff 100%)';
        });
        // Remove canvas
        const canvas = document.getElementById(chartId + '_canvas');
        if (canvas) canvas.style.display = 'none';
    } else {
        bars.forEach(bar => {
            bar.style.height = '3px';
            bar.style.borderRadius = '50%';
            bar.style.background = '#409eff';
        });
        // Draw line
        const canvas = document.getElementById(chartId + '_canvas');
        if (canvas) {
            canvas.style.display = 'block';
        }
    }
}

function drawLineChart(chartId, data, maxVal) {
    const canvas = document.getElementById(chartId + '_canvas');
    if (!canvas) return;
    canvas.width = canvas.offsetWidth * 2;
    canvas.height = canvas.offsetHeight * 2;
    const ctx = canvas.getContext('2d');
    ctx.scale(2, 2);

    const w = canvas.offsetWidth;
    const h = canvas.offsetHeight;
    const padding = { top: 10, bottom: 30, left: 10, right: 10 };
    const plotW = w - padding.left - padding.right;
    const plotH = h - padding.top - padding.bottom;

    ctx.clearRect(0, 0, w, h);
    ctx.beginPath();
    ctx.strokeStyle = '#409eff';
    ctx.lineWidth = 2.5;
    ctx.lineJoin = 'round';

    data.forEach((d, i) => {
        const x = padding.left + (i / (data.length - 1)) * plotW;
        const y = padding.top + plotH - (d.value / maxVal) * plotH * 0.95;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    });
    ctx.stroke();

    // Dots
    data.forEach((d, i) => {
        const x = padding.left + (i / (data.length - 1)) * plotW;
        const y = padding.top + plotH - (d.value / maxVal) * plotH * 0.95;
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#409eff';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x, y, 2, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
    });
}

// ===== Utilities =====
function formatAnswer(text) {
    return text
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/【知识解答】/g, '<strong style="color:#409eff;">【知识解答】</strong>')
        .replace(/【数据分析】/g, '<strong style="color:#67c23a;">【数据分析】</strong>')
        .replace(/根据文档(\d+)/g, '<em style="color:#909399;">根据文档$1</em>')
        .replace(/\n/g, '<br>');
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function scrollToBottom() {
    const chatArea = document.getElementById('chatArea');
    chatArea.scrollTop = chatArea.scrollHeight;
}

function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

// ===== Auto-resize textarea =====
document.getElementById('inputField').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});
</script>
</body>
</html>
