<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>物料损耗数字化管理 · Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a1020;
    --card: #0f1624;
    --card-2: #151f31;
    --border: rgba(148,163,184,0.22);
    --text: #e8edf7;
    --muted: #8b9ab4;
    --primary: #50d7e8;
    --primary-2: #6a8dff;
    --success: #65d89a;
    --warn: #f0b35a;
    --danger: #ff6b6b;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }
  .app { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; background: var(--card);
    border: 1px solid var(--border); border-radius: 16px; margin-bottom: 16px;
  }
  .topbar h1 { font-size: 18px; font-weight: 700; }
  .topbar .user { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
  .topbar .user .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: #071018; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px;
  }
  .tabs {
    display: flex; gap: 4px; background: var(--card);
    border: 1px solid var(--border); border-radius: 16px; padding: 6px; margin-bottom: 16px;
    overflow-x: auto;
  }
  .tab {
    flex: 1; min-width: 80px; padding: 10px 12px; text-align: center;
    color: var(--muted); cursor: pointer; border-radius: 10px;
    transition: all .15s; font-size: 13px; white-space: nowrap;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: #071018; font-weight: 700;
  }
  .tab .badge {
    display: inline-block; margin-left: 4px; padding: 1px 6px;
    background: var(--danger); color: #fff; border-radius: 999px; font-size: 11px;
  }
  .tab.active .badge { background: rgba(7,16,24,0.3); }
  .grid { display: grid; gap: 16px; }
  .grid-2 { grid-template-columns: 1fr 1fr; }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  @media (max-width: 768px) {
    .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
  }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 20px;
  }
  .card-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
  .label { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .value { font-size: 14px; color: var(--text); }
  .input, .select, .textarea {
    width: 100%; background: var(--card-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; color: var(--text); font-size: 14px;
    font-family: inherit; outline: none; transition: border-color .15s;
  }
  .input:focus, .select:focus, .textarea:focus { border-color: var(--primary); }
  .textarea { resize: vertical; min-height: 80px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 10px 18px; border: none; border-radius: 10px; cursor: pointer;
    font-size: 14px; font-weight: 600; font-family: inherit;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: #071018; transition: transform .1s, opacity .15s;
  }
  .btn:hover { opacity: 0.9; }
  .btn:active { transform: scale(0.98); }
  .btn-ghost { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
  .btn-success { background: linear-gradient(135deg, var(--success), var(--primary)); }
  .btn-danger { background: linear-gradient(135deg, var(--danger), var(--warn)); }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn-block { width: 100%; }
  .row { display: flex; align-items: center; gap: 12px; }
  .row-between { display: flex; align-items: center; justify-content: space-between; }
  .mt-12 { margin-top: 12px; } .mt-16 { margin-top: 16px; } .mt-24 { margin-top: 24px; }
  .mb-8 { margin-bottom: 8px; } .mb-16 { margin-bottom: 16px; }
  .tag {
    display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 11px;
  }
  .tag-accepted { background: rgba(101,216,154,0.18); color: var(--success); }
  .tag-pending { background: rgba(240,179,90,0.18); color: var(--warn); }
  .tag-rejected { background: rgba(255,107,107,0.18); color: var(--danger); }
  .tag-exported { background: rgba(80,215,232,0.18); color: var(--primary); }
  .list-item {
    padding: 14px 0; border-bottom: 1px solid rgba(148,163,184,0.12);
  }
  .list-item:last-child { border-bottom: none; }
  .list-item.clickable { cursor: pointer; }
  .list-item.clickable:hover { background: rgba(80,215,232,0.05); }
  .metric { text-align: center; padding: 16px; }
  .metric .num { font-size: 28px; font-weight: 700; }
  .metric .lbl { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .bar-chart { display: flex; flex-direction: column; gap: 10px; }
  .bar-row { display: flex; align-items: center; gap: 12px; font-size: 13px; }
  .bar-row .name { width: 120px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-row .bar-wrap { flex: 1; height: 18px; background: var(--card-2); border-radius: 9px; overflow: hidden; }
  .bar-row .bar { height: 100%; background: linear-gradient(90deg, var(--primary), var(--primary-2)); border-radius: 9px; transition: width .4s; }
  .bar-row .val { width: 80px; text-align: right; color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 13px; }
  .toast {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border);
    padding: 12px 20px; border-radius: 12px; z-index: 1000;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4); animation: slideDown .25s;
  }
  .toast.success { border-color: var(--success); color: var(--success); }
  .toast.error { border-color: var(--danger); color: var(--danger); }
  @keyframes slideDown { from { opacity: 0; transform: translate(-50%,-12px); } to { opacity: 1; transform: translate(-50%,0); } }
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 999;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .modal {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 24px; max-width: 480px; width: 100%; max-height: 80vh; overflow-y: auto;
  }
  .hidden { display: none !important; }
  .login-wrap { max-width: 380px; margin: 80px auto 0; }
  .err-msg { color: var(--danger); font-size: 12px; margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid rgba(148,163,184,0.12); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  td { color: var(--text); }
  .scan-input { display: flex; gap: 8px; }
  .scan-input .input { flex: 1; }
  .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; margin-top: 8px; }
  .photo-grid .photo {
    aspect-ratio: 1; background: var(--card-2); border-radius: 8px;
    display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 11px;
    border: 1px dashed var(--border);
  }
  .help { color: var(--muted); font-size: 12px; line-height: 1.6; }
  .pill-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { padding: 6px 12px; border-radius: 999px; background: var(--card-2); color: var(--muted); cursor: pointer; font-size: 12px; border: 1px solid transparent; }
  .pill.active { background: rgba(80,215,232,0.15); color: var(--primary); border-color: var(--primary); }
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="modal-root"></div>

<script>
/* ============== Mock 数据 ============== */
const ROLES = {
  submitter: { name: "填报人", perms: ["submit","lookup","dashboard"] },
  approver:  { name: "审批人", perms: ["submit","lookup","dashboard","approve","export"] },
  administrator: { name: "管理员", perms: ["submit","lookup","dashboard","approve","export","import","manage"] },
  finance:   { name: "财务", perms: ["dashboard","export"] },
};

const USERS = {
  admin:    { password: "admin123", name: "系统管理员", roles: ["administrator","approver","finance"] },
  submitter01: { password: "sub123", name: "张三", roles: ["submitter"] },
  approver01:  { password: "app123", name: "李主管", roles: ["approver"] },
  finance01:   { password: "fin123", name: "王财务", roles: ["finance"] },
};

const MATERIALS = [
  { materialNumber: "M001", materialName: "M6 不锈钢螺丝", unit: "个", standardLossRate: 0.01, approvalThreshold: 10, movingAveragePrice: 0.5, active: true },
  { materialNumber: "M002", materialName: "Q235 钢板", unit: "kg", standardLossRate: 0.02, approvalThreshold: 50, movingAveragePrice: 12.8, active: true },
  { materialNumber: "M003", materialName: "6mm 铜导线", unit: "m", standardLossRate: 0.005, approvalThreshold: 20, movingAveragePrice: 3.2, active: true },
  { materialNumber: "M004", materialName: "环氧树脂胶", unit: "支", standardLossRate: 0.02, approvalThreshold: 5, movingAveragePrice: 18.5, active: true },
  { materialNumber: "M005", materialName: "包装纸箱", unit: "个", standardLossRate: 0.01, approvalThreshold: 30, movingAveragePrice: 2.5, active: false },
];

let LOSS_RECORDS = [
  { id: "R001", materialNumber: "M001", materialName: "M6 不锈钢螺丝", unitSnapshot: "个", price: 0.5, businessType: "normal_loss", quantity: 8, reason: "装配损耗", remark: "", status: "accepted", overThreshold: false, submitter: "张三", submittedAt: "2026-07-01 09:12", approver: null, decision: null, comment: null, decidedAt: null },
  { id: "R002", materialNumber: "M002", materialName: "Q235 钢板", unitSnapshot: "kg", price: 12.8, businessType: "abnormal_loss", quantity: 65, reason: "切割尺寸偏差", remark: "需改进工艺", status: "accepted", overThreshold: true, submitter: "张三", submittedAt: "2026-07-02 14:30", approver: "李主管", decision: "approved", comment: "已确认，工艺组跟进", decidedAt: "2026-07-02 16:45" },
  { id: "R003", materialNumber: "M003", materialName: "6mm 铜导线", unitSnapshot: "m", price: 3.2, businessType: "scrap", quantity: 25, reason: "外皮破损无法使用", remark: "", status: "pending_approval", overThreshold: true, submitter: "张三", submittedAt: "2026-07-03 10:00", approver: null, decision: null, comment: null, decidedAt: null },
  { id: "R004", materialNumber: "M004", materialName: "环氧树脂胶", unitSnapshot: "支", price: 18.5, businessType: "abnormal_loss", quantity: 3, reason: "过期变质", remark: "库存管理疏忽", status: "accepted", overThreshold: false, submitter: "张三", submittedAt: "2026-07-03 11:20", approver: null, decision: null, comment: null, decidedAt: null },
  { id: "R005", materialNumber: "M002", materialName: "Q235 钢板", unitSnapshot: "kg", price: 12.8, businessType: "normal_loss", quantity: 30, reason: "切口余料", remark: "", status: "rejected", overThreshold: false, submitter: "张三", submittedAt: "2026-07-04 09:30", approver: "李主管", decision: "rejected", comment: "属于可回收余料，不计损耗", decidedAt: "2026-07-04 10:15" },
  { id: "R006", materialNumber: "M001", materialName: "M6 不锈钢螺丝", unitSnapshot: "个", price: 0.5, businessType: "return", quantity: 50, reason: "型号不符退货", remark: "", status: "accepted", overThreshold: true, submitter: "张三", submittedAt: "2026-07-04 15:00", approver: "李主管", decision: "approved", comment: "同意退回供应商", decidedAt: "2026-07-04 16:00" },
  { id: "R007", materialNumber: "M003", materialName: "6mm 铜导线", unitSnapshot: "m", price: 3.2, businessType: "normal_loss", quantity: 5, reason: "接头修剪", remark: "", status: "accepted", overThreshold: false, submitter: "张三", submittedAt: "2026-07-05 08:40", approver: null, decision: null, comment: null, decidedAt: null },
];

const BUSINESS_TYPES = [
  { value: "normal_loss", label: "正常损耗" },
  { value: "abnormal_loss", label: "异常损耗" },
  { value: "scrap", label: "报废" },
  { value: "return", label: "退料" },
];

const STATUS_LABEL = { accepted: "已接受", pending_approval: "待审批", approved: "已通过", rejected: "已拒绝", exported: "已导出" };

/* ============== 状态 ============== */
let state = {
  view: "login",
  user: null,
  scanResult: null,
  activeTab: "scan",
  filterFrom: "2026-07-01",
  filterTo: "2026-07-31",
  approvalsFilter: "pending",
  exportType: "detail",
  exportGroupBy: "material",
  pendingApprovalId: null,
  photos: [],
  exportJobs: [
    { id: "E001", type: "detail", status: "success", dateFrom: "2026-06-01", dateTo: "2026-06-30", requestedBy: "王财务", requestedAt: "2026-07-01 09:00", fileSizeBytes: 24580 },
  ],
};

/* ============== 工具 ============== */
function $(sel) { return document.querySelector(sel); }
function el(tag, props = {}, children = []) {
  const e = document.createElement(tag);
  Object.entries(props).forEach(([k,v]) => {
    if (k === "class") e.className = v;
    else if (k === "onclick") e.onclick = v;
    else if (k === "style") e.setAttribute("style", v);
    else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k, v);
  });
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c == null || c === false) return;
    e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return e;
}
function toast(msg, type = "") {
  const t = el("div", { class: `toast ${type}` }, msg);
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}
function hasPerm(perm) {
  if (!state.user) return false;
  return state.user.roles.some(r => ROLES[r].perms.includes(perm));
}
function fmt(n, d = 2) { return Number(n).toFixed(d); }

/* ============== 渲染 ============== */
function render() {
  const app = $("#app");
  app.innerHTML = "";
  if (state.view === "login") { app.appendChild(renderLogin()); return; }
  app.appendChild(renderTopbar());
  app.appendChild(renderTabs());
  const main = el("div");
  if (state.activeTab === "scan") main.appendChild(renderScan());
  else if (state.activeTab === "dashboard") main.appendChild(renderDashboard());
  else if (state.activeTab === "approvals") main.appendChild(renderApprovals());
  else if (state.activeTab === "exports") main.appendChild(renderExports());
  else if (state.activeTab === "materials") main.appendChild(renderMaterials());
  app.appendChild(main);
}

function renderLogin() {
  const wrap = el("div", { class: "card login-wrap" });
  wrap.appendChild(el("div", { class: "card-title" }, "物料损耗管理 · 登录"));
  wrap.appendChild(el("div", { class: "label" }, "用户名"));
  const userIn = el("input", { class: "input", placeholder: "admin / submitter01 / approver01 / finance01" });
  wrap.appendChild(userIn);
  wrap.appendChild(el("div", { class: "label mt-16" }, "密码"));
  const pwdIn = el("input", { class: "input", type: "password", placeholder: "admin123 / sub123 / app123 / fin123" });
  wrap.appendChild(pwdIn);
  const errBox = el("div", { class: "err-msg" });
  wrap.appendChild(errBox);
  const btn = el("button", { class: "btn btn-block mt-24" }, "登录");
  btn.onclick = () => {
    const u = USERS[userIn.value.trim()];
    if (!u || u.password !== pwdIn.value) {
      errBox.textContent = "用户名或密码错误";
      return;
    }
    state.user = { username: userIn.value.trim(), name: u.name, roles: u.roles };
    state.view = "app";
    state.activeTab = "scan";
    render();
    toast(`欢迎，${u.name}`, "success");
  };
  wrap.appendChild(btn);
  wrap.appendChild(el("div", { class: "help mt-16" }, "Demo 账号：admin/admin123（管理员）、submitter01/sub123（填报人）、approver01/app123（审批人）、finance01/fin123（财务）"));
  return wrap;
}

function renderTopbar() {
  const bar = el("div", { class: "topbar" });
  bar.appendChild(el("h1", {}, "物料损耗数字化管理"));
  const right = el("div", { class: "user" });
  const roleText = state.user.roles.map(r => ROLES[r].name).join(" / ");
  right.appendChild(el("span", {}, `${state.user.name} · ${roleText}`));
  const av = el("div", { class: "avatar" }, state.user.name.slice(0,1));
  right.appendChild(av);
  const logout = el("button", { class: "btn btn-sm btn-ghost" }, "退出");
  logout.onclick = () => { state.user = null; state.view = "login"; render(); };
  right.appendChild(logout);
  bar.appendChild(right);
  return bar;
}

function renderTabs() {
  const tabs = el("div", { class: "tabs" });
  const pendingCount = LOSS_RECORDS.filter(r => r.status === "pending_approval").length;
  const items = [
    { id: "scan", label: "填报", perm: "submit" },
    { id: "dashboard", label: "看板", perm: "dashboard" },
    { id: "approvals", label: "审批", perm: "approve", badge: pendingCount },
    { id: "exports", label: "导出", perm: "export" },
    { id: "materials", label: "物料", perm: "import" },
  ];
  items.forEach(it => {
    if (it.perm && !hasPerm(it.perm)) return;
    const t = el("div", { class: `tab ${state.activeTab === it.id ? "active" : ""}` });
    t.appendChild(document.createTextNode(it.label));
    if (it.badge) t.appendChild(el("span", { class: "badge" }, String(it.badge)));
    t.onclick = () => { state.activeTab = it.id; render(); };
    tabs.appendChild(t);
  });
  return tabs;
}

/* ----- 扫码填报页 ----- */
function renderScan() {
  const wrap = el("div", { class: "grid grid-2" });
  // 左：扫码识别
  const left = el("div", { class: "card" });
  left.appendChild(el("div", { class: "card-title" }, "扫码识别物料"));
  const scanRow = el("div", { class: "scan-input" });
  const input = el("input", { class: "input", placeholder: "扫码或输入物料号（如 M001）" });
  scanRow.appendChild(input);
  const scanBtn = el("button", { class: "btn btn-sm" }, "扫码");
  scanBtn.onclick = () => {
    // 模拟扫码：随机取一个启用物料
    const m = MATERIALS.filter(x => x.active)[Math.floor(Math.random() * MATERIALS.filter(x => x.active).length)];
    input.value = m.materialNumber;
    doLookup(m.materialNumber);
  };
  scanRow.appendChild(scanBtn);
  left.appendChild(scanRow);
  const lookupBtn = el("button", { class: "btn btn-ghost btn-sm mt-12 btn-block" }, "查询物料");
  lookupBtn.onclick = () => doLookup(input.value.trim());
  left.appendChild(lookupBtn);
  const resultBox = el("div", { class: "mt-16" });
  left.appendChild(resultBox);
  if (state.scanResult) {
    if (!state.scanResult.found) {
      resultBox.appendChild(el("div", { class: "err-msg" }, state.scanResult.reason === "inactive" ? "物料已停用，无法提交" : "物料不存在，无法提交"));
    } else {
      const m = state.scanResult.material;
      resultBox.appendChild(rowItem("物料名称", m.materialName));
      resultBox.appendChild(rowItem("物料号", m.materialNumber));
      resultBox.appendChild(rowItem("单位", m.unit));
      resultBox.appendChild(rowItem("审批阈值", m.approvalThreshold));
      resultBox.appendChild(rowItem("移动加权平均价", "¥" + m.movingAveragePrice));
    }
  }
  wrap.appendChild(left);

  // 右：填报表单
  const right = el("div", { class: "card" });
  right.appendChild(el("div", { class: "card-title" }, "填报信息"));
  const canSubmit = state.scanResult && state.scanResult.found;

  right.appendChild(el("div", { class: "label" }, "业务类型"));
  const btSel = el("select", { class: "select" });
  BUSINESS_TYPES.forEach(b => btSel.appendChild(el("option", { value: b.value }, b.label)));
  right.appendChild(btSel);

  right.appendChild(el("div", { class: "label mt-16" }, `数量（${state.scanResult?.found ? state.scanResult.material.unit : ""}）`));
  const qtyIn = el("input", { class: "input", type: "number", placeholder: "请输入大于 0 的数量" });
  right.appendChild(qtyIn);

  right.appendChild(el("div", { class: "label mt-16" }, "原因"));
  const reasonIn = el("input", { class: "input", placeholder: "请填写损耗原因" });
  right.appendChild(reasonIn);

  right.appendChild(el("div", { class: "label mt-16" }, "备注（选填）"));
  const remarkIn = el("textarea", { class: "textarea", placeholder: "补充说明" });
  right.appendChild(remarkIn);

  // 业务类型变化时显示照片上传
  const photoBox = el("div", { class: "mt-16 hidden" });
  btSel.onchange = () => {
    const need = ["abnormal_loss","scrap"].includes(btSel.value);
    photoBox.classList.toggle("hidden", !need);
  };
  photoBox.appendChild(el("div", { class: "label" }, "照片证据（异常损耗/报废必传）"));
  const photoGrid = el("div", { class: "photo-grid" });
  const uploadBtn = el("button", { class: "btn btn-ghost btn-sm" }, "+ 添加照片");
  uploadBtn.onclick = () => {
    state.photos.push(`photo_${Date.now()}.jpg`);
    renderPhotoGrid();
  };
  function renderPhotoGrid() {
    photoGrid.innerHTML = "";
    state.photos.forEach((p, i) => {
      const ph = el("div", { class: "photo" }, "📷 " + p);
      const del = el("span", { style: "color:var(--danger);margin-left:6px;cursor:pointer;" }, "×");
      del.onclick = () => { state.photos.splice(i, 1); renderPhotoGrid(); };
      ph.appendChild(del);
      photoGrid.appendChild(ph);
    });
  }
  photoBox.appendChild(uploadBtn);
  photoBox.appendChild(photoGrid);
  right.appendChild(photoBox);

  const errBox = el("div", { class: "err-msg mt-12" });
  right.appendChild(errBox);

  const submitBtn = el("button", { class: "btn btn-block mt-16" }, "提交损耗记录");
  submitBtn.disabled = !canSubmit;
  if (!canSubmit) submitBtn.style.opacity = "0.5";
  submitBtn.onclick = () => {
    errBox.textContent = "";
    const m = state.scanResult.material;
    const qty = Number(qtyIn.value);
    if (!Number.isFinite(qty) || qty <= 0) { errBox.textContent = "数量必须大于 0"; return; }
    if (!reasonIn.value.trim()) { errBox.textContent = "请填写原因"; return; }
    const over = qty > m.approvalThreshold;
    const newRec = {
      id: "R" + String(LOSS_RECORDS.length + 1).padStart(3, "0"),
      materialNumber: m.materialNumber,
      materialName: m.materialName,
      unitSnapshot: m.unit,
      price: m.movingAveragePrice,
      businessType: btSel.value,
      quantity: qty,
      reason: reasonIn.value.trim(),
      remark: remarkIn.value.trim(),
      status: over ? "pending_approval" : "accepted",
      overThreshold: over,
      submitter: state.user.name,
      submittedAt: new Date().toISOString().slice(0,16).replace("T"," "),
      approver: null, decision: null, comment: null, decidedAt: null,
    };
    LOSS_RECORDS.push(newRec);
    toast(`提交成功，状态：${STATUS_LABEL[newRec.status]}${over ? "（超阈值）" : ""}`, "success");
    state.scanResult = null;
    state.photos = [];
    render();
  };
  right.appendChild(submitBtn);
  wrap.appendChild(right);
  return wrap;
}

function doLookup(num) {
  if (!num) { state.scanResult = null; render(); return; }
  const m = MATERIALS.find(x => x.materialNumber === num);
  if (!m) state.scanResult = { found: false, reason: "not_found" };
  else if (!m.active) state.scanResult = { found: false, reason: "inactive" };
  else state.scanResult = { found: true, material: m };
  render();
}

function rowItem(label, value) {
  const r = el("div", { class: "list-item" });
  r.appendChild(el("div", { class: "label" }, label));
  r.appendChild(el("div", { class: "value" }, String(value)));
  return r;
}

/* ----- 看板页 ----- */
function renderDashboard() {
  const wrap = el("div", {});
  // 筛选
  const filterCard = el("div", { class: "card mb-16" });
  filterCard.appendChild(el("div", { class: "card-title" }, "统计区间"));
  const row = el("div", { class: "row" });
  row.appendChild(el("span", { class: "label" }, "从"));
  const fromIn = el("input", { class: "input", type: "date", value: state.filterFrom });
  row.appendChild(fromIn);
  row.appendChild(el("span", { class: "label" }, "至"));
  const toIn = el("input", { class: "input", type: "date", value: state.filterTo });
  row.appendChild(toIn);
  const refreshBtn = el("button", { class: "btn btn-ghost btn-sm" }, "刷新");
  refreshBtn.onclick = () => {
    state.filterFrom = fromIn.value;
    state.filterTo = toIn.value;
    render();
  };
  row.appendChild(refreshBtn);
  filterCard.appendChild(row);
  wrap.appendChild(filterCard);

  // 指标
  const inRange = LOSS_RECORDS.filter(r => r.submittedAt.slice(0,10) >= state.filterFrom && r.submittedAt.slice(0,10) <= state.filterTo);
  const accepted = inRange.filter(r => ["accepted","approved","exported"].includes(r.status));
  const rejected = inRange.filter(r => r.status === "rejected");
  const overCnt = inRange.filter(r => r.overThreshold).length;
  const acceptedQty = accepted.reduce((s,r) => s + r.quantity, 0);
  const acceptedCost = accepted.reduce((s,r) => s + r.quantity * r.price, 0);
  const rejectedQty = rejected.reduce((s,r) => s + r.quantity, 0);
  const rejectedCost = rejected.reduce((s,r) => s + r.quantity * r.price, 0);

  const metricGrid = el("div", { class: "grid grid-4 mb-16" });
  metricGrid.appendChild(metricCard(fmt(acceptedQty, 1), "接受总量"));
  metricGrid.appendChild(metricCard("¥" + fmt(acceptedCost), "接受总成本"));
  metricGrid.appendChild(metricCard(String(overCnt), "超阈值记录", "var(--warn)"));
  metricGrid.appendChild(metricCard(String(rejected.length), "已拒绝记录", "var(--danger)"));
  wrap.appendChild(metricGrid);

  // 物料排行
  const rankCard = el("div", { class: "card" });
  rankCard.appendChild(el("div", { class: "card-title" }, "物料排行 Top 10（按接受总量）"));
  const byMaterial = {};
  accepted.forEach(r => {
    if (!byMaterial[r.materialName]) byMaterial[r.materialName] = { qty: 0, cost: 0, count: 0 };
    byMaterial[r.materialName].qty += r.quantity;
    byMaterial[r.materialName].cost += r.quantity * r.price;
    byMaterial[r.materialName].count += 1;
  });
  const ranks = Object.entries(byMaterial).sort((a,b) => b[1].qty - a[1].qty).slice(0,10);
  if (ranks.length === 0) {
    rankCard.appendChild(el("div", { class: "empty" }, "区间内无数据"));
  } else {
    const max = ranks[0][1].qty || 1;
    const chart = el("div", { class: "bar-chart" });
    ranks.forEach(([name, v]) => {
      const br = el("div", { class: "bar-row" });
      br.appendChild(el("div", { class: "name", title: name }, name));
      const bw = el("div", { class: "bar-wrap" });
      bw.appendChild(el("div", { class: "bar", style: `width:${(v.qty/max*100).toFixed(1)}%` }));
      br.appendChild(bw);
      br.appendChild(el("div", { class: "val" }, `${fmt(v.qty,1)} · ¥${fmt(v.cost)} · ${v.count}条`));
      chart.appendChild(br);
    });
    rankCard.appendChild(chart);
  }
  wrap.appendChild(rankCard);
  return wrap;
}

function metricCard(num, lbl, color) {
  const m = el("div", { class: "card metric" });
  const n = el("div", { class: "num" }, num);
  if (color) n.style.color = color;
  m.appendChild(n);
  m.appendChild(el("div", { class: "lbl" }, lbl));
  return m;
}

/* ----- 审批页 ----- */
function renderApprovals() {
  const wrap = el("div", {});
  const pending = LOSS_RECORDS.filter(r => r.status === "pending_approval");
  const card = el("div", { class: "card" });
  card.appendChild(el("div", { class: "card-title" }, `待审批列表（${pending.length}）`));
  if (pending.length === 0) {
    card.appendChild(el("div", { class: "empty" }, "暂无待审批记录"));
  } else {
    pending.forEach(r => {
      const item = el("div", { class: "list-item clickable" });
      const top = el("div", { class: "row-between mb-8" });
      top.appendChild(el("span", { class: "value" }, r.materialName));
      top.appendChild(el("span", { class: "tag tag-pending" }, "待审批"));
      item.appendChild(top);
      item.appendChild(el("div", { class: "help" }, `${r.materialNumber} · ${businessLabel(r.businessType)} · 数量 ${r.quantity} ${r.unitSnapshot}`));
      item.appendChild(el("div", { class: "help mt-12" }, `提交人：${r.submitter} · 阈值 ${getThreshold(r.materialNumber)} · ¥${r.price}`));
      item.appendChild(el("div", { class: "help" }, `原因：${r.reason}${r.remark ? "（" + r.remark + "）" : ""}`));
      const btns = el("div", { class: "row mt-12" });
      const ok = el("button", { class: "btn btn-success btn-sm" }, "通过");
      ok.onclick = (e) => { e.stopPropagation(); openApprovalModal(r.id, "approved"); };
      const no = el("button", { class: "btn btn-danger btn-sm" }, "拒绝");
      no.onclick = (e) => { e.stopPropagation(); openApprovalModal(r.id, "rejected"); };
      btns.appendChild(ok); btns.appendChild(no);
      item.appendChild(btns);
      card.appendChild(item);
    });
  }
  wrap.appendChild(card);

  // 历史
  const histCard = el("div", { class: "card mt-16" });
  histCard.appendChild(el("div", { class: "card-title" }, "审批历史（已处理）"));
  const hist = LOSS_RECORDS.filter(r => r.decision);
  if (hist.length === 0) histCard.appendChild(el("div", { class: "empty" }, "暂无历史"));
  else {
    const tbl = el("table");
    tbl.appendChild(el("thead", {}, el("tr", {}, ["记录号","物料","数量","决策","审批人","时间","意见"].map(h => el("th", {}, h)))));
    const tb = el("tbody");
    hist.forEach(r => {
      const tr = el("tr");
      [r.id, r.materialName, r.quantity + r.unitSnapshot, r.decision === "approved" ? "通过" : "拒绝", r.approver, r.decidedAt, r.comment || "-"].forEach(v => {
        const td = el("td", {}, String(v));
        if (v === "通过") td.style.color = "var(--success)";
        if (v === "拒绝") td.style.color = "var(--danger)";
        tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
    tbl.appendChild(tb);
    histCard.appendChild(tbl);
  }
  wrap.appendChild(histCard);
  return wrap;
}

function openApprovalModal(recordId, decision) {
  const r = LOSS_RECORDS.find(x => x.id === recordId);
  const mask = el("div", { class: "modal-mask" });
  const modal = el("div", { class: "modal" });
  modal.appendChild(el("div", { class: "card-title" }, `${decision === "approved" ? "通过" : "拒绝"}：${r.materialName}`));
  modal.appendChild(el("div", { class: "help" }, `数量 ${r.quantity} ${r.unitSnapshot}（阈值 ${getThreshold(r.materialNumber)}）`));
  modal.appendChild(el("div", { class: "label mt-16" }, "审批意见"));
  const ta = el("textarea", { class: "textarea", placeholder: "可选填写审批意见" });
  modal.appendChild(ta);
  const btns = el("div", { class: "row mt-16" });
  const cancel = el("button", { class: "btn btn-ghost btn-sm" }, "取消");
  cancel.onclick = () => mask.remove();
  const ok = el("button", { class: `btn ${decision === "approved" ? "btn-success" : "btn-danger"} btn-sm` }, "确认");
  ok.onclick = () => {
    r.status = decision === "approved" ? "accepted" : "rejected";
    r.decision = decision;
    r.approver = state.user.name;
    r.comment = ta.value.trim() || null;
    r.decidedAt = new Date().toISOString().slice(0,16).replace("T"," ");
    mask.remove();
    toast(`已${decision === "approved" ? "通过" : "拒绝"}`, "success");
    render();
  };
  btns.appendChild(cancel); btns.appendChild(ok);
  modal.appendChild(btns);
  mask.appendChild(modal);
  mask.onclick = (e) => { if (e.target === mask) mask.remove(); };
  $("#modal-root").appendChild(mask);
}

function businessLabel(v) { return BUSINESS_TYPES.find(b => b.value === v)?.label || v; }
function getThreshold(num) { return MATERIALS.find(m => m.materialNumber === num)?.approvalThreshold || "-"; }

/* ----- 导出页 ----- */
function renderExports() {
  const wrap = el("div", {});
  const card = el("div", { class: "card mb-16" });
  card.appendChild(el("div", { class: "card-title" }, "新建导出"));
  card.appendChild(el("div", { class: "label" }, "报表类型"));
  const typePills = el("div", { class: "pill-group mt-12" });
  [{ v: "detail", l: "明细报表" }, { v: "summary", l: "汇总报表" }].forEach(t => {
    const p = el("div", { class: `pill ${state.exportType === t.v ? "active" : ""}` }, t.l);
    p.onclick = () => { state.exportType = t.v; render(); };
    typePills.appendChild(p);
  });
  card.appendChild(typePills);
  card.appendChild(el("div", { class: "label mt-16" }, "日期范围"));
  const dr = el("div", { class: "row" });
  const from = el("input", { class: "input", type: "date", value: state.filterFrom });
  const to = el("input", { class: "input", type: "date", value: state.filterTo });
  dr.appendChild(from); dr.appendChild(el("span", { class: "label" }, "至")); dr.appendChild(to);
  card.appendChild(dr);
  if (state.exportType === "summary") {
    card.appendChild(el("div", { class: "label mt-16" }, "分组维度"));
    const gp = el("div", { class: "pill-group mt-12" });
    [{v:"material",l:"按物料"},{v:"business_type",l:"按业务类型"},{v:"reason",l:"按原因"},{v:"time",l:"按日期"}].forEach(g => {
      const p = el("div", { class: `pill ${state.exportGroupBy === g.v ? "active" : ""}` }, g.l);
      p.onclick = () => { state.exportGroupBy = g.v; render(); };
      gp.appendChild(p);
    });
    card.appendChild(gp);
  }
  const genBtn = el("button", { class: "btn btn-block mt-16" }, "生成报表");
  genBtn.onclick = () => {
    const inRange = LOSS_RECORDS.filter(r => r.submittedAt.slice(0,10) >= from.value && r.submittedAt.slice(0,10) <= to.value);
    let csv = "", fname = "";
    if (state.exportType === "detail") {
      fname = `detail-${Date.now()}.csv`;
      csv = "记录号,提交时间,物料号,物料名称,单位快照,移动均价快照,业务类型,数量,成本,原因,状态,超阈值,提交人,审批人,决策\n";
      inRange.forEach(r => {
        csv += [r.id, r.submittedAt, r.materialNumber, r.materialName, r.unitSnapshot, r.price, r.businessType, r.quantity, (r.quantity*r.price).toFixed(4), r.reason, r.status, r.overThreshold?1:0, r.submitter, r.approver||"", r.decision||""].join(",") + "\n";
      });
    } else {
      fname = `summary-${Date.now()}.csv`;
      const groups = {};
      inRange.filter(r => ["accepted","approved","exported"].includes(r.status)).forEach(r => {
        const key = state.exportGroupBy === "material" ? r.materialName : state.exportGroupBy === "business_type" ? r.businessType : state.exportGroupBy === "reason" ? r.reason : r.submittedAt.slice(0,10);
        if (!groups[key]) groups[key] = { qty: 0, cost: 0, count: 0 };
        groups[key].qty += r.quantity;
        groups[key].cost += r.quantity * r.price;
        groups[key].count += 1;
      });
      csv = "分组,标签,接受数量,接受成本,记录数\n";
      Object.entries(groups).forEach(([k,v]) => {
        csv += [k,k,v.qty.toFixed(4),v.cost.toFixed(4),v.count].join(",") + "\n";
      });
    }
    const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = el("a", { href: url, download: fname });
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    state.exportJobs.unshift({
      id: "E" + String(state.exportJobs.length + 1).padStart(3,"0"),
      type: state.exportType, status: "success",
      dateFrom: from.value, dateTo: to.value,
      requestedBy: state.user.name, requestedAt: new Date().toISOString().slice(0,16).replace("T"," "),
      fileSizeBytes: blob.size,
    });
    toast(`导出完成，共 ${inRange.length} 条记录`, "success");
    render();
  };
  card.appendChild(genBtn);
  wrap.appendChild(card);

  // 历史
  const hist = el("div", { class: "card" });
  hist.appendChild(el("div", { class: "card-title" }, "历史导出任务"));
  if (state.exportJobs.length === 0) hist.appendChild(el("div", { class: "empty" }, "暂无"));
  else {
    state.exportJobs.forEach(j => {
      const item = el("div", { class: "list-item" });
      const top = el("div", { class: "row-between mb-8" });
      top.appendChild(el("span", { class: "value" }, `${j.type === "detail" ? "明细" : "汇总"} · ${j.dateFrom} ~ ${j.dateTo}`));
      top.appendChild(el("span", { class: `tag tag-${j.status === "success" ? "accepted" : j.status === "failed" ? "rejected" : "pending"}` }, j.status === "success" ? "成功" : j.status === "failed" ? "失败" : "处理中"));
      item.appendChild(top);
      item.appendChild(el("div", { class: "help" }, `${j.requestedBy} · ${j.requestedAt}${j.fileSizeBytes ? " · " + (j.fileSizeBytes/1024).toFixed(1) + "KB" : ""}`));
      hist.appendChild(item);
    });
  }
  wrap.appendChild(hist);
  return wrap;
}

/* ----- 物料页 ----- */
function renderMaterials() {
  const wrap = el("div", {});
  // 导入卡
  const importCard = el("div", { class: "card mb-16" });
  importCard.appendChild(el("div", { class: "card-title" }, "物料主数据导入"));
  importCard.appendChild(el("div", { class: "help" }, "CSV 表头：materialNumber,materialName,unit,standardLossRate,approvalThreshold,movingAveragePrice,active"));
  const ta = el("textarea", { class: "textarea mt-12", style: "min-height:120px;", placeholder: "M001,M6 不锈钢螺丝,个,0.01,10,0.5,true\nM002,Q235 钢板,kg,0.02,50,12.8,true" });
  importCard.appendChild(ta);
  const btnRow = el("div", { class: "row mt-12" });
  const dryBtn = el("button", { class: "btn btn-ghost btn-sm" }, "仅校验");
  const impBtn = el("button", { class: "btn btn-sm" }, "导入");
  dryBtn.onclick = () => doImport(ta.value, true);
  impBtn.onclick = () => doImport(ta.value, false);
  btnRow.appendChild(dryBtn); btnRow.appendChild(impBtn);
  importCard.appendChild(btnRow);
  wrap.appendChild(importCard);

  // 列表
  const listCard = el("div", { class: "card" });
  listCard.appendChild(el("div", { class: "card-title" }, `物料列表（${MATERIALS.length}）`));

  tbl.appendChild(el("thead", {}, el("tr", {}, ["物料号","名称","单位","标准损耗率","审批阈值","移动均价","状态"].map(h => el("th", {}, h)))));
  const tb = el("tbody");
  MATERIALS.forEach(m => {
    const tr = el("tr");
    [m.materialNumber, m.materialName, m.unit, m.standardLossRate, m.approvalThreshold, "¥" + m.movingAveragePrice].forEach(v => tr.appendChild(el("td", {}, String(v))));
    const stTd = el("td");
    stTd.appendChild(el("span", { class: `tag tag-${m.active ? "accepted" : "rejected"}` }, m.active ? "启用" : "停用"));
    tr.appendChild(stTd);
    tb.appendChild(tr);
  });
  tbl.appendChild(tb);
  listCard.appendChild(tbl);
  wrap.appendChild(listCard);
  return wrap;
}

function doImport(text, dryRun) {
  const lines = text.trim().split("\n").filter(l => l.trim());
  if (lines.length === 0) { toast("请粘贴 CSV 内容", "error"); return; }
  let inserted = 0, updated = 0, failed = 0;
  const errors = [];
  lines.forEach((line, idx) => {
    const parts = line.split(",").map(s => s.trim());
    if (parts.length < 6) { errors.push(`第 ${idx+1} 行：字段不足`); failed++; return; }
    const [num, name, unit, slr, thr, price, active] = parts;
    if (!num || !name || !unit) { errors.push(`第 ${idx+1} 行：物料号/名称/单位必填`); failed++; return; }
    if (Number(thr) < 0 || Number(price) < 0) { errors.push(`第 ${idx+1} 行：阈值/价格不能为负`); failed++; return; }
    if (dryRun) return;
    const exist = MATERIALS.find(m => m.materialNumber === num);
    const data = {
      materialNumber: num, materialName: name, unit,
      standardLossRate: Number(slr), approvalThreshold: Number(thr),
      movingAveragePrice: Number(price),
      active: active === undefined ? true : ["true","1","yes","是"].includes(active.toLowerCase()),
    };
    if (exist) { Object.assign(exist, data); updated++; }
    else { MATERIALS.push(data); inserted++; }
  });
  if (dryRun) {
    toast(`校验完成：${lines.length} 行${failed > 0 ? "，失败 " + failed + " 行" : ""}`, failed > 0 ? "error" : "success");
  } else {
    toast(`导入完成：新增 ${inserted} · 更新 ${updated} · 失败 ${failed}`, failed > 0 ? "error" : "success");
    render();
  }
  if (errors.length > 0) console.log("导入错误：\n" + errors.join("\n"));
}

/* ============== 启动 ============== */
render();
