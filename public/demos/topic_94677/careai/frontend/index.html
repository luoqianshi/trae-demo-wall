              <span style=${{ display: "inline-block", width: 18, height: 18, lineHeight: "18px", borderRadius: "50%", background: step.active ? "rgba(255,255,255,0.25)" : "#e0e0e0", color: step.active ? "#fff" : "#999", fontSize: "0.7rem", fontWeight: 700 }}>${step.n}</span>
              <span style=${{ fontWeight: step.active ? 600 : 400 }}>${step.label}</span>
            </div>
          `;
        })}
      </div>

      ${/* Main two-column layout */ ""}
      <div style=${{ display: "flex", gap: 16, alignItems: "flex-start" }}>
        ${/* Left: settings panel (steps 1-3) */ ""}
        <div style=${{ width: 320, flexShrink: 0, display: "flex", flexDirection: "column", gap: 12 }}>

          ${/* Card 1: Camera selection */ ""}
          <div style=${{ padding: 14, background: "#fff", borderRadius: 8, border: "1px solid var(--rule)" }}>
            <div style=${{ fontSize: "0.85rem", fontWeight: 700, marginBottom: 8, display: "flex", alignItems: "center", gap: 8 }}>
              <span style=${{ width: 20, height: 20, lineHeight: "20px", textAlign: "center", background: "var(--accent)", color: "#fff", borderRadius: "50%", fontSize: "0.7rem" }}>1</span>
              选择摄像头
            </div>
            <select value=${selectedCam || ""} onInput=${function(e){setSelectedCam(parseInt(e.target.value))}} style=${{ width: "100%", padding: "8px 12px", border: "1px solid var(--rule)", borderRadius: 4, fontSize: "0.9rem" }}>
              ${cameras ? cameras.map(function(c) { return html`<option key=${c.id} value=${c.id}>${c.name}</option>`; }) : null}
            </select>
            <div style=${{ marginTop: 8 }}>
              <label style=${{ display: "block", fontSize: "0.75rem", color: "var(--muted)", marginBottom: 4 }}>导入到数据集</label>
              <select value=${selectedDs} onChange=${function(e){setSelectedDs(e.target.value)}} style=${{ width: "100%", padding: "6px 10px", border: "1px solid var(--rule)", borderRadius: 4, fontSize: "0.85rem" }}>
                <option value="auto">自动（使用摄像头对应数据集）</option>
                ${datasets.map(function(ds) { return html`<option key=${ds.id} value=${ds.id}>${ds.name}</option>`; })}
              </select>
            </div>
          </div>

          ${/* Card 2: Strategy */ ""}
          <div style=${{ padding: 14, background: "#fff", borderRadius: 8, border: "1px solid var(--rule)" }}>
            <div style=${{ fontSize: "0.85rem", fontWeight: 700, marginBottom: 8, display: "flex", alignItems: "center", gap: 8 }}>
              <span style=${{ width: 20, height: 20, lineHeight: "20px", textAlign: "center", background: "var(--accent)", color: "#fff", borderRadius: "50%", fontSize: "0.7rem" }}>2</span>
              抽帧方式
            </div>
            <div style=${{ display: "flex", flexDirection: "column", gap: 6 }}>
              <label style=${{ display: "flex", alignItems: "center", gap: 8, fontSize: "0.85rem", cursor: "pointer", padding: "8px 10px", border: "2px solid " + (strategy === "smart" ? "var(--accent)" : "var(--rule)"), borderRadius: 6, background: strategy === "smart" ? "#EBF5FB" : "#fff" }}>
                <input type="radio" name="strategy" value="smart" checked=${strategy === "smart"} onChange=${function(){setStrategy("smart")}} style=${{ width: 16, height: 16 }} />
                <span><strong style=${{ fontSize: "0.85rem" }}>智能抽帧</strong><br /><span style=${{ fontSize: "0.7rem", color: "var(--muted)" }}>自动捕捉动作画面</span></span>
              </label>
              <label style=${{ display: "flex", alignItems: "center", gap: 8, fontSize: "0.85rem", cursor: "pointer", padding: "8px 10px", border: "2px solid " + (strategy === "fixed" ? "var(--accent)" : "var(--rule)"), borderRadius: 6, background: strategy === "fixed" ? "#EBF5FB" : "#fff" }}>
                <input type="radio" name="strategy" value="fixed" checked=${strategy === "fixed"} onChange=${function(){setStrategy("fixed")}} style=${{ width: 16, height: 16 }} />
                <span><strong style=${{ fontSize: "0.85rem" }}>固定间隔</strong><br /><span style=${{ fontSize: "0.7rem", color: "var(--muted)" }}>每隔几秒取一张</span></span>
              </label>
            </div>
            ${strategy === "smart" ? html`
              <button onClick=${function(){ setShowAdvanced(!showAdvanced); }}
                style=${{ width: "100%", marginTop: 8, padding: "6px 10px", fontSize: "0.8rem", border: "1px solid var(--rule)", borderRadius: 4, background: "#F8F9FA", cursor: "pointer", textAlign: "left", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <span>高级设置</span>
                <span style=${{ fontSize: "0.9rem", color: "var(--muted)" }}>${showAdvanced ? "\u25BC" : "\u25B6"}</span>
              </button>
              ${showAdvanced ? html`
                <div style=${{ padding: 10, background: "#F8F9FA", borderRadius: "0 0 4px 4px", border: "1px solid var(--rule)", borderTop: "none", marginTop: 4 }}>
                  <div style=${{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 8 }}>
                    <div>
                      <label style=${{ display: "block", fontSize: "0.7rem", fontWeight: 600, marginBottom: 2 }}>动作触发比例</label>
                      <input type="number" value=${diffThreshold} step="0.01" min="0.005" max="0.5"
                        onInput=${function(e){setDiffThreshold(parseFloat(e.target.value) || 0.03)}}
                        style=${{ width: "100%", padding: "6px 8px", border: "1px solid var(--rule)", borderRadius: 3, fontSize: "0.75rem" }} />
                    </div>
                    <div>
                      <label style=${{ display: "block", fontSize: "0.7rem", fontWeight: 600, marginBottom: 2 }}>像素变化阈值</label>
                      <input type="number" value=${pixelThreshold} step="5" min="5" max="100"
                        onInput=${function(e){setPixelThreshold(parseInt(e.target.value) || 25)}}
                        style=${{ width: "100%", padding: "6px 8px", border: "1px solid var(--rule)", borderRadius: 3, fontSize: "0.75rem" }} />
                    </div>
                  </div>
                  <div style=${{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                    <div>
                      <label style=${{ display: "block", fontSize: "0.7rem", fontWeight: 600, marginBottom: 2 }}>最小间隔(秒)</label>
                      <input type="number" value=${minInterval} step="0.1" min="0.1"
                        onInput=${function(e){setMinInterval(parseFloat(e.target.value) || 0.5)}}
                        style=${{ width: "100%", padding: "6px 8px", border: "1px solid var(--rule)", borderRadius: 3, fontSize: "0.75rem" }} />
                    </div>
                    <div>
                      <label style=${{ display: "block", fontSize: "0.7rem", fontWeight: 600, marginBottom: 2 }}>最大间隔(秒)</label>
                      <input type="number" value=${maxInterval} step="1" min="1"
                        onInput=${function(e){setMaxInterval(parseFloat(e.target.value) || 10.0)}}
                        style=${{ width: "100%", padding: "6px 8px", border: "1px solid var(--rule)", borderRadius: 3, fontSize: "0.75rem" }} />
                    </div>
                  </div>
                </div>
              ` : null}
            ` : html`
              <div style=${{ marginTop: 8 }}>
                <label style=${{ display: "block", fontSize: "0.75rem", fontWeight: 600, marginBottom: 4 }}>抽帧间隔（秒）</label>
                <input type="number" value=${interval} onInput=${function(e){setInterval(parseInt(e.target.value) || 2)}} min="1"
                  style=${{ width: "100%", padding: "8px 10px", border: "1px solid var(--rule)", borderRadius: 4, fontSize: "0.85rem" }} />
              </div>
            `}
          </div>

          ${/* Card 3: File upload */ ""}
          <div style=${{ padding: 14, background: "#fff", borderRadius: 8, border: "1px solid var(--rule)" }}>
            <div style=${{ fontSize: "0.85rem", fontWeight: 700, marginBottom: 8, display: "flex", alignItems: "center", gap: 8 }}>
              <span style=${{ width: 20, height: 20, lineHeight: "20px", textAlign: "center", background: "var(--accent)", color: "#fff", borderRadius: "50%", fontSize: "0.7rem" }}>3</span>
              选择视频文件
            </div>
            <input type="file" accept="video/mp4,video/quicktime,video/x-msvideo,video/mov,.mp4,.mov,.avi,.mkv,.flv,.wmv" onChange=${handleUpload} disabled=${uploading}
              style=${{ width: "100%", padding: "8px", border: "2px dashed var(--rule)", borderRadius: 6, fontSize: "0.8rem", opacity: uploading ? 0.6 : 1, cursor: "pointer" }} />
            <div style=${{ fontSize: "0.7rem", color: "var(--muted)", marginTop: 4 }}>支持 mp4、mov 等，文件仅在本地处理</div>
            ${videoInfo ? html`
              <div style=${{ marginTop: 8, padding: 8, background: "#F8F9FA", borderRadius: 4, fontSize: "0.75rem" }}>
                <div><span style=${{ color: "var(--muted)" }}>文件：</span>${videoInfo.filename}</div>
                <div style=${{ display: "flex", gap: 12, marginTop: 4 }}>
                  <span><span style=${{ color: "var(--muted)" }}>大小：</span>${videoInfo.fileSizeStr}</span>
                  ${videoInfo.durationStr ? html`<span><span style=${{ color: "var(--muted)" }}>时长：</span>${videoInfo.durationStr}</span>` : null}
                </div>
                ${videoInfo.fps ? html`<div style=${{ marginTop: 2 }}><span style=${{ color: "var(--muted)" }}>帧率：</span>${videoInfo.fps} fps | <span style=${{ color: "var(--muted)" }}>总帧数：</span>${videoInfo.totalFrames}</div>` : null}
              </div>
            ` : null}
          </div>

          ${/* Progress / Error / Result */ ""}
          ${uploading && progress ? html`
            <div style=${{ padding: 12, background: "#FCF3CF", borderRadius: 8, fontSize: "0.8rem" }}>
              <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                <span style=${{ fontSize: "0.85rem" }}>正在处理视频...</span>
                <span style=${{ fontWeight: 700, fontSize: "1.1rem", color: "#E67E22" }}>${progress.percent}%</span>
              </div>
              <div style=${{ width: "100%", height: 8, background: "#E8E8E8", borderRadius: 4, overflow: "hidden" }}>
                <div style=${{ width: Math.max(progress.percent, 2) + "%", height: "100%", background: "var(--accent)", borderRadius: 4, transition: "width 0.2s ease" }}></div>
              </div>
              <div style=${{ display: "flex", justifyContent: "space-between", marginTop: 8, fontSize: "0.75rem", color: "var(--muted)" }}>
                <span>已处理 ${progress.currentFrame} / ${progress.totalFrames} 帧</span>
                <span>已提取 ${progress.extracted} 帧</span>
              </div>
            </div>
          ` : null}
          ${uploading && !progress ? html`<div style=${{ padding: 12, background: "#FCF3CF", borderRadius: 8, fontSize: "0.8rem" }}>正在读取视频文件...</div>` : null}
          ${error ? html`<div style=${{ padding: 12, background: "#FADBD8", borderRadius: 8, fontSize: "0.8rem", color: "var(--danger)" }}><strong>错误：</strong>${error}</div>` : null}
          ${result ? html`
            <div style=${{ padding: 12, background: "#D5F5E3", borderRadius: 8, fontSize: "0.8rem" }}>
              <div style=${{ fontWeight: 700, marginBottom: 6, fontSize: "0.85rem" }}>处理完成</div>
              <div>共提取 <strong>${result.extracted}</strong> 帧画面</div>
              ${result.strategy === "smart" ? html`
                <div style=${{ display: "flex", gap: 6, marginTop: 4, fontSize: "0.7rem", flexWrap: "wrap" }}>
                  <span style=${{ padding: "1px 6px", background: "#FADBD8", borderRadius: 3 }}>动作: ${result.action_frames}</span>
                  <span style=${{ padding: "1px 6px", background: "#D6EAF8", borderRadius: 3 }}>静止: ${result.static_frames}</span>
                  ${result.skipped_duplicates > 0 ? html`<span style=${{ padding: "1px 6px", background: "#F5F5F5", borderRadius: 3 }}>去重: ${result.skipped_duplicates}</span>` : null}
                </div>
              ` : null}
            </div>
          ` : null}
        </div>

        ${/* Right: video preview + frame preview */ ""}
        <div style=${{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column", gap: 12 }}>

          ${/* Step 4: Video preview & manual extraction */ ""}
          ${previewVideo && previewVideo.length > 0 ? html`
            <div style=${{ padding: 14, background: "#fff", borderRadius: 8, border: "1px solid var(--rule)" }}>
              <div style=${{ fontSize: "0.85rem", fontWeight: 700, marginBottom: 10, display: "flex", alignItems: "center", gap: 8 }}>
                <span style=${{ width: 20, height: 20, lineHeight: "20px", textAlign: "center", background: "var(--accent)", color: "#fff", borderRadius: "50%", fontSize: "0.7rem" }}>4</span>
                视频预览 & 手动抽帧
                <button onClick=${function() {
                  if (!confirm("确认删除视频文件？删除后无法再预览和手动抽帧。")) return;
                  fetch(API + "/frames/video-file/" + encodeURIComponent(previewVideo), { method: "DELETE" })
                    .then(function(r) { return r.json(); })
                    .then(function() {
                      setPreviewVideo(null);
                      setManualResult(null);
                      setThumbnails(null);
                    });
                }}
                  style=${{ marginLeft: "auto", padding: "4px 10px", fontSize: "0.75rem", border: "1px solid var(--danger)", borderRadius: 4, background: "transparent", color: "var(--danger)", cursor: "pointer" }}>删除视频</button>
              </div>
              <video
                ref=${videoRef}
                src=${"/frames/video-file/" + previewVideo}
                controls
                preload="metadata"
                style=${{ width: "100%", maxHeight: 360, borderRadius: 6, background: "#000", marginBottom: 8, objectFit: "contain" }}
                onTimeUpdate=${function(e) { setManualTime(e.target.currentTime.toFixed(1)); }}
                onError=${function(e) {
                  var v = e.target;
                  if (v.readyState === 0 && v.networkState === 3) {
                    setManualResult({ ok: false, msg: "视频文件加载失败，可能已被清理。" });
                  }
                }}
              />
              ${thumbsLoading ? html`
                <div style=${{ display: "flex", height: 44, alignItems: "center", justifyContent: "center", background: "#eee", borderRadius: 4, marginBottom: 8 }}>
                  <span style=${{ fontSize: "0.75rem", color: "var(--muted)" }}>生成时间轴预览中...</span>
                </div>
              ` : thumbnails && thumbnails.thumbnails && thumbnails.thumbnails.length > 0 ? html`
                <div style=${{ position: "relative", marginBottom: 8, userSelect: "none" }}>
                  ${hoverIdx >= 0 ? html`
                    <div style=${{
                      position: "absolute", bottom: 48,
                      left: "calc(" + (hoverIdx / Math.max(1, thumbnails.thumbnails.length - 1) * 100) + "% - 35px)",
                      width: 80, pointerEvents: "none", zIndex: 10, transition: "left 0.05s",
                    }}>
                      <img src=${thumbnails.thumbnails[hoverIdx].data_uri} style=${{ width: 80, height: 44, objectFit: "cover", borderRadius: 3, border: "2px solid var(--accent)", display: "block" }} />
                      <div style=${{ textAlign: "center", fontSize: "0.6rem", color: "#fff", background: "rgba(0,0,0,0.8)", borderRadius: 2, marginTop: 1, padding: "1px 0" }}>${thumbnails.thumbnails[hoverIdx].timestamp}s</div>
                    </div>
                  ` : null}
                  <div
                    ref=${timelineRef}
                    style=${{ display: "flex", gap: 0, height: 44, borderRadius: 4, border: "1px solid var(--rule)", overflow: "hidden", cursor: dragging ? "grabbing" : "pointer", position: "relative" }}
                    onMouseDown=${function(e) {
                      setDragging(true);
                      var seek = function(clientX) {
                        var el = timelineRef.current;
                        if (!el) return;
                        var rect = el.getBoundingClientRect();
                        var ratio = (clientX - rect.left) / rect.width;
                        if (ratio < 0) ratio = 0;
                        if (ratio > 1) ratio = 1;
                        var dur = thumbnails.duration || (result ? result.duration_sec : 0);
                        var ts = ratio * dur;
                        var v = videoRef.current;
                        if (v) {
                          v.currentTime = ts;
                          v.play().then(function() { v.pause(); }).catch(function() {});
                          setManualTime(ts.toFixed(1));
                        }
                      };
                      seek(e.clientX);
                      var onMove = function(ev) { seek(ev.clientX); };
                      var onUp = function() {
                        setDragging(false);
                        document.removeEventListener("mousemove", onMove);
                        document.removeEventListener("mouseup", onUp);
                      };
                      document.addEventListener("mousemove", onMove);
                      document.addEventListener("mouseup", onUp);
                      e.preventDefault();
                    }}
                    onMouseMove=${function(e) {
                      if (dragging) return;
                      var el = timelineRef.current;
                      if (!el || !thumbnails) return;
                      var rect = el.getBoundingClientRect();
                      var ratio = (e.clientX - rect.left) / rect.width;
                      if (ratio < 0) ratio = 0;
                      if (ratio > 1) ratio = 1;
                      var idx = Math.round(ratio * (thumbnails.thumbnails.length - 1));
                      if (idx !== hoverIdx) setHoverIdx(idx);
                    }}
                    onMouseLeave=${function() { setHoverIdx(-1); }}
                  >
                    ${thumbnails.thumbnails.map(function(th, i) {
                      return html`
                        <div key=${i} style=${{ flex: "1 1 0", minWidth: 0, height: "100%", overflow: "hidden", borderRight: i < thumbnails.thumbnails.length - 1 ? "1px solid rgba(0,0,0,0.1)" : "none" }}>
                          <img src=${th.data_uri} style=${{ width: "100%", height: "100%", objectFit: "cover", display: "block", pointerEvents: "none" }} />
                        </div>
                      `;
                    })}
                    <div style=${{
                      position: "absolute", top: 0, bottom: 0,
                      left: "calc(" + (parseFloat(manualTime || 0) / Math.max(0.1, thumbnails.duration || (result ? result.duration_sec : 1)) * 100) + "%)",
                      width: 3, background: "#E74C3C", borderRadius: 2, pointerEvents: "none",
                      boxShadow: "0 0 4px rgba(231,76,60,0.8)", transition: dragging ? "none" : "left 0.1s linear",
                    }}>
                      <div style=${{ position: "absolute", top: -4, left: -4, width: 10, height: 10, background: "#E74C3C", borderRadius: "50%", border: "2px solid #fff" }}></div>
                    </div>
                  </div>
                  <div style=${{ display: "flex", justifyContent: "space-between", marginTop: 2, fontSize: "0.6rem", color: "var(--muted)" }}>
                    <span>0s</span>
                    <span style=${{ fontWeight: 600, color: "var(--accent)" }}>${manualTime || "0.0"}s</span>
                    <span>${result ? result.duration_sec : (thumbnails ? thumbnails.duration : 0)}s</span>
                  </div>
                </div>
              ` : null}
              <div style=${{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
                <button
                  onClick=${function() {
                    var v = videoRef.current;
                    if (!v) return;
                    setExtracting(true); setManualResult(null);
                    var ts = v.currentTime;
                    fetch(API + "/frames/extract-manual?camera_id=" + selectedCam + "&video_filename=" + encodeURIComponent(previewVideo) + "&timestamp=" + ts, { method: "POST" })
                      .then(function(r) {
                        if (!r.ok) {
                          return r.json().then(function(d) {
                            var errMsg = "提取失败";
                            if (typeof d.detail === "string") errMsg = d.detail;
                            else if (Array.isArray(d.detail) && d.detail.length > 0) errMsg = d.detail[0].msg || errMsg;
                            throw new Error(errMsg);
                          });
                        }
                        return r.json();
                      })
                      .then(function(d) {
                        setExtracting(false);
                        if (d.id) {
                          setManualResult({ ok: true, msg: d.message, ts: d.video_timestamp });
                          setPreviewFrames((previewFrames || []).concat([d]));
                        } else {
                          setManualResult({ ok: false, msg: "提取失败" });
                        }
                      })
                      .catch(function(e) {
                        setExtracting(false);
                        setManualResult({ ok: false, msg: e.message || "网络错误" });
                      });
                  }}
                  disabled=${extracting}
                  style=${{ padding: "8px 18px", fontSize: "0.85rem", border: "2px solid var(--accent)", borderRadius: 6, background: extracting ? "#ccc" : "var(--accent)", color: "#fff", cursor: extracting ? "wait" : "pointer", fontWeight: 600 }}
                >
                  ${extracting ? "提取中..." : "提取当前帧"}
                </button>
                ${manualResult && manualResult.ok ? html`<span style=${{ fontSize: "0.75rem", color: "#27AE60" }}>${manualResult.msg}（已添加到下方预览区）</span>` : null}
                ${manualResult && !manualResult.ok ? html`<span style=${{ fontSize: "0.75rem", color: "var(--danger)" }}>${manualResult.msg}</span>` : null}
              </div>
            </div>
          ` : html`
            <div style=${{ padding: 40, background: "#fff", borderRadius: 8, border: "2px dashed var(--rule)", textAlign: "center", color: "var(--muted)" }}>
              <div style=${{ fontSize: "2rem", marginBottom: 8 }}>\u{1F4F9}</div>
              <div style=${{ fontSize: "0.9rem" }}>上传视频后在此预览</div>
              <div style=${{ fontSize: "0.75rem", marginTop: 4 }}>支持拖动时间轴手动抽帧</div>
            </div>
          `}

          ${/* Step 5: Frame preview grid */ ""}
          ${previewFrames && previewFrames.length > 0 ? html`
            <div style=${{ padding: 14, background: "#fff", borderRadius: 8, border: "1px solid var(--rule)" }}>
              <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                <div style=${{ fontSize: "0.85rem", fontWeight: 700, display: "flex", alignItems: "center", gap: 8 }}>
                  <span style=${{ width: 20, height: 20, lineHeight: "20px", textAlign: "center", background: "var(--accent)", color: "#fff", borderRadius: "50%", fontSize: "0.7rem" }}>5</span>
                  抽帧预览（${previewFrames.length} 张）
                </div>
                <div style=${{ display: "flex", gap: 6 }}>
                  <button onClick=${function() {
                    setConfirming(true);
                    var ids = previewFrames.map(function(f) { return f.id; });
                    fetch(API + "/frames/discard-batch", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(ids) })
                      .then(function(r) { return r.json(); })
                      .then(function() {
                        setConfirming(false);
                        setPreviewFrames(null);
                        setPreviewJobId(null);
                        setResult(null);
                        loadImports();
                      });
                  }} disabled=${confirming}
                    style=${{ padding: "6px 14px", fontSize: "0.8rem", border: "1px solid var(--danger)", borderRadius: 6, background: "transparent", color: "var(--danger)", cursor: "pointer", fontWeight: 600 }}>丢弃全部</button>
                  <button onClick=${function() {
                    setConfirming(true);
                    var ids = previewFrames.map(function(f) { return f.id; });
                    fetch(API + "/frames/confirm-batch", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(ids) })
                      .then(function(r) { return r.json(); })
                      .then(function() {
                        setConfirming(false);
                        setPreviewFrames(null);
                        setPreviewJobId(null);
                        setResult(null);
                        loadImports();
                        window._navigate("annotate");
                      });
                  }} disabled=${confirming}
                    style=${{ padding: "6px 14px", fontSize: "0.8rem", border: "none", borderRadius: 6, background: "var(--accent)", color: "#fff", cursor: "pointer", fontWeight: 600 }}>${confirming ? "处理中..." : "确认并去标注"}</button>
                </div>
              </div>
              <div style=${{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(120px, 1fr))", gap: 8, maxHeight: 350, overflowY: "auto" }}>
                ${previewFrames.map(function(f) {
                  var isSelected = selectedFrame && selectedFrame.id === f.id;
                  return html`
                    <div key=${f.id} style=${{ position: "relative", borderRadius: 4, overflow: "hidden", border: isSelected ? "3px solid var(--accent)" : "1px solid var(--rule)", background: "#000", cursor: "pointer", boxShadow: isSelected ? "0 0 8px rgba(52,152,219,0.6)" : "none", transition: "border 0.15s, box-shadow 0.15s" }}
                      onClick=${function(e) {
                        if (e.target.tagName === "BUTTON") return;
                        setSelectedFrame(f);
                        setShowZoom(true);
                      }}>
                      <img src=${API + f.image_path} style=${{ width: "100%", height: 80, objectFit: "cover", display: "block" }}
                        onError=${function(e) { e.target.style.display = "none"; e.target.parentElement.style.background = "#333"; }} />
                      <span style=${{ position: "absolute", bottom: 0, left: 0, right: 0, background: "rgba(0,0,0,0.6)", color: "#fff", fontSize: "0.6rem", padding: "1px 4px", textAlign: "center" }}>
                        ${f.video_timestamp !== undefined ? f.video_timestamp.toFixed(1) + "s" : ""}
                      </span>
                      <button onClick=${function(e) {
                        e.stopPropagation();
                        fetch(API + "/frames/" + f.id, { method: "DELETE" })
                          .then(function(r) { return r.json(); })
                          .then(function() {
                            setPreviewFrames(previewFrames.filter(function(pf) { return pf.id !== f.id; }));
                          });
                      }} style=${{
                        position: "absolute", top: 2, right: 2, width: 20, height: 20, borderRadius: "50%",
                        border: "none", background: "rgba(0,0,0,0.6)", color: "#fff", cursor: "pointer",
                        fontSize: "0.75rem", display: "flex", alignItems: "center", justifyContent: "center",
                        fontWeight: 700, lineHeight: 1
                      }}>\u00D7</button>
                    </div>
                  `;
                })}
              </div>
            </div>
          ` : null}
        </div>
      </div>
    </div>

    ${showZoom && selectedFrame ? html`
      <div onClick=${function() { setShowZoom(false); }}
        style=${{
          position: "fixed", top: 0, left: 0, right: 0, bottom: 0,
          background: "rgba(0,0,0,0.85)", zIndex: 9999,
          display: "flex", alignItems: "center", justifyContent: "center",
          padding: 40, cursor: "zoom-out"
        }}>
        ${/* Left arrow */ ""}
        ${(function() {
          var idx = previewFrames.findIndex(function(f) { return f.id === selectedFrame.id; });
          return idx > 0;
        })() ? html`
          <button onClick=${function(e) {
            e.stopPropagation();
            var idx = previewFrames.findIndex(function(f) { return f.id === selectedFrame.id; });
            if (idx > 0) setSelectedFrame(previewFrames[idx - 1]);
          }} style=${{
            position: "absolute", left: 20, top: "50%", transform: "translateY(-50%)",
            width: 48, height: 48, borderRadius: "50%", border: "none",
            background: "rgba(255,255,255,0.15)", color: "#fff", cursor: "pointer",
            fontSize: "1.5rem", display: "flex", alignItems: "center", justifyContent: "center"
          }}>\u2039</button>
        ` : null}

        ${/* Image container */ ""}
        <div style=${{ position: "relative", maxWidth: "90%", maxHeight: "90%" }}
          onClick=${function(e) { e.stopPropagation(); }}>
          <img src=${API + selectedFrame.image_path}
            style=${{ maxWidth: "80vw", maxHeight: "80vh", objectFit: "contain", borderRadius: 8, display: "block", cursor: "zoom-out" }}
            onClick=${function() { setShowZoom(false); }}
            onError=${function(e) { e.target.style.display = "none"; }} />
          ${/* Delete button */ ""}
          <button onClick=${function(e) {
            e.stopPropagation();
            var curId = selectedFrame.id;
            var idx = previewFrames.findIndex(function(f) { return f.id === curId; });
            fetch(API + "/frames/" + curId, { method: "DELETE" })
              .then(function(r) { return r.json(); })
              .then(function() {
                var remaining = previewFrames.filter(function(pf) { return pf.id !== curId; });
                setPreviewFrames(remaining);
                if (remaining.length === 0) {
                  setSelectedFrame(null);
                  setShowZoom(false);
                } else if (idx < remaining.length) {
                  setSelectedFrame(remaining[idx]);
                } else {
                  setSelectedFrame(remaining[remaining.length - 1]);
                }
              });
          }} style=${{
            position: "absolute", top: 8, right: 8, padding: "6px 14px",
            border: "1px solid rgba(231,76,60,0.8)", borderRadius: 6,
            background: "rgba(231,76,60,0.85)", color: "#fff", cursor: "pointer",
            fontSize: "0.8rem", fontWeight: 600
          }}>\u{1F5D1} 删除此张</button>
          <div style=${{
            position: "absolute", bottom: -36, left: "50%", transform: "translateX(-50%)",
            color: "#fff", fontSize: "0.85rem", whiteSpace: "nowrap", textAlign: "center"
          }}>
            ${(function() {
              var idx = previewFrames.findIndex(function(f) { return f.id === selectedFrame.id; });
              return (idx + 1) + " / " + previewFrames.length;
            })()}
            ${selectedFrame.video_timestamp !== undefined ? html`<span style=${{ marginLeft: 12 }}>${selectedFrame.video_timestamp.toFixed(1)}s</span>` : null}
            <span style=${{ marginLeft: 12, opacity: 0.6, fontSize: "0.75rem" }}>点击关闭 | \u2190 \u2192 翻页</span>
          </div>
        </div>

        ${/* Right arrow */ ""}
        ${(function() {
          var idx = previewFrames.findIndex(function(f) { return f.id === selectedFrame.id; });
          return idx < previewFrames.length - 1;
        })() ? html`
          <button onClick=${function(e) {
            e.stopPropagation();
            var idx = previewFrames.findIndex(function(f) { return f.id === selectedFrame.id; });
            if (idx < previewFrames.length - 1) setSelectedFrame(previewFrames[idx + 1]);
          }} style=${{
            position: "absolute", right: 20, top: "50%", transform: "translateY(-50%)",
            width: 48, height: 48, borderRadius: "50%", border: "none",
            background: "rgba(255,255,255,0.15)", color: "#fff", cursor: "pointer",
            fontSize: "1.5rem", display: "flex", alignItems: "center", justifyContent: "center"
          }}>\u203A</button>
        ` : null}
      </div>
    ` : null}
    </${Panel}>

    <${Panel} title="使用说明">
      <ul style=${{ paddingLeft: 20, fontSize: "0.9rem", color: "var(--muted)", lineHeight: 2 }}>
        <li><strong>智能抽帧（推荐）</strong>：自动捕捉动作画面，适合跌倒等场景</li>
        <li><strong>固定间隔</strong>：每隔几秒取一张，适合监控录像</li>
        <li><strong>手动抽帧</strong>：处理完成后可在步骤④预览视频，拖动时间轴到需要的画面，点击"提取当前帧"添加到预览区</li>
        <li><strong>预览确认</strong>：所有抽帧结果（自动+手动）统一显示在步骤⑤预览区，可逐张删除不需要的，确认后加入标注列表</li>
        <li>选择视频后自动开始处理，请耐心等待进度完成</li>
        <li>所有视频和图片均在本地处理，不会上传到网络</li>
      </ul>
    </${Panel}>

    <${Panel} title=${"处理记录" + (imports ? "（" + imports.total + " 条）" : "")}>
      ${imports && imports.items && imports.items.length > 0 ? html`
        <div style=${{ overflowX: "auto" }}>
          <table style=${{ width: "100%", borderCollapse: "collapse", fontSize: "0.85rem" }}>
            <thead>
              <tr style=${{ borderBottom: "2px solid var(--rule)", textAlign: "left" }}>
                <th style=${{ padding: "10px 6px", whiteSpace: "nowrap" }}>时间</th>
                <th style=${{ padding: "10px 6px", whiteSpace: "nowrap" }}>文件名</th>
                <th style=${{ padding: "10px 6px", whiteSpace: "nowrap" }}>大小</th>
                <th style=${{ padding: "10px 6px", whiteSpace: "nowrap" }}>摄像头</th>
                <th style=${{ padding: "10px 6px", whiteSpace: "nowrap" }}>操作人</th>
                <th style=${{ padding: "10px 6px", whiteSpace: "nowrap" }}>策略</th>
                <th style=${{ padding: "10px 6px", whiteSpace: "nowrap" }}>时长</th>
                <th style=${{ padding: "10px 6px", whiteSpace: "nowrap" }}>提取帧数</th>
                <th style=${{ padding: "10px 6px", whiteSpace: "nowrap" }}>去重</th>
                <th style=${{ padding: "10px 6px", whiteSpace: "nowrap" }}>分片</th>
                <th style=${{ padding: "10px 6px", whiteSpace: "nowrap" }}>状态</th>
              </tr>
            </thead>
            <tbody>
              ${imports.items.map(function(r) {
                var statusColor = r.status === "done" ? "#27AE60" : r.status === "error" ? "#E74C3C" : "#F39C12";
                var statusText = r.status === "done" ? "完成" : r.status === "error" ? "失败" : "处理中";
                var sizeStr = r.file_size > 1048576 ? (r.file_size / 1048576).toFixed(1) + " MB" : (r.file_size / 1024).toFixed(0) + " KB";
                var timeStr = r.created_at ? r.created_at.replace("T", " ").substring(0, 19) : "";
                var durStr = r.duration_sec >= 60 ? Math.floor(r.duration_sec / 60) + "分" + Math.round(r.duration_sec % 60) + "秒" : r.duration_sec + "秒";
                var extractStr = r.status === "done" ? r.extracted_frames + "帧" : "-";
                var dedupStr = r.status === "done" && r.skipped_duplicates > 0 ? r.skipped_duplicates + "帧" : "-";
                var chunkStr = r.num_chunks > 1 ? r.num_chunks + "片" : "1片";
                return html`
                  <tr key=${r.id} style=${{ borderBottom: "1px solid var(--rule)" }}>
                    <td style=${{ padding: "8px 6px", whiteSpace: "nowrap", color: "var(--muted)" }}>${timeStr}</td>
                    <td style=${{ padding: "8px 6px", whiteSpace: "nowrap", maxWidth: 150, overflow: "hidden", textOverflow: "ellipsis" }}>${r.filename}</td>
                    <td style=${{ padding: "8px 6px", whiteSpace: "nowrap" }}>${sizeStr}</td>
                    <td style=${{ padding: "8px 6px", whiteSpace: "nowrap" }}>${r.camera_name || "-"}</td>
                    <td style=${{ padding: "8px 6px", whiteSpace: "nowrap" }}>${r.uploaded_by}</td>
                    <td style=${{ padding: "8px 6px", whiteSpace: "nowrap" }}>${r.strategy === "smart" ? "智能" : "固定"}</td>
                    <td style=${{ padding: "8px 6px", whiteSpace: "nowrap" }}>${durStr}</td>
                    <td style=${{ padding: "8px 6px", whiteSpace: "nowrap" }}>${extractStr}</td>
                    <td style=${{ padding: "8px 6px", whiteSpace: "nowrap", color: "var(--muted)" }}>${dedupStr}</td>
                    <td style=${{ padding: "8px 6px", whiteSpace: "nowrap" }}>${chunkStr}</td>
                    <td style=${{ padding: "8px 6px", whiteSpace: "nowrap" }}>
                      <span style=${{ padding: "3px 10px", borderRadius: 4, background: statusColor, color: "#fff", fontSize: "0.75rem" }}>${statusText}</span>
                    </td>
                  </tr>
                `;
              })}
            </tbody>
          </table>
        </div>
      ` : html`<div style=${{ padding: "1rem", color: "var(--muted)", textAlign: "center", fontSize: "0.9rem" }}>暂无处理记录</div>`}
    </${Panel}>
  `;
}

/* ===== Info tooltip dot ===== */
function InfoDot(props) {
  var st = useState(false); var show = st[0]; var setShow = st[1];
  return html`
    <span style=${{ position: "relative", display: "inline-flex", alignItems: "center" }}
      onMouseEnter=${function(){ setShow(true); }}
      onMouseLeave=${function(){ setShow(false); }}
      onClick=${function(e){ e.stopPropagation(); setShow(!show); }}>
      <span style=${{
        display: "inline-flex", alignItems: "center", justifyContent: "center",
        width: 16, height: 16, borderRadius: "50%",
        background: "#3498DB", color: "#fff", fontSize: "0.7rem",
        cursor: "help", fontWeight: 700, lineHeight: 1,
        flexShrink: 0,
      }}>\u24D8</span>
      ${show ? html`
        <span style=${{
          position: "absolute", top: "100%", left: 0,
          marginTop: 6,
          background: "#2C3E50", color: "#fff",
          padding: "8px 12px", borderRadius: 6,
          fontSize: "0.75rem", lineHeight: 1.5,
          whiteSpace: "normal", width: 280,
          zIndex: 1000, boxShadow: "0 4px 12px rgba(0,0,0,0.3)",
          pointerEvents: "none",
        }}>${props.text}</span>
      ` : null}
    </span>
  `;
}

/* ===== Train ===== */
function TrainPage() {
  var s1 = useState(null); var trainStatus = s1[0]; var setTrainStatus = s1[1];
  var s2 = useState(null); var stats = s2[0]; var setStats = s2[1];
  var s3 = useState(50); var epochs = s3[0]; var setEpochs = s3[1];
  var s4 = useState("0.001"); var lr = s4[0]; var setLr = s4[1];
  var s5 = useState(16); var batchSize = s5[0]; var setBatchSize = s5[1];
  var s6 = useState(""); var msg = s6[0]; var setMsg = s6[1];
  var sBase = useState("scratch"); var baseModel = sBase[0]; var setBaseModel = sBase[1];
  var s7 = useState(""); var errMsg = s7[0]; var setErrMsg = s7[1];
  var s8 = useState(null); var analysis = s8[0]; var setAnalysis = s8[1];
  var sCam = useState([]); var cameras = sCam[0]; var setCameras = sCam[1];
  var sCamSel = useState("all"); var trainCam = sCamSel[0]; var setTrainCam = sCamSel[1];
  var sDs = useState([]); var datasets = sDs[0]; var setDatasets = sDs[1];
  var sDsSel = useState("all"); var trainDs = sDsSel[0]; var setTrainDs = sDsSel[1];
  var pollRef = useRef(null);

  function fetchStatus() {
    apiGet("/train/status").then(function(d) { if (d) setTrainStatus(d); });
  }

  useEffect(function() {
    fetchStatus();
    apiGet("/dashboard/stats").then(function(d) { if (d) setStats(d); });
    apiGet("/dashboard/training-analysis").then(function(d) { if (d) setAnalysis(d); });
    apiGet("/cameras/").then(function(d) { if (d) setCameras(d); });
    apiGet("/datasets/").then(function(d) { if (d) setDatasets(d); });
    pollRef.current = setInterval(fetchStatus, 2000);
    return function() { if (pollRef.current) clearInterval(pollRef.current); };
  }, []);

  function handleTrain() {
    setMsg(""); setErrMsg("");
    var payload = { num_epochs: epochs, base_model: baseModel };
    if (trainCam !== "all") payload.camera_id = parseInt(trainCam);
    if (trainDs !== "all") payload.dataset_id = parseInt(trainDs);
    fetch(API + "/train/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).then(function(r) {
      return r.json().then(function(d) { return { ok: r.ok, data: d }; });
    }).then(function(res) {
      if (res.ok && !res.data.error) {
        var mode = res.data.base_model === "incremental" ? "增量训练" : "从头训练";
        var cam = res.data.camera ? " | 摄像头: " + res.data.camera : "";
        setMsg("训练已启动（" + mode + cam + "）！数据集: " + (res.data.dataset_size || "?") + " 张，轮数: " + (res.data.num_epochs || epochs));
        fetchStatus();
      } else {
        setErrMsg(res.data.error || res.data.message || "启动训练失败");
      }
    }).catch(function(e) {
      setErrMsg("网络错误: " + (e.message || "未知错误"));
    });
  }

  var isTraining = trainStatus && trainStatus.status && trainStatus.status !== "idle";
  var statusMatch = trainStatus && trainStatus.status ? trainStatus.status.match(/training \((\d+)\/(\d+)\) loss=([\d.]+) val_acc=([\d.]+)/) : null;

  return html`
    <${Panel} title="发起模型训练">
      ${errMsg ? html`
        <div style=${{ padding: "0.75rem 1rem", background: "#FDEDEC", border: "1px solid #E74C3C", borderRadius: 6, marginBottom: 16, fontSize: "0.85rem", color: "#C0392B" }}>
          <strong>错误:</strong> ${errMsg}
        </div>
      ` : null}
      ${msg ? html`
        <div style=${{ padding: "0.75rem 1rem", background: "#E8F8F5", border: "1px solid #27AE60", borderRadius: 6, marginBottom: 16, fontSize: "0.85rem", color: "#1ABC9C" }}>
          ${msg}
        </div>
      ` : null}
      ${isTraining ? html`
        <div style=${{ padding: "1rem", background: "#FCF3CF", borderRadius: 6, marginBottom: 16, fontSize: "0.85rem" }}>
          <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
            <div>
              <strong>训练进行中</strong> \u2014 模型: ${trainStatus.model_name}
              ${trainStatus.started_at ? html`<span style=${{ color: "var(--muted)", marginLeft: 8, fontSize: "0.75rem" }}>开始于: ${String(trainStatus.started_at).slice(0, 19).replace("T", " ")}</span>` : null}
              ${trainStatus.elapsed_seconds != null ? html`<span style=${{ color: "var(--accent)", marginLeft: 8, fontSize: "0.75rem", fontWeight: 600 }}>已训练: ${Math.floor(trainStatus.elapsed_seconds / 60)}分${Math.floor(trainStatus.elapsed_seconds % 60)}秒</span>` : null}
            </div>
            <span style=${{ fontWeight: 700, fontSize: "0.9rem" }}>${trainStatus.status}</span>
          </div>
          ${statusMatch ? html`
            <div style=${{ marginTop: 8 }}>
              <div style=${{ display: "flex", gap: 16, fontSize: "0.8rem", color: "var(--muted)", marginBottom: 6 }}>
                <span>Epoch: ${statusMatch[1]}/${statusMatch[2]}</span>
                <span>Loss: ${statusMatch[3]}</span>
                <span>Val Acc: ${(parseFloat(statusMatch[4]) * 100).toFixed(1)}%</span>
              </div>
              <div style=${{ width: "100%", height: 8, background: "#E8E8E8", borderRadius: 4, overflow: "hidden" }}>
                <div style=${{ width: (parseInt(statusMatch[1]) / parseInt(statusMatch[2]) * 100) + "%", height: "100%", background: "var(--accent)", borderRadius: 4, transition: "width 0.5s" }}></div>
              </div>
            </div>
          ` : null}
          ${trainStatus.logs && trainStatus.logs.length > 0 ? html`
            <div style=${{ marginTop: 12 }}>
              <div style=${{ fontSize: "0.75rem", fontWeight: 700, color: "var(--muted)", marginBottom: 4 }}>训练日志</div>
              <div style=${{ background: "#1a1a1a", borderRadius: 6, padding: "8px 12px", maxHeight: 300, overflowY: "auto", fontFamily: "monospace", fontSize: "0.72rem", lineHeight: 1.6 }}>
                ${trainStatus.logs.map(function(log, i) {
                  var color = "#aaa";
                  if (log.indexOf("[错误]") >= 0 || log.indexOf("[停止]") >= 0) color = "#E74C3C";
                  else if (log.indexOf("[早停]") >= 0) color = "#F39C12";
                  else if (log.indexOf("[完成]") >= 0) color = "#27AE60";
                  else if (log.indexOf("[开始]") >= 0 || log.indexOf("[数据]") >= 0 || log.indexOf("[参数]") >= 0 || log.indexOf("[模式]") >= 0) color = "#3498DB";
                  else if (log.indexOf("\u2191") >= 0) color = "#2ECC71";
                  else if (log.indexOf("[导出]") >= 0) color = "#F39C12";
                  else if (log.indexOf("早停倒计时") >= 0) color = "#F1C40F";
                  return html`<div key=${i} style=${{ color: color, whiteSpace: "pre-wrap" }}>${log}</div>`;
                })}
              </div>
            </div>
          ` : null}
        </div>
      ` : null}

      <div style=${{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 24 }}>
        <div>
          <div style=${{ marginBottom: 16 }}>
            <label style=${{ display: "block", fontSize: "0.8rem", fontWeight: 600, marginBottom: 6, display: "flex", alignItems: "center", gap: 4 }}>训练数据集 <${InfoDot} text="选择参与训练的已标注图片数据集。默认全部，可选择某个摄像头的专属数据集单独训练，提高该摄像头的识别准确率。" /></label>
            <select value=${trainDs} onChange=${function(e){setTrainDs(e.target.value)}} style=${{ width: "100%", padding: "8px 12px", border: "1px solid var(--rule)", borderRadius: 4, fontSize: "0.85rem" }}>
              <option value="all">全部数据集（${stats ? stats.annotated_samples + " 张" : ""}）</option>
              ${datasets.map(function(ds) { return html`<option key=${ds.id} value=${ds.id}>${ds.name} (${ds.frame_count})</option>`; })}
            </select>
          </div>
          <div style=${{ marginBottom: 16 }}>
            <label style=${{ display: "block", fontSize: "0.8rem", fontWeight: 600, marginBottom: 6, display: "flex", alignItems: "center", gap: 4 }}>基础模型 <${InfoDot} text="从头训练：使用 ImageNet 预训练权重重新训练，适合数据量充足或标签变化较大时。增量训练：在当前生效模型基础上继续训练，适合少量新数据微调，训练更快。" /></label>
            <select value=${baseModel} onChange=${function(e){setBaseModel(e.target.value)}} style=${{ width: "100%", padding: "8px 12px", border: "1px solid var(--rule)", borderRadius: 4, fontSize: "0.85rem" }}>
              <option value="scratch">从头训练（预训练权重）</option>
              <option value="incremental">基于当前模型增量训练</option>
            </select>
          </div>
        </div>
        <div>
          <div style=${{ marginBottom: 16 }}>
            <label style=${{ display: "block", fontSize: "0.8rem", fontWeight: 600, marginBottom: 6, display: "flex", alignItems: "center", gap: 4 }}>训练轮数 (Epochs) <${InfoDot} text="模型遍历全部训练数据的次数。一般 30-100 轮即可收敛。轮数太少模型欠拟合，太多可能过拟合。建议从小值开始，观察验证准确率不再提升时停止。" /></label>
            <input type="number" value=${epochs} onInput=${function(e){setEpochs(parseInt(e.target.value) || 50)}}
              style=${{ width: "100%", padding: "8px 12px", border: "1px solid var(--rule)", borderRadius: 4, fontSize: "0.85rem" }} />
          </div>
          <div style=${{ marginBottom: 16 }}>
            <label style=${{ display: "block", fontSize: "0.8rem", fontWeight: 600, marginBottom: 6, display: "flex", alignItems: "center", gap: 4 }}>学习率 <${InfoDot} text="控制每次参数更新的步长。常用范围 0.0001 ~ 0.01。值太大训练不稳定，太小收敛慢。默认 0.001 适合大多数场景。" /></label>
            <input type="text" value=${lr} onInput=${function(e){setLr(e.target.value)}}
              style=${{ width: "100%", padding: "8px 12px", border: "1px solid var(--rule)", borderRadius: 4, fontSize: "0.85rem" }} />
          </div>
          <div style=${{ marginBottom: 16 }}>
            <label style=${{ display: "block", fontSize: "0.8rem", fontWeight: 600, marginBottom: 6, display: "flex", alignItems: "center", gap: 4 }}>批量大小 (Batch Size) <${InfoDot} text="每次迭代同时处理的图片数量。值越大训练越稳定但显存占用越高，值越小更新越频繁但可能不稳定。常见值 8、16、32。" /></label>
            <input type="number" value=${batchSize} onInput=${function(e){setBatchSize(parseInt(e.target.value) || 16)}}
              style=${{ width: "100%", padding: "8px 12px", border: "1px solid var(--rule)", borderRadius: 4, fontSize: "0.85rem" }} />
          </div>
        </div>
      </div>
      <div style=${{ marginTop: 16, paddingTop: 16, borderTop: "1px solid var(--rule)" }}>
        <button onClick=${handleTrain} disabled=${isTraining}
          style=${{ padding: "10px 24px", background: isTraining ? "var(--rule)" : "var(--accent)", color: "#fff", border: "none", borderRadius: 4, fontWeight: 600, cursor: isTraining ? "default" : "pointer", marginRight: 12 }}>
          ${isTraining ? "训练中..." : "开始训练"}
        </button>
        ${stats && stats.annotated_samples === 0 ? html`
          <span style=${{ fontSize: "0.8rem", color: "var(--warning)" }}>提示: 当前无已标注样本，请先处理视频并标注</span>
        ` : null}
      </div>
    </${Panel}>

    <${Panel} title="数据诊断与优化建议">
      ${analysis && analysis.suggestions ? html`
        <div style=${{ fontSize: "0.85rem", lineHeight: 1.7 }}>
          <div style=${{ marginBottom: 12, padding: "0.5rem 0.75rem", background: "var(--bg)", borderRadius: 4, fontSize: "0.8rem", color: "var(--muted)" }}>
            样本总数: <strong style=${{ color: "var(--ink)" }}>${analysis.total_samples}</strong> 张
            <span style=${{ margin: "0 8px" }}>|</span>
            标签数: <strong style=${{ color: "var(--ink)" }}>${analysis.num_labels}</strong> 个
          </div>
          ${analysis.suggestions.map(function(s, i) {
            var colors = {
              error: { bg: "#FDEDEC", border: "#E74C3C", text: "#C0392B", icon: "\u2716" },
              warning: { bg: "#FEF9E7", border: "#F39C12", text: "#B7950B", icon: "\u26A0" },
              ok: { bg: "#E8F8F5", border: "#27AE60", text: "#1ABC9C", icon: "\u2714" },
              info: { bg: "#EBF5FB", border: "#3498DB", text: "#2471A3", icon: "\u2139" },
            };
            var c = colors[s.level] || colors.info;
            return html`
              <div key=${i} style=${{ marginBottom: 10, padding: "0.6rem 0.8rem", background: c.bg, borderRadius: 6, border: "1px solid " + c.border, borderLeft: "4px solid " + c.border }}>
                <div style=${{ fontSize: "0.85rem", fontWeight: 700, color: c.text, marginBottom: 3 }}>
                  <span style=${{ marginRight: 6 }}>${c.icon}</span>${s.title}
                </div>
                <div style=${{ fontSize: "0.8rem", color: "var(--muted)" }}>${s.desc}</div>
              </div>
            `;
          })}
          ${analysis.label_distribution && analysis.label_distribution.length > 0 ? html`
            <div style=${{ marginTop: 12 }}>
              <div style=${{ fontSize: "0.75rem", fontWeight: 700, color: "var(--muted)", marginBottom: 8 }}>标签分布</div>
              <div style=${{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(140px, 1fr))", gap: 6 }}>
                ${analysis.label_distribution.map(function(item) {
                  var pct = analysis.total_samples > 0 ? (item.count / analysis.total_samples * 100) : 0;
                  return html`
                    <div key=${item.label} style=${{ padding: "4px 8px", background: "var(--bg)", borderRadius: 4, fontSize: "0.75rem", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                      <span style=${{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", marginRight: 4 }} title=${item.label}>${item.label}</span>
                      <span style=${{ fontWeight: 700, color: item.count < 5 ? "#E74C3C" : "var(--ink)", flexShrink: 0 }}>${item.count}</span>
                    </div>
                  `;
                })}
              </div>
            </div>
          ` : null}
        </div>
      ` : html`<div style=${{ padding: 20, textAlign: "center", color: "var(--muted)" }}>正在分析数据...</div>`}
    </${Panel}>

    <${Panel} title="单帧识别 vs 视频序列识别">
      <div style=${{ fontSize: "0.85rem", lineHeight: 1.7 }}>
        <div style=${{ padding: "0.75rem 1rem", background: "#EBF5FB", borderRadius: 6, marginBottom: 12, border: "1px solid #AED6F1" }}>
          <strong>当前方案：单帧图像识别</strong>
          <span style=${{ color: "var(--muted)", marginLeft: 8 }}>每次只看一张图片独立判断</span>
        </div>

        <div style=${{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 16 }}>
          <div>
            <h4 style=${{ fontSize: "0.85rem", color: "#27AE60", marginBottom: 6 }}>单帧识别的优势</h4>
            <p style=${{ color: "var(--muted)", margin: 0, fontSize: "0.8rem" }}>
              实现简单、推理速度快、标注成本低、模型轻量。适合判断静态体态：仰卧、侧卧、俯卧、坐姿等。
            </p>
          </div>
          <div>
            <h4 style=${{ fontSize: "0.85rem", color: "#E67E22", marginBottom: 6 }}>单帧识别的局限</h4>
            <p style=${{ color: "var(--muted)", margin: 0, fontSize: "0.8rem" }}>
              无法识别需要多帧才能判断的动作：翻身过程、跌倒过程、试图起身、异常静止（需要知道"静止了多久"）。
            </p>
          </div>
        </div>

        <div style=${{ padding: "0.75rem 1rem", background: "#FEF9E7", borderRadius: 6, marginBottom: 12, border: "1px solid #F7DC6F" }}>
          <strong>进阶方案：视频序列识别（时序模型）</strong>
          <span style=${{ color: "var(--muted)", marginLeft: 8 }}>连续看 4-16 帧判断动作</span>
        </div>

        <div style=${{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 16 }}>
          <div>
            <h4 style=${{ fontSize: "0.85rem", color: "#9B59B6", marginBottom: 6 }}>序列识别能做什么</h4>
            <p style=${{ color: "var(--muted)", margin: 0, fontSize: "0.8rem" }}>
              识别"翻身"（从仰卧到侧卧的连续动作）、"跌倒"（快速下坠轨迹）、"试图起身"（连续起身尝试）、"异常静止"（长时间无变化）。
            </p>
          </div>
          <div>
            <h4 style=${{ fontSize: "0.85rem", color: "#E74C3C", marginBottom: 6 }}>为什么更难做</h4>
            <p style=${{ color: "var(--muted)", margin: 0, fontSize: "0.8rem" }}>
              标注成本高 5-10 倍（要标视频片段而非单张）、模型更复杂（CNN+LSTM/3D-CNN/Transformer）、训练数据需求量大、推理速度慢。
            </p>
          </div>
        </div>

        <div style=${{ padding: "0.75rem 1rem", background: "#E8F8F5", borderRadius: 6, border: "1px solid #27AE60" }}>
          <strong>建议路线</strong>
          <p style=${{ margin: "6px 0 0", color: "var(--muted)", fontSize: "0.8rem" }}>
            先用单帧识别打好基础（覆盖 80% 的体态判断场景），积累足够数据后再逐步引入时序模型处理跌倒、翻身等动态动作。两种模型可以并存：单帧模型负责实时预警，时序模型负责动作确认。
          </p>
        </div>
      </div>
    </${Panel}>
  `;
}

      <div style=${{ fontSize: "0.85rem" }}>该页面功能开发中，敬请期待</div>
    </div>
  `;

/* ===== App ===== */
function App() {
  var s2 = useState("dashboard"); var currentPage = s2[0]; var setCurrentPage = s2[1];
  var s3 = useState(null); var activeModelName = s3[0]; var setActiveModelName = s3[1];

  window._navigate = setCurrentPage;

  useEffect(function() {
    if (isAuthenticated()) {
      apiGet("/models/").then(function(d) {
        if (d && d.length > 0) { var a = d.find(function(m){return m.is_active}); if (a) setActiveModelName(a.name); }
      });
    }
  }, []);

  function handleLogout() {
    apiPost("/auth/logout", {}).then(function() {
      clearAuth();
      window.location.reload();
    });
  }

  if (!isAuthenticated()) return html`<${LoginPage} onLogin=${function(){ window.location.reload(); }} />`;

  var isAdmin = getUserRole() === "admin";
  // Non-admin users cannot access the config page
  var effectivePage = (currentPage === "config" && !isAdmin) ? "dashboard" : currentPage;

  var titles = { dashboard: "工作台", live: "实时画面", annotate: "图片标注", manage: "图片管理", datasets: "数据集管理", samples: "已标注样本", videos: "视频处理", train: "模型训练", models: "模型管理", events: "识别记录", alerts: "告警规则", cameras: "摄像头管理", users: "用户权限", config: "系统配置" };

  var pageMap = {
    dashboard: DashboardPage, live: LivePage, annotate: AnnotationPage, manage: ManagePage, datasets: DatasetsPage, samples: SamplesPage,
    videos: VideosPage, train: TrainPage, models: ModelsPage, events: EventsPage,
    alerts: AlertRulesPage, cameras: CamerasPage, users: UsersPage, config: ConfigPage
  };

  var PageComponent = pageMap[effectivePage] || PlaceholderPage;
  var userName = currentUser ? currentUser.name : "";

  return html`
    <div style=${{ display: "flex", height: "100vh" }}>
      <${Sidebar} currentPage=${effectivePage} onNavigate=${setCurrentPage} activeModelName=${activeModelName} userName=${userName} isAdmin=${isAdmin} />
      <main style=${{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
        <header style=${{ height: 52, background: "#fff", borderBottom: "1px solid var(--rule)", display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 1.5rem", flexShrink: 0 }}>
          <div style=${{ fontSize: "1rem", fontWeight: 600 }}>${titles[effectivePage] || ""}</div>
          <div style=${{ display: "flex", alignItems: "center", gap: 16 }}>
            <button onClick=${function(){window.location.reload()}} style=${{ padding: "4px 12px", fontSize: "0.75rem", border: "1px solid var(--rule)", borderRadius: 4, background: "var(--bg)", cursor: "pointer" }}>\u21BB 刷新</button>
            <div style=${{ display: "flex", alignItems: "center", gap: 8, fontSize: "0.8rem", color: "var(--muted)" }}>
              <div style=${{ width: 28, height: 28, background: "var(--accent)", color: "#fff", borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "0.7rem", fontWeight: 700 }}>${userName ? userName[0] : "U"}</div>
              <span>${userName}</span>
            </div>
            <button onClick=${handleLogout} style=${{ padding: "4px 12px", fontSize: "0.75rem", border: "1px solid var(--rule)", borderRadius: 4, background: "var(--bg)", cursor: "pointer", color: "var(--danger)" }}>退出</button>
          </div>
        </header>
        <div style=${{ flex: 1, overflowY: "auto", padding: "1.5rem" }}>
          <${PageComponent} key=${effectivePage} title=${titles[effectivePage] || ""} />
        </div>
      </main>
    </div>
  `;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
