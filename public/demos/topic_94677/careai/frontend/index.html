<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareAI - 家庭智能照护系统</title>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3/dist/htm.umd.js"></script>
<style>
:root{--bg:#F7F5F2;--ink:#1E1E1E;--muted:#6B6B6B;--rule:#D9D5D0;--accent:#2D6A4F;--danger:#C0392B;--warning:#E67E22;--success:#27AE60;--info:#2980B9}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:15px;color:var(--ink);background:var(--bg)}
#root{height:100vh}
</style>
</head>
<body>
<div id="root"></div>
<script>
var html = htm.bind(React.createElement);
var useState = React.useState;
var useEffect = React.useEffect;
var useRef = React.useRef;

var API = window.location.protocol === "file:" ? "http://127.0.0.1:8000" : "";

/* ===== Auth ===== */
var authToken = localStorage.getItem('careai_token') || '';
var currentUser = JSON.parse(localStorage.getItem('careai_user') || 'null');

function saveAuth(token, user) {
  authToken = token;
  currentUser = user;
  localStorage.setItem('careai_token', token);
  localStorage.setItem('careai_user', JSON.stringify(user));
}

function clearAuth() {
  authToken = '';
  currentUser = null;
  localStorage.removeItem('careai_token');
  localStorage.removeItem('careai_user');
}

function isAuthenticated() {
  return !!authToken;
}

function getUserRole() {
  return currentUser ? currentUser.role : null;
}

function apiGet(path) {
  var headers = {};
  if (authToken) headers["Authorization"] = "Bearer " + authToken;
  return fetch(API + path, { headers: headers }).then(function(r) {
    if (r.status === 401 && authToken) { clearAuth(); window.location.reload(); return null; }
    if (!r.ok) return null;
    return r.json();
  }).catch(function() { return null; });
}

function apiPost(path, body) {
  var headers = { "Content-Type": "application/json" };
  if (authToken) headers["Authorization"] = "Bearer " + authToken;
  return fetch(API + path, {
    method: "POST",
    headers: headers,
    body: JSON.stringify(body)
  }).then(function(r) {
    if (r.status === 401 && authToken) { clearAuth(); window.location.reload(); return null; }
    if (!r.ok) return null;
    return r.json();
  }).catch(function() { return null; });
}

function apiDelete(path) {
  return fetch(API + path, { method: "DELETE" }).then(function(r) {
    if (!r.ok) return null;
    return r.json();
  }).catch(function() { return null; });
}

function apiUpload(path, formData) {
  return fetch(API + path, { method: "POST", body: formData }).then(function(r) {
    if (!r.ok) return null;
    return r.json();
  }).catch(function() { return null; });
}

/* ===== Login ===== */
function LoginPage(props) {
  var s = useState("admin"); var email = s[0]; var setEmail = s[1];
  var s2 = useState("admin123"); var password = s2[0]; var setPassword = s2[1];
  var s3 = useState(""); var error = s3[0]; var setError = s3[1];
  var s4 = useState(false); var loading = s4[0]; var setLoading = s4[1];

  function handleSubmit(e) {
    e.preventDefault();
    setError(""); setLoading(true);
    apiPost("/auth/login", { email: email, password: password }).then(function(result) {
      setLoading(false);
      if (result && result.token && result.user) {
        saveAuth(result.token, result.user);
        window.location.reload();
      } else {
        setError((result && result.detail) ? result.detail : "邮箱或密码错误");
      }
    });
  }

  return html`
    <div style=${{ height: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "var(--bg)" }}>
      <div style=${{ width: 360, background: "#fff", borderRadius: 8, padding: "2.5rem", boxShadow: "0 2px 12px rgba(0,0,0,0.08)" }}>
        <div style=${{ textAlign: "center", marginBottom: 28 }}>
          <h1 style=${{ fontSize: "1.4rem", color: "var(--accent)", marginBottom: 6 }}>CareAI 智能照护系统</h1>
          <div style=${{ fontSize: "0.8rem", color: "var(--muted)" }}>家庭智能照护</div>
        </div>
        <form onSubmit=${handleSubmit}>
          <div style=${{ marginBottom: 16 }}>
            <label style=${{ display: "block", fontSize: "0.8rem", fontWeight: 600, marginBottom: 6 }}>邮箱 / 用户名</label>
            <input type="text" value=${email} onInput=${function(e){setEmail(e.target.value)}}
              style=${{ width: "100%", padding: "10px 12px", border: "1px solid var(--rule)", borderRadius: 4, fontSize: "0.85rem" }} placeholder="admin" required />
          </div>
          <div style=${{ marginBottom: 16 }}>
            <label style=${{ display: "block", fontSize: "0.8rem", fontWeight: 600, marginBottom: 6 }}>密码</label>
            <input type="password" value=${password} onInput=${function(e){setPassword(e.target.value)}}
              style=${{ width: "100%", padding: "10px 12px", border: "1px solid var(--rule)", borderRadius: 4, fontSize: "0.85rem" }} placeholder="请输入密码" required />
          </div>
          ${error && html`<div style=${{ color: "var(--danger)", fontSize: "0.8rem", marginBottom: 12 }}>${error}</div>`}
          <button type="submit" disabled=${loading}
            style=${{ width: "100%", padding: "11px", background: loading ? "var(--rule)" : "var(--accent)", color: "#fff", border: "none", borderRadius: 4, fontWeight: 600, cursor: loading ? "default" : "pointer", fontSize: "0.9rem" }}>
            ${loading ? "登录中..." : "登录"}
          </button>
        </form>
        <div style=${{ marginTop: 20, paddingTop: 16, borderTop: "1px solid var(--rule)", fontSize: "0.75rem", color: "var(--muted)", textAlign: "center" }}>
          默认管理员: admin / admin123
        </div>
      </div>
    </div>
  `;
}

/* ===== Shared ===== */
function EmptyState(props) {
  return html`
    <div style=${{ textAlign: "center", padding: "2rem", color: "var(--muted)" }}>
      <div style=${{ fontSize: "1.5rem", marginBottom: 8, opacity: 0.3 }}>\u2014</div>
      <div style=${{ fontSize: "0.85rem" }}>${props.text || "暂无数据"}</div>
    </div>
  `;
}

function Loading() {
  return html`<div style=${{ textAlign: "center", padding: "2rem", color: "var(--muted)" }}>加载中...</div>`;
}

function StatCard(props) {
  return html`
    <div style=${{ background: "#fff", border: "1px solid var(--rule)", borderRadius: 6, padding: "1.25rem" }}>
      <div style=${{ fontSize: "0.75rem", color: "var(--muted)", marginBottom: 8 }}>${props.label}</div>
      <div style=${{ fontSize: "1.8rem", fontWeight: 700 }}>${props.value}</div>
      ${props.sub && html`<div style=${{ fontSize: "0.7rem", color: "var(--muted)", marginTop: 6 }}>${props.sub}</div>`}
    </div>
  `;
}

function Panel(props) {
  return html`
    <div style=${{ background: "#fff", border: "1px solid var(--rule)", borderRadius: 6, marginBottom: 16 }}>
      <div style=${{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0.9rem 1.25rem", borderBottom: "1px solid var(--rule)" }}>
        <span style=${{ fontSize: "0.9rem", fontWeight: 600 }}>${props.title}</span>
        ${props.action}
      </div>
      <div style=${{ padding: "1rem 1.25rem" }}>${props.children}</div>
    </div>
  `;
}

function EventBadge(props) {
  var colors = { P0: { bg: "#FADBD8", text: "#C0392B" }, P1: { bg: "#FCF3CF", text: "#B7950B" }, P2: { bg: "#D5F5E3", text: "#1E8449" }, P3: { bg: "#E8E8E8", text: "#6B6B6B" } };
  var c = colors[props.level] || colors.P3;
  return html`<span style=${{ fontSize: "0.65rem", fontWeight: 700, padding: "2px 8px", borderRadius: 3, background: c.bg, color: c.text }}>${props.level}</span>`;
}

/* ===== Sidebar ===== */
function Sidebar(props) {
  var systemItems = [{ key: "cameras", label: "摄像头管理" }, { key: "users", label: "用户权限" }];
  if (props.isAdmin) systemItems.push({ key: "config", label: "系统配置" });
  var navGroups = [
    { title: "概览", items: [{ key: "dashboard", label: "工作台" }, { key: "live", label: "实时画面" }] },
    { title: "数据准备", items: [{ key: "annotate", label: "图片标注" }, { key: "manage", label: "图片管理" }, { key: "datasets", label: "数据集管理" }, { key: "samples", label: "已标注样本" }, { key: "videos", label: "视频处理" }] },
    { title: "模型", items: [{ key: "train", label: "模型训练" }, { key: "models", label: "模型管理" }] },
    { title: "记录与通知", items: [{ key: "events", label: "识别记录" }, { key: "alerts", label: "告警规则" }] },
    { title: "系统", items: systemItems }
  ];

  return html`
    <aside style=${{ width: 220, background: "#fff", borderRight: "1px solid var(--rule)", display: "flex", flexDirection: "column", flexShrink: 0, height: "100vh" }}>
      <div style=${{ padding: "1.25rem 1.5rem", borderBottom: "1px solid var(--rule)" }}>
        <h1 style=${{ fontSize: "1.1rem", fontWeight: 700, color: "var(--accent)", display: "flex", alignItems: "center", gap: 8 }}>
          CareAI <span style=${{ fontSize: "0.6rem", background: "var(--accent)", color: "#fff", padding: "2px 6px", borderRadius: 3, fontWeight: 600 }}>BETA</span>
        </h1>
        <div style=${{ fontSize: "0.7rem", color: "var(--muted)", marginTop: 4 }}>家庭智能照护系统 v0.1.0</div>
      </div>
      <nav style=${{ flex: 1, overflowY: "auto", padding: "0.75rem 0" }}>
        ${navGroups.map(function(g) {
          return html`
            <div key=${g.title} style=${{ marginBottom: 8 }}>
              <div style=${{ fontSize: "0.7rem", fontWeight: 700, color: "var(--muted)", textTransform: "uppercase", letterSpacing: "0.05em", padding: "0.75rem 1.5rem 0.35rem" }}>${g.title}</div>
              ${g.items.map(function(item) {
                var active = props.currentPage === item.key;
                return html`
                  <a key=${item.key} href="#" onClick=${function(e){ e.preventDefault(); props.onNavigate(item.key); }} style=${{
                    display: "flex", alignItems: "center", gap: 10, padding: "0.7rem 1.5rem",
                    color: active ? "var(--accent)" : "var(--ink)", textDecoration: "none", fontSize: "0.9rem", cursor: "pointer",
                    background: active ? "rgba(45,106,79,0.08)" : "transparent",
                    borderLeft: active ? "3px solid var(--accent)" : "3px solid transparent",
                    fontWeight: active ? 600 : 400
                  }}>${item.label}</a>
                `;
              })}
            </div>
          `;
        })}
      </nav>
      <div style=${{ padding: "0.75rem 1.5rem", borderTop: "1px solid var(--rule)", fontSize: "0.75rem", color: "var(--muted)" }}>
        <span style=${{ display: "inline-block", width: 7, height: 7, background: "var(--success)", borderRadius: "50%", marginRight: 6 }}></span>
        系统运行正常
        ${props.activeModelName && html`<div style=${{ marginTop: 4 }}>当前模型: ${props.activeModelName}</div>`}
        ${props.userName && html`<div style=${{ marginTop: 4, color: "var(--accent)", fontWeight: 600 }}>用户: ${props.userName}</div>`}
      </div>
    </aside>
  `;
}

/* ===== Dashboard ===== */
function DashboardPage() {
  var s1 = useState(null); var stats = s1[0]; var setStats = s1[1];
  var s2 = useState(null); var events = s2[0]; var setEvents = s2[1];
  var s3 = useState(null); var activeModel = s3[0]; var setActiveModel = s3[1];

  useEffect(function() {
    apiGet("/dashboard/stats").then(function(d) { if (d) setStats(d); });
    apiGet("/dashboard/recent-events").then(function(d) { if (d) setEvents(d); });
    apiGet("/models/").then(function(d) {
      if (d) { var m = d.find(function(x){return x.is_active}) || d[0] || null; setActiveModel(m); }
    });
  }, []);

  return html`
    <div>
      <div style=${{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 16, marginBottom: 24 }}>
        <${StatCard} label="今日告警事件" value=${stats ? stats.today_events : "--"} sub=${stats && stats.today_events > 0 ? "需要关注" : "今日暂无告警"} />
        <${StatCard} label="模型识别准确率" value=${stats ? stats.model_accuracy + "%" : "--"} sub="基于当前生效模型" />
        <${StatCard} label="已标注样本" value=${stats ? stats.annotated_samples : "--"} sub="来自后端统计" />
        <${StatCard} label="摄像头在线" value=${stats ? stats.online_cameras : "--"} sub=${stats ? (stats.online_cameras === "0/0" ? "未配置摄像头" : "实时状态") : "加载中"} />
      </div>

      <${Panel} title="最近告警事件" action=${html`<button onClick=${function(){window._navigate("events")}} style=${{ padding: "4px 12px", fontSize: "0.75rem", border: "1px solid var(--rule)", borderRadius: 4, background: "var(--bg)", cursor: "pointer" }}>查看全部</button>`}>
        ${events === null ? html`<${Loading} />` :
          events.length === 0 ? html`<${EmptyState} text="暂无告警事件" />` :
            html`<ul style=${{ listStyle: "none", padding: 0 }}>
              ${events.map(function(e) {
                return html`
                  <li key=${e.id} style=${{ display: "flex", alignItems: "flex-start", gap: 12, padding: "10px 0", borderBottom: "1px solid var(--rule)" }}>
                    <span style=${{ fontSize: "0.75rem", color: "var(--muted)", fontFamily: "monospace", minWidth: 50 }}>${e.created_at ? String(e.created_at).slice(11, 16) : "--"}</span>
                    <${EventBadge} level=${e.risk_level} />
                    <div style=${{ flex: 1, fontSize: "0.85rem" }}>
                      <strong>${e.event_type}</strong> \u2014 ${e.description}
                      <div style=${{ fontSize: "0.75rem", color: "var(--muted)", marginTop: 4 }}>置信度 ${e.confidence != null ? (e.confidence * 100).toFixed(1) : "--"}%</div>
                    </div>
                  </li>
                `;
              })}
            </ul>`
        }
      </${Panel}>

      <${Panel} title="模型状态" action=${html`<button onClick=${function(){window._navigate("models")}} style=${{ padding: "4px 12px", fontSize: "0.75rem", border: "1px solid var(--rule)", borderRadius: 4, background: "var(--bg)", cursor: "pointer" }}>模型中心</button>`}>
        ${activeModel ? html`
          <div style=${{ display: "flex", alignItems: "center", gap: 16, padding: "0.5rem" }}>
            <div style=${{ width: 48, height: 48, background: "rgba(45,106,79,0.1)", borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center", fontSize: "1.3rem" }}>\u26A1</div>
            <div style=${{ flex: 1 }}>
              <div style=${{ fontSize: "0.9rem", fontWeight: 600, marginBottom: 4 }}>
                当前生效模型 \u2014 ${activeModel.name}
                ${activeModel.is_active && html`<span style=${{ fontSize: "0.75rem", color: "var(--success)", fontWeight: 700, marginLeft: 8 }}>运行中</span>`}
              </div>
              <div style=${{ fontSize: "0.75rem", color: "var(--muted)" }}>
                创建于 ${activeModel.created_at ? String(activeModel.created_at).replace("T", " ").slice(0, 19) : "--"}
                ${activeModel.num_samples ? " | 基于 " + activeModel.num_samples.toLocaleString() + " 张标注样本" : ""}
                ${activeModel.num_labels ? " | " + activeModel.num_labels + " 个标签" : ""}
              </div>
              ${activeModel.accuracy != null && html`
                <div style=${{ width: "100%", height: 6, background: "var(--rule)", borderRadius: 3, marginTop: 8, overflow: "hidden" }}>
                  <div style=${{ width: (activeModel.accuracy * 100) + "%", height: "100%", background: "var(--accent)", borderRadius: 3 }}></div>
                </div>
              `}
            </div>
          </div>
        ` : html`<${EmptyState} text="暂无模型" />`}
      </${Panel}>
    </div>
  `;
}

/* ===== Events ===== */
function EventsPage() {
  var s1 = useState(null); var events = s1[0]; var setEvents = s1[1];
  var s2 = useState(""); var filterLevel = s2[0]; var setFilterLevel = s2[1];

  useEffect(function() {
    var path = filterLevel ? "/events/?risk_level=" + filterLevel : "/events/";
    apiGet(path).then(function(d) { if (d) setEvents(d); });
  }, [filterLevel]);

  return html`
    <${Panel} title="识别记录" action=${html`
      <select value=${filterLevel} onInput=${function(e){setFilterLevel(e.target.value)}} style=${{ padding: "4px 10px", fontSize: "0.8rem", border: "1px solid var(--rule)", borderRadius: 4, background: "var(--bg)" }}>
        <option value="">全部等级</option><option value="P0">P0</option><option value="P1">P1</option><option value="P2">P2</option><option value="P3">P3</option>
      </select>
    `}>
      ${events === null ? html`<${Loading} />` :
        events.length === 0 ? html`<${EmptyState} text="暂无识别记录" />` :
          html`<div style=${{ overflowX: "auto" }}>
            <table style=${{ width: "100%", borderCollapse: "collapse", fontSize: "0.85rem" }}>
              <thead>
                <tr style=${{ fontSize: "0.75rem", fontWeight: 700, color: "var(--muted)", background: "var(--bg)" }}>
                  <th style=${{ padding: "10px 12px", textAlign: "left" }}>时间</th>
                  <th style=${{ padding: "10px 12px", textAlign: "left" }}>风险</th>
                  <th style=${{ padding: "10px 12px", textAlign: "left" }}>状态</th>
                  <th style=${{ padding: "10px 12px", textAlign: "left" }}>描述</th>
                  <th style=${{ padding: "10px 12px", textAlign: "left" }}>置信度</th>
                </tr>
              </thead>
              <tbody>
                ${events.map(function(e) {
                  return html`
                    <tr key=${e.id} style=${{ borderBottom: "1px solid var(--rule)" }}>
                      <td style=${{ padding: "10px 12px", fontFamily: "monospace", fontSize: "0.8rem" }}>${e.created_at ? String(e.created_at).slice(11, 16) : "--"}</td>
                      <td style=${{ padding: "10px 12px" }}><${EventBadge} level=${e.risk_level} /></td>
                      <td style=${{ padding: "10px 12px" }}>${e.event_type}</td>
                      <td style=${{ padding: "10px 12px" }}>${e.description}</td>
                      <td style=${{ padding: "10px 12px" }}>${e.confidence != null ? (e.confidence * 100).toFixed(1) + "%" : "--"}</td>
                    </tr>
                  `;
                })}
              </tbody>
            </table>
          </div>`
      }
    </${Panel}>
  `;
}

/* ===== Alert Rules ===== */
function AlertRulesPage() {
  var s = useState(null); var rules = s[0]; var setRules = s[1];
  useEffect(function() { apiGet("/alerts/rules").then(function(d) { if (d) setRules(d); }); }, []);

  var lc = { P0: "var(--danger)", P1: "var(--warning)", P2: "var(--success)", P3: "var(--muted)" };

  return html`
    <${Panel} title="告警规则配置" action=${html`<button style=${{ padding: "6px 16px", background: "var(--accent)", color: "#fff", border: "none", borderRadius: 4, fontSize: "0.8rem", fontWeight: 600, cursor: "pointer" }}>保存更改</button>`}>
      ${rules === null ? html`<${Loading} />` :
        rules.length === 0 ? html`<${EmptyState} text="暂无告警规则" />` :
          html`<div style=${{ overflowX: "auto" }}>
            <table style=${{ width: "100%", borderCollapse: "collapse", fontSize: "0.85rem", minWidth: 700 }}>
              <thead>
                <tr style=${{ fontSize: "0.75rem", fontWeight: 700, color: "var(--muted)", borderBottom: "2px solid var(--rule)" }}>
                  <th style=${{ padding: "10px 12px", textAlign: "left" }}>状态名称</th>
                  <th style=${{ padding: "10px 12px", textAlign: "left" }}>风险等级</th>
                  <th style=${{ padding: "10px 12px", textAlign: "left" }}>触发条件</th>
                  <th style=${{ padding: "10px 12px", textAlign: "left" }}>通知方式</th>
                  <th style=${{ padding: "10px 12px", textAlign: "left" }}>通知对象</th>
                </tr>
              </thead>
              <tbody>
                ${rules.map(function(r) {
                  return html`
                    <tr key=${r.id} style=${{ borderBottom: "1px solid var(--rule)" }}>
                      <td style=${{ padding: "10px 12px", fontWeight: 600 }}>${r.state_name}</td>
                      <td style=${{ padding: "10px 12px", color: lc[r.risk_level], fontWeight: 700 }}>${r.risk_level}</td>
                      <td style=${{ padding: "10px 12px" }}>${r.trigger_condition}</td>
                      <td style=${{ padding: "10px 12px" }}>${r.notify_method}</td>
                      <td style=${{ padding: "10px 12px" }}>${r.notify_targets}</td>
                    </tr>
                  `;
                })}
              </tbody>
            </table>
          </div>`
      }
    </${Panel}>
  `;
}

/* ===== Models ===== */
function ModelsPage() {
  var s = useState(null); var models = s[0]; var setModels = s[1];
  useEffect(function() { apiGet("/models/").then(function(d) { if (d) setModels(d); }); }, []);

  return html`
    <div>
      <div style=${{ borderBottom: "1px solid var(--rule)", marginBottom: 16 }}>
        <div style=${{ padding: "10px 16px", fontSize: "0.85rem", borderBottom: "2px solid var(--accent)", marginBottom: -1, color: "var(--accent)", fontWeight: 600, display: "inline-block" }}>模型列表</div>
      </div>
      <div style=${{ marginBottom: 16, padding: "0.75rem 1rem", background: "var(--bg)", borderRadius: 6, fontSize: "0.75rem", color: "var(--muted)" }}>
        <div style=${{ fontWeight: 700, marginBottom: 6, color: "var(--ink)" }}>模型状态说明</div>
        <div style=${{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "4px 16px" }}>
          <div><span style=${{ color: "var(--success)", fontWeight: 600 }}>\u5c31\u7eea</span>\uff1a\u8bad\u7ec3\u5b8c\u6210\uff0c\u53ef\u7528\u4e8e\u63a8\u7406\u8bc6\u522b</div>
          <div><span style=${{ color: "#F39C12", fontWeight: 600 }}>\u8bad\u7ec3\u4e2d</span>\uff1a\u6b63\u5728\u8bad\u7ec3\uff0c\u8bf7\u7b49\u5f85\u5b8c\u6210</div>
          <div><span style=${{ color: "var(--muted)", fontWeight: 600 }}>\u51c6\u5907\u4e2d</span>\uff1a\u6b63\u5728\u52a0\u8f7d\u6570\u636e\u548c\u6784\u5efa\u6a21\u578b</div>

        </div>
      </div>
      ${models === null ? html`<${Loading} />` :
        models.length === 0 ? html`<${EmptyState} text="暂无模型版本" />` :

                  </div>
                  <div style=${{ fontSize: "0.75rem", color: "var(--muted)" }}>

                    ${m.num_labels ? " | " + m.num_labels + " 个标签" : ""}
                    ${m.accuracy != null ? " | 准确率 " + (m.accuracy * 100).toFixed(1) + "%" : ""}
                  </div>
                </div>
                <div style=${{ display: "flex", gap: 8 }}>
                  ${cnStatus === "训练中" ? html`
                    <button onClick=${function(){
                      fetch(API + "/train/stop", { method: "POST" }).then(function(r) { return r.json(); }).then(function(d) {

                      });

                  ` : null}
                  ${!m.is_active && cnStatus !== "训练中" ? html`<button onClick=${function(){apiPost("/models/switch/" + m.id).then(function(){window.location.reload()})}} style=${{ padding: "4px 12px", fontSize: "0.75rem", border: "1px solid var(--rule)", borderRadius: 4, background: "var(--bg)", cursor: "pointer" }}>切换</button>` : null}
                  ${!m.is_active && cnStatus !== "训练中" ? html`
                    <button onClick=${function(){
                      if (!confirm("确定删除模型 \"" + m.name + "\" 吗？此操作不可恢复。")) return;
                      fetch(API + "/models/" + m.id, { method: "DELETE" }).then(function(r) {
                        if (!r.ok) { return r.json().then(function(d) { alert(d.detail || "删除失败"); }); }
                        apiGet("/models/").then(function(dd) { if (dd) setModels(dd); });

                  ` : null}
                  <button style=${{ padding: "4px 12px", fontSize: "0.75rem", border: "1px solid var(--rule)", borderRadius: 4, background: "var(--bg)", cursor: "pointer" }}>导出</button>
                </div>
              </div>
            `;
          })
      }
    </div>
  `;
}

/* ===== Datasets ===== */
function DatasetsPage() {

  var s5 = useState(""); var newDesc = s5[0]; var setNewDesc = s5[1];
  var s6 = useState("all"); var newCam = s6[0]; var setNewCam = s6[1];

  function loadDatasets() {
    apiGet("/datasets/").then(function(d) { if (d) setDatasets(d); });
  }

  useEffect(function() {
    loadDatasets();
    apiGet("/cameras/").then(function(d) { if (d) setCameras(d); });
    apiGet("/datasets/").then(function(d) { if (d) setDatasets(d); });
  }, []);

  function handleCreate() {
    if (!newName.trim()) { alert("请输入数据集名称"); return; }
    var payload = { name: newName.trim(), description: newDesc.trim() };
    if (newCam !== "all") payload.camera_id = parseInt(newCam);
    apiPost("/datasets/", payload).then(function(d) {
      if (d && d.id) {
        setShowCreate(false); setNewName(""); setNewDesc(""); setNewCam("all");
        loadDatasets();
      }

  function handleDelete(id, name) {
    if (!confirm("确认删除数据集「" + name + "」？数据集中的图片不会被删除，仅解除关联。")) return;
    apiDelete("/datasets/" + id).then(function() { loadDatasets(); });
  }

  function handleAssignCamera(dsId, camId) {
    apiPost("/datasets/" + dsId + "/assign-camera/" + camId, {}).then(function(d) {
      if (d && d.ok) { loadDatasets(); alert("已分配 " + d.assigned + " 张图片到数据集"); }
    });

  return html`
    <${Panel} title="数据集管理" action=${html`<button onClick=${function(){setShowCreate(!showCreate)}} style=${{ padding: "6px 16px", background: "var(--accent)", color: "#fff", border: "none", borderRadius: 4, fontSize: "0.8rem", fontWeight: 600, cursor: "pointer" }}>+ 新建数据集</button>`}>
      ${showCreate ? html`
        <div style=${{ padding: "1rem", background: "var(--bg)", borderRadius: 6, marginBottom: 16 }}>
          <div style=${{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12, marginBottom: 12 }}>
            <div>
              <label style=${{ display: "block", fontSize: "0.75rem", fontWeight: 600, marginBottom: 4 }}>名称</label>
              <input type="text" value=${newName} onInput=${function(e){setNewName(e.target.value)}} placeholder="如：跌倒检测训练集" style=${{ width: "100%", padding: "6px 10px", border: "1px solid var(--rule)", borderRadius: 4, fontSize: "0.8rem" }} />
            </div>
            <div>
              <label style=${{ display: "block", fontSize: "0.75rem", fontWeight: 600, marginBottom: 4 }}>关联摄像头（可选）</label>
              <select value=${newCam} onChange=${function(e){setNewCam(e.target.value)}} style=${{ width: "100%", padding: "6px 10px", border: "1px solid var(--rule)", borderRadius: 4, fontSize: "0.8rem" }}>
                <option value="all">不关联摄像头</option>
                ${cameras.map(function(c) { return html`<option key=${c.id} value=${c.id}>${c.name}</option>`; })}
              </select>
            </div>
            <div>
              <label style=${{ display: "block", fontSize: "0.75rem", fontWeight: 600, marginBottom: 4 }}>描述</label>
              <input type="text" value=${newDesc} onInput=${function(e){setNewDesc(e.target.value)}} placeholder="数据集说明" style=${{ width: "100%", padding: "6px 10px", border: "1px solid var(--rule)", borderRadius: 4, fontSize: "0.8rem" }} />
            </div>
          </div>
          <div style=${{ display: "flex", gap: 8 }}>
            <button onClick=${handleCreate} style=${{ padding: "6px 16px", background: "var(--accent)", color: "#fff", border: "none", borderRadius: 4, fontSize: "0.8rem", cursor: "pointer" }}>创建</button>
            <button onClick=${function(){setShowCreate(false)}} style=${{ padding: "6px 16px", background: "var(--bg)", color: "var(--ink)", border: "1px solid var(--rule)", borderRadius: 4, fontSize: "0.8rem", cursor: "pointer" }}>取消</button>
          </div>
        </div>
      ` : null}
      ${datasets === null ? html`<${Loading} />` :
        datasets.length === 0 ? html`<${EmptyState} text="暂无数据集，请点击上方按钮创建" />` :
          html`<div style=${{ overflowX: "auto" }}>
            <table style=${{ width: "100%", borderCollapse: "collapse", fontSize: "0.85rem" }}>
              <thead>
                <tr style=${{ fontSize: "0.75rem", fontWeight: 700, color: "var(--muted)", background: "var(--bg)" }}>
                  <th style=${{ padding: "10px 12px", textAlign: "left" }}>名称</th>
                  <th style=${{ padding: "10px 12px", textAlign: "left" }}>关联摄像头</th>
                  <th style=${{ padding: "10px 12px", textAlign: "left" }}>图片数</th>
                  <th style=${{ padding: "10px 12px", textAlign: "left" }}>已标注</th>
                  <th style=${{ padding: "10px 12px", textAlign: "left" }}>创建时间</th>
                  <th style=${{ padding: "10px 12px", textAlign: "left" }}>操作</th>
                </tr>
              </thead>
              <tbody>
                ${datasets.map(function(ds) {
                  return html`
                    <tr key=${ds.id} style=${{ borderBottom: "1px solid var(--rule)" }}>
                      <td style=${{ padding: "10px 12px", fontWeight: 600 }}>${ds.name}</td>
                      <td style=${{ padding: "10px 12px", fontSize: "0.8rem", color: "var(--muted)" }}>${ds.camera_name || "--"}</td>
                      <td style=${{ padding: "10px 12px" }}>${ds.frame_count}</td>
                      <td style=${{ padding: "10px 12px", color: ds.annotated_count > 0 ? "var(--success)" : "var(--muted)" }}>${ds.annotated_count}</td>
                      <td style=${{ padding: "10px 12px", fontSize: "0.75rem", color: "var(--muted)" }}>${ds.created_at ? String(ds.created_at).replace("T", " ").slice(0, 19) : "--"}</td>
                      <td style=${{ padding: "10px 12px" }}>
                        <select onChange=${function(e){ if(e.target.value) { handleAssignCamera(ds.id, parseInt(e.target.value)); e.target.value=""; } }} style=${{ padding: "3px 8px", fontSize: "0.72rem", border: "1px solid var(--rule)", borderRadius: 4, marginRight: 4 }}>
                          <option value="">分配摄像头数据...</option>
                          ${cameras.map(function(c) { return html`<option key=${c.id} value=${c.id}>导入 ${c.name} 的全部图片</option>`; })}
                        </select>
                        <button onClick=${function(){handleDelete(ds.id, ds.name)}} style=${{ padding: "3px 10px", fontSize: "0.75rem", border: "1px solid var(--rule)", borderRadius: 4, background: "var(--bg)", cursor: "pointer" }}>删除</button>
                      </td>
                    </tr>
                  `;
                })}
              </tbody>
            </table>
          </div>`
      }
    </${Panel}>
  `;
}

/* ===== Users ===== */
function UsersPage() {
  var s = useState(null); var users = s[0]; var setUsers = s[1];
  var sm = useState(false); var showModal = sm[0]; var setShowModal = sm[1];
  var se = useState(null); var editUser = se[0]; var setEditUser = se[1];
  var sf = useState({ name: "", email: "", password: "", role: "viewer", notify_levels: "P0" }); var formData = sf[0]; var setFormData = sf[1];
  var ser = useState(""); var errMsg = ser[0]; var setErrMsg = ser[1];

  function loadUsers() { apiGet("/users/").then(function(d) { if (d) setUsers(d); }); }
  useEffect(function() { loadUsers(); }, []);

  var rl = { admin: "管理员", caregiver: "护工", family: "家庭成员", viewer: "访客" };
  var rc = { admin: "var(--accent)", caregiver: "var(--warning)", family: "var(--info)", viewer: "var(--muted)" };

  function openAdd() {
    setEditUser(null);
    setFormData({ name: "", email: "", password: "", role: "viewer", notify_levels: "P0" });
    setErrMsg("");
    setShowModal(true);
  }

  function openEdit(u) {
    setEditUser(u);
    setFormData({ name: u.name, email: u.email, password: "", role: u.role, notify_levels: u.notify_levels || "P0" });
    setErrMsg("");
    setShowModal(true);
  }

  function handleSave() {
    setErrMsg("");
    if (!formData.name.trim() || !formData.email.trim()) { setErrMsg("姓名和账号不能为空"); return; }
    if (!editUser && !formData.password.trim()) { setErrMsg("新用户必须设置密码"); return; }

    var body = { name: formData.name.trim(), email: formData.email.trim(), role: formData.role, notify_levels: formData.notify_levels };
    if (formData.password.trim()) body.password = formData.password.trim();

    if (editUser) {
      fetch(API + "/users/" + editUser.id, {
        method: "PUT", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + authToken },
        body: JSON.stringify(body)
      }).then(function(r) {
        if (!r.ok) return r.json().then(function(d) { throw new Error(d.detail || "更新失败"); });
        return r.json();
      }).then(function() { setShowModal(false); loadUsers(); }).catch(function(e) { setErrMsg(e.message || "操作失败"); });
    } else {
      fetch(API + "/users/", {
        method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + authToken },
        body: JSON.stringify(body)
      }).then(function(r) {
        if (!r.ok) return r.json().then(function(d) { throw new Error(d.detail || "创建失败"); });
        return r.json();
      }).then(function() { setShowModal(false); loadUsers(); }).catch(function(e) { setErrMsg(e.message || "操作失败"); });
    }
  }

  function handleDelete(u) {
    if (!confirm("确定删除用户 \"" + u.name + "\" 吗？")) return;
    fetch(API + "/users/" + u.id, { method: "DELETE", headers: { "Authorization": "Bearer " + authToken } })
      .then(function(r) { if (!r.ok) return r.json().then(function(d) { alert(d.detail || "删除失败"); }); loadUsers(); });
  }

  function handleResetPassword(u) {
    var newPwd = prompt("为 \"" + u.name + "\" 设置新密码：");
    if (!newPwd) return;
    fetch(API + "/users/" + u.id + "/reset-password", {
      method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + authToken },
      body: JSON.stringify({ password: newPwd })
    }).then(function(r) {
      if (!r.ok) return r.json().then(function(d) { alert(d.detail || "重置失败"); });
      else alert("密码已重置");
    });
  }

  function updateField(key, val) { setFormData(Object.assign({}, formData, (function(o) { o[key] = val; return o; })({}))); }

  return html`
    <${Panel} title="用户与权限" action=${html`<button onClick=${openAdd} style=${{ padding: "6px 16px", background: "var(--accent)", color: "#fff", border: "none", borderRadius: 4, fontSize: "0.8rem", fontWeight: 600, cursor: "pointer" }}>+ 添加用户</button>`}>
      ${users === null ? html`<${Loading} />` :
        users.length === 0 ? html`<${EmptyState} text="暂无用户，请点击上方按钮添加" />` :
          html`<div style=${{ overflowX: "auto" }}>
            <table style=${{ width: "100%", borderCollapse: "collapse", fontSize: "0.85rem" }}>
              <thead>
                <tr style=${{ fontSize: "0.75rem", fontWeight: 700, color: "var(--muted)", background: "var(--bg)" }}>
                  <th style=${{ padding: "10px 12px", textAlign: "left" }}>用户</th>
                  <th style=${{ padding: "10px 12px", textAlign: "left" }}>角色</th>
                  <th style=${{ padding: "10px 12px", textAlign: "left" }}>通知接收</th>
                  <th style=${{ padding: "10px 12px", textAlign: "left" }}>操作</th>
                </tr>
              </thead>
              <tbody>
                ${users.map(function(u) {
                  return html`
                    <tr key=${u.id} style=${{ borderBottom: "1px solid var(--rule)" }}>
                      <td style=${{ padding: "10px 12px" }}><strong>${u.name}</strong>${u.role === "admin" ? html`<span style=${{ fontSize: "0.65rem", color: "var(--accent)", marginLeft: 4 }}>(当前登录)</span>` : ""}<br/><span style=${{ fontSize: "0.75rem", color: "var(--muted)" }}>${u.email}</span></td>
                      <td style=${{ padding: "10px 12px" }}><span style=${{ background: rc[u.role] || "var(--muted)", color: "#fff", padding: "2px 8px", borderRadius: 3, fontSize: "0.7rem", fontWeight: 600 }}>${rl[u.role] || u.role}</span></td>
                      <td style=${{ padding: "10px 12px" }}>${u.notify_levels || "P0"}</td>
                      <td style=${{ padding: "10px 12px", display: "flex", gap: 6 }}>

/* ===== Annotation ===== */
function AnnotationPage() {
  var s1 = useState(null); var frames = s1[0]; var setFrames = s1[1];
  var s2 = useState(0); var currentIndex = s2[0]; var setCurrentIndex = s2[1];
  var s3 = useState([]); var selectedTags = s3[0]; var setSelectedTags = s3[1];
  var s3b = useState(""); var customLabel = s3b[0]; var setCustomLabel = s3b[1];
  var s3c = useState(new Set()); var annotatedIds = s3c[0]; var setAnnotatedIds = s3c[1];
  var s4 = useState(null); var autoJob = s4[0]; var setAutoJob = s4[1];
  var s5 = useState(false); var autoRunning = s5[0]; var setAutoRunning = s5[1];
  var aaPollRef = useRef(null);
  var keepTagsRef = useRef(false);  // When true, skip tag reset on frame switch (save & next)
  var sp = useState(false); var showOriginal = sp[0]; var setShowOriginal = sp[1];
  var sp2 = useState(false); var isPrivate = sp2[0]; var setIsPrivate = sp2[1];
  var sc = useState([]); var cameras = sc[0]; var setCameras = sc[1];
  var scv = useState("all"); var selectedCam = scv[0]; var setSelectedCam = scv[1];
  var sd = useState([]); var datasets = sd[0]; var setDatasets = sd[1];
  var sdv = useState("all"); var selectedDs = sdv[0]; var setSelectedDs = sdv[1];

  // Privacy labels that should trigger image blurring
  var PRIVACY_LABELS = ["上身裸露", "下身裸露", "更衣中"];
  function hasPrivacyLabel(labels) {
    if (!labels) return false;
    var arr = Array.isArray(labels) ? labels : String(labels).split(",").map(function(t) { return t.trim(); }).filter(function(t) { return t; });
    return arr.some(function(t) { return PRIVACY_LABELS.indexOf(t) >= 0; });
  }

  // Thumbnail click: use window event with currentIndex ref to avoid stale closure
  var idxRef = useRef(0);
  useEffect(function() { idxRef.current = currentIndex; }, [currentIndex]);

  useEffect(function() {
    var handler = function(e) {
      var btn = e.target.closest("button[data-idx]");
      if (btn) {
        // Check if it's inside a thumbnail strip (parent has overflowX auto)
        var parent = btn.parentElement;
        if (parent && parent.style && parent.style.height === '90px') {
          e.preventDefault();
          e.stopPropagation();
          var idx = parseInt(btn.getAttribute("data-idx"));
          setCurrentIndex(idx);
        }
      }
    };
    window.addEventListener("click", handler, true);
    return function() { window.removeEventListener("click", handler, true); };
  }, []);

  // Multi-dimension label groups - optimized for single-frame recognition
  // Labels marked sf: false require video sequence (temporal) to judge, not suitable for single frame
  var labelDimensions = [
    { dim: "体态", required: true, color: "#3498DB", items: [
      { label: "仰卧", sf: true },
      { label: "左侧卧", sf: true },
      { label: "右侧卧", sf: true },
      { label: "俯卧", sf: true },
      { label: "半坐/半躺", sf: true },
      { label: "坐姿(床上)", sf: true },
      { label: "坐姿(椅子/轮椅)", sf: true },
      { label: "站立", sf: true },
      { label: "跪姿/爬行", sf: true },
      { label: "蜷缩", sf: true },
    ] },
    { dim: "被子", required: false, color: "#9B59B6", items: [
      { label: "被子遮盖(正常)", sf: true },
      { label: "被子盖头", sf: true },
      { label: "被子盖脚", sf: true },
      { label: "部分遮盖", sf: true },
      { label: "踢被/无遮盖", sf: true },
    ] },
    { dim: "位置", required: false, color: "#1ABC9C", items: [
      { label: "在床上", sf: true },
      { label: "床边(危险)", sf: true },
      { label: "椅子/轮椅上", sf: true },
      { label: "地面/床外", sf: true },
      { label: "空床", sf: true },
    ] },
    { dim: "异常", required: false, color: "#E74C3C", items: [
      { label: "面部被遮/窒息", sf: true },
      { label: "上半身探出床", sf: true },
      { label: "腿部探出床", sf: true },
      { label: "跌落/坠床", sf: true },
    ] },
    { dim: "隐私", required: false, color: "#8B0000", items: [
      { label: "上身裸露", sf: true },
      { label: "下身裸露", sf: true },
      { label: "更衣中", sf: true },
    ] },
    { dim: "其他", required: false, color: "#95A5A6", items: [
      { label: "其他异常", sf: true },
      { label: "模糊/无法判断", sf: true },
    ] },
  ];

  function toggleTag(tag) {
    var has = selectedTags.indexOf(tag) >= 0;
    if (has) {
      setSelectedTags(selectedTags.filter(function(t) { return t !== tag; }));
    } else {
      setSelectedTags(selectedTags.concat([tag]));
    }
  }

  var allPresetLabels = [];
  labelDimensions.forEach(function(d) { d.items.forEach(function(item) { allPresetLabels.push(item.label); }); });

  function sortFrames(items) {
    // Sort: unannotated frames first (by id desc)
    // Auto-annotated frames are NOT is_annotated, so they appear in unannotated group
    // but we sort auto-annotated after pure-unannotated within that group
    var hasAuto = items.filter(function(f) { return f.annotation_source === "auto"; });
    var pureUnannotated = items.filter(function(f) { return !f.is_annotated && f.annotation_source !== "auto"; });
    var manualAnnotated = items.filter(function(f) { return f.is_annotated; });
    pureUnannotated.sort(function(a, b) { return b.id - a.id; });
    hasAuto.sort(function(a, b) { return b.id - a.id; });
    manualAnnotated.sort(function(a, b) { return b.id - a.id; });
    // Order: pure unannotated -> auto-annotated (needs confirmation) -> manual annotated
    return pureUnannotated.concat(hasAuto).concat(manualAnnotated);
  }

  function loadFrames() {
    var url = "/frames/?limit=100000";
    if (selectedCam !== "all") url += "&camera_id=" + selectedCam;
    if (selectedDs !== "all") url += "&dataset_id=" + selectedDs;
    apiGet(url).then(function(d) {
      if (d && d.items) {
        var sorted = sortFrames(d.items);
        setFrames(sorted);
        setCurrentIndex(0);
        var ids = new Set();
        sorted.forEach(function(f) { if (f.is_annotated) ids.add(f.id); });
        setAnnotatedIds(ids);
      }
    });
  }

  useEffect(function() {
    apiGet("/cameras/").then(function(d) { if (d) setCameras(d); });
    apiGet("/datasets/").then(function(d) { if (d) setDatasets(d); });
    loadFrames();
    return function() { if (aaPollRef.current) clearInterval(aaPollRef.current); };
  }, []);

  useEffect(function() { loadFrames(); }, [selectedCam, selectedDs]);

  function refreshFrames() {
    loadFrames();
  }

  function startAutoAnnotate() {
    setAutoRunning(true);
    apiPost("/train/auto-annotate?confidence_threshold=0.85", {}).then(function(d) {
      if (d && d.job_id) {
        setAutoJob({ percent: 0, total: d.total_frames, processed: 0, autoAnnotated: 0, lowConf: 0 });
        aaPollRef.current = setInterval(function() {
          apiGet("/train/auto-annotate-status/" + d.job_id).then(function(s) {
            if (!s) return;
            setAutoJob({
              percent: s.progress,
              total: s.total,
              processed: s.processed,
              autoAnnotated: s.auto_annotated,
              lowConf: s.low_confidence,
            });
            if (s.status === "done") {
              clearInterval(aaPollRef.current); aaPollRef.current = null;
              setAutoRunning(false);
              setAutoJob(null);
              refreshFrames();
            } else if (s.status === "error") {
              clearInterval(aaPollRef.current); aaPollRef.current = null;
              setAutoRunning(false);
              setAutoJob(null);
              alert("自动标注失败: " + (s.error || "未知错误"));
            }
          });
        }, 500);
      } else if (d && d.error) {
        setAutoRunning(false);
        alert(d.error);
      } else if (d && d.message) {
        setAutoRunning(false);
        alert(d.message);
      }
    }).catch(function() {
      setAutoRunning(false);
      alert("自动标注请求失败");
    });
  }

  var total = frames ? frames.length : 0;
  var current = frames && frames.length > 0 ? frames[currentIndex] : null;

  // Privacy protection: blur when the frame's saved annotation OR the
  // currently selected tags contain a privacy label.
  var blurNow = current && (isPrivate || hasPrivacyLabel(selectedTags));
  var showBlur = blurNow && !showOriginal;
  var imgSrc = current ? (showBlur ? (API + "/frames/" + current.id + "/image?blur=true") : (API + current.image_path)) : "";

  // Load existing annotation tags when switching frames (from embedded data)
  // Uses current.id as dependency: any frame switch triggers reload
  var _depKey = current ? current.id : "null";
  useEffect(function() {
    if (!current) {
      setSelectedTags([]);
      setCustomLabel("");
      setIsPrivate(false);
      setShowOriginal(false);
      return;
    }
    // If navigating via "save & next", keep the selected tags
    if (keepTagsRef.current) {
      keepTagsRef.current = false;
      // Only update privacy state, keep tags
      var priv = hasPrivacyLabel(current.annotation_label ? current.annotation_label.split(",") : []);
      setIsPrivate(priv);
      setShowOriginal(false);
      setCustomLabel("");
      return;
    }
    var tags = [];
    if (current.annotation_label) {
      tags = current.annotation_label.split(",").map(function(t) { return t.trim(); }).filter(function(t) { return t; });
    }
    setSelectedTags(tags);
    setCustomLabel("");
    var priv = hasPrivacyLabel(tags);
    setIsPrivate(priv);
    setShowOriginal(false);
  }, [_depKey]);

  function handleSave() {
    if (!current) return;
    var frameId = current.id;  // Capture before async call
    var labels = selectedTags.slice();
    if (customLabel.trim()) labels.push(customLabel.trim());
    if (labels.length === 0) { alert("请至少选择一个标签"); return; }
    var labelStr = labels.join(",");
    var isUpdate = annotatedIds.has(frameId);
    fetch(API + "/annotations/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ frame_id: frameId, label: labelStr, source: "manual", confidence: 1.0 })
    }).then(function(r) {
      if (!r.ok) {
        return r.json().then(function(d) {
          var msg = d.detail || "保存失败";
          if (typeof msg !== "string") msg = JSON.stringify(msg);
          alert("标注保存失败: " + msg);
          return null;
        });
      }
      return r.json();
    }).then(function(result) {
      if (result && result.id) {
        // Mark as annotated
        setAnnotatedIds(function(prev) { var ns = new Set(prev); ns.add(frameId); return ns; });
        // Update the frame's data in-place (badge changes), but do NOT re-sort
        var updatedFrames = frames.map(function(f) {
          if (f.id === frameId) {
            return Object.assign({}, f, { is_annotated: true, annotation_label: labelStr, annotation_source: "manual" });
          }
          return f;
        });
        setFrames(updatedFrames);
        setCustomLabel("");
        // Set flag to keep tags when switching to next frame
        keepTagsRef.current = true;
        // Move to next frame using functional update to ensure latest index
        setCurrentIndex(function(prev) { return Math.min(prev + 1, updatedFrames.length - 1); });
      }
    }).catch(function(e) {
      alert("网络错误: " + (e.message || "未知错误"));
    });
  }

  return html`

/* ===== Image Management ===== */
/* ===== Image preview modal with prev/next ===== */
function PreviewModal(props) {
  var frame = props.frame;
  var frames = props.frames;
  var onClose = props.onClose;
  var onNavigate = props.onNavigate;
  var onDelete = props.onDelete;

  // Find current index
  var currentIdx = -1;
  for (var i = 0; i < frames.length; i++) {
    if (frames[i].id === frame.id) { currentIdx = i; break; }
  }
  var hasPrev = currentIdx > 0;
  var hasNext = currentIdx < frames.length - 1;

  // Keyboard navigation
  useEffect(function() {
    function handleKey(e) {
      if (e.key === "ArrowLeft" && hasPrev) { onNavigate(frames[currentIdx - 1]); }
      else if (e.key === "ArrowRight" && hasNext) { onNavigate(frames[currentIdx + 1]); }
      else if (e.key === "Escape") { onClose(); }
    }
    window.addEventListener("keydown", handleKey);
    return function() { window.removeEventListener("keydown", handleKey); };
  }, [currentIdx, hasPrev, hasNext]);

  var navBtnStyle = {
    position: "absolute", top: "50%", transform: "translateY(-50%)",
    width: 44, height: 44, borderRadius: "50%",
    background: "rgba(255,255,255,0.9)", border: "none",
    fontSize: "1.4rem", cursor: "pointer", zIndex: 10,
    display: "flex", alignItems: "center", justifyContent: "center",
    color: "#333", boxShadow: "0 2px 8px rgba(0,0,0,0.3)",
    transition: "all 0.2s",
  };

  return html`
    <div onClick=${function(e) { if (e.target === e.currentTarget) onClose(); }}
      style=${{
        position: "fixed", top: 0, left: 0, right: 0, bottom: 0,
        background: "rgba(0,0,0,0.85)", zIndex: 9999,
        display: "flex", alignItems: "center", justifyContent: "center", padding: 40
      }}>
      ${hasPrev ? html`
        <button onClick=${function(){ onNavigate(frames[currentIdx - 1]); }}
          style=${Object.assign({}, navBtnStyle, { left: 16 })}>\u2039</button>
      ` : null}
      <div style=${{ background: "#fff", borderRadius: 8, maxWidth: 800, width: "100%", maxHeight: "90vh", overflow: "auto", position: "relative" }}>
        <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "12px 16px", borderBottom: "1px solid var(--rule)" }}>
          <div style=${{ fontWeight: 700, fontSize: "0.95rem" }}>
            图片预览 #${frame.id}
            <span style=${{ fontSize: "0.75rem", color: "var(--muted)", marginLeft: 8 }}>${currentIdx + 1} / ${frames.length}</span>
          </div>
          <button onClick=${onClose}
            style=${{ border: "none", background: "transparent", fontSize: "1.5rem", cursor: "pointer", color: "var(--muted)" }}>\u00D7</button>
        </div>
        <div style=${{ padding: 16, textAlign: "center", background: "#1a1a1a" }}>
          <img src=${API + frame.image_path} style=${{ maxWidth: "100%", maxHeight: "60vh", objectFit: "contain" }} />
        </div>
        <div style=${{ padding: "12px 16px", display: "flex", gap: 16, fontSize: "0.85rem", borderTop: "1px solid var(--rule)", alignItems: "center" }}>
          <span>状态: <strong style=${{ color: frame.is_annotated ? "#27AE60" : "#E67E22" }}>${frame.is_annotated ? "已标注" : "待标注"}</strong></span>
          <span>来源: <strong>${frame.source === "manual" ? "手动抽帧" : (frame.source === "auto" ? "智能抽帧" : "视频抽帧")}</strong></span>
          ${frame.video_timestamp ? html`<span>时间: <strong>${frame.video_timestamp}s</strong></span>` : null}
          <button onClick=${function(){ onDelete(frame.id); }}
            style=${{ marginLeft: "auto", padding: "6px 14px", fontSize: "0.85rem", border: "1px solid var(--danger)", borderRadius: 6, background: "transparent", color: "var(--danger)", cursor: "pointer", fontWeight: 600 }}>删除此图片</button>
          <button onClick=${function(){ window._navigate("annotate"); }}
            style=${{ padding: "6px 14px", fontSize: "0.85rem", border: "none", borderRadius: 6, background: "var(--accent)", color: "#fff", cursor: "pointer", fontWeight: 600 }}>去标注</button>
        </div>
      </div>
      ${hasNext ? html`
        <button onClick=${function(){ onNavigate(frames[currentIdx + 1]); }}
          style=${Object.assign({}, navBtnStyle, { right: 16 })}>\u203A</button>
      ` : null}
    </div>
  `;
}

function ManagePage() {
  var s1 = useState(null); var stats = s1[0]; var setStats = s1[1];
  var s2 = useState([]); var frames = s2[0]; var setFrames = s2[1];
  var s3 = useState("all"); var filter = s3[0]; var setFilter = s3[1]; // all | annotated | unannotated
  var s4 = useState(1); var page = s4[0]; var setPage = s4[1];
  var s5 = useState(new Set()); var selected = s5[0]; var setSelected = s5[1];
  var s6 = useState(false); var deleting = s6[0]; var setDeleting = s6[1];
  var s7 = useState(null); var previewFrame = s7[0]; var setPreviewFrame = s7[1];
  var s8 = useState([]); var datasets = s8[0]; var setDatasets = s8[1];
  var s9 = useState("all"); var datasetFilter = s9[0]; var setDatasetFilter = s9[1];
  var pageSize = 60;

  function loadStats() {
    apiGet("/frames/stats").then(function(d) { if (d) setStats(d); });
  }

  function loadFrames() {
    var params = "limit=" + pageSize + "&offset=" + ((page - 1) * pageSize);
    if (filter === "annotated") params += "&annotated=true";
    else if (filter === "unannotated") params += "&annotated=false";
    if (datasetFilter !== "all") params += "&dataset_id=" + datasetFilter;
    apiGet("/frames/?" + params).then(function(d) {
      if (d) { setFrames(d); setSelected(new Set()); }
    });
  }

  useEffect(function() { loadStats(); apiGet("/datasets/").then(function(d) { if (d) setDatasets(d); }); }, []);
  useEffect(function() { loadFrames(); }, [filter, page, datasetFilter]);

  function toggleSelect(id) {
    var ns = new Set(selected);
    if (ns.has(id)) ns.delete(id); else ns.add(id);
    setSelected(ns);
  }

  function selectAll() {
    if (selected.size === frames.items.length) {
      setSelected(new Set());
    } else {
      setSelected(new Set(frames.items.map(function(f) { return f.id; })));
    }
  }

  function batchDelete() {
    if (selected.size === 0) return;
    if (!confirm("确认删除选中的 " + selected.size + " 张图片？\n删除后不可恢复，关联的标注也会一并删除。")) return;
    setDeleting(true);
    fetch(API + "/frames/delete-batch", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Array.from(selected))
    })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        setDeleting(false);
        if (d.ok) {
          setSelected(new Set());
          loadStats();
          loadFrames();
        }
      });
  }

  var totalPages = frames ? Math.ceil(frames.total / pageSize) : 1;

  return html`
    <div>
      ${/* Stats bar */ ""}
      <div style=${{ display: "flex", gap: 12, marginBottom: 16 }}>
        <div style=${{ flex: 1, padding: 14, background: "#fff", borderRadius: 8, border: "1px solid var(--rule)" }}>
          <div style=${{ fontSize: "0.75rem", color: "var(--muted)" }}>总图片数</div>
          <div style=${{ fontSize: "1.8rem", fontWeight: 700, color: "var(--ink)" }}>${stats ? stats.total : "--"}</div>
        </div>
        <div style=${{ flex: 1, padding: 14, background: "#fff", borderRadius: 8, border: "1px solid var(--rule)" }}>
          <div style=${{ fontSize: "0.75rem", color: "var(--muted)" }}>已标注</div>
          <div style=${{ fontSize: "1.8rem", fontWeight: 700, color: "#27AE60" }}>${stats ? stats.annotated : "--"}</div>
        </div>
        <div style=${{ flex: 1, padding: 14, background: "#fff", borderRadius: 8, border: "1px solid var(--rule)" }}>
          <div style=${{ fontSize: "0.75rem", color: "var(--muted)" }}>待标注</div>
          <div style=${{ fontSize: "1.8rem", fontWeight: 700, color: "#E67E22" }}>${stats ? stats.unannotated : "--"}</div>
        </div>
        <div style=${{ flex: 1, padding: 14, background: "#fff", borderRadius: 8, border: "1px solid var(--rule)" }}>
          <div style=${{ fontSize: "0.75rem", color: "var(--muted)" }}>待确认</div>
          <div style=${{ fontSize: "1.8rem", fontWeight: 700, color: "#8E44AD" }}>${stats ? stats.pending : "--"}</div>
        </div>
      </div>

      ${/* Toolbar */ ""}
      <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
        <div style=${{ display: "flex", gap: 6, alignItems: "center" }}>
          <button onClick=${function(){ setFilter("all"); setPage(1); }}
            style=${{ padding: "6px 16px", fontSize: "0.85rem", border: "1px solid " + (filter === "all" ? "var(--accent)" : "var(--rule)"), borderRadius: 6, background: filter === "all" ? "var(--accent)" : "#fff", color: filter === "all" ? "#fff" : "var(--ink)", cursor: "pointer", fontWeight: 600 }}>
            全部 ${stats ? "(" + stats.total + ")" : ""}
          </button>
          <button onClick=${function(){ setFilter("unannotated"); setPage(1); }}
            style=${{ padding: "6px 16px", fontSize: "0.85rem", border: "1px solid " + (filter === "unannotated" ? "var(--accent)" : "var(--rule)"), borderRadius: 6, background: filter === "unannotated" ? "var(--accent)" : "#fff", color: filter === "unannotated" ? "#fff" : "var(--ink)", cursor: "pointer", fontWeight: 600 }}>
            待标注 ${stats ? "(" + stats.unannotated + ")" : ""}

function VideosPage() {

  var s16 = useState(""); var manualTime = s16[0]; var setManualTime = s16[1];
  var s17 = useState(null); var manualResult = s17[0]; var setManualResult = s17[1];
  var s18 = useState(false); var extracting = s18[0]; var setExtracting = s18[1];
  var s19 = useState(null); var thumbnails = s19[0]; var setThumbnails = s19[1];
  var s20 = useState(false); var thumbsLoading = s20[0]; var setThumbsLoading = s20[1];
  var s21 = useState(-1); var hoverIdx = s21[0]; var setHoverIdx = s21[1];
  var s22 = useState(false); var dragging = s22[0]; var setDragging = s22[1];
  var s25 = useState(_cache.showAdvanced || false); var showAdvanced = s25[0]; var setShowAdvanced = s25[1];
  var s26 = useState(_cache.previewFrames || null); var previewFrames = s26[0]; var setPreviewFrames = s26[1];
  var s27 = useState(_cache.previewJobId || null); var previewJobId = s27[0]; var setPreviewJobId = s27[1];
  var s28 = useState(false); var confirming = s28[0]; var setConfirming = s28[1];
  var s29 = useState(null); var selectedFrame = s29[0]; var setSelectedFrame = s29[1];
  var s30 = useState(false); var showZoom = s30[0]; var setShowZoom = s30[1];
  var s31 = useState([]); var datasets = s31[0]; var setDatasets = s31[1];
  var s32 = useState("auto"); var selectedDs = s32[0]; var setSelectedDs = s32[1];
  var videoRef = useRef(null);
  var timelineRef = useRef(null);
  var pollRef = useRef(null);

  // Persist key state to global cache on every change
  useEffect(function() {
    window._videosCache = {
      selectedCam: selectedCam, strategy: strategy, interval: interval,
      result: result, diffThreshold: diffThreshold, minInterval: minInterval,
      maxInterval: maxInterval, pixelThreshold: pixelThreshold,
      previewVideo: previewVideo, showAdvanced: showAdvanced,
      previewFrames: previewFrames, previewJobId: previewJobId
    };
  }, [selectedCam, strategy, interval, result, previewVideo, previewFrames, previewJobId, showAdvanced, diffThreshold, minInterval, maxInterval, pixelThreshold]);

  // Auto-load first frame when preview video changes
  useEffect(function() {
    var v = videoRef.current;
    if (!v || !previewVideo) return;
    v.preload = "metadata";
    var onLoaded = function() {
      try { v.currentTime = 0.001; } catch(e) {}
      setManualTime("0.0");
    };
    v.addEventListener("loadeddata", onLoaded);
    return function() { v.removeEventListener("loadeddata", onLoaded); };
  }, [previewVideo]);

  // Keyboard navigation for zoom view
  useEffect(function() {
    if (!showZoom || !previewFrames || !selectedFrame) return;
    var onKey = function(e) {
      if (e.key === "Escape") { setShowZoom(false); return; }
      if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
        e.preventDefault();
        var idx = previewFrames.findIndex(function(f) { return f.id === selectedFrame.id; });
        if (e.key === "ArrowLeft" && idx > 0) setSelectedFrame(previewFrames[idx - 1]);
        if (e.key === "ArrowRight" && idx < previewFrames.length - 1) setSelectedFrame(previewFrames[idx + 1]);
      }
    };
    window.addEventListener("keydown", onKey);
    return function() { window.removeEventListener("keydown", onKey); };
  }, [showZoom, selectedFrame, previewFrames]);

  function loadImports() {
    apiGet("/frames/imports?limit=100").then(function(d) {
      if (d) setImports(d);
    });
  }

  useEffect(function() {
    apiGet("/cameras/").then(function(d) {
      if (d) { setCameras(d); if (d.length > 0) setSelectedCam(d[0].id); }
    });
    apiGet("/datasets/").then(function(d) { if (d) setDatasets(d); });
    loadImports();
    return function() {
      stopPolling();
    };
  }, []);

  function stopPolling() {
    if (pollRef.current) { pollRef.current(); pollRef.current = null; }
  }

  function fmtSize(bytes) {
    if (bytes > 1048576) return (bytes / 1048576).toFixed(1) + " MB";
    if (bytes > 1024) return (bytes / 1024).toFixed(0) + " KB";
    return bytes + " B";
  }

  function fmtDuration(sec) {
    if (sec >= 60) {
      var m = Math.floor(sec / 60);
      var s = Math.round(sec % 60);
      return m + "分" + s + "秒";
    }
    return sec + "秒";
  }

  function startPolling(jobId) {
    stopPolling();
    var cancelled = false;
    var currentJobId = jobId;
    pollRef.current = function() { cancelled = true; };

    function pollOnce() {
      if (cancelled) return;
      fetch(API + "/frames/upload-status/" + jobId)
        .then(function(r) { return r.json(); })
        .then(function(d) {
          if (!d || cancelled) return;
          setProgress({
            percent: d.progress || 0,
            currentFrame: d.current_frame || 0,
            totalFrames: d.total_frames || 0,
            extracted: d.extracted || 0,
            actionFrames: d.action_frames || 0,
            staticFrames: d.static_frames || 0,
            skippedDup: d.skipped_duplicates || 0,

            durationSec: d.duration_sec || 0,
            strategy: d.strategy,
            status: d.status,
            error: d.error,

          if (d.status === "done") {
            cancelled = true;
            pollRef.current = null;
            setUploading(false);
            setResult({

              total_video_frames: d.total_frames,
              duration_sec: d.duration_sec,
              strategy: d.strategy,
              action_frames: d.action_frames,
              static_frames: d.static_frames,
              skipped_duplicates: d.skipped_duplicates || 0,
              num_chunks: d.num_chunks || 1,
            });
            // Fetch preview frames for confirmation
            setPreviewJobId(currentJobId);
            fetch(API + "/frames/preview/" + currentJobId)
              .then(function(r) { return r.json(); })
              .then(function(p) {
                if (p && p.frames) setPreviewFrames(p.frames);
              });
            // Retain video for preview/manual extraction
            var vp = d.video_path;
            if (vp) {
              // Use setTimeout to ensure state update happens after current batch
              setTimeout(function() {
                setPreviewVideo(vp);
                setManualTime("0.0");
              }, 0);
              // Load timeline thumbnails
              setThumbsLoading(true);
              fetch(API + "/frames/video-thumbnails/" + encodeURIComponent(vp) + "?count=12")
                .then(function(r) { return r.json(); })
                .then(function(t) {
                  setThumbsLoading(false);
                  if (t && t.thumbnails) setThumbnails(t);
                })
                .catch(function() { setThumbsLoading(false); });
            }
            setProgress(null);
            loadImports();
          } else if (d.status === "error") {
            cancelled = true;
            pollRef.current = null;
            setUploading(false);
            setError(d.error || "抽帧处理失败");
            setProgress(null);
            loadImports();
          } else {
            // Still processing, schedule next poll
            setTimeout(pollOnce, 300);
          }
        })
        .catch(function(e) {
          // Network error, retry after 500ms
          if (!cancelled) setTimeout(pollOnce, 500);
        });
    }
    pollOnce();
  }

  function handleUpload(e) {

      fileSize: file.size,
      fileSizeStr: fmtSize(file.size),
    };

    setUploading(true); setError(""); setResult(null); setProgress(null);
    setPreviewVideo(null); setPreviewFrames(null); setPreviewJobId(null);
    setThumbnails(null); setManualResult(null);

    var formData = new FormData();
    formData.append("file", file);
    var qs = "camera_id=" + selectedCam + "&strategy=" + strategy;
    if (strategy === "fixed") {
      qs += "&interval=" + interval;
    } else {
      qs += "&diff_threshold=" + diffThreshold + "&pixel_threshold=" + pixelThreshold + "&min_interval=" + minInterval + "&max_interval=" + maxInterval;
    }
    if (selectedDs !== "auto") qs += "&dataset_id=" + selectedDs;

    fetch(API + "/frames/upload-video?" + qs, { method: "POST", body: formData })
      .then(function(r) {
        if (!r.ok) {
          return r.text().then(function(t) {
            throw new Error("HTTP " + r.status + ": " + t.substring(0, 200));
          });
        }
        return r.json();
      })
      .then(function(d) {
        if (d && d.job_id) {
          // Update video info with metadata from backend
          setVideoInfo({
            filename: info.filename,
            fileSize: info.fileSize,
            fileSizeStr: info.fileSizeStr,

            numChunks: d.num_chunks,

          });
