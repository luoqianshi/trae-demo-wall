<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AltLife</title>
    <style id="theme-vars">
/* AltLife - Brand CSS
 * Warm amber cinematic editorial style for life-exchange experience app
 * Tone: poetic, cinematic, warm, editorial magazine, film-grain texture
 */

:root {
  /* Primary: Warm Amber / Sunset */
  --color-primary-50: #FEF6EE;
  --color-primary-100: #FCE9D4;
  --color-primary-200: #F8D0A8;
  --color-primary-300: #F3B071;
  --color-primary-400: #ED9346;
  --color-primary-500: #E8833A;
  --color-primary-600: #D06725;
  --color-primary-700: #AC4F1E;
  --color-primary-800: #8A3F1E;
  --color-primary-900: #70361C;

  /* Neutral: Warm Ink / Cream */
  --color-neutral-0: #FFFFFF;
  --color-neutral-50: #FDF8F3;
  --color-neutral-100: #F8F0E7;
  --color-neutral-200: #EDE0D2;
  --color-neutral-300: #D9C7B4;
  --color-neutral-400: #B8A18A;
  --color-neutral-500: #967E66;
  --color-neutral-600: #755E4A;
  --color-neutral-700: #534235;
  --color-neutral-800: #2F2620;
  --color-neutral-900: #1A1512;

  /* Background and surface tokens for Tailwind bridge */
  --color-background: var(--color-neutral-50);
  --color-foreground: var(--color-neutral-900);
  --color-card: var(--color-neutral-0);
  --color-card-foreground: var(--color-neutral-900);
  --color-muted: var(--color-neutral-100);
  --color-muted-foreground: var(--color-neutral-600);
  --color-border: rgba(26, 21, 18, 0.08);
  --color-ring: var(--color-primary-500);
  --color-primary-foreground: #FFFFFF;

  /* Semantic status colors */
  --state-success: #5B9A6F;
  --state-warning: #D4A03E;
  --state-error: #C4524A;
  --state-info: #5A8AB5;

  /* Typography */
  --font-display: "Noto Serif SC", "Source Han Serif CN", "Songti SC", Georgia, serif;
  --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;

  --text-h1: 28px;
  --text-h2: 22px;
  --text-h3: 18px;
  --text-body: 15px;
  --text-caption: 13px;
  --text-small: 11px;

  --leading-tight: 1.25;
  --leading-normal: 1.55;
  --leading-relaxed: 1.7;

  /* Radius - restrained warm scale */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  /* Surface & Depth - border-led, very subtle shadows */
  --surface-default: var(--color-neutral-50);
  --surface-paper: var(--color-neutral-0);
  --surface-ink: var(--color-neutral-900);
  --border-subtle: rgba(26, 21, 18, 0.08);
  --border-soft: rgba(26, 21, 18, 0.12);

  --shadow-sm: 0 1px 2px rgba(26, 21, 18, 0.04);
  --shadow-md: 0 4px 12px rgba(26, 21, 18, 0.05);
  --shadow-lg: 0 8px 24px rgba(26, 21, 18, 0.05);

  /* Semantic shortcuts */
  --brand-primary: var(--color-primary-500);
  --brand-primary-dark: var(--color-primary-600);
  --brand-primary-light: var(--color-primary-100);
  --color-primary: var(--color-primary-500);
  --color-primary-foreground: var(--color-neutral-0);
  --color-radius-sm: var(--radius-sm);
  --color-radius-md: var(--radius-md);
  --color-radius-lg: var(--radius-lg);
  --color-radius-full: var(--radius-full);
  --bg-main: var(--color-neutral-50);
  --bg-paper: var(--color-neutral-0);
  --text-primary: var(--color-neutral-900);
  --text-muted: var(--color-neutral-600);
  --text-secondary: var(--color-neutral-600);
  --text-caption-color: var(--color-neutral-400);
  --text-tertiary: var(--color-neutral-400);
  --text-on-primary: var(--color-neutral-0);
  --text-on-dark: var(--color-neutral-100);
  --radius: var(--radius-md);
}

/* Dark mode support for cinematic feel */
html.dark {
  --color-background: var(--color-neutral-900);
  --color-foreground: var(--color-neutral-100);
  --color-card: var(--color-neutral-800);
  --color-card-foreground: var(--color-neutral-100);
  --color-muted: var(--color-neutral-800);
  --color-muted-foreground: var(--color-neutral-400);
  --color-border: rgba(255, 248, 240, 0.08);
  --bg-main: var(--color-neutral-900);
  --bg-paper: var(--color-neutral-800);
  --text-primary: var(--color-neutral-100);
  --text-muted: var(--color-neutral-400);
  --text-secondary: var(--color-neutral-400);
  --text-caption-color: var(--color-neutral-500);
  --text-tertiary: var(--color-neutral-500);
  --border-subtle: rgba(255, 248, 240, 0.08);
  --border-soft: rgba(255, 248, 240, 0.12);
  --surface-default: var(--color-neutral-800);
  --surface-paper: var(--color-neutral-800);
}

/* Base utility classes */
.font-display { font-family: var(--font-display); }
.font-body { font-family: var(--font-body); }

.bg-main { background-color: var(--bg-main); }
.bg-paper { background-color: var(--bg-paper); }
.bg-ink { background-color: var(--surface-ink); }
.bg-brand { background-color: var(--brand-primary); }
.bg-brand-light { background-color: var(--brand-primary-light); }

.text-primary { color: var(--text-primary); }
.text-muted { color: var(--text-muted); }
.text-caption-color { color: var(--text-caption-color); }
.text-brand { color: var(--brand-primary); }
.text-on-dark { color: var(--text-on-dark); }

.border-subtle { border-color: var(--border-subtle); }
.border-soft { border-color: var(--border-soft); }

.radius-sm { border-radius: var(--radius-sm); }
.radius-md { border-radius: var(--radius-md); }
.radius-lg { border-radius: var(--radius-lg); }
.radius-full { border-radius: var(--radius-full); }

/* Film grain texture overlay for hero sections */
.film-grain {
  position: relative;
}
.film-grain::after {
  content: "";
  position: absolute;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  opacity: 0.5;
}

/* Cinematic gradient overlays */
.cinematic-overlay {
  background: linear-gradient(180deg, rgba(26,21,18,0) 0%, rgba(26,21,18,0.3) 50%, rgba(26,21,18,0.75) 100%);
}
.cinematic-overlay-warm {
  background: linear-gradient(135deg, rgba(232,131,58,0.15) 0%, rgba(26,21,18,0.7) 100%);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--color-background);
    --color-foreground: var(--color-foreground);
    --color-card: var(--color-card);
    --color-card-foreground: var(--color-card-foreground);
    --color-primary: var(--color-primary);
    --color-primary-foreground: var(--color-primary-foreground);
    --color-muted: var(--color-muted);
    --color-muted-foreground: var(--color-muted-foreground);
    --color-border: var(--color-border);
    --color-ring: var(--color-ring);
    --radius-sm: var(--color-radius-sm);
    --radius-md: var(--color-radius-md);
    --radius-lg: var(--color-radius-lg);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--color-background); }
      .text-background { color: var(--color-background); }
      .border-background { border-color: var(--color-background); }
      .ring-background { --tw-ring-color: var(--color-background); }
      .bg-foreground { background-color: var(--color-foreground); }
      .text-foreground { color: var(--color-foreground); }
      .border-foreground { border-color: var(--color-foreground); }
      .ring-foreground { --tw-ring-color: var(--color-foreground); }
      .bg-card { background-color: var(--color-card); }
      .text-card { color: var(--color-card); }
      .border-card { border-color: var(--color-card); }
      .ring-card { --tw-ring-color: var(--color-card); }
      .bg-card-foreground { background-color: var(--color-card-foreground); }
      .text-card-foreground { color: var(--color-card-foreground); }
      .border-card-foreground { border-color: var(--color-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--color-card-foreground); }
      .bg-primary { background-color: var(--color-primary); }
      .text-primary { color: var(--color-primary); }
      .border-primary { border-color: var(--color-primary); }
      .ring-primary { --tw-ring-color: var(--color-primary); }
      .bg-primary-foreground { background-color: var(--color-primary-foreground); }
      .text-primary-foreground { color: var(--color-primary-foreground); }
      .border-primary-foreground { border-color: var(--color-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--color-primary-foreground); }
      .bg-muted { background-color: var(--color-muted); }
      .text-muted { color: var(--color-muted); }
      .border-muted { border-color: var(--color-muted); }
      .ring-muted { --tw-ring-color: var(--color-muted); }
      .bg-muted-foreground { background-color: var(--color-muted-foreground); }
      .text-muted-foreground { color: var(--color-muted-foreground); }
      .border-muted-foreground { border-color: var(--color-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--color-muted-foreground); }
      .bg-border { background-color: var(--color-border); }
      .text-border { color: var(--color-border); }
      .border-border { border-color: var(--color-border); }
      .ring-border { --tw-ring-color: var(--color-border); }
      .bg-ring { background-color: var(--color-ring); }
      .text-ring { color: var(--color-ring); }
      .border-ring { border-color: var(--color-ring); }
      .ring-ring { --tw-ring-color: var(--color-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased m-0 p-0" style="background-color: var(--color-neutral-900); color: var(--text-on-dark);">
    <main class="relative min-h-[844px] w-full" style="font-family: var(--font-body);">
        <!-- Background hero image -->
        <div class="absolute inset-0">
            <img src="../assets/splash-hero.jpg" alt="" class="h-full w-full object-cover" style="object-position: center 30%; min-height: 844px;">
        </div>

        <!-- Cinematic dark gradient overlay -->
        <div class="absolute inset-0 cinematic-overlay"></div>

        <!-- Warm sunset glow near bottom -->
        <div class="absolute inset-x-0 bottom-0 h-[60%]" style="background: radial-gradient(ellipse at 50% 100%, rgba(232,131,58,0.2) 0%, rgba(232,131,58,0.05) 40%, transparent 70%);"></div>

        <!-- Film grain texture -->
        <div class="absolute inset-0 film-grain pointer-events-none" style="opacity: 0.4;"></div>

        <!-- Content layer -->
        <div class="relative z-10 flex min-h-[844px] flex-col">

            <!-- Top: Status bar safe area + Logo -->
            <header class="pt-[max(env(safe-area-inset-top,44px),44px)] px-6 animate-fade-in-down">
                <div class="inline-flex items-center gap-2">
                    <span class="font-display text-white/80 text-[17px] tracking-[0.15em] font-medium" style="font-family: var(--font-display); font-weight: 500;">AltLife</span>
                </div>
            </header>

            <!-- Flexible spacer pushing content down -->
            <div class="flex-1 min-h-[20vh]"></div>

            <!-- Middle-lower: Hero title block -->
            <div class="px-8 pb-6 animate-fade-in-up">
                <h1 class="font-display text-white/95 text-[clamp(30px,8.5vw,38px)] leading-[1.2] tracking-tight" style="font-family: var(--font-display); font-weight: 600; text-wrap: balance; word-break: keep-all; overflow-wrap: break-word;">
                    今天，想过怎样的人生？
                </h1>
                <p class="mt-4 text-[15px] leading-[1.7] text-white/65 max-w-[320px]" style="font-family: var(--font-body);">
                    你不需要重新再来一次。只需要一天，去试试另一种活法。
                </p>
            </div>

            <!-- Bottom: CTA button + login link, with home indicator safe area -->
            <div class="px-8 pt-2 pb-[max(env(safe-area-inset-bottom,34px),34px)] animate-fade-in-up-delay">
                <a href="02-home.html"
                    data-dom-id="cta-enter"
                    class="w-full inline-flex items-center justify-center whitespace-nowrap text-[16px] font-medium text-white py-[14px] px-6 active:scale-[0.97] transition-transform duration-150 focus:outline-none focus-visible:ring-2 focus-visible:ring-white/50"
                    style="background-color: var(--brand-primary); border-radius: var(--radius-full); font-family: var(--font-body); box-shadow: 0 8px 24px rgba(232,131,58,0.35);"
                >
                    开始体验
                </a>
                <div class="mt-5 text-center pb-2">
                    <a href="02-home.html" class="text-[13px] text-white/55 transition-colors duration-200 hover:text-white/80 underline-offset-4" style="font-family: var(--font-body);">
                        已经有账号？登录
                    </a>
                </div>
            </div>
        </div>
    </main>

    <style>
        @keyframes fade-in-down {
            0% { opacity: 0; transform: translateY(-12px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes fade-in-up {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-down {
            animation: fade-in-down 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
        }
        .animate-fade-in-up {
            animation: fade-in-up 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.5s both;
        }
        .animate-fade-in-up-delay {
            animation: fade-in-up 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.8s both;
        }
        @media (prefers-reduced-motion: reduce) {
            .animate-fade-in-down,
            .animate-fade-in-up,
            .animate-fade-in-up-delay {
                animation: none;
                opacity: 1;
                transform: none;
            }
        }
    </style>

    <script>lucide.createIcons();</script>
<script src="../assets/router.js"></script>
</body>
</html>
