/* AltLife - Brand CSS
 * Warm amber cinematic editorial style for life-exchange experience app
 * Tone: poetic, cinematic, warm, editorial magazine, film-grain texture
 */

:root {
  /* Primary: Warm Amber / Sunset */
  --color-primary-50: #FEF6EE;
  --color-primary-100: #FCE9D4;
  --color-primary-200: #F8D0A8;
  --color-primary-300: #F3B071;
  --color-primary-400: #ED9346;
  --color-primary-500: #E8833A;
  --color-primary-600: #D06725;
  --color-primary-700: #AC4F1E;
  --color-primary-800: #8A3F1E;
  --color-primary-900: #70361C;

  /* Neutral: Warm Ink / Cream */
  --color-neutral-0: #FFFFFF;
  --color-neutral-50: #FDF8F3;
  --color-neutral-100: #F8F0E7;
  --color-neutral-200: #EDE0D2;
  --color-neutral-300: #D9C7B4;
  --color-neutral-400: #B8A18A;
  --color-neutral-500: #967E66;
  --color-neutral-600: #755E4A;
  --color-neutral-700: #534235;
  --color-neutral-800: #2F2620;
  --color-neutral-900: #1A1512;

  /* Background and surface tokens for Tailwind bridge */
  --color-background: var(--color-neutral-50);
  --color-foreground: var(--color-neutral-900);
  --color-card: var(--color-neutral-0);
  --color-card-foreground: var(--color-neutral-900);
  --color-muted: var(--color-neutral-100);
  --color-muted-foreground: var(--color-neutral-600);
  --color-border: rgba(26, 21, 18, 0.08);
  --color-ring: var(--color-primary-500);
  --color-primary-foreground: #FFFFFF;

  /* Semantic status colors */
  --state-success: #5B9A6F;
  --state-warning: #D4A03E;
  --state-error: #C4524A;
  --state-info: #5A8AB5;

  /* Typography */
  --font-display: "Noto Serif SC", "Source Han Serif CN", "Songti SC", Georgia, serif;
  --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;

  --text-h1: 28px;
  --text-h2: 22px;
  --text-h3: 18px;
  --text-body: 15px;
  --text-caption: 13px;
  --text-small: 11px;

  --leading-tight: 1.25;
  --leading-normal: 1.55;
  --leading-relaxed: 1.7;

  /* Radius - restrained warm scale */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  /* Surface & Depth - border-led, very subtle shadows */
  --surface-default: var(--color-neutral-50);
  --surface-paper: var(--color-neutral-0);
  --surface-ink: var(--color-neutral-900);
  --border-subtle: rgba(26, 21, 18, 0.08);
  --border-soft: rgba(26, 21, 18, 0.12);

  --shadow-sm: 0 1px 2px rgba(26, 21, 18, 0.04);
  --shadow-md: 0 4px 12px rgba(26, 21, 18, 0.05);
  --shadow-lg: 0 8px 24px rgba(26, 21, 18, 0.05);

  /* Semantic shortcuts */
  --brand-primary: var(--color-primary-500);
  --brand-primary-dark: var(--color-primary-600);
  --brand-primary-light: var(--color-primary-100);
  --color-primary: var(--color-primary-500);
  --color-primary-foreground: var(--color-neutral-0);
  --color-radius-sm: var(--radius-sm);
  --color-radius-md: var(--radius-md);
  --color-radius-lg: var(--radius-lg);
  --color-radius-full: var(--radius-full);
  --bg-main: var(--color-neutral-50);
  --bg-paper: var(--color-neutral-0);
  --text-primary: var(--color-neutral-900);
  --text-muted: var(--color-neutral-600);
  --text-secondary: var(--color-neutral-600);
  --text-caption-color: var(--color-neutral-400);
  --text-tertiary: var(--color-neutral-400);
  --text-on-primary: var(--color-neutral-0);
  --text-on-dark: var(--color-neutral-100);
  --radius: var(--radius-md);
}

/* Dark mode support for cinematic feel */
html.dark {
  --color-background: var(--color-neutral-900);
  --color-foreground: var(--color-neutral-100);
  --color-card: var(--color-neutral-800);
  --color-card-foreground: var(--color-neutral-100);
  --color-muted: var(--color-neutral-800);
  --color-muted-foreground: var(--color-neutral-400);
  --color-border: rgba(255, 248, 240, 0.08);
  --bg-main: var(--color-neutral-900);
  --bg-paper: var(--color-neutral-800);
  --text-primary: var(--color-neutral-100);
  --text-muted: var(--color-neutral-400);
  --text-secondary: var(--color-neutral-400);
  --text-caption-color: var(--color-neutral-500);
  --text-tertiary: var(--color-neutral-500);
  --border-subtle: rgba(255, 248, 240, 0.08);
  --border-soft: rgba(255, 248, 240, 0.12);
  --surface-default: var(--color-neutral-800);
  --surface-paper: var(--color-neutral-800);
}

/* Base utility classes */
.font-display { font-family: var(--font-display); }
.font-body { font-family: var(--font-body); }

.bg-main { background-color: var(--bg-main); }
.bg-paper { background-color: var(--bg-paper); }
.bg-ink { background-color: var(--surface-ink); }
.bg-brand { background-color: var(--brand-primary); }
.bg-brand-light { background-color: var(--brand-primary-light); }

.text-primary { color: var(--text-primary); }
.text-muted { color: var(--text-muted); }
.text-caption-color { color: var(--text-caption-color); }
.text-brand { color: var(--brand-primary); }
.text-on-dark { color: var(--text-on-dark); }

.border-subtle { border-color: var(--border-subtle); }
.border-soft { border-color: var(--border-soft); }

.radius-sm { border-radius: var(--radius-sm); }
.radius-md { border-radius: var(--radius-md); }
.radius-lg { border-radius: var(--radius-lg); }
.radius-full { border-radius: var(--radius-full); }

/* Film grain texture overlay for hero sections */
.film-grain {
  position: relative;
}
.film-grain::after {
  content: "";
  position: absolute;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  opacity: 0.5;
}

/* Cinematic gradient overlays */
.cinematic-overlay {
  background: linear-gradient(180deg, rgba(26,21,18,0) 0%, rgba(26,21,18,0.3) 50%, rgba(26,21,18,0.75) 100%);
}
.cinematic-overlay-warm {
  background: linear-gradient(135deg, rgba(232,131,58,0.15) 0%, rgba(26,21,18,0.7) 100%);
}

          </button>
        </div>
        <p id="hint-text" class="text-center text-[12px]" style="color: var(--text-tertiary);">答完5题，解锁你的专属人生推荐</p>

      </div>
      <span data-dom-id="cta-test-finish" style="display:none"></span>
    </main>

    <!-- 测试完成遮罩 -->
    <div id="complete-overlay" class="fixed inset-0 z-50 flex-col items-center justify-center hidden" style="background: linear-gradient(135deg, rgba(232,131,58,0.95), rgba(208,103,37,0.95));">
      <div id="complete-content" class="flex flex-col items-center opacity-0 transition-opacity duration-500">
        <div class="w-20 h-20 rounded-full flex items-center justify-center mb-5" style="background: rgba(255,255,255,0.2);">
          <i data-lucide="check" class="w-10 h-10 text-white" stroke-width="3"></i>
        </div>
        <h2 class="font-display text-white text-[28px] font-semibold mb-2">测试完成</h2>
        <p class="text-white/80 text-[14px]">正在为你匹配专属人生...</p>
      </div>
    </div>

    <!-- 自定义样式 -->
    <style>
      html, body { background: var(--bg-main); }
      body { color: var(--text-primary); font-family: var(--font-body); }

      /* 选项卡片选中态动画 */
      .option-card {
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .option-card[data-selected="true"] {
        animation: optionSelect 0.3s ease-out;
      }
      @keyframes optionSelect {
        0% { transform: scale(1); }
        50% { transform: scale(0.97); }
        100% { transform: scale(1); }
      }

      @media (prefers-reduced-motion: reduce) {
        .option-card, .option-card[data-selected="true"] {
          transition: none;
          animation: none;
        }
      }
    </style>

    <!-- 选项交互脚本 -->
    <script>
    (function() {
      // ===== 题目数据 =====
      var questions = [
        {
          title: '周末的早晨，你最想怎么度过？',
          emoji: ['☕', '📷', '🎶', '⛺'],
          options: [
            '在家煮一杯手冲咖啡，慢悠悠晒太阳',
            '扛着相机出门，去老城区扫街',
            '去livehouse听一场爵士即兴',
            '背起帐篷去山里露营'
          ],
          tags: ['咖啡/文艺', '摄影/探索', '音乐/社交', '户外/自然']
        },
        {
          title: '你最想拥有哪种技能？',
          emoji: ['☕', '📷', '🎵', '🏕️'],
          options: [
            '冲出完美的拉花',
            '捕捉决定性瞬间',
            '用音乐打动陌生人',
            '在野外生存一天'
          ],
          tags: ['咖啡', '摄影', '音乐', '户外']
        },
        {
          title: '你理想中的工作节奏是？',
          emoji: ['☕', '📷', '🌙', '🌅'],
          options: [
            '慢节奏，和客人聊天交朋友',
            '自由安排，追随光影',
            '夜晚才是我的主场',
            '日出而作日落而息'
          ],
          tags: ['咖啡/社交', '摄影/自由', '音乐/夜生活', '户外/自然']
        },
        {
          title: '你最想和什么样的人度过一天？',
          emoji: ['👐', '🎒', '🎨', '🌲'],
          options: [
            '有故事的手艺人',
            '永远在路上的旅行者',
            '充满创造力的艺术家',
            '热爱自然的户外达人'
          ],
          tags: ['咖啡/手艺', '摄影/旅行', '音乐/艺术', '户外/自然']
        },
        {
          title: '如果人生可以交换一天，你最想逃离什么？',
          emoji: ['🏙️', '🔄', '🎭', '🖥️'],
          options: [
            '城市的喧嚣和KPI',
            '重复的日常',
            '社交的疲惫',
            '室内的空调和屏幕'
          ],
          tags: ['咖啡/慢生活', '摄影/新鲜感', '音乐/独处', '户外/自然']
        }
      ];

      var currentQuestion = 0;
      var isTransitioning = false;
      var answers = [];

      // DOM references
      var progressBar = document.getElementById('progress-bar');
      var progressTextTop = document.getElementById('progress-text-top');
      var questionBadge = document.getElementById('question-badge');
      var questionTitle = document.getElementById('question-title');
      var optionsContainer = document.getElementById('options-container');
      var optionCards = optionsContainer.querySelectorAll('.option-card');
      var progressDots = document.getElementById('progress-dots');
      var completeOverlay = document.getElementById('complete-overlay');
      var completeContent = document.getElementById('complete-content');
      var skipBtn = document.getElementById('btn-skip');

      // ===== 重置单个选项为未选中状态 =====
      function resetOption(card) {
        card.setAttribute('data-selected', 'false');
        card.setAttribute('aria-checked', 'false');
        card.style.background = 'var(--bg-paper)';
        card.style.borderColor = 'var(--border-subtle)';
        card.style.boxShadow = 'none';
        var textEl = card.querySelector('.option-text');
        if (textEl) { textEl.style.fontWeight = '400'; }
        var checkCircle = card.querySelector('.option-check');
        if (checkCircle) {
          checkCircle.style.background = 'transparent';
          checkCircle.style.border = '2px solid var(--color-neutral-300)';
          var checkIcon = checkCircle.querySelector('i');
          if (checkIcon) { checkIcon.classList.add('opacity-0'); }
        }
        var tag = card.querySelector('.option-tag');
        if (tag) {
          tag.style.background = 'var(--color-neutral-100)';
          tag.style.color = 'var(--text-secondary)';
        }
      }

      // ===== 设置选项为选中状态 =====
      function selectOption(card) {
        card.setAttribute('data-selected', 'true');
        card.setAttribute('aria-checked', 'true');
        card.style.background = 'var(--color-primary-50)';
        card.style.borderColor = 'var(--brand-primary)';
        card.style.boxShadow = '0 2px 8px rgba(232,131,58,0.12)';
        var textEl = card.querySelector('.option-text');
        if (textEl) { textEl.style.fontWeight = '500'; }
        var checkCircle = card.querySelector('.option-check');
        if (checkCircle) {
          checkCircle.style.background = 'var(--brand-primary)';
          checkCircle.style.border = 'none';
          var checkIcon = checkCircle.querySelector('i');
          if (checkIcon) { checkIcon.classList.remove('opacity-0'); }
        }
        var tag = card.querySelector('.option-tag');
        if (tag) {
          tag.style.background = 'var(--brand-primary)';
          tag.style.color = 'var(--text-on-primary)';
        }
      }

      // ===== 更新进度圆点 =====
      function updateDots(currentIdx) {
        var dots = progressDots.querySelectorAll('span');
        dots.forEach(function(dot, i) {
          if (i < currentIdx) {
            // 已完成
            dot.className = 'w-2.5 h-2.5';
            dot.style.cssText = 'background: var(--brand-primary); border-radius: var(--radius-full);';
          } else if (i === currentIdx) {
            // 当前
            dot.className = 'w-3.5 h-3.5';
            dot.style.cssText = 'background: var(--brand-primary); border: 2px solid var(--color-primary-200); border-radius: var(--radius-full); box-shadow: 0 0 0 3px var(--color-primary-50);';
          } else {
            // 未完成
            dot.className = 'w-2.5 h-2.5';
            dot.style.cssText = 'border: 1.5px solid var(--color-neutral-300); border-radius: var(--radius-full); background: transparent;';
          }
        });
      }

      // ===== 渲染题目 =====
      function renderQuestion(idx) {
        var q = questions[idx];
        var progressPercent = ((idx + 1) / questions.length) * 100;

        // 更新进度条
        progressBar.style.width = progressPercent + '%';
        progressTextTop.textContent = (idx + 1) + ' / ' + questions.length;
        questionBadge.textContent = '问题 ' + (idx + 1) + ' / ' + questions.length;
        questionTitle.textContent = q.title;

        // 更新选项
        optionCards.forEach(function(card, i) {
          resetOption(card);
          var emojiEl = card.querySelector('.option-emoji');
          var textEl = card.querySelector('.option-text');
          var tagEl = card.querySelector('.option-tag');
          if (emojiEl) { emojiEl.textContent = q.emoji[i]; }
          if (textEl) { textEl.textContent = q.options[i]; }
          if (tagEl) { tagEl.textContent = q.tags[i]; }
          card.setAttribute('data-tag-label', q.tags[i]);
        });

        // 更新进度圆点
        updateDots(idx);
      }

      // ===== 淡入淡出切换 =====
      function fadeToNext(selectedIdx) {
        if (isTransitioning) return;
        isTransitioning = true;

        // 记录答案
        answers.push(selectedIdx);

        var questionSection = document.getElementById('question-section');
        var optSection = optionsContainer;

        // 淡出
        questionSection.style.transition = 'opacity 0.25s ease';
        optSection.style.transition = 'opacity 0.25s ease';
        questionSection.style.opacity = '0';
        optSection.style.opacity = '0';

        setTimeout(function() {
          if (currentQuestion >= questions.length - 1) {
            // 最后一题，显示完成动画
            showComplete();
            return;
          }
          currentQuestion++;
          renderQuestion(currentQuestion);

          // 淡入
          questionSection.style.opacity = '1';
          optSection.style.opacity = '1';
          isTransitioning = false;
        }, 300);
      }

      // ===== 显示完成动画 =====
      function showComplete() {
        // 更新进度条到100%
        progressBar.style.width = '100%';
        updateDots(questions.length - 1);

        setTimeout(function() {
          completeOverlay.classList.remove('hidden');
          completeOverlay.classList.add('flex');
          // 重新创建icons因为新元素
          if (window.lucide) lucide.createIcons();
          // 淡入内容
          setTimeout(function() {
            completeContent.style.opacity = '1';
          }, 50);
          // 1.2秒后跳转
          setTimeout(function() {
            AltLife.go("02-home.html?recommend=coffee");
          }, 1200);
        }, 500);
      }

      // ===== 跳过按钮 =====
      skipBtn.addEventListener('click', function() {
        AltLife.go("02-home.html");
      });

      // ===== 选项点击委托 =====
      optionsContainer.addEventListener('click', function(e) {
        var card = e.target.closest('.option-card');
        if (!card || isTransitioning) return;

        // 重置所有选项
        optionCards.forEach(resetOption);
        // 选中当前
        selectOption(card);

        var selectedIdx = Array.prototype.indexOf.call(optionCards, card);

        // 0.3秒后切换
        setTimeout(function() {
          fadeToNext(selectedIdx);
        }, 300);
      });

      // 初始化第一题
      renderQuestion(0);
    })();
    </script>

    <script>lucide.createIcons();</script>
<script src="../assets/router.js"></script>
</body>
</html>
