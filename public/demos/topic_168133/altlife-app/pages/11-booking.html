    <style id="theme-vars">
/* AltLife - Brand CSS
 * Warm amber cinematic editorial style for life-exchange experience app
 * Tone: poetic, cinematic, warm, editorial magazine, film-grain texture
 */

:root {
  /* Primary: Warm Amber / Sunset */
  --color-primary-50: #FEF6EE;
  --color-primary-100: #FCE9D4;
  --color-primary-200: #F8D0A8;
  --color-primary-300: #F3B071;
  --color-primary-400: #ED9346;
  --color-primary-500: #E8833A;
  --color-primary-600: #D06725;
  --color-primary-700: #AC4F1E;
  --color-primary-800: #8A3F1E;
  --color-primary-900: #70361C;

  /* Neutral: Warm Ink / Cream */
  --color-neutral-0: #FFFFFF;
  --color-neutral-50: #FDF8F3;
  --color-neutral-100: #F8F0E7;
  --color-neutral-200: #EDE0D2;
  --color-neutral-300: #D9C7B4;
  --color-neutral-400: #B8A18A;
  --color-neutral-500: #967E66;
  --color-neutral-600: #755E4A;
  --color-neutral-700: #534235;
  --color-neutral-800: #2F2620;
  --color-neutral-900: #1A1512;

  /* Background and surface tokens for Tailwind bridge */
  --color-background: var(--color-neutral-50);
  --color-foreground: var(--color-neutral-900);
  --color-card: var(--color-neutral-0);
  --color-card-foreground: var(--color-neutral-900);
  --color-muted: var(--color-neutral-100);
  --color-muted-foreground: var(--color-neutral-600);
  --color-border: rgba(26, 21, 18, 0.08);
  --color-ring: var(--color-primary-500);
  --color-primary-foreground: #FFFFFF;

  /* Semantic status colors */
  --state-success: #5B9A6F;
  --state-warning: #D4A03E;
  --state-error: #C4524A;
  --state-info: #5A8AB5;

  /* Typography */
  --font-display: "Noto Serif SC", "Source Han Serif CN", "Songti SC", Georgia, serif;
  --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;

  --text-h1: 28px;
  --text-h2: 22px;
  --text-h3: 18px;
  --text-body: 15px;
  --text-caption: 13px;
  --text-small: 11px;

  --leading-tight: 1.25;
  --leading-normal: 1.55;
  --leading-relaxed: 1.7;

  /* Radius - restrained warm scale */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  /* Surface & Depth - border-led, very subtle shadows */
  --surface-default: var(--color-neutral-50);
  --surface-paper: var(--color-neutral-0);
  --surface-ink: var(--color-neutral-900);
  --border-subtle: rgba(26, 21, 18, 0.08);
  --border-soft: rgba(26, 21, 18, 0.12);

  --shadow-sm: 0 1px 2px rgba(26, 21, 18, 0.04);
  --shadow-md: 0 4px 12px rgba(26, 21, 18, 0.05);
  --shadow-lg: 0 8px 24px rgba(26, 21, 18, 0.05);

  /* Semantic shortcuts */
  --brand-primary: var(--color-primary-500);
  --brand-primary-dark: var(--color-primary-600);
  --brand-primary-light: var(--color-primary-100);
  --color-primary: var(--color-primary-500);
  --color-primary-foreground: var(--color-neutral-0);
  --color-radius-sm: var(--radius-sm);
  --color-radius-md: var(--radius-md);
  --color-radius-lg: var(--radius-lg);
  --color-radius-full: var(--radius-full);
  --bg-main: var(--color-neutral-50);
  --bg-paper: var(--color-neutral-0);
  --text-primary: var(--color-neutral-900);
  --text-muted: var(--color-neutral-600);
  --text-secondary: var(--color-neutral-600);
  --text-caption-color: var(--color-neutral-400);
  --text-tertiary: var(--color-neutral-400);
  --text-on-primary: var(--color-neutral-0);
  --text-on-dark: var(--color-neutral-100);
  --radius: var(--radius-md);
}

/* Dark mode support for cinematic feel */
html.dark {
  --color-background: var(--color-neutral-900);
  --color-foreground: var(--color-neutral-100);
  --color-card: var(--color-neutral-800);
  --color-card-foreground: var(--color-neutral-100);
  --color-muted: var(--color-neutral-800);
  --color-muted-foreground: var(--color-neutral-400);
  --color-border: rgba(255, 248, 240, 0.08);
  --bg-main: var(--color-neutral-900);
  --bg-paper: var(--color-neutral-800);
  --text-primary: var(--color-neutral-100);
  --text-muted: var(--color-neutral-400);
  --text-secondary: var(--color-neutral-400);
  --text-caption-color: var(--color-neutral-500);
  --text-tertiary: var(--color-neutral-500);
  --border-subtle: rgba(255, 248, 240, 0.08);
  --border-soft: rgba(255, 248, 240, 0.12);
  --surface-default: var(--color-neutral-800);
  --surface-paper: var(--color-neutral-800);
}

/* Base utility classes */
.font-display { font-family: var(--font-display); }
.font-body { font-family: var(--font-body); }

.bg-main { background-color: var(--bg-main); }
.bg-paper { background-color: var(--bg-paper); }
.bg-ink { background-color: var(--surface-ink); }
.bg-brand { background-color: var(--brand-primary); }
.bg-brand-light { background-color: var(--brand-primary-light); }

.text-primary { color: var(--text-primary); }
.text-muted { color: var(--text-muted); }
.text-caption-color { color: var(--text-caption-color); }
.text-brand { color: var(--brand-primary); }
.text-on-dark { color: var(--text-on-dark); }

.border-subtle { border-color: var(--border-subtle); }
.border-soft { border-color: var(--border-soft); }

.radius-sm { border-radius: var(--radius-sm); }
.radius-md { border-radius: var(--radius-md); }
.radius-lg { border-radius: var(--radius-lg); }
.radius-full { border-radius: var(--radius-full); }

/* Film grain texture overlay for hero sections */
.film-grain {
  position: relative;
}
.film-grain::after {
  content: "";
  position: absolute;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  opacity: 0.5;
}

/* Cinematic gradient overlays */
.cinematic-overlay {
  background: linear-gradient(180deg, rgba(26,21,18,0) 0%, rgba(26,21,18,0.3) 50%, rgba(26,21,18,0.75) 100%);
}
.cinematic-overlay-warm {
  background: linear-gradient(135deg, rgba(232,131,58,0.15) 0%, rgba(26,21,18,0.7) 100%);
}

    </style>

<body class="min-h-screen font-sans antialiased"><div class="status-bar fixed top-0 inset-x-0 z-[100] flex items-center justify-between px-6 pt-[env(safe-area-inset-top,0)] h-[calc(44px+env(safe-area-inset-top,0px))] text-[15px] font-semibold pointer-events-none" style="color: var(--text-primary, #1a1a1a);"><span>9:41</span><div class="flex items-center gap-1"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="4" width="3" height="8" rx="1"/><rect x="5" y="2" width="3" height="10" rx="1"/><rect x="10" y="0" width="3" height="12" rx="1" opacity="0.4"/></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2C5.5 2 3.3 3 1.7 4.6L0 2.9C2 0.9 4.8 0 8 0s6 0.9 8 2.9l-1.7 1.7C12.7 3 10.5 2 8 2zm0 4c-1.5 0-2.9 0.6-3.9 1.6L2.5 6c1.5-1.5 3.5-2.3 5.5-2.3s4 0.8 5.5 2.3l-1.6 1.6C10.9 6.6 9.5 6 8 6zm0 4c-0.8 0-1.5 0.3-2 0.8L8 12l2-1.2c-0.5-0.5-1.2-0.8-2-0.8z"/></svg><svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="0" y="1" width="22" height="10" rx="2.5" stroke="currentColor" stroke-width="1" opacity="0.5"/><rect x="2" y="3" width="16" height="6" rx="1" fill="currentColor"/><rect x="23" y="4" width="2" height="4" rx="1" fill="currentColor" opacity="0.5"/></svg></div></div>
    <main class="relative min-h-screen" style="background: var(--bg-main); font-family: var(--font-body); padding-bottom: calc(84px + env(safe-area-inset-bottom, 20px));">

      <!-- 顶部导航栏 -->
      <header class="sticky top-0 z-30 flex items-center justify-between px-4" style="height: 48px; background: var(--bg-main); border-bottom: 1px solid var(--border-subtle);">
        <button data-dom-id="btn-back" onclick="history.back()" class="w-9 h-9 -ml-2 inline-flex items-center justify-center active:opacity-60 transition-opacity" aria-label="返回">
          <i data-lucide="chevron-left" class="w-5 h-5" style="color: var(--text-primary);"></i>
        </button>
        <h1 class="font-display text-[17px] font-semibold tracking-wide" style="color: var(--text-primary);">确认预约</h1>
        <button class="text-[14px] active:opacity-60 transition-opacity px-1" style="color: var(--text-secondary);">帮助</button>
      </header>

      <!-- 可滚动内容区 -->
      <div class="px-4 pt-4 space-y-3">

        <!-- 1. 预约的人生摘要卡 -->
        <section class="flex items-center gap-3 p-3" style="background: var(--bg-paper); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);">
          <img src="../assets/card-barista.jpg" alt="咖啡店主理人的一天" class="shrink-0 object-cover" style="width: 60px; height: 60px; border-radius: var(--radius-md);">
          <div class="flex-1 min-w-0">
            <h2 class="font-display text-[16px] font-semibold leading-tight truncate mb-1" style="color: var(--text-primary);">咖啡店主理人的一天</h2>
            <p class="text-[13px] truncate mb-1.5" style="color: var(--text-secondary);">主理人：阿树</p>
            <p class="font-display text-[18px] font-bold" style="color: var(--brand-primary);">¥198<span class="text-[12px] font-normal" style="color: var(--text-tertiary);">/人</span></p>
          </div>
        </section>

        <!-- 2. 选择预约日期 -->
        <section class="p-4" style="background: var(--bg-paper); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);">
          <div class="flex items-center gap-2 mb-3">
            <i data-lucide="calendar" class="w-4 h-4" style="color: var(--brand-primary);"></i>
            <h3 class="text-[15px] font-semibold" style="color: var(--text-primary);">选择日期</h3>
          </div>
          <div class="flex gap-2 overflow-x-auto no-scrollbar -mx-1 px-1" id="date-picker">
            <!-- 今天 -->
            <button class="date-chip shrink-0 flex flex-col items-center justify-center transition-all duration-200" style="width: 52px; height: 60px; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); background: var(--bg-paper);" data-date="today">
              <span class="text-[11px] mb-0.5" style="color: var(--text-secondary);" id="date-l0">今天</span>
              <span class="text-[15px] font-semibold" style="color: var(--text-primary);" id="date-d0">15</span>
            </button>
            <!-- 明天 -->
            <button class="date-chip shrink-0 flex flex-col items-center justify-center transition-all duration-200" style="width: 52px; height: 60px; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); background: var(--bg-paper);" data-date="tomorrow">
              <span class="text-[11px] mb-0.5" style="color: var(--text-secondary);" id="date-l1">明天</span>
              <span class="text-[15px] font-semibold" style="color: var(--text-primary);" id="date-d1">16</span>
            </button>
            <!-- 第3天 -->
            <button class="date-chip shrink-0 flex flex-col items-center justify-center transition-all duration-200" style="width: 52px; height: 60px; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); background: var(--bg-paper);" data-date="d2">
              <span class="text-[11px] mb-0.5" style="color: var(--text-secondary);" id="date-l2">周三</span>
              <span class="text-[15px] font-semibold" style="color: var(--text-primary);" id="date-d2">17</span>
            </button>
            <!-- 第4天 -->
            <button class="date-chip shrink-0 flex flex-col items-center justify-center transition-all duration-200" style="width: 52px; height: 60px; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); background: var(--bg-paper);" data-date="d3">
              <span class="text-[11px] mb-0.5" style="color: var(--text-secondary);" id="date-l3">周四</span>
              <span class="text-[15px] font-semibold" style="color: var(--text-primary);" id="date-d3">18</span>
            </button>
            <!-- 第5天 -->
            <button class="date-chip shrink-0 flex flex-col items-center justify-center transition-all duration-200" style="width: 52px; height: 60px; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); background: var(--bg-paper);" data-date="d4">
              <span class="text-[11px] mb-0.5" style="color: var(--text-secondary);" id="date-l4">周五</span>
              <span class="text-[15px] font-semibold" style="color: var(--text-primary);" id="date-d4">19</span>
            </button>
            <!-- 第6天（默认选中） -->
            <button class="date-chip shrink-0 flex flex-col items-center justify-center transition-all duration-200 date-selected" style="width: 52px; height: 60px; border-radius: var(--radius-md); background: var(--brand-primary); box-shadow: 0 2px 8px rgba(232,131,58,0.3);" data-date="d5" data-selected="true">
              <span class="text-[11px] mb-0.5" style="color: rgba(255,255,255,0.85);" id="date-l5">周六</span>
              <span class="text-[15px] font-semibold" style="color: var(--text-on-primary);" id="date-d5">20</span>
            </button>
            <!-- 第7天 -->
            <button class="date-chip shrink-0 flex flex-col items-center justify-center transition-all duration-200" style="width: 52px; height: 60px; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); background: var(--bg-paper);" data-date="d6">
              <span class="text-[11px] mb-0.5" style="color: var(--text-secondary);" id="date-l6">周日</span>
              <span class="text-[15px] font-semibold" style="color: var(--text-primary);" id="date-d6">21</span>
            </button>
          </div>
        </section>

        <!-- 3. 选择时间段 -->
        <section class="p-4" style="background: var(--bg-paper); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);">
          <div class="flex items-center gap-2 mb-3">
            <i data-lucide="clock" class="w-4 h-4" style="color: var(--brand-primary);"></i>
            <h3 class="text-[15px] font-semibold" style="color: var(--text-primary);">时间段</h3>
          </div>
          <div class="flex flex-wrap gap-2" id="time-picker">
            <button class="time-chip time-selected inline-flex items-center px-4 py-2.5 text-[14px] font-medium transition-all duration-200" style="border-radius: var(--radius-md); background: var(--brand-primary); color: var(--text-on-primary); box-shadow: 0 2px 8px rgba(232,131,58,0.25);" data-time="morning" data-selected="true">
              上午场 7:00-12:00
            </button>
            <button class="time-chip inline-flex items-center px-4 py-2.5 text-[14px] font-medium transition-all duration-200" style="border-radius: var(--radius-md); background: var(--color-neutral-50); color: var(--text-primary); border: 1px solid var(--border-subtle);" data-time="afternoon">

            </button>
            <button class="time-chip inline-flex items-center px-4 py-2.5 text-[14px] font-medium transition-all duration-200" style="border-radius: var(--radius-md); background: var(--color-neutral-50); color: var(--text-primary); border: 1px solid var(--border-subtle);" data-time="allday">
              全天场 7:00-18:00
              <span class="ml-1 text-[12px]" style="color: var(--brand-primary);">+¥50</span>
            </button>
          </div>
        </section>

        <!-- 4. 参与人数 -->
        <section class="p-4" style="background: var(--bg-paper); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <i data-lucide="users" class="w-4 h-4" style="color: var(--brand-primary);"></i>
              <h3 class="text-[15px] font-semibold" style="color: var(--text-primary);">参与人数</h3>
            </div>
            <div class="flex items-center gap-3">
              <button id="btn-minus" class="w-8 h-8 inline-flex items-center justify-center active:scale-90 transition-transform" style="border-radius: var(--radius-full); background: var(--color-neutral-50); border: 1px solid var(--border-subtle);" aria-label="减少人数">
                <i data-lucide="minus" class="w-4 h-4" style="color: var(--text-secondary);"></i>
              </button>
              <span id="person-count" class="text-[16px] font-semibold w-5 text-center" style="color: var(--text-primary);">1</span>
              <button id="btn-plus" class="w-8 h-8 inline-flex items-center justify-center active:scale-90 transition-transform" style="border-radius: var(--radius-full); background: var(--brand-primary);" aria-label="增加人数">
                <i data-lucide="plus" class="w-4 h-4" style="color: var(--text-on-primary);"></i>
              </button>
            </div>
          </div>
          <p class="text-[12px] mt-2" style="color: var(--text-tertiary);">建议1-2人体验最佳</p>
        </section>

        <!-- 5. 体验方式确认 -->
        <section class="p-4" style="background: var(--bg-paper); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);">
          <div class="flex items-center gap-2 mb-2">
            <i data-lucide="map-pin" class="w-4 h-4" style="color: var(--brand-primary);"></i>
            <h3 class="text-[15px] font-semibold" style="color: var(--text-primary);">体验方式</h3>
          </div>
          <div class="flex items-center gap-2 py-1">
            <div class="w-5 h-5 inline-flex items-center justify-center shrink-0" style="border-radius: var(--radius-full); background: var(--brand-primary);">
              <i data-lucide="check" class="w-3 h-3" style="color: var(--text-on-primary);"></i>
            </div>
            <span class="text-[14px]" style="color: var(--text-primary);">主人陪同 · L2公共空间</span>
            <span class="text-[11px] px-1.5 py-0.5 ml-auto" style="background: var(--color-primary-50); color: var(--brand-primary); border-radius: var(--radius-sm);">已选</span>
          </div>
        </section>

        <!-- 6. 联系人信息 -->
        <section class="p-4" style="background: var(--bg-paper); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);">
          <div class="flex items-center gap-2 mb-3">
            <i data-lucide="user" class="w-4 h-4" style="color: var(--brand-primary);"></i>
            <h3 class="text-[15px] font-semibold" style="color: var(--text-primary);">联系人信息</h3>
          </div>
          <div class="space-y-0" style="border-radius: var(--radius-md); border: 1px solid var(--border-subtle); overflow: hidden;">
            <!-- 姓名 -->
            <div class="flex items-center px-3 py-3" style="border-bottom: 1px solid var(--border-subtle);">
              <label class="text-[13px] shrink-0 w-16" style="color: var(--text-secondary);">姓名</label>
              <input type="text" value="探索者阿明" class="flex-1 text-[14px] outline-none bg-transparent min-w-0" style="color: var(--text-primary); font-family: var(--font-body);">
            </div>
            <!-- 手机号 -->
            <div class="flex items-center px-3 py-3" style="border-bottom: 1px solid var(--border-subtle);">
              <label class="text-[13px] shrink-0 w-16" style="color: var(--text-secondary);">手机号</label>
              <input type="tel" value="138****8888" class="flex-1 text-[14px] outline-none bg-transparent min-w-0" style="color: var(--text-primary); font-family: var(--font-body);">
            </div>
            <!-- 备注 -->
            <div class="flex items-start px-3 py-3">
              <label class="text-[13px] shrink-0 w-16 pt-0.5" style="color: var(--text-secondary);">备注</label>
              <textarea rows="2" placeholder="有什么想告诉主理人的？如饮食禁忌、特别期待..." class="flex-1 text-[14px] outline-none bg-transparent resize-none min-w-0" style="color: var(--text-primary); font-family: var(--font-body); line-height: 1.5;"></textarea>
            </div>
          </div>
        </section>

        <!-- 7. 费用明细 -->
        <section class="p-4" style="background: var(--bg-paper); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);">
          <div class="flex items-center gap-2 mb-3">
            <i data-lucide="receipt" class="w-4 h-4" style="color: var(--brand-primary);"></i>
            <h3 class="text-[15px] font-semibold" style="color: var(--text-primary);">费用明细</h3>
          </div>
          <div class="space-y-2.5">
            <div class="flex items-center justify-between">
              <span class="text-[13px]" style="color: var(--text-secondary);">体验费</span>
              <span class="text-[13px]" style="color: var(--text-primary);">¥198 × <span id="fee-count">1</span>人 = <span id="fee-experience">¥198</span></span>
            </div>
            <div class="flex items-center justify-between">
              <span class="text-[13px]" style="color: var(--text-secondary);">服务费</span>
              <span class="text-[13px]" style="color: var(--text-primary);">¥0</span>
            </div>
            <div class="flex items-center justify-between">
              <span class="text-[13px]" style="color: var(--text-secondary);">保险费</span>
              <span class="text-[13px] flex items-center gap-1" style="color: var(--text-primary);">
                ¥5
                <span class="text-[11px] px-1.5 py-0.5" style="background: rgba(91,154,111,0.1); color: var(--state-success); border-radius: var(--radius-sm);">平台赠送</span>
              </span>
            </div>
            <div class="pt-2.5 mt-1" style="border-top: 1px solid var(--border-subtle);">
              <div class="flex items-center justify-between">
                <span class="text-[14px] font-semibold" style="color: var(--text-primary);">合计</span>
                <span class="font-display text-[22px] font-bold" id="total-amount" style="color: var(--brand-primary);">¥198</span>
              </div>
            </div>
          </div>
        </section>

        <!-- 8. 支付方式选择 -->
        <section class="p-4" style="background: var(--bg-paper); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);">
          <div class="flex items-center gap-2 mb-3">
            <i data-lucide="credit-card" class="w-4 h-4" style="color: var(--brand-primary);"></i>
            <h3 class="text-[15px] font-semibold" style="color: var(--text-primary);">支付方式</h3>
          </div>
          <div class="space-y-0" id="pay-picker">
            <!-- 微信支付（默认选中） -->
            <button class="pay-method w-full flex items-center gap-3 py-3 transition-colors" style="border-bottom: 1px solid var(--border-subtle);" data-pay="wechat" data-selected="true">
              <div class="w-9 h-9 inline-flex items-center justify-center shrink-0" style="background: #07C160; border-radius: var(--radius-md);">
                <i data-lucide="message-circle" class="w-5 h-5" style="color: #fff;"></i>
              </div>
              <span class="text-[14px] flex-1 text-left" style="color: var(--text-primary);">微信支付</span>
              <div class="pay-check w-5 h-5 inline-flex items-center justify-center" style="border-radius: var(--radius-full); background: var(--brand-primary);">
                <i data-lucide="check" class="w-3 h-3" style="color: var(--text-on-primary);"></i>
              </div>
            </button>
            <!-- 支付宝 -->
            <button class="pay-method w-full flex items-center gap-3 py-3 transition-colors" style="border-bottom: 1px solid var(--border-subtle);" data-pay="alipay">
              <div class="w-9 h-9 inline-flex items-center justify-center shrink-0" style="background: #1677FF; border-radius: var(--radius-md);">
                <i data-lucide="wallet" class="w-5 h-5" style="color: #fff;"></i>
              </div>
              <span class="text-[14px] flex-1 text-left" style="color: var(--text-primary);">支付宝</span>
              <div class="pay-check w-5 h-5 inline-flex items-center justify-center" style="border-radius: var(--radius-full); border: 1.5px solid var(--color-neutral-300); background: transparent;">
              </div>
            </button>
            <!-- Apple Pay -->
            <button class="pay-method w-full flex items-center gap-3 py-3 transition-colors" data-pay="apple">
              <div class="w-9 h-9 inline-flex items-center justify-center shrink-0" style="background: var(--color-neutral-900); border-radius: var(--radius-md);">
                <i data-lucide="smartphone" class="w-5 h-5" style="color: #fff;"></i>
              </div>
              <span class="text-[14px] flex-1 text-left" style="color: var(--text-primary);">Apple Pay</span>
              <div class="pay-check w-5 h-5 inline-flex items-center justify-center" style="border-radius: var(--radius-full); border: 1.5px solid var(--color-neutral-300); background: transparent;">
              </div>
            </button>
          </div>
        </section>

        <!-- 9. 协议勾选 -->
        <div class="flex items-start gap-2 px-1 py-2">
          <button id="agree-check" class="w-5 h-5 mt-0.5 shrink-0 inline-flex items-center justify-center transition-all duration-200" style="border-radius: var(--radius-full); background: var(--brand-primary);" data-checked="true" aria-label="同意协议">
            <i data-lucide="check" class="w-3 h-3" style="color: var(--text-on-primary);"></i>
          </button>
          <p class="text-[12px] leading-relaxed" style="color: var(--text-tertiary);">
            我已阅读并同意<a href="javascript:void(0)" class="underline" style="color: var(--brand-primary);">《人生体验协议》</a><a href="javascript:void(0)" class="underline" style="color: var(--brand-primary);">《安全须知》</a><a href="javascript:void(0)" class="underline" style="color: var(--brand-primary);">《取消政策》</a>
          </p>
        </div>

        <!-- 底部安全间距 -->
        <div class="h-2"></div>
      </div>

      <!-- 底部固定支付栏 -->
      <div class="fixed bottom-0 inset-x-0 z-40 flex items-center justify-between px-4" style="background: var(--bg-paper); border-top: 1px solid var(--border-subtle); height: calc(68px + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: 0 -2px 12px rgba(26,21,18,0.04);">
        <div class="flex-1 min-w-0">
          <p class="text-[11px] mb-0.5" style="color: var(--text-tertiary);">合计</p>
          <p class="font-display text-[22px] font-bold leading-none" id="bottom-total" style="color: var(--brand-primary);">¥198</p>
        </div>
        <button data-dom-id="cta-pay" id="btn-pay" class="px-8 py-3 text-[16px] font-semibold active:scale-[0.97] transition-transform" style="background: var(--brand-primary); color: var(--text-on-primary); border-radius: var(--radius-lg); box-shadow: 0 4px 16px rgba(232,131,58,0.3);">
          确认支付
        </button>
      </div>

    </main>

    <!-- 页面交互样式 -->
    <style>
      html, body { background: var(--bg-main); }
      body { color: var(--text-primary); font-family: var(--font-body); }
      textarea::placeholder { color: var(--text-tertiary); }
      input::placeholder { color: var(--text-tertiary); }

      /* 日期选中态动画 */
      .date-chip { -webkit-tap-highlight-color: transparent; }
      .date-chip:active { transform: scale(0.95); }
      .time-chip { -webkit-tap-highlight-color: transparent; }
      .time-chip:active { transform: scale(0.97); }
      .pay-method { -webkit-tap-highlight-color: transparent; }
      .pay-method:active { opacity: 0.7; }

      /* 支付按钮加载态 */
      .pay-loading { pointer-events: none; opacity: 0.8; }

      /* 减少动效偏好 */
      @media (prefers-reduced-motion: reduce) {
        .date-chip, .time-chip, .pay-method, #btn-minus, #btn-plus, #btn-pay, #agree-check { transition: none !important; }
      }
    </style>

    <!-- 页面交互逻辑 -->
    <script>
      (function() {
        // 日期选择
        const dateChips = document.querySelectorAll('.date-chip');
        dateChips.forEach(chip => {
          chip.addEventListener('click', function() {
            dateChips.forEach(c => {
              c.classList.remove('date-selected');
              c.removeAttribute('data-selected');
              c.style.background = 'var(--bg-paper)';
              c.style.border = '1px solid var(--border-subtle)';
              c.style.boxShadow = 'none';
              const dayLabel = c.querySelector('span:first-child');
              const dayNum = c.querySelector('span:last-child');
              if (dayLabel) { dayLabel.style.color = 'var(--text-secondary)'; }
              if (dayNum) { dayNum.style.color = 'var(--text-primary)'; }
            });
            this.classList.add('date-selected');
            this.setAttribute('data-selected', 'true');
            this.style.background = 'var(--brand-primary)';
            this.style.border = 'none';
            this.style.boxShadow = '0 2px 8px rgba(232,131,58,0.3)';
            const dayLabel = this.querySelector('span:first-child');
            const dayNum = this.querySelector('span:last-child');
            if (dayLabel) { dayLabel.style.color = 'rgba(255,255,255,0.85)'; }
            if (dayNum) { dayNum.style.color = 'var(--text-on-primary)'; }
          });
        });

        // 时间段选择
        const timeChips = document.querySelectorAll('.time-chip');
        const unitPrice = 198;
        const alldayExtra = 50;
        timeChips.forEach(chip => {
          chip.addEventListener('click', function() {
            timeChips.forEach(c => {
              c.classList.remove('time-selected');
              c.removeAttribute('data-selected');
              c.style.background = 'var(--color-neutral-50)';
              c.style.color = 'var(--text-primary)';
              c.style.border = '1px solid var(--border-subtle)';
              c.style.boxShadow = 'none';
              const extra = c.querySelector('span');
              if (extra) extra.style.color = 'var(--brand-primary)';
            });
            this.classList.add('time-selected');
            this.setAttribute('data-selected', 'true');
            this.style.background = 'var(--brand-primary)';
            this.style.color = 'var(--text-on-primary)';
            this.style.border = 'none';
            this.style.boxShadow = '0 2px 8px rgba(232,131,58,0.25)';
            const extra = this.querySelector('span');
            if (extra) extra.style.color = 'rgba(255,255,255,0.8)';
            updateTotal();
          });
        });

        // 人数步进
        let count = 1;
        const countEl = document.getElementById('person-count');
        const feeCountEl = document.getElementById('fee-count');
        const feeExpEl = document.getElementById('fee-experience');
        const totalEl = document.getElementById('total-amount');
        const bottomTotalEl = document.getElementById('bottom-total');
        const btnMinus = document.getElementById('btn-minus');
        const btnPlus = document.getElementById('btn-plus');

        function updateTotal() {
          const base = unitPrice * count;
          const isAllday = document.querySelector('.time-chip[data-selected="true"]')?.dataset.time === 'allday';
          const timeExtra = isAllday ? alldayExtra * count : 0;
          const total = base + timeExtra;
          countEl.textContent = count;
          feeCountEl.textContent = count;
          feeExpEl.textContent = '¥' + base;
          const totalStr = '¥' + total;
          totalEl.textContent = totalStr;
          bottomTotalEl.textContent = totalStr;

          // 减号按钮状态
          if (count <= 1) {
            btnMinus.style.opacity = '0.4';
            btnMinus.style.pointerEvents = 'none';
          } else {
            btnMinus.style.opacity = '1';
            btnMinus.style.pointerEvents = 'auto';
          }
        }

        btnMinus.addEventListener('click', function() {
          if (count > 1) { count--; updateTotal(); }
        });
        btnPlus.addEventListener('click', function() {
          if (count < 9) { count++; updateTotal(); }
        });
        updateTotal();

        // 支付方式选择
        const payMethods = document.querySelectorAll('.pay-method');
        payMethods.forEach(method => {
          method.addEventListener('click', function() {
            payMethods.forEach(m => {
              m.setAttribute('data-selected', 'false');
              const check = m.querySelector('.pay-check');
              check.style.background = 'transparent';
              check.style.border = '1.5px solid var(--color-neutral-300)';
              check.innerHTML = '';
            });
            this.setAttribute('data-selected', 'true');
            const check = this.querySelector('.pay-check');
            check.style.background = 'var(--brand-primary)';
            check.style.border = 'none';
            check.innerHTML = '<i data-lucide="check" class="w-3 h-3" style="color: var(--text-on-primary);"></i>';
            if (window.lucide) lucide.createIcons();
          });
        });

        // 协议勾选
        const agreeCheck = document.getElementById('agree-check');
        agreeCheck.addEventListener('click', function() {
          const checked = this.getAttribute('data-checked') === 'true';
          if (checked) {
            this.setAttribute('data-checked', 'false');
            this.style.background = 'transparent';
            this.style.border = '1.5px solid var(--color-neutral-300)';
            this.innerHTML = '';
          } else {
            this.setAttribute('data-checked', 'true');
            this.style.background = 'var(--brand-primary)';
            this.style.border = 'none';
            this.innerHTML = '<i data-lucide="check" class="w-3 h-3" style="color: var(--text-on-primary);"></i>';
            if (window.lucide) lucide.createIcons();
          }
        });

        // 支付按钮
        const btnPay = document.getElementById('btn-pay');
        btnPay.addEventListener('click', function() {
          const agreed = agreeCheck.getAttribute('data-checked') === 'true';
          if (!agreed) {
            agreeCheck.style.animation = 'none';
            agreeCheck.offsetHeight;
            agreeCheck.style.boxShadow = '0 0 0 3px rgba(196,82,74,0.2)';
            setTimeout(() => { agreeCheck.style.boxShadow = 'none'; }, 600);
            return;
          }
          this.classList.add('pay-loading');
          this.textContent = '支付中...';
          setTimeout(() => {
            this.textContent = '支付成功';
            this.style.background = 'var(--state-success)';
            this.style.boxShadow = '0 4px 16px rgba(91,154,111,0.3)';
            setTimeout(() => {
              // 支付成功 → 跳预约成功页
              AltLife.go("12-success.html");
            }, 800);
          }, 1200);
        });

        // 动态填充日期（基于今日）
        const now = new Date();
        const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
        for (let i = 0; i < 7; i++) {
          const d = new Date(now);
          d.setDate(now.getDate() + i);
          const numEl = document.getElementById('date-d' + i);
          const labelEl = document.getElementById('date-l' + i);
          if (numEl) numEl.textContent = d.getDate();
          if (labelEl) {
            if (i === 0) {
              labelEl.textContent = '今天';
            } else if (i === 1) {
              labelEl.textContent = '明天';
            } else {
              labelEl.textContent = weekdays[d.getDay()];
            }
          }
        }
      })();
    </script>

    <script>lucide.createIcons();</script>
<script src="../assets/router.js"></script>
</body>
</html>
