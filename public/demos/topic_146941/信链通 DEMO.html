<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>信链通 · 资产方端 DEMO</title>
<style>
:root{
  --primary:#1B2A4A; --primary-light:#2A3F6F; --primary-lighter:#3D5A9E; --primary-lightest:#E8EDF6;
  --accent:#C5A55A; --accent-light:#D4BA78; --accent-lighter:#F5ECD4; --accent-dark:#A68B3E;
  --success:#2D8A56; --warning:#D4A017; --error:#C53030; --info:#2B6CB0;
  --bg-main:#F7F8FA; --bg-card:#FFFFFF; --bg-sidebar:#1B2A4A;
  --border:#E2E2EA; --border-subtle:#F0F0F5;
  --text-primary:#1A1A2E; --text-secondary:#4A4A5A; --text-tertiary:#6B6B7B; --text-placeholder:#A8A8B8;
  --shadow-sm:0 1px 2px rgba(26,26,46,0.04); --shadow-md:0 4px 12px rgba(26,26,46,0.06); --shadow-lg:0 8px 24px rgba(26,26,46,0.08);
  --radius-sm:6px; --radius-md:10px; --radius-lg:16px;
  --transition:all .3s cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg-main);color:var(--text-primary);line-height:1.6;overflow-x:hidden}

/* ===== 侧边栏 ===== */
.sidebar{position:fixed;top:0;left:0;width:240px;height:100vh;background:var(--bg-sidebar);display:flex;flex-direction:column;z-index:100;transition:transform .3s ease}
.sidebar-logo{padding:28px 24px 20px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-logo .logo-text{font-size:22px;font-weight:700;letter-spacing:.04em;color:#fff}
.sidebar-logo .logo-sub{font-size:12px;color:var(--accent);margin-top:4px;letter-spacing:.06em}
.sidebar-nav{flex:1;padding:12px 0;overflow-y:auto}
.sidebar-nav::-webkit-scrollbar{width:4px}
.sidebar-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
.nav-group{margin-bottom:4px}
.nav-group-title{padding:14px 24px 6px;font-size:11px;font-weight:600;letter-spacing:.08em;color:rgba(255,255,255,.35);text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 24px;font-size:14px;color:rgba(255,255,255,.6);cursor:pointer;transition:all 200ms ease;border-left:3px solid transparent;text-decoration:none}
.nav-item:hover{color:rgba(255,255,255,.9);background:rgba(255,255,255,.04)}
.nav-item.active{color:#fff;background:rgba(197,165,90,.1);border-left-color:var(--accent);font-weight:500}
.nav-item.active .nav-icon{color:var(--accent)}
.nav-icon{width:20px;height:20px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center}
.nav-icon svg{width:18px;height:18px}
.sidebar-footer{padding:20px 24px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:12px}
.sidebar-avatar{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--accent);font-size:16px;font-weight:700}
.sidebar-org-name{font-size:13px;font-weight:500;color:rgba(255,255,255,.9);line-height:1.3}
.sidebar-footer-info{flex:1;min-width:0}
.sidebar-org-id{font-size:11px;color:rgba(255,255,255,.4);margin-top:2px}
.sidebar-logout{flex-shrink:0;width:32px;height:32px;border-radius:8px;border:none;background:rgba(255,255,255,.08);color:rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 200ms ease;font-size:14px}
.sidebar-logout:hover{background:rgba(229,72,77,.15);color:#ff6b6b}

/* ===== 主区域 ===== */
.main{margin-left:240px;min-height:100vh;transition:margin .3s ease}

/* 顶部栏 */
.top-bar{background:#fff;border-bottom:1px solid var(--border);padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:var(--shadow-sm)}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-tertiary)}
.breadcrumb-parent{color:var(--text-secondary)}
.breadcrumb-sep{color:var(--border)}
.breadcrumb-current{color:var(--text-primary);font-weight:600}
.top-bar-right{display:flex;align-items:center;gap:16px}
.date-display{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary)}
.bell-btn{position:relative;width:36px;height:36px;border:1px solid var(--border);background:#fff;border-radius:var(--radius-md);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);transition:var(--transition)}
.bell-btn:hover{border-color:var(--primary-lighter);color:var(--primary)}
.bell-dot{position:absolute;top:8px;right:8px;width:8px;height:8px;background:var(--error);border-radius:50%;border:2px solid #fff}

/* 页面主体 */
.page-body{padding:28px 32px}
.page-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.page-title{font-size:24px;font-weight:700;color:var(--text-primary);display:flex;align-items:baseline;gap:12px}
.page-title-greeting{font-size:14px;font-weight:400;color:var(--text-tertiary)}

/* KPI卡片 */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:28px}
.kpi-card{background:#fff;border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-sm);border:1px solid var(--border);position:relative;overflow:hidden;transition:var(--transition)}
.kpi-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent-light))}
.kpi-card.blue::before{background:linear-gradient(90deg,var(--info),#3182CE)}
.kpi-card.green::before{background:linear-gradient(90deg,var(--success),#38A169)}
.kpi-card.gold::before{background:linear-gradient(90deg,var(--accent),var(--accent-dark))}
.kpi-card.purple::before{background:linear-gradient(90deg,#6B46C1,#805AD5)}
.kpi-icon-wrap{width:44px;height:44px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;margin-bottom:16px;font-size:20px}
.kpi-card.blue .kpi-icon-wrap{background:rgba(43,108,176,.1);color:var(--info)}
.kpi-card.green .kpi-icon-wrap{background:rgba(45,138,86,.1);color:var(--success)}
.kpi-card.gold .kpi-icon-wrap{background:rgba(197,165,90,.12);color:var(--accent-dark)}
.kpi-card.purple .kpi-icon-wrap{background:rgba(107,70,193,.1);color:#6B46C1}
.kpi-label{font-size:13px;color:var(--text-tertiary);margin-bottom:4px}
.kpi-value{font-size:28px;font-weight:700;color:var(--text-primary);display:flex;align-items:baseline;gap:2px}
.kpi-currency{font-size:18px;font-weight:600;color:var(--text-secondary)}
.kpi-unit{font-size:14px;color:var(--text-tertiary);margin-left:4px}
.kpi-change{font-size:12px;margin-top:8px;display:flex;align-items:center;gap:4px;font-weight:500}
.kpi-change.up{color:var(--success)}
.kpi-change.down{color:var(--error)}

/* 区块面板 */
.section-panel{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);border:1px solid var(--border);margin-bottom:24px;overflow:hidden}
.section-header{padding:20px 24px;border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:space-between}
.section-header-left{display:flex;align-items:center;gap:12px}
.section-header-icon{width:36px;height:36px;border-radius:var(--radius-sm);background:var(--primary-lightest);color:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:18px}
.section-title{font-size:16px;font-weight:600;color:var(--text-primary)}
.section-body{padding:24px}

/* 按钮 */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;transition:var(--transition);white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff}
.btn-primary:hover{box-shadow:0 4px 12px rgba(27,42,74,.3);transform:translateY(-1px)}
.btn-outline{background:#fff;border:1px solid var(--border);color:var(--text-secondary)}
.btn-outline:hover{border-color:var(--primary-lighter);color:var(--primary)}
.btn-gold{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#1A1A2E;font-weight:600}
.btn-gold:hover{box-shadow:0 4px 12px rgba(197,165,90,.3);transform:translateY(-1px)}
.btn-sm{padding:4px 10px;font-size:12px}

/* 表格 */
.data-table{width:100%;border-collapse:collapse}
.data-table th{padding:14px 24px;text-align:left;font-size:13px;font-weight:600;color:var(--text-tertiary);background:var(--bg-main);border-bottom:1px solid var(--border)}
.data-table td{padding:16px 24px;font-size:14px;color:var(--text-secondary);border-bottom:1px solid var(--border-subtle);transition:background .2s}
.data-table tr:hover td{background:rgba(27,42,74,.02)}
.data-table tr:last-child td{border-bottom:none}

/* 状态徽章 */
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:500}
.badge.success{background:rgba(45,138,86,.1);color:var(--success)}
.badge.warning{background:rgba(212,160,23,.1);color:var(--warning)}
.badge.error{background:rgba(197,48,48,.1);color:var(--error)}
.badge.info{background:rgba(43,108,176,.1);color:var(--info)}
.badge.gold{background:rgba(197,165,90,.12);color:var(--accent-dark)}

/* 卡片网格 */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.feature-card{background:#fff;border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-sm);border:1px solid var(--border);transition:var(--transition);cursor:pointer;position:relative;overflow:hidden}
.feature-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent-light));transform:scaleX(0);transition:var(--transition);transform-origin:left}
.feature-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-4px);border-color:var(--primary-lighter)}
.feature-card:hover::before{transform:scaleX(1)}
.card-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.card-icon{width:48px;height:48px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;flex-shrink:0}
.card-icon.blue{background:linear-gradient(135deg,var(--info),#3182CE)}
.card-icon.green{background:linear-gradient(135deg,var(--success),#38A169)}
.card-icon.gold{background:linear-gradient(135deg,var(--accent),var(--accent-dark))}
.card-icon.orange{background:linear-gradient(135deg,var(--warning),#ECC94B)}
.card-icon.purple{background:linear-gradient(135deg,#6B46C1,#805AD5)}
.card-icon.red{background:linear-gradient(135deg,var(--error),#E53E3E)}
.card-title{font-size:16px;font-weight:600;color:var(--text-primary)}
.card-tag{font-size:11px;color:var(--accent);background:rgba(197,165,90,.1);padding:2px 8px;border-radius:4px;font-weight:500;margin-top:3px;display:inline-block}
.card-desc{font-size:13px;color:var(--text-tertiary);line-height:1.6;margin-bottom:16px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-features{display:flex;flex-wrap:wrap;gap:6px}
.feature-tag{font-size:11px;color:var(--text-secondary);background:var(--bg-main);padding:3px 10px;border-radius:12px}

/* 页面切换 */
.page-view{display:none;animation:fadeIn .3s ease}
.page-view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* 模板库 */
.tpl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.tpl-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;transition:var(--transition);cursor:pointer;position:relative;overflow:hidden}
.tpl-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-3px)}
.tpl-icon{width:56px;height:56px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:16px}
.tpl-name{font-size:16px;font-weight:600;color:var(--text-primary);margin-bottom:8px}
.tpl-category{font-size:12px;color:var(--text-tertiary);margin-bottom:12px}
.tpl-desc{font-size:13px;color:var(--text-secondary);line-height:1.6;margin-bottom:16px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tpl-meta{display:flex;gap:16px;font-size:12px;color:var(--text-tertiary);padding-top:16px;border-top:1px solid var(--border-subtle)}
.tpl-meta-item{display:flex;align-items:center;gap:4px}

/* 健康度仪表盘 */
.health-grid{display:grid;grid-template-columns:1fr 2fr;gap:24px;margin-bottom:24px}
.health-score-card{background:#fff;border-radius:var(--radius-lg);padding:32px;box-shadow:var(--shadow-sm);border:1px solid var(--border);text-align:center}
.score-circle{width:160px;height:160px;border-radius:50%;margin:0 auto 20px;position:relative;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--success) 0% 82%,var(--border) 82% 100%)}
.score-inner{width:130px;height:130px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-value{font-size:42px;font-weight:700;color:var(--success)}
.score-label{font-size:13px;color:var(--text-tertiary);margin-top:4px}
.score-status{font-size:16px;font-weight:600;color:var(--success);margin-bottom:8px}
.score-deviation{font-size:13px;color:var(--text-tertiary)}
.score-deviation strong{color:var(--warning)}
.score-update{font-size:12px;color:var(--text-placeholder);margin-top:12px}

/* 图表 */
.chart-container{background:#fff;border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.chart-bars{display:flex;align-items:flex-end;justify-content:space-around;height:200px;padding:0 20px 20px;border-bottom:1px solid var(--border-subtle)}
.chart-bar{width:8%;background:linear-gradient(180deg,var(--primary-light),var(--primary));border-radius:6px 6px 0 0;position:relative;transition:var(--transition);cursor:pointer;min-height:4px}
.chart-bar:hover{background:linear-gradient(180deg,var(--accent),var(--accent-light));transform:scaleY(1.03)}
.chart-bar.actual{background:linear-gradient(180deg,var(--success),#38A169)}
.chart-bar.predicted{background:linear-gradient(180deg,var(--primary-lighter),var(--primary));opacity:.5}
.chart-bar::after{content:attr(data-value);position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:600;color:var(--text-primary);white-space:nowrap;opacity:0;transition:var(--transition)}
.chart-bar:hover::after{opacity:1}
.chart-legend{display:flex;gap:24px;justify-content:center;margin-top:16px;font-size:12px;color:var(--text-tertiary)}
.legend-item{display:flex;align-items:center;gap:6px}
.legend-dot{width:10px;height:10px;border-radius:2px}

/* 步骤条 */
.steps{display:flex;justify-content:space-between;margin-bottom:32px;position:relative}
.steps::before{content:'';position:absolute;top:18px;left:10%;right:10%;height:2px;background:var(--border);z-index:0}
.step{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;z-index:1;cursor:pointer;flex:1}
.step-circle{width:36px;height:36px;border-radius:50%;background:#fff;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--text-tertiary);transition:var(--transition)}
.step.active .step-circle{background:var(--primary);border-color:var(--primary);color:#fff}
.step.done .step-circle{background:var(--success);border-color:var(--success);color:#fff}
.step-name{font-size:13px;color:var(--text-tertiary);font-weight:500}
.step.active .step-name{color:var(--primary);font-weight:600}

/* 表单 */
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:8px}
.form-label .required{color:var(--error);margin-left:2px}
.form-input,.form-select{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:14px;color:var(--text-primary);transition:var(--transition);background:#fff}
.form-input:focus,.form-select:focus{outline:none;border-color:var(--primary-lighter);box-shadow:0 0 0 3px rgba(61,90,158,.1)}
.form-input:disabled{background:var(--bg-main);color:var(--text-tertiary)}
.form-row{display:flex;align-items:center;gap:8px}

/* 开关选项 */
.option-group{display:flex;gap:8px;flex-wrap:wrap}
.option-btn{padding:8px 16px;border:1px solid var(--border);background:#fff;border-radius:var(--radius-md);font-size:13px;color:var(--text-secondary);cursor:pointer;transition:var(--transition)}
.option-btn:hover{border-color:var(--primary-lighter)}
.option-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}

/* 标签 */
.tag-row{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.eval-tag{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500}
.eval-tag.positive{background:rgba(45,138,86,.1);color:var(--success)}
.eval-tag.negative{background:rgba(197,48,48,.1);color:var(--error)}

/* 模态框 */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center;animation:fadeIn .2s ease}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:var(--radius-lg);width:90%;max-width:640px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:slideUp .3s ease;position:relative}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.modal-header{padding:24px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1}
.modal-title{font-size:18px;font-weight:700;color:var(--text-primary)}
.modal-close{width:32px;height:32px;border:none;background:var(--bg-main);border-radius:50%;cursor:pointer;font-size:18px;color:var(--text-tertiary);transition:var(--transition);display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--border);color:var(--text-primary)}
.modal-body{padding:28px}
.modal-footer{padding:20px 28px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:12px;position:sticky;bottom:0;background:#fff}

/* 关联图谱节点 */
.graph-container{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:32px 16px;flex-wrap:wrap}
.graph-node{width:180px;background:#fff;border:2px solid var(--border);border-radius:var(--radius-lg);padding:20px;transition:var(--transition);cursor:pointer;text-align:center}
.graph-node:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.graph-node-icon{width:48px;height:48px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:22px}
.graph-node-name{font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:6px}
.graph-node-desc{font-size:12px;color:var(--text-tertiary);line-height:1.5}
.graph-arrow{font-size:24px;color:var(--text-placeholder);flex-shrink:0}

/* 成本饼图（CSS） */
.pie-container{display:flex;align-items:center;gap:32px}
.pie-chart{width:200px;height:200px;border-radius:50%;position:relative;flex-shrink:0}
.pie-legend{flex:1;display:flex;flex-direction:column;gap:12px}
.pie-legend-item{display:flex;align-items:center;gap:12px;font-size:13px}
.pie-legend-dot{width:14px;height:14px;border-radius:3px;flex-shrink:0}
.pie-legend-label{flex:1;color:var(--text-secondary)}
.pie-legend-value{font-weight:600;color:var(--text-primary)}
.pie-legend-ratio{color:var(--text-tertiary);font-size:12px;margin-left:8px}

/* Toast */
.toast{position:fixed;top:80px;right:32px;background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-lg);padding:14px 20px;display:flex;align-items:center;gap:12px;z-index:2000;transform:translateX(400px);transition:transform .3s ease;border-left:4px solid var(--success)}
.toast.show{transform:translateX(0)}
.toast.error{border-left-color:var(--error)}
.toast.info{border-left-color:var(--info)}
.toast-icon{font-size:18px}

/* 移动端汉堡菜单 */
.menu-toggle{display:none;position:fixed;top:16px;left:16px;z-index:200;width:40px;height:40px;background:#fff;border:1px solid var(--border);border-radius:var(--radius-md);cursor:pointer;align-items:center;justify-content:center;font-size:18px}

@media (max-width:1024px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .tpl-grid{grid-template-columns:repeat(2,1fr)}
  .health-grid{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
}

function updateCashflow(){
  const tpl = document.getElementById('cfTemplate').value;
  const params = {
    parking:{slots:1200,occupancy:68,turnover:3.5,dayRate:6,nightRate:3,evasionRate:5,operationDays:365,maintenanceCost:180000,laborCost:960000},
    sewage:{actualCapacity:8.5,unitPrice:1.85,powerCost:0.35,chemicalCost:0.15,annualCost:7800000},
    solar:{capacity:2000,sunHours:1250,systemEfficiency:82,gridPrice:0.41,oandmCost:80000}
  };
  const fields = {
    parking:[
      {k:'slots',l:'车位总数',u:'个'},{k:'occupancy',l:'日均占用率',u:'%'},{k:'turnover',l:'日周转率',u:'次'},
      {k:'dayRate',l:'白天收费',u:'元/小时'},{k:'nightRate',l:'夜间收费',u:'元/小时'},{k:'evasionRate',l:'逃费率',u:'%'}
    ],
    sewage:[
      {k:'actualCapacity',l:'实际处理量',u:'万吨/日'},{k:'unitPrice',l:'处理单价',u:'元/吨'},{k:'powerCost',l:'电耗',u:'元/吨'}
    ],
    solar:[
      {k:'capacity',l:'装机容量',u:'kWp'},{k:'sunHours',l:'日照小时',u:'小时/年'},{k:'gridPrice',l:'上网电价',u:'元/kWh'}
    ]
  };
  document.getElementById('cfParams').innerHTML = fields[tpl].map(f=>`
    <div class="form-group">
      <label class="form-label">${f.l}</label>
      <div class="form-row"><input class="form-input" value="${params[tpl][f.k]}" style="width:100px" /><span style="color:var(--text-tertiary);font-size:13px">${f.u}</span></div>
    </div>
  `).join('') + `<button class="btn btn-primary" style="width:100%" onclick="showToast('测算已更新','success')">重新测算</button>`;

  // 计算现金流
  let years = [];
  let annualRevenue, annualCost;
  if(tpl==='parking'){
    const p = params.parking;
    const dailyRev = p.slots*(p.occupancy/100)*p.turnover*4*((p.dayRate*14+p.nightRate*10)/24);
    annualRevenue = dailyRev*p.operationDays*(1-p.evasionRate/100);
    annualCost = p.maintenanceCost+p.laborCost;
  } else if(tpl==='sewage'){
    const p = params.sewage;
    annualRevenue = p.actualCapacity*10000*365*p.unitPrice;
    annualCost = p.annualCost;
  } else {
    const p = params.solar;
    annualRevenue = p.capacity*p.sunHours*(p.systemEfficiency/100)*p.gridPrice;
    annualCost = p.oandmCost;
  }
  for(let i=1;i<=10;i++){
    const inflow = Math.round(annualRevenue*Math.pow(1.03,i-1)/10000);
    const outflow = Math.round(annualCost*Math.pow(1.04,i-1)/10000);
    years.push({year:i,inflow,outflow,net:inflow-outflow});
  }
  const maxVal = Math.max(...years.map(y=>y.inflow));
  document.getElementById('cfChart').innerHTML = years.map(y=>`
    <div class="chart-bar" data-value="¥${y.inflow}万" style="height:${(y.inflow/maxVal)*100}%"></div>
  `).join('');
  document.getElementById('cfLabels').innerHTML = years.map(y=>`<span>第${y.year}年</span>`).join('');
  const totalNet = years.reduce((s,y)=>s+y.net,0);
  document.getElementById('cfSummary').innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
      <div style="padding:16px;background:var(--bg-main);border-radius:var(--radius-md);text-align:center">
        <div style="font-size:12px;color:var(--text-tertiary)">年净现金流</div>
        <div style="font-size:20px;font-weight:700;color:var(--success);margin-top:4px">¥${years[0].net}万</div>
      </div>
      <div style="padding:16px;background:var(--bg-main);border-radius:var(--radius-md);text-align:center">
        <div style="font-size:12px;color:var(--text-tertiary)">10年累计净流</div>
        <div style="font-size:20px;font-weight:700;color:var(--primary);margin-top:4px">¥${totalNet}万</div>
      </div>
      <div style="padding:16px;background:var(--bg-main);border-radius:var(--radius-md);text-align:center">
        <div style="font-size:12px;color:var(--text-tertiary)">IRR</div>
        <div style="font-size:20px;font-weight:700;color:var(--accent-dark);margin-top:4px">12.5%</div>
      </div>
    </div>
  `;
}

function nextStep(){ if(checkupStep<5){checkupStep++;renderCheckupSteps();renderCheckupContent();} }

function selectOption(btn){
  btn.parentNode.querySelectorAll('.option-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

function selectAssetCard(idx){
  for(let i=0;i<3;i++){
    const card = document.getElementById('assetCard'+i);
    if(i===idx){
      card.style.border='1px solid var(--primary-lighter)';
      card.style.background='var(--primary-lightest)';
    } else {
      card.style.border='1px solid var(--border)';

  }
}

// ===== 模态框 =====
function showModal(html){
  const overlay = document.getElementById('modalOverlay');
  overlay.innerHTML = `<div class="modal" onclick="event.stopPropagation()">${html}</div>`;
  overlay.classList.add('active');
  overlay.onclick = closeModal;
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('active');
}

// ===== Toast =====
let toastTimer;
function showToast(msg, type='success'){
  const toast = document.getElementById('toast');
  const icon = type==='success'?'✓':type==='error'?'✕':type==='info'?'ℹ':'✓';
  toast.querySelector('.toast-icon').textContent = icon;
  toast.className = 'toast ' + type;
  document.getElementById('toastMsg').textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toast.classList.remove('show'), 3000);
}
