}

<!-- 移动端菜单切换脚本 -->
<script>
  (function() {
    var btn = document.getElementById('rhtx-mobile-menu-btn');
    var menu = document.getElementById('rhtx-mobile-menu');
    if (btn && menu) {
      btn.addEventListener('click', function() {
        if (menu.style.maxHeight && menu.style.maxHeight !== '0px') {
          menu.style.maxHeight = '0px';
        } else {
          menu.style.maxHeight = menu.scrollHeight + 'px';
        }
      });
    }
  })();
</script>

<!-- ============================== -->
<!--       交互脚本                  -->
<!-- ============================== -->
<script>
(function() {
  /* 视图模式切换 */
  var btnCompare = document.getElementById('toggle-compare');
  var btnPreview = document.getElementById('toggle-preview');
  var modeCompare = document.getElementById('mode-compare');
  var modePreview = document.getElementById('mode-preview');

  if (btnCompare && btnPreview && modeCompare && modePreview) {
    btnCompare.addEventListener('click', function() {
      btnCompare.classList.add('is-active');
      btnPreview.classList.remove('is-active');
      modeCompare.classList.remove('hidden');
      modePreview.classList.add('hidden');
    });
    btnPreview.addEventListener('click', function() {
      btnPreview.classList.add('is-active');
      btnCompare.classList.remove('is-active');
      modePreview.classList.remove('hidden');
      modeCompare.classList.add('hidden');
    });
  }
})();
</script>


    <style>
  /* 导航栏样式 */
  .rhtx-shell-nav {
    background-color: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    box-shadow: var(--shadow-sm);
    font-family: var(--font-body);
    position: sticky;
    top: 0;
    z-index: 50;
  }

  /* 导航链接默认状态 */
  .rhtx-nav-link {
    color: var(--color-text-secondary);
    font-size: var(--text-sm);
    font-weight: var(--font-medium);
    padding: 0.5rem 0.875rem;
    border-radius: var(--radius-md);
    transition: color var(--transition-fast), background-color var(--transition-fast);
    white-space: nowrap;
    text-decoration: none;
    position: relative;
  }

  .rhtx-nav-link:hover {
    color: var(--color-primary);
    background-color: var(--color-primary-lightest);
  }

  /* 活跃导航链接 (由 SLOT: activeNavItem 控制激活) */
  .rhtx-nav-link.is-active {
    color: var(--color-primary-dark);
    background-color: var(--color-primary-lighter);
    font-weight: var(--font-semibold);
  }

  .rhtx-nav-link.is-active::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 50%;
    transform: translateX(-50%);
    width: 1.5rem;
    height: 3px;
    background-color: var(--color-primary);
    border-radius: var(--radius-full);
  }

  /* Logo 书本图标 */
  .rhtx-logo-icon {

  .rhtx-avatar {

    align-items: center;
    justify-content: center;

    border-color: var(--color-primary-light);

  }

  /* 页脚 */
  .rhtx-shell-footer {
    background-color: var(--color-surface);
    border-top: 1px solid var(--color-border);
    font-family: var(--font-body);
  }

  /* ============================== */
  /*  改编预览页面专属样式            */
  /* ============================== */

  /* 页面缩略图选择器 */
  .page-thumb {
    position: relative;
    border: 2px solid var(--color-border-light);
    border-radius: var(--radius-md);
    overflow: hidden;
    cursor: pointer;
    transition: border-color 160ms cubic-bezier(.2,.8,.2,1),
                box-shadow 160ms cubic-bezier(.2,.8,.2,1);
  }

  .page-thumb:hover {
    border-color: var(--color-border);
  }

  .page-thumb.is-confirmed {
    border-color: #4CAF50;
  }

  .page-thumb.is-current {
    border-color: var(--color-primary);
    box-shadow: 0 0 0 2px var(--color-primary-lighter);
  }

  .page-thumb.is-pending {
    opacity: 0.55;
  }

  .page-thumb .thumb-check {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 18px;
    height: 18px;
    background: #4CAF50;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;

  .page-thumb .thumb-number {
    position: absolute;
    bottom: 4px;

  /* 视图模式切换 */
  .view-toggle {

  }

  .view-toggle-btn.is-active {

  /* 角色映射卡片 */
  .char-map-row {

  /* 进度条 */
  .progress-bar-track {

    height: 100%;
