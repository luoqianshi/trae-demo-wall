<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280, initial-scale=1" />
  <title>Memora · 越用越懂你的 AI 录音分析</title>
  <meta name="description" content="拥有长期记忆的 AI 录音分析工具 — 跨录音持续上下文、业务洞察、AI 主动质疑、人物画像演进" />

  <!-- Tailwind (本地) -->
  <script src="assets/libs/tailwind.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: { 950: '#0a0a1a', 900: '#0f0f23', 850: '#14142b', 800: '#1a1a33' },
            brand: { indigo: '#6366f1', purple: '#a855f7', pink: '#ec4899' },
          },
          fontFamily: {
            display: ['system-ui', '-apple-system', 'Segoe UI', 'sans-serif'],
            sans: ['system-ui', '-apple-system', '"Segoe UI"', '"Microsoft YaHei"', 'sans-serif'],
            mono: ['ui-monospace', 'Consolas', 'monospace'],
          },
        },
      },
    };
  </script>

  <!-- highlight.js theme (本地) -->
  <link rel="stylesheet" href="assets/libs/github-dark.min.css" />

  <!-- marked.js + highlight.js (本地) -->
  <script src="assets/libs/marked.min.js"></script>
  <script src="assets/libs/highlight.min.js"></script>

  <!-- 演示数据：录音文本 + 场景数据（写死，不依赖 fetch） -->
  <script src="assets/recordings-data.js"></script>
  <script src="assets/demo-data.js"></script>

  <!-- Custom styles -->
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body class="font-sans text-slate-100 antialiased">
  <!-- Background atmosphere -->
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-blobs" aria-hidden="true">
    <span class="blob blob-indigo"></span>
    <span class="blob blob-purple"></span>
    <span class="blob blob-pink"></span>
    <span class="blob blob-cyan"></span>
  </div>
  <div class="bg-vignette" aria-hidden="true"></div>

  <!-- App shell -->
  <div class="app-shell">
    <!-- Sidebar -->
    <aside class="sidebar">
      <a class="brand" href="#/">
        <span class="brand-orb"></span>
        <span class="brand-text">Memora</span>
      </a>
      <div class="brand-tag">记忆空间 · AI 录音分析</div>

      <nav class="nav">
        <a class="nav-item" href="#/" data-nav="home">
          <span class="nav-ico">◈</span>
          <span class="nav-label">场景空间</span>
        </a>
        <a class="nav-item" href="#/new" data-nav="new">
          <span class="nav-ico">＋</span>
          <span class="nav-label">新建场景</span>
        </a>
      </nav>

      <div class="nav-section">
        <span class="nav-section-label">最近场景</span>
        <span class="nav-section-dot"></span>
      </div>
      <nav class="nav nav-scenes" id="recent-scenes">
        <div class="nav-empty">加载中…</div>
      </nav>

      <div class="sidebar-footer">
        <div class="user-badge">
          <span class="user-dot"></span>
          <div class="user-meta">
            <span class="user-name">demo-user</span>
            <span class="user-role">演示账户</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Content -->
    <main class="content">
      <div id="view" class="view"></div>
    </main>
  </div>

  <!-- Loading overlay -->
  <div id="loading-overlay" class="loading-overlay is-hidden" aria-hidden="true">
    <div class="loading-backdrop"></div>
    <div class="loading-card">
      <div class="ring-loader">
        <span class="ring r1"></span>
        <span class="ring r2"></span>
        <span class="ring r3"></span>
        <span class="ring-core"></span>
      </div>
      <div class="loading-title" id="loading-title">AI 正在分析录音</div>
      <div class="loading-sub" id="loading-sub">正在恢复长期记忆并生成洞察…</div>
      <div class="loading-steps" id="loading-steps">
        <div class="step" data-i="0"><span class="step-dot"></span>读取历史知识文件</div>
        <div class="step" data-i="1"><span class="step-dot"></span>分析本次录音内容</div>
        <div class="step" data-i="2"><span class="step-dot"></span>更新记忆与人物画像</div>
        <div class="step" data-i="3"><span class="step-dot"></span>生成业务分析报告</div>
      </div>
    </div>
  </div>

  <!-- Modal + toast roots -->
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <script src="assets/app.js"></script>
</body>
</html>
