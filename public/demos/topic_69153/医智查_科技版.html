<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>医智查 · AI 智能病例分析</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;
  background:#070b14;
  color:#e2e8f0;
  min-height:100vh;
  height:100%;
  overflow-x:hidden;
}

/* 科技感网格背景 */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
  background-size:50px 50px;
  z-index:-1;
  pointer-events:none;
}

.hidden{display:none!important}
.page{display:none;min-height:100vh}
.page.active{display:block}

/* 登录页 */
.auth-wrap{
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  background:radial-gradient(ellipse at center, #0f1a3a 0%, #070b14 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:9999;
}
.auth-wrap.page.active{display:flex!important}
.auth-wrap::before{
  content:"";
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:600px;
  height:600px;
  background:radial-gradient(circle, rgba(0,212,255,0.12) 0%, transparent 70%);
  border-radius:50%;
  animation:pulse 4s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{transform:scale(1);opacity:0.4}
  50%{transform:scale(1.2);opacity:0.7}
}

.auth-card{
  background:rgba(15,23,42,0.85);
  backdrop-filter:blur(20px);
  border:1px solid rgba(0,212,255,0.2);
  border-radius:20px;
  padding:40px;
  width:400px;
  max-width:90%;
  box-shadow:0 0 40px rgba(0,212,255,0.08), inset 0 1px 0 rgba(255,255,255,0.05);
  position:relative;
  overflow:hidden;
}
.auth-card::before{
  content:"";
  position:absolute;
  top:0;left:0;right:0;
  height:2px;
  background:linear-gradient(90deg, transparent, #00d4ff, transparent);
}
.auth-card h1{
  font-size:28px;
  margin-bottom:8px;
  color:#fff;
  font-weight:700;
  letter-spacing:2px;
  text-align:center;
}
.auth-card p.sub{
  color:#94a3b8;
  margin-bottom:28px;
  font-size:14px;
  text-align:center;
}
.form-group{margin-bottom:18px}
.form-group label{
  display:block;
  font-size:12px;
  color:#64748b;
  margin-bottom:8px;
  font-weight:500;
  text-transform:uppercase;
  letter-spacing:1px;
}
.form-group input{
  width:100%;
  padding:12px 14px;
  background:rgba(30,41,59,0.6);
  border:1px solid rgba(100,116,139,0.3);
  border-radius:10px;
  font-size:14px;
  color:#e2e8f0;
  outline:none;
  transition:.3s;
}
.form-group input:focus{
  border-color:#00d4ff;
  box-shadow:0 0 0 3px rgba(0,212,255,0.15), 0 0 15px rgba(0,212,255,0.1);
}

.btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  transition:.3s;
  margin-bottom:10px;
  position:relative;
  overflow:hidden;
}
.btn-primary{
  background:linear-gradient(135deg, #0ea5e9, #00d4ff);
  color:#fff;
  box-shadow:0 4px 15px rgba(14,165,233,0.3);
}
.btn-primary:hover{
  box-shadow:0 4px 25px rgba(14,165,233,0.5);
  transform:translateY(-1px);
}
.btn-secondary{
  background:rgba(30,41,59,0.6);
  color:#94a3b8;
  border:1px solid rgba(100,116,139,0.3);
}
.btn-secondary:hover{
  background:rgba(51,65,85,0.6);
  color:#e2e8f0;
  border-color:rgba(0,212,255,0.3);
}
.guest-btn{
  background:linear-gradient(135deg, #10b981, #34d399);
  color:#fff;
  box-shadow:0 4px 15px rgba(16,185,129,0.3);
}
.guest-btn:hover{
  box-shadow:0 4px 25px rgba(16,185,129,0.5);
  transform:translateY(-1px);
}
.auth-footer{
  text-align:center;
  margin-top:16px;
  font-size:13px;
  color:#64748b;
}
.auth-footer a{
  color:#00d4ff;
  cursor:pointer;
  text-decoration:none;
}
.auth-footer a:hover{
  text-decoration:underline;
  text-shadow:0 0 10px rgba(0,212,255,0.5);
}

/* 布局 */
.app{display:flex;min-height:100vh}
.app.page.active{display:flex!important}
.sidebar{
  width:260px;
  background:rgba(15,23,42,0.9);
  backdrop-filter:blur(20px);
  border-right:1px solid rgba(0,212,255,0.1);
  position:fixed;
  top:0;left:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  z-index:100;
}
.sidebar-header{
  padding:24px 20px;
  border-bottom:1px solid rgba(0,212,255,0.1);
}
.sidebar-header h2{
  font-size:20px;
  color:#fff;
  font-weight:700;
  letter-spacing:2px;
}
.sidebar-header span{
  font-size:11px;
  color:#00d4ff;
  text-transform:uppercase;
  letter-spacing:2px;
}
.sidebar-nav{flex:1;padding:16px 12px}
.nav-item{
  padding:12px 16px;
  border-radius:12px;
  margin-bottom:6px;
  cursor:pointer;
  font-size:14px;
  color:#94a3b8;
  transition:.3s;
  display:flex;
  align-items:center;
  gap:12px;
  border:1px solid transparent;
}
.nav-item:hover{
  background:rgba(0,212,255,0.05);
  color:#e2e8f0;
  border-color:rgba(0,212,255,0.15);
}
.nav-item.active{
  background:linear-gradient(135deg, rgba(14,165,233,0.15), rgba(0,212,255,0.05));
  color:#00d4ff;
  font-weight:600;
  border-color:rgba(0,212,255,0.3);
  box-shadow:0 0 15px rgba(0,212,255,0.1);
}
.nav-icon{
  width:20px;
  height:20px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
}
.sidebar-footer{
  padding:16px;
  border-top:1px solid rgba(0,212,255,0.1);
  font-size:11px;
  color:#475569;
  text-align:center;
}
.main{flex:1;margin-left:260px}
.topbar{
  height:64px;
  background:rgba(15,23,42,0.85);
  backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(0,212,255,0.1);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:50;
}
.topbar-right{display:flex;align-items:center;gap:14px}
.avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  background:linear-gradient(135deg, #0ea5e9, #00d4ff);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  font-weight:600;
  box-shadow:0 0 15px rgba(14,165,233,0.3);
}
.content{padding:28px}

/* 卡片 */
.card{
  background:rgba(15,23,42,0.6);
  backdrop-filter:blur(10px);
  border:1px solid rgba(0,212,255,0.1);
  border-radius:16px;
  padding:24px;
  margin-bottom:24px;
  box-shadow:0 4px 20px rgba(0,0,0,0.3);
  transition:.3s;
}
.card:hover{
  border-color:rgba(0,212,255,0.2);
  box-shadow:0 4px 30px rgba(0,212,255,0.08);
}
.card h3{
  font-size:16px;
  margin-bottom:20px;
  color:#fff;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:10px;
}
.stats-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin-bottom:28px;
}
.stat-card{
  background:rgba(15,23,42,0.6);
  backdrop-filter:blur(10px);
  border:1px solid rgba(0,212,255,0.1);
  border-radius:16px;
  padding:24px;
  box-shadow:0 4px 20px rgba(0,0,0,0.3);
  position:relative;
  overflow:hidden;
  transition:.3s;
}
.stat-card::before{
  content:"";
  position:absolute;
  top:0;left:0;right:0;
  height:3px;
  background:linear-gradient(90deg, #0ea5e9, #00d4ff);
  opacity:0.8;
}
.stat-card:hover{
  border-color:rgba(0,212,255,0.25);
  transform:translateY(-2px);
  box-shadow:0 8px 30px rgba(0,212,255,0.1);
}
.stat-card h4{
  font-size:11px;
  color:#64748b;
  margin-bottom:10px;
  text-transform:uppercase;
  letter-spacing:1.5px;
}
.stat-card .num{
  font-size:32px;
  font-weight:700;
  color:#fff;
  font-family:"SF Mono", Monaco, "Courier New", monospace;
}

/* 表单 */
.form-row{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:16px;
  margin-bottom:16px;
}
.form-row .form-group{margin-bottom:0}
textarea{
  width:100%;
  padding:12px 14px;
  background:rgba(30,41,59,0.6);
  border:1px solid rgba(100,116,139,0.3);
  border-radius:10px;
  font-size:14px;
  color:#e2e8f0;
  resize:vertical;
  min-height:80px;
  outline:none;
  font-family:inherit;
  transition:.3s;
}
textarea:focus{
  border-color:#00d4ff;
  box-shadow:0 0 0 3px rgba(0,212,255,0.15), 0 0 15px rgba(0,212,255,0.1);
}
.tag-group{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.tag{
  padding:8px 16px;
  border-radius:20px;
  border:1px solid rgba(100,116,139,0.3);
  font-size:13px;
  cursor:pointer;
  transition:.3s;
  background:rgba(30,41,59,0.4);
  color:#94a3b8;
}
.tag:hover{
  border-color:#00d4ff;
  color:#00d4ff;
  box-shadow:0 0 10px rgba(0,212,255,0.1);
}
.tag.active{
  background:linear-gradient(135deg, #0ea5e9, #00d4ff);
  color:#fff;
  border-color:transparent;
  box-shadow:0 4px 15px rgba(14,165,233,0.3);
}
.result-box{
  background:rgba(30,41,59,0.5);
  border-radius:12px;
  padding:20px;
  margin-top:20px;
  border:1px solid rgba(0,212,255,0.15);
  position:relative;
  overflow:hidden;
}
.result-box::before{
  content:"";
  position:absolute;
  top:0;left:0;
  width:3px;height:100%;
  background:linear-gradient(180deg, #00d4ff, #0ea5e9);
}
.result-box h4{
  margin-bottom:12px;
  color:#00d4ff;
  font-size:16px;
  font-weight:600;
}
.result-box p, .result-box pre{color:#cbd5e1}
.dept-tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.dept-tag{
  background:rgba(14,165,233,0.15);
  color:#00d4ff;
  padding:6px 14px;
  border-radius:20px;
  font-size:12px;
  border:1px solid rgba(0,212,255,0.2);
}

/* 历史 */
.history-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 20px;
  border-bottom:1px solid rgba(0,212,255,0.05);
  cursor:pointer;
  transition:.3s;
  border-radius:8px;
  margin-bottom:4px;
}
.history-item:hover{
  background:rgba(0,212,255,0.05);
  border-color:rgba(0,212,255,0.1);
}
.history-item:last-child{border-bottom:none;margin-bottom:0}
.status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  display:inline-block;
  margin-right:8px;
  box-shadow:0 0 8px currentColor;
}
.status-low{background:#10b981;color:#10b981}
.status-mid{background:#f59e0b;color:#f59e0b}
.status-high{background:#ef4444;color:#ef4444}

/* 健康图表 */
.chart-container{
  position:relative;
  height:280px;
  margin-top:20px;
  background:rgba(30,41,59,0.3);
  border-radius:12px;
  padding:16px;
  border:1px solid rgba(0,212,255,0.08);
}

/* 弹窗 */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:2000;
  backdrop-filter:blur(5px);
}
.modal.show{display:flex}
.modal-content{
  background:rgba(15,23,42,0.95);
  backdrop-filter:blur(20px);
  border:1px solid rgba(0,212,255,0.2);
  border-radius:20px;
  padding:28px;
  width:520px;
  max-width:90%;
  max-height:80vh;
  overflow:auto;
  box-shadow:0 0 60px rgba(0,212,255,0.15);
}
.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  padding-bottom:16px;
  border-bottom:1px solid rgba(0,212,255,0.1);
}
.modal-header h3{
  font-size:18px;
  color:#fff;
}
.close-btn{
  background:none;
  border:none;
  font-size:28px;
  cursor:pointer;
  color:#64748b;
  transition:.3s;
}
.close-btn:hover{
  color:#00d4ff;
  text-shadow:0 0 10px rgba(0,212,255,0.5);
}

/* Toast */
.toast{
  position:fixed;
  top:20px;
  right:20px;
  background:rgba(15,23,42,0.95);
  backdrop-filter:blur(20px);
  border:1px solid rgba(0,212,255,0.2);
  padding:16px 24px;
  border-radius:12px;
  box-shadow:0 10px 40px rgba(0,0,0,0.3), 0 0 20px rgba(0,212,255,0.1);
  z-index:3000;
  transform:translateX(400px);
  transition:.3s;
  font-size:14px;
  color:#e2e8f0;
}
.toast.show{transform:translateX(0)}
.toast.error{border-left:3px solid #ef4444}
.toast.success{border-left:3px solid #10b981}
.toast.info{border-left:3px solid #00d4ff}

/* 滚动条 */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:rgba(15,23,42,0.5)}
::-webkit-scrollbar-thumb{background:rgba(0,212,255,0.2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(0,212,255,0.4)}

@media print{
  .sidebar,.topbar,.btn,.nav-item{display:none!important}
  .main{margin-left:0}
  .content{padding:16px}
  body{background:#fff;color:#000}
}
</style>
</head>
<body>

<!-- 登录页 -->
<div class="auth-wrap page active" id="loginPage">
  <div class="auth-card">
    <h1>医智查</h1>
    <p class="sub">AI 智能病例分析系统</p>
    <div id="nameGroup" class="hidden">
      <div class="form-group">
        <label>姓名</label>
        <input type="text" id="regName" placeholder="请输入姓名">
      </div>
    </div>
    <div class="form-group">
      <label>账号</label>
      <input type="text" id="account" placeholder="请输入账号">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="password" placeholder="请输入密码">
    </div>
    <button type="button" class="btn btn-primary" id="authBtn">登录</button>
    <button type="button" class="btn guest-btn" id="guestBtn">游客访问（免注册）</button>
    <div class="auth-footer">
      <span id="switchText">还没有账号？</span>
      <a id="switchLink">立即注册</a>
    </div>
  </div>
</div>

<!-- 应用主界面 -->
<div class="app page" id="appPage">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>医智查</h2>
      <span>AI 智能病例分析</span>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-item active" data-page="dashboard">
        <span class="nav-icon">&#9638;</span> 仪表盘
      </div>
      <div class="nav-item" data-page="analysis">
        <span class="nav-icon">&#9733;</span> AI 分析
      </div>
      <div class="nav-item" data-page="history">
        <span class="nav-icon">&#8634;</span> 历史病例
      </div>
      <div class="nav-item" data-page="health">
        <span class="nav-icon">&#9733;</span> 健康数据
      </div>
      <div class="nav-item" data-page="profile">
        <span class="nav-icon">&#9786;</span> 个人中心
      </div>
    </nav>
    <div class="sidebar-footer">v2.0 医智查</div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div id="pageTitle">仪表盘</div>
      <div class="topbar-right">
        <div class="avatar" id="userAvatar">游</div>
        <span id="userName">游客</span>
        <button class="btn" style="width:auto;padding:6px 14px;font-size:12px;background:rgba(30,41,59,0.6);color:#94a3b8;border:1px solid rgba(100,116,139,0.3)" id="logoutBtn">退出</button>
      </div>
    </div>

    <div class="content">
      <!-- 仪表盘 -->
      <div id="dashboard" class="page-section active">
        <div class="stats-grid">
          <div class="stat-card"><h4>总分析次数</h4><div class="num" id="statTotal">0</div></div>
          <div class="stat-card" style="border-left-color:#10b981"><h4>今日新增</h4><div class="num" id="statToday">0</div></div>
          <div class="stat-card" style="border-left-color:#f59e0b"><h4>高风险病例</h4><div class="num" id="statHigh">0</div></div>
          <div class="stat-card" style="border-left-color:#8b5cf6"><h4>症状种类</h4><div class="num">12</div></div>
        </div>
        <div class="card">
          <h3>快捷入口</h3>
          <div style="display:flex;gap:12px;flex-wrap:wrap">
            <button class="btn btn-primary quick-btn" data-target="analysis" style="width:auto">&#10132; 开始 AI 分析</button>
            <button class="btn btn-secondary quick-btn" data-target="history" style="width:auto">&#8634; 查看历史病例</button>
            <button class="btn btn-secondary quick-btn" data-target="health" style="width:auto">&#9733; 健康数据</button>
          </div>
        </div>
        <div class="card">
          <h3>最近分析</h3>
          <div id="recentList"><p style="color:#64748b;text-align:center;padding:20px">暂无分析记录</p></div>
        </div>
      </div>

      <!-- AI分析 -->
      <div id="analysis" class="page-section">
        <div class="card">
          <h3>症状录入</h3>
          <div class="form-row">
            <div class="form-group"><label>姓名</label><input type="text" id="pName" placeholder="患者姓名"></div>
            <div class="form-group"><label>年龄</label><input type="number" id="pAge" placeholder="年龄"></div>
          </div>
          <div class="form-group">
            <label>主要症状（选择一个）</label>
            <div class="tag-group" id="symptomTags"></div>
          </div>
          <div class="form-group">
            <label>详细描述</label>
            <textarea id="pDesc" placeholder="请描述症状的具体表现、持续时间、伴随症状等..."></textarea>
          </div>
          <div class="form-group">
            <label>疼痛评分（0-10分）</label>
            <input type="range" id="painScore" min="0" max="10" value="0" style="width:100%;accent-color:#00d4ff">
            <div id="painVal" style="text-align:center;color:#64748b;margin-top:4px">0 分</div>
          </div>
          <button class="btn btn-primary" id="analyzeBtn">开始 AI 分析</button>
          <div id="analysisResult"></div>
          <div id="followUpArea" style="margin-top:16px;display:none">
            <h4 style="margin-bottom:10px;color:#e2e8f0">继续追问</h4>
            <div style="display:flex;flex-wrap:wrap;gap:8px" id="followUpBtns"></div>
            <div id="followUpAnswer" style="margin-top:12px;padding:12px;background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.2);border-radius:8px;display:none;color:#e2e8f0"></div>
          </div>
        </div>
      </div>

      <!-- 历史病例 -->
      <div id="history" class="page-section">
        <div class="card">
          <div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap">
            <input type="text" id="searchInput" placeholder="搜索姓名或症状..." style="flex:1;padding:10px 14px;border:1px solid rgba(100,116,139,0.3);border-radius:10px;background:rgba(30,41,59,0.6);color:#e2e8f0;outline:none">
            <select id="filterRisk" style="padding:10px 14px;border:1px solid rgba(100,116,139,0.3);border-radius:10px;background:rgba(30,41,59,0.6);color:#e2e8f0;outline:none">

// ==================== 初始化 ====================
function init(){
  // 绑定登录页事件
  $("authBtn").addEventListener("click", handleAuth);
  $("guestBtn").addEventListener("click", enterGuest);
  $("switchLink").addEventListener("click", toggleMode);

  // 绑定导航事件
  document.querySelectorAll(".nav-item").forEach(function(el){
    el.addEventListener("click", function(){ navTo(this.getAttribute("data-page")); });
  });

  // 绑定快捷入口
  document.querySelectorAll(".quick-btn").forEach(function(el){
    el.addEventListener("click", function(){ navTo(this.getAttribute("data-target")); });
  });

  // 绑定功能按钮
  $("analyzeBtn").addEventListener("click", startAnalyze);
  $("logoutBtn").addEventListener("click", logout);
  $("saveProfileBtn").addEventListener("click", saveProfile);
  $("exportBtn").addEventListener("click", exportData);
  $("clearBtn").addEventListener("click", clearData);
  $("closeModalBtn").addEventListener("click", closeModal);
  $("painScore").addEventListener("input", function(){ $("painVal").textContent = this.value + " 分"; });
  $("searchInput").addEventListener("input", renderHistory);
  $("filterRisk").addEventListener("change", renderHistory);

  // 生成症状标签
  var tags = $("symptomTags");
  for(var key in symptomDB){
    var span = document.createElement("span");
    span.className = "tag";
    span.textContent = key;
    span.addEventListener("click", function(){ selectSymptom(this); });
    tags.appendChild(span);
  }

  // 检查是否已登录
  currentUser = Storage.get("currentUser", null);
  if(currentUser) enterApp();

  updateStats();
  drawChart();
}

// ==================== 登录/注册 ====================
function toggleMode(){
  isLoginMode = !isLoginMode;
  $("nameGroup").classList.toggle("hidden", isLoginMode);
  $("authBtn").textContent = isLoginMode ? "登录" : "注册";
  $("switchText").textContent = isLoginMode ? "还没有账号？" : "已有账号？";
  $("switchLink").textContent = isLoginMode ? "立即注册" : "立即登录";
}

function handleAuth(){
  var account = $("account").value.trim();
  var password = $("password").value.trim();
  var name = $("regName").value.trim();
  if(!account || !password){ showToast("请填写账号和密码", "error"); return; }

  var users = Storage.get("users", {});

  if(!isLoginMode){
    if(!name){ showToast("请输入姓名", "error"); return; }
    if(users[account]){ showToast("账号已存在", "error"); return; }
    users[account] = { password: password, name: name, createdAt: new Date().toISOString() };
    Storage.set("users", users);
    showToast("注册成功，请登录", "success");
    isLoginMode = true;
    $("nameGroup").classList.add("hidden");
    $("authBtn").textContent = "登录";
    $("switchText").textContent = "还没有账号？";
    $("switchLink").textContent = "立即注册";
    return;
  }

  if(!users[account] || users[account].password !== password){
    showToast("账号或密码错误", "error"); return;
  }

  currentUser = { account: account, name: users[account].name };
  Storage.set("currentUser", currentUser);
  showToast("欢迎回来，" + users[account].name, "success");
  enterApp();
}

function enterGuest(){
  currentUser = { account: "guest_" + Date.now(), name: "游客", isGuest: true };
  Storage.set("currentUser", currentUser);
  showToast("已进入游客模式", "info");
  enterApp();
}

function enterApp(){
  $("loginPage").classList.remove("active");
  $("loginPage").style.display = "none";
  $("appPage").classList.add("active");
  $("appPage").style.display = "block";
  updateUI();
  updateStats();
  renderHistory();
}

function logout(){
  currentUser = null;
  Storage.remove("currentUser");
  $("appPage").classList.remove("active");
  $("appPage").style.display = "none";
  $("loginPage").classList.add("active");
  $("loginPage").style.display = "flex";
  $("account").value = "";
  $("password").value = "";
  $("regName").value = "";
  showToast("已退出登录", "info");
}

function updateUI(){
  if(!currentUser) return;
  $("userName").textContent = currentUser.name;
  $("userAvatar").textContent = currentUser.name.charAt(0);
}

// ==================== 导航 ====================
function navTo(page){
  document.querySelectorAll(".page-section").forEach(function(el){ el.classList.remove("active"); });
  document.querySelectorAll(".nav-item").forEach(function(el){ el.classList.remove("active"); });
  var target = $(page);
  if(target) target.classList.add("active");
  var navMap = { dashboard: 0, analysis: 1, history: 2, health: 3, profile: 4 };
  var navs = document.querySelectorAll(".nav-item");
  if(navs[navMap[page]]) navs[navMap[page]].classList.add("active");
  var titles = { dashboard: "仪表盘", analysis: "AI 分析", history: "历史病例", health: "健康数据", profile: "个人中心" };
  $("pageTitle").textContent = titles[page] || page;
}

// ==================== AI分析 ====================
function selectSymptom(el){
  document.querySelectorAll("#symptomTags .tag").forEach(function(t){ t.classList.remove("active"); });
  el.classList.add("active");
  selectedSymptom = el.textContent;
}

function startAnalyze(){
  var name = $("pName").value.trim() || "匿名";
  var age = $("pAge").value || "未知";
  var desc = $("pDesc").value.trim();
  var pain = parseInt($("painScore").value);

  if(!selectedSymptom){ showToast("请选择一个症状", "error"); return; }

  var data = symptomDB[selectedSymptom];
  var riskText = { low: "轻度", mid: "中度", high: "重度" };
  var riskColor = { low: "#10b981", mid: "#f59e0b", high: "#ef4444" };

  currentAnalysis = {
    id: Date.now(), name: name, age: age, symptom: selectedSymptom,
    desc: desc, pain: pain, date: new Date().toISOString(),
    diag: data.diag, suggestion: data.suggestion, depts: data.depts,
    risk: data.risk, riskText: riskText[data.risk]
  };

  var html = '<div class="result-box">' +
    '<h4>AI 分析结果</h4>' +
    '<p><strong style="color:#94a3b8">初步诊断：</strong>' + data.diag + '</p>' +
    '<p><strong style="color:#94a3b8">风险等级：</strong><span style="color:' + riskColor[data.risk] + ';font-weight:700">' + riskText[data.risk] + '</span></p>' +
    '<p><strong style="color:#94a3b8">疼痛评分：</strong>' + pain + '/10</p>' +
    '<p><strong style="color:#94a3b8">AI 建议：</strong></p><pre style="white-space:pre-wrap;line-height:1.7;font-family:inherit;color:#cbd5e1">' + data.suggestion + '</pre>' +
    '<div class="dept-tags"><strong style="color:#94a3b8">推荐科室：</strong>' + data.depts.map(function(d){ return '<span class="dept-tag">' + d + '</span>'; }).join("") + '</div>' +
    '</div>';
  $("analysisResult").innerHTML = html;

  // 追问按钮
  var fbtns = $("followUpBtns");
  fbtns.innerHTML = "";
  for(var q in data.followUp){
    var btn = document.createElement("button");
    btn.className = "btn btn-secondary";
    btn.style.cssText = "width:auto;padding:8px 16px;font-size:13px";
    btn.textContent = q;
    btn.addEventListener("click", (function(ans){ return function(){ showFollowUp(ans); }; })(data.followUp[q]));
    fbtns.appendChild(btn);
  }
  $("followUpArea").style.display = "block";
  $("followUpAnswer").style.display = "none";

  // 保存病例
  cases.unshift(currentAnalysis);
  Storage.set("cases", cases);
  updateStats();
  renderHistory();
  showToast("分析完成，已保存到历史病例", "success");
}

function showFollowUp(answer){
  $("followUpAnswer").textContent = answer;
  $("followUpAnswer").style.display = "block";
}

// ==================== 历史病例 ====================
function renderHistory(){
  var list = $("historyList");
  var search = $("searchInput").value.trim().toLowerCase();
  var filter = $("filterRisk").value;
  var filtered = cases.filter(function(c){
    if(search && c.name.toLowerCase().indexOf(search) === -1 && c.symptom.indexOf(search) === -1) return false;
    if(filter && c.risk !== filter) return false;
    return true;
  });

  if(filtered.length === 0){
    list.innerHTML = '<p style="color:#64748b;text-align:center;padding:20px">暂无病例记录</p>';
    return;
  }

  list.innerHTML = filtered.map(function(c){
    var color = { low: "#10b981", mid: "#f59e0b", high: "#ef4444" };
    return '<div class="history-item" data-id="' + c.id + '">' +
      '<div><strong>' + c.name + '</strong> · ' + c.age + '岁 · ' + c.symptom +
      '<br><small style="color:#64748b">' + formatDate(c.date) + '</small></div>' +
      '<div style="color:' + color[c.risk] + ';font-weight:600;font-size:13px">' +
      '<span class="status-dot status-' + c.risk + '"></span>' + c.riskText + '</div>' +
      '</div>';
  }).join("");

  // 绑定点击事件
  list.querySelectorAll(".history-item").forEach(function(el){
    el.addEventListener("click", function(){ showDetail(parseInt(this.getAttribute("data-id"))); });
  });
}

function showDetail(id){
  var c = cases.find(function(x){ return x.id === id; });
  if(!c) return;
  $("modalTitle").textContent = "病例详情";
  $("modalBody").innerHTML =
    '<p><strong style="color:#94a3b8">患者：</strong>' + c.name + ' · ' + c.age + '岁</p>' +
    '<p><strong style="color:#94a3b8">症状：</strong>' + c.symptom + '</p>' +
    '<p><strong style="color:#94a3b8">诊断：</strong>' + c.diag + '</p>' +
    '<p><strong style="color:#94a3b8">风险：</strong>' + c.riskText + '</p>' +
    '<p><strong style="color:#94a3b8">疼痛评分：</strong>' + c.pain + '/10</p>' +
    '<p><strong style="color:#94a3b8">分析日期：</strong>' + formatDate(c.date) + '</p>' +
    '<div style="margin-top:12px;padding:12px;background:rgba(30,41,59,0.5);border:1px solid rgba(0,212,255,0.1);border-radius:8px">' +
    '<strong style="color:#94a3b8">AI 建议：</strong><pre style="white-space:pre-wrap;margin-top:8px;font-family:inherit;line-height:1.7;color:#cbd5e1">' + c.suggestion + '</pre></div>' +
    '<p style="margin-top:12px"><strong style="color:#94a3b8">推荐科室：</strong>' + c.depts.join("、") + '</p>';
  $("detailModal").classList.add("show");
}

function closeModal(){
  $("detailModal").classList.remove("show");
}

// ==================== 统计 ====================
function updateStats(){
  $("statTotal").textContent = cases.length;
  var today = new Date().toISOString().split("T")[0];
  $("statToday").textContent = cases.filter(function(c){ return c.date.split("T")[0] === today; }).length;
  $("statHigh").textContent = cases.filter(function(c){ return c.risk === "high"; }).length;

  var recent = cases.slice(0, 5);
  var rlist = $("recentList");
  if(recent.length === 0){
    rlist.innerHTML = '<p style="color:#64748b;text-align:center;padding:20px">暂无分析记录</p>';
  } else {
    rlist.innerHTML = recent.map(function(c){
      return '<div style="padding:10px 0;border-bottom:1px solid rgba(0,212,255,0.08)"><strong>' + c.name + '</strong> · ' + c.symptom + ' · <small>' + formatDate(c.date) + '</small></div>';
    }).join("");
  }
}

// ==================== 图表 ====================
function drawChart(){
  var canvas = $("tempChart");
  if(!canvas) return;
  var parent = canvas.parentElement;
  var w = parent.clientWidth, h = parent.clientHeight;
  if(w === 0 || h === 0) return;
  canvas.width = w; canvas.height = h;
  var ctx = canvas.getContext("2d");

  var labels = ["6-26","6-27","6-28","6-29","6-30","7-1","7-2"];
  var data = [36.2,36.4,36.5,36.8,37.2,36.6,36.5];
  var pad = { t: 20, r: 20, b: 30, l: 40 };
  var cw = w - pad.l - pad.r, ch = h - pad.t - pad.b;
  var min = 35.5, max = 38;

  ctx.clearRect(0,0,w,h);

  // 网格
  ctx.strokeStyle = "rgba(0,212,255,0.1)";
  ctx.lineWidth = 0.5;
  for(var i = 0; i <= 5; i++){
    var y = pad.t + ch * i / 5;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
    ctx.fillStyle = "#64748b";
    ctx.font = "11px sans-serif";
    ctx.textAlign = "right";
    ctx.fillText((max - (max - min) * i / 5).toFixed(1), pad.l - 6, y + 3);
  }

  // 折线
  ctx.strokeStyle = "#00d4ff";
  ctx.lineWidth = 2;
  ctx.beginPath();
  for(var i = 0; i < data.length; i++){
    var x = pad.l + cw * i / (data.length - 1);
    var y = pad.t + ch * (max - data[i]) / (max - min);
    if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    ctx.fillStyle = "#00d4ff";
    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
  }
  ctx.stroke();

  // 标签
  ctx.fillStyle = "#94a3b8";
  ctx.font = "11px sans-serif";
  ctx.textAlign = "center";
  for(var i = 0; i < labels.length; i++){
    var x = pad.l + cw * i / (data.length - 1);
    ctx.fillText(labels[i], x, h - 8);
  }
}

// ==================== 个人中心 ====================
function saveProfile(){
  if(!currentUser) return;
  var profile = {
    nickname: $("editNickname").value,
    phone: $("editPhone").value,
    emergency: $("editEmergency").value
  };
  Storage.set("profile_" + currentUser.account, profile);
  showToast("信息已保存", "success");
}

function exportData(){
  var blob = new Blob([JSON.stringify(cases, null, 2)], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "医智查数据_" + new Date().toISOString().split("T")[0] + ".json";
  a.click();
  URL.revokeObjectURL(url);
  showToast("数据已导出", "success");
}

function clearData(){
  if(!confirm("确定要清除所有本地数据吗？此操作不可恢复。")) return;
  cases = [];
  Storage.set("cases", cases);
  updateStats();
  renderHistory();
  showToast("数据已清除", "success");
}

// ==================== 工具 ====================
function formatDate(s){
  var d = new Date(s);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

// ==================== 启动 ====================
init();
</script>
