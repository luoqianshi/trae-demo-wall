<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>创作绘本 — 私塾绘本</title>
<link rel="stylesheet" href="../shared/css/variables.css">
<link rel="stylesheet" href="../shared/css/base.css">
<link rel="stylesheet" href="../shared/css/components.css">
<style>
.create-page { background: linear-gradient(180deg, #FFFDF7 0%, #FDF8F3 100%); padding-bottom: 64px; }
.create-header { text-align: center; padding: 20px 16px 12px; }
.create-header h2 { font-size: 18px; color: var(--color-text); margin-bottom: 4px; }
.create-header p { font-size: 12px; color: var(--color-text-muted); }
.create-body { flex: 1; overflow-y: auto; padding: 0 16px 16px; }
.create-body .section-title { font-size: 13px; font-weight: 700; color: var(--color-text-secondary); margin-bottom: 8px; }

.result-card { display: flex; flex-direction: column; gap: 12px; }
.result-cover { width: 100%; aspect-ratio: 3/4; border-radius: var(--radius-lg); background: linear-gradient(135deg, #E8F5E8, #C8E6C9); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
.result-cover .icon { font-size: 64px; }
.result-cover .title { font-size: 20px; font-weight: 800; color: var(--color-primary); }
.result-cover .subtitle { font-size: 12px; color: var(--color-text-secondary); }
.result-cover .demo-notice { margin-top: 8px; padding: 6px 12px; background: rgba(255,193,7,0.15); border: 1px dashed #FFC107; border-radius: 8px; font-size: 11px; color: #F57C00; font-weight: 600; }

.result-info { display: flex; flex-direction: column; gap: 8px; }
.result-info .row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--color-text-secondary); }
.result-info .row .label { color: var(--color-text-muted); flex-shrink: 0; }

.safety-banner { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: var(--radius-md); }
.safety-banner.green { background: var(--color-safe-green-bg); }
.safety-banner .icon { font-size: 28px; }
.safety-banner .text { flex: 1; }
.safety-banner .title { font-size: 14px; font-weight: 700; color: var(--color-safe-green); }
.safety-banner .desc { font-size: 11px; color: var(--color-text-secondary); }

.review-detail { display: flex; flex-direction: column; gap: 8px; padding: 12px; background: var(--color-surface); border-radius: var(--radius-md); border: 1px solid var(--color-border-light); }
.review-detail .row { display: flex; align-items: center; gap: 6px; font-size: 12px; flex-wrap: wrap; }
.review-detail .row .label { color: var(--color-text-muted); flex-shrink: 0; font-size: 11px; }

.creating-animation { text-align: center; padding: 40px 0; }
.creating-animation .spinner { width: 48px; height: 48px; border: 4px solid var(--color-border); border-top-color: var(--color-primary); border-radius: 50%; margin: 0 auto 16px; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.creating-animation .text { font-size: 14px; color: var(--color-text-secondary); }
.creating-animation .steps { display: flex; flex-direction: column; gap: 6px; margin-top: 16px; text-align: left; max-width: 240px; margin-left: auto; margin-right: auto; }
.creating-animation .step { font-size: 12px; color: var(--color-text-muted); display: flex; align-items: center; gap: 6px; }
.creating-animation .step.done { color: var(--color-safe-green); }
.creating-animation .step.current { color: var(--color-primary); font-weight: 600; }
</style>
</head>
<body>

<div class="page create-page" id="createApp">
  <div class="page-header">
    <span class="page-title">创作绘本</span>
  </div>
  <div class="demo-banner" style="margin: 0 16px 8px;">🔬 DEMO 演示 · 绘本封面为示例占位，非真实绘本内容</div>

  <div id="createStep1" style="display:flex;flex-direction:column;flex:1;overflow:hidden;">
    <div class="create-header">
      <h2>一句话生成专属绘本</h2>
      <p>告诉孔先生你的想法，他来创作</p>
    </div>
    <div class="create-body">
      <div class="create-form">
        <div class="section-title">选择创作主题</div>
        <textarea class="create-input" id="createInput" placeholder="例如：教孩子诚实，主角是小恐龙，5岁，温暖水彩风"></textarea>
        <div class="section-title" id="templateTitle">快捷模板</div>
        <div class="quick-actions" id="templateActions">
          <button class="quick-btn" onclick="CreatePage.useTemplate('教孩子诚实，主角是小恐龙，5岁')">🦕 诚实的小恐龙</button>
          <button class="quick-btn" onclick="CreatePage.useTemplate('教孩子勇敢，主角是小兔子，4岁')">🐰 勇敢的小兔子</button>
          <button class="quick-btn" onclick="CreatePage.useTemplate('教孩子感恩，主角是小熊，5岁')">🐻 感恩的小熊</button>
        </div>
      </div>
    </div>
    <div class="page-footer">
      <button class="btn-primary" onclick="CreatePage.create()" style="width:100%;">开始创作</button>
    </div>
  </div>

  <div id="createStep2" style="display:none;flex-direction:column;flex:1;overflow:hidden;">
    <div class="creating-animation" style="flex:1;display:flex;flex-direction:column;justify-content:center;">
      <div class="spinner" id="spinner"></div>
      <div class="text" id="statusText">孔先生正在创作...</div>
      <div class="steps" id="createSteps">
        <div class="step current" data-step="1">📝 分析创作意图</div>
        <div class="step" data-step="2">🔍 价值观预审</div>
        <div class="step" data-step="3">✍️ 生成故事文本</div>
        <div class="step" data-step="4">🎨 生成绘本插图</div>
        <div class="step" data-step="5">✅ 最终安全审核</div>
      </div>
    </div>
  </div>

  <div id="createStep3" style="display:none;flex-direction:column;flex:1;overflow:auto;">
    <div class="create-body" id="resultContainer"></div>
    <div class="page-footer">
      <button class="btn-primary" onclick="CreatePage.goRead()" style="width:100%;background:linear-gradient(135deg,#B8956C,#8B5E3C);">📋 查看DEMO绘本预览</button>
    </div>
  </div>
</div>

<script src="../shared/js/mock-data.js"></script>
<script src="../shared/js/state.js"></script>
<script src="../shared/js/navigation.js"></script>
<script src="../shared/js/parent_nav.js"></script>
<script>
var CreatePage = {
  inputEl: document.getElementById('createInput'),
  currentBook: null,

  init: function() {
    var childName = UserState.getChildAddress();
    var interest = UserState.getChildInterest();
    document.getElementById('templateTitle').textContent = '快捷模板（适合' + childName + '，喜欢' + interest + '）';
    console.log('[创作绘本] 初始化 | 孩子:', childName, '| 兴趣:', interest);
  },

  useTemplate: function(text) {
    this.inputEl.value = text;
  },

  create: function() {
    var text = this.inputEl.value.trim();
    if (!text) { this.inputEl.value = '教孩子诚实，主角是小恐龙，5岁，温暖水彩风'; }
    var finalText = this.inputEl.value.trim();
    console.log('══════════════════════════════════');
    console.log('[创作绘本] 开始创作 | 输入:', finalText);
    console.log('══════════════════════════════════');

    document.getElementById('createStep1').style.display = 'none';
    document.getElementById('createStep2').style.display = 'flex';

    this.animateCreation();
  },

  animateCreation: function() {
    var steps = document.querySelectorAll('#createSteps .step');
    var statusText = document.getElementById('statusText');
    var texts = [
      '孔先生正在分析创作意图...',
      '正在执行价值观预审...',
      '正在生成故事文本...',
      '正在生成绘本插图...',
      '正在执行最终安全审核...'
    ];
    var delays = [600, 1200, 2000, 2800, 3600];
    var self = this;

    steps.forEach(function(s, i) {
      setTimeout(function() {
        steps.forEach(function(x) { x.classList.remove('current'); });
        if (i > 0) steps[i-1].classList.add('done');
        s.classList.add('current');
        statusText.textContent = texts[i];
        console.log('[创作绘本] 创作进度:', (i + 1) + '/5 -', texts[i]);
      }, delays[i]);
    });

    setTimeout(function() {
      self.showResult();
    }, 4200);
  },

  showResult: function() {
    document.getElementById('createStep2').style.display = 'none';
    document.getElementById('createStep3').style.display = 'flex';

    var book = MockData.books[0];
    this.currentBook = book;

    console.log('══════════════════════════════════');
    console.log('[创作绘本] 创作完成 | 绘本:', book.title);
    console.log('[创作绘本] 审核结果:', book.safetyLabel, '| 正向标签:', book.valuesTagsFull, '| 禁忌检查: 通过');
    console.log('══════════════════════════════════');

    var html = '<div class="result-card">' +
      '<div class="safety-banner green">' +
      '<div class="icon">✅</div>' +
      '<div class="text"><div class="title">' + book.safetyLabel + ' · 孔先生已审核通过</div><div class="desc">该绘本已通过价值观审核，适合孩子阅读</div></div>' +
      '</div>' +
      '<div class="result-cover">' +
      '<div class="icon">🦕</div>' +
      '<div class="title">' + book.title + '</div>' +
      '<div class="subtitle">' + book.author + ' · ' + book.age + ' · ' + book.style + '</div>' +
      '<div class="demo-notice">🔬 DEMO 演示 · 绘本内容为AI生成示例，非完整版绘本</div>' +
      '</div>' +
      '<div class="review-detail">' +
      '<div class="row"><span class="label">正向价值观标签：</span>';
    book.valuesTagsFull.forEach(function(t) {
      html += '<span class="value-tag">#' + t + '</span>';
    });
    html += '</div>' +
      '<div class="row"><span class="label">安全等级：</span><span class="tag tag-green">' + book.safetyLabel + '</span><span style="font-size:11px;color:var(--color-text-muted);">全龄安全，无禁忌内容</span></div>' +
      '<div class="row"><span class="label">禁忌检查：</span><span style="color:var(--color-safe-green);">✅ 通过</span></div>' +
      '</div>' +
      '<div class="result-info">' +
      '<div class="row"><span class="label">主题：</span>' + book.theme + '</div>' +
      '<div class="row"><span class="label">年龄：</span>' + book.age + '</div>' +
      '<div class="row"><span class="label">页数：</span>' + book.pages.length + '页</div>' +
      '<div class="row"><span class="label">风格：</span>' + book.style + '</div>' +
      '</div>' +
      '</div>';

    document.getElementById('resultContainer').innerHTML = html;
  },

  goRead: function() {
	    console.log('[创作绘本] → 导航到书柜查看已有绘本');
	    localStorage.setItem('sishu_library_from', 'parent');
	    navigateTo('library.html', 'parent');
	  }
};

CreatePage.init();
</script>

</body>
</html>
