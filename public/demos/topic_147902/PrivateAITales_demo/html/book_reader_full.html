<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>绘本阅读 — 私塾绘本</title>
<link rel="stylesheet" href="../shared/css/variables.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: #1a1a1a; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; overflow: hidden; }

.reader-full { display: flex; flex-direction: column; height: 100vh; }

.reader-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: rgba(0,0,0,0.5); color: #fff; }
.reader-header .title { font-size: 16px; font-weight: 600; }
.reader-header .close-btn { padding: 6px 12px; background: rgba(255,255,255,0.2); border: none; border-radius: 6px; color: #fff; font-size: 14px; cursor: pointer; }
.reader-header .close-btn:hover { background: rgba(255,255,255,0.3); }

.reader-stage { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; background: linear-gradient(135deg, #2d2d2d 0%, #1a1a1a 100%); }

.reader-page { display: flex; gap: 24px; max-width: 1400px; width: 100%; padding: 40px; animation: fadeIn 0.3s ease-out; }
@keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

.reader-left, .reader-right { flex: 1; min-width: 0; }

.reader-left { display: flex; flex-direction: column; align-items: center; }
.reader-illustration { width: 100%; max-width: 500px; aspect-ratio: 4/3; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 120px; background: linear-gradient(135deg, #FFFDF7, #F5EDE3); margin-bottom: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); position: relative; }
.reader-illustration img { width: 100%; height: 100%; object-fit: cover; border-radius: 16px; }
.demo-book-overlay { position: absolute; top: 6px; right: 6px; padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; background: rgba(255,152,0,0.9); color: #fff; z-index: 2; pointer-events: none; }

.reader-right { display: flex; flex-direction: column; justify-content: center; padding: 40px; }
.reader-text { font-size: 24px; line-height: 2; color: #FFFDF7; text-align: center; max-width: 500px; margin: 0 auto; font-weight: 300; }

.reader-controls { display: flex; align-items: center; justify-content: center; gap: 30px; padding: 20px; background: rgba(0,0,0,0.5); }
.reader-btn { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; background: rgba(255,255,255,0.1); color: #fff; cursor: pointer; transition: all 0.2s; border: 1px solid rgba(255,255,255,0.2); }
.reader-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.05); }
.reader-btn:active { transform: scale(0.95); }
.reader-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.reader-btn.speaking { background: #5B9E8C; border-color: #5B9E8C; }

.reader-page-num { font-size: 16px; color: rgba(255,255,255,0.7); min-width: 80px; text-align: center; font-weight: 600; }

.xiaoan-float { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); padding: 16px 24px; background: rgba(91,158,140,0.95); border-radius: 20px; font-size: 16px; color: #fff; display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 40px rgba(91,158,140,0.3); animation: slideUp 0.4s ease-out; z-index: 100; }
.xiaoan-float .avatar { width: 40px; height: 40px; border-radius: 50%; background: #fff; color: #5B9E8C; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; }
@keyframes slideUp { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

.questions-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 40px; }
.questions-content { background: #FFFDF7; border-radius: 20px; padding: 40px; max-width: 600px; width: 100%; text-align: center; }
.questions-content h2 { font-size: 24px; color: #3D2E1F; margin-bottom: 8px; }
.questions-content .subtitle { font-size: 14px; color: #8B7355; margin-bottom: 24px; }
.question-card { padding: 20px; background: #FDF8F3; border-radius: 12px; margin-bottom: 16px; text-align: left; }
.question-card .q-icon { font-size: 20px; margin-right: 10px; }
.question-card .q-text { font-size: 16px; color: #3D2E1F; line-height: 1.6; }

.answer-area { display: flex; gap: 8px; margin-bottom: 12px; }
.answer-input { flex: 1; padding: 12px 16px; border: 2px solid #E8DED0; border-radius: 12px; font-size: 14px; outline: none; transition: border-color 0.2s; }
.answer-input:focus { border-color: #8B5E3C; }
.answer-input:disabled { background: #f5f5f5; }
.answer-submit { padding: 12px 20px; background: linear-gradient(135deg, #8B5E3C, #6B3F1F); color: #fff; border: none; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.answer-submit:active { transform: scale(0.95); }
.answer-submit:disabled { opacity: 0.5; cursor: not-allowed; }

.answer-feedback { padding: 12px 16px; background: #E8F5E8; border-radius: 12px; margin-bottom: 12px; }
.feedback-msg { font-size: 14px; color: #2E7D32; font-weight: 600; animation: fadeIn 0.3s ease-out; }

.finish-stars { font-size: 36px; margin: 16px 0; animation: bounceIn 0.5s ease-out; }
@keyframes bounceIn { 0% { transform: scale(0); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
.finish-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #8B5E3C, #6B3F1F); color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 16px; }
.finish-btn:hover { opacity: 0.9; }

@media (max-width: 1024px) {
  .reader-page { flex-direction: column; gap: 16px; padding: 20px; }
  .reader-left, .reader-right { padding: 0; }
  .reader-illustration { max-width: 100%; }
  .reader-text { font-size: 18px; }
  .reader-controls { gap: 20px; }
  .reader-btn { width: 48px; height: 48px; }
}

/* 竖屏旋转提示 */
.rotate-hint { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 300; align-items: center; justify-content: center; flex-direction: column; gap: 16px; }
@media (orientation: portrait) and (max-width: 768px) {
  .rotate-hint { display: flex; }
}
.rotate-hint .icon { font-size: 64px; animation: rotateHint 2s ease-in-out infinite; }
@keyframes rotateHint { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } }
.rotate-hint .text { font-size: 18px; color: #fff; font-weight: 700; }
.rotate-hint .sub { font-size: 13px; color: #aaa; }
</style>
</head>
<body>

<div class="reader-full" id="readerFull">
  <!-- 竖屏旋转提示 -->
  <div class="rotate-hint" id="rotateHint">
    <div class="icon">📱</div>
    <div class="text">请将设备横屏放置</div>
    <div class="sub">横屏阅读体验更佳 · 专为Pad设计</div>
  </div>

  <div class="demo-banner" style="position:fixed;top:0;left:0;right:0;z-index:300;margin:0;border-radius:0;background:rgba(255,152,0,0.95);color:#fff;font-size:11px;padding:6px 14px;">🔬 DEMO 演示 · 绘本示例。正式产品含AI插图与语音朗读</div>

  <div class="reader-header" style="margin-top:36px;">
    <div class="title" id="bookTitle">绘本阅读</div>
    <button class="close-btn" onclick="FullReader.close()">✕ 关闭</button>
  </div>

  <div class="reader-stage" id="readerStage">
    <div class="reader-page" id="readerPage">
      <div class="reader-left">
        <div class="reader-illustration" id="readerIllustration"><div class="demo-book-overlay">DEMO</div>📖</div>
      </div>
      <div class="reader-right">
        <div class="reader-text" id="readerText"></div>
      </div>
    </div>
  </div>

  <div class="reader-controls">
    <button class="reader-btn" id="prevBtn" onclick="FullReader.prev()" disabled>◀</button>
    <button class="reader-btn" id="ttsBtn" onclick="FullReader.toggleTTS()">🔊</button>
    <span class="reader-page-num" id="pageNum">1 / 6</span>
    <button class="reader-btn" id="nextBtn" onclick="FullReader.next()">▶</button>
  </div>
</div>

<script src="../shared/js/mock-data.js"></script>
<script src="../shared/js/state.js"></script>
<script src="../shared/js/navigation.js"></script>
<script src="../shared/js/tts.js"></script>
<script>
var FullReader = {
  book: null,
  currentPage: 0,
  questionShown: false,
  xiaoanMessages: [],
  
  init: function() {
	    var params = new URLSearchParams(window.location.search);
	    var bookId = params.get('book') || 'book-001';
	    var sharedMap = { 'shared_001':'book-001','shared_002':'book-002','shared_003':'book-003','shared_004':'book-004','shared_005':'book-005','shared_006':'book-001' };
	    if (sharedMap[bookId]) bookId = sharedMap[bookId];
	    this.book = MockData.books.find(function(b) { return b.id === bookId; }) || MockData.books[0];
    this.currentPage = 0;
    this.xiaoanMessages = [
      '你好呀，' + UserState.getChildAddress() + '！今天孔先生给你准备了一本新书，《' + this.book.title + '》。准备好了吗？我们开始吧！',
      '太棒了！你读得真认真！',
      '最后一页啦，加油！',
      '读完啦！你今天表现真好！'
    ];
    
    document.getElementById('bookTitle').textContent = this.book.title;
    console.log('[宽屏阅读器] 初始化 | 绘本:', this.book.title, '| 孩子:', UserState.getChildAddress());
    this.showPage();
    
    setTimeout(function() { FullReader.showXiaoAn(0); }, 1500);
  },
  
  showXiaoAn: function(msgIdx) {
    var existing = document.querySelector('.xiaoan-float');
    if (existing) existing.remove();
    
    var bubble = document.createElement('div');
    bubble.className = 'xiaoan-float';
    bubble.innerHTML = '<div class="avatar">安</div><div>' + this.xiaoanMessages[msgIdx] + '</div>';
    document.body.appendChild(bubble);
    
    setTimeout(function() {
      var el = document.querySelector('.xiaoan-float');
      if (el) el.remove();
    }, 3500);
  },
  
  showPage: function() {
    var page = this.book.pages[this.currentPage];
    var illu = document.getElementById('readerIllustration');
    
    if (page.imageUrl) {
      illu.innerHTML = '<div class="demo-book-overlay">DEMO</div><img src="' + page.imageUrl + '" alt="绘本插图" onerror="this.style.display=\'none\';this.parentElement.innerHTML=\'<div class=\\\'demo-book-overlay\\\'>DEMO</div>' + (page.illustration || '📖') + '\';">';
    } else {
      illu.innerHTML = '<div class="demo-book-overlay">DEMO</div>';
      illu.innerHTML += page.illustration || '📖';
    }
    
    document.getElementById('readerText').textContent = page.text;
    document.getElementById('pageNum').textContent = (this.currentPage + 1) + ' / ' + this.book.pages.length;
    document.getElementById('prevBtn').disabled = this.currentPage === 0;
    document.getElementById('nextBtn').disabled = this.currentPage === this.book.pages.length - 1;
  },
  
  next: function() {
    if (this.currentPage < this.book.pages.length - 1) {
      this.currentPage++;
      console.log('[宽屏阅读器] 翻页 →', (this.currentPage + 1) + '/' + this.book.pages.length);
      this.showPage();
      
      if (this.currentPage === Math.floor(this.book.pages.length / 2)) {
        this.showXiaoAn(1);
      }
      
      if (this.currentPage === this.book.pages.length - 1) {
        this.showXiaoAn(2);
        setTimeout(function() { FullReader.showQuestions(); }, 2000);
      }
    }
  },
  
  prev: function() {
    if (this.currentPage > 0) {
      this.currentPage--;
      this.showPage();
    }
  },
  
  toggleTTS: function() {
    if (this.questionShown) return;
    var page = this.book.pages[this.currentPage];
    var btn = document.getElementById('ttsBtn');
    TTS.toggle(page.narration || page.text, btn);
  },
  
  showQuestions: function() {
    this.questionShown = true;
    this._questionIndex = 0;
    this._questions = this.book.questions || [];
    this._answers = [];
    this._showQuestionDialog();
  },
  
  _showQuestionDialog: function() {
    var self = this;
    var existing = document.getElementById('questionsOverlay');
    if (existing) existing.remove();
    
    var q = this._questions[this._questionIndex];
    var childName = UserState.getChildAddress();
    var isLast = this._questionIndex === this._questions.length - 1;
    
    var overlay = document.createElement('div');
    overlay.className = 'questions-overlay';
    overlay.id = 'questionsOverlay';
    
    overlay.innerHTML = '<div class="questions-content">' +
      '<h2>🐣 小安想问</h2>' +
      '<div class="subtitle">和' + childName + '聊聊这本书吧（' + (this._questionIndex + 1) + '/' + this._questions.length + '）</div>' +
      '<div class="question-card">' +
      '<div class="q-text"><span class="q-icon">💬</span>' + q + '</div>' +
      '</div>' +
      '<div class="answer-area">' +
      '<input type="text" class="answer-input" id="answerInput" placeholder="' + childName + '，说说你的想法...">' +
      '<button class="answer-submit" onclick="FullReader._submitAnswer()">回答</button>' +
      '</div>' +
      '<div class="answer-feedback" id="answerFeedback" style="display:none;"></div>' +
      '<button class="finish-btn" id="finishBtn" style="display:none;" onclick="FullReader.close()">读完啦，关闭</button>' +
      '</div>';
    
    document.body.appendChild(overlay);
    
    var input = document.getElementById('answerInput');
    input.focus();
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') self._submitAnswer();
    });
  },
  
  _submitAnswer: function() {
    var input = document.getElementById('answerInput');
    var answer = input.value.trim();
    if (!answer) return;
    
    this._answers.push(answer);
    input.disabled = true;
    document.querySelector('.answer-submit').disabled = true;
    
    var feedback = document.getElementById('answerFeedback');
    feedback.style.display = 'block';
    var childName = UserState.getChildAddress();
    var replies = [
      '哇，' + childName + '说得真好！你的想法让老师很惊喜呢～',
      childName + '真会思考！每个孩子都有自己独特的想法～',
      '太棒了！' + childName + '的答案让老师学到了新东西！',
      '嗯嗯，' + childName + '说得很有道理！继续加油～'
    ];
    feedback.innerHTML = '<div class="feedback-msg">' + replies[Math.floor(Math.random() * replies.length)] + '</div>';
    
    var self = this;
    setTimeout(function() {
      self._questionIndex++;
      if (self._questionIndex < self._questions.length) {
        self._showQuestionDialog();
      } else {
        self._showFinish();
      }
    }, 1500);
  },
  
  _showFinish: function() {
    var existing = document.getElementById('questionsOverlay');
    if (existing) existing.remove();
    
    var childName = UserState.getChildAddress();
    var overlay = document.createElement('div');
    overlay.className = 'questions-overlay';
    overlay.id = 'questionsOverlay';
    
    overlay.innerHTML = '<div class="questions-content">' +
      '<h2>🎉 太厉害了！</h2>' +
      '<div class="subtitle">' + childName + '回答了全部问题，真是个爱思考的好孩子！</div>' +
      '<div class="finish-stars">⭐⭐⭐⭐⭐</div>' +
      '<button class="finish-btn" onclick="FullReader.close()">读完啦，关闭</button>' +
      '</div>';
    
    document.body.appendChild(overlay);
  },
  
  close: function() {
    navigateTo('child_home.html', 'child');
  }
};

FullReader.init();
</script>

</body>
</html>
