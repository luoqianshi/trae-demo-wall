<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>绘本阅读器 — 私塾绘本</title>
<link rel="stylesheet" href="../shared/css/variables.css">
<link rel="stylesheet" href="../shared/css/base.css">
<link rel="stylesheet" href="../shared/css/components.css">
<style>
.reader-page-wrap { background: linear-gradient(180deg, #F0F8F5 0%, #E8F5F0 100%); }
.reader-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.reader-stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; padding: 20px; }
.reader-illustration { width: 180px; height: 180px; border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; font-size: 72px; background: linear-gradient(135deg, #FFFDF7, #F5EDE3); margin-bottom: 16px; box-shadow: var(--shadow-md); position: relative; }
.reader-illustration img { width: 100%; height: 100%; object-fit: cover; border-radius: var(--radius-lg); }
.reader-page-text { font-size: 17px; line-height: 2; color: var(--color-text); text-align: center; max-width: 260px; }
.reader-controls { display: flex; align-items: center; justify-content: center; gap: 20px; padding: 16px; background: var(--color-surface); border-top: 1px solid var(--color-border-light); }
.reader-btn { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; background: var(--color-bg-alt); color: var(--color-text); transition: all 0.2s; }
.reader-btn:active { background: var(--color-border); }
.reader-btn:disabled { opacity: 0.3; }
.reader-btn.speaking { background: var(--color-xiao-an-bg); color: var(--color-xiao-an); }
.reader-page-num { font-size: 13px; color: var(--color-text-muted); min-width: 60px; text-align: center; }

.xiaoan-bubble { position: absolute; bottom: 100px; left: 16px; right: 16px; padding: 12px 16px; background: var(--color-xiao-an-bg); border-radius: 16px; font-size: 14px; color: var(--color-text); display: flex; align-items: flex-start; gap: 8px; box-shadow: var(--shadow-md); animation: slideUp 0.3s ease-out; }
@keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.question-card { padding: 16px; background: var(--color-surface); border-radius: var(--radius-lg); border: 1px solid var(--color-border-light); text-align: center; }
.question-card h3 { font-size: 15px; margin-bottom: 8px; color: var(--color-xiao-an); }
.question-card p { font-size: 14px; color: var(--color-text); line-height: 1.6; margin-bottom: 12px; }
.question-card .option { display: block; width: 100%; padding: 10px; margin-bottom: 6px; background: var(--color-bg-alt); border: 1px solid var(--color-border-light); border-radius: var(--radius-sm); font-size: 13px; color: var(--color-text); text-align: center; cursor: pointer; transition: all 0.2s; }
.question-card .option:active { background: var(--color-xiao-an-bg); border-color: var(--color-xiao-an); }

.xiaoan-header { display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: var(--color-xiao-an-bg); border-bottom: 1px solid #D4E8E0; }
.xiaoan-header .greeting { font-size: 14px; color: var(--color-text); }
</style>
</head>
<body>

<div class="page reader-page-wrap" id="readerApp">
  <div class="demo-banner" style="margin-bottom: 8px;">🔬 DEMO 演示 · 绘本内容为示例占位。正式产品将包含AI生成的精美插图与语音朗读</div>
  <div class="xiaoan-header">
    <div class="avatar avatar-xiaoan">安</div>
    <div class="greeting">小安 — 陪你读书</div>
  </div>

  <div class="reader-container" id="readerContainer">
    <div class="reader-stage" id="readerStage">
      <div class="reader-illustration" id="readerIllustration"><div class="demo-book-overlay">DEMO</div>📖</div>
      <div class="reader-page-text" id="readerText"></div>
      <div class="xiaoan-bubble" id="xiaoanBubble" style="display:none;"></div>
    </div>

    <div class="reader-controls">
      <button class="reader-btn" id="prevBtn" onclick="Reader.prev()" disabled>◀</button>
      <button class="reader-btn" id="ttsBtn" onclick="Reader.toggleTTS()">🔊</button>
      <span class="reader-page-num" id="pageNum">1 / 6</span>
      <button class="reader-btn" id="nextBtn" onclick="Reader.next()">▶</button>
    </div>
  </div>

  <div id="questionContainer" style="display:none;flex-direction:column;flex:1;overflow:auto;padding:16px;"></div>
</div>

<script src="../shared/js/mock-data.js"></script>
<script src="../shared/js/state.js"></script>
<script src="../shared/js/tts.js"></script>
<script src="../shared/js/navigation.js"></script>
<script>
var Reader = {
  book: null,
  currentPage: 0,
  questionShown: false,

  init: function() {
    var params = new URLSearchParams(window.location.search);
    var bookId = params.get('book') || 'book-001';
    var sharedMap = { 'shared_001':'book-001','shared_002':'book-002','shared_003':'book-003','shared_004':'book-004','shared_005':'book-005','shared_006':'book-001' };
    if (sharedMap[bookId]) bookId = sharedMap[bookId];
    this.book = MockData.books.find(function(b) { return b.id === bookId; }) || MockData.books[0];
    this.currentPage = 0;
    console.log('══════════════════════════════════');
    console.log('[绘本阅读器·小安] 初始化 | 孩子:', UserState.getChildAddress(), '| 兴趣:', UserState.getChildInterest());
    console.log('[绘本阅读器·小安] 绘本:', this.book.title, '| 安全等级:', this.book.safetyLabel, '| 页数:', this.book.pages.length);
    console.log('══════════════════════════════════');
    this.showXiaoAnGreeting();
  },

  showXiaoAnGreeting: function() {
    var self = this;
    var bubble = document.getElementById('xiaoanBubble');
    var childName = UserState.getChildAddress();
    var interest = UserState.getChildInterest();
    
    bubble.style.display = 'flex';
    if (this.book.title.indexOf('恐龙') !== -1) {
      bubble.innerHTML = '<span style="font-size:24px;">🦕</span><div>你好呀，<b>' + childName + '</b>！今天孔先生知道你喜欢' + interest + '，特意给你准备了一本关于小恐龙的书，《' + self.book.title + '》。准备好了吗？我们开始吧！</div>';
    } else {
      bubble.innerHTML = '<span style="font-size:24px;">🐣</span><div>你好呀，<b>' + childName + '</b>！今天孔先生给你准备了一本新书，《' + self.book.title + '》。准备好了吗？我们开始吧！</div>';
    }
    console.log('[绘本阅读器·小安] 小安开场问候 | 孩子:', childName, '| 绘本:', self.book.title);
    setTimeout(function() {
      bubble.style.display = 'none';
      self.showPage();
    }, 3000);
  },

  showPage: function() {
    var page = this.book.pages[this.currentPage];
    var illu = document.getElementById('readerIllustration');
    
    if (page.imageUrl) {
      illu.innerHTML = '<div class="demo-book-overlay">DEMO</div><img src="' + page.imageUrl + '" alt="绘本插图">';
    } else {
      illu.innerHTML = '<div class="demo-book-overlay">DEMO</div>';
      illu.innerHTML += page.illustration;
    }
    
    document.getElementById('readerText').textContent = page.text;
    document.getElementById('pageNum').textContent = (this.currentPage + 1) + ' / ' + this.book.pages.length;
    document.getElementById('prevBtn').disabled = this.currentPage === 0;
    document.getElementById('nextBtn').disabled = this.currentPage === this.book.pages.length - 1;
  },

  next: function() {
    if (this.currentPage < this.book.pages.length - 1) {
      this.currentPage++;
      console.log('[绘本阅读器·小安] 翻页 →', (this.currentPage + 1) + '/' + this.book.pages.length);
      this.showPage();
      if (this.currentPage === this.book.pages.length - 1) {
        console.log('[绘本阅读器·小安] 到达最后一页，准备展示阅读后提问');
        var self = this;
        setTimeout(function() { self.showQuestions(); }, 1500);
      }
    }
  },

  prev: function() {
    if (this.currentPage > 0) {
      this.currentPage--;
      this.showPage();
    }
  },

  toggleTTS: function() {
    if (this.questionShown) return;
    var page = this.book.pages[this.currentPage];
    var btn = document.getElementById('ttsBtn');
    console.log('[绘本阅读器·小安] TTS朗读 | 第' + (this.currentPage + 1) + '页');
    TTS.toggle(page.narration || page.text, btn);
  },

  showQuestions: function() {
    this.questionShown = true;
    console.log('[绘本阅读器·小安] 阅读结束 → 展示启发式提问 | 问题数:', this.book.questions.length);
    document.getElementById('readerContainer').style.display = 'none';
    var qc = document.getElementById('questionContainer');
    qc.style.display = 'flex';
    qc.innerHTML = '';

    var childName = UserState.getChildAddress();
    var questions = this.book.questions;
    questions.forEach(function(q, i) {
      var card = document.createElement('div');
      card.className = 'question-card';
      card.style.marginBottom = '12px';
      card.innerHTML = '<h3>🐣 小安想问</h3><p>' + q + '</p>' +
        '<button class="option" onclick="Reader.answerQuestion(this, ' + i + ')">💬 和' + childName + '聊聊这个</button>';
      qc.appendChild(card);
    });

    qc.innerHTML += '<button class="btn-primary" onclick="Reader.finishReading()" style="width:100%;margin-top:8px;">读完啦</button>';
  },

  answerQuestion: function(btn, idx) {
    console.log('[绘本阅读器·小安] 家长回答提问 | 第' + (idx + 1) + '题');
    btn.textContent = '✅ 已聊过';
    btn.style.background = 'var(--color-safe-green-bg)';
    btn.style.borderColor = 'var(--color-safe-green)';
    btn.style.color = 'var(--color-safe-green)';
    btn.disabled = true;
  },

  finishReading: function() {
    var childName = UserState.getChildAddress();
    console.log('══════════════════════════════════');
    console.log('[绘本阅读器·小安] 阅读完成 | 孩子:', childName, '| 绘本:', this.book.title);
    console.log('══════════════════════════════════');
    document.getElementById('questionContainer').style.display = 'none';
    document.getElementById('readerContainer').style.display = 'flex';
    var bubble = document.getElementById('xiaoanBubble');
    bubble.style.display = 'flex';
    bubble.innerHTML = '<span style="font-size:24px;">🌟</span><div><b>' + childName + '</b>，你太棒了！今天又读完了一本好书。下次见！</div>';
    setTimeout(function() {
      navigateTo('child_home.html');
    }, 2500);
  }
};

Reader.init();
</script>

</body>
</html>
