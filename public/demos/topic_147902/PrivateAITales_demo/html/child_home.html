﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>小安陪读 — 私塾绘本</title>
<link rel="stylesheet" href="../shared/css/variables.css">
<link rel="stylesheet" href="../shared/css/base.css">
<link rel="stylesheet" href="../shared/css/components.css">
<style>
.child-page {
  background: linear-gradient(180deg, #FFF5E8 0%, #FFFBF5 30%, #F8FFF9 100%);
  min-height: 100vh;
  padding-bottom: 64px;
}
.child-header {
  background: linear-gradient(135deg, #FFE8D6 0%, #FFD6B0 100%);
  padding: 20px 16px 24px;
  display: flex;
  align-items: center;
  gap: 14px;
  border-radius: 0 0 24px 24px;
  box-shadow: 0 4px 20px rgba(255, 180, 120, 0.2);
}
.child-header .avatar {
  width: 56px; height: 56px; border-radius: 50%;
  background: linear-gradient(135deg, #FFB74D, #FF9800);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; font-weight: 700; color: #fff;
  box-shadow: 0 4px 12px rgba(255, 152, 0, 0.3);
}
.child-header .greeting { font-size: 20px; font-weight: 800; color: #5D4037; }
.child-header .subtitle { font-size: 13px; color: #8D6E63; margin-top: 2px; font-weight: 500; }

.section-block { margin-top: 20px; }
.section-title {
  font-size: 16px; font-weight: 800; color: #5D4037;
  padding: 0 16px 10px; display: flex; align-items: center;
  justify-content: space-between;
}
.section-title .left { display: flex; align-items: center; gap: 6px; }
.section-title .more { font-size: 12px; color: #FF9800; font-weight: 600; cursor: pointer; }

.scroll-row {
  display: flex; gap: 12px; padding: 0 16px 4px;
  overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.scroll-row::-webkit-scrollbar { display: none; }

.book-card {
  flex-shrink: 0; width: 160px; background: #fff;
  border-radius: 16px; overflow: hidden; cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 3px 12px rgba(0,0,0,0.06);
  border: 2px solid transparent;
  display: flex; flex-direction: column;
  padding: 0; gap: 0;
}
.book-card:active { transform: scale(0.96); }
.book-card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.1); border-color: #FFCC80; }
.book-card .cover {
  width: 100%; aspect-ratio: 4/3;
  background: linear-gradient(135deg, #FFF8E1, #FFECB3);
  display: flex; align-items: center; justify-content: center;
  font-size: 56px; overflow: hidden; position: relative;
}
.book-card .cover img { width: 100%; height: 100%; object-fit: cover; }
.book-card .cover .read-badge {
  position: absolute; top: 8px; right: 8px;
  background: rgba(46,125,50,0.9); color: #fff;
  font-size: 11px; padding: 3px 8px; border-radius: 6px; font-weight: 600;
}
.book-card .info { padding: 10px 12px; }
.book-card .title {
  font-size: 14px; font-weight: 700; color: #5D4037;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.book-card .meta { font-size: 11px; color: #8D6E63; margin-top: 3px; }
.book-card .tag-row { display: flex; gap: 4px; margin-top: 5px; }
.book-card .tag {
  font-size: 10px; padding: 3px 7px; border-radius: 5px;
  background: linear-gradient(135deg, #C8E6C9, #A5D6A7); color: #2E7D32; font-weight: 600;
}

.stats-strip {
  display: flex; gap: 8px; margin: 0 16px 4px;
  padding: 12px 14px;
  background: linear-gradient(135deg, #FFF3E0, #FFE0B2);
  border-radius: 14px;
}
.stats-strip .stat { flex: 1; text-align: center; }
.stats-strip .stat .num { font-size: 18px; font-weight: 800; color: #E65100; }
.stats-strip .stat .label { font-size: 10px; color: #8D6E63; margin-top: 2px; }
.stats-strip .divider { width: 1px; background: rgba(141,110,99,0.2); }

.floating-btn {
  position: fixed; bottom: 28px; right: 20px;
  width: 56px; height: 56px; border-radius: 50%;
  background: linear-gradient(135deg, #FFB74D, #FF9800);
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 26px; box-shadow: 0 6px 20px rgba(255, 152, 0, 0.4);
  cursor: pointer; transition: all 0.3s; border: 3px solid #fff; z-index: 50;
}
.floating-btn:active { transform: scale(0.9); }

/* 孩子端底部导航 */
.child-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #E8DED0; display: flex; padding: 6px 0 8px; z-index: 100; }
.child-nav .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; padding: 4px 0; color: #8B7355; font-size: 10px; font-weight: 600; transition: all 0.2s; text-decoration: none; }
.child-nav .nav-item.active { color: #FF9800; }
.child-nav .nav-item .nav-icon { font-size: 20px; }

/* 横屏 Pad 优化 */
@media (min-width: 768px) and (orientation: landscape) {
  .child-page { max-width: 1024px; margin: 0 auto; border-left: 1px solid #FFE0B2; border-right: 1px solid #FFE0B2; }
  .child-header { padding: 24px 40px; border-radius: 0 0 32px 32px; }
  .book-grid { grid-template-columns: repeat(3, 1fr); padding: 0 24px; gap: 12px; }
  .book-card .cover { font-size: 56px; }
  .stats-strip { margin: 0 24px 8px; padding: 16px 20px; }
  .section-block { padding: 0 24px; }
  .floating-btn { bottom: 80px; right: 40px; width: 64px; height: 64px; font-size: 30px; }
}
</style>
</head>
<body>

<div class="page child-page">
  <div class="child-header">
    <div class="avatar avatar-xiaoan">安</div>
    <div>
      <div class="greeting" id="greeting">🌟 推荐</div>
      <div class="subtitle" id="subtitle">今天为你准备了这些好书</div>
    </div>
  </div>

	  <div class="demo-banner">🔬 DEMO 演示 · 仅展示功能流程。正式产品含精美绘本、AI语音朗读与个性化推荐</div>

  <div class="stats-strip">
    <div class="stat"><div class="num">100</div><div class="label">已读完</div></div>
    <div class="divider"></div>
    <div class="stat"><div class="num">8</div><div class="label">本周阅读</div></div>
    <div class="divider"></div>
    <div class="stat"><div class="num">5000+</div><div class="label">可探索</div></div>
  </div>

  <div class="section-block">
    <div class="section-title">
      <span class="left">🎯 孔先生推荐</span>
      <span class="more" onclick="ChildHome.openLibrary()">查看书柜 →</span>
    </div>
    <div class="scroll-row" id="recommendGrid"></div>
  </div>

  <div class="section-block">
    <div class="section-title">
      <span class="left">📖 最近在读</span>
      <span class="more" onclick="ChildHome.openLibrary()">全部历史 →</span>
    </div>
    <div class="scroll-row" id="readingGrid"></div>
  </div>

  <div class="section-block">
    <div class="section-title">
      <span class="left">⭐ 读过的好书</span>
      <span class="more" onclick="ChildHome.openLibrary()">更多 →</span>
    </div>
    <div class="scroll-row" id="finishedGrid"></div>
  </div>

  <div style="height:20px;"></div>
</div>

<script src="../shared/js/mock-data.js"></script>
<script src="../shared/js/state.js"></script>
<script src="../shared/js/navigation.js"></script>
<script src="../shared/js/child_nav.js"></script>
<script>
var ChildHome = {
  init: function() {
    var childName = UserState.getChildAddress();
    var interest = UserState.getChildInterest();
    document.getElementById('greeting').textContent = '嗨，' + childName + '！';
    var subText = '我是小安';
    if (interest && interest.indexOf('恐龙') !== -1) {
      subText = '今天孔先生给你准备了好多恐龙故事！';
    } else if (interest && interest.indexOf('兔子') !== -1) {
      subText = '今天孔先生准备了小兔子的故事！';
    } else {
      subText = '今天为你准备了新书，快来看看吧！';
    }
    document.getElementById('subtitle').textContent = subText;

    console.log('[孩子首页] 初始化 | 孩子:', childName, '| 兴趣:', interest);

    this.showRecommendations();
    this.showReading();
    this.showFinished();
  },

  createCard: function(b, showReadBadge) {
	    var card = document.createElement('div');
	    card.className = 'book-card';
	    card.style.position = 'relative';
	    card.onclick = function() { ChildHome.openBook(b.id); };

	    var coverHtml = '';
		    var coverImg = b.coverImage || (b.pages[0] && b.pages[0].imageUrl);
		    if (coverImg) {
		      var badge = showReadBadge ? '<div class="read-badge">已读</div>' : '';
		      coverHtml = '<div class="cover"><img src="' + coverImg + '" alt="' + b.title + '">' + badge + '</div>';
		    } else {
	      var icon = b.title.indexOf('恐龙') !== -1 ? '🦕' : (b.title.indexOf('兔子') !== -1 ? '🐰' : (b.title.indexOf('熊') !== -1 ? '🐻' : '📖'));
	      coverHtml = '<div class="cover">' + icon + '</div>';
	    }

	    var firstTag = b.valuesTags[0] || '';
	    card.innerHTML = '<div class="demo-book-overlay">DEMO</div>' + coverHtml +
	      '<div class="info">' +
	      '<div class="title">' + b.title + '</div>' +
	      '<div class="meta">' + b.age + '</div>' +
	      '<div class="tag-row"><span class="tag">' + b.safetyLabel + '</span>' +
	      (firstTag ? '<span class="tag" style="background:#FFF3E0;color:#E65100;">' + firstTag + '</span>' : '') +
	      '</div>' +
	      '</div>';
	    return card;
	  },

  showRecommendations: function() {
    var books = MockData.books;
    var grid = document.getElementById('recommendGrid');
    grid.innerHTML = '';
    books.forEach(function(b) {
      grid.appendChild(ChildHome.createCard(b, false));
    });
  },

  showReading: function() {
    var books = MockData.books.slice(0, 3);
    var grid = document.getElementById('readingGrid');
    grid.innerHTML = '';
    books.forEach(function(b) {
      grid.appendChild(ChildHome.createCard(b, false));
    });
  },

  showFinished: function() {
    var books = MockData.books.slice(2, 5);
    var grid = document.getElementById('finishedGrid');
    grid.innerHTML = '';
    books.forEach(function(b) {
      grid.appendChild(ChildHome.createCard(b, true));
    });
  },

  openBook: function(id) {
    console.log('[孩子首页] 打开绘本 | bookId:', id);
    ChildNav.openReader(id);
  },

  openLibrary: function() {
    console.log('[孩子首页] 打开书柜');
    localStorage.setItem('sishu_library_from', 'child');
    navigateTo('library.html');
  }
};

ChildHome.init();
</script>

</body>
</html>
