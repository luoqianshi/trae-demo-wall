<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>孔先生 — 私塾绘本</title>
<link rel="stylesheet" href="../shared/css/variables.css">
<link rel="stylesheet" href="../shared/css/base.css">
<link rel="stylesheet" href="../shared/css/components.css">
<style>
.chat-page { background: #F5EDE3; display: flex; flex-direction: column; height: 100vh; }
.chat-messages { flex: 1; overflow-y: auto; padding: 12px 16px 150px; display: flex; flex-direction: column; gap: 12px; }
.chat-row { display: flex; gap: 8px; align-items: flex-end; }
.chat-row.right { justify-content: flex-end; }
.chat-row.left { justify-content: flex-start; }
.msg-time { text-align: center; font-size: 11px; color: var(--color-text-muted); padding: 4px 0; }

.chat-input-row { display: flex; gap: 8px; align-items: flex-end; padding: 10px 12px; background: #fff; border-top: 1px solid var(--color-border-light); position: fixed; bottom: 73px; left: 0; right: 0; z-index: 50; }
.chat-input { flex: 1; padding: 10px 14px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 20px; font-size: 14px; color: var(--color-text); }
.chat-input:focus { outline: none; border-color: var(--color-primary); }
.chat-send { width: 36px; height: 36px; border-radius: 50%; background: var(--color-primary-gradient); color: #fff; font-size: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: none; cursor: pointer; }

.top-actions { display: flex; gap: 6px; }
.top-action-btn { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; border: none; transition: all 0.2s; }
.top-action-btn:active { transform: scale(0.92); background: rgba(255,255,255,0.35); }

.report-msg { padding: 0; }
.report-msg .bubble { background: linear-gradient(135deg, #FFFDF7, #FFF5EB); border: 1px solid var(--color-accent); border-radius: var(--radius-lg); padding: 16px; max-width: 100%; }
.report-msg .bubble .report-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.report-msg .bubble .report-header .icon { font-size: 24px; }
.report-msg .bubble .report-title { font-size: 15px; font-weight: 700; color: var(--color-primary); }
.report-msg .bubble .report-date { font-size: 11px; color: var(--color-text-muted); }
.report-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.report-stat { text-align: center; padding: 8px; background: var(--color-bg); border-radius: var(--radius-sm); }
.report-stat-num { font-size: 18px; font-weight: 800; color: var(--color-primary); }
.report-stat-label { font-size: 10px; color: var(--color-text-muted); }
.report-radar { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.report-radar-item { display: flex; align-items: center; gap: 8px; font-size: 11px; }
.report-radar-item .label { width: 50px; text-align: right; color: var(--color-text-secondary); flex-shrink: 0; }
.report-radar-item .bar { flex: 1; height: 6px; background: var(--color-border-light); border-radius: 3px; overflow: hidden; }
.report-radar-item .fill { height: 100%; background: var(--color-primary-gradient); border-radius: 3px; }
.report-suggestion { font-size: 12px; color: var(--color-text-secondary); line-height: 1.6; padding: 10px; background: var(--color-primary-light); border-radius: var(--radius-sm); }

/* SVG雷达图 */
.radar-svg-wrap { display: flex; justify-content: center; margin-bottom: 12px; }
.radar-svg-wrap svg { width: 100%; max-width: 280px; height: auto; }

/* AI审核卡片 */
.audit-card { margin-top: 8px; padding: 12px; background: #F0F8F5; border-radius: 10px; border: 1px solid #C8E6D0; }
.audit-card .audit-header { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-size: 13px; font-weight: 700; color: #2E7D32; }
.audit-card .audit-score { font-size: 24px; font-weight: 800; color: #2E7D32; text-align: center; margin: 8px 0; }
.audit-card .audit-score span { font-size: 12px; font-weight: 400; color: #8B7355; }
.audit-check-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #E8F0EC; font-size: 11px; }
.audit-check-item:last-child { border-bottom: none; }
.audit-check-item .check-icon { color: #2E7D32; font-size: 14px; flex-shrink: 0; }
.audit-check-item .check-detail { flex: 1; color: #3D2E1F; }
.audit-check-item .check-score { font-weight: 700; color: #2E7D32; flex-shrink: 0; }
.audit-summary { font-size: 12px; color: #3D2E1F; padding: 8px; background: #fff; border-radius: 6px; margin-top: 8px; line-height: 1.5; }

.book-reco { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0; }
.book-reco-item { flex-shrink: 0; width: 100px; padding: 10px; background: var(--color-surface); border-radius: var(--radius-sm); border: 1px solid var(--color-border-light); text-align: center; cursor: pointer; }
.book-reco-item .cover { width: 60px; height: 80px; border-radius: 4px; margin: 0 auto 6px; display: flex; align-items: center; justify-content: center; font-size: 32px; background: var(--color-accent-light); }
.book-reco-item .name { font-size: 11px; font-weight: 600; color: var(--color-text); }
</style>
</head>
<body>

<div class="page chat-page">
  <div class="demo-banner" style="margin: 0 12px 8px;">🔬 DEMO 演示 · 孔先生对话为模拟交互，非真实AI对话</div>
  <div class="page-header" style="display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--color-primary-gradient);color:#fff;">
    <div class="avatar avatar-kong" id="kongAvatar" style="width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;background:linear-gradient(135deg,#8B5E3C,#6B3F1F);color:#fff;">孔</div>
    <div style="flex:1;">
      <div style="font-size:16px;font-weight:700;">孔先生</div>
      <div style="font-size:11px;opacity:0.85;">AI 私塾先生 · 在线</div>
    </div>
    <div class="top-actions">
      <button class="top-action-btn" title="书柜" onclick="ChatPage.openLibrary()">📚</button>
      <button class="top-action-btn" title="创作" onclick="ChatPage.openCreate()">✏️</button>
      <button class="top-action-btn" title="周报" onclick="ChatPage.showReport()">📊</button>
    </div>
  </div>

  <div class="chat-messages" id="chatMessages">
    <div class="msg-time">今天</div>
  </div>

  <div class="chat-input-row">
    <input class="chat-input" id="chatInput" placeholder="和孔先生说说你的想法..." onkeydown="if(event.key==='Enter')ChatPage.send()">
    <button class="chat-send" onclick="ChatPage.send()">➤</button>
  </div>

  <div style="height:73px;"></div>
</div>

<script src="../shared/js/mock-data.js"></script>
<script src="../shared/js/state.js"></script>
<script src="../shared/js/navigation.js"></script>
<script src="../shared/js/parent_nav.js"></script>
<script>
var ChatPage = {
  messagesEl: document.getElementById('chatMessages'),
  inputEl: document.getElementById('chatInput'),
  reportShown: false,
  libraryShown: false,

  init: function() {
    console.log('══════════════════════════════════');
    console.log('[孔先生对话] 初始化 | 家长:', UserState.getParentAddress());
    console.log('══════════════════════════════════');
    this.showInitialMessages();
  },

  addMsg: function(html, side) {
    var div = document.createElement('div');
    div.className = 'chat-row ' + side;
    if (side === 'left') {
      var av = document.createElement('div');
      av.className = 'avatar avatar-kong';
      av.style.cssText = 'display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;background:linear-gradient(135deg,#8B5E3C,#6B3F1F);color:#fff;';
      av.textContent = '孔';
      div.appendChild(av);
    }
    var b = document.createElement('div');
    b.className = 'bubble bubble-' + (side === 'left' ? 'left' : 'right');
    if (typeof html === 'string') {
      b.innerHTML = html;
    } else {
      b.appendChild(html);
    }
    div.appendChild(b);
    this.messagesEl.appendChild(div);
    this.messagesEl.scrollTop = this.messagesEl.scrollHeight;
  },

  showInitialMessages: function() {
    var childName = UserState.getChildAddress();
    var interest = UserState.getChildInterest();
    this.addMsg('早安，<b>' + UserState.getParentAddress() + '</b>。<br>昨晚小安陪' + childName + '读了《诚实的小恐龙》，孩子读完后主动和小安分享了他的一次诚实经历。', 'left');
    this.addMsg('太好了！谢谢孔先生。', 'right');
    this.addMsg('不客气。看到' + childName + '开始理解诚实的意义，我也很欣慰。这是本周的阅读报告，请过目。', 'left');
    this.showReportCard();
  },

  showReportCard: function() {
    if (this.reportShown) return;
    this.reportShown = true;
    var data = MockData.kongMessages[1];
    var r = data.radar;
    var audit = MockData.auditDetails["book-001"];

    // 生成SVG雷达图
    var svgRadar = this._buildRadarSVG(r);

    var html = '<div class="report-msg"><div class="bubble">' +
      '<div class="report-header"><span class="icon">📊</span><span class="report-title">本周阅读报告</span><span class="report-date">' + data.date + '</span></div>' +
      '<div class="report-stats">' +
      '<div class="report-stat"><div class="report-stat-num">' + data.stats.readCount + '</div><div class="report-stat-label">阅读本数</div></div>' +
      '<div class="report-stat"><div class="report-stat-num">' + data.stats.newBooks + '</div><div class="report-stat-label">新绘本</div></div>' +
      '<div class="report-stat"><div class="report-stat-num">' + data.stats.totalMinutes + 'min</div><div class="report-stat-label">阅读时长</div></div>' +
      '</div>' +
      '<div class="radar-svg-wrap">' + svgRadar + '</div>' +
      '<div class="report-suggestion">' + data.suggestion.replace(/\n/g, '<br>') + '</div>';

    // AI审核示例
    if (audit) {
      html += '<div class="audit-card">' +
        '<div class="audit-header">🛡️ AI内容审核示例 —《诚实的小恐龙》</div>' +
        '<div class="audit-score">' + audit.score + '<span> / 100 · 绿级安全</span></div>';
      audit.checks.forEach(function(c) {
        html += '<div class="audit-check-item">' +
          '<span class="check-icon">✅</span>' +
          '<span class="check-detail">' + c.item + '：' + c.detail + '</span>' +
          '<span class="check-score">' + c.score + '</span>' +
          '</div>';
      });
      html += '<div class="audit-summary">💡 ' + audit.summary + '</div>';
      html += '</div>';
    }

    html += '</div></div>';
    this.addMsg(html, 'left');
  },

  _buildRadarSVG: function(radarData) {
    var cx = 140, cy = 140, r = 110;
    var n = radarData.length;
    var levels = 5;
    var svg = '<svg viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg">';

    // 背景网格
    for (var l = 1; l <= levels; l++) {
      var levelR = r * l / levels;
      var pts = [];
      for (var i = 0; i < n; i++) {
        var angle = -Math.PI / 2 + (2 * Math.PI * i) / n;
        var x = cx + levelR * Math.cos(angle);
        var y = cy + levelR * Math.sin(angle);
        pts.push(x.toFixed(1) + ',' + y.toFixed(1));
      }
      svg += '<polygon points="' + pts.join(' ') + '" fill="none" stroke="' + (l === levels ? '#D4C5B5' : '#E8DED0') + '" stroke-width="' + (l === levels ? '1.5' : '0.8') + '"/>';
    }

    // 轴线
    for (var i = 0; i < n; i++) {
      var angle = -Math.PI / 2 + (2 * Math.PI * i) / n;
      var x = cx + r * Math.cos(angle);
      var y = cy + r * Math.sin(angle);
      svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + x.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="#E8DED0" stroke-width="0.8"/>';
    }

    // 数据区域
    var dataPts = [];
    for (var i = 0; i < n; i++) {
      var angle = -Math.PI / 2 + (2 * Math.PI * i) / n;
      var valR = r * radarData[i].value / 100;
      var x = cx + valR * Math.cos(angle);
      var y = cy + valR * Math.sin(angle);
      dataPts.push(x.toFixed(1) + ',' + y.toFixed(1));
    }
    svg += '<polygon points="' + dataPts.join(' ') + '" fill="rgba(139,94,60,0.2)" stroke="#8B5E3C" stroke-width="2"/>';

    // 数据点
    for (var i = 0; i < n; i++) {
      var angle = -Math.PI / 2 + (2 * Math.PI * i) / n;
      var valR = r * radarData[i].value / 100;
      var x = cx + valR * Math.cos(angle);
      var y = cy + valR * Math.sin(angle);
      svg += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="4" fill="#8B5E3C" stroke="#fff" stroke-width="1.5"/>';
    }

    // 标签
    for (var i = 0; i < n; i++) {
      var angle = -Math.PI / 2 + (2 * Math.PI * i) / n;
      var labelR = r + 20;
      var lx = cx + labelR * Math.cos(angle);
      var ly = cy + labelR * Math.sin(angle);
      var anchor = 'middle';
      if (lx < cx - 20) anchor = 'end';
      if (lx > cx + 20) anchor = 'start';
      svg += '<text x="' + lx.toFixed(1) + '" y="' + (ly + 4).toFixed(1) + '" text-anchor="' + anchor + '" font-size="11" fill="#5D4037" font-weight="600">' + radarData[i].label + '</text>';
      svg += '<text x="' + lx.toFixed(1) + '" y="' + (ly + 18).toFixed(1) + '" text-anchor="' + anchor + '" font-size="10" fill="#8B7355">' + radarData[i].value + '</text>';
    }

    svg += '</svg>';
    return svg;
  },

  showLibrary: function() {
    if (this.libraryShown) return;
    this.libraryShown = true;
    var books = MockData.books;
    console.log('[孔先生对话] 浏览书房 | 推荐绘本:', books.length, '本 | 安全等级全部绿级');
    var childName = UserState.getChildAddress();
    var interest = UserState.getChildInterest();
    this.addMsg('为' + childName + '精选了书房中与您家庭价值观匹配的绘本，特别是他喜欢的' + interest + '主题：', 'left');
    var html = '<div class="book-reco">';
    books.forEach(function(b) {
      var coverSrc = b.coverImage || '';
      html += '<div class="book-reco-item" onclick="ChatPage.openBook(\'' + b.id + '\')">' +
        '<div class="cover">' + (coverSrc ? '<img src="' + coverSrc + '" style="width:100%;height:100%;object-fit:cover;border-radius:8px;" onerror="this.style.display=\'none\';this.parentElement.textContent=\'📖\';">' : '📖') + '</div><div class="name">' + b.title + '</div>' +
        '<div style="margin-top:2px;"><span class="tag tag-green">' + b.safetyLabel + '</span></div>' +
        '</div>';
    });
    html += '</div>';
    this.addMsg(html, 'left');
    this.addMsg('每本绘本都经过价值观审核，您可放心让' + childName + '阅读。', 'left');
  },

  showReport: function() {
    var reportEl = this.messagesEl.querySelector('.report-msg');
    if (reportEl) {
      reportEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      var bubble = reportEl.querySelector('.bubble');
      if (bubble) {
        bubble.style.transition = 'box-shadow 0.3s ease';
        bubble.style.boxShadow = '0 0 0 3px rgba(139,94,60,0.4)';
        setTimeout(function() { bubble.style.boxShadow = ''; }, 1200);
      }
    } else {
      this.showReportCard();
    }
  },

  sendQuick: function(text) {
    this.inputEl.value = text;
    this.send();
  },

  send: function() {
    var text = this.inputEl.value.trim();
    if (!text) return;
    console.log('[孔先生对话] 家长发送消息:', text);
    this.addMsg(text, 'right');
    this.inputEl.value = '';

    var self = this;
    setTimeout(function() {
      if (text.indexOf('推荐') !== -1) {
        self.showLibrary();
      } else if (text.indexOf('报告') !== -1 || text.indexOf('周报') !== -1) {
        self.showReportCard();
      } else if (text.indexOf('创作') !== -1 || text.indexOf('绘本') !== -1) {
        self.addMsg('好的，我来为' + UserState.getChildAddress() + '创作一本符合您要求的绘本。请点击下方的「创作绘本」按钮开始。', 'left');
      } else {
        self.addMsg('明白了，' + UserState.getParentAddress() + '。您可以点击底部的快捷按钮，或直接说"创作绘本"来开始。', 'left');
      }
    }, 600);
  },

  openCreate: function() {
	    console.log('[孔先生对话] → 跳转到创作绘本页');
	    navigateTo('parent_create.html', 'parent');
	  },

  openLibrary: function() {
	    console.log('[孔先生对话] → 打开书柜');
	    localStorage.setItem('sishu_library_from', 'parent');
	    navigateTo('library.html', 'parent');
	  },

  openBook: function(id) {
    console.log('[孔先生对话] → 打开宽屏绘本阅读器 | bookId:', id);
    openBookReader(id);
  },

  openReader: function() {
	    console.log('[孔先生对话] → 打开宽屏绘本阅读器');
	    openBookReader('book-001');
	  }
};

ChatPage.init();
</script>

</body>
</html>
