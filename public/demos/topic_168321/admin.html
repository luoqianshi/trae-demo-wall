<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QD Infinity · Admin</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="workspace-body">
    <div class="workspace-shell">
      <aside class="workspace-sidebar glass">
        <div>
          <div class="eyebrow">QD INFINITY</div>
          <h1 class="sidebar-title">简化后台管理</h1>
        </div>
        <nav class="sidebar-nav">
          <button class="nav-btn active" data-admin-page="users">用户列表</button>
          <button class="nav-btn" data-admin-page="tasks">全局任务</button>
          <button class="nav-btn" data-admin-page="logs">全站日志</button>
        </nav>
        <div class="sidebar-foot">
          <div id="adminUserSummary" class="muted"></div>
          <div class="stack-list">
            <a class="ghost-btn full-width admin-link-btn" href="/workspace">返回工作台</a>
            <button class="ghost-btn full-width" id="adminLogoutBtn">退出登录</button>
          </div>
        </div>
      </aside>

      <main class="workspace-main">
        <header class="workspace-topbar glass">
          <div>
            <div class="muted">后台概览</div>
            <div id="adminOverviewText">读取全站用户、任务与日志数据</div>
          </div>
          <div class="topbar-actions">
            <button class="ghost-btn" id="refreshAdminBtn">刷新当前页</button>
          </div>
        </header>

        <section class="page active" id="admin-dashboard-strip">
          <div class="stats-grid" id="adminSummaryStats"></div>
        </section>

        <section class="page active" id="admin-page-users">
          <article class="glass panel">
            <div class="section-head">
              <h2>用户列表</h2>
              <div id="adminUsersSummary" class="muted"></div>
            </div>
            <div id="adminUsersList" class="stack-list"></div>
          </article>
        </section>

        <section class="page" id="admin-page-tasks">
          <article class="glass panel">
            <div class="section-head">
              <h2>全局任务</h2>
              <div id="adminTasksSummary" class="muted"></div>
            </div>
            <div class="inline-form">
              <label>状态过滤
                <input id="adminTaskStatus" placeholder="例如 queued / running / succeeded" />
              </label>
              <label>搜索
                <input id="adminTaskSearch" placeholder="任务ID / 项目ID / 用户名" />
              </label>
            </div>
            <div id="adminTasksList" class="stack-list"></div>
          </article>
        </section>

        <section class="page" id="admin-page-logs">
          <article class="glass panel">
            <div class="section-head">
              <h2>全站日志检索</h2>
              <div id="adminLogsSummary" class="muted"></div>
            </div>
            <div class="inline-form">
              <label>日期
                <input id="adminLogDate" type="date" />
              </label>
              <label>用户
                <select id="adminLogUser">
                  <option value="">全部用户</option>
                </select>
              </label>
              <label>事件
                <input id="adminLogEvent" placeholder="例如 settings.test / video.task" />
              </label>
              <label class="checkbox"><input type="checkbox" id="adminLogFailed" /> 仅失败事件</label>
            </div>
            <div id="adminLogsList" class="stack-list"></div>
          </article>
        </section>
      </main>
    </div>

    <div id="toastStack" class="toast-stack" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="/admin.js"></script>
  </body>
</html>
