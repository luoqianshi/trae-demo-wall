<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>掌勺 AI - 你的家常菜教练</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- ========== 首页：菜品选择 ========== -->
    <section id="page-home" class="page page-home active">
        <div class="home-container">
            <div class="home-header">
            <div class="logo">
                <span class="logo-icon">🍳</span>
                <span class="logo-text">掌勺 AI</span>
            </div>
            <p class="home-subtitle">你的专属家常菜教练</p>
            <p class="home-tagline">手把手教你做出美味家常菜</p>
        </div>

        <div class="dish-selection">
            <p class="section-hint">👇 选一道菜，开始你的做菜体验</p>
            
            <div class="dish-cards">
                <div class="dish-card" data-dish="garlic-shrimp">
                    <div class="dish-card-image">
                        <span class="dish-emoji">🦐</span>
                    </div>
                    <div class="dish-card-info">
                        <h3 class="dish-card-title">蒜蓉粉丝蒸虾</h3>
                        <div class="dish-card-meta">
                            <span class="meta-item">
                                <span class="meta-icon">⏱️</span>
                                <span>30分钟</span>
                            </span>
                            <span class="meta-item">
                                <span class="meta-icon">⭐</span>
                                <span>难度 ⭐⭐</span>
                            </span>
                        </div>
                        <div class="dish-card-tags">
                            <span class="dish-tag">宴客推荐</span>
                            <span class="dish-tag">高颜值</span>
                        </div>
                    </div>
                </div>

                <div class="dish-card" data-dish="tomato-egg">
                    <div class="dish-card-image">
                        <span class="dish-emoji">🍳</span>
                    </div>
                    <div class="dish-card-info">
                        <h3 class="dish-card-title">番茄炒蛋</h3>
                        <div class="dish-card-meta">
                            <span class="meta-item">
                                <span class="meta-icon">⏱️</span>
                                <span>10分钟</span>
                            </span>
                            <span class="meta-item">
                                <span class="meta-icon">⭐</span>
                                <span>难度 ⭐</span>
                            </span>
                        </div>
                        <div class="dish-card-tags">
                            <span class="dish-tag">新手必学</span>
                            <span class="dish-tag">快手菜</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="home-footer">
            <p class="footer-text">🔥 今日热门：蒜蓉粉丝蒸虾</p>
        </div>
    </section>

    <!-- ========== 做菜页：分步引导 ========== -->
    <section id="page-cooking" class="page page-cooking">
        <!-- 顶部导航 -->
        <header class="cooking-header">
            <button class="btn-back" onclick="goHome()">
                <span>←</span>
                <span>返回</span>
            </button>
            <div class="cooking-title" id="cooking-dish-name">蒜蓉粉丝蒸虾</div>
            <div class="cooking-progress" id="cooking-step-info">
                <span id="current-step">1</span>
                <span>/</span>
                <span id="total-steps">6</span>
            </div>
        </header>

        <!-- 安全提示条 -->
        <div class="safety-banner" id="safety-banner">
            <span class="safety-icon">⚠️</span>
            <span class="safety-text" id="safety-text">食品安全提示</span>
        </div>

        <!-- 步骤内容区 -->
        <main class="cooking-main">
            <div class="step-container" id="step-container">
                <!-- 步骤内容由 JS 动态渲染 -->
            </div>
        </main>

        <!-- 底部操作区 -->
        <footer class="cooking-footer">
            <div class="step-indicator" id="step-indicator">
                <!-- 步骤指示点由 JS 动态渲染 -->
            </div>
            <div class="cooking-actions">
                <button class="btn-action btn-help" onclick="showRemedy()">
                    <span>🔧</span>
                    <span>遇到问题？</span>
                </button>
                <button class="btn-action btn-next" onclick="nextStep()">
                    <span>完成了，下一步</span>
                    <span>→</span>
                </button>
            </div>
        </footer>
    </section>

    <!-- ========== 完成页：成就展示 ========== -->
    <section id="page-complete" class="page page-complete">
        <div class="complete-container">
            <div class="complete-celebration">
                <div class="celebration-emoji">🎉</div>
                <h2 class="complete-title">恭喜你完成啦！</h2>
                <p class="complete-dish" id="complete-dish-name">蒜蓉粉丝蒸虾</p>
            </div>

            <!-- 高质量成品图 -->
            <div class="complete-image-section">
                <img id="complete-image" src="" alt="成品图" class="complete-image" style="display: none;">
                <div class="complete-image-badge">
                    <span>🍽️ AI生成</span>
                </div>
            </div>
            <div class="complete-purpose" id="complete-purpose">
                <!-- 由 JS 动态渲染purpose -->
            </div>

            <div class="complete-card">
                <h3 class="complete-section-title">🍽️ 成品特征</h3>
                <ul class="complete-features" id="complete-features">
                    <!-- 由 JS 动态渲染 -->
                </ul>
            </div>

            <div class="complete-card">
                <h3 class="complete-section-title">💡 摆盘建议</h3>
                <p class="complete-plating" id="complete-plating">
                    <!-- 由 JS 动态渲染 -->
                </p>
            </div>

            <div class="complete-card safety-card">
                <h3 class="complete-section-title">⚠️ 食用提醒</h3>
                <ul class="complete-tips" id="complete-tips">
                    <!-- 由 JS 动态渲染 -->
                </ul>
            </div>

            <div class="complete-actions">
                <button class="btn-complete-action" onclick="goHome()">
                    <span>🏠</span>
                    <span>再做一道</span>
                </button>
                <button class="btn-complete-action" onclick="goHome()">
                    <span>🔄</span>
                    <span>换道菜</span>
                </button>
            </div>

            <div class="complete-footer">
                <p>🎊 恭喜你，又学会了一道菜！</p>
            </div>
        </div>
    </section>

    <!-- ========== 补救弹窗 ========== -->
    <div id="remedy-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">🔧 遇到问题了？</h3>
                <button class="modal-close" onclick="closeRemedy()">×</button>
            </div>
            <div class="modal-body" id="remedy-content">
                <!-- 由 JS 动态渲染 -->
            </div>
        </div>
    </div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
