<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediaFlow Agent - AI 智能媒体处理助手（演示版）</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f9fafb;
      --bg-card: #f3f4f6;
      --bg-card-hover: #e5e7eb;
      --border-color: #e5e7eb;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-light: #eff6ff;
      --text-primary: #111827;
      --text-secondary: #4b5563;
      --text-muted: #9ca3af;
      --success: #16a34a;
      --error: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg-secondary);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
    }

    .main-container {
      position: relative;
      display: flex;
      height: 100vh;
      width: 100%;
    }

    /* === Sidebar === */
    .sidebar {
      width: 280px;
      min-width: 0;
      flex-shrink: 0;
      background: var(--bg-primary);
      border-right: 1px solid var(--border-color);
      display: flex;
      overflow: hidden;
      transition: width 0.3s ease, opacity 0.3s ease, transform 0.3s ease;
      z-index: 50;
    }

    .main-container.sidebar-collapsed .sidebar {
      width: 0;
      opacity: 0;
    }

    .sidebar-inner {
      width: 280px;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 1rem;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .logo-wrapper {
      width: 40px;
      height: 40px;
      background: #2563eb;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-wrapper i {
      font-size: 20px;
      color: white;
    }

    .sidebar-header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .sidebar-header p {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .conversation-section {
      margin-bottom: 1rem;
      flex-shrink: 0;
    }

    .new-chat-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.6rem 0.75rem;
      background: #fff;
      border: 1px dashed var(--border-color);
      border-radius: 8px;
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .new-chat-btn:hover {
      background: #f3f4f6;
      border-color: #2563eb;
      color: #2563eb;
    }

    .conversation-list {
      margin-top: 0.5rem;
      max-height: 160px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .conversation-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.6rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text-secondary);
      transition: background-color 0.15s ease, border-color 0.15s ease;
      white-space: nowrap;
      overflow: hidden;
    }

    .conversation-item:hover {
      background: var(--bg-card-hover);
    }

    .conversation-item.active {
      background: #f3f4f6;
      color: #2563eb;
    }

    .conversation-item .conversation-icon {
      font-size: 0.75rem;
      flex-shrink: 0;
    }

    .conversation-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .conversation-delete {
      width: 20px;
      height: 20px;
      background: transparent;
      border: none;
      border-radius: 4px;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.15s ease, background-color 0.15s ease, color 0.15s ease;
      flex-shrink: 0;
    }

    .conversation-item:hover .conversation-delete {
      opacity: 1;
    }

    .conversation-delete:hover {
      background: #fee2e2;
      color: #dc2626;
    }

    .section-title {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .sidebar-body {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      min-height: 180px;
    }

    .files-list {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    .file-item {
      background: var(--bg-card);
      border-radius: 8px;
      padding: 0.75rem;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      transition: background-color 0.15s ease, border-color 0.15s ease;
      border: 1px solid transparent;
      cursor: pointer;
    }

    .file-item:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-color);
    }

    .file-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .file-icon.video { background: #f3f4f6; color: #2563eb; }
    .file-icon.pdf { background: #f3f4f6; color: var(--text-secondary); }
    .file-icon.word { background: #f3f4f6; color: #2563eb; }
    .file-icon.ppt { background: #f3f4f6; color: #eab308; }

    .file-info { flex: 1; min-width: 0; }
    .file-name {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .file-size {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .file-actions {
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .file-item:hover .file-actions {
      opacity: 1;
    }

    .file-btn {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .file-ref {
      background: #dbeafe;
      color: #2563eb;
    }

    .file-ref:hover {
      background: #bfdbfe;
    }

    .file-remove {
      background: #fee2e2;
      color: #dc2626;
    }

    .file-remove:hover {
      background: #fecaca;
    }

    .file-item.selected {
      background: #f3f4f6;
      border-color: #bfdbfe;
    }

    /* === Quick Chips === */
    .quick-chips {
      display: flex;
      gap: 0.5rem;
      padding: 0.5rem 0.25rem 0;
      overflow-x: auto;
      flex-shrink: 0;
      scrollbar-width: none;
    }

    .quick-chips::-webkit-scrollbar {
      display: none;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.65rem;
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-secondary);
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .chip:hover {
      background: var(--bg-card);
      border-color: var(--accent);
      color: var(--accent);
    }

    .chip i {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* === Chat Area === */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--bg-secondary);
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 1rem 1.5rem;
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .chat-title {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex: 1;
      min-width: 0;
    }

    .sidebar-toggle {
      width: 36px;
      height: 36px;
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease, border-color 0.15s ease;
      flex-shrink: 0;
    }

    .sidebar-toggle:hover {
      border-color: #2563eb;
      color: #2563eb;
    }

    .chat-title i {
      font-size: 18px;
      color: #2563eb;
    }

    .chat-title h2 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #16a34a;
    }

    .chat-actions {
      display: flex;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .settings-btn {
      width: 36px;
      height: 36px;
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .settings-btn:hover {
      background: #f8fafc;
      border-color: var(--accent);
      color: var(--accent);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      min-height: 0;
    }

    .message {
      display: flex;
      gap: 0.875rem;
      animation: messageFadeIn 0.3s ease;
    }

    @keyframes messageFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .message.user { justify-content: flex-end; }
    .message.user .bubble {
      background: #2563eb;
      color: white;
    }
    .message.agent { justify-content: flex-start; }
    .message.agent .bubble {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 600;
    }

    .avatar.user { background: #2563eb; color: white; }
    .avatar.agent { background: #2563eb; color: white; }

    .bubble {
      max-width: 70%;
      padding: 0.875rem 1.125rem;
      border-radius: 10px;
      font-size: 0.9rem;
      line-height: 1.7;
      position: relative;
      word-break: break-word;
    }

    .message.user .bubble { border-bottom-right-radius: 4px; }
    .message.agent .bubble { border-bottom-left-radius: 4px; }

    .task-content { max-width: 70%; }

    .tool-execution {
      background: var(--bg-primary);
      border-radius: 8px;
      padding: 1rem;
      border: 1px solid var(--border-color);
    }

    .tool-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: #2563eb;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.875rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .tool-title i { font-size: 12px; }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: var(--bg-card);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 0.875rem;
    }

    .progress-fill {
      height: 100%;
      background: #2563eb;
      border-radius: 2px;
      transition: width 0.5s ease;
    }

    .tool-steps {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .tool-step {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.8rem;
    }

    .tool-step .step-icon {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      flex-shrink: 0;
    }

    .tool-step.pending .step-icon { background: var(--bg-card-hover); color: var(--text-muted); }
    .tool-step.running .step-icon {
      background: #f3f4f6;
      color: #2563eb;
      animation: stepPulse 1.5s ease-in-out infinite;
    }
    .tool-step.completed .step-icon { background: #ecfdf5; color: #16a34a; }

    @keyframes stepPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .tool-step .step-name { color: var(--text-primary); flex: 1; }
    .tool-step .step-status { font-size: 0.7rem; color: var(--text-muted); }

    .result-card {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 14px;
      padding: 1rem;
    }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.875rem;
    }

    .result-title {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: #16a34a;
    }

    .result-download {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.875rem;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .result-download:hover { background: var(--accent-hover); }

    .result-files {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.6rem;
    }

    .result-file {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.7rem;
      background: #fff;
      border-radius: 6px;
      font-size: 0.75rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
      border: 1px solid var(--border-color);
    }

    .result-file:hover {
      background: #f3f4f6;
      border-color: #2563eb;
      color: #2563eb;
    }

    .result-file i { font-size: 13px; color: #2563eb; }

    .result-info {
      display: flex;
      gap: 1.5rem;
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .input-area {
      background: var(--bg-primary);
      border-top: 1px solid var(--border-color);
      padding: 1rem 1.5rem;
      flex-shrink: 0;
    }

    .input-area.dragover .input-box {
      border-color: var(--accent);
      background: var(--accent-light);
    }

    .input-box {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 0.75rem;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      padding: 0.25rem 0.5rem;
    }

    .input-field {
      width: 100%;
      background: transparent;
      border: none;
      padding: 0.5rem 0;
      color: var(--text-primary);
      font-size: 0.95rem;
      outline: none;
      font-family: inherit;
    }

    .input-field::placeholder {
      color: var(--text-muted);
      font-weight: 400;
    }

    .input-toolbar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.25rem;
      padding: 0 0.25rem;
    }

    .upload-btn {
      width: 32px;
      height: 32px;
      background: transparent;
      border: none;
      border-radius: 8px;
      color: var(--text-secondary);
      font-size: 18px;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .upload-btn:hover { background: var(--bg-card); color: var(--accent); }

    .input-toolbar .quick-chips {
      flex: 1;
      padding: 0;
      min-width: 0;
    }

    .mic-btn {
      width: 32px;
      height: 32px;
      background: transparent;
      border: none;
      border-radius: 8px;
      color: var(--text-secondary);
      font-size: 18px;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .mic-btn:hover:not(:disabled) { background: var(--bg-card); color: var(--accent); }

    .mic-btn.recording {
      background: #dc2626;
      color: white;
      animation: micPulse 1.2s ease-in-out infinite;
    }

    @keyframes micPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.75; }
    }

    .send-btn {
      width: 32px;
      height: 32px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease;
      flex-shrink: 0;
    }

    .send-btn:hover:not(:disabled) { background: var(--accent-hover); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .loading {
      display: flex;
      gap: 5px;
      padding: 0.5rem 0;
    }

    .loading-dot {
      width: 7px;
      height: 7px;
      background: #2563eb;
      border-radius: 50%;
      animation: loadingBounce 0.6s infinite alternate;
    }

    .loading-dot:nth-child(2) { animation-delay: 0.2s; }
    .loading-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes loadingBounce {
      from { transform: translateY(0); }
      to { transform: translateY(-6px); }
    }

    .empty-state {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--text-muted);
    }

    .empty-state i {
      font-size: 36px;
      margin-bottom: 0.75rem;
      opacity: 0.5;
    }

    .empty-state p { font-size: 0.8rem; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active { display: flex; opacity: 1; }

    .modal {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      width: 90%;
      max-width: 700px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 0.3s ease;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
    }

    .modal-title {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .modal-title i { color: #2563eb; }

    .modal-close {
      width: 34px;
      height: 34px;
      background: var(--bg-card);
      border: none;
      border-radius: 8px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .modal-close:hover { background: #fee2e2; color: #dc2626; }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
      padding: 1.5rem;
    }

    .modal-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
      border-bottom: 1px solid var(--border-color);
    }

    .modal-tab {
      padding: 0.65rem 1rem;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      font-size: 0.85rem;

  <div class="demo-badge">演示版 · 前端模拟处理流程</div>

  <script>
    // ==================== 演示版 Mock 后端 ====================
    const IS_DEMO = true;
    const DEMO_CONFIG_KEY = 'mediaflow_demo_config';
    const DEMO_KB_KEY = 'mediaflow_demo_kb';

    const mockBackend = {
      tasks: {},

      async upload(fileList) {
        const result = [];
        Array.from(fileList).forEach(file => {
          result.push({
            id: generateId(),
            name: file.name,
            size: file.size,
            type: file.type,
            file: file,
            uploadedAt: Date.now()
          });
        });
        await delay(300);
        return { files: result };
      },

      async analyze(command, targetFiles) {
        await delay(600);
        const cmd = command.toLowerCase();

        let intent = '通用媒体处理';
        let plan = [];

        if (cmd.includes('黑边') || cmd.includes('裁剪') || cmd.includes('crop')) {
          intent = '视频黑边检测与裁剪';
          plan = [
            { name: '分析视频画面，检测黑边区域', tool: 'ffmpeg' },
            { name: '调用 ffmpeg 自动裁剪黑边', tool: 'ffmpeg' }
          ];
        } else if (cmd.includes('清晰') || cmd.includes('增强') || cmd.includes('超分') || cmd.includes('超分辨率')) {
          intent = '视频画质增强（PPT/文字区域超分）';
          plan = [
            { name: '识别视频中的文字/PPT 区域', tool: 'super_resolution' },
            { name: '对目标区域进行超分辨率增强', tool: 'super_resolution' }
          ];
        } else if (cmd.includes('压缩')) {
          intent = '视频压缩';
          plan = [
            { name: '分析视频码率与分辨率', tool: 'ffmpeg' },
            { name: '重新编码并压缩体积', tool: 'compressor' }
          ];
        } else if (cmd.includes('格式') || cmd.includes('统一') || cmd.includes('1920') || cmd.includes('1080') || cmd.includes('mp4')) {
          intent = '视频格式标准化';
          plan = [
            { name: '读取视频当前参数', tool: 'ffmpeg' },
            { name: '统一转换为 1920x1080 MP4', tool: 'ffmpeg' }
          ];
        } else if (cmd.includes('水印')) {
          intent = '视频添加水印';
          plan = [
            { name: '生成文字水印图层', tool: 'watermark' },
            { name: '将水印叠加到视频', tool: 'ffmpeg' }
          ];
        } else if (cmd.includes('灰度') || cmd.includes('滤镜') || cmd.includes('黑白')) {
          intent = '视频滤镜处理';
          plan = [
            { name: '应用灰度滤镜', tool: 'ffmpeg' }
          ];
        } else if (cmd.includes('摘要') || cmd.includes('总结') || cmd.includes('内容')) {
          intent = '视频内容摘要';
          plan = [
            { name: '抽取关键帧', tool: 'ffmpeg' },
            { name: '分析画面与语音内容', tool: 'super_resolution' }
          ];
        } else if (cmd.includes('pdf') || cmd.includes('word') || cmd.includes('docx') || cmd.includes('转换')) {
          intent = '文档格式转换（PDF ↔ Word）';
          plan = [
            { name: '解析源文档结构', tool: 'document_engine' },
            { name: '生成目标格式文档', tool: 'document_engine' }
          ];
        } else if (cmd.includes('提取') || cmd.includes('文字') || cmd.includes('markdown')) {
          intent = '文档内容提取';
          plan = [
            { name: '提取文档文本内容', tool: 'document_engine' },
            { name: '整理为 Markdown 格式', tool: 'document_engine' }
          ];
        } else {
          plan = [
            { name: '分析用户意图', tool: 'ffmpeg' },
            { name: '执行媒体处理', tool: 'ffmpeg' }
          ];
        }

        return { intent, plan, referenced_files: targetFiles };
      },

      async execute(command, targetFiles) {
        const taskId = generateId();
        const analysis = await this.analyze(command, targetFiles);
        this.tasks[taskId] = {
          status: 'processing',
          progress: 0,
          steps: analysis.plan.map(step => ({ name: step.name, status: 'pending', tool: step.tool })),
          result: null,
          summary: null,
          command: command,
          targetFiles: targetFiles
        };
        return { task_id: taskId };
      },

      getTask(taskId) {
        return this.tasks[taskId] || { status: 'failed', error: '任务不存在' };
      },

      advanceTask(taskId) {
        const task = this.tasks[taskId];
        if (!task || task.status !== 'processing') return;

        const pendingIndex = task.steps.findIndex(s => s.status === 'pending');
        const runningIndex = task.steps.findIndex(s => s.status === 'running');

        if (runningIndex !== -1) {
          task.steps[runningIndex].status = 'completed';
          task.progress = Math.round(((runningIndex + 1) / task.steps.length) * 100);
        }

        if (pendingIndex !== -1) {
          task.steps[pendingIndex].status = 'running';
        } else if (runningIndex === -1 || runningIndex === task.steps.length - 1) {
          task.status = 'completed';
          task.progress = 100;
          task.result = this.generateResult(task);
        }
      },

      generateResult(task) {
        const cmd = task.command.toLowerCase();
        const files = task.targetFiles;
        if (!files || files.length === 0) return { files: [] };

        const source = files[0];
        const name = source.name;
        const base = name.substring(0, name.lastIndexOf('.')) || name;
        const ext = (name.substring(name.lastIndexOf('.') + 1) || '').toLowerCase();

        const resultFiles = [];

        if (cmd.includes('摘要') || cmd.includes('总结') || cmd.includes('内容')) {
          task.summary = `视频内容摘要（演示版）：\n\n` +
            `• 视频时长：约 ${(Math.random() * 5 + 1).toFixed(1)} 分钟\n` +
            `• 主要内容：教学/演示类视频，包含 PPT 讲解与操作演示\n` +
            `• 关键画面：片头标题、PPT 内容页、操作演示、结尾总结\n` +
            `• 语音转写：「大家好，今天我们来学习如何……」\n\n` +
            `注：完整版将基于后端 ffmpeg + AI 模型生成真实摘要。`;
          return { files: [] };
        }

        if (cmd.includes('pdf') || cmd.includes('word') || cmd.includes('docx') || cmd.includes('转换') || cmd.includes('提取') || cmd.includes('markdown')) {
          const isPdf = ext === 'pdf';
          const outName = isPdf ? `${base}_converted.docx` : `${base}.pdf`;
          const mime = isPdf ? 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' : 'application/pdf';
          resultFiles.push({ name: outName, mime: mime, kind: 'document', note: '演示版：实际转换需后端文档处理引擎' });
        } else {
          // 视频处理：返回原视频文件，重命名以演示输出
          let suffix = '_processed';
          if (cmd.includes('黑边') || cmd.includes('裁剪')) suffix = '_cropped';
          else if (cmd.includes('压缩')) suffix = '_compressed';
          else if (cmd.includes('格式') || cmd.includes('统一') || cmd.includes('1920')) suffix = '_1920x1080';
          else if (cmd.includes('清晰') || cmd.includes('增强') || cmd.includes('超分')) suffix = '_enhanced';
          else if (cmd.includes('水印')) suffix = '_watermarked';
          else if (cmd.includes('灰度') || cmd.includes('滤镜') || cmd.includes('黑白')) suffix = '_grayscale';

          const outName = `${base}${suffix}.mp4`;
          resultFiles.push({ name: outName, mime: source.type || 'video/mp4', kind: 'video', sourceId: source.id });
        }

        return { files: resultFiles };
      },

      download(fileName, fileMeta) {
        let blob;
        if (fileMeta.kind === 'video') {
          const source = files.find(f => f.id === fileMeta.sourceId);
          if (source && source.file) {
            blob = source.file;
          } else {
            blob = new Blob(['演示版：未找到源视频文件'], { type: 'text/plain' });
            fileName = fileName.replace(/\.mp4$/, '.txt') || 'download.txt';
          }
        } else {
          const note = fileMeta.note || '演示版：此文件由前端模拟生成，完整版需配合后端服务运行。';
          blob = new Blob([note], { type: 'text/plain' });
          fileName = fileName.replace(/\.(docx|pdf)$/, '.txt') || 'download.txt';
        }
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      },

      loadConfig() {
        const raw = localStorage.getItem(DEMO_CONFIG_KEY);
        const defaults = {
          AI_SERVICE_TYPE: 'local',
          API_BASE: '',
          API_KEY: '',
          MODEL: '',
          MAX_TOKENS: 4096,
          TEMPERATURE: 0.7
        };
        return raw ? { ...defaults, ...JSON.parse(raw) } : defaults;
      },

      saveConfig(config) {
        localStorage.setItem(DEMO_CONFIG_KEY, JSON.stringify(config));
        return { success: true };
      },

      loadKB() {
        const raw = localStorage.getItem(DEMO_KB_KEY);
        return raw ? JSON.parse(raw) : { files: [], synced: false, count: 0, sources: 0 };
      },

      saveKB(kb) {
        localStorage.setItem(DEMO_KB_KEY, JSON.stringify(kb));
      },

      async syncFFmpegDocs() {
        await delay(1500);
        const kb = this.loadKB();
        kb.synced = true;
        kb.count = 1248;
        kb.sources = 3;
        this.saveKB(kb);
        return { success: true, message: '已同步 3 个 FFmpeg 官方文档源，共 1248 个片段' };
      },

      async uploadKB(file) {
        await delay(400);
        const kb = this.loadKB();
        kb.files.push({
          id: generateId(),
          name: file.name,
          size: file.size,
          uploadedAt: Date.now()
        });
        this.saveKB(kb);
        return { success: true };
      },

      async deleteKB(fileId) {
        await delay(200);
        const kb = this.loadKB();
        kb.files = kb.files.filter(f => f.id !== fileId);
        this.saveKB(kb);
        return { success: true };
      }
    };

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';

    }

    /* === Conversations === */
    function getDefaultGreeting() {
      return {
        role: 'agent',
        content:
          '你好！我是 MediaFlow Agent，你的智能媒体处理助手。<br><br>' +
          '<i class="fa-solid fa-upload"></i> 上传文件 — 支持视频、PDF、Word、PPT<br>' +

    function createNewConversation() {
      const greeting = getDefaultGreeting();
      const conv = {
        id: generateId(),
        title: '新对话',
        messages: [greeting],
        createdAt: Date.now(),
        updatedAt: Date.now()
      };
      conversations.unshift(conv);
      currentConversationId = conv.id;
      messages = [...conv.messages];
      selectedFiles = [];
      saveConversations();
      renderConversations();
      renderMessages();
      renderFiles();
      scrollToBottom();
      inputField.focus();
    }

    function setActiveConversation(id) {
      if (currentConversationId === id) return;
      currentConversationId = id;
      const conv = conversations.find(c => c.id === id);
      if (conv) { messages = [...conv.messages]; }
      selectedFiles = [];
      renderConversations();
      renderMessages();
      renderFiles();
      scrollToBottom();
    }

    function deleteConversation(id) {
      if (!confirm('确定要删除这个对话吗？')) return;
      conversations = conversations.filter(c => c.id !== id);
      if (currentConversationId === id) {
        currentConversationId = null;
        messages = [];
        if (conversations.length > 0) {
          const latest = conversations.reduce((a, b) => new Date(b.updatedAt || 0) > new Date(a.updatedAt || 0) ? b : a);
          setActiveConversation(latest.id);
        } else {
          createNewConversation();
        }
      }
      saveConversations();
      renderConversations();
      renderMessages();
    }

    function updateConversationTitle() {
      const conv = conversations.find(c => c.id === currentConversationId);
      if (!conv || conv.title !== '新对话') return;
      const firstUser = messages.find(m => m.role === 'user');
      if (firstUser) { conv.title = truncate(firstUser.content, 20); }
    }

    function saveConversations() {
      const conv = conversations.find(c => c.id === currentConversationId);
      if (conv) {
        conv.messages = messages.map(m => ({ role: m.role, content: m.content, id: m.id }));
        conv.updatedAt = Date.now();
      }
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations)); } catch (e) { console.error('Save conversations failed:', e); }
      renderConversations();
    }

    function loadConversations() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try { conversations = JSON.parse(saved); } catch (e) { console.error('Load conversations failed:', e); conversations = []; }
      }
      if (!Array.isArray(conversations) || conversations.length === 0) {
        createNewConversation();
      } else {
        const latest = conversations.reduce((a, b) => new Date(b.updatedAt || 0) > new Date(a.updatedAt || 0) ? b : a);
        currentConversationId = latest.id;
        messages = [...(latest.messages || [])];
      }
    }

    function renderConversations() {
      const fragment = document.createDocumentFragment();
      const sorted = [...conversations].sort((a, b) => new Date(b.updatedAt || 0) - new Date(a.updatedAt || 0)).slice(0, MAX_DISPLAYED_CONVERSATIONS);

      if (sorted.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.innerHTML = '<p>暂无对话</p>';
        fragment.appendChild(empty);
      } else {
        sorted.forEach(conv => {
          const item = document.createElement('div');
          item.className = 'conversation-item' + (conv.id === currentConversationId ? ' active' : '');
          item.title = conv.title;
          item.innerHTML = `
            <i class="fa-regular fa-comments conversation-icon"></i>
            <span class="conversation-title">${escapeHtml(conv.title)}</span>
            <button class="conversation-delete" title="删除对话">
              <i class="fa-solid fa-xmark"></i>
            </button>
          `;
          item.addEventListener('click', () => setActiveConversation(conv.id));
          item.querySelector('.conversation-delete').addEventListener('click', (e) => { e.stopPropagation(); deleteConversation(conv.id); });
          fragment.appendChild(item);
        });
      }
      conversationList.innerHTML = '';
      conversationList.appendChild(fragment);
    }

    /* === Messages === */
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function createMessageElement(msg) {
      const message = document.createElement('div');
      message.className = `message ${msg.role}`;
      message.dataset.id = msg.id;

      const avatar = document.createElement('div');
      avatar.className = `avatar ${msg.role}`;
      avatar.innerHTML = msg.role === 'user' ? '<i class="fa-solid fa-user"></i>' : '<i class="fa-solid fa-robot"></i>';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      if (msg.role === 'user') { bubble.textContent = msg.content; } else { bubble.innerHTML = msg.content; }

      message.appendChild(avatar);
      message.appendChild(bubble);
      return message;
    }

    function renderMessages() {
      const fragment = document.createDocumentFragment();
      messages.forEach(msg => { fragment.appendChild(createMessageElement(msg)); });
      messagesContainer.innerHTML = '';
      messagesContainer.appendChild(fragment);
    }

    function appendMessageToDOM(msg) { messagesContainer.appendChild(createMessageElement(msg)); }

    function addMessage(role, content) {
      const msg = { role, content, id: generateId() };
      messages.push(msg);
      if (role === 'user') { updateConversationTitle(); }
      saveConversations();
      appendMessageToDOM(msg);
      scrollToBottom();

    function scrollToBottom() { messagesContainer.scrollTop = messagesContainer.scrollHeight; }

    /* === Files === */
    function getFileTypeMeta(name) {
      const ext = name.split('.').pop().toLowerCase();
      if (['mp4', 'mov', 'avi', 'mkv'].includes(ext)) return { type: 'video', icon: 'fa-film' };
      else if (ext === 'pdf') return { type: 'pdf', icon: 'fa-file-pdf' };
      else if (['doc', 'docx'].includes(ext)) return { type: 'word', icon: 'fa-file-word' };
      else if (['ppt', 'pptx'].includes(ext)) return { type: 'ppt', icon: 'fa-file-powerpoint' };
      return { type: 'other', icon: 'fa-file' };
    }

    function renderFiles() {
      filesList.innerHTML = '';
      if (files.length === 0) {
        filesList.innerHTML = `<div class="empty-state"><i class="fa-solid fa-folder-open"></i><p>暂无上传文件</p></div>`;
        return;
      }
      const fragment = document.createDocumentFragment();
      files.forEach(f => {
        const meta = getFileTypeMeta(f.name);
        const item = document.createElement('div');
        item.className = 'file-item' + (selectedFiles.includes(f.id) ? ' selected' : '');
        item.addEventListener('click', () => toggleFileSelection(f.id));
        item.innerHTML = `
          <div class="file-icon ${meta.type}"><i class="fa-solid ${meta.icon}"></i></div>
          <div class="file-info">
            <div class="file-name">${escapeHtml(f.name)}</div>
            <div class="file-size">${formatSize(f.size)}</div>
          </div>
          <div class="file-actions">
            <button class="file-btn file-ref" title="引用此文件"><i class="fa-solid fa-link"></i></button>
            <button class="file-btn file-remove" title="删除文件"><i class="fa-solid fa-xmark"></i></button>
          </div>
        `;
        item.querySelector('.file-ref').addEventListener('click', (e) => { e.stopPropagation(); referenceFile(f.id); });
        item.querySelector('.file-remove').addEventListener('click', (e) => { e.stopPropagation(); removeFile(f.id); });
        fragment.appendChild(item);
      });
      filesList.appendChild(fragment);
    }

    function handleFileSelect(e) { uploadFiles(e.target.files); }
    function handleDrop(droppedFiles) { uploadFiles(droppedFiles); }

    async function uploadFiles(fileList) {
      const newFiles = Array.from(fileList).filter(file => !files.find(f => f.name === file.name));
      if (newFiles.length === 0) return;

      if (IS_DEMO) {
        const result = await mockBackend.upload(newFiles);
        if (result.files) { files.push(...result.files); renderFiles(); }
      } else {
        const formData = new FormData();
        newFiles.forEach(file => formData.append('files', file));
        try {
          const response = await fetch(`${API_BASE}/upload`, { method: 'POST', body: formData });
          const result = await response.json();
          if (result.files) { files.push(...result.files); renderFiles(); }
        } catch (e) { console.error('Upload failed:', e); alert('上传失败，请检查后端服务是否启动'); }
      }
    }

    function removeFile(id) {
      files = files.filter(f => f.id !== id);
      selectedFiles = selectedFiles.filter(fid => fid !== id);
      renderFiles();
    }

    function toggleFileSelection(id) {
      const index = selectedFiles.indexOf(id);
      if (index === -1) { selectedFiles.push(id); } else { selectedFiles.splice(index, 1); }
      renderFiles();
    }

    function referenceFile(id) {
      const file = files.find(f => f.id === id);
      if (file) {
        const refText = `[${file.name}]`;
        inputField.value = inputField.value ? inputField.value + ' ' + refText : refText;
        inputField.focus();
      }
    }

    function insertCommand(cmd) { inputField.value = cmd; inputField.focus(); updateInputButtons(); }

    /* === Voice Input === */
    function toggleVoiceInput() {
      if (!SpeechRecognition) { alert('当前浏览器不支持语音识别，请使用 Chrome / Edge 等现代浏览器。'); return; }
      if (isRecording) { stopRecording(); } else { startRecording(); }
    }

    function startRecording() {
      recognition = new SpeechRecognition();
      recognition.lang = 'zh-CN';
      recognition.continuous = false;
      recognition.interimResults = true;
      const prefix = inputField.value ? inputField.value + ' ' : '';
      let finalTranscript = '';
      recognition.onresult = (event) => {
        let interimTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) { finalTranscript += transcript; } else { interimTranscript += transcript; }
        }
        inputField.value = prefix + finalTranscript + interimTranscript;
        updateInputButtons();
      };
      recognition.onerror = (event) => { console.error('Speech recognition error:', event.error); if (event.error !== 'aborted') alert('语音识别出错：' + event.error); stopRecording(); };
      recognition.onend = () => { stopRecording(); };
      isRecording = true;
      updateMicButton();
      recognition.start();
    }

    function stopRecording() {
      if (recognition) { try { recognition.stop(); } catch (e) {} recognition = null; }
      isRecording = false;
      updateMicButton();
    }

    function updateMicButton() {
      const icon = micBtn.querySelector('i');
      if (isRecording) { micBtn.classList.add('recording'); micBtn.title = '停止录音'; icon.className = 'fa-solid fa-stop'; }
      else { micBtn.classList.remove('recording'); micBtn.title = '语音输入'; icon.className = 'fa-solid fa-microphone'; }
    }

    /* === Chat === */
    async function sendMessage() {
      const text = inputField.value.trim();
      if (!text) return;
      if (files.length === 0) { alert('请先上传文件！'); return; }

      inputField.value = '';
      updateInputButtons();
      sendBtn.disabled = true;

      addMessage('user', text);

      const targetFiles = selectedFiles.length > 0 ? files.filter(f => selectedFiles.includes(f.id)) : files;
      await analyzeAndExecute(text, targetFiles);

      sendBtn.disabled = false;
      inputField.focus();

    async function analyzeAndExecute(command, targetFiles) {
      const { id: thinkingId } = appendAgentLoading('正在理解您的意图...');

      try {
        let analysis;
        if (IS_DEMO) {
          analysis = await mockBackend.analyze(command, targetFiles);
        } else {
          const analysisResponse = await fetch(`${API_BASE}/analyze`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ command, files: targetFiles })
          });
          analysis = await analysisResponse.json();
        }

        updateAgentMessage(thinkingId, `
          <p><strong><i class="fa-solid fa-brain"></i> 意图理解：</strong>${escapeHtml(analysis.intent)}</p>
          <p style="margin-top: 0.5rem;"><strong><i class="fa-solid fa-list-check"></i> 执行计划：</strong>${escapeHtml(analysis.plan.map(t => t.name).join(' → '))}</p>
          ${targetFiles.length > 0 ? `<p style="margin-top: 0.5rem;"><strong><i class="fa-solid fa-files"></i> 处理文件：</strong>${escapeHtml(targetFiles.map(f => f.name).join(', '))}</p>` : ''}
        `);

        await delay(800);

        let executeResult;
        if (IS_DEMO) {
          executeResult = await mockBackend.execute(command, targetFiles);
        } else {
          const response = await fetch(`${API_BASE}/execute`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ command, files: targetFiles })
          });
          executeResult = await response.json();
        }

        await pollTaskStatus(executeResult.task_id, analysis.plan);

      } catch (e) {
        console.error('Execution failed:', e);
        addMessage('agent', `处理失败：${e.message}`);
      }
    }

    function appendTaskCard(taskStatusId, plan) {

        'ffmpeg': 'fa-film',

    function appendResultCard(resultFiles) {
      const message = document.createElement('div');
      message.className = 'message agent';

      const avatar = document.createElement('div');
      avatar.className = 'avatar agent';
      avatar.innerHTML = '<i class="fa-solid fa-robot"></i>';

      const content = document.createElement('div');
      content.className = 'task-content';

      const filesHtml = resultFiles.map(file => {
        const ext = file.name.split('.').pop().toLowerCase();
        let icon = 'fa-file';
        if (['mp4', 'mov', 'avi'].includes(ext)) icon = 'fa-film';
        else if (ext === 'pdf') icon = 'fa-file-pdf';
        else if (['doc', 'docx'].includes(ext)) icon = 'fa-file-word';
        return `
          <div class="result-file" data-file="${escapeHtml(file.name)}" data-meta='${escapeHtml(JSON.stringify(file))}'>
            <i class="fa-solid ${icon}"></i>${escapeHtml(file.name)}
          </div>
        `;
      }).join('');

      content.innerHTML = `
        <div class="result-card">
          <div class="result-header">
            <span class="result-title"><i class="fa-solid fa-check-circle"></i>处理结果已生成</span>
          </div>
          <div class="result-files">${filesHtml}</div>

        </div>
      `;

      content.querySelectorAll('.result-file').forEach(el => {
        el.addEventListener('click', () => {
          const meta = JSON.parse(el.dataset.meta);
          mockBackend.download(el.dataset.file, meta);
        });
      });

      message.appendChild(avatar);
      message.appendChild(content);
      messagesContainer.appendChild(message);
      scrollToBottom();
    }

    async function pollTaskStatus(taskId, plan) {
      const taskStatusId = generateId();
      appendTaskCard(taskStatusId, plan);

      const interval = setInterval(async () => {
        try {
          let task;
          if (IS_DEMO) {
            mockBackend.advanceTask(taskId);
            task = mockBackend.getTask(taskId);
          } else {
            const response = await fetch(`${API_BASE}/task/${taskId}`);
            task = await response.json();
          }

          if (task.status === 'completed') {
            clearInterval(interval);
            const progressEl = document.getElementById(`progress-${taskStatusId}`);
            if (progressEl) progressEl.style.width = '100%';

            task.steps?.forEach((step, i) => {
              const stepEl = document.getElementById(`step-${taskStatusId}-${i}`);
              if (stepEl) { stepEl.className = 'tool-step completed'; stepEl.querySelector('.step-status').textContent = '已完成'; }
            });

            addMessage('agent', '处理完成！您的文件已按照要求完成处理。');

            if (task.summary) {
              addMessage('agent', `<div style="white-space: pre-wrap;">${escapeHtml(task.summary)}</div>`);
            }

            if (task.result && task.result.files) {
              appendResultCard(task.result.files);
            }
          } else if (task.status === 'failed') {
            clearInterval(interval);
            addMessage('agent', `处理失败：${task.error || '未知错误'}`);
          } else {
            if (task.progress !== undefined) {
              const progressEl = document.getElementById(`progress-${taskStatusId}`);
              if (progressEl) progressEl.style.width = `${task.progress}%`;
            }
            task.steps?.forEach((step, i) => {
              const stepEl = document.getElementById(`step-${taskStatusId}-${i}`);
              if (stepEl) {
                stepEl.className = `tool-step ${step.status}`;
                stepEl.querySelector('.step-status').textContent =
                  step.status === 'running' ? '运行中...' : step.status === 'completed' ? '已完成' : '等待中';
              }
            });
            scrollToBottom();
          }
        } catch (e) { console.error('Poll failed:', e); }
      }, 1000);
    }

    function downloadFile(fileName) { window.open(`${API_BASE}/download/${fileName}`, '_blank'); }

    /* === Settings === */
    async function toggleSettings() {
      settingsModal.classList.toggle('active');
      if (settingsModal.classList.contains('active')) {
        await loadConfig();
        await loadKnowledgeBase();
        await loadKBStats();
      }
    }

    function switchTab(tab) {
      document.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
      document.querySelector(`button[onclick="switchTab('${tab}')"]`).classList.add('active');
      document.getElementById(`tab-${tab}`).style.display = 'block';
      if (tab === 'knowledge') { loadKBStats(); }
      kbFileInput.value = '';
    }

    function selectAIService(service) {
      currentAIService = service;
      document.querySelectorAll('.ai-service-card').forEach(c => c.classList.remove('selected'));
      document.querySelector(`.ai-service-card[onclick="selectAIService('${service}')"]`).classList.add('selected');
      const configFields = document.getElementById('ai-config-fields');
      configFields.style.display = service === 'local' ? 'none' : 'block';
    }

    async function loadConfig() {
      try {
        let config;
        if (IS_DEMO) { config = mockBackend.loadConfig(); }
        else {
          const response = await fetch(`${API_BASE}/config`);
          config = await response.json();
        }
        currentAIService = config.AI_SERVICE_TYPE || 'local';
        selectAIService(currentAIService);
        document.getElementById('apiKey').value = config.API_KEY || '';
        document.getElementById('modelName').value = config.MODEL || '';
        document.getElementById('apiBase').value = config.API_BASE || '';
        document.getElementById('maxTokens').value = config.MAX_TOKENS || 4096;
        document.getElementById('temperature').value = config.TEMPERATURE || 0.7;
      } catch (e) { console.error('Load config failed:', e); }
    }

    async function saveConfig() {
      const configData = { AI_SERVICE_TYPE: currentAIService };
      if (currentAIService === 'remote') {
        configData.API_KEY = document.getElementById('apiKey').value;
        configData.MODEL = document.getElementById('modelName').value;
        configData.API_BASE = document.getElementById('apiBase').value;
      }
      configData.MAX_TOKENS = parseInt(document.getElementById('maxTokens').value) || 4096;
      configData.TEMPERATURE = parseFloat(document.getElementById('temperature').value) || 0.7;

      try {
        let result;
        if (IS_DEMO) { result = mockBackend.saveConfig(configData); }
        else {
          const response = await fetch(`${API_BASE}/config`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(configData)
          });
          result = await response.json();
        }
        if (result.success) {
          saveStatus.innerHTML = '<i class="fa-solid fa-check"></i> 配置已保存';
          setTimeout(() => { saveStatus.innerHTML = ''; }, 3000);
        }
      } catch (e) {
        console.error('Save config failed:', e);
        saveStatus.innerHTML = '<i class="fa-solid fa-xmark"></i> 保存失败';
        setTimeout(() => { saveStatus.innerHTML = ''; }, 3000);
      }
    }

    async function loadKBStats() {
      try {
        let stats;
        if (IS_DEMO) {
          const kb = mockBackend.loadKB();
          stats = { total_chunks: kb.count || 0, sources: kb.sources || 0 };
        } else {
          const response = await fetch(`${API_BASE}/knowledge-base/stats`);
          stats = await response.json();
        }
        const count = stats.total_chunks || 0;
        const sources = (stats.sources || []).length || stats.sources || 0;
        kbSyncStatus.innerHTML = `已索引 ${count} 个 FFmpeg 文档片段（${sources} 个来源）`;
      } catch (e) {
        console.error('Load KB stats failed:', e);
        kbSyncStatus.innerHTML = '统计信息加载失败';
      }
    }

    async function syncFFmpegDocs() {
      kbSyncBtn.disabled = true;
      kbSyncStatus.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 正在同步 FFmpeg 文档...';
      try {
        let result;
        if (IS_DEMO) { result = await mockBackend.syncFFmpegDocs(); }
        else {
          const response = await fetch(`${API_BASE}/knowledge-base/sync-ffmpeg-docs`, { method: 'POST' });
          result = await response.json();
        }
        if (result.success) {
          kbSyncStatus.innerHTML = '<i class="fa-solid fa-check"></i> ' + result.message;
          pollKBStats();
        } else {
          kbSyncStatus.innerHTML = '<i class="fa-solid fa-xmark"></i> 同步失败';
        }
      } catch (e) {
        console.error('Sync FFmpeg docs failed:', e);
        kbSyncStatus.innerHTML = '<i class="fa-solid fa-xmark"></i> 同步请求失败';
      } finally {
        kbSyncBtn.disabled = false;
      }
    }

    function pollKBStats(retry = 6) {
      if (retry <= 0) return;
      setTimeout(async () => {
        await loadKBStats();
        const count = parseInt(kbSyncStatus.textContent.match(/\d+/)?.[0] || '0', 10);
        if (count === 0 && retry > 1) { pollKBStats(retry - 1); }
      }, 3000);
    }

    function handleKBFileSelect(e) {
      if (e.target.files.length > 0) { uploadKBFile(e.target.files[0]); e.target.value = ''; }
    }

    async function uploadKBFile(file) {
      try {
        let result;
        if (IS_DEMO) { result = await mockBackend.uploadKB(file); }
        else {
          const formData = new FormData(); formData.append('file', file);
          const response = await fetch(`${API_BASE}/knowledge-base/upload`, { method: 'POST', body: formData });
          result = await response.json();
        }
        if (result.success) { await loadKnowledgeBase(); await loadKBStats(); }
      } catch (e) { console.error('Upload KB file failed:', e); }
    }

    async function loadKnowledgeBase() {
      try {
        let result;
        if (IS_DEMO) { result = { files: mockBackend.loadKB().files }; }
        else {
          const response = await fetch(`${API_BASE}/knowledge-base`);
          result = await response.json();
        }
        kbFiles = result.files || [];
        renderKBFiles();
      } catch (e) { console.error('Load KB failed:', e); }
    }

    function renderKBFiles() {
      kbFilesList.innerHTML = '';
      if (kbFiles.length === 0) {
        kbFilesList.innerHTML = `<div class="empty-state"><i class="fa-solid fa-folder-open"></i><p>暂无知识库文档</p></div>`;
        return;
      }
      const fragment = document.createDocumentFragment();
      kbFiles.forEach(f => {
        const ext = f.name.split('.').pop().toLowerCase();
        let icon = 'fa-file';
        if (ext === 'pdf') icon = 'fa-file-pdf';
        else if (['doc', 'docx'].includes(ext)) icon = 'fa-file-word';
        else if (ext === 'txt') icon = 'fa-file-text';
        const item = document.createElement('div');
        item.className = 'kb-file-item';
        item.innerHTML = `
          <div class="kb-file-icon"><i class="fa-solid ${icon}"></i></div>
          <div class="kb-file-info">
            <div class="kb-file-name">${escapeHtml(f.name.split('_', 1)[1] || f.name)}</div>
            <div class="kb-file-size">${formatSize(f.size)}</div>
          </div>
          <button class="kb-file-remove" title="删除文档"><i class="fa-solid fa-xmark"></i></button>
        `;
        item.querySelector('.kb-file-remove').addEventListener('click', () => deleteKBFile(f.id));
        fragment.appendChild(item);
      });
      kbFilesList.appendChild(fragment);
    }

    async function deleteKBFile(fileId) {
      try {
        let result;
        if (IS_DEMO) { result = await mockBackend.deleteKB(fileId); }
        else {
          const response = await fetch(`${API_BASE}/knowledge-base/${fileId}`, { method: 'DELETE' });
          result = await response.json();
        }
        if (result.success) { await loadKnowledgeBase(); await loadKBStats(); }
      } catch (e) { console.error('Delete KB file failed:', e); }
    }

    /* === Init === */
    function init() {
      loadConversations();
      renderConversations();
      renderMessages();
      renderFiles();
      updateInputButtons();
      inputField.focus();
    }

    init();
  </script>
</body>
</html>
