<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宾客登记确认</title>
    <style id="theme-vars">
/* ============================================
   新中式奢华婚礼 - 品牌设计系统
   Chinese Luxury Wedding Design System
   ============================================ */

:root {
  /* === 主色调 === */
  --color-primary: #C41E3A;
  --color-primary-dark: #9B172E;
  --color-primary-light: #D94A63;
  --color-primary-gradient: linear-gradient(135deg, #C41E3A 0%, #D4A847 100%);
  --color-primary-gradient-vertical: linear-gradient(180deg, #C41E3A 0%, #9B172E 100%);
  --color-primary-gradient-radial: radial-gradient(circle at 30% 30%, #D94A63 0%, #C41E3A 50%, #9B172E 100%);

  /* === 金色辅色 === */
  --color-gold: #D4A847;
  --color-gold-dark: #B8923A;
  --color-gold-light: #E8C77A;
  --color-gold-pale: #F5E6C8;
  --color-gold-gradient: linear-gradient(135deg, #E8C77A 0%, #D4A847 50%, #B8923A 100%);
  --color-gold-gradient-soft: linear-gradient(135deg, #F5E6C8 0%, #D4A847 100%);

  /* === 背景色 === */
  --color-bg: #FDF8F3;
  --color-bg-warm: #FAF3EB;
  --color-bg-ivory: #FFFFF0;
  --color-bg-card: #FFFFFF;

  /* === 文字色 === */
  --color-ink: #2D2A26;
  --color-ink-light: #5A5550;
  --color-ink-muted: #8B8680;
  --color-ink-faint: #B5B0AA;
  --color-text-on-primary: #FFFFFF;
  --color-text-on-gold: #2D2A26;

  /* === 点缀色 === */
  --color-ivory: #FFFFF0;
  --color-ink-black: #2D2A26;

  /* === 状态色 === */
  --state-success: #2E7D5B;
  --state-success-light: #E8F5EE;
  --state-warning: #D97706;
  --state-warning-light: #FEF3C7;
  --state-error: #C41E3A;
  --state-error-light: #FEE2E2;
  --state-info: #2563EB;
  --state-info-light: #DBEAFE;

  /* === 边框与分割线 === */
  --color-border: rgba(212, 168, 71, 0.3);
  --color-border-strong: #D4A847;
  --color-border-light: rgba(196, 30, 58, 0.1);
  --color-divider: linear-gradient(90deg, transparent, #D4A847, transparent);

  /* === 阴影 === */
  --shadow-warm: 0 4px 20px rgba(196, 30, 58, 0.15);
  --shadow-warm-lg: 0 8px 40px rgba(196, 30, 58, 0.2);
  --shadow-warm-xl: 0 16px 60px rgba(196, 30, 58, 0.25);
  --shadow-gold: 0 4px 20px rgba(212, 168, 71, 0.25);
  --shadow-gold-glow: 0 0 30px rgba(212, 168, 71, 0.4);
  --shadow-card: 0 2px 12px rgba(45, 42, 38, 0.06);
  --shadow-float: 0 8px 32px rgba(45, 42, 38, 0.12);

  /* === 圆角 === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* === 间距 === */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --space-2xl: 48px;
  --space-3xl: 64px;

  /* === 字号 === */
  --text-xs: 12px;
  --text-sm: 14px;
  --text-base: 16px;
  --text-lg: 18px;
  --text-xl: 20px;
  --text-2xl: 24px;
  --text-3xl: 28px;
  --text-4xl: 36px;
  --text-5xl: 48px;
  --text-6xl: 64px;
  --text-7xl: 80px;
  --text-8xl: 96px;

  /* === 字重 === */
  --font-light: 300;
  --font-regular: 400;
  --font-medium: 500;
  --font-semibold: 600;
  --font-bold: 700;

  /* === 字体系列 === */
  --font-serif-display: "Noto Serif SC", "Source Han Serif SC", "FangZheng XiaoBiaoSong", "STZhongsong", "SimSun", serif;
  --font-sans-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  --font-display-latin: "Playfair Display", "Cormorant Garamond", "Times New Roman", serif;

  /* === 行高 === */
  --leading-tight: 1.2;
  --leading-snug: 1.4;
  --leading-normal: 1.6;
  --leading-relaxed: 1.8;

  /* === 动效 === */
  --transition-fast: 0.15s ease-out;
  --transition-normal: 0.3s ease-out;
  --transition-slow: 0.4s ease-out;
  --transition-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);

  /* === 毛玻璃 === */
  --glass-bg: rgba(255, 255, 255, 0.7);
  --glass-bg-dark: rgba(45, 42, 38, 0.6);
  --glass-blur: blur(20px);
  --glass-border: 1px solid rgba(255, 255, 255, 0.3);

  /* === 容器宽度 === */
  --container-max: 1200px;
  --container-narrow: 960px;
}

/* === 暗色模式变量 === */
.dark {
  --color-bg: #1A1816;
  --color-bg-warm: #252320;
  --color-bg-card: #2D2A26;
  --color-ink: #FDF8F3;
  --color-ink-light: #E8E2DA;
  --color-ink-muted: #B5B0AA;
  --glass-bg: rgba(45, 42, 38, 0.8);
  --glass-border: 1px solid rgba(212, 168, 71, 0.2);
}

/* ============================================
   字体类
   ============================================ */

.wedding-title {
  font-family: var(--font-serif-display);
  font-weight: var(--font-bold);
  letter-spacing: 0.05em;
  line-height: var(--leading-tight);
}

.wedding-body {
  font-family: var(--font-sans-body);
  font-weight: var(--font-regular);
  line-height: var(--leading-normal);
}

.wedding-display {
  font-family: var(--font-display-latin), var(--font-serif-display);
  font-weight: var(--font-bold);
  letter-spacing: 0.02em;
}

.wedding-gold-text {
  background: var(--color-gold-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* ============================================
   背景图案 - 中式回形纹
   ============================================ */

.wedding-pattern {
  background-color: var(--color-bg);
  background-image:
    linear-gradient(rgba(212, 168, 71, 0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(212, 168, 71, 0.06) 1px, transparent 1px);
  background-size: 24px 24px;
}

.wedding-pattern-fret {
  background-color: var(--color-bg);
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 23px, rgba(212, 168, 71, 0.08) 23px, rgba(212, 168, 71, 0.08) 24px),
    repeating-linear-gradient(90deg, transparent, transparent 23px, rgba(212, 168, 71, 0.08) 23px, rgba(212, 168, 71, 0.08) 24px);
}

/* ============================================
   双喜字水印
   ============================================ */

.wedding-shuiyin {
  position: relative;
}

.wedding-shuiyin::before {
  content: "囍";
  position: absolute;
  font-family: var(--font-serif-display);
  font-size: 200px;
  color: rgba(212, 168, 71, 0.06);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  user-select: none;
  z-index: 0;
}

/* ============================================
   金色分隔线
   ============================================ */

.wedding-divider {
  height: 1px;
  background: linear-gradient(90deg, transparent 0%, rgba(212, 168, 71, 0.6) 50%, transparent 100%);
  border: none;
}

.wedding-divider-gold {
  height: 2px;
  background: var(--color-gold-gradient);
  border: none;
  border-radius: 1px;
}

/* ============================================
   卡片样式
   ============================================ */

.wedding-card {
  background: var(--color-bg-card);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  position: relative;
  overflow: hidden;
  transition: transform var(--transition-normal), box-shadow var(--transition-normal);
}

.wedding-card::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: var(--color-primary-gradient);
  opacity: 0.9;
}

.wedding-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-warm-lg);
}

.wedding-card-gold {
  background: var(--color-bg-card);
  border: 2px solid var(--color-gold);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-gold);
}

/* ============================================
   毛玻璃卡片
   ============================================ */

.wedding-glass {
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: var(--glass-border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-warm);
}

/* ============================================
   按钮样式
   ============================================ */

.wedding-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-sm);
  padding: 12px 28px;
  border-radius: var(--radius-lg);
  font-family: var(--font-serif-display);
  font-weight: var(--font-semibold);
  font-size: var(--text-base);
  letter-spacing: 0.05em;
  border: none;
  cursor: pointer;
  transition: all var(--transition-normal);
  position: relative;
  overflow: hidden;
}

.wedding-btn-primary {
  background: var(--color-primary-gradient);
  color: var(--color-gold-light);
  box-shadow: var(--shadow-warm);
}

.wedding-btn-primary:hover {
  box-shadow: var(--shadow-warm-lg), var(--shadow-gold-glow);
  transform: translateY(-2px);
}

.wedding-btn-primary:active {
  transform: scale(0.95);
}

.wedding-btn-gold {
  background: var(--color-gold-gradient);
  color: var(--color-ink-black);
  box-shadow: var(--shadow-gold);
}

.wedding-btn-gold:hover {
  box-shadow: var(--shadow-gold-glow);
  transform: translateY(-2px);
}

.wedding-btn-outline {
  background: transparent;
  color: var(--color-primary);
  border: 2px solid var(--color-gold);
}

.wedding-btn-outline:hover {
  background: rgba(196, 30, 58, 0.05);
  border-color: var(--color-primary);
}

.wedding-btn-ghost {
  background: transparent;
  color: var(--color-gold);
}

.wedding-btn-ghost:hover {
  background: rgba(212, 168, 71, 0.1);
}

/* ============================================
   动画关键帧
   ============================================ */

@keyframes wedding-fadeUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes wedding-pulse {
  0%, 100% {
    opacity: 1;
    transform: scale(1);
  }
  50% {
    opacity: 0.7;
    transform: scale(1.05);
  }
}

@keyframes wedding-pulse-ring {
  0% {
    transform: scale(1);
    opacity: 0.8;
  }
  100% {
    transform: scale(1.8);
    opacity: 0;
  }
}

@keyframes wedding-shimmer {
  0% {
    background-position: -200% 0;
  }
  100% {
    background-position: 200% 0;
  }
}

@keyframes wedding-float {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-8px);
  }
}

@keyframes wedding-glow {
  0%, 100% {
    box-shadow: 0 0 20px rgba(212, 168, 71, 0.3);
  }
  50% {
    box-shadow: 0 0 40px rgba(212, 168, 71, 0.6);
  }
}

@keyframes wedding-countUp {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes wedding-ripple {
  to {
    transform: scale(4);
    opacity: 0;
  }
}

@keyframes wedding-celebrate {
  0% {
    transform: scale(0.5);
    opacity: 0;
  }
  50% {
    transform: scale(1.1);
    opacity: 1;
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}

@keyframes wedding-shake {
  0%, 100% { transform: translateX(0); }
  10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
  20%, 40%, 60%, 80% { transform: translateX(5px); }
}

@keyframes wedding-flashGreen {
  0%, 100% { background-color: transparent; }
  50% { background-color: rgba(46, 125, 91, 0.3); }
}

@keyframes wedding-flashRed {
  0%, 100% { background-color: transparent; }
  50% { background-color: rgba(196, 30, 58, 0.3); }
}

/* ============================================
   动画工具类
   ============================================ */

.animate-fadeUp {
  animation: wedding-fadeUp 0.4s ease-out both;
}

.animate-pulse {
  animation: wedding-pulse 2s ease-in-out infinite;
}

.animate-pulse-ring {
  animation: wedding-pulse-ring 2s ease-out infinite;
}

.animate-float {
  animation: wedding-float 3s ease-in-out infinite;
}

.animate-glow {
  animation: wedding-glow 2s ease-in-out infinite;
}

.animate-celebrate {
  animation: wedding-celebrate 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}

.animate-shake {
  animation: wedding-shake 0.5s ease-in-out;
}

/* ============================================
   表格样式
   ============================================ */

.wedding-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  border-radius: var(--radius-lg);
  overflow: hidden;
}

.wedding-table thead th {
  background: var(--color-primary-gradient-vertical);
  color: var(--color-text-on-primary);
  font-family: var(--font-serif-display);
  font-weight: var(--font-semibold);
  padding: 14px 16px;
  text-align: left;
  font-size: var(--text-sm);
  letter-spacing: 0.05em;
}

.wedding-table tbody td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--color-border);
  font-size: var(--text-sm);
  color: var(--color-ink);
}

.wedding-table tbody tr:nth-child(even) {
  background: rgba(212, 168, 71, 0.04);
}

.wedding-table tbody tr:hover {
  background: rgba(196, 30, 58, 0.04);
}

.wedding-table tbody tr:last-child td {
  border-bottom: none;
}

/* ============================================
   统计卡片
   ============================================ */

.wedding-stat-card {
  background: var(--color-bg-card);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-xl);
  padding: var(--space-lg);
  position: relative;
  overflow: hidden;
  transition: transform var(--transition-normal), box-shadow var(--transition-normal);
}

.wedding-stat-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-warm);
}

.wedding-stat-card .stat-number {
  font-family: var(--font-display-latin), var(--font-serif-display);
  font-size: var(--text-4xl);
  font-weight: var(--font-bold);
  line-height: 1;
  margin-bottom: var(--space-sm);
}

.wedding-stat-card .stat-label {
  font-family: var(--font-sans-body);
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
}

.wedding-stat-card--red {
  background: var(--color-primary-gradient-vertical);
  color: white;
  border: none;
}

.wedding-stat-card--red .stat-number {
  color: var(--color-gold-light);
}

.wedding-stat-card--red .stat-label {
  color: rgba(255, 255, 255, 0.8);
}

.wedding-stat-card--gold {
  background: var(--color-gold-gradient-soft);
  border-color: var(--color-gold);
}

.wedding-stat-card--gold .stat-number {
  color: var(--color-primary);
}

/* ============================================
   进度环
   ============================================ */

.wedding-progress-ring {
  position: relative;
  width: 120px;
  height: 120px;
}

.wedding-progress-ring svg {
  transform: rotate(-90deg);
}

.wedding-progress-ring .ring-bg {
  stroke: rgba(212, 168, 71, 0.2);
  fill: none;
  stroke-width: 8;
}

.wedding-progress-ring .ring-fill {
  stroke: url(#goldGradient);
  fill: none;
  stroke-width: 8;
  stroke-linecap: round;
  transition: stroke-dashoffset 1s ease-out;
}

.wedding-progress-ring .ring-value {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-family: var(--font-display-latin);
  font-size: var(--text-2xl);
  font-weight: var(--font-bold);
  color: var(--color-primary);
}

/* ============================================
   时间线
   ============================================ */

.wedding-timeline {
  position: relative;
  padding-left: 32px;
}

.wedding-timeline::before {
  content: "";
  position: absolute;
  left: 11px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: linear-gradient(180deg, var(--color-gold) 0%, rgba(212, 168, 71, 0.3) 100%);
}

.wedding-timeline-item {
  position: relative;
  padding-bottom: var(--space-lg);
}

.wedding-timeline-item::before {
  content: "";
  position: absolute;
  left: -26px;
  top: 4px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--color-gold);
  border: 2px solid var(--color-bg-card);
  box-shadow: 0 0 0 2px var(--color-gold);
}

.wedding-timeline-item--active::before {
  background: var(--color-primary);
  box-shadow: 0 0 0 2px var(--color-primary), 0 0 12px rgba(196, 30, 58, 0.6);
  animation: wedding-pulse 2s ease-in-out infinite;
}

.wedding-timeline-item--pending::before {
  background: var(--color-ink-faint);
  box-shadow: 0 0 0 2px var(--color-ink-faint);
}

/* ============================================
   徽章/标签
   ============================================ */

.wedding-badge {
  display: inline-flex;
  align-items: center;
  padding: 4px 12px;
  border-radius: var(--radius-full);
  font-size: var(--text-xs);
  font-weight: var(--font-medium);
  font-family: var(--font-sans-body);
}

.wedding-badge--red {
  background: rgba(196, 30, 58, 0.1);
  color: var(--color-primary);
  border: 1px solid rgba(196, 30, 58, 0.2);
}

.wedding-badge--gold {
  background: rgba(212, 168, 71, 0.15);
  color: var(--color-gold-dark);
  border: 1px solid rgba(212, 168, 71, 0.3);
}

.wedding-badge--success {
  background: var(--state-success-light);
  color: var(--state-success);
  border: 1px solid rgba(46, 125, 91, 0.2);
}

.wedding-badge--warning {
  background: var(--state-warning-light);
  color: var(--state-warning);
  border: 1px solid rgba(217, 119, 6, 0.2);
}

/* ============================================
   输入框样式
   ============================================ */

.wedding-input {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid var(--color-border);
  border-radius: var(--radius-lg);
  font-family: var(--font-sans-body);
  font-size: var(--text-base);
  color: var(--color-ink);
  background: var(--color-bg-card);
  transition: all var(--transition-fast);
  outline: none;
}

.wedding-input:focus {
  border-color: var(--color-gold);
  box-shadow: 0 0 0 4px rgba(212, 168, 71, 0.15);
}

.wedding-input--gold {
  border-color: var(--color-gold);
  box-shadow: var(--shadow-gold);
}

.wedding-input--gold:focus {
  box-shadow: var(--shadow-gold-glow), 0 0 0 4px rgba(212, 168, 71, 0.2);
}

/* ============================================
   装饰元素
   ============================================ */

.wedding-corner-ornament {
  position: absolute;
  width: 40px;
  height: 40px;
  border: 2px solid var(--color-gold);
  opacity: 0.6;
}

.wedding-corner-ornament--tl {
  top: 12px;
  left: 12px;
  border-right: none;
  border-bottom: none;
}

.wedding-corner-ornament--tr {
  top: 12px;
  right: 12px;
  border-left: none;
  border-bottom: none;
}

.wedding-corner-ornament--bl {
  bottom: 12px;
  left: 12px;
  border-right: none;
  border-top: none;
}

.wedding-corner-ornament--br {
  bottom: 12px;
  right: 12px;
  border-left: none;
  border-top: none;
}

/* ============================================
   响应式工具
   ============================================ */

.wedding-container {
  max-width: var(--container-max);
  margin: 0 auto;
  padding: 0 var(--space-lg);
}

@media (max-width: 1024px) {
  .wedding-container {
    padding: 0 var(--space-md);
  }
}

@media (max-width: 768px) {
  .wedding-container {
    padding: 0 var(--space-sm);
  }
}

<body class="min-h-screen antialiased" style="font-family: var(--font-sans-body); background: var(--color-bg);">
    <!-- 顶部导航 -->
    <header class="sticky top-0 z-40 w-full" style="background: var(--color-primary-gradient-vertical); box-shadow: 0 2px 12px rgba(196, 30, 58, 0.2);">
        <div class="wedding-container flex items-center justify-between h-16 md:h-[72px]">
            <div class="flex items-center gap-3">
                <button data-dom-id="back-search" class="w-10 h-10 rounded-full flex items-center justify-center text-white transition-all hover:bg-white/10 active:scale-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-white/50" aria-label="返回">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </button>
                <h1 class="text-white wedding-title text-lg md:text-xl tracking-wider">宾客登记</h1>
            </div>
            <div class="flex items-center gap-2 px-4 py-1.5 rounded-full" style="background: rgba(212, 168, 71, 0.2); border: 1px solid rgba(212, 168, 71, 0.4);">
                <span style="font-family: var(--font-display-latin); color: var(--color-gold-light); font-size: var(--text-sm); font-weight: 600;">第1步 / 共2步</span>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="wedding-pattern-fret pb-32">
        <div class="wedding-container py-6 md:py-8">
            <div class="grid grid-cols-1 lg:grid-cols-5 gap-6">
                <!-- 左栏：宾客信息卡 -->
                <div class="lg:col-span-2">
                    <div class="wedding-card-gold p-6 md:p-8 relative">
                        <!-- 四角装饰 -->
                        <div class="wedding-corner-ornament wedding-corner-ornament--tl"></div>
                        <div class="wedding-corner-ornament wedding-corner-ornament--tr"></div>
                        <div class="wedding-corner-ornament wedding-corner-ornament--bl"></div>
                        <div class="wedding-corner-ornament wedding-corner-ornament--br"></div>

                        <!-- 头像与姓名 -->
                        <div class="flex flex-col items-center text-center mb-6">
                            <div class="relative mb-4">
                                <div class="w-24 h-24 md:w-28 md:h-28 rounded-full flex items-center justify-center wedding-title text-3xl md:text-4xl" style="background: var(--color-primary-gradient); color: var(--color-gold-light); border: 3px solid var(--color-gold); box-shadow: var(--shadow-gold);">
                                    张
                                </div>
                                <div class="absolute -bottom-1 -right-1 w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-bold" style="background: var(--color-primary); border: 2px solid white;">
                                    VIP
                                </div>
                            </div>
                            <h2 class="wedding-title text-2xl md:text-3xl mb-2" style="color: var(--color-primary); text-wrap: balance; word-break: keep-all;">张明远</h2>
                            <span class="wedding-badge wedding-badge--gold text-sm px-4 py-1.5" style="font-size: var(--text-sm);">
                                新郎方 · 大学同学
                            </span>
                        </div>

                        <!-- 金色分隔线 -->
                        <div class="wedding-divider-gold my-6"></div>

                        <!-- 信息列表 -->
                        <div class="space-y-4">
                            <div class="flex items-start gap-3">
                                <div class="w-9 h-9 rounded-lg flex items-center justify-center shrink-0" style="background: rgba(212, 168, 71, 0.1); color: var(--color-gold-dark);">
                                    <i data-lucide="phone" class="w-4 h-4"></i>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <p class="text-sm mb-0.5" style="color: var(--color-ink-muted);">联系电话</p>
                                    <p class="font-medium truncate" style="color: var(--color-ink); font-family: var(--font-display-latin);">138 **** 8888</p>
                                </div>
                            </div>

                            <div class="flex items-start gap-3">
                                <div class="w-9 h-9 rounded-lg flex items-center justify-center shrink-0" style="background: rgba(212, 168, 71, 0.1); color: var(--color-gold-dark);">
                                    <i data-lucide="users" class="w-4 h-4"></i>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <p class="text-sm mb-0.5" style="color: var(--color-ink-muted);">来宾人数</p>
                                    <p class="font-medium" style="color: var(--color-ink);"><span style="font-family: var(--font-display-latin); color: var(--color-primary); font-size: var(--text-lg); font-weight: 700;">2</span> 人（本人 + 1位家属）</p>
                                </div>
                            </div>

                            <div class="flex items-start gap-3">
                                <div class="w-9 h-9 rounded-lg flex items-center justify-center shrink-0" style="background: rgba(212, 168, 71, 0.1); color: var(--color-gold-dark);">
                                    <i data-lucide="utensils" class="w-4 h-4"></i>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <p class="text-sm mb-0.5" style="color: var(--color-ink-muted);">预约桌号</p>
                                    <p class="font-medium" style="color: var(--color-ink);">第 <span style="font-family: var(--font-display-latin); color: var(--color-primary); font-weight: 700;">8</span> 桌 · 3号、4号位</p>
                                </div>
                            </div>

                            <div class="flex items-start gap-3">
                                <div class="w-9 h-9 rounded-lg flex items-center justify-center shrink-0" style="background: rgba(196, 30, 58, 0.1); color: var(--color-primary);">
                                    <i data-lucide="crown" class="w-4 h-4"></i>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <p class="text-sm mb-0.5" style="color: var(--color-ink-muted);">是否贵宾</p>
                                    <span class="wedding-badge wedding-badge--red" style="font-size: var(--text-sm); padding: 4px 12px;">是 · VIP 贵宾</span>
                                </div>
                            </div>

                            <div class="flex items-start gap-3">
                                <div class="w-9 h-9 rounded-lg flex items-center justify-center shrink-0" style="background: rgba(212, 168, 71, 0.1); color: var(--color-gold-dark);">
                                    <i data-lucide="file-text" class="w-4 h-4"></i>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <p class="text-sm mb-0.5" style="color: var(--color-ink-muted);">备注</p>
                                    <p class="text-sm leading-relaxed" style="color: var(--color-ink-light);">新郎大学室友，需安排在主桌附近</p>
                                </div>
                            </div>
                        </div>

                        <!-- 金色分隔线 -->
                        <div class="wedding-divider my-6"></div>

                        <!-- 签到状态切换 -->
                        <div class="flex items-center justify-between">
                            <span class="font-medium" style="color: var(--color-ink);">签到状态</span>
                            <div class="flex items-center gap-2">
                                <button id="checkin-toggle" data-dom-id="checkin-toggle" class="relative w-14 h-8 rounded-full transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2" style="background: var(--color-primary); box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);" aria-pressed="true" aria-label="签到状态切换">
                                    <span class="absolute top-0.5 right-0.5 w-7 h-7 rounded-full bg-white transition-all flex items-center justify-center" style="box-shadow: 0 2px 6px rgba(0,0,0,0.15);">
                                        <i data-lucide="check" class="w-4 h-4" style="color: var(--color-primary);"></i>
                                    </span>
                                </button>
                                <span class="text-sm font-medium" style="color: var(--color-primary);">已签到</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 右栏：礼金与座位确认 -->
                <div class="lg:col-span-3 space-y-6">
                    <!-- 礼金登记卡片 -->
                    <div class="wedding-card-gold p-6 md:p-8 relative">
                        <!-- 四角装饰 -->
                        <div class="wedding-corner-ornament wedding-corner-ornament--tl"></div>
                        <div class="wedding-corner-ornament wedding-corner-ornament--tr"></div>

                        <div class="flex items-center gap-3 mb-6">
                            <div class="w-10 h-10 rounded-lg flex items-center justify-center" style="background: var(--color-primary-gradient);">
                                <i data-lucide="wallet" class="w-5 h-5 text-white"></i>
                            </div>
                            <h2 class="wedding-title text-xl md:text-2xl" style="color: var(--color-primary);">礼金登记</h2>
                        </div>

                        <!-- 礼金金额输入 -->
                        <div class="mb-5">
                            <label class="block text-sm font-medium mb-2" style="color: var(--color-ink-light);">礼金金额</label>
                            <div class="relative">
                                <span class="absolute left-5 top-1/2 -translate-y-1/2 text-2xl wedding-display" style="color: var(--color-gold-dark);">¥</span>
                                <input
                                    type="text"
                                    data-dom-id="gift-amount-input"
                                    placeholder="请输入礼金金额"
                                    class="wedding-input wedding-input--gold pl-14 pr-4 py-4 text-2xl font-bold text-right"
                                    style="font-family: var(--font-display-latin); color: var(--color-primary); letter-spacing: 0.02em;"
                                    value=""
                                />
                            </div>
                        </div>

                        <!-- 快捷金额按钮 -->
                        <div class="mb-6">
                            <p class="text-xs mb-3" style="color: var(--color-ink-muted);">快捷金额</p>
                            <div class="flex flex-wrap gap-2">
                                <button data-dom-id="quick-amount-200" class="quick-amount-btn px-4 py-2 rounded-lg text-sm font-medium transition-all hover:-translate-y-0.5 focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2" style="background: rgba(212, 168, 71, 0.1); color: var(--color-gold-dark); border: 1px solid rgba(212, 168, 71, 0.3); font-family: var(--font-display-latin);">
                                    200
                                </button>
                                <button data-dom-id="quick-amount-500" class="quick-amount-btn px-4 py-2 rounded-lg text-sm font-medium transition-all hover:-translate-y-0.5 focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2" style="background: rgba(212, 168, 71, 0.1); color: var(--color-gold-dark); border: 1px solid rgba(212, 168, 71, 0.3); font-family: var(--font-display-latin);">
                                    500
                                </button>
                                <button data-dom-id="quick-amount-800" class="quick-amount-btn px-4 py-2 rounded-lg text-sm font-medium transition-all hover:-translate-y-0.5 focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2" style="background: rgba(212, 168, 71, 0.1); color: var(--color-gold-dark); border: 1px solid rgba(212, 168, 71, 0.3); font-family: var(--font-display-latin);">
                                    800
                                </button>
                                <button data-dom-id="quick-amount-1000" class="quick-amount-btn px-4 py-2 rounded-lg text-sm font-medium transition-all hover:-translate-y-0.5 focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2" style="background: rgba(212, 168, 71, 0.1); color: var(--color-gold-dark); border: 1px solid rgba(212, 168, 71, 0.3); font-family: var(--font-display-latin);">
                                    1000
                                </button>
                                <button data-dom-id="quick-amount-2000" class="quick-amount-btn px-4 py-2 rounded-lg text-sm font-medium transition-all hover:-translate-y-0.5 focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2" style="background: rgba(212, 168, 71, 0.1); color: var(--color-gold-dark); border: 1px solid rgba(212, 168, 71, 0.3); font-family: var(--font-display-latin);">
                                    2000
                                </button>
                            </div>
                        </div>

                        <!-- 礼金形式 -->
                        <div>
                            <p class="text-sm font-medium mb-3" style="color: var(--color-ink-light);">礼金形式</p>
                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                                <label class="gift-type-option cursor-pointer">
                                    <input type="radio" name="gift-type" value="cash" class="sr-only" checked>
                                    <div class="flex flex-col items-center justify-center gap-1.5 py-3 px-2 rounded-lg border-2 transition-all" style="border-color: var(--color-primary); background: rgba(196, 30, 58, 0.05);">
                                        <i data-lucide="banknote" class="w-5 h-5" style="color: var(--color-primary);"></i>
                                        <span class="text-sm font-medium" style="color: var(--color-primary);">现金</span>
                                    </div>
                                </label>
                                <label class="gift-type-option cursor-pointer">
                                    <input type="radio" name="gift-type" value="transfer" class="sr-only">
                                    <div class="flex flex-col items-center justify-center gap-1.5 py-3 px-2 rounded-lg border-2 transition-all" style="border-color: rgba(212, 168, 71, 0.3);">
                                        <i data-lucide="smartphone" class="w-5 h-5" style="color: var(--color-gold-dark);"></i>
                                        <span class="text-sm font-medium" style="color: var(--color-ink);">转账</span>
                                    </div>
                                </label>
                                <label class="gift-type-option cursor-pointer">
                                    <input type="radio" name="gift-type" value="check" class="sr-only">
                                    <div class="flex flex-col items-center justify-center gap-1.5 py-3 px-2 rounded-lg border-2 transition-all" style="border-color: rgba(212, 168, 71, 0.3);">
                                        <i data-lucide="check-square" class="w-5 h-5" style="color: var(--color-gold-dark);"></i>
                                        <span class="text-sm font-medium" style="color: var(--color-ink);">支票</span>
                                    </div>
                                </label>
                                <label class="gift-type-option cursor-pointer">
                                    <input type="radio" name="gift-type" value="gift" class="sr-only">
                                    <div class="flex flex-col items-center justify-center gap-1.5 py-3 px-2 rounded-lg border-2 transition-all" style="border-color: rgba(212, 168, 71, 0.3);">
                                        <i data-lucide="gift" class="w-5 h-5" style="color: var(--color-gold-dark);"></i>
                                        <span class="text-sm font-medium" style="color: var(--color-ink);">礼物</span>
                                    </div>
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- 座位确认卡片 -->
                    <div class="wedding-card-gold p-6 md:p-8 relative">
                        <!-- 四角装饰 -->
                        <div class="wedding-corner-ornament wedding-corner-ornament--tl"></div>
                        <div class="wedding-corner-ornament wedding-corner-ornament--tr"></div>

                        <div class="flex items-center gap-3 mb-6">
                            <div class="w-10 h-10 rounded-lg flex items-center justify-center" style="background: var(--color-primary-gradient);">
                                <i data-lucide="layout-grid" class="w-5 h-5 text-white"></i>
                            </div>
                            <h2 class="wedding-title text-xl md:text-2xl" style="color: var(--color-primary);">座位确认</h2>
                        </div>

                        <!-- 桌号选择 -->
                        <div class="mb-6">
                            <label class="block text-sm font-medium mb-2" style="color: var(--color-ink-light);">选择桌号</label>
                            <div class="relative">
                                <select data-dom-id="table-select" class="wedding-input wedding-input--gold pr-10 appearance-none cursor-pointer" style="color: var(--color-primary); font-weight: 600;">
                                    <option value="1">第 1 桌 · 主桌</option>
                                    <option value="2">第 2 桌 · 女方亲属</option>
                                    <option value="3">第 3 桌 · 男方亲属</option>
                                    <option value="4">第 4 桌 · 女方同事</option>
                                    <option value="5">第 5 桌 · 男方同事</option>
                                    <option value="6">第 6 桌 · 女方朋友</option>
                                    <option value="7">第 7 桌 · 男方朋友</option>
                                    <option value="8" selected>第 8 桌 · 新郎同学</option>
                                    <option value="9">第 9 桌 · 新娘同学</option>
                                    <option value="10">第 10 桌 · 备用桌</option>
                                </select>
                                <i data-lucide="chevron-down" class="absolute right-4 top-1/2 -translate-y-1/2 w-5 h-5 pointer-events-none" style="color: var(--color-gold-dark);"></i>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <!-- 座位预览 -->
                            <div>
                                <p class="text-sm font-medium mb-3" style="color: var(--color-ink-light);">座位预览</p>
                                <div class="aspect-square max-w-[240px] mx-auto rounded-full flex items-center justify-center relative" style="background: linear-gradient(135deg, rgba(212, 168, 71, 0.1) 0%, rgba(212, 168, 71, 0.05) 100%); border: 2px solid var(--color-gold);">
                                    <!-- 桌号中心 -->
                                    <div class="w-20 h-20 rounded-full flex flex-col items-center justify-center" style="background: var(--color-primary-gradient); box-shadow: var(--shadow-warm);">
                                        <span class="text-xs text-white/80">第</span>
                                        <span class="text-xl wedding-display text-white" style="color: var(--color-gold-light); font-weight: 700;">8</span>
                                        <span class="text-xs text-white/80">桌</span>
                                    </div>
                                    <!-- 座位圆点 - 10个座位环绕 -->
                                    <div class="absolute inset-0">
                                        <!-- 座位1 - 正上方 -->
                                        <div class="absolute left-1/2 -translate-x-1/2 top-1 w-8 h-8 rounded-full flex items-center justify-center text-xs font-medium" style="background: rgba(255,255,255,0.9); border: 2px solid var(--color-gold); color: var(--color-gold-dark);">1</div>
                                        <!-- 座位2 -->
                                        <div class="absolute right-4 top-[18%] w-8 h-8 rounded-full flex items-center justify-center text-xs font-medium" style="background: rgba(255,255,255,0.9); border: 2px solid var(--color-gold); color: var(--color-gold-dark);">2</div>
                                        <!-- 座位3 - 高亮 -->
                                        <div class="absolute right-1 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full flex items-center justify-center text-xs font-bold animate-pulse" style="background: var(--color-primary); border: 2px solid var(--color-gold-light); color: white; box-shadow: 0 0 12px rgba(196, 30, 58, 0.5);">3</div>
                                        <!-- 座位4 - 高亮 -->
                                        <div class="absolute right-4 bottom-[18%] w-9 h-9 rounded-full flex items-center justify-center text-xs font-bold animate-pulse" style="background: var(--color-primary); border: 2px solid var(--color-gold-light); color: white; box-shadow: 0 0 12px rgba(196, 30, 58, 0.5); animation-delay: 0.3s;">4</div>
                                        <!-- 座位5 -->
                                        <div class="absolute left-1/2 -translate-x-1/2 bottom-1 w-8 h-8 rounded-full flex items-center justify-center text-xs font-medium" style="background: rgba(255,255,255,0.9); border: 2px solid var(--color-gold); color: var(--color-gold-dark);">5</div>
                                        <!-- 座位6 -->
                                        <div class="absolute left-4 bottom-[18%] w-8 h-8 rounded-full flex items-center justify-center text-xs font-medium" style="background: rgba(255,255,255,0.9); border: 2px solid var(--color-gold); color: var(--color-gold-dark);">6</div>
                                        <!-- 座位7 -->
                                        <div class="absolute left-1 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full flex items-center justify-center text-xs font-medium" style="background: rgba(255,255,255,0.9); border: 2px solid var(--color-gold); color: var(--color-gold-dark);">7</div>
                                        <!-- 座位8 -->
                                        <div class="absolute left-4 top-[18%] w-8 h-8 rounded-full flex items-center justify-center text-xs font-medium" style="background: rgba(255,255,255,0.9); border: 2px solid var(--color-gold); color: var(--color-gold-dark);">8</div>
                                        <!-- 座位9 -->
                                        <div class="absolute left-1/3 -translate-x-1/2 top-3 w-8 h-8 rounded-full flex items-center justify-center text-xs font-medium" style="background: rgba(255,255,255,0.9); border: 2px solid var(--color-gold); color: var(--color-gold-dark);">9</div>
                                        <!-- 座位10 -->
                                        <div class="absolute right-1/3 translate-x-1/2 top-3 w-8 h-8 rounded-full flex items-center justify-center text-xs font-medium" style="background: rgba(255,255,255,0.9); border: 2px solid var(--color-gold); color: var(--color-gold-dark);">10</div>
                                    </div>
                                </div>
                                <p class="text-center text-xs mt-3" style="color: var(--color-ink-muted);">红色高亮为已分配座位</p>
                            </div>

                            <!-- 随行人员 -->
                            <div>
                                <p class="text-sm font-medium mb-3" style="color: var(--color-ink-light);">随行人员</p>
                                <div class="space-y-3">
                                    <div>
                                        <label class="block text-xs mb-1.5" style="color: var(--color-ink-muted);">本人</label>
                                        <div class="flex items-center gap-2 px-3 py-2.5 rounded-lg" style="background: rgba(196, 30, 58, 0.05); border: 1px solid rgba(196, 30, 58, 0.15);">
                                            <div class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold text-white shrink-0" style="background: var(--color-primary);">张</div>
                                            <span class="text-sm font-medium flex-1 truncate" style="color: var(--color-ink);">张明远</span>
                                            <span class="text-xs shrink-0" style="color: var(--color-primary);">3号位</span>
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-xs mb-1.5" style="color: var(--color-ink-muted);">家属 1</label>
                                        <input
                                            type="text"
                                            data-dom-id="companion-name-1"
                                            placeholder="请输入家属姓名"
                                            class="wedding-input text-sm py-2.5"
                                            value="李婉清"
                                        />
                                    </div>
                                </div>
                                <button data-dom-id="add-companion" class="w-full mt-3 py-2.5 rounded-lg border-2 border-dashed text-sm font-medium transition-all hover:border-primary hover:text-primary focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 flex items-center justify-center gap-1.5" style="border-color: rgba(212, 168, 71, 0.4); color: var(--color-gold-dark);">
                                    <i data-lucide="plus" class="w-4 h-4"></i>
                                    添加随行人员
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 底部操作栏 -->
    <div class="fixed bottom-0 left-0 right-0 z-50" style="background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--color-border); box-shadow: 0 -4px 20px rgba(196, 30, 58, 0.08);">
        <div class="wedding-container flex items-center justify-between gap-4 py-4">
            <button data-dom-id="back-search" class="wedding-btn wedding-btn-outline px-6 md:px-8 whitespace-nowrap">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                返回
            </button>
            <button data-dom-id="confirm-btn" class="wedding-btn wedding-btn-primary text-base md:text-lg px-8 md:px-12 py-3 md:py-4 whitespace-nowrap animate-glow">
                <i data-lucide="check-circle" class="w-5 h-5"></i>
                确认登记
            </button>
        </div>
    </div>

    <!-- 页面自定义样式 -->
    <style>
        /* 礼金形式单选选中状态 */
        .gift-type-option input:checked + div {
            border-color: var(--color-primary);
            background: rgba(196, 30, 58, 0.05);
        }
        .gift-type-option input:checked + div svg {
            color: var(--color-primary);
        }
        .gift-type-option input:checked + div span {
            color: var(--color-primary);
        }
        .gift-type-option input:focus-visible + div {
            box-shadow: 0 0 0 3px rgba(212, 168, 71, 0.3);
        }

        /* 快捷金额按钮激活状态 */
        .quick-amount-btn.active {
            background: var(--color-primary) !important;
            color: var(--color-gold-light) !important;
            border-color: var(--color-primary) !important;
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--color-bg);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(212, 168, 71, 0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(212, 168, 71, 0.5);
        }
    </style>

    <script>lucide.createIcons();</script>

    <!-- 页面交互脚本 -->
    <script>
        // 快捷金额按钮点击
        document.querySelectorAll('.quick-amount-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                // 移除所有按钮的激活状态
                document.querySelectorAll('.quick-amount-btn').forEach(function(b) {
                    b.classList.remove('active');
                });
                // 添加当前按钮激活状态
                this.classList.add('active');
                var amount = this.textContent.trim();
                var input = document.querySelector('[data-dom-id="gift-amount-input"]');
                input.value = amount;
                input.focus();
                // 添加高亮动画
                input.style.boxShadow = 'var(--shadow-gold-glow), 0 0 0 4px rgba(212, 168, 71, 0.2)';
                setTimeout(function() {
                    input.style.boxShadow = '';
                }, 300);
            });
        });

        // 签到状态切换
        var toggle = document.getElementById('checkin-toggle');
        var toggleText = toggle ? toggle.parentElement.querySelector('span:last-child') : null;
        var toggleKnob = toggle ? toggle.querySelector('span') : null;
        var isChecked = true;

        if (toggle) {
            toggle.addEventListener('click', function() {
                isChecked = !isChecked;
                if (isChecked) {
                    toggle.style.background = 'var(--color-primary)';
                    toggle.setAttribute('aria-pressed', 'true');
                    toggleKnob.style.transform = 'translateX(0)';
                    toggleKnob.classList.remove('left-0.5');
                    toggleKnob.style.right = '0.125rem';
                    toggleKnob.style.left = 'auto';
                    toggleText.textContent = '已签到';
                    toggleText.style.color = 'var(--color-primary)';
                    toggleKnob.innerHTML = '<i data-lucide="check" class="w-4 h-4" style="color: var(--color-primary);"></i>';
                } else {
                    toggle.style.background = 'var(--color-ink-faint)';
                    toggle.setAttribute('aria-pressed', 'false');
                    toggleKnob.style.right = 'auto';
                    toggleKnob.style.left = '0.125rem';
                    toggleText.textContent = '未签到';
                    toggleText.style.color = 'var(--color-ink-muted)';
                    toggleKnob.innerHTML = '<i data-lucide="x" class="w-4 h-4" style="color: var(--color-ink-muted);"></i>';
                }
                lucide.createIcons();
            });
        }

        // 减少动画（无障碍）
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            document.querySelectorAll('.animate-glow, .animate-pulse').forEach(function(el) {
                el.style.animationDuration = '0.01ms';
            });
        }
    </script>
</body>
</html>
