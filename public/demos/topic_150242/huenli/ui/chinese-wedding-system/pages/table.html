<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宴桌端 - 第8桌</title>
    <style id="theme-vars">
/* ============================================
   新中式奢华婚礼 - 品牌设计系统
   Chinese Luxury Wedding Design System
   ============================================ */

:root {
  /* === 主色调 === */
  --color-primary: #C41E3A;
  --color-primary-dark: #9B172E;
  --color-primary-light: #D94A63;
  --color-primary-gradient: linear-gradient(135deg, #C41E3A 0%, #D4A847 100%);
  --color-primary-gradient-vertical: linear-gradient(180deg, #C41E3A 0%, #9B172E 100%);
  --color-primary-gradient-radial: radial-gradient(circle at 30% 30%, #D94A63 0%, #C41E3A 50%, #9B172E 100%);

  /* === 金色辅色 === */
  --color-gold: #D4A847;
  --color-gold-dark: #B8923A;
  --color-gold-light: #E8C77A;
  --color-gold-pale: #F5E6C8;
  --color-gold-gradient: linear-gradient(135deg, #E8C77A 0%, #D4A847 50%, #B8923A 100%);
  --color-gold-gradient-soft: linear-gradient(135deg, #F5E6C8 0%, #D4A847 100%);

  /* === 背景色 === */
  --color-bg: #FDF8F3;
  --color-bg-warm: #FAF3EB;
  --color-bg-ivory: #FFFFF0;
  --color-bg-card: #FFFFFF;

  /* === 文字色 === */
  --color-ink: #2D2A26;
  --color-ink-light: #5A5550;
  --color-ink-muted: #8B8680;
  --color-ink-faint: #B5B0AA;
  --color-text-on-primary: #FFFFFF;
  --color-text-on-gold: #2D2A26;

  /* === 点缀色 === */
  --color-ivory: #FFFFF0;
  --color-ink-black: #2D2A26;

  /* === 状态色 === */
  --state-success: #2E7D5B;
  --state-success-light: #E8F5EE;
  --state-warning: #D97706;
  --state-warning-light: #FEF3C7;
  --state-error: #C41E3A;
  --state-error-light: #FEE2E2;
  --state-info: #2563EB;
  --state-info-light: #DBEAFE;

  /* === 边框与分割线 === */
  --color-border: rgba(212, 168, 71, 0.3);
  --color-border-strong: #D4A847;
  --color-border-light: rgba(196, 30, 58, 0.1);
  --color-divider: linear-gradient(90deg, transparent, #D4A847, transparent);

  /* === 阴影 === */
  --shadow-warm: 0 4px 20px rgba(196, 30, 58, 0.15);
  --shadow-warm-lg: 0 8px 40px rgba(196, 30, 58, 0.2);
  --shadow-warm-xl: 0 16px 60px rgba(196, 30, 58, 0.25);
  --shadow-gold: 0 4px 20px rgba(212, 168, 71, 0.25);
  --shadow-gold-glow: 0 0 30px rgba(212, 168, 71, 0.4);
  --shadow-card: 0 2px 12px rgba(45, 42, 38, 0.06);
  --shadow-float: 0 8px 32px rgba(45, 42, 38, 0.12);

  /* === 圆角 === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* === 间距 === */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --space-2xl: 48px;
  --space-3xl: 64px;

  /* === 字号 === */
  --text-xs: 12px;
  --text-sm: 14px;
  --text-base: 16px;
  --text-lg: 18px;
  --text-xl: 20px;
  --text-2xl: 24px;
  --text-3xl: 28px;
  --text-4xl: 36px;
  --text-5xl: 48px;
  --text-6xl: 64px;
  --text-7xl: 80px;
  --text-8xl: 96px;

  /* === 字重 === */
  --font-light: 300;
  --font-regular: 400;
  --font-medium: 500;
  --font-semibold: 600;
  --font-bold: 700;

  /* === 字体系列 === */
  --font-serif-display: "Noto Serif SC", "Source Han Serif SC", "FangZheng XiaoBiaoSong", "STZhongsong", "SimSun", serif;
  --font-sans-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  --font-display-latin: "Playfair Display", "Cormorant Garamond", "Times New Roman", serif;

  /* === 行高 === */
  --leading-tight: 1.2;
  --leading-snug: 1.4;
  --leading-normal: 1.6;
  --leading-relaxed: 1.8;

  /* === 动效 === */
  --transition-fast: 0.15s ease-out;
  --transition-normal: 0.3s ease-out;
  --transition-slow: 0.4s ease-out;
  --transition-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);

  /* === 毛玻璃 === */
  --glass-bg: rgba(255, 255, 255, 0.7);
  --glass-bg-dark: rgba(45, 42, 38, 0.6);
  --glass-blur: blur(20px);
  --glass-border: 1px solid rgba(255, 255, 255, 0.3);

  /* === 容器宽度 === */
  --container-max: 1200px;
  --container-narrow: 960px;
}

/* === 暗色模式变量 === */
.dark {
  --color-bg: #1A1816;
  --color-bg-warm: #252320;
  --color-bg-card: #2D2A26;
  --color-ink: #FDF8F3;
  --color-ink-light: #E8E2DA;
  --color-ink-muted: #B5B0AA;
  --glass-bg: rgba(45, 42, 38, 0.8);
  --glass-border: 1px solid rgba(212, 168, 71, 0.2);
}

/* ============================================
   字体类
   ============================================ */

.wedding-title {
  font-family: var(--font-serif-display);
  font-weight: var(--font-bold);
  letter-spacing: 0.05em;
  line-height: var(--leading-tight);
}

.wedding-body {
  font-family: var(--font-sans-body);
  font-weight: var(--font-regular);
  line-height: var(--leading-normal);
}

.wedding-display {
  font-family: var(--font-display-latin), var(--font-serif-display);
  font-weight: var(--font-bold);
  letter-spacing: 0.02em;
}

.wedding-gold-text {
  background: var(--color-gold-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* ============================================
   背景图案 - 中式回形纹
   ============================================ */

.wedding-pattern {
  background-color: var(--color-bg);
  background-image:
    linear-gradient(rgba(212, 168, 71, 0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(212, 168, 71, 0.06) 1px, transparent 1px);
  background-size: 24px 24px;
}

.wedding-pattern-fret {
  background-color: var(--color-bg);
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 23px, rgba(212, 168, 71, 0.08) 23px, rgba(212, 168, 71, 0.08) 24px),
    repeating-linear-gradient(90deg, transparent, transparent 23px, rgba(212, 168, 71, 0.08) 23px, rgba(212, 168, 71, 0.08) 24px);
}

/* ============================================
   双喜字水印
   ============================================ */

.wedding-shuiyin {
  position: relative;
}

.wedding-shuiyin::before {
  content: "囍";
  position: absolute;
  font-family: var(--font-serif-display);
  font-size: 200px;
  color: rgba(212, 168, 71, 0.06);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  user-select: none;
  z-index: 0;
}

/* ============================================
   金色分隔线
   ============================================ */

.wedding-divider {
  height: 1px;
  background: linear-gradient(90deg, transparent 0%, rgba(212, 168, 71, 0.6) 50%, transparent 100%);
  border: none;
}

.wedding-divider-gold {
  height: 2px;
  background: var(--color-gold-gradient);
  border: none;
  border-radius: 1px;
}

/* ============================================
   卡片样式
   ============================================ */

.wedding-card {
  background: var(--color-bg-card);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  position: relative;
  overflow: hidden;
  transition: transform var(--transition-normal), box-shadow var(--transition-normal);
}

.wedding-card::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: var(--color-primary-gradient);
  opacity: 0.9;
}

.wedding-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-warm-lg);
}

.wedding-card-gold {
  background: var(--color-bg-card);
  border: 2px solid var(--color-gold);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-gold);
}

/* ============================================
   毛玻璃卡片
   ============================================ */

.wedding-glass {
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: var(--glass-border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-warm);
}

/* ============================================
   按钮样式
   ============================================ */

.wedding-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-sm);
  padding: 12px 28px;
  border-radius: var(--radius-lg);
  font-family: var(--font-serif-display);
  font-weight: var(--font-semibold);
  font-size: var(--text-base);
  letter-spacing: 0.05em;
  border: none;
  cursor: pointer;
  transition: all var(--transition-normal);
  position: relative;
  overflow: hidden;
}

.wedding-btn-primary {
  background: var(--color-primary-gradient);
  color: var(--color-gold-light);
  box-shadow: var(--shadow-warm);
}

.wedding-btn-primary:hover {
  box-shadow: var(--shadow-warm-lg), var(--shadow-gold-glow);
  transform: translateY(-2px);
}

.wedding-btn-primary:active {
  transform: scale(0.95);
}

.wedding-btn-gold {
  background: var(--color-gold-gradient);
  color: var(--color-ink-black);
  box-shadow: var(--shadow-gold);
}

.wedding-btn-gold:hover {
  box-shadow: var(--shadow-gold-glow);
  transform: translateY(-2px);
}

.wedding-btn-outline {
  background: transparent;
  color: var(--color-primary);
  border: 2px solid var(--color-gold);
}

.wedding-btn-outline:hover {
  background: rgba(196, 30, 58, 0.05);
  border-color: var(--color-primary);
}

.wedding-btn-ghost {
  background: transparent;
  color: var(--color-gold);
}

.wedding-btn-ghost:hover {
  background: rgba(212, 168, 71, 0.1);
}

/* ============================================
   动画关键帧
   ============================================ */

@keyframes wedding-fadeUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes wedding-pulse {
  0%, 100% {
    opacity: 1;
    transform: scale(1);
  }
  50% {
    opacity: 0.7;
    transform: scale(1.05);
  }
}

@keyframes wedding-pulse-ring {
  0% {
    transform: scale(1);
    opacity: 0.8;
  }
  100% {
    transform: scale(1.8);
    opacity: 0;
  }
}

@keyframes wedding-shimmer {
  0% {
    background-position: -200% 0;
  }
  100% {
    background-position: 200% 0;
  }
}

@keyframes wedding-float {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-8px);
  }
}

@keyframes wedding-glow {
  0%, 100% {
    box-shadow: 0 0 20px rgba(212, 168, 71, 0.3);
  }
  50% {
    box-shadow: 0 0 40px rgba(212, 168, 71, 0.6);
  }
}

@keyframes wedding-countUp {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes wedding-ripple {
  to {
    transform: scale(4);
    opacity: 0;
  }
}

@keyframes wedding-celebrate {
  0% {
    transform: scale(0.5);
    opacity: 0;
  }
  50% {
    transform: scale(1.1);
    opacity: 1;
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}

@keyframes wedding-shake {
  0%, 100% { transform: translateX(0); }
  10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
  20%, 40%, 60%, 80% { transform: translateX(5px); }
}

@keyframes wedding-flashGreen {
  0%, 100% { background-color: transparent; }
  50% { background-color: rgba(46, 125, 91, 0.3); }
}

@keyframes wedding-flashRed {
  0%, 100% { background-color: transparent; }
  50% { background-color: rgba(196, 30, 58, 0.3); }
}

/* ============================================
   动画工具类
   ============================================ */

.animate-fadeUp {
  animation: wedding-fadeUp 0.4s ease-out both;
}

.animate-pulse {
  animation: wedding-pulse 2s ease-in-out infinite;
}

.animate-pulse-ring {
  animation: wedding-pulse-ring 2s ease-out infinite;
}

.animate-float {
  animation: wedding-float 3s ease-in-out infinite;
}

.animate-glow {
  animation: wedding-glow 2s ease-in-out infinite;
}

.animate-celebrate {
  animation: wedding-celebrate 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}

.animate-shake {
  animation: wedding-shake 0.5s ease-in-out;
}

/* ============================================
   表格样式
   ============================================ */

.wedding-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  border-radius: var(--radius-lg);
  overflow: hidden;
}

.wedding-table thead th {
  background: var(--color-primary-gradient-vertical);
  color: var(--color-text-on-primary);
  font-family: var(--font-serif-display);
  font-weight: var(--font-semibold);
  padding: 14px 16px;
  text-align: left;
  font-size: var(--text-sm);
  letter-spacing: 0.05em;
}

.wedding-table tbody td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--color-border);
  font-size: var(--text-sm);
  color: var(--color-ink);
}

.wedding-table tbody tr:nth-child(even) {
  background: rgba(212, 168, 71, 0.04);
}

.wedding-table tbody tr:hover {
  background: rgba(196, 30, 58, 0.04);
}

.wedding-table tbody tr:last-child td {
  border-bottom: none;
}

/* ============================================
   统计卡片
   ============================================ */

.wedding-stat-card {
  background: var(--color-bg-card);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-xl);
  padding: var(--space-lg);
  position: relative;
  overflow: hidden;
  transition: transform var(--transition-normal), box-shadow var(--transition-normal);
}

.wedding-stat-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-warm);
}

.wedding-stat-card .stat-number {
  font-family: var(--font-display-latin), var(--font-serif-display);
  font-size: var(--text-4xl);
  font-weight: var(--font-bold);
  line-height: 1;
  margin-bottom: var(--space-sm);
}

.wedding-stat-card .stat-label {
  font-family: var(--font-sans-body);
  font-size: var(--text-sm);
  color: var(--color-ink-muted);
}

.wedding-stat-card--red {
  background: var(--color-primary-gradient-vertical);
  color: white;
  border: none;
}

.wedding-stat-card--red .stat-number {
  color: var(--color-gold-light);
}

.wedding-stat-card--red .stat-label {
  color: rgba(255, 255, 255, 0.8);
}

.wedding-stat-card--gold {
  background: var(--color-gold-gradient-soft);
  border-color: var(--color-gold);
}

.wedding-stat-card--gold .stat-number {
  color: var(--color-primary);
}

/* ============================================
   进度环
   ============================================ */

.wedding-progress-ring {
  position: relative;
  width: 120px;
  height: 120px;
}

.wedding-progress-ring svg {
  transform: rotate(-90deg);
}

.wedding-progress-ring .ring-bg {
  stroke: rgba(212, 168, 71, 0.2);
  fill: none;
  stroke-width: 8;
}

.wedding-progress-ring .ring-fill {
  stroke: url(#goldGradient);
  fill: none;
  stroke-width: 8;
  stroke-linecap: round;
  transition: stroke-dashoffset 1s ease-out;
}

.wedding-progress-ring .ring-value {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-family: var(--font-display-latin);
  font-size: var(--text-2xl);
  font-weight: var(--font-bold);
  color: var(--color-primary);
}

/* ============================================
   时间线
   ============================================ */

.wedding-timeline {
  position: relative;
  padding-left: 32px;
}

.wedding-timeline::before {
  content: "";
  position: absolute;
  left: 11px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: linear-gradient(180deg, var(--color-gold) 0%, rgba(212, 168, 71, 0.3) 100%);
}

.wedding-timeline-item {
  position: relative;
  padding-bottom: var(--space-lg);
}

.wedding-timeline-item::before {
  content: "";
  position: absolute;
  left: -26px;
  top: 4px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--color-gold);
  border: 2px solid var(--color-bg-card);
  box-shadow: 0 0 0 2px var(--color-gold);
}

.wedding-timeline-item--active::before {
  background: var(--color-primary);
  box-shadow: 0 0 0 2px var(--color-primary), 0 0 12px rgba(196, 30, 58, 0.6);
  animation: wedding-pulse 2s ease-in-out infinite;
}

.wedding-timeline-item--pending::before {
  background: var(--color-ink-faint);
  box-shadow: 0 0 0 2px var(--color-ink-faint);
}

/* ============================================
   徽章/标签
   ============================================ */

.wedding-badge {
  display: inline-flex;
  align-items: center;
  padding: 4px 12px;
  border-radius: var(--radius-full);
  font-size: var(--text-xs);
  font-weight: var(--font-medium);
  font-family: var(--font-sans-body);
}

.wedding-badge--red {
  background: rgba(196, 30, 58, 0.1);
  color: var(--color-primary);
  border: 1px solid rgba(196, 30, 58, 0.2);
}

.wedding-badge--gold {
  background: rgba(212, 168, 71, 0.15);
  color: var(--color-gold-dark);
  border: 1px solid rgba(212, 168, 71, 0.3);
}

.wedding-badge--success {
  background: var(--state-success-light);
  color: var(--state-success);
  border: 1px solid rgba(46, 125, 91, 0.2);
}

.wedding-badge--warning {
  background: var(--state-warning-light);
  color: var(--state-warning);
  border: 1px solid rgba(217, 119, 6, 0.2);
}

/* ============================================
   输入框样式
   ============================================ */

.wedding-input {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid var(--color-border);
  border-radius: var(--radius-lg);
  font-family: var(--font-sans-body);
  font-size: var(--text-base);
  color: var(--color-ink);
  background: var(--color-bg-card);
  transition: all var(--transition-fast);
  outline: none;
}

.wedding-input:focus {
  border-color: var(--color-gold);
  box-shadow: 0 0 0 4px rgba(212, 168, 71, 0.15);
}

.wedding-input--gold {
  border-color: var(--color-gold);
  box-shadow: var(--shadow-gold);
}

.wedding-input--gold:focus {
  box-shadow: var(--shadow-gold-glow), 0 0 0 4px rgba(212, 168, 71, 0.2);
}

/* ============================================
   装饰元素
   ============================================ */

.wedding-corner-ornament {
  position: absolute;
  width: 40px;
  height: 40px;
  border: 2px solid var(--color-gold);
  opacity: 0.6;
}

.wedding-corner-ornament--tl {
  top: 12px;
  left: 12px;
  border-right: none;
  border-bottom: none;
}

.wedding-corner-ornament--tr {
  top: 12px;
  right: 12px;
  border-left: none;
  border-bottom: none;
}

.wedding-corner-ornament--bl {
  bottom: 12px;
  left: 12px;
  border-right: none;
  border-top: none;
}

.wedding-corner-ornament--br {
  bottom: 12px;
  right: 12px;
  border-left: none;
  border-top: none;
}

/* ============================================
   响应式工具
   ============================================ */

.wedding-container {
  max-width: var(--container-max);
  margin: 0 auto;
  padding: 0 var(--space-lg);
}

@media (max-width: 1024px) {
  .wedding-container {
    padding: 0 var(--space-md);
  }
}

@media (max-width: 768px) {
  .wedding-container {
    padding: 0 var(--space-sm);
  }
}

<body class="min-h-screen font-sans antialiased">
    <main class="relative w-full h-screen overflow-hidden" style="font-family: var(--font-sans-body);">

            <!-- 功能入口卡片 2x2 -->

                <!-- 婚礼流程 -->
                <button class="feature-card group">

        <!-- 右侧悬浮呼叫铃 -->

                <span class="call-pulse-ring" style="animation-delay: 2s;"></span>

                    <i data-lucide="bell-ring" class="w-10 h-10 md:w-12 md:h-12 text-white"></i>

            </button>
            <p class="mt-3 text-white font-medium tracking-wider text-center" style="font-family: var(--font-serif-display); font-size: 14px; text-shadow: 0 2px 8px rgba(0,0,0,0.6);">

        <!-- 底部导航条 -->
        <nav class="fixed bottom-0 left-0 right-0 z-30 px-4 pb-4 pt-2">

                 style="background: rgba(45, 42, 38, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(212, 168, 71, 0.25);">

                <button class="nav-item flex flex-col items-center gap-1 px-3 py-2 rounded-xl transition-all duration-300 hover:bg-white/5">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap');

        /* 背景轮播 */
        .bg-slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            animation: kenburns 16s ease-in-out infinite;
        }
        .bg-slide.active {
            opacity: 1;
            animation: kenburns 16s ease-in-out infinite, fadeInOut 16s ease-in-out infinite;
        }
        .bg-slide:nth-child(2) {
            animation: kenburns 16s ease-in-out infinite, fadeInOut 16s ease-in-out infinite 8s;
        }

        @keyframes kenburns {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        @keyframes fadeInOut {
            0%, 45%, 55%, 100% { opacity: 0; }
            5%, 50% { opacity: 1; }
        }

        .bg-slide.active {
            animation: kenburns 16s ease-in-out infinite;
        }

        /* 金色粒子 */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #D4A847;
            box-shadow: 0 0 8px #D4A847, 0 0 16px rgba(212, 168, 71, 0.5);
            animation: particleFloat 6s ease-in-out infinite;
        }

        @keyframes particleFloat {
            0%, 100% {
                opacity: 0.3;
                transform: translateY(0) scale(1);
            }
            50% {
                opacity: 1;
                transform: translateY(-20px) scale(1.3);
            }
        }

        /* 功能卡片 */
        .feature-card {
            position: relative;
            border-radius: 20px;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }

        .feature-card:hover {
            transform: translateY(-6px) scale(1.02);
        }

        .feature-card-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 24px 16px;
            border-radius: 20px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: all 0.3s ease;
            height: 100%;
        }

        .feature-card:hover .feature-card-inner {
            box-shadow: 0 0 30px rgba(212, 168, 71, 0.3);
        }

        .feature-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 16px;
        }

        .feature-text {
            font-family: var(--font-serif-display);
            font-weight: 600;
            font-size: 16px;
            letter-spacing: 0.1em;
        }

        /* 呼叫铃按钮 */
        .call-bell-btn {
            position: relative;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(145deg, #D94A63 0%, #C41E3A 50%, #9B172E 100%);
            border: 3px solid rgba(212, 168, 71, 0.8);
            box-shadow: 0 0 40px rgba(212, 168, 71, 0.5), 0 8px 30px rgba(196, 30, 58, 0.5), inset 0 2px 10px rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }

        .call-bell-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 60px rgba(212, 168, 71, 0.7), 0 12px 40px rgba(196, 30, 58, 0.6), inset 0 2px 10px rgba(255,255,255,0.2);
        }

        .call-bell-btn:active {
            transform: scale(0.95);
        }

        .call-bell-inner {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .call-pulse-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid rgba(212, 168, 71, 0.6);
            animation: callPulse 3s ease-out infinite;
        }

        @keyframes callPulse {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }
            100% {
                transform: scale(1.8);
                opacity: 0;
            }
        }

        /* 底部导航激活项 */
        .nav-item-active {
            background: linear-gradient(135deg, rgba(196, 30, 58, 0.8) 0%, rgba(155, 23, 46, 0.9) 100%);
            box-shadow: 0 4px 15px rgba(196, 30, 58, 0.4);
        }

        .nav-item-active i {
            color: #E8C77A !important;
        }

        /* 淡入动画 */
        .animate-fadeUp {
            animation: fadeUp 0.8s ease-out both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 减少动画偏好 */
        @media (prefers-reduced-motion: reduce) {
            .bg-slide, .bg-slide.active, .particle, .call-pulse-ring, .call-bell-btn, .feature-card, .animate-fadeUp {
                animation: none !important;
                transition: none !important;
            }
        }

        /* 横屏优化 */
        @media (orientation: landscape) and (max-height: 500px) {
            .feature-icon {
                width: 44px;
                height: 44px;
            }
            .feature-card-inner {
                padding: 16px 12px;
                gap: 8px;
            }
            .feature-text {
                font-size: 14px;
            }
        }
    </style>

    <script>
        // 更新当前时间
        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const timeEl = document.getElementById('current-time');
            if (timeEl) {
                timeEl.textContent = hours + ':' + minutes;
            }
        }
        updateTime();
        setInterval(updateTime, 60000);

        // 初始化图标
        lucide.createIcons();
    </script>
</body>
</html>
