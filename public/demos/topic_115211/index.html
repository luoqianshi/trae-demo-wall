<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知痛 - AI症状分析助手</title>
    <style>
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.3); opacity: 0.15; }
            100% { transform: scale(1); opacity: 0.3; }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #667eea, #764ba2); height: 100vh; overflow: hidden; transition: all 0.5s ease; }
        
        .welcome-page { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: white; text-align: center; }
        .welcome-page h1 { font-size: 48px; margin-bottom: 20px; }
        .welcome-page p { font-size: 18px; margin-bottom: 40px; opacity: 0.9; }
        .welcome-page button { padding: 15px 40px; font-size: 18px; border: none; border-radius: 30px; background: white; color: #667eea; font-weight: bold; cursor: pointer; transition: transform 0.3s; }
        .welcome-page button:hover { transform: scale(1.05); }
        
        .chat-container { display: none; flex-direction: column; height: 100vh; background: #f0f4f8; }
        
        .chat-header { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; position: relative; }
        .chat-header h1 { font-size: 20px; }
        .chat-header .exit-btn { padding: 5px 15px; border: 1px solid white; border-radius: 15px; background: transparent; color: white; cursor: pointer; font-size: 12px; }
        
        .chat-area { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; }
        
        .message { max-width: 80%; padding: 12px 16px; border-radius: 20px; margin-bottom: 12px; font-size: 14px; line-height: 1.6; position: relative; }
        .message.user { background: linear-gradient(135deg, #667eea, #764ba2); color: white; align-self: flex-end; margin-left: auto; border-bottom-right-radius: 5px; }
        .message.bot { background: white; color: #333; align-self: flex-start; border-bottom-left-radius: 5px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        
        .message-actions { display: flex; gap: 6px; margin-top: 8px; justify-content: flex-end; opacity: 0; transition: opacity 0.3s; }
        .message:hover .message-actions { opacity: 1; }
        .message-action-btn { border: none; background: rgba(0,0,0,0.1); padding: 5px 10px; border-radius: 12px; cursor: pointer; font-size: 12px; }
        .message-action-btn:hover { background: rgba(0,0,0,0.2); }
        
        .input-area { background: white; padding: 12px; border-top: 1px solid #ddd; display: flex; gap: 12px; }
        .input-area input { flex: 1; padding: 12px 18px; border-radius: 25px; border: 2px solid #ddd; outline: none; font-size: 14px; }
        .input-area input:focus { border-color: #667eea; }
        .input-area button { padding: 12px 24px; border-radius: 25px; border: none; background: linear-gradient(135deg, #667eea, #764ba2); color: white; font-size: 14px; cursor: pointer; font-weight: bold; }
        
        .symptom-card { background: #fff; border-radius: 12px; padding: 14px; margin-top: 10px; box-shadow: 0 1px 5px rgba(0,0,0,0.1); border-left: 4px solid #667eea; cursor: pointer; }
        .symptom-card:hover { box-shadow: 0 3px 10px rgba(0,0,0,0.15); }
        .symptom-card .name { font-weight: bold; font-size: 15px; color: #667eea; }
        .symptom-card .severity { font-size: 12px; margin-top: 5px; }
        .symptom-card .severity.severe { color: #ef4444; }
        .symptom-card .severity.moderate { color: #f59e0b; }
        .symptom-card .severity.mild { color: #22c55e; }
        .symptom-card .causes { font-size: 12px; margin-top: 5px; color: #555; }
        .symptom-card .advice { font-size: 12px; margin-top: 5px; color: #333; }
        
        .symptom-detail-page { display: none; flex-direction: column; height: 100vh; background: #e8f4f8; }
        
        .detail-header { background: linear-gradient(135deg, #4facfe, #00f2fe); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .detail-header h1 { font-size: 20px; }
        .detail-header button { padding: 8px 20px; border-radius: 20px; border: none; background: rgba(255,255,255,0.2); color: white; cursor: pointer; font-size: 14px; }
        
        .detail-content { flex: 1; padding: 20px; overflow-y: auto; }
        
        .body-image-container { text-align: center; margin-bottom: 20px; }
        .body-image-container img { max-width: 100%; height: auto; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        
        .legend { display: flex; justify-content: center; gap: 20px; margin-top: 15px; }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
        .legend-color { width: 15px; height: 15px; border-radius: 3px; }
        .legend-color.blue { background: #3b82f6; }
        .legend-color.green { background: #22c55e; }
        .legend-color.red { background: #ef4444; }
        .legend-color.pink { background: #ec4899; }
        
        .progress-bar-container { width: 100%; height: 8px; background: #ddd; border-radius: 4px; margin-bottom: 20px; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #4facfe, #00f2fe); width: 0%; transition: width 0.3s; }
        
        .emergency-alert { background: #fee2e2; border-left: 4px solid #ef4444; padding: 15px; border-radius: 8px; margin-bottom: 20px; color: #dc2626; font-weight: bold; }
        
        .detail-card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 3px 15px rgba(0,0,0,0.08); }
        .detail-card h3 { color: #4facfe; margin-bottom: 15px; font-size: 18px; }
        
        .info-row { margin-bottom: 12px; display: flex; flex-wrap: wrap; align-items: flex-start; }
        .info-label { font-weight: bold; color: #666; min-width: 80px; font-size: 14px; }
        .info-value { color: #333; font-size: 14px; flex: 1; }
        
        .organs-list, .muscles-list, .vessels-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .tag { background: #e0f2fe; color: #0369a1; padding: 5px 12px; border-radius: 15px; font-size: 12px; }
        .tag.muscle { background: #dcfce7; color: #166534; }
        .tag.vessel { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <div id="welcomePage" class="welcome-page">
        <div style="position: absolute; top: 20px; right: 20px;">
            <button onclick="setLanguage('zh')" id="langBtnZh" style="padding: 8px 16px; border-radius: 20px; border: 2px solid white; background: rgba(255,255,255,0.2); color: white; cursor: pointer; font-weight: bold;">中文</button>
            <button onclick="setLanguage('en')" id="langBtnEn" style="padding: 8px 16px; border-radius: 20px; border: 2px solid white; background: transparent; color: white; cursor: pointer; margin-left: 10px;">English</button>
        </div>
        <h1 id="welcomeTitle">知痛</h1>
        <p id="welcomeDesc">你的AI症状分析助手</p>
        <button onclick="enterChat()" id="enterBtn">进入知痛</button>
    </div>
    
    <div id="chatContainer" class="chat-container">
        <div class="chat-header">
            <h1 id="chatTitle">知痛 - AI症状分析助手</h1>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button onclick="setLanguage('zh')" id="chatLangBtnZh" style="padding: 5px 10px; border-radius: 15px; border: 1px solid white; background: rgba(255,255,255,0.2); color: white; cursor: pointer; font-size: 11px;">中文</button>
                <button onclick="setLanguage('en')" id="chatLangBtnEn" style="padding: 5px 10px; border-radius: 15px; border: 1px solid white; background: transparent; color: white; cursor: pointer; font-size: 11px;">English</button>
                <button class="exit-btn" onclick="exitChat()" id="exitBtn">退出</button>
            </div>
        </div>
        
        <div id="chatArea" class="chat-area">
            <div class="message bot" id="welcomeMessage">
                你好！我是知痛，你的AI症状分析助手。<br><br>
                直接描述你的症状，比如：<br>
                "我头疼还想吐"、"我走路时腿很疼"、"我肚子很疼"<br><br>
                我会立即帮你分析！
            </div>
        </div>
        
        <div class="input-area">
            <input type="text" id="chatInput" placeholder="输入症状或聊天..." onkeypress="if(event.key=='Enter')sendMessage()">
            <button onclick="sendMessage()" id="sendBtn">发送</button>
        </div>
    </div>
    
    <div id="symptomDetailPage" class="symptom-detail-page">

        function setLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            
            document.getElementById('welcomeTitle').textContent = t.welcomeTitle;
            document.getElementById('welcomeDesc').textContent = t.welcomeDesc;
            document.getElementById('enterBtn').textContent = t.enterBtn;
            document.getElementById('chatTitle').textContent = t.chatTitle;
            document.getElementById('exitBtn').textContent = t.exitBtn;
            document.getElementById('sendBtn').textContent = t.sendBtn;
            document.getElementById('chatInput').placeholder = t.placeholder;
            document.getElementById('welcomeMessage').innerHTML = t.welcomeMessage;
            
            document.getElementById('langBtnZh').style.background = lang === 'zh' ? 'rgba(255,255,255,0.2)' : 'transparent';
            document.getElementById('langBtnEn').style.background = lang === 'en' ? 'rgba(255,255,255,0.2)' : 'transparent';

            document.getElementById('adviceLabel').textContent = t.advice;
            document.getElementById('emergencyAlert').textContent = t.emergencyAlert;
            
            updateChatMessagesLanguage();
        }
        
        function updateChatMessagesLanguage() {
            const chatArea = document.getElementById('chatArea');
            const botMessages = chatArea.querySelectorAll('.message.bot');
            botMessages.forEach(msg => {
                if(msg.id !== 'welcomeMessage') {
                    const userText = msg.getAttribute('data-user-text');
                    if(userText) {
                        const reply = analyzeText(userText);
                        const actions = msg.querySelector('.message-actions');
                        msg.innerHTML = reply + (actions ? actions.outerHTML : '');
                    }
                }
            });
        }
        
        function checkIntent(text) {
            for(let word of greetings) { if(text.includes(word)) return 'greeting'; }
            for(let word of thanks) { if(text.includes(word)) return 'thanks'; }
            for(let word of howAreYou) { if(text.includes(word)) return 'howareyou'; }
            for(let word of whatCanDo) { if(text.includes(word)) return 'whatcando'; }
            for(let word of goodbye) { if(text.includes(word)) return 'goodbye'; }
            for(let word of askHelp) { if(text.includes(word)) return 'askhelp'; }
            for(let word of confirm) { if(text.includes(word)) return 'confirm'; }
            
            const symptomWords = ['疼', '痛', '痒', '难受', '不舒服', '头晕', '恶心', '发烧', '发热', '咳嗽', '流鼻涕', '拉肚子', '便秘'];
            for(let word of symptomWords) { if(text.includes(word)) return 'symptom'; }
            
            return 'unknown';
        }
        
        function findSymptoms(text) {
            const found = [];
            const checked = new Set();
            for(let kw in symptomKeywords) {
                if(checked.has(kw)) continue;
                if(text.includes(kw)) {
                    found.push(symptomKeywords[kw]);
                    checked.add(kw);
                }
            }
            return found;
        }
        
        function analyzeText(text) {
            const intent = checkIntent(text);
            const found = findSymptoms(text);
            const t = translations[currentLang];
            
            switch(intent) {
                case 'greeting':
                    return t.greeting;
                case 'thanks':
                    return t.thanks;
                case 'howareyou':
                    return t.howareyou;
                case 'whatcando':
                    return t.whatcando;
                case 'goodbye':
                    return t.goodbye;
                case 'askhelp':
                    if(found.length > 0) return formatSymptoms(found);
                    return t.askhelp;
                case 'confirm':
                    return t.confirm;
                case 'symptom':
                    if(found.length > 0) return formatSymptoms(found);
                    return t.symptomNoInfo;
                default:
                    if(found.length > 0) return formatSymptoms(found);
                    return t.unknown;
            }
        }
        
        function formatSymptoms(symptoms) {
            let html = '';
            const t = translations[currentLang];
            const sv = severityText[currentLang];
            const severityLabel = currentLang === 'zh' ? '严重等级：' : 'Severity: ';
            const causesLabel = currentLang === 'zh' ? '可能原因：' : 'Possible Causes: ';
            const adviceLabel = currentLang === 'zh' ? '建议方案：' : 'Recommended Actions: ';
            
            symptoms.forEach((s, index) => {
                const langData = s[currentLang];
                const severityText = sv[s.severity];
                const severityClass = s.severity;
                html += `<div class="symptom-card" onclick="showSymptomDetail(${index})">
                    <div class="name">${langData.name}</div>
                    <div class="severity ${severityClass}">${severityLabel}${severityText}</div>
                    <div class="causes">${causesLabel}${langData.causes.join(currentLang === 'zh' ? '、' : ', ')}</div>
                    <div class="advice">${adviceLabel}${langData.advice.join(currentLang === 'zh' ? '、' : ', ')}</div>
                </div>`;
            });
            return html;
        }
        
        let currentSymptoms = [];
        
        function showSymptomDetail(index) {
            const symptom = currentSymptoms[index];
            if(!symptom) return;
            
            const langData = symptom[currentLang];
            document.getElementById('detailName').textContent = langData.name;
            
            const sv = severityText[currentLang][symptom.severity];
            document.getElementById('detailSeverity').textContent = sv;
            document.getElementById('detailSeverity').style.color = symptom.severity === 'severe' ? '#ef4444' : symptom.severity === 'moderate' ? '#f59e0b' : '#22c55e';
            
            const organsContainer = document.getElementById('detailOrgans');
            organsContainer.innerHTML = '';
            (langData.organs || []).forEach(o => {
                const tag = document.createElement('span');
                tag.className = 'tag';
                tag.textContent = o;
                organsContainer.appendChild(tag);
            });
            
            const musclesContainer = document.getElementById('detailMuscles');
            musclesContainer.innerHTML = '';
            (langData.muscles || []).forEach(m => {
                const tag = document.createElement('span');
                tag.className = 'tag muscle';
                tag.textContent = m;
                musclesContainer.appendChild(tag);
            });
            
            const vesselsContainer = document.getElementById('detailVessels');
            vesselsContainer.innerHTML = '';
            (langData.vessels || []).forEach(v => {
                const tag = document.createElement('span');
                tag.className = 'tag vessel';
                tag.textContent = v;
                vesselsContainer.appendChild(tag);
            });
            
            document.getElementById('detailCauses').textContent = langData.causes.join(currentLang === 'zh' ? '、' : ', ');
            document.getElementById('detailAdvice').textContent = langData.advice.join(currentLang === 'zh' ? '、' : ', ');
            
            document.getElementById('emergencyAlert').style.display = symptom.severity === 'severe' ? 'block' : 'none';
            
            highlightSymptomArea(langData.organs || []);
            
            const progressBar = document.getElementById('progressBar');
            progressBar.style.width = '0%';
            let progress = 0;
            const interval = setInterval(() => {
                progress += 5;
                progressBar.style.width = progress + '%';
                if(progress >= 100) {
                    clearInterval(interval);
                }
            }, 50);
            
            document.getElementById('chatContainer').style.display = 'none';
            document.getElementById('symptomDetailPage').style.display = 'flex';
        }
        
        function highlightSymptomArea(organs) {
            const svg = document.querySelector('.body-image-container svg');

                'Whole body': { x: 200, y: 250, r: 80 }

            organs.forEach(organ => {
                const pos = positions[organ];
                if(pos) {
                    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    circle.setAttribute('cx', pos.x);

                    circle.setAttribute('r', pos.r);

                    circle.setAttribute('class', 'symptom-circle');
                    circle.setAttribute('style', 'animation: pulse 2s infinite;');
                    svg.appendChild(circle);
                    
                    const glow = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    glow.setAttribute('cx', pos.x);
                    glow.setAttribute('cy', pos.y);
                    glow.setAttribute('r', pos.r);
                    glow.setAttribute('fill', '#3b82f6');
                    glow.setAttribute('opacity', '0.15');
                    glow.setAttribute('class', 'symptom-circle');
                    glow.setAttribute('style', 'animation: pulse 2s infinite; animation-delay: 0.5s;');
                    svg.appendChild(glow);
                }
            });
        }
        
        function backToChat() {
            document.getElementById('symptomDetailPage').style.display = 'none';
            document.getElementById('chatContainer').style.display = 'flex';
        }
        
        function speak(text) {
            if('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text.replace(/<[^>]*>/g, ''));
                utterance.lang = currentLang === 'zh' ? 'zh-CN' : 'en-US';
                utterance.rate = 1;
                window.speechSynthesis.speak(utterance);
            }
        }
        
        function addMessage(text, isUser, userText) {
            const chatArea = document.getElementById('chatArea');
            const msg = document.createElement('div');
            msg.className = `message ${isUser ? 'user' : 'bot'}`;
            msg.innerHTML = text;
            if(!isUser && userText) {
                msg.setAttribute('data-user-text', userText);
            }
            
            const actions = document.createElement('div');
            actions.className = 'message-actions';
            
            const speakBtn = document.createElement('button');
            speakBtn.className = 'message-action-btn';
            speakBtn.innerHTML = '🔊';
            speakBtn.title = currentLang === 'zh' ? '语音播放' : 'Speak';
            speakBtn.onclick = (e) => {
                e.stopPropagation();
                speak(text);
            };
            
            const copyBtn = document.createElement('button');
            copyBtn.className = 'message-action-btn';
            copyBtn.innerHTML = '📋';
            copyBtn.title = currentLang === 'zh' ? '复制' : 'Copy';
            copyBtn.onclick = (e) => {
                e.stopPropagation();
                navigator.clipboard.writeText(text.replace(/<[^>]*>/g, '')).then(() => {
                    copyBtn.innerHTML = '✓';
                    setTimeout(() => copyBtn.innerHTML = '📋', 1500);
                });
            };
            
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'message-action-btn';
            deleteBtn.innerHTML = '✕';
            deleteBtn.title = currentLang === 'zh' ? '删除' : 'Delete';
            deleteBtn.onclick = (e) => {
                e.stopPropagation();
                msg.style.opacity = '0';
                setTimeout(() => msg.remove(), 300);
            };
            
            actions.appendChild(speakBtn);
            actions.appendChild(copyBtn);
            actions.appendChild(deleteBtn);
            msg.appendChild(actions);
            
            chatArea.appendChild(msg);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if(!text) return;
            
            input.value = '';
            addMessage(text, true);
            
            const found = findSymptoms(text);
            currentSymptoms = found;
            
            const reply = analyzeText(text);
            addMessage(reply, false, text);
            speak(reply);
            
            if(found.length > 0) {
                setTimeout(() => {
                    showSymptomDetail(0);
                }, 500);
            }
        }
        
        function enterChat() {
            document.getElementById('welcomePage').style.display = 'none';
            document.getElementById('chatContainer').style.display = 'flex';
        }
        
        function exitChat() {
            document.getElementById('chatContainer').style.display = 'none';
            document.getElementById('symptomDetailPage').style.display = 'none';
            document.getElementById('welcomePage').style.display = 'flex';
        }
