  clues: [
    { room: '书房', title: '碎裂的咖啡杯', text: '书房的地板上有一只摔碎的咖啡杯，杯子旁散落着几张纸，像是被人匆忙翻阅过。桌上的文件柜第二层明显被人动过——那里原本放着公司最新季度的财务报表。' },

  debates: [
    [
      { speakerId: 's1', text: '咖啡杯碎了？那可能是任何人——保洁阿姨每天晚上都会去书房泡咖啡。别把什么小意外都往案件上扯。' },
      { speakerId: 's2', text: '张总，您说保洁阿姨？可监控显示保洁晚上八点就离开了。而且那个杯子旁散落的纸张上明显有文件柜的标签。' },
      { speakerId: 's3', text: '我查了实验室的访问系统，案发当天书房区域没有录入任何异常刷卡记录。不过文件柜是机械锁，不走系统，这倒是个漏洞。' },
      { speakerId: 's1', text: '机械锁怎么了？几十年的老锁具，谁都能撬开。你们与其盯着一个咖啡杯，不如去查查那个模糊的监控影像。' },

    [

      { speakerId: 's3', text: '等等，我注意到一个细节。那个身影抱的东西轮廓不小，应该是一份厚文件或者档案袋。普通偷窃不会拿这种东西。' },
      { speakerId: 's2', text: '那是你的解读！也许那个人只是拿了个包裹而已。再说，监控画面那么糊，你怎么确定就是深蓝色？' },
      { speakerId: 's3', text: '我虽然出差在外，但远程调取了实验室的访客系统日志。那天晚上有一张未登记的门禁卡刷了实验室的门……实验室电脑上的指纹，也许能说明一切。' }

    [

      { speakerId: 's1', text: '临时访客？谁会深夜跑到实验室去搜"财务报表 加密算法"？这明显是有预谋的！而且你是技术总监，最有能力绕过安保系统。' },
      { speakerId: 's2', text: '王总监虽然掌握系统权限，但他确实有出差记录。反过来说，知道实验室电脑能查到加密信息的，不一定是技术人员吧？' },
      { speakerId: 's3', text: '搜索记录显示是案发前一周开始的，说明此人提前做了功课。但你们注意到没有——电脑浏览器记录被部分清理过，只留下了搜索引擎的缓存。' },
      { speakerId: 's1', text: '部分清理？那更可疑了。清理的人既想销毁证据，又不够彻底留下尾巴。这种矛盾的手法，花园里或许留下了更直接的证据。' }

      { speakerId: 's2', text: '范围窄又怎样？五十双里随便一个都可以是嫌疑人。张总您与其盯着我，不如解释一下为什么您上周突然在公司后门安装了那个私人摄像头？' },
      { speakerId: 's1', text: '那是我为了防小偷装的私人安保设备，跟案件有什么关系？倒是你，对后门的监控布局这么了解，很可疑啊。' },
      { speakerId: 's3', text: '脚印延伸到花园后门，说明此人从窗户翻出后走了后门逃离。如果当时后门附近停了车，车库里的行车记录仪可能拍到了什么。' }
    ],
    [
      { speakerId: 's3', text: '行车记录仪？我出差根本不开车，那东西跟我毫无关系。而且怎么会在车库里？谁放在那里的？' },

      { speakerId: 's2', text: '你们都别争了。那台行车记录仪……我看了一眼，那辆黑色轿车确实眼熟。但我不能确定是谁的车。不过视频时间是 23:50，那时候我应该在会议室。' },

      { speakerId: 's1', text: '嫁祸？你倒是越描越黑了。一个无辜的人不会急于解释巧合。' },

var state = {
  phase:'setup', setupTodos:[], deadline:'21:00', deadlineModifyLeft:2,
  expanded:false, currentTab:'clues', gameTodos:[], completedTodos:{},
  unlockedClues:{}, selectedSuspect:null, suspectDialogs:{},

  danmakuTimer:null, expandedClues:{},
  debateQueue: []
};

function getSuspectById(id) { return CASE_DATA.suspects.find(function(s){return s.id===id;}); }

/* ====== Clock ====== */
function updateClock(){var n=new Date(),d=['日','一','二','三','四','五','六'];var e=document.getElementById('clock');if(e)e.textContent='\u5468'+d[n.getDay()]+' '+String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');}
updateClock();setInterval(updateClock,30000);

/* ====== Setup ====== */
function addSetupTodo(){var i=document.getElementById('todoInput'),v=i.value.trim();if(!v||state.setupTodos.length>=7)return;state.setupTodos.push(v);i.value='';renderSetupList();i.focus();}
function removeSetupTodo(idx){state.setupTodos.splice(idx,1);renderSetupList();}
function renderSetupList(){var l=document.getElementById('setupList'),c=document.getElementById('setupCount'),b=document.getElementById('startBtn'),h='';state.setupTodos.forEach(function(t,i){h+='<div class="setup-added-item"><span>'+t+'</span><button class="remove-btn" onclick="removeSetupTodo('+i+')">x</button></div>';});l.innerHTML=h;c.textContent='\u5df2\u6dfb\u52a0 '+state.setupTodos.length+' \u9879\u4efb\u52a1'+(state.setupTodos.length<3?'\uff08\u81f3\u5c11\u9700\u8981 3 \u9879\uff09':'');b.disabled=state.setupTodos.length<3;}

/* ====== Build Case Intro HTML ====== */
function buildCaseIntroHTML(){var h='';h+='<div class="case-intro-subtitle">第 1 案 · 卷宗 NO.001</div>';h+='<div class="case-intro-title">'+CASE_DATA.title+'</div>';h+='<div class="case-intro-body">'+CASE_DATA.caseIntro+'</div>';h+='<div class="case-intro-tasks-title">侦探须知</div>';h+='<div style="font-size:0.72rem;color:var(--muted);line-height:1.7;margin-bottom:0.4rem">完成每一项待办，即可解锁对应地点的线索。在 '+state.deadline+' 之前，指认真凶：</div>';state.gameTodos.forEach(function(t){h+='<div class="case-intro-task-item">· '+t.label+' <span class="case-intro-task-room">—— '+t.room+'</span></div>';});h+='<div style="margin-top:1.2rem;text-align:center"><button class="btn btn-primary" onclick="enterInvestigation()">进入调查</button></div>';return h;}

function buildDossierHTML(){var h='';h+='<div class="dossier-overlay-subtitle">第 1 案 · 卷宗回看</div>';h+='<div class="dossier-overlay-title">'+CASE_DATA.title+'</div>';h+='<div class="dossier-overlay-body">'+CASE_DATA.caseIntro+'</div>';h+='<div class="dossier-overlay-tasks-title">线索地图</div>';state.gameTodos.forEach(function(t){h+='<div class="dossier-overlay-task-item">· '+t.label+' <span class="dossier-overlay-task-room">—— '+t.room+'</span></div>';});h+='<div class="dossier-overlay-close-hint">点击任意位置或按 ESC 关闭</div>';return h;}

/* ====== Start Game ====== */
function startGame(){if(state.setupTodos.length<3)return;state.deadline=document.getElementById('deadlineHour').value+':00';state.phase='intro';state.gameTodos=state.setupTodos.map(function(label,i){var cl=CASE_DATA.clues[i];return{id:i,label:label,room:cl.room,hasClue:true};});if(state.gameTodos.length>5)state.remainingQuestions=15;/* hide setup, show case intro */document.getElementById('setupScreen').classList.remove('active');document.getElementById('setupScreen').style.display='none';document.getElementById('caseSubtitle').textContent='第 1 案 · '+CASE_DATA.title;var introScreen=document.getElementById('caseIntroScreen');introScreen.innerHTML=buildCaseIntroHTML();introScreen.style.display='';introScreen.classList.add('active');}

/* ====== Enter Investigation ====== */
function enterInvestigation(){state.phase='playing';document.getElementById('caseIntroScreen').classList.remove('active');document.getElementById('caseIntroScreen').style.display='none';document.getElementById('bodyCollapsed').style.display='block';document.getElementById('caseSubtitle').textContent='\u7b2c 1 \u6848 \u00b7 \u6d88\u5931\u7684\u6587\u4ef6';document.getElementById('deadlineTag').style.display='inline';document.getElementById('deadlineTag').textContent=state.deadline;document.getElementById('caseBrief').style.display='block';renderCollapsedTodos();renderExpandedTodos();switchTab('clues');startDanmaku();}

/* ====== Dossier ====== */
function showDossier(){var o=document.getElementById('dossierOverlay');o.innerHTML=buildDossierHTML();o.classList.add('active');}
function hideDossier(){document.getElementById('dossierOverlay').classList.remove('active');}
document.addEventListener('keydown',function(e){if(e.key==='Escape'){hideDossier();hideDeadlineModal();}});

/* ====== Drag ====== */
var dragState={dragging:false,startX:0,startY:0,startLeft:0,startTop:0};
function startDrag(e){if(e.target.closest('.titlebar-btn')||e.target.closest('.titlebar-deadline'))return;var w=document.getElementById('app');dragState.dragging=true;dragState.startX=e.clientX;dragState.startY=e.clientY;dragState.startLeft=w.offsetLeft;dragState.startTop=w.offsetTop;e.preventDefault();}
document.addEventListener('mousemove',function(e){if(!dragState.dragging)return;var w=document.getElementById('app');w.style.left=(dragState.startLeft+e.clientX-dragState.startX)+'px';w.style.top=(dragState.startTop+e.clientY-dragState.startY)+'px';});
document.addEventListener('mouseup',function(){dragState.dragging=false;});
function handleTitlebarClick(e){if(Math.abs(e.clientX-dragState.startX)>4||Math.abs(e.clientY-dragState.startY)>4)return;if(e.target.closest('.titlebar-btn')||e.target.closest('.titlebar-deadline'))return;toggleExpand();}

/* ====== Expand / Collapse ====== */
function toggleExpand(){if(state.phase!=='playing')return;state.expanded=!state.expanded;var bc=document.getElementById('bodyCollapsed'),be=document.getElementById('bodyExpanded'),btn=document.getElementById('expandBtn'),dr=document.getElementById('dossierRow');if(state.expanded){bc.style.display='none';be.classList.add('active');btn.textContent='\u25be';dr.style.display='block';document.getElementById('app').classList.add('expanded-mode');}else{bc.style.display='block';be.classList.remove('active');btn.textContent='\u25b8';dr.style.display='none';document.getElementById('app').classList.remove('expanded-mode');}}

/* ====== Render Todos ====== */
function renderCollapsedTodos(){var c=document.getElementById('collapsedTodos'),h='';state.gameTodos.forEach(function(t){var d=state.completedTodos[t.id],u=state.unlockedClues[t.id];h+='<div class="collapsed-todo '+(d?'done':'')+'" onclick="completeTodo('+t.id+')"><span class="todo-checkbox">'+(d?'\u2713':'')+'</span><span>'+t.label+'</span><span class="todo-room-tag '+(u?'unlocked':'')+'">'+(u?'\u2726 '+t.room:t.room)+'</span></div>';});c.innerHTML=h;}
function renderExpandedTodos(){var c=document.getElementById('todoListExpanded'),h='';state.gameTodos.forEach(function(t){var d=state.completedTodos[t.id],u=state.unlockedClues[t.id];h+='<div class="todo-item '+(d?'done':'')+'" onclick="completeTodo('+t.id+')"><span class="todo-checkbox">'+(d?'\u2713':'')+'</span><div class="todo-item-content"><div class="todo-item-label">'+t.label+'</div><div class="todo-item-meta">'+(u?'\u2726 '+t.room+' \u00b7 \u7ebf\u7d22\u5df2\u89e3\u9501':t.room+' \u00b7 \u672a\u89e3\u9501')+'</div></div></div>';});c.innerHTML=h;}

/* ====== Complete Todo (unlock clue) ====== */
function completeTodo(id){if(state.completedTodos[id])return;state.completedTodos[id]=true;var t=state.gameTodos.find(function(t){return t.id===id;});if(t&&!state.unlockedClues[id]){state.unlockedClues[id]=true;var clue=CASE_DATA.clues[id];var debateLines=CASE_DATA.debates[id]||[];injectDebateIntoDanmaku(debateLines);showClueToast(clue);if(state.expanded){switchTab('clues');state.expandedClues[id]=true;setTimeout(function(){var card=document.getElementById('clue-card-'+id);if(card)card.scrollIntoView({behavior:'smooth',block:'center'});},100);}}renderCollapsedTodos();renderExpandedTodos();if(state.currentTab==='clues')switchTab('clues');}

function injectDebateIntoDanmaku(lines){if(!lines||!lines.length)return;lines.forEach(function(l){var s=getSuspectById(l.speakerId);if(s)state.debateQueue.push({speaker:s.name,text:l.text});});}

function showClueToast(clue){var t=document.getElementById('clueToast');document.getElementById('toastTitle').textContent='\u2726 \u65b0\u7ebf\u7d22\u89e3\u9501 \u00b7 '+clue.room;document.getElementById('toastBody').textContent=clue.title+'\uff1a'+clue.text.substring(0,50)+'...';t.classList.add('active');setTimeout(function(){t.classList.remove('active');},4000);}

/* ====== Tabs ====== */
function switchTab(tab){state.currentTab=tab;var tabs=document.querySelectorAll('.panel-tab'),names=['clues','suspects','detect'];tabs.forEach(function(t,i){t.classList.toggle('active',names[i]===tab);});var c=document.getElementById('panelContent');if(tab==='clues')renderClues(c);else if(tab==='suspects')renderSuspects(c);else renderDetect(c);}

function toggleClue(id){state.expandedClues[id]=!state.expandedClues[id];var b=document.getElementById('clue-body-'+id),tg=document.getElementById('clue-toggle-'+id);if(b)b.classList.toggle('open',state.expandedClues[id]);if(tg)tg.classList.toggle('open',state.expandedClues[id]);}

/* ====== Render Clues with Debate (inside clue-text-body) ====== */
function renderClues(c){var h='',uc=Object.keys(state.unlockedClues).length;state.gameTodos.forEach(function(t){var cl=CASE_DATA.clues[t.id],u=state.unlockedClues[t.id];if(u){var o=state.expandedClues[t.id];var debateLines=CASE_DATA.debates[t.id]||[];h+='<div class="clue-card" id="clue-card-'+t.id+'">';h+='<div class="clue-header" onclick="toggleClue('+t.id+')"><span class="clue-room">'+cl.room+'</span><span class="clue-title">'+cl.title+'</span><span class="clue-toggle '+(o?'open':'')+'" id="clue-toggle-'+t.id+'">&#9654;</span></div>';h+='<div class="clue-text-body '+(o?'open':'')+'" id="clue-body-'+t.id+'">';h+=cl.text;if(debateLines.length>0){h+='<div class="debate-block" id="debate-block-'+t.id+'">';h+='<div class="debate-title">\u6848\u60c5\u4ea4\u6d41</div>';debateLines.forEach(function(d,i){var su=getSuspectById(d.speakerId);var col=su?su.color:'#888';var name=su?su.name:'???';h+='<div class="debate-entry">';h+='<span class="debate-speaker-dot" style="background:'+col+'"></span>';h+='<span class="debate-speaker-name" style="color:'+col+'">'+name+'</span>';h+='<span class="debate-text">'+d.text+'</span>';h+='</div>';});h+='</div>';}h+='</div>';h+='</div>';}else{h+='<div class="clue-card locked-clue"><div class="clue-header"><span class="clue-lock-icon">\ud83d\udd12</span><span class="clue-title" style="color:var(--muted)">\u5b8c\u6210\u300c'+t.label+'\u300d\u89e3\u9501</span></div></div>';}});if(uc===0){h='<div style="text-align:center;padding:2rem 0"><div style="font-size:1.5rem;margin-bottom:0.5rem;opacity:0.3">\ud83d\udd12</div><div style="font-size:0.8rem;color:var(--muted)">\u5b8c\u6210\u5f85\u529e\u4efb\u52a1\u4ee5\u89e3\u9501\u7ebf\u7d22</div></div>';}c.innerHTML=h;}

/* ====== Suspects ====== */
function renderSuspects(c){var h='';CASE_DATA.suspects.forEach(function(s){var a=state.selectedSuspect===s.id;h+='<div class="suspect-card '+(a?'active':'')+'" onclick="selectSuspect(\''+s.id+'\')"><div class="suspect-header"><div class="suspect-avatar" style="background:'+s.color+'">'+s.initial+'</div><div><div class="suspect-name">'+s.name+'</div><div class="suspect-role">'+s.role+'</div></div></div><div class="suspect-desc">'+s.desc+'</div></div>';});
var all=[];CASE_DATA.suspects.forEach(function(s){(state.suspectDialogs[s.id]||[]).forEach(function(d){all.push({s:s,t:d});});});
if(all.length>0){h+='<div class="dialog-section"><div class="dialog-section-title">\u5168\u90e8\u5bf9\u8bdd\u8bb0\u5f55</div><div class="dialog-history">';all.forEach(function(d){h+='<div class="dialog-entry"><div class="dialog-speaker" style="color:'+d.s.color+'">'+d.s.name+'\uff08'+d.s.role+'\uff09</div><div class="dialog-bubble">'+d.t+'</div></div>';});h+='</div></div>';}
if(state.selectedSuspect){var su=CASE_DATA.suspects.find(function(s){return s.id===state.selectedSuspect;}),hi=state.suspectDialogs[su.id]||[];h+='<div class="dialog-section" style="border-top:2px solid var(--accent);margin-top:0.8rem"><div class="dialog-section-title">\u5ba1\u8baf '+su.name+'</div>';if(hi.length>0){h+='<div class="dialog-history" style="max-height:120px;margin-bottom:0.5rem">';hi.forEach(function(d){h+='<div class="dialog-entry"><div class="dialog-speaker" style="color:'+su.color+'">'+su.name+'</div><div class="dialog-bubble">'+d+'</div></div>';});h+='</div>';}h+='<div class="question-input-row"><input type="text" class="question-input" id="questionInput" placeholder="\u8f93\u5165\u4f60\u7684\u8ffd\u95ee..." onkeydown="if(event.key===\'Enter\')askQuestion()"><button class="btn" onclick="askQuestion()">\u8ffd\u95ee</button></div><div class="remaining-questions">\u5269\u4f59\u8ffd\u95ee\u6b21\u6570\uff1a'+state.remainingQuestions+'</div></div>';}
c.innerHTML=h;var inp=document.getElementById('questionInput');if(inp)inp.focus();}
function selectSuspect(id){state.selectedSuspect=id;switchTab('suspects');}
function askQuestion(){if(state.remainingQuestions<=0)return;var inp=document.getElementById('questionInput');if(!inp||!inp.value.trim())return;state.remainingQuestions--;var sid=state.selectedSuspect,r=mockResponses[sid];if(!state.suspectDialogs[sid])state.suspectDialogs[sid]=[];state.suspectDialogs[sid].push(r[state.suspectDialogs[sid].length%r.length]);switchTab('suspects');}

/* ====== Detect ====== */
function renderDetect(c){var ad=state.gameTodos.every(function(t){return state.completedTodos[t.id];}),uc=Object.keys(state.unlockedClues).length,h='<div class="detect-panel"><div class="detect-title">\u6307\u8ba4\u51f6\u624b</div>';h+='<div class="detect-desc">'+(ad?'\u6240\u6709\u7ebf\u7d22\u5df2\u89e3\u9501\u3002\u6839\u636e\u4f60\u6536\u96c6\u7684\u8bc1\u636e\uff0c\u9009\u62e9\u4f60\u8ba4\u4e3a\u7684\u51f6\u624b\u3002':'\u5df2\u89e3\u9501 '+uc+'/'+state.gameTodos.length+' \u6761\u7ebf\u7d22\u3002\u7ebf\u7d22\u8d8a\u591a\uff0c\u63a8\u7406\u8d8a\u51c6\u786e\u3002')+'</div>';h+='<div class="detect-grid">';CASE_DATA.suspects.forEach(function(s){h+='<div class="detect-card '+(state.accusedSuspect===s.id?'selected':'')+'" onclick="selectAccused(\''+s.id+'\')"><div class="detect-avatar" style="background:'+s.color+'">'+s.initial+'</div><div class="detect-name">'+s.name+'</div><div style="font-size:0.6rem;color:var(--muted);margin-top:0.15rem">'+s.role+'</div></div>';});h+='</div><button class="btn btn-danger" onclick="confirmAccuse()" '+(state.accusedSuspect?'':'disabled')+' style="padding:0.6rem 2rem;font-size:0.85rem">\u786e\u8ba4\u6307\u8ba4</button></div>';c.innerHTML=h;}
function selectAccused(id){state.accusedSuspect=id;renderDetect(document.getElementById('panelContent'));}
function confirmAccuse(){if(!state.accusedSuspect)return;var ok=state.accusedSuspect===CASE_DATA.murderer,ad=state.gameTodos.every(function(t){return state.completedTodos[t.id];}),o=document.getElementById('resultOverlay');document.getElementById('resultIcon').textContent=ok?'\u2726':'!';document.getElementById('resultTitle').textContent=ok?'\u63a8\u7406\u6b63\u786e':'\u6307\u8ba4\u5931\u8d25';document.getElementById('resultTitle').style.color=ok?'var(--accent)':'var(--accent2)';if(ok){document.getElementById('resultText').textContent='\u4f60\u6210\u529f\u9501\u5b9a\u4e86\u51f6\u624b\uff01\u771f\u76f8\u968f\u4e4b\u63ed\u5f00\u3002\n\n'+CASE_DATA.truth;}else{if(ad){document.getElementById('resultText').textContent='\u51f6\u624b\u8d81\u4e71\u9003\u8131\u4e86\u3002\u4e0d\u8fc7\uff0c\u65e2\u7136\u4f60\u62ff\u5230\u4e86\u6240\u6709\u7ebf\u7d22\uff0c\u771f\u76f8\u4ecd\u7136\u53ef\u4ee5\u8fd8\u539f\uff1a\n\n'+CASE_DATA.truth;}else{document.getElementById('resultText').textContent='\u51f6\u624b\u5728\u95e8\u540e\u6ce8\u89c6\u7740\u4f60\u79bb\u53bb\u7684\u80cc\u5f71\uff0c\u8d70\u5eca\u91cc\u56de\u8361\u7740\u4e00\u58f0\u8f7b\u7b11\u3002\u771f\u76f8\uff0c\u5c31\u6b64\u5c01\u5165\u9ed1\u6697\u3002';}}o.classList.add('active');}

/* ====== Deadline ====== */
function showDeadlineModal(){if(state.deadlineModifyLeft<=0)return;var s=document.getElementById('modalDeadlineHour');s.innerHTML='';for(var h=18;h<=24;h++){var o=document.createElement('option');o.value=h;o.textContent=h+':00';if(parseInt(state.deadline)===h)o.selected=true;s.appendChild(o);}document.getElementById('modifyRemain').textContent=state.deadlineModifyLeft;document.getElementById('deadlineModal').classList.add('active');}
function hideDeadlineModal(){document.getElementById('deadlineModal').classList.remove('active');}
function confirmDeadline(){if(state.deadlineModifyLeft<=0)return;state.deadline=document.getElementById('modalDeadlineHour').value+':00';state.deadlineModifyLeft--;document.getElementById('deadlineTag').textContent=state.deadline;hideDeadlineModal();}

/* ====== Danmaku ====== */
function startDanmaku(){var sp=document.getElementById('danmakuSpeaker'),tx=document.getElementById('danmakuText');function showNext(){var d;if(state.debateQueue.length>0){d=state.debateQueue.shift();}else{d=danmakuPool[state.danmakuIndex%danmakuPool.length];state.danmakuIndex++;}sp.textContent=d.speaker;sp.style.color='';var su=CASE_DATA.suspects.find(function(s){return s.name===d.speaker;});if(su)sp.style.color=su.color;tx.style.animation='none';void tx.offsetHeight;tx.textContent=d.text;tx.style.animation='danmaku-in 0.5s ease-out';}showNext();state.danmakuTimer=setInterval(showNext,6000);}

/* ====== Reset ====== */
function resetDemo(){state.phase='setup';state.setupTodos=[];state.deadline='21:00';state.deadlineModifyLeft=2;state.expanded=false;state.currentTab='clues';state.gameTodos=[];state.completedTodos={};state.unlockedClues={};state.selectedSuspect=null;state.suspectDialogs={};state.remainingQuestions=10;state.accusedSuspect=null;state.expandedClues={};state.debateQueue=[];if(state.danmakuTimer)clearInterval(state.danmakuTimer);document.getElementById('resultOverlay').classList.remove('active');document.getElementById('caseIntroScreen').classList.remove('active');document.getElementById('caseIntroScreen').style.display='none';document.getElementById('dossierOverlay').classList.remove('active');document.getElementById('dossierRow').style.display='none';document.getElementById('setupScreen').classList.add('active');document.getElementById('setupScreen').style.display='block';document.getElementById('bodyCollapsed').style.display='none';document.getElementById('bodyExpanded').classList.remove('active');document.getElementById('app').classList.remove('expanded-mode');document.getElementById('expandBtn').textContent='\u25b8';document.getElementById('caseSubtitle').textContent='\u8bbe\u7f6e\u4efb\u52a1\u4ee5\u5f00\u59cb';document.getElementById('deadlineTag').style.display='none';document.getElementById('caseBrief').style.display='none';document.getElementById('deadlineHour').value='21';renderSetupList();}

/* ====== Preset ====== */
var presetTodos=['\u6574\u7406\u5468\u62a5','\u56de\u590d\u5ba2\u6237\u90ae\u4ef6','\u5199\u65b9\u6848\u6587\u6863','\u9884\u8ba2\u4f1a\u8bae\u5ba4','\u4ee3\u7801\u8bc4\u5ba1'];
presetTodos.forEach(function(t){state.setupTodos.push(t);});
renderSetupList();
</script>
