<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合规雷达 - 具身智能法规导航台</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">🛡️</span>
                <h1>合规雷达</h1>
            </div>
            <p class="subtitle">具身智能法规导航台 · 3分钟搞懂你的机器人该遵守什么法规</p>
        </header>

        <!-- Step-by-step Filter -->
        <section class="filter-section">
            <!-- Step 1: Target Market -->
            <div class="step active" id="step-1">
                <div class="step-header">
                    <span class="step-number">1</span>
                    <h3>你的目标市场在哪里？</h3>
                </div>
                <div class="option-grid" id="market-options">
                    <button class="option-btn" data-value="CN" data-step="1">
                        <span class="option-icon">🇨🇳</span>
                        <span class="option-label">中国</span>
                    </button>
                    <button class="option-btn" data-value="EU" data-step="1">
                        <span class="option-icon">🇪🇺</span>
                        <span class="option-label">欧盟</span>
                    </button>
                    <button class="option-btn" data-value="US" data-step="1">
                        <span class="option-icon">🇺🇸</span>
                        <span class="option-label">美国</span>
                    </button>
                    <button class="option-btn" data-value="JP" data-step="1">
                        <span class="option-icon">🇯🇵</span>
                        <span class="option-label">日本</span>
                    </button>
                </div>
            </div>

            <!-- Step 2: Robot Type -->
            <div class="step disabled" id="step-2">
                <div class="step-header">
                    <span class="step-number">2</span>
                    <h3>你的机器人是什么类型？</h3>
                    <button class="step-reset" id="reset-step-2" title="重选">← 返回重选</button>
                </div>
                <div class="option-grid" id="robot-options">
                    <!-- Dynamically populated based on Step 1 -->
                </div>
            </div>

            <!-- Step 3: Standard Category -->
            <div class="step disabled" id="step-3">
                <div class="step-header">
                    <span class="step-number">3</span>
                    <h3>关注哪类标准？</h3>
                    <button class="step-reset" id="reset-step-3" title="重选">← 返回重选</button>
                </div>
                <div class="option-grid" id="category-options">
                    <!-- Dynamically populated based on Step 1+2 -->
                </div>
            </div>
        </section>

        <!-- Results Section -->
        <section id="results-section" class="results-section hidden">
            <div class="results-header">
                <h2>适用法规清单</h2>
                <span id="result-count" class="result-count"></span>
                <button id="restart-btn" class="restart-btn">🔄 重新选择</button>
            </div>
            
            <div id="results-container" class="results-container">
                <!-- Results will be dynamically inserted here -->
            </div>
        </section>

        <!-- Welcome Section (shown when no search) -->
        <section id="welcome-section" class="welcome-section">
            <div class="welcome-card">
                <h3>👋 欢迎使用合规雷达</h3>
                <p>按步骤选择，快速找到你的机器人该遵守的法规标准。</p>
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-number">36</span>
                        <span class="stat-label">已核实标准</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number">4</span>
                        <span class="stat-label">目标市场</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number">7</span>
                        <span class="stat-label">标准类别</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>合规雷达 v3.0 · 数据来源：国标全文公开系统 / ISO / IEC / EUR-Lex 等官方渠道</p>
            <p class="disclaimer">⚠️ 本工具仅提供法规元数据导航，具体技术参数请以官方标准原文为准</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
