    ctx.beginPath(); ctx.arc(s.x, s.y, t.atkRange, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = color;
    ctx.globalAlpha = alpha * 0.3;
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.globalAlpha = alpha;
    // 炮塔主体
    ctx.fillStyle = '#666';
    ctx.beginPath(); ctx.arc(s.x, s.y, t.radius, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = color; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(s.x, s.y, t.radius, 0, Math.PI * 2); ctx.stroke();
    // 炮管
    ctx.strokeStyle = color; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x + 20, s.y - 20); ctx.stroke();
    // 血条
    drawHPBar(ctx, s.x, s.y - t.radius - 12, t.hp, t.maxHp, 40);
    ctx.globalAlpha = 1;
  });
}

function drawUnits(ctx) {
  // 渲染火焰区域
  if (G.fireZones) {
    G.fireZones.forEach(z => {
      const s = worldToScreen(z.x, z.y);
      const alpha = Math.min(0.4, z.life / z.maxLife * 0.4);
      ctx.fillStyle = `rgba(255,100,0,${alpha})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, z.radius, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = `rgba(255,200,0,${alpha + 0.2})`; ctx.lineWidth = 2; ctx.stroke();
    });
  }
  // 渲染寒冰区域
  if (G.iceZones) {
    G.iceZones.forEach(z => {
      const s = worldToScreen(z.x, z.y);
      const alpha = Math.min(0.4, z.life / z.maxLife * 0.4);
      ctx.fillStyle = `rgba(100,180,255,${alpha})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, z.radius, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = `rgba(200,230,255,${alpha + 0.2})`; ctx.lineWidth = 2; ctx.stroke();
    });
  }
  // 渲染地面残留（喷射留下的燃烧/结霜）
  if (G.groundZones) {
    G.groundZones.forEach(gz => {
      const s = worldToScreen(gz.x, gz.y);
      const alpha = Math.min(0.5, gz.life / gz.maxLife * 0.5);
      if (gz.hero === 'zhurong') {
        ctx.fillStyle = `rgba(255,100,0,${alpha})`;
      } else {
        ctx.fillStyle = `rgba(130,200,255,${alpha})`;
      }
      ctx.beginPath(); ctx.arc(s.x, s.y, gz.radius, 0, Math.PI * 2); ctx.fill();
    });
  }
  // 渲染火焰/冰雾喷射
  G.players.forEach(p => {
    const fs = p._flameStream;
    if (!fs || !fs.active) return;
    const s = worldToScreen(p.x, p.y);
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(fs.angle);
    const coneW = Math.tan(fs.coneHalf) * fs.coneLen;
    if (fs.hero === 'zhurong') {
      const grad = ctx.createLinearGradient(0, 0, fs.coneLen, 0);
      grad.addColorStop(0, 'rgba(255,200,0,0.6)');
      grad.addColorStop(0.3, 'rgba(255,100,0,0.4)');
      grad.addColorStop(1, 'rgba(255,50,0,0.1)');
      ctx.fillStyle = grad;
    } else {
      const grad = ctx.createLinearGradient(0, 0, fs.coneLen, 0);
      grad.addColorStop(0, 'rgba(200,230,255,0.6)');
      grad.addColorStop(0.3, 'rgba(130,200,255,0.4)');
      grad.addColorStop(1, 'rgba(100,180,255,0.1)');
      ctx.fillStyle = grad;
    }
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(fs.coneLen, -coneW);
    ctx.lineTo(fs.coneLen, coneW);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  });
  // 绘制小兵
  G.minions.forEach(m => {
    const alpha = m.dead ? Math.max(0, m.fadeTimer) : 1;
    if (alpha <= 0) return;
    const s = worldToScreen(m.x, m.y);
    ctx.globalAlpha = alpha;
    const color = m.team === TEAM_RED ? C_RED : C_BLUE;

    if (m.subType === 'mech') {
      // 机甲战士：方形
      ctx.fillStyle = color;
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(m.facingAngle);
      ctx.fillRect(-10, -10, 20, 20);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.strokeRect(-10, -10, 20, 20);
      // 剑
      ctx.strokeStyle = '#ccc'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(22, -6); ctx.stroke();
      ctx.restore();
    } else if (m.subType === 'machineGun') {
      // 机枪兵：小方形带双枪
      ctx.fillStyle = color;
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(m.facingAngle);
      ctx.fillRect(-8, -8, 16, 16);
      ctx.strokeStyle = '#ffff00'; ctx.lineWidth = 2;
      ctx.strokeRect(-8, -8, 16, 16);
      // 双枪
      ctx.strokeStyle = '#ccc'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(8, -4); ctx.lineTo(18, -4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(8, 4); ctx.lineTo(18, 4); ctx.stroke();
      ctx.restore();
    } else if (m.subType === 'daodog') {
      // 刀盾狗：狗头+盾牌
      ctx.fillStyle = color;
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(m.facingAngle);
      // 身体
      ctx.fillRect(-10, -8, 20, 16);
      ctx.strokeStyle = '#ffcc00'; ctx.lineWidth = 2;
      ctx.strokeRect(-10, -8, 20, 16);
      // 狗头
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(10, -4, 6, -Math.PI / 2, Math.PI / 2); ctx.fill();
      ctx.strokeStyle = '#ffcc00'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(10, -4, 6, -Math.PI / 2, Math.PI / 2); ctx.stroke();
      // 盾牌
      ctx.fillStyle = '#ffcc00';
      ctx.fillRect(-16, -10, 8, 20);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
      ctx.strokeRect(-16, -10, 8, 20);
      ctx.restore();
    } else {
      // 智能大炮：圆形带炮管
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(s.x, s.y, m.radius, 0, Math.PI * 2); ctx.fill();
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(m.facingAngle);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(22, 0); ctx.stroke();
      ctx.restore();
    }

    // 血条
    drawHPBar(ctx, s.x, s.y - 20, m.hp, m.maxHp, 28);
    ctx.globalAlpha = 1;
  });

  // 绘制玩家
  G.players.forEach(p => {
    const alpha = p.dead ? Math.max(0, p.fadeTimer) : 1;
    if (alpha <= 0) return;
    const s = worldToScreen(p.x, p.y);
    ctx.globalAlpha = alpha;

    const roll = p.activeEffects.find(e => e.type === 'roll');
    let baseColor;
    if (p.hero === 'xiaohuang') baseColor = C_YELLOW;
    else if (p.hero === 'xiaolan') baseColor = C_CYAN;
    else if (p.hero === 'xiaofen') baseColor = '#ff66aa';
    else if (p.hero === 'zhuyue') baseColor = '#88ff44';
    else if (p.hero === 'shenlan') baseColor = '#4488ff';
    else if (p.hero === 'xiaohong') baseColor = '#ff4444';
    else if (p.hero === 'xiaozi') baseColor = '#aa44ff';
    else if (p.hero === 'jijia') baseColor = '#888888';
    else baseColor = '#ff66aa';
    const drawColor = roll ? '#ff2222' : baseColor;
    const teamColor = p.team === TEAM_RED ? C_RED : C_BLUE;

    // 团队光环（明显区分敌我）
    ctx.fillStyle = teamColor;
    ctx.globalAlpha = alpha * 0.4;
    ctx.beginPath(); ctx.arc(s.x, s.y, p.radius + 14, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = teamColor;
    ctx.globalAlpha = alpha * 0.7;
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.globalAlpha = alpha;

    // 狂暴模式：血量低于200时发红光
    if (p.hp < 200) {
      ctx.fillStyle = '#ff0000';
      ctx.globalAlpha = alpha * 0.5;
      ctx.beginPath(); ctx.arc(s.x, s.y, p.radius + 20, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = alpha;
    }

    // 英雄主体
    ctx.fillStyle = drawColor;
    ctx.beginPath(); ctx.arc(s.x, s.y, p.radius, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(s.x, s.y, p.radius, 0, Math.PI * 2); ctx.stroke();

    // 朝向指示器（方向箭头）
    ctx.strokeStyle = p === G.localPlayer ? '#fff' : drawColor;
    ctx.lineWidth = 3;
    const arrowLen = p.radius + 12;
    const ax = s.x + Math.cos(p.facingAngle) * arrowLen;
    const ay = s.y + Math.sin(p.facingAngle) * arrowLen;
    ctx.beginPath();
    ctx.moveTo(s.x + Math.cos(p.facingAngle) * p.radius, s.y + Math.sin(p.facingAngle) * p.radius);
    ctx.lineTo(ax, ay);
    ctx.stroke();
    // 箭头头部
    const arrowSize = 6;
    const aLeft = p.facingAngle + Math.PI * 0.8;
    const aRight = p.facingAngle - Math.PI * 0.8;
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(ax + Math.cos(aLeft) * arrowSize, ay + Math.sin(aLeft) * arrowSize);
    ctx.moveTo(ax, ay);
    ctx.lineTo(ax + Math.cos(aRight) * arrowSize, ay + Math.sin(aRight) * arrowSize);
    ctx.stroke();

    // 英雄图标
    ctx.fillStyle = '#000'; ctx.font = '18px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    let heroIcon = '✦';
    if (p.hero === 'xiaohuang') heroIcon = '⚔';
    else if (p.hero === 'xiaofen') heroIcon = '➳';
    else if (p.hero === 'zhuyue') heroIcon = '🗡';
    else if (p.hero === 'shenlan') heroIcon = '🛡';
    else if (p.hero === 'xiaohong') heroIcon = '🔪';
    else if (p.hero === 'xiaozi') heroIcon = '🕷';
    else if (p.hero === 'jijia') heroIcon = '🤖';
    ctx.fillText(heroIcon, s.x, s.y);

    // 玩家标识
    if (p === G.localPlayer) {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y - p.radius - 28);
      ctx.lineTo(s.x - 6, s.y - p.radius - 36);
      ctx.lineTo(s.x + 6, s.y - p.radius - 36);
      ctx.closePath(); ctx.stroke();
    }

    // 血条
    drawHPBar(ctx, s.x, s.y - p.radius - 14, p.hp, p.maxHp, 40);

    // 复活计时
    if (p.dead && p.respawnTimer > 0) {
      ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(Math.ceil(p.respawnTimer) + 's', s.x, s.y);
    }

    ctx.globalAlpha = 1;
  });

  // 绘制钩爪绳索
  G.players.forEach(p => {
    const hooked = p.activeEffects.find(e => e.type === 'hooked');
    if (hooked && hooked.owner && !hooked.owner.dead) {
      const s1 = worldToScreen(hooked.owner.x, hooked.owner.y);
      const s2 = worldToScreen(p.x, p.y);
      ctx.strokeStyle = '#4488ff';
      ctx.lineWidth = 3;
      ctx.globalAlpha = 0.8;
      ctx.beginPath(); ctx.moveTo(s1.x, s1.y); ctx.lineTo(s2.x, s2.y); ctx.stroke();
      // 绳索中段闪烁点
      const mx = (s1.x + s2.x) / 2, my = (s1.y + s2.y) / 2;
      ctx.fillStyle = '#88ccff';
      ctx.beginPath(); ctx.arc(mx, my, 4, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      // 查找绳索实体显示血量
      const ropeProj = G.projectiles.find(proj => proj.isHookRope && proj.owner === hooked.owner && proj.hookTarget === p);
      if (ropeProj) {
        drawHPBar(ctx, mx, my - 15, ropeProj.hp, ropeProj.maxHp, 40);
      }
    }
  });

  // 绘制炮弹
  G.projectiles.forEach(p => {
    const s = worldToScreen(p.x, p.y);
    // 拖尾
    if (p.trail.length > 1) {
      for (let i = 0; i < p.trail.length - 1; i++) {
        const ts = worldToScreen(p.trail[i].x, p.trail[i].y);
        const a = (i + 1) / p.trail.length * 0.5;
        ctx.fillStyle = p.color;
        ctx.globalAlpha = a;
        const r = p.radius * (i + 1) / p.trail.length;
        ctx.beginPath(); ctx.arc(ts.x, ts.y, Math.max(1, r), 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    // 弹体
    ctx.fillStyle = p.color;
    if (p.isGravityBomb) {
      ctx.beginPath(); ctx.arc(s.x, s.y, p.radius + 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#cc88ff';
      ctx.beginPath(); ctx.arc(s.x, s.y, p.radius, 0, Math.PI * 2); ctx.fill();
    } else if (p.isPillar) {
      // 柱形投射物（火柱/冰柱）
      const ang = p.facingAngle || Math.atan2(p.vy, p.vx);
      const len = p.pillarLength || 200;
      const w = p.pillarWidth || 24;
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(ang);
      const grad = ctx.createLinearGradient(-len / 2, 0, len / 2, 0);
      if (p.isFirePillar) {
        grad.addColorStop(0, 'rgba(255,50,0,0.3)');
        grad.addColorStop(0.5, 'rgba(255,150,0,0.9)');
        grad.addColorStop(1, 'rgba(255,50,0,0.3)');
      } else {
        grad.addColorStop(0, 'rgba(68,136,255,0.3)');
        grad.addColorStop(0.5, 'rgba(150,200,255,0.9)');
        grad.addColorStop(1, 'rgba(68,136,255,0.3)');
      }
      ctx.fillStyle = grad;
      ctx.fillRect(-len / 2, -w / 2, len, w);
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 2;
      ctx.strokeRect(-len / 2, -w / 2, len, w);
      ctx.restore();
    } else if (p.isShrapnel) {
      ctx.fillRect(s.x - 3, s.y - 3, 6, 6);
    } else {
      ctx.beginPath(); ctx.arc(s.x, s.y, Math.max(2, p.radius), 0, Math.PI * 2); ctx.fill();
    }
  });
}

function drawEffects(ctx) {
  G.effects.forEach(e => {
    const alpha = e.life / e.maxLife;
    if (e.type === 'particle') {
      const s = worldToScreen(e.x, e.y);
      ctx.fillStyle = e.color;
      ctx.globalAlpha = alpha;
      ctx.beginPath(); ctx.arc(s.x, s.y, e.radius * alpha, 0, Math.PI * 2); ctx.fill();
    } else if (e.type === 'swordqi') {
      const s1 = worldToScreen(e.x1, e.y1), s2 = worldToScreen(e.x2, e.y2);
      ctx.strokeStyle = e.color;
      ctx.globalAlpha = alpha;
      ctx.lineWidth = 20 * alpha;
      ctx.beginPath(); ctx.moveTo(s1.x, s1.y); ctx.lineTo(s2.x, s2.y); ctx.stroke();
    } else if (e.type === 'slash') {
      const s = worldToScreen(e.x, e.y);
      ctx.strokeStyle = e.color;
      ctx.globalAlpha = alpha;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(s.x, s.y, e.radius, e.angle - Math.PI / 4, e.angle + Math.PI / 4);
      ctx.stroke();
    } else if (e.type === 'laser') {
      const s1 = worldToScreen(e.x1, e.y1), s2 = worldToScreen(e.x2, e.y2);
      ctx.strokeStyle = e.color;
      ctx.globalAlpha = alpha;
      ctx.lineWidth = 30 * alpha;
      ctx.beginPath(); ctx.moveTo(s1.x, s1.y); ctx.lineTo(s2.x, s2.y); ctx.stroke();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 10 * alpha;
      ctx.beginPath(); ctx.moveTo(s1.x, s1.y); ctx.lineTo(s2.x, s2.y); ctx.stroke();
    } else if (e.type === 'homingTrail') {
      const s = worldToScreen(e.x, e.y);
      ctx.strokeStyle = e.color;
      ctx.globalAlpha = alpha * 0.7;
      ctx.lineWidth = 6 * alpha;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x + Math.cos(e.angle) * 40, s.y + Math.sin(e.angle) * 40);
      ctx.stroke();
    } else if (e.type === 'spark') {
      // 火花效果
      const sx = e.x + (e.vx || 0) * (1 - alpha) * 0.3;
      const sy = e.y + (e.vy || 0) * (1 - alpha) * 0.3;
      const scr = worldToScreen(sx, sy);
      ctx.fillStyle = `rgba(255, ${150 + (Math.random() * 105) | 0}, 50, ${alpha})`;
      ctx.beginPath();
      ctx.arc(scr.x, scr.y, 2 + alpha * 3, 0, Math.PI * 2);
      ctx.fill();
    } else if (e.type === 'mine') {
      // 地雷
      const s = worldToScreen(e.x, e.y);
      ctx.fillStyle = '#ff6600';
      ctx.globalAlpha = 0.8;
      ctx.beginPath(); ctx.arc(s.x, s.y, e.radius, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#ffaa00';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(s.x, s.y, e.radius + 3, 0, Math.PI * 2); ctx.stroke();
      // 闪烁
      if (Math.sin(G.gameTime * 5) > 0) {
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(s.x, s.y, 3, 0, Math.PI * 2); ctx.fill();
      }
    } else if (e.type === 'energyWall') {
      // 能量墙：半圆弧
      const ws = worldToScreen(e.x, e.y);
      ctx.save();
      ctx.translate(ws.x, ws.y);
      ctx.rotate(e.angle);
      const wAlpha = Math.min(1, e.hp / e.maxHp + 0.3);
      ctx.globalAlpha = wAlpha;
      ctx.strokeStyle = e.team === TEAM_RED ? '#ff8800' : '#00aaff';
      ctx.lineWidth = e.wallThickness;
      ctx.shadowColor = e.team === TEAM_RED ? '#ff8800' : '#00aaff';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.arc(0, 0, e.radius, -Math.PI / 2, Math.PI / 2);
      ctx.stroke();
      ctx.shadowBlur = 0;
      // 血条
      const barW = 80, barH = 6;
      ctx.fillStyle = '#333';
      ctx.fillRect(-barW / 2, -e.radius - 20, barW, barH);
      ctx.fillStyle = '#00ff88';
      ctx.fillRect(-barW / 2, -e.radius - 20, barW * (e.hp / e.maxHp), barH);
      ctx.globalAlpha = 1;
      ctx.restore();
    } else if (e.type === 'artilleryStrike' && !e.exploded) {
      // 炮兵骑射：红色落点标记
      const as = worldToScreen(e.targetX, e.targetY);
      ctx.globalAlpha = 0.6 + Math.sin(G.gameTime * 8) * 0.3;
      ctx.strokeStyle = '#ff0000';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(as.x, as.y, e.radius, 0, Math.PI * 2);
      ctx.stroke();
      // 十字标记
      ctx.beginPath();
      ctx.moveTo(as.x - 15, as.y); ctx.lineTo(as.x + 15, as.y);
      ctx.moveTo(as.x, as.y - 15); ctx.lineTo(as.x, as.y + 15);
      ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (e.type === 'hook') {
      // 钩爪绳索
      const s1 = worldToScreen(e.x1, e.y1), s2 = worldToScreen(e.x2, e.y2);
      ctx.strokeStyle = e.color;
      ctx.globalAlpha = alpha;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(s1.x, s1.y); ctx.lineTo(s2.x, s2.y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  });

  // 绘制烟雾弹（在所有玩家的activeEffects中）
  G.players.forEach(p => {
    p.activeEffects.forEach(eff => {
      if (eff.type === 'smoke') {
        const s = worldToScreen(eff.x, eff.y);
        const alpha = eff.life / eff.maxLife;
        ctx.fillStyle = p.team === TEAM_RED ? 'rgba(170,68,255,0.3)' : 'rgba(170,68,255,0.3)';
        ctx.globalAlpha = alpha * 0.4;
        ctx.beginPath(); ctx.arc(s.x, s.y, eff.radius, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#aa44ff';
        ctx.globalAlpha = alpha * 0.3;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(s.x, s.y, eff.radius, 0, Math.PI * 2); ctx.stroke();
        // 内部漩涡
        ctx.strokeStyle = '#cc88ff';
        ctx.globalAlpha = alpha * 0.2;
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(s.x, s.y, eff.radius * 0.5, G.gameTime * 2, G.gameTime * 2 + Math.PI); ctx.stroke();
      }
    });
  });

  // 绘制玩家身上的持续效果
  G.players.forEach(p => {
    if (p.dead) return;
    const s = worldToScreen(p.x, p.y);
    p.activeEffects.forEach(eff => {
      const alpha = eff.life / eff.maxLife;
      if (eff.type === 'whirlwind') {
        ctx.strokeStyle = C_YELLOW;
        ctx.globalAlpha = alpha * 0.6;
        ctx.lineWidth = 3;
        for (let j = 0; j < 3; j++) {
          const a = eff.angle + (j * Math.PI * 2 / 3);
          ctx.beginPath();
          ctx.arc(s.x, s.y, eff.radius, a, a + Math.PI * 0.6);
          ctx.stroke();
        }
      } else if (eff.type === 'roll') {
        ctx.strokeStyle = '#ff2222';
        ctx.globalAlpha = alpha * 0.5;
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(s.x, s.y, p.radius + 5, 0, Math.PI * 2); ctx.stroke();
        // 速度线
        for (let j = 0; j < 4; j++) {
          const a = eff.angle + j * Math.PI / 2;
          ctx.beginPath();
          ctx.moveTo(s.x + Math.cos(a) * (p.radius + 8), s.y + Math.sin(a) * (p.radius + 8));
          ctx.lineTo(s.x + Math.cos(a) * (p.radius + 20), s.y + Math.sin(a) * (p.radius + 20));
          ctx.stroke();
        }
      } else if (eff.type === 'brainstorm') {
        ctx.strokeStyle = '#00ffff';
        ctx.globalAlpha = alpha * 0.5;
        ctx.lineWidth = 2;
        // 电弧效果
        const time = G.gameTime;
        for (let j = 0; j < 6; j++) {
          const a = j * Math.PI / 3 + Math.sin(time * 8 + j) * 0.3;
          ctx.beginPath();
          ctx.moveTo(s.x + Math.cos(a) * 20, s.y + Math.sin(a) * 20);
          let lx = s.x + Math.cos(a) * 20, ly = s.y + Math.sin(a) * 20;
          for (let k = 0; k < 4; k++) {
            const t = (k + 1) / 4;
            const r = 20 + t * (eff.radius - 20);
            const na = a + Math.sin(time * 10 + j * 2 + k * 3) * 0.4;
            lx = s.x + Math.cos(na) * r;
            ly = s.y + Math.sin(na) * r;
            ctx.lineTo(lx, ly);
          }
          ctx.stroke();
        }
      } else if (eff.type === 'rapidFire') {
        ctx.strokeStyle = '#ff66aa';
        ctx.globalAlpha = alpha * 0.5;
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(s.x, s.y, p.radius + 8, 0, Math.PI * 2); ctx.stroke();
        const time = G.gameTime;
        for (let j = 0; j < 4; j++) {
          const a = time * 6 + j * Math.PI / 2;
          ctx.beginPath();
          ctx.moveTo(s.x + Math.cos(a) * (p.radius + 10), s.y + Math.sin(a) * (p.radius + 10));
          ctx.lineTo(s.x + Math.cos(a) * (p.radius + 18), s.y + Math.sin(a) * (p.radius + 18));
          ctx.stroke();
        }
      } else if (eff.type === 'giantsword') {
        // 巨剑视觉：从玩家到剑尖的线
        if (eff.lastSwordX !== undefined) {
          const s2 = worldToScreen(eff.lastSwordX, eff.lastSwordY);
          ctx.strokeStyle = '#88ff44';
          ctx.globalAlpha = alpha * 0.8;
          ctx.lineWidth = 20;
          ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s2.x, s2.y); ctx.stroke();
          ctx.strokeStyle = '#ccff88';
          ctx.lineWidth = 8;
          ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s2.x, s2.y); ctx.stroke();
        }
      } else if (eff.type === 'stun') {
        // 麻痹：头顶星星
        ctx.fillStyle = '#ffff00';
        ctx.globalAlpha = 0.5 + Math.sin(G.gameTime * 8) * 0.3;
        ctx.font = '16px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('★', s.x, s.y - p.radius - 20);
      } else if (eff.type === 'spiderNest') {
        // 蜘蛛母巢
        const ns = worldToScreen(eff.nestX, eff.nestY);
        ctx.fillStyle = '#aa44ff';
        ctx.globalAlpha = 0.6;
        ctx.beginPath(); ctx.arc(ns.x, ns.y, 15, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#cc88ff';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(ns.x, ns.y, 15, 0, Math.PI * 2); ctx.stroke();
        // 绘制小蜘蛛
        for (let si = 0; si < eff.spiders.length; si++) {
          const sp = eff.spiders[si];
          const ss = worldToScreen(sp.x, sp.y);
          ctx.fillStyle = '#aa44ff';
          ctx.globalAlpha = 0.8;
          ctx.beginPath(); ctx.arc(ss.x, ss.y, sp.radius, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.arc(ss.x, ss.y, sp.radius, 0, Math.PI * 2); ctx.stroke();
        }
      } else if (eff.type === 'smoke') {
        // 烟雾弹（在玩家activeEffects中绘制）
      } else if (eff.type === 'bigSpider') {
        // 大蜘蛛
        const bs = worldToScreen(eff.spiderX, eff.spiderY);
        ctx.fillStyle = '#8800cc';
        ctx.globalAlpha = alpha;
        ctx.beginPath(); ctx.arc(bs.x, bs.y, 25, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#aa44ff';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(bs.x, bs.y, 25, 0, Math.PI * 2); ctx.stroke();
        // 蜘蛛腿
        ctx.strokeStyle = '#aa44ff';
        ctx.lineWidth = 2;
        for (let li = 0; li < 8; li++) {
          const la = (Math.PI * 2 / 8) * li + G.gameTime * 4;
          ctx.beginPath();
          ctx.moveTo(bs.x, bs.y);
          ctx.lineTo(bs.x + Math.cos(la) * 35, bs.y + Math.sin(la) * 35);
          ctx.stroke();
        }
      } else if (eff.type === 'webbed') {
        // 被捆绑：身上绕网线
        ctx.strokeStyle = '#aa44ff';
        ctx.globalAlpha = 0.6;
        ctx.lineWidth = 2;
        for (let wi = 0; wi < 4; wi++) {
          const wa = (Math.PI / 2) * wi + G.gameTime * 2;
          ctx.beginPath();
          ctx.arc(s.x, s.y, p.radius + 5, wa, wa + Math.PI);
          ctx.stroke();
        }
      }
      if (eff.type === 'burning') {
        // 身上着火效果
        ctx.fillStyle = `rgba(255,100,0,${0.3 + Math.random() * 0.3})`;
        ctx.beginPath(); ctx.arc(s.x + rnd(-5,5), s.y + rnd(-5,5), rnd(4,8), 0, Math.PI * 2); ctx.fill();
      }
      if (eff.type === 'frozen') {
        // 冰冻效果
        ctx.strokeStyle = 'rgba(150,220,255,0.8)'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(s.x, s.y, p.radius + 5, 0, Math.PI * 2); ctx.stroke();
      }
      if (eff.type === 'ensnared') {
        // 草缠效果
        ctx.strokeStyle = 'rgba(50,200,50,0.8)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(s.x, s.y, p.radius + 3, 0, Math.PI * 2); ctx.stroke();
      }
      if (eff.type === 'energyShield') {
        // 能量大盾金色包裹
        ctx.strokeStyle = `rgba(255,204,0,${0.4 + 0.3 * Math.sin(Date.now() / 200)})`;
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(s.x, s.y, p.radius + 10, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = `rgba(255,204,0,${0.1 + 0.1 * Math.sin(Date.now() / 300)})`;
        ctx.beginPath(); ctx.arc(s.x, s.y, p.radius + 10, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    });
  });

  // 绘制防御护盾
  G.players.forEach(p => {
    if (p.dead || !p.isDefending) return;
    const s = worldToScreen(p.x, p.y);
    ctx.strokeStyle = '#ffcc00';
    ctx.globalAlpha = 0.6 + Math.sin(G.gameTime * 10) * 0.2;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(s.x, s.y, p.radius + 8, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = '#fff';
    ctx.globalAlpha = 0.3;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(s.x, s.y, p.radius + 5, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  });

  // 绘制深蓝大盾
  G.players.forEach(p => {
    if (p.dead || !p.hasShield) return;
    const s = worldToScreen(p.x, p.y);
    // 盾牌：玩家前方弧形屏障
    ctx.strokeStyle = '#4488ff';
    ctx.globalAlpha = 0.7;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(s.x, s.y, p.radius + 25, p.facingAngle - Math.PI / 2.5, p.facingAngle + Math.PI / 2.5);
    ctx.stroke();
    ctx.strokeStyle = '#88aaff';
    ctx.globalAlpha = 0.4;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(s.x, s.y, p.radius + 22, p.facingAngle - Math.PI / 2.5, p.facingAngle + Math.PI / 2.5);
    ctx.stroke();
    ctx.globalAlpha = 1;
  });
}

function drawDmgTexts(ctx) {
  ctx.font = 'bold 18px sans-serif';
  ctx.textAlign = 'center';
  G.dmgTexts.forEach(t => {
    const s = worldToScreen(t.x, t.y);
    const alpha = t.life / t.maxLife;
    ctx.fillStyle = t.isHeal ? '#00ff44' : '#ff3333';
    ctx.globalAlpha = alpha;
    ctx.fillText((t.isHeal ? '+' : '-') + t.dmg, s.x, s.y);
  });
  ctx.globalAlpha = 1;
}

// ========== UI绘制 ==========
function drawHPBar(ctx, x, y, hp, maxHp, width) {
  const ratio = hp / maxHp;
  const h = 5;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(x - width / 2, y, width, h);
  const r = Math.round(255 * (1 - ratio));
  const g = Math.round(255 * ratio);
  ctx.fillStyle = `rgb(${r},${g},0)`;
  ctx.fillRect(x - width / 2, y, width * ratio, h);
}

function drawUI(ctx, cw, ch) {
  // 顶部中央：双方大本营血量
  const redBase = G.bases.find(b => b.team === TEAM_RED);
  const blueBase = G.bases.find(b => b.team === TEAM_BLUE);
  if (redBase && blueBase) {
    const barW = 200, barH = 18, gap = 30;
    const totalW = barW * 2 + gap + 40;
    const sx = (cw - totalW) / 2;

    // 红方大本营
    ctx.fillStyle = '#333'; ctx.fillRect(sx, 10, barW, barH);
    ctx.fillStyle = C_RED; ctx.fillRect(sx, 10, barW * (redBase.hp / redBase.maxHp), barH);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(sx, 10, barW, barH);
    ctx.fillStyle = '#fff'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('红方大本营 ' + Math.ceil(redBase.hp), sx + barW / 2, 8);

    // VS
    ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif';
    ctx.fillText('VS', sx + barW + gap / 2 + 20, 23);

    // 蓝方大本营
    const bx = sx + barW + gap + 40;
    ctx.fillStyle = '#333'; ctx.fillRect(bx, 10, barW, barH);
    ctx.fillStyle = C_BLUE; ctx.fillRect(bx, 10, barW * (blueBase.hp / blueBase.maxHp), barH);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(bx, 10, barW, barH);
    ctx.fillStyle = '#fff'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('蓝方大本营 ' + Math.ceil(blueBase.hp), bx + barW / 2, 8);
  }

  // 左上角小地图
  drawMinimap(ctx, 15, 45, 180, 135);

  // 下方中央：技能栏
  if (G.localPlayer) drawSkillBar(ctx, cw, ch);

  // 体力条（技能栏上方）
  if (G.localPlayer) {
    const lp = G.localPlayer;
    const sw = 200, sh = 6;
    const sx = cw / 2 - sw / 2, sy = ch - 110;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(sx - 1, sy - 1, sw + 2, sh + 2);
    ctx.fillStyle = lp.stamina <= 0 ? '#ff4444' : '#44ddff';
    ctx.fillRect(sx, sy, sw * (lp.stamina / lp.maxStamina), sh);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
    ctx.strokeRect(sx - 1, sy - 1, sw + 2, sh + 2);
    ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('体力', cw / 2, sy - 3);
  }

  // 右下角：击杀信息
  drawKillFeedUI(ctx, cw, ch);

  // 右上角：操作提示
  ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.font = '11px sans-serif'; ctx.textAlign = 'right';
  ctx.fillText('WASD移动 | 空格+W冲刺 | J/K/I/L技能 | O防御 | 右键大地图', cw - 15, ch - 15);

  // 灭火/挣扎按钮
  if (G.localPlayer && !G.localPlayer.dead) {
    const lp = G.localPlayer;
    const burning = lp.activeEffects.find(e => e.type === 'burning');
    const ensnared = lp.activeEffects.find(e => e.type === 'ensnared');
    const frozen = lp.activeEffects.find(e => e.type === 'frozen');
    
    if (burning) {
      // 灭火按钮 - 需要按住2秒
      const btnW = 120, btnH = 40;
      const btnX = cw / 2 - btnW / 2, btnY = ch / 2 + 60;
      const progress = Math.min(1, (lp._extinguishTime || 0) / 2);
      ctx.fillStyle = 'rgba(200,0,0,0.8)';
      ctx.beginPath(); ctx.roundRect(btnX, btnY, btnW, btnH, 8); ctx.fill();
      ctx.fillStyle = `rgba(0,200,0,${progress})`;
      ctx.beginPath(); ctx.roundRect(btnX, btnY, btnW * progress, btnH, 8); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('按住灭火 ' + (lp._extinguishTime || 0).toFixed(1) + 's', btnX + btnW / 2, btnY + 26);
      G._extBtnRect = { x: btnX, y: btnY, w: btnW, h: btnH };
    }
    
    if (ensnared) {
      // 挣扎按钮 - 需要连续点击5秒，0.3秒不点重置
      const btnW = 120, btnH = 40;
      const btnX = cw / 2 - btnW / 2, btnY = ch / 2 + 60;
      const progress = Math.min(1, (ensnared.struggleProgress || 0) / 5);
      ctx.fillStyle = 'rgba(0,100,0,0.8)';
      ctx.beginPath(); ctx.roundRect(btnX, btnY, btnW, btnH, 8); ctx.fill();
      ctx.fillStyle = `rgba(0,255,0,${progress})`;
      ctx.beginPath(); ctx.roundRect(btnX, btnY, btnW * progress, btnH, 8); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('点击挣扎 ' + progress.toFixed(0) + '%', btnX + btnW / 2, btnY + 26);
      G._struggleBtnRect = { x: btnX, y: btnY, w: btnW, h: btnH };
    }
    
    if (frozen) {
      // 冰冻提示
      const progress = Math.min(1, (frozen.unfreezeHoldTime || 0) / 4);
      const btnW = 160, btnH = 40;
      const btnX = cw / 2 - btnW / 2, btnY = ch / 2 + 60;
      ctx.fillStyle = 'rgba(0,0,150,0.8)';
      ctx.beginPath(); ctx.roundRect(btnX, btnY, btnW, btnH, 8); ctx.fill();
      ctx.fillStyle = `rgba(100,200,255,${progress})`;
      ctx.beginPath(); ctx.roundRect(btnX, btnY, btnW * progress, btnH, 8); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('长按移动键解冻 ' + (frozen.unfreezeHoldTime || 0).toFixed(1) + 's', btnX + btnW / 2, btnY + 26);
    }
  }

  // 瞄准模式切换按钮（右下角）
  const btnW = 100, btnH = 28;
  const btnX = cw - btnW - 15, btnY = ch - 50;
  const isAuto = G.aimMode === 'auto';
  ctx.fillStyle = isAuto ? 'rgba(0,200,100,0.7)' : 'rgba(200,100,0,0.7)';
  ctx.beginPath();
  ctx.roundRect(btnX, btnY, btnW, btnH, 6);
  ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(isAuto ? '自动瞄准' : '手动瞄准', btnX + btnW / 2, btnY + 18);
  // 存储按钮位置供点击检测
  G._aimBtnRect = { x: btnX, y: btnY, w: btnW, h: btnH };

  // 大地图（鼠标右键打开）
  if (G.showMinimap) drawBigMinimap(ctx, cw, ch);
}

function drawMinimap(ctx, mx, my, mw, mh) {
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(mx, my, mw, mh);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
  ctx.strokeRect(mx, my, mw, mh);

  const scaleX = mw / MAP_W, scaleY = mh / MAP_H;

  // 绘制基地
  G.bases.forEach(b => {
    if (b.dead) return;
    ctx.fillStyle = b.team === TEAM_RED ? C_RED : C_BLUE;
    ctx.fillRect(mx + b.x * scaleX - 4, my + b.y * scaleY - 4, 8, 8);
  });

  // 绘制炮塔
  G.towers.forEach(t => {
    if (t.dead) return;
    ctx.fillStyle = t.team === TEAM_RED ? C_RED : C_BLUE;
    ctx.fillRect(mx + t.x * scaleX - 2, my + t.y * scaleY - 2, 4, 4);
  });

  // 绘制障碍物
  OBSTACLES.forEach(ob => {
    if (ob.dead) return;
    ctx.fillStyle = '#666';
    if (ob.type === 'rect') {
      ctx.fillRect(mx + ob.x * scaleX, my + ob.y * scaleY, Math.max(2, ob.w * scaleX), Math.max(2, ob.h * scaleY));
    } else {
      ctx.beginPath();
      ctx.arc(mx + ob.x * scaleX, my + ob.y * scaleY, Math.max(2, ob.r * scaleX), 0, Math.PI * 2);
      ctx.fill();
    }
  });

  // 绘制小兵
  G.minions.forEach(m => {
    if (m.dead) return;
    ctx.fillStyle = m.team === TEAM_RED ? C_RED : C_BLUE;
    ctx.fillRect(mx + m.x * scaleX - 1, my + m.y * scaleY - 1, 2, 2);
  });

  // 绘制血包
  G.healthPacks.forEach(hp => {
    ctx.fillStyle = '#00ff44';
    ctx.beginPath();
    ctx.arc(mx + hp.x * scaleX, my + hp.y * scaleY, 3, 0, Math.PI * 2);
    ctx.fill();
  });

  // 绘制玩家
  G.players.forEach(p => {
    if (p.dead) return;
    let pColor;
    if (p === G.localPlayer) pColor = '#fff';
    else if (p.hero === 'xiaohuang') pColor = C_YELLOW;
    else if (p.hero === 'xiaolan') pColor = C_CYAN;
    else pColor = '#ff66aa';
    ctx.fillStyle = pColor;
    ctx.beginPath();
    ctx.arc(mx + p.x * scaleX, my + p.y * scaleY, p === G.localPlayer ? 4 : 3, 0, Math.PI * 2);
    ctx.fill();
  });

  // 视野框
  const vx = mx + G.camera.x * scaleX;
  const vy = my + G.camera.y * scaleY;
  const vw = G.canvas.width * scaleX;
  const vh = G.canvas.height * scaleY;
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
  ctx.strokeRect(vx, vy, vw, vh);
}

function drawBigMinimap(ctx, cw, ch) {
  const size = Math.min(cw, ch) * 0.7;
  const mx = (cw - size) / 2, my = (ch - size) / 2;
  // 半透明背景
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(mx - 10, my - 10, size + 20, size + 40);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  ctx.strokeRect(mx - 10, my - 10, size + 20, size + 40);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('大地图（左键关闭）', cw / 2, my - 15);

  const scaleX = size / MAP_W, scaleY = size / MAP_H;

  // 地图底色
  ctx.fillStyle = '#1a3a1a';
  ctx.fillRect(mx, my, size, size * MAP_H / MAP_W);

  // 绘制障碍物
  OBSTACLES.forEach(ob => {
    if (ob.dead) return;
    ctx.fillStyle = '#555';
    if (ob.type === 'rect') {
      ctx.fillRect(mx + ob.x * scaleX, my + ob.y * scaleY, Math.max(3, ob.w * scaleX), Math.max(3, ob.h * scaleY));
    } else {
      ctx.beginPath();
      ctx.arc(mx + ob.x * scaleX, my + ob.y * scaleY, Math.max(3, ob.r * scaleX), 0, Math.PI * 2);
      ctx.fill();
    }
  });

  // 绘制所有实体（放大版）
  // 基地
  G.bases.forEach(b => {
    if (b.dead) return;
    ctx.fillStyle = b.team === TEAM_RED ? C_RED : C_BLUE;
    ctx.beginPath();
    ctx.arc(mx + b.x * scaleX, my + b.y * scaleY, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
    ctx.stroke();
  });

  // 炮塔
  G.towers.forEach(t => {
    if (t.dead) return;
    ctx.fillStyle = t.team === TEAM_RED ? '#ff8888' : '#8888ff';
    ctx.beginPath();
    ctx.arc(mx + t.x * scaleX, my + t.y * scaleY, 5, 0, Math.PI * 2);
    ctx.fill();
  });

  // 小兵
  G.minions.forEach(m => {
    if (m.dead) return;
    ctx.fillStyle = m.team === TEAM_RED ? C_RED : C_BLUE;
    ctx.fillRect(mx + m.x * scaleX - 1.5, my + m.y * scaleY - 1.5, 3, 3);
  });

  // 玩家
  G.players.forEach(p => {
    if (p.dead) return;
    let c;
    if (p === G.localPlayer) c = '#fff';
    else if (p.hero === 'xiaohuang') c = C_YELLOW;
    else if (p.hero === 'xiaolan') c = C_CYAN;
    else c = '#ff66aa';
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.arc(mx + p.x * scaleX, my + p.y * scaleY, 5, 0, Math.PI * 2);
    ctx.fill();
    if (p === G.localPlayer) {
      ctx.strokeStyle = C_YELLOW; ctx.lineWidth = 2;
      ctx.stroke();
    }
  });

  // 视野框
  const vx = mx + G.camera.x * scaleX;
  const vy = my + G.camera.y * scaleY;
  const vw = G.canvas.width * scaleX;
  const vh = G.canvas.height * scaleY;
  ctx.strokeStyle = '#ffff00'; ctx.lineWidth = 2;
  ctx.strokeRect(vx, vy, vw, vh);
}

function drawSkillBar(ctx, cw, ch) {
  const p = G.localPlayer;
  const hero = p.hero;
  let jName, kName, iName, jColor, kColor, iColor;
  if (hero === 'xiaohuang') {
    jName = '剑气'; kName = '旋风斩'; iName = '滚动';
    jColor = C_YELLOW; kColor = '#ff8800'; iColor = '#ff0088';
  } else if (hero === 'xiaolan') {
    jName = '头脑风暴'; kName = '引力炸弹'; iName = '激光大炮';
    jColor = C_CYAN; kColor = '#aa44ff'; iColor = '#ff0088';
  } else if (hero === 'xiaofen') {
    jName = '追踪箭'; kName = '爆炸箭'; iName = '急速射击';
    jColor = '#ff66aa'; kColor = '#ff3399'; iColor = '#ff0088';
  } else if (hero === 'zhuyue') {
    jName = '突刺'; kName = '激光'; iName = '巨剑';
    jColor = '#88ff44'; kColor = '#88ff44'; iColor = '#88ff44';
  } else if (hero === 'shenlan') {
    jName = '地雷'; kName = '钩爪'; iName = '大盾';
    jColor = '#4488ff'; kColor = '#4488ff'; iColor = '#4488ff';
  } else if (hero === 'xiaohong') {
    jName = '破刀式'; kName = '大刀挥砍'; iName = '旱地猛击';
    jColor = '#ff4444'; kColor = '#ff4444'; iColor = '#ff4444';
  } else if (hero === 'xiaozi') {
    jName = '蜘蛛巢'; kName = '烟雾弹'; iName = '大蜘蛛';
    jColor = '#aa44ff'; kColor = '#aa44ff'; iColor = '#aa44ff';
  } else if (hero === 'jijia') {
    jName = '能量墙'; kName = '机甲大炮'; iName = '炮兵骑射';
    jColor = '#00aaff'; kColor = '#ff8800'; iColor = '#ff4400';
  } else if (hero === 'qingfeng') {
    jName = '风'; kName = '回血'; iName = '万物复苏';
    jColor = '#88ffaa'; kColor = '#44ff88'; iColor = '#33cc33';
  } else if (hero === 'zhurong') {
    jName = '火球'; kName = '火柱'; iName = '烈焰焚天';
    jColor = '#ff6600'; kColor = '#ff3300'; iColor = '#ff4400';
  } else if (hero === 'yedan') {
    jName = '冰冻蛋'; kName = '冰柱'; iName = '极寒地狱';
    jColor = '#88ccff'; kColor = '#4488ff'; iColor = '#2266ff';
  } else if (hero === 'daodangou') {
    jName = '连续挥砍'; kName = '能量大盾'; iName = '刀盾大军';
    jColor = '#ffcc00'; kColor = '#ffcc00'; iColor = '#ffcc00';
  }
  const skills = [
    { key: 'J', name: jName, cd: p.skills.j.cd, maxCD: p.skills.j.maxCD, color: jColor },
    { key: 'K', name: kName, cd: p.skills.k.cd, maxCD: p.skills.k.maxCD, color: kColor },
    { key: 'I', name: iName, cd: p.skills.i.cd, maxCD: p.skills.i.maxCD, color: iColor },
    { key: 'L', name: '普攻', cd: p.skills.l.cd, maxCD: p.skills.l.maxCD, color: '#aaaaaa' },
    { key: 'O', name: '防御', cd: 0, maxCD: 0, color: '#ffcc00' }
  ];

  const boxSize = 50, gap = 8;
  const totalW = skills.length * boxSize + (skills.length - 1) * gap;
  const startX = (cw - totalW) / 2;
  const startY = ch - 80;

  skills.forEach((sk, i) => {
    const x = startX + i * (boxSize + gap);
    // 底色
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(x, startY, boxSize, boxSize);
    // 技能颜色
    if (sk.cd <= 0) {
      ctx.fillStyle = sk.color;
      ctx.globalAlpha = 0.5;
      ctx.fillRect(x + 2, startY + 2, boxSize - 4, boxSize - 4);
      ctx.globalAlpha = 1;
    }
    // 冷却遮罩
    if (sk.cd > 0) {
      const ratio = sk.cd / sk.maxCD;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(x, startY, boxSize, boxSize * ratio);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(Math.ceil(sk.cd), x + boxSize / 2, startY + boxSize / 2 + 5);
    }
    // 边框
    ctx.strokeStyle = sk.cd <= 0 ? sk.color : '#555';
    ctx.lineWidth = sk.cd <= 0 ? 2 : 1;
    ctx.strokeRect(x, startY, boxSize, boxSize);
    // 按键提示
    ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(sk.key, x + boxSize / 2, startY + boxSize + 16);
    // 技能名
    ctx.fillStyle = '#ccc'; ctx.font = '10px sans-serif';
    ctx.fillText(sk.name, x + boxSize / 2, startY - 4);
  });
}

function drawKillFeedUI(ctx, cw, ch) {
  if (G.killFeed.length === 0) return;
  ctx.textAlign = 'right';
  ctx.font = '13px sans-serif';
  let y = ch - 100;
  G.killFeed.forEach(k => {
    const alpha = Math.min(1, k.time);
    ctx.fillStyle = `rgba(0,0,0,${alpha * 0.5})`;
    const tw = ctx.measureText(k.text).width + 16;
    ctx.fillRect(cw - 15 - tw, y - 12, tw + 5, 20);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fillText(k.text, cw - 10, y);
    y -= 24;
  });
  ctx.textAlign = 'left';
}

// ========== 游戏结束界面 ==========
function drawEndScreen(ctx, cw, ch) {
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, cw, ch);
  const isWin = G.winner === G.localPlayer.team;
  ctx.fillStyle = isWin ? '#ffdd00' : '#ff4444';
  ctx.font = 'bold 64px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(isWin ? '胜利!' : '失败!', cw / 2, ch / 2 - 30);
  ctx.fillStyle = '#fff'; ctx.font = '24px sans-serif';
  ctx.fillText('点击任意位置重新开始', cw / 2, ch / 2 + 30);

  G.canvas.onclick = function() {
    G.canvas.onclick = null;
    G.state = 'select';
  };
}

// ========== 游戏主循环 ==========
function gameLoop(timestamp) {
  try {
    if (G.state === 'playing') {
      const dt = Math.min((timestamp - G.lastTime) / 1000, 0.05);
      G.lastTime = timestamp;
      // 更新鼠标世界坐标
      const w = screenToWorld(G.mouse.x, G.mouse.y);
      G.mouse.wx = w.x; G.mouse.wy = w.y;
      update(dt);
    } else if (G.state === 'select') {
      G.lastTime = timestamp;
    }
    render();
  } catch (e) {
    console.error('Game loop error:', e.message, e.stack);
  }
  requestAnimationFrame(gameLoop);
}

// ========== 启动 ==========
function init() {
  initCanvas();
  initInput();
  requestAnimationFrame(gameLoop);
}

// roundRect兼容
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (typeof r === 'number') r = [r, r, r, r];
    this.moveTo(x + r[0], y);
    this.lineTo(x + w - r[1], y);
    this.quadraticCurveTo(x + w, y, x + w, y + r[1]);
    this.lineTo(x + w, y + h - r[2]);
    this.quadraticCurveTo(x + w, y + h, x + w - r[2], y + h);
    this.lineTo(x + r[3], y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - r[3]);
    this.lineTo(x, y + r[0]);
    this.quadraticCurveTo(x, y, x + r[0], y);
    this.closePath();
  };
}

init();
</script>
