<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三维空间型思维导图</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root {
            --primary-color: #7fffd4;
            --bg-color: #0a1e1a;
            --panel-bg: rgba(10, 30, 26, 0.92);
            --text-color: #f0fff5;
            --neon-green: #7fffd4;
            --neon-glow: rgba(127, 255, 212, 0.4);
            --grid-color: rgba(127, 255, 212, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 30% 25%, rgba(127, 255, 212, 0.15) 0%, transparent 70%),
                radial-gradient(ellipse at 70% 75%, rgba(100, 230, 180, 0.1) 0%, transparent 65%),
                radial-gradient(ellipse at 50% 50%, rgba(140, 255, 200, 0.08) 0%, transparent 80%),
                linear-gradient(rgba(127, 255, 212, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(127, 255, 212, 0.06) 1px, transparent 1px);
            background-size: 
                100% 100%,
                100% 100%,
                100% 100%,
                50px 50px,
                50px 50px;
            pointer-events: none;
            z-index: 0;
            animation: bgPulse 10s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.88; }
        }

        .navbar {
            height: 64px;
            background: rgba(10, 30, 26, 0.9);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 60px;
            border-bottom: 1px solid rgba(127, 255, 212, 0.2);
            position: relative;
            z-index: 100;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
        }

        .toggle-switch {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 10px 20px;
            border-radius: 10px;
        }

        .toggle-switch:hover {
            background: rgba(127, 255, 212, 0.06);
        }

        .switch-track {
            width: 64px;
            height: 32px;
            background: linear-gradient(180deg, #2d3a35 0%, #1a2823 100%);
            border-radius: 16px;
            position: relative;
            border: 2px solid #3a4a42;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .switch-thumb {
            width: 26px;
            height: 26px;
            background: linear-gradient(180deg, #5a6a62 0%, #4a5a52 100%);
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
        }

        .toggle-switch.active .switch-thumb {
            left: 34px;
            background: linear-gradient(180deg, var(--primary-color) 0%, #5ccc9a 100%);
            box-shadow: 0 0 18px var(--primary-color), 0 0 30px rgba(127, 255, 212, 0.6);
            transform: scale(1.1);
        }

        .toggle-switch.active .switch-track {
            border-color: var(--primary-color);
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.5), 0 0 20px rgba(127, 255, 212, 0.4);
        }

        .switch-label {
            font-size: 13px;
            margin-top: 8px;
            color: #7a8a82;
            transition: color 0.3s ease;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .toggle-switch.active .switch-label {
            color: var(--primary-color);
            text-shadow: 0 0 12px rgba(127, 255, 212, 0.6);
        }

        .main-content {
            height: calc(100vh - 64px);
            position: relative;
            z-index: 1;
        }

        .panel {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            animation: panelFadeIn 0.35s ease;
        }

        @keyframes panelFadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .panel.active {
            display: block;
        }

        .notes-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .canvas-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            background: linear-gradient(180deg, rgba(127, 255, 212, 0.03) 0%, rgba(10, 30, 26, 0.98) 100%);
        }

        #3d-canvas {
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        #3d-canvas:active {
            cursor: grabbing;
        }

        .axis-indicator {
            position: absolute;
            bottom: 24px;
            right: 24px;
            width: 85px;
            height: 85px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            border: 1px solid rgba(127, 255, 212, 0.2);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .axis {
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 10px currentColor;
        }

        .axis.x { color: #ff7a7a; }
        .axis.y { color: #5dd8d0; }
        .axis.z { color: #5ab7d1; }

        .projection-panel {
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            width: 400px;
            background: rgba(10, 30, 26, 0.96);
            backdrop-filter: blur(25px);
            border-radius: 22px;
            padding: 28px;
            box-shadow: 
                0 0 60px rgba(127, 255, 212, 0.25),
                0 0 120px rgba(127, 255, 212, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(127, 255, 212, 0.35);
            z-index: 1000;
            pointer-events: auto;
            animation: slideInRight 0.35s ease;
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateY(-50%) translateX(40px); }
            to { opacity: 1; transform: translateY(-50%) translateX(0); }
        }

        .projection-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            padding-bottom: 18px;
            border-bottom: 1px solid rgba(127, 255, 212, 0.2);
        }

        .projection-header-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .projection-title {
            font-size: 22px;
            font-weight: bold;
            color: var(--primary-color);
            text-shadow: 0 0 18px rgba(127, 255, 212, 0.6);
            letter-spacing: 2px;
        }

        .face-selector {
            display: flex;
            gap: 8px;
        }

        .face-btn {
            width: 36px;
            height: 36px;
            border: 1px solid rgba(127, 255, 212, 0.3);
            background: rgba(127, 255, 212, 0.08);
            color: var(--primary-color);
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.25s ease;
        }

        .face-btn:hover {
            background: rgba(127, 255, 212, 0.2);
            box-shadow: 0 0 15px rgba(127, 255, 212, 0.35);
            transform: translateY(-2px);
        }

        .face-btn.active {
            background: rgba(127, 255, 212, 0.35);
            box-shadow: 0 0 20px rgba(127, 255, 212, 0.5);
            transform: scale(1.08);
        }

        .exit-btn {
            width: 36px;
            height: 36px;
            border: 1px solid rgba(255, 88, 88, 0.5);
            background: rgba(255, 88, 88, 0.08);
            color: #ff6b6b;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .exit-btn:hover {
            background: rgba(255, 88, 88, 0.25);
            box-shadow: 0 0 15px rgba(255, 88, 88, 0.35);
            transform: scale(1.15);
        }

        .projection-content {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 14px;
            padding: 20px;
            border: 1px solid rgba(127, 255, 212, 0.12);
        }

        .edit-area {
            width: 100%;
            height: 190px;
            min-height: 190px;
            outline: none;
            font-size: 15px;
            line-height: 1.8;
            color: #f0fff5;
            background: rgba(127, 255, 212, 0.04);
            border: 1px solid rgba(127, 255, 212, 0.18);
            border-radius: 12px;
            padding: 16px;
            overflow-y: auto;
            cursor: text;
            transition: all 0.25s ease;
            z-index: 10;
            pointer-events: auto;
            caret-color: var(--primary-color);
            resize: none;
            font-family: inherit;
            user-select: text;
        }

        .edit-area:focus {
            border-color: rgba(127, 255, 212, 0.5);
            box-shadow: 0 0 20px rgba(127, 255, 212, 0.12);
            background: rgba(127, 255, 212, 0.06);
        }

        .edit-area::placeholder {
            color: rgba(127, 255, 212, 0.3);
        }

        .projection-footer {
            margin-top: 18px;
            padding-top: 15px;
            border-top: 1px solid rgba(127, 255, 212, 0.12);
            text-align: center;
        }

        .hint-text {
            font-size: 12px;
            color: rgba(127, 255, 212, 0.45);
        }

        .edit-toolbar {
            display: flex;
            gap: 14px;
            margin-top: 14px;
            align-items: center;
        }

        .tool-btn {
            width: 34px;
            height: 34px;
            border: none;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            color: #fff;
            transition: all 0.2s ease;
            border: 1px solid rgba(127, 255, 212, 0.15);
        }

        .tool-btn:hover {
            background: rgba(127, 255, 212, 0.15);
            border-color: rgba(127, 255, 212, 0.3);
        }

        .tool-btn.active {
            background: var(--primary-color);
            color: #000;
            border-color: var(--primary-color);
        }

        .color-picker {
            display: flex;
            gap: 8px;
        }

        .color-btn {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .color-btn:hover, .color-btn.active {
            border-color: var(--primary-color);
            transform: scale(1.1);
        }

        .word-count {
            text-align: right;
            font-size: 12px;
            color: rgba(127, 255, 212, 0.45);
            margin-top: 10px;
        }

        .observation-node {
            position: absolute;
            left: 5%;
            top: 50%;
            transform: translateY(-50%);
            width: 360px;
            height: 360px;
            display: none;
            z-index: 999;
            animation: fadeInScale 0.35s ease;
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: translateY(-50%) scale(0.92); }
            to { opacity: 1; transform: translateY(-50%) scale(1); }
        }

        #observation-canvas {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            box-shadow: 
                0 0 50px rgba(127, 255, 212, 0.3),
                0 0 100px rgba(127, 255, 212, 0.1),
                inset 0 0 30px rgba(127, 255, 212, 0.08);
            border: 1px solid rgba(127, 255, 212, 0.35);
            cursor: grab;
            outline: none;
        }

        #observation-canvas:active {
            cursor: grabbing;
        }

        .library-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 28px 36px;
            border-bottom: 1px solid rgba(127, 255, 212, 0.2);
            background: rgba(10, 30, 26, 0.85);
            backdrop-filter: blur(15px);
        }

        .library-header h2 {
            color: var(--primary-color);
            font-size: 28px;
            text-shadow: 0 0 18px rgba(127, 255, 212, 0.4);
        }

        .new-note-btn {
            padding: 12px 28px;
            background: var(--primary-color);
            color: #000;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 18px rgba(127, 255, 212, 0.3);
        }

        .new-note-btn:hover {
            box-shadow: 0 0 30px rgba(127, 255, 212, 0.5);
            transform: translateY(-3px);
        }

        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
            padding: 36px;
            overflow-y: auto;
            height: calc(100% - 108px);
        }

        .note-card {
            background: var(--panel-bg);
            border-radius: 16px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(127, 255, 212, 0.12);
            position: relative;
            overflow: hidden;
        }

        .note-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--primary-color), transparent);
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .note-card:hover::before {
            opacity: 1;
        }

        .note-card:hover {
            border-color: var(--primary-color);
            box-shadow: 0 10px 40px rgba(127, 255, 212, 0.18);
            transform: translateY(-8px);
        }

        .note-card .note-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 14px;
            color: var(--primary-color);
            text-shadow: 0 0 12px rgba(127, 255, 212, 0.3);
        }

        .note-card .note-meta {
            font-size: 13px;
            color: rgba(127, 255, 212, 0.45);
            margin-bottom: 8px;
        }

        .empty-state {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: calc(100% - 108px);
            color: rgba(127, 255, 212, 0.35);
        }

        .empty-icon {
            font-size: 80px;
            margin-bottom: 28px;
            opacity: 0.5;
        }

        .ai-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: rgba(127, 255, 212, 0.35);
            text-align: center;
        }

        .ai-content h1 {
            font-size: 48px;
            color: var(--primary-color);
            margin-bottom: 28px;
            text-shadow: 0 0 25px rgba(127, 255, 212, 0.4);
            letter-spacing: 3px;
        }

        .ai-content p {
            font-size: 18px;
            opacity: 0.5;
        }

        .profile-container {
            display: flex;
            height: 100%;
        }

        .profile-sidebar {
            width: 240px;
            background: rgba(10, 30, 26, 0.92);
            backdrop-filter: blur(15px);
            border-right: 1px solid rgba(127, 255, 212, 0.18);
            padding: 28px 0;
        }

        .sidebar-btn {
            width: 100%;
            padding: 18px 28px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.55);
            cursor: pointer;
            font-size: 17px;
            text-align: left;
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }

        .sidebar-btn:hover, .sidebar-btn.active {
            background: rgba(127, 255, 212, 0.08);
            color: var(--primary-color);
            border-left-color: var(--primary-color);
        }

        .profile-content {
            flex: 1;
            padding: 36px;
            overflow-y: auto;
        }

        .profile-section {
            display: none;
        }

        .profile-section.active {
            display: block;
            animation: fadeIn 0.35s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .setting-item {
            margin-bottom: 40px;
        }

        .setting-item label {
            display: block;
            margin-bottom: 14px;
            color: rgba(255, 255, 255, 0.55);
            font-size: 15px;
            font-weight: 500;
        }

        .setting-item input {
            width: 400px;
            padding: 14px 20px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(127, 255, 212, 0.18);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.25s ease;
        }

        .setting-item input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 18px rgba(127, 255, 212, 0.18);
        }

        .save-btn {
            padding: 12px 28px;
            background: var(--primary-color);
            color: #000;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            margin-top: 14px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 18px rgba(127, 255, 212, 0.3);
        }

        .save-btn:hover {
            box-shadow: 0 0 30px rgba(127, 255, 212, 0.5);
            transform: translateY(-2px);
        }

        .color-options {
            display: flex;
            gap: 22px;
        }

        .color-option {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .color-option:hover, .color-option.active {
            border-color: var(--primary-color);
            transform: scale(1.25);
            box-shadow: 0 0 25px rgba(127, 255, 212, 0.4);
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        #game-canvas {
            border: 2px solid var(--primary-color);
            border-radius: 14px;
            background: #000;
            box-shadow: 0 0 50px rgba(127, 255, 212, 0.25);
        }

        .game-info {
            display: flex;
            gap: 50px;
            align-items: center;
        }

        .score, .lives {
            font-size: 22px;
            color: var(--primary-color);
            font-weight: bold;
            text-shadow: 0 0 15px rgba(127, 255, 212, 0.5);
        }

        .game-btn {
            padding: 14px 40px;
            background: var(--primary-color);
            color: #000;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 17px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 18px rgba(127, 255, 212, 0.3);
        }

        .game-btn:hover {
            box-shadow: 0 0 30px rgba(127, 255, 212, 0.5);
            transform: translateY(-3px);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.78);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: rgba(10, 30, 26, 0.96);
            border-radius: 20px;
            padding: 40px;
            min-width: 360px;
            box-shadow: 0 0 60px rgba(127, 255, 212, 0.25);
            border: 1px solid rgba(127, 255, 212, 0.3);
            animation: modalFadeIn 0.35s ease;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.88); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-content {
            text-align: center;
        }

        .modal-content p {
            margin-bottom: 28px;
            font-size: 17px;
            color: #fff;
            line-height: 1.7;
        }

        .modal-btn {
            padding: 14px 52px;
            background: var(--primary-color);
            color: #000;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 18px rgba(127, 255, 212, 0.3);
        }

        .modal-btn:hover {
            box-shadow: 0 0 30px rgba(127, 255, 212, 0.5);
            transform: translateY(-2px);
        }

        .context-menu {
            display: none;
            position: fixed;
            background: var(--panel-bg);
            border: 1px solid rgba(127, 255, 212, 0.2);
            border-radius: 12px;
            padding: 8px 0;
            min-width: 170px;
            z-index: 999;
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }

        .context-menu.show {
            display: block;
        }

        .context-menu-item {
            padding: 12px 22px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .context-menu-item:hover {
            background: rgba(127, 255, 212, 0.1);
        }

        .context-menu-item.danger {
            color: #ff6b6b;
        }

        .node-context-menu {
            display: none;
            position: fixed;
            background: rgba(10, 30, 26, 0.96);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(127, 255, 212, 0.25);
            border-radius: 16px;
            padding: 8px 0;
            min-width: 220px;
            z-index: 1000;
            box-shadow: 0 12px 45px rgba(0, 0, 0, 0.45), 0 0 25px rgba(127, 255, 212, 0.12);
        }

        .node-context-menu.show {
            display: block;
        }

        .node-context-menu-item {
            padding: 16px 28px;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .node-context-menu-item:hover {
            background: rgba(127, 255, 212, 0.12);
            color: var(--primary-color);
        }

        .node-context-menu-divider {
            height: 1px;
            background: rgba(127, 255, 212, 0.12);
            margin: 8px 0;
        }

        .producer-tag {

    <script>
        const THREE = window.THREE;
        const OrbitControls = THREE.OrbitControls;

        let scene, camera, renderer, controls;
        let nodes = [];
        let lines = [];
        let nodeMeshes = [];
        let selectedNode = null;
        let isObserving = false;
        let currentNote = null;
        let currentFace = 'front';
        let clickTimer = null;
        let nodeIdCounter = 1;
        let editingMode = false;

        let obsScene, obsCamera, obsRenderer, obsMesh, obsControls, obsAnimationId;

        const DIRECTIONS = [
            new THREE.Vector3(1, 1, 1),
            new THREE.Vector3(1, -1, -1),
            new THREE.Vector3(-1, 1, -1),
            new THREE.Vector3(-1, -1, 1)
        ];

        const NODE_SIZE = 1;
        const NODE_DISTANCE = NODE_SIZE * 2.5;
        const DENSITY_THRESHOLD = NODE_SIZE * 1.5;
        const MAX_CHILDREN = 4;
        const MAX_NODES = 100;
        const MAX_WORDS = 500;

        const NOTES_KEY = 'mindmap_notes';
        const CONFIG_KEY = 'mindmap_config';

        async function init() {
            initData();
            init3DScene();
            initNavigation();
            initLibrary();
            initProfile();
            initGame();
            initModal();
            loadDefaultNote();
        }

        function initData() {
            if (!localStorage.getItem(NOTES_KEY)) {
                localStorage.setItem(NOTES_KEY, JSON.stringify({ notes: [] }));
            }
            if (!localStorage.getItem(CONFIG_KEY)) {
                localStorage.setItem(CONFIG_KEY, JSON.stringify({
                    username: '默认用户',
                    note_font_color: 'black',
                    last_opened_note_id: null
                }));
            }
        }

        function init3DScene() {
            const canvas = document.getElementById('3d-canvas');
            
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a1e1a);
            
            camera = new THREE.PerspectiveCamera(75, canvas.width / canvas.height, 0.1, 1000);
            camera.position.set(10, 10, 10);
            
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
            renderer.setSize(canvas.width, canvas.height);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setClearColor(0x0a1e1a, 1);
            
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 3;
            controls.maxDistance = 100;
            controls.rotateSpeed = 0.8;
            controls.zoomSpeed = 1.2;
            controls.enableZoom = true;
            
            const ambientLight = new THREE.AmbientLight(0xaaffcc, 0.7);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0x7fffd4, 1.2);
            directionalLight.position.set(20, 20, 15);
            scene.add(directionalLight);
            
            const pointLight = new THREE.PointLight(0x7fffd4, 0.6, 60);
            pointLight.position.set(0, 0, 0);
            scene.add(pointLight);
            
            const gridHelper = new THREE.GridHelper(60, 60, 0x7fffd4, 0x004438);
            gridHelper.position.y = -2;
            gridHelper.material.opacity = 0.5;
            gridHelper.material.transparent = true;
            scene.add(gridHelper);
            
            const axesHelper = new THREE.AxesHelper(12);
            scene.add(axesHelper);
            
            canvas.addEventListener('click', onCanvasClick);
            canvas.addEventListener('dblclick', onCanvasDoubleClick);
            canvas.addEventListener('contextmenu', onCanvasRightClick);
            canvas.addEventListener('wheel', (e) => {
                if (isObserving) {
                    e.preventDefault();
                }
            }, { passive: false });
            window.addEventListener('resize', onWindowResize);
            
            animate();
        }

        function createNodeMesh(position, isRoot = false) {
            const geometry = new THREE.BoxGeometry(NODE_SIZE, NODE_SIZE, NODE_SIZE);
            const material = new THREE.MeshPhongMaterial({
                color: isRoot ? 0x153025 : 0x1a3a30,
                shininess: 180,
                specular: 0x7fffd4,
                emissive: 0x002218,
                emissiveIntensity: 0.4
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.copy(position);
            mesh.userData = { isRoot };
            
            const edgesGeometry = new THREE.EdgesGeometry(geometry);
            const edgesMaterial = new THREE.LineBasicMaterial({ 
                color: 0x7fffd4,
                transparent: true,
                opacity: 0.7
            });
            const edges = new THREE.LineSegments(edgesGeometry, edgesMaterial);
            mesh.add(edges);
            
            scene.add(mesh);
            return mesh;
        }

        function createLine(start, end, fromId = null, toId = null) {
            const geometry = new THREE.BufferGeometry().setFromPoints([start, end]);
            const material = new THREE.LineBasicMaterial({ 
                color: 0x7fffd4,
                transparent: true,
                opacity: 0.5,
                linewidth: 2
            });
            const line = new THREE.Line(geometry, material);
            line.userData = { from: fromId, to: toId };
            scene.add(line);
            return line;
        }

        function clearScene() {
            nodeMeshes.forEach(mesh => scene.remove(mesh));
            lines.forEach(line => scene.remove(line));
            nodeMeshes = [];
            lines = [];
            nodes = [];
        }

        function loadNote(note) {
            clearScene();
            currentNote = note;
            nodeIdCounter = 0;
            
            note.nodes.forEach(nodeData => {
                const position = new THREE.Vector3(...nodeData.position);
                const mesh = createNodeMesh(position, !nodeData.parent_id);
                
                nodes.push({
                    id: nodeData.id,
                    parent_id: nodeData.parent_id,
                    position: position,
                    faces: nodeData.faces,
                    mesh: mesh
                });
                
                nodeMeshes.push(mesh);
                
                if (nodeData.parent_id) {
                    const parentNode = nodes.find(n => n.id === nodeData.parent_id);
                    if (parentNode) {
                        const line = createLine(parentNode.position, position, nodeData.parent_id, nodeData.id);
                        lines.push(line);
                    }
                }
                
                const num = parseInt(nodeData.id.replace('node_', ''));
                if (num >= nodeIdCounter) {
                    nodeIdCounter = num + 1;
                }
            });
        }

        function loadDefaultNote() {
            const notes = loadNotesFromStorage();
            if (notes.length === 0) {
                createNewNote();
            } else {
                const config = loadConfig();
                let noteToLoad = notes[0];
                if (config.last_opened_note_id) {
                    const lastNote = notes.find(n => n.id === config.last_opened_note_id);
                    if (lastNote) noteToLoad = lastNote;
                }
                loadNote(noteToLoad);
                updateLibraryUI();
            }
        }

        function createNewNote() {
            const now = new Date();
            const noteName = `笔记_${formatDate(now)}`;
            const newNote = {
                id: `note_${Date.now()}`,
                name: noteName,
                created_at: now.toISOString(),
                modified_at: now.toISOString(),
                nodes: [{
                    id: 'node_0',
                    parent_id: null,
                    position: [0, 0, 0],
                    faces: {
                        front: { content: '', format: [] },
                        back: { content: '', format: [] },
                        right: { content: '', format: [] },
                        left: { content: '', format: [] },
                        top: { content: '', format: [] },
                        bottom: { content: '', format: [] }
                    }
                }]
            };
            
            saveNoteToStorage(newNote);
            loadNote(newNote);
            updateLibraryUI();
        }

        function onCanvasClick(event) {
            if (isObserving) return;
            
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            
            const rect = event.target.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(nodeMeshes);
            
            if (intersects.length > 0) {
                const clickedMesh = intersects[0].object;
                const clickedNode = nodes.find(n => n.mesh === clickedMesh);
                
                if (nodeToMove) {
                    if (clickedNode && clickedNode.id !== nodeToMove.id) {
                        moveNodeToParent(nodeToMove, clickedNode);
                    }
                    
                    nodeToMove.mesh.material.emissiveIntensity = 0.3;
                    nodeToMove.mesh.material.color.setHex(nodeToMove.mesh.userData.isRoot ? 0x0d1a25 : 0x152233);
                    nodeToMove = null;
                    
                    hideModal();
                    return;
                }
                
                if (clickTimer) {
                    clearTimeout(clickTimer);
                    clickTimer = null;
                }
                
                clickTimer = setTimeout(() => {
                    if (confirm('确定要在此节点下添加新节点吗？')) {
                        addChildNode(clickedNode);
                    }
                }, 300);
            }
        }

        function onCanvasDoubleClick(event) {
            if (isObserving || nodeToMove) return;
            
            if (clickTimer) {
                clearTimeout(clickTimer);
                clickTimer = null;
            }
            
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            
            const rect = event.target.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(nodeMeshes);
            
            if (intersects.length > 0) {
                const clickedMesh = intersects[0].object;
                const clickedNode = nodes.find(n => n.mesh === clickedMesh);
                enterObservationMode(clickedNode);
            }
        }

        function onCanvasRightClick(event) {
            event.preventDefault();
            if (isObserving) return;
            
            hideNodeContextMenu();
            
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            
            const rect = event.target.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(nodeMeshes);
            
            if (intersects.length > 0) {
                const clickedMesh = intersects[0].object;
                const clickedNode = nodes.find(n => n.mesh === clickedMesh);
                
                showNodeContextMenu(event.clientX, event.clientY, clickedNode);
            }
        }

        let contextMenuNode = null;

        function showNodeContextMenu(x, y, node) {
            contextMenuNode = node;
            
            let menu = document.getElementById('node-context-menu');
            if (!menu) {
                menu = document.createElement('div');
                menu.id = 'node-context-menu';
                menu.className = 'node-context-menu';
                menu.innerHTML = `
                    <div class="node-context-menu-item" data-action="delete">🗑️ 删除节点</div>
                    <div class="node-context-menu-divider"></div>
                    <div class="node-context-menu-item" data-action="move">🔗 移动节点</div>
                `;
                document.body.appendChild(menu);
                
                menu.querySelectorAll('.node-context-menu-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const action = item.dataset.action;
                        hideNodeContextMenu();
                        
                        if (action === 'delete') {
                            if (contextMenuNode) {
                                deleteNode(contextMenuNode);
                            }
                        } else if (action === 'move') {
                            if (contextMenuNode) {
                                startMoveNode(contextMenuNode);
                            }
                        }
                    });
                });
            }
            
            menu.style.left = x + 'px';
            menu.style.top = y + 'px';
            menu.classList.add('show');
            
            document.addEventListener('click', hideNodeContextMenuHandler);
        }

        function hideNodeContextMenu() {
            const menu = document.getElementById('node-context-menu');
            if (menu) {
                menu.classList.remove('show');
            }
        }

        function hideNodeContextMenuHandler(e) {
            const menu = document.getElementById('node-context-menu');
            if (menu && !menu.contains(e.target)) {
                hideNodeContextMenu();
                document.removeEventListener('click', hideNodeContextMenuHandler);
            }
        }

        function deleteNode(node) {
            if (node.mesh.userData.isRoot) {
                showModal('不能删除根节点');
                return;
            }
            
            const hasChildren = nodes.some(n => n.parent_id === node.id);
            if (hasChildren) {
                if (!confirm('该节点有子节点，删除后子节点将变为根节点。确定继续吗？')) {
                    return;
                }
            }
            
            scene.remove(node.mesh);
            nodeMeshes = nodeMeshes.filter(m => m !== node.mesh);
            
            lines.forEach(line => {
                if (line.userData.from === node.id || line.userData.to === node.id) {
                    scene.remove(line);
                }
            });
            lines = lines.filter(l => l.userData.from !== node.id && l.userData.to !== node.id);
            
            nodes.forEach(n => {
                if (n.parent_id === node.id) {
                    n.parent_id = null;
                    n.mesh.userData.isRoot = true;
                    n.mesh.material.color.setHex(0x0d1a25);
                }
            });
            
            nodes = nodes.filter(n => n.id !== node.id);
            
            saveCurrentNote();
        }

        let nodeToMove = null;

        function startMoveNode(node) {
            if (node.mesh.userData.isRoot) {
                showModal('根节点不能移动');
                return;
            }
            
            nodeToMove = node;
            
            node.mesh.material.emissiveIntensity = 1.2;
            node.mesh.material.color.setHex(0xff6666);
            
            showModal('请点击目标父节点，将该节点移动到目标节点下');
        }

        function hideModal() {
            document.getElementById('modal-overlay').classList.remove('show');
        }

        function moveNodeToParent(node, newParent) {
            lines.forEach(line => {
                if (line.userData.to === node.id) {
                    scene.remove(line);
                }
            });
            lines = lines.filter(l => l.userData.to !== node.id);
            
            const bestDirection = findBestDirection(newParent);
            let newPosition;
            
            if (bestDirection) {
                newPosition = newParent.position.clone().add(bestDirection.clone().normalize().multiplyScalar(NODE_DISTANCE));
            } else {
                const direction = new THREE.Vector3(1, 1, 1);
                newPosition = newParent.position.clone().add(direction.normalize().multiplyScalar(NODE_DISTANCE));
            }
            
            node.parent_id = newParent.id;
            node.position.copy(newPosition);
            node.mesh.position.copy(newPosition);
            
            const line = createLine(newParent.position, node.position, newParent.id, node.id);
            lines.push(line);
            
            saveCurrentNote();
        }

        function addChildNode(parentNode) {
            const childCount = nodes.filter(n => n.parent_id === parentNode.id).length;
            if (childCount >= MAX_CHILDREN) {
                showModal('每节点最多4个子节点');
                return;
            }
            
            if (nodes.length >= MAX_NODES) {
                showModal('单笔记最多100个节点');
                return;
            }
            
            const bestDirection = findBestDirection(parentNode);
            
            if (!bestDirection) {
                showModal('空间密度过大');
                return;
            }
            
            const newPosition = parentNode.position.clone().add(bestDirection.clone().normalize().multiplyScalar(NODE_DISTANCE));
            
            const tooClose = nodes.some(node => {
                const distance = node.position.distanceTo(newPosition);
                return distance < DENSITY_THRESHOLD;
            });
            
            if (tooClose) {
                showModal('空间密度过大');
                return;
            }
            
            const newNodeData = {
                id: `node_${nodeIdCounter++}`,
                parent_id: parentNode.id,
                position: [newPosition.x, newPosition.y, newPosition.z],
                faces: {
                    front: { content: '', format: [] },
                    back: { content: '', format: [] },
                    right: { content: '', format: [] },
                    left: { content: '', format: [] },
                    top: { content: '', format: [] },
                    bottom: { content: '', format: [] }
                }
            };
            
            const newMesh = createNodeMesh(newPosition);
            const newLine = createLine(parentNode.position, newPosition, parentNode.id, newNodeData.id);
            
            nodes.push({
                id: newNodeData.id,
                parent_id: parentNode.id,
                position: newPosition,
                faces: newNodeData.faces,
                mesh: newMesh
            });
            
            nodeMeshes.push(newMesh);
            lines.push(newLine);
            
            currentNote.nodes.push(newNodeData);
            saveCurrentNote();
        }

        function findBestDirection(parentNode) {
            const children = nodes.filter(n => n.parent_id === parentNode.id);
            if (children.length >= DIRECTIONS.length) return null;
            
            const usedIndices = new Set();
            children.forEach(child => {
                DIRECTIONS.forEach((dir, index) => {
                    const childDir = child.position.clone().sub(parentNode.position).normalize();
                    if (childDir.dot(dir) > 0.9) {
                        usedIndices.add(index);
                    }
                });
            });
            
            const availableDirections = DIRECTIONS.filter((_, index) => !usedIndices.has(index));
            if (availableDirections.length === 0) return null;
            
            let bestDir = availableDirections[0];
            let minDensity = Infinity;
            
            availableDirections.forEach(dir => {
                const testPos = parentNode.position.clone().add(dir.clone().normalize().multiplyScalar(NODE_DISTANCE));
                let density = 0;
                
                nodes.forEach(node => {
                    const distance = node.position.distanceTo(testPos);
                    if (distance < NODE_DISTANCE * 2) {
                        density += 1 / (distance + 0.1);
                    }
                });
                
                if (density < minDensity) {
                    minDensity = density;
                    bestDir = dir;
                }
            });
            
            return bestDir;
        }

        function initObservationScene() {
            const obsCanvas = document.getElementById('observation-canvas');
            
            obsScene = new THREE.Scene();
            obsScene.background = new THREE.Color(0x0a1e1a);
            
            obsCamera = new THREE.PerspectiveCamera(55, obsCanvas.width / obsCanvas.height, 0.1, 100);
            obsCamera.position.set(5, 5, 5);
            obsCamera.lookAt(0, 0, 0);
            
            obsRenderer = new THREE.WebGLRenderer({ canvas: obsCanvas, antialias: true });
            obsRenderer.setSize(obsCanvas.width, obsCanvas.height);
            obsRenderer.setPixelRatio(window.devicePixelRatio);
            
            obsControls = new OrbitControls(obsCamera, obsRenderer.domElement);
            obsControls.enableDamping = true;
            obsControls.dampingFactor = 0.05;
            obsControls.minDistance = 1.5;
            obsControls.maxDistance = 20;
            obsControls.rotateSpeed = 0.8;
            obsControls.zoomSpeed = 1.8;
            obsControls.enablePan = false;
            obsControls.target.set(0, 0, 0);
            
            const obsLight = new THREE.DirectionalLight(0xaaffcc, 1.8);
            obsLight.position.set(8, 8, 6);
            obsScene.add(obsLight);
            
            const obsAmbient = new THREE.AmbientLight(0xccffdd, 0.9);
            obsScene.add(obsAmbient);
            
            const obsPointLight = new THREE.PointLight(0x7fffd4, 1.2, 30);
            obsPointLight.position.set(3, 3, 4);
            obsScene.add(obsPointLight);
            
            const obsGeometry = new THREE.BoxGeometry(NODE_SIZE * 4, NODE_SIZE * 4, NODE_SIZE * 4);
            const obsMaterial = new THREE.MeshPhongMaterial({ 
                color: 0x255545, 
                shininess: 150,
                specular: 0xaaffcc,
                emissive: 0x006655,
                emissiveIntensity: 0.5,
                side: THREE.DoubleSide
            });
            obsMesh = new THREE.Mesh(obsGeometry, obsMaterial);
            
            const obsEdgesGeometry = new THREE.EdgesGeometry(obsGeometry);
            const obsEdgesMaterial = new THREE.LineBasicMaterial({ 
                color: 0x7fffd4,
                transparent: true,
                opacity: 0.9
            });
            const obsEdges = new THREE.LineSegments(obsEdgesGeometry, obsEdgesMaterial);
            obsMesh.add(obsEdges);
            
            obsScene.add(obsMesh);
            
            obsCanvas.addEventListener('click', (e) => {
                if (!isObserving || !selectedNode) return;
                
                const rect = obsCanvas.getBoundingClientRect();
                const mouse = new THREE.Vector2();
                mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
                
                const raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(mouse, obsCamera);
                
                const intersects = raycaster.intersectObject(obsMesh);
                if (intersects.length > 0) {
                    const faceIndex = intersects[0].faceIndex;
                    const face = getFaceFromIndex(faceIndex);
                    if (face) {
                        loadNodeFace(selectedNode, face);
                    }
                }
            });
            
            function obsAnimate() {
                obsAnimationId = requestAnimationFrame(obsAnimate);
                obsControls.update();
                obsRenderer.render(obsScene, obsCamera);
            }
            
            obsAnimate();
        }

        function enterObservationMode(node) {
            isObserving = true;
            selectedNode = node;
            
            nodeMeshes.forEach(mesh => {
                mesh.material.opacity = 0.15;
                mesh.material.transparent = true;
                if (mesh.children.length > 0) {
                    mesh.children[0].material.opacity = 0.2;
                }
            });
            
            node.mesh.material.opacity = 1;
            node.mesh.material.transparent = false;
            node.mesh.material.emissiveIntensity = 0.6;
            if (node.mesh.children.length > 0) {
                node.mesh.children[0].material.opacity = 1;
            }
            
            controls.enabled = false;
            controls.enableZoom = false;
            
            document.getElementById('observation-node').style.display = 'block';
            document.getElementById('projection-panel').style.display = 'block';
            
            loadNodeFace(node, currentFace);
            
            if (!obsScene) {
                initObservationScene();
            }
            
            if (obsMesh) {
                obsMesh.rotation.set(0, 0, 0);
            }
        }

        function exitObservationMode() {
            if (!isObserving) return;
            
            isObserving = false;
            selectedNode = null;
            
            nodeMeshes.forEach(mesh => {
                mesh.material.opacity = 1;
                mesh.material.transparent = false;
                mesh.material.emissiveIntensity = 0.3;
                if (mesh.children.length > 0) {
                    mesh.children[0].material.opacity = 0.6;
                }
            });
            
            controls.enabled = true;
            controls.enableZoom = true;
            
            document.getElementById('observation-node').style.display = 'none';
            document.getElementById('projection-panel').style.display = 'none';
            
            saveCurrentNote();
        }

        function loadNodeFace(node, face) {
            currentFace = face;
            
            document.querySelectorAll('.face-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.face === face);
            });
            
            const faceData = node.faces[face];
            const editArea = document.getElementById('edit-area');
            
            if (faceData && faceData.content) {
                editArea.value = faceData.content;
            } else {
                editArea.value = '';
            }
            
            updateWordCount();
        }

        function initNavigation() {
            const switches = document.querySelectorAll('.toggle-switch');
            
            switches.forEach(sw => {
                sw.addEventListener('click', () => {
                    const panelId = sw.dataset.panel;
                    
                    if (sw.classList.contains('active')) return;
                    
                    if (isObserving && panelId !== 'notes') {
                        exitObservationMode();
                    }
                    
                    switches.forEach(s => s.classList.remove('active'));
                    sw.classList.add('active');
                    
                    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                    document.getElementById(`${panelId}-panel`).classList.add('active');
                    
                    if (panelId === 'notes' && currentNote) {
                        saveCurrentNote();
                    }
                });
            });
        }

        function initLibrary() {
            document.getElementById('new-note-btn').addEventListener('click', () => createNewNote());
            
            document.addEventListener('contextmenu', (e) => {
                e.preventDefault();
            });
            
            const notesGrid = document.getElementById('notes-grid');
            notesGrid.addEventListener('contextmenu', (e) => {
                const card = e.target.closest('.note-card');
                if (card) {
                    e.preventDefault();
                    showContextMenu(e.clientX, e.clientY, card.dataset.noteId);
                }
            });
            
            notesGrid.addEventListener('dblclick', (e) => {
                const card = e.target.closest('.note-card');
                if (card) {
                    const noteId = card.dataset.noteId;
                    openNote(noteId);
                }
            });
        }

        function updateLibraryUI() {
            const notes = loadNotesFromStorage();
            const grid = document.getElementById('notes-grid');
            const emptyState = document.getElementById('library-empty');
            
            grid.innerHTML = '';
            
            if (notes.length === 0) {
                emptyState.style.display = 'flex';
                return;
            }
            
            emptyState.style.display = 'none';
            
            const sortedNotes = [...notes].sort((a, b) => new Date(b.modified_at) - new Date(a.modified_at));
            
            sortedNotes.forEach(note => {
                const card = document.createElement('div');
                card.className = 'note-card';
                card.dataset.noteId = note.id;
                
                const date = new Date(note.modified_at);
                const dateStr = `${date.getFullYear()}-${padZero(date.getMonth() + 1)}-${padZero(date.getDate())} ${padZero(date.getHours())}:${padZero(date.getMinutes())}`;
                
                card.innerHTML = `
                    <div class="note-name">${note.name}</div>
                    <div class="note-meta">修改时间: ${dateStr}</div>
                    <div class="note-meta">节点数: ${note.nodes.length}</div>
                `;
                
                grid.appendChild(card);
            });
        }

        function showContextMenu(x, y, noteId) {
            let menu = document.getElementById('context-menu');
            if (!menu) {
                menu = document.createElement('div');
                menu.id = 'context-menu';
                menu.className = 'context-menu';
                menu.innerHTML = `
                    <div class="context-menu-item rename">重命名</div>
                    <div class="context-menu-item danger delete">删除</div>
                `;
                document.body.appendChild(menu);
            }
            
            menu.style.left = x + 'px';
            menu.style.top = y + 'px';
            menu.classList.add('show');
            
            menu.querySelector('.rename').onclick = () => {
                renameNote(noteId);
                menu.classList.remove('show');
            };
            
            menu.querySelector('.delete').onclick = () => {
                deleteNote(noteId);
                menu.classList.remove('show');
            };
            
            document.addEventListener('click', function hideMenu() {
                menu.classList.remove('show');
                document.removeEventListener('click', hideMenu);
            }, { once: true });
        }

        function renameNote(noteId) {
            const notes = loadNotesFromStorage();
            const note = notes.find(n => n.id === noteId);
            
            if (note) {
                const newName = prompt('请输入新名称:', note.name);
                if (newName && newName.trim()) {
                    note.name = newName.trim();
                    note.modified_at = new Date().toISOString();
                    saveNotesToStorage(notes);
                    updateLibraryUI();
                }
            }
        }

        function deleteNote(noteId) {
            if (!confirm('确定要删除这个笔记吗？')) return;
            
            const notes = loadNotesFromStorage();
            const newNotes = notes.filter(n => n.id !== noteId);
            
            saveNotesToStorage(newNotes);
            updateLibraryUI();
            
            if (currentNote && currentNote.id === noteId) {
                if (newNotes.length > 0) {
                    loadNote(newNotes[0]);
                } else {
                    createNewNote();
                }
            }
        }

        function openNote(noteId) {
            const notes = loadNotesFromStorage();
            const note = notes.find(n => n.id === noteId);
            
            if (note) {
                document.querySelectorAll('.toggle-switch').forEach(s => s.classList.remove('active'));
                document.querySelector('[data-panel="notes"]').classList.add('active');
                
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                document.getElementById('notes-panel').classList.add('active');
                
                loadNote(note);
                
                const config = loadConfig();
                config.last_opened_note_id = noteId;
                saveConfig(config);
            }
        }

        function initProfile() {
            const config = loadConfig();
            
            document.getElementById('username-input').value = config.username;
            document.querySelector(`[data-color="${config.note_font_color}"]`).classList.add('active');
            
            document.getElementById('save-username-btn').addEventListener('click', () => {
                const username = document.getElementById('username-input').value.trim();
                if (username) {
                    const config = loadConfig();
                    config.username = username;
                    saveConfig(config);
                    showModal('用户名已保存');
                }
            });
            
            document.querySelectorAll('.color-option').forEach(option => {
                option.addEventListener('click', () => {
                    document.querySelectorAll('.color-option').forEach(o => o.classList.remove('active'));
                    option.classList.add('active');
                    
                    const config = loadConfig();
                    config.note_font_color = option.dataset.color;
                    saveConfig(config);
                });
            });
            
            document.querySelectorAll('.sidebar-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    document.querySelectorAll('.profile-section').forEach(s => s.classList.remove('active'));
                    document.getElementById(`${btn.dataset.section}-section`).classList.add('active');
                });
            });
        }

        function initGame() {
            const canvas = document.getElementById('game-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 600;
            canvas.height = 400;
            
            let gameRunning = false;
            let score = 0;
            let lives = 3;
            let ball = { x: 300, y: 380, dx: 4, dy: -4, radius: 8 };
            let paddle = { x: 250, y: 390, width: 100, height: 10 };
            let bricks = [];
            let scanline = 0;
            
            const brickColors = ['#ff00ff', '#00ffff', '#ffff00', '#ff0000', '#00ff00'];
            
            function initBricks() {
                bricks = [];
                for (let row = 0; row < 5; row++) {
                    for (let col = 0; col < 10; col++) {
                        bricks.push({
                            x: col * 60 + 5,
                            y: row * 25 + 30,
                            width: 55,
                            height: 20,
                            color: brickColors[row],
                            visible: true,
                            hits: row < 2 ? 2 : 1
                        });
                    }
                }
            }
            
            function draw() {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                scanline = (scanline + 2) % canvas.height;
                ctx.fillStyle = 'rgba(0, 200, 200, 0.03)';
                ctx.fillRect(0, scanline, canvas.width, 4);
                
                ctx.fillStyle = '#00ffff';
                ctx.shadowColor = '#00ffff';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#00ffff';
                ctx.shadowColor = '#00ffff';
                ctx.shadowBlur = 15;
                ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
                
                bricks.forEach(brick => {
                    if (brick.visible) {
                        ctx.fillStyle = brick.color;
                        ctx.shadowColor = brick.color;
                        ctx.shadowBlur = 10;
                        
                        if (Math.random() < 0.1) {
                            ctx.globalAlpha = 0.5;
                        }
                        
                        ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
                        ctx.globalAlpha = 1;
                        
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(brick.x, brick.y, brick.width, brick.height);
                    }
                });
                
                ctx.shadowBlur = 0;
            }
            
            function update() {
                ball.x += ball.dx;
                ball.y += ball.dy;
                
                if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) {
                    ball.dx = -ball.dx;
                }
                
                if (ball.y - ball.radius < 0) {
                    ball.dy = -ball.dy;
                }
                
                if (ball.y + ball.radius > canvas.height) {
                    lives--;
                    document.getElementById('lives').textContent = lives;
                    
                    if (lives <= 0) {
                        gameRunning = false;
                        showModal(`游戏结束！得分: ${score}`);
                        return;
                    }
                    
                    resetBall();
                }
                
                if (ball.y + ball.radius > paddle.y &&
                    ball.x > paddle.x &&
                    ball.x < paddle.x + paddle.width) {
                    ball.dy = -Math.abs(ball.dy);
                    ball.dx += (ball.x - (paddle.x + paddle.width / 2)) * 0.1;
                }
                
                bricks.forEach(brick => {
                    if (brick.visible) {
                        if (ball.x + ball.radius > brick.x &&
                            ball.x - ball.radius < brick.x + brick.width &&
                            ball.y + ball.radius > brick.y &&
                            ball.y - ball.radius < brick.y + brick.height) {
                            
                            ball.dy = -ball.dy;
                            brick.hits--;
                            
                            if (brick.hits <= 0) {
                                brick.visible = false;
                                score += 10;
                                document.getElementById('score').textContent = score;
                            }
                        }
                    }
                });
                
                const allCleared = bricks.every(b => !b.visible);
                if (allCleared) {
                    gameRunning = false;
                    showModal(`恭喜过关！得分: ${score}`);
                    initBricks();
                }
            }
            
            function resetBall() {
                ball.x = 300;
                ball.y = 380;
                ball.dx = 4 * (Math.random() > 0.5 ? 1 : -1);
                ball.dy = -4;
            }
            
            function gameLoop() {
                if (gameRunning) {
                    draw();
                    update();
                    requestAnimationFrame(gameLoop);
                }
            }
            
            canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                paddle.x = mouseX - paddle.width / 2;
                
                if (paddle.x < 0) paddle.x = 0;
                if (paddle.x + paddle.width > canvas.width) paddle.x = canvas.width - paddle.width;
            });
            
            document.getElementById('start-game-btn').addEventListener('click', () => {
                if (!gameRunning) {
                    gameRunning = true;
                    initBricks();
                    score = 0;
                    lives = 3;
                    document.getElementById('score').textContent = score;
                    document.getElementById('lives').textContent = lives;
                    resetBall();
                    gameLoop();
                }
            });
            
            document.getElementById('restart-game-btn').addEventListener('click', () => {
                gameRunning = false;
                initBricks();
                score = 0;
                lives = 3;
                document.getElementById('score').textContent = score;
                document.getElementById('lives').textContent = lives;
                resetBall();
                draw();
            });
            
            initBricks();
            draw();
        }

        function initModal() {
            document.getElementById('modal-close').addEventListener('click', () => {
                document.getElementById('modal-overlay').classList.remove('show');
            });
        }

        function showModal(message) {
            document.getElementById('modal-message').textContent = message;
            document.getElementById('modal-overlay').classList.add('show');
        }

        function onWindowResize() {
            const canvas = document.getElementById('3d-canvas');
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            camera.aspect = canvas.width / canvas.height;
            camera.updateProjectionMatrix();
            renderer.setSize(canvas.width, canvas.height);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            
            updateAxisIndicator();
        }

        function updateAxisIndicator() {
            const axisIndicator = document.getElementById('axis-indicator');
            if (!axisIndicator) return;
            
            const euler = new THREE.Euler().setFromQuaternion(camera.quaternion);
            axisIndicator.style.transform = `rotateX(${-euler.x * 180 / Math.PI}deg) rotateY(${euler.y * 180 / Math.PI}deg)`;
        }

        function getFaceFromIndex(faceIndex) {
            const faceMap = [
                'right', 'right', 'right', 'right',
                'left', 'left', 'left', 'left',
                'top', 'top', 'top', 'top',
                'bottom', 'bottom', 'bottom', 'bottom',
                'front', 'front', 'front', 'front',
                'back', 'back', 'back', 'back'
            ];
            return faceMap[faceIndex] || null;
        }

        function loadNotesFromStorage() {
            try {
                const data = localStorage.getItem(NOTES_KEY);
                const parsed = JSON.parse(data);
                return parsed.notes || [];
            } catch {
                return [];
            }
        }

        function saveNotesToStorage(notes) {
            localStorage.setItem(NOTES_KEY, JSON.stringify({ notes }));
        }

        function saveNoteToStorage(note) {
            const notes = loadNotesFromStorage();
            notes.push(note);
            saveNotesToStorage(notes);
        }

        function saveCurrentNote() {
            if (!currentNote) return;
            
            currentNote.nodes = nodes.map(node => ({
                id: node.id,
                parent_id: node.parent_id,
                position: [node.position.x, node.position.y, node.position.z],
                faces: node.faces
            }));
            
            currentNote.modified_at = new Date().toISOString();
            
            const notes = loadNotesFromStorage();
            const index = notes.findIndex(n => n.id === currentNote.id);
            if (index >= 0) {
                notes[index] = currentNote;
            } else {
                notes.push(currentNote);
            }
            
            saveNotesToStorage(notes);
            
            const config = loadConfig();
            config.last_opened_note_id = currentNote.id;
            saveConfig(config);
        }

        function loadConfig() {
            try {
                const data = localStorage.getItem(CONFIG_KEY);
                const parsed = JSON.parse(data);
                return {
                    username: parsed.username || '默认用户',
                    note_font_color: parsed.note_font_color || 'black',
                    last_opened_note_id: parsed.last_opened_note_id || null
                };
            } catch {
                return {
                    username: '默认用户',
                    note_font_color: 'black',
                    last_opened_note_id: null
                };
            }
        }

        function saveConfig(config) {
            localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
        }

        function formatDate(date) {
            return `${date.getFullYear()}-${padZero(date.getMonth() + 1)}-${padZero(date.getDate())}_${padZero(date.getHours())}:${padZero(date.getMinutes())}`;
        }

        function padZero(num) {
            return num.toString().padStart(2, '0');
        }

        function updateWordCount() {
            const editArea = document.getElementById('edit-area');
            const text = editArea.value || '';
            const count = text.length;
            document.querySelector('.word-count').textContent = `${count}/${MAX_WORDS}`;
        }

        document.getElementById('edit-area').addEventListener('focus', () => {
            if (!isObserving) return;
            editingMode = true;
        });

        document.getElementById('edit-area').addEventListener('blur', () => {
            if (!editingMode) return;
            editingMode = false;
            
            if (selectedNode) {
                const text = document.getElementById('edit-area').value.substring(0, MAX_WORDS);
                selectedNode.faces[currentFace].content = text;
                saveCurrentNote();
            }
            
            updateWordCount();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (editingMode) {
                    document.getElementById('edit-area').blur();
                } else if (isObserving) {
                    exitObservationMode();
                }
            }
        });

        document.getElementById('edit-area').addEventListener('input', () => {
            const editArea = document.getElementById('edit-area');
            const text = editArea.value || '';
            
            if (text.length > MAX_WORDS) {
                editArea.value = text.substring(0, MAX_WORDS);
            }
            
            updateWordCount();
        });

        document.querySelectorAll('.face-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (selectedNode) {
                    loadNodeFace(selectedNode, btn.dataset.face);
                }
            });
        });

        document.getElementById('exit-observation-btn').addEventListener('click', () => {
            exitObservationMode();
        });

        document.getElementById('3d-canvas').addEventListener('click', (e) => {
            if (isObserving && e.target === document.getElementById('3d-canvas')) {
                exitObservationMode();
            }
        });

        window.addEventListener('beforeunload', () => {
            if (currentNote) {
                saveCurrentNote();
            }
        });

        init();
    </script>
</body>
