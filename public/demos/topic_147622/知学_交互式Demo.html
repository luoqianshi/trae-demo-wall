<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知学 · 私人AI教师教育框架 — 交互式Demo</title>
<style>
/* ========== 主题变量 ========== */
:root {
  --bg: #fdfdfb;
  --bg-elev: #f5f3ee;
  --bg-card: #ffffff;
  --bg-hover: #efece4;
  --fg: #2b2b2b;
  --fg-muted: #6b6b6b;
  --fg-dim: #9a9a9a;
  --accent: #8a1538;
  --accent-soft: #b85574;
  --gold: #b8860b;
  --green: #2d5016;
  --green-soft: #4a7c2f;
  --brick: #a04040;
  --border: #e0ddd5;
  --border-strong: #c9c4b8;
  --correct: #2d5016;
  --correct-bg: #e8efe0;
  --wrong: #a02828;
  --wrong-bg: #f3e0e0;
  --shadow: 0 1px 3px rgba(43,43,43,0.06), 0 1px 2px rgba(43,43,43,0.04);
  --shadow-lg: 0 4px 16px rgba(43,43,43,0.08), 0 2px 6px rgba(43,43,43,0.04);
  --font-serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, "Source Han Serif SC", "Noto Serif SC", "Songti SC", serif;
  --font-sans: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", "Cascadia Code", Consolas, monospace;
}
[data-theme="dark"] {
  --bg: #1a1a1a;
  --bg-elev: #222020;
  --bg-card: #252323;
  --bg-hover: #2e2b2b;
  --fg: #e0ddd5;
  --fg-muted: #a59f96;
  --fg-dim: #6f6a62;
  --accent: #d49aa8;
  --accent-soft: #b85574;
  --gold: #d4a93b;
  --green: #7fae5a;
  --green-soft: #5a8a3f;
  --brick: #c87878;
  --border: #3a3636;
  --border-strong: #4a4444;
  --correct: #7fae5a;
  --correct-bg: #2a3a22;
  --wrong: #d87878;
  --wrong-bg: #3a2222;
  --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.4), 0 2px 6px rgba(0,0,0,0.3);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.6;
  color: var(--fg);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea { font-family: inherit; }

/* ========== 整体布局 ========== */
.app {
  display: grid;
  grid-template-rows: 48px 1fr;
  height: 100vh;
}
.titlebar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  background: var(--bg-elev);
  border-bottom: 1px solid var(--border);
  font-family: var(--font-serif);
}
.titlebar .brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.5px;
}
.titlebar .brand .mark {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-serif);
  font-size: 13px;
  font-weight: 700;
}
.titlebar .crumb {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--fg-muted);
  margin-left: 12px;
  letter-spacing: 0;
}
.titlebar .tools { display: flex; align-items: center; gap: 8px; }
.titlebar .tools .meta {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--fg-dim);
  letter-spacing: 0.3px;
}
.theme-toggle {
  width: 32px; height: 28px;
  border-radius: 6px;
  border: 1px solid var(--border-strong);
  background: var(--bg-card);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
  transition: all 0.2s;
}
.theme-toggle:hover { background: var(--bg-hover); }

.workspace {
  display: grid;
  grid-template-columns: 248px 1fr 320px;
  overflow: hidden;
}

/* ========== 左栏 ========== */
.left {
  background: var(--bg-elev);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.left .section {
  padding: 10px 12px 6px;
  border-bottom: 1px solid var(--border);
}
.left .section-title {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--fg-dim);
  margin-bottom: 8px;
}
.cmd-list { display: flex; flex-direction: column; gap: 2px; }
.cmd-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border-radius: 5px;
  font-size: 12px;
  color: var(--fg);
  transition: background 0.15s;
  text-align: left;
  width: 100%;
}
.cmd-item:hover { background: var(--bg-hover); }
.cmd-item.active { background: var(--accent); color: #fff; }
.cmd-item.active .cmd-desc { color: rgba(255,255,255,0.8); }
.cmd-item .cmd-name {
  font-family: var(--font-mono);
  font-size: 11.5px;
  font-weight: 600;
}
.cmd-item .cmd-desc {
  font-size: 10.5px;
  color: var(--fg-muted);
  margin-left: auto;
}

.progress-section { padding: 10px 12px; border-bottom: 1px solid var(--border); }
.progress-bar {
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
  margin-top: 4px;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent-soft));
  width: 17%;
  transition: width 0.6s ease;
}
.progress-meta {
  display: flex;
  justify-content: space-between;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--fg-muted);
  margin-top: 4px;
}

.loop-section {
  padding: 10px 12px;
  flex: 1;
  overflow-y: auto;
}
.loop-steps { display: flex; flex-direction: column; gap: 4px; }
.loop-step {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 6px;
  border-radius: 4px;
  font-size: 11.5px;
  transition: background 0.15s;
}
.loop-step .num {
  width: 18px; height: 18px;
  border-radius: 50%;
  border: 1px solid var(--border-strong);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  flex-shrink: 0;
  background: var(--bg-card);
  color: var(--fg-muted);
}
.loop-step.done .num { background: var(--green); color: #fff; border-color: var(--green); }
.loop-step.current .num { background: var(--accent); color: #fff; border-color: var(--accent); }
.loop-step.current { background: var(--bg-hover); }
.loop-step .label { color: var(--fg-muted); }
.loop-step.done .label, .loop-step.current .label { color: var(--fg); }

/* ========== 中栏 ========== */
.middle {
  display: flex;
  flex-direction: column;
  background: var(--bg);
  overflow: hidden;
}
.tab-bar {
  height: 32px;
  display: flex;
  align-items: center;
  border-bottom: 1px solid var(--border);
  background: var(--bg-elev);
  padding: 0 8px;
  gap: 4px;
}
.tab {
  padding: 4px 12px;
  border-radius: 4px 4px 0 0;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--fg-muted);
  display: flex;
  align-items: center;
  gap: 6px;
}
.tab.active {
  background: var(--bg);
  color: var(--fg);
  border: 1px solid var(--border);
  border-bottom: 1px solid var(--bg);
  margin-bottom: -1px;
}
.tab .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 20px 28px;
}
.welcome {
  max-width: 720px;
  margin: 40px auto;
  text-align: center;
}
.welcome .emblem {
  width: 64px; height: 64px;
  margin: 0 auto 20px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-serif);
  font-size: 32px;
  font-weight: 700;
  box-shadow: var(--shadow-lg);
}
.welcome h1 {
  font-family: var(--font-serif);
  font-size: 28px;
  font-weight: 600;
  letter-spacing: 1px;
  margin-bottom: 8px;
}
.welcome .subtitle {
  font-size: 13px;
  color: var(--fg-muted);
  margin-bottom: 24px;
}
.welcome .quote {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 14px;
  color: var(--fg-muted);
  margin: 20px auto;
  max-width: 480px;
  padding: 12px 20px;
  border-left: 2px solid var(--accent);
  text-align: left;
}
.welcome .hints {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-top: 24px;
}
.welcome .hint {
  padding: 6px 12px;
  border: 1px solid var(--border-strong);
  border-radius: 14px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--fg-muted);
  cursor: pointer;
  transition: all 0.15s;
}
.welcome .hint:hover { background: var(--bg-hover); color: var(--accent); border-color: var(--accent); }

.msg {
  max-width: 760px;
  margin: 0 auto 18px;
  display: flex;
  gap: 12px;
  animation: msgIn 0.4s ease;
}
@keyframes msgIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.msg .avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-serif);
  font-size: 13px;
  font-weight: 700;
}
.msg.user .avatar { background: var(--gold); color: #fff; }
.msg.ai .avatar { background: var(--accent); color: #fff; }
.msg .body { flex: 1; min-width: 0; }
.msg .name {
  font-size: 11px;
  font-weight: 600;
  color: var(--fg-muted);
  margin-bottom: 3px;
  letter-spacing: 0.3px;
}
.msg .content {
  font-size: 13px;
  line-height: 1.7;
  color: var(--fg);
}
.msg .content p { margin-bottom: 8px; }
.msg .content p:last-child { margin-bottom: 0; }
.msg .content strong { color: var(--accent); font-weight: 600; }
.msg .content code {
  font-family: var(--font-mono);
  font-size: 11.5px;
  background: var(--bg-elev);
  padding: 1px 5px;
  border-radius: 3px;
  color: var(--accent);
}

/* AI回复中的卡片块 */
.block {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  margin: 8px 0;
  overflow: hidden;
}
.block-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--bg-elev);
  border-bottom: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--fg-muted);
}
.block-header .badge {
  font-size: 9.5px;
  padding: 1px 6px;
  border-radius: 3px;
  background: var(--accent);
  color: #fff;
  letter-spacing: 0.5px;
}
.block-header .badge.green { background: var(--green); }
.block-header .badge.gold { background: var(--gold); }
.block-header .badge.muted { background: var(--border-strong); color: var(--fg-muted); }
.block-body { padding: 12px; font-size: 12.5px; line-height: 1.65; }
.block-body table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.block-body th, .block-body td {
  padding: 6px 8px;
  text-align: left;
  border-bottom: 1px solid var(--border);
}
.block-body th {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--fg-muted);
  background: var(--bg-elev);
}
.block-body td.num, .block-body th.num { text-align: right; font-family: var(--font-mono); }
.block-body ul { padding-left: 18px; margin: 6px 0; }
.block-body li { margin-bottom: 3px; }

/* 教学流程卡片 */
.teach-step {
  border: 1px solid var(--border);
  border-radius: 6px;
  margin: 8px 0;
  background: var(--bg-card);
}
.teach-step-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  cursor: pointer;
  user-select: none;
}
.teach-step-head:hover { background: var(--bg-hover); }
.teach-step-head .step-num {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--bg-elev);
  border: 1px solid var(--border-strong);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  flex-shrink: 0;
}
.teach-step.active .step-num { background: var(--accent); color: #fff; border-color: var(--accent); }
.teach-step-head .step-title {
  flex: 1;
  font-size: 12.5px;
  font-weight: 500;
}
.teach-step-head .chev {
  font-size: 10px;
  color: var(--fg-dim);
  transition: transform 0.2s;
}
.teach-step.expanded .chev { transform: rotate(90deg); }
.teach-step-body {
  display: none;
  padding: 0 12px 12px 44px;
  font-size: 12px;
  color: var(--fg-muted);
  line-height: 1.65;
}
.teach-step.expanded .teach-step-body { display: block; }

/* 选择题 */
.choice-q {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px;
  margin: 8px 0;
}
.choice-q .q-text { font-size: 12.5px; margin-bottom: 8px; }
.choice-options { display: flex; flex-direction: column; gap: 6px; }
.choice-opt {
  padding: 7px 10px;
  border: 1px solid var(--border-strong);
  border-radius: 5px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  background: var(--bg-card);
  display: flex;
  align-items: center;
  gap: 8px;
}
.choice-opt:hover { background: var(--bg-hover); border-color: var(--accent); }
.choice-opt .marker {
  width: 16px; height: 16px;
  border: 1px solid var(--border-strong);
  border-radius: 50%;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
}
.choice-opt.correct { background: var(--correct-bg); border-color: var(--correct); color: var(--correct); }
.choice-opt.correct .marker { background: var(--correct); color: #fff; border-color: var(--correct); }
.choice-opt.wrong { background: var(--wrong-bg); border-color: var(--wrong); color: var(--wrong); }
.choice-opt.wrong .marker { background: var(--wrong); color: #fff; border-color: var(--wrong); }
.choice-opt.disabled { cursor: default; pointer-events: none; }

/* 填空/简答 */
.input-q { margin: 8px 0; }
.input-q .q-text { font-size: 12.5px; margin-bottom: 6px; }
.input-q input, .input-q textarea {
  width: 100%;
  padding: 7px 10px;
  border: 1px solid var(--border-strong);
  border-radius: 5px;
  font-size: 12px;
  background: var(--bg-card);
  color: var(--fg);
  resize: vertical;
}
.input-q input:focus, .input-q textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(138,21,56,0.1);
}
.input-q textarea { min-height: 50px; font-family: var(--font-sans); }
.input-q .submit-btn {
  margin-top: 6px;
  padding: 5px 14px;
  background: var(--accent);
  color: #fff;
  border-radius: 4px;
  font-size: 11.5px;
  font-weight: 500;
}
.input-q .submit-btn:hover { background: var(--accent-soft); }

.feedback {
  margin-top: 8px;
  padding: 8px 10px;
  border-radius: 5px;
  font-size: 11.5px;
  line-height: 1.5;
  display: none;
}
.feedback.show { display: block; animation: msgIn 0.3s ease; }
.feedback.correct { background: var(--correct-bg); color: var(--correct); border: 1px solid var(--correct); }
.feedback.wrong { background: var(--wrong-bg); color: var(--wrong); border: 1px solid var(--wrong); }
.feedback .label { font-weight: 600; display: block; margin-bottom: 2px; }
.feedback .attr { font-size: 10.5px; opacity: 0.85; margin-top: 4px; font-family: var(--font-mono); }

/* 推荐算法可视化 */
.factor-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 6px 0;
  font-size: 11.5px;
}
.factor-bar .name {
  width: 110px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--fg-muted);
}
.factor-bar .track {
  flex: 1;
  height: 16px;
  background: var(--bg-elev);
  border-radius: 3px;
  overflow: hidden;
  border: 1px solid var(--border);
}
.factor-bar .fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.6s ease;
}
.factor-bar .fill.zpd { background: var(--accent); }
.factor-bar .fill.err { background: var(--gold); }
.factor-bar .fill.mis { background: var(--green); }
.factor-bar .weight {
  width: 36px;
  text-align: right;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--fg-muted);
}

.task-card {
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: 4px;
  padding: 10px 12px;
  margin: 8px 0;
  background: var(--bg-card);
  font-size: 12px;
}
.task-card .task-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}
.task-card .task-id { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-muted); }
.task-card .task-score { font-family: var(--font-mono); font-size: 12px; color: var(--accent); font-weight: 600; }
.task-card .task-title { font-weight: 500; margin-bottom: 4px; }
.task-card .task-factors {
  font-size: 10.5px;
  color: var(--fg-muted);
  font-family: var(--font-mono);
}

/* 复习调度 */
.review-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 5px;
  margin: 6px 0;
  font-size: 12px;
  background: var(--bg-card);
}
.review-row.due { border-left: 3px solid var(--accent); }
.review-row.future { border-left: 3px solid var(--border-strong); }
.review-row .date {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--fg-muted);
  width: 56px;
}
.review-row .topic { flex: 1; }
.review-row .interval {
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 3px;
  background: var(--bg-elev);
  color: var(--fg-muted);
}
.review-row.due .interval { background: var(--accent); color: #fff; }

.curve-legend {
  display: flex;
  gap: 12px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--fg-muted);
  margin: 8px 0;
  flex-wrap: wrap;
}
.curve-legend span { display: flex; align-items: center; gap: 4px; }
.curve-legend .dot { width: 8px; height: 8px; border-radius: 50%; }

/* 输入框 */
.composer {
  border-top: 1px solid var(--border);
  padding: 12px 28px 16px;
  background: var(--bg);
}
.composer-box {
  max-width: 760px;
  margin: 0 auto;
}
.composer-input {
  display: flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  padding: 8px 12px;
  background: var(--bg-card);
  transition: border-color 0.15s;
}
.composer-input:focus-within { border-color: var(--accent); }
.composer-input .prompt { color: var(--accent); font-family: var(--font-mono); font-weight: 600; }
.composer-input input {
  flex: 1;
  border: none;
  background: none;
  color: var(--fg);
  font-size: 13px;
  outline: none;
}
.composer-input input::placeholder { color: var(--fg-dim); }
.composer-input .send {
  padding: 3px 10px;
  border-radius: 4px;
  background: var(--accent);
  color: #fff;
  font-size: 11px;
  font-weight: 500;
}
.quick-cmds {
  display: flex;
  gap: 6px;
  margin-top: 8px;
  flex-wrap: wrap;
}
.quick-cmd {
  padding: 3px 9px;
  border: 1px solid var(--border);

}
.thinking .dot:nth-child(2) { animation-delay: 0.2s; }
.thinking .dot:nth-child(3) { animation-delay: 0.4s; }

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// ============ 渲染左栏九步闭环 ============
function renderLoop() {
  loopSteps.innerHTML = "";
  D.loop.forEach((step, i) => {
    const idx = i + 1;
    const div = document.createElement("div");
    let cls = "loop-step";
    if (S.completedSteps.has(idx)) cls += " done";
    if (idx === S.currentStep) cls += " current";
    div.className = cls;
    div.innerHTML = `<div class="num">${idx}</div><div class="label">${step.name}</div>`;
    loopSteps.appendChild(div);
  });
}

function setLoopStep(idx) {
  S.currentStep = idx;
  S.completedSteps.add(idx);
  renderLoop();
}

  document.querySelectorAll(".cmd-item").forEach(el => el.classList.remove("active"));

  const idx = COMMANDS.findIndex(c => c.name === cmdName);
  if (idx >= 0 && items[idx]) items[idx].classList.add("active");

  if (cmdName === "/learn") return cmdLearn(cmdText);
  if (cmdName === "/teach") return cmdTeach(cmdText);
  if (cmdName === "/assess") return cmdAssess(cmdText);
  if (cmdName === "/plan") return cmdPlan();
  if (cmdName === "/recommend") return cmdRecommend();
  if (cmdName === "/review") return cmdReview();
  if (cmdName === "/mastery") return cmdMastery();
  if (cmdName === "/daily") return cmdDaily();
  if (cmdName === "/import-external") return cmdImportExternal();

}

    ${teachStepHTML(3, "原理剖析", "复利的本质是指数增长。每期利息基于「本金+已累积利息」计算，使增长呈指数曲线。对比单利（仅以原始本金计息，线性增长），长期差异巨大：同样 10000 元、5% 年利率、30 年后，单利为 25000 元，复利为 43219 元。")}
    ${teachStepHTML(4, "例题示范", "例：本金 10000 元，年利率 5%，按年复利，3 年后终值？<br>解：A = 10000 × (1+0.05)^3 = 10000 × 1.157625 = 11576.25 元。")}
    ${teachStepHTML(5, "交互检测", `
      <div class="choice-q" id="teachChoice">

function renderQuestion(q, i) {
  if (q.type === "选择") {
    let opts = "";
    q.options.forEach((opt, oi) => {
      opts += `<button class="choice-opt" data-q="${i}" data-v="${oi}"><div class="marker">${String.fromCharCode(65 + oi)}</div>${esc(opt)}</button>`;
    });
    return `<div class="choice-q"><div class="q-text">${q.q}</div><div class="choice-options">${opts}</div><div class="feedback" id="fb-${i}"></div></div>`;
  }
  if (q.type === "填空") {
    return `<div class="input-q"><div class="q-text">${q.q}</div><input type="text" id="inp-${i}" placeholder="请输入答案"><button class="submit-btn" data-q="${i}">提交</button><div class="feedback" id="fb-${i}"></div></div>`;
  }
  if (q.type === "简答") {
    return `<div class="input-q"><div class="q-text">${q.q}</div><textarea id="inp-${i}" placeholder="请输入你的回答..."></textarea><button class="submit-btn" data-q="${i}">提交</button><div class="feedback" id="fb-${i}"></div></div>`;
  }
  if (q.type === "应用") {
    return `<div class="input-q"><div class="q-text">${q.q}</div><input type="text" id="inp-${i}" placeholder="请输入数值"><button class="submit-btn" data-q="${i}">提交</button><div class="feedback" id="fb-${i}"></div></div>`;
  }
  return "";
}

function bindAssessQuestions() {
  // 选择题
  document.querySelectorAll(".choice-opt[data-q]").forEach(opt => {
    opt.onclick = () => {
      const qi = parseInt(opt.dataset.q);
      if (S.assessAnswered.has(qi)) return;
      const v = parseInt(opt.dataset.v);
      const q = D.questions[qi];
      const fb = $("fb-" + qi);
      const allOpts = document.querySelectorAll(`.choice-opt[data-q="${qi}"]`);
      allOpts.forEach(o => o.classList.add("disabled"));
      S.assessAnswered.add(qi);
      if (v === q.answer) {
        opt.classList.add("correct");
        fb.className = "feedback show correct";
        fb.innerHTML = `<span class="label">✓ 正确</span>${q.explain}`;
        S.assessCorrect++;
      } else {
        opt.classList.add("wrong");
        allOpts[q.answer].classList.add("correct");
        fb.className = "feedback show wrong";
        fb.innerHTML = `<span class="label">✗ 错误</span>${q.explain}<div class="attr">错题归因：${q.attr.type} · ${q.attr.detail} → 已写入错题表</div>`;
        // 添加错题
        D.errors.unshift({
          id: "ERR-" + String(D.errors.length + 1).padStart(4, "0"),
          topic: q.topic,
          desc: q.q.substring(0, 30) + "...",
          cause: q.attr.type + "：" + q.attr.detail,
          count: 1,
          lastDate: "2026-07-13"
        });
      }
      checkAssessComplete();
      renderRightPanel();
    };
  });
  // 填空/简答/应用题
  document.querySelectorAll(".submit-btn[data-q]").forEach(btn => {
    btn.onclick = () => {
      const qi = parseInt(btn.dataset.q);
      if (S.assessAnswered.has(qi)) return;
      const inp = $("inp-" + qi);
      const ans = inp.value.trim();
      if (!ans) { showToast("请输入答案"); return; }
      const q = D.questions[qi];
      const fb = $("fb-" + qi);
      S.assessAnswered.add(qi);
      let correct = false;
      if (q.type === "填空" || q.type === "应用") {
        // 数值比较
        const a1 = ans.replace(/[，, ]/g, "").replace(/元$/, "");
        const a2 = String(q.answer).replace(/[，, ]/g, "");
        correct = a1 === a2 || parseFloat(a1) === parseFloat(a2);
      } else if (q.type === "简答") {
        // 关键词匹配
        correct = q.answer.some(kw => ans.includes(kw)) && ans.length >= 15;
      }
      if (correct) {
        fb.className = "feedback show correct";
        fb.innerHTML = `<span class="label">✓ 正确</span>${q.explain}`;
        S.assessCorrect++;
      } else {
        fb.className = "feedback show wrong";
        fb.innerHTML = `<span class="label">✗ 不完全正确</span>参考答案：${Array.isArray(q.answer) ? q.answer.join("；") : q.answer}<br>${q.explain}<div class="attr">错题归因：${q.attr.type} · ${q.attr.detail} → 已写入错题表</div>`;
        D.errors.unshift({
          id: "ERR-" + String(D.errors.length + 1).padStart(4, "0"),
          topic: q.topic,
          desc: q.q.substring(0, 30) + "...",

function renderRadarSVG() {
  // 3 维度 × 3 知识点
  const dims = ["流利度", "存储度", "应用度"];
  const kps = [
    { name: "复利公式基础", color: "var(--accent)", vals: [D.knowledge[0].f, D.knowledge[0].s, D.knowledge[0].a] },
    { name: "72法则", color: "var(--gold)", vals: [D.knowledge[2].f, D.knowledge[2].s, D.knowledge[2].a] },
    { name: "指数函数", color: "var(--green)", vals: [D.knowledge[3].f, D.knowledge[3].s, D.knowledge[3].a] }
  ];
  const cx = 110, cy = 100, R = 70;
  // 三角形顶点
  const angles = [-90, 30, 150];
  const verts = angles.map(a => {
    const rad = a * Math.PI / 180;
    return { x: cx + R * Math.cos(rad), y: cy + R * Math.sin(rad) };
  });
  // 网格
  let grid = "";
  for (let lvl = 1; lvl <= 4; lvl++) {
    const r = R * lvl / 4;
    const pts = angles.map(a => {
      const rad = a * Math.PI / 180;
      return `${cx + r * Math.cos(rad)},${cy + r * Math.sin(rad)}`;
    }).join(" ");
    grid += `<polygon points="${pts}" fill="none" stroke="var(--border)" stroke-width="0.5"/>`;
  }
  // 轴线
  let axes = "";
  verts.forEach((v, i) => {
    axes += `<line x1="${cx}" y1="${cy}" x2="${v.x}" y2="${v.y}" stroke="var(--border)" stroke-width="0.5"/>`;
    axes += `<text x="${v.x + (v.x > cx ? 6 : v.x < cx ? -6 : 0)}" y="${v.y + (v.y > cy ? 14 : v.y < cy ? -6 : 0)}" text-anchor="${v.x > cx ? "start" : v.x < cx ? "end" : "middle"}" font-size="9" fill="var(--fg-muted)" font-family="var(--font-mono)">${dims[i]}</text>`;
  });
  // 数据多边形
  let polys = "";
  kps.forEach(kp => {
    const pts = kp.vals.map((v, i) => {
      const r = R * v / 4;
      const rad = angles[i] * Math.PI / 180;
      return `${cx + r * Math.cos(rad)},${cy + r * Math.sin(rad)}`;
    }).join(" ");
    polys += `<polygon points="${pts}" fill="${kp.color}" fill-opacity="0.15" stroke="${kp.color}" stroke-width="1.5"/>`;
    // 顶点
    kp.vals.forEach((v, i) => {
      const r = R * v / 4;
      const rad = angles[i] * Math.PI / 180;
      polys += `<circle cx="${cx + r * Math.cos(rad)}" cy="${cy + r * Math.sin(rad)}" r="2.5" fill="${kp.color}"/>`;
    });
  });
  return `<svg viewBox="0 0 220 200" xmlns="http://www.w3.org/2000/svg">
    ${grid}${axes}${polys}
  </svg>`;
}
