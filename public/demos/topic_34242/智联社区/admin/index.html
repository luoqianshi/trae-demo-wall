<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邻里智联 - 社区治理后台管理系统</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 入口页面专属样式 */
        .index-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #FDF8F3 0%, #F5EDE4 100%);
            text-align: center;
        }
        .index-logo {
            font-size: 5rem;
            margin-bottom: 24px;
        }
        .index-title {
            font-size: 2.5rem;
            color: #C45D3A;
            margin-bottom: 8px;
        }
        .index-subtitle {
            font-size: 1.25rem;
            color: #666;
            margin-bottom: 48px;
        }
        .index-actions {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .index-btn {
            padding: 16px 48px;
            font-size: 1.125rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
        }
        .index-btn-primary {
            background: #C45D3A;
            color: white;
        }
        .index-btn-primary:hover {
            background: #A04D2F;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(196, 93, 58, 0.3);
        }
        .index-btn-secondary {
            background: white;
            color: #C45D3A;
            border: 2px solid #C45D3A;
        }
        .index-btn-secondary:hover {
            background: rgba(196, 93, 58, 0.1);
            transform: translateY(-2px);
        }
        .index-features {
            display: flex;
            gap: 40px;
            margin-top: 60px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .index-feature {
            text-align: center;
            max-width: 200px;
        }
        .index-feature-icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }
        .index-feature-title {
            font-weight: 600;
            color: #2C2420;
            margin-bottom: 4px;
        }
        .index-feature-desc {
            font-size: 0.875rem;
            color: #888;
        }
    </style>
</head>
<body>
    <!-- 入口页面容器 -->
    <div class="index-container">
        <div class="index-logo">🏘️</div>
        <h1 class="index-title">邻里智联</h1>
        <p class="index-subtitle">老旧小区AI便民共享治理一体化系统</p>
        
        <div class="index-actions">
            <button class="index-btn index-btn-primary" onclick="location.href='login.html'">
                进入管理后台
            </button>
            <button class="index-btn index-btn-secondary" onclick="location.href='../index.html'">
                返回首页
            </button>
        </div>

        <div class="index-features">
            <div class="index-feature">
                <div class="index-feature-icon">🔧</div>
                <div class="index-feature-title">隐患工单管理</div>
                <div class="index-feature-desc">AI智能识别与处理</div>
            </div>
            <div class="index-feature">
                <div class="index-feature-icon">👴</div>
                <div class="index-feature-title">独居老人监测</div>
                <div class="index-feature-desc">智能设备实时守护</div>
            </div>
            <div class="index-feature">
                <div class="index-feature-icon">🤝</div>
                <div class="index-feature-title">邻里共享</div>
                <div class="index-feature-desc">资源互通便捷生活</div>
            </div>
            <div class="index-feature">
                <div class="index-feature-icon">📢</div>
                <div class="index-feature-title">通知发布</div>
                <div class="index-feature-desc">信息及时触达</div>
            </div>
        </div>

        <div style="position:fixed;bottom:24px;text-align:center;width:100%">
            <p class="text-muted" style="font-size:0.875rem">© 2026 邻里智联 版权所有</p>
        </div>
    </div>

    <script src="js/components.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
