<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>登录 - 邻里智联</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page-container">
    <div class="auth-logo">
        <div class="logo-icon">🏘️</div>
        <h1>邻里智联</h1>
        <div class="slogan">共建和谐社区，共享美好生活</div>
    </div>

    <div class="auth-tabs">
        <div class="auth-tab active" data-form="pwd">密码登录</div>
        <div class="auth-tab" data-form="code">验证码登录</div>
    </div>

    <!-- 密码登录 -->
    <div class="auth-form pwd-panel active" id="pwd-panel">
        <div class="form-group">
            <label>手机号</label>
            <input type="tel" class="form-input" id="phone" placeholder="请输入11位手机号" maxlength="11">
        </div>
        <div class="form-group">
            <label>密码</label>
            <div class="input-group">
                <input type="password" class="form-input" id="password" placeholder="请输入密码（至少6位）">
                <button type="button" class="btn btn-sm" id="password-toggle" style="background:#FFF5EE;color:#C45D3A;">👁</button>
            </div>
        </div>
        <div class="forgot-link">
            <a href="#" onclick="showToast('请联系社区管理员重置密码')">忘记密码？</a>
        </div>
        <div class="privacy-agreement pwd-panel">
            <span class="checkbox-wrapper"></span>
            <span>我已阅读并同意<a href="agreement.html">《用户服务协议》</a>和<a href="privacy.html">《隐私政策》</a></span>
        </div>
        <button type="button" class="btn btn-primary btn-block btn-lg" id="btn-login-submit">登 录</button>
    </div>

    <!-- 验证码登录 -->
    <div class="auth-form code-panel" id="code-panel" style="display:none;">
        <div class="form-group">
            <label>手机号</label>
            <input type="tel" class="form-input" id="code-phone" placeholder="请输入11位手机号" maxlength="11">
        </div>
        <div class="form-group">
            <label>验证码</label>
            <div class="input-group">
                <input type="text" class="form-input" id="code" placeholder="请输入验证码" maxlength="6">
                <button type="button" class="btn btn-sm" id="btn-send-code" style="background:#FFF5EE;color:#C45D3A;">发送验证码</button>
            </div>
        </div>
        <div class="privacy-agreement code-panel">
            <span class="checkbox-wrapper"></span>
            <span>我已阅读并同意<a href="agreement.html">《用户服务协议》</a>和<a href="privacy.html">《隐私政策》</a></span>
        </div>
        <button type="button" class="btn btn-primary btn-block btn-lg" id="btn-code-submit">登 录</button>
    </div>

    <div class="demo-hint">
        <div class="hint-title">📱 演示环境</div>
        <div>任意11位手机号 + 6位以上密码即可登录</div>
        <div style="margin-top:4px;">或使用验证码模式：任意4-6位数字</div>
    </div>

    <div class="auth-footer">
        还没有账号？<a href="register.html">立即注册</a>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
