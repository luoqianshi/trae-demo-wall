<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>首页 - 邻里智联</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page-container">
    <div class="home-hero">
        <div style="font-size:14px;opacity:0.9;margin-bottom:4px;" id="greeting-text">您好，尊敬的住户</div>
        <div style="font-size:22px;font-weight:600;">🏘️ 阳光花园小区</div>
    </div>

    <!-- 积分卡片 -->
    <div class="home-points-card">
        <div class="points-left">
            <div class="points-label">我的积分</div>
            <div class="points-number" id="home-points">0</div>
        </div>
        <button class="btn" onclick="navigateTo('points.html')">去兑换 →</button>
    </div>

    <!-- 轮播公告 -->
    <div style="margin:0 16px 16px;">
        <div class="announcement-carousel" id="announcements-carousel" style="margin:0;cursor:pointer;" onclick="navigateTo('notices.html?tab=notices')">
            <div style="font-size:14px;display:flex;align-items:center;gap:8px;width:100%;">
                <span style="background:#C45D3A;color:white;padding:3px 10px;border-radius:4px;font-size:12px;font-weight:500;flex-shrink:0;">📢 公告</span>
                <span id="announcement-text" style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#666;">欢迎来到阳光花园小区</span>
                <span style="color:#999;font-size:12px;flex-shrink:0;">›</span>
            </div>
        </div>
    </div>

    <!-- 快捷入口8宫格 -->
    <div class="quick-grid" style="margin:0 16px 16px;">
        <div class="quick-item" data-href="repair.html">
            <div class="quick-icon">🔧</div>
            <div class="quick-name">报修服务</div>
        </div>
        <div class="quick-item" data-href="government.html">
            <div class="quick-icon">💬</div>
            <div class="quick-name">诉求咨询</div>
        </div>
        <div class="quick-item" data-href="share.html">
            <div class="quick-icon">🤝</div>
            <div class="quick-name">邻里共享</div>
        </div>
        <div class="quick-item" data-href="borrow.html">
            <div class="quick-icon">🙋</div>
            <div class="quick-name">我要借</div>
        </div>
        <div class="quick-item" data-href="notices.html">
            <div class="quick-icon">💬</div>
            <div class="quick-name">我的消息</div>
        </div>
        <div class="quick-item" data-href="points.html">
            <div class="quick-icon">💰</div>
            <div class="quick-name">积分商城</div>
        </div>
        <div class="quick-item" data-href="government.html">
            <div class="quick-icon">🏛️</div>
            <div class="quick-name">政务咨询</div>
        </div>
        <div class="quick-item" data-href="forum.html">
            <div class="quick-icon">💬</div>
            <div class="quick-name">社区论坛</div>
        </div>
        <div class="quick-item" data-href="help.html">
            <div class="quick-icon">🤝</div>
            <div class="quick-name">邻里互助</div>
        </div>
        <div class="quick-item" onclick="showToast('更多功能正在开发中', 'info')">
            <div class="quick-icon">✨</div>
            <div class="quick-name">更多</div>
        </div>
    </div>

    <!-- 邻里互助 -->
    <div class="section-title">邻里互助</div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 16px 16px;">
        <div class="help-item" onclick="navigateTo('help.html?cat=取快递')">
            <div class="icon">📦</div>
            <div class="name">帮取快递</div>
        </div>
        <div class="help-item" onclick="navigateTo('help.html?cat=照看宠物')">
            <div class="icon">🐕</div>
            <div class="name">照看宠物</div>
        </div>
        <div class="help-item" onclick="navigateTo('help.html?cat=陪伴老人')">
            <div class="icon">👴</div>
            <div class="name">陪伴老人</div>
        </div>
        <div class="help-item" onclick="navigateTo('help.html?cat=绿植托管')">
            <div class="icon">🌱</div>
            <div class="name">绿植托管</div>
        </div>
    </div>

    <!-- 热门共享 -->
    <div class="section-title">热门共享</div>
    <div id="hot-shares" style="display:flex;overflow-x:auto;gap:12px;padding:4px 16px 16px;scrollbar-width:none;">
        <!-- 动态加载 -->
    </div>

    <!-- 底部提示 -->
    <div style="padding:20px 16px 80px;text-align:center;color:#999;font-size:12px;">
        <div>—— 邻里智联 · 共建和谐社区 ——</div>
    </div>
</div>

<!-- 底部导航 -->
<div class="tab-bar">
    <div class="tab-item active" onclick="navigateTo('index.html')">
        <div class="tab-icon">🏠</div>
        <div>首页</div>
    </div>
    <div class="tab-item" onclick="navigateTo('share.html')">
        <div class="tab-icon">🤝</div>
        <div>共享</div>
    </div>
    <div class="tab-item" onclick="navigateTo('notices.html')">
        <div class="tab-icon">📢</div>
        <div>通知</div>
    </div>
    <div class="tab-item" onclick="navigateTo('profile.html')">
        <div class="tab-icon">👤</div>
        <div>我的</div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
function showAIHelper() {
    if (!checkLogin()) { showToast('请先登录'); setTimeout(() => navigateTo('login.html'), 1200); return; }
    navigateTo('government.html');
}
function joinActivity(name) {
    if (!checkLogin()) { showToast('请先登录'); setTimeout(() => navigateTo('login.html'), 1200); return; }
    showConfirm('确认参与', '您即将参与"' + name + '"互助活动，参与后将获得相应积分奖励。', '立即参与', '再想想').then(ok => {
        if (ok) showToast('已成功参与，感谢您的热心！');
    });
}
</script>
</body>
</html>
