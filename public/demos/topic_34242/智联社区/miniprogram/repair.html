<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>报修服务 - 邻里智联</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page-container">
    <div class="page-header">
        <h1>🔧 报修服务</h1>
    </div>

    <div class="page-tabs">
        <div class="page-tab active" data-tab="new">我要报修</div>
        <div class="page-tab" data-tab="history">报修记录</div>
    </div>

    <!-- 我要报修 -->
    <div class="tab-panel active" id="tab-new">
        <div class="card">
            <div class="card-title">问题分类</div>
            <div class="category-grid" id="category-grid">
                <div class="category-item" data-category="水电"><div class="cate-icon">💧</div><div>水电维修</div></div>
                <div class="category-item" data-category="门窗"><div class="cate-icon">🚪</div><div>门窗维修</div></div>
                <div class="category-item" data-category="照明"><div class="cate-icon">💡</div><div>照明维修</div></div>
                <div class="category-item" data-category="电梯"><div class="cate-icon">🛗</div><div>电梯故障</div></div>
                <div class="category-item" data-category="管道"><div class="cate-icon">🔩</div><div>管道疏通</div></div>
                <div class="category-item" data-category="其他"><div class="cate-icon">🛠️</div><div>其他问题</div></div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">问题描述</div>
            <textarea class="form-textarea" id="repair-desc" placeholder="请详细描述遇到的问题，例如：厨房水龙头漏水，大约从昨天开始出现..." rows="4"></textarea>
        </div>

        <div class="card">
            <div class="card-title">位置信息</div>
            <input type="text" class="form-input" id="repair-location" placeholder="例如：3栋2单元501室厨房">
        </div>

        <div class="card">
            <div class="card-title">上传图片 <span style="font-size:12px;font-weight:400;color:#999;">(选填，最多3张)</span></div>
            <div class="image-upload" id="repair-upload">
                <div class="image-upload-btn" onclick="this.querySelector('input').click()">
                    <div style="font-size:28px;">📷</div>
                    <div style="font-size:12px;color:#999;">点击上传</div>
                    <input type="file" accept="image/*" multiple style="display:none;" onchange="handleImageUpload(event, 'repair-images-preview')">
                </div>
                <div class="image-preview-list" id="repair-images-preview"></div>
            </div>
        </div>

        <button class="btn btn-primary btn-block btn-lg" id="btn-repair-submit" style="margin:0 16px 24px;">提交报修</button>
    </div>

    <!-- 报修记录 -->
    <div class="tab-panel" id="tab-history" style="display:none;">
        <div class="filter-tabs" id="filter-tabs">
            <div class="filter-tab active" data-status="all">全部</div>
            <div class="filter-tab" data-status="待处理">待处理</div>
            <div class="filter-tab" data-status="处理中">处理中</div>
            <div class="filter-tab" data-status="已完成">已完成</div>
        </div>
        <div id="repair-history-list" style="padding:0 16px;">
            <!-- 动态加载 -->
        </div>
    </div>
</div>

<!-- 评分弹窗 -->
<div class="modal" id="rating-modal">
    <div class="modal-mask" onclick="closeModal('rating-modal')"></div>
    <div class="modal-content modal-content-sm">
        <div class="modal-header">
            <div>服务评价</div>
            <div class="modal-close" onclick="closeModal('rating-modal')">✕</div>
        </div>
        <div class="modal-body">
            <div style="text-align:center;padding:16px 0;">
                <div class="rating-stars" id="rating-stars" style="font-size:32px;letter-spacing:8px;">★★★★★</div>
                <div style="color:#999;margin-top:8px;" id="rating-text">请选择评分</div>
            </div>
            <textarea class="form-textarea" id="rating-feedback" placeholder="请输入您的反馈意见..." rows="3" style="width:100%;box-sizing:border-box;"></textarea>
        </div>
        <div class="modal-footer">
            <button class="btn btn-block" style="background:#F5F5F5;color:#666;" onclick="closeModal('rating-modal')">取消</button>
            <button class="btn btn-primary btn-block" id="btn-rate-submit">提交评价</button>
        </div>
    </div>
</div>

<!-- 详情弹窗 -->
<div class="modal" id="detail-modal">
    <div class="modal-mask" onclick="closeModal('detail-modal')"></div>
    <div class="modal-content">
        <div class="modal-header">
            <div>报修详情</div>
            <div class="modal-close" onclick="closeModal('detail-modal')">✕</div>
        </div>
        <div class="modal-body" id="detail-body">
            <!-- 动态内容 -->
        </div>
        <div class="modal-footer">
            <button class="btn btn-primary btn-block" onclick="closeModal('detail-modal')">知道了</button>
        </div>
    </div>
</div>

<!-- 底部导航 -->
<div class="tab-bar">
    <div class="tab-item" onclick="navigateTo('index.html')">
        <div class="tab-icon">🏠</div><div>首页</div>
    </div>
    <div class="tab-item" onclick="navigateTo('share.html')">
        <div class="tab-icon">🤝</div><div>共享</div>
    </div>
    <div class="tab-item" onclick="navigateTo('notices.html')">
        <div class="tab-icon">📢</div><div>通知</div>
    </div>
    <div class="tab-item active" onclick="navigateTo('repair.html')">
        <div class="tab-icon">🔧</div><div>报修</div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
