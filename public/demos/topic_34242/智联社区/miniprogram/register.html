<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>注册 - 邻里智联</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page-container">
    <div class="page-header">
        <h1>📝 新用户注册</h1>
        <div style="font-size:13px;opacity:0.9;margin-top:4px;">注册后需等待网格员审核通过</div>
    </div>

    <div class="page-content">
        <div class="form-group">
            <label>真实姓名 *</label>
            <input type="text" class="form-input" id="reg-name" placeholder="请输入您的真实姓名" maxlength="20">
        </div>

        <div class="form-group">
            <label>手机号 *</label>
            <input type="tel" class="form-input" id="reg-phone" placeholder="请输入11位手机号" maxlength="11">
        </div>

        <div class="form-group">
            <label>登录密码 *</label>
            <input type="password" class="form-input" id="reg-password" placeholder="请设置登录密码（至少6位）">
        </div>

        <div class="form-group">
            <label>确认密码 *</label>
            <input type="password" class="form-input" id="reg-password2" placeholder="请再次输入密码">
        </div>

        <div class="form-group">
            <label>楼栋信息 *</label>
        </div>
        <div class="form-row">
            <div class="form-group">
                <input type="text" class="form-input" id="reg-building" placeholder="楼栋号" maxlength="10">
            </div>
            <div class="form-group">
                <input type="text" class="form-input" id="reg-unit" placeholder="单元号" maxlength="10">
            </div>
            <div class="form-group">
                <input type="text" class="form-input" id="reg-room" placeholder="房间号" maxlength="10">
            </div>
        </div>

        <div class="privacy-agreement">
            <span class="checkbox-wrapper"></span>
            <span>我已阅读并同意<a href="agreement.html">《用户服务协议》</a>和<a href="privacy.html">《隐私政策》</a></span>
        </div>

        <button type="button" class="btn btn-primary btn-block btn-lg" id="btn-register" style="margin-top:8px;">立即注册</button>

        <div style="text-align:center;padding:20px 0;font-size:13px;color:#999;">
            已有账号？<a href="login.html" style="color:#C45D3A;font-weight:500;">立即登录</a>
        </div>

        <div class="card" style="margin-top:16px;background:#FFF5EE;border-radius:12px;">
            <div style="font-size:14px;color:#C45D3A;font-weight:500;margin-bottom:8px;">💡 温馨提示</div>
            <div style="font-size:13px;color:#666;line-height:1.8;">
                1. 请填写真实姓名和楼栋信息，网格员将上门核对<br>
                2. 审核通常在1-2个工作日内完成<br>
                3. 审核通过后您将收到短信通知<br>
                4. 如有疑问请拨打社区服务热线：400-888-8888
            </div>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
