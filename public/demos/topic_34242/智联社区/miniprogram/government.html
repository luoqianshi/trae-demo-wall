<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>政务咨询 - 邻里智联</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page-container">
    <div class="page-header">
        <h1>💬 政务咨询 / 诉求</h1>
        <div style="font-size:13px;color:#999;margin-top:4px;">便捷提交，快速响应，共建美好社区</div>
    </div>

    <div class="filter-tabs" id="gov-categories" style="margin-top:0;">
        <div class="filter-tab active" data-cat="全部">全部</div>
        <div class="filter-tab" data-cat="社保">📜 社保</div>
        <div class="filter-tab" data-cat="医保">💊 医保</div>
        <div class="filter-tab" data-cat="养老">👴 养老</div>
        <div class="filter-tab" data-cat="证件">📇 证件</div>
        <div class="filter-tab" data-cat="物业">🏘️ 物业</div>
        <div class="filter-tab" data-cat="其他">📋 其他</div>
    </div>

    <div id="appeal-list" style="padding:0 16px;">
        <!-- 动态加载 -->
    </div>
</div>

<!-- 发表诉求弹窗 -->
<div class="modal" id="appeal-modal">
    <div class="modal-mask" onclick="closeModal('appeal-modal')"></div>
    <div class="modal-content">
        <div class="modal-header">
            <div>发表诉求</div>
            <div class="modal-close" onclick="closeModal('appeal-modal')">✕</div>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>诉求分类</label>
                <div class="filter-tabs" id="appeal-category" style="margin-top:0;">
                    <div class="filter-tab active" data-cat="社保">📜 社保</div>
                    <div class="filter-tab" data-cat="医保">💊 医保</div>
                    <div class="filter-tab" data-cat="养老">👴 养老</div>
                    <div class="filter-tab" data-cat="证件">📇 证件</div>
                    <div class="filter-tab" data-cat="物业">🏘️ 物业</div>
                    <div class="filter-tab" data-cat="其他">📋 其他</div>
                </div>
            </div>
            <div class="form-group">
                <label>标题 *</label>
                <input type="text" class="form-input" id="appeal-title" placeholder="一句话概括您的问题" maxlength="50">
            </div>
            <div class="form-group">
                <label>详细描述 *</label>
                <textarea class="form-textarea" id="appeal-content" rows="5" placeholder="请详细描述您的问题、困难或建议，我们会尽快为您处理..."></textarea>
            </div>
            <div class="form-group">
                <label>联系方式 <span style="font-size:12px;color:#999;font-weight:400;">(可选)</span></label>
                <input type="text" class="form-input" id="appeal-contact" placeholder="手机号或其他联系方式" maxlength="30">
            </div>
            <div style="background:#FFF5EE;padding:12px;border-radius:8px;font-size:12px;color:#666;line-height:1.7;">
                💡 提示：社区网格员会在2个工作日内响应您的诉求。如遇紧急事件，请直接拨打 400-888-8888。
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-block" style="background:#F5F5F5;color:#666;" onclick="closeModal('appeal-modal')">取消</button>
            <button class="btn btn-primary btn-block" id="btn-appeal-submit">提交诉求</button>
        </div>
    </div>
</div>

<!-- 悬浮发表按钮 -->
<div class="fab-btn" onclick="openAppealModal()" style="display:block;">
    <div style="font-size:24px;">✏️</div>
</div>

<div class="tab-bar">
    <div class="tab-item" onclick="navigateTo('index.html')">
        <div class="tab-icon">🏠</div><div>首页</div>
    </div>
    <div class="tab-item" onclick="navigateTo('share.html')">
        <div class="tab-icon">🤝</div><div>共享</div>
    </div>
    <div class="tab-item" onclick="navigateTo('notices.html')">
        <div class="tab-icon">📢</div><div>通知</div>
    </div>
    <div class="tab-item active" onclick="navigateTo('profile.html')">
        <div class="tab-icon">👤</div><div>我的</div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
let currentAppealCategory = '社保';
function openAppealModal() {
    if (!checkLogin()) { showToast('请先登录'); setTimeout(() => navigateTo('login.html'), 1200); return; }
    document.getElementById('appeal-title').value = '';
    document.getElementById('appeal-content').value = '';
    document.getElementById('appeal-contact').value = '';
    currentAppealCategory = '社保';
    openModal('appeal-modal');
}
</script>
</body>
</html>
