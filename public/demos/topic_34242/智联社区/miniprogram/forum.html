<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>邻里论坛 - 邻里智联</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .forum-search-bar {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    background: white;
    margin: 0 16px -8px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    position: relative;
    z-index: 5;
  }
  .forum-search-bar .form-input {
    flex: 1;
    padding: 10px 14px;
  }
  .forum-search-bar .btn {
    padding: 10px 18px;
  }
  .forum-list {
    padding: 16px;
  }
  .post-card {
    background: white;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    cursor: pointer;
    transition: transform 0.2s;
  }
  .post-card:active { transform: scale(0.99); }
  .post-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 12px;
  }
  .post-author {
    font-weight: 500;
    color: #333;
  }
  .post-meta-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .post-category-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 500;
    background: #FFF5EE;
    color: #C45D3A;
  }
  .post-time {
    color: #999;
  }
  .post-title {
    font-size: 16px;
    font-weight: 600;
    color: #333;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .post-hot-icon {
    font-size: 14px;
  }
  .post-content {
    font-size: 13px;
    color: #666;
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .post-actions {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px dashed #f0f0f0;
    font-size: 12px;
    color: #666;
  }
  .action-item {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    user-select: none;
    transition: color 0.2s;
  }
  .action-item:hover { color: #C45D3A; }
  .action-item.liked { color: #FF4D4F; }
  .action-item.favorited { color: #FAAD14; }
  .action-btn {
    margin-left: auto;
    padding: 6px 14px;
    background: #FFF5EE;
    color: #C45D3A;
    border-radius: 16px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    border: none;
  }
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #999;
    font-size: 14px;
  }
  .empty-state .empty-icon {
    font-size: 48px;
    margin-bottom: 12px;
    opacity: 0.5;
  }
  .post-detail-title {
    font-size: 18px;
    font-weight: 700;
    color: #333;
    margin-bottom: 10px;
    line-height: 1.5;
  }
  .post-detail-meta {
    display: flex;
    gap: 10px;
    font-size: 12px;
    color: #999;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .post-detail-meta .post-category-tag { margin: 0; }
  .post-detail-content {
    font-size: 14px;
    color: #555;
    line-height: 1.8;
    white-space: pre-wrap;
    background: #FFF5EE;
    padding: 14px;
    border-radius: 8px;
    margin-bottom: 16px;
  }
  .post-detail-actions {
    display: flex;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid #eee;
    flex-wrap: wrap;
  }
  .post-detail-actions .action-item {
    font-size: 13px;
    padding: 6px 12px;
    background: #f5f5f5;
    border-radius: 16px;
  }
  .comment-section-title {
    font-size: 14px;
    font-weight: 600;
    color: #333;
    margin: 14px 0 10px;
  }
  .comment-input-wrap {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  .comment-input-wrap .form-input { flex: 1; }
  .filter-tabs.forum-filter {
    margin-top: 24px;
  }
</style>
</head>
<body>
<div class="page-container">
    <div class="page-header">
        <h1>🏘 邻里论坛</h1>
    </div>

    <div class="forum-search-bar">
        <input type="text" class="form-input" id="forum-search-input" placeholder="搜索帖子标题、内容、发布人">
        <button class="btn btn-primary" id="btn-forum-search">搜索</button>
    </div>

    <div class="filter-tabs forum-filter" id="forum-categories"></div>

    <div id="forum-list" class="forum-list"></div>
</div>

<!-- 发帖弹窗 -->
<div class="modal" id="create-post-modal">
    <div class="modal-mask" onclick="closeModal('create-post-modal')"></div>
    <div class="modal-content">
        <div class="modal-header">
            <div>发布新帖</div>
            <div class="modal-close" onclick="closeModal('create-post-modal')">✕</div>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>标题</label>
                <input type="text" class="form-input" id="post-title" placeholder="请输入帖子标题（1-50字）" maxlength="50">
            </div>
            <div class="form-group">
                <label>分类</label>
                <div class="filter-tabs" id="post-category" style="padding: 0; margin: 0;"></div>
            </div>
            <div class="form-group">
                <label>正文内容</label>
                <textarea class="form-textarea" id="post-content" rows="6" placeholder="请输入帖子内容..."></textarea>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-block" style="background:#F5F5F5;color:#666;" onclick="closeModal('create-post-modal')">取消</button>
            <button class="btn btn-primary btn-block" id="btn-create-submit">立即发布</button>
        </div>
    </div>
</div>

<!-- 帖子详情弹窗 -->
<div class="modal" id="post-detail-modal">
    <div class="modal-mask" onclick="closeModal('post-detail-modal')"></div>
    <div class="modal-content">
        <div class="modal-header">
            <div>帖子详情</div>
            <div class="modal-close" onclick="closeModal('post-detail-modal')">✕</div>
        </div>
        <div class="modal-body" id="post-detail-body"></div>
        <div class="modal-footer">
            <button class="btn btn-block" style="background:#F5F5F5;color:#666;" onclick="closeModal('post-detail-modal')">关闭</button>
            <button class="btn btn-block" style="background:#FFF5EE;color:#C45D3A;border:1px solid #C45D3A;" id="btn-detail-message">私信作者</button>
            <button class="btn btn-block" style="background:#FFF;color:#C45D3A;border:1px solid #C45D3A;" id="btn-detail-report">举报该帖</button>
        </div>
    </div>
</div>

<!-- 悬浮发帖按钮 -->
<div class="fab-btn" id="fab-create-post">
    <div style="font-size:24px;">+</div>
</div>

<!-- 底部导航 -->
<div class="tab-bar">
    <div class="tab-item" onclick="navigateTo('index.html')">
        <div class="tab-icon">🏠</div><div>首页</div>
    </div>
    <div class="tab-item" onclick="navigateTo('share.html')">
        <div class="tab-icon">🤝</div><div>共享</div>
    </div>
    <div class="tab-item" onclick="navigateTo('notices.html')">
        <div class="tab-icon">📢</div><div>消息</div>
    </div>
    <div class="tab-item" onclick="navigateTo('profile.html')">
        <div class="tab-icon">👤</div><div>我的</div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
let currentForumCategory = '全部';
let currentForumKeyword = '';
let currentCreateCategory = '生活分享';
let currentDetailPostId = null;

function initForum() {
    if (!window.ForumAPI) return;

    loadForumCategories();
    loadForumPosts();

    document.getElementById('btn-forum-search').addEventListener('click', function() {
        currentForumKeyword = document.getElementById('forum-search-input').value.trim();
        loadForumPosts();
    });

    document.getElementById('forum-search-input').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            currentForumKeyword = this.value.trim();
            loadForumPosts();
        }
    });

    document.getElementById('fab-create-post').addEventListener('click', function() {
        openCreatePostModal();
    });

    document.getElementById('btn-create-submit').addEventListener('click', function() {
        createPost();
    });
}

function renderForumCategories(list) {
    const container = document.getElementById('forum-categories');
    if (!container) return;
    const allList = ['全部'].concat(list || []);
    container.innerHTML = '';
    allList.forEach(function(cat) {
        const el = document.createElement('div');
        el.className = 'filter-tab' + (cat === currentForumCategory ? ' active' : '');
        el.textContent = cat;
        el.addEventListener('click', function() {
            currentForumCategory = cat;
            container.querySelectorAll('.filter-tab').forEach(function(t) {
                t.classList.toggle('active', t.textContent === cat);
            });
            loadForumPosts();
        });
        container.appendChild(el);
    });
}

function loadForumCategories() {
    if (!window.ForumAPI) return;
    window.ForumAPI.getCategories().then(function(res) {
        renderForumCategories((res && res.list) || []);
    }).catch(function() {});
}

function loadForumPosts() {
    if (!window.ForumAPI) return;
    const container = document.getElementById('forum-list');
    if (!container) return;
    container.innerHTML = '<div style="text-align:center;padding:20px;color:#999;">加载中...</div>';

    const params = {};
    if (currentForumCategory && currentForumCategory !== '全部') params.category = currentForumCategory;
    if (currentForumKeyword) params.keyword = currentForumKeyword;

    window.ForumAPI.list(params).then(function(res) {
        const list = (res && res.list) || [];
        if (!list.length) {
            container.innerHTML =
                '<div class="empty-state">' +
                    '<div class="empty-icon">📭</div>' +
                    '<div>暂无帖子</div>' +
                    '<div style="font-size:12px;color:#bbb;margin-top:4px;">点击右下角 + 按钮发布新帖</div>' +
                '</div>';
            return;
        }
        container.innerHTML = '';
        list.forEach(function(post) {
            const cardHtml = renderPostCard(post);
            const wrapper = document.createElement('div');
            wrapper.innerHTML = cardHtml;
            const card = wrapper.firstElementChild;
            container.appendChild(card);
        });
    }).catch(function() {
        container.innerHTML = '<div style="text-align:center;padding:40px;color:#999;">加载失败</div>';
    });
}

function renderPostCard(post) {
    const categoryColor = getCategoryColor(post.category);
    const hotTag = post.isHot ? '<span class="post-hot-icon" style="color:#FF6B35;">🔥</span>' : '';
    const likedClass = post.liked ? ' liked' : '';
    const favoritedClass = post.favorited ? ' favorited' : '';
    const heartIcon = post.liked ? '❤️' : '🤍';
    const starIcon = post.favorited ? '⭐' : '☆';

    return (
        '<div class="post-card" data-post-id="' + (post.id || '') + '">' +
            '<div class="post-header">' +
                '<span class="post-author">' + escapeHtml(post.author || '匿名用户') + '</span>' +
                '<div class="post-meta-right">' +
                    '<span class="post-category-tag" style="background:' + categoryColor.bg + ';color:' + categoryColor.color + ';">' + escapeHtml(post.category || '其他') + '</span>' +
                    '<span class="post-time">' + escapeHtml(post.created_at || '') + '</span>' +
                '</div>' +
            '</div>' +
            '<div class="post-title">' + hotTag + escapeHtml(post.title || '') + '</div>' +
            '<div class="post-content">' + escapeHtml(post.content || '') + '</div>' +
            '<div class="post-actions" data-actions>' +
                '<span class="action-item' + likedClass + '" data-action="like" data-id="' + (post.id || '') + '">' + heartIcon + ' <span class="like-count">' + (post.likes || 0) + '</span></span>' +
                '<span class="action-item" data-action="view">👁 ' + (post.views || 0) + '</span>' +
                '<span class="action-item" data-action="comment" data-id="' + (post.id || '') + '">💬 ' + (post.comments || 0) + '</span>' +
                '<span class="action-item' + favoritedClass + '" data-action="favorite" data-id="' + (post.id || '') + '">' + starIcon + ' <span class="fav-count">' + (post.favorites || 0) + '</span></span>' +
                '<button class="action-btn" data-action="detail" data-id="' + (post.id || '') + '">查看</button>' +
            '</div>' +
        '</div>'
    );
}

function getCategoryColor(cat) {
    const map = {
        '社区通知': { bg: '#E3F2FD', color: '#1890FF' },
        '生活分享': { bg: '#FFF5EE', color: '#C45D3A' },
        '邻里互助': { bg: '#E8F5E9', color: '#52C41A' },
        '美食分享': { bg: '#FFF3E0', color: '#FA8C16' },
        '讨论吐槽': { bg: '#F3E5F5', color: '#9C27B0' },
        '失物招领': { bg: '#FFEBEE', color: '#FF4D4F' },
        '闲置物品': { bg: '#F0F4C3', color: '#827717' },
        '其他': { bg: '#F5F5F5', color: '#666' }
    };
    return map[cat] || { bg: '#FFF5EE', color: '#C45D3A' };
}

function openCreatePostModal() {
    if (!checkLogin()) { showToast('请先登录'); setTimeout(function() { navigateTo('login.html'); }, 1200); return; }
    document.getElementById('post-title').value = '';
    document.getElementById('post-content').value = '';

    const catContainer = document.getElementById('post-category');
    if (catContainer && window.ForumAPI) {
        window.ForumAPI.getCategories().then(function(res) {
            const list = (res && res.list) || [];
            catContainer.innerHTML = '';
            list.forEach(function(cat, idx) {
                const el = document.createElement('div');
                el.className = 'filter-tab' + (cat === currentCreateCategory ? ' active' : '');
                el.textContent = cat;
                el.addEventListener('click', function() {
                    currentCreateCategory = cat;
                    catContainer.querySelectorAll('.filter-tab').forEach(function(t) {
                        t.classList.toggle('active', t.textContent === cat);
                    });
                });
                catContainer.appendChild(el);
            });
        }).catch(function() {});
    }

    openModal('create-post-modal');
}

function createPost() {
    if (!window.ForumAPI) return;
    const title = document.getElementById('post-title').value.trim();
    const content = document.getElementById('post-content').value.trim();
    if (!title) { showToast('请输入标题', 'warning'); return; }
    if (!content) { showToast('请输入内容', 'warning'); return; }

    const user = getCurrentUser();
    window.ForumAPI.create({
        title: title,
        content: content,
        category: currentCreateCategory,
        author: user && user.name ? user.name : '当前用户',
        authorPhone: user && user.phone ? user.phone : ''
    }).then(function(res) {
        if (res && res.success !== false) {
            showToast('发布成功', 'success');
            closeModal('create-post-modal');
            loadForumPosts();
        } else {
            showToast('发布失败', 'error');
        }
    }).catch(function() { showToast('发布失败', 'error'); });
}

function toggleLike(id, btnEl) {
    if (!window.ForumAPI || !id) return;
    window.ForumAPI.like(id).then(function(res) {
        if (res && res.success !== false) {
            const liked = res.liked;
            if (btnEl) {
                btnEl.classList.toggle('liked', !!liked);
                const iconSpan = btnEl.querySelector('span.like-count');
                if (iconSpan) iconSpan.textContent = res.likes != null ? res.likes : iconSpan.textContent;
                btnEl.firstChild && (btnEl.firstChild.textContent = liked ? '❤️ ' : '🤍 ');
            }
        }
    }).catch(function() {});
}

function toggleFavorite(id, btnEl) {
    if (!window.ForumAPI || !id) return;
    window.ForumAPI.favorite(id).then(function(res) {
        if (res && res.success !== false) {
            const favorited = res.favorited;
            if (btnEl) {
                btnEl.classList.toggle('favorited', !!favorited);
                const iconSpan = btnEl.querySelector('span.fav-count');
                if (iconSpan) iconSpan.textContent = res.favorites != null ? res.favorites : iconSpan.textContent;
                btnEl.firstChild && (btnEl.firstChild.textContent = favorited ? '⭐ ' : '☆ ');
            }
            showToast(favorited ? '已收藏' : '已取消收藏');
        }
    }).catch(function() {});
}

function commentOnPost(id) {
    showToast('评论已发送', 'success');
}

function messageAuthor(post) {
    if (!post) return;
    if (!checkLogin()) { showToast('请先登录'); setTimeout(function(){ navigateTo('login.html'); }, 1000); return; }
    if (!post.author) { showToast('作者信息缺失', 'error'); return; }
    const contactId = 'forum_' + post.id + '_' + post.author;
    const contact = {
        id: contactId,
        name: post.author,
        subject: '关于帖子《' + (post.title || '').substring(0, 20) + '》',
        color: '#C45D3A',
        lastMessage: '（暂无消息）',
        unread: false,
        messages: [],
        lastTime: new Date().toLocaleString('zh-CN', { hour12: false }),
        phone: post.authorPhone || ''
    };
    if (typeof saveOrUpdateContact === 'function') { saveOrUpdateContact(contact); }
    showToast('已为您创建私信对话，请在消息中查看', 'success');
    setTimeout(function() { navigateTo('notices.html?tab=contacts&open=' + contactId); }, 600);
}

function renderCommentList(postId) {
    const listContainer = document.getElementById('forum-comments-list');
    const countTitle = document.getElementById('forum-comments-count');
    if (!listContainer || !window.ForumAPI) return;
    listContainer.innerHTML = '<div style="text-align:center;padding:16px;color:#999;font-size:12px;">加载中...</div>';
    window.ForumAPI.getComments(postId).then(function(res) {
        const list = (res && res.list) || [];
        const total = (res && res.total != null) ? res.total : list.length;
        if (countTitle) {
            countTitle.textContent = '全部评论（' + total + '）';
        }
        if (!list.length) {
            listContainer.innerHTML = '<div style="text-align:center;padding:16px;color:#999;font-size:12px;">暂无评论，来抢沙发吧</div>';
            return;
        }
        const user = getCurrentUser && getCurrentUser();
        const currentName = user && user.name ? user.name : '';
        let html = '';
        list.forEach(function(c) {
            const isSelf = currentName && c.author && currentName === c.author;
            const canMessage = !isSelf && currentName && c.author;
            html +=
                '<div style="background:#FAFAFA;border-radius:8px;padding:12px;margin-bottom:8px;">' +
                    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">' +
                        '<div style="font-weight:600;font-size:13px;color:#333;">' + escapeHtml(c.author || '匿名用户') + '</div>' +
                        '<div style="font-size:11px;color:#999;">' + escapeHtml(c.created_at || '') + '</div>' +
                    '</div>' +
                    '<div style="font-size:13px;color:#555;line-height:1.6;white-space:pre-wrap;">' + escapeHtml(c.content || '') + '</div>' +
                    (canMessage ? (
                        '<div style="text-align:right;margin-top:8px;">' +
                            '<button class="btn" data-comment-message="' + c.id + '" style="padding:4px 10px;font-size:12px;background:#FFF5EE;color:#C45D3A;border:1px solid #C45D3A;border-radius:12px;cursor:pointer;">💬 私信TA</button>' +
                        '</div>'
                    ) : '') +
                '</div>';
        });
        listContainer.innerHTML = html;

        listContainer.querySelectorAll('[data-comment-message]').forEach(function(btn) {
            btn.addEventListener('click', function() {
                const cid = btn.getAttribute('data-comment-message');
                const comment = list.find(function(x) { return String(x.id) === String(cid); });
                if (!comment) return;
                if (!checkLogin()) { showToast('请先登录'); setTimeout(function(){ navigateTo('login.html'); }, 1000); return; }
                const contactId = 'forum_comment_' + postId + '_' + comment.author;
                const contact = {
                    id: contactId,
                    name: comment.author,
                    subject: '关于帖子评论',
                    color: '#C45D3A',
                    lastMessage: '（暂无消息）',
                    unread: false,
                    messages: [],
                    lastTime: new Date().toLocaleString('zh-CN', { hour12: false }),
                    phone: comment.authorPhone || ''
                };
                if (typeof saveOrUpdateContact === 'function') { saveOrUpdateContact(contact); }
                navigateTo('notices.html?tab=contacts&open=' + contactId);
            });
        });
    }).catch(function() {
        if (listContainer) listContainer.innerHTML = '<div style="text-align:center;padding:16px;color:#999;font-size:12px;">评论加载失败</div>';
    });
}

function showPostDetail(id) {
    if (!window.ForumAPI || !id) return;
    currentDetailPostId = id;
    const body = document.getElementById('post-detail-body');
    if (!body) return;
    body.innerHTML = '<div style="text-align:center;padding:30px;color:#999;">加载中...</div>';

    window.ForumAPI.detail(id).then(function(post) {
        if (!post) {
            body.innerHTML = '<div style="text-align:center;padding:40px;color:#999;">帖子不存在</div>';
            return;
        }
        const categoryColor = getCategoryColor(post.category);
        const hotTag = post.isHot ? '<span style="font-size:14px;color:#FF6B35;margin-left:6px;">🔥 热门</span>' : '';

        body.innerHTML =
            '<div class="post-detail-title">' + escapeHtml(post.title || '') + hotTag + '</div>' +
            '<div class="post-detail-meta">' +
                '<span>👤 ' + escapeHtml(post.author || '匿名用户') + '</span>' +
                '<span class="post-category-tag" style="background:' + categoryColor.bg + ';color:' + categoryColor.color + ';">' + escapeHtml(post.category || '其他') + '</span>' +
                '<span>🕒 ' + escapeHtml(post.created_at || '') + '</span>' +
                '<span>👁 ' + (post.views || 0) + '</span>' +
            '</div>' +
            '<div class="post-detail-content">' + escapeHtml(post.content || '') + '</div>' +
            '<div class="post-detail-actions" data-detail-actions>' +
                '<span class="action-item' + (post.liked ? ' liked' : '') + '" data-action="like" data-id="' + post.id + '">' + (post.liked ? '❤️' : '🤍') + ' 点赞 ' + (post.likes || 0) + '</span>' +
                '<span class="action-item' + (post.favorited ? ' favorited' : '') + '" data-action="favorite" data-id="' + post.id + '">' + (post.favorited ? '⭐' : '☆') + ' 收藏 ' + (post.favorites || 0) + '</span>' +
                '<span class="action-item" data-action="comment" data-id="' + post.id + '">💬 评论 ' + (post.comments || 0) + '</span>' +
                '<span class="action-item" data-action="report" data-id="' + post.id + '">📢 举报</span>' +
                '<span class="action-item" data-action="message" data-id="' + post.id + '">📧 私信</span>' +
            '</div>' +
            '<div class="comment-section-title" style="margin-top:16px;" id="forum-comments-count">全部评论（0）</div>' +
            '<div id="forum-comments-list" style="padding:8px 0;"></div>' +
            '<div class="comment-section-title">发表评论</div>' +
            '<div class="comment-input-wrap">' +
                '<input type="text" class="form-input" id="comment-input" placeholder="写下你的评论...">' +
                '<button class="btn btn-primary" id="btn-send-comment">发送</button>' +
            '</div>';

        bindDetailEvents(post);
        renderCommentList(post.id);
        openModal('post-detail-modal');
    }).catch(function() {
        body.innerHTML = '<div style="text-align:center;padding:40px;color:#999;">加载失败</div>';
    });
}

function bindDetailEvents(post) {
    const body = document.getElementById('post-detail-body');
    if (!body) return;

    body.querySelectorAll('[data-action]').forEach(function(el) {
        el.addEventListener('click', function() {
            const action = el.getAttribute('data-action');
            const id = el.getAttribute('data-id');
            if (action === 'like') {
                window.ForumAPI.like(id).then(function(res) {
                    if (res && res.success !== false) {
                        el.classList.toggle('liked', !!res.liked);
                        el.firstChild && (el.firstChild.textContent = res.liked ? '❤️' : '🤍');
                        el.innerHTML = (res.liked ? '❤️' : '🤍') + ' 点赞 ' + (res.likes != null ? res.likes : 0);
                    }
                }).catch(function() {});
            } else if (action === 'favorite') {
                window.ForumAPI.favorite(id).then(function(res) {
                    if (res && res.success !== false) {
                        el.classList.toggle('favorited', !!res.favorited);
                        el.innerHTML = (res.favorited ? '⭐' : '☆') + ' 收藏 ' + (res.favorites != null ? res.favorites : 0);
                        showToast(res.favorited ? '已收藏' : '已取消收藏');
                    }
                }).catch(function() {});
            } else if (action === 'comment') {
                showToast('评论功能');
                const input = document.getElementById('comment-input');
                if (input) { input.focus(); }
            } else if (action === 'report') {
                openComplaintModal({
                    type: 'post',
                    target_post_id: post.id,
                    target_post_title: post.title,
                    target_user_id: 'u_' + (post.author || ''),
                    target_user_name: post.author || '匿名用户'
                });
            } else if (action === 'message') {
                messageAuthor(post);
            }
        });
    });

    const sendBtn = document.getElementById('btn-send-comment');
    if (sendBtn) {
        sendBtn.addEventListener('click', function() {
            const input = document.getElementById('comment-input');
            const content = input ? input.value.trim() : '';
            if (!content) { showToast('请输入评论内容', 'warning'); return; }
            if (!checkLogin()) { showToast('请先登录'); setTimeout(function() { navigateTo('login.html'); }, 1200); return; }
            window.ForumAPI.comment(post.id, content).then(function(res) {
                if (res && res.success !== false) {
                    showToast('评论成功', 'success');
                    if (input) input.value = '';
                    loadForumPosts();
                    renderCommentList(post.id);
                } else {
                    showToast('评论失败', 'error');
                }
            }).catch(function() { showToast('评论失败', 'error'); });
        });
    }

    const detailMsgBtn = document.getElementById('btn-detail-message');
    if (detailMsgBtn) {
        detailMsgBtn.onclick = function() { messageAuthor(post); };
    }

    const detailReportBtn = document.getElementById('btn-detail-report');
    if (detailReportBtn) {
        detailReportBtn.onclick = function() {
            openComplaintModal({
                type: 'post',
                target_post_id: post.id,
                target_post_title: post.title,
                target_user_id: 'u_' + (post.author || ''),
                target_user_name: post.author || '匿名用户'
            });
        };
    }
}

// 监听列表中的点击事件（事件委托）
document.addEventListener('click', function(e) {
    const list = document.getElementById('forum-list');
    if (!list) return;
    const target = e.target;
    const actionEl = target.closest('[data-action]');

    // 互动按钮事件
    if (actionEl && list.contains(actionEl)) {
        const action = actionEl.getAttribute('data-action');
        const id = actionEl.getAttribute('data-id');
        e.stopPropagation();

        if (action === 'like') {
            toggleLike(id, actionEl);
        } else if (action === 'favorite') {
            toggleFavorite(id, actionEl);
        } else if (action === 'comment') {
            commentOnPost(id);
        } else if (action === 'detail') {
            showPostDetail(id);
        }
        return;
    }

    // 整张卡片点击 -> 进入详情
    const card = target.closest('.post-card');
    if (card && list.contains(card)) {
        const id = card.getAttribute('data-post-id');
        if (id) showPostDetail(id);
    }
});

initForum();
</script>
