<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>邻里互助 - 邻里智联</title>
<link rel="stylesheet" href="css/style.css">
<style>
  /* 页面专属样式 */
  .help-category-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    padding: 12px 16px 4px;
  }

  .help-category-item {
    background: white;
    border-radius: 12px;
    padding: 14px 8px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    transition: all 0.2s;
    border: 2px solid transparent;
  }

  .help-category-item:active { transform: scale(0.96); }

  .help-category-item.active {
    background: #FFF5EE;
    border-color: #C45D3A;
    box-shadow: 0 2px 12px rgba(196, 93, 58, 0.2);
  }

  .help-category-icon { font-size: 28px; margin-bottom: 6px; }

  .help-category-name {
    font-size: 12px;
    color: #333;
    font-weight: 500;
  }

  .help-category-item.active .help-category-name { color: #C45D3A; font-weight: 600; }

  /* 操作栏 */
  .help-action-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px 0;
  }

  .help-action-info {
    font-size: 14px;
    color: #333;
    font-weight: 500;
  }

  .help-action-info .count {
    color: #C45D3A;
    font-weight: 600;
    margin: 0 2px;
  }

  /* 需求卡片 */
  .demand-card {
    background: white;
    border-radius: 12px;
    padding: 14px;
    margin: 8px 16px 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
  }

  .demand-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 8px;
  }

  .demand-title {
    font-size: 15px;
    font-weight: 600;
    color: #333;
    line-height: 1.4;
    flex: 1;
  }

  .demand-status {
    padding: 3px 10px;
    border-radius: 4px;
    font-size: 12px;
    color: white;
    font-weight: 500;
    flex-shrink: 0;
  }

  .demand-status.open { background: #52C41A; }
  .demand-status.accepted { background: #1890FF; }
  .demand-status.completed { background: #999; }

  .demand-content {
    font-size: 13px;
    color: #666;
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 8px;
  }

  .demand-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 12px;
    color: #999;
    margin-bottom: 10px;
  }

  .demand-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    border-top: 1px solid #f0f0f0;
    padding-top: 10px;
  }

  .demand-points {
    font-size: 13px;
    color: #C45D3A;
    font-weight: 600;
  }

  .demand-buttons {
    display: flex;
    gap: 6px;
  }

  .demand-btn {
    padding: 6px 12px;
    border: none;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 500;
  }

  .demand-btn-detail { background: #FFF5EE; color: #C45D3A; }
  .demand-btn-detail:active { background: #FFE4D1; }

  .demand-btn-accept { background: #52C41A; color: white; }
  .demand-btn-accept:active { background: #45A019; }

  .demand-btn-contact { background: #1890FF; color: white; }
  .demand-btn-contact:active { background: #0E7FE0; }

  .demand-btn-complete { background: #FAAD14; color: white; }
  .demand-btn-complete:active { background: #D8930A; }

  /* 空状态 */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #999;
    font-size: 14px;
  }

  .empty-state .empty-icon {
    font-size: 48px;
    margin-bottom: 12px;
    opacity: 0.6;
  }

  /* 只读显示 */
  .form-readonly {
    padding: 10px 14px;
    background: #FFF5EE;
    border: 1.5px solid #F5DCC0;
    border-radius: 8px;
    color: #C45D3A;
    font-size: 13px;
    font-weight: 500;
  }

  /* 详情内容 */
  .detail-full-content {
    font-size: 14px;
    color: #555;
    line-height: 1.8;
    background: #FAFAFA;
    padding: 12px;
    border-radius: 8px;
    margin: 8px 0;
  }

  .detail-meta-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 13px;
    border-bottom: 1px dashed #eee;
  }

  .detail-meta-row:last-child { border-bottom: none; }

  .detail-meta-label { color: #999; }
  .detail-meta-value { color: #333; font-weight: 500; }

  .detail-points-badge {
    display: inline-block;
    background: linear-gradient(135deg, #C45D3A, #E07B5A);
    color: white;
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    margin: 10px 0;
  }

  /* Modal 内按钮 */
  .btn-block-row {
    display: flex;
    gap: 8px;
  }

  .btn-block-row .btn { flex: 1; }

  @media screen and (min-width: 768px) {
    .help-category-grid { max-width: 720px; margin: 0 auto; }
    .demand-card, .help-action-bar { max-width: 688px; margin-left: auto; margin-right: auto; }
  }
</style>
</head>
<body>
<div class="page-container">
  <!-- 页头 -->
  <div class="page-header">
    <h1>🤝 邻里互助</h1>
  </div>

  <!-- 分类导航区 -->
  <div class="help-category-grid" id="help-category-grid">
    <!-- JS 动态渲染 -->
  </div>

  <!-- 操作区 -->
  <div class="help-action-bar">
    <div class="help-action-info">
      当前分类：<span id="current-category-name">取快递</span>
      · 共 <span class="count" id="current-category-count">0</span> 条需求
    </div>
    <button class="btn btn-primary btn-sm" id="btn-create-demand" style="padding:8px 14px;">
      ＋ 发布新需求
    </button>
  </div>

  <!-- 需求列表 -->
  <div id="help-list" style="padding: 8px 0 20px;">
    <div class="empty-state" id="help-list-loading">
      <div class="empty-icon">📭</div>
      加载中...
    </div>
  </div>

  <!-- 底部 Tab Bar -->
  <div class="tab-bar">
    <div class="tab-item" data-href="index.html">
      <div class="tab-icon">🏠</div>
      <div>首页</div>
    </div>
    <div class="tab-item" data-href="share.html">
      <div class="tab-icon">🔄</div>
      <div>共享</div>
    </div>
    <div class="tab-item" data-href="notices.html">
      <div class="tab-icon">💬</div>
      <div>消息</div>
    </div>
    <div class="tab-item active">
      <div class="tab-icon">🤝</div>
      <div>邻里互助</div>
    </div>
  </div>
</div>

<!-- 发布需求弹窗 -->
<div class="modal" id="create-demand-modal">
  <div class="modal-mask" onclick="closeModal('create-demand-modal')"></div>
  <div class="modal-content">
    <div class="modal-header">
      <span>发布新需求</span>
      <span class="modal-close" onclick="closeModal('create-demand-modal')">×</span>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>分类（自动选择）</label>
        <div class="form-readonly" id="demand-category">取快递</div>
      </div>
      <div class="form-group">
        <label>需求标题</label>
        <input type="text" class="form-input" id="demand-title" placeholder="简短描述您的需求（如：帮忙取快递）" maxlength="30">
      </div>
      <div class="form-group">
        <label>详细描述</label>
        <textarea class="form-textarea" id="demand-content" placeholder="详细说明您的需求内容、取件地点等信息..." rows="4" maxlength="300"></textarea>
      </div>
      <div class="form-group">
        <label>期望时间</label>
        <input type="text" class="form-input" id="demand-time" placeholder="如：今晚18:00-20:00" maxlength="50">
      </div>
      <div class="form-group">
        <label>积分感谢（可选）</label>
        <input type="number" class="form-input" id="demand-points" placeholder="0" min="0" max="10000">
      </div>
    </div>
    <div class="modal-footer">
      <div class="btn-block-row">
        <button class="btn btn-block btn-lg" onclick="closeModal('create-demand-modal')">取消</button>
        <button class="btn btn-primary btn-block btn-lg" id="btn-create-submit">立即发布</button>
      </div>
    </div>
  </div>
</div>

<!-- 需求详情弹窗 -->
<div class="modal" id="demand-detail-modal">
  <div class="modal-mask" onclick="closeModal('demand-detail-modal')"></div>
  <div class="modal-content">
    <div class="modal-header">
      <span>需求详情</span>
      <span class="modal-close" onclick="closeModal('demand-detail-modal')">×</span>
    </div>
    <div class="modal-body" id="demand-detail-body">
      <!-- 动态内容 -->
    </div>
    <div class="modal-footer" id="demand-detail-footer">
      <!-- 动态按钮 -->
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
  // ========== 邻里互助页面逻辑 ==========

  // 分类图标映射
  const HELP_CATEGORY_ICONS = {
    '取快递': '📦',
    '照看宠物': '🐕',
    '陪伴老人': '👴',
    '绿植托管': '🌱'
  };

  // 当前选中的分类
  let _currentCategory = null;
  // 当前操作的需求对象（用于详情弹窗）
  let _currentDemand = null;

  // 页面初始化
  function initHelpPage() {
    // 绑定 tab-bar 跳转
    document.querySelectorAll('.tab-bar .tab-item').forEach(function (item) {
      item.addEventListener('click', function () {
        const href = item.getAttribute('data-href');
        if (href) navigateTo(href);
      });
    });

    // 绑定发布按钮
    const btnCreate = document.getElementById('btn-create-demand');
    if (btnCreate) {
      btnCreate.addEventListener('click', function () {
        if (!checkLogin()) {
          showToast('请先登录', 'warning');
          setTimeout(function () { navigateTo('login.html'); }, 1000);
          return;
        }
        openCreateDemandModal(_currentCategory);
      });
    }

    // 绑定发布提交按钮
    const btnSubmit = document.getElementById('btn-create-submit');
    if (btnSubmit) {
      btnSubmit.addEventListener('click', createDemand);
    }

    // 加载分类
    if (!window.HelpAPI) {
      showToast('系统初始化失败', 'error');
      return;
    }

    // 解析 URL 参数（从首页跳转到 help.html?cat=xxx）
    function getInitialCategory(cats) {
      try {
        const url = new URL(window.location.href);
        const catParam = url.searchParams.get('cat');
        if (catParam && cats.indexOf(catParam) >= 0) {
          return catParam;
        }
      } catch (e) {}
      return cats[0];
    }

    // 先渲染分类（默认 4 个，以 getCategories 返回为准）
    window.HelpAPI.getCategories().then(function (res) {
      const cats = (res && res.list) || [];
      if (!cats.length) return;
      renderCategories(cats);
      selectHelpCategory(getInitialCategory(cats));
    }).catch(function () {
      // 回退默认
      const defaultCats = ['取快递', '照看宠物', '陪伴老人', '绿植托管'];
      renderCategories(defaultCats);
      selectHelpCategory(getInitialCategory(defaultCats));
    });
  }

  // 渲染分类卡片
  function renderCategories(categories) {
    const container = document.getElementById('help-category-grid');
    if (!container) return;
    container.innerHTML = '';
    categories.forEach(function (cat) {
      const item = document.createElement('div');
      item.className = 'help-category-item';
      item.setAttribute('data-category', cat);
      const icon = HELP_CATEGORY_ICONS[cat] || '🤝';
      item.innerHTML =
        '<div class="help-category-icon">' + icon + '</div>' +
        '<div class="help-category-name">' + cat + '</div>';
      item.addEventListener('click', function () {
        selectHelpCategory(cat);
      });
      container.appendChild(item);
    });
  }

  // 切换分类
  function selectHelpCategory(category) {
    _currentCategory = category;

    // 更新高亮
    document.querySelectorAll('.help-category-item').forEach(function (item) {
      if (item.getAttribute('data-category') === category) {
        item.classList.add('active');
      } else {
        item.classList.remove('active');
      }
    });

    // 更新操作区显示
    const nameEl = document.getElementById('current-category-name');
    if (nameEl) nameEl.textContent = category;

    // 加载列表
    loadHelpDemands(category);
  }

  // 加载需求列表
  function loadHelpDemands(category) {
    const listEl = document.getElementById('help-list');
    if (!listEl) return;
    listEl.innerHTML =
      '<div class="empty-state" id="help-list-loading">' +
        '<div class="empty-icon">⏳</div>加载中...' +
      '</div>';

    if (!window.HelpAPI) return;

    window.HelpAPI.listByCategory(category).then(function (res) {
      const list = (res && res.list) || [];
      const total = (res && res.total) || list.length;

      // 更新统计
      const countEl = document.getElementById('current-category-count');
      if (countEl) countEl.textContent = total;

      if (!list.length) {
        listEl.innerHTML =
          '<div class="empty-state">' +
            '<div class="empty-icon">📭</div>' +
            '<div>暂无需求，快来发布第一条吧！</div>' +
          '</div>';
        return;
      }

      listEl.innerHTML = '';
      list.forEach(function (demand) {
        const card = renderDemandCard(demand, category);
        listEl.appendChild(card);
      });
    }).catch(function () {
      listEl.innerHTML =
        '<div class="empty-state">' +
          '<div class="empty-icon">⚠️</div>' +
          '<div>加载失败，请重试</div>' +
        '</div>';
    });
  }

  // 渲染单个需求卡片 DOM
  function renderDemandCard(demand, category) {
    const card = document.createElement('div');
    card.className = 'demand-card';

    // 状态文本
    const statusMap = { open: '进行中', accepted: '已接受', completed: '已完成' };
    const statusText = statusMap[demand.status] || '进行中';
    const statusClass = (statusMap[demand.status] ? demand.status : 'open');

    // 积分文本
    const points = parseInt(demand.points) || 0;
    const pointsText = points > 0 ? (points + ' 积分感谢') : '邻里互助';

    // 判断当前用户是否是发布者
    const user = getCurrentUser();
    const isOwner = user && user.name && demand.publisher && demand.publisher.indexOf(user.name) >= 0;

    // 决定显示哪些按钮
    let actionButtons = '<button class="demand-btn demand-btn-detail" data-action="detail">查看详情</button>';

    if (demand.status === 'open' && !isOwner) {
      actionButtons += '<button class="demand-btn demand-btn-accept" data-action="accept">接受需求</button>';
    }
    if (demand.status === 'accepted') {
      actionButtons += '<button class="demand-btn demand-btn-complete" data-action="complete">完成需求</button>';
    }
    actionButtons += '<button class="demand-btn demand-btn-contact" data-action="contact">联系发布人</button>';
    if (isOwner) {
      actionButtons += '<button class="demand-btn demand-btn-delete" data-action="delete" style="background:#FFF;color:#FF4D4F;border:1px solid #FFD1CC;">删除</button>';
    }

    card.innerHTML =
      '<div class="demand-card-header">' +
        '<div class="demand-title">' + escapeHtml(demand.title || '无标题') + (isOwner ? '<span style="display:inline-block;margin-left:6px;padding:2px 8px;font-size:11px;background:#FFF5EE;color:#C45D3A;border-radius:3px;vertical-align:middle;">我发布的</span>' : '') + '</div>' +
        '<div class="demand-status ' + statusClass + '">' + statusText + '</div>' +
      '</div>' +
      '<div class="demand-content">' + escapeHtml(demand.content || '暂无详细描述') + '</div>' +
      '<div class="demand-meta">' +
        '<span>🕒 ' + escapeHtml(demand.time || '未指定') + '</span>' +
        '<span>👤 ' + escapeHtml(demand.publisher || '邻居') + '</span>' +
        (demand.views ? ('<span>👁️ ' + demand.views + ' 次浏览</span>') : '') +
      '</div>' +
      '<div class="demand-footer">' +
        '<div class="demand-points">' + pointsText + '</div>' +
        '<div class="demand-buttons">' + actionButtons + '</div>' +
      '</div>';

    // 绑定按钮点击
    card.querySelectorAll('[data-action]').forEach(function (btn) {
      const action = btn.getAttribute('data-action');
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (action === 'detail') {
          showDemandDetail(demand.id, category);
        } else if (action === 'accept') {
          acceptDemand(demand.id, category);
        } else if (action === 'contact') {
          contactPublisher(demand.phone, demand.publisher);
        } else if (action === 'complete') {
          completeDemand(demand.id, category);
        } else if (action === 'delete') {
          deleteDemand(demand.id, category);
        }
      });
    });

    // 卡片点击也可以打开详情
    card.addEventListener('click', function () {
      showDemandDetail(demand.id, category);
    });

    return card;
  }

  // 打开发布需求弹窗
  function openCreateDemandModal(category) {
    const categoryEl = document.getElementById('demand-category');
    if (categoryEl) categoryEl.textContent = category || _currentCategory || '';

    // 清空表单
    const titleEl = document.getElementById('demand-title');
    const contentEl = document.getElementById('demand-content');
    const timeEl = document.getElementById('demand-time');
    const pointsEl = document.getElementById('demand-points');
    if (titleEl) titleEl.value = '';
    if (contentEl) contentEl.value = '';
    if (timeEl) timeEl.value = '';
    if (pointsEl) pointsEl.value = '';

    openModal('create-demand-modal');
  }

  // 提交发布
  function createDemand() {
    const titleEl = document.getElementById('demand-title');
    const contentEl = document.getElementById('demand-content');
    const timeEl = document.getElementById('demand-time');
    const pointsEl = document.getElementById('demand-points');
    const categoryEl = document.getElementById('demand-category');

    const title = (titleEl ? titleEl.value.trim() : '') || '';
    const content = (contentEl ? contentEl.value.trim() : '') || '';
    const time = (timeEl ? timeEl.value.trim() : '') || '';
    const points = (pointsEl ? parseInt(pointsEl.value) || 0 : 0);
    const category = (categoryEl ? categoryEl.textContent : _currentCategory) || '取快递';

    if (!title) { showToast('请输入需求标题', 'warning'); return; }
    if (!content) { showToast('请输入详细描述', 'warning'); return; }
    if (title.length < 4) { showToast('标题至少 4 个字', 'warning'); return; }
    if (content.length < 10) { showToast('描述至少 10 个字', 'warning'); return; }

    if (!window.HelpAPI) {
      showToast('系统异常', 'error');
      return;
    }

    // 获取当前用户信息，作为发布者
    const user = getCurrentUser();
    const publisher = (user && user.name) ? user.name : '当前用户';
    const phone = (user && user.phone) ? user.phone : '';

    const submitBtn = document.getElementById('btn-create-submit');
    if (submitBtn) {
      submitBtn.disabled = true;
      submitBtn.textContent = '发布中...';
    }

    window.HelpAPI.create({
      title: title, content: content, category: category,
      time: time, points: points, publisher: publisher, phone: phone
    }).then(function (res) {
      if (res && res.success !== false) {
        showToast('发布成功', 'success');
        closeModal('create-demand-modal');
        // 重新加载当前分类
        loadHelpDemands(category);
      } else {
        showToast((res && res.message) || '发布失败', 'error');
      }
    }).catch(function () {
      showToast('发布失败', 'error');
    }).finally(function () {
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.textContent = '立即发布';
      }
    });
  }

  // 显示需求详情
  function showDemandDetail(id, category) {
    const bodyEl = document.getElementById('demand-detail-body');
    const footerEl = document.getElementById('demand-detail-footer');
    if (!bodyEl) return;

    bodyEl.innerHTML =
      '<div style="text-align:center;padding:20px;color:#999;">加载中...</div>';
    if (footerEl) footerEl.innerHTML = '';

    if (!window.HelpAPI) return;

    window.HelpAPI.detail(id).then(function (demand) {
      if (!demand) {
        bodyEl.innerHTML =
          '<div style="text-align:center;padding:30px;color:#999;">未找到该需求</div>';
        return;
      }

      _currentDemand = demand;

      const statusMap = { open: '进行中', accepted: '已接受', completed: '已完成' };
      const statusText = statusMap[demand.status] || '进行中';
      const statusClass = statusMap[demand.status] ? demand.status : 'open';
      const points = parseInt(demand.points) || 0;

      // 判断是否是发布者
      const user = getCurrentUser();
      const isOwner = user && user.name && demand.publisher && demand.publisher.indexOf(user.name) >= 0;

      bodyEl.innerHTML =
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;">' +
          '<div style="font-size:18px;font-weight:600;color:#333;line-height:1.4;">' + escapeHtml(demand.title || '无标题') + '</div>' +
          '<div class="demand-status ' + statusClass + '" style="flex-shrink:0;">' + statusText + '</div>' +
        '</div>' +

        '<div style="background:#FAFAFA;padding:10px 12px;border-radius:8px;margin-bottom:10px;">' +
          '<div class="detail-meta-row"><span class="detail-meta-label">发布者</span><span class="detail-meta-value">' + escapeHtml(demand.publisher || '邻居') + (isOwner ? ' <span style="color:#C45D3A;font-size:11px;">（我）</span>' : '') + '</span></div>' +
          '<div class="detail-meta-row"><span class="detail-meta-label">联系电话</span><span class="detail-meta-value">' + (demand.phone ? escapeHtml(maskPhone(demand.phone)) : '未填写') + '</span></div>' +
          '<div class="detail-meta-row"><span class="detail-meta-label">发布时间</span><span class="detail-meta-value">' + escapeHtml(demand.created_at || '') + '</span></div>' +
          '<div class="detail-meta-row"><span class="detail-meta-label">期望时间</span><span class="detail-meta-value">' + escapeHtml(demand.time || '未指定') + '</span></div>' +
          (demand.views ? '<div class="detail-meta-row"><span class="detail-meta-label">浏览次数</span><span class="detail-meta-value">' + demand.views + ' 次</span></div>' : '') +
          (demand.accepted_by ? '<div class="detail-meta-row"><span class="detail-meta-label">已接受人</span><span class="detail-meta-value">' + escapeHtml(demand.accepted_by) + '</span></div>' : '') +
        '</div>' +

        '<div class="detail-full-content">' + escapeHtml(demand.content || '暂无详细描述') + '</div>' +

        '<div style="text-align:center;">' +
          '<span class="detail-points-badge">🎁 ' + (points > 0 ? points + ' 积分感谢' : '爱心互助') + '</span>' +
        '</div>';

      // 动态按钮区
      if (footerEl) {
        footerEl.innerHTML = '';
        const buttons = [];

        if (demand.status === 'open' && !isOwner) {
          const btnAccept = document.createElement('button');
          btnAccept.className = 'btn btn-primary btn-block btn-lg';
          btnAccept.style.background = '#52C41A';
          btnAccept.textContent = '✋ 我来帮你（接受需求）';
          btnAccept.onclick = function () { acceptDemand(id, category); };
          buttons.push(btnAccept);
        } else if (demand.status === 'accepted') {
          const btnComplete = document.createElement('button');
          btnComplete.className = 'btn btn-primary btn-block btn-lg';
          btnComplete.style.background = '#FAAD14';
          btnComplete.textContent = '✓ 标记完成';
          btnComplete.onclick = function () { completeDemand(id, category); };
          buttons.push(btnComplete);
        }

        const btnContact = document.createElement('button');
        btnContact.className = 'btn btn-block btn-lg';
        btnContact.style.background = '#1890FF';
        btnContact.style.color = 'white';
        btnContact.textContent = '📞 联系发布人';
        btnContact.onclick = function () { contactPublisher(demand.phone, demand.publisher); };
        buttons.push(btnContact);

        if (isOwner) {
          const btnDelete = document.createElement('button');
          btnDelete.className = 'btn btn-block btn-lg';
          btnDelete.style.background = '#FFF';
          btnDelete.style.color = '#FF4D4F';
          btnDelete.style.border = '1px solid #FFD1CC';
          btnDelete.textContent = '🗑 删除此需求';
          btnDelete.onclick = function () { deleteDemand(id, category); };
          buttons.push(btnDelete);
        }

        const btnClose = document.createElement('button');
        btnClose.className = 'btn btn-block';
        btnClose.style.background = '#F5F5F5';
        btnClose.style.color = '#666';
        btnClose.textContent = '关闭';
        btnClose.onclick = function () { closeModal('demand-detail-modal'); };
        buttons.push(btnClose);

        buttons.forEach(function (b) { footerEl.appendChild(b); });
      }
    }).catch(function () {
      if (bodyEl) {
        bodyEl.innerHTML = '<div style="text-align:center;padding:30px;color:#999;">加载失败</div>';
      }
    });

    openModal('demand-detail-modal');
  }

  // 接受需求
  function acceptDemand(id, category) {
    if (!checkLogin()) {
      showToast('请先登录', 'warning');
      setTimeout(function () { navigateTo('login.html'); }, 1000);
      return;
    }

    showConfirm(
      '接受需求',
      '您确定要接受此需求吗？接受后请及时联系发布者完成互助。',
      '确认接受',
      '再想想'
    ).then(function (ok) {
      if (!ok) return;
      if (!window.HelpAPI) return;
      window.HelpAPI.accept(id, category).then(function (res) {
        if (res && res.success !== false) {
          showToast('接受成功，已通知发布者', 'success');
          closeModal('demand-detail-modal');
          loadHelpDemands(category || _currentCategory);
        } else {
          showToast((res && res.message) || '操作失败', 'error');
        }
      }).catch(function () {
        showToast('操作失败', 'error');
      });
    });
  }

  // 联系发布人
  function contactPublisher(phone, name) {
    // 使用 Toast 提示并打开消息联系
    if (!checkLogin()) {
      showToast('请先登录', 'warning');
      setTimeout(function () { navigateTo('login.html'); }, 1000);
      return;
    }

    const displayName = name || '发布者';
    const contactId = 'help_' + (phone ? phone.replace(/\D/g, '') : Date.now());

    // 保存联系人信息到本地消息系统
    try {
      const contact = {
        id: contactId,
        name: displayName,
        subject: '邻里互助',
        color: '#52C41A',
        lastMessage: '',
        unread: false,
        messages: [],
        lastTime: new Date().toLocaleString('zh-CN', { hour12: false }),
        phone: phone || ''
      };
      saveOrUpdateContact(contact);
    } catch (e) {}

    // 如果能打开电话拨号，优先提示拨打
    if (phone) {
      showToast('已为您创建与 ' + displayName + ' 的联系，请前往消息页沟通', 'info', 3000);
      setTimeout(function () { navigateTo('notices.html?tab=contacts&open=' + contactId); }, 800);
    } else {
      showToast('发布者未填写电话，已创建消息联系', 'info', 2500);
      setTimeout(function () { navigateTo('notices.html?tab=contacts&open=' + contactId); }, 800);
    }
  }

  // 完成需求
  function completeDemand(id, category) {
    if (!checkLogin()) {
      showToast('请先登录', 'warning');
      setTimeout(function () { navigateTo('login.html'); }, 1000);
      return;
    }

    showConfirm(
      '完成需求',
      '确认此需求已完成并结算积分吗？确认后状态将变更为"已完成"。',
      '确认完成',
      '取消'
    ).then(function (ok) {
      if (!ok) return;
      if (!window.HelpAPI) return;
      window.HelpAPI.complete(id, category).then(function (res) {
        if (res && res.success !== false) {
          showToast('已完成，感谢您的热心帮助！', 'success');
          closeModal('demand-detail-modal');
          loadHelpDemands(category || _currentCategory);
        } else {
          showToast((res && res.message) || '操作失败', 'error');
        }
      }).catch(function () {
        showToast('操作失败', 'error');
      });
    });
  }

  // 删除需求
  function deleteDemand(id, category) {
    if (!checkLogin()) {
      showToast('请先登录', 'warning');
      setTimeout(function () { navigateTo('login.html'); }, 1000);
      return;
    }

    showConfirm(
      '删除需求',
      '您确定要删除此需求吗？删除后将无法恢复。',
      '确认删除',
      '取消'
    ).then(function (ok) {
      if (!ok) return;
      if (!window.HelpAPI) return;
      window.HelpAPI.deleteDemand(id, category).then(function (res) {
        if (res && res.success !== false) {
          showToast('删除成功', 'success');
          closeModal('demand-detail-modal');
          loadHelpDemands(category || _currentCategory);
        } else {
          showToast((res && res.message) || '操作失败', 'error');
        }
      }).catch(function () {
        showToast('操作失败', 'error');
      });
    });
  }

  // 暴露到全局（便于调试）
  window.initHelpPage = initHelpPage;
  window.selectHelpCategory = selectHelpCategory;
  window.loadHelpDemands = loadHelpDemands;
  window.renderDemandCard = renderDemandCard;
  window.openCreateDemandModal = openCreateDemandModal;
  window.createDemand = createDemand;
  window.showDemandDetail = showDemandDetail;
  window.acceptDemand = acceptDemand;
  window.contactPublisher = contactPublisher;
  window.completeDemand = completeDemand;
  window.deleteDemand = deleteDemand;

  // 启动页面
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initHelpPage);
  } else {
    initHelpPage();
  }
</script>
</body>
</html>
