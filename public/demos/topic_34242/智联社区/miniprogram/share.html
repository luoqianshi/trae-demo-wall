<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>邻里共享 - 邻里智联</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page-container">
    <div class="page-header">
        <h1>🤝 邻里共享</h1>
    </div>

    <div class="page-tabs">
        <div class="page-tab active" data-tab="list">物品列表</div>
        <div class="page-tab" data-tab="mine">我的发布</div>
        <div class="page-tab" data-tab="borrow">我的借用</div>
    </div>

    <!-- 物品列表 -->
    <div class="tab-panel active" id="tab-list">
        <div class="filter-tabs" id="share-categories" style="margin-top:0;">
            <div class="filter-tab active" data-cat="全部">全部</div>
            <div class="filter-tab" data-cat="工具">🔨 工具</div>
            <div class="filter-tab" data-cat="母婴">👶 母婴</div>
            <div class="filter-tab" data-cat="家电">🔌 家电</div>
            <div class="filter-tab" data-cat="书籍">📚 书籍</div>
            <div class="filter-tab" data-cat="车位">🅿️ 车位</div>
            <div class="filter-tab" data-cat="其他">📦 其他</div>
        </div>

        <div id="share-list" class="share-grid" style="padding:16px;">
            <!-- 动态加载 -->
        </div>
    </div>

    <!-- 我的发布 -->
    <div class="tab-panel" id="tab-mine" style="display:none;">
        <div id="my-publish-list" style="padding:16px;">
            <!-- 动态加载 -->
        </div>
    </div>

    <!-- 我的借用 -->
    <div class="tab-panel" id="tab-borrow" style="display:none;">
        <div id="my-borrow-list" style="padding:16px;">
            <!-- 动态加载 -->
        </div>
    </div>
</div>

<!-- 物品详情弹窗 -->
<div class="modal" id="share-detail-modal">
    <div class="modal-mask" onclick="closeModal('share-detail-modal')"></div>
    <div class="modal-content" style="max-width:400px;">
        <div class="modal-header">
            <div>物品详情</div>
            <div class="modal-close" onclick="closeModal('share-detail-modal')">✕</div>
        </div>
        <div class="modal-body" id="share-detail-body">
            <!-- 动态内容 -->
        </div>
        <div class="modal-footer">
            <button class="btn btn-block" style="background:#F5F5F5;color:#666;" onclick="closeModal('share-detail-modal')">关闭</button>
            <button class="btn btn-block" id="btn-report-item" style="background:#FFF5EE;color:#C45D3A;border:1px solid #C45D3A;">⚠ 投诉举报</button>
            <button class="btn btn-block" id="btn-contact-owner" style="background:#FFF5EE;color:#C45D3A;border:1px solid #C45D3A;">联系发布人</button>
            <button class="btn btn-primary btn-block" id="btn-borrow-item">立即借用</button>
        </div>
    </div>
</div>

<!-- 发布物品弹窗 -->
<div class="modal" id="publish-modal">
    <div class="modal-mask" onclick="closeModal('publish-modal')"></div>
    <div class="modal-content">
        <div class="modal-header">
            <div>发布共享物品</div>
            <div class="modal-close" onclick="closeModal('publish-modal')">✕</div>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>物品名称 *</label>
                <input type="text" class="form-input" id="pub-name" placeholder="例如：电钻、儿童推车" maxlength="50">
            </div>
            <div class="form-group">
                <label>分类</label>
                <div class="filter-tabs" id="pub-category">
                    <div class="filter-tab active" data-cat="工具">🔨 工具</div>
                    <div class="filter-tab" data-cat="母婴">👶 母婴</div>
                    <div class="filter-tab" data-cat="家电">🔌 家电</div>
                    <div class="filter-tab" data-cat="书籍">📚 书籍</div>
                    <div class="filter-tab" data-cat="车位">🅿️ 车位</div>
                    <div class="filter-tab" data-cat="其他">📦 其他</div>
                </div>
            </div>
            <div class="form-group">
                <label>新旧程度</label>
                <select class="form-input" id="pub-condition">
                    <option value="全新">全新</option>
                    <option value="9成新">9成新</option>
                    <option value="8成新">8成新</option>
                    <option value="7成新">7成新</option>
                    <option value="有磨损">有磨损</option>
                </select>
            </div>
            <div class="form-group">
                <label>详细描述</label>
                <textarea class="form-textarea" id="pub-desc" rows="3" placeholder="描述物品的使用情况、注意事项等"></textarea>
            </div>
            <div class="form-group">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
                    <label style="margin:0;">免费共享</label>
                    <label class="switch">
                        <input type="checkbox" id="pub-free" checked onchange="togglePriceInput()">
                        <span class="slider"></span>
                    </label>
                </div>
                <input type="number" class="form-input" id="pub-price" placeholder="每日租金（元）" style="display:none;" min="0" step="1">
                <div style="font-size:12px;color:#999;margin-top:6px;" id="price-hint">免费共享可获得积分奖励，付费物品按比例获得积分</div>
            </div>
            <div class="form-group">
                <label>📷 图片 <span style="font-size:12px;color:#999;font-weight:400;">(支持 emoji 或上传)</span></label>
                <div class="emoji-picker" style="font-size:28px;display:flex;flex-wrap:wrap;gap:8px;padding:8px;background:#FFF5EE;border-radius:8px;">
                    <span style="cursor:pointer;" onclick="selectEmoji('🔨')">🔨</span>
                    <span style="cursor:pointer;" onclick="selectEmoji('🔌')">🔌</span>
                    <span style="cursor:pointer;" onclick="selectEmoji('💡')">💡</span>
                    <span style="cursor:pointer;" onclick="selectEmoji('👶')">👶</span>
                    <span style="cursor:pointer;" onclick="selectEmoji('📚')">📚</span>
                    <span style="cursor:pointer;" onclick="selectEmoji('🪑')">🪑</span>
                    <span style="cursor:pointer;" onclick="selectEmoji('🚗')">🚗</span>
                    <span style="cursor:pointer;" onclick="selectEmoji('🧺')">🧺</span>
                    <span style="cursor:pointer;" onclick="selectEmoji('🧸')">🧸</span>
                    <span style="cursor:pointer;" onclick="selectEmoji('🎮')">🎮</span>
                    <span style="cursor:pointer;" onclick="selectEmoji('🧰')">🧰</span>
                    <span style="cursor:pointer;" onclick="selectEmoji('🪚')">🪚</span>
                </div>
                <input type="text" class="form-input" id="pub-emoji" placeholder="选中的emoji将显示在这里" readonly style="margin-top:8px;text-align:center;font-size:32px;">
            </div>
            <div style="background:#FFF5EE;padding:12px;border-radius:8px;margin-top:8px;">
                <div style="font-size:13px;color:#C45D3A;font-weight:500;margin-bottom:6px;">🤖 AI智能估价</div>
                <div id="ai-price-result" style="font-size:13px;color:#666;">点击下方按钮，基于同类物品给出推荐价格</div>
                <button type="button" class="btn btn-sm" style="margin-top:8px;background:white;color:#C45D3A;border:1px solid #C45D3A;" onclick="runAIPrice()">一键估价</button>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-block" style="background:#F5F5F5;color:#666;" onclick="closeModal('publish-modal')">取消</button>
            <button class="btn btn-primary btn-block" id="btn-publish-submit">立即发布</button>
        </div>
    </div>
</div>

<!-- 修改物品弹窗 -->
<div class="modal" id="edit-modal">
    <div class="modal-mask" onclick="closeModal('edit-modal')"></div>
    <div class="modal-content">
        <div class="modal-header">
            <div>修改物品</div>
            <div class="modal-close" onclick="closeModal('edit-modal')">✕</div>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>物品名称</label>
                <input type="text" class="form-input" id="edit-name">
            </div>
            <div class="form-group">
                <label>详细描述</label>
                <textarea class="form-textarea" id="edit-desc" rows="3"></textarea>
            </div>
            <div class="form-group">
                <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
                    <label style="margin:0;">免费共享</label>
                    <label class="switch">
                        <input type="checkbox" id="edit-free" onchange="toggleEditPrice()">
                        <span class="slider"></span>
                    </label>
                </div>
                <input type="number" class="form-input" id="edit-price" style="display:none;">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-block" onclick="closeModal('edit-modal')">取消</button>
            <button class="btn btn-primary btn-block" id="btn-edit-submit">保存修改</button>
        </div>
    </div>
</div>

<!-- 悬浮发布按钮 -->
<div class="fab-btn" onclick="openPublishModal()" style="display:block;">
    <div style="font-size:24px;">+</div>
</div>

<!-- 底部导航 -->
<div class="tab-bar">
    <div class="tab-item" onclick="navigateTo('index.html')">
        <div class="tab-icon">🏠</div><div>首页</div>
    </div>
    <div class="tab-item active" onclick="navigateTo('share.html')">
        <div class="tab-icon">🤝</div><div>共享</div>
    </div>
    <div class="tab-item" onclick="navigateTo('notices.html')">
        <div class="tab-icon">📢</div><div>通知</div>
    </div>
    <div class="tab-item" onclick="navigateTo('profile.html')">
        <div class="tab-icon">👤</div><div>我的</div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
let currentPublishCategory = '工具';
let currentBorrowItemId = null;
let currentDetailItem = null;
let currentEditItemId = null;

function selectEmoji(e) {
    document.getElementById('pub-emoji').value = e;
}
function togglePriceInput() {
    const isFree = document.getElementById('pub-free').checked;
    const priceInput = document.getElementById('pub-price');
    const hint = document.getElementById('price-hint');
    if (isFree) { priceInput.style.display = 'none'; hint.textContent = '免费共享可获得积分奖励'; }
    else { priceInput.style.display = 'block'; hint.textContent = '付费物品按比例获得积分奖励'; }
}
function openPublishModal() {
    if (!checkLogin()) { showToast('请先登录'); setTimeout(() => navigateTo('login.html'), 1200); return; }
    document.getElementById('pub-name').value = '';
    document.getElementById('pub-desc').value = '';
    document.getElementById('pub-price').value = '';
    document.getElementById('pub-emoji').value = '';
    document.getElementById('pub-free').checked = true;
    document.getElementById('pub-condition').value = '9成新';
    togglePriceInput();
    document.querySelectorAll('#pub-category .filter-tab').forEach((el, i) => {
        el.classList.toggle('active', i === 0);
    });
    currentPublishCategory = '工具';
    openModal('publish-modal');
}
function runAIPrice() {
    const name = document.getElementById('pub-name').value;
    if (!name) { showToast('请先输入物品名称'); return; }
    showToast('🤖 AI正在估价...', 'info', 1200);
    setTimeout(() => {
        const prices = ['建议免费共享，可获 50 积分/次', '建议定价 5元/天，可获 20 积分/次', '建议定价 15元/天，可获 40 积分/次', '建议定价 30元/天，可获 60 积分/次'];
        document.getElementById('ai-price-result').innerHTML = '<span style="color:#C45D3A;font-weight:500;">' + prices[Math.floor(Math.random() * prices.length)] + '</span>';
    }, 800);
}

// ============ 我的发布渲染（增强版）============
function renderMyPublished(list) {
    const container = document.getElementById('my-publish-list');
    if (!container) return;
    if (!list.length) {
        container.innerHTML = '<div style="text-align:center;padding:40px;color:#999;font-size:14px;">暂无发布物品</div>';
        return;
    }
    container.innerHTML = '';
    list.forEach(function (item) {
        const isOff = item.status === 'off' || item.available === false;
        const rewardPoints = item.is_free === false && item.price ? Math.round(item.price * 2) : 50;
        const div = document.createElement('div');
        div.style.cssText =
            'background:white;border-radius:12px;padding:14px;margin-bottom:12px;' +
            'box-shadow:0 2px 8px rgba(0,0,0,0.06);';
        div.innerHTML =
            '<div style="display:flex;align-items:flex-start;gap:12px;">' +
                '<div style="font-size:40px;flex-shrink:0;">' + (item.image || '📦') + '</div>' +
                '<div style="flex:1;min-width:0;">' +
                    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">' +
                        '<div style="font-size:15px;font-weight:500;color:#333;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + (item.name || '') + '</div>' +
                        '<span style="display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:500;margin-left:8px;' +
                        (isOff ? 'background:#F5F5F5;color:#999;' : 'background:#FFF5EE;color:#52C41A;') + '">' +
                        (isOff ? '已下架' : '可借') + '</span>' +
                    '</div>' +
                    '<div style="font-size:12px;color:#999;margin-top:4px;">' + (item.condition || '') + ' · ' + (item.category || '') + '</div>' +
                    '<div style="font-size:12px;color:#C45D3A;margin-top:4px;">' +
                    (item.is_free === false && item.price ? '¥' + item.price + '/天' : '免费') + '</div>' +
                    '<div style="display:flex;gap:12px;font-size:12px;color:#666;margin-top:8px;flex-wrap:wrap;">' +
                        '<span>💰 +' + rewardPoints + ' 积分/次</span>' +
                        '<span>📦 借用 ' + (item.borrow_count != null ? item.borrow_count : 0) + ' 次</span>' +
                        '<span>👁 ' + (item.views != null ? item.views : 0) + ' 浏览</span>' +
                    '</div>' +
                '</div>' +
            '</div>' +
            '<div style="display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed #eee;">' +
                '<button class="btn btn-sm" style="flex:1;background:#FFF5EE;color:#C45D3A;border:1px solid #F5D9B8;" onclick="openEditModal(\'' + item.id + '\')">修改</button>' +
                '<button class="btn btn-sm" style="flex:1;background:#FFF;color:#52C41A;border:1px solid #B7EB8F;" onclick="removeItem(\'' + item.id + '\')">' +
                (isOff ? '重新上架' : '下架') + '</button>' +
                '<button class="btn btn-sm" style="flex:1;background:#FFF;color:#FF4D4F;border:1px solid #FFA39E;" onclick="deleteMyItem(\'' + item.id + '\')">删除</button>' +
            '</div>';
        container.appendChild(div);
    });
}

// ============ 修改价格显示（免费状态切换）============
function toggleEditPrice() {
    const isFree = document.getElementById('edit-free').checked;
    const priceInput = document.getElementById('edit-price');
    if (isFree) { priceInput.style.display = 'none'; }
    else { priceInput.style.display = 'block'; }
}

// ============ 打开修改物品弹窗 ============
function openEditModal(itemId) {
    if (!window.ShareAPI) { showToast('系统异常'); return; }
    const item = window.MockDB && window.MockDB.shares
        ? window.MockDB.shares.find(function (s) { return s.id === itemId; })
        : null;
    if (!item) { showToast('物品不存在', 'error'); return; }
    currentEditItemId = itemId;
    document.getElementById('edit-name').value = item.name || '';
    document.getElementById('edit-desc').value = item.description || '';
    document.getElementById('edit-free').checked = item.is_free !== false;
    document.getElementById('edit-price').value = item.price || '';
    toggleEditPrice();
    openModal('edit-modal');
}

document.addEventListener('click', function (e) {
    if (e.target && e.target.id === 'btn-edit-submit') {
        if (!currentEditItemId) { return; }
        const params = {
            name: document.getElementById('edit-name').value,
            description: document.getElementById('edit-desc').value,
            is_free: document.getElementById('edit-free').checked,
            price: Number(document.getElementById('edit-price').value) || 0
        };
        if (!params.name || !params.name.trim()) { showToast('请输入物品名称', 'warning'); return; }
        if (params.is_free === false && (params.price == null || params.price <= 0)) { showToast('请输入有效的租金', 'warning'); return; }
        showToast('保存中...', 'info', 1200);
        window.ShareAPI.edit(currentEditItemId, params).then(function (res) {
            if (res && res.success !== false) {
                closeModal('edit-modal');
                currentEditItemId = null;
                showToast('修改成功');
                if (window.ShareAPI) {
                    window.ShareAPI.myPublished().then(function (r) {
                        renderMyPublished((r && r.list) || []);
                    }).catch(function () {});
                }
            } else {
                showToast('修改失败', 'error');
            }
        }).catch(function () { showToast('修改失败', 'error'); });
    }
});

// ============ 下架/重新上架物品 ============
function removeItem(itemId) {
    if (!window.ShareAPI) { showToast('系统异常'); return; }
    const item = window.MockDB && window.MockDB.shares
        ? window.MockDB.shares.find(function (s) { return s.id === itemId; })
        : null;
    const isOff = item && (item.status === 'off' || item.available === false);
    showConfirm(isOff ? '重新上架' : '下架物品', '确认要' + (isOff ? '重新上架此物品吗？' : '下架此物品吗？'), '确定', '取消').then(function (ok) {
        if (!ok) return;
        const api = isOff ? window.ShareAPI.relist(itemId) : window.ShareAPI.takeOff(itemId);
        api.then(function (res) {
            if (res && res.success !== false) {
                showToast(isOff ? '已重新上架' : '已下架');
                if (window.ShareAPI) {
                    window.ShareAPI.myPublished().then(function (r) {
                        renderMyPublished((r && r.list) || []);
                    }).catch(function () {});
                }
            } else {
                showToast('操作失败', 'error');
            }
        }).catch(function () { showToast('操作失败', 'error'); });
    });
}

// ============ 删除物品 ============
function deleteMyItem(itemId) {
    if (!window.ShareAPI) { showToast('系统异常'); return; }
    showConfirm('删除物品', '删除后不可恢复，确认删除该物品？', '确定删除', '取消').then(function (ok) {
        if (!ok) return;
        window.ShareAPI.deleteItem(itemId).then(function (res) {
            if (res && res.success !== false) {
                showToast('已删除');
                if (window.ShareAPI) {
                    window.ShareAPI.myPublished().then(function (r) {
                        renderMyPublished((r && r.list) || []);
                    }).catch(function () {});
                }
            } else {
                showToast('删除失败', 'error');
            }
        }).catch(function () { showToast('删除失败', 'error'); });
    });
}
</script>
</body>
</html>
