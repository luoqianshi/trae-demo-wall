<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>积分商城 - 邻里智联</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page-container">
    <div class="points-header">
        <div style="font-size:14px;opacity:0.9;">我的积分</div>
        <div style="font-size:48px;font-weight:700;letter-spacing:2px;margin:8px 0;" id="my-points">0</div>
        <div style="font-size:13px;opacity:0.85;">积分可兑换精美礼品和便民服务</div>
    </div>

    <div class="page-tabs" style="margin-top:16px;">
        <div class="page-tab active" data-tab="goods">🎁 商品兑换</div>
        <div class="page-tab" data-tab="history">📜 兑换记录</div>
        <div class="page-tab" data-tab="rules">📋 积分规则</div>
    </div>

    <!-- 商品列表 -->
    <div class="tab-panel active" id="tab-goods">
        <div id="goods-list" style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px;">
            <!-- 动态加载 -->
        </div>
    </div>

    <!-- 兑换记录 -->
    <div class="tab-panel" id="tab-history" style="display:none;">
        <div id="history-list" style="padding:16px;">
            <!-- 动态加载 -->
        </div>
    </div>

    <!-- 积分规则 -->
    <div class="tab-panel" id="tab-rules" style="display:none;">
        <div id="rules-list" style="padding:16px;">
            <!-- 动态加载 -->
        </div>
    </div>
</div>

<!-- 兑换确认弹窗 -->
<div class="modal" id="exchange-modal">
    <div class="modal-mask" onclick="closeModal('exchange-modal')"></div>
    <div class="modal-content modal-content-sm">
        <div class="modal-header">
            <div>确认兑换</div>
            <div class="modal-close" onclick="closeModal('exchange-modal')">✕</div>
        </div>
        <div class="modal-body" id="exchange-body" style="text-align:center;padding:20px;">
            <!-- 动态内容 -->
        </div>
        <div class="modal-footer">
            <button class="btn btn-block" style="background:#F5F5F5;color:#666;" onclick="closeModal('exchange-modal')">取消</button>
            <button class="btn btn-primary btn-block" id="btn-exchange-confirm">确认兑换</button>
        </div>
    </div>
</div>

<div class="tab-bar">
    <div class="tab-item" onclick="navigateTo('index.html')">
        <div class="tab-icon">🏠</div><div>首页</div>
    </div>
    <div class="tab-item" onclick="navigateTo('share.html')">
        <div class="tab-icon">🤝</div><div>共享</div>
    </div>
    <div class="tab-item" onclick="navigateTo('notices.html')">
        <div class="tab-icon">📢</div><div>通知</div>
    </div>
    <div class="tab-item active" onclick="navigateTo('points.html')">
        <div class="tab-icon">💰</div><div>积分</div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
let currentExchangeGoodsId = null;
</script>
</body>
</html>
