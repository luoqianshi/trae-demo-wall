<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>邻里互助 - 我要借</title>
<link rel="stylesheet" href="css/style.css">
<style>
.page-tabs-top {
    background: white;
    display: flex;
    border-bottom: 1px solid var(--border-color);
    position: sticky;
    top: 0;
    z-index: 10;
}
.page-tab {
    flex: 1;
    padding: 14px 8px;
    text-align: center;
    font-size: 15px;
    color: var(--text-secondary);
    font-weight: 500;
    cursor: pointer;
    position: relative;
    transition: color 0.2s;
}
.page-tab.active { color: var(--primary-color); font-weight: 700; }
.page-tab.active::after {
    content: '';
    position: absolute; bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 40px; height: 3px;
    background: var(--primary-color); border-radius: 2px;
}

/* 求借卡片 */
.borrow-card {
    background: white;
    border-radius: 12px;
    margin: 0 16px 12px;
    padding: 14px;
    box-shadow: var(--shadow-sm);
}
.borrow-card .head {
    display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
}
.borrow-card .avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: linear-gradient(135deg, #C45D3A, #E07B5A);
    color: white; display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 600; flex-shrink: 0;
}
.borrow-card .avatar.b { background: linear-gradient(135deg, #5B8DB8, #7FB2D6); }
.borrow-card .avatar.c { background: linear-gradient(135deg, #52C41A, #95DE64); }
.borrow-card .avatar.d { background: linear-gradient(135deg, #FAAD14, #FFC53D); }
.borrow-card .name { font-size: 15px; font-weight: 600; color: var(--text-primary); }
.borrow-card .loc { font-size: 12px; color: var(--text-light); margin-top: 2px; }
.borrow-card .title { font-size: 16px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; }
.borrow-card .desc { font-size: 13px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 8px; }
.borrow-card .meta {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; color: var(--text-light); margin-top: 10px;
    padding-top: 10px; border-top: 1px dashed var(--border-color);
}
.borrow-card .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
.borrow-card .tag {
    font-size: 11px; padding: 2px 8px; border-radius: 4px;
    background: var(--primary-bg); color: var(--primary-color);
}
.borrow-card .tag.urgent { background: #FFF1F0; color: #ff4d4f; }

.contact-btn {
    padding: 6px 14px; background: var(--primary-color); color: white;
    border: none; border-radius: 16px; font-size: 13px; cursor: pointer;
}

/* 发布我要借 */
.publish-hero {
    background: linear-gradient(135deg, #FFF5EE, #FFE8DC);
    padding: 20px 16px;
    text-align: center;
    margin: 0 16px 12px;
    border-radius: 12px;
}
.publish-hero .emoji { font-size: 40px; margin-bottom: 6px; }
.publish-hero .title { font-size: 17px; font-weight: 700; color: var(--primary-color); margin-bottom: 4px; }
.publish-hero .desc { font-size: 12px; color: var(--text-secondary); }

.form-group { margin-bottom: 14px; }
.form-label { display: block; font-size: 13px; color: var(--text-primary); font-weight: 500; margin-bottom: 6px; }
.form-input, .form-textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border-color);
    border-radius: 8px; font-size: 14px; box-sizing: border-box;
    background: white; outline: none;
    font-family: inherit;
}
.form-input:focus, .form-textarea:focus { border-color: var(--primary-color); }
.form-textarea { resize: vertical; min-height: 80px; }

.tags-select { display: flex; gap: 8px; flex-wrap: wrap; }
.tag-chip {
    padding: 6px 12px; background: white; border: 1px solid var(--border-color);
    color: var(--text-secondary); border-radius: 16px; font-size: 13px; cursor: pointer;
    transition: all 0.2s;
}
.tag-chip.active {
    background: var(--primary-color);
    color: white; border-color: var(--primary-color);
}

.btn-submit {
    width: 100%; padding: 14px; background: var(--primary-color); color: white;
    border: none; border-radius: 8px; font-size: 15px; font-weight: 600;
    cursor: pointer; box-shadow: 0 4px 12px rgba(196, 93, 58, 0.2);
}
.btn-submit:active { transform: scale(0.98); }

.empty-state {
    padding: 60px 20px;
    text-align: center;
    color: var(--text-light);
}
.empty-state .icon { font-size: 64px; margin-bottom: 16px; opacity: 0.4; }
.empty-state .txt { font-size: 15px; margin-bottom: 8px; }
.empty-state .sub { font-size: 12px; }

.section-card {
    background: white; border-radius: 12px; margin: 0 16px 12px; padding: 16px;
    box-shadow: var(--shadow-sm);
}
.section-title {
    font-size: 15px; font-weight: 700; color: var(--text-primary);
    margin-bottom: 12px; padding-bottom: 10px;
    border-bottom: 1px solid var(--border-color);
    display: flex; align-items: center; justify-content: space-between;
}
.section-title .count { font-size: 12px; font-weight: 400; color: var(--text-light); }
</style>
</head>
<body>
<div class="page-container">

    <!-- Tab切换 -->
    <div class="page-tabs-top">
        <div class="page-tab active" data-tab="publish" onclick="switchBorrowTab('publish')">我要借</div>
        <div class="page-tab" data-tab="community" onclick="switchBorrowTab('community')">社区求借</div>
        <div class="page-tab" data-tab="mine" onclick="switchBorrowTab('mine')">我的发布</div>
    </div>

    <!-- 我要借（发布） -->
    <div id="tab-publish" style="padding:16px 0 80px;">
        <div class="publish-hero">
            <div class="emoji">🙋‍♂️</div>
            <div class="title">发布求借信息</div>
            <div class="desc">告诉邻居你需要什么，让闲置物品流动起来</div>
        </div>

        <div class="section-card">
            <div class="form-group">
                <label class="form-label">物品名称 *</label>
                <input type="text" class="form-input" id="borrow-name" placeholder="例如：梯子、儿童推车、电钻" maxlength="30">
            </div>
            <div class="form-group">
                <label class="form-label">物品分类</label>
                <div class="tags-select" id="borrow-cats">
                    <div class="tag-chip" data-cat="工具">🔨 工具</div>
                    <div class="tag-chip" data-cat="母婴">👶 母婴</div>
                    <div class="tag-chip" data-cat="家电">🔌 家电</div>
                    <div class="tag-chip" data-cat="书籍">📚 书籍</div>
                    <div class="tag-chip" data-cat="生活用品">🏠 生活用品</div>
                    <div class="tag-chip" data-cat="其他">📦 其他</div>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">紧急程度</label>
                <div class="tags-select" id="borrow-urgency">
                    <div class="tag-chip" data-u="普通">普通</div>
                    <div class="tag-chip" data-u="近期需要">近期需要</div>
                    <div class="tag-chip" data-u="紧急">🚨 紧急</div>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">详细描述</label>
                <textarea class="form-textarea" id="borrow-desc" rows="3" placeholder="描述用途、使用时间、其他需求..." maxlength="200"></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">期望借用时长</label>
                <input type="text" class="form-input" id="borrow-duration" placeholder="例如：1天、1周、长期" maxlength="20">
            </div>
            <button class="btn-submit" onclick="submitBorrowRequest()">发布求借</button>
        </div>
    </div>

    <!-- 社区求借列表 -->
    <div id="tab-community" style="padding:16px 0 80px; display:none;"></div>

    <!-- 我的发布 -->
    <div id="tab-mine" style="padding:16px 0 80px; display:none;"></div>

</div>

<!-- 底部导航 -->
<div class="tab-bar">
    <div class="tab-item" onclick="navigateTo('index.html')">
        <div class="tab-icon">🏠</div><div>首页</div>
    </div>
    <div class="tab-item" onclick="navigateTo('share.html')">
        <div class="tab-icon">🤝</div><div>共享</div>
    </div>
    <div class="tab-item" onclick="navigateTo('notices.html')">
        <div class="tab-icon">📢</div><div>消息</div>
    </div>
    <div class="tab-item" onclick="navigateTo('profile.html')">
        <div class="tab-icon">👤</div><div>我的</div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
// 本地 mock 数据：社区求借列表
function getBorrowMockDB() {
    if (!window._borrowSeed) {
        window._borrowSeed = [
            {
                id: 'br001', name: '王阿姨', building: '3号楼', room: '401室',
                title: '求借梯子', category: '工具', urgency: '普通',
                description: '想借一个四步梯，用来换灯泡和擦窗户，使用半天就可以归还。',
                duration: '半天', created_at: '2025-06-18 09:30', avatarIdx: 0
            },
            {
                id: 'br002', name: '李先生', building: '5号楼', room: '202室',
                title: '求借儿童推车', category: '母婴', urgency: '近期需要',
                description: '家里老人要带宝宝去医院做检查，想借一个轻便折叠的儿童推车。',
                duration: '1天', created_at: '2025-06-18 08:15', avatarIdx: 1
            },
            {
                id: 'br003', name: '陈女士', building: '2号楼', room: '605室',
                title: '求借电钻', category: '工具', urgency: '紧急',
                description: '安装新买的书架，急需电钻一把，只使用1-2小时即可归还。',
                duration: '2小时', created_at: '2025-06-18 14:20', avatarIdx: 2
            },
            {
                id: 'br004', name: '赵叔叔', building: '1号楼', room: '303室',
                title: '求借空气净化器', category: '家电', urgency: '普通',
                description: '邻居家刚装修完，想借一个空气净化器用几天，改善室内空气。',
                duration: '1周', created_at: '2025-06-17 16:40', avatarIdx: 3
            },
            {
                id: 'br005', name: '周妈妈', building: '4号楼', room: '502室',
                title: '求借儿童绘本', category: '书籍', urgency: '普通',
                description: '想借一些3-6岁儿童的绘本，给孩子睡前阅读，长期借用也可以。',
                duration: '长期', created_at: '2025-06-17 10:05', avatarIdx: 0
            },
            {
                id: 'br006', name: '孙先生', building: '6号楼', room: '101室',
                title: '求借羽毛球拍', category: '其他', urgency: '普通',
                description: '周末想带孩子去公园运动，想借两副羽毛球拍和球，不胜感激！',
                duration: '1天', created_at: '2025-06-16 20:30', avatarIdx: 1
            }
        ];
    }
    return window._borrowSeed;
}

function getMyBorrows() {
    try {
        const s = localStorage.getItem('neighbor_my_borrows');
        return s ? JSON.parse(s) : [];
    } catch (e) { return []; }
}

function saveMyBorrows(list) {
    try { localStorage.setItem('neighbor_my_borrows', JSON.stringify(list)); } catch (e) {}
}

// Tab 切换
function switchBorrowTab(tab) {
    document.querySelectorAll('.page-tab').forEach(function (t) { t.classList.remove('active'); });
    document.querySelector('.page-tab[data-tab="' + tab + '"]').classList.add('active');
    document.getElementById('tab-publish').style.display = tab === 'publish' ? 'block' : 'none';
    document.getElementById('tab-community').style.display = tab === 'community' ? 'block' : 'none';
    document.getElementById('tab-mine').style.display = tab === 'mine' ? 'block' : 'none';

    if (tab === 'community') renderCommunityList();
    if (tab === 'mine') renderMyBorrowList();
}

// 渲染社区求借列表
function renderCommunityList() {
    const container = document.getElementById('tab-community');
    const list = getBorrowMockDB();

    if (!list.length) {
        container.innerHTML =
            '<div class="empty-state">' +
                '<div class="icon">📭</div>' +
                '<div class="txt">暂无求借信息</div>' +
                '<div class="sub">您可以在"我要借"中发布自己的需求</div>' +
            '</div>';
        return;
    }

    const headerHtml =
        '<div class="section-card" style="padding:12px 16px;margin-bottom:12px;">' +
            '<div style="font-size:13px;color:' + 'var(--text-secondary)' + ';">' +
                '💡 看到邻居有需要的物品，主动联系他们，获得积分奖励哦！' +
            '</div>' +
        '</div>';

    container.innerHTML = headerHtml + list.map(function (item, idx) {
        const avatarClass = ['', 'b', 'c', 'd'][item.avatarIdx % 4];
        const initial = item.name ? item.name.charAt(0) : '邻';
        const urgentHtml = item.urgency === '紧急'
            ? '<span class="tag urgent">🚨 ' + item.urgency + '</span>'
            : '<span class="tag">' + item.urgency + '</span>';
        return '<div class="borrow-card">' +
            '<div class="head">' +
                '<div class="avatar ' + avatarClass + '">' + initial + '</div>' +
                '<div style="flex:1;min-width:0;">' +
                    '<div class="name">' + item.name + '</div>' +
                    '<div class="loc">📍 ' + item.building + ' ' + item.room + '</div>' +
                '</div>' +
            '</div>' +
            '<div class="title">' + item.title + '</div>' +
            '<div class="tags">' +
                '<span class="tag">' + item.category + '</span>' +
                '<span class="tag">' + item.duration + '</span>' +
                urgentHtml +
            '</div>' +
            '<div class="desc">' + item.description + '</div>' +
            '<div class="meta">' +
                '<span>🕒 ' + item.created_at + '</span>' +
                '<button class="contact-btn" onclick=\'contactBorrowPublisher(' + JSON.stringify(item).replace(/'/g, "&apos;") + ')\'>联系TA</button>' +
            '</div>' +
        '</div>';
    }).join('');
}

// 渲染我的发布
function renderMyBorrowList() {
    const container = document.getElementById('tab-mine');
    const list = getMyBorrows();

    if (!list.length) {
        container.innerHTML =
            '<div class="empty-state">' +
                '<div class="icon">📝</div>' +
                '<div class="txt">您还没有发布过求借信息</div>' +
                '<div class="sub">在"我要借"中发布第一条求借需求吧</div>' +
            '</div>';
        return;
    }

    container.innerHTML = list.map(function (item) {
        const initial = '我';
        const urgentHtml = item.urgency === '紧急'
            ? '<span class="tag urgent">🚨 ' + item.urgency + '</span>'
            : '<span class="tag">' + item.urgency + '</span>';
        return '<div class="borrow-card">' +
            '<div class="title">' + item.title + '</div>' +
            '<div class="tags">' +
                '<span class="tag">' + item.category + '</span>' +
                '<span class="tag">' + (item.duration || '') + '</span>' +
                urgentHtml +
            '</div>' +
            '<div class="desc">' + item.description + '</div>' +
            '<div class="meta">' +
                '<span>🕒 ' + item.created_at + '</span>' +
                '<span style="color:#52C41A;">已发布</span>' +
            '</div>' +
        '</div>';
    }).join('');
}

// 联系求借发布人
function contactBorrowPublisher(item) {
    if (!checkLogin()) {
        showToast('请先登录', 'warning');
        setTimeout(function () { navigateTo('login.html'); }, 1000);
        return;
    }
    const contactId = 'borrow_' + item.id;
    const contact = {
        id: contactId,
        name: item.name || '发布者',
        subject: item.title || '求借信息',
        color: ['#C45D3A', '#5B8DB8', '#52C41A', '#FAAD14'][item.avatarIdx % 4] || '#C45D3A',
        lastMessage: '',
        unread: false,
        messages: [],
        lastTime: item.created_at || new Date().toLocaleString('zh-CN', { hour12: false })
    };
    saveOrUpdateContact(contact);
    navigateTo('notices.html?tab=contacts&open=' + contactId);
}

// 发布我要借
let selectedCategory = '工具';
let selectedUrgency = '普通';

document.querySelectorAll('#borrow-cats .tag-chip').forEach(function (chip) {
    chip.onclick = function () {
        document.querySelectorAll('#borrow-cats .tag-chip').forEach(function (c) { c.classList.remove('active'); });
        chip.classList.add('active');
        selectedCategory = chip.getAttribute('data-cat') || '工具';
    };
});
document.querySelectorAll('#borrow-cats .tag-chip')[0].classList.add('active');

document.querySelectorAll('#borrow-urgency .tag-chip').forEach(function (chip) {
    chip.onclick = function () {
        document.querySelectorAll('#borrow-urgency .tag-chip').forEach(function (c) { c.classList.remove('active'); });
        chip.classList.add('active');
        selectedUrgency = chip.getAttribute('data-u') || '普通';
    };
});
document.querySelectorAll('#borrow-urgency .tag-chip')[0].classList.add('active');

function submitBorrowRequest() {
    if (!checkLogin()) {
        showToast('请先登录', 'warning');
        setTimeout(function () { navigateTo('login.html'); }, 1000);
        return;
    }
    const name = document.getElementById('borrow-name').value.trim();
    const desc = document.getElementById('borrow-desc').value.trim();
    const duration = document.getElementById('borrow-duration').value.trim();

    if (!name) { showToast('请输入物品名称', 'warning'); return; }

    const user = getCurrentUser();
    const newItem = {
        id: 'my_br_' + Date.now(),
        title: '求借' + name,
        category: selectedCategory,
        urgency: selectedUrgency,
        description: desc || '（未填写描述）',
        duration: duration || '',
        created_at: new Date().toLocaleString('zh-CN', { hour12: false }),
        publisher: (user && user.name) || '我',
        isMine: true
    };

    const myList = getMyBorrows();
    myList.unshift(newItem);
    saveMyBorrows(myList);

    // 同时添加到社区列表（本次会话可见）
    const communityList = getBorrowMockDB();
    communityList.unshift(Object.assign({}, newItem, {
        name: (user && user.name) || '邻居',
        building: (user && user.building) || '小区',
        room: (user && (user.unit + user.room)) || '',
        avatarIdx: Math.floor(Math.random() * 4)
    }));

    // 积分奖励提示
    const rewardText = '发布成功！已获得 10 积分奖励';
    showToast(rewardText, 'success');

    // 清空表单
    document.getElementById('borrow-name').value = '';
    document.getElementById('borrow-desc').value = '';
    document.getElementById('borrow-duration').value = '';

    // 跳转到我的发布
    setTimeout(function () {
        switchBorrowTab('mine');
    }, 1000);
}
</script>
</body>
</html>
