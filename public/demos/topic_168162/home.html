<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>环球美景 - 足不出户，看遍世间美景</title>
    <style id="theme-vars">
/* World Scenery - Brand Design Tokens */
/* Warm neutral palette with earthy tones, optimized for legibility and serenity */

:root {
  /* === Colors === */
  --color-bg: #FAF8F5;
  --color-bg-subtle: #F3F0EB;
  --color-bg-elevated: #FFFFFF;
  --color-bg-inverse: #2C2825;

  --color-text: #2C2825;
  --color-text-secondary: #6B6560;
  --color-text-tertiary: #9E9893;
  --color-text-inverse: #FAF8F5;

  --color-border: #E8E3DD;
  --color-border-light: #F0ECE6;

  --color-primary: #B87333;
  --color-primary-hover: #A06528;
  --color-primary-subtle: rgba(184, 115, 51, 0.08);
  --color-primary-text: #FFFFFF;

  --color-accent: #5B8A4E;
  --color-accent-subtle: rgba(91, 138, 78, 0.08);

  /* === Typography === */
  --font-display: 'Georgia', 'Noto Serif SC', serif;
  --font-body: 'system-ui', '-apple-system', 'Segoe UI', 'Noto Sans SC', sans-serif;

  --text-xs: 0.875rem;
  --text-sm: 1rem;
  --text-base: 1.125rem;
  --text-lg: 1.25rem;
  --text-xl: 1.5rem;
  --text-2xl: 2rem;
  --text-3xl: 2.5rem;
  --text-4xl: 3.25rem;
  --text-5xl: 4rem;

  --leading-tight: 1.2;
  --leading-snug: 1.35;
  --leading-normal: 1.6;
  --leading-relaxed: 1.75;

  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  /* === Spacing === */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --space-2xl: 48px;
  --space-3xl: 64px;
  --space-4xl: 96px;

  /* === Radius === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* === Shadows (alpha <= 0.05 for static surfaces) === */
  --shadow-sm: 0 1px 2px rgba(44, 40, 37, 0.04);
  --shadow-md: 0 2px 8px rgba(44, 40, 37, 0.05);
  --shadow-lg: 0 8px 24px rgba(44, 40, 37, 0.08);
  --shadow-floating: 0 12px 32px rgba(44, 40, 37, 0.15);

  /* === Transitions === */
  --transition-fast: 150ms ease;
  --transition-normal: 250ms ease;
  --transition-slow: 400ms ease;
}

/* Dark mode */
.dark {
  --color-bg: #1A1816;
  --color-bg-subtle: #232120;
  --color-bg-elevated: #2C2825;
  --color-bg-inverse: #FAF8F5;

  --color-text: #F0ECE6;
  --color-text-secondary: #B5AFA8;
  --color-text-tertiary: #7D7771;
  --color-text-inverse: #2C2825;

  --color-border: #3D3834;
  --color-border-light: #2C2825;

  --color-primary: #D4944A;
  --color-primary-hover: #E0A45C;
  --color-primary-subtle: rgba(212, 148, 74, 0.12);

  --color-accent: #7AAF6A;
  --color-accent-subtle: rgba(122, 175, 106, 0.12);

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.25);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.3);
  --shadow-floating: 0 12px 32px rgba(0, 0, 0, 0.4);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-accent: var(--color-accent);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); font-size: var(--text-base); line-height: var(--leading-normal); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }

      /* Hero section */
      .hero-section {
        position: relative;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .hero-bg {
        position: absolute;
        inset: 0;
        z-index: 0;
        background-image: url('../assets/hero-scenery.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }

      .hero-overlay {
        position: absolute;
        inset: 0;
        z-index: 1;
        background: linear-gradient(
          to bottom,
          rgba(44, 40, 37, 0.15) 0%,
          rgba(44, 40, 37, 0.25) 40%,
          rgba(44, 40, 37, 0.65) 75%,
          rgba(44, 40, 37, 0.85) 100%
        );
      }

      .hero-content {
        position: relative;
        z-index: 2;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        padding: var(--space-2xl) var(--space-lg) var(--space-3xl);
      }

      .hero-text-block {
        max-width: 640px;
        width: 100%;
        text-align: center;
        margin-bottom: var(--space-2xl);
      }

      .hero-heading {
        font-family: var(--font-display);
        font-size: clamp(1.75rem, 5vw, 3.25rem);
        font-weight: var(--font-weight-bold);
        line-height: var(--leading-tight);
        color: var(--color-text-inverse);
        margin-bottom: var(--space-lg);
        text-shadow: 0 2px 16px rgba(0, 0, 0, 0.25);
      }

      .hero-subheading {
        font-family: var(--font-body);
        font-size: clamp(1rem, 2.5vw, 1.25rem);
        font-weight: var(--font-weight-normal);
        line-height: var(--leading-relaxed);
        color: rgba(250, 248, 245, 0.88);
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.2);
      }

      .hero-input-block {
        max-width: 560px;
        width: 100%;
      }

      .hero-input {
        width: 100%;
        padding: 20px 24px;
        font-family: var(--font-body);
        font-size: var(--text-lg);
        line-height: var(--leading-normal);
        color: var(--color-text);
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border-light);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-floating);
        outline: none;
        transition: border-color var(--transition-normal), box-shadow var(--transition-normal);
        box-sizing: border-box;
      }

      .hero-input::placeholder {
        color: var(--color-text-tertiary);
      }

      .hero-input:focus {
        border-color: var(--color-primary);
        box-shadow: var(--shadow-floating), 0 0 0 3px var(--color-primary-subtle);
      }

      .hero-actions {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-lg);
        margin-top: var(--space-xl);
      }

      .hero-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 18px 56px;
        font-family: var(--font-body);
        font-size: var(--text-xl);
        font-weight: var(--font-weight-semibold);
        line-height: 1;
        color: var(--color-primary-text);
        background: var(--color-primary);
        border: none;
        border-radius: var(--radius-full);
        cursor: pointer;
        transition: background-color var(--transition-normal), transform var(--transition-fast);
        box-shadow: 0 4px 16px rgba(184, 115, 51, 0.3);
      }

      .hero-btn:hover {
        background: var(--color-primary-hover);
        transform: translateY(-1px);
        box-shadow: 0 6px 24px rgba(184, 115, 51, 0.4);
      }

      .hero-btn:active {
        transform: translateY(0);
      }

      .album-link {
        font-family: var(--font-body);
        font-size: var(--text-base);
        font-weight: var(--font-weight-normal);
        color: rgba(250, 248, 245, 0.75);
        text-decoration: none;
        border-bottom: 1px solid rgba(250, 248, 245, 0.35);
        padding-bottom: 2px;
        transition: color var(--transition-normal), border-color var(--transition-normal);
      }

      .album-link:hover {
        color: var(--color-text-inverse);
        border-color: rgba(250, 248, 245, 0.7);
      }

      /* Navigation */
      .top-nav {
        position: relative;
        z-index: 10;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: var(--space-lg) var(--space-lg) 0;
      }

      .brand-name {
        font-family: var(--font-display);
        font-size: var(--text-xl);
        font-weight: var(--font-weight-bold);
        color: var(--color-text-inverse);
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.3);
        letter-spacing: 0.02em;
      }

      .nav-album {
        font-family: var(--font-body);
        font-size: var(--text-base);
        font-weight: var(--font-weight-normal);
        color: rgba(250, 248, 245, 0.8);
        text-decoration: none;
        padding: var(--space-sm) var(--space-md);
        border-radius: var(--radius-md);
        transition: background-color var(--transition-fast), color var(--transition-fast);
      }

      .nav-album:hover {
        background: rgba(255, 255, 255, 0.12);
        color: var(--color-text-inverse);
      }

      /* Responsive */
      @media (min-width: 768px) {
        .hero-content {
          padding: var(--space-3xl) var(--space-2xl) var(--space-4xl);
        }

        .hero-text-block {
          margin-bottom: var(--space-2xl);
        }

        .hero-input {
          padding: 22px 28px;
          font-size: var(--text-lg);
        }

        .hero-btn {
          padding: 20px 64px;
          font-size: var(--text-xl);
        }

        .top-nav {
          padding: var(--space-xl) var(--space-2xl) 0;
        }

        .brand-name {
          font-size: var(--text-2xl);
        }
      }

      @media (min-width: 1024px) {
        .hero-content {
          padding: var(--space-3xl) var(--space-3xl) var(--space-4xl);
        }

        .hero-text-block {
          max-width: 680px;
        }

        .hero-input-block {
          max-width: 600px;
        }
      }
    </style>
</head>
<body class="min-h-screen antialiased" style="margin: 0; padding: 0;">
    <main>
      <!-- Hero Section -->
      <section class="hero-section">
        <!-- Background Image -->
        <div class="hero-bg" aria-hidden="true"></div>
        <!-- Gradient Overlay -->
        <div class="hero-overlay" aria-hidden="true"></div>

        <!-- Top Navigation -->
        <nav class="top-nav">
          <span class="brand-name">环球美景</span>
          <a href="album.html" class="nav-album" data-dom-id="home-to-album">我的收藏</a>
        </nav>

        <!-- Centered Content -->
        <div class="hero-content">
          <div class="hero-text-block">
            <h1 class="hero-heading">足不出户，看遍世间美景</h1>
            <p class="hero-subheading">告诉我你今天的心情，或者你一直想去的地方，我帮你找到最美的风景</p>
          </div>

          <div class="hero-input-block">
            <input
              type="text"
              class="hero-input"
              id="heroInput"
              placeholder="说说你今天的心情，或者想去的地方..."
              aria-label="输入你的心情或想去的地方"
            />
            <div class="hero-actions">
              <a href="creator-entry.html" class="hero-btn" data-dom-id="home-to-scenery" style="text-decoration:none;">去看看</a>
              <a href="album.html" class="album-link" data-dom-id="home-to-album">我的收藏</a>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script>lucide.createIcons();

      // 输入框回车即跳转到沉浸体验页
      var heroInput = document.getElementById('heroInput');
      if (heroInput) {
        heroInput.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' && this.value.trim()) {
            window.location.href = 'creator-entry.html';
          }
        });
      }
    </script>
</body>
</html>
