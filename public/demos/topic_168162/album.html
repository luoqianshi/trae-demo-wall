<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>环球美景 - 我的风景收藏</title>
    <style id="theme-vars">
/* World Scenery - Brand Design Tokens */
/* Warm neutral palette with earthy tones, optimized for legibility and serenity */

:root {
  /* === Colors === */
  --color-bg: #FAF8F5;
  --color-bg-subtle: #F3F0EB;
  --color-bg-elevated: #FFFFFF;
  --color-bg-inverse: #2C2825;

  --color-text: #2C2825;
  --color-text-secondary: #6B6560;
  --color-text-tertiary: #9E9893;
  --color-text-inverse: #FAF8F5;

  --color-border: #E8E3DD;
  --color-border-light: #F0ECE6;

  --color-primary: #B87333;
  --color-primary-hover: #A06528;
  --color-primary-subtle: rgba(184, 115, 51, 0.08);
  --color-primary-text: #FFFFFF;

  --color-accent: #5B8A4E;
  --color-accent-subtle: rgba(91, 138, 78, 0.08);

  /* === Typography === */
  --font-display: 'Georgia', 'Noto Serif SC', serif;
  --font-body: 'system-ui', '-apple-system', 'Segoe UI', 'Noto Sans SC', sans-serif;

  --text-xs: 0.875rem;
  --text-sm: 1rem;
  --text-base: 1.125rem;
  --text-lg: 1.25rem;
  --text-xl: 1.5rem;
  --text-2xl: 2rem;
  --text-3xl: 2.5rem;
  --text-4xl: 3.25rem;
  --text-5xl: 4rem;

  --leading-tight: 1.2;
  --leading-snug: 1.35;
  --leading-normal: 1.6;
  --leading-relaxed: 1.75;

  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  /* === Spacing === */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --space-2xl: 48px;
  --space-3xl: 64px;
  --space-4xl: 96px;

  /* === Radius === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* === Shadows (alpha <= 0.05 for static surfaces) === */
  --shadow-sm: 0 1px 2px rgba(44, 40, 37, 0.04);
  --shadow-md: 0 2px 8px rgba(44, 40, 37, 0.05);
  --shadow-lg: 0 8px 24px rgba(44, 40, 37, 0.08);
  --shadow-floating: 0 12px 32px rgba(44, 40, 37, 0.15);

  /* === Transitions === */
  --transition-fast: 150ms ease;
  --transition-normal: 250ms ease;
  --transition-slow: 400ms ease;
}

/* Dark mode */
.dark {
  --color-bg: #1A1816;
  --color-bg-subtle: #232120;
  --color-bg-elevated: #2C2825;
  --color-bg-inverse: #FAF8F5;

  --color-text: #F0ECE6;
  --color-text-secondary: #B5AFA8;
  --color-text-tertiary: #7D7771;
  --color-text-inverse: #2C2825;

  --color-border: #3D3834;
  --color-border-light: #2C2825;

  --color-primary: #D4944A;
  --color-primary-hover: #E0A45C;
  --color-primary-subtle: rgba(212, 148, 74, 0.12);

  --color-accent: #7AAF6A;
  --color-accent-subtle: rgba(122, 175, 106, 0.12);

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.25);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.3);
  --shadow-floating: 0 12px 32px rgba(0, 0, 0, 0.4);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-accent: var(--color-accent);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-bg); color: var(--color-text); }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }

      /* Page-level styles using CSS variables */
      body {
        font-family: var(--font-body);
        font-size: var(--text-base);
        line-height: var(--leading-relaxed);
      }

      .album-heading {
        font-family: var(--font-display);
        font-size: var(--text-3xl);
        font-weight: var(--font-weight-bold);
        line-height: var(--leading-tight);
        color: var(--color-text);
      }

      .album-subtitle {
        font-size: var(--text-lg);
        color: var(--color-text-secondary);
        line-height: var(--leading-relaxed);
      }

      .photo-card {
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        overflow: hidden;
        box-shadow: var(--shadow-sm);
        transition: box-shadow var(--transition-normal), transform var(--transition-normal);
        position: relative;
      }

      .photo-card:hover {
        box-shadow: var(--shadow-lg);
        transform: translateY(-2px);
      }

      .photo-card .card-image {
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
        display: block;
      }

      .photo-card .date-stamp {
        font-family: var(--font-display);
        font-size: var(--text-sm);
        color: var(--color-text-tertiary);
        font-style: italic;
      }

      .photo-card .remove-btn {
        position: absolute;
        top: var(--space-sm);
        right: var(--space-sm);
        width: 28px;
        height: 28px;
        border-radius: var(--radius-full);
        background: rgba(44, 40, 37, 0.5);
        color: #FFFFFF;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        opacity: 0;
        transition: opacity var(--transition-fast), background var(--transition-fast);
        border: none;
        font-size: 16px;
        line-height: 1;
      }

      .photo-card:hover .remove-btn {
        opacity: 1;
      }

      .photo-card .remove-btn:hover {
        background: rgba(44, 40, 37, 0.75);
      }

      .top-bar {
        border-bottom: 1px solid var(--color-border-light);
        background: var(--color-bg);
      }

      .empty-state-text {
        color: var(--color-text-tertiary);
        font-size: var(--text-base);
      }

      .empty-album-placeholder {
        border: 2px dashed var(--color-border);
        border-radius: var(--radius-lg);
      }
    </style>
</head>
<body class="min-h-screen antialiased">

    <!-- Top Bar -->
    <header class="top-bar sticky top-0 z-10">
        <div class="max-w-4xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="home.html" class="text-xl font-semibold tracking-wide" style="font-family: var(--font-display); color: var(--color-primary); text-decoration: none;">
                环球美景
            </a>
            <a href="home.html" data-dom-id="album-to-home"
               class="text-base hover:underline" style="color: var(--color-text-secondary); font-size: var(--text-sm); text-decoration: none;">
                返回首页
            </a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 pt-10 pb-20">

        <!-- Page Heading -->
        <section class="text-center mb-10">
            <h1 class="album-heading mb-3">我的风景收藏</h1>
            <p class="album-subtitle">你走过的风景，都在这里</p>
        </section>

        <!-- Photo Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">

            <!-- Photo Card 1: Sunset -->
            <div class="photo-card">
                <button class="remove-btn" aria-label="移除收藏" title="移除收藏">&times;</button>
                <img src="../assets/album-sunset.jpg" alt="美丽的日落景色" class="card-image" loading="lazy">
                <div class="p-4 flex items-center justify-between">
                    <span class="date-stamp">2026年3月15日 收藏</span>
                </div>
            </div>

            <!-- Photo Card 2: Village -->
            <div class="photo-card">
                <button class="remove-btn" aria-label="移除收藏" title="移除收藏">&times;</button>
                <img src="../assets/album-village.jpg" alt="宁静的小村庄" class="card-image" loading="lazy">
                <div class="p-4 flex items-center justify-between">
                    <span class="date-stamp">2026年5月8日 收藏</span>
                </div>
            </div>

        </div>

        <!-- Empty State (hidden when photos exist) -->
        <div class="album-empty-state" style="display: none;">
            <div class="text-center py-16">
                <div class="empty-album-placeholder inline-flex items-center justify-center mx-auto mb-6" style="width: 120px; height: 120px;">
                    <i data-lucide="camera" style="width: 48px; height: 48px; color: var(--color-text-tertiary); opacity: 0.5;"></i>
                </div>
                <p class="empty-state-text">你还没有收藏任何风景，去首页发现你喜欢的美景吧</p>
            </div>
        </div>

    </main>

    <script>lucide.createIcons();</script>
</body>
</html>
