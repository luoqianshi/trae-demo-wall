<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>环球美景 - 风景画廊</title>
    <style id="theme-vars">
/* World Scenery - Brand Design Tokens */
/* Warm neutral palette with earthy tones, optimized for legibility and serenity */

:root {
  /* === Colors === */
  --color-bg: #FAF8F5;
  --color-bg-subtle: #F3F0EB;
  --color-bg-elevated: #FFFFFF;
  --color-bg-inverse: #2C2825;

  --color-text: #2C2825;
  --color-text-secondary: #6B6560;
  --color-text-tertiary: #9E9893;
  --color-text-inverse: #FAF8F5;

  --color-border: #E8E3DD;
  --color-border-light: #F0ECE6;

  --color-primary: #B87333;
  --color-primary-hover: #A06528;
  --color-primary-subtle: rgba(184, 115, 51, 0.08);
  --color-primary-text: #FFFFFF;

  --color-accent: #5B8A4E;
  --color-accent-subtle: rgba(91, 138, 78, 0.08);

  /* === Typography === */
  --font-display: 'Georgia', 'Noto Serif SC', serif;
  --font-body: 'system-ui', '-apple-system', 'Segoe UI', 'Noto Sans SC', sans-serif;

  --text-xs: 0.875rem;
  --text-sm: 1rem;
  --text-base: 1.125rem;
  --text-lg: 1.25rem;
  --text-xl: 1.5rem;
  --text-2xl: 2rem;
  --text-3xl: 2.5rem;
  --text-4xl: 3.25rem;
  --text-5xl: 4rem;

  --leading-tight: 1.2;
  --leading-snug: 1.35;
  --leading-normal: 1.6;
  --leading-relaxed: 1.75;

  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  /* === Spacing === */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --space-2xl: 48px;
  --space-3xl: 64px;
  --space-4xl: 96px;

  /* === Radius === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* === Shadows (alpha <= 0.05 for static surfaces) === */
  --shadow-sm: 0 1px 2px rgba(44, 40, 37, 0.04);
  --shadow-md: 0 2px 8px rgba(44, 40, 37, 0.05);
  --shadow-lg: 0 8px 24px rgba(44, 40, 37, 0.08);
  --shadow-floating: 0 12px 32px rgba(44, 40, 37, 0.15);

  /* === Transitions === */
  --transition-fast: 150ms ease;
  --transition-normal: 250ms ease;
  --transition-slow: 400ms ease;
}

/* Dark mode */
.dark {
  --color-bg: #1A1816;
  --color-bg-subtle: #232120;
  --color-bg-elevated: #2C2825;
  --color-bg-inverse: #FAF8F5;

  --color-text: #F0ECE6;
  --color-text-secondary: #B5AFA8;
  --color-text-tertiary: #7D7771;
  --color-text-inverse: #2C2825;

  --color-border: #3D3834;
  --color-border-light: #2C2825;

  --color-primary: #D4944A;
  --color-primary-hover: #E0A45C;
  --color-primary-subtle: rgba(212, 148, 74, 0.12);

  --color-accent: #7AAF6A;
  --color-accent-subtle: rgba(122, 175, 106, 0.12);

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.25);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.3);
  --shadow-floating: 0 12px 32px rgba(0, 0, 0, 0.4);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-accent: var(--color-accent);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-bg); color: var(--color-text); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>

    <!-- Page-specific styles -->
    <style>
      /* Masonry layout */
      .masonry-grid {
        column-count: 1;
        column-gap: var(--space-xl);
      }

      @media (min-width: 640px) {
        .masonry-grid {
          column-count: 2;
        }
      }

      @media (min-width: 1024px) {
        .masonry-grid {
          column-count: 3;
        }
      }

      /* Photo card */
      .photo-card {
        break-inside: avoid;
        margin-bottom: var(--space-xl);
        border-radius: var(--radius-lg);
        border: 1.5px solid var(--color-border-light);
        overflow: hidden;
        position: relative;
        transition: border-color var(--transition-normal);
      }

      .photo-card:hover {
        border-color: var(--color-border);
      }

      .photo-card img {
        display: block;
        width: 100%;
        object-fit: cover;
      }

      /* Varying heights for masonry effect */
      .photo-card--mountain img {
        height: 320px;
      }
      .photo-card--lake img {
        height: 420px;
      }
      .photo-card--field img {
        height: 280px;
      }

      @media (min-width: 640px) {
        .photo-card--mountain img { height: 380px; }
        .photo-card--lake img { height: 480px; }
        .photo-card--field img { height: 340px; }
      }

      @media (min-width: 1024px) {
        .photo-card--mountain img { height: 360px; }
        .photo-card--lake img { height: 460px; }
        .photo-card--field img { height: 300px; }
      }

      /* Caption overlay */
      .photo-card .caption-overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: var(--space-lg);
        background: linear-gradient(to top, rgba(0, 0, 0, 0.55), transparent);
        color: #FFFFFF;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
      }

      .photo-card .caption-text {
        font-family: var(--font-display);
        font-size: var(--text-lg);
        line-height: var(--leading-snug);
        font-weight: 500;
      }

      /* Heart button */
      .heart-btn {
        flex-shrink: 0;
        background: none;
        border: none;
        cursor: pointer;
        padding: var(--space-xs);
        color: rgba(255, 255, 255, 0.8);
        transition: color var(--transition-fast), transform var(--transition-fast);
      }

      .heart-btn:hover {
        transform: scale(1.15);
      }

      .heart-btn.liked {
        color: var(--color-primary);
      }

      .heart-btn.liked svg {
        fill: var(--color-primary);
      }

      /* Explore section */
      .explore-input {
        width: 100%;
        padding: var(--space-md) var(--space-lg);
        border: 1.5px solid var(--color-border);
        border-radius: var(--radius-lg);
        background: var(--color-bg-elevated);
        color: var(--color-text);
        font-size: var(--text-base);
        font-family: var(--font-body);
        outline: none;
        transition: border-color var(--transition-normal);
      }

      .explore-input::placeholder {
        color: var(--color-text-tertiary);
      }

      .explore-input:focus {
        border-color: var(--color-primary);
      }

      .explore-btn {
        display: inline-flex;
        align-items: center;
        gap: var(--space-sm);
        padding: var(--space-md) var(--space-xl);
        background: var(--color-primary);
        color: var(--color-primary-text);
        border: none;
        border-radius: var(--radius-lg);
        font-size: var(--text-base);
        font-family: var(--font-body);
        font-weight: var(--font-weight-medium);
        cursor: pointer;
        transition: background var(--transition-fast);
        white-space: nowrap;
      }

      .explore-btn:hover {
        background: var(--color-primary-hover);
      }
    </style>
</head>
<body class="min-h-screen antialiased" style="font-family: var(--font-body);">

    <!-- Top Bar -->
    <header style="padding: var(--space-lg) var(--space-xl);">
      <div style="max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between;">
        <a href="home.html" style="font-family: var(--font-display); font-size: var(--text-xl); font-weight: var(--font-weight-bold); color: var(--color-text); text-decoration: none; letter-spacing: 0.02em;">
          环球美景
        </a>
        <a href="home.html" data-dom-id="scenery-to-home" style="font-size: var(--text-sm); color: var(--color-text-secondary); text-decoration: none; transition: color var(--transition-fast);">
          返回首页
        </a>
      </div>
    </header>

    <main>
      <!-- Page Heading -->
      <section style="text-align: center; padding: var(--space-2xl) var(--space-xl) var(--space-3xl);">
        <div style="max-width: 600px; margin: 0 auto;">
          <h1 style="font-family: var(--font-display); font-size: var(--text-3xl); font-weight: var(--font-weight-bold); color: var(--color-text); line-height: var(--leading-tight); margin: 0 0 var(--space-md);">
            为你找到了这些风景
          </h1>
          <p style="font-size: var(--text-base); color: var(--color-text-secondary); line-height: var(--leading-relaxed); margin: 0;">
            根据你的描述，我们精选了以下美景
          </p>
        </div>
      </section>

      <!-- Masonry Photo Gallery -->
      <section style="max-width: 1200px; margin: 0 auto; padding: 0 var(--space-xl) var(--space-4xl);">
        <div class="masonry-grid">

          <!-- Card 1: Mountain -->
          <div class="photo-card photo-card--mountain">
            <img src="../assets/gallery-mountain.jpg" alt="黄山云海" loading="lazy">
            <div class="caption-overlay">
              <span class="caption-text">黄山云海 · 安徽</span>
              <button class="heart-btn" aria-label="喜欢这张照片" onclick="toggleHeart(this)">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Card 2: Lake -->
          <div class="photo-card photo-card--lake">
            <img src="../assets/gallery-lake.jpg" alt="千岛秋色" loading="lazy">
            <div class="caption-overlay">
              <span class="caption-text">千岛秋色 · 浙江</span>
              <button class="heart-btn" aria-label="喜欢这张照片" onclick="toggleHeart(this)">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Card 3: Field -->
          <div class="photo-card photo-card--field">
            <img src="../assets/gallery-field.jpg" alt="金色麦田" loading="lazy">
            <div class="caption-overlay">
              <span class="caption-text">金色麦田 · 云南</span>
              <button class="heart-btn" aria-label="喜欢这张照片" onclick="toggleHeart(this)">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                </svg>
              </button>
            </div>
          </div>

        </div>
      </section>

      <!-- Explore More Section -->
      <section style="max-width: 560px; margin: 0 auto; padding: 0 var(--space-xl) var(--space-4xl); text-align: center;">
        <h2 style="font-family: var(--font-display); font-size: var(--text-2xl); font-weight: var(--font-weight-semibold); color: var(--color-text); margin: 0 0 var(--space-lg); line-height: var(--leading-snug);">
          还想看更多？
        </h2>
        <div style="display: flex; gap: var(--space-md); align-items: stretch;">
          <input type="text" class="explore-input" placeholder="换个地方看看...">
          <button class="explore-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/>
              <path d="m21 21-4.3-4.3"/>
            </svg>
            继续探索
          </button>
        </div>
      </section>
    </main>

    <script>
      // Heart toggle interaction
      function toggleHeart(btn) {
        btn.classList.toggle('liked');
        const svg = btn.querySelector('svg');
        if (btn.classList.contains('liked')) {
          svg.setAttribute('fill', 'currentColor');
        } else {
          svg.setAttribute('fill', 'none');
        }
      }
    </script>
</body>
</html>
