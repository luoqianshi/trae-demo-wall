<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>环球美景 - 沉浸式旅行体验</title>
<style>
  /* ===== CSS Custom Properties ===== */
  :root {
    --bg-primary: #0D0D0D;
    --bg-panel: #1A1A1A;
    --bg-glass: rgba(26, 26, 26, 0.65);
    --bg-glass-heavy: rgba(13, 13, 13, 0.8);
    --border-glass: rgba(255, 255, 255, 0.08);
    --border-glass-light: rgba(255, 255, 255, 0.12);
    --text-primary: #FFFFFF;
    --text-secondary: rgba(255, 255, 255, 0.65);
    --text-tertiary: rgba(255, 255, 255, 0.4);
    --accent: #D4944A;
    --accent-glow: rgba(212, 148, 74, 0.35);
    --green-pulse: #4ADE80;
    --chat-user-bg: rgba(212, 148, 74, 0.15);
    --chat-ai-bg: rgba(255, 255, 255, 0.06);
    --font-body: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --font-serif: Georgia, "Noto Serif SC", "STSong", serif;
    --scenery-width: 73%;
    --chat-width: 27%;
  }

  /* ===== Reset & Base ===== */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  /* ===== Main Layout ===== */
  .app {
    display: flex;
    width: 100vw; height: 100vh;
    position: relative;
  }

  /* ===== Top Bar ===== */
  .top-bar {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 28px;
    background: var(--bg-glass);
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    border-bottom: 1px solid var(--border-glass);
  }

  .top-bar__logo {
    font-family: var(--font-serif);
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: 2px;
    color: var(--text-primary);
    text-shadow: 0 0 20px var(--accent-glow);
  }

  .top-bar__center {
    font-size: 0.85rem;
    color: var(--text-secondary);
    letter-spacing: 1px;
  }

  .top-bar__actions {
    display: flex; gap: 8px;
  }

  .top-bar__btn {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border-glass);
    border-radius: 10px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .top-bar__btn:hover {
    background: rgba(255,255,255,0.12);
    color: var(--text-primary);
    transform: translateY(-1px);
  }

  .top-bar__btn svg { width: 18px; height: 18px; }

  /* ===== Scenery Area ===== */
  .scenery {
    width: var(--scenery-width);
    height: 100vh;
    position: relative;
    overflow: hidden;
    background: #000;
  }

  .scenery__image-wrapper {
    position: absolute; inset: 0;
  }

  .scenery__image {
    width: 100%; height: 100%;
    object-fit: cover;
    transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .scenery__image.hidden {
    opacity: 0;
  }

  /* Vignette overlay */
  .scenery__vignette {
    position: absolute; inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.45) 100%),
      linear-gradient(to top, rgba(0,0,0,0.3) 0%, transparent 30%);
    z-index: 2;
  }

  /* Location label */
  .scenery__location {
    position: absolute;
    bottom: 32px; left: 32px;
    z-index: 10;
    display: flex; flex-direction: column; gap: 6px;
  }

  .scenery__location-name {
    font-family: var(--font-serif);
    font-size: 1.4rem;
    font-weight: 500;
    letter-spacing: 3px;
    color: var(--text-primary);
    text-shadow: 0 2px 16px rgba(0,0,0,0.7);
  }

  .scenery__live-indicator {
    display: flex; align-items: center; gap: 6px;
    font-size: 0.75rem;
    color: var(--text-secondary);
    text-shadow: 0 1px 8px rgba(0,0,0,0.5);
  }

  .scenery__live-dot {
    width: 7px; height: 7px;
    background: var(--green-pulse);
    border-radius: 50%;
    animation: pulse-dot 2s ease-in-out infinite;
    box-shadow: 0 0 8px var(--green-pulse);
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  /* VR Button */
  .scenery__vr-btn {
    position: absolute;
    bottom: 32px; right: 32px;
    z-index: 10;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    cursor: pointer;
    transition: transform 0.3s ease;
  }

  .scenery__vr-btn:hover {
    transform: scale(1.08);
  }

  .scenery__vr-circle {
    width: 56px; height: 56px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(20px) saturate(1.3);
    -webkit-backdrop-filter: blur(20px) saturate(1.3);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 50%;
    color: var(--text-primary);
    animation: vr-glow 3s ease-in-out infinite;
    box-shadow:
      0 4px 24px rgba(0,0,0,0.3),
      inset 0 1px 0 rgba(255,255,255,0.1);
  }

  .scenery__vr-circle svg { width: 26px; height: 26px; }

  @keyframes vr-glow {
    0%, 100% { box-shadow: 0 4px 24px rgba(0,0,0,0.3), 0 0 0 0 rgba(212,148,74,0); }
    50% { box-shadow: 0 4px 24px rgba(0,0,0,0.3), 0 0 20px 4px rgba(212,148,74,0.2); }
  }

  .scenery__vr-label {
    font-size: 0.65rem;
    color: var(--text-secondary);
    letter-spacing: 1px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.5);
  }

  /* Hidden video element */
  .scenery__video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: none;
    z-index: 1;
  }

  /* ===== Ambient Particles ===== */
  .particles {
    position: absolute; inset: 0;
    z-index: 3;
    pointer-events: none;
    overflow: hidden;
  }

  .particle {
    position: absolute;
    width: 2px; height: 2px;
    background: rgba(255,255,255,0.25);
    border-radius: 50%;
    animation: float-up linear infinite;
  }

  @keyframes float-up {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-100vh) translateX(30px); opacity: 0; }
  }

  /* ===== Chat Panel ===== */
  .chat {
    width: var(--chat-width);
    height: 100vh;
    display: flex; flex-direction: column;
    background: var(--bg-glass-heavy);
    backdrop-filter: blur(32px) saturate(1.3);
    -webkit-backdrop-filter: blur(32px) saturate(1.3);
    border-left: 1px solid var(--border-glass);
    position: relative;
    z-index: 10;
  }

  .chat__header {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border-glass);
    display: flex; flex-direction: column; gap: 2px;
  }

  .chat__header-title {
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 1px;
  }

  .chat__header-sub {
    font-size: 0.72rem;
    color: var(--text-tertiary);
  }

  /* Chat Messages */
  .chat__messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 8px;
    display: flex; flex-direction: column; gap: 14px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.08) transparent;
  }

  .chat__messages::-webkit-scrollbar { width: 4px; }
  .chat__messages::-webkit-scrollbar-track { background: transparent; }
  .chat__messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }

  .msg {
    max-width: 88%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 0.82rem;
    line-height: 1.6;
    animation: msg-slide-in 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .msg--ai {
    align-self: flex-start;
    background: var(--chat-ai-bg);
    border: 1px solid var(--border-glass);
    border-bottom-left-radius: 4px;
    color: var(--text-primary);
  }

  .msg--user {
    align-self: flex-end;
    background: var(--chat-user-bg);
    border: 1px solid rgba(212,148,74,0.15);
    border-bottom-right-radius: 4px;
    color: var(--text-primary);
  }

  .msg--scenery {
    align-self: flex-start;
    background: rgba(212,148,74,0.08);
    border: 1px solid rgba(212,148,74,0.2);
    border-radius: 14px;
    border-bottom-left-radius: 4px;
    color: var(--accent);
    font-size: 0.78rem;
    display: flex; align-items: center; gap: 6px;
  }

  .msg--scenery svg {
    flex-shrink: 0;
    width: 14px; height: 14px;
    animation: arrow-bounce 1.5s ease-in-out infinite;
  }

  @keyframes arrow-bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(3px); }
  }

  @keyframes msg-slide-in {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* Stagger delays */
  .msg:nth-child(1) { animation-delay: 0.1s; }
  .msg:nth-child(2) { animation-delay: 0.4s; }
  .msg:nth-child(3) { animation-delay: 0.7s; }
  .msg:nth-child(4) { animation-delay: 1.0s; }
  .msg:nth-child(5) { animation-delay: 1.3s; }

  /* Chat Input */
  .chat__input-area {
    padding: 12px 16px 18px;
    border-top: 1px solid var(--border-glass);
    display: flex; gap: 10px; align-items: center;
  }

  .chat__input {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border-glass-light);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 0.82rem;
    color: var(--text-primary);
    font-family: var(--font-body);
    outline: none;
    transition: all 0.3s ease;
  }

  .chat__input::placeholder {
    color: var(--text-tertiary);
  }

  .chat__input:focus {
    border-color: rgba(212,148,74,0.4);
    background: rgba(255,255,255,0.08);
    box-shadow: 0 0 0 3px rgba(212,148,74,0.08);
  }

  .chat__send-btn {
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    background: var(--accent);
    border: none;
    border-radius: 12px;
    color: #000;
    cursor: pointer;
    transition: all 0.3s ease;
    flex-shrink: 0;
  }

  .chat__send-btn:hover {
    background: #e0a45c;
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(212,148,74,0.3);
  }

  .chat__send-btn svg { width: 18px; height: 18px; }

  /* ===== Mobile Toggle Button ===== */
  .chat-toggle {
    display: none;
    position: fixed;
    bottom: 20px; right: 20px;
    z-index: 200;
    width: 52px; height: 52px;
    background: var(--accent);
    border: none;
    border-radius: 50%;
    color: #000;
    cursor: pointer;
    box-shadow: 0 4px 24px rgba(212,148,74,0.4);
    transition: all 0.3s ease;
  }

  .chat-toggle:hover {
    transform: scale(1.1);
  }

  .chat-toggle svg { width: 22px; height: 22px; }

  /* ===== Responsive ===== */
  @media (max-width: 768px) {
    :root {
      --scenery-width: 100%;
      --chat-width: 100%;
    }

    .scenery {
      width: 100%;
      height: 60vh;
    }

    .chat {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      width: 100%;
      height: 45vh;
      transform: translateY(100%);
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      border-left: none;
      border-top: 1px solid var(--border-glass);
      border-radius: 20px 20px 0 0;
      z-index: 150;
    }

    .chat.open {
      transform: translateY(0);
    }

    .chat-toggle {
      display: flex; align-items: center; justify-content: center;
    }

    .top-bar {
      padding: 10px 16px;
    }

    .top-bar__center {
      display: none;
    }

    .scenery__location-name {
      font-size: 1.1rem;
    }
  }

  /* ===== Scenery Transition ===== */
  .scenery__image-wrapper {
    position: absolute; inset: 0;
    z-index: 1;
  }

  /* ===== Fullscreen mode ===== */
  .app.fullscreen .top-bar { opacity: 0; pointer-events: none; transition: opacity 0.4s; }
  .app.fullscreen .chat { opacity: 0; pointer-events: none; transition: opacity 0.4s; }
  .app.fullscreen .scenery { width: 100%; }
  .app.fullscreen:hover .top-bar,
  .app.fullscreen:hover .chat { opacity: 1; pointer-events: auto; }

  /* ===== Scrollbar for body ===== */
  ::-webkit-scrollbar { width: 0; }
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ===== Top Bar ===== -->
  <div class="top-bar">
    <a href="home.html" class="top-bar__logo" style="text-decoration: none; cursor: pointer;">环球美景</a>
    <div class="top-bar__center">张家界国家森林公园</div>
    <div class="top-bar__actions">
      <!-- Fullscreen toggle -->
      <button class="top-bar__btn" id="fullscreenBtn" title="全屏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
      </button>
      <!-- Share -->
      <button class="top-bar__btn" id="shareBtn" title="分享">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- ===== Scenery Area ===== -->
  <div class="scenery">
    <div class="scenery__image-wrapper">
      <img class="scenery__image" id="sceneryImg" src="../assets/immersive-scenery.jpg" alt="张家界国家森林公园美景" />
      <!-- Hidden video element for future use -->
      <video class="scenery__video" id="sceneryVideo" muted loop playsinline>
        <source src="" type="video/mp4">
      </video>
    </div>

    <!-- Vignette -->
    <div class="scenery__vignette"></div>

    <!-- Particles -->
    <div class="particles" id="particles"></div>

    <!-- Location Label -->
    <div class="scenery__location">
      <div class="scenery__location-name">张家界 · 湖南</div>
      <div class="scenery__live-indicator">
        <span class="scenery__live-dot"></span>
        <span>实时美景</span>
      </div>
    </div>

    <!-- VR Button -->
    <div class="scenery__vr-btn" id="vrBtn" title="进入VR模式">
      <div class="scenery__vr-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="7" width="20" height="10" rx="3"/>
          <circle cx="8" cy="12" r="2"/>
          <circle cx="16" cy="12" r="2"/>
          <path d="M2 12h4M18 12h4"/>
        </svg>
      </div>
      <span class="scenery__vr-label">VR 模式</span>
    </div>
  </div>

  <!-- ===== Chat Panel ===== -->
  <div class="chat" id="chatPanel">
    <div class="chat__header">
      <div class="chat__header-title">环球美景</div>
      <div class="chat__header-sub">AI 旅行伙伴</div>
    </div>

    <div class="chat__messages" id="chatMessages">
      <div class="msg msg--ai">你好！欢迎来到环球美景。告诉我你今天的心情，或者你想去哪里看看？</div>
      <div class="msg msg--user">我想看看张家界</div>
      <div class="msg msg--ai">好的！这是张家界国家森林公园的壮丽景色。那里的石柱如同仙境一般，清晨的云海更是美不胜收。</div>
      <div class="msg msg--scenery">
        为你切换到张家界实景
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12l7 7 7-7"/>
        </svg>
      </div>
    </div>

    <div class="chat__input-area">
      <input class="chat__input" id="chatInput" type="text" placeholder="描述你的心情或想去的地方..." />
      <button class="chat__send-btn" id="chatSendBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile Chat Toggle -->
  <button class="chat-toggle" id="chatToggle">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
  </button>

</div>

<script>
(function() {
  'use strict';

  // ===== Generate ambient particles =====
  const particlesContainer = document.getElementById('particles');
  const PARTICLE_COUNT = 30;

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.top = (60 + Math.random() * 40) + '%';
    p.style.width = (1 + Math.random() * 2) + 'px';
    p.style.height = p.style.width;
    p.style.animationDuration = (12 + Math.random() * 18) + 's';
    p.style.animationDelay = (Math.random() * 15) + 's';
    p.style.opacity = 0.1 + Math.random() * 0.3;
    particlesContainer.appendChild(p);
  }

  // ===== Chat functionality =====
  const chatInput = document.getElementById('chatInput');
  const chatSendBtn = document.getElementById('chatSendBtn');
  const chatMessages = document.getElementById('chatMessages');

  function addMessage(text, type) {
    const div = document.createElement('div');
    div.className = 'msg msg--' + type;
    div.textContent = text;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  // Simulated AI responses
  const aiResponses = [
    '张家界的云海确实令人叹为观止，仿佛置身仙境。每一根石柱都诉说着亿万年的故事。',
    '如果你想换个心情，我推荐你看看九寨沟的碧蓝湖水，那里的色彩会让你着迷。',
    '清晨和黄昏是观赏美景的最佳时刻，光线变化带来截然不同的视觉享受。',
    '你知道吗？张家界还是电影《阿凡达》中悬浮山的灵感来源呢。',
  ];
  let responseIndex = 0;

  function sendMessage() {
    const text = chatInput.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    chatInput.value = '';

    // Simulate AI typing delay
    setTimeout(function() {
      const resp = aiResponses[responseIndex % aiResponses.length];
      responseIndex++;
      addMessage(resp, 'ai');
    }, 800);
  }

  chatSendBtn.addEventListener('click', sendMessage);
  chatInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') sendMessage();
  });

  // ===== Mobile chat toggle =====
  const chatPanel = document.getElementById('chatPanel');
  const chatToggle = document.getElementById('chatToggle');

  chatToggle.addEventListener('click', function() {
    chatPanel.classList.toggle('open');
  });

  // ===== Fullscreen toggle =====
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const app = document.getElementById('app');
  let isFullscreen = false;

  fullscreenBtn.addEventListener('click', function() {
    isFullscreen = !isFullscreen;
    app.classList.toggle('fullscreen', isFullscreen);

    if (isFullscreen && document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(function() {
        isFullscreen = false;
        app.classList.remove('fullscreen');
      });
    } else if (!isFullscreen && document.exitFullscreen) {
      document.exitFullscreen().catch(function() {});
    }
  });

  document.addEventListener('fullscreenchange', function() {
    if (!document.fullscreenElement) {
      isFullscreen = false;
      app.classList.remove('fullscreen');
    }
  });

  // ===== VR Button (visual feedback) =====
  const vrBtn = document.getElementById('vrBtn');

  vrBtn.addEventListener('click', function() {
    const circle = vrBtn.querySelector('.scenery__vr-circle');
    circle.style.background = 'rgba(212,148,74,0.3)';
    circle.style.borderColor = 'rgba(212,148,74,0.5)';
    vrBtn.querySelector('.scenery__vr-label').textContent = 'VR 已启动';

    setTimeout(function() {
      circle.style.background = 'rgba(255,255,255,0.1)';
      circle.style.borderColor = 'rgba(255,255,255,0.18)';
      vrBtn.querySelector('.scenery__vr-label').textContent = 'VR 模式';
    }, 2000);
  });

  // ===== Share button =====
  const shareBtn = document.getElementById('shareBtn');
  shareBtn.addEventListener('click', function() {
    if (navigator.share) {
      navigator.share({
        title: '环球美景 - 沉浸式旅行体验',
        text: '跟我一起沉浸式游览张家界国家森林公园！',
        url: window.location.href
      }).catch(function() {});
    } else {
      // Fallback: copy URL
      navigator.clipboard.writeText(window.location.href).then(function() {
        shareBtn.style.color = 'var(--accent)';
        setTimeout(function() {
          shareBtn.style.color = '';
        }, 1500);
      }).catch(function() {});
    }
  });

  // ===== Scenery crossfade support =====
  window.switchScenery = function(src) {
    const img = document.getElementById('sceneryImg');
    const wrapper = img.parentElement;

    // Create a new image
    const newImg = document.createElement('img');
    newImg.className = 'scenery__image hidden';
    newImg.src = src;
    newImg.alt = '美景';

    wrapper.appendChild(newImg);

    // Wait for load, then crossfade
    newImg.addEventListener('load', function() {
      newImg.classList.remove('hidden');
      setTimeout(function() {
        img.classList.add('hidden');
        setTimeout(function() {
          wrapper.removeChild(img);
        }, 1200);
      }, 100);
    });
  };

})();
</script>
</body>
</html>
