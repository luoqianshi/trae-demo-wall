    <button class="action-btn primary" onclick="goHome()">再次体验</button>
  </div>
</section>

<script>
/* ========== 状态管理 ========== */
const state = {
  mood: '', sceneName: '', beforeScore: 0, afterScore: 0,
  currentRatingType: 'before', breathInterval: null, bubbleGame: null
};

const MOODS = {
  anxious: { name: '风之谷', title: '风之谷', emoji: '🌿', color: '#5ba8a8', type: 'breath' },
  sad: { name: '回忆湖', title: '回忆湖', emoji: '🍂', color: '#d4a06a', type: 'story' },
  lonely: { name: '星空营地', title: '星空营地', emoji: '🌙', color: '#8b7eb5', type: 'chat' },
  stress: { name: '解压花园', title: '解压花园', emoji: '🫧', color: '#d49aaa', type: 'bubble' }
};

const STORIES = {
  anxious: [
    { speaker: '小愈', text: '风之谷的风，会把你的不安吹散。来，跟着我一起呼吸。', next: 'breath' }
  ],
  sad: [
    { speaker: '小愈', text: '你看起来心情有点沉，像被乌云遮住了一样。来，坐在回忆湖的岸边吧。愿意听一个关于灰色和光的故事吗？', choices: [
      { text: '想听故事', next: 1 },
      { text: '想先安静待会儿', next: 'rest' }
    ]},
    { speaker: '小愈', text: '从前，在很远很远的北方，有一片灰色森林。天是灰的，地是灰的，像是有人在天上盖了一层厚厚的毯子。', next: 2 },
    { speaker: '小愈', text: '森林里住着一只小狐狸，叫阿橙。它的毛色本来是橙色的，但住久了之后，连毛色都变成了灰扑扑的。它每天趴在石头上发呆。', next: 3 },
    { speaker: '小愈', text: '有一天傍晚，阿橙拖着尾巴路过一块大石头，忽然停下了脚步——石头缝里，有什么东西在动。', next: 4 },
    { speaker: '小愈', text: '它低下头凑近看，发现那是一朵很小很小的花。淡淡的、暖暖的黄色，像是谁不小心把一小缕阳光掉在了石头缝里。', next: 5 },
    { speaker: '小愈', text: '阿橙盯着那朵花看了很久。它忍不住伸出爪子碰了碰——花瓣是软的，带着一点点温度。原来灰色森林里，也是有颜色的啊。', next: 6 },
    { speaker: '小愈', text: '第二天一早，阿橙又跑去看那朵花。花还在，而且好像比昨天又大了一点点。它坐在旁边守了一整天。', next: 7 },
    { speaker: '小愈', text: '第三天，花旁边冒出了两片嫩绿的小叶子。阿橙第一次笑了——它自己都没注意到，嘴角居然是会上扬的。', next: 8 },
    { speaker: '小愈', text: '从那天起，阿橙每天都会去看那朵花。来回的路上，它开始注意到——原来苔藓是翠绿的，雨后会有彩虹，落叶是金色的。', next: 9 },
    { speaker: '小愈', text: '一个月过去了，小花变成了一丛花。远远望去，灰色的石头上有一团暖黄色。阿橙的毛色也回来了，比以前更亮。', next: 10 },
    { speaker: '小愈', text: '一只老松鼠路过，问它："你为什么每天都坐在这里？"阿橙说："因为有一朵花在教我怎么看见颜色。"', next: 11 },
    { speaker: '小愈', text: '老松鼠笑了："花没有教你啊，是你自己慢慢学会的。花只是在那里，而你愿意去看。"', next: 12 },
    { speaker: '小愈', text: '阿橙愣了一下，然后也笑了。是啊，花只是安安静静地开在那里。是阿橙自己选择了停下来、凑近看、一点一点看到了颜色。', next: 13 },
    { speaker: '小愈', text: '你呢？最近的生活里，有没有遇到过什么像那朵小花一样的小事？', choices: [
      { text: '好像……有过', next: 14 },
      { text: '我想不起来', next: 15 }
    ]},
    { speaker: '小愈', text: '太好了。那些小事就是你灰色日子里的小花。来，把它写下来吧，写下来就不会被忘记了。', next: 'goodthing' },
    { speaker: '小愈', text: '没关系，慢慢来。闭上眼睛想一想——今天有没有吃到好吃的、看到好看的、或者只是睡了一个舒服的觉？', next: 'goodthing' }
  ],
  lonely: [
    { speaker: '小愈', text: '今晚的星空很美，但最美的其实是有人陪你一起看。我在这里呢。', choices: [
      { text: '我最近总是一个人', next: 1 },
      { text: '我觉得没人懂我', next: 2 }
    ]},
    { speaker: '小愈', text: '一个人的时候，不代表你是孤独的。至少现在，你和我在一起，在这片星空下。', next: 'letter' },
    { speaker: '小愈', text: '懂你的人也许不多，但你的感受是真实的，也是重要的。写下来吧，把心里的话告诉未来的自己。', next: 'letter' }
  ],
  stress: [
    { speaker: '小愈', text: '压力就像这些泡泡，看着很大，但其实一戳就破。来试试吧！', next: 'bubble' }
  ]
};

/* ========== 页面切换 ========== */
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goHome() {
  clearAllTimers();
  state.mood = ''; state.sceneName = ''; state.beforeScore = 0; state.afterScore = 0;
  showPage('home');
}
function clearAllTimers() {
  if (state.breathInterval) { clearInterval(state.breathInterval); state.breathInterval = null; }
  if (state.bubbleGame) { cancelAnimationFrame(state.bubbleGame); state.bubbleGame = null; }
}

/* ========== 急救模式 ========== */
function startEmergency() {
  state.mood = 'anxious'; state.sceneName = '风之谷（急救）';
  enterScene('anxious', true);
}
function startScene(mood) {
  state.mood = mood; state.sceneName = MOODS[mood].name;
  enterScene(mood, false);
}
function enterScene(mood, isEmergency) {
  const cfg = MOODS[mood];
  document.getElementById('sceneBg').className = 'scene-bg ' + mood;
  const deco = document.getElementById('sceneDeco'); deco.innerHTML = '';
  if (mood === 'anxious') {
    for (let i = 0; i < 6; i++) {
      const leaf = document.createElement('div');
      leaf.className = 'leaf';
      leaf.style.left = Math.random() * 100 + '%';
      leaf.style.animationDuration = (4 + Math.random() * 4) + 's';
      leaf.style.animationDelay = Math.random() * 3 + 's';
      deco.appendChild(leaf);
    }
  } else if (mood === 'lonely') {
    for (let i = 0; i < 15; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 60 + '%';
      star.style.animationDuration = (1.5 + Math.random() * 2) + 's';
      star.style.animationDelay = Math.random() * 2 + 's';
      deco.appendChild(star);
    }
  } else if (mood === 'stress') {
    for (let i = 0; i < 5; i++) {
      const b = document.createElement('div');
      b.className = 'bubble-deco';
      const s = 30 + Math.random() * 60;
      b.style.width = s + 'px'; b.style.height = s + 'px';
      b.style.left = Math.random() * 90 + '%';
      b.style.top = Math.random() * 80 + '%';
      b.style.animation = 'float ' + (3 + Math.random() * 2) + 's ease-in-out infinite';
      deco.appendChild(b);
    }
  }
  document.getElementById('sceneTitle').textContent = isEmergency ? '急救模式' : cfg.title;
  showPage('scene');
  renderStory(mood, 0);
}

/* ========== 剧情渲染 ========== */
let storyIndex = 0;
function renderStory(mood, index) {
  storyIndex = index;
  const story = STORIES[mood];
  if (!story || index >= story.length) return;
  const node = story[index];
  const body = document.getElementById('sceneBody');
  if (node.next === 'breath') { showBreathGame(); return; }
  if (node.next === 'bubble') { showBubbleGame(); return; }
  if (node.next === 'rest') { showRestEnd(); return; }
  if (node.next === 'letter') { showLetter(); return; }
  if (node.next === 'goodthing') { showGoodThing(); return; }
  let html = '<div class="dialog-box">';
  html += '<div class="dialog-speaker">' + node.speaker + '</div>';
  html += '<div class="dialog-text">' + node.text + '</div></div>';
  if (node.choices) {
    node.choices.forEach((c, i) => {
      html += '<button class="choice-btn" onclick="choose(' + i + ')">' + c.text + '</button>';
    });
  } else if (typeof node.next === 'number') {
    html += '<button class="action-btn" onclick="renderStory(state.mood, ' + node.next + ')">继续</button>';
  }
  body.innerHTML = html;
}
function choose(choiceIndex) {
  const story = STORIES[state.mood];
  const node = story[storyIndex];
  const next = node.choices[choiceIndex].next;
  if (next === 'rest') showRestEnd();
  else if (next === 'letter') showLetter();
  else if (next === 'goodthing') showGoodThing();
  else renderStory(state.mood, next);
}

/* ========== 休息结束 ========== */
function showRestEnd() {
  document.getElementById('sceneBody').innerHTML = `
    <div class="dialog-box">
      <div class="dialog-speaker">小愈</div>
      <div class="dialog-text">谢谢你愿意和我待一会儿。故事讲完了，但温暖会留在你心里。来，告诉我，你现在感觉怎么样？</div>
    </div>
    <button class="action-btn" onclick="goToRating('before')">好的</button>
  `;
}

/* ========== 写下一件好事 ========== */
function showGoodThing() {
  document.getElementById('sceneBody').innerHTML = `
    <div class="dialog-box">
      <div class="dialog-speaker">小愈</div>
      <div class="dialog-text">写下一件今天让你感到一点点温暖的小事吧。</div>
    </div>
    <textarea class="letter-area" id="goodThingText" placeholder="今天让我开心的小事是……"></textarea>
    <button class="action-btn" onclick="submitGoodThing()">写好了</button>
  `;
}
function submitGoodThing() {
  const text = document.getElementById('goodThingText').value.trim();
  if (!text) return;
  document.getElementById('sceneBody').innerHTML = `
    <div class="dialog-box">
      <div class="dialog-speaker">小愈</div>
      <div class="dialog-text">"${text}" —— 这就是今天属于你的小花。谢谢你愿意把它找出来。</div>
    </div>
    <button class="action-btn" onclick="goToRating('before')">我准备好了</button>
  `;
}

/* ========== 写信 ========== */
function showLetter() {
  document.getElementById('sceneBody').innerHTML = `
    <div class="dialog-box">
      <div class="dialog-speaker">小愈</div>
      <div class="dialog-text">写一封信给未来的自己吧。不用太长，哪怕只有一句话。</div>
    </div>
    <textarea class="letter-area" id="letterText" placeholder="亲爱的未来的我……"></textarea>
    <button class="action-btn" onclick="submitLetter()">写好了</button>
  `;
}
function submitLetter() {
  const text = document.getElementById('letterText').value.trim();
  if (!text) return;
  goToRating('before');
}

/* ========== 呼吸练习 ========== */
function showBreathGame() {
  document.getElementById('sceneBody').innerHTML = `
    <div class="dialog-box">
      <div class="dialog-speaker">小愈</div>
      <div class="dialog-text">闭上眼睛，跟着圆圈一起呼吸。</div>
    </div>
    <div class="breath-container">
      <div class="breath-circle" id="breathCircle"><div class="breath-text">吸气</div></div>
      <div class="breath-guide" id="breathGuide">吸气时圆圈变大，呼气时变小</div>
    </div>
    <button class="action-btn" onclick="finishBreath()">我感觉好多了</button>
  `;
  document.getElementById('breathCircle').classList.add('breathing');
  let phase = 0;
  state.breathInterval = setInterval(() => {
    phase = 1 - phase;
    document.querySelector('.breath-text').textContent = phase === 0 ? '吸气' : '呼气';
    document.getElementById('breathGuide').textContent = phase === 0 ? '慢慢吸气……感受空气进入身体' : '缓缓呼气……把烦恼都吹走';
  }, 3000);
}
function finishBreath() {
  clearInterval(state.breathInterval); state.breathInterval = null;
  goToRating('before');
}

/* ========== 戳泡泡游戏 ========== */
function showBubbleGame() {
  document.getElementById('sceneBody').innerHTML = `
    <div class="dialog-box">
      <div class="dialog-speaker">小愈</div>
      <div class="dialog-text">点击泡泡把它们戳破！每戳破一个，压力就少一分。</div>
    </div>
    <div class="bubble-score" id="bubbleScore">戳破 0 个泡泡</div>
    <canvas id="bubbleCanvas"></canvas>
    <div class="bubble-hint">戳够 15 个就过关啦</div>
    <button class="action-btn" id="bubbleDoneBtn" onclick="finishBubble()" style="display:none">我轻松多了</button>
  `;
  initBubbleGame();
}
function initBubbleGame() {
  const canvas = document.getElementById('bubbleCanvas');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  const W = rect.width, H = rect.height;
  let bubbles = [];
  let popped = 0;
  function spawn() {
    const r = 12 + Math.random() * 18;
    bubbles.push({
      x: r + Math.random() * (W - r * 2),
      y: H + r, r, speed: 0.5 + Math.random() * 1,
      wobble: Math.random() * Math.PI * 2,
      opacity: 0.5 + Math.random() * 0.3,
      color: ['rgba(255,200,220,', 'rgba(200,230,255,', 'rgba(255,240,200,', 'rgba(220,200,255,'][Math.floor(Math.random() * 4)]
    });
  }
  for (let i = 0; i < 5; i++) spawn();
  canvas.addEventListener('click', (e) => {
    const r2 = canvas.getBoundingClientRect();
    const mx = e.clientX - r2.left, my = e.clientY - r2.top;
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      const dx = mx - b.x, dy = my - b.y;
      if (dx * dx + dy * dy < b.r * b.r) {
        bubbles.splice(i, 1); popped++;
        document.getElementById('bubbleScore').textContent = '戳破 ' + popped + ' 个泡泡';
        if (popped >= 15) document.getElementById('bubbleDoneBtn').style.display = 'block';
        spawn(); spawn(); break;
      }
    }
  });
  function draw() {
    ctx.clearRect(0, 0, W, H);
    bubbles.forEach((b, i) => {
      b.y -= b.speed; b.wobble += 0.03;
      const bx = b.x + Math.sin(b.wobble) * 5;
      if (b.y < -b.r) { bubbles.splice(i, 1); spawn(); }
      ctx.beginPath(); ctx.arc(bx, b.y, b.r, 0, Math.PI * 2);
      ctx.fillStyle = b.color + b.opacity + ')'; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.beginPath(); ctx.arc(bx - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.25, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fill();
    });
    state.bubbleGame = requestAnimationFrame(draw);
  }
  draw();
}
function finishBubble() {
  cancelAnimationFrame(state.bubbleGame); state.bubbleGame = null;
  goToRating('before');
}

/* ========== 打分系统 ========== */
function goToRating(type) {
  state.currentRatingType = type;
  const isBefore = type === 'before';
  document.getElementById('ratingTitle').textContent = isBefore ? '现在心情怎么样？' : '体验之后，心情有变化吗？';
  document.getElementById('ratingSub').textContent = isBefore ? '选择一个数字（1=很糟，10=很好）' : '再选一次，看看有没有好一点';
  document.getElementById('ratingIcon').textContent = MOODS[state.mood]?.emoji || '🌿';
  document.getElementById('ratingScore').textContent = '5';
  document.getElementById('ratingScore').style.color = isBefore ? '#889999' : MOODS[state.mood]?.color || '#4a9e7f';
  document.getElementById('modalCloseBtn').style.display = isBefore ? 'none' : 'block';
  const dots = document.getElementById('ratingDots');
  dots.innerHTML = '';
  for (let i = 1; i <= 10; i++) {
    const dot = document.createElement('div');
    dot.className = 'rating-dot'; dot.textContent = i;
    dot.onclick = () => selectRating(i);
    dots.appendChild(dot);
  }
  selectRating(5);
  document.getElementById('ratingModal').classList.add('active');
}
function selectRating(n) {
  document.querySelectorAll('.rating-dot').forEach((d, i) => d.classList.toggle('selected', i + 1 === n));
  document.getElementById('ratingScore').textContent = n;
  if (state.currentRatingType === 'before') state.beforeScore = n;
  else state.afterScore = n;
}
function submitRating() {
  if (state.currentRatingType === 'before') {
    goToRating('after');
  } else {
    document.getElementById('ratingModal').classList.remove('active');
    showResult();
  }
}
function closeRatingModal() {
  document.getElementById('ratingModal').classList.remove('active');
  if (state.currentRatingType === 'after') showResult();
}

/* ========== 结束页 ========== */
function showResult() {
  const b = state.beforeScore, a = state.afterScore, diff = a - b;
  const cfg = MOODS[state.mood];
  let summary = '';
  if (diff > 0) summary = `太棒了！和小愈在${cfg.name}的时光，让你的心情从 ${b} 分上升到了 ${a} 分。记住这种放松的感觉。`;
  else if (diff === 0) summary = `今天你在${cfg.name}待了一会儿，心情保持在了 ${a} 分。停下来休息一下，就已经很好了。`;
  else summary = `今天的心情从 ${b} 分变成了 ${a} 分。没关系，心愈森林里还有其他角落，下次试试别的地方吧。`;
  document.getElementById('resultSummary').textContent = summary;
  document.getElementById('beforeNum').textContent = b;
  document.getElementById('afterNum').textContent = a;
  document.getElementById('beforeNum').style.color = diff > 0 ? '#d4905a' : (diff < 0 ? '#d4905a' : '#889999');
  document.getElementById('afterNum').style.color = diff > 0 ? '#4a9e7f' : (diff < 0 ? '#d4573a' : '#889999');
  showPage('result');
}
</script>
</body>
</html>
