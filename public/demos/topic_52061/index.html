<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>臭鸡蛋 Demo · 情绪表达小程序</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #000;
    --text: #fff;
    --text-dim: rgba(255, 255, 255, 0.5);
    --text-faint: rgba(255, 255, 255, 0.28);
    --gold: #c8a040;
    --gold-bright: #f0c860;
    --gold-glow: rgba(240, 200, 96, 0.15);
    --egg-red: #e54848;
    --egg-glow: rgba(229, 72, 72, 0.2);
    --popcorn-warm: #e8c87a;
    --popcorn-glow: rgba(232, 200, 122, 0.18);
    --glass: rgba(0, 0, 0, 0.3);
    --glass-strong: rgba(0, 0, 0, 0.5);
    --glass-border: rgba(255, 255, 255, 0.07);
    --glass-highlight: rgba(255, 255, 255, 0.04);
    --card: #111;
    --card-2: #161616;
    --card-border: rgba(255, 255, 255, 0.04);
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --ease-soft: cubic-bezier(0.22, 1, 0.36, 1);
  }
  html, body {
    height: 100%;
    background: #000;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 18% 18%, rgba(229, 72, 72, 0.12), transparent 28%),
      radial-gradient(circle at 84% 12%, rgba(240, 200, 96, 0.08), transparent 24%),
      linear-gradient(135deg, #050505 0%, #111 48%, #050505 100%);
  }

  /* === Phone === */
  .phone {
    width: min(390px, 100vw); height: min(844px, 100vh);
    background: #000;
    border-radius: 50px;
    overflow: hidden;
    position: relative;
    box-shadow:
      0 0 0 10px #1a1a1f,
      0 0 0 12px #2a2a30,
      0 50px 120px rgba(0, 0, 0, 0.85),
      0 0 80px rgba(240, 200, 96, 0.02);
  }
  @media (max-width: 430px), (max-height: 860px) {
    .phone {
      border-radius: 0;
      box-shadow: none;
    }
    .phone::before { display: none; }
  }
  .phone::before {
    content: '';
    position: absolute; top: 0; left: 50%;
    transform: translateX(-50%);
    width: 120px; height: 30px;
    background: #000;
    border-radius: 0 0 20px 20px;
    z-index: 1000;
  }
  .screen { position: absolute; inset: 0; }

  /* === Poster === */
  .poster {
    position: absolute; inset: 0;
    background: #000;
    overflow: hidden;
  }
  .poster img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.5s var(--ease-soft);
  }
  .poster img.loaded { opacity: 1; }
  .poster .poster-glow {
    position: absolute; inset: -24px;
    width: calc(100% + 48px); height: calc(100% + 48px);
    object-fit: cover;
    filter: blur(28px) saturate(150%);
    opacity: 0.32;
    transform: scale(1.08);
    z-index: 0;
  }
  .poster img.main-poster { z-index: 1; }
  .poster::after {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 120% 80% at 50% 30%, transparent 30%, rgba(0,0,0,0.15) 70%),
      linear-gradient(180deg,
        rgba(0,0,0,0.3) 0%,
        rgba(0,0,0,0) 10%,
        rgba(0,0,0,0) 40%,
        rgba(0,0,0,0.15) 58%,
        rgba(0,0,0,0.6) 78%,
        rgba(0,0,0,0.92) 100%
      );
    pointer-events: none;
    z-index: 1;
  }

  .poster::before {
    content: '臭鸡蛋';
    position: absolute; right: -42px; bottom: 180px;
    z-index: 2;
    color: rgba(255, 255, 255, 0.035);
    font-size: 74px; font-weight: 900;
    letter-spacing: -6px;
    writing-mode: vertical-rl;
    pointer-events: none;
  }

  /* === Status Bar === */
  .status-bar {
    position: absolute; top: 0; left: 0; right: 0;
    height: 48px;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 30px;
    font-size: 15px; font-weight: 600;
    z-index: 10;
  }
  .status-bar .right { display: flex; gap: 6px; align-items: center; }

  /* === Top Switch === */
  .top-switch {
    position: absolute; top: 60px; left: 20px; z-index: 20;
  }
  .switch-pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 16px;
    background: var(--glass);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border-radius: 999px;
    font-size: 13px; font-weight: 600;
    color: var(--text); cursor: pointer;
    border: 1px solid var(--glass-border);
    transition: all 0.3s var(--ease);
    letter-spacing: 0.3px;
    box-shadow: inset 0 1px 0 var(--glass-highlight);
  }
  .switch-pill:hover { background: var(--glass-strong); }
  .switch-pill .swap-icon {
    display: inline-block;
    opacity: 0.7;
    transition: transform 0.3s var(--ease), opacity 0.3s;
    flex-shrink: 0;
  }
  .switch-pill:active .swap-icon {
    transform: rotate(180deg);
    opacity: 1;
  }

  .share-floating {
    position: absolute; top: 60px; right: 20px; z-index: 20;
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid var(--glass-border);
    background: var(--glass);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.25s var(--ease);
    box-shadow: inset 0 1px 0 var(--glass-highlight);
  }
  .share-floating:active { transform: scale(0.88); }
  .share-floating.has-chance::after {
    content: '1';
    position: absolute; top: -3px; right: -3px;
    width: 17px; height: 17px;
    border-radius: 50%;
    background: var(--egg-red);
    color: white;
    font-size: 10px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 2px #000, 0 0 14px rgba(229, 72, 72, 0.55);
  }

  /* === Side Nav === */
  .nav-btn-side {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 38px; height: 38px;
    background: var(--glass);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    z-index: 2000;
    cursor: pointer;
    transition: all 0.25s var(--ease);
    border: 1px solid var(--glass-border);
    box-shadow: inset 0 1px 0 var(--glass-highlight);
  }
  .nav-btn-side:active { transform: translateY(-50%) scale(0.85); }
  .nav-btn-side.left { left: 14px; }
  .nav-btn-side.right { right: 14px; }
  .nav-btn-side svg {
    width: 15px; height: 15px;
    fill: none; stroke: rgba(255, 255, 255, 0.8);
    stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
    pointer-events: none;
  }
  .nav-btn-side.disabled { opacity: 0.2; pointer-events: none; }

  /* === Indicators === */
  .indicators {
    position: absolute; top: 62px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 5px;
    z-index: 15;
  }
  .indicator {
    width: 5px; height: 5px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.2);
    transition: all 0.4s var(--ease);
  }
  .indicator.active {
    width: 20px;
    background: var(--gold-bright);
    box-shadow: 0 0 10px rgba(240, 200, 96, 0.5);
  }

  /* === Info Block === */
  .info-block {
    position: absolute;
    bottom: 126px; left: 22px; right: 22px;
    z-index: 20;
  }
  .movie-title {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 10px;
    text-shadow: 0 2px 24px rgba(0, 0, 0, 0.6);
    letter-spacing: 0.3px;
    line-height: 1.12;
  }
  .pill-row {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 6px;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 12px;
    background: var(--glass);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: 999px;
    font-size: 11px; font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    letter-spacing: 0.2px;
    box-shadow: inset 0 1px 0 var(--glass-highlight);
  }
  .pill .pill-icon {
    width: 13px; height: 13px;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700;
    opacity: 0.5;
  }
  .pill.score {
    color: var(--gold-bright);
    border-color: rgba(240, 200, 96, 0.18);
    background: var(--gold-glow);
  }
  .pill.score .pill-icon { opacity: 0.7; }
  .pill.hall {
    color: rgba(255, 255, 255, 0.85);
  }

  /* === Swipe Hint === */
  .swipe-up-hint {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    margin: 16px auto 0;
    font-size: 10px; font-weight: 600;
    color: var(--text-faint);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    animation: pulse 2.5s ease-in-out infinite;
  }
  .swipe-up-hint svg { width: 12px; height: 12px; }
  @keyframes pulse {
    0%, 100% { opacity: 0.35; transform: translateY(0); }
    50% { opacity: 0.75; transform: translateY(-4px); }
  }

  /* === Action Bar === */
  .action-bar {
    position: absolute;
    bottom: 26px; left: 0; right: 0;
    display: flex; justify-content: space-around; align-items: center;
    padding: 0 28px;
    z-index: 30;
  }
  .action-btn {
    --action-tone: rgba(240, 200, 96, 0.9);
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    cursor: pointer;
    position: relative;
    padding: 0;
    background: transparent;
    border: 0;
    box-shadow: none;
    transition: transform 0.15s var(--ease);
    overflow: visible;
  }
  .action-btn:active { transform: scale(0.82); }
  .action-btn.egg { --action-tone: #e54848; }
  .action-btn.applause { --action-tone: #f0c860; }
  .action-btn.popcorn { --action-tone: #e8c87a; }
  .action-icon {
    width: 52px; height: 52px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    background: rgba(20, 20, 20, 0.5);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.06);
    transition: all 0.4s var(--spring);
    position: relative;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
  }
  .action-btn.egg.active .action-icon {
    background: var(--egg-red);
    border-color: var(--egg-red);
    box-shadow:
      0 0 0 4px rgba(229, 72, 72, 0.12),
      0 0 20px rgba(229, 72, 72, 0.4),
      0 4px 16px rgba(229, 72, 72, 0.25);
    transform: scale(1.06);
  }
  .action-btn.applause.active .action-icon {
    background: var(--gold-bright);
    border-color: var(--gold-bright);
    color: #000;
    box-shadow:
      0 0 0 4px rgba(240, 200, 96, 0.12),
      0 0 20px rgba(240, 200, 96, 0.4),
      0 4px 16px rgba(240, 200, 96, 0.25);
    transform: scale(1.06);
  }
  .action-btn.popcorn.active .action-icon {
    background: var(--popcorn-warm);
    border-color: var(--popcorn-warm);
    color: #000;
    box-shadow:
      0 0 0 4px rgba(232, 200, 122, 0.12),
      0 0 20px rgba(232, 200, 122, 0.4),
      0 4px 16px rgba(232, 200, 122, 0.25);
    transform: scale(1.06);
  }
  .action-label {
    font-size: 10px; font-weight: 600;
    color: var(--text-dim);
    letter-spacing: 0.8px;
  }
  .action-btn.active .action-label { color: var(--text); }
  .action-count {
    font-size: 9px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.38);
    letter-spacing: 0.5px;
  }
  .action-btn.active .action-count { color: rgba(255, 255, 255, 0.78); }
  .action-btn.long-pressing .action-icon {
    transform: scale(0.88);
    box-shadow: 0 0 0 6px rgba(255,255,255,.05);
  }
  .emotion-particle {
    position: absolute;
    left: 50%; top: 50%;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--particle-color);
    pointer-events: none;
    z-index: 5;
    animation: emotionParticle .58s var(--ease) forwards;
  }
  @keyframes emotionParticle {
    to {
      transform: translate(var(--x), var(--y)) scale(0.08);
      opacity: 0;
    }
  }
  .fullscreen-burst {
    position: absolute; inset: 0;
    z-index: 8600;
    pointer-events: none;
    overflow: hidden;
  }
  .fullscreen-burst::before {
    content: '';
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 5px),
      radial-gradient(circle at 50% 45%, transparent 0 42%, rgba(0,0,0,.42) 72%);
    opacity: 0;
    animation: fxScan 1.15s steps(2) forwards;
    mix-blend-mode: screen;
  }
  .burst-flash {
    position: absolute; inset: -20%;
    background:
      radial-gradient(circle at 50% 62%, color-mix(in srgb, var(--burst-color) 56%, transparent), transparent 28%),
      radial-gradient(circle at 50% 62%, rgba(255,255,255,.55), transparent 8%);
    animation: burstFlash .72s var(--ease) forwards;
    mix-blend-mode: screen;
  }
  .burst-ring {
    position: absolute; left: 50%; top: 62%;
    width: 48px; height: 48px;
    border: 2px solid color-mix(in srgb, var(--burst-color) 78%, white);
    border-radius: 999px;
    transform: translate(-50%, -50%);
    animation: burstRing .72s var(--ease) forwards;
    box-shadow: 0 0 28px var(--burst-color);
  }
  .burst-word {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%) scale(.72) rotate(-6deg);
    font-size: 46px; font-weight: 900;
    letter-spacing: -2px;
    color: #fff;
    text-shadow: 0 8px 28px rgba(0,0,0,.7), 0 0 30px var(--burst-color);
    animation: burstWord .82s var(--spring) forwards;
  }
  .burst-shard {
    position: absolute; left: 50%; top: 62%;
    width: var(--size); height: var(--size);
    border-radius: 999px;
    background: var(--burst-color);
    box-shadow: 0 0 18px var(--burst-color);
    transform: translate(-50%, -50%);
    animation: burstShard .9s var(--ease) forwards;
  }
  @keyframes burstFlash {
    0% { opacity: 0; transform: scale(.8); }
    22% { opacity: 1; }
    100% { opacity: 0; transform: scale(1.22); }
  }
  @keyframes burstRing {
    to { width: 620px; height: 620px; opacity: 0; }
  }
  @keyframes burstWord {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.55) rotate(-10deg); filter: blur(6px); }
    28% { opacity: 1; transform: translate(-50%, -50%) scale(1.08) rotate(-4deg); filter: blur(0); }
    100% { opacity: 0; transform: translate(-50%, -90%) scale(.92) rotate(3deg); }
  }
  @keyframes burstShard {
    to {
      transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(.2);
      opacity: 0;
    }
  }
  /* === Detail Page === */
  .detail-page {
    position: absolute; inset: 0;
    background: #080808;
    transform: translateY(100%);
    transition: transform 0.6s var(--ease);
    z-index: 500;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .detail-page.show { transform: translateY(0); }
  .detail-header {
    position: sticky; top: 0;
    padding: 56px 20px 12px;
    background: linear-gradient(180deg, #080808 85%, rgba(8, 8, 8, 0));
    z-index: 5;
    display: flex; flex-direction: column; gap: 8px;
  }
  .detail-close {
    position: absolute; top: 46px; right: 20px;
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--text-dim);
    background: rgba(255, 255, 255, 0.05);
    border-radius: 50%;
    transition: all 0.2s;
  }
  .detail-close:hover { color: var(--text); background: rgba(255, 255, 255, 0.1); }
  .detail-close svg { width: 15px; height: 15px; }
  .detail-title {
    font-size: 21px; font-weight: 800;
    text-align: center;
    letter-spacing: 0.3px;
  }
  .detail-meta-row {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-size: 12px;
  }
  .detail-meta-row .status-tag {
    padding: 3px 11px;
    border: 1px solid rgba(200, 160, 64, 0.4);
    border-radius: 999px;
    color: var(--gold-bright);
    background: var(--gold-glow);
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.8px;
  }
  .detail-meta-row .date {
    display: inline-flex; align-items: center; gap: 4px;
    color: var(--text-dim);
    font-size: 11px;
  }
  .detail-body { padding: 0 14px 50px; }

  /* === Cards === */
  .info-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 10px;
    transition: all 0.25s var(--ease);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.02) inset;
  }
  .info-card.clickable { cursor: pointer; }
  .info-card.clickable:hover {
    transform: translateY(-1px);
    border-color: rgba(255, 255, 255, 0.08);
    background: var(--card-2);
  }
  .info-card-head {
    display: flex; align-items: center; gap: 11px;
    margin-bottom: 10px;
  }
  .info-icon {
    width: 32px; height: 32px;
    border-radius: 9px;
    background: var(--gold);
    color: #000;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 800;
    flex-shrink: 0;
  }
  .info-icon.green { background: #4ade80; }
  .info-icon.gray { background: #333; color: #888; }
  .info-head-text { display: flex; flex-direction: column; gap: 0px; }
  .info-head-title { font-size: 13px; font-weight: 600; letter-spacing: 0.2px; }
  .info-head-sub { font-size: 10px; color: var(--text-dim); letter-spacing: 0.3px; }

  .box-value {
    font-size: 28px; font-weight: 800;
    color: var(--gold-bright);
    letter-spacing: -0.5px;
  }
  .score-huge {
    font-size: 48px; font-weight: 900;
    color: var(--gold-bright);
    text-align: center; line-height: 1;
    margin: 4px 0 2px;
    letter-spacing: -1px;
  }
  .score-label {
    text-align: center;
    font-size: 10px; font-weight: 700;
    color: var(--text-dim);
    margin-bottom: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .score-divider {
    height: 1px;
    background: rgba(255, 255, 255, 0.05);
    margin: 0 -16px 12px;
  }
  .score-split {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .score-split .item {
    text-align: center;
    padding: 11px 8px 10px;
    border-radius: 13px;
    background: rgba(255, 255, 255, 0.025);
    border: 1px solid rgba(255, 255, 255, 0.035);
    cursor: pointer;
    transition: all 0.22s var(--ease);
  }
  .score-split .item:hover {
    background: rgba(240, 200, 96, 0.08);
    border-color: rgba(240, 200, 96, 0.18);
    transform: translateY(-1px);
  }
  .score-split .item:active { transform: scale(0.96); }
  .score-split .role {
    display: flex; align-items: center; justify-content: center; gap: 4px;
    font-size: 10px; color: var(--text-dim);
    margin-bottom: 3px;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    font-weight: 600;
  }
  .score-split .pct {
    font-size: 19px; font-weight: 700;
    color: var(--text);
  }
  .score-split .cert-hint {
    margin-top: 5px;
    font-size: 9px;
    color: var(--text-faint);
    letter-spacing: 0.4px;
  }
  .hall-name {
    font-size: 15px; font-weight: 700;
  }
  .audience-quote {
    font-size: 13px; line-height: 1.75;
    color: rgba(255, 255, 255, 0.85);
  }
  .stat-row {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 8px; margin-top: 12px;
  }
  .stat-item {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 12px 4px;
    background: rgba(255, 255, 255, 0.02);
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.03);
    overflow: hidden;
    position: relative;
  }
  .stat-item::after {
    content: '';
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 3px;
    width: var(--pct, 0%);
    background: var(--stat-color, var(--gold-bright));
    border-radius: 0 99px 99px 0;
    box-shadow: 0 0 14px var(--stat-glow, rgba(240, 200, 96, 0.35));

function clamp(num, min, max) {
  return Math.max(min, Math.min(max, num));
}

function calcRecommendScores(m, ePct, aPct, pPct, total) {
  if (!total) {
    var upcomingBase = m.title === '魔方小姐' ? 82 : (m.title === '四渡' ? 78 : 73);
    return { manager: upcomingBase, leader: upcomingBase + 4 };
  }
  var positivePct = aPct + pPct;
  var rankBonus = typeof m.rank === 'number' ? Math.max(0, 8 - m.rank) * 0.7 : 0;
  var manager = Math.round(clamp(positivePct * 0.72 + 24 - ePct * 0.18 + rankBonus, 42, 96));
  var leader = Math.round(clamp(positivePct * 0.88 + pPct * 0.1 - ePct * 0.12, 38, 98));
  return { manager: manager, leader: leader };
}

function formatPct(value) {
  if (!isFinite(value)) return '0%';
  return value.toFixed(1).replace('.0', '') + '%';
}

function getActionMeta(m) {
  if (m && m.isUpcoming) {
    return {
      labels: { egg: '不想看', applause: '想看', popcorn: '等等看' },
      icons: { egg: '🙅', applause: '👀', popcorn: '🤔' },
      colors: { egg: '#e54848', applause: 'var(--gold-bright)', popcorn: '#8cc8ff' }
    };
  }
  return {
    labels: { egg: '臭鸡蛋', applause: '掌声', popcorn: '爆米花' },
    icons: { egg: '🥚', applause: '👏', popcorn: '🍿' },
    colors: { egg: '#e54848', applause: 'var(--gold-bright)', popcorn: '#e8c87a' }
  };
}

function syncActionLabels(m) {
  var meta = getActionMeta(m);
  var map = [
    ['egg', '.action-btn.egg', '#statEgg'],
    ['applause', '.action-btn.applause', '#statApp'],
    ['popcorn', '.action-btn.popcorn', '#statPop']
  ];
  map.forEach(function(item) {
    var key = item[0];
    var actionNode = document.querySelector(item[1]);
    var statNode = document.querySelector(item[2]);
    if (actionNode) {
      actionNode.querySelector('.action-icon').textContent = meta.icons[key];
      actionNode.querySelector('.action-label').textContent = meta.labels[key];
    }
    if (statNode) {
      statNode.querySelector('.stat-icon').textContent = meta.icons[key];
      statNode.querySelector('.label').textContent = meta.labels[key];
      statNode.style.setProperty('--stat-color', meta.colors[key]);
    }
  });
}

function applyMovie(m) {
  if (!m) return;
  syncActionLabels(m);
  movieTitle.textContent = m.title;
  pillDate.textContent = m.isUpcoming ? m.releaseDate + ' 上映' : '上映 ' + m.days + ' 天';
  pillBox.textContent = m.isUpcoming ? m.boxToday : '今日 ' + m.boxToday;

  var egg = m.counts.egg, ap = m.counts.applause, pop = m.counts.popcorn;
  var total = egg + ap + pop;
  var ePct = 0, aPct = 0, pPct = 0, tail = 0, maxKey = 'applause';
  if (total > 0) {
    ePct = Math.floor((egg / total) * 1000) / 10;
    aPct = Math.floor((ap / total) * 1000) / 10;
    pPct = Math.floor((pop / total) * 1000) / 10;
    tail = Math.round((100 - (ePct + aPct + pPct)) * 10) / 10;
    var obj = { egg: ePct, applause: aPct, popcorn: pPct };
    maxKey = Object.entries(obj).sort(function(a, b) { return b[1] - a[1]; })[0][0];
    obj[maxKey] = Math.round((obj[maxKey] + tail) * 10) / 10;
    var actionMeta = getActionMeta(m);
    var colorMap = actionMeta.colors;
    var labelMap = actionMeta.labels;
    pillScore.innerHTML = labelMap[maxKey] + ' <span style="color:' + colorMap[maxKey] + ';font-weight:700">' + obj[maxKey] + '%</span>';
  } else {
    pillScore.textContent = m.boxToday;
  }

  pillHall.textContent = m.hall;
  loadPoster(m);

  detailTitle.textContent = m.title;
  detailStatus.textContent = m.isUpcoming ? '即将上映' : '正在热映';
  detailDate.textContent = m.releaseDate + (m.actors ? ' · ' + m.actors : '');
  detailBox.textContent = m.boxTotal;
  var recoScores = calcRecommendScores(m, ePct, aPct, pPct, total);
  detailScore.textContent = Math.round((recoScores.manager + recoScores.leader) / 2) + '%';
  detailManager.textContent = recoScores.manager + '%';
  detailMedia.textContent = recoScores.leader + '%';
  detailHall.textContent = m.hall;
  detailQuote.textContent = m.quote;
  cntEgg.textContent = m.counts.egg;
  cntApp.textContent = m.counts.applause;
  cntPop.textContent = m.counts.popcorn;
  pctEgg.textContent = formatPct(ePct);
  pctApp.textContent = formatPct(aPct);
  pctPop.textContent = formatPct(pPct);
  statEgg.style.setProperty('--pct', formatPct(ePct));
  statApp.style.setProperty('--pct', formatPct(aPct));
  statPop.style.setProperty('--pct', formatPct(pPct));
  quickEgg.textContent = m.counts.egg;
  quickApp.textContent = m.counts.applause;
  quickPop.textContent = m.counts.popcorn;
  syncActionState();
}

var _posterImg = null;
function loadPoster(m) {
  if (_posterImg && _posterImg.parentNode) _posterImg.parentNode.removeChild(_posterImg);
  poster.querySelectorAll('.poster-glow').forEach(function(node) { node.remove(); });
  poster.style.background = '#000';
  _posterImg = null;
  var candidates = (m.posters || []).filter(Boolean);
  if (candidates.length === 0) return;
  var idx = 0;
  var img = document.createElement('img');
  var glow = document.createElement('img');
  img.alt = m.title;
  glow.alt = '';
  img.referrerPolicy = 'no-referrer';
  glow.referrerPolicy = 'no-referrer';
  img.className = 'main-poster';
  glow.className = 'poster-glow';
  var tryNext = function() {
    if (idx >= candidates.length) return;
    var url = candidates[idx++];
    img.src = url;
    glow.src = url;
  };
  img.onload = function() { img.classList.add('loaded'); glow.classList.add('loaded'); };
  img.onerror = tryNext;
  tryNext();
  _posterImg = img;
  poster.appendChild(glow);
  poster.appendChild(img);
}

function playActionSound(action, isActive) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    var now = audioCtx.currentTime;
    var master = audioCtx.createGain();
    master.connect(audioCtx.destination);

    // --- Egg: keep original growl + crackle ---
    if (action === 'egg') {
      master.gain.setValueAtTime(0.0001, now);
      master.gain.exponentialRampToValueAtTime(0.18, now + 0.012);
      master.gain.exponentialRampToValueAtTime(0.0001, now + 0.32);
      var pair = [120, 72];
      pair.forEach(function(freq, idx) {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, now + idx * 0.035);
        osc.frequency.exponentialRampToValueAtTime(freq * (isActive ? 1.18 : 0.82), now + 0.18 + idx * 0.035);
        gain.gain.setValueAtTime(0.0001, now + idx * 0.035);
        gain.gain.exponentialRampToValueAtTime(idx ? 0.18 : 0.28, now + 0.02 + idx * 0.035);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.24 + idx * 0.035);
        osc.connect(gain);
        gain.connect(master);
        osc.start(now + idx * 0.035);
        osc.stop(now + 0.35 + idx * 0.035);
      });
      var noiseBuffer = audioCtx.createBuffer(1, Math.ceil(audioCtx.sampleRate * 0.12), audioCtx.sampleRate);
      var data = noiseBuffer.getChannelData(0);
      for (var i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 2);
      var noise = audioCtx.createBufferSource();
      var noiseGain = audioCtx.createGain();
      noise.buffer = noiseBuffer;
      noiseGain.gain.setValueAtTime(0.18, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.13);
      noise.connect(noiseGain);
      noiseGain.connect(master);
      noise.start(now);
      return;
    }

    // --- Applause: crowd claps (many short noise bursts) ---
    if (action === 'applause') {
      master.gain.setValueAtTime(0.0001, now);
      master.gain.exponentialRampToValueAtTime(0.22, now + 0.02);
      master.gain.exponentialRampToValueAtTime(0.0001, now + 0.85);
      var clapCount = 9 + Math.floor(Math.random() * 5); // 9-13 claps
      for (var c = 0; c < clapCount; c++) {
        var t = now + Math.random() * 0.52;
        var dur = 0.055 + Math.random() * 0.05; // 55-105ms
        var buf = audioCtx.createBuffer(1, Math.ceil(dur * audioCtx.sampleRate), audioCtx.sampleRate);
        var d = buf.getChannelData(0);
        for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        var src = audioCtx.createBufferSource();
        src.buffer = buf;
        var bp = audioCtx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = 2500 + Math.random() * 4000; // 2.5-6.5kHz
        bp.Q.value = 1.2 + Math.random() * 1.8;
        var g = audioCtx.createGain();
        var vol = 0.12 + Math.random() * 0.18;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        src.connect(bp);
        bp.connect(g);
        g.connect(master);
        src.start(t);
        src.stop(t + dur);
      }
      return;
    }

    // --- Popcorn: rapid sharp pops (many tiny high-freq bursts) ---
    if (action === 'popcorn') {
      master.gain.setValueAtTime(0.0001, now);
      master.gain.exponentialRampToValueAtTime(0.24, now + 0.015);
      master.gain.exponentialRampToValueAtTime(0.0001, now + 0.55);
      var popCount = 12 + Math.floor(Math.random() * 8); // 12-19 pops
      for (var p = 0; p < popCount; p++) {
        var t = now + Math.random() * 0.38;
        var dur = 0.018 + Math.random() * 0.03; // 18-48ms
        var buf = audioCtx.createBuffer(1, Math.ceil(dur * audioCtx.sampleRate), audioCtx.sampleRate);
        var d = buf.getChannelData(0);
        for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        var src = audioCtx.createBufferSource();
        src.buffer = buf;
        var bp = audioCtx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = 4500 + Math.random() * 5500; // 4.5-10kHz
        bp.Q.value = 2.5 + Math.random() * 3.5;
        var g = audioCtx.createGain();
        var vol = 0.1 + Math.random() * 0.22;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.003);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        src.connect(bp);
        bp.connect(g);
        g.connect(master);
        src.start(t);
        src.stop(t + dur);
      }
      return;
    }
  } catch (err) {}
}

function triggerFullscreenBurst(action, label) {
  var color = normalizeColor(getActionMeta(getCurrentMovie()).colors[action]);
  fullscreenBurst.innerHTML = '';
  fullscreenBurst.style.setProperty('--burst-color', color);

  var flash = document.createElement('div');
  flash.className = 'burst-flash';
  var ring = document.createElement('div');
  ring.className = 'burst-ring';
  var word = document.createElement('div');
  word.className = 'burst-word';
  word.textContent = label;
  fullscreenBurst.appendChild(flash);
  fullscreenBurst.appendChild(ring);
  fullscreenBurst.appendChild(word);

  for (var i = 0; i < 34; i++) {
    var shard = document.createElement('span');
    shard.className = 'burst-shard';
    var angle = Math.random() * Math.PI * 2;
    var dist = 90 + Math.random() * 210;
    shard.style.setProperty('--x', Math.cos(angle) * dist + 'px');
    shard.style.setProperty('--y', Math.sin(angle) * dist + 'px');
    shard.style.setProperty('--size', (4 + Math.random() * 8) + 'px');
    fullscreenBurst.appendChild(shard);
  }
  setTimeout(function() { fullscreenBurst.innerHTML = ''; }, 980);
}

function burstEmotion(btn, action) {
  var colorMap = getActionMeta(getCurrentMovie()).colors;
  var icon = btn.querySelector('.action-icon');
  if (!icon) return;
  for (var i = 0; i < 16; i++) {
    var p = document.createElement('span');
    p.className = 'emotion-particle';
    p.style.setProperty('--particle-color', colorMap[action] || '#fff');
    var angle = Math.random() * Math.PI * 2;
    var dist = 24 + Math.random() * 42;
    p.style.setProperty('--x', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--y', Math.sin(angle) * dist + 'px');
    icon.appendChild(p);
    setTimeout(function(node) { node.remove(); }, 620, p);
  }
}

function getActiveVoteCount(key) {
  var voted = userVotes[key] || {};
  return Object.keys(voted).filter(function(action) { return voted[action]; }).length;
}

function handleVote(btn) {
  if (Date.now() < suppressVoteUntil) return;
  var action = btn.dataset.action;
  var key = getMovieKey();
  var m = getCurrentMovie();
  userVotes[key] = userVotes[key] || {};
  var labelMap = getActionMeta(m).labels;
  var activeCount = getActiveVoteCount(key);
  burstEmotion(btn, action);

  if (userVotes[key][action]) {
    playActionSound(action, false);
    triggerFullscreenBurst(action, labelMap[action]);
    showToast('已评价过，本次只播放情绪特效');
    return;
  }

  if (activeCount >= 1 && (shareChances[key] || 0) <= 0) {
    showToast('每人只能点亮 1 个，长按已点亮按钮取消后再选别的');
    return;
  }

  m.counts[action] += 1;
  userVotes[key][action] = true;
  playActionSound(action, true);
  triggerFullscreenBurst(action, labelMap[action]);
  if (activeCount >= 1 && (shareChances[key] || 0) > 0) {
    shareChances[key] -= 1;
    showToast('已使用分享赠送机会，多点亮 1 个「' + labelMap[action] + '」');
  } else {
    showToast(labelMap[action] + '已点亮；长按可取消后重选');
  }
  applyMovie(m);
}

function cancelVote(btn) {
  var action = btn.dataset.action;
  var key = getMovieKey();
  var m = getCurrentMovie();
  if (!userVotes[key] || !userVotes[key][action]) {
    showToast('还没有这类评价可取消');
    return;
  }
  var labelMap = getActionMeta(m).labels;
  suppressVoteUntil = Date.now() + 900;
  openModal({
    kicker: '取消点亮',
    title: '取消「' + labelMap[action] + '」吗？',
    body: '取消后你可以重新选择一个点亮项。\n如果这是分享后点亮的第二个选项，取消后会返还 1 次额外点亮名额。',
    confirmText: '确认取消',
    onConfirm: function() {
      userVotes[key][action] = false;
      m.counts[action] = Math.max(0, m.counts[action] - 1);
      if (getActiveVoteCount(key) >= 1) {
        shareChances[key] = (shareChances[key] || 0) + 1;
      }
      applyMovie(m);
      showToast(labelMap[action] + '评价已取消');
    }
  });
}

function showCertificationPrompt(type) {
  var m = getCurrentMovie();
  if (type === 'manager') {
    openModal({
      kicker: '认证申请',
      title: '影院经理认证',
      body: '你正在查看《' + m.title + '》的影院经理推荐度。\n\n申请材料：真实姓名、电话、身份证号、身份证正反面照片、影院名称、职位。\n\n认证通过后，可填写影院经理推荐度、推荐影厅和实名推荐理由。',
      confirmText: '我知道了',
      onConfirm: function() { showToast('已查看影院经理认证要求'); }
    });
    return;
  }
  openModal({
    kicker: '认证申请',
    title: '观影团长认证',
    body: '你正在查看《' + m.title + '》的观影团长推荐度。\n\n申请材料：真实姓名、电话、身份证号、身份证正反面照片、观影团名称/社群名称、团长身份说明。\n\n认证通过后，可填写观影团长推荐度、团购/包场建议和实名推荐理由。',
    confirmText: '我知道了',
    onConfirm: function() { showToast('已查看观影团长认证要求'); }
  });
}

switchPill.addEventListener('click', function(e) {
  e.stopPropagation();
  currentTab = currentTab === 'showing' ? 'upcoming' : 'showing';
  currentIdx = 0;
  switchLabel.textContent = currentTab === 'showing' ? '正在热映' : '即将上映';
  render();
});

navLeft.addEventListener('click', goPrev);
navRight.addEventListener('click', goNext);
swipeUpHint.addEventListener('click', openDetail);

var startX = 0, startY = 0, dragging = false;
document.querySelector('.phone').addEventListener('touchstart', function(e) {
  startX = e.touches[0].clientX; startY = e.touches[0].clientY; dragging = true;
}, { passive: true });
document.querySelector('.phone').addEventListener('touchend', function(e) {
  if (!dragging) return; dragging = false;
  var dx = e.changedTouches[0].clientX - startX;
  var dy = e.changedTouches[0].clientY - startY;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
    if (dx < 0) goNext(); else goPrev();
  } else if (dy < -80 && !detailPage.classList.contains('show')) {
    openDetail();
  }
}, { passive: true });

document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight') goNext();
  if (e.key === 'ArrowLeft') goPrev();
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    if (theaterPage.classList.contains('show')) closeTheater();
    else if (detailPage.classList.contains('show')) closeDetail();
    else openDetail();
  }
});

detailClose.addEventListener('click', closeDetail);
hallCard.addEventListener('click', openTheater);
theaterBack.addEventListener('click', closeTheater);
modalCancel.addEventListener('click', closeModal);
modalConfirm.addEventListener('click', function() {
  var handler = modalConfirmHandler;
  closeModal();
  if (handler) handler();
});
appModal.addEventListener('click', function(e) {
  if (e.target === appModal) closeModal();
});
managerCertCard.addEventListener('click', function(e) {
  e.stopPropagation();
  showCertificationPrompt('manager');
});
leaderCertCard.addEventListener('click', function(e) {
  e.stopPropagation();
  showCertificationPrompt('leader');
});

document.querySelectorAll('.action-btn').forEach(function(btn) {
  btn.addEventListener('pointerdown', function(e) {
    e.preventDefault();
    e.stopPropagation();
    votePointerId = e.pointerId;
    if (btn.setPointerCapture) {
      try { btn.setPointerCapture(e.pointerId); } catch (err) {}
    }
    longPressTriggered = false;
    btn.classList.add('long-pressing');
    longPressTimer = setTimeout(function() {
      longPressTriggered = true;
      suppressVoteUntil = Date.now() + 900;
      btn.classList.remove('long-pressing');
      cancelVote(btn);
    }, 800);
  });
  btn.addEventListener('pointerup', function(e) {
    e.preventDefault();
    e.stopPropagation();
    if (votePointerId !== null && e.pointerId !== votePointerId) return;
    clearTimeout(longPressTimer);
    btn.classList.remove('long-pressing');
    if (!longPressTriggered && Date.now() >= suppressVoteUntil) handleVote(btn);
    votePointerId = null;
  });
  btn.addEventListener('pointercancel', function() {
    clearTimeout(longPressTimer);
    btn.classList.remove('long-pressing');
    votePointerId = null;
  });
});

shareBtn.addEventListener('click', function(e) {
  e.stopPropagation();
  var key = getMovieKey();
  shareChances[key] = (shareChances[key] || 0) + 1;
  syncActionState();
  showToast('分享成功：额外解锁 1 个点亮名额，24 小时内有效');
});

render();
</script>

</body>
</html>
