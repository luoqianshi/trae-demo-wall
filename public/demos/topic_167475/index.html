      openModal(r.question, '<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">' +
        '<span class="read-expert-badge">' + r.expertIcon + ' ' + r.expertRole + '</span>' +
        '<span class="read-time">⏱ ' + r.readTime + '</span></div>' + r.article);
    }

    /* ========================================================
       RENDER: MATCH INFO (only sports)
    ======================================================== */
    function renderMatch() {
      var n = NEWS[currentNewsIndex];
      if (!n.isSports || !n.match) {
        document.getElementById('cardMatch').style.display = 'none';
        return;
      }
      document.getElementById('cardMatch').style.display = 'flex';
      var m = n.match;

      // Score card
      var html = '<div class="match-section">' +
        '<div class="match-section-title">比分卡片</div>' +
        '<div class="score-card">' +
          '<div class="score-team"><div class="score-team-flag">' + m.homeFlag + '</div><div class="score-team-name">' + m.homeTeam + '</div><div class="score-num">' + m.homeScore + '</div></div>' +
          '<div class="score-vs"><div class="score-vs-text">VS</div><div class="score-status">' + m.status + '</div></div>' +
          '<div class="score-team"><div class="score-team-flag">' + m.awayFlag + '</div><div class="score-team-name">' + m.awayTeam + '</div><div class="score-num">' + m.awayScore + '</div></div>' +
        '</div></div>';

      // Timeline
      html += '<div class="match-section"><div class="match-section-title">进球时间线</div><div class="timeline">';
      for (var i = 0; i < m.timeline.length; i++) {
        var t = m.timeline[i];
        html += '<div class="timeline-item"><span class="timeline-time">' + t.time + '</span><span class="timeline-event">' + t.event + '</span></div>';
      }
      html += '</div></div>';

      // Bracket
      html += '<div class="match-section"><div class="match-section-title">赛事对阵</div><div class="bracket">';
      html += '<div class="bracket-round"><div class="bracket-round-title">半决赛</div>';
      for (var j = 0; j < m.bracket.semifinals.length; j++) {
        var sf = m.bracket.semifinals[j];
        html += renderBracketMatch(sf);
      }
      html += '</div>';
      html += '<div class="bracket-connectors"><div style="font-size:20px;color:var(--muted-2);">→</div></div>';
      html += '<div class="bracket-round"><div class="bracket-round-title">决赛</div>';
      html += renderBracketMatch(m.bracket.final);
      html += '</div></div>';

      // Stats
      html += '<div class="match-section"><div class="match-section-title">关键数据对比</div><div class="stats-compare">';
      for (var s = 0; s < m.stats.length; s++) {
        var st = m.stats[s];
        var total = st.home + st.away;
        var homePct = total > 0 ? (st.home / total * 100) : 50;
        var awayPct = 100 - homePct;
        html += '<div class="stat-row">' +
          '<div class="stat-val left">' + st.home + st.unit + '</div>' +
          '<div><div class="stat-label">' + st.label + '</div><div class="stat-bar-wrap"><div class="stat-bar-left" style="width:' + homePct + '%"></div><div class="stat-bar-right" style="width:' + awayPct + '%"></div></div></div>' +
          '<div class="stat-val right">' + st.away + st.unit + '</div>' +
        '</div>';
      }
      html += '</div></div>';

      document.getElementById('matchBody').innerHTML = html;
    }
    function renderBracketMatch(match) {
      var cls = match.done ? 'done' : 'pending';
      var winA = match.winner === 'A';
      var winB = match.winner === 'B';
      return '<div class="bracket-match ' + cls + '">' +
        '<div class="bracket-row' + (winA ? ' winner' : '') + '"><span class="bracket-team">' + match.teamA + '</span><span class="bracket-score">' + match.scoreA + '</span></div>' +
        '<div class="bracket-row' + (winB ? ' winner' : '') + '"><span class="bracket-team">' + match.teamB + '</span><span class="bracket-score">' + match.scoreB + '</span></div>' +
      '</div>';
    }

    /* ========================================================
       MODAL
    ======================================================== */
    function openModal(title, bodyHTML) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalBody').innerHTML = bodyHTML;
      document.getElementById('modalMask').classList.add('show');
    }
    function closeModal() {
      document.getElementById('modalMask').classList.remove('show');
    }

    /* ========================================================
       NAVIGATION
    ======================================================== */
    function selectNews(idx) {
      if (idx === currentNewsIndex) return;
      var newsId = NEWS[currentNewsIndex].id;
      saveCurrentTreeState(newsId);
      saveCurrentGraphState(newsId);
      saveCurrentExpertState(newsId);
      currentNewsIndex = idx;
      renderHotList();
      renderNewsBrief();
      var newNewsId = NEWS[currentNewsIndex].id;
      if (generatedNews[newNewsId]) {
        // 该新闻已生成过卡片，恢复全部卡片状态
        renderAllCards();
      } else {
        // 未生成过，显示空状态
        resetCards();
      }
    }
    function saveCurrentTreeState(newsId) {
      var rows = document.querySelectorAll('.tree-row');
      var expandedNodes = [];
      for (var i = 0; i < rows.length; i++) {
        var row = rows[i];
        var children = row.nextElementSibling;
        if (children && children.classList && !children.classList.contains('hidden')) {
          var nodePath = row.getAttribute('data-node-path');
          if (nodePath) {
            expandedNodes.push(nodePath);
          }
        }
      }
      if (!treeStates[newsId]) {
        treeStates[newsId] = { expandedNodes: [], generatedChildren: {} };
      }
      treeStates[newsId].expandedNodes = expandedNodes;
    }
    function saveCurrentGraphState(newsId) {
      // 保存AI推导的额外节点（非原始数据节点）
      var n = NEWS[currentNewsIndex];
      var baseLabels = {};
      if (n.graph) {
        baseLabels[n.graph.core.label] = true;
        for (var i = 0; i < n.graph.branches.length; i++) baseLabels[n.graph.branches[i].label] = true;
        for (var j = 0; j < n.graph.leaves.length; j++) baseLabels[n.graph.leaves[j].label] = true;
        if (n.graph.crossLinks) {
          for (var c = 0; c < n.graph.crossLinks.length; c++) {
            baseLabels[n.graph.crossLinks[c].to] = true;
          }
        }
      }
      var extraNodes = [];
      for (var k = 0; k < graphAllNodes.length; k++) {
        var nd = graphAllNodes[k];
        if (!baseLabels[nd.label] && nd.sourceType === 'AI推导') {
          extraNodes.push({ label: nd.label, x: nd.x, y: nd.y, sourceType: nd.sourceType, explanation: nd.explanation, evidence: nd.evidence, importance: nd.importance });
        }
      }
      var extraLines = [];
      for (var m = 0; m < graphLines.length; m++) {
        var ln = graphLines[m];
        if (ln.color === '#a855f7') {
          extraLines.push({ from: ln.from, to: ln.to });
        }
      }
      graphStates[newsId] = { extraNodes: extraNodes, extraLines: extraLines };
    }
    function saveCurrentExpertState(newsId) {
      var openIndices = [];
      var cards = document.querySelectorAll('.expert-card');
      for (var i = 0; i < cards.length; i++) {
        if (cards[i].classList.contains('open')) openIndices.push(i);
      }
      expertStates[newsId] = { openIndices: openIndices };
    }
    function associateNewsToKnowledgeCore(newsId) {
      var news = findNewsById(newsId);
      if (!news) return;
      var newsText = (news.title + ' ' + news.core + ' ' + news.category + ' ' + (news.summary || ''));
      for (var i = 0; i < KNOWLEDGE_CORES.length; i++) {
        var k = KNOWLEDGE_CORES[i];
        // 检查标签匹配
        var matched = false;
        for (var t = 0; t < k.tags.length; t++) {
          if (newsText.indexOf(k.tags[t]) !== -1) {
            matched = true;
            break;
          }
        }
        // 也检查核心名称关键词匹配（去除通用词后的剩余关键词）
        if (!matched) {
          var coreKey = k.name.replace(/2026|世界|战略|市场/g, '').trim();
          if (coreKey.length >= 2 && newsText.indexOf(coreKey) !== -1) {
            matched = true;
          }
        }
        if (matched && k.relatedNews.indexOf(newsId) === -1) {
          k.relatedNews.push(newsId);
          k.notesCount += 1;
        }
      }
    }
    function switchView(view) {
      var navBtns = document.querySelectorAll('.nav-btn');
      navBtns.forEach(function(b) { b.classList.remove('active'); });
      var tabs = document.querySelectorAll('.tab-item');
      tabs.forEach(function(t) { t.classList.remove('active'); });
      if (view === 'kb') {
        document.getElementById('kbOverlay').classList.add('show');
        var kbNav = document.querySelector('.nav-btn[data-view="kb"]');
        if (kbNav) kbNav.classList.add('active');
      } else {
        document.getElementById('kbOverlay').classList.remove('show');
        var hotNav = document.querySelector('.nav-btn[data-view="hotspot"]');
        if (hotNav) hotNav.classList.add('active');
        tabs[0].classList.add('active');
      }
    }
    function handleLinkInput() {
      var input = document.querySelector('.link-input');
      var val = input.value.trim();
      if (!val) {
        openModal('提示', '<p>请输入新闻链接。</p>');
        return;
      }
      openModal('链接已接收', '<p>已接收到链接：</p><p style="word-break:break-all;color:var(--accent);font-size:12px;background:var(--bg3);padding:8px;border-radius:6px;">' + val + '</p><p style="margin-top:12px;">当前演示版本暂不支持外链解析，请在左侧热点列表中选择新闻体验完整功能。</p>');
      input.value = '';
    }
    function openOriginal() {
      var n = NEWS[currentNewsIndex];
      openModal('原文 · ' + n.title, '<div style="color:var(--muted);font-size:12px;margin-bottom:10px;">' + n.emoji + ' ' + n.category + ' · ' + n.date + '</div><p>' + n.summary + '</p><p style="margin-top:12px;">西班牙在2026年美加墨世界杯首场半决赛中，凭借奥亚萨瓦尔的点球与波罗的远射，以2比0击败法国队，时隔12年再次闯入世界杯决赛。16岁小将亚马尔在比赛中制造点球，成为世界杯半决赛历史上最年轻的点球制造者。</p><p>本场比赛西班牙延续了传控足球的传统，控球率达到58%，传球成功率91%。法国队虽拥有姆巴佩等明星球员，但全场仅3次射正，未能攻破西班牙球门。</p><p>西班牙将在决赛中迎战阿根廷与英格兰之间的胜者。这是西班牙继1984年、2010年之后，第三次闯入世界杯决赛。</p><p style="margin-top:16px;color:var(--muted-2);font-size:12px;border-top:1px solid var(--rule);padding-top:12px;">来源：新华社 · 2026-07-15</p>');
    }

    /* ========================================================
       RENDER KB
    ======================================================== */
    function renderKB() {
      renderKBFilterTabs();
      var html = '';
      for (var i = 0; i < KNOWLEDGE_CORES.length; i++) {
        var k = KNOWLEDGE_CORES[i];
        if (currentKBCategory !== '全部' && k.category !== currentKBCategory) continue;
        var genCount = 0;
        for (var g = 0; g < k.relatedNews.length; g++) {
          if (generatedNews[k.relatedNews[g]]) genCount++;
        }
        var statusText = genCount > 0 ? ' · ' + genCount + '/' + k.relatedNews.length + ' 已解析' : ' · 待解析';
        html += '<div class="kb-item" onclick="openKBItem(' + i + ')">' +
          '<div class="kb-item-icon">' + k.icon + '</div>' +
          '<div class="kb-item-title">' + k.name + '</div>' +
          '<div class="kb-item-desc">' + k.description + '</div>' +
          '<div class="kb-item-category ' + k.category + '">' + k.category + '</div>' +
          '<div class="kb-item-meta">' + k.createdAt + ' · ' + k.notesCount + '条笔记 · ' + k.relatedNews.length + '条相关新闻' + statusText + '</div>' +
        '</div>';
      }
      document.getElementById('kbGrid').innerHTML = html;
    }
    function renderKBFilterTabs() {
      var categories = ['全部', '体育', '科技', '财经', '政策', '文化'];
      var html = '';
      for (var i = 0; i < categories.length; i++) {
        var cat = categories[i];
        html += '<button class="kb-filter-tab' + (cat === currentKBCategory ? ' active' : '') + '" onclick="filterKB(\'' + cat + '\')">' + cat + '</button>';
      }
      document.getElementById('kbFilterTabs').innerHTML = html;
    }
    function filterKB(category) {
      currentKBCategory = category;
      renderKB();
    }
    function openKBItem(idx) {
      var k = KNOWLEDGE_CORES[idx];
      var tagsHtml = '';
      for (var i = 0; i < k.tags.length; i++) {
        tagsHtml += '<span class="tag tag-core">' + k.tags[i] + '</span>';
      }
      // 统计已解析新闻数
      var generatedCount = 0;
      var newsHtml = '';
      for (var j = 0; j < k.relatedNews.length; j++) {
        var newsId = k.relatedNews[j];
        var news = findNewsById(newsId);
        if (news) {
          var isGenerated = generatedNews[newsId] ? true : false;
          if (isGenerated) generatedCount++;
          var statusBadge = isGenerated
            ? '<span style="color:#0d9488;font-size:11px;font-weight:600;">✓ 已解析</span>'
            : '<span style="color:var(--muted-2);font-size:11px;">○ 未解析</span>';
          newsHtml += '<div style="padding:10px 12px;background:var(--bg3);border-radius:6px;margin-bottom:6px;cursor:pointer;transition:background 0.12s;" onclick="selectNewsFromKB(\'' + newsId + '\')">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">' +
              '<div style="font-weight:600;font-size:13px;color:var(--ink);flex:1;">' + news.emoji + ' ' + news.title + '</div>' +
              statusBadge +
            '</div>' +
            '<div style="font-size:11px;color:var(--muted);margin-top:2px;">' + news.date + ' · ' + news.category + '</div>' +
          '</div>';
        }
      }
      newsHtml = newsHtml || '<div style="color:var(--muted-2);font-size:13px;">暂无相关新闻</div>';

      // 构建知识积累部分：汇总已解析新闻的知识树、图谱节点、专家解读
      var knowledgeHtml = '';
      if (generatedCount > 0) {
        knowledgeHtml += '<div style="margin-top:18px;">' +
          '<div style="font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:10px;">📚 知识积累（来自 ' + generatedCount + ' 条已解析新闻）</div>';

        for (var n = 0; n < k.relatedNews.length; n++) {
          var nid = k.relatedNews[n];
          if (!generatedNews[nid]) continue;
          var nws = findNewsById(nid);
          if (!nws) continue;

          knowledgeHtml += '<div style="background:#fafaf7;border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:8px;padding:12px;margin-bottom:10px;">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">' +
              '<div style="font-size:12px;color:var(--muted);">📰 来自：' + nws.title + '</div>' +
              '<div style="font-size:11px;color:var(--muted-2);">' + nws.date + '</div>' +
            '</div>';

          // 知识树根与分支
          if (nws.tree) {
            knowledgeHtml += '<div style="margin-bottom:8px;">' +
              '<div style="font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px;">🌳 ' + nws.tree.label + '</div>';
            if (nws.tree.children) {
              knowledgeHtml += '<div style="display:flex;flex-wrap:wrap;gap:5px;">';
              for (var c = 0; c < nws.tree.children.length; c++) {
                var child = nws.tree.children[c];
                knowledgeHtml += '<span style="background:#e0e7ff;color:#4f46e5;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:500;">' + child.label + '</span>';
                // 叶节点
                if (child.children) {
                  for (var lc = 0; lc < child.children.length; lc++) {
                    knowledgeHtml += '<span style="background:#f1f5f9;color:#64748b;padding:2px 7px;border-radius:10px;font-size:10px;">' + child.children[lc].label + '</span>';
                  }
                }
              }
              knowledgeHtml += '</div>';
            }
            knowledgeHtml += '</div>';
          }

          // 图谱节点
          if (nws.graph && nws.graph.branches) {
            knowledgeHtml += '<div style="font-size:11px;color:var(--muted);margin-top:6px;line-height:1.7;">' +
              '<span style="font-weight:600;">🕸️ 关联维度：</span>';
            var branchLabels = [];
            for (var b = 0; b < nws.graph.branches.length; b++) {
              branchLabels.push(nws.graph.branches[b].label);
            }
            knowledgeHtml += branchLabels.join(' · ') + '</div>';
          }

          // 专家解读
          if (nws.experts && nws.experts.length) {
            knowledgeHtml += '<div style="font-size:11px;color:var(--muted);margin-top:4px;line-height:1.7;">' +
              '<span style="font-weight:600;">🎤 专家视角：</span>';
            var expertRoles = [];
            for (var e = 0; e < nws.experts.length; e++) {
              expertRoles.push(nws.experts[e].role);
            }
            knowledgeHtml += expertRoles.join(' · ') + '</div>';
          }

          knowledgeHtml += '</div>';
        }
        knowledgeHtml += '</div>';
      } else {
        knowledgeHtml += '<div style="margin-top:18px;padding:16px;background:var(--bg3);border-radius:8px;color:var(--muted);font-size:13px;text-align:center;line-height:1.8;">' +
          '💡 这个知识核心还没有积累知识。<br>点击下方相关新闻进行「生成知识树」解析，<br>生成的知识树、图谱、专家解读将自动归入此处。' +
        '</div>';
      }

      openModal(k.icon + ' ' + k.name, '<div style="color:var(--muted);font-size:12px;margin-bottom:10px;">' + k.category + ' · ' + k.createdAt + ' · ' + k.notesCount + '条笔记 · ' + generatedCount + '/' + k.relatedNews.length + ' 条新闻已解析</div>' +
        '<p>' + k.description + '</p>' +
        '<div style="margin-top:16px;">' +
          '<div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;">标签</div>' +
          '<div style="display:flex;flex-wrap:wrap;gap:6px;">' + tagsHtml + '</div>' +
        '</div>' +
        knowledgeHtml +
        '<div style="margin-top:18px;">' +
          '<div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;">相关新闻 (' + k.relatedNews.length + ')</div>' +
          newsHtml +
        '</div>');
    }
    function findNewsById(id) {
      for (var i = 0; i < NEWS.length; i++) {
        if (NEWS[i].id === id) return NEWS[i];
      }
      return null;
    }
    function selectNewsFromKB(newsId) {
      closeModal();
      switchView('hotspot');
      for (var i = 0; i < NEWS.length; i++) {
        if (NEWS[i].id === newsId) {
          selectNews(i);
          break;
        }
      }
    }

    /* ========================================================
       INIT
    ======================================================== */
    function init() {
      renderHotList();
      renderNewsBrief();
      resetCards();
      renderKB();
      window.addEventListener('resize', function() {
        if (document.getElementById('graphBody').querySelector('.graph-container')) {
          renderGraph();
        }
      });
    }
    init();
  </script>
</body>
</html>
