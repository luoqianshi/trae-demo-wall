<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InfoNexus AI · 智识中枢</title>
  <style>
    :root {
      --bg: #f7f9fc;
      --bg2: #ffffff;
      --bg3: #eef2f7;
      --ink: #1a2238;
      --ink-soft: #324056;
      --muted: #6b7c93;
      --muted-2: #94a3b8;
      --rule: #dce3ed;
      --accent: #0d9488;
      --accent-light: #14b8a6;
      --accent-soft: #ccfbf1;
      --accent2: #4f46e5;
      --accent2-light: #6366f1;
      --accent2-soft: #e0e7ff;
      --gold: #d4a017;
      --gold-soft: #fef3c7;
      --danger: #ef4444;
      --danger-soft: #fee2e2;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --shadow: 0 2px 8px rgba(0,0,0,0.06);
      --shadow-lg: 0 4px 16px rgba(0,0,0,0.08);
      --shadow-xl: 0 8px 28px rgba(0,0,0,0.12);
      --radius: 12px;
      --radius-sm: 8px;
      --radius-xs: 6px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 15px; }
    body {
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      line-height: 1.6;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }

    /* ===== APP SHELL ===== */
    .app {
      display: grid;
      grid-template-columns: 280px 1fr;
      grid-template-rows: 56px 1fr;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* ===== HEADER ===== */
    .app-header {
      grid-column: 1 / -1;
      background: var(--bg2);
      border-bottom: 1px solid var(--rule);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 56px;
      z-index: 50;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 17px;
      letter-spacing: -0.01em;
    }
    .logo-mark {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 16px;
      box-shadow: 0 2px 6px rgba(13,148,136,0.35);
    }
    .logo-sub {
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
      margin-left: 2px;
      padding: 2px 6px;
      background: var(--bg3);
      border-radius: 4px;
    }
    .header-nav {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .nav-btn {
      padding: 7px 16px;
      font-size: 14px;
      color: var(--muted);
      border-radius: var(--radius-xs);
      font-weight: 500;
      transition: all 0.15s;
    }
    .nav-btn:hover { background: var(--bg3); color: var(--ink); }
    .nav-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      background: var(--bg2);
      border-right: 1px solid var(--rule);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .link-input-wrap {
      padding: 14px;
      border-bottom: 1px solid var(--rule);
    }
    .link-input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--rule);
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-family: inherit;
      transition: all 0.15s;
      background: var(--bg);
    }
    .link-input:focus {
      outline: none;
      border-color: var(--accent);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(13,148,136,0.1);
    }
    .link-input::placeholder { color: var(--muted-2); }
    .sidebar-section-title {
      padding: 14px 16px 8px;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .hot-count {
      background: var(--accent-soft);
      color: var(--accent);
      padding: 1px 7px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0;
    }
    .hot-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 8px 8px;
    }
    .hot-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.12s;
    }
    .hot-item:hover { background: var(--bg3); }
    .hot-item.active { background: var(--accent-soft); }
    .hot-rank {
      width: 20px;
      height: 20px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
      background: var(--bg3);
      color: var(--muted);
    }
    .hot-item:nth-child(1) .hot-rank { background: #fee2e2; color: #dc2626; }
    .hot-item:nth-child(2) .hot-rank { background: #fed7aa; color: #ea580c; }
    .hot-item:nth-child(3) .hot-rank { background: #fef3c7; color: #d97706; }
    .hot-item.active .hot-rank { background: var(--accent); color: #fff; }
    .hot-text {
      font-size: 13px;
      line-height: 1.4;
      color: var(--ink-soft);
    }
    .hot-item.active .hot-text { color: var(--accent); font-weight: 600; }
    .hot-meta {
      font-size: 11px;
      color: var(--muted-2);
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sidebar-bottom {
      padding: 12px;
      border-top: 1px solid var(--rule);
    }
    .kb-btn {
      width: 100%;
      padding: 11px;
      background: linear-gradient(135deg, var(--accent2) 0%, var(--accent2-light) 100%);
      color: #fff;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s, box-shadow 0.15s;
      box-shadow: 0 2px 8px rgba(79,70,229,0.25);
    }
    .kb-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(79,70,229,0.35); }
    .kb-btn:active { transform: translateY(0); }

    /* ===== MAIN AREA ===== */
    .main {
      overflow-y: auto;
      padding: 20px 24px 24px;
      position: relative;
    }

    /* ===== NEWS BRIEF CARD ===== */
    .news-brief {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      padding: 18px 22px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
      display: flex;
      align-items: flex-start;
      gap: 18px;
    }
    .news-brief-emoji {
      width: 52px;
      height: 52px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
      background: var(--bg3);
    }
    .news-brief-body { flex: 1; min-width: 0; }
    .news-brief-tags { display: flex; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
    .tag {
      font-size: 11px;
      padding: 2px 9px;
      border-radius: 10px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .tag-sports { background: #dcfce7; color: #15803d; }
    .tag-tech { background: #e0e7ff; color: #4338ca; }
    .tag-econ { background: #fef3c7; color: #b45309; }
    .tag-policy { background: #fce7f3; color: #be185d; }
    .tag-core { background: var(--ink); color: #fff; }
    .news-brief-title {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 6px;
      color: var(--ink);
    }
    .news-brief-summary {
      font-size: 13.5px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 12px;
    }
    .news-brief-actions { display: flex; gap: 10px; }
    .btn {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: var(--radius-xs);
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 6px rgba(13,148,136,0.25);
    }
    .btn-primary:hover { background: var(--accent-light); transform: translateY(-1px); box-shadow: 0 4px 10px rgba(13,148,136,0.35); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { background: var(--muted-2); cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-ghost {
      background: var(--bg3);
      color: var(--ink-soft);
      border: 1px solid var(--rule);
    }
    .btn-ghost:hover { background: var(--bg2); border-color: var(--accent); color: var(--accent); }

    /* ===== CARD GRID ===== */
    .card-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .card {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .card.span-full { grid-column: 1 / -1; }
    .card-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--rule);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .card-title {
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--ink);
    }
    .card-title-icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .icon-tree { background: var(--accent-soft); }
    .icon-graph { background: var(--accent2-soft); }
    .icon-expert { background: #fef3c7; }
    .icon-read { background: #fce7f3; }
    .icon-match { background: #dcfce7; }
    .card-body {
      padding: 14px 18px;
      overflow-y: auto;
      flex: 1;
      max-height: 480px;
    }
    .card-body-noscroll { overflow: visible; }
    .card-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 50px 20px;
      color: var(--muted-2);
      text-align: center;
      gap: 10px;
    }
    .card-empty-icon { font-size: 36px; opacity: 0.5; }
    .card-empty-text { font-size: 13px; }

    /* ===== KNOWLEDGE TREE ===== */
    .tree-node { margin-left: 4px; }
    .tree-children { margin-left: 16px; border-left: 1.5px dashed var(--rule); padding-left: 12px; }
    .tree-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: var(--radius-xs);
      cursor: pointer;
      transition: background 0.12s;
      font-size: 13px;
    }
    .tree-row:hover { background: var(--bg3); }
    .tree-toggle {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: var(--muted);
      transition: transform 0.2s;
      flex-shrink: 0;
    }
    .tree-toggle.open { transform: rotate(90deg); }
    .tree-toggle.leaf { color: transparent; cursor: default; }
    .tree-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .tree-dot.root { background: var(--accent); }
    .tree-dot.branch { background: var(--accent2); }
    .tree-dot.leaf { background: var(--gold); }
    .tree-label { color: var(--ink-soft); flex: 1; }
    .tree-row.root .tree-label { font-weight: 700; color: var(--accent); font-size: 14px; }
    .tree-row.branch .tree-label { font-weight: 600; color: var(--ink); }
    .tree-row.leaf .tree-label { font-weight: 500; }
    .tree-row.detail-leaf .tree-label { color: var(--accent); }
    .tree-children.hidden { display: none; }
    .tree-detail-content {
      margin-left: 16px;
      border-left: 2px solid var(--accent-soft);
      padding-left: 12px;
      padding-top: 4px;
      padding-bottom: 8px;
    }
    .detail-text {
      background: var(--bg3);
      color: var(--ink);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.7;
      border: 1px solid var(--rule);
    }
    .tree-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .tree-badge.badge-core {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
    }
    .tree-badge.badge-source {
      background: #dbeafe;
      color: #2563eb;
    }
    .tree-badge.badge-recommend {
      background: #e2e8f0;
      color: #64748b;
    }
    .tree-badge.badge-ai {
      background: linear-gradient(135deg, #ede9fe, #f3e8ff);
      color: #7c3aed;
    }
    .tree-dot.ai { background: linear-gradient(135deg, #7c3aed, #a855f7); }

    /* ===== KNOWLEDGE GRAPH ===== */
    .graph-container {
      position: relative;
      width: 100%;
      height: 440px;
      background: radial-gradient(circle at 50% 50%, #f8fafc 0%, #eef2f7 100%);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .graph-svg {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    .graph-node {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      user-select: none;
      z-index: 2;
    }
    .graph-node:hover { transform: translate(-50%, -50%) scale(1.12); z-index: 5; }
    .graph-node-circle {
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      text-align: center;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15);
      border: 2.5px solid #fff;
      transition: all 0.2s;
    }
    .graph-node.core .graph-node-circle {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      width: 90px; height: 90px; font-size: 13px; line-height: 1.2;
      box-shadow: 0 4px 14px rgba(13,148,136,0.4);
      padding: 4px;
    }
    .graph-node.branch .graph-node-circle {
      width: 48px; height: 48px;
    }
    .graph-node.b1 .graph-node-circle { background: linear-gradient(135deg, #0d9488, #14b8a6); }
    .graph-node.b2 .graph-node-circle { background: linear-gradient(135deg, #4f46e5, #6366f1); }
    .graph-node.b3 .graph-node-circle { background: linear-gradient(135deg, #d97706, #f59e0b); }
    .graph-node.b4 .graph-node-circle { background: linear-gradient(135deg, #db2777, #ec4899); }
    .graph-node.leaf .graph-node-circle {
      background: linear-gradient(135deg, #64748b, #94a3b8);
      width: 30px; height: 30px;
    }
    .graph-node-label {
      margin-top: 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-soft);
      background: rgba(255,255,255,0.9);
      padding: 1px 6px;
      border-radius: 4px;
      white-space: nowrap;
      max-width: 100px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .graph-node.core .graph-node-label { font-size: 13px; font-weight: 700; color: var(--accent); max-width: none; background: none; padding: 0; margin-top: 6px; }
    .graph-legend {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(255,255,255,0.92);
      border: 1px solid var(--rule);
      border-radius: var(--radius-xs);
      padding: 8px 10px;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 3;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; color: var(--muted); }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
    .legend-line { width: 16px; height: 2px; }
    .graph-node.ai-derived .graph-node-circle {
      background: linear-gradient(135deg, #7c3aed, #a855f7) !important;
    }
    .graph-container { overflow: hidden; cursor: grab; }
    .graph-container:active { cursor: grabbing; }
    .graph-scale-wrap {
      position: absolute;
      left: 0; top: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .graph-scale-wrap .graph-svg,
    .graph-scale-wrap .graph-node {
      pointer-events: auto;
    }
    .graph-zoom-controls {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 10;
      background: rgba(255,255,255,0.92);
      border: 1px solid var(--rule);
      border-radius: var(--radius-xs);
      padding: 4px;
    }
    .graph-zoom-btn {
      width: 28px;
      height: 28px;
      border: none;
      background: var(--bg3);
      border-radius: 4px;
      font-size: 16px;
      font-weight: 700;
      color: var(--ink-soft);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      line-height: 1;
    }
    .graph-zoom-btn:hover { background: var(--accent-soft); color: var(--accent); }
    .graph-zoom-btn:active { transform: scale(0.95); }
    .graph-zoom-reset { font-size: 14px; }
    .detail-section {
      margin-bottom: 14px;
    }
    .detail-section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 6px;
    }
    .detail-section-body {
      font-size: 13px;
      color: var(--ink-soft);
      line-height: 1.6;
      background: var(--bg3);
      padding: 10px 12px;
      border-radius: var(--radius-xs);
    }
    .graph-btn {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: var(--radius-xs);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .graph-btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
    }
    .graph-btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.3);
    }
    .graph-btn-secondary {
      background: var(--bg3);
      color: var(--ink);
      border: 1px solid var(--rule);
    }
    .graph-btn-secondary:hover {
      background: var(--bg-hover);
    }

    /* ===== EXPERT COMMENTARY ===== */
    .expert-card {
      border: 1px solid var(--rule);
      border-radius: var(--radius-sm);
      margin-bottom: 10px;
      overflow: hidden;
      transition: box-shadow 0.15s;
    }
    .expert-card:last-child { margin-bottom: 0; }
    .expert-card:hover { box-shadow: var(--shadow); }
    .expert-head {
      padding: 11px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      background: var(--bg);
      transition: background 0.12s;
    }
    .expert-head:hover { background: var(--bg3); }
    .expert-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      background: var(--accent2-soft);
    }
    .expert-info { flex: 1; }
    .expert-role { font-size: 13px; font-weight: 700; color: var(--ink); }
    .expert-tag { font-size: 11px; color: var(--muted); }
    .expert-toggle {
      width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted);
      transition: transform 0.2s;
      font-size: 12px;
    }
    .expert-card.open .expert-toggle { transform: rotate(180deg); }
    .expert-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
      padding: 0 14px;
    }
    .expert-card.open .expert-body { max-height: 600px; padding: 0 14px 14px; }
    .expert-body-inner { font-size: 13px; line-height: 1.7; color: var(--ink-soft); padding-top: 4px; border-top: 1px dashed var(--rule); }
    .expert-body-inner p { margin-bottom: 8px; }
    .expert-body-inner p:last-child { margin-bottom: 0; }
    .expert-quote {
      border-left: 3px solid var(--accent);
      padding: 4px 0 4px 10px;
      color: var(--accent);
      font-style: italic;
      font-weight: 600;
      margin: 6px 0;
    }

    /* ===== EXTENDED READING ===== */
    .read-card {
      border: 1px solid var(--rule);
      border-radius: var(--radius-sm);
      padding: 13px 15px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.15s;
      background: var(--bg);
    }
    .read-card:last-child { margin-bottom: 0; }
    .read-card:hover { border-color: var(--accent2); box-shadow: 0 2px 8px rgba(79,70,229,0.1); transform: translateY(-1px); }
    .read-q {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 8px;
      line-height: 1.45;
      display: flex;
      gap: 6px;
    }
    .read-q-mark {
      color: var(--accent2);
      flex-shrink: 0;
      font-weight: 800;
    }
    .read-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .read-expert-badge {
      font-size: 11px;
      padding: 2px 8px;
      background: var(--accent2-soft);
      color: var(--accent2);
      border-radius: 10px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .read-time {
      font-size: 11px;
      color: var(--muted-2);
    }
    .read-preview {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ===== MATCH INFO ===== */
    .match-section { margin-bottom: 18px; }
    .match-section:last-child { margin-bottom: 0; }
    .match-section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }
    .score-card {
      background: linear-gradient(135deg, #0d9488 0%, #4f46e5 100%);
      border-radius: var(--radius-sm);
      padding: 18px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-around;
    }
    .score-team {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex: 1;
    }
    .score-team-flag { font-size: 32px; }
    .score-team-name { font-size: 14px; font-weight: 600; }
    .score-num {
      font-size: 38px;
      font-weight: 800;
      line-height: 1;
    }
    .score-vs {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 0 16px;
    }
    .score-vs-text { font-size: 11px; opacity: 0.8; letter-spacing: 0.1em; }
    .score-status { font-size: 12px; font-weight: 600; background: rgba(255,255,255,0.2); padding: 3px 10px; border-radius: 10px; }
    .timeline {
      position: relative;
      padding-left: 24px;
    }
    .timeline::before {
      content: '';
      position: absolute;
      left: 7px;
      top: 4px;
      bottom: 4px;
      width: 2px;
      background: var(--rule);
    }
    .timeline-item {
      position: relative;
      padding: 8px 0 8px 12px;
      font-size: 13px;
    }
    .timeline-item::before {
      content: '';
      position: absolute;
      left: -22px;
      top: 13px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      border: 2.5px solid #fff;
      box-shadow: 0 0 0 2px var(--accent);
    }
    .timeline-time { font-weight: 700; color: var(--accent); margin-right: 8px; }
    .timeline-event { color: var(--ink-soft); }
    .timeline-event strong { color: var(--ink); }
    .bracket {
      display: flex;
      gap: 20px;
      align-items: stretch;
      justify-content: center;
      padding: 8px 0;
      flex-wrap: wrap;
    }
    .bracket-round {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      gap: 16px;
      min-width: 150px;
    }
    .bracket-round-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-align: center;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .bracket-match {
      border: 1px solid var(--rule);
      border-radius: var(--radius-xs);
      overflow: hidden;
      background: var(--bg);
      font-size: 12px;
    }
    .bracket-match.done { border-color: var(--accent); }
    .bracket-match.pending { border-style: dashed; opacity: 0.7; }
    .bracket-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 10px;
      gap: 8px;
    }
    .bracket-row.winner { background: var(--accent-soft); font-weight: 700; color: var(--accent); }
    .bracket-row:first-child { border-bottom: 1px solid var(--rule); }
    .bracket-team { flex: 1; }
    .bracket-score { font-weight: 700; }
    .bracket-connectors {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 30px;
    }
    .stats-compare {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .stat-row {
      display: grid;
      grid-template-columns: 60px 1fr 60px;
      align-items: center;
      gap: 10px;
    }
    .stat-label { font-size: 12px; color: var(--muted); text-align: center; }
    .stat-val { font-size: 14px; font-weight: 700; }
    .stat-val.left { text-align: right; color: var(--accent); }
    .stat-val.right { text-align: left; color: var(--accent2); }
    .stat-bar-wrap {
      display: flex;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      background: var(--bg3);
    }
    .stat-bar-left { background: var(--accent); }
    .stat-bar-right { background: var(--accent2); }

    /* ===== MODAL ===== */
    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.55);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.18s;
    }
    .modal-mask.show { display: flex; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      background: var(--bg2);
      border-radius: var(--radius);
      width: 100%;
      max-width: 640px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-xl);
      animation: slideUp 0.22s;
    }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--rule);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .modal-title { font-size: 16px; font-weight: 700; }
    .modal-close {
      width: 30px; height: 30px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted);
      font-size: 18px;
      transition: background 0.12s;
    }
    .modal-close:hover { background: var(--bg3); color: var(--ink); }
    .modal-body {
      padding: 20px;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.75;
      color: var(--ink-soft);
    }
    .modal-body h4 { font-size: 15px; margin: 14px 0 8px; color: var(--ink); }
    .modal-body h4:first-child { margin-top: 0; }
    .modal-body p { margin-bottom: 10px; }
    .modal-body .expert-quote { margin: 12px 0; }

    /* ===== KNOWLEDGE BASE OVERLAY ===== */
    .kb-overlay {
      position: absolute;
      inset: 0;
      background: var(--bg);
      z-index: 100;
      display: none;
      flex-direction: column;
      padding: 24px;
      overflow-y: auto;
    }
    .kb-overlay.show { display: flex; }
    .kb-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .kb-title { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .kb-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }
    .kb-item {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      padding: 16px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .kb-item:hover { border-color: var(--accent2); transform: translateY(-2px); box-shadow: var(--shadow-lg); }
    .kb-item-icon { font-size: 24px; margin-bottom: 8px; }
    .kb-item-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
    .kb-item-desc { font-size: 12px; color: var(--muted); line-height: 1.5; }
    .kb-item-meta { font-size: 11px; color: var(--muted-2); margin-top: 8px; }
    .kb-item-category { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; margin-top: 8px; display: inline-block; }
    .kb-item-category.体育 { background: #dcfce7; color: #15803d; }
    .kb-item-category.科技 { background: #e0e7ff; color: #4338ca; }
    .kb-item-category.财经 { background: #fef3c7; color: #b45309; }
    .kb-item-category.政策 { background: #fce7f3; color: #be185d; }
    .kb-item-category.文化 { background: #f3e8ff; color: #7c3aed; }
    .kb-filter-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .kb-filter-tab {
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.15s;
      background: var(--bg2);
      color: var(--muted);
      border: 1px solid var(--rule);
    }
    .kb-filter-tab:hover { background: var(--bg3); color: var(--ink); }
    .kb-filter-tab.active {
      background: var(--accent2);
      color: #fff;
      border-color: var(--accent2);
    }

    /* ===== LOADING / ANALYSIS ===== */
    .analyzing-mask {
      position: absolute;
      inset: 0;
      background: rgba(247,249,252,0.92);
      backdrop-filter: blur(2px);
      z-index: 200;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }
    .analyzing-mask.show { display: flex; }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid var(--rule);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .analyzing-text {
      font-size: 14px;
      color: var(--muted);
      font-weight: 600;
    }
    .analyzing-steps {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
      color: var(--muted-2);
    }
    .analyzing-step { transition: color 0.3s, opacity 0.3s; opacity: 0.5; }
    .analyzing-step.done { opacity: 1; color: var(--accent); }
    .analyzing-step.done::before { content: '✓ '; }

    /* ===== MOBILE TAB BAR ===== */
    .mobile-tabbar {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 56px;
      background: var(--bg2);
      border-top: 1px solid var(--rule);
      z-index: 60;
      justify-content: space-around;
      align-items: center;
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 10px;
      color: var(--muted);
      padding: 6px 12px;
    }
    .tab-item.active { color: var(--accent); }
    .tab-icon { font-size: 18px; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 1200px) {
      .card-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 900px) {
      .card-grid { grid-template-columns: 1fr; }
      .card.span-full { grid-column: 1; }
    }
    @media (max-width: 640px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: 56px 1fr;
      }
      .sidebar {
        display: none;
      }
      .main {
        padding: 14px 12px 70px;
      }
      .card-grid { grid-template-columns: 1fr; gap: 12px; }
      .news-brief { flex-direction: column; gap: 12px; padding: 14px; }
      .news-brief-emoji { width: 44px; height: 44px; font-size: 24px; }
      .news-brief-title { font-size: 16px; }
      .mobile-tabbar { display: flex; }
      .graph-container { height: 360px; }
      .bracket { flex-direction: column; align-items: center; }
      .bracket-connectors { display: none; }
      .header-nav .nav-btn { padding: 7px 10px; font-size: 13px; }
      .logo-sub { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- HEADER -->
    <header class="app-header">
      <div class="logo">
        <div class="logo-mark">智</div>
        <span>InfoNexus AI</span>
        <span class="logo-sub">智识中枢</span>
      </div>
      <nav class="header-nav">
        <button class="nav-btn active" data-view="hotspot" onclick="switchView('hotspot')">热点</button>
        <button class="nav-btn" data-view="kb" onclick="switchView('kb')">知识库</button>

    <!-- SIDEBAR -->

      <div class="news-brief" id="newsBrief"></div>

      <!-- CARD GRID -->
      <div class="card-grid" id="cardGrid">
        <div class="card" id="cardTree">
          <div class="card-header">
            <div class="card-title">
              <div class="card-title-icon icon-tree">🌳</div>
              知识树
            </div>
          </div>
          <div class="card-body" id="treeBody">
            <div class="card-empty">
              <div class="card-empty-icon">🌳</div>
              <div class="card-empty-text">点击「生成知识树」开始分析</div>

          </div>

          </div>
        </div>

        <div class="card" id="cardExpert">
          <div class="card-header">
            <div class="card-title">
              <div class="card-title-icon icon-expert">🎤</div>
              专家解读
            </div>
          </div>
          <div class="card-body" id="expertBody">
            <div class="card-empty">
              <div class="card-empty-icon">🎤</div>
              <div class="card-empty-text">点击「生成知识树」获取专家观点</div>
            </div>
          </div>
        </div>

        <div class="card" id="cardRead">

              <div class="card-title-icon icon-read">📖</div>
              延伸阅读
            </div>
          </div>
          <div class="card-body" id="readBody">
            <div class="card-empty">
              <div class="card-empty-icon">📖</div>
              <div class="card-empty-text">点击「生成知识树」展开深度问答</div>
            </div>
          </div>
        </div>

        <div class="card span-full" id="cardMatch" style="display:none;">
          <div class="card-header">
            <div class="card-title">
              <div class="card-title-icon icon-match">🏆</div>
              赛事信息
            </div>
          </div>
          <div class="card-body" id="matchBody"></div>
        </div>
      </div>

      <!-- ANALYZING MASK -->
      <div class="analyzing-mask" id="analyzingMask">
        <div class="spinner"></div>
        <div class="analyzing-text" id="analyzingText">正在解析新闻内容...</div>
        <div class="analyzing-steps" id="analyzingSteps">
          <div class="analyzing-step" data-step="1">解析新闻核心要素</div>
          <div class="analyzing-step" data-step="2">构建知识树结构</div>
          <div class="analyzing-step" data-step="3">生成知识图谱节点</div>
          <div class="analyzing-step" data-step="4">调度专家智能体解读</div>
          <div class="analyzing-step" data-step="5">编排延伸阅读内容</div>
        </div>
      </div>

      <!-- KB OVERLAY -->
      <div class="kb-overlay" id="kbOverlay">
        <div class="kb-header">
          <div class="kb-title">📚 个人知识库</div>
          <button class="btn btn-ghost" onclick="switchView('hotspot')">← 返回热点</button>
        </div>
        <div class="kb-filter-tabs" id="kbFilterTabs"></div>
        <div class="kb-grid" id="kbGrid"></div>

    </main>

  <!-- MOBILE TAB BAR -->

        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script>
    /* ========================================================
       NEWS DATA

          {
            question: 'WAIC 2026为何将"具身智能"列为核心议题？',

            readTime: '3分钟阅读',
            preview: '具身智能（Embodied AI）被列为本届WAIC核心议题，标志着AI产业从"数字智能"向"物理智能"的范式扩展。2026年之所以成为关键节点，有三大驱动力同时成熟...',
            article: '<h4>具身智能的元年：为什么是2026？</h4><p>具身智能（Embodied AI）被列为本届WAIC核心议题，标志着AI产业从"数字智能"向"物理智能"的范式扩展。2026年之所以成为关键节点，有三大驱动力同时成熟。</p><p><strong>第一，大模型提供"通用大脑"。</strong>多模态大模型使机器人首次具备开放场景的理解与推理能力。过去机器人只能执行预设程序，现在则可通过视觉-语言指令完成泛化任务。</p><div class="expert-quote">具身智能的本质，是让AI从"看懂世界"进化为"改造世界"。</div><p><strong>第二，硬件成本曲线下探。</strong>人形机器人核心部件（减速器、力矩传感器、空心杯电机）成本较2023年下降45%，使整机BOM成本进入15万元区间，为商业化铺平道路。</p><p><strong>第三，场景验证取得突破。</strong>汽车产线、仓储物流、家庭服务等场景已有数十台规模的小批量验证，故障率与任务完成率达到商业化门槛。</p><p>本届WAIC预计将有超过20款人形机器人首发，其中至少3款宣布量产计划。这意味着具身智能正式从"技术验证"进入"产业落地"阶段。</p>'

          {
            question: 'AI for Science距离诺贝尔奖还有多远？',

            readTime: '4分钟阅读',
            preview: 'AI for Science已成为本届WAIC的重点方向。从AlphaFold到材料发现AI，人工智能正在重塑科学研究的范式。但距离真正获得诺贝尔奖级别的认可，仍需跨越三道门槛...',
            article: '<h4>AI for Science：新一轮科学革命的前夜</h4><p>AI for Science已成为本届WAIC的重点方向。从AlphaFold到材料发现AI，人工智能正在重塑科学研究的范式。但距离真正获得诺贝尔奖级别的认可，仍需跨越三道门槛。</p><p><strong>第一道门槛：可解释性。</strong>诺贝尔奖历来青睐"机制清晰"的发现，而AI模型本质是黑盒。AlphaFold虽预测了2亿个蛋白质结构，但其预测结果缺乏物理化学层面的因果解释。这一问题需通过"可解释AI"与"物理先验嵌入"逐步解决。</p><div class="expert-quote">科学的终极目标不是预测，而是理解——AI必须从"预测者"进化为"解释者"。</div><p><strong>第二道门槛：实验验证闭环。</strong>AI预测的结果必须经湿实验或物理实验验证。目前AI for Science的最大瓶颈不是模型能力，而是自动化实验设施的吞吐量。本届WAIC将有多家"自动驾驶实验室"成果发布，正是为打通这一闭环。</p><p><strong>第三道门槛：范式革命。</strong>真正的诺奖级贡献需要改变科学家的工作方式，如同PCR之于分子生物学。AI for Science目前仍处于"辅助工具"阶段，尚未形成独立的研究范式。但当AI能自主提出假设、设计实验、验证理论时，科学发现的速率将提升10倍以上。</p><p>乐观估计，未来5-10年内，AI for Science将在材料、药物、气候领域催生至少3项诺贝尔奖级成果。</p>'

          {
            question: '国产开源大模型真的能超越闭源吗？',
            expertRole: 'AI模型架构工程师', expertIcon: '⚙️',
            readTime: '3分钟阅读',
            preview: '本届WAIC上，多家国产开源模型在权威基准上逼近甚至超越闭源模型，引发"开源超越闭源"的讨论。这一现象需要辩证看待——超越是局部的、阶段性的，而非全面的、终局性的...',
            article: '<h4>开源vs闭源：一场没有终局的竞合</h4><p>本届WAIC上，多家国产开源模型在权威基准上逼近甚至超越闭源模型，引发"开源超越闭源"的讨论。这一现象需要辩证看待——超越是局部的、阶段性的，而非全面的、终局性的。</p><p>从技术层面，开源模型的追赶速度确实惊人。原因有三：一是开源社区的力量——全球开发者的集体智慧加速了模型优化；二是算法的透明化——开源模型之间的相互借鉴使最佳实践快速扩散；三是算力民主化——云厂商的普惠算力降低了训练门槛。</p><div class="expert-quote">开源的本质不是"免费"，而是"集体进化"——它让创新从零和博弈变为正和游戏。</div><p>但闭源模型仍有三大护城河：数据壁垒（独家高质量数据）、算力壁垒（万卡集群的持续投入）、以及工程壁垒（RLHF与对齐工程的know-how）。</p><p>更准确的判断是：开源与闭源将长期共存，形成"开源追赶、闭源突破"的动态格局。开源模型推动技术民主化，闭源模型探索能力边界。对开发者而言，选择应基于场景——通用场景用开源降本，前沿场景用闭源提效。</p><p>中国开源模型的真正机会，在于中文语料优势与垂直行业深耕。在政务、金融、医疗等中文密集场景，国产开源模型有望建立结构性优势。</p>'

            preview: '新能源汽车已与锂电池、光伏并称为出口"新三样"，成为拉动外贸增长的核心动力。这一现象背后，是中国汽车产业在全球价值链中的位置跃迁...',
            article: '<h4>新三样崛起：中国汽车的全球价值链跃迁</h4><p>新能源汽车已与锂电池、光伏并称为出口"新三样"，成为拉动外贸增长的核心动力。这一现象背后，是中国汽车产业在全球价值链中的位置跃迁。</p><p>从数据看，2026年上半年新能源汽车出口同比增长42%，占汽车出口总量的比重从2023年的28%提升至41%。出口均价从2.1万美元提升至3.4万美元，反映品牌溢价能力的显著提升。</p><div class="expert-quote">中国汽车出口的爆发，不是价格战的结果，而是技术代差的红利。</div><p>驱动这一增长的有三大底层逻辑：</p><p><strong>第一，三电技术代差。</strong>中国动力电池能量密度领先海外1-2代，成本优势达20%。智能驾驶算法在数据规模与迭代速度上形成正反馈。</p><p><strong>第二，制造规模效应。</strong>中国新能源车年产能已超2000万辆，规模摊薄使单车成本持续下探，海外市场定价空间充裕。</p><p><strong>第三，本地化布局加速。</strong>比亚迪、奇瑞、上汽等车企在东南亚、欧洲、拉美建设KD工厂，规避贸易壁垒的同时深化本地供应链。这种"产品出海+产能出海"的双轨模式，正在重塑全球汽车产业格局。</p>'

            readTime: '4分钟阅读',
            preview: 'RCEP生效四年来，区域贸易创造效应持续释放，成为中国外贸增长的重要制度支撑。但红利的持续性，取决于三个变量的演进...',
            article: '<h4>RCEP红利的下半场：从规则红利到产业链红利</h4><p>RCEP生效四年来，区域贸易创造效应持续释放，成为中国外贸增长的重要制度支撑。但红利的持续性，取决于三个变量的演进。</p><p><strong>第一，关税减让的渐进性。</strong>RCEP关税减让采用渐进式降税模式，90%以上货物贸易最终实现零关税，但降税周期长达10-20年。这意味着未来10年仍有持续的关税红利释放空间。中国与东盟的零关税产品比例将从目前的67%提升至2035年的95%。</p><div class="expert-quote">RCEP的真正价值，不在关税减让本身，而在原产地累积规则带来的产业链整合。</div><p><strong>第二，原产地累积规则的深化。</strong>RCEP区域累积规则使中间品在15国范围内均可累积计算增值，这显著降低了企业享受优惠关税的门槛。目前仅30%的企业充分利用了这一规则，未来5年利用率有望提升至60%以上。</p><p><strong>第三，规则升级的可能性。</strong>RCEP将于2026年启动升级谈判，预计纳入数字经济、电子商务、知识产权等新议题。这将使RCEP从"传统贸易协定"升级为"现代经贸规则"，红利的性质将从"关税红利"转向"制度红利"。</p><p>对企业而言，RCEP红利的利用不应停留在"申请原产地证"层面，而应从供应链设计阶段就植入区域累积思维，构建"中国研发+东盟制造+全球销售"的优化布局。</p>'

            body: '<p>《扩大消费"十五五"规划》是新中国成立以来首个以"扩大消费"为主题的五年专项规划，其战略重量可见一斑。规划的核心逻辑，是从"投资驱动"向"消费驱动"的增长范式切换。</p><div class="expert-quote">消费不是经济增长的"结果"，而是高质量发展的"引擎"——这是规划传递的根本性认知转变。</div><p>规划有三个突破点：一是首次将"消费规模翻番"作为硬性指标，对应年均6.5%左右的名义增速；二是首次明确服务消费占比45%的目标，引导消费结构升级；三是首次系统性设计"财税+金融+土地+数据"的多元政策工具箱，打破了以往消费政策"碎片化"的局限。</p><p>规划的落地关键，在于地方政府考核体系的调整——从"GDP导向"转向"消费与居民收入导向"。</p>'

            article: '<h4>从"三驾马车"到"单一引擎"：消费的历史性上位</h4><p>《扩大消费"十五五"规划》首次将"2030年社会消费品零售总额翻番"作为硬性指标，这一突破背后，是发展范式的根本性转向。</p><p>从历史脉络看，中国经济对消费的认知经历了三个阶段：</p><p><strong>第一阶段（2000-2010）：</strong>消费是"三驾马车"之一，与投资、出口并列，但实际权重最低。政策重心在投资拉动与出口创汇。</p><p><strong>第二阶段（2011-2020）：</strong>消费被定位为"基础性作用"，社零总额在2016年超越美国成为全球第一，但政策仍以"短期刺激"为主（如家电下乡、汽车补贴）。</p><div class="expert-quote">当出口与投资的边际收益递减，消费不是"可选项"，而是"必选项"——这是规划的战略清醒。</div><p><strong>第三阶段（2021至今）：</strong>消费上升为"主引擎"地位。2025年消费对GDP增长的贡献率已达65%，但仍存在"潜力未释放、结构待优化、机制不健全"三大问题。"消费翻番"目标的提出，正是为了用硬指标倒逼改革。</p><p>这一目标的可行性，建立在中国14亿人口的超大规模市场、4亿中等收入群体的消费升级潜力，以及数字经济对消费场景的重塑之上。但要实现翻番，关键不在"刺激消费"，而在"释放消费"——通过收入分配改革、公共服务均等化、户籍制度破冰，让被抑制的消费潜力真正流动起来。</p>'

            article: '<h4>银发经济：被低估的十万亿级蓝海</h4><p>《扩大消费"十五五"规划》将"银发经济"列为重点领域，这一选择基于中国人口结构的深刻变迁。2026年，中国60岁以上人口已突破3.2亿，占总人口的22.8%，正式进入"中度老龄化"社会。</p><p>但银发经济的潜力远未被充分认知。三大误判导致市场长期低估这一赛道：</p><p><strong>误判一：老年人"不愿消费"。</strong>实际上，新一代"新老人"（60后）经历了改革开放的完整红利期，财富积累远超前辈。其消费意愿不是"低"，而是"未被满足"——适老化产品与服务的供给严重不足。</p><div class="expert-quote">银发经济的痛点不是"没钱花"，而是"没处花"——这是供给侧的问题，不是需求侧的问题。</div><p><strong>误判二：银发市场"只在地摊与保健品"。</strong>实际上，银发消费正在向文旅、康养、教育、智能硬件、数字内容等高附加值领域扩散。2025年银发文旅消费同比增长38%，银发数字内容消费增长52%。</p><p><strong>误判三：银发经济是"成本"而非"机会"。</strong>实际上，日本经验表明，银发经济成熟后可贡献GDP的15%以上。中国2030年银发经济规模预计达12万亿元，相当于当前社零总额的20%。</p><p>规划的落地，需配套"适老化改造"的强制性标准、银发消费金融的创新产品、以及康养护理人才的规模化培养。这不是一个细分赛道，而是一个时代级机会。</p>'

            article: '<h4>数字消费：从渠道变革到范式重构</h4><p>《扩大消费"十五五"规划》将"数字消费"列为四大方向之一，这并非简单的"线上购物"概念，而是对消费范式整体的数字化重构。</p><p>数字消费的深层影响，体现在三个维度：</p><p><strong>维度一：时空边界的消解。</strong>直播电商、即时零售、跨境电商使消费不再受营业时间与地理空间的限制。2025年即时零售规模突破1.2万亿，"30分钟达"成为新常态。这将传统"集中式消费"转化为"分布式消费"，显著提升了消费频次与总量。</p><div class="expert-quote">数字消费的本质，是用"信息流"重构"商品流"——效率的提升只是表象，体验的重塑才是内核。</div><p><strong>维度二：决策链路的重塑。</strong>内容种草、KOL推荐、AI导购使消费决策从"理性比价"转向"情感触发"。这意味着品牌营销、内容生产、AI推荐算法成为消费价值链的核心环节。</p><p><strong>维度三：消费与生产的融合。</strong>C2M（消费者直达工厂）、按需定制、预售模式使消费数据反向定义生产。这打破了"先生产后销售"的传统链路，使消费从"价值链末端"前移至"价值链起点"。</p><p>规划的落地，关键在于数字基础设施的普惠化——让中小商户、县域消费者、银发群体都能享受数字消费的红利，避免"数字鸿沟"加剧消费分化。</p>'

            readTime: '3分钟阅读',
            preview: '长江1000A对标的是CFM LEAP-1C与普惠GTF，从公开参数看，两者在推力等级与涵道比上已处于同一量级。但发动机的评价维度远不止纸面参数...',
            article: '<h4>长江1000A vs LEAP-1C：差距与追赶</h4><p>长江1000A对标的是CFM LEAP-1C与普惠GTF，从公开参数看，两者在推力等级与涵道比上已处于同一量级。但发动机的评价维度远不止纸面参数。</p><p><strong>推力与效率：</strong>长江1000A推力约12.5-13吨，与LEAP-1C的13吨级相当。涵道比约10:1，也处于同一代际。油耗水平据称与LEAP-1C差距在5%以内，这在首代产品中已是优秀表现。</p><div class="expert-quote">发动机的竞争不是"参数竞赛"，而是"耐久竞赛"——2万小时的可靠性才是商业成功的真正门槛。</div><p><strong>可靠性差距：</strong>LEAP系列已积累超过1亿飞行小时的运营数据，其故障率曲线已进入成熟期。长江1000A的飞行小时数据仍为零，需经历至少5年的运营积累才能达到商业置信度。</p><p><strong>维护体系：</strong>CFM拥有全球最完善的发动机维护网络，备件供应周期72小时。长江1000A需从零构建维护生态，包括维修手册、培训体系、备件仓储等，这一过程至少需要3-5年。</p><p>综合判断，长江1000A在技术参数上已"追平"，但在可靠性验证与维护生态上仍有3-5年的差距期。这恰好与装机试运行的周期吻合。</p>'

            article: '<h4>第二次智能手机革命：从触控到对话</h4><p>AI原生手机被视为继iPhone之后智能手机的第二次范式革命。但要真正颠覆传统格局，需要跨越"体验阈值"——即AI交互的效率必须显著超越触控交互，而非仅仅是"另一种选择"。</p><p><strong>历史启示：</strong>iPhone之所以颠覆诺基亚，不是因为触屏比键盘"更酷"，而是触屏使复杂操作（地图缩放、网页浏览）的效率提升了10倍。AI原生手机需要找到类似的"效率10倍场景"。</p><div class="expert-quote">颠覆从来不是因为"更好"，而是因为"不同维度"——AI手机不需要在触控的维度上做得更好，而需要在触控无法触及的维度上创造价值。</div><p><strong>潜在突破场景：</strong>一是复杂信息整合——"帮我比较三款手机的参数并给出推荐"比手动切换App效率高100倍；二是跨应用操作——"把昨天开会的内容整理成邮件发给张总"涉及日历、录音、邮件三个App的串联；三是个性化主动服务——基于上下文主动推送而非被动响应。</p><p>但短期看，AI原生手机更可能作为"高端细分市场"存在，而非全面替代传统手机。市场格局将呈现"传统手机为主、AI手机为高端增量"的双轨并行态势。</p>'

        next.classList.remove('hidden');
        if (toggle) {
          toggle.classList.add('open');
          toggle.textContent = '▼';
        }
      } else {
        var idx = treeStates[newsId].expandedNodes.indexOf(nodePath);
        if (idx !== -1) {
          treeStates[newsId].expandedNodes.splice(idx, 1);
        }
        next.classList.add('hidden');
        if (toggle) {
          toggle.classList.remove('open');
          toggle.textContent = '▶';
        }
      }
    }
    function toggleDetailLeaf(row) {
      var next = row.nextElementSibling;
      var toggle = row.querySelector('.tree-toggle');
      var nodePath = row.getAttribute('data-node-path');
      var newsId = NEWS[currentNewsIndex].id;
      if (!next || !next.classList) return;

      if (!treeStates[newsId]) {
        treeStates[newsId] = { expandedNodes: [], generatedChildren: {} };
      }

      if (next.classList.contains('hidden')) {
        next.classList.remove('hidden');
        if (treeStates[newsId].expandedNodes.indexOf(nodePath) === -1) {
          treeStates[newsId].expandedNodes.push(nodePath);
        }
        if (toggle) {
          toggle.classList.add('open');
          toggle.textContent = '▼';
        }
      } else {
        var idx = treeStates[newsId].expandedNodes.indexOf(nodePath);
        if (idx !== -1) {
          treeStates[newsId].expandedNodes.splice(idx, 1);
        }
        next.classList.add('hidden');
        if (toggle) {
          toggle.classList.remove('open');
          toggle.textContent = '📌';
        }
      }
    }
    function getTreeDepth(row) {
      var depth = 0;
      var parent = row.parentElement;
      while (parent) {
        if (parent.classList && parent.classList.contains('tree-children')) {
          depth++;
        }
        parent = parent.parentElement;
      }
      return depth;
    }

    /* ========================================================
       RENDER: KNOWLEDGE GRAPH
    ======================================================== */
    var graphAllNodes = [];
    var graphLines = [];
    var graphContainerW = 400;
    var graphContainerH = 440;
    var favoriteNodes = {};
    var graphZoom = 1;
    var graphPan = { x: 0, y: 0 };
    var graphIsDragging = false;
    var graphDragStart = { x: 0, y: 0 };
    var graphDragMoved = false;

    function renderGraph() {
      var n = NEWS[currentNewsIndex];
      var g = n.graph;
      var body = document.getElementById('graphBody');
      graphContainerW = body.clientWidth || 400;
      graphContainerH = 440;
      // 重置缩放状态
      graphZoom = 1;
      graphPan = { x: 0, y: 0 };

      function px(pct, dim) { return pct / 100 * dim; }

      graphAllNodes = [];
      graphLines = [];

      graphAllNodes.push({
        label: g.core.label,
        x: px(g.core.x, graphContainerW),
        y: px(g.core.y, graphContainerH),
        type: 'core',
        sourceType: '核心主题',
        explanation: g.core.label + '是本新闻报道的核心议题，所有知识分支均围绕其展开。它是理解整条新闻的关键锚点。',
        evidence: '来源于新闻标题和摘要的核心提取，经语义分析确认。',
        importance: '掌握核心主题是深入理解新闻的第一步，所有衍生知识都以此为根基。'
      });

      for (var i = 0; i < g.branches.length; i++) {
        var b = g.branches[i];
        graphAllNodes.push({
          id: b.id,
          label: b.label,
          x: px(b.x, graphContainerW),
          y: px(b.y, graphContainerH),
          type: 'branch',
          cls: b.cls,
          sourceType: '原文出现',
          explanation: b.label + '是核心主题的关键维度之一，从这个角度可以深入理解新闻的某个重要方面。',
          evidence: '在新闻原文中有明确提及，属于新闻直接覆盖的内容范畴。',
          importance: '分支节点帮助我们从多个维度立体地理解核心主题，避免片面认知。'
        });
      }

      for (var j = 0; j < g.leaves.length; j++) {
        var lf = g.leaves[j];
        var leafSource = (j % 2 === 0) ? '原文出现' : '系统推荐';
        graphAllNodes.push({
          label: lf.label,
          x: px(lf.x, graphContainerW),
          y: px(lf.y, graphContainerH),
          type: 'leaf',
          parent: lf.parent,
          sourceType: leafSource,
          explanation: lf.label + '是一个具体的知识点，是知识网络中的基础单元。',
          evidence: leafSource === '原文出现' ? '该概念在新闻原文中有明确表述。' : '基于新闻主题的语义关联推荐，属于延伸知识点。',
          importance: '叶节点是知识探索的起点，从这里可以深入挖掘更多相关内容。'
        });
      }

      for (var k = 0; k < g.branches.length; k++) {
        var from = graphAllNodes[0];
        var to = graphAllNodes[k + 1];
        graphLines.push({ from: from.label, to: to.label, color: '#cbd5e1', width: 1.5, dashed: false });
      }
      for (var m = 0; m < g.leaves.length; m++) {
        var parent = null;
        var leafNode = graphAllNodes[1 + g.branches.length + m];
        for (var p = 0; p < g.branches.length; p++) {
          if (g.branches[p].id === g.leaves[m].parent) {
            parent = graphAllNodes[p + 1];
            break;
          }
        }
        if (parent && leafNode) {
          graphLines.push({ from: parent.label, to: leafNode.label, color: '#cbd5e1', width: 1, dashed: false });
        }
      }

      if (g.crossLinks && g.crossLinks.length) {
        for (var c = 0; c < g.crossLinks.length; c++) {
          var cl = g.crossLinks[c];
          var fromNode = null, toNode = null;
          for (var q = 0; q < graphAllNodes.length; q++) {
            if (graphAllNodes[q].label === cl.from) fromNode = graphAllNodes[q];
            if (graphAllNodes[q].label === cl.to) toNode = graphAllNodes[q];
          }
          if (!toNode) {
            var vx = cl.toX ? px(cl.toX, graphContainerW) : px(50, graphContainerW);
            var vy = cl.toY ? px(cl.toY, graphContainerH) : px(5, graphContainerH);
            var virtualNode = {
              label: cl.to,
              x: vx,
              y: vy,
              type: 'leaf',
              sourceType: '跨域关联',
              explanation: cl.to + '是一个跨领域概念，与核心主题存在意想不到的关联。',
              evidence: '通过跨领域语义分析发现的关联，体现了知识的网络化特征。',
              importance: '跨域关联往往能带来创新性的洞察，打破思维定势。'
            };
            graphAllNodes.push(virtualNode);
            toNode = virtualNode;
          }
          if (fromNode && toNode) {
            graphLines.push({ from: fromNode.label, to: toNode.label, color: '#d4a017', width: 2, dashed: true });
          }
        }
      }

      // 恢复已保存的AI推导节点
      var newsId = NEWS[currentNewsIndex].id;
      if (graphStates[newsId] && graphStates[newsId].extraNodes) {
        var saved = graphStates[newsId];
        for (var si = 0; si < saved.extraNodes.length; si++) {
          graphAllNodes.push(saved.extraNodes[si]);
        }
        for (var sl = 0; sl < saved.extraLines.length; sl++) {
          graphLines.push({ from: saved.extraLines[sl].from, to: saved.extraLines[sl].to, color: '#a855f7', width: 1.5, dashed: true });
        }
      }

      drawGraph();
    }

    function drawGraph() {
      var body = document.getElementById('graphBody');
      var svgLines = '';
      for (var i = 0; i < graphLines.length; i++) {
        var line = graphLines[i];
        var fromNode = findNodeByLabel(line.from);
        var toNode = findNodeByLabel(line.to);
        if (fromNode && toNode) {
          svgLines += lineSVG(fromNode.x, fromNode.y, toNode.x, toNode.y, line.color, line.width, line.dashed);
        }
      }

      var nodesHTML = '';
      for (var r = 0; r < graphAllNodes.length; r++) {
        var nd = graphAllNodes[r];
        var cls = 'graph-node ' + nd.type;
        if (nd.cls) cls += ' ' + nd.cls;
        if (nd.sourceType === 'AI推导') cls += ' ai-derived';
        var shortLabel = '';
        if (nd.type === 'core') {
          var label = nd.label;
          var mid = Math.ceil(label.length / 2);
          shortLabel = label.slice(0, mid) + '<br>' + label.slice(mid);
        } else if (nd.type === 'branch') {
          shortLabel = nd.label.slice(0, 2);
        }
        nodesHTML +=
          '<div class="' + cls + '" style="left:' + nd.x + 'px;top:' + nd.y + 'px;" onclick="openNodeDetailModal(\'' + escapeQuote(nd.label) + '\')">' +
            '<div class="graph-node-circle">' + shortLabel + '</div>' +
            '<div class="graph-node-label">' + nd.label + '</div>' +
          '</div>';
      }

      var legendHTML = '<div class="graph-legend">' +
        '<div class="legend-item"><span class="legend-dot" style="background:linear-gradient(135deg,#0d9488,#4f46e5);"></span>核心主题</div>' +
        '<div class="legend-item"><span class="legend-dot" style="background:#4f46e5;"></span>原文出现</div>' +
        '<div class="legend-item"><span class="legend-dot" style="background:#64748b;"></span>系统推荐</div>' +
        '<div class="legend-item"><span class="legend-dot" style="background:linear-gradient(135deg,#7c3aed,#a855f7);"></span>AI推导</div>' +
        '<div class="legend-item"><span class="legend-line" style="background:#d4a017;"></span>跨域关联</div>' +
      '</div>';

      var zoomBtnHTML = '<div class="graph-zoom-controls">' +
        '<button class="graph-zoom-btn" onclick="zoomGraph(1.2, true)">+</button>' +
        '<button class="graph-zoom-btn" onclick="zoomGraph(0.8, true)">−</button>' +
        '<button class="graph-zoom-btn graph-zoom-reset" onclick="resetGraphTransform()">⟲</button>' +
      '</div>';

      var scaleStr = 'scale(' + graphZoom + ') translate(' + (graphPan.x / graphZoom) + 'px, ' + (graphPan.y / graphZoom) + 'px)';

      body.innerHTML = '<div class="graph-container">' +
        '<div class="graph-scale-wrap" id="graphScaleWrap" style="transform: ' + scaleStr + '; transform-origin: center center;">' +
          '<svg class="graph-svg" width="' + graphContainerW + '" height="' + graphContainerH + '">' + svgLines + '</svg>' +
          nodesHTML +
        '</div>' +
        legendHTML + zoomBtnHTML +
      '</div>';

      attachGraphInteractions();
    }
    function findNodeByLabel(label) {
      for (var i = 0; i < graphAllNodes.length; i++) {
        if (graphAllNodes[i].label === label) return graphAllNodes[i];
      }
      return null;
    }
    function zoomGraph(factor, useCenter) {
      var body = document.getElementById('graphBody');
      var container = body.querySelector('.graph-container');
      if (!container) return;

      var newZoom = graphZoom * factor;
      newZoom = Math.max(0.3, Math.min(3, newZoom));
      var actualFactor = newZoom / graphZoom;
      graphZoom = newZoom;

      if (!useCenter) {
        var rect = container.getBoundingClientRect();
        var mouseX = graphZoomMouseX - rect.left;
        var mouseY = graphZoomMouseY - rect.top;
        graphPan.x = mouseX - (mouseX - graphPan.x) * actualFactor;
        graphPan.y = mouseY - (mouseY - graphPan.y) * actualFactor;
      }

      applyGraphTransform();
    }
    function resetGraphTransform() {
      graphZoom = 1;
      graphPan = { x: 0, y: 0 };
      applyGraphTransform();
    }
    function applyGraphTransform() {
      var wrap = document.getElementById('graphScaleWrap');
      if (!wrap) return;
      wrap.style.transform = 'scale(' + graphZoom + ') translate(' + (graphPan.x / graphZoom) + 'px, ' + (graphPan.y / graphZoom) + 'px)';
    }
    var graphZoomMouseX = 0;
    var graphZoomMouseY = 0;
    function attachGraphInteractions() {
      var body = document.getElementById('graphBody');
      var container = body.querySelector('.graph-container');
      if (!container) return;

      container.addEventListener('wheel', function(e) {
        e.preventDefault();
        graphZoomMouseX = e.clientX;
        graphZoomMouseY = e.clientY;
        var factor = e.deltaY < 0 ? 1.1 : 0.9;
        zoomGraph(factor, false);
      }, { passive: false });

      container.addEventListener('mousedown', function(e) {
        if (e.target.closest('.graph-node') || e.target.closest('.graph-zoom-controls') || e.target.closest('.graph-legend')) return;
        graphIsDragging = true;
        graphDragMoved = false;
        graphDragStart = { x: e.clientX - graphPan.x, y: e.clientY - graphPan.y };
        container.style.cursor = 'grabbing';
      });
      document.addEventListener('mousemove', function(e) {
        if (!graphIsDragging) return;
        var dx = e.clientX - graphDragStart.x;
        var dy = e.clientY - graphDragStart.y;
        if (Math.abs(dx - graphPan.x) > 2 || Math.abs(dy - graphPan.y) > 2) {
          graphDragMoved = true;
        }
        graphPan.x = dx;
        graphPan.y = dy;
        applyGraphTransform();
      });
      document.addEventListener('mouseup', function() {
        if (graphIsDragging) {
          graphIsDragging = false;
          var c = document.querySelector('.graph-container');
          if (c) c.style.cursor = '';
        }
      });

      var lastTouchDist = 0;
      var lastTouchCenter = { x: 0, y: 0 };
      container.addEventListener('touchstart', function(e) {
        if (e.touches.length === 1) {
          graphIsDragging = true;
          graphDragMoved = false;
          graphDragStart = { x: e.touches[0].clientX - graphPan.x, y: e.touches[0].clientY - graphPan.y };
        } else if (e.touches.length === 2) {
          graphIsDragging = false;
          lastTouchDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          lastTouchCenter = {
            x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
            y: (e.touches[0].clientY + e.touches[1].clientY) / 2
          };
        }
      }, { passive: true });
      container.addEventListener('touchmove', function(e) {
        e.preventDefault();
        if (e.touches.length === 1 && graphIsDragging) {
          var dx = e.touches[0].clientX - graphDragStart.x;
          var dy = e.touches[0].clientY - graphDragStart.y;
          if (Math.abs(dx - graphPan.x) > 2 || Math.abs(dy - graphPan.y) > 2) {
            graphDragMoved = true;
          }
          graphPan.x = dx;
          graphPan.y = dy;
          applyGraphTransform();
        } else if (e.touches.length === 2) {
          var dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          if (lastTouchDist > 0) {
            var factor = dist / lastTouchDist;
            var center = {
              x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
              y: (e.touches[0].clientY + e.touches[1].clientY) / 2
            };
            graphZoomMouseX = center.x;
            graphZoomMouseY = center.y;
            zoomGraph(factor, false);
            graphPan.x += center.x - lastTouchCenter.x;
            graphPan.y += center.y - lastTouchCenter.y;
            applyGraphTransform();
            lastTouchCenter = center;
          }
          lastTouchDist = dist;
        }
      }, { passive: false });
      container.addEventListener('touchend', function() {
        graphIsDragging = false;
        lastTouchDist = 0;
      });
    }

    function lineSVG(x1, y1, x2, y2, color, width, dashed) {
      return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + color + '" stroke-width="' + width + '"' + (dashed ? ' stroke-dasharray="6,4"' : '') + ' />';
    }
    function escapeQuote(s) {
      return String(s).replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    function getSourceBadgeStyle(sourceType) {
      var styles = {
        '核心主题': 'background: linear-gradient(135deg, #0d9488, #4f46e5); color: #fff;',
        '原文出现': 'background: #e0e7ff; color: #4f46e5;',
        '系统推荐': 'background: #e2e8f0; color: #64748b;',
        '跨域关联': 'background: #fef3c7; color: #d97706;',
        'AI推导': 'background: linear-gradient(135deg, #ede9fe, #f3e8ff); color: #7c3aed;'
      };
      return styles[sourceType] || styles['系统推荐'];
    }

    function openNodeDetailModal(label) {
      var node = findNodeByLabel(label);
      if (!node) return;

      var isFav = favoriteNodes[label] ? true : false;
      var favIcon = isFav ? '★' : '☆';
      var favText = isFav ? '已收藏' : '收藏节点';

      var badgeStyle = getSourceBadgeStyle(node.sourceType);

      var bodyHTML = '' +
        '<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">' +
          '<h4 style="margin:0;font-size:16px;">' + node.label + '</h4>' +
          '<span class="source-badge" style="' + badgeStyle + 'padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;">' + node.sourceType + '</span>' +
        '</div>' +
        '<div class="detail-section">' +
          '<div class="detail-section-title">📖 简明解释</div>' +
          '<div class="detail-section-body">' + node.explanation + '</div>' +
        '</div>' +
        '<div class="detail-section">' +
          '<div class="detail-section-title">🔍 证据 / 来源状态</div>' +
          '<div class="detail-section-body">' + node.evidence + '</div>' +
        '</div>' +
        '<div class="detail-section">' +
          '<div class="detail-section-title">💡 为什么重要</div>' +
          '<div class="detail-section-body">' + node.importance + '</div>' +
        '</div>' +
        '<div style="display:flex;gap:10px;margin-top:20px;">' +
          '<button class="graph-btn graph-btn-primary" onclick="exploreMoreNode(\'' + escapeQuote(label) + '\')">🔗 继续探索这个节点</button>' +
          '<button class="graph-btn graph-btn-secondary" onclick="toggleFavorite(\'' + escapeQuote(label) + '\')">' + favIcon + ' ' + favText + '</button>' +
        '</div>';

      openModal('节点详情：' + label, bodyHTML);
    }

    function toggleFavorite(label) {
      if (favoriteNodes[label]) {
        delete favoriteNodes[label];
      } else {
        favoriteNodes[label] = true;
      }
      openNodeDetailModal(label);
    }

    function exploreMoreNode(label) {
      var node = findNodeByLabel(label);
      if (!node) return;

      var relatedLabels = [
        label + '的深层含义',
        label + '的延伸思考'
      ];

      var angles = [-30, 30];
      var distance = 70;

      for (var i = 0; i < relatedLabels.length; i++) {
        var angle = angles[i] * Math.PI / 180;
        var newX = node.x + Math.cos(angle) * distance;
        var newY = node.y + Math.sin(angle) * distance;

        newX = Math.max(20, Math.min(graphContainerW - 20, newX));
        newY = Math.max(20, Math.min(graphContainerH - 20, newY));

        var newNode = {
          label: relatedLabels[i],
          x: newX,
          y: newY,
          type: 'leaf',
          sourceType: 'AI推导',
          explanation: '通过AI智能推导发现的与"' + label + '"相关的延伸概念，帮助你进行更深入的思考。',
          evidence: '基于语义关联和知识推理自动生成，属于探索性内容。',
          importance: 'AI推导的节点可以拓展你的思维边界，发现原来没有想到的关联。'
        };

        graphAllNodes.push(newNode);
        graphLines.push({ from: label, to: relatedLabels[i], color: '#a855f7', width: 1.5, dashed: true });
      }

      // 立即保存到graphStates，防止resize时丢失
      var newsId = NEWS[currentNewsIndex].id;
      if (!graphStates[newsId]) graphStates[newsId] = { extraNodes: [], extraLines: [] };
      for (var si = 0; si < relatedLabels.length; si++) {
        var saveNode = graphAllNodes[graphAllNodes.length - 2 + si];
        if (saveNode) graphStates[newsId].extraNodes.push(saveNode);
      }
      graphStates[newsId].extraLines.push({ from: label, to: relatedLabels[0] });
      graphStates[newsId].extraLines.push({ from: label, to: relatedLabels[1] });

      drawGraph();
      closeModal();
    }

    function openNodeDetail(label, detail) {
      openNodeDetailModal(label);
    }

    function openReadArticle(idx) {
