<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人生时间轴 - 忆路同行</title>
  <link rel="stylesheet" href="../core/css/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="module-page">
    <header class="module-header">
      <a href="../index.html" class="nav-back">&#9664; 返回首页</a>
      <h1>&#128197; 人生时间轴</h1>
      <button class="btn btn-sm" id="addEventBtn">+ 添加事件</button>
    </header>

    <main class="module-body">
      <div class="container">
        <!-- 时间轴 -->
        <div class="timeline" id="timeline">
          <!-- 动态生成 -->
        </div>

        <!-- 空状态 -->
        <div class="empty-state" id="emptyState">
          <div class="empty-icon">&#128197;</div>
          <h3>还没有时间轴事件</h3>
          <p>点击右上角按钮添加您的人生大事</p>
        </div>
      </div>
    </main>

    <footer class="module-footer">
      忆路同行 - 守护珍贵记忆
    </footer>
  </div>

  <!-- 添加/编辑事件弹窗 -->
  <div class="modal hidden" id="eventModal">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">添加事件</h3>
        <button class="modal-close" id="modalClose">&#10005;</button>
      </div>
      <form id="eventForm">
        <div class="form-group">
          <label for="eventYear">年份</label>
          <input type="number" id="eventYear" required min="1900" max="2026">
        </div>
        <div class="form-group">
          <label for="eventTitle">事件名称</label>
          <input type="text" id="eventTitle" required placeholder="例如：结婚、生子">
        </div>
        <div class="form-group">
          <label for="eventDesc">详细描述</label>
          <textarea id="eventDesc" rows="3" placeholder="描述一下这个美好的回忆..."></textarea>
        </div>
        <div class="form-group">
          <label for="eventPhoto">关联照片</label>
          <input type="file" id="eventPhoto" accept="image/*">
          <div class="photo-preview hidden" id="photoPreview"></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" id="cancelBtn">取消</button>
          <button type="submit" class="btn">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 事件详情弹窗 -->
  <div class="modal hidden" id="detailModal">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="detailTitle">事件详情</h3>
        <button class="modal-close" id="detailClose">&#10005;</button>
      </div>
      <div class="detail-body" id="detailBody">
        <!-- 动态内容 -->
      </div>
      <div class="modal-actions">
        <button class="speak-btn" id="detailSpeak" title="播报">&#128266;</button>
        <button class="btn btn-outline" id="detailEdit">编辑</button>
        <button class="btn btn-secondary" id="detailDelete">删除</button>
      </div>
    </div>
  </div>

  <script src="../core/js/event-bus.js"></script>
  <script src="../core/js/storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
