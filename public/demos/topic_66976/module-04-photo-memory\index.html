<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>照片回忆 - 忆路同行</title>
  <link rel="stylesheet" href="../core/css/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="module-page">
    <header class="module-header">
      <a href="../index.html" class="nav-back">&#9664; 返回首页</a>
      <h1>&#128247; 照片回忆</h1>
      <button class="btn btn-sm" id="uploadBtn">+ 添加照片</button>
    </header>

    <main class="module-body">
      <div class="container">
        <!-- 照片轮播 -->
        <div class="photo-viewer" id="photoViewer">
          <div class="photo-display" id="photoDisplay">
            <div class="photo-placeholder">
              <span class="placeholder-icon">&#128247;</span>
              <p>还没有照片，点击右上角添加</p>
            </div>
          </div>

          <!-- 照片信息 -->
          <div class="photo-info hidden" id="photoInfo">
            <h3 class="photo-title" id="photoTitle"></h3>
            <p class="photo-desc" id="photoDesc"></p>
            <div class="photo-actions">
              <button class="speak-btn" id="photoSpeak" title="播报描述">&#128266;</button>
              <button class="btn btn-outline" id="photoLike">
                <span id="likeIcon">&#9825;</span> 喜欢
              </button>
            </div>

            <!-- 语音故事区域 -->
            <div class="voice-story-section" id="voiceStorySection">
              <div class="voice-story-header">
                <span class="voice-story-label">&#127908; 这张照片的语音故事</span>
              </div>
              <!-- 无故事时的提示 -->
              <div class="voice-story-empty" id="voiceStoryEmpty">
                <p>还没有为这张照片录制语音故事</p>
                <button class="btn btn-primary btn-sm" id="recordStoryBtn">+ 录制语音故事</button>
              </div>
              <!-- 有故事时的播放控件 -->
              <div class="voice-story-player hidden" id="voiceStoryPlayer">
                <div class="voice-story-controls">
                  <button class="voice-play-btn" id="voicePlayBtn" title="播放语音故事">&#9654;</button>
                  <div class="voice-story-meta">
                    <span class="voice-story-duration" id="voiceStoryDuration">0:00</span>
                    <span class="voice-story-date" id="voiceStoryDate"></span>
                  </div>
                  <div class="voice-story-actions">
                    <button class="voice-action-btn" id="voiceReRecordBtn" title="重新录制">&#128221;</button>
                    <button class="voice-action-btn voice-action-btn--danger" id="voiceDeleteBtn" title="删除故事">&#128465;</button>
                  </div>
                </div>
                <div class="voice-progress-bar">
                  <div class="voice-progress-fill" id="voiceProgressFill"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- 轮播控制 -->
          <div class="carousel-controls hidden" id="carouselControls">
            <button class="carousel-btn" id="prevBtn">&#9664;</button>
            <div class="carousel-dots" id="carouselDots"></div>
            <button class="carousel-btn" id="nextBtn">&#9654;</button>
          </div>
        </div>

        <!-- 照片网格（缩略图） -->
        <div class="photo-grid hidden" id="photoGrid"></div>
      </div>
    </main>

    <footer class="module-footer">
      忆路同行 - 守护珍贵记忆
    </footer>
  </div>

  <!-- 添加照片弹窗 -->
  <div class="modal hidden" id="uploadModal">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3>添加照片</h3>
        <button class="modal-close" id="modalClose">&#10005;</button>
      </div>
      <form id="uploadForm">
        <div class="form-group">
          <label for="photoFile">选择照片</label>
          <input type="file" id="photoFile" accept="image/*" required>
          <div class="photo-preview hidden" id="uploadPreview"></div>
        </div>
        <div class="form-group">
          <label for="photoTitleInput">照片标题</label>
          <input type="text" id="photoTitleInput" placeholder="例如：全家福">
        </div>
        <div class="form-group">
          <label for="photoDescInput">照片描述</label>
          <textarea id="photoDescInput" rows="3" placeholder="描述一下这张照片的故事..."></textarea>
        </div>
        <div class="form-group">
          <label for="photoYear">拍摄年份</label>
          <input type="number" id="photoYear" placeholder="例如：1980" min="1900" max="2026">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" id="cancelBtn">取消</button>
          <button type="submit" class="btn">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 录制语音故事弹窗 -->
  <div class="modal hidden" id="voiceRecordModal">
    <div class="modal-overlay"></div>
    <div class="modal-content voice-record-modal-content">
      <div class="modal-header">
        <h3>&#127908; 录制语音故事</h3>
        <button class="modal-close" id="voiceModalClose">&#10005;</button>
      </div>
      <div class="voice-record-body">
        <p class="voice-record-hint">看着这张照片，讲述您记得的故事和感受吧</p>
        <div class="voice-recorder-area" id="voiceRecorderArea">
          <div class="voice-recorder-circle" id="voiceRecorderCircle">
            <span class="voice-recorder-icon" id="voiceRecorderIcon">&#127908;</span>
          </div>
          <p class="voice-recorder-status" id="voiceRecorderStatus">点击开始录制</p>
          <p class="voice-recorder-timer" id="voiceRecorderTimer">00:00</p>
        </div>
        <div class="voice-record-actions">
          <button class="btn btn-primary voice-record-start-btn" id="voiceStartBtn">开始录制</button>
          <button class="btn btn-danger voice-record-stop-btn hidden" id="voiceStopBtn">停止录制</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../core/js/event-bus.js"></script>
  <script src="../core/js/storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
