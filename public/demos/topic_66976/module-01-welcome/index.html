<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>欢迎 - 忆路同行</title>
  <link rel="stylesheet" href="../core/css/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="module-page welcome-page">
    <a href="../index.html" class="nav-back">&#9664; 返回首页</a>
    <main class="welcome-main">
      <div class="welcome-content">
        <!-- 日期显示 -->
        <div class="date-display" id="dateDisplay">
          <span class="date-weekday" id="weekday"></span>
          <span class="date-full" id="dateFull"></span>
        </div>

        <!-- 问候语 -->
        <div class="greeting-section">
          <h1 class="greeting-title" id="greetingTitle">欢迎回来</h1>
          <p class="greeting-subtitle">今天也是美好的一天</p>
        </div>

        <!-- 患者信息卡片 -->
        <div class="profile-card" id="profileCard">
          <div class="profile-avatar" id="profileAvatar">
            <span class="avatar-initial" id="avatarInitial">?</span>
          </div>
          <div class="profile-info">
            <h2 class="profile-name" id="profileName">请先设置个人档案</h2>
            <p class="profile-hint" id="profileHint">点击设置按钮，让我们更了解您</p>
          </div>
        </div>

        <!-- 今日状态 -->
        <div class="today-status">
          <div class="status-item">
            <span class="status-icon">&#127774;</span>
            <span class="status-label" id="weatherText">天气晴朗</span>
          </div>
          <div class="status-item">
            <span class="status-icon">&#128197;</span>
            <span class="status-label">今日训练未开始</span>
          </div>
        </div>

        <!-- 主按钮 -->
        <div class="action-area">
          <button class="btn btn-large btn-block" id="startBtn">
            <span>&#127912;</span>
            开始今天的回忆之旅
          </button>
        </div>

        <!-- 快捷导航 -->
        <div class="quick-nav">
          <a href="../module-02-profile/index.html" class="quick-link">
            <span class="quick-icon">&#128100;</span>
            <span>个人档案</span>
          </a>
          <a href="../module-03-timeline/index.html" class="quick-link">
            <span class="quick-icon">&#128197;</span>
            <span>人生时间轴</span>
          </a>
          <a href="../module-04-photo-memory/index.html" class="quick-link">
            <span class="quick-icon">&#128247;</span>
            <span>照片回忆</span>
          </a>
          <a href="../module-07-daily-game/index.html" class="quick-link">
            <span class="quick-icon">&#129513;</span>
            <span>认知游戏</span>
          </a>
        </div>
      </div>
    </main>

    <!-- 语音播报按钮 -->
    <button class="speak-btn welcome-speak" id="speakBtn" title="播报欢迎语">
      &#128266;
    </button>
  </div>

  <script src="../core/js/event-bus.js"></script>
  <script src="../core/js/storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
