<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>语音故事 - 忆路同行</title>
  <link rel="stylesheet" href="../core/css/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="module-page">
    <header class="module-header">
      <a href="../index.html" class="nav-back">&#9664; 返回首页</a>
      <h1>&#127908; 语音故事</h1>
      <span></span>
    </header>

    <main class="module-body">
      <div class="container container-narrow">
        <!-- 录音区域 -->
        <div class="recorder-section">
          <div class="recorder-visual" id="recorderVisual">
            <div class="recorder-icon" id="recorderIcon">&#127908;</div>
            <div class="recorder-status" id="recorderStatus">点击开始录音</div>
            <div class="recorder-timer" id="recorderTimer">00:00</div>
          </div>

          <div class="recorder-controls">
            <button class="btn btn-large" id="recordBtn">开始录音</button>
            <button class="btn btn-secondary hidden" id="stopBtn">停止录音</button>
          </div>
        </div>

        <!-- 故事列表 -->
        <div class="stories-section">
          <h2>已录制的故事</h2>
          <div class="stories-list" id="storiesList">
            <div class="empty-state-small">
              <p>还没有录制的故事</p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="module-footer">
      忆路同行 - 守护珍贵记忆
    </footer>
  </div>

  <!-- 保存故事弹窗 -->
  <div class="modal hidden" id="saveModal">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3>保存故事</h3>
        <button class="modal-close" id="modalClose">&#10005;</button>
      </div>
      <form id="saveForm">
        <div class="form-group">
          <label for="storyTitle">故事标题</label>
          <input type="text" id="storyTitle" placeholder="例如：童年的夏天" required>
        </div>
        <div class="form-group">
          <label for="storyCategory">分类</label>
          <select id="storyCategory">
            <option value="childhood">童年</option>
            <option value="youth">青年</option>
            <option value="work">工作</option>
            <option value="family">家庭</option>
            <option value="other">其他</option>
          </select>
        </div>
        <div class="form-group">
          <label for="storyTranscript">语音转文字</label>
          <textarea id="storyTranscript" rows="4" placeholder="录音内容会自动转写在这里..."></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" id="cancelBtn">取消</button>
          <button type="submit" class="btn">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../core/js/event-bus.js"></script>
  <script src="../core/js/storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
