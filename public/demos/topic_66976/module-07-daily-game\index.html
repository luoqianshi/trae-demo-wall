<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日认知游戏 - 忆路同行</title>
  <link rel="stylesheet" href="../core/css/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="module-page">
    <header class="module-header">
      <a href="../index.html" class="nav-back">&#9664; 返回首页</a>
      <h1>&#129513; 每日认知游戏</h1>
      <span></span>
    </header>

    <main class="module-body">
      <div class="container">
        <!-- 游戏选择 -->
        <div class="game-menu" id="gameMenu">
          <h2>选择今天的训练</h2>
          <div class="game-cards">
            <div class="game-card" data-game="memory">
              <div class="game-icon">&#127922;</div>
              <h3>配对记忆</h3>
              <p>翻牌找到相同的图案</p>
            </div>
            <div class="game-card" data-game="category">
              <div class="game-icon">&#128230;</div>
              <h3>分类整理</h3>
              <p>将物品放到正确类别</p>
            </div>
            <div class="game-card" data-game="sequence">
              <div class="game-icon">&#128290;</div>
              <h3>数字顺序</h3>
              <p>按顺序点击数字</p>
            </div>
          </div>
        </div>

        <!-- 游戏区域 -->
        <div class="game-area hidden" id="gameArea">
          <div class="game-header">
            <button class="btn btn-outline btn-sm" id="backToMenu">&#9664; 返回菜单</button>
            <div class="game-stats">
              <span class="stat" id="statMoves">步数: 0</span>
              <span class="stat" id="statTimer">时间: 0:00</span>
            </div>
          </div>

          <!-- 配对记忆游戏 -->
          <div class="game-board hidden" id="memoryGame">
            <div class="memory-grid" id="memoryGrid"></div>
          </div>

          <!-- 分类整理游戏 -->
          <div class="game-board hidden" id="categoryGame">
            <div class="category-instruction" id="categoryInstruction">
              将下面的物品拖动到正确的类别中
            </div>
            <div class="category-zones" id="categoryZones"></div>
            <div class="category-items" id="categoryItems"></div>
          </div>

          <!-- 数字顺序游戏 -->
          <div class="game-board hidden" id="sequenceGame">
            <div class="sequence-instruction">
              按照从小到大的顺序点击数字
            </div>
            <div class="sequence-grid" id="sequenceGrid"></div>
          </div>

          <!-- 完成画面 -->
          <div class="game-complete hidden" id="gameComplete">
            <div class="complete-icon">&#127942;</div>
            <h2>太棒了！</h2>
            <div class="complete-stats">
              <p>用时: <strong id="completeTime">0:00</strong></p>
              <p>步数: <strong id="completeMoves">0</strong></p>
            </div>
            <div class="complete-actions">
              <button class="btn" id="playAgainBtn">再玩一次</button>
              <button class="btn btn-outline" id="menuBtn">返回菜单</button>
            </div>
          </div>
        </div>

        <!-- 历史记录 -->
        <div class="records-section">
          <h3>训练记录</h3>
          <div class="records-list" id="recordsList"></div>
        </div>
      </div>
    </main>

    <footer class="module-footer">
      忆路同行 - 守护珍贵记忆
    </footer>
  </div>

  <script src="../core/js/event-bus.js"></script>
  <script src="../core/js/storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
