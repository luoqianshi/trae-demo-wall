<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人档案 - 忆路同行</title>
  <link rel="stylesheet" href="../core/css/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="module-page">
    <header class="module-header">
      <a href="../index.html" class="nav-back">&#9664; 返回首页</a>
      <h1>&#128100; 个人档案</h1>
      <span></span>
    </header>

    <main class="module-body">
      <div class="container container-narrow">
        <!-- 头像上传 -->
        <div class="avatar-section text-center">
          <div class="avatar-upload" id="avatarUpload">
            <div class="avatar-preview" id="avatarPreview">
              <span class="avatar-placeholder">&#128100;</span>
            </div>
            <input type="file" id="avatarInput" accept="image/*" class="hidden">
            <button class="btn btn-secondary btn-sm" id="uploadBtn">上传头像</button>
          </div>
        </div>

        <!-- 基本信息表单 -->
        <form id="profileForm" class="profile-form">
          <div class="form-group">
            <label for="nameInput">姓名</label>
            <input type="text" id="nameInput" placeholder="请输入姓名" required>
          </div>

          <div class="form-group">
            <label for="birthYearInput">出生年份</label>
            <input type="number" id="birthYearInput" placeholder="例如：1950" min="1900" max="2026">
          </div>

          <div class="form-group">
            <label for="hometownInput">籍贯</label>
            <input type="text" id="hometownInput" placeholder="例如：江苏南京">
          </div>

          <!-- 人生阶段 -->
          <div class="form-group">
            <label>人生阶段</label>
            <div class="life-stages" id="lifeStages">
              <button type="button" class="stage-tag" data-stage="childhood">童年</button>
              <button type="button" class="stage-tag" data-stage="youth">青年</button>
              <button type="button" class="stage-tag" data-stage="middle">中年</button>
              <button type="button" class="stage-tag" data-stage="senior">老年</button>
            </div>
          </div>

          <!-- 兴趣爱好 -->
          <div class="form-group">
            <label for="interestsInput">兴趣爱好（用逗号分隔）</label>
            <input type="text" id="interestsInput" placeholder="例如：书法、园艺、下棋">
          </div>

          <!-- 人生大事 -->
          <div class="form-group">
            <label>人生大事</label>
            <div class="life-events" id="lifeEvents">
              <div class="event-item template hidden">
                <input type="number" class="event-year" placeholder="年份" min="1900" max="2026">
                <input type="text" class="event-name" placeholder="事件名称">
                <button type="button" class="btn-remove">&#10005;</button>
              </div>
            </div>
            <button type="button" class="btn btn-outline" id="addEventBtn">+ 添加事件</button>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-large btn-block">保存档案</button>
          </div>
        </form>

        <!-- 保存成功提示 -->
        <div class="save-toast hidden" id="saveToast">
          <span>&#10004;</span> 档案已保存
        </div>
      </div>
    </main>

    <footer class="module-footer">
      忆路同行 - 守护珍贵记忆
    </footer>
  </div>

  <script src="../core/js/event-bus.js"></script>
  <script src="../core/js/storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
