<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>忆路同行 - 阿尔茨海默患者回忆训练工具</title>
  <link rel="stylesheet" href="core/css/base.css">
  <style>
    /* 首页专用样式 */
    .home-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(160deg, #FFF8E7 0%, #F5E6D3 50%, #F0DCC8 100%);
    }

    .home-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-xl);
    }

    .home-content {
      width: 100%;
      max-width: 720px;
      text-align: center;
    }

    .home-logo {
      font-size: 80px;
      margin-bottom: var(--space-md);
    }

    .home-title {
      font-size: 48px;
      font-weight: 900;
      color: var(--color-text);
      margin-bottom: var(--space-sm);
      letter-spacing: 4px;
    }

    .home-subtitle {
      font-size: var(--font-size-lg);
      color: var(--color-text-light);
      margin-bottom: var(--space-xl);
    }

    .home-description {
      font-size: var(--font-size-md);
      color: var(--color-text);
      line-height: 1.8;
      margin-bottom: var(--space-xl);
      padding: var(--space-lg);
      background-color: rgba(255, 255, 255, 0.6);
      border-radius: var(--radius-lg);
    }

    .home-start-btn {
      margin-bottom: var(--space-xl);
    }

    .home-modules {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-md);
    }

    .home-module-link {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      background-color: var(--color-white);
      padding: var(--space-lg);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      text-decoration: none;
      color: var(--color-text);
      transition: all 0.2s ease;
      text-align: left;
    }

    .home-module-link:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
      text-decoration: none;
      color: var(--color-text);
    }

    .module-link-icon {
      font-size: 36px;
      flex-shrink: 0;
    }

    .module-link-info {
      flex: 1;
      min-width: 0;
    }

    .module-link-title {
      font-size: var(--font-size-lg);
      font-weight: 600;
      margin-bottom: var(--space-xs);
    }

    .module-link-desc {
      font-size: var(--font-size-sm);
      color: var(--color-text-light);
      margin: 0;
    }

    .home-footer {
      text-align: center;
      padding: var(--space-md);
      color: var(--color-text-light);
      font-size: var(--font-size-xs);
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .home-title {
        font-size: 36px;
      }

      .home-modules {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="home-page">
    <main class="home-main">
      <div class="home-content">
        <div class="home-logo">&#127775;</div>
        <h1 class="home-title">忆路同行</h1>
        <p class="home-subtitle">阿尔茨海默患者回忆训练工具</p>

        <div class="home-description">
          <p>通过照片回忆、语音故事、音乐疗法和认知游戏，帮助患者保持记忆、延缓认知衰退。每一个回忆都是珍贵的宝藏，让我们一同守护。</p>
        </div>

        <div class="home-start-btn">
          <a href="module-01-welcome/index.html" class="btn btn-large">
            <span>&#127912;</span> 开始回忆之旅
          </a>
        </div>

        <div class="home-modules">
          <a href="module-01-welcome/index.html" class="home-module-link">
            <span class="module-link-icon">&#127968;</span>
            <div class="module-link-info">
              <div class="module-link-title">欢迎与引导</div>
              <p class="module-link-desc">个性化问候与今日推荐</p>
            </div>
          </a>
          <a href="module-02-profile/index.html" class="home-module-link">
            <span class="module-link-icon">&#128100;</span>
            <div class="module-link-info">
              <div class="module-link-title">个人档案</div>
              <p class="module-link-desc">管理患者基本信息</p>
            </div>
          </a>
          <a href="module-03-timeline/index.html" class="home-module-link">
            <span class="module-link-icon">&#128197;</span>
            <div class="module-link-info">
              <div class="module-link-title">人生时间轴</div>
              <p class="module-link-desc">记录人生重要时刻</p>
            </div>
          </a>
          <a href="module-04-photo-memory/index.html" class="home-module-link">
            <span class="module-link-icon">&#128247;</span>
            <div class="module-link-info">
              <div class="module-link-title">照片回忆</div>
              <p class="module-link-desc">浏览珍贵老照片</p>
            </div>
          </a>
          <a href="module-05-voice-story/index.html" class="home-module-link">
            <span class="module-link-icon">&#127908;</span>
            <div class="module-link-info">
              <div class="module-link-title">语音故事</div>
              <p class="module-link-desc">录制与播放回忆故事</p>
            </div>
          </a>
          <a href="module-06-music-therapy/index.html" class="home-module-link">
            <span class="module-link-icon">&#127925;</span>
            <div class="module-link-info">
              <div class="module-link-title">音乐疗法</div>
              <p class="module-link-desc">怀旧歌曲与情绪调节</p>
            </div>
          </a>
          <a href="module-07-daily-game/index.html" class="home-module-link">
            <span class="module-link-icon">&#129513;</span>
            <div class="module-link-info">
              <div class="module-link-title">每日认知游戏</div>
              <p class="module-link-desc">趣味训练保持认知</p>
            </div>
          </a>
          <a href="module-08-family-bridge/index.html" class="home-module-link">
            <span class="module-link-icon">&#128106;</span>
            <div class="module-link-info">
              <div class="module-link-title">家属连接面板</div>
              <p class="module-link-desc">查看进度与远程协助</p>
            </div>
          </a>
        </div>
      </div>
    </main>

    <footer class="home-footer">
      忆路同行 - 守护珍贵记忆 &copy; 2026
    </footer>
  </div>
</body>
</html>
