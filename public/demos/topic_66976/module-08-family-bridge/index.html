<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家属连接面板 - 忆路同行</title>
  <link rel="stylesheet" href="../core/css/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="module-page">
    <header class="module-header">
      <a href="../index.html" class="nav-back">&#9664; 返回首页</a>
      <h1>&#128106; 家属连接面板</h1>
      <span></span>
    </header>

    <main class="module-body">
      <div class="container">
        <!-- 概览卡片 -->
        <div class="overview-cards">
          <div class="overview-card">
            <div class="overview-icon">&#127942;</div>
            <div class="overview-value" id="totalGames">0</div>
            <div class="overview-label">今日训练次数</div>
          </div>
          <div class="overview-card">
            <div class="overview-icon">&#9200;</div>
            <div class="overview-value" id="totalTime">0</div>
            <div class="overview-label">训练时长(分钟)</div>
          </div>
          <div class="overview-card">
            <div class="overview-icon">&#128522;</div>
            <div class="overview-value" id="moodCount">0</div>
            <div class="overview-label">情绪记录</div>
          </div>
        </div>

        <!-- 情绪趋势 -->
        <div class="chart-section">
          <h3>情绪变化趋势</h3>
          <div class="mood-chart" id="moodChart">
            <div class="chart-empty">暂无情绪记录</div>
          </div>
        </div>

        <!-- 游戏记录 -->
        <div class="records-section">
          <h3>游戏得分历史</h3>
          <div class="game-records" id="gameRecords"></div>
        </div>

        <!-- 今日活动 -->
        <div class="activity-section">
          <h3>今日活动</h3>
          <div class="activity-timeline" id="activityTimeline"></div>
        </div>

        <!-- 家属操作 -->
        <div class="family-actions">
          <h3>远程操作</h3>
          <div class="action-buttons">
            <a href="../module-02-profile/index.html" class="btn btn-outline">
              &#128100; 编辑患者档案
            </a>
            <a href="../module-03-timeline/index.html" class="btn btn-outline">
              &#128197; 添加时间轴事件
            </a>
            <a href="../module-04-photo-memory/index.html" class="btn btn-outline">
              &#128247; 上传回忆照片
            </a>
            <a href="../module-05-voice-story/index.html" class="btn btn-outline">
              &#127908; 录制语音故事
            </a>
          </div>
        </div>

        <!-- 数据管理 -->
        <div class="data-management">
          <h3>数据管理</h3>
          <div class="data-actions">
            <button class="btn btn-outline" id="exportBtn">&#128190; 导出数据</button>
            <button class="btn btn-outline" id="importBtn">&#128194; 导入数据</button>
            <button class="btn btn-secondary" id="clearBtn">&#128465; 清空数据</button>
          </div>
          <textarea class="data-textarea hidden" id="dataTextarea" rows="6" placeholder="在此粘贴数据..."></textarea>
          <div class="data-actions hidden" id="importActions">
            <button class="btn" id="confirmImport">确认导入</button>
            <button class="btn btn-outline" id="cancelImport">取消</button>
          </div>
        </div>
      </div>
    </main>

    <footer class="module-footer">
      忆路同行 - 守护珍贵记忆
    </footer>
  </div>

  <script src="../core/js/event-bus.js"></script>
  <script src="../core/js/storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
