<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音乐疗法 - 忆路同行</title>
  <link rel="stylesheet" href="../core/css/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="module-page">
    <header class="module-header">
      <a href="../index.html" class="nav-back">&#9664; 返回首页</a>
      <h1>&#127925; 音乐疗法</h1>
      <span></span>
    </header>

    <main class="module-body">
      <div class="container container-narrow">
        <!-- 播放器 -->
        <div class="player-section">
          <div class="player-visual">
            <div class="now-playing-badge" id="nowPlayingBadge">
              <span class="dot"></span>
              <span>正在播放</span>
            </div>
            <div class="album-art" id="albumArt">
              <span>&#127925;</span>
            </div>
            <div class="visualizer" id="visualizer">
              <div class="visualizer-bar"></div>
              <div class="visualizer-bar"></div>
              <div class="visualizer-bar"></div>
              <div class="visualizer-bar"></div>
              <div class="visualizer-bar"></div>
              <div class="visualizer-bar"></div>
              <div class="visualizer-bar"></div>
            </div>
            <div class="player-info">
              <h2 class="song-title" id="songTitle">选择一首歌曲</h2>
              <p class="song-meta" id="songMeta"></p>
            </div>
          </div>

          <!-- 进度条 -->
          <div class="progress-bar">
            <div class="progress-track">
              <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-time">
              <span id="currentTime">0:00</span>
              <span id="totalTime">0:00</span>
            </div>
          </div>

          <!-- 播放控制 -->
          <div class="player-controls">
            <button class="control-btn" id="prevSongBtn">&#9664;&#9664;</button>
            <button class="control-btn control-play" id="playBtn">&#9654;</button>
            <button class="control-btn" id="nextSongBtn">&#9654;&#9654;</button>
          </div>

          <!-- 情绪反馈 -->
          <div class="mood-feedback">
            <p>这首歌让您感觉如何？</p>
            <div class="mood-buttons">
              <button class="mood-btn" data-mood="happy">&#128522; 开心</button>
              <button class="mood-btn" data-mood="calm">&#128524; 平静</button>
              <button class="mood-btn" data-mood="sad">&#128546; 感伤</button>
              <button class="mood-btn" data-mood="excited">&#128525; 激动</button>
            </div>
          </div>
        </div>

        <!-- 歌曲列表 -->
        <div class="playlist-section">
          <h3>怀旧歌曲库</h3>
          <div class="decade-tabs" id="decadeTabs">
            <button class="tab-btn active" data-decade="all">全部</button>
            <button class="tab-btn" data-decade="1950">50年代</button>
            <button class="tab-btn" data-decade="1960">60年代</button>
            <button class="tab-btn" data-decade="1970">70年代</button>
            <button class="tab-btn" data-decade="1980">80年代</button>
            <button class="tab-btn" data-decade="1990">90年代</button>
          </div>
          <div class="song-list" id="songList"></div>
        </div>
      </div>
    </main>

    <footer class="module-footer">
      忆路同行 - 守护珍贵记忆
    </footer>
  </div>

  <script src="../core/js/event-bus.js"></script>
  <script src="../core/js/storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
