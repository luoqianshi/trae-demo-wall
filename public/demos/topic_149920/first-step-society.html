<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第一步·社会技能启蒙</title>
    <style>
        /* 马卡龙色系配色变量 */
        :root {
            --pink: #FF9AA2;
            --mint: #B5EAD7;
            --lavender: #C7CEEA;
            --peach: #FFDAC1;
            --lemon: #FFFFD8;
            --text-dark: #333333;
            --text-light: #666666;
            --white: #FFFFFF;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            --shadow-light: 0 4px 12px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background-color: var(--lemon);
            color: var(--text-dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 页面容器 - 三屏切换 */
        .screen-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 20px;
        }

        .screen.home {
            transform: translateX(0);
        }

        .screen.select {
            transform: translateX(100%);
        }

        .screen.game {
            transform: translateX(200%);
        }

        .container.show-home .home { transform: translateX(0); }
        .container.show-home .select { transform: translateX(100%); }
        .container.show-home .game { transform: translateX(200%); }

        .container.show-select .home { transform: translateX(-100%); }
        .container.show-select .select { transform: translateX(0); }
        .container.show-select .game { transform: translateX(100%); }

        .container.show-game .home { transform: translateX(-200%); }
        .container.show-game .select { transform: translateX(-100%); }
        .container.show-game .game { transform: translateX(0); }

        /* 第一屏 - 首页 */
        #home-screen {
            background: linear-gradient(rgba(255, 255, 216, 0.85), rgba(255, 255, 216, 0.85)), 
                        url('./assets/hero_cover.jpg') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero-title {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--pink) 0%, var(--peach) 30%, var(--mint) 60%, var(--lavender) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeInUp 0.8s ease-out;
        }

        .hero-subtitle {
            font-size: 1.5rem;
            color: var(--text-light);
            margin-bottom: 3rem;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .btn-start {
            padding: 16px 48px;
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--white);
            background-color: var(--pink);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        .btn-start:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(255, 154, 162, 0.4);
        }

        .btn-start:active {
            transform: translateY(-1px);
        }

        /* 第二屏 - 场景选择 */
        #select-screen {
            background-color: var(--lemon);
            overflow-y: auto;
            padding: 30px 5%;
        }

        .select-title {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 10px;
            color: var(--text-dark);
        }

        .category-section {
            margin-bottom: 40px;
        }

        .category-title {
            font-size: 1.5rem;
            margin: 20px 0 20px 0;
            color: var(--text-dark);
            padding-left: 10px;
            border-left: 5px solid var(--pink);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .scene-card {
            background-color: var(--white);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow-light);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .scene-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow);
        }

        .scene-card:active {
            transform: translateY(-2px);
        }

        .card-emoji {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        .card-category {
            display: inline-block;
            padding: 4px 10px;
            background-color: var(--lavender);
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--text-dark);
            margin-bottom: 10px;
        }

        .card-description {
            font-size: 0.95rem;
            color: var(--text-light);
            line-height: 1.5;
        }

        /* 第三屏 - 游戏界面 */
        #game-screen {
            background-color: var(--lemon);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .game-header {
            background-color: var(--white);
            padding: 15px 20px;
            box-shadow: var(--shadow-light);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-back {
            padding: 8px 16px;
            background-color: var(--lavender);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background-color: #b0b9e0;
        }

        .current-scene-title {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .game-content {
            display: flex;
            flex: 1;
            overflow: hidden;
            padding: 20px;
            gap: 20px;
        }

        .scene-image-area {
            flex: 1;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scene-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--mint), var(--lavender));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            color: var(--text-dark);
        }

        .scene-placeholder .emoji {
            font-size: 5rem;
            margin-bottom: 10px;
        }

        .scene-placeholder .name {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .dialog-area {
            flex: 1.5;
            display: flex;
            flex-direction: column;
            background-color: var(--white);
            border-radius: 16px;
            padding: 20px;
            overflow-y: auto;
            box-shadow: var(--shadow-light);
        }

        .dialog-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 20px;
        }

        .npc-dialog {
            align-self: flex-start;
            max-width: 80%;
            background-color: var(--lavender);
            padding: 16px;
            border-radius: 16px 16px 16px 4px;
            animation: slideInLeft 0.4s ease-out;
        }

        .npc-name {
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: var(--text-dark);
        }

        .npc-text {
            font-size: 1rem;
            line-height: 1.6;
        }

        .user-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-self: flex-end;
            width: 100%;
            animation: fadeIn 0.4s ease-out;
        }

        .option-btn {
            padding: 14px 18px;
            background-color: var(--pink);
            color: var(--white);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-align: left;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .option-btn:hover {
            background-color: #ff8591;
            transform: translateX(-3px);
        }

        .summary-card {
            background: linear-gradient(135deg, var(--peach), var(--lemon));
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            animation: fadeInUp 0.5s ease-out;
            box-shadow: var(--shadow-light);
        }

        .summary-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-dark);
        }

        .summary-section {
            margin-bottom: 15px;
        }

        .summary-section:last-child {
            margin-bottom: 0;
        }

        .summary-label {
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 5px;
        }

        .summary-content {
            color: var(--text-light);
            line-height: 1.6;
        }

        /* 动画 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* 积分系统 */
        .points-display {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--white);
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            z-index: 100;
            color: var(--text-dark);
        }
        .points-display .coin-icon {
            font-size: 1.2rem;
        }
        .points-display .points-value {
            color: #FF9A00;
            font-size: 1.1rem;
        }
        .btn-shop {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: linear-gradient(135deg, var(--peach), var(--pink));
            color: var(--white);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: var(--shadow-light);
            z-index: 100;
            transition: all 0.3s ease;
        }
        .btn-shop:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 154, 162, 0.3);
        }
        /* 首页装饰区域 */
        .home-avatar-area {
            margin-bottom: 2rem;
            text-align: center;
        }
        .avatar-display {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--mint), var(--lavender));
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            position: relative;
            box-shadow: var(--shadow);
        }
        .avatar-frame {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid transparent;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .avatar-frame.pink-heart { border-color: #FF69B4; border-style: dashed; }
        .avatar-frame.mint-leaf { border-color: #90EE90; border-width: 6px; }
        .avatar-frame.lavender-purple { border-color: #DDA0DD; border-style: double; }
        .avatar-frame.peach-star { border-color: #FFDAB9; border-style: dotted; border-width: 5px; }
        .avatar-pendant {
            position: absolute;
            font-size: 1.5rem;
        }
        .pendant-cat { bottom: -5px; right: -5px; }
        .pendant-dog { bottom: -5px; left: -5px; }
        .pendant-crown { top: -10px; left: 50%; transform: translateX(-50%); }
        .home-bg-pink { background: linear-gradient(rgba(255, 240, 245, 0.9), rgba(255, 240, 245, 0.9)), url('./assets/hero_cover.jpg') center/cover no-repeat !important; }
        .home-bg-mint { background: linear-gradient(rgba(240, 255, 250, 0.9), rgba(240, 255, 250, 0.9)), url('./assets/hero_cover.jpg') center/cover no-repeat !important; }
        /* 商城页面 */
        .screen.shop {
            transform: translateX(300%);
            background-color: var(--lemon);
            overflow-y: auto;
            padding: 80px 5% 30px;
        }
        .container.show-home .shop { transform: translateX(300%); }
        .container.show-select .shop { transform: translateX(200%); }
        .container.show-game .shop { transform: translateX(100%); }
        .container.show-shop .home { transform: translateX(-300%); }
        .container.show-shop .select { transform: translateX(-200%); }
        .container.show-shop .game { transform: translateX(-100%); }
        .container.show-shop .shop { transform: translateX(0); }
        .shop-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }
        .shop-title {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--pink), var(--peach));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .shop-category {
            margin-bottom: 30px;
        }
        .shop-category-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
            padding-left: 10px;
            border-left: 4px solid var(--pink);
        }
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }
        .shop-item {
            background: var(--white);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            box-shadow: var(--shadow-light);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .shop-item:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow);
        }
        .shop-item.owned {
            opacity: 0.6;
        }
        .shop-item.owned .shop-item-btn {
            background: var(--mint);
        }
        .shop-item.equipped {
            border: 2px solid var(--pink);
        }
        .shop-item-icon {
            font-size: 2.5rem;
            margin-bottom: 8px;
        }
        .shop-item-name {
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        .shop-item-price {
            color: #FF9A00;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .shop-item-btn {
            padding: 6px 16px;
            border: none;
            border-radius: 20px;
            background: var(--pink);
            color: white;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .shop-item-btn:hover {
            background: #ff8591;
        }
        .shop-item-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        /* 积分奖励提示 */
        .reward-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(135deg, var(--peach), var(--pink));
            padding: 30px 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0,0,0,0.2);
            z-index: 200;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .reward-popup.show {
            transform: translate(-50%, -50%) scale(1);
        }
        .reward-popup .reward-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        .reward-popup .reward-text {
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
        }
        .reward-popup .reward-points {
            font-size: 2rem;
            font-weight: 700;
            color: #FFD700;
            margin-top: 5px;
        }

        /* 积分与商城 */
        .points-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            background: white;
            border-radius: 30px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow-light);
            z-index: 10;
        }
        .points-bar .coin-icon {
            font-size: 1.2rem;
        }
        .points-bar .points-value {
            font-weight: 700;
            color: #E8A317;
            font-size: 1.1rem;
        }
        .btn-shop {
            position: absolute;
            top: 20px;
            left: 20px;
            background: linear-gradient(135deg, var(--lavender), var(--pink));
            color: white;
            border: none;
            border-radius: 30px;
            padding: 8px 18px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow-light);
            transition: all 0.3s ease;
            z-index: 10;
        }
        .btn-shop:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(199, 206, 234, 0.5);
        }

        /* 商城屏 */
        .screen.shop {
            transform: translateX(300%);
        }
        .container.show-shop .home { transform: translateX(-300%); }
        .container.show-shop .select { transform: translateX(-200%); }
        .container.show-shop .game { transform: translateX(-100%); }
        .container.show-shop .shop { transform: translateX(0); }

        #shop-screen {
            background-color: var(--lemon);
            overflow-y: auto;
            padding: 30px 5%;
        }
        .shop-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-top: 10px;
        }
        .shop-title {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--pink), var(--lavender));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .shop-points {
            background: white;
            border-radius: 20px;
            padding: 6px 14px;
            font-weight: 700;
            color: #E8A317;
            box-shadow: var(--shadow-light);
        }
        .shop-category {
            font-size: 1.2rem;
            font-weight: 600;
            margin: 20px 0 12px;
            padding-left: 8px;
            border-left: 4px solid var(--pink);
        }
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }
        .shop-item {
            background: white;
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            box-shadow: var(--shadow-light);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .shop-item:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow);
        }
        .shop-item.owned {
            opacity: 0.7;
        }
        .shop-item.owned::after {
            content: "已拥有";
            position: absolute;
            top: 8px;
            right: 8px;
            background: var(--mint);
            color: #2D6A4F;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 10px;
        }
        .shop-item-icon {
            font-size: 2.5rem;
            margin-bottom: 8px;
        }
        .shop-item-name {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .shop-item-price {
            font-size: 0.85rem;
            color: #E8A317;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .btn-buy {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-buy.can-buy {
            background: linear-gradient(135deg, var(--pink), var(--peach));
            color: white;
        }
        .btn-buy.can-buy:hover {
            transform: scale(1.05);
        }
        .btn-buy.cannot-buy {
            background: #eee;
            color: #999;
            cursor: not-allowed;
        }
        .btn-buy.owned-btn {
            background: var(--mint);
            color: #2D6A4F;
            cursor: default;
        }

        /* 装扮展示 - 首页头像区 */
        .avatar-area {
            margin-top: 20px;
            text-align: center;
        }
        .avatar-display {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--pink), var(--lavender));
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            position: relative;
            box-shadow: var(--shadow);
        }
        .avatar-ornament {
            position: absolute;
            font-size: 1.5rem;
        }
        .avatar-ornament.top-left { top: -5px; left: -5px; }
        .avatar-ornament.top-right { top: -5px; right: -5px; }
        .avatar-ornament.bottom-left { bottom: -5px; left: -5px; }
        .avatar-ornament.bottom-right { bottom: -5px; right: -5px; }
        .avatar-bg-decoration {
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 3px dashed var(--pink);
            opacity: 0.6;
        }
        .avatar-name {
            margin-top: 10px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        /* 积分奖励提示 */
        .points-reward {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(135deg, var(--peach), var(--pink));
            color: white;
            padding: 30px 50px;
            border-radius: 20px;
            font-size: 1.5rem;
            font-weight: 700;
            z-index: 100;
            box-shadow: 0 12px 40px rgba(255, 154, 162, 0.4);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-align: center;
        }
        .points-reward.show {
            transform: translate(-50%, -50%) scale(1);
        }
        .points-reward .reward-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        .points-reward .reward-text {
            font-size: 1.2rem;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .hero-title {
                font-size: 2rem;
            }

                <div class="card-category">${scene.category}</div>
                <div class="card-title">${scene.title}</div>
                <p class="card-description">${scene.description}</p>

            div.addEventListener('click', () => {

            npcDiv.innerHTML = `

                <div class="npc-text">${dialog.text}</div>

            dialogContainer.appendChild(npcDiv);

            optionsDiv.className = 'user-options';
            
            dialog.options.forEach(option => {

            dialogContainer.appendChild(optionsDiv);

                dialogContainer.parentElement.scrollTop = dialogContainer.parentElement.scrollHeight;
            }, 100);

        function isOwned(id) {
            return ownedItems.includes(id);
        }

        function buyItem(item) {
            if (isOwned(item.id)) {
                equipItem(item);
                return;
            }
            if (points >= item.price) {
                points -= item.price;
                ownedItems.push(item.id);
                savePoints();
                updatePointsDisplay();
                saveOwned();
                equipItem(item);
                renderShop();
            } else {
                alert('积分不足，继续完成场景赚取积分吧！');
            }
        }

        function equipItem(item) {
            if (item.type === 'frame') {
                equippedFrame = item.class;
                localStorage.setItem('fss_equipped_frame', equippedFrame);
            } else if (item.type === 'pendant') {
                equippedPendant = item.class;
                localStorage.setItem('fss_equipped_pendant', equippedPendant);
            } else if (item.type === 'bg') {
                equippedBg = item.class;
                localStorage.setItem('fss_equipped_bg', equippedBg);
            }
            renderShop();
            applyDecorations();
        }

        function unequipItem(type) {
            if (type === 'frame') {
                equippedFrame = '';
                localStorage.removeItem('fss_equipped_frame');
            } else if (type === 'pendant') {
                equippedPendant = '';
                localStorage.removeItem('fss_equipped_pendant');
            } else if (type === 'bg') {
                equippedBg = '';
                localStorage.removeItem('fss_equipped_bg');
            }
            renderShop();
            applyDecorations();
        }

        function applyDecorations() {
            avatarFrame.className = 'avatar-frame' + (equippedFrame ? ' ' + equippedFrame : '');
            avatarPendant.className = 'avatar-pendant' + (equippedPendant ? ' ' + equippedPendant : '');
            avatarPendant.textContent = equippedPendant ? getPendantEmoji(equippedPendant) : '';
            homeScreenEl.className = 'screen home' + (equippedBg ? ' ' + equippedBg : '');
        }

        function getPendantEmoji(pendantClass) {
            if (pendantClass === 'pendant-cat') return '🐱';
            if (pendantClass === 'pendant-dog') return '🐶';
            if (pendantClass === 'pendant-crown') return '👑';
            return '';
        }

        function createShopItem(item) {
            const div = document.createElement('div');
            const owned = isOwned(item.id);
            const equipped = (item.type === 'frame' && equippedFrame === item.class) ||
                             (item.type === 'pendant' && equippedPendant === item.class) ||
                             (item.type === 'bg' && equippedBg === item.class);
            div.className = 'shop-item' + (owned ? ' owned' : '') + (equipped ? ' equipped' : '');
            div.innerHTML = `
                <div class="shop-item-icon">${item.icon}</div>
                <div class="shop-item-name">${item.name}</div>
                <div class="shop-item-price">${owned ? (equipped ? '已装备' : '已拥有') : '🪙 ' + item.price}</div>
                <button class="shop-item-btn">${owned ? (equipped ? '卸下' : '装备') : '购买'}</button>
            `;
            const btn = div.querySelector('.shop-item-btn');
            btn.addEventListener('click', () => {
                if (equipped) {
                    unequipItem(item.type);
                } else {
                    buyItem(item);
                }
            });
            return div;
        }

        function renderShop() {
            framesGrid.innerHTML = '';
            pendantsGrid.innerHTML = '';
            backgroundsGrid.innerHTML = '';
            shopItems.forEach(item => {
                const el = createShopItem(item);
                if (item.type === 'frame') framesGrid.appendChild(el);
                else if (item.type === 'pendant') pendantsGrid.appendChild(el);
                else if (item.type === 'bg') backgroundsGrid.appendChild(el);
            });
        }

        btnShopEl.addEventListener('click', () => {
            showScreen('shop');
        });

        btnBackFromShop.addEventListener('click', () => {
            showScreen('home');
        });

        updatePointsDisplay();
        applyDecorations();
        renderShop();

        // 初始化
        initSceneCards();
    </script>
</body>
</html>
