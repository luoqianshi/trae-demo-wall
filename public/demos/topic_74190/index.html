<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 奇物档案馆 · Curio Archive</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app" data-composition-id="main">

  <!-- ====== Loading Overlay ====== -->
  <div id="loading-overlay" class="loading-overlay" aria-hidden="true">
    <div class="scroll-loader">
      <div class="scroll-icon"></div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <p class="loading-text" id="loading-text">正在翻阅古籍...</p>
      <button class="loading-cancel" id="btn-loading-cancel" type="button">取消生成</button>
    </div>
  </div>

  <!-- ====== Toast ====== -->
  <div id="toast" class="toast" role="alert" aria-live="polite"></div>

  <!-- ====== Confirm Dialog ====== -->
  <div id="confirm-dialog" class="confirm-overlay" aria-hidden="true">
    <div class="confirm-box">
      <p class="confirm-text" id="confirm-text">确认删除这件藏品吗？此操作不可恢复。</p>
      <div class="confirm-actions">
        <button class="btn-confirm-cancel" id="btn-confirm-cancel">取消</button>
        <button class="btn-confirm-delete" id="btn-confirm-delete">确认删除</button>
      </div>
    </div>
  </div>

  <!-- ====== Navigation ====== -->
  <nav class="nav">
    <div class="nav-inner">
      <button class="nav-brand" data-view="hall" aria-label="返回档案馆大厅">
        <span class="brand-icon">&#9790;</span>
        <span class="brand-text">奇物档案馆</span>
      </button>
      <div class="nav-actions">
        <button class="nav-btn" data-view="submit" aria-label="提交新藏品">
          <span class="nav-btn-icon">+</span>
          <span class="nav-btn-label">新藏品</span>
        </button>
        <button class="nav-btn" data-view="timeline" aria-label="时间线视图" title="时间线">
          <span class="nav-btn-icon">⏳</span>
          <span class="nav-btn-label">时间线</span>
        </button>
        <button class="nav-btn" id="btn-export-open" aria-label="导出数据" title="导出">
          <span class="nav-btn-icon">📦</span>
        </button>
        <button class="nav-btn" id="btn-theme-toggle" title="切换暗色模式">
          <span class="nav-btn-icon">◐</span>
        </button>
        </div>
    </div>
  </nav>

  <!-- ====== View: Hall (档案馆大厅) ====== -->
  <main id="view-hall" class="view view-hall active">
    <section class="hall-header">
      <h1 class="hall-title">奇物档案馆</h1>
      <p class="hall-subtitle">每一件旧物，都藏着一个被遗忘的故事</p>
    </section>

    <section id="batch-bar" class="batch-bar hidden">
      <label class="batch-check-label"><input type="checkbox" id="batch-select-all"> 全选</label>
      <span class="batch-count" id="batch-count">已选 0 项</span>
      <div class="batch-actions">
        <button id="btn-batch-delete" class="btn btn-sm btn-accent" disabled>批量删除</button>
        <button id="btn-batch-cancel" class="btn btn-sm">取消选择</button>
      </div>
    </section>

    <section class="hall-controls">
      <input type="text" id="search-input" class="search-input" placeholder="搜索藏品名称..." aria-label="搜索藏品">
      <select id="filter-style" class="filter-select" aria-label="按风格筛选">
        <option value="">全部风格</option>
        <option value="武侠">武侠</option>
        <option value="科幻">科幻</option>
        <option value="治愈">治愈</option>
        <option value="悬疑">悬疑</option>
        <option value="王家卫风">王家卫风</option>
        <option value="童话">童话</option>
        <option value="古风">古风</option>
        <option value="热血动漫">热血动漫</option>
      </select>
      <button class="btn-fav-filter" id="btn-fav-filter" aria-label="仅显示收藏">♡ 仅收藏</button>
      <input type="text" id="tag-filter" class="search-input" placeholder="按标签筛选..." aria-label="按标签筛选" style="max-width:160px">
    </section>

    <section id="hall-empty" class="hall-empty">
      <div class="empty-scroll"></div>
      <h2 class="empty-title">档案馆尚空</h2>
      <p class="empty-desc">提交您的第一件藏品，让 AI 为它书写一段前世传奇</p>
      <button class="btn-primary" data-view="submit">提交第一件藏品</button>
    </section>

    <section id="hall-gallery" class="hall-gallery" hidden>
      <div class="gallery-grid" id="gallery-grid"></div>
    </section>

    <div class="storage-bar" id="storage-bar" aria-live="polite"></div>
  </main>

  <!-- ====== View: Submit (提交新藏品) ====== -->
  <main id="view-submit" class="view view-submit">
    <div class="submit-container">
      <h2 class="submit-title">提交新藏品</h2>
      <p class="submit-desc">向档案馆讲述一件旧物，AI 将揭开它「前世」的面纱</p>

      <form id="submit-form" class="submit-form" novalidate>
        <div class="form-group">
          <label for="item-name" class="form-label">物品名称 <span class="required">*</span></label>
          <input type="text" id="item-name" class="form-input" placeholder="例：一把生锈的老钥匙" required maxlength="50">
        </div>

        <div class="form-group">
          <label for="item-desc" class="form-label">物品描述 <span class="optional">(选填)</span></label>
          <textarea id="item-desc" class="form-textarea" placeholder="描述它的外观、质地、来历... 越详细，故事越精彩" rows="3" maxlength="300"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">选择故事风格 <span class="required">*</span></label>
          <div class="style-grid" id="style-grid">
            <label class="style-chip" data-style="武侠">
              <input type="radio" name="style" value="武侠" checked>
              <span class="chip-label">武侠</span>
            </label>
            <label class="style-chip" data-style="科幻">
              <input type="radio" name="style" value="科幻">
              <span class="chip-label">科幻</span>
            </label>
            <label class="style-chip" data-style="治愈">
              <input type="radio" name="style" value="治愈">
              <span class="chip-label">治愈</span>
            </label>
            <label class="style-chip" data-style="悬疑">
              <input type="radio" name="style" value="悬疑">
              <span class="chip-label">悬疑</span>
            </label>
            <label class="style-chip" data-style="王家卫风">
              <input type="radio" name="style" value="王家卫风">
              <span class="chip-label">王家卫风</span>
            </label>
            <label class="style-chip" data-style="童话">
              <input type="radio" name="style" value="童话">
              <span class="chip-label">童话</span>
            </label>
            <label class="style-chip" data-style="古风">
              <input type="radio" name="style" value="古风">
              <span class="chip-label">古风</span>
            </label>
            <label class="style-chip" data-style="热血动漫">
              <input type="radio" name="style" value="热血动漫">
              <span class="chip-label">热血动漫</span>
            </label>
          </div>
          <div class="style-actions">
            <button type="button" class="btn-surprise" id="btn-surprise">&#10022; 随机惊喜</button>
            <span class="style-count" id="style-count">已选 1 种风格</span>
          </div>
          <div class="custom-style-row">
            <input type="text" id="custom-style-input" class="custom-style-input" placeholder="输入自定义风格，如「赛博朋克」" maxlength="20">
            <button type="button" class="btn-custom-style" id="btn-custom-style">+ 添加</button>
          </div>
        </div>

        <div class="form-group">
          <label for="item-tags" class="form-label">标签 <span class="optional">(选填，逗号分隔)</span></label>
          <input type="text" id="item-tags" class="form-input" placeholder="例：青铜器, 传家宝, 旅行纪念" maxlength="100">
        </div>

        <button type="submit" class="btn-primary btn-generate" id="btn-generate">
          <span class="btn-generate-text">&#9733; 生成故事</span>
        </button>
      </form>
    </div>
  </main>

  <!-- ====== View: Timeline (时间线视图) ====== -->
  <main id="view-timeline" class="view view-timeline">
    <div class="timeline-container">
      <div class="timeline-header">
        <h2 class="timeline-title">⏳ 时间线</h2>
        <p class="timeline-desc">按时间顺序浏览你的藏品</p>
      </div>
      <div id="timeline-content" class="timeline-content"></div>
    </div>
  </main>

  <!-- ====== View: Story (故事展示) ====== -->
  <main id="view-story" class="view view-story">
    <div class="story-container">
      <div class="story-nav-top">
        <button class="btn-back" data-view="hall">&#8592; 返回大厅</button>
        <div class="story-actions">
          <button class="btn-download" id="btn-download" title="下载卡片">&#8615; 下载</button>
          <button class="btn-continue" id="btn-continue" title="续写故事">✎ 续写</button>
          <button class="btn-regenerate" id="btn-regenerate" title="重新生成">↻ 再生</button>
          <button class="btn-delete" id="btn-delete-story" title="删除藏品">&#10007; 删除</button>
        </div>
      </div>

      <div class="story-card-wrapper" id="story-card-wrapper">
        <div class="story-card" id="story-card">
          <div class="card-border">
            <div class="card-inner">
              <div class="card-header">
                <span class="card-exhibit-number" id="card-exhibit">藏品 No.000</span>
                <span class="card-seal" id="card-seal">&#10022; 鉴定</span>
              </div>
              <div class="card-image-frame" id="card-image-frame">
                <img id="card-image" alt="故事配图">
              </div>
              <div class="card-body">
                <h2 class="card-item-name" id="card-item-name">—</h2>
                <div class="card-style-tag" id="card-style-tag">风格</div>
                <div class="card-text" id="card-text">
                  <p>故事加载中...</p>
                </div>
                <div class="card-footer">
                  <span class="card-date" id="card-date"></span>
                  <span class="card-archive-mark">AI 奇物档案馆</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="style-switcher" id="style-switcher">
        <button class="switcher-prev" id="switcher-prev" aria-label="上一个风格">&#9664;</button>
        <div class="switcher-strip" id="switcher-strip"></div>
        <button class="switcher-next" id="switcher-next" aria-label="下一个风格">&#9654;</button>
      </div>
    </div>
  </main>

  <!-- ====== Edit Overlay ====== -->
  <div id="edit-overlay" class="edit-overlay" aria-hidden="true">
    <div class="edit-box">
      <h3 class="edit-title">编辑藏品</h3>
      <div class="edit-field">
        <label for="edit-name">物品名称</label>
        <input type="text" id="edit-name" class="form-input" maxlength="50">
      </div>
      <div class="edit-field">
        <label for="edit-desc">物品描述</label>
        <textarea id="edit-desc" class="form-textarea" rows="3" maxlength="300"></textarea>
      </div>
      <div class="edit-actions">
        <button class="btn-confirm-cancel" id="btn-edit-cancel">取消</button>
        <button class="btn-confirm-delete" id="btn-edit-save" style="background:var(--gold);border-color:var(--gold)">保存</button>
      </div>
    </div>
  </div>

  <!-- ====== Onboarding Overlay ====== -->
  <div id="onboarding-overlay" class="onboarding-overlay hidden">
    <div class="onboarding-card">
      <div id="onboarding-content" class="onboarding-content"></div>
      <div class="onboarding-nav">
        <button id="btn-onboarding-prev" class="btn btn-sm hidden">上一步</button>
        <span id="onboarding-step-indicator" class="onboarding-step-indicator"></span>
        <button id="btn-onboarding-next" class="btn btn-sm">下一步</button>
        <button id="btn-onboarding-skip" class="btn-onboarding-skip">跳过引导</button>
      </div>
    </div>
  </div>

  <!-- ====== Export Modal ====== -->
  <div id="export-modal" class="modal-overlay hidden">
    <div class="modal-panel">
      <h3 class="modal-title">📦 导出数据</h3>
      <div class="export-options">
        <label class="export-option">
          <input type="radio" name="export-format" value="meta" checked>
          <span class="export-option-text">仅元数据（不含图片，体积小）</span>
        </label>
        <label class="export-option">
          <input type="radio" name="export-format" value="full">
          <span class="export-option-text">完整数据（含图片，用于备份/迁移）</span>
        </label>
        <label class="export-option">
          <input type="radio" name="export-format" value="readable">
          <span class="export-option-text">可读格式（Markdown 文本，便于阅读）</span>
        </label>
        <label class="export-option">
          <input type="radio" name="export-format" value="pdf">
          <span class="export-option-text">PDF 精美卡片（打印/保存为PDF）</span>
        </label>
      </div>
      <div class="export-actions">
        <button id="btn-export-confirm" class="btn btn-accent">导出</button>
        <button id="btn-export-cancel" class="btn">取消</button>
      </div>
    </div>
  </div>

  <!-- ====== Lightbox ====== -->
  <div id="lightbox" class="lightbox-overlay hidden">
    <button id="btn-lightbox-close" class="btn-lightbox-close" aria-label="关闭预览">✕</button>
    <img id="lightbox-image" class="lightbox-image" src="" alt="图片预览">
  </div>

  <!-- ====== View: Detail (藏品详情) ====== -->
  <main id="view-detail" class="view view-detail">
    <div class="detail-container">
      <button class="btn-back" data-view="hall">&#8592; 返回大厅</button>
      <h2 class="detail-title" id="detail-title">—</h2>
      <div class="detail-meta" id="detail-meta"></div>
      <div class="detail-actions">
        <button class="btn-download" id="btn-edit-detail">✎ 编辑</button>
        <button class="btn-fav-toggle" id="btn-fav-detail" title="收藏">♡ 收藏</button>
      </div>
      <button class="btn-delete" id="btn-delete-detail" style="margin-bottom:16px">&#10007; 删除藏品</button>

      <div class="detail-gallery" id="detail-gallery"></div>
    </div>
  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
