<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>职场社死模拟器 - 解压游戏</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: #f5f5dc;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .manga-page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .manga-header {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ffa500 100%);
            border: 4px solid #000;
            border-radius: 10px;
            margin-bottom: 20px;
            position: relative;
            box-shadow: 8px 8px 0 #000;
        }

        .manga-header::before {
            content: '『职场社死模拟器』';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffeb3b;
            padding: 5px 20px;
            border: 3px solid #000;
            font-size: 14px;
            font-weight: 900;
            color: #000;
        }

        .manga-header h1 {
            font-size: 48px;
            color: #fff;
            text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }

        .manga-header .subtitle {
            font-size: 18px;
            color: #fff;
            text-shadow: 2px 2px 0 #000;
        }

        .mode-selector {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .mode-btn {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 900;
            border: 3px solid #000;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .mode-btn.normal {
            background: #4caf50;
            color: #fff;
        }

        .mode-btn.roguelike {
            background: #9c27b0;
            color: #fff;
        }

        .mode-btn:hover {
            transform: translate(-3px, -3px);
            box-shadow: 6px 6px 0 #000;
        }

        .mode-btn.active {
            box-shadow: inset 0 0 0 3px #000;
        }

        .speed-lines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .speed-lines.active {
            opacity: 1;
        }

        .speed-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, rgba(0,0,0,0.5), transparent);
            height: 3px;
            animation: speedLine 0.5s linear;
        }

        @keyframes speedLine {
            from { transform: translateX(-100vw); }
            to { transform: translateX(100vw); }
        }

        .scene-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .scene-panel {
            border: 4px solid #000;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 6px 6px 0 #000;
            transition: transform 0.2s;
            cursor: pointer;
        }

        .scene-panel:hover {
            transform: translate(-3px, -3px);
            box-shadow: 9px 9px 0 #000;
        }

        .scene-panel.completed {
            border-color: #4caf50;
            box-shadow: 6px 6px 0 #4caf50;
        }

        .scene-header {
            background: linear-gradient(90deg, #ff6b6b, #ffa500);
            padding: 15px;
            border-bottom: 3px solid #000;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .scene-number {
            background: #000;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 18px;
        }

        .scene-title {
            font-size: 20px;
            font-weight: 900;
            color: #fff;
            text-shadow: 2px 2px 0 #000;
        }

        .scene-body {
            padding: 20px;
            min-height: 150px;
            position: relative;
        }

        .dialogue-box {
            background: #fff;
            border: 3px solid #000;
            border-radius: 15px;
            padding: 15px 20px;
            position: relative;
            margin-bottom: 15px;
            box-shadow: 3px 3px 0 #000;
        }

        .dialogue-box::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 30px;
            border: 10px solid transparent;
            border-top-color: #000;
        }

        .dialogue-box.user {
            background: #e3f2fd;
            margin-left: 40px;
        }

        .dialogue-box.npc {
            margin-right: 40px;
        }

        .dialogue-text {
            font-size: 16px;
            line-height: 1.6;
            color: #000;
        }

        .character {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .character-avatar {
            width: 80px;
            height: 80px;
            border: 3px solid #000;
            border-radius: 10px;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 3px 3px 0 #000;
            transition: transform 0.3s;
            overflow: hidden;
        }

        .character-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .character-avatar.shocked {
            animation: shock 0.5s ease-out;
        }

        @keyframes shock {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        .character-info {
            flex: 1;
        }

        .character-name {
            font-weight: 900;
            font-size: 18px;
            color: #000;
        }

        .character-title {
            font-size: 14px;
            color: #666;
        }

        .emoji-burst {
            position: fixed;
            font-size: 40px;
            animation: emojiFloat 1s ease-out forwards;
            pointer-events: none;
            z-index: 2000;
        }

        @keyframes emojiFloat {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(1.5); }
        }

        .choice-container {
            margin-top: 20px;
        }

        .choice-btn {
            display: block;
            width: 100%;
            padding: 15px 20px;
            margin-bottom: 10px;
            background: #fff;
            border: 3px solid #000;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            position: relative;
            font-family: inherit;
        }

        .choice-btn:hover:not(:disabled) {
            background: #ffeb3b;
            transform: translate(-3px, -3px);
            box-shadow: 6px 6px 0 #000;
        }

        .choice-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .choice-btn .choice-emoji {
            margin-right: 10px;
        }

        .choice-btn .choice-type {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 5px;
            background: #000;
            color: #fff;
        }

        .result-panel {
            background: #fff;
            border: 4px solid #000;
            border-radius: 10px;
            padding: 25px;
            margin-top: 20px;
            text-align: center;
            box-shadow: 8px 8px 0 #000;
            display: none;
        }

        .result-panel.show {
            display: block;
            animation: resultSlide 0.5s ease-out;
        }

        @keyframes resultSlide {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-title {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 15px;
        }

        .result-title.good {
            color: #4caf50;
        }

        .result-title.bad {
            color: #f44336;
        }

        .result-title.shit {
            color: #ff9800;
        }

        .result-score {
            font-size: 60px;
            margin: 20px 0;
        }

        .score-label {
            font-size: 14px;
            color: #666;
        }

        .result-desc {
            font-size: 16px;
            line-height: 1.8;
            margin: 20px 0;
            text-align: left;
            padding: 15px;
            background: #f5f5dc;
            border-radius: 8px;
        }

        .result-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .result-btn {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: 700;
            border: 3px solid #000;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .result-btn.home {
            background: #2196f3;
            color: #fff;
        }

        .result-btn.next {
            background: #ff9800;
            color: #fff;
        }

        .result-btn.retry {
            background: #e91e63;
            color: #fff;
        }

        .result-btn:hover {
            transform: translate(-3px, -3px);
            box-shadow: 6px 6px 0 #000;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            background: #000;
            border-radius: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .status-item {
            text-align: center;
            color: #fff;
        }

        .status-value {
            font-size: 24px;
            font-weight: 900;
            color: #ffeb3b;
        }

        .status-label {
            font-size: 12px;
            color: #aaa;
        }

        .emotion-selector {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 8px;
            border: 2px solid #000;
        }

        .emotion-selector.show {
            display: block;
        }

        .emotion-section {
            margin-bottom: 15px;
        }

        .emotion-section:last-child {
            margin-bottom: 0;
        }

        .emotion-label {
            font-weight: 900;
            font-size: 16px;
            margin-bottom: 10px;
            color: #000;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .thunder-label::before {
            content: '⚡';
        }

        .meme-label::before {
            content: '🎭';
        }

        .emotion-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .thunder-phrases {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            overflow-x: auto;
            padding: 5px 0;
        }

        .thunder-phrase {
            padding: 8px 16px;
            border: 2px solid #000;
            border-radius: 20px;
            background: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .thunder-phrase:hover {
            background: #ffeb3b;
            transform: translateY(-2px);
        }

        .thunder-phrase.selected {
            background: linear-gradient(135deg, #ff6b6b, #ffa500);
            color: #fff;
            box-shadow: 0 0 15px rgba(255,107,107,0.6);
            animation: pulse 0.5s ease-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .emotion-btn {
            width: 60px;
            height: 60px;
            border: 2px solid #000;
            border-radius: 10px;
            background: #fff;
            font-size: 32px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .emotion-btn:hover {
            transform: scale(1.15);
            background: #ffeb3b;
            z-index: 10;
        }

        .emotion-btn.selected {
            background: linear-gradient(135deg, #ff6b6b, #ffa500);
            border-color: #ff6b6b;
            box-shadow: 0 0 15px rgba(255,107,107,0.6);
        }

        .sidebar {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: #fff;
            border: 3px solid #000;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 5px 5px 0 #000;
            z-index: 100;
        }

        .sidebar-item {
            padding: 10px;
            text-align: center;
            cursor: pointer;
            border-bottom: 2px solid #eee;
            transition: background 0.2s;
        }

        .sidebar-item:hover {
            background: #ffeb3b;
        }

        .sidebar-item:last-child {
            border-bottom: none;
        }

        .sidebar-emoji {
            font-size: 24px;
        }

        .sidebar-text {
            font-size: 12px;
            font-weight: 700;
            margin-top: 5px;
        }

        .game-over-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .game-over-overlay.show {
            display: flex;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .game-over-content {
            background: #fff;
            border: 5px solid #000;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            box-shadow: 10px 10px 0 #000;
        }

        .game-over-title {
            font-size: 36px;
            font-weight: 900;
            color: #f44336;
            margin-bottom: 20px;
        }

        .game-over-stats {
            margin: 20px 0;
        }

        .game-over-stat {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 2px solid #eee;
        }

        .restart-btn {
            background: linear-gradient(135deg, #ff6b6b, #ffa500);
            color: #fff;
            border: 3px solid #000;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: 900;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.2s;
            font-family: inherit;
        }

        .restart-btn:hover {
            transform: translate(-3px, -3px);
            box-shadow: 6px 6px 0 #000;
        }

        .thunder-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1500;
            display: none;
        }

        .thunder-effect.show {
            display: block;
        }

        .thunder-flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            opacity: 0;
            animation: thunderFlash 0.3s ease-out;
        }

        @keyframes thunderFlash {
            0% { opacity: 0.8; }
            100% { opacity: 0; }
        }

        .thunder-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 60px;
            font-weight: 900;
            color: #ffeb3b;
            text-shadow: 4px 4px 0 #000, -4px -4px 0 #000;
            animation: thunderText 1s ease-out;
            text-align: center;
            max-width: 90%;
        }

        @keyframes thunderText {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
            30% { transform: translate(-50%, -50%) scale(1.3); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
        }

        .combo-display {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 48px;
            font-weight: 900;
            color: #ff6b6b;
            text-shadow: 3px 3px 0 #000;
            opacity: 0;
            pointer-events: none;
            z-index: 1600;
        }

        .combo-display.show {
            animation: comboShow 1.2s ease-out;
        }

        @keyframes comboShow {
            0% { opacity: 0; transform: translateX(-50%) scale(0.5); }
            20% { opacity: 1; transform: translateX(-50%) scale(1.2); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-100px) scale(1); }
        }

        .level-up {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border: 5px solid #000;
            border-radius: 20px;
            padding: 30px 50px;
            text-align: center;
            z-index: 1700;
            display: none;
            box-shadow: 10px 10px 0 #000;
        }

        .level-up.show {
            display: block;
            animation: levelUpPop 0.5s ease-out;
        }

        @keyframes levelUpPop {
            0% { transform: translate(-50%, -50%) scale(0); }
            70% { transform: translate(-50%, -50%) scale(1.1); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        .level-up-title {
            font-size: 36px;
            font-weight: 900;
            color: #fff;
            text-shadow: 3px 3px 0 #000;
        }

        .level-up-desc {
            font-size: 18px;
            margin-top: 10px;
            color: #000;
        }

        .intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }

        .intro-screen.hidden {
            display: none;
        }

        .intro-content {
            text-align: center;
            color: #fff;
        }

        .intro-title {
            font-size: 72px;
            font-weight: 900;
            text-shadow: 5px 5px 0 #000;
            margin-bottom: 20px;
        }

        .intro-subtitle {
            font-size: 24px;
            margin-bottom: 40px;
        }

        .start-btn {
            background: #ffeb3b;
            color: #000;
            border: 4px solid #000;
            padding: 20px 60px;
            font-size: 24px;
            font-weight: 900;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .start-btn:hover {
            transform: translate(-5px, -5px);
            box-shadow: 10px 10px 0 #000;
        }

        .company-banner {
            background: linear-gradient(90deg, #1a1a2e, #16213e);
            color: #fff;
            padding: 15px 30px;
            text-align: center;
            font-weight: 700;
            border-bottom: 3px solid #e94560;
        }

        .roguelike-panel {
            background: linear-gradient(135deg, #9c27b0, #673ab7);
            border: 4px solid #fff;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            color: #fff;
        }

        .roguelike-title {
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 10px;
        }

        .roguelike-stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .roguelike-stat {
            background: rgba(0,0,0,0.3);
            padding: 10px 20px;
            border-radius: 10px;
        }

        .roguelike-stat-value {
            font-size: 28px;
            font-weight: 900;
            color: #ffeb3b;
        }

        .roguelike-stat-label {
            font-size: 12px;
            opacity: 0.8;
        }

        .wave-indicator {
            background: #ff9800;
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 900;
            display: inline-block;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .scene-container {
                grid-template-columns: 1fr;
            }

            .manga-header h1 {
                font-size: 32px;
            }

            .sidebar {
                display: none;
            }

            .thunder-text {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="intro-screen" id="introScreen">
        <div class="intro-content">
            <div class="intro-title">💀 职场社死模拟器 💀</div>
            <div class="intro-subtitle">在虚拟世界中体验社会性死亡的极致快感！</div>
            <button class="start-btn" onclick="startGame()">🚪 进入公司</button>
        </div>
    </div>

    <div class="company-banner">
        🏢 某节跳动 - 某易网络 - 摸鱼科技有限公司
    </div>

    <div class="manga-page">
        <div class="manga-header">
            <h1>💀 职场社死模拟器 💀</h1>
            <div class="subtitle">社会性死亡，从今天开始 🚀</div>
        </div>

        <div class="mode-selector">
            <button class="mode-btn normal active" onclick="setGameMode('normal')">📋 剧情模式</button>
            <button class="mode-btn roguelike" onclick="setGameMode('roguelike')">🎲 肉鸽模式</button>
        </div>

        <div id="roguelikePanel" class="roguelike-panel" style="display:none;">
            <div class="wave-indicator">🌊 第 <span id="waveNum">1</span> 波</div>
            <div class="roguelike-stats">
                <div class="roguelike-stat">
                    <div class="roguelike-stat-value" id="streakCount">0</div>
                    <div class="roguelike-stat-label">连续社死</div>
                </div>
                <div class="roguelike-stat">
                    <div class="roguelike-stat-value" id="totalShtii">0</div>
                    <div class="roguelike-stat-label">总社死值</div>
                </div>
                <div class="roguelike-stat">
                    <div class="roguelike-stat-value" id="highestWave">0</div>
                    <div class="roguelike-stat-label">最高波次</div>
                </div>
            </div>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <div class="status-value" id="shitiPoints">0</div>
                <div class="status-label">社死值</div>
            </div>
            <div class="status-item">
                <div class="status-value" id="sceneCount">0/6</div>
                <div class="status-label">完成场景</div>

        const voiceQueue = [];
        let isSpeaking = false;

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
            window.speechSynthesis.getVoices();
        }

        function playSoundEffect(type) {
            if (!gameData.soundEnabled) return;
            const sounds = soundEffects[type];
            if (!sounds || sounds.length === 0) return;

            const audio = new Audio(sounds[Math.floor(Math.random() * sounds.length)]);
            audio.volume = 0.5;
            audio.play().catch(() => {});
        }

        function speakText(text) {
            if (!gameData.voiceEnabled) return;
            
            if (text.includes('屁') || text.includes('放')) {
                playSoundEffect('fart');
            } else if (text.includes('笑') || text.includes('哈哈')) {
                playSoundEffect('laugh');
            } else if (text.includes('死') || text.includes('尴尬')) {
                playSoundEffect('fail');
            } else if (text.includes('成功') || text.includes('好')) {
                playSoundEffect('success');
            }

            if (!('speechSynthesis' in window)) return;

            voiceQueue.push(text);
            processVoiceQueue();
        }

        function processVoiceQueue() {
            if (isSpeaking || voiceQueue.length === 0) return;
            if (window.speechSynthesis.speaking) return;
            
            isSpeaking = true;
            const text = voiceQueue.shift();
            
            utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN';
            
            const voices = window.speechSynthesis.getVoices();
            const chineseVoices = voices.filter(v => v.lang.includes('zh'));
            if (chineseVoices.length > 0) {
                utterance.voice = chineseVoices[Math.floor(Math.random() * chineseVoices.length)];
            }
            
            utterance.rate = 0.9 + Math.random() * 0.4;
            utterance.pitch = 0.8 + Math.random() * 0.6;
            
            utterance.onend = () => {
                isSpeaking = false;
                setTimeout(processVoiceQueue, 300);
            };
            
            utterance.onerror = () => {
                isSpeaking = false;
                setTimeout(processVoiceQueue, 300);
            };
            
            utterance.onboundary = () => {};
            
            window.speechSynthesis.speak(utterance);
        }

        function clearVoiceQueue() {
            voiceQueue.length = 0;
            window.speechSynthesis.cancel();
            isSpeaking = false;
        }

        function playThunderSound() {
            if (!gameData.soundEnabled) return;
            
            playSoundEffect('thunder');
            playSoundEffect('crowd');

            initAudio();

            for (let i = 0; i < 3; i++) {
                setTimeout(() => {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, audioContext.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(30, audioContext.currentTime + 0.4);
                    gain.gain.setValueAtTime(0.4, audioContext.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    osc.start(audioContext.currentTime);
                    osc.stop(audioContext.currentTime + 0.4);
                }, i * 100);
            }
        }

        function playSuccessSound() {
            if (!gameData.soundEnabled) return;
            playSoundEffect('success');

            initAudio();

            const notes = [523, 659, 784, 1047];
            notes.forEach((freq, i) => {
                setTimeout(() => {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.2, audioContext.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    osc.start(audioContext.currentTime);
                    osc.stop(audioContext.currentTime + 0.2);
                }, i * 100);
            });
        }

                line.style.animationDelay = Math.random() * 0.3 + 's';
                container.appendChild(line);

            setTimeout(() => container.classList.remove('active'), 800);
        }

            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.mode-btn.${mode}`).classList.add('active');
            document.getElementById('roguelikePanel').style.display = mode === 'roguelike' ? 'block' : 'none';
            resetGame();
        }

        function renderScenes() {
            const container = document.getElementById('sceneContainer');
            container.innerHTML = '';

            if (gameData.gameMode === 'roguelike') {
                scenes = shuffleArray([...allScenes]).slice(0, 5);
            }

            scenes.forEach(scene => {
                const isCompleted = gameData.completedScenes.includes(scene.id);
                const panel = document.createElement('div');
                panel.className = `scene-panel ${isCompleted ? 'completed' : ''}`;
                panel.innerHTML = `
                    <div class="scene-header">
                        <div class="scene-number">${scene.id}</div>
                        <div class="scene-title">${scene.emoji} ${scene.title}</div>
                    </div>
                    <div class="scene-body">
                        <div class="dialogue-box"><div class="dialogue-text">🏢 ${scene.company}</div></div>
                        <div class="dialogue-box"><div class="dialogue-text">${scene.description}</div></div>
                        <button class="choice-btn" onclick="startScene(${scene.id})">
                            🎮 ${isCompleted ? '再次体验' : '进入场景'}
                        </button>
                    </div>
                `;
                container.appendChild(panel);
            });
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startScene(sceneId) {
            const scene = scenes.find(s => s.id === sceneId);
            if (!scene) return;

            gameData.currentScene = scene;
            gameData.selectedEmotion = null;
            gameData.selectedThunder = null;
            gameData.currentRound = 0;
            gameData.choicesMade = [];

            const sceneEmojis = scene.emojis || memeImages;
            const sceneThunders = scene.thunderPhrases || thunderPhrases;
            const firstRound = scene.rounds[0];

            const container = document.getElementById('sceneContainer');
            container.innerHTML = '';

            const panel = document.createElement('div');
            panel.className = 'scene-panel';
            panel.style.gridColumn = '1 / -1';
            panel.innerHTML = `
                <div class="scene-header">
                    <div class="scene-number">${scene.id}</div>
                    <div class="scene-title">${scene.emoji} ${scene.title}</div>
                </div>
                <div class="scene-body" id="sceneBody">
                    <div class="character">
                        <div class="character-avatar" id="playerAvatar">${scene.character.avatar}</div>
                        <div class="character-info">
                            <div class="character-name">${scene.character.name}</div>
                            <div class="character-title">${scene.character.title}</div>
                        </div>
                    </div>
                    <div class="dialogue-box">
                        <div class="dialogue-text"><strong>🏢 ${scene.company}</strong> - ${scene.culture || ''}</div>
                    </div>
                    <div class="dialogue-box user">
                        <div class="dialogue-text"><strong>🔄 第${firstRound.round}轮：</strong>${firstRound.situation}</div>
                    </div>
                    <div class="emotion-selector show" id="emotionSelector">
                        <div class="emotion-section">
                            <div class="emotion-label meme-label">选择你的表情包：</div>
                            <div class="emotion-grid" id="memeGrid">
                                ${sceneEmojis.map(e => `<button class="emotion-btn" onclick="selectEmotion('${e.replace(/'/g, "\\'")}')">${e}</button>`).join('')}
                            </div>
                        </div>
                        <div class="emotion-section">
                            <div class="emotion-label thunder-label">你想说：</div>
                            <div class="thunder-phrases" id="thunderPhrases">
                                ${sceneThunders.map(t => `<button class="thunder-phrase" onclick="selectThunder('${t.replace(/'/g, "\\'")}')">${t}</button>`).join('')}
                            </div>
                        </div>
                    </div>
                    <div class="choice-container" id="choiceContainer" style="display:none;">
                        ${firstRound.choices.map((choice, idx) => `
                            <button class="choice-btn" onclick="makeChoice(${idx})">
                                <span class="choice-emoji">👉</span> ${choice.text}
                                <span class="choice-type">${choice.type === 'safe' ? '安全' : choice.type === 'escape' ? '逃脱' : choice.type === 'thunder' ? '作死' : choice.type === 'legend' ? '传说' : '普通'}</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;

            container.appendChild(panel);
            document.getElementById('resultPanel').classList.remove('show');
        }

        function selectEmotion(emoji) {
            gameData.selectedEmotion = emoji;
            document.querySelectorAll('.emotion-btn').forEach(btn => btn.classList.remove('selected'));
            event.target.classList.add('selected');

            const avatar = document.getElementById('playerAvatar');
            avatar.textContent = emoji;
            avatar.classList.add('shocked');
            setTimeout(() => avatar.classList.remove('shocked'), 500);

            spawnEmojiBurst(avatar, 3);
            checkReadyToContinue();
        }

        function selectThunder(phrase) {
            gameData.selectedThunder = phrase;
            document.querySelectorAll('.thunder-phrase').forEach(btn => btn.classList.remove('selected'));
            event.target.classList.add('selected');

            speakText(phrase.replace(/！！！/g, ''));

            const avatar = document.getElementById('playerAvatar');
            avatar.classList.add('shocked');
            setTimeout(() => avatar.classList.remove('shocked'), 500);

            spawnEmojiBurst(avatar, 5);
            checkReadyToContinue();
        }

        function checkReadyToContinue() {
            if (gameData.selectedEmotion && gameData.selectedThunder) {
                document.getElementById('emotionSelector').classList.remove('show');
                document.getElementById('choiceContainer').style.display = 'block';
                const thunderText = gameData.selectedThunder || "雷霆嘎巴！！！做出你的选择！！！";
                showThunderEffect(thunderText);
            }
        }

        function makeChoice(choiceIndex) {
            const scene = gameData.currentScene;
            const currentRound = scene.rounds[gameData.currentRound];
            const choice = currentRound.choices[choiceIndex];

            document.querySelectorAll('.choice-btn').forEach(btn => btn.disabled = true);

            const body = document.getElementById('sceneBody');
            const thunderText = gameData.selectedThunder || currentRound.thunderPhrases?.[Math.floor(Math.random() * (currentRound.thunderPhrases?.length || scene.thunderPhrases.length))] || scene.thunderPhrases[Math.floor(Math.random() * scene.thunderPhrases.length)];

            gameData.choicesMade.push({
                round: gameData.currentRound + 1,
                choice: choice.text,
                shiti: choice.shiti,
                type: choice.type
            });

            if (choice.type === 'thunder' || choice.type === 'legend') {
                createSpeedLines();
                showThunderEffect(thunderText);

                setTimeout(() => {
                    const npcDialogue = document.createElement('div');
                    npcDialogue.className = 'dialogue-box npc';
                    npcDialogue.innerHTML = `<div class="dialogue-text">😱 ${choice.goodEnding}</div>`;
                    body.appendChild(npcDialogue);
                    speakText(choice.goodEnding);
                    spawnEmojiBurst(body, 10);
                }, 600);
            } else {
                const npcDialogue = document.createElement('div');
                npcDialogue.className = 'dialogue-box npc';
                npcDialogue.innerHTML = `<div class="dialogue-text">${choice.type === 'safe' ? '😅' : choice.type === 'escape' ? '🤔' : '🤔'} ${choice.goodEnding}</div>`;
                body.appendChild(npcDialogue);

                if (choice.type === 'safe' || choice.type === 'escape') {
                    playSuccessSound();
                }
                setTimeout(() => speakText(choice.goodEnding), 300);
            }

            gameData.shitiPoints += choice.shiti;
            gameData.totalShiti += choice.shiti;

            if (choice.shiti >= 30) {
                gameData.combo++;
                gameData.streak++;
                if (gameData.combo > gameData.maxCombo) gameData.maxCombo = gameData.combo;
                showCombo(gameData.combo);
            } else {
                gameData.combo = 0;
                gameData.streak = 0;
            }

            gameData.exp += choice.shiti;
            if (gameData.exp >= gameData.level * 100) {
                gameData.level++;
                showLevelUp();
            }
            checkAchievements();

            if (gameData.gameMode === 'roguelike' && gameData.streak > gameData.highestWave) {
                gameData.highestWave = gameData.streak;
            }

            checkAchievements();

            setTimeout(() => {
                if (choice.nextRound === 0) {
                    showSceneResult();
                } else {
                    gameData.currentRound = choice.nextRound - 1;
                    showNextRound();
                }
            }, 2000);
            updateUI();
        }

        function showNextRound() {
            clearVoiceQueue();
            const scene = gameData.currentScene;
            const round = scene.rounds[gameData.currentRound];
            const body = document.getElementById('sceneBody');

            const roundInfo = document.createElement('div');
            roundInfo.className = 'dialogue-box';
            roundInfo.innerHTML = `<div class="dialogue-text"><strong>🔄 第 ${round.round} 轮</strong></div>`;
            body.appendChild(roundInfo);

            const situation = document.createElement('div');
            situation.className = 'dialogue-box user';
            situation.innerHTML = `<div class="dialogue-text">${round.situation}</div>`;
            body.appendChild(situation);

            speakText(round.situation);

            const choicesContainer = document.createElement('div');
            choicesContainer.className = 'choice-container';
            choicesContainer.innerHTML = round.choices.map((choice, idx) => `
                <button class="choice-btn" onclick="makeChoice(${idx})">
                    <span class="choice-emoji">👉</span> ${choice.text}
                    <span class="choice-type">${choice.type === 'safe' ? '安全' : choice.type === 'escape' ? '逃脱' : choice.type === 'thunder' ? '作死' : choice.type === 'legend' ? '传说' : '普通'}</span>
                </button>
            `).join('');
            body.appendChild(choicesContainer);
        }

        function showSceneResult() {
            clearVoiceQueue();
            const scene = gameData.currentScene;
            const totalShiti = gameData.choicesMade.reduce((sum, c) => sum + c.shiti, 0);

            let reviewType;
            const avgShiti = totalShiti / gameData.choicesMade.length;
            if (avgShiti < 15) reviewType = 'excellent';
            else if (avgShiti < 35) reviewType = 'good';
            else if (avgShiti < 55) reviewType = 'bad';
            else reviewType = 'terrible';

            const reviews = bookReviews[reviewType];
            const review = reviews[Math.floor(Math.random() * reviews.length)];

            gameData.completedScenes.push(scene.id);
            checkAchievements();

            const panel = document.getElementById('resultPanel');
            const title = document.getElementById('resultTitle');
            const score = document.getElementById('resultScore');
            const desc = document.getElementById('resultDesc');

            const culture = scene.culture || '';

            if (reviewType === 'excellent') {
                title.textContent = '🌟 职场精英！🌟';
                title.className = 'result-title good';
            } else if (reviewType === 'good') {
                title.textContent = '👍 表现不错';
                title.className = 'result-title good';
            } else if (reviewType === 'bad') {
                title.textContent = '😅 需要反思';
                title.className = 'result-title shit';
            } else {
                title.textContent = '💀 社死达人';
                title.className = 'result-title bad';
            }

            score.textContent = `+${totalShiti}`;
            desc.innerHTML = `
                <div style="margin-bottom:15px;">
                    <strong>🏢 公司文化：</strong>${culture}
                </div>
                <div style="margin-bottom:15px;">
                    <strong>📊 本场景社死值：</strong>${totalShiti}
                </div>
                <div style="margin-bottom:15px;">
                    <strong>📖 名著点评：</strong><br>
                    <em>${review.book}</em><br>
                    <blockquote style="margin:10px 0;padding:10px;background:#f9f9f9;border-left:3px solid #000;">
                        ${review.quote}
                    </blockquote>
                    <span>${review.comment}</span>
                </div>
            `;

            speakText(review.comment);

            document.getElementById('nextSceneBtn').style.display = gameData.gameMode === 'roguelike' ? 'inline-block' : 'inline-block';
            panel.classList.add('show');

            gameData.currentRound = 0;
            gameData.choicesMade = [];

            if (gameData.gameMode === 'roguelike') {
                gameData.wave++;
                updateUI();
            }
        }

        function showResult(choice) {
            const panel = document.getElementById('resultPanel');
            const title = document.getElementById('resultTitle');
            const score = document.getElementById('resultScore');
            const desc = document.getElementById('resultDesc');

            if (choice.result === 'legend') {
                title.textContent = '🌟 传说级社死！🌟';
                title.className = 'result-title good';
            } else if (choice.result === 'bad' || choice.shiti >= 50) {
                title.textContent = '💀 社死达成 💀';
                title.className = 'result-title bad';
            } else if (choice.shiti >= 20) {
                title.textContent = '😅 小尴尬';
                title.className = 'result-title shit';
            } else {
                title.textContent = '🎉 完美逃脱';
                title.className = 'result-title good';
            }

            score.textContent = `+${choice.shiti}`;
            desc.textContent = choice.goodEnding;

            document.getElementById('nextSceneBtn').style.display = gameData.gameMode === 'roguelike' ? 'inline-block' : 'inline-block';

            panel.classList.add('show');

            if (gameData.gameMode === 'roguelike') {
                gameData.wave++;
                updateUI();
            }
        }

        function goHome() {
            document.getElementById('resultPanel').classList.remove('show');
            renderScenes();
            updateUI();
        }

        function retryScene() {
            if (gameData.currentScene) {
                startScene(gameData.currentScene.id);
            }
        }

        function nextScene() {
            if (gameData.gameMode === 'roguelike') {
                scenes = shuffleArray([...allScenes]).slice(0, 5);
            }
            goHome();
        }

        function toggleSound() {
            gameData.soundEnabled = !gameData.soundEnabled;
            updateUI();
        }

        function toggleVoice() {
            gameData.voiceEnabled = !gameData.voiceEnabled;
            updateUI();
        }

        function resetGame() {
            gameData.shitiPoints = 0;
            gameData.completedScenes = [];
            gameData.combo = 0;
            gameData.maxCombo = 0;
            gameData.level = 1;
            gameData.exp = 0;
            gameData.wave = 1;
            gameData.streak = 0;
            gameData.highestWave = 0;
            gameData.currentScene = null;
            gameData.currentRound = 0;
            gameData.choicesMade = [];
            gameData.totalShiti = 0;
            document.getElementById('resultPanel').classList.remove('show');
            document.getElementById('gameOverOverlay').classList.remove('show');
            renderScenes();
            updateUI();
        }

        function restartGame() {
            resetGame();
        }

        function showHelp() {
            alert('💀 职场社死模拟器 💀\n\n🎯 游戏目标：\n体验各种职场社死场景，累积社死值！\n\n🎭 剧情模式：\n- 选择6个固定场景体验\n- 完成所有场景后结算\n\n🎲 肉鸽模式：\n- 无限循环，随机场景\n- 连击越高，得分越多\n- 挑战你能达到的最高波次！\n\n💡 玩法技巧：\n1. 先选表情包，再选雷霆用语\n2. 雷霆用语会触发语音！\n3. 选择不同选项会影响社死值\n4. 连续高社死值可触发连击！\n\n⚠️ 注意：本游戏纯属虚构，如有雷同纯属巧合！');
        }

        function startGame() {
            document.getElementById('introScreen').classList.add('hidden');
            initAchievements();
            renderScenes();
            updateUI();
        }

        document.addEventListener('DOMContentLoaded', () => {
            initAchievements();
            renderScenes();
            updateUI();
        });
    </script>
</body>
</html>
