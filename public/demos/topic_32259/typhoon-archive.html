<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台风管理档案</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --blue:#2d7df7;--blue-light:#e6f7ff;--blue-dark:#1a5fc7;
    --bg:#f5f7fa;--white:#fff;--text:#1a1a1a;--text-sec:#666;--text-muted:#999;
    --green:#52c41a;--yellow:#faad14;--orange:#fa8c16;--red:#f5222d;--dark-red:#cf1322;
    --radius:12px;--shadow:0 2px 12px rgba(0,0,0,.05);
  }
  html{scroll-behavior:smooth}
  body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',sans-serif;color:var(--text);line-height:1.6;font-size:15px;min-height:100vh}
  a{color:var(--blue);text-decoration:none}

  /* ===== Phone Frame ===== */
  .phone-frame{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;overflow-x:hidden}
  @media(min-width:768px){
    body{background:#e8ecf1;padding:40px 20px}
    .phone-frame{border-radius:32px;box-shadow:0 20px 60px rgba(0,0,0,.15);min-height:calc(100vh - 80px);overflow-y:auto;max-height:calc(100vh - 80px)}
  }

  /* ===== Status Bar ===== */
  .status-bar{height:44px;background:var(--blue);display:flex;align-items:center;justify-content:space-between;padding:0 20px;color:#fff;font-size:12px;font-weight:600;position:sticky;top:0;z-index:100}
  .status-bar-left,.status-bar-right{display:flex;gap:6px;align-items:center}
  .status-bar-center{font-weight:700;font-size:14px}

  /* ===== Nav Bar ===== */
  .nav-bar{background:var(--blue);padding:0 16px 12px;display:flex;align-items:center;gap:12px}
  .nav-back{color:#fff;font-size:22px;cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:background .2s}
  .nav-back:hover{background:rgba(255,255,255,.15)}
  .nav-title{color:#fff;font-size:17px;font-weight:600;flex:1}
  .nav-dots{display:flex;gap:4px}
  .nav-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.6)}

  /* ===== Search ===== */
  .search-bar{padding:12px 16px;background:var(--white);position:sticky;top:44px;z-index:50}
  .search-wrap{display:flex;align-items:center;background:#f0f2f5;border-radius:20px;padding:10px 16px;gap:8px;transition:box-shadow .2s}
  .search-wrap:focus-within{box-shadow:0 0 0 2px var(--blue)}
  .search-icon{font-size:14px;opacity:.5}
  .search-input{flex:1;border:none;outline:none;background:transparent;font-size:14px;color:var(--text);font-family:inherit}
  .search-input::placeholder{color:var(--text-muted)}
  .search-clear{width:20px;height:20px;border-radius:50%;background:#ddd;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;cursor:pointer;transition:background .2s}
  .search-clear:hover{background:#bbb}

  /* ===== List ===== */
  .list-card{margin:12px 16px;background:var(--white);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  .list-header{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 0}
  .list-title{font-size:16px;font-weight:600;color:var(--text)}
  .list-count{font-size:12px;color:var(--text-muted)}

  .typhoon-item{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid #f0f0f0;cursor:pointer;transition:background .15s}
  .typhoon-item:last-child{border-bottom:none}
  .typhoon-item:hover{background:#f8f9fa}
  .typhoon-item:active{background:#f0f2f5}
  .item-main{flex:1;min-width:0}
  .item-name-row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .item-name{font-size:16px;font-weight:600;color:var(--text)}
  .item-info{display:flex;flex-direction:column;gap:2px}
  .info-date{font-size:12px;color:var(--text-muted)}
  .info-land{font-size:12px;color:var(--text-sec);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item-right{display:flex;align-items:center;flex-shrink:0;margin-left:12px;gap:8px}
  .item-arrow{font-size:20px;color:#ccc}

  /* Tags */
  .level-tag{font-size:11px;padding:2px 8px;border-radius:4px;color:#fff;font-weight:500;white-space:nowrap}
  .level-0{background:var(--green)}.level-1{background:#73d13d}.level-2{background:var(--yellow)}.level-3{background:var(--orange)}.level-4{background:var(--red)}.level-5{background:var(--dark-red)}
  .resp-tag{font-size:11px;padding:2px 8px;border-radius:4px;white-space:nowrap;display:flex;align-items:center;gap:3px}
  .resp-1{background:#f6ffed;color:#389e0d}.resp-2{background:#fffbe6;color:#d48806}.resp-3{background:#fff7e6;color:#d46b08}.resp-4{background:#fff1f0;color:#cf1322}
  .weather-btn{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer}
  .weather-0,.weather-1{background:#f6ffed}.weather-2{background:#fffbe6}.weather-3{background:#fff7e6}.weather-4,.weather-5{background:#fff1f0}

  /* ===== Detail Page ===== */
  .detail-card{margin:12px 16px;background:var(--white);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
  .detail-header{padding-bottom:16px;border-bottom:1px solid #f0f0f0;margin-bottom:16px}
  .detail-name{font-size:24px;font-weight:700;color:var(--text);margin-bottom:10px}
  .detail-tags{display:flex;gap:8px}
  .detail-meta{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px}
  .meta-item{font-size:13px;color:var(--text-sec)}
  .meta-label{color:var(--text-muted);margin-right:4px}

  /* Section */
  .section-header{margin-bottom:14px}
  .section-title-row{display:flex;align-items:center;gap:8px}
  .section-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .dot-red{background:var(--red)}.dot-blue{background:var(--blue)}.dot-green{background:var(--green)}.dot-orange{background:var(--orange)}
  .section-title{font-size:15px;font-weight:600;color:var(--text)}
  .section-content{font-size:14px;color:#333;line-height:1.8;background:#f8f9fa;border-radius:8px;padding:14px;white-space:pre-wrap}

  /* Tabs */
  .tab-bar{display:flex;gap:0;margin-bottom:14px;background:#f0f0f0;border-radius:8px;padding:3px}
  .tab-item{flex:1;text-align:center;padding:8px 0;font-size:13px;color:var(--text-sec);border-radius:6px;cursor:pointer;transition:all .2s}
  .tab-item:hover{opacity:.8}
  .tab-active{background:var(--white);color:var(--text);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.08)}

  /* Track Image */
  .track-image-wrap{border-radius:10px;overflow:hidden;background:#f8f9fa}
  .track-image{width:100%;display:block}
  .track-image-hint{text-align:center;font-size:11px;color:var(--text-muted);padding:8px 0 6px}

  /* Image Grid */
  .image-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .image-thumb{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer;transition:transform .2s}
  .image-thumb:hover{transform:scale(1.03)}
  .image-desc{font-size:11px;color:var(--text-muted);text-align:center;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* Weather Timeline */
  .timeline{padding-left:16px}
  .timeline-item{position:relative;padding-left:24px;padding-bottom:20px}
  .timeline-item:last-child{padding-bottom:0}
  .timeline-dot{position:absolute;left:0;top:6px;width:10px;height:10px;border-radius:50%;background:var(--blue);border:3px solid var(--blue-light);z-index:1}
  .timeline-line{position:absolute;left:4px;top:20px;bottom:0;width:2px;background:var(--blue-light)}
  .timeline-date{font-size:14px;font-weight:600;color:var(--blue);margin-bottom:8px}
  .timeline-block{background:#f8f9fa;border-radius:8px;padding:12px;margin-bottom:8px;border-left:4px solid transparent}
  .block-wind{border-left-color:var(--blue)}.block-rain{border-left-color:#36cfc9}
  .block-title{font-size:12px;color:var(--text-sec);font-weight:500;margin-bottom:4px}
  .block-text{font-size:13px;color:#333;line-height:1.6}

  /* Action Bar */
  .action-bar{padding:12px 16px 32px;display:flex;gap:12px}
  .btn{flex:1;display:flex;align-items:center;justify-content:center;border-radius:var(--radius);padding:14px;font-size:15px;font-weight:500;cursor:pointer;border:none;transition:opacity .2s;font-family:inherit}
  .btn:active{opacity:.85}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-danger{background:var(--white);color:var(--red);border:1px solid var(--red)}
  .btn-add{background:var(--blue);color:#fff;padding:14px;margin:12px 16px 32px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:500;cursor:pointer;border:none;font-family:inherit;transition:opacity .2s}
  .btn-add:active{opacity:.85}

  /* ===== Page Transitions ===== */
  .page{display:none;animation:fadeIn .25s ease}
  .page.active{display:block}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  /* ===== Empty State ===== */
  .empty-state{display:flex;flex-direction:column;align-items:center;padding:60px 20px 40px}
  .empty-icon{font-size:56px;margin-bottom:16px;opacity:.5}
  .empty-text{font-size:15px;color:var(--text-muted);margin-bottom:6px}
  .empty-hint{font-size:13px;color:#bbb}

  /* ===== Card Title Row ===== */
  .card-link{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:4px 0;transition:opacity .2s}
  .card-link:hover{opacity:.7}
  .card-link-text{font-size:15px;font-weight:600;color:var(--text)}
  .card-link-arrow{font-size:13px;color:var(--blue)}
</style>
</head>
<body>

<div class="phone-frame">
  <!-- Status Bar -->
  <div class="status-bar">
    <div class="status-bar-left"><span>5G</span><span>WiFi</span></div>
    <div class="status-bar-center" id="statusTime">09:41</div>
    <div class="status-bar-right"><span>76%</span></div>
  </div>

  <!-- ===== PAGE: INDEX ===== -->
  <div class="page active" id="page-index">
    <div class="nav-bar">
      <div class="nav-back" onclick="goBack()">‹</div>
      <div class="nav-title">台风管理档案</div>
      <div class="nav-dots"><span class="nav-dot"></span><span class="nav-dot"></span><span class="nav-dot"></span></div>
    </div>

    <div class="search-bar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-input" id="searchInput" placeholder="搜索台风名称、等级、登陆地" oninput="filterList()">
        <div class="search-clear" id="searchClear" style="display:none" onclick="clearSearch()">✕</div>
      </div>
    </div>

    <div id="listContainer"></div>

    <button class="btn-add" onclick="showAddHint()">
      <span style="font-size:20px;font-weight:300">+</span>
      <span>新增台风记录</span>
    </button>
  </div>

  <!-- ===== PAGE: DETAIL ===== -->
  <div class="page" id="page-detail">
    <div class="nav-bar">
      <div class="nav-back" onclick="showPage('index')">‹</div>
      <div class="nav-title" id="detailNavTitle">台风详情</div>
      <div class="nav-dots"><span class="nav-dot"></span><span class="nav-dot"></span><span class="nav-dot"></span></div>
    </div>
    <div id="detailContainer"></div>
  </div>

  <!-- ===== PAGE: WEATHER ===== -->
  <div class="page" id="page-weather">
    <div class="nav-bar">
      <div class="nav-back" onclick="showPage('detail')">‹</div>
      <div class="nav-title">天气记录</div>
      <div class="nav-dots"><span class="nav-dot"></span><span class="nav-dot"></span><span class="nav-dot"></span></div>
    </div>
    <div id="weatherContainer"></div>
  </div>
</div>

<script>
// ===== DEMO DATA =====
const LEVELS = ['热带低压','热带风暴','强热带风暴','台风','强台风','超强台风'];
const LEVEL_CLASS = {'热带低压':'level-0','热带风暴':'level-1','强热带风暴':'level-2','台风':'level-3','强台风':'level-4','超强台风':'level-5'};
const RESP_CLASS = {'1级响应':'resp-1','2级响应':'resp-2','3级响应':'resp-3','4级响应':'resp-4'};
const LEVEL_ICONS = {'热带低压':'🌤️','热带风暴':'⛅','强热带风暴':'🌧️','台风':'🌀','强台风':'⛈️','超强台风':'🌪️'};
const RESP_ICONS = {'1级响应':'🟢','2级响应':'🟡','3级响应':'🟠','4级响应':'🔴'};

const typhoons = [
  {
    _id:'1', name:'蔷薇', level:'热带低压', response:'3级响应', date:'2026-06-10', land:'浙江温州',
    basicInfoText:'蔷薇于2026年6月10日在西北太平洋洋面生成，中心附近最大风力7级（14m/s），预计将向西北方向移动，强度逐渐加强。',
    impactTexts:['高东地区风力逐渐增大，阵风达6-7级，需注意防风。','温州沿海已启动防台准备，渔船回港避风。','射阳地区目前影响较小，持续关注路径变化。','连云港暂无直接影响，保持监测。'],
    impactImages:[{url:'https://images.unsplash.com/photo-1527482937786-6cfb0a0a4c69?w=400&h=300&fit=crop',desc:'高东防台准备'},{url:'https://images.unsplash.com/photo-1534274988757-a28bf1a57c17?w=400&h=300&fit=crop',desc:'温州沿海实况'}],
    analysisText:'本次台风路径偏东，对内陆地区影响有限。但沿海地区仍需做好防风防浪准备，特别是海上作业人员需及时回港。',
    conclusionText:'1. 继续密切监测台风路径变化；2. 沿海地区做好防台物资储备；3. 加强值班值守，确保信息畅通。',
    weather:[
      {date:'2026-06-10',wind:'东北风5-6级，阵风7级',rain:'小雨，降水量2mm'},
      {date:'2026-06-11',wind:'东风6-7级，阵风8级',rain:'中雨，降水量15mm'},
      {date:'2026-06-12',wind:'东南风4-5级',rain:'阵雨转多云，降水量5mm'}
    ]
  },
  {
    _id:'2', name:'格美', level:'台风', response:'4级响应', date:'2026-05-28', land:'福建厦门',
    basicInfoText:'格美为2026年第3号台风，强度达到台风级别，中心附近最大风力12级（35m/s），登陆福建厦门后减弱为热带风暴。',
    impactTexts:['高东地区出现大风暴雨，部分路段积水。','温州机场取消多个航班，高铁部分停运。','射阳沿海潮位超警戒线，启动应急响应。','连云港地区降雨量较大，农田出现内涝。'],
    impactImages:[{url:'https://images.unsplash.com/photo-1504608524841-42fe6f032b4b?w=400&h=300&fit=crop',desc:'台风登陆实况'},{url:'https://images.unsplash.com/photo-1527482797697-8795b05a13fe?w=400&h=300&fit=crop',desc:'城市积水路段'},{url:'https://images.unsplash.com/photo-1534088568595-a066f410bcda?w=400&h=300&fit=crop',desc:'应急抢险现场'}],
    analysisText:'格美登陆后路径偏北移动，影响范围较广。高东、温州、射阳、连云港四地均受到不同程度影响，其中温州和射阳沿海影响最为严重。',
    conclusionText:'1. 总结本次防台经验，完善应急预案；2. 加强城市排水系统建设；3. 提升气象预警精准度，延长预警提前量。',
    weather:[
      {date:'2026-05-28',wind:'东南风10-12级，阵风13级',rain:'暴雨到大暴雨，降水量80mm'},
      {date:'2026-05-29',wind:'南风7-8级，阵风9级',rain:'大雨，降水量45mm'},
      {date:'2026-05-30',wind:'西南风5-6级',rain:'中雨转小雨，降水量12mm'},
      {date:'2026-05-31',wind:'西风3-4级',rain:'多云，降水量0mm'}
    ]
  },
  {
    _id:'3', name:'银杏', level:'强热带风暴', response:'2级响应', date:'2026-05-15', land:'广东汕头',
    basicInfoText:'银杏在南海生成后快速增强，达到强热带风暴级别。路径偏西，主要影响华南沿海地区。',
    impactTexts:['高东地区无明显影响。','温州地区有轻微降雨，风力3-4级。','射阳地区无直接影响。','连云港地区天气晴好，无影响。'],
    impactImages:[],
    analysisText:'银杏路径偏南偏西，对华东地区影响较小。仅温州地区有轻微降雨，其他三地基本无影响。',
    conclusionText:'本次台风对辖区影响较小，但仍需保持警惕，持续关注后续可能生成的热带气旋。',
    weather:[
      {date:'2026-05-15',wind:'东风4-5级',rain:'小雨，降水量3mm'},
      {date:'2026-05-16',wind:'东北风3-4级',rain:'多云转晴'}
    ]
  }
];

let currentTyphoon = null;
let currentTab = 0;

// ===== RENDER INDEX =====
function renderList(data) {
  const c = document.getElementById('listContainer');
  if (!data.length) {
    c.innerHTML = `<div class="empty-state"><div class="empty-icon">🌀</div><div class="empty-text">暂无台风记录</div><div class="empty-hint">点击下方按钮添加第一条记录</div></div>`;
    return;
  }
  let html = `<div class="list-card"><div class="list-header"><span class="list-title">台风记录</span><span class="list-count">共 ${data.length} 条</span></div>`;
  data.forEach(t => {
    const lc = LEVEL_CLASS[t.level]||'level-1';
    const rc = RESP_CLASS[t.response]||'resp-3';
    const ri = RESP_ICONS[t.response]||'';
    const li = LEVEL_ICONS[t.level]||'🌀';
    html += `<div class="typhoon-item" onclick="openDetail('${t._id}')">
      <div class="item-main">
        <div class="item-name-row"><span class="item-name">${t.name}</span><span class="level-tag ${lc}">${t.level}</span></div>
        <div class="item-info"><span class="info-date">${t.date}</span><span class="info-land">${t.land||''}</span></div>
      </div>
      <div class="item-right">
        <span class="resp-tag ${rc}">${ri} ${t.response}</span>
        <span class="weather-btn weather-${lc.replace('level-','')}">${li}</span>
        <span class="item-arrow">›</span>
      </div>
    </div>`;
  });
  html += '</div>';
  c.innerHTML = html;
}

// ===== RENDER DETAIL =====
function renderDetail(t) {
  currentTyphoon = t;
  currentTab = 0;
  document.getElementById('detailNavTitle').textContent = t.name + ' - 详情';
  const lc = LEVEL_CLASS[t.level]||'level-1';
  const tabs = ['高东','温州','射阳','连云港'];

  let html = '';

  // Header
  html += `<div class="detail-card"><div class="detail-header">
    <div class="detail-name">${t.name}</div>
    <div class="detail-tags"><span class="level-tag ${lc}">${t.level}</span><span class="resp-tag ${RESP_CLASS[t.response]||'resp-3'}">${t.response}</span></div>
    <div class="detail-meta">
      <span class="meta-item"><span class="meta-label">日期</span>${t.date}</span>
      ${t.land?`<span class="meta-item"><span class="meta-label">登陆地</span>${t.land}</span>`:''}
    </div>
  </div>`;

  // Weather link
  html += `<div class="card-link" onclick="openWeather()"><span class="card-link-text">查看天气记录</span><span class="card-link-arrow">查看详情 ›</span></div></div>`;

  // Track image
  html += `<div class="detail-card"><div class="section-header"><div class="section-title-row"><div class="section-dot dot-blue"></div><span class="section-title">台风路径图</span></div></div>`;
  if (t.trackImage) {
    html += `<div class="track-image-wrap"><img class="track-image" src="${t.trackImage}" alt="路径图"><div class="track-image-hint">点击图片可预览大图</div></div>`;
  } else {
    html += `<div style="display:flex;flex-direction:column;align-items:center;padding:40px;background:#f8f9fa;border-radius:10px;border:2px dashed #d9d9d9"><div style="width:48px;height:48px;border-radius:50%;background:var(--blue-light);display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--blue);margin-bottom:10px">+</div><span style="font-size:14px;color:var(--text)">上传台风路径图</span><span style="font-size:11px;color:var(--text-muted);margin-top:4px">支持从相册选取或拍照</span></div>`;
  }
  html += '</div>';

  // Basic info
  html += `<div class="detail-card"><div class="section-header"><div class="section-title-row"><div class="section-dot dot-orange"></div><span class="section-title">基本信息</span></div></div><div class="section-content">${t.basicInfoText||'暂无信息'}</div></div>`;

  // Impact
  html += `<div class="detail-card"><div class="section-header"><div class="section-title-row"><div class="section-dot dot-red"></div><span class="section-title">台风影响</span></div></div>`;
  html += `<div class="tab-bar" id="tabBar">`;
  tabs.forEach((tab,i) => { html += `<div class="tab-item ${i===0?'tab-active':''}" onclick="switchTab(${i})">${tab}</div>`; });
  html += '</div>';
  html += `<div class="section-content" id="impactContent">${(t.impactTexts||[''])[0]||'暂无记录'}</div>`;
  if (t.impactImages && t.impactImages.length) {
    html += '<div class="image-grid">';
    t.impactImages.forEach(img => { html += `<div><img class="image-thumb" src="${img.url}" alt="${img.desc||''}"><div class="image-desc">${img.desc||''}</div></div>`; });
    html += '</div>';
  }
  html += '</div>';

  // Analysis
  html += `<div class="detail-card"><div class="section-header"><div class="section-title-row"><div class="section-dot dot-blue"></div><span class="section-title">后续分析</span></div></div><div class="section-content">${t.analysisText||'暂无分析'}</div></div>`;

  // Conclusion
  html += `<div class="detail-card"><div class="section-header"><div class="section-title-row"><div class="section-dot dot-green"></div><span class="section-title">结论与建议</span></div></div><div class="section-content">${t.conclusionText||'暂无结论'}</div></div>`;

  // Actions
  html += `<div class="action-bar"><button class="btn btn-primary">保存修改</button><button class="btn btn-danger">删除记录</button></div>`;

  document.getElementById('detailContainer').innerHTML = html;
}

// ===== RENDER WEATHER =====
function renderWeather(t) {
  const w = t.weather || [];
  let html = `<div class="detail-card">`;
  if (!w.length) {
    html += `<div class="empty-state"><div class="empty-icon">🌤️</div><div class="empty-text">暂无天气记录</div><div class="empty-hint">点击下方按钮添加天气数据</div></div>`;
  } else {
    html += `<div class="list-header"><span class="list-title">天气记录</span><span class="list-count">共 ${w.length} 天</span></div>`;
    html += '<div class="timeline">';
    w.forEach((d,i) => {
      html += `<div class="timeline-item"><div class="timeline-dot"></div>${i<w.length-1?'<div class="timeline-line"></div>':''}
        <div class="timeline-date">${d.date}</div>
        <div class="timeline-block block-wind"><div class="block-title">💨 风力情况</div><div class="block-text">${d.wind||'暂无数据'}</div></div>
        <div class="timeline-block block-rain"><div class="block-title">🌧️ 降水情况</div><div class="block-text">${d.rain||'暂无数据'}</div></div>
      </div>`;
    });
    html += '</div>';
  }
  html += '</div>';
  html += `<button class="btn-add" onclick="showAddHint()"><span style="font-size:20px;font-weight:300">+</span><span>添加天气记录</span></button>`;
  document.getElementById('weatherContainer').innerHTML = html;
}

// ===== NAVIGATION =====
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  window.scrollTo(0,0);
}

function openDetail(id) {
  const t = typhoons.find(t => t._id === id);
  if (t) { renderDetail(t); showPage('detail'); }
}

function openWeather() {
  if (currentTyphoon) { renderWeather(currentTyphoon); showPage('weather'); }
}

function switchTab(i) {
  currentTab = i;
  const tabs = ['高东','温州','射阳','连云港'];
  document.querySelectorAll('#tabBar .tab-item').forEach((el,idx) => el.classList.toggle('tab-active', idx===i));
  document.getElementById('impactContent').textContent = (currentTyphoon.impactTexts||[''])[i]||'暂无记录';
}

function filterList() {
  const kw = document.getElementById('searchInput').value.trim().toLowerCase();
  document.getElementById('searchClear').style.display = kw ? 'flex' : 'none';
  if (!kw) { renderList(typhoons); return; }
  const filtered = typhoons.filter(t =>
    t.name.toLowerCase().includes(kw) || t.level.includes(kw) || (t.land||'').includes(kw)
  );
  renderList(filtered);
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('searchClear').style.display = 'none';
  renderList(typhoons);
}

function showAddHint() {
  // In HTML demo, just show a toast-like message
  const toast = document.createElement('div');
  toast.textContent = '演示模式：此功能在微信小程序中可用';
  toast.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);color:#fff;padding:14px 24px;border-radius:8px;font-size:14px;z-index:9999;pointer-events:none;animation:fadeIn .2s ease';
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2000);
}

function goBack() {
  const pages = ['index','detail','weather'];
  const active = document.querySelector('.page.active').id.replace('page-','');
  const idx = pages.indexOf(active);
  if (idx > 0) showPage(pages[idx-1]);
}

// ===== INIT =====
function updateTime() {
  const now = new Date();
  document.getElementById('statusTime').textContent = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
}
renderList(typhoons);
updateTime();
setInterval(updateTime, 30000);
</script>
</body>
</html>
