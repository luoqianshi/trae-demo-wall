<style>

.dark-mode-btn {

.topic-section {

</head>

// ========== 状态管理 ==========
let currentAge = '3-5岁';
let currentIndex = -1;
let currentTopic = null;
let displayTopic = '';
let topicFontSize = '28px';
let isDarkMode = false;
let isFavorited = false;
let askerMode = 'parent';
let variantIndex = 0;
let isFlipping = false;
let topicHistory = [];
let historyIndex = -1;
let seenTopics = JSON.parse(localStorage.getItem('ngp_seen_topics') || '{}');
let favorites = JSON.parse(localStorage.getItem('ngp_favorites') || '[]');

// ========== 工具函数 ==========
function getAgeKey(ageStr) { return ageStr.replace('岁', ''); }

function getTopicType(topic) {
  if (topic.topic.includes('脑筋急转弯')) return 'brain';
  if (topic.topic.includes('灯谜')) return 'riddle';
  return 'normal';
}

function getRecentTypes(count) {
  const types = [];
  const start = Math.max(0, topicHistory.length - count);
  for (let i = start; i < topicHistory.length; i++) {
    types.push(topicHistory[i].type);
  }
  return types;
}

function calculateFontSize(text) {
  const len = text.length;
  if (len <= 18) return '28px';
  if (len <= 24) return '24px';
  return '20px';
}

function buildDisplayTopic(topic, vIdx) {
  if (!topic.variant || topic.variant.length === 0) return topic.topic;
  const word = topic.variant[vIdx || 0] || topic.variant[0];
  return topic.topic.replace(/\[(.+?)\]/, word);
}

function getTopicLabel(topic) {
  const type = getTopicType(topic);
  if (type === 'brain') return '脑筋急转弯';
  if (type === 'riddle') return '灯谜谜语';
  return '脑洞话题';
}

// ========== 鼓励语 ==========
function loadEncourageText() {
  const hour = new Date().getHours();
  const today = new Date().toDateString();
  let count = 0;
  const saved = JSON.parse(localStorage.getItem('ngp_encourage') || '{}');
  if (saved.date === today) count = saved.count || 0;

  let greeting = '';
  if (hour >= 6 && hour < 9) greeting = '上学路上聊点什么？';
  else if (hour >= 15 && hour < 18) greeting = '放学路上聊点什么？';
  else if (hour >= 19 && hour < 21) greeting = '今晚聊点什么？';
  else if (hour >= 21 && hour < 23) greeting = '聊完这道就睡个好觉';
  else greeting = '来聊个好玩的话题吧';

  let progress = '';
  if (count === 0) progress = '不错的开始';
  else if (count < 3) progress = '今天聊得挺好的';
  else if (count < 6) progress = '越聊越有默契啦';
  else progress = '真是棒的亲子时光';

  document.getElementById('encourageText').textContent = count === 0 ? greeting : progress;
}

function updateEncourageCount() {
  const today = new Date().toDateString();
  const saved = JSON.parse(localStorage.getItem('ngp_encourage') || '{}');
  let count = (saved.date === today ? (saved.count || 0) : 0) + 1;
  localStorage.setItem('ngp_encourage', JSON.stringify({ date: today, count }));
  loadEncourageText();
}

// ========== 选题逻辑 ==========
function loadRandomTopic() {
  const ageKey = getAgeKey(currentAge);
  const list = questionBank[ageKey];
  if (!list || list.length === 0) return;

  const seen = seenTopics[ageKey] || [];
  let available = [];
  for (let i = 0; i < list.length; i++) {
    if (!seen.includes(i)) available.push(i);
  }
  if (available.length === 0) {
    seenTopics[ageKey] = [];
    available = list.map((_, i) => i);
  }

  const recentTypes = getRecentTypes(3);
  let filtered = available.filter(idx => !recentTypes.includes(getTopicType(list[idx])));
  if (filtered.length === 0) filtered = available;

  const index = filtered[Math.floor(Math.random() * filtered.length)];
  const topic = list[index];
  
  seenTopics[ageKey] = seenTopics[ageKey] || [];
  if (!seenTopics[ageKey].includes(index)) seenTopics[ageKey].push(index);
  localStorage.setItem('ngp_seen_topics', JSON.stringify(seenTopics));

  displayTopic = buildDisplayTopic(topic, 0);
  topicFontSize = calculateFontSize(displayTopic);
  currentIndex = index;
  currentTopic = topic;
  variantIndex = 0;

  addToHistory(ageKey, index);
  renderTopic();
  checkFavoriteStatus();
  updateEncourageCount();
}

function addToHistory(ageKey, index) {
  const topic = questionBank[ageKey][index];
  const type = getTopicType(topic);
  const history = topicHistory.slice(0, historyIndex + 1);
  history.push({ ageKey, index, type });
  topicHistory = history;
  historyIndex = history.length - 1;
  document.getElementById('prevBtn').classList.toggle('disabled', historyIndex <= 0);
}

function goToPrevTopic() {
  if (historyIndex <= 0) return;
  const newIndex = historyIndex - 1;
  const item = topicHistory[newIndex];
  const topic = questionBank[item.ageKey][item.index];
  
  displayTopic = buildDisplayTopic(topic, 0);
  topicFontSize = calculateFontSize(displayTopic);
  currentIndex = item.index;
  currentTopic = topic;
  variantIndex = 0;
  historyIndex = newIndex;
  currentAge = item.ageKey + '岁';

  document.querySelectorAll('.tab-item').forEach(t => {
    t.classList.toggle('active', t.dataset.age === currentAge);
  });

  renderTopic();
  checkFavoriteStatus();
  document.getElementById('prevBtn').classList.toggle('disabled', newIndex <= 0);
}

// ========== 渲染 ==========
function renderTopic() {
  document.getElementById('topicLabel').textContent = getTopicLabel(currentTopic);
  document.getElementById('topicText').textContent = displayTopic;
  document.getElementById('topicText').style.fontSize = topicFontSize;
  document.getElementById('tipText').textContent = currentTopic.tip || '';
  
  const label = askerMode === 'parent' ? '家长破冰秘籍' : '孩子提问小技巧';
  document.getElementById('tipLabel').textContent = label;

  const extendList = document.getElementById('extendList');
  if (currentTopic.extend && currentTopic.extend.length > 0) {
    extendList.innerHTML = currentTopic.extend.map(e => 
      `<div class="extend-item"><span class="extend-dot">·</span><span class="extend-text">${e}</span></div>`
    ).join('');
  } else {
    extendList.innerHTML = '';
  }

  const variantSection = document.getElementById('variantSection');
  variantSection.style.display = (currentTopic.variant && currentTopic.variant.length > 0) ? 'flex' : 'none';
}

// ========== 交互 ==========
function switchAge(el) {
  const age = el.dataset.age;
  if (age === currentAge) return;
  currentAge = age;
  document.querySelectorAll('.tab-item').forEach(t => {
    t.classList.toggle('active', t === el);
  });
  localStorage.setItem('ngp_current_age', age);
  topicHistory = [];
  historyIndex = -1;
  document.getElementById('prevBtn').classList.add('disabled');
  loadRandomTopic();
}

function refreshTopic() {
  if (isFlipping) return;
  isFlipping = true;
  const card = document.getElementById('topicCard');
  card.classList.add('flipping');
  setTimeout(() => {
    loadRandomTopic();
    setTimeout(() => {
      card.classList.remove('flipping');
      isFlipping = false;
    }, 50);
  }, 150);
}

function toggleDarkMode() {
  isDarkMode = !isDarkMode;
  document.getElementById('app').classList.toggle('dark-mode', isDarkMode);
  document.getElementById('darkIcon').textContent = isDarkMode ? '☀' : '☾';
  localStorage.setItem('ngp_dark_mode', isDarkMode);
}

function toggleAskerMode() {
  askerMode = askerMode === 'parent' ? 'child' : 'parent';
  document.getElementById('askerText').textContent = askerMode === 'parent' ? '家长提问' : '孩子提问';
  document.getElementById('tipLabel').textContent = askerMode === 'parent' ? '家长破冰秘籍' : '孩子提问小技巧';
}

function cycleVariant() {
  if (!currentTopic.variant || currentTopic.variant.length === 0) return;
  variantIndex = (variantIndex + 1) % currentTopic.variant.length;
  displayTopic = buildDisplayTopic(currentTopic, variantIndex);
  topicFontSize = calculateFontSize(displayTopic);
  document.getElementById('topicText').textContent = displayTopic;
  document.getElementById('topicText').style.fontSize = topicFontSize;
}

function toggleFavorite() {
  if (currentIndex < 0) return;
  const topicKey = currentTopic.topic;
  if (isFavorited) {
    favorites = favorites.filter(f => f.topic !== topicKey);
  } else {
    favorites.unshift({
      topic: currentTopic.topic,
      tip: currentTopic.tip,
      extend: currentTopic.extend || [],
      age: currentAge,
      createdAt: Date.now()
    });
  }
  localStorage.setItem('ngp_favorites', JSON.stringify(favorites));
  isFavorited = !isFavorited;
  document.getElementById('favIcon').textContent = isFavorited ? '★' : '☆';
  document.getElementById('favLabel').textContent = isFavorited ? '已收藏' : '收藏';
}

function checkFavoriteStatus() {
  if (currentIndex < 0) {
    isFavorited = false;
  } else {
    isFavorited = favorites.some(f => f.topic === currentTopic.topic);
  }
  document.getElementById('favIcon').textContent = isFavorited ? '★' : '☆';
  document.getElementById('favLabel').textContent = isFavorited ? '已收藏' : '收藏';
}

function goToFavorites() {
  document.getElementById('homePage').style.display = 'none';
  document.getElementById('favPage').classList.add('show');
  renderFavorites();
}

function goBack() {
  document.getElementById('favPage').classList.remove('show');
  document.getElementById('homePage').style.display = 'flex';
}

function renderFavorites() {
  const content = document.getElementById('favContent');
  if (favorites.length === 0) {
    content.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">☆</div>
        <div class="empty-text">还没有收藏话题</div>
        <div class="empty-hint">回到首页看到喜欢的话题可以点收藏哦</div>
      </div>`;
    return;
  }
  content.innerHTML = `<div class="fav-list">` + favorites.map(f => `
    <div class="fav-item">
      <div class="fav-content" onclick="useFavorite('${f.topic.replace(/'/g, "\\'")}')">
        <div class="age-tag">${f.age}</div>
        <div class="fav-topic">${f.topic}</div>
        <div class="fav-tip">${f.tip}</div>
      </div>
      <div class="fav-delete" onclick="deleteFavorite('${f.topic.replace(/'/g, "\\'")}')">
        <span class="delete-icon">🗑</span>
      </div>
    </div>
  `).join('') + `</div>`;
}

function useFavorite(topic) {
  goBack();
  const ageKey = getAgeKey(currentAge);
  const list = questionBank[ageKey];
  for (let i = 0; i < list.length; i++) {
    if (list[i].topic === topic) {
      const t = list[i];
      displayTopic = buildDisplayTopic(t, 0);
      topicFontSize = calculateFontSize(displayTopic);
      currentIndex = i;
      currentTopic = t;
      variantIndex = 0;
      addToHistory(ageKey, i);
      renderTopic();
      checkFavoriteStatus();
      return;
    }
  }
}

function deleteFavorite(topic) {
  favorites = favorites.filter(f => f.topic !== topic);
  localStorage.setItem('ngp_favorites', JSON.stringify(favorites));
  renderFavorites();
  checkFavoriteStatus();
}

function shareTopic() {
  const text = displayTopic || '来脑瓜碰找话题';
  const title = text.length > 20 ? text.substring(0, 20) + '…' : text;
  alert('分享给朋友：\n\n' + title);
}

// ========== 初始化 ==========
function init() {
  const savedAge = localStorage.getItem('ngp_current_age');
  if (savedAge) {
    currentAge = savedAge;
    document.querySelectorAll('.tab-item').forEach(t => {
      t.classList.toggle('active', t.dataset.age === currentAge);
    });
  }
  const savedDark = localStorage.getItem('ngp_dark_mode');
  if (savedDark === 'true') {
    isDarkMode = true;
    document.getElementById('app').classList.add('dark-mode');
    document.getElementById('darkIcon').textContent = '☀';
  }
  loadEncourageText();
  loadRandomTopic();
}

init();
</script>
