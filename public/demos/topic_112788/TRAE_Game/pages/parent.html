<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>家长控制中心 - 蛋仔学园</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(180deg, #1a2a4a 0%, #2d4a6f 50%, #3d5a80 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ========== 顶部标题栏 ========== */
    .parent-header {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      position: relative;
    }

    .parent-title {
      font-size: 1.4rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
      letter-spacing: 2px;
    }

    /* ========== 密码遮罩层 ========== */
    .password-overlay {
      position: fixed;
      inset: 0;
      background: rgba(26, 42, 74, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .password-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .lock-icon {
      font-size: 4rem;
      margin-bottom: 8px;
    }

    .lock-text {
      color: rgba(255,255,255,0.8);
      font-size: 1.1rem;
      font-weight: 500;
    }

    .pin-dots {
      display: flex;
      gap: 16px;
      margin: 8px 0;
    }

    .pin-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      border: 2px solid rgba(255,255,255,0.4);
      transition: all 0.2s ease;
    }

    .pin-dot.filled {
      background: #4ECDC4;
      border-color: #4ECDC4;
      box-shadow: 0 0 12px rgba(78, 205, 196, 0.5);
    }

    .pin-error {
      color: #FF6B6B;
      font-size: 0.85rem;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .pin-error.show {
      opacity: 1;
    }

    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 280px;
    }

    .num-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: 2px solid rgba(255,255,255,0.2);
      color: #fff;
      font-size: 1.5rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .num-btn:hover {
      background: rgba(255,255,255,0.2);
      transform: scale(1.08);
    }

    .num-btn:active {
      transform: scale(0.95);
      background: rgba(78, 205, 196, 0.3);
      border-color: #4ECDC4;
    }

    .num-btn.clear-btn {
      font-size: 0.9rem;
      background: rgba(255, 107, 107, 0.2);
      border-color: rgba(255, 107, 107, 0.4);
    }

    /* ========== 主内容面板 ========== */
    .parent-main {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 16px 40px;
      display: none;
    }

    .parent-main.visible {
      display: block;
      animation: fadeIn 0.6s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .panel {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    }

    .panel-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-title .icon {
      font-size: 1.3rem;
    }

    /* ========== 学习进度 ========== */
    .progress-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    @media (min-width: 600px) {
      .progress-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .progress-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 16px 10px;
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
      border-radius: 16px;
      border: 2px solid rgba(0,0,0,0.05);
    }

    .progress-planet {
      font-size: 2rem;
    }

    .progress-name {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    .progress-bar-wrap {
      width: 100%;
      height: 10px;
      background: #e0e0e0;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 10px;
      transition: width 1s ease;
    }

    .progress-percent {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .math-color { background: linear-gradient(90deg, #FF6B6B, #FF8E53); }
    .english-color { background: linear-gradient(90deg, #4ECDC4, #44A08D); }
    .chinese-color { background: linear-gradient(90deg, #FFD200, #FFAA00); }
    .science-color { background: linear-gradient(90deg, #A18CD1, #7B68EE); }

    /* ========== 知识点表格 ========== */
    .knowledge-table {
      width: 100%;
      border-collapse: collapse;
    }

    .knowledge-table th,
    .knowledge-table td {
      padding: 12px 10px;
      text-align: left;
      font-size: 0.9rem;
    }

    .knowledge-table th {
      background: #f0f0f0;
      font-weight: 700;
      color: var(--text-dark);
      border-radius: 10px 10px 0 0;
    }

    .knowledge-table tr:nth-child(even) {
      background: #fafafa;
    }

    .knowledge-table td {
      border-bottom: 1px solid #eee;
      color: var(--text-dark);
    }

    .accuracy-high { color: #27AE60; font-weight: 700; }
    .accuracy-mid { color: #F39C12; font-weight: 700; }
    .accuracy-low { color: #E74C3C; font-weight: 700; }

    /* ========== 柱状图 ========== */
    .chart-container {
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      height: 160px;
      padding: 20px 0 0;
      gap: 8px;
    }

    .chart-bar-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      flex: 1;
      max-width: 60px;
    }

    .chart-bar {
      width: 36px;
      border-radius: 8px 8px 0 0;
      background: linear-gradient(180deg, #4ECDC4 0%, #44A08D 100%);
      transition: height 1s ease;
      min-height: 4px;
      position: relative;
    }

    .chart-bar::after {
      content: attr(data-value);
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .chart-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* ========== 设置区域 ========== */
    .settings-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .setting-item {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .setting-label {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    .radio-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .radio-option {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      background: #f5f5f5;
      border-radius: 12px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-dark);
    }

    .radio-option:hover {
      background: #e8f4f8;
      border-color: #4ECDC4;
    }

    .radio-option input[type="radio"] {
      width: 18px;
      height: 18px;
      accent-color: #4ECDC4;
    }

    .radio-option:has(input:checked) {
      background: #e8f4f8;
      border-color: #4ECDC4;
      color: #2a9d8f;
    }

    .action-row {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }

    .panel-btn {
      padding: 12px 24px;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s var(--transition-bounce);
      flex: 1;
    }

    .panel-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    }

    .btn-review {
      background: linear-gradient(135deg, #FF6B6B, #FF4757);
      color: #fff;
    }

    /* ========== 退出按钮 ========== */
    .exit-bar {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 16px 40px;
      display: none;
    }

    .exit-bar.visible {
      display: block;
    }

    .exit-btn {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      background: rgba(255,255,255,0.1);
      border: 2px solid rgba(255,255,255,0.3);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .exit-btn:hover {
      background: rgba(255,255,255,0.2);
      transform: translateY(-2px);
    }

    /* ========== 响应式 ========== */
    @media (min-width: 768px) {
      .parent-title { font-size: 1.8rem; }
      .parent-main { padding: 0 24px 40px; }
      .panel { padding: 28px; }
    }
  </style>
</head>
<body>

  <!-- 顶部标题 -->
  <header class="parent-header">
    <h1 class="parent-title">家长控制中心</h1>
  </header>

  <!-- 密码遮罩 -->
  <div class="password-overlay" id="passwordOverlay">
    <div class="lock-icon">🔒</div>
    <div class="lock-text">请输入家长密码</div>
    <div class="pin-dots" id="pinDots">
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
    </div>
    <div class="pin-error" id="pinError">密码错误，请重试</div>
    <div class="numpad">
      <button class="num-btn" onclick="enterDigit(1)">1</button>
      <button class="num-btn" onclick="enterDigit(2)">2</button>
      <button class="num-btn" onclick="enterDigit(3)">3</button>
      <button class="num-btn" onclick="enterDigit(4)">4</button>
      <button class="num-btn" onclick="enterDigit(5)">5</button>
      <button class="num-btn" onclick="enterDigit(6)">6</button>
      <button class="num-btn" onclick="enterDigit(7)">7</button>
      <button class="num-btn" onclick="enterDigit(8)">8</button>
      <button class="num-btn" onclick="enterDigit(9)">9</button>
      <button class="num-btn clear-btn" onclick="clearPin()">清除</button>
      <button class="num-btn" onclick="enterDigit(0)">0</button>
      <button class="num-btn clear-btn" onclick="deletePin()">退格</button>
    </div>
  </div>

  <!-- 主内容面板 -->
  <main class="parent-main" id="parentMain">
    <!-- 学习进度总览 -->
    <div class="panel">
      <div class="panel-title"><span class="icon">🌍</span>学习进度总览</div>
      <div class="progress-grid">
        <div class="progress-item">
          <div class="progress-planet">➕</div>
          <div class="progress-name">数学星球</div>
          <div class="progress-bar-wrap">
            <div class="progress-bar-fill math-color" style="width: 60%"></div>
          </div>
          <div class="progress-percent">60%</div>
        </div>
        <div class="progress-item">
          <div class="progress-planet">🔤</div>
          <div class="progress-name">英语星球</div>
          <div class="progress-bar-wrap">
            <div class="progress-bar-fill english-color" style="width: 40%"></div>
          </div>
          <div class="progress-percent">40%</div>
        </div>
        <div class="progress-item">
          <div class="progress-planet">📖</div>
          <div class="progress-name">语文星球</div>
          <div class="progress-bar-wrap">
            <div class="progress-bar-fill chinese-color" style="width: 0%"></div>
          </div>
          <div class="progress-percent">0%</div>
        </div>
        <div class="progress-item">
          <div class="progress-planet">🔬</div>
          <div class="progress-name">科学星球</div>
          <div class="progress-bar-wrap">
            <div class="progress-bar-fill science-color" style="width: 0%"></div>
          </div>
          <div class="progress-percent">0%</div>
        </div>
      </div>
    </div>

    <!-- 知识点掌握情况 -->
    <div class="panel">
      <div class="panel-title"><span class="icon">📊</span>知识点掌握情况</div>
      <table class="knowledge-table">
        <thead>
          <tr>
            <th>知识点</th>
            <th>学科</th>
            <th>正确率</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>加减法运算</td>
            <td>数学</td>
            <td class="accuracy-high">92%</td>
          </tr>
          <tr>
            <td>乘法口诀</td>
            <td>数学</td>
            <td class="accuracy-high">88%</td>
          </tr>
          <tr>
            <td>英文字母</td>
            <td>英语</td>
            <td class="accuracy-high">95%</td>
          </tr>
          <tr>
            <td>简单单词</td>
            <td>英语</td>
            <td class="accuracy-mid">72%</td>
          </tr>
          <tr>
            <td>基础语法</td>
            <td>英语</td>
            <td class="accuracy-low">58%</td>
          </tr>
          <tr>
            <td>汉字书写</td>
            <td>语文</td>
            <td class="accuracy-mid">-</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- 每日学习时长 -->
    <div class="panel">
      <div class="panel-title"><span class="icon">📅</span>每日学习时长（最近7天）</div>
      <div class="chart-container">
        <div class="chart-bar-wrap">
          <div class="chart-bar" style="height: 90px" data-value="45分"></div>
          <div class="chart-label">周一</div>
        </div>
        <div class="chart-bar-wrap">
          <div class="chart-bar" style="height: 60px" data-value="30分"></div>
          <div class="chart-label">周二</div>
        </div>
        <div class="chart-bar-wrap">
          <div class="chart-bar" style="height: 120px" data-value="60分"></div>
          <div class="chart-label">周三</div>
        </div>
        <div class="chart-bar-wrap">
          <div class="chart-bar" style="height: 75px" data-value="38分"></div>
          <div class="chart-label">周四</div>
        </div>
        <div class="chart-bar-wrap">
          <div class="chart-bar" style="height: 105px" data-value="52分"></div>
          <div class="chart-label">周五</div>
        </div>
        <div class="chart-bar-wrap">
          <div class="chart-bar" style="height: 50px" data-value="25分"></div>
          <div class="chart-label">周六</div>
        </div>
        <div class="chart-bar-wrap">
          <div class="chart-bar" style="height: 85px" data-value="42分"></div>
          <div class="chart-label">周日</div>
        </div>
      </div>
    </div>

    <!-- 设置区域 -->
    <div class="panel">
      <div class="panel-title"><span class="icon">⚙️</span>设置</div>
      <div class="settings-group">
        <div class="setting-item">
          <div class="setting-label">每日学习时长上限</div>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="timeLimit" value="15">
              <span>15分钟</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="timeLimit" value="30" checked>
              <span>30分钟</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="timeLimit" value="45">
              <span>45分钟</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="timeLimit" value="60">
              <span>60分钟</span>
            </label>
          </div>
        </div>
        <div class="action-row">
          <button class="panel-btn btn-review" onclick="alert('查看错题功能开发中')">查看错题</button>
        </div>
      </div>
    </div>
  </main>

  <!-- 退出家长模式 -->
  <div class="exit-bar" id="exitBar">
    <button class="exit-btn" onclick="exitParentMode()">退出家长模式</button>
  </div>

  <script>
    let pin = '';
    const correctPin = '1234';

    function enterDigit(d) {
      if (pin.length >= 4) return;
      pin += d;
      updatePinDots();
      if (pin.length === 4) {
        setTimeout(checkPin, 200);
      }
    }

    function clearPin() {
      pin = '';
      updatePinDots();
      document.getElementById('pinError').classList.remove('show');
    }

    function deletePin() {
      pin = pin.slice(0, -1);
      updatePinDots();
      document.getElementById('pinError').classList.remove('show');
    }

    function updatePinDots() {
      const dots = document.querySelectorAll('.pin-dot');
      dots.forEach((dot, i) => {
        dot.classList.toggle('filled', i < pin.length);
      });
    }

    function checkPin() {
      if (pin === correctPin) {
        document.getElementById('passwordOverlay').classList.add('hidden');
        document.getElementById('parentMain').classList.add('visible');
        document.getElementById('exitBar').classList.add('visible');
      } else {
        document.getElementById('pinError').classList.add('show');
        pin = '';
        setTimeout(updatePinDots, 200);
      }
    }

    function exitParentMode() {
      document.getElementById('passwordOverlay').classList.remove('hidden');
      document.getElementById('parentMain').classList.remove('visible');
      document.getElementById('exitBar').classList.remove('visible');
      clearPin();
    }
  </script>

</body>
</html>
