<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>装扮商店 - 蛋仔学园</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(180deg, #FFF8DC 0%, #FFE4B5 40%, #FFDAB9 70%, #FFC87C 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ========== 顶部导航栏 ========== */
    .shop-header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: linear-gradient(180deg, rgba(255,255,255,0.95) 0%, rgba(255,248,220,0.9) 100%);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 2px 16px rgba(0,0,0,0.06);
      border-bottom: 1px solid rgba(255,200,100,0.3);
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: linear-gradient(135deg, #FFD200 0%, #FFA500 100%);
      color: #fff;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: transform 0.2s var(--transition-bounce), box-shadow 0.2s ease;
      text-decoration: none;
    }

    .back-btn:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 6px 20px rgba(255, 165, 0, 0.4);
    }

    .shop-title {
      font-size: 1.3rem;
      font-weight: 900;
      color: #8B4513;
      text-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }

    .coin-display {
      display: flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, #FFD200 0%, #FFAA00 100%);
      color: #fff;
      padding: 8px 16px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 800;
      box-shadow: 0 3px 12px rgba(255, 170, 0, 0.3);
    }

    .coin-display .coin-icon {
      font-size: 1.1rem;
    }

    /* ========== 主内容区 ========== */
    .shop-main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px 16px 160px;
    }

    /* ========== 分类标签 ========== */
    .category-tabs {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .category-tab {
      padding: 10px 24px;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 700;
      border: 2px solid rgba(255, 170, 0, 0.3);
      background: rgba(255, 255, 255, 0.7);
      color: #8B4513;
      cursor: pointer;
      transition: all 0.3s var(--transition-bounce);
    }

    .category-tab:hover {
      background: rgba(255, 210, 0, 0.2);
      transform: translateY(-2px);
    }

    .category-tab.active {
      background: linear-gradient(135deg, #FFD200 0%, #FFA500 100%);
      color: #fff;
      border-color: #FFD200;
      box-shadow: 0 4px 16px rgba(255, 165, 0, 0.3);
    }

    /* ========== 商品网格 ========== */
    .shop-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    @media (min-width: 768px) {
      .shop-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
      }
    }

    .shop-item {
      background: rgba(255, 255, 255, 0.92);
      border-radius: 20px;
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 6px 24px rgba(0,0,0,0.08);
      border: 2px solid rgba(255, 200, 100, 0.2);
      transition: transform 0.3s var(--transition-bounce), box-shadow 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .shop-item:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 12px 32px rgba(0,0,0,0.12);
    }

    .item-icon {
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #FFF8DC 0%, #FFE4B5 100%);
      border-radius: 50%;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.05);
    }

    .item-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 6px;
    }

    .item-price {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #E67E22;
      margin-bottom: 12px;
    }

    .item-price .coin-small {
      font-size: 0.85rem;
    }

    .buy-btn {
      width: 100%;
      padding: 10px 0;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s var(--transition-bounce);
    }

    .buy-btn.can-buy {
      background: linear-gradient(135deg, #FFD200 0%, #FFA500 100%);
      color: #fff;
      box-shadow: 0 4px 12px rgba(255, 165, 0, 0.3);
    }

    .buy-btn.can-buy:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(255, 165, 0, 0.5);
    }

    .buy-btn.cannot-buy {
      background: #BDC3C7;
      color: #fff;
      cursor: not-allowed;
    }

    .item-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 0.7rem;
      font-weight: 800;
      color: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .badge-owned {
      background: linear-gradient(135deg, #2ECC71, #27AE60);
    }

    .badge-equipped {
      background: linear-gradient(135deg, #3498DB, #2980B9);
    }

    /* ========== 底部预览区 ========== */
    .preview-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: linear-gradient(180deg, rgba(255,255,255,0.98) 0%, rgba(255,248,220,0.98) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 -4px 24px rgba(0,0,0,0.08);
      border-radius: 24px 24px 0 0;
      padding: 16px 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .preview-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #8B4513;
      opacity: 0.7;
    }

    .egg-preview {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .preview-egg-body {
      width: 70px;
      height: 85px;
      background: linear-gradient(180deg, #FFE066 0%, #FFD200 40%, #FFAA00 100%);
      border-radius: 50% 50% 48% 48% / 58% 58% 42% 42%;
      position: relative;
      box-shadow: inset -6px -6px 16px rgba(200, 130, 0, 0.2), inset 6px 6px 16px rgba(255, 255, 255, 0.4), 0 6px 20px rgba(0,0,0,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .preview-accessory {
      font-size: 1.8rem;
      position: absolute;
      top: -12px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
    }

    .preview-back {
      font-size: 1.4rem;
      position: absolute;
      right: -12px;
      top: 15px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
    }

    .preview-glasses {
      font-size: 1.2rem;
      position: absolute;
      top: 22px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
    }

    .preview-outfit {
      font-size: 1.6rem;
      position: absolute;
      bottom: 5px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
    }

    .preview-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .preview-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    .preview-equipped-list {
      font-size: 0.8rem;
      color: var(--text-muted);
      max-width: 180px;
      line-height: 1.4;
    }

    /* ========== 响应式优化 ========== */
    @media (min-width: 768px) {
      .shop-header { padding: 16px 32px; }
      .shop-title { font-size: 1.6rem; }
      .shop-main { padding: 28px 24px 180px; }
      .item-icon { width: 80px; height: 80px; font-size: 3.2rem; }
      .preview-egg-body { width: 80px; height: 95px; }
    }
  </style>
</head>
<body>

  <!-- 顶部导航 -->
  <header class="shop-header">
    <a href="hall.html" class="back-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      返回大厅
    </a>
    <h1 class="shop-title">装扮商店</h1>
    <div class="coin-display">
      <span class="coin-icon">$</span>
      <span id="currentCoins">1,280</span>
    </div>
  </header>

  <!-- 主内容 -->
  <main class="shop-main">
    <!-- 分类标签 -->
    <div class="category-tabs">
      <button class="category-tab active" data-category="all">全部</button>
      <button class="category-tab" data-category="hat">帽子</button>
      <button class="category-tab" data-category="glasses">眼镜</button>
      <button class="category-tab" data-category="back">背饰</button>
      <button class="category-tab" data-category="outfit">服装</button>
    </div>

    <!-- 商品网格 -->
    <div class="shop-grid" id="shopGrid">
      <!-- 皇冠 -->
      <div class="shop-item" data-category="hat" data-price="500" data-owned="false" data-equipped="false">
        <div class="item-icon">👑</div>
        <div class="item-name">皇冠</div>
        <div class="item-price"><span class="coin-small">$</span>500</div>
        <button class="buy-btn can-buy">购买</button>
      </div>
      <!-- 魔法帽 -->
      <div class="shop-item" data-category="hat" data-price="400" data-owned="false" data-equipped="false">
        <div class="item-icon">🎩</div>
        <div class="item-name">魔法帽</div>
        <div class="item-price"><span class="coin-small">$</span>400</div>
        <button class="buy-btn can-buy">购买</button>
      </div>
      <!-- 飞行员帽 -->
      <div class="shop-item" data-category="hat" data-price="350" data-owned="false" data-equipped="false">
        <div class="item-icon">🧢</div>
        <div class="item-name">飞行员帽</div>
        <div class="item-price"><span class="coin-small">$</span>350</div>
        <button class="buy-btn can-buy">购买</button>
      </div>
      <!-- 墨镜 -->
      <div class="shop-item" data-category="glasses" data-price="300" data-owned="true" data-equipped="true">
        <span class="item-badge badge-equipped">装备中</span>
        <div class="item-icon">🕶️</div>
        <div class="item-name">墨镜</div>
        <div class="item-price"><span class="coin-small">$</span>300</div>
        <button class="buy-btn can-buy" style="display:none;">购买</button>
      </div>
      <!-- 望远镜 -->
      <div class="shop-item" data-category="glasses" data-price="250" data-owned="false" data-equipped="false">
        <div class="item-icon">🔭</div>
        <div class="item-name">望远镜</div>
        <div class="item-price"><span class="coin-small">$</span>250</div>
        <button class="buy-btn can-buy">购买</button>
      </div>
      <!-- 星星眼镜 -->
      <div class="shop-item" data-category="glasses" data-price="280" data-owned="true" data-equipped="false">
        <span class="item-badge badge-owned">已拥有</span>
        <div class="item-icon">⭐</div>
        <div class="item-name">星星眼镜</div>
        <div class="item-price"><span class="coin-small">$</span>280</div>
        <button class="buy-btn can-buy" style="display:none;">购买</button>
      </div>
      <!-- 小翅膀 -->
      <div class="shop-item" data-category="back" data-price="450" data-owned="false" data-equipped="false">
        <div class="item-icon">🪽</div>
        <div class="item-name">小翅膀</div>
        <div class="item-price"><span class="coin-small">$</span>450</div>
        <button class="buy-btn can-buy">购买</button>
      </div>
      <!-- 火箭背包 -->
      <div class="shop-item" data-category="back" data-price="600" data-owned="false" data-equipped="false">
        <div class="item-icon">🚀</div>
        <div class="item-name">火箭背包</div>
        <div class="item-price"><span class="coin-small">$</span>600</div>
        <button class="buy-btn cannot-buy">金币不足</button>
      </div>
      <!-- 恐龙装 -->
      <div class="shop-item" data-category="outfit" data-price="800" data-owned="false" data-equipped="false">
        <div class="item-icon">🦖</div>
        <div class="item-name">恐龙装</div>
        <div class="item-price"><span class="coin-small">$</span>800</div>
        <button class="buy-btn cannot-buy">金币不足</button>
      </div>
      <!-- 超人披风 -->
      <div class="shop-item" data-category="outfit" data-price="700" data-owned="false" data-equipped="false">
        <div class="item-icon">🦸</div>
        <div class="item-name">超人披风</div>
        <div class="item-price"><span class="coin-small">$</span>700</div>
        <button class="buy-btn cannot-buy">金币不足</button>
      </div>
    </div>
  </main>

  <!-- 底部预览区 -->
  <div class="preview-bar">
    <div class="preview-label">当前蛋仔</div>
    <div class="egg-preview">
      <div class="preview-egg-body">
        <span class="preview-accessory">🧢</span>
        <span class="preview-glasses">🕶️</span>
        <span class="preview-back">🪽</span>
        <span class="preview-outfit">🦸</span>
      </div>
      <div class="preview-info">
        <div class="preview-name">小蛋仔</div>
        <div class="preview-equipped-list">已装备: 飞行员帽、墨镜</div>
      </div>
    </div>
  </div>

  <script>
    const currentCoins = 1280;

    // 分类筛选
    document.querySelectorAll('.category-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const category = tab.dataset.category;
        document.querySelectorAll('.shop-item').forEach(item => {
          if (category === 'all' || item.dataset.category === category) {
            item.style.display = 'flex';
          } else {
            item.style.display = 'none';
          }
        });
      });
    });

    // 购买按钮点击
    document.querySelectorAll('.buy-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const item = this.closest('.shop-item');
        const price = parseInt(item.dataset.price);
        const owned = item.dataset.owned === 'true';

        if (owned) {
          // 切换装备状态
          const equipped = item.dataset.equipped === 'true';
          item.dataset.equipped = !equipped;
          let badge = item.querySelector('.item-badge');
          if (!equipped) {
            if (!badge) {
              badge = document.createElement('span');
              badge.className = 'item-badge badge-equipped';
              item.prepend(badge);
            }
            badge.textContent = '装备中';
            badge.className = 'item-badge badge-equipped';
            this.textContent = '卸下';
          } else {
            if (badge) {
              badge.textContent = '已拥有';
              badge.className = 'item-badge badge-owned';
            }
            this.textContent = '装备';
          }
        } else if (currentCoins >= price) {
          if (confirm('确定花费 ' + price + ' 金币购买 ' + item.querySelector('.item-name').textContent + ' 吗？')) {
            item.dataset.owned = 'true';
            item.dataset.equipped = 'true';
            let badge = item.querySelector('.item-badge');
            if (!badge) {
              badge = document.createElement('span');
              item.prepend(badge);
            }
            badge.textContent = '装备中';
            badge.className = 'item-badge badge-equipped';
            this.style.display = 'none';
            alert('购买成功！已自动装备');
          }
        }
      });
    });
  </script>

</body>
</html>
