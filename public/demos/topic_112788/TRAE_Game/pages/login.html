<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>欢迎回来 - 蛋仔学园</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(180deg, #87CEEB 0%, #B8E0F7 40%, #D6EAF8 70%, #E8F4FF 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ========== 页面布局 ========== */
    .login-page {
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* ========== 左侧插画区（仅桌面端） ========== */
    .login-illustration {
      display: none;
      flex: 1;
      max-width: 500px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 40px;
    }

    .illustration-egg {
      width: 180px;
      height: 220px;
      position: relative;
      animation: eggBounce 2s ease-in-out infinite;
    }

    .ill-egg-body {
      width: 160px;
      height: 190px;
      background: linear-gradient(180deg, #FFE066 0%, #FFD200 40%, #FFAA00 100%);
      border-radius: 50% 50% 48% 48% / 58% 58% 42% 42%;
      position: absolute;
      bottom: 20px;
      left: 10px;
      box-shadow: inset -10px -10px 24px rgba(200, 130, 0, 0.2), inset 10px 10px 24px rgba(255, 255, 255, 0.4), 0 12px 40px rgba(0,0,0,0.12);
      overflow: hidden;
    }

    .ill-egg-body::before {
      content: '';
      position: absolute;
      top: 20px; left: 25px;
      width: 40px; height: 25px;
      background: rgba(255,255,255,0.35);
      border-radius: 50%;
      transform: rotate(-20deg);
    }

    .ill-egg-face {
      position: absolute;
      top: 55px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .ill-egg-eyes {
      display: flex;
      gap: 28px;
    }

    .ill-egg-eye {
      width: 16px;
      height: 22px;
      background: #2C3E50;
      border-radius: 50%;
      position: relative;
      animation: eyeBlink 4s ease-in-out infinite;
    }

    .ill-egg-eye::after {
      content: '';
      position: absolute;
      top: 4px; right: 4px;
      width: 6px; height: 6px;
      background: #fff;
      border-radius: 50%;
    }

    .ill-egg-mouth {
      width: 22px;
      height: 12px;
      border-bottom: 3px solid #2C3E50;
      border-radius: 0 0 22px 22px;
    }

    .ill-egg-blush {
      position: absolute;
      top: 78px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 24px;
      pointer-events: none;
    }

    .ill-blush {
      width: 20px; height: 12px;
      background: rgba(255, 107, 107, 0.35);
      border-radius: 50%;
    }

    .ill-egg-shadow {
      width: 120px;
      height: 20px;
      background: rgba(0,0,0,0.1);
      border-radius: 50%;
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      animation: shadowScale 2s ease-in-out infinite;
    }

    @keyframes eggBounce {
      0%, 100% { transform: translateY(0) scaleY(1); }
      40% { transform: translateY(-22px) scaleY(1.02); }
      55% { transform: translateY(-22px) scaleY(1.02); }
      85% { transform: translateY(3px) scaleY(0.98); }
    }

    @keyframes shadowScale {
      0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.1; }
      40%, 55% { transform: translateX(-50%) scale(0.8); opacity: 0.05; }
      85% { transform: translateX(-50%) scale(1.05); opacity: 0.12; }
    }

    @keyframes eyeBlink {
      0%, 45%, 55%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.1); }
    }

    .illustration-slogan {
      font-size: 1.5rem;
      font-weight: 900;
      color: #2C3E50;
      text-align: center;
      line-height: 1.5;
      text-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .illustration-slogan span {
      color: #FF6B6B;
    }

    /* ========== 登录卡片 ========== */
    .login-card {
      background: #fff;
      border-radius: 24px;
      padding: 40px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .login-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .logo-egg {
      width: 60px;
      height: 70px;
      background: linear-gradient(180deg, #FFE066 0%, #FFD200 50%, #FFAA00 100%);
      border-radius: 50% 50% 48% 48% / 58% 58% 42% 42%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      box-shadow: 0 6px 20px rgba(255, 170, 0, 0.3);
      position: relative;
    }

    .logo-egg::after {
      content: '';
      position: absolute;
      top: 12px; left: 14px;
      width: 14px; height: 10px;
      background: rgba(255,255,255,0.4);
      border-radius: 50%;
      transform: rotate(-20deg);
    }

    .logo-text {
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--text-dark);
      letter-spacing: 2px;
    }

    .login-heading {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    /* ========== 表单 ========== */
    .login-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-group {
      position: relative;
      width: 100%;
    }

    .input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.2rem;
      opacity: 0.6;
      pointer-events: none;
    }

    .login-input {
      width: 100%;
      padding: 16px 16px 16px 48px;
      border: 2px solid #e8e8e8;
      border-radius: 16px;
      font-size: 1rem;
      font-family: inherit;
      color: var(--text-dark);
      background: #fafafa;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      outline: none;
    }

    .login-input:focus {
      border-color: #4ECDC4;
      box-shadow: 0 0 0 4px rgba(78, 205, 196, 0.15);
      background: #fff;
    }

    .login-input::placeholder {
      color: #bbb;
    }

    .verify-group {
      display: flex;
      gap: 10px;
    }

    .verify-group .input-group {
      flex: 1;
    }

    .verify-group .login-input {
      padding-left: 16px;
    }

    .verify-btn {
      padding: 14px 20px;
      border-radius: 14px;
      background: linear-gradient(135deg, #4ECDC4 0%, #44A08D 100%);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s var(--transition-bounce);
      box-shadow: 0 4px 12px rgba(78, 205, 196, 0.3);
    }

    .verify-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(78, 205, 196, 0.4);
    }

    .verify-btn:active {
      transform: scale(0.97);
    }

    .login-btn {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      background: linear-gradient(135deg, #FFD200 0%, #FFA500 100%);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 800;
      border: none;
      cursor: pointer;
      transition: all 0.2s var(--transition-bounce);
      box-shadow: 0 6px 20px rgba(255, 165, 0, 0.3);
      text-shadow: 0 1px 2px rgba(0,0,0,0.1);
      margin-top: 4px;
    }

    .login-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(255, 165, 0, 0.45);
    }

    .login-btn:active {
      transform: scale(0.98);
    }

    .wechat-btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      background: linear-gradient(135deg, #07C160 0%, #05a350 100%);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s var(--transition-bounce);
      box-shadow: 0 4px 16px rgba(7, 193, 96, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .wechat-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(7, 193, 96, 0.4);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      color: #bbb;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e8e8e8;
    }

    .login-footer {
      font-size: 0.75rem;
      color: #bbb;
      text-align: center;
      line-height: 1.5;
    }

    .login-footer a {
      color: #4ECDC4;
      text-decoration: none;
      font-weight: 500;
    }

    .login-footer a:hover {
      text-decoration: underline;
    }

    /* ========== 响应式 ========== */
    @media (min-width: 900px) {
      .login-page {
        gap: 60px;
        padding: 40px;
      }
      .login-illustration {
        display: flex;
      }
      .login-card {
        padding: 48px 40px;
      }
    }
  </style>
</head>
<body>

  <div class="login-page">
    <!-- 左侧插画（桌面端显示） -->
    <div class="login-illustration">
      <div class="illustration-egg">
        <div class="ill-egg-body">
          <div class="ill-egg-face">
            <div class="ill-egg-eyes">
              <div class="ill-egg-eye"></div>
              <div class="ill-egg-eye"></div>
            </div>
            <div class="ill-egg-mouth"></div>
          </div>
          <div class="ill-egg-blush">
            <div class="ill-blush"></div>
            <div class="ill-blush"></div>
          </div>
        </div>
        <div class="ill-egg-shadow"></div>
      </div>
      <div class="illustration-slogan">
        和蛋仔一起<br><span>快乐学习</span>
      </div>
    </div>

    <!-- 登录卡片 -->
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-egg">🥚</div>
        <div class="logo-text">蛋仔学园</div>
      </div>

      <div class="login-heading">欢迎回来</div>

      <form class="login-form" onsubmit="event.preventDefault(); handleLogin();">
        <div class="input-group">
          <span class="input-icon">📱</span>
          <input type="tel" class="login-input" placeholder="请输入手机号" maxlength="11" id="phoneInput">
        </div>

        <div class="verify-group">
          <div class="input-group" style="flex:1;">
            <input type="text" class="login-input" placeholder="验证码" maxlength="6" id="codeInput">
          </div>
          <button type="button" class="verify-btn" id="getCodeBtn" onclick="sendCode()">获取验证码</button>
        </div>

        <button type="submit" class="login-btn">登录 / 注册</button>
      </form>

      <div class="divider">或</div>

      <button class="wechat-btn" onclick="wechatLogin()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178A1.17 1.17 0 0 1 4.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178 1.17 1.17 0 0 1-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 0 1 .598.082l1.584.926a.272.272 0 0 0 .14.047c.134 0 .24-.111.24-.247 0-.06-.023-.12-.038-.177l-.327-1.233a.582.582 0 0 1-.023-.156.49.49 0 0 1 .201-.398C23.024 18.48 24 16.82 24 14.98c0-3.21-2.931-5.837-7.062-6.122zm-2.036 2.96c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.97-.982zm4.844 0c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.97-.982z"/>
        </svg>
        微信扫码登录
      </button>

      <div class="login-footer">
        登录即表示同意<a href="#">用户协议</a>和<a href="#">隐私政策</a>
      </div>
    </div>
  </div>

  <script>
    function sendCode() {
      const phone = document.getElementById('phoneInput').value;
      if (!phone || phone.length !== 11) {
        alert('请输入正确的11位手机号');
        return;
      }
      const btn = document.getElementById('getCodeBtn');
      let seconds = 60;
      btn.disabled = true;
      btn.textContent = seconds + '秒后重试';
      const timer = setInterval(() => {
        seconds--;
        if (seconds <= 0) {
          clearInterval(timer);
          btn.disabled = false;
          btn.textContent = '获取验证码';
        } else {
          btn.textContent = seconds + '秒后重试';
        }
      }, 1000);
      alert('验证码已发送: 123456');
    }

    function handleLogin() {
      const phone = document.getElementById('phoneInput').value;
      const code = document.getElementById('codeInput').value;
      if (!phone || phone.length !== 11) {
        alert('请输入正确的手机号');
        return;
      }
      if (!code || code.length !== 6) {
        alert('请输入6位验证码');
        return;
      }
      alert('登录成功！欢迎回到蛋仔学园');
      window.location.href = 'hall.html';
    }

    function wechatLogin() {
      alert('微信登录功能开发中');
    }
  </script>

</body>
</html>
