<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>选择你的蛋仔伙伴</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="select-page">

<div class="select-container">
  <h1 class="select-title fade-in">选择你的蛋仔伙伴</h1>
  <p class="select-subtitle fade-in">每个蛋仔都有独特的性格，选一个最适合你的吧！</p>

  <div class="character-grid">
    <!-- 小橙蛋 -->
    <div class="character-card fade-in stagger-1" data-character="cheng" onclick="selectCharacter('cheng')">
      <div class="selected-indicator">&#10003;</div>
      <svg class="egg-avatar" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <!-- 身体阴影 -->
        <ellipse cx="60" cy="110" rx="35" ry="8" fill="rgba(0,0,0,0.1)"/>
        <!-- 身体 -->
        <ellipse cx="60" cy="65" rx="50" ry="45" fill="#FF6B6B"/>
        <!-- 身体高光 -->
        <ellipse cx="42" cy="42" rx="18" ry="14" fill="rgba(255,255,255,0.25)"/>
        <!-- 左眼 -->
        <ellipse cx="42" cy="58" rx="10" ry="14" fill="#fff"/>
        <ellipse cx="44" cy="60" rx="5" ry="7" fill="#2C3E50"/>
        <circle cx="46" cy="57" r="2.5" fill="#fff"/>
        <!-- 右眼 -->
        <ellipse cx="78" cy="58" rx="10" ry="14" fill="#fff"/>
        <ellipse cx="76" cy="60" rx="5" ry="7" fill="#2C3E50"/>
        <circle cx="78" cy="57" r="2.5" fill="#fff"/>
        <!-- 腮红 -->
        <ellipse cx="28" cy="72" rx="8" ry="5" fill="rgba(255,150,150,0.5)"/>
        <ellipse cx="92" cy="72" rx="8" ry="5" fill="rgba(255,150,150,0.5)"/>
        <!-- 嘴巴 -->
        <path d="M 52 78 Q 60 86 68 78" stroke="#C0392B" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <!-- 小装饰 -->
        <circle cx="60" cy="28" r="6" fill="rgba(255,255,255,0.4)"/>
      </svg>
      <h3 class="character-name">小橙蛋</h3>
      <p class="character-desc">热情活泼，永远充满能量，喜欢结交新朋友！</p>
      <button class="select-btn" id="btn-cheng" onclick="event.stopPropagation(); selectCharacter('cheng')">选择</button>
    </div>

    <!-- 小青蛋 -->
    <div class="character-card fade-in stagger-2" data-character="qing" onclick="selectCharacter('qing')">
      <div class="selected-indicator">&#10003;</div>
      <svg class="egg-avatar" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="60" cy="110" rx="35" ry="8" fill="rgba(0,0,0,0.1)"/>
        <ellipse cx="60" cy="65" rx="50" ry="45" fill="#4ECDC4"/>
        <ellipse cx="42" cy="42" rx="18" ry="14" fill="rgba(255,255,255,0.25)"/>
        <ellipse cx="42" cy="58" rx="10" ry="14" fill="#fff"/>
        <ellipse cx="44" cy="60" rx="5" ry="7" fill="#2C3E50"/>
        <circle cx="46" cy="57" r="2.5" fill="#fff"/>
        <ellipse cx="78" cy="58" rx="10" ry="14" fill="#fff"/>
        <ellipse cx="76" cy="60" rx="5" ry="7" fill="#2C3E50"/>
        <circle cx="78" cy="57" r="2.5" fill="#fff"/>
        <ellipse cx="28" cy="72" rx="8" ry="5" fill="rgba(255,150,150,0.4)"/>
        <ellipse cx="92" cy="72" rx="8" ry="5" fill="rgba(255,150,150,0.4)"/>
        <path d="M 52 78 Q 60 86 68 78" stroke="#1A7A6D" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <circle cx="60" cy="28" r="6" fill="rgba(255,255,255,0.4)"/>
      </svg>
      <h3 class="character-name">小青蛋</h3>
      <p class="character-desc">聪明冷静，善于思考，是团队里的小智囊！</p>
      <button class="select-btn" id="btn-qing" onclick="event.stopPropagation(); selectCharacter('qing')">选择</button>
    </div>

    <!-- 小黄蛋 -->
    <div class="character-card fade-in stagger-3" data-character="huang" onclick="selectCharacter('huang')">
      <div class="selected-indicator">&#10003;</div>
      <svg class="egg-avatar" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="60" cy="110" rx="35" ry="8" fill="rgba(0,0,0,0.1)"/>
        <ellipse cx="60" cy="65" rx="50" ry="45" fill="#FFD200"/>
        <ellipse cx="42" cy="42" rx="18" ry="14" fill="rgba(255,255,255,0.3)"/>
        <ellipse cx="42" cy="58" rx="10" ry="14" fill="#fff"/>
        <ellipse cx="44" cy="60" rx="5" ry="7" fill="#2C3E50"/>
        <circle cx="46" cy="57" r="2.5" fill="#fff"/>
        <ellipse cx="78" cy="58" rx="10" ry="14" fill="#fff"/>
        <ellipse cx="76" cy="60" rx="5" ry="7" fill="#2C3E50"/>
        <circle cx="78" cy="57" r="2.5" fill="#fff"/>
        <ellipse cx="28" cy="72" rx="8" ry="5" fill="rgba(255,130,130,0.4)"/>
        <ellipse cx="92" cy="72" rx="8" ry="5" fill="rgba(255,130,130,0.4)"/>
        <path d="M 52 78 Q 60 86 68 78" stroke="#B8860B" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <circle cx="60" cy="28" r="6" fill="rgba(255,255,255,0.4)"/>
      </svg>
      <h3 class="character-name">小黄蛋</h3>
      <p class="character-desc">乐观开朗，爱讲笑话，总能给大家带来欢乐！</p>
      <button class="select-btn" id="btn-huang" onclick="event.stopPropagation(); selectCharacter('huang')">选择</button>
    </div>

    <!-- 小粉蛋 -->
    <div class="character-card fade-in stagger-4" data-character="fen" onclick="selectCharacter('fen')">
      <div class="selected-indicator">&#10003;</div>
      <svg class="egg-avatar" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="60" cy="110" rx="35" ry="8" fill="rgba(0,0,0,0.1)"/>
        <ellipse cx="60" cy="65" rx="50" ry="45" fill="#FBC2EB"/>
        <ellipse cx="42" cy="42" rx="18" ry="14" fill="rgba(255,255,255,0.3)"/>
        <ellipse cx="42" cy="58" rx="10" ry="14" fill="#fff"/>
        <ellipse cx="44" cy="60" rx="5" ry="7" fill="#2C3E50"/>
        <circle cx="46" cy="57" r="2.5" fill="#fff"/>
        <ellipse cx="78" cy="58" rx="10" ry="14" fill="#fff"/>
        <ellipse cx="76" cy="60" rx="5" ry="7" fill="#2C3E50"/>
        <circle cx="78" cy="57" r="2.5" fill="#fff"/>
        <ellipse cx="28" cy="72" rx="8" ry="5" fill="rgba(255,120,120,0.4)"/>
        <ellipse cx="92" cy="72" rx="8" ry="5" fill="rgba(255,120,120,0.4)"/>
        <path d="M 52 78 Q 60 86 68 78" stroke="#C71585" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <circle cx="60" cy="28" r="6" fill="rgba(255,255,255,0.4)"/>
      </svg>
      <h3 class="character-name">小粉蛋</h3>
      <p class="character-desc">温柔细心，乐于助人，是大家最贴心的小伙伴！</p>
      <button class="select-btn" id="btn-fen" onclick="event.stopPropagation(); selectCharacter('fen')">选择</button>
    </div>
  </div>

  <div class="action-area">
    <button class="next-btn" id="nextBtn" onclick="showGradeSection()">下一步</button>

    <div class="grade-section" id="gradeSection">
      <h3 class="grade-title">请选择你的年级</h3>
      <div class="grade-buttons">
        <button class="grade-btn" data-grade="3" onclick="selectGrade('3')">三年级</button>
        <button class="grade-btn" data-grade="4" onclick="selectGrade('4')">四年级</button>
        <button class="grade-btn" data-grade="5" onclick="selectGrade('5')">五年级</button>
      </div>
    </div>

    <button class="start-btn" id="startBtn" onclick="startAdventure()">开始冒险</button>
  </div>
</div>

<script>
let selectedCharacter = null;
let selectedGrade = null;

function selectCharacter(character) {
  // 如果点击的是已选中的角色，则取消选择
  if (selectedCharacter === character) {
    selectedCharacter = null;
    document.querySelectorAll('.character-card').forEach(card => {
      card.classList.remove('selected');
    });
    document.querySelectorAll('.select-btn').forEach(btn => {
      btn.classList.remove('selected');
      btn.textContent = '选择';
    });
    document.getElementById('nextBtn').classList.remove('visible');
    hideGradeSection();
    return;
  }

  // 更新选中状态
  selectedCharacter = character;

  // 重置所有卡片
  document.querySelectorAll('.character-card').forEach(card => {
    card.classList.remove('selected');
  });
  document.querySelectorAll('.select-btn').forEach(btn => {
    btn.classList.remove('selected');
    btn.textContent = '选择';
  });

  // 高亮选中的卡片
  const card = document.querySelector('[data-character="' + character + '"]');
  if (card) {
    card.classList.add('selected');
  }

  const btn = document.getElementById('btn-' + character);
  if (btn) {
    btn.classList.add('selected');
    btn.textContent = '已选中';
  }

  // 显示下一步按钮
  document.getElementById('nextBtn').classList.add('visible');

  // 如果年级已选，隐藏开始按钮等待重新确认
  if (selectedGrade) {
    document.getElementById('startBtn').classList.remove('visible');
  }
}

function showGradeSection() {
  const section = document.getElementById('gradeSection');
  section.classList.add('visible');
  // 滚动到年级选择区域
  setTimeout(() => {
    section.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 300);
}

function hideGradeSection() {
  const section = document.getElementById('gradeSection');
  section.classList.remove('visible');
  document.getElementById('startBtn').classList.remove('visible');
  selectedGrade = null;
  document.querySelectorAll('.grade-btn').forEach(btn => {
    btn.classList.remove('selected');
  });
}

function selectGrade(grade) {
  // 如果点击的是已选中的年级，则取消选择
  if (selectedGrade === grade) {
    selectedGrade = null;
    document.querySelectorAll('.grade-btn').forEach(btn => {
      btn.classList.remove('selected');
    });
    document.getElementById('startBtn').classList.remove('visible');
    return;
  }

  selectedGrade = grade;

  document.querySelectorAll('.grade-btn').forEach(btn => {
    btn.classList.remove('selected');
  });

  const btn = document.querySelector('[data-grade="' + grade + '"]');
  if (btn) {
    btn.classList.add('selected');
  }

  // 显示开始冒险按钮
  document.getElementById('startBtn').classList.add('visible');
}

function startAdventure() {
  if (!selectedCharacter || !selectedGrade) {
    alert('请先选择蛋仔伙伴和年级哦！');
    return;
  }

  const characterNames = {
    'cheng': '小橙蛋',
    'qing': '小青蛋',
    'huang': '小黄蛋',
    'fen': '小粉蛋'
  };

  alert('太棒了！' + characterNames[selectedCharacter] + '将陪你一起开始' + selectedGrade + '年级的冒险之旅！');
  // 这里可以跳转到游戏主页面
  // window.location.href = 'game.html?character=' + selectedCharacter + '&grade=' + selectedGrade;
}
</script>

</body>
</html>
