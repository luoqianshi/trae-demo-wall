<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>蛋仔学园 - 游戏大厅</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    /* ========== 页面专属基础样式 ========== */
    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(180deg, #4FA8F7 0%, #87CEEB 35%, #B8E0F7 60%, #90D66B 60%, #6BC452 100%);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* ========== 云朵背景 ========== */
    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 50px;
      opacity: 0.9;
      animation: cloudFloat 20s ease-in-out infinite;
    }
    .cloud::before,
    .cloud::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 50%;
    }
    .cloud-1 {
      width: 120px; height: 40px;
      top: 8%; left: 10%;
      animation-delay: 0s;
    }
    .cloud-1::before { width: 50px; height: 50px; top: -25px; left: 15px; }
    .cloud-1::after { width: 40px; height: 40px; top: -18px; left: 55px; }

    .cloud-2 {
      width: 100px; height: 35px;
      top: 15%; right: 15%;
      animation-delay: -7s;
    }
    .cloud-2::before { width: 45px; height: 45px; top: -22px; left: 12px; }
    .cloud-2::after { width: 35px; height: 35px; top: -15px; left: 50px; }

    .cloud-3 {
      width: 140px; height: 45px;
      top: 5%; left: 55%;
      animation-delay: -12s;
    }
    .cloud-3::before { width: 55px; height: 55px; top: -28px; left: 20px; }
    .cloud-3::after { width: 45px; height: 45px; top: -20px; left: 65px; }

    .cloud-4 {
      width: 90px; height: 30px;
      top: 22%; left: 30%;
      animation-delay: -5s;
      opacity: 0.6;
    }
    .cloud-4::before { width: 40px; height: 40px; top: -20px; left: 10px; }
    .cloud-4::after { width: 30px; height: 30px; top: -12px; left: 45px; }

    @keyframes cloudFloat {
      0%, 100% { transform: translateX(0) translateY(0); }
      25% { transform: translateX(15px) translateY(-5px); }
      50% { transform: translateX(-10px) translateY(3px); }
      75% { transform: translateX(8px) translateY(-3px); }
    }

    /* ========== 顶部信息栏 ========== */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: linear-gradient(180deg, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.8) 100%);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 2px 16px rgba(0,0,0,0.06);
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .streak-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      background: linear-gradient(135deg, #FF6B35 0%, #FF9E44 100%);
      color: #fff;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      box-shadow: 0 3px 10px rgba(255, 107, 53, 0.3);
      animation: pulse-glow 2s ease-in-out infinite;
    }

    .streak-badge svg {
      width: 18px; height: 18px;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.2));
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FFD200 0%, #FFAA00 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      box-shadow: 0 3px 10px rgba(255, 170, 0, 0.3);
      border: 2px solid #fff;
    }

    .user-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nickname {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    .level-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: linear-gradient(90deg, #4ECDC4, #44A08D);
      color: #fff;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.7rem;
      font-weight: 700;
      width: fit-content;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .currency-bar {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .currency-item {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(255,255,255,0.9);
      padding: 5px 10px;
      border-radius: 16px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-dark);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border: 1px solid rgba(0,0,0,0.05);
    }

    .currency-icon {
      width: 18px; height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 0.75rem;
    }

    .coin-icon { background: linear-gradient(135deg, #FFD200, #FFAA00); color: #fff; }
    .star-icon { background: linear-gradient(135deg, #FF6B6B, #FF8E53); color: #fff; }

    .notif-bell {
      position: relative;
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: transform 0.2s var(--transition-bounce), box-shadow 0.2s ease;
      border: 1px solid rgba(0,0,0,0.05);
    }

    .notif-bell:hover {
      transform: scale(1.1) rotate(10deg);
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    }

    .notif-bell:active { transform: scale(0.95); }

    .notif-badge {
      position: absolute;
      top: -2px; right: -2px;
      background: #FF4757;
      color: #fff;
      font-size: 0.65rem;
      font-weight: 800;
      width: 18px; height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fff;
      animation: pulse-glow 2s ease-in-out infinite;
    }

    /* ========== 主场景区域 ========== */
    .game-scene {
      position: relative;
      width: 100%;
      min-height: 100vh;
      padding-top: 80px;
      padding-bottom: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ========== 浮动星球 ========== */
    .planet-container {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.3s var(--transition-bounce);
      z-index: 10;
    }

    .planet-container:hover {
      transform: scale(1.15) translateY(-5px);
    }

    .planet-container:hover .planet {
      animation-play-state: paused;
      box-shadow: 0 12px 40px rgba(0,0,0,0.2);
    }

    .planet-container:active {
      transform: scale(0.95);
    }

    .planet {
      width: 90px; height: 90px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 900;
      color: #fff;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      position: relative;
      animation: planetFloat 4s ease-in-out infinite;
      transition: box-shadow 0.3s ease;
      border: 3px solid rgba(255,255,255,0.4);
    }

    .planet-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .planet-symbol {
      font-size: 1.4rem;
      font-weight: 900;
      text-shadow: 0 2px 4px rgba(0,0,0,0.15);
    }

    .planet-name {
      font-size: 0.75rem;
      font-weight: 700;
      text-shadow: 0 1px 2px rgba(0,0,0,0.15);
    }

    .planet-locked .planet {
      filter: grayscale(0.3);
      opacity: 0.85;
    }

    .planet-locked .planet::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: rgba(0,0,0,0.15);
    }

    .lock-icon {
      position: absolute;
      z-index: 2;
      font-size: 1.2rem;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }

    .planet-progress {
      background: rgba(255,255,255,0.95);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-dark);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border: 1px solid rgba(0,0,0,0.05);
    }

    .planet-math {
      top: 18%; left: 8%;
    }
    .planet-math .planet {
      background: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%);
      animation-delay: 0s;
    }

    .planet-english {
      top: 14%; right: 8%;
    }
    .planet-english .planet {
      background: linear-gradient(135deg, #4ECDC4 0%, #44A08D 100%);
      animation-delay: -1s;
    }

    .planet-chinese {
      bottom: 22%; right: 6%;
    }
    .planet-chinese .planet {
      background: linear-gradient(135deg, #FFD200 0%, #FFAA00 100%);
      animation-delay: -2s;
    }

    .planet-science {
      bottom: 26%; left: 6%;
    }
    .planet-science .planet {
      background: linear-gradient(135deg, #A18CD1 0%, #7B68EE 100%);
      animation-delay: -3s;
    }

    @keyframes planetFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      33% { transform: translateY(-8px) rotate(2deg); }
      66% { transform: translateY(-4px) rotate(-1deg); }
    }

    /* ========== 蛋仔角色 ========== */
    .egg-character-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: auto;
      margin-bottom: 10vh;
      z-index: 20;
    }

    .level-tag {
      background: linear-gradient(90deg, #FFD200, #FFAA00);
      color: #fff;
      padding: 4px 14px;
      border-radius: 16px;
      font-size: 0.8rem;
      font-weight: 800;
      margin-bottom: 8px;
      box-shadow: 0 4px 12px rgba(255, 170, 0, 0.3);
      border: 2px solid #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.1);
      animation: bounce-soft 2s ease-in-out infinite;
    }

    .egg-character {
      width: 130px;
      height: 150px;
      position: relative;
      animation: eggBounce 1.8s ease-in-out infinite;
    }

    .egg-body {
      width: 110px;
      height: 130px;
      background: linear-gradient(180deg, #FFE066 0%, #FFD200 40%, #FFAA00 100%);
      border-radius: 50% 50% 48% 48% / 58% 58% 42% 42%;
      position: absolute;
      bottom: 10px;
      left: 10px;
      box-shadow:
        inset -8px -8px 20px rgba(200, 130, 0, 0.2),
        inset 8px 8px 20px rgba(255, 255, 255, 0.4),
        0 10px 30px rgba(0,0,0,0.15);
      overflow: hidden;
    }

    .egg-body::before {
      content: '';
      position: absolute;
      top: 15px; left: 20px;
      width: 30px; height: 20px;
      background: rgba(255,255,255,0.35);
      border-radius: 50%;
      transform: rotate(-20deg);
    }

    .egg-face {
      position: absolute;
      top: 45px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .egg-eyes {
      display: flex;
      gap: 22px;
    }

    .egg-eye {
      width: 14px;
      height: 18px;
      background: #2C3E50;
      border-radius: 50%;
      position: relative;
      animation: eyeBlink 4s ease-in-out infinite;
    }

    .egg-eye::after {
      content: '';
      position: absolute;
      top: 3px; right: 3px;
      width: 5px; height: 5px;
      background: #fff;
      border-radius: 50%;
    }

    .egg-mouth {
      width: 18px;
      height: 10px;
      border-bottom: 3px solid #2C3E50;
      border-radius: 0 0 18px 18px;
    }

    .egg-blush {
      position: absolute;
      top: 62px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 18px;
      pointer-events: none;
    }

    .blush {
      width: 16px; height: 10px;
      background: rgba(255, 107, 107, 0.35);
      border-radius: 50%;
    }

    .egg-shadow {
      width: 90px;
      height: 16px;
      background: rgba(0,0,0,0.12);
      border-radius: 50%;
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      animation: shadowScale 1.8s ease-in-out infinite;
    }

    @keyframes eggBounce {
      0%, 100% { transform: translateY(0) scaleY(1); }
      40% { transform: translateY(-18px) scaleY(1.02); }
      55% { transform: translateY(-18px) scaleY(1.02); }
      85% { transform: translateY(2px) scaleY(0.98); }
    }

    @keyframes shadowScale {
      0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.12; }
      40%, 55% { transform: translateX(-50%) scale(0.8); opacity: 0.06; }
      85% { transform: translateX(-50%) scale(1.05); opacity: 0.14; }
    }

    @keyframes eyeBlink {
      0%, 45%, 55%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.1); }
    }

    /* ========== 底部快捷栏 ========== */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: linear-gradient(180deg, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.98) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 -4px 24px rgba(0,0,0,0.08);
      border-radius: 24px 24px 0 0;
      padding: 12px 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bottom-currency {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding-bottom: 8px;
      border-bottom: 1px dashed rgba(0,0,0,0.08);
    }

    .bottom-currency-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    .bottom-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 0.7rem;
      font-weight: 700;
      color: #fff;
      border: none;
      cursor: pointer;
      transition: transform 0.2s var(--transition-bounce), box-shadow 0.2s ease;
      position: relative;
      min-width: 56px;
    }

    .action-btn svg {
      width: 22px; height: 22px;
    }

    .action-btn:hover {
      transform: translateY(-4px) scale(1.08);
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    .action-btn:active {
      transform: translateY(0) scale(0.95);
    }

    .btn-checkin { background: linear-gradient(135deg, #FF6B6B, #FF4757); }
    .btn-shop { background: linear-gradient(135deg, #A18CD1, #7B68EE); }
    .btn-rank { background: linear-gradient(135deg, #4ECDC4, #44A08D); }
    .btn-mine { background: linear-gradient(135deg, #FFAA00, #FF8C00); }
    .btn-parent { background: linear-gradient(135deg, #95A5A6, #7F8C8D); min-width: 48px; padding: 6px 10px; font-size: 0.6rem; }

    .btn-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #FF4757;
      color: #fff;
      font-size: 0.55rem;
      font-weight: 800;
      padding: 2px 5px;
      border-radius: 8px;
      border: 1.5px solid #fff;
      white-space: nowrap;
    }

    /* ========== 装饰性小花小草 ========== */
    .decorations {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 80px;
      pointer-events: none;
      z-index: 5;
    }

    .flower {
      position: absolute;
      bottom: 10px;
      font-size: 1.2rem;
      animation: flowerSway 3s ease-in-out infinite;
      opacity: 0.85;
    }

    .flower-1 { left: 8%; animation-delay: 0s; }
    .flower-2 { left: 22%; animation-delay: -1s; font-size: 1rem; }
    .flower-3 { right: 18%; animation-delay: -2s; }
    .flower-4 { right: 8%; animation-delay: -0.5s; font-size: 0.9rem; }
    .flower-5 { left: 45%; animation-delay: -1.5s; font-size: 0.8rem; }

    @keyframes flowerSway {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }

    /* ========== 响应式适配 ========== */
    @media (min-width: 768px) {
      .top-bar { padding: 16px 32px; }
      .planet { width: 110px; height: 110px; font-size: 2rem; }
      .planet-symbol { font-size: 1.8rem; }
      .planet-name { font-size: 0.85rem; }
      .egg-character { width: 160px; height: 190px; }
      .egg-body { width: 140px; height: 170px; }
      .bottom-actions { gap: 16px; }
      .action-btn { min-width: 72px; padding: 10px 16px; font-size: 0.8rem; }
      .action-btn svg { width: 26px; height: 26px; }
    }

    @media (max-width: 380px) {
      .planet { width: 75px; height: 75px; font-size: 1.2rem; }
      .planet-symbol { font-size: 1.1rem; }
      .egg-character { width: 110px; height: 130px; }
      .egg-body { width: 95px; height: 115px; }
      .action-btn { min-width: 48px; padding: 6px 8px; font-size: 0.6rem; }
    }
  </style>
</head>
<body>

  <!-- 云朵装饰 -->
  <div class="cloud cloud-1"></div>
  <div class="cloud cloud-2"></div>
  <div class="cloud cloud-3"></div>
  <div class="cloud cloud-4"></div>

  <!-- 顶部信息栏 -->
  <header class="top-bar">
    <div class="top-left">
      <!-- 连续学习天数 -->
      <div class="streak-badge">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M13.5.67s.74 2.65.74 4.8c0 2.06-1.35 3.73-3.41 3.73-2.07 0-3.63-1.67-3.63-3.73l.03-.36C5.21 7.51 4 10.62 4 14c0 4.42 3.58 8 8 8s8-3.58 8-8C20 8.61 17.41 3.8 13.5.67zM11.71 19c-1.78 0-3.22-1.4-3.22-3.14 0-1.62 1.05-2.76 2.81-3.12 1.77-.36 3.6-1.21 4.62-2.58.39 1.29.59 2.65.59 4.04 0 2.65-2.15 4.8-4.8 4.8z"/>
        </svg>
        <span>连续7天</span>
      </div>
      <div class="user-info">
        <div class="avatar">🥚</div>
        <div class="user-meta">
          <span class="nickname">小蛋仔</span>
          <span class="level-badge">⭐ Lv.5</span>
        </div>
      </div>
    </div>

    <div class="top-right">
      <div class="currency-bar">
        <div class="currency-item">
          <span class="currency-icon coin-icon">$</span>
          <span>1,280</span>
        </div>
        <div class="currency-item">
          <span class="currency-icon star-icon">★</span>
          <span>56</span>
        </div>
      </div>
      <!-- 通知铃铛 -->
      <div class="notif-bell" onclick="alert('通知列表')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span class="notif-badge">3</span>
      </div>
    </div>
  </header>

  <!-- 主游戏场景 -->
  <main class="game-scene">

    <!-- 数学星球（左上） -->
    <div class="planet-container planet-math" onclick="enterPlanet('math')">
      <div class="planet">
        <div class="planet-inner">
          <span class="planet-symbol">+ × ÷</span>
          <span class="planet-name">数学</span>
        </div>
      </div>
      <span class="planet-progress">3/5 关卡</span>
    </div>

    <!-- 英语星球（右上） -->
    <div class="planet-container planet-english" onclick="enterPlanet('english')">
      <div class="planet">
        <div class="planet-inner">
          <span class="planet-symbol">ABC</span>
          <span class="planet-name">英语</span>
        </div>
      </div>
      <span class="planet-progress">2/5 关卡</span>
    </div>

    <!-- 语文星球（右下，锁定） -->
    <div class="planet-container planet-chinese planet-locked" onclick="alert('语文星球需要完成英语星球第5关后解锁！')">
