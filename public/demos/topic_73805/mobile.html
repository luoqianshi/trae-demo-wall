<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>打勾 · 企业 SOP 协作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#3b82f6; --bg-2:#60a5fa; --bg-3:#93c5fd; --bg-4:#bfdbfe;
    --text:#1e2435; --text-2:#6b7280; --text-3:#9ca3af;
    --grad: linear-gradient(135deg,#3b82f6,#60a5fa);
    --grad-soft: linear-gradient(135deg,rgba(59,130,246,.12),rgba(96,165,250,.12));
    --r-s:12px; --r-m:16px; --r-l:24px;
    --glass: rgba(255,255,255,0.6);
    --glass-border: rgba(255,255,255,0.65);
    --glass-shadow: 0 8px 32px rgba(31,38,135,0.12);
    --sans: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --serif: 'Noto Serif SC', 'Noto Sans SC', serif;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:var(--sans);
    color:var(--text);
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:24px 12px;
    background:
      radial-gradient(circle at 18% 12%, rgba(59,130,246,.55), transparent 42%),
      radial-gradient(circle at 82% 18%, rgba(96,165,250,.50), transparent 45%),
      radial-gradient(circle at 75% 82%, rgba(59,130,246,.50), transparent 48%),
      radial-gradient(circle at 20% 88%, rgba(147,197,253,.45), transparent 45%),
      linear-gradient(135deg,#ffffff,#f0f9ff 55%,#eff6ff);
    background-attachment:fixed;
  }

  /* ===== Phone Frame ===== */
  .phone{
    position:relative;
    width:390px; height:844px;
    background:#0b0b12;
    border-radius:54px;
    padding:13px;
    box-shadow:
      0 0 0 2px #2a2a35,
      0 30px 70px -20px rgba(40,30,90,.55),
      0 50px 120px -30px rgba(59,130,246,.45);
  }
  .phone-screen{
    position:relative;
    width:100%; height:100%;
    border-radius:42px;
    overflow:hidden;
    background:
      radial-gradient(circle at 20% 0%, rgba(59,130,246,.18), transparent 50%),
      radial-gradient(circle at 90% 10%, rgba(96,165,250,.16), transparent 45%),
      radial-gradient(circle at 80% 100%, rgba(59,130,246,.14), transparent 50%),
      linear-gradient(180deg,#f0f9ff,#f5faff);
    display:flex; flex-direction:column;
  }
  /* notch */
  .notch{
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:120px; height:26px;
    background:#0b0b12; border-radius:0 0 18px 18px;
    z-index:60;
  }
  /* status bar */
  .statusbar{
    height:44px; flex:0 0 44px;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 26px 0 28px;
    font-size:14px; font-weight:700; color:var(--text);
    position:relative; z-index:50;
  }
  .statusbar .right{display:flex; align-items:center; gap:6px;}

  /* home indicator */
  .home-bar{
    position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
    width:134px; height:5px; border-radius:3px;
    background:rgba(30,36,53,.35); z-index:60;
  }

  /* scroll area */
  .app-body{
    flex:1; overflow-y:auto; overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    padding-bottom:84px;
  }
  .app-body::-webkit-scrollbar{width:0;}

  /* ===== Top Nav ===== */
  .topnav{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 18px 12px;
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    background:rgba(255,255,255,0.55);
    border-bottom:1px solid rgba(255,255,255,0.6);
  }
  .brand{display:flex; align-items:center; gap:8px;}
  .brand .logo-badge{
    width:30px; height:30px; border-radius:9px; background:var(--grad);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 12px rgba(59,130,246,.4);
  }
  .brand .name{font-family:var(--serif); font-weight:900; font-size:19px; letter-spacing:.5px;}
  .topnav .actions{display:flex; align-items:center; gap:12px;}
  .bell{position:relative; width:34px; height:34px; border-radius:10px;
    background:rgba(255,255,255,.7); border:1px solid var(--glass-border);
    display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .bell .dot{position:absolute; top:7px; right:8px; width:7px; height:7px; border-radius:50%;
    background:#ef4444; border:1.5px solid #fff;}
  .avatar-btn{width:34px; height:34px; border-radius:50%; border:2px solid #fff;
    cursor:pointer; font-weight:700; font-size:13px; color:#fff;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 12px rgba(0,0,0,.12);}

  /* ===== Glass card ===== */
  .glass{
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    background:var(--glass);
    border:1px solid var(--glass-border);
    box-shadow:var(--glass-shadow);
  }

  /* ===== Content ===== */
  .section-pad{padding:16px 16px 8px;}
  .page-title{font-family:var(--serif); font-size:24px; font-weight:900; letter-spacing:.5px;}
  .page-sub{font-size:13px; color:var(--text-2); margin-top:4px;}

  .notice{
    margin:6px 16px 4px; padding:12px 14px; border-radius:var(--r-m);
    display:flex; align-items:center; gap:10px; font-size:13px; color:#2563eb;
  }
  .notice .ico{width:28px;height:28px;border-radius:8px; flex:0 0 28px;
    background:var(--grad-soft); display:flex;align-items:center;justify-content:center;}

  /* todo card */
  .todo-card{
    margin:0 16px 12px; padding:16px; border-radius:var(--r-l);
    display:flex; flex-direction:column; gap:10px;
    transition:transform .15s ease;
    animation:fadeUp .45s ease both;
  }
  .todo-card:active{transform:scale(.985);}
  .todo-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .todo-title{font-size:16px; font-weight:700; line-height:1.35;}
  .cycle-tag{font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px;
    background:var(--grad-soft); color:#7c3aed; white-space:nowrap;}
  .todo-node{
    display:flex; align-items:center; gap:8px;
    background:rgba(59,130,246,.08); padding:9px 12px; border-radius:var(--r-s);
    border:1px dashed rgba(59,130,246,.35);
  }
  .todo-node .av{width:22px;height:22px;border-radius:50%; color:#fff; font-size:11px; font-weight:700;
    display:flex;align-items:center;justify-content:center;}
  .todo-node .txt{font-size:13px; color:var(--text);}
  .todo-node .txt b{color:#2563eb;}
  .todo-foot{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .deadline{font-size:12px; color:var(--text-2); display:flex; align-items:center; gap:4px;}
  .go-btn{
    background:var(--grad); color:#fff; border:none; cursor:pointer;
    padding:9px 16px; border-radius:var(--r-s); font-size:13px; font-weight:600;
    box-shadow:0 6px 16px rgba(59,130,246,.35);
    display:flex; align-items:center; gap:5px;
  }
  .go-btn:active{transform:translateY(1px);}

  /* section label */
  .sec-label{font-size:12px; font-weight:700; color:var(--text-3); letter-spacing:1px;
    padding:14px 18px 6px; text-transform:uppercase;}

  /* empty */
  .empty{padding:50px 30px; text-align:center; color:var(--text-2); font-size:13px;}
  .empty .ico{margin:0 auto 12px; opacity:.5;}

  /* ===== Detail ===== */
  .detail-top{padding:14px 16px 6px; display:flex; align-items:center; gap:10px;}
  .back-btn{width:36px;height:36px;border-radius:11px; border:1px solid var(--glass-border);
    background:rgba(255,255,255,.7); display:flex;align-items:center;justify-content:center; cursor:pointer;}
  .detail-title-wrap{flex:1; min-width:0;}
  .detail-title{font-size:17px; font-weight:700; line-height:1.3;}
  .detail-meta{font-size:12px; color:var(--text-2); margin-top:3px; display:flex; gap:8px; align-items:center;}
  .status-pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;}
  .status-doing{background:rgba(59,130,246,.14); color:#2563eb;}
  .status-done{background:rgba(16,185,129,.16); color:#059669;}
  .status-pending{background:rgba(156,163,175,.18); color:#6b7280;}

  .info-card{margin:8px 16px 12px; padding:14px 16px; border-radius:var(--r-l);}
  .info-row{display:flex; align-items:center; gap:8px; font-size:13px; padding:5px 0; color:var(--text);}
  .info-row .lbl{color:var(--text-2); width:64px; flex:0 0 64px;}
  .progress-bar{height:6px; border-radius:4px; background:rgba(59,130,246,.15); overflow:hidden; margin-top:8px;}
  .progress-fill{height:100%; background:var(--grad); border-radius:4px; transition:width .5s ease;}

  /* flow */
  .flow{padding:6px 16px 10px;}
  .flow-node{display:flex; gap:12px; position:relative;}
  .flow-rail{display:flex; flex-direction:column; align-items:center; flex:0 0 28px;}
  .flow-dot{width:28px;height:28px;border-radius:50%; display:flex;align-items:center;justify-content:center;
    background:#fff; border:2px solid #d1d5db; z-index:2; transition:all .3s;}
  .flow-dot.done{background:var(--grad); border-color:transparent;}
  .flow-dot.current{background:#fff; border-color:#3b82f6; box-shadow:0 0 0 5px rgba(59,130,246,.18); animation:pulse 1.8s infinite;}
  .flow-line{width:2px; flex:1; min-height:18px; background:#e5e7eb; margin:2px 0;}
  .flow-line.done{background:var(--grad);}
  .flow-body{flex:1; padding-bottom:14px;}
  .flow-body .fn-title{font-size:14px; font-weight:600; display:flex; align-items:center; gap:7px;}
  .flow-body .fn-meta{font-size:12px; color:var(--text-2); margin-top:4px; display:flex; align-items:center; gap:6px;}
  .flow-body .fn-meta .av{width:18px;height:18px;border-radius:50%;color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .current-card{
    margin-top:8px; padding:12px; border-radius:var(--r-m);
    border:1.5px solid rgba(59,130,246,.4); background:rgba(59,130,246,.06);
  }
  .current-card .ct{font-size:12px; color:var(--text-2); margin-bottom:4px;}
  .current-card .cd{font-size:13px; line-height:1.5;}
  .node-done-card{margin-top:6px; padding:9px 11px; border-radius:10px; background:rgba(16,185,129,.07); border:1px solid rgba(16,185,129,.18);}
  .node-done-card .f{font-size:11px; color:#059669; display:flex; align-items:center; gap:5px; margin-top:3px;}

  .check-btn{
    margin:14px 16px 8px; width:calc(100% - 32px);
    background:var(--grad); color:#fff; border:none; cursor:pointer;
    padding:15px; border-radius:var(--r-m); font-size:15px; font-weight:700;
    box-shadow:0 10px 26px rgba(59,130,246,.4);
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .check-btn:active{transform:translateY(1px);}
  .wait-note{margin:10px 16px; padding:13px; border-radius:var(--r-m); text-align:center;
    font-size:13px; color:var(--text-2); background:rgba(255,255,255,.5); border:1px dashed rgba(156,163,175,.4);}

  /* ===== Drawer ===== */
  .overlay{position:absolute; inset:0; z-index:70; background:rgba(20,16,50,.4);
    backdrop-filter:blur(3px); animation:fade .25s ease;}
  .drawer{
    position:absolute; left:0; right:0; bottom:0; z-index:71;
    background:#fff; border-radius:24px 24px 0 0;
    padding:8px 18px calc(24px + env(safe-area-inset-bottom));
    max-height:88%; overflow-y:auto;
    animation:slideUp .32s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 -10px 40px rgba(0,0,0,.18);
  }
  .drawer::-webkit-scrollbar{width:0;}
  .drawer-grip{width:40px; height:5px; border-radius:3px; background:#e5e7eb; margin:6px auto 14px;}
  .drawer-h{font-size:17px; font-weight:700; font-family:var(--serif);}
  .drawer-sub{font-size:12px; color:var(--text-2); margin-top:4px; line-height:1.5;}
  .field-label{font-size:13px; font-weight:600; margin:18px 0 8px; display:flex; align-items:center; gap:6px;}
  .upload-zone{
    border:1.5px dashed rgba(59,130,246,.4); border-radius:var(--r-m);
    padding:18px; text-align:center; color:var(--text-2); font-size:13px;
    background:rgba(59,130,246,.04); cursor:pointer;
  }
  .upload-zone:active{background:rgba(59,130,246,.1);}
  .upload-zone .ico{margin:0 auto 8px; color:#3b82f6;}
  .file-chip{
    display:flex; align-items:center; gap:10px; padding:11px 12px; margin-top:8px;
    border-radius:var(--r-s); background:rgba(59,130,246,.08); border:1px solid rgba(59,130,246,.2);
  }
  .file-chip .fname{flex:1; font-size:13px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .file-chip .fsize{font-size:11px; color:var(--text-3);}
  .file-chip .rm{cursor:pointer; color:var(--text-3); padding:4px;}
  textarea.note-input{
    width:100%; border:1.5px solid #e5e7eb; border-radius:var(--r-m);
    padding:12px; font-size:13px; font-family:var(--sans); resize:none; min-height:88px;
    color:var(--text); background:#fafaff;
  }
  textarea.note-input:focus{outline:none; border-color:#3b82f6; background:#fff;}
  .hint{font-size:11px; color:var(--text-3); margin-top:6px; display:flex; align-items:center; gap:4px;}
  .submit-btn{
    margin-top:20px; width:100%;
    background:var(--grad); color:#fff; border:none; cursor:pointer;
    padding:15px; border-radius:var(--r-m); font-size:15px; font-weight:700;
    box-shadow:0 10px 26px rgba(59,130,246,.4);
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .submit-btn:disabled{background:#cbd5e1; box-shadow:none; cursor:not-allowed; color:#fff;}
  .cancel-btn{margin-top:10px; width:100%; background:transparent; border:none; cursor:pointer;
    padding:11px; font-size:14px; color:var(--text-2);}

  /* toast */
  .toast{
    position:absolute; left:50%; bottom:120px; transform:translateX(-50%);
    z-index:90; padding:12px 18px; border-radius:var(--r-m);
    background:rgba(30,36,53,.95); color:#fff; font-size:13px; font-weight:500;
    display:flex; align-items:center; gap:8px; max-width:300px;
    box-shadow:0 12px 30px rgba(0,0,0,.3);
    animation:toastIn .35s ease;
  }

  /* ===== Bottom Tabs ===== */
  .bottom-tabs{
    position:absolute; left:0; right:0; bottom:0; z-index:50;
    height:72px; padding-bottom:18px;
    display:flex; align-items:center; justify-content:space-around;
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    background:rgba(255,255,255,.78);
    border-top:1px solid rgba(255,255,255,.7);
  }
  .tab{display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer;
    color:var(--text-3); font-size:11px; font-weight:600; padding:6px 18px; border-radius:12px;}
  .tab.active{color:#3b82f6;}

  /* ===== Library ===== */
  .folder{
    margin:0 16px 10px; padding:16px; border-radius:var(--r-l);
    display:flex; align-items:center; gap:14px; cursor:pointer;
    transition:transform .15s;
  }
  .folder:active{transform:scale(.98);}
  .folder .ficon{width:46px;height:46px;border-radius:13px; background:var(--grad-soft);
    display:flex;align-items:center;justify-content:center; flex:0 0 46px;}
  .folder .ftxt{flex:1;}
  .folder .ftitle{font-size:15px; font-weight:700;}
  .folder .fsub{font-size:12px; color:var(--text-2); margin-top:2px;}
  .folder .cnt{font-size:12px; color:var(--text-3); font-weight:600;}

  .archive-item{
    margin:0 16px 10px; padding:13px 15px; border-radius:var(--r-m); cursor:pointer;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    transition:transform .15s;
  }
  .archive-item:active{transform:scale(.98);}
  .archive-item .ai-l{display:flex; align-items:center; gap:10px;}
  .archive-item .ai-ico{width:34px;height:34px;border-radius:10px;background:rgba(16,185,129,.12);
    display:flex;align-items:center;justify-content:center;}
  .archive-item .ai-t{font-size:14px; font-weight:600;}
  .archive-item .ai-d{font-size:11px; color:var(--text-2); margin-top:2px;}

  .archive-record{margin:0 16px 8px; padding:12px 14px; border-radius:var(--r-m);
    display:flex; align-items:center; justify-content:space-between; cursor:pointer;}
  .archive-record:active{transform:scale(.98);}

  /* identity switcher */
  .switcher{
    position:absolute; right:14px; top:54px; z-index:80;
    background:#fff; border-radius:var(--r-m); padding:6px;
    box-shadow:0 12px 30px rgba(0,0,0,.18); min-width:170px;
    animation:fadeUp .2s ease;
  }
  .sw-item{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:10px; cursor:pointer;}
  .sw-item:active{background:#f3f4ff;}
  .sw-item.active{background:rgba(59,130,246,.1);}
  .sw-item .av{width:28px;height:28px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .sw-item .nm{font-size:13px; font-weight:600;}
  .sw-item .rl{font-size:11px; color:var(--text-2);}
  .sw-item .me-tag{margin-left:auto; font-size:10px; color:#2563eb; font-weight:700;}

  /* animations */
  @keyframes fadeUp{from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);}}
  @keyframes fade{from{opacity:0;} to{opacity:1;}}
  @keyframes slideUp{from{transform:translateY(100%);} to{transform:translateY(0);}}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 5px rgba(59,130,246,.18);} 50%{box-shadow:0 0 0 9px rgba(59,130,246,.08);}}
  @keyframes toastIn{from{opacity:0; transform:translate(-50%,12px);} to{opacity:1; transform:translate(-50%,0);}}
  @keyframes checkPop{0%{transform:scale(0);} 60%{transform:scale(1.25);} 100%{transform:scale(1);}}
  .check-pop{animation:checkPop .45s cubic-bezier(.2,1.4,.5,1);}

  .view-fade{animation:fadeUp .35s ease both;}

  /* ===== Notif Panel ===== */
  .notif-panel{
    position:absolute; right:14px; top:54px; z-index:81;
    width:320px; max-width:calc(100% - 28px);
    border-radius:var(--r-m); padding:6px;
    backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    background:rgba(255,255,255,0.68);
    border:1px solid rgba(255,255,255,0.75);
    box-shadow:0 16px 40px rgba(20,16,50,.22);
    animation:fadeUp .2s ease;
  }
  .notif-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 10px 6px; border-bottom:1px solid rgba(0,0,0,.06); margin-bottom:4px;
  }
  .notif-head .nt{font-size:14px; font-weight:700; font-family:var(--serif);}
  .notif-head .nc{font-size:11px; color:var(--text-3); cursor:pointer;}
  .notif-item{
    display:flex; gap:10px; padding:10px; border-radius:10px; cursor:pointer;
  }
  .notif-item:active{background:#f3f4ff;}
  .notif-item .ni-ico{
    width:30px; height:30px; border-radius:9px; flex:0 0 30px;
    background:var(--grad-soft); color:#2563eb;
    display:flex; align-items:center; justify-content:center;
  }
  .notif-item .ni-txt{font-size:13px; line-height:1.45; color:var(--text);}
  .notif-item .ni-time{font-size:11px; color:var(--text-3); margin-top:3px;}

  /* ===== Switcher overlay (click-outside) ===== */
  .switcher-mask{position:absolute; inset:0; z-index:79;}

  /* ===== SOP lib template card ===== */
  .tpl-card{
    margin:0 16px 10px; padding:14px 16px; border-radius:var(--r-m);
    display:flex; align-items:center; gap:12px; cursor:pointer;
    transition:transform .15s;
  }
  .tpl-card:active{transform:scale(.98);}
  .tpl-card .tc-ico{
    width:38px; height:38px; border-radius:11px; flex:0 0 38px;
    background:rgba(59,130,246,.12); color:#3b82f6;
    display:flex; align-items:center; justify-content:center;
  }
  .tpl-card .tc-t{font-size:14px; font-weight:600;}
  .tpl-card .tc-d{font-size:11px; color:var(--text-2); margin-top:3px; display:flex; align-items:center; gap:6px;}

  /* ===== Center FAB in tab bar ===== */
  .fab-tab{
    width:54px; height:54px; border-radius:50%;
    background:var(--grad); color:#fff;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 22px rgba(59,130,246,.5);
    margin-top:-30px;
    border:4px solid rgba(255,255,255,.9);
    cursor:pointer; transition:transform .15s;
  }

/* ============ Todo List ============ */
const TodoList = ({ identity, sops, onOpen }) => {
  // todos: nodes assigned to current identity that are 'current', OR sops initiated by identity that are in progress
  const myTurn = sops.filter(s => s.nodes.find(n => n.assignee===identity && n.status==='current'));
  const myInitiated = sops.filter(s => s.initiator===identity && s.status==='进行中'
    && !s.nodes.find(n => n.assignee===identity && n.status==='current'));

  return (
    <div className="view-fade">
      <div className="section-pad">
        <div className="page-title">{identity==='me' ? '我发起的' : '待办'}</div>
        <div className="page-sub">{identity==='me' ? '你创建的进行中 SOP，跟踪进度' : '需要你处理的节点，完成打勾流转'}</div>
      </div>

      <div className="notice glass">
        <div className="ico"><Ico.Bell size={15}/></div>
        <span>{myTurn.length>0 ? `你收到新的任务，${myTurn.length} 项待你处理` : '暂无待你处理的任务'}</span>
      </div>

      <div className="sec-label">我参与的</div>
      {myTurn.length===0 && myInitiated.length===0 && (
        <div className="empty">
          <div className="ico"><Ico.Inbox size={40}/></div>
          {identity==='me' ? '你发起的流程都在顺利推进，去看看进度吧' : '暂无需要你处理的任务，先休息一下吧'}
        </div>
      )}
      {myTurn.map(s => {
        const n = s.nodes.find(n => n.status==='current');
        return (
          <div key={s.id} className="todo-card glass" onClick={()=>onOpen(s.id)}>
            <div className="todo-head">
              <div className="todo-title">{s.name}</div>
              <div className="cycle-tag">{s.cycle}</div>
            </div>
            <div className="todo-node">
              <Avatar id={n.assignee} size={22}/>
              <div className="txt">需要你：<b>{n.action}</b></div>
            </div>
            <div className="todo-foot">
              <div className="deadline"><Ico.Clock/> {fmtDeadline(s.deadline)}</div>
              <button className="go-btn" onClick={(e)=>{e.stopPropagation(); onOpen(s.id);}}>去处理 <Ico.ArrowRight size={14}/></button>
            </div>
          </div>
        );
      })}

      {myInitiated.length>0 && (
        <>
          <div className="sec-label">我发起的进行中</div>
          {myInitiated.map(s => {
            const n = s.nodes.find(n => n.status==='current');
            return (
              <div key={s.id} className="todo-card glass" onClick={()=>onOpen(s.id)}>
                <div className="todo-head">
                  <div className="todo-title">{s.name}</div>
                  <div className="cycle-tag">{s.cycle}</div>
                </div>
                <div className="todo-node">
                  <Avatar id={n.assignee} size={22}/>
                  <div className="txt">当前：<b>{TEAM[n.assignee].name}</b> 正在 {n.action}</div>
                </div>
                <div className="todo-foot">
                  <div className="deadline"><Ico.Clock/> {fmtDeadline(s.deadline)}</div>
                  <button className="go-btn" onClick={(e)=>{e.stopPropagation(); onOpen(s.id);}}>查看进度 <Ico.ArrowRight size={14}/></button>
                </div>
              </div>
            );
          })}
        </>
      )}
    </div>
  );
};

/* ============ Flow Detail ============ */
const FlowDetail = ({ sop, identity, onBack, onCheck, onReject, onViewNode, onViewArchive }) => {
  const currentNode = sop.nodes.find(n => n.status==='current');
  const canCheck = currentNode && currentNode.assignee===identity;
  const isDone = !currentNode;
  const doneCount = sop.nodes.filter(n=>n.status==='done').length;
  const progress = Math.round(doneCount / sop.nodes.length * 100);
  const curIdx = currentNode ? sop.nodes.findIndex(n => n.id === currentNode.id) : -1;
  const prevNode = curIdx > 0 ? sop.nodes[curIdx - 1] : null;
  const canReject = canCheck && curIdx > 1;

  return (
    <div className="view-fade">
      <div className="detail-top">
        <div className="back-btn" onClick={onBack}><Ico.ArrowLeft size={18}/></div>
        <div className="detail-title-wrap">
          <div className="detail-title">{sop.name}</div>
          <div className="detail-meta">
            <span>{sop.cycle}</span>·
            <span className={'status-pill ' + (isDone?'status-done':'status-doing')}>{isDone?'已归档':'进行中'}</span>
            <span><Ico.Clock/> {fmtDeadline(sop.deadline)}</span>
          </div>
        </div>
      </div>

      <div className="info-card glass">
        <div className="info-row"><div className="lbl">发起人</div><div style={{display:'flex',alignItems:'center',gap:6}}><Avatar id={sop.initiator} size={18}/> {TEAM[sop.initiator].name}</div></div>
        <div className="info-row"><div className="lbl">进度</div><div>{doneCount}/{sop.nodes.length} 节点 · {progress}%</div></div>
        <div className="progress-bar"><div className="progress-fill" style={{width:progress+'%'}}></div></div>
      </div>

      <div className="sec-label">流程节点</div>
      <div className="flow">
        {sop.nodes.map((n, i) => {
          const isLast = i===sop.nodes.length-1;
          return (
            <div className="flow-node" key={n.id}>
              <div className="flow-rail">
                <div className={'flow-dot ' + n.status + (n.status==='done' ? ' check-pop' : '')} key={'dot-'+n.id+'-'+n.status}>
                  {n.status==='done' && <Ico.Check size={14}/>}
                  {n.status==='current' && <div style={{width:8,height:8,borderRadius:'50%',background:'#3b82f6'}}></div>}
                </div>
                {!isLast && <div className={'flow-line ' + (n.status==='done'?'done':'')}></div>}
              </div>
              <div className="flow-body">
                <div className="fn-title">
                  {n.title}
                  {n.status==='current' && <span className="status-pill status-doing">待你处理</span>}
                  {n.status==='done' && <span className="status-pill status-done">已完成</span>}
                  {n.status==='pending' && <span className="status-pill status-pending">待处理</span>}
                </div>
                <div className="fn-meta">
                  <Avatar id={n.assignee} size={18}/> {TEAM[n.assignee].name}（{TEAM[n.assignee].role}） · {n.action}
                </div>

                {n.status==='current' && (
                  <div className="current-card">
                    <div className="ct">当前任务</div>
                    <div className="cd">{n.action}</div>
                    {n.rejectReason && (
                      <div style={{marginTop:10,padding:'10px 12px',borderRadius:10,background:'rgba(239,68,68,0.1)',border:'1px solid rgba(239,68,68,0.3)',color:'#b91c1c',fontSize:12,display:'flex',gap:8,alignItems:'flex-start'}}>
                        <Ico.AlertTriangle size={15}/> <span>已被驳回：{n.rejectReason}</span>
                      </div>
                    )}
                  </div>
                )}
                {n.status==='done' && (
                  <div className="node-done-card" onClick={()=>onViewNode(n)}>
                    <div style={{fontSize:12,color:'#374151'}}>{n.note}</div>
                    {n.files.length>0 && n.files.map((f,idx)=>(
                      <div key={idx} className="f"><Ico.File size={13}/> {f.name} <span style={{color:'#9ca3af'}}>{f.size}</span></div>
                    ))}
                    <div style={{fontSize:10,color:'#9ca3af',marginTop:4}}>点击查看详情</div>
                  </div>
                )}
              </div>
            </div>
          );
        })}
      </div>

      {isDone ? (
        <>
          <div className="wait-note" style={{borderColor:'rgba(16,185,129,.4)',color:'#059669',background:'rgba(16,185,129,.06)'}}>
            <Ico.Check size={16}/> 流程已完成，已归档到执行档案
          </div>
          <button className="check-btn" onClick={()=>onViewArchive && onViewArchive(sop.name)}>
            <Ico.Archive size={18}/> 查看执行档案
          </button>
        </>
      ) : canCheck ? (
        <>
          <button className="check-btn" onClick={onCheck}>
            <Ico.Check size={18}/> 打勾完成
          </button>
          {canReject && (
            <button onClick={()=>onReject && onReject(prevNode)}
              style={{margin:'0 16px 8px',width:'calc(100% - 32px)',padding:'13px',borderRadius:'var(--r-m)',border:'1px solid rgba(239,68,68,.35)',background:'rgba(239,68,68,.06)',color:'#b91c1c',fontSize:14,fontWeight:600,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
              <Ico.Undo size={16}/> 驳回上一节点
            </button>
          )}
        </>
      ) : (
        <div className="wait-note">
          等待 <b style={{color:TEAM[currentNode.assignee].color}}>{TEAM[currentNode.assignee].name}</b> 处理中，完成后将自动流转
        </div>
      )}
    </div>
  );
};

/* ============ Complete Drawer ============ */
const CompleteDrawer = ({ node, sop, onClose, onSubmit }) => {
  const [files, setFiles] = useState([]);
  const [note, setNote] = useState('');
  const fileRef = useRef(null);

  const canSubmit = files.length>0 || note.trim().length>0;

  const onPickFile = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    setFiles(prev => [...prev, { name:f.name, size:formatSize(f.size) }]);
    e.target.value = '';
  };
  const formatSize = (b) => {
    if (b<1024) return b+' B';
    if (b<1024*1024) return (b/1024).toFixed(1)+' KB';
    return (b/1024/1024).toFixed(1)+' MB';
  };

  return (
    <>
      <div className="overlay" onClick={onClose}></div>
      <div className="drawer">
        <div className="drawer-grip"></div>
        <div className="drawer-h">打勾完成</div>
        <div className="drawer-sub">
          <b>{sop.name}</b> · 当前节点「{node.title}」
          <br/>上传文件或填写说明，至少完成一项
        </div>

        <div className="field-label"><Ico.Upload size={15}/> 附件上传</div>
        <input ref={fileRef} type="file" style={{display:'none'}} onChange={onPickFile}/>
        <div className="upload-zone" onClick={()=>fileRef.current && fileRef.current.click()}>
          <div className="ico"><Ico.Upload size={24}/></div>
          点击选择文件上传
          <div style={{fontSize:11,color:'#9ca3af',marginTop:4}}>支持图片、文档、表格等</div>
        </div>
        {files.map((f,idx)=>(
          <div className="file-chip" key={idx}>
            <div style={{color:'#3b82f6'}}><Ico.File size={18}/></div>
            <div style={{flex:1,minWidth:0}}>
              <div className="fname">{f.name}</div>
              <div className="fsize">{f.size}</div>
            </div>
            <div className="rm" onClick={()=>setFiles(prev=>prev.filter((_,i)=>i!==idx))}><Ico.X size={16}/></div>
          </div>
        ))}

        <div className="field-label">完成说明</div>
        <textarea className="note-input" placeholder="简要说明本次完成情况，便于下一节点接手…"
          value={note} onChange={e=>setNote(e.target.value)} maxLength={300}/>
        <div className="hint"><Ico.Check size={12}/> 至少上传文件或填写说明一项即可提交</div>

        <button className="submit-btn" disabled={!canSubmit} onClick={()=>onSubmit({files, note:note.trim()})}>
          <Ico.Check size={18}/> 提交完成
        </button>
        <button className="cancel-btn" onClick={onClose}>取消</button>
      </div>
    </>
  );
};

      </div>

  );

          </div>
        ))}
        {viewTemplate && (
          <>
            <div className="overlay" onClick={()=>setViewTemplate(null)}></div>
            <div className="drawer">
              <div className="drawer-grip"></div>
              <div className="drawer-h">{viewTemplate.name}</div>
              <div className="drawer-sub">
                {viewTemplate.cycle} · {viewTemplate.cycleDetail} · {viewTemplate.nodes} 个节点
              </div>
              <div className="field-label">模板说明</div>
              <div style={{padding:'12px',borderRadius:'12px',background:'#f6f7fb',fontSize:'13px',lineHeight:1.6,color:'#374151'}}>
                该模板包含 {viewTemplate.nodes} 个执行节点，可快速发起一次 SOP 流程。
              </div>
              <button className="submit-btn" onClick={()=>{
                onToast('已从模板发起（演示）');
                setViewTemplate(null);
              }}>
                <Ico.Check size={18}/> 以此模板发起
              </button>
              <button className="cancel-btn" onClick={()=>setViewTemplate(null)}>关闭</button>
            </div>
          </>
        )}
      </div>
    );
  }

  if (view.sub==='archive-list') {
    return (
      <div className="view-fade">
        <div className="detail-top">
          <div className="back-btn" onClick={()=>setView({sub:'root'})}><Ico.ArrowLeft size={18}/></div>
          <div className="detail-title-wrap"><div className="detail-title">SOP 执行档案</div>
          <div className="detail-meta">已归档流程的执行记录</div></div>
        </div>
        <div className="sec-label">归档流程</div>
        {archives.length===0 && (
          <div className="empty">
            <div className="ico"><Ico.Inbox size={40}/></div>
            暂无归档记录
          </div>
        )}
        {archives.map(a => (
          <div key={a.id} className="archive-item glass" onClick={()=>onOpenArchive(a)}>
            <div className="ai-l">
              <div className="ai-ico"><Ico.Archive size={18}/></div>
              <div>
                <div className="ai-t">{a.sopName}</div>
                <div className="ai-d">{a.cycle} · {a.record}</div>
              </div>
            </div>
            <Ico.ChevronRight size={16}/>
          </div>
        ))}
      </div>
    );
  }

  if (view.sub==='archive-detail' && view.archive) {
    const a = view.archive;
    return (
      <div className="view-fade">
        <div className="detail-top">
          <div className="back-btn" onClick={()=>setView({sub:'archive-list'})}><Ico.ArrowLeft size={18}/></div>
          <div className="detail-title-wrap">
            <div className="detail-title">{a.sopName}</div>
            <div className="detail-meta">{a.cycle} · 执行于 {a.record}</div>
          </div>
        </div>
        <div className="info-card glass">
          <div className="info-row"><div className="lbl">状态</div><div><span className="status-pill status-done">已归档</span></div></div>
          <div className="info-row"><div className="lbl">节点数</div><div>{a.nodes.length} 个节点全部完成</div></div>
        </div>
        <div className="sec-label">节点记录（只读）</div>
        <div className="flow">
          {a.nodes.map((n,i)=>{
            const isLast = i===a.nodes.length-1;
            return (
              <div className="flow-node" key={n.id}>
                <div className="flow-rail">
                  <div className="flow-dot done"><Ico.Check size={14}/></div>
                  {!isLast && <div className="flow-line done"></div>}
                </div>
                <div className="flow-body">
                  <div className="fn-title">{n.title}</div>
                  <div className="fn-meta"><Avatar id={n.assignee} size={18}/> {TEAM[n.assignee].name}（{TEAM[n.assignee].role}）</div>
                  <div className="node-done-card">
                    <div style={{fontSize:12,color:'#374151'}}>{n.note}</div>
                    {n.files.map((f,idx)=>(
                      <div key={idx} className="f"><Ico.File size={13}/> {f.name} <span style={{color:'#9ca3af'}}>{f.size}</span></div>
                    ))}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  if (view.sub==='files') {
    return (
      <div className="view-fade">
        <div className="detail-top">
          <div className="back-btn" onClick={()=>setView({sub:'root'})}><Ico.ArrowLeft size={18}/></div>
          <div className="detail-title-wrap">
            <div className="detail-title">文件库</div>
            <div className="detail-meta">团队共享文件，可在 SOP 中引用</div>
          </div>
        </div>
        <div className="sec-label">文件列表</div>
        {FILE_LIB_FILES.map(f => (
          <div key={f.id} className="archive-item glass">
            <div className="ai-l">
              <div className="ai-ico" style={{background:fileColor(f.name)+'22',color:fileColor(f.name)}}>
                <span style={{fontSize:9,fontWeight:800}}>{f.type.toUpperCase()}</span>
              </div>
              <div>
                <div className="ai-t">{f.name}</div>
                <div className="ai-d">{f.size} · {f.updated}</div>
              </div>
            </div>
            <Ico.File size={16} style={{color:'#9ca3af'}}/>
          </div>
        ))}
      </div>
    );
  }

  // root
  return (
    <div className="view-fade">
      <div className="section-pad">
        <div className="page-title">资料库</div>
        <div className="page-sub">浏览 SOP 模板、执行档案与共享文件</div>
      </div>
      <div className="folder glass" onClick={()=>setView({sub:'sop-lib'})}>
        <div className="ficon" style={{background:'rgba(59,130,246,.12)'}}><Ico.Folder size={24}/></div>
        <div className="ftxt">
          <div className="ftitle">SOP 库</div>
          <div className="fsub">标准作业流程模板</div>
        </div>
        <div className="cnt">{TEMPLATES.length} 个</div>
      </div>
      <div className="folder glass" onClick={()=>setView({sub:'archive-list'})}>
        <div className="ficon" style={{background:'rgba(16,185,129,.12)',color:'#059669'}}><Ico.Archive size={24}/></div>
        <div className="ftxt">
          <div className="ftitle">SOP 执行档案</div>
          <div className="fsub">已完成归档的执行记录</div>
        </div>
        <div className="cnt">{archives.length} 个</div>
      </div>
      <div className="folder glass" onClick={()=>setView({sub:'files'})}>
        <div className="ficon" style={{background:'rgba(245,158,11,.12)',color:'#d97706'}}><Ico.File size={24}/></div>
        <div className="ftxt">
          <div className="ftitle">文件库</div>
          <div className="fsub">团队共享文件，可在 SOP 中引用</div>
        </div>
        <div className="cnt">{FILE_LIB_FILES.length} 个</div>
      </div>
    </div>
  );
};

/* ============ Notif Panel ============ */
const NotifPanel = ({ onClose }) => (
  <>
    <div className="overlay" onClick={onClose}></div>
    <div className="drawer">
      <div className="drawer-grip"></div>
      <div className="drawer-h">通知</div>
      <div className="drawer-sub">最近的流程动态与提醒</div>
      <div style={{marginTop:14, display:'flex', flexDirection:'column', gap:10}}>
        {NOTIFS.map(n=>(
          <div key={n.id} className="notif-item" style={{background:'#f9fafb', border:'1px solid #f3f4f6'}} onClick={onClose}>
            <div className="ni-ico"><Ico.Bell size={15}/></div>
            <div style={{flex:1,minWidth:0}}>
              <div className="ni-txt">{n.text}</div>
              <div className="ni-time">{n.time}</div>
            </div>
          </div>
        ))}
      </div>
      <button className="submit-btn" style={{marginTop:18}} onClick={onClose}>关闭</button>
    </div>
  </>
);

/* ============ Toast ============ */
const Toast = ({ msg }) => (
  <div className="toast"><Ico.Check size={16}/> {msg}</div>
);

/* ============ Start Wizard (发起 SOP) ============ */
const emptyNode = () => ({ assignee:'', action:'', refs:[] });
const StartWizard = ({ identity, onClose, onComplete, onToast }) => {
  const [step, setStep] = useState(1);
  const [name, setName] = useState('');
  const [nodes, setNodes] = useState([emptyNode()]);
  const [cursor, setCursor] = useState(0);
  const [cycle, setCycle] = useState('单次');
  const [cd, setCd] = useState({ day:1, hour:9, minute:0, weekday:1 });
  const teamIds = Object.keys(TEAM);
  const totalSteps = 4;
  const dots = Array.from({length: totalSteps});

  const setN = (i, f, v) => setNodes(ns => ns.map((n,idx)=> idx===i ? {...n,[f]:v} : n));
  const cur = nodes[cursor];
  const cursorOk = !!(cur.assignee && cur.action.trim());

  const [highlight, setHighlight] = useState({});
  const [shake, setShake] = useState({});
  const [refOpen, setRefOpen] = useState(false);
  const clearH = (f) => setHighlight(h => ({...h,[f]:false}));
  const triggerShake = (f) => {
    setShake(s => ({...s,[f]:true}));
    setTimeout(()=>setShake(s=>({...s,[f]:false})), 450);
  };
  const shakeStyle = (f) => shake[f] ? {animation:'shake .4s ease'} : {};
  const redTag = (f, text) => highlight[f] ? <span style={{color:'#ef4444',fontSize:11,marginLeft:6,fontWeight:500}}>{text}</span> : null;
  const next1 = () => {
    if (!name.trim()) { setHighlight({name:true}); triggerShake('name'); onToast('请填写 SOP 名称'); return; }
    setStep(2);
  };
  const next2 = () => {
    if (!cur.assignee) { setHighlight({assignee:true}); triggerShake('assignee'); onToast('请选择执行人'); return; }
    if (!cur.action.trim()) { setHighlight({action:true}); triggerShake('action'); onToast('请填写执行任务'); return; }
    if (cursor === nodes.length-1) { setNodes(ns=>[...ns, emptyNode()]); setCursor(cursor+1); }
    else { setCursor(cursor+1); }
  };
  const endNow = () => {
    if (!cur.assignee) { setHighlight({assignee:true}); triggerShake('assignee'); onToast('请选择执行人'); return; }
    if (!cur.action.trim()) { setHighlight({action:true}); triggerShake('action'); onToast('请填写执行任务'); return; }
    setStep(3);
  };

  const finish = () => {
    const valid = nodes.filter(n => n.assignee && n.action.trim());
    const built = [
      { id:1, title:'发起', assignee:identity, action:'发起流程', status:'done', files:[], note:'发起流程' },
      ...valid.map((n,i) => ({
        id:i+2, title:n.action.trim(), assignee:n.assignee, action:n.action.trim(),
        status: i===0 ? 'current' : 'pending', files:[], note:''
      }))
    ];
    const sop = {
      id:'sop-'+Date.now(), name:name.trim(), cycle, initiator:identity, status:'进行中',
      deadline: formatNow(),
      nodes: built,
    };
    onComplete(sop);
  };

  const cycleText = () => {
    if (cycle==='单次') return '单次/不定期';
    if (cycle==='每天') return `每天 ${pad2(cd.hour)}:${pad2(cd.minute)}`;
    if (cycle==='每周') return `每周${'日一二三四五六'[cd.weekday]} ${pad2(cd.hour)}:${pad2(cd.minute)}`;
    if (cycle==='每月') return `每月${cd.day}号 ${pad2(cd.hour)}:${pad2(cd.minute)}`;
    return cycle;
  };

  return (
    <div className="mw-overlay">
      <div className="mw-top">
        <div className="back-btn" onClick={onClose}><Ico.X size={18}/></div>
        <div className="mw-title">发起 SOP</div>
      </div>
      <div className="mw-dots">
        {dots.map((_,i) => (
          <div key={i} className={'mw-dot ' + (step===i+1 ? 'active' : step>i+1 ? 'done' : '')}/>
        ))}
      </div>

      <div className="mw-body">
        {step===1 && (
          <div>
            <div className="mw-h">给这个 SOP 起个名字</div>
            <div className="mw-sub">一个清晰的名字，让团队一眼看懂流程要做什么</div>
            <input className="mw-input" placeholder="例如：周度数据汇总" value={name}
              onChange={e=>{ setName(e.target.value); clearH('name'); }}
              onKeyDown={e=>{ if(e.key==='Enter') next1(); }}
              style={shakeStyle('name')} autoFocus/>
          </div>
        )}

        {step===2 && (
          <div>
            <div className="mw-h">{cursor===0 ? '设置第一个人需要做什么' : '接下来需要谁做什么'}</div>
            <div className="mw-sub">第 {cursor+1} 个执行节点{cursor===0 ? '，流程发起后第一个执行人将收到通知' : '（上一位完成后流转到此）'}</div>
            <div style={{display:'flex',gap:10,justifyContent:'center',alignItems:'center',margin:'14px 0 4px'}}>
              {nodes.map((_, i) => {
                const done = i < cursor;
                const active = i === cursor;
                return (
                  <div key={i} onClick={done ? ()=>setCursor(i) : undefined}
                    style={{
                      width:11, height:11, borderRadius:'50%',
                      background: done || active ? '#3b82f6' : 'transparent',
                      border: done || active ? '1.5px solid #3b82f6' : '1.5px solid #c7c7d0',
                      boxShadow: active ? '0 0 0 4px rgba(59,130,246,0.18)' : 'none',
                      cursor: done ? 'pointer' : 'default',
                      transition: 'all .2s',
                    }} />
                );
              })}
            </div>
            <div className="mw-label">由谁执行{redTag('assignee','请选择')}</div>
            <div className="mw-people" style={shakeStyle('assignee')}>
              {teamIds.map(id => (
                <div key={id} className={'mw-person ' + (cur.assignee===id ? 'sel':'')}
                  onClick={()=>{ setN(cursor,'assignee',id); clearH('assignee'); }}>
                  <Avatar id={id} size={32}/>
                  <div className="pn">{TEAM[id].name}</div>
                  <div className={"pr" + (TEAM[id].isAI ? " ai-role" : "")}>{TEAM[id].role}</div>
                </div>
              ))}
            </div>
            <div className="mw-label">{isAI(cur.assignee) ? '填写任务提示词' : '需要 Ta 做什么事'}{redTag('action','请填写')}</div>
            {isAI(cur.assignee) ? (
              <textarea className="mw-input" placeholder={'请输入AI员工的任务提示词，例如："将输入的xlsx文件提取出姓名列与推荐人列，同时依照推荐人姓名，在"合伙人信息表.xlsx"找到推荐人手机号，作为"联系方式"列，输出csv格式文件。"\n注意，当AI员工发现输入文件缺少必要数据时，会自动驳回流程。提示词中必须包含"输出……格式的文件"。'} value={cur.action}
                onChange={e=>{ setN(cursor,'action',e.target.value); clearH('action'); }}
                style={{...shakeStyle('action'), minHeight:110, resize:'vertical', fontFamily:'inherit'}}/>
            ) : (
              <input className="mw-input" placeholder="例如：拉取上周活动数据" value={cur.action}
                onChange={e=>{ setN(cursor,'action',e.target.value); clearH('action'); }}
                onKeyDown={e=>{ if(e.key==='Enter') next2(); }}
                style={shakeStyle('action')}/>
            )}
            <div className="mw-label" style={{marginTop:14}}>参考资料（选填）</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:6,alignItems:'center'}}>
              {(cur.refs||[]).map(r => (
                <span key={r} className="mw-ref-chip" onClick={()=>setN(cursor,'refs',(cur.refs||[]).filter(x=>x!==r))}>
                  <Ico.File size={11}/> {r} <Ico.X size={11}/>
                </span>
              ))}
              <span className="mw-ref-add" onClick={()=>setRefOpen(true)}>
                <Ico.Plus size={11}/> 选择资料
              </span>
            </div>
            {refOpen && (
              <>
                <div className="overlay" onClick={()=>setRefOpen(false)}></div>
                <div className="drawer">
                  <div className="drawer-grip"></div>
                  <div className="drawer-h">选择参考资料</div>
                  <div className="drawer-sub">从资料库中选择文件作为参考</div>
                  <div style={{marginTop:14, display:'flex', flexDirection:'column', gap:8}}>
                    {FILE_LIB_FILES.map(f => {
                      const has = (cur.refs||[]).includes(f.name);
                      return (
                        <div key={f.id} className="archive-item glass" style={{opacity:has?0.6:1}} onClick={()=>{ if(!has) setN(cursor,'refs',[...(cur.refs||[]),f.name]); }}>
                          <div className="ai-l">
                            <div className="ai-ico" style={{background:fileColor(f.name)+'22',color:fileColor(f.name)}}>
                              <span style={{fontSize:9,fontWeight:800}}>{f.type.toUpperCase()}</span>
                            </div>
                            <div>
                              <div className="ai-t">{f.name}</div>
                              <div className="ai-d">{f.size} · {f.updated}</div>
                            </div>
                          </div>
                          {has
                            ? <span className="status-pill status-done">已选</span>
                            : <Ico.Plus size={16} style={{color:'#3b82f6'}}/>}
                        </div>
                      );
                    })}
                  </div>
                  <button className="submit-btn" style={{marginTop:18}} onClick={()=>setRefOpen(false)}>完成</button>
                </div>
              </>
            )}
          </div>
        )}

        {step===3 && (
          <div>
            <div className="mw-h">选择执行周期</div>
            <div className="mw-sub">这个 SOP 何时触发执行？</div>
            <div className="mw-label">周期类型</div>
            <div className="mw-radios">
              {['单次','每天','每周','每月'].map(c => (
                <div key={c} className={'mw-radio ' + (cycle===c ? 'sel':'')} onClick={()=>setCycle(c)}>
                  {c==='单次' ? '单次/不定期' : c}
                </div>
              ))}
            </div>
            {cycle!=='单次' && (
              <>
                <div className="mw-label">触发时间</div>
                <div style={{display:'flex',flexWrap:'wrap',gap:8,alignItems:'center'}}>
                  {cycle==='每月' && <>
                    每月
                    <select className="mw-input" style={{width:70}} value={cd.day} onChange={e=>setCd({...cd,day:+e.target.value})}>
                      {Array.from({length:28},(_,i)=>i+1).map(d=><option key={d} value={d}>{d}</option>)}
                    </select>号
                  </>}
                  {cycle==='每周' && <>
                    每周
                    <select className="mw-input" style={{width:90}} value={cd.weekday} onChange={e=>setCd({...cd,weekday:+e.target.value})}>
                      {['日','一','二','三','四','五','六'].map((w,i)=><option key={i} value={i}>周{w}</option>)}
                    </select>
                  </>}
                  <select className="mw-input" style={{width:72}} value={cd.hour} onChange={e=>setCd({...cd,hour:+e.target.value})}>
                    {Array.from({length:24},(_,i)=>i).map(h=><option key={h} value={h}>{pad2(h)}</option>)}
                  </select>时
                  <select className="mw-input" style={{width:72}} value={cd.minute} onChange={e=>setCd({...cd,minute:+e.target.value})}>
                    {[0,15,30,45].map(m=><option key={m} value={m}>{pad2(m)}</option>)}
                  </select>分
                </div>
              </>
            )}
          </div>
        )}

        {step===4 && (
          <div>
            <div className="mw-h">完整流程预览</div>
            <div className="mw-sub">第一个节点为「发起」，点击任意执行节点可跳回修改</div>
            <div className="mw-preview-node first">
              <div className="mw-pn-idx" style={{background:'#10b981'}}><Ico.Check2 size={14}/></div>
              <div style={{flex:1}}>
                <div className="mw-pn-t">发起</div>
                <div className="mw-pn-m">{TEAM[identity].name} · {TEAM[identity].role} · 创建时发起</div>
              </div>
            </div>
            {nodes.map((n, i) => (n.assignee && n.action.trim()) ? (
              <div key={i} className="mw-preview-node" onClick={()=>{ setCursor(i); setStep(2); }} style={{cursor:'pointer',position:'relative'}}>
                <div className="mw-pn-idx" style={{background:'#3b82f6'}}>{i+2}</div>
                <div style={{flex:1}}>
                  <div className="mw-pn-t">{n.action}</div>
                  <div className="mw-pn-m">{TEAM[n.assignee].name} · {TEAM[n.assignee].role}</div>
                </div>
                <div style={{fontSize:10,color:'#9ca3af',alignSelf:'flex-end'}}>点击修改</div>
              </div>
            ) : null)}
            <div style={{marginTop:14, padding:'11px 13px', borderRadius:12, background:'rgba(59,130,246,.08)', border:'1px dashed rgba(59,130,246,.3)', fontSize:12, color:'#2563eb'}}>
              执行周期：{cycleText()}
            </div>
          </div>
        )}
      </div>

      <div className="mw-foot">
        {step===1 && (
          <>
            <button className="mw-btn ghost" onClick={onClose}>取消</button>
            <button className="mw-btn primary" onClick={next1}>下一步</button>
          </>
        )}
        {step===2 && (
          <div style={{display:'flex',flexDirection:'column',gap:10,width:'100%'}}>
            <div style={{display:'flex',gap:10}}>
              <button className="mw-btn ghost" onClick={()=>cursor>0 ? setCursor(cursor-1) : setStep(1)}>上一步</button>
              <button className="mw-btn primary" onClick={next2}>继续下一步</button>
            </div>
            {cursor>=1 && (
              <button className="mw-btn" style={{flex:'0 0 auto',width:'100%',background:'linear-gradient(135deg,#ef4444,#f97316)',color:'#fff',boxShadow:'0 8px 20px rgba(239,68,68,.4)'}} onClick={endNow}>
                <Ico.X size={16}/> 结束了
              </button>
            )}
          </div>
        )}
        {step===3 && (
          <>
            <button className="mw-btn ghost" onClick={()=>setStep(2)}>上一步</button>
            <button className="mw-btn primary" onClick={()=>setStep(4)}>下一步</button>
          </>
        )}
        {step===4 && (
          <>
            <button className="mw-btn ghost" onClick={()=>setStep(3)}>上一步</button>
            <button className="mw-btn primary" onClick={finish}><Ico.Check2 size={16}/> 立即发起</button>
          </>
        )}
      </div>
    </div>
  );
};

/* ============ App ============ */
const App = () => {
  const [identity, setIdentity] = useState('huan');
  const [switchOpen, setSwitchOpen] = useState(false);
  const [notifOpen, setNotifOpen] = useState(false);
  const [tab, setTab] = useState('todo');
  const [sops, setSops] = useState(initialSOPs);
  const [archives, setArchives] = useState(ARCHIVE);
  const [openSopId, setOpenSopId] = useState(null);
  const [showComplete, setShowComplete] = useState(false);
  const [showReject, setShowReject] = useState(false);
  const [rejectTarget, setRejectTarget] = useState(null);
  const [viewNode, setViewNode] = useState(null);
  const [toast, setToast] = useState(null);
  const [libView, setLibView] = useState({sub:'root'});
  const [archiveSel, setArchiveSel] = useState(null);
  const [wizardOpen, setWizardOpen] = useState(false);

  // toast auto dismiss
  useEffect(()=>{
    if (!toast) return;
    const t = setTimeout(()=>setToast(null), 2600);
    return ()=>clearTimeout(t);
  }, [toast]);

  const openSop = (id) => { setOpenSopId(id); };
  const backToList = () => { setOpenSopId(null); setShowComplete(false); setShowReject(false); setRejectTarget(null); };

  const switchIdentity = (id) => {
    setIdentity(id);
    setSwitchOpen(false);
    setOpenSopId(null);
    setTab('todo');
  };

  const toggleSwitch = () => {
    setSwitchOpen(o=>!o);
    setNotifOpen(false);
  };
  const toggleNotif = () => {
    setNotifOpen(o=>!o);
    setSwitchOpen(false);
  };

  const handleSubmitComplete = ({ files, note }) => {
    const sop = sops.find(s=>s.id===openSopId);
    if (!sop) return;
    const idx = sop.nodes.findIndex(n=>n.status==='current');
    if (idx<0) return;
    const currentNode = sop.nodes[idx];
    const nextNode = sop.nodes[idx+1];

    const newSops = sops.map(s=>{
      if (s.id!==sop.id) return s;
      const nodes = s.nodes.map((n,i)=>{
        if (i===idx) return {...n, status:'done', files:files.length?files:n.files, note:note||n.note};
        return n;
      });
      if (nextNode) {
        nodes[idx+1] = {...nodes[idx+1], status:'current'};
      }
      const stillRunning = nodes.some(n=>n.status!=='done');
      return {...s, nodes, status: stillRunning ? '进行中' : '已归档'};
    });
    setSops(newSops);
    setShowComplete(false);

    if (!nextNode) {
      // 全部节点完成 -> 写入执行档案
      const finishedSop = newSops.find(s=>s.id===sop.id);
      const archiveRec = {
        id: 'ar-' + Date.now(),
        sopName: sop.name,
        cycle: sop.cycle,
        record: formatNow(),
        nodes: finishedSop.nodes.map(n => ({
          id: n.id, title: n.title, assignee: n.assignee,
          files: n.files, note: n.note,
        })),
      };
      setArchives(prev => [archiveRec, ...prev]);
      setToast('已完成全部节点，流程已归档到执行档案');
      setTimeout(()=>setOpenSopId(null), 1500);
    } else {
      setToast(`已完成，已通知下一位：${TEAM[nextNode.assignee].name}`);
    }
  };

  const rejectNode = (sopId, nodeId, reason) => {
    setSops(ss => ss.map(sop => {
      if (sop.id !== sopId) return sop;
      const idx = sop.nodes.findIndex(n => n.id === nodeId);
      if (idx < 0) return sop;
      const nodes = sop.nodes.map((n, i) => {
        if (i === idx) return { ...n, status:'current', rejectReason: reason };
        if (i > idx) return { ...n, status:'pending', files:[], note:'', rejectReason:'' };
        return n;
      });
      return { ...sop, nodes, status:'进行中' };
    }));
    setShowReject(false);
    setRejectTarget(null);
    const sop = sops.find(s => s.id === sopId);
    const node = sop ? sop.nodes.find(n => n.id === nodeId) : null;
    setToast(node ? `已驳回「${node.action}」，已退回 ${TEAM[node.assignee].name} 修改` : '已驳回，已通知重新处理');
  };

  const openSopObj = openSopId ? sops.find(s=>s.id===openSopId) : null;

  const createSop = (sop) => {
    setSops(prev => [sop, ...prev]);
    setWizardOpen(false);
    setTab('todo');
    setOpenSopId(null);
    const firstExec = sop.nodes.find(n => n.status==='current');
    setToast(firstExec ? `已发起，已通知 ${TEAM[firstExec.assignee].name} 处理「${firstExec.title}」` : '已发起 SOP');
  };

  return (
    <div className="phone">
      <div className="phone-screen">
        <div className="notch"></div>
        <StatusBar/>
        <TopNav identity={identity} switchOpen={switchOpen}
          onSwitchToggle={toggleSwitch}
          onBell={toggleNotif} />
        {notifOpen && <NotifPanel onClose={()=>setNotifOpen(false)} />}

        <div className="app-body">
          {tab==='todo' && !openSopObj && (
            <TodoList identity={identity} sops={sops} onOpen={openSop} />
          )}
          {tab==='todo' && openSopObj && (
            <FlowDetail
              sop={openSopObj}
              identity={identity}
              onBack={backToList}
              onCheck={()=>setShowComplete(true)}
              onReject={(node)=>{ setRejectTarget(node); setShowReject(true); }}
              onViewNode={(n)=>setViewNode(n)}
              onViewArchive={(sopName)=>{
                const a = archives.find(x=>x.sopName===sopName);
                if(a){ setTab('library'); setLibView({sub:'archive-detail', archive:a}); }
              }}
            />
          )}
          {tab==='library' && (
            <Library
              view={libView}
              setView={setLibView}
              archives={archives}
              onOpenArchive={(a)=>{ setArchiveSel(a); setLibView({sub:'archive-detail', archive:a}); }}
              onToast={(msg)=>setToast(msg)}
            />
          )}
        </div>

        {/* bottom tabs */}
        <div className="bottom-tabs">
          <div className={'tab ' + (tab==='todo'?'active':'')} onClick={()=>{setTab('todo'); setOpenSopId(null); setSwitchOpen(false); setNotifOpen(false);}}>
            <Ico.List size={20}/> 待办
          </div>
          <div className="fab-tab" onClick={()=>{ setWizardOpen(true); setSwitchOpen(false); setNotifOpen(false); }}>
            <Ico.Plus size={26}/>
          </div>
          <div className={'tab ' + (tab==='library'?'active':'')} onClick={()=>{setTab('library'); setOpenSopId(null); setLibView({sub:'root'}); setSwitchOpen(false); setNotifOpen(false);}}>
            <Ico.Folder size={20}/> 资料库
          </div>
        </div>

        <div className="home-bar"></div>

        {/* overlays */}
        {switchOpen && <div className="switcher-mask" onClick={()=>setSwitchOpen(false)} />}
        {notifOpen && <div className="switcher-mask" onClick={()=>setNotifOpen(false)} />}
        {showComplete && openSopObj && (() => {
          const cur = openSopObj.nodes.find(n=>n.status==='current');
          return cur ? <CompleteDrawer node={cur} sop={openSopObj} onClose={()=>setShowComplete(false)} onSubmit={handleSubmitComplete}/> : null;
        })()}
        {showReject && rejectTarget && openSopObj && (
          <RejectDrawer node={rejectTarget} sop={openSopObj}
            onClose={()=>{ setShowReject(false); setRejectTarget(null); }}
            onSubmit={(nodeId, reason)=>rejectNode(openSopObj.id, nodeId, reason)} />
        )}
        {viewNode && openSopObj && <NodeView node={viewNode} sop={openSopObj} onClose={()=>setViewNode(null)}/>}
        {wizardOpen && <StartWizard identity={identity} onClose={()=>setWizardOpen(false)} onComplete={createSop} onToast={(msg)=>setToast(msg)}/>}
        {toast && <Toast msg={toast}/>}
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
(function(){
  function fail(msg){
    var r=document.getElementById('root');
    if(r) r.innerHTML='<div style="padding:48px;font-family:sans-serif;color:#1e2435;max-width:560px;margin:40px auto"><h2 style="margin:0 0 12px;font-size:20px">脚本加载失败</h2><p style="color:#6b7280;margin:0 0 16px;line-height:1.6">'+msg+'</p><p style="color:#9ca3af;font-size:13px;margin:0">请检查网络连接后刷新重试；若持续失败，可尝试用 Chrome / Edge 打开。</p></div>';
    console.error('[打勾 Demo] '+msg);
  }
  if(typeof Babel==='undefined'){ fail('Babel 引擎未能加载（CDN 不可达），请检查网络。'); return; }
  var src=document.getElementById('app-source');
  if(!src){ fail('未找到应用脚本源码。'); return; }
  try{
    var out=Babel.transform(src.textContent,{presets:[['react',{runtime:'classic'}]],filename:'app.jsx'}).code;
    var s=document.createElement('script');
    s.textContent=out;
    document.body.appendChild(s);
  }catch(e){
    fail('编译或运行时出错：'+(e&&e.message||String(e)));
    console.error(e);
  }
})();
</script>
</body>
</html>
