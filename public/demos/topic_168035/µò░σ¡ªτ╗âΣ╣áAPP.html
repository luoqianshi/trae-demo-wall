<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>数学练习APP · 七年级数学人教版</title>
<style>
/* ========== 全局重置 ========== */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#1a1a2e;color:#eee;overflow-x:hidden;min-height:100vh}
:root{--blue:#4361ee;--purple:#7209b7;--cyan:#06d6a0;--yellow:#ffd60a;--red:#ef476f;--green:#06d6a0;--bg:#1a1a2e;--card:#16213e;--border:#233;--radius:14px}
input,button{font-family:inherit;outline:none;border:none}
button{cursor:pointer;transition:all .2s}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#111}::-webkit-scrollbar-thumb{background:#445;border-radius:3px}

/* ========== 页面容器 ========== */
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:20px}

/* ========== 顶部导航栏 ========== */
.navbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(22,33,62,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.nav-back{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nav-back:hover{background:rgba(255,255,255,.2)}
.nav-title{font-size:17px;font-weight:700;text-align:center;flex:1}
.nav-spacer{width:36px;flex-shrink:0}

/* ========== 等级徽章 ========== */
.level-badge{display:flex;align-items:center;gap:12px;padding:16px;background:linear-gradient(135deg,var(--blue),var(--purple));border-radius:var(--radius);margin:16px;box-shadow:0 4px 20px rgba(67,97,238,.3)}
.level-circle{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--yellow),#f77f00);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 20px rgba(255,214,10,.4)}
.level-circle .lv{font-size:10px;color:#333;font-weight:700}
.level-circle .num{font-size:22px;color:#333;font-weight:900;line-height:1}
.level-info{flex:1}
.level-name{font-size:15px;font-weight:700;margin-bottom:4px}
.exp-bar{height:8px;background:rgba(0,0,0,.3);border-radius:4px;overflow:hidden}
.exp-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--yellow));border-radius:4px;transition:width .5s}
.exp-text{font-size:11px;color:rgba(255,255,255,.7);margin-top:3px}
.coins-display{display:flex;align-items:center;gap:4px;padding:6px 12px;background:rgba(0,0,0,.3);border-radius:20px;font-weight:700;color:var(--yellow);font-size:15px}

/* ========== 快捷入口 ========== */
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px;margin-bottom:16px}
.quick-card{background:var(--card);border-radius:var(--radius);padding:20px;text-align:center;border:2px solid transparent;transition:all .2s}
.quick-card:hover{border-color:var(--blue);transform:translateY(-2px)}
.quick-icon{font-size:32px;margin-bottom:8px}
.quick-label{font-size:14px;font-weight:600;color:#ccc}
.quick-sub{font-size:11px;color:#666;margin-top:2px}

/* ========== 统计卡片 ========== */
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0 16px;margin-bottom:16px}
.stat-card{background:var(--card);border-radius:10px;padding:12px;text-align:center}
.stat-value{font-size:22px;font-weight:900;color:var(--cyan)}
.stat-label{font-size:11px;color:#888;margin-top:2px}

/* ========== 今日任务 ========== */
.section-title{font-size:16px;font-weight:700;padding:0 16px;margin:16px 0 8px;display:flex;align-items:center;gap:6px}
.task-card{margin:0 16px;background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:8px}
.task-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.task-name{font-size:14px;font-weight:600}
.task-reward{font-size:12px;color:var(--yellow)}
.task-progress{height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;margin-bottom:4px}
.task-progress-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--blue));border-radius:4px;transition:width .5s}
.task-text{font-size:11px;color:#888}
.claim-btn{width:100%;padding:10px;border-radius:8px;font-weight:700;font-size:14px;margin-top:8px}
.claim-btn.ready{background:linear-gradient(135deg,var(--green),#0fa360);color:#fff}
.claim-btn.disabled{background:rgba(255,255,255,.05);color:#555;cursor:not-allowed}

/* ========== 章节卡片 ========== */
.chapter-card{margin:0 16px 10px;background:var(--card);border-radius:var(--radius);padding:16px;cursor:pointer;border:2px solid transparent;transition:all .2s}
.chapter-card:hover{border-color:var(--blue)}
.chapter-card.selected{border-color:var(--cyan);background:rgba(6,214,160,.08)}
.chapter-header{display:flex;align-items:center;gap:12px}
.chapter-icon{font-size:28px}
.chapter-info{flex:1}
.chapter-name{font-size:15px;font-weight:700}
.chapter-desc{font-size:12px;color:#888;margin-top:2px}
.chapter-arrow{color:#555;font-size:18px}

/* ========== 题型选择 ========== */
.type-list{padding:0 16px}
.type-chip{display:inline-block;padding:8px 14px;margin:4px 4px 4px 0;background:var(--card);border-radius:20px;font-size:13px;border:2px solid transparent;cursor:pointer;transition:all .2s}
.type-chip:hover{border-color:var(--blue)}
.type-chip.selected{border-color:var(--cyan);background:rgba(6,214,160,.1);color:var(--cyan)}

/* ========== 难度/数量选择 ========== */
.opt-row{display:flex;gap:8px;padding:0 16px;margin-bottom:16px}
.opt-btn{flex:1;padding:12px;border-radius:10px;background:var(--card);text-align:center;font-size:13px;font-weight:600;border:2px solid transparent;cursor:pointer;transition:all .2s}
.opt-btn:hover{border-color:var(--blue)}
.opt-btn.selected{border-color:var(--cyan);background:rgba(6,214,160,.1);color:var(--cyan)}

/* ========== 开始按钮 ========== */
.start-btn{display:block;width:calc(100% - 32px);margin:16px;padding:16px;border-radius:var(--radius);background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;font-size:17px;font-weight:700;transition:all .2s}
.start-btn:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(67,97,238,.4)}
.start-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}

/* ========== 答题界面 ========== */
.quiz-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card)}
.quiz-progress{font-size:14px;font-weight:600}
.quiz-timer{font-size:14px;font-weight:700;padding:4px 12px;border-radius:20px;background:rgba(255,255,255,.1)}
.quiz-timer.warn{background:rgba(239,71,111,.3);color:var(--red)}
.streak-badge{font-size:13px;padding:4px 10px;border-radius:20px;background:rgba(255,107,53,.2);color:#ff6b35;font-weight:700}
.question-card{margin:16px;padding:24px 16px;background:var(--card);border-radius:var(--radius);text-align:center}
.question-text{font-size:22px;font-weight:700;line-height:1.6;margin-bottom:12px;word-break:break-word}
.answer-display{font-size:28px;font-weight:900;color:var(--cyan);min-height:40px;display:flex;align-items:center;justify-content:center;border-bottom:2px solid var(--border);padding-bottom:8px;margin:12px 0}
.answer-display.correct{color:var(--green)}
.answer-display.wrong{color:var(--red)}
.feedback{margin:12px 0;padding:12px;border-radius:8px;font-size:13px;line-height:1.5;display:none}
.feedback.show{display:block}
.feedback.correct{background:rgba(6,214,160,.1);border:1px solid rgba(6,214,160,.3);color:var(--green)}
.feedback.wrong{background:rgba(239,71,111,.1);border:1px solid rgba(239,71,111,.3);color:var(--red)}

/* ========== 数字键盘 ========== */
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px;margin-top:8px}
.numpad button{height:52px;border-radius:10px;background:var(--card);font-size:20px;font-weight:700;color:#fff;transition:all .15s}
.numpad button:hover{background:#2a3a5e}
.numpad button:active{transform:scale(.95)}
.numpad .op-key{background:rgba(67,97,238,.15);color:var(--blue)}
.numpad .submit-key{grid-column:1/-1;background:linear-gradient(135deg,var(--green),#0fa360);color:#fff}
.numpad .submit-key:disabled{opacity:.4}
.numpad .clear-key{background:rgba(239,71,111,.15);color:var(--red)}

/* ========== 提示/解析 ========== */
.hint-box{margin:8px 16px;padding:12px;background:rgba(255,214,10,.08);border:1px solid rgba(255,214,10,.2);border-radius:8px;font-size:13px;color:var(--yellow);display:none}
.hint-box.show{display:block}
.explain-box{margin:8px 16px;padding:12px;background:rgba(67,97,238,.08);border:1px solid rgba(67,97,238,.2);border-radius:8px;font-size:13px;color:#aab;display:none}
.explain-box.show{display:block}

/* ========== 工具按钮 ========== */
.tool-row{display:flex;gap:8px;padding:0 16px;margin:8px 0}
.tool-btn{flex:1;padding:10px;border-radius:8px;background:var(--card);font-size:13px;font-weight:600;color:#ccc;display:flex;align-items:center;justify-content:center;gap:4px}
.tool-btn:hover{background:#2a3a5e}
.tool-btn:disabled{opacity:.4}
.next-btn{display:block;width:calc(100% - 32px);margin:16px;padding:14px;border-radius:var(--radius);background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;font-size:16px;font-weight:700;display:none}
.next-btn.show{display:block}

/* ========== 答题结果 ========== */
.result-card{margin:16px;padding:24px;background:var(--card);border-radius:var(--radius);text-align:center}
.result-emoji{font-size:48px;margin-bottom:8px}
.result-title{font-size:20px;font-weight:900;margin-bottom:8px}
.result-stats{display:flex;justify-content:space-around;margin:16px 0}
.result-stat{text-align:center}
.result-stat .val{font-size:24px;font-weight:900;color:var(--cyan)}
.result-stat .lbl{font-size:12px;color:#888}
.result-exp{font-size:16px;font-weight:700;color:var(--yellow);margin:8px 0}

/* ========== 错题列表 ========== */
.mistake-card{margin:0 16px 8px;background:var(--card);border-radius:var(--radius);padding:16px;cursor:pointer;transition:all .2s}
.mistake-card:hover{background:#1e2d4a}
.mistake-q{font-size:15px;font-weight:600;margin-bottom:6px}
.mistake-answers{display:flex;gap:16px;font-size:13px}
.mistake-answers .your{color:var(--red)}
.mistake-answers .correct{color:var(--green)}
.mistake-detail{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.mistake-detail.show{display:block}
.mistake-explain{font-size:13px;color:#aab;margin-top:6px}
.similar-btn{margin-top:8px;padding:8px 16px;border-radius:8px;background:rgba(6,214,160,.15);color:var(--cyan);font-size:13px;font-weight:600}

/* ========== 成就 ========== */
.ach-card{margin:0 16px 8px;background:var(--card);border-radius:var(--radius);padding:16px;display:flex;align-items:center;gap:12px;transition:all .2s}
.ach-card.unlocked{border:1px solid rgba(6,214,160,.3)}
.ach-icon{width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.ach-card.unlocked .ach-icon{background:rgba(6,214,160,.1)}
.ach-info{flex:1}
.ach-name{font-size:14px;font-weight:700}
.ach-desc{font-size:12px;color:#888;margin-top:2px}
.ach-bar{height:6px;background:rgba(255,255,255,.08);border-radius:3px;margin-top:4px;overflow:hidden}
.ach-bar-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--blue));border-radius:3px}
.ach-reward{font-size:12px;color:var(--yellow);margin-top:3px}

/* ========== 商店 ========== */
.shop-card{margin:0 16px 8px;background:var(--card);border-radius:var(--radius);padding:16px;display:flex;align-items:center;gap:12px}
.shop-icon{width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.shop-info{flex:1}
.shop-name{font-size:14px;font-weight:700}
.shop-desc{font-size:12px;color:#888;margin-top:2px}
.shop-price{font-size:14px;font-weight:700;color:var(--yellow)}
.buy-btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;transition:all .2s}
.buy-btn.can{background:linear-gradient(135deg,var(--green),#0fa360);color:#fff}
.buy-btn.cant{background:rgba(255,255,255,.05);color:#555;cursor:not-allowed}
.buy-btn.owned{background:rgba(6,214,160,.1);color:var(--cyan);cursor:default}

/* ========== 空状态 ========== */
.empty{text-align:center;padding:60px 20px;color:#555}
.empty-icon{font-size:48px;margin-bottom:8px}

/* ========== 动画 ========== */
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.pop{animation:pop .3s ease-out}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .3s}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.slide-up{animation:slideUp .3s ease-out}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.float{animation:float 2s ease-in-out infinite}

/* ========== 页面切换 ========== */
.page{display:none;animation:slideUp .3s ease-out}
.page.active{display:block}

/* ========== Toast ========== */
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:999;padding:12px 24px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .3s}
#toast.show{opacity:1}
#toast.success{background:rgba(6,214,160,.9);color:#fff}
#toast.error{background:rgba(239,71,111,.9);color:#fff}
#toast.info{background:rgba(67,97,238,.9);color:#fff}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script>
// ============================================================
// 数学练习APP - 七年级数学人教版
// 单文件完整版
// ============================================================

// ========== 工具函数 ==========
const $ = (s) => document.querySelector(s);
const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const randF = (min, max, d = 1) => parseFloat((Math.random() * (max - min) + min).toFixed(d));
const choice = (arr) => arr[Math.floor(Math.random() * arr.length)];
const genId = () => `${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;

function showToast(msg, type = 'info') {
  const t = $('#toast');
  t.textContent = msg;
  t.className = type + ' show';
  setTimeout(() => t.classList.remove('show'), 2000);
}

function getNumRange(diff) {
  return diff === 'easy' ? {min:1,max:20} : diff === 'medium' ? {min:-20,max:50} : {min:-50,max:100};
}

// ========== 章节定义 ==========
const CHAPTERS = [
  {
    id: 'ch1', name: '第一章 有理数', desc: '正数与负数、有理数概念、数轴、绝对值', icon: '🔢',
    types: [
      {id:'rational_concept', name:'有理数概念'},
      {id:'number_line', name:'数轴表示'},
      {id:'absolute_value', name:'绝对值计算'},
      {id:'rational_compare', name:'比较大小'},
    ]
  },
  {
    id: 'ch2', name: '第二章 有理数运算', desc: '有理数加减乘除及混合运算', icon: '🧮',
    types: [
      {id:'rational_add_sub', name:'有理数加减'},
      {id:'rational_mul_div', name:'有理数乘除'},
      {id:'rational_mixed', name:'混合运算'},
      {id:'power_operation', name:'乘方运算'},
    ]
  },
  {
    id: 'ch3', name: '第三章 代数式', desc: '代数式概念、代数式求值、整式', icon: '✏️',
    types: [
      {id:'algebraic_eval', name:'代数式求值'},
      {id:'monomial', name:'单项式识别'},
      {id:'polynomial', name:'多项式次数'},
      {id:'algebraic_write', name:'代数式书写'},
    ]
  },
  {
    id: 'ch4', name: '第四章 整式的加减', desc: '合并同类项、去括号、整式加减运算', icon: '📐',
    types: [
      {id:'combine_like', name:'合并同类项'},
      {id:'remove_paren', name:'去括号'},
      {id:'integer_add_sub', name:'整式加减'},
      {id:'integer_simplify', name:'化简求值'},
    ]
  },
  {
    id: 'ch5', name: '第五章 一元一次方程', desc: '方程概念、解方程、实际应用', icon: '⚖️',
    types: [
      {id:'solve_linear', name:'解方程'},
      {id:'equation_apply', name:'方程应用'},
      {id:'equation_check', name:'方程检验'},
    ]
  },
  {
    id: 'ch6', name: '第六章 几何图形初步', desc: '立体图形、平面图形、线与角', icon: '📏',
    types: [
      {id:'angle_calc', name:'角度计算'},
      {id:'complementary', name:'余角补角'},
      {id:'vertical_angle', name:'对顶角'},
      {id:'parallel_angle', name:'平行线角度'},
    ]
  },
];

// ========== 题目生成器 ==========
const GEN = {
  // ===== 第一章 有理数 =====
  rational_concept(d) {
    const examples = [
      {num:'3', desc:'正整数', code:1},
      {num:'-5', desc:'负整数', code:2},
      {num:'1/2', desc:'正分数', code:3},
      {num:'-1/3', desc:'负分数', code:4},
      {num:'0', desc:'零', code:5},
      {num:'2.5', desc:'正分数', code:3},
      {num:'-0.7', desc:'负分数', code:4},
      {num:'10', desc:'正整数', code:1},
    ];
    const c = choice(examples);
    return {expr:`判断 ${c.num} 属于哪类有理数？（1正整数 2负整数 3正分数 4负分数 5零）`, ans:c.code,
      hints:['有理数包括整数和分数','整数包括正整数、零、负整数'],
      explain:`${c.num} 是${c.desc}，答案选${c.code}`};
  },
  number_line(d) {
    const r = getNumRange(d);
    const a = rand(r.min,r.max), b = rand(r.min,r.max), c = rand(r.min,r.max);
    const sorted = [...new Set([a,b,c])].sort((x,y)=>x-y);
    const ans = parseInt(sorted.join(''));
    return {expr:`在数轴上表示 ${a}, ${b}, ${c}，从左到右排列依次拼接（如3-105表示-10,3,5）`, ans,
      hints:['数轴上右边的数总比左边的大','负数在原点左边，正数在右边'],
      explain:`从小到大排列：${sorted.join(' < ')}`};
  },
  absolute_value(d) {
    const r = getNumRange(d);
    const a = rand(r.min,r.max), b = rand(r.min,r.max);
    const ans = Math.abs(a) + Math.abs(b);
    return {expr:`|${a}| + |${b}| = ?`, ans,
      hints:['绝对值一定是非负数','|a| = -a (当a<0时)'],
      explain:`|${a}| = ${Math.abs(a)}, |${b}| = ${Math.abs(b)}, 所以 ${Math.abs(a)} + ${Math.abs(b)} = ${ans}`};
  },
  rational_compare(d) {
    const r = getNumRange(d);
    const a = rand(r.min,r.max), b = rand(r.min,r.max);
    const ans = a > b ? 1 : a < b ? -1 : 0;
    return {expr:`比较大小：${a} 和 ${b}（大的填1，小的填-1，相等填0）`, ans,
      hints:['正数大于负数','两个负数比较，绝对值大的反而小'],
      explain:`${a} ${a>b?'>':a<b?'<':'='} ${b}`};
  },

  // ===== 第二章 有理数运算 =====
  rational_add_sub(d) {
    const r = getNumRange(d);
    const a = rand(r.min,r.max), b = rand(r.min,r.max);
    const op = choice(['+','-']);
    const expr = `${a} ${op} ${b}`;
    const ans = op === '+' ? a + b : a - b;
    return {expr:`${expr} = ?`, ans, hints:['注意正负号','同号相加取相同符号，异号相减'], explain:`${expr} = ${ans}`};
  },
  rational_mul_div(d) {
    const r = getNumRange(d);
    const a = rand(r.min,r.max);
    let b = rand(1,Math.max(2,r.max));
    while(b === 0) b = rand(1,r.max);
    const op = choice(['×','÷']);
    if(op === '×') {
      return {expr:`${a} × ${b} = ?`, ans:a*b, hints:['注意符号：负负得正','两数相乘，同号得正异号得负'], explain:`${a} × ${b} = ${a*b}`};
    } else {
      const result = rand(-10,10);
      const dividend = b * result;
      return {expr:`${dividend} ÷ ${b} = ?`, ans:result, hints:['除法要注意除数不为0','同号得正，异号得负'], explain:`${dividend} ÷ ${b} = ${result}`};
    }
  },
  rational_mixed(d) {
    const r = getNumRange(d);
    const a = rand(r.min,r.max), b = rand(r.min,r.max), c = rand(1,r.max);
    const op1 = choice(['+','-']);
    const expr = `${a} ${op1} ${b} × ${c}`;
    const second = b * c;
    const ans = op1 === '+' ? a + second : a - second;
    return {expr:`${expr} = ?`, ans, hints:['先算乘法，后算加减','注意符号'], explain:`先算 ${b} × ${c} = ${second}，再算 ${a} ${op1} ${second} = ${ans}`};
  },
  power_operation(d) {
    const base = rand(-6,6);
    const exp = choice([2,3]);
    const ans = Math.pow(base, exp);
    const sup = exp === 2 ? '²' : '³';
    return {expr:`${base}${sup} = ?`, ans, hints:['负数的偶次幂是正数','a² = a × a'], explain:`${base} × ${base}${exp===3?' × '+base:''} = ${ans}`};
  },

  // ===== 第三章 代数式 =====
  algebraic_eval(d) {
    const x = rand(1,10);
    const a = rand(1,8), b = rand(1,8);
    const expr = `当 x = ${x} 时，求 ${a}x + ${b} 的值`;
    const ans = a * x + b;
    return {expr, ans, hints:['将x的值代入代数式','先算乘法，再算加减'], explain:`当x=${x}时，${a}x + ${b} = ${a}×${x} + ${b} = ${a*x} + ${b} = ${ans}`};
  },
  monomial(d) {
    const examples = [
      {expr:'5x', isM:true}, {expr:'3xy', isM:true}, {expr:'2', isM:true},
      {expr:'-7x²y', isM:true}, {expr:'x+y', isM:false}, {expr:'1/x', isM:false},
      {expr:'a²+b', isM:false}, {expr:'-3', isM:true}, {expr:'mn', isM:true},
    ];
    const c = choice(examples);
    return {expr:`判断"${c.expr}"是不是单项式？（是填1，否填0）`, ans:c.isM?1:0,
      hints:['单项式是数与字母的积','单独一个数或字母也是单项式'],
      explain:`"${c.expr}"${c.isM?'是':'不是'}单项式`};
  },
  polynomial(d) {
    const a = rand(1,5), b = rand(1,5), c = rand(1,5);
    const deg = choice([2,3]);
    const sup = deg === 2 ? '²' : '³';
    return {expr:`多项式 ${a}x${sup} + ${b}x + ${c} 的次数是多少？`, ans:deg,
      hints:['多项式的次数是次数最高项的次数',`x${sup}的次数是${deg}`],
      explain:`多项式 ${a}x${sup} + ${b}x + ${c} 中最高次数是${deg}，所以次数是${deg}`};
  },
  algebraic_write(d) {
    const exprs = [
      {desc:'a的3倍', ans:'3a'}, {desc:'x与y的和', ans:'x+y'},
      {desc:'m的平方', ans:'m²'}, {desc:'a的倒数', ans:'1/a'},
      {desc:'x的2倍与3的差', ans:'2x-3'}, {desc:'a与b的积的一半', ans:'ab/2'},
    ];
    const c = choice(exprs);
    const code = exprs.indexOf(c) + 1;
    return {expr:`用代数式表示"${c.desc}"（选序号${exprs.map((e,i)=>`${i+1}.${e.ans}`).join(' ')}）`, ans:code,
      hints:['数字与字母相乘，数字写在前面','除法写成分数形式'],
      explain:`"${c.desc}"用代数式表示为 ${c.ans}`};
  },

  // ===== 第四章 整式的加减 =====
  combine_like(d) {
    const a = rand(1,9), b = rand(1,9), c = rand(1,9);
    const expr = `${a}x + ${b} - ${c}x`;
    const newX = a - c;
    return {expr:`合并同类项：${expr} = ?（把x的系数和常数项拼起来，如3x+5填35）`, ans: newX*10+b,
      hints:['找出同类项','合并同类项时系数相加减'],
      explain:`${a}x - ${c}x = ${newX}x，常数项${b}不变，结果为 ${newX}x + ${b}`};
  },
  remove_paren(d) {
    const a = rand(1,6), b = rand(1,6), c = rand(1,6);
    const sign = choice(['+','-']);
    const expr = `去括号：${sign}(${a}x + ${b}y - ${c})`;
    let ans;
    if(sign === '+') {
      ans = a*100 + b*10 + c;
    } else {
      ans = (-a)*100 + (-b)*10 + c;
    }
    // 用拼接表示结果：(±a)x (±b)y (±c)
    const parts = sign === '+' ? [a, b, -c] : [-a, -b, c];
    const ansStr = `${parts[0]}x ${parts[1]>=0?'+':''}${parts[1]}y ${parts[2]>=0?'+':''}${parts[2]}`;
    return {expr:`${expr}（x系数×100+y系数×10+常数）`, ans,
      hints:['括号前是+号，去括号后符号不变','括号前是-号，去括号后各项变号'],
      explain:`${sign}(${a}x + ${b}y - ${c}) = ${ansStr}`};
  },
  integer_add_sub(d) {
    const a = rand(1,8), b = rand(1,8), c = rand(1,8), dd = rand(1,8);
    const expr = `(${a}x + ${b}) + (${c}x - ${dd})`;
    const newX = a + c, newC = b - dd;
    return {expr:`${expr} = ?（x系数×10+常数项）`, ans: newX*10+newC,
      hints:['先去括号','再合并同类项'],
      explain:`去括号：${a}x + ${b} + ${c}x - ${dd}，合并同类项：${newX}x + ${newC}`};
  },
  integer_simplify(d) {
    const a = rand(1,5), b = rand(1,5), c = rand(1,5);
    const x = rand(1,10);
    const expr = `化简并求值：(${a}x + ${b}) - (${c}x - 1)，其中 x = ${x}`;
    const newX = a - c, newC = b + 1;
    const ans = newX * x + newC;
    return {expr, ans, hints:['先化简整式','再代入x的值计算'],
      explain:`化简：${a}x + ${b} - ${c}x + 1 = ${newX}x + ${newC}，代入x=${x}得：${newX}×${x} + ${newC} = ${ans}`};
  },

  // ===== 第五章 一元一次方程 =====
  solve_linear(d) {
    const a = rand(2,9), b = rand(1,20), c = rand(b+1, b+30);
    const expr = `${a}x + ${b} = ${c}`;
    const ans = (c - b) / a;
    return {expr:`解方程：${expr}（求x的值）`, ans,
      hints:['移项要变号','系数化为1'],
      explain:`${a}x + ${b} = ${c} → ${a}x = ${c-b} → x = ${c-b}/${a} = ${ans}`};
  },
  equation_apply(d) {
    const types = [
      () => {
        const price = rand(10,100), discount = choice([5,6,7,8,9]);
        const ans = Math.round(price * (discount/10) * 2);
        return {expr:`一件商品原价${price}元，打${discount}折出售，买两件需付多少元？`, ans,
          hints:['打折后价格 = 原价 × 折扣/10','8折表示原价的80%'],
          explain:`每件：${price} × ${discount}/10 = ${price*discount/10}元，两件：${price*discount/10} × 2 = ${ans}元`};
      },
      () => {
        const total = rand(50,200), more = rand(5,30);
        const a = Math.round((total - more) / 2);
        const b = a + more;
        return {expr:`甲乙两人共有${total}元，甲比乙多${more}元，乙有多少元？`, ans:a,
          hints:['设乙有x元','甲有x+'+more+'元，列方程求解'],
          explain:`设乙有x元，则甲有x+${more}元，x + (x+${more}) = ${total}，x = ${a}`};
      },
      () => {
        const speed = rand(40,80), time = rand(2,6);
        const ans = speed * time;
        return {expr:`一辆汽车以${speed}千米/时的速度行驶了${time}小时，行驶了多少千米？`, ans,
          hints:['路程 = 速度 × 时间'],
          explain:`${speed} × ${time} = ${ans} 千米`};
      },
    ];
    return choice(types)();
  },
  equation_check(d) {
    const a = rand(2,9), b = rand(1,20);
    const x = rand(1,10);
    const lhs = a * x + b;
    const rhs = lhs + choice([0, 0, rand(1,5), -rand(1,5)]);
    const ans = lhs === rhs ? 1 : 0;
    return {expr:`检验 x = ${x} 是否是方程 ${a}x + ${b} = ${rhs} 的解？（是填1，否填0）`, ans,
      hints:['将x的值代入方程两边','看左右两边是否相等'],
      explain:`代入x=${x}：左边=${a}×${x}+${b}=${lhs}，右边=${rhs}，${lhs===rhs?'左边=右边，是方程的解':'左边≠右边，不是方程的解'}`};
  },

  // ===== 第六章 几何图形初步 =====
  angle_calc(d) {
    const types = [
      () => {
        const angle = rand(20,80);
        return {expr:`一个角是${angle}°，求这个角的补角是多少度？`, ans:180-angle,
          hints:['补角和为180°','补角 = 180° - 已知角'],
          explain:`补角 = 180° - ${angle}° = ${180-angle}°`};
      },
      () => {
        const angle = rand(20,150);
        const ratio = choice([2,3]);
        const parts = angle / (1 + ratio);
        const ans = Math.round(parts * ratio);
        return {expr:`一个角的度数是另一个角的${ratio}倍，两个角之和为${angle}°，求较大的角是多少度？`, ans,
          hints:['设较小角为x，则较大角为'+ratio+'x','列方程：x + '+ratio+'x = '+angle],
          explain:`设较小角为x，则${ratio}x + x = ${angle}，x = ${Math.round(parts)}，较大角 = ${ans}°`};
      },
    ];
    return choice(types)();
  },
  complementary(d) {
    const types = [
      () => {
        const angle = rand(10,80);
        return {expr:`∠A = ${angle}°，∠B是∠A的余角，求∠B的度数？`, ans:90-angle,
          hints:['余角和为90°','余角 = 90° - 已知角'],
          explain:`余角 = 90° - ${angle}° = ${90-angle}°`};
      },
      () => {
        const angle = rand(20,70);
        return {expr:`一个角的余角是${angle}°，求这个角是多少度？`, ans:90-angle,
          hints:['余角 + 这个角 = 90°'],
          explain:`这个角 = 90° - ${angle}° = ${90-angle}°`};
      },
    ];
    return choice(types)();
  },
  vertical_angle(d) {
    const angle = rand(30,150);
    const types = [
      () => ({expr:`两条直线相交，一个角是${angle}°，求它的对顶角是多少度？`, ans:angle,
        hints:['对顶角相等'],
        explain:`对顶角相等，所以对顶角 = ${angle}°`}),
      () => ({expr:`两条直线相交，一个角是${angle}°，求它的邻补角是多少度？`, ans:180-angle,
        hints:['邻补角和为180°','邻补角 = 180° - 已知角'],
        explain:`邻补角 = 180° - ${angle}° = ${180-angle}°`}),
    ];
    return choice(types)();
  },
  parallel_angle(d) {
    const angle = rand(30,150);
    const types = [
      () => ({expr:`两直线平行，一个同位角是${angle}°，求另一个同位角的度数？`, ans:angle,
        hints:['两直线平行，同位角相等'],
        explain:`平行线性质：同位角相等，所以另一个同位角 = ${angle}°`}),
      () => ({expr:`两直线平行，一个内错角是${angle}°，求另一个内错角的度数？`, ans:angle,
        hints:['两直线平行，内错角相等'],
        explain:`平行线性质：内错角相等，所以另一个内错角 = ${angle}°`}),
      () => ({expr:`两直线平行，同旁内角为${angle}°，求另一个同旁内角的度数？`, ans:180-angle,
        hints:['两直线平行，同旁内角互补','互补即和为180°'],
        explain:`平行线性质：同旁内角互补，所以另一个 = 180° - ${angle}° = ${180-angle}°`}),
    ];
    return choice(types)();
  },
};

// ========== 生成题目 ==========
function generateQuestion(chapterId, typeId, difficulty) {
  const chapter = CHAPTERS.find(c => c.id === chapterId);
  if(!chapter) return null;
  const types = typeId ? chapter.types.filter(t => t.id === typeId) : chapter.types;
  if(types.length === 0) return null;
  const t = choice(types);
  const gen = GEN[t.id];
  if(!gen) return null;
  const data = gen(difficulty);
  return {
    id: genId(),
    chapter: chapterId,
    chapterName: chapter.name,
    type: t.id,
    typeName: t.name,
    difficulty,
    expression: data.expr,
    answer: data.ans,
    hints: data.hints,
    explanation: data.explain,
  };
}

function generateQuestions(chapterId, count, typeId, difficulty) {
  const qs = [];
  for(let i = 0; i < count; i++) {
    const q = generateQuestion(chapterId, typeId, difficulty);
    if(q) qs.push(q);
  }
  return qs;
}

function generateSimilar(question) {
  return generateQuestion(question.chapter, question.type, question.difficulty);
}

// ========== 游戏状态管理 ==========
const STORAGE_KEY = 'math_app_v2';

function loadState() {
  try {
    const data = localStorage.getItem(STORAGE_KEY);
    if(data) return JSON.parse(data);
  } catch(e) {}
  return {
    level: 1, exp: 0, coins: 100,
    totalQuestions: 0, correctQuestions: 0,
    streak: 0, maxStreak: 0,
    completedTypes: [],
    unlockedAchievements: [],
    ownedItems: [],
    currentSkin: 'default',
    mistakes: [],
    dailyDate: '',
    dailyAnswered: 0,
    dailyCorrect: 0,
    dailyClaimed: false,
  };
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e) {}
}

let state = loadState();

// ========== 状态操作 ==========
function addExp(amount) {
  state.exp += amount;
  let need = getExpForLevel(state.level);
  while(state.exp >= need) {
    state.exp -= need;
    state.level++;
    need = getExpForLevel(state.level);
    showToast(`🎉 升级！Lv.${state.level} ${getLevelName(state.level)}`, 'success');
  }
  saveState();
}

function addCoins(amount) {
  state.coins += amount;
  saveState();
}

function addQuestionResult(correct, chapterId, typeId) {
  state.totalQuestions++;
  if(correct) {
    state.correctQuestions++;
    state.streak++;
    state.maxStreak = Math.max(state.maxStreak, state.streak);
    // 连击奖励
    let bonusExp = 0, bonusCoins = 0;
    if(state.streak === 5) { bonusExp = 20; bonusCoins = 10; showToast('🔥 5连击！+20经验 +10金币', 'success'); }
    else if(state.streak === 10) { bonusExp = 50; bonusCoins = 25; showToast('⚡ 10连击！+50经验 +25金币', 'success'); }
    else if(state.streak === 20) { bonusExp = 100; bonusCoins = 50; showToast('👑 20连击！+100经验 +50金币', 'success'); }
    addExp(10 + bonusExp);
    addCoins(5 + bonusCoins);
  } else {
    state.streak = 0;
  }
  // 记录完成的题型
  if(correct && chapterId && typeId) {
    const key = `${chapterId}_${typeId}`;
    if(!state.completedTypes.includes(key)) {
      state.completedTypes.push(key);
    }
  }
  // 更新每日任务
  const today = new Date().toISOString().split('T')[0];
  if(state.dailyDate !== today) {
    state.dailyDate = today;
    state.dailyAnswered = 0;
    state.dailyCorrect = 0;
    state.dailyClaimed = false;
  }
  state.dailyAnswered++;
  if(correct) state.dailyCorrect++;
  saveState();
  checkAchievements();
}

function addMistake(question, userAnswer) {
  state.mistakes.unshift({
    id: genId(),
    question,
    userAnswer,
    timestamp: Date.now(),
    reviewed: false,
  });
  // 限制最多100条
  if(state.mistakes.length > 100) state.mistakes = state.mistakes.slice(0, 100);
  saveState();
}

function markMistakeReviewed(id) {
  const m = state.mistakes.find(m => m.id === id);
  if(m) { m.reviewed = true; saveState(); }
}

function deleteMistake(id) {
  state.mistakes = state.mistakes.filter(m => m.id !== id);
  saveState();
}

function checkAchievements() {
  for(const ach of ACHIEVEMENTS) {
    if(state.unlockedAchievements.includes(ach.id)) continue;
    let unlocked = false;
    if(ach.type === 'total' && state.totalQuestions >= ach.target) unlocked = true;
    else if(ach.type === 'streak' && state.maxStreak >= ach.target) unlocked = true;
    else if(ach.type === 'accuracy' && state.totalQuestions >= 10) {
      const acc = (state.correctQuestions / state.totalQuestions) * 100;
      if(acc >= ach.target) unlocked = true;
    }
    else if(ach.type === 'chapter') {
      const chapter = CHAPTERS.find(c => c.id === `ch${ach.target}`);
      if(chapter) {
        const allTypes = chapter.types.map(t => `${chapter.id}_${t.id}`);
        unlocked = allTypes.every(key => state.completedTypes.includes(key));
      }
    }
    if(unlocked) {
      state.unlockedAchievements.push(ach.id);
      addExp(ach.exp);
      addCoins(ach.coins);
      showToast(`🏆 解锁成就：${ach.name}！+${ach.exp}经验 +${ach.coins}金币`, 'success');
      saveState();
    }
  }
}

function buyItem(itemId) {
  const item = SHOP_ITEMS.find(i => i.id === itemId);
  if(!item) return false;
  if(state.ownedItems.includes(itemId)) return false;
  if(state.coins < item.price) return false;
  state.coins -= item.price;
  state.ownedItems.push(itemId);
  saveState();
  showToast(`购买成功：${item.name}！`, 'success');
  return true;
}

function useItem(itemId) {
  if(!state.ownedItems.includes(itemId)) return false;
  // 道具使用逻辑在答题中处理
  return true;
}

function getAccuracy() {
  return state.totalQuestions === 0 ? 0 : Math.round((state.correctQuestions / state.totalQuestions) * 100);
}

function getExpProgress() {
  const need = getExpForLevel(state.level);
  return Math.min(100, (state.exp / need) * 100);
}

function getDailyTaskProgress() {
  return {answered: state.dailyAnswered, correct: state.dailyCorrect,
    target: 20, completed: state.dailyAnswered >= 20 && state.dailyCorrect >= 15,
    claimed: state.dailyClaimed};
}

function claimDailyReward() {
  const task = getDailyTaskProgress();

  switch(page) {

    case 'practice': renderPractice(); break;
    case 'quiz': renderQuiz(); break;
    case 'result': renderResult(); break;

      </div>

        <button class="tool-btn" onclick="useHint()" id="hintBtn" ${quiz.hintUsed || !state.ownedItems.includes('hint') ? 'disabled' : ''}>

        </button>
        <button class="tool-btn" onclick="useTimeExt()" id="timeBtn" ${!state.ownedItems.includes('time_ext') ? 'disabled' : ''}>
          ⏰ 延长时间 ${state.ownedItems.includes('time_ext') ? '×1' : '(未拥有)'}
        </button>

          🛡️ 免错卡 ${state.ownedItems.includes('skip') ? '×1' : '(未拥有)'}
        </button>
      </div>
    ` : `
      <button class="next-btn show" onclick="nextQuestion()">${quiz.index < quiz.questions.length - 1 ? '下一题 →' : '查看结果 →'}</button>
    `}
  `;
}

function inputNum(n) {
  if(quiz.answered) return;
  quiz.currentAnswer += n;
  updateAnswerDisplay();
}

function clearInput() {
  if(quiz.answered) return;
  quiz.currentAnswer = '';
  updateAnswerDisplay();
}

function updateAnswerDisplay() {
  const el = $('#answerDisplay');
  if(el) el.textContent = quiz.currentAnswer || '?';
}

function submitAnswer() {
  if(quiz.answered || !quiz.currentAnswer) return;
  clearInterval(quiz.timerInterval);

  const q = quiz.questions[quiz.index];
  const userAns = parseFloat(quiz.currentAnswer);
  const correctAns = q.answer;
  const isCorrect = Math.abs(userAns - correctAns) < 0.01;

  quiz.answered = true;

  const feedback = $('#feedback');
  const display = $('#answerDisplay');

  if(isCorrect) {
    quiz.correctCount++;
    let exp = 10, coins = 5;
    if(quiz.doubleExpActive) { exp *= 2; coins *= 2; }
    quiz.expGained += exp;
    quiz.coinsGained += coins;
    feedback.className = 'feedback show correct';
    feedback.innerHTML = `✅ 回答正确！+${exp}经验 +${coins}金币`;
    display.className = 'answer-display correct pop';
  } else {
    // 使用免错卡
    if(state.ownedItems.includes('skip') && !quiz.skipUsed) {
      quiz.skipUsed = true;
      state.ownedItems = state.ownedItems.filter(i => i !== 'skip');
      saveState();
      quiz.correctCount++;
      let exp = 10, coins = 5;
      quiz.expGained += exp;
      quiz.coinsGained += coins;
      feedback.className = 'feedback show correct';
      feedback.innerHTML = `🛡️ 免错卡生效！+${exp}经验 +${coins}金币`;
      display.className = 'answer-display correct pop';
    } else {
      feedback.className = 'feedback show wrong';
      feedback.innerHTML = `❌ 回答错误！你的答案：${userAns}，正确答案：${correctAns}`;
      display.className = 'answer-display wrong shake';
      // 添加错题
      addMistake(q, userAns);
    }
  }

  addQuestionResult(isCorrect || quiz.skipUsed, q.chapter, q.type);

  // 显示解析
  $('#explainBox').classList.add('show');

  // 更新页面
  setTimeout(() => renderQuiz(), 300);
}

function useHint() {
  if(quiz.hintUsed || !state.ownedItems.includes('hint')) return;
  quiz.hintUsed = true;
  state.ownedItems = state.ownedItems.filter(i => i !== 'hint');
  saveState();
  $('#hintBox').classList.add('show');
  $('#hintBtn').disabled = true;
  showToast('💡 已使用提示卡', 'info');
}

function useTimeExt() {
  if(!state.ownedItems.includes('time_ext')) return;
  state.ownedItems = state.ownedItems.filter(i => i !== 'time_ext');
  saveState();
  quiz.timer += 30;
  $('#timer').textContent = `⏱ ${quiz.timer}s`;
  $('#timeBtn').disabled = true;
  showToast('⏰ 时间+30秒', 'info');
}

function useSkip() {
  if(!state.ownedItems.includes('skip')) return;
  showToast('🛡️ 免错卡已准备，答错时自动生效', 'info');
}

function nextQuestion() {
  quiz.index++;
  if(quiz.index >= quiz.questions.length) {
    navigate('result');
    return;
  }
  quiz.currentAnswer = '';
  quiz.answered = false;
  quiz.hintUsed = false;
  quiz.skipUsed = false;
  quiz.timer = 60;
  renderQuiz();
  startTimer();
}

function startTimer() {
  clearInterval(quiz.timerInterval);
  quiz.timerInterval = setInterval(() => {
    quiz.timer--;
    const el = $('#timer');
    if(el) {
      el.textContent = `⏱ ${quiz.timer}s`;
      if(quiz.timer <= 10) el.className = 'quiz-timer warn';
    }
    if(quiz.timer <= 0) {
      clearInterval(quiz.timerInterval);
      if(!quiz.answered) {
        quiz.currentAnswer = '0';
        submitAnswer();
      }
    }
  }, 1000);
}

            <button class="similar-btn" onclick="event.stopPropagation();startSimilarPractice('${m.id}')">📝 相似题练习</button>

function toggleMistake(id) {
  mistakeState.expanded = mistakeState.expanded === id ? null : id;
  renderMistakes();
  if(mistakeState.expanded) {
    markMistakeReviewed(id);
  }
}

function deleteMistakeFromList(id) {
  deleteMistake(id);
  renderMistakes();
  showToast('已删除错题', 'info');
}

function startSimilarPractice(mistakeId) {
  const m = state.mistakes.find(m => m.id === mistakeId);
  if(!m) return;
  const questions = [];
  for(let i = 0; i < 5; i++) {
    const q = generateSimilar(m.question);
    if(q) questions.push(q);
  }
  if(questions.length === 0) return;

  quiz = {
    questions,
    index: 0,
    answers: [],
    currentAnswer: '',
    timer: 60,
    timerInterval: null,
    showed: false,
    explained: false,
    hintUsed: false,
    skipUsed: false,
    doubleExpActive: false,
    fromMistakes: true,
    correctCount: 0,
    expGained: 0,
    coinsGained: 0,
  };
  mistakeState.similarMode = false;
  navigate('quiz');
  startTimer();
}

      let progress = 0;
      if(ach.type === 'total') progress = Math.min(100, state.totalQuestions / ach.target * 100);
      else if(ach.type === 'streak') progress = Math.min(100, state.maxStreak / ach.target * 100);
      else if(ach.type === 'accuracy') progress = state.totalQuestions >= 10 ? Math.min(100, getAccuracy() / ach.target * 100) : 0;
      else if(ach.type === 'chapter') {
        const chapter = CHAPTERS.find(c => c.id === `ch${ach.target}`);
        if(chapter) {
          const allTypes = chapter.types.map(t => `${chapter.id}_${t.id}`);
          const done = allTypes.filter(k => state.completedTypes.includes(k)).length;
          progress = done / allTypes.length * 100;
        }
      }

      return `
        <div class="ach-card ${unlocked ? 'unlocked' : ''}">
          <div class="ach-icon ${unlocked ? '' : 'float'}" style="${unlocked ? '' : 'opacity:0.4'}">${ach.icon}</div>
          <div class="ach-info">
            <div class="ach-name">${ach.name} ${unlocked ? '✅' : ''}</div>
            <div class="ach-desc">${ach.desc}</div>
            ${!unlocked ? `<div class="ach-bar"><div class="ach-bar-fill" style="width:${progress}%"></div></div>` : ''}
            <div class="ach-reward">奖励：${ach.exp}经验 + ${ach.coins}金币</div>
          </div>
        </div>
      `;
    }).join('')}
  `;
}

// ========== 商店页 ==========
function renderShop() {
  app.innerHTML = `
    <div class="navbar">
      <div class="nav-back" onclick="navigate('home')">←</div>
      <div class="nav-title">商店</div>
      <div class="coins-display">🪙 ${state.coins}</div>
    </div>

    <div class="section-title">🛍️ 道具</div>
    ${SHOP_ITEMS.filter(i => i.type === 'prop').map(item => {
      const owned = state.ownedItems.includes(item.id);
      const canBuy = state.coins >= item.price;
      return `
        <div class="shop-card">
          <div class="shop-icon">${item.icon}</div>
          <div class="shop-info">
            <div class="shop-name">${item.name}</div>
            <div class="shop-desc">${item.desc}</div>
            <div class="shop-price">🪙 ${item.price}</div>
          </div>
          ${owned ?
            '<button class="buy-btn owned">已拥有</button>' :
            `<button class="buy-btn ${canBuy ? 'can' : 'cant'}" ${canBuy ? `onclick="buyItemFromShop('${item.id}')"` : 'disabled'}>购买</button>`
          }
        </div>
      `;
    }).join('')}

    <div class="section-title">🎨 皮肤</div>
    ${SHOP_ITEMS.filter(i => i.type === 'skin').map(item => {
      const owned = state.ownedItems.includes(item.id);
      const canBuy = state.coins >= item.price;
      return `
        <div class="shop-card">
          <div class="shop-icon">${item.icon}</div>
          <div class="shop-info">
            <div class="shop-name">${item.name}</div>
            <div class="shop-desc">${item.desc}</div>
            <div class="shop-price">🪙 ${item.price}</div>
          </div>
          ${owned ?
            '<button class="buy-btn owned">已拥有</button>' :
            `<button class="buy-btn ${canBuy ? 'can' : 'cant'}" ${canBuy ? `onclick="buyItemFromShop('${item.id}')"` : 'disabled'}>购买</button>`
          }
        </div>
      `;
    }).join('')}

    <div style="padding:16px;font-size:13px;color:#555;text-align:center">
      💰 赚取金币：答题+5/题，连击额外奖励，成就解锁大量金币
    </div>
  `;
}

function buyItemFromShop(itemId) {
  if(buyItem(itemId)) {
    renderShop();
  } else {
    showToast('金币不足！', 'error');
  }
}

// ========== 初始化 ==========
window.addEventListener('DOMContentLoaded', () => {
  navigate('home');
  checkAchievements();
});
</script>
