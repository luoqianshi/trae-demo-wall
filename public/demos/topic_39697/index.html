<script>

const heritageData = [
  { name: "剪纸", category: "传统美术", img: "assets/heritage-jianzhi.jpg", desc: "以纸为材，以剪代笔，镂空成画。剪纸是中国最古老的民间艺术之一，用剪刀或刻刀在纸上剪刻花纹，用于装点生活或配合民俗活动。", craft: "剪、刻、撕、烧", inherit: "图案寓意、刀法技艺、民俗应用", legends: "相传汉武帝宠妃李夫人去世后，方士齐少翁以麻纸剪成夫人影像，夜间于帷帐中烛火映照，武帝远远望见，恍若李夫人再生。这一'招魂'之术被视为剪纸艺术的滥觞。此后千年，剪纸从宫廷走向民间，成为百姓婚丧嫁娶、年节喜庆不可或缺的装饰。", myths: "民间传说，剪纸能通鬼神。每逢除夕，家家户户贴上门神剪纸，可驱邪避灾。又传女娲补天时，以五色石之粉洒向人间，落地化为各色花纸，后人效之，以纸剪花，敬天祭祖。北方农村更流传'剪个金鸡报晓，瘟疫不敢来扰'的俗语，将剪纸视为护佑家宅的灵物。", founders: "剪纸无单一创始人，是集体智慧的结晶。但近现代有几位杰出的传承代表人物：陕北剪纸大师库淑兰（1920-2004），被誉为'剪花娘子'，其作品色彩浓烈、构图饱满，被联合国教科文组织授予'民间工艺美术大师'称号；河北蔚县剪纸创始人王老赏（1890-1951），将单色剪纸发展为彩色点染，开创了'阴刻为主、阳刻为辅'的独特风格；江苏扬州剪纸大师张永寿，以'百菊图''百蝶恋花图'闻名，其剪下的菊花瓣层次分明，堪称绝技。", craftDetail: "剪纸制作工艺极为繁复，可分为以下步骤：\n一、选纸：传统剪纸多用大红宣纸、洒金纸或蜡光纸。宣纸柔韧易剪，适合精细作品；蜡光纸色彩鲜艳，适合节庆装饰。高级作品采用手工染制的彩色皮纸，经久不褪。\n二、起稿：初学者需先用铅笔在纸上描绘图案，熟练者则可'腹中有稿'，直接下剪。复杂图案采用'熏样'法——将原稿用蜡烛烟熏，把图案转印到多层叠放的纸上，一次可剪出数十张相同的作品。\n三、折叠：对称图案需将纸反复对折。四折剪出四面对称，八折剪出八面放射。折叠时要压实压平，稍有错位，剪出的图案便会歪斜。\n四、剪刻：这是核心工序。剪刀以尖头细刃为佳，运剪讲究'稳、准、巧'——手腕悬空，剪刀开合如游鱼摆尾，先剪内部镂空，再剪外轮廓。刻制则使用小型刻刀，在蜡板上一层层推进，适合表现极细的线条和密如发丝的纹样。\n五、修整：剪完后轻轻展开，用镊子挑去毛刺，若有破损以同色纸补贴。彩色剪纸还需在背面用毛笔蘸色点染，颜色从浅到深，层层叠加。\n六、装裱：精品剪纸托裱于素色宣纸或绫绢之上，四周留白，装框悬挂。民间窗花则直接以面糊贴于窗棂，阳光透射，满室生辉。" },
  { name: "皮影戏", category: "传统戏剧", img: "assets/heritage-piying.jpg", desc: "一口叙说千古事，双手对舞百万兵。皮影戏是用兽皮或纸板做成的人物剪影，在灯光照射下用隔亮布进行演戏。", craft: "雕刻、上色、操纵、唱腔", inherit: "皮影造型、操纵技巧、声腔艺术", legends: "汉武帝刘彻的妃子李夫人病逝后，武帝日夜思念。齐国方士李少翁以棉帛裁成李夫人影像，涂上色彩，入夜于方帷中张灯烛，恭请武帝端坐帐中观望。武帝龙颜大悦，视为奇术。这便是皮影戏最早的雏形，距今已有两千余年。", myths: "皮影界尊奉黄龙真人为祖师。相传春秋战国时期，孔子周游列国，路遇强盗，弟子子路拔刀相向。孔子以礼义感化，强盗不服。孔子遂以皮革剪成人形，借月光投影于岩壁，演绎'周礼'故事，强盗观之动容，弃暗投明。后人感念孔子以皮影化人，遂将此艺代代相传。", founders: "皮影戏无单一创始人，但各地流派皆有宗师。陕西华县皮影代表传承人魏宗富，被誉'皮影第一刀'，其雕刻的影人线条流畅、神态生动；北京皮影大师路宝刚，独创'路家班'表演风格，将京剧身段融入皮影操纵；浙江海宁皮影传承人徐二男，继承南宋'羊皮影'古法，以羊皮为材，薄如蝉翼，透光性极佳。", craftDetail: "皮影制作工艺堪称'皮上的雕塑'，全程约需三十余道工序：\n一、选皮：以三岁左右的秦川黄牛皮为上品，皮薄而韧，纤维细腻。驴皮、羊皮次之。将生皮浸泡于石灰水中数日，去毛去肉，刮净油脂，晾至半透明。\n二、制皮：将处理好的皮张绷于木框，以文火慢慢烘干。火候是关键——火大了皮会卷曲变形，火小了则水分残留易腐。烘好的皮平整如镜，敲击有清脆之声。\n三、画稿：将传统人物图谱（称为'样谱'）覆于皮上，以钢针沿轮廓扎出细密针孔，形成'过稿'。人物造型遵循'五分脸、侧身眼、通天鼻、眉连鬓'的程式，生旦净丑各有脸谱。\n四、镂刻：使用斜口刻刀、平口刀、圆口刀等十余种刀具，沿针孔线路雕刻。刀法有'雪花刀''鱼鳞刀''月牙刀''圆针刀'等。刻制顺序讲究'先刻头帽，次刻五官，再刻衣纹，最后刻手足'。一件复杂影人往往要刻上万刀，耗时数日。\n五、敷彩：传统以矿物颜料和植物染料上色——朱砂为红、石青为蓝、藤黄为黄、赭石为褐。上色时以毛笔蘸色，由浅入深，层层渲染。同一张皮影，正反两面都要上色，确保透光后色彩一致。\n六、发汗熨平：上好色的皮影需用湿布包裹，置于热铁板上'发汗'，使颜料渗入皮纤维，再经熨斗压平，色泽方能经久不褪。\n七、缀结：将头、身、四肢分刻后，以丝线连接，并在关节处安装竹签或铁丝操纵杆。文官两根杆（双手），武将三根杆（双手加腰），神仙可多至五根杆，腾云驾雾，变化万千。\n八、演出准备：搭设三尺见方的白色纱幕（亮子），幕后燃灯（古时用油灯，今用白炽灯或LED），艺人藏身幕后，一手持影人，一手操纵杆，口唱念白，脚踩锣鼓，一人即是一台戏。" },
  { name: "青花瓷", category: "传统技艺", img: "assets/heritage-ceramics.jpg", desc: "白地青花，幽靓雅致。青花瓷以含氧化钴的钴矿为原料，在陶瓷坯体上描绘纹饰，再罩上一层透明釉，经高温还原焰烧成。", craft: "拉坯、绘青、施釉、烧制", inherit: "青料配制、绘画技法、窑火掌控", legends: "相传元代景德镇有一位叫赵万的画工，技艺平平。一日在瑶里山中偶遇一位白衣女子，女子以树枝蘸溪水在石板上画出缠枝莲纹，笔法灵动，宛若天成。赵万跪求传授，女子笑而不答，飘然而去。赵万将女子所画纹样铭记于心，回到窑场后依样绘制于瓷坯之上，烧出的青花瓷器蓝翠欲滴，震惊四座。后人称此纹样为'仙子莲'，赵万也因此成为景德镇青花名匠。", myths: "青花瓷的蓝，源自西域回回青料。传说郑和七下西洋，带回大量苏麻离青料。这种青料含铁量高，烧成后色泽浓艳，局部有黑色结晶斑，被称为'铁锈斑'。民间相信，铁锈斑是青花瓷器有了'灵性'的标志，能镇宅辟邪。又传景德镇珠山之下有青龙盘踞，龙息化为青料，故景德镇青花独步天下。", founders: "青花瓷虽始于唐宋，但元代才臻成熟。明代永乐、宣德年间达到巅峰，清代康熙时期再创辉煌。近现代代表人物有：'青花大王'王步（1898-1968），独创'分水写意'技法，一笔下去，浓淡干湿浑然天成，被誉为'分水绝技'；青花泰斗秦锡麟，将民间剪纸、刺绣纹样融入青花装饰，开创了'现代民间青花'新风格；国家级非遗传承人黄云鹏，毕生致力于元明清官窑青花瓷的复制研究，其复制品几可乱真。", craftDetail: "青花瓷制作是土与火的艺术，工序繁复，环环相扣：\n一、采泥：景德镇制瓷原料取自周边高岭村的高岭土和瑶里的瓷石。高岭土洁白细腻，可塑性强；瓷石坚硬耐火，二者按'二元配方'配比，奠定了景德镇瓷器'白如玉、薄如纸'的基础。\n二、练泥：将矿石捣碎，淘洗去杂，沉淀成细腻的泥块。再以人工反复踩踏或用牛力碾轧，排出气泡，使泥质均匀致密。现代采用真空练泥机，效率更高。\n三、拉坯：将泥团置于转动的陶轮中心，双手沾水，随轮旋转向上提拉，凭手感控制器壁厚薄。拉坯师傅'闭着眼都能拉出标准碗'，靠的是数十年手感积累。一件坯体从底部到口沿，厚薄误差不超过一毫米。\n四、修坯：坯体半干时置于陶轮上，以竹刀、铁刀修整外形，削去多余的泥料，使器物线条流畅。修坯讲究'一刀准'，多一刀则薄，少一刀则厚。\n五、绘青：这是青花瓷的灵魂。画师以毛笔蘸取氧化钴料，在干燥的坯体上直接作画。青料有'头浓、正浓、二浓、正淡、影淡'五色之分，通过控制含水量的多少，一笔画出浓淡层次。绘制顺序为'先画主题纹饰，再画辅助纹样，最后勾勒边线'。精品青花瓷需由'画头'（主画师）亲自操刀，学徒只能负责填色。\n六、施釉：绘制完成后，以浸釉、浇釉或吹釉法覆盖透明釉层。釉料以石英、长石、石灰石配制，高温下熔融成玻璃质层，保护青花纹饰并赋予瓷器温润光泽。釉层厚度以1-2毫米为佳，过厚则青花发色模糊，过薄则露胎。\n七、装窑：将施釉后的坯体放入耐火匣钵中，层层码放于窑膛内。装窑是技术活，需考虑火焰流向，使窑内温差最小化。一窑可装数百件，大小搭配，错落有致。\n八、烧制：以松柴为燃料，在龙窑或马蹄窑中烧制。点火后缓慢升温，至1280-1320摄氏度的高温还原阶段，窑内缺氧，一氧化碳将釉中的铁元素还原，青料呈现出幽靓的蓝色。烧制过程约20-30小时，期间窑工需寸步不离，凭肉眼观察窑火颜色判断温度——火红为800度，橙黄为1000度，白炽为1300度。\n九、开窑：熄火后自然冷却数日，方可开窑。出窑时满窑青花蓝光莹莹，如冰似玉。成品经严格筛选，有气泡、裂纹、变形者当场砸碎，深埋地下，以防流入民间。" },
  { name: "苏绣", category: "传统美术", img: "assets/heritage-suxiu.jpg", desc: "针尖上的中国画。苏绣是苏州地区刺绣产品的总称，以精细素雅著称，图案秀丽、构思巧妙、绣工细致、针法活泼。", craft: "平绣、乱针绣、双面绣", inherit: "劈丝技术、针法体系、色彩调配", legends: "三国时期，孙权欲为刘备联姻，命赵夫人刺绣山川地形图。赵夫人以发丝细线，在方帛上绣出五岳河海、城郭行阵，孙权持之运筹帷幄，叹曰'针绝'。此虽为传说，却可见苏绣之精细自古闻名。至明清，苏州'绣市'繁华，'家家养蚕，户户刺绣'，绣娘人数逾万。", myths: "太湖之滨有'绣娘岛'传说。相传古时太湖泛滥，百姓流离。一位名叫苏娘的渔家女，以银针彩线绣出蛟龙纹样，投入湖中，蛟龙感其诚，平息风浪。苏娘遂将绣艺传授乡邻，世代相传，是为苏绣之始。又传绣娘飞针走线时，若有月光照入绷架，丝线会泛起淡淡银光，那是月宫嫦娥洒下的桂花露，能使绣品永不褪色。", founders: "苏绣历史悠久，但近代最杰出的代表人物是沈寿（1874-1921）。她创'仿真绣'，以西洋油画光影原理入绣，作品《意大利皇后爱丽娜像》在意大利都朗博览会上获金奖，被清廷赠予'世界至大荣誉最高级卓越奖'。当代传承人姚建萍，被誉为'苏绣皇后'，其双面绣《英国女王》被白金汉宫收藏；乱针绣创始人杨守玉，将西画笔触融入刺绣，开创了全新的艺术语言。", craftDetail: "苏绣以'精、细、雅、洁'著称，制作工艺堪称针尖上的芭蕾：\n一、选料：底料以真丝缎、绢、纱为主，质地轻薄柔软，利于表现细腻层次。绣线采用优质桑蚕丝，一根丝线可劈成二分之一、四分之一、八分之一、十六分之一，最细可达'一丝'，比头发还细数倍。\n二、上绷：将底料绷紧于木制绣绷上，以绳线缠绕调节张力，使布面平整如鼓皮。上绷讲究'四角均匀、中心紧绷'，稍有松弛，绣出的图案便会走形。\n三、配线：根据画稿色彩，从数百种色号的丝线中挑选搭配。苏绣用色讲究'晕色'——同一色系由深到浅过渡自然，如花瓣从根部到尖端，颜色渐次变化，毫无生硬之感。\n四、劈丝：将一根丝线用手指甲或牙齿劈开。劈丝是苏绣独门绝技，线劈得越细，绣面越光滑细腻。绣猫毛、人物发丝时，需用'一丝'甚至'半丝'，在放大镜下操作。\n五、刺绣：针法多达四十余种。齐针——线条排列整齐，用于绣平面；套针——分批衔接，用于表现渐变；滚针——针针相咬，用于绣曲线轮廓；打籽针——每针形成一个小结，用于绣花蕊、眼珠；乱针绣——以交叉重叠的短线表现光影，类似油画笔触。绣制时右手持针，左手托底，针从布面穿出，线从针孔穿过，一上一下，周而复始。一幅中等大小的双面绣，需耗时数月乃至一年。\n六、双面绣：这是苏绣最高技艺。在同一块底料上，正反两面绣出完全相同的图案，针脚藏在线缕之间，两面都看不到线头。绣双面绣时，艺人需凭记忆和手感，在黑暗中摸索运针，因为正面绣一针，反面就要对应一针，稍有差池便前功尽弃。\n七、收尾：绣完后以温水轻洗去指印污渍，阴干后托裱于宣纸或绫绢之上，装框陈列。精品苏绣需避光、防潮、防虫，定期以软毛刷轻扫除尘。" },
  { name: "竹编", category: "传统技艺", img: "assets/heritage-zhubian.jpg", desc: "经纬交织，化竹为器。竹编是将竹子剖劈成丝或片，通过挑压交织编成各种器物，兼具实用与观赏价值。", craft: "剖丝、编织、收口、装饰", inherit: "编织纹样、造型结构、防蛀处理", legends: "相传大禹治水时，以竹片编筐装石，堵塞洪水。竹筐坚固耐用，可载千斤之石，百姓纷纷效仿，竹编由此流传。至春秋战国，越国大夫范蠡弃官从商，以竹编器具贩运货物，成为巨富。他总结竹编经验，编写了《陶朱公竹谱》，虽已失传，但竹编技艺却在江南一带生根发芽。", myths: "竹编匠人相信，每根竹子都有'竹神'守护。砍伐竹子前，需以米酒祭山，祈求竹神宽恕。又传农历八月十五中秋夜，以新竹编制的器具会吸收月华，使用者百病不侵。浙江安吉更有'竹篮打水一场空'的反讽——当地竹编大师能以竹丝编出密不透水的竹篮，盛水不漏，堪称绝技。", founders: "竹编无确切创始人，但各地皆有宗师。浙江东阳竹编大师何福礼，被誉为'竹编泰斗'，其作品《香炉阁》以0.3毫米的竹丝编成，获中国工艺美术百花奖金奖；四川成都瓷胎竹编传承人谭代明，以竹丝紧扣瓷胎编织，'以竹包瓷、以瓷衬竹'，作品薄如绸绢；湖南益阳小郁竹器传承人刘宗凡，独创'郁'法——以火烤弯竹材，不用一钉一胶，全靠榫接绑扎，造型古朴典雅。", craftDetail: "竹编制作工艺流程如下：\n一、选竹：以三年生毛竹为佳，竹龄过嫩则纤维软，过老则脆硬。采伐季节以立冬后至立春前最佳，此时竹内含糖量低，不易虫蛀。选竹讲究'看节、听声、掂重'——节距均匀、敲击清脆、手感沉实者为上品。\n二、处理：将竹子截成所需长度，劈成竹片，再刮去青皮（竹青硬而韧，多用于骨架；竹黄软而柔，多用于编织）。竹片需浸泡于清水中数日，去除糖分和淀粉，然后煮沸或熏蒸，进一步防蛀防霉。\n三、剖丝：将竹片剖成细丝，是竹编最见功夫的环节。老艺人以特制的剖篾刀，将竹片一层层剖开，最细可达0.2毫米，薄如纸片、韧如发丝。剖丝时刀刃与竹纤维走向必须平行，稍有偏斜便会断裂。\n四、编织：基本编织法有'挑一压一''挑二压二''挑三压一'等，变化出回纹、菱形纹、六角纹、人字纹等数十种图案。编织时以经线（纵向）为骨架，纬线（横向）穿梭其间，一挑一压，经纬交错。复杂器物如竹篮，需先以较粗的竹片扎成骨架，再以细竹丝在骨架上编织器壁。\n五、收口：器身编好后，需将口沿收束整齐。收口方法有'绞口''缠口''锁口'等，以细竹丝或藤皮缠绕口沿，既加固又美观。精品竹篮的收口圆润光滑，摸不到一丝毛刺。\n六、装饰：在器物表面施以烫画、彩绘、镂空等装饰。烫画以烧红的铁笔在竹面烙出山水花鸟，色泽古朴；彩绘以矿物颜料描绘图案，色彩鲜艳；镂空则以刻刀在编织好的器壁上雕出花纹，透光透气，雅致非常。\n七、保养：竹编器物忌暴晒、忌水泡。使用前以淡盐水擦拭，可增强韧性；长期不用时，以樟脑丸防虫，置于通风干燥处。年代久远的竹编器物，色泽会由青转黄、由黄转褐，包浆温润，更具古韵。" },
  { name: "泥塑", category: "传统美术", img: "assets/heritage-nisu.jpg", desc: "抟土为形，赋泥以神。泥塑以泥土为原料，手工捏制成形，或素或彩，以人物、动物为主，质朴生动。", craft: "和泥、捏塑、阴干、彩绘", inherit: "造型能力、彩绘技法、地方风格", legends: "女娲抟黄土造人，是中国最古老的泥塑传说。相传女娲以黄河之泥，捏出一个个小人，吹口气便活了，是为人类始祖。后世的泥塑艺人，皆奉女娲为祖师，认为手中的泥团蕴含着造物的神力。汉代墓葬中出土的陶俑，便是这一古老信仰的物质遗存。", myths: "泥塑界流传'泥人张'的神奇故事。清末天津艺人张明山，技艺高超，能以泥塑捕捉人物神韵。相传他在酒楼饮酒，邻桌坐着一位相貌奇特的客人，张明山暗中以袖中藏泥，瞬息捏成其人头像，形神毕肖。客人惊为天人，从此'泥人张'名震津门。又传泥塑作品若经'开光'点睛，便有灵性，可保佑家宅平安。", founders: "天津'泥人张'是泥塑界最负盛名的世家。创始人张明山（1826-1906），以'触手成像'的绝技闻名，其作品《蒋门神》形神兼备，被誉为'活蒋门神'。第四代传人张锠，将泥塑与现代艺术结合，作品被国内外多家博物馆收藏。此外，陕西凤翔泥塑代表人物胡深，以挂虎、坐虎闻名，色彩浓烈，造型夸张；河南浚县'泥咕咕'传承人宋学海，以泥塑小鸟著称，吹之有声，童趣盎然。", craftDetail: "泥塑制作工艺看似简单，实则博大精深：\n一、选土：以含沙量适中、黏性较强的'胶泥'为佳。天津泥人张采用运河边的深层胶泥，细腻柔韧；凤翔泥塑则取当地特有的'黑油土'，色泽沉稳。取土后需晾晒、捣碎、过筛，去除杂质。\n二、和泥：将干土加水调和，反复揉摔，使泥质均匀。和泥讲究'三光'——手光、盆光、泥光，即手上不沾泥、盆壁光滑、泥团细腻无气泡。和好的泥需用湿布覆盖'醒泥'数日，使水分渗透均匀。\n三、搭骨架：大型泥塑需以竹篾、铁丝或木条扎成骨架，再用稻草或棉絮缠绕，形成大致轮廓。骨架要稳固，能承受泥层的重量，又要留有伸缩余地，防止干燥开裂。\n四、粗塑：以大块泥团堆塑出基本形态，称为'搭大形'。这一步不求精细，只求比例协调、动态准确。粗塑完成后需阴干至半干状态，再进行细塑。\n五、细塑：以小型塑刀、竹签等工具，精雕细刻人物的五官、衣纹、发饰、道具。细塑是最考验艺人功力的环节，一刀下去，或锦上添花，或前功尽弃。泥人张的绝活在于'塑其形、绘其神'——不仅外形逼真，更要表现出人物的内心世界。\n六、阴干：塑好的泥坯需置于阴凉处自然干燥，切忌暴晒或烘烤，否则会产生裂纹。干燥过程可能持续数周甚至数月，期间需定期翻面，使各面均匀收缩。\n七、打磨：干透后以细砂纸轻磨表面，去除毛刺和凹凸不平之处。\n八、打底：以白粉或石膏粉调水，涂刷于泥坯表面，形成均匀的白色基底，便于后续彩绘。\n九、彩绘：传统以矿物颜料和植物染料为主，朱砂为红、石青为蓝、石绿为绿、赭石为褐。彩绘顺序为'先上底色，再画衣纹，最后点睛'。民间泥塑讲究'三分塑、七分彩'，色彩浓烈鲜艳，对比强烈，具有浓郁的乡土气息。文人泥塑则追求淡雅含蓄，以水墨意蕴入彩。\n十、上光：彩绘完成后，以清漆或桐油涂刷表面，保护色彩并增加光泽。上光后的泥塑可防水防潮，历久弥新。" },
  { name: "制茶", category: "传统技艺", img: "assets/heritage-tea.jpg", desc: "一叶一芽总关情。中国传统制茶技艺包括杀青、揉捻、发酵、干燥等工序，不同茶类工艺各异，色香味形各具特色。", craft: "采摘、杀青、揉捻、干燥", inherit: "火候掌控、手法技艺、品质判断", legends: "神农尝百草，日遇七十二毒，得茶而解之。这是中国关于茶最古老的传说。相传神农氏以赭鞭鞭草木，辨别其药性。一日误食毒草，腹痛难忍，随手摘下身边灌木的嫩叶嚼食，顿觉神清气爽，毒解痛消。这种神奇的叶子，便是茶叶。此后神农将茶树推荐给百姓，教以采摘饮用之法，茶由此走入人间。", myths: "武夷山有大红袍的传说。相传明代一位举人进京赶考，途经武夷山时病倒，天心寺老方丈以寺前茶树所制之茶为其治病，举人大愈，后高中状元。为谢救命之恩，状元以红袍披于茶树之上，从此该树所产之茶被称为'大红袍'。又传此茶树有灵，每年采茶前需焚香祭拜，否则茶叶便会失去神韵。", founders: "茶圣陆羽（733-804）著《茶经》，是中国茶学的奠基人。他遍历天下茶山，总结制茶、饮茶之道，被后世尊为'茶圣'。清代制茶大师王草堂，创制'工夫红茶'，其工艺精细繁复，需经萎凋、揉捻、发酵、干燥等十余道工序。当代乌龙茶大师张天福，毕生致力于乌龙茶制作工艺的传承与创新，被誉为'乌龙茶泰斗'；普洱茶制作技艺传承人李兴昌，继承家族百年制茶秘方，其制作的普洱贡茶被列为国家级非遗。", craftDetail: "中国传统制茶技艺因茶类不同而各异，以下为最具代表性的绿茶和乌龙茶制作工艺：\n【绿茶制作工艺】\n一、采摘：以清明前后的'明前茶'最为珍贵，此时茶树越冬后萌发的嫩芽，内含物质丰富，滋味鲜爽。采摘标准为一芽一叶或一芽二叶，要求芽叶完整、匀整、新鲜。\n二、萎凋：将鲜叶薄摊于竹匾上，置于阴凉通风处，使叶片失水变软，便于后续揉捻。萎凋时间视天气而定，约2-6小时。\n三、杀青：以高温破坏鲜叶中酶的活性，制止多酚类物质氧化，保持茶叶绿色。杀青方法有炒青（锅炒）、蒸青（蒸汽）、烘青（热风）等。手工炒青最为传统，将鲜叶投入200-300摄氏度的铁锅中，以双手快速翻炒，动作如'抓、抖、搭、拓'。杀青讲究'嫩叶老杀、老叶嫩杀'——嫩叶水分多，需高温多炒；老叶水分少，需低温少炒。\n四、揉捻：将杀青后的茶叶置于竹筛或布袋中，以双手或揉捻机搓揉成条索状。揉捻使茶叶细胞破碎，茶汁溢出，便于冲泡时内含物质溶出。揉捻力度要适中，过重则茶汁流失过多，过轻则条索松散。\n五、干燥：以炒干、烘干或晒干法去除茶叶中多余水分，使含水量降至6%以下，便于储存。干燥后的绿茶色泽翠绿，香气清高，汤色碧绿，滋味鲜爽。\n【乌龙茶制作工艺】\n一、晒青：将鲜叶薄摊于竹席上，在阳光下晾晒，使叶片失水10-15%，叶质变软，青草气散发。\n二、晾青：将晒青叶移入室内，摊放于凉青架上，继续缓慢失水，促进内含物质转化。\n三、摇青：将茶叶放入竹制摇笼中，来回摇动，使叶片相互碰撞摩擦，叶缘细胞破损，发生轻度氧化，形成'绿叶红镶边'的特征。摇青是乌龙茶制作的关键，需反复进行多次，每次摇青后都要晾青，使氧化程度逐步加深。\n四、杀青：与绿茶类似，以高温终止酶的活性，固定已形成的花果香气。\n五、揉捻：将杀青叶趁热揉捻，使条索紧结，茶汁溢出。\n六、烘焙：以炭火或电烘箱低温慢烘，去除水分，发展香气。烘焙讲究'文火慢炖'，温度过高则香气散失，温度过低则水分难除。高级乌龙茶需反复烘焙多次，每次间隔数日，使茶叶'吃火'透彻，香气沉稳持久。" },
  { name: "花灯", category: "传统美术", img: "assets/heritage-lantern.jpg", desc: "灯火阑珊处，人间烟火时。花灯是汉民族数千年来重要的娱乐文化，融绘画、剪纸、纸扎、刺缝等工艺于一体。", craft: "扎架、糊纸、绘画、装灯", inherit: "骨架结构、图案设计、光电结合", legends: "相传东汉明帝刘庄夜梦金人，遣使西域求佛法。使者带回佛经和佛像，明帝遂下令在正月十五夜燃灯表佛，以示虔诚。此后正月十五张灯结彩逐渐成为民俗，至隋唐达到鼎盛。唐玄宗时，长安城内'灯树千光照，花焰七枝开'，花灯之盛，空前绝后。", myths: "花灯界流传'灯神'传说。相传每盏花灯制作完成时，灯神便会附身其中。若制灯人心怀善念，灯神会保佑家宅平安、子孙兴旺；若心怀邪念，灯神便会离去，花灯也便失去了灵性。又传元宵夜放天灯（孔明灯），可将心愿送达天庭，天官赐福，心想事成。四川自贡更有'龙灯镇水'的传说，以竹扎巨龙花灯游行，可镇压水患，保佑一方平安。", founders: "花灯无单一创始人，但各地皆有代表性传承人。四川自贡花灯大师刘德林，被誉为'灯王'，其作品《恐龙灯组》高达三十余米，创吉尼斯世界纪录；广东佛山彩灯传承人杨玉榕，以'针扎灯'闻名，以针刺孔透光，图案精细入微；浙江海宁硖石灯彩传承人陈伟炎，独创'刻纸灯'，以刻刀在纸上雕出万千孔洞，灯光透射，如梦似幻。", craftDetail: "花灯制作工艺融多种技艺于一体，流程如下：\n一、设计：根据用途和主题，绘制花灯效果图。传统花灯题材多为龙凤呈祥、花开富贵、戏曲人物、神话故事等。设计需考虑结构稳定性、视觉美感和灯光效果。\n二、扎架：以竹篾、铁丝或钢丝弯扎成骨架。竹篾柔韧易弯，适合制作曲线造型；铁丝坚固耐用，适合大型灯组。扎架讲究'横平竖直、结构稳固'，骨架是花灯的'骨骼'，决定了花灯的整体形态。大型灯组还需焊接钢结构支架，确保安全。\n三、糊裱：将彩纸、绸布、纱绢或玻璃纸裱糊于骨架之上。糊裱要求平整无皱、接缝隐蔽。传统以浆糊为粘合剂，现代多用白乳胶。不同材质效果各异——纸张质朴、绸布华丽、纱绢朦胧、玻璃纸晶莹剔透。\n四、彩绘：在裱好的灯面上绘制图案。彩绘以矿物颜料或丙烯颜料为主，色彩鲜艳持久。绘制顺序为'先勾线、后填色、再点睛'。传统花灯多用红、黄、绿、金等喜庆色彩，图案以吉祥纹样为主。现代花灯则融入现代绘画技法，风格多样。\n五、装灯：将光源安装于花灯内部。传统以蜡烛或油灯为光源，需设计通风口防止灯内过热。现代多采用LED灯带或灯泡，安全节能，色彩可变。装灯要考虑光线分布均匀，避免明暗不均或产生阴影。\n六、装饰：在花灯表面粘贴流苏、穗子、亮片等装饰物，增加层次感和动感。大型灯组还需安装传动装置，使花灯局部旋转或摆动，栩栩如生。\n七、组装：将各部分组合成完整的花灯。组装时要检查电路安全、结构稳固，确保运输和展示过程中不会损坏。\n八、展示：花灯多在夜间展示，悬挂于街道、广场或园林之中。灯光亮起时，满街流光溢彩，如梦如幻。自贡国际恐龙灯会更以巨型灯组和声光电技术闻名于世，每年吸引数百万游客。" },
  { name: "打铁花", category: "民俗", img: "assets/heritage-datiehua.jpg", desc: "火树银花不夜天。打铁花是流传于豫晋地区的民间传统烟火，将熔化的铁水击向天空，迸溅形成万朵火花。", craft: "熔铁、击打、配合、安全", inherit: "铁水温度控制、击打技巧、团队配合", legends: "打铁花起源于春秋战国时期，最初是冶铁工匠的祭祀活动。相传老子在函谷关炼丹时，以铁水击打岩壁，迸溅的火花照亮夜空，百姓观之以为神迹，遂将此法流传于民间。至北宋，打铁花已成为元宵节的重要庆典活动，汴京（今开封）城内'铁花飞溅，满城如昼'，盛况空前。", myths: "打铁花艺人相信，铁花是'火神'的化身。每年正月初五'接财神'时表演打铁花，可将火神请入家中，保佑一年红红火火、财运亨通。又传铁花飞溅的高度越高，来年的收成越好。因此艺人个个使出浑身解数，力求将铁花打得又高又散，满天星斗般璀璨。民间还有'铁花落地，百病消除'的说法，认为被铁花火星溅到的人，来年不会生病。", founders: "打铁花无确切创始人，但河南确山打铁花最具代表性。确山打铁花传承人杨建军，被誉为'中原铁花第一人'，他恢复了失传多年的'龙穿花''泼花'等绝技，将打铁花从民间祭祀活动提升为舞台艺术。山西晋城打铁花传承人王永顺，独创'双人互击'技法，两人对打，铁花在空中碰撞，形成更壮观的爆炸效果。河北蔚县'打树花'传承人王德，以熔化的铁水泼洒于古城墙上，铁花沿墙流淌，如瀑布飞泻，蔚为壮观。", craftDetail: "打铁花是一项极具危险性的民间技艺，制作工艺和表演流程如下：\n一、熔铁：表演前数小时，在空旷场地中央搭建熔炉，以焦炭为燃料，将生铁或废铁熔化成铁水。铁水温度需达到1600-1700摄氏度，呈炽白状态。判断温度是否达标，全凭艺人肉眼观察铁水颜色——暗红为800度，橙红为1000度，金黄为1300度，炽白为1600度以上。\n二、准备工具：主要工具有铁勺（舀铁水）、铁棒（击打铁水）、柳木棒（防护）。铁勺以厚铁板制成，容量约500克；铁棒长1.5米左右，一端扁平用于击打；柳木棒泡过水，耐烧不裂，用于防护和辅助。\n三、防护：艺人需穿戴防火服、防火手套、护目镜。头发以湿毛巾包裹，身上浇湿以防火星灼伤。场地周围需清理可燃物，设置安全警戒线，配备灭火器材。\n四、表演：表演时，一名艺人（称为'掌勺者'）以铁勺舀起铁水，抛向空中；另一名艺人（称为'击花者'）以铁棒猛力击打空中的铁水。铁水受击后四散飞溅，遇冷空气瞬间凝结成万千火星，如天女散花，璀璨夺目。\n五、技法：基本技法有'泼花'——将铁水泼向墙壁或大树，铁花沿壁流淌；'击花'——以铁棒击打空中铁水，形成放射状火花；'甩花'——将铁水甩向空中，形成弧线状火花；'天女散花'——多人同时击打，铁花漫天飞舞，最为壮观。高级技法如'龙穿花'，以两条火龙花灯穿梭于铁花之间，龙口喷火，铁花飞溅，惊险绝美。\n六、配合：打铁花需多人密切配合。掌勺者抛出的铁水高度、角度、速度，击花者都要准确预判，稍有差池，铁水便会落在人身上，造成严重烫伤。因此打铁花团队需长期磨合，默契无间。\n七、收尾：表演结束后，熔炉需以沙土覆盖熄灭，铁水残渣冷却后清理。艺人检查有无灼伤，及时处理伤口。" },
  { name: "榫卯", category: "传统技艺", img: "assets/heritage-sunmao.jpg", desc: "凹凸相合，天衣无缝。榫卯是古代中国建筑、家具及其它器械的主要结构方式，不用一钉一胶，凹凸部位相结合。", craft: "锯、刨、凿、组装", inherit: "精度计算、力学结构、木材特性", legends: "相传鲁班发明榫卯，源于一次偶然。他见孩童以手指相扣玩耍，凹凸相扣，牢固无比，遂悟出以木之凹凸相嵌合的道理。鲁班以榫卯造木鸢，飞三日不落；造木牛流马，行千里不疲。虽为传说，却可见榫卯技艺之精妙自古便为人称道。", myths: "木匠行尊奉鲁班为祖师，相传每座木建筑中都藏有'镇宅榫'——一根特殊的榫卯结构，连接着整座建筑的龙脉。若镇宅榫松动，家宅便会不安。因此古代建房上梁时，要举行隆重的'祭梁'仪式，祈求鲁班保佑榫卯牢固、家宅平安。又传好的榫卯家具使用越久越牢固，因为木材在岁月中缓慢变形，榫头与卯眼越咬越紧，可传百年而不散。", founders: "榫卯技艺无单一创始人，但明清时期达到巅峰。明代家具大师伍炳亮，以'京作'榫卯闻名，其设计的圈椅以楔钉榫连接扶手，曲线优美，结构稳固；清代'样式雷'家族，世代为皇家建筑设计榫卯结构，圆明园、颐和园等皇家建筑皆出其手。当代榫卯传承人王震华，以全榫卯结构复制故宫角楼模型，不用一钉一胶，十万多个构件精准咬合，被誉为'当代鲁班'。", craftDetail: "榫卯制作工艺是中国传统木作的核心，流程如下：\n一、识木：不同木材的硬度、纹理、收缩率各异，需根据用途选择。硬木如紫檀、黄花梨，质地坚硬，适合制作精细榫卯；软木如松木、杉木，易加工，适合大型建筑。选木要'看纹理、听声音、测湿度'——纹理直顺、敲击清脆、含水率12%左右者为佳。\n二、画线：根据设计图纸，在木料上精确画出榫头和卯眼的位置、尺寸。画线讲究'留线''吃线'——榫头要比理论尺寸稍大一丝（吃线），卯眼要比理论尺寸稍小一丝（留线），这样组装后才会紧密无间。\n三、开榫：以锯子沿画线锯出榫头。榫头有多种形态：直角榫——方头直入，最为常见；燕尾榫——头部宽、根部窄，如燕尾状，抗拉力强，多用于抽屉；粽角榫——三向交汇，用于桌椅腿与面的连接；楔钉榫——以楔形木片楔入，越敲越紧，用于圈椅扶手。开榫要求'锯路直、端面平、尺寸准'。\n四、凿卯：以凿子和锤子在木料上凿出卯眼。凿卯要'先凿中间、后凿四周、再修边角'，防止木料劈裂。卯眼的深度要比榫头长度深2-3毫米，留出'泄力槽'，防止木材受潮膨胀时撑裂。\n五、试装：将榫头插入卯眼，检查松紧度。过松则需'垫片'补救，过紧则需'修榫'调整。理想的榫卯应'敲入顺畅、拔出费力'，以木槌轻敲即可入位，徒手无法拔出。\n六、组装：按顺序将各部件组装成型。组装时要对角线同时施力，防止框架变形。大型建筑还需以'走马销''穿带'等辅助结构加固。\n七、修整：组装后以刨子、凿子修整表面，使接缝平整无痕。精品榫卯家具的接缝处，肉眼几乎看不到缝隙，手摸如丝般顺滑。\n八、保养：榫卯家具忌暴晒、忌干燥。定期以蜂蜡或木油擦拭，保持木材润泽。若发现榫卯松动，可拆解后以木楔加固，切忌用钉子破坏结构。年代久远的榫卯家具，木材色泽深沉，包浆温润，价值倍增。" },
  { name: "京剧", category: "传统戏剧", img: "assets/heritage-jianzhi.jpg", desc: "皮黄声腔，国粹精华。京剧融合徽剧、汉剧之长，以唱念做打为表演手段，脸谱斑斓，程式严谨，是中国最具影响力的戏曲剧种。", craft: "唱、念、做、打", inherit: "声腔体系、身段程式、脸谱艺术", legends: "清乾隆五十五年（1790年），四大徽班进京为乾隆帝祝寿，此后徽班扎根北京，与汉调、昆曲、秦腔融合，逐渐形成京剧。相传乾隆皇帝观徽班演出后龙颜大悦，赐名'皮黄调'，命其在京城常驻。此后两百年间，京剧从宫廷走向民间，成为'国剧'。", myths: "京剧界尊唐明皇为祖师。相传唐明皇李隆基精通音律，在宫中设梨园，亲自教授伶人歌舞。一日他梦游月宫，见仙女翩翩起舞，醒后依记忆编排成戏，是为戏曲之始。又传京剧脸谱各有灵性——红脸关公忠义护主，挂于戏班后台可镇邪；白脸曹操奸诈多疑，演员勾脸后需静心默祷，以免'入戏太深'。", founders: "京剧形成于清代，但近代最杰出的代表人物是'四大名旦'——梅兰芳、程砚秋、尚小云、荀慧生。梅兰芳（1894-1961）创立'梅派'，以雍容华贵、端庄大方的表演风格著称，其《贵妃醉酒》《霸王别姬》享誉世界；程砚秋创立'程派'，唱腔幽咽婉转，如泣如诉。此外，老生行当的代表人物谭鑫培、余叔岩、马连良，武生代表人物杨小楼，皆为京剧史上不可逾越的高峰。", craftDetail: "京剧是一门综合性极强的舞台艺术，其制作工艺和表演体系博大精深：\n一、剧本创作：京剧剧本称为'本子'，以皮黄腔为主要声腔，分为西皮和二黄两大类。剧本结构严谨，分为'起承转合'，唱词讲究平仄押韵，念白分韵白（有韵律的官话）和京白（北京方言）。\n二、音乐伴奏：京剧乐队称为'场面'，分文场和武场。文场以京胡为主奏乐器，辅以京二胡、月琴、三弦；武场以板鼓、大锣、铙钹为主，控制节奏、渲染气氛。\n三、脸谱绘制：京剧脸谱以色彩和图案象征人物性格。红色代表忠义（如关公），黑色代表刚直（如包拯），白色代表奸诈（如曹操），蓝色代表勇猛（如窦尔敦）。绘制脸谱需以油彩在面部勾画，线条流畅、对称工整，一个复杂脸谱需耗时半小时以上。\n四、服装制作：京剧服装称为'行头'，以明代服饰为基础，加以艺术夸张。蟒袍为帝王将相所穿，绣龙纹；靠为武将铠甲，背后插四面三角旗；褶子为文人便服，素雅大方。行头以丝绸为料，手工刺绣，一件蟒袍价值数万元。\n五、表演程式：京剧表演讲究'唱念做打'四功和'手眼身法步'五法。唱——以声腔表达情感；念——以念白推进剧情；做——以身段动作刻画人物；打——以武打场面展现战斗。每个动作都有固定程式，如'起霸'（武将出征前的整装）、'走边'（夜间潜行）、'圆场'（快速行走）。\n六、化妆：除脸谱外，旦角需'贴片子'（以假发片修饰脸型）、'梳头'（梳古装发髻）、'戴头面'（佩戴珠翠首饰）。生角则需'吊眉'（以细带将眉毛和眼角吊起，显得精神）、'勒头'（以布带束紧头部，减轻头晕）。\n七、舞台调度：京剧舞台以'一桌二椅'为基本布景，通过演员的虚拟动作表现环境变化。如以鞭代马、以桨代船、以圆场表现长途跋涉。这种'写意'美学，是中国戏曲的独特魅力。" },
  { name: "皮影雕刻", category: "传统美术", img: "assets/heritage-piying.jpg", desc: "刀锋上的光影艺术。皮影雕刻以刀代笔，在薄如蝉翼的皮革上镂刻出万千世界，是光与影的绝美交响。", craft: "选皮、制皮、画稿、镂刻、敷彩", inherit: "刀法技艺、造型规律、色彩运用", legends: "相传宋代汴京有一位名叫李十三的皮影艺人，其雕刻的影人栩栩如生。一日他为皇帝表演《西游记》，孙悟空的影人竟从幕布上跳了下来，在殿中翻筋斗、耍金箍棒，满朝文武惊为神迹。皇帝欲封其为官，李十三婉拒，只求赐牛皮百张，以传技艺于后世。", myths: "皮影艺人相信，每幅皮影画稿都需经'开光'仪式，以朱砂点染影人双眼，方能赋予其灵性。未经开光的皮影，上台表演时便会'失灵'——操纵不灵、唱腔嘶哑。又传皮影幕布（亮子）有辟邪之效，旧时农村若有婴孩夜啼，以皮影亮子覆于床顶，邪祟不敢近身。", founders: "皮影雕刻界最负盛名的是陕西华县流派。代表人物薛宏权，被誉为'皮影雕刻第一人'，其作品《闹社火》以数千个镂空人物组成，耗时三年完成；河北唐山皮影雕刻大师齐永衡，独创'拉刀刻法'，以特制的拉刀在皮面上推拉雕刻，线条细如发丝；浙江海宁皮影传承人徐二男，继承南宋'羊皮影'古法，以羊皮为材，雕刻的影人薄如蝉翼，透光后如水晶般晶莹剔透。", craftDetail: "皮影雕刻是'皮上的工笔重彩'，制作工艺如下：\n一、选皮：以三岁左右的秦川黄牛皮为上品，皮薄而韧，纤维细腻。选皮要'看皮面、摸手感、闻气味'——皮面无疤痕、手感柔韧、无腥臭者为佳。驴皮、羊皮也可使用，但质地略逊。\n二、制皮：将生皮浸泡于石灰水中数日，去毛去肉，刮净油脂。再以木框绷平，文火烘干。制好的皮平整如镜，厚度约0.5毫米，透光性极佳。\n三、画稿：将传统人物图谱（样谱）覆于皮面，以钢针沿轮廓扎出细密针孔，形成'过稿'。人物造型遵循'五分脸、侧身眼、通天鼻、眉连鬓'的程式，生旦净丑各有脸谱。画稿是雕刻的基础，要求线条流畅、比例准确。\n四、镂刻：使用斜口刻刀、平口刀、圆口刀等十余种刀具，沿针孔线路雕刻。刀法有'雪花刀'（用于表现雪花纹样）、'鱼鳞刀'（用于表现鱼鳞或铠甲）、'月牙刀'（用于表现衣纹褶皱）、'圆针刀'（用于表现圆点装饰）。雕刻顺序为'先刻头帽，次刻五官，再刻衣纹，最后刻手足'。一件复杂影人往往要刻上万刀，耗时数日。\n五、敷彩：传统以矿物颜料和植物染料上色——朱砂为红、石青为蓝、藤黄为黄、赭石为褐。上色时以毛笔蘸色，由浅入深，层层渲染。同一张皮影，正反两面都要上色，确保透光后色彩一致。\n六、发汗熨平：上好色的皮影需用湿布包裹，置于热铁板上'发汗'，使颜料渗入皮纤维，再经熨斗压平，色泽方能经久不褪。\n七、缀结：将头、身、四肢分刻后，以丝线连接，并在关节处安装竹签或铁丝操纵杆。文官两根杆（双手），武将三根杆（双手加腰），神仙可多至五根杆，腾云驾雾，变化万千。" },
  { name: "景泰蓝", category: "传统技艺", img: "assets/heritage-ceramics.jpg", desc: "铜胎掐丝，珐琅溢彩。景泰蓝以紫铜为胎，以金丝掐丝为纹，填以珐琅釉料，经烧制、磨光、镀金而成，金碧辉煌，华贵典雅。", craft: "制胎、掐丝、点蓝、烧蓝、磨光、镀金", inherit: "掐丝技法、釉料配制、烧制火候", legends: "景泰蓝因明代景泰年间（1450-1456）达到巅峰而得名。相传景泰帝酷爱珐琅器物，命宫廷作坊大量制作，并以蓝色釉料为主色调，故得名'景泰蓝'。又传景泰帝曾以景泰蓝器物赏赐外国使节，使节惊为神物，归国后纷纷仿制，景泰蓝由此名扬海外。", myths: "景泰蓝艺人相信，每件景泰蓝器物中都住着一位'珐琅神'。烧制时若火候得当，珐琅神便会显灵，使釉色晶莹剔透；若火候失常，珐琅神便会离去，器物便会失色开裂。又传景泰蓝有镇宅之效，因其以铜为胎、以金为饰，五行中金气旺盛，可辟邪化煞。旧时皇宫中以景泰蓝器物陈设于殿堂，既显皇家气派，又保社稷安宁。", founders: "景泰蓝技艺在明清时期为宫廷垄断，民间不得制作。清末民初，宫廷作坊解散，艺人流落民间，景泰蓝技艺才得以外传。近代代表人物有：林徽因，她于1951年组织成立景泰蓝工艺小组，挽救了濒临失传的技艺；钱美华，师从林徽因，被誉为'景泰蓝第一人'，其设计的《周其垒》获全国工艺美术展金奖；张同禄，被誉为'珐琅张'，其作品《鸟杯》以景泰蓝与玉雕结合，开创了'景泰蓝镶嵌'新技法。", craftDetail: "景泰蓝制作工艺极为繁复，有'一件景泰蓝，十件官窑器'之说，流程如下：\n一、制胎：以紫铜片敲打成器形，称为'敲胎'。复杂器形需分片制作，再以焊药焊接成型。胎体要求厚薄均匀、线条流畅，表面光洁无砂眼。\n二、掐丝：将扁铜丝（截面约1毫米宽、0.5毫米厚）按设计图案掐成各种纹样，以白芨糊粘于铜胎表面。掐丝是景泰蓝的灵魂，艺人以镊子夹持铜丝，一折一弯，花鸟鱼虫、山水人物便跃然胎上。掐丝要求'丝直、纹顺、接口严'，一根铜丝从头掐到尾，中间不得断接。\n三、点蓝：将珐琅釉料以铜丝或吸管填入铜丝围成的空格中。珐琅釉料以石英、长石、硼砂等矿物配制，经研磨成细粉，加水调成糊状。点蓝讲究'色不越界、料不满溢'，釉料高度以低于铜丝0.5毫米为佳，因为烧制后釉料会膨胀。\n四、烧蓝：将点蓝后的胎体放入窑中烧制，温度约800-900摄氏度。烧制过程中，釉料熔融流动，与铜胎紧密结合。烧蓝需反复进行多次，每次烧后釉料收缩，需再次点蓝、再次烧制，直至釉面与铜丝齐平。一件精品景泰蓝往往要烧四至六次。\n五、磨光：烧好的景泰蓝表面凹凸不平，需以砂石、木炭逐次打磨。先用粗砂石磨去凸起，再用细砂石磨平，最后用木炭蘸水细磨，使釉面光滑如镜。磨光时需注意保护铜丝，不可磨断。\n六、镀金：将磨光后的景泰蓝放入镀金液中，以电解法在铜丝和铜胎裸露处镀上一层黄金。镀金后的景泰蓝金碧辉煌，铜丝如金丝，胎体如金器，华贵非常。\n七、检验：成品需经严格检验，釉面不得有气泡、裂纹、砂眼，铜丝不得有断裂、翘起，镀金层要均匀光亮。不合格品当场砸碎，以防流入市场。" },
  { name: "古琴", category: "传统音乐", img: "assets/heritage-sunmao.jpg", desc: "七弦太古，清音幽远。古琴是中国最古老的弹拨乐器之一，有三千年以上历史，位列'琴棋书画'四艺之首，音色深沉悠远，余韵绵长。", craft: "选材、斫琴、上弦、调音", inherit: "斫琴技艺、音色鉴别、指法体系", legends: "相传伏羲见凤凰非梧桐不栖，非竹实不食，遂以梧桐木制琴，以蚕丝为弦，创制了古琴。又传舜帝南巡，崩于苍梧之野，其二妃娥皇、女英泪洒斑竹，以泪痕斑斑的竹子制成琴箫，吹奏哀音，天地为之动容。古琴由此被赋予了神圣的起源。", myths: "古琴界流传'琴魂'之说。相传名琴皆有灵性，能择主而事。春秋时期，伯牙鼓琴，志在高山流水，唯有钟子期能领会其意。子期死后，伯牙摔琴绝弦，终身不复鼓琴。又传东汉蔡邕闻火中桐木爆裂之声，知其为良材，抢出制琴，琴音果然清越异常，因琴尾有焦痕，故名'焦尾琴'。", founders: "古琴无单一创始人，但历代皆有斫琴大师。唐代四川雷氏家族——雷威、雷霄、雷文、雷迅、雷会，世代斫琴，其琴被尊为'雷琴'，千金难求。宋代斫琴大师朱仁济，其琴'音韵清越，冠绝一时'。当代古琴大师管平湖，其演奏的《流水》被录入美国'旅行者号'太空探测器金唱片，在宇宙中播放；斫琴大师王鹏，创立'钧天坊'，以古法斫琴，其琴被国内外多家博物馆收藏。", craftDetail: "古琴制作工艺称为'斫琴'，流程如下：\n一、选材：面板以百年以上梧桐木或杉木为佳，质地轻软，利于发声；底板以梓木或楸木为佳，质地坚硬，利于反射声音。选木要'看年轮、听声音、测密度'——年轮细密均匀、敲击声音清脆、密度适中之材为上品。传说中的'焦尾琴'，便是以火中抢救出的焦桐制成。\n二、开料：将木材按琴形锯开，面板需挖出槽腹（共鸣腔），底板保持平整。槽腹的形状和深度决定了琴的音色，是斫琴的核心机密。不同流派的槽腹形状各异，有'伏羲式''仲尼式''连珠式''落霞式'等。\n三、合琴：将面板和底板以生漆和鹿角霜调和的漆灰粘合，以绳带捆扎，阴干数月。漆灰不仅起粘合作用，还能调节音色，使琴声温润不燥。\n四、裱布：在琴的正面和背面裱以麻布，增强结构强度，防止开裂。裱布后以漆灰找平，反复打磨，使表面平整光滑。\n五、髹漆：以天然大漆涂刷琴面，反复多次，形成厚实的漆层。大漆以漆树汁液制成，经氧化后坚硬耐磨，色泽深沉。髹漆需经'刷漆、阴干、打磨'反复数十次，历时数年。\n六、上弦：古琴有七根弦，传统以蚕丝为弦，音色柔和；现代多以钢丝为弦，音色明亮。上弦时以弦轴固定于琴头，穿过雁足固定于琴底，调节弦轴使音高准确。\n七、调音：古琴定弦以'正调'（F调）为基础，弦序为'宫、商、角、徵、羽、文、武'。调音以耳朵辨别音高，或以电子调音器辅助。调好音后，以琴轸（调弦装置）锁定弦轴，防止走音。\n八、试音：以手指拨弦，听其音色。好的古琴应具备'九德'——奇、古、透、静、润、圆、清、匀、芳。即音色奇特、有古韵、通透、安静、润泽、圆润、清越、均匀、有芬芳之气。\n九、养护：古琴忌暴晒、忌干燥、忌潮湿。定期以软布擦拭琴面，以蜂蜡保养漆层。弹奏前需'净手、静心'，以示对琴的尊重。年代久远的古琴，漆层会形成'断纹'——如冰裂、流水、梅花等纹样，被视为珍贵的年代标志。" }
];

// ===================== WEATHER =====================
function initWeather() {
  const cityEl = document.getElementById('weather-city');
  const tempEl = document.getElementById('weather-temp');
  const descEl = document.getElementById('weather-desc');
  const iconEl = document.getElementById('weather-icon');

  if (!navigator.geolocation) {
    cityEl.textContent = '北京';
    tempEl.textContent = '26°C';
    descEl.textContent = '多云';
    iconEl.textContent = '⛅';
    return;
  }
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      try {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
        const data = await res.json();
        const w = data.current_weather;
        const code = w.weathercode;
        let icon = '🌤', desc = '晴';
        if (code >= 51) { icon = '🌧'; desc = '雨'; }
        else if (code >= 3) { icon = '☁'; desc = '多云'; }
        else if (code >= 1) { icon = '⛅'; desc = '阴'; }
        else { icon = '☀'; desc = '晴'; }
        // Reverse geocoding via nominatim
        const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10`, { headers: { 'User-Agent': 'TiangongApp/1.0' } });
        const geo = await geoRes.json();
        const cityName = geo.address?.city || geo.address?.town || geo.address?.county || '当地';
        cityEl.textContent = cityName;
        tempEl.textContent = Math.round(w.temperature) + '°C';
        descEl.textContent = desc;
        iconEl.textContent = icon;
      } catch (e) {
        cityEl.textContent = '北京';
        tempEl.textContent = '26°C';
        descEl.textContent = '多云';
        iconEl.textContent = '⛅';
      }
    },
    () => {
      cityEl.textContent = '北京';
      tempEl.textContent = '26°C';
      descEl.textContent = '多云';
      iconEl.textContent = '⛅';
    },
    { timeout: 8000 }
  );
}

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderHeritage() {
  const container = document.getElementById('heritage-list');

  container.innerHTML = shuffled.map((h, idx) => `
    <div class="heritage-card" ondblclick="openHeritageDetail(${heritageData.indexOf(h)})">
      <img class="heritage-img" src="${h.img}" alt="${h.name}" loading="lazy">
      <div class="heritage-info">
        <div class="heritage-name">${h.name}</div>

async function fetchTravelWeather() {
  const cards = document.querySelectorAll('.travel-guide-weather');
  for (const card of cards) {
    const lat = card.getAttribute('data-lat');
    const lon = card.getAttribute('data-lon');
    const city = card.getAttribute('data-city');
    try {
      const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
      const data = await res.json();
      const w = data.current_weather;
      const code = w.weathercode;
      let icon = '🌤', desc = '晴';
      if (code >= 51) { icon = '🌧'; desc = '雨'; }
      else if (code >= 3) { icon = '☁'; desc = '多云'; }
      else if (code >= 1) { icon = '⛅'; desc = '阴'; }
      else { icon = '☀'; desc = '晴'; }
      card.innerHTML = `<span class="travel-guide-weather-icon">${icon}</span><span>${city} · ${desc}</span><span class="travel-guide-weather-temp">${Math.round(w.temperature)}°C</span>`;
    } catch(e) {
      card.innerHTML = `<span class="travel-guide-weather-icon">🌤</span><span>${city} · 天气暂不可用</span>`;
    }
  }
}

let currentMaster = null;

function startChat(masterId) {
  currentMaster = masters.find(m => m.id === masterId);
  if (!currentMaster) return;
  document.getElementById('chat-select').style.display = 'none';
  document.getElementById('chat-room').style.display = 'flex';
  document.getElementById('chat-avatar').textContent = currentMaster.avatar;
  document.getElementById('chat-master-name').textContent = currentMaster.name;
  const msgs = document.getElementById('chat-messages');
  msgs.innerHTML = '';
  addMasterMsg("你好啊，年轻人。我是" + currentMaster.name + "，做" + currentMaster.craft + "的。有什么想了解的，尽管问。");
}
function exitChat() {
  document.getElementById('chat-select').style.display = 'block';
  document.getElementById('chat-room').style.display = 'none';
  currentMaster = null;
}
function stopChat() {
  currentMaster = null;
}
function addMasterMsg(text) {
  if (!currentMaster) return;
  const msgs = document.getElementById('chat-messages');
  const action = currentMaster.actions[Math.floor(Math.random() * currentMaster.actions.length)];
  const div = document.createElement('div');
  div.className = 'msg msg-master';
  div.innerHTML = `<div class="msg-action">${action}：</div><div class="msg-bubble">${text}</div><div class="msg-time">${nowTime()}</div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}
function addUserMsg(text) {
  const msgs = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'msg msg-user';
  div.innerHTML = `<div class="msg-bubble">${text}</div><div class="msg-time">${nowTime()}</div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}
function nowTime() {
  const d = new Date();
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}
function sendMsg() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text || !currentMaster) return;
  addUserMsg(text);
  input.value = '';
  setTimeout(() => replyMaster(text), 600);
}
function replyMaster(userText) {
  if (!currentMaster) return;
  const replies = masterReplies[currentMaster.id];
  if (!replies) {
    addMasterMsg("这个我还真不太懂，咱聊聊" + currentMaster.craft + "的事吧。");
    return;
  }
  let pool = replies.default;
  const lower = userText.toLowerCase();
  if (lower.includes('技艺') || lower.includes('怎么做') || lower.includes('工序') || lower.includes('流程')) pool = replies.技艺 || replies.default;
  else if (lower.includes('日常') || lower.includes('生活') || lower.includes('日子') || lower.includes('每天')) pool = replies.日常 || replies.default;
  else if (lower.includes('传承') || lower.includes('徒弟') || lower.includes('学') || lower.includes('教') || lower.includes('初心')) pool = replies.传承 || replies.default;
  const reply = pool[Math.floor(Math.random() * pool.length)];
  addMasterMsg(reply);
}

function toggleMusic() {
  const btn = document.getElementById('audio-btn');
  if (!isMusicOn) {
    startMusic();
    btn.classList.remove('off');
    btn.textContent = '🎵';
    isMusicOn = true;
  } else {
    stopMusic();
    btn.classList.add('off');
    btn.textContent = '🔇';

function startMusic() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (musicInterval) return;

  const pentatonic = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25]; // C D E G A C
  let noteIdx = 0;

  function playNote() {
    if (!isMusicOn) return;
    const freq = pentatonic[Math.floor(Math.random() * pentatonic.length)];
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 2);
  }

  playNote();
  musicInterval = setInterval(playNote, 2500);
}

function stopMusic() {
  if (musicInterval) {
    clearInterval(musicInterval);
    musicInterval = null;
  }
}

let tickerIntervals = {};

function initTicker(pageId) {
  const textEl = document.getElementById('ticker-text-' + pageId);
  if (!textEl) return;
  let idx = Math.floor(Math.random() * heritageQuotes.length);
  textEl.textContent = heritageQuotes[idx];
  textEl.classList.add('show');
  if (tickerIntervals[pageId]) clearInterval(tickerIntervals[pageId]);
  tickerIntervals[pageId] = setInterval(() => {
    textEl.classList.remove('show');
    setTimeout(() => {
      idx = (idx + 1) % heritageQuotes.length;
      textEl.textContent = heritageQuotes[idx];
      textEl.classList.add('show');
    }, 800);
  }, 2000);
}

function stopAllTickers() {
  Object.values(tickerIntervals).forEach(clearInterval);
  tickerIntervals = {};
}

// Override showPage to handle tickers
const originalShowPage = showPage;
showPage = function(id) {
  originalShowPage(id);

  if (['heritage','map','travel','chat'].includes(id)) {
