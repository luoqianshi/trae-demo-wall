      </button>
      <button class="task-tab" data-filter="fuxiu">
        <span class="tab-icon">&#x270D;</span>符修
      </button>
    </div>

    <div class="task-list" id="task-list"></div>

  </div>
</div>

<!-- ===== TASK PANEL ===== -->
<div class="task-panel" id="task-panel">
  <div class="panel-card">
    <div class="panel-title" id="panel-title">修炼中</div>
    <div class="panel-sub" id="panel-sub"></div>

    <div id="panel-content"></div>

    <div class="panel-actions">
      <button class="btn btn-outline btn-sm" onclick="cancelTask()">放弃修炼</button>
      <button class="btn btn-primary btn-sm" onclick="completeTask()" id="btn-complete">修炼结束</button>
    </div>
  </div>
</div>

<!-- ===== REWARD ===== -->
<div class="reward-overlay" id="reward-overlay">
  <div class="reward-card">
    <div class="reward-icon" id="reward-icon">&#x2728;</div>
    <div class="reward-title" id="reward-title">修炼结束</div>
    <div class="reward-sub" id="reward-sub">完成度 100%</div>
    <div class="reward-items" id="reward-items"></div>
    <button class="btn btn-primary" onclick="closeReward()">继续修炼</button>
  </div>
</div>

<!-- ===== BREAKTHROUGH ===== -->
<div class="breakthrough-overlay" id="breakthrough-overlay">
  <div class="breakthrough-card">
    <div class="bt-icon">&#x26A1;</div>
    <div class="bt-title">突破！</div>
    <div class="bt-new-realm" id="bt-new-realm"></div>
    <div class="bt-detail" id="bt-detail"></div>
    <button class="btn btn-gold" onclick="closeBreakthrough()">踏入新境界</button>
  </div>
</div>

<div id="toast-container"></div>

<script>
// ==================== DATA ====================
const REALMS = [
  { name: '炼气期', layers: 13, xpPerLayer: 100, sub: null },
  { name: '筑基期', layers: 4,  xpPerLayer: 400, sub: ['初期','中期','后期','圆满'] },
];

const ROOTS = [
  { id: 'metal', name: '金灵根', icon: '&#x2728;' },
  { id: 'wood',  name: '木灵根', icon: '&#x1F33F;' },
  { id: 'water', name: '水灵根', icon: '&#x1F4A7;' },
  { id: 'fire',  name: '火灵根', icon: '&#x1F525;' },
  { id: 'earth', name: '土灵根', icon: '&#x1FAA8;' },
];

const ATTRS = [
  { id: 'gengu',   label: '根骨', icon: '&#x1F4AA;' },
  { id: 'shenfa',  label: '身法', icon: '&#x1F3C3;' },
  { id: 'shenshi', label: '神识', icon: '&#x1F9E0;' },
  { id: 'wuxing',  label: '悟性', icon: '&#x1F4A1;' },
  { id: 'daoxin',  label: '道心', icon: '&#x2764;' },
  { id: 'qiyun',   label: '气运', icon: '&#x1F340;' },
];

// Tasks: target is the goal (字数/步数/分钟)
const DEFAULT_TASKS = [
  { id: 't1', name: '外出散步3000步',   type: 'duanti',  icon: '&#x1F6B6;', target: 3000, unit: '步',   xp: 52, stone: 30, desc: '锻体 · 外出历练', realLabel: '步数' },
  { id: 't2', name: '专注冥想10分钟',   type: 'lianshen',icon: '&#x1F9D8;', target: 10,   unit: '分钟', xp: 26, stone: 20, desc: '炼神 · 入定修炼', realLabel: '专注时长' },
  { id: 't3', name: '撰写修行日记500字',type: 'fuxiu',   icon: '&#x270D;',  target: 500,  unit: '字',   xp: 49, stone: 25, desc: '符修 · 以文入道', realLabel: '字数' },
  { id: 't4', name: '晨练跑步5000步',   type: 'duanti',  icon: '&#x1F3C3;', target: 5000, unit: '步',   xp: 80, stone: 45, desc: '锻体 · 淬炼肉身', realLabel: '步数' },
  { id: 't5', name: '闭目养神5分钟',    type: 'lianshen',icon: '&#x1F634;', target: 5,    unit: '分钟', xp: 18, stone: 12, desc: '炼神 · 调息养神', realLabel: '专注时长' },
  { id: 't6', name: '抄写经文1000字',   type: 'fuxiu',   icon: '&#x1F4D6;', target: 1000, unit: '字',   xp: 75, stone: 40, desc: '符修 · 凝神抄写', realLabel: '字数' },
];

// ==================== STATE ====================
let state = {
  daohao: '',
  root: ROOTS[3],
  realmIdx: 0,
  layer: 1,
  xp: 0,
  stone: 0,
  streak: 0,
  lastDate: '',
  attrs: { gengu: 5, shenfa: 5, shenshi: 5, wuxing: 5, daoxin: 5, qiyun: 5 },
  tasks: JSON.parse(JSON.stringify(DEFAULT_TASKS)),
  completedTaskIds: [],
};

let activeTask = null;
let taskProgress = 0;        // current progress value
let taskInterval = null;
let writeText = '';          // fuxiu text buffer

// ==================== COOKIE ====================
const COOKIE_KEY = 'xiantu_save';

function saveState() {
  const data = {
    daohao: state.daohao,
    rootId: state.root.id,
    realmIdx: state.realmIdx,
    layer: state.layer,
    xp: state.xp,
    stone: state.stone,
    streak: state.streak,
    lastDate: state.lastDate,
    attrs: state.attrs,
    completedTaskIds: state.completedTaskIds,
  };
  // 30 days expiry
  const expires = new Date(Date.now() + 30 * 864e5).toUTCString();
  document.cookie = COOKIE_KEY + '=' + encodeURIComponent(JSON.stringify(data)) + ';expires=' + expires + ';path=/';
}

function loadState() {
  const cookies = document.cookie.split(';');
  for (let c of cookies) {
    c = c.trim();
    if (c.indexOf(COOKIE_KEY + '=') === 0) {
      try {
        const data = JSON.parse(decodeURIComponent(c.substring(COOKIE_KEY.length + 1)));
        state.daohao = data.daohao || '';
        state.root = ROOTS.find(r => r.id === data.rootId) || ROOTS[3];
        state.realmIdx = data.realmIdx || 0;
        state.layer = data.layer || 1;
        state.xp = data.xp || 0;
        state.stone = data.stone || 0;
        state.streak = data.streak || 0;
        state.lastDate = data.lastDate || '';
        state.attrs = data.attrs || { gengu: 5, shenfa: 5, shenshi: 5, wuxing: 5, daoxin: 5, qiyun: 5 };
        state.completedTaskIds = data.completedTaskIds || [];
        return true;
      } catch (e) {
        return false;
      }
    }
  }
  return false;
}

function clearSave() {
  document.cookie = COOKIE_KEY + '=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/';
}

function logout() {
  if (!confirm('确定要抹除仙缘，重新开始吗？所有修为将消散于天地之间。')) return;
  clearSave();
  location.reload();
}

// ==================== INIT ====================
function init() {
  // Random root for create screen
  const randomRoot = ROOTS[Math.floor(Math.random() * ROOTS.length)];
  document.getElementById('linggen-display').innerHTML =
    `<span class="root-tag ${randomRoot.id}">${randomRoot.icon} ${randomRoot.name}</span>`;
  state._pendingRoot = randomRoot;

  // Try load save
  if (loadState() && state.daohao) {
    enterMainScreen();
    return;
  }

  // Enter key
  document.getElementById('input-daohao').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') createCultivator();
  });

  // Tab switching
  document.querySelectorAll('.task-tab').forEach(tab => {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.task-tab').forEach(t => t.classList.remove('active'));
      this.classList.add('active');
      renderTasks(this.dataset.filter);
    });
  });
}

// ==================== CREATE ====================
function createCultivator() {
  const daohao = document.getElementById('input-daohao').value.trim();
  if (!daohao) {
    showToast('请输入你的道号');
    return;
  }
  state.daohao = daohao;
  state.root = state._pendingRoot || ROOTS[3];
  state.lastDate = '';

  // Check streak for today
  checkStreak();

  saveState();
  enterMainScreen();
  showToast('踏入仙途！愿你修仙之路一帆风顺');
}

function enterMainScreen() {
  checkStreak();
  document.getElementById('screen-create').classList.remove('active');
  document.getElementById('screen-main').classList.add('active');
  renderAll();
}

// ==================== STREAK ====================
function checkStreak() {
  const today = new Date().toISOString().slice(0, 10);
  if (state.lastDate === today) return; // already counted today

  // If last cultivation was not yesterday, reset streak
  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  const yStr = yesterday.toISOString().slice(0, 10);
  if (state.lastDate && state.lastDate !== yStr) {
    // Streak broken only if more than 1 day gap AND we had a streak
    // (No punishment, just reset)
    if (state.streak > 0) {
      state.streak = 0;
    }
  }
}

function recordStreak() {
  const today = new Date().toISOString().slice(0, 10);
  if (state.lastDate === today) return; // already counted
  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  const yStr = yesterday.toISOString().slice(0, 10);
  if (state.lastDate === yStr) {
    state.streak++;
  } else {
    state.streak = 1;
  }
  state.lastDate = today;
}

// ==================== RENDER ====================
function renderAll() {
  renderTopBar();
  renderRealm();
  renderAttrs();
  const activeTab = document.querySelector('.task-tab.active');
  renderTasks(activeTab ? activeTab.dataset.filter : 'all');
}

function renderTopBar() {
  document.getElementById('avatar-icon').textContent = state.daohao.charAt(0);
  document.getElementById('disp-name').textContent = state.daohao;
  document.getElementById('disp-realm').textContent = getFullRealmName();
  document.getElementById('disp-stone').textContent = state.stone;
  document.getElementById('disp-xp').textContent = state.xp;

  const streakBadge = document.getElementById('streak-badge');
  if (state.streak > 0) {
    streakBadge.style.display = 'inline-flex';
    document.getElementById('disp-streak').textContent = state.streak;
  } else {
    streakBadge.style.display = 'none';
  }
}

function getFullRealmName() {
  const r = REALMS[state.realmIdx];
  if (r.sub) return r.name + ' · ' + r.sub[state.layer - 1];
  return r.name + ' · 第' + state.layer + '层';
}

function getXpForLayer() {
  return REALMS[state.realmIdx].xpPerLayer;
}

function renderRealm() {
  const r = REALMS[state.realmIdx];
  const xpNeeded = r.xpPerLayer;
  const pct = Math.min(100, Math.round((state.xp / xpNeeded) * 100));

  document.getElementById('realm-name').textContent = r.name;
  document.getElementById('layer-info').textContent =
    r.sub
      ? r.sub[state.layer - 1] + ' / ' + r.sub.join(' · ')
      : '第 ' + state.layer + ' 层 / 共 ' + r.layers + ' 层';
  document.getElementById('xp-bar').style.width = pct + '%';
  document.getElementById('xp-current').textContent = state.xp;
  document.getElementById('xp-next').textContent = xpNeeded;
}

function renderAttrs() {
  const grid = document.getElementById('attr-grid');
  grid.innerHTML = ATTRS.map(a => `
    <div class="attr-card">
      <div class="attr-icon">${a.icon}</div>
      <div class="attr-val">${state.attrs[a.id]}</div>
      <div class="attr-label">${a.label}</div>
    </div>
  `).join('');
}

function renderTasks(filter) {
  const list = document.getElementById('task-list');
  let tasks = state.tasks;
  if (filter !== 'all') tasks = tasks.filter(t => t.type === filter);

  if (tasks.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">&#x1F4DC;</div><p>暂无此类修炼任务</p></div>`;
    return;
  }

  list.innerHTML = tasks.map(t => {
    const completed = state.completedTaskIds.includes(t.id);
    let actionHtml = '';
    if (completed) {
      actionHtml = `<span style="color:var(--accent2);font-weight:700;font-size:0.85rem;">&#x2713; 已修炼</span>`;
    } else {
      actionHtml = `<button class="btn btn-primary btn-sm" onclick="startTask('${t.id}')">开始修炼</button>`;
    }
    const typeLabel = t.type === 'duanti' ? '锻体' : t.type === 'lianshen' ? '炼神' : '符修';
    return `
      <div class="task-card ${completed ? 'completed' : ''}">
        <div class="task-icon-wrap ${t.type}">${t.icon}</div>
        <div class="task-info">
          <div class="task-name">${t.name}</div>
          <div class="task-meta">${t.desc} · ${typeLabel} · 目标 ${t.target}${t.unit}</div>
          <div class="task-xp">&#x1F31F; +${t.xp} 历练 · &#x1F4CE; +${t.stone} 灵石</div>
        </div>
        <div class="task-actions">${actionHtml}</div>
      </div>
    `;
  }).join('');
}

// ==================== START TASK ====================
function startTask(taskId) {
  const task = state.tasks.find(t => t.id === taskId);
  if (!task) return;

  activeTask = task;
  taskProgress = 0;
  writeText = '';

  document.getElementById('panel-title').textContent = task.name;
  document.getElementById('panel-sub').textContent = task.desc;
  document.getElementById('task-panel').classList.add('active');

  if (task.type === 'fuxiu') {
    setupFuxiuPanel(task);
  } else if (task.type === 'lianshen') {
    setupLianshenPanel(task);
  } else if (task.type === 'duanti') {
    setupDuantiPanel(task);
  }
}

// ----- Fuxiu (writing) -----
function setupFuxiuPanel(task) {
  const content = document.getElementById('panel-content');
  content.innerHTML = `
    <div class="big-progress" id="write-count">0<span class="unit"> / ${task.target} 字</span></div>
    <div class="progress-label">在下方书写你的修行心得</div>
    <div class="progress-bar-lg"><div class="fill" id="write-fill" style="width:0%"></div></div>
    <textarea class="write-area" id="write-area" placeholder="开始书写..." oninput="onWriteInput()"></textarea>
    <div class="export-wrap">
      <button class="btn btn-outline btn-sm" onclick="exportText()">&#x1F4C4; 导出修行心得</button>
    </div>
  `;
  document.getElementById('btn-complete').textContent = '修炼结束';
  document.getElementById('btn-complete').disabled = false;
  setTimeout(() => document.getElementById('write-area').focus(), 100);
}

function onWriteInput() {
  if (!activeTask || activeTask.type !== 'fuxiu') return;
  const area = document.getElementById('write-area');
  if (!area) return;
  writeText = area.value;
  // Count Chinese chars + words; exclude spaces and newlines
  const cleanText = writeText.replace(/\s/g, '');
  taskProgress = cleanText.length;
  updateFuxiuProgress();
}

function updateFuxiuProgress() {
  if (!activeTask) return;
  const target = activeTask.target;
  const pct = Math.min(100, Math.round((taskProgress / target) * 100));
  const countEl = document.getElementById('write-count');
  const fillEl = document.getElementById('write-fill');
  if (countEl) countEl.innerHTML = taskProgress + '<span class="unit"> / ' + target + ' 字</span>';
  if (fillEl) fillEl.style.width = pct + '%';

  if (taskProgress >= target) {
    document.getElementById('btn-complete').textContent = '修炼圆满（可结束）';
  }
}

function exportText() {
  if (!writeText || writeText.trim().length === 0) {
    showToast('尚无内容可导出');
    return;
  }
  const blob = new Blob([writeText], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (activeTask ? activeTask.name : '修行心得') + '.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('修行心得已导出');
}

// ----- Lianshen (focus timer) -----
function setupLianshenPanel(task) {
  const content = document.getElementById('panel-content');
  const targetSeconds = task.target * 60;
  content.innerHTML = `
    <div class="focus-timer" id="focus-timer">00:00</div>
    <div class="focus-tip">&#x1F9D8; 请保持专注，勿操作其他应用。计时到 ${task.target} 分钟即修炼圆满。</div>
    <div class="progress-bar-lg"><div class="fill" id="focus-fill" style="width:0%"></div></div>
    <div class="progress-label" id="focus-label">已专注 00:00 / ${String(task.target).padStart(2, '0')}:00</div>
  `;
  document.getElementById('btn-complete').textContent = '提前结束';
  document.getElementById('btn-complete').disabled = false;

  taskProgress = 0;
  taskInterval = setInterval(() => {
    taskProgress++;
    updateLianshenProgress();
    if (taskProgress >= targetSeconds) {
      clearInterval(taskInterval);
      taskInterval = null;
      document.getElementById('btn-complete').textContent = '修炼圆满（可结束）';
    }
  }, 1000);
}

function updateLianshenProgress() {
  if (!activeTask) return;
  const targetSeconds = activeTask.target * 60;
  const pct = Math.min(100, Math.round((taskProgress / targetSeconds) * 100));
  const timerEl = document.getElementById('focus-timer');
  const fillEl = document.getElementById('focus-fill');
  const labelEl = document.getElementById('focus-label');
  if (timerEl) {
    const mins = Math.floor(taskProgress / 60);
    const secs = taskProgress % 60;
    timerEl.textContent = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
  }
  if (fillEl) fillEl.style.width = pct + '%';
  if (labelEl) {
    const eMins = Math.floor(taskProgress / 60);
    const eSecs = taskProgress % 60;
    labelEl.textContent = '已专注 ' + String(eMins).padStart(2, '0') + ':' + String(eSecs).padStart(2, '0') + ' / ' + String(activeTask.target).padStart(2, '0') + ':00';
  }
}

// ----- Duanti (steps) -----
function setupDuantiPanel(task) {
  const content = document.getElementById('panel-content');
  content.innerHTML = `
    <div class="big-progress" id="step-count">0<span class="unit"> / ${task.target} 步</span></div>
    <div class="progress-label">点击下方按钮模拟行进步数（实际应用中由GPS+加速度计自动记录）</div>
    <div class="progress-bar-lg"><div class="fill" id="step-fill" style="width:0%"></div></div>
    <div class="step-counter">
      <button class="step-btn" onclick="addSteps(100)">+100</button>
      <button class="step-btn" onclick="addSteps(500)">+500</button>
      <button class="step-btn" onclick="addSteps(1000)">+1000</button>
    </div>
    <div class="step-hint">每次点击模拟行进一段距离</div>
  `;
  document.getElementById('btn-complete').textContent = '提前结束';
  document.getElementById('btn-complete').disabled = false;
}

function addSteps(amount) {
  if (!activeTask || activeTask.type !== 'duanti') return;
  taskProgress = Math.min(activeTask.target, taskProgress + amount);
  updateDuantiProgress();
}

function updateDuantiProgress() {
  if (!activeTask) return;
  const target = activeTask.target;
  const pct = Math.min(100, Math.round((taskProgress / target) * 100));
  const countEl = document.getElementById('step-count');
  const fillEl = document.getElementById('step-fill');
  if (countEl) countEl.innerHTML = taskProgress + '<span class="unit"> / ' + target + ' 步</span>';
  if (fillEl) fillEl.style.width = pct + '%';

  if (taskProgress >= target) {
    document.getElementById('btn-complete').textContent = '修炼圆满（可结束）';
  }
}

// ==================== COMPLETE / CANCEL ====================
function cancelTask() {
  if (taskInterval) { clearInterval(taskInterval); taskInterval = null; }
  document.getElementById('task-panel').classList.remove('active');
  activeTask = null;
  taskProgress = 0;
  showToast('修炼已取消，灵兽叹了口气');
}

function completeTask() {
  if (!activeTask) return;
  if (taskInterval) { clearInterval(taskInterval); taskInterval = null; }

  const task = activeTask;
  document.getElementById('task-panel').classList.remove('active');

  const progressForCalc = task.type === 'lianshen' ? taskProgress / 60 : taskProgress;
  const completion = Math.min(100, Math.round((progressForCalc / task.target) * 100));

  // Calculate rewards
  const xpGain = Math.round(task.xp * (completion / 100));
  const stoneGain = Math.round(task.stone * (completion / 100));

  // Epiphany
  const epiphanyChance = 0.1 + (state.attrs.qiyun * 0.005);
  const epiphany = completion >= 100 && Math.random() < epiphanyChance;
  const epiphanyMulti = epiphany ? (2 + Math.floor(Math.random() * 4)) : 1;

  const finalXp = xpGain * epiphanyMulti;
  const finalStone = stoneGain * (epiphany ? 2 : 1);

  // Streak bonus
  recordStreak();
  const streakBonus = 1 + 0.1 * Math.min(state.streak, 7);
  const finalStoneWithStreak = Math.round(finalStone * streakBonus);

  // Apply
  state.xp += finalXp;
  state.stone += finalStoneWithStreak;
  state.completedTaskIds.push(task.id);

  // Attr gains
  const attrGains = getAttrGains(task.type);
  Object.keys(attrGains).forEach(k => {
    state.attrs[k] = Math.min(99, (state.attrs[k] || 0) + attrGains[k]);
  });

  // Show reward
  showReward(task, completion, finalXp, finalStoneWithStreak, attrGains, epiphany, epiphanyMulti, streakBonus);

  // Check level up
  checkLevelUp();

  saveState();
  renderAll();
  activeTask = null;
  taskProgress = 0;
}

function getAttrGains(type) {
  switch (type) {
    case 'duanti':   return { gengu: 2, shenfa: 1 };
    case 'lianshen': return { shenshi: 2, daoxin: 1 };
    case 'fuxiu':    return { shenshi: 1, wuxing: 2 };
    default: return {};
  }
}

// ==================== LEVEL UP ====================
function checkLevelUp() {
  const xpNeeded = getXpForLayer();
  if (state.xp < xpNeeded) return;

  state.xp -= xpNeeded;

  if (state.layer < REALMS[state.realmIdx].layers) {
    // Same realm, next layer
    state.layer++;
    setTimeout(() => showBreakthrough(false), 1200);
  } else {
    // Break to next realm
    if (state.realmIdx < REALMS.length - 1) {
      state.realmIdx++;
      state.layer = 1;
      setTimeout(() => showBreakthrough(true), 1200);
    } else {
      // Max realm, keep at max
      state.layer = REALMS[state.realmIdx].layers;
      state.xp = 0;
    }
  }
}

// ==================== REWARD ====================
function showReward(task, completion, xp, stone, attrGains, epiphany, multi, streakBonus) {
  const icon = completion >= 100 ? '&#x1F389;' : '&#x2728;';
  let title;
  if (epiphany) {
    title = '顿悟！修炼大获成功';
  } else if (completion >= 100) {
    title = '修炼圆满';
  } else if (completion >= 50) {
    title = '修炼结束';
  } else {
    title = '修炼未尽';
  }

  let sub = '完成度 ' + completion + '%';
  if (epiphany) sub += ' · 触发顿悟 ×' + multi + ' 倍奖励！';
  if (streakBonus > 1) sub += ' · 道心连击 ×' + streakBonus.toFixed(1) + ' 灵石加成';

  let attrStr = '';
  Object.keys(attrGains).forEach(k => {
    const attr = ATTRS.find(a => a.id === k);
    if (attr && attrGains[k] > 0) {
      attrStr += `
        <div class="reward-item">
          <div class="r-val stat">${attr.icon} +${attrGains[k]}</div>
          <div class="r-label">${attr.label}</div>
        </div>`;
    }
  });

  document.getElementById('reward-icon').innerHTML = icon;
  document.getElementById('reward-title').textContent = title;
  document.getElementById('reward-sub').textContent = sub;
  document.getElementById('reward-items').innerHTML = `
    <div class="reward-item">
      <div class="r-val xp">&#x1F31F; +${xp}</div>
      <div class="r-label">历练点数</div>
    </div>
    <div class="reward-item">
      <div class="r-val stone">&#x1F4CE; +${stone}</div>
      <div class="r-label">灵石</div>
    </div>
    ${attrStr}
  `;

  document.getElementById('reward-overlay').classList.add('active');
}

function closeReward() {
  document.getElementById('reward-overlay').classList.remove('active');
}

// ==================== BREAKTHROUGH ====================
function showBreakthrough(isNewRealm) {
  const r = REALMS[state.realmIdx];
  const realmName = isNewRealm
    ? r.name
    : (r.sub ? r.name + ' · ' + r.sub[state.layer - 1] : r.name + ' · 第' + state.layer + '层');

  document.getElementById('bt-new-realm').textContent = realmName;
  document.getElementById('bt-detail').textContent = isNewRealm
    ? '恭喜突破至' + r.name + '！修仙之路更进一步'
    : '修为精进，晋升至' + (r.sub ? r.sub[state.layer - 1] : '第' + state.layer + '层');

  document.getElementById('breakthrough-overlay').classList.add('active');
}

function closeBreakthrough() {
  document.getElementById('breakthrough-overlay').classList.remove('active');
  renderAll();
}

// ==================== UTILS ====================
function showToast(msg) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

// ==================== BOOT ====================
init();
</script>

</body>
