// ==================== 工具函数 ====================
const Utils = {
    randomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    },
    randomFloat(min, max) {
        return Math.random() * (max - min) + min;
    },
    randomChoice(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    },
    clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
    },
    distance(x1, y1, x2, y2) {
        return Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
    },
    manhattanDistance(x1, y1, x2, y2) {
        return Math.abs(x2 - x1) + Math.abs(y2 - y1);
    },
    lerp(a, b, t) {
        return a + (b - a) * t;
    },
    formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    },
    noise2D(x, y, seed = 0) {
        const n = Math.sin(x * 12.9898 + y * 78.233 + seed) * 43758.5453;
        return n - Math.floor(n);
    },
    smoothNoise(x, y, seed) {
        const corners = (this.noise2D(x-1, y-1, seed) + this.noise2D(x+1, y-1, seed) +
                        this.noise2D(x-1, y+1, seed) + this.noise2D(x+1, y+1, seed)) / 16;
        const sides = (this.noise2D(x-1, y, seed) + this.noise2D(x+1, y, seed) +
                      this.noise2D(x, y-1, seed) + this.noise2D(x, y+1, seed)) / 8;
        const center = this.noise2D(x, y, seed) / 4;
        return corners + sides + center;
    },
    interpolatedNoise(x, y, seed) {
        const intX = Math.floor(x);
        const fracX = x - intX;
        const intY = Math.floor(y);
        const fracY = y - intY;
        const v1 = this.smoothNoise(intX, intY, seed);
        const v2 = this.smoothNoise(intX + 1, intY, seed);
        const v3 = this.smoothNoise(intX, intY + 1, seed);
        const v4 = this.smoothNoise(intX + 1, intY + 1, seed);
        const i1 = this.lerp(v1, v2, fracX);
        const i2 = this.lerp(v3, v4, fracX);
        return this.lerp(i1, i2, fracY);
    },
    perlinNoise(x, y, seed, octaves = 3) {
        let total = 0;
        let frequency = 1;
        let amplitude = 1;
        let maxValue = 0;
        for (let i = 0; i < octaves; i++) {
            total += this.interpolatedNoise(x * frequency, y * frequency, seed + i * 100) * amplitude;
            maxValue += amplitude;
            amplitude *= 0.5;
            frequency *= 2;
        }
        return total / maxValue;
    }
};

class GameMap {
    constructor(width, height, tileSize) {
        this.width = width;
        this.height = height;
        this.tileSize = tileSize;
        this.tiles = [];
        this.seed = Math.random() * 10000;
        this.generate();
    }

    generate() {
        this.tiles = [];
        for (let y = 0; y < this.height; y++) {
            this.tiles[y] = [];
            for (let x = 0; x < this.width; x++) {
                const elevation = Utils.perlinNoise(x * 0.08, y * 0.08, this.seed, 4);
                const moisture = Utils.perlinNoise(x * 0.1 + 50, y * 0.1 + 50, this.seed + 100, 3);
                const temperature = Utils.perlinNoise(x * 0.06 + 200, y * 0.06 + 200, this.seed + 200, 3);
                let terrain;
                if (elevation < 0.35) terrain = TERRAIN_TYPES.OCEAN;
                else if (elevation < 0.42) terrain = TERRAIN_TYPES.BEACH;
                else if (elevation > 0.78) terrain = TERRAIN_TYPES.MOUNTAIN;
                else if (elevation > 0.72 && temperature > 0.55) terrain = TERRAIN_TYPES.VOLCANO;
                else if (moisture > 0.6 && elevation < 0.7) terrain = TERRAIN_TYPES.FOREST;
                else if (temperature > 0.65 && moisture < 0.4) terrain = TERRAIN_TYPES.DESERT;
                else terrain = TERRAIN_TYPES.PLAIN;
                const colorIndex = Utils.randomInt(0, 2);
                this.tiles[y][x] = { terrain, colorIndex, x, y };
            }
        }
        this.ensureLandmass();
    }

    ensureLandmass() {
        const centerX = Math.floor(this.width / 2);
        const centerY = Math.floor(this.height / 2);
        const radius = Math.min(this.width, this.height) * 0.3;
        for (let y = 0; y < this.height; y++) {
            for (let x = 0; x < this.width; x++) {
                const dist = Utils.distance(x, y, centerX, centerY);
                if (dist < radius && this.tiles[y][x].terrain === TERRAIN_TYPES.OCEAN) {
                    this.tiles[y][x].terrain = Math.random() > 0.5 ? TERRAIN_TYPES.PLAIN : TERRAIN_TYPES.BEACH;
                    this.tiles[y][x].colorIndex = Utils.randomInt(0, 2);
                }
            }
        }
    }

    getTile(x, y) {
        if (x < 0 || x >= this.width || y < 0 || y >= this.height) return null;
        return this.tiles[y][x];
    }

    setTerrain(x, y, terrain) {
        const tile = this.getTile(x, y);
        if (tile) {
            tile.terrain = terrain;
            tile.colorIndex = Utils.randomInt(0, 2);
            return true;
        }
        return false;
    }

    isPassable(x, y) {
        const tile = this.getTile(x, y);
        if (!tile) return false;
        return TERRAIN_PASSABLE[tile.terrain];
    }

    getTerrainName(x, y) {
        const tile = this.getTile(x, y);
        if (!tile) return '未知';
        return TERRAIN_NAMES[tile.terrain];
    }

    getNeighbors(x, y) {
        const neighbors = [];
        const directions = [
            { dx: 0, dy: -1 }, { dx: 1, dy: 0 }, { dx: 0, dy: 1 }, { dx: -1, dy: 0 },
            { dx: -1, dy: -1 }, { dx: 1, dy: -1 }, { dx: 1, dy: 1 }, { dx: -1, dy: 1 }
        ];
        for (const dir of directions) {
            const tile = this.getTile(x + dir.dx, y + dir.dy);
            if (tile) neighbors.push(tile);
        }
        return neighbors;
    }

    findNearest(x, y, terrainType, maxDist = 20) {
        for (let dist = 1; dist <= maxDist; dist++) {
            for (let dy = -dist; dy <= dist; dy++) {
                for (let dx = -dist; dx <= dist; dx++) {
                    if (Math.abs(dx) + Math.abs(dy) !== dist) continue;
                    const tile = this.getTile(x + dx, y + dy);
                    if (tile && tile.terrain === terrainType) return { x: x + dx, y: y + dy };
                }
            }
        }
        return null;
    }

    render(ctx) {
        for (let y = 0; y < this.height; y++) {
            for (let x = 0; x < this.width; x++) {
                const tile = this.tiles[y][x];
                const colors = TERRAIN_COLORS[tile.terrain];
                ctx.fillStyle = colors[tile.colorIndex];
                ctx.fillRect(x * this.tileSize, y * this.tileSize, this.tileSize, this.tileSize);
                if (tile.terrain === TERRAIN_TYPES.MOUNTAIN) this.drawMountain(ctx, x, y);
                else if (tile.terrain === TERRAIN_TYPES.VOLCANO) this.drawVolcano(ctx, x, y);
                else if (tile.terrain === TERRAIN_TYPES.FOREST) {
                    if ((x + y) % 3 === 0) this.drawTree(ctx, x, y, '#1b5e20');
                }
            }
        }
    }

    drawMountain(ctx, x, y) {
        const px = x * this.tileSize, py = y * this.tileSize, s = this.tileSize;
        ctx.fillStyle = '#e0e0e0';
        ctx.beginPath();
        ctx.moveTo(px + s * 0.5, py + s * 0.15);
        ctx.lineTo(px + s * 0.8, py + s * 0.6);
        ctx.lineTo(px + s * 0.2, py + s * 0.6);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#fafafa';
        ctx.beginPath();
        ctx.moveTo(px + s * 0.5, py + s * 0.15);
        ctx.lineTo(px + s * 0.65, py + s * 0.4);
        ctx.lineTo(px + s * 0.35, py + s * 0.4);
        ctx.closePath();
        ctx.fill();
    }

    drawVolcano(ctx, x, y) {
        const px = x * this.tileSize, py = y * this.tileSize, s = this.tileSize;
        ctx.fillStyle = '#3e2723';
        ctx.beginPath();
        ctx.moveTo(px + s * 0.5, py + s * 0.1);
        ctx.lineTo(px + s * 0.9, py + s * 0.85);
        ctx.lineTo(px + s * 0.1, py + s * 0.85);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#ff5722';
        ctx.beginPath();
        ctx.moveTo(px + s * 0.5, py + s * 0.1);
        ctx.lineTo(px + s * 0.6, py + s * 0.3);
        ctx.lineTo(px + s * 0.4, py + s * 0.3);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#ffeb3b';
        ctx.beginPath();
        ctx.moveTo(px + s * 0.5, py + s * 0.15);
        ctx.lineTo(px + s * 0.55, py + s * 0.28);
        ctx.lineTo(px + s * 0.45, py + s * 0.28);
        ctx.closePath();
        ctx.fill();
    }

    drawTree(ctx, x, y, color) {
        const px = x * this.tileSize, py = y * this.tileSize, s = this.tileSize;
        ctx.fillStyle = '#5d4037';
        ctx.fillRect(px + s * 0.45, py + s * 0.6, s * 0.1, s * 0.3);
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(px + s * 0.5, py + s * 0.45, s * 0.3, 0, Math.PI * 2);
        ctx.fill();
    }
}

// ==================== 实体系统 ====================
const ENTITY_TYPES = {
    TREE: 'tree', HUMAN: 'human', SHEEP: 'sheep', WOLF: 'wolf', HOUSE: 'house', FARM: 'farm'
};
const ENTITY_NAMES = {
    tree: '树木', human: '人类', sheep: '绵羊', wolf: '野狼', house: '房屋', farm: '农田'
};

class Entity {
    constructor(type, x, y) {
        this.id = Math.random().toString(36).substr(2, 9);
        this.type = type;
        this.x = x;
        this.y = y;
        this.age = 0;
        this.alive = true;
        this.health = 100;
        this.maxHealth = 100;
        this.hunger = 100;
        this.maxHunger = 100;
        this.energy = 100;
        this.actionTimer = 0;
        this.currentAction = 'idle';
        this.targetX = x;
        this.targetY = y;
        this.moveCooldown = 0;
        this.wood = 0;
        this.food = 0;
    }

    update(deltaTime, gameMap, entities) {
        if (!this.alive) return;
        this.age += deltaTime;
        if (this.type === ENTITY_TYPES.TREE) this.updateTree(deltaTime, entities);
        else if (this.type === ENTITY_TYPES.HUMAN) this.updateHuman(deltaTime, gameMap, entities);
        else if (this.type === ENTITY_TYPES.SHEEP) this.updateSheep(deltaTime, gameMap, entities);
        else if (this.type === ENTITY_TYPES.WOLF) this.updateWolf(deltaTime, gameMap, entities);
    }

    updateTree(deltaTime, entities) {
        if (this.age > 30 && Math.random() < 0.001) {
            this.health -= 1;
            if (this.health <= 0) this.alive = false;
        }
    }

    updateHuman(deltaTime, gameMap, entities) {
        this.hunger -= deltaTime * 0.5;
        if (this.hunger <= 0) {
            this.health -= deltaTime * 2;
            if (this.health <= 0) { this.alive = false; return; }
        }
        this.actionTimer -= deltaTime;
        if (this.moveCooldown > 0) this.moveCooldown -= deltaTime;
        if (this.actionTimer <= 0) {
            this.decideAction(gameMap, entities);
            this.actionTimer = Utils.randomFloat(1, 3);
        }
        this.executeAction(deltaTime, gameMap, entities);
    }

    decideAction(gameMap, entities) {
        if (this.hunger < 40) {
            const food = this.findNearbyFood(entities);
            if (food) { this.currentAction = 'seek_food'; this.targetX = food.x; this.targetY = food.y; return; }
        }
        if (this.wood < 5) {
            const tree = this.findNearbyTree(entities);
            if (tree) { this.currentAction = 'chop_tree'; this.targetX = tree.x; this.targetY = tree.y; return; }
        }
        const house = this.findNearbyHouse(entities);
        if (!house && this.wood >= 10) { this.currentAction = 'build_house'; return; }
        if (Math.random() < 0.3) {
            this.currentAction = 'wander';
            const dir = Utils.randomChoice([{ dx: 0, dy: -1 }, { dx: 1, dy: 0 }, { dx: 0, dy: 1 }, { dx: -1, dy: 0 }]);
            this.targetX = this.x + dir.dx * Utils.randomInt(1, 3);
            this.targetY = this.y + dir.dy * Utils.randomInt(1, 3);
        } else {
            this.currentAction = 'idle';
        }
    }

    executeAction(deltaTime, gameMap, entities) {
        switch (this.currentAction) {
            case 'wander': case 'seek_food': case 'chop_tree':
                this.moveToward(deltaTime, gameMap, this.targetX, this.targetY, entities); break;
            case 'build_house': this.buildHouse(entities); break;
        }
    }

    moveToward(deltaTime, gameMap, targetX, targetY, entities) {
        if (this.moveCooldown > 0) return;
        if (this.x === targetX && this.y === targetY) return;
        const dx = Math.sign(targetX - this.x);
        const dy = Math.sign(targetY - this.y);
        let moved = false;
        if (Math.abs(targetX - this.x) > Math.abs(targetY - this.y)) {
            if (this.canMoveTo(gameMap, this.x + dx, this.y)) { this.x += dx; moved = true; }
            else if (this.canMoveTo(gameMap, this.x, this.y + dy)) { this.y += dy; moved = true; }
        } else {
            if (this.canMoveTo(gameMap, this.x, this.y + dy)) { this.y += dy; moved = true; }
            else if (this.canMoveTo(gameMap, this.x + dx, this.y)) { this.x += dx; moved = true; }
        }
        if (moved) { this.moveCooldown = 0.3; this.energy -= 0.5; }
        this.checkInteractions(entities);
    }

    canMoveTo(gameMap, x, y) { return gameMap.isPassable(x, y); }

    checkInteractions(entities) {
        for (const entity of entities) {
            if (!entity.alive || entity === this) continue;
            if (entity.x === this.x && entity.y === this.y) {
                if (this.currentAction === 'chop_tree' && entity.type === ENTITY_TYPES.TREE) {
                    entity.health -= 20; this.wood += 5;
                    if (entity.health <= 0) { entity.alive = false; this.wood += 10; }
                }
                if (this.currentAction === 'seek_food' && entity.type === ENTITY_TYPES.SHEEP) {
                    entity.health -= 50; this.hunger = Math.min(this.maxHunger, this.hunger + 40); this.food += 10;
                    if (entity.health <= 0) { entity.alive = false; this.hunger = Math.min(this.maxHunger, this.hunger + 60); }
                }
            }
        }
    }

    findNearbyTree(entities) {
        let nearest = null, minDist = Infinity;
        for (const e of entities) {
            if (e.type === ENTITY_TYPES.TREE && e.alive) {
                const dist = Utils.manhattanDistance(this.x, this.y, e.x, e.y);
                if (dist < minDist && dist < 15) { minDist = dist; nearest = e; }
            }
        }
        return nearest;
    }

    findNearbyFood(entities) {
        let nearest = null, minDist = Infinity;
        for (const e of entities) {
            if (e.type === ENTITY_TYPES.SHEEP && e.alive) {
                const dist = Utils.manhattanDistance(this.x, this.y, e.x, e.y);
                if (dist < minDist && dist < 12) { minDist = dist; nearest = e; }
            }
        }
        return nearest;
    }

    findNearbyHouse(entities) {
        for (const e of entities) {
            if (e.type === ENTITY_TYPES.HOUSE && e.alive) {
                if (Utils.manhattanDistance(this.x, this.y, e.x, e.y) < 5) return e;
            }
        }
        return null;
    }

    buildHouse(entities) {
        if (this.wood >= 10) {
            const house = new Entity(ENTITY_TYPES.HOUSE, this.x, this.y);
            entities.push(house);
            this.wood -= 10;
            this.currentAction = 'idle';
            return true;
        }
        return false;
    }

    updateSheep(deltaTime, gameMap, entities) {
        this.hunger -= deltaTime * 0.3;
        if (this.hunger <= 0) {
            this.health -= deltaTime * 1;
            if (this.health <= 0) { this.alive = false; return; }
        }
        this.actionTimer -= deltaTime;
        if (this.moveCooldown > 0) this.moveCooldown -= deltaTime;
        const wolf = this.findNearbyWolf(entities);
        if (wolf && this.actionTimer <= 0) { this.runAway(wolf); this.actionTimer = 0.5; }
        else if (this.actionTimer <= 0) {
            if (Math.random() < 0.4) {
                const dir = Utils.randomChoice([{ dx: 0, dy: -1 }, { dx: 1, dy: 0 }, { dx: 0, dy: 1 }, { dx: -1, dy: 0 }]);
                this.targetX = this.x + dir.dx; this.targetY = this.y + dir.dy;
            }
            this.actionTimer = Utils.randomFloat(1, 3);
        }
        if (this.moveCooldown <= 0 && (this.targetX !== this.x || this.targetY !== this.y)) this.moveStep(gameMap);
        const tile = gameMap.getTile(this.x, this.y);
        if (tile && (tile.terrain === 'plain' || tile.terrain === 'forest')) this.hunger = Math.min(this.maxHunger, this.hunger + deltaTime * 0.2);
        if (this.age > 30 && Math.random() < 0.001) { this.health -= 0.5; if (this.health <= 0) this.alive = false; }
    }

    findNearbyWolf(entities) {
        for (const e of entities) {
            if (e.type === ENTITY_TYPES.WOLF && e.alive) {
                if (Utils.manhattanDistance(this.x, this.y, e.x, e.y) < 6) return e;
            }
        }
        return null;
    }

    runAway(predator) {
        const dx = this.x - predator.x, dy = this.y - predator.y;
        if (Math.abs(dx) > Math.abs(dy)) { this.targetX = this.x + Math.sign(dx); this.targetY = this.y; }
        else { this.targetX = this.x; this.targetY = this.y + Math.sign(dy); }
    }

    moveStep(gameMap) {
        const dx = Math.sign(this.targetX - this.x), dy = Math.sign(this.targetY - this.y);
        if (dx !== 0 && gameMap.isPassable(this.x + dx, this.y)) { this.x += dx; this.moveCooldown = 0.4; }
        else if (dy !== 0 && gameMap.isPassable(this.x, this.y + dy)) { this.y += dy; this.moveCooldown = 0.4; }
    }

    updateWolf(deltaTime, gameMap, entities) {
        this.hunger -= deltaTime * 0.4;
        if (this.hunger <= 0) {
            this.health -= deltaTime * 1.5;
            if (this.health <= 0) { this.alive = false; return; }
        }
        this.actionTimer -= deltaTime;
        if (this.moveCooldown > 0) this.moveCooldown -= deltaTime;
        if (this.actionTimer <= 0) {
            const prey = this.findNearbyPrey(entities);
            if (prey) { this.targetX = prey.x; this.targetY = prey.y; this.currentAction = 'hunt'; }
            else {
                const dir = Utils.randomChoice([{ dx: 0, dy: -1 }, { dx: 1, dy: 0 }, { dx: 0, dy: 1 }, { dx: -1, dy: 0 }]);
                this.targetX = this.x + dir.dx * Utils.randomInt(1, 3);
                this.targetY = this.y + dir.dy * Utils.randomInt(1, 3);
                this.currentAction = 'wander';
            }
            this.actionTimer = Utils.randomFloat(1, 2);
        }
        if (this.moveCooldown <= 0 && (this.targetX !== this.x || this.targetY !== this.y)) this.moveStep(gameMap);
        for (const entity of entities) {
            if (!entity.alive || entity === this) continue;
            if (entity.x === this.x && entity.y === this.y) {
                if (entity.type === ENTITY_TYPES.SHEEP) {
                    entity.health -= 30; this.hunger = Math.min(this.maxHunger, this.hunger + 30);
                    if (entity.health <= 0) { entity.alive = false; this.hunger = Math.min(this.maxHunger, this.hunger + 50); }
                }
            }
        }
    }

    findNearbyPrey(entities) {
        let nearest = null, minDist = Infinity;
        for (const e of entities) {
            if (e.type === ENTITY_TYPES.SHEEP && e.alive) {
                const dist = Utils.manhattanDistance(this.x, this.y, e.x, e.y);
                if (dist < minDist && dist < 12) { minDist = dist; nearest = e; }
            }
        }
        return nearest;
    }

    render(ctx, tileSize) {
        if (!this.alive) return;
        const px = this.x * tileSize, py = this.y * tileSize, s = tileSize;
        switch (this.type) {
            case ENTITY_TYPES.TREE: this.drawTree(ctx, px, py, s); break;
            case ENTITY_TYPES.HUMAN: this.drawHuman(ctx, px, py, s); break;
            case ENTITY_TYPES.SHEEP: this.drawSheep(ctx, px, py, s); break;
            case ENTITY_TYPES.WOLF: this.drawWolf(ctx, px, py, s); break;
            case ENTITY_TYPES.HOUSE: this.drawHouse(ctx, px, py, s); break;
            case ENTITY_TYPES.FARM: this.drawFarm(ctx, px, py, s); break;
        }
    }

    drawTree(ctx, px, py, s) {
        ctx.fillStyle = '#5d4037';
        ctx.fillRect(px + s * 0.42, py + s * 0.55, s * 0.16, s * 0.4);
        ctx.fillStyle = '#2e7d32';
        ctx.beginPath(); ctx.arc(px + s * 0.5, py + s * 0.4, s * 0.35, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#388e3c';
        ctx.beginPath(); ctx.arc(px + s * 0.5, py + s * 0.3, s * 0.28, 0, Math.PI * 2); ctx.fill();
    }

    drawHuman(ctx, px, py, s) {
        ctx.fillStyle = '#ffccbc';
        ctx.beginPath(); ctx.arc(px + s * 0.5, py + s * 0.25, s * 0.15, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#3949ab';
        ctx.fillRect(px + s * 0.35, py + s * 0.4, s * 0.3, s * 0.35);
        ctx.fillStyle = '#5d4037';
        ctx.fillRect(px + s * 0.37, py + s * 0.75, s * 0.1, s * 0.2);
        ctx.fillRect(px + s * 0.53, py + s * 0.75, s * 0.1, s * 0.2);
    }

    drawSheep(ctx, px, py, s) {
        ctx.fillStyle = '#fafafa';
        ctx.beginPath(); ctx.ellipse(px + s * 0.5, py + s * 0.55, s * 0.3, s * 0.25, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#f5f5f5';
        for (let i = 0; i < 5; i++) {
            const angle = (i / 5) * Math.PI * 2;
            ctx.beginPath();
            ctx.arc(px + s * 0.5 + Math.cos(angle) * s * 0.2, py + s * 0.55 + Math.sin(angle) * s * 0.15, s * 0.1, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.fillStyle = '#3e2723';
        ctx.fillRect(px + s * 0.7, py + s * 0.45, s * 0.15, s * 0.12);
        ctx.fillStyle = '#212121';
        ctx.beginPath(); ctx.arc(px + s * 0.75, py + s * 0.5, s * 0.03, 0, Math.PI * 2); ctx.fill();
    }

    drawWolf(ctx, px, py, s) {
        ctx.fillStyle = '#424242';
        ctx.beginPath(); ctx.ellipse(px + s * 0.5, py + s * 0.6, s * 0.32, s * 0.22, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#616161';
        ctx.fillRect(px + s * 0.65, py + s * 0.4, s * 0.2, s * 0.25);
        ctx.fillStyle = '#424242';
        ctx.beginPath(); ctx.moveTo(px + s * 0.68, py + s * 0.4); ctx.lineTo(px + s * 0.7, py + s * 0.28); ctx.lineTo(px + s * 0.75, py + s * 0.4); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(px + s * 0.78, py + s * 0.4); ctx.lineTo(px + s * 0.8, py + s * 0.3); ctx.lineTo(px + s * 0.85, py + s * 0.42); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#ff5722';
        ctx.beginPath(); ctx.arc(px + s * 0.75, py + s * 0.5, s * 0.04, 0, Math.PI * 2); ctx.fill();
    }

    drawHouse(ctx, px, py, s) {
        ctx.fillStyle = '#8d6e63';
        ctx.fillRect(px + s * 0.15, py + s * 0.4, s * 0.7, s * 0.55);
        ctx.fillStyle = '#bf360c';
        ctx.beginPath(); ctx.moveTo(px + s * 0.1, py + s * 0.42); ctx.lineTo(px + s * 0.5, py + s * 0.1); ctx.lineTo(px + s * 0.9, py + s * 0.42); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#4e342e';
        ctx.fillRect(px + s * 0.4, py + s * 0.6, s * 0.2, s * 0.35);
        ctx.fillStyle = '#81d4fa';
        ctx.fillRect(px + s * 0.2, py + s * 0.5, s * 0.15, s * 0.15);
        ctx.fillRect(px + s * 0.65, py + s * 0.5, s * 0.15, s * 0.15);
    }

    drawFarm(ctx, px, py, s) {
        ctx.fillStyle = '#ffd54f';
        ctx.fillRect(px + s * 0.1, py + s * 0.1, s * 0.8, s * 0.8);
        ctx.fillStyle = '#8bc34a';
        for (let i = 0; i < 4; i++) ctx.fillRect(px + s * (0.15 + i * 0.2), py + s * 0.2, s * 0.1, s * 0.6);
    }
}

// ==================== AI系统 ====================
class AISystem {
    constructor() {
        this.tickTimer = 0;
        this.reproductionTimer = 0;
        this.civilizationLevel = 0;
    }

    update(deltaTime, gameMap, entities, narrative) {
        this.tickTimer += deltaTime;
        this.reproductionTimer += deltaTime;
        if (this.tickTimer >= 0.5) { this.tickTimer = 0; this.updateEntities(deltaTime, gameMap, entities); }
        if (this.reproductionTimer >= 5) { this.reproductionTimer = 0; this.checkReproduction(entities, gameMap, narrative); }
        this.updateCivilizationLevel(entities, narrative);
    }

    updateEntities(deltaTime, gameMap, entities) {
        for (const entity of entities) entity.update(deltaTime, gameMap, entities);
        for (let i = entities.length - 1; i >= 0; i--) if (!entities[i].alive) entities.splice(i, 1);
    }

    checkReproduction(entities, gameMap, narrative) {
        const humans = entities.filter(e => e.type === ENTITY_TYPES.HUMAN && e.alive);
        const sheep = entities.filter(e => e.type === ENTITY_TYPES.SHEEP && e.alive);
        const wolves = entities.filter(e => e.type === ENTITY_TYPES.WOLF && e.alive);
        const trees = entities.filter(e => e.type === ENTITY_TYPES.TREE && e.alive);

        if (humans.length >= 2 && humans.length < 30) {
            const houses = entities.filter(e => e.type === ENTITY_TYPES.HOUSE && e.alive);
            if (Math.random() < (houses.length > 0 ? 0.4 : 0.2)) {
                const parent = Utils.randomChoice(humans);
                const sx = parent.x + Utils.randomInt(-1, 1), sy = parent.y + Utils.randomInt(-1, 1);
                if (gameMap.isPassable(sx, sy)) {
                    const baby = new Entity(ENTITY_TYPES.HUMAN, sx, sy);
                    baby.health = 50; baby.age = 0; entities.push(baby);
                    if (Math.random() < 0.5) narrative.addEvent('人口增长', `一个新的生命诞生了！部落人口达到 ${humans.length + 1} 人。`, 'important');
                }
            }
        }
        if (sheep.length >= 2 && sheep.length < 20) {
            if (Math.random() < 0.3) {
                const parent = Utils.randomChoice(sheep);
                const sx = parent.x + Utils.randomInt(-1, 1), sy = parent.y + Utils.randomInt(-1, 1);
                if (gameMap.isPassable(sx, sy)) { const baby = new Entity(ENTITY_TYPES.SHEEP, sx, sy); baby.health = 60; entities.push(baby); }
            }
        }
        if (wolves.length >= 2 && wolves.length < 8) {
            if (Math.random() < 0.2 && sheep.length > wolves.length * 2) {
                const parent = Utils.randomChoice(wolves);
                const sx = parent.x + Utils.randomInt(-1, 1), sy = parent.y + Utils.randomInt(-1, 1);
                if (gameMap.isPassable(sx, sy)) { const baby = new Entity(ENTITY_TYPES.WOLF, sx, sy); baby.health = 50; entities.push(baby); }
            }
        }
        if (trees.length > 0 && trees.length < 50) {
            if (Math.random() < 0.3) {
                const tree = Utils.randomChoice(trees);
                const sx = tree.x + Utils.randomInt(-2, 2), sy = tree.y + Utils.randomInt(-2, 2);
                const tile = gameMap.getTile(sx, sy);
                if (tile && (tile.terrain === 'plain' || tile.terrain === 'forest')) {
                    const has = entities.some(e => e.type === ENTITY_TYPES.TREE && e.alive && e.x === sx && e.y === sy);
                    if (!has && tree.age > 20) { const sapling = new Entity(ENTITY_TYPES.TREE, sx, sy); sapling.health = 30; entities.push(sapling); }
                }
            }
        }
    }

    updateCivilizationLevel(entities, narrative) {
        const humans = entities.filter(e => e.type === ENTITY_TYPES.HUMAN && e.alive);
        const houses = entities.filter(e => e.type === ENTITY_TYPES.HOUSE && e.alive);
        let newLevel = 0;
        if (humans.length >= 3) newLevel = 1;
        if (humans.length >= 5 && houses.length >= 1) newLevel = 2;
        if (humans.length >= 10 && houses.length >= 3) newLevel = 3;
        if (humans.length >= 15 && houses.length >= 5) newLevel = 4;
        if (humans.length >= 25 && houses.length >= 8) newLevel = 5;
        if (newLevel > this.civilizationLevel) {
            this.civilizationLevel = newLevel;
            narrative.addEvent('文明进步！', `文明等级提升至「${this.getCivLevelName()}」！${this.getCivLevelDescription()}`, 'important');
        }
    }

    getCivLevelName() {
        return ['原始部落', '狩猎采集', '原始农业', '早期村落', '农耕文明', '城邦时代'][Math.min(this.civilizationLevel, 5)];
    }

    getCivLevelDescription() {
        return ['', '人类开始结群而居，形成了最初的部落。', '他们学会了搭建简易的住所，生活逐渐稳定。', '村落初具规模，分工开始出现。', '农业发展，人口迅速增长，文明的雏形显现。', '城邦崛起，复杂的社会结构已经形成！'][Math.min(this.civilizationLevel, 5)];
    }

    getStats(entities) {
        return {
            humans: entities.filter(e => e.type === ENTITY_TYPES.HUMAN && e.alive).length,
            sheep: entities.filter(e => e.type === ENTITY_TYPES.SHEEP && e.alive).length,
            wolves: entities.filter(e => e.type === ENTITY_TYPES.WOLF && e.alive).length,
            trees: entities.filter(e => e.type === ENTITY_TYPES.TREE && e.alive).length,
            houses: entities.filter(e => e.type === ENTITY_TYPES.HOUSE && e.alive).length
        };
    }
}

// ==================== 叙事系统 ====================
class NarrativeSystem {
    constructor() { this.events = []; this.eventTimer = 0; this.gameTime = 0; }

    update(deltaTime, entities, gameMap, aiSystem) {
        this.gameTime += deltaTime;
        this.eventTimer += deltaTime;
        if (this.eventTimer >= 8) { this.eventTimer = 0; this.generateRandomEvent(entities, gameMap, aiSystem); }
    }

    addEvent(title, content, type = 'normal') {
        const event = { id: Date.now() + Math.random(), title, content, time: this.formatGameTime(), type };
        this.events.unshift(event);
        if (this.events.length > 50) this.events.pop();
        this.renderEvent(event);
    }

    formatGameTime() { return `第 ${Math.floor(this.gameTime / 10) + 1} 年`; }

    generateRandomEvent(entities, gameMap, aiSystem) {
        const stats = aiSystem.getStats(entities);
        const year = Math.floor(this.gameTime / 10) + 1;
        const eventPool = [];

        if (stats.humans > 0) {
            eventPool.push(() => {
                const names = ['阿尔法', '贝塔', '伽马', '德尔塔', '奥米伽', '西格玛'];
                const name = Utils.randomChoice(names);
                const actions = [`${name} 在河边发现了一块光滑的石头，若有所思...`, `${name} 第一次尝试用两根树枝摩擦生火。`, `${name} 在岩壁上画下了今天狩猎的场景。`, `${name} 仰望星空，对宇宙产生了疑问。`, `${name} 把种子埋进土里，期待着奇迹发生。`];
                this.addEvent('人类活动', Utils.randomChoice(actions));
            });
            eventPool.push(() => {
                const events = ['部落里传来欢声笑语，大家围坐在一起分享食物。', '老人向孩子们讲述着祖先的故事。', '一群人结伴去森林里探险。', '人们在用兽皮和骨头制作工具。'];
                this.addEvent('部落日常', Utils.randomChoice(events));
            });
        }
        if (stats.humans >= 5) eventPool.push(() => this.addEvent('文化萌芽', '部落里似乎形成了某种仪式和习俗...', 'important'));
        if (stats.houses > 0) eventPool.push(() => {
            const events = ['人们在房屋周围开垦土地，尝试种植作物。', '村落里炊烟袅袅，一派祥和景象。', '工匠们正在打磨石器，制作更精良的工具。'];
            this.addEvent('村落发展', Utils.randomChoice(events));
        });
        if (stats.sheep > 0) eventPool.push(() => {
            const events = ['一群绵羊在草地上悠闲地吃草。', '新生的小羊羔咩咩叫着，跟在母亲身后。', '绵羊们聚集在一起，抵御夜晚的寒冷。'];
            this.addEvent('自然生机', Utils.randomChoice(events));
        });
        if (stats.wolves > 0) eventPool.push(() => {
            if (stats.sheep > 0) this.addEvent('自然法则', '狼群在远处徘徊，它们盯上了羊群...');
            else this.addEvent('荒野之声', '远处传来狼嚎，回荡在山谷间。');
        });
        if (stats.trees > 0 && stats.humans > 0) eventPool.push(() => {
            const events = ['树木被砍伐，空地逐渐扩大。', '倒下的树木被拖回村落，用于建造房屋。', '人类学会了使用木材，生活变得更加便利。'];
            this.addEvent('资源采集', Utils.randomChoice(events));
        });
        if (year === 5) eventPool.push(() => this.addEvent('时代变迁', '五年过去了，这片土地发生了翻天覆地的变化。', 'important'));
        if (year === 10) eventPool.push(() => this.addEvent('十年之约', '第一个十年到来，文明的根基已经奠定。', 'important'));

        if (eventPool.length > 0) Utils.randomChoice(eventPool)();
    }

    renderEvent(event) {
        const list = document.getElementById('narrative-list');
        if (!list) return;
        const eventEl = document.createElement('div');
        eventEl.className = `narrative-event ${event.type === 'important' ? 'important' : ''}`;
        eventEl.innerHTML = `<div class="event-time">${event.time}</div><div class="event-content"><strong>${event.title}</strong><br>${event.content}</div>`;
        list.insertBefore(eventEl, list.firstChild);
        while (list.children.length > 30) list.removeChild(list.lastChild);
    }

    getSummary(entities, aiSystem) {
        const stats = aiSystem.getStats(entities);
        const year = Math.floor(this.gameTime / 10) + 1;
        let story;
        if (stats.humans === 0) story = `在这片土地上，人类文明如昙花一现，最终消逝在历史的长河中。也许下一次，造物主将带来不同的命运...`;
        else if (stats.humans < 5) story = `经过 ${year} 年的发展，一小群人类在这片土地上艰难地生存着。他们的未来充满不确定性，但生命的火种已经点燃。`;
        else if (stats.humans < 15) story = `${year} 年过去了，人类部落逐渐壮大。他们学会了建造房屋、合作狩猎，文明的曙光初现。这片土地因他们的存在而充满生机。`;
        else story = `伟大的文明在这片土地上崛起！经过 ${year} 年的发展，人类已经建立了繁荣的村落，人口达到 ${stats.humans} 人，建造了 ${stats.houses} 座房屋。他们的故事将被后人传颂...`;
        return { stats, year, story, civLevel: aiSystem.getCivLevelName() };
    }
}


// ==================== 成就系统 ====================
class AchievementSystem {
    constructor(game) {
        this.game = game;
        this.definitions = [
            { id: 'first_touch', icon: 'spark', title: '创世第一笔', desc: '第一次在大陆上放置任意元素。', check: g => g.totalPlacements >= 1 },
            { id: 'green_cradle', icon: 'forest', title: '绿色摇篮', desc: '放置至少 8 棵树木或森林，让大陆有稳定生态。', check: g => g.placementStats.tree + g.placementStats.forest >= 8 },
            { id: 'first_people', icon: 'human', title: '人类火种', desc: '让至少 3 名人类生活在大陆上。', check: g => g.aiSystem.getStats(g.entities).humans >= 3 },
            { id: 'balance_keeper', icon: 'balance', title: '生态平衡者', desc: '同时拥有树木、绵羊、野狼和人类。', check: g => {
                const s = g.aiSystem.getStats(g.entities);
                return s.trees > 0 && s.sheep > 0 && s.wolves > 0 && s.humans > 0;
            }},
            { id: 'home_builder', icon: 'house', title: '第一座家园', desc: '文明自动建造出第一座房屋。', check: g => g.aiSystem.getStats(g.entities).houses >= 1 },
            { id: 'village_age', icon: 'village', title: '村落时代', desc: '文明等级达到“早期村落”或更高。', check: g => g.aiSystem.civilizationLevel >= 3 },
            { id: 'element_master', icon: 'compass', title: '元素调律师', desc: '至少使用过 6 种不同创造工具。', check: g => Object.values(g.placementStats).filter(v => v > 0).length >= 6 },
            { id: 'ten_year_witness', icon: 'scroll', title: '十年见证者', desc: '坚持见证大陆演化到第 10 年。', check: g => g.narrative.gameTime >= 90 }
        ];
        this.unlocked = new Set();
        this.toastTimer = null;
        this.renderPanel();
        this.updateUI();
    }

    checkAll() {
        for (const achievement of this.definitions) {
            if (!this.unlocked.has(achievement.id) && achievement.check(this.game)) {
                this.unlock(achievement);
            }
        }
        this.updateUI();
    }

    unlock(achievement) {
        this.unlocked.add(achievement.id);
        this.game.narrative.addEvent('成就解锁', `「${achievement.title}」：${achievement.desc}`, 'important');
        this.showToast(achievement);
    }

    showToast(achievement) {
        const toast = document.getElementById('achievement-toast');
        const name = document.getElementById('achievement-toast-name');
        if (!toast || !name) return;
        toast.querySelector('.achievement-icon').innerHTML = iconMarkup(achievement.icon);
        name.textContent = achievement.title;
        toast.classList.add('show');
        clearTimeout(this.toastTimer);
        this.toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
    }

    renderPanel() {
        const grid = document.getElementById('achievement-grid');
        if (!grid) return;
        grid.innerHTML = this.definitions.map(a => `
            <div class="achievement-card" data-achievement-id="${a.id}">
                <div class="achievement-icon">${iconMarkup(a.icon)}</div>
                <div>
                    <div class="achievement-title">${a.title}</div>
                    <div class="achievement-desc">${a.desc}</div>
                </div>
            </div>
        `).join('');
    }

    updateUI() {
        const total = this.definitions.length;
        const current = this.unlocked.size;
        const count = document.getElementById('achievement-count');
        const progress = document.getElementById('achievement-progress');
        if (count) count.textContent = `${current}/${total}`;
        if (progress) progress.textContent = `${current} / ${total}`;
        document.querySelectorAll('.achievement-card').forEach(card => {
            card.classList.toggle('unlocked', this.unlocked.has(card.dataset.achievementId));
        });
    }

    reset() {
        this.unlocked.clear();
        this.renderPanel();
        this.updateUI();
    }
}

// ==================== UI系统 ====================
class UISystem {
    constructor(game) {
        this.game = game;
        this.selectedTool = null;
        this.hoveredTile = null;
        this.init();
    }

    init() {
        this.setupDragAndDrop();
        this.setupCanvasEvents();
        this.setupAIControls();
        this.setupButtons();
        this.updateResourceCounts();
    }

    setupDragAndDrop() {
        document.querySelectorAll('.tool-item').forEach(item => {
            item.addEventListener('dragstart', (e) => {
                const type = item.dataset.type;
                const count = this.game.resources[type] || 0;
                if (count <= 0) { e.preventDefault(); return; }
                window.__currentDragType = type;
                item.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', type);
            });

            item.addEventListener('dragend', () => {
                item.classList.remove('dragging');
                window.__currentDragType = null;
            });

            item.addEventListener('click', (e) => {
                e.stopPropagation();
                const type = item.dataset.type;
                if ((this.game.resources[type] || 0) <= 0) return;
                if (this.selectedTool === type) { this.selectedTool = null; item.classList.remove('selected'); }
                else {
                    document.querySelectorAll('.tool-item').forEach(i => i.classList.remove('selected'));
                    this.selectedTool = type;
                    item.classList.add('selected');
                }
            });
        });
    }

    setupCanvasEvents() {
        const canvas = document.getElementById('game-canvas');
        const hoverInfo = document.getElementById('hover-info');

        canvas.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });

        canvas.addEventListener('drop', (e) => {
            e.preventDefault();
            const droppedType = window.__currentDragType || e.dataTransfer.getData('text/plain');
            if (!droppedType) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
            const x = Math.floor((e.clientX - rect.left) * scaleX / this.game.tileSize);
            const y = Math.floor((e.clientY - rect.top) * scaleY / this.game.tileSize);
            this.game.placeEntity(droppedType, x, y);
            window.__currentDragType = null;
            this.updateResourceCounts();
        });

        canvas.addEventListener('click', (e) => {
            if (!this.selectedTool) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
            const x = Math.floor((e.clientX - rect.left) * scaleX / this.game.tileSize);
            const y = Math.floor((e.clientY - rect.top) * scaleY / this.game.tileSize);
            this.game.placeEntity(this.selectedTool, x, y);
            this.updateResourceCounts();
            if ((this.game.resources[this.selectedTool] || 0) <= 0) {
                this.selectedTool = null;
                document.querySelectorAll('.tool-item').forEach(i => i.classList.remove('selected'));
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
            const x = Math.floor((e.clientX - rect.left) * scaleX / this.game.tileSize);
            const y = Math.floor((e.clientY - rect.top) * scaleY / this.game.tileSize);
            if (x >= 0 && x < this.game.map.width && y >= 0 && y < this.game.map.height) {
                this.hoveredTile = { x, y };
                const terrainName = this.game.map.getTerrainName(x, y);
                let entityInfo = '';
                const entitiesHere = this.game.entities.filter(e2 => e2.alive && e2.x === x && e2.y === y);
                if (entitiesHere.length > 0) entityInfo = entitiesHere.map(e2 => ENTITY_NAMES[e2.type] || e2.type).join('、');
                hoverInfo.innerHTML = `<div><strong>地形：</strong>${terrainName}</div><div><strong>坐标：</strong>(${x}, ${y})</div>${entityInfo ? `<div><strong>生物：</strong>${entityInfo}</div>` : ''}`;
                hoverInfo.style.left = (e.clientX - rect.left + 15) + 'px';
                hoverInfo.style.top = (e.clientY - rect.top + 15) + 'px';
                hoverInfo.classList.remove('hidden');
            } else { this.hoveredTile = null; hoverInfo.classList.add('hidden'); }
        });

        canvas.addEventListener('mouseleave', () => { this.hoveredTile = null; hoverInfo.classList.add('hidden'); });
    }

    setupAIControls() {
        const input = document.getElementById('ai-prompt');
        const runBtn = document.getElementById('ai-run-btn');
        const status = document.getElementById('ai-status');
        if (!input || !runBtn || !status) return;

        document.querySelectorAll('.ai-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                input.value = chip.dataset.aiPrompt || '';
                this.runAICustomization();
            });
        });

        runBtn.addEventListener('click', () => this.runAICustomization());
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) this.runAICustomization();
        });
    }

    runAICustomization() {
        const input = document.getElementById('ai-prompt');
        const status = document.getElementById('ai-status');
        const prompt = (input.value || '').trim();
        const result = this.game.applyAICustomization(prompt);
        status.textContent = result.message;
        if (result.success) {
            input.value = '';
            this.updateResourceCounts();
            const stats = this.game.aiSystem.getStats(this.game.entities);
            this.updateStats(stats, Math.ceil(this.game.timeLeft), this.game.aiSystem.getCivLevelName());
        }
    }

    setupButtons() {
        document.getElementById('achievement-btn').addEventListener('click', () => {
            document.getElementById('achievement-modal').classList.remove('hidden');
            this.game.achievements.updateUI();
        });
        document.getElementById('close-achievement-btn').addEventListener('click', () => {
            document.getElementById('achievement-modal').classList.add('hidden');
        });
        document.getElementById('achievement-modal').addEventListener('click', (e) => {
            if (e.target.id === 'achievement-modal') e.target.classList.add('hidden');
        });
        document.getElementById('restart-btn').addEventListener('click', () => {
            if (confirm('确定要重新开始吗？当前进度将丢失。')) this.game.restart();
        });
        document.getElementById('play-again-btn').addEventListener('click', () => {
            document.getElementById('game-over-modal').classList.add('hidden');
            this.game.restart();
        });
    }

    updateResourceCounts() {
        for (const type in this.game.resources) {
            const countEl = document.getElementById(`count-${type}`);
            const itemEl = document.querySelector(`.tool-item[data-type="${type}"]`);
            if (countEl) countEl.textContent = this.game.resources[type];
            if (itemEl) {
                if (this.game.resources[type] <= 0) itemEl.classList.add('disabled');
                else itemEl.classList.remove('disabled');
            }
        }
    }

    updateStats(stats, timeLeft, civLevelName) {
        document.getElementById('timer').textContent = Utils.formatTime(timeLeft);
        document.getElementById('population').textContent = stats.humans;
        document.getElementById('buildings').textContent = stats.houses;
        document.getElementById('civ-level').textContent = civLevelName;
    }

    showGameOver(summary) {
        document.getElementById('final-stats').innerHTML = `
            <div class="final-stat-item"><div class="final-stat-label">文明等级</div><div class="final-stat-value">${summary.civLevel}</div></div>
            <div class="final-stat-item"><div class="final-stat-label">存续时间</div><div class="final-stat-value">${summary.year} 年</div></div>
            <div class="final-stat-item"><div class="final-stat-label">人类人口</div><div class="final-stat-value">${summary.stats.humans}</div></div>
            <div class="final-stat-item"><div class="final-stat-label">建筑数量</div><div class="final-stat-value">${summary.stats.houses}</div></div>
            <div class="final-stat-item"><div class="final-stat-label">绵羊</div><div class="final-stat-value">${summary.stats.sheep}</div></div>
            <div class="final-stat-item"><div class="final-stat-label">野狼</div><div class="final-stat-value">${summary.stats.wolves}</div></div>`;
        document.getElementById('final-story').textContent = summary.story;
        document.getElementById('game-over-modal').classList.remove('hidden');
    }

    reset() {
        document.getElementById('narrative-list').innerHTML = `<div class="narrative-event start-event"><div class="event-time">创世之初</div><div class="event-content">世界一片混沌，等待造物主的降临...</div></div>`;
        this.updateResourceCounts();
    }
}

// ==================== 游戏主类 ====================
class Game {
    constructor() {
        this.canvas = null; this.ctx = null; this.map = null;
        this.entities = []; this.aiSystem = null; this.narrative = null; this.ui = null; this.achievements = null;
        this.mapWidth = 18; this.mapHeight = 12; this.tileSize = 34;
        this.gameTime = 600; this.timeLeft = 600; this.gameOver = false;
        this.lastTime = 0; this.running = false;
        this.resources = { tree: 30, human: 15, sheep: 20, wolf: 8, mountain: 12, forest: 10, water: 10, volcano: 5 };
        this.placementStats = { tree: 0, human: 0, sheep: 0, wolf: 0, mountain: 0, forest: 0, water: 0, volcano: 0 };
        this.totalPlacements = 0;
        this.worldVariables = [];
        this.init();
    }

    init() {
        this.canvas = document.getElementById('game-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.canvas.width = this.mapWidth * this.tileSize;
        this.canvas.height = this.mapHeight * this.tileSize;
        this.map = new GameMap(this.mapWidth, this.mapHeight, this.tileSize);
        this.aiSystem = new AISystem();
        this.narrative = new NarrativeSystem();
        this.achievements = new AchievementSystem(this);
        this.ui = new UISystem(this);
        hydrateReliableIcons();
        this.running = true;
        this.lastTime = performance.now();
        this.narrative.addEvent('创世', '造物主降临这片大陆，世界开始有了形状。点击下方工具选中，再点击地图放置物种！', 'important');
        this.gameLoop();
    }

    gameLoop(currentTime = 0) {
        const deltaTime = (currentTime - this.lastTime) / 1000;
        this.lastTime = currentTime;
        if (this.running && !this.gameOver) this.update(deltaTime);
        this.render();
        requestAnimationFrame((t) => this.gameLoop(t));
    }

    update(deltaTime) {
        this.timeLeft -= deltaTime;
        if (this.timeLeft <= 0) { this.timeLeft = 0; this.endGame(); return; }
        this.aiSystem.update(deltaTime, this.map, this.entities, this.narrative);
        this.narrative.update(deltaTime, this.entities, this.map, this.aiSystem);
        const stats = this.aiSystem.getStats(this.entities);
        this.ui.updateStats(stats, Math.ceil(this.timeLeft), this.aiSystem.getCivLevelName());
        this.achievements.checkAll();
    }

    render() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        this.map.render(this.ctx);
        for (const entity of this.entities) entity.render(this.ctx, this.tileSize);
        if (this.ui.hoveredTile) {
            const { x, y } = this.ui.hoveredTile;
            this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            this.ctx.lineWidth = 2;
            this.ctx.strokeRect(x * this.tileSize, y * this.tileSize, this.tileSize, this.tileSize);
        }
    }

    applyAICustomization(prompt) {
        if (this.gameOver) return { success: false, message: '文明终章已到来，请重开后再定制世界。' };
        const text = (prompt || '').trim();
        if (!text) return { success: false, message: '先输入一句 AI 定制指令，例如“让大陆更湿润”。' };

        const lower = text.toLowerCase();
        const actions = [];

        if (/湿润|下雨|雨季|水源|湖|河|绿洲|潮湿|wet|rain|water/.test(lower)) {
            const waterCount = this.applyTerrainPatch(TERRAIN_TYPES.OCEAN, 4, (tile) => tile.terrain !== TERRAIN_TYPES.VOLCANO);
            const forestCount = this.applyTerrainPatch(TERRAIN_TYPES.FOREST, 4, (tile) => tile.terrain === TERRAIN_TYPES.PLAIN);
            this.addWorldVariable('湿润季');
            actions.push(`新增 ${waterCount} 处水域、${forestCount} 片森林`);
        }

        if (/森林|树|自然|繁茂|生态|forest|tree/.test(lower)) {
            const forestCount = this.applyTerrainPatch(TERRAIN_TYPES.FOREST, 6, (tile) => tile.terrain === TERRAIN_TYPES.PLAIN || tile.terrain === TERRAIN_TYPES.BEACH);
            const treeCount = this.scatterEntities(ENTITY_TYPES.TREE, 8, (x, y) => this.canPlaceAt('tree', x, y));
            this.addWorldVariable('繁茂生态');
            actions.push(`扩张 ${forestCount} 片森林、催生 ${treeCount} 棵树木`);
        }

        if (/山|山脉|高原|屏障|mountain/.test(lower)) {
            const mountainCount = this.applyTerrainPatch(TERRAIN_TYPES.MOUNTAIN, 7, (tile) => tile.terrain !== TERRAIN_TYPES.OCEAN);
            this.addWorldVariable('山脉屏障');
            actions.push(`隆起 ${mountainCount} 座山地`);
        }

        if (/火山|灾害|岩浆|毁灭|volcano|lava|disaster/.test(lower)) {
            const volcanoCount = this.applyTerrainPatch(TERRAIN_TYPES.VOLCANO, 2, (tile) => tile.terrain !== TERRAIN_TYPES.OCEAN);
            for (const tile of this.getRandomTiles(2, (tile) => tile.terrain === TERRAIN_TYPES.VOLCANO)) this.destroyNearbyEntities(tile.x, tile.y, 1);
            this.addWorldVariable('地火不安');
            actions.push(`唤醒 ${volcanoCount} 座火山`);
        }

        if (/沙漠|干旱|荒漠|desert|dry/.test(lower)) {
            const desertCount = this.applyTerrainPatch(TERRAIN_TYPES.DESERT, 6, (tile) => tile.terrain === TERRAIN_TYPES.PLAIN || tile.terrain === TERRAIN_TYPES.FOREST);
            this.addWorldVariable('干旱周期');
            actions.push(`生成 ${desertCount} 片干旱地带`);
        }

        if (/迁徙|人类|部落|移民|人口|生命|动物|羊|狼|migration|life|human/.test(lower)) {
            const humans = this.scatterEntities(ENTITY_TYPES.HUMAN, /大量|许多|很多/.test(lower) ? 5 : 3, (x, y) => this.canPlaceAt('human', x, y));
            const sheep = this.scatterEntities(ENTITY_TYPES.SHEEP, /狼/.test(lower) ? 3 : 5, (x, y) => this.canPlaceAt('sheep', x, y));
            const wolves = /狼|捕食|危险|野性/.test(lower) ? this.scatterEntities(ENTITY_TYPES.WOLF, 2, (x, y) => this.canPlaceAt('wolf', x, y)) : 0;
            this.addWorldVariable('迁徙季');
            actions.push(`迁入 ${humans} 名人类、${sheep} 只绵羊${wolves ? `、${wolves} 匹野狼` : ''}`);
        }

        if (/遗迹|神秘|魔法|信仰|科技|变量|规则|奇迹|relic|magic|rule/.test(lower)) {
            const variableName = this.extractVariableName(text);
            this.addWorldVariable(variableName);
            actions.push(`加入世界变量「${variableName}」`);
        }

        if (actions.length === 0) {
            const plains = this.applyTerrainPatch(TERRAIN_TYPES.PLAIN, 5, (tile) => tile.terrain !== TERRAIN_TYPES.OCEAN);
            const humans = this.scatterEntities(ENTITY_TYPES.HUMAN, 2, (x, y) => this.canPlaceAt('human', x, y));
            this.addWorldVariable('未知干预');
            actions.push(`重塑 ${plains} 处平原、引入 ${humans} 名探索者`);
        }

        this.narrative.addEvent('AI 定制', `AI 理解了造物主的指令：「${text}」。${actions.join('；')}。`, 'important');
        this.updateAIVariables();
        this.achievements.checkAll();
        return { success: true, message: `已执行：${actions.join('；')}。` };
    }

    applyTerrainPatch(terrain, count, predicate) {
        const tiles = this.getRandomTiles(count, predicate);
        for (const tile of tiles) this.map.setTerrain(tile.x, tile.y, terrain);
        return tiles.length;
    }

    scatterEntities(type, count, predicate) {
        const tiles = this.getRandomTiles(count, (tile) => predicate(tile.x, tile.y));
        for (const tile of tiles) this.entities.push(new Entity(type, tile.x, tile.y));
        return tiles.length;
    }

    getRandomTiles(count, predicate) {
        const candidates = [];
        for (let y = 0; y < this.map.height; y++) {
            for (let x = 0; x < this.map.width; x++) {
                const tile = this.map.getTile(x, y);
                if (tile && (!predicate || predicate(tile))) candidates.push(tile);
            }
        }
        const picked = [];
        while (candidates.length > 0 && picked.length < count) {
            const index = Utils.randomInt(0, candidates.length - 1);
            picked.push(candidates.splice(index, 1)[0]);
        }
        return picked;
    }

    addWorldVariable(name) {
        if (!name) return;
        if (!this.worldVariables.includes(name)) this.worldVariables.push(name);
        if (this.worldVariables.length > 6) this.worldVariables.shift();
        this.updateAIVariables();
    }

    extractVariableName(text) {
        const match = text.match(/(?:加入|添加|新增|变量|规则|设定)(.{2,8})/);
        if (match && match[1]) return match[1].replace(/[，。,.！!？?\s]/g, '').slice(0, 6) || '神秘遗迹';
        if (/魔法|奇迹/.test(text)) return '奇迹低语';
        if (/科技/.test(text)) return '古代科技';
        if (/信仰/.test(text)) return '原初信仰';
        return '神秘遗迹';
    }

    updateAIVariables() {
        const list = document.getElementById('ai-variables');
        if (!list) return;
        list.innerHTML = this.worldVariables.map(v => `<span class="ai-variable-pill">${v}</span>`).join('');
    }

    placeEntity(type, x, y) {
        if (this.gameOver) return false;
        if ((this.resources[type] || 0) <= 0) return false;
        let tile = this.map.getTile(x, y);
        if (!tile) return false;
        if (!this.canPlaceAt(type, x, y)) {
            const nearby = this.findNearbyPlaceableTile(type, x, y, 4);
            if (nearby) {
                x = nearby.x;
                y = nearby.y;
                tile = this.map.getTile(x, y);
            } else {
                this.narrative.addEvent('无法放置', `这里的${this.map.getTerrainName(x, y)}不适合放置「${this.getToolName(type)}」，请换一块地形试试。`);
                return false;
            }
        }
        let success = false;
        switch (type) {
            case 'tree':
                if (tile.terrain === 'plain' || tile.terrain === 'forest' || tile.terrain === 'beach') {
                    this.entities.push(new Entity(ENTITY_TYPES.TREE, x, y));
                    success = true;
                    this.narrative.addEvent('造物主之举', `一棵树木在${this.map.getTerrainName(x, y)}上生根发芽。`);
                }
                break;
            case 'human':
                if (this.map.isPassable(x, y)) {
                    this.entities.push(new Entity(ENTITY_TYPES.HUMAN, x, y));
                    success = true;
                    this.narrative.addEvent('造物主之举', `一个人类降临到${this.map.getTerrainName(x, y)}，好奇地观察着世界。`, 'important');
                }
                break;
            case 'sheep':
                if (this.map.isPassable(x, y)) {
                    this.entities.push(new Entity(ENTITY_TYPES.SHEEP, x, y));
                    success = true;
                    this.narrative.addEvent('造物主之举', `一只绵羊来到了${this.map.getTerrainName(x, y)}。`);
                }
                break;
            case 'wolf':
                if (this.map.isPassable(x, y)) {
                    this.entities.push(new Entity(ENTITY_TYPES.WOLF, x, y));
                    success = true;
                    this.narrative.addEvent('造物主之举', `一匹野狼出现在${this.map.getTerrainName(x, y)}，眼中闪烁着野性的光芒。`);
                }
                break;
            case 'mountain':
                if (tile.terrain !== 'ocean') {
                    this.map.setTerrain(x, y, TERRAIN_TYPES.MOUNTAIN);
                    success = true;
                    this.narrative.addEvent('地形变化', `大地隆起，一座山峰在${this.map.getTerrainName(x, y)}拔地而起！`, 'important');
                }
                break;
            case 'forest':
                if (tile.terrain === 'plain') {
                    this.map.setTerrain(x, y, TERRAIN_TYPES.FOREST);
                    this.entities.push(new Entity(ENTITY_TYPES.TREE, x, y));
                    for (let i = 0; i < 3; i++) {
                        const nx = x + Utils.randomInt(-1, 1), ny = y + Utils.randomInt(-1, 1);
                        const nt = this.map.getTile(nx, ny);
                        if (nt && (nt.terrain === 'plain' || nt.terrain === 'forest')) {
                            const has = this.entities.some(e => e.type === ENTITY_TYPES.TREE && e.alive && e.x === nx && e.y === ny);
                            if (!has) this.entities.push(new Entity(ENTITY_TYPES.TREE, nx, ny));
                        }
                    }
                    success = true;
                    this.narrative.addEvent('地形变化', `森林在这片土地上蔓延开来，绿意盎然！`, 'important');
                }
                break;
            case 'water':
                this.map.setTerrain(x, y, TERRAIN_TYPES.OCEAN);
                success = true;
                this.narrative.addEvent('地形变化', `水源涌出，形成了一片水域。`);
                break;
            case 'volcano':
                if (tile.terrain !== 'ocean') {
                    this.map.setTerrain(x, y, TERRAIN_TYPES.VOLCANO);
                    success = true;
                    this.narrative.addEvent('地形变化', `火山喷发！炽热的岩浆从地底涌出，大地为之震颤！`, 'important');
                    this.destroyNearbyEntities(x, y, 2);
                }
                break;
        }
        if (success) {
            this.resources[type]--;
            this.placementStats[type] = (this.placementStats[type] || 0) + 1;
            this.totalPlacements++;
            this.achievements.checkAll();
        }
        return success;
    }

    canPlaceAt(type, x, y) {
        const tile = this.map.getTile(x, y);
        if (!tile) return false;
        switch (type) {
            case 'tree':
                return tile.terrain === 'plain' || tile.terrain === 'forest' || tile.terrain === 'beach';
            case 'human':
            case 'sheep':
            case 'wolf':
                return this.map.isPassable(x, y);
            case 'mountain':
            case 'volcano':
                return tile.terrain !== 'ocean';
            case 'forest':
                return tile.terrain === 'plain';
            case 'water':
                return true;
            default:
                return false;
        }
    }

    findNearbyPlaceableTile(type, cx, cy, radius = 4) {
        for (let dist = 1; dist <= radius; dist++) {
            for (let dy = -dist; dy <= dist; dy++) {
                for (let dx = -dist; dx <= dist; dx++) {
                    if (Math.abs(dx) + Math.abs(dy) !== dist) continue;
                    const x = cx + dx;
                    const y = cy + dy;
                    if (this.canPlaceAt(type, x, y)) return { x, y };
                }
            }
        }
        return null;
    }

    getToolName(type) {
        const names = {
            tree: '树木', human: '人类', sheep: '绵羊', wolf: '野狼',
            mountain: '山地', forest: '森林', water: '水源', volcano: '火山'
        };
        return names[type] || type;
    }

    destroyNearbyEntities(cx, cy, radius) {
        for (let i = this.entities.length - 1; i >= 0; i--) {
            const e = this.entities[i];
            if (Utils.manhattanDistance(e.x, e.y, cx, cy) <= radius && e.type !== ENTITY_TYPES.HOUSE) {
                e.health -= 50;
                if (e.health <= 0) e.alive = false;
            }
        }
    }

    endGame() {
        this.gameOver = true;
        const summary = this.narrative.getSummary(this.entities, this.aiSystem);
        this.ui.showGameOver(summary);
    }

    restart() {
        this.entities = [];
        this.timeLeft = this.gameTime;
        this.gameOver = false;
        this.lastTime = performance.now();
        this.resources = { tree: 30, human: 15, sheep: 20, wolf: 8, mountain: 12, forest: 10, water: 10, volcano: 5 };
        this.placementStats = { tree: 0, human: 0, sheep: 0, wolf: 0, mountain: 0, forest: 0, water: 0, volcano: 0 };
        this.totalPlacements = 0;
        this.worldVariables = [];
        this.updateAIVariables();
        const aiStatus = document.getElementById('ai-status');
        const aiPrompt = document.getElementById('ai-prompt');
        if (aiStatus) aiStatus.textContent = '输入一句设定，AI 会改造地形或加入世界变量。';
        if (aiPrompt) aiPrompt.value = '';
        this.achievements.reset();
        document.getElementById('achievement-modal').classList.add('hidden');
        document.getElementById('achievement-toast').classList.remove('show');
        this.map.seed = Math.random() * 10000;
        this.map.generate();
        this.aiSystem = new AISystem();
        this.narrative = new NarrativeSystem();
        this.ui.reset();
        this.narrative.addEvent('新的创世', '新世界诞生了！造物主再次降临，一切从零开始...', 'important');
    }
}

window.addEventListener('DOMContentLoaded', () => { hydrateReliableIcons(); window.game = new Game(); });
</script>
