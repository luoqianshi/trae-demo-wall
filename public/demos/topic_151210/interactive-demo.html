<!DOCTYPE html>
<html lang="zh-CN" data-theme="night">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mind Flow · 思考连续性引擎</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --mf-canvas: #0D0F0E;
  --mf-surface: #151716;
  --mf-surface-hover: #1C1E1D;
  --mf-elevated: #1E201F;
  --mf-ink: #E8E6E3;
  --mf-ink-secondary: #BAB7AE;
  --mf-ink-muted: #7A776F;
  --mf-ink-faint: #4A4740;
  --mf-border: #252726;
  --mf-border-subtle: #1F211F;
  --mf-divider: #1A1C1B;
  --mf-accent: #3ECF8E;
  --mf-accent-hover: #34B87D;
  --mf-accent-soft: rgba(62, 207, 142, 0.06);
  --mf-accent-glow: rgba(62, 207, 142, 0.12);
  --mf-danger: #E54D4D;
  --mf-danger-soft: rgba(229, 77, 77, 0.06);
  --mf-warning: #E5A34D;
  --mf-warning-soft: rgba(229, 163, 77, 0.06);
  --mf-info: #4D8FE5;
  --mf-info-soft: rgba(77, 143, 229, 0.06);
  --mf-radius-sm: 6px;
  --mf-radius-md: 10px;
  --mf-radius-lg: 14px;
  --mf-radius-xl: 18px;
  --mf-radius-full: 9999px;
  --mf-shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
  --mf-transition: 200ms cubic-bezier(0.4, 0, 0.2, 1);
}
[data-theme="dawn"] {
  --mf-canvas: #FAF8F5;
  --mf-surface: #F0EDE8;
  --mf-surface-hover: #E8E5E0;
  --mf-elevated: #FFFFFF;
  --mf-ink: #1A1917;
  --mf-ink-secondary: #4A4740;
  --mf-ink-muted: #8A877F;
  --mf-ink-faint: #B5B2AA;
  --mf-border: #E0DDD8;
  --mf-border-subtle: #EDEAE5;
  --mf-divider: #D5D2CC;
  --mf-accent-soft: #E6F5EE;
  --mf-accent-glow: rgba(62, 207, 142, 0.1);
  --mf-danger-soft: #FDE8E8;
  --mf-warning-soft: #FFF8EE;
  --mf-info-soft: #E6F0FF;
  --mf-shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body, #app { height: 100%; }
body {
  font-family: 'Inter', 'Noto Sans SC', sans-serif;
  background: var(--mf-canvas);
  color: var(--mf-ink);
  -webkit-font-smoothing: antialiased;
  transition: background var(--mf-transition), color var(--mf-transition);
  overflow: hidden;
}
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--mf-border); border-radius: 2px; }

/* ===== Layout ===== */
.app-layout { display: flex; height: 100vh; overflow: hidden; }
.main { flex: 1; overflow: hidden; position: relative; }

/* ===== Sidebar ===== */
.sidebar {
  width: 260px; flex-shrink: 0;
  border-right: 1px solid var(--mf-border-subtle);
  display: flex; flex-direction: column; background: var(--mf-canvas);
}
.sidebar-header {
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--mf-border-subtle);
  display: flex; align-items: center; justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 8px; }
.brand-mark { width: 8px; height: 8px; border-radius: 50%; background: var(--mf-accent); box-shadow: 0 0 8px var(--mf-accent-glow); flex-shrink: 0; }
.brand-name { font-family: 'Newsreader', 'Noto Serif SC', serif; font-size: 1.05rem; font-weight: 600; color: var(--mf-ink); letter-spacing: -0.02em; }
.theme-toggle {
  width: 28px; height: 28px; border-radius: var(--mf-radius-sm);
  border: 1px solid var(--mf-border); background: transparent;
  color: var(--mf-ink-muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--mf-transition);
}
.theme-toggle:hover { background: var(--mf-surface-hover); color: var(--mf-ink-secondary); }
.stream-list { flex: 1; overflow-y: auto; padding: 8px; }
.new-thread-btn {
  width: 100%; padding: 10px 12px; margin-bottom: 12px;
  background: transparent; border: 1px solid var(--mf-border);
  border-radius: var(--mf-radius-md); color: var(--mf-ink-secondary);
  cursor: pointer; font-size: 0.82rem; font-family: 'Inter', sans-serif;
  font-weight: 500; display: flex; align-items: center; gap: 8px;
  transition: all var(--mf-transition);
}
.new-thread-btn:hover { background: var(--mf-surface-hover); border-color: var(--mf-ink-faint); color: var(--mf-ink); }
.stream-item {
  padding: 10px 12px; margin-bottom: 2px; cursor: pointer;
  border-radius: var(--mf-radius-md); border: 1px solid transparent;
  transition: all var(--mf-transition); position: relative;
}
.stream-item:hover { background: var(--mf-surface-hover); }
.stream-item.active { background: var(--mf-surface); border-color: var(--mf-border); }
.stream-item.active::before { content: ''; position: absolute; left: -1px; top: 50%; transform: translateY(-50%); width: 2px; height: 60%; background: var(--mf-accent); border-radius: 0 2px 2px 0; }
.stream-item-title { font-size: 0.84rem; color: var(--mf-ink); line-height: 1.4; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.stream-item-meta { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--mf-ink-faint); margin-top: 4px; display: flex; align-items: center; gap: 6px; }
.status-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
.status-dot.active { background: var(--mf-accent); opacity: 0.7; }
.status-dot.paused { background: var(--mf-warning); opacity: 0.5; }
.sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--mf-border-subtle); }
.sidebar-footer-text { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; color: var(--mf-ink-faint); letter-spacing: 0.05em; }

/* ===== Workspace ===== */
.workspace { display: flex; flex-direction: column; height: 100%; max-width: 680px; margin: 0 auto; padding: 0 32px; }
.workspace-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; padding: 40px; }
.workspace-empty-icon { width: 48px; height: 48px; margin-bottom: 20px; opacity: 0.15; }
.workspace-empty-title { font-family: 'Newsreader', 'Noto Serif SC', serif; font-size: 1.3rem; color: var(--mf-ink-secondary); margin-bottom: 8px; font-weight: 500; letter-spacing: -0.01em; }
.workspace-empty-desc { font-size: 0.85rem; color: var(--mf-ink-muted); max-width: 280px; line-height: 1.6; }
.dump-scroll { flex: 1; overflow-y: auto; padding: 24px 0; }
.dump-card { padding: 14px 18px; margin-bottom: 8px; border-radius: var(--mf-radius-md); transition: background var(--mf-transition); animation: fadeInUp 300ms ease-out; }
.dump-card:hover { background: var(--mf-surface); }
.dump-card-text { font-size: 0.95rem; color: var(--mf-ink); line-height: 1.75; }
.dump-card-meta { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--mf-ink-faint); margin-top: 6px; display: flex; align-items: center; gap: 8px; }
.dump-card-tag { padding: 1px 6px; border-radius: var(--mf-radius-sm); background: var(--mf-surface-hover); color: var(--mf-ink-muted); }

/* AI Response card */
.ai-response { padding: 14px 18px; margin-bottom: 8px; border-radius: var(--mf-radius-md); background: var(--mf-info-soft); border: 1px solid var(--mf-border-subtle); border-left: 2px solid var(--mf-info); animation: fadeInUp 300ms ease-out; }
.ai-response-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.ai-response-label { font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; color: var(--mf-info); letter-spacing: 0.08em; text-transform: uppercase; }
.ai-response-close { background: none; border: none; color: var(--mf-ink-faint); cursor: pointer; padding: 2px; }
.ai-response-text { color: var(--mf-ink); font-size: 0.92rem; line-height: 1.7; }

/* AI thinking indicator */
.ai-thinking { display: flex; align-items: center; gap: 6px; padding: 14px 18px; margin-bottom: 8px; color: var(--mf-ink-muted); font-size: 0.82rem; }
.ai-thinking-dots { display: flex; gap: 3px; }
.ai-thinking-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--mf-ink-faint); animation: thinkingPulse 1.4s ease-in-out infinite; }
.ai-thinking-dot:nth-child(2) { animation-delay: 0.2s; }
.ai-thinking-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes thinkingPulse { 0%,80%,100% { opacity: 0.3; } 40% { opacity: 1; } }

/* ===== Input Area ===== */
.input-area { padding: 16px 0 8px; flex-shrink: 0; }
.input-row { display: flex; gap: 10px; align-items: flex-end; }
.voice-btn { width: 38px; height: 38px; border-radius: var(--mf-radius-md); background: var(--mf-surface); border: 1px solid var(--mf-border); color: var(--mf-ink-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all var(--mf-transition); }
.voice-btn:hover { background: var(--mf-surface-hover); color: var(--mf-ink-secondary); }
.voice-btn.recording { background: var(--mf-danger-soft); border-color: rgba(229,77,77,0.2); color: var(--mf-danger); animation: pulse 1.5s ease-in-out infinite; }
.textarea { flex: 1; min-height: 38px; max-height: 200px; resize: none; padding: 9px 14px; background: var(--mf-surface); border: 1px solid var(--mf-border); border-radius: var(--mf-radius-md); color: var(--mf-ink); font-size: 0.92rem; font-family: 'Inter', 'Noto Sans SC', sans-serif; line-height: 1.6; transition: border-color var(--mf-transition); outline: none; }
.textarea::placeholder { color: var(--mf-ink-faint); }
.textarea:focus { border-color: var(--mf-ink-faint); background: var(--mf-surface-hover); }
.send-btn { padding: 8px 18px; border-radius: var(--mf-radius-md); background: var(--mf-accent); border: none; color: #0D0F0E; cursor: pointer; font-size: 0.82rem; font-weight: 600; font-family: 'Inter', sans-serif; flex-shrink: 0; transition: all var(--mf-transition); height: 38px; }
.send-btn:hover:not(:disabled) { background: var(--mf-accent-hover); }
.send-btn:disabled { background: var(--mf-surface); color: var(--mf-ink-faint); cursor: default; }
.pause-btn { width: 100%; padding: 8px; margin-top: 8px; background: transparent; border: 1px solid var(--mf-border-subtle); border-radius: var(--mf-radius-md); color: var(--mf-ink-muted); cursor: pointer; font-size: 0.78rem; font-family: 'Inter', sans-serif; transition: all var(--mf-transition); display: flex; align-items: center; justify-content: center; gap: 6px; }
.pause-btn:hover { background: var(--mf-surface); color: var(--mf-ink-secondary); border-color: var(--mf-border); }

/* ===== Right Panel ===== */
.right-panel { width: 300px; flex-shrink: 0; border-left: 1px solid var(--mf-border-subtle); display: flex; flex-direction: column; overflow: hidden; background: var(--mf-canvas); }
.right-tabs { display: flex; border-bottom: 1px solid var(--mf-border-subtle); padding: 0 8px; }
.right-tab { flex: 1; padding: 12px 8px; background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--mf-ink-muted); cursor: pointer; font-size: 0.78rem; font-family: 'Inter', sans-serif; font-weight: 500; transition: all var(--mf-transition); }
.right-tab:hover { color: var(--mf-ink-secondary); }
.right-tab.active { color: var(--mf-ink); border-bottom-color: var(--mf-accent); }
.right-content { flex: 1; overflow-y: auto; padding: 16px; }

/* Status Board */
.status-empty { color: var(--mf-ink-faint); font-size: 0.82rem; text-align: center; padding: 40px 16px; font-family: 'Newsreader', 'Noto Serif SC', serif; font-style: italic; }
.status-section { margin-bottom: 20px; }
.status-section:last-child { margin-bottom: 0; }
.status-label { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--mf-ink-muted); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.status-label-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.status-item { font-size: 0.82rem; color: var(--mf-ink); line-height: 1.6; padding: 6px 0; border-bottom: 1px solid var(--mf-border-subtle); }
.status-item:last-child { border-bottom: none; }
.status-item.strikethrough { color: var(--mf-ink-muted); text-decoration: line-through; text-decoration-color: var(--mf-ink-faint); }
.status-item.new { animation: highlightFade 2s ease-out; }
@keyframes highlightFade { 0% { background: var(--mf-accent-soft); } 100% { background: transparent; } }

/* Timeline */
.timeline-item { position: relative; padding-left: 20px; margin-bottom: 16px; }
.timeline-item:last-child { margin-bottom: 0; }
.timeline-line { position: absolute; left: 5px; top: 14px; bottom: -16px; width: 1px; background: var(--mf-border); }
.timeline-item:last-child .timeline-line { display: none; }
.timeline-dot { position: absolute; left: 0; top: 5px; width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--mf-border); background: var(--mf-canvas); }
.timeline-time { font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; color: var(--mf-ink-faint); margin-bottom: 3px; }
.timeline-text { font-size: 0.8rem; color: var(--mf-ink-secondary); line-height: 1.5; }

/* Map */
.map-section { margin-bottom: 20px; }
.map-section:last-child { margin-bottom: 0; }
.map-label { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--mf-ink-muted); margin-bottom: 8px; }
.map-item { padding: 8px 12px; margin-bottom: 4px; background: var(--mf-surface); border-radius: var(--mf-radius-md); font-size: 0.8rem; color: var(--mf-ink-secondary); line-height: 1.5; border: 1px solid var(--mf-border-subtle); }

/* ===== Overlay/Dialog ===== */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; animation: fadeIn 200ms ease-out; backdrop-filter: blur(4px); }
.dialog { background: var(--mf-elevated); border-radius: var(--mf-radius-xl); padding: 28px; width: 90%; max-width: 460px; box-shadow: var(--mf-shadow-lg); border: 1px solid var(--mf-border); animation: scaleIn 250ms cubic-bezier(0.34, 1.56, 0.64, 1); }
.dialog-title { font-family: 'Newsreader', 'Noto Serif SC', serif; font-size: 1.35rem; font-weight: 600; color: var(--mf-ink); margin-bottom: 8px; letter-spacing: -0.02em; line-height: 1.4; }
.dialog-desc { font-size: 0.85rem; color: var(--mf-ink-muted); margin-bottom: 20px; line-height: 1.6; }
.dialog-input { width: 100%; padding: 12px 14px; background: var(--mf-canvas); border: 1px solid var(--mf-border); border-radius: var(--mf-radius-md); color: var(--mf-ink); font-size: 0.95rem; font-family: 'Inter', 'Noto Sans SC', sans-serif; outline: none; transition: border-color var(--mf-transition); margin-bottom: 20px; }
.dialog-input:focus { border-color: var(--mf-ink-faint); }
.dialog-input::placeholder { color: var(--mf-ink-faint); }
.dialog-actions { display: flex; gap: 10px; justify-content: flex-end; }
.btn-ghost { padding: 8px 20px; background: transparent; border: 1px solid var(--mf-border); border-radius: var(--mf-radius-md); color: var(--mf-ink-muted); cursor: pointer; font-size: 0.85rem; font-family: 'Inter', sans-serif; transition: all var(--mf-transition); }
.btn-ghost:hover { background: var(--mf-surface-hover); color: var(--mf-ink-secondary); }
.btn-primary { padding: 8px 20px; background: var(--mf-accent); border: none; border-radius: var(--mf-radius-md); color: #0D0F0E; cursor: pointer; font-size: 0.85rem; font-weight: 600; font-family: 'Inter', sans-serif; transition: all var(--mf-transition); }
.btn-primary:hover:not(:disabled) { background: var(--mf-accent-hover); }
.btn-primary:disabled { opacity: 0.4; cursor: default; }

/* ===== Summon Panel ===== */
.summon-panel { background: var(--mf-elevated); border-radius: var(--mf-radius-xl); padding: 24px; width: 440px; max-width: 90vw; box-shadow: var(--mf-shadow-lg); border: 1px solid var(--mf-border); animation: scaleIn 250ms cubic-bezier(0.34, 1.56, 0.64, 1); }
.summon-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.summon-title { font-family: 'Newsreader', 'Noto Serif SC', serif; font-size: 1.1rem; font-weight: 600; color: var(--mf-ink); letter-spacing: -0.01em; }
.summon-close { width: 28px; height: 28px; border-radius: var(--mf-radius-sm); background: transparent; border: none; color: var(--mf-ink-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all var(--mf-transition); }
.summon-close:hover { background: var(--mf-surface-hover); color: var(--mf-ink); }
.summon-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.summon-card { padding: 16px; border-radius: var(--mf-radius-lg); background: var(--mf-surface); border: 1px solid var(--mf-border); cursor: pointer; text-align: left; transition: all var(--mf-transition); font-family: 'Inter', sans-serif; position: relative; overflow: hidden; }
.summon-card:hover { background: var(--mf-surface-hover); border-color: var(--mf-ink-faint); transform: translateY(-1px); }
.summon-card:disabled { opacity: 0.5; cursor: default; transform: none; }
.summon-card.loading { background: var(--mf-accent-soft); border-color: var(--mf-accent-glow); }
.summon-card-icon { width: 20px; height: 20px; color: var(--mf-ink-muted); margin-bottom: 10px; }
.summon-card-label { font-size: 0.9rem; font-weight: 600; color: var(--mf-ink); margin-bottom: 4px; }
.summon-card-desc { font-size: 0.75rem; color: var(--mf-ink-muted); line-height: 1.4; }
.summon-card-hint { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; color: var(--mf-accent); opacity: 0.6; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--mf-border-subtle); }
.summon-footer { width: 100%; margin-top: 16px; padding: 8px; background: transparent; border: none; color: var(--mf-ink-muted); cursor: pointer; font-size: 0.82rem; font-family: 'Inter', sans-serif; transition: color var(--mf-transition); text-align: center; }
.summon-footer:hover { color: var(--mf-ink-secondary); }

/* ===== Recovery Brief ===== */
.recovery { padding: 32px 0; animation: fadeInUp 400ms ease-out; }
.recovery-label { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--mf-accent); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 12px; }
.recovery-question { font-family: 'Newsreader', 'Noto Serif SC', serif; font-size: 1.5rem; font-weight: 600; color: var(--mf-ink); line-height: 1.4; letter-spacing: -0.02em; margin-bottom: 28px; }
.recovery-section { margin-bottom: 20px; }
.recovery-section:last-of-type { margin-bottom: 24px; }
.recovery-section-label { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--mf-ink-muted); margin-bottom: 6px; }
.recovery-section-text { font-size: 0.92rem; color: var(--mf-ink); line-height: 1.7; }
.recovery-list-item { font-size: 0.88rem; color: var(--mf-ink-secondary); line-height: 1.6; padding: 3px 0; display: flex; gap: 8px; }
.recovery-list-marker { color: var(--mf-ink-faint); flex-shrink: 0; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; padding-top: 2px; }

/* ===== Snapshot Preview ===== */
.snapshot-preview { background: var(--mf-elevated); border-radius: var(--mf-radius-xl); padding: 28px; width: 520px; max-width: 90vw; box-shadow: var(--mf-shadow-lg); border: 1px solid var(--mf-border); animation: scaleIn 250ms cubic-bezier(0.34, 1.56, 0.64, 1); }
.snapshot-label { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--mf-accent); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 12px; }
.snapshot-title { font-family: 'Newsreader', 'Noto Serif SC', serif; font-size: 1.2rem; font-weight: 600; color: var(--mf-ink); margin-bottom: 20px; letter-spacing: -0.01em; }

/* ===== Onboarding Tour ===== */
.tour-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: flex; align-items: center; justify-content: center; animation: fadeIn 300ms ease-out; }
.tour-card { background: var(--mf-elevated); border-radius: var(--mf-radius-xl); padding: 32px; width: 480px; max-width: 90vw; box-shadow: var(--mf-shadow-lg); border: 1px solid var(--mf-border); text-align: center; animation: scaleIn 300ms cubic-bezier(0.34, 1.56, 0.64, 1); }
.tour-badge { display: inline-block; padding: 4px 12px; border-radius: var(--mf-radius-full); background: var(--mf-accent-soft); border: 1px solid var(--mf-accent-glow); color: var(--mf-accent); font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 16px; }
.tour-title { font-family: 'Newsreader', 'Noto Serif SC', serif; font-size: 1.6rem; font-weight: 600; color: var(--mf-ink); margin-bottom: 12px; letter-spacing: -0.02em; line-height: 1.3; }
.tour-desc { font-size: 0.9rem; color: var(--mf-ink-muted); line-height: 1.7; margin-bottom: 24px; }
.tour-steps { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; text-align: left; }
.tour-step { display: flex; align-items: center; gap: 10px; font-size: 0.82rem; color: var(--mf-ink-secondary); }

      openQuestions: ['价值深度的具体定义是什么？如何量化？'],

      { id:'f2-2', content:'看了 Spanner 的做法——用 TrueTime API 和 Paxos 实现外部一致性，本质是用原子钟把"时间不确定"降到极小窗口。但这依赖硬件投入，不是通用方案。', inputType:'text', createdAt:'2026-07-12T01:12:00Z' },
      { id:'f2-3', content:'但是 DynamoDB 走了完全相反的路——接受最终一致性，用 vector clock 处理冲突，让应用层决定如何 merge。这说明一致性的"正确"答案取决于业务场景。', inputType:'voice', createdAt:'2026-07-12T01:20:00Z' },
      { id:'f2-4', content:'关键转折：也许不该问"选哪种一致性"，而该问"哪些操作需要强一致，哪些可以容忍 eventual"。分层一致性——金融交易强一致，用户通知 eventual，这是工程实践已经在做的。', inputType:'text', createdAt:'2026-07-12T01:28:00Z' },
    ],

        { id:'r2-2', content:'Spanner 用 TrueTime + Paxos 实现外部一致性，但依赖硬件' },
        { id:'r2-3', content:'DynamoDB 用 vector clock + 应用层 merge 实现最终一致性' },
      ],

      ],

      ],
      openQuestions: [
        { id:'q2-1', content:'如何定义操作的"一致性需求等级"？自动推断还是人工标注？' },
      ],

      ],

    snapshot: {
      oneLineProgress: '从"选哪种一致性"转向"分层一致性——按操作类型区分一致性级别"',
      keyTurningPoints: ['CAP 限制了全局选择的可行性', 'Spanner 和 DynamoDB 代表两条极端路线', '转向分层一致性策略'],
      openQuestions: ['如何定义操作的一致性需求等级？'],
      nextStepDirection: '研究 CRDT 数据结构，探索分层一致性的工程实现',
    },
  },
];

// ===== AI Keyword Routing Engine =====
// 基于关键词将用户输入路由到对应的思考状态字段
const KEYWORD_RULES = [
  {
    field: 'keyTurningPoints',
    keywords: ['但是', '不过', '可是', '转折', '关键', '突然', '等一下', '换个思路', '其实不对', '反过来'],
    label: '关键转折',
  },
  {
    field: 'implicitAssumptions',
    keywords: ['假设', '默认', '前提', '当然', '显然', '理所当然', '不言而喻', '本来'],
    label: '隐含假设',
  },
  {
    field: 'reasoningBasis',
    keywords: ['因为', '所以', '导致', '原因是', '根据', '依据', '证明', '数据表明', '研究显示', '经验告诉我们'],
    label: '推理依据',
  },
  {
    field: 'openQuestions',
    keywords: ['？', '?', '为什么', '怎么', '如何', '是否', '能不能', '难道', '不确定', '困惑', '疑惑'],
    label: '未决问题',
  },
  {
    field: 'abandonedPaths',
    keywords: ['放弃', '排除', '不考虑', '行不通', '失败', '错误', '回头', '算了', '放弃这个'],
    label: '放弃的岔路',
  },
  {
    field: 'suggestedNext',
    keywords: ['下一步', '接下来', '应该', '需要', '计划', '打算', '准备', '明天', '之后', '继续'],
    label: '建议下一步',
  },
];

function analyzeInput(text) {
  // 按规则优先级匹配关键词，返回提取结果
  for (const rule of KEYWORD_RULES) {
    for (const kw of rule.keywords) {
      if (text.includes(kw)) {
        // 提取关键词附近的上下文作为结构化内容
        const idx = text.indexOf(kw);
        const start = Math.max(0, idx - 10);
        const end = Math.min(text.length, idx + kw.length + 40);
        let excerpt = text.slice(start, end).trim();
        if (start > 0) excerpt = '…' + excerpt;
        if (end < text.length) excerpt = excerpt + '…';
        return {
          field: rule.field,
          label: rule.label,
          content: excerpt,
        };
      }
    }
  }
  // 未命中任何关键词时，随机选择一个字段，避免总走 reasoningBasis
  const fallbackFields = [
    { field: 'reasoningBasis', label: '推理依据' },
    { field: 'implicitAssumptions', label: '隐含假设' },
    { field: 'keyTurningPoints', label: '关键转折' },
    { field: 'openQuestions', label: '未决问题' },
  ];
  const fallback = fallbackFields[Math.floor(Math.random() * fallbackFields.length)];
  return {
    field: fallback.field,
    label: fallback.label,
    content: text.length > 60 ? text.slice(0, 60) + '…' : text,
  };
}

// ===== Dynamic Summon Response Generator =====
// 基于线程实际内容生成回应，而非硬编码
function generateSummonResponse(type, thread) {
  const ts = thread.thinkingState;
  const fragments = thread.fragments.filter(f => f.inputType !== 'summon_response');
  const lastFragment = fragments[fragments.length - 1];

  if (type === 'outline') {
    const bases = ts.reasoningBasis.map(r => r.content).join(' → ');
    const turning = ts.keyTurningPoints[0]?.content || '';
    return `你的思路主线是：从"${thread.coreQuestion.slice(0, 20)}…"出发 → ${bases || '逐步推进推理'}${turning ? ' → 关键转折：' + turning : ''}。目前走到"${ts.suggestedNext[0]?.content || '继续探索'}"的方向。`;
  }

  if (type === 'blindspot') {
    const assumptions = ts.implicitAssumptions.map(a => a.content);
    const blindspots = [];
    if (assumptions.length > 0) {
      blindspots.push(`你隐含假设了"${assumptions[0]}"——这个假设是否成立？如果它不成立，整个推理链会怎样？`);
    }
    blindspots.push('你的推理目前主要基于已有碎片，是否缺少反面论据或竞品视角的验证？');
    if (ts.openQuestions.length === 0) {
      blindspots.push('你还没有明确提出未决问题——这本身就是一个盲点：你可能在"顺流而下"而没有停下来质疑方向。');
    }
    return '你可能忽略了：\n' + blindspots.map((b, i) => `${i+1}) ${b}`).join('\n');
  }

  if (type === 'weigh') {
    const abandoned = ts.abandonedPaths[0]?.description || '方案 A';
    const current = ts.keyTurningPoints[0]?.content || '方案 B';
    return `路径对比：\n• 放弃的路：${abandoned}\n  优势：简单直接 / 劣势：${ts.openQuestions[0]?.content || '存在未验证的风险'}\n• 当前的路：${current}\n  优势：更契合核心矛盾 / 劣势：需要额外验证"${ts.suggestedNext[0]?.content || '可行性'}"\n建议：用最小成本验证当前路径的关键假设，而非全量推进。`;
  }

  if (type === 'crosslink') {
    // 跨线程关联：找到其他线程
    const otherThreads = state.threads.filter(t => t.id !== thread.id);
    if (otherThreads.length > 0) {
      const other = otherThreads[0];
      const otherTurning = other.thinkingState.keyTurningPoints[0]?.content || other.coreQuestion;
      return `与"${other.coreQuestion}"线程存在思维模式相似性：\n你在这里的转折点是"${ts.keyTurningPoints[0]?.content || '当前方向'}"，而那条线上的转折是"${otherTurning}"。\n共性：都是在两个极端之间找第三条路。可以考虑将"${other.coreQuestion.slice(0, 15)}"中的分层思路迁移过来。`;
    }
    return '当前只有一条思考线程，<span onclick="state.showNewDialog=true; render();" style="color:var(--mf-accent);text-decoration:underline;cursor:pointer;">创建新线程</span>后可以探索跨线程的思维模式关联。';
  }

  return 'AI 正在分析...';
}

// ===== State =====
let state = {
  threads: JSON.parse(JSON.stringify(SAMPLE_THREADS)),

// ===== Render =====
function render() {
  const app = document.getElementById('app');
  const activeThread = state.threads.find(t => t.id === state.activeThreadId);

  let html = '<div class="app-layout">';

  // Sidebar
  html += renderSidebar();

  // Main
  html += '<main class="main">';
  if (!state.activeThreadId) {
    html += renderEmpty();
  } else if (state.mode === 'recovery') {
    html += renderRecovery(activeThread);
  } else {
    html += renderWorkspace(activeThread);
  }
  html += '</main>';

  // Right Panel
  html += renderRightPanel(activeThread);

  html += '</div>';

  // Overlays
  if (state.showTour) html += renderTour();
  if (state.showNewDialog) html += renderNewDialog();
  if (state.showSummon) html += renderSummonPanel();
  if (state.showSnapshot && activeThread?.snapshot) html += renderSnapshotPreview(activeThread.snapshot);
  if (state.showTraePanel) html += renderTraePanel();
  if (state.showGoodnight) html += renderGoodnight();

  app.innerHTML = html;
  attachEvents();
}

function renderSidebar() {
  let html = '<aside class="sidebar" data-dom-id="sidebar">';
  html += '<div class="sidebar-header">';

  html += `<button class="theme-toggle" data-dom-id="theme-toggle" onclick="toggleTheme()" title="切换主题">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>`;
  html += '</div>';

  html += '<div class="stream-list" data-dom-id="thread-list">';
  html += `<button class="new-thread-btn" data-dom-id="new-thread-input" onclick="state.showNewDialog=true; render();">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    新建思考线程
  </button>`;

  state.threads.slice(0, 5).forEach(t => {
    const date = formatDate(t.updatedAt);
    html += `<div class="stream-item ${state.activeThreadId === t.id ? 'active' : ''}" data-dom-id="thread-growth" onclick="selectThread('${t.id}')">
      <div class="stream-item-title">${t.coreQuestion}</div>
      <div class="stream-item-meta">

function renderStatusBoard(thread) {
  const ts = thread.thinkingState;
  if (!ts || (ts.reasoningBasis.length === 0 && ts.openQuestions.length === 0)) {
    return '<div class="status-empty">等待第一条输入…</div>';
  }

  const sections = [
    { label:'推理依据', items:ts.reasoningBasis, dot:'var(--mf-accent)' },
    { label:'隐含假设', items:ts.implicitAssumptions, dot:'var(--mf-warning)' },
    { label:'关键转折', items:ts.keyTurningPoints, dot:'var(--mf-info)' },
    { label:'放弃的岔路', items:ts.abandonedPaths, dot:'var(--mf-ink-faint)', strikethrough:true },
    { label:'未决问题', items:ts.openQuestions, dot:'var(--mf-danger)' },
    { label:'建议下一步', items:ts.suggestedNext, dot:'var(--mf-accent)' },
  ];

  let html = '<div data-dom-id="status-board">';
  sections.forEach(s => {
    if (!s.items || s.items.length === 0) return;
    html += `<div class="status-section">
      <div class="status-label"><span class="status-label-dot" style="background:${s.dot}"></span>${s.label}</div>
      ${s.items.map((item, i) => `<div class="status-item ${s.strikethrough ? 'strikethrough' : ''} ${item._new ? 'new' : ''}">${item.content || item.description}</div>`).join('')}
    </div>`;
  });
  html += '</div>';
  return html;
}

function renderTimeline(thread) {
  if (thread.fragments.length === 0) return '<div class="status-empty">还没有输入…</div>';
  let html = '<div class="timeline" data-dom-id="timeline-view">';
  let lastDate = null;
  thread.fragments.forEach((f, i) => {
    const fDate = new Date(f.createdAt);
    const dateKey = fDate.toDateString();
    if (lastDate && dateKey !== lastDate) {
      html += `<div class="timeline-day-boundary"><span class="timeline-day-label">${fDate.getMonth()+1}月${fDate.getDate()}日</span></div>`;
    }
    lastDate = dateKey;
    html += `<div class="timeline-item">
      ${i < thread.fragments.length - 1 ? '<div class="timeline-line"></div>' : ''}
      <div class="timeline-dot"></div>
      <div class="timeline-time">${fDate.toLocaleString('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div>
      <div class="timeline-text">${f.content.length > 100 ? f.content.slice(0,100) + '…' : f.content}</div>
    </div>`;
  });
  html += '</div>';
  return html;
}

function renderMap(thread) {
  const ts = thread.thinkingState;
  if (!ts) return '<div class="status-empty">等待第一条输入…</div>';
  const sections = [
    { label:'推理依据', items:ts.reasoningBasis },
    { label:'隐含假设', items:ts.implicitAssumptions },
    { label:'关键转折', items:ts.keyTurningPoints },
    { label:'未决问题', items:ts.openQuestions },

  let html = '<div data-dom-id="map-view">';
  sections.forEach(s => {
    if (!s.items || s.items.length === 0) return;
    html += `<div class="map-section"><div class="map-label">${s.label}</div>`;
    s.items.forEach((item, i) => { html += `<div class="map-item">${item.content || item.description}</div>`; });

  html += '</div>';
  return html;
}

// ===== Actions =====
function closeTour(e) {
  if (e && e.target !== e.currentTarget && e.type === 'click') return;
  state.showTour = false;
  render();
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', cur === 'dawn' ? 'night' : 'dawn');
}

function selectThread(id) {
  const t = state.threads.find(x => x.id === id);
  if (!t) return;
  state.activeThreadId = id;
  if (t.status === 'paused' && t.snapshot) {
    state.mode = 'recovery';
  } else {
    state.mode = 'dump';
  }
  render();
}

function createThread() {
  const input = document.getElementById('new-thread-question');
  const q = input?.value.trim();
  if (!q) return;
  const newThread = {
    id: 't' + Date.now(),
    coreQuestion: q,
    status: 'active',
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString(),
    fragments: [],
    thinkingState: { reasoningBasis:[], implicitAssumptions:[], keyTurningPoints:[], openQuestions:[], abandonedPaths:[], suggestedNext:[] },
    snapshot: null,
  };
  state.threads.unshift(newThread);
  state.activeThreadId = newThread.id;
  state.mode = 'dump';
  state.showNewDialog = false;
  render();
  showToast('新线程已创建，开始倾倒你的思考');
}

function continueThinking() {
  const t = state.threads.find(x => x.id === state.activeThreadId);
  if (t) { t.status = 'active'; }
  state.mode = 'dump';
  render();
}

function submitInput() {
  const textarea = document.getElementById('dump-input');
  if (!textarea) return;
  const text = textarea.value.trim();
  if (!text) return;

  const t = state.threads.find(x => x.id === state.activeThreadId);
  if (!t) return;

  // Add fragment
  t.fragments.push({
    id: 'f' + Date.now(),
    content: text,
    inputType: 'text',
    createdAt: new Date().toISOString(),
  });
  t.updatedAt = new Date().toISOString();
  textarea.value = '';
  autoResize(textarea);
  render();
  scrollDumpToBottom();

  // Simulate AI structuring with keyword routing
  state.aiThinking = true;
  render();
  scrollDumpToBottom();

  setTimeout(() => {
    state.aiThinking = false;
    // 基于关键词路由引擎分析用户输入
    const extraction = analyzeInput(text);
    const newItem = { id: 'item' + Date.now(), content: extraction.content, _new: true };
    if (t.thinkingState[extraction.field]) {
      t.thinkingState[extraction.field].push(newItem);
    }
    render();
    scrollDumpToBottom();
    showToast('AI 已提取到「' + extraction.label + '」');
  }, 2000);
}

function handleInputKey(e) {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
    e.preventDefault();
    submitInput();
  }
  // Check for @ai
  setTimeout(() => {
    const val = e.target.value;
    if (val.trim().toLowerCase() === '@ai') {
      e.target.value = '';
      state.showSummon = true;
      render();
    }
  }, 0);
}

function executeSummon(type) {
  state.showSummon = false;
  const t = state.threads.find(x => x.id === state.activeThreadId);
  if (!t) return;

  const response = generateSummonResponse(type, t);
  const labels = { outline:'梳理脉络', blindspot:'找盲点', weigh:'权衡选项', crosslink:'关联线程' };

  // Add AI thinking
  state.aiThinking = true;
  render();
  scrollDumpToBottom();

  setTimeout(() => {
    state.aiThinking = false;
    t.fragments.push({
      id: 'f' + Date.now(),
      content: response,
      inputType: 'summon_response',
      createdAt: new Date().toISOString(),
      _summonType: type,
    });
    render();
    scrollDumpToBottom();
    showToast('AI · ' + labels[type] + ' 已回应');
  }, 2500);
}

function pauseThread() {
  const t = state.threads.find(x => x.id === state.activeThreadId);
  if (!t) return;

  // Generate snapshot from current state
  const ts = t.thinkingState;
  t.snapshot = {
    oneLineProgress: ts.keyTurningPoints.length > 0
      ? ts.keyTurningPoints[ts.keyTurningPoints.length - 1].content
      : (ts.reasoningBasis[0]?.content || '思考进行中'),
    keyTurningPoints: ts.keyTurningPoints.map(k => k.content),
    openQuestions: ts.openQuestions.map(q => q.content),
    nextStepDirection: ts.suggestedNext.length > 0
      ? ts.suggestedNext[0].content
      : '继续深入思考当前问题',
  };
  t.status = 'paused';
  state.showSnapshot = true;
  render();
}

function toggleVoice() {
  state.voiceRecording = !state.voiceRecording;
  if (state.voiceRecording) {
    showToast('录音中…（Demo 模拟）');
    setTimeout(() => {
      if (state.voiceRecording) {
        state.voiceRecording = false;
        const t = state.threads.find(x => x.id === state.activeThreadId);
        if (t) {
          // 基于线程上下文生成模拟语音转写内容（8 套模板，覆盖不同思维状态）
          const topic = t.coreQuestion.slice(0, 15);
          const voiceSamples = [
            `补充一点：${topic}…这个方向可能还需要从用户实际行为数据来验证，不能只靠推理。`,
            `突然想到，我们是不是默认了所有用户都有同样的使用频率？也许应该考虑不同用户画像下的差异。`,
            `等一下，刚才的推理有个漏洞——如果前提条件不成立，后面的结论就站不住脚了。需要重新审视一下。`,
            `但是换个角度看，如果我们把问题拆得更细，也许不需要一次性解决全部，先解决最核心的那个子问题就够了。`,
            `为什么之前没人想到这个方案？是因为技术上做不到，还是因为思路被现有框架限制了？这个假设值得质疑。`,
            `刚才想到的关键转折被验证了——${topic}的核心矛盾不在量，而在质。接下来的方向应该围绕"如何定义质"展开。`,
            `排除掉"全量推进"这个路径，风险太大了。不如先做一个最小验证，用结果来决定下一步。`,
            `下一步应该去找 2-3 个真实用户做深度访谈，看看他们对"${topic}"的实际感受，而不是继续在纸面上推理。`,
          ];
          const sample = voiceSamples[Math.floor(Math.random() * voiceSamples.length)];
          t.fragments.push({
            id: 'f' + Date.now(),
            content: sample,
            inputType: 'voice',
            createdAt: new Date().toISOString(),
          });
          // 也触发关键词路由
          const extraction = analyzeInput(sample);
          const newItem = { id: 'item' + Date.now(), content: extraction.content, _new: true };
          if (t.thinkingState[extraction.field]) {
            t.thinkingState[extraction.field].push(newItem);
          }
          render();
          scrollDumpToBottom();
          showToast('语音转写完成 · AI 已提取到「' + extraction.label + '」');
        }
      }
    }, 3000);
  }
  render();
}

// ===== Utils =====
function formatDate(dateStr) {
  const d = new Date(dateStr);
  const now = new Date();
  const diff = now.getTime() - d.getTime();
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff/60000) + '分钟前';
  if (d.toDateString() === now.toDateString()) return `今天 ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
  return `${d.getMonth()+1}/${d.getDate()}`;
}

function getTimeSpan(dateStr) {
  const d = new Date(dateStr);
  const now = new Date();
  const diff = now.getTime() - d.getTime();
  const hours = Math.floor(diff / 3600000);
  const minutes = Math.floor((diff % 3600000) / 60000);
  if (hours > 24) {
    const days = Math.floor(hours / 24);
    return `距离上次思考 ${days} 天 ${hours % 24} 小时`;
  }
  if (hours > 0) return `距离上次思考 ${hours} 小时 ${minutes} 分钟`;
  return `距离上次思考 ${minutes} 分钟`;
}

function getFieldLabel(field) {
  const labels = { reasoningBasis:'推理依据', implicitAssumptions:'隐含假设', keyTurningPoints:'关键转折', openQuestions:'未决问题', abandonedPaths:'放弃的岔路', suggestedNext:'建议下一步' };
  return labels[field] || field;
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 200) + 'px';
}

function scrollDumpToBottom() {
  setTimeout(() => {
    const el = document.getElementById('dump-scroll');
    if (el) el.scrollTop = el.scrollHeight;
  }, 50);
}

function showToast(msg) {
  // Remove existing toast
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

function attachEvents() {
  // Auto-resize textarea on render
  const ta = document.getElementById('dump-input');
  if (ta) autoResize(ta);
}

// ===== Init =====
render();
</script>
