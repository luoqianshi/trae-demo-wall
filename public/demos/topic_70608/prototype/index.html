<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>暖伴 NuanBan · 陪诊H5应用原型导航</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <script src="js/icons.js"></script>
  <style>
    body { background: var(--color-bg); }
    .nav-hero {
      background: var(--gradient-warm);
      padding: 48px 32px 64px;
      color: #fff;
      position: relative;
      overflow: hidden;
    }
    .nav-hero::after {
      content: '';
      position: absolute;
      right: -60px;
      top: -60px;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: rgba(242, 153, 74, 0.2);
      filter: blur(40px);
    }
    .nav-hero__brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .nav-hero__logo {
      width: 48px;
      height: 48px;
      background: rgba(255,255,255,0.15);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
      color: #fff;
      backdrop-filter: blur(10px);
    }
    .nav-hero__name { font-size: 28px; font-weight: 700; }
    .nav-hero__slogan { font-size: 15px; opacity: 0.9; margin-top: 4px; }
    .nav-hero__badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(255,255,255,0.15);
      border-radius: 999px;
      font-size: 13px;
      margin-top: 16px;
    }
    .nav-container {
      max-width: 960px;
      margin: -32px auto 0;
      padding: 0 24px 80px;
      position: relative;
      z-index: 2;
    }
    .nav-section {
      background: var(--color-card);
      border-radius: 20px;
      padding: 28px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-md);
    }
    .nav-section__head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--color-divider);
    }
    .nav-section__icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .nav-section__title { font-size: 20px; font-weight: 700; }
    .nav-section__desc { font-size: 13px; color: var(--color-text-3); margin-top: 2px; }
    .page-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
    }
    .page-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      background: var(--color-bg-2);
      border-radius: 12px;
      text-decoration: none;
      color: var(--color-text-1);
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s var(--ease-out);
      border: 1.5px solid transparent;
    }
    .page-link:hover {
      background: var(--color-primary-soft);
      border-color: var(--color-primary-mute);
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }
    .page-link__id {
      font-family: var(--font-num);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      background: var(--color-primary-soft);
      color: var(--color-primary-deep);
      flex-shrink: 0;
    }
    .page-link--escort .page-link__id { background: var(--color-accent-soft); color: var(--color-accent-deep); }
    .page-link--admin .page-link__id { background: var(--color-info-soft); color: var(--color-info); }
    .nav-footer {
      text-align: center;
      padding: 32px;
      color: var(--color-text-3);
      font-size: 13px;
    }
  </style>
</head>
<body>

<div class="nav-hero">
  <div class="nav-hero__brand">
    <div class="nav-hero__logo">暖</div>
    <div>
      <div class="nav-hero__name">暖伴 NuanBan</div>
      <div class="nav-hero__slogan">就医路上,温暖相伴</div>
    </div>
  </div>
  <div class="nav-hero__badge">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
    商业级H5应用原型 · 煦光设计系统
  </div>
</div>

<div class="nav-container">

  <!-- 用户端 -->
  <div class="nav-section">

      <div class="nav-section__icon" style="background:var(--gradient-warm)"><svg class="icon" viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1V9.5z"/></svg></div>
      <div>
        <div class="nav-section__title">用户端 H5</div>
        <div class="nav-section__desc">面向患者及家属 · 预约/支付/跟踪/评价</div>
      </div>
    </div>
    <div class="page-grid" id="userPages"></div>
  </div>

  <!-- 陪诊师端 -->
  <div class="nav-section">
    <div class="nav-section__head">
      <div class="nav-section__icon" style="background:var(--gradient-sunrise)"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M12 8v4M10 10h4"/></svg></div>
      <div>
        <div class="nav-section__title">陪诊师端 H5</div>
        <div class="nav-section__desc">面向陪诊师 · 接单/服务/收益/培训</div>
      </div>
    </div>
    <div class="page-grid" id="companionPages"></div>
  </div>

  <!-- 管理后台 -->
  <div class="nav-section">
    <div class="nav-section__head">
      <div class="nav-section__icon" style="background:linear-gradient(135deg,#2D9CDB,#1E7A6F)"><svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></div>
      <div>
        <div class="nav-section__title">管理后台</div>
        <div class="nav-section__desc">运营管理 · 看板/订单/财务/营销</div>
      </div>
    </div>
    <div class="page-grid" id="adminPages"></div>
  </div>

  <!-- 方案文档 -->
  <div class="nav-section">
    <div class="nav-section__head">
      <div class="nav-section__icon" style="background:var(--color-ink)"><svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
      <div>
        <div class="nav-section__title">商业方案文档</div>
        <div class="nav-section__desc">12章完整商业方案 · 行业分析/架构/运营</div>
      </div>
    </div>
    <div class="page-grid">
      <a class="page-link" href="../docs/商业方案.html" target="_blank">
        <span class="page-link__id">DOC</span>
        <span>商业方案文档(完整版)</span>
      </a>
    </div>
  </div>

</div>

<div class="nav-footer">
  暖伴 NuanBan · 煦光设计系统 · 2026<br>
  暖青绿 #1E7A6F + 晨曦橙 #F2994A
</div>

<script>
const userPages = [
  ['U-01','启动闪屏','u-splash.html'],
  ['U-02','引导页','u-onboarding.html'],
  ['U-03','首页','u-home.html'],
  ['U-04','服务选择','u-service.html'],
  ['U-05','医院科室','u-hospital.html'],
  ['U-06','陪诊师列表','u-companions.html'],
  ['U-07','陪诊师详情','u-companion-detail.html'],

  ['U-10','订单确认','u-confirm.html'],
  ['U-11','支付页','u-payment.html'],
  ['U-12','支付成功','u-pay-success.html'],
  ['U-13','服务跟踪','u-tracking.html'],
  ['U-14','节点播报','u-node-broadcast.html'],
  ['U-15','在线沟通','u-chat.html'],
  ['U-16','服务报告','u-report.html'],
  ['U-17','评价页','u-review.html'],
  ['U-18','健康档案','u-health-center.html'],
  ['U-19','订单列表','u-orders.html'],

  ['U-21','营销活动','u-promotions.html'],

  ['U-23','亲情账号','u-family.html'],
  ['U-24','帮助客服','u-help.html'],
  ['U-25','适老版首页','u-elder-home.html'],

const companionPages = [

  ['C-04','订单详情','c-order-detail.html'],

  ['C-12','消息中心','c-messages.html'],
  ['C-13','我的','c-profile.html'],
];
const adminPages = [
  ['A-01','后台登录','a-login.html'],
  ['A-02','数据看板','a-dashboard.html'],
  ['A-03','订单管理','a-orders.html'],
  ['A-04','陪诊师管理','a-companions.html'],
  ['A-05','用户管理','a-users.html'],
  ['A-06','医院科室库','a-hospitals.html'],
  ['A-07','定价管理','a-pricing.html'],
  ['A-08','营销管理','a-marketing.html'],

function renderPages(pages, extraClass='') {
  return pages.map(([id, name, url]) => `
    <a class="page-link ${extraClass}" href="pages/${url}">
      <span class="page-link__id">${id}</span>
      <span>${name}</span>
    </a>
  `).join('');
}

document.getElementById('userPages').innerHTML = renderPages(userPages);
document.getElementById('companionPages').innerHTML = renderPages(companionPages, 'page-link--escort');
document.getElementById('adminPages').innerHTML = renderPages(adminPages, 'page-link--admin');
</script>

</body>
</html>
