<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>暖伴陪诊师 · 排班管理</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <script src="../js/icons.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <style>
    .sc-body { padding: 0 16px 100px; }
    .sc-month-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 4px;
    }
    .sc-month {
      font-size: 18px; font-weight: 700;
      display: flex; align-items: center; gap: 8px;
    }
    .sc-month__nav {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--color-bg-2); color: var(--color-text-2);
      display: flex; align-items: center; justify-content: center;
    }
    .sc-month__nav .icon { width: 18px; height: 18px; }
    .sc-stat {
      display: flex; gap: 12px;
    }
    .sc-stat__item {
      font-size: 12px; color: var(--color-text-3);
      display: flex; align-items: center; gap: 4px;
    }
    .sc-stat__dot { width: 8px; height: 8px; border-radius: 50%; }

    .sc-calendar {
      background: var(--color-card);
      border-radius: 16px;
      padding: 12px;
      box-shadow: var(--shadow-card);
      margin-bottom: 16px;
    }
    .sc-week {
      display: grid; grid-template-columns: repeat(7, 1fr);
      gap: 2px; margin-bottom: 4px;
    }
    .sc-week__day {
      text-align: center; font-size: 12px; color: var(--color-text-3);
      padding: 8px 0; font-weight: 600;
    }
    .sc-days {
      display: grid; grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }
    .sc-day {
      aspect-ratio: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 3px; border-radius: 10px;
      font-size: 14px; color: var(--color-text-1);
      position: relative; cursor: pointer;
      transition: all var(--duration-fast) var(--ease-out);
    }
    .sc-day--other { color: var(--color-text-4); }
    .sc-day--today { background: var(--color-primary-soft); color: var(--color-primary-deep); font-weight: 700; }
    .sc-day--selected { background: var(--color-primary); color: #fff; font-weight: 700; }
    .sc-day--selected .sc-day__dot { background: rgba(255,255,255,0.6); }
    .sc-day__dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--color-accent);
    }
    .sc-day__dot--full { background: var(--color-success); }
    .sc-day__dot--am { background: var(--color-accent); }
    .sc-day__dot--off { background: var(--color-text-4); }

    .sc-day-detail {
      background: var(--color-card);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow-card);
      margin-bottom: 16px;
    }
    .sc-day-detail__head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }
    .sc-day-detail__date { font-size: 16px; font-weight: 700; color: var(--color-text-1); }
    .sc-day-detail__date .num { color: var(--color-primary); }
    .sc-day-detail__sub { font-size: 12px; color: var(--color-text-3); }

    .sc-slots {
      display: flex; gap: 10px; margin-bottom: 16px;
    }
    .sc-slot {
      flex: 1; padding: 14px;
      border-radius: 12px;
      border: 1.5px solid var(--color-border);
      background: var(--color-card);
      text-align: center;
      transition: all var(--duration-fast) var(--ease-out);
      cursor: pointer;
    }
    .sc-slot--active {
      border-color: var(--color-primary);
      background: var(--color-primary-soft);
    }
    .sc-slot__title { font-size: 14px; font-weight: 600; color: var(--color-text-1); margin-bottom: 4px; }
    .sc-slot--active .sc-slot__title { color: var(--color-primary-deep); }
    .sc-slot__time { font-size: 11px; color: var(--color-text-3); font-family: var(--font-num); }

    .sc-chips {
      display: flex; flex-wrap: wrap; gap: 8px;
    }
    .sc-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 8px 14px; border-radius: 999px;
      background: var(--color-bg-2); color: var(--color-text-2);
      font-size: 13px; font-weight: 500;
      border: 1.5px solid transparent;
      cursor: pointer;
    }
    .sc-chip--active {
      background: var(--color-primary-soft); color: var(--color-primary-deep);
      border-color: var(--color-primary);
    }
    .sc-chip .icon { width: 14px; height: 14px; }

    .sc-leave {
      background: var(--color-accent-soft);
      border-radius: 16px;
      padding: 16px;
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 16px;
    }
    .sc-leave__icon {
      width: 40px; height: 40px; border-radius: 12px;
      background: var(--color-accent); color: #fff;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .sc-leave__icon .icon { width: 22px; height: 22px; }
    .sc-leave__title { font-size: 14px; font-weight: 600; color: var(--color-text-1); }
    .sc-leave__desc { font-size: 12px; color: var(--color-text-3); margin-top: 2px; }
  </style>
</head>
<body>

<div class="mobile-frame">
  <div id="header"></div>

  <div class="sc-body">
    <!-- 月份切换 -->
    <div class="sc-month-head">
      <div class="sc-month">
        <span class="sc-month__nav" onclick="showToast('上个月')"><svg class="icon" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></span>
        <span>2026年7月</span>
        <span class="sc-month__nav" onclick="showToast('下个月')"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span>
      </div>
      <div class="sc-stat">
        <span class="sc-stat__item"><span class="sc-stat__dot" style="background:var(--color-success)"></span>全天</span>
        <span class="sc-stat__item"><span class="sc-stat__dot" style="background:var(--color-accent)"></span>半天</span>
        <span class="sc-stat__item"><span class="sc-stat__dot" style="background:var(--color-text-4)"></span>休息</span>
      </div>
    </div>

    <!-- 日历 -->
    <div class="sc-calendar anim-fade-up" id="calendar"></div>

    <!-- 选中日期详情 -->
    <div class="sc-day-detail anim-fade-up" id="dayDetail"></div>

    <!-- 请假申请 -->
    <div class="sc-leave anim-fade-up" onclick="showToast('请假申请已打开')">
      <div class="sc-leave__icon"><svg class="icon" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></div>
      <div style="flex:1">
        <div class="sc-leave__title">请假申请</div>
        <div class="sc-leave__desc">需休息时可提交请假,提前3天免扣分</div>
      </div>
      <span style="color:var(--color-text-3)"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span>
    </div>
  </div>

  <div id="tabbar"></div>
</div>

<script>
  document.getElementById('header').innerHTML = renderHeader('排班管理');
  document.getElementById('tabbar').innerHTML = renderCompanionTabbar('work');

  // 日历数据 (2026年7月)
  const weekDays = ['日','一','二','三','四','五','六'];
  // 7月1日是周三 (index 3),所以前面补3天6月
  const prevDays = [27,28,29,30]; // 6月底
  const monthDays = 31;
  const nextDays = 6; // 凑满42格 = 4 + 31 + 7 = 42? 4+31=35, +7=42
  // 4+31=35, need 42-35=7 next days. Actually let me use 35 grid: 4 prev + 31 = 35, perfect 5 rows.
  // Let's use 35 cells.

  // 标记某些日期的状态
  const dayStatus = {
    1: 'am', 2: 'full', 3: 'full', 4: 'am', 5: 'off',
    6: 'full', 7: 'full', 8: 'am', 9: 'full', 10: 'full',
    11: 'am', 12: 'off', 13: 'full', 14: 'full', 15: 'am',
    16: 'full', 17: 'full', 18: 'am', 19: 'full', 20: 'full',
    21: 'am', 22: 'off', 23: 'full', 24: 'full', 25: 'am',
    26: 'full', 27: 'full', 28: 'am', 29: 'full', 30: 'full', 31: 'am',
  };
  const today = 4;
  let selectedDay = today;

  function renderCalendar() {
    let html = '<div class="sc-week">';
    weekDays.forEach(d => html += `<div class="sc-week__day">${d}</div>`);
    html += '</div><div class="sc-days">';
    prevDays.forEach(d => html += `<div class="sc-day sc-day--other">${d}</div>`);
    for (let d = 1; d <= monthDays; d++) {
      const st = dayStatus[d];
      const dotClass = st === 'full' ? 'sc-day__dot--full' : st === 'am' ? 'sc-day__dot--am' : 'sc-day__dot--off';
      const cls = ['sc-day'];
      if (d === today) cls.push('sc-day--today');
      if (d === selectedDay) cls.push('sc-day--selected');
      html += `<div class="${cls.join(' ')}" onclick="selectDay(${d})">${d}<span class="sc-day__dot ${dotClass}"></span></div>`;
    }
    // 补足下月
    for (let i = 1; i <= 7; i++) html += `<div class="sc-day sc-day--other">${i}</div>`;
    html += '</div>';
    document.getElementById('calendar').innerHTML = html;
  }

  function renderDayDetail() {
    const st = dayStatus[selectedDay];
    const stText = st === 'full' ? '全天可接单' : st === 'am' ? '上午可接单' : '休息日';
    document.getElementById('dayDetail').innerHTML = `
      <div class="sc-day-detail__head">
        <div>
          <div class="sc-day-detail__date">7月<span class="num">${selectedDay}</span>日</div>
          <div class="sc-day-detail__sub">${stText} · 当前接单状态</div>
        </div>
        <span class="badge badge-${st==='off'?'alert':'success'}">${stText}</span>
      </div>
      <div class="sc-slots" id="slots">
        <div class="sc-slot ${st==='am'||st==='full'?'sc-slot--active':''}" onclick="pickSlot(this,'上午')">
          <div class="sc-slot__title">上午</div>
          <div class="sc-slot__time">08:00-12:00</div>
        </div>
        <div class="sc-slot ${st==='full'?'sc-slot--active':''}" onclick="pickSlot(this,'下午')">
          <div class="sc-slot__title">下午</div>
          <div class="sc-slot__time">13:00-18:00</div>
        </div>
        <div class="sc-slot ${st==='full'?'sc-slot--active':''}" onclick="pickSlot(this,'全天')">
          <div class="sc-slot__title">全天</div>
          <div class="sc-slot__time">08:00-18:00</div>
        </div>
      </div>
      <div style="font-size:13px;color:var(--color-text-2);margin-bottom:10px;font-weight:600">可接单服务类型</div>
      <div class="sc-chips">
        <span class="sc-chip sc-chip--active" onclick="toggleChipType(this)">${IconLib.clock}半日陪诊</span>
        <span class="sc-chip sc-chip--active" onclick="toggleChipType(this)">${IconLib.heart}全日陪诊</span>
        <span class="sc-chip" onclick="toggleChipType(this)">${IconLib.route}代办跑腿</span>
        <span class="sc-chip" onclick="toggleChipType(this)">${IconLib.shield}体检陪诊</span>
      </div>
    `;
  }

  function selectDay(d) {
    selectedDay = d;
    renderCalendar();
    renderDayDetail();
  }

  function pickSlot(el, slot) {
    el.parentElement.querySelectorAll('.sc-slot').forEach(s => s.classList.remove('sc-slot--active'));
    el.classList.add('sc-slot--active');
    showToast(`已设置${slot}接单`);
  }

  function toggleChipType(el) {
    el.classList.toggle('sc-chip--active');
    showToast(el.classList.contains('sc-chip--active') ? '已添加该服务类型' : '已移除该服务类型');
  }

  renderCalendar();
  renderDayDetail();
</script>

</body>
</html>
