<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>暖伴 · 会员中心</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <script src="../js/icons.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <style>
    .mb-hero {
      background: linear-gradient(135deg, #1E7A6F 0%, #2A9D8F 60%, #F2994A 130%);
      padding: calc(var(--safe-top) + 16px) 20px 30px;
      color: #fff;
      position: relative;
      overflow: hidden;
    }
    .mb-hero::before {
      content: '';
      position: absolute;
      right: -60px;
      top: -30px;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: rgba(242, 153, 74, 0.22);
      filter: blur(28px);
    }
    .mb-hero::after {
      content: '';
      position: absolute;
      left: -40px;
      bottom: -40px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      filter: blur(20px);
    }
    .mb-card {
      position: relative;
      z-index: 2;
      background: rgba(255,255,255,0.14);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 20px;
    }
    .mb-card__top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .mb-level {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .mb-level__badge {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #F2C94C, #F2994A);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 4px 12px rgba(242, 153, 74, 0.4);
    }
    .mb-level__badge .icon { width: 22px; height: 22px; }
    .mb-level__name { font-size: 18px; font-weight: 700; }
    .mb-level__tag { font-size: 12px; opacity: 0.85; margin-top: 2px; }
    .mb-progress {
      height: 8px;
      background: rgba(255,255,255,0.2);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .mb-progress__bar {
      height: 100%;
      background: linear-gradient(90deg, #F2C94C, #F2994A);
      border-radius: 999px;
    }
    .mb-progress__text {
      font-size: 12px;
      opacity: 0.9;
      font-family: var(--font-num);
    }
    .mb-progress__text .num { font-weight: 700; }
    .mb-body { padding: 0 16px 100px; margin-top: -16px; position: relative; z-index: 3; }
    .mb-assets {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    .mb-asset {
      background: var(--color-card);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow-card);
      text-align: center;
    }
    .mb-asset__icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--color-primary-soft);
      color: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 8px;
    }
    .mb-asset__icon--accent { background: var(--color-accent-soft); color: var(--color-accent-deep); }
    .mb-asset__value {
      font-family: var(--font-num);
      font-size: 22px;
      font-weight: 700;
      color: var(--color-text-1);
      line-height: 1;
      margin-bottom: 4px;
    }
    .mb-asset__label { font-size: 12px; color: var(--color-text-3); }
    .mb-asset__btn {
      margin-top: 8px;
      font-size: 11px;
      color: var(--color-primary);
      font-weight: 600;
    }
    .mb-section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 20px 4px 12px;
    }
    .mb-section-title h3 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .mb-section-title h3 .icon { color: var(--color-primary); }
    .mb-lv-card {
      background: var(--color-card);
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: var(--shadow-card);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }
    .mb-lv-card--current { border: 1.5px solid var(--color-accent); }
    .mb-lv-card--current::after {
      content: '当前';
      position: absolute;
      top: 8px;
      right: 12px;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      background: var(--color-accent);
      padding: 1px 8px;
      border-radius: 999px;
    }
    .mb-lv-badge {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      flex-shrink: 0;
    }
    .mb-lv-badge .icon { width: 24px; height: 24px; }
    .mb-lv-name { font-size: 15px; font-weight: 700; color: var(--color-text-1); margin-bottom: 2px; }
    .mb-lv-threshold { font-size: 12px; color: var(--color-text-3); margin-bottom: 6px; }
    .mb-lv-perks { display: flex; flex-wrap: wrap; gap: 4px; }
    .mb-perk {
      padding: 1px 8px;
      background: var(--color-bg-2);
      border-radius: 6px;
      font-size: 11px;
      color: var(--color-text-2);
    }
    .mb-perks-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .mb-perk-item {
      background: var(--color-card);
      border-radius: 12px;
      padding: 14px 8px;
      text-align: center;
      box-shadow: var(--shadow-card);
    }
    .mb-perk-item__icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--color-primary-soft);
      color: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 8px;
    }
    .mb-perk-item__icon .icon { width: 20px; height: 20px; }
    .mb-perk-item__label { font-size: 12px; color: var(--color-text-2); }
  </style>
</head>
<body>

<div class="mobile-frame">
  <div class="mb-hero">
    <div id="heroHeader"></div>
    <div class="mb-card anim-fade-up">
      <div class="mb-card__top">
        <div class="mb-level">
          <div class="mb-level__badge"><svg class="icon" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div>
          <div>
            <div class="mb-level__name">金卡会员</div>
            <div class="mb-level__tag">尊享金牌陪诊师 · 9.5折</div>
          </div>
        </div>
        <button class="btn btn-sm" style="background:rgba(255,255,255,0.2);color:#fff" onclick="showToast('会员权益说明')">权益</button>
      </div>
      <div class="mb-progress">
        <div class="mb-progress__bar" style="width:62%"></div>
      </div>
      <div class="mb-progress__text">距钻石会员还差 <span class="num">8200</span> 元消费</div>
    </div>
  </div>

  <div class="mb-body">
    <!-- 资产卡片 -->
    <div class="mb-assets">
      <div class="mb-asset anim-fade-up">
        <div class="mb-asset__icon"><svg class="icon" viewBox="0 0 24 24"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg></div>
        <div class="mb-asset__value">¥<span class="num">328</span></div>
        <div class="mb-asset__label">储值余额</div>
        <div class="mb-asset__btn" onclick="showToast('充值享额外赠送')">充值</div>
      </div>
      <div class="mb-asset anim-fade-up delay-1">
        <div class="mb-asset__icon mb-asset__icon--accent"><svg class="icon" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div>
        <div class="mb-asset__value"><span class="num">1,280</span></div>
        <div class="mb-asset__label">积分</div>
        <div class="mb-asset__btn" style="color:var(--color-accent-deep)" onclick="showToast('积分商城建设中')">兑换</div>
      </div>
    </div>

    <!-- 会员等级介绍 -->
    <div class="mb-section-title">
      <h3 id="lvTitle"></h3>
      <span class="section__more" onclick="showToast('等级规则说明')">规则</span>
    </div>
    <div id="lvList"></div>

    <!-- 会员权益 -->
    <div class="mb-section-title">
      <h3 id="perksTitle"></h3>
    </div>
    <div class="mb-perks-grid" id="perksGrid"></div>
  </div>

  <div id="tabbar"></div>
</div>

<script>
  document.getElementById('heroHeader').innerHTML = renderHeader('会员中心', { showBack: true, rightHTML: `<button class="app-header__back" style="color:#fff" onclick="showToast('会员明细')">${IconLib.bell}</button>` }).replace('class="app-header"', 'class="app-header" style="background:transparent;border:none;color:#fff"').replace('app-header__title','app-header__title" style="color:#fff');
  document.getElementById('tabbar').innerHTML = renderTabbar('member');

  document.getElementById('lvTitle').innerHTML = `${IconLib.users} 会员等级`;
  document.getElementById('perksTitle').innerHTML = `${IconLib.shield} 会员专属权益`;

  // 等级列表
  const lvIcons = ['profile','star','starFill','shield'];
  document.getElementById('lvList').innerHTML = MockData.memberLevels.map((lv, i) => `
    <div class="mb-lv-card ${lv.name==='金卡会员'?'mb-lv-card--current':''} anim-fade-up" style="animation-delay:${i*0.06}s">
      <div class="mb-lv-badge" style="background:${lv.color}">${IconLib[lvIcons[i]]}</div>
      <div style="flex:1">
        <div class="mb-lv-name">${lv.name}</div>
        <div class="mb-lv-threshold">${lv.threshold}</div>
        <div class="mb-lv-perks">
          ${lv.perks.map(p => `<span class="mb-perk">${p}</span>`).join('')}
        </div>
      </div>
    </div>
  `).join('');

  // 权益宫格
  const perks = [
    { icon: 'starFill', label: '金牌陪诊师' },
    { icon: 'coupon', label: '9.5折优惠' },
    { icon: 'refresh', label: '免费改期' },
    { icon: 'phone', label: '24h热线' },
    { icon: 'heart', label: '健康管家' },
    { icon: 'car', label: '上门服务' },
    { icon: 'shield', label: '保险保障' },
    { icon: 'gift', label: '生日礼遇' },
  ];
  document.getElementById('perksGrid').innerHTML = perks.map((p, i) => `
    <div class="mb-perk-item anim-fade-up" style="animation-delay:${i*0.04}s" onclick="showToast('${p.label}权益')">
      <div class="mb-perk-item__icon">${IconLib[p.icon]}</div>
      <div class="mb-perk-item__label">${p.label}</div>
    </div>
  `).join('');
</script>

</body>
</html>
