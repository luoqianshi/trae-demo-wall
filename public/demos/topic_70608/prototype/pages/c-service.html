<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>暖伴陪诊师 · 服务执行</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <script src="../js/icons.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <style>
    .sv-body { padding: 0 16px 120px; }
    .sv-hero {
      background: var(--gradient-warm);
      padding: 16px 20px 24px;
      color: #fff;
    }
    .sv-hero__svc { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
    .sv-hero__sub { font-size: 13px; opacity: 0.88; display: flex; align-items: center; gap: 4px; }
    .sv-hero__sub .icon { width: 14px; height: 14px; }

    .sv-fence {
      margin: -16px 16px 12px;
      background: var(--color-card);
      border-radius: 16px;
      padding: 12px 16px;
      box-shadow: var(--shadow-lg);
      display: flex; align-items: center; gap: 10px;
      position: relative; z-index: 3;
    }
    .sv-fence__icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--color-success-soft); color: var(--color-success);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .sv-fence__icon .icon { width: 20px; height: 20px; }
    .sv-fence__text { font-size: 13px; color: var(--color-text-1); font-weight: 500; }
    .sv-fence__text .num { color: var(--color-success); font-weight: 700; }

    .sv-card {
      background: var(--color-card);
      border-radius: 16px;
      padding: 20px 16px;
      box-shadow: var(--shadow-card);
      margin-bottom: 12px;
    }
    .sv-card__title {
      font-size: 15px; font-weight: 700;
      display: flex; align-items: center; gap: 6px;
      margin-bottom: 16px;
    }
    .sv-card__title .icon { color: var(--color-primary); }

    /* SVG 步骤条 */
    .sv-steps {
      display: flex; align-items: flex-start; justify-content: space-between;
      position: relative; padding: 8px 0 4px;
    }
    .sv-step {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      flex: 1; position: relative; z-index: 2;
    }
    .sv-step__circle {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: var(--color-card); border: 2px solid var(--color-border-strong);
      color: var(--color-text-3); font-size: 13px; font-weight: 700;
      font-family: var(--font-num);
    }
    .sv-step--done .sv-step__circle { background: var(--color-primary); border-color: var(--color-primary); color: #fff; }
    .sv-step--active .sv-step__circle {
      background: var(--color-accent); border-color: var(--color-accent); color: #fff;
      box-shadow: 0 0 0 4px var(--color-accent-soft);
      animation: pulse 2s infinite;
    }
    .sv-step__circle .icon { width: 16px; height: 16px; }
    .sv-step__label { font-size: 11px; color: var(--color-text-3); text-align: center; line-height: 1.3; }
    .sv-step--done .sv-step__label, .sv-step--active .sv-step__label { color: var(--color-text-1); font-weight: 600; }

    /* 节点详情列表 */
    .sv-nodes { display: flex; flex-direction: column; }
    .sv-node {
      display: flex; gap: 14px; padding-bottom: 16px; position: relative;
    }
    .sv-node:last-child { padding-bottom: 0; }
    .sv-node__left {
      display: flex; flex-direction: column; align-items: center; flex-shrink: 0;
    }
    .sv-node__dot {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: var(--color-bg-2); color: var(--color-text-3);
      border: 2px solid var(--color-border-strong);
    }
    .sv-node--done .sv-node__dot { background: var(--color-primary); border-color: var(--color-primary); color: #fff; }
    .sv-node--active .sv-node__dot { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }
    .sv-node__dot .icon { width: 15px; height: 15px; }
    .sv-node__line {
      width: 2px; flex: 1; min-height: 20px;
      background: var(--color-border); margin-top: 4px;
    }
    .sv-node--done .sv-node__line { background: var(--color-primary-mute); }
    .sv-node:last-child .sv-node__line { display: none; }
    .sv-node__body { flex: 1; padding-bottom: 4px; }
    .sv-node__head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 4px;
    }
    .sv-node__title { font-size: 14px; font-weight: 600; color: var(--color-text-1); }
    .sv-node--active .sv-node__title { color: var(--color-accent-deep); }
    .sv-node__time { font-size: 11px; color: var(--color-text-3); font-family: var(--font-num); }
    .sv-node__desc { font-size: 12px; color: var(--color-text-2); line-height: 1.5; margin-bottom: 8px; }
    .sv-node__photo {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 5px 12px; border-radius: 999px;
      background: var(--color-primary-soft); color: var(--color-primary);
      font-size: 12px; font-weight: 600;
    }
    .sv-node__photo .icon { width: 14px; height: 14px; }
    .sv-node__photo--done { background: var(--color-success-soft); color: var(--color-success); }

    .sv-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      max-width: var(--container-mobile); margin: 0 auto;
      background: var(--color-card);
      padding: 12px 16px calc(12px + var(--safe-bottom));
      box-shadow: var(--shadow-float);
      z-index: var(--z-fixed);
    }
  </style>
</head>
<body>

<div class="mobile-frame">
  <div id="header"></div>

  <div class="sv-hero">
    <div class="sv-hero__svc">半日陪诊 · 协和医院心内科</div>
    <div class="sv-hero__sub"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg> 就诊人:王*芳 · <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg> 09:00就诊</div>
  </div>

  <!-- 签到围栏提示 -->
  <div class="sv-fence anim-fade-up">
    <div class="sv-fence__icon"><svg class="icon" viewBox="0 0 24 24"><path d="M12 22s-8-7-8-13a8 8 0 0 1 16 0c0 6-8 13-8 13z"/><circle cx="12" cy="9" r="3"/></svg></div>
    <div style="flex:1">
      <div class="sv-fence__text">已进入医院电子围栏 <span class="num">120m</span></div>
      <div style="font-size:11px;color:var(--color-text-3);margin-top:2px">点击下方"签到"开始服务打卡</div>
    </div>
  </div>

  <div class="sv-body">
    <!-- SVG步骤条 -->
    <div class="sv-card anim-fade-up">
      <div class="sv-card__title" id="progTitle"></div>
      <div class="sv-steps" id="stepsBar"></div>
    </div>

    <!-- 节点详情 -->
    <div class="sv-card anim-fade-up">
      <div class="sv-card__title" id="nodesTitle"></div>
      <div class="sv-nodes" id="nodesList"></div>
    </div>
  </div>

  <div class="sv-bar">
    <button class="btn btn-primary btn-block btn-lg" id="actionBtn" onclick="completeNode()"></button>
  </div>
</div>

<script>
  document.getElementById('header').innerHTML = renderHeader('服务执行');
  document.getElementById('progTitle').innerHTML = `${IconLib.route} 服务进度`;
  document.getElementById('nodesTitle').innerHTML = `${IconLib.checkCircle} 节点打卡`;

  const nodes = [
    { key:'signin', label:'签到', icon:'location', time:'09:00', desc:'到达医院,完成电子围栏签到', done:true, photo:true },
    { key:'register', label:'挂号', icon:'file', time:'09:15', desc:'已完成挂号,序号#28', done:true, photo:true },
    { key:'wait', label:'候诊', icon:'clock', time:'09:30', desc:'当前排队第8位,预计30分钟', done:true, photo:false, active:true },
    { key:'consult', label:'就诊', icon:'doctor', time:'—', desc:'医生叫号后进入诊室陪同就诊', done:false, photo:true },
    { key:'medicine', label:'取药', icon:'pill', time:'—', desc:'缴费后前往药房取药', done:false, photo:true },
    { key:'report', label:'取报告', icon:'file', time:'—', desc:'检查报告出具后代取', done:false, photo:true },
    { key:'complete', label:'完成', icon:'checkCircle', time:'—', desc:'送就诊人安全返回,服务结束', done:false, photo:false },
  ];

  // 步骤条(精简标签)
  const stepLabels = ['签到','挂号','候诊','就诊','取药','取报告','完成'];
  document.getElementById('stepsBar').innerHTML = nodes.map((n, i) => `
    <div class="sv-step ${n.done?'sv-step--done':''} ${n.active?'sv-step--active':''}">
      <div class="sv-step__circle">${n.done?IconLib.check:(i+1)}</div>
      <div class="sv-step__label">${stepLabels[i]}</div>
    </div>
  `).join('');

  // 节点详情
  document.getElementById('nodesList').innerHTML = nodes.map(n => `
    <div class="sv-node ${n.done?'sv-node--done':''} ${n.active?'sv-node--active':''}">
      <div class="sv-node__left">
        <div class="sv-node__dot">${IconLib[n.icon]}</div>
        <div class="sv-node__line"></div>
      </div>
      <div class="sv-node__body">
        <div class="sv-node__head">
          <span class="sv-node__title">${n.label}${n.active?' (进行中)':''}</span>
          <span class="sv-node__time">${n.time}</span>
        </div>
        <div class="sv-node__desc">${n.desc}</div>
        ${n.photo ? (n.done ?
          `<span class="sv-node__photo sv-node__photo--done">${IconLib.checkCircle} 已拍照</span>` :
          `<span class="sv-node__photo" onclick="showToast('请拍摄现场照片')">${IconLib.camera} 拍照上传</span>`) : ''}
      </div>
    </div>
  `).join('');

  const actionBtn = document.getElementById('actionBtn');
  function updateActionBtn() {
    const active = nodes.find(n => n.active);
    if (active) {
      actionBtn.innerHTML = `${IconLib.check} 完成"${active.label}"节点`;
    } else {
      const next = nodes.find(n => !n.done);
      if (next) {
        actionBtn.innerHTML = `${IconLib.check} 开始"${next.label}"`;
      } else {
        actionBtn.innerHTML = `${IconLib.check} 服务已完成,提交报告`;
      }
    }
  }
  updateActionBtn();

  function completeNode() {
    const activeIdx = nodes.findIndex(n => n.active);
    if (activeIdx >= 0) {
      nodes[activeIdx].active = false;
      nodes[activeIdx].done = true;
      showToast(`"${nodes[activeIdx].label}"节点已完成`);
      if (activeIdx + 1 < nodes.length) {
        nodes[activeIdx+1].active = true;
      }
    } else {
      const nextIdx = nodes.findIndex(n => !n.done);
      if (nextIdx >= 0) {
        nodes[nextIdx].active = true;
        showToast(`开始"${nodes[nextIdx].label}"`);
      } else {
        showToast('服务已完成,前往提交报告');
        setTimeout(() => go('c-report-form.html'), 1200);
        return;
      }
    }
    // 重新渲染
    document.getElementById('stepsBar').innerHTML = nodes.map((n, i) => `
      <div class="sv-step ${n.done?'sv-step--done':''} ${n.active?'sv-step--active':''}">
        <div class="sv-step__circle">${n.done?IconLib.check:(i+1)}</div>
        <div class="sv-step__label">${stepLabels[i]}</div>
      </div>
    `).join('');
    document.getElementById('nodesList').innerHTML = nodes.map(n => `
      <div class="sv-node ${n.done?'sv-node--done':''} ${n.active?'sv-node--active':''}">
        <div class="sv-node__left">
          <div class="sv-node__dot">${IconLib[n.icon]}</div>
          <div class="sv-node__line"></div>
        </div>
        <div class="sv-node__body">
          <div class="sv-node__head">
            <span class="sv-node__title">${n.label}${n.active?' (进行中)':''}</span>
            <span class="sv-node__time">${n.time}</span>
          </div>
          <div class="sv-node__desc">${n.desc}</div>
          ${n.photo ? (n.done ?
            `<span class="sv-node__photo sv-node__photo--done">${IconLib.checkCircle} 已拍照</span>` :
            `<span class="sv-node__photo" onclick="showToast('请拍摄现场照片')">${IconLib.camera} 拍照上传</span>`) : ''}
        </div>
      </div>
    `).join('');
    updateActionBtn();
  }
</script>

</body>
</html>
