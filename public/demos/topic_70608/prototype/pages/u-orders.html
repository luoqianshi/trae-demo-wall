<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>暖伴 · 我的订单</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <script src="../js/icons.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <style>
    .od-status-tabs {
      display: flex;
      background: var(--color-card);
      position: sticky;
      top: 56px;
      z-index: 50;
      border-bottom: 1px solid var(--color-divider);
    }
    .od-status-tab {
      flex: 1;
      text-align: center;
      padding: 14px 0;
      font-size: 14px;
      font-weight: 500;
      color: var(--color-text-2);
      position: relative;
      transition: color var(--duration-fast) var(--ease-out);
    }
    .od-status-tab--active {
      color: var(--color-primary);
      font-weight: 700;
    }
    .od-status-tab--active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 28px;
      height: 3px;
      border-radius: 999px;
      background: var(--color-primary);
    }
    .od-body { padding: 12px 16px 100px; }
    .od-card {
      background: var(--color-card);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow-card);
      margin-bottom: 12px;
      transition: transform var(--duration-fast) var(--ease-out);
    }
    .od-card:active { transform: scale(0.98); }
    .od-card__top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--color-divider);
    }
    .od-card__no {
      font-family: var(--font-num);
      font-size: 12px;
      color: var(--color-text-3);
    }
    .od-card__mid {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }
    .od-card__icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--color-primary-soft);
      color: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .od-card__svc {
      font-size: 15px;
      font-weight: 600;
      color: var(--color-text-1);
      margin-bottom: 4px;
    }
    .od-card__meta {
      font-size: 12px;
      color: var(--color-text-3);
      display: flex;
      flex-wrap: wrap;
      gap: 4px 8px;
    }
    .od-card__meta span { display: inline-flex; align-items: center; gap: 3px; }
    .od-card__meta .icon { width: 13px; height: 13px; }
    .od-card__comp {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: var(--color-bg-2);
      border-radius: 12px;
      margin-bottom: 12px;
    }
    .od-card__comp-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--color-primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .od-card__comp-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text-1);
    }
    .od-card__comp-rating {
      font-size: 11px;
      color: var(--color-text-3);
      font-family: var(--font-num);
    }
    .od-card__bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .od-card__amount {
      font-size: 13px;
      color: var(--color-text-2);
    }
    .od-card__amount .price__integer { font-size: 22px; }
    .od-card__actions {
      display: flex;
      gap: 8px;
    }
    .od-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 80px 0;
      color: var(--color-text-3);
    }
    .od-empty__icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--color-bg-2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      color: var(--color-border-strong);
    }
    .od-empty__icon .icon { width: 36px; height: 36px; }
    .od-empty__title { font-size: 15px; color: var(--color-text-2); margin-bottom: 4px; }
    .od-empty__desc { font-size: 13px; color: var(--color-text-3); }
  </style>
</head>
<body>

<div class="mobile-frame">
  <div id="header"></div>

  <div class="od-status-tabs" id="statusTabs">
    <span class="od-status-tab od-status-tab--active" data-status="all">全部</span>
    <span class="od-status-tab" data-status="doing">进行中</span>
    <span class="od-status-tab" data-status="done">完成</span>
    <span class="od-status-tab" data-status="refund">退款</span>
  </div>

  <div class="od-body" id="orderList"></div>

  <div id="tabbar"></div>
</div>

<script>
  document.getElementById('header').innerHTML = renderHeader('我的订单', { rightHTML: `<button class="app-header__back" onclick="showToast('搜索订单')">${IconLib.search}</button>` });
  document.getElementById('tabbar').innerHTML = renderTabbar('order');

  // 构造订单数据
  const svcIcon = { '半日陪诊':'clock', '全日陪诊':'heart', '代办跑腿':'route', '体检陪诊':'shield' };
  const orders = [
    { id: 'NB20260704001', svc: '半日陪诊', hospital: '北京协和医院', time: '2026-07-04 09:00', companion: '李慧敏', rating: 4.9, amount: 299, status: 'in_service' },
    { id: 'NB20260704002', svc: '全日陪诊', hospital: '北京同仁医院', time: '2026-07-04 08:30', companion: '王建国', rating: 4.8, amount: 499, status: 'accepted' },
    { id: 'NB20260704005', svc: '全日陪诊', hospital: '北京阜外医院', time: '2026-07-04 11:00', companion: '', rating: 0, amount: 499, status: 'pending_pay' },
    { id: 'NB20260703004', svc: '半日陪诊', hospital: '北大第一医院', time: '2026-07-03 14:00', companion: '张丽华', rating: 4.9, amount: 299, status: 'pending_review' },
    { id: 'NB20260628112', svc: '代办跑腿', hospital: '北京天坛医院', time: '2026-06-28 10:00', companion: '陈晓东', rating: 4.7, amount: 99, status: 'completed' },
    { id: 'NB20260620108', svc: '体检陪诊', hospital: '北京协和医院', time: '2026-06-20 08:00', companion: '赵秀英', rating: 5.0, amount: 399, status: 'refunded' },
  ];

  const doingStatus = ['pending_pay','pending_accept','accepted','in_service','pending_review'];
  const statusFilter = {
    'all': () => true,
    'doing': s => doingStatus.includes(s),
    'done': s => s === 'completed',
    'refund': s => s === 'refunded',
  };

  function renderOrderCard(o) {
    const st = MockData.orderStatus[o.status];
    const compHTML = o.companion ? `
      <div class="od-card__comp">
        <div class="od-card__comp-avatar">${o.companion[0]}</div>
        <div style="flex:1">
          <div class="od-card__comp-name">${o.companion}</div>
          <div class="od-card__comp-rating">${starsHTML(o.rating, false).replace('rating__text','rating__text').replace(/<span class="rating">/,'<span class="rating" style="font-size:11px">')}</div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();go('u-chat.html')">${IconLib.message} 联系</button>
      </div>
    ` : `<div style="padding:10px 12px;background:var(--color-bg-2);border-radius:12px;margin-bottom:12px;font-size:13px;color:var(--color-text-3);text-align:center">正在为您匹配认证陪诊师…</div>`;

    let actions = '';
    if (o.status === 'pending_pay') {
      actions = `<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();showToast('订单已取消')">取消</button><button class="btn btn-accent btn-sm" onclick="event.stopPropagation();go('u-payment.html')">去支付</button>`;
    } else if (o.status === 'in_service') {
      actions = `<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();go('u-chat.html')">联系</button><button class="btn btn-primary btn-sm" onclick="event.stopPropagation();go('u-tracking.html')">查看进度</button>`;
    } else if (o.status === 'accepted') {
      actions = `<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();showToast('已呼叫陪诊师')">电话</button><button class="btn btn-primary btn-sm" onclick="event.stopPropagation();go('u-tracking.html')">查看详情</button>`;
    } else if (o.status === 'pending_review') {
      actions = `<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();showToast('已申请售后')">申请售后</button><button class="btn btn-accent btn-sm" onclick="event.stopPropagation();go('u-review.html')">去评价</button>`;
    } else if (o.status === 'completed') {
      actions = `<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();showToast('已生成服务报告')">查看报告</button><button class="btn btn-outline btn-sm" onclick="event.stopPropagation();go('u-booking.html')">再来一单</button>`;
    } else {
      actions = `<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();showToast('退款详情')">退款详情</button>`;
    }

    return `
      <div class="od-card anim-fade-up" onclick="go('u-tracking.html')">
        <div class="od-card__top">
          <span class="od-card__no">${o.id}</span>
          <span class="badge badge-${st.color}">${st.label}</span>
        </div>
        <div class="od-card__mid">
          <div class="od-card__icon">${IconLib[svcIcon[o.svc]||'heart']}</div>
          <div style="flex:1">
            <div class="od-card__svc">${o.svc}</div>
            <div class="od-card__meta">
              <span>${IconLib.hospital}${o.hospital}</span>
              <span>${IconLib.clock}${o.time}</span>
            </div>
          </div>
        </div>
        ${compHTML}
        <div class="od-card__bottom">
          <div class="od-card__amount">实付 <span class="price"><span class="price__symbol">¥</span><span class="price__integer">${o.amount}</span></span></div>
          <div class="od-card__actions">${actions}</div>
        </div>
      </div>
    `;
  }

  function renderEmpty() {
    return `
      <div class="od-empty">
        <div class="od-empty__icon">${IconLib.order}</div>
        <div class="od-empty__title">暂无相关订单</div>
        <div class="od-empty__desc">去首页预约一位暖伴陪诊师吧</div>
        <button class="btn btn-primary" style="margin-top:16px" onclick="go('u-home.html')">去预约</button>
      </div>
    `;
  }

  let currentStatus = 'all';
  function render() {
    const list = orders.filter(o => statusFilter[currentStatus](o.status));
    document.getElementById('orderList').innerHTML = list.length ? list.map(renderOrderCard).join('') : renderEmpty();
  }
  render();

  document.querySelectorAll('.od-status-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.od-status-tab').forEach(t => t.classList.remove('od-status-tab--active'));
      tab.classList.add('od-status-tab--active');
      currentStatus = tab.dataset.status;
      render();
    });
  });
</script>

</body>
</html>
