<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>暖伴 · 健康档案中心</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <script src="../js/icons.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <style>
    .hc-body { padding: 0 16px 100px; }
    .hc-tabs {
      display: flex;
      background: var(--color-card);
      border-radius: 999px;
      padding: 4px;
      margin: 12px 0 16px;
      box-shadow: var(--shadow-card);
    }
    .hc-tab {
      flex: 1;
      text-align: center;
      padding: 10px 0;
      font-size: 14px;
      font-weight: 500;
      color: var(--color-text-2);
      border-radius: 999px;
      transition: all var(--duration-fast) var(--ease-out);
    }
    .hc-tab--active {
      background: var(--gradient-warm);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(30, 122, 111, 0.28);
    }
    .hc-alert {
      background: linear-gradient(135deg, #FCE8E8 0%, #FFF6E0 100%);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      border: 1px solid rgba(235, 87, 87, 0.12);
    }
    .hc-alert__icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--color-alert);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .hc-alert__icon .icon { width: 22px; height: 22px; }
    .hc-alert__title {
      font-size: 15px;
      font-weight: 700;
      color: var(--color-alert);
      margin-bottom: 4px;
    }
    .hc-alert__desc {
      font-size: 13px;
      color: var(--color-text-2);
      line-height: 1.5;
    }
    .hc-section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 16px 4px 12px;
    }
    .hc-section-title h3 {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hc-section-title h3 .icon { color: var(--color-primary); }
    .hc-tl-card {
      background: var(--color-card);
      border-radius: 16px;
      padding: 16px 16px 4px;
      box-shadow: var(--shadow-card);
      margin-bottom: 16px;
    }
    .hc-tl-item {
      display: flex;
      gap: 12px;
      padding-bottom: 16px;
      position: relative;
    }
    .hc-tl-item:last-child { padding-bottom: 4px; }
    .hc-tl-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--color-primary);
      border: 3px solid var(--color-primary-soft);
      flex-shrink: 0;
      margin-top: 4px;
      position: relative;
      z-index: 2;
    }
    .hc-tl-item:not(:last-child)::before {
      content: '';
      position: absolute;
      left: 5px;
      top: 18px;
      bottom: 0;
      width: 2px;
      background: var(--color-primary-mute);
    }
    .hc-tl-date {
      font-family: var(--font-num);
      font-size: 12px;
      color: var(--color-text-3);
      margin-bottom: 2px;
    }
    .hc-tl-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--color-text-1);
      margin-bottom: 2px;
    }
    .hc-tl-desc {
      font-size: 13px;
      color: var(--color-text-2);
      line-height: 1.5;
    }
    .hc-tl-tag {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      margin-left: 6px;
    }
    .hc-report-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .hc-report {
      background: var(--color-card);
      border-radius: 16px;
      padding: 14px;
      box-shadow: var(--shadow-card);
      position: relative;
      transition: transform var(--duration-fast) var(--ease-out);
    }
    .hc-report:active { transform: scale(0.97); }
    .hc-report__icon {
      width: 36px;
      height: 44px;
      border-radius: 6px;
      background: var(--color-primary-soft);
      color: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }
    .hc-report__icon .icon { width: 20px; height: 20px; }
    .hc-report__name {
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text-1);
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .hc-report__meta {
      font-size: 11px;
      color: var(--color-text-3);
      font-family: var(--font-num);
    }
    .hc-report__type {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
    }
    .hc-med-item {
      background: var(--color-card);
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: var(--shadow-card);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .hc-med-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--color-accent-soft);
      color: var(--color-accent-deep);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .hc-med-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--color-text-1);
      margin-bottom: 2px;
    }
    .hc-med-meta {
      font-size: 12px;
      color: var(--color-text-3);
      display: flex;
      gap: 8px;
    }
    .hc-med-meta .num { color: var(--color-primary); font-weight: 600; }
    .hc-add-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 14px;
      border: 1.5px dashed var(--color-primary-mute);
      border-radius: 16px;
      color: var(--color-primary);
      font-size: 14px;
      font-weight: 600;
      background: var(--color-primary-soft);
      margin-top: 4px;
    }
  </style>
</head>
<body>

<div class="mobile-frame">
  <div id="header"></div>

  <div class="hc-body">
    <!-- 异常指标提醒 -->
    <div class="hc-alert anim-fade-up" id="alertCard"></div>

    <!-- Tab 切换 -->
    <div class="hc-tabs" id="hcTabs">
      <span class="hc-tab hc-tab--active" data-tab="timeline">就诊时间线</span>
      <span class="hc-tab" data-tab="report">报告库</span>
      <span class="hc-tab" data-tab="med">用药清单</span>
    </div>

    <!-- 就诊时间线 -->
    <div id="panel-timeline">
      <div class="hc-section-title" id="tlTitle"></div>
      <div class="hc-tl-card" id="timelineList"></div>
    </div>

    <!-- 报告库 -->
    <div id="panel-report" style="display:none">
      <div class="hc-section-title" id="rpTitle"></div>
      <div class="hc-report-grid" id="reportGrid"></div>
    </div>

    <!-- 用药清单 -->
    <div id="panel-med" style="display:none">
      <div class="hc-section-title" id="medTitle"></div>
      <div id="medList"></div>
      <button class="hc-add-btn" id="addMedBtn"></button>
    </div>
  </div>

  <div id="tabbar"></div>
</div>

<script>
  document.getElementById('header').innerHTML = renderHeader('健康档案中心');
  document.getElementById('tabbar').innerHTML = renderTabbar('profile');

  // 异常指标提醒
  document.getElementById('alertCard').innerHTML = `
    <div class="hc-alert__icon">${IconLib.bell}</div>
    <div style="flex:1">
      <div class="hc-alert__title">异常指标提醒</div>
      <div class="hc-alert__desc">2026-04-08 空腹血糖 <span class="num" style="color:var(--color-alert);font-weight:700">7.2</span> mmol/L 偏高,建议复查并控制饮食,可咨询内分泌科</div>
      <button class="btn btn-accent btn-sm" style="margin-top:8px" onclick="showToast('已为您推荐内分泌科陪诊师')">立即咨询</button>
    </div>
  `;

  // 区块标题
  document.getElementById('tlTitle').innerHTML = `<h3>${IconLib.clock} 就诊记录</h3><span class="section__more" onclick="showToast('时间线已按时间倒序')">最近半年</span>`;
  document.getElementById('rpTitle').innerHTML = `<h3>${IconLib.file} 检查报告</h3><span class="section__more" onclick="showToast('共6份报告')">查看全部</span>`;
  document.getElementById('medTitle').innerHTML = `<h3>${IconLib.pill} 服药管理</h3><span class="section__more">3种药品</span>`;
  document.getElementById('addMedBtn').innerHTML = `${IconLib.plus} 添加药品`;
  document.getElementById('addMedBtn').onclick = () => showToast('请扫描药盒或手动录入');

  // 时间线
  document.getElementById('timelineList').innerHTML = MockData.healthRecords.map(r => `
    <div class="hc-tl-item">
      <div class="hc-tl-dot"></div>
      <div style="flex:1">
        <div class="hc-tl-date">${r.date}</div>
        <div class="hc-tl-title">${r.hospital}<span class="hc-tl-tag" style="background:${r.type==='就诊记录'?'var(--color-primary-soft)':'var(--color-accent-soft)'};color:${r.type==='就诊记录'?'var(--color-primary-deep)':'var(--color-accent-deep)'}">${r.type}</span></div>
        <div class="hc-tl-desc">${r.dept} · ${r.summary}</div>
      </div>
    </div>
  `).join('');

  // 报告库
  const reports = [
    { name: '血常规报告', date: '2026-06-15', type: '检验' },
    { name: '心电图报告', date: '2026-06-15', type: '检查' },
    { name: '眼底检查报告', date: '2026-05-20', type: '检查' },
    { name: '血糖检测报告', date: '2026-04-08', type: '检验' },
    { name: '膝关节X光片', date: '2026-03-12', type: '影像' },
    { name: '肝肾功能报告', date: '2026-03-12', type: '检验' },
  ];
  const typeStyle = {
    '检验': ['var(--color-success-soft)', 'var(--color-success)'],
    '检查': ['var(--color-info-soft)', 'var(--color-info)'],
    '影像': ['var(--color-accent-soft)', 'var(--color-accent-deep)'],
  };
  document.getElementById('reportGrid').innerHTML = reports.map(r => {
    const [bg, c] = typeStyle[r.type];
    return `
      <div class="hc-report" onclick="showToast('正在打开${r.name}')">
        <span class="hc-report__type" style="background:${bg};color:${c}">${r.type}</span>
        <div class="hc-report__icon">${IconLib.file}</div>
        <div class="hc-report__name">${r.name}</div>
        <div class="hc-report__meta">${r.date}</div>
      </div>
    `;
  }).join('');

  // 用药清单
  document.getElementById('medList').innerHTML = MockData.medications.map(m => `
    <div class="hc-med-item">
      <div class="hc-med-icon">${IconLib.pill}</div>
      <div style="flex:1">
        <div class="hc-med-name">${m.name}</div>
        <div class="hc-med-meta">
          <span class="num">${m.dose}</span>
          <span>·</span>
          <span>${m.freq}</span>
          <span>·</span>
          <span>${m.time}</span>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
        <div class="switch ${m.remind?'switch--on':''}" onclick="toggleMedSwitch(this)">
          <div class="switch__thumb"></div>
        </div>
        <span class="med-state" style="font-size:11px;color:var(--color-text-3)">${m.remind?'已开启':'未开启'}</span>
      </div>
    </div>
  `).join('');

  function toggleMedSwitch(el) {
    el.classList.toggle('switch--on');
    const on = el.classList.contains('switch--on');
    el.nextElementSibling.textContent = on ? '已开启' : '未开启';
    showToast(`用药提醒${on?'已开启':'已关闭'}`);
  }

  // Tab 切换
  document.querySelectorAll('.hc-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.hc-tab').forEach(t => t.classList.remove('hc-tab--active'));
      tab.classList.add('hc-tab--active');
      const key = tab.dataset.tab;
      ['timeline','report','med'].forEach(k => {
        document.getElementById('panel-'+k).style.display = k === key ? 'block' : 'none';
      });
    });
  });
</script>

</body>
</html>
