<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>暖伴 · 健康档案</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <script src="../js/icons.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <style>
    .hf-body { padding: 16px; padding-bottom: 100px; }
    .hf-ocr {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--gradient-warm);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      color: #fff;
      position: relative;
      overflow: hidden;
    }
    .hf-ocr::after {
      content: '';
      position: absolute;
      right: -30px;
      bottom: -30px;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
    }
    .hf-ocr__icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .hf-ocr__icon .icon { width: 26px; height: 26px; }
    .hf-ocr__title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .hf-ocr__desc { font-size: 12px; opacity: 0.85; }
    .hf-section {
      background: var(--color-card);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-card);
    }
    .hf-section__title {
      font-size: 16px;
      font-weight: 700;
      color: var(--color-text-1);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hf-section__title .icon { width: 18px; height: 18px; color: var(--color-primary); }
    .hf-field { margin-bottom: 14px; }
    .hf-field:last-child { margin-bottom: 0; }
    .hf-field__label {
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text-2);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .hf-field__label .icon { width: 14px; height: 14px; color: var(--color-text-3); }
    .hf-input {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      background: var(--color-bg-2);
      border: 1.5px solid transparent;
      border-radius: 12px;
      font-size: 14px;
    }
    .hf-input:focus { background: var(--color-card); border-color: var(--color-primary); }
    textarea.hf-input {
      height: auto;
      min-height: 72px;
      padding: 12px 14px;
      resize: none;
      line-height: 1.6;
    }
    .hf-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .hf-med-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      background: var(--color-bg-2);
      border-radius: 12px;
      margin-bottom: 8px;
    }
    .hf-med-item__icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--color-accent-soft);
      color: var(--color-accent-deep);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .hf-med-item__icon .icon { width: 20px; height: 20px; }
    .hf-med-item__name { font-size: 14px; font-weight: 600; color: var(--color-text-1); }
    .hf-med-item__info { font-size: 12px; color: var(--color-text-3); }
    .hf-share {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: var(--color-primary-soft);
      border-radius: 14px;
    }
    .hf-share__icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--color-primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .hf-share__icon .icon { width: 22px; height: 22px; }
    .hf-share__title { font-size: 14px; font-weight: 600; color: var(--color-primary-deep); margin-bottom: 2px; }
    .hf-share__desc { font-size: 12px; color: var(--color-text-2); }
    .hf-privacy {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 12px;
      background: var(--color-bg-2);
      border-radius: 10px;
      margin-top: 12px;
    }
    .hf-privacy .icon { width: 16px; height: 16px; color: var(--color-primary); flex-shrink: 0; margin-top: 2px; }
    .hf-privacy__text { font-size: 12px; color: var(--color-text-2); line-height: 1.6; }
    .hf-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: var(--container-mobile);
      margin: 0 auto;
      padding: 12px 16px calc(12px + var(--safe-bottom));
      background: var(--color-card);
      box-shadow: var(--shadow-float);
      z-index: var(--z-fixed);
    }
  </style>
</head>
<body>

<div class="mobile-frame">
  <div id="header"></div>

  <div class="hf-body">
    <div class="hf-ocr anim-fade-up" onclick="showToast('OCR识别中...')">
      <div class="hf-ocr__icon">
        <span id="ocrIcon"></span>
      </div>
      <div style="flex:1;position:relative;z-index:1">
        <div class="hf-ocr__title">拍照识别健康信息</div>
        <div class="hf-ocr__desc">拍摄病历/药盒,自动识别填写</div>
      </div>
      <span id="ocrArrow" style="position:relative;z-index:1"></span>
    </div>

    <div class="hf-section anim-fade-up delay-1">
      <div class="hf-section__title">
        <span id="baseIcon"></span>
        基本信息
      </div>
      <div class="hf-field">
        <div class="hf-field__label">姓名</div>
        <input class="hf-input" type="text" value="王秀芳">
      </div>
      <div style="display:flex;gap:12px">
        <div class="hf-field" style="flex:1">
          <div class="hf-field__label">性别</div>
          <input class="hf-input" type="text" value="女" readonly>
        </div>
        <div class="hf-field" style="flex:1">
          <div class="hf-field__label">年龄</div>
          <input class="hf-input" type="text" value="68岁">
        </div>
      </div>
      <div class="hf-field">
        <div class="hf-field__label">血型</div>
        <div class="hf-tags" id="bloodTypes"></div>
      </div>
    </div>

    <div class="hf-section anim-fade-up delay-2">
      <div class="hf-section__title">
        <span id="medIcon"></span>
        用药史
      </div>
      <div id="medList"></div>
    </div>

    <div class="hf-section anim-fade-up delay-3">
      <div class="hf-section__title">
        <span id="allergyIcon"></span>
        过敏史
      </div>
      <div class="hf-tags" id="allergyTags"></div>
      <div class="hf-field" style="margin-top:12px">
        <textarea class="hf-input" placeholder="补充其他过敏信息..."></textarea>
      </div>
    </div>

    <div class="hf-section anim-fade-up delay-4">
      <div class="hf-section__title">
        <span id="historyIcon"></span>
        既往病史
      </div>
      <textarea class="hf-input" placeholder="请填写既往病史,如高血压、糖尿病等...">高血压5年,膝关节退行性病变2年,无手术史。</textarea>
    </div>

    <div class="hf-section anim-fade-up delay-5">
      <div class="hf-section__title">
        <span id="shareIcon"></span>
        授权共享
      </div>
      <div class="hf-share">
        <div class="hf-share__icon">
          <span id="familyIcon"></span>
        </div>
        <div style="flex:1">
          <div class="hf-share__title">共享给子女</div>
          <div class="hf-share__desc">子女可查看您的健康档案</div>
        </div>
        <div class="switch switch--on" onclick="toggleSwitch(this)">
          <div class="switch__thumb"></div>
        </div>
      </div>
      <div class="hf-privacy">
        <span id="lockIcon"></span>
        <span class="hf-privacy__text">您的健康信息采用银行级加密存储,仅授权人员可查看,暖伴承诺绝不泄露您的隐私数据。</span>
      </div>
    </div>
  </div>

  <div class="hf-footer">
    <button class="btn btn-primary btn-lg btn-block" onclick="showToast('健康档案已保存');setTimeout(()=>go('u-booking.html'),1000)">保存健康档案</button>
  </div>
</div>

<script>
  document.getElementById('header').innerHTML = renderHeader('健康档案');
  document.getElementById('ocrIcon').innerHTML = IconLib.camera;
  document.getElementById('ocrArrow').innerHTML = IconLib.arrow;
  document.getElementById('baseIcon').innerHTML = IconLib.profile;
  document.getElementById('medIcon').innerHTML = IconLib.pill;
  document.getElementById('allergyIcon').innerHTML = IconLib.shield;
  document.getElementById('historyIcon').innerHTML = IconLib.file;
  document.getElementById('shareIcon').innerHTML = IconLib.users;
  document.getElementById('familyIcon').innerHTML = IconLib.heart;
  document.getElementById('lockIcon').innerHTML = IconLib.shield;

  const bloodTypes = ['A', 'B', 'O', 'AB', '不详'];
  document.getElementById('bloodTypes').innerHTML = bloodTypes.map((b, i) =>
    `<span class="chip ${i === 1 ? 'chip--active' : ''}" onclick="toggleChip(this)">${b}型</span>`
  ).join('');

  document.getElementById('medList').innerHTML = MockData.medications.map(m => `
    <div class="hf-med-item">
      <div class="hf-med-item__icon">${IconLib.pill}</div>
      <div style="flex:1">
        <div class="hf-med-item__name">${m.name}</div>
        <div class="hf-med-item__info">${m.dose} · ${m.freq} · ${m.time}</div>
      </div>
      <span class="badge ${m.remind ? 'badge-success' : 'badge-outline'}">${m.remind ? '已提醒' : '未提醒'}</span>
    </div>
  `).join('');

  const allergies = ['青霉素', '海鲜', '花粉', '无'];
  document.getElementById('allergyTags').innerHTML = allergies.map((a, i) =>
    `<span class="chip ${i === 0 ? 'chip--active' : ''}" onclick="toggleChip(this)">${a}</span>`
  ).join('');

  function toggleChip(el) { el.classList.toggle('chip--active'); }
  function toggleSwitch(el) { el.classList.toggle('switch--on'); }
</script>

</body>
</html>
