<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>暖伴 · 引导</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <script src="../js/icons.js"></script>
  <script src="../js/app.js"></script>
  <style>
    .onb {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--color-bg);
      position: relative;
    }
    .onb__skip {
      position: absolute;
      top: calc(var(--safe-top) + 16px);
      right: 20px;
      z-index: 10;
      font-size: 14px;
      color: var(--color-text-2);
      padding: 6px 12px;
    }
    .onb__slides {
      flex: 1;
      display: flex;
      overflow: hidden;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .onb__slide {
      flex-shrink: 0;
      width: 100%;
      scroll-snap-align: start;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 32px 40px;
      text-align: center;
    }
    .onb__illustration {
      width: 220px;
      height: 220px;
      border-radius: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 40px;
      position: relative;
      overflow: hidden;
    }
    .onb__illustration--1 {
      background: linear-gradient(145deg, #E8F4F1 0%, #D4EDE7 100%);
    }
    .onb__illustration--2 {
      background: linear-gradient(145deg, #FFEDD8 0%, #FFE0BD 100%);
    }
    .onb__illustration--3 {
      background: linear-gradient(145deg, #E3F5EC 0%, #CFEEDC 100%);
    }
    .onb__illustration svg {
      width: 120px;
      height: 120px;
    }
    .onb__illustration--1 svg { color: var(--color-primary); }
    .onb__illustration--2 svg { color: var(--color-accent); }
    .onb__illustration--3 svg { color: var(--color-success); }
    .onb__illust-deco {
      position: absolute;
      border-radius: 50%;
    }
    .onb__illust-deco--1 {
      top: -20px;
      right: -20px;
      width: 80px;
      height: 80px;
      background: rgba(255,255,255,0.4);
    }
    .onb__illust-deco--2 {
      bottom: -10px;
      left: -10px;
      width: 60px;
      height: 60px;
      background: rgba(255,255,255,0.3);
    }
    .onb__title {
      font-size: 24px;
      font-weight: 700;
      color: var(--color-text-1);
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    .onb__desc {
      font-size: 15px;
      color: var(--color-text-2);
      line-height: 1.7;
      max-width: 280px;
    }
    .onb__footer {
      padding: 0 32px calc(var(--safe-bottom) + 32px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .onb__dots {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .onb__dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--color-border-strong);
      transition: all var(--duration-normal) var(--ease-out);
    }
    .onb__dot--active {
      width: 28px;
      background: var(--color-primary);
    }
    .onb__btn {
      width: 100%;
      max-width: 320px;
    }
    .onb__features {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 12px;
      color: var(--color-text-3);
    }
    .onb__features .icon {
      width: 14px;
      height: 14px;
      color: var(--color-primary);
    }
  </style>
</head>
<body>

<div class="mobile-frame">
  <div class="onb">
    <a class="onb__skip" href="u-service.html">跳过</a>

    <div class="onb__slides" id="slides">
      <div class="onb__slide">
        <div class="onb__illustration onb__illustration--1">
          <div class="onb__illust-deco onb__illust-deco--1"></div>
          <div class="onb__illust-deco onb__illust-deco--2"></div>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/>
            <path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>
            <path d="M12 8v4M10 10h4"/>
            <path d="M3 12l2-1M21 12l-2-1" opacity="0.4"/>
          </svg>
        </div>
        <h2 class="onb__title">专业陪诊 · 值得托付</h2>
        <p class="onb__desc">持证陪诊师全程陪同,护士背景、急救证书,让您安心就医,家人放心</p>
      </div>

      <div class="onb__slide">
        <div class="onb__illustration onb__illustration--2">
          <div class="onb__illust-deco onb__illust-deco--1"></div>
          <div class="onb__illust-deco onb__illust-deco--2"></div>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 7v5l3 2"/>
            <path d="M3 12h2M19 12h2M12 3v2M12 19v2" opacity="0.4"/>
          </svg>
        </div>
        <h2 class="onb__title">实时透明 · 全程可视</h2>
        <p class="onb__desc">服务节点实时推送,位置轨迹全程共享,就诊进度随时查看,费用明细一目了然</p>
      </div>

      <div class="onb__slide">
        <div class="onb__illustration onb__illustration--3">
          <div class="onb__illust-deco onb__illust-deco--1"></div>
          <div class="onb__illust-deco onb__illust-deco--2"></div>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21s-7-4.5-9.5-9C1 9 2.5 5 6 5c2 0 3.5 1 4.5 2.5C11.5 6 13 5 15 5c3.5 0 5 4 3.5 7-2.5 4.5-9.5 9-9.5 9z"/>
            <path d="M9 11l2 2 4-4" opacity="0.5"/>
          </svg>
        </div>
        <h2 class="onb__title">亲情关怀 · 温暖陪伴</h2>
        <p class="onb__desc">医嘱转述、用药提醒、报告解读,把关怀送到每一位长辈身边,让爱不缺席</p>
      </div>
    </div>

    <div class="onb__footer">
      <div class="onb__dots" id="dots"></div>
      <button class="btn btn-primary btn-lg onb__btn" id="enterBtn" onclick="onNext()">进入暖伴</button>
      <div class="onb__features" id="features"></div>
    </div>
  </div>
</div>

<script>
  let currentSlide = 0;
  const totalSlides = 3;
  const slides = document.getElementById('slides');

  function renderDots() {
    document.getElementById('dots').innerHTML = Array.from({ length: totalSlides }, (_, i) =>
      `<div class="onb__dot ${i === currentSlide ? 'onb__dot--active' : ''}"></div>`
    ).join('');
  }

  function renderFeatures() {
    const features = [
      { icon: 'shield', text: '保险保障' },
      { icon: 'checkCircle', text: '资质认证' },
      { icon: 'heart', text: '隐私保护' },
    ];
    document.getElementById('features').innerHTML = features.map(f =>
      `<span style="display:flex;align-items:center;gap:4px">${IconLib[f.icon].replace('class="icon"', 'class="icon" style="width:14px;height:14px"')}<span>${f.text}</span></span>`
    ).join('');
  }

  function updateButton() {
    const btn = document.getElementById('enterBtn');
    btn.textContent = currentSlide === totalSlides - 1 ? '进入暖伴' : '下一步';
  }

  function onNext() {
    if (currentSlide < totalSlides - 1) {
      currentSlide++;
      slides.scrollTo({ left: currentSlide * slides.clientWidth, behavior: 'smooth' });
      renderDots();
      updateButton();
    } else {
      go('u-service.html');
    }
  }

  slides.addEventListener('scroll', () => {
    const idx = Math.round(slides.scrollLeft / slides.clientWidth);
    if (idx !== currentSlide) {
      currentSlide = idx;
      renderDots();
      updateButton();
    }
  });

  renderDots();
  renderFeatures();
  updateButton();
</script>

</body>
</html>
