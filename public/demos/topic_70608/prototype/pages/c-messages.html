<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>暖伴陪诊师 · 消息中心</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <script src="../js/icons.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <style>
    .mc-body { padding: 12px 16px 100px; }
    .mc-filter { display:flex; gap:8px; overflow-x:auto; padding:12px 16px; background:var(--color-card); border-bottom:1px solid var(--color-divider); position:sticky; top:56px; z-index:50; }
    .mc-filter::-webkit-scrollbar { display:none; }
    .mc-filter .chip { white-space:nowrap; flex-shrink:0; }
    .mc-filter .chip .icon { width:14px; height:14px; }

    .mc-alert {
      background: var(--gradient-warm);
      color:#fff;
      border-radius:18px;
      padding:16px;
      box-shadow:var(--shadow-lg);
      position:relative;
      overflow:hidden;
      margin-bottom:12px;
    }
    .mc-alert::after { content:''; position:absolute; right:-36px; top:-36px; width:120px; height:120px; border-radius:50%; background:rgba(255,255,255,0.14); filter:blur(8px); }
    .mc-alert__title { display:flex; align-items:center; gap:6px; font-size:16px; font-weight:800; margin-bottom:6px; position:relative; z-index:2; }
    .mc-alert__title .icon { width:18px; height:18px; }
    .mc-alert__desc { font-size:12px; opacity:0.9; line-height:1.5; position:relative; z-index:2; }

    .mc-section { margin:16px 4px 10px; display:flex; align-items:center; justify-content:space-between; }
    .mc-section__title { display:flex; align-items:center; gap:6px; font-size:15px; font-weight:800; }
    .mc-section__title .icon { color:var(--color-primary); }
    .mc-section__more { font-size:12px; color:var(--color-text-3); }

    .mc-card { background:var(--color-card); border-radius:16px; box-shadow:var(--shadow-card); overflow:hidden; }
    .mc-item { display:flex; gap:12px; padding:14px; border-bottom:1px solid var(--color-divider); position:relative; }
    .mc-item:last-child { border-bottom:none; }
    .mc-item:active { background:var(--color-bg-2); }
    .mc-item__icon { width:42px; height:42px; border-radius:14px; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:var(--color-primary-soft); color:var(--color-primary); position:relative; }
    .mc-item__icon .icon { width:21px; height:21px; }
    .mc-item__icon--accent { background:var(--color-accent-soft); color:var(--color-accent-deep); }
    .mc-item__icon--success { background:var(--color-success-soft); color:var(--color-success); }
    .mc-item__dot { position:absolute; top:-2px; right:-2px; min-width:16px; height:16px; border-radius:999px; background:var(--color-alert); color:#fff; font-size:10px; font-family:var(--font-num); display:flex; align-items:center; justify-content:center; border:2px solid var(--color-card); }
    .mc-item__body { flex:1; min-width:0; }
    .mc-item__head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px; }
    .mc-item__title { font-size:14px; font-weight:700; color:var(--color-text-1); }
    .mc-item__time { font-size:11px; color:var(--color-text-3); font-family:var(--font-num); white-space:nowrap; }
    .mc-item__desc { font-size:12px; color:var(--color-text-2); line-height:1.45; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
    .mc-item__tags { display:flex; gap:6px; margin-top:8px; }

    .mc-chat { display:flex; align-items:center; gap:12px; padding:14px; border-bottom:1px solid var(--color-divider); }
    .mc-chat:last-child { border-bottom:none; }
    .mc-chat__avatar { width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--color-accent-soft); color:var(--color-accent-deep); font-size:18px; font-weight:800; flex-shrink:0; position:relative; }
    .mc-chat__online { position:absolute; right:1px; bottom:2px; width:10px; height:10px; border-radius:50%; background:var(--color-success); border:2px solid var(--color-card); }
    .mc-chat__body { flex:1; min-width:0; }
    .mc-chat__top { display:flex; align-items:center; justify-content:space-between; margin-bottom:3px; }
    .mc-chat__name { font-size:14px; font-weight:700; }
    .mc-chat__msg { font-size:12px; color:var(--color-text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .mc-chat__badge { min-width:18px; height:18px; border-radius:999px; background:var(--color-alert); color:#fff; font-size:10px; display:flex; align-items:center; justify-content:center; font-family:var(--font-num); margin-left:8px; }
  </style>
</head>
<body>

<div class="mobile-frame">
  <div id="header"></div>
  <div class="mc-filter" id="filterBar"></div>

  <div class="mc-body">
    <div class="mc-alert anim-fade-up">
      <div class="mc-alert__title"><svg class="icon" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg> 今日服务消息</div>
      <div class="mc-alert__desc">09:00 协和医院订单已有 3 条新提醒，集合时间与候诊信息已同步给家属。</div>
    </div>

    <div class="mc-section">
      <div class="mc-section__title" id="systemTitle"></div>
      <span class="mc-section__more" onclick="showToast('全部已读')">全部已读</span>
    </div>
    <div class="mc-card anim-fade-up" id="noticeList"></div>

    <div class="mc-section">
      <div class="mc-section__title" id="chatTitle"></div>
      <span class="mc-section__more">3个会话</span>
    </div>
    <div class="mc-card anim-fade-up" id="chatList"></div>
  </div>
</div>

<script>
  document.getElementById('header').innerHTML = renderHeader('消息中心', { rightHTML: `<button class="app-header__back" onclick="showToast('搜索消息')">${IconLib.search}</button>` });
  document.getElementById('systemTitle').innerHTML = `${IconLib.bell} 系统通知`;
  document.getElementById('chatTitle').innerHTML = `${IconLib.message} 服务沟通`;

  const filters = [
    { label:'全部', icon:'message', active:true },
    { label:'订单', icon:'order' },
    { label:'家属', icon:'users' },
    { label:'平台', icon:'shield' },
    { label:'收益', icon:'wallet' }
  ];
  document.getElementById('filterBar').innerHTML = filters.map(f => `
    <span class="chip ${f.active?'chip--active':''}" onclick="switchFilter(this)">${IconLib[f.icon]}<span>${f.label}</span></span>
  `).join('');
  function switchFilter(el) {
    document.querySelectorAll('.mc-filter .chip').forEach(c => c.classList.remove('chip--active'));
    el.classList.add('chip--active');
    showToast(`已筛选${el.innerText}`);
  }

  const notices = [
    { icon:'clock', type:'accent', title:'服务即将开始', time:'5分钟前', desc:'协和医院心内科半日陪诊将于 09:00 开始，请提前 30 分钟到达。', tags:['紧急','待处理'], unread:1 },
    { icon:'route', type:'primary', title:'路线已更新', time:'18分钟前', desc:'医院东门临时施工，建议从门诊楼南门进入，预计步行多 3 分钟。', tags:['导航'], unread:0 },
    { icon:'wallet', type:'success', title:'收益到账提醒', time:'昨天', desc:'订单 NB20260703008 已完成结算，收益 ¥223.20 已进入可提现余额。', tags:['收益'], unread:0 }
  ];
  document.getElementById('noticeList').innerHTML = notices.map(n => `
    <div class="mc-item" onclick="showToast('${n.title}')">
      <div class="mc-item__icon mc-item__icon--${n.type}">${IconLib[n.icon]}${n.unread?`<span class="mc-item__dot">${n.unread}</span>`:''}</div>
      <div class="mc-item__body">
        <div class="mc-item__head"><span class="mc-item__title">${n.title}</span><span class="mc-item__time">${n.time}</span></div>
        <div class="mc-item__desc">${n.desc}</div>
        <div class="mc-item__tags">${n.tags.map(t => `<span class="badge ${t==='紧急'?'badge-accent':'badge-primary'}">${t}</span>`).join('')}</div>
      </div>
    </div>
  `).join('');

  const chats = [
    { avatar:'王', name:'王*芳家属', time:'08:12', msg:'李老师您好，我妈妈已到医院东门附近。', unread:2, online:true },
    { avatar:'客', name:'平台客服', time:'昨天', msg:'您提交的服务报告已通过审核，感谢及时反馈。', unread:0, online:true },
    { avatar:'赵', name:'赵*明', time:'周三', msg:'明天体检陪诊需要空腹提醒吗？', unread:1, online:false }
  ];
  document.getElementById('chatList').innerHTML = chats.map(c => `
    <div class="mc-chat" onclick="showToast('打开与${c.name}的会话')">
      <div class="mc-chat__avatar">${c.avatar}${c.online?'<span class="mc-chat__online"></span>':''}</div>
      <div class="mc-chat__body">
        <div class="mc-chat__top"><span class="mc-chat__name">${c.name}</span><span class="mc-item__time">${c.time}</span></div>
        <div class="mc-chat__msg">${c.msg}</div>
      </div>
      ${c.unread?`<span class="mc-chat__badge">${c.unread}</span>`:IconLib.arrow}
    </div>
  `).join('');
</script>

</body>
</html>
