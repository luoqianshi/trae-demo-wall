<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>暖伴 · 服务跟踪</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <script src="../js/icons.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <style>
    .tk-map {
      height: 220px;
      background: var(--color-primary-soft);
      position: relative;
      overflow: hidden;
    }
    .tk-map__svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .tk-map__overlay {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .tk-map__back {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--color-card);
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tk-map__back .icon { width: 20px; height: 20px; color: var(--color-text-1); }
    .tk-map__status {
      background: var(--color-card);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      color: var(--color-accent-deep);
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tk-map__status .status-dot { width: 8px; height: 8px; background: var(--color-accent); }
    .tk-map__comp {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      background: var(--color-card);
      border-radius: 14px;
      padding: 12px;
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .tk-map__avatar {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--color-primary-soft);
      color: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      flex-shrink: 0;
      position: relative;
    }
    .tk-map__avatar::after {
      content: '';
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--color-success);
      border: 2px solid var(--color-card);
    }
    .tk-map__name { font-size: 15px; font-weight: 600; color: var(--color-text-1); margin-bottom: 2px; }
    .tk-map__loc { font-size: 12px; color: var(--color-text-3); display: flex; align-items: center; gap: 4px; }
    .tk-map__loc .icon { width: 12px; height: 12px; }
    .tk-body { padding: 16px; padding-bottom: 100px; }
    .tk-current {
      background: var(--gradient-warm);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      color: #fff;
      position: relative;
      overflow: hidden;
    }
    .tk-current::after {
      content: '';
      position: absolute;
      right: -20px;
      top: -20px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
    }
    .tk-current__label { font-size: 12px; opacity: 0.85; margin-bottom: 4px; }
    .tk-current__title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .tk-current__desc { font-size: 13px; opacity: 0.9; line-height: 1.5; }
    .tk-section {
      background: var(--color-card);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-card);
    }
    .tk-section__title {
      font-size: 16px;
      font-weight: 700;
      color: var(--color-text-1);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tk-section__title .icon { width: 18px; height: 18px; color: var(--color-primary); }
    .tk-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: var(--container-mobile);
      margin: 0 auto;
      display: flex;
      gap: 12px;
      padding: 12px 16px calc(12px + var(--safe-bottom));
      background: var(--color-card);
      box-shadow: var(--shadow-float);
      z-index: var(--z-fixed);
    }
    .tk-footer__btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 48px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
    }
    .tk-footer__btn--outline {
      background: var(--color-primary-soft);
      color: var(--color-primary-deep);
    }
    .tk-footer__btn--primary {
      background: var(--color-primary);
      color: #fff;
    }
    .tk-footer__btn .icon { width: 18px; height: 18px; }
    @keyframes moveAlong {
      0% { offset-distance: 0%; }
      100% { offset-distance: 100%; }
    }
  </style>
</head>
<body>

<div class="mobile-frame">
  <div class="tk-map">
    <svg class="tk-map__svg" viewBox="0 0 414 220" preserveAspectRatio="xMidYMid slice">
      <defs>
        <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
          <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#B8D9D3" stroke-width="0.5" opacity="0.4"/>
        </pattern>
      </defs>
      <rect width="414" height="220" fill="url(#grid)"/>
      <path d="M 40 180 Q 120 140 180 130 T 320 60" fill="none" stroke="#1E7A6F" stroke-width="3" stroke-dasharray="6 4" stroke-linecap="round" opacity="0.5"/>
      <path d="M 40 180 Q 90 155 140 138" fill="none" stroke="#1E7A6F" stroke-width="3" stroke-linecap="round"/>
      <circle cx="40" cy="180" r="8" fill="#1E7A6F"/>
      <circle cx="40" cy="180" r="14" fill="#1E7A6F" opacity="0.2"/>
      <circle cx="320" cy="60" r="10" fill="#F2994A"/>
      <circle cx="320" cy="60" r="18" fill="#F2994A" opacity="0.2"/>
      <g transform="translate(140, 138)">
        <circle r="16" fill="#fff" stroke="#1E7A6F" stroke-width="2"/>
        <text text-anchor="middle" dy="5" font-size="14" font-weight="700" fill="#1E7A6F">李</text>
      </g>
      <text x="40" y="205" font-size="10" fill="#6B6B6B">您的位置</text>
      <text x="320" y="85" font-size="10" fill="#6B6B6B">协和医院</text>
    </svg>
    <div class="tk-map__overlay">
      <div class="tk-map__back" onclick="back()">
        <span id="backIcon"></span>
      </div>
      <div class="tk-map__status">
        <span class="status-dot"></span>
        服务中
      </div>
    </div>
    <div class="tk-map__comp">
      <div class="tk-map__avatar">李</div>
      <div style="flex:1">
        <div class="tk-map__name">李慧敏</div>
        <div class="tk-map__loc">
          <span id="locIcon"></span>
          距您约800米 · 预计5分钟到达
        </div>
      </div>
      <div style="display:flex;gap:8px">
        <div style="width:36px;height:36px;border-radius:50%;background:var(--color-primary-soft);display:flex;align-items:center;justify-content:center" onclick="showToast('正在拨打电话...')">
          <span id="phoneIcon"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="tk-body">
    <div class="tk-current anim-fade-up">
      <div class="tk-current__label">当前进度</div>
      <div class="tk-current__title">候诊中</div>
      <div class="tk-current__desc">当前排队第8位,预计等待约30分钟,陪诊师将持续关注叫号情况</div>
    </div>

    <div class="tk-section anim-fade-up delay-1">
      <div class="tk-section__title">
        <span id="routeIcon"></span>
        服务进度
      </div>
      <div class="timeline" id="timeline"></div>
    </div>
  </div>

  <div class="tk-footer">
    <div class="tk-footer__btn tk-footer__btn--outline" onclick="go('u-chat.html')">
      <span id="chatIcon"></span>
      在线沟通
    </div>
    <div class="tk-footer__btn tk-footer__btn--primary" onclick="showToast('正在拨打电话...')">
      <span id="phoneIcon2"></span>
      联系陪诊师
    </div>
  </div>
</div>

<script>
  document.getElementById('backIcon').innerHTML = IconLib.back;
  document.getElementById('locIcon').innerHTML = IconLib.location;
  document.getElementById('phoneIcon').innerHTML = IconLib.phone;
  document.getElementById('routeIcon').innerHTML = IconLib.route;
  document.getElementById('chatIcon').innerHTML = IconLib.message;
  document.getElementById('phoneIcon2').innerHTML = IconLib.phone;

  document.getElementById('timeline').innerHTML = MockData.serviceNodes.map(n => `
    <div class="timeline__item">
      <div class="timeline__dot ${n.active ? 'timeline__dot--active' : (n.done ? 'timeline__dot--done' : '')}"></div>
      <div class="timeline__line ${n.done ? 'timeline__line--done' : ''}"></div>
      <div class="timeline__content">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <span class="timeline__title" style="${n.active ? 'color:var(--color-accent-deep)' : ''}">${n.label}</span>
          <span class="timeline__time">${n.time}</span>
        </div>
        <div class="timeline__desc">${n.desc}</div>
      </div>
    </div>
  `).join('');
</script>

</body>
</html>
