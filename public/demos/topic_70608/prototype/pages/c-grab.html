<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>暖伴陪诊师 · 抢单大厅</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <script src="../js/icons.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <style>
    .gr-filter {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 16px;
      background: var(--color-card);
      position: sticky;
      top: 56px;
      z-index: 50;
      border-bottom: 1px solid var(--color-divider);
      -webkit-overflow-scrolling: touch;
    }
    .gr-filter::-webkit-scrollbar { display: none; }
    .gr-filter .chip { white-space: nowrap; flex-shrink: 0; }
    .gr-filter .chip .icon { width: 14px; height: 14px; }
    .gr-body { padding: 12px 16px 100px; }
    .gr-count {
      font-size: 13px; color: var(--color-text-3);
      margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
    }
    .gr-count .num { color: var(--color-accent-deep); font-weight: 700; }
    .gr-card {
      background: var(--color-card);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow-card);
      margin-bottom: 12px;
      border-left: 4px solid var(--color-accent);
    }
    .gr-card__top {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .gr-card__tags { display: flex; gap: 6px; }
    .gr-card__time {
      font-size: 12px; color: var(--color-text-3);
      font-family: var(--font-num);
      display: flex; align-items: center; gap: 4px;
    }
    .gr-card__time .icon { width: 13px; height: 13px; }
    .gr-card__time--urgent { color: var(--color-alert); font-weight: 600; }
    .gr-card__svc {
      font-size: 16px; font-weight: 700; color: var(--color-text-1);
      margin-bottom: 8px;
    }
    .gr-card__info {
      display: flex; flex-direction: column; gap: 6px;
      padding: 12px; background: var(--color-bg-2);
      border-radius: 12px; margin-bottom: 12px;
    }
    .gr-card__row {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: var(--color-text-2);
    }
    .gr-card__row .icon { width: 16px; height: 16px; color: var(--color-text-3); flex-shrink: 0; }
    .gr-card__bottom {
      display: flex; align-items: center; justify-content: space-between;
    }
    .gr-card__amount {
      font-family: var(--font-num);
      font-weight: 800;
      color: var(--color-accent-deep);
      font-size: 22px;
    }
    .gr-card__amount .sym { font-size: 13px; font-weight: 600; }
    .gr-card__dist {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: 12px; color: var(--color-primary);
      font-weight: 600;
    }
    .gr-card__dist .icon { width: 13px; height: 13px; }
  </style>
</head>
<body>

<div class="mobile-frame">
  <div id="header"></div>

  <div class="gr-filter" id="filterBar"></div>

  <div class="gr-body">
    <div class="gr-count">
      附近 <span class="num">8</span> 单待抢 · 距您最近 <span class="num">1.2</span> km
    </div>
    <div id="grabList"></div>
  </div>

  <div id="tabbar"></div>
</div>

<script>
  document.getElementById('header').innerHTML = renderHeader('抢单大厅', { rightHTML: `<button class="app-header__back" onclick="showToast('刷新成功')">${IconLib.refresh}</button>` });
  document.getElementById('tabbar').innerHTML = renderCompanionTabbar('grab');

  const filters = [
    { label: '全部区域', icon: 'location', active: true },
    { label: '半日陪诊', icon: 'clock', active: false },
    { label: '全日陪诊', icon: 'heart', active: false },
    { label: '代办跑腿', icon: 'route', active: false },
    { label: '体检陪诊', icon: 'shield', active: false },
  ];
  document.getElementById('filterBar').innerHTML = filters.map(f => `
    <span class="chip ${f.active?'chip--active':''}" onclick="toggleChip(this)">
      ${IconLib[f.icon]}<span>${f.label}</span>${IconLib.arrowDown}
    </span>
  `).join('');
  function toggleChip(el) {
    el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('chip--active'));
    el.classList.add('chip--active');
  }

  const grabOrders = [
    { svc: '半日陪诊', hospital: '北京协和医院', dept: '心内科', time: '今天 09:00', dist: '1.2', amount: 199, tags: ['紧急','附近'], urgent: true },
    { svc: '全日陪诊', hospital: '北京同仁医院', dept: '眼科', time: '今天 08:30', dist: '2.5', amount: 399, tags: ['高价'], urgent: false },
    { svc: '代办跑腿', hospital: '北京天坛医院', dept: '取报告', time: '今天 10:00', dist: '3.8', amount: 99, tags: ['轻松'], urgent: false },
    { svc: '半日陪诊', hospital: '北大第一医院', dept: '内分泌科', time: '今天 14:00', dist: '4.1', amount: 199, tags: ['附近'], urgent: false },
    { svc: '体检陪诊', hospital: '北京阜外医院', dept: '体检中心', time: '明天 08:00', dist: '5.6', amount: 299, tags: ['预约'], urgent: false },
  ];

  document.getElementById('grabList').innerHTML = grabOrders.map((o, i) => `
    <div class="gr-card anim-fade-up" style="animation-delay:${i*0.05}s">
      <div class="gr-card__top">
        <div class="gr-card__tags">
          ${o.tags.map(t => `<span class="badge ${t==='紧急'||t==='高价'?'badge-accent':'badge-primary'}">${t}</span>`).join('')}
        </div>
        <span class="gr-card__time ${o.urgent?'gr-card__time--urgent':''}">${IconLib.clock}${o.time}</span>
      </div>
      <div class="gr-card__svc">${o.svc}</div>
      <div class="gr-card__info">
        <div class="gr-card__row">${IconLib.hospital}<span>${o.hospital} · ${o.dept}</span></div>
        <div class="gr-card__row">${IconLib.location}<span class="gr-card__dist">${o.dist} km 距您</span></div>
      </div>
      <div class="gr-card__bottom">
        <div class="gr-card__amount"><span class="sym">¥</span>${o.amount}</div>
        <button class="btn btn-accent" onclick="grabOrder('${o.svc}','${o.hospital}')">${IconLib.plus} 一键抢单</button>
      </div>
    </div>
  `).join('');

  function grabOrder(svc, hospital) {
    showToast(`抢单成功!${svc} · ${hospital}`);
    setTimeout(() => go('c-order-detail.html'), 1200);
  }
</script>

</body>
</html>
