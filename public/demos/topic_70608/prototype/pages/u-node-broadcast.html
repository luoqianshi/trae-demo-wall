<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>暖伴 · 服务节点播报</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <script src="../js/icons.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>

  <style>
    .broadcast-hero{padding:22px 18px 64px;background:var(--gradient-warm);color:#fff;position:relative;overflow:hidden}.broadcast-hero:after{content:'';position:absolute;right:-60px;top:-50px;width:180px;height:180px;border-radius:50%;background:rgba(242,153,74,.28);filter:blur(24px)}.broadcast-title{position:relative;z-index:2;margin-top:18px}.broadcast-title h1{font-size:26px;color:#fff;margin-bottom:6px}.broadcast-title p{color:rgba(255,255,255,.88)}.broadcast-body{margin-top:-42px;padding:0 16px 100px;position:relative;z-index:3}.node-card{background:var(--color-card);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow-card);border:1px solid var(--color-border)}.node-card--active{border-color:var(--color-accent);box-shadow:var(--shadow-warm)}.node-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.node-name{display:flex;align-items:center;gap:10px;font-weight:700;font-size:var(--fs-lg)}.node-icon{width:38px;height:38px;border-radius:14px;background:var(--color-primary-soft);color:var(--color-primary);display:flex;align-items:center;justify-content:center}.node-card--active .node-icon{background:var(--color-accent-soft);color:var(--color-accent-deep)}.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.photo-cell{aspect-ratio:1;border-radius:12px;background:var(--color-bg-2);display:flex;align-items:center;justify-content:center;color:var(--color-text-3);border:1px dashed var(--color-border-strong)}.note{background:var(--color-primary-soft);border-radius:16px;padding:14px;color:var(--color-primary-deep);font-weight:600;display:flex;gap:8px;align-items:flex-start}.bottom-bar{position:fixed;bottom:0;left:0;right:0;max-width:414px;margin:0 auto;background:#fff;padding:12px 16px calc(12px + var(--safe-bottom));box-shadow:var(--shadow-float);display:flex;gap:10px;z-index:300}
  </style>
</head>
<body>
<div class="mobile-frame">
  <div class="broadcast-hero">
    <button class="app-header__back" onclick="back()" style="color:#fff"><svg class="icon" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="broadcast-title anim-fade-up"><h1>服务节点播报</h1><p>陪诊师每完成一个关键节点，都会同步照片与文字给家属。</p></div>
  </div>
  <main class="broadcast-body">
    <div class="note anim-fade-up"><svg class="icon" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span>所有现场照片仅用于本次服务记录，已开启隐私脱敏与加密存储。</span></div>
    <div id="nodes" class="mt-4"></div>
  </main>
  <div class="bottom-bar"><button class="btn btn-ghost btn-block" onclick="go('u-chat.html')"><svg class="icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> 联系陪诊师</button><button class="btn btn-primary btn-block" onclick="go('u-report.html')">查看服务报告</button></div>
</div>
<script>
const photos=['挂号单','候诊区','取药单'];
document.getElementById('nodes').innerHTML=MockData.serviceNodes.slice(0,6).map((n,i)=>`<section class="node-card ${n.active?'node-card--active':''} anim-fade-up"><div class="node-head"><div class="node-name"><span class="node-icon">${n.done?IconLib.checkCircle:IconLib.clock}</span><span>${n.label}</span></div><span class="badge ${n.active?'badge-accent':n.done?'badge-success':'badge-outline'}">${n.active?'进行中':n.done?'已完成':'待开始'}</span></div><p>${n.desc}</p><div class="text-3 mt-2 num">${n.time}</div>${n.done?`<div class="photo-grid">${photos.map(p=>`<div class="photo-cell">${IconLib.camera}<span style="font-size:11px;margin-left:2px">${p}</span></div>`).join('')}</div>`:''}</section>`).join('');
</script>
</body>
</html>
