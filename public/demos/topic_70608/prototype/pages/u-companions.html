<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>暖伴 · 陪诊师列表</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <script src="../js/icons.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <style>
    .comp-body { padding: 0 16px; padding-bottom: 100px; }
    .comp-filter {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 16px;
      margin: 0 -16px;
      -webkit-overflow-scrolling: touch;
      background: var(--color-bg);
      position: sticky;
      top: 56px;
      z-index: 50;
    }
    .comp-filter::-webkit-scrollbar { display: none; }
    .comp-filter .chip { white-space: nowrap; flex-shrink: 0; }
    .comp-filter .chip .icon { width: 14px; height: 14px; }
    .comp-count {
      font-size: 13px;
      color: var(--color-text-3);
      margin: 8px 0 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .comp-count .num { color: var(--color-primary); font-weight: 700; }
    .comp-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .comp-sort {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 8px 0 12px;
    }
    .comp-sort__tabs {
      display: flex;
      gap: 16px;
    }
    .comp-sort__tab {
      font-size: 14px;
      color: var(--color-text-2);
      font-weight: 500;
      padding: 4px 0;
      position: relative;
    }
    .comp-sort__tab--active {
      color: var(--color-text-1);
      font-weight: 700;
    }
    .comp-sort__tab--active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 3px;
      border-radius: 999px;
      background: var(--color-primary);
    }
  </style>
</head>
<body>

<div class="mobile-frame">
  <div id="header"></div>

  <div class="comp-filter" id="filterBar"></div>

  <div class="comp-body">
    <div class="comp-sort">
      <div class="comp-sort__tabs" id="sortTabs">
        <span class="comp-sort__tab comp-sort__tab--active">综合推荐</span>
        <span class="comp-sort__tab">评分最高</span>
        <span class="comp-sort__tab">价格最低</span>
      </div>
    </div>
    <div class="comp-count">
      为您找到 <span class="num">5</span> 位认证陪诊师
    </div>
    <div class="comp-list" id="companionList"></div>
  </div>

  <div id="tabbar"></div>
</div>

<script>
  document.getElementById('header').innerHTML = renderHeader('陪诊师列表');
  document.getElementById('tabbar').innerHTML = renderTabbar('order');

  const filters = [
    { label: '性别', icon: 'filter' },
    { label: '医院', icon: 'hospital' },
    { label: '价格', icon: 'wallet' },
    { label: '星级', icon: 'star' },
  ];
  document.getElementById('filterBar').innerHTML = filters.map(f => `
    <span class="chip" onclick="toggleChip(this)">
      ${IconLib[f.icon] || ''}
      <span>${f.label}</span>
      ${IconLib.arrowDown}
    </span>
  `).join('');

  function toggleChip(el) {
    el.classList.toggle('chip--active');
  }

  document.getElementById('companionList').innerHTML = MockData.companions.map(c => renderCompanionCard(c)).join('');

  document.querySelectorAll('.comp-sort__tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.comp-sort__tab').forEach(t => t.classList.remove('comp-sort__tab--active'));
      tab.classList.add('comp-sort__tab--active');
    });
  });
</script>

</body>
</html>
