<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>暖伴陪诊师 · 评级权益</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <script src="../js/icons.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <style>
    .rt-hero {
      background: linear-gradient(135deg, #1E7A6F 0%, #2A9D8F 60%, #F2994A 130%);
      padding: 30px 20px 40px;
      color: #fff;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .rt-hero::before {
      content: '';
      position: absolute;
      right: -40px; top: -20px;
      width: 140px; height: 140px;
      border-radius: 50%;
      background: rgba(242, 153, 74, 0.22);
      filter: blur(24px);
    }
    .rt-stars {
      display: flex; justify-content: center; gap: 4px;
      margin-bottom: 12px; position: relative; z-index: 2;
    }
    .rt-stars .icon { width: 36px; height: 36px; color: #F2C94C; }
    .rt-level {
      font-size: 26px; font-weight: 800;
      margin-bottom: 6px; position: relative; z-index: 2;
    }
    .rt-score {
      font-size: 14px; opacity: 0.9; position: relative; z-index: 2;
      font-family: var(--font-num);
    }
    .rt-score .num { font-size: 18px; font-weight: 700; }

    .rt-body { padding: 0 16px 100px; margin-top: -24px; position: relative; z-index: 3; }
    .rt-progress-card {
      background: var(--color-card);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow-lg);
      margin-bottom: 16px;
    }
    .rt-progress__head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .rt-progress__title { font-size: 14px; font-weight: 600; color: var(--color-text-1); }
    .rt-progress__next { font-size: 12px; color: var(--color-text-3); }
    .rt-progress__next .num { color: var(--color-accent-deep); font-weight: 700; }
    .rt-progress__bar {
      height: 10px; background: var(--color-bg-2);
      border-radius: 999px; overflow: hidden; margin-bottom: 8px;
    }
    .rt-progress__fill {
      height: 100%;
      background: linear-gradient(90deg, #1E7A6F, #F2994A);
      border-radius: 999px;
    }
    .rt-progress__meta {
      display: flex; justify-content: space-between;
      font-size: 11px; color: var(--color-text-3);
    }
    .rt-progress__meta .num { color: var(--color-primary); font-weight: 700; }

    .rt-section-title {
      display: flex; align-items: center; gap: 6px;
      margin: 20px 4px 12px;
      font-size: 16px; font-weight: 700;
    }
    .rt-section-title .icon { color: var(--color-primary); }

    .rt-rule-card {
      background: var(--color-card);
      border-radius: 16px;
      padding: 4px 16px;
      box-shadow: var(--shadow-card);
      margin-bottom: 16px;
    }
    .rt-rule-row {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 0; border-bottom: 1px solid var(--color-divider);
    }
    .rt-rule-row:last-child { border-bottom: none; }
    .rt-rule-row__lv {
      font-family: var(--font-num); font-weight: 800;
      font-size: 16px; width: 56px; flex-shrink: 0;
      display: flex; align-items: center; gap: 4px;
    }
    .rt-rule-row__lv .icon { width: 16px; height: 16px; }
    .rt-rule-row__name { font-size: 14px; font-weight: 600; color: var(--color-text-1); }
    .rt-rule-row__cond { font-size: 12px; color: var(--color-text-3); margin-top: 2px; }
    .rt-rule-row__current {
      padding: 2px 10px; background: var(--color-accent);
      color: #fff; border-radius: 999px;
      font-size: 11px; font-weight: 700; flex-shrink: 0;
    }

    .rt-perks-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .rt-perk {
      background: var(--color-card);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow-card);
      position: relative;
      overflow: hidden;
    }
    .rt-perk::before {
      content: '';
      position: absolute;
      right: -20px; top: -20px;
      width: 60px; height: 60px;
      border-radius: 50%;
      background: var(--color-primary-soft);
    }
    .rt-perk__icon {
      width: 44px; height: 44px; border-radius: 12px;
      background: var(--gradient-warm); color: #fff;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 12px; position: relative; z-index: 2;
    }
    .rt-perk__icon .icon { width: 22px; height: 22px; }
    .rt-perk__title { font-size: 14px; font-weight: 700; color: var(--color-text-1); margin-bottom: 4px; position: relative; z-index: 2; }
    .rt-perk__desc { font-size: 12px; color: var(--color-text-3); line-height: 1.5; position: relative; z-index: 2; }
    .rt-perk__tag {
      position: absolute; top: 12px; right: 12px;
      padding: 2px 8px; background: var(--color-accent-soft);
      color: var(--color-accent-deep); border-radius: 6px;
      font-size: 10px; font-weight: 700; z-index: 3;
    }
  </style>
</head>
<body>

<div class="mobile-frame">
  <div id="header"></div>

  <div class="rt-hero">
    <div class="rt-stars" id="bigStars"></div>
    <div class="rt-level">金牌陪诊师</div>
    <div class="rt-score">综合评分 <span class="num">4.9</span> · 服务 <span class="num">1286</span> 单</div>
  </div>

  <div class="rt-body">
    <!-- 晋升进度 -->
    <div class="rt-progress-card anim-fade-up">
      <div class="rt-progress__head">
        <span class="rt-progress__title">晋升钻石陪诊师</span>
        <span class="rt-progress__next">还差 <span class="num">214</span> 单</span>
      </div>
      <div class="rt-progress__bar">
        <div class="rt-progress__fill" style="width:78%"></div>
      </div>
      <div class="rt-progress__meta">
        <span>当前 <span class="num">1286</span> 单</span>
        <span>目标 <span class="num">1500</span> 单</span>
      </div>
    </div>

    <!-- 评级规则 -->
    <div class="rt-section-title" id="ruleTitle"></div>
    <div class="rt-rule-card anim-fade-up" id="ruleList"></div>

    <!-- 专属权益 -->
    <div class="rt-section-title" id="perksTitle"></div>
    <div class="rt-perks-grid" id="perksGrid"></div>
  </div>

  <div id="tabbar"></div>
</div>

<script>
  document.getElementById('header').innerHTML = renderHeader('评级与权益');
  document.getElementById('tabbar').innerHTML = renderCompanionTabbar('work');
  document.getElementById('ruleTitle').innerHTML = `${IconLib.star} 评级规则`;
  document.getElementById('perksTitle').innerHTML = `${IconLib.shield} 金牌专属权益`;

  // 大星展示
  document.getElementById('bigStars').innerHTML = [1,2,3,4,5].map(i =>
    `<span>${i<=4?IconLib.starFill:IconLib.star}</span>`
  ).join('').replace(/class="icon"/g, 'class="icon" fill="currentColor" stroke="none"');

  // 评级规则
  const levels = [
    { stars: 1, name: '见习陪诊师', cond: '入驻即可', color: '#9A9A9A', current: false },
    { stars: 2, name: '初级陪诊师', cond: '完成50单 · 评分≥4.0', color: '#B0ABA3', current: false },
    { stars: 3, name: '银牌陪诊师', cond: '完成300单 · 评分≥4.5', color: '#B0ABA3', current: false },
    { stars: 4, name: '金牌陪诊师', cond: '完成1000单 · 评分≥4.8', color: '#F2C94C', current: true },
    { stars: 5, name: '钻石陪诊师', cond: '完成1500单 · 评分≥4.9', color: '#2D9CDB', current: false },
  ];
  document.getElementById('ruleList').innerHTML = levels.map(l => `
    <div class="rt-rule-row">
      <div class="rt-rule-row__lv" style="color:${l.color}">
        ${l.stars}<span style="font-size:11px">★</span>
      </div>
      <div style="flex:1">
        <div class="rt-rule-row__name">${l.name}</div>
        <div class="rt-rule-row__cond">${l.cond}</div>
      </div>
      ${l.current ? '<span class="rt-rule-row__current">当前</span>' : ''}
    </div>
  `).join('');

  // 权益卡片
  const perks = [
    { icon: 'route', title: '优先派单', desc: '高价值订单优先推送给金牌及以上', tag: '已享' },
    { icon: 'wallet', title: '高单价', desc: '可接500元以上高端订单', tag: '已享' },
    { icon: 'shield', title: '培训补贴', desc: '每月专项培训享全额补贴', tag: '已享' },
    { icon: 'star', title: '专属客服', desc: '7×24h专属客服一对一', tag: '已享' },
    { icon: 'gift', title: '节日礼遇', desc: '节日专属礼品与奖金', tag: '已享' },
    { icon: 'car', title: '交通补贴', desc: '异地订单享额外交通补贴', tag: '已享' },
  ];
  document.getElementById('perksGrid').innerHTML = perks.map((p, i) => `
    <div class="rt-perk anim-fade-up" style="animation-delay:${i*0.05}s">
      <span class="rt-perk__tag">${p.tag}</span>
      <div class="rt-perk__icon">${IconLib[p.icon]}</div>
      <div class="rt-perk__title">${p.title}</div>
      <div class="rt-perk__desc">${p.desc}</div>
    </div>
  `).join('');
</script>

</body>
</html>
