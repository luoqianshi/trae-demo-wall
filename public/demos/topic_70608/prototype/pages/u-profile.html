<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>暖伴 · 我的</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <script src="../js/icons.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <style>
    .pf-hero {
      background: linear-gradient(135deg, #1E7A6F 0%, #2A9D8F 100%);
      padding: calc(var(--safe-top) + 20px) 20px 60px;
      color: #fff;
      position: relative;
      overflow: hidden;
    }
    .pf-hero::before {
      content: '';
      position: absolute;
      right: -50px;
      top: -20px;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: rgba(242, 153, 74, 0.2);
      filter: blur(26px);
    }
    .pf-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 2;
      margin-bottom: 24px;
    }
    .pf-topbar__title { font-size: 17px; font-weight: 600; }
    .pf-topbar__btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pf-topbar__btn .icon { width: 18px; height: 18px; }
    .pf-user {
      display: flex;
      align-items: center;
      gap: 14px;
      position: relative;
      z-index: 2;
    }
    .pf-user__avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #F2C94C, #F2994A);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 700;
      border: 3px solid rgba(255,255,255,0.3);
    }
    .pf-user__name { font-size: 20px; font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
    .pf-user__badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 10px;
      background: linear-gradient(135deg, #F2C94C, #F2994A);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }
    .pf-user__badge .icon { width: 12px; height: 12px; }
    .pf-user__sub { font-size: 13px; opacity: 0.85; }
    .pf-user__arrow { margin-left: auto; opacity: 0.7; }
    .pf-user__arrow .icon { width: 20px; height: 20px; }

    .pf-body { padding: 0 16px 100px; margin-top: -36px; position: relative; z-index: 3; }
    .pf-orders {
      background: var(--color-card);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow-lg);
      margin-bottom: 16px;
    }
    .pf-orders__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .pf-orders__title { font-size: 15px; font-weight: 700; color: var(--color-text-1); }
    .pf-orders__more { font-size: 12px; color: var(--color-text-3); display: flex; align-items: center; gap: 2px; }
    .pf-orders__grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .pf-orders__item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 8px 0;
      position: relative;
    }
    .pf-orders__icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--color-bg-2);
      color: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pf-orders__icon .icon { width: 22px; height: 22px; }
    .pf-orders__label { font-size: 12px; color: var(--color-text-2); }
    .pf-orders__badge {
      position: absolute;
      top: 0;
      right: 18px;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 999px;
      background: var(--color-alert);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-num);
    }
    .pf-grid {
      background: var(--color-card);
      border-radius: 16px;
      padding: 8px 0;
      box-shadow: var(--shadow-card);
      margin-bottom: 16px;
    }
    .pf-grid__item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      transition: background var(--duration-fast) var(--ease-out);
    }
    .pf-grid__item:active { background: var(--color-bg-2); }
    .pf-grid__icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--color-primary-soft);
      color: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .pf-grid__icon .icon { width: 20px; height: 20px; }
    .pf-grid__icon--accent { background: var(--color-accent-soft); color: var(--color-accent-deep); }
    .pf-grid__label { flex: 1; font-size: 14px; color: var(--color-text-1); font-weight: 500; }
    .pf-grid__value { font-size: 12px; color: var(--color-text-3); }
    .pf-grid__arrow { color: var(--color-text-4); }
    .pf-grid__arrow .icon { width: 16px; height: 16px; }
    .pf-trust {
      display: flex;
      align-items: center;
      justify-content: space-around;
      background: var(--color-primary-soft);
      border-radius: 16px;
      padding: 14px 12px;
      margin-bottom: 16px;
    }
    .pf-trust__item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .pf-trust__icon { width: 28px; height: 28px; color: var(--color-primary); }
    .pf-trust__label { font-size: 11px; color: var(--color-primary-deep); font-weight: 600; }
  </style>
</head>
<body>

<div class="mobile-frame">
  <div class="pf-hero">
    <div class="pf-topbar">
      <span class="pf-topbar__title">我的</span>
      <div style="display:flex;gap:8px">
        <div class="pf-topbar__btn" onclick="showToast('扫一扫')"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></div>
        <div class="pf-topbar__btn" onclick="go('u-help.html')"><svg class="icon" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></div>
      </div>
    </div>
    <div class="pf-user anim-fade-up" onclick="go('u-member.html')">
      <div class="pf-user__avatar">王</div>
      <div style="flex:1">
        <div class="pf-user__name">
          王秀芳
          <span class="pf-user__badge"><svg class="icon" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>金卡</span>
        </div>
        <div class="pf-user__sub">手机 138****8866 · 已实名认证</div>
      </div>
      <span class="pf-user__arrow"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span>
    </div>
  </div>

  <div class="pf-body">
    <!-- 订单快捷入口 -->
    <div class="pf-orders anim-fade-up">
      <div class="pf-orders__head">
        <span class="pf-orders__title">我的订单</span>
        <span class="pf-orders__more" onclick="go('u-orders.html')">全部订单 <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span>
      </div>
      <div class="pf-orders__grid" id="orderGrid"></div>
    </div>

    <!-- 信任背书 -->
    <div class="pf-trust anim-fade-up">
      <div class="pf-trust__item">
        <div class="pf-trust__icon"><svg class="icon" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
        <div class="pf-trust__label">实名认证</div>
      </div>
      <div class="pf-trust__item">
        <div class="pf-trust__icon"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="9 12 12 15 16 10"/></svg></div>
        <div class="pf-trust__label">保险保障</div>
      </div>
      <div class="pf-trust__item">
        <div class="pf-trust__icon"><svg class="icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></div>
        <div class="pf-trust__label">隐私保护</div>
      </div>
      <div class="pf-trust__item">
        <div class="pf-trust__icon"><svg class="icon" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></div>
        <div class="pf-trust__label">极速退款</div>
      </div>
    </div>

    <!-- 功能宫格 -->
    <div class="pf-grid anim-fade-up" id="funcGrid"></div>
  </div>

  <div id="tabbar"></div>
</div>

<script>
  document.getElementById('tabbar').innerHTML = renderTabbar('profile');

  // 订单快捷入口
  const orderShortcuts = [
    { icon: 'wallet', label: '待支付', badge: '1', url: 'u-orders.html' },
    { icon: 'clock', label: '进行中', badge: '2', url: 'u-orders.html' },
    { icon: 'star', label: '待评价', badge: '1', url: 'u-review.html' },
    { icon: 'order', label: '全部', badge: '', url: 'u-orders.html' },
  ];
  document.getElementById('orderGrid').innerHTML = orderShortcuts.map(o => `
    <div class="pf-orders__item" onclick="go('${o.url}')">
      <div class="pf-orders__icon">${IconLib[o.icon]}</div>
      ${o.badge ? `<span class="pf-orders__badge">${o.badge}</span>` : ''}
      <span class="pf-orders__label">${o.label}</span>
    </div>
  `).join('');

  // 功能宫格
  const funcs = [
    { icon: 'file', label: '健康档案', accent: false, url: 'u-health-center.html' },
    { icon: 'users', label: '亲情账号', accent: false, url: 'u-family.html' },
    { icon: 'coupon', label: '优惠券', accent: true, url: 'u-promotions.html' },
    { icon: 'member', label: '会员中心', accent: false, url: 'u-member.html' },
    { icon: 'wallet', label: '我的钱包', accent: false, url: 'u-member.html' },
    { icon: 'gift', label: '邀请有礼', accent: true, url: 'u-promotions.html' },
    { icon: 'message', label: '在线客服', accent: false, url: 'u-help.html' },
    { icon: 'phone', label: '24h热线', accent: true, url: 'u-help.html' },
    { icon: 'settings', label: '设置', accent: false, url: 'javascript:showToast("设置中心")' },
    { icon: 'shield', label: '隐私与安全', accent: false, url: 'javascript:showToast("隐私设置")' },
  ];
  let funcHTML = funcs.map(f => `
    <div class="pf-grid__item" onclick="go('${f.url}')">
      <div class="pf-grid__icon ${f.accent?'pf-grid__icon--accent':''}">${IconLib[f.icon]}</div>
      <span class="pf-grid__label">${f.label}</span>
      <span class="pf-grid__arrow">${IconLib.arrow}</span>
    </div>
  `).join('');
  // 长辈模式开关行
  funcHTML += `
    <div class="pf-grid__item">
      <div class="pf-grid__icon pf-grid__icon--accent">${IconLib.users}</div>
      <span class="pf-grid__label">长辈模式</span>
      <div class="switch" id="elderSwitch" onclick="toggleElderMode();updateElderSwitch()">
        <div class="switch__thumb"></div>
      </div>
    </div>
  `;
  document.getElementById('funcGrid').innerHTML = funcHTML;

  function updateElderSwitch() {
    const sw = document.getElementById('elderSwitch');
    const isElder = document.documentElement.getAttribute('data-theme') === 'elder';
    sw.classList.toggle('switch--on', isElder);
  }
  // 初始化开关状态
  setTimeout(updateElderSwitch, 0);
</script>

</body>
</html>
