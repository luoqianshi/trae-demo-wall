<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>暖伴陪诊师 · 导航与就诊指引</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <script src="../js/icons.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <style>
    .ng-body { padding: 12px 16px 112px; }
    .ng-hero {
      background: var(--gradient-warm);
      padding: 18px 20px 28px;
      color: #fff;
      position: relative;
      overflow: hidden;
    }
    .ng-hero::before {
      content: '';
      position: absolute;
      right: -46px; top: -32px;
      width: 150px; height: 150px;
      border-radius: 50%;
      background: rgba(242, 153, 74, 0.2);
      filter: blur(24px);
    }
    .ng-hero__tag { display:inline-flex; align-items:center; gap:4px; padding:4px 10px; border-radius:999px; background:rgba(255,255,255,0.18); font-size:12px; font-weight:600; position:relative; z-index:2; margin-bottom:10px; }
    .ng-hero__tag .icon { width:14px; height:14px; }
    .ng-hero__title { font-size:20px; font-weight:800; position:relative; z-index:2; margin-bottom:6px; }
    .ng-hero__sub { font-size:13px; opacity:0.9; position:relative; z-index:2; line-height:1.5; }

    .ng-map {
      margin-top: -16px;
      background: linear-gradient(135deg, #F8EEDC 0%, #E8F4F1 100%);
      border-radius: 18px;
      height: 176px;
      box-shadow: var(--shadow-lg);
      position: relative;
      overflow: hidden;
    }
    .ng-map::before, .ng-map::after { content:''; position:absolute; background:rgba(255,255,255,0.72); border-radius:999px; }
    .ng-map::before { width:260px; height:18px; left:-34px; top:52px; transform:rotate(18deg); }
    .ng-map::after { width:230px; height:16px; right:-52px; bottom:48px; transform:rotate(-26deg); }
    .ng-map__route { position:absolute; left:64px; top:38px; width:190px; height:86px; border:4px dashed var(--color-primary); border-left:none; border-bottom:none; border-radius:0 34px 0 0; opacity:0.72; }
    .ng-pin { position:absolute; display:flex; flex-direction:column; align-items:center; gap:4px; z-index:3; }
    .ng-pin__dot { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-md); color:#fff; }
    .ng-pin__dot .icon { width:18px; height:18px; }
    .ng-pin__label { padding:3px 8px; border-radius:999px; background:rgba(255,255,255,0.9); font-size:11px; font-weight:700; color:var(--color-text-1); box-shadow:var(--shadow-sm); }
    .ng-pin--me { left:28px; bottom:26px; }
    .ng-pin--me .ng-pin__dot { background:var(--color-accent); }
    .ng-pin--hospital { right:28px; top:24px; }
    .ng-pin--hospital .ng-pin__dot { background:var(--color-primary); }
    .ng-map__time { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); z-index:4; display:flex; align-items:center; gap:5px; padding:7px 12px; border-radius:999px; background:rgba(255,255,255,0.92); color:var(--color-primary-deep); font-size:12px; font-weight:800; box-shadow:var(--shadow-sm); }
    .ng-map__time .icon { width:14px; height:14px; }

    .ng-card { background:var(--color-card); border-radius:16px; padding:16px; box-shadow:var(--shadow-card); margin-top:12px; }
    .ng-card__head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .ng-card__title { display:flex; align-items:center; gap:6px; font-size:15px; font-weight:800; }
    .ng-card__title .icon { color:var(--color-primary); }
    .ng-card__more { font-size:12px; color:var(--color-text-3); }

    .ng-info { display:grid; grid-template-columns:repeat(3, 1fr); gap:0; }
    .ng-info__item { text-align:center; position:relative; }
    .ng-info__item:not(:last-child)::after { content:''; position:absolute; right:0; top:18%; width:1px; height:64%; background:var(--color-divider); }
    .ng-info__val { font-family:var(--font-num); font-size:20px; font-weight:800; color:var(--color-text-1); margin-bottom:4px; }
    .ng-info__label { font-size:11px; color:var(--color-text-3); }

    .ng-step { display:flex; gap:12px; padding-bottom:16px; position:relative; }
    .ng-step:last-child { padding-bottom:0; }
    .ng-step__left { display:flex; flex-direction:column; align-items:center; flex-shrink:0; }
    .ng-step__dot { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--color-bg-2); color:var(--color-text-3); border:2px solid var(--color-border-strong); }
    .ng-step__dot .icon { width:15px; height:15px; }
    .ng-step--done .ng-step__dot { background:var(--color-primary); color:#fff; border-color:var(--color-primary); }
    .ng-step--active .ng-step__dot { background:var(--color-accent); color:#fff; border-color:var(--color-accent); box-shadow:0 0 0 5px var(--color-accent-soft); animation:pulse 2s infinite; }
    .ng-step__line { width:2px; flex:1; min-height:22px; background:var(--color-border); margin-top:4px; }
    .ng-step--done .ng-step__line { background:var(--color-primary-mute); }
    .ng-step:last-child .ng-step__line { display:none; }
    .ng-step__body { flex:1; }
    .ng-step__top { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
    .ng-step__title { font-size:14px; font-weight:700; color:var(--color-text-1); }
    .ng-step--active .ng-step__title { color:var(--color-accent-deep); }
    .ng-step__time { font-size:11px; color:var(--color-text-3); font-family:var(--font-num); }
    .ng-step__desc { font-size:12px; color:var(--color-text-2); line-height:1.5; }

    .ng-guide { display:flex; gap:10px; padding:12px 0; border-bottom:1px solid var(--color-divider); }
    .ng-guide:last-child { border-bottom:none; padding-bottom:0; }
    .ng-guide:first-child { padding-top:0; }
    .ng-guide__icon { width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; background:var(--color-primary-soft); color:var(--color-primary); flex-shrink:0; }
    .ng-guide__icon--accent { background:var(--color-accent-soft); color:var(--color-accent-deep); }
    .ng-guide__icon .icon { width:18px; height:18px; }
    .ng-guide__title { font-size:14px; font-weight:700; margin-bottom:3px; }
    .ng-guide__desc { font-size:12px; color:var(--color-text-2); line-height:1.5; }

    .ng-bar { position:fixed; bottom:0; left:0; right:0; max-width:var(--container-mobile); margin:0 auto; background:var(--color-card); padding:12px 16px calc(12px + var(--safe-bottom)); box-shadow:var(--shadow-float); display:flex; gap:10px; z-index:var(--z-fixed); }
    .ng-bar .btn { flex:1; }
  </style>
</head>
<body>

<div class="mobile-frame">
  <div id="header"></div>

  <div class="ng-hero">
    <div class="ng-hero__tag"><svg class="icon" viewBox="0 0 24 24"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></svg> C-06 导航与就诊指引</div>
    <div class="ng-hero__title">协和医院心内科陪诊路线</div>
    <div class="ng-hero__sub">当前距医院 1.2km · 建议 08:30 前到达门诊楼一层东门集合点</div>
  </div>

  <div class="ng-body">
    <div class="ng-map anim-fade-up">
      <div class="ng-map__route"></div>
      <div class="ng-pin ng-pin--me">
        <div class="ng-pin__dot"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg></div>
        <div class="ng-pin__label">当前位置</div>
      </div>
      <div class="ng-pin ng-pin--hospital">
        <div class="ng-pin__dot"><svg class="icon" viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l7-4 7 4v14"/><path d="M12 8v6M9 11h6"/></svg></div>
        <div class="ng-pin__label">门诊楼</div>
      </div>
      <div class="ng-map__time"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg> 预计 18 分钟到达</div>
    </div>

    <div class="ng-card anim-fade-up">
      <div class="ng-info">
        <div class="ng-info__item"><div class="ng-info__val">1.2km</div><div class="ng-info__label">距医院</div></div>
        <div class="ng-info__item"><div class="ng-info__val">08:30</div><div class="ng-info__label">集合时间</div></div>
        <div class="ng-info__item"><div class="ng-info__val">#28</div><div class="ng-info__label">候诊序号</div></div>
      </div>
    </div>

    <div class="ng-card anim-fade-up">
      <div class="ng-card__head">
        <div class="ng-card__title" id="routeTitle"></div>
        <span class="ng-card__more">自动同步 ETA</span>
      </div>
      <div id="routeSteps"></div>
    </div>

    <div class="ng-card anim-fade-up">
      <div class="ng-card__head">
        <div class="ng-card__title" id="guideTitle"></div>
        <span class="ng-card__more">就诊指引</span>
      </div>
      <div id="guideList"></div>
    </div>
  </div>

  <div class="ng-bar">
    <button class="btn btn-ghost btn-lg" onclick="go('c-messages.html')"><svg class="icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> 联系家属</button>
    <button class="btn btn-accent btn-lg" onclick="showToast('已打开第三方地图导航')"><svg class="icon" viewBox="0 0 24 24"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></svg> 开始导航</button>
  </div>
</div>

<script>
  document.getElementById('header').innerHTML = renderHeader('导航与就诊指引');
  document.getElementById('routeTitle').innerHTML = `${IconLib.location} 到院路线`;
  document.getElementById('guideTitle').innerHTML = `${IconLib.hospital} 院内指引`;

  const routeSteps = [
    { title:'从当前位置出发', time:'08:08', desc:'沿东单北大街向北步行约 400m，注意提前联系就诊人确认集合。', icon:'profile', done:true },
    { title:'到达医院东门', time:'08:22', desc:'进入东门后右转，按「门诊楼」指示牌前行约 180m。', icon:'location', active:true },
    { title:'门诊一层集合', time:'08:30', desc:'在服务台旁轮椅借用点等待，就诊人家属已同步您的实时位置。', icon:'hospital' }
  ];
  document.getElementById('routeSteps').innerHTML = routeSteps.map(s => `
    <div class="ng-step ${s.done?'ng-step--done':''} ${s.active?'ng-step--active':''}">
      <div class="ng-step__left"><div class="ng-step__dot">${s.done?IconLib.check:IconLib[s.icon]}</div><div class="ng-step__line"></div></div>
      <div class="ng-step__body">
        <div class="ng-step__top"><span class="ng-step__title">${s.title}${s.active?' · 进行中':''}</span><span class="ng-step__time">${s.time}</span></div>
        <div class="ng-step__desc">${s.desc}</div>
      </div>
    </div>
  `).join('');

  const guides = [
    { icon:'file', title:'挂号取号', desc:'门诊楼一层自助机，使用就诊卡或身份证取号；取号后拍照回传。' },
    { icon:'clock', title:'候诊提醒', desc:'心内科候诊区在二层 B 区，叫号屏显示 #28，预计候诊 30 分钟。' },
    { icon:'pill', title:'取药缴费', desc:'医生开方后先到一层缴费窗口，再前往西侧药房取药并核对药品数量。' }
  ];
  document.getElementById('guideList').innerHTML = guides.map((g, i) => `
    <div class="ng-guide">
      <div class="ng-guide__icon ${i===1?'ng-guide__icon--accent':''}">${IconLib[g.icon]}</div>
      <div><div class="ng-guide__title">${g.title}</div><div class="ng-guide__desc">${g.desc}</div></div>
    </div>
  `).join('');
</script>

</body>
</html>
