<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>暖伴陪诊师 · 培训考核</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <script src="../js/icons.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <style>
    .tr-body { padding: 0 16px 100px; }
    .tr-stat-row {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 10px; margin: 12px 0 16px;
    }
    .tr-stat {
      background: var(--color-card);
      border-radius: 16px;
      padding: 14px 8px;
      box-shadow: var(--shadow-card);
      text-align: center;
    }
    .tr-stat__icon {
      width: 36px; height: 36px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 8px;
    }
    .tr-stat__icon .icon { width: 20px; height: 20px; }
    .tr-stat__icon--primary { background: var(--color-primary-soft); color: var(--color-primary); }
    .tr-stat__icon--accent { background: var(--color-accent-soft); color: var(--color-accent-deep); }
    .tr-stat__icon--info { background: var(--color-info-soft); color: var(--color-info); }
    .tr-stat__value { font-family: var(--font-num); font-size: 20px; font-weight: 800; color: var(--color-text-1); line-height: 1; margin-bottom: 4px; }
    .tr-stat__label { font-size: 11px; color: var(--color-text-3); }

    .tr-tabs {
      display: flex;
      background: var(--color-card);
      border-radius: 999px;
      padding: 4px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-card);
    }
    .tr-tab {
      flex: 1; text-align: center;
      padding: 9px 0; font-size: 13px; font-weight: 500;
      color: var(--color-text-2); border-radius: 999px;
      transition: all var(--duration-fast) var(--ease-out);
    }
    .tr-tab--active { background: var(--color-primary); color: #fff; font-weight: 600; }

    .tr-section-title {
      display: flex; align-items: center; justify-content: space-between;
      margin: 20px 4px 12px;
    }
    .tr-section-title h3 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .tr-section-title h3 .icon { color: var(--color-primary); }

    .tr-course {
      background: var(--color-card);
      border-radius: 16px;
      padding: 14px;
      box-shadow: var(--shadow-card);
      margin-bottom: 12px;
      display: flex; align-items: center; gap: 12px;
      transition: transform var(--duration-fast) var(--ease-out);
    }
    .tr-course:active { transform: scale(0.98); }
    .tr-course__icon {
      width: 48px; height: 48px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .tr-course__icon .icon { width: 24px; height: 24px; }
    .tr-course__icon--req { background: var(--color-accent-soft); color: var(--color-accent-deep); }
    .tr-course__icon--opt { background: var(--color-info-soft); color: var(--color-info); }
    .tr-course__body { flex: 1; min-width: 0; }
    .tr-course__title { font-size: 14px; font-weight: 600; color: var(--color-text-1); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .tr-course__tag {
      padding: 1px 6px; border-radius: 4px;
      font-size: 10px; font-weight: 700;
    }
    .tr-course__tag--req { background: var(--color-accent-soft); color: var(--color-accent-deep); }
    .tr-course__tag--opt { background: var(--color-info-soft); color: var(--color-info); }
    .tr-course__meta { font-size: 12px; color: var(--color-text-3); display: flex; gap: 8px; align-items: center; }
    .tr-course__meta .icon { width: 12px; height: 12px; }
    .tr-course__progress {
      margin-top: 8px; height: 5px;
      background: var(--color-bg-2); border-radius: 999px; overflow: hidden;
    }
    .tr-course__fill {
      height: 100%; background: var(--color-primary); border-radius: 999px;
    }
    .tr-course__action {
      flex-shrink: 0; padding: 6px 14px; border-radius: 999px;
      font-size: 12px; font-weight: 600;
    }

    .tr-exam-card {
      background: linear-gradient(135deg, #1E7A6F 0%, #2A9D8F 100%);
      border-radius: 16px;
      padding: 20px;
      color: #fff;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }
    .tr-exam-card::after {
      content: '';
      position: absolute;
      right: -20px; bottom: -20px;
      width: 100px; height: 100px;
      border-radius: 50%;
      background: rgba(242, 153, 74, 0.2);
    }
    .tr-exam__title { font-size: 17px; font-weight: 700; margin-bottom: 6px; position: relative; z-index: 2; }
    .tr-exam__desc { font-size: 13px; opacity: 0.9; line-height: 1.5; margin-bottom: 14px; position: relative; z-index: 2; }
    .tr-exam__meta { display: flex; gap: 16px; margin-bottom: 14px; position: relative; z-index: 2; }
    .tr-exam__meta-item { font-size: 12px; opacity: 0.9; display: flex; align-items: center; gap: 4px; }
    .tr-exam__meta-item .icon { width: 14px; height: 14px; }
    .tr-exam__btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 20px; background: #fff;
      color: var(--color-primary-deep); border-radius: 999px;
      font-size: 14px; font-weight: 700; position: relative; z-index: 2;
    }
    .tr-exam__btn .icon { width: 16px; height: 16px; }

    .tr-cert-grid {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .tr-cert {
      background: var(--color-card);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow-card);
      text-align: center;
      position: relative;
    }
    .tr-cert__icon {
      width: 56px; height: 56px; border-radius: 50%;
      background: linear-gradient(135deg, #F2C94C, #F2994A);
      color: #fff; display: flex; align-items: center; justify-content: center;
      margin: 0 auto 10px;
      box-shadow: 0 4px 12px rgba(242, 153, 74, 0.3);
    }
    .tr-cert__icon .icon { width: 28px; height: 28px; }
    .tr-cert__name { font-size: 13px; font-weight: 600; color: var(--color-text-1); margin-bottom: 4px; }
    .tr-cert__date { font-size: 11px; color: var(--color-text-3); font-family: var(--font-num); }
    .tr-cert__status {
      position: absolute; top: 10px; right: 10px;
      padding: 1px 8px; background: var(--color-success-soft);
      color: var(--color-success); border-radius: 6px;
      font-size: 10px; font-weight: 700;
    }
  </style>
</head>
<body>

<div class="mobile-frame">
  <div id="header"></div>

  <div class="tr-body">
    <!-- 学习统计 -->
    <div class="tr-stat-row anim-fade-up">
      <div class="tr-stat">
        <div class="tr-stat__icon tr-stat__icon--primary"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
        <div class="tr-stat__value num">36.5</div>
        <div class="tr-stat__label">学习时长(h)</div>
      </div>
      <div class="tr-stat">
        <div class="tr-stat__icon tr-stat__icon--accent"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="9 12 12 15 16 10"/></svg></div>
        <div class="tr-stat__value num">12</div>
        <div class="tr-stat__label">完成课程</div>
      </div>
      <div class="tr-stat">
        <div class="tr-stat__icon tr-stat__icon--info"><svg class="icon" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div>
        <div class="tr-stat__value num">92</div>
        <div class="tr-stat__label">考核均分</div>
      </div>
    </div>

    <!-- 在线考试入口 -->
    <div class="tr-exam-card anim-fade-up">
      <div class="tr-exam__title">季度考核 · 2026Q3</div>
      <div class="tr-exam__desc">完成本季度理论与实操考核,维持金牌评级</div>
      <div class="tr-exam__meta">
        <span class="tr-exam__meta-item"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg> 60分钟</span>
        <span class="tr-exam__meta-item"><svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> 50题</span>
        <span class="tr-exam__meta-item"><svg class="icon" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> 需≥80分</span>
      </div>
      <a class="tr-exam__btn" onclick="showToast('进入考试')"><svg class="icon" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> 开始考试</a>
    </div>

    <!-- 课程Tab -->
    <div class="tr-tabs" id="courseTabs">
      <span class="tr-tab tr-tab--active" data-tab="all">全部课程</span>
      <span class="tr-tab" data-tab="req">必修</span>
      <span class="tr-tab" data-tab="opt">选修</span>
    </div>

    <!-- 课程列表 -->
    <div class="tr-section-title">
      <h3 id="courseTitle"></h3>
      <span class="section__more">查看全部</span>
    </div>
    <div id="courseList"></div>

    <!-- 我的证书 -->
    <div class="tr-section-title">
      <h3 id="certTitle"></h3>
    </div>
    <div class="tr-cert-grid" id="certGrid"></div>
  </div>

  <div id="tabbar"></div>
</div>

<script>
  document.getElementById('header').innerHTML = renderHeader('培训与考核');
  document.getElementById('tabbar').innerHTML = renderCompanionTabbar('work');
  document.getElementById('courseTitle').innerHTML = `${IconLib.file} 课程列表`;
  document.getElementById('certTitle').innerHTML = `${IconLib.shield} 我的证书`;

  const courses = [
    { title: '陪诊师服务规范', type: 'req', icon: 'shield', duration: '45分钟', progress: 100, lessons: 8, done: true },
    { title: '急救知识与心肺复苏', type: 'req', icon: 'heart', duration: '60分钟', progress: 100, lessons: 10, done: true },
    { title: '老年患者沟通技巧', type: 'req', icon: 'message', duration: '40分钟', progress: 75, lessons: 6, done: false },
    { title: '医院就诊流程详解', type: 'req', icon: 'hospital', duration: '50分钟', progress: 100, lessons: 12, done: true },
    { title: '医学术语基础', type: 'opt', icon: 'file', duration: '35分钟', progress: 40, lessons: 7, done: false },
    { title: '情绪疏导与心理支持', type: 'opt', icon: 'heart', duration: '30分钟', progress: 0, lessons: 5, done: false },
    { title: '隐私保护与数据安全', type: 'req', icon: 'eye', duration: '25分钟', progress: 100, lessons: 4, done: true },
    { title: '突发事件应急处理', type: 'opt', icon: 'bell', duration: '40分钟', progress: 20, lessons: 6, done: false },
  ];

  function renderCourses(tab) {
    const list = tab === 'all' ? courses : courses.filter(c => c.type === (tab === 'req' ? 'req' : 'opt'));
    document.getElementById('courseList').innerHTML = list.map((c, i) => `
      <div class="tr-course anim-fade-up" style="animation-delay:${i*0.04}s" onclick="go('c-training.html')">
        <div class="tr-course__icon tr-course__icon--${c.type}">${IconLib[c.icon]}</div>
        <div class="tr-course__body">
          <div class="tr-course__title">
            ${c.title}
            <span class="tr-course__tag tr-course__tag--${c.type}">${c.type==='req'?'必修':'选修'}</span>
          </div>
          <div class="tr-course__meta">
            <span>${IconLib.clock}${c.duration}</span>
            <span>${IconLib.file}${c.lessons}节</span>
            <span>已完成${c.progress}%</span>
          </div>
          <div class="tr-course__progress"><div class="tr-course__fill" style="width:${c.progress}%;background:${c.progress===100?'var(--color-success)':'var(--color-primary)'}"></div></div>
        </div>
        <button class="btn ${c.done?'btn-ghost':'btn-primary'} btn-sm tr-course__action" onclick="event.stopPropagation();showToast('${c.done?'复习课程':'继续学习'}')">${c.done?'复习':'学习'}</button>
      </div>
    `).join('');
  }
  renderCourses('all');

  document.querySelectorAll('.tr-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tr-tab').forEach(t => t.classList.remove('tr-tab--active'));
      tab.classList.add('tr-tab--active');
      renderCourses(tab.dataset.tab);
    });
  });

  // 证书
  const certs = [
    { name: '陪诊师资格证', date: '2026-01-15', icon: 'shield' },
    { name: '急救技能证书', date: '2026-02-20', icon: 'heart' },
    { name: '心肺复苏证书', date: '2026-03-10', icon: 'starFill' },
    { name: '服务规范结业证', date: '2026-04-05', icon: 'checkCircle' },
  ];
  document.getElementById('certGrid').innerHTML = certs.map((c, i) => `
    <div class="tr-cert anim-fade-up" style="animation-delay:${i*0.06}s" onclick="showToast('查看证书详情')">
      <span class="tr-cert__status">有效</span>
      <div class="tr-cert__icon">${IconLib[c.icon]}</div>
      <div class="tr-cert__name">${c.name}</div>
      <div class="tr-cert__date">${c.date} 颁发</div>
    </div>
  `).join('');
</script>

</body>
</html>
