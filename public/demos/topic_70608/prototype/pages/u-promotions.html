<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>暖伴 · 营销活动</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <script src="../js/icons.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <style>
    .pm-body { padding: 0 16px 100px; }
    .pm-banner-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 12px 0 16px;
    }
    .pm-banner {
      border-radius: 16px;
      padding: 16px;
      color: #fff;
      position: relative;
      overflow: hidden;
      min-height: 96px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .pm-banner--group { background: linear-gradient(135deg, #1E7A6F 0%, #2A9D8F 100%); }
    .pm-banner--invite { background: linear-gradient(135deg, #F2994A 0%, #F2B845 100%); }
    .pm-banner::after {
      content: '';
      position: absolute;
      right: -20px;
      bottom: -20px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
    }
    .pm-banner__icon { width: 28px; height: 28px; }
    .pm-banner__icon .icon { width: 28px; height: 28px; }
    .pm-banner__title { font-size: 16px; font-weight: 700; margin-bottom: 2px; position: relative; z-index: 2; }
    .pm-banner__desc { font-size: 12px; opacity: 0.9; position: relative; z-index: 2; }
    .pm-banner__btn {
      align-self: flex-start;
      padding: 3px 12px;
      background: rgba(255,255,255,0.9);
      color: var(--color-primary-deep);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      position: relative;
      z-index: 2;
    }
    .pm-banner--invite .pm-banner__btn { color: var(--color-accent-deep); }
    .pm-section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 20px 4px 12px;
    }
    .pm-section-title h3 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .pm-section-title h3 .icon { color: var(--color-primary); }
    .pm-act-card {
      background: var(--color-card);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow-card);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: transform var(--duration-fast) var(--ease-out);
    }
    .pm-act-card:active { transform: scale(0.98); }
    .pm-act-card__icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .pm-act-card__icon .icon { width: 28px; height: 28px; }
    .pm-act-card__icon--accent { background: var(--color-accent-soft); color: var(--color-accent-deep); }
    .pm-act-card__icon--primary { background: var(--color-primary-soft); color: var(--color-primary); }
    .pm-act-card__title { font-size: 15px; font-weight: 600; color: var(--color-text-1); margin-bottom: 4px; }
    .pm-act-card__desc { font-size: 12px; color: var(--color-text-3); line-height: 1.5; }
    .pm-act-card__btn {
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .pm-coupon-tabs {
      display: flex;
      background: var(--color-card);
      border-radius: 999px;
      padding: 4px;
      margin: 12px 0 16px;
      box-shadow: var(--shadow-card);
    }
    .pm-coupon-tab {
      flex: 1;
      text-align: center;
      padding: 9px 0;
      font-size: 13px;
      font-weight: 500;
      color: var(--color-text-2);
      border-radius: 999px;
      transition: all var(--duration-fast) var(--ease-out);
    }
    .pm-coupon-tab--active {
      background: var(--color-primary);
      color: #fff;
      font-weight: 600;
    }
    .pm-coupon {
      background: var(--color-card);
      border-radius: 16px;
      box-shadow: var(--shadow-card);
      margin-bottom: 12px;
      display: flex;
      overflow: hidden;
    }
    .pm-coupon__left {
      width: 100px;
      background: linear-gradient(135deg, #F2994A 0%, #F2B845 100%);
      color: #fff;
      padding: 16px 8px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }
    .pm-coupon--primary .pm-coupon__left { background: linear-gradient(135deg, #1E7A6F 0%, #2A9D8F 100%); }
    .pm-coupon--disabled .pm-coupon__left { background: var(--color-bg-2); color: var(--color-text-3); }
    .pm-coupon__left::after {
      content: '';
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%);
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--color-card);
    }
    .pm-coupon__amount { font-family: var(--font-num); font-size: 28px; font-weight: 800; line-height: 1; }
    .pm-coupon__amount .sym { font-size: 14px; }
    .pm-coupon__cond { font-size: 11px; margin-top: 4px; opacity: 0.9; }
    .pm-coupon__right {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
    }
    .pm-coupon__name { font-size: 14px; font-weight: 600; color: var(--color-text-1); }
    .pm-coupon__scope { font-size: 12px; color: var(--color-text-3); }
    .pm-coupon__valid { font-size: 11px; color: var(--color-text-3); font-family: var(--font-num); }
    .pm-coupon__use {
      align-self: flex-end;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<div class="mobile-frame">
  <div id="header"></div>

  <div class="pm-body">
    <!-- 双 Banner -->
    <div class="pm-banner-row">
      <div class="pm-banner pm-banner--group anim-fade-up" onclick="showToast('拼团进行中')">
        <div class="pm-banner__icon"><svg class="icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
        <div>
          <div class="pm-banner__title">3人拼团</div>
          <div class="pm-banner__desc">立减80元</div>
        </div>
        <span class="pm-banner__btn">去拼团</span>
      </div>
      <div class="pm-banner pm-banner--invite anim-fade-up delay-1" onclick="showToast('邀请有礼')">
        <div class="pm-banner__icon"><svg class="icon" viewBox="0 0 24 24"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg></div>
        <div>
          <div class="pm-banner__title">邀请有礼</div>
          <div class="pm-banner__desc">双方各得30元</div>
        </div>
        <span class="pm-banner__btn">去邀请</span>
      </div>
    </div>

    <!-- 活动卡片 -->
    <div class="pm-section-title"><h3 id="actTitle"></h3></div>
    <div id="actList"></div>

    <!-- 优惠券中心 -->
    <div class="pm-section-title">
      <h3 id="cpnTitle"></h3>
      <span class="section__more" onclick="showToast('领券中心')">更多</span>
    </div>
    <div class="pm-coupon-tabs" id="cpnTabs">
      <span class="pm-coupon-tab pm-coupon-tab--active" data-tab="unused">未使用(3)</span>
      <span class="pm-coupon-tab" data-tab="used">已使用</span>
      <span class="pm-coupon-tab" data-tab="expired">已过期</span>
    </div>
    <div id="cpnList"></div>
  </div>

  <div id="tabbar"></div>
</div>

<script>
  document.getElementById('header').innerHTML = renderHeader('优惠活动');
  document.getElementById('tabbar').innerHTML = renderTabbar('order');

  document.getElementById('actTitle').innerHTML = `${IconLib.bell} 热门活动`;
  document.getElementById('cpnTitle').innerHTML = `${IconLib.coupon} 我的优惠券`;

  // 活动列表
  const actIcons = { '新人专享':'gift', '限时活动':'users', '节日活动':'heart', '超值套餐':'coupon' };
  document.getElementById('actList').innerHTML = MockData.promotions.map((p, i) => {
    const isAccent = p.color === 'accent';
    return `
      <div class="pm-act-card anim-fade-up" style="animation-delay:${i*0.06}s" onclick="showToast('参与${p.title}')">
        <div class="pm-act-card__icon ${isAccent?'pm-act-card__icon--accent':'pm-act-card__icon--primary'}">${IconLib[actIcons[p.tag]||'gift']}</div>
        <div style="flex:1">
          <div class="pm-act-card__title">${p.title}</div>
          <div class="pm-act-card__desc">${p.desc}</div>
        </div>
        <span class="badge badge-${p.color}">${p.tag}</span>
        <button class="btn ${isAccent?'btn-accent':'btn-primary'} btn-sm pm-act-card__btn">参与</button>
      </div>
    `;
  }).join('');

  // 优惠券
  const coupons = {
    unused: [
      { amount: 50, cond: '满200可用', name: '新人专享券', scope: '全品类通用', valid: '2026-07-31到期', type: 'accent' },
      { amount: 30, cond: '满150可用', name: '陪诊优惠券', scope: '陪诊服务', valid: '2026-07-15到期', type: 'primary' },
      { amount: 20, cond: '满100可用', name: '跑腿优惠券', scope: '代办跑腿', valid: '2026-07-20到期', type: 'primary' },
    ],
    used: [
      { amount: 50, cond: '满200可用', name: '新人专享券', scope: '全品类通用', valid: '2026-06-28使用', type: 'disabled' },
    ],
    expired: [
      { amount: 30, cond: '满150可用', name: '陪诊优惠券', scope: '陪诊服务', valid: '2026-06-30过期', type: 'disabled' },
      { amount: 15, cond: '满80可用', name: '体检优惠券', scope: '体检陪诊', valid: '2026-05-31过期', type: 'disabled' },
    ],
  };

  function renderCoupons(tab) {
    const list = coupons[tab];
    document.getElementById('cpnList').innerHTML = list.length ? list.map(c => `
      <div class="pm-coupon pm-coupon--${c.type} anim-fade-up">
        <div class="pm-coupon__left">
          <div class="pm-coupon__amount"><span class="sym">¥</span>${c.amount}</div>
          <div class="pm-coupon__cond">${c.cond}</div>
        </div>
        <div class="pm-coupon__right">
          <div class="pm-coupon__name">${c.name}</div>
          <div class="pm-coupon__scope">${c.scope}</div>
          <div class="pm-coupon__valid">${c.valid}</div>
          ${c.type!=='disabled' ? `<button class="btn ${c.type==='accent'?'btn-accent':'btn-primary'} btn-sm pm-coupon__use" onclick="event.stopPropagation();go('u-booking.html')">立即使用</button>` : '<span style="font-size:11px;color:var(--color-text-3);margin-top:4px">不可用</span>'}
        </div>
      </div>
    `).join('') : `<div class="empty-state"><div class="empty-state__icon">${IconLib.coupon}</div><div class="empty-state__title">暂无优惠券</div></div>`;
  }
  renderCoupons('unused');

  document.querySelectorAll('.pm-coupon-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.pm-coupon-tab').forEach(t => t.classList.remove('pm-coupon-tab--active'));
      tab.classList.add('pm-coupon-tab--active');
      renderCoupons(tab.dataset.tab);
    });
  });
</script>

</body>
</html>
