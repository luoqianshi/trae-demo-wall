<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>暖伴 · 亲情账号</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <script src="../js/icons.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <style>
    .fm-body { padding: 0 16px 100px; }
    .fm-intro {
      background: linear-gradient(135deg, #E8F4F1 0%, #FFEDD8 100%);
      border-radius: 16px;
      padding: 16px;
      margin: 12px 0 16px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .fm-intro__icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--color-primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .fm-intro__icon .icon { width: 22px; height: 22px; }
    .fm-intro__title { font-size: 14px; font-weight: 700; color: var(--color-text-1); margin-bottom: 4px; }
    .fm-intro__desc { font-size: 12px; color: var(--color-text-2); line-height: 1.5; }
    .fm-section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 16px 4px 12px;
    }
    .fm-section-title h3 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .fm-section-title h3 .icon { color: var(--color-primary); }
    .fm-card {
      background: var(--color-card);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow-card);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .fm-card__avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }
    .fm-card__name {
      font-size: 16px;
      font-weight: 600;
      color: var(--color-text-1);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .fm-card__rel {
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }
    .fm-card__phone {
      font-size: 13px;
      color: var(--color-text-3);
      font-family: var(--font-num);
      margin-bottom: 8px;
    }
    .fm-card__perms {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .fm-perm {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 8px;
      background: var(--color-bg-2);
      border-radius: 6px;
      font-size: 11px;
      color: var(--color-text-2);
    }
    .fm-perm .icon { width: 12px; height: 12px; color: var(--color-primary); }
    .fm-card__actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-self: stretch;
      justify-content: center;
    }
    .fm-add {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 16px;
      border: 1.5px dashed var(--color-primary-mute);
      border-radius: 16px;
      color: var(--color-primary);
      font-size: 15px;
      font-weight: 600;
      background: var(--color-primary-soft);
      margin-top: 4px;
    }
    .fm-share-card {
      background: var(--color-card);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow-card);
    }
    .fm-share-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--color-divider);
    }
    .fm-share-item:last-child { border-bottom: none; }
    .fm-share-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--color-primary-soft);
      color: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .fm-share-icon--accent { background: var(--color-accent-soft); color: var(--color-accent-deep); }
    .fm-share-icon .icon { width: 18px; height: 18px; }
    .fm-share-title { font-size: 14px; font-weight: 600; color: var(--color-text-1); margin-bottom: 2px; }
    .fm-share-desc { font-size: 12px; color: var(--color-text-3); line-height: 1.5; }
    .fm-share-toggle { margin-left: auto; }
    .fm-modal-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--color-divider);
    }
    .fm-modal-row:last-child { border-bottom: none; }
  </style>
</head>
<body>

<div class="mobile-frame">
  <div id="header"></div>

  <div class="fm-body">
    <!-- 引导 -->
    <div class="fm-intro anim-fade-up">
      <div class="fm-intro__icon"><svg class="icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
      <div style="flex:1">
        <div class="fm-intro__title">为家人也安排一份温暖</div>
        <div class="fm-intro__desc">绑定亲情账号后,可代家人预约陪诊、查看健康档案,家人就诊时您也能实时收到进度通知</div>
      </div>
    </div>

    <!-- 家人列表 -->
    <div class="fm-section-title">
      <h3 id="fmTitle"></h3>
      <span class="section__more">3位家人</span>
    </div>
    <div id="fmList"></div>

    <button class="fm-add" onclick="openAddSheet()"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> 添加家人</button>

    <!-- 共享权限说明 -->
    <div class="fm-section-title">
      <h3 id="shareTitle"></h3>
    </div>
    <div class="fm-share-card anim-fade-up" id="shareList"></div>
  </div>

  <div id="tabbar"></div>
</div>

<div id="addSheet"></div>

<script>
  document.getElementById('header').innerHTML = renderHeader('亲情账号');
  document.getElementById('tabbar').innerHTML = renderTabbar('profile');

  document.getElementById('fmTitle').innerHTML = `${IconLib.heart} 已绑定的家人`;
  document.getElementById('shareTitle').innerHTML = `${IconLib.shield} 共享权限设置`;

  // 家人数据
  const family = [
    { name: '王建国', rel: '父亲', phone: '138****1234', avatar: '王', color: '#1E7A6F', perms: ['report','pay','notify'] },
    { name: '李秀兰', rel: '母亲', phone: '139****5678', avatar: '李', color: '#F2994A', perms: ['report','notify'] },
    { name: '王小明', rel: '儿子', phone: '137****9012', avatar: '王', color: '#2D9CDB', perms: ['notify'] },
  ];
  const permMap = { report: { icon:'file', label:'报告共享' }, pay: { icon:'wallet', label:'代付' }, notify: { icon:'bell', label:'消息通知' } };

  document.getElementById('fmList').innerHTML = family.map((f, i) => `
    <div class="fm-card anim-fade-up" style="animation-delay:${i*0.06}s">
      <div class="fm-card__avatar" style="background:${f.color}">${f.avatar}</div>
      <div style="flex:1">
        <div class="fm-card__name">
          ${f.name}
          <span class="fm-card__rel" style="background:${f.color}20;color:${f.color}">${f.rel}</span>
        </div>
        <div class="fm-card__phone">${f.phone}</div>
        <div class="fm-card__perms">
          ${f.perms.map(p => `<span class="fm-perm">${IconLib[permMap[p].icon]}${permMap[p].label}</span>`).join('')}
        </div>
      </div>
      <div class="fm-card__actions">
        <button class="btn btn-primary btn-sm" onclick="go('u-booking.html')">代预约</button>
        <button class="btn btn-ghost btn-sm" style="font-size:12px;color:var(--color-alert)" onclick="unbind('${f.name}')">解绑</button>
      </div>
    </div>
  `).join('');

  function unbind(name) {
    if (confirm(`确定解绑 ${name} 的亲情账号吗?解绑后将无法代为预约和查看档案`)) {
      showToast(`已解绑 ${name}`);
    }
  }

  // 共享权限
  const sharePerms = [
    { icon: 'file', label: '健康报告共享', desc: '家人可查看您的就诊记录与检查报告', on: true, accent: false },
    { icon: 'wallet', label: '代付权限', desc: '允许家人使用您的账户代付订单', on: true, accent: true },
    { icon: 'bell', label: '就诊消息通知', desc: '家人就诊时向您推送进度提醒', on: true, accent: false },
    { icon: 'eye', label: '隐私保护', desc: '敏感诊断信息默认隐藏,需授权可见', on: false, accent: false },
  ];
  document.getElementById('shareList').innerHTML = sharePerms.map((p, i) => `
    <div class="fm-share-item">
      <div class="fm-share-icon ${p.accent?'fm-share-icon--accent':''}">${IconLib[p.icon]}</div>
      <div style="flex:1">
        <div class="fm-share-title">${p.label}</div>
        <div class="fm-share-desc">${p.desc}</div>
      </div>
      <div class="switch ${p.on?'switch--on':''} fm-share-toggle" onclick="toggleShare(this,'${p.label}')">
        <div class="switch__thumb"></div>
      </div>
    </div>
  `).join('');

  function toggleShare(el, label) {
    el.classList.toggle('switch--on');
    showToast(`${label}已${el.classList.contains('switch--on')?'开启':'关闭'}`);
  }

  // 添加家人弹窗
  function openAddSheet() {
    document.getElementById('addSheet').innerHTML = `
      <div class="modal-backdrop" onclick="closeAddSheet(event)">
        <div class="modal-sheet" onclick="event.stopPropagation()">
          <div class="modal-sheet__handle"></div>
          <div class="modal-sheet__title">添加家人</div>
          <div class="form-group">
            <label class="form-label">姓名</label>
            <input class="form-input" placeholder="请输入家人姓名" id="fmName">
          </div>
          <div class="form-group">
            <label class="form-label">关系</label>
            <div style="display:flex;gap:8px;flex-wrap:wrap" id="relChips">
              ${['父亲','母亲','配偶','子女','其他'].map((r,i) => `<span class="chip ${i===0?'chip--active':''}" onclick="pickRel(this)">${r}</span>`).join('')}
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">手机号</label>
            <input class="form-input" type="tel" placeholder="用于邀请家人激活账号" id="fmPhone">
          </div>
          <div style="background:var(--color-primary-soft);border-radius:12px;padding:12px;margin-bottom:16px;display:flex;gap:8px;align-items:flex-start">
            ${IconLib.shield.replace('class="icon"','class="icon" style="color:var(--color-primary);width:18px;height:18px;flex-shrink:0;margin-top:2px"')}
            <div style="font-size:12px;color:var(--color-text-2);line-height:1.5">邀请短信将发送至家人手机,激活后可设置共享权限。所有信息加密存储,仅本人可见。</div>
          </div>
          <button class="btn btn-primary btn-block btn-lg" onclick="submitAdd()">发送邀请</button>
        </div>
      </div>
    `;
  }
  function pickRel(el) {
    el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('chip--active'));
    el.classList.add('chip--active');
  }
  function closeAddSheet(e) {
    if (e.target.classList.contains('modal-backdrop')) {
      document.getElementById('addSheet').innerHTML = '';
    }
  }
  function submitAdd() {
    const name = document.getElementById('fmName').value.trim();
    if (!name) { showToast('请输入家人姓名'); return; }
    document.getElementById('addSheet').innerHTML = '';
    showToast(`邀请已发送给 ${name}`);
  }
</script>

</body>
</html>
