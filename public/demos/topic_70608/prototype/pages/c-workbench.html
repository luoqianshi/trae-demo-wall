<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>暖伴陪诊师 · 工作台</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <script src="../js/icons.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <style>
    .wb-hero {
      background: var(--gradient-warm);
      padding: calc(var(--safe-top) + 16px) 20px 60px;
      color: #fff;
      position: relative;
      overflow: hidden;
    }
    .wb-hero::before {
      content: '';
      position: absolute;
      right: -50px;
      top: -20px;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: rgba(242, 153, 74, 0.2);
      filter: blur(24px);
    }
    .wb-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 2;
      margin-bottom: 16px;
    }
    .wb-user { display: flex; align-items: center; gap: 12px; }
    .wb-user__avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700;
      border: 2px solid rgba(255,255,255,0.3);
    }
    .wb-user__name { font-size: 16px; font-weight: 600; }
    .wb-user__sub { font-size: 12px; opacity: 0.85; display: flex; align-items: center; gap: 4px; }
    .wb-topbar__btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .wb-topbar__btn .icon { width: 20px; height: 20px; }
    .wb-topbar__dot {
      position: absolute; top: 8px; right: 8px;
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--color-accent);
      border: 2px solid var(--color-primary);
    }
    .wb-status {
      background: rgba(255,255,255,0.14);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 16px;
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .wb-status__info { display: flex; flex-direction: column; gap: 4px; }
    .wb-status__label { font-size: 13px; opacity: 0.9; }
    .wb-status__value { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .wb-status__dot { width: 10px; height: 10px; border-radius: 50%; background: var(--color-success); animation: pulse 2s infinite; }
    .wb-bigswitch {
      width: 64px; height: 36px; border-radius: 999px;
      background: var(--color-success);
      position: relative; cursor: pointer;
      transition: background var(--duration-fast) var(--ease-out);
    }
    .wb-bigswitch__thumb {
      position: absolute; top: 3px; right: 3px;
      width: 30px; height: 30px; border-radius: 50%;
      background: #fff; box-shadow: var(--shadow-sm);
      transition: transform var(--duration-normal) var(--ease-spring);
    }
    .wb-bigswitch--off { background: var(--color-border-strong); }
    .wb-bigswitch--off .wb-bigswitch__thumb { transform: translateX(-28px); }

    .wb-body { padding: 0 16px 100px; margin-top: -36px; position: relative; z-index: 3; }
    .wb-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
      background: var(--color-card);
      border-radius: 16px;
      padding: 16px 8px;
      box-shadow: var(--shadow-lg);
      margin-bottom: 16px;
    }
    .wb-stat { text-align: center; position: relative; }
    .wb-stat:not(:last-child)::after {
      content: ''; position: absolute; right: 0; top: 20%;
      height: 60%; width: 1px; background: var(--color-divider);
    }
    .wb-stat__value { font-family: var(--font-num); font-size: 24px; font-weight: 800; color: var(--color-text-1); line-height: 1; margin-bottom: 4px; }
    .wb-stat__value--accent { color: var(--color-accent-deep); }
    .wb-stat__label { font-size: 12px; color: var(--color-text-3); }

    .wb-todo {
      background: var(--color-card);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow-card);
      margin-bottom: 16px;
    }
    .wb-todo__head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .wb-todo__title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .wb-todo__title .icon { color: var(--color-accent); }
    .wb-todo__item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 0; border-bottom: 1px solid var(--color-divider);
    }
    .wb-todo__item:last-child { border-bottom: none; }
    .wb-todo__icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--color-accent-soft); color: var(--color-accent-deep);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .wb-todo__icon .icon { width: 18px; height: 18px; }
    .wb-todo__text { flex: 1; }
    .wb-todo__name { font-size: 14px; font-weight: 500; color: var(--color-text-1); }
    .wb-todo__time { font-size: 12px; color: var(--color-text-3); font-family: var(--font-num); }

    .wb-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      background: var(--color-card);
      border-radius: 16px;
      padding: 8px 0;
      box-shadow: var(--shadow-card);
      margin-bottom: 16px;
    }
    .wb-grid__item {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 14px 4px;
    }
    .wb-grid__icon {
      width: 44px; height: 44px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
    }
    .wb-grid__icon .icon { width: 22px; height: 22px; }
    .wb-grid__label { font-size: 12px; color: var(--color-text-2); }
    .wb-section-title {
      display: flex; align-items: center; justify-content: space-between;
      margin: 16px 4px 12px;
    }
    .wb-section-title h3 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .wb-section-title h3 .icon { color: var(--color-primary); }
  </style>
</head>
<body>

<div class="mobile-frame">
  <div class="wb-hero">
    <div class="wb-topbar">
      <div class="wb-user">
        <div class="wb-user__avatar">李</div>
        <div>
          <div class="wb-user__name">李慧敏</div>
          <div class="wb-user__sub"><svg class="icon" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> 金牌陪诊师 · 4.9分</div>
        </div>
      </div>
      <div class="wb-topbar__btn" onclick="go('c-messages.html')"><svg class="icon" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="wb-topbar__dot"></span></div>
    </div>
    <div class="wb-status anim-fade-up">
      <div class="wb-status__info">
        <span class="wb-status__label">接单状态</span>
        <span class="wb-status__value"><span class="wb-status__dot"></span> <span id="statusText">接单中</span></span>
      </div>
      <div class="wb-bigswitch" id="bigSwitch" onclick="toggleWork()"><div class="wb-bigswitch__thumb"></div></div>
    </div>
  </div>

  <div class="wb-body">
    <!-- 今日数据 -->
    <div class="wb-stats anim-fade-up" id="statsCard"></div>

    <!-- 待办提醒 -->
    <div class="wb-section-title">
      <h3 id="todoTitle"></h3>
    </div>
    <div class="wb-todo anim-fade-up" id="todoList"></div>

    <!-- 快捷功能 -->
    <div class="wb-section-title">
      <h3 id="quickTitle"></h3>
    </div>
    <div class="wb-grid anim-fade-up" id="quickGrid"></div>
  </div>

  <div id="tabbar"></div>
</div>

<script>
  document.getElementById('tabbar').innerHTML = renderCompanionTabbar('work');
  document.getElementById('todoTitle').innerHTML = `${IconLib.bell} 待办提醒`;
  document.getElementById('quickTitle').innerHTML = `${IconLib.route} 快捷功能`;

  // 今日数据
  document.getElementById('statsCard').innerHTML = `
    <div class="wb-stat">
      <div class="wb-stat__value num">3</div>
      <div class="wb-stat__label">今日订单</div>
    </div>
    <div class="wb-stat">
      <div class="wb-stat__value num wb-stat__value--accent">¥897</div>
      <div class="wb-stat__label">今日收益</div>
    </div>
    <div class="wb-stat">
      <div class="wb-stat__value num">4.9</div>
      <div class="wb-stat__label">服务评分</div>
    </div>
  `;

  // 待办
  const todos = [
    { icon: 'clock', name: '9:00 协和医院半日陪诊', time: '30分钟后开始', url: 'c-service.html' },
    { icon: 'file', name: '昨日订单服务报告待提交', time: '剩余1小时', url: 'c-report-form.html' },
    { icon: 'bell', name: '排班提醒:明日全天可接单', time: '点击查看', url: 'c-schedule.html' },
  ];
  document.getElementById('todoList').innerHTML = todos.map((t, i) => `
    <div class="wb-todo__item" onclick="go('${t.url}')">
      <div class="wb-todo__icon">${IconLib[t.icon]}</div>
      <div class="wb-todo__text">
        <div class="wb-todo__name">${t.name}</div>
        <div class="wb-todo__time">${t.time}</div>
      </div>
      ${IconLib.arrow}
    </div>
  `).join('');

  // 快捷功能
  const quicks = [
    { icon: 'order', label: '抢单大厅', color: '#1E7A6F', bg: '#E8F4F1', url: 'c-grab.html' },
    { icon: 'calendar', label: '排班管理', color: '#F2994A', bg: '#FFEDD8', url: 'c-schedule.html' },
    { icon: 'wallet', label: '收益提现', color: '#27AE60', bg: '#E3F5EC', url: 'c-income.html' },
    { icon: 'shield', label: '培训考核', color: '#2D9CDB', bg: '#E3F4FC', url: 'c-training.html' },
  ];
  document.getElementById('quickGrid').innerHTML = quicks.map(q => `
    <div class="wb-grid__item" onclick="go('${q.url}')">
      <div class="wb-grid__icon" style="background:${q.bg};color:${q.color}">${IconLib[q.icon]}</div>
      <span class="wb-grid__label">${q.label}</span>
    </div>
  `).join('');

  function toggleWork() {
    const sw = document.getElementById('bigSwitch');
    const text = document.getElementById('statusText');
    sw.classList.toggle('wb-bigswitch--off');
    const on = !sw.classList.contains('wb-bigswitch--off');
    text.textContent = on ? '接单中' : '已休息';
    showToast(on ? '已开启接单' : '已暂停接单');
  }
</script>

</body>
</html>
