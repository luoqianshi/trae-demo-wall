<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>暖伴陪诊师 · 入驻认证</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <script src="../js/icons.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <style>
    .ob-body { padding: 0 16px 40px; }
    .ob-steps {
      display: flex;
      align-items: center;
      padding: 20px 8px;
      background: var(--color-card);
      margin: 12px 0 16px;
      border-radius: 16px;
      box-shadow: var(--shadow-card);
    }
    .ob-step {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      position: relative;
    }
    .ob-step__dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--color-bg-2);
      color: var(--color-text-3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      font-family: var(--font-num);
      position: relative;
      z-index: 2;
    }
    .ob-step--done .ob-step__dot { background: var(--color-primary); color: #fff; }
    .ob-step--active .ob-step__dot {
      background: var(--color-accent);
      color: #fff;
      box-shadow: 0 0 0 4px var(--color-accent-soft);
    }
    .ob-step__label { font-size: 11px; color: var(--color-text-2); text-align: center; }
    .ob-step--active .ob-step__label, .ob-step--done .ob-step__label { color: var(--color-text-1); font-weight: 600; }
    .ob-step__line {
      position: absolute;
      top: 16px;
      left: 50%;
      width: 100%;
      height: 2px;
      background: var(--color-border);
      z-index: 1;
    }
    .ob-step:last-child .ob-step__line { display: none; }
    .ob-step--done .ob-step__line { background: var(--color-primary); }

    .ob-section-title {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 20px 4px 12px;
      font-size: 16px;
      font-weight: 700;
    }
    .ob-section-title .icon { color: var(--color-primary); }
    .ob-upload-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .ob-upload {
      background: var(--color-card);
      border-radius: 16px;
      padding: 16px 8px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      border: 1.5px dashed var(--color-border-strong);
      transition: all var(--duration-fast) var(--ease-out);
      text-align: center;
    }
    .ob-upload--done { border-style: solid; border-color: var(--color-primary); background: var(--color-primary-soft); }
    .ob-upload__icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--color-bg-2);
      color: var(--color-text-3);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ob-upload--done .ob-upload__icon { background: var(--color-primary); color: #fff; }
    .ob-upload__icon .icon { width: 22px; height: 22px; }
    .ob-upload__label { font-size: 12px; color: var(--color-text-1); font-weight: 500; }
    .ob-upload__status { font-size: 10px; color: var(--color-text-3); }
    .ob-upload--done .ob-upload__status { color: var(--color-primary); font-weight: 600; }

    .ob-card {
      background: var(--color-card);
      border-radius: 16px;
      padding: 4px 16px;
      box-shadow: var(--shadow-card);
      margin-bottom: 16px;
    }
    .ob-form-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid var(--color-divider);
      gap: 12px;
    }
    .ob-form-row:last-child { border-bottom: none; }
    .ob-form-row__label { font-size: 14px; color: var(--color-text-1); font-weight: 500; flex-shrink: 0; width: 80px; }
    .ob-form-row__input {
      flex: 1;
      text-align: right;
      font-size: 14px;
      color: var(--color-text-1);
    }
    .ob-form-row__input::placeholder { color: var(--color-text-3); }
    .ob-submit-bar {
      position: sticky;
      bottom: 0;
      background: var(--color-card);
      padding: 12px 16px calc(12px + var(--safe-bottom));
      box-shadow: var(--shadow-float);
      border-top: 1px solid var(--color-divider);
    }
    .ob-notice {
      background: var(--color-primary-soft);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin-bottom: 16px;
    }
    .ob-notice .icon { color: var(--color-primary); width: 18px; height: 18px; flex-shrink: 0; margin-top: 2px; }
    .ob-notice__text { font-size: 12px; color: var(--color-text-2); line-height: 1.5; }
  </style>
</head>
<body>

<div class="mobile-frame">
  <div id="header"></div>

  <div class="ob-body">
    <!-- 流程步骤 -->
    <div class="ob-steps anim-fade-up">
      <div class="ob-step ob-step--done"><div class="ob-step__line"></div><div class="ob-step__dot"><svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div><div class="ob-step__label">基础信息</div></div>
      <div class="ob-step ob-step--active"><div class="ob-step__line"></div><div class="ob-step__dot">2</div><div class="ob-step__label">资质上传</div></div>
      <div class="ob-step"><div class="ob-step__line"></div><div class="ob-step__dot">3</div><div class="ob-step__label">培训考核</div></div>
      <div class="ob-step"><div class="ob-step__line"></div><div class="ob-step__dot">4</div><div class="ob-step__label">审核中</div></div>
    </div>

    <!-- 证件上传 -->
    <div class="ob-section-title" id="upTitle"></div>
    <div class="ob-upload-grid" id="uploadGrid"></div>

    <div class="ob-notice anim-fade-up">
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <div class="ob-notice__text">所有证件信息加密存储,仅用于资质审核,不会向第三方泄露。审核通过后证件号将脱敏显示。</div>
    </div>

    <!-- 实名信息表单 -->
    <div class="ob-section-title" id="formTitle"></div>
    <div class="ob-card anim-fade-up">
      <div class="ob-form-row">
        <span class="ob-form-row__label">真实姓名</span>
        <input class="ob-form-row__input" placeholder="请输入" value="李慧敏">
      </div>
      <div class="ob-form-row">
        <span class="ob-form-row__label">身份证号</span>
        <input class="ob-form-row__input" placeholder="请输入" value="110***********1234">
      </div>
      <div class="ob-form-row">
        <span class="ob-form-row__label">手机号</span>
        <input class="ob-form-row__input" type="tel" placeholder="请输入" value="138****8866">
      </div>
      <div class="ob-form-row">
        <span class="ob-form-row__label">服务城市</span>
        <span class="ob-form-row__input" style="color:var(--color-text-2)" onclick="showToast('选择城市')">北京 <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span>
      </div>
      <div class="ob-form-row">
        <span class="ob-form-row__label">擅长医院</span>
        <span class="ob-form-row__input" style="color:var(--color-text-2)" onclick="showToast('选择医院')">协和医院等3家 <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span>
      </div>
      <div class="ob-form-row">
        <span class="ob-form-row__label">护理资质</span>
        <span class="ob-form-row__input" style="color:var(--color-text-2)" onclick="showToast('选择资质')">护士执业证 <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span>
      </div>
    </div>
  </div>

  <div class="ob-submit-bar">
    <button class="btn btn-primary btn-block btn-lg" onclick="submitOnboard()">提交审核</button>
  </div>
</div>

<script>
  document.getElementById('header').innerHTML = renderHeader('入驻认证');
  document.getElementById('upTitle').innerHTML = `${IconLib.file} 资质证件上传`;
  document.getElementById('formTitle').innerHTML = `${IconLib.profile} 实名信息`;

  const uploads = [
    { label: '执业资格证', status: '已上传', done: true },
    { label: '健康证', status: '已上传', done: true },
    { label: '培训证书', status: '点击上传', done: false },
    { label: '身份证人像', status: '已上传', done: true },
    { label: '身份证国徽', status: '已上传', done: true },
    { label: '手持证件照', status: '点击上传', done: false },
  ];
  document.getElementById('uploadGrid').innerHTML = uploads.map((u, i) => `
    <div class="ob-upload ${u.done?'ob-upload--done':''} anim-fade-up" style="animation-delay:${i*0.04}s" onclick="showToast('${u.done?'查看证件':'请拍摄或上传'}')">
      <div class="ob-upload__icon">${u.done?IconLib.checkCircle:IconLib.camera}</div>
      <div class="ob-upload__label">${u.label}</div>
      <div class="ob-upload__status">${u.status}</div>
    </div>
  `).join('');

  function submitOnboard() {
    if (confirm('确认提交入驻审核?审核通常需要1-3个工作日')) {
      showToast('已提交,审核中');
      setTimeout(() => go('c-workbench.html'), 1500);
    }
  }
</script>

</body>
</html>
