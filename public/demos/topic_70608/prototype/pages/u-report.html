<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>暖伴 · 服务报告</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <script src="../js/icons.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <style>
    .rp-body { padding: 16px; padding-bottom: 100px; }
    .rp-summary {
      background: var(--color-card);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-card);
    }
    .rp-summary__head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--color-divider);
    }
    .rp-summary__icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--color-primary-soft);
      color: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .rp-summary__icon .icon { width: 22px; height: 22px; }
    .rp-summary__title { font-size: 16px; font-weight: 700; color: var(--color-text-1); }
    .rp-summary__date { font-size: 12px; color: var(--color-text-3); font-family: var(--font-num); }
    .rp-summary__row {
      display: flex;
      padding: 8px 0;
      font-size: 14px;
    }
    .rp-summary__label { color: var(--color-text-2); width: 80px; flex-shrink: 0; }
    .rp-summary__value { color: var(--color-text-1); flex: 1; }
    .rp-section {
      background: var(--color-card);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-card);
    }
    .rp-section__title {
      font-size: 16px;
      font-weight: 700;
      color: var(--color-text-1);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .rp-section__title .icon { width: 18px; height: 18px; color: var(--color-primary); }
    .rp-advice {
      background: var(--color-accent-soft);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .rp-advice__head {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--color-accent-deep);
      margin-bottom: 8px;
    }
    .rp-advice__head .icon { width: 16px; height: 16px; }
    .rp-advice__text {
      font-size: 13px;
      color: var(--color-text-2);
      line-height: 1.7;
    }
    .rp-disclaimer {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      padding: 10px;
      background: var(--color-bg-2);
      border-radius: 10px;
      font-size: 11px;
      color: var(--color-text-3);
      line-height: 1.5;
    }
    .rp-disclaimer .icon { width: 14px; height: 14px; color: var(--color-text-3); flex-shrink: 0; margin-top: 1px; }
    .rp-photos {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .rp-photo {
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }
    .rp-photo svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .rp-photo__tag {
      position: absolute;
      bottom: 4px;
      left: 4px;
      font-size: 10px;
      color: #fff;
      background: rgba(0,0,0,0.5);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .rp-med-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: var(--color-bg-2);
      border-radius: 12px;
      margin-bottom: 8px;
    }
    .rp-med-item__icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--color-accent-soft);
      color: var(--color-accent-deep);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .rp-med-item__icon .icon { width: 20px; height: 20px; }
    .rp-med-item__name { font-size: 14px; font-weight: 600; color: var(--color-text-1); margin-bottom: 2px; }
    .rp-med-item__info { font-size: 12px; color: var(--color-text-3); }
    .rp-remind-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--color-divider);
    }
    .rp-remind-row:last-child { border-bottom: none; }
    .rp-remind-row__body { flex: 1; }
    .rp-remind-row__name { font-size: 14px; font-weight: 600; color: var(--color-text-1); }
    .rp-remind-row__time { font-size: 12px; color: var(--color-text-3); font-family: var(--font-num); }
    .rp-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: var(--container-mobile);
      margin: 0 auto;
      padding: 12px 16px calc(12px + var(--safe-bottom));
      background: var(--color-card);
      box-shadow: var(--shadow-float);
      z-index: var(--z-fixed);
      display: flex;
      gap: 12px;
    }
  </style>
</head>
<body>

<div class="mobile-frame">
  <div id="header"></div>

  <div class="rp-body">
    <div class="rp-summary anim-fade-up">
      <div class="rp-summary__head">
        <div class="rp-summary__icon">
          <span id="sumIcon"></span>
        </div>
        <div>
          <div class="rp-summary__title">就诊小结</div>
          <div class="rp-summary__date">2026-07-04 · 北京协和医院</div>
        </div>
      </div>
      <div class="rp-summary__row">
        <span class="rp-summary__label">科室</span>
        <span class="rp-summary__value">心血管内科</span>
      </div>
      <div class="rp-summary__row">
        <span class="rp-summary__label">接诊医生</span>
        <span class="rp-summary__value">张主任医师</span>
      </div>
      <div class="rp-summary__row">
        <span class="rp-summary__label">就诊人</span>
        <span class="rp-summary__value">王秀芳</span>
      </div>
      <div class="rp-summary__row">
        <span class="rp-summary__label">诊断</span>
        <span class="rp-summary__value">高血压2级(中危),血压控制尚可</span>
      </div>
      <div class="rp-summary__row">
        <span class="rp-summary__label">检查项目</span>
        <span class="rp-summary__value">心电图、心脏彩超、血压监测</span>
      </div>
    </div>

    <div class="rp-section anim-fade-up delay-1">
      <div class="rp-section__title">
        <span id="adviceIcon"></span>
        医嘱转述
      </div>
      <div class="rp-advice">
        <div class="rp-advice__head">
          <span id="noteIcon"></span>
          医生交代事项
        </div>
        <div class="rp-advice__text">
          1. 继续服用缬沙坦,每日1次,每次80mg,晨起空腹服用<br>
          2. 每日早晚各测量一次血压并记录<br>
          3. 低盐低脂饮食,适量运动,避免情绪激动<br>
          4. 两周后复查,如血压波动明显请及时就诊<br>
          5. 已开具下次复诊挂号单
        </div>
      </div>
      <div class="rp-disclaimer">
        <span id="warnIcon"></span>
        <span>以上医嘱由陪诊师根据就诊情况转述,仅供参考。具体用药及治疗方案请以医生处方为准,如有疑问请及时联系主治医生。</span>
      </div>
    </div>

    <div class="rp-section anim-fade-up delay-2">
      <div class="rp-section__title">
        <span id="photoIcon"></span>
        报告照片
      </div>
      <div class="rp-photos" id="photos"></div>
    </div>

    <div class="rp-section anim-fade-up delay-3">
      <div class="rp-section__title">
        <span id="medIcon"></span>
        用药提醒
      </div>
      <div id="medRemind"></div>
    </div>
  </div>

  <div class="rp-footer">
    <button class="btn btn-outline btn-lg" style="flex:1" onclick="showToast('报告已下载')">下载报告</button>
    <button class="btn btn-primary btn-lg" style="flex:1" onclick="go('u-review.html')">去评价</button>
  </div>
</div>

<script>
  document.getElementById('header').innerHTML = renderHeader('服务报告');
  document.getElementById('sumIcon').innerHTML = IconLib.file;
  document.getElementById('adviceIcon').innerHTML = IconLib.edit;
  document.getElementById('noteIcon').innerHTML = IconLib.edit;
  document.getElementById('warnIcon').innerHTML = IconLib.bell;
  document.getElementById('photoIcon').innerHTML = IconLib.image;
  document.getElementById('medIcon').innerHTML = IconLib.pill;

  const photoData = [
    { color1: '#E8F4F1', color2: '#B8D9D3', tag: '心电图' },
    { color1: '#FFEDD8', color2: '#FFD8A8', tag: '心脏彩超' },
    { color1: '#E3F5EC', color2: '#A8E6C5', tag: '血常规' },
    { color1: '#E8F4F1', color2: '#B8D9D3', tag: '处方单' },
    { color1: '#FFEDD8', color2: '#FFD8A8', tag: '缴费单' },
    { color1: '#E3F5EC', color2: '#A8E6C5', tag: '病历首页' },
  ];
  document.getElementById('photos').innerHTML = photoData.map(p => `
    <div class="rp-photo" onclick="showToast('查看${p.tag}')">
      <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
        <rect width="100" height="100" fill="${p.color1}"/>
        <rect x="0" y="60" width="100" height="40" fill="${p.color2}" opacity="0.5"/>
        <path d="M10 50 Q25 30 40 45 T70 40 T90 35" fill="none" stroke="#1E7A6F" stroke-width="2" opacity="0.4"/>
        <rect x="15" y="70" width="70" height="4" rx="2" fill="#fff" opacity="0.6"/>
        <rect x="15" y="80" width="50" height="3" rx="1.5" fill="#fff" opacity="0.4"/>
      </svg>
      <span class="rp-photo__tag">${p.tag}</span>
    </div>
  `).join('');

  const meds = MockData.medications.slice(0, 3);
  document.getElementById('medRemind').innerHTML = meds.map((m, i) => `
    <div class="rp-remind-row">
      <div class="rp-med-item__icon">
        <span id="med-icon-${i}">${IconLib.pill}</span>
      </div>
      <div class="rp-remind-row__body">
        <div class="rp-remind-row__name">${m.name} · ${m.dose}</div>
        <div class="rp-remind-row__time">${m.freq} · ${m.time}</div>
      </div>
      <div class="switch ${m.remind ? 'switch--on' : ''}" onclick="toggleSwitch(this)">
        <div class="switch__thumb"></div>
      </div>
    </div>
  `).join('');

  function toggleSwitch(el) { el.classList.toggle('switch--on'); }
</script>

</body>
</html>
