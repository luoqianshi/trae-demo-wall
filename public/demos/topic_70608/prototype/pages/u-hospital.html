<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>暖伴 · 医院科室</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <script src="../js/icons.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <style>
    .hosp-body { padding: 0 16px 40px; }
    .hosp-search {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--color-card);
      border-radius: 999px;
      padding: 10px 16px;
      margin: 16px 0;
      box-shadow: var(--shadow-sm);
    }
    .hosp-search .icon { width: 18px; height: 18px; color: var(--color-text-3); }
    .hosp-search input {
      flex: 1;
      font-size: 14px;
      border: none;
      background: none;
    }
    .hosp-section { margin-bottom: 24px; }
    .hosp-section__title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 16px;
      font-weight: 700;
      color: var(--color-text-1);
      margin-bottom: 12px;
    }
    .hosp-section__title .icon { width: 18px; height: 18px; color: var(--color-primary); }
    .hosp-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .hosp-item {
      background: var(--color-card);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow-card);
      display: flex;
      align-items: center;
      gap: 14px;
      transition: transform var(--duration-fast) var(--ease-out);
    }
    .hosp-item:active { transform: scale(0.98); }
    .hosp-item__icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--color-primary-soft);
      color: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .hosp-item__icon .icon { width: 24px; height: 24px; }
    .hosp-item__body { flex: 1; min-width: 0; }
    .hosp-item__name {
      font-size: 15px;
      font-weight: 600;
      color: var(--color-text-1);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }
    .hosp-item__meta {
      font-size: 12px;
      color: var(--color-text-3);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hosp-item__meta span { display: flex; align-items: center; gap: 2px; }
    .hosp-item__meta .icon { width: 12px; height: 12px; }
    .hosp-item__dist {
      font-family: var(--font-num);
      color: var(--color-primary);
      font-weight: 600;
      font-size: 13px;
    }
    .hosp-dept-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .hosp-dept {
      background: var(--color-card);
      border-radius: 12px;
      padding: 14px 4px;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      color: var(--color-text-1);
      box-shadow: var(--shadow-xs);
      transition: all var(--duration-fast) var(--ease-out);
      border: 1.5px solid transparent;
    }
    .hosp-dept:active {
      transform: scale(0.95);
      background: var(--color-primary-soft);
      border-color: var(--color-primary);
      color: var(--color-primary-deep);
    }
    [data-theme="elder"] .hosp-dept-grid {
      grid-template-columns: repeat(2, 1fr);
    }
    .hosp-notice {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--color-accent-soft);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 20px;
    }
    .hosp-notice .icon { width: 18px; height: 18px; color: var(--color-accent-deep); flex-shrink: 0; }
    .hosp-notice__text { font-size: 12px; color: var(--color-accent-deep); line-height: 1.5; }
  </style>
</head>
<body>

<div class="mobile-frame">
  <div id="header"></div>

  <div class="hosp-body">
    <div class="hosp-search">
      <span id="searchIcon"></span>
      <input type="text" placeholder="搜索医院或科室" id="searchInput">
    </div>

    <div class="hosp-notice anim-fade-up">
      <span id="noticeIcon"></span>
      <span class="hosp-notice__text">选择医院和科室后,我们将为您推荐最合适的陪诊师</span>
    </div>

    <div class="hosp-section anim-fade-up delay-1">
      <div class="hosp-section__title">
        <span id="hotIcon"></span>
        热门三甲医院
      </div>
      <div class="hosp-list" id="hospitalList"></div>
    </div>

    <div class="hosp-section anim-fade-up delay-2">
      <div class="hosp-section__title">
        <span id="deptIcon"></span>
        常见科室
      </div>
      <div class="hosp-dept-grid" id="deptGrid"></div>
    </div>
  </div>
</div>

<script>
  document.getElementById('header').innerHTML = renderHeader('选择医院科室');
  document.getElementById('searchIcon').innerHTML = IconLib.search;
  document.getElementById('noticeIcon').innerHTML = IconLib.shield;
  document.getElementById('hotIcon').innerHTML = IconLib.hospital;
  document.getElementById('deptIcon').innerHTML = IconLib.doctor;

  document.getElementById('hospitalList').innerHTML = MockData.hospitals.map(h => `
    <div class="hosp-item" onclick="go('u-companions.html?hospital=${h.id}')">
      <div class="hosp-item__icon">${IconLib.hospital}</div>
      <div class="hosp-item__body">
        <div class="hosp-item__name">
          ${h.name}
          ${h.hot ? '<span class="badge badge-accent">热门</span>' : ''}
        </div>
        <div class="hosp-item__meta">
          <span class="badge badge-primary">${h.level}</span>
          <span>${IconLib.doctor}${h.dept}</span>
        </div>
      </div>
      <span class="hosp-item__dist">${h.distance}</span>
    </div>
  `).join('');

  document.getElementById('deptGrid').innerHTML = MockData.departments.map(d => `
    <div class="hosp-dept" onclick="go('u-companions.html?dept=${encodeURIComponent(d)}')">${d}</div>
  `).join('');

  document.getElementById('searchInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.value.trim()) {
      go('u-companions.html?q=' + encodeURIComponent(e.target.value.trim()));
    }
  });
</script>

</body>
</html>
