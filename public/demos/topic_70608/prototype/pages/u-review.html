<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>暖伴 · 评价</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <script src="../js/icons.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <style>
    .rv-body { padding: 16px; padding-bottom: 100px; }
    .rv-comp {
      background: var(--color-card);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-card);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .rv-comp__avatar {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--color-primary-soft);
      color: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .rv-comp__name { font-size: 15px; font-weight: 600; color: var(--color-text-1); }
    .rv-comp__info { font-size: 12px; color: var(--color-text-3); }
    .rv-section {
      background: var(--color-card);
      border-radius: 16px;
      padding: 18px 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-card);
    }
    .rv-stars {
      display: flex;
      gap: 12px;
      justify-content: center;
      padding: 20px 0 12px;
    }
    .rv-star {
      width: 44px;
      height: 44px;
      cursor: pointer;
      transition: transform var(--duration-fast) var(--ease-out);
    }
    .rv-star:active { transform: scale(0.9); }
    .rv-star svg { width: 100%; height: 100%; }
    .rv-star--active svg { fill: var(--color-accent); stroke: var(--color-accent); }
    .rv-star--inactive svg { fill: var(--color-bg-2); stroke: var(--color-border-strong); }
    .rv-rating-text {
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--color-accent-deep);
      margin-bottom: 4px;
    }
    .rv-section__title {
      font-size: 15px;
      font-weight: 700;
      color: var(--color-text-1);
      margin-bottom: 12px;
    }
    .rv-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .rv-tag {
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--color-bg-2);
      font-size: 13px;
      color: var(--color-text-2);
      border: 1.5px solid transparent;
      transition: all var(--duration-fast) var(--ease-out);
    }
    .rv-tag--active {
      background: var(--color-primary-soft);
      color: var(--color-primary-deep);
      border-color: var(--color-primary);
    }
    .rv-textarea {
      width: 100%;
      min-height: 100px;
      padding: 14px;
      background: var(--color-bg-2);
      border-radius: 12px;
      font-size: 14px;
      border: 1.5px solid transparent;
      resize: none;
      line-height: 1.6;
    }
    .rv-textarea:focus { background: var(--color-card); border-color: var(--color-primary); }
    .rv-textarea__count {
      text-align: right;
      font-size: 12px;
      color: var(--color-text-3);
      font-family: var(--font-num);
      margin-top: 6px;
    }
    .rv-upload {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .rv-upload__item {
      width: 80px;
      height: 80px;
      border-radius: 12px;
      overflow: hidden;
    }
    .rv-upload__item svg { width: 100%; height: 100%; }
    .rv-upload__add {
      width: 80px;
      height: 80px;
      border-radius: 12px;
      border: 1.5px dashed var(--color-border-strong);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--color-text-3);
      font-size: 11px;
    }
    .rv-upload__add .icon { width: 24px; height: 24px; }
    .rv-anonymous {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px;
      background: var(--color-info-soft);
      border-radius: 12px;
      margin-top: 12px;
    }
    .rv-anonymous__icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--color-info);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .rv-anonymous__icon .icon { width: 20px; height: 20px; }
    .rv-anonymous__title { font-size: 13px; font-weight: 600; color: var(--color-text-1); }
    .rv-anonymous__desc { font-size: 11px; color: var(--color-text-3); }
    .rv-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: var(--container-mobile);
      margin: 0 auto;
      padding: 12px 16px calc(12px + var(--safe-bottom));
      background: var(--color-card);
      box-shadow: var(--shadow-float);
      z-index: var(--z-fixed);
    }
  </style>
</head>
<body>

<div class="mobile-frame">
  <div id="header"></div>

  <div class="rv-body">
    <div class="rv-comp anim-fade-up">
      <div class="rv-comp__avatar">李</div>
      <div style="flex:1">
        <div class="rv-comp__name">李慧敏</div>
        <div class="rv-comp__info">半日陪诊 · 2026-07-04 · 北京协和医院</div>
      </div>
      <span class="badge badge-success">已完成</span>
    </div>

    <div class="rv-section anim-fade-up delay-1">
      <div class="rv-stars" id="stars"></div>
      <div class="rv-rating-text" id="ratingText">点击星星评分</div>
    </div>

    <div class="rv-section anim-fade-up delay-2">
      <div class="rv-section__title">服务亮点(可多选)</div>
      <div class="rv-tags" id="tagList"></div>
    </div>

    <div class="rv-section anim-fade-up delay-3">
      <div class="rv-section__title">详细评价</div>
      <textarea class="rv-textarea" id="reviewText" placeholder="分享您的服务体验,帮助更多人选择暖伴..." maxlength="500" oninput="updateCount()"></textarea>
      <div class="rv-textarea__count"><span id="charCount">0</span>/500</div>
    </div>

    <div class="rv-section anim-fade-up delay-4">
      <div class="rv-section__title">上传图片</div>
      <div class="rv-upload" id="uploadArea">
        <div class="rv-upload__item" id="uploaded1" style="display:none">
          <svg viewBox="0 0 80 80" preserveAspectRatio="xMidYMid slice">
            <rect width="80" height="80" fill="#E8F4F1"/>
            <path d="M10 40 Q25 25 40 35 T70 30" fill="none" stroke="#1E7A6F" stroke-width="2"/>
          </svg>
        </div>
        <div class="rv-upload__add" onclick="addPhoto()">
          <span id="addIcon"></span>
          <span>添加图片</span>
        </div>
      </div>
    </div>

    <div class="rv-anonymous anim-fade-up delay-5">
      <div class="rv-anonymous__icon">
        <span id="anonIcon"></span>
      </div>
      <div style="flex:1">
        <div class="rv-anonymous__title">匿名评价</div>
        <div class="rv-anonymous__desc">您的评价将对陪诊师和平台可见,不对外展示个人信息</div>
      </div>
      <div class="switch switch--on" onclick="toggleSwitch(this)">
        <div class="switch__thumb"></div>
      </div>
    </div>
  </div>

  <div class="rv-footer">
    <button class="btn btn-primary btn-lg btn-block" onclick="submitReview()">提交评价</button>
  </div>
</div>

<script>
  document.getElementById('header').innerHTML = renderHeader('服务评价');
  document.getElementById('addIcon').innerHTML = IconLib.image;
  document.getElementById('anonIcon').innerHTML = IconLib.shield;

  let currentRating = 5;
  const ratingLabels = ['', '很不满意', '不满意', '一般', '满意', '非常满意'];

  function renderStars() {
    document.getElementById('stars').innerHTML = Array.from({ length: 5 }, (_, i) => `
      <div class="rv-star ${i < currentRating ? 'rv-star--active' : 'rv-star--inactive'}" onclick="setRating(${i + 1})">
        <svg viewBox="0 0 24 24" fill="${i < currentRating ? '#F2994A' : '#F0F0F0'}" stroke="${i < currentRating ? '#F2994A' : '#D0D0D0'}" stroke-width="1.5" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
      </div>
    `).join('');
    document.getElementById('ratingText').textContent = ratingLabels[currentRating];
  }
  renderStars();

  function setRating(n) {
    currentRating = n;
    renderStars();
  }

  document.getElementById('tagList').innerHTML = MockData.evalTags.map((t, i) =>
    `<span class="rv-tag" onclick="toggleTag(this)">${t}</span>`
  ).join('');

  function toggleTag(el) { el.classList.toggle('rv-tag--active'); }

  function updateCount() {
    document.getElementById('charCount').textContent = document.getElementById('reviewText').value.length;
  }

  let photoCount = 0;
  function addPhoto() {
    if (photoCount >= 3) { showToast('最多上传3张图片'); return; }
    photoCount++;
    const area = document.getElementById('uploadArea');
    const item = document.createElement('div');
    item.className = 'rv-upload__item';
    item.innerHTML = `<svg viewBox="0 0 80 80" preserveAspectRatio="xMidYMid slice"><rect width="80" height="80" fill="#${['E8F4F1','FFEDD8','E3F5EC'][photoCount-1]}"/><path d="M10 40 Q25 25 40 35 T70 30" fill="none" stroke="#1E7A6F" stroke-width="2"/></svg>`;
    area.insertBefore(item, area.lastElementChild);
    showToast('图片已添加');
  }

  function toggleSwitch(el) { el.classList.toggle('switch--on'); }

  function submitReview() {
    if (currentRating === 0) { showToast('请先选择评分'); return; }
    showToast('评价提交成功');
    setTimeout(() => go('u-home.html'), 1500);
  }
</script>

</body>
</html>
