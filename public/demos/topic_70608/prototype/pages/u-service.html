<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>暖伴 · 选择服务</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <script src="../js/icons.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <style>
    .svc-body {
      padding: 16px 16px 40px;
    }
    .svc-intro {
      background: var(--gradient-trust);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .svc-intro__icon {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      flex-shrink: 0;
    }
    .svc-intro__icon .icon { width: 28px; height: 28px; }
    .svc-intro__title { font-size: 17px; font-weight: 700; color: var(--color-text-1); margin-bottom: 4px; }
    .svc-intro__desc { font-size: 13px; color: var(--color-text-2); }
    .svc-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .svc-card {
      background: var(--color-card);
      border-radius: 20px;
      padding: 20px;
      box-shadow: var(--shadow-card);
      display: flex;
      gap: 16px;
      align-items: flex-start;
      transition: transform var(--duration-fast) var(--ease-out);
      position: relative;
      overflow: hidden;
    }
    .svc-card:active { transform: scale(0.98); }
    .svc-card::after {
      content: '';
      position: absolute;
      right: -30px;
      bottom: -30px;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      opacity: 0.06;
    }
    .svc-card__icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .svc-card__icon .icon { width: 28px; height: 28px; }
    .svc-card__body { flex: 1; min-width: 0; }
    .svc-card__name {
      font-size: 16px;
      font-weight: 700;
      color: var(--color-text-1);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .svc-card__desc {
      font-size: 13px;
      color: var(--color-text-2);
      line-height: 1.5;
      margin-bottom: 10px;
    }
    .svc-card__footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .svc-card__price {
      display: flex;
      align-items: baseline;
      gap: 2px;
    }
    .svc-card__arrow {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--color-bg-2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-3);
    }
    .svc-card__arrow .icon { width: 16px; height: 16px; }
    .svc-trust {
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      background: var(--color-primary-soft);
      border-radius: 16px;
      padding: 16px;
    }
    .svc-trust__item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .svc-trust__icon {
      width: 28px;
      height: 28px;
      color: var(--color-primary);
    }
    .svc-trust__icon .icon { width: 28px; height: 28px; }
    .svc-trust__label {
      font-size: 12px;
      color: var(--color-primary-deep);
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="mobile-frame">
  <div id="header"></div>

  <div class="svc-body">
    <div class="svc-intro anim-fade-up">
      <div class="svc-intro__icon">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 21s-7-4.5-9.5-9C1 9 2.5 5 6 5c2 0 3.5 1 4.5 2.5C11.5 6 13 5 15 5c3.5 0 5 4 3.5 7-2.5 4.5-9.5 9-9.5 9z"/>
        </svg>
      </div>
      <div>
        <div class="svc-intro__title">选择您需要的服务</div>
        <div class="svc-intro__desc">每一位陪诊师均经严格筛选与培训</div>
      </div>
    </div>

    <div class="svc-list" id="serviceList"></div>

    <div class="svc-trust anim-fade-up delay-2" id="trustBar"></div>
  </div>
</div>

<script>
  document.getElementById('header').innerHTML = renderHeader('选择服务');

  document.getElementById('serviceList').innerHTML = MockData.services.map((s, i) => `
    <div class="svc-card anim-fade-up delay-${Math.min(i + 1, 5)}" onclick="go('u-hospital.html?service=${s.id}')">
      <div class="svc-card__icon" style="background:${s.color}15;color:${s.color}">
        ${IconLib[s.icon] || IconLib.heart}
      </div>
      <div class="svc-card__body">
        <div class="svc-card__name">${s.name}</div>
        <div class="svc-card__desc">${s.desc}</div>
        <div class="svc-card__footer">
          <div class="svc-card__price">
            <span class="price"><span class="price__symbol">¥</span><span class="price__integer">${s.price}</span><span class="price__decimal">/${s.unit}</span></span>
          </div>
          <div class="svc-card__arrow">${IconLib.arrow}</div>
        </div>
      </div>
      <div style="position:absolute;right:-30px;bottom:-30px;width:100px;height:100px;border-radius:50%;background:${s.color};opacity:0.04"></div>
    </div>
  `).join('');

  const trustItems = [
    { icon: 'shield', label: '保险保障' },
    { icon: 'checkCircle', label: '100%认证' },
    { icon: 'starFill', label: '好评98.6%' },
  ];
  document.getElementById('trustBar').innerHTML = trustItems.map(t => `
    <div class="svc-trust__item">
      <div class="svc-trust__icon">${IconLib[t.icon]}</div>
      <div class="svc-trust__label">${t.label}</div>
    </div>
  `).join('');
</script>

</body>
</html>
