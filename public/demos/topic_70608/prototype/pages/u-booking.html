<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>暖伴 · 预约下单</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <script src="../js/icons.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <style>
    .bk-body { padding: 16px; padding-bottom: 120px; }
    .bk-section {
      background: var(--color-card);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-card);
    }
    .bk-section__title {
      font-size: 16px;
      font-weight: 700;
      color: var(--color-text-1);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .bk-section__title .icon { width: 18px; height: 18px; color: var(--color-primary); }
    .bk-section__title .badge { margin-left: auto; }
    .bk-patient {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border-radius: 12px;
      background: var(--color-primary-soft);
      border: 1.5px solid var(--color-primary);
    }
    .bk-patient__avatar {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--color-primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .bk-patient__name { font-size: 15px; font-weight: 600; color: var(--color-text-1); margin-bottom: 2px; }
    .bk-patient__info { font-size: 12px; color: var(--color-text-2); }
    .bk-patient__check {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      flex-shrink: 0;
    }
    .bk-patient__check .icon { width: 14px; height: 14px; }
    .bk-patient-add {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 14px;
      border-radius: 12px;
      border: 1.5px dashed var(--color-border-strong);
      color: var(--color-text-2);
      font-size: 14px;
      margin-top: 10px;
    }
    .bk-patient-add .icon { width: 18px; height: 18px; }
    .bk-datetime {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin: 0 -4px;
      -webkit-overflow-scrolling: touch;
    }
    .bk-datetime::-webkit-scrollbar { display: none; }
    .bk-date {
      flex-shrink: 0;
      width: 64px;
      padding: 10px 4px;
      border-radius: 12px;
      text-align: center;
      border: 1.5px solid var(--color-border);
      background: var(--color-card);
    }
    .bk-date--active {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: #fff;
    }
    .bk-date__week { font-size: 11px; color: var(--color-text-3); margin-bottom: 2px; }
    .bk-date--active .bk-date__week { color: rgba(255,255,255,0.8); }
    .bk-date__day { font-family: var(--font-num); font-size: 20px; font-weight: 700; }
    .bk-time-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }
    .bk-time {
      padding: 10px;
      border-radius: 10px;
      background: var(--color-bg-2);
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      border: 1.5px solid transparent;
    }
    .bk-time--active {
      background: var(--color-primary-soft);
      color: var(--color-primary-deep);
      border-color: var(--color-primary);
    }
    .bk-time--disabled { opacity: 0.4; text-decoration: line-through; }
    .bk-addon {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--color-divider);
    }
    .bk-addon:last-child { border-bottom: none; }
    .bk-addon__check {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid var(--color-border-strong);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--duration-fast) var(--ease-out);
    }
    .bk-addon--checked .bk-addon__check {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: #fff;
    }
    .bk-addon__check .icon { width: 14px; height: 14px; opacity: 0; }
    .bk-addon--checked .bk-addon__check .icon { opacity: 1; }
    .bk-addon__body { flex: 1; }
    .bk-addon__name { font-size: 14px; font-weight: 600; color: var(--color-text-1); margin-bottom: 2px; }
    .bk-addon__desc { font-size: 12px; color: var(--color-text-3); }
    .bk-addon__price { font-family: var(--font-num); font-weight: 700; color: var(--color-accent-deep); font-size: 15px; }
    .bk-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: var(--container-mobile);
      margin: 0 auto;
      background: var(--color-card);
      padding: 12px 16px calc(12px + var(--safe-bottom));
      box-shadow: var(--shadow-float);
      z-index: var(--z-fixed);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .bk-footer__price { flex: 1; }
    .bk-footer__label { font-size: 12px; color: var(--color-text-3); }
    .bk-footer__total { font-family: var(--font-num); font-size: 24px; font-weight: 800; color: var(--color-accent-deep); }
    .bk-footer__total .price__symbol { font-size: 14px; }
    .bk-note {
      width: 100%;
      min-height: 80px;
      padding: 12px;
      background: var(--color-bg-2);
      border-radius: 12px;
      font-size: 14px;
      border: 1.5px solid transparent;
      resize: none;
    }
    .bk-note:focus { background: var(--color-card); border-color: var(--color-primary); }
  </style>
</head>
<body>

<div class="mobile-frame">
  <div id="header"></div>

  <div class="bk-body">
    <div class="bk-section anim-fade-up">
      <div class="bk-section__title">
        <span id="patientIcon"></span>
        就诊人
        <a href="u-health-form.html" style="margin-left:auto;font-size:13px;color:var(--color-primary)">管理</a>
      </div>
      <div class="bk-patient">
        <div class="bk-patient__avatar">王</div>
        <div style="flex:1">
          <div class="bk-patient__name">王秀芳 <span class="badge badge-primary" style="margin-left:4px">本人</span></div>
          <div class="bk-patient__info">女 · 68岁 · 138****6688</div>
        </div>
        <div class="bk-patient__check"><span id="checkIcon"></span></div>
      </div>
      <div class="bk-patient-add" onclick="showToast('添加就诊人')">
        <span id="addIcon"></span>
        添加其他就诊人
      </div>
    </div>

    <div class="bk-section anim-fade-up delay-1">
      <div class="bk-section__title">
        <span id="calIcon"></span>
        就诊日期
      </div>
      <div class="bk-datetime" id="dateList"></div>
      <div class="bk-time-grid" id="timeGrid"></div>
    </div>

    <div class="bk-section anim-fade-up delay-2">
      <div class="bk-section__title">
        <span id="noteIcon"></span>
        需求备注
      </div>
      <textarea class="bk-note" placeholder="如:老人行动不便需轮椅,有高血压病史,请提前准备..."></textarea>
    </div>

    <div class="bk-section anim-fade-up delay-3">
      <div class="bk-section__title">
        <span id="addonIcon"></span>
        增值服务
      </div>
      <div id="addonList"></div>
    </div>
  </div>

  <div class="bk-footer">
    <div class="bk-footer__price">
      <div class="bk-footer__label">预估费用</div>
      <div class="bk-footer__total"><span class="price__symbol">¥</span><span id="totalPrice">299</span></div>
    </div>
    <button class="btn btn-primary btn-lg" style="flex:1" onclick="go('u-confirm.html')">下一步</button>
  </div>
</div>

<script>
  document.getElementById('header').innerHTML = renderHeader('预约下单');
  document.getElementById('patientIcon').innerHTML = IconLib.profile;
  document.getElementById('checkIcon').innerHTML = IconLib.check;
  document.getElementById('addIcon').innerHTML = IconLib.plus;
  document.getElementById('calIcon').innerHTML = IconLib.calendar;
  document.getElementById('noteIcon').innerHTML = IconLib.edit;
  document.getElementById('addonIcon').innerHTML = IconLib.plus;

  const dates = [
    { week: '今日', day: '4', active: true },
    { week: '明日', day: '5' },
    { week: '周日', day: '6' },
    { week: '周一', day: '7' },
    { week: '周三', day: '9' },
    { week: '周四', day: '10' },
  ];
  document.getElementById('dateList').innerHTML = dates.map(d => `
    <div class="bk-date ${d.active ? 'bk-date--active' : ''}" onclick="selectDate(this)">
      <div class="bk-date__week">${d.week}</div>
      <div class="bk-date__day">${d.day}</div>
    </div>
  `).join('');

  const times = [
    { time: '08:00', disabled: true },
    { time: '09:00', active: true },
    { time: '10:00' },
    { time: '11:00' },
    { time: '14:00' },
    { time: '15:00', disabled: true },
  ];
  document.getElementById('timeGrid').innerHTML = times.map(t => `
    <div class="bk-time ${t.active ? 'bk-time--active' : ''} ${t.disabled ? 'bk-time--disabled' : ''}" onclick="selectTime(this)">${t.time}</div>
  `).join('');

  const addons = [
    { name: '代办挂号', desc: '陪诊师代为挂号签到', price: 0, checked: true },
    { name: '专车接送', desc: '往返接送,安全便捷', price: 80, checked: false },
    { name: '代取报告', desc: '检查报告出具后代取邮寄', price: 30, checked: false },
  ];
  let basePrice = 299;
  function renderAddons() {
    document.getElementById('addonList').innerHTML = addons.map((a, i) => `
      <div class="bk-addon ${a.checked ? 'bk-addon--checked' : ''}" onclick="toggleAddon(${i})">
        <div class="bk-addon__check">${IconLib.check}</div>
        <div class="bk-addon__body">
          <div class="bk-addon__name">${a.name}</div>
          <div class="bk-addon__desc">${a.desc}</div>
        </div>
        <div class="bk-addon__price">${a.price === 0 ? '免费' : '+¥' + a.price}</div>
      </div>
    `).join('');
    updateTotal();
  }
  function toggleAddon(i) {
    addons[i].checked = !addons[i].checked;
    renderAddons();
  }
  function updateTotal() {
    const total = basePrice + addons.filter(a => a.checked).reduce((s, a) => s + a.price, 0);
    document.getElementById('totalPrice').textContent = total;
  }
  renderAddons();

  function selectDate(el) {
    document.querySelectorAll('.bk-date').forEach(d => d.classList.remove('bk-date--active'));
    el.classList.add('bk-date--active');
  }
  function selectTime(el) {
    if (el.classList.contains('bk-time--disabled')) return;
    document.querySelectorAll('.bk-time').forEach(t => t.classList.remove('bk-time--active'));
    el.classList.add('bk-time--active');
  }
</script>

</body>
</html>
