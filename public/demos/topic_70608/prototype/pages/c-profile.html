<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>暖伴陪诊师 · 我的</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <script src="../js/icons.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <style>
    .cp-hero {
      background: var(--gradient-warm);
      padding: calc(var(--safe-top) + 18px) 20px 58px;
      color:#fff;
      position:relative;
      overflow:hidden;
    }
    .cp-hero::before { content:''; position:absolute; right:-54px; top:-34px; width:170px; height:170px; border-radius:50%; background:rgba(242,153,74,0.2); filter:blur(28px); }
    .cp-top { display:flex; align-items:center; justify-content:space-between; position:relative; z-index:2; margin-bottom:18px; }
    .cp-user { display:flex; align-items:center; gap:12px; }
    .cp-avatar { width:58px; height:58px; border-radius:50%; background:rgba(255,255,255,0.18); border:2px solid rgba(255,255,255,0.3); display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:800; }
    .cp-name { font-size:18px; font-weight:800; margin-bottom:4px; }
    .cp-sub { font-size:12px; opacity:0.88; display:flex; align-items:center; gap:4px; }
    .cp-sub .icon { width:14px; height:14px; }
    .cp-action { width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,0.16); display:flex; align-items:center; justify-content:center; }
    .cp-action .icon { width:20px; height:20px; }
    .cp-level { position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between; padding:13px 14px; border-radius:16px; background:rgba(255,255,255,0.14); backdrop-filter:blur(12px); }
    .cp-level__text { font-size:13px; opacity:0.92; }
    .cp-level__val { font-size:15px; font-weight:800; display:flex; align-items:center; gap:5px; }
    .cp-level__val .icon { color:#FFD36E; width:16px; height:16px; }

    .cp-body { padding:0 16px 100px; margin-top:-36px; position:relative; z-index:3; }
    .cp-stats { display:grid; grid-template-columns:repeat(3,1fr); background:var(--color-card); border-radius:16px; padding:16px 8px; box-shadow:var(--shadow-lg); margin-bottom:14px; }
    .cp-stat { text-align:center; position:relative; }
    .cp-stat:not(:last-child)::after { content:''; position:absolute; right:0; top:20%; height:60%; width:1px; background:var(--color-divider); }
    .cp-stat__val { font-family:var(--font-num); font-size:22px; font-weight:800; color:var(--color-text-1); margin-bottom:4px; }
    .cp-stat__label { font-size:11px; color:var(--color-text-3); }

    .cp-card { background:var(--color-card); border-radius:16px; padding:16px; box-shadow:var(--shadow-card); margin-bottom:14px; }
    .cp-card__head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
    .cp-card__title { display:flex; align-items:center; gap:6px; font-size:15px; font-weight:800; }
    .cp-card__title .icon { color:var(--color-primary); }
    .cp-card__more { font-size:12px; color:var(--color-text-3); }

    .cp-progress { height:8px; background:var(--color-bg-2); border-radius:999px; overflow:hidden; margin:10px 0 8px; }
    .cp-progress__bar { width:72%; height:100%; border-radius:999px; background:linear-gradient(90deg, var(--color-primary), var(--color-accent)); }
    .cp-progress__desc { display:flex; justify-content:space-between; font-size:11px; color:var(--color-text-3); }

    .cp-grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; }
    .cp-grid__item { display:flex; flex-direction:column; align-items:center; gap:8px; padding:12px 4px; }
    .cp-grid__icon { width:42px; height:42px; border-radius:13px; display:flex; align-items:center; justify-content:center; }
    .cp-grid__icon .icon { width:21px; height:21px; }
    .cp-grid__label { font-size:12px; color:var(--color-text-2); text-align:center; }

    .cp-list { background:var(--color-card); border-radius:16px; box-shadow:var(--shadow-card); overflow:hidden; margin-bottom:14px; }
    .cp-row { display:flex; align-items:center; gap:12px; padding:15px 16px; border-bottom:1px solid var(--color-divider); }
    .cp-row:last-child { border-bottom:none; }
    .cp-row__icon { width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; background:var(--color-primary-soft); color:var(--color-primary); flex-shrink:0; }
    .cp-row__icon--accent { background:var(--color-accent-soft); color:var(--color-accent-deep); }
    .cp-row__icon--success { background:var(--color-success-soft); color:var(--color-success); }
    .cp-row__icon .icon { width:17px; height:17px; }
    .cp-row__body { flex:1; }
    .cp-row__title { font-size:14px; font-weight:600; color:var(--color-text-1); margin-bottom:2px; }
    .cp-row__desc { font-size:11px; color:var(--color-text-3); }
  </style>
</head>
<body>

<div class="mobile-frame">
  <div class="cp-hero">
    <div class="cp-top">
      <div class="cp-user">
        <div class="cp-avatar">李</div>
        <div>
          <div class="cp-name">李慧敏</div>
          <div class="cp-sub"><svg class="icon" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> 已实名 · 金牌陪诊师 · 服务3年</div>
        </div>
      </div>
      <div class="cp-action" onclick="showToast('设置中心')"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div>
    </div>
    <div class="cp-level">
      <div>
        <div class="cp-level__val"><svg class="icon" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> 金牌等级</div>
        <div class="cp-level__text">再完成 8 单可冲刺钻石陪诊师</div>
      </div>
      <button class="btn btn-sm" style="background:#fff;color:var(--color-accent-deep)" onclick="go('c-rating.html')">权益</button>
    </div>
  </div>

  <div class="cp-body">
    <div class="cp-stats anim-fade-up">
      <div class="cp-stat"><div class="cp-stat__val">386</div><div class="cp-stat__label">累计订单</div></div>
      <div class="cp-stat"><div class="cp-stat__val">4.9</div><div class="cp-stat__label">服务评分</div></div>
      <div class="cp-stat"><div class="cp-stat__val">98%</div><div class="cp-stat__label">准时率</div></div>
    </div>

    <div class="cp-card anim-fade-up">
      <div class="cp-card__head">
        <div class="cp-card__title" id="growthTitle"></div>
        <span class="cp-card__more">本月成长值 720/1000</span>
      </div>
      <div class="cp-progress"><div class="cp-progress__bar"></div></div>
      <div class="cp-progress__desc"><span>金牌</span><span>钻石</span></div>
    </div>

    <div class="cp-card anim-fade-up">
      <div class="cp-card__head">
        <div class="cp-card__title" id="quickTitle"></div>
      </div>
      <div class="cp-grid" id="quickGrid"></div>
    </div>

    <div class="cp-list anim-fade-up" id="menuList"></div>
  </div>

  <div id="tabbar"></div>
</div>

<script>
  document.getElementById('tabbar').innerHTML = renderCompanionTabbar('profile');
  document.getElementById('growthTitle').innerHTML = `${IconLib.trending} 等级成长`;
  document.getElementById('quickTitle').innerHTML = `${IconLib.route} 常用工具`;

  const quicks = [
    { icon:'calendar', label:'排班', color:'#F2994A', bg:'#FFEDD8', url:'c-schedule.html' },
    { icon:'message', label:'消息', color:'#1E7A6F', bg:'#E8F4F1', url:'c-messages.html' },
    { icon:'shield', label:'培训', color:'#2D9CDB', bg:'#E3F4FC', url:'c-training.html' },
    { icon:'wallet', label:'收益', color:'#27AE60', bg:'#E3F5EC', url:'c-income.html' }
  ];
  document.getElementById('quickGrid').innerHTML = quicks.map(q => `
    <div class="cp-grid__item" onclick="go('${q.url}')">
      <div class="cp-grid__icon" style="background:${q.bg};color:${q.color}">${IconLib[q.icon]}</div>
      <span class="cp-grid__label">${q.label}</span>
    </div>
  `).join('');

  const menus = [
    { icon:'file', type:'primary', title:'我的资质', desc:'身份证、健康证、培训证书均已认证' },
    { icon:'heart', type:'accent', title:'服务偏好', desc:'已开启心内科、老年陪诊、代办跑腿' },
    { icon:'phone', type:'success', title:'紧急联系人', desc:'平台安全专线与家属联系记录' },
    { icon:'settings', type:'primary', title:'账号设置', desc:'通知、隐私、银行卡与登录安全' }
  ];
  document.getElementById('menuList').innerHTML = menus.map(m => `
    <div class="cp-row" onclick="showToast('${m.title}')">
      <div class="cp-row__icon cp-row__icon--${m.type}">${IconLib[m.icon]}</div>
      <div class="cp-row__body"><div class="cp-row__title">${m.title}</div><div class="cp-row__desc">${m.desc}</div></div>
      ${IconLib.arrow}
    </div>
  `).join('');
</script>

</body>
</html>
