<!DOCTYPE html>
<html lang="zh-CN" data-theme="elder">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>暖伴 · 大字版首页</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <script src="../js/icons.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <style>
    .eh-hero {
      background: var(--gradient-warm);
      padding: calc(var(--safe-top) + 20px) 20px 40px;
      color: #fff;
      position: relative;
      overflow: hidden;
    }
    .eh-hero::before {
      content: '';
      position: absolute;
      right: -60px;
      top: -30px;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: rgba(242, 153, 74, 0.22);
      filter: blur(28px);
    }
    .eh-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 2;
      margin-bottom: 20px;
    }
    .eh-topbar__title { font-size: 22px; font-weight: 700; }
    .eh-topbar__btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .eh-topbar__btn .icon { width: 24px; height: 24px; }
    .eh-greeting {
      position: relative;
      z-index: 2;
      margin-bottom: 8px;
    }
    .eh-greeting__title { font-size: 28px; font-weight: 700; margin-bottom: 6px; }
    .eh-greeting__sub { font-size: 16px; opacity: 0.9; }

    .eh-body { padding: 20px 20px 120px; }
    .eh-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 24px;
    }
    .eh-card {
      background: var(--color-card);
      border-radius: 20px;
      padding: 24px 16px;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      transition: transform var(--duration-fast) var(--ease-spring);
      min-height: 160px;
      justify-content: center;
    }
    .eh-card:active { transform: scale(0.95); }
    .eh-card__icon {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .eh-card__icon .icon { width: 40px; height: 40px; }
    .eh-card__icon--primary { background: var(--gradient-warm); }
    .eh-card__icon--accent { background: var(--gradient-sunrise); }
    .eh-card__icon--alert { background: var(--color-alert); }
    .eh-card__icon--info { background: var(--color-primary); }
    .eh-card__label { font-size: 20px; font-weight: 700; color: var(--color-text-1); }
    .eh-card__desc { font-size: 14px; color: var(--color-text-3); text-align: center; }

    .eh-hotline {
      background: var(--gradient-sunrise);
      border-radius: 20px;
      padding: 24px 20px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: var(--shadow-warm);
      margin-bottom: 20px;
    }
    .eh-hotline__icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: rgba(255,255,255,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .eh-hotline__icon .icon { width: 30px; height: 30px; }
    .eh-hotline__title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .eh-hotline__num { font-family: var(--font-num); font-size: 24px; font-weight: 800; }
    .eh-hotline__arrow { margin-left: auto; }

    .eh-tip {
      background: var(--color-primary-soft);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .eh-tip__icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--color-primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .eh-tip__icon .icon { width: 22px; height: 22px; }
    .eh-tip__text { font-size: 16px; color: var(--color-primary-deep); font-weight: 500; line-height: 1.5; }
    .eh-mode-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px;
      border: 2px solid var(--color-primary);
      border-radius: 16px;
      color: var(--color-primary);
      font-size: 18px;
      font-weight: 700;
      background: var(--color-card);
      width: 100%;
    }
  </style>
</head>
<body>

<div class="mobile-frame">
  <div class="eh-hero">
    <div class="eh-topbar">
      <span class="eh-topbar__title">暖伴</span>
      <div style="display:flex;gap:10px">
        <div class="eh-topbar__btn" onclick="showToast('消息中心')"><svg class="icon" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></div>
        <div class="eh-topbar__btn" onclick="go('u-profile.html')"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg></div>
      </div>
    </div>
    <div class="eh-greeting anim-fade-up">
      <div class="eh-greeting__title">您好,王阿姨</div>
      <div class="eh-greeting__sub">就医路上,温暖相伴</div>
    </div>
  </div>

  <div class="eh-body">
    <!-- 核心功能宫格 (2列大图标) -->
    <div class="eh-grid" id="ehGrid"></div>

    <!-- 24h热线 -->
    <a class="eh-hotline anim-fade-up" href="tel:4008206688" id="ehHotline"></a>

    <!-- 提示 -->
    <div class="eh-tip anim-fade-up" style="margin-bottom:20px">
      <div class="eh-tip__icon"><svg class="icon" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
      <div class="eh-tip__text">所有陪诊师均实名认证,服务全程保险保障,请放心使用</div>
    </div>

    <!-- 切换标准模式 -->
    <button class="eh-mode-toggle" onclick="toggleElderMode();setTimeout(()=>{if(document.documentElement.getAttribute('data-theme')!=='elder')go('u-home.html')},300)">
      <svg class="icon" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg> 切换回标准版
    </button>
  </div>

  <div id="tabbar"></div>
</div>

<script>
  document.getElementById('tabbar').innerHTML = renderTabbar('home');

  // 核心功能:只保留4个
  const coreFuncs = [
    { icon: 'heart', label: '预约陪诊', desc: '专业陪诊师', type: 'primary', url: 'u-booking.html' },
    { icon: 'order', label: '我的订单', desc: '查看订单进度', type: 'info', url: 'u-orders.html' },
    { icon: 'phone', label: '紧急呼叫', desc: '一键拨打热线', type: 'alert', url: 'tel:4008206688' },
    { icon: 'message', label: '在线客服', desc: '人工在线解答', type: 'accent', url: 'u-chat.html' },
  ];
  document.getElementById('ehGrid').innerHTML = coreFuncs.map((f, i) => `
    <div class="eh-card anim-fade-up" style="animation-delay:${i*0.08}s" onclick="go('${f.url}')">
      <div class="eh-card__icon eh-card__icon--${f.type}">${IconLib[f.icon]}</div>
      <div>
        <div class="eh-card__label">${f.label}</div>
        <div class="eh-card__desc">${f.desc}</div>
      </div>
    </div>
  `).join('');

  // 热线按钮
  document.getElementById('ehHotline').innerHTML = `
    <div class="eh-hotline__icon">${IconLib.phone}</div>
    <div style="flex:1">
      <div class="eh-hotline__title">24小时服务热线</div>
      <div class="eh-hotline__num">400-820-6688</div>
    </div>
    <span class="eh-hotline__arrow">${IconLib.arrow}</span>
  `;
</script>

</body>
</html>
