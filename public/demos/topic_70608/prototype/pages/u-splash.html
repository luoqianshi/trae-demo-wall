<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>暖伴 · 启动</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <script src="../js/icons.js"></script>
  <script src="../js/app.js"></script>
  <style>
    .splash {
      min-height: 100vh;
      background: var(--gradient-warm);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 0 32px;
    }
    .splash::before {
      content: '';
      position: absolute;
      top: -120px;
      right: -80px;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: rgba(242, 153, 74, 0.22);
      filter: blur(40px);
      animation: sunGlow 3s var(--ease-in-out) infinite;
    }
    .splash::after {
      content: '';
      position: absolute;
      bottom: -100px;
      left: -60px;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      filter: blur(30px);
      animation: sunGlow 3.5s var(--ease-in-out) infinite 0.5s;
    }
    @keyframes sunGlow {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.12); }
    }
    .splash-logo {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: logoIn 0.8s var(--ease-spring) both;
    }
    @keyframes logoIn {
      from { opacity: 0; transform: scale(0.85) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .splash-logo__mark {
      width: 96px;
      height: 96px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(8px);
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      position: relative;
    }
    .splash-logo__mark .icon {
      width: 52px;
      height: 52px;
      color: #fff;
      stroke-width: 1.8;
    }
    .splash-logo__mark::after {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 32px;
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      animation: ripplePulse 2s var(--ease-out) infinite;
    }
    @keyframes ripplePulse {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.15); opacity: 0; }
    }
    .splash-logo__name {
      font-size: 32px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }
    .splash-logo__slogan {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.82);
      letter-spacing: 1px;
    }
    .splash-trust {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 28px;
      margin-top: 64px;
      animation: fadeInUp 0.8s var(--ease-out) 0.4s both;
    }
    .splash-trust__item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .splash-trust__icon {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .splash-trust__icon .icon { width: 20px; height: 20px; }
    .splash-trust__num {
      font-family: var(--font-num);
      font-size: 18px;
      font-weight: 700;
      color: #fff;
    }
    .splash-trust__label {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.75);
    }
    .splash-trust__divider {
      width: 1px;
      height: 36px;
      background: rgba(255, 255, 255, 0.2);
    }
    .splash-skip {
      position: absolute;
      bottom: calc(var(--safe-bottom) + 32px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      padding: 8px 24px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      color: rgba(255, 255, 255, 0.9);
      font-size: 13px;
      font-weight: 500;
      animation: fadeIn 0.5s var(--ease-out) 1s both;
    }
    .splash-skip:active { background: rgba(255, 255, 255, 0.25); }
    .splash-loading {
      position: absolute;
      bottom: calc(var(--safe-bottom) + 80px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      width: 120px;
      height: 3px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      overflow: hidden;
    }
    .splash-loading__bar {
      height: 100%;
      width: 0;
      background: #fff;
      border-radius: 999px;
      animation: loadProgress 2s var(--ease-in-out) forwards;
    }
    @keyframes loadProgress {
      to { width: 100%; }
    }
  </style>
</head>
<body>

<div class="mobile-frame">
  <div class="splash">
    <div class="splash-logo">
      <div class="splash-logo__mark">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 21s-7-4.5-9.5-9C1 9 2.5 5 6 5c2 0 3.5 1 4.5 2.5C11.5 6 13 5 15 5c3.5 0 5 4 3.5 7-2.5 4.5-9.5 9-9.5 9z"/>
          <path d="M12 11v6M9 14h6" stroke-width="1.5" opacity="0.6"/>
        </svg>
      </div>
      <div class="splash-logo__name">暖伴</div>
      <div class="splash-logo__slogan">就医路上 · 温暖相伴</div>
    </div>

    <div class="splash-trust" id="trustBar"></div>

    <div class="splash-loading">
      <div class="splash-loading__bar"></div>
    </div>

    <button class="splash-skip" onclick="go('u-onboarding.html')">跳过</button>
  </div>
</div>

<script>
  const trustItems = [
    { icon: 'users', num: '5000+', label: '认证陪诊师' },
    { icon: 'shield', num: '100%', label: '资质认证' },
    { icon: 'checkCircle', num: '保险', label: '全程保障' },
  ];
  document.getElementById('trustBar').innerHTML = trustItems.map((t, i) => `
    ${i > 0 ? '<div class="splash-trust__divider"></div>' : ''}
    <div class="splash-trust__item">
      <div class="splash-trust__icon">${IconLib[t.icon]}</div>
      <div class="splash-trust__num">${t.num}</div>
      <div class="splash-trust__label">${t.label}</div>
    </div>
  `).join('');

  setTimeout(() => { go('u-onboarding.html'); }, 2000);
</script>

</body>
</html>
