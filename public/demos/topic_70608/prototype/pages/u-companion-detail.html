<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>暖伴 · 陪诊师详情</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <script src="../js/icons.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <style>
    .cd-body { padding-bottom: 90px; }
    .cd-hero {
      background: var(--gradient-warm);
      padding: calc(var(--safe-top) + 12px) 20px 60px;
      color: #fff;
      position: relative;
    }
    .cd-hero__topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .cd-hero__back, .cd-hero__action {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cd-hero__back .icon, .cd-hero__action .icon { width: 20px; height: 20px; color: #fff; }
    .cd-hero__info {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .cd-hero__avatar {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: rgba(255,255,255,0.2);
      border: 2px solid rgba(255,255,255,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .cd-hero__name {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cd-hero__name .status-dot { background: #6ee7b7; }
    .cd-hero__tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .cd-hero__tag {
      padding: 3px 10px;
      background: rgba(255,255,255,0.18);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
    }
    .cd-content {
      margin-top: -36px;
      position: relative;
      z-index: 2;
      padding: 0 16px;
    }
    .cd-stats {
      display: flex;
      background: var(--color-card);
      border-radius: 16px;
      padding: 16px 0;
      box-shadow: var(--shadow-lg);
      margin-bottom: 16px;
    }
    .cd-stat {
      flex: 1;
      text-align: center;
      position: relative;
    }
    .cd-stat:not(:last-child)::after {
      content: '';
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 1px;
      height: 32px;
      background: var(--color-divider);
    }
    .cd-stat__num {
      font-family: var(--font-num);
      font-size: 22px;
      font-weight: 700;
      color: var(--color-text-1);
      line-height: 1;
      margin-bottom: 4px;
    }
    .cd-stat__num--accent { color: var(--color-accent-deep); }
    .cd-stat__label {
      font-size: 12px;
      color: var(--color-text-2);
    }
    .cd-section {
      background: var(--color-card);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-card);
    }
    .cd-section__title {
      font-size: 16px;
      font-weight: 700;
      color: var(--color-text-1);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cd-section__title .icon { width: 18px; height: 18px; color: var(--color-primary); }
    .cd-desc {
      font-size: 14px;
      color: var(--color-text-2);
      line-height: 1.7;
    }
    .cd-cases {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .cd-case {
      display: flex;
      gap: 10px;
      padding: 12px;
      background: var(--color-bg-2);
      border-radius: 12px;
    }
    .cd-case__icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--color-primary-soft);
      color: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .cd-case__icon .icon { width: 18px; height: 18px; }
    .cd-case__text {
      font-size: 13px;
      color: var(--color-text-2);
      line-height: 1.6;
    }
    .cd-review {
      padding: 14px 0;
      border-bottom: 1px solid var(--color-divider);
    }
    .cd-review:last-child { border-bottom: none; }
    .cd-review__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .cd-review__user {
      font-size: 14px;
      font-weight: 600;
      color: var(--color-text-1);
    }
    .cd-review__date {
      font-size: 12px;
      color: var(--color-text-3);
      font-family: var(--font-num);
    }
    .cd-review__tags {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .cd-review__content {
      font-size: 13px;
      color: var(--color-text-2);
      line-height: 1.6;
    }
    .cd-calendar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin: 0 -4px;
      -webkit-overflow-scrolling: touch;
    }
    .cd-calendar::-webkit-scrollbar { display: none; }
    .cd-cal-day {
      flex-shrink: 0;
      width: 52px;
      padding: 10px 4px;
      border-radius: 12px;
      text-align: center;
      border: 1.5px solid var(--color-border);
      background: var(--color-card);
      transition: all var(--duration-fast) var(--ease-out);
    }
    .cd-cal-day--active {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: #fff;
    }
    .cd-cal-day--disabled {
      opacity: 0.4;
    }
    .cd-cal-day__week {
      font-size: 11px;
      color: var(--color-text-3);
      margin-bottom: 4px;
    }
    .cd-cal-day--active .cd-cal-day__week { color: rgba(255,255,255,0.8); }
    .cd-cal-day__date {
      font-family: var(--font-num);
      font-size: 18px;
      font-weight: 700;
      color: var(--color-text-1);
    }
    .cd-cal-day--active .cd-cal-day__date { color: #fff; }
    .cd-cal-slots {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .cd-cal-slot {
      padding: 8px 16px;
      border-radius: 999px;
      background: var(--color-bg-2);
      font-size: 13px;
      font-weight: 500;
      color: var(--color-text-1);
      border: 1.5px solid transparent;
      transition: all var(--duration-fast) var(--ease-out);
    }
    .cd-cal-slot--active {
      background: var(--color-primary-soft);
      color: var(--color-primary-deep);
      border-color: var(--color-primary);
    }
    .cd-cal-slot--disabled {
      opacity: 0.4;
      text-decoration: line-through;
    }
    .cd-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: var(--container-mobile);
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px calc(12px + var(--safe-bottom));
      background: var(--color-card);
      box-shadow: var(--shadow-float);
      z-index: var(--z-fixed);
    }
    .cd-footer__contact {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 11px;
      color: var(--color-text-2);
    }
    .cd-footer__contact .icon { width: 22px; height: 22px; color: var(--color-primary); }
    .cd-footer__btn { flex: 1; }
    .cd-trust {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: var(--color-success-soft);
      border-radius: 10px;
      margin-bottom: 12px;
    }
    .cd-trust .icon { width: 16px; height: 16px; color: var(--color-success); }
    .cd-trust__text { font-size: 12px; color: var(--color-success); }
  </style>
</head>
<body>

<div class="mobile-frame">
  <div class="cd-body">
    <div class="cd-hero">
      <div class="cd-hero__topbar">
        <div class="cd-hero__back" onclick="back()">
          <span id="backIcon"></span>
        </div>
        <div class="cd-hero__action" onclick="go('u-chat.html')">
          <span id="msgIcon"></span>
        </div>
      </div>
      <div class="cd-hero__info" id="heroInfo"></div>
    </div>

    <div class="cd-content">
      <div class="cd-stats anim-fade-up" id="statsBar"></div>

      <div class="cd-trust anim-fade-up">
        <span id="trustIcon"></span>
        <span class="cd-trust__text">该陪诊师已通过实名认证、健康体检及背景核查</span>
      </div>

      <div class="cd-section anim-fade-up delay-1">
        <div class="cd-section__title">
          <span id="infoIcon"></span>
          个人简介
        </div>
        <p class="cd-desc" id="descText"></p>
      </div>

      <div class="cd-section anim-fade-up delay-2">
        <div class="cd-section__title">
          <span id="caseIcon"></span>
          服务案例
        </div>
        <div class="cd-cases" id="caseList"></div>
      </div>

      <div class="cd-section anim-fade-up delay-3">
        <div class="cd-section__title">
          <span id="calIcon"></span>
          可预约时段
        </div>
        <div class="cd-calendar" id="calendar"></div>
        <div class="cd-cal-slots" id="slots"></div>
      </div>

      <div class="cd-section anim-fade-up delay-4">
        <div class="cd-section__title">
          <span id="reviewIcon"></span>
          真实评价
          <span style="font-size:12px;color:var(--color-text-3);font-weight:400;margin-left:auto" id="reviewCount"></span>
        </div>
        <div id="reviewList"></div>
      </div>
    </div>

    <div class="cd-footer">
      <div class="cd-footer__contact" onclick="go('u-chat.html')">
        <span id="chatIcon"></span>
        <span>咨询</span>
      </div>
      <button class="btn btn-primary btn-lg cd-footer__btn" onclick="go('u-booking.html')">立即预约</button>
    </div>
  </div>
</div>

<script>
  const companion = MockData.companions[0];

  document.getElementById('backIcon').innerHTML = IconLib.back;
  document.getElementById('msgIcon').innerHTML = IconLib.message;
  document.getElementById('trustIcon').innerHTML = IconLib.shield;
  document.getElementById('infoIcon').innerHTML = IconLib.profile;
  document.getElementById('caseIcon').innerHTML = IconLib.hospital;
  document.getElementById('calIcon').innerHTML = IconLib.calendar;
  document.getElementById('reviewIcon').innerHTML = IconLib.star;
  document.getElementById('chatIcon').innerHTML = IconLib.message;

  document.getElementById('heroInfo').innerHTML = `
    <div class="cd-hero__avatar">${companion.avatar}</div>
    <div>
      <div class="cd-hero__name">
        ${companion.name}
        <span class="status-dot status-dot--${companion.online ? 'online' : 'offline'}"></span>
        <span style="font-size:13px;opacity:0.8;font-weight:400">${companion.online ? '在线' : '离线'}</span>
      </div>
      <div class="cd-hero__tags">
        ${companion.tags.map(t => `<span class="cd-hero__tag">${t}</span>`).join('')}
      </div>
    </div>
  `;

  const stats = [
    { num: companion.rating, label: '综合评分', accent: true },
    { num: companion.orders, label: '服务单数' },
    { num: companion.exp, label: '从业经验' },
    { num: '99%', label: '好评率' },
  ];
  document.getElementById('statsBar').innerHTML = stats.map(s => `
    <div class="cd-stat">
      <div class="cd-stat__num ${s.accent ? 'cd-stat__num--accent' : ''}">${s.num}</div>
      <div class="cd-stat__label">${s.label}</div>
    </div>
  `).join('');

  document.getElementById('descText').textContent = companion.desc + '。持有急救资格证书,熟悉' + companion.hospital + '就诊流程,擅长老人陪诊与异地就医指引,服务耐心细致,深受用户好评。';

  const cases = [
    { icon: 'heart', text: '陪同76岁老人于协和医院心内科就诊,全程代办挂号缴费取药,家属远程查看进度' },
    { icon: 'route', text: '协助异地患者来京就医,提供火车站接送、住宿指引、就诊全流程陪护' },
    { icon: 'file', text: '代取CT检查报告并转交家属,详细说明报告注意事项与复诊建议' },
  ];
  document.getElementById('caseList').innerHTML = cases.map(c => `
    <div class="cd-case">
      <div class="cd-case__icon">${IconLib[c.icon]}</div>
      <div class="cd-case__text">${c.text}</div>
    </div>
  `).join('');

  const days = [
    { week: '今日', date: '4', active: true },
    { week: '明日', date: '5' },
    { week: '周日', date: '6' },
    { week: '周一', date: '7' },
    { week: '周二', date: '8', disabled: true },
    { week: '周三', date: '9' },
    { week: '周四', date: '10' },
  ];
  document.getElementById('calendar').innerHTML = days.map(d => `
    <div class="cd-cal-day ${d.active ? 'cd-cal-day--active' : ''} ${d.disabled ? 'cd-cal-day--disabled' : ''}" onclick="selectDay(this)">
      <div class="cd-cal-day__week">${d.week}</div>
      <div class="cd-cal-day__date">${d.date}</div>
    </div>
  `).join('');

  const slots = [
    { time: '08:00-09:00', disabled: true },
    { time: '09:00-10:00', active: true },
    { time: '10:00-11:00' },
    { time: '14:00-15:00' },
    { time: '15:00-16:00', disabled: true },
  ];
  document.getElementById('slots').innerHTML = slots.map(s => `
    <span class="cd-cal-slot ${s.active ? 'cd-cal-slot--active' : ''} ${s.disabled ? 'cd-cal-slot--disabled' : ''}" onclick="selectSlot(this)">${s.time}</span>
  `).join('');

  document.getElementById('reviewCount').textContent = `(${MockData.reviews.length}条)`;
  document.getElementById('reviewList').innerHTML = MockData.reviews.map(r => `
    <div class="cd-review">
      <div class="cd-review__head">
        <span class="cd-review__user">${r.user}</span>
        <span class="cd-review__date">${r.date}</span>
      </div>
      <div style="margin-bottom:8px">${starsHTML(r.rating)}</div>
      <div class="cd-review__tags">
        ${r.tags.map(t => `<span class="badge badge-primary">${t}</span>`).join('')}
      </div>
      <div class="cd-review__content">${r.content}</div>
    </div>
  `).join('');

  function selectDay(el) {
    if (el.classList.contains('cd-cal-day--disabled')) return;
    document.querySelectorAll('.cd-cal-day').forEach(d => d.classList.remove('cd-cal-day--active'));
    el.classList.add('cd-cal-day--active');
  }
  function selectSlot(el) {
    if (el.classList.contains('cd-cal-slot--disabled')) return;
    document.querySelectorAll('.cd-cal-slot').forEach(s => s.classList.remove('cd-cal-slot--active'));
    el.classList.add('cd-cal-slot--active');
  }
</script>

</body>
</html>
