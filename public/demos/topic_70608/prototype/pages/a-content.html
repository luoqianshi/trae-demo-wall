<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>暖伴后台 · 内容资讯管理</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <script src="../js/icons.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <style>
    .admin-title{display:flex;align-items:center;gap:14px;margin-bottom:22px}.admin-title__icon{width:48px;height:48px;border-radius:16px;background:var(--color-primary-soft);color:var(--color-primary);display:flex;align-items:center;justify-content:center}.admin-title h1{font-size:28px;margin:0}.admin-title p{margin:4px 0 0;color:var(--color-text-2)}.admin-panel{background:var(--color-card);border:1px solid var(--color-border);border-radius:20px;padding:22px;box-shadow:var(--shadow-card);margin-bottom:18px}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.panel-title{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.mini-card{background:var(--color-bg);border-radius:16px;padding:18px;border:1px solid var(--color-border)}.mini-card h3{margin-bottom:8px}.admin-table{width:100%;border-collapse:collapse}.admin-table th,.admin-table td{padding:13px 12px;border-bottom:1px solid var(--color-divider);text-align:left;font-size:14px}.admin-table th{color:var(--color-text-2);background:var(--color-bg-2);font-weight:700}.bar{height:10px;background:var(--color-bg-2);border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:var(--color-primary);border-radius:999px}.chart-bars{display:flex;align-items:flex-end;gap:10px;height:180px;padding:16px;background:var(--color-bg);border-radius:16px}.chart-bars i{flex:1;background:linear-gradient(180deg,var(--color-accent),var(--color-primary));border-radius:8px 8px 0 0;min-height:24px}@media(max-width:900px){.admin-sidebar{position:static;width:100%;height:auto}.admin-main{margin-left:0}.grid-3,.grid-2{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <aside class="admin-sidebar"><div class="admin-sidebar__logo"><div style="width:36px;height:36px;border-radius:12px;background:var(--color-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800">暖</div><div><b>暖伴后台</b><div class="text-3" style="font-size:12px">运营管理中心</div></div></div><nav class="admin-sidebar__nav" id="side"></nav></aside>
  <main class="admin-main"><div class="admin-topbar"><div class="admin-title"><div class="admin-title__icon" id="titleIcon"></div><div><h1>内容资讯管理</h1><p>管理健康科普、首页Banner、服务前提醒与用户触达</p></div></div><button class="btn btn-primary btn-sm">新建/导入</button></div><section class="admin-panel"><div class="panel-head"><div class="panel-title"><svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> 健康科普CMS</div><span class="badge badge-accent">待发布 8 篇</span></div><div class="grid-3"><div class="mini-card"><h3>老年血压管理</h3><p>面向长辈模式首页推荐，阅读完成率 68%。</p></div><div class="mini-card"><h3>异地就医备案</h3><p>关联异地就医服务页，降低客服咨询量。</p></div><div class="mini-card"><h3>体检前注意事项</h3><p>用于体检陪诊预约前提醒与短信推送。</p></div></div></section><section class="admin-panel"><div class="panel-head"><div class="panel-title"><svg class="icon" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg> Banner 与推送</div></div><table class="admin-table"><thead><tr><th>位置</th><th>主题</th><th>状态</th><th>转化率</th></tr></thead><tbody><tr><td>用户端首页</td><td>新人首单立减50</td><td><span class="badge badge-success">上线中</span></td><td class="num">12.8%</td></tr><tr><td>会员中心</td><td>亲情卡3次套餐</td><td><span class="badge badge-warning">待审核</span></td><td class="num">8.4%</td></tr></tbody></table></section></main>
<script>
const nav=[['a-dashboard.html','数据看板','chart'],['a-orders.html','订单管理','order'],['a-companions.html','陪诊师管理','doctor'],['a-users.html','用户管理','users'],['a-hospitals.html','医院科室库','hospital'],['a-pricing.html','定价管理','coupon'],['a-marketing.html','营销管理','gift'],['a-finance.html','财务结算','wallet'],['a-complaints.html','客诉管理','message'],['a-content.html','内容资讯','file'],['a-analytics.html','数据分析','trending'],['a-settings.html','系统设置','settings']];
const current=location.pathname.split('/').pop();document.getElementById('side').innerHTML=nav.map(n=>`<a class="admin-sidebar__item ${current===n[0]?'admin-sidebar__item--active':''}" href="${n[0]}">${IconLib[n[2]]}<span>${n[1]}</span></a>`).join('');document.getElementById('titleIcon').innerHTML=IconLib['file'];
</script>
</body>
</html>
