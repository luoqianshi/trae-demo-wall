<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>暖伴陪诊师 · 订单详情</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <script src="../js/icons.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <style>
    .od-body { padding: 0 16px 100px; }
    .od-hero {
      background: var(--gradient-warm);
      padding: 16px 20px;
      color: #fff;
      position: relative;
      overflow: hidden;
    }
    .od-hero::before {
      content: '';
      position: absolute;
      right: -40px; top: -20px;
      width: 120px; height: 120px;
      border-radius: 50%;
      background: rgba(242, 153, 74, 0.18);
      filter: blur(20px);
    }
    .od-hero__tag { display: inline-block; padding: 3px 12px; background: rgba(255,255,255,0.2); border-radius: 999px; font-size: 12px; font-weight: 600; margin-bottom: 8px; position: relative; z-index: 2; }
    .od-hero__svc { font-size: 20px; font-weight: 700; margin-bottom: 6px; position: relative; z-index: 2; }
    .od-hero__no { font-size: 12px; opacity: 0.85; font-family: var(--font-num); position: relative; z-index: 2; }

    .od-card {
      background: var(--color-card);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow-card);
      margin-bottom: 12px;
    }
    .od-card__head {
      display: flex; align-items: center; gap: 6px;
      font-size: 15px; font-weight: 700; color: var(--color-text-1);
      margin-bottom: 14px;
    }
    .od-card__head .icon { color: var(--color-primary); }
    .od-info-row {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 10px 0; border-bottom: 1px solid var(--color-divider);
    }
    .od-info-row:last-child { border-bottom: none; }
    .od-info-row__icon {
      width: 32px; height: 32px; border-radius: 10px;
      background: var(--color-primary-soft); color: var(--color-primary);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .od-info-row__icon .icon { width: 18px; height: 18px; }
    .od-info-row__icon--accent { background: var(--color-accent-soft); color: var(--color-accent-deep); }
    .od-info-row__label { font-size: 12px; color: var(--color-text-3); margin-bottom: 2px; }
    .od-info-row__value { font-size: 14px; color: var(--color-text-1); font-weight: 500; }
    .od-info-row__action { color: var(--color-primary); font-size: 12px; font-weight: 600; margin-top: 4px; display: inline-flex; align-items: center; gap: 2px; }
    .od-info-row__action .icon { width: 12px; height: 12px; }

    .od-patient {
      display: flex; align-items: center; gap: 12px;
      padding: 12px; background: var(--color-bg-2);
      border-radius: 12px; margin-bottom: 12px;
    }
    .od-patient__avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--color-primary); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 600; flex-shrink: 0;
    }
    .od-patient__name { font-size: 15px; font-weight: 600; color: var(--color-text-1); margin-bottom: 2px; }
    .od-patient__info { font-size: 12px; color: var(--color-text-3); }
    .od-mask {
      display: inline-block; padding: 1px 8px;
      background: var(--color-info-soft); color: var(--color-info);
      border-radius: 6px; font-size: 10px; font-weight: 600;
      margin-left: 6px;
    }

    .od-fee-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 0; font-size: 13px;
    }
    .od-fee-row__label { color: var(--color-text-2); }
    .od-fee-row__value { color: var(--color-text-1); font-family: var(--font-num); font-weight: 600; }
    .od-fee-total {
      display: flex; align-items: center; justify-content: space-between;
      padding-top: 12px; margin-top: 8px;
      border-top: 1px dashed var(--color-border-strong);
    }
    .od-fee-total__label { font-size: 14px; color: var(--color-text-1); font-weight: 600; }
    .od-fee-total__value {
      font-family: var(--font-num); font-weight: 800;
      color: var(--color-accent-deep); font-size: 22px;
    }
    .od-fee-total__value .sym { font-size: 13px; }

    .od-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      max-width: var(--container-mobile); margin: 0 auto;
      background: var(--color-card);
      padding: 12px 16px calc(12px + var(--safe-bottom));
      box-shadow: var(--shadow-float);
      display: flex; gap: 12px; align-items: center;
      z-index: var(--z-fixed);
    }
    .od-bar__contact {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      color: var(--color-text-2); font-size: 11px;
    }
    .od-bar__contact .icon { width: 22px; height: 22px; color: var(--color-primary); }
    .od-req {
      background: var(--color-accent-soft);
      border-radius: 12px; padding: 12px;
      font-size: 13px; color: var(--color-text-2); line-height: 1.6;
    }
    .od-req strong { color: var(--color-accent-deep); }
  </style>
</head>
<body>

<div class="mobile-frame">
  <div id="header"></div>

  <div class="od-hero">
    <span class="od-hero__tag">待接单</span>
    <div class="od-hero__svc">半日陪诊 · 协和医院</div>
    <div class="od-hero__no">订单号 NB20260704001</div>
  </div>

  <div class="od-body">
    <!-- 就诊人档案 -->
    <div class="od-card anim-fade-up">
      <div class="od-card__head" id="patientHead"></div>
      <div class="od-patient">
        <div class="od-patient__avatar">王</div>
        <div style="flex:1">
          <div class="od-patient__name">王*芳<span class="od-mask">已脱敏</span></div>
          <div class="od-patient__info">女 · 65岁 · 高血压病史(已授权查看)</div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="showToast('查看健康档案')">档案</button>
      </div>
    </div>

    <!-- 医院地址 -->
    <div class="od-card anim-fade-up">
      <div class="od-card__head" id="hospHead"></div>
      <div class="od-info-row">
        <div class="od-info-row__icon"><svg class="icon" viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l7-4 7 4v14"/><path d="M12 8v6M9 11h6"/></svg></div>
        <div style="flex:1">
          <div class="od-info-row__label">就诊医院</div>
          <div class="od-info-row__value">北京协和医院 · 心内科</div>
        </div>
      </div>
      <div class="od-info-row">
        <div class="od-info-row__icon"><svg class="icon" viewBox="0 0 24 24"><path d="M12 22s-8-7-8-13a8 8 0 0 1 16 0c0 6-8 13-8 13z"/><circle cx="12" cy="9" r="3"/></svg></div>
        <div style="flex:1">
          <div class="od-info-row__label">医院地址</div>
          <div class="od-info-row__value">东城区帅府园1号</div>
          <span class="od-info-row__action" onclick="showToast('已调用地图导航')"><svg class="icon" viewBox="0 0 24 24"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></svg> 导航前往</span>
        </div>
      </div>
      <div class="od-info-row">
        <div class="od-info-row__icon od-info-row__icon--accent"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
        <div style="flex:1">
          <div class="od-info-row__label">就诊时间</div>
          <div class="od-info-row__value">2026-07-04 09:00(提前30分钟到达)</div>
        </div>
      </div>
    </div>

    <!-- 服务需求 -->
    <div class="od-card anim-fade-up">
      <div class="od-card__head" id="reqHead"></div>
      <div class="od-req">
        需协助<strong>挂号、候诊、就诊、取药</strong>;老人行动不便需轮椅;子女在外地,服务进度请实时同步;医嘱请详细记录转述。
      </div>
    </div>

    <!-- 费用明细 -->
    <div class="od-card anim-fade-up">
      <div class="od-card__head" id="feeHead"></div>
      <div class="od-fee-row"><span class="od-fee-row__label">陪诊服务费</span><span class="od-fee-row__value">¥299.00</span></div>
      <div class="od-fee-row"><span class="od-fee-row__label">平台补贴</span><span class="od-fee-row__value" style="color:var(--color-success)">-¥20.00</span></div>
      <div class="od-fee-row"><span class="od-fee-row__label">订单总额</span><span class="od-fee-row__value">¥279.00</span></div>
      <div class="od-fee-total">
        <span class="od-fee-total__label">您的收益(80%分账)</span>
        <span class="od-fee-total__value"><span class="sym">¥</span>223.20</span>
      </div>
    </div>
  </div>

  <div class="od-bar">
    <div class="od-bar__contact" onclick="showToast('已发起电话呼叫')"><svg class="icon" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg><span>电话</span></div>
    <div class="od-bar__contact" onclick="go('c-messages.html')"><svg class="icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>消息</span></div>
    <button class="btn btn-accent btn-block btn-lg" style="flex:1" onclick="confirmAccept()"><svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> 确认接单</button>
  </div>
</div>

<script>
  document.getElementById('header').innerHTML = renderHeader('订单详情');
  document.getElementById('patientHead').innerHTML = `${IconLib.profile} 就诊人档案`;
  document.getElementById('hospHead').innerHTML = `${IconLib.hospital} 医院与时间`;
  document.getElementById('reqHead').innerHTML = `${IconLib.edit} 服务需求`;
  document.getElementById('feeHead').innerHTML = `${IconLib.wallet} 费用明细`;

  function confirmAccept() {
    if (confirm('确认接单?接单后请按时到达指定地点')) {
      showToast('接单成功!请提前到达');
      setTimeout(() => go('c-service.html'), 1200);
    }
  }
</script>

</body>
</html>
