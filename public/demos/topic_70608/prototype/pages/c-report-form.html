<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>暖伴陪诊师 · 服务报告</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <script src="../js/icons.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <style>
    .rf-body { padding: 0 16px 120px; }
    .rf-notice {
      background: var(--color-warning-soft);
      border-radius: 12px;
      padding: 12px;
      display: flex; gap: 8px; align-items: flex-start;
      margin: 12px 0 16px;
      border-left: 3px solid var(--color-warning);
    }
    .rf-notice .icon { color: #B8860B; width: 18px; height: 18px; flex-shrink: 0; margin-top: 2px; }
    .rf-notice__text { font-size: 12px; color: #8B6914; line-height: 1.5; }
    .rf-notice__text strong { color: #B8860B; }

    .rf-card {
      background: var(--color-card);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow-card);
      margin-bottom: 12px;
    }
    .rf-card__title {
      font-size: 15px; font-weight: 700;
      display: flex; align-items: center; gap: 6px;
      margin-bottom: 14px;
    }
    .rf-card__title .icon { color: var(--color-primary); }
    .rf-field { margin-bottom: 14px; }
    .rf-field:last-child { margin-bottom: 0; }
    .rf-field__label {
      display: block; font-size: 13px; font-weight: 600;
      color: var(--color-text-1); margin-bottom: 8px;
    }
    .rf-field__label .req { color: var(--color-alert); }
    .rf-field__hint { font-size: 11px; color: var(--color-text-3); margin-top: 4px; }

    .rf-input {
      width: 100%; padding: 12px 14px;
      background: var(--color-bg-2); border: 1.5px solid transparent;
      border-radius: 12px; font-size: 14px; color: var(--color-text-1);
      transition: all var(--duration-fast) var(--ease-out);
    }
    .rf-input:focus { background: var(--color-card); border-color: var(--color-primary); }
    textarea.rf-input { min-height: 90px; resize: none; line-height: 1.6; }

    .rf-template-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; background: var(--color-bg-2);
      border-radius: 10px; margin-bottom: 8px;
    }
    .rf-template-row__label { font-size: 13px; color: var(--color-text-2); }
    .rf-template-row__value {
      font-size: 13px; color: var(--color-text-1); font-weight: 500;
      display: flex; align-items: center; gap: 4px;
    }
    .rf-template-row__value .icon { width: 14px; height: 14px; color: var(--color-text-3); }

    .rf-upload-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .rf-upload {
      aspect-ratio: 1;
      border-radius: 12px;
      border: 1.5px dashed var(--color-border-strong);
      background: var(--color-bg-2);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px;
      color: var(--color-text-3);
    }
    .rf-upload .icon { width: 24px; height: 24px; }
    .rf-upload__text { font-size: 11px; }
    .rf-upload--done {
      background: var(--color-primary-soft); border-style: solid;
      border-color: var(--color-primary); color: var(--color-primary);
      position: relative;
    }
    .rf-upload--done .rf-upload__check {
      position: absolute; top: 4px; right: 4px;
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--color-primary); color: #fff;
      display: flex; align-items: center; justify-content: center;
    }
    .rf-upload--done .rf-upload__check .icon { width: 12px; height: 12px; }

    .rf-check-row {
      display: flex; align-items: center; gap: 10px;
      padding: 12px; background: var(--color-bg-2);
      border-radius: 10px; margin-bottom: 8px;
    }
    .rf-check-box {
      width: 22px; height: 22px; border-radius: 6px;
      border: 2px solid var(--color-border-strong);
      flex-shrink: 0; position: relative;
      transition: all var(--duration-fast) var(--ease-out);
    }
    .rf-check-row--checked .rf-check-box {
      background: var(--color-primary); border-color: var(--color-primary);
    }
    .rf-check-row--checked .rf-check-box::after {
      content: ''; position: absolute;
      left: 6px; top: 2px;
      width: 5px; height: 10px;
      border: solid #fff; border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    .rf-check-text { flex: 1; font-size: 13px; color: var(--color-text-1); }
    .rf-check-text .num { color: var(--color-accent-deep); font-weight: 700; }

    .rf-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      max-width: var(--container-mobile); margin: 0 auto;
      background: var(--color-card);
      padding: 12px 16px calc(12px + var(--safe-bottom));
      box-shadow: var(--shadow-float);
      z-index: var(--z-fixed);
    }
  </style>
</head>
<body>

<div class="mobile-frame">
  <div id="header"></div>

  <div class="rf-body">
    <!-- 提示 -->
    <div class="rf-notice anim-fade-up">
      <svg class="icon" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <div class="rf-notice__text"><strong>重要提示:</strong>本报告中医嘱部分为<strong>转述医生交代内容,非陪诊师医疗建议</strong>,具体诊疗请以医生意见为准。请如实填写,便于家属了解就诊情况。</div>
    </div>

    <!-- 就诊小结 -->
    <div class="rf-card anim-fade-up">
      <div class="rf-card__title" id="sumTitle"></div>
      <div class="rf-template-row" onclick="showToast('选择科室')">
        <span class="rf-template-row__label">就诊科室</span>
        <span class="rf-template-row__value">心内科 <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span>
      </div>
      <div class="rf-template-row" onclick="showToast('选择诊断')">
        <span class="rf-template-row__label">诊断结果</span>
        <span class="rf-template-row__value">高血压(II级) <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span>
      </div>
      <div class="rf-field">
        <label class="rf-field__label">就诊情况小结 <span class="req">*</span></label>
        <textarea class="rf-input" placeholder="请简要描述就诊过程、医生检查项目、注意事项等">患者主诉头晕乏力,医生测量血压150/95mmHg,调整降压药剂量,建议低盐饮食,2周后复查。本次完成血压测量、心电图检查。</textarea>
      </div>
    </div>

    <!-- 医嘱录入 -->
    <div class="rf-card anim-fade-up">
      <div class="rf-card__title" id="advTitle"></div>
      <div class="rf-field">
        <label class="rf-field__label">医嘱转述记录 <span class="req">*</span></label>
        <textarea class="rf-input" placeholder="请转述医生交代的医嘱内容(注明:此为医生原话转述)">1. 苯磺酸氨氯地平片由5mg调整为10mg,每日晨服;2. 控制食盐摄入每日不超过5g;3. 每日监测血压并记录;4. 2周后心内科门诊复查。</textarea>
        <div class="rf-field__hint">以上为医生交代内容转述,非陪诊师医疗建议</div>
      </div>
    </div>

    <!-- 报告拍照 -->
    <div class="rf-card anim-fade-up">
      <div class="rf-card__title" id="upTitle"></div>
      <div class="rf-upload-grid" id="upGrid"></div>
    </div>

    <!-- 用药提醒勾选 -->
    <div class="rf-card anim-fade-up">
      <div class="rf-card__title" id="medTitle"></div>
      <div id="medCheckList"></div>
    </div>
  </div>

  <div class="rf-bar">
    <button class="btn btn-primary btn-block btn-lg" onclick="submitReport()"><svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> 提交服务报告</button>
  </div>
</div>

<script>
  document.getElementById('header').innerHTML = renderHeader('服务报告填写');
  document.getElementById('sumTitle').innerHTML = `${IconLib.file} 就诊小结`;
  document.getElementById('advTitle').innerHTML = `${IconLib.doctor} 医嘱录入`;
  document.getElementById('upTitle').innerHTML = `${IconLib.camera} 报告拍照上传`;
  document.getElementById('medTitle').innerHTML = `${IconLib.pill} 用药提醒设置`;

  // 上传grid
  const uploads = [
    { done: true }, { done: true }, { done: false },
    { done: false }, { done: false }, { done: false },
  ];
  document.getElementById('upGrid').innerHTML = uploads.map((u, i) => u.done ? `
    <div class="rf-upload rf-upload--done" onclick="showToast('查看照片')">
      <span class="rf-upload__check">${IconLib.check}</span>
      ${IconLib.image}
      <span class="rf-upload__text">已上传</span>
    </div>
  ` : `
    <div class="rf-upload" onclick="showToast('请拍摄报告')">
      ${IconLib.camera}
      <span class="rf-upload__text">点击上传</span>
    </div>
  `).join('');

  // 用药提醒
  const meds = [
    { name: '苯磺酸氨氯地平片', dose: '10mg', freq: '每日1次', checked: true },
    { name: '阿托伐他汀钙片', dose: '20mg', freq: '每日1次', checked: true },
    { name: '监测血压记录', dose: '每日2次', freq: '早晚各1次', checked: false },
  ];
  document.getElementById('medCheckList').innerHTML = meds.map((m, i) => `
    <div class="rf-check-row ${m.checked?'rf-check-row--checked':''}" onclick="toggleMedCheck(this)">
      <div class="rf-check-box"></div>
      <div class="rf-check-text">${m.name} · <span class="num">${m.dose}</span> · ${m.freq}</div>
    </div>
  `).join('');

  function toggleMedCheck(el) {
    el.classList.toggle('rf-check-row--checked');
    showToast(`用药提醒${el.classList.contains('rf-check-row--checked')?'已开启':'已关闭'}`);
  }

  function submitReport() {
    if (confirm('确认提交服务报告?提交后家属将收到通知')) {
      showToast('报告已提交,服务完成');
      setTimeout(() => go('c-workbench.html'), 1500);
    }
  }
</script>

</body>
</html>
