<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>暖伴 · 首页</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <script src="../js/icons.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <style>
    .home-hero {
      background: var(--gradient-warm);
      padding: calc(var(--safe-top) + 16px) 20px 60px;
      color: #fff;
      position: relative;
      overflow: hidden;
    }
    .home-hero::before {
      content: '';
      position: absolute;
      right: -80px;
      top: -40px;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: rgba(242, 153, 74, 0.18);
      filter: blur(30px);
    }
    .home-hero::after {
      content: '';
      position: absolute;
      left: -60px;
      bottom: -20px;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      filter: blur(20px);
    }
    .home-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 2;
      margin-bottom: 20px;
    }
    .home-location {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 15px;
      font-weight: 600;
    }
    .home-location .icon { width: 18px; height: 18px; }
    .home-topbar__right {
      display: flex;
      gap: 8px;
    }
    .home-topbar__btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .home-topbar__btn .icon { width: 18px; height: 18px; }
    .home-topbar__dot {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 8px;
      height: 8px;
      background: var(--color-accent);
      border-radius: 50%;
      border: 2px solid var(--color-primary);
    }
    .home-greeting {
      position: relative;
      z-index: 2;
      margin-bottom: 20px;
    }
    .home-greeting__title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .home-greeting__sub {
      font-size: 14px;
      opacity: 0.88;
    }
    .home-search {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(12px);
      border-radius: 999px;
      padding: 10px 16px;
      margin-bottom: 4px;
    }
    .home-search .icon { width: 18px; height: 18px; opacity: 0.8; }
    .home-search input {
      flex: 1;
      background: none;
      border: none;
      color: #fff;
      font-size: 14px;
    }
    .home-search input::placeholder { color: rgba(255,255,255,0.7); }

    .home-body {
      margin-top: -36px;
      position: relative;
      z-index: 3;
      padding: 0 16px 100px;
    }
    .home-services {
      background: var(--color-card);
      border-radius: 20px;
      padding: 20px 16px 12px;
      box-shadow: var(--shadow-lg);
      margin-bottom: 16px;
    }
    .home-banner {
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 16px;
      background: var(--gradient-sunrise);
      padding: 20px;
      color: #fff;
      position: relative;
      overflow: hidden;
    }
    .home-banner::after {
      content: '';
      position: absolute;
      right: -30px;
      bottom: -30px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
    }
    .home-banner__tag {
      display: inline-block;
      padding: 3px 10px;
      background: rgba(255,255,255,0.25);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .home-banner__title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .home-banner__desc { font-size: 13px; opacity: 0.9; }
    .home-banner__btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 12px;
      padding: 6px 14px;
      background: #fff;
      color: var(--color-accent-deep);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
    }

    .home-companions {
      margin-bottom: 16px;
    }
    .home-companion-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 0 16px;
      margin: 0 -16px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .home-companion-scroll::-webkit-scrollbar { display: none; }
    .home-companion-card {
      flex-shrink: 0;
      width: 200px;
      background: var(--color-card);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow-card);
      scroll-snap-align: start;
    }
    .home-companion-card__avatar {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--color-primary-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      color: var(--color-primary);
      margin-bottom: 10px;
    }
    .home-companion-card__name {
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }
    .home-companion-card__desc {
      font-size: 12px;
      color: var(--color-text-3);
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .home-companion-card__footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .home-trust {
      display: flex;
      align-items: center;
      justify-content: space-around;
      background: var(--color-primary-soft);
      border-radius: 16px;
      padding: 16px 12px;
      margin-bottom: 16px;
    }
    .home-trust__item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-align: center;
    }
    .home-trust__icon {
      width: 32px;
      height: 32px;
      color: var(--color-primary);
    }
    .home-trust__label {
      font-size: 12px;
      color: var(--color-primary-deep);
      font-weight: 600;
    }
    .home-trust__num {
      font-family: var(--font-num);
      font-size: 16px;
      font-weight: 700;
      color: var(--color-primary-deep);
    }

    .home-news {
      margin-bottom: 16px;
    }
    .home-news__item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--color-divider);
    }
    .home-news__item:last-child { border-bottom: none; }
    .home-news__tag {
      flex-shrink: 0;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }
    .home-news__title {
      flex: 1;
      font-size: 14px;
      color: var(--color-text-1);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .elder-toggle {
      position: fixed;
      right: 16px;
      bottom: 80px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--color-accent);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-warm);
      z-index: var(--z-fixed);
      font-size: 10px;
      gap: 1px;
    }
    .elder-toggle .icon { width: 20px; height: 20px; }
  </style>
</head>
<body>

<div class="mobile-frame">

  <!-- Hero 区 -->
  <div class="home-hero">
    <div class="home-topbar">
      <div class="home-location">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 22s-8-7-8-13a8 8 0 0 1 16 0c0 6-8 13-8 13z"/><circle cx="12" cy="9" r="3"/></svg>
        <span>北京</span>
        <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div class="home-topbar__right">
        <div class="home-topbar__btn" onclick="go('u-chat.html')">
          <svg class="icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span class="home-topbar__dot"></span>
        </div>
        <div class="home-topbar__btn" onclick="go('u-help.html')">
          <svg class="icon" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </div>
      </div>
    </div>
    <div class="home-greeting anim-fade-up">
      <div class="home-greeting__title">就医路上,温暖相伴</div>
      <div class="home-greeting__sub">专业陪诊师,让看病不再难</div>
    </div>
    <div class="home-search anim-fade-up delay-1" onclick="go('u-hospital.html')">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input placeholder="搜索医院、科室或陪诊师" readonly>
    </div>
  </div>

  <!-- 主体 -->
  <div class="home-body">

    <!-- 服务宫格 -->
    <div class="home-services anim-fade-up delay-2">
      <div class="grid-nav" id="serviceGrid"></div>
    </div>

    <!-- 信任背书 -->
    <div class="home-trust anim-fade-up delay-2">
      <div class="home-trust__item">
        <div class="home-trust__icon"><svg class="icon" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
        <div class="home-trust__num">100%</div>
        <div class="home-trust__label">资质认证</div>
      </div>
      <div class="home-trust__item">
        <div class="home-trust__icon"><svg class="icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
        <div class="home-trust__num">5000+</div>
        <div class="home-trust__label">专业陪诊师</div>
      </div>
      <div class="home-trust__item">
        <div class="home-trust__icon"><svg class="icon" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div>
        <div class="home-trust__num">98.6%</div>
        <div class="home-trust__label">用户好评</div>
      </div>
      <div class="home-trust__item">
        <div class="home-trust__icon"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="9 12 12 15 16 10"/></svg></div>
        <div class="home-trust__num">保险</div>
        <div class="home-trust__label">全程保障</div>
      </div>
    </div>

    <!-- 营销 Banner -->
    <div class="home-banner anim-fade-up delay-3" onclick="go('u-promotions.html')">
      <span class="home-banner__tag">新人专享</span>
      <div class="home-banner__title">首单立减50元</div>
      <div class="home-banner__desc">注册即享,专业陪诊首单优惠</div>
      <span class="home-banner__btn">立即领取 <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span>
    </div>

    <!-- 推荐陪诊师 -->
    <div class="section home-companions">
      <div class="section__header">
        <span class="section__title">金牌陪诊师推荐</span>
        <a class="section__more" href="u-companions.html">查看全部 <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></a>
      </div>
      <div class="home-companion-scroll" id="companionScroll"></div>
    </div>

    <!-- 健康资讯 -->
    <div class="section home-news">
      <div class="section__header">
        <span class="section__title">健康资讯</span>
        <a class="section__more" href="#">更多 <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></a>
      </div>
      <div style="background:var(--color-card);border-radius:16px;padding:0 16px;box-shadow:var(--shadow-card)">
        <div class="home-news__item">
          <span class="home-news__tag" style="background:var(--color-primary-soft);color:var(--color-primary-deep)">科普</span>
          <span class="home-news__title">老年人血压管理指南:日常监测与饮食建议</span>
        </div>
        <div class="home-news__item">
          <span class="home-news__tag" style="background:var(--color-accent-soft);color:var(--color-accent-deep)">提醒</span>
          <span class="home-news__title">异地就医医保备案流程详解,少走弯路</span>
        </div>
        <div class="home-news__item">
          <span class="home-news__tag" style="background:var(--color-info-soft);color:var(--color-info)">政策</span>
          <span class="home-news__title">上海发布规范化陪诊服务方案,60岁以上可享补贴</span>
        </div>
      </div>
    </div>

  </div>

  <!-- 适老模式切换 -->
  <button class="elder-toggle" onclick="toggleElderMode()">
    <svg class="icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    <span>长辈</span>
  </button>

  <!-- Tab 栏 -->
  <div id="tabbar"></div>

</div>

<script>
// 服务宫格
document.getElementById('serviceGrid').innerHTML = MockData.services.map(s => `
  <div class="grid-nav__item" onclick="go('u-service.html?type=${s.id}')">
    <div class="grid-nav__icon" style="background:${s.color}15;color:${s.color}">
      ${IconLib[s.icon] || IconLib.heart}
    </div>
    <span class="grid-nav__label">${s.name}</span>
  </div>
`).join('');

// 推荐陪诊师横滑
document.getElementById('companionScroll').innerHTML = MockData.companions.slice(0, 4).map(c => `
  <div class="home-companion-card" onclick="go('u-companion-detail.html?id=${c.id}')">
    <div class="home-companion-card__avatar">${c.avatar}</div>
    <div class="home-companion-card__name">
      ${c.name}
      <span class="status-dot status-dot--${c.online ? 'online' : 'offline'}"></span>
    </div>
    <div class="home-companion-card__desc">${c.hospital} · ${c.exp}经验</div>
    <div style="margin-bottom:8px">${starsHTML(c.rating)}</div>
    <div class="home-companion-card__footer">
      <span class="price"><span class="price__symbol">¥</span><span class="price__integer" style="font-size:18px">${c.price}</span></span>
      <button class="btn btn-primary btn-sm" onclick="event.stopPropagation();go('u-booking.html?companion_id=${c.id}')">预约</button>
    </div>
  </div>
`).join('');

// Tab 栏
document.getElementById('tabbar').innerHTML = renderTabbar('home');
</script>

</body>
</html>
