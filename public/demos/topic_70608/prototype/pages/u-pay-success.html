<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>暖伴 · 支付成功</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <script src="../js/icons.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <style>
    .ps-body { padding: 0 16px 40px; }
    .ps-hero {
      text-align: center;
      padding: 48px 20px 32px;
      background: var(--gradient-trust);
      border-radius: 0 0 24px 24px;
    }
    .ps-check {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--color-success);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      color: #fff;
      position: relative;
      animation: checkPop 0.6s var(--ease-spring) both;
    }
    @keyframes checkPop {
      0% { transform: scale(0); opacity: 0; }
      60% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }
    .ps-check::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid var(--color-success);
      opacity: 0.3;
      animation: ringExpand 1.5s var(--ease-out) 0.3s infinite;
    }
    @keyframes ringExpand {
      0% { transform: scale(1); opacity: 0.3; }
      100% { transform: scale(1.3); opacity: 0; }
    }
    .ps-check .icon { width: 40px; height: 40px; stroke-width: 3; }
    .ps-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--color-text-1);
      margin-bottom: 8px;
      animation: fadeInUp 0.5s var(--ease-out) 0.3s both;
    }
    .ps-amount {
      font-family: var(--font-num);
      font-size: 32px;
      font-weight: 800;
      color: var(--color-accent-deep);
      animation: fadeInUp 0.5s var(--ease-out) 0.4s both;
    }
    .ps-amount .price__symbol { font-size: 16px; }
    .ps-order {
      background: var(--color-card);
      border-radius: 16px;
      padding: 16px;
      margin-top: 20px;
      box-shadow: var(--shadow-card);
      animation: fadeInUp 0.5s var(--ease-out) 0.5s both;
    }
    .ps-order__row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      font-size: 14px;
    }
    .ps-order__label { color: var(--color-text-2); }
    .ps-order__value { color: var(--color-text-1); font-weight: 500; }
    .ps-order__value--mono { font-family: var(--font-num); }
    .ps-comp {
      background: var(--color-card);
      border-radius: 16px;
      padding: 16px;
      margin-top: 12px;
      box-shadow: var(--shadow-card);
      animation: fadeInUp 0.5s var(--ease-out) 0.6s both;
    }
    .ps-comp__head {
      font-size: 14px;
      font-weight: 600;
      color: var(--color-text-2);
      margin-bottom: 14px;
    }
    .ps-comp__body {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .ps-comp__avatar {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: var(--color-primary-soft);
      color: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .ps-comp__name { font-size: 16px; font-weight: 700; color: var(--color-text-1); margin-bottom: 4px; }
    .ps-comp__info { font-size: 12px; color: var(--color-text-3); }
    .ps-comp__contact {
      display: flex;
      gap: 8px;
    }
    .ps-comp__btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ps-comp__btn--phone { background: var(--color-primary-soft); color: var(--color-primary); }
    .ps-comp__btn--chat { background: var(--color-accent-soft); color: var(--color-accent-deep); }
    .ps-comp__btn .icon { width: 20px; height: 20px; }
    .ps-notice {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 14px;
      background: var(--color-info-soft);
      border-radius: 12px;
      margin-top: 12px;
      animation: fadeInUp 0.5s var(--ease-out) 0.7s both;
    }
    .ps-notice .icon { width: 18px; height: 18px; color: var(--color-info); flex-shrink: 0; margin-top: 1px; }
    .ps-notice__text { font-size: 12px; color: var(--color-text-2); line-height: 1.6; }
    .ps-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      animation: fadeInUp 0.5s var(--ease-out) 0.8s both;
    }
  </style>
</head>
<body>

<div class="mobile-frame">
  <div class="ps-body">
    <div class="ps-hero">
      <div class="ps-check">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <div class="ps-title">支付成功</div>
      <div class="ps-amount"><span class="price__symbol">¥</span>249.00</div>
    </div>

    <div class="ps-order">
      <div class="ps-order__row">
        <span class="ps-order__label">订单编号</span>
        <span class="ps-order__value ps-order__value--mono">NB20260704001</span>
      </div>
      <div class="ps-order__row">
        <span class="ps-order__label">服务类型</span>
        <span class="ps-order__value">半日陪诊</span>
      </div>
      <div class="ps-order__row">
        <span class="ps-order__label">就诊医院</span>
        <span class="ps-order__value">北京协和医院</span>
      </div>
      <div class="ps-order__row">
        <span class="ps-order__label">就诊时间</span>
        <span class="ps-order__value">2026-07-04 09:00</span>
      </div>
      <div class="ps-order__row">
        <span class="ps-order__label">订单状态</span>
        <span class="badge badge-success">已支付 · 待接单</span>
      </div>
    </div>

    <div class="ps-comp">
      <div class="ps-comp__head">您的陪诊师</div>
      <div class="ps-comp__body">
        <div class="ps-comp__avatar">李</div>
        <div style="flex:1">
          <div class="ps-comp__name">李慧敏</div>
          <div class="ps-comp__info">金牌陪诊师 · 4.9分 · 服务1286单</div>
        </div>
        <div class="ps-comp__contact">
          <div class="ps-comp__btn ps-comp__btn--phone" onclick="showToast('正在拨打电话...')">
            <span id="phoneIcon"></span>
          </div>
          <div class="ps-comp__btn ps-comp__btn--chat" onclick="go('u-chat.html')">
            <span id="chatIcon"></span>
          </div>
        </div>
      </div>
    </div>

    <div class="ps-notice">
      <span id="noticeIcon"></span>
      <span class="ps-notice__text">陪诊师将在30分钟内接单,接单后您可在订单页查看实时服务进度。服务期间享全程保险保障。</span>
    </div>

    <div class="ps-actions">
      <button class="btn btn-outline btn-lg" style="flex:1" onclick="go('u-tracking.html')">查看订单</button>
      <button class="btn btn-primary btn-lg" style="flex:1" onclick="go('u-home.html')">返回首页</button>
    </div>
  </div>
</div>

<script>
  document.getElementById('phoneIcon').innerHTML = IconLib.phone;
  document.getElementById('chatIcon').innerHTML = IconLib.message;
  document.getElementById('noticeIcon').innerHTML = IconLib.bell;
</script>

</body>
</html>
