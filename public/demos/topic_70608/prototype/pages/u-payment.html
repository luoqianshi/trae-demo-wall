<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>暖伴 · 支付</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <script src="../js/icons.js"></script>
  <script src="../js/app.js"></script>
  <style>
    .pay-body { padding: 16px; padding-bottom: 120px; }
    .pay-amount {
      background: var(--color-card);
      border-radius: 20px;
      padding: 28px 20px;
      text-align: center;
      margin-bottom: 16px;
      box-shadow: var(--shadow-card);
    }
    .pay-amount__label {
      font-size: 14px;
      color: var(--color-text-2);
      margin-bottom: 8px;
    }
    .pay-amount__value {
      font-family: var(--font-num);
      font-size: 42px;
      font-weight: 800;
      color: var(--color-accent-deep);
      line-height: 1;
    }
    .pay-amount__value .price__symbol { font-size: 20px; }
    .pay-amount__order {
      font-size: 12px;
      color: var(--color-text-3);
      margin-top: 12px;
      font-family: var(--font-num);
    }
    .pay-section {
      background: var(--color-card);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-card);
    }
    .pay-section__title {
      font-size: 16px;
      font-weight: 700;
      color: var(--color-text-1);
      margin-bottom: 12px;
    }
    .pay-method {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--color-divider);
    }
    .pay-method:last-child { border-bottom: none; }
    .pay-method__icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .pay-method__icon .icon { width: 22px; height: 22px; }
    .pay-method__icon--wechat { background: #E3F5EC; color: #27AE60; }
    .pay-method__icon--alipay { background: #E3F4FC; color: #2D9CDB; }
    .pay-method__icon--balance { background: var(--color-primary-soft); color: var(--color-primary); }
    .pay-method__icon--card { background: var(--color-accent-soft); color: var(--color-accent-deep); }
    .pay-method__icon--family { background: var(--color-warning-soft); color: #B8860B; }
    .pay-method__body { flex: 1; }
    .pay-method__name { font-size: 15px; font-weight: 600; color: var(--color-text-1); display: flex; align-items: center; gap: 6px; }
    .pay-method__desc { font-size: 12px; color: var(--color-text-3); }
    .pay-radio {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--color-border-strong);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--duration-fast) var(--ease-out);
    }
    .pay-radio--on {
      border-color: var(--color-primary);
      background: var(--color-primary);
      color: #fff;
    }
    .pay-radio .icon { width: 12px; height: 12px; opacity: 0; }
    .pay-radio--on .icon { opacity: 1; }
    .pay-security {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 16px;
    }
    .pay-security__item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .pay-security__icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--color-success-soft);
      color: var(--color-success);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pay-security__icon .icon { width: 20px; height: 20px; }
    .pay-security__label { font-size: 11px; color: var(--color-text-2); }
    .pay-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: var(--container-mobile);
      margin: 0 auto;
      padding: 12px 16px calc(12px + var(--safe-bottom));
      background: var(--color-card);
      box-shadow: var(--shadow-float);
      z-index: var(--z-fixed);
    }
    .pay-discount-tip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      background: var(--color-accent-soft);
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 12px;
      color: var(--color-accent-deep);
    }
    .pay-discount-tip .icon { width: 16px; height: 16px; }
  </style>
</head>
<body>

<div class="mobile-frame">
  <div id="header"></div>

  <div class="pay-body">
    <div class="pay-amount anim-fade-up">
      <div class="pay-amount__label">支付金额</div>
      <div class="pay-amount__value"><span class="price__symbol">¥</span>249.00</div>
      <div class="pay-amount__order">订单号:NB20260704001</div>
    </div>

    <div class="pay-discount-tip anim-fade-up delay-1">
      <span id="tipIcon"></span>
      <span>已使用新人优惠券立减50元,实付249元</span>
    </div>

    <div class="pay-section anim-fade-up delay-1">
      <div class="pay-section__title">选择支付方式</div>
      <div id="methodList"></div>
    </div>

    <div class="pay-section anim-fade-up delay-2">
      <div class="pay-security" id="securityBar"></div>
    </div>
  </div>

  <div class="pay-footer">
    <button class="btn btn-primary btn-lg btn-block" onclick="showToast('支付处理中...');setTimeout(()=>go('u-pay-success.html'),1500)">确认支付 ¥249.00</button>
  </div>
</div>

<script>
  document.getElementById('header').innerHTML = renderHeader('收银台');
  document.getElementById('tipIcon').innerHTML = IconLib.coupon;

  const methods = [
    { id: 'wechat', name: '微信支付', desc: '推荐使用', icon: 'message', iconClass: 'pay-method__icon--wechat', active: true },
    { id: 'alipay', name: '支付宝', desc: '支付宝安全支付', icon: 'wallet', iconClass: 'pay-method__icon--alipay' },
    { id: 'balance', name: '账户余额', desc: '可用余额 ¥1,280.00', icon: 'wallet', iconClass: 'pay-method__icon--balance' },
    { id: 'card', name: '储值卡', desc: '暖伴储值卡 · 8.8折', icon: 'coupon', iconClass: 'pay-method__icon--card' },
    { id: 'family', name: '亲情代付', desc: '发送给子女代为支付', icon: 'users', iconClass: 'pay-method__icon--family' },
  ];
  document.getElementById('methodList').innerHTML = methods.map((m, i) => `
    <div class="pay-method" onclick="selectMethod(${i})">
      <div class="pay-method__icon ${m.iconClass}">${IconLib[m.icon]}</div>
      <div class="pay-method__body">
        <div class="pay-method__name">
          ${m.name}
          ${m.active ? '<span class="badge badge-success">推荐</span>' : ''}
        </div>
        <div class="pay-method__desc">${m.desc}</div>
      </div>
      <div class="pay-radio ${m.active ? 'pay-radio--on' : ''}"><span id="radio-${i}" style="display:${m.active?'inline':'none'}">${IconLib.check}</span></div>
    </div>
  `).join('');

  function selectMethod(idx) {
    document.querySelectorAll('.pay-radio').forEach((r, i) => {
      r.classList.toggle('pay-radio--on', i === idx);
      const check = r.querySelector('span');
      if (check) check.style.display = i === idx ? 'inline' : 'none';
      else if (i === idx) r.innerHTML = IconLib.check;
    });
  }

  const securities = [
    { icon: 'shield', label: '加密传输' },
    { icon: 'checkCircle', label: '安全认证' },
    { icon: 'heart', label: '资金保障' },
  ];
  document.getElementById('securityBar').innerHTML = securities.map(s => `
    <div class="pay-security__item">
      <div class="pay-security__icon">${IconLib[s.icon]}</div>
      <div class="pay-security__label">${s.label}</div>
    </div>
  `).join('');
</script>

</body>
</html>
