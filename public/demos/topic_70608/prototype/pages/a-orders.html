<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>订单管理 - 暖伴后台</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <style>
    body{background:#f5f7fb;color:var(--color-text-1)}
    .admin-shell{min-height:100vh;display:flex;background:linear-gradient(135deg,#f7faf9 0%,#f6f2ec 100%)}
    .admin-sidebar{position:fixed;left:0;top:0;bottom:0;width:248px;background:#10231f;color:#dbe7e3;padding:22px 16px;display:flex;flex-direction:column;box-shadow:16px 0 40px rgba(16,35,31,.12);z-index:10}
    .admin-brand{display:flex;align-items:center;gap:12px;padding:8px 10px 24px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:18px}
    .admin-brand__logo{width:44px;height:44px;border-radius:16px;background:linear-gradient(135deg,#1E7A6F,#F2994A);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 10px 28px rgba(242,153,74,.28)}
    .admin-brand__name{font-size:18px;font-weight:700;color:#fff;letter-spacing:.02em}.admin-brand__sub{font-size:12px;color:rgba(255,255,255,.58);margin-top:3px}
    .admin-nav{display:flex;flex-direction:column;gap:6px;flex:1}.admin-nav a{display:flex;align-items:center;gap:10px;padding:12px 12px;border-radius:14px;color:rgba(255,255,255,.72);font-weight:500;transition:.2s}.admin-nav a:hover,.admin-nav a.active{background:rgba(255,255,255,.1);color:#fff}.admin-nav a.active{box-shadow:inset 3px 0 0 #F2994A}.admin-nav .icon{width:20px;height:20px}
    .admin-user{padding:14px;border-radius:18px;background:rgba(255,255,255,.08);display:flex;gap:10px;align-items:center}.admin-user__avatar{width:38px;height:38px;border-radius:50%;background:#fff;color:#1E7A6F;display:flex;align-items:center;justify-content:center;font-weight:700}.admin-user__name{color:#fff;font-weight:600}.admin-user__role{font-size:12px;color:rgba(255,255,255,.58)}
    .admin-main{margin-left:248px;min-height:100vh;width:calc(100% - 248px);padding:28px 32px 44px}.admin-topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}.admin-title{display:flex;align-items:center;gap:14px}.admin-title__icon{width:52px;height:52px;border-radius:18px;background:#fff;color:#1E7A6F;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 32px rgba(16,35,31,.08)}.admin-title__icon .icon{width:26px;height:26px}.admin-title h1{font-size:28px}.admin-title p{margin-top:6px;color:var(--color-text-2)}.admin-actions{display:flex;gap:10px;align-items:center}.admin-search{height:44px;width:260px;border-radius:22px;background:#fff;border:1px solid var(--color-border);padding:0 16px;color:var(--color-text-2);box-shadow:var(--shadow-sm)}
    .stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:18px}.stat-card{background:#fff;border:1px solid rgba(30,122,111,.08);border-radius:22px;padding:20px;box-shadow:0 14px 38px rgba(16,35,31,.06);position:relative;overflow:hidden}.stat-card:after{content:'';position:absolute;right:-24px;top:-24px;width:84px;height:84px;border-radius:50%;background:var(--color-primary-soft)}.stat-card__label{color:var(--color-text-2);font-size:13px}.stat-card__value{font-size:30px;font-weight:800;margin-top:8px}.stat-card__trend{font-size:12px;color:var(--color-success);margin-top:8px;display:flex;gap:4px;align-items:center}.stat-card__icon{position:absolute;right:18px;top:18px;color:#1E7A6F;z-index:1}.panel-grid{display:grid;grid-template-columns:1.35fr .65fr;gap:18px}.admin-panel{background:#fff;border:1px solid rgba(16,35,31,.06);border-radius:24px;padding:22px;box-shadow:0 18px 46px rgba(16,35,31,.07);margin-bottom:18px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.panel-title{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}.panel-sub{font-size:13px;color:var(--color-text-3);margin-top:4px}.admin-table{width:100%;border-collapse:collapse}.admin-table th{text-align:left;color:var(--color-text-3);font-size:12px;font-weight:600;padding:12px;border-bottom:1px solid var(--color-divider);background:#fafcfc}.admin-table td{padding:14px 12px;border-bottom:1px solid var(--color-divider);font-size:14px}.admin-table tr:hover td{background:#fbf8f3}.entity{display:flex;align-items:center;gap:10px}.avatar{width:34px;height:34px;border-radius:12px;background:var(--color-primary-soft);color:var(--color-primary);display:flex;align-items:center;justify-content:center;font-weight:700}.metric-list{display:flex;flex-direction:column;gap:12px}.metric-row{padding:14px;border-radius:16px;background:#f8faf9;display:flex;justify-content:space-between;align-items:center}.progress{height:8px;border-radius:999px;background:#e9efed;margin-top:8px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,#1E7A6F,#F2994A);border-radius:999px}.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.quick-card{background:#fff;border:1px solid var(--color-border);border-radius:18px;padding:18px;box-shadow:var(--shadow-sm)}.quick-card__icon{width:40px;height:40px;border-radius:14px;background:var(--color-accent-soft);color:var(--color-accent);display:flex;align-items:center;justify-content:center;margin-bottom:12px}.quick-card h3{font-size:16px}.quick-card p{font-size:13px;margin-top:6px}.login-wrap{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;background:linear-gradient(135deg,#10231f,#1E7A6F)}.login-hero{padding:72px;color:#fff;display:flex;flex-direction:column;justify-content:space-between}.login-hero h1{color:#fff;font-size:42px;line-height:1.15}.login-hero p{color:rgba(255,255,255,.76);font-size:17px;margin-top:18px;max-width:560px}.login-card{align-self:center;justify-self:center;width:440px;background:#fff;border-radius:30px;padding:36px;box-shadow:0 30px 80px rgba(0,0,0,.22)}.form-row{margin-top:18px}.form-row label{display:block;font-weight:600;margin-bottom:8px}.form-input{height:48px;width:100%;border:1px solid var(--color-border);border-radius:16px;padding:0 16px;background:#fbfcfc}.chart-bars{height:260px;display:flex;align-items:end;gap:10px;padding:16px;background:linear-gradient(180deg,#fff,#f8fbfa);border-radius:18px}.bar{flex:1;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,#1E7A6F,#8bc7bc);min-height:28px;position:relative}.bar:nth-child(even){background:linear-gradient(180deg,#F2994A,#f6c390)}.timeline{display:flex;flex-direction:column;gap:12px}.timeline-item{display:flex;gap:12px}.timeline-dot{width:30px;height:30px;border-radius:50%;background:var(--color-primary-soft);color:var(--color-primary);display:flex;align-items:center;justify-content:center;flex:0 0 30px}.timeline-body{flex:1;padding-bottom:12px;border-bottom:1px solid var(--color-divider)}.timeline-body strong{display:block}.timeline-body span{font-size:13px;color:var(--color-text-3)}
    @media(max-width:980px){.admin-sidebar{position:static;width:100%;height:auto}.admin-shell{display:block}.admin-main{margin-left:0;width:100%;padding:20px}.stat-grid,.panel-grid{grid-template-columns:1fr}.quick-grid{grid-template-columns:1fr}.login-wrap{grid-template-columns:1fr}.login-hero{display:none}.login-card{width:calc(100% - 32px);margin:40px 0}.admin-topbar{flex-direction:column}.admin-search{width:100%}}
</style>
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="admin-brand"><div class="admin-brand__logo" data-icon="heart"></div><div><div class="admin-brand__name">暖伴 NuanBan</div><div class="admin-brand__sub">商业运营后台</div></div></div>
    <nav class="admin-nav"><a class="" href="a-dashboard.html"><span class="nav-ico" data-icon="chart"></span><span>数据总览</span></a><a class="active" href="a-orders.html"><span class="nav-ico" data-icon="order"></span><span>订单管理</span></a><a class="" href="a-companions.html"><span class="nav-ico" data-icon="doctor"></span><span>陪诊师</span></a><a class="" href="a-users.html"><span class="nav-ico" data-icon="users"></span><span>用户管理</span></a><a class="" href="a-pricing.html"><span class="nav-ico" data-icon="coupon"></span><span>定价套餐</span></a><a class="" href="a-marketing.html"><span class="nav-ico" data-icon="gift"></span><span>营销活动</span></a><a class="" href="a-finance.html"><span class="nav-ico" data-icon="wallet"></span><span>财务结算</span></a><a class="" href="a-complaints.html"><span class="nav-ico" data-icon="message"></span><span>投诉工单</span></a><a class="" href="a-settings.html"><span class="nav-ico" data-icon="settings"></span><span>系统设置</span></a></nav>
    <div class="admin-user"><div class="admin-user__avatar">管</div><div><div class="admin-user__name">运营管理员</div><div class="admin-user__role">总部 · 超级权限</div></div></div>
  </aside>
  <main class="admin-main">
    <section class="admin-topbar">
      <div class="admin-title"><div class="admin-title__icon" data-icon="order"></div><div><h1>订单管理</h1><p>全链路订单履约、派单与服务追踪</p></div></div>
      <div class="admin-actions"><input class="admin-search" placeholder="搜索订单 / 用户 / 陪诊师"><button class="btn btn-primary" onclick="showToast('已刷新最新数据')"><span data-icon="refresh"></span>刷新</button></div>
    </section>
    <div id="pageContent"></div>
  </main>
</div>
<script src="../js/icons.js"></script>
<script src="../js/mock-data.js"></script>
<script src="../js/app.js"></script>
<script>
const PAGE_KEY = 'orders';
const PAGE_TITLE = '订单管理';

function money(n){return '¥' + Number(n).toLocaleString('zh-CN');}
function mountIcons(){document.querySelectorAll('[data-icon]').forEach(el=>{el.innerHTML = IconLib[el.dataset.icon] || '';});}
function statusName(s){return (MockData.orderStatus[s] && MockData.orderStatus[s].label) || s;}
function statCards(){const s=MockData.dashboardStats;return `<div class="stat-grid">
  <div class="stat-card"><div class="stat-card__icon">${IconLib.order}</div><div class="stat-card__label">今日订单</div><div class="stat-card__value num">${s.todayOrders}</div><div class="stat-card__trend">${IconLib.trending} 环比 +${s.monthlyGrowth}%</div></div>
  <div class="stat-card"><div class="stat-card__icon">${IconLib.wallet}</div><div class="stat-card__label">今日营收</div><div class="stat-card__value num">${money(s.todayRevenue)}</div><div class="stat-card__trend">${IconLib.trending} 支付转化稳定</div></div>
  <div class="stat-card"><div class="stat-card__icon">${IconLib.doctor}</div><div class="stat-card__label">在岗陪诊师</div><div class="stat-card__value num">${s.activeCompanions}</div><div class="stat-card__trend">${IconLib.checkCircle} 覆盖 12 城</div></div>
  <div class="stat-card"><div class="stat-card__icon">${IconLib.starFill}</div><div class="stat-card__label">满意度</div><div class="stat-card__value num">${s.satisfaction}%</div><div class="stat-card__trend">${IconLib.shield} 投诉率 0.8%</div></div>
</div>`;}
function ordersTable(limit=5){return `<table class="admin-table"><thead><tr><th>订单编号</th><th>用户</th><th>陪诊师</th><th>医院/服务</th><th>金额</th><th>状态</th><th>预约时间</th></tr></thead><tbody>${MockData.adminOrders.slice(0,limit).map(o=>`<tr><td class="font-semibold">${o.id}</td><td><div class="entity"><span class="avatar">${o.user[0]}</span>${o.user}</div></td><td>${o.companion}</td><td>${o.hospital}<br><span class="text-3">${o.service}</span></td><td class="font-semibold">${money(o.amount)}</td><td>${renderStatusBadge(o.status)}</td><td>${o.time}</td></tr>`).join('')}</tbody></table>`;}
function companionsTable(){return `<table class="admin-table"><thead><tr><th>编号</th><th>陪诊师</th><th>城市</th><th>等级</th><th>评分</th><th>累计订单</th><th>状态</th></tr></thead><tbody>${MockData.adminCompanions.map(c=>`<tr><td>${c.id}</td><td><div class="entity"><span class="avatar">${c.name[0]}</span><div><strong>${c.name}</strong><br><span class="text-3">${c.gender} · ${c.age}岁</span></div></div></td><td>${c.city}</td><td><span class="badge badge-accent">${c.level}</span></td><td>${IconLib.starFill} ${c.rating}</td><td class="num">${c.orders}</td><td><span class="badge ${c.status==='在岗'?'badge-success':c.status==='审核中'?'badge-warning':'badge-outline'}">${c.status}</span></td></tr>`).join('')}</tbody></table>`;}
function cityPanel(){const d=MockData.dashboardStats.cityDistribution;return `<div class="metric-list">${d.map(x=>`<div class="metric-row"><div style="flex:1"><div class="justify-between flex"><strong>${x.city}</strong><span>${x.orders} 单 · ${x.percent}%</span></div><div class="progress"><span style="width:${x.percent*3}%"></span></div></div></div>`).join('')}</div>`;}
function trendChart(){const arr=MockData.dashboardStats.orderTrend;const max=Math.max(...arr);return `<div class="chart-bars">${arr.map(v=>`<div class="bar" style="height:${Math.round(v/max*100)}%" title="${v}单"></div>`).join('')}</div>`;}
function quickCards(items){return `<div class="quick-grid">${items.map(i=>`<div class="quick-card"><div class="quick-card__icon">${IconLib[i.icon]}</div><h3>${i.title}</h3><p>${i.desc}</p></div>`).join('')}</div>`;}
function renderDashboard(){return statCards()+`<div class="panel-grid"><section class="admin-panel"><div class="panel-head"><div><div class="panel-title">${IconLib.chart} 订单趋势</div><div class="panel-sub">近 12 个时段订单增长曲线</div></div><span class="badge badge-success">实时</span></div>${trendChart()}</section><section class="admin-panel"><div class="panel-head"><div class="panel-title">${IconLib.location} 城市分布</div></div>${cityPanel()}</section></div><section class="admin-panel"><div class="panel-head"><div class="panel-title">${IconLib.order} 最新订单</div><button class="btn btn-ghost btn-sm" onclick="go('a-orders.html')">查看全部</button></div>${ordersTable()}</section>`;}
function renderOrders(){return statCards()+`<section class="admin-panel"><div class="panel-head"><div><div class="panel-title">${IconLib.order} 订单履约列表</div><div class="panel-sub">支持派单、改期、退款审核与服务节点追踪</div></div><button class="btn btn-accent btn-sm">批量派单</button></div>${ordersTable(99)}</section><section class="admin-panel"><div class="panel-head"><div class="panel-title">${IconLib.clock} 履约SLA</div></div>${quickCards([{icon:'bell',title:'待接单预警',desc:'超过 5 分钟未接单自动升级给城市主管'},{icon:'route',title:'服务中追踪',desc:'按节点记录到达、候诊、缴费、取药与完结'},{icon:'file',title:'电子服务报告',desc:'完单后自动归档，就诊摘要同步给家属'}])}</section>`;}
function renderCompanions(){return statCards()+`<section class="admin-panel"><div class="panel-head"><div><div class="panel-title">${IconLib.doctor} 陪诊师档案</div><div class="panel-sub">使用 MockData.adminCompanions 渲染，可扩展审核与等级策略</div></div><button class="btn btn-primary btn-sm">新增陪诊师</button></div>${companionsTable()}</section><section class="admin-panel">${quickCards([{icon:'shield',title:'资质审核',desc:'身份证、健康证、护理资质与无犯罪记录校验'},{icon:'star',title:'等级运营',desc:'金牌/钻石陪诊师权益、佣金与派单权重配置'},{icon:'calendar',title:'排班监管',desc:'按城市、医院、时段动态监控供给能力'}])}</section>`;}
function genericContent(){const maps={users:[['users','会员分层','按消费、复购、家庭成员数识别高价值用户'],['heart','健康档案','统一沉淀老人病史、常用医院与用药提醒'],['message','客服触达','服务前提醒、服务中安抚、服务后回访闭环']],pricing:[['coupon','价格规则','按城市、服务类型、医院距离与节假日配置价格'],['member','会员套餐','亲情卡、月度包、企业福利卡灵活组合'],['trending','毛利测算','实时预估平台佣金、陪诊师分账与补贴成本']],marketing:[['gift','活动中心','新人首单、邀请返现、节日敬老活动统一投放'],['coupon','优惠券池','满减券、折扣券、服务券与指定医院券'],['chart','效果分析','ROI、核销率、拉新成本与复购贡献']],finance:[['wallet','交易流水','订单支付、退款、补差价与平台服务费明细'],['download','对账导出','按日/月导出财务报表并匹配支付渠道'],['shield','风控稽核','异常退款、高频补贴、异常分账自动预警']],complaints:[['message','工单受理','投诉来源、服务环节、责任归因与处理状态'],['clock','SLA管理','高危投诉 2 小时内响应，24 小时内闭环'],['heart','客户关怀','补偿券、专属客服回访与满意度修复']],settings:[['settings','基础配置','城市、医院、科室、服务品类与业务开关'],['shield','权限角色','总部、城市经理、客服、财务多角色权限'],['bell','通知模板','短信、站内信、微信服务通知模板维护']]};const list=maps[PAGE_KEY]||[];return statCards()+`<section class="admin-panel"><div class="panel-head"><div><div class="panel-title">${IconLib.file} ${PAGE_TITLE}工作台</div><div class="panel-sub">商业级后台配置中心，面向运营、客服、财务与城市团队协作</div></div><button class="btn btn-primary btn-sm">新建配置</button></div>${quickCards(list.map(x=>({icon:x[0],title:x[1],desc:x[2]})))}</section><div class="panel-grid"><section class="admin-panel"><div class="panel-title">${IconLib.chart} 运营趋势</div>${trendChart()}</section><section class="admin-panel"><div class="panel-title">${IconLib.bell} 待办事项</div><div class="timeline"><div class="timeline-item"><div class="timeline-dot">${IconLib.check}</div><div class="timeline-body"><strong>完成本周策略复盘</strong><span>涉及订单增长、服务满意度与城市供给</span></div></div><div class="timeline-item"><div class="timeline-dot">${IconLib.clock}</div><div class="timeline-body"><strong>审核 6 条新配置</strong><span>上线前需业务负责人二次确认</span></div></div><div class="timeline-item"><div class="timeline-dot">${IconLib.message}</div><div class="timeline-body"><strong>同步城市团队</strong><span>重要策略变更自动推送到运营群</span></div></div></div></section></div>`;}
function renderLogin(){document.body.innerHTML=`<div class="login-wrap"><section class="login-hero"><div><div class="admin-brand" style="border:0;padding:0"><div class="admin-brand__logo">${IconLib.heart}</div><div><div class="admin-brand__name">暖伴 NuanBan</div><div class="admin-brand__sub">陪诊服务商业运营后台</div></div></div></div><div><h1>让每一次陪诊服务，都可管理、可追踪、可信赖。</h1><p>统一管理订单履约、陪诊师供给、用户会员、财务结算与投诉工单，助力全国城市精细化运营。</p></div><div>© 2026 暖伴健康科技</div></section><section class="login-card"><div class="admin-title" style="margin-bottom:18px"><div class="admin-title__icon">${IconLib.shield}</div><div><h1>后台登录</h1><p>使用企业账号进入管理控制台</p></div></div><div class="form-row"><label>账号</label><input class="form-input" value="admin@nuanban.com"></div><div class="form-row"><label>密码</label><input class="form-input" type="password" value="12345678"></div><div class="form-row flex justify-between items-center"><span class="text-3">${IconLib.shield} 已开启安全审计</span><a>忘记密码</a></div><button class="btn btn-primary btn-lg btn-block mt-6" onclick="go('a-dashboard.html')">登录控制台</button></section></div>`;}
function init(){if(PAGE_KEY==='login'){renderLogin();return;}const box=document.getElementById('pageContent');if(PAGE_KEY==='dashboard')box.innerHTML=renderDashboard();else if(PAGE_KEY==='orders')box.innerHTML=renderOrders();else if(PAGE_KEY==='companions')box.innerHTML=renderCompanions();else box.innerHTML=genericContent();mountIcons();}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
