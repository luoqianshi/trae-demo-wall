<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>暖伴 · 在线沟通</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <script src="../js/icons.js"></script>
  <script src="../js/app.js"></script>
  <style>
    .chat {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--color-bg);
    }
    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: calc(var(--safe-top) + 8px) 16px 12px;
      background: var(--color-card);
      box-shadow: var(--shadow-sm);
      z-index: 10;
    }
    .chat-header__back {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .chat-header__back .icon { width: 22px; height: 22px; color: var(--color-text-1); }
    .chat-header__avatar {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--color-primary-soft);
      color: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .chat-header__name { font-size: 15px; font-weight: 600; color: var(--color-text-1); }
    .chat-header__status { font-size: 11px; color: var(--color-success); display: flex; align-items: center; gap: 4px; }
    .chat-header__status .status-dot { width: 6px; height: 6px; background: var(--color-success); }
    .chat-header__call {
      margin-left: auto;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--color-primary-soft);
      color: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .chat-header__call .icon { width: 20px; height: 20px; }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px 8px;
      -webkit-overflow-scrolling: touch;
    }
    .chat-msg {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      align-items: flex-start;
    }
    .chat-msg--right { flex-direction: row-reverse; }
    .chat-msg__avatar {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .chat-msg__avatar--left { background: var(--color-primary-soft); color: var(--color-primary); }
    .chat-msg__avatar--right { background: var(--color-accent-soft); color: var(--color-accent-deep); }
    .chat-msg__body {
      max-width: 70%;
    }
    .chat-msg__bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
    }
    .chat-msg--left .chat-msg__bubble {
      background: var(--color-card);
      color: var(--color-text-1);
      border-top-left-radius: 4px;
      box-shadow: var(--shadow-xs);
    }
    .chat-msg--right .chat-msg__bubble {
      background: var(--color-primary);
      color: #fff;
      border-top-right-radius: 4px;
    }
    .chat-msg__time {
      font-size: 10px;
      color: var(--color-text-3);
      margin-top: 4px;
      font-family: var(--font-num);
    }
    .chat-msg--right .chat-msg__time { text-align: right; }
    .chat-system {
      text-align: center;
      margin: 12px 0;
    }
    .chat-system__text {
      display: inline-block;
      font-size: 11px;
      color: var(--color-text-3);
      background: var(--color-bg-2);
      padding: 4px 12px;
      border-radius: 999px;
    }
    .chat-quick {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 12px;
      -webkit-overflow-scrolling: touch;
    }
    .chat-quick::-webkit-scrollbar { display: none; }
    .chat-quick .chip {
      white-space: nowrap;
      flex-shrink: 0;
      font-size: 13px;
    }
    .chat-input-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px calc(8px + var(--safe-bottom));
      background: var(--color-card);
      box-shadow: 0 -1px 8px rgba(0,0,0,0.04);
    }
    .chat-input-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--color-bg-2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--color-text-2);
    }
    .chat-input-btn .icon { width: 20px; height: 20px; }
    .chat-input {
      flex: 1;
      height: 38px;
      background: var(--color-bg-2);
      border-radius: 999px;
      padding: 0 16px;
      font-size: 14px;
      border: 1.5px solid transparent;
    }
    .chat-input:focus { background: var(--color-card); border-color: var(--color-primary); }
    .chat-send {
      padding: 8px 16px;
      border-radius: 999px;
      background: var(--color-primary);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .chat-trust {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 6px;
      font-size: 11px;
      color: var(--color-text-3);
      background: var(--color-card);
    }
    .chat-trust .icon { width: 12px; height: 12px; color: var(--color-primary); }
  </style>
</head>
<body>

<div class="mobile-frame">
  <div class="chat">
    <div class="chat-header">
      <div class="chat-header__back" onclick="back()">
        <span id="backIcon"></span>
      </div>
      <div class="chat-header__avatar">李</div>
      <div>
        <div class="chat-header__name">李慧敏</div>
        <div class="chat-header__status">
          <span class="status-dot"></span>
          在线 · 金牌陪诊师
        </div>
      </div>
      <div class="chat-header__call" onclick="showToast('正在拨打电话...')">
        <span id="phoneIcon"></span>
      </div>
    </div>

    <div class="chat-trust">
      <span id="shieldIcon"></span>
      <span>对话内容加密保护,请勿透露银行卡等敏感信息</span>
    </div>

    <div class="chat-messages" id="messages">
      <div class="chat-system">
        <span class="chat-system__text">今天 09:00 · 服务订单已创建</span>
      </div>
    </div>

    <div class="chat-quick" id="quickBar"></div>

    <div class="chat-input-bar">
      <div class="chat-input-btn" onclick="showToast('语音输入')">
        <span id="voiceIcon"></span>
      </div>
      <input class="chat-input" type="text" placeholder="输入消息..." id="chatInput">
      <div class="chat-input-btn" onclick="showToast('发送图片')">
        <span id="imageIcon"></span>
      </div>
      <div class="chat-send" onclick="sendMessage()">发送</div>
    </div>
  </div>
</div>

<script>
  document.getElementById('backIcon').innerHTML = IconLib.back;
  document.getElementById('phoneIcon').innerHTML = IconLib.phone;
  document.getElementById('shieldIcon').innerHTML = IconLib.shield;
  document.getElementById('voiceIcon').innerHTML = IconLib.mic;
  document.getElementById('imageIcon').innerHTML = IconLib.image;

  const messages = [
    { type: 'left', text: '您好,我是您的陪诊师李慧敏,请问需要什么帮助?', time: '09:01' },
    { type: 'right', text: '李老师您好,我母亲明天要去协和看心血管内科,想提前了解一下流程', time: '09:02' },
    { type: 'left', text: '好的,我已查看您母亲的健康档案。明天9点我会在医院门诊大厅等候,请提前10分钟到达,携带好医保卡和既往病历。', time: '09:03' },
    { type: 'left', text: '另外,您母亲有高血压史,建议就诊前正常服药,不要空腹。', time: '09:03' },
    { type: 'right', text: '好的,谢谢提醒!请问需要准备什么材料吗?', time: '09:05' },
    { type: 'left', text: '需要准备:1.医保卡 2.既往病历 3.近期用药清单 4.身份证。其他的我来帮您处理。', time: '09:06' },
  ];

  function renderMessages() {
    const container = document.getElementById('messages');
    container.innerHTML = `<div class="chat-system"><span class="chat-system__text">今天 09:00 · 服务订单已创建</span></div>`;
    container.innerHTML += messages.map(m => `
      <div class="chat-msg chat-msg--${m.type}">
        <div class="chat-msg__avatar chat-msg__avatar--${m.type}">${m.type === 'left' ? '李' : '我'}</div>
        <div class="chat-msg__body">
          <div class="chat-msg__bubble">${m.text}</div>
          <div class="chat-msg__time">${m.time}</div>
        </div>
      </div>
    `).join('');
    container.scrollTop = container.scrollHeight;
  }
  renderMessages();

  const quickQuestions = ['就诊流程是什么?', '需要准备什么?', '可以帮忙取药吗?', '什么时候到?', '谢谢您'];
  document.getElementById('quickBar').innerHTML = quickQuestions.map(q =>
    `<span class="chip" onclick="quickSend('${q}')">${q}</span>`
  ).join('');

  function quickSend(text) {
    const now = new Date();
    const time = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    messages.push({ type: 'right', text, time });
    renderMessages();
    setTimeout(() => {
      messages.push({ type: 'left', text: '收到!有任何问题随时联系我。', time });
      renderMessages();
    }, 1000);
  }

  function sendMessage() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;
    const now = new Date();
    const time = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    messages.push({ type: 'right', text, time });
    input.value = '';
    renderMessages();
    setTimeout(() => {
      messages.push({ type: 'left', text: '好的,我了解了,会为您安排妥当。', time });
      renderMessages();
    }, 1200);
  }

  document.getElementById('chatInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });
</script>

</body>
</html>
