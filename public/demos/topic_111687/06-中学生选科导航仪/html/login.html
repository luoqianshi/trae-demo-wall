<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>登录 - 中学生选科导航仪</title>
<link rel="stylesheet" href="../css/login.css">
</head>
<body>
<div class="app-frame">
  <div class="status-bar"><span>20:00</span><span>5G 🔋</span></div>
  <div class="nav-bar"><span class="nav-title">登录</span></div>

  <div class="page">
    <div class="login-scene fade-in">
      <div class="l-icon">🧭</div>
      <div class="l-title">选科导航仪</div>
      <div class="l-sub">登录后保存你的测评记录</div>
    </div>

    <div class="shared-province" id="sharedProvince">
      <div class="input-group">
        <label>高考省份</label>
        <div class="province-selector" id="provinceSelector">
          <div class="province-display" onclick="toggleProvinceList()">
            <span id="selectedProvince">请选择省份</span>
            <span class="province-arrow">▼</span>
          </div>
          <div class="province-dropdown" id="provinceDropdown">
            <div class="province-search">
              <input type="text" id="provinceSearch" placeholder="搜索省份" oninput="filterProvinces()">
            </div>
            <div class="province-list-container">
              <div class="province-list" id="provinceList"></div>
              <div class="province-index" id="provinceIndex"></div>
            </div>
          </div>
        </div>
        <input type="hidden" id="province" value="">
      </div>
    </div>

    <div class="login-form fade-in">
      <div class="input-group">
        <label>用户名 / 手机号</label>
        <input type="text" id="username" placeholder="请输入用户名">
      </div>
      <div class="input-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码">
      </div>
      <div class="login-options">
          <label><input type="checkbox" style="accent-color:var(--accent)"> 记住我</label>
          <a href="#" onclick="switchToRegister()">注册</a>
        </div>
        <button class="btn-primary" onclick="doLogin()">登录</button>

        <div class="divider">或以访客身份使用</div>
        <button class="guest-btn" onclick="guestLogin()">访客登录</button>
      </div>

      <div class="register-form" id="registerForm" style="display:none;">
        <div class="input-group">
          <label>用户名</label>
          <input type="text" id="regUsername" placeholder="请输入用户名">
        </div>
        <div class="input-group">
          <label>密码</label>
          <input type="password" id="regPassword" placeholder="请输入密码（至少6位）">
        </div>
        <div class="input-group">
          <label>确认密码</label>
          <input type="password" id="regPassword2" placeholder="请再次输入密码">
        </div>
        <div class="login-options">
          <a href="#" onclick="switchToLogin()">返回登录</a>
        </div>
        <button class="btn-primary" onclick="doRegister()">注册</button>
      </div>
  </div>
</div>

<script src="../js/login.js"></script>
</body>
</html>
