<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>测评结果 - 中学生选科导航仪</title>
<link rel="stylesheet" href="../css/result.css">
<script src="../js/result.js"></script>
</head>
<body>
<div class="app-frame">
  <div class="status-bar"><span>20:00</span><span>5G 🔋</span></div>

  <div class="page">
    <div class="nav-bar"><span class="nav-back" onclick="location.href='../index.html'">←</span><span class="nav-title">测评结果</span></div>

    <div class="result-card fade-in">
      <div style="font-size:3rem;margin-bottom:0.5rem">🎯</div>
      <div class="result-title">推荐选科组合</div>
      <div style="font-size:1.5rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:0.5rem 0">物理 + 化学 + 地理</div>
      <div style="color:var(--muted);font-size:0.85rem">匹配度 92%</div>
    </div>

    <div class="section-title fade-in">组合优势</div>
    <div class="q-card fade-in">
      <div style="font-size:0.9rem;line-height:1.8;color:var(--muted)">
        <p>• <strong style="color:var(--ink)">专业覆盖广：</strong>可报考 95% 以上的理工类专业</p>
        <p>• <strong style="color:var(--ink)">文理兼顾：</strong>地理偏向理科思维，学习负担相对均衡</p>
        <p>• <strong style="color:var(--ink)">赋分优势：</strong>地理选考人数适中，容易取得较好等级</p>
        <p>• <strong style="color:var(--ink)">符合你的特点：</strong>逻辑强、空间感好、不喜欢大量背诵</p>
      </div>
    </div>

    <div class="section-title fade-in">适合专业方向（点击了解详情）</div>
    <div class="rec-card fade-in" onclick="goToMajor('计算机类')">
      <div class="rec-header"><div class="rec-icon">💻</div><div class="rec-name">计算机类</div><span class="rec-arrow">›</span></div>
      <div class="rec-desc">软件工程、人工智能、数据科学</div>
    </div>
    <div class="rec-card fade-in" onclick="goToMajor('建筑/城市规划')">
      <div class="rec-header"><div class="rec-icon">🏗️</div><div class="rec-name">建筑/城市规划</div><span class="rec-arrow">›</span></div>
      <div class="rec-desc">建筑学、城乡规划、风景园林</div>
    </div>
    <div class="rec-card fade-in" onclick="goToMajor('地理信息科学')">
      <div class="rec-header"><div class="rec-icon">🌍</div><div class="rec-name">地理信息科学</div><span class="rec-arrow">›</span></div>
      <div class="rec-desc">遥感、GIS、环境科学</div>
    </div>

    <button class="btn-primary fade-in" onclick="saveResult()">保存结果</button>
    <a href="quiz.html" class="btn-primary fade-in" style="background:var(--bg3);color:var(--ink);margin-top:0">重新测评</a>
  </div>

  <div class="tab-bar">
    <div class="tab-item" onclick="location.href='../index.html'"><span class="tab-icon">🧭</span>测评</div>
    <div class="tab-item active" onclick="location.href='result.html'"><span class="tab-icon">🎯</span>结果</div>
  </div>
</div>
</body>
</html>
