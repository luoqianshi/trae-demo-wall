<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>专业详情 - 中学生选科导航仪</title>
<link rel="stylesheet" href="../css/major.css">
<script src="../js/majorData.js"></script>
<script src="../js/index.js"></script>
<script src="../js/major.js"></script>
</head>
<body>
<div class="app-frame">
  <div class="status-bar"><span>20:00</span><span>5G 🔋</span></div>

  <div class="page">
    <div class="nav-bar">
      <span class="nav-back" onclick="location.href='result.html'">←</span>
      <span class="nav-title" id="navTitle">专业详情</span>
    </div>

    <div class="major-hero fade-in" id="majorHero">
      <div class="major-icon" id="majorIcon">💻</div>
      <div class="major-title" id="majorTitle">专业分类名称</div>
      <div class="major-tag" id="majorTag">标签</div>
    </div>

    <div class="section-title fade-in">📖 专业概述</div>
    <div class="q-card fade-in" id="overviewCard">
      <div class="q-text" id="overviewText"></div>
    </div>

    <div class="section-title fade-in">📈 行业动态（逐年更新）</div>
    <div class="timeline" id="timeline">
    </div>

    <div class="section-title fade-in">💼 就业前景</div>
    <div class="q-card fade-in">
      <div class="job-section">
        <div class="job-title">主要就业领域</div>
        <div class="job-tags" id="jobSectors"></div>
      </div>
      <div class="job-section">
        <div class="job-title">热门岗位</div>
        <div class="job-tags" id="jobPositions"></div>
      </div>
      <div class="job-section">
        <div class="job-title">薪资参考</div>
        <div class="q-text" id="salaryRange"></div>
      </div>
    </div>

    <div class="section-title fade-in">🎯 能力要求</div>
    <div class="q-card fade-in" id="skillCard">
      <div class="skill-list" id="skillList"></div>
    </div>

    <div class="section-title fade-in">📚 发展路径</div>
    <div class="q-card fade-in" id="pathCard">
      <div class="path-list" id="pathList"></div>
    </div>

    <div class="section-title fade-in">💡 选科建议</div>
    <div class="q-card fade-in" id="tipsCard">
      <div class="q-text" id="tipsText"></div>
    </div>

    <div class="section-title fade-in">🎓 包含专业</div>
    <div class="major-list" id="majorList">
    </div>

    <button class="btn-primary fade-in" onclick="location.href='result.html'">返回测评结果</button>
  </div>

  <div class="modal-mask" id="majorModal" onclick="closeMajorModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-close" onclick="closeMajorModal()">✕</div>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab-item" onclick="location.href='../index.html'"><span class="tab-icon">🧭</span>测评</div>
    <div class="tab-item active" onclick="location.href='result.html'"><span class="tab-icon">🎯</span>结果</div>
  </div>
</div>
</body>
</html>
