<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Grass Block - Minecraft Style -->
  <!-- Dirt body -->
  <rect x="2" y="2" width="28" height="28" fill="#8B5A2B" rx="0"/>
  <!-- Grass top -->
  <rect x="2" y="2" width="28" height="10" fill="#5D8A3C" rx="0"/>
  <!-- Grass highlights -->
  <rect x="2" y="2" width="4" height="4" fill="#7CB342" opacity="0.6"/>
  <rect x="10" y="2" width="6" height="4" fill="#7CB342" opacity="0.6"/>
  <rect x="22" y="2" width="4" height="4" fill="#7CB342" opacity="0.6"/>
  <rect x="6" y="6" width="4" height="6" fill="#7CB342" opacity="0.4"/>
  <rect x="18" y="6" width="4" height="6" fill="#7CB342" opacity="0.4"/>
  <!-- Dirt texture -->
  <rect x="6" y="14" width="4" height="4" fill="#6B4226" opacity="0.5"/>
  <rect x="18" y="18" width="4" height="4" fill="#6B4226" opacity="0.5"/>
  <rect x="10" y="22" width="4" height="4" fill="#6B4226" opacity="0.5"/>
  <rect x="24" y="14" width="4" height="4" fill="#6B4226" opacity="0.5"/>
  <!-- Border -->
  <rect x="2" y="2" width="28" height="28" fill="none" stroke="#4A3728" stroke-width="1.5" rx="0"/>
</svg>