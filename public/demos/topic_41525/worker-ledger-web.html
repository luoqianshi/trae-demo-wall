// ==================== UTILS ====================
function fmtDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function fmtDateCN(d){
  const weekdays=['日','一','二','三','四','五','六'];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 星期${weekdays[d.getDay()]}`;
}
function randItem(arr){return arr[Math.floor(Math.random()*arr.length)]}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}
function getStorageKey(dateStr){return 'worker_ledger_'+dateStr}
function loadRecord(dateStr){
  try{return JSON.parse(localStorage.getItem(getStorageKey(dateStr)))||null}catch(e){return null}
}
function saveRecordToStorage(dateStr,data){
  localStorage.setItem(getStorageKey(dateStr),JSON.stringify(data));
}

  for(const r of RANKS){
    if(r.isZero && net===0) return r;
    if(r.isNeg && net<0 && net>=r.min) return r;
    if(!r.isZero && !r.isNeg && net>=r.min) return r;
  }
  return RANKS[RANKS.length-1];
}

// ==================== TODAY PAGE ====================
function initTodayPage(){
  const picker=document.getElementById('date-picker');
  picker.value=fmtDate(currentDate);
  picker.addEventListener('change',function(){
    currentDate=new Date(this.value+'T00:00:00');
    loadDayData();
  });
  loadDayData();
  renderQuote();
}

function loadDayData(){
  const dateStr=fmtDate(currentDate);
  document.getElementById('today-date').textContent=fmtDateCN(currentDate);
  const rec=loadRecord(dateStr);
  selectedItems=rec?rec.items:[];
  feedbackList=rec?(rec.feedback||[]):[];
  currentType='heal';
  currentCat='all';
  renderSegControl();
  renderCapsules();
  renderItems();
  updateSettlement();
  renderFeedback();
}

function renderQuote(){
  document.getElementById('today-quote').textContent='"'+randItem(ALL_QUOTES)+'"';
}

function renderSegControl(){
  document.querySelectorAll('#seg-control .seg-item').forEach(el=>{
    el.classList.toggle('active',el.dataset.type===currentType);
  });
}

function renderCapsules(){
  const cats=currentType==='heal'?HEAL_CATS:INJURY_CATS;
  const activeClass=currentType==='heal'?'active-heal':'active-injury';
  let html='<div class="capsule '+(currentCat==='all'?activeClass:'')+'" data-cat="all" onclick="selectCat(\'all\')">全部</div>';
  cats.forEach(c=>{
    html+='<div class="capsule '+(currentCat===c?activeClass:'')+'" data-cat="'+c+'" onclick="selectCat(\''+c+'\')">'+c+'</div>';
  });
  document.getElementById('capsule-row').innerHTML=html;
}

function renderItems(){
  const items=currentType==='heal'?HEAL_ITEMS:INJURY_ITEMS;
  const filtered=currentCat==='all'?items:items.filter(i=>i.cat===currentCat);
  const selClass=currentType==='heal'?'selected-heal':'selected-injury';
  const valClass=currentType==='heal'?'heal':'injury';
  let html='';
  filtered.forEach(item=>{
    const key=item.name;
    const isSelected=selectedItems.some(s=>s.name===key && (currentType==='heal'?s.value>0:s.value<0));
    html+='<div class="item-card '+(isSelected?selClass:'')+'" onclick="toggleItem(\''+key.replace(/'/g,"\\'")+'\')">';
    html+='<div class="item-name">'+item.name+'</div>';
    html+='<div class="item-value '+valClass+'">'+(item.value>0?'+':'')+item.value+'</div>';
    html+='</div>';
  });
  document.getElementById('item-grid').innerHTML=html;
}

function selectCat(cat){
  currentCat=cat;
  renderCapsules();
  renderItems();
}

function toggleItem(name){
  const allItems=[...HEAL_ITEMS,...INJURY_ITEMS];
  const item=allItems.find(i=>i.name===name);
  if(!item)return;
  const idx=selectedItems.findIndex(s=>s.name===name);
  if(idx>=0){
    selectedItems.splice(idx,1);
    addFeedback(name+' 已取消');
  }else{
    selectedItems.push({name:item.name,value:item.value,cat:item.cat});
    const fb=item.value>0?randItem(FEEDBACK_HEAL):randItem(FEEDBACK_INJURY);
    addFeedback(name+' → '+(item.value>0?'+':'')+item.value+' '+fb);
  }
  renderItems();
  updateSettlement();
  renderFeedback();
}

function addFeedback(text){
  feedbackList.unshift({text,time:Date.now()});
  if(feedbackList.length>10)feedbackList.pop();
}

function renderFeedback(){
  const area=document.getElementById('feedback-area');
  let html='';
  feedbackList.slice(0,5).forEach(f=>{
    html+='<div class="feedback-item">'+f.text+'</div>';
  });
  if(feedbackList.length===0){
    html+='<div class="feedback-bubble">选择项目后，这里会显示实时反馈</div>';
  }else{
    html+='<div class="feedback-bubble">"'+randItem(ALL_QUOTES)+'"</div>';
  }
  area.innerHTML=html;
}

function updateSettlement(){
  let healTotal=0,injuryTotal=0;
  selectedItems.forEach(s=>{
    if(s.value>0)healTotal+=s.value;
    else injuryTotal+=Math.abs(s.value);
  });
  const net=healTotal-injuryTotal;
  const rank=getRank(net);
  document.getElementById('settlement-rank').textContent=rank.title;
  const netEl=document.getElementById('settlement-net');
  netEl.textContent=(net>0?'+':'')+net;
  netEl.className='settlement-net '+(net>0?'positive':net<0?'negative':'zero');
  document.getElementById('metric-heal').textContent='+'+healTotal;
  document.getElementById('metric-injury').textContent='-'+injuryTotal;
  const summaryEl=document.getElementById('settlement-summary');
  if(selectedItems.length===0){
    summaryEl.textContent='还没有记录，选几个项目开始吧';
  }else{
    summaryEl.textContent=rank.desc;
  }
}

function saveRecord(){
  const dateStr=fmtDate(currentDate);
  if(selectedItems.length===0){
    showToast('还没有记录，先选几个项目吧');
    return;
  }
  saveRecordToStorage(dateStr,{items:selectedItems,feedback:feedbackList,timestamp:Date.now()});
  showToast('已存档');
}

// ==================== REPORT PAGE ====================
function showReport(){
  if(selectedItems.length===0){
    showToast('还没有记录，先选几个项目吧');
    return;
  }
  reportQuote=randItem(ALL_QUOTES);
  renderReportPage();
  drawPoster();
  document.getElementById('report-page').classList.add('active');
}

function hideReport(){
  document.getElementById('report-page').classList.remove('active');
}

function refreshReportQuote(){
  reportQuote=randItem(ALL_QUOTES);
  renderReportPage();
  drawPoster();
}

function renderReportPage(){
  let healTotal=0,injuryTotal=0;
  selectedItems.forEach(s=>{if(s.value>0)healTotal+=s.value;else injuryTotal+=Math.abs(s.value)});
  const net=healTotal-injuryTotal;
  const rank=getRank(net);
  const dateStr=fmtDateCN(currentDate);

  const summaryCard=document.getElementById('report-summary-card');
  summaryCard.innerHTML=`
    <div style="font-size:13px;color:#A1A1AA;margin-bottom:6px">${dateStr}</div>
    <div style="margin-bottom:8px"><span class="report-capsule ${net>=0?'positive':'negative'}">${net>=0?'+':''}${net}</span></div>
    <div style="font-size:16px;font-weight:700;margin-bottom:4px">${rank.title}</div>
    <div style="font-size:13px;color:#A1A1AA;line-height:1.5">${rank.desc}</div>
  `;

  // Text report
  const healItems=selectedItems.filter(s=>s.value>0);
  const injuryItems=selectedItems.filter(s=>s.value<0);
  let text=`--- 小小打工记账本 战报 ---\n`;
  text+=`日期：${dateStr}\n\n`;
  text+=`净收入：${net>=0?'+':''}${net}\n`;
  text+=`称号：${rank.title}\n\n`;
  if(healItems.length){
    text+=`【摸鱼收入 +${healTotal}】\n`;
    healItems.forEach(s=>text+=`  ${s.name} +${s.value}\n`);
    text+=`\n`;
  }
  if(injuryItems.length){
    text+=`【工伤支出 -${injuryTotal}】\n`;
    injuryItems.forEach(s=>text+=`  ${s.name} ${s.value}\n`);
    text+=`\n`;
  }
  text+=`${rank.desc}\n\n`;
  text+=`"${reportQuote}"\n\n`;
  text+=`来自：小小打工记账本`;
  document.getElementById('report-text').textContent=text;
}

function drawPoster(){
  const canvas=document.getElementById('poster-canvas');
  const ctx=canvas.getContext('2d');
  const W=640,H=980;
  canvas.width=W;canvas.height=H;

  let healTotal=0,injuryTotal=0;
  selectedItems.forEach(s=>{if(s.value>0)healTotal+=s.value;else injuryTotal+=Math.abs(s.value)});
  const net=healTotal-injuryTotal;
  const rank=getRank(net);
  const dateStr=fmtDateCN(currentDate);
  const healItems=selectedItems.filter(s=>s.value>0);
  const injuryItems=selectedItems.filter(s=>s.value<0);
  const topHeal=healItems.sort((a,b)=>b.value-a.value)[0];
  const topInjury=injuryItems.sort((a,b)=>a.value-b.value)[0];

  // Background
  ctx.fillStyle='#ECECEC';
  ctx.fillRect(0,0,W,H);

  // Top white block
  ctx.fillStyle='rgba(255,255,255,0.52)';
  roundRect(ctx,30,30,W-60,140,20);
  ctx.fill();

  // Date
  ctx.fillStyle='#666';
  ctx.font='24px Inter, PingFang SC, sans-serif';
  ctx.textAlign='center';
  ctx.fillText(dateStr,W/2,80);

  // Net value
  ctx.fillStyle=net>=0?'#007641':'#E63946';
  ctx.font='bold 72px Inter, sans-serif';
  ctx.fillText((net>=0?'+':'')+net,W/2,155);

  // Summary line
  ctx.fillStyle='#666';
  ctx.font='22px PingFang SC, sans-serif';
  ctx.fillText('摸鱼收入 +'+healTotal+'  |  工伤支出 -'+injuryTotal,W/2,210);

  // Dark card
  const cardY=240;
  const cardH=H-cardY-80;
  ctx.fillStyle='#121212';
  roundRect(ctx,30,cardY,W-60,cardH,20);
  ctx.fill();

  let y=cardY+50;

  // Rank title
  ctx.fillStyle='#FFFFFF';
  ctx.font='bold 32px PingFang SC, sans-serif';
  ctx.fillText(rank.title,W/2,y);
  y+=50;

  // Quote
  ctx.fillStyle='#A1A1AA';
  ctx.font='22px PingFang SC, sans-serif';
  wrapText(ctx,'"'+reportQuote+'"',W/2,y,W-120,30);
  y+=70;

  // Top heal
  if(topHeal){
    ctx.fillStyle='#4ADE80';
    ctx.font='bold 26px PingFang SC, sans-serif';
    ctx.fillText('Top 回血: '+topHeal.name+' (+'+topHeal.value+')',W/2,y);
    y+=45;
  }

  // Top injury
  if(topInjury){
    ctx.fillStyle='#E63946';
    ctx.font='bold 26px PingFang SC, sans-serif';
    ctx.fillText('Top 工伤: '+topInjury.name+' ('+topInjury.value+')',W/2,y);
    y+=45;
  }

  // Summary desc
  ctx.fillStyle='#A1A1AA';
  ctx.font='22px PingFang SC, sans-serif';
  wrapText(ctx,rank.desc,W/2,y,W-120,30);
  y+=70;

  // Items list
  ctx.font='20px PingFang SC, sans-serif';
  const allShow=[...healItems.slice(0,5),...injuryItems.slice(0,5)];
  allShow.forEach(item=>{
    if(y>cardY+cardH-60)return;
    ctx.fillStyle=item.value>0?'#4ADE80':'#E63946';
    ctx.fillText(item.name+' '+(item.value>0?'+':'')+item.value,W/2,y);
    y+=30;
  });

  // Footer
  ctx.fillStyle='#666';
  ctx.font='20px PingFang SC, sans-serif';
  ctx.fillText('来自：小小打工记账本',W/2,H-40);
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function wrapText(ctx,text,x,y,maxW,lineH){
  const chars=text.split('');
  let line='';
  let curY=y;
  for(let i=0;i<chars.length;i++){
    const test=line+chars[i];
    if(ctx.measureText(test).width>maxW && line.length>0){
      ctx.fillText(line,x,curY);
      line=chars[i];
      curY+=lineH;
    }else{
      line=test;
    }
  }
  ctx.fillText(line,x,curY);
}

function savePosterImage(){
  const canvas=document.getElementById('poster-canvas');
  const link=document.createElement('a');
  link.download='worker-ledger-'+fmtDate(currentDate)+'.png';
  link.href=canvas.toDataURL('image/png');
  link.click();
  showToast('图片已保存');
}

function copyReportText(){
  const text=document.getElementById('report-text').textContent;
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(()=>showToast('已复制到剪贴板')).catch(()=>showToast('复制失败'));
  }else{
    showToast('浏览器不支持复制');
  }
}

// ==================== CALENDAR PAGE ====================
function initCalendarPage(){
  renderCalendar();
  renderMonthSummary();
  renderTrend();
}

function changeMonth(dir){
  calMonth+=dir;
  if(calMonth>11){calMonth=0;calYear++}
  if(calMonth<0){calMonth=11;calYear--}
  renderCalendar();
  renderMonthSummary();
  renderTrend();
}

function renderCalendar(){
  document.getElementById('cal-month-label').textContent=calYear+'年'+(calMonth+1)+'月';
  const firstDay=new Date(calYear,calMonth,1).getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const todayStr=fmtDate(new Date());
  let html='';
  for(let i=0;i<firstDay;i++)html+='<div class="cal-day empty"></div>';
  for(let d=1;d<=daysInMonth;d++){
    const dateStr=calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const rec=loadRecord(dateStr);
    const isToday=dateStr===todayStr;
    let cls='cal-day';
    let style='';
    let dotHtml='';
    if(isToday)cls+=' today';
    if(rec){
      cls+=' has-record';
      let heal=0,inj=0;
      rec.items.forEach(s=>{if(s.value>0)heal+=s.value;else inj+=Math.abs(s.value)});
      const net=heal-inj;
      if(net>0){style='background:rgba(0,118,65,0.15);color:#007641;'}
      else if(net<0){style='background:rgba(230,57,70,0.15);color:#E63946;'}
      else{style='background:rgba(161,161,170,0.15);color:#A1A1AA;'}
      dotHtml='<div class="cal-dot" style="background:'+(net>=0?'#007641':'#E63946')+'"></div>';
    }
    html+='<div class="'+cls+'" style="'+style+'" onclick="showDateDetail(\''+dateStr+'\')">'+d+dotHtml+'</div>';
  }
  document.getElementById('cal-days').innerHTML=html;
}

function renderMonthSummary(){
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  let totalNet=0,recordDays=0,catCount={},worstDay={net:Infinity,date:''},bestDay={net:-Infinity,date:''};
  for(let d=1;d<=daysInMonth;d++){
    const dateStr=calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const rec=loadRecord(dateStr);
    if(!rec)continue;
    recordDays++;
    let heal=0,inj=0;
    rec.items.forEach(s=>{
      if(s.value>0){heal+=s.value;catCount[s.cat]=(catCount[s.cat]||0)+1}
      else{inj+=Math.abs(s.value);catCount[s.cat]=(catCount[s.cat]||0)+1}
    });
    const net=heal-inj;
    totalNet+=net;
    if(net<worstDay.net){worstDay={net,date:dateStr}}
    if(net>bestDay.net){bestDay={net,date:dateStr}}
  }
  const sortedCats=Object.entries(catCount).sort((a,b)=>b[1]-a[1]);
  const topCat=sortedCats[0]?sortedCats[0][0]:'暂无';
  const netColor=totalNet>=0?'green':'red';
  let html=`
    <div style="font-size:14px;color:#A1A1AA;margin-bottom:10px">本月小结</div>
    <div class="month-stat-row">
      <div class="month-stat"><div class="month-stat-label">净收入</div><div class="month-stat-value ${netColor}">${totalNet>=0?'+':''}${totalNet}</div></div>
      <div class="month-stat"><div class="month-stat-label">记录天数</div><div class="month-stat-value">${recordDays}</div></div>
    </div>
    <div class="month-detail">
      最常记录：<strong>${topCat}</strong><br>
  `;
  if(worstDay.date){
    html+=`最惨一天：<strong>${worstDay.date} (${worstDay.net>=0?'+':''}${worstDay.net})</strong><br>`;
  }
  if(bestDay.date){
    html+=`最佳生存日：<strong>${bestDay.date} (${bestDay.net>=0?'+':''}${bestDay.net})</strong>`;
  }
  html+='</div>';
  document.getElementById('month-summary-card').innerHTML=html;
}

function renderTrend(){
  const today=new Date();
  let html='';
  let maxAbs=1;
  const data=[];
  for(let i=6;i>=0;i--){
    const d=new Date(today);
    d.setDate(d.getDate()-i);
    const dateStr=fmtDate(d);
    const rec=loadRecord(dateStr);
    let net=0;
    if(rec){
      rec.items.forEach(s=>{if(s.value>0)net+=s.value;else net+=s.value});
    }
    data.push({date:d.getDate(),net});
    if(Math.abs(net)>maxAbs)maxAbs=Math.abs(net);
  }
  data.forEach(d=>{
    const pct=Math.abs(d.net)/maxAbs*100;
    const isPos=d.net>=0;
    html+=`<div class="trend-bar-row">
      <div class="trend-bar-label">${d.date}日</div>
      <div class="trend-bar-track"><div class="trend-bar-fill ${isPos?'positive':'negative'}" style="width:${Math.max(pct,2)}%"></div></div>
      <div class="trend-bar-value">${d.net>=0?'+':''}${d.net}</div>
    </div>`;
  });
  document.getElementById('trend-bars').innerHTML=html;
}

function showDateDetail(dateStr){
  const rec=loadRecord(dateStr);
  if(!rec){showToast('该日无记录');return}
  let heal=0,inj=0;
  const healList=[],injList=[];
  rec.items.forEach(s=>{
    if(s.value>0){heal+=s.value;healList.push(s)}
    else{inj+=Math.abs(s.value);injList.push(s)}
  });
  const net=heal-inj;
  const rank=getRank(net);
  let html=`<div style="font-size:16px;font-weight:700;margin-bottom:12px">${dateStr}</div>`;
  html+=`<div style="font-size:28px;font-weight:800;color:${net>=0?'#007641':net<0?'#E63946':'#A1A1AA'};margin-bottom:4px">${net>=0?'+':''}${net}</div>`;
  html+=`<div style="font-size:14px;color:#666;margin-bottom:12px">${rank.title} - ${rank.desc}</div>`;
  if(healList.length){
    html+=`<div style="font-size:13px;font-weight:600;color:#007641;margin-bottom:6px">摸鱼收入 +${heal}</div>`;
    healList.forEach(s=>html+=`<div style="font-size:13px;color:#666;margin-bottom:2px">${s.name} +${s.value}</div>`);
  }
  if(injList.length){
    html+=`<div style="font-size:13px;font-weight:600;color:#E63946;margin:8px 0 6px">工伤支出 -${inj}</div>`;
    injList.forEach(s=>html+=`<div style="font-size:13px;color:#666;margin-bottom:2px">${s.name} ${s.value}</div>`);
  }
  document.getElementById('date-modal-body').innerHTML=html;
  document.getElementById('date-modal').classList.add('active');
}

function closeDateModal(e){
  if(e&&e.target&&e.target!==document.getElementById('date-modal'))return;
  document.getElementById('date-modal').classList.remove('active');
}

// ==================== TAB SWITCH ====================
function switchTab(tab){
  document.querySelectorAll('.tab-item').forEach(el=>el.classList.toggle('active',el.dataset.tab===tab));
  document.querySelectorAll('.page').forEach(el=>el.classList.remove('active'));
  document.getElementById('page-'+tab).classList.add('active');
  if(tab==='calendar'){
    calYear=currentDate.getFullYear();
    calMonth=currentDate.getMonth();
    renderCalendar();
    renderMonthSummary();
    renderTrend();
  }
}

// ==================== SEG CONTROL EVENTS ====================
document.querySelectorAll('#seg-control .seg-item').forEach(el=>{
  el.addEventListener('click',function(){
    currentType=this.dataset.type;
    currentCat='all';
    renderSegControl();
    renderCapsules();
    renderItems();
    const guidance=document.getElementById('guidance');
    guidance.textContent=currentType==='heal'?'点击下方项目记录你的回血时刻':'点击下方项目记录今天的工伤';
  });
});

// ==================== INIT ====================
initTodayPage();
initCalendarPage();
</script>
