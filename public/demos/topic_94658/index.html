<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>小管家 - H5 Demo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <!-- 登录页 -->
    <div id="page-login" class="page active">
      <div class="login-page">
        <div class="logo">📋</div>
        <div class="login-title">小管家</div>
        <div class="login-subtitle">让生活井井有条</div>
        <div class="features">
          <div class="feature">📦 管理物品 · 到期提醒 + 位置备忘</div>
          <div class="feature">💎 追踪订阅 · 续费提醒 + 账单统计</div>
          <div class="feature">🔔 一目了然 · 提醒中心统一查看</div>
        </div>
        <button id="login-btn" class="login-btn">微信一键登录</button>
        <div class="login-tip">登录后我们将获取你的微信昵称和头像用于显示</div>
      </div>
    </div>

    <!-- 提醒页 -->
    <div id="page-remind" class="page">
      <div class="page-container">
        <div class="topbar" id="topbar-remind">
          <div class="topbar-status"></div>
          <div class="topbar-content">
            <div class="topbar-left">
              <div class="topbar-title">小管家</div>
              <div class="topbar-subtitle">让生活井井有条</div>
            </div>
          </div>
        </div>
        <div id="remind-content"></div>
        <div class="fab" data-page="remind">+</div>
      </div>
    </div>

    <!-- 物品柜页 -->
    <div id="page-items" class="page">
      <div class="page-container">
        <div class="topbar" id="topbar-items">
          <div class="topbar-status"></div>
          <div class="topbar-content">
            <div class="topbar-left">
              <div class="topbar-title">物品柜</div>
              <div class="topbar-subtitle">管理你的实体物品</div>
            </div>
          </div>
        </div>
        <div id="items-content"></div>
        <div class="fab" data-page="items">+</div>
      </div>
    </div>

    <!-- 订阅中心页 -->
    <div id="page-subs" class="page">
      <div class="page-container">
        <div class="topbar" id="topbar-subs">
          <div class="topbar-status"></div>
          <div class="topbar-content">
            <div class="topbar-left">
              <div class="topbar-title">订阅中心</div>
              <div class="topbar-subtitle">追踪每一笔订阅</div>
            </div>
          </div>
        </div>
        <div id="subs-content"></div>
        <div class="fab" data-page="subs">+</div>
      </div>
    </div>

    <!-- 我的页 -->
    <div id="page-me" class="page">
      <div class="page-container">
        <div class="topbar" id="topbar-me">
          <div class="topbar-status"></div>
          <div class="topbar-content">
            <div class="topbar-left">
              <div class="topbar-title">我的</div>
              <div class="topbar-subtitle">数据 & 设置</div>
            </div>
          </div>
        </div>
        <div id="me-content"></div>
      </div>
    </div>

    <!-- 关于页 -->
    <div id="page-about" class="page">
      <div class="page-container">
        <div class="topbar" id="topbar-about">
          <div class="topbar-status"></div>
          <div class="topbar-content">
            <div class="topbar-back" id="about-back">‹</div>
            <div class="topbar-left">
              <div class="topbar-title">关于小管家</div>
            </div>
          </div>
        </div>
        <div id="about-content"></div>
      </div>
    </div>

    <!-- 底部 TabBar -->
    <div class="tabbar" id="tabbar">
      <div class="tab-item" data-page="remind">
        <img class="tab-icon" src="static/tabbar/remind.png" alt="提醒">
        <span class="tab-text">提醒</span>
      </div>
      <div class="tab-item" data-page="items">
        <img class="tab-icon" src="static/tabbar/items.png" alt="物品">
        <span class="tab-text">物品</span>
      </div>
      <div class="tab-item" data-page="subs">
        <img class="tab-icon" src="static/tabbar/subs.png" alt="订阅">
        <span class="tab-text">订阅</span>
      </div>
      <div class="tab-item" data-page="me">
        <img class="tab-icon" src="static/tabbar/me.png" alt="我的">
        <span class="tab-text">我的</span>
      </div>
    </div>

    <!-- Sheet 抽屉 -->
    <div class="overlay" id="sheet-overlay"></div>
    <div class="sheet" id="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div class="sheet-title" id="sheet-title">标题</div>
        <div class="sheet-close" id="sheet-close">×</div>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
      <div class="sheet-footer" id="sheet-footer"></div>
    </div>

    <!-- ActionSheet -->
    <div class="overlay" id="action-overlay"></div>
    <div class="action-sheet" id="action-sheet">
      <div id="action-items"></div>
      <div class="action-item" id="action-cancel">取消</div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
