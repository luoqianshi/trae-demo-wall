<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>证据侦探社 — 初赛Demo</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-primary:#0f1724;--bg-secondary:#162033;--bg-card:#1a2740;--bg-card-hover:#1f3050;
  --gold:#f0a830;--gold-dim:#c4882a;--teal:#2dd4bf;--teal-dim:#1a9e8f;
  --red:#f87171;--blue:#60a5fa;--purple:#a78bfa;--green:#4ade80;
  --text:#e0e6ed;--text-sec:#94a3b8;--text-muted:#64748b;
  --border:#2a3a55;--radius:12px;--radius-sm:8px;
  --shadow:0 4px 24px rgba(0,0,0,.3);
}
html{scroll-behavior:smooth;font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg-primary);color:var(--text);line-height:1.7;overflow-x:hidden;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
.hidden{display:none!important}

/* ===== TOP BAR ===== */
.topbar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(15,23,36,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;transform:translateY(-100%);transition:transform .3s}
.topbar.visible{transform:translateY(0)}
.topbar-logo{font-size:.95rem;font-weight:700;color:var(--gold);display:flex;align-items:center;gap:6px}
.topbar-case{font-size:.82rem;color:var(--text-sec)}
.topbar-progress{display:flex;gap:6px;align-items:center}
.prog-dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:all .3s}
.prog-dot.active{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.prog-dot.done{background:var(--teal)}

/* ===== APP ===== */
#app{max-width:760px;margin:0 auto;padding:80px 20px 60px;min-height:100vh;position:relative;z-index:2}

/* ===== BUTTONS ===== */
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border-radius:var(--radius);font-size:1rem;font-weight:600;transition:all .3s}
.btn-primary{background:var(--gold);color:var(--bg-primary)}
.btn-primary:hover{background:#f5b942;transform:translateY(-2px);box-shadow:0 0 20px rgba(240,168,48,.3)}
.btn-secondary{background:transparent;color:var(--teal);border:1.5px solid var(--teal)}
.btn-secondary:hover{background:rgba(45,212,191,.1);transform:translateY(-2px)}
.btn-small{padding:8px 18px;font-size:.88rem;border-radius:var(--radius-sm)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
.btn-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}

/* ===== SECTION HEADERS ===== */
.section-h{font-size:1.4rem;font-weight:700;color:var(--gold);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.section-h .icon{width:32px;height:32px;background:var(--gold);color:var(--bg-primary);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:800;flex-shrink:0}
.section-d{color:var(--text-sec);font-size:.95rem;margin-bottom:24px}

/* ===== INTRO ===== */
.intro{text-align:center;padding:40px 0}
.intro-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;background:rgba(240,168,48,.1);border:1px solid rgba(240,168,48,.25);border-radius:20px;font-size:.8rem;color:var(--gold);margin-bottom:24px}
.intro-title{font-size:2.2rem;font-weight:800;color:#fff;margin-bottom:12px}
.intro-title .hl{color:var(--gold)}
.intro-case-title{font-size:1.3rem;color:var(--teal);margin-bottom:20px;font-weight:600}
.intro-narrative{font-size:1rem;color:var(--text-sec);max-width:520px;margin:0 auto 28px;line-height:1.8}
.intro-claim-box{background:var(--bg-card);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:0 var(--radius) var(--radius) 0;padding:20px 24px;margin:0 auto 12px;max-width:520px;text-align:left}
.intro-claim-box .label{font-size:.75rem;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.intro-claim-box .text{font-size:1.1rem;color:#fff;font-style:italic}
.intro-claim-context{font-size:.82rem;color:var(--text-muted);margin-bottom:24px}
.intro-brief{font-size:.92rem;color:var(--text-sec);max-width:480px;margin:0 auto 28px;padding:16px;background:rgba(45,212,191,.05);border-radius:var(--radius);border:1px dashed var(--teal-dim)}

/* ===== DECOMPOSE - DASHBOARD ===== */
.decompose-claim{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px;text-align:center;position:relative;overflow:hidden}
.decompose-claim::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--teal),var(--gold))}
.decompose-claim .text{font-size:1.15rem;color:#fff;line-height:1.8}
.decompose-prompt{background:rgba(167,139,250,.08);border:1px dashed var(--purple);border-radius:var(--radius);padding:16px 20px;margin-bottom:20px}
.decompose-prompt .title{color:var(--purple);font-size:.9rem;font-weight:600;margin-bottom:6px}
.decompose-prompt .text{color:var(--text-sec);font-size:.9rem}

/* Dashboard chain board */
.dash-board{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);padding:24px 20px;margin:20px 0;position:relative;overflow:hidden}
.dash-board::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--teal),var(--gold))}
.dash-board::after{content:'CHAIN BOARD';position:absolute;top:8px;right:12px;font-size:.55rem;letter-spacing:2px;color:var(--text-muted);opacity:.5}
.dash-rings{display:flex;flex-direction:column;gap:0;position:relative;z-index:1}
.dash-ring{display:flex;align-items:center;gap:14px;padding:14px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:-1px;position:relative;opacity:0;transform:translateX(-30px) scale(.95);transition:all .6s cubic-bezier(.2,.8,.3,1)}
.dash-ring.show{opacity:1;transform:translateX(0) scale(1)}
.dash-ring::after{content:'';position:absolute;left:28px;bottom:-10px;width:2px;height:10px;background:var(--border)}
.dash-ring:last-child::after{display:none}
.dash-ring-num{flex-shrink:0;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;color:#fff;box-shadow:0 0 8px rgba(0,0,0,.3)}
.dash-ring-content{flex:1}
.dash-ring-content .label{font-weight:600;color:#fff;font-size:.92rem;margin-bottom:2px}
.dash-ring-content .desc{font-size:.78rem;color:var(--text-sec)}
.dash-ring-glow{position:absolute;inset:0;border-radius:var(--radius-sm);pointer-events:none;opacity:0;transition:opacity .4s}
.dash-ring.show .dash-ring-glow{opacity:.1;animation:ringGlow 2s ease-in-out infinite}
@keyframes ringGlow{0%,100%{box-shadow:inset 0 0 0 rgba(240,168,48,0)}50%{box-shadow:inset 0 0 20px rgba(240,168,48,.3)}}

/* ===== EVIDENCE HUB - CARD SHOWCASE ===== */
.evidence-showcase{padding:10px 0}
.evidence-deck{display:flex;justify-content:center;align-items:flex-end;gap:0;height:340px;margin:30px auto;max-width:600px;perspective:1000px;position:relative}
.ev-deck-card{width:160px;height:280px;position:absolute;cursor:pointer;transition:all .5s cubic-bezier(.2,.8,.3,1);transform-style:preserve-3d;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-card);padding:16px;display:flex;flex-direction:column;box-shadow:0 8px 24px rgba(0,0,0,.4);left:50%}
.ev-deck-card-inner{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.2,.8,.3,1);transform-style:preserve-3d}
.ev-deck-card.flipped .ev-deck-card-inner{transform:rotateY(180deg)}
.ev-deck-front,.ev-deck-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;overflow:hidden}
.ev-deck-front{background:linear-gradient(180deg,var(--bg-card),var(--bg-secondary))}
.ev-deck-back{background:var(--bg-secondary);transform:rotateY(180deg)}
.classified-stripe{position:absolute;top:0;right:0;width:24px;height:100%;background:repeating-linear-gradient(-45deg,transparent,transparent 4px,rgba(248,113,113,.1) 4px,rgba(248,113,113,.1) 8px);pointer-events:none;border-radius:0 var(--radius) var(--radius) 0}
.ev-type{font-size:.68rem;font-weight:600;padding:2px 8px;border-radius:4px;width:fit-content;margin-bottom:8px}
.ev-type-commercial{background:rgba(240,168,48,.15);color:var(--gold)}
.ev-type-anecdote{background:rgba(45,212,191,.15);color:var(--teal)}
.ev-type-weak{background:rgba(248,113,113,.15);color:var(--red)}
.ev-type-study{background:rgba(96,165,250,.15);color:var(--blue)}
.ev-deck-front h4{color:#fff;font-size:.85rem;margin-bottom:4px;flex:1}
.ev-deck-front .preview{font-size:.76rem;color:var(--text-sec);flex:1;overflow:hidden}
.ev-quality{display:flex;gap:3px;margin-top:6px}
.q-dot{width:6px;height:6px;border-radius:50%;background:var(--border)}
.q-dot.on{background:var(--gold)}
.ev-flip-hint{text-align:center;font-size:.65rem;color:var(--text-muted);margin-top:4px}
.ev-deck-back .note-label{font-size:.7rem;color:var(--gold);font-weight:600;margin-bottom:6px}
.ev-deck-back .note-analysis{font-size:.74rem;color:var(--text-sec);margin-bottom:6px;line-height:1.5}
.ev-deck-back .note-questions{font-size:.72rem;color:var(--text-sec);margin-bottom:4px;list-style:none}
.ev-deck-back .note-questions li{margin-bottom:2px;padding-left:10px;position:relative}
.ev-deck-back .note-questions li::before{content:'?';position:absolute;left:0;color:var(--gold)}
.ev-deck-back .note-warning{font-size:.7rem;color:var(--red);padding:6px 8px;background:rgba(248,113,113,.08);border-radius:var(--radius-sm);margin-top:auto}

/* Card hover effects */
.ev-deck-card:hover{transform:translateY(-20px) scale(1.05);z-index:10!important;box-shadow:0 16px 40px rgba(0,0,0,.5),0 0 20px rgba(240,168,48,.15)}
.ev-deck-card.active{z-index:50!important;transform:translateY(-30px) scale(1.1);box-shadow:0 20px 50px rgba(0,0,0,.5),0 0 30px rgba(240,168,48,.2)}

.evidence-count{font-size:.85rem;color:var(--text-sec);text-align:center;margin-top:16px}
.evidence-count .num{color:var(--teal);font-weight:700;font-size:1rem}

/* ===== EVIDENCE MODAL (zoom to center) ===== */
.ev-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:300;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .3s}
.ev-modal-overlay.show{opacity:1;pointer-events:auto}
.ev-modal-card{width:380px;max-width:90vw;height:560px;max-height:85vh;position:relative;perspective:1200px;transform:scale(.7);transition:transform .4s cubic-bezier(.2,.8,.3,1)}
.ev-modal-overlay.show .ev-modal-card{transform:scale(1)}
.ev-modal-inner{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.2,.8,.3,1);transform-style:preserve-3d}
.ev-modal-inner.flipped{transform:rotateY(180deg)}
.ev-modal-front,.ev-modal-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:var(--radius);padding:28px 24px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.6),0 0 40px rgba(240,168,48,.15)}
.ev-modal-front{background:linear-gradient(180deg,var(--bg-card),var(--bg-secondary));border:2px solid var(--gold)}
.ev-modal-back{background:var(--bg-secondary);border:2px solid var(--teal);transform:rotateY(180deg)}
.ev-modal-front .classified-stripe{width:32px}
.ev-modal-front .ev-type{font-size:.85rem;padding:4px 12px;margin-bottom:16px}
.ev-modal-front h4{color:#fff;font-size:1.3rem;margin-bottom:12px;flex:1;line-height:1.4}
.ev-modal-front .preview{font-size:1.05rem;color:var(--text-sec);flex:2;overflow:hidden;line-height:1.6}
.ev-modal-front .ev-quality{margin-top:16px}
.ev-modal-front .ev-quality .q-dot{width:10px;height:10px}
.ev-modal-front .ev-flip-hint{font-size:.85rem;margin-top:12px;color:var(--gold)}
.ev-modal-back .note-label{font-size:1.1rem;margin-bottom:14px}
.ev-modal-back .note-analysis{font-size:1rem;color:var(--text-sec);margin-bottom:16px;line-height:1.7}
.ev-modal-back .note-questions{font-size:.95rem;list-style:none;margin-bottom:12px}
.ev-modal-back .note-questions li{margin-bottom:8px;padding-left:16px;position:relative;color:var(--text);line-height:1.6}
.ev-modal-back .note-questions li::before{content:'?';font-size:1rem;left:0}
.ev-modal-back .note-warning{font-size:.9rem;padding:10px 14px;margin-top:auto;line-height:1.6}
.ev-modal-close{position:absolute;top:-44px;right:0;width:36px;height:36px;border-radius:50%;background:var(--bg-card);border:1px solid var(--border);color:var(--text);font-size:1.2rem;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;z-index:5}
.ev-modal-close:hover{border-color:var(--red);color:var(--red);transform:rotate(90deg)}
.ev-modal-flip-btn{position:absolute;bottom:-48px;left:50%;transform:translateX(-50%);padding:10px 24px;border-radius:var(--radius);background:var(--gold);color:var(--bg-primary);font-size:.9rem;font-weight:600;cursor:pointer;border:none;transition:all .2s;white-space:nowrap}
.ev-modal-flip-btn:hover{background:#f5b942;transform:translateX(-50%) translateY(-2px);box-shadow:0 4px 16px rgba(240,168,48,.3)}

/* ===== CHAIN BUILDER - DASHBOARD ===== */
.cb-dashboard{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin:16px 0;position:relative;overflow:hidden}
.cb-dashboard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--teal),var(--gold))}
.cb-dashboard::after{content:'EVIDENCE DASHBOARD';position:absolute;top:8px;right:12px;font-size:.55rem;letter-spacing:2px;color:var(--text-muted);opacity:.5}

/* Current ring spotlight */
.cb-spotlight{background:var(--bg-card);border:2px solid var(--gold);border-radius:var(--radius);padding:20px;margin-bottom:16px;position:relative;box-shadow:0 0 30px rgba(240,168,48,.1);min-height:120px}
.cb-spotlight::before{content:'';position:absolute;top:-1px;left:-1px;right:-1px;height:4px;background:var(--gold);border-radius:var(--radius) var(--radius) 0 0}
.cb-spotlight-label{font-size:.72rem;color:var(--gold);text-transform:uppercase;letter-spacing:2px;margin-bottom:6px}
.cb-spotlight-title{font-size:1.1rem;font-weight:700;color:#fff;margin-bottom:4px}
.cb-spotlight-desc{font-size:.85rem;color:var(--text-sec)}
.cb-spotlight-status{margin-top:10px;font-size:.82rem;padding:6px 12px;border-radius:var(--radius-sm);display:inline-block}
.cb-spotlight-status.empty{background:rgba(100,116,139,.15);color:var(--text-muted)}
.cb-spotlight-status.placed{background:rgba(96,165,250,.12);color:var(--blue)}
.cb-spotlight-status.ok{background:rgba(74,222,128,.12);color:var(--green)}
.cb-spotlight-status.bad{background:rgba(248,113,113,.12);color:var(--red)}
.cb-spotlight-status.gap{background:rgba(248,113,113,.1);color:var(--red)}

/* Probe in spotlight */
.cb-probe{margin-top:12px;padding:12px 14px;background:rgba(248,113,113,.06);border-left:3px solid var(--red);border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-size:.82rem;color:var(--text-sec);line-height:1.6;animation:probeIn .4s ease}
@keyframes probeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.cb-probe .ack{color:var(--text);margin-bottom:3px}
.cb-probe .gap{color:var(--red);font-weight:500;margin-bottom:3px}
.cb-probe .q{color:var(--gold);font-style:italic}

/* Mini chain progress bar */
.cb-progress-bar{display:flex;align-items:center;gap:2px;margin-bottom:16px;padding:8px 0}
.cb-prog-ring{flex:1;height:6px;border-radius:3px;background:var(--border);transition:all .4s;position:relative;cursor:pointer}
.cb-prog-ring.active{background:var(--gold);box-shadow:0 0 8px rgba(240,168,48,.4)}
.cb-prog-ring.covered{background:var(--green)}
.cb-prog-ring.wrong{background:var(--red)}
.cb-prog-ring.uncovered{background:var(--red);opacity:.5;animation:pulseDot 2s infinite}
@keyframes pulseDot{0%,100%{opacity:.5}50%{opacity:1}}
.cb-prog-label{font-size:.6rem;color:var(--text-muted);text-align:center;margin-top:2px;position:absolute;top:10px;left:50%;transform:translateX(-50%);white-space:nowrap;display:none}
.cb-prog-ring:hover .cb-prog-label{display:block}

/* Ring navigation */
.cb-ring-nav{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.cb-nav-btn{flex:1;min-width:40px;padding:8px 4px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-card);color:var(--text-sec);font-size:.72rem;cursor:pointer;transition:all .2s;text-align:center;position:relative}
.cb-nav-btn:hover{border-color:var(--gold);color:var(--gold)}
.cb-nav-btn.active{border-color:var(--gold);background:rgba(240,168,48,.1);color:var(--gold);font-weight:600}
.cb-nav-btn.covered{border-color:var(--green);color:var(--green)}
.cb-nav-btn.wrong{border-color:var(--red);color:var(--red)}
.cb-nav-btn.uncovered{border-color:var(--red);color:var(--red);opacity:.6}
.cb-nav-btn .nav-num{display:block;font-size:.9rem;font-weight:700;margin-bottom:2px}
.cb-nav-btn .nav-label{font-size:.55rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Card dealing tray */
.cb-deal-tray{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:16px;position:relative;overflow:hidden}
.cb-deal-tray-title{font-size:.78rem;color:var(--text-sec);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.cb-deal-cards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.cb-deal-card{width:90px;padding:10px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-secondary);cursor:pointer;transition:all .3s;text-align:center;position:relative}
.cb-deal-card:hover{border-color:var(--gold);transform:translateY(-4px) scale(1.03);box-shadow:0 6px 16px rgba(0,0,0,.3)}
.cb-deal-card.selected{border-color:var(--teal);background:rgba(45,212,191,.08);box-shadow:0 0 12px rgba(45,212,191,.2)}
.cb-deal-card.used{opacity:.3;pointer-events:none}
.cb-deal-card .dc-type{font-size:.6rem;font-weight:600;padding:2px 6px;border-radius:3px;width:fit-content;margin:0 auto 4px}
.cb-deal-card .dc-label{font-size:.68rem;color:var(--text);line-height:1.3}
.cb-deal-card.dealing{animation:dealCard .5s ease}
@keyframes dealCard{from{transform:translateY(100px) rotate(10deg);opacity:0}to{transform:translateY(0) rotate(0);opacity:1}}

/* Placed card chip */
.cb-placed-chip{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;padding:4px 10px;border-radius:var(--radius-sm);background:rgba(96,165,250,.12);color:var(--blue);margin-top:6px;cursor:pointer;border:1px solid rgba(96,165,250,.2)}
.cb-placed-chip:hover{background:rgba(96,165,250,.2)}

/* Chain summary */
.cb-summary{margin-top:16px;padding:16px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);text-align:center}
.cb-summary .count{font-size:1.6rem;font-weight:800}
.cb-summary .count .ok{color:var(--green)}
.cb-summary .label{font-size:.82rem;color:var(--text-sec)}

/* ===== DIALOGUE ===== */
.dialogue-area{padding:10px 0}
.dialogue-msg{display:flex;gap:10px;margin-bottom:14px;animation:fadeInUp .4s ease}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.dialogue-avatar{flex-shrink:0;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:700}
.dialogue-avatar.ai{background:rgba(240,168,48,.15);color:var(--gold)}
.dialogue-bubble{background:var(--bg-card);border:1px solid var(--border);border-radius:0 var(--radius) var(--radius) 0;padding:12px 16px;flex:1;font-size:.92rem;color:var(--text);line-height:1.7}

/* ===== VERDICT ===== */
.verdict-area{padding:20px 0}
.verdict-options{display:flex;flex-direction:column;gap:12px;margin:16px 0}
.verdict-opt{display:flex;gap:12px;padding:16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-card);cursor:pointer;transition:all .2s;align-items:flex-start}
.verdict-opt:hover{border-color:var(--gold);transform:translateX(4px)}
.verdict-opt.selected{border-color:var(--gold);background:rgba(240,168,48,.08)}
.verdict-opt .v-icon{flex-shrink:0;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:700}
.verdict-opt .v-info{flex:1}
.verdict-opt .v-label{font-weight:600;color:#fff;font-size:.95rem;margin-bottom:2px}
.verdict-opt .v-desc{font-size:.82rem;color:var(--text-sec)}
.verdict-reason{margin-top:16px}
.verdict-reason textarea{width:100%;min-height:80px;padding:12px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:.92rem;font-family:inherit;resize:vertical}
.verdict-reason textarea:focus{border-color:var(--gold)}

/* ===== FEEDBACK ===== */
.feedback-area{padding:20px 0}
.fb-chain-viz{margin:20px 0;padding:20px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);position:relative;overflow:hidden}
.fb-chain-viz::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--teal),var(--gold))}
.fb-chain-viz-title{font-size:.78rem;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px;text-align:center}
.fb-chain-flow{display:flex;align-items:center;gap:0;flex-wrap:wrap;justify-content:center}
.fb-chain-node{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:60px;max-width:90px}
.fb-chain-node-circle{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:#fff;border:2px solid;transition:all .3s}
.fb-chain-node-circle.covered{border-color:var(--green);background:rgba(74,222,128,.15);color:var(--green)}
.fb-chain-node-circle.wrong{border-color:var(--red);background:rgba(248,113,113,.15);color:var(--red)}
.fb-chain-node-circle.uncovered{border-color:var(--red);background:rgba(248,113,113,.08);color:var(--red);opacity:.5}
.fb-chain-node-circle.placed{border-color:var(--blue);background:rgba(96,165,250,.15);color:var(--blue)}
.fb-chain-node-circle.empty{border-color:var(--border);color:var(--text-muted)}
.fb-chain-node-label{font-size:.6rem;color:var(--text-sec);text-align:center;line-height:1.2;max-width:80px}
.fb-chain-arrow{color:var(--text-muted);font-size:1rem;margin:0 2px;align-self:flex-start;margin-top:14px}
.fb-chain-arrow.broken{color:var(--red)}
.fb-chain-arrow.solid{color:var(--green)}
.fb-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;opacity:0;transform:translateY(15px);animation:fbIn .5s ease forwards}
.fb-card.strength{border-left:4px solid var(--green)}
.fb-card.improvement{border-left:4px solid var(--gold)}
.fb-card .fb-title{font-size:.92rem;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.fb-card.strength .fb-title{color:var(--green)}
.fb-card.improvement .fb-title{color:var(--gold)}
.fb-card .fb-content{font-size:.88rem;color:var(--text-sec);line-height:1.6}
@keyframes fbIn{to{opacity:1;transform:translateY(0)}}
.fb-score{text-align:center;padding:20px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:20px}
.fb-score .score-num{font-size:2.5rem;font-weight:800;color:var(--gold)}
.fb-score .score-max{font-size:1.2rem;color:var(--text-muted)}
.fb-score .score-label{font-size:.85rem;color:var(--text-sec);margin-top:4px}
.fb-closing{text-align:center;font-size:1.05rem;color:var(--teal);font-style:italic;padding:16px;max-width:480px;margin:0 auto}

/* ===== CERTIFICATE ===== */
.cert-area{padding:20px 0}

.cert::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--gold),var(--teal),var(--gold))}

.cert-header .seal{font-size:2.5rem;margin-bottom:8px}
.cert-header .title{font-size:1.2rem;font-weight:800;color:var(--gold);letter-spacing:1px}
.cert-header .case-id{font-size:.78rem;color:var(--text-muted);margin-top:4px}
.cert-body{margin-bottom:20px}
.cert-row{padding:10px 0;border-bottom:1px dashed var(--border)}
.cert-row:last-child{border-bottom:none}
.cert-row .label{font-size:.72rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}

.cert-row .value.red{color:var(--red)}

@keyframes certReveal{from{opacity:0;transform:scale(.95) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.cert-footer{text-align:center;font-size:.82rem;color:var(--text-muted)}

/* ===== TOAST ===== */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--bg-card);border:1px solid var(--gold);color:var(--text);padding:10px 20px;border-radius:var(--radius);font-size:.88rem;z-index:200;transition:transform .3s;box-shadow:var(--shadow)}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ===== ATMOSPHERE ===== */

.bg-particle{position:absolute;width:2px;height:2px;background:var(--gold);border-radius:50%;opacity:0;animation:floatUp linear infinite}

.glitch{position:relative;display:inline-block}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden}
.glitch::before{animation:glitch1 3s infinite linear alternate-reverse;clip-path:inset(0 0 70% 0);color:var(--teal);left:2px}
.glitch::after{animation:glitch2 2s infinite linear alternate-reverse;clip-path:inset(70% 0 0 0);color:var(--red);left:-2px}

@keyframes glitch2{0%,88%,100%{transform:translateX(0)}90%{transform:translateX(-3px)}93%{transform:translateX(2px)}95%{transform:translateX(-4px)}97%{transform:translateX(1px)}}
.typing-cursor::after{content:'_';animation:blink .8s infinite;color:var(--gold);margin-left:2px}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}

.verdict-stamp{width:80px;height:80px;border:3px solid;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:900;transform:rotate(-20deg);opacity:0;margin:0 auto 16px;animation:stampSeal .5s .3s cubic-bezier(.2,1,.3,1) forwards}
.verdict-stamp.v-green{border-color:var(--green);color:var(--green)}
.verdict-stamp.v-red{border-color:var(--red);color:var(--red)}
.verdict-stamp.v-gold{border-color:var(--gold);color:var(--gold)}
.verdict-stamp.v-blue{border-color:var(--blue);color:var(--blue)}
@keyframes stampSeal{0%{opacity:0;transform:rotate(-20deg) scale(2)}60%{opacity:.8;transform:rotate(-20deg) scale(.9)}100%{opacity:1;transform:rotate(-20deg) scale(1)}}

// ============================================================
//  STATE
// ============================================================
const state = {
  node: "intro",
  history: [],
  viewedCards: [],
  flippedCards: [],
  chainPlacements: {},
  selectedCard: null,
  chainChecked: false,
  currentRingIdx: 0,
  verdict: null,
  strengths: [],
  improvements: []
};

// ============================================================
//  ENGINE
// ============================================================
const NODE_ORDER = ["intro","decompose","evidence-hub","chain-builder","verdict","feedback","certificate"];

function goTo(nodeId) {
  state.history.push(state.node);
  state.node = nodeId;
  screenFlash();
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function updateProgress() {
  const idx = NODE_ORDER.indexOf(state.node);
  const container = document.getElementById("topbarProgress");
  container.innerHTML = "";
  NODE_ORDER.forEach((n, i) => {
    const dot = document.createElement("div");
    dot.className = "prog-dot";
    if (i === idx) dot.classList.add("active");
    else if (i < idx) dot.classList.add("done");
    container.appendChild(dot);
  });
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 2200);
}

// ============================================================
//  RENDER DISPATCHER
// ============================================================
function render() {
  const app = document.getElementById("app");
  if (state.node !== "intro") {
    document.getElementById("topbar").classList.add("visible");
    document.getElementById("topbarCase").textContent = "\u6848\u4ef6 #001 \u00b7 " + CASE_DATA.meta.title;
    updateProgress();
  } else {
    document.getElementById("topbar").classList.remove("visible");
  }
  switch (state.node) {
    case "intro": renderIntro(app); break;
    case "decompose": renderDecompose(app); break;
    case "evidence-hub": renderEvidenceHub(app); break;
    case "chain-builder": renderChainBuilder(app); break;
    case "verdict": renderVerdict(app); break;
    case "feedback": renderFeedback(app); break;
    case "certificate": renderCertificate(app); break;
  }
}

function renderEvidenceHub(app) {
  var viewedCount = state.viewedCards.length;
  app.innerHTML = '\n    <div class="evidence-showcase">\n      <h2 class="section-h"><span class="icon">2</span>\u8bc1\u636e\u5361</h2>\n      <p class="section-d">\u4ee5\u4e0b\u662f4\u6761\u4e0e\u672c\u6848\u6709\u5173\u7684\u7ebf\u7d22\u3002\u70b9\u51fb\u5361\u7247\u7ffb\u8f6c\u67e5\u770b\u80cc\u9762\u5206\u6790\u3002\u81f3\u5c11\u67e5\u770b2\u5f20\u624d\u80fd\u7ee7\u7eed\u3002</p>\n      <div class="evidence-deck" id="evDeck"></div>\n      <div class="evidence-count">\u5df2\u67e5\u770b <span class="num" id="evCount">' + viewedCount + '</span> / 4 \u5f20</div>\n      <div class="btn-row" id="evBtnRow" style="' + (viewedCount >= 2 ? '' : 'visibility:hidden') + '">\n        <button class="btn btn-primary" onclick="goTo(\'chain-builder\')">&#128279; \u8fdb\u5165\u8bc1\u636e\u94fe &#10140;</button>\n      </div>\n    </div>\n  ';
  renderEvidenceDeck();
}

function renderEvidenceDeck() {
  var container = document.getElementById("evDeck");
  if (!container) return;
  container.innerHTML = "";

  var total = CASE_DATA.cards.length;
  CASE_DATA.cards.forEach(function(card, i) {
    var viewed = state.viewedCards.includes(card.id);
    var flipped = state.flippedCards.includes(card.id);
    var typeClass = "ev-type-" + card.type;
    var dots = "";
    for (var j = 0; j < 5; j++) {
      dots += '<div class="q-dot ' + (j < card.quality ? "on" : "") + '"></div>';
    }

    // Fan layout: each card offset
    var offset = (i - (total - 1) / 2) * 70;
    var rotation = (i - (total - 1) / 2) * 8;
    var z = 10 - i;

    var html = '<div class="ev-deck-card" data-card-id="' + card.id + '" style="transform:translateX(-50%) translateX(' + offset + 'px) rotate(' + rotation + 'deg);z-index:' + z + '" onclick="markActiveCard(\'' + card.id + '\');flipEvidenceCard(\'' + card.id + '\')">';
    html += '<div class="ev-deck-card-inner ' + (flipped ? "" : "") + '" id="evInner_' + card.id + '">';
    // Front
    html += '<div class="ev-deck-front"><div class="classified-stripe"></div>';
    html += '<span class="ev-type ' + typeClass + '">' + card.typeLabel + '</span>';
    html += '<h4>' + card.frontTitle + '</h4>';
    html += '<p class="preview">' + card.frontPreview + '</p>';
    html += '<div class="ev-quality">' + dots + '</div>';
    html += '<div class="ev-flip-hint">' + (viewed ? '&#9989; \u5df2\u67e5\u770b \u00b7 \u70b9\u51fb\u7ffb\u9762' : '&#128260; \u70b9\u51fb\u7ffb\u8f6c') + '</div>';
    html += '</div>';
    // Back
    html += '<div class="ev-deck-back">';
    html += '<div class="note-label">&#128270; \u4fa6\u63a2\u7b14\u8bb0</div>';
    html += '<div class="note-analysis">' + card.back.sourceAnalysis + '</div>';
    html += '<ul class="note-questions">';
    card.back.keyQuestions.forEach(function(q) { html += '<li>' + q + '</li>'; });
    html += '</ul>';
    html += '<div class="note-warning">&#9888; ' + card.back.warning + '</div>';
    html += '<div class="ev-flip-hint">&#128260; \u70b9\u51fb\u7ffb\u56de</div>';
    html += '</div>';
    html += '</div></div>';

    container.innerHTML += html;
  });

  // Apply flip class
  CASE_DATA.cards.forEach(function(card) {
    var inner = document.getElementById("evInner_" + card.id);
    if (inner && state.flippedCards.includes(card.id)) {
      inner.parentElement.classList.add("flipped");
    }
  });
}

function markActiveCard(cardId) {
  var cards = document.querySelectorAll(".ev-deck-card");
  cards.forEach(function(c) {
    c.classList.remove("active");
    if (c.getAttribute("data-card-id") === cardId) {
      c.classList.add("active");
    }
  });
}

function flipEvidenceCard(cardId) {
  if (!state.viewedCards.includes(cardId)) {
    state.viewedCards.push(cardId);
  }

  var card = CASE_DATA.cards.find(function(c) { return c.id === cardId; });
  if (!card) return;

  var isFlipped = state.flippedCards.includes(cardId);
  var typeClass = "ev-type-" + card.type;
  var dots = "";
  for (var j = 0; j < 5; j++) {
    dots += '<div class="q-dot ' + (j < card.quality ? "on" : "") + '"></div>';
  }

  var frontHtml = '<div class="ev-modal-front"><div class="classified-stripe"></div>';
  frontHtml += '<span class="ev-type ' + typeClass + '">' + card.typeLabel + '</span>';
  frontHtml += '<h4>' + card.frontTitle + '</h4>';
  frontHtml += '<p class="preview">' + card.frontPreview + '</p>';
  frontHtml += '<div class="ev-quality">' + dots + '</div>';
  frontHtml += '<div class="ev-flip-hint">' + (isFlipped ? '\u70b9\u51fb\u4e0b\u65b9\u7ffb\u9762\u67e5\u770b\u80cc\u9762' : '\u70b9\u51fb\u4e0b\u65b9\u7ffb\u9762\u67e5\u770b\u80cc\u9762') + '</div>';
  frontHtml += '</div>';

  var backHtml = '<div class="ev-modal-back">';
  backHtml += '<div class="note-label">&#128270; \u4fa6\u63a2\u7b14\u8bb0</div>';
  backHtml += '<div class="note-analysis">' + card.back.sourceAnalysis + '</div>';
  backHtml += '<ul class="note-questions">';
  card.back.keyQuestions.forEach(function(q) { backHtml += '<li>' + q + '</li>'; });
  backHtml += '</ul>';
  backHtml += '<div class="note-warning">&#9888; ' + card.back.warning + '</div>';
  backHtml += '</div>';

  var overlay = document.getElementById("evModalOverlay");
  var inner = document.getElementById("evModalInner");
  var flipBtn = document.getElementById("evModalFlipBtn");
  if (!overlay || !inner) return;

  inner.innerHTML = frontHtml + backHtml;
  if (isFlipped) {
    inner.classList.add("flipped");
  } else {
    inner.classList.remove("flipped");
  }
  if (flipBtn) {
    flipBtn.textContent = isFlipped ? '\u{1f501} \u70b9\u51fb\u7ffb\u56de\u6b63\u9762' : '\u{1f501} \u70b9\u51fb\u7ffb\u9762\u67e5\u770b\u80cc\u9762';
  }
  overlay.classList.add("show");
}

function closeModalCard() {
  var overlay = document.getElementById("evModalOverlay");
  if (overlay) overlay.classList.remove("show");
}

function toggleModalFlip() {
  var inner = document.getElementById("evModalInner");
  var flipBtn = document.getElementById("evModalFlipBtn");
  if (!inner) return;
  inner.classList.toggle("flipped");
  var isFlippedNow = inner.classList.contains("flipped");
  var cardId = null;
  document.querySelectorAll(".ev-deck-card").forEach(function(c) {
    if (c.classList.contains("active")) {
      var onclick = c.getAttribute("onclick") || "";
      var match = onclick.match(/flipEvidenceCard\('([^']+)'\)/);
      if (match) cardId = match[1];
    }
  });
  if (cardId) {
    var idx = state.flippedCards.indexOf(cardId);
    if (isFlippedNow && idx < 0) {
      state.flippedCards.push(cardId);
    } else if (!isFlippedNow && idx >= 0) {
      state.flippedCards.splice(idx, 1);
    }
  }
  if (flipBtn) {
    flipBtn.textContent = isFlippedNow ? '\u{1f501} \u70b9\u51fb\u7ffb\u56de\u6b63\u9762' : '\u{1f501} \u70b9\u51fb\u7ffb\u9762\u67e5\u770b\u80cc\u9762';
  }
  renderEvidenceDeck();
  var countEl = document.getElementById("evCount");
  if (countEl) countEl.textContent = state.viewedCards.length;
  var btnRow = document.getElementById("evBtnRow");
  if (btnRow && state.viewedCards.length >= 2) btnRow.style.visibility = "visible";
}

//  CHAIN BUILDER - DASHBOARD WITH RING-BY-RING VERIFICATION
// ============================================================
function renderChainBuilder(app) {
  if (state.viewedCards.length < 2) {
    showToast("\u8bf7\u5148\u67e5\u770b\u81f3\u5c112\u5f20\u8bc1\u636e\u5361");
    goTo("evidence-hub");
    return;
  }

  app.innerHTML = '\n    <div>\n      <h2 class="section-h"><span class="icon">3</span>\u6784\u5efa\u8bc1\u636e\u94fe</h2>\n      <p class="section-d">\u9010\u4e2a\u73af\u8282\u67e5\u8bc1\u3002\u9009\u62e9\u4e00\u5f20\u8bc1\u636e\u5361\uff0c\u653e\u5230\u5f53\u524d\u73af\u8282\u4e0a\u3002\u7cfb\u7edf\u4f1a\u68c0\u67e5\u8fd9\u5f20\u5361\u80fd\u4e0d\u80fd\u8bc1\u660e\u8fd9\u4e2a\u73af\u8282\u3002</p>\n      <div class="cb-dashboard">\n        <div class="cb-progress-bar" id="cbProgressBar"></div>\n        <div class="cb-ring-nav" id="cbRingNav"></div>\n        <div class="cb-spotlight" id="cbSpotlight"></div>\n        <div class="cb-deal-tray">\n          <div class="cb-deal-tray-title">&#127183; \u53ef\u7528\u8bc1\u636e\u5361\uff08\u70b9\u51fb\u9009\u4e2d\uff09</div>\n          <div class="cb-deal-cards" id="cbDealCards"></div>\n        </div>\n        <div class="btn-row">\n          <button class="btn btn-secondary btn-small" onclick="resetChain()">\u91cd\u7f6e</button>\n          <button class="btn btn-secondary btn-small" id="prevRingBtn" onclick="prevRing()">&#8592; \u4e0a\u4e00\u73af</button>\n          <button class="btn btn-primary btn-small" id="nextRingBtn" onclick="nextRing()">\u4e0b\u4e00\u73af &#8594;</button>\n          <button class="btn btn-primary btn-small" id="checkChainBtn" onclick="goTo(\'verdict\')" style="display:none;">&#9878; \u4f5c\u51fa\u5224\u51b3</button>\n        </div>\n      </div>\n      <div id="chainSummaryContainer"></div>\n    </div>\n  ';
  renderProgressBar();
  renderRingNav();
  renderSpotlight();
  renderDealCards();
}

function renderProgressBar() {
  var container = document.getElementById("cbProgressBar");
  if (!container) return;
  container.innerHTML = "";
  CASE_DATA.chain.forEach(function(ring, i) {
    var cardId = state.chainPlacements[ring.id];
    var cls = "";
    if (i === state.currentRingIdx) cls = "active";
    if (cardId && state.chainChecked) {
      var rule = CASE_DATA.chainRules[ring.id];
      var placement = rule.placements[cardId];
      if (placement && placement.valid) cls = "covered";
      else cls = "wrong";
    } else if (!cardId && state.chainChecked) {
      cls = "uncovered";
    }
    var div = document.createElement("div");
    div.className = "cb-prog-ring " + cls;
    div.onclick = function() { state.currentRingIdx = i; renderProgressBar(); renderRingNav(); renderSpotlight(); };
    container.appendChild(div);
  });
}

function renderRingNav() {
  var container = document.getElementById("cbRingNav");
  if (!container) return;
  container.innerHTML = "";
  CASE_DATA.chain.forEach(function(ring, i) {
    var cardId = state.chainPlacements[ring.id];
    var cls = "";
    if (i === state.currentRingIdx) cls = "active";
    if (cardId && state.chainChecked) {
      var rule = CASE_DATA.chainRules[ring.id];
      var placement = rule.placements[cardId];
      if (placement && placement.valid) cls = "covered";
      else cls = "wrong";
    } else if (!cardId && state.chainChecked) {
      cls = "uncovered";
    }
    var btn = document.createElement("div");
    btn.className = "cb-nav-btn " + cls;
    btn.innerHTML = '<span class="nav-num">' + (i+1) + '</span><span class="nav-label">' + ring.short + '</span>';
    btn.onclick = function() { state.currentRingIdx = i; renderProgressBar(); renderRingNav(); renderSpotlight(); };
    container.appendChild(btn);
  });
}

function renderSpotlight() {
  var container = document.getElementById("cbSpotlight");
  if (!container) return;
  var ring = CASE_DATA.chain[state.currentRingIdx];
  var cardId = state.chainPlacements[ring.id];
  var card = cardId ? CASE_DATA.cards.find(function(c) { return c.id === cardId; }) : null;
  var rule = CASE_DATA.chainRules[ring.id];

  var statusHtml = '<div class="cb-spotlight-status empty">\u5f85\u653e\u7f6e</div>';
  var probeHtml = "";

  if (card && !state.chainChecked) {
    statusHtml = '<div class="cb-spotlight-status placed">\u5df2\u653e\u7f6e\uff1a' + card.typeLabel + '</div>';
  } else if (card && state.chainChecked) {
    var placement = rule.placements[card.id];
    if (placement && placement.valid) {
      statusHtml = '<div class="cb-spotlight-status ok">&#10003; \u5df2\u8bc1\u5b9e\uff1a' + card.typeLabel + '</div>';
      probeHtml = '<div style="margin-top:8px;font-size:.82rem;color:var(--green);padding:8px 12px;background:rgba(74,222,128,.06);border-radius:var(--radius-sm);">' + placement.note + '</div>';
    } else if (placement && !placement.valid) {
      statusHtml = '<div class="cb-spotlight-status bad">&#10007; \u8bc1\u636e\u4e0d\u8db3\uff1a' + card.typeLabel + '</div>';
      if (placement.probe) {
        probeHtml = '<div class="cb-probe"><div class="ack">' + placement.probe.ack + '</div><div class="gap">' + placement.probe.gap + '</div><div class="q">' + placement.probe.q + '</div></div>';
      } else {
        probeHtml = '<div class="cb-probe"><div class="gap">' + placement.note + '</div></div>';
      }
    }
  } else if (!card && state.chainChecked) {
    statusHtml = '<div class="cb-spotlight-status gap">&#9888; \u8bc1\u636e\u7f3a\u5931</div>';
    probeHtml = '<div class="cb-probe"><div class="ack">' + rule.uncoveredProbe.ack + '</div><div class="gap">' + rule.uncoveredProbe.gap + '</div><div class="q">' + rule.uncoveredProbe.q + '</div></div>';
  }

  var placedChip = "";
  if (card) {
    placedChip = '<div class="cb-placed-chip" onclick="removePlacement(\'' + ring.id + '\')">' + card.typeLabel + ' \u00b7 ' + card.frontTitle.substring(0,8) + '... &#10005;</div>';
  }

  container.innerHTML = '\n    <div class="cb-spotlight-label">\u73af\u8282 ' + (state.currentRingIdx + 1) + ' / 6</div>\n    <div class="cb-spotlight-title">' + ring.label + '</div>\n    <div class="cb-spotlight-desc">' + ring.desc + '</div>\n    ' + statusHtml + '\n    ' + placedChip + '\n    ' + probeHtml + '\n  ';

  // Update nav buttons
  var prevBtn = document.getElementById("prevRingBtn");
  var nextBtn = document.getElementById("nextRingBtn");
  var checkBtn = document.getElementById("checkChainBtn");
  if (prevBtn) prevBtn.style.visibility = state.currentRingIdx > 0 ? "visible" : "hidden";
  if (nextBtn) nextBtn.style.visibility = state.currentRingIdx < CASE_DATA.chain.length - 1 ? "visible" : "hidden";
  if (checkBtn) checkBtn.style.display = state.currentRingIdx === CASE_DATA.chain.length - 1 ? "inline-flex" : "none";
}

function renderDealCards() {
  var container = document.getElementById("cbDealCards");
  if (!container) return;
  container.innerHTML = "";
  CASE_DATA.cards.forEach(function(card, i) {
    var isUsed = Object.values(state.chainPlacements).includes(card.id);
    var isSelected = state.selectedCard === card.id;
    var typeColors = {
      commercial: "rgba(240,168,48,.15);color:var(--gold)",
      anecdote: "rgba(45,212,191,.15);color:var(--teal)",
      weak: "rgba(248,113,113,.15);color:var(--red)",
      study: "rgba(96,165,250,.15);color:var(--blue)"
    };
    var dc = document.createElement("div");
    dc.className = "cb-deal-card " + (isSelected ? "selected" : "") + (isUsed ? " used" : "") + " dealing";
    dc.style.animationDelay = (i * 0.1) + "s";
    dc.innerHTML = '<div class="dc-type" style="background:' + typeColors[card.type] + '">' + card.typeLabel + '</div><div class="dc-label">' + card.frontTitle.substring(0,10) + '...</div>';
    dc.onclick = function() { selectCard(card.id); };
    container.appendChild(dc);
  });
}

function selectCard(cardId) {
  if (Object.values(state.chainPlacements).includes(cardId)) {
    showToast("\u8fd9\u5f20\u5361\u5df2\u7ecf\u653e\u8fc7\u4e86\uff0c\u5148\u53d6\u56de\u624d\u80fd\u91cd\u65b0\u4f7f\u7528");
    return;
  }
  state.selectedCard = state.selectedCard === cardId ? null : cardId;

  // If selected, auto-place on current ring
  if (state.selectedCard) {
    var ring = CASE_DATA.chain[state.currentRingIdx];
    if (state.chainPlacements[ring.id]) {
      delete state.chainPlacements[ring.id];
    }
    state.chainPlacements[ring.id] = state.selectedCard;
    state.selectedCard = null;
    state.chainChecked = true; // Auto-check this ring
    renderProgressBar();
    renderRingNav();
    renderSpotlight();
    renderDealCards();
  }
}

function removePlacement(ringId) {
  delete state.chainPlacements[ringId];
  state.chainChecked = true; // Keep checked status for other rings
  renderProgressBar();
  renderRingNav();
  renderSpotlight();
  renderDealCards();
}

function resetChain() {
  state.chainPlacements = {};
  state.selectedCard = null;
  state.chainChecked = false;
  state.currentRingIdx = 0;
  renderProgressBar();
  renderRingNav();
  renderSpotlight();
  renderDealCards();
}

function prevRing() {
  if (state.currentRingIdx > 0) {
    state.currentRingIdx--;
    renderProgressBar();
    renderRingNav();
    renderSpotlight();
  }
}

function nextRing() {
  if (state.currentRingIdx < CASE_DATA.chain.length - 1) {
    state.currentRingIdx++;
    renderProgressBar();
    renderRingNav();
    renderSpotlight();
  }
}

function renderVerdict(app) {
  state.chainChecked = true; // Ensure all rings are checked
  app.innerHTML = '\n    <div class="verdict-area">\n      <h2 class="section-h"><span class="icon">4</span>\u4f5c\u51fa\u5224\u51b3</h2>\n      <p class="section-d">\u57fa\u4e8e\u8bc1\u636e\u94fe\u7684\u68c0\u67e5\u7ed3\u679c\uff0c\u4f60\u5bf9\u539f\u59cb\u8bf4\u6cd5\u4f5c\u51fa\u4ec0\u4e48\u5224\u51b3\uff1f</p>\n      <div id="verdictStampArea" style="text-align:center;margin-bottom:12px;"></div>\n      <div class="verdict-options" id="verdictOpts"></div>\n      <div class="verdict-reason" id="verdictReason" style="display:none;">\n        <label style="font-size:.85rem;color:var(--text-sec);display:block;margin-bottom:6px;">\u5224\u51b3\u7406\u7531\uff08\u7b80\u8ff0\uff09</label>\n        <textarea id="verdictReasonInput" placeholder="\u8bf7\u7b80\u8ff0\u4f60\u7684\u5224\u51b3\u7406\u7531..."></textarea>\n      </div>\n      <div class="btn-row">\n        <button class="btn btn-secondary btn-small" onclick="goTo(\'chain-builder\')">&#8634; \u56de\u53bb\u8c03\u6574\u8bc1\u636e\u94fe</button>\n        <button class="btn btn-primary" id="submitVerdict" disabled onclick="submitVerdict()">&#9878; \u63d0\u4ea4\u5224\u51b3</button>\n      </div>\n    </div>\n  ';
  renderVerdictOptions();
}

function renderVerdictOptions() {
  var container = document.getElementById("verdictOpts");
  if (!container) return;
  container.innerHTML = "";
  var colorMap = { green: "var(--green)", red: "var(--red)", gold: "var(--gold)", blue: "var(--blue)" };
  var bgColorMap = { green: "rgba(74,222,128,.12)", red: "rgba(248,113,113,.12)", gold: "rgba(240,168,48,.12)", blue: "rgba(96,165,250,.12)" };
  CASE_DATA.verdicts.forEach(function(v) {
    container.innerHTML += '<div class="verdict-opt" id="vopt-' + v.id + '" onclick="selectVerdict(\'' + v.id + '\')"><div class="v-icon" style="background:' + bgColorMap[v.color] + ';color:' + colorMap[v.color] + '">' + v.icon + '</div><div class="v-info"><div class="v-label">' + v.label + '</div><div class="v-desc">' + v.desc + '</div></div></div>';
  });
}

function selectVerdict(vid) {
  state.verdict = { id: vid };
  CASE_DATA.verdicts.forEach(function(v) {
    var el = document.getElementById("vopt-" + v.id);
    if (el) el.classList.toggle("selected", v.id === vid);
  });
  document.getElementById("verdictReason").style.display = "block";
  document.getElementById("submitVerdict").disabled = false;
  var stampArea = document.getElementById("verdictStampArea");
  var sv = CASE_DATA.verdicts.find(function(x) { return x.id === vid; });
  var stampLabels = { v1: "\u2713", v2: "\u2717", v3: "\u270E", v4: "?" };
  stampArea.innerHTML = '<div class="verdict-stamp v-' + sv.color + '">' + (stampLabels[vid] || "?") + '</div>';
}

function submitVerdict() {
  var reason = document.getElementById("verdictReasonInput").value.trim();
  var v = CASE_DATA.verdicts.find(function(x) { return x.id === state.verdict.id; });
  state.verdict = { id: v.id, label: v.label, color: v.color, icon: v.icon, reason: reason || "\u672a\u586b\u5199" };
  generateFeedback();
  goTo("feedback");
}

// ============================================================
//  FEEDBACK GENERATION
// ============================================================
function generateFeedback() {
  state.strengths = [];
  state.improvements = [];
  var viewedCount = state.viewedCards.length;

  if (viewedCount >= 3) {
    state.strengths.push({ title: "\u8bc1\u636e\u641c\u96c6\u610f\u8bc6\u5f3a", content: "\u4f60\u67e5\u770b\u4e86 " + viewedCount + " \u5f20\u8bc1\u636e\u5361\uff0c\u6ca1\u6709\u6025\u4e8e\u4e0b\u7ed3\u8bba\u3002\u5728\u79d1\u5b66\u63a8\u7406\u4e2d\uff0c\u5148\u641c\u96c6\u518d\u5224\u65ad\u662f\u57fa\u672c\u7d20\u517b\u3002" });
  }

  var covered = 0, wrong = 0, uncovered = 0;
  var uncoveredRings = [];
  CASE_DATA.chain.forEach(function(ring) {
    var cardId = state.chainPlacements[ring.id];
    if (!cardId) { uncovered++; uncoveredRings.push(ring.label); return; }
    var rule = CASE_DATA.chainRules[ring.id];
    var placement = rule.placements[cardId];
    if (placement && placement.valid) covered++;
    else wrong++;
  });

  if (uncoveredRings.indexOf("DHA\u542b\u91cf\u8fbe\u5230\u6709\u6548\u5242\u91cf") >= 0 || uncoveredRings.indexOf("\u8fd9\u6b3e\u5177\u4f53\u4ea7\u54c1\u7ecf\u8fc7\u9a8c\u8bc1") >= 0) {
    state.strengths.push({ title: "\u53d1\u73b0\u4e86\u5173\u952e\u65ad\u88c2", content: "\u4f60\u6ce8\u610f\u5230\u8bc1\u636e\u94fe\u4e2d\u201c\u542b\u91cf\u201d\u6216\u201c\u4ea7\u54c1\u9a8c\u8bc1\u201d\u73af\u8282\u7f3a\u5931\u3002\u8fd9\u6b63\u662f\u5e7f\u544a\u6700\u64c5\u957f\u7684\u2014\u2014\u7528\u201c\u6709\u6210\u5206\u201d\u8df3\u8fc7\u201c\u591f\u4e0d\u591f\u201d\u548c\u201c\u6709\u6ca1\u6709\u9a8c\u8bc1\u201d\u3002" });
  }

  if (state.chainPlacements["ring-4"] === "card-4") {
    state.strengths.push({ title: "\u6b63\u786e\u4f7f\u7528\u4e86\u6700\u5f3a\u8bc1\u636e", content: "\u4f60\u628a\u89c4\u8303\u7814\u7a76\uff08RCT\uff09\u653e\u5728\u4e86\u201cDHA\u5bf9\u8ba4\u77e5\u6709\u76ca\u201d\u8fd9\u4e2a\u73af\u8282\u4e0a\u3002\u8fd9\u662f\u56db\u5f20\u5361\u4e2d\u6700\u5f3a\u7684\u8bc1\u636e\uff0c\u653e\u5728\u6b63\u786e\u7684\u4f4d\u7f6e\u5f88\u6709\u4ef7\u503c\u3002" });
  }

  if (wrong > 0) {
    state.improvements.push({ title: "\u6ce8\u610f\u8bc1\u636e\u4e0e\u73af\u8282\u7684\u7cbe\u786e\u5339\u914d", content: "\u4f60\u6709 " + wrong + " \u4e2a\u73af\u8282\u653e\u7f6e\u4e86\u4e0d\u5339\u914d\u7684\u8bc1\u636e\u3002\u8bb0\u4f4f\uff1a\u6bcf\u4e2a\u73af\u8282\u9700\u8981\u7279\u5b9a\u7c7b\u578b\u7684\u8bc1\u636e\u3002\u7814\u7a76\u5173\u4e8eDHA\u8865\u5145\u5242\u4e0d\u7b49\u4e8e\u5173\u4e8e\u8fd9\u6b3e\u996e\u6599\uff1b\u201c\u8ba4\u77e5\u6d4b\u8bd5\u597d\u201d\u4e0d\u7b49\u4e8e\u201c\u6210\u7ee9\u63d0\u9ad8\u201d\u3002" });
  }

  if (uncovered > 0) {
    state.improvements.push({ title: uncovered + "\u4e2a\u73af\u8282\u6ca1\u6709\u8bc1\u636e", content: "\u8bc1\u636e\u94fe\u4e2d\u6709 " + uncovered + " \u4e2a\u73af\u8282\u5b8c\u5168\u6ca1\u6709\u8bc1\u636e\u8986\u76d6\u3002\u4e00\u6761\u63a8\u7406\u94fe\u53ea\u8981\u6709\u4e00\u4e2a\u73af\u8282\u65ad\u88c2\uff0c\u7ed3\u8bba\u5c31\u4e0d\u6210\u7acb\u3002\u5e7f\u544a\u6700\u64c5\u957f\u7684\u5c31\u662f\u8ba9\u4f60\u5ffd\u7565\u8fd9\u4e9b\u65ad\u88c2\u3002" });
  }

  if (state.verdict.id === "v1" && (uncovered > 2 || wrong > 2)) {
    state.improvements.push({ title: "\u5224\u51b3\u4e0e\u8bc1\u636e\u4e0d\u4e00\u81f4", content: "\u4f60\u5224\u51b3\u201c\u8bf4\u6cd5\u6210\u7acb\u201d\uff0c\u4f46\u8bc1\u636e\u94fe\u6709\u591a\u4e2a\u65ad\u88c2\u3002\u56de\u987e\u4e00\u4e0b\uff1a\u5373\u4f7fDHA\u786e\u5b9e\u6709\u76ca\uff0c\u8fd9\u6b3e\u996e\u6599\u7684\u542b\u91cf\u3001\u5438\u6536\u3001\u4ea7\u54c1\u9a8c\u8bc1\u90fd\u6ca1\u6709\u8bc1\u636e\u3002" });
  }

  if (state.verdict.id === "v2" || state.verdict.id === "v3") {
    state.strengths.push({
      title: "\u5224\u51b3\u8c28\u614e\u5408\u7406",
      content: state.verdict.id === "v2"
        ? "\u4f60\u5224\u51b3\u201c\u4e0d\u6210\u7acb\u201d\u3002\u8bc1\u636e\u94fe\u4e2d\u786e\u5b9e\u6709\u591a\u4e2a\u65ad\u88c2\uff0c\u73b0\u6709\u8bc1\u636e\u4e0d\u8db3\u4ee5\u652f\u6301\u5e7f\u544a\u7684\u8bf4\u6cd5\u3002"
        : "\u4f60\u5224\u51b3\u201c\u9700\u8981\u4fee\u6539\u201d\u3002\u8fd9\u8bf4\u660e\u4f60\u770b\u5230\u4e86\u8bf4\u6cd5\u4e2d\u7684\u4e8b\u5b9e\u57fa\u7840\uff0c\u4f46\u4e5f\u53d1\u73b0\u4e86\u5b83\u5938\u5927\u4e86\u8bc1\u636e\u3002"
    });
  }

  if (state.verdict.id === "v4") {
    state.strengths.push({ title: "\u627f\u8ba4\u4e86\u4e0d\u786e\u5b9a\u6027", content: "\u4f60\u9009\u62e9\u201c\u8bc1\u636e\u4e0d\u8db3\uff0c\u65e0\u6cd5\u5224\u65ad\u201d\u3002\u5728\u79d1\u5b66\u4e2d\uff0c\u627f\u8ba4\u201c\u4e0d\u77e5\u9053\u201d\u6bd4\u5f3a\u884c\u4e0b\u7ed3\u8bba\u66f4\u6709\u4ef7\u503c\u3002" });
  }
}

// ============================================================
//  FEEDBACK - WITH CHAIN VISUALIZATION
// ============================================================
function renderFeedback(app) {
  var score = state.strengths.length;
  var maxScore = state.strengths.length + state.improvements.length;
  var percent = maxScore > 0 ? Math.round((score / maxScore) * 100) : 100;

  // Build chain visualization
  var chainViz = '<div class="fb-chain-viz">';
  chainViz += '<div class="fb-chain-viz-title">\u4f60\u7684\u8bc1\u636e\u94fe</div>';
  chainViz += '<div class="fb-chain-flow">';
  CASE_DATA.chain.forEach(function(ring, i) {
    var cardId = state.chainPlacements[ring.id];
    var cls = "empty";
    if (cardId && state.chainChecked) {
      var rule = CASE_DATA.chainRules[ring.id];
      var placement = rule.placements[cardId];
      if (placement && placement.valid) cls = "covered";
      else cls = "wrong";
    } else if (!cardId && state.chainChecked) {
      cls = "uncovered";
    } else if (cardId) {
      cls = "placed";
    }

    var arrowCls = "";
    if (cls === "covered") arrowCls = "solid";
    else if (cls === "wrong" || cls === "uncovered") arrowCls = "broken";

    chainViz += '<div class="fb-chain-node">';
    chainViz += '<div class="fb-chain-node-circle ' + cls + '">' + (i+1) + '</div>';
    chainViz += '<div class="fb-chain-node-label">' + ring.short + '</div>';
    chainViz += '</div>';

    if (i < CASE_DATA.chain.length - 1) {
      chainViz += '<div class="fb-chain-arrow ' + arrowCls + '">&#10140;</div>';
    }
  });
  chainViz += '</div></div>';

  // Build feedback cards
  var strengthsHtml = state.strengths.map(function(s, i) {
    return '<div class="fb-card strength" style="animation-delay:' + (i * 0.15) + 's"><div class="fb-title">&#127919; ' + s.title + '</div><div class="fb-content">' + s.content + '</div></div>';
  }).join("");

  var improvementsHtml = state.improvements.map(function(imp, i) {
    return '<div class="fb-card improvement" style="animation-delay:' + ((state.strengths.length + i) * 0.15) + 's"><div class="fb-title">&#128161; ' + imp.title + '</div><div class="fb-content">' + imp.content + '</div></div>';
  }).join("");

  if (!strengthsHtml) strengthsHtml = '<div class="fb-card strength"><div class="fb-content">\u7ee7\u7eed\u7ec3\u4e60\uff0c\u4f60\u4f1a\u8d8a\u6765\u8d8a\u64c5\u957f\u53d1\u73b0\u8bc1\u636e\u94fe\u4e2d\u7684\u95ee\u9898\u3002</div></div>';
  if (!improvementsHtml) improvementsHtml = '<div class="fb-card improvement"><div class="fb-content">\u4f60\u7684\u63a8\u7406\u975e\u5e38\u5b8c\u6574\uff0c\u51e0\u4e4e\u6ca1\u6709\u9700\u8981\u6539\u8fdb\u7684\u5730\u65b9\u3002</div></div>';

  app.innerHTML = '\n    <div class="feedback-area">\n      <h2 class="section-h"><span class="icon">5</span>\u63a8\u7406\u53cd\u9988</h2>\n      <p class="section-d">\u8fd9\u4e0d\u662f\u5728\u8bc4\u5224\u4f60\u7684\u5bf9\u9519\uff0c\u800c\u662f\u5206\u6790\u4f60\u7684\u63a8\u7406\u8fc7\u7a0b\u3002</p>\n      ' + chainViz + '\n      <div class="fb-score">\n        <div><span class="score-num">' + score + '</span><span class="score-max">/' + maxScore + '</span></div>\n        <div class="score-label">\u63a8\u7406\u4eae\u70b9\u6570 \u00b7 \u6b63\u786e\u7387 ' + percent + '%</div>\n      </div>\n      ' + strengthsHtml + '\n      ' + improvementsHtml + '\n      <div class="fb-closing">\u79d1\u5b66\u4e0d\u662f\u77e5\u9053\u6240\u6709\u7b54\u6848\uff0c<br>\u800c\u662f\u77e5\u9053\u7b54\u6848\u51ed\u4ec0\u4e48\u6210\u7acb\u3002</div>\n      <div class="btn-row">\n        <button class="btn btn-primary" onclick="goTo(\'certificate\')">&#127942; \u9886\u53d6\u5224\u51b3\u4e66</button>\n      </div>\n    </div>\n  ';
}

// ============================================================
//  CERTIFICATE
// ============================================================
function renderCertificate(app) {
  var v = state.verdict;
  var colorClass = v.color;
  var placedCount = Object.keys(state.chainPlacements).length;

  var badges = [];
  if (state.viewedCards.length >= 2) badges.push("\u4e8b\u5b9e\u4fa6\u63a2");
  if (state.viewedCards.length >= 3) badges.push("\u8bc1\u636e\u730e\u624b");
  if (state.viewedCards.length >= 4) badges.push("\u5168\u9762\u8c03\u67e5");
  if (Object.keys(state.chainPlacements).length >= 4) badges.push("\u903b\u8f91\u5efa\u7b51\u5e08");
  if (state.verdict.id === "v2" || state.verdict.id === "v3") badges.push("\u7406\u6027\u5224\u65ad");
  if (state.verdict.id === "v4") badges.push("\u8c28\u614e\u601d\u8003\u8005");

  var colorMap = { green: "green", red: "red", gold: "gold", blue: "blue" };
  var vColor = colorMap[colorClass] || "gold";

  var badgesHtml = badges.map(function(b, i) {
    return '<span class="cert-badge" style="animation-delay:' + (0.5 + i * 0.12) + 's">' + b + '</span>';
  }).join("");

  var reasonText = state.verdict.reason || "\u672a\u586b\u5199";

  app.innerHTML = '\n    <div class="cert-area">\n      <h2 class="section-h"><span class="icon">6</span>\u5224\u51b3\u4e66</h2>\n      <p class="section-d">\u606d\u559c\u5b8c\u6210\u8c03\u67e5\uff01\u4ee5\u4e0b\u662f\u4f60\u7684\u5224\u51b3\u8bb0\u5f55\u3002</p>\n      <div class="cert">\n        <div class="cert-header">\n          <div class="seal">&#128274;</div>\n          <div class="title">\u8bc1\u636e\u4fa6\u63a2\u793e \u00b7 \u5224\u51b3\u4e66</div>\n          <div class="case-id">\u6848\u4ef6 #001 \u00b7 ' + CASE_DATA.meta.title + '</div>\n        </div>\n        <div class="cert-body">\n          <div class="cert-row">\n            <div class="label">\u521d\u59cb\u8bf4\u6cd5</div>\n            <div class="value">' + CASE_DATA.meta.sourceClaim + '</div>\n          </div>\n          <div class="cert-row">\n            <div class="label">\u4f60\u7684\u5224\u51b3</div>\n            <div class="value ' + vColor + '">' + state.verdict.icon + ' ' + state.verdict.label + '</div>\n          </div>\n          <div class="cert-row">\n            <div class="label">\u5224\u51b3\u7406\u7531</div>\n            <div class="value">' + reasonText + '</div>\n          </div>\n          <div class="cert-row">\n            <div class="label">\u8bc1\u636e\u5361\u67e5\u770b</div>\n            <div class="value">' + state.viewedCards.length + ' / ' + CASE_DATA.cards.length + ' \u5f20</div>\n          </div>\n          <div class="cert-row">\n            <div class="label">\u8bc1\u636e\u94fe\u73af\u8282\u8986\u76d6</div>\n            <div class="value">' + placedCount + ' / ' + CASE_DATA.chain.length + ' \u4e2a\u73af\u8282</div>\n          </div>\n        </div>\n        <div class="cert-badges">' + badgesHtml + '</div>\n        <div class="cert-footer">\u8bc1\u636e\u4fa6\u63a2\u793e \u00b7 \u79d1\u5b66\u8bc1\u636e\u7d20\u517b\u521d\u6b65 \u00b7 ' + new Date().toLocaleDateString("zh-CN") + '</div>\n      </div>\n      <div class="btn-row">\n        <button class="btn btn-secondary btn-small" onclick="goTo(\'feedback\')">&#8634; \u56de\u770b\u53cd\u9988</button>\n        <button class="btn btn-primary" onclick="restartCase()">&#128260; \u91cd\u65b0\u8c03\u67e5</button>\n      </div>\n    </div>\n  ';
}

// ============================================================
//  RESTART
// ============================================================
function restartCase() {
  state.node = "intro";
  state.history = [];
  state.viewedCards = [];
  state.flippedCards = [];
  state.chainPlacements = {};
  state.selectedCard = null;
  state.chainChecked = false;
  state.currentRingIdx = 0;
  state.verdict = null;
  state.strengths = [];
  state.improvements = [];
  screenFlash();
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
  showToast("\u65b0\u7684\u8c03\u67e5\u5f00\u59cb\u4e86\uff01");
}

// ============================================================
//  SHARE
// ============================================================
function shareResult() {
  var text = "\u6211\u5728\u8bc1\u636e\u4fa6\u63a2\u793e\u5b8c\u6210\u4e86\u6848\u4ef6 #001\u3002\u8bc1\u636e\u5361\u67e5\u770b " + state.viewedCards.length + "/" + CASE_DATA.cards.length + "\uff0c\u8bc1\u636e\u94fe\u8986\u76d6 " + Object.keys(state.chainPlacements).length + "/" + CASE_DATA.chain.length + "\u3002";
  if (navigator.share) {
    navigator.share({ title: "\u8bc1\u636e\u4fa6\u63a2\u793e", text: text }).catch(function() {});
  } else {
    showToast("\u7ed3\u679c\u5df2\u590d\u5236\u526a\u8d34\u677f\uff08\u6f14\u793a\u7248\uff09");
    if (navigator.clipboard) navigator.clipboard.writeText(text).catch(function() {});
  }
}

// ============================================================
//  PARTICLES
// ============================================================
function initParticles() {
  var container = document.getElementById("bgParticles");
  if (!container) return;
  var count = 30;
  for (var i = 0; i < count; i++) {
    var p = document.createElement("div");
    p.className = "bg-particle";
    p.style.left = Math.random() * 100 + "%";
    p.style.animationDuration = (8 + Math.random() * 12) + "s";
    p.style.animationDelay = Math.random() * 10 + "s";
    p.style.opacity = (0.2 + Math.random() * 0.4);
    var size = 1 + Math.random() * 2;
    p.style.width = size + "px";
    p.style.height = size + "px";
    if (Math.random() > 0.6) {
      p.style.background = "var(--teal)";
    }
    container.appendChild(p);
  }
}

// ============================================================
//  SCREEN FLASH
// ============================================================
function screenFlash() {
  var el = document.getElementById("screenFlash");
  if (!el) return;
  el.classList.remove("flash");
  void el.offsetWidth;
  el.classList.add("flash");
}

// ============================================================
//  STARTUP
// ============================================================
initParticles();
render();
</script>
</body>
</html>
