<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>奶茶大冒险 · 选择困难症的趣味解药</title>
<style>
/* ============ Design Tokens — Milk Tea Theme ============ */
:root{
  /* Creams */
  --cream:#FFF8F0;
  --cream-2:#FBEFE2;
  --cream-3:#F5E4D0;
  /* Caramels / coffees */
  --milk-coffee:#D4A574;
  --milk-coffee-deep:#A67B5B;
  --cocoa:#6B4A2E;
  --cocoa-deep:#4A2F1A;
  /* Pink-orange family */
  --pink:#FF9B85;
  --pink-soft:#FFB088;
  --pink-deep:#FF7E6B;
  --peach:#FFD9B8;
  --peach-deep:#FFC089;
  /* Matcha accent */
  --matcha:#9CB57A;
  --matcha-deep:#7A9459;
  --matcha-soft:#C5D4A8;
  /* States */
  --danger:#E86A6A;
  --gold:#E8B84B;
  --gold-deep:#D4A23B;
  --silver:#C9C0B4;
  --bronze:#CD8B5A;

  /* Soft layered shadows */
  --shadow-xs:0 2px 6px rgba(166,123,91,.10);
  --shadow-soft:0 8px 22px rgba(166,123,91,.16);
  --shadow-card:0 16px 40px rgba(107,74,46,.18), 0 2px 6px rgba(166,123,91,.08);
  --shadow-press:0 4px 12px rgba(107,74,46,.18);
  --shadow-glow-pink:0 12px 30px rgba(255,135,116,.48);
  --shadow-glow-matcha:0 12px 30px rgba(156,181,122,.42);
  --shadow-inset-warm:inset 0 2px 3px rgba(255,255,255,.65), inset 0 -3px 8px rgba(166,123,91,.10);

  /* Radii */
  --r-xl:32px;
  --r-lg:26px;
  --r-md:20px;
  --r-sm:14px;

  /* Gradient presets */
  --grad-warm:linear-gradient(135deg,#FF9B85 0%,#FFB088 55%,#FFC089 100%);
  --grad-warm-deep:linear-gradient(135deg,#FF7E6B 0%,#FF9B85 50%,#FFB088 100%);
  --grad-cream:linear-gradient(160deg,#FFF8F0 0%,#FCEEDF 100%);
  --grad-caramel:linear-gradient(135deg,#D4A574 0%,#A67B5B 100%);
  --grad-cup:linear-gradient(180deg,#FFF8F0 0%,#FCEEDF 60%,#F5E0CC 100%);
  --grad-stage:linear-gradient(180deg,#FFF1E2 0%,#FCE2C8 45%,#F8D2AC 100%);
  --grad-matcha:linear-gradient(135deg,#C5D4A8 0%,#9CB57A 100%);
  --grad-peach:linear-gradient(135deg,#FFD9B8 0%,#FFB088 100%);
  --grad-title:linear-gradient(115deg,#A67B5B 0%,#FF9B85 48%,#E8B84B 100%);
  --grad-gold:linear-gradient(135deg,#FFE7B8 0%,#E8B84B 100%);

  --font:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Helvetica,Arial,sans-serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font);
  background:
    radial-gradient(1200px 620px at 18% -10%, #FFE7D1 0%, rgba(255,231,209,0) 60%),
    radial-gradient(900px 520px at 100% 110%, #FFD9D2 0%, rgba(255,217,210,0) 55%),
    radial-gradient(700px 400px at 50% 50%, rgba(255,217,184,.25) 0%, rgba(255,217,184,0) 70%),
    linear-gradient(160deg,#FFF3E6 0%,#FCE7D6 50%,#F8DCC8 100%);
  color:var(--cocoa);
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;
  overflow:hidden;
  position:relative;
}
/* dotted texture overlay */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(166,123,91,.10) 1.2px, transparent 1.2px);
  background-size:22px 22px;
  opacity:.55;z-index:0;
}
/* soft bokeh glow overlay */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(180px 180px at 12% 22%, rgba(255,200,170,.30), transparent 70%),
    radial-gradient(220px 220px at 88% 78%, rgba(255,180,180,.22), transparent 70%),
    radial-gradient(140px 140px at 70% 18%, rgba(197,212,168,.20), transparent 70%);
  filter:blur(2px);
}

/* ============ Phone Frame — milk tea cup inspired ============ */
.phone{
  position:relative;z-index:1;
  width:min(430px,100vw);
  height:min(880px,100vh);
  background:var(--grad-cup);
  border-radius:42px;
  box-shadow:
    0 36px 90px rgba(107,74,46,.30),
    0 0 0 10px rgba(255,255,255,.60),
    0 0 0 12px rgba(166,123,91,.14),
    inset 0 2px 0 rgba(255,255,255,.7);
  overflow:hidden;
  display:flex;flex-direction:column;
}
/* cup rim accent at the very top of the phone */
.phone::before{
  content:"";position:absolute;top:0;left:0;right:0;height:8px;z-index:60;pointer-events:none;
  background:linear-gradient(90deg, rgba(212,165,116,0) 0%, rgba(212,165,116,.55) 20%, rgba(255,176,136,.7) 50%, rgba(212,165,116,.55) 80%, rgba(212,165,116,0) 100%);
}
@media (max-width:460px){
  body{align-items:stretch;}
  .phone{width:100vw;height:100vh;border-radius:0;box-shadow:none;}
  .phone::before{border-radius:0;}
}

/* ============ Decorative floating emoji atmosphere ============ */
.deco-bg{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.deco-bg .deco{
  position:absolute;font-size:30px;opacity:.22;
  filter:blur(.3px) saturate(.9);
  animation:driftFloat 9s ease-in-out infinite;
}
.deco-bg .deco.d1{top:8%;left:6%;font-size:34px;animation-delay:0s;animation-duration:8s;}
.deco-bg .deco.d2{top:18%;right:8%;font-size:26px;animation-delay:1.2s;animation-duration:10s;}
.deco-bg .deco.d3{top:42%;left:4%;font-size:22px;animation-delay:2s;animation-duration:7.5s;}
.deco-bg .deco.d4{top:62%;right:5%;font-size:30px;animation-delay:.6s;animation-duration:9.5s;}
.deco-bg .deco.d5{bottom:14%;left:10%;font-size:24px;animation-delay:1.8s;animation-duration:8.5s;}
.deco-bg .deco.d6{bottom:8%;right:12%;font-size:28px;animation-delay:2.4s;animation-duration:11s;}
@keyframes driftFloat{
  0%,100%{transform:translateY(0) rotate(-6deg);}
  50%{transform:translateY(-22px) rotate(8deg);}
}

/* ============ Views ============ */
.view{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  padding:18px 18px calc(20px + env(safe-area-inset-bottom));
  opacity:0;visibility:hidden;
  transform:translateY(18px) scale(.98);
  transition:opacity .38s ease, transform .38s cubic-bezier(.2,1,.3,1), visibility .38s;
  overflow-y:auto;
  z-index:1;
}
.view.active{opacity:1;visibility:visible;transform:none;}
.view::-webkit-scrollbar{width:0;}

/* ============ Top Brand Bar ============ */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;flex:0 0 auto;
}
.brand-mini{
  display:flex;align-items:center;gap:8px;
  font-weight:900;font-size:15px;letter-spacing:.5px;
  color:var(--milk-coffee-deep);
}
.brand-mini .cup{
  font-size:22px;
  filter:drop-shadow(0 3px 5px rgba(166,123,91,.3));
}
.coin-pill{
  display:flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,#fff 0%,#FFF6EC 100%);
  padding:7px 14px;border-radius:999px;
  box-shadow:var(--shadow-press), var(--shadow-inset-warm);
  font-weight:900;font-size:13px;color:var(--cocoa);
  border:1px solid rgba(212,165,116,.25);
}

/* ============ Home View ============ */
.home-hero{
  flex:0 0 auto;
  text-align:center;
  padding:8px 6px 10px;
  position:relative;
  background:linear-gradient(160deg, rgba(255,241,226,.7) 0%, rgba(255,217,184,.45) 100%);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow-soft), inset 0 1px 0 rgba(255,255,255,.7);
  margin-bottom:14px;
  overflow:hidden;
}
/* faint sparkles inside hero */
.home-hero::before{
  content:"✨";position:absolute;top:14px;left:18px;font-size:14px;opacity:.5;
  animation:twinkle 3s ease-in-out infinite;
}
.home-hero::after{
  content:"🫧";position:absolute;bottom:12px;right:20px;font-size:18px;opacity:.4;
  animation:twinkle 4s ease-in-out infinite .8s;
}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.9);}50%{opacity:.7;transform:scale(1.15);}}

.home-cup-art{
  font-size:104px;margin:14px 0 6px;
  filter:drop-shadow(0 16px 22px rgba(166,123,91,.32));
  animation:cupBob 3.6s ease-in-out infinite;
  display:inline-block;
}
@keyframes cupBob{
  0%,100%{transform:translateY(0) rotate(-4deg) scale(1);}
  50%{transform:translateY(-12px) rotate(4deg) scale(1.03);}
}
.home-title{
  font-size:44px;line-height:1.02;font-weight:900;letter-spacing:2px;
  background:var(--grad-title);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  margin:0;
  filter:drop-shadow(0 2px 0 rgba(255,255,255,.55));
}
.home-sub{
  margin:8px 0 4px;font-size:13px;color:var(--milk-coffee-deep);
  font-weight:700;letter-spacing:1.5px;
  text-transform:none;
}
.home-sub::before,.home-sub::after{content:" — ";color:var(--milk-coffee);opacity:.6;}

.cta-primary{
  width:100%;border:none;cursor:pointer;
  padding:18px;border-radius:var(--r-md);
  background:var(--grad-warm-deep);
  color:#fff;font-size:19px;font-weight:900;letter-spacing:2px;
  box-shadow:var(--shadow-glow-pink), inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .14s ease, box-shadow .14s ease;
  display:flex;align-items:center;justify-content:center;gap:10px;
  min-height:56px;
  position:relative;
}
.cta-primary:active{
  transform:translateY(2px) scale(.97);
  box-shadow:0 6px 14px rgba(255,135,116,.4), inset 0 1px 0 rgba(255,255,255,.25);
}

.entry-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
.entry-card{
  background:linear-gradient(160deg,#fff 0%,#FFF8F0 100%);
  border:1px solid rgba(212,165,116,.18);cursor:pointer;border-radius:var(--r-md);
  padding:16px 14px;text-align:left;
  box-shadow:var(--shadow-soft), inset 0 1px 0 rgba(255,255,255,.8);
  transition:transform .14s ease, box-shadow .14s ease;
  display:flex;flex-direction:column;gap:8px;min-height:96px;
  position:relative;overflow:hidden;
}
.entry-card:active{transform:translateY(2px) scale(.98);box-shadow:var(--shadow-press);}
.entry-card .ic{
  font-size:26px;width:46px;height:46px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  background:var(--grad-peach);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6), 0 3px 8px rgba(255,176,136,.35);
}
.entry-card:nth-child(2) .ic{background:var(--grad-matcha);box-shadow:inset 0 1px 0 rgba(255,255,255,.6), 0 3px 8px rgba(156,181,122,.35);}
.entry-card .t{font-weight:900;font-size:16px;color:var(--cocoa);letter-spacing:.5px;}
.entry-card .s{font-size:11px;color:var(--milk-coffee-deep);font-weight:700;letter-spacing:.3px;}

.checkin-hint{
  margin-top:14px;
  background:linear-gradient(135deg, rgba(255,255,255,.85) 0%, rgba(255,241,226,.7) 100%);
  border:1.8px dashed var(--peach-deep);border-radius:var(--r-md);
  padding:13px 16px;display:flex;align-items:center;gap:11px;
  font-size:13px;font-weight:700;color:var(--milk-coffee-deep);
  box-shadow:var(--shadow-xs);
}
.checkin-hint .dot{
  width:11px;height:11px;border-radius:50%;background:var(--matcha);
  box-shadow:0 0 0 5px rgba(156,181,122,.28), 0 0 8px rgba(156,181,122,.5);
  flex:0 0 auto;animation:pulseDot 2s ease-in-out infinite;
}
.checkin-hint.done .dot{background:var(--gold);box-shadow:0 0 0 5px rgba(232,184,75,.28), 0 0 8px rgba(232,184,75,.55);}
@keyframes pulseDot{0%,100%{transform:scale(1);}50%{transform:scale(1.18);}}

.home-footer{
  margin-top:auto;padding-top:18px;text-align:center;
  font-size:11px;color:var(--milk-coffee);opacity:.75;font-weight:700;
  letter-spacing:1.5px;
}

/* ============ Game View ============ */
.game-view{padding:12px 14px 14px;}
.target-bar{
  flex:0 0 auto;
  background:linear-gradient(135deg,#fff 0%,#FFF8F0 100%);
  border-radius:var(--r-md);
  box-shadow:var(--shadow-soft), inset 0 1px 0 rgba(255,255,255,.8);
  border:1.5px dashed var(--peach-deep);
  padding:12px 14px;
  display:flex;align-items:center;gap:12px;margin-bottom:10px;
  position:relative;
}
/* order-ticket "torn corner" feel */
.target-bar::after{
  content:"";position:absolute;top:-1px;left:14px;right:14px;height:2px;
  background:repeating-linear-gradient(90deg, var(--peach-deep) 0 6px, transparent 6px 12px);
  opacity:.5;
}
.target-bar .emoji{
  font-size:38px;
  filter:drop-shadow(0 4px 6px rgba(166,123,91,.3));
  width:56px;height:56px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  background:var(--grad-cream);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8), 0 3px 8px rgba(166,123,91,.18);
  border:1.5px solid rgba(212,165,116,.25);
}
.target-bar .meta{flex:1;min-width:0;}
.target-bar .lbl{font-size:10px;color:var(--milk-coffee-deep);font-weight:800;letter-spacing:1.5px;text-transform:uppercase;}
.target-bar .name{font-size:19px;font-weight:900;color:var(--cocoa);line-height:1.1;letter-spacing:.5px;}
.target-bar .cal{font-size:12px;color:var(--pink-deep);font-weight:900;margin-top:2px;letter-spacing:.3px;}
.target-bar .progress-wrap{flex:0 0 auto;width:62px;}
.progress-track{
  height:10px;background:var(--cream-2);border-radius:999px;overflow:hidden;
  box-shadow:inset 0 1px 3px rgba(166,123,91,.25);
  position:relative;
}
.progress-fill{
  height:100%;width:0;
  background:linear-gradient(90deg,#FF7E6B 0%,#FF9B85 50%,#FFB088 100%);
  border-radius:999px;transition:width .3s ease;
  box-shadow:0 0 8px rgba(255,135,116,.5);
}
.progress-label{font-size:10px;color:var(--milk-coffee-deep);font-weight:900;margin-top:4px;text-align:center;letter-spacing:.5px;}

.next-bar{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  margin-bottom:8px;padding:0 4px;gap:8px;
}
.next-bar .next-lbl{font-size:12px;font-weight:800;color:var(--milk-coffee-deep);letter-spacing:.5px;}
.next-preview{
  display:flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,#fff 0%,#FFF6EC 100%);
  padding:7px 16px;border-radius:999px;
  box-shadow:var(--shadow-press), inset 0 1px 0 rgba(255,255,255,.8);
  border:1px solid rgba(212,165,116,.2);
  animation:nextFloat 2.6s ease-in-out infinite;
}
@keyframes nextFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
.next-preview .e{font-size:24px;filter:drop-shadow(0 2px 3px rgba(166,123,91,.25));}
.next-preview .t{font-size:11px;font-weight:900;color:var(--cocoa);letter-spacing:.5px;}
.btn-ghost{
  border:1.5px solid var(--peach-deep);background:linear-gradient(135deg,#fff 0%,#FFF8F0 100%);
  color:var(--milk-coffee-deep);
  padding:8px 16px;border-radius:999px;font-size:12px;font-weight:900;cursor:pointer;
  letter-spacing:.5px;
  transition:transform .12s, box-shadow .12s;
  box-shadow:var(--shadow-xs);
}
.btn-ghost:active{transform:scale(.95);box-shadow:none;}

.game-stage{
  position:relative;flex:1;min-height:0;
  background:var(--grad-stage);
  border-radius:var(--r-lg);
  box-shadow:
    inset 0 8px 22px rgba(166,123,91,.22),
    inset 0 -2px 12px rgba(255,255,255,.25),
    0 10px 24px rgba(107,74,46,.14);
  overflow:hidden;
  touch-action:none;
  border:1.5px solid rgba(212,165,116,.22);
}
/* cup interior highlight — soft top sheen + inner wall shadow */
.game-stage::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(120% 38% at 50% 0%, rgba(255,255,255,.55), transparent 60%),
    radial-gradient(80% 30% at 50% 100%, rgba(166,123,91,.12), transparent 70%);
}
.danger-line{
  position:absolute;left:0;right:0;top:64px;height:0;
  border-top:2px dashed var(--danger);
  z-index:5;opacity:.65;
}
.danger-line::after{
  content:"危险线";position:absolute;right:6px;top:-17px;
  font-size:9px;font-weight:900;color:#fff;
  background:linear-gradient(135deg,var(--danger),#D85555);
  padding:2px 8px;border-radius:999px;letter-spacing:.5px;
  box-shadow:0 2px 5px rgba(232,106,106,.4);
}
.danger-line.alarm{animation:alarm .5s ease-in-out infinite;}
@keyframes alarm{
  0%,100%{opacity:.5;border-top-color:var(--danger);}
  50%{opacity:1;background:rgba(232,106,106,.08);border-top-color:#FF4444;}
}

.drop-guide{
  position:absolute;top:0;width:2px;
  background:linear-gradient(180deg,rgba(255,126,107,.85),rgba(255,176,136,.3),transparent);
  pointer-events:none;z-index:4;display:none;
}
.drop-guide.show{display:block;}
.drop-guide::before{
  content:"▼";position:absolute;top:2px;left:50%;transform:translateX(-50%);
  color:var(--pink-deep);font-size:13px;
  text-shadow:0 1px 2px rgba(255,255,255,.6);
}

/* === INGREDIENT — base positioning rules preserved exactly === */
.ingredient{
  position:absolute;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;line-height:1;user-select:none;pointer-events:none;
  filter:drop-shadow(0 4px 6px rgba(107,74,46,.28));
  transform-origin:center;
  will-change:transform,left,top;
}
.ingredient.drop-in{animation:dropIn .25s ease;}
@keyframes dropIn{0%{transform:scale(.4);}100%{transform:scale(1);}}
.ingredient.pop{animation:pop .4s cubic-bezier(.2,1.4,.4,1);}
@keyframes pop{0%{transform:scale(.3);}60%{transform:scale(1.25);}100%{transform:scale(1);}}
.ingredient.merge-out{animation:mergeOut .25s ease forwards;}
@keyframes mergeOut{to{transform:scale(0);opacity:0;}}

.game-bottom{flex:0 0 auto;display:flex;gap:10px;margin-top:10px;}
.game-bottom .btn-ghost{flex:1;padding:12px;text-align:center;font-size:13px;}

/* ============ Result View ============ */
.result-view{align-items:center;justify-content:center;text-align:center;}
.result-card{
  width:100%;
  border-radius:var(--r-xl);
  box-shadow:var(--shadow-card), inset 0 1px 0 rgba(255,255,255,.7);
  padding:32px 24px;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  animation:rise .5s cubic-bezier(.2,1,.3,1);
  position:relative;overflow:hidden;
  background:linear-gradient(160deg,#FFF8F0 0%,#FFE9D6 60%,#FFD9B8 100%);
  border:1.5px solid rgba(255,176,136,.35);
}
/* win vs lose tinted backgrounds — detected via :has() on the tag (no JS changes) */
.result-card:has(.result-tag.win){
  background:linear-gradient(160deg,#FFF1E8 0%,#FFD9C8 50%,#FFB088 100%);
  border-color:rgba(255,135,116,.45);
  box-shadow:var(--shadow-card), 0 0 50px rgba(255,135,116,.25), inset 0 1px 0 rgba(255,255,255,.7);
}
.result-card:has(.result-tag.lose){
  background:linear-gradient(160deg,#F4F6E8 0%,#E0E8CC 50%,#C5D4A8 100%);
  border-color:rgba(156,181,122,.5);
}
/* confetti dots for win */
.result-card:has(.result-tag.win)::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:
    radial-gradient(circle at 12% 18%, var(--gold) 2px, transparent 3px),
    radial-gradient(circle at 88% 22%, var(--pink) 2px, transparent 3px),
    radial-gradient(circle at 20% 78%, var(--matcha) 2px, transparent 3px),
    radial-gradient(circle at 78% 82%, var(--peach-deep) 2px, transparent 3px),
    radial-gradient(circle at 50% 12%, var(--pink-deep) 1.5px, transparent 2.5px),
    radial-gradient(circle at 8% 50%, var(--gold-deep) 1.5px, transparent 2.5px);
  opacity:.7;animation:confettiShift 4s ease-in-out infinite;
}
@keyframes confettiShift{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}

@keyframes rise{0%{opacity:0;transform:translateY(30px) scale(.96);}100%{opacity:1;transform:none;}}
.result-emoji{
  font-size:88px;
  filter:drop-shadow(0 12px 18px rgba(166,123,91,.32)) drop-shadow(0 0 16px rgba(255,176,136,.4));
  animation:cupBob 2.8s ease-in-out infinite;
  z-index:1;
}
.result-tag{
  font-size:13px;font-weight:900;letter-spacing:2px;
  padding:6px 18px;border-radius:999px;z-index:1;
  box-shadow:0 4px 10px rgba(0,0,0,.08);
}
.result-tag.win{background:var(--grad-warm-deep);color:#fff;box-shadow:0 5px 14px rgba(255,135,116,.45);}
.result-tag.lose{background:var(--grad-matcha);color:#fff;box-shadow:0 5px 14px rgba(156,181,122,.4);}
.result-title{font-size:27px;font-weight:900;color:var(--cocoa);margin:2px 0;letter-spacing:1px;z-index:1;}

<script>
/* ============================================================
   奶茶大冒险 · 单文件演示
   ============================================================ */

/* ---------- 1. 奶茶菜单 / 合成阶梯 ----------
   L0→L4 为可合成的基础原料，L5 为目标奶茶（随机选定）。
   两个同级合成 → 下一级；两个 L4 合成 → L5 目标 → 胜利。
*/
const MENU = [
  { level:0, name:"茶叶",   emoji:"🍵", cal:0,   color:"#9CB57A" },
  { level:1, name:"牛奶",   emoji:"🥛", cal:30,  color:"#F4F1EA" },
  { level:2, name:"珍珠",   emoji:"🫧", cal:60,  color:"#C9A66B" },
  { level:3, name:"奶绿",   emoji:"🥤", cal:120, color:"#E8C28A" },
  { level:4, name:"芝士奶盖",emoji:"🧀", cal:200, color:"#F2D98C" },
];
const TARGET_TEAS = [
  { level:5, name:"芝芝莓莓", emoji:"🍓", cal:380 },
  { level:5, name:"杨枝甘露", emoji:"🥭", cal:420 },
  { level:5, name:"桃桃乌龙", emoji:"🍑", cal:320 },
  { level:5, name:"抹茶拿铁", emoji:"☕", cal:290 },
  { level:5, name:"满杯红柚", emoji:"🍊", cal:310 },
  { level:5, name:"珍珠奶茶", emoji:"🧋", cal:410 },
];
// 每种成分按真实轮廓设定横向/纵向半径（rx/ry），用于椭圆碰撞
// 不同形状接触面积不同 → 堆叠与合并难度提升
// 尺寸整体放大，原料占地更大，更易触警戒线，降低成功率
const SHAPES = [
  {rx:34, ry:24}, // L0 茶叶 🍵  茶杯：宽扁
  {rx:24, ry:33}, // L1 牛奶 🥛  牛奶盒：高瘦
  {rx:30, ry:30}, // L2 珍珠 🫧  近圆
  {rx:28, ry:40}, // L3 奶绿 🥤  杯+吸管：偏高
  {rx:40, ry:28}, // L4 芝士奶盖 🧀 奶酪：宽
  {rx:46, ry:43}, // L5 目标奶茶 大杯
];
// 椭圆在 angle 方向上的等效半径（轴线对齐）
function ellipseRadius(rx, ry, angle){
  const c = Math.cos(angle), s = Math.sin(angle);
  const d = Math.sqrt((ry*c)*(ry*c) + (rx*s)*(rx*s));
  return d ? (rx*ry)/d : Math.min(rx,ry);
}

/* ---------- 2. 视图路由 ---------- */
function showView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  const el = document.getElementById('view-'+name);
  if(el) el.classList.add('active');
  if(name==='home') updateHomeCheckinHint();
  if(name==='leaderboard') switchBoard('win');
  if(name==='checkin') renderCheckin();
}
function quitToHome(){ stopGame(); showView('home'); }

/* ---------- 3. Toast ---------- */
let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}

/* ---------- 4. 游戏状态与物理 ---------- */
const game = {
  stage:null, W:0, H:0,
  ingredients:[],      // {x,y,vx,vy,level,r,el,resting,mergeFlag}
  target:null,
  nextLevel:0,
  state:'idle',        // playing | won | lost | idle
  dangerY:64,
  dangerTime:0,
  rafId:null,
  canDrop:true,
  maxLevelReached:0,
};

function pickTarget(){
  return TARGET_TEAS[Math.floor(Math.random()*TARGET_TEAS.length)];
}
function pickDropLevel(){
  // 偏向低级，适度给中高级，保证可达成且有趣
  const r=Math.random();
  if(r<0.40) return 0;
  if(r<0.68) return 1;
  if(r<0.88) return 2;
  return 3;
}

function startNewGame(){
  stopGame();
  game.target = pickTarget();
  game.ingredients = [];
  game.state = 'playing';
  game.dangerTime = 0;
  game.canDrop = true;
  game.maxLevelReached = 0;
  game.nextLevel = pickDropLevel();

  // 渲染目标信息
  document.getElementById('targetEmoji').textContent = game.target.emoji;
  document.getElementById('targetName').textContent = game.target.name;
  document.getElementById('targetCal').textContent = game.target.cal + ' 大卡';
  updateProgress();

  showView('game');
  // 等视图渲染后初始化舞台尺寸
  requestAnimationFrame(()=>{
    initStage();
    renderNextPreview();
    startLoop();
  });
}

function initStage(){
  const stage = document.getElementById('gameStage');
  game.stage = stage;
  const rect = stage.getBoundingClientRect();
  game.W = rect.width;
  game.H = rect.height;
  game.dangerY = 64;
  // 清空旧元素
  stage.querySelectorAll('.ingredient').forEach(e=>e.remove());
}

function renderNextPreview(){
  const item = MENU[game.nextLevel];
  document.getElementById('nextEmoji').textContent = item.emoji;
}

function updateProgress(){
  const pct = Math.min(100, (game.maxLevelReached/5)*100);
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('progressLabel').textContent = 'L'+game.maxLevelReached;
}

/* ----- 投放 ----- */
function setupStageInput(){
  const stage = document.getElementById('gameStage');
  const guide = document.getElementById('dropGuide');

  function getX(e){
    const rect = stage.getBoundingClientRect();
    const cx = (e.touches? e.touches[0].clientX : e.clientX) - rect.left;
    return cx;
  }
  function moveGuide(e){
    const x = getX(e);
    const sh = SHAPES[game.nextLevel] || SHAPES[0];
    const clamped = Math.max(sh.rx, Math.min(game.W - sh.rx, x));
    guide.style.left = (clamped - 1) + 'px';
    guide.style.height = (game.dangerY + 10) + 'px';
    guide.classList.add('show');
  }
  function hideGuide(){ guide.classList.remove('show'); }
  function drop(e){
    e.preventDefault();
    if(game.state!=='playing' || !game.canDrop) return;
    const x = getX(e);
    const sh = SHAPES[game.nextLevel] || SHAPES[0];
    const clamped = Math.max(sh.rx, Math.min(game.W - sh.rx, x));
    spawnIngredient(game.nextLevel, clamped, 18 + sh.ry, true);
    game.canDrop = false;
    setTimeout(()=>{ game.canDrop = true; }, 380);
    // 预备下一个
    game.nextLevel = pickDropLevel();
    renderNextPreview();
    hideGuide();
  }
  // 防止重复绑定
  stage.onmousemove = moveGuide;
  stage.onmouseleave = hideGuide;
  stage.ontouchmove = moveGuide;
  stage.ontouchend = hideGuide;
  stage.onclick = drop;
  stage.ontouchstart = drop;
}
setupStageInput();

function spawnIngredient(level, x, y, isDrop){
  const sh = SHAPES[level] || SHAPES[0];
  const item = MENU[level];
  const el = document.createElement('div');
  el.className = 'ingredient' + (isDrop?' drop-in':'');
  el.style.width = (sh.rx*2)+'px';
  el.style.height = (sh.ry*2)+'px';
  el.style.fontSize = (Math.min(sh.rx, sh.ry)*1.85)+'px';
  el.textContent = item.emoji;
  el.style.left = (x - sh.rx)+'px';
  el.style.top = (y - sh.ry)+'px';
  game.stage.appendChild(el);
  const ing = {
    level, rx:sh.rx, ry:sh.ry, x, y, vx:0, vy:0, el,
    resting:false, mergeFlag:false
  };
  game.ingredients.push(ing);
  if(level > game.maxLevelReached){
    game.maxLevelReached = level;
    updateProgress();
  }
  return ing;
}

/* ----- 主循环 ----- */
function startLoop(){
  if(game.rafId) cancelAnimationFrame(game.rafId);
  const loop = ()=>{ step(); game.rafId = requestAnimationFrame(loop); };
  game.rafId = requestAnimationFrame(loop);
}
function stopGame(){
  if(game.rafId){ cancelAnimationFrame(game.rafId); game.rafId=null; }
  game.state='idle';
}

const GRAVITY = 0.42;
const FRICTION = 0.985;
const REST_VEL = 0.4;

function step(){
  if(game.state!=='playing') return;
  const W=game.W, H=game.H;
  const dt = 1; // 帧步长

  // 1. 应用重力 + 位移
  for(const ing of game.ingredients){
    if(ing.mergeFlag) continue;
    ing.vy += GRAVITY * dt;
    ing.x += ing.vx * dt;
    ing.y += ing.vy * dt;
    ing.vx *= FRICTION;
    // 墙壁（按横向半径 rx）
    if(ing.x - ing.rx < 0){ ing.x = ing.rx; ing.vx = Math.abs(ing.vx)*0.3; }
    if(ing.x + ing.rx > W){ ing.x = W - ing.rx; ing.vx = -Math.abs(ing.vx)*0.3; }
    // 地板（按纵向半径 ry）
    if(ing.y + ing.ry > H){ ing.y = H - ing.ry; ing.vy = -ing.vy*0.18; ing.vx*=0.7; if(Math.abs(ing.vy)<REST_VEL) ing.vy=0; ing.resting=true; }
    else { ing.resting=false; }
  }

  // 2. 先收集需要合并的对（避免遍历时修改数组）
  // 使用椭圆方向半径：不同形状接触面积不同，合并判定更贴近真实轮廓
  const mergePairs = [];
  const willMerge = new Set();
  for(let i=0;i<game.ingredients.length;i++){
    for(let j=i+1;j<game.ingredients.length;j++){
      const a=game.ingredients[i], b=game.ingredients[j];
      if(willMerge.has(a)||willMerge.has(b)) continue;
      const dx=b.x-a.x, dy=b.y-a.y;
      let dist=Math.hypot(dx,dy);
      if(dist===0) dist=0.01;
      const ang=Math.atan2(dy,dx);
      const ra=ellipseRadius(a.rx,a.ry,ang);
      const rb=ellipseRadius(b.rx,b.ry,ang);
      const minDist=ra+rb;
      if(dist<minDist && a.level===b.level && a.level<5){
        mergePairs.push([a,b]);
        willMerge.add(a); willMerge.add(b);
      }
    }
  }
  // 3. 推开（非合并项 + 多趟提升稳定性）
  for(let pass=0; pass<3; pass++){
    for(let i=0;i<game.ingredients.length;i++){
      for(let j=i+1;j<game.ingredients.length;j++){
        const a=game.ingredients[i], b=game.ingredients[j];
        if(willMerge.has(a)||willMerge.has(b)) continue;
        const dx=b.x-a.x, dy=b.y-a.y;
        let dist=Math.hypot(dx,dy);
        if(dist===0){ dist=0.01; }
        const ang=Math.atan2(dy,dx);
        const ra=ellipseRadius(a.rx,a.ry,ang);
        const rb=ellipseRadius(b.rx,b.ry,ang);
        const minDist=ra+rb;
        if(dist<minDist){
          const nx=dx/dist, ny=dy/dist;
          const overlap=minDist-dist;
          a.x -= nx*overlap*0.5;
          a.y -= ny*overlap*0.5;
          b.x += nx*overlap*0.5;
          b.y += ny*overlap*0.5;
          if(ny<0){ a.vy -= 0.2; b.vy += 0.2; }
          a.vy *= 0.92; b.vy *= 0.92;
          a.vx *= 0.8; b.vx *= 0.8;
        }
      }
    }
  }
  // 4. 安全执行合并（此时已脱离遍历）
  for(const [a,b] of mergePairs){ mergeIngredients(a,b); }

  // 5. 更新 DOM 位置
  for(const ing of game.ingredients){
    if(ing.el){
      ing.el.style.left = (ing.x - ing.rx)+'px';
      ing.el.style.top = (ing.y - ing.ry)+'px';
    }
  }

  // 6. 危险线检测
  let inDanger=false;
  for(const ing of game.ingredients){
    if(ing.mergeFlag) continue;
    if((ing.y - ing.ry) < game.dangerY && Math.abs(ing.vy)<0.6){
      inDanger=true; break;
    }
  }
  const dl = document.getElementById('dangerLine');
  if(inDanger){
    dl.classList.add('alarm');
    game.dangerTime += 16;
    if(game.dangerTime > 1500){ gameLose(); return; }
  } else {
    dl.classList.remove('alarm');
    game.dangerTime = Math.max(0, game.dangerTime-24);
  }
}

function mergeIngredients(a,b){
  a.mergeFlag=true; b.mergeFlag=true;
  const newLevel = a.level+1;
  const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
  // 移除两个旧元素
  if(a.el){ a.el.classList.add('merge-out'); setTimeout(()=>a.el&&a.el.remove(),200); }
  if(b.el){ b.el.classList.add('merge-out'); setTimeout(()=>b.el&&b.el.remove(),200); }
  game.ingredients = game.ingredients.filter(x=>x!==a && x!==b);

  if(newLevel>=5){
    // 合成目标 → 胜利
    const el = document.createElement('div');
    el.className='ingredient pop';
    const sh=SHAPES[5];
    el.style.width=(sh.rx*2)+'px'; el.style.height=(sh.ry*2)+'px'; el.style.fontSize=(Math.min(sh.rx,sh.ry)*1.85)+'px';
    el.style.filter='drop-shadow(0 0 14px rgba(255,180,136,.9)) drop-shadow(0 6px 10px rgba(107,74,46,.3))';
    el.textContent=game.target.emoji;
    el.style.left=(mx-sh.rx)+'px'; el.style.top=(my-sh.ry)+'px';
    game.stage.appendChild(el);
    setTimeout(()=>el.remove(),900);
    game.maxLevelReached=5; updateProgress();
    gameWin();
    return;
  }
  // 生成下一级
  const ng = spawnIngredient(newLevel, mx, my, false);
  ng.el.classList.add('pop');
}

/* ---------- 5. 胜负 ---------- */
function gameWin(){
  if(game.state!=='playing') return;
  game.state='won';
  setTimeout(()=>{ stopGame(); showResult('win'); }, 600);
}
function gameLose(){
  if(game.state!=='playing') return;
  game.state='lost';
  // 计算省下卡路里
  let saved=0;
  for(const ing of game.ingredients){ saved += MENU[ing.level].cal; }
  if(saved===0) saved = Math.round(game.target.cal*0.6);
  game.savedCal = saved;
  setTimeout(()=>{ stopGame(); showResult('lose'); }, 400);
}

/* ---------- 6. 结果页 ---------- */
function showResult(type){
  const card=document.getElementById('resultCard');
  const emoji=document.getElementById('resultEmoji');
  const tag=document.getElementById('resultTag');
  const title=document.getElementById('resultTitle');
  const cal=document.getElementById('resultCal');
  const msg=document.getElementById('resultMsg');
  const shareBtn=document.getElementById('resultShareBtn');

  if(type==='win'){
    emoji.textContent='🎉';
    tag.textContent='合成成功';
    tag.className='result-tag win';
    title.textContent=game.target.name+' '+game.target.emoji;
    cal.textContent=game.target.cal+' 大卡 · 奖励自己这杯吧！';
    msg.textContent='心安理得地喝～你值得这一杯甜蜜！';
    shareBtn.style.display='';
    shareBtn.onclick=()=>openShare({
      emoji:game.target.emoji,
      title:'我合成了 '+game.target.name+'！',
      caption:'奶茶大冒险 · '+game.target.cal+' 大卡的快乐'
    });
  } else {
    emoji.textContent='💪';
    tag.textContent='挑战失败';
    tag.className='result-tag lose';
    title.textContent='省下了 '+game.savedCal+' 大卡';
    cal.textContent='目标本是 '+game.target.name+' '+game.target.emoji+'（'+game.target.cal+' 大卡）';
    msg.textContent='今天的卡路里，奶茶替你存起来啦！明天再战～';
    shareBtn.style.display='';
    shareBtn.onclick=()=>openShare({
      emoji:'💪',
      title:'我省下了 '+game.savedCal+' 大卡！',
      caption:'奶茶大冒险 · 越挫越勇'
    });
  }
  showView('result');
}

/* ---------- 7. 排行榜 ---------- */
const MOCK_USERS = [
  {nick:"奶绿少女",   avatar:"🧋", cups:7, saved:820},
  {nick:"珍珠控",     avatar:"🫧", cups:5, saved:1240},
  {nick:"芝士星球",   avatar:"🧀", cups:9, saved:430},
  {nick:"莓莓不离手", avatar:"🍓", cups:4, saved:960},
  {nick:"桃桃乌龙控", avatar:"🍑", cups:6, saved:560},
  {nick:"芒果特工",   avatar:"🥭", cups:3, saved:1520},
  {nick:"拿铁诗人",   avatar:"☕", cups:8, saved:380},
  {nick:"红柚少女",   avatar:"🍊", cups:2, saved:1100},
  {nick:"茶小白",     avatar:"🍵", cups:1, saved:1380},
];
const ME = {nick:"我", avatar:"😎", cups:0, saved:0};

function switchBoard(tab){
  document.querySelectorAll('.lb-tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===tab));
  const list=document.getElementById('lbList');
  let data;
  if(tab==='win'){
    data=[...MOCK_USERS].sort((a,b)=>b.cups-a.cups);
  } else {
    data=[...MOCK_USERS].sort((a,b)=>b.saved-a.saved);
  }
  // 把当前玩家成绩也塞进去
  const meClone = tab==='win'
    ? {...ME, cups: (game.state==='won'?1:0)}
    : {...ME, saved: (game.savedCal||0)};
  data.push(meClone);
  data.sort((a,b)=> tab==='win' ? b.cups-a.cups : b.saved-a.saved);

  list.innerHTML='';
  data.forEach((u,i)=>{
    const rank=i+1;
    const topClass = rank<=3 ? 'top'+rank : '';
    const rankIcon = rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':rank;
    const value = tab==='win' ? (u.cups+' 杯') : (u.saved+' 大卡');
    const meFlag = u===meClone ? '（我）' : '';
    const div=document.createElement('div');
    div.className='lb-item '+topClass;
    div.innerHTML =
      '<div class="lb-rank">'+rankIcon+'</div>'+
      '<div class="lb-avatar">'+u.avatar+'</div>'+
      '<div class="lb-name">'+u.nick+meFlag+'</div>'+
      '<div class="lb-value">'+value+'</div>';
    list.appendChild(div);
  });
}
document.getElementById('lbShareBtn').onclick=()=>openShare({
  emoji:'🏆', title:'奶茶大冒险排行榜', caption:'来比比谁喝得多，又省得多～'
});

/* ---------- 8. 签到 ---------- */
function todayKey(){ const d=new Date(); return 'milktea_checkin_'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const REWARDS = [
  {emoji:"🪙", title:"+10 积分", desc:"积少成多，兑换好礼"},
  {emoji:"🛡️", title:"获得道具：卡路里护盾", desc:"下次失败可减免 100 大卡"},
  {emoji:"🍀", title:"+15 积分", desc:"幸运签，好运连连"},
  {emoji:"🧋", title:"奶茶券 x1", desc:"可兑换任意一杯目标奶茶"},
];
function getCheckinHistory(){
  const arr=[];
  for(let i=0;i<Object.keys(localStorage).length;i++){
    const k=Object.keys(localStorage)[i];
    if(k.startsWith('milktea_checkin_')){
      arr.push({date:k.replace('milktea_checkin_',''), reward:localStorage.getItem(k)});
    }
  }
  arr.sort((a,b)=>b.date.localeCompare(a.date));
  return arr.slice(0,7);
}
function isCheckedInToday(){ return !!localStorage.getItem(todayKey()); }
function doCheckin(){
  if(isCheckedInToday()){ toast('今日已签到'); return; }
  const reward = REWARDS[Math.floor(Math.random()*REWARDS.length)];
  localStorage.setItem(todayKey(), JSON.stringify(reward));
  // 积分累加
  let coins = parseInt(localStorage.getItem('milktea_coins')||'120',10);
  if(reward.title.includes('积分')){
    const m = parseInt(reward.title.match(/\d+/)?.[0]||'0',10);
    coins += m;
    localStorage.setItem('milktea_coins', coins);
    document.getElementById('homeCoins').textContent = coins;
  }
  renderCheckin();
  updateHomeCheckinHint();
  toast('签到成功！');
}
function renderCheckin(){
  const btn=document.getElementById('checkinBtn');
  const area=document.getElementById('rewardArea');
  const hist=document.getElementById('historyList');
  const checked = isCheckedInToday();
  btn.disabled = checked;
  btn.textContent = checked ? '✅ 今日已签到' : '签到领奖励';

  if(checked){
    const raw = localStorage.getItem(todayKey());
    let reward={emoji:"🎁",title:"已签到",desc:"明天再来"};
    try{ reward=JSON.parse(raw); }catch(e){}
    area.innerHTML =
      '<div class="reward-card">'+
        '<div class="r-emoji">'+reward.emoji+'</div>'+
        '<div class="r-title">'+reward.title+'</div>'+
        '<div class="r-desc">'+reward.desc+'</div>'+
      '</div>';
  } else {
    area.innerHTML='';
  }
  // 历史
  hist.innerHTML='';
  const h=getCheckinHistory();
  if(h.length===0){
    hist.innerHTML='<div class="history-item" style="justify-content:center;color:var(--milk-coffee)">还没有签到记录</div>';
  } else {
    h.forEach(r=>{
      let reward={emoji:"🎁",title:"奖励",desc:""};
      try{ reward=JSON.parse(r.reward); }catch(e){}
      const div=document.createElement('div');
      div.className='history-item';
      div.innerHTML='<span style="font-size:18px">'+reward.emoji+'</span><span class="h-date">'+r.date+'</span><span style="margin-left:auto;font-weight:800;color:var(--cocoa)">'+reward.title+'</span>';
      hist.appendChild(div);
    });
  }
}
function updateHomeCheckinHint(){
  const checked=isCheckedInToday();
  const hint=document.getElementById('homeCheckinHint');
  const text=document.getElementById('homeCheckinText');
  if(checked){
    hint.classList.add('done');
    text.textContent='今日已签到 ✅ 明天记得再来';
  } else {
    hint.classList.remove('done');
    text.textContent='今日还未签到，记得来一杯～';
  }
  document.getElementById('homeCoins').textContent = localStorage.getItem('milktea_coins')||'120';
}

/* ---------- 9. 分享弹窗 ---------- */
function openShare(payload){
  document.getElementById('scEmoji').textContent = payload.emoji||'🧋';
  document.getElementById('scTitle').textContent = payload.title||'奶茶大冒险';
  document.getElementById('scCaption').textContent = payload.caption||'来挑战合成你的那杯奶茶～';
  document.getElementById('shareModal').classList.add('show');
}
function closeShare(){ document.getElementById('shareModal').classList.remove('show'); }
function doShare(target){
  closeShare();
  toast(target==='friend'?'已分享给微信好友（模拟）':'已分享到朋友圈（模拟）');
}

/* ---------- 初始化 ---------- */
updateHomeCheckinHint();
// 防止页面滚动反弹
document.addEventListener('touchmove', e=>{ if(e.target.closest('.game-stage')) e.preventDefault(); }, {passive:false});
</script>
