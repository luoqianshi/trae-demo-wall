/* ============ 渲染入口 ============ */
function render(){
  var app=$('app');
  var html = renderHeader() + '<div class="page fade-in">'+renderPage()+'</div>';
  if(isTabbed(S.page)) html += renderNav();
  app.innerHTML = html;
  window.scrollTo(0,0);
}
function isTabbed(p){ return ['home','tree','feed','messages','profile'].indexOf(p)>=0; }


function renderHeader(){
  var titles={tree:'族谱树',person:'人物详情',feed:'动态圈',feedDetail:'动态',memorial:'纪念馆',aiBuild:'AI智能建谱',events:'家族活动',eventCreate:'发起活动',eventDetail:'活动详情',messages:'消息',messageDetail:'消息详情',profile:'我的',profileEdit:'编辑资料',genQuery:'字辈查询',treeList:'我的家族',addPerson:'添加人物',postCreate:'发布动态'};
  var showBack = !isTabbed(S.page);
  var title = titles[S.page]||'';
  var right = '';
  if(S.page==='home') right='<button class="action" onclick="toast(\'扫一扫功能开发中\')">'+ic('scan',22)+'</button>';
  if(S.page==='tree') right='<button class="action" onclick="toast(\'搜索族人\')">'+ic('search',22)+'</button><button class="action" onclick="go(\'addPerson\')">'+ic('plus',22)+'</button>';
  if(S.page==='feed') right='<button class="action" onclick="go(\'postCreate\')">'+ic('edit',22)+'</button>';
  if(S.page==='events') right='<button class="action" onclick="go(\'eventCreate\')">'+ic('plus',22)+'</button>';
  if(showBack){
    return '<div class="header"><button class="back" onclick="back()">'+ic('back',24)+'</button><h1 class="song">'+title+'</h1><span style="width:34px"></span></div>';
  }
  if(S.page==='home'){
    return '<div class="header"><span style="width:34px"></span><h1 class="song row center gap2"><img src="logo.jpg" alt="族链" style="width:32px;height:32px;border-radius:8px;object-fit:cover;flex-shrink:0"><span>族链</span></h1>'+right+'<span style="width:'+(right?0:34)+'px"></span></div>';
  }
  return '<div class="header"><span style="width:34px"></span><h1 class="song">'+title+'</h1>'+right+'<span style="width:'+(right?0:34)+'px"></span></div>';
}

function renderPage(){
  switch(S.page){
    case 'home': return pageHome();
    case 'tree': return pageTree();
    case 'person': return pagePerson(S.params.id);
    case 'feed': return pageFeed();
    case 'feedDetail': return pageFeedDetail(S.params.id);
    case 'postCreate': return pagePostCreate();
    case 'memorial': return pageMemorial();
    case 'aiBuild': return pageAiBuild();
    case 'events': return pageEvents();
    case 'eventCreate': return pageEventCreate();
    case 'eventDetail': return pageEventDetail(S.params.id);
    case 'addPerson': return pageAddPerson();
    case 'messages': return pageMessages();
    case 'messageDetail': return pageMessageDetail(S.params.id);
    case 'profile': return pageProfile();
    case 'profileEdit': return pageProfileEdit();
    case 'genQuery': return pageGenQuery();
    case 'treeList': return pageTreeList();
    case 'myPosts': return pageFeed({tab:'mine'});
    default: return pageHome();
  }
}

function go(page,params){
  if(isTabbed(page)){ S.history=[]; }
  else { S.history.push({page:S.page, params:S.params}); }
  S.page=page; S.params=params||{}; render();
}
function back(){
  var prev = S.history.length ? S.history.pop() : {page:'home', params:{}};
  S.page=prev.page; S.params=prev.params; render();
}

/* ============ 族谱树（SVG） ============ */
function pageTree(){
  if(S.params && S.params.view){ S.treeView = S.params.view; S.params.view = null; }
  // 层次布局：gen 1 -> 5
  var gens=[1,2,3,4,5];
  var W=440, padX=20, padY=20, nodeW=88, nodeH=54, dx=12, dy=80;
  // 计算每代节点
  var byGen={};
  gens.forEach(function(g){ byGen[g]=D.persons.filter(function(p){return p.gen===g;}); });
  // 排序：配偶相邻
  function sortPair(arr){
    if(arr.length<=1) return arr;
    var res=[], used={};
    arr.forEach(function(p){ if(used[p.id]) return; res.push(p); used[p.id]=1; var sp=spouseOf(p.id); if(sp&&arr.indexOf(sp)>=0&&!used[sp.id]){ res.push(sp); used[sp.id]=1; } });
    return res;
  }
  Object.keys(byGen).forEach(function(g){ byGen[g]=sortPair(byGen[g]); });
  var maxCount = Math.max.apply(null, gens.map(function(g){return byGen[g].length;}));
  var canvasW = Math.max(W, maxCount*(nodeW+dx)+padX*2);
  var canvasH = 5*dy + nodeH + padY*2;
  // 计算坐标
  var pos={};
  gens.forEach(function(g){
    var list=byGen[g]; var n=list.length;
    var totalW = n*(nodeW+dx)-dx;
    var startX = (canvasW-totalW)/2;
    list.forEach(function(p,i){ pos[p.id]={x:startX+i*(nodeW+dx), y:padY+(g-1)*dy, p:p}; });
  });
  // 连线
  var lines='';
  D.rels.forEach(function(r){
    if(r.type==='spouse'){
      var a=pos[r.f], b=pos[r.t];
      if(!a||!b) return;
      var x1=a.x+nodeW, x2=b.x, y=a.y+nodeH/2;
      lines+='<line x1="'+x1+'" y1="'+y+'" x2="'+x2+'" y2="'+y+'" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="3,2"/>';
    }
    if(r.type==='parent'){
      var par=pos[r.f], chi=pos[r.t];
      if(!par||!chi) return;
      var mx=par.x+nodeW/2, my=par.y+nodeH, cx=chi.x+nodeW/2, cy=chi.y;
      var midY=(my+cy)/2;
      lines+='<path d="M'+mx+' '+my+' V'+midY+' H'+cx+' V'+cy+'" fill="none" stroke="#A0522D" stroke-width="1.5" opacity=".55"/>';
    }
  });
  // 节点
  var nodes='';
  gens.forEach(function(g){
    byGen[g].forEach(function(p){
      var po=pos[p.id]; var cls=['node',p.gender===2?'female':'male',p.living?'':'dead',p.id===D.user.boundPersonId?'me':''].join(' ');
      var av='<span class="av avatar '+(p.gender===2?'female':'male')+'">'+(p.avatar?'<img src="'+p.avatar+'" alt="">':p.name.slice(-1))+'</span>';
      var yr=(p.birth||'?').slice(0,4)+(p.death?('–'+p.death.slice(0,4)):'');
      nodes+='<div class="'+cls+'" style="left:'+po.x+'px;top:'+po.y+'px" onclick="go(\'person\',{id:\''+p.id+'\'})">'+av+
        '<div class="col min0"><div class="nm">'+p.name+'</div><div class="yr">'+yr+'</div></div></div>';
    });
  });
  // 代际标签
  var genLabels=gens.map(function(g){
    return '<div style="position:absolute;left:4px;top:'+(padY+(g-1)*dy+18)+'px;font-size:11px;color:var(--gold-l);font-weight:600">第'+['一','二','三','四','五'][g-1]+'代</div>';
  }).join('');
  var tabHtml='<div class="tab-bar mb3">'+
    '<div class="t'+(S.treeView==='tree'?' active':'')+'" onclick="switchTreeView(\'tree\')">树状图</div>'+
    '<div class="t'+(S.treeView==='list'?' active':'')+'" onclick="switchTreeView(\'list\')">列表</div>'+
    '<div class="t'+(S.treeView==='gen'?' active':'')+'" onclick="switchTreeView(\'gen\')">世代</div></div>';
  var viewHtml='';
  if(S.treeView==='tree'){
    viewHtml='<div style="position:relative;overflow:auto;border-radius:12px;background:linear-gradient(180deg,#FDF8F3,#FAF3EC);border:1px solid var(--line)">'+
      '<div style="position:relative;width:'+canvasW+'px;height:'+canvasH+'px;min-width:100%">'+
        '<svg width="'+canvasW+'" height="'+canvasH+'" style="position:absolute;left:0;top:0;pointer-events:none">'+lines+'</svg>'+
        genLabels+nodes+
      '</div></div>';
  }else if(S.treeView==='list'){
    viewHtml=gens.map(function(g){
      var list=byGen[g];
      return '<div class="mb3"><div class="row between mb2"><span class="fw-s song brown">第'+['一','二','三','四','五'][g-1]+'代</span><span class="fs-xs muted">'+list.length+'人</span></div>'+
        list.map(function(p){ return '<div class="card p3 mb2 row gap3" style="cursor:pointer" onclick="go(\'person\',{id:\''+p.id+'\'})"><span class="avatar '+(p.gender===2?'female':'male')+'" style="width:40px;height:40px;font-size:14px">'+(p.avatar?'<img src="'+p.avatar+'" alt="">':p.name.slice(-1))+'</span><div class="flex1 min0"><div class="fw-s">'+p.name+(p.genChar?(' · '+p.genChar):'')+'</div><div class="fs-xs muted">'+((p.birth||'?').slice(0,4)+(p.death?('–'+p.death.slice(0,4)):''))+'</div></div><span class="muted">›</span></div>'; }).join('')+
      '</div>';
    }).join('');
  }else{
    var cg=S.treeGen||3;
    var genTabs='<div class="scroll-x row gap2 mb3">'+gens.map(function(g){ return '<button class="btn '+(g===cg?'btn-primary':'btn-outline')+'" style="height:36px;padding:0 14px;flex-shrink:0" onclick="switchTreeGen('+g+')">第'+['一','二','三','四','五'][g-1]+'代</button>'; }).join('')+'</div>';
    var glist=byGen[cg]||[];
    viewHtml=genTabs+'<div class="grid2">'+glist.map(function(p){ return '<div class="card p3" style="cursor:pointer" onclick="go(\'person\',{id:\''+p.id+'\'})"><div class="col center gap2"><span class="avatar '+(p.gender===2?'female':'male')+'" style="width:54px;height:54px;font-size:18px">'+(p.avatar?'<img src="'+p.avatar+'" alt="">':p.name.slice(-1))+'</span><div class="fw-s">'+p.name+'</div><div class="fs-xs muted">'+(p.genChar||'')+'</div></div></div>'; }).join('')+'</div>';
  }
  return '<div class="card p3 mb3"><div class="row between mb2"><div class="fw-s song brown">陇西李氏 · 族谱树</div><div class="fs-xs muted">5代 · 9人</div></div>'+
    '<div class="fs-xs muted mb3">字辈诗：'+D.trees[0].genPoem+'</div>'+
    tabHtml+viewHtml+'</div>'+
    '<div class="row gap3 mb3">'+
      '<button class="btn btn-outline flex1 row center gap2" style="height:42px" onclick="switchTreeView(\'tree\');toast(\'已重置视图\')">'+ic('reset',18)+' 重置</button>'+
      '<button class="btn btn-primary flex1 row center gap2" style="height:42px" onclick="go(\'addPerson\')">'+ic('plus',18)+' 添加人物</button>'+
    '</div>'+
    '<div class="card p3"><div class="fw-s mb2 song brown">最近访客</div>'+
      D.members.slice(0,3).map(function(m){ return '<div class="row gap3 py3" style="border-bottom:1px solid rgba(232,201,160,.4)"><span class="avatar" style="width:36px;height:36px;font-size:13px"><img src="'+m.avatar+'" alt=""></span><div class="flex1 min0"><div class="fw-m">'+m.nick+'</div><div class="fs-xs muted">'+({creator:'族长',admin:'管理员',editor:'编辑',viewer:'成员'}[m.role])+'</div></div><button class="fs-sm orange row gap1" onclick="toast(\'私信功能开发中\')">'+ic('comment',16)+' 私信</button></div>'; }).join('')+

function publishPost(){

function pickGender(g){
  var m=document.getElementById('np_male'), f=document.getElementById('np_female');
  if(g===1){ m.className='btn btn-primary flex1'; f.className='btn flex1'; }
  else { f.className='btn btn-primary flex1'; m.className='btn flex1'; }
  S._newGender=g;
}
function savePerson(){
  var name=document.getElementById('np_name').value.trim();
  if(!name){ toast('请输入姓名'); return; }
  var fid=document.getElementById('np_father').value;
  var spid=document.getElementById('np_spouse').value;
  var gen=1;
  if(fid){ var f=personById(fid); if(f) gen=f.gen+1; }
  else if(spid){ var s=personById(spid); if(s) gen=s.gen; }
  var pid='p_new_'+Date.now();
  var birth=document.getElementById('np_birth').value.trim();
  var np={id:pid,name:name,gender:S._newGender||1,gen:gen,genChar:document.getElementById('np_gen').value.trim()||'',birth:birth||null,death:document.getElementById('np_death').value.trim()||null,living:!(document.getElementById('np_death').value.trim()),avatar:'',bio:document.getElementById('np_bio').value.trim()||'新添加的家族成员'};
  D.persons.push(np);
  if(fid) D.rels.push({type:'parent',f:fid,t:pid});
  if(spid) D.rels.push({type:'spouse',f:pid,t:spid});
  toast('已添加「'+name+'」'); go('tree');
}

function sendReply(id){
  var inp=document.getElementById('replyInput'); var v=inp.value.trim();

  var now=new Date(); var t=(now.getMonth()+1)+'-'+now.getDate()+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  S.msgReplies[id].push({text:v, time:t});
  toast('回复成功'); render();
}

/* ============ 字辈查询 ============ */
function pageGenQuery(){
  var poem='世德传家远　宗功裕后长';
  var chars=poem.replace(/\s/g,'').split('');
  var byGen={};
  D.persons.forEach(function(p){
    var genChar = p.genName || chars[p.gen-1] || '—';
    if(!byGen[genChar]) byGen[genChar]=[];
    byGen[genChar].push(p);
  });
  var listHtml=Object.keys(byGen).map(function(c){
    var arr=byGen[c];
    var genIdx=chars.indexOf(c)+1;
    return '<div class="card p4 mb3">'+
      '<div class="row gap2 mb3"><span class="ribbon r-gold">'+c+'</span><span class="fs-sm muted">第'+genIdx+'代 · '+arr.length+'人</span></div>'+
      '<div class="row gap2 wrap">'+
        arr.map(function(p){
          return '<div style="cursor:pointer" onclick="go(\'person\',{id:\''+p.id+'\'})"><span class="avatar" style="width:32px;height:32px;font-size:11px;'+(p.gender===2?'background:#FCE7F3;color:#BE185D':'')+'">'+(p.name.slice(0,1))+'</span><div class="fs-xs brown tc mt1">'+p.name+'</div></div>';
        }).join('')+
      '</div></div>';
  }).join('');
  return '<div class="card p4 mb4" style="background:linear-gradient(135deg,#FFF7ED,#FED7AA)">'+
    '<div class="fw-b song brown mb2">'+ic('search',18)+' 字辈查询</div>'+
    '<div class="fs-xs muted">陇西李氏字辈诗</div>'+
    '<div class="song fs-lg brown tc mt3" style="letter-spacing:4px;line-height:2">'+poem+'</div></div>'+
    '<div class="card p4 mb3"><div class="row gap2"><input id="gqInput" class="field flex1" style="height:40px" placeholder="输入姓名查字辈" oninput="queryGen(this.value)"><span style="color:var(--orange-d);display:flex;align-items:center">'+ic('search',20)+'</span></div>'+
    '<div id="gqResult"></div></div>'+
    '<div class="fw-s song brown mb2">'+ic('tree',18)+' 字辈世系</div>'+
    listHtml;
}
function queryGen(name){
  var el=document.getElementById('gqResult');
  if(!name){el.innerHTML='';return;}
  var poem='世德传家远宗功裕后长';
  var matches=D.persons.filter(function(p){return p.name.indexOf(name)>=0;});
  if(!matches.length){el.innerHTML='<div class="fs-xs muted mt2">未找到「'+name+'」</div>';return;}
  el.innerHTML=matches.map(function(p){
    var genChar=poem[p.gen-1]||'—';
    return '<div class="row between mt2 p2" style="background:#FDF8F3;border-radius:8px;cursor:pointer" onclick="go(\'person\',{id:\''+p.id+'\'})">'+
      '<span class="fs-sm brown">'+p.name+'</span><span class="ribbon r-orange">'+genChar+'（第'+p.gen+'代）</span></div>';
  }).join('');
}
