<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喝不喝 - 今天喝酒吗？</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 200, 100, 0.1) 0%, transparent 70%);
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        .logo {
            width: 200px;
            height: 200px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) rotate(15deg); }
            50% { transform: translateY(-15px) rotate(15deg); }
        }

        h1 {
            font-size: 32px;
            color: #333;
            margin-bottom: 10px;
            font-weight: 800;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .result-text {
            font-size: 48px;
            font-weight: 900;
            opacity: 0;
            transform: scale(0.5) rotateY(90deg);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: block;
            text-align: center;
            margin-bottom: 10px;
        }

        .result-text.show {
            opacity: 1;
            transform: scale(1) rotateY(0);
        }

        .result-text.drink {
            color: #FF6B6B;
            text-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }

        .result-text.no-drink {
            color: #4ECDC4;
            text-shadow: 0 4px 15px rgba(78, 205, 196, 0.4);
        }

        .result-emoji {
            font-size: 60px;
            margin-top: 10px;
            animation: wiggle 0.5s ease-in-out;
            display: block;
            text-align: center;
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(-10deg); }
            50% { transform: rotate(10deg); }
        }

        .decide-btn {
            width: 100%;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(255, 107, 107, 0.4);
            position: relative;
            overflow: hidden;
        }

        .decide-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(255, 107, 107, 0.5);
        }

        .decide-btn:active {
            transform: translateY(0);
        }

        .decide-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .decide-btn:hover::before {
            left: 100%;
        }

        .decide-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .decide-btn:disabled::before {
            display: none;
        }

        .share-btn {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            color: #667eea;
            background: rgba(102, 126, 234, 0.1);
            border: 2px solid #667eea;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
            display: none;
        }

        .share-btn:hover {
            background: #667eea;
            color: white;
        }

        .share-btn.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .history-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .history-toggle {
            font-size: 14px;
            color: #999;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: color 0.3s;
        }

        .history-toggle:hover {
            color: #667eea;
        }

        .history-toggle-icon {
            font-size: 12px;
            transition: transform 0.3s ease;
        }

        .history-toggle-icon.rotated {
            transform: rotate(180deg);
        }

        .history-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease;
        }

        .history-content.expanded {
            max-height: 200px;
            padding-top: 15px;
        }

        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 15px;
        }

        .history-item {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .history-item.drink {
            background: rgba(255, 107, 107, 0.1);
            color: #FF6B6B;
        }

        .history-item.no-drink {
            background: rgba(78, 205, 196, 0.1);
            color: #4ECDC4;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }

        .copy-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .copy-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .ad-section {
            margin-top: 20px;
            padding: 20px;
            background: rgba(102, 126, 234, 0.05);
            border-radius: 15px;
            border: 1px dashed #667eea;
        }

        .ad-placeholder {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .ad-icon {
            font-size: 32px;
        }

        .ad-content {
            flex: 1;
        }

        .ad-title {
            font-size: 16px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 4px;
        }

        .ad-desc {
            font-size: 12px;
            color: #999;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #FFD700;
            border-radius: 50%;
            pointer-events: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(400px) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="beer.png" alt="啤酒杯" style="width: 80%; height: 80%; object-fit: contain;">
        </div>
        <h1>喝不喝</h1>
        <p class="subtitle">今天要不要喝点小酒？让命运来决定！</p>
        
        <div id="result" class="result-text"></div>
        <div id="result-emoji" class="result-emoji"></div>

        <button id="decideBtn" class="decide-btn">让我看看！</button>
        <button id="shareBtn" class="share-btn">分享给朋友</button>

        <div class="history-section">
            <div id="historyToggle" class="history-toggle">
                <span>📊 查看记录</span>
                <span id="historyIcon" class="history-toggle-icon">▼</span>
            </div>
            <div id="historyContent" class="history-content">
                <div id="historyList" class="history-list"></div>
                <div class="stats">
                    <div class="stat-item">
                        <div id="drinkCount" class="stat-value">0</div>
                        <div class="stat-label">喝了</div>
                    </div>
                    <div class="stat-item">
                        <div id="noDrinkCount" class="stat-value">0</div>
                        <div class="stat-label">没喝</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="adSection" class="ad-section">
            <div class="ad-placeholder">
                <div class="ad-icon">📢</div>
                <div class="ad-content">
                    <div class="ad-title">广告位</div>
                    <div class="ad-desc">合作洽谈中...</div>
                </div>
            </div>
        </div>
    </div>

    <div id="copyToast" class="copy-toast">链接已复制！</div>

    <script>
        const decideBtn = document.getElementById('decideBtn');
        const result = document.getElementById('result');
        const resultEmoji = document.getElementById('result-emoji');
        const shareBtn = document.getElementById('shareBtn');
        const historyList = document.getElementById('historyList');
        const drinkCount = document.getElementById('drinkCount');
        const noDrinkCount = document.getElementById('noDrinkCount');
        const copyToast = document.getElementById('copyToast');
        const container = document.querySelector('.container');
        const historyToggle = document.getElementById('historyToggle');
        const historyIcon = document.getElementById('historyIcon');
        const historyContent = document.getElementById('historyContent');
        const adSection = document.getElementById('adSection');

        let history = JSON.parse(localStorage.getItem('drinkHistory')) || [];
        let drinkStats = JSON.parse(localStorage.getItem('drinkStats')) || { drink: 0, noDrink: 0 };

        updateStats();
        renderHistory();
        adSection.style.display = 'block';

        historyToggle.addEventListener('click', () => {
            historyContent.classList.toggle('expanded');
            historyIcon.classList.toggle('rotated');
            historyToggle.querySelector('span:first-child').textContent = 
                historyContent.classList.contains('expanded') ? '📊 收起记录' : '📊 查看记录';
        });

        decideBtn.addEventListener('click', () => {
            decideBtn.disabled = true;
            decideBtn.textContent = '命运转动中...';
            
            result.classList.remove('show', 'drink', 'no-drink', 'shaking');
            resultEmoji.textContent = '';
            shareBtn.classList.remove('show');
            adSection.style.display = 'none';
            result.style.opacity = '1';
            result.style.transform = 'scale(1)';

            let count = 0;
            const maxCount = 20;
            const emojis = ['🍺', '🍻', '🍷', '🍸', '�', '🥂', '🍾', '🧉'];
            
            const interval = setInterval(() => {
                const tempResult = Math.random() > 0.5 ? '喝' : '不喝';
                const tempEmoji = emojis[Math.floor(Math.random() * emojis.length)];
                
                result.textContent = tempResult;
                resultEmoji.textContent = tempEmoji;
                result.style.opacity = 0.4 + (count / maxCount) * 0.6;
                
                const scale = 0.8 + Math.random() * 0.4;
                const rotate = (Math.random() - 0.5) * 20;
                result.style.transform = `scale(${scale}) rotate(${rotate}deg)`;
                
                if (tempResult === '喝') {
                    result.style.color = '#FF6B6B';
                    result.style.textShadow = '0 4px 20px rgba(255, 107, 107, 0.5)';
                } else {
                    result.style.color = '#4ECDC4';
                    result.style.textShadow = '0 4px 20px rgba(78, 205, 196, 0.5)';
                }
                
                resultEmoji.style.transform = `scale(${scale}) rotate(${(Math.random() - 0.5) * 30}deg)`;
                resultEmoji.style.opacity = result.style.opacity;
                
                count++;

                if (count >= maxCount) {
                    clearInterval(interval);
                    finalDecision();
                }
            }, 60);
        });

        function finalDecision() {
            const shouldDrink = Math.random() > 0.5;
            const text = shouldDrink ? '喝！' : '不喝';
            const emoji = shouldDrink ? '🍻' : '❌';
            
            result.textContent = text;
            resultEmoji.textContent = emoji;
            
            if (shouldDrink) {
                result.classList.add('drink');
                drinkStats.drink++;
                createConfetti();
            } else {
                result.classList.add('no-drink');
                drinkStats.noDrink++;
            }
            
            result.style.opacity = '1';
            result.style.transform = 'scale(2)';
            resultEmoji.style.transform = 'scale(2)';
            
            setTimeout(() => {
                result.style.transition = 'all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                result.style.transform = 'scale(1)';
                resultEmoji.style.transition = 'all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                resultEmoji.style.transform = 'scale(1)';
            }, 50);
            
            result.classList.add('show');
            
            history.unshift({
                result: shouldDrink,
                time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
            });
            
            if (history.length > 10) {
                history = history.slice(0, 10);
            }
            
            localStorage.setItem('drinkHistory', JSON.stringify(history));
            localStorage.setItem('drinkStats', JSON.stringify(drinkStats));
            
            updateStats();
            renderHistory();
            
            setTimeout(() => {
                shareBtn.classList.add('show');
                decideBtn.disabled = false;
                decideBtn.textContent = '再测一次！';
            }, 500);
        }

        function updateStats() {
            drinkCount.textContent = drinkStats.drink;
            noDrinkCount.textContent = drinkStats.noDrink;
        }

        function renderHistory() {
            historyList.innerHTML = history.map(item => {
                const className = item.result ? 'drink' : 'no-drink';
                const text = item.result ? '喝' : '不喝';
                return `<span class="history-item ${className}">${item.time} ${text}</span>`;
            }).join('');
        }

        shareBtn.addEventListener('click', async () => {
            const shareText = `今天我在「喝不喝」测了一下，结果是${result.textContent}！你也来试试吧！`;
            
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: '喝不喝',
                        text: shareText,
                        url: window.location.href
                    });
                } catch (err) {
                    copyLink(shareText);
                }
            } else {
                copyLink(shareText);
            }
        });

        function copyLink(text) {
            navigator.clipboard.writeText(text + '\n' + window.location.href).then(() => {
                copyToast.classList.add('show');
                setTimeout(() => {
                    copyToast.classList.remove('show');
                }, 2000);
            });
        }

        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.backgroundColor = ['#FFD700', '#FF6B6B', '#4ECDC4', '#667eea', '#FF8E53'][Math.floor(Math.random() * 5)];
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.style.animationDelay = (Math.random() * 0.5) + 's';
                container.appendChild(confetti);
                
                setTimeout(() => {
                    confetti.remove();
                }, 4000);
            }
        }
    </script>
</body>
</html>
