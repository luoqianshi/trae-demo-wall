<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵犀出行 - 智能中转规划 · 一键直达购票</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1A73E8 0%, #4285F4 50%, #FF6B35 100%);
            min-height: 100vh;
            padding: 30px;
            font-size: 18px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        /* 顶部导航区 */
        .header {
            background: white;
            border-radius: 20px;
            padding: 35px 40px;
            text-align: center;
            margin-bottom: 28px;
            box-shadow: 0 12px 50px rgba(0, 0, 0, 0.15);
        }

        .logo {
            font-size: 38px;
            font-weight: 700;
            background: linear-gradient(135deg, #1A73E8 0%, #4285F4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 18px;
            color: #6B7280;
            margin-bottom: 18px;
        }

        .competition-tag {
            display: inline-block;
            background: linear-gradient(135deg, #FF6B35 0%, #FF8C42 100%);
            color: white;
            padding: 10px 24px;
            border-radius: 22px;
            font-size: 15px;
            font-weight: 500;
        }

        /* 查询面板 */
        .search-panel {
            background: white;
            border-radius: 20px;
            padding: 32px 36px;
            margin-bottom: 28px;
            box-shadow: 0 12px 50px rgba(0, 0, 0, 0.15);
        }

        .search-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 22px;
        }

        @media (min-width: 768px) {
            .search-grid {
                grid-template-columns: 1fr 1fr 1fr;
            }
            
            .preference-section {
                grid-column: 1 / -1;
                display: flex;
                justify-content: center;
                gap: 30px;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 18px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 12px;
        }

        .form-group input,
        .form-group select {
            padding: 18px 20px;
            border: 2px solid #E5E7EB;
            border-radius: 14px;
            font-size: 20px;
            color: #1F2937;
            background: white;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #1A73E8;
            box-shadow: 0 0 0 4px rgba(26, 115, 232, 0.1);
        }

        /* 搜索框样式 */
        .search-input-wrapper {
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 18px 20px;
            padding-right: 50px;
            border: 2px solid #E5E7EB;
            border-radius: 14px;
            font-size: 20px;
            color: #1F2937;
            background: white;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #1A73E8;
            box-shadow: 0 0 0 4px rgba(26, 115, 232, 0.1);
        }

        .search-input::placeholder {
            color: #9CA3AF;
        }

        .search-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #9CA3AF;
            pointer-events: none;
            font-size: 18px;
        }

        /* 搜索下拉列表 */
        .search-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 2px solid #E5E7EB;
            border-top: none;
            border-radius: 0 0 14px 14px;
            max-height: 280px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }

        .search-dropdown.show {
            display: block;
        }

        .search-dropdown-item {
            padding: 16px 20px;
            cursor: pointer;
            transition: background 0.2s ease;
            border-bottom: 1px solid #F3F4F6;
        }

        .search-dropdown-item:last-child {
            border-bottom: none;
        }

        .search-dropdown-item:hover {
            background: #F3F4F6;
        }

        .search-dropdown-item.active {
            background: #EFF6FF;
        }

        .search-dropdown-item .city-name {
            font-weight: 600;
            color: #1F2937;
            font-size: 19px;
        }

        .search-dropdown-item .city-region {
            font-size: 16px;
            color: #6B7280;
            margin-left: 12px;
        }

        .search-dropdown-item .match-highlight {
            background: #FEF3C7;
            color: #D97706;
            padding: 0 3px;
            border-radius: 3px;
        }

        .no-results {
            padding: 20px;
            text-align: center;
            color: #9CA3AF;
            font-size: 17px;
        }

        /* 站点选择样式 */
        .station-select-wrapper {
            margin-top: 12px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .station-select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #DBEAFE;
            border-radius: 12px;
            font-size: 17px;
            color: #1F2937;
            background: #EFF6FF;
            cursor: pointer;
        }

        .station-select:focus {
            outline: none;
            border-color: #1A73E8;
        }

        .preference-section {
            margin-top: 12px;
        }

        .radio-group {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .radio-option input[type="radio"] {
            width: 24px;
            height: 24px;
            accent-color: #1A73E8;
        }

        .radio-option span {
            font-size: 19px;
            color: #374151;
        }

        .search-btn {
            margin-top: 28px;
            width: 100%;
            padding: 18px 36px;
            background: linear-gradient(135deg, #1A73E8 0%, #4285F4 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(26, 115, 232, 0.4);
        }

        .search-btn:active {
            transform: translateY(0);
        }

        /* Loading动画 */
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #E5E7EB;
            border-top-color: #1A73E8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 方案结果展示区 */
        .results-section {
            display: none;
            margin-bottom: 28px;
        }

        .results-section.show {
            display: block;
        }

        .section-title {
            font-size: 28px;
            font-weight: 700;
            color: white;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .plan-card {
            background: white;
            border-radius: 20px;
            padding: 32px;
            margin-bottom: 24px;
            box-shadow: 0 12px 50px rgba(0, 0, 0, 0.15);
            border-left: 6px solid #1A73E8;
            transition: all 0.3s ease;
            position: relative;
        }

        .plan-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 60px rgba(0, 0, 0, 0.2);
        }

        .plan-card.recommended {
            border-left-color: #FF6B35;
        }

        .ai-badge {
            position: absolute;
            top: -12px;
            right: 24px;
            background: linear-gradient(135deg, #FF6B35 0%, #FF8C42 100%);
            color: white;
            padding: 8px 18px;
            border-radius: 22px;
            font-size: 15px;
            font-weight: 600;
            display: none;
        }

        .plan-card.recommended .ai-badge {
            display: block;
        }

        .plan-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 18px;
        }

        .plan-name {
            font-size: 26px;
            font-weight: 700;
            color: #1F2937;
        }

        .plan-price {
            font-size: 38px;
            font-weight: 700;
            color: #1A73E8;
        }

        .plan-meta {
            display: flex;
            gap: 28px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 17px;
            color: #6B7280;
        }

        .meta-item .icon {
            font-size: 20px;
        }

        .plan-details {
            background: #F8FAFC;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .detail-title {
            font-size: 16px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 14px;
        }

        .journey-step {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 0;
            border-bottom: 1px dashed #E5E7EB;
        }

        .journey-step:last-child {
            border-bottom: none;
        }

        .step-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .step-icon.train {
            background: #DBEAFE;
            color: #1A73E8;
        }

        .step-icon.plane {
            background: #FEE2E2;
            color: #DC2626;
        }

        .step-icon.wait {
            background: #FEF3C7;
            color: #D97706;
        }

        .step-content {
            flex: 1;
        }

        .step-route {
            font-size: 17px;
            font-weight: 600;
            color: #1F2937;
        }

        .step-info {
            font-size: 15px;
            color: #6B7280;
            margin-top: 4px;
        }

        .price-tip {
            font-size: 14px;
            color: #666;
            text-align: center;
            padding: 12px 16px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .booking-buttons {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .booking-btn {
            flex: 1;
            min-width: 200px;
            padding: 16px 24px;
            border: 2px solid;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
        }

        .booking-btn.train {
            background: #EFF6FF;
            border-color: #1A73E8;
            color: #1A73E8;
        }

        .booking-btn.train:hover {
            background: #1A73E8;
            color: white;
        }

        .booking-btn.plane {
            background: #FEF2F2;
            border-color: #DC2626;
            color: #DC2626;
        }

        .booking-btn.plane:hover {
            background: #DC2626;
            color: white;
        }

        /* 方案对比表 */
        .comparison-section {
            display: none;
            margin-bottom: 28px;
        }

        .comparison-section.show {
            display: block;
        }

        .comparison-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .expand-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            background: linear-gradient(135deg, #1A73E8 0%, #4285F4 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .expand-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(26, 115, 232, 0.3);
        }

        .expand-icon {
            font-size: 12px;
            transition: transform 0.3s ease;
        }

        .expand-btn.collapsed .expand-icon {
            transform: rotate(-180deg);
        }

        /* 方案卡片隐藏/显示 */
        .plan-card.hidden {
            display: none;
        }

        /* 对比表格行隐藏/显示 */
        .comparison-table tr.hidden {
            display: none;
        }

        /* 往返总计卡片 */
        .roundtrip-summary {
            margin-bottom: 24px;
        }

        .summary-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.3);
        }

        .summary-icon {
            font-size: 48px;
        }

        .summary-content {
            flex: 1;
        }

        .summary-title {
            font-size: 20px;
            font-weight: 700;
            color: white;
            margin-bottom: 12px;
        }

        .summary-details {
            display: flex;
            gap: 24px;
        }

        .summary-item {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
        }

        /* 对比表格包装器 */
        .comparison-wrapper {
            margin-bottom: 28px;
        }

        .subsection-title {
            font-size: 18px;
            font-weight: 600;
            color: #1F2937;
            margin-bottom: 16px;
        }

        .comparison-table {
            width: 100%;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 12px 50px rgba(0, 0, 0, 0.15);
        }

        .comparison-table table {
            width: 100%;
            border-collapse: collapse;
        }

        .comparison-table th {
            background: linear-gradient(135deg, #1A73E8 0%, #4285F4 100%);
            color: white;
            padding: 18px 14px;
            font-size: 16px;
            font-weight: 600;
            text-align: left;
        }

        .comparison-table td {
            padding: 18px 14px;
            border-bottom: 1px solid #E5E7EB;
            font-size: 16px;
            color: #374151;
        }

        .comparison-table tr:last-child td {
            border-bottom: none;
        }

        .comparison-table tr:nth-child(odd) td {
            background: white;
        }

        .comparison-table tr:nth-child(even) td {
            background: #F8FAFC;
        }

        .recommend-tag {
            display: inline-block;
            background: linear-gradient(135deg, #FF6B35 0%, #FF8C42 100%);
            color: white;
            padding: 6px 14px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
        }

        /* 往返行程样式 */
        .trip-section {
            margin-bottom: 32px;
        }

        /* 方案容器 - 支持并列显示 */
        .plans-container {
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        /* 往返并列显示 */
        .plans-container.roundtrip {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .plans-container.roundtrip .trip-section {
            margin-bottom: 0;
        }

        /* 响应式布局 */
        @media (max-width: 1024px) {
            .plans-container.roundtrip {
                grid-template-columns: 1fr;
            }
        }

        .section-title {
            font-size: 22px;
            font-weight: 700;
            color: #1F2937;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 3px solid #1A73E8;
            display: inline-block;
        }

        .trip-label {
            display: inline-block;
            margin-left: 12px;
            background: linear-gradient(135deg, #1A73E8 0%, #4285F4 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
        }

        /* 确认页面样式 */
        .confirm-section {
            display: none;
            background: white;
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 12px 50px rgba(0, 0, 0, 0.15);
        }

        .confirm-section.show {
            display: block;
        }

        .confirm-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .back-btn {
            padding: 12px 24px;
            background: #F3F4F6;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            color: #4B5563;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: #E5E7EB;
        }

        .confirm-route-info {
            margin-bottom: 32px;
        }

        .route-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            padding: 24px;
        }

        .route-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 32px;
        }

        .route-item {
            text-align: center;
        }

        .route-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 8px;
            display: block;
        }

        .route-value {
            font-size: 24px;
            font-weight: 700;
            color: white;
        }

        .route-arrow {
            font-size: 32px;
            color: rgba(255, 255, 255, 0.8);
        }

        .selected-plans {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        .selected-plans.single {
            grid-template-columns: 1fr;
        }

        .selected-plan-card {
            background: #F9FAFB;
            border-radius: 16px;
            padding: 24px;
            border: 2px solid #E5E7EB;
        }

        .selected-plan-card.recommended {
            border-color: #10B981;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.05) 0%, rgba(16, 185, 129, 0.1) 100%);
        }

        .plan-title {
            font-size: 18px;
            font-weight: 600;
            color: #1F2937;
            margin-bottom: 16px;
        }

        .plan-content {
            font-size: 16px;
            color: #4B5563;
        }

        .confirm-total {
            margin-bottom: 32px;
        }

        .total-card {
            background: linear-gradient(135deg, #FF6B35 0%, #F59E0B 100%);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total-label {
            font-size: 18px;
            font-weight: 600;
            color: white;
        }

        .total-value {
            font-size: 18px;
            color: white;
            font-weight: 500;
        }

        .booking-platforms {
            margin-top: 32px;
        }

        .platform-title {
            font-size: 18px;
            font-weight: 600;
            color: #1F2937;
            margin-bottom: 20px;
            text-align: center;
        }

        .platform-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .platform-btn {
            background: white;
            border: 2px solid #E5E7EB;
            border-radius: 16px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .platform-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        .platform-btn.platform-12306:hover {
            border-color: #1A73E8;
            background: linear-gradient(135deg, rgba(26, 115, 232, 0.05) 0%, rgba(26, 115, 232, 0.1) 100%);
        }

        .platform-btn.platform-ctrip:hover {
            border-color: #FF6B35;
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.05) 0%, rgba(255, 107, 53, 0.1) 100%);
        }

        .platform-btn.platform-fliggy:hover {
            border-color: #FF4D4F;
            background: linear-gradient(135deg, rgba(255, 77, 79, 0.05) 0%, rgba(255, 77, 79, 0.1) 100%);
        }

        .platform-icon {
            font-size: 40px;
        }

        .platform-name {
            font-size: 18px;
            font-weight: 600;
            color: #1F2937;
        }

        .platform-desc {
            font-size: 14px;
            color: #6B7280;
        }

        /* 选择方案按钮 */
        .select-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .select-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
        }

        .select-btn.selected {
            background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%);
        }

        /* 底部信息 */
        .footer {
            background: white;
            border-radius: 20px;
            padding: 32px;
            text-align: center;
            box-shadow: 0 12px 50px rgba(0, 0, 0, 0.15);
        }

        .footer-disclaimer {
            font-size: 16px;
            color: #6B7280;
            margin-bottom: 14px;
        }

        .footer-copyright {
            font-size: 15px;
            color: #9CA3AF;
        }

        /* 提示消息 */
        .alert {
            display: none;
            background: #FEE2E2;

        // 切换对比表格展开/收起
        function toggleComparisonTable(tbodyId, btn) {
            const tbody = document.getElementById(tbodyId);
            const hiddenRows = tbody.querySelectorAll('tr.hidden');
            let hasHidden = hiddenRows.length > 0;
            
            if (hasHidden) {
                // 展开：显示所有方案
                tbody.querySelectorAll('tr').forEach(row => {
                    row.classList.remove('hidden');
                });
                btn.innerHTML = '<span class="expand-icon">▼</span><span>收起其他方案</span>';
                btn.classList.add('collapsed');
            } else {
                // 收起：只显示前3个方案
                const allRows = tbody.querySelectorAll('tr');
                allRows.forEach((row, index) => {
                    if (index >= 3) {
                        row.classList.add('hidden');
                    }
                });
                btn.innerHTML = '<span class="expand-icon">▼</span><span>展开全部方案</span>';
                btn.classList.remove('collapsed');
            }
        }

        // ==========================================
        // 初始化搜索框
        // ==========================================
        function initSearchInput(inputId, dropdownId) {
            const input = document.getElementById(inputId);
            const dropdown = document.getElementById(dropdownId);
            let searchTimeout;

            // 输入事件监听
            input.addEventListener('input', function() {
                clearTimeout(searchTimeout);
                const query = this.value.trim();

                if (query.length === 0) {
                    dropdown.classList.remove('show');
                    return;
                }

                // 防抖处理
                searchTimeout = setTimeout(() => {
                    searchCities(query, dropdown, input);
                }, 200);
            });

            // 获得焦点时显示所有城市
            input.addEventListener('focus', function() {
                const query = this.value.trim();
                if (query.length === 0) {
                    showAllCities(dropdown, input);
                } else {
                    searchCities(query, dropdown, input);
                }
            });

            // 失去焦点时延迟隐藏下拉框
            input.addEventListener('blur', function() {
                setTimeout(() => {
                    dropdown.classList.remove('show');
                }, 200);
            });

            // 点击下拉框项
            dropdown.addEventListener('click', function(e) {
                const item = e.target.closest('.search-dropdown-item');
                if (item) {
                    const cityName = item.dataset.city;
                    const resultType = item.dataset.type;
                    const stationData = item.dataset.station;
                    
                    // 设置显示值（如果是站点，显示站点名称；否则显示城市名称）
                    if (resultType === 'station' && stationData) {
                        const station = JSON.parse(stationData);
                        input.value = station.name;
                    } else {
                        input.value = cityName;
                    }
                    
                    dropdown.classList.remove('show');
                    
                    // 加载站点选择并自动选中对应的站点（如果有）
                    loadStations(cityName, inputId, stationData ? JSON.parse(stationData) : null);
                }
            });
        }

        // ==========================================
        // 加载站点/机场选择
        // ==========================================
        function loadStations(cityName, inputId, selectedStation = null) {
            const isDeparture = inputId === 'departure';
            const wrapperId = isDeparture ? 'departureStationWrapper' : 'destinationStationWrapper';
            const selectId = isDeparture ? 'departureStation' : 'destinationStation';
            const wrapper = document.getElementById(wrapperId);
            const select = document.getElementById(selectId);

            // 清空选项
            select.innerHTML = '<option value="">请选择站点/机场</option>';

            if (!cities[cityName]) {
                wrapper.style.display = 'none';
                return;
            }

            const cityData = cities[cityName];
            const allStations = [];

            // 添加高铁站
            if (cityData.stations) {
                cityData.stations.forEach(station => {
                    allStations.push({ 
                        name: station.name, 
                        code: station.code, 
                        type: 'train' 
                    });
                });
            }

            // 添加机场
            if (cityData.airports) {
                cityData.airports.forEach(airport => {
                    allStations.push({ 
                        name: airport.name, 
                        code: airport.code, 
                        type: 'plane' 
                    });
                });
            }

            // 添加选项
            let selectedValue = '';
            allStations.forEach(station => {
                const optionValue = JSON.stringify({ 
                    name: station.name, 
                    code: station.code, 
                    type: station.type 
                });
                const option = document.createElement('option');
                option.value = optionValue;
                option.textContent = station.name + (station.type === 'plane' ? ' ✈️' : ' 🚄');
                
                // 检查是否需要选中此选项
                if (selectedStation && station.name === selectedStation.name && station.type === selectedStation.type) {
                    option.selected = true;
                    selectedValue = optionValue;
                }
                
                select.appendChild(option);
            });

            // 如果有预选中的站点，设置select的值
            if (selectedValue) {
                select.value = selectedValue;
            }

            // 显示站点选择
            wrapper.style.display = 'block';
        }

        // ==========================================
        // 搜索城市和站点
        // ==========================================
        function searchCities(query, dropdown, input) {
            const results = [];
            const lowerQuery = query.toLowerCase();
            const matchedCities = new Set();

            // 搜索城市
            Object.keys(cities).forEach(city => {
                const lowerCity = city.toLowerCase();
                let matchScore = 0;

                if (city === query) {
                    matchScore = 100;
                } else if (city.startsWith(query)) {
                    matchScore = 80;
                } else if (city.includes(query)) {
                    matchScore = 60;
                } else if (getPinyinFirstLetter(city).toLowerCase().startsWith(lowerQuery)) {
                    matchScore = 40;
                }

                if (matchScore > 0) {
                    matchedCities.add(city);
                    results.push({
                        type: 'city',
                        city: city,
                        region: cities[city].region,
                        station: null,
                        score: matchScore,
                        query: query
                    });
                }
            });

            // 如果找到了城市，同时添加该城市的所有站点
            matchedCities.forEach(city => {
                const cityData = cities[city];
                
                // 添加高铁站
                if (cityData.stations) {
                    cityData.stations.forEach(station => {
                        // 站点分数略低于城市完全匹配，但高于城市包含匹配
                        const stationScore = 70; // 城市匹配时，站点作为附属结果显示
                        results.push({
                            type: 'station',
                            city: city,
                            region: cityData.region,
                            station: { name: station.name, code: station.code, type: 'train' },
                            score: stationScore,
                            query: query
                        });
                    });
                }

                // 添加机场
                if (cityData.airports) {
                    cityData.airports.forEach(airport => {
                        const stationScore = 70;
                        results.push({
                            type: 'station',
                            city: city,
                            region: cityData.region,
                            station: { name: airport.name, code: airport.code, type: 'plane' },
                            score: stationScore,
                            query: query
                        });
                    });
                }
            });

            // 搜索所有站点（即使不匹配城市也能搜索）
            Object.keys(cities).forEach(city => {
                const cityData = cities[city];
                
                // 搜索高铁站
                if (cityData.stations) {
                    cityData.stations.forEach(station => {
                        const stationName = station.name;
                        let matchScore = 0;

                        if (stationName === query) {
                            matchScore = 120; // 站点完全匹配优先级最高
                        } else if (stationName.startsWith(query)) {
                            matchScore = 100;
                        } else if (stationName.includes(query)) {
                            matchScore = 85; // 站点包含匹配高于城市匹配的站点
                        }

                        if (matchScore > 0) {
                            // 检查是否已存在（避免重复）
                            const exists = results.some(r => r.type === 'station' && r.station.name === stationName);
                            if (!exists) {
                                results.push({
                                    type: 'station',
                                    city: city,
                                    region: cityData.region,
                                    station: { name: station.name, code: station.code, type: 'train' },
                                    score: matchScore,
                                    query: query
                                });
                            }
                        }
                    });
                }

                // 搜索机场
                if (cityData.airports) {
                    cityData.airports.forEach(airport => {
                        const airportName = airport.name;
                        let matchScore = 0;

                        if (airportName === query) {
                            matchScore = 120;
                        } else if (airportName.startsWith(query)) {
                            matchScore = 100;
                        } else if (airportName.includes(query)) {
                            matchScore = 85;
                        }

                        if (matchScore > 0) {
                            const exists = results.some(r => r.type === 'station' && r.station.name === airportName);
                            if (!exists) {
                                results.push({
                                    type: 'station',
                                    city: city,
                                    region: cityData.region,
                                    station: { name: airport.name, code: airport.code, type: 'plane' },
                                    score: matchScore,
                                    query: query
                                });
                            }
                        }
                    });
                }
            });

            // 按匹配度排序
            results.sort((a, b) => b.score - a.score);

            // 显示搜索结果
            displaySearchResults(results.slice(0, 15), dropdown, input);
        }

        // ==========================================
        // 显示搜索结果
        // ==========================================
        function displaySearchResults(results, dropdown, input) {
            dropdown.innerHTML = '';

            if (results.length === 0) {
                dropdown.innerHTML = '<div class="no-results">未找到匹配的城市或站点</div>';
                dropdown.classList.add('show');
                return;
            }

            results.forEach(result => {
                const item = document.createElement('div');
                item.className = 'search-dropdown-item';
                item.dataset.city = result.city;
                item.dataset.type = result.type;
                
                // 如果是站点，存储站点信息
                if (result.station) {
                    item.dataset.station = JSON.stringify(result.station);
                }

                // 高亮匹配的文字
                let displayName = '';
                if (result.type === 'station') {
                    displayName = result.station.name;
                } else {
                    displayName = result.city;
                }
                
                if (result.query && result.query.length > 0) {
                    const regex = new RegExp(`(${result.query})`, 'gi');
                    displayName = displayName.replace(regex, '<span class="match-highlight">$1</span>');
                }

                // 站点类型图标
                const stationIcon = result.type === 'station' 
                    ? (result.station.type === 'train' ? '🚄' : '✈️')
                    : '';

                // 显示格式：站点名称 + 城市 + 区域 或 城市 + 区域
                let regionText = '';
                if (result.type === 'station') {
                    regionText = `<span class="city-region">${result.city} · ${result.region}</span>`;
                } else {
                    regionText = `<span class="city-region">${result.region}</span>`;
                }

                item.innerHTML = `
                    <span class="city-name">${stationIcon} ${displayName}</span>
                    ${regionText}
                `;

                item.addEventListener('mouseenter', function() {
                    document.querySelectorAll('.search-dropdown-item').forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                });

                dropdown.appendChild(item);
            });

            dropdown.classList.add('show');
        }

        // ==========================================
        // 获取拼音首字母（简化版）
        // ==========================================
        function getPinyinFirstLetter(city) {
            const pinyinMap = {
                '北京': 'BJ', '上海': 'SH', '广州': 'GZ', '深圳': 'SZ',
                '成都': 'CD', '重庆': 'CQ', '西安': 'XA', '武汉': 'WH',
                '杭州': 'HZ', '南京': 'NJ', '长沙': 'CS', '郑州': 'ZZ',
                '昆明': 'KM', '厦门': 'XM', '青岛': 'QD', '大连': 'DL',
                '沈阳': 'SY', '哈尔滨': 'HEB', '天津': 'TJ', '济南': 'JN',
                '合肥': 'HF', '福州': 'FZ', '南宁': 'NN', '贵阳': 'GY',
                '兰州': 'LZ', '乌鲁木齐': 'WLMQ', '呼和浩特': 'HHHT',
                '南昌': 'NC', '太原': 'TY', '石家庄': 'SJZ'
            };
            return pinyinMap[city] || city;
        }

        // ==========================================
        // Haversine公式计算两点间直线距离（公里）
        // ==========================================
        function calculateDistance(city1, city2) {
            const R = 6371; // 地球半径（公里）
            const dLat = (cityCoords[city2].lat - cityCoords[city1].lat) * Math.PI / 180;
            const dLng = (cityCoords[city2].lng - cityCoords[city1].lng) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(cityCoords[city1].lat * Math.PI / 180) * 
                      Math.cos(cityCoords[city2].lat * Math.PI / 180) *
                      Math.sin(dLng / 2) * Math.sin(dLng / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        // ==========================================
        // 估算实际交通距离（直线距离 × 1.4系数）
        // ==========================================
        function getActualDistance(city1, city2) {
            const straightDistance = calculateDistance(city1, city2);
            return Math.round(straightDistance * 1.4);
        }

        // ==========================================
        // 获取淡旺季调整系数
        // ==========================================
        function getSeasonCoefficient(dateStr) {
            const date = new Date(dateStr);
            const month = date.getMonth() + 1;
            
            // 旺季（1-2月、7-8月）上浮20%
            if (month === 1 || month === 2 || month === 7 || month === 8) {
                return 1.2;
            }
            // 淡季（3-4月、11月）下浮10%
            if (month === 3 || month === 4 || month === 11) {
                return 0.9;
            }
            // 平季
            return 1.0;
        }

        // ==========================================
        // 计算飞机费用（优先查参考表，再按距离估算）
        // ==========================================
        function calculateFlightCost(departure, destination, dateStr) {
            // 先查航线价格参考表
            const routeKey = departure + '-' + destination;
            if (routePriceRef[routeKey]) {
                const basePrice = routePriceRef[routeKey];
                const seasonCoeff = getSeasonCoefficient(dateStr);
                return Math.round(basePrice * seasonCoeff);
            }
            
            // 如果没有参考数据，使用距离估算（0.6元/公里）
            const distance = getActualDistance(departure, destination);
            const seasonCoeff = getSeasonCoefficient(dateStr);
            return Math.round(distance * 0.6 * seasonCoeff);
        }

        // ==========================================
        // 计算耗时（小时）
        // ==========================================
        function calculateTrainTime(distance) {
            // 高铁平均时速300km/h
            const speed = 300;
            return Math.round((distance / speed) * 10) / 10;
        }

        function calculateFlightTime(distance) {
            // 飞机实际飞行800km/h + 机场等候3小时
            const speed = 800;
            return Math.round((distance / speed) * 10) / 10 + 3;
        }

        // ==========================================
        // 生成直达方案
        // ==========================================
        function generateDirectPlans(departure, destination, dateStr, preference, departureStation = null, destinationStation = null) {
            const plans = [];
            const distance = getActualDistance(departure, destination);

            // 获取出发站点信息（优先使用用户选择的站点）
            const getDepartureStationInfo = (type) => {
                if (departureStation && departureStation.type === type) {
                    return { name: departureStation.name, code: departureStation.code };
                }
                // 默认选择第一个对应类型的站点
                const cityData = cities[departure];
                if (cityData) {
                    const stations = type === 'train' ? cityData.stations : cityData.airports;
                    if (stations && stations.length > 0) {
                        return { name: stations[0].name, code: stations[0].code };
                    }
                }
                return { name: type === 'train' ? departure + '南站/东站' : departure + '机场', code: '' };
            };

            const getDestinationStationInfo = (type) => {
                if (destinationStation && destinationStation.type === type) {
                    return { name: destinationStation.name, code: destinationStation.code };
                }
                const cityData = cities[destination];
                if (cityData) {
                    const stations = type === 'train' ? cityData.stations : cityData.airports;
                    if (stations && stations.length > 0) {
                        return { name: stations[0].name, code: stations[0].code };
                    }
                }
                return { name: type === 'train' ? destination + '站' : destination + '机场', code: '' };
            };

            // 直达高铁方案
            const trainDistance = distance;
            const trainTime = calculateTrainTime(trainDistance);
            const trainCost = calculateTrainCost(trainDistance);
            const trainTotalTime = trainTime + 0.5;
            const trainFromStation = getDepartureStationInfo('train');
            const trainToStation = getDestinationStationInfo('train');

            plans.push({
                type: 'train',
                name: '方案A：高铁直达',
                departure: departure,
                destination: destination,
                fromStation: trainFromStation.name,
                fromStationCode: trainFromStation.code,
                toStation: trainToStation.name,
                toStationCode: trainToStation.code,
                distance: trainDistance,
                time: trainTotalTime,
                cost: trainCost,
                journey: [
                    {
                        type: 'train',
                        from: departure,
                        fromStation: trainFromStation.name,
                        fromStationCode: trainFromStation.code,
                        to: destination,
                        toStation: trainToStation.name,
                        toStationCode: trainToStation.code,
                        distance: trainDistance,
                        time: trainTime,
                        cost: trainCost
                    }
                ],
                isRecommended: false
            });

            // 直达飞机方案
            const flightDistance = distance;
            const flightTime = calculateFlightTime(flightDistance);
            const flightCost = calculateFlightCost(departure, destination, dateStr);
            const flightTotalTime = flightTime + 0.5;
            const flightFromStation = getDepartureStationInfo('plane');
            const flightToStation = getDestinationStationInfo('plane');

            plans.push({
                type: 'plane',
                name: '方案B：飞机直达',
                departure: departure,
                destination: destination,
                fromStation: flightFromStation.name,
                fromStationCode: flightFromStation.code,
                toStation: flightToStation.name,
                toStationCode: flightToStation.code,
                distance: flightDistance,
                time: flightTotalTime,
                cost: flightCost,
                journey: [
                    {
                        type: 'plane',
                        from: departure,
                        fromStation: flightFromStation.name,
                        fromStationCode: flightFromStation.code,
                        to: destination,
                        toStation: flightToStation.name,
                        toStationCode: flightToStation.code,
                        distance: flightDistance,
                        time: flightTime,
                        cost: flightCost
                    }
                ],
                isRecommended: false
            });

            return plans;
        }

        // ==========================================
        // 生成中转方案（包括多种中转类型）
        // ==========================================
        function generateTransferPlans(departure, destination, dateStr, preference, departureStation = null, destinationStation = null) {
            const transferPlans = [];

            // 方案C：高铁+飞机中转（现有逻辑）
            const trainPlanePlan = generateTrainPlaneTransfer(departure, destination, dateStr, preference, departureStation, destinationStation);
            if (trainPlanePlan) {
                trainPlanePlan.name = '方案C：高铁+飞机中转';
                transferPlans.push(trainPlanePlan);
            }

            // 方案D：高铁中转（高铁+高铁）
            const trainTrainPlan = generateTrainTrainTransfer(departure, destination, dateStr, preference, departureStation, destinationStation);
            if (trainTrainPlan) {
                trainTrainPlan.name = '方案D：高铁中转';
                transferPlans.push(trainTrainPlan);
            }

            // 方案E：飞机中转（飞机+飞机）
            const planePlanePlan = generatePlanePlaneTransfer(departure, destination, dateStr, preference, departureStation, destinationStation);
            if (planePlanePlan) {
                planePlanePlan.name = '方案E：飞机中转';
                transferPlans.push(planePlanePlan);
            }

            // 根据偏好排序并标记推荐
            transferPlans.sort((a, b) => {
                let scoreA = 0, scoreB = 0;
                if (preference === 'economy') {
                    scoreA = a.cost * 0.6 + a.time * 10;
                    scoreB = b.cost * 0.6 + b.time * 10;
                } else if (preference === 'speed') {
                    scoreA = a.cost * 0.3 + a.time * 10;
                    scoreB = b.cost * 0.3 + b.time * 10;
                } else {
                    scoreA = a.cost * 0.45 + a.time * 10;
                    scoreB = b.cost * 0.45 + b.time * 10;
                }
                return scoreA - scoreB;
            });

            // 标记最优方案为推荐
            if (transferPlans.length > 0) {
                transferPlans[0].isRecommended = true;
            }

            return transferPlans;
        }

        // ==========================================
        // 生成高铁+飞机中转方案
        // ==========================================
        function generateTrainPlaneTransfer(departure, destination, dateStr, preference, departureStation = null, destinationStation = null) {
            let bestPlan = null;
            let minScore = Infinity;

            // 获取站点信息的辅助函数
            const getStationInfo = (city, type) => {
                const cityData = cities[city];
                if (cityData) {
                    const stations = type === 'train' ? cityData.stations : cityData.airports;
                    if (stations && stations.length > 0) {
                        return { name: stations[0].name, code: stations[0].code };
                    }
                }
                return { name: type === 'train' ? city + '站' : city + '机场', code: '' };
            };

            hubCities.forEach(hub => {
                if (hub === departure || hub === destination) return;

                const dist1 = getActualDistance(departure, hub);
                const dist2 = getActualDistance(hub, destination);

                const trainTime1 = calculateTrainTime(dist1);
                const flightTime2 = calculateFlightTime(dist2);
                const waitTime = 1.5;
                const totalTime = trainTime1 + flightTime2 + waitTime;

                const trainCost1 = calculateTrainCost(dist1);
                const flightCost2 = calculateFlightCost(hub, destination, dateStr);
                const totalCost = trainCost1 + flightCost2;

                let score = preference === 'economy' 
                    ? totalCost * 0.6 + totalTime * 10
                    : preference === 'speed' 
                        ? totalCost * 0.3 + totalTime * 10
                        : totalCost * 0.45 + totalTime * 10;

                if (score < minScore) {
                    minScore = score;
                    
                    // 获取精确的站点信息
                    const depStation = departureStation && departureStation.type === 'train' 
                        ? { name: departureStation.name, code: departureStation.code }
                        : getStationInfo(departure, 'train');
                    const hubTrainStation = getStationInfo(hub, 'train');
                    const hubAirport = getStationInfo(hub, 'plane');
                    const destStation = destinationStation && destinationStation.type === 'plane'
                        ? { name: destinationStation.name, code: destinationStation.code }
                        : getStationInfo(destination, 'plane');

                    bestPlan = {
                        type: 'transfer',
                        departure: departure,
                        destination: destination,
                        hub: hub,
                        distance: dist1 + dist2,
                        time: totalTime,
                        cost: totalCost,
                        journey: [
                            { type: 'train', from: departure, fromStation: depStation.name, fromStationCode: depStation.code, to: hub, toStation: hubTrainStation.name, toStationCode: hubTrainStation.code, distance: dist1, time: trainTime1, cost: trainCost1 },
                            { type: 'wait', duration: waitTime, location: hub },
                            { type: 'plane', from: hub, fromStation: hubAirport.name, fromStationCode: hubAirport.code, to: destination, toStation: destStation.name, toStationCode: destStation.code, distance: dist2, time: flightTime2, cost: flightCost2 }
                        ],
                        isRecommended: false
                    };
                }
            });

            return bestPlan;
        }

                    }
                }
                return { name: type === 'train' ? city + '站' : city + '机场', code: '' };
            };

            hubCities.forEach(hub => {
                if (hub === departure || hub === destination) return;

                const dist1 = getActualDistance(departure, hub);
                const dist2 = getActualDistance(hub, destination);

                const flightTime1 = calculateFlightTime(dist1);
                const flightTime2 = calculateFlightTime(dist2);
                const waitTime = 2.5;
                const totalTime = flightTime1 + flightTime2 + waitTime;

                const flightCost1 = calculateFlightCost(departure, hub, dateStr);
                const flightCost2 = calculateFlightCost(hub, destination, dateStr);
                const totalCost = flightCost1 + flightCost2;

                let score = preference === 'economy' 
                    ? totalCost * 0.6 + totalTime * 10
                    : preference === 'speed' 
                        ? totalCost * 0.3 + totalTime * 10
                        : totalCost * 0.45 + totalTime * 10;

                if (score < minScore) {
                    minScore = score;
                    
                    const depStation = departureStation && departureStation.type === 'plane' 
                        ? { name: departureStation.name, code: departureStation.code }
                        : getStationInfo(departure, 'plane');
                    const hubAirport1 = getStationInfo(hub, 'plane');
                    const hubAirport2 = getStationInfo(hub, 'plane');
                    const destStation = destinationStation && destinationStation.type === 'plane'
                        ? { name: destinationStation.name, code: destinationStation.code }
                        : getStationInfo(destination, 'plane');

                    bestPlan = {
                        type: 'transfer_plane',
                        departure: departure,
                        destination: destination,
                        hub: hub,
                        distance: dist1 + dist2,
                        time: totalTime,
                        cost: totalCost,
                        journey: [
                            { type: 'plane', from: departure, fromStation: depStation.name, fromStationCode: depStation.code, to: hub, toStation: hubAirport1.name, toStationCode: hubAirport1.code, distance: dist1, time: flightTime1, cost: flightCost1 },
                            { type: 'wait', duration: waitTime, location: hub },
                            { type: 'plane', from: hub, fromStation: hubAirport2.name, fromStationCode: hubAirport2.code, to: destination, toStation: destStation.name, toStationCode: destStation.code, distance: dist2, time: flightTime2, cost: flightCost2 }
                        ],
                        isRecommended: false
                    };
                }
            });

            return bestPlan;
        }

        // ==========================================
        // 从站点名称解析城市信息
        // ==========================================
        function parseStationToCity(inputValue) {
            // 首先检查是否是城市名称
            if (cities[inputValue]) {
                return { city: inputValue, station: null };
            }
            
            // 遍历所有城市的站点，查找匹配
            for (const cityName of Object.keys(cities)) {
                const cityData = cities[cityName];
                
                // 检查高铁站
                if (cityData.stations) {
                    for (const station of cityData.stations) {
                        if (station.name === inputValue) {
                            return { city: cityName, station: { name: station.name, code: station.code, type: 'train' } };
                        }
                    }
                }
                
                // 检查机场
                if (cityData.airports) {
                    for (const airport of cityData.airports) {
                        if (airport.name === inputValue) {
                            return { city: cityName, station: { name: airport.name, code: airport.code, type: 'plane' } };
                        }
                    }
                }
            }
            
            return null;
        }

        // ==========================================

            const urls = [];
            const getTrainCode = (city) => trainCodes[city] || (cities[city] && cities[city].trainCode) || '';
            
            const stationEncodings = {
                '北京': '%B1%B1%BE%A9', '上海': '%C9%CF%BA%A3', '广州': '%B9%E3%D6%DD', '深圳': '%C9%EE%DB%DA',
                '成都': '%B3%C9%B6%BC', '重庆': '%D6%D8%C7%EC', '西安': '%CE%F7%B0%B2', '武汉': '%CE%E4%BA%BA',
                '杭州': '%BA%BC%D6%DD', '南京': '%C4%CF%BE%A9', '长沙': '%B3%A4%C9%B3', '郑州': '%D6%A3%D6%DD',
                '昆明': '%C0%A5%C3%F7', '厦门': '%CF%C3%C3%E6', '青岛': '%C7%E0%B5%BA', '大连': '%B4%F3%C1%AC'
            };

            if (plan.type === 'train') {
                const trainCode = getTrainCode(plan.departure);
                const destTrainCode = getTrainCode(plan.destination);
                const fromStationEnc = stationEncodings[plan.departure] || encodeURIComponent(plan.departure);
                const toStationEnc = stationEncodings[plan.destination] || encodeURIComponent(plan.destination);

                const url = trainCode && destTrainCode
                    ? `https://kyfw.12306.cn/otn/leftTicket/init?leftTicketDTO.train_date=${dateStr}&leftTicketDTO.from_station=${trainCode}&leftTicketDTO.to_station=${destTrainCode}&leftTicketDTO.from_station_name=${fromStationEnc}&leftTicketDTO.to_station_name=${toStationEnc}`
                    : `https://kyfw.12306.cn/otn/leftTicket/init`;
                urls.push(url);
            } else if (plan.type === 'transfer_train') {
                const trainCode1 = getTrainCode(plan.departure);
                const hubTrainCode = getTrainCode(plan.hub);
                const trainCode2 = getTrainCode(plan.destination);
                const fromStationEnc = stationEncodings[plan.departure] || encodeURIComponent(plan.departure);
                const hubStationEnc = stationEncodings[plan.hub] || encodeURIComponent(plan.hub);
                const toStationEnc = stationEncodings[plan.destination] || encodeURIComponent(plan.destination);

                const url1 = trainCode1 && hubTrainCode
                    ? `https://kyfw.12306.cn/otn/leftTicket/init?leftTicketDTO.train_date=${dateStr}&leftTicketDTO.from_station=${trainCode1}&leftTicketDTO.to_station=${hubTrainCode}&leftTicketDTO.from_station_name=${fromStationEnc}&leftTicketDTO.to_station_name=${hubStationEnc}`
                    : `https://kyfw.12306.cn/otn/leftTicket/init`;
                
                const url2 = hubTrainCode && trainCode2
                    ? `https://kyfw.12306.cn/otn/leftTicket/init?leftTicketDTO.train_date=${dateStr}&leftTicketDTO.from_station=${hubTrainCode}&leftTicketDTO.to_station=${trainCode2}&leftTicketDTO.from_station_name=${hubStationEnc}&leftTicketDTO.to_station_name=${toStationEnc}`
                    : `https://kyfw.12306.cn/otn/leftTicket/init`;

                urls.push(url1, url2);
            }

            return urls;
        }

        // ==========================================
        // 搜索路线
        // ==========================================
        function searchRoutes() {
            const departureInput = document.getElementById('departure').value.trim();
            const destinationInput = document.getElementById('destination').value.trim();
            const dateStr = document.getElementById('travelDate').value;
            const returnDateStr = document.getElementById('returnDate').value;
            const preference = document.querySelector('input[name="preference"]:checked').value;
            const tripType = document.querySelector('input[name="tripType"]:checked').value;
            
            // 解析出发地（可能是城市名或站点名）
            const departureResult = parseStationToCity(departureInput);
            const destinationResult = parseStationToCity(destinationInput);

            // 获取用户选择的站点信息（如果有的话）
            let departureStation = null;
            let destinationStation = null;
            
            const departureStationValue = document.getElementById('departureStation').value;
            const destinationStationValue = document.getElementById('destinationStation').value;
            
            // 如果用户通过下拉框选择了站点，使用选择的站点
            if (departureStationValue) {
                departureStation = JSON.parse(departureStationValue);
            } else if (departureResult && departureResult.station) {
                // 否则使用解析出的站点
                departureStation = departureResult.station;
            }
            
            if (destinationStationValue) {
                destinationStation = JSON.parse(destinationStationValue);
            } else if (destinationResult && destinationResult.station) {
                destinationStation = destinationResult.station;
            }

            // 获取城市名称
            const departure = departureResult ? departureResult.city : '';
            const destination = destinationResult ? destinationResult.city : '';

            // 验证输入
            const alertBox = document.getElementById('alertBox');
            alertBox.classList.remove('show');

            if (!departure) {
                showAlert('请输入出发城市或站点');
                return;
            }
            if (!destination) {
                showAlert('请输入目的城市或站点');
                return;
            }

            if (departure === destination) {
                showAlert('出发城市和目的城市不能相同');
                return;
            }
            if (!dateStr) {
                showAlert('请选择出发日期');
                return;
            }

            // 检查日期是否在今天之前
            const selectedDate = new Date(dateStr);
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            if (selectedDate < today) {
                showAlert('出发日期不能早于今天');
                return;
            }

            // 往返行程验证
            if (tripType === 'roundtrip') {
                if (!returnDateStr) {
                    showAlert('请选择返程日期');
                    return;
                }
                const returnDate = new Date(returnDateStr);
                if (returnDate < selectedDate) {
                    showAlert('返程日期不能早于出发日期');
                    return;
                }
            }

            // 显示加载动画
            const loading = document.getElementById('loading');
            const resultsSection = document.getElementById('resultsSection');
            const comparisonSection = document.getElementById('comparisonSection');
            
            loading.classList.add('show');
            resultsSection.classList.remove('show');
            comparisonSection.classList.remove('show');

            // 模拟1秒加载
            setTimeout(function() {
                // 生成去程方案
                const departurePlans = generateDirectPlans(departure, destination, dateStr, preference, departureStation, destinationStation);
                const departureTransferPlans = generateTransferPlans(departure, destination, dateStr, preference, departureStation, destinationStation);
                
                departureTransferPlans.forEach(tp => {
                    departurePlans.push(tp);
                });

                // 排序去程方案
                departurePlans.sort((a, b) => {
                    if (preference === 'economy') return a.cost - b.cost;
                    if (preference === 'speed') return a.time - b.time;
                    return (a.cost * 0.45 + a.time * 10) - (b.cost * 0.45 + b.time * 10);
                });

                // 如果是往返行程，生成返程方案
                let returnPlans = [];
                if (tripType === 'roundtrip') {
                    returnPlans = generateDirectPlans(destination, departure, returnDateStr, preference, destinationStation, departureStation);
                    const returnTransferPlans = generateTransferPlans(destination, departure, returnDateStr, preference, destinationStation, departureStation);
                    returnTransferPlans.forEach(tp => {
                        returnPlans.push(tp);
                    });
                    
                    // 排序返程方案
                    returnPlans.sort((a, b) => {
                        if (preference === 'economy') return a.cost - b.cost;
                        if (preference === 'speed') return a.time - b.time;
                        return (a.cost * 0.45 + a.time * 10) - (b.cost * 0.45 + b.time * 10);
                    });
                }

                // 标记推荐方案
                departurePlans.forEach((plan, index) => {
                    plan.isRecommended = (index === 0);
                });
                returnPlans.forEach((plan, index) => {
                    plan.isRecommended = (index === 0);
                });

                // 存储当前方案数据到全局变量
                currentDeparturePlans = departurePlans;
                currentReturnPlans = returnPlans;
                currentTripType = tripType;
                currentDepartureCity = departure;
                currentDestinationCity = destination;
                currentDepartureDate = dateStr;
                currentReturnDate = returnDateStr;
                
                // 重置选中的方案
                selectedDeparturePlan = null;
                selectedReturnPlan = null;

                // 渲染方案
                renderPlans(departurePlans, dateStr, returnPlans, returnDateStr, tripType);
                renderComparison(departurePlans, returnPlans, tripType);

                // 隐藏加载动画，显示结果
                loading.classList.remove('show');
                resultsSection.classList.add('show');
                comparisonSection.classList.add('show');

            }, 1000);
        }

                let buttonsHTML = `
                    <button class="select-btn" onclick="selectPlan('departure', ${index}, '${plan.type}')">
                        ✅ 选择此方案
                    </button>
                `;

                card.innerHTML = `
                    <div class="ai-badge">🔥 AI推荐</div>
                    <div class="plan-header">
                        <div class="plan-name">${plan.name}</div>
                        <div class="plan-price">约￥${plan.cost}</div>
                    </div>
                    <div class="plan-meta">
                        <div class="meta-item">
                            <span class="icon">⏱️</span>
                            <span>约${plan.time.toFixed(1)}小时</span>
                        </div>
                        <div class="meta-item">
                            <span class="icon">📍</span>
                            <span>约${plan.distance}公里</span>
                        </div>
                    </div>
                    <div class="plan-details">
                        <div class="detail-title">📋 行程详情</div>
                        ${journeyHTML}
                    </div>
                    <div class="price-tip">💰 价格为参考预估，点击购票按钮查看实时价格</div>
                    <div class="booking-buttons">
                        ${buttonsHTML}
                    </div>
                `;

                departureSection.appendChild(card);
                });
            }

            // 渲染返程方案
            if (tripType === 'roundtrip' && returnPlans.length > 0) {
                const returnSection = document.createElement('div');
                returnSection.className = 'trip-section';
                returnSection.innerHTML = `<h3 class="section-title">🔄 返程（${returnDateStr}）</h3>`;
                container.appendChild(returnSection);

                returnPlans.forEach((plan, index) => {
                    const card = document.createElement('div');
                    card.className = 'plan-card' + (plan.isRecommended ? ' recommended' : '');

                    // 生成旅程详情HTML
                    let journeyHTML = '';
                    plan.journey.forEach(step => {
                        if (step.type === 'train') {
                            journeyHTML += `
                                <div class="journey-step">
                                    <div class="step-icon train">🚄</div>
                                    <div class="step-content">
                                        <div class="step-route">${step.fromStation} → ${step.toStation}</div>
                                        <div class="step-info">高铁 · ${step.time.toFixed(1)}小时 · 约${step.distance}公里 · ￥${step.cost}</div>
                                    </div>
                                </div>
                            `;
                        } else if (step.type === 'plane') {
                            journeyHTML += `
                                <div class="journey-step">
                                    <div class="step-icon plane">✈️</div>
                                    <div class="step-content">
                                        <div class="step-route">${step.fromStation} → ${step.toStation}</div>
                                        <div class="step-info">飞机 · ${step.time.toFixed(1)}小时 · 约${step.distance}公里 · ￥${step.cost}</div>
                                    </div>
                                </div>
                            `;
                        } else if (step.type === 'wait') {
                            journeyHTML += `
                                <div class="journey-step">
                                    <div class="step-icon wait">⏱️</div>
                                    <div class="step-content">
                                        <div class="step-route">${step.location ? step.location + ' 换乘等候' : '换乘等候'}</div>
                                        <div class="step-info">预计等待 ${step.duration.toFixed(1)} 小时</div>
                                    </div>
                                </div>
                            `;
                        }
                    });

                    // 生成选择方案按钮HTML
                    let buttonsHTML = `
                        <button class="select-btn" onclick="selectPlan('return', ${index}, '${plan.type}')">
                            ✅ 选择此方案
                        </button>
                    `;

                    card.innerHTML = `
                        <div class="ai-badge">🔥 AI推荐</div>
                        <div class="plan-header">
                            <div class="plan-name">${plan.name}</div>
                            <div class="plan-price">约￥${plan.cost}</div>
                        </div>
                        <div class="plan-meta">
                            <div class="meta-item">
                                <span class="icon">⏱️</span>
                                <span>约${plan.time.toFixed(1)}小时</span>
                            </div>
                            <div class="meta-item">
                                <span class="icon">📍</span>
                                <span>约${plan.distance}公里</span>
                            </div>
                        </div>
                        <div class="plan-details">
                            <div class="detail-title">📋 行程详情</div>
                            ${journeyHTML}
                        </div>
                        <div class="price-tip">💰 价格为参考预估，点击购票按钮查看实时价格</div>
                        <div class="booking-buttons">
                            ${buttonsHTML}
                        </div>
                    `;

                    returnSection.appendChild(card);
                });
            }
        }

        // ==========================================
        // 渲染对比表格
        // ==========================================
        function renderComparison(departurePlans, returnPlans = [], tripType = 'oneway') {
            // 显示/隐藏返程对比表
            const returnComparisonWrapper = document.getElementById('returnComparisonWrapper');
            if (tripType === 'roundtrip') {
                returnComparisonWrapper.style.display = 'block';
            } else {
                returnComparisonWrapper.style.display = 'none';
            }

            // 显示/隐藏往返总计
            const roundtripSummary = document.getElementById('roundtripSummary');
            if (tripType === 'roundtrip') {
                roundtripSummary.style.display = 'block';
                // 计算往返总计
                const departureRecommended = departurePlans.find(p => p.isRecommended);
                const returnRecommended = returnPlans.find(p => p.isRecommended);
                if (departureRecommended && returnRecommended) {
                    document.getElementById('totalTime').textContent = (departureRecommended.time + returnRecommended.time).toFixed(1);
                    document.getElementById('totalCost').textContent = departureRecommended.cost + returnRecommended.cost;
                }
            } else {
                roundtripSummary.style.display = 'none';
            }

            // 渲染去程对比表
            renderSingleComparison('departureComparisonBody', departurePlans);

            // 渲染返程对比表
            if (tripType === 'roundtrip') {
                renderSingleComparison('returnComparisonBody', returnPlans);
            }
        }

        // 渲染单个对比表格
        function renderSingleComparison(tbodyId, plans) {
            const tbody = document.getElementById(tbodyId);
            tbody.innerHTML = '';

            // 按推荐指数和综合评分排序
            const sortedPlans = [...plans].sort((a, b) => {
                if (a.isRecommended && !b.isRecommended) return -1;
                if (!a.isRecommended && b.isRecommended) return 1;
                // 按时间和费用综合排序
                return (a.cost * 0.45 + a.time * 10) - (b.cost * 0.45 + b.time * 10);
            });

            // 默认显示前3个方案，其余隐藏
            sortedPlans.forEach((plan, index) => {
                let method = '';
                if (plan.type === 'train') method = '🚄 高铁直达';
                else if (plan.type === 'plane') method = '✈️ 飞机直达';
                else if (plan.type === 'transfer') method = '🔄 高铁+飞机';
                else if (plan.type === 'transfer_train') method = '🚄 高铁中转';
                else if (plan.type === 'transfer_plane') method = '✈️ 飞机中转';
                else method = '🔄 中转';

                let recommendText = '★★★☆☆';
                if (plan.isRecommended) recommendText = '★★★★★';

                // 移除方案字母标识
                const planName = plan.name.replace('方案A：', '').replace('方案B：', '').replace('方案C：', '').replace('方案D：', '').replace('方案E：', '');

                const tr = document.createElement('tr');
                // 默认隐藏第3行之后的方案
                if (index > 2) {
                    tr.classList.add('hidden');
                }
                tr.innerHTML = `
                    <td><strong>${planName}</strong></td>
                    <td>${method}</td>
                    <td>${plan.time.toFixed(1)}小时</td>
                    <td style="color: #1A73E8; font-weight: 700;">￥${plan.cost}</td>
                    <td>${plan.isRecommended ? '<span class="recommend-tag">推荐</span>' : recommendText}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
