<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>木星的生字闯关乐园</title>
    <style>
        @keyframes starBurst {
            0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
            50% { transform: translate(var(--tx), var(--ty)) scale(1.5); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }
        
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.1); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        :root {
            --bright-red: #FF4757;
            --bright-orange: #FFA502;
            --bright-yellow: #FFD93D;
            --bright-green: #2ED573;
            --bright-blue: #1E90FF;
            --bright-purple: #A78BFA;
            --bright-pink: #FF6B9D;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'SimHei', sans-serif;
            background: linear-gradient(135deg, #ffeaa7 0%, #fd79a8 50%, #a29bfe 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
            padding: 0 16px;
        }

        @media (min-width: 768px) {
            .container {
                max-width: 560px;
                padding: 0 24px;
            }
            body {
                background: linear-gradient(135deg, #ffeaa7 0%, #fd79a8 30%, #a29bfe 60%, #74b9ff 100%);
            }
        }

        @media (min-width: 1024px) {
            .container {
                max-width: 720px;
            }
        }

        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .flex-row { flex-direction: row; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .text-center { text-align: center; }
        .w-full { width: 100%; }
        .min-h-screen { min-height: 100vh; }
        .flex-1 { flex: 1; }
        .sticky { position: sticky; }
        .top-0 { top: 0; }
        .z-50 { z-index: 50; }
        .hidden { display: none !important; }
        .cursor-pointer { cursor: pointer; }

        .px-4 { padding-left: 16px; padding-right: 16px; }
        .px-6 { padding-left: 24px; padding-right: 24px; }
        .py-3 { padding-top: 12px; padding-bottom: 12px; }
        .py-6 { padding-top: 24px; padding-bottom: 24px; }

        .mt-4 { margin-top: 16px; }
        .mt-6 { margin-top: 24px; }
        .mt-8 { margin-top: 32px; }
        .mb-2 { margin-bottom: 8px; }
        .mb-4 { margin-bottom: 16px; }
        .mb-6 { margin-bottom: 24px; }
        .mb-8 { margin-bottom: 32px; }

        .gap-2 { gap: 8px; }
        .gap-3 { gap: 12px; }
        .gap-4 { gap: 16px; }

        .grid { display: grid; }
        .grid-cols-4 { grid-template-columns: repeat(4, 1fr); }

        .rounded-full { border-radius: 9999px; }
        .rounded-xl { border-radius: 12px; }
        .rounded-2xl { border-radius: 16px; }
        .rounded-3xl { border-radius: 24px; }

        .border-2 { border-width: 2px; }

        .text-xl { font-size: 20px; }
        .text-2xl { font-size: 24px; }
        .text-3xl { font-size: 30px; }
        .text-4xl { font-size: 36px; }
        .text-5xl { font-size: 48px; }
        .text-6xl { font-size: 56px; }
        .text-8xl { font-size: 96px; }
        .text-sm { font-size: 14px; }
        .text-base { font-size: 16px; }
        .font-bold { font-weight: 700; }

        .bg-white { background-color: #fff; }
        .bg-bright-yellow-20 { background-color: rgba(255, 217, 61, 0.2); }
        .bg-bright-green { background-color: var(--bright-green); }
        .bg-bright-red { background-color: var(--bright-red); }
        .bg-bright-orange { background-color: var(--bright-orange); }
        .bg-gray-200 { background-color: #e5e7eb; }
        .bg-white-95 { background-color: rgba(255, 255, 255, 0.95); }
        .bg-white-80 { background-color: rgba(255, 255, 255, 0.8); }

        .text-gray-800 { color: #1f2937; }
        .text-gray-600 { color: #4b5563; }
        .text-gray-500 { color: #6b7280; }
        .text-gray-400 { color: #9ca3af; }
        .text-gray-700 { color: #374151; }
        .text-white { color: #fff; }
        .text-bright-red { color: var(--bright-red); }
        .text-bright-yellow { color: var(--bright-yellow); }
        .text-bright-blue { color: var(--bright-blue); }
        .text-bright-green { color: var(--bright-green); }
        .text-bright-purple { color: var(--bright-purple); }

        .border-bright-red { border-color: var(--bright-red); }
        .border-bright-orange { border-color: var(--bright-orange); }
        .border-bright-green { border-color: var(--bright-green); }
        .border-bright-blue { border-color: var(--bright-blue); }
        .border-bright-purple { border-color: var(--bright-purple); }

        .shadow-sm { box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .backdrop-blur-md { backdrop-filter: blur(12px); }

        .space-y-1 > * + * { margin-top: 4px; }
        .space-y-3 > * + * { margin-top: 12px; }

        .min-h-60px { min-height: 60px; }

        .star-animation { animation: starBurst 1s ease-out forwards; }
        .bounce-in { animation: bounceIn 0.5s ease-out; }
        .shake { animation: shake 0.3s ease-in-out; }
        .pulse { animation: pulse 2s infinite; }

        .card-shadow { box-shadow: 0 12px 35px rgba(0, 0, 0, 0.18); }
        .btn-press:active { transform: scale(0.96); }

        .character-card {
            background: radial-gradient(circle at 30% 30%, #fff9e6, #ffffff);
        }

        .option-btn {
            transition: all 0.25s ease;
            font-size: 20px;
            padding: 16px 20px;
            border-radius: 12px;
            border: 2px solid rgba(30, 144, 255, 0.4);
            background: rgba(255, 255, 255, 0.95);
            color: #1E90FF;
            font-weight: 700;
        }
        
        .option-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(30, 144, 255, 0.35);
        }

        .next-btn {
            background: linear-gradient(135deg, #FF6B9D, #FF4757);
            color: white;
            font-size: 20px;
            padding: 16px 32px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            box-shadow: 0 6px 20px rgba(255, 71, 87, 0.4);
            transition: all 0.25s;
        }

        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 71, 87, 0.5);
        }

        .level-btn {
            transition: all 0.25s;
        }

        .level-btn:hover {
            transform: translateY(-4px);
        }

        .level-lock {
            filter: grayscale(100%);
            opacity: 0.4;
            pointer-events: none;
        }

        .star {
            color: #FFD700;
            text-shadow: 0 2px 4px rgba(255, 215, 0, 0.5);
        }

        .pinyin-hidden { opacity: 0.3; }

        .author-badge {
            background: linear-gradient(135deg, #A78BFA, #6366F1);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(167, 139, 250, 0.4);
        }

        .title-emoji {
            font-size: 48px;
            animation: pulse 3s infinite;
        }

        @media (min-width: 768px) {
            .text-3xl { font-size: 40px; }
            .text-4xl { font-size: 48px; }
            .text-6xl { font-size: 80px; }
            .text-8xl { font-size: 120px; }
            .text-sm { font-size: 16px; }
            .text-base { font-size: 18px; }
            
            .option-btn {
                font-size: 24px;
                padding: 20px 24px;
            }
            
            .next-btn {
                font-size: 24px;
                padding: 20px 48px;
            }
            
            .title-emoji {
                font-size: 64px;
            }
            
            .px-6 { padding-left: 32px; padding-right: 32px; }
            .py-6 { padding-top: 32px; padding-bottom: 32px; }
            .py-3 { padding-top: 16px; padding-bottom: 16px; }
            .mb-6 { margin-bottom: 32px; }
            .mb-8 { margin-bottom: 40px; }
            
            .author-badge {
                font-size: 16px;
                padding: 10px 20px;
            }
            
            .character-card {
                padding: 40px !important;
            }
        }

        @media (min-width: 1024px) {
            .container {
                max-width: 720px;
            }
        }
    </style>
</head>
<body>
    <div id="app" class="min-h-screen flex flex-col">
        <header class="bg-white-95 backdrop-blur-md shadow-sm sticky top-0 z-50">
            <div class="container px-4 py-3 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <span class="text-2xl">🪐</span>
                    <h1 class="text-xl font-bold text-bright-purple">木星的生字闯关乐园</h1>
                </div>
                <div class="flex items-center gap-2 bg-bright-yellow-20 px-3 py-1 rounded-full">
                    <span class="star text-xl">★</span>
                    <span id="score-display" class="font-bold text-bright-yellow text-xl">0</span>
                </div>
            </div>
        </header>

        <main class="flex-1 container w-full px-4 py-6">
            <div id="start-screen" class="flex flex-col items-center justify-center h-full text-center">
                <div class="title-emoji mb-6 bounce-in">🪐</div>
                <h2 class="text-3xl font-bold text-bright-purple mb-2">木星的生字闯关乐园</h2>
                <div class="author-badge mb-6">
                    <span>👨‍🏫</span>
                    <span>作者：霍豪杰</span>
                </div>
                <p class="text-gray-600 mb-8 text-base">选择关卡开始挑战吧！</p>
                
                <div class="grid grid-cols-4 gap-3 w-full mb-6">
                    <button onclick="selectLevel(1)" class="level-btn bg-white rounded-2xl p-4 card-shadow btn-press flex flex-col items-center gap-2 border-2 border-bright-red">
                        <span class="text-2xl">🌱</span>
                        <span class="font-bold text-bright-red">第1关</span>
                    </button>
                    <button onclick="selectLevel(2)" class="level-btn bg-white rounded-2xl p-4 card-shadow btn-press flex flex-col items-center gap-2 border-2 border-bright-orange level-lock">
                        <span class="text-2xl">🌻</span>
                        <span class="font-bold text-bright-orange">第2关</span>
                    </button>
                    <button onclick="selectLevel(3)" class="level-btn bg-white rounded-2xl p-4 card-shadow btn-press flex flex-col items-center gap-2 border-2 border-bright-blue level-lock">
                        <span class="text-2xl">⭐</span>
                        <span class="font-bold text-bright-blue">第3关</span>
                    </button>
                    <button onclick="selectLevel(4)" class="level-btn bg-white rounded-2xl p-4 card-shadow btn-press flex flex-col items-center gap-2 border-2 border-bright-green level-lock">
                        <span class="text-2xl">🏆</span>
                        <span class="font-bold text-bright-green">第4关</span>
                    </button>
                </div>
                
                <div class="bg-white-80 rounded-2xl px-6 py-4 w-full text-left">
                    <h3 class="font-bold text-bright-purple mb-2">📖 学习提示</h3>
                    <ul class="text-sm text-gray-600 space-y-1">
                        <li>• 点击汉字卡片可以查看拼音和意思</li>
                        <li>• 选择正确的读音，答对得10分！</li>
                        <li>• 每关答对3题以上即可过关</li>
                        <li>• 答完题后点击"下一题"继续挑战</li>
                    </ul>
                </div>
            </div>

            <div id="game-screen" class="hidden">
                <div class="flex items-center justify-between mb-4">
                    <button onclick="backToHome()" class="bg-white-95 px-4 py-2 rounded-full text-gray-600 btn-press flex items-center gap-1 shadow-sm">
                        <span>←</span> 返回
                    </button>
                    <div class="flex items-center gap-2">
                        <span class="text-gray-600">第</span>
                        <span id="current-level" class="font-bold text-bright-purple text-xl">1</span>
                        <span class="text-gray-600">关</span>
                        <span class="text-gray-400">|</span>
                        <span id="progress-text" class="text-gray-600">1/5</span>
                    </div>
                </div>

                <div class="bg-white rounded-3xl px-6 py-6 card-shadow mb-6 character-card cursor-pointer" onclick="togglePinyin()">
                    <div class="flex flex-col items-center">
                        <div id="character-display" class="text-8xl font-bold text-bright-purple mb-4 bounce-in">字</div>
                        <div id="pinyin-display" class="text-2xl text-bright-blue mb-2 pinyin-hidden">点击查看拼音</div>
                        <div id="meaning-display" class="text-gray-600 text-center text-sm">点击卡片查看意思</div>
                    </div>
                </div>

                <div id="options-container" class="space-y-3">
                </div>

                <div id="feedback-area" class="mt-6 min-h-60px flex flex-col items-center justify-center">
                    <div id="feedback-text" class="text-xl font-bold"></div>
                    <button onclick="nextCharacter()" id="next-btn" class="next-btn hidden mt-4 bounce-in">
                        👉 下一题
                    </button>
                </div>
            </div>

            <div id="result-screen" class="hidden flex flex-col items-center justify-center h-full text-center">
                <div id="result-emoji" class="text-6xl mb-4"></div>
                <h2 id="result-title" class="text-3xl font-bold mb-4"></h2>
                <div class="bg-white rounded-2xl px-6 py-6 card-shadow mb-6 w-full">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-gray-600">本关得分</span>
                        <span id="level-score" class="font-bold text-bright-purple text-2xl">0</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-600">累计得分</span>
                        <span id="total-score" class="font-bold text-bright-yellow text-2xl">0</span>
                    </div>
                </div>
                <div class="flex gap-4 w-full">
                    <button onclick="backToHome()" class="flex-1 bg-gray-200 text-gray-700 py-3 rounded-xl font-bold btn-press">返回首页</button>
                    <button onclick="nextLevel()" id="next-level-btn" class="flex-1 bg-bright-green text-white py-3 rounded-xl font-bold btn-press">下一关</button>
                    <button onclick="retryLevel()" id="retry-btn" class="flex-1 bg-bright-orange text-white py-3 rounded-xl font-bold btn-press hidden">再试一次</button>
                </div>
            </div>
        </main>

        <div id="stars-container"></div>
    </div>

    <script>
        const levels = [
            {
                id: 1,
                name: '第一关',
                characters: [
                    { char: '晨', pinyin: 'chén', meaning: '早晨，天刚亮的时候', distractors: ['chéng', 'chěn', 'cén'] },
                    { char: '绒', pinyin: 'róng', meaning: '柔软细小的毛', distractors: ['yóng', 'rǒng', 'lóng'] },
                    { char: '汉', pinyin: 'hàn', meaning: '汉族，中国人数最多的民族', distractors: ['hǎn', 'hán', 'hàng'] },
                    { char: '艳', pinyin: 'yàn', meaning: '色彩鲜艳美丽', distractors: ['yán', 'yàng', 'yǎn'] },
                    { char: '服', pinyin: 'fú', meaning: '衣服，穿在身上的东西', distractors: ['fù', 'fū', 'fǔ'] },
                ]
            },
            {
                id: 2,
                name: '第二关',
                characters: [
                    { char: '装', pinyin: 'zhuāng', meaning: '装饰，打扮', distractors: ['zuāng', 'zhuàng', 'zhuān'] },
                    { char: '扮', pinyin: 'bàn', meaning: '装扮，扮演', distractors: ['bān', 'bǎn', 'bāng'] },
                    { char: '读', pinyin: 'dú', meaning: '阅读，看书', distractors: ['dǔ', 'dù', 'dōu'] },
                    { char: '静', pinyin: 'jìng', meaning: '安静，没有声音', distractors: ['jìn', 'jīng', 'jǐng'] },
                    { char: '舞', pinyin: 'wǔ', meaning: '跳舞，舞蹈', distractors: ['wù', 'wū', 'wú'] },
                ]
            },
            {
                id: 3,
                name: '第三关',
                characters: [
                    { char: '荒', pinyin: 'huāng', meaning: '荒芜，荒凉', distractors: ['huáng', 'huǎng', 'hāng'] },
                    { char: '笛', pinyin: 'dí', meaning: '笛子，一种管乐器', distractors: ['dī', 'dǐ', 'dì'] },
                    { char: '猜', pinyin: 'cāi', meaning: '猜测，推测', distractors: ['cái', 'cǎi', 'cài'] },
                    { char: '扬', pinyin: 'yáng', meaning: '扬起，飘扬', distractors: ['yǎng', 'yàng', 'yāng'] },
                    { char: '臂', pinyin: 'bì', meaning: '胳膊，手臂', distractors: ['bēi', 'bí', 'bǐ'] },
                ]
            },
            {
                id: 4,
                name: '第四关',
                characters: [
                    { char: '落', pinyin: 'luò', meaning: '落下，掉落', distractors: ['lào', 'luō', 'lù'] },
                    { char: '影', pinyin: 'yǐng', meaning: '影子，影子', distractors: ['yīng', 'yíng', 'yǐn'] },
                    { char: '珠', pinyin: 'zhū', meaning: '珍珠，珠子', distractors: ['zhú', 'zhǔ', 'zhù'] },
                    { char: '摇', pinyin: 'yáo', meaning: '摇动，摇晃', distractors: ['yǎo', 'yào', 'yāo'] },
                    { char: '蜘', pinyin: 'zhī', meaning: '蜘蛛，一种节肢动物', distractors: ['zhí', 'zhǐ', 'zhì'] },
                ]
            }
        ];

        let currentLevel = 1;
        let currentCharacterIndex = 0;
        let score = 0;
        let levelScore = 0;
        let unlockedLevels = [1];
        let isAnswered = false;

        function selectLevel(levelId) {
            if (!unlockedLevels.includes(levelId)) {
                showToast('请先通过前面的关卡哦！');
                return;
            }
            
            currentLevel = levelId;
            currentCharacterIndex = 0;
            levelScore = 0;
            isAnswered = false;
            
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            
            updateLevelInfo();
            showCharacter();
        }

        function updateLevelInfo() {
            document.getElementById('current-level').textContent = currentLevel;
            const totalChars = levels[currentLevel - 1].characters.length;
            document.getElementById('progress-text').textContent = `${currentCharacterIndex + 1}/${totalChars}`;
        }

        function showCharacter() {
            const levelData = levels[currentLevel - 1];
            const charData = levelData.characters[currentCharacterIndex];
            
            document.getElementById('character-display').textContent = charData.char;
            document.getElementById('pinyin-display').textContent = '点击查看拼音';
            document.getElementById('pinyin-display').className = 'text-2xl text-bright-blue mb-2 pinyin-hidden';
            document.getElementById('meaning-display').textContent = '点击卡片查看意思';
            document.getElementById('meaning-display').className = 'text-gray-600 text-center text-sm';
            
            document.getElementById('feedback-text').textContent = '';
            document.getElementById('next-btn').classList.add('hidden');
            
            isAnswered = false;
            renderOptions(charData);
        }

        function togglePinyin() {
            const charData = levels[currentLevel - 1].characters[currentCharacterIndex];
            const pinyinDisplay = document.getElementById('pinyin-display');
            const meaningDisplay = document.getElementById('meaning-display');
            
            if (pinyinDisplay.classList.contains('pinyin-hidden')) {
                pinyinDisplay.textContent = charData.pinyin;
                pinyinDisplay.classList.remove('pinyin-hidden');
                meaningDisplay.textContent = charData.meaning;
                meaningDisplay.classList.remove('text-sm');
            } else {
                pinyinDisplay.textContent = '点击查看拼音';
                pinyinDisplay.classList.add('pinyin-hidden');
                meaningDisplay.textContent = '点击卡片查看意思';
                meaningDisplay.classList.add('text-sm');
            }
        }

        function renderOptions(charData) {
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            const allOptions = [charData.pinyin, ...charData.distractors];
            const shuffledOptions = allOptions.sort(() => Math.random() - 0.5);
            
            shuffledOptions.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full';
                btn.textContent = option;
                btn.onclick = () => checkAnswer(option, charData.pinyin, btn);
                btn.style.animationDelay = `${index * 0.1}s`;
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct, btnElement) {
            if (isAnswered) return;
            isAnswered = true;
            
            const options = document.querySelectorAll('.option-btn');
            options.forEach(opt => opt.disabled = true);
            
            const charData = levels[currentLevel - 1].characters[currentCharacterIndex];
            document.getElementById('pinyin-display').textContent = charData.pinyin;
            document.getElementById('pinyin-display').classList.remove('pinyin-hidden');
            document.getElementById('meaning-display').textContent = charData.meaning;
            document.getElementById('meaning-display').classList.remove('text-sm');
            
            if (selected === correct) {
                btnElement.style.background = '#2ED573';
                btnElement.style.color = '#ffffff';
                btnElement.style.borderColor = '#2ED573';
                btnElement.style.boxShadow = '0 6px 20px rgba(46, 213, 115, 0.4)';
                document.getElementById('feedback-text').textContent = '🎉 答对了！太棒了！';
                document.getElementById('feedback-text').style.color = '#2ED573';
                createStarBurst();
                score += 10;
                levelScore += 10;
                document.getElementById('score-display').textContent = score;
            } else {
                btnElement.style.background = '#FF4757';
                btnElement.style.color = '#ffffff';
                btnElement.style.borderColor = '#FF4757';
                btnElement.classList.add('shake');
                document.getElementById('feedback-text').textContent = '😅 答错了，再接再厉！';
                document.getElementById('feedback-text').style.color = '#FF4757';
                
                options.forEach(opt => {
                    if (opt.textContent === correct) {
                        opt.style.background = '#2ED573';
                        opt.style.color = '#ffffff';
                        opt.style.borderColor = '#2ED573';
                        opt.style.boxShadow = '0 6px 20px rgba(46, 213, 115, 0.4)';
                    }
                });
            }
            
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function createStarBurst() {
            const container = document.getElementById('stars-container');
            container.innerHTML = '';
            
            for (let i = 0; i < 12; i++) {
                const star = document.createElement('div');
                star.textContent = '★';
                star.className = 'fixed text-3xl star-animation pointer-events-none z-50';
                
                const angle = (i / 12) * 2 * Math.PI;
                const distance = 100 + Math.random() * 100;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                
                star.style.setProperty('--tx', `${tx}px`);
                star.style.setProperty('--ty', `${ty}px`);
                star.style.left = '50%';
                star.style.top = '50%';
                const colors = ['#FFD700', '#FF6B9D', '#2ED573', '#1E90FF', '#FFA502'];
                star.style.color = colors[Math.floor(Math.random() * colors.length)];
                
                container.appendChild(star);
            }
        }

        function nextCharacter() {
            const levelData = levels[currentLevel - 1];
            currentCharacterIndex++;
            
            if (currentCharacterIndex < levelData.characters.length) {
                updateLevelInfo();
                showCharacter();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            const resultEmoji = document.getElementById('result-emoji');
            const resultTitle = document.getElementById('result-title');
            const nextBtn = document.getElementById('next-level-btn');
            const retryBtn = document.getElementById('retry-btn');
            
            document.getElementById('level-score').textContent = levelScore;
            document.getElementById('total-score').textContent = score;
            
            if (levelScore >= 30) {
                resultEmoji.textContent = '🏆';
                resultTitle.textContent = '恭喜过关！';
                resultTitle.style.color = '#2ED573';
                
                if (currentLevel < levels.length) {
                    if (!unlockedLevels.includes(currentLevel + 1)) {
                        unlockedLevels.push(currentLevel + 1);
                    }
                    updateLevelButtons();
                    nextBtn.classList.remove('hidden');
                    retryBtn.classList.add('hidden');
                } else {
                    nextBtn.classList.add('hidden');
                    retryBtn.classList.add('hidden');
                    resultEmoji.textContent = '🌟';
                    resultTitle.textContent = '全部通关！你太棒了！';
                }
            } else {
                resultEmoji.textContent = '💪';
                resultTitle.textContent = '继续加油！';
                resultTitle.style.color = '#FF4757';
                nextBtn.classList.add('hidden');
                retryBtn.classList.remove('hidden');
            }
        }

        function updateLevelButtons() {
            const levelBtns = document.querySelectorAll('.level-btn');
            levelBtns.forEach((btn, index) => {
                const levelId = index + 1;
                if (unlockedLevels.includes(levelId)) {
                    btn.classList.remove('level-lock');
                }
            });
        }

        function nextLevel() {
            if (currentLevel < levels.length) {
                selectLevel(currentLevel + 1);
            }
        }

        function retryLevel() {
            selectLevel(currentLevel);
        }

        function backToHome() {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            updateLevelButtons();
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-black/80 text-white px-6 py-3 rounded-full text-lg z-50 bounce-in';
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 2000);
        }
    </script>
</body>
</html>
