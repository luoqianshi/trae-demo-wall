<svg viewBox="0 0 300 320" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .fig { fill:none; stroke:#7A4B5A; stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round; }
      .detail { fill:none; stroke:#C49A3A; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; opacity:0.55; }
      .nm { font-family:'Noto Sans CJK SC','WenQuanYi Micro Hei',sans-serif; font-size:16px; fill:#7A4B5A; text-anchor:middle; font-weight:600; letter-spacing:2px; }
      .role { font-family:'Noto Sans CJK SC','WenQuanYi Micro Hei',sans-serif; font-size:11.5px; fill:#8B7355; text-anchor:middle; letter-spacing:1px; }
      .tag { font-family:'Noto Sans CJK SC','WenQuanYi Micro Hei',sans-serif; font-size:10px; fill:#A08B7A; text-anchor:middle; }
    </style>
  </defs>
  <rect width="300" height="320" rx="16" fill="#FDF6F0"/>

  <!-- 冠帽：双层方冠（大夫冠制较高，用双层矩形暗示） -->
  <path class="fig" d="M 120 62 L 120 46 L 156 46 L 156 62"/>
  <path class="fig" d="M 124 62 L 124 72 L 152 72 L 152 62"/>

  <!-- 头部 -->
  <ellipse cx="138" cy="90" rx="15" ry="18" class="fig"/>

  <!-- 身体：宽肩挺胸，威仪感 -->
  <path class="fig" d="M 108 110 C 104 140 100 170 106 190 L 170 190 C 176 170 172 140 168 110"/>

  <!-- 左臂：叉腰 -->
  <path class="fig" d="M 108 118 C 90 130 78 152 84 172 C 88 184 100 188 114 180"/>

  <!-- 右臂：指向前方（伸出的手指指向对手） -->
  <path class="fig" d="M 168 118 C 190 122 214 118 236 106 L 248 100"/>

  <!-- 腰带（琥珀金辅色） -->
  <path class="detail" d="M 106 168 Q 138 176 170 168"/>

  <!-- 标签 -->
  <text x="138" y="232" class="nm">大夫</text>
  <text x="138" y="254" class="role">辅政议政 · 据理力争</text>
  <text x="138" y="274" class="tag">朝廷派 · 绛褐 + 琥珀金</text>
</svg>