<svg viewBox="0 0 300 320" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .fig { fill:none; stroke:#4A7A7A; stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round; }
      .detail { fill:none; stroke:#6B7B55; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; opacity:0.5; }
      .nm { font-family:'Noto Sans CJK SC','WenQuanYi Micro Hei',sans-serif; font-size:16px; fill:#4A7A7A; text-anchor:middle; font-weight:600; letter-spacing:2px; }
      .role { font-family:'Noto Sans CJK SC','WenQuanYi Micro Hei',sans-serif; font-size:11.5px; fill:#6B8A7A; text-anchor:middle; letter-spacing:1px; }
      .tag { font-family:'Noto Sans CJK SC','WenQuanYi Micro Hei',sans-serif; font-size:10px; fill:#7A9A8A; text-anchor:middle; }
    </style>
  </defs>
  <rect width="300" height="320" rx="16" fill="#FDF6F0"/>

  <!-- 无冠（儒生不着官服） -->

  <!-- 头部 -->
  <ellipse cx="145" cy="72" rx="14" ry="17" class="fig"/>

  <!-- 身体：微躬，身形收窄 -->
  <path class="fig" d="M 124 92 L 120 190 L 170 190 L 166 92"/>

  <!-- 左手：持卷（竹简横置） -->
  <path class="fig" d="M 124 108 C 108 114 88 118 72 116"/>
  <path class="fig" d="M 124 112 C 108 118 88 122 72 120"/>
  <!-- 竹简卷口 -->
  <ellipse cx="72" cy="118" rx="4" ry="4" class="fig"/>

  <!-- 右手：微抬至胸前，指向前方作陈述状 -->
  <path class="fig" d="M 166 108 C 178 118 188 128 194 138"/>

  <!-- 衣带（苔绿辅色，朴素无华） -->
  <path class="detail" d="M 120 162 Q 145 168 170 162"/>

  <!-- 标签 -->
  <text x="145" y="232" class="nm">文学</text>
  <text x="145" y="254" class="role">引经据典 · 以古非今</text>
  <text x="145" y="274" class="tag">儒生派 · 苍青</text>
</svg>