<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伴学</title>
    <style id="theme-vars">
/* 伴学小程序 — Brand CSS */
/* Primary: warm orange | Secondary: sky blue | White background | Child-friendly */

:root {
  /* Brand Colors */
  --color-primary: #FF8C42;
  --color-primary-light: #FFB87A;
  --color-primary-lighter: #FFF0E0;
  --color-primary-dark: #E07030;

  --color-secondary: #5BB8F5;
  --color-secondary-light: #A0D8FF;
  --color-secondary-lighter: #E8F4FF;
  --color-secondary-dark: #3A9AE0;

  --color-background: #FFFFFF;
  --color-surface: #FFF9F2;
  --color-surface-elevated: #FFFFFF;

  --color-text-primary: #2D2D2D;
  --color-text-secondary: #6B6B6B;
  --color-text-hint: #A0A0A0;

  --color-border: #F0E8E0;
  --color-divider: #F5F0EB;

  /* State Colors */
  --state-success: #4CAF50;
  --state-warning: #FFC107;
  --state-error: #FF5252;
  --state-info: #5BB8F5;

  /* Star / progress gold */
  --color-star: #FFD54F;
  --color-star-light: #FFF8E1;
  --color-progress-dot-active: #FF8C42;
  --color-progress-dot-inactive: #E0D8D0;

  /* Typography */
  --font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif;
  --font-family-display: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif;

  --font-size-xs: 10px;
  --font-size-sm: 12px;
  --font-size-base: 14px;
  --font-size-md: 16px;
  --font-size-lg: 20px;
  --font-size-xl: 24px;
  --font-size-2xl: 28px;
  --font-size-3xl: 32px;

  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-bold: 700;

  --line-height-tight: 1.25;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.75;

  /* Spacing */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-base: 16px;
  --space-lg: 20px;
  --space-xl: 24px;
  --space-2xl: 32px;
  --space-3xl: 40px;

  /* Radius — child-friendly, rounded */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* Shadows */
  --shadow-card: 0 2px 8px rgba(255, 140, 66, 0.08);
  --shadow-elevated: 0 4px 16px rgba(255, 140, 66, 0.12);
  --shadow-float: 0 8px 32px rgba(0, 0, 0, 0.12);
}

/* Typography Classes */
.text-xs { font-size: var(--font-size-xs); line-height: var(--line-height-normal); }
.text-sm { font-size: var(--font-size-sm); line-height: var(--line-height-normal); }
.text-base { font-size: var(--font-size-base); line-height: var(--line-height-normal); }
.text-md { font-size: var(--font-size-md); line-height: var(--line-height-normal); font-weight: var(--font-weight-medium); }
.text-lg { font-size: var(--font-size-lg); line-height: var(--line-height-tight); font-weight: var(--font-weight-bold); }
.text-xl { font-size: var(--font-size-xl); line-height: var(--line-height-tight); font-weight: var(--font-weight-bold); }
.text-2xl { font-size: var(--font-size-2xl); line-height: var(--line-height-tight); font-weight: var(--font-weight-bold); }
.text-3xl { font-size: var(--font-size-3xl); line-height: var(--line-height-tight); font-weight: var(--font-weight-bold); }

.text-primary { color: var(--color-text-primary); }
.text-secondary { color: var(--color-text-secondary); }
.text-hint { color: var(--color-text-hint); }
.text-brand { color: var(--color-primary); }
.text-brand-secondary { color: var(--color-secondary); }

.font-regular { font-weight: var(--font-weight-regular); }
.font-medium { font-weight: var(--font-weight-medium); }
.font-bold { font-weight: var(--font-weight-bold); }

/* Utility Classes */
.bg-primary { background-color: var(--color-primary); }
.bg-primary-light { background-color: var(--color-primary-lighter); }
.bg-secondary { background-color: var(--color-secondary); }
.bg-secondary-light { background-color: var(--color-secondary-lighter); }
.bg-surface { background-color: var(--color-surface); }
.bg-background { background-color: var(--color-background); }

.rounded-sm { border-radius: var(--radius-sm); }
.rounded-md { border-radius: var(--radius-md); }
.rounded-lg { border-radius: var(--radius-lg); }
.rounded-xl { border-radius: var(--radius-xl); }
.rounded-full { border-radius: var(--radius-full); }

.shadow-card { box-shadow: var(--shadow-card); }
.shadow-elevated { box-shadow: var(--shadow-elevated); }
.shadow-float { box-shadow: var(--shadow-float); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--color-background);
    --color-primary: var(--color-primary);
    --color-secondary: var(--color-secondary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="background: var(--color-surface); font-family: var(--font-family);">

    <main class="pb-[134px]">

        <!-- Status Bar Spacer -->
        <div class="h-11 bg-background"></div>

        <!-- WeChat Mini Program Nav Bar -->
        <header class="sticky top-0 z-30 bg-background border-b" style="border-color: var(--color-border);">
            <div class="flex h-11 items-center px-4">
                <!-- Left balancing area (home page, no back button) -->
                <div class="flex w-[88px] items-center justify-start">
                    <a class="inline-flex items-center gap-0.5 text-hint" style="font-size: var(--font-size-xs);" href="settings.html" aria-label="家长入口">
                        <i data-lucide="settings" class="h-3 w-3"></i>
                        <span>家长</span>
                    </a>
                </div>
                <!-- Center title -->
                <div class="min-w-0 flex-1 text-center text-md font-bold" style="color: var(--color-primary);">伴学</div>
                <!-- Right system capsule -->
                <div class="flex h-8 w-[88px] items-center rounded-full border bg-background/90" style="border-color: var(--color-border);">
                    <button class="flex h-full flex-1 items-center justify-center" aria-label="更多">
                        <i data-lucide="more-horizontal" class="h-4 w-4" style="color: var(--color-text-secondary);"></i>
                    </button>
                    <span class="h-4 w-px" style="background: var(--color-border);"></span>
                    <button class="flex h-full flex-1 items-center justify-center" aria-label="关闭">
                        <i data-lucide="x" class="h-4 w-4" style="color: var(--color-text-secondary);"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Grade/Semester/Subject Selector — 点击跳回 index.html 重新选择 -->
        <div class="flex justify-center py-3 px-4 bg-background">
            <a id="grade-term-label" href="index.html" class="inline-flex items-center gap-1.5 px-5 py-2 rounded-full font-medium" style="background: var(--color-primary); color: #FFFFFF; font-size: var(--font-size-base); box-shadow: var(--shadow-card);">
                <span>加载中…</span>
                <i data-lucide="chevron-down" class="h-3.5 w-3.5"></i>
            </a>
        </div>

        <!-- Hero Illustration Section -->
        <div class="px-4 pt-2 pb-4 bg-background">
            <div class="rounded-xl overflow-hidden" style="box-shadow: var(--shadow-elevated);">
                <img src="../assets/hero-illustration.jpg" alt="学习插画" class="w-full h-auto block" loading="eager">
            </div>
            <p class="text-center mt-3 font-bold" style="color: var(--color-primary); font-size: var(--font-size-md);">开始今天的学习吧！</p>
        </div>

        <!-- 每日打卡卡 — 由 Checkin 模块渲染 -->
        <div id="checkin-card" class="px-4 pt-1"></div>

        <!-- Learning Progress Summary — 由 Progress 模块渲染 -->
        <div id="progress-summary" class="px-4 pt-1" style="display: none;"></div>

        <!-- Course List — 由 CourseData 动态渲染 -->
        <div id="course-list" class="px-4 pt-4 space-y-5">
            <div class="text-center py-8" style="color: var(--color-text-hint); font-size: var(--font-size-sm);">加载中…</div>
        </div>

    </main>

    <!-- Bottom Tab Bar -->
    <nav class="fixed bottom-0 inset-x-0 z-30 bg-background border-t" style="border-color: var(--color-border); height: 50px;">
        <div class="flex h-full items-center justify-around max-w-[375px] mx-auto">
            <button class="flex flex-col items-center justify-center gap-0.5 px-4 h-full" data-dom-id="tab-home" aria-label="课程" style="color: var(--color-primary);">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                </svg>
                <span class="font-medium" style="font-size: var(--font-size-xs);">课程</span>
            </button>
            <button class="flex flex-col items-center justify-center gap-0.5 px-4 h-full" data-dom-id="tab-starry-sky" aria-label="星空" style="color: var(--color-text-hint);">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                </svg>
                <span style="font-size: var(--font-size-xs);">星空</span>
            </button>
        </div>
    </nav>

    <!-- Safe area bottom spacer -->
    <div class="h-[env(safe-area-inset-bottom,34px)]" style="height: 34px;"></div>

    <style>
        /* Completed progress dot glow — star collection effect */
        @keyframes star-glow {
            0%, 100% { box-shadow: 0 0 4px rgba(255,140,66,0.3); }
            50% { box-shadow: 0 0 8px rgba(255,140,66,0.6); }
        }
        .progress-dot-half {
            animation: star-glow 2s ease-in-out infinite;
        }
        /* 拼音注音样式：自定义 annotated 单元，拼音在上、汉字在下，严格居中对齐 */
        .annotated {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            margin: 0 4px;
            vertical-align: text-bottom;
        }
        .annotated .py {
            font-size: 12px;
            line-height: 1.2;
            color: var(--color-text-secondary);
            font-weight: 400;
            font-family: -apple-system, 'PingFang SC', sans-serif;
            padding-bottom: 2px;
            text-align: center;
            white-space: nowrap;
        }
        .annotated .hz {
            font-size: inherit;
            line-height: inherit;
            text-align: center;
        }
    </style>

    <!-- 课程数据访问层 + 学习进度 + 每日打卡 + 拼音注音 + 首页渲染逻辑 -->
    <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.24.2/dist/index.js"></script>
    <script>window.COURSE_DATA_BASE_PATH = '../';</script>
    <script src="../js/course-data.js"></script>
    <script src="../js/progress.js"></script>
    <script src="../js/checkin.js"></script>
    <script src="../js/pinyin.js"></script>
    <script>
    (function () {
      'use strict';

      // 默认定位：一年级 · 上册 · 语文。仅当 URL 未带参数时使用。
      var DEFAULT_GRADE_ID = 'g1';
      var DEFAULT_TERM_ID = 't1';
      var DEFAULT_SUBJECT_ID = 'chinese';

      // 解析 URL 查询参数
      function getQueryParam(name) {
        var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
        return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : null;
      }

      // 单元图标：按单元 title 关键字匹配，未命中用默认 📖
      var UNIT_ICONS = { '识字': '📖', '汉语拼音': '🔤', '拼音': '🔤', '古诗': '📜' };
      function pickUnitIcon(unit) {
        return UNIT_ICONS[unit.title] || UNIT_ICONS[unit.name] || '📘';
      }

      /**
       * 取单课进度：从 Progress 模块读 localStorage。
       * @param {object} path 含 gradeId/termId/subjectId/unitId
       * @param {object} lesson 含 id (lessonId)
       * @returns {'completed'|'in_progress'|'not_started'}
       */
      function getLessonProgress(path, lesson) {
        return Progress.get({
          gradeId: path.gradeId, termId: path.termId, subjectId: path.subjectId,
          unitId: path.unitId, lessonId: lesson.id
        });
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function renderProgressBadge(state) {
        if (state === 'completed') {
          return '<span class="w-2 h-2 rounded-full" style="background: var(--color-progress-dot-active); box-shadow: 0 0 6px rgba(255,140,66,0.5);"></span>' +
                 '<span style="font-size: var(--font-size-xs); color: var(--color-text-hint);">已完成</span>';
        }
        if (state === 'in_progress') {
          return '<span class="progress-dot-half w-2 h-2 rounded-full" style="background: linear-gradient(90deg, var(--color-progress-dot-active) 50%, var(--color-progress-dot-inactive) 50%); box-shadow: 0 0 4px rgba(255,140,66,0.3);"></span>' +
                 '<span style="font-size: var(--font-size-xs); color: var(--color-text-hint);">学习中</span>';
        }
        return '<span class="w-2 h-2 rounded-full" style="background: var(--color-progress-dot-inactive);"></span>' +
               '<span style="font-size: var(--font-size-xs); color: var(--color-text-hint);">未开始</span>';
      }

      function renderLessonCard(path, lesson) {
        var state = getLessonProgress(path, lesson);
        var numStyle;
        if (state === 'completed') {
          numStyle = 'background: var(--color-primary); color: #FFFFFF; font-weight: var(--font-weight-bold);';
        } else if (state === 'in_progress') {
          numStyle = 'background: var(--color-primary-lighter); color: var(--color-primary); font-weight: var(--font-weight-bold);';
        } else {
          numStyle = 'background: var(--color-divider); color: var(--color-text-hint); font-weight: var(--font-weight-medium);';
        }
        // 古诗课加蓝色标签，普通课不加
        var poemTag = lesson.type === 'poem'
          ? '<span class="inline-block mt-0.5 px-1.5 py-0.5 rounded" style="font-size: var(--font-size-xs); background: var(--color-secondary-lighter); color: var(--color-secondary-dark);">古诗</span>'
          : '';
        var href = 'lesson.html?grade=' + encodeURIComponent(path.gradeId) +
                   '&term=' + encodeURIComponent(path.termId) +
                   '&subject=' + encodeURIComponent(path.subjectId) +
                   '&unit=' + encodeURIComponent(path.unitId) +
                   '&lesson=' + encodeURIComponent(lesson.id);
        return '<a href="' + href + '" class="bg-background rounded-xl shadow-card p-3 flex items-start gap-2.5 min-h-[72px] block">' +
          '<span class="shrink-0 w-7 h-7 rounded-full flex items-center justify-center" style="' + numStyle + ' font-size: var(--font-size-sm);">' + lesson.no + '</span>' +
          '<div class="min-w-0 flex-1">' +
            '<p class="font-medium" style="font-size: var(--font-size-base); color: var(--color-text-primary); line-height: 1.4;">' + Pinyin.renderWithPinyin(lesson.title, path.gradeId) + '</p>' +
            poemTag +
            '<div class="flex items-center gap-1 mt-1.5">' + renderProgressBadge(state) + '</div>' +
          '</div>' +
        '</a>';
      }

      function renderUnit(path, unit, lessons) {
        var icon = pickUnitIcon(unit);
        var cards = lessons.map(function (l) {
          return renderLessonCard(
            { gradeId: path.gradeId, termId: path.termId, subjectId: path.subjectId, unitId: unit.id },
            l
          );
        }).join('');
        return '<section>' +
          '<h2 class="flex items-center gap-2 mb-3" style="font-size: var(--font-size-md); font-weight: var(--font-weight-bold); color: var(--color-text-primary);">' +
            '<span>' + icon + '</span>' +
            '<span>' + Pinyin.renderWithPinyin(unit.name + ' · ' + unit.title, path.gradeId) + '</span>' +
          '</h2>' +
          '<div class="grid grid-cols-2 gap-3">' + cards + '</div>' +
        '</section>';
      }

      function renderMessage(msg) {
        return '<div class="text-center py-8" style="color: var(--color-text-hint); font-size: var(--font-size-sm);">' + escapeHtml(msg) + '</div>';
      }

      function find(list, id) {
        for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
        return null;
      }

      function renderProgressSummary(completed, total) {
        var el = document.getElementById('progress-summary');
        if (!el) return;
        if (!total) { el.style.display = 'none'; return; }
        var pct = Math.round(completed / total * 100);
        el.style.display = '';
        el.innerHTML =
          '<div class="flex items-center justify-between mb-1.5">' +
            '<span style="font-size: var(--font-size-sm); color: var(--color-text-secondary); font-weight: var(--font-weight-medium);">学习进度</span>' +
            '<span style="font-size: var(--font-size-sm); color: var(--color-primary); font-weight: var(--font-weight-bold);">' +
              completed + '/' + total + ' 课 · ' + pct + '%' +
            '</span>' +
          '</div>' +
          '<div class="w-full rounded-full overflow-hidden" style="height: 6px; background: var(--color-divider);">' +
            '<div style="height: 100%; width: ' + pct + '%; background: var(--color-primary); border-radius: 999px; transition: width 0.4s ease;"></div>' +
          '</div>';
      }

      function renderCheckinCard() {
        var el = document.getElementById('checkin-card');
        if (!el) return;
        var s = Checkin.getStatus();
        // 主色调：已打卡用金色，未打卡用灰
        var done = s.checkedInToday;
        var bg = done ? 'linear-gradient(135deg, #FFF8E1 0%, #FFECB3 100%)' : 'var(--color-surface)';
        var border = done ? 'rgba(255,213,79,0.4)' : 'var(--color-border)';
        var streakColor = done ? '#E07030' : 'var(--color-text-hint)';
        var title = done ? '今日已打卡' : '今日还未打卡';
        var sub = done
          ? '已连续 ' + s.streak + ' 天，累计 ' + s.totalDays + ' 天 👍'
          : '完成一节课即可自动打卡';
        var icon = done ? '🔥' : '📅';

        el.innerHTML =
          '<div class="rounded-xl p-4 flex items-center gap-3" style="background: ' + bg + '; border: 1px solid ' + border + '; box-shadow: var(--shadow-card);">' +
            '<div style="font-size: 28px; flex-shrink: 0;">' + icon + '</div>' +
            '<div class="flex-1 min-w-0">' +
              '<div class="flex items-baseline gap-2">' +
                '<span style="font-size: var(--font-size-md); font-weight: var(--font-weight-bold); color: ' + streakColor + ';">' + s.streak + '</span>' +
                '<span style="font-size: var(--font-size-sm); color: var(--color-text-secondary);">天连续</span>' +
                '<span style="font-size: var(--font-size-xs); color: var(--color-text-hint); margin-left: auto;">' + title + '</span>' +
              '</div>' +
              '<div style="font-size: var(--font-size-xs); color: var(--color-text-secondary); margin-top: 2px;">' + sub + '</div>' +
            '</div>' +
          '</div>';
      }

      function init() {
        var labelEl = document.getElementById('grade-term-label');
        var listEl = document.getElementById('course-list');
        // 从 URL 读参数（由 index.html 选择页传入），未带则降级到默认值
        var gradeId = getQueryParam('grade') || DEFAULT_GRADE_ID;
        var termId = getQueryParam('term') || DEFAULT_TERM_ID;
        var subjectId = getQueryParam('subject') || DEFAULT_SUBJECT_ID;

        // 0) 打卡卡（同步渲染，localStorage 立即出结果）
        renderCheckinCard();

        // 1) 顶部"年级·学期·学科"标签（同时把 href 指向 index.html 便于切换）
        CourseData.getGrades().then(function (grades) {
          var g = find(grades, gradeId) || grades[0];
          if (g) gradeId = g.id;
          return CourseData.getTerms(gradeId).then(function (terms) {
            var t = find(terms, termId) || terms[0];
            if (t) termId = t.id;
            return CourseData.getSubjects(gradeId, termId).then(function (subjects) {
              var s = find(subjects, subjectId) || subjects[0];
              if (s) subjectId = s.id;
              if (g && t && s && labelEl) {
                labelEl.innerHTML = '<span>' + g.name + ' · ' + t.name + ' · ' + s.name + '</span>' +
                  '<i data-lucide="chevron-down" class="h-3.5 w-3.5"></i>';
                lucide.createIcons();
              }
            });
          });
        }).catch(function () {
          if (labelEl) labelEl.textContent = '课程加载失败';
        });

        // 2) 单元 + 课程列表
        var path = { gradeId: gradeId, termId: termId, subjectId: subjectId };
        CourseData.getUnits(gradeId, termId, subjectId).then(function (units) {
          if (!units.length) {
            listEl.innerHTML = renderMessage('该年级/学期/学科暂无课程数据');
            return;
          }
          // 按顺序串行加载每个单元的课程，保证渲染顺序与 JSON 一致
          var chain = Promise.resolve();
          var sections = new Array(units.length);
          var totalLessons = 0, completedLessons = 0;
          units.forEach(function (unit, i) {
            chain = chain.then(function () {
              return CourseData.getLessons(gradeId, termId, subjectId, unit.id);
            }).then(function (lessons) {
              totalLessons += lessons.length;
              lessons.forEach(function (l) {
                if (getLessonProgress(
                  { gradeId: gradeId, termId: termId, subjectId: subjectId, unitId: unit.id },
                  l
                ) === 'completed') completedLessons++;
              });
              sections[i] = renderUnit(path, unit, lessons);
            });
          });
          return chain.then(function () {
            listEl.innerHTML = sections.join('');
            renderProgressSummary(completedLessons, totalLessons);
          });
        }).catch(function (err) {
          var msg = (err && err.message ? err.message : '未知错误');
          listEl.innerHTML = renderMessage('课程加载失败：' + msg + '（本地直接打开 HTML 会被浏览器 CORS 拦截，请用 http 服务预览）');
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
    </script>
    <script>lucide.createIcons();</script>
</body>
</html>
