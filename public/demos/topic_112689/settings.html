<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置</title>
    <style id="theme-vars">
/* 伴学小程序 — Brand CSS */
/* Primary: warm orange | Secondary: sky blue | White background | Child-friendly */

:root {
  /* Brand Colors */
  --color-primary: #FF8C42;
  --color-primary-light: #FFB87A;
  --color-primary-lighter: #FFF0E0;
  --color-primary-dark: #E07030;

  --color-secondary: #5BB8F5;
  --color-secondary-light: #A0D8FF;
  --color-secondary-lighter: #E8F4FF;
  --color-secondary-dark: #3A9AE0;

  --color-background: #FFFFFF;
  --color-surface: #FFF9F2;
  --color-surface-elevated: #FFFFFF;

  --color-text-primary: #2D2D2D;
  --color-text-secondary: #6B6B6B;
  --color-text-hint: #A0A0A0;

  --color-border: #F0E8E0;
  --color-divider: #F5F0EB;

  /* State Colors */
  --state-success: #4CAF50;
  --state-warning: #FFC107;
  --state-error: #FF5252;
  --state-info: #5BB8F5;

  /* Star / progress gold */
  --color-star: #FFD54F;
  --color-star-light: #FFF8E1;
  --color-progress-dot-active: #FF8C42;
  --color-progress-dot-inactive: #E0D8D0;

  /* Typography */
  --font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif;
  --font-family-display: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif;

  --font-size-xs: 10px;
  --font-size-sm: 12px;
  --font-size-base: 14px;
  --font-size-md: 16px;
  --font-size-lg: 20px;
  --font-size-xl: 24px;
  --font-size-2xl: 28px;
  --font-size-3xl: 32px;

  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-bold: 700;

  --line-height-tight: 1.25;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.75;

  /* Spacing */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-base: 16px;
  --space-lg: 20px;
  --space-xl: 24px;
  --space-2xl: 32px;
  --space-3xl: 40px;

  /* Radius — child-friendly, rounded */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* Shadows */
  --shadow-card: 0 2px 8px rgba(255, 140, 66, 0.08);
  --shadow-elevated: 0 4px 16px rgba(255, 140, 66, 0.12);
  --shadow-float: 0 8px 32px rgba(0, 0, 0, 0.12);
}

/* Typography Classes */
.text-xs { font-size: var(--font-size-xs); line-height: var(--line-height-normal); }
.text-sm { font-size: var(--font-size-sm); line-height: var(--line-height-normal); }
.text-base { font-size: var(--font-size-base); line-height: var(--line-height-normal); }
.text-md { font-size: var(--font-size-md); line-height: var(--line-height-normal); font-weight: var(--font-weight-medium); }
.text-lg { font-size: var(--font-size-lg); line-height: var(--line-height-tight); font-weight: var(--font-weight-bold); }
.text-xl { font-size: var(--font-size-xl); line-height: var(--line-height-tight); font-weight: var(--font-weight-bold); }
.text-2xl { font-size: var(--font-size-2xl); line-height: var(--line-height-tight); font-weight: var(--font-weight-bold); }
.text-3xl { font-size: var(--font-size-3xl); line-height: var(--line-height-tight); font-weight: var(--font-weight-bold); }

.text-primary { color: var(--color-text-primary); }
.text-secondary { color: var(--color-text-secondary); }
.text-hint { color: var(--color-text-hint); }
.text-brand { color: var(--color-primary); }
.text-brand-secondary { color: var(--color-secondary); }

.font-regular { font-weight: var(--font-weight-regular); }
.font-medium { font-weight: var(--font-weight-medium); }
.font-bold { font-weight: var(--font-weight-bold); }

/* Utility Classes */
.bg-primary { background-color: var(--color-primary); }
.bg-primary-light { background-color: var(--color-primary-lighter); }
.bg-secondary { background-color: var(--color-secondary); }
.bg-secondary-light { background-color: var(--color-secondary-lighter); }
.bg-surface { background-color: var(--color-surface); }
.bg-background { background-color: var(--color-background); }

.rounded-sm { border-radius: var(--radius-sm); }
.rounded-md { border-radius: var(--radius-md); }
.rounded-lg { border-radius: var(--radius-lg); }
.rounded-xl { border-radius: var(--radius-xl); }
.rounded-full { border-radius: var(--radius-full); }

.shadow-card { box-shadow: var(--shadow-card); }
.shadow-elevated { box-shadow: var(--shadow-elevated); }
.shadow-float { box-shadow: var(--shadow-float); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--color-background);
    --color-primary: var(--color-primary);
    --color-secondary: var(--color-secondary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="font-family: var(--font-family);">
    <main>
        <!-- Status bar spacer -->
        <div class="h-11" style="background-color: var(--color-background);"></div>

        <!-- WeChat Mini Program Navigation Bar -->
        <header class="sticky top-0 z-30" style="background-color: var(--color-background);">
            <div class="flex h-11 items-center px-4">
                <!-- Left: back button -->
                <div class="flex w-[88px] items-center justify-start">
                    <button data-dom-id="back-to-home" class="inline-flex h-8 w-8 items-center justify-center rounded-lg" style="border: 1px solid var(--color-border); background-color: var(--color-background);" aria-label="返回">
                        <i data-lucide="chevron-left" class="h-4 w-4" style="color: var(--color-text-primary);"></i>
                    </button>
                </div>
                <!-- Center: title -->
                <div class="min-w-0 flex-1 text-center text-md" style="font-size: 16px; font-weight: 700; color: var(--color-primary); letter-spacing: -0.02em;">设置</div>
                <!-- Right: system capsule -->
                <div class="flex h-8 w-[88px] items-center justify-center rounded-full" style="border: 1px solid var(--color-border); background-color: rgba(255,255,255,0.9);" aria-label="小程序菜单">
                    <button class="flex h-full flex-1 items-center justify-center" aria-label="更多">
                        <i data-lucide="more-horizontal" class="h-4 w-4" style="color: var(--color-text-secondary);"></i>
                    </button>
                    <span class="h-4 w-px" style="background-color: var(--color-border);" aria-hidden="true"></span>
                    <button class="flex h-full flex-1 items-center justify-center" aria-label="关闭">
                        <i data-lucide="x" class="h-4 w-4" style="color: var(--color-text-secondary);"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Page Content -->
        <div class="px-4 pt-2 pb-8" style="background-color: var(--color-surface); min-height: calc(100vh - 88px);">

            <!-- Section 1: 学习年级 -->
            <section class="mb-4">
                <div class="flex items-center gap-2 mb-3">
                    <div class="inline-flex h-6 w-6 items-center justify-center" style="background-color: var(--color-primary-lighter);">
                        <i data-lucide="graduation-cap" class="h-3.5 w-3.5" style="color: var(--color-primary);"></i>
                    </div>
                    <h2 class="text-base font-bold truncate" style="font-size: 16px; font-weight: 700; color: var(--color-text-primary);">学习年级</h2>
                </div>
                <div class="overflow-hidden" style="border-radius: var(--radius-md); box-shadow: var(--shadow-card); background-color: var(--color-background);">
                    <!-- Active option -->
                    <div class="flex items-center px-4 py-3" style="background-color: var(--color-primary-lighter); border-left: 3px solid var(--color-primary);">
                        <span class="flex-1 truncate" style="font-size: 15px; font-weight: 600; color: var(--color-primary);">一年级 · 上册</span>
                        <div class="inline-flex h-5 w-5 items-center justify-center rounded-full shrink-0" style="background-color: var(--color-primary);">
                            <i data-lucide="check" class="h-3 w-3" style="color: #FFFFFF;"></i>
                        </div>
                    </div>
                    <!-- Inactive option 1 -->
                    <div class="flex items-center px-4 py-3" style="border-top: 1px solid var(--color-divider);">
                        <span class="flex-1 truncate" style="font-size: 15px; font-weight: 400; color: var(--color-text-hint);">一年级 · 下册</span>
                        <i data-lucide="lock" class="h-4 w-4 shrink-0" style="color: var(--color-progress-dot-inactive);"></i>
                    </div>
                    <!-- Inactive option 2 -->
                    <div class="flex items-center px-4 py-3" style="border-top: 1px solid var(--color-divider);">
                        <span class="flex-1 truncate" style="font-size: 15px; font-weight: 400; color: var(--color-text-hint);">二年级 · 上册</span>
                        <i data-lucide="lock" class="h-4 w-4 shrink-0" style="color: var(--color-progress-dot-inactive);"></i>
                    </div>
                </div>
            </section>

            <!-- Section 2: 学习报告 -->
            <section class="mb-4">
                <div class="flex items-center gap-2 mb-3">
                    <div class="inline-flex h-6 w-6 items-center justify-center" style="background-color: var(--color-primary-lighter);">
                        <i data-lucide="bar-chart-3" class="h-3.5 w-3.5" style="color: var(--color-primary);"></i>
                    </div>
                    <h2 class="text-base font-bold truncate" style="font-size: 16px; font-weight: 700; color: var(--color-text-primary);">学习报告</h2>
                </div>

                <!-- 3 Metric Cards -->
                <div class="flex gap-3 mb-4">
                    <!-- Metric 1: 已学课程 -->
                    <div class="flex-1 flex flex-col items-center py-4" style="background-color: var(--color-background); border-radius: var(--radius-md); box-shadow: var(--shadow-card);">
                        <div class="inline-flex h-7 w-7 items-center justify-center mb-2" style="background-color: var(--color-primary-lighter);">
                            <i data-lucide="book-open" class="h-4 w-4" style="color: var(--color-primary);"></i>
                        </div>
                        <span class="font-bold whitespace-nowrap" style="font-size: 28px; font-weight: 700; color: var(--color-primary); line-height: 1.25;">7</span>
                        <span class="mt-1 whitespace-nowrap" style="font-size: 12px; color: var(--color-text-secondary);">已学课程</span>
                    </div>
                    <!-- Metric 2: 今日学习 -->
                    <div class="flex-1 flex flex-col items-center py-4" style="background-color: var(--color-background); border-radius: var(--radius-md); box-shadow: var(--shadow-card);">
                        <div class="inline-flex h-7 w-7 items-center justify-center mb-2" style="background-color: var(--color-primary-lighter);">
                            <i data-lucide="clock" class="h-4 w-4" style="color: var(--color-primary);"></i>
                        </div>
                        <div class="flex items-baseline whitespace-nowrap">
                            <span class="font-bold" style="font-size: 28px; font-weight: 700; color: var(--color-primary); line-height: 1.25;">15</span>
                            <span class="ml-0.5" style="font-size: 12px; color: var(--color-text-secondary);">分钟</span>
                        </div>
                        <span class="mt-1 whitespace-nowrap" style="font-size: 12px; color: var(--color-text-secondary);">今日学习</span>
                    </div>
                    <!-- Metric 3: 点亮星星 -->
                    <div class="flex-1 flex flex-col items-center py-4" style="background-color: var(--color-background); border-radius: var(--radius-md); box-shadow: var(--shadow-card);">
                        <div class="inline-flex h-7 w-7 items-center justify-center mb-2" style="background-color: var(--color-star-light);">
                            <i data-lucide="star" class="h-4 w-4" style="color: var(--color-star); fill: var(--color-star);"></i>
                        </div>
                        <span class="font-bold whitespace-nowrap" style="font-size: 28px; font-weight: 700; color: var(--color-star); line-height: 1.25;">6</span>
                        <span class="mt-1 whitespace-nowrap" style="font-size: 12px; color: var(--color-text-secondary);">点亮星星</span>
                    </div>
                </div>

                <!-- Weekly Bar Chart -->
                <div class="overflow-hidden" style="background-color: var(--color-background); border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: 16px;">
                    <div class="flex items-end justify-between" style="height: 100px;">
                        <!-- Monday - tall -->
                        <div class="flex-1 flex flex-col items-center justify-end h-full">
                            <div class="w-full" style="max-width: 28px; height: 70%; border-radius: 4px 4px 0 0; background: linear-gradient(180deg, var(--color-primary) 0%, var(--color-primary-light) 100%);"></div>
                        </div>
                        <!-- Tuesday - medium -->
                        <div class="flex-1 flex flex-col items-center justify-end h-full">
                            <div class="w-full" style="max-width: 28px; height: 50%; border-radius: 4px 4px 0 0; background: linear-gradient(180deg, var(--color-primary) 0%, var(--color-primary-light) 100%);"></div>
                        </div>
                        <!-- Wednesday - tall -->
                        <div class="flex-1 flex flex-col items-center justify-end h-full">
                            <div class="w-full" style="max-width: 28px; height: 85%; border-radius: 4px 4px 0 0; background: linear-gradient(180deg, var(--color-primary) 0%, var(--color-primary-light) 100%);"></div>
                        </div>
                        <!-- Thursday - medium -->
                        <div class="flex-1 flex flex-col items-center justify-end h-full">
                            <div class="w-full" style="max-width: 28px; height: 60%; border-radius: 4px 4px 0 0; background: linear-gradient(180deg, var(--color-primary) 0%, var(--color-primary-light) 100%);"></div>
                        </div>
                        <!-- Friday - short-medium -->
                        <div class="flex-1 flex flex-col items-center justify-end h-full">
                            <div class="w-full" style="max-width: 28px; height: 40%; border-radius: 4px 4px 0 0; background: linear-gradient(180deg, var(--color-primary) 0%, var(--color-primary-light) 100%);"></div>
                        </div>
                        <!-- Saturday - very short -->
                        <div class="flex-1 flex flex-col items-center justify-end h-full">
                            <div class="w-full" style="max-width: 28px; height: 15%; border-radius: 4px 4px 0 0; background: linear-gradient(180deg, var(--color-primary) 0%, var(--color-primary-light) 100%); opacity: 0.5;"></div>
                        </div>
                        <!-- Sunday - very short -->
                        <div class="flex-1 flex flex-col items-center justify-end h-full">
                            <div class="w-full" style="max-width: 28px; height: 10%; border-radius: 4px 4px 0 0; background: linear-gradient(180deg, var(--color-primary) 0%, var(--color-primary-light) 100%); opacity: 0.5;"></div>
                        </div>
                    </div>
                    <!-- Day labels -->
                    <div class="flex justify-between mt-2">
                        <span class="flex-1 text-center whitespace-nowrap" style="font-size: 10px; color: var(--color-text-hint);">一</span>
                        <span class="flex-1 text-center whitespace-nowrap" style="font-size: 10px; color: var(--color-text-hint);">二</span>
                        <span class="flex-1 text-center whitespace-nowrap" style="font-size: 10px; color: var(--color-text-hint);">三</span>
                        <span class="flex-1 text-center whitespace-nowrap" style="font-size: 10px; color: var(--color-text-hint);">四</span>
                        <span class="flex-1 text-center whitespace-nowrap" style="font-size: 10px; color: var(--color-text-hint);">五</span>
                        <span class="flex-1 text-center whitespace-nowrap" style="font-size: 10px; color: var(--color-text-hint);">六</span>
                        <span class="flex-1 text-center whitespace-nowrap" style="font-size: 10px; color: var(--color-text-hint);">日</span>
                    </div>
                </div>
            </section>

            <!-- Section 3: 成就徽章墙 -->
            <section class="mb-4">
                <div class="flex items-center gap-2 mb-3">
                    <div class="inline-flex h-6 w-6 items-center justify-center" style="background-color: var(--color-primary-lighter);">
                        <i data-lucide="award" class="h-3.5 w-3.5" style="color: var(--color-primary);"></i>
                    </div>
                    <h2 class="text-base font-bold truncate" style="font-size: 16px; font-weight: 700; color: var(--color-text-primary);">我的徽章</h2>
                    <span id="badge-count" class="ml-auto" style="font-size: 12px; color: var(--color-text-hint);">0/8</span>
                </div>
                <div id="badges-grid" class="grid grid-cols-4 gap-2">
                    <div class="col-span-4 text-center py-6" style="color: var(--color-text-hint); font-size: 12px;">加载中…</div>
                </div>
            </section>

            <!-- Footer: 反馈与建议 -->
            <div class="flex items-center justify-center pt-4 pb-2">
                <button class="inline-flex items-center gap-1 whitespace-nowrap" style="font-size: 12px; color: var(--color-text-hint);" aria-label="反馈与建议">
                    <span>反馈与建议</span>
                    <i data-lucide="chevron-right" class="h-3.5 w-3.5" style="color: var(--color-text-hint);"></i>
                </button>
            </div>
        </div>
    </main>
    <script>lucide.createIcons();</script>

    <!-- 业务模块：数据/进度/打卡/徽章 -->
    <script>window.COURSE_DATA_BASE_PATH = '../';</script>
    <script src="../js/course-data.js"></script>
    <script src="../js/progress.js"></script>
    <script src="../js/checkin.js"></script>
    <script src="../js/achievements.js"></script>
    <script>
    (function () {
      'use strict';
      // 把"学习报告"那 3 张卡的数字也改成动态读取，避免和真实进度脱节
      function renderStats(ctx) {
        var nums = document.querySelectorAll('section .flex-1 > .font-bold');
        // 这3个数字按顺序：已学课程 / 今日学习分钟(保留 mockup) / 点亮星星
        if (nums[0]) nums[0].textContent = ctx.completedLessons;
        if (nums[2]) nums[2].textContent = ctx.completedPoems;
      }

      function renderBadges(all) {
        var grid = document.getElementById('badges-grid');
        var cnt = document.getElementById('badge-count');
        var unlocked = 0;
        var html = '';
        all.forEach(function (b) {
          var got = !!b.unlockedAt;
          if (got) unlocked++;
          html +=
            '<div class="flex flex-col items-center text-center" style="opacity:' + (got ? 1 : 0.35) + ';">' +
              '<div style="width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:24px; ' +
                'background:' + (got ? 'linear-gradient(135deg,#FFF8E1,#FFECB3)' : 'var(--color-surface)') +
                '; border:2px solid ' + (got ? '#FFD54F' : 'var(--color-border)') +
                '; box-shadow:' + (got ? '0 4px 12px rgba(255,213,79,0.3)' : 'none') + ';">' +
                b.icon +
              '</div>' +
              '<div style="font-size:11px; color:var(--color-text-primary); margin-top:4px; font-weight:' + (got ? 600 : 400) + ';">' + b.name + '</div>' +
              '<div style="font-size:9px; color:var(--color-text-hint); margin-top:1px; line-height:1.2;">' + b.desc + '</div>' +
            '</div>';
        });
        grid.innerHTML = html;
        cnt.textContent = unlocked + '/' + all.length;
      }

      function computeCtx() {
        var gradeId = 'g1', termId = 't1', subjectId = 'chinese';
        return CourseData.getUnits(gradeId, termId, subjectId).then(function (units) {
          var totalLessons = 0, completedLessons = 0;
          var completedUnits = 0;
          var totalPoems = 0, completedPoems = 0;
          var chain = Promise.resolve();
          units.forEach(function (unit) {
            chain = chain.then(function () {
              return CourseData.getLessons(gradeId, termId, subjectId, unit.id);
            }).then(function (lessons) {
              var unitDone = true;
              lessons.forEach(function (l) {
                totalLessons++;
                var state = Progress.get({gradeId:gradeId,termId:termId,subjectId:subjectId,unitId:unit.id,lessonId:l.id});
                if (state === 'completed') {
                  completedLessons++;
                  if (l.type === 'poem') completedPoems++;
                } else {
                  unitDone = false;
                }
                if (l.type === 'poem') totalPoems++;
              });
              if (unitDone && lessons.length > 0) completedUnits++;
            });
          });
          return chain.then(function () {
            var c = Checkin.getStatus();
            return {
              completedLessons: completedLessons,
              totalLessons: totalLessons,
              completedPoems: completedPoems,
              totalPoems: totalPoems,
              completedUnits: completedUnits,
              totalUnits: units.length,
              streak: c.streak,
              totalDays: c.totalDays
            };
          });
        });
      }

      function init() {
        computeCtx().then(function (ctx) {
          renderStats(ctx);
          var r = Achievements.refresh(ctx);
          renderBadges(r.all);
          if (window.lucide) lucide.createIcons();
        }).catch(function (e) {
          console.error('徽章渲染失败', e);
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
    </script>
</body>
</html>
