<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伴学 · 选择课程</title>
    <style id="theme-vars">
/* 伴学小程序 — Brand CSS */
/* Primary: warm orange | Secondary: sky blue | White background | Child-friendly */

:root {
  /* Brand Colors */
  --color-primary: #FF8C42;
  --color-primary-light: #FFB87A;
  --color-primary-lighter: #FFF0E0;
  --color-primary-dark: #E07030;

  --color-secondary: #5BB8F5;
  --color-secondary-light: #A0D8FF;
  --color-secondary-lighter: #E8F4FF;
  --color-secondary-dark: #3A9AE0;

  --color-background: #FFFFFF;
  --color-surface: #FFF9F2;
  --color-surface-elevated: #FFFFFF;

  --color-text-primary: #2D2D2D;
  --color-text-secondary: #6B6B6B;
  --color-text-hint: #A0A0A0;

  --color-border: #F0E8E0;
  --color-divider: #F5F0EB;

  /* State Colors */
  --state-success: #4CAF50;
  --state-warning: #FFC107;
  --state-error: #FF5252;
  --state-info: #5BB8F5;

  /* Star / progress gold */
  --color-star: #FFD54F;
  --color-star-light: #FFF8E1;
  --color-progress-dot-active: #FF8C42;
  --color-progress-dot-inactive: #E0D8D0;

  /* Typography */
  --font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif;
  --font-family-display: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif;

  --font-size-xs: 10px;
  --font-size-sm: 12px;
  --font-size-base: 14px;
  --font-size-md: 16px;
  --font-size-lg: 20px;
  --font-size-xl: 24px;
  --font-size-2xl: 28px;
  --font-size-3xl: 32px;

  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-bold: 700;

  --line-height-tight: 1.25;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.75;

  /* Spacing */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-base: 16px;
  --space-lg: 20px;
  --space-xl: 24px;
  --space-2xl: 32px;
  --space-3xl: 40px;

  /* Radius — child-friendly, rounded */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* Shadows */
  --shadow-card: 0 2px 8px rgba(255, 140, 66, 0.08);
  --shadow-elevated: 0 4px 16px rgba(255, 140, 66, 0.12);
  --shadow-float: 0 8px 32px rgba(0, 0, 0, 0.12);
}

/* Typography Classes */
.text-xs { font-size: var(--font-size-xs); line-height: var(--line-height-normal); }
.text-sm { font-size: var(--font-size-sm); line-height: var(--line-height-normal); }
.text-base { font-size: var(--font-size-base); line-height: var(--line-height-normal); }
.text-md { font-size: var(--font-size-md); line-height: var(--line-height-normal); font-weight: var(--font-weight-medium); }
.text-lg { font-size: var(--font-size-lg); line-height: var(--line-height-tight); font-weight: var(--font-weight-bold); }
.text-xl { font-size: var(--font-size-xl); line-height: var(--line-height-tight); font-weight: var(--font-weight-bold); }
.text-2xl { font-size: var(--font-size-2xl); line-height: var(--line-height-tight); font-weight: var(--font-weight-bold); }
.text-3xl { font-size: var(--font-size-3xl); line-height: var(--line-height-tight); font-weight: var(--font-weight-bold); }

.text-primary { color: var(--color-text-primary); }
.text-secondary { color: var(--color-text-secondary); }
.text-hint { color: var(--color-text-hint); }
.text-brand { color: var(--color-primary); }
.text-brand-secondary { color: var(--color-secondary); }

.font-regular { font-weight: var(--font-weight-regular); }
.font-medium { font-weight: var(--font-weight-medium); }
.font-bold { font-weight: var(--font-weight-bold); }

/* Utility Classes */
.bg-primary { background-color: var(--color-primary); }
.bg-primary-light { background-color: var(--color-primary-lighter); }
.bg-secondary { background-color: var(--color-secondary); }
.bg-secondary-light { background-color: var(--color-secondary-lighter); }
.bg-surface { background-color: var(--color-surface); }
.bg-background { background-color: var(--color-background); }

.rounded-sm { border-radius: var(--radius-sm); }
.rounded-md { border-radius: var(--radius-md); }
.rounded-lg { border-radius: var(--radius-lg); }
.rounded-xl { border-radius: var(--radius-xl); }
.rounded-full { border-radius: var(--radius-full); }

.shadow-card { box-shadow: var(--shadow-card); }
.shadow-elevated { box-shadow: var(--shadow-elevated); }
.shadow-float { box-shadow: var(--shadow-float); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--color-background);
    --color-primary: var(--color-primary);
    --color-secondary: var(--color-secondary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
  }
    </style>
    <style>
      /* 装饰云朵 / 星星 — 沿用 lesson.html 的视觉语言 */
      .deco-cloud, .deco-cloud-small, .deco-star, .deco-star-small {
          position: absolute;
          pointer-events: none;
      }
      .deco-cloud {
          width: 60px; height: 36px;
          background: radial-gradient(circle at 30% 60%, var(--color-primary-light) 0%, transparent 60%),
                      radial-gradient(circle at 65% 50%, var(--color-primary-light) 0%, transparent 65%),
                      radial-gradient(circle at 50% 70%, var(--color-primary-light) 0%, transparent 55%);
          border-radius: 50%;
          filter: blur(0.5px);
      }
      .deco-cloud-small {
          width: 42px; height: 26px;
          background: radial-gradient(circle at 35% 60%, var(--color-secondary-light) 0%, transparent 60%),
                      radial-gradient(circle at 65% 50%, var(--color-secondary-light) 0%, transparent 65%);
          border-radius: 50%;
          filter: blur(0.5px);
      }
      .deco-star {
          width: 18px; height: 18px;
          background: var(--color-star);
          clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      }
      .deco-star-small {
          width: 12px; height: 12px;
          background: var(--color-primary-light);
          clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      }

      /* 选择卡 — 三张并列的卡片，沿用 home 课程卡的圆角 + 阴影语言 */
      .select-card {
          background: var(--color-background);
          border-radius: var(--radius-xl);
          box-shadow: var(--shadow-card);
          padding: 16px;
          position: relative;
          overflow: hidden;
      }
      .select-card-header {
          display: flex;
          align-items: center;
          gap: 10px;
          margin-bottom: 14px;
      }
      .select-card-icon {
          width: 36px;
          height: 36px;
          border-radius: var(--radius-md);
          display: inline-flex;
          align-items: center;
          justify-content: center;
          flex-shrink: 0;
      }
      .select-card-title {
          font-size: var(--font-size-md);
          font-weight: var(--font-weight-bold);
          color: var(--color-text-primary);
          line-height: var(--line-height-tight);
      }
      .select-card-sub {
          font-size: var(--font-size-xs);
          color: var(--color-text-hint);
          margin-top: 2px;
      }

      /* 胶囊按钮 — 更圆润，选中态用主色渐变 */
      .capsule {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          padding: 9px 20px;
          border-radius: var(--radius-full);
          font-size: var(--font-size-base);
          font-weight: var(--font-weight-medium);
          background: var(--color-surface);
          color: var(--color-text-secondary);
          border: 1.5px solid var(--color-border);
          transition: all 0.2s ease;
          cursor: pointer;
          user-select: none;
          min-width: 76px;
          text-align: center;
          font-family: var(--font-family);
      }
      .capsule:active { transform: scale(0.95); }
      .capsule.is-selected {
          background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
          color: #FFFFFF;
          border-color: var(--color-primary);
          box-shadow: 0 4px 14px rgba(255, 140, 66, 0.32);
      }
      .capsule-row {
          display: flex;
          flex-wrap: wrap;
          gap: 10px;
      }
      .empty-hint {
          font-size: var(--font-size-sm);
          color: var(--color-text-hint);
          padding: 6px 2px;
      }

      /* 预览条 — 沿用 home 的进度条样式语言 */
      .preview-bar {
          background: linear-gradient(135deg, var(--color-primary-lighter) 0%, #FFFFFF 100%);
          border: 1px dashed var(--color-primary-light);
          border-radius: var(--radius-lg);
          padding: 14px 16px;
          text-align: center;
          font-size: var(--font-size-sm);
          color: var(--color-text-secondary);
      }

      /* 底部 CTA — 沿用 lesson.html 的固定大按钮 */
      .start-btn {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
          width: 100%;
          height: 54px;
          border-radius: var(--radius-full);
          font-size: var(--font-size-md);
          font-weight: var(--font-weight-bold);
          background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
          color: #FFFFFF;
          box-shadow: 0 6px 20px rgba(255, 140, 66, 0.4);
          transition: all 0.2s ease;
          border: none;
          cursor: pointer;
          font-family: var(--font-family);
      }
      .start-btn:active { transform: scale(0.98); }
      .start-btn.is-disabled {
          background: var(--color-divider);
          color: var(--color-text-hint);
          box-shadow: none;
          cursor: not-allowed;
      }

      /* 入场动画 */
      @keyframes fadeUp {
          from { opacity: 0; transform: translateY(8px); }
          to { opacity: 1; transform: translateY(0); }
      }
      .fade-up { animation: fadeUp 0.4s ease both; }
      .fade-up-2 { animation: fadeUp 0.4s ease 0.08s both; }
      .fade-up-3 { animation: fadeUp 0.4s ease 0.16s both; }

      /* 拼音注音样式：自定义 annotated 单元，拼音在上、汉字在下，严格居中对齐 */
      .annotated {
          display: inline-flex;
          flex-direction: column;
          align-items: center;
          justify-content: flex-start;
          margin: 0 4px;
            vertical-align: text-bottom;
      }
      .annotated .py {
          font-size: 12px;
          line-height: 1.2;
          color: var(--color-text-secondary);
          font-weight: 400;
          font-family: -apple-system, 'PingFang SC', sans-serif;
          padding-bottom: 2px;
          text-align: center;
          white-space: nowrap;
      }
      .annotated .hz {
          font-size: inherit;
          line-height: inherit;
          text-align: center;
      }
    </style>
</head>

    <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.24.2/dist/index.js"></script>

    <script src="../js/pinyin.js"></script>
    <script>
    (function () {
      'use strict';

      // 选择状态
      var state = {
        gradeId: null,
        termId: null,
        subjectId: null,
        grades: [],   // [{id,name}]
        terms: [],    // [{id,name}]
        subjects: []  // [{id,name}]
      };

      // 记忆键：用 localStorage 记住上次选择，下次进入直接回填
      var STORAGE_KEY = 'psa:last-selection';

      function loadLastSelection() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return null;
          return JSON.parse(raw);
        } catch (e) { return null; }
      }
      function saveLastSelection() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            gradeId: state.gradeId,
            termId: state.termId,
            subjectId: state.subjectId
          }));
        } catch (e) { /* ignore */ }
      }

      function $(id) { return document.getElementById(id); }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      // 渲染胶囊行。g1/g2 年级给标题加拼音注音
      function renderRow(containerId, items, selectedId, onPick, emptyHint, gradeIdForPinyin) {
        var el = $(containerId);
        if (!items || !items.length) {
          el.innerHTML = '<span class="empty-hint">' + escapeHtml(emptyHint || '暂无数据') + '</span>';
          return;
        }
        el.innerHTML = items.map(function (it) {
          var cls = 'capsule' + (it.id === selectedId ? ' is-selected' : '');
          var label = (typeof Pinyin !== 'undefined' && gradeIdForPinyin)
            ? Pinyin.renderWithPinyin(it.name, gradeIdForPinyin)
            : escapeHtml(it.name);
          return '<button type="button" class="' + cls + '" data-id="' + it.id + '">' + label + '</button>';
        }).join('');
        el.querySelectorAll('button.capsule').forEach(function (btn) {
          btn.addEventListener('click', function () {
            onPick(btn.getAttribute('data-id'));
          });
        });
      }

      function renderPreview() {
        var el = $('preview');
        var g = state.grades.filter(function (x) { return x.id === state.gradeId; })[0];
        var t = state.terms.filter(function (x) { return x.id === state.termId; })[0];
        var s = state.subjects.filter(function (x) { return x.id === state.subjectId; })[0];
        if (g && t && s) {
          el.innerHTML = '已选：<span style="color: var(--color-primary); font-weight: var(--font-weight-bold); font-size: var(--font-size-base);">' +
            escapeHtml(g.name) + ' · ' + escapeHtml(t.name) + ' · ' + escapeHtml(s.name) + '</span>';
        } else if (g && t) {
          el.innerHTML = '已选：<span style="color: var(--color-text-secondary);">' +
            escapeHtml(g.name) + ' · ' + escapeHtml(t.name) + '</span>，再选一个学科吧';
        } else if (g) {
          el.innerHTML = '已选：<span style="color: var(--color-text-secondary);">' + escapeHtml(g.name) + '</span>，再选一个学期吧';
        } else {
          el.textContent = '还没选好呢~';
        }
      }

      function updateStartBtn() {
        var btn = $('btn-start');
        var ready = state.gradeId && state.termId && state.subjectId;
        if (ready) {
          btn.classList.remove('is-disabled');
          btn.disabled = false;
        } else {
          btn.classList.add('is-disabled');
          btn.disabled = true;
        }
      }

      function pickGrade(id) {
        if (id === state.gradeId) return;
        state.gradeId = id;
        state.termId = null;
        state.subjectId = null;
        state.terms = [];
        state.subjects = [];
        renderRow('grade-row', state.grades, state.gradeId, pickGrade, '', id);
        renderRow('term-row', [], null, pickTerm, '加载中…');
        renderRow('subject-row', [], null, pickSubject, '请先选学期');
        renderPreview();
        updateStartBtn();
        saveLastSelection();
        // 加载学期
        CourseData.getTerms(id).then(function (terms) {
          state.terms = terms;
          // 自动选上册或第一个
          var first = terms.filter(function (t) { return t.id === 't1'; })[0] || terms[0];
          if (first) {
            state.termId = first.id;
            renderRow('term-row', state.terms, state.termId, pickTerm, '', id);
            renderPreview();
            loadSubjects();
          } else {
            renderRow('term-row', state.terms, null, pickTerm, '暂无学期', id);
          }
        }).catch(function () {
          renderRow('term-row', [], null, pickTerm, '学期加载失败');
        });
      }

      function pickTerm(id) {
        if (id === state.termId) return;
        state.termId = id;
        state.subjectId = null;
        state.subjects = [];
        renderRow('term-row', state.terms, state.termId, pickTerm, '', state.gradeId);
        renderRow('subject-row', [], null, pickSubject, '加载中…');
        renderPreview();
        updateStartBtn();
        saveLastSelection();
        loadSubjects();
      }

      function loadSubjects() {
        if (!state.gradeId || !state.termId) return;
        CourseData.getSubjects(state.gradeId, state.termId).then(function (subjects) {
          state.subjects = subjects;
          // 默认选语文（如果存在）
          var chinese = subjects.filter(function (s) { return s.id === 'chinese'; })[0];
          var first = chinese || subjects[0];
          if (first) {
            state.subjectId = first.id;
            renderRow('subject-row', state.subjects, state.subjectId, pickSubject, '', state.gradeId);
          } else {
            renderRow('subject-row', state.subjects, null, pickSubject, '暂无学科', state.gradeId);
          }
          renderPreview();
          updateStartBtn();
          saveLastSelection();
        }).catch(function () {
          renderRow('subject-row', [], null, pickSubject, '学科加载失败');
        });
      }

      function pickSubject(id) {
        state.subjectId = id;
        renderRow('subject-row', state.subjects, state.subjectId, pickSubject, '', state.gradeId);
        renderPreview();
        updateStartBtn();
        saveLastSelection();
      }

      function start() {
        if (!state.gradeId || !state.termId || !state.subjectId) return;
        var url = 'home.html?grade=' + encodeURIComponent(state.gradeId) +
                  '&term=' + encodeURIComponent(state.termId) +
                  '&subject=' + encodeURIComponent(state.subjectId);
        window.location.href = url;
      }

      function init() {
        // 渲染年级列表
        CourseData.getGrades().then(function (grades) {
          state.grades = grades;
          if (!grades.length) {
            renderRow('grade-row', [], null, pickGrade, '暂无年级数据');
            return;
          }
          // 优先回填上次选择，否则默认 g1
          var last = loadLastSelection();
          var initialGrade = (last && grades.some(function (g) { return g.id === last.gradeId; })) ? last.gradeId : (grades[0].id);
          renderRow('grade-row', state.grades, initialGrade, pickGrade);
          pickGrade(initialGrade);
        }).catch(function (err) {
          renderRow('grade-row', [], null, pickGrade, '年级加载失败');
          var el = $('grade-row');
          el.innerHTML += '<div style="font-size: var(--font-size-xs); color: var(--color-text-hint); width: 100%; margin-top: 8px;">提示：直接打开 HTML 会被浏览器 CORS 拦截，请用本地 http 服务预览。</div>';
        });

        $('btn-start').addEventListener('click', start);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
    </script>
    <script>lucide.createIcons();</script>
</body>
</html>
