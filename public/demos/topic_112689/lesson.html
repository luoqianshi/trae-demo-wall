<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程详情</title>
    <style id="theme-vars">
/* 伴学小程序 — Brand CSS */
/* Primary: warm orange | Secondary: sky blue | White background | Child-friendly */

:root {
  /* Brand Colors */
  --color-primary: #FF8C42;
  --color-primary-light: #FFB87A;
  --color-primary-lighter: #FFF0E0;
  --color-primary-dark: #E07030;

  --color-secondary: #5BB8F5;
  --color-secondary-light: #A0D8FF;
  --color-secondary-lighter: #E8F4FF;
  --color-secondary-dark: #3A9AE0;

  --color-background: #FFFFFF;
  --color-surface: #FFF9F2;
  --color-surface-elevated: #FFFFFF;

  --color-text-primary: #2D2D2D;
  --color-text-secondary: #6B6B6B;
  --color-text-hint: #A0A0A0;

  --color-border: #F0E8E0;
  --color-divider: #F5F0EB;

  /* State Colors */
  --state-success: #4CAF50;
  --state-warning: #FFC107;
  --state-error: #FF5252;
  --state-info: #5BB8F5;

  /* Star / progress gold */
  --color-star: #FFD54F;
  --color-star-light: #FFF8E1;
  --color-progress-dot-active: #FF8C42;
  --color-progress-dot-inactive: #E0D8D0;

  /* Typography */
  --font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif;
  --font-family-display: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif;

  --font-size-xs: 10px;
  --font-size-sm: 12px;
  --font-size-base: 14px;
  --font-size-md: 16px;
  --font-size-lg: 20px;
  --font-size-xl: 24px;
  --font-size-2xl: 28px;
  --font-size-3xl: 32px;

  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-bold: 700;

  --line-height-tight: 1.25;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.75;

  /* Spacing */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-base: 16px;
  --space-lg: 20px;
  --space-xl: 24px;
  --space-2xl: 32px;
  --space-3xl: 40px;

  /* Radius — child-friendly, rounded */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* Shadows */
  --shadow-card: 0 2px 8px rgba(255, 140, 66, 0.08);
  --shadow-elevated: 0 4px 16px rgba(255, 140, 66, 0.12);
  --shadow-float: 0 8px 32px rgba(0, 0, 0, 0.12);
}

/* Typography Classes */
.text-xs { font-size: var(--font-size-xs); line-height: var(--line-height-normal); }
.text-sm { font-size: var(--font-size-sm); line-height: var(--line-height-normal); }
.text-base { font-size: var(--font-size-base); line-height: var(--line-height-normal); }
.text-md { font-size: var(--font-size-md); line-height: var(--line-height-normal); font-weight: var(--font-weight-medium); }
.text-lg { font-size: var(--font-size-lg); line-height: var(--line-height-tight); font-weight: var(--font-weight-bold); }
.text-xl { font-size: var(--font-size-xl); line-height: var(--line-height-tight); font-weight: var(--font-weight-bold); }
.text-2xl { font-size: var(--font-size-2xl); line-height: var(--line-height-tight); font-weight: var(--font-weight-bold); }
.text-3xl { font-size: var(--font-size-3xl); line-height: var(--line-height-tight); font-weight: var(--font-weight-bold); }

.text-primary { color: var(--color-text-primary); }
.text-secondary { color: var(--color-text-secondary); }
.text-hint { color: var(--color-text-hint); }
.text-brand { color: var(--color-primary); }
.text-brand-secondary { color: var(--color-secondary); }

.font-regular { font-weight: var(--font-weight-regular); }
.font-medium { font-weight: var(--font-weight-medium); }
.font-bold { font-weight: var(--font-weight-bold); }

/* Utility Classes */
.bg-primary { background-color: var(--color-primary); }
.bg-primary-light { background-color: var(--color-primary-lighter); }
.bg-secondary { background-color: var(--color-secondary); }
.bg-secondary-light { background-color: var(--color-secondary-lighter); }
.bg-surface { background-color: var(--color-surface); }
.bg-background { background-color: var(--color-background); }

.rounded-sm { border-radius: var(--radius-sm); }
.rounded-md { border-radius: var(--radius-md); }
.rounded-lg { border-radius: var(--radius-lg); }
.rounded-xl { border-radius: var(--radius-xl); }
.rounded-full { border-radius: var(--radius-full); }

.shadow-card { box-shadow: var(--shadow-card); }
.shadow-elevated { box-shadow: var(--shadow-elevated); }
.shadow-float { box-shadow: var(--shadow-float); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--color-background);
    --color-primary: var(--color-primary);
    --color-secondary: var(--color-secondary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>
        <!-- Status bar spacer -->
        <div class="h-11"></div>

        <!-- WeChat Mini Program Navigation Bar -->
        <header class="sticky top-0 z-30 bg-white/95 backdrop-blur" style="border-bottom: 1px solid var(--color-border);">
            <div class="flex h-11 items-center px-4">
                <div class="flex w-[88px] items-center justify-start">
                    <button data-dom-id="back-to-home" class="inline-flex h-8 w-8 items-center justify-center" aria-label="返回">
                        <i data-lucide="chevron-left" style="width: 20px; height: 20px; color: var(--color-text-primary);"></i>
                    </button>
                </div>
                <div id="nav-title" class="min-w-0 flex-1 text-center" style="font-size: 16px; font-weight: var(--font-weight-bold); color: var(--color-primary); letter-spacing: -0.02em;">加载中…</div>
                <div class="flex h-8 w-[88px] items-center justify-center" style="border-radius: var(--radius-full); border: 1px solid var(--color-border); background: rgba(255,255,255,0.9);" aria-label="小程序菜单">
                    <button class="flex h-full flex-1 items-center justify-center" aria-label="更多">
                        <i data-lucide="more-horizontal" style="width: 16px; height: 16px; color: var(--color-text-primary);"></i>
                    </button>
                    <span class="h-4 w-px" style="background: var(--color-border);" aria-hidden="true"></span>
                    <button class="flex h-full flex-1 items-center justify-center" aria-label="关闭">
                        <i data-lucide="x" style="width: 16px; height: 16px; color: var(--color-text-primary);"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Lesson Title Area — 由 CourseData 填充 -->
        <section class="px-4 pt-4 pb-3">
            <div class="flex items-center gap-2.5">
                <span id="lesson-no-badge" class="inline-flex items-center justify-center px-2.5 py-0.5 whitespace-nowrap font-bold" style="background: var(--color-primary); color: #fff; border-radius: var(--radius-sm); font-size: var(--font-size-sm); letter-spacing: 0.02em;">第N课</span>
                <h1 id="lesson-title" class="font-bold" style="font-size: var(--font-size-2xl); color: var(--color-text-primary); line-height: var(--line-height-tight);">加载中…</h1>
            </div>
            <div class="mt-1.5 flex items-center gap-3">
                <span id="lesson-meta" style="font-size: var(--font-size-sm); color: var(--color-secondary);">—</span>
            </div>
        </section>

        <!-- Poem Block — 古诗课显示，普通课隐藏；诗名/朝代作者/正文统一在一个模块 -->
        <section id="poem-block" class="px-4 pb-8 hidden">
            <div class="poem-card rounded-xl p-4" style="background: var(--color-secondary-lighter); border: 1px solid var(--color-secondary-light);">
                <h2 id="poem-title" class="poem-title text-center font-bold mb-1">—</h2>
                <div id="poem-meta" class="poem-meta text-center mb-4">—</div>
                <div id="poem-lines" class="poem-lines">—</div>
            </div>
        </section>

        <!-- Video/Animation Player Area -->
        <section class="px-4 pb-4">
            <div id="player-container" class="video-player-container relative flex flex-col items-center justify-center overflow-hidden" style="border-radius: var(--radius-lg); background: linear-gradient(160deg, var(--color-primary-lighter) 0%, #fff 70%); min-height: 200px; box-shadow: var(--shadow-card);">
                <!-- Decorative cloud top-left -->
                <div class="absolute top-3 left-3 deco-cloud" style="opacity: 0.18;"></div>
                <!-- Decorative star top-right -->
                <div class="absolute top-4 right-5 deco-star" style="opacity: 0.15;"></div>
                <!-- Decorative cloud bottom-right -->
                <div class="absolute bottom-3 right-3 deco-cloud-small" style="opacity: 0.12;"></div>
                <!-- Decorative star bottom-left -->
                <div class="absolute bottom-4 left-5 deco-star-small" style="opacity: 0.13;"></div>

                <!-- 占位：呼吸光圈播放按钮（无视频源或未开始播放时显示） -->
                <div id="player-placeholder" class="flex flex-col items-center justify-center w-full" style="min-height: 200px;">
                    <div class="play-button-wrap relative flex items-center justify-center">
                        <div class="play-glow"></div>
                        <button id="btn-play" class="relative flex items-center justify-center play-btn" style="width: 64px; height: 64px; border-radius: var(--radius-full); background: var(--color-primary); box-shadow: 0 4px 20px rgba(255, 140, 66, 0.35);" aria-label="播放">
                            <i data-lucide="play" style="width: 28px; height: 28px; color: #fff; margin-left: 3px;"></i>
                        </button>
                    </div>
                    <span id="player-hint" class="mt-3 whitespace-nowrap" style="font-size: var(--font-size-sm); color: var(--color-text-hint);">点击播放</span>
                </div>

                <!-- 视频元素：默认隐藏，有 videoUrl 才显示 -->
                <video id="lesson-video" class="w-full block" style="display: none; max-height: 280px; object-fit: contain; background: #000;" playsinline preload="metadata"></video>

                <!-- 自定义控制条：播放/暂停 + 进度条 + 时长 -->
                <div id="player-controls" class="w-full flex items-center gap-2 px-3 py-2" style="display: none; background: rgba(0,0,0,0.04); border-top: 1px solid var(--color-border);">
                    <button id="btn-toggle" class="shrink-0 flex items-center justify-center" style="width: 32px; height: 32px; border-radius: var(--radius-full); background: var(--color-primary); color: #fff;" aria-label="播放/暂停">
                        <i id="btn-toggle-icon" data-lucide="pause" style="width: 16px; height: 16px;"></i>
                    </button>
                    <span id="time-current" class="shrink-0" style="font-size: var(--font-size-xs); color: var(--color-text-secondary); font-variant-numeric: tabular-nums; min-width: 32px;">0:00</span>
                    <div id="progress-track" class="flex-1 relative cursor-pointer" style="height: 4px; border-radius: 999px; background: var(--color-divider);">
                        <div id="progress-filled" style="position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: var(--color-primary); border-radius: 999px;"></div>
                    </div>
                    <span id="time-duration" class="shrink-0" style="font-size: var(--font-size-xs); color: var(--color-text-hint); font-variant-numeric: tabular-nums; min-width: 32px;">0:00</span>
                </div>
            </div>
        </section>

        <!-- Interactive Quiz Section — 题目由 CourseData 渲染 -->
        <section class="px-4 pb-6">
            <div class="flex items-center gap-2 mb-3">
                <span class="quiz-trophy" style="font-size: 20px; display: inline-block;">&#9733;</span>
                <h2 class="font-bold" style="font-size: var(--font-size-lg); color: var(--color-text-primary);">闯关时间</h2>
            </div>
            <div id="quiz-list">
                <div class="text-center py-6" style="color: var(--color-text-hint); font-size: var(--font-size-sm);">加载中…</div>
            </div>
        </section>

        <!-- Bottom spacing for fixed button -->
        <div class="h-20"></div>

        <!-- Bottom Action Area (fixed) -->
        <div class="fixed bottom-0 inset-x-0 z-30" style="padding-bottom: env(safe-area-inset-bottom, 20px); background: linear-gradient(to top, rgba(255,255,255,1) 70%, rgba(255,255,255,0));">
            <div class="px-4 pb-3">
                <a id="btn-next-lesson" data-dom-id="btn-next-lesson" href="#" class="flex w-full items-center justify-center gap-2 font-bold whitespace-nowrap" style="height: 52px; border-radius: var(--radius-lg); background: var(--color-primary); color: #fff; font-size: var(--font-size-lg); box-shadow: var(--shadow-elevated);">
                    下一课
                    <i data-lucide="chevron-right" style="width: 20px; height: 20px; color: #fff;"></i>
                </a>
            </div>
        </div>
    </main>

    <!-- Custom styles (placed before </body> per hard rules) -->
    <style>
        /* Progress dots */
        .progress-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: var(--radius-full);
            background: var(--color-progress-dot-inactive);
        }
        .progress-dot.active {
            background: var(--color-progress-dot-active);
        }
        .progress-dot.half {
            background: linear-gradient(to right, var(--color-progress-dot-active) 50%, var(--color-progress-dot-inactive) 50%);
        }

        /* Video player breathing glow on play button */
        @keyframes playBreathing {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.35); opacity: 0; }
        }
        .play-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 80px;
            height: 80px;
            margin-top: -40px;
            margin-left: -40px;
            border-radius: var(--radius-full);
            background: var(--color-primary);
            opacity: 0.5;
            animation: playBreathing 2.4s ease-in-out infinite;
            pointer-events: none;
        }

        /* Quiz trophy bounce */
        @keyframes trophyBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            30% { transform: translateY(-4px) scale(1.15); }
            60% { transform: translateY(1px) scale(0.95); }
        }
        .quiz-trophy {
            color: var(--color-star);
            animation: trophyBounce 2s ease-in-out infinite;
        }

        /* Decorative CSS clouds */
        .deco-cloud::before {
            content: '';
            display: block;
            width: 36px;
            height: 14px;
            border-radius: var(--radius-full);
            background: var(--color-primary-light);
        }
        .deco-cloud::after {
            content: '';
            position: absolute;
            top: -7px;
            left: 8px;
            width: 18px;
            height: 18px;
            border-radius: var(--radius-full);
            background: var(--color-primary-light);
        }
        .deco-cloud {
            position: relative;
        }
        .deco-cloud-small::before {
            content: '';
            display: block;
            width: 24px;
            height: 10px;
            border-radius: var(--radius-full);
            background: var(--color-secondary-light);
        }
        .deco-cloud-small::after {
            content: '';
            position: absolute;
            top: -5px;
            left: 6px;
            width: 12px;
            height: 12px;
            border-radius: var(--radius-full);
            background: var(--color-secondary-light);
        }
        .deco-cloud-small {
            position: relative;
        }

        /* Decorative CSS stars */
        .deco-star::before {
            content: '';
            display: block;
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 12px solid var(--color-star);
        }
        .deco-star::after {
            content: '';
            display: block;
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 12px solid var(--color-star);
            margin-top: -3px;
        }
        .deco-star-small::before {
            content: '';
            display: block;
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-bottom: 8px solid var(--color-star);
        }
        .deco-star-small::after {
            content: '';
            display: block;
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-top: 8px solid var(--color-star);
            margin-top: -2px;
        }

        /* Quiz option hover/active states */
        .quiz-option {
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: border-color 0.2s, background 0.2s;
        }
        .quiz-option.selected {
            border-color: var(--color-primary) !important;
            background: var(--color-primary-lighter) !important;
        }
        /* 作答反馈态：正确绿、错误红、正确答案标绿描边 */
        .quiz-option.correct {
            border-color: var(--state-success) !important;
            background: rgba(76, 175, 80, 0.10) !important;
            color: var(--state-success) !important;
        }
        .quiz-option.wrong {
            border-color: var(--state-error) !important;
            background: rgba(255, 82, 82, 0.10) !important;
            color: var(--state-error) !important;
        }
        .quiz-option.disabled {
            cursor: default;
            opacity: 0.6;
        }
        .quiz-option .opt-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px; height: 22px;
            border-radius: var(--radius-full);
            background: var(--color-divider);
            color: var(--color-text-secondary);
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-bold);
            margin-right: 10px;
            flex-shrink: 0;
        }
        .quiz-option.correct .opt-mark { background: var(--state-success); color: #fff; }
        .quiz-option.wrong .opt-mark { background: var(--state-error); color: #fff; }
        .quiz-feedback {
            margin-top: 10px;
            padding: 8px 12px;
            border-radius: var(--radius-md);
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-medium);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .quiz-feedback.ok { background: rgba(76,175,80,0.12); color: var(--state-success); }
        .quiz-feedback.no { background: rgba(255,82,82,0.12); color: var(--state-error); }

        /* Reduced motion preference */
        @media (prefers-reduced-motion: reduce) {
            .play-glow { animation: none; opacity: 0; }
            .quiz-trophy { animation: none; }
        }
        /* 拼音注音样式：自定义 annotated 单元，拼音在上、汉字在下，严格居中对齐 */
        .annotated {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            margin: 0 4px;
            vertical-align: text-bottom;
        }
        .annotated .py {
            font-size: 12px;
            line-height: 1.2;
            color: var(--color-text-secondary);
            font-weight: 400;
            font-family: -apple-system, 'PingFang SC', sans-serif;
            padding-bottom: 2px;
            text-align: center;
            white-space: nowrap;
        }
        .annotated .hz {
            font-size: inherit;
            line-height: inherit;
            text-align: center;
        }
        /* 古诗模块：诗名/朝代作者/正文统一卡片；每行诗句按固定字宽对齐 */
        .poem-card { text-align: center; }
        .poem-title {
            font-size: var(--font-size-xl);
            color: var(--color-text-primary);
        }
        .poem-meta {
            font-size: var(--font-size-sm);
            color: var(--color-secondary-dark);
        }
        .poem-lines {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .poem-line {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 4px;
        }
        .poem-char {
            width: 38px;
            text-align: center;
        }
        .poem-char .annotated { margin: 0; }
        .poem-char .annotated .py {
            font-size: 14px;
            color: var(--color-primary);
            padding-bottom: 4px;
        }
        .poem-char .annotated .hz {
            font-size: var(--font-size-md);
            color: var(--color-text-primary);
        }
        .poem-punct {
            width: 16px;
            text-align: center;
            padding-bottom: 4px;
            font-size: var(--font-size-md);
            color: var(--color-text-primary);
        }
    </style>
    <!-- 课程数据访问层 + 学习进度 + 每日打卡 + 成就徽章 + 拼音注音 + 视频播放器 -->

    <script>
    (function () {
      'use strict';

      var LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      // 计算徽章上下文 + 刷新解锁状态，返回新解锁的徽章列表
      function refreshAchievements() {
        var gradeId = 'g1', termId = 't1', subjectId = 'chinese';
        return CourseData.getUnits(gradeId, termId, subjectId).then(function (units) {
          var totalLessons = 0, completedLessons = 0;
          var completedUnits = 0, totalPoems = 0, completedPoems = 0;
          var chain = Promise.resolve();
          units.forEach(function (unit) {
            chain = chain.then(function () {
              return CourseData.getLessons(gradeId, termId, subjectId, unit.id);
            }).then(function (lessons) {
              var unitDone = true;
              lessons.forEach(function (l) {
                totalLessons++;
                var state = Progress.get({gradeId:gradeId,termId:termId,subjectId:subjectId,unitId:unit.id,lessonId:l.id});
                if (state === 'completed') {
                  completedLessons++;
                  if (l.type === 'poem') completedPoems++;
                } else unitDone = false;
                if (l.type === 'poem') totalPoems++;
              });
              if (unitDone && lessons.length > 0) completedUnits++;
            });
          });
          return chain.then(function () {
            var c = Checkin.getStatus();
            var ctx = {
              completedLessons: completedLessons, totalLessons: totalLessons,
              completedPoems: completedPoems, totalPoems: totalPoems,
              completedUnits: completedUnits, totalUnits: units.length,
              streak: c.streak, totalDays: c.totalDays
            };
            return Achievements.refresh(ctx).newlyUnlocked;
          });
        });
      }

      function getQueryParam(name) {
        var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
        return m ? decodeURIComponent(m[1]) : '';
      }

      function $(id) { return document.getElementById(id); }

      // ---------- 渲染：题目卡 ----------
      function renderQuizCard(path, lessonId, q, index) {
        var badgeColor = index % 2 === 0
          ? 'background: var(--color-primary); color: #fff;'
          : 'background: var(--color-secondary); color: #fff;';
        var optionsHtml = q.options.map(function (opt, i) {
          return '<button class="quiz-option" data-qid="' + escapeHtml(q.id) + '" data-idx="' + i + '" ' +
                 'style="min-height: 48px; border-radius: var(--radius-md); border: 2px solid var(--color-border); ' +
                 'background: var(--color-background); padding: 10px 16px; font-size: var(--font-size-md); ' +
                 'color: var(--color-text-primary); font-weight: var(--font-weight-medium);">' +
                 '<span class="opt-mark">' + LETTERS[i] + '</span>' +
                 '<span class="truncate">' + Pinyin.renderWithPinyin(opt, path.gradeId) + '</span>' +
                 '</button>';
        }).join('');
        return '<div class="quiz-card mb-3" style="background: var(--color-background); border-radius: var(--radius-lg); ' +
               'box-shadow: var(--shadow-card); padding: var(--space-base);">' +
          '<div class="flex items-center gap-2 mb-3">' +
            '<span class="inline-flex items-center justify-center font-bold whitespace-nowrap" ' +
            'style="width: 24px; height: 24px; border-radius: var(--radius-full); ' + badgeColor +
            ' font-size: var(--font-size-sm);">' + (index + 1) + '</span>' +
            '<p class="font-medium truncate" style="font-size: 15px; color: var(--color-text-primary);">' +
              Pinyin.renderWithPinyin(q.question, path.gradeId) + '</p>' +
          '</div>' +
          '<div class="flex flex-col gap-2">' + optionsHtml + '</div>' +
          '<div class="quiz-feedback-area"></div>' +
        '</div>';
      }

      // ---------- 交互：选项点击 → 校验答案 → 反馈 + 记录进度 ----------
      function bindQuizCards(path, lessonId, totalQuestions) {
        var answeredCount = 0;
        document.querySelectorAll('.quiz-option').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var card = btn.closest('.quiz-card');
            if (!card || card.dataset.answered === '1') return; // 同一题答过即锁
            var qid = btn.getAttribute('data-qid');
            var idx = parseInt(btn.getAttribute('data-idx'), 10);
            var allOpts = card.querySelectorAll('.quiz-option');
            allOpts.forEach(function (o) { o.classList.add('disabled'); });
            btn.classList.add('selected');

            CourseData.checkAnswer(
              { gradeId: path.gradeId, termId: path.termId, subjectId: path.subjectId, unitId: path.unitId, lessonId: lessonId },
              qid, idx
            ).then(function (r) {
              card.dataset.answered = '1';
              var feedbackArea = card.querySelector('.quiz-feedback-area');
              // 标注：选错的选项红、正确答案绿
              allOpts.forEach(function (o) {
                var i = parseInt(o.getAttribute('data-idx'), 10);
                if (i === r.answerIndex) o.classList.add('correct');
                if (i === idx && !r.correct) o.classList.add('wrong');
              });
              var msg = r.correct
                ? '<div class="quiz-feedback ok">答对了，真棒！</div>'
                : '<div class="quiz-feedback no">没关系，正确答案是 ' + LETTERS[r.answerIndex] + '，再读一遍～</div>';
              feedbackArea.innerHTML = msg;

              // 记录进度：答完所有题 → 自动升级为已完成
              answeredCount++;
              var newState = Progress.recordAnswer(path, totalQuestions);
              if (newState === Progress.STATE.COMPLETED && answeredCount === totalQuestions) {
                // 完成本课 → 自动打卡（同一天多次完成只算一次）
                var checkinResult = Checkin.checkIn();
                // 全部答完的庆祝提示
                setTimeout(function () {
                  var extra = checkinResult.justCheckedIn
                    ? ' ｜ 📅 今日打卡成功，已连续 ' + checkinResult.streak + ' 天！'
                    : '';
                  feedbackArea.insertAdjacentHTML('beforeend',
                    '<div class="quiz-feedback ok" style="margin-top: 8px; font-size: var(--font-size-base); font-weight: var(--font-weight-bold);">' +
                    '🎉 本课全部完成，星空为你点亮一颗星！' + extra +
                    '</div>'
                  );
                }, 200);

                // 异步刷新徽章，新解锁的弹提示
                refreshAchievements().then(function (newBadges) {
                  if (newBadges.length === 0) return;
                  setTimeout(function () {
                    var names = newBadges.map(function (b) { return b.icon + ' ' + b.name; }).join('、');
                    feedbackArea.insertAdjacentHTML('beforeend',
                      '<div class="quiz-feedback ok" style="margin-top: 8px; font-size: var(--font-size-base); font-weight: var(--font-weight-bold); color: var(--color-primary-dark);">' +
                      '🎖️ 解锁新徽章：' + names + '！' +
                      '</div>'
                    );
                  }, 600);
                });
              }
            });
          });
        });
      }

      function renderMessage(el, msg) {
        el.innerHTML = '<div class="text-center py-6" style="color: var(--color-text-hint); font-size: var(--font-size-sm);">' + escapeHtml(msg) + '</div>';
      }

      // ---------- 主流程 ----------
      function init() {
        var path = {
          gradeId: getQueryParam('grade') || 'g1',
          termId: getQueryParam('term') || 't1',
          subjectId: getQueryParam('subject') || 'chinese',
          unitId: getQueryParam('unit'),
          lessonId: getQueryParam('lesson')
        };

        // 参数缺失 → 直接提示
        if (!path.unitId || !path.lessonId) {
          $('nav-title').textContent = '课程未指定';
          $('lesson-title').textContent = '请从课程列表进入';
          renderMessage($('quiz-list'), '缺少课程参数，请返回首页选择课程');
          hideNextLessonBtn();
          return;
        }

        CourseData.getLessonDetail(path.gradeId, path.termId, path.subjectId, path.unitId, path.lessonId)
          .then(function (detail) {
            if (!detail) {
              $('nav-title').textContent = '未找到课程';
              $('lesson-title').textContent = '课程不存在';
              renderMessage($('quiz-list'), '该课程不存在，可能数据尚未录入');
              hideNextLessonBtn();
              return;
            }
            var lesson = detail.lesson;
            var fullTitle = '第' + lesson.no + '课 ' + lesson.title;
            var grade = path.gradeId || 'g1';

            // 进入课程页即标记"学习中"（已完成的课不降级）
            Progress.markInProgress(path);

            // 顶部 nav 标题 + 文档标题（nav 不注音，空间有限）
            $('nav-title').textContent = fullTitle;
            document.title = fullTitle;

            // 课标题区：课号徽章 + 标题（标题注音）
            $('lesson-no-badge').textContent = '第' + lesson.no + '课';
            $('lesson-title').innerHTML = Pinyin.renderWithPinyin(lesson.title, grade);
            $('lesson-meta').textContent = detail.grade.name + ' · ' + detail.term.name + ' · ' +
                                           detail.subject.name + ' ｜ ' + detail.unit.name + ' · ' + detail.unit.title;

            // 古诗课：显示诗文区（诗名/朝代作者/正文统一在一个卡片模块）
            if (lesson.type === 'poem' && lesson.poem) {
              $('poem-title').innerHTML = Pinyin.renderWithPinyin(lesson.title || '', grade);

              // 朝代作者也按固定字宽网格渲染，保证间隔号与汉字基线一致
              var metaText = '';
              if (lesson.dynasty) metaText += lesson.dynasty;
              if (lesson.dynasty && lesson.author) metaText += ' · ';
              if (lesson.author) metaText += lesson.author;
              if (metaText) {
                var metaHtml = '<div class="poem-line">';
                for (var mi = 0; mi < metaText.length; mi++) {
                  var mch = metaText.charAt(mi);
                  if (/[\u4e00-\u9fa5]/.test(mch)) {
                    metaHtml += '<div class="poem-char">' + Pinyin.renderWithPinyin(mch, grade) + '</div>';
                  } else {
                    metaHtml += '<div class="poem-punct" style="width: 22px;">' + escapeHtml(mch) + '</div>';
                  }
                }
                metaHtml += '</div>';
                $('poem-meta').innerHTML = metaHtml;
              } else {
                $('poem-meta').innerHTML = '';
              }

              // 拆分成句，每句渲染成固定字宽的行
              var rawLines = (lesson.poem || '').replace(/([，。？！])/g, '$1\n').replace(/\n+$/, '').split('\n');
              var linesHtml = '';
              for (var li = 0; li < rawLines.length; li++) {
                var line = rawLines[li];
                var punct = '';
                var m = line.match(/([，。？！]+)$/);
                if (m) {
                  punct = m[1];
                  line = line.slice(0, -punct.length);
                }
                linesHtml += '<div class="poem-line">';
                for (var ci = 0; ci < line.length; ci++) {
                  var ch = line.charAt(ci);
                  linesHtml += '<div class="poem-char">' + Pinyin.renderWithPinyin(ch, grade) + '</div>';
                }
                if (punct) {
                  linesHtml += '<div class="poem-punct">' + escapeHtml(punct) + '</div>';
                }
                linesHtml += '</div>';
              }
              $('poem-lines').innerHTML = linesHtml;
              $('poem-block').classList.remove('hidden');
            }

            // 题目区
            var quizList = $('quiz-list');
            var interactions = lesson.interactions || [];
            if (!interactions.length) {
              renderMessage(quizList, '本课暂无闯关题目');
            } else {
              quizList.innerHTML = interactions.map(function (q, i) {
                return renderQuizCard(path, lesson.id, q, i);
              }).join('');
              bindQuizCards(path, lesson.id, interactions.length);
            }

            // 视频播放器：视频结束时滚动到闯关题目区
            Player.init({
              videoUrl: lesson.videoUrl,
              onEnded: function () {
                var quizSection = quizList.closest('section');
                if (quizSection) {
                  quizSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
              }
            });

            // 下一课按钮
            applyNextLesson(detail.nextLesson);
          })
          .catch(function (err) {
            var msg = (err && err.message ? err.message : '未知错误');
            $('nav-title').textContent = '加载失败';
            $('lesson-title').textContent = '—';
            renderMessage($('quiz-list'), '课程加载失败：' + msg + '（本地直接打开 HTML 会被浏览器 CORS 拦截，请用 http 服务预览）');
            hideNextLessonBtn();
          });
      }

      function applyNextLesson(next) {
        var btn = $('btn-next-lesson');
        if (!next) {
          // 末课：按钮文案改为"完成本学期"，链接回首页
          btn.textContent = '';
          btn.appendChild(document.createTextNode('完成本期课程'));
          btn.setAttribute('href', 'home.html');
          return;
        }
        var href = 'lesson.html?grade=' + encodeURIComponent(next.gradeId) +
                   '&term=' + encodeURIComponent(next.termId) +
                   '&subject=' + encodeURIComponent(next.subjectId) +
                   '&unit=' + encodeURIComponent(next.unitId) +
                   '&lesson=' + encodeURIComponent(next.lessonId);
        btn.setAttribute('href', href);
        // 文案带上下一课标题
        btn.textContent = '';
        btn.appendChild(document.createTextNode('下一课：第' + next.no + '课 ' + next.title));
        var icon = document.createElement('i');
        icon.setAttribute('data-lucide', 'chevron-right');
        icon.style.cssText = 'width: 20px; height: 20px; color: #fff;';
        btn.appendChild(icon);
        if (window.lucide) lucide.createIcons();
      }

      function hideNextLessonBtn() {
        var btn = $('btn-next-lesson');
        if (btn) btn.style.display = 'none';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
    </script>
    <script>lucide.createIcons();</script>
</body>
</html>
