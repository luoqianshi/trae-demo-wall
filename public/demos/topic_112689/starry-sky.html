    <style id="theme-vars">
:root {
  --color-primary: #FF8C42;
  --color-primary-light: #FFB87A;
  --color-primary-lighter: #FFF0E0;
  --color-secondary: #5BB8F5;
  --color-secondary-light: #A0D8FF;
  --color-secondary-lighter: #E8F4FF;
  --color-background: #FFFFFF;
  --color-text-primary: #2D2D2D;

  --color-star: #FFD54F;

  --font-size-xs: 10px;

  --font-size-base: 14px;
  --font-size-md: 16px;
  --font-size-lg: 18px;
  --font-size-2xl: 24px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 20px;
}
    </style>

    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0;
        font-family: var(--font-family);
        background: #0D0D2B;
        color: #fff;
        overflow: hidden;
        height: 100%;
        -webkit-user-select: none;
        user-select: none;
      }
      #sky-container {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      #sky-container canvas { display: block; }
      .hint-overlay {
        position: absolute;
        z-index: 5;
        pointer-events: none;
        color: rgba(255,255,255,0.6);
        font-size: var(--font-size-sm);
      }
      /* 顶部统计卡 */
      .stats-card {
        position: absolute;
        top: calc(44px + 16px);
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        background: rgba(255,255,255,0.08);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: var(--radius-xl);
        padding: 14px 28px;
        text-align: center;
        box-shadow: 0 0 40px rgba(255,213,79,0.08);
      }
      .stats-num {
        font-size: 36px; font-weight: 700; color: var(--color-star);
        line-height: 1;
        text-shadow: 0 0 16px rgba(255,213,79,0.5);
      }
      .stats-label { font-size: 13px; color: rgba(255,255,255,0.7); margin-top: 4px; }

      /* 全诗弹窗 */
      .poem-modal {
        position: absolute;
        inset: 0;
        z-index: 20;
        background: rgba(0,0,0,0.7);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .poem-modal.show { display: flex; animation: fadeIn 0.25s ease; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      .poem-card {
        background: linear-gradient(160deg, #FFF8E1 0%, #FFFFFF 100%);
        border-radius: var(--radius-xl);
        padding: 28px 24px;
        max-width: 320px;
        width: 100%;
        box-shadow: 0 20px 60px rgba(255,213,79,0.3), 0 0 0 1px rgba(255,213,79,0.2);
        color: var(--color-text-primary);
        position: relative;
        animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      @keyframes popIn {
        from { transform: scale(0.85); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      .poem-close {
        position: absolute; top: 12px; right: 12px;
        width: 28px; height: 28px; border-radius: 50%;
        border: none; background: rgba(0,0,0,0.06);
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; color: var(--color-text-secondary);
      }
      .poem-title {
        text-align: center;
        font-size: var(--font-size-2xl);
        font-weight: 700;
        color: var(--color-text-primary);
        margin-bottom: 6px;
      }
      .poem-author {
        text-align: center;
        font-size: var(--font-size-sm);
        color: var(--color-text-secondary);
        margin-bottom: 20px;
      }
      .poem-text {
        font-size: var(--font-size-lg);
        line-height: 2;
        color: var(--color-text-primary);
        text-align: center;
        white-space: pre-line;
        font-weight: 500;
        letter-spacing: 0.05em;
      }
      .poem-actions {
        margin-top: 24px;
        display: flex;
        gap: 10px;
      }
      .poem-btn {
        flex: 1;
        height: 44px;
        border: none;
        border-radius: var(--radius-md);
        font-size: var(--font-size-base);
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .poem-btn-primary {
        background: var(--color-primary);
        color: #fff;
        box-shadow: 0 4px 12px rgba(255,140,66,0.3);
      }
      .poem-btn-secondary {
        background: var(--color-secondary-lighter);
        color: var(--color-secondary);
      }
      /* 右下角分享按钮 */
      .share-btn {
        position: absolute;
        z-index: 10;
        right: 16px;
        bottom: 70px;
        height: 36px;
        padding: 0 14px;
        border: 1px solid rgba(255,255,255,0.25);
        background: rgba(255,255,255,0.12);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 999px;
        color: #fff;
        font-size: 13px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
      }
      .share-btn:active { transform: scale(0.95); }
      /* 分享弹窗卡片 */
      .share-card {
        background: #fff;
        border-radius: var(--radius-xl);
        padding: 16px;
        max-width: 340px;
        width: 100%;
        position: relative;
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      /* 拼音注音样式（弹窗浅色背景）：自定义 annotated 单元，拼音在上、汉字在下，严格居中对齐 */
      .annotated {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        margin: 0 4px;
        vertical-align: text-bottom;
      }
      .annotated .py {
        font-size: 12px;
        line-height: 1.2;
        color: #6B6B6B;
        font-weight: 400;
        font-family: -apple-system, 'PingFang SC', sans-serif;
        padding-bottom: 2px;
        text-align: center;
        white-space: nowrap;
      }
      .annotated .hz {
        font-size: inherit;
        line-height: inherit;
        text-align: center;
      }
      /* 古诗诗文：字间距更宽，拼音更大更醒目；加大行高避免上下行拼音打架 */
      #poem-text {
        line-height: 2.2;
      }
      #poem-text .annotated { margin: 0 9px; }
      #poem-text .annotated .py { font-size: 14px; color: #E07030; }
    </style>

    <!-- 课程数据 + 进度 + 打卡 + 拼音注音 + 3D 星空引擎 -->
    <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.24.2/dist/index.js"></script>
    <script>window.COURSE_DATA_BASE_PATH = '../';</script>
    <script src="../js/course-data.js"></script>
    <script src="../js/progress.js"></script>
    <script src="../js/checkin.js"></script>
    <script src="../js/pinyin.js"></script>
    <script src="../js/starry-sky.js"></script>
    <script>
    (function () {
      'use strict';

      // 用 hash 给每首古诗固定一个方向向量（同首诗每次位置一致）
      // 简单 string hash → 球面坐标
      function hashToDirection(str) {
        var h1 = 0, h2 = 0;
        for (var i = 0; i < str.length; i++) {
          h1 = (h1 * 31 + str.charCodeAt(i)) | 0;
          h2 = (h2 * 37 + str.charCodeAt(i) * (i + 1)) | 0;
        }
        var theta = ((h1 & 0xffff) / 0xffff) * Math.PI * 2;
        var phi = (((h2 & 0xffff) / 0xffff) * Math.PI);
        return [
          Math.sin(phi) * Math.cos(theta),
          Math.sin(phi) * Math.sin(theta),
          Math.cos(phi)
        ];
      }

      // 当前选中的星，供"去复习"按钮用
      var currentStar = null;
      // 3D 引擎实例，供分享截图用
      var skyEngine = null;

      function openPoemModal(star) {
        currentStar = star;
        var grade = 'g1'; // 星空页当前固定一年级
        document.getElementById('poem-title').innerHTML = Pinyin.renderWithPinyin(star.title, grade);
        document.getElementById('poem-author').innerHTML = Pinyin.renderWithPinyin(
          (star.dynasty ? '【' + star.dynasty + '】' : '') + (star.author || ''), grade);
        document.getElementById('poem-text').innerHTML = Pinyin.renderWithPinyin(star.poem || '', grade, { multiline: true });
        document.getElementById('poem-modal').classList.add('show');
        if (window.lucide) lucide.createIcons();
      }

      function closePoemModal() {
        document.getElementById('poem-modal').classList.remove('show');
        currentStar = null;
      }

      // 朗读：优先用浏览器 Web Speech API（免费、无依赖）
      // 将来可换成 TTS API 或音频文件
      function recitePoem() {
        if (!currentStar) return;
        var text = (currentStar.title + '。' + (currentStar.author || '') + '。' + (currentStar.poem || '')).replace(/\n/g, '，');
        if ('speechSynthesis' in window) {
          var utter = new SpeechSynthesisUtterance(text);
          utter.lang = 'zh-CN';
          utter.rate = 0.85;
          window.speechSynthesis.cancel();
          window.speechSynthesis.speak(utter);
        } else {
          alert('当前浏览器不支持语音朗读，将来会接入专业 TTS');
        }
      }

      // 跳转到对应古诗课
      function gotoLesson() {
        if (!currentStar) return;
        var p = currentStar.path;
        var url = 'lesson.html?grade=' + encodeURIComponent(p.gradeId) +
                  '&term=' + encodeURIComponent(p.termId) +
                  '&subject=' + encodeURIComponent(p.subjectId) +
                  '&unit=' + encodeURIComponent(p.unitId) +
                  '&lesson=' + encodeURIComponent(currentStar.lessonId);
        location.href = url;
      }

      // ---------- 主流程 ----------
      function init() {
        document.getElementById('poem-close').addEventListener('click', closePoemModal);
        document.getElementById('poem-recite').addEventListener('click', recitePoem);
        document.getElementById('poem-goto').addEventListener('click', gotoLesson);
        // 点遮罩关闭
        document.getElementById('poem-modal').addEventListener('click', function (e) {
          if (e.target === this) closePoemModal();
        });

        // 分享按钮
        document.getElementById('share-btn').addEventListener('click', generateShareImage);
        document.getElementById('share-close').addEventListener('click', function () {
          document.getElementById('share-modal').classList.remove('show');
        });
        document.getElementById('share-modal').addEventListener('click', function (e) {
          if (e.target === this) this.classList.remove('show');
        });

        // 加载所有古诗课，过滤 type=poem，按 Progress 标记完成状态
        var gradeId = 'g1', termId = 't1', subjectId = 'chinese';
        CourseData.getUnits(gradeId, termId, subjectId).then(function (units) {
          var poemStars = [];
          var chain = Promise.resolve();
          units.forEach(function (unit) {
            chain = chain.then(function () {
              return CourseData.getLessons(gradeId, termId, subjectId, unit.id);
            }).then(function (lessons) {
              lessons.forEach(function (l) {
                if (l.type !== 'poem') return; // 只把古诗课做成星
                var path = {
                  gradeId: gradeId, termId: termId, subjectId: subjectId,
                  unitId: unit.id, lessonId: l.id
                };
                var state = Progress.get(path);
                poemStars.push({
                  id: l.id,
                  lessonId: l.id,
                  path: path,
                  title: l.title,
                  author: l.author,
                  dynasty: l.dynasty,
                  poem: l.poem,
                  completed: state === 'completed',
                  direction: hashToDirection(l.id + l.title)
                });
              });
            });
          });
          return chain.then(function () { return poemStars; });
        }).then(function (poemStars) {
          // 渲染统计
          var done = poemStars.filter(function (s) { return s.completed; }).length;
          document.getElementById('star-count').textContent = done;
          document.getElementById('star-total').textContent = poemStars.length;

          // 初始化 3D 星空
          return StarrySky.init(document.getElementById('sky-container'), {
            starCount: 2500,
            galaxyCount: 1800,
            onPickStar: openPoemModal
          }).then(function (engine) {
            skyEngine = engine;
            StarrySky.setPoemStars(engine, poemStars);
            return engine;
          });
        }).catch(function (err) {
          console.error('星空加载失败', err);
        });
      }

      // ---------- 分享截图 ----------
      function generateShareImage() {
        if (!skyEngine) return;
        var snapshot = StarrySky.captureSnapshot(skyEngine);
        if (!snapshot) {
          alert('截图失败，请稍后重试');
          return;
        }

        // 检查进度数据用于文案
        var gradeId = 'g1', termId = 't1', subjectId = 'chinese';
        CourseData.getUnits(gradeId, termId, subjectId).then(function (units) {
          var total = 0, done = 0;
          var chain = Promise.resolve();
          units.forEach(function (unit) {
            chain = chain.then(function () {
              return CourseData.getLessons(gradeId, termId, subjectId, unit.id);
            }).then(function (lessons) {
              total += lessons.length;
              lessons.forEach(function (l) {
                if (Progress.get({gradeId:gradeId,termId:termId,subjectId:subjectId,unitId:unit.id,lessonId:l.id}) === 'completed') done++;
              });
            });
          });
          return chain.then(function () {
            var checkin = Checkin.getStatus();
            drawShareImage(snapshot, done, total, checkin.streak);
          });
        });
      }

      // 把星空图 + 文案水印合成到 2D canvas，弹出预览
      function drawShareImage(snapshotDataUrl, doneLessons, totalLessons, streak) {
        var canvas = document.createElement('canvas');
        canvas.width = 750; canvas.height = 1334; // 适合手机竖屏分享
        var ctx = canvas.getContext('2d');

        var bgImg = new Image();
        bgImg.onload = function () {
          // 1. 黑底（防 PNG 透明区）
          ctx.fillStyle = '#0D0D2B';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          // 2. 星空图居中填充（裁切适配）
          var srcRatio = bgImg.width / bgImg.height;
          var dstRatio = canvas.width / canvas.height;
          var dw, dh, dx, dy;
          if (srcRatio > dstRatio) {
            dh = canvas.height; dw = dh * srcRatio; dx = (canvas.width - dw)/2; dy = 0;
          } else {
            dw = canvas.width; dh = dw / srcRatio; dx = 0; dy = (canvas.height - dh)/2;
          }
          ctx.drawImage(bgImg, dx, dy, dw, dh);

          // 3. 顶部渐变遮罩，让标题文字可读
          var grad = ctx.createLinearGradient(0, 0, 0, 300);
          grad.addColorStop(0, 'rgba(0,0,0,0.6)');
          grad.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, canvas.width, 300);

          // 4. 底部渐变遮罩
          var grad2 = ctx.createLinearGradient(0, canvas.height - 400, 0, canvas.height);
          grad2.addColorStop(0, 'rgba(0,0,0,0)');
          grad2.addColorStop(1, 'rgba(0,0,0,0.8)');
          ctx.fillStyle = grad2;
          ctx.fillRect(0, canvas.height - 400, canvas.width, 400);

          // 5. 顶部标题
          ctx.textAlign = 'center';
          ctx.fillStyle = '#FFD54F';
          ctx.font = 'bold 48px "PingFang SC", sans-serif';
          ctx.fillText('我的唐诗星空', canvas.width / 2, 120);
          ctx.fillStyle = 'rgba(255,255,255,0.7)';
          ctx.font = '24px "PingFang SC", sans-serif';
          ctx.fillText('伴学小程序 · 一年级语文', canvas.width / 2, 165);

          // 6. 底部统计文案
          var y = canvas.height - 220;
          ctx.fillStyle = '#FFFFFF';
          ctx.font = 'bold 56px "PingFang SC", sans-serif';
          ctx.fillText('已点亮 ' + doneLessons + ' 颗星', canvas.width / 2, y);

          ctx.font = '28px "PingFang SC", sans-serif';
          ctx.fillStyle = 'rgba(255,255,255,0.85)';
          var pct = totalLessons ? Math.round(doneLessons/totalLessons*100) : 0;
          ctx.fillText('课程进度 ' + doneLessons + '/' + totalLessons + ' · ' + pct + '%', canvas.width / 2, y + 60);

          if (streak > 0) {
            ctx.fillStyle = '#FF8C42';
            ctx.fillText('🔥 连续学习 ' + streak + ' 天', canvas.width / 2, y + 110);
          }

          // 7. 底部 slogan
          ctx.fillStyle = 'rgba(255,255,255,0.5)';
          ctx.font = '22px "PingFang SC", sans-serif';
          ctx.fillText('陪孩子，把每首诗学成一颗星', canvas.width / 2, canvas.height - 50);

          // 8. 显示预览弹窗
          showSharePreview(canvas.toDataURL('image/png'));
        };
        bgImg.src = snapshotDataUrl;
      }

      function showSharePreview(imgDataUrl) {
        var modal = document.getElementById('share-modal');
        var img = document.getElementById('share-image');
        img.src = imgDataUrl;
        modal.classList.add('show');
        // 下载按钮直接用 dataURL
        var dlBtn = document.getElementById('share-download');
        dlBtn.href = imgDataUrl;
        dlBtn.download = '我的唐诗星空_' + Checkin.today() + '.png';
        if (window.lucide) lucide.createIcons();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
    </script>
    <script>lucide.createIcons();</script>
</body>
</html>
