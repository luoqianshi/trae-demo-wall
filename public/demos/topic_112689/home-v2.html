<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伴学 - 课程</title>
    <style id="theme-vars">
/* 伴学小程序 — Brand CSS */
/* Primary: warm orange | Secondary: sky blue | White background | Child-friendly */

:root {
  /* Brand Colors */
  --color-primary: #FF8C42;
  --color-primary-light: #FFB87A;
  --color-primary-lighter: #FFF0E0;
  --color-primary-dark: #E07030;

  --color-secondary: #5BB8F5;
  --color-secondary-light: #A0D8FF;
  --color-secondary-lighter: #E8F4FF;
  --color-secondary-dark: #3A9AE0;

  --color-background: #FFFFFF;
  --color-surface: #FFF9F2;
  --color-surface-elevated: #FFFFFF;

  --color-text-primary: #2D2D2D;
  --color-text-secondary: #6B6B6B;
  --color-text-hint: #A0A0A0;

  --color-border: #F0E8E0;
  --color-divider: #F5F0EB;

  /* State Colors */
  --state-success: #4CAF50;
  --state-warning: #FFC107;
  --state-error: #FF5252;
  --state-info: #5BB8F5;

  /* Star / progress gold */
  --color-star: #FFD54F;
  --color-star-light: #FFF8E1;
  --color-progress-dot-active: #FF8C42;
  --color-progress-dot-inactive: #E0D8D0;

  /* Typography */
  --font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif;
  --font-family-display: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif;

  --font-size-xs: 10px;
  --font-size-sm: 12px;
  --font-size-base: 14px;
  --font-size-md: 16px;
  --font-size-lg: 20px;
  --font-size-xl: 24px;
  --font-size-2xl: 28px;
  --font-size-3xl: 32px;

  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-bold: 700;

  --line-height-tight: 1.25;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.75;

  /* Spacing */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-base: 16px;
  --space-lg: 20px;
  --space-xl: 24px;
  --space-2xl: 32px;
  --space-3xl: 40px;

  /* Radius — child-friendly, rounded */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* Shadows */
  --shadow-card: 0 2px 8px rgba(255, 140, 66, 0.08);
  --shadow-elevated: 0 4px 16px rgba(255, 140, 66, 0.12);
  --shadow-float: 0 8px 32px rgba(0, 0, 0, 0.12);
}

/* Typography Classes */
.text-xs { font-size: var(--font-size-xs); line-height: var(--line-height-normal); }
.text-sm { font-size: var(--font-size-sm); line-height: var(--line-height-normal); }
.text-base { font-size: var(--font-size-base); line-height: var(--line-height-normal); }
.text-md { font-size: var(--font-size-md); line-height: var(--line-height-normal); font-weight: var(--font-weight-medium); }
.text-lg { font-size: var(--font-size-lg); line-height: var(--line-height-tight); font-weight: var(--font-weight-bold); }
.text-xl { font-size: var(--font-size-xl); line-height: var(--line-height-tight); font-weight: var(--font-weight-bold); }
.text-2xl { font-size: var(--font-size-2xl); line-height: var(--line-height-tight); font-weight: var(--font-weight-bold); }
.text-3xl { font-size: var(--font-size-3xl); line-height: var(--line-height-tight); font-weight: var(--font-weight-bold); }

.text-primary { color: var(--color-text-primary); }
.text-secondary { color: var(--color-text-secondary); }
.text-hint { color: var(--color-text-hint); }
.text-brand { color: var(--color-primary); }
.text-brand-secondary { color: var(--color-secondary); }

.font-regular { font-weight: var(--font-weight-regular); }
.font-medium { font-weight: var(--font-weight-medium); }
.font-bold { font-weight: var(--font-weight-bold); }

/* Utility Classes */
.bg-primary { background-color: var(--color-primary); }
.bg-primary-light { background-color: var(--color-primary-lighter); }
.bg-secondary { background-color: var(--color-secondary); }
.bg-secondary-light { background-color: var(--color-secondary-lighter); }
.bg-surface { background-color: var(--color-surface); }
.bg-background { background-color: var(--color-background); }

.rounded-sm { border-radius: var(--radius-sm); }
.rounded-md { border-radius: var(--radius-md); }
.rounded-lg { border-radius: var(--radius-lg); }
.rounded-xl { border-radius: var(--radius-xl); }
.rounded-full { border-radius: var(--radius-full); }

.shadow-card { box-shadow: var(--shadow-card); }
.shadow-elevated { box-shadow: var(--shadow-elevated); }
.shadow-float { box-shadow: var(--shadow-float); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--color-background);
    --color-primary: var(--color-primary);
    --color-secondary: var(--color-secondary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="background: var(--color-surface); font-family: var(--font-family);">

    <main class="pb-[134px]">

        <!-- Status Bar Spacer -->
        <div class="h-11 bg-background"></div>

        <!-- WeChat Mini Program Nav Bar -->
        <header class="sticky top-0 z-30 bg-background border-b" style="border-color: var(--color-border);">
            <div class="flex h-11 items-center px-4">
                <!-- Left balancing area (home page, no back button) -->
                <div class="flex w-[88px] items-center justify-start">
                    <a class="inline-flex items-center gap-0.5 text-hint" style="font-size: var(--font-size-xs);" href="#" aria-label="家长入口">
                        <i data-lucide="settings" class="h-3 w-3"></i>
                        <span>家长</span>
                    </a>
                </div>
                <!-- Center title -->
                <div class="min-w-0 flex-1 text-center text-md font-bold" style="color: var(--color-primary);">伴学</div>
                <!-- Right system capsule -->
                <div class="flex h-8 w-[88px] items-center rounded-full border bg-background/90" style="border-color: var(--color-border);">
                    <button class="flex h-full flex-1 items-center justify-center" aria-label="更多">
                        <i data-lucide="more-horizontal" class="h-4 w-4" style="color: var(--color-text-secondary);"></i>
                    </button>
                    <span class="h-4 w-px" style="background: var(--color-border);"></span>
                    <button class="flex h-full flex-1 items-center justify-center" aria-label="关闭">
                        <i data-lucide="x" class="h-4 w-4" style="color: var(--color-text-secondary);"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Subject Tab Bar -->
        <div class="px-4 py-2.5 border-b overflow-x-auto no-scrollbar" style="background: var(--color-surface); border-color: var(--color-divider);">
            <div class="flex items-center gap-3">
                <!-- 语文 tab (active) -->
                <button data-dom-id="subject-chinese" class="shrink-0 inline-flex items-center gap-1.5 px-4 py-2 rounded-full font-bold cursor-pointer" style="background: var(--color-primary); color: #FFFFFF; font-size: var(--font-size-base); box-shadow: 0 2px 10px rgba(255,140,66,0.3);">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                    </svg>
                    <span>语文</span>
                </button>
                <!-- 数学 tab (disabled / coming soon) -->
                <button data-dom-id="subject-math" class="shrink-0 inline-flex flex-col items-center gap-0.5 px-4 py-2 rounded-full cursor-not-allowed opacity-60" style="background: var(--color-divider); font-size: var(--font-size-base);">
                    <div class="flex items-center gap-1.5" style="color: var(--color-text-hint);">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="4" y="2" width="16" height="20" rx="2"></rect>
                            <line x1="8" y1="6" x2="16" y2="6"></line>
                            <line x1="8" y1="10" x2="10" y2="10"></line>
                            <line x1="14" y1="10" x2="16" y2="10"></line>
                            <line x1="8" y1="14" x2="10" y2="14"></line>
                            <line x1="14" y1="14" x2="16" y2="14"></line>
                            <line x1="8" y1="18" x2="16" y2="18"></line>
                        </svg>
                        <span class="font-medium">数学</span>
                    </div>
                    <span style="font-size: 10px; color: var(--color-text-hint);">即将上线</span>
                </button>
                <!-- 英语 tab (disabled / coming soon) -->
                <button data-dom-id="subject-english" class="shrink-0 inline-flex flex-col items-center gap-0.5 px-4 py-2 rounded-full cursor-not-allowed opacity-60" style="background: var(--color-divider); font-size: var(--font-size-base);">
                    <div class="flex items-center gap-1.5" style="color: var(--color-text-hint);">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="2" y1="12" x2="22" y2="12"></line>
                            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                        </svg>
                        <span class="font-medium">英语</span>
                    </div>
                    <span style="font-size: 10px; color: var(--color-text-hint);">即将上线</span>
                </button>
            </div>
        </div>

        <!-- Grade/Semester Selector -->
        <div class="flex justify-center py-3 px-4 bg-background">
            <button class="inline-flex items-center gap-1.5 px-5 py-2 rounded-full font-medium" style="background: var(--color-primary); color: #FFFFFF; font-size: var(--font-size-base); box-shadow: var(--shadow-card);">
                <span>一年级 · 上册</span>
                <i data-lucide="chevron-down" class="h-3.5 w-3.5"></i>
            </button>
        </div>

        <!-- Hero Illustration Section -->
        <div class="px-4 pt-2 pb-4 bg-background">
            <div class="rounded-xl overflow-hidden" style="box-shadow: var(--shadow-elevated);">
                <img src="../assets/hero-illustration.jpg" alt="学习插画" class="w-full h-auto block" loading="eager">
            </div>
            <p class="text-center mt-3 font-bold" style="color: var(--color-primary); font-size: var(--font-size-md);">开始今天的学习吧！</p>
        </div>

        <!-- Course List -->
        <div class="px-4 pt-4 space-y-5">

            <!-- Unit 1: 识字 -->
            <section>
                <h2 class="flex items-center gap-2 mb-3" style="font-size: var(--font-size-md); font-weight: var(--font-weight-bold); color: var(--color-text-primary);">
                    <span>📖</span>
                    <span>第一单元 · 识字</span>
                </h2>
                <div class="grid grid-cols-2 gap-3">

                    <!-- Lesson Card: 天地人 (completed) -->
                    <div class="bg-background rounded-xl shadow-card p-3 flex items-start gap-2.5 min-h-[72px]">
                        <span class="shrink-0 w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold text-white" style="background: var(--color-primary); font-size: var(--font-size-sm);">1</span>
                        <div class="min-w-0 flex-1">
                            <p class="truncate font-medium" style="font-size: var(--font-size-base); color: var(--color-text-primary); line-height: var(--line-height-tight);">天地人</p>
                            <div class="flex items-center gap-1 mt-1.5">
                                <span class="w-2 h-2 rounded-full" style="background: var(--color-progress-dot-active); box-shadow: 0 0 6px rgba(255,140,66,0.5);"></span>
                                <span style="font-size: var(--font-size-xs); color: var(--color-text-hint);">已完成</span>
                            </div>
                        </div>
                    </div>

                    <!-- Lesson Card: 金木水火土 (completed) -->
                    <div class="bg-background rounded-xl shadow-card p-3 flex items-start gap-2.5 min-h-[72px]">
                        <span class="shrink-0 w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold text-white" style="background: var(--color-primary); font-size: var(--font-size-sm);">2</span>
                        <div class="min-w-0 flex-1">
                            <p class="truncate font-medium" style="font-size: var(--font-size-base); color: var(--color-text-primary); line-height: var(--line-height-tight);">金木水火土</p>
                            <div class="flex items-center gap-1 mt-1.5">
                                <span class="w-2 h-2 rounded-full" style="background: var(--color-progress-dot-active); box-shadow: 0 0 6px rgba(255,140,66,0.5);"></span>
                                <span style="font-size: var(--font-size-xs); color: var(--color-text-hint);">已完成</span>
                            </div>
                        </div>
                    </div>

                    <!-- Lesson Card: 口耳目 (completed) -->
                    <div class="bg-background rounded-xl shadow-card p-3 flex items-start gap-2.5 min-h-[72px]">
                        <span class="shrink-0 w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold text-white" style="background: var(--color-primary); font-size: var(--font-size-sm);">3</span>
                        <div class="min-w-0 flex-1">
                            <p class="truncate font-medium" style="font-size: var(--font-size-base); color: var(--color-text-primary); line-height: var(--line-height-tight);">口耳目</p>
                            <div class="flex items-center gap-1 mt-1.5">
                                <span class="w-2 h-2 rounded-full" style="background: var(--color-progress-dot-active); box-shadow: 0 0 6px rgba(255,140,66,0.5);"></span>
                                <span style="font-size: var(--font-size-xs); color: var(--color-text-hint);">已完成</span>
                            </div>
                        </div>
                    </div>

                    <!-- Lesson Card: 日月水火 (in-progress) -->
                    <div class="bg-background rounded-xl shadow-card p-3 flex items-start gap-2.5 min-h-[72px]">
                        <span class="shrink-0 w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold" style="background: var(--color-primary-lighter); color: var(--color-primary); font-size: var(--font-size-sm);">4</span>
                        <div class="min-w-0 flex-1">
                            <p class="truncate font-medium" style="font-size: var(--font-size-base); color: var(--color-text-primary); line-height: var(--line-height-tight);">日月水火</p>
                            <div class="flex items-center gap-1 mt-1.5">
                                <span class="progress-dot-half w-2 h-2 rounded-full" style="background: linear-gradient(90deg, var(--color-progress-dot-active) 50%, var(--color-progress-dot-inactive) 50%); box-shadow: 0 0 4px rgba(255,140,66,0.3);"></span>
                                <span style="font-size: var(--font-size-xs); color: var(--color-text-hint);">学习中</span>
                            </div>
                        </div>
                    </div>

                    <!-- Lesson Card: 对韵歌 (not started) -->
                    <div class="bg-background rounded-xl shadow-card p-3 flex items-start gap-2.5 min-h-[72px]">
                        <span class="shrink-0 w-7 h-7 rounded-full flex items-center justify-center text-xs font-medium" style="background: var(--color-divider); color: var(--color-text-hint); font-size: var(--font-size-sm);">5</span>
                        <div class="min-w-0 flex-1">
                            <p class="truncate font-medium" style="font-size: var(--font-size-base); color: var(--color-text-primary); line-height: var(--line-height-tight);">对韵歌</p>
                            <div class="flex items-center gap-1 mt-1.5">
                                <span class="w-2 h-2 rounded-full" style="background: var(--color-progress-dot-inactive);"></span>
                                <span style="font-size: var(--font-size-xs); color: var(--color-text-hint);">未开始</span>
                            </div>
                        </div>
                    </div>

                </div>
            </section>

            <!-- Unit 2: 拼音 -->
            <section>
                <h2 class="flex items-center gap-2 mb-3" style="font-size: var(--font-size-md); font-weight: var(--font-weight-bold); color: var(--color-text-primary);">
                    <span>🔤</span>
                    <span>第二单元 · 拼音</span>
                </h2>
                <div class="grid grid-cols-2 gap-3">

                    <!-- Lesson Card: a o e (completed) -->
                    <div class="bg-background rounded-xl shadow-card p-3 flex items-start gap-2.5 min-h-[72px]">
                        <span class="shrink-0 w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold text-white" style="background: var(--color-primary); font-size: var(--font-size-sm);">1</span>
                        <div class="min-w-0 flex-1">
                            <p class="truncate font-medium" style="font-size: var(--font-size-base); color: var(--color-text-primary); line-height: var(--line-height-tight);">a o e</p>
                            <div class="flex items-center gap-1 mt-1.5">
                                <span class="w-2 h-2 rounded-full" style="background: var(--color-progress-dot-active); box-shadow: 0 0 6px rgba(255,140,66,0.5);"></span>
                                <span style="font-size: var(--font-size-xs); color: var(--color-text-hint);">已完成</span>
                            </div>
                        </div>
                    </div>

                    <!-- Lesson Card: i u ü (completed) -->
                    <div class="bg-background rounded-xl shadow-card p-3 flex items-start gap-2.5 min-h-[72px]">
                        <span class="shrink-0 w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold text-white" style="background: var(--color-primary); font-size: var(--font-size-sm);">2</span>
                        <div class="min-w-0 flex-1">
                            <p class="truncate font-medium" style="font-size: var(--font-size-base); color: var(--color-text-primary); line-height: var(--line-height-tight);">i u ü</p>
                            <div class="flex items-center gap-1 mt-1.5">
                                <span class="w-2 h-2 rounded-full" style="background: var(--color-progress-dot-active); box-shadow: 0 0 6px rgba(255,140,66,0.5);"></span>
                                <span style="font-size: var(--font-size-xs); color: var(--color-text-hint);">已完成</span>
                            </div>
                        </div>
                    </div>

                    <!-- Lesson Card: b p m f (not started) -->
                    <div class="bg-background rounded-xl shadow-card p-3 flex items-start gap-2.5 min-h-[72px]">
                        <span class="shrink-0 w-7 h-7 rounded-full flex items-center justify-center text-xs font-medium" style="background: var(--color-divider); color: var(--color-text-hint); font-size: var(--font-size-sm);">3</span>
                        <div class="min-w-0 flex-1">
                            <p class="truncate font-medium" style="font-size: var(--font-size-base); color: var(--color-text-primary); line-height: var(--line-height-tight);">b p m f</p>
                            <div class="flex items-center gap-1 mt-1.5">
                                <span class="w-2 h-2 rounded-full" style="background: var(--color-progress-dot-inactive);"></span>
                                <span style="font-size: var(--font-size-xs); color: var(--color-text-hint);">未开始</span>
                            </div>
                        </div>
                    </div>

                    <!-- Lesson Card: d t n l (not started) -->
                    <div class="bg-background rounded-xl shadow-card p-3 flex items-start gap-2.5 min-h-[72px]">
                        <span class="shrink-0 w-7 h-7 rounded-full flex items-center justify-center text-xs font-medium" style="background: var(--color-divider); color: var(--color-text-hint); font-size: var(--font-size-sm);">4</span>
                        <div class="min-w-0 flex-1">
                            <p class="truncate font-medium" style="font-size: var(--font-size-base); color: var(--color-text-primary); line-height: var(--line-height-tight);">d t n l</p>
                            <div class="flex items-center gap-1 mt-1.5">
                                <span class="w-2 h-2 rounded-full" style="background: var(--color-progress-dot-inactive);"></span>
                                <span style="font-size: var(--font-size-xs); color: var(--color-text-hint);">未开始</span>
                            </div>
                        </div>
                    </div>

                    <!-- Lesson Card: g k h (locked) -->
                    <div class="bg-background rounded-xl p-3 flex items-start gap-2.5 min-h-[72px] opacity-50">
                        <span class="shrink-0 w-7 h-7 rounded-full flex items-center justify-center text-xs font-medium" style="background: var(--color-divider); color: var(--color-text-hint); font-size: var(--font-size-sm);">5</span>
                        <div class="min-w-0 flex-1">
                            <p class="truncate font-medium" style="font-size: var(--font-size-base); color: var(--color-text-hint); line-height: var(--line-height-tight);">g k h</p>
                            <div class="flex items-center gap-1 mt-1.5">
                                <i data-lucide="lock" class="h-2.5 w-2.5" style="color: var(--color-text-hint);"></i>
                                <span style="font-size: var(--font-size-xs); color: var(--color-text-hint);">待解锁</span>
                            </div>
                        </div>
                    </div>

                </div>
            </section>

        </div>

    </main>

    <!-- Bottom Tab Bar -->
    <nav class="fixed bottom-0 inset-x-0 z-30 bg-background border-t" style="border-color: var(--color-border); height: 50px;">
