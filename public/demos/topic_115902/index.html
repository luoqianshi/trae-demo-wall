<!DOCTYPE html>
<html lang="zh-CN">
<head>

<body>

      </span>
      <span class="tab-label">首页</span>
    </div>

      <span class="tab-label">我的</span>

  <!-- 数据库 -->
  <script src="js/data.js"></script>
  <!-- 搜索引擎 -->
  <script src="js/search.js"></script>
  <!-- AI 引擎 -->
  <script src="js/ai.js"></script>
  <!-- 主应用 -->
  <script src="js/app.js"></script>

</html>
