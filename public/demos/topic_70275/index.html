<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心境盒 MindBox - 交互式体验</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #f5f0eb;
  --card: rgba(255,255,255,0.72);
  --card-border: rgba(255,255,255,0.55);
  --primary: #7c6f64;
  --primary-light: #b8a99a;
  --accent: #e8a87c;
  --accent2: #d4a574;
  --text: #3c3836;
  --text-light: #8c8078;
  --joy: #f4c542;
  --calm: #7ec8a0;
  --sad: #6ba4c7;
  --anxious: #c78cb0;
  --angry: #e07b6e;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --radius: 18px;
  --nav-h: 68px;
  --header-h: 52px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: linear-gradient(135deg, #e8ddd0 0%, #f0e8dc 30%, #f5f0eb 60%, #eae0d5 100%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.phone {
  width: 390px;
  max-width: 100%;
  height: 760px;
  background: var(--bg);
  border-radius: 32px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15), 0 0 0 2px rgba(0,0,0,0.05);
  display: flex;
  flex-direction: column;
  position: relative;
}

.header {
  height: var(--header-h);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 20px;
  background: rgba(255,255,255,0.5);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(0,0,0,0.04);
  flex-shrink: 0;
}

.header h1 {
  font-size: 17px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: 0.5px;
}

.header .subtitle {
  font-size: 11px;
  color: var(--text-light);
  margin-left: 6px;
  font-weight: 400;
}

.content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px 16px 8px;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}

.content::-webkit-scrollbar { width: 0; }

/* Bottom Nav */
.bottom-nav {
  height: var(--nav-h);
  display: flex;
  align-items: center;
  justify-content: space-around;
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid rgba(0,0,0,0.04);
  flex-shrink: 0;
  padding-bottom: 6px;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  cursor: pointer;
  padding: 6px 12px;
  border-radius: 12px;
  transition: all 0.2s;
  border: none;
  background: none;
  font-family: inherit;
}

.nav-item .nav-icon { font-size: 22px; transition: transform 0.2s; }
.nav-item .nav-label { font-size: 10px; color: var(--text-light); transition: color 0.2s; }
.nav-item.active .nav-icon { transform: scale(1.1); }
.nav-item.active .nav-label { color: var(--primary); font-weight: 600; }

/* Cards */
.card {
  background: var(--card);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}

.card-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 10px;
}

/* Mood Overview */
.mood-today {
  display: flex;
  align-items: center;
  gap: 14px;
}

.mood-emoji {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  background: linear-gradient(135deg, #f5e6d3, #f0dcc8);
}

.mood-info { flex: 1; }
.mood-info .mood-label { font-size: 13px; color: var(--text-light); }
.mood-info .mood-value { font-size: 20px; font-weight: 700; color: var(--text); }
.mood-streak {
  text-align: center;
  padding: 8px 14px;
  background: rgba(232,168,124,0.12);
  border-radius: 12px;
}
.mood-streak .streak-num { font-size: 22px; font-weight: 700; color: var(--accent); }
.mood-streak .streak-label { font-size: 10px; color: var(--text-light); }

/* Quick Actions */
.quick-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.quick-action {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px;
  border-radius: 14px;
  cursor: pointer;
  border: none;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  transition: all 0.2s;
  text-align: left;
}

.quick-action:active { transform: scale(0.97); }
.qa-icon { font-size: 24px; }
.qa-1 { background: rgba(244,197,66,0.15); }
.qa-2 { background: rgba(126,200,160,0.15); }
.qa-3 { background: rgba(107,164,199,0.15); }
.qa-4 { background: rgba(199,140,176,0.15); }

/* Emotion Selector */
.emotion-grid {
  display: flex;
  justify-content: space-around;
  gap: 6px;
  margin: 10px 0;
}

.emotion-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 12px 8px;
  border-radius: 16px;
  cursor: pointer;
  border: 2px solid transparent;
  background: rgba(255,255,255,0.5);
  transition: all 0.25s;
  font-family: inherit;
  min-width: 56px;
}

.emotion-btn .emoji { font-size: 28px; transition: transform 0.2s; }
.emotion-btn .label { font-size: 11px; color: var(--text-light); }
.emotion-btn.selected { border-color: var(--primary); background: rgba(255,255,255,0.8); transform: translateY(-2px); }
.emotion-btn.selected .emoji { transform: scale(1.15); }

.emotion-btn[data-mood="joy"]:hover { background: rgba(244,197,66,0.2); }
.emotion-btn[data-mood="calm"]:hover { background: rgba(126,200,160,0.2); }
.emotion-btn[data-mood="sad"]:hover { background: rgba(107,164,199,0.2); }
.emotion-btn[data-mood="anxious"]:hover { background: rgba(199,140,176,0.2); }
.emotion-btn[data-mood="angry"]:hover { background: rgba(224,123,110,0.2); }

.note-input {
  width: 100%;
  border: 1px solid rgba(0,0,0,0.08);
  border-radius: 12px;
  padding: 12px;
  font-size: 14px;
  font-family: inherit;
  resize: none;
  background: rgba(255,255,255,0.6);
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}
.note-input:focus { border-color: var(--primary-light); }

.btn-primary {
  width: 100%;
  padding: 13px;
  border-radius: 14px;
  border: none;
  background: linear-gradient(135deg, var(--primary), #8c7e72);
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
  margin-top: 10px;
}
.btn-primary:active { transform: scale(0.98); opacity: 0.9; }

/* Toast */
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(60,56,54,0.9);
  color: #fff;
  padding: 10px 24px;
  border-radius: 20px;
  font-size: 14px;
  z-index: 999;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }

/* Chat */
.chat-container {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-height: 380px;
  overflow-y: auto;
}

.chat-msg {
  max-width: 82%;
  padding: 12px 16px;
  border-radius: 16px;
  font-size: 14px;
  line-height: 1.5;
  animation: msgIn 0.3s ease;
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.chat-msg.user {
  align-self: flex-end;
  background: rgba(124,111,100,0.12);
  border-bottom-right-radius: 6px;
}

.chat-msg.ai {
  align-self: flex-start;
  background: rgba(232,168,124,0.18);
  border-bottom-left-radius: 6px;
}

.chat-input-row {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}

.chat-input {
  flex: 1;
  border: 1px solid rgba(0,0,0,0.08);
  border-radius: 20px;
  padding: 10px 16px;
  font-size: 14px;
  font-family: inherit;
  background: rgba(255,255,255,0.6);
  outline: none;
}

.chat-send {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  background: var(--primary);
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  flex-shrink: 0;
  transition: all 0.2s;
}
.chat-send:active { transform: scale(0.92); }

/* Breathing */
.breath-circle {
  width: 160px;
  height: 160px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(126,200,160,0.3), rgba(126,200,160,0.08));
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 20px auto;
  transition: all 0.1s linear;
  border: 2px solid rgba(126,200,160,0.25);
}

.breath-text {
  font-size: 18px;
  font-weight: 600;
  color: var(--calm);
  text-align: center;
}

.breath-controls {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 16px;
}

.breath-btn {
  padding: 10px 24px;
  border-radius: 20px;
  border: none;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
}

.breath-start { background: var(--calm); color: #fff; }
.breath-stop { background: rgba(0,0,0,0.06); color: var(--text); }
.breath-btn:active { transform: scale(0.95); }

/* Dashboard */
.chart-wrapper {
  position: relative;
  height: 200px;
  margin: 8px 0;
}

.chart-wrapper canvas { width: 100% !important; }

/* Progress */
.progress-bar {
  height: 8px;
  border-radius: 4px;
  background: rgba(0,0,0,0.06);
  overflow: hidden;
  margin: 6px 0 12px;
}

.progress-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.5s ease;
}

/* Page */
.page { display: none; }
.page.active { display: block; }

/* Achievement */
.achievement-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.achievement-badge {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px;
  border-radius: 12px;
  background: rgba(255,255,255,0.5);
  min-width: 70px;
  font-size: 11px;
  color: var(--text-light);
  text-align: center;
}

.achievement-badge .badge-icon { font-size: 24px; }
.achievement-badge.locked { opacity: 0.4; filter: grayscale(1); }

/* Tips */
.tip-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  border-radius: 14px;
  background: rgba(232,168,124,0.1);
  margin-bottom: 10px;
  cursor: pointer;
  transition: all 0.2s;
  border: none;
  font-family: inherit;
  text-align: left;
  width: 100%;
  font-size: 13px;
  color: var(--text);
}
.tip-card:active { background: rgba(232,168,124,0.2); }
.tip-icon { font-size: 28px; flex-shrink: 0; }

/* Section title */
.section-label {
  font-size: 11px;
  color: var(--text-light);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
  margin-top: 4px;
}
</style>
</head>
<body>

<div class="phone">
  <div class="header">
    <h1>心境盒</h1>
    <span class="subtitle">MindBox</span>
  </div>

  <div class="content" id="content">
    <!-- Home Page -->
    <div class="page active" id="page-home">
      <div class="card">
        <div class="mood-today">
          <div class="mood-emoji" id="todayEmoji">😊</div>
          <div class="mood-info">
            <div class="mood-label">今日心情</div>
            <div class="mood-value" id="todayMood">愉悦</div>
          </div>
          <div class="mood-streak">
            <div class="streak-num" id="streakNum">0</div>
            <div class="streak-label">连续打卡</div>
          </div>
        </div>
      </div>

      <div class="section-label">快捷操作</div>
      <div class="quick-actions">
        <button class="quick-action qa-1" onclick="switchTab('checkin')">
          <span class="qa-icon">📝</span> 记录心情
        </button>
        <button class="quick-action qa-2" onclick="switchTab('voice')">
          <span class="qa-icon">💬</span> AI 倾诉
        </button>
        <button class="quick-action qa-3" onclick="switchTab('dashboard')">
          <span class="qa-icon">📊</span> 情绪趋势
        </button>
        <button class="quick-action qa-4" onclick="switchTab('wellness')">
          <span class="qa-icon">🧘</span> 正念呼吸
        </button>
      </div>

      <div class="card" style="margin-top:12px">
        <div class="card-title">💡 今日小贴士</div>
        <p style="font-size:13px;color:var(--text-light);line-height:1.6" id="dailyTip">
          每天花 5 分钟记录情绪，你会更了解自己。
        </p>
      </div>

      <div class="card">
        <div class="card-title">🏆 成就进度</div>
        <div style="font-size:12px;color:var(--text-light);margin-bottom:4px">情绪记录 7 天挑战</div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill" style="width:0%;background:var(--accent)"></div>
        </div>
        <div style="font-size:11px;color:var(--text-light);text-align:right"><span id="progressDays">0</span> / 7 天</div>
      </div>
    </div>

    <!-- CheckIn Page -->
    <div class="page" id="page-checkin">
      <div class="card">
        <div class="card-title">今天感觉怎么样？</div>
        <div class="emotion-grid" id="emotionGrid">
          <button class="emotion-btn" data-mood="joy" onclick="selectMood('joy', this)">
            <span class="emoji">😊</span><span class="label">愉悦</span>
          </button>
          <button class="emotion-btn" data-mood="calm" onclick="selectMood('calm', this)">
            <span class="emoji">😌</span><span class="label">平静</span>
          </button>
          <button class="emotion-btn" data-mood="sad" onclick="selectMood('sad', this)">
            <span class="emoji">😢</span><span class="label">低落</span>
          </button>
          <button class="emotion-btn" data-mood="anxious" onclick="selectMood('anxious', this)">
            <span class="emoji">😰</span><span class="label">焦虑</span>
          </button>
          <button class="emotion-btn" data-mood="angry" onclick="selectMood('angry', this)">
            <span class="emoji">😤</span><span class="label">烦躁</span>
          </button>
        </div>
        <textarea class="note-input" id="moodNote" rows="2" placeholder="写点什么吧...（选填）"></textarea>
        <button class="btn-primary" onclick="submitMood()">💾 记录心情</button>
      </div>

      <div class="card">
        <div class="card-title">📋 最近记录</div>
        <div id="recentRecords" style="font-size:12px;color:var(--text-light);">
          还没有记录，开始你的第一次打卡吧！
        </div>
      </div>
    </div>

    <!-- Voice Page -->
    <div class="page" id="page-voice">
      <div class="card">
        <div class="card-title">💬 AI 情绪倾诉</div>
        <p style="font-size:12px;color:var(--text-light);margin-bottom:10px">
          和我说说你的心事，我会认真倾听并给你温暖的回应。
        </p>
        <div class="chat-container" id="chatContainer">
          <div class="chat-msg ai">你好，我是你的 AI 情绪伙伴。今天过得怎么样？有什么想聊聊的吗？</div>
        </div>
        <div class="chat-input-row">
          <input class="chat-input" id="chatInput" placeholder="说说你的想法..." onkeydown="if(event.key==='Enter')sendChat()">
          <button class="chat-send" onclick="sendChat()">➤</button>
        </div>
      </div>
    </div>

    <!-- Dashboard Page -->
    <div class="page" id="page-dashboard">
      <div class="card">
        <div class="card-title">📊 情绪趋势（近 7 天）</div>
        <div class="chart-wrapper">
          <canvas id="moodChart"></canvas>
        </div>
      </div>

      <div class="card">
        <div class="card-title">📈 情绪分布</div>
        <div class="chart-wrapper" style="height:180px">
          <canvas id="pieChart"></canvas>
        </div>
      </div>

      <div class="card">
        <div class="card-title">📋 统计概览</div>
        <div style="display:flex;justify-content:space-around;text-align:center">
          <div>
            <div style="font-size:24px;font-weight:700;color:var(--accent)" id="statTotal">0</div>
            <div style="font-size:11px;color:var(--text-light)">总记录</div>
          </div>
          <div>
            <div style="font-size:24px;font-weight:700;color:var(--calm)" id="statStreak">0</div>
            <div style="font-size:11px;color:var(--text-light)">连续天数</div>
          </div>
          <div>
            <div style="font-size:24px;font-weight:700;color:var(--joy)" id="statBest">-</div>
            <div style="font-size:11px;color:var(--text-light)">最佳心情</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Wellness Page -->
    <div class="page" id="page-wellness">
      <div class="card" style="text-align:center">
        <div class="card-title">🧘 正念呼吸练习</div>
        <div class="breath-circle" id="breathCircle">
          <div class="breath-text" id="breathText">准备开始</div>
        </div>
        <div class="breath-controls">
          <button class="breath-btn breath-start" id="breathStart" onclick="startBreath()">▶ 开始</button>
          <button class="breath-btn breath-stop" onclick="stopBreath()">⏹ 停止</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title">🌿 情绪调节技巧</div>
        <button class="tip-card" onclick="showTip('5-4-3-2-1 感官法：说出 5 个你看到的东西、4 个触摸到的、3 个听到的、2 个闻到的、1 个尝到的。这能帮你迅速回到当下。')">
          <span class="tip-icon">👁</span>
          <div><strong>5-4-3-2-1 感官法</strong><br><span style="font-size:11px;color:var(--text-light)">快速回到当下，缓解焦虑</span></div>
        </button>
        <button class="tip-card" onclick="showTip('4-7-8 呼吸法：吸气 4 秒，屏息 7 秒，缓慢呼气 8 秒。重复 4 次，能有效降低心率，缓解紧张。')">
          <span class="tip-icon">🫁</span>
          <div><strong>4-7-8 呼吸法</strong><br><span style="font-size:11px;color:var(--text-light)">降低心率，缓解紧张</span></div>
        </button>
        <button class="tip-card" onclick="showTip('身体扫描：闭上眼睛，从脚趾开始，慢慢将注意力向上移动，感受每个部位的感觉。不要评判，只是觉察。')">
          <span class="tip-icon">🧍</span>
          <div><strong>身体扫描冥想</strong><br><span style="font-size:11px;color:var(--text-light)">觉察身体，放松身心</span></div>
        </button>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('home')">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">首页</span>
    </button>
    <button class="nav-item" onclick="switchTab('checkin')">
      <span class="nav-icon">📝</span>
      <span class="nav-label">打卡</span>
    </button>
    <button class="nav-item" onclick="switchTab('voice')">
      <span class="nav-icon">💬</span>
      <span class="nav-label">倾诉</span>
    </button>
    <button class="nav-item" onclick="switchTab('dashboard')">
      <span class="nav-icon">📊</span>
      <span class="nav-label">趋势</span>
    </button>
    <button class="nav-item" onclick="switchTab('wellness')">
      <span class="nav-icon">🧘</span>
      <span class="nav-label">正念</span>
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============ Data Store ============
const STORAGE_KEY = 'mindbox_records';
const moodMap = {
  joy: { emoji: '😊', label: '愉悦', color: '#f4c542' },
  calm: { emoji: '😌', label: '平静', color: '#7ec8a0' },
  sad: { emoji: '😢', label: '低落', color: '#6ba4c7' },
  anxious: { emoji: '😰', label: '焦虑', color: '#c78cb0' },
  angry: { emoji: '😤', label: '烦躁', color: '#e07b6e' }
};

const tips = [
  '每天花 5 分钟记录情绪，你会更了解自己。',
  '心情不好时，试试深呼吸 10 次，会有意想不到的效果。',
  '研究表明，感恩日记可以提升 25% 的幸福感。',
  '运动 30 分钟能释放内啡肽，是天然的"快乐药"。',
  '和朋友聊天 15 分钟，孤独感会减少一半。',
  '保持 7-8 小时睡眠是情绪稳定的基础。',
  '今天尝试对镜子里的自己笑一笑吧！',
];

function loadRecords() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  } catch { return []; }
}

function saveRecords(records) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
}

function getToday() {
  return new Date().toISOString().split('T')[0];
}

function getLast7Days() {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    days.push(d.toISOString().split('T')[0]);
  }
  return days;
}

// ============ Toast ============
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

// ============ Tab Switching ============
function switchTab(tab) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

  const page = document.getElementById('page-' + tab);
  if (page) page.classList.add('active');

  const navs = document.querySelectorAll('.nav-item');
  const tabIndex = { home: 0, checkin: 1, voice: 2, dashboard: 3, wellness: 4 };
  if (navs[tabIndex[tab]]) navs[tabIndex[tab]].classList.add('active');

  document.getElementById('content').scrollTop = 0;

  if (tab === 'dashboard') renderDashboard();
  if (tab === 'home') updateHome();
  if (tab === 'checkin') updateRecentRecords();
}

// ============ Mood Selection ============
let selectedMood = null;

function selectMood(mood, el) {
  selectedMood = mood;
  document.querySelectorAll('.emotion-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
}

// ============ Submit Mood ============
function submitMood() {
  if (!selectedMood) {
    showToast('请先选择一种心情 😊');
    return;
  }
  const records = loadRecords();
  const today = getToday();
  const note = document.getElementById('moodNote').value.trim();
  const mood = moodMap[selectedMood];

  const existingIdx = records.findIndex(r => r.date === today);
  if (existingIdx >= 0) {
    records[existingIdx] = { date: today, mood: selectedMood, note };
    showToast('已更新今日心情 ✅');
  } else {
    records.push({ date: today, mood: selectedMood, note });
    showToast(`已记录：${mood.emoji} ${mood.label}`);
  }

  saveRecords(records);
  document.getElementById('moodNote').value = '';
  selectedMood = null;
  document.querySelectorAll('.emotion-btn').forEach(b => b.classList.remove('selected'));

  updateHome();
  updateRecentRecords();
}

// ============ Update Home ============
function updateHome() {
  const records = loadRecords();
  const today = getToday();
  const todayRecord = records.find(r => r.date === today);

  if (todayRecord) {
    const m = moodMap[todayRecord.mood];
    document.getElementById('todayEmoji').textContent = m.emoji;
    document.getElementById('todayMood').textContent = m.label;
  } else {
    document.getElementById('todayEmoji').textContent = '🌱';
    document.getElementById('todayMood').textContent = '还没记录';
  }

  // Streak
  const sorted = [...records].sort((a, b) => b.date.localeCompare(a.date));
  let streak = 0;
  const checkDate = new Date();
  for (let i = 0; i < 365; i++) {
    const d = new Date(checkDate);
    d.setDate(d.getDate() - i);
    const ds = d.toISOString().split('T')[0];
    if (sorted.some(r => r.date === ds)) streak++;
    else break;
  }
  document.getElementById('streakNum').textContent = streak;

  // Progress
  const uniqueDays = new Set(records.map(r => r.date)).size;
  const progressDays = Math.min(uniqueDays, 7);
  document.getElementById('progressFill').style.width = (progressDays / 7 * 100) + '%';
  document.getElementById('progressDays').textContent = progressDays;

  // Daily tip
  document.getElementById('dailyTip').textContent = tips[Math.floor(Math.random() * tips.length)];
}

// ============ Recent Records ============
function updateRecentRecords() {
  const records = loadRecords();
  const sorted = [...records].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 5);
  const container = document.getElementById('recentRecords');

  if (sorted.length === 0) {
    container.innerHTML = '<span style="color:var(--text-light)">还没有记录，开始你的第一次打卡吧！</span>';
    return;
  }

  container.innerHTML = sorted.map(r => {
    const m = moodMap[r.mood];
    return `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(0,0,0,0.04)">
      <span style="font-size:22px">${m.emoji}</span>
      <div style="flex:1">
        <div style="font-size:13px;color:var(--text)">${m.label}</div>
        <div style="font-size:11px;color:var(--text-light)">${r.date}${r.note ? ' — ' + r.note : ''}</div>
      </div>
    </div>`;
  }).join('');
}

];

function sendChat() {
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  if (!msg) return;

  const container = document.getElementById('chatContainer');
  container.innerHTML += `<div class="chat-msg user">${escapeHtml(msg)}</div>`;
  input.value = '';
  container.scrollTop = container.scrollHeight;

  // Simulate AI response
  setTimeout(() => {
    const response = aiResponses[Math.floor(Math.random() * aiResponses.length)];
    container.innerHTML += `<div class="chat-msg ai">${response}</div>`;
    container.scrollTop = container.scrollHeight;
  }, 600 + Math.random() * 800);
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ============ Dashboard Charts ============
let moodChartInstance = null;
let pieChartInstance = null;

function renderDashboard() {
  const records = loadRecords();
  const last7Days = getLast7Days();
  const moodScores = { joy: 5, calm: 4, sad: 2, anxious: 1, angry: 1 };

  const lineData = last7Days.map(day => {
    const r = records.find(rec => rec.date === day);
    return r ? moodScores[r.mood] || 3 : null;
  });

  const labels = last7Days.map(d => d.slice(5));

  // Line chart
  const ctx1 = document.getElementById('moodChart');
  if (moodChartInstance) moodChartInstance.destroy();
  moodChartInstance = new Chart(ctx1, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: '心情指数',
        data: lineData,
        borderColor: '#7c6f64',
        backgroundColor: 'rgba(124,111,100,0.08)',
        fill: true,
        tension: 0.4,
        pointBackgroundColor: lineData.map(v => v === null ? 'transparent' : '#e8a87c'),
        pointBorderColor: lineData.map(v => v === null ? 'transparent' : '#e8a87c'),
        pointRadius: 5,
        pointHoverRadius: 7,
        spanGaps: false,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: { min: 0, max: 6, ticks: { stepSize: 1, font: { size: 10 } }, grid: { color: 'rgba(0,0,0,0.04)' } },
        x: { ticks: { font: { size: 10 } }, grid: { display: false } }
      }
    }
  });

  // Pie chart
  const moodCount = {};
  records.forEach(r => { moodCount[r.mood] = (moodCount[r.mood] || 0) + 1; });
  const pieLabels = Object.keys(moodCount).map(k => moodMap[k]?.label || k);
  const pieData = Object.values(moodCount);
  const pieColors = Object.keys(moodCount).map(k => moodMap[k]?.color || '#ccc');

  const ctx2 = document.getElementById('pieChart');
  if (pieChartInstance) pieChartInstance.destroy();
  if (pieData.length > 0) {
    pieChartInstance = new Chart(ctx2, {
      type: 'doughnut',
      data: {
        labels: pieLabels,
        datasets: [{ data: pieData, backgroundColor: pieColors, borderWidth: 0 }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { position: 'right', labels: { font: { size: 10 }, padding: 12 } } }
      }
    });
  }

  // Stats
  document.getElementById('statTotal').textContent = records.length;
  const sorted = [...records].sort((a, b) => b.date.localeCompare(a.date));
  let streak = 0;
  const checkDate = new Date();
  for (let i = 0; i < 365; i++) {
    const d = new Date(checkDate);
    d.setDate(d.getDate() - i);
    if (sorted.some(r => r.date === d.toISOString().split('T')[0])) streak++;
    else break;
  }
  document.getElementById('statStreak').textContent = streak;

  if (pieData.length > 0) {
    const maxIdx = pieData.indexOf(Math.max(...pieData));
    document.getElementById('statBest').textContent = moodMap[Object.keys(moodCount)[maxIdx]]?.emoji || '-';
  }
}

// ============ Breathing Exercise ============
let breathInterval = null;
let breathPhase = 0; // 0=inhale, 1=hold, 2=exhale
let breathSeconds = 0;

function startBreath() {
  if (breathInterval) return;
  document.getElementById('breathStart').textContent = '⏸ 暂停';
  breathPhase = 0;
  breathSeconds = 0;
  runBreathCycle();
  breathInterval = setInterval(runBreathCycle, 1000);
}

function runBreathCycle() {
  const circle = document.getElementById('breathCircle');
  const text = document.getElementById('breathText');

  if (breathPhase === 0) {
    // Inhale 4s
    const scale = 1 + (breathSeconds / 4) * 0.4;
    circle.style.transform = `scale(${scale})`;
    circle.style.background = 'radial-gradient(circle, rgba(126,200,160,0.4), rgba(126,200,160,0.1))';
    text.textContent = '吸 气';
    text.style.color = '#7ec8a0';
    breathSeconds++;
    if (breathSeconds >= 4) { breathPhase = 1; breathSeconds = 0; }
  } else if (breathPhase === 1) {
    // Hold 4s
    circle.style.transform = 'scale(1.4)';
    circle.style.background = 'radial-gradient(circle, rgba(126,200,160,0.35), rgba(126,200,160,0.08))';
    text.textContent = '屏 息';
    text.style.color = '#5a9a78';
    breathSeconds++;
    if (breathSeconds >= 4) { breathPhase = 2; breathSeconds = 0; }
  } else {
    // Exhale 6s
    const scale = 1.4 - (breathSeconds / 6) * 0.4;
    circle.style.transform = `scale(${scale})`;
    circle.style.background = 'radial-gradient(circle, rgba(126,200,160,0.2), rgba(126,200,160,0.04))';
    text.textContent = '呼 气';
    text.style.color = '#8cbfa0';
    breathSeconds++;
    if (breathSeconds >= 6) { breathPhase = 0; breathSeconds = 0; }
  }
}

function stopBreath() {
  clearInterval(breathInterval);
  breathInterval = null;
  document.getElementById('breathStart').textContent = '▶ 开始';
  document.getElementById('breathCircle').style.transform = 'scale(1)';
  document.getElementById('breathCircle').style.background = 'radial-gradient(circle, rgba(126,200,160,0.3), rgba(126,200,160,0.08))';
  document.getElementById('breathText').textContent = '准备开始';
  document.getElementById('breathText').style.color = '#7ec8a0';
}

// ============ Tip Dialog ============
function showTip(text) {
  showToast(text);
}

// ============ Init ============
function init() {
  updateHome();
  updateRecentRecords();
}

init();
