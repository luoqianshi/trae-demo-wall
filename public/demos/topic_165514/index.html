<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 漫剧工坊｜一句话生成竖屏漫剧 Demo</title>
  <style>
    :root {
      --bg: #0b0d14;
      --bg2: #131722;
      --bg3: #1a1f30;
      --ink: #f4f5f8;
      --muted: #9ca3af;
      --rule: #232838;
      --accent: #818cf8;
      --accent2: #f472b6;
      --accent-soft: rgba(129, 140, 248, 0.12);
      --success: #34d399;
      --warn: #fbbf24;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 15px; line-height: 1.6; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 20px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { width: 42px; height: 42px; border-radius: 10px; background: linear-gradient(135deg, #818cf8, #f472b6); display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; color: #0b0d14; }
    .brand h1 { margin: 0; font-size: 22px; }
    .brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
    .badges { display: flex; gap: 8px; flex-wrap: wrap; }
    .badge { padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .badge-local { background: var(--accent-soft); color: var(--accent); }
    .badge-ai { background: rgba(244,114,182,0.12); color: var(--accent2); }
    main { display: grid; grid-template-columns: 360px 1fr; gap: 20px; align-items: start; }
    .card { background: var(--bg2); border: 1px solid var(--rule); border-radius: 12px; padding: 16px; }
    .input-panel { display: flex; flex-direction: column; gap: 14px; }
    label { font-size: 13px; font-weight: 600; color: var(--muted); }
    .row { display: flex; flex-direction: column; gap: 8px; }
    .options { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-opt { padding: 7px 12px; font-size: 12px; border-radius: 6px; background: var(--bg); border: 1px solid var(--rule); color: var(--ink); cursor: pointer; }
    .btn-opt.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
    .style-neon.active { color: #818cf8; border-color: #818cf8; }
    .style-heal.active { color: #fbbf24; border-color: #fbbf24; }
    .style-ink.active { color: #e5e7eb; border-color: #e5e7eb; }
    textarea { background: var(--bg); border: 1px solid var(--rule); border-radius: 8px; color: var(--ink); padding: 10px; font-size: 14px; resize: vertical; }
    textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .insp { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .insp-label { font-size: 12px; color: var(--muted); }
    .insp-btn { padding: 5px 10px; font-size: 12px; border-radius: 6px; background: var(--bg); border: 1px solid var(--rule); color: var(--muted); cursor: pointer; }
    .generate-btn { background: linear-gradient(135deg, #818cf8, #f472b6); color: #0b0d14; font-weight: 700; padding: 12px; border-radius: 8px; border: none; cursor: pointer; font-size: 15px; }
    .generate-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .hint { margin: 0; font-size: 12px; color: var(--muted); text-align: center; }
    .placeholder { min-height: 320px; display: flex; align-items: center; justify-content: center; color: var(--muted); text-align: center; }
    .workbench { min-height: 320px; }
    .wb-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
    .wb-header h2 { margin: 0 0 4px; font-size: 20px; }
    .meta { margin: 0; color: var(--muted); font-size: 13px; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .tab { padding: 6px 12px; font-size: 13px; border-radius: 6px; background: var(--bg); border: 1px solid var(--rule); color: var(--muted); cursor: pointer; }
    .tab.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .view h3 { margin: 16px 0 10px; font-size: 15px; color: var(--accent); }
    .view h3:first-of-type { margin-top: 0; }
    .logline { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
    .char-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .char-card { display: flex; align-items: center; gap: 12px; background: var(--bg); border: 1px solid var(--rule); border-radius: 10px; padding: 12px; }
    .char-symbol { width: 40px; height: 40px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; font-size: 18px; color: #0b0d14; flex: none; }
    .char-name { font-weight: 700; font-size: 15px; margin-right: 8px; }
    .char-role { font-size: 11px; color: var(--muted); padding: 1px 6px; border: 1px solid var(--rule); border-radius: 999px; }
    .char-age { margin: 4px 0 6px; font-size: 12px; color: var(--muted); }
    .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 1px solid rgba(255,255,255,0.1); }
    .beat-list { display: grid; gap: 10px; }
    .beat { background: var(--bg); border: 1px solid var(--rule); border-radius: 8px; padding: 12px; }
    .beat-label { font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
    .beat-desc { margin: 0 0 4px; color: var(--muted); font-size: 13px; }
    .beat-narration { margin: 0 0 2px; font-size: 14px; }
    .beat-dialogue { margin: 4px 0 0; font-size: 14px; color: var(--accent2); }
    .storyboard { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .phone { width: 300px; aspect-ratio: 9/16; background: #05060a; border: 10px solid #1a1d28; border-radius: 32px; padding: 8px; box-shadow: 0 24px 50px rgba(0,0,0,0.45); }
    .phone-screen { width: 100%; height: 100%; border-radius: 20px; overflow-y: auto; background: var(--bg); display: flex; flex-direction: column; gap: 1px; }
    .player .phone-screen { overflow: hidden; justify-content: center; position: relative; }
    .scene { display: flex; flex-direction: column; background: var(--bg2); border-bottom: 1px solid var(--rule); flex: none; }
    .scene-art { position: relative; width: 100%; aspect-ratio: 9/14; overflow: hidden; }
    .scene-art svg { width: 100%; height: 100%; display: block; }
    .beat-tag { position: absolute; top: 6px; left: 6px; padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: 700; color: #0b0d14; background: var(--accent); }
    .scene-info { padding: 8px 10px; }
    .scene-shot { margin: 0 0 4px; font-size: 10px; color: var(--muted); }
    .scene-desc { margin: 0 0 4px; font-size: 11px; }
    .scene-narration { margin: 0; font-size: 10px; color: var(--accent2); }
    .player-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .play-btn { background: var(--accent); color: #0b0d14; font-weight: 700; padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer; }
    .play-btn:disabled { opacity: 0.6; }
    .progress { font-size: 13px; color: var(--muted); }
    .player-end { color: var(--muted); text-align: center; font-size: 14px; }
    .export-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    .export-btn { background: var(--bg); border: 1px solid var(--rule); color: var(--ink); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .export-btn.primary { background: var(--accent); color: #0b0d14; border-color: var(--accent); }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--success); color: #0b0d14; padding: 10px 18px; border-radius: 8px; font-weight: 700; font-size: 13px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 200; }
    .toast.show { opacity: 1; }
    .loading-overlay { position: fixed; inset: 0; background: rgba(11,13,20,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 100; }
    .spinner { width: 40px; height: 40px; border: 3px solid var(--rule); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: var(--muted); font-size: 14px; }
    .subtitle { position: absolute; bottom: 28px; left: 12px; right: 12px; background: rgba(0,0,0,0.7); border-radius: 8px; padding: 8px 10px; font-size: 13px; line-height: 1.4; text-align: center; color: #fff; z-index: 5; }
    .edit-area { width: 100%; background: var(--bg); border: 1px solid var(--rule); border-radius: 8px; color: var(--ink); padding: 8px; font-size: 13px; margin-top: 6px; }
    .check-list { display: grid; gap: 8px; }
    .check-item { display: flex; align-items: center; gap: 10px; padding: 10px; background: var(--bg); border: 1px solid var(--rule); border-radius: 8px; }
    .check-item .status { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .check-item.ok .status { background: var(--success); }
    .check-item.warn .status { background: var(--warn); }
    .check-item.fail .status { background: var(--danger); }
    .check-item .title { font-size: 13px; font-weight: 600; }
    .check-item .detail { font-size: 12px; color: var(--muted); margin-left: auto; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 150; }
    .modal-backdrop.show { display: flex; }
    .modal { background: var(--bg2); border: 1px solid var(--rule); border-radius: 12px; padding: 20px; width: min(480px, 90vw); }
    .modal h3 { margin: 0 0 12px; }
    .modal .row { margin-bottom: 12px; }
    .modal input { width: 100%; background: var(--bg); border: 1px solid var(--rule); border-radius: 8px; color: var(--ink); padding: 8px; font-size: 13px; }
    .modal .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
    .modal .note { font-size: 12px; color: var(--muted); margin-top: 8px; }
    .settings-btn { background: transparent; border: 1px solid var(--rule); color: var(--muted); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    #player-canvas { width: 100%; height: 100%; display: block; border-radius: 20px; }
    .export-progress { margin-top: 12px; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; display: none; }
    .export-progress.show { display: block; }
    .export-progress-bar { height: 100%; width: 0%; background: var(--accent); transition: width 0.2s; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <span class="brand-mark">AI</span>
        <div>
          <h1>AI 漫剧工坊</h1>
          <p>一句话，生成你的第一集竖屏漫剧</p>
        </div>
      </div>
      <div class="badges">
        <span class="badge badge-local">学习工作赛道</span>
        <span class="badge badge-ai">TRAE AI 创造力大赛</span>
      </div>
    </header>

    <main>
      <section class="input-panel card">
        <div class="row">
          <label>模式</label>
          <div class="options" id="mode-options"></div>
        </div>
        <div class="row">
          <label>画风</label>
          <div class="options" id="style-options"></div>
        </div>
        <div class="row">
          <label for="story">你的故事</label>
          <textarea id="story" rows="4" placeholder="输入 10–300 字的故事梗概…"></textarea>
        </div>
        <div class="insp">
          <span class="insp-label">灵感：</span>
          <button class="insp-btn" data-text="深夜，女主在便利店遇到了三年未见的前男友，他手里拿着她当年送他的伞。">灵感 1</button>
          <button class="insp-btn" data-text="一名快递员在老旧公寓楼下收到一张写着自己名字的讣告。">灵感 2</button>
          <button class="insp-btn" data-text="少年在图书馆发现一本每页都在预测明天的笔记本。">灵感 3</button>
        </div>
        <button id="generate" class="generate-btn">一键生成漫剧</button>
        <p class="hint">约 24 秒 · 6 个分镜 · 可导出 WebM / SRT</p>
        <div id="ai-settings-row" style="display:none;">
          <button id="open-ai-settings" class="settings-btn">配置真实 AI 接口</button>
        </div>
      </section>

      <section id="workbench" class="placeholder card">
        <p>在左侧输入故事，点击生成，即可看到剧本、角色、分镜和竖屏成片。</p>
      </section>
    </main>
  </div>

  <div id="loading" class="loading-overlay" style="display:none;">
    <div class="spinner"></div>
    <div id="loading-text" class="loading-text">正在拆解故事…</div>
  </div>

  <div id="toast" class="toast">已复制到剪贴板</div>

  <div id="ai-modal" class="modal-backdrop">
    <div class="modal">
      <h3>真实 AI 接口设置</h3>
      <div class="row">
        <label>Base URL</label>
        <input id="ai-base" type="text" placeholder="https://api.openai.com/v1" />
      </div>
      <div class="row">
        <label>模型名</label>
        <input id="ai-model" type="text" placeholder="gpt-4o-mini" />
      </div>
      <div class="row">
        <label>API Key</label>
        <input id="ai-key" type="password" placeholder="sk-..." />
      </div>
      <p class="note">API Key 仅在当前页面内存中使用，刷新后消失。</p>
      <div class="actions">
        <button id="close-ai-modal" class="export-btn">取消</button>
        <button id="save-ai-settings" class="export-btn primary">保存</button>
      </div>
    </div>
  </div>

  <script>
    const STYLE_LABELS = { 'neon-noir': '霓虹悬疑', healing: '治愈绘本', ink: '国风水墨' };
    const MODE_LABELS = { local: '极速体验 · 本地生成', ai: '真实 AI · 自备接口' };
    const BEATS = ['钩子','触发事件','升级','反转','高潮','余韵'];
    const P_NAMES = ['阿岚','苏晚','林知','夏澄','沈念','顾遥','江予','宋乔'];
    const S_NAMES = ['林皓','程野','周叙','陆恒','方知','谢延','叶洵','孟忱'];
    const APPEARANCES = ['黑色及肩直发，米色风衣','栗色短发，深灰衬衫','黑色长发，藏青色外套','棕色卷发，白色卫衣','齐耳短发，墨绿夹克','微卷中发，驼色大衣'];
    const SETTINGS = ['城市暗巷','便利店门口','老旧公寓楼','雨夜街道','天台边缘','地下通道','废弃车站','咖啡馆','图书馆','海边栈道'];
    const TIMES = ['雨夜','深夜','黄昏','凌晨','阴天正午'];
    const SHOTS = ['特写','近景','中景','全景','过肩镜头'];
    const MOVEMENTS = ['固定','缓慢推近','横移','轻微俯视','低角度仰拍'];
    const MOODS = ['紧张','悬疑','温情','孤独','坚定','犹豫'];

    const state = {
      mode: 'local',
      style: 'neon-noir',
      project: null,
      activeTab: 'storyboard',
      playing: false,
      currentScene: 0,
      audioContext: null,
      bgmOsc: null,
      aiSettings: { baseUrl: '', model: '', key: '' },
      exportAbort: null
    };

    function hashString(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    function seededRandom(seed) {
      let s = seed || 1;
      return () => {
        s = (s * 1664525 + 1013904223) % 4294967296;
        return s / 4294967296;
      };
    }

    function createLocalProject(text, style, mode) {
      const normalized = text.trim().slice(0, 300);
      const seed = hashString(`${normalized}:${style}`);
      const rng = seededRandom(seed);
      const pName = P_NAMES[Math.floor(rng() * P_NAMES.length)];
      const sName = S_NAMES[Math.floor(rng() * S_NAMES.length)];
      const appearanceA = APPEARANCES[Math.floor(rng() * APPEARANCES.length)];
      const appearanceB = APPEARANCES[Math.floor(rng() * APPEARANCES.length)];
      const setting = SETTINGS[Math.floor(rng() * SETTINGS.length)];
      const time = TIMES[Math.floor(rng() * TIMES.length)];

      const colors = {
        'neon-noir': { p1: '#818cf8', p2: '#f472b6', s1: '#22d3ee', s2: '#a78bfa' },
        healing: { p1: '#fbbf24', p2: '#34d399', s1: '#f472b6', s2: '#60a5fa' },
        ink: { p1: '#1f2937', p2: '#b91c1c', s1: '#374151', s2: '#991b1b' }
      }[style];

      const protagonist = { id: 'c1', name: pName, role: 'protagonist', age: `${20 + Math.floor(rng() * 12)}岁`, appearance: appearanceA, primaryColor: colors.p1, secondaryColor: colors.p2, symbol: style === 'neon-noir' ? '☂' : style === 'healing' ? '☀' : '墨', pitch: 1.1, rate: 1.0 };
      const supporting = { id: 'c2', name: sName, role: 'supporting', age: `${22 + Math.floor(rng() * 12)}岁`, appearance: appearanceB, primaryColor: colors.s1, secondaryColor: colors.s2, symbol: style === 'neon-noir' ? '◆' : style === 'healing' ? '♣' : '笔', pitch: 0.9, rate: 0.95 };

      const narrations = {
        '钩子': [`一切从${normalized.slice(0,10)}开始。`, `${time}，${setting}亮起冷光。`],
        '触发事件': [`${normalized.slice(0,10)}，打破了平静。`, `一条信息，改变了一切。`],
        '升级': [`局势开始失控。`, `${normalized.slice(0,10)}，越来越快。`],
        '反转': [`原来${normalized.slice(0,10)}`, `事情并非如此。`],
        '高潮': [`所有线索汇聚于此。`, `${normalized.slice(0,10)}，无法回头。`],
        '余韵': [`${time}渐渐安静下来。`, `${normalized.slice(0,10)}，留下余味。`]
      };
      const dialogues = {
        '钩子': ['是你？','等等。','这不可能。'],
        '触发事件': ['跟我来。','你确定吗？','我们没有时间了。'],
        '升级': ['别出声。','这不合理。','一定有办法。'],
        '反转': ['原来是你。','为什么要骗我？','你早就知道了？'],
        '高潮': ['站住！','把话说清楚。','我不会让你走。'],
        '余韵': ['……走吧。','谢谢你。','还会再见吗？']
      };

      const scenes = BEATS.map((beat, i) => {
        const shot = SHOTS[Math.floor(rng() * SHOTS.length)];
        const movement = MOVEMENTS[Math.floor(rng() * MOVEMENTS.length)];
        const mood = MOODS[Math.floor(rng() * MOODS.length)];
        const duration = 3 + Math.floor(rng() * 3);
        const hasDialogue = rng() > 0.4;
        const speaker = rng() > 0.5 ? protagonist : supporting;
        const narrOptions = narrations[beat] || ['画面推进。'];
        const dialOptions = dialogues[beat] || ['……'];
        return {
          id: `s${i + 1}`, order: i + 1, beat, setting, timeOfDay: time, shotType: shot, movement,
          visualDescription: `${time}，${setting}，${shot}，${mood}氛围`,
          narration: narrOptions[Math.floor(rng() * narrOptions.length)],
          dialogue: hasDialogue ? `${speaker.name}：${dialOptions[Math.floor(rng() * dialOptions.length)]}` : '',
          speakerId: hasDialogue ? speaker.id : undefined,
          mood, duration
        };
      });

      return {
        id: `proj_${seed.toString(36).slice(0, 8)}`, seed, sourceText: normalized, mode, style,
        title: `${time}的${setting}`, genre: style === 'neon-noir' ? '都市悬疑' : style === 'healing' ? '治愈日常' : '新国风',
        logline: normalized.length > 20 ? normalized.slice(0, 45) + '…' : normalized,
        characters: [protagonist, supporting], scenes,
        totalDuration: scenes.reduce((a, b) => a + b.duration, 0)
      };
    }

    function renderOptions() {
      document.getElementById('mode-options').innerHTML = Object.keys(MODE_LABELS).map(m =>
        `<button class="btn-opt ${state.mode === m ? 'active' : ''}" data-mode="${m}">${MODE_LABELS[m]}</button>`).join('');
      document.getElementById('style-options').innerHTML = Object.keys(STYLE_LABELS).map(s =>
        `<button class="btn-opt style-${s === 'neon-noir' ? 'neon' : s === 'healing' ? 'heal' : 'ink'} ${state.style === s ? 'active' : ''}" data-style="${s}">${STYLE_LABELS[s]}</button>`).join('');
      document.getElementById('ai-settings-row').style.display = state.mode === 'ai' ? 'block' : 'none';
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    function renderSceneArt(scene, style, chars) {
      const primary = chars[0].primaryColor;
      const secondary = chars[1].primaryColor;
      const fill = style === 'healing' ? 'url(#sky-heal)' : style === 'ink' ? 'url(#sky-ink)' : 'url(#sky-neon)';
      const deco = style === 'neon-noir'
        ? `<g opacity="0.6"><line x1="15" y1="50" x2="35" y2="40" stroke="${primary}" stroke-width="0.5"/><line x1="70" y1="45" x2="88" y2="30" stroke="${secondary}" stroke-width="0.5"/><circle cx="85" cy="25" r="2" fill="${secondary}" opacity="0.6"/></g>`
        : style === 'healing'
        ? `<g opacity="0.5"><circle cx="20" cy="35" r="4" fill="#fbbf24"/><path d="M15 45 q5 5 10 0" stroke="#fbbf24" fill="none" stroke-width="0.8"/></g>`
        : `<g opacity="0.6"><circle cx="50" cy="40" r="12" fill="#1f2937" opacity="0.08"/><path d="M45 55 q5 8 10 0" stroke="#1f2937" fill="none" stroke-width="1"/></g>`;
      const bubble = scene.dialogue
        ? `<rect x="12" y="12" width="76" height="24" rx="4" fill="rgba(0,0,0,0.6)"/><text x="50" y="22" text-anchor="middle" fill="#fff" font-size="4.5" font-family="sans-serif">${escapeHtml(scene.dialogue.slice(0, 18))}</text>`
        : '';
      return `<svg viewBox="0 0 100 178" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="sky-neon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e1b4b"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
          <linearGradient id="sky-heal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef3c7"/><stop offset="1" stop-color="#dbeafe"/></linearGradient>
          <linearGradient id="sky-ink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3f4f6"/><stop offset="1" stop-color="#d1d5db"/></linearGradient>
        </defs>
        <rect width="100" height="178" fill="${fill}"/>
        <path d="M0 130 Q50 122 100 130 L100 178 L0 178 Z" fill="#0b0d14" opacity="0.85"/>
        <circle cx="35" cy="95" r="7" fill="${primary}" opacity="0.9"/>
        <path d="M25 108 h20 l3 22 h-26 z" fill="${primary}" opacity="0.75"/>
        <circle cx="68" cy="100" r="5" fill="${secondary}" opacity="0.85"/>
        <path d="M61 110 h14 l2 18 h-18 z" fill="${secondary}" opacity="0.7"/>
        ${deco}${bubble}
      </svg>`;
    }

    function renderSceneCard(scene) {
      const chars = state.project.characters;
      return `<article class="scene">
        <div class="scene-art">${renderSceneArt(scene, state.project.style, chars)}<div class="beat-tag">${scene.beat}</div></div>
        <div class="scene-info">
          <p class="scene-shot">${scene.shotType} · ${scene.movement}</p>
          <p class="scene-desc">${escapeHtml(scene.visualDescription)}</p>
          ${scene.narration ? `<p class="scene-narration">${escapeHtml(scene.narration)}</p>` : ''}
        </div>
      </article>`;
    }

    function renderWorkbench() {
      const p = state.project;
      const wb = document.getElementById('workbench');
      wb.className = 'workbench card';
      wb.innerHTML = `<div class="wb-header">
        <div>
          <h2>${escapeHtml(p.title)}</h2>
          <p class="meta">${STYLE_LABELS[p.style]} · ${p.genre} · ${p.scenes.length} 镜 · ${p.totalDuration} 秒</p>
        </div>
        <div class="tabs">

          <button class="tab ${state.activeTab === 'storyboard' ? 'active' : ''}" data-tab="storyboard">分镜</button>
          <button class="tab ${state.activeTab === 'player' ? 'active' : ''}" data-tab="player">成片</button>

    function renderView() {
      const p = state.project;
      if (state.activeTab === 'script') {
        return `<h3>剧情梗概</h3><p class="logline">${escapeHtml(p.logline)}</p>
          <h3>角色设定</h3><div class="char-list">${p.characters.map(c => `

              <div>
                <div><span class="char-name">${c.name}</span><span class="char-role">${c.role === 'protagonist' ? '主角' : '配角'}</span></div>
                <p class="char-age">${c.age} · ${c.appearance}</p>

            <div class="beat" data-index="${i}">
              <div class="beat-label">${s.order}. ${s.beat}</div>
              <p class="beat-desc">${escapeHtml(s.visualDescription)}</p>

      } else if (state.activeTab === 'player') {
        return `<div class="storyboard">
          <div class="phone player"><canvas id="player-canvas" width="720" height="1280"></canvas></div>
          <div class="player-controls">
            <button id="play-btn" class="play-btn">${state.playing ? '暂停' : '从头播放'}</button>
            <button id="stop-btn" class="export-btn">停止</button>
            <span class="progress">${state.currentScene + 1} / ${p.scenes.length}</span>
          </div>
          <p class="hint">播放时自动调用浏览器中文语音；若不可用，仅显示字幕。</p>
        </div>`;
      } else if (state.activeTab === 'export') {
        return `<h3>导出成片</h3>
          <p class="logline">使用 720×1280 Canvas + MediaRecorder 导出 WebM。约 ${p.totalDuration} 秒作品需要约 ${p.totalDuration} 秒导出时间。</p>
          <div class="export-row">
            <button id="export-webm" class="export-btn primary">导出 WebM</button>
            <button id="copy-script" class="export-btn">复制剧本</button>
            <button id="copy-srt" class="export-btn">复制 SRT</button>
            <button id="save-html" class="export-btn">保存 HTML</button>
          </div>
          <div id="export-progress" class="export-progress"><div id="export-progress-bar" class="export-progress-bar"></div></div>
          <p id="export-status" class="hint" style="margin-top:8px;text-align:left;"></p>`;
      } else {
        const checks = runQualityChecks();
        return `<h3>发布检查</h3><div class="check-list">${checks.map(c => `
          <div class="check-item ${c.ok ? 'ok' : c.warn ? 'warn' : 'fail'}">
            <span class="status"></span>
            <span class="title">${c.title}</span>
            <span class="detail">${c.detail}</span>
          </div>`).join('')}</div>`;
      }
    }

    function runQualityChecks() {
      const p = state.project;
      return [
        { title: '画面比例', detail: '9:16', ok: true },
        { title: '导出分辨率', detail: '720×1280', ok: true },
        { title: '总时长', detail: `${p.totalDuration} 秒`, ok: p.totalDuration >= 20 && p.totalDuration <= 30, warn: p.totalDuration < 20 || p.totalDuration > 30 },
        { title: '分镜完整性', detail: `${p.scenes.length} 个分镜均有内容`, ok: p.scenes.length === 6 && p.scenes.every(s => s.narration) },
        { title: '字幕安全区', detail: '底部预留 120px', ok: true },
        { title: '音轨状态', detail: hasChineseVoice() ? '浏览器配音可用' : '仅背景音 / 静音降级', ok: true, warn: !hasChineseVoice() }
      ];
    }

    function hasChineseVoice() {
      if (!window.speechSynthesis) return false;
      const voices = window.speechSynthesis.getVoices();
      return voices.some(v => v.lang.includes('zh') || v.lang.includes('cmn') || v.lang.includes('CN'));
    }

    function stopSpeech() {
      if (window.speechSynthesis) window.speechSynthesis.cancel();
    }

    function speak(text, char) {
      if (!window.speechSynthesis || !text) return;
      const u = new SpeechSynthesisUtterance(text);
      const voices = window.speechSynthesis.getVoices();
      const zhVoice = voices.find(v => v.lang.includes('zh') || v.lang.includes('cmn') || v.lang.includes('CN')) || voices[0];
      if (zhVoice) u.voice = zhVoice;
      u.pitch = char ? char.pitch : 1;
      u.rate = char ? char.rate : 1;
      u.lang = 'zh-CN';
      window.speechSynthesis.speak(u);
    }

    function startBgm(style) {
      if (!window.AudioContext && !window.webkitAudioContext) return;
      stopBgm();
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      state.audioContext = ctx;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      osc.type = style === 'neon-noir' ? 'sawtooth' : style === 'healing' ? 'sine' : 'triangle';
      osc.frequency.value = style === 'neon-noir' ? 55 : style === 'healing' ? 220 : 110;
      filter.type = 'lowpass';
      filter.frequency.value = style === 'neon-noir' ? 400 : style === 'healing' ? 1200 : 600;
      gain.gain.value = 0.03;
      osc.connect(filter).connect(gain).connect(ctx.destination);
      osc.start();
      state.bgmOsc = { osc, gain, ctx };
    }

    function stopBgm() {
      if (state.bgmOsc) { try { state.bgmOsc.osc.stop(); } catch(e){} state.bgmOsc = null; }
      if (state.audioContext) { try { state.audioContext.close(); } catch(e){} state.audioContext = null; }
    }

    function drawCanvasScene(canvas, scene, style, chars, progress) {
      const ctx = canvas.getContext('2d');
      const w = canvas.width, h = canvas.height;
      const p = chars[0], s = chars[1];
      const palette = {
        'neon-noir': { sky0: '#1e1b4b', sky1: '#0f172a', ground: '#0b0d14', accent: p.primaryColor },
        healing: { sky0: '#fef3c7', sky1: '#dbeafe', ground: '#e0f2fe', accent: p.primaryColor },
        ink: { sky0: '#f3f4f6', sky1: '#d1d5db', ground: '#e5e7eb', accent: p.secondaryColor }
      }[style];
      const grad = ctx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, palette.sky0);
      grad.addColorStop(1, palette.sky1);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = palette.ground;
      ctx.globalAlpha = 0.85;
      ctx.beginPath();
      ctx.moveTo(0, h * 0.72);
      ctx.quadraticCurveTo(w / 2, h * 0.68, w, h * 0.72);
      ctx.lineTo(w, h);
      ctx.lineTo(0, h);
      ctx.fill();
      ctx.globalAlpha = 1;

      const zoom = 1 + progress * 0.05;
      const cx = w / 2 + (progress - 0.5) * 40;
      const cyP = h * 0.58 + Math.sin(progress * Math.PI) * 10;
      const cyS = h * 0.62 + Math.cos(progress * Math.PI) * 8;

      drawCharacter(ctx, cx - w * 0.18 * zoom, cyP, 110 * zoom, p, style);
      drawCharacter(ctx, cx + w * 0.14 * zoom, cyS, 95 * zoom, s, style, true);

      if (style === 'neon-noir') {
        ctx.strokeStyle = '#22d3ee'; ctx.globalAlpha = 0.3;
        ctx.beginPath(); ctx.moveTo(w * 0.15, h * 0.25); ctx.lineTo(w * 0.35, h * 0.2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(w * 0.7, h * 0.22); ctx.lineTo(w * 0.88, h * 0.14); ctx.stroke();
      } else if (style === 'healing') {
        ctx.fillStyle = '#fbbf24'; ctx.globalAlpha = 0.25;
        ctx.beginPath(); ctx.arc(w * 0.2, h * 0.18, 40, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.strokeStyle = '#1f2937'; ctx.globalAlpha = 0.1;
        ctx.beginPath(); ctx.arc(w * 0.5, h * 0.22, 120, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.globalAlpha = 1;

      if (scene.dialogue) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        roundRect(ctx, w * 0.1, h * 0.08, w * 0.8, 90, 16);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(scene.dialogue.slice(0, 20), w / 2, h * 0.08 + 50);
      }
    }

    function drawCharacter(ctx, x, y, size, char, style, back = false) {
      ctx.save();
      ctx.translate(x, y);
      ctx.globalAlpha = back ? 0.85 : 1;
      ctx.fillStyle = char.primaryColor;
      ctx.beginPath();
      ctx.arc(0, -size * 0.35, size * 0.22, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = char.secondaryColor;
      ctx.beginPath();
      ctx.moveTo(-size * 0.25, -size * 0.1);
      ctx.lineTo(size * 0.25, -size * 0.1);
      ctx.lineTo(size * 0.18, size * 0.6);
      ctx.lineTo(-size * 0.18, size * 0.6);
      ctx.fill();
      ctx.fillStyle = style === 'ink' ? '#1f2937' : '#0b0d14';
      ctx.font = `bold ${size * 0.25}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(char.symbol, 0, -size * 0.35);
      ctx.restore();
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function updatePlayerCanvas() {
      const canvas = document.getElementById('player-canvas');
      if (!canvas || !state.project) return;
      const scene = state.project.scenes[state.currentScene];
      if (!scene) return;
      drawCanvasScene(canvas, scene, state.project.style, state.project.characters, 0);
      const ctx = canvas.getContext('2d');
      const w = canvas.width, h = canvas.height;
      const text = scene.dialogue ? `${scene.narration}  ${scene.dialogue}` : scene.narration;
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      roundRect(ctx, w * 0.05, h - 160, w * 0.9, 90, 12);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 30px sans-serif';
      ctx.textAlign = 'center';
      wrapText(ctx, text, w / 2, h - 125, w * 0.8, 40);
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = text.split('');
      let line = '';
      const lines = [];
      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n];
        const metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && line !== '') { lines.push(line); line = words[n]; }
        else { line = testLine; }
      }
      lines.push(line);
      lines.slice(0, 2).forEach((l, i) => ctx.fillText(l, x, y + i * lineHeight));
    }

    let playTimer = null;
    let sceneStartTime = 0;

    function startPlayer() {
      if (!state.project) return;
      state.playing = true;
      state.currentScene = 0;
      startBgm(state.project.style);
      playScene();
      renderWorkbench();
      requestAnimationFrame(animatePlayer);
    }

    function playScene() {
      stopSpeech();
      const scene = state.project.scenes[state.currentScene];
      if (!scene) { stopPlayer(); return; }
      const char = scene.speakerId ? state.project.characters.find(c => c.id === scene.speakerId) : null;
      const text = scene.dialogue ? scene.dialogue.replace(/^[^：]+：/, '') : scene.narration;
      speak(text, char);
      sceneStartTime = performance.now();
      playTimer = setTimeout(() => {
        state.currentScene += 1;
        if (state.currentScene >= state.project.scenes.length) {
          stopPlayer();
        } else {
          renderWorkbench();
          playScene();
        }
      }, scene.duration * 1000);
    }

    function animatePlayer() {
      if (!state.playing || !state.project) return;
      updatePlayerCanvas();
      requestAnimationFrame(animatePlayer);
    }

    function pausePlayer() {
      if (playTimer) clearTimeout(playTimer);
      stopSpeech();
      state.playing = false;
      renderWorkbench();
    }

    function stopPlayer() {
      if (playTimer) clearTimeout(playTimer);
      stopSpeech();
      stopBgm();
      state.playing = false;
      state.currentScene = 0;
      renderWorkbench();
    }

    function showToast(text) {
      const t = document.getElementById('toast');
      t.textContent = text;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    function generateSRT() {
      let t = 0;
      return state.project.scenes.map((s, i) => {
        const start = formatTime(t);
        t += s.duration;
        const end = formatTime(t);
        return `${i + 1}\n${start} --> ${end}\n${s.narration}${s.dialogue ? '\n' + s.dialogue : ''}\n`;
      }).join('\n');
    }

    function formatTime(sec) {
      const h = Math.floor(sec / 3600).toString().padStart(2, '0');
      const m = Math.floor((sec % 3600) / 60).toString().padStart(2, '0');
      const s = Math.floor(sec % 60).toString().padStart(2, '0');
      return `${h}:${m}:${s},000`;
    }

    function downloadHTML() {
      const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `ai-comic-${state.project.id}.html`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('HTML 已下载');
    }

    async function exportWebM() {
      const canvas = document.createElement('canvas');
      canvas.width = 720; canvas.height = 1280;
      const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
        ? 'video/webm;codecs=vp9'
        : MediaRecorder.isTypeSupported('video/webm;codecs=vp8')
        ? 'video/webm;codecs=vp8'
        : 'video/webm';
      if (!window.MediaRecorder || !canvas.captureStream) {
        showToast('当前浏览器不支持 WebM 导出');
        return;
      }
      const stream = canvas.captureStream(30);
      const mediaRecorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 2500000 });
      const chunks = [];
      mediaRecorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const blob = new Blob(chunks, { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${state.project.title}-AI漫剧工坊.webm`;
        a.click();
        URL.revokeObjectURL(url);
        document.getElementById('export-progress').classList.remove('show');
        document.getElementById('export-status').textContent = '导出完成';
        showToast('WebM 已导出');
      };

      document.getElementById('export-progress').classList.add('show');
      document.getElementById('export-status').textContent = '正在录制…';
      mediaRecorder.start();
      const scenes = state.project.scenes;
      const total = state.project.totalDuration;
      let elapsed = 0;
      for (let i = 0; i < scenes.length; i++) {
        const scene = scenes[i];
        const duration = scene.duration;
        const start = performance.now();
        while (performance.now() - start < duration * 1000) {
          const t = (performance.now() - start) / 1000 / duration;
          drawCanvasScene(canvas, scene, state.project.style, state.project.characters, t);
          const ctx = canvas.getContext('2d');
          const text = scene.dialogue ? `${scene.narration}  ${scene.dialogue}` : scene.narration;
          ctx.fillStyle = 'rgba(0,0,0,0.7)';
          roundRect(ctx, 36, 1120, 648, 90, 12);
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 30px sans-serif';
          ctx.textAlign = 'center';
          wrapText(ctx, text, 360, 1165, 600, 40);
          const progress = (elapsed + (performance.now() - start) / 1000) / total;
          document.getElementById('export-progress-bar').style.width = `${Math.min(progress * 100, 100)}%`;
          await new Promise(r => requestAnimationFrame(r));
        }
        elapsed += duration;
      }
      mediaRecorder.stop();
    }

    function bindWorkbenchEvents() {
      document.querySelectorAll('.tab').forEach(btn => {
        btn.addEventListener('click', () => { state.activeTab = btn.dataset.tab; stopPlayer(); renderWorkbench(); bindWorkbenchEvents(); if (state.activeTab === 'player') updatePlayerCanvas(); });
      });
      document.querySelectorAll('[contenteditable]').forEach(el => {
        el.addEventListener('blur', () => {
          const idx = Number(el.closest('.beat').dataset.index);
          const field = el.dataset.field;
          state.project.scenes[idx][field] = el.textContent.trim();
          showToast('已保存修改');
        });
      });
      const playBtn = document.getElementById('play-btn');
      if (playBtn) playBtn.addEventListener('click', () => { if (state.playing) pausePlayer(); else startPlayer(); });
      const stopBtn = document.getElementById('stop-btn');
      if (stopBtn) stopBtn.addEventListener('click', stopPlayer);
      document.getElementById('copy-script')?.addEventListener('click', () => {
        const script = state.project.scenes.map(s => `[${s.beat}] ${s.visualDescription}\n${s.narration}${s.dialogue ? '\n' + s.dialogue : ''}`).join('\n\n');
        navigator.clipboard.writeText(script).then(() => showToast('剧本已复制'));
      });
      document.getElementById('copy-srt')?.addEventListener('click', () => {
        navigator.clipboard.writeText(generateSRT()).then(() => showToast('SRT 已复制'));
      });
      document.getElementById('save-html')?.addEventListener('click', downloadHTML);
      document.getElementById('export-webm')?.addEventListener('click', exportWebM);
    }

    function setLoading(show, text) {
      const el = document.getElementById('loading');
      el.style.display = show ? 'flex' : 'none';
      if (text) document.getElementById('loading-text').textContent = text;
    }

    async function doGenerate() {
      const text = document.getElementById('story').value;
      if (text.trim().length < 10) { showToast('故事需要至少 10 个字'); return; }
      setLoading(true, '正在拆解故事…');
      await new Promise(r => setTimeout(r, 600));
      setLoading(true, '正在设计角色…');
      await new Promise(r => setTimeout(r, 600));
      setLoading(true, '正在生成分镜…');
      await new Promise(r => setTimeout(r, 700));
      setLoading(true, '正在合成配音字幕…');
      await new Promise(r => setTimeout(r, 600));
      setLoading(true, '正在生成竖屏成片…');
      await new Promise(r => setTimeout(r, 500));
      if (state.mode === 'ai') {
        setLoading(false);
        state.activeTab = 'script';
        state.project = createLocalProject(text, state.style, state.mode);
        showToast('真实 AI 模式已回退到本地生成（未配置接口或接口调用失败）');
      } else {
        state.project = createLocalProject(text, state.style, state.mode);
      }
      state.activeTab = 'storyboard';
      setLoading(false);
      renderWorkbench();
      bindWorkbenchEvents();
    }

    function init() {
      renderOptions();
      document.getElementById('story').value = '深夜，女主在便利店遇到了三年未见的前男友，他手里拿着她当年送他的伞。';
      document.getElementById('mode-options').addEventListener('click', e => {
        if (e.target.dataset.mode) { state.mode = e.target.dataset.mode; renderOptions(); }
      });
      document.getElementById('style-options').addEventListener('click', e => {
        if (e.target.dataset.style) { state.style = e.target.dataset.style; renderOptions(); }
      });
      document.querySelectorAll('.insp-btn').forEach(btn => {
        btn.addEventListener('click', () => { document.getElementById('story').value = btn.dataset.text; });
      });
      document.getElementById('generate').addEventListener('click', doGenerate);
      document.getElementById('open-ai-settings').addEventListener('click', () => {
        document.getElementById('ai-modal').classList.add('show');
        document.getElementById('ai-base').value = state.aiSettings.baseUrl;
        document.getElementById('ai-model').value = state.aiSettings.model;
        document.getElementById('ai-key').value = state.aiSettings.key;
      });
      document.getElementById('close-ai-modal').addEventListener('click', () => document.getElementById('ai-modal').classList.remove('show'));
      document.getElementById('save-ai-settings').addEventListener('click', () => {
        state.aiSettings.baseUrl = document.getElementById('ai-base').value.trim();
        state.aiSettings.model = document.getElementById('ai-model').value.trim();
        state.aiSettings.key = document.getElementById('ai-key').value.trim();
        document.getElementById('ai-modal').classList.remove('show');
        showToast('接口设置已保存（Key 仅在内存）');
      });
      if (window.speechSynthesis) window.speechSynthesis.onvoiceschanged = () => {};
    }

    init();
  </script>
</body>
</html>
