<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>客户风险画像 - AI智能反洗钱监控系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei",sans-serif;background:#0a1929;color:#fff}
.sidebar{position:fixed;left:0;top:0;width:220px;height:100vh;background:linear-gradient(180deg,#0a192f 0%,#112240 100%);border-right:1px solid rgba(0,240,255,0.1);z-index:100}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;padding:20px;font-size:16px;font-weight:bold;color:#00f0ff;border-bottom:1px solid rgba(255,255,255,0.1)}
.nav-menu{padding:10px 0}
.nav-item{display:block;padding:12px 24px;color:#a0c8e8;text-decoration:none;font-size:14px;transition:all 0.3s;border-left:3px solid transparent}
.nav-item:hover{background:rgba(0,240,255,0.05);color:#00f0ff}
.nav-item.active{color:#00f0ff;background:rgba(0,240,255,0.1);border-left-color:#00f0ff}
.nav-group-title{padding:12px 24px 6px;color:#6688aa;font-size:12px}
.nav-item.sub{padding-left:40px;font-size:13px}
.main-content{margin-left:220px;padding:20px}
.page-title{font-size:20px;color:#fff;padding:12px 20px}
.tech-card{background:rgba(11,26,48,0.85);border:1px solid rgba(0,136,255,0.3);border-radius:8px;margin-bottom:20px}
.search-bar{padding:20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.search-bar label{color:#a0c8e8;font-size:14px}
.search-bar input,.search-bar select{background:#0d1b2a;border:1px solid rgba(0,136,255,0.3);color:#fff;padding:8px 12px;border-radius:4px;font-size:14px;outline:none}
.search-bar input:focus,.search-bar select:focus{border-color:#00f0ff}
.btn{padding:8px 20px;border:none;border-radius:4px;cursor:pointer;font-size:14px;transition:all 0.3s}
.btn-primary{background:#0088ff;color:#fff}.btn-primary:hover{background:#0066dd}
.btn-default{background:#2a3f5f;color:#fff}.btn-default:hover{background:#1a2f4f}
table{width:100%;border-collapse:collapse;font-size:13px}
table th{background:rgba(0,136,255,0.15);color:#00f0ff;padding:12px;text-align:left;border:1px solid rgba(0,136,255,0.3)}
table td{padding:10px 12px;border:1px solid rgba(0,136,255,0.2);color:#fff}
table tr:nth-child(even){background:rgba(0,136,255,0.05)}
table tr:hover{background:rgba(0,136,255,0.12)}
.tag{padding:3px 10px;border-radius:4px;font-size:12px;display:inline-block}
.tag-danger{background:rgba(255,56,100,0.2);color:#ff3864;border:1px solid #ff3864}
.tag-warning{background:rgba(255,204,0,0.2);color:#ffcc00;border:1px solid #ffcc00}
.tag-success{background:rgba(0,240,255,0.2);color:#00f0ff;border:1px solid #00f0ff}
.btn-small{padding:4px 12px;font-size:12px;border:1px solid #0088ff;background:transparent;color:#00f0ff;border-radius:4px;cursor:pointer}
.btn-small:hover{background:rgba(0,136,255,0.2)}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="logo">◆ AI反洗钱监控</div>
  <nav class="nav-menu">
    <a href="dashboard.html" class="nav-item">📊 监控大屏</a>
    <a href="alert_audit.html" class="nav-item">🔔 预警工单复核</a>
    <a href="customer_risk.html" class="nav-item active">👤 客户风险画像</a>
    <a href="rule_config.html" class="nav-item">⚙ 风控规则配置</a>
    <a href="trade_trace.html" class="nav-item">🔗 资金链路溯源</a>
    <div class="nav-group-title">系统管理</div>
    <a href="user_manage.html" class="nav-item sub">账号管理</a>
    <a href="audit_log.html" class="nav-item sub">审计日志</a>
  </nav>
</aside>
<div class="main-content">
  <h2 class="page-title">客户风险画像</h2>
  <div class="tech-card search-bar">
    <label>客户ID:</label><input type="text" id="f_cust" placeholder="请输入客户ID">
    <label>风险等级:</label><select id="f_risk"><option value="">请选择</option><option value="high">高</option><option value="mid">中</option><option value="low">低</option></select>
    <button class="btn btn-primary" onclick="filterData()">查询</button>
    <button class="btn btn-default" onclick="resetSearch()">重置</button>
  </div>
  <div class="tech-card">
    <table>
      <thead><tr><th>客户ID</th><th>客户名称</th><th>风险等级</th><th>注册地址</th><th>经营范围</th><th>创建时间</th><th>操作</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>
<script>
var allData=[
  {cust_id:"110101199001011234",cust_name:"张建国",risk_level:"high",addr:"北京市朝阳区建国路88号",scope:"电子设备销售",time:"2024-01-01 09:30:00"},
  {cust_id:"310101198505056789",cust_name:"李明",risk_level:"mid",addr:"上海市浦东新区陆家嘴环路100号",scope:"国际贸易",time:"2024-01-01 10:15:00"},
  {cust_id:"440301199208084567",cust_name:"王芳",risk_level:"low",addr:"广东省深圳市南山区科技园路",scope:"软件开发",time:"2024-01-01 11:00:00"},
  {cust_id:"320101198812127890",cust_name:"陈志强",risk_level:"high",addr:"江苏省南京市鼓楼区中山路",scope:"金融投资",time:"2024-01-01 14:30:00"},
  {cust_id:"120101199503032345",cust_name:"刘敏",risk_level:"mid",addr:"天津市和平区南京路",scope:"医疗器械销售",time:"2024-01-01 15:45:00"},
  {cust_id:"510101199106065678",cust_name:"赵军",risk_level:"low",addr:"四川省成都市锦江区春熙路",scope:"餐饮服务",time:"2024-01-01 16:20:00"},
  {cust_id:"330101198709098901",cust_name:"孙丽华",risk_level:"mid",addr:"浙江省杭州市西湖区文三路",scope:"电子商务",time:"2024-01-01 22:10:00"},
  {cust_id:"420101199311111234",cust_name:"周伟",risk_level:"high",addr:"湖北省武汉市武昌区东湖路",scope:"跨境贸易",time:"2024-01-01 23:30:00"},
  {cust_id:"350101198904042345",cust_name:"吴刚",risk_level:"low",addr:"福建省福州市鼓楼区东街",scope:"物流运输",time:"2024-01-02 08:00:00"},
  {cust_id:"210101199607073456",cust_name:"郑丽",risk_level:"mid",addr:"辽宁省沈阳市和平区太原街",scope:"教育培训",time:"2024-01-02 09:15:00"}
];
var levelMap={high:{t:"高",c:"tag-danger"},mid:{t:"中",c:"tag-warning"},low:{t:"低",c:"tag-success"}};
function render(list){
  var h="";
  list.forEach(function(r){
    h+='<tr><td>'+r.cust_id+'</td><td>'+r.cust_name+'</td><td><span class="tag '+levelMap[r.risk_level].c+'">'+levelMap[r.risk_level].t+'</span></td><td>'+r.addr+'</td><td>'+r.scope+'</td><td>'+r.time+'</td><td><button class="btn-small" onclick="alert(\'查看详情：'+r.cust_name+'\')">查看详情</button></td></tr>';
  });
  document.getElementById('tbody').innerHTML=h;
}
function filterData(){
  var c=document.getElementById('f_cust').value;var r=document.getElementById('f_risk').value;
  render(allData.filter(function(d){return(!c||d.cust_id.indexOf(c)>=0)&&(!r||d.risk_level===r)}));
}
function resetSearch(){document.getElementById('f_cust').value='';document.getElementById('f_risk').value='';render(allData)}
render(allData);
</script>
</body>
</html>
