<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>风控规则配置 - AI智能反洗钱监控系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei",sans-serif;background:#0a1929;color:#fff}
.sidebar{position:fixed;left:0;top:0;width:220px;height:100vh;background:linear-gradient(180deg,#0a192f 0%,#112240 100%);border-right:1px solid rgba(0,240,255,0.1);z-index:100}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;padding:20px;font-size:16px;font-weight:bold;color:#00f0ff;border-bottom:1px solid rgba(255,255,255,0.1)}
.nav-menu{padding:10px 0}
.nav-item{display:block;padding:12px 24px;color:#a0c8e8;text-decoration:none;font-size:14px;transition:all 0.3s;border-left:3px solid transparent}
.nav-item:hover{background:rgba(0,240,255,0.05);color:#00f0ff}
.nav-item.active{color:#00f0ff;background:rgba(0,240,255,0.1);border-left-color:#00f0ff}
.nav-group-title{padding:12px 24px 6px;color:#6688aa;font-size:12px}
.nav-item.sub{padding-left:40px;font-size:13px}
.main-content{margin-left:220px;padding:20px}
.page-title{font-size:20px;color:#fff;padding:12px 20px}
.tech-card{background:rgba(11,26,48,0.85);border:1px solid rgba(0,136,255,0.3);border-radius:8px;margin-bottom:20px}
.card-header{display:flex;justify-content:space-between;align-items:center;padding:20px 20px 0}
.card-header h3{color:#00f0ff;font-size:18px}
.btn{padding:8px 20px;border:none;border-radius:4px;cursor:pointer;font-size:14px;transition:all 0.3s}
.btn-primary{background:#0088ff;color:#fff}.btn-primary:hover{background:#0066dd}
.btn-danger{background:#ff3864;color:#fff}.btn-danger:hover{background:#cc2a50}
.btn-small{padding:4px 12px;font-size:12px;border:1px solid #0088ff;background:transparent;color:#00f0ff;border-radius:4px;cursor:pointer;margin-right:4px}
.btn-small:hover{background:rgba(0,136,255,0.2)}
.btn-small.danger{border-color:#ff3864;color:#ff3864}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:16px}
table th{background:rgba(0,136,255,0.15);color:#00f0ff;padding:12px;text-align:left;border:1px solid rgba(0,136,255,0.3)}
table td{padding:10px 12px;border:1px solid rgba(0,136,255,0.2);color:#fff}
table tr:nth-child(even){background:rgba(0,136,255,0.05)}
.switch{position:relative;display:inline-block;width:44px;height:22px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#2a3f5f;border-radius:22px;transition:0.3s}
.slider:before{content:"";position:absolute;height:16px;width:16px;left:3px;bottom:3px;background:#888;border-radius:50%;transition:0.3s}
input:checked+.slider{background:rgba(0,136,255,0.5)}
input:checked+.slider:before{transform:translateX(22px);background:#00f0ff}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="logo">◆ AI反洗钱监控</div>
  <nav class="nav-menu">
    <a href="dashboard.html" class="nav-item">📊 监控大屏</a>
    <a href="alert_audit.html" class="nav-item">🔔 预警工单复核</a>
    <a href="customer_risk.html" class="nav-item">👤 客户风险画像</a>
    <a href="rule_config.html" class="nav-item active">⚙ 风控规则配置</a>
    <a href="trade_trace.html" class="nav-item">🔗 资金链路溯源</a>
    <div class="nav-group-title">系统管理</div>
    <a href="user_manage.html" class="nav-item sub">账号管理</a>
    <a href="audit_log.html" class="nav-item sub">审计日志</a>
  </nav>
</aside>
<div class="main-content">
  <h2 class="page-title">风控规则配置</h2>
  <div class="tech-card">
    <div class="card-header">
      <h3>风控规则配置</h3>
      <button class="btn btn-primary" onclick="alert('新增规则（Demo演示）')">+ 新增规则</button>
    </div>
    <table>
      <thead><tr><th>规则名称</th><th>规则描述</th><th>规则表达式</th><th>阈值</th><th>预警等级</th><th>状态</th><th>操作</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>
<script>
var rules=[
  {name:"大额交易监控",desc:"单笔交易金额超过100万",expr:"amount > 1000000",threshold:"1,000,000",level:"high",enable:1},
  {name:"跨境交易监控",desc:"跨境交易次数超过5次/天",expr:"cross > 5",threshold:"5",level:"mid",enable:1},
  {name:"夜间交易监控",desc:"夜间（22:00-06:00）交易占比超过50%",expr:"night > 0.5",threshold:"0.5",level:"mid",enable:1},
  {name:"高频交易监控",desc:"单日交易次数超过10次",expr:"trade_count > 10",threshold:"10",level:"mid",enable:1},
  {name:"分散转入集中转出",desc:"多账户转入同一账户后集中转出",expr:"source_count > 5 && is_concentrated_out == 1",threshold:"5",level:"high",enable:1},
  {name:"可疑资金流向",desc:"资金流向高风险地区账户",expr:"is_risk_area == 1",threshold:"1",level:"high",enable:1},
  {name:"现金交易监控",desc:"单日现金交易超过5万元",expr:'trade_type == "现金" && amount > 50000',threshold:"50,000",level:"mid",enable:1},
  {name:"VIP客户异常交易",desc:"VIP客户交易模式异常变化",expr:"is_vip == 1 && anomaly_score > 80",threshold:"80",level:"high",enable:0}
];
var levelMap={high:'<span style="color:#ff3864">高</span>',mid:'<span style="color:#ffcc00">中</span>',low:'<span style="color:#00f0ff">低</span>'};
function render(){
  var h="";
  rules.forEach(function(r,i){
    h+='<tr><td>'+r.name+'</td><td>'+r.desc+'</td><td><code style="color:#00f0ff">'+r.expr+'</code></td><td>'+r.threshold+'</td><td>'+levelMap[r.level]+'</td><td><label class="switch"><input type="checkbox" '+(r.enable?'checked':'')+' onchange="toggleRule('+i+')"><span class="slider"></span></label></td><td><button class="btn-small" onclick="alert(\'编辑规则：'+r.name+'\')">编辑</button><button class="btn-small danger" onclick="alert(\'删除规则：'+r.name+'\')">删除</button></td></tr>';
  });
  document.getElementById('tbody').innerHTML=h;
}
function toggleRule(i){rules[i].enable=rules[i].enable?0:1;alert('规则「'+rules[i].name+'」已'+(rules[i].enable?'启用':'禁用'))}
render();
</script>
</body>
</html>
