<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>账号管理 - AI智能反洗钱监控系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei",sans-serif;background:#0a1929;color:#fff}
.sidebar{position:fixed;left:0;top:0;width:220px;height:100vh;background:linear-gradient(180deg,#0a192f 0%,#112240 100%);border-right:1px solid rgba(0,240,255,0.1);z-index:100}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;padding:20px;font-size:16px;font-weight:bold;color:#00f0ff;border-bottom:1px solid rgba(255,255,255,0.1)}
.nav-menu{padding:10px 0}
.nav-item{display:block;padding:12px 24px;color:#a0c8e8;text-decoration:none;font-size:14px;transition:all 0.3s;border-left:3px solid transparent}
.nav-item:hover{background:rgba(0,240,255,0.05);color:#00f0ff}
.nav-item.active{color:#00f0ff;background:rgba(0,240,255,0.1);border-left-color:#00f0ff}
.nav-group-title{padding:12px 24px 6px;color:#6688aa;font-size:12px}
.nav-item.sub{padding-left:40px;font-size:13px}
.main-content{margin-left:220px;padding:20px}
.tech-card{background:rgba(11,26,48,0.85);border:1px solid rgba(0,136,255,0.3);border-radius:8px;margin-bottom:16px;padding:16px}
.header-bar{display:flex;justify-content:space-between;align-items:center}
.page-title{color:#00f0ff;font-size:20px;margin:0}
.btn{padding:8px 20px;border:none;border-radius:4px;cursor:pointer;font-size:14px;transition:all 0.3s}
.btn-primary{background:#0088ff;color:#fff}.btn-primary:hover{background:#0066dd}
.btn-warning{background:#ffcc00;color:#000}.btn-warning:hover{background:#ddb000}
.btn-danger{background:#ff3864;color:#fff}.btn-danger:hover{background:#cc2a50}
.btn-small{padding:4px 12px;font-size:12px;border:none;border-radius:4px;cursor:pointer;margin-right:4px}
.btn-small.primary{background:#0088ff;color:#fff}
.btn-small.warning{background:#ffcc00;color:#000}
.btn-small.danger{background:#ff3864;color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
table th{background:rgba(0,136,255,0.15);color:#00f0ff;padding:12px;text-align:left;border:1px solid rgba(0,136,255,0.3)}
table td{padding:10px 12px;border:1px solid rgba(0,136,255,0.2);color:#fff}
table tr:nth-child(even){background:rgba(0,136,255,0.05)}
table tr:hover{background:rgba(0,136,255,0.12)}
.tag{padding:3px 10px;border-radius:4px;font-size:12px;display:inline-block}
.tag-danger{background:rgba(255,56,100,0.2);color:#ff3864;border:1px solid #ff3864}
.tag-warning{background:rgba(255,204,0,0.2);color:#ffcc00;border:1px solid #ffcc00}
.tag-info{background:rgba(160,200,232,0.2);color:#a0c8e8;border:1px solid #a0c8e8}
.switch{position:relative;display:inline-block;width:44px;height:22px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#2a3f5f;border-radius:22px;transition:0.3s}
.slider:before{content:"";position:absolute;height:16px;width:16px;left:3px;bottom:3px;background:#888;border-radius:50%;transition:0.3s}
input:checked+.slider{background:rgba(0,136,255,0.5)}
input:checked+.slider:before{transform:translateX(22px);background:#00f0ff}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:200;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal{background:#0d1b2a;border:1px solid rgba(0,136,255,0.3);border-radius:8px;width:55%;max-width:600px}
.modal-header{padding:16px 20px;border-bottom:1px solid rgba(0,136,255,0.2);font-size:18px;color:#00f0ff}
.modal-body{padding:20px}
.modal-footer{padding:16px 20px;border-top:1px solid rgba(0,136,255,0.2);text-align:right}
.form-group{margin-bottom:16px}
.form-group label{display:block;color:#a0c8e8;margin-bottom:6px;font-size:14px}
.form-group input,.form-group select{width:100%;background:#0a1929;border:1px solid rgba(0,136,255,0.3);color:#fff;padding:8px 12px;border-radius:4px;font-size:14px;outline:none}
.form-group input:focus,.form-group select:focus{border-color:#00f0ff}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="logo">◆ AI反洗钱监控</div>
  <nav class="nav-menu">
    <a href="dashboard.html" class="nav-item">📊 监控大屏</a>
    <a href="alert_audit.html" class="nav-item">🔔 预警工单复核</a>
    <a href="customer_risk.html" class="nav-item">👤 客户风险画像</a>
    <a href="rule_config.html" class="nav-item">⚙ 风控规则配置</a>
    <a href="trade_trace.html" class="nav-item">🔗 资金链路溯源</a>
    <div class="nav-group-title">系统管理</div>
    <a href="user_manage.html" class="nav-item sub active">账号管理</a>
    <a href="audit_log.html" class="nav-item sub">审计日志</a>
  </nav>
</aside>
<div class="main-content">
  <div class="tech-card header-bar">
    <h2 class="page-title">系统账号权限管理</h2>
    <button class="btn btn-primary" onclick="openAdd()">+ 新增管理员账号</button>
  </div>
  <div class="tech-card">
    <table>
      <thead><tr><th>ID</th><th>登录账号</th><th>真实姓名</th><th>角色权限</th><th>账号状态</th><th>创建时间</th><th>操作</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header" id="modalTitle">新增系统账号</div>
    <div class="modal-body">
      <div id="addFields">
        <div class="form-group"><label>登录账号</label><input type="text" id="f_username" placeholder="仅支持字母数字"></div>
        <div class="form-group"><label>登录密码</label><input type="password" id="f_password" placeholder="初始密码123456"></div>
      </div>
      <div class="form-group"><label>真实姓名</label><input type="text" id="f_realname"></div>
      <div class="form-group"><label>角色权限</label><select id="f_role"><option value="admin">超级管理员 admin</option><option value="audit">审计员 audit</option><option value="risk" selected>风控专员 risk</option></select></div>
      <div class="form-group"><label>账号启用状态</label><label class="switch"><input type="checkbox" id="f_active" checked><span class="slider"></span></label></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" style="background:#2a3f5f;color:#fff" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveUser()">保存</button>
    </div>
  </div>
</div>
<script>
var users=[
  {id:1,username:"admin",real_name:"系统管理员",role:"admin",is_active:1,time:"2024-01-01 08:00:00"},
  {id:2,username:"audit01",real_name:"审计员张三",role:"audit",is_active:1,time:"2024-01-01 08:30:00"},
  {id:3,username:"risk01",real_name:"风控专员李四",role:"risk",is_active:1,time:"2024-01-01 09:00:00"},
  {id:4,username:"risk02",real_name:"风控专员王五",role:"risk",is_active:1,time:"2024-01-01 09:30:00"},
  {id:5,username:"audit02",real_name:"审计员赵六",role:"audit",is_active:0,time:"2024-01-01 10:00:00"}
];
var roleMap={admin:{t:"超级管理员",c:"tag-danger"},audit:{t:"审计员",c:"tag-warning"},risk:{t:"风控专员",c:"tag-info"}};
var editId=null;
function render(){
  var h="";
  users.forEach(function(u){
    h+='<tr><td>'+u.id+'</td><td>'+u.username+'</td><td>'+u.real_name+'</td><td><span class="tag '+roleMap[u.role].c+'">'+roleMap[u.role].t+'</span></td><td><label class="switch"><input type="checkbox" '+(u.is_active?'checked':'')+' onchange="toggleStatus('+u.id+')"><span class="slider"></span></label></td><td>'+u.time+'</td><td><button class="btn-small primary" onclick="openEdit('+u.id+')">编辑</button><button class="btn-small warning" onclick="alert(\'已重置'+u.username+'密码为123456\')">重置密码</button><button class="btn-small danger" onclick="delUser('+u.id+')">删除</button></td></tr>';
  });
  document.getElementById('tbody').innerHTML=h;
}
function toggleStatus(id){var u=users.find(function(x){return x.id===id});u.is_active=u.is_active?0:1;alert('账号'+u.username+'已'+(u.is_active?'启用':'禁用'))}
function openAdd(){editId=null;document.getElementById('modalTitle').textContent='新增系统账号';document.getElementById('addFields').style.display='';document.getElementById('f_username').value='';document.getElementById('f_password').value='';document.getElementById('f_realname').value='';document.getElementById('f_role').value='risk';document.getElementById('f_active').checked=true;document.getElementById('modal').classList.add('show')}
function openEdit(id){editId=id;var u=users.find(function(x){return x.id===id});document.getElementById('modalTitle').textContent='编辑账号';document.getElementById('addFields').style.display='none';document.getElementById('f_realname').value=u.real_name;document.getElementById('f_role').value=u.role;document.getElementById('f_active').checked=u.is_active;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function saveUser(){
  if(editId){var u=users.find(function(x){return x.id===editId});u.real_name=document.getElementById('f_realname').value;u.role=document.getElementById('f_role').value;u.is_active=document.getElementById('f_active').checked?1:0;alert('账号已更新')}
  else{var id=users.length+1;users.push({id:id,username:document.getElementById('f_username').value,real_name:document.getElementById('f_realname').value,role:document.getElementById('f_role').value,is_active:document.getElementById('f_active').checked?1:0,time:'2026-07-06 15:30:00'});alert('账号已新增')}
  closeModal();render();
}
function delUser(id){if(confirm('确认删除此账号？')){users=users.filter(function(x){return x.id!==id});render();alert('已删除')}}
render();
</script>
</body>
</html>
