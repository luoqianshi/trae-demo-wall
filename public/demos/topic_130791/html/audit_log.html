<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>审计日志 - AI智能反洗钱监控系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei",sans-serif;background:#0a1929;color:#fff}
.sidebar{position:fixed;left:0;top:0;width:220px;height:100vh;background:linear-gradient(180deg,#0a192f 0%,#112240 100%);border-right:1px solid rgba(0,240,255,0.1);z-index:100}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;padding:20px;font-size:16px;font-weight:bold;color:#00f0ff;border-bottom:1px solid rgba(255,255,255,0.1)}
.nav-menu{padding:10px 0}
.nav-item{display:block;padding:12px 24px;color:#a0c8e8;text-decoration:none;font-size:14px;transition:all 0.3s;border-left:3px solid transparent}
.nav-item:hover{background:rgba(0,240,255,0.05);color:#00f0ff}
.nav-item.active{color:#00f0ff;background:rgba(0,240,255,0.1);border-left-color:#00f0ff}
.nav-group-title{padding:12px 24px 6px;color:#6688aa;font-size:12px}
.nav-item.sub{padding-left:40px;font-size:13px}
.main-content{margin-left:220px;padding:20px}
.tech-card{background:rgba(11,26,48,0.85);border:1px solid rgba(0,136,255,0.3);border-radius:8px;margin-bottom:16px;padding:16px}
.page-title{color:#00f0ff;font-size:20px;margin:0 0 16px}
.search-form{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.search-form input{background:#0d1b2a;border:1px solid rgba(0,136,255,0.3);color:#fff;padding:8px 12px;border-radius:4px;font-size:14px;outline:none}
.search-form input:focus{border-color:#00f0ff}
.search-form input[type="date"]{width:150px}
.btn{padding:8px 20px;border:none;border-radius:4px;cursor:pointer;font-size:14px;transition:all 0.3s}
.btn-primary{background:#0088ff;color:#fff}.btn-primary:hover{background:#0066dd}
.btn-success{background:#00f0ff;color:#000}.btn-success:hover{background:#00c0cc}
.btn-default{background:#2a3f5f;color:#fff}.btn-default:hover{background:#1a2f4f}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
table th{background:rgba(0,136,255,0.15);color:#00f0ff;padding:12px;text-align:left;border:1px solid rgba(0,136,255,0.3)}
table td{padding:10px 12px;border:1px solid rgba(0,136,255,0.2);color:#fff}
table tr:nth-child(even){background:rgba(0,136,255,0.05)}
table tr:hover{background:rgba(0,136,255,0.12)}
.pagination{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:16px}
.pagination span{color:#a0c8e8;font-size:14px}
.pagination a{padding:6px 12px;border:1px solid rgba(0,136,255,0.3);color:#a0c8e8;text-decoration:none;border-radius:4px;font-size:13px}
.pagination a:hover{background:rgba(0,136,255,0.15)}
.pagination a.active{background:#0088ff;color:#fff}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="logo">◆ AI反洗钱监控</div>
  <nav class="nav-menu">
    <a href="dashboard.html" class="nav-item">📊 监控大屏</a>
    <a href="alert_audit.html" class="nav-item">🔔 预警工单复核</a>
    <a href="customer_risk.html" class="nav-item">👤 客户风险画像</a>
    <a href="rule_config.html" class="nav-item">⚙ 风控规则配置</a>
    <a href="trade_trace.html" class="nav-item">🔗 资金链路溯源</a>
    <div class="nav-group-title">系统管理</div>
    <a href="user_manage.html" class="nav-item sub">账号管理</a>
    <a href="audit_log.html" class="nav-item sub active">审计日志</a>
  </nav>
</aside>
<div class="main-content">
  <div class="tech-card">
    <h2 class="page-title">系统操作审计日志</h2>
    <div class="search-form">
      <input type="text" id="f_user" placeholder="操作账号" style="width:200px">
      <input type="text" id="f_type" placeholder="操作类型" style="width:220px">
      <input type="date" id="f_start">
      <span style="color:#6688aa">至</span>
      <input type="date" id="f_end">
      <button class="btn btn-primary" onclick="filterData()">查询日志</button>
      <button class="btn btn-success" onclick="alert('导出审计日志（Demo演示）')">导出审计日志</button>
      <button class="btn btn-default" onclick="resetSearch()">重置条件</button>
    </div>
  </div>
  <div class="tech-card">
    <table>
      <thead><tr><th width="80">日志ID</th><th width="120">操作账号</th><th width="160">操作类型</th><th>操作详情</th><th width="140">客户端IP</th><th width="160">操作时间</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="pagination">
      <span id="total">共 10 条</span>
      <a href="#" class="active">1</a><a href="#">2</a><a href="#">下一页</a>
    </div>
  </div>
</div>
<script>
var allData=[
  {id:1,username:"admin",type:"登录系统",content:"用户admin登录系统",ip:"192.168.1.100",time:"2026-07-06 08:30:00"},
  {id:2,username:"admin",type:"新增系统账号",content:"新增账号：audit01",ip:"192.168.1.100",time:"2026-07-06 08:35:00"},
  {id:3,username:"admin",type:"新增系统账号",content:"新增账号：risk01",ip:"192.168.1.100",time:"2026-07-06 08:40:00"},
  {id:4,username:"risk01",type:"查询预警工单",content:"查询客户310101198505056789的预警工单",ip:"192.168.1.101",time:"2026-07-06 09:15:00"},
  {id:5,username:"risk01",type:"处置工单",content:"处理预警工单AML202607060002，状态改为处理中",ip:"192.168.1.101",time:"2026-07-06 09:30:00"},
  {id:6,username:"audit01",type:"查询审计日志",content:"查询2026-07-06的审计日志",ip:"192.168.1.102",time:"2026-07-06 10:00:00"},
  {id:7,username:"admin",type:"账号状态变更",content:"账号audit02状态改为禁用",ip:"192.168.1.100",time:"2026-07-06 10:30:00"},
  {id:8,username:"risk02",type:"查询风险客户",content:"查询高风险客户列表",ip:"192.168.1.103",time:"2026-07-06 11:00:00"},
  {id:9,username:"admin",type:"重置密码",content:"重置risk02密码为123456",ip:"192.168.1.100",time:"2026-07-06 11:30:00"},
  {id:10,username:"risk01",type:"上报人行",content:"预警工单AML202607060001已上报人行反洗钱中心",ip:"192.168.1.101",time:"2026-07-06 14:00:00"}
];
function render(list){
  var h="";
  list.forEach(function(r){
    h+='<tr><td>'+r.id+'</td><td>'+r.username+'</td><td>'+r.type+'</td><td>'+r.content+'</td><td>'+r.ip+'</td><td>'+r.time+'</td></tr>';
  });
  document.getElementById('tbody').innerHTML=h;
  document.getElementById('total').textContent='共 '+list.length+' 条';
}
function filterData(){
  var u=document.getElementById('f_user').value;
  var t=document.getElementById('f_type').value;
  render(allData.filter(function(d){
    return(!u||d.username.indexOf(u)>=0)&&(!t||d.type.indexOf(t)>=0);
  }));
}
function resetSearch(){
  document.getElementById('f_user').value='';
  document.getElementById('f_type').value='';
  document.getElementById('f_start').value='';
  document.getElementById('f_end').value='';
  render(allData);
}
render(allData);
</script>
</body>
</html>
