.search-bar input:focus{border-color:#00f0ff}
.btn{padding:8px 20px;border:none;border-radius:4px;cursor:pointer;font-size:14px;transition:all 0.3s}
.btn-primary{background:#0088ff;color:#fff}.btn-primary:hover{background:#0066dd}
h3{color:#00f0ff;font-size:18px;margin-bottom:16px;border-left:4px solid #0088ff;padding-left:10px}
.graph-container{width:100%;height:550px;background:rgba(0,0,0,0.2);border-radius:8px;position:relative;overflow:hidden}
