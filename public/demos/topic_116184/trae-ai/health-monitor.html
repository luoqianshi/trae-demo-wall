<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人身体状况监控系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .category-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .category-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .category-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-right: 15px;
        }

        .category-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
        }

        .metric-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f5f5f5;
        }

        .metric-item:last-child {
            border-bottom: none;
        }

        .metric-name {
            font-weight: 500;
            color: #555;
        }

        .metric-value {
            font-weight: bold;
            font-size: 1.1em;
        }

        .metric-value.normal {
            color: #28a745;
        }

        .metric-value.warning {
            color: #ffc107;
            animation: pulse 2s infinite;
        }

        .metric-value.danger {
            color: #dc3545;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .metric-range {
            font-size: 0.85em;
            color: #888;
            margin-left: 10px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .btn-health {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-doctor {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .alert-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
            margin-left: 10px;
        }

        .alert-badge.warning {
            background: #fff3cd;
            color: #856404;
        }

        .alert-badge.danger {
            background: #f8d7da;
            color: #721c24;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .modal-title {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 2em;
            cursor: pointer;
            color: #999;
            transition: color 0.3s ease;
        }

        .close-btn:hover {
            color: #333;
        }

        /* Chat Styles */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 500px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 80%;
            word-wrap: break-word;
        }

        .message.user {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 5px;
        }

        .message.doctor {
            background: white;
            color: #333;
            margin-right: auto;
            border-bottom-left-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .message-time {
            font-size: 0.75em;
            opacity: 0.7;
            margin-top: 5px;
        }

        .chat-input-area {
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        .chat-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .send-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.3s ease;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }

        /* Health Advice Styles */
        .health-advice {
            line-height: 1.8;
        }

        .health-advice h3 {
            color: #667eea;
            margin-bottom: 15px;
            margin-top: 20px;
        }

        .health-advice ul {
            margin-left: 20px;
            margin-bottom: 15px;
        }

        .health-advice li {
            margin-bottom: 8px;
        }

        .health-advice .tip {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            margin: 15px 0;
        }

        .status-summary {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .status-summary h2 {
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }

        .status-summary h2::before {
            content: "📊";
            margin-right: 10px;
        }

        .summary-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .stat-item {
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            background: #f8f9fa;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
        }

        .stat-item.normal .stat-number {
            color: #28a745;
        }

        .stat-item.warning .stat-number {
            color: #ffc107;
        }

        .stat-item.danger .stat-number {
            color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏥 个人身体状况监控系统</h1>
            <p>实时监控您的健康指标，及时获取专业建议</p>
        </header>

        <div class="status-summary">
            <h2>今日健康状态概览</h2>
            <div class="summary-stats">
                <div class="stat-item normal">
                    <div class="stat-number">12</div>
                    <div class="stat-label">正常指标</div>
                </div>
                <div class="stat-item warning">
                    <div class="stat-number">3</div>
                    <div class="stat-label">预警指标</div>
                </div>
                <div class="stat-item danger">
                    <div class="stat-number">2</div>
                    <div class="stat-label">危险指标</div>
                </div>
            </div>
        </div>

        <div class="dashboard" id="healthDashboard">
            <!-- 指标卡片将通过JavaScript动态生成 -->
        </div>
    </div>

    <!-- 健康建议弹窗 -->
    <div class="modal" id="healthAdviceModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="adviceTitle">健康建议</h3>
                <button class="close-btn" onclick="closeModal('healthAdviceModal')">&times;</button>
            </div>
            <div class="health-advice" id="healthAdviceContent">
                <!-- 健康建议内容将通过JavaScript动态生成 -->
            </div>
        </div>
    </div>

    <!-- 医生对话弹窗 -->
    <div class="modal" id="doctorChatModal">
        <div class="modal-content" style="max-width: 700px;">
            <div class="modal-header">
                <h3 class="modal-title">👨‍⚕️ 在线医生咨询</h3>
                <button class="close-btn" onclick="closeModal('doctorChatModal')">&times;</button>
            </div>
            <div class="chat-container">
                <div class="chat-messages" id="chatMessages">
                    <div class="message doctor">
                        <div>您好！我是您的在线健康顾问。请问您有什么健康问题需要咨询？</div>
                        <div class="message-time">刚刚</div>
                    </div>
                </div>
                <div class="chat-input-area">
                    <input type="text" class="chat-input" id="chatInput" placeholder="输入您的问题..." onkeypress="handleKeyPress(event)">
                    <button class="send-btn" onclick="sendMessage()">发送</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 健康指标数据
        const healthData = {
            cardiovascular: {
                title: "心血管系统",
                icon: "❤️",
                color: "#e74c3c",
                metrics: [
                    { name: "收缩压", value: "142", unit: "mmHg", normalRange: "90-120", status: "danger" },
                    { name: "舒张压", value: "92", unit: "mmHg", normalRange: "60-80", status: "warning" },
                    { name: "静息心率", value: "78", unit: "bpm", normalRange: "60-100", status: "normal" },
                    { name: "血氧饱和度", value: "97", unit: "%", normalRange: "95-100", status: "normal" }
                ]
            },
            blood: {
                title: "血液指标",
                icon: "🩸",
                color: "#c0392b",
                metrics: [
                    { name: "空腹血糖", value: "7.2", unit: "mmol/L", normalRange: "3.9-6.1", status: "danger" },
                    { name: "总胆固醇", value: "5.8", unit: "mmol/L", normalRange: "<5.2", status: "warning" },
                    { name: "甘油三酯", value: "1.8", unit: "mmol/L", normalRange: "<1.7", status: "warning" },
                    { name: "血红蛋白", value: "145", unit: "g/L", normalRange: "120-160", status: "normal" }
                ]
            },
            metabolic: {
                title: "代谢指标",
                icon: "⚡",
                color: "#f39c12",
                metrics: [
                    { name: "BMI", value: "27.5", unit: "", normalRange: "18.5-24", status: "warning" },
                    { name: "体脂率", value: "28", unit: "%", normalRange: "15-25", status: "warning" },
                    { name: "基础代谢率", value: "1650", unit: "kcal/day", normalRange: "1400-1800", status: "normal" },
                    { name: "腰臀比", value: "0.92", unit: "", normalRange: "<0.9", status: "warning" }
                ]
            },
            organ: {
                title: "器官功能",
                icon: "🫀",
                color: "#9b59b6",
                metrics: [
                    { name: "肝功能ALT", value: "45", unit: "U/L", normalRange: "9-50", status: "normal" },
                    { name: "肾功能肌酐", value: "88", unit: "μmol/L", normalRange: "44-133", status: "normal" },
                    { name: "甲状腺功能", value: "正常", unit: "", normalRange: "正常", status: "normal" },
                    { name: "尿常规", value: "正常", unit: "", normalRange: "正常", status: "normal" }
                ]
            },
            lifestyle: {
                title: "生活方式",
                icon: "🏃",
                color: "#27ae60",
                metrics: [
                    { name: "每日步数", value: "6542", unit: "步", normalRange: ">8000", status: "warning" },
                    { name: "睡眠时长", value: "6.5", unit: "小时", normalRange: "7-9", status: "warning" },
                    { name: "睡眠质量", value: "良好", unit: "", normalRange: "良好", status: "normal" },
                    { name: "压力指数", value: "中等", unit: "", normalRange: "低-中等", status: "normal" }
                ]
            },
            nutrition: {
                title: "营养状况",
                icon: "🥗",
                color: "#16a085",
                metrics: [
                    { name: "蛋白质摄入", value: "充足", unit: "", normalRange: "充足", status: "normal" },
                    { name: "维生素D", value: "不足", unit: "", normalRange: "充足", status: "warning" },
                    { name: "钙摄入", value: "正常", unit: "", normalRange: "正常", status: "normal" },
                    { name: "水分摄入", value: "1.8", unit: "L", normalRange: "2-2.5", status: "warning" }
                ]
            }
        };

        // 健康建议数据库
        const healthAdviceDB = {
            "收缩压": {
                title: "高血压管理建议",
                content: `
                    <h3>🚨 紧急注意事项</h3>
                    <div class="tip">您的收缩压明显偏高，建议立即咨询医生进行专业评估。</div>
                    
                    <h3>📋 日常生活建议</h3>
                    <ul>
                        <li><strong>饮食控制：</strong>减少钠盐摄入，每日食盐量控制在6g以下</li>
                        <li><strong>体重管理：</strong>每减轻10kg体重，收缩压可降低5-20mmHg</li>
                        <li><strong>规律运动：</strong>每周至少150分钟中等强度有氧运动</li>
                        <li><strong>限制饮酒：</strong>男性每日酒精摄入不超过25g，女性不超过15g</li>
                        <li><strong>戒烟：</strong>吸烟会显著升高血压并降低药物疗效</li>
                    </ul>
                    
                    <h3>💊 药物治疗提醒</h3>
                    <ul>
                        <li>如已确诊高血压，请按时服药，不可擅自停药</li>
                        <li>定期监测血压，记录血压变化</li>
                        <li>注意药物副作用，及时与医生沟通</li>
                    </ul>
                    
                    <h3>⚠️ 需立即就医的情况</h3>
                    <ul>
                        <li>收缩压持续超过180mmHg</li>
                        <li>伴有剧烈头痛、视力模糊、胸痛等症状</li>
                        <li>出现呼吸困难、意识模糊等情况</li>
                    </ul>
                `
            },
            "空腹血糖": {
                title: "高血糖管理建议",
                content: `
                    <h3>🚨 血糖异常警示</h3>
                    <div class="tip">您的空腹血糖超过正常范围，可能存在糖尿病风险，建议尽快进行糖耐量检查。</div>
                    
                    <h3>🍎 饮食管理</h3>
                    <ul>
                        <li><strong>控制碳水化合物：</strong>选择低GI食物，如全谷物、豆类</li>
                        <li><strong>增加膳食纤维：</strong>每日摄入25-30g膳食纤维</li>
                        <li><strong>规律进餐：</strong>定时定量，避免暴饮暴食</li>
                        <li><strong>限制糖分：</strong>避免含糖饮料和甜食</li>
                    </ul>
                    
                    <h3>🏃 运动指导</h3>
                    <ul>
                        <li>每周至少150分钟中等强度有氧运动</li>
                        <li>运动前后监测血糖，避免低血糖</li>
                        <li>建议餐后1-2小时进行运动</li>
                    </ul>
                    
                    <h3>📊 监测建议</h3>
                    <ul>
                        <li>定期检测空腹血糖和餐后2小时血糖</li>
                        <li>每3-6个月检测糖化血红蛋白</li>
                        <li>记录血糖值，寻找血糖波动规律</li>
                    </ul>
                `
            },
            "BMI": {
                title: "体重管理建议",
                content: `
                    <h3>⚖️ 体重状况分析</h3>
                    <div class="tip">您的BMI为27.5，属于超重范围。适当减重可显著改善整体健康状况。</div>
                    
                    <h3>🎯 减重目标</h3>
                    <ul>
                        <li>初期目标：3-6个月内减轻体重的5-10%</li>
                        <li>长期目标：BMI控制在18.5-24范围内</li>
                        <li>每周减重0.5-1kg为宜，不宜过快</li>
                    </ul>
                    
                    <h3>🥗 饮食调整</h3>
                    <ul>
                        <li>控制每日热量摄入，建议减少300-500大卡</li>
                        <li>增加蛋白质摄入比例，维持肌肉量</li>
                        <li>多吃蔬菜水果，减少高热量食物</li>
                        <li>规律三餐，避免夜宵和暴饮暴食</li>
                    </ul>
                    
                    <h3>🏃 运动计划</h3>
                    <ul>
                        <li>每周至少5天中等强度有氧运动</li>
                        <li>每周2-3次力量训练，增加肌肉量</li>
                        <li>增加日常活动量，多走路少坐车</li>
                    </ul>
                `
            }
        };

        // 默认健康建议
        const defaultAdvice = {
            title: "健康改善建议",
            content: `
                <h3>📋 综合健康建议</h3>
                <div class="tip">基于您的检查结果，我们为您提供以下综合健康建议：</div>
                
                <h3>🏥 定期检查</h3>
                <ul>
                    <li>建议每3-6个月进行一次全面体检</li>
                    <li>关注异常指标的变化趋势</li>
                    <li>根据医生建议调整检查频率</li>
                </ul>
                
                <h3>🌟 生活方式优化</h3>
                <ul>
                    <li>保持规律的作息时间，确保充足睡眠</li>
                    <li>坚持适量运动，每周至少150分钟</li>
                    <li>保持健康的饮食习惯，营养均衡</li>
                    <li>学会管理压力，保持心理健康</li>
                </ul>
                
                <h3>⚠️ 注意事项</h3>
                <ul>
                    <li>如有任何不适症状，及时就医</li>
                    <li>不要擅自服用药物或保健品</li>
                    <li>保持与医生的定期沟通</li>
                </ul>
            `
        };

        // 初始化页面
        function initDashboard() {
            const dashboard = document.getElementById('healthDashboard');
            
            for (const [categoryKey, category] of Object.entries(healthData)) {
                const card = createCategoryCard(categoryKey, category);
                dashboard.appendChild(card);
            }
        }

        // 创建指标卡片
        function createCategoryCard(categoryKey, category) {
            const card = document.createElement('div');
            card.className = 'category-card';
            
            const hasWarning = category.metrics.some(m => m.status === 'warning' || m.status === 'danger');
            
            let metricsHTML = '';
            category.metrics.forEach(metric => {
                const alertBadge = (metric.status === 'warning' || metric.status === 'danger') 
                    ? `<span class="alert-badge ${metric.status}">${metric.status === 'warning' ? '⚠️ 预警' : '🚨 危险'}</span>` 
                    : '';
                
                const actionButtons = (metric.status === 'warning' || metric.status === 'danger')
                    ? `<div class="action-buttons">
                        <button class="btn btn-health" onclick="showHealthAdvice('${metric.name}')">💡 健康建议</button>
                        <button class="btn btn-doctor" onclick="showDoctorChat('${metric.name}')">👨‍⚕️ 医生解答</button>
                       </div>`
                    : '';
                
                metricsHTML += `
                    <div class="metric-item">
                        <div>
                            <span class="metric-name">${metric.name}</span>
                            ${alertBadge}
                        </div>
                        <div>
                            <span class="metric-value ${metric.status}">${metric.value} ${metric.unit}</span>
                            <span class="metric-range">(正常: ${metric.normalRange})</span>
                        </div>
                    </div>
                    ${actionButtons}
                `;
            });
            
            card.innerHTML = `
                <div class="category-header">
                    <div class="category-icon" style="background: ${category.color}20; color: ${category.color}">
                        ${category.icon}
                    </div>
                    <div class="category-title">${category.title}</div>
                </div>
                ${metricsHTML}
            `;
            
            return card;
        }

        // 显示健康建议
        function showHealthAdvice(metricName) {
            const modal = document.getElementById('healthAdviceModal');
            const title = document.getElementById('adviceTitle');
            const content = document.getElementById('healthAdviceContent');
            
            const advice = healthAdviceDB[metricName] || defaultAdvice;
            title.textContent = advice.title;
            content.innerHTML = advice.content;
            
            modal.classList.add('active');
        }

        // 显示医生对话
        function showDoctorChat(metricName) {
            const modal = document.getElementById('doctorChatModal');
            const chatMessages = document.getElementById('chatMessages');
            
            // 清空之前的对话，添加新的问候语
            chatMessages.innerHTML = `
                <div class="message doctor">
                    <div>您好！我注意到您的${metricName}指标异常。请问您想了解哪方面的信息？我可以为您提供专业的健康建议。</div>
                    <div class="message-time">刚刚</div>
                </div>
            `;
            
            modal.classList.add('active');
            
            // 聚焦输入框
            setTimeout(() => {
                document.getElementById('chatInput').focus();
            }, 100);
        }

        // 关闭弹窗
        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        // 发送消息
        function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            const chatMessages = document.getElementById('chatMessages');
            
            // 添加用户消息
            const userMessage = document.createElement('div');
            userMessage.className = 'message user';
            userMessage.innerHTML = `
                <div>${escapeHtml(message)}</div>
                <div class="message-time">刚刚</div>
            `;
            chatMessages.appendChild(userMessage);
            
            // 清空输入框
            input.value = '';
            
            // 模拟医生回复
            setTimeout(() => {
                const doctorResponse = generateDoctorResponse(message);
                const doctorMessage = document.createElement('div');
                doctorMessage.className = 'message doctor';
                doctorMessage.innerHTML = `
                    <div>${doctorResponse}</div>
                    <div class="message-time">刚刚</div>
                `;
                chatMessages.appendChild(doctorMessage);
                
                // 滚动到底部
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 1000);
            
            // 滚动到底部
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // 生成医生回复
        function generateDoctorResponse(userMessage) {
            const responses = [
                "感谢您的咨询。根据您描述的情况，我建议您首先注意休息，保持良好的作息时间。如果症状持续或加重，请及时到医院进行详细检查。",
                "这是一个很好的问题。从医学角度来看，您提到的症状可能与多种因素有关。建议您记录症状出现的时间、持续时间和诱因，这样有助于我们更好地判断。",
                "我理解您的担心。基于您的情况，我建议您可以先尝试一些生活方式的调整，比如合理饮食、适量运动。如果一周后症状没有改善，建议您咨询专科医生。",
                "您的症状需要引起重视。建议您监测相关指标的变化，并注意观察是否有其他伴随症状。如有必要，我们可以为您安排进一步的检查。",
                "从预防保健的角度来看，建议您定期进行体检，保持健康的生活方式。早期发现和干预往往能取得更好的治疗效果。"
            ];
            
            // 根据用户消息的关键词返回更相关的回复
            if (userMessage.includes("血压") || userMessage.includes("高血压")) {
                return "关于血压问题，建议您每天早晚各测量一次血压并记录。饮食上要减少盐的摄入，保持心情平和。如果血压持续偏高，建议您到心内科就诊，医生会根据具体情况制定合适的治疗方案。";
            } else if (userMessage.includes("血糖") || userMessage.includes("糖尿病")) {
                return "血糖控制需要综合管理。建议您严格控制饮食，避免高糖食物，规律运动。同时要定期监测血糖，包括空腹血糖和餐后血糖。如果血糖控制不理想，可能需要在医生指导下使用降糖药物。";
            } else if (userMessage.includes("体重") || userMessage.includes("减肥")) {
                return "健康减重需要循序渐进。建议您制定合理的减重计划，每周减重0.5-1公斤为宜。结合饮食控制和适量运动，不要盲目节食。如有需要，可以咨询营养师制定个性化的饮食方案。";
            } else if (userMessage.includes("运动") || userMessage.includes("锻炼")) {
                return "适量运动对健康非常重要。建议您每周进行至少150分钟的中等强度有氧运动，如快走、游泳等。运动要循序渐进，避免剧烈运动。如果有慢性疾病，建议在医生指导下制定运动计划。";
            }
            
            return responses[Math.floor(Math.random() * responses.length)];
        }

        // 处理回车键发送
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 点击弹窗外部关闭
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.classList.remove('active');
            }
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initDashboard);
    </script>
</body>
</html>
