server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: health-monitor-backend
  # 数据源配置（环境变量注入，禁止硬编码）
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/health_monitor?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
  # 文件上传限制
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.health.module.*.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 业务自定义配置（禁止硬编码在代码中）
app:
  # JWT 配置
  jwt:
    secret: ${JWT_SECRET:ZmQ0ZGI5NjQ0MDQwY2I4MjMxY2Y3ZTE3N2I4MjU4NzU2MzI2NDIyNjJmMzI0NDY}
    # Token 有效期（小时）
    expiration: 24
    header: Authorization
    prefix: "Bearer "
  # 文件存储路径
  upload:
    path: ${UPLOAD_PATH:./uploads}
    allowed-types: image/jpeg,image/png,image/gif,image/webp
    max-size: 10485760
  # 验证码配置
  sms:
    code-length: 6
    expire-minutes: 5
    # 发送频率限制（秒）
    send-interval: 60

logging:
  level:
    com.health: debug
    org.springframework.security: info
