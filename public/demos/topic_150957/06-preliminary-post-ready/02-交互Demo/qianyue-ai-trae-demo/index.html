<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:,">
  <title>迁跃 AI｜跨行业经验迁移智能体</title>
  <style>
    :root {
      --bg: #f7f6f3;
      --surface: #ffffff;
      --surface-soft: #f2f5f4;
      --surface-teal: #eef8f5;
      --surface-warm: #fff9ec;
      --ink: #0b3047;
      --text: #304b5b;
      --muted: #72838d;
      --line: #d8d5cd;
      --line-cool: #d6e0df;
      --teal: #1f8f94;
      --teal-dark: #176f74;
      --amber: #b97718;
      --amber-dark: #8d5810;
      --danger: #a84435;
      --radius: 12px;
      --shadow: 0 14px 36px rgba(11, 48, 71, 0.08);
      --workspace: 1400px;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { width: 100%; height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      color: var(--text);
      background: var(--bg);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }

    button { color: inherit; }

    [hidden] { display: none !important; }

    .app {
      height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
    }

    .product-header {
      position: relative;
      z-index: 10;
      border-bottom: 1px solid var(--line);
      background: rgba(247, 246, 243, 0.98);
    }

    .header-inner {
      width: min(calc(100% - 48px), var(--workspace));
      min-height: 96px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(360px, 0.9fr) minmax(620px, 1.1fr);
      align-items: center;
      gap: 48px;
      padding: 10px 0;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand {
      color: var(--ink);
      font-size: clamp(28px, 2.35vw, 36px);
      font-weight: 820;
      line-height: 1;
      letter-spacing: -0.045em;
      white-space: nowrap;
    }

    .brand em { color: var(--teal); font-style: normal; }

    .product-badge {
      padding: 7px 10px;
      border: 1px solid var(--line-cool);
      border-radius: 7px;
      color: var(--ink);
      background: var(--surface);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .tagline {
      margin: 5px 0 0;
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.35;
    }

    .runtime-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 5px;
    }

    .runtime-tag {
      padding: 2px 8px;
      border: 1px solid var(--line-cool);
      border-radius: 999px;
      color: var(--muted);
      background: var(--surface);
      font-size: 11px;
    }

    .macro-progress {
      display: grid;
      grid-template-columns: 1fr 28px 1fr 28px 1fr;
      align-items: center;
      gap: 8px;
      min-width: 0;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .macro-step {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr);
      align-items: center;
      gap: 9px;
      min-width: 0;
      color: #8a989f;
    }

    .macro-index {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 1px solid #c7c5be;
      border-radius: 50%;
      color: #61727d;
      background: var(--surface);
      font-weight: 780;
    }

    .macro-copy { min-width: 0; }

    .macro-copy strong,
    .macro-copy span { display: block; }

    .macro-copy strong {
      color: inherit;
      font-size: 14px;
      white-space: nowrap;
    }

    .macro-copy span { font-size: 11px; }

    .macro-line {
      height: 1px;
      background: #cbc8c0;
    }

    .macro-step.active { color: var(--ink); }
    .macro-step.active .macro-index { color: #fff; border-color: var(--ink); background: var(--ink); box-shadow: 0 7px 16px rgba(11, 48, 71, 0.18); }
    .macro-step.done { color: var(--teal-dark); }
    .macro-step.done .macro-index { color: #fff; border-color: var(--teal); background: var(--teal); }
    .macro-line.done { background: var(--teal); }

    .app-main {
      min-height: 0;
      padding: 14px 24px 16px;
      overflow: hidden;
    }

    .stage-shell {
      width: min(100%, var(--workspace));
      height: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) 70px 28px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .case-context {
      grid-row: 1;
      min-height: 50px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 14px;
      padding: 8px 18px;
      border-bottom: 1px solid var(--line-cool);
      background: var(--surface-soft);
    }

    .context-avatar {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: var(--ink);
      font-weight: 750;
    }

    .context-persona { min-width: 0; }

    .context-persona strong,
    .context-persona span { display: block; }

    .context-persona strong { color: var(--ink); font-size: 14px; }

    .context-persona span {
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .context-route {
      color: var(--ink);
      font-size: 13px;
      font-weight: 720;
      white-space: nowrap;
    }

    .micro-progress {
      padding: 5px 10px;
      border: 1px solid var(--line-cool);
      border-radius: 999px;
      color: var(--teal-dark);
      background: var(--surface);
      font-size: 11px;
      font-weight: 720;
      white-space: nowrap;
    }

    .stage-viewport {
      grid-row: 2;
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
    }

    .stage-view {
      min-height: 100%;
      padding: 22px;
      animation: stage-in 160ms ease-out;
    }

    .stage-view.stage-case_select {
      display: grid;
      align-items: center;
    }

    .stage-view.stage-case_select .selection-grid {
      width: 100%;
      min-height: 0;
    }

    @keyframes stage-in {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .screen-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    .eyebrow {
      display: block;
      margin-bottom: 5px;
      color: var(--teal-dark);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .screen-title {
      max-width: 26ch;
      margin: 0;
      color: var(--ink);
      font-size: clamp(24px, 2.2vw, 32px);
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.025em;
      text-wrap: balance;
      outline: none;
    }

    .screen-title:focus { outline: none; }

    .screen-subtitle {
      max-width: 52ch;
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .stage-chip {
      flex: 0 0 auto;
      padding: 6px 10px;
      border-radius: 6px;
      color: var(--teal-dark);
      background: var(--surface-teal);
      font-size: 11px;
      font-weight: 720;
      white-space: nowrap;
    }

    .selection-grid {
      min-height: calc(100% - 82px);
      display: grid;
      grid-template-columns: minmax(320px, 0.72fr) minmax(0, 1.28fr);
      align-items: stretch;
      gap: 18px;
    }

    .selection-intro {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 28px;
      border: 1px solid var(--line-cool);
      border-radius: var(--radius);
      background: var(--surface-soft);
    }

    .selection-intro h1 {
      max-width: 16ch;
      margin: 0;
      color: var(--ink);
      font-size: clamp(28px, 3vw, 42px);
      line-height: 1.15;
      letter-spacing: -0.04em;
      text-wrap: balance;
    }

    .selection-intro p {
      max-width: 34ch;
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .selection-facts {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 22px;
    }

    .selection-facts span {
      padding: 5px 8px;
      border: 1px solid var(--line-cool);
      border-radius: 6px;
      color: var(--teal-dark);
      background: var(--surface);
      font-size: 11px;
      font-weight: 700;
    }

    .case-fieldset {
      min-width: 0;
      margin: 0;
      padding: 18px;
      border: 1px solid var(--line-cool);
      border-radius: var(--radius);
    }

    .case-fieldset legend {
      padding: 0 6px;
      color: var(--ink);
      font-weight: 750;
    }

    .case-options { display: grid; gap: 10px; }

    .case-option { position: relative; display: block; }

    .case-option input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
    }

    .case-card {
      min-height: 86px;
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) auto;
      align-items: center;
      gap: 13px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface);
      cursor: pointer;
      transition: border-color 140ms ease, background 140ms ease, box-shadow 140ms ease;
    }

    .case-option input:checked + .case-card {
      border-color: var(--teal);
      background: var(--surface-teal);
      box-shadow: inset 4px 0 0 var(--teal);
    }

    .case-option input:focus-visible + .case-card { box-shadow: 0 0 0 3px rgba(31, 143, 148, 0.22); }

    .case-avatar {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: var(--ink);
      font-size: 17px;
      font-weight: 760;
    }

    .case-copy { min-width: 0; }

    .case-copy strong,
    .case-copy span { display: block; }

    .case-copy strong { color: var(--ink); font-size: 16px; }
    .case-copy span { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .case-copy small { display: block; margin-top: 4px; overflow: hidden; color: var(--text); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }

    .selected-mark { color: var(--teal-dark); font-size: 11px; font-weight: 760; }

    .input-grid,
    .question-grid,
    .review-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .info-card,
    .process-panel,
    .bridge-panel,
    .question-panel,
    .supplement-panel,
    .review-panel,
    .asset-card {
      min-width: 0;
      border: 1px solid var(--line-cool);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .info-card { padding: 18px; }

    .card-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--teal-dark);
      font-size: 11px;
      font-weight: 790;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .source-label {
      padding: 3px 7px;
      border-radius: 4px;
      color: var(--muted);
      background: var(--surface-soft);
      font-size: 10px;
      font-weight: 650;
      letter-spacing: 0;
      text-transform: none;
    }

    .info-card h3 {
      margin: 12px 0 7px;
      color: var(--ink);
      font-size: 18px;
      line-height: 1.35;
    }

    .info-card p {
      display: -webkit-box;
      margin: 0;
      overflow: hidden;
      color: var(--text);
      font-size: 13px;
      line-height: 1.7;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 4;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 14px;
    }

    .tag-list span {
      padding: 4px 8px;
      border: 1px solid var(--line-cool);
      border-radius: 5px;
      color: var(--teal-dark);
      background: var(--surface-teal);
      font-size: 11px;
      font-weight: 700;
    }

    .readiness-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 9px;
      margin-top: 14px;
    }

    .readiness-item {
      padding: 10px 12px;
      border: 1px solid var(--line-cool);
      border-radius: 8px;
      color: var(--text);
      background: var(--surface-soft);
      font-size: 12px;
    }

    .readiness-item strong { display: block; color: var(--ink); font-size: 12px; }

    .analysis-stack { display: grid; gap: 14px; }

    .process-panel { padding: 14px 16px; }

    .process-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .process-head strong { color: var(--ink); font-size: 14px; }
    .process-head span { color: var(--muted); font-size: 11px; }

    .process-list {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .process-item {
      min-width: 0;
      padding: 9px 10px;
      border-radius: 7px;
      color: var(--text);
      background: var(--surface-soft);
      font-size: 11px;
    }

    .process-item strong { display: block; margin-bottom: 2px; color: var(--ink); font-size: 12px; }
    .process-item.done { background: var(--surface-teal); }
    .process-item.warning { color: var(--amber-dark); background: var(--surface-warm); }
    .process-item.warning strong { color: var(--amber-dark); }

    .bridge-panel { padding: 17px; }

    .bridge-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 13px;
    }

    .bridge-head h3 { margin: 0; color: var(--ink); font-size: 16px; }

    .strength-badge {
      padding: 5px 9px;
      border: 1px solid rgba(185, 119, 24, 0.34);
      border-radius: 5px;
      color: var(--amber-dark);
      background: var(--surface-warm);
      font-size: 11px;
      font-weight: 750;
      white-space: nowrap;
    }

    .strength-badge.medium {
      border-color: rgba(31, 143, 148, 0.34);
      color: var(--teal-dark);
      background: var(--surface-teal);
    }

    .bridge-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 56px minmax(0, 1fr) 56px minmax(0, 1fr);
      align-items: stretch;
      gap: 8px;
    }

    .bridge-node {
      min-width: 0;
      padding: 13px;
      border: 1px solid var(--line-cool);
      border-radius: 8px;
      background: var(--surface-soft);
    }

    .bridge-node strong { display: block; color: var(--ink); font-size: 14px; }
    .bridge-node small { display: block; margin-top: 1px; color: var(--muted); font-size: 10px; }

    .bridge-node ul {
      display: grid;
      gap: 5px;
      margin: 10px 0 0;
      padding: 0;
      list-style: none;
    }

    .bridge-node li { color: var(--text); font-size: 12px; }
    .bridge-node li::before { content: "· "; color: var(--teal); font-weight: 800; }

    .bridge-link {
      display: grid;
      place-items: center;
      min-width: 0;
      color: var(--amber-dark);
      font-size: 10px;
      font-weight: 750;
      text-align: center;
    }

    .bridge-link::before {
      content: "";
      width: 100%;
      border-top: 2px dashed #d39a48;
    }

    .bridge-link span {
      margin-top: -15px;
      padding: 2px 5px;
      border: 1px solid rgba(185, 119, 24, 0.28);
      border-radius: 4px;
      background: var(--surface);
      white-space: nowrap;
    }

    .bridge-link.medium { color: var(--teal-dark); }
    .bridge-link.medium::before { border-top-color: var(--teal); border-top-style: solid; }
    .bridge-link.medium span { border-color: rgba(31, 143, 148, 0.28); background: var(--surface-teal); }

    .conclusion {
      margin-top: 12px;
      padding: 10px 12px;
      border-left: 3px solid var(--amber);
      border-radius: 5px;
      color: var(--amber-dark);
      background: var(--surface-warm);
      font-size: 12px;
    }

    .conclusion.medium { border-left-color: var(--teal); color: var(--teal-dark); background: var(--surface-teal); }

    .question-panel,
    .supplement-panel { padding: 20px; }

    .question-number {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 5px;
      color: var(--amber-dark);
      background: var(--surface-warm);
      font-size: 11px;
      font-weight: 760;
    }

    .question-text {
      margin: 18px 0 10px;
      color: var(--ink);
      font-size: clamp(21px, 2vw, 28px);
      font-weight: 780;
      line-height: 1.35;
      text-wrap: balance;
    }

    .question-reason { margin: 0; color: var(--muted); font-size: 12px; }

    .gap-summary {
      margin-top: 18px;
      padding: 11px 13px;
      border: 1px solid rgba(185, 119, 24, 0.25);
      border-radius: 7px;
      color: var(--amber-dark);
      background: var(--surface-warm);
      font-size: 12px;
    }

    .supplement-panel fieldset { min-width: 0; margin: 0; padding: 0; border: 0; }

    .supplement-panel legend { margin-bottom: 11px; color: var(--ink); font-size: 14px; font-weight: 750; }

    .supplement-option { display: block; cursor: pointer; }

    .supplement-option input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
    }

    .supplement-card {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      gap: 12px;
      min-height: 150px;
      padding: 16px;
      border: 1.5px solid var(--line-cool);
      border-radius: 9px;
      background: var(--surface-soft);
      transition: border-color 140ms ease, background 140ms ease, box-shadow 140ms ease;
    }

    .check-box {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border: 2px solid #91a1a8;
      border-radius: 5px;
      color: transparent;
      background: var(--surface);
      font-size: 14px;
      font-weight: 800;
    }

    .supplement-option input:checked + .supplement-card {
      border-color: var(--teal);
      background: var(--surface-teal);
      box-shadow: 0 0 0 3px rgba(31, 143, 148, 0.12);
    }

    .supplement-option input:checked + .supplement-card .check-box { color: #fff; border-color: var(--teal); background: var(--teal); }
    .supplement-option input:focus-visible + .supplement-card { box-shadow: 0 0 0 3px rgba(31, 143, 148, 0.24); }

    .supplement-copy strong { display: block; color: var(--ink); font-size: 14px; }
    .supplement-copy span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
    .supplement-copy p { margin: 12px 0 0; color: var(--text); font-size: 13px; line-height: 1.65; }

    .selection-hint {
      margin: 10px 0 0;
      color: var(--amber-dark);
      font-size: 11px;
    }

    .selection-hint.ready { color: var(--teal-dark); }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 9px;
      margin-bottom: 14px;
    }

    .metric-card {
      padding: 13px;
      border: 1px solid var(--line-cool);
      border-radius: 8px;
      background: var(--surface-soft);
    }

    .metric-card span,
    .metric-card strong { display: block; }

    .metric-card span { color: var(--muted); font-size: 11px; }
    .metric-card strong { margin-top: 4px; color: var(--teal-dark); font-size: 17px; }

    .review-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    .review-panel { padding: 17px; }
    .review-panel strong { display: block; color: var(--ink); font-size: 15px; }
    .review-panel p { margin: 9px 0 0; color: var(--text); font-size: 13px; line-height: 1.65; }

    .review-audit {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(0, 0.6fr);
      gap: 10px;
      margin-top: 14px;
    }

    .audit-band {
      padding: 12px 14px;
      border: 1px solid var(--line-cool);
      border-radius: 8px;
      background: var(--surface-soft);
    }

    .audit-band strong { display: block; color: var(--teal-dark); font-size: 11px; }
    .audit-band span { display: block; margin-top: 4px; color: var(--text); font-size: 12px; }

    .asset-card { overflow: hidden; }

    .asset-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 17px;
      border-bottom: 1px solid var(--line-cool);
      background: var(--surface-teal);
    }

    .asset-header strong { color: var(--ink); font-size: 16px; }
    .asset-header span { color: var(--teal-dark); font-size: 11px; font-weight: 700; }

    .asset-source {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      padding: 10px 17px;
      border-bottom: 1px solid var(--line-cool);

            transferReason: "角色化培训对应客户启用计划；使用阻力归纳对应采用风险；多方问题处理对应客户成功协同；周度复盘对应客户健康管理。",
            evidence: "42 家门店实施 8 周 → 周活跃率 54% 提升到 81% → 重复咨询下降 36% → 启用时间 12 天缩短到 7 天 → 复制到另外 68 家门店。",
            confidence: "中",
            gap: "尚缺独立负责企业客户账户、续约风险、增购机会和商业目标的直接证据。",
            nextAction: "整理一页客户成功计划，补充成功目标、健康指标、风险预警和升级路径。"
          }
        }
      ];

      var state = {
        stage: DemoStage.CASE_SELECT,
        selectedCaseId: DEMO_CASES[0].id,
        supplementSelected: false
      };

      var lastAdvanceAt = 0;

      var el = {
        body: document.body,
        caseContext: document.getElementById("case-context"),
        contextAvatar: document.getElementById("context-avatar"),
        contextName: document.getElementById("context-name"),
        contextBackground: document.getElementById("context-background"),
        contextRoute: document.getElementById("context-route"),
        microProgress: document.getElementById("micro-progress"),
        stageViewport: document.getElementById("stage-viewport"),
        stageView: document.getElementById("stage-view"),
        actionTitle: document.getElementById("action-title"),
        actionNote: document.getElementById("action-note"),
        primaryAction: document.getElementById("primary-action"),
        resetAction: document.getElementById("reset-action"),
        live: document.getElementById("status-live"),
        macroSteps: Array.prototype.slice.call(document.querySelectorAll("[data-macro]")),
        macroLines: Array.prototype.slice.call(document.querySelectorAll("[data-line]"))
      };

      function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, function (character) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[character];
        });
      }

      function currentCase() {
        return DEMO_CASES.filter(function (item) { return item.id === state.selectedCaseId; })[0];
      }

      function listHTML(items) {
        return "<ul>" + items.map(function (item) { return "<li>" + escapeHTML(item) + "</li>"; }).join("") + "</ul>";
      }

      function bridgeHTML(item, strength) {
        var medium = strength === "medium";
        return '<div class="bridge-panel"><div class="bridge-head"><h3>Experience → Transfer Mechanism → Target Value</h3><span class="strength-badge' + (medium ? " medium" : "") + '">连接强度｜' + (medium ? "中" : "弱") + '</span></div>' +
          '<div class="bridge-grid"><article class="bridge-node"><strong>旧经验</strong><small>Experience</small>' + listHTML(item.sourcePoints) + '</article>' +
          '<div class="bridge-link' + (medium ? " medium" : "") + '"><span>' + (medium ? "中连接" : "弱连接") + '</span></div>' +
          '<article class="bridge-node"><strong>迁移机制</strong><small>Transfer Mechanism</small>' + listHTML(item.mechanismPoints) + '</article>' +
          '<div class="bridge-link' + (medium ? " medium" : "") + '"><span>' + (medium ? "中连接" : "弱连接") + '</span></div>' +
          '<article class="bridge-node"><strong>目标价值</strong><small>Target Value</small>' + listHTML(item.targetPoints) + '</article></div></div>';
      }

      function screenHead(eyebrow, title, subtitle, chip) {
        return '<header class="screen-head"><div><span class="eyebrow">' + escapeHTML(eyebrow) + '</span><h1 class="screen-title" id="stage-heading" tabindex="-1">' + escapeHTML(title) + '</h1><p class="screen-subtitle">' + escapeHTML(subtitle) + '</p></div>' + (chip ? '<span class="stage-chip">' + escapeHTML(chip) + '</span>' : "") + '</header>';
      }

      function renderCaseSelect(item) {
        var options = DEMO_CASES.map(function (candidate) {
          var checked = candidate.id === state.selectedCaseId;
          return '<label class="case-option"><input type="radio" name="demo-case" value="' + escapeHTML(candidate.id) + '"' + (checked ? " checked" : "") + '><span class="case-card"><span class="case-avatar" aria-hidden="true">' + escapeHTML(candidate.initial) + '</span><span class="case-copy"><strong>' + escapeHTML(candidate.name) + '</strong><span>' + escapeHTML(candidate.route) + '</span><small>' + escapeHTML(candidate.selectorBlurb) + '</small></span><span class="selected-mark">' + (checked ? "已选择" : "选择") + '</span></span></label>';
        }).join("");
        return '<div class="selection-grid"><section class="selection-intro"><span class="eyebrow">Migration Demo</span><h1 id="stage-heading" tabindex="-1">选择一段旧经验，看它如何迁移</h1><p>无需输入。选择匿名案例后，由你逐步完成首次分析、唯一追问、补证和资产确认。</p><div class="selection-facts"><span>3 个跨行业案例</span><span>全程用户点击</span><span>无需 API</span></div></section><fieldset class="case-fieldset"><legend>选择匿名演示案例</legend><div class="case-options">' + options + '</div></fieldset></div>';
      }

      function renderCaseReady(item) {
        return screenHead("Step 1 / 6", "核对迁移输入", "先确认目标岗位与旧经历，再启动首次分析。", "等待启动") +
          '<div class="input-grid"><article class="info-card"><div class="card-label">目标岗位 JD <span class="source-label">预设输入</span></div><h3>' + escapeHTML(item.targetRole) + '</h3><p>' + escapeHTML(item.jdExcerpt) + '</p><div class="tag-list">' + item.jdValues.map(function (pair) { return "<span>" + escapeHTML(pair[0]) + "</span>"; }).join("") + '</div></article>' +
          '<article class="info-card"><div class="card-label">旧经历 <span class="source-label">经历原文</span></div><h3>' + escapeHTML(item.experienceTitle) + '</h3><p>' + escapeHTML(item.experienceText) + '</p><div class="tag-list">' + item.sourcePoints.map(function (point) { return "<span>" + escapeHTML(point) + "</span>"; }).join("") + '</div></article></div>' +
          '<div class="readiness-strip"><div class="readiness-item"><strong>输入已就绪</strong>JD 与经历均为本地预设</div><div class="readiness-item"><strong>分析目标</strong>判断旧经验如何迁移</div><div class="readiness-item"><strong>演示边界</strong>不调用真实模型</div></div>';
      }

      function renderFirstAnalysis(item) {
        var process = [["已完成", "读取目标 JD"], ["已完成", "解码岗位价值"], ["已完成", "抽取经历事实"], ["已完成", "建立迁移关系"], ["需补证", "发现结果缺口"]];
        return screenHead("Step 2 / 6", "首次分析：找到迁移底座", "Agent 只展示可验证处理节点，不展示内部思维链。", "首轮判断") +
          '<div class="analysis-stack"><section class="process-panel"><div class="process-head"><strong>Agent 处理记录</strong><span>4 项完成 · 1 项待补</span></div><ol class="process-list">' + process.map(function (pair, index) { return '<li class="process-item ' + (index === 4 ? "warning" : "done") + '"><strong>' + pair[0] + '</strong><span>' + pair[1] + '</span></li>'; }).join("") + '</ol></section>' +
          bridgeHTML(item, "weak") + '<div class="conclusion"><strong>首轮结论：</strong>迁移机制成立，但缺少一条结果性证据，当前只能形成弱连接。</div></div>';
      }

      function renderClarification(item) {
        return screenHead("Step 3 / 6", "唯一追问：补齐结果证据", "本轮只问一个最高价值问题；选择预填答案后才能重新分析。", "问题 1 / 1") +
          '<div class="question-grid"><article class="question-panel"><span class="question-number">Agent 追问</span><p class="question-text">' + escapeHTML(item.question) + '</p><p class="question-reason">为什么需要问：' + escapeHTML(item.questionReason) + '</p><div class="gap-summary">当前连接｜弱 · 缺口｜结果证据不足</div></article>' +
          '<article class="supplement-panel"><fieldset><legend>选择本轮补证</legend><label class="supplement-option"><input type="checkbox" id="supplement-choice"' + (state.supplementSelected ? " checked" : "") + '><span class="supplement-card"><span class="check-box" aria-hidden="true">✓</span><span class="supplement-copy"><strong>使用匿名预设补证</strong><span>预填文本 · 用户勾选后提交</span><p>' + escapeHTML(item.supplementAnswer) + '</p></span></span></label><p class="selection-hint' + (state.supplementSelected ? " ready" : "") + '" id="selection-hint">' + (state.supplementSelected ? "已选择预设补证，可以重新分析。" : "请先勾选这条预设补证。") + '</p></fieldset></article></div>';
      }

      function renderSecondAnalysis(item) {
        return screenHead("Step 4 / 6", "二次分析：证据升级", "Agent 已核验用户选择的补证，并更新连接强度。", "弱 → 中") +
          '<div class="metrics-grid">' + item.metrics.map(function (pair) { return '<div class="metric-card"><span>' + escapeHTML(pair[0]) + '</span><strong>' + escapeHTML(pair[1]) + '</strong></div>'; }).join("") + '</div>' +
          bridgeHTML(item, "medium") + '<div class="conclusion medium"><strong>更新结论：</strong>' + escapeHTML(item.secondSummary) + '</div>';
      }

      function renderReview(item) {
        return screenHead("Step 5 / 6", "确认迁移关系", "确认前不会生成资产；请核对来源、迁移机制和目标价值。", "等待用户确认") +
          '<div class="review-grid"><article class="review-panel"><strong>旧经验</strong><p>' + escapeHTML(item.asset.sourceExperience) + '</p></article><article class="review-panel"><strong>迁移机制</strong><p>' + escapeHTML(item.asset.transferReason) + '</p></article><article class="review-panel"><strong>目标价值</strong><p>' + escapeHTML(item.asset.targetValue) + '</p></article></div>' +
          '<div class="review-audit"><div class="audit-band"><strong>补证依据</strong><span>' + escapeHTML(item.supplementAnswer) + '</span></div><div class="audit-band"><strong>仍保留的缺口</strong><span>' + escapeHTML(item.gap) + '</span></div></div>';
      }

      function renderAsset(item) {
        var rows = [["旧经验", item.asset.sourceExperience], ["目标价值", item.asset.targetValue], ["迁移理由", item.asset.transferReason], ["证据链", item.asset.evidence], ["证据充分度", item.asset.confidence], ["当前缺口", item.asset.gap], ["下一步补强", item.asset.nextAction]];
        return screenHead("Step 6 / 6", "Transfer Asset 已生成", "用户确认后，迁移关系被沉淀为可复用的职业资产。", "当前会话") +
          '<section class="asset-card"><header class="asset-header"><strong>Experience Transfer Asset</strong><span>用户已确认 · Mock</span></header><div class="asset-source"><span><strong>本轮追问：</strong>' + escapeHTML(item.question) + '</span><span><strong>补证来源：</strong>用户勾选的匿名预设回答</span></div><div class="asset-rows">' + rows.map(function (pair, index) { var suffix = index === 4 ? '<span class="confidence-note">不代表录用概率</span>' : ""; return '<div class="asset-row"><span class="asset-num">' + String(index + 1).padStart(2, "0") + '</span><span class="asset-key">' + escapeHTML(pair[0]) + '</span><span class="asset-value">' + escapeHTML(pair[1]) + suffix + '</span></div>'; }).join("") + '</div></section>';
      }

      function stageIndex(stage) { return STAGE_ORDER.indexOf(stage); }

      function renderMacroProgress() {
        var position = stageIndex(state.stage);
        var activeMacro = position <= 2 ? 0 : position <= 4 ? 1 : 2;
        el.macroSteps.forEach(function (step, index) {
          step.classList.toggle("done", index < activeMacro || state.stage === DemoStage.ASSET_READY);
          step.classList.toggle("active", index === activeMacro && state.stage !== DemoStage.ASSET_READY);
          if (index === activeMacro && state.stage !== DemoStage.ASSET_READY) step.setAttribute("aria-current", "step");
          else step.removeAttribute("aria-current");
          step.querySelector(".macro-index").textContent = String(index + 1);
        });
        el.macroLines.forEach(function (line, index) { line.classList.toggle("done", index < activeMacro || state.stage === DemoStage.ASSET_READY); });
      }

      function actionConfig(item) {
        var config = {};
        config[DemoStage.CASE_SELECT] = ["选择一位匿名案例", "每次点击只切换一个步骤页", "载入「" + item.name + "」案例", "primary"];
        config[DemoStage.CASE_READY] = ["输入已经就绪", "确认后启动首次迁移分析", "开始首次分析", "primary"];
        config[DemoStage.FIRST_ANALYSIS] = ["首次分析完成", "发现 1 项结果性证据缺口", "查看唯一追问", "amber"];
        config[DemoStage.NEEDS_CLARIFICATION] = ["等待选择补证", "勾选预填答案后才能重新分析", "提交补证并重新分析", "amber"];
        config[DemoStage.SECOND_ANALYSIS] = ["二次分析完成", "连接强度已由弱更新为中", "查看更新后的关系", "teal"];
        config[DemoStage.REVIEW_READY] = ["迁移关系待确认", "确认前不会生成 Transfer Asset", "确认关系并生成资产", "teal"];
        config[DemoStage.ASSET_READY] = ["迁移资产已生成", "可返回选择其他匿名案例", "体验其他案例", "primary"];
        return config[state.stage];
      }

      function renderAction(item) {
        var config = actionConfig(item);
        el.actionTitle.textContent = config[0];
        el.actionNote.textContent = config[1];
        el.primaryAction.textContent = config[2];
        el.primaryAction.className = "btn " + (config[3] === "amber" ? "btn-amber" : config[3] === "teal" ? "btn-teal" : "btn-primary");
        el.primaryAction.disabled = state.stage === DemoStage.NEEDS_CLARIFICATION && !state.supplementSelected;
        el.resetAction.hidden = state.stage === DemoStage.CASE_SELECT || state.stage === DemoStage.ASSET_READY;
      }

      function renderContext(item) {
        var labels = {};
        labels[DemoStage.CASE_READY] = "步骤 1 / 6 · 核对输入";
        labels[DemoStage.FIRST_ANALYSIS] = "步骤 2 / 6 · 首次分析";
        labels[DemoStage.NEEDS_CLARIFICATION] = "步骤 3 / 6 · 唯一追问";
        labels[DemoStage.SECOND_ANALYSIS] = "步骤 4 / 6 · 二次分析";
        labels[DemoStage.REVIEW_READY] = "步骤 5 / 6 · 用户确认";
        labels[DemoStage.ASSET_READY] = "步骤 6 / 6 · 迁移资产";
        var visible = state.stage !== DemoStage.CASE_SELECT;
        el.caseContext.hidden = !visible;
        el.caseContext.setAttribute("aria-hidden", String(!visible));
        el.contextAvatar.textContent = item.initial;
        el.contextName.textContent = item.name;
        el.contextBackground.textContent = item.background;
        el.contextRoute.textContent = item.route;
        el.microProgress.textContent = labels[state.stage] || "选择案例";
      }

      function renderScreen(item) {
        var renderers = {};
        renderers[DemoStage.CASE_SELECT] = renderCaseSelect;
        renderers[DemoStage.CASE_READY] = renderCaseReady;
        renderers[DemoStage.FIRST_ANALYSIS] = renderFirstAnalysis;
        renderers[DemoStage.NEEDS_CLARIFICATION] = renderClarification;
        renderers[DemoStage.SECOND_ANALYSIS] = renderSecondAnalysis;
        renderers[DemoStage.REVIEW_READY] = renderReview;
        renderers[DemoStage.ASSET_READY] = renderAsset;
        el.stageView.innerHTML = renderers[state.stage](item);
      }

      function focusStageHeading() {
        el.stageViewport.scrollTop = 0;
        window.requestAnimationFrame(function () {
          var heading = document.getElementById("stage-heading");
          if (heading) heading.focus({ preventScroll: true });
        });
      }

      function announce(item) {
        var strength = stageIndex(state.stage) < stageIndex(DemoStage.FIRST_ANALYSIS) ? "尚未判断" : stageIndex(state.stage) < stageIndex(DemoStage.SECOND_ANALYSIS) ? "弱连接" : "中连接";
        el.live.textContent = item.name + "，当前" + el.microProgress.textContent + "，" + strength + (state.stage === DemoStage.NEEDS_CLARIFICATION ? state.supplementSelected ? "，已选择预设补证。" : "，等待选择预设补证。" : "。");
      }

      function render(shouldFocus) {
        var item = currentCase();
        el.body.dataset.demoStage = state.stage;
        el.stageView.className = "stage-view stage-" + state.stage;
        el.stageView.dataset.stageView = state.stage;
        renderMacroProgress();
        renderContext(item);
        renderScreen(item);
        renderAction(item);
        announce(item);
        if (shouldFocus) focusStageHeading();
      }

      function selectCase(caseId) {
        var exists = DEMO_CASES.some(function (item) { return item.id === caseId; });
        if (!exists || state.stage !== DemoStage.CASE_SELECT) return;
        state.selectedCaseId = caseId;
        state.supplementSelected = false;
        render(false);
        window.requestAnimationFrame(function () {
          var radio = el.stageView.querySelector('input[value="' + caseId + '"]');
          if (radio) radio.focus({ preventScroll: true });
        });
      }

      function updateSupplementSelection(checked) {
        if (state.stage !== DemoStage.NEEDS_CLARIFICATION) return;
        state.supplementSelected = Boolean(checked);
        el.primaryAction.disabled = !state.supplementSelected;
        var hint = document.getElementById("selection-hint");
        if (hint) {
          hint.textContent = state.supplementSelected ? "已选择预设补证，可以重新分析。" : "请先勾选这条预设补证。";
          hint.classList.toggle("ready", state.supplementSelected);
        }
        announce(currentCase());
      }

      function advance() {
        var now = performance.now();
        if (lastAdvanceAt && now - lastAdvanceAt < 350) return;
        if (state.stage === DemoStage.NEEDS_CLARIFICATION && !state.supplementSelected) {
          el.live.textContent = "请先勾选预设补证，才能重新分析。";
          return;
        }
        lastAdvanceAt = now;
        var next = {};
        next[DemoStage.CASE_SELECT] = DemoStage.CASE_READY;
        next[DemoStage.CASE_READY] = DemoStage.FIRST_ANALYSIS;
        next[DemoStage.FIRST_ANALYSIS] = DemoStage.NEEDS_CLARIFICATION;
        next[DemoStage.NEEDS_CLARIFICATION] = DemoStage.SECOND_ANALYSIS;
        next[DemoStage.SECOND_ANALYSIS] = DemoStage.REVIEW_READY;
        next[DemoStage.REVIEW_READY] = DemoStage.ASSET_READY;
        next[DemoStage.ASSET_READY] = DemoStage.CASE_SELECT;
        state.stage = next[state.stage];
        if (state.stage === DemoStage.NEEDS_CLARIFICATION || state.stage === DemoStage.CASE_SELECT) state.supplementSelected = false;
        render(true);
      }

      function reset() {
        state.stage = DemoStage.CASE_SELECT;
        state.supplementSelected = false;
        lastAdvanceAt = 0;
        render(true);
      }

      el.stageView.addEventListener("change", function (event) {
        if (event.target.matches('input[name="demo-case"]')) selectCase(event.target.value);
        if (event.target.id === "supplement-choice") updateSupplementSelection(event.target.checked);
      });

      el.primaryAction.addEventListener("click", advance);
      el.resetAction.addEventListener("click", reset);

      window.__QianyueCreativeProposal = {
        advance: advance,
        reset: reset,
        selectCase: selectCase,
        setSupplementSelected: updateSupplementSelection,
        getState: function () { return { stage: state.stage, selectedCaseId: state.selectedCaseId, supplementSelected: state.supplementSelected }; },
        getCases: function () { return DEMO_CASES.map(function (item) { return { id: item.id, name: item.name, route: item.route }; }); }
      };

      render(false);
    }());
  </script>
</body>
</html>
