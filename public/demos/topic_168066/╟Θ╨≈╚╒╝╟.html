<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>心晴日记 - 情绪管理与释放平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #C6A87D;
      --primary-light: #E8DCC4;
      --primary-dark: #8B7355;
      --secondary: #A8B5C4;
      --accent: #D4A5A5;
      --bg-warm: #FDFBF7;
      --bg-cream: #FAF6F1;
      --bg-card: rgba(255,255,255,0.8);
      --text-dark: #3D3D3D;
      --text-medium: #6B6B6B;
      --text-light: #9B9B9B;
      --border: rgba(198,168,125,0.15);
      --shadow: rgba(198,168,125,0.1);
      --shadow-hover: rgba(198,168,125,0.2);
    }
    
    body { font-family: 'Noto Sans SC', sans-serif; overflow-x: hidden; background: var(--bg-warm); color: var(--text-dark); -webkit-tap-highlight-color: transparent; }
    
    @media (max-width: 768px) {
      .mobile-hidden { display: none !important; }
      .mobile-p-2 { padding: 0.5rem !important; }
      .mobile-p-3 { padding: 0.75rem !important; }
      .mobile-p-4 { padding: 1rem !important; }
      .mobile-text-lg { font-size: 1.125rem !important; }
      .mobile-text-xl { font-size: 1.25rem !important; }
      .mobile-text-2xl { font-size: 1.5rem !important; }
      .mobile-text-4xl { font-size: 2.25rem !important; }
      .mobile-gap-2 { gap: 0.5rem !important; }
      .mobile-gap-3 { gap: 0.75rem !important; }
      .mobile-w-full { width: 100% !important; }
    }
    .font-display { font-family: 'ZCOOL KuaiLe', cursive; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    
    /* 粒子背景 */
    .particle { position: fixed; pointer-events: none; border-radius: 50%; animation: float linear infinite; }
    @keyframes float { 0% { transform: translateY(100vh) rotate(0deg); opacity: 0; } 10% { opacity: 0.4; } 90% { opacity: 0.4; } 100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; } }
    
    /* 呼吸动画 */
    @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } }
    
    /* 光晕动画 */
    @keyframes glow { 0%, 100% { box-shadow: 0 0 30px rgba(198,168,125,0.2), 0 0 60px rgba(212,165,165,0.15); } 50% { box-shadow: 0 0 50px rgba(198,168,125,0.3), 0 0 100px rgba(212,165,165,0.25); } }
    
    /* 页面切换 */
    .page { display: none; opacity: 0; transition: opacity 0.5s ease; }
    .page.active { display: flex; opacity: 1; }
    
    /* 玻璃效果 */
    .glass { background: var(--bg-card); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--border); }
    
    /* 滑块样式 */
    input[type="range"] { -webkit-appearance: none; width: 100%; height: 6px; border-radius: 3px; background: linear-gradient(to right, #D4A5A5, #C6A87D, #A8B5C4, #8FB9A8, #6B9AC4); }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: white; box-shadow: 0 2px 8px rgba(198,168,125,0.3); border: 3px solid var(--primary); transition: all 0.2s; }
    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.1); }
    
    /* 卡片悬浮 */
    .card-hover { transition: all 0.4s ease; }
    .card-hover:hover { transform: translateY(-6px); box-shadow: 0 24px 48px var(--shadow-hover); }
    
    /* 木鱼动画 */
    @keyframes woodfish { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-20deg); } 75% { transform: rotate(20deg); } }
    .animate-woodfish { animation: woodfish 0.3s ease-in-out; }
    
    /* 猫点头动画 */
    @keyframes cat-head { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .animate-cat-head { animation: cat-head 0.3s ease-in-out; }
    
    /* 纸飞机动画 */
    @keyframes fly-up { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-200px) scale(0.5); opacity: 0; } }
    .animate-fly { animation: fly-up 2s ease-out forwards; }
    
    /* 风车旋转 */
    @keyframes windmill { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .animate-windmill { animation: windmill 2s linear infinite; }
    
    /* 音频按钮 */
    .audio-btn { position: fixed; bottom: 80px; right: 20px; width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px var(--shadow); transition: all 0.3s; z-index: 100; }
    .audio-btn:hover { transform: scale(1.1); }
    .audio-btn.playing { background: var(--primary); }
    
    /* 输入框聚焦 */
    .input-focus:focus { outline: none; box-shadow: 0 0 0 3px rgba(198,168,125,0.15); }
    
    /* 按钮点击 */
    .btn-press:active { transform: scale(0.98); }
    
    /* 层级列表动画 */
    .level-item { transition: all 0.3s ease; }
    .level-item.active { background: rgba(198,168,125,0.08); }
    
    /* 年度报告卡片 */
    .report-card { animation: slideUp 0.5s ease-out; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    
    /* 渐变按钮 */
    .btn-gradient { background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%); }
    
    /* 滚动条样式 */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--primary-light); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--primary); }
  </style>
</head>
<body class="min-h-screen relative">
  <!-- 粒子背景 -->
  <div id="particles-container"></div>
  
  <!-- 音频控制按钮 -->
  <button id="audio-btn" class="audio-btn" onclick="toggleAudio()">
    <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/>
    </svg>
  </button>

  <!-- 1. 温馨访问页 -->
  <div id="page-welcome" class="page active flex-col items-center justify-center min-h-screen relative">
    <div class="absolute inset-0 bg-gradient-to-br from-[#FAF6F1] via-[#F5EEE6] to-[#E8DCC4]"></div>
    <div class="relative z-10 text-center p-4 sm:p-8 w-full max-w-md">
      <div class="text-6xl sm:text-8xl mb-4 sm:mb-6 animate-breathe">🌿</div>
      <h1 class="text-3xl sm:text-4xl font-display text-[#3D3D3D] mb-3 sm:mb-4">心晴日记</h1>
      <p class="text-base sm:text-lg text-[#6B6B6B] mb-2">记录每一份心情，守护每一个你</p>
      <p class="text-sm text-[#9B9B9B] mb-8 sm:mb-12">在这里，你的情绪值得被认真对待</p>
      <button onclick="enterMindSpace()" class="w-full sm:w-auto px-6 sm:px-8 py-3 sm:py-4 rounded-full font-medium text-white btn-gradient shadow-xl hover:shadow-2xl transition-all hover:scale-105">
        进入心灵空间
      </button>
      <p class="text-xs text-[#9B9B9B] mt-4 sm:mt-6">点击任意处也可进入</p>
    </div>
  </div>

  <!-- 2. 密码页面 -->
  <div id="page-password" class="page flex-col items-center justify-center min-h-screen">
    <div class="glass rounded-3xl p-8 shadow-xl w-full max-w-sm">
      <h2 class="text-2xl font-bold text-[#3D3D3D] text-center mb-2">心灵密码</h2>
      <p class="text-[#6B6B6B] text-center mb-6" id="password-hint">请输入你的心灵密码</p>
      <input type="password" id="password-input" placeholder="输入密码..." class="w-full px-4 py-4 rounded-xl bg-white/90 border-none focus:outline-none text-center text-xl input-focus mb-6">
      <button onclick="checkPassword()" class="w-full py-3 rounded-xl font-medium text-white btn-gradient transition-all btn-press">
        进入日记本
      </button>
      <button onclick="setNewPassword()" class="w-full mt-4 py-3 rounded-xl font-medium text-[#6B6B6B] hover:bg-white/50 transition-all">
        设置新密码
      </button>
    </div>
  </div>

  <!-- 3. 日记本首页 -->
  <div id="page-diary-home" class="page flex-col min-h-screen pb-20">
    <div class="p-4">
      <!-- 顶部 -->
      <div class="flex items-center justify-between mb-6">
        <div>
          <h1 class="text-2xl font-bold text-[#3D3D3D]" id="diary-greeting">你好，朋友 👋</h1>
          <p class="text-[#6B6B6B] text-sm mt-1" id="diary-date">2026年7月15日</p>
        </div>
        <button onclick="showYearReport()" class="px-4 py-2 rounded-full btn-gradient text-white text-sm font-medium shadow-md">
          📅 年度总结
        </button>
      </div>

      <!-- 今日心情卡片 -->
      <div class="glass rounded-3xl p-6 shadow-lg mb-6 card-hover">
        <div class="flex flex-col items-center">
          <h2 class="text-[#6B6B6B] text-sm mb-4">今日心情</h2>
          <div id="today-emotion-container" class="relative mb-6">
            <div class="w-40 h-40 rounded-full bg-gradient-to-br from-[#E8DCC4] to-[#D4A5A5] flex items-center justify-center animate-glow">
              <span class="text-6xl">❓</span>
            </div>
            <p class="text-[#6B6B6B] mt-2">今天还没有记录心情哦</p>
          </div>
        </div>
        <button onclick="navigateTo('page-diary-record')" class="w-full py-4 rounded-2xl font-medium text-white btn-gradient transition-all btn-press">
          记录今日心情
        </button>
      </div>

      <!-- 日记层级导航 -->
      <div class="glass rounded-2xl p-4 shadow-sm mb-6">
        <h3 class="text-sm font-medium text-[#6B6B6B] mb-3">📚 我的日记</h3>
        <div id="diary-tree"></div>
      </div>

      <!-- 最近日记 -->
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold text-[#3D3D3D]">最近记录</h2>
      </div>
      <div class="grid gap-3" id="recent-diaries"></div>
    </div>
    
    <!-- 底部导航 -->
    <div class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-[rgba(198,168,125,0.15)] px-6 py-3">
      <div class="flex justify-around items-center">
        <button onclick="navigateTo('page-diary-home')" class="nav-btn active flex flex-col items-center gap-1 text-gray-400">
          <svg class="w-6 h-6 text-[#C6A87D]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          <span class="text-xs font-medium text-[#C6A87D]">日记</span>
        </button>
        <button onclick="navigateTo('page-healing-space')" class="nav-btn flex flex-col items-center gap-1 text-gray-400">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
          <span class="text-xs font-medium">治愈空间</span>
        </button>
        <button onclick="navigateTo('page-analysis')" class="nav-btn flex flex-col items-center gap-1 text-gray-400">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
          <span class="text-xs font-medium">统计</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 4. 日记记录页 -->
  <div id="page-diary-record" class="page flex-col min-h-screen pb-20">
    <div class="p-4">
      <div class="flex items-center gap-3 mb-6">
        <button onclick="navigateTo('page-diary-home')" class="p-3 rounded-full hover:bg-white/50 transition-colors">
          <svg class="w-6 h-6 text-[#6B6B6B]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <h1 class="text-xl font-bold text-[#3D3D3D]">记录今日心情</h1>
      </div>

      <div class="glass rounded-3xl p-6 shadow-lg">
        <!-- 日记标题 -->
        <div class="mb-6">
          <label class="block text-[#6B6B6B] text-sm mb-2">日记标题</label>
          <input type="text" id="diary-title" placeholder="给今天的日记起个名字..." class="w-full px-4 py-3 rounded-xl bg-white/90 border-none focus:outline-none text-[#3D3D3D] input-focus">
        </div>

        <!-- 情绪打分 -->
        <div class="mb-6">
          <h2 class="text-center text-[#6B6B6B] text-sm mb-6">今天心情怎么样？</h2>
          <div class="flex flex-col items-center gap-4">
            <div id="record-emoji" class="text-7xl transition-all duration-300">😐</div>
            <div id="record-label" class="text-lg font-medium text-[#6B6B6B]">一般般 · 5分</div>
            <input type="range" id="emotion-slider" min="1" max="10" value="5" oninput="updateRecordEmotion(this.value)" class="max-w-xs">
            <div class="flex justify-between w-full max-w-xs text-sm text-[#9B9B9B]">
              <span>😫</span><span>😔</span><span>😐</span><span>🙂</span><span>😄</span>
            </div>
          </div>
        </div>

        <!-- 情绪标签 -->
        <div class="mb-6">
          <h2 class="text-[#6B6B6B] text-sm mb-3">添加情绪标签</h2>
          <div class="flex flex-wrap gap-2" id="tag-selector"></div>
        </div>

        <!-- 日记内容 -->
        <div class="mb-6">
          <h2 class="text-[#6B6B6B] text-sm mb-3">写点什么吧...</h2>
          <textarea id="diary-content" placeholder="记录下今天的心情故事..." class="w-full h-40 p-4 rounded-xl bg-white/90 border-none resize-none focus:outline-none text-[#3D3D3D] input-focus"></textarea>
        </div>

        <button onclick="saveDiary()" class="w-full py-4 rounded-2xl font-medium text-white btn-gradient transition-all hover:shadow-xl btn-press">
          保存日记
        </button>
      </div>
    </div>
  </div>

  <!-- 5. 治愈互动页 -->
  <div id="page-healing" class="page flex-col items-center justify-center min-h-screen">
    <div id="healing-content" class="text-center"></div>
  </div>

  <!-- 6. 年度总结页 -->
  <div id="page-year-report" class="page flex-col min-h-screen overflow-y-auto pb-20">
    <div class="p-4">
      <div class="flex items-center gap-3 mb-6">
        <button onclick="navigateTo('page-diary-home')" class="p-3 rounded-full hover:bg-white/50 transition-colors">
          <svg class="w-6 h-6 text-[#6B6B6B]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <h1 class="text-xl font-bold text-[#3D3D3D]">年度心情报告</h1>
      </div>

      <div class="space-y-4" id="year-report-content"></div>
    </div>
  </div>

  <!-- 7. 治愈空间 -->
  <div id="page-healing-space" class="page flex-col min-h-screen">
    <div class="p-4">
      <div class="flex items-center justify-between mb-6">
        <h1 class="text-xl font-bold text-[#3D3D3D]">治愈空间</h1>
        <button onclick="navigateTo('page-create-agent')" class="px-4 py-2 rounded-full btn-gradient text-white text-sm font-medium shadow-md">
          + 创建智能体
        </button>
      </div>

      <div class="grid gap-4" id="agent-list"></div>
    </div>
    
    <!-- 底部导航 -->
    <div class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-[rgba(198,168,125,0.15)] px-6 py-3">
      <div class="flex justify-around items-center">
        <button onclick="navigateTo('page-diary-home')" class="nav-btn flex flex-col items-center gap-1 text-gray-400">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          <span class="text-xs font-medium">日记</span>
        </button>
        <button onclick="navigateTo('page-healing-space')" class="nav-btn active flex flex-col items-center gap-1 text-gray-400">
          <svg class="w-6 h-6 text-[#C6A87D]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
          <span class="text-xs font-medium text-[#C6A87D]">治愈空间</span>
        </button>
        <button onclick="navigateTo('page-analysis')" class="nav-btn flex flex-col items-center gap-1 text-gray-400">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
          <span class="text-xs font-medium">统计</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 8. 创建智能体页 -->
  <div id="page-create-agent" class="page flex-col min-h-screen pb-20">
    <div class="p-4">
      <div class="flex items-center gap-3 mb-6">
        <button onclick="navigateTo('page-healing-space')" class="p-3 rounded-full hover:bg-white/50 transition-colors">
          <svg class="w-6 h-6 text-[#6B6B6B]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <h1 class="text-xl font-bold text-[#3D3D3D]">创建智能体</h1>
      </div>

      <div class="glass rounded-3xl p-6 shadow-lg">
        <div class="mb-6">
          <label class="block text-[#6B6B6B] text-sm mb-2">智能体名称</label>
          <input type="text" id="agent-name" placeholder="给你的智能体起个名字..." class="w-full px-4 py-3 rounded-xl bg-white/90 border-none input-focus">
        </div>

        <div class="mb-6">
          <label class="block text-[#6B6B6B] text-sm mb-2">性格描述</label>
          <input type="text" id="agent-personality" placeholder="例如：温柔、耐心、幽默..." class="w-full px-4 py-3 rounded-xl bg-white/90 border-none input-focus">
        </div>

        <div class="mb-6">
          <label class="block text-[#6B6B6B] text-sm mb-2">选择头像</label>
          <div class="flex flex-wrap gap-3" id="agent-avatar-selector"></div>
        </div>

        <div class="mb-6">
          <label class="block text-[#6B6B6B] text-sm mb-2">选择场景</label>
          <div class="grid grid-cols-2 gap-3" id="agent-scene-selector"></div>
        </div>

        <button onclick="createAgent()" class="w-full py-4 rounded-2xl font-medium text-white btn-gradient transition-all btn-press">
          创建智能体
        </button>
      </div>
    </div>
  </div>

  <!-- 9. 智能体对话页 -->
  <div id="page-agent-chat" class="page flex-col min-h-screen">
    <div class="relative h-48 overflow-hidden">
      <img id="chat-bg" src="" alt="场景背景" class="w-full h-full object-cover">
      <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/20 to-transparent"></div>

        localStorage.setItem(STORAGE_KEY_PASSWORD, input);

        loadData();
        navigateTo('page-diary-home');

        alert('请设置4位以上的密码');

        alert('密码错误，请重试');

  // 页面导航
  function navigateTo(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    document.querySelectorAll('.nav-btn').forEach(n => n.classList.remove('active'));
    
    if (pageId === 'page-diary-home') { document.querySelector('#page-diary-home .nav-btn:first-child')?.classList.add('active'); updateTodayEmotion(); renderDiaryTree(); renderRecentDiaries(); }

    if (pageId === 'page-diary-record') { renderTagSelector(); }
    if (pageId === 'page-create-agent') { renderAgentAvatarSelector(); renderAgentSceneSelector(); }

  // 加载数据
  function loadData() {
    if (!localStorage.getItem(STORAGE_KEY_DIARIES)) {
      const mockData = generateMockData();
      localStorage.setItem(STORAGE_KEY_DIARIES, JSON.stringify(mockData));
    }
    if (!localStorage.getItem(STORAGE_KEY_AGENTS)) {
      localStorage.setItem(STORAGE_KEY_AGENTS, JSON.stringify(defaultAgents));
    }
    updateGreeting();
  }

  // 生成模拟数据
  function generateMockData() {
    const data = [];
    const today = new Date();
    for (let i = 0; i < 14; i++) {
      const date = new Date(today);
      date.setDate(today.getDate() - i);
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      
      const scores = [3, 5, 7, 4, 8, 6, 9, 2, 5, 7, 4, 8, 6, 9];
      const titles = ['忙碌的一天', '平静的午后', '开心的聚会', '压力有点大', '完成项目啦', '悠闲的周末', '收到好消息', '情绪低落', '普通的一天', '和朋友聊天', '准备会议', '项目上线', '周末休息', '惊喜礼物'];
      const contents = ['今天工作压力好大，感觉喘不过气来...', '平平淡淡的一天，没什么特别的事情发生。', '和朋友一起吃饭聊天，心情特别好！', '有点焦虑，明天有个重要的会议要准备。', '完成了一个大项目，终于可以松一口气了！', '今天天气不错，出去散步了一会儿。', '收到了期待已久的好消息，超级开心！', '今天情绪很低落，什么都不想做...', '普普通通的一天，按部就班。', '和好朋友聊了很久，心情好多了！', '准备明天的会议，有点紧张。', '项目终于上线了，太开心了！', '周末在家休息，放松一下。', '收到了惊喜礼物，太开心了！'];
      
      data.push({
        id: Date.now().toString() + i,
        score: scores[i],
        title: titles[i],
        content: contents[i],
        tags: scores[i] > 7 ? ['开心'] : scores[i] < 4 ? ['压力'] : ['平静'],
        date: `${y}-${m}-${d}`,
        createdAt: date.getTime(),
      });
    }
    return data;
  }

  // 更新问候语
  function updateGreeting() {
    const hour = new Date().getHours();
    let greeting = '你好';
    if (hour < 6) greeting = '夜深了';
    else if (hour < 9) greeting = '早安';
    else if (hour < 12) greeting = '上午好';
    else if (hour < 14) greeting = '中午好';
    else if (hour < 18) greeting = '下午好';
    else if (hour < 22) greeting = '晚上好';
    else greeting = '夜深了';
    
    document.getElementById('diary-greeting').textContent = `${greeting}，朋友 👋`;
    const now = new Date();
    document.getElementById('diary-date').textContent = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
  }

  // 更新今日情绪
  function updateTodayEmotion() {
    const diaries = getDiaries();
    const today = new Date().toISOString().split('T')[0];
    const todayDiary = diaries.find(d => d.date === today);
    
    const container = document.getElementById('today-emotion-container');
    if (todayDiary) {
      const config = emotionConfig[todayDiary.score];
      container.innerHTML = `
        <div class="relative w-40 h-40">
          <svg width="160" height="160" class="transform -rotate-90">
            <circle cx="80" cy="80" r="70" fill="none" stroke="#FFE4E1" stroke-width="10"/>
            <circle cx="80" cy="80" r="70" fill="none" stroke="${config.color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(todayDiary.score/10)*440} 440"/>

          <div class="absolute inset-0 flex flex-col items-center justify-center">
            <span class="text-5xl">${config.emoji}</span>
            <span class="text-sm font-medium" style="color: ${config.color}">${config.label}</span>
          </div>
        </div>
        <p class="text-gray-600 text-sm mt-2">${todayDiary.title}</p>
      `;
    } else {
      container.innerHTML = `
        <div class="w-40 h-40 rounded-full bg-gradient-to-br from-orange-100 to-pink-100 flex items-center justify-center animate-glow">
          <span class="text-6xl">❓</span>

      `;
    }

  // 渲染日记层级树
  function renderDiaryTree() {
    const diaries = getDiaries();
    const tree = {};
    
    diaries.forEach(d => {
      const [year, month, day] = d.date.split('-');
      if (!tree[year]) tree[year] = {};
      if (!tree[year][month]) tree[year][month] = [];
      tree[year][month].push(d);
    });
    
    const container = document.getElementById('diary-tree');
    container.innerHTML = Object.keys(tree).sort((a, b) => b - a).map(year => `
      <div class="mb-2">
        <div class="level-item px-3 py-2 rounded-lg font-bold text-gray-700" onclick="toggleYear('${year}')">📅 ${year}年</div>
        <div id="year-${year}" class="ml-4 mt-2">
          ${Object.keys(tree[year]).sort((a, b) => b - a).map(month => `
            <div class="mb-1">
              <div class="level-item px-3 py-2 rounded-lg text-gray-600" onclick="toggleMonth('${year}-${month}')">📆 ${parseInt(month)}月</div>
              <div id="month-${year}-${month}" class="ml-4 mt-1">
                ${tree[year][month].map(d => `
                  <div class="level-item px-3 py-1 rounded text-sm flex items-center gap-2" onclick="viewDiary('${d.id}')">
                    <span>${d.date.slice(8)}</span>
                    <span>${emotionConfig[d.score].emoji}</span>
                    <span class="line-clamp-1 flex-1">${d.title}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('');
  }

  function toggleYear(year) {
    const el = document.getElementById(`year-${year}`);
    el.style.display = el.style.display === 'none' ? 'block' : 'none';

  function toggleMonth(ym) {
    const el = document.getElementById(`month-${ym}`);
    el.style.display = el.style.display === 'none' ? 'block' : 'none';
  }

  function viewDiary(id) {
    const diaries = getDiaries();

  function playSound(type) {
    if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    
    if (type === 'woodfish') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, audioContext.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, audioContext.currentTime + 0.1);
    } else {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(600, audioContext.currentTime);
      osc.frequency.exponentialRampToValueAtTime(400, audioContext.currentTime + 0.1);
    }
    
    gain.gain.setValueAtTime(0.3, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
    
    osc.connect(gain);
    gain.connect(audioContext.destination);
    osc.start();
    osc.stop(audioContext.currentTime + 0.1);
  }

  // 显示分析
  function showAnalysis(type) {
    const diaries = getDiaries();
    const now = new Date();
    let filteredDiaries;
    
    if (type === 'week') {
      filteredDiaries = diaries.filter(d => {
        const dDate = new Date(d.date);
        const diff = now.getTime() - dDate.getTime();
        return diff < 7 * 24 * 60 * 60 * 1000;
      });
      document.getElementById('btn-week').classList.add('bg-gradient-to-r', 'from-orange-400', 'to-pink-500', 'text-white', 'shadow-lg');
      document.getElementById('btn-week').classList.remove('bg-white/60', 'text-gray-600');
      document.getElementById('btn-month').classList.remove('bg-gradient-to-r', 'from-orange-400', 'to-pink-500', 'text-white', 'shadow-lg');
      document.getElementById('btn-month').classList.add('bg-white/60', 'text-gray-600');
    } else {
      filteredDiaries = diaries.filter(d => {
        const dDate = new Date(d.date);
        return dDate.getMonth() === now.getMonth() && dDate.getFullYear() === now.getFullYear();
      });
      document.getElementById('btn-month').classList.add('bg-gradient-to-r', 'from-orange-400', 'to-pink-500', 'text-white', 'shadow-lg');
      document.getElementById('btn-month').classList.remove('bg-white/60', 'text-gray-600');
      document.getElementById('btn-week').classList.remove('bg-gradient-to-r', 'from-orange-400', 'to-pink-500', 'text-white', 'shadow-lg');
      document.getElementById('btn-week').classList.add('bg-white/60', 'text-gray-600');
    }
    
    if (filteredDiaries.length === 0) {
      document.getElementById('avg-emoji').textContent = '😐';
      document.getElementById('avg-score').textContent = '0';
      document.getElementById('record-days').textContent = '0';
      document.getElementById('trend-icon').textContent = '➡️';
      document.getElementById('trend-text').textContent = '无数据';
      document.getElementById('analysis-summary').textContent = '还没有足够的数据来分析';
      if (chartInstance) chartInstance.destroy();
      return;
    }
    
    const scores = filteredDiaries.map(d => d.score);
    const avgScore = Math.round(scores.reduce((a, b) => a + b, 0) / scores.length);
    const trend = scores.length > 1 ? (scores[0] - scores[scores.length - 1]) : 0;
    
    const config = emotionConfig[avgScore];
    document.getElementById('avg-emoji').textContent = config.emoji;
    document.getElementById('avg-score').textContent = avgScore;
    document.getElementById('record-days').textContent = filteredDiaries.length;
    
    if (trend > 1) {
      document.getElementById('trend-icon').textContent = '📈';
      document.getElementById('trend-text').textContent = '上升';
    } else if (trend < -1) {
      document.getElementById('trend-icon').textContent = '📉';
      document.getElementById('trend-text').textContent = '下降';
    } else {
      document.getElementById('trend-icon').textContent = '➡️';
      document.getElementById('trend-text').textContent = '平稳';
    }
    
    // 分析总结
    let summary = '';
    if (avgScore >= 8) summary = '最近你的心情非常好！继续保持这份快乐，多和朋友分享这份喜悦吧~';
    else if (avgScore >= 6) summary = '最近你的心情比较稳定，保持平和的心态，生活也会更加美好。';
    else if (avgScore >= 4) summary = '最近可能有些压力，记得适当放松自己，给自己一些休息的时间。';
    else summary = '最近你的情绪比较低落，没关系，每个人都会有这样的时候。试着做一些让自己开心的事情吧~';
    document.getElementById('analysis-summary').textContent = summary;
    
    // 绘制图表
    const ctx = document.getElementById('emotion-chart').getContext('2d');
    if (chartInstance) chartInstance.destroy();
    
    const labels = filteredDiaries.map(d => d.date.slice(5));
    const data = filteredDiaries.map(d => d.score);
    
    chartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels.reverse(),
        datasets: [{
          label: '心情分数',
          data: data.reverse(),
          borderColor: '#C6A87D',
          backgroundColor: 'rgba(198,168,125,0.1)',
          borderWidth: 3,
          fill: true,
          tension: 0.4,
          pointBackgroundColor: '#C6A87D',
          pointBorderColor: '#fff',
          pointBorderWidth: 2,
          pointRadius: 6,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { min: 0, max: 11, ticks: { stepSize: 2 } },
          x: { grid: { display: false } }
        }
      }
    });
  }

  // 音频控制
  function toggleAudio() {
    if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
    
    if (isPlaying) {
      rainAudio?.stop();
      isPlaying = false;
      document.getElementById('audio-btn').classList.remove('playing');
    } else {
      playRainSound();
      isPlaying = true;
      document.getElementById('audio-btn').classList.add('playing');
    }
  }

  function playRainSound() {
    const bufferSize = audioContext.sampleRate * 2;
    const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
    const data = buffer.getChannelData(0);
    
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 3);
    }
    
    rainAudio = audioContext.createBufferSource();
    rainAudio.buffer = buffer;
    rainAudio.loop = true;
    
    const gain = audioContext.createGain();
    gain.gain.value = 0.15;
    
    const filter = audioContext.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 1000;
    
    rainAudio.connect(filter);
    filter.connect(gain);
    gain.connect(audioContext.destination);
    rainAudio.start();
  }

    alert('场景音乐功能正在开发中...');
  }

    createParticles();

      if (e.target.tagName !== 'BUTTON') enterMindSpace();
    });
  });
