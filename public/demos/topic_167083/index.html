<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>此刻有趣 - 发现身边的精彩活动</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== 全局样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FF6B35;
            --primary-light: #FF8C5A;
            --primary-dark: #E55A2B;
            --secondary: #FFD23F;
            --accent-green: #7CB518;
            --accent-blue: #3BCEAC;
            --accent-pink: #EE4266;
            --accent-purple: #9B5DE5;

            --bg-main: #FFF8F0;
            --bg-card: #FFFFFF;
            --bg-secondary: #FFF1E6;

            --text-primary: #2D2D2D;
            --text-secondary: #666666;
            --text-muted: #999999;
            --text-light: #FFFFFF;

            --border-color: #F0E6DC;
            --shadow-sm: 0 2px 8px rgba(255, 107, 53, 0.08);
            --shadow-md: 0 4px 16px rgba(255, 107, 53, 0.12);
            --shadow-lg: 0 8px 32px rgba(255, 107, 53, 0.16);

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;

            --font-display: 'ZCOOL KuaiLe', cursive;
            --font-body: 'Noto Sans SC', sans-serif;

            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-main);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* ===== 导航栏 ===== */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            box-shadow: var(--shadow-md);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            cursor: pointer;
            font-size: 18px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateX(-2px);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .logo-icon {
            font-size: 32px;
        }

        .logo-text {
            font-family: var(--font-display);
            font-size: 28px;
            color: white;
            letter-spacing: 2px;
        }

        .nav-search {
            flex: 1;
            max-width: 500px;
            position: relative;
        }

        .nav-search i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .nav-search input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            border: none;
            border-radius: var(--radius-xl);
            background: rgba(255, 255, 255, 0.95);
            font-size: 14px;
            font-family: var(--font-body);
            transition: var(--transition);
            outline: none;
        }

        .nav-search input:focus {
            background: white;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }

        .btn-publish {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: white;
            color: var(--primary);
            border: none;
            border-radius: var(--radius-xl);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font-body);
        }

        .btn-publish:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid white;
            transition: var(--transition);
        }

        .user-avatar:hover {
            transform: scale(1.1);
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ===== 页面容器 ===== */
        .page {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ===== 英雄区域 ===== */
        .hero-section {
            position: relative;
            padding: 60px 0 40px;
            background: linear-gradient(180deg, rgba(255, 107, 53, 0.1) 0%, var(--bg-main) 100%);
            overflow: hidden;
        }

        .hero-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .hero-title {
            font-family: var(--font-display);
            font-size: 48px;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .hero-title .highlight {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent-pink) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-subtitle {
            font-size: 18px;
            color: var(--text-secondary);
        }

        .hero-decoration {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
        }

        .floating-icon {
            position: absolute;
            font-size: 40px;
            opacity: 0.6;
            animation: float 6s ease-in-out infinite;
        }

        .icon-1 { top: 10%; left: 10%; animation-delay: 0s; }
        .icon-2 { top: 20%; right: 15%; animation-delay: 1s; }
        .icon-3 { bottom: 20%; left: 15%; animation-delay: 2s; }
        .icon-4 { bottom: 10%; right: 10%; animation-delay: 3s; }
        .icon-5 { top: 50%; left: 5%; animation-delay: 4s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        /* ===== 区域选择 ===== */
        .location-section {
            margin-top: -20px;
            position: relative;
            z-index: 3;
        }

        .location-selector {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow-md);
        }

        .location-icon {
            color: var(--primary);
            font-size: 20px;
        }

        .location-selector select {
            padding: 10px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--bg-main);
            font-size: 14px;
            font-family: var(--font-body);
            cursor: pointer;
            transition: var(--transition);
            min-width: 120px;
        }

        .location-selector select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        .location-selector select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-locate {
            margin-left: auto;
            padding: 10px 20px;
            background: var(--bg-secondary);
            color: var(--primary);
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 14px;
            font-family: var(--font-body);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-locate:hover {
            background: var(--primary);
            color: white;
        }

        /* ===== 筛选区域 ===== */
        .filter-section {
            padding: 24px 0 16px;
        }

        .filter-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .filter-label {
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 14px;
            flex-shrink: 0;
        }

        .category-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            flex: 1;
        }

        .tag {
            padding: 6px 16px;
            border-radius: var(--radius-xl);
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            user-select: none;
        }

        .tag:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .tag.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .time-filters {
            display: flex;
            gap: 8px;
        }

        .time-tag {
            padding: 6px 16px;
            border-radius: var(--radius-md);
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            user-select: none;
        }

        .time-tag:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .time-tag.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .view-toggle {
            margin-left: auto;
            display: flex;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .view-btn {
            padding: 8px 16px;
            cursor: pointer;
            color: var(--text-muted);
            transition: var(--transition);
        }

        .view-btn.active {
            background: var(--primary);
            color: white;
        }

        .view-btn:hover {
            color: var(--primary);
        }

        .view-btn.active:hover {
            color: white;
        }

        /* ===== 区块标题 ===== */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title {
            font-family: var(--font-display);
            font-size: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .title-icon {
            font-size: 28px;
        }

        .section-more {
            color: var(--primary);
            cursor: pointer;
            font-size: 14px;
            transition: var(--transition);
        }

        .section-more:hover {
            color: var(--primary-dark);
        }

        /* ===== 热门榜单 ===== */
        .hot-section {
            padding: 24px 0;
        }

        .hot-list {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
        }

        .hot-item {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 16px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .hot-item:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .hot-rank {
            position: absolute;
            top: 12px;
            left: 12px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: white;
            z-index: 2;
        }

        .hot-item:nth-child(1) .hot-rank {
            background: linear-gradient(135deg, #FFD700, #FFA500);
        }

        .hot-item:nth-child(2) .hot-rank {
            background: linear-gradient(135deg, #C0C0C0, #A0A0A0);
        }

        .hot-item:nth-child(3) .hot-rank {
            background: linear-gradient(135deg, #CD7F32, #8B4513);
        }

        .hot-item:nth-child(n+4) .hot-rank {
            background: var(--text-muted);
        }

        .hot-item-img {
            width: 100%;
            height: 100px;
            border-radius: var(--radius-md);
            object-fit: cover;
            margin-bottom: 10px;
        }

        .hot-item-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .hot-item-meta {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
        }

        .hot-item-votes {
            color: var(--primary);
            font-weight: 600;
        }

        /* ===== 活动卡片 ===== */
        .activities-section {
            padding: 24px 0 60px;
        }

        .sort-options {
            display: flex;
            gap: 16px;
        }

        .sort-btn {
            font-size: 14px;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }

        .sort-btn.active {
            color: var(--primary);
            font-weight: 600;
        }

        .sort-btn.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--primary);
            border-radius: 2px;
        }

        .activities-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .activity-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }

        .activity-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
        }

        .card-image {
            position: relative;
            height: 180px;
            overflow: hidden;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .activity-card:hover .card-image img {
            transform: scale(1.05);
        }

        .card-category {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 4px 12px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: var(--radius-xl);
            font-size: 12px;
            font-weight: 500;
        }

        .card-free {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 4px 12px;
            background: linear-gradient(135deg, var(--accent-green), #5A9A0F);
            color: white;
            border-radius: var(--radius-xl);
            font-size: 12px;
            font-weight: 600;
        }

        .card-content {
            padding: 16px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 10px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }

        .card-info-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .card-info-item i {
            width: 16px;
            color: var(--primary);
            font-size: 12px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }

        .card-author {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-author img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
        }

        .card-author span {
            font-size: 12px;
            color: var(--text-muted);
        }

        .card-stats {
            display: flex;
            gap: 12px;
        }

        .card-stat {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .card-stat.liked {
            color: var(--accent-pink);
        }

        /* ===== 空状态 ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        /* ===== 地图视图 ===== */
        .map-section {
            padding: 24px 0 60px;
        }

        .map-container {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }

        .map-placeholder {
            height: 500px;
            background: linear-gradient(135deg, #E8F4E8 0%, #D4E8D4 100%);
            position: relative;
            overflow: hidden;
        }

        .map-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.3) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        .map-marker {
            position: absolute;
            width: 36px;
            height: 36px;
            background: var(--primary);
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            cursor: pointer;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .map-marker:hover {
            transform: rotate(-45deg) scale(1.2);
            z-index: 10;
        }

        .map-marker span {
            transform: rotate(45deg);
            font-size: 16px;
        }

        .map-marker.active {
            background: var(--accent-pink);
            transform: rotate(-45deg) scale(1.3);
            z-index: 10;
        }

        .map-popup {
            position: absolute;
            background: white;
            border-radius: var(--radius-md);
            padding: 12px 16px;
            box-shadow: var(--shadow-lg);
            z-index: 20;
            min-width: 200px;
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .popup-content h4 {
            font-size: 14px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .popup-content p {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .popup-content button {
            margin-top: 8px;
            padding: 6px 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 12px;
            font-family: var(--font-body);
        }

        /* ===== 活动详情页 ===== */
        .activity-detail {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 24px 60px;
        }

        .detail-hero {
            position: relative;
            height: 320px;
            border-radius: var(--radius-xl);
            overflow: hidden;
            margin-bottom: 24px;
        }

        .detail-hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .detail-hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.7) 100%);
        }

        .detail-hero-info {
            position: absolute;
            bottom: 24px;
            left: 24px;
            right: 24px;
            color: white;
        }

        .detail-category {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-xl);
            font-size: 13px;
            margin-bottom: 12px;
        }

        .detail-title {
            font-family: var(--font-display);
            font-size: 32px;
            margin-bottom: 8px;
        }

        .detail-author {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .detail-author img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }

        .detail-content {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 24px;
        }

        .detail-main {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-sm);
        }

        .detail-info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 24px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .detail-info-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .detail-info-item i {
            width: 20px;
            color: var(--primary);
            margin-top: 2px;
        }

        .detail-info-item h5 {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .detail-info-item p {
            font-size: 14px;
            font-weight: 500;
        }

        .detail-description h3 {
            font-size: 18px;
            margin-bottom: 12px;
            font-family: var(--font-display);
        }

        .detail-description p {
            color: var(--text-secondary);
            line-height: 1.8;
            white-space: pre-wrap;
        }

        .detail-sidebar {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .action-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: var(--shadow-sm);
        }

        .vote-section {
            text-align: center;
        }

        .vote-section h4 {
            font-size: 16px;
            margin-bottom: 16px;
        }

        .vote-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .vote-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--bg-main);
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font-body);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .vote-btn:hover {
            border-color: var(--primary);
        }

        .vote-btn.voted {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .vote-btn i {
            font-size: 20px;
        }

        .vote-btn span {
            font-size: 12px;
        }

        .vote-count {
            font-size: 14px;
            color: var(--text-muted);
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font-body);
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .action-btn.like {
            background: var(--bg-secondary);
            color: var(--accent-pink);
        }

        .action-btn.like.liked {
            background: var(--accent-pink);
            color: white;
        }

        .action-btn.collect {
            background: var(--bg-secondary);
            color: var(--secondary);
        }

        .action-btn.collect.collected {
            background: var(--secondary);
            color: white;
        }

        .action-btn.share {
            background: var(--bg-secondary);
            color: var(--accent-blue);
        }

        .action-btn:hover {
            transform: translateY(-2px);
        }

        /* ===== 评论区 ===== */
        .comments-section {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-sm);
            margin-top: 24px;
        }

        .comments-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .comments-header h3 {
            font-family: var(--font-display);
            font-size: 20px;
        }

        .comments-count {
            color: var(--text-muted);
            font-size: 14px;
        }

        .comment-input-wrapper {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .comment-input-wrapper img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .comment-input-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .comment-input-box textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            resize: none;
            font-family: var(--font-body);
            font-size: 14px;
            transition: var(--transition);
        }

        .comment-input-box textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        .comment-submit {
            align-self: flex-end;
            padding: 8px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-family: var(--font-body);
            font-size: 14px;
            transition: var(--transition);
        }

        .comment-submit:hover {
            background: var(--primary-dark);
        }

        .comment-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .comment-item {
            display: flex;
            gap: 12px;
        }

        .comment-item img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .comment-content {
            flex: 1;
        }

        .comment-author {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .comment-author-name {
            font-weight: 600;
            font-size: 14px;
        }

        .comment-time {
            font-size: 12px;
            color: var(--text-muted);
        }

        .comment-text {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .comment-actions {
            display: flex;
            gap: 16px;
        }

        .comment-action {
            font-size: 12px;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .comment-action:hover {
            color: var(--primary);
        }

        .comment-action.liked {
            color: var(--accent-pink);
        }

        /* ===== 发布活动页 ===== */
        .publish-container {
            max-width: 700px;
            margin: 0 auto;
            padding: 30px 24px 60px;
        }

        .page-title {
            font-family: var(--font-display);
            font-size: 32px;
            margin-bottom: 24px;
            text-align: center;
        }

        #publishForm {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 32px;
            box-shadow: var(--shadow-sm);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-primary);
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 14px;
            font-family: var(--font-body);
            transition: var(--transition);
            background: var(--bg-main);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        .location-inputs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .location-inputs select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 13px;
            font-family: var(--font-body);
            background: var(--bg-main);
            cursor: pointer;
        }

        .location-inputs select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .location-inputs select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .form-textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 14px;
            font-family: var(--font-body);
            resize: vertical;
            min-height: 120px;
            transition: var(--transition);
            background: var(--bg-main);
        }

        .form-textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        .image-upload {
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-md);
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            background: var(--bg-main);
        }

        .image-upload:hover {
            border-color: var(--primary);
            background: var(--bg-secondary);
        }

        .image-preview {
            color: var(--text-muted);
        }

        .image-preview i {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
            color: var(--primary);
        }

        .image-preview img {
            max-width: 100%;
            max-height: 200px;
            border-radius: var(--radius-md);
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font-body);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        /* ===== 个人主页 ===== */
        .profile-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 24px 60px;
        }

        .profile-header {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 32px;
            display: flex;
            align-items: center;
            gap: 24px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 24px;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid var(--primary);
            flex-shrink: 0;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-info {
            flex: 1;
        }

        .profile-name {
            font-family: var(--font-display);
            font-size: 28px;
            margin-bottom: 4px;
        }

        .profile-bio {
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .profile-stats {
            display: flex;
            gap: 32px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-num {
            display: block;
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            font-family: var(--font-display);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
        }

        .profile-tabs {
            display: flex;
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 8px;
            gap: 8px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
        }

        .profile-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            border-radius: var(--radius-md);
            transition: var(--transition);
            font-weight: 500;
            color: var(--text-secondary);
        }

        .profile-tab:hover {
            color: var(--primary);
        }

        .profile-tab.active {
            background: var(--primary);
            color: white;
        }

        .profile-content {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        /* ===== 返回顶部 ===== */
        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            transition: var(--transition);
            z-index: 50;
        }

        .back-to-top:hover {
            transform: translateY(-4px);
            background: var(--primary-dark);
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            padding: 12px 24px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border-radius: var(--radius-md);
            font-size: 14px;
            z-index: 1000;
            transition: transform 0.3s ease;
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 1024px) {
            .hot-list {
                grid-template-columns: repeat(3, 1fr);
            }

            .activities-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .profile-content {
                grid-template-columns: repeat(2, 1fr);
            }

            .detail-content {
                grid-template-columns: 1fr;
            }

            .detail-sidebar {
                flex-direction: row;
            }

            .action-card {
                flex: 1;
            }
        }

        @media (max-width: 768px) {
            .nav-container {
                padding: 10px 16px;
                gap: 12px;
            }

            .logo-text {
                font-size: 22px;
            }

            .nav-search {
                display: none;
            }

            .btn-publish span {
                display: none;
            }

            .hero-title {
                font-size: 32px;
            }

            .hot-list {
                grid-template-columns: repeat(2, 1fr);
            }

            .activities-grid {
                grid-template-columns: 1fr;
            }

            .profile-content {
                grid-template-columns: 1fr;
            }

            .location-selector {
                flex-wrap: wrap;
            }

            .btn-locate {
                margin-left: 0;
                width: 100%;
                justify-content: center;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .location-inputs {
                grid-template-columns: 1fr;
            }

            .profile-header {
                flex-direction: column;
                text-align: center;
            }

            .profile-stats {
                justify-content: center;
            }

            .detail-title {
                font-size: 24px;
            }

            .detail-info-grid {
                grid-template-columns: 1fr;
            }

            .detail-sidebar {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- 导航栏 -->
        <nav class="navbar">
            <div class="nav-container">
                <button class="back-btn" id="backBtn" onclick="goBack()" style="display:none;">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <div class="logo" onclick="navigate('home')">
                    <span class="logo-icon">🎪</span>
                    <span class="logo-text">此刻有趣</span>
                </div>
                <div class="nav-search">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="搜索活动名称或地点..." onkeyup="handleSearch(event)">
                </div>
                <div class="nav-actions">
                    <button class="btn-publish" onclick="navigate('publish')">
                        <i class="fas fa-plus"></i>
                        发布活动
                    </button>
                    <div class="user-avatar" onclick="navigate('profile')" title="个人中心">
                        <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32fc5?w=200&h=200&fit=crop" alt="用户头像">
                    </div>
                </div>
            </div>
        </nav>

        <!-- 主内容区 -->
        <main id="mainContent">
            <!-- 首页 -->
            <div id="page-home" class="page active">
                <!-- 英雄区域 -->
                <section class="hero-section">
                    <div class="hero-content">
                        <h1 class="hero-title">发现身边的<span class="highlight">精彩时刻</span></h1>
                        <p class="hero-subtitle">探索你所在城市正在发生的有趣活动</p>
                    </div>
                    <div class="hero-decoration">
                        <div class="floating-icon icon-1">🎨</div>
                        <div class="floating-icon icon-2">🎵</div>
                        <div class="floating-icon icon-3">🎭</div>
                        <div class="floating-icon icon-4">🎪</div>
                        <div class="floating-icon icon-5">🎯</div>
                    </div>
                </section>

                <!-- 区域选择 -->
                <section class="location-section">
                    <div class="section-inner">
                    <div class="location-selector">
                        <i class="fas fa-map-marker-alt location-icon"></i>
                        <select id="provinceSelect" onchange="onProvinceChange()">
                            <option value="">选择省份</option>
                        </select>
                        <select id="citySelect" onchange="onCityChange()" disabled>
                            <option value="">选择城市</option>
                        </select>
                        <select id="districtSelect" onchange="onDistrictChange()" disabled>
                            <option value="">选择区县</option>
                        </select>
                        <button class="btn-locate" onclick="useMyLocation()">
                            <i class="fas fa-crosshairs"></i>
                            定位
                        </button>
                    </div>
                    </div>
                </section>

                <!-- 筛选区域 -->
                <section class="filter-section">
                    <div class="section-inner">
                        <div class="filter-row">
                            <div class="filter-label">分类：</div>
                            <div class="category-tags" id="categoryTags">
                                <span class="tag active" data-category="all">全部</span>
                                <span class="tag tag-performance" data-category="演出">🎵 演出</span>
                                <span class="tag tag-exhibition" data-category="展览">🎨 展览</span>
                                <span class="tag tag-market" data-category="市集">🛍️ 市集</span>
                                <span class="tag tag-lecture" data-category="讲座">📚 讲座</span>
                                <span class="tag tag-sports" data-category="运动">⚽ 运动</span>
                                <span class="tag tag-family" data-category="亲子">👨‍👩‍👧 亲子</span>
                                <span class="tag tag-free" data-category="免费福利">🎁 免费福利</span>
                            </div>
                        </div>
                        <div class="filter-row">
                            <div class="filter-label">时间：</div>
                            <div class="time-filters" id="timeFilters">
                                <span class="time-tag active" data-time="all">全部</span>
                                <span class="time-tag" data-time="today">今天</span>
                                <span class="time-tag" data-time="weekend">本周末</span>
                                <span class="time-tag" data-time="week">本周</span>
                            </div>
                            <div class="view-toggle">
                                <span class="view-btn active" data-view="list" onclick="switchView('list')">
                                    <i class="fas fa-th-large"></i>
                                </span>
                                <span class="view-btn" data-view="map" onclick="switchView('map')">
                                    <i class="fas fa-map-marked-alt"></i>
                                </span>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- 热门榜单 -->
                <section class="hot-section">
                    <div class="section-inner">
                        <div class="section-header">
                            <h2 class="section-title">
                                <span class="title-icon">🔥</span>
                                本周最热
                            </h2>
                            <span class="section-more">查看更多 →</span>
                        </div>
                        <div class="hot-list" id="hotList">
                            <!-- 动态渲染 -->
                        </div>
                    </div>
                </section>

                <!-- 活动列表 -->
                <section class="activities-section">
                    <div class="section-inner">
                        <div class="section-header">
                            <h2 class="section-title">
                                <span class="title-icon">✨</span>
                                精彩活动
                            </h2>
                            <div class="sort-options">
                                <span class="sort-btn active" data-sort="hot">最热</span>
                                <span class="sort-btn" data-sort="new">最新</span>
                                <span class="sort-btn" data-sort="time">时间</span>
                            </div>
                        </div>
                        <div class="activities-grid" id="activitiesGrid">
                            <!-- 动态渲染 -->
                        </div>
                        <div class="empty-state" id="emptyState" style="display: none;">
                            <div class="empty-icon">📭</div>
                            <p>暂无活动，快来发布第一个吧！</p>
                        </div>
                    </div>
                </section>

                <!-- 地图视图 -->
                <section class="map-section" id="mapSection" style="display: none;">
                    <div class="section-inner">
                        <div class="map-container">
                            <div class="map-placeholder">
                                <div class="map-grid">
                                    <!-- 动态渲染地图标记 -->
                                </div>
                                <div class="map-popup" id="mapPopup" style="display: none;">
                                    <div class="popup-content">
                                        <h4 id="popupTitle"></h4>
                                        <p id="popupTime"></p>
                                        <p id="popupLocation"></p>
                                        <button onclick="viewActivityFromMap()">查看详情</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <!-- 活动详情页 -->
            <div id="page-activity" class="page">
                <div class="activity-detail" id="activityDetail">
                    <!-- 动态渲染 -->
                </div>
            </div>

            <!-- 发布活动页 -->
            <div id="page-publish" class="page">
                <div class="publish-container">
                    <h1 class="page-title">发布新活动</h1>
                    <form id="publishForm" onsubmit="publishActivity(event)">
                        <div class="form-group">
                            <label class="form-label">活动标题 *</label>
                            <input type="text" id="activityTitle" class="form-input" placeholder="请输入活动标题" required>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">活动分类 *</label>
                                <select id="activityCategory" class="form-input" required>
                                    <option value="">请选择分类</option>
                                    <option value="演出">🎵 演出</option>
                                    <option value="展览">🎨 展览</option>
                                    <option value="市集">🛍️ 市集</option>
                                    <option value="讲座">📚 讲座</option>
                                    <option value="运动">⚽ 运动</option>
                                    <option value="亲子">👨‍👩‍👧 亲子</option>
                                    <option value="免费福利">🎁 免费福利</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">是否免费</label>
                                <select id="activityFree" class="form-input">
                                    <option value="false">付费活动</option>
                                    <option value="true">免费活动</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">活动地点 *</label>
                            <div class="location-inputs">
                                <select id="publishProvince" onchange="onPublishProvinceChange()" required>
                                    <option value="">省份</option>
                                </select>
                                <select id="publishCity" onchange="onPublishCityChange()" disabled required>
                                    <option value="">城市</option>
                                </select>
                                <select id="publishDistrict" disabled required>
                                    <option value="">区县</option>
                                </select>
                            </div>
                            <input type="text" id="activityAddress" class="form-input" placeholder="详细地址" style="margin-top: 10px;" required>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">开始时间 *</label>
                                <input type="datetime-local" id="activityStartTime" class="form-input" required>

                    document.getElementById('citySelect').value = selectedCity;

            for (const city in cities) {
                select.innerHTML += `<option value="${city}">${city}</option>`;

            districts.forEach(district => {

        function initEventListeners() {
            document.querySelectorAll('.tag').forEach(tag => {

        // ===== 路由 =====
        function navigate(page, id = null) {
            if (page === 'activity' && id) {
                window.location.hash = `#/activity/${id}`;
            } else {
                window.location.hash = `#/${page}`;
            }
            window.scrollTo(0, 0);
        }

        function goBack() {
            const hash = window.location.hash || '#/home';
            if (hash === '#/home' || hash === '') {
                return;
            }
            if (hash.startsWith('#/activity/')) {
                navigate('home');
            } else {
                navigate('home');
            }
        }

        function updateBackButton() {
            const hash = window.location.hash || '#/home';
            const backBtn = document.getElementById('backBtn');
            if (backBtn) {
                if (hash === '#/home' || hash === '') {
                    backBtn.style.display = 'none';
                } else {
                    backBtn.style.display = 'flex';
                }
            }
        }

        function handleRoute() {
            const hash = window.location.hash || '#/home';
            const parts = hash.replace('#/', '').split('/');
            const page = parts[0];
            const id = parts[1];

            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            updateBackButton();

            switch(page) {
                case 'home':
                    document.getElementById('page-home').classList.add('active');
                    renderActivities();
                    renderHotList();
                    break;
                case 'activity':
                    document.getElementById('page-activity').classList.add('active');
                    if (id) {
                        currentActivityId = id;
                        renderActivityDetail(id);
                    }
                    break;
                case 'publish':
                    document.getElementById('page-publish').classList.add('active');
                    resetPublishForm();
                    break;
                case 'profile':
                    document.getElementById('page-profile').classList.add('active');
                    renderProfile();
                    break;
                case 'map':
                    document.getElementById('page-home').classList.add('active');
                    switchView('map');
                    break;
                default:
                    document.getElementById('page-home').classList.add('active');
                    renderActivities();
                    renderHotList();
            }
        }

        // ===== 活动筛选 =====
        function filterActivities() {
            let filtered = [...activities];

            if (selectedProvince) {
                filtered = filtered.filter(a => a.province === selectedProvince);
            }
            if (selectedCity) {
                filtered = filtered.filter(a => a.city === selectedCity);
            }
            if (selectedDistrict) {
                filtered = filtered.filter(a => a.district === selectedDistrict);
            }

            if (selectedCategory !== 'all') {
                filtered = filtered.filter(a => a.category === selectedCategory);
            }

            if (selectedTime !== 'all') {
                const now = new Date();
                const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                const todayEnd = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
                const weekStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay());
                const weekEnd = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay() + 7);
                const weekendStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() + (6 - now.getDay()));
                const weekendEnd = new Date(now.getFullYear(), now.getMonth(), now.getDate() + (6 - now.getDay()) + 2);

                filtered = filtered.filter(a => {
                    const startTime = new Date(a.startTime);
                    switch(selectedTime) {
                        case 'today':
                            return startTime >= todayStart && startTime < todayEnd;
                        case 'week':
                            return startTime >= weekStart && startTime < weekEnd;
                        case 'weekend':
                            return startTime >= weekendStart && startTime < weekendEnd;
                        default:
                            return true;
                    }
                });
            }

            if (searchKeyword) {
                const keyword = searchKeyword.toLowerCase();
                filtered = filtered.filter(a =>
                    a.title.toLowerCase().includes(keyword) ||
                    a.address.toLowerCase().includes(keyword) ||
                    a.description.toLowerCase().includes(keyword)
                );
            }

            switch(selectedSort) {
                case 'hot':
                    filtered.sort((a, b) => (b.votes + b.likes) - (a.votes + a.likes));
                    break;
                case 'new':
                    filtered.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                    break;
                case 'time':
                    filtered.sort((a, b) => new Date(a.startTime) - new Date(b.startTime));
                    break;
            }

            return filtered;
        }
