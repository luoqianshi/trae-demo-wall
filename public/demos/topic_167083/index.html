            const categoryEmoji = getCategoryEmoji(activity.category);

            return `
                <div class="activity-card" data-id="${activity.id}">
                    <div class="card-image">
                        <img src="${activity.image}" alt="${activity.title}" onerror="this.src='${activityImages[0]}'">
                        <span class="card-category">${categoryEmoji} ${activity.category}</span>
                        ${activity.isFree ? '<span class="card-free">免费</span>' : ''}
                    </div>
                    <div class="card-content">
                        <h3 class="card-title">${activity.title}</h3>
                        <div class="card-info">
                            <div class="card-info-item">
                                <i class="fas fa-calendar-alt"></i>
                                <span>${formatDate(activity.startTime)}</span>
                            </div>
                            <div class="card-info-item">
                                <i class="fas fa-map-marker-alt"></i>
                                <span>${activity.district} · ${activity.address}</span>
                            </div>
                        </div>
                        <div class="card-footer">
                            <div class="card-author">
                                <img src="${activity.authorAvatar}" alt="${activity.author}">
                                <span>${activity.author}</span>
                            </div>
                            <div class="card-stats">
                                <div class="card-stat ${isLiked ? 'liked' : ''}">
                                    <i class="fas fa-heart"></i>
                                    <span>${activity.likes}</span>
                                </div>
                                <div class="card-stat">
                                    <i class="fas fa-comment"></i>
                                    <span>${activity.comments.length}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function getCategoryEmoji(category) {
            const emojis = {
                '演出': '🎵',
                '展览': '🎨',
                '市集': '🛍️',
                '讲座': '📚',
                '运动': '⚽',
                '亲子': '👨‍👩‍👧',
                '免费福利': '🎁'
            };
            return emojis[category] || '🎉';
        }

        // ===== 热门榜单 =====
        function renderHotList() {
            const hotList = document.getElementById('hotList');
            let hotActivities = [...activities];

            if (selectedCity) {
                hotActivities = hotActivities.filter(a => a.city === selectedCity);
            }

            hotActivities = hotActivities
                .sort((a, b) => (b.votes + b.likes) - (a.votes + a.likes))
                .slice(0, 5);

            if (hotActivities.length === 0) {
                hotList.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 20px; color: var(--text-muted);">暂无热门活动</div>';
                return;
            }

            hotList.innerHTML = hotActivities.map((activity, index) => `
                <div class="hot-item" onclick="navigate('activity', '${activity.id}')">
                    <div class="hot-rank">${index + 1}</div>
                    <img src="${activity.image}" alt="${activity.title}" class="hot-item-img" onerror="this.src='${activityImages[0]}'">
                    <div class="hot-item-title">${activity.title}</div>
                    <div class="hot-item-meta">
                        <span>${activity.district}</span>
                        <span class="hot-item-votes">🔥 ${activity.votes + activity.likes}</span>
                    </div>
                </div>
            `).join('');
        }

        // ===== 搜索 =====
        function handleSearch(event) {
            if (event.key === 'Enter') {
                searchKeyword = event.target.value.trim();
                renderActivities();
            }
        }

        // ===== 视图切换 =====
        function switchView(view) {
            currentView = view;

            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.view === view);
            });

            const activitiesSection = document.querySelector('.activities-section');
            const mapSection = document.getElementById('mapSection');

            if (view === 'map') {
                activitiesSection.style.display = 'none';
                mapSection.style.display = 'block';
                renderMap();
            } else {
                activitiesSection.style.display = 'block';
                mapSection.style.display = 'none';
            }
        }

        // ===== 地图视图 =====
        function renderMap() {
            const mapGrid = document.querySelector('.map-grid');
            const filtered = filterActivities();

            const markers = filtered.map((activity, index) => {
                const x = activity.mapX || (20 + Math.random() * 60);
                const y = activity.mapY || (20 + Math.random() * 60);
                const emoji = getCategoryEmoji(activity.category);
                return `
                    <div class="map-marker" style="left: ${x}%; top: ${y}%; animation-delay: ${index * 0.1}s"
                         data-id="${activity.id}" onclick="showMapPopup(event, '${activity.id}')">
                        <span>${emoji}</span>
                    </div>
                `;
            }).join('');

            mapGrid.innerHTML = markers;
        }

        function showMapPopup(event, activityId) {
            event.stopPropagation();
            selectedMapActivityId = activityId;

            const activity = activities.find(a => a.id === activityId);
            if (!activity) return;

            const popup = document.getElementById('mapPopup');
            const marker = event.currentTarget;

            document.querySelectorAll('.map-marker').forEach(m => m.classList.remove('active'));
            marker.classList.add('active');

            document.getElementById('popupTitle').textContent = activity.title;
            document.getElementById('popupTime').textContent = '🕐 ' + formatDate(activity.startTime);
            document.getElementById('popupLocation').textContent = '📍 ' + activity.address;

            const rect = marker.getBoundingClientRect();
            const mapRect = document.querySelector('.map-placeholder').getBoundingClientRect();

            popup.style.display = 'block';
            popup.style.left = (rect.left - mapRect.left + 20) + 'px';
            popup.style.top = (rect.top - mapRect.top - 10) + 'px';
        }

        function viewActivityFromMap() {
            if (selectedMapActivityId) {
                navigate('activity', selectedMapActivityId);
            }
        }

        document.addEventListener('click', (e) => {
            const popup = document.getElementById('mapPopup');
            if (popup && popup.style.display === 'block' &&
                !e.target.closest('.map-popup') && !e.target.closest('.map-marker')) {
                popup.style.display = 'none';
                document.querySelectorAll('.map-marker').forEach(m => m.classList.remove('active'));
            }
        });

        // ===== 活动详情 =====
        function renderActivityDetail(id) {
            const activity = activities.find(a => a.id === id);
            const container = document.getElementById('activityDetail');

            if (!activity) {
                container.innerHTML = '<div class="empty-state"><div class="empty-icon">😕</div><p>活动不存在</p></div>';
                return;
            }

            const isLiked = activity.likedUsers.includes(currentUser.id);
            const isCollected = activity.collectedUsers.includes(currentUser.id);
            const isVoted = activity.votedUsers.includes(currentUser.id);
            const categoryEmoji = getCategoryEmoji(activity.category);

            container.innerHTML = `
                <div class="detail-hero">
                    <img src="${activity.image}" alt="${activity.title}" onerror="this.src='${activityImages[0]}'">
                    <div class="detail-hero-overlay"></div>
                    <div class="detail-hero-info">
                        <span class="detail-category">${categoryEmoji} ${activity.category}${activity.isFree ? ' · 免费' : ''}</span>
                        <h1 class="detail-title">${activity.title}</h1>
                        <div class="detail-author">
                            <img src="${activity.authorAvatar}" alt="${activity.author}">
                            <span>${activity.author} 发布</span>
                        </div>
                    </div>
                </div>

                <div class="detail-content">
                    <div class="detail-main">
                        <div class="detail-info-grid">
                            <div class="detail-info-item">
                                <i class="fas fa-calendar-alt"></i>
                                <div>
                                    <h5>活动时间</h5>
                                    <p>${formatDate(activity.startTime)} - ${formatDate(activity.endTime).split(' ')[1]}</p>
                                </div>
                            </div>
                            <div class="detail-info-item">
                                <i class="fas fa-map-marker-alt"></i>
                                <div>
                                    <h5>活动地点</h5>
                                    <p>${activity.province} ${activity.city} ${activity.district}</p>
                                    <p>${activity.address}</p>
                                </div>
                            </div>
                        </div>

                        <div class="detail-description">
                            <h3>活动详情</h3>
                            <p>${activity.description.replace(/\n/g, '<br>')}</p>
                        </div>
                    </div>

                    <div class="detail-sidebar">
                        <div class="action-card vote-section">
                            <h4>这个活动有意思吗？</h4>
                            <div class="vote-buttons">
                                <button class="vote-btn ${isVoted ? 'voted' : ''}" onclick="toggleVote('${activity.id}')">
                                    <i class="fas fa-thumbs-up"></i>
                                    <span>有意思</span>
                                </button>
                            </div>
                            <p class="vote-count">已有 ${activity.votes} 人投票</p>
                        </div>

                        <div class="action-card">
                            <div class="action-buttons">
                                <button class="action-btn like ${isLiked ? 'liked' : ''}" onclick="toggleLike('${activity.id}')">
                                    <i class="fas fa-heart"></i>
                                    <span>${activity.likes}</span>
                                </button>
                                <button class="action-btn collect ${isCollected ? 'collected' : ''}" onclick="toggleCollect('${activity.id}')">
                                    <i class="fas fa-star"></i>
                                    <span>收藏</span>
                                </button>
                                <button class="action-btn share" onclick="shareActivity('${activity.id}')">
                                    <i class="fas fa-share-alt"></i>
                                    <span>分享</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="comments-section">
                    <div class="comments-header">
                        <h3>💬 讨论区</h3>
                        <span class="comments-count">${activity.comments.length} 条评论</span>
                    </div>

                    <div class="comment-input-wrapper">
                        <img src="${currentUser.avatar}" alt="${currentUser.nickname}">
                        <div class="comment-input-box">
                            <textarea id="commentInput" placeholder="说说你的看法..." rows="2"></textarea>
                            <button class="comment-submit" onclick="submitComment('${activity.id}')">发表评论</button>
                        </div>
                    </div>

                    <div class="comment-list" id="commentList">
                        ${activity.comments.map(comment => createCommentHTML(comment)).join('')}
                    </div>
                </div>
            `;
        }

        function createCommentHTML(comment) {
            const isLiked = false;
            return `
                <div class="comment-item">
                    <img src="${comment.avatar}" alt="${comment.author}">
                    <div class="comment-content">
                        <div class="comment-author">
                            <span class="comment-author-name">${comment.author}</span>
                            <span class="comment-time">${formatDate(comment.createdAt)}</span>
                        </div>
                        <p class="comment-text">${comment.content}</p>
                        <div class="comment-actions">
                            <span class="comment-action ${isLiked ? 'liked' : ''}" onclick="likeComment(this)">
                                <i class="fas fa-thumbs-up"></i>
                                <span>${comment.likes}</span>
                            </span>
                            <span class="comment-action">
                                <i class="fas fa-reply"></i>
                                回复
                            </span>
                        </div>
                    </div>
                </div>
            `;
        }

        // ===== 互动功能 =====
        function toggleVote(activityId) {
            const activity = activities.find(a => a.id === activityId);
            if (!activity) return;

            const userIndex = activity.votedUsers.indexOf(currentUser.id);
            if (userIndex > -1) {
                activity.votedUsers.splice(userIndex, 1);
                activity.votes--;
                showToast('已取消投票');
            } else {
                activity.votedUsers.push(currentUser.id);
                activity.votes++;
                showToast('投票成功！感谢参与');
            }

            saveActivities();
            renderActivityDetail(activityId);
            renderHotList();
        }

        function toggleLike(activityId) {
            const activity = activities.find(a => a.id === activityId);
            if (!activity) return;

            const userIndex = activity.likedUsers.indexOf(currentUser.id);
            if (userIndex > -1) {
                activity.likedUsers.splice(userIndex, 1);
                activity.likes--;
            } else {
                activity.likedUsers.push(currentUser.id);
                activity.likes++;
            }

            saveActivities();

            if (currentActivityId === activityId) {
                renderActivityDetail(activityId);
            }
            renderActivities();
            renderHotList();
        }

        function toggleCollect(activityId) {
            const activity = activities.find(a => a.id === activityId);
            if (!activity) return;

            const userIndex = activity.collectedUsers.indexOf(currentUser.id);
            const userCollectIndex = currentUser.collectedActivities.indexOf(activityId);

            if (userIndex > -1) {
                activity.collectedUsers.splice(userIndex, 1);
                currentUser.collectedActivities.splice(userCollectIndex, 1);
                showToast('已取消收藏');
            } else {
                activity.collectedUsers.push(currentUser.id);
                currentUser.collectedActivities.push(activityId);
                showToast('收藏成功！');
            }

            saveActivities();
            saveUser();
            renderActivityDetail(activityId);
        }

        function shareActivity(activityId) {
            showToast('分享链接已复制到剪贴板');
        }

        function submitComment(activityId) {
            const input = document.getElementById('commentInput');
            const content = input.value.trim();

            if (!content) {
                showToast('请输入评论内容');
                return;
            }

            const activity = activities.find(a => a.id === activityId);
            if (!activity) return;

            const newComment = {
                id: 'c_' + Date.now(),
                activityId: activityId,
                author: currentUser.nickname,
                avatar: currentUser.avatar,
                content: content,
                createdAt: new Date().toISOString(),
                likes: 0,
                replyTo: null
            };

            activity.comments.unshift(newComment);

            if (!currentUser.commentedActivities.includes(activityId)) {
                currentUser.commentedActivities.push(activityId);
            }

            saveActivities();
            saveUser();
            renderActivityDetail(activityId);
            showToast('评论成功！');
        }

        function likeComment(element) {
            element.classList.toggle('liked');
            const countSpan = element.querySelector('span');
            let count = parseInt(countSpan.textContent);
            if (element.classList.contains('liked')) {
                count++;
            } else {
                count--;
            }
            countSpan.textContent = count;
        }

        // ===== 发布活动 =====
        function resetPublishForm() {
            document.getElementById('publishForm').reset();
            uploadedImage = null;
            const preview = document.getElementById('imagePreview');
            preview.innerHTML = `
                <i class="fas fa-cloud-upload-alt"></i>
                <p>点击上传封面图片</p>
            `;

            const citySelect = document.getElementById('publishCity');
            const districtSelect = document.getElementById('publishDistrict');
            citySelect.innerHTML = '<option value="">城市</option>';
            citySelect.disabled = true;
            districtSelect.innerHTML = '<option value="">区县</option>';
            districtSelect.disabled = true;
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                uploadedImage = e.target.result;
                const preview = document.getElementById('imagePreview');
                preview.innerHTML = `<img src="${uploadedImage}" alt="预览">`;
            };
            reader.readAsDataURL(file);
        }

        function publishActivity(event) {
            event.preventDefault();

            const title = document.getElementById('activityTitle').value.trim();
            const category = document.getElementById('activityCategory').value;
            const province = document.getElementById('publishProvince').value;
            const city = document.getElementById('publishCity').value;
            const district = document.getElementById('publishDistrict').value;
            const address = document.getElementById('activityAddress').value.trim();
            const startTime = document.getElementById('activityStartTime').value;
            const endTime = document.getElementById('activityEndTime').value;
            const description = document.getElementById('activityDescription').value.trim();
            const isFree = document.getElementById('activityFree').value === 'true';

            if (!title || !category || !province || !city || !district || !address || !startTime || !endTime || !description) {
                showToast('请填写所有必填项');
                return;
            }

            if (new Date(endTime) <= new Date(startTime)) {
                showToast('结束时间必须晚于开始时间');
                return;
            }

            const newActivity = {
                id: 'act_' + Date.now(),
                title: title,
                category: category,
                province: province,
                city: city,
                district: district,
                address: address,
                startTime: new Date(startTime).toISOString(),
                endTime: new Date(endTime).toISOString(),
                image: uploadedImage || activityImages[Math.floor(Math.random() * activityImages.length)],
                description: description,
                author: currentUser.nickname,
                authorAvatar: currentUser.avatar,
                likes: 0,
                votes: 0,
                votedUsers: [],
                likedUsers: [],
                collectedUsers: [],
                createdAt: new Date().toISOString(),
                isFree: isFree,
                mapX: 20 + Math.random() * 60,
                mapY: 20 + Math.random() * 60,
                comments: []
            };

            activities.unshift(newActivity);
            currentUser.publishedActivities.push(newActivity.id);

            saveActivities();
            saveUser();
            showToast('活动发布成功！');

            setTimeout(() => {
                navigate('activity', newActivity.id);
            }, 1000);
        }

        // ===== 个人主页 =====
        function switchProfileTab(tab) {
            currentProfileTab = tab;
            document.querySelectorAll('.profile-tab').forEach(t => {
                t.classList.toggle('active', t.dataset.tab === tab);
            });
            renderProfileContent();
        }

        function renderProfile() {
            document.getElementById('profileName').textContent = currentUser.nickname;
            document.getElementById('statPublished').textContent = currentUser.publishedActivities.length;
            document.getElementById('statCommented').textContent = currentUser.commentedActivities.length;
            document.getElementById('statCollected').textContent = currentUser.collectedActivities.length;
            renderProfileContent();
        }

        function renderProfileContent() {
            const container = document.getElementById('profileContent');
            let activityIds = [];

            switch(currentProfileTab) {
                case 'published':
                    activityIds = currentUser.publishedActivities;
                    break;
                case 'commented':
                    activityIds = currentUser.commentedActivities;
                    break;
                case 'collected':
                    activityIds = currentUser.collectedActivities;
                    break;
            }

            const userActivities = activities.filter(a => activityIds.includes(a.id));

            if (userActivities.length === 0) {
                const messages = {
                    published: '还没有发布过活动，快去发布第一个吧！',
                    commented: '还没有评论过活动',
                    collected: '还没有收藏的活动'
                };
                container.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">
                        <div style="font-size: 48px; margin-bottom: 12px;">📭</div>
                        <p>${messages[currentProfileTab]}</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = userActivities.map(activity => createActivityCard(activity)).join('');

            container.querySelectorAll('.activity-card').forEach(card => {
                card.addEventListener('click', () => {
                    navigate('activity', card.dataset.id);
                });
            });
        }

        // ===== 滚动效果 =====
        function handleScroll() {
            const backToTop = document.getElementById('backToTop');
            if (window.scrollY > 300) {
                backToTop.style.display = 'block';
            } else {
                backToTop.style.display = 'none';
            }
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ===== Toast =====
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // ===== 启动 =====
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
