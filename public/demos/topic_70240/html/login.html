<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 物理派</title>
    <style>
        :root {
            --primary: #3B82F6;
            --primary-light: #93C5FD;
            --primary-dark: #1D4ED8;
            --energy-orange: #F59E0B;
            --experiment-green: #10B981;
            --alert-red: #EF4444;
            --bg-white: #F8FAFC;
            --card-white: #FFFFFF;
            --light-gray: #F1F5F9;
            --mid-gray: #94A3B8;
            --dark-gray: #475569;
            --title-black: #1E293B;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            background: var(--bg-white);
            color: var(--dark-gray);
            min-height: 100vh;
            display: flex;
        }

        /* ===== 左侧品牌区 ===== */
        .brand-side {
            flex: 1;
            background: linear-gradient(135deg, #1E40AF, #3B82F6, #7C3AED);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .brand-side::before {
            content: '';
            position: absolute;
            width: 300px; height: 300px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            top: -80px; right: -80px;
        }

        .brand-side::after {
            content: '';
            position: absolute;
            width: 200px; height: 200px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            bottom: -40px; left: -40px;
        }

        .brand-logo {
            font-size: 48px;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }

        .brand-side h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }

        .brand-side p {
            font-size: 15px;
            opacity: 0.85;
            position: relative;
            z-index: 1;
            text-align: center;
            line-height: 1.8;
        }

        .brand-features {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            z-index: 1;
        }

        .brand-features span {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            opacity: 0.9;
        }

        /* ===== 右侧表单区 ===== */
        .form-side {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px;
        }

        .form-card {
            width: 100%;
            max-width: 400px;
        }

        .form-card .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 32px;
            border-bottom: 2px solid var(--light-gray);
        }

        .form-card .tab {
            flex: 1;
            padding: 12px 0;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            color: var(--mid-gray);
            cursor: pointer;
            border: none;
            background: none;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
        }

        .form-card .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .form-card .tab:hover { color: var(--primary); }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--dark-gray);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            height: 44px;
            padding: 0 14px;
            border: 1.5px solid #E2E8F0;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s;
            outline: none;
            background: var(--card-white);
        }

        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
        }

        .form-group input::placeholder { color: var(--mid-gray); }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .form-options label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--dark-gray);
            cursor: pointer;
        }

        .form-options a {
            color: var(--primary);
            text-decoration: none;
        }

        .form-options a:hover { text-decoration: underline; }

        .btn-login {
            width: 100%;
            height: 48px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-login:hover { background: var(--primary-dark); transform: translateY(-1px); }

        .btn-login:active { transform: translateY(0); }

        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 24px 0;
            color: var(--mid-gray);
            font-size: 13px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--light-gray);
        }

        .social-login {
            display: flex;
            gap: 12px;
        }

        .social-btn {
            flex: 1;
            height: 44px;
            border: 1.5px solid var(--light-gray);
            border-radius: 10px;
            background: var(--card-white);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .social-btn:hover { border-color: var(--primary-light); background: var(--bg-white); }

        .register-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: var(--mid-gray);
        }

        .register-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover { text-decoration: underline; }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .brand-side { padding: 32px 24px; min-height: 200px; }
            .brand-side h1 { font-size: 24px; }
            .brand-features { display: none; }
            .form-side { padding: 32px 24px; }
        }
    </style>
</head>
<body>

    <!-- ===== 左侧品牌展示 ===== -->
    <div class="brand-side">
        <div class="brand-logo">⚛</div>
        <h1>物理派</h1>
        <p>爱上物理，从这里开始</p>
        <div class="brand-features">
            <span>✅ 500+ 交互虚拟实验</span>
            <span>✅ AI 智能学习诊断</span>
            <span>✅ 个性化学习路径推荐</span>
            <span>✅ 游戏化积分成就系统</span>
        </div>
    </div>

    <!-- ===== 右侧登录表单 ===== -->
    <div class="form-side">
        <div class="form-card">
            <div class="tabs">
                <button class="tab active">登录</button>
                <button class="tab">注册</button>
            </div>

            <form onsubmit="return false;">
                <div class="form-group">
                    <label>手机号 / 邮箱</label>
                    <input type="text" placeholder="请输入手机号或邮箱">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" placeholder="请输入密码">
                </div>

                <div class="form-options">
                    <label><input type="checkbox" checked> 记住我</label>
                    <a href="#">忘记密码？</a>
                </div>

                <button class="btn-login">登录</button>
            </form>

            <div class="divider">或使用第三方登录</div>

            <div class="social-login">
                <button class="social-btn">💬 微信</button>
                <button class="social-btn">🐧 QQ</button>
            </div>

            <div class="register-link">
                还没有账号？<a href="#">立即注册 →</a>
            </div>
        </div>
    </div>

</body>
</html>
