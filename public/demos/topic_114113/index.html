<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>老黄历 - 黄道吉日查询</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="cordova.js"></script>
    <script src="lib/lunar.js?v=3"></script>
    <script src="js/calendar.js?v=3"></script>
    <script src="js/ui.js?v=3"></script>
    <script src="js/voice.js?v=3"></script>
    <script src="js/app.js?v=3"></script>
</head>
<body class="theme-yellow">
    <header class="app-header">
        <div class="header-left">
            <button class="icon-btn" id="settingsBtn">⚙</button>
        </div>
        <div>
            <h1 class="app-title">老黄历</h1>
        </div>
        <div class="header-right">
            <span class="shengxiao-icon" id="shengxiaoIcon">🐯</span>
        </div>
    </header>

    <main class="main-content">
        <section class="date-section">
            <div class="solar-date">
                <div class="date-year" id="dateYear">2024年</div>
                <div class="date-month-day" id="dateMonthDay">01月01日</div>
                <div class="date-week" id="dateWeek">星期一</div>
            </div>
            <div class="lunar-date">
                <div class="lunar-month-day" id="lunarMonthDay">腊月初四</div>
                <div class="lunar-ganzhi" id="lunarGanzhi">甲辰年 丙子月 己亥日</div>
            </div>
            <div id="jieqiBadge"></div>
            <div id="jieqiTimeBadge"></div>
            <div id="festivalBadge"></div>
        </section>

        <section class="date-nav">
            <button class="nav-btn" id="prevDayBtn">◀</button>
            <button class="today-btn" id="todayBtn">回到今天</button>
            <button class="nav-btn" id="nextDayBtn">▶</button>
            <button class="nav-btn calendar-btn" id="calendarBtn">📅</button>
        </section>

        <section class="yiji-section">
            <div class="yiji-panel yi-panel">
                <div class="yiji-header">
                    <div class="yiji-icon yi-icon">✓</div>
                    <h2 class="yiji-title">宜</h2>
                </div>
                <div class="yiji-grid" id="yiGrid"></div>
            </div>
            <div class="yiji-panel ji-panel">
                <div class="yiji-header">
                    <div class="yiji-icon ji-icon">✕</div>
                    <h2 class="yiji-title">忌</h2>
                </div>
                <div class="yiji-grid" id="jiGrid"></div>
            </div>
        </section>

        <section class="jishi-section">
            <div class="section-header">
                <span class="section-icon">⏰</span>
                <h2 class="section-title">今日吉时</h2>
            </div>
            <button class="jishi-toggle" id="jishiToggle">展开全部时辰</button>
            <div class="jishi-list" id="jishiList"></div>
        </section>

        <section class="compass-section">
            <div class="section-header">
                <span class="section-icon">🧭</span>
                <h2 class="section-title">财神喜神方位</h2>
            </div>
            <div class="compass-container">
                <svg viewBox="0 0 200 200">
                    <circle cx="100" cy="100" r="90" fill="#fff9e6" stroke="#dcdcdc" stroke-width="3"/>
                    <circle cx="100" cy="100" r="70" fill="none" stroke="#dcdcdc" stroke-width="2"/>
                    <line x1="100" y1="10" x2="100" y2="190" stroke="#dcdcdc" stroke-width="1"/>
                    <line x1="10" y1="100" x2="190" y2="100" stroke="#dcdcdc" stroke-width="1"/>
                    <text x="100" y="28" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">北</text>
                    <text x="100" y="182" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">南</text>
                    <text x="28" y="106" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">西</text>
                    <text x="172" y="106" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">东</text>
                    <circle id="caishenPos" cx="100" cy="100" r="8" fill="#ff6600"/>
                    <circle id="xishenPos" cx="100" cy="100" r="8" fill="#ff0000"/>
                    <circle id="fushenPos" cx="100" cy="100" r="8" fill="#006600"/>
                </svg>
            </div>
            <div class="fangwei-legend">
                <div class="fangwei-item">
                    <div class="fangwei-dot" style="background:#ff6600"></div>
                    <span>财神：<strong id="caishenText">正东</strong></span>
                </div>
                <div class="fangwei-item">
                    <div class="fangwei-dot" style="background:#ff0000"></div>
                    <span>喜神：<strong id="xishenText">正南</strong></span>
                </div>
                <div class="fangwei-item">
                    <div class="fangwei-dot" style="background:#006600"></div>
                    <span>福神：<strong id="fushenText">西北</strong></span>
                </div>
            </div>
        </section>

        <section class="detail-section">
            <div class="section-header">
                <span class="section-icon">📋</span>
                <h2 class="section-title">今日详情</h2>
            </div>
            <div class="detail-grid">
                <div class="detail-item">
                    <div class="detail-label">冲煞</div>
                    <div class="detail-value" id="chongshaText">冲猪煞东</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">胎神</div>
                    <div class="detail-value" id="taishenText">仓库床外东北</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">五行</div>
                    <div class="detail-value" id="wuxingText">平地木</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">纳音</div>
                    <div class="detail-value" id="nayinText">乙亥</div>
                </div>
                <div class="detail-item detail-full">
                    <div class="detail-label">彭祖百忌</div>
                    <div class="detail-value" id="pengzuText">己不破券二比并亡 亥不嫁娶不利新郎</div>
                </div>
            </div>
        </section>

        <section class="giri-section">
            <div class="section-header">
                <span class="section-icon">🎯</span>
                <h2 class="section-title">黄道吉日查询</h2>
            </div>
            <div class="giri-selector" id="giriSelector"></div>
            <div class="giri-result" id="giriResult"></div>
        </section>

        <section class="voice-section">
            <button class="speak-btn" id="speakBtn">
                <span>🔊</span>
                <span>语音播报今日黄历</span>
            </button>
            
        </section>

        <section class="operation-guide">
            <h3>操作提示</h3>
            <p>⬅ ➡ 点击切换日期 | 🔊 点喇叭听黄历 | 🎯 点吉日挑好日子</p>
        </section>
    </main>

    <div class="font-toggle-bar">
        <button class="font-toggle-btn" id="fontNormalBtn" data-font="normal">标准</button>
        <button class="font-toggle-btn" id="fontLargeBtn" data-font="large">大字</button>
        <button class="font-toggle-btn" id="fontXLargeBtn" data-font="xlarge">特大</button>
    </div>

    <div class="calendar-overlay" id="calendarOverlay" style="display:none">
        <div class="calendar-panel">
            <div class="calendar-header">
                <button class="calendar-nav-btn" id="calendarPrevMonth">◀</button>
                <span class="calendar-title" id="calendarTitle">2026年7月</span>
                <button class="calendar-nav-btn" id="calendarNextMonth">▶</button>
                <button class="calendar-close" id="calendarClose">✕</button>
            </div>
            <div class="calendar-weekdays">
                <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
            </div>
            <div class="calendar-days" id="calendarDays"></div>
        </div>
    </div>

    <div class="settings-overlay" id="settingsOverlay" style="display:none">
        <div class="settings-panel">
            <div class="settings-header">
                <h2>设置</h2>
                <button class="close-btn" id="closeSettingsBtn">×</button>
            </div>
            <div class="setting-group">
                <div class="setting-label">语音语速</div>
                <div class="setting-options">
                    <button class="option-btn" data-rate="0.6">慢</button>
                    <button class="option-btn active" data-rate="0.85">适中</button>
                    <button class="option-btn" data-rate="1.1">快</button>
                </div>
            </div>
            <div class="setting-group">
                <div class="setting-label">语音性别</div>
                <div class="setting-options">
                    <button class="option-btn" data-gender="male">男声</button>
                    <button class="option-btn active" data-gender="female">女声</button>
                </div>
            </div>
            <div class="setting-group">
                <div class="setting-label">背景颜色</div>
                <div class="setting-options">
                    <button class="option-btn active" data-theme="yellow">浅米黄</button>
                    <button class="option-btn" data-theme="white">纯白色</button>
                </div>
            </div>
            <div class="setting-group">
                <div class="setting-label">纪念日提醒</div>
                <div class="setting-options">
                    <button class="option-btn active" data-reminder="on">开启</button>
                    <button class="option-btn" data-reminder="off">关闭</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
