<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>情绪日记 - 创作</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .back-btn svg {
            width: 22px;
            height: 22px;
            fill: #fff;
        }

        .date-display {
            font-size: 15px;
            font-weight: 500;
            color: #fff;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-btn {
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-save {
            background: linear-gradient(135deg, #2196f3 0%, #1976d2 100%);
            color: #fff;
        }

        .btn-save:hover {
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.4);
        }

        .btn-clear {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .btn-analysis {
            background: linear-gradient(135deg, #9c27b0 0%, #7b1fa2 100%);
            color: #fff;
        }

        .btn-analysis:hover {
            box-shadow: 0 4px 12px rgba(156, 39, 176, 0.4);
        }

        .btn-clear:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .view-mode .btn-save,
        .view-mode .btn-clear {
            display: none;
        }

        .canvas-container {
            position: fixed;
            top: 56px;
            left: 0;
            right: 0;
            bottom: 70px;
            background: #fff;
            overflow: hidden;
        }

        #drawingCanvas {
            position: absolute;
            top: 0;
            left: 0;
            touch-action: none;
        }

        .toolbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 8px;
            overflow-x: auto;
        }

        .toolbar::-webkit-scrollbar {
            display: none;
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 8px;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tool-group:last-child {
            border-right: none;
        }

        .tool-btn {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .tool-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .tool-btn.active {
            background: #2196f3;
        }

        .tool-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .color-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .color-btn:hover {
            transform: scale(1.1);
        }

        .color-btn.active {
            border-color: #fff;
            box-shadow: 0 0 0 2px #2196f3;
        }

        .size-slider {
            width: 80px;
            height: 4px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            outline: none;
        }

        .size-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
        }

        .login-prompt {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #e8f4fc 0%, #d4e8f7 50%, #c5ddf2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }

        .login-prompt .logo {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #2196f3 0%, #1976d2 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }

        .login-prompt .logo svg {
            width: 40px;
            height: 40px;
            fill: #fff;
        }

        .login-prompt h2 {
            font-size: 22px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .login-prompt p {
            font-size: 14px;
            color: #666;
            margin-bottom: 28px;
        }

        .login-prompt .btn {
            padding: 14px 32px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2196f3 0%, #1976d2 100%);
            color: #fff;
        }

        .btn-primary:hover {
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.3);
            transform: translateY(-1px);
        }

        .toast {
            position: fixed;
            top: 72px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: #43a047;
            color: #fff;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 4px 12px rgba(67, 160, 71, 0.3);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 150;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .analysis-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .analysis-modal.show {
            display: flex;
        }

        .analysis-content {
            background: #1a1a2e;
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 24px;
        }

        .analysis-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .analysis-header h3 {
            color: #fff;
            font-size: 18px;
        }

        .analysis-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }

        .analysis-loading {
            text-align: center;
            padding: 40px 0;
        }

        .analysis-loading .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #c9a86c;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .analysis-loading p {
            color: #a0a0a0;
            font-size: 14px;
        }

        .analysis-result {
            display: none;
        }

        .analysis-result.show {
            display: block;
        }

        .result-section {
            margin-bottom: 20px;
        }

        .result-section h4 {
            color: #c9a86c;
            font-size: 15px;
            margin-bottom: 8px;
        }

        .result-section p {
            color: #e0e0e0;
            font-size: 14px;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .tool-group {
                padding: 0 6px;
            }

            .tool-btn {
                width: 40px;
                height: 40px;
            }

            .color-btn {
                width: 28px;
                height: 28px;
            }

            .size-slider {
                width: 60px;
            }
        }

        .music-recommendation {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #e8f4fc;
        }

        .music-recommendation-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            padding: 12px 16px;
            background: linear-gradient(135deg, #f3e8ff 0%, #e8f4fc 100%);
            border-radius: 12px;
            border: 1px solid rgba(139, 92, 246, 0.1);
        }

        .music-recommendation-icon {
            font-size: 24px;
        }

        .music-recommendation-title {
            font-size: 16px;
            font-weight: 600;
            color: #7c3aed;
            margin: 0;
            letter-spacing: 0.5px;
        }

        .ai-badge {
            font-size: 11px;
            padding: 3px 8px;
            background: linear-gradient(135deg, #a78bfa 0%, #8b5cf6 100%);
            color: #fff;
            border-radius: 12px;
            font-weight: 500;
            margin-left: auto;
            box-shadow: 0 2px 8px rgba(139, 92, 246, 0.3);
        }

        .music-category-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .music-category-tab {
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            border: 1.5px solid #e0e0e0;
            background: #fff;
            color: #666;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .music-category-tab:hover {
            border-color: #2196f3;
            color: #2196f3;
        }

        .music-category-tab.active {
            background: linear-gradient(135deg, #2196f3 0%, #1976d2 100%);
            color: #fff;
            border-color: #2196f3;
        }

        .music-player-container {
            background: linear-gradient(135deg, #f8fbff 0%, #e8f4fc 100%);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .music-player-title {
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .music-player-title .music-icon {
            font-size: 16px;
        }

        .music-player iframe {
            width: 100%;
            border-radius: 12px;
            background: #fff;
        }

        .music-description {
            font-size: 13px;
            color: #888;
            margin-bottom: 16px;
            font-style: italic;
        }

        .music-tip {
            background: #fff;
            border-radius: 12px;
            padding: 12px 16px;
            margin-top: 12px;
            border-left: 3px solid #2196f3;
        }

        .music-tip-title {
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .music-tip-text {
            font-size: 12px;
            color: #666;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="login-prompt" id="loginPrompt" style="display: none;">
        <div class="logo">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        </div>
        <h2>请先登录</h2>
        <p>登录后可创作和保存你的情绪日记</p>
        <a href="auth.html" class="btn btn-primary">前往登录</a>
    </div>

    <div id="appContainer" style="display: none;">
        <header class="header">
            <div class="header-left">
                <button class="back-btn" onclick="goBack()">
                    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                </button>
                <span class="date-display" id="dateDisplay"></span>
            </div>
            <div class="header-right" id="headerRight">
                <button class="header-btn btn-clear" onclick="clearCanvas()">清空</button>
                <button class="header-btn btn-save" onclick="saveDrawing()">保存</button>
            </div>
        </header>

        <div class="canvas-container">
            <canvas id="drawingCanvas"></canvas>
        </div>

        <div class="toolbar" id="toolbar">
            <div class="tool-group">
                <button class="tool-btn active" data-tool="pen" title="画笔">
                    <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                </button>
                <button class="tool-btn" data-tool="marker" title="马克笔">
                    <svg viewBox="0 0 24 24"><path d="M18.5 1.15c-.53 0-1.04.2-1.41.59l-8.46 8.46a2 2 0 0 0 0 2.83l3.54 3.53c.28.28.67.41 1.06.38.38-.03.77-.22 1.06-.51l8.3-8.29c.78-.78.78-2.05 0-2.83l-3.54-3.53c-.37-.38-.88-.59-1.41-.59h-.04z"/></svg>
                </button>
                <button class="tool-btn" data-tool="spray" title="喷枪">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/></svg>
                </button>
                <button class="tool-btn" data-tool="eraser" title="橡皮">
                    <svg viewBox="0 0 24 24"><path d="M15.14 3c-.51 0-1.02.2-1.41.59L2.59 14.73c-.78.78-.78 2.05 0 2.83l3.54 3.53c.39.39.9.59 1.41.59h7.46c.51 0 1.02-.2 1.41-.59l8.27-8.27c.78-.78.78-2.05 0-2.83L16.56 3.59c-.39-.39-.9-.59-1.42-.59h.01z"/></svg>
                </button>
            </div>

            <div class="tool-group" id="colorGroup">
            </div>

            <div class="tool-group">
                <input type="range" class="size-slider" id="sizeSlider" min="1" max="30" value="4">
            </div>
        </div>

        <div class="toast" id="toast"></div>

        <div class="analysis-modal" id="analysisModal">
            <div class="analysis-content">
                <div class="analysis-header">
                    <h3>🎨 AI 情绪分析</h3>
                    <button class="analysis-close" onclick="closeAnalysis()">×</button>
                </div>
                <div class="analysis-loading" id="analysisLoading">
                    <div class="loading-spinner"></div>
                    <p>正在分析您的画作...</p>
                </div>
                <div class="analysis-result" id="analysisResult">
                    <div class="result-section">
                        <h4>🖼️ 画面内容</h4>
                        <p id="analysisContent"></p>
                    </div>
                    <div class="result-section">
                        <h4>💭 情绪解读</h4>
                        <p id="analysisEmotion"></p>
                    </div>
                    <div class="result-section">
                        <h4>💡 疏导建议</h4>
                        <p id="analysisAdvice"></p>
                    </div>
                    <div class="music-recommendation" id="musicRecommendation">
                        <div class="music-recommendation-header">
                            <span class="music-recommendation-icon">🧠</span>
                            <h4 class="music-recommendation-title">AI 智能推荐音乐</h4>
                            <span class="ai-badge">AI</span>
                        </div>
                        <div class="music-category-tabs" id="musicCategoryTabs"></div>
                        <div class="music-description" id="musicDescription"></div>
                        <div id="musicPlayers"></div>
                        <div class="music-tip">
                            <div class="music-tip-title">
                                <span>💡</span>
                                <span>温馨提示</span>
                            </div>
                            <p class="music-tip-text">音乐可以很好地调节情绪。您可以点击上方的标签切换不同风格的音乐，找到最适合自己的旋律。</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

        function initCanvas() {

            const dpr = window.devicePixelRatio || 1;
            const displayWidth = canvas.width / dpr;
            const displayHeight = canvas.height / dpr;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, displayWidth, displayHeight);

            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseout', stopDrawing);

            canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
            canvas.addEventListener('touchend', stopDrawing);
            canvas.addEventListener('touchcancel', stopDrawing);

            loadDrawing();

        function resizeCanvas() {
            const container = canvas.parentElement;
            const dpr = window.devicePixelRatio || 1;

            const displayWidth = container.clientWidth || 1024;
            const displayHeight = container.clientHeight || 768;

            canvas.width = displayWidth * dpr;
            canvas.height = displayHeight * dpr;
            canvas.style.width = displayWidth + 'px';
            canvas.style.height = displayHeight + 'px';

            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        }

        function selectTool(tool, btn) {
            currentTool = tool;

            hasChanges = true;

        function startDrawing(e) {
            if (isViewMode) return;
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            lastX = e.clientX - rect.left;
            lastY = e.clientY - rect.top;

            if (currentTool === 'spray') {
                sprayInterval = setInterval(() => {
                    sprayPaint(lastX, lastY);
                }, 30);
            }
        }

        function handleTouchStart(e) {
            e.preventDefault();
            if (isViewMode) return;
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            lastX = touch.clientX - rect.left;
            lastY = touch.clientY - rect.top;
            isDrawing = true;

            if (currentTool === 'spray') {
                sprayInterval = setInterval(() => {
                    sprayPaint(lastX, lastY);
                }, 30);
            }
        }

        function handleTouchMove(e) {
            e.preventDefault();
            if (!isDrawing || isViewMode) return;
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;

            if (currentTool === 'spray') {
                lastX = x;
                lastY = y;
                return;
            }

            drawLine(lastX, lastY, x, y);
            lastX = x;
            lastY = y;
        }

        function draw(e) {
            if (!isDrawing || isViewMode) return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (currentTool === 'spray') {
                lastX = x;
                lastY = y;
                return;
            }

            drawLine(lastX, lastY, x, y);
            lastX = x;
            lastY = y;
        }

        function drawLine(x1, y1, x2, y2) {
            if (currentTool === 'eraser') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.strokeStyle = 'rgba(0,0,0,1)';
                ctx.lineWidth = brushSize * 3;
            } else if (currentTool === 'marker') {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = currentColor + '99';
                ctx.lineWidth = brushSize * 2;
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = currentColor;
                ctx.lineWidth = brushSize;
            }

            const dist = Math.sqrt((x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1));
            const step = Math.max(1, brushSize / 2);
            const steps = Math.max(1, Math.ceil(dist / step));

            ctx.beginPath();
            ctx.moveTo(x1, y1);

            for (let i = 1; i <= steps; i++) {
                const t = i / steps;
                const px = x1 + (x2 - x1) * t;
                const py = y1 + (y2 - y1) * t;
                ctx.lineTo(px, py);
            }

            ctx.stroke();
            ctx.closePath();

            hasChanges = true;
        }

        function sprayPaint(x, y) {
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = currentColor;

            for (let i = 0; i < 15; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * brushSize * 2;
                const px = x + Math.cos(angle) * radius;
                const py = y + Math.sin(angle) * radius;
                ctx.fillRect(px, py, 1, 1);
            }

            hasChanges = true;
        }

        function stopDrawing() {
            isDrawing = false;
            if (sprayInterval) {
                clearInterval(sprayInterval);
                sprayInterval = null;
            }
        }

        function clearCanvas() {
            if (!confirm('确定要清空画布吗？')) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = 'source-over';
            hasChanges = true;
        }

                    cleanText = jsonCodeBlockMatch[1].trim();
                }

                const jsonMatch = cleanText.match(/\{[\s\S]*\}/);
                if (jsonMatch) {
                    try {
                        const result = JSON.parse(jsonMatch[0]);
                        content = result.content || content;
                        emotion = result.emotion || emotion;
                        advice = result.advice || advice;
                    } catch (jsonParseError) {
                        console.log('JSON解析失败，使用文本解析');
                        const lines = cleanText.split('\n');
                        extractSectionsFromLines(lines);
                    }
                } else {
                    const lines = cleanText.split('\n');
                    extractSectionsFromLines(lines);
                }
            } catch (e) {
                console.log('解析过程出错:', e);
            }

            function extractSectionsFromLines(lines) {
                let currentSection = '';
                
                for (const line of lines) {
                    const trimmedLine = line.trim();
                    if (!trimmedLine || trimmedLine === '{' || trimmedLine === '}') continue;
                    
                    const lowerLine = trimmedLine.toLowerCase();
                    
                    if (lowerLine.includes('画面内容') || lowerLine.includes('content')) {
                        currentSection = 'content';
                        const parts = trimmedLine.split(/[：:]/);
                        if (parts.length > 1) {
                            content = parts.slice(1).join(':').trim().replace(/^[""']|[""']$/g, '');
                        }
                    } else if (lowerLine.includes('情绪解读') || lowerLine.includes('emotion')) {
                        currentSection = 'emotion';
                        const parts = trimmedLine.split(/[：:]/);
                        if (parts.length > 1) {
                            emotion = parts.slice(1).join(':').trim().replace(/^[""']|[""']$/g, '');
                        }
                    } else if (lowerLine.includes('疏导建议') || lowerLine.includes('advice') || lowerLine.includes('调节建议')) {
                        currentSection = 'advice';
                        const parts = trimmedLine.split(/[：:]/);
                        if (parts.length > 1) {
                            advice = parts.slice(1).join(':').trim().replace(/^[""']|[""']$/g, '');
                        }
                    } else if (trimmedLine.startsWith('"') || trimmedLine.startsWith('"')) {
                        continue;
                    } else if (currentSection === 'content' && trimmedLine) {
                        content += ' ' + trimmedLine.replace(/^[""']|[""']$/g, '');
                    } else if (currentSection === 'emotion' && trimmedLine) {
                        emotion += ' ' + trimmedLine.replace(/^[""']|[""']$/g, '');
                    } else if (currentSection === 'advice' && trimmedLine) {
                        advice += ' ' + trimmedLine.replace(/^[""']|[""']$/g, '');
                    }
                }
            }

            const textContent = content.trim() || '（未能识别）';
            const textEmotion = emotion.trim() || '（未能识别）';
            const textAdvice = String(advice || '（暂无建议）').trim() || '（暂无建议）';
            
            contentEl.textContent = textContent;
            emotionEl.textContent = textEmotion;
            adviceEl.textContent = textAdvice;

            document.getElementById('analysisLoading').style.display = 'none';
            document.getElementById('analysisResult').classList.add('show');

            const moodScore = calculateMoodScore(textEmotion, textAdvice);
            
            (function() {
                const key = 'offlineDrawing_' + window.currentUserId + '_' + currentDate;
                const existing = JSON.parse(localStorage.getItem(key) || '{}');
                existing.userId = window.currentUserId;
                existing.drawDate = currentDate;
                existing.imageData = canvas.toDataURL('image/png');
                existing.analysisResult = JSON.stringify({
                    content: textContent,
                    emotion: textEmotion,
                    advice: textAdvice,
                    moodScore: moodScore,
                    mbti: userMbti
                });
                localStorage.setItem(key, JSON.stringify(existing));
                console.log('情绪分析已保存到本地');
            })();

            initMusicRecommendation(textEmotion);
        }

        function initMusicRecommendation(emotionText) {
            const musicCategoryTabs = document.getElementById('musicCategoryTabs');
            const musicDescription = document.getElementById('musicDescription');
            const musicPlayers = document.getElementById('musicPlayers');

            musicCategoryTabs.innerHTML = '';
            musicPlayers.innerHTML = '';

            if (emotionText) {
                const recommendedCategory = getRecommendedMusicCategory(emotionText);
                const playlist = MUSIC_PLAYLISTS[recommendedCategory];

                const tab = document.createElement('button');
                tab.className = 'music-category-tab active';
                tab.innerHTML = `${playlist.icon} ${playlist.name}`;
                musicCategoryTabs.appendChild(tab);

                updateMusicPlayers(recommendedCategory);
            } else {
                updateMusicPlayers('calm');
            }
        }

        function getRecommendedMusicCategory(emotionText) {
            const text = emotionText.toLowerCase();
            
            if (text.includes('平静') || text.includes('平和') || text.includes('安宁') || text.includes('放松') || text.includes('冥想')) {
                return 'calm';
            }
            if (text.includes('开心') || text.includes('快乐') || text.includes('愉悦') || text.includes('幸福') || text.includes('喜悦')) {
                return 'happy';
            }
            if (text.includes('温暖') || text.includes('治愈') || text.includes('安慰') || text.includes('被理解')) {
                return 'healing';
            }
            if (text.includes('焦虑') || text.includes('压力') || text.includes('紧张') || text.includes('烦躁') || text.includes('不安')) {
                return 'relax';
            }
            if (text.includes('愤怒') || text.includes('激动') || text.includes('力量') || text.includes('爆发') || text.includes('强')) {
                return 'energetic';
            }
            
            return 'calm';
        }

        function switchMusicCategory(category) {
            document.querySelectorAll('.music-category-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            updateMusicPlayers(category);
        }

        function updateMusicPlayers(category) {
            const playlist = MUSIC_PLAYLISTS[category];
            const musicDescription = document.getElementById('musicDescription');
            const musicPlayers = document.getElementById('musicPlayers');
            
            musicDescription.textContent = `${playlist.icon} ${playlist.description}`;
            
            musicPlayers.innerHTML = '';
            
            playlist.songs.forEach((song, index) => {
                const playerContainer = document.createElement('div');
                playerContainer.className = 'music-player-container';
                
                const title = document.createElement('div');
                title.className = 'music-player-title';
                title.innerHTML = `<span class="music-icon">🎵</span><span>${song.title}</span><span style="color: #999; font-size: 12px; margin-left: 8px;">- ${song.artist}</span>`;
                playerContainer.appendChild(title);
                
                const linkBtn = document.createElement('a');
                linkBtn.href = song.url;
                linkBtn.target = '_blank';
                linkBtn.style.cssText = 'display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; background: linear-gradient(135deg, #31c27c 0%, #1db954 100%); color: #fff; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: 500; transition: all 0.2s ease; margin-top: 8px;';
                linkBtn.innerHTML = '<span>🎧</span><span>在 QQ 音乐中播放</span>';
                linkBtn.onmouseover = function() { this.style.transform = 'translateY(-2px)'; this.style.boxShadow = '0 4px 12px rgba(49, 194, 124, 0.4)'; };
                linkBtn.onmouseout = function() { this.style.transform = 'translateY(0)'; this.style.boxShadow = 'none'; };
                playerContainer.appendChild(linkBtn);
                
                musicPlayers.appendChild(playerContainer);
            });
        }

        function calculateMoodScore(emotionText, adviceText) {
            const positiveWords = ['平静', '愉悦', '开心', '快乐', '幸福', '满足', '轻松', '安心', '温暖', '积极', '希望', '平静', '平和', '和谐', '愉悦'];
            const negativeWords = ['焦虑', '烦躁', '愤怒', '悲伤', '痛苦', '恐惧', '压力', '紧张', '不安', '混乱', '失控', '纠结', '抗拒', '自责', '沮丧'];
            
            let score = 50;
            
            positiveWords.forEach(word => {
                if (emotionText.includes(word)) score += 5;
                if (adviceText.includes(word)) score += 3;
            });
            
            negativeWords.forEach(word => {
                if (emotionText.includes(word)) score -= 8;
                if (adviceText.includes(word)) score -= 5;
            });
            
            if (emotionText.includes('强烈') || emotionText.includes('非常')) score -= 5;
            if (emotionText.includes('轻微') || emotionText.includes('些许')) score += 5;
            
            return Math.max(10, Math.min(90, score));
        }

        function closeAnalysis() {
            document.getElementById('analysisModal').classList.remove('show');
        }

        function loadDrawing() {
            try {
                const key = 'offlineDrawing_' + window.currentUserId + '_' + currentDate;
                const raw = localStorage.getItem(key);
                if (!raw) return;
                const data = JSON.parse(raw);
                if (data.imageData) {
                    const img = new Image();
                    img.onload = () => {
                        const dpr = window.devicePixelRatio || 1;
                        const displayWidth = canvas.width / dpr;
                        const displayHeight = canvas.height / dpr;
                        ctx.clearRect(0, 0, displayWidth, displayHeight);
                        ctx.drawImage(img, 0, 0, displayWidth, displayHeight);
                    };
                    img.src = data.imageData;
                }

                // 只要有画作就显示"情绪分析报告"按钮
                const headerRight = document.getElementById('headerRight');
                if (!document.getElementById('btnAnalysis')) {
                    const btn = document.createElement('button');
                    btn.id = 'btnAnalysis';
                    btn.className = 'header-btn btn-analysis';
                    btn.textContent = '情绪分析报告';
                    btn.onclick = showAnalysis;
                    headerRight.appendChild(btn);
                }

                if (data.analysisResult) {
                    parseAndDisplayAnalysis(data.analysisResult);
                }
            } catch (err) {
                console.error('Load error:', err);
            }
        }

        function goBack() {
            if (hasChanges && !isViewMode) {
                if (confirm('有未保存的内容，确定要离开吗？')) {
                    window.location.href = 'calendar.html';
                }
            } else {
                window.location.href = 'calendar.html';
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        window.addEventListener('beforeunload', (e) => {
            if (hasChanges && !isViewMode) {
                e.preventDefault();
                e.returnValue = '';
            }
        });

        if (checkLogin()) {
            parseUrlParams();
            initUI();
            requestAnimationFrame(() => {
                initCanvas();
            });
        }
    </script>
