</head>
<body>
  <div class="app-container">
    <a href="landing.html" class="back-to-landing" title="返回宣传主页">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      <span>宣传主页</span>
    </a>
    <!-- 一键体验面板（桌面端显示） -->
    <div class="quick-experience-panel">
      <div class="panel-header">
        <div class="panel-badge">⚡ 一键体验</div>
        <div class="panel-title">30 秒看懂易镜</div>
        <div class="panel-subtitle">选择一个真实场景，马上看到 AI 分析结果</div>
      </div>
      <div class="scene-list">
        <button class="scene-btn" data-scene="conflict">
          <div class="scene-icon">🔥</div>
          <div class="scene-info">
            <div class="scene-name">直播连麦情绪冲突</div>
            <div class="scene-desc">观众质疑价格，直播间气氛紧张</div>
          </div>
          <div class="scene-arrow">→</div>
        </button>
        <button class="scene-btn" data-scene="price">
          <div class="scene-icon">💰</div>
          <div class="scene-info">
            <div class="scene-name">带货价格质疑</div>
            <div class="scene-desc">观众要求同类产品对比</div>
          </div>
          <div class="scene-arrow">→</div>
        </button>
        <button class="scene-btn" data-scene="business">
          <div class="scene-icon">🤝</div>
          <div class="scene-info">
            <div class="scene-name">商务谈判压价</div>
            <div class="scene-desc">客户要求降价 30%</div>
          </div>
          <div class="scene-arrow">→</div>
        </button>
        <button class="scene-btn" data-scene="custom">
          <div class="scene-icon">✏️</div>
          <div class="scene-info">
            <div class="scene-name">自定义对话</div>
            <div class="scene-desc">输入你遇到的沟通难题</div>
          </div>
          <div class="scene-arrow">→</div>
        </button>
      </div>
      <div class="panel-footer">
        <div class="footer-note">💡 易镜：让关键沟通看得见</div>
      </div>
    </div>

    <div class="phone-shell">
      <div class="phone-screen">
        <!-- 状态栏 -->
        <div class="statusbar">
          <span id="status-clock">09:41</span>
          <div class="status-icons">
            <span class="signal">
              <i></i><i></i><i></i><i></i>
            </span>
            <span class="battery"></span>
          </div>
        </div>

        <!-- 视口 -->
        <div class="viewport">
          <!-- 实时问答页 -->
          <div class="screen screen-live active">
            <div class="bg-layer">
              <div class="bg-grid"></div>
              <div class="bg-wash bg-wash-left"></div>
              <div class="bg-wash bg-wash-right"></div>
              <div class="bg-loop"></div>
              <div class="bg-figure">
                <div class="figure-head"></div>
                <div class="figure-body"></div>
              </div>
              <div class="bg-ribbon"></div>
            </div>
            <div class="screen-content">
              <!-- JS 渲染 -->
            </div>
          </div>

          <!-- 复盘分析页 -->
          <div class="screen screen-review">
            <div class="bg-layer">
              <div class="bg-grid"></div>
              <div class="bg-wash bg-wash-left"></div>
              <div class="bg-wash bg-wash-right"></div>
              <div class="bg-loop"></div>
              <div class="bg-figure">
                <div class="figure-head"></div>
                <div class="figure-body"></div>
              </div>
              <div class="bg-ribbon"></div>
            </div>
            <div class="screen-content">
              <!-- JS 渲染 -->
            </div>
          </div>

          <!-- 设置页 -->
          <div class="screen screen-settings">
            <div class="bg-layer">
              <div class="bg-grid"></div>
              <div class="bg-wash bg-wash-left"></div>
              <div class="bg-wash bg-wash-right"></div>
              <div class="bg-loop"></div>
              <div class="bg-figure">
                <div class="figure-head"></div>
                <div class="figure-body"></div>
              </div>
              <div class="bg-ribbon"></div>
              <div class="bg-soft-line"></div>
            </div>
            <div class="screen-content">
              <!-- JS 渲染 -->
            </div>
          </div>

          <!-- 模拟直播间页 -->
          <div class="screen screen-simlive">
            <div class="bg-layer bg-layer-dark">
              <div class="bg-grid"></div>
            </div>
            <div class="screen-content">
              <!-- JS 渲染 -->
            </div>
          </div>

          <!-- AI 陪聊演练页 -->
          <div class="screen screen-avatar">
            <div class="bg-layer">
              <div class="bg-grid"></div>
              <div class="bg-wash bg-wash-left"></div>
              <div class="bg-loop"></div>
            </div>
            <div class="screen-content">
              <!-- JS 渲染 -->
            </div>
          </div>
        </div>


        <!-- 悬浮窗 -->
        <div class="floating-copilot" id="floatingCopilot">
          <div class="floating-drag-handle"></div>
          <div class="floating-top">
            <div class="floating-hexagram">
              <svg viewBox="0 0 40 40" fill="none">
                <polygon points="20,3 36,12 36,28 20,37 4,28 4,12" fill="none" stroke="#e8ff57" stroke-width="2" stroke-linejoin="round"/>
                <text x="20" y="25" text-anchor="middle" font-size="14" font-weight="800" fill="#e8ff57">节</text>
              </svg>
            </div>
            <div class="floating-top-info">
              <div class="floating-hexagram-name">节卦</div>
              <div class="floating-actions">
                <button class="floating-minimize" title="最小化">
                  <svg viewBox="0 0 24 24" fill="none">
                    <path d="M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                  </svg>
                </button>
                <button class="floating-close" title="关闭">
                  <svg viewBox="0 0 24 24" fill="none">
                    <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>
          <div class="floating-emotion-row">
            <span class="floating-emotion-label">对方情绪</span>
            <span class="floating-emotion-tag">信息收集</span>
          </div>
          <div class="floating-line"></div>
          <div class="floating-next">
            <div class="floating-next-label">下一句话</div>
            <div class="floating-next-text">你这个担心合理，直播间最怕信息不透明。我先把价格、赠品和售后拆开给你看，哪些能核验、哪些有边界，我们一项项对。</div>
          </div>
          <div class="floating-expand-row">
            <button class="floating-expand-btn">
              <span>展开详细分析</span>
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
          <div class="floating-detail">
            <div class="floating-detail-item">
              <div class="floating-detail-label">当前风险</div>
              <div class="floating-detail-value">信任阈值被试探</div>
            </div>
            <div class="floating-detail-item">
              <div class="floating-detail-label">真实诉求</div>
              <div class="floating-detail-value">确认价格、赠品、售后是否透明</div>
            </div>
            <div class="floating-detail-item">
              <div class="floating-detail-label">回应策略</div>
              <div class="floating-detail-value">共情缓冲 → 底线守界 → 利益推进</div>
            </div>
          </div>
        </div>
        <!-- 底部导航 -->
        <div class="bottom-nav">
          <button class="nav-btn active" data-tab="home">
            <span class="nav-icon">
              <svg viewBox="0 0 16 16" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="1.92" y="2.24" width="11.2" height="8.32" rx="2.56" ry="2.56"/>
                <line x1="5.44" y1="7.04" x2="9.92" y2="7.04"/>
                <line x1="6.08" y1="13.12" x2="8.64" y2="10.56"/>
                <line x1="11.52" y1="13.12" x2="14.4" y2="13.12"/>
                <line x1="12.96" y1="11.52" x2="12.96" y2="14.72"/>
              </svg>
            </span>
            <span>首页</span>
          </button>
          <button class="nav-btn" data-tab="review">
            <span class="nav-icon">
              <svg viewBox="0 0 16 16" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3.84" y="1.92" width="8.32" height="12.16" rx="0.8" ry="0.8"/>
                <line x1="6.72" y1="11.84" x2="6.72" y2="8.64"/>
                <line x1="8.64" y1="11.84" x2="8.64" y2="5.76"/>
                <line x1="10.56" y1="11.84" x2="10.56" y2="7.68"/>
              </svg>
            </span>
            <span>复盘</span>
          </button>
          <button class="nav-btn" data-tab="settings">
            <span class="nav-icon">
              <svg viewBox="0 0 16 16" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <line x1="2.24" y1="4.48" x2="13.76" y2="4.48"/>
                <line x1="2.24" y1="11.52" x2="13.76" y2="11.52"/>
                <circle cx="5.76" cy="4.48" r="1.76"/>
                <circle cx="10.24" cy="11.52" r="1.76"/>
              </svg>
            </span>
            <span>我的</span>
          </button>
        </div>

        <!-- 弹窗容器 -->
        <div id="dialogContainer"></div>
      </div>
    </div>
  </div>

  <script src="js/yijing-engine.js?v=1"></script>
  <script src="js/formal-client.js?v=2"></script>
  <script src="js/data.js?v=2"></script>
