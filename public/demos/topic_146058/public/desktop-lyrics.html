<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MusicStage Desktop Lyrics</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:transparent;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.lyric-viewport{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;filter:drop-shadow(0 1px 3px rgba(4,6,12,.6)) drop-shadow(0 0 5px rgba(4,6,12,.3))}
.line{font-size:clamp(22px,4vw,32px);font-weight:300;letter-spacing:.04em;line-height:1.8;color:rgba(255,255,255,.28);text-align:center;transition:all .4s;text-shadow:0 0 1px rgba(255,255,255,.34),0 0 10px rgba(0,138,255,.15);-webkit-text-stroke:.18px rgba(255,255,255,.72)}
.line.active{color:#fff;font-weight:400;text-shadow:0 0 2px rgba(255,255,255,.5),0 0 20px rgba(0,138,255,.35),0 0 40px rgba(0,245,212,.15)}
.line.prev{opacity:.45}
</style>
</head>
<body>
<div class="lyric-viewport">
  <div class="line prev" id="line-prev"></div>
  <div class="line active" id="line-active"></div>
</div>
<script>
(function(){
  const linePrev = document.getElementById('line-prev');
  const lineActive = document.getElementById('line-active');

  if (window.desktopWindow && window.desktopWindow.onDesktopLyricsUpdate) {
    window.desktopWindow.onDesktopLyricsUpdate((payload) => {
      if (payload.prev !== undefined) linePrev.textContent = payload.prev;
      if (payload.current !== undefined) lineActive.textContent = payload.current;
    });
  }
})();
</script>
</body>
</html>
