<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DocGuard 规智文档 - AI受控文档生成系统</title>
<style>
/* ==================== 基础重置 ==================== */
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --primary:#2b5aed;--primary-dark:#1e44c9;--primary-light:#e8efff;
  --amber:#f59e0b;--amber-light:#fffbeb;--amber-border:#fcd34d;
  --sidebar:#1a1d29;--sidebar-2:#232735;--sidebar-hover:#2c3142;
  --bg:#f4f6fb;--card:#ffffff;--border:#e5e8ef;
  --text:#1f2430;--text-2:#6b7280;--text-3:#9ca3af;
  --green:#16a34a;--green-bg:#dcfce7;--red:#dc2626;--red-bg:#fee2e2;
  --code-bg:#1e293b;--table-head:#4472C4;
  --radius:10px;--shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-lg:0 10px 30px rgba(0,0,0,.10);
}
html,body{height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;outline:none;}
a{color:inherit;text-decoration:none;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#cbd2e0;border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:#aab3c5;}
::-webkit-scrollbar-track{background:transparent;}

/* ==================== 动画 ==================== */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@keyframes slideIn{from{opacity:0;transform:translateX(-12px);}to{opacity:1;transform:translateX(0);}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}
@keyframes spin{to{transform:rotate(360deg);}}
.fade-in{animation:fadeIn .35s ease both;}

/* ==================== 登录页 ==================== */
#login-screen{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0f172a 0%,#1e293b 40%,#2b5aed 120%);
  overflow:hidden;}
#login-screen::before{content:"";position:absolute;width:600px;height:600px;border-radius:50%;
  background:radial-gradient(circle,rgba(43,90,237,.35),transparent 60%);top:-150px;right:-100px;filter:blur(20px);}
#login-screen::after{content:"";position:absolute;width:500px;height:500px;border-radius:50%;
  background:radial-gradient(circle,rgba(245,158,11,.18),transparent 60%);bottom:-180px;left:-120px;filter:blur(20px);}
.login-box{position:relative;z-index:2;width:440px;max-width:92vw;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:42px 38px;backdrop-filter:blur(18px);
  box-shadow:0 30px 60px rgba(0,0,0,.4);}
.login-logo{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:6px;}
.login-logo .lg-icon{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,#2b5aed,#60a5fa);
  display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 6px 18px rgba(43,90,237,.5);}
.login-logo .lg-text{color:#fff;font-size:24px;font-weight:700;letter-spacing:.5px;}
.login-sub{text-align:center;color:rgba(255,255,255,.6);font-size:13px;margin-bottom:30px;}
.login-label{color:rgba(255,255,255,.75);font-size:13px;margin-bottom:12px;text-align:center;}
.demo-accounts{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.demo-btn{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:14px 16px;border-radius:12px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#fff;transition:all .25s;text-align:left;}
.demo-btn:hover{background:rgba(43,90,237,.4);border-color:rgba(96,165,250,.6);transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.25);}
.demo-btn .du-name{font-weight:600;font-size:14px;}
.demo-btn .du-role{font-size:11px;color:rgba(255,255,255,.55);}
.login-foot{text-align:center;color:rgba(255,255,255,.35);font-size:11px;margin-top:24px;}

/* ==================== 主应用布局 ==================== */
#app{display:none;height:100vh;}
#app.active{display:flex;}

/* 侧边栏 */
.sidebar{width:232px;flex-shrink:0;background:var(--sidebar);display:flex;flex-direction:column;color:#cbd2e0;}
.sidebar-logo{display:flex;align-items:center;gap:10px;padding:18px 18px;border-bottom:1px solid rgba(255,255,255,.06);}
.sidebar-logo .sl-icon{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#2b5aed,#60a5fa);
  display:flex;align-items:center;justify-content:center;font-size:18px;}
.sidebar-logo .sl-text{color:#fff;font-weight:700;font-size:16px;letter-spacing:.3px;}
.nav-scroll{flex:1;overflow-y:auto;padding:10px 0;}
.nav-group{margin-bottom:6px;}
.nav-group-title{font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:1px;padding:12px 18px 6px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 18px;font-size:13.5px;color:#a8b0c2;cursor:pointer;transition:all .2s;border-left:3px solid transparent;}
.nav-item:hover{background:var(--sidebar-hover);color:#fff;}
.nav-item.active{background:rgba(43,90,237,.18);color:#fff;border-left-color:var(--primary);}
.nav-item .ni-icon{font-size:15px;width:18px;text-align:center;}
.sidebar-user{padding:14px 18px;border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:10px;}
.sidebar-user .su-ava{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#fbbf24);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:13px;flex-shrink:0;}
.sidebar-user .su-info{flex:1;min-width:0;}
.sidebar-user .su-name{color:#fff;font-size:13px;font-weight:600;}
.sidebar-user .su-role{color:#6b7280;font-size:11px;}
.sidebar-user .su-logout{color:#6b7280;cursor:pointer;font-size:16px;padding:4px;}
.sidebar-user .su-logout:hover{color:#fff;}

/* 顶栏 */
.topbar{height:56px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;
  justify-content:space-between;padding:0 24px;flex-shrink:0;}
.topbar-title{font-size:16px;font-weight:600;color:var(--text);}
.topbar-title .tb-sub{font-size:12px;color:var(--text-3);font-weight:400;margin-left:8px;}
.demo-badge{display:inline-flex;align-items:center;gap:6px;background:var(--amber-light);color:#92400e;
  border:1px solid var(--amber-border);padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;}
.demo-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--amber);animation:pulse 1.6s infinite;}

/* 内容区 */
.content{flex:1;overflow-y:auto;padding:22px 28px;}
.page{animation:fadeIn .35s ease both;}

/* ==================== 通用组件 ==================== */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:8px;font-size:13.5px;font-weight:600;transition:all .2s;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);box-shadow:0 4px 12px rgba(43,90,237,.35);}
.btn-ghost{background:#fff;color:var(--text-2);border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary);}
.btn-amber{background:var(--amber);color:#fff;}
.btn-amber:hover{background:#d97706;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-3);margin-bottom:16px;}
.breadcrumb a{cursor:pointer;}
.breadcrumb a:hover{color:var(--primary);}
.tag{display:inline-flex;align-items:center;padding:2px 9px;border-radius:6px;font-size:11.5px;font-weight:600;}
.tag-blue{background:var(--primary-light);color:var(--primary);}
.tag-green{background:var(--green-bg);color:var(--green);}
.tag-amber{background:var(--amber-light);color:#92400e;border:1px solid var(--amber-border);}
.tag-gray{background:#f1f3f7;color:var(--text-2);}
.tag-purple{background:#f3e8ff;color:#7c3aed;}
.tag-red{background:var(--red-bg);color:var(--red);}

/* 表格 */
.tbl{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:var(--radius);overflow:hidden;}
.tbl thead th{background:var(--table-head);color:#fff;padding:11px 14px;text-align:left;font-weight:600;white-space:nowrap;}
.tbl tbody td{padding:10px 14px;border-bottom:1px solid var(--border);}
.tbl tbody tr:hover{background:#f8faff;}
.tbl tbody tr:last-child td{border-bottom:none;}
.tbl-plain thead th{background:#f1f4f9;color:var(--text);}
.tbl-plain tbody td{border:1px solid #e9edf3;}

/* 页面标题 */
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.page-title{font-size:20px;font-weight:700;}
.page-desc{font-size:13px;color:var(--text-3);margin-top:3px;}

/* ==================== Skill卡片 ==================== */
.skill-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
.skill-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:22px;cursor:pointer;
  transition:all .25s;position:relative;overflow:hidden;}
.skill-card:hover{border-color:var(--primary);box-shadow:var(--shadow-lg);transform:translateY(-3px);}
.skill-card .sc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.skill-card .sc-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;}
.sc-icon.blue{background:var(--primary-light);color:var(--primary);}
.sc-icon.amber{background:var(--amber-light);color:var(--amber);}
.sc-icon.gray{background:#f1f3f7;color:var(--text-3);}
.skill-card h3{font-size:16px;margin-bottom:6px;}
.skill-card .sc-desc{font-size:12.5px;color:var(--text-2);margin-bottom:14px;min-height:36px;}
.skill-card .sc-meta{display:flex;gap:14px;font-size:12px;color:var(--text-3);border-top:1px solid var(--border);padding-top:12px;}
.skill-card .sc-meta span b{color:var(--text-2);font-weight:600;}

/* ==================== 表单 ==================== */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:780px;}
.form-item{display:flex;flex-direction:column;gap:6px;}
.form-item label{font-size:13px;font-weight:600;color:var(--text-2);}
.form-item label .req{color:var(--red);}
.form-item input,.form-item select{padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;transition:all .2s;background:#fff;}
.form-item input:focus,.form-item select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(43,90,237,.12);}
.form-tip{background:var(--primary-light);border-left:3px solid var(--primary);border-radius:8px;padding:14px 16px;font-size:13px;color:#1e3a8a;margin-top:20px;max-width:780px;}
.form-tip b{color:var(--primary);}

/* ==================== 进度页 ==================== */
.progress-wrap{display:flex;flex-direction:column;align-items:center;padding:20px 0;}
.circle-progress{position:relative;width:160px;height:160px;margin-bottom:28px;}
.circle-progress svg{transform:rotate(-90deg);}
.circle-bg{stroke:#e5e8ef;stroke-width:10;fill:none;}
.circle-fg{stroke:var(--primary);stroke-width:10;fill:none;stroke-linecap:round;transition:stroke-dashoffset .5s ease;}
.circle-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.circle-text .ct-num{font-size:34px;font-weight:700;color:var(--primary);}
.circle-text .ct-label{font-size:12px;color:var(--text-3);}
.step-list{width:100%;max-width:560px;display:flex;flex-direction:column;gap:10px;}
.step-row{display:flex;align-items:center;gap:14px;padding:13px 18px;background:#fff;border:1px solid var(--border);border-radius:8px;transition:all .3s;}
.step-row.active{border-color:var(--primary);box-shadow:0 0 0 3px rgba(43,90,237,.08);}
.step-row.done{opacity:.7;}
.step-icon{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;background:#f1f3f7;color:var(--text-3);}
.step-row.active .step-icon{background:var(--primary);color:#fff;}
.step-row.done .step-icon{background:var(--green);color:#fff;}
.step-text{flex:1;}
.step-text .st-title{font-size:13.5px;font-weight:600;}
.step-text .st-desc{font-size:12px;color:var(--text-3);}
.step-spinner{width:16px;height:16px;border:2px solid rgba(43,90,237,.2);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;}

/* ==================== 文档预览 ==================== */
.preview-layout{display:grid;grid-template-columns:1fr 360px;gap:20px;align-items:start;}
.doc-paper{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:40px 48px;box-shadow:var(--shadow-lg);min-height:600px;}
.doc-paper h1.doc-title{text-align:center;font-size:22px;font-weight:700;margin-bottom:24px;letter-spacing:1px;}
.doc-paper h2{font-size:15px;font-weight:700;margin:22px 0 10px;color:var(--text);}
.doc-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:6px;}
.doc-table th{background:var(--table-head);color:#fff;padding:8px 10px;text-align:left;font-weight:600;border:1px solid #3a63ad;}
.doc-table td{padding:7px 10px;border:1px solid #d6dbe4;}
.doc-table tr:nth-child(even) td{background:#f8faff;}
.ai-block{background:var(--amber-light);border-left:4px solid var(--amber);border-radius:0 8px 8px 0;padding:14px 16px;margin:8px 0;font-size:13px;line-height:1.85;color:#78350f;}
.ai-block .ab-head{display:flex;align-items:center;gap:6px;font-weight:700;margin-bottom:6px;color:#92400e;font-size:12px;}
.ai-seg{margin-bottom:6px;}
.ai-seg b{color:#b45309;}

.right-panel{display:flex;flex-direction:column;gap:16px;position:sticky;top:0;}
.rp-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.rp-card h4{font-size:13px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.compliance-score{display:flex;align-items:center;gap:16px;margin-bottom:14px;}
.score-ring{position:relative;width:72px;height:72px;flex-shrink:0;}
.score-ring svg{transform:rotate(-90deg);}
.score-ring .sr-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--green);}
.check-list{display:flex;flex-direction:column;gap:8px;}
.check-item{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--border);}
.check-item:last-child{border-bottom:none;}
.ci-pass{color:var(--green);}
.ci-fail{color:var(--red);}
.reason-log{font-family:"Consolas","Monaco",monospace;font-size:11.5px;background:#0f172a;color:#cbd5e1;border-radius:8px;padding:12px;max-height:200px;overflow-y:auto;line-height:1.7;}
.reason-log .rl-time{color:#64748b;}
.reason-log .rl-step{color:#60a5fa;font-weight:600;}
.reason-log .rl-ok{color:#4ade80;}
.info-row{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--border);}
.info-row:last-child{border-bottom:none;}
.info-row span:first-child{color:var(--text-3);}
.info-row span:last-child{color:var(--text);font-weight:600;}
.preview-actions{display:flex;gap:10px;margin-top:4px;}

/* ==================== 规则编辑器 ==================== */
.editor-layout{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start;}
.editor-left{display:flex;flex-direction:column;gap:16px;}
.flow-steps{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.flow-steps h4{font-size:13px;font-weight:700;margin-bottom:14px;}
.fs-bar{display:flex;align-items:center;gap:2px;margin-bottom:10px;}
.fs-dot{flex:1;height:4px;border-radius:2px;background:#e5e8ef;}
.fs-dot.done{background:var(--green);}
.fs-dot.active{background:var(--primary);}
.fs-list{display:flex;flex-direction:column;gap:8px;}
.fs-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-3);}
.fs-item .fs-num{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;background:#f1f3f7;color:var(--text-3);}
.fs-item.done .fs-num{background:var(--green);color:#fff;}
.fs-item.done{color:var(--text-2);}
.fs-item.active .fs-num{background:var(--primary);color:#fff;}
.fs-item.active{color:var(--primary);font-weight:600;}

.chapter-list{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.chapter-list h4{font-size:13px;font-weight:700;margin-bottom:14px;}
.ch-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;transition:all .2s;margin-bottom:6px;border:1px solid transparent;}
.ch-item:hover{background:#f8faff;}
.ch-item.active{background:var(--primary-light);border-color:var(--primary);}
.ch-icon{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.ch-icon.user{background:#dbeafe;color:#2563eb;}
.ch-icon.data{background:#dcfce7;color:#16a34a;}
.ch-icon.ai{background:#fef3c7;color:#d97706;}
.ch-info{flex:1;min-width:0;}
.ch-info .ci-name{font-size:13px;font-weight:600;}
.ch-info .ci-tags{display:flex;gap:5px;margin-top:3px;}

.editor-right{background:#fff;border:1px solid var(--border);border-radius:var(--radius);}
.editor-tabs{display:flex;border-bottom:1px solid var(--border);padding:0 8px;}
.etab{padding:14px 18px;font-size:13.5px;font-weight:600;color:var(--text-3);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;display:flex;align-items:center;gap:6px;}
.etab:hover{color:var(--text);}
.etab.active{color:var(--primary);border-bottom-color:var(--primary);}
.etab .et-num{width:18px;height:18px;border-radius:50%;background:#f1f3f7;font-size:10px;display:flex;align-items:center;justify-content:center;}
.etab.active .et-num{background:var(--primary);color:#fff;}
.editor-body{padding:20px;}

/* 折叠章节卡片 */
.accordion{display:flex;flex-direction:column;gap:10px;}
.acc-item{border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.acc-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;background:#fafbfd;}
.acc-head:hover{background:#f1f5ff;}
.acc-head .ah-left{display:flex;align-items:center;gap:10px;}
.acc-head .ah-title{font-size:13.5px;font-weight:600;}
.acc-arrow{transition:transform .25s;color:var(--text-3);}
.acc-item.open .acc-arrow{transform:rotate(180deg);}
.acc-body{padding:14px 16px;display:none;border-top:1px solid var(--border);}
.acc-item.open .acc-body{display:block;animation:fadeIn .25s ease both;}
.field-table{width:100%;font-size:12.5px;border-collapse:collapse;}
.field-table th{background:#f1f4f9;padding:7px 10px;text-align:left;font-weight:600;color:var(--text-2);border:1px solid #e9edf3;}
.field-table td{padding:7px 10px;border:1px solid #e9edf3;}
.expr-code{background:#0f172a;color:#e2e8f0;font-family:monospace;font-size:12px;padding:10px 14px;border-radius:6px;margin-top:8px;}
.expr-code .ex-kw{color:#fbbf24;}
.expr-code .ex-fn{color:#60a5fa;}

/* 格式层卡片 */
.fmt-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.fmt-card{border:1px solid var(--border);border-radius:8px;padding:16px;}
.fmt-card h5{font-size:13px;font-weight:700;margin-bottom:12px;color:var(--text);}
.fmt-row{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--border);}
.fmt-row:last-child{border-bottom:none;}
.fmt-row span:first-child{color:var(--text-3);}
.color-block{display:inline-block;width:16px;height:16px;border-radius:3px;vertical-align:middle;margin-right:6px;border:1px solid rgba(0,0,0,.1);}

/* 语义层 */
.term-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:6px;margin-bottom:6px;font-size:13px;}
.term-ok{background:var(--green-bg);color:#166534;}
.term-bad{background:var(--red-bg);color:#991b1b;text-decoration:line-through;}
.banned-list{display:flex;flex-wrap:wrap;gap:8px;}
.banned-chip{background:var(--red-bg);color:var(--red);padding:4px 12px;border-radius:16px;font-size:12.5px;text-decoration:line-through;border:1px solid #fecaca;}

/* 数据源层 */
.ds-card{border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:14px;}
.ds-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.ds-head .dsh-left{display:flex;align-items:center;gap:10px;}
.ds-head .dsh-title{font-size:14px;font-weight:700;}
.ds-type{font-size:11px;padding:2px 8px;border-radius:5px;font-weight:600;}
.ds-type.sql{background:#dbeafe;color:#1d4ed8;}
.ds-type.api{background:#dcfce7;color:#15803d;}
.sql-code{background:var(--code-bg);border-radius:8px;padding:14px 16px;font-family:"Consolas","Monaco",monospace;font-size:12.5px;line-height:1.8;margin-bottom:12px;overflow-x:auto;}
.sql-code .kw{color:#60a5fa;font-weight:600;}
.sql-code .param{color:#4ade80;}
.sql-code .str{color:#fbbf24;}
.sql-code .cm{color:#64748b;}
.mapping-row{display:flex;align-items:center;gap:10px;font-size:12.5px;padding:6px 0;}
.mapping-row .mr-src{background:#f1f5ff;color:#1e40af;padding:4px 10px;border-radius:6px;font-family:monospace;}
.mapping-row .mr-arrow{color:var(--primary);font-weight:700;}
.mapping-row .mr-dst{background:#f0fdf4;color:#166534;padding:4px 10px;border-radius:6px;font-family:monospace;}
.calc-field{background:#fffbeb;border:1px solid var(--amber-border);border-radius:6px;padding:8px 12px;font-size:12px;margin-top:8px;font-family:monospace;color:#92400e;}
.test-result{margin-top:12px;}
.test-result .tr-title{font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:6px;}

/* 推理层 */
.tpl-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.tpl-tag{padding:7px 14px;border-radius:20px;font-size:12.5px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--text-2);transition:all .2s;}
.tpl-tag:hover{border-color:var(--primary);color:var(--primary);}
.tpl-tag.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.reason-tip{background:var(--primary-light);border-left:3px solid var(--primary);border-radius:8px;padding:12px 16px;font-size:13px;color:#1e3a8a;margin-bottom:18px;}
.reason-tip b{color:var(--primary);}
.wf-card{border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:18px;background:#fff;}
.wf-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);}
.wf-head .wfh-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
.wf-steps{display:flex;flex-direction:column;gap:0;align-items:flex-start;}
.wf-step{width:100%;border:1px solid var(--border);border-radius:10px;padding:14px 16px;background:#fafbfd;position:relative;}
.wf-step .ws-top{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.wf-step .ws-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.ws-icon.analyze{background:#dbeafe;color:#2563eb;}
.ws-icon.retrieve{background:#dcfce7;color:#16a34a;}
.ws-icon.generate{background:#fef3c7;color:#d97706;}
.ws-icon.verify{background:#f3e8ff;color:#7c3aed;}
.wf-step .ws-title{font-size:13.5px;font-weight:700;}
.wf-step .ws-instr{font-size:12px;color:var(--text-2);margin-bottom:10px;line-height:1.6;}
.ws-meta{display:flex;flex-wrap:wrap;gap:6px;}
.ws-meta .wm{font-size:11px;padding:3px 8px;border-radius:5px;background:#fff;border:1px solid var(--border);color:var(--text-2);}
.ws-meta .wm b{color:var(--text);}
.wf-arrow{display:flex;justify-content:center;padding:6px 0;color:var(--text-3);font-size:18px;}

/* 简化页面通用 */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px;}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
.stat-card .sc-label{font-size:12px;color:var(--text-3);margin-bottom:8px;}
.stat-card .sc-val{font-size:26px;font-weight:700;}
.stat-card .sc-trend{font-size:12px;margin-top:4px;}
.upload-area{border:2px dashed var(--border);border-radius:var(--radius);padding:50px;text-align:center;cursor:pointer;transition:all .25s;background:#fff;}
.upload-area:hover{border-color:var(--primary);background:var(--primary-light);}
.upload-area .ua-icon{font-size:42px;color:var(--text-3);margin-bottom:12px;}
.parse-steps{display:flex;gap:0;margin:24px 0;}
.ps-item{flex:1;text-align:center;position:relative;font-size:12px;}
.ps-item .ps-circle{width:36px;height:36px;border-radius:50%;background:#f1f3f7;color:var(--text-3);display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-weight:700;}
.ps-item.done .ps-circle{background:var(--green);color:#fff;}
.ps-item.active .ps-circle{background:var(--primary);color:#fff;}
.ps-item:not(:last-child)::after{content:"";position:absolute;top:18px;left:50%;width:100%;height:2px;background:#e5e8ef;z-index:0;}
.ps-item.done:not(:last-child)::after{background:var(--green);}
.tree-node{padding:6px 0;}
.tree-children{margin-left:22px;border-left:2px dashed var(--border);padding-left:12px;}
.tree-row{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:13px;}
.tree-row:hover{background:#f8faff;}
.tree-row .tr-icon{font-size:14px;}
.notice{background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px 16px;font-size:12.5px;color:var(--text-2);margin-top:14px;}
.notice b{color:var(--text);}
</style>
</head>

          <circle class="circle-fg" id="circle-fg" cx="80" cy="80" r="70" stroke-dasharray="439.8" stroke-dashoffset="439.8"></circle>
        </svg>
        <div class="circle-text"><div class="ct-num" id="ct-num">0%</div><div class="ct-label">生成中</div></div>
      </div>
      <div class="step-list" id="step-list">
        ${MOCK.progressSteps.map((s,i)=>`
          <div class="step-row" id="sr-${i}">
            <div class="step-icon">${i+1}</div>
            <div class="step-text"><div class="st-title">${s.title}</div><div class="st-desc">${s.desc}</div></div>
            <div class="step-spinner" id="sp-${i}" style="display:none;"></div>
          </div>`).join('')}
      </div>
    </div>
  </div>`;
let progressTimer=null;
function startProgress(){
  let step=0;const total=MOCK.progressSteps.length;
  const C=2*Math.PI*70;
  function setStep(i){
    document.querySelectorAll('.step-row').forEach((r,idx)=>{
      r.classList.remove('active','done');
      const sp=document.getElementById('sp-'+idx);
      if(idx<i){r.classList.add('done');const ic=r.querySelector('.step-icon');ic.innerHTML='✓';if(sp)sp.style.display='none';}
      else if(idx===i){r.classList.add('active');if(sp)sp.style.display='block';}
      else{if(sp)sp.style.display='none';}
    });
    const pct=Math.round(((i+1)/total)*100);
    document.getElementById('ct-num').textContent=pct+'%';
    document.getElementById('circle-fg').style.strokeDashoffset=C*(1-pct/100);
  }
  setStep(0);
  progressTimer=setInterval(()=>{
    step++;
    if(step<total){setStep(step);}
    else{
      setStep(total-1);
      setTimeout(()=>{
        const last=document.getElementById('sr-'+(total-1));
        last.classList.remove('active');last.classList.add('done');
        last.querySelector('.step-icon').innerHTML='✓';
        document.getElementById('sp-'+(total-1)).style.display='none';
        document.querySelector('.ct-label').textContent='完成';
        document.getElementById('ct-num').textContent='100%';
        document.getElementById('circle-fg').style.stroke='var(--green)';
        document.querySelector('.ct-num').style.color='var(--green)';
      },400);
      clearInterval(progressTimer);
      setTimeout(()=>navigate('doc-preview'),1600);
    }
  },1100);
}

function renderDatasourceLayer(){
  return MOCK.dataSources.map(ds=>{
    const isSQL=ds.type==='SQL';
    const codeHtml=highlightCode(ds.sql,isSQL);
    return `<div class="ds-card">
      <div class="ds-head">
        <div class="dsh-left">
          <span style="font-size:20px;">${isSQL?'🗄️':'🌐'}</span>
          <span class="dsh-title">${ds.name}</span>
          <span class="ds-type ${isSQL?'sql':'api'}">${ds.type}</span>
        </div>
        <span style="font-size:11px;color:var(--text-3);font-family:monospace;">${esc(ds.conn)}</span>
      </div>
      <div class="sql-code">${codeHtml}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;">
        <div>
          <div style="font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:8px;">参数映射</div>
          ${ds.params.map(p=>`<div class="mapping-row"><span class="mr-src">${esc(p.src)}</span><span class="mr-arrow">→</span><span class="mr-dst">${p.dst}</span></div>`).join('')}
        </div>
        <div>
          <div style="font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:8px;">字段映射</div>
          ${ds.maps.map(m=>`<div class="mapping-row"><span class="mr-src">${esc(m.src)}</span><span class="mr-arrow">→</span><span class="mr-dst">${m.dst}</span></div>`).join('')}
        </div>
      </div>
      <div class="calc-field">⚙️ 计算字段：${ds.calc}</div>
      <div class="test-result">
        <div class="tr-title">📊 测试查询结果</div>
        <table class="tbl tbl-plain" style="font-size:12px;">
          <thead><tr><th>#</th>${ds.testRows[0].map((_,i)=>`<th>列${i+1}</th>`).join('')}</tr></thead>
          <tbody>${ds.testRows.map((r,i)=>`<tr><td>${i+1}</td>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>
        </table>
      </div>
    </div>`;
  }).join('');
}
function highlightCode(code,isSQL){
  if(!isSQL){
    return code.replace(/(GET|POST|Response)/g,'<span class="kw">$1</span>')
      .replace(/(\{[^}]+\})/g,'<span class="param">$1</span>');
  }
  let h=esc(code);
  h=h.replace(/\b(SELECT|FROM|WHERE|AND|ORDER BY|ROUND|AS)\b/g,'<span class="kw">$1</span>');
  h=h.replace(/(:\w+)/g,'<span class="param">$1</span>');
  return h;
}

function renderReasoningLayer(){
  return `
  <div class="tpl-tags">
    ${MOCK.reasonTemplates.map((t,i)=>`<span class="tpl-tag ${state.activeTpl===0&&t==='数据分析报告型'?'active':''}" onclick="pickTpl(this)">${t}</span>`).join('')}
  </div>
  <div class="reason-tip">
    💡 <b>推理链</b>是DocGuard的核心差异化能力：通过预置的多步推理模板（分析→检索→生成→校验，最多4步），
    约束AI生成过程，确保输出可追溯、可校验、可复现。每个步骤的指令、输出格式、字数、语气、失败处理均可配置。
  </div>
  ${MOCK.workflows.map(wf=>`
    <div class="wf-card">
      <div class="wf-head">
        <div class="wfh-title">🔗 ${wf.name} <span style="font-size:12px;color:var(--text-3);font-weight:400;">→ ${wf.target} · ${wf.steps}步推理链</span></div>
        ${tag('amber','AI生成章节')}
      </div>
      <div class="wf-steps">
        ${wf.chain.map((st,idx)=>`
          <div class="wf-step">
            <div class="ws-top">
              <div class="ws-icon ${st.type}">${st.icon}</div>
              <div class="ws-title">步骤${idx+1}：${st.title}</div>
              ${tag('gray','第'+(idx+1)+'步')}
            </div>
            <div class="ws-instr">${st.instr}</div>
            <div class="ws-meta">${st.meta.map(m=>`<span class="wm"><b>${m[0]}：</b>${m[1]}</span>`).join('')}</div>
          </div>
          ${idx<wf.chain.length-1?'<div class="wf-arrow">↓</div>':''}
        `).join('')}
      </div>
    </div>`).join('')}
  `;
}
function pickTpl(el){
  document.querySelectorAll('.tpl-tag').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
}
