<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>标书协作平台</title>
  <link rel="stylesheet" href="/css/app.css" />
  <script type="importmap">
  {
    "imports": {
      "codemirror": "https://esm.sh/codemirror@6.65.7",
      "@codemirror/state": "https://esm.sh/@codemirror/state@6.5.2",
      "@codemirror/view": "https://esm.sh/@codemirror/view@6.36.4",
      "@codemirror/lang-markdown": "https://esm.sh/@codemirror/lang-markdown@6.3.1",
      "@codemirror/commands": "https://esm.sh/@codemirror/commands@6.6.2",
      "@codemirror/language": "https://esm.sh/@codemirror/language@6.10.8",
      "@codemirror/search": "https://esm.sh/@codemirror/search@6.5.6"
    }
  }
  </script>
</head>
<body>
  <header id="topbar">
    <div class="topbar-left">
      <button id="toggle-sidebar" title="折叠/展开目录">☰</button>
      <span id="project-name">标书项目</span>
    </div>
    <div class="topbar-right">
      <span id="save-status" class="status-saved">就绪</span>
      <button id="export-btn" title="导出为 Word 文档">导出 Word</button>
    </div>
  </header>

  <main>
    <aside id="sidebar">
      <div id="tree-container">
        <div class="tree-loading">加载目录中...</div>
      </div>
    </aside>

    <section id="editor-pane">
      <div id="breadcrumb"></div>
      <div id="editor-wrapper">
        <div id="editor"></div>
        <div id="no-selection" class="no-selection">
          <p>请从左侧目录选择一个章节</p>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
