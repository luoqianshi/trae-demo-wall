<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>墨韵 — AI 学术写作润色工坊</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Noto+Serif+SC:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      /* 东方学术美学配色 - 避免 AI 模板默认 */
      --ink-deep: #0f172a;       /* 浓墨：深邃墨黑 */
      --ink-main: #1e293b;       /* 主墨：学术深蓝黑 */
      --ink-light: #475569;      /* 淡墨：次要文字 */
      --paper: #f8fafc;          /* 宣纸白：纯净学术感 */
      --paper-warm: #f1f5f9;     /* 暖宣：分隔背景 */
      --seal-red: #c53030;       /* 印章红：批注、强调 */
      --gold-ink: #b45309;       /* 金墨：点缀、交互 */
      --jade-green: #047857;     /* 玉色：新增内容 */
      --mist: #e2e8f0;           /* 云雾：边框、分隔 */
      --font-display: 'Noto Serif SC', 'STSong', serif;
      --font-body: 'Noto Serif SC', 'PingFang SC', sans-serif;
      --font-academic: 'Crimson Pro', 'Times New Roman', serif;
      --font-mono: 'JetBrains Mono', 'Consolas', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      color: var(--ink-main);
      background: var(--paper);
      line-height: 1.7;
      min-height: 100vh;
    }

    /* ═══════════════════════════════════════════
       Header - 学术期刊风格
       ═══════════════════════════════════════════ */
    header {
      background: var(--ink-deep);
      color: var(--paper);
      padding: 1.2rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 3px solid var(--seal-red);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .logo-mark {
      position: relative;
      width: 44px;
      height: 44px;
      background: var(--seal-red);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.4rem;
      color: var(--paper);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.2);
    }
    .logo-mark::after {
      content: '';
      position: absolute;
      top: 2px; right: 2px;
      width: 8px; height: 8px;
      background: rgba(255,255,255,0.3);
      border-radius: 50%;
    }
    .logo-text h1 {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.15em;
    }
    .logo-text span {
      font-size: 0.8rem;
      opacity: 0.7;
      font-weight: 400;
      letter-spacing: 0.05em;
    }
    .header-actions { display: flex; gap: 0.6rem; }
    .btn {
      padding: 0.5rem 1rem;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      font-family: var(--font-body);
    }
    .btn-ghost {
      background: transparent;
      color: var(--paper);
      border: 1px solid rgba(255,255,255,0.25);
    }
    .btn-ghost:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.4);
    }
    .btn-accent {
      background: var(--gold-ink);
      color: var(--paper);
    }
    .btn-accent:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }

    /* ═══════════════════════════════════════════
       Mode Bar - 简洁标签式
       ═══════════════════════════════════════════ */
    .mode-bar {
      background: var(--paper);
      border-bottom: 1px solid var(--mist);
      padding: 0.8rem 2rem;
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }
    .mode-label {
      font-family: var(--font-display);
      font-size: 0.85rem;
      color: var(--ink-light);
      font-weight: 600;
    }
    .mode-options { display: flex; gap: 0.4rem; }
    .mode-btn {
      padding: 0.4rem 0.9rem;
      border-radius: 2px;
      font-size: 0.82rem;
      background: transparent;
      color: var(--ink-main);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
      font-family: var(--font-body);
    }
    .mode-btn:hover {
      border-color: var(--mist);
      background: var(--paper-warm);
    }
    .mode-btn.active {
      background: var(--ink-deep);
      color: var(--paper);
      font-weight: 500;
    }
    .mode-btn.active::before {
      content: '◈';
      margin-right: 0.3rem;
    }
    .api-badge {
      margin-left: auto;
      font-size: 0.75rem;
      color: var(--ink-light);
      background: var(--paper-warm);
      padding: 0.25rem 0.6rem;
      border-radius: 2px;
      font-family: var(--font-mono);
    }

    /* ═══════════════════════════════════════════
       Workspace - 双栏学术排版
       ═══════════════════════════════════════════ */
    .workspace {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: calc(100vh - 110px);
    }
    .panel {
      display: flex;
      flex-direction: column;
      background: var(--paper);
    }
    .panel:first-child { border-right: 1px solid var(--mist); }
    .panel-header {
      padding: 0.8rem 1.5rem;
      background: var(--paper-warm);
      border-bottom: 1px solid var(--mist);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .panel-title {
      font-family: var(--font-display);
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--ink-deep);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .panel-title::before {
      content: '';
      width: 3px;
      height: 1em;
      background: var(--seal-red);
      border-radius: 1px;
    }
    .word-count {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--ink-light);
    }
    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 1.2rem 1.5rem;
    }

    /* ═══════════════════════════════════════════
       Editor - 学术打字机风格
       ═══════════════════════════════════════════ */
    .editor-area {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      resize: none;
      font-family: var(--font-academic);
      font-size: 1rem;
      line-height: 1.9;
      background: transparent;
      color: var(--ink-deep);
    }
    .editor-area::placeholder {
      color: var(--ink-light);
      font-style: italic;
    }
    .editor-area:focus {
      background: rgba(255,255,255,0.5);
    }

    /* ═══════════════════════════════════════════
       Action Bar
       ═══════════════════════════════════════════ */
    .action-bar {
      padding: 0.8rem 1.5rem;
      background: var(--paper-warm);
      border-top: 1px solid var(--mist);
      display: flex;
      gap: 0.6rem;
      align-items: center;
    }
    .btn-sample {
      background: none;
      border: none;
      color: var(--gold-ink);
      font-size: 0.8rem;
      cursor: pointer;
      font-family: var(--font-body);
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .btn-sample:hover { color: var(--seal-red); }
    .btn-clear {
      padding: 0.5rem 0.8rem;
      background: transparent;
      color: var(--ink-light);
      border: 1px solid var(--mist);
      border-radius: 2px;
      cursor: pointer;
      font-size: 0.82rem;
      font-family: var(--font-body);
      transition: all 0.15s;
    }
    .btn-clear:hover {
      border-color: var(--ink-main);
      color: var(--ink-main);
    }
    .btn-polish {
      flex: 1;
      padding: 0.6rem 1rem;
      background: var(--seal-red);
      color: var(--paper);
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      border-radius: 2px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .btn-polish:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(197, 48, 48, 0.25);
    }
    .btn-polish:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* ═══════════════════════════════════════════
       Result Area - 印章批注风格 (Signature)
       ═══════════════════════════════════════════ */
    .result-empty {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--ink-light);
    }
    .result-empty-icon {
      font-size: 3rem;
      opacity: 0.3;
      margin-bottom: 1rem;
    }
    .result-empty p {
      font-family: var(--font-display);
      font-size: 0.95rem;
      line-height: 1.8;
    }
    .result-text {
      font-family: var(--font-academic);
      font-size: 1rem;
      line-height: 1.9;
      color: var(--ink-deep);
      background: var(--paper);
      padding: 1.5rem;
      border: 1px solid var(--mist);
      border-radius: 2px;
    }
    /* 高亮样式 - 印章风格 */
    .hl-remove {
      background: rgba(197, 48, 48, 0.1);
      color: var(--seal-red);
      text-decoration: line-through;
      padding: 0 2px;
      border-radius: 1px;
    }
    .hl-add {
      background: rgba(4, 120, 87, 0.08);
      color: var(--jade-green);
      font-weight: 500;
      padding: 0 2px;
      border-radius: 1px;
      border-bottom: 2px solid var(--jade-green);
    }

    /* ═══════════════════════════════════════════
       Suggestions - 印章批注卡片
       ═══════════════════════════════════════════ */
    .suggestions-section {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 2px solid var(--mist);
    }
    .suggestions-header {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 1rem;
    }
    .suggestions-title {
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 700;
      color: var(--ink-deep);
      letter-spacing: 0.05em;
    }
    .suggestions-count {
      background: var(--seal-red);
      color: var(--paper);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.15rem 0.5rem;
      border-radius: 2px;
    }
    .suggestion-item {
      background: var(--paper);
      border: 1px solid var(--mist);
      border-left: 3px solid var(--seal-red);
      border-radius: 2px;
      padding: 1rem 1.2rem;
      margin-bottom: 0.8rem;
      transition: all 0.2s;
    }
    .suggestion-item:hover {
      border-left-color: var(--gold-ink);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .suggestion-type {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.15rem 0.5rem;
      border-radius: 2px;
      margin-bottom: 0.5rem;
      font-family: var(--font-mono);
      letter-spacing: 0.03em;
    }
    .type-grammar { background: rgba(197, 48, 48, 0.12); color: var(--seal-red); }
    .type-style { background: rgba(180, 83, 9, 0.12); color: var(--gold-ink); }
    .type-clarity { background: rgba(4, 120, 87, 0.12); color: var(--jade-green); }
    .suggestion-original {
      font-family: var(--font-academic);
      font-size: 0.9rem;
      color: var(--seal-red);
      text-decoration: line-through;
      margin-bottom: 0.2rem;
    }
    .suggestion-revised {
      font-family: var(--font-academic);
      font-size: 0.9rem;
      color: var(--jade-green);
      font-weight: 500;
      margin-bottom: 0.4rem;
    }
    .suggestion-revised::before {
      content: '→ ';
      color: var(--ink-light);
    }
    .suggestion-reason {
      font-size: 0.82rem;
      color: var(--ink-light);
      line-height: 1.6;
      padding-top: 0.5rem;
      border-top: 1px dashed var(--mist);
      font-family: var(--font-body);
    }

    /* ═══════════════════════════════════════════
       Stats Bar - 简洁数据条
       ═══════════════════════════════════════════ */
    .stats-bar {
      background: var(--paper-warm);
      border-top: 1px solid var(--mist);
      padding: 0.6rem 1.5rem;
      display: flex;
      gap: 2rem;
      font-size: 0.8rem;
    }
    .stat-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .stat-label { color: var(--ink-light); }
    .stat-value {
      font-family: var(--font-mono);
      font-weight: 600;
      color: var(--ink-deep);
    }
    .stat-value.positive { color: var(--jade-green); }

    /* ═══════════════════════════════════════════
       Loading State
       ═══════════════════════════════════════════ */
    .loading {
      display: none;
      text-align: center;
      padding: 3rem 1rem;
    }
    .loading.active { display: block; }
    .spinner {
      width: 36px;
      height: 36px;
      border: 2px solid var(--mist);
      border-top-color: var(--seal-red);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text {
      color: var(--ink-light);
      font-family: var(--font-display);
      font-size: 0.9rem;
    }

    /* ═══════════════════════════════════════════
       Responsive
       ═══════════════════════════════════════════ */
    @media (max-width: 900px) {
      .workspace {
        grid-template-columns: 1fr;
        height: auto;
      }
      .panel {
        height: 45vh;
        border-right: none !important;
        border-bottom: 1px solid var(--mist);
      }
      .panel:last-child { border-bottom: none; }
      header {
        flex-direction: column;
        gap: 0.8rem;
        text-align: center;
      }
      .mode-bar { flex-wrap: wrap; }
      .api-badge { margin-left: 0; margin-top: 0.5rem; }
    }

    /* Focus states for accessibility */
    .btn:focus-visible, .mode-btn:focus-visible, .editor-area:focus-visible {
      outline: 2px solid var(--gold-ink);
      outline-offset: 2px;
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">
      <div class="logo-mark">墨</div>
      <div class="logo-text">
        <h1>墨韵</h1>
        <span>AI 学术写作润色工坊</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-ghost" onclick="showAbout()">关于</button>
      <button class="btn btn-accent" onclick="exportResult()">导出结果</button>
    </div>
  </header>

  <!-- Mode selector -->
  <div class="mode-bar">
    <span class="mode-label">润色模式</span>
    <div class="mode-options">
      <button class="mode-btn active" data-mode="standard" onclick="setMode('standard')">标准润色</button>
      <button class="mode-btn" data-mode="chinese" onclick="setMode('chinese')">中式英语纠偏</button>
      <button class="mode-btn" data-mode="academic" onclick="setMode('academic')">学术表达提升</button>
    </div>
    <div class="api-badge">Demo · 示例演示</div>
  </div>

  <!-- Workspace -->
  <div class="workspace">
    <!-- Input Panel -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">原文输入</div>
        <div class="word-count"><span id="wordCount">0</span> 词</div>
      </div>
      <div class="panel-body">
        <textarea 
          id="editor" 
          class="editor-area" 
          placeholder="在此粘贴您的英文论文段落...&#10;&#10;点击下方「加载示例」可快速体验润色功能。"
          oninput="updateCounts()"
        ></textarea>
      </div>
      <div class="action-bar">
        <button class="btn-sample" onclick="loadSample()">加载示例</button>
        <button class="btn-clear" onclick="clearEditor()">清空</button>
        <button class="btn-polish" id="polishBtn" onclick="startPolish()">
          <span>硃</span> 批注润色
        </button>
      </div>
    </div>

    <!-- Output Panel -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">润色结果</div>
        <div class="word-count" id="resultStats"></div>
      </div>
      <div class="panel-body">
        <div id="resultArea">
          <div class="result-empty">
            <div class="result-empty-icon">硃</div>
            <p>在左侧输入论文段落<br>点击「批注润色」查看结果</p>
          </div>
        </div>
      </div>
      <div class="stats-bar" id="statsBar" style="display: none;">
        <div class="stat-item">
          <span class="stat-label">修改</span>
          <span class="stat-value" id="changeCount">0</span>
          <span class="stat-label">处</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">可读性</span>
          <span class="stat-value positive" id="readability">+0%</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">正式度</span>
          <span class="stat-value" id="formality">—</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // State
    let currentMode = 'standard';
    let isProcessing = false;

    // Sample texts
    const sampleTexts = {
      standard: `The research of deep learning have made great progress in recent years. It can be used in many fields such as computer vision, natural language processing and speech recognition. In this paper, we propose a new method which is better than the old methods. The experiment results show that our method achieve the state-of-the-art performance on several benchmark datasets.`,
      
      chinese: `The reason of this phenomenon is because the data is not enough. We make the model can learn more features through this method. The result is very good, it is much better than before. There have many researchers studied this problem. According to the experiment, we can see that our method work well.`,
      
      academic: `We think that this method is good. The results are nice. Many people use deep learning now. Our model is better than others. The experiments show good results. This is important for future work.`
    };

    // Polish results
    const polishResults = {
      standard: {
        text: `The research <span class="hl-remove">of</span> <span class="hl-add">on</span> deep learning <span class="hl-remove">have</span> <span class="hl-add">has</span> made great progress in recent years. It can be <span class="hl-add">widely</span> applied in many fields such as computer vision, natural language processing<span class="hl-add">,</span> and speech recognition. In this paper, we propose a new method <span class="hl-remove">which is</span> <span class="hl-add">that</span> <span class="hl-add">outperforms</span> <span class="hl-remove">better than the old</span> existing methods. The <span class="hl-remove">experiment</span> <span class="hl-add">experimental</span> results show that our method <span class="hl-remove">achieve</span> <span class="hl-add">achieves</span> state-of-the-art performance on several benchmark datasets.`,
        suggestions: [
          {
            type: 'grammar',
            original: 'The research of deep learning have made',
            revised: 'The research on deep learning has made',
            reason: '介词搭配：research 后应接 on；主谓一致：research 为单数，动词用 has。'
          },
          {
            type: 'style',
            original: 'It can be used in many fields',
            revised: 'It can be widely applied in many fields',
            reason: '学术正式度：用 applied 替代 used，添加 widely 增强表达力度。'
          },
          {
            type: 'clarity',
            original: 'which is better than the old methods',
            revised: 'that outperforms existing methods',
            reason: '简化冗余表达，使用精准动词 outperform 和学术形容词 existing。'
          },
          {
            type: 'grammar',
            original: 'The experiment results show that our method achieve',
            revised: 'The experimental results show that our method achieves',
            reason: '名词修饰语用形容词 experimental；主谓一致：method 单数，用 achieves。'
          }
        ],
        stats: { changes: 8, readability: '+15%', formality: '优秀' }
      },
      
      chinese: {
        text: `The <span class="hl-remove">reason of</span> <span class="hl-add">cause of</span> this phenomenon <span class="hl-remove">is because</span> <span class="hl-add">is that</span> the data is <span class="hl-remove">not enough</span> <span class="hl-add">insufficient</span>. We <span class="hl-remove">make the model can</span> <span class="hl-add">enable the model to</span> learn more features through this method. The result is <span class="hl-remove">very good, it is much</span> <span class="hl-add">promising, significantly</span> better than before. <span class="hl-remove">There have</span> <span class="hl-add">Many</span> researchers <span class="hl-add">have</span> studied this problem. <span class="hl-remove">According to</span> <span class="hl-add">Based on</span> the experiment<span class="hl-add">al results</span>, we can see that our method <span class="hl-remove">work</span> <span class="hl-add">works</span> well.`,
        suggestions: [
          {
            type: 'grammar',
            original: 'The reason of this phenomenon is because',
            revised: 'The cause of this phenomenon is that',
            reason: '【中式英语】"The reason...is because" 是典型中式表达，应为 "The cause...is that"。'
          },
          {
            type: 'style',
            original: 'the data is not enough',
            revised: 'the data is insufficient',
            reason: '【中式英语】"not enough" 口语化，学术写作应用 "insufficient"。'
          },
          {
            type: 'grammar',
            original: 'We make the model can learn',
            revised: 'We enable the model to learn',
            reason: '【中式英语】"make...can" 是 "使...能" 直译，应为 "enable...to"。'
          },
          {
            type: 'grammar',
            original: 'There have many researchers',
            revised: 'Many researchers have',
            reason: '【中式英语】"There have" 是 "有" 直译错误，英语无此结构。'
          }
        ],
        stats: { changes: 12, readability: '+25%', formality: '良好' }
      },
      
      academic: {
        text: `We <span class="hl-remove">think that</span> <span class="hl-add">believe</span> this method is <span class="hl-remove">good</span> <span class="hl-add">effective</span>. The results are <span class="hl-remove">nice</span> <span class="hl-add">promising</span>. <span class="hl-remove">Many people</span> <span class="hl-add">Numerous researchers</span> <span class="hl-remove">use</span> <span class="hl-add">employ</span> deep learning <span class="hl-add">currently</span>. Our model <span class="hl-remove">is better than</span> <span class="hl-add">outperforms</span> <span class="hl-add">existing</span> others. The experiments show <span class="hl-remove">good</span> <span class="hl-add">favorable</span> results. This is <span class="hl-remove">important</span> <span class="hl-add">significant</span> for future work.`,
        suggestions: [
          {
            type: 'style',
            original: 'We think that this method is good',
            revised: 'We believe this method is effective',
            reason: '【学术表达】think → believe 更正式；good → effective 更具体。'
          },
          {
            type: 'style',
            original: 'The results are nice',
            revised: 'The results are promising',
            reason: '【学术表达】nice 口语化，promising 更适合描述研究结果。'
          },
          {
            type: 'style',
            original: 'Many people use deep learning',
            revised: 'Numerous researchers employ deep learning',
            reason: '【学术表达】many people → numerous researchers；use → employ 更正式。'
          },
          {
            type: 'clarity',
            original: 'Our model is better than others',
            revised: 'Our model outperforms existing approaches',
            reason: '【学术表达】用 outperform 替代比较级，existing approaches 替代模糊 others。'

    };

    // Mode selection
    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
      });
    }

    // Update counts
    function updateCounts() {
      const text = document.getElementById('editor').value;
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      document.getElementById('wordCount').textContent = words;
    }

    // Load sample
    function loadSample() {
      document.getElementById('editor').value = sampleTexts[currentMode];
      updateCounts();
    }

    // Clear
    function clearEditor() {
      document.getElementById('editor').value = '';
      updateCounts();
      document.getElementById('resultArea').innerHTML = `
        <div class="result-empty">
          <div class="result-empty-icon">硃</div>
          <p>在左侧输入论文段落<br>点击「批注润色」查看结果</p>
        </div>
      `;
      document.getElementById('statsBar').style.display = 'none';
    }

    // Start polish
    function startPolish() {
      const text = document.getElementById('editor').value.trim();
      if (!text) {
        alert('请先输入或粘贴论文文本');
        return;
      }
      
      if (isProcessing) return;
      isProcessing = true;
      
      const btn = document.getElementById('polishBtn');
      btn.disabled = true;
      btn.innerHTML = '<span>···</span> 润色中';
      
      document.getElementById('resultArea').innerHTML = `
        <div class="loading active">
          <div class="spinner"></div>
          <p class="loading-text">AI 正在分析您的论文...</p>
        </div>
      `;
      
      setTimeout(() => {
        const result = polishResults[currentMode];
        
        document.getElementById('resultArea').innerHTML = `
          <div class="result-text">${result.text}</div>
          
          <div class="suggestions-section">
            <div class="suggestions-header">
              <span class="suggestions-title">修改批注</span>
              <span class="suggestions-count">${result.suggestions.length}</span>
            </div>
            ${result.suggestions.map(s => `
              <div class="suggestion-item">
                <div class="suggestion-type type-${s.type}">${
                  s.type === 'grammar' ? '语法' : 
                  s.type === 'style' ? '表达' : '清晰'
                }</div>
                <div class="suggestion-original">${s.original}</div>
                <div class="suggestion-revised">${s.revised}</div>
                <div class="suggestion-reason">${s.reason}</div>
              </div>
            `).join('')}
          </div>
        `;
        
        document.getElementById('statsBar').style.display = 'flex';
        document.getElementById('changeCount').textContent = result.stats.changes;
        document.getElementById('readability').textContent = result.stats.readability;
        document.getElementById('formality').textContent = result.stats.formality;
        
        btn.disabled = false;
        btn.innerHTML = '<span>硃</span> 批注润色';
        isProcessing = false;
      }, 1200);
    }

    // Export
    function exportResult() {
      const resultDiv = document.querySelector('.result-text');
      if (!resultDiv) {
        alert('请先进行润色');
        return;
      }
      const text = resultDiv.innerText;
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'polished_text.txt';
      a.click();
      URL.revokeObjectURL(url);
    }

    // About
    function showAbout() {
      alert('墨韵 — AI 学术写作润色工坊\n\nTRAE AI 创造力大赛 初赛 Demo\n学习工作赛道\n\n本 Demo 展示核心润色功能，实际产品将接入 AI API。');
    }
  </script>
