<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f5132" />
  <title>安心手机助手 v2 - 参赛优化版</title>
  <style>
    :root {
      --bg: #f4f7f1;
      --card: #ffffff;
      --ink: #14231a;
      --muted: #5f6d64;
      --line: #d7e2da;
      --green: #0f5132;
      --green2: #1b7a50;
      --yellow: #f5c542;
      --red: #b91c1c;
      --blue: #1d4ed8;
      --shadow: 0 16px 34px rgba(15, 81, 50, 0.14);
      --radius: 26px;
      --font-scale: 1;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      background:
        radial-gradient(circle at top left, rgba(27,122,80,.18), transparent 36%),
        linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: calc(19px * var(--font-scale));
    }

    button, input, textarea, select { font: inherit; }
    button { border: 0; cursor: pointer; }

    .app {
      width: min(100%, 480px);
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      background: rgba(255,255,255,.72);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }

    .top {
      padding: 20px 18px 14px;
      background: rgba(255,255,255,.94);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 5;
      backdrop-filter: blur(16px);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: var(--green);
      color: #fff;
      font-size: 30px;
      font-weight: 900;
    }

    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 4px; font-size: 25px; line-height: 1.1; }
    .sub { margin: 0; color: var(--muted); font-size: .86em; }

    .demo-btn {
      min-height: 50px;
      padding: 8px 12px;
      border-radius: 16px;
      background: #edf7f0;
      color: var(--green);
      font-weight: 900;
    }

    main { padding: 18px; padding-bottom: 24px; }

    .hero {
      padding: 18px;
      border-radius: 30px;
      color: #fff;
      background:
        linear-gradient(135deg, rgba(15,81,50,.96), rgba(27,122,80,.9)),
        radial-gradient(circle at 80% 10%, rgba(245,197,66,.45), transparent 38%);
      box-shadow: var(--shadow);
    }

    .hero h2 { margin-bottom: 8px; font-size: 27px; }
    .hero p { margin-bottom: 14px; color: rgba(255,255,255,.88); line-height: 1.55; }

    .hero-actions, .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .primary, .soft, .danger, .plain {
      min-height: 62px;
      padding: 12px 14px;
      border-radius: 20px;
      font-weight: 900;
      transition: transform .12s ease, filter .12s ease;
    }

    .primary:active, .soft:active, .danger:active, .plain:active, .tile:active {
      transform: scale(.97);
      filter: brightness(.96);
    }

    .primary { background: #fff; color: var(--green); }
    .soft { background: rgba(255,255,255,.16); color: #fff; outline: 2px solid rgba(255,255,255,.42); }
    .danger { background: var(--red); color: #fff; box-shadow: var(--shadow); }
    .plain { background: #edf2ee; color: var(--ink); }
    .plain.green { background: var(--green); color: #fff; }
    .plain.blue { background: var(--blue); color: #fff; }

    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin: 14px 0 18px;
    }

    .metric {
      padding: 12px 10px;
      border-radius: 20px;
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: 0 10px 22px rgba(20,35,26,.06);
    }

    .metric strong {
      display: block;
      color: var(--green);
      font-size: 1.35em;
      line-height: 1;
    }

    .metric span { display: block; margin-top: 6px; color: var(--muted); font-size: .78em; }

    .section-title {
      display: flex;
      align-items: end;
      justify-content: space-between;
      margin: 18px 2px 12px;
    }

    .section-title h2 { margin: 0; font-size: 23px; }
    .section-title span { color: var(--muted); font-size: .78em; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px;
    }

    .tile {
      min-height: 140px;
      padding: 15px;
      text-align: left;
      color: var(--ink);
      border-radius: var(--radius);
      background: var(--card);
      border: 2px solid var(--line);
      box-shadow: 0 10px 20px rgba(20,35,26,.07);
    }

    .tile .icon {
      display: grid;
      place-items: center;
      width: 66px;
      height: 66px;
      margin-bottom: 10px;
      border-radius: 22px;
      color: var(--green);
      background: #e9f5ec;
      font-size: 31px;
      font-weight: 900;
    }

    .tile b { display: block; font-size: 1.13em; }
    .tile small { display: block; margin-top: 5px; color: var(--muted); line-height: 1.35; }

    .sticky-help {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 16px 0 18px;
      padding: 12px;
      border-radius: 26px;
      background: rgba(255,255,255,.94);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .panel {
      position: absolute;
      inset: 0;
      display: none;
      z-index: 20;
      background: rgba(8, 17, 12, .56);
    }

    .panel.show { display: block; }

    .sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      max-height: 88vh;
      overflow: auto;
      padding: 20px;
      border-radius: 30px 30px 0 0;
      background: #fff;
      box-shadow: 0 -14px 36px rgba(0,0,0,.18);
    }

    .sheet h2 { margin-bottom: 8px; font-size: 27px; }
    .sheet p { color: var(--muted); line-height: 1.55; }

    .list { display: grid; gap: 10px; padding: 0; margin: 14px 0; list-style: none; }
    .list li {
      padding: 13px;
      border-radius: 18px;
      background: #f4f7f1;
      border: 1px solid var(--line);
      line-height: 1.45;
    }

    .assist-log {
      display: grid;
      gap: 10px;
      margin: 14px 0;
      padding: 12px;
      border-radius: 20px;
      background: #f7fbf8;
      border: 1px solid var(--line);
    }

    .assist-log div {
      padding: 10px 12px;
      border-radius: 16px;
      background: #fff;
      border: 1px solid var(--line);
    }

    .assist-log b {
      color: var(--green);
    }

    .quick-card {
      display: grid;
      gap: 10px;
      margin: 14px 0;
      padding: 16px;
      border-radius: 22px;
      background: #f1f8f3;
      border: 1px solid var(--line);
    }

    .quick-card strong {
      color: var(--green);
      font-size: 1.08em;
    }

    .quick-card small {
      color: var(--muted);
      line-height: 1.45;
    }

    .form { display: grid; gap: 12px; margin: 14px 0; }
    label { display: grid; gap: 7px; font-weight: 900; }
    input, textarea, select {
      width: 100%;
      min-height: 56px;
      padding: 12px;
      color: var(--ink);
      border: 2px solid var(--line);
      border-radius: 18px;
      background: #fbfdfb;
    }

    textarea { min-height: 110px; resize: vertical; }

    .toast {
      position: absolute;
      left: 18px;
      right: 18px;
      top: 92px;
      display: none;
      padding: 14px 16px;
      border-radius: 18px;
      background: #14231a;
      color: #fff;
      z-index: 40;
      line-height: 1.45;
      box-shadow: var(--shadow);
    }

    .toast.show { display: block; }

    .highlight {
      position: relative;
      z-index: 21;
      border-color: var(--yellow) !important;
      box-shadow: 0 0 0 7px rgba(245,197,66,.38), var(--shadow) !important;
      transform: scale(1.02);
    }

    .risk-low { color: var(--green); font-weight: 900; }
    .risk-mid { color: #a16207; font-weight: 900; }
    .risk-high { color: var(--red); font-weight: 900; }

    .large-mode { --font-scale: 1.16; }

    @media (max-width: 390px) {
      .app { border: 0; }
      .hero-actions, .two, .sticky-help { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: 1fr; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="top">
      <div class="brand">
        <div class="brand-left">
          <div class="logo" aria-hidden="true">安</div>
          <div>
            <h1>安心手机助手 v2</h1>
            <p class="sub">参赛优化版：会听、会教、会托管</p>
          </div>
        </div>
        <button class="demo-btn" id="demoBtn">演示</button>
      </div>
    </header>

    <main>
      <section class="hero">
        <h2>老人不会用手机时，有人一步一步陪着做</h2>
        <p>把“大字桌面、语音教程、防诈骗提醒、吃药提醒、紧急求助、家人留言”合成一个更安全的手机入口。</p>
        <div class="hero-actions">
          <button class="primary" data-open="voice">语音教我</button>
          <button class="soft" data-open="settings">先设家人</button>
        </div>
      </section>

      <section class="metrics" aria-label="当前状态">
        <div class="metric"><strong id="safetyScore">86</strong><span>安心指数</span></div>
        <div class="metric"><strong id="medicineCount">0</strong><span>吃药提醒</span></div>
        <div class="metric"><strong id="messageCount">0</strong><span>家人留言</span></div>
      </section>

      <div class="sticky-help">
        <button class="danger" id="emergencyDirect">紧急求助<br><small>双击直接联系</small></button>
        <button class="plain green" id="voiceQuick">说话求助</button>
      </div>

      <div class="section-title">
        <h2>常用功能</h2>
        <span>大按钮，少选择</span>
      </div>

      <section class="grid">
        <button class="tile" data-open="voice" id="tileVoice"><span class="icon">听</span><b>AI 语音教我</b><small>老人说话，系统识别后打开功能</small></button>
        <button class="tile" data-open="accessibility" id="tileAccess"><span class="icon">托</span><b>无障碍托管</b><small>授权后可辅助点击下一步</small></button>
        <button class="tile" data-open="wechat" id="tileWechat"><span class="icon">微</span><b>微信视频</b><small>黄色框和语音一步一步教</small></button>
        <button class="tile" data-open="phone"><span class="icon">☎</span><b>打电话</b><small>优先显示家人电话</small></button>
        <button class="tile" data-open="medicine" id="tileMedicine"><span class="icon">药</span><b>吃药提醒</b><small>记录药名和提醒时间</small></button>
        <button class="tile" data-open="fraud" id="tileFraud"><span class="icon">防</span><b>防诈骗检查</b><small>输入陌生短信，一键判断风险</small></button>
        <button class="tile" data-open="location" id="tileLocation"><span class="icon">位</span><b>定位绑定</b><small>绑定家人后共享当前位置</small></button>
        <button class="tile" data-open="magnifier"><span class="icon">大</span><b>放大模式</b><small>一键放大文字和按钮</small></button>
        <button class="tile" data-open="family"><span class="icon">家</span><b>家人留言</b><small>子女可写简单提醒</small></button>
        <button class="tile" data-open="tutorial"><span class="icon">学</span><b>教程中心</b><small>扫码、支付、健康码等教程</small></button>
        <button class="tile" data-open="profile"><span class="icon">卡</span><b>安心卡片</b><small>紧急信息集中保存</small></button>
      </section>
    </main>

    <section class="panel" id="panel">
      <div class="sheet">
        <h2 id="panelTitle">标题</h2>
        <p id="panelIntro">说明文字</p>
        <div id="panelBody"></div>
        <div class="two">
          <button class="plain" id="closePanel">关闭</button>
          <button class="plain green" id="readPanel">读给我听</button>
        </div>
      </div>
    </section>

    <div class="toast" id="toast"></div>
  </div>

  <script>
    const app = document.querySelector("#app");
    const panel = document.querySelector("#panel");
    const panelTitle = document.querySelector("#panelTitle");
    const panelIntro = document.querySelector("#panelIntro");
    const panelBody = document.querySelector("#panelBody");
    const toast = document.querySelector("#toast");
    const medicineCount = document.querySelector("#medicineCount");
    const messageCount = document.querySelector("#messageCount");
    const safetyScore = document.querySelector("#safetyScore");
    const emergencyDirect = document.querySelector("#emergencyDirect");

    const state = {
      contact: JSON.parse(localStorage.getItem("aa_contact") || "{}"),
      profile: JSON.parse(localStorage.getItem("aa_profile") || "{}"),
      medicines: JSON.parse(localStorage.getItem("aa_medicines") || "[]"),
      messages: JSON.parse(localStorage.getItem("aa_messages") || "[]"),
      large: localStorage.getItem("aa_large") === "1",
      accessibility: localStorage.getItem("aa_accessibility") === "1",
      voiceProvider: localStorage.getItem("aa_voice_provider") || "千问助手",
      locationBinding: JSON.parse(localStorage.getItem("aa_location_binding") || "{}")
    };

    const tutorials = {
      wechat: ["点微信视频。", "选择家人头像。", "点视频通话。", "听到铃声后等待接通。"],
      phone: ["点打电话。", "确认要联系的人。", "点绿色拨打。", "通话结束点挂断。"],
      tutorial: ["选择想学的事情。", "看黄色框提示。", "听语音提示。", "不会时点读给我听。"]
    };

    const commandDictionary = [
      { intent: "wechat", label: "打开微信视频", words: ["微信视频", "视频通话", "跟女儿视频", "跟儿子视频", "打开微信", "微信"] },
      { intent: "phone", label: "打电话", words: ["打电话", "给女儿打电话", "给儿子打电话", "联系家人", "拨号"] },
      { intent: "fraud", label: "防诈骗检查", words: ["诈骗", "短信是不是假的", "检查短信", "验证码", "转账", "陌生电话"] },
      { intent: "medicine", label: "吃药提醒", words: ["吃药", "提醒吃药", "药", "降压药", "几点吃药"] },
      { intent: "emergency", label: "紧急求助", words: ["紧急", "求助", "救命", "不舒服", "摔倒", "联系家人"] },
      { intent: "location", label: "定位绑定", words: ["定位", "位置", "我在哪", "让家人看位置", "共享位置", "绑定位置"] },
      { intent: "magnifier", label: "放大模式", words: ["看不清", "字太小", "放大", "大字"] },
      { intent: "family", label: "家人留言", words: ["家人留言", "女儿说什么", "儿子留言", "提醒我"] },
      { intent: "profile", label: "安心卡片", words: ["安心卡片", "我的信息", "疾病", "住址"] },
      { intent: "tutorial", label: "教程中心", words: ["教我", "不会用", "怎么用", "教程", "学习"] }
    ];

    function persist() {
      localStorage.setItem("aa_contact", JSON.stringify(state.contact));
      localStorage.setItem("aa_profile", JSON.stringify(state.profile));
      localStorage.setItem("aa_medicines", JSON.stringify(state.medicines));
      localStorage.setItem("aa_messages", JSON.stringify(state.messages));
      localStorage.setItem("aa_large", state.large ? "1" : "0");
      localStorage.setItem("aa_accessibility", state.accessibility ? "1" : "0");
      localStorage.setItem("aa_voice_provider", state.voiceProvider);
      localStorage.setItem("aa_location_binding", JSON.stringify(state.locationBinding));
      refreshMetrics();
    }

    function refreshMetrics() {
      medicineCount.textContent = state.medicines.length;
      messageCount.textContent = state.messages.length;
      let score = 60;
      if (state.contact.phone) score += 12;
      if (state.profile.name) score += 8;
      if (state.medicines.length) score += 8;
      if (state.messages.length) score += 4;
      if (state.large) score += 3;
      if (state.accessibility) score += 4;
      if (state.locationBinding.enabled) score += 5;
      safetyScore.textContent = Math.min(score, 99);
      app.classList.toggle("large-mode", state.large);
      if (emergencyDirect) {
        emergencyDirect.innerHTML = state.contact.phone
          ? "紧急求助<br><small>双击直接联系</small>"
          : "紧急求助<br><small>先添加联系对象</small>";
      }
    }

    function speak(text) {
      if (!("speechSynthesis" in window)) return showToast("当前浏览器不支持语音播报。");
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "zh-CN";
      u.rate = 0.82;
      speechSynthesis.speak(u);
    }

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add("show");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => toast.classList.remove("show"), 2800);
    }

    function openPanel(type) {
      document.querySelectorAll(".highlight").forEach(el => el.classList.remove("highlight"));
      const map = {
        voice: voicePanel,
        settings: settingsPanel,
        wechat: wechatCallPanel,
        phone: phonePanel,
        medicine: medicinePanel,
        fraud: fraudPanel,
        magnifier: magnifierPanel,
        family: familyPanel,
        tutorial: tutorialPanel,
        profile: profilePanel,
        location: locationPanel,
        accessibility: accessibilityPanel,
        emergency: emergencyPanel
      };
      (map[type] || tutorialPanel)();
      panel.classList.add("show");
    }

    function setPanel(title, intro, body) {
      panelTitle.textContent = title;
      panelIntro.textContent = intro;
      panelBody.innerHTML = body;
    }

    function guidePanel(title, steps, highlightSelector) {
      if (highlightSelector) document.querySelector(highlightSelector).classList.add("highlight");
      setPanel(title, "语音会读出步骤，老人只需要跟着黄色框和文字做。", `<ol class="list">${steps.map(s => `<li>${s}</li>`).join("")}</ol>`);
      speak(`${title}。${steps.join("。")}`);
    }

    function voicePanel() {
      setPanel("AI 语音助手", "可选择千问助手或豆包助手。老人说一句话后，助手先理解意图，再交给无障碍辅助打开功能并提示下一步。", `
        <div class="quick-card">
          <strong>当前助手：${state.voiceProvider}</strong>
          <small>无障碍辅助：${state.accessibility ? "已开启" : "未开启"}</small>
          <small>正式版可接入千问或豆包大模型；当前原型用本地词库模拟识别。</small>
        </div>
        <div class="form">
          <label>选择语音助手
            <select id="voiceProvider">
              <option value="千问助手">千问助手</option>
              <option value="豆包助手">豆包助手</option>
            </select>
          </label>
        </div>
        <div class="two">
          <button class="plain green" id="startVoice">开始听我说</button>
          <button class="plain blue" id="openAccess">开启无障碍辅助</button>
        </div>
        <ul class="list">
          <li>可以说：帮我打开微信视频。</li>
          <li>可以说：我看不清，帮我放大。</li>
          <li>可以说：这条短信是不是诈骗。</li>
          <li>可以说：我不舒服，帮我求助。</li>
          <li>可以说：帮我共享位置给家人。</li>
          <li>执行规则：无障碍辅助：已开启 后，千问或豆包才能继续帮老人打开功能并辅助下一步。</li>
        </ul>
      `);
      setTimeout(() => {
        const provider = document.querySelector("#voiceProvider");
        provider.value = state.voiceProvider;
        provider.addEventListener("change", () => {
          state.voiceProvider = provider.value;
          persist();
          showToast(`已切换为${state.voiceProvider}。`);
          speak(`已切换为${state.voiceProvider}。`);
          openPanel("voice");
        });
        document.querySelector("#startVoice")?.addEventListener("click", startVoice);
        document.querySelector("#openAccess")?.addEventListener("click", () => openPanel("accessibility"));
      }, 0);
    }

    function accessibilityPanel() {
      setPanel("无障碍托管模式", "开启后，老人说出目标，系统先识别意图，再打开对应功能，并模拟“帮老人按下一步”的托管流程。真实 Android App 中，这部分应由 AccessibilityService 在老人授权后完成。", `
        <div class="two">
          <button class="plain green" id="accessOn">开启托管</button>
          <button class="plain" id="accessOff">关闭托管</button>
        </div>
        <div class="assist-log">
          <div><b>第 1 步</b> 老人说：“帮我打开微信视频”。</div>
          <div><b>第 2 步</b> AI 词库匹配到“微信视频”。</div>
          <div><b>第 3 步</b> 系统打开对应功能，并高亮下一步按钮。</div>

    let autoReportTimer = null;

    function startAutoReport() {
      stopAutoReport();
      const minutes = Number(state.locationBinding.intervalMin) || 30;
      const ms = Math.max(60_000, minutes * 60_000);
      autoReportTimer = setInterval(() => updateLocation(false), ms);
    }

    function stopAutoReport() {
      if (autoReportTimer) {
        clearInterval(autoReportTimer);
        autoReportTimer = null;
      }
    }

    function logReport(status, note) {
      state.locationBinding.reportLog = state.locationBinding.reportLog || [];
      state.locationBinding.reportLog.push({
        time: new Date().toLocaleString("zh-CN"),
        status,
        note: note || ""
      });
      if (state.locationBinding.reportLog.length > 20) {
        state.locationBinding.reportLog = state.locationBinding.reportLog.slice(-20);
      }
      persist();
    }

    function fallbackNotify(reason) {
      const last = state.locationBinding.lastLocation;
      const fallback = state.locationBinding.fallback || "短信";
      const phone = state.locationBinding.contactPhone || state.contact.phone;
      if (!last || !phone) {
        logReport("失败", `${reason}，且没有可发送的最后位置。`);
        showToast("断网或定位失败，且没有最后位置可发送。");
        speak("定位失败，且没有可发送的最后位置。");
        return;
      }
      const url = `https://maps.google.com/?q=${last.latitude},${last.longitude}`;
      const msg = `自动定位失败（${reason}）。最后一次位置（${last.time}）：${url}`;
      logReport("回退", `${fallback}：${reason}`);
      showToast(`已用${fallback}把最后位置发给家人。`);
      speak(`定位失败，已用${fallback}把最后位置发给${state.locationBinding.contactName || "家人"}。`);
      if (fallback.includes("短信")) {
        try { window.open(`sms:${encodeURIComponent(phone)}?body=${encodeURIComponent(msg)}`, "_self"); } catch (e) {}
      }
      if (fallback.includes("电话")) {
        try { window.open(`tel:${encodeURIComponent(phone)}`, "_self"); } catch (e) {}
      }
    }

    function enableLocationBinding() {
      if (!state.contact.phone) {
        showToast("请先添加紧急联系对象。");
        speak("请先添加紧急联系对象，绑定后家人才可以查看位置。");
        openPanel("settings");
        return;
      }
      state.locationBinding.enabled = true;
      state.locationBinding.contactPhone = state.contact.phone;
      state.locationBinding.contactName = state.contact.name || "家人";
      persist();
      speak("已开启定位绑定。现在可以更新当前位置，让紧急联系对象查看。");
      updateLocation();
    }

    function updateLocation(manual) {
      if (!state.locationBinding.enabled) {
        if (manual) {
          showToast("请先开启定位绑定。");
          speak("请先开启定位绑定。");
        }
        return;
      }
      if (!navigator.onLine) {
        fallbackNotify("断网");
        return;
      }
      if (!navigator.geolocation) {
        if (manual) showToast("当前浏览器不支持定位。");
        fallbackNotify("浏览器不支持定位");
        return;
      }
      navigator.geolocation.getCurrentPosition(
        position => {
          state.locationBinding.lastLocation = {
            latitude: position.coords.latitude,
            longitude: position.coords.longitude,
            time: new Date().toLocaleString("zh-CN")
          };
          logReport("成功", manual ? "手动上报" : "自动上报");
          persist();
          if (manual) {
            showToast("当前位置已更新，家人端可查看。");
            speak("当前位置已更新，家人端可以查看。");
            openPanel("location");
          }
        },
        () => {
          fallbackNotify("定位失败");
        },
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
      );
    }

          <label>老人姓名<input id="profileName" value="${state.profile.name || ""}" placeholder="例如：张阿姨" /></label>
          <label>常见疾病<input id="profileIllness" value="${state.profile.illness || ""}" placeholder="例如：高血压、糖尿病" /></label>
          <label>住址<input id="profileAddress" value="${state.profile.address || ""}" placeholder="例如：幸福小区 3 号楼" /></label>
          <button class="plain green" id="saveProfile">保存安心卡片</button>
        </div>
      `);
      setTimeout(() => document.querySelector("#saveProfile").addEventListener("click", () => {
        state.profile = {
          name: document.querySelector("#profileName").value.trim(),
          illness: document.querySelector("#profileIllness").value.trim(),
          address: document.querySelector("#profileAddress").value.trim()
        };
        persist();
        showToast("已保存安心卡片。");
        speak("已保存安心卡片。");
      }), 0);
    }

    function emergencyPanel() {
      const who = state.contact.name && state.contact.phone ? `${state.contact.name}（${state.contact.phone}）` : "还没有设置家人联系人";
      setPanel("紧急求助", "确认后会尝试生成短信。真实 App 可接入定位、短信、拨号和家人端提醒。", `
        <ul class="list">
          <li>联系对象：${who}</li>
          <li>安心卡片：${state.profile.name || "未填写"} ${state.profile.illness ? "，" + state.profile.illness : ""}</li>
        </ul>
        <button class="danger" id="sendHelp">确认求助</button>
      `);
      setTimeout(() => document.querySelector("#sendHelp").addEventListener("click", () => {
        if (!state.contact.phone) {
          showToast("请先设置家人联系人。");
          openPanel("settings");
          return;
        }
        const msg = `我需要帮助，请尽快联系我。${state.profile.address ? "我的住址：" + state.profile.address : ""}`;
        location.href = `sms:${encodeURIComponent(state.contact.phone)}?body=${encodeURIComponent(msg)}`;
      }), 0);
    }

    function directEmergencyContact() {
      if (!state.contact.phone) {
        showToast("还没有添加联系对象，先设置后才能双击直接联系。");
        speak("还没有添加联系对象，请先设置家人联系人。设置完成后，双击紧急求助才能直接联系。");
        openPanel("settings");
        return;
      }
      const name = state.contact.name || "家人";
      const msg = `我需要帮助，请尽快联系我。${state.profile.address ? "我的住址：" + state.profile.address : ""}`;
      speak(`正在直接联系${name}。`);
      showToast(`正在联系：${name}`);
      location.href = `sms:${encodeURIComponent(state.contact.phone)}?body=${encodeURIComponent(msg)}`;
    }

    function startVoice() {
      const R = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!state.accessibility) {
        showToast("请先开启无障碍辅助，再执行语音任务。");
        speak("请先开启无障碍辅助。开启后，我才能根据语音帮你打开功能并辅助下一步。");
        openPanel("accessibility");
        return;
      }
      if (!R) return runAssistantCommand("帮我打开微信视频");
      const r = new R();
      r.lang = "zh-CN";
      r.onresult = e => {
        const text = e.results[0][0].transcript;
        runAssistantCommand(text);
      };
      r.onerror = () => showToast("没有听清楚，请再试一次。");
      r.start();
      speak(`我是${state.voiceProvider}，请说出你想做的事。`);
    }

    function matchVoiceCommand(text) {
      const clean = text.replace(/\s/g, "");
      let best = null;
      commandDictionary.forEach(item => {
        const hitCount = item.words.filter(word => clean.includes(word)).length;
        if (hitCount > 0 && (!best || hitCount > best.hitCount)) {
          best = { ...item, hitCount };
        }
      });
      return best;
    }

    function runAssistantCommand(text) {
      const matched = matchVoiceCommand(text);
      if (!matched) {
        showToast(`${state.voiceProvider}听到：“${text}”，但还没识别到功能。`);
        speak(`${state.voiceProvider}还没有听懂。可以说，帮我打开微信视频，或者检查诈骗短信。`);
        return;
      }
      if (!state.accessibility) {
        showToast("请先开启无障碍辅助，再执行语音任务。");
        speak("请先开启无障碍辅助。");
        openPanel("accessibility");
        return;
      }
      showToast(`${state.voiceProvider}听到：“${text}”。已识别：${matched.label}`);
      speak(`${state.voiceProvider}已识别，${matched.label}。无障碍辅助正在打开。`);
      setTimeout(() => {
        openPanel(matched.intent);
        speak(`无障碍辅助已打开${matched.label}。我会继续提示下一步。`);
      }, 700);
    }

    function runCommand(text) {
      runAssistantCommand(text);
    }

    document.querySelectorAll("[data-open]").forEach(btn => btn.addEventListener("click", () => openPanel(btn.dataset.open)));
    document.querySelector("#voiceQuick").addEventListener("click", () => openPanel("voice"));
    let emergencyClickTimer = null;
    document.querySelector("#emergencyDirect").addEventListener("click", () => {
      clearTimeout(emergencyClickTimer);
      emergencyClickTimer = setTimeout(() => {
        openPanel("emergency");
        speak("这是紧急求助。双击这个红色按钮，可以直接联系你设置的联系人。");
      }, 260);
    });
    document.querySelector("#emergencyDirect").addEventListener("dblclick", () => {
      clearTimeout(emergencyClickTimer);
      directEmergencyContact();
    });
    document.querySelector("#closePanel").addEventListener("click", () => { panel.classList.remove("show"); speechSynthesis?.cancel(); });
    document.querySelector("#readPanel").addEventListener("click", () => speak(`${panelTitle.textContent}。${panelIntro.textContent}。${panelBody.innerText}`));
    document.querySelector("#demoBtn").addEventListener("click", () => {
      const seq = ["#tileWechat", "#tileFraud", "#tileMedicine"];
      let i = 0;
      panel.classList.remove("show");
      document.querySelectorAll(".highlight").forEach(el => el.classList.remove("highlight"));
      speak("参赛演示开始。先看微信视频引导，再看防诈骗检查，最后看吃药提醒。");
      const timer = setInterval(() => {
        document.querySelectorAll(".highlight").forEach(el => el.classList.remove("highlight"));
        const el = document.querySelector(seq[i]);
        if (el) el.classList.add("highlight");
        i += 1;
        if (i >= seq.length) clearInterval(timer);
      }, 1300);
    });

    refreshMetrics();
    if (state.locationBinding && state.locationBinding.enabled && state.locationBinding.autoEnabled) {
      startAutoReport();
    }
  </script>
</body>
</html>
