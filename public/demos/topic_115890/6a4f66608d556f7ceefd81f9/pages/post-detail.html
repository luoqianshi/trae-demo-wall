<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宝宝成长记 - 帖子详情</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .post-detail-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
      margin-bottom: 20px;
    }

    .detail-author-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .detail-author-row .post-avatar {
      width: 44px;
      height: 44px;
    }

    .detail-author-name {
      font-size: 15px;
      font-weight: 600;
    }

    .detail-time {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .detail-tags {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .detail-content {
      font-size: 15px;
      color: var(--text-primary);
      line-height: 1.8;
      margin-bottom: 20px;
    }

    .detail-actions {
      display: flex;
      gap: 24px;
      padding: 16px 0;
      border-top: 1px solid var(--border-light);
      border-bottom: 1px solid var(--border-light);
    }

    .detail-action {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition);
      padding: 8px 16px;
      border-radius: var(--radius-full);
      user-select: none;
    }

    .detail-action:hover {
      background: var(--bg);
    }

    .detail-action.liked {
      color: var(--danger);
    }

    .detail-action.liked i {
      animation: likeAnim 0.3s ease;
    }

    @keyframes likeAnim {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    .detail-delete-btn {
      margin-left: auto;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: var(--radius);
      transition: var(--transition);
    }

    .detail-delete-btn:hover {
      background: var(--danger-50);
      color: var(--danger);
    }

    .comments-section {
      margin-top: 20px;
    }

    .comments-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .comments-title .count {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .comment-item {
      display: flex;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border-light);
    }

    .comment-item:last-child {
      border-bottom: none;
    }

    .comment-avatar {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: white;
      flex-shrink: 0;
    }

    .comment-body {
      flex: 1;
      min-width: 0;
    }

    .comment-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .comment-author {
      font-size: 13px;
      font-weight: 600;
    }

    .comment-time {
      font-size: 11px;
      color: var(--text-muted);
    }

    .comment-text {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .empty-comments {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    .empty-comments i {
      font-size: 32px;
      margin-bottom: 12px;
      display: block;
      opacity: 0.5;
    }

    .comment-input-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 12px 20px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--border-light);
      z-index: 100;
      display: flex;
      gap: 10px;
      align-items: center;
      max-width: 480px;
      margin: 0 auto;
    }

    .comment-input-bar input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: var(--radius-full);
      font-size: 14px;
      outline: none;
      background: var(--bg);
      color: var(--text-primary);
      font-family: inherit;
      transition: var(--transition);
    }

    .comment-input-bar input:focus {
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 4px var(--primary-50);
    }

    .comment-send-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border: none;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .comment-send-btn:hover {
      transform: scale(1.05);
      box-shadow: var(--shadow-primary);
    }

    .comment-send-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <div class="page-container">
    <header>
      <div class="header-top">
        <button class="action-btn" onclick="goBack()"><i class="fa-solid fa-arrow-left"></i></button>
        <div>
          <div class="baby-name" id="page-title">帖子详情</div>
          <div class="baby-age" id="page-subtitle">社区交流</div>
        </div>
        <div id="header-extra"></div>
      </div>
    </header>

    <main style="padding-bottom: 120px;">
      <!-- 帖子正文 -->
      <div class="post-detail-card" id="post-detail">
        <!-- JS 动态填充 -->
      </div>

      <!-- 评论区 -->
      <div class="comments-section">
        <div class="comments-title">
          <i class="fa-solid fa-comments"></i>
          评论 <span class="count" id="comment-count">0</span>
        </div>
        <div id="comment-list">
          <div class="empty-comments">
            <i class="fa-regular fa-comment-dots"></i>
            暂无评论，快来抢沙发吧~
          </div>
        </div>
      </div>
    </main>

    <!-- 底部评论输入栏 -->
    <div class="comment-input-bar">
      <input type="text" id="comment-input" placeholder="写下你的评论...">
      <button class="comment-send-btn" onclick="submitComment()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>

  <script src="../data/mock.js"></script>
  <script src="../script.js"></script>

  <script>
    const currentUser = '甜甜妈';
    const currentUserAvatar = 'person';
    let postId = null;
    let post = null;
    let posts = [];

    function getPostIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('id');
    }

    function goBack() {
      const referer = document.referrer;
      if (referer && referer.includes('community.html')) {
        history.back();
      } else {
        navigateTo('community.html');
      }
    }

    function renderPost() {
      posts = loadData('communityPosts') || [];
      postId = getPostIdFromUrl();
      if (!postId) {
        showToast('帖子不存在');
        goBack();
        return;
      }

      post = posts.find(p => p.id === postId);
      if (!post) {
        showToast('帖子不存在');
        goBack();
        return;
      }

      // 页面标题
      const isTreehole = post.type === 'treehole';
      document.getElementById('page-title').textContent = isTreehole ? '树洞详情' : '帖子详情';
      document.getElementById('page-subtitle').textContent = isTreehole ? '匿名倾诉' : (post.monthGroup || '社区交流');

      // 删除按钮（仅作者可见）
      const isOwner = post.author === currentUser && !isTreehole;
      document.getElementById('header-extra').innerHTML = isOwner
        ? `<button class="action-btn" onclick="deletePost()" style="background: rgba(255,255,255,0.15);"><i class="fa-solid fa-trash-can"></i></button>`
        : '<div style="width: 40px;"></div>';

      // 帖子内容
      const likeClass = post.likedByMe ? 'liked' : '';
      const likeIcon = post.likedByMe
        ? '<i class="fa-solid fa-heart"></i>'
        : '<i class="fa-regular fa-heart"></i>';
      const commentCount = post.commentList ? post.commentList.length : 0;

      document.getElementById('post-detail').innerHTML = `
        <div class="detail-author-row">
          <div class="post-avatar"><i class="fa-solid fa-${post.avatar || (isTreehole ? 'user-secret' : 'person')}"></i></div>
          <div style="flex: 1;">
            <div class="detail-author-name">${post.author}</div>
            <div class="detail-time">${post.time}</div>
          </div>
        </div>
        ${post.monthGroup ? `<div class="detail-tags">
          <span class="post-tag">${post.monthGroup}</span>
          ${(post.tags || []).map(tag => `<span class="post-tag ${tag === '亲测有效' ? 'valid' : ''}">${tag}</span>`).join('')}
        </div>` : ''}
        <div class="detail-content">${post.content}</div>
        <div class="detail-actions">
          <span class="detail-action ${likeClass}" onclick="toggleLike()">
            ${likeIcon}
            <span>${post.likes}</span>
          </span>
          <span class="detail-action" style="cursor: default;">
            <i class="fa-regular fa-comment"></i>
            <span>${commentCount}</span>
          </span>
        </div>
      `;

      // 评论区
      document.getElementById('comment-count').textContent = commentCount;
      renderComments();
    }

    function renderComments() {
      const commentList = document.getElementById('comment-list');
      if (!post.commentList || post.commentList.length === 0) {
        commentList.innerHTML = `
          <div class="empty-comments">
            <i class="fa-regular fa-comment-dots"></i>
            暂无评论，快来抢沙发吧~
          </div>
        `;
        return;
      }

      commentList.innerHTML = post.commentList.map(comment => `
        <div class="comment-item">
          <div class="comment-avatar"><i class="fa-solid fa-${comment.avatar || 'user'}"></i></div>
          <div class="comment-body">
            <div class="comment-header">
              <span class="comment-author">${comment.author}</span>
              <span class="comment-time">${comment.time}</span>
            </div>
            <div class="comment-text">${comment.content}</div>
          </div>
        </div>
      `).join('');
    }

    function toggleLike() {
      if (!post) return;

      const posts = loadData('communityPosts') || [];
      const idx = posts.findIndex(p => p.id === postId);
      if (idx === -1) return;

      const p = posts[idx];
      if (p.likedByMe) {
        p.likes--;
        p.likedByMe = false;
      } else {
        p.likes++;
        p.likedByMe = true;
      }
      saveData('communityPosts', posts);
      post = p;
      renderPost();
    }

    function submitComment() {
      const input = document.getElementById('comment-input');
      const content = input.value.trim();
      if (!content) {
        showToast('请输入评论内容');
        return;
      }
      if (!post) return;

      const posts = loadData('communityPosts') || [];
      const idx = posts.findIndex(p => p.id === postId);
      if (idx === -1) return;

      const p = posts[idx];
      if (!p.commentList) p.commentList = [];

      const isTreehole = p.type === 'treehole';
      p.commentList.push({
        id: `c_${Date.now()}`,
        author: isTreehole ? '匿名' : currentUser,
        avatar: isTreehole ? 'user-secret' : currentUserAvatar,
        content,
        time: new Date().toLocaleString('zh-CN')
      });

      saveData('communityPosts', posts);
      post = p;
      input.value = '';
      renderPost();

      // 滚动到评论底部
      const lastComment = document.querySelector('.comment-item:last-child');
      if (lastComment) {
        setTimeout(() => lastComment.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);
      }

      showToast('评论成功');
    }

    function deletePost() {
      let posts = loadData('communityPosts') || [];
      posts = posts.filter(p => p.id !== postId);
      saveData('communityPosts', posts);
      showToast('删除成功');
      navigateTo('community.html');
    }

    // 回车发送评论
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('comment-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          submitComment();
        }
      });

      renderPost();
    });
  </script>
</body>
</html>
