<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宝宝成长记 - AI分析</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .time-range-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    
    .time-range-btn {
      flex: 1;
      padding: 8px 12px;
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 20px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
    }
    
    .time-range-btn.active {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-color: transparent;
      color: white;
      font-weight: 500;
    }
    
    .dimension-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      overflow-x: auto;
      padding-bottom: 5px;
    }
    
    .dimension-tabs::-webkit-scrollbar {
      display: none;
    }
    
    .dimension-tab {
      padding: 10px 18px;
      background: var(--card-bg);
      border-radius: 25px;
      font-size: 14px;
      color: var(--text-secondary);
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .dimension-tab.active {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
    }
    
    .chart-wrapper {
      position: relative;
      height: 220px;
      margin-top: 15px;
    }
    
    .chart-svg {
      width: 100%;
      height: 100%;
    }
    
    .chart-y-axis {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 20px;
      width: 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 5px 0;
    }
    
    .chart-y-label {
      font-size: 10px;
      color: var(--text-light);
      text-align: right;
      padding-right: 5px;
    }
    
    .chart-x-axis {
      position: absolute;
      left: 40px;
      right: 10px;
      bottom: 0;
      height: 20px;
    }
    
    .chart-x-label {
      font-size: 10px;
      color: var(--text-light);
      transform: translateX(-50%);
    }
    
    .chart-grid {
      position: absolute;
      left: 40px;
      right: 10px;
      top: 5px;
      bottom: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
    }
    
    .chart-grid-line {
      height: 1px;
      background: var(--border);
      opacity: 0.5;
    }
    
    .chart-line-container {
      position: absolute;
      left: 40px;
      right: 10px;
      top: 5px;
      bottom: 20px;
    }
    
    .chart-bars-container {
      position: absolute;
      left: 40px;
      right: 10px;
      top: 5px;
      bottom: 20px;
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      padding: 0 2%;
    }
    
    .chart-bar {
      width: 18px;
      border-radius: 6px 6px 0 0;
      position: relative;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    
    .chart-bar:active,
    .chart-bar:hover {
      opacity: 0.8;
      transform: scaleY(1.02);
      transform-origin: bottom;
    }
    
    .chart-bar-value {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      color: var(--text-secondary);
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    
    .chart-bar:active .chart-bar-value,
    .chart-bar:hover .chart-bar-value {
      opacity: 1;
    }
    
    .chart-tooltip {
      position: absolute;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      pointer-events: none;
      transform: translate(-50%, -120%);
      z-index: 10;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    
    .chart-dot {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: white;
      border: 2px solid;
      cursor: pointer;
      transform: translate(-50%, -50%);
      transition: all 0.2s ease;
    }
    
    .chart-dot:hover {
      transform: translate(-50%, -50%) scale(1.3);
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 15px;
    }
    
    .stat-item {
      background: var(--bg);
      border-radius: 12px;
      padding: 12px 8px;
      text-align: center;
    }
    
    .stat-item-value {
      font-size: 18px;
      font-weight: bold;
      color: var(--primary-dark);
    }
    
    .stat-item-label {
      font-size: 11px;
      color: var(--text-light);
      margin-top: 4px;
    }
    
    .analysis-section {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }
    
    .analysis-section-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .analysis-section-title::before {
      content: '';
      width: 4px;
      height: 16px;
      background: linear-gradient(180deg, var(--primary), var(--secondary));
      border-radius: 2px;
    }
    
    .warning-banner {
      background: linear-gradient(135deg, rgba(255, 107, 107, 0.1), rgba(255, 165, 0, 0.1));
      border: 1px solid rgba(255, 107, 107, 0.3);
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 20px;
    }
    
    .warning-banner-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      color: var(--danger);
      margin-bottom: 8px;
      font-size: 14px;
    }
    
    .warning-banner-content {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
    }
    
    .insight-cards-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .insight-card {
      background: var(--card-bg);
      border-radius: 15px;
      padding: 15px;
      box-shadow: var(--shadow);
      border-left: 4px solid var(--primary);
      transition: all 0.3s ease;
    }
    
    .insight-card:hover {
      transform: translateX(3px);
    }
    
    .insight-card.warning {
      border-left-color: var(--danger);
      background: linear-gradient(135deg, rgba(255, 107, 107, 0.05), var(--card-bg));
    }
    
    .insight-card.info {
      border-left-color: var(--secondary);
      background: linear-gradient(135deg, rgba(173, 216, 230, 0.05), var(--card-bg));
    }
    
    .insight-card.success {
      border-left-color: var(--success);
      background: linear-gradient(135deg, rgba(144, 238, 144, 0.05), var(--card-bg));
    }
    
    .insight-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    
    .insight-card-icon {
      font-size: 18px;
    }
    
    .insight-card-title {
      font-size: 14px;
      font-weight: bold;
    }
    
    .insight-card-content {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
    }
    
    .insight-card-detail {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
      font-size: 12px;
      color: var(--text-light);
    }
    
    .who-reference {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 11px;
    }
    
    .who-reference span {
      color: var(--text-light);
    }
    
    .who-reference .value {
      color: var(--text-secondary);
      font-weight: 500;
    }
    
    .progress-bar {
      width: 100%;
      height: 6px;
      background: var(--bg);
      border-radius: 3px;
      margin-top: 8px;
      overflow: hidden;
    }
    
    .progress-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.5s ease;
    }
    
    .sleep-stats-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    
    .sleep-stat {
      text-align: center;
      flex: 1;
    }
    
    .sleep-stat-icon {
      font-size: 24px;
      margin-bottom: 5px;
    }
    
    .sleep-stat-value {
      font-size: 16px;
      font-weight: bold;
      color: var(--primary-dark);
    }
    
    .sleep-stat-label {
      font-size: 11px;
      color: var(--text-light);
    }
    
    .feed-stats-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    
    .feed-stat {
      text-align: center;
      flex: 1;
    }
    
    .feed-stat-icon {
      font-size: 24px;
      margin-bottom: 5px;
    }
    
    .feed-stat-value {
      font-size: 16px;
      font-weight: bold;
      color: var(--accent);
    }
    
    .feed-stat-label {
      font-size: 11px;
      color: var(--text-light);
    }
    
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    
    .section-more {
      font-size: 12px;
      color: var(--primary-dark);
      cursor: pointer;
    }
    
    .line-chart-path {
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    
    .line-chart-area {
      opacity: 0.2;
    }
    
    .chart-legend {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 10px;
    }
    
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    
    .legend-color {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }
  </style>
</head>

        }
      }
    };
    
    const dimensionConfig = {
      weight: {
        label: '体重',
        unit: 'kg',
        color: '#FFB6C1',
        bgColor: 'rgba(255, 182, 193, 0.3)',
        chartType: 'line'
      },
      height: {
        label: '身高',
        unit: 'cm',
        color: '#ADD8E6',
        bgColor: 'rgba(173, 216, 230, 0.3)',
        chartType: 'line'
      },
      head: {
        label: '头围',
        unit: 'cm',
        color: '#DDA0DD',
        bgColor: 'rgba(221, 160, 221, 0.3)',
        chartType: 'line'
      },
      feed: {
        label: '奶量',
        unit: 'ml',
        color: '#FFA500',
        bgColor: 'rgba(255, 165, 0, 0.7)',
        chartType: 'bar'
      },
      sleep: {
        label: '睡眠',
        unit: '分钟',
        color: '#9370DB',
        bgColor: 'rgba(147, 112, 219, 0.7)',
        chartType: 'bar'
      }
    };
    
    function getTrendData(dimension, days) {
      const aiAnalysis = loadData('aiAnalysis');
      const growthRecords = loadData('growthRecords') || [];
      const baby = loadData('baby');
      
      if (!aiAnalysis) return [];
      
      let data = [];
      const today = new Date();
      
      switch(dimension) {
        case 'weight':
          if (growthRecords.length > 0) {
            const sorted = [...growthRecords].sort((a, b) => new Date(a.date) - new Date(b.date));
            data = sorted.map(r => ({ date: r.date.slice(5), value: r.weight }));
          } else {
            data = aiAnalysis.weightTrend.map(d => ({ date: d.date.slice(5), value: d.value }));
          }
          break;
        case 'height':
          if (growthRecords.length > 0) {
            const sorted = [...growthRecords].sort((a, b) => new Date(a.date) - new Date(b.date));
            data = sorted.map(r => ({ date: r.date.slice(5), value: r.height }));
          } else {
            data = aiAnalysis.heightTrend.map(d => ({ date: d.date.slice(5), value: d.value }));
          }
          break;
        case 'head':
          if (growthRecords.length > 0) {
            const sorted = [...growthRecords].sort((a, b) => new Date(a.date) - new Date(b.date));
            data = sorted.map(r => ({ date: r.date.slice(5), value: r.headCircumference }));
          } else {
            data = aiAnalysis.weightTrend.map((d, i) => ({ 
              date: d.date.slice(5), 
              value: 41 + i * 1 
            }));
          }
          break;
        case 'feed':
          data = aiAnalysis.feedTrend.map(d => ({ date: d.date.slice(5), value: d.value }));
          break;
        case 'sleep':
          data = aiAnalysis.sleepTrend.map(d => ({ date: d.date.slice(5), value: d.value }));
          break;
      }
      
      if (data.length > days) {
        data = data.slice(-days);
      }
      
      return data;
    }
    
    function renderLineChart(containerId, data, config) {
      const container = document.getElementById(containerId);
      if (!container || data.length === 0) return;
      
      const yAxisId = containerId.replace('line-container', 'y-axis');
      const xAxisId = containerId.replace('line-container', 'x-axis');
      const gridId = containerId.replace('line-container', 'grid');
      
      const values = data.map(d => d.value);
      const minVal = Math.min(...values);
      const maxVal = Math.max(...values);
      const range = maxVal - minVal || 1;
      const padding = range * 0.15;
      const yMin = minVal - padding;
      const yMax = maxVal + padding;
      
      const yAxis = document.getElementById(yAxisId);
      if (yAxis) {
        yAxis.innerHTML = '';
        for (let i = 4; i >= 0; i--) {
          const val = yMin + (yMax - yMin) * (i / 4);
          const label = document.createElement('div');
          label.className = 'chart-y-label';
          label.textContent = config.unit === '分钟' 
            ? Math.round(val / 60) + 'h' 
            : val.toFixed(config.unit === 'kg' ? 1 : 0);
          yAxis.appendChild(label);
        }
      }
      
      const grid = document.getElementById(gridId);
      if (grid) {
        grid.innerHTML = '';
        for (let i = 0; i <= 4; i++) {
          const line = document.createElement('div');
          line.className = 'chart-grid-line';
          grid.appendChild(line);
        }
      }
      
      const xAxis = document.getElementById(xAxisId);
      if (xAxis) {
        xAxis.innerHTML = '';
        const step = Math.max(1, Math.floor(data.length / 5));
        data.forEach((d, i) => {
          if (i % step === 0 || i === data.length - 1) {
            const label = document.createElement('div');
            label.className = 'chart-x-label';
            label.style.position = 'absolute';
            label.style.left = (i / (data.length - 1)) * 100 + '%';
            label.textContent = d.date;
            xAxis.appendChild(label);
          }
        });
      }
      
      container.innerHTML = '';
      
      const rect = container.getBoundingClientRect();
      const width = rect.width || 300;
      const height = rect.height || 180;
      
      const points = data.map((d, i) => {
        const x = (i / (data.length - 1)) * 100;
        const y = 100 - ((d.value - yMin) / (yMax - yMin)) * 100;
        return { x, y, value: d.value, date: d.date };
      });
      
      let pathD = '';
      let areaD = '';
      
      points.forEach((p, i) => {
        if (i === 0) {
          pathD = `M ${p.x}% ${p.y}%`;
          areaD = `M ${p.x}% 100% L ${p.x}% ${p.y}%`;
        } else {
          const prev = points[i - 1];
          const cpx1 = prev.x + (p.x - prev.x) / 3;
          const cpx2 = p.x - (p.x - prev.x) / 3;
          pathD += ` C ${cpx1}% ${prev.y}%, ${cpx2}% ${p.y}%, ${p.x}% ${p.y}%`;
          areaD += ` C ${cpx1}% ${prev.y}%, ${cpx2}% ${p.y}%, ${p.x}% ${p.y}%`;
        }
      });
      areaD += ' L 100% 100% Z';
      
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('class', 'chart-svg');
      svg.setAttribute('viewBox', '0 0 100 100');
      svg.setAttribute('preserveAspectRatio', 'none');
      svg.style.position = 'absolute';
      svg.style.inset = '0';
      
      const area = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      area.setAttribute('d', areaD);
      area.setAttribute('fill', config.color);
      area.setAttribute('class', 'line-chart-area');
      
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', pathD);
      path.setAttribute('stroke', config.color);
      path.setAttribute('class', 'line-chart-path');
      
      svg.appendChild(area);
      svg.appendChild(path);
      container.appendChild(svg);
      
      const tooltip = document.getElementById('chart-tooltip');
      
      points.forEach((p, i) => {
        const dot = document.createElement('div');
        dot.className = 'chart-dot';
        dot.style.left = p.x + '%';
        dot.style.top = p.y + '%';
        dot.style.borderColor = config.color;
        dot.style.backgroundColor = 'white';
        dot.style.width = '12px';
        dot.style.height = '12px';
        dot.style.zIndex = '5';
        
        const showTip = () => {
          if (tooltip) {
            tooltip.style.opacity = '1';
            tooltip.textContent = `${p.date}: ${p.value}${config.unit}`;
            const rect = container.getBoundingClientRect();
            const dotRect = dot.getBoundingClientRect();
            tooltip.style.left = (dotRect.left - rect.left + dotRect.width / 2) + 'px';
            tooltip.style.top = (dotRect.top - rect.top) + 'px';
          }
        };
        
        const hideTip = () => {
          if (tooltip) {
            tooltip.style.opacity = '0';
          }
        };
        
        dot.addEventListener('mouseenter', showTip);
        dot.addEventListener('mouseleave', hideTip);
        dot.addEventListener('touchstart', (e) => {
          e.preventDefault();
          document.querySelectorAll('.chart-tooltip').forEach(t => t.style.opacity = '0');
          showTip();
        });
        
        container.appendChild(dot);
      });
    }

    function updateMainStats(data, config) {
      const statsGrid = document.getElementById('main-stats-grid');
      if (!statsGrid || data.length === 0) return;
      
      const values = data.map(d => d.value);
      const avg = values.reduce((a, b) => a + b, 0) / values.length;
      const latest = values[values.length - 1];
      const first = values[0];
      const change = latest - first;
      const changePercent = first !== 0 ? ((change / first) * 100).toFixed(1) : 0;
      const maxVal = Math.max(...values);
      const minVal = Math.min(...values);
      
      let displayAvg, displayLatest, displayChange;
      
      if (config.unit === '分钟') {
        displayAvg = Math.round(avg / 60) + 'h';
        displayLatest = Math.round(latest / 60) + 'h';
        displayChange = (change >= 0 ? '+' : '') + Math.round(change / 60) + 'h';
      } else if (config.unit === 'kg') {
        displayAvg = avg.toFixed(1) + 'kg';
        displayLatest = latest.toFixed(1) + 'kg';
        displayChange = (change >= 0 ? '+' : '') + change.toFixed(1) + 'kg';
      } else {
        displayAvg = Math.round(avg) + config.unit;
        displayLatest = Math.round(latest) + config.unit;
        displayChange = (change >= 0 ? '+' : '') + Math.round(change) + config.unit;
      }
      
      statsGrid.innerHTML = `
        <div class="stat-item">
          <div class="stat-item-value">${displayLatest}</div>
          <div class="stat-item-label">最新值</div>
        </div>
        <div class="stat-item">
          <div class="stat-item-value">${displayAvg}</div>
          <div class="stat-item-label">平均值</div>
        </div>
        <div class="stat-item">
          <div class="stat-item-value" style="color: ${change >= 0 ? '#228B22' : '#FF6B6B'};">${displayChange}</div>
          <div class="stat-item-label">变化趋势</div>
        </div>
      `;
    }

    function generateInsights(aiAnalysis, baby) {
      const insights = [];
      const weight = aiAnalysis.weightTrend;
      const height = aiAnalysis.heightTrend;
      const sleep = aiAnalysis.sleepTrend;
      const feed = aiAnalysis.feedTrend;
      
      const weightGain = weight[weight.length - 1].value - weight[0].value;
      const heightGain = height[height.length - 1].value - height[0].value;
      const avgSleep = sleep.reduce((a, b) => a + b.value, 0) / sleep.length;
      const avgFeed = feed.reduce((a, b) => a + b.value, 0) / feed.length;
      
      const gender = baby?.gender || 'girl';
      const ageMonths = 12;
      const whoKey = ageMonths >= 12 ? '12m' : ageMonths >= 9 ? '9m' : '6m';
      const whoWeight = whoStandards[gender].weight[whoKey];
      const whoHeight = whoStandards[gender].height[whoKey];
      
      const currentWeight = weight[weight.length - 1].value;
      const currentHeight = height[height.length - 1].value;
      
      const weightStatus = currentWeight < whoWeight.lower ? '偏低' : currentWeight > whoWeight.upper ? '偏高' : '正常';
      const heightStatus = currentHeight < whoHeight.lower ? '偏矮' : currentHeight > whoHeight.upper ? '偏高' : '正常';
      
      if (weightStatus === '正常' && heightStatus === '正常') {
        insights.push({
          type: 'success',
          title: '生长发育良好',
          content: `宝宝的体重和身高增长曲线符合WHO标准，处于同龄宝宝的正常范围内。`,
          detail: `体重: ${currentWeight}kg (WHO标准: ${whoWeight.lower}-${whoWeight.upper}kg)`
        });
      } else if (weightStatus !== '正常') {
        insights.push({
          type: 'warning',
          title: `体重${weightStatus}`,
          content: `宝宝体重略${weightStatus === '偏低' ? '低于' : '高于'}WHO标准范围，建议${weightStatus === '偏低' ? '增加营养摄入，注意喂养频次' : '适当控制奶量，增加活动量'}。`,
          detail: `当前体重: ${currentWeight}kg (标准范围: ${whoWeight.lower}-${whoWeight.upper}kg)`
        });
      }
      
      if (avgSleep / 60 < 10) {
        insights.push({
          type: 'warning',
          title: '睡眠时长不足',
          content: '近期日均睡眠时长略低于推荐值，建议建立更规律的作息习惯，增加白天活动量。',
          detail: `当前日均: ${Math.round(avgSleep / 60)}小时 (推荐: 11-14小时)`
        });
      } else {
        insights.push({
          type: 'normal',
          title: '睡眠质量良好',
          content: '宝宝睡眠时长充足，作息规律。继续保持良好的睡眠习惯。',
          detail: `日均睡眠: ${Math.round(avgSleep / 60)}小时`
        });
      }
      
      insights.push({
        type: 'info',
        title: '奶量稳定增长',
        content: `近期奶量稳定在${Math.round(avgFeed)}ml左右，整体趋势良好。${ageMonths >= 6 ? '建议逐渐增加辅食种类，保证营养均衡。' : '继续按需喂养即可。'}`,
        detail: `日均奶量: ${Math.round(avgFeed)}ml`
      });
      
      insights.push({
        type: 'info',
        title: '本月发育里程碑',
        content: '宝宝正处于快速发育期，本月可能会出现新的技能突破，如独站、叫爸妈等。多陪伴宝宝互动玩耍。',
        detail: '建议: 每天保证1-2小时户外活动时间'
      });
      
      return insights;
    }

      const aiAnalysis = loadData('aiAnalysis');
      const container = document.getElementById('insights-list');
      const moreBtn = document.querySelector('.section-more');
      
      if (!container || !aiAnalysis) return;
      
      const baby = loadData('baby');
      const insights = generateInsights(aiAnalysis, baby);
      
      if (showAllInsightsFlag) {
        container.innerHTML = insights.map(insight => `
          <div class="insight-card ${insight.type}">
            <div class="insight-card-header">
              <span class="insight-card-icon">${getInsightIcon(insight.type)}</span>
              <span class="insight-card-title">${insight.title}</span>
            </div>
            <div class="insight-card-content">${insight.content}</div>
            ${insight.detail ? `<div class="insight-card-detail">${insight.detail}</div>` : ''}
          </div>
        `).join('');
        if (moreBtn) moreBtn.textContent = '收起';
      } else {
        container.innerHTML = insights.slice(0, 4).map(insight => `
          <div class="insight-card ${insight.type}">
            <div class="insight-card-header">
              <span class="insight-card-icon">${getInsightIcon(insight.type)}</span>
              <span class="insight-card-title">${insight.title}</span>
            </div>
            <div class="insight-card-content">${insight.content}</div>
            ${insight.detail ? `<div class="insight-card-detail">${insight.detail}</div>` : ''}
          </div>
        `).join('');
        if (moreBtn) moreBtn.textContent = '查看更多';
      }
    }
    
    function toggleMoreMenu() {
      const menu = document.getElementById('more-menu');
      if (menu) {
        menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
      }
    }
    
    function updateBabyInfo() {
      const baby = loadData('baby');
      const nameEl = document.getElementById('page-baby-name');
      if (baby && nameEl) {
        nameEl.textContent = baby.name + ' · AI分析';
      }
    }
    
    function renderAll() {
      renderMainChart();
      renderFeedAnalysis();
      renderSleepAnalysis();
      loadInsights();
      renderWHOComparison();
      renderWarningBanner();
    }
    
    document.addEventListener('DOMContentLoaded', () => {
      updateBabyInfo();
      initNavItems();
      
      setTimeout(() => {
        renderAll();
      }, 100);
      
      window.addEventListener('resize', () => {
        renderMainChart();
      });
    });
    
    document.getElementById('more-menu')?.addEventListener('click', (e) => {
      if (e.target.id === 'more-menu') {
        toggleMoreMenu();
      }
    });
  </script>
</body>
</html>
