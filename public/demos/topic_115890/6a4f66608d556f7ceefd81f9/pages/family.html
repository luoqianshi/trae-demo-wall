<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宝宝成长记 - 家庭组</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .family-member {
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }
    .family-member:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(255, 107, 157, 0.2);
    }
    .member-more {
      font-size: 20px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 5px;
    }
    .member-delete-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--danger-50);
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      flex-shrink: 0;
    }
    .member-delete-btn:hover {
      background: var(--danger);
      color: white;
      transform: scale(1.1);
    }
    .add-member-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px;
      background: var(--primary-50);
      border: 2px dashed var(--primary);
      border-radius: var(--radius-md);
      color: var(--primary-dark);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 12px;
      font-family: inherit;
    }
    .add-member-btn:hover {
      background: var(--primary-100);
    }
    .avatar-selector {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      margin-top: 10px;
    }
    .avatar-option {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 2px solid transparent;
    }
    .avatar-option:hover {
      transform: scale(1.1);
    }
    .avatar-option.selected {
      border-color: var(--primary);
      background: var(--primary-50);
    }
    .action-menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 15px;
    }
    .action-menu-item:hover {
      background: var(--bg);
    }
    .action-menu-item.danger {
      color: var(--danger);
    }
    .action-menu-item-icon {
      font-size: 20px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .action-menu-item.danger .action-menu-item-icon {
      background: var(--danger-50);
    }
    .confirm-text {
      text-align: center;
      color: var(--text-secondary);
      margin-bottom: 20px;
      font-size: 14px;
    }
    .confirm-name {
      font-weight: bold;
      color: var(--text-primary);
    }
    .btn-group {
      display: flex;
      gap: 12px;
    }
    .btn-cancel {
      flex: 1;
      padding: 12px;
      background: var(--bg);
      border: none;
      border-radius: var(--radius);
      color: var(--text-secondary);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
    }
    .btn-cancel:hover {
      background: var(--border);
    }
    .btn-danger {
      flex: 1;
      padding: 12px;
      background: var(--danger);
      border: none;
      border-radius: var(--radius);
      color: white;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
    }
    .btn-danger:hover {
      opacity: 0.9;
    }
    .invite-share-section {
      text-align: center;
      padding: 20px 0;
    }
    .invite-qr {
      width: 150px;
      height: 150px;
      background: var(--bg);
      border-radius: var(--radius-lg);
      margin: 0 auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
    }
    .invite-code {
      font-size: 20px;
      font-weight: bold;
      color: var(--primary-dark);
      letter-spacing: 3px;
      margin-bottom: 5px;
    }
    .invite-code-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }
    .share-methods {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-top: 20px;
    }
    .share-method {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .share-method:hover {
      transform: translateY(-3px);
    }
    .share-method-icon {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    .share-method-label {
      font-size: 12px;
      color: var(--text-secondary);
    }
    .role-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 10px;
      font-size: 11px;
      background: var(--primary-50);
      color: var(--primary-dark);
    }
    .switch-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid var(--border-light);
    }
    .switch-wrapper:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>
  <div class="page-container">
    <header>
      <div class="header-top">
        <button class="action-btn" onclick="navigateTo('../index.html')"><i class="fa-solid fa-arrow-left"></i></button>
        <div>
          <div class="baby-name">幸福小家</div>
          <div class="baby-age" id="member-count">3位成员 · 实时同步</div>
        </div>
        <button class="action-btn" onclick="openInviteModal()"><i class="fa-solid fa-plus"></i></button>
      </div>
    </header>
    
    <main>
      <div class="section-title"><i class="fa-solid fa-people-roof"></i> 家庭成员</div>
      <div id="family-members"></div>
      <div class="add-member-btn" onclick="openAddMemberModal()">
        <span><i class="fa-solid fa-plus"></i></span>
        <span>添加成员</span>
      </div>
      
      <div class="section-title"><i class="fa-solid fa-scroll"></i> 活动日志</div>
      <div id="family-timeline"></div>
      
      <div class="section-title"><i class="fa-solid fa-gear"></i> 家庭设置</div>
      <div class="form-card">
        <div class="switch-wrapper">
          <span>数据同步</span>
          <div class="switch-btn active" onclick="toggleSwitch(this)"></div>
        </div>
        <div class="switch-wrapper">
          <span>共享提醒</span>
          <div class="switch-btn active" onclick="toggleSwitch(this)"></div>
        </div>
        <div class="switch-wrapper">
          <span>共享照片</span>
          <div class="switch-btn" onclick="toggleSwitch(this)"></div>
        </div>
      </div>
    </main>
    
    <nav class="nav-bar">
      <div class="nav-item" data-page="../index.html">
        <div class="nav-item-icon"><i class="fa-solid fa-house"></i></div>
        <div class="nav-item-label">首页</div>
      </div>
      <div class="nav-item" data-page="record.html">
        <div class="nav-item-icon"><i class="fa-solid fa-pen-to-square"></i></div>
        <div class="nav-item-label">记录</div>
      </div>
      <div class="nav-item" data-page="community.html">
        <div class="nav-item-icon"><i class="fa-solid fa-comments"></i></div>
        <div class="nav-item-label">社区</div>
      </div>
      <div class="nav-item" data-page="mom.html">
        <div class="nav-item-icon"><i class="fa-solid fa-user"></i></div>
        <div class="nav-item-label">我的</div>
      </div>
    </nav>
  </div>
  
  <div class="modal-overlay" id="invite-modal" style="display: none;">
    <div class="modal-content">
      <button class="close-btn" onclick="closeInviteModal()"><i class="fa-solid fa-xmark"></i></button>
      <div class="modal-title"><i class="fa-solid fa-people-roof"></i> 邀请家人</div>
      <div class="invite-share-section">
        <div class="invite-qr"><i class="fa-solid fa-mobile-screen"></i></div>
        <div class="invite-code">FAMILY001</div>
        <div class="invite-code-label">家庭邀请码</div>
        <div style="display: flex; gap: 10px;">
          <button class="form-btn" style="flex: 1;" onclick="copyInviteCode()"><i class="fa-solid fa-copy"></i> 复制邀请码</button>
          <button class="form-btn" style="flex: 1;" onclick="copyInviteLink()"><i class="fa-solid fa-link"></i> 复制链接</button>
        </div>
      </div>
      <div class="share-methods">
        <div class="share-method" onclick="shareVia('wechat')">
          <div class="share-method-icon" style="background: #07C160;"><i class="fa-solid fa-comment"></i></div>
          <span class="share-method-label">微信</span>
        </div>
        <div class="share-method" onclick="shareVia('qq')">
          <div class="share-method-icon" style="background: #12B7F5;"><i class="fa-solid fa-comment"></i></div>
          <span class="share-method-label">QQ</span>
        </div>
        <div class="share-method" onclick="shareVia('weibo')">
          <div class="share-method-icon" style="background: #E6162D;"><i class="fa-solid fa-bullhorn"></i></div>
          <span class="share-method-label">微博</span>
        </div>
        <div class="share-method" onclick="shareVia('sms')">
          <div class="share-method-icon" style="background: #FFA500;"><i class="fa-solid fa-envelope"></i></div>
          <span class="share-method-label">短信</span>
        </div>
      </div>
    </div>
  </div>
  
  <div class="modal-overlay" id="add-member-modal" style="display: none;">
    <div class="modal-content">
      <button class="close-btn" onclick="closeAddMemberModal()"><i class="fa-solid fa-xmark"></i></button>
      <div class="modal-title"><i class="fa-solid fa-user"></i> 添加成员</div>
      <div class="form-group">
        <label class="form-label">成员名字</label>
        <input type="text" class="form-input" id="new-member-name" placeholder="请输入名字">
      </div>
      <div class="form-group">
        <label class="form-label">选择角色</label>
        <select class="form-select" id="new-member-role-type">
          <option value="爸爸">爸爸</option>
          <option value="妈妈">妈妈</option>
          <option value="奶奶">奶奶</option>
          <option value="爷爷">爷爷</option>
          <option value="姥姥">姥姥</option>
          <option value="姥爷">姥爷</option>
          <option value="外婆">外婆</option>
          <option value="外公">外公</option>
          <option value="姑姑">姑姑</option>
          <option value="叔叔">叔叔</option>
          <option value="阿姨">阿姨</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">选择头像</label>
        <div class="avatar-selector" id="avatar-selector">
          <div class="avatar-option selected" data-avatar="fa-person" onclick="selectAvatar(this)"><i class="fa-solid fa-person"></i></div>
          <div class="avatar-option" data-avatar="fa-person" onclick="selectAvatar(this)"><i class="fa-solid fa-person"></i></div>
          <div class="avatar-option" data-avatar="fa-person" onclick="selectAvatar(this)"><i class="fa-solid fa-person"></i></div>
          <div class="avatar-option" data-avatar="fa-person" onclick="selectAvatar(this)"><i class="fa-solid fa-person"></i></div>
          <div class="avatar-option" data-avatar="fa-person" onclick="selectAvatar(this)"><i class="fa-solid fa-person"></i></div>
          <div class="avatar-option" data-avatar="fa-person" onclick="selectAvatar(this)"><i class="fa-solid fa-person"></i></div>
          <div class="avatar-option" data-avatar="fa-person" onclick="selectAvatar(this)"><i class="fa-solid fa-person"></i></div>
          <div class="avatar-option" data-avatar="fa-person" onclick="selectAvatar(this)"><i class="fa-solid fa-person"></i></div>
          <div class="avatar-option" data-avatar="fa-person" onclick="selectAvatar(this)"><i class="fa-solid fa-person"></i></div>
          <div class="avatar-option" data-avatar="fa-child" onclick="selectAvatar(this)"><i class="fa-solid fa-child"></i></div>
          <div class="avatar-option" data-avatar="fa-child" onclick="selectAvatar(this)"><i class="fa-solid fa-child"></i></div>
          <div class="avatar-option" data-avatar="fa-cat" onclick="selectAvatar(this)"><i class="fa-solid fa-cat"></i></div>
        </div>
      </div>
      <button class="form-btn" onclick="addMember()"><i class="fa-solid fa-check"></i> 确认添加</button>
    </div>
  </div>
  
  <div class="modal-overlay" id="member-action-modal" style="display: none;">
    <div class="modal-content">
      <button class="close-btn" onclick="closeMemberActionModal()"><i class="fa-solid fa-xmark"></i></button>
      <div class="modal-title" id="action-member-name">成员操作</div>
      <div style="margin-top: 10px;">
        <div class="action-menu-item" onclick="toggleAdminRole()">
          <div class="action-menu-item-icon"><i class="fa-solid fa-crown"></i></div>
          <span id="toggle-admin-text">设为管理员</span>
        </div>
        <div class="action-menu-item" onclick="editMemberRole()">
          <div class="action-menu-item-icon"><i class="fa-solid fa-pen"></i></div>
          <span>修改角色</span>
        </div>
        <div class="action-menu-item danger" onclick="showDeleteConfirm()">
          <div class="action-menu-item-icon"><i class="fa-solid fa-trash-can"></i></div>
          <span>删除成员</span>
        </div>
      </div>
    </div>
  </div>
  
  <div class="modal-overlay" id="delete-confirm-modal" style="display: none;">
    <div class="modal-content">
      <button class="close-btn" onclick="closeDeleteConfirmModal()"><i class="fa-solid fa-xmark"></i></button>
      <div class="modal-title"><i class="fa-solid fa-triangle-exclamation"></i> 确认删除</div>
      <div class="confirm-text">
        确定要删除成员 <span class="confirm-name" id="delete-member-name"></span> 吗？<br>
        删除后该成员将无法访问家庭数据。
      </div>
      <div class="btn-group">
        <button class="btn-cancel" onclick="closeDeleteConfirmModal()">取消</button>
        <button class="btn-danger" onclick="confirmDeleteMember()">确认删除</button>
      </div>
    </div>
  </div>
  
  <div class="modal-overlay" id="edit-role-modal" style="display: none;">
    <div class="modal-content">
      <button class="close-btn" onclick="closeEditRoleModal()"><i class="fa-solid fa-xmark"></i></button>
      <div class="modal-title"><i class="fa-solid fa-pen"></i> 修改角色</div>
      <div class="form-group">
        <label class="form-label">选择角色</label>
        <select class="form-select" id="edit-role-select">
          <option value="爸爸">爸爸</option>
          <option value="妈妈">妈妈</option>
          <option value="奶奶">奶奶</option>
          <option value="爷爷">爷爷</option>
          <option value="姥姥">姥姥</option>
          <option value="姥爷">姥爷</option>
          <option value="外婆">外婆</option>
          <option value="外公">外公</option>
          <option value="姑姑">姑姑</option>
          <option value="叔叔">叔叔</option>
          <option value="阿姨">阿姨</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <button class="form-btn" onclick="confirmEditRole()"><i class="fa-solid fa-check"></i> 确认修改</button>
    </div>
  </div>
  
  <script src="../data/mock.js"></script>
  <script src="../script.js"></script>
  
  <script>
    let currentMemberId = null;
    let selectedAvatar = 'fa-person';
    
    function toggleSwitch(el) {
      el.classList.toggle('active');
      showToast(el.classList.contains('active') ? '已开启' : '已关闭');
    }
    
    function openInviteModal() {
      document.getElementById('invite-modal').style.display = 'flex';
    }
    
    function closeInviteModal() {
      document.getElementById('invite-modal').style.display = 'none';
    }
    
    function copyInviteCode() {
      const dummy = document.createElement('input');
      document.body.appendChild(dummy);
      dummy.value = 'FAMILY001';
      dummy.select();
      document.execCommand('copy');
      document.body.removeChild(dummy);
      showToast('邀请码已复制');
    }
    
    function copyInviteLink() {
      const dummy = document.createElement('input');
      document.body.appendChild(dummy);
      dummy.value = 'https://babyrecord.com/invite/family_001';
      dummy.select();
      document.execCommand('copy');
      document.body.removeChild(dummy);
      showToast('邀请链接已复制');
    }
    
    function shareVia(platform) {
      const names = {
        wechat: '微信',
        qq: 'QQ',
        weibo: '微博',
        sms: '短信'
      };
      showToast(`正在分享到${names[platform]}...`);
      setTimeout(() => {
        showToast('分享成功');
      }, 1000);
    }
    
    function openAddMemberModal() {
      document.getElementById('new-member-name').value = '';
      document.getElementById('new-member-role-type').value = '爸爸';
      selectedAvatar = 'fa-person';
      document.querySelectorAll('.avatar-option').forEach(el => {
        el.classList.remove('selected');
        if (el.dataset.avatar === 'fa-person') el.classList.add('selected');
      });
      document.getElementById('add-member-modal').style.display = 'flex';
    }
    
    function closeAddMemberModal() {
      document.getElementById('add-member-modal').style.display = 'none';
    }
    
    function selectAvatar(el) {
      document.querySelectorAll('.avatar-option').forEach(e => e.classList.remove('selected'));
      el.classList.add('selected');
      selectedAvatar = el.dataset.avatar;
    }
    
    function addMember() {
      const name = document.getElementById('new-member-name').value.trim();
      const roleType = document.getElementById('new-member-role-type').value;
      
      if (!name) {
        showToast('请输入成员名字');
        return;
      }
      
      const family = loadData('family') || { members: [], activityLog: [] };
      
      const newMember = {
        id: `user_${Date.now()}`,
        name: name,
        role: 'member',
        avatar: selectedAvatar,
        roleType: roleType
      };
      
      family.members.push(newMember);
      
      family.activityLog.unshift({
        user: '系统',
        action: `添加了成员 ${name}(${roleType})`,
        time: new Date().toLocaleString('zh-CN')
      });
      
      saveData('family', family);
      closeAddMemberModal();
      showToast(`已添加成员 ${name}`);
      loadFamilyMembers();
      loadFamilyActivity();
      updateMemberCount();
    }
    
    function openMemberAction(memberId) {
      const family = loadData('family');
      const member = family.members.find(m => m.id === memberId);
      
      if (!member) return;
      
      currentMemberId = memberId;
      document.getElementById('action-member-name').textContent = member.name;
      
      const toggleText = document.getElementById('toggle-admin-text');
      if (member.role === 'admin') {
        toggleText.textContent = '取消管理员';
      } else {
        toggleText.textContent = '设为管理员';
      }
      
      document.getElementById('member-action-modal').style.display = 'flex';
    }
    
    function closeMemberActionModal() {
      document.getElementById('member-action-modal').style.display = 'none';
      currentMemberId = null;
    }
    
    function toggleAdminRole() {
      if (!currentMemberId) return;
      
      const family = loadData('family');
      const member = family.members.find(m => m.id === currentMemberId);
      
      if (!member) return;
      
      if (member.role === 'admin') {
        const adminCount = family.members.filter(m => m.role === 'admin').length;
        if (adminCount <= 1) {
          showToast('至少需要保留一位管理员');
          return;
        }
        member.role = 'member';
        showToast(`已取消 ${member.name} 的管理员身份`);
      } else {
        member.role = 'admin';
        showToast(`已将 ${member.name} 设为管理员`);
      }
      
      family.activityLog.unshift({
        user: '系统',
        action: `${member.role === 'admin' ? '设置' : '取消'} ${member.name} 为管理员`,
        time: new Date().toLocaleString('zh-CN')
      });
      
      saveData('family', family);
      closeMemberActionModal();
      loadFamilyMembers();
      loadFamilyActivity();
    }
    
    function editMemberRole() {
      if (!currentMemberId) return;
      
      const family = loadData('family');
      const member = family.members.find(m => m.id === currentMemberId);
      
      if (!member) return;
      
      document.getElementById('edit-role-select').value = member.roleType || '其他';
      closeMemberActionModal();
      document.getElementById('edit-role-modal').style.display = 'flex';
    }
    
    function closeEditRoleModal() {
      document.getElementById('edit-role-modal').style.display = 'none';
    }
    
    function confirmEditRole() {
      if (!currentMemberId) return;
      
      const newRoleType = document.getElementById('edit-role-select').value;
      const family = loadData('family');
      const member = family.members.find(m => m.id === currentMemberId);
      
      if (!member) return;
      
      const oldRoleType = member.roleType || '成员';
      member.roleType = newRoleType;
      
      family.activityLog.unshift({
        user: '系统',
        action: `将 ${member.name} 的角色从 ${oldRoleType} 修改为 ${newRoleType}`,
        time: new Date().toLocaleString('zh-CN')
      });
      
      saveData('family', family);
      closeEditRoleModal();
      showToast('角色已修改');
      loadFamilyMembers();
      loadFamilyActivity();
    }
    
    function showDeleteConfirm() {
      if (!currentMemberId) return;
      
      const family = loadData('family');
      const member = family.members.find(m => m.id === currentMemberId);
      
      if (!member) return;
      
      if (member.role === 'admin') {
        const adminCount = family.members.filter(m => m.role === 'admin').length;
        if (adminCount <= 1) {
          showToast('不能删除最后一位管理员');
          return;
        }
      }
      
      document.getElementById('delete-member-name').textContent = member.name;
      closeMemberActionModal();
      document.getElementById('delete-confirm-modal').style.display = 'flex';
    }
    
    function closeDeleteConfirmModal() {
      document.getElementById('delete-confirm-modal').style.display = 'none';
      currentMemberId = null;
    }
    
    function confirmDeleteMember() {
      if (!currentMemberId) return;
      
      const family = loadData('family');
      const memberIndex = family.members.findIndex(m => m.id === currentMemberId);
      
      if (memberIndex === -1) return;
      
      const memberName = family.members[memberIndex].name;
      family.members.splice(memberIndex, 1);
      
      family.activityLog.unshift({
        user: '系统',
        action: `删除了成员 ${memberName}`,
        time: new Date().toLocaleString('zh-CN')
      });
      
      saveData('family', family);
      closeDeleteConfirmModal();
      showToast(`已删除成员 ${memberName}`);
      loadFamilyMembers();
      loadFamilyActivity();
      updateMemberCount();
    }
    
    function updateMemberCount() {
      const family = loadData('family');
      const countEl = document.getElementById('member-count');
      if (countEl && family) {
        countEl.textContent = `${family.members.length}位成员 · 实时同步`;
      }
    }
    
    function getMemberAvatarClass(avatar) {
      if (!avatar) return 'fa-person';
      if (avatar.startsWith('fa-')) return avatar;
      return 'fa-person';
    }

    function loadFamilyMembers() {
      const family = loadData('family');
      const container = document.getElementById('family-members');
      if (container && family) {
        container.innerHTML = family.members.map(member => `
          <div class="family-member" onclick="openMemberAction('${member.id}')">
            <div class="member-avatar"><i class="fa-solid ${getMemberAvatarClass(member.avatar)}"></i></div>
            <div class="member-info">
              <div class="member-name">${member.name}</div>
              <div class="member-role ${member.role === 'admin' ? 'admin' : ''}">
                ${member.role === 'admin' ? '管理员' : (member.roleType || '成员')}
              </div>
            </div>
            <button class="member-delete-btn" onclick="event.stopPropagation(); directDeleteMember('${member.id}')" title="删除成员"><i class="fa-solid fa-trash-can"></i></button>
          </div>
        `).join('');
      }
    }

    function directDeleteMember(memberId) {
      currentMemberId = memberId;
      const family = loadData('family');
      if (!family) return;
      const member = family.members.find(m => m.id === memberId);
      if (!member) return;

      if (member.role === 'admin') {
        const adminCount = family.members.filter(m => m.role === 'admin').length;
        if (adminCount <= 1) {
          showToast('不能删除最后一位管理员');
          return;
        }
      }

      document.getElementById('delete-member-name').textContent = member.name;
      document.getElementById('delete-confirm-modal').style.display = 'flex';
    }
    
    function loadFamilyActivity() {
      const family = loadData('family');
      const container = document.getElementById('family-timeline');
      if (container && family && family.activityLog) {
        const sortedLog = [...family.activityLog].sort((a, b) => {
          return new Date(b.time) - new Date(a.time);
        });
        
        container.innerHTML = `
          <div class="timeline">
            ${sortedLog.map(log => `
              <div class="timeline-item">
                <div class="activity-action">${log.user} ${log.action}</div>
                <div class="activity-time">${log.time}</div>
              </div>
            `).join('')}
          </div>
        `;
      }
    }
    
    document.querySelectorAll('.modal-overlay').forEach(overlay => {
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) {
          overlay.style.display = 'none';
        }
      });
    });
    
    document.addEventListener('DOMContentLoaded', () => {
      loadFamilyMembers();
      loadFamilyActivity();
      updateMemberCount();
      initNavItems();
    });
  </script>
</body>
</html>
