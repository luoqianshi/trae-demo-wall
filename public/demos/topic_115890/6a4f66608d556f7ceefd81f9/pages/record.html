<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宝宝成长记 - 记录中心</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ===== TIMER DISPLAY ===== */
    .timer-card {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: var(--radius-lg);
      padding: 30px;
      text-align: center;
      color: white;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }
    .timer-card::before {
      content: '';
      position: absolute;
      top: -40%;
      right: -20%;
      width: 160px;
      height: 160px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
    }
    .timer-label {
      font-size: 14px;
      opacity: 0.85;
      margin-bottom: 8px;
      font-weight: 300;
    }
    .timer-display {
      font-size: 52px;
      font-weight: 700;
      letter-spacing: 3px;
      font-variant-numeric: tabular-nums;
      margin-bottom: 20px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.15);
    }
    .timer-sub {
      font-size: 13px;
      opacity: 0.7;
      margin-bottom: 20px;
    }
    .timer-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .timer-btn {
      padding: 12px 32px;
      border-radius: var(--radius-full);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: var(--transition);
      font-family: inherit;
    }
    .timer-btn-stop {
      background: rgba(255,255,255,0.25);
      color: white;
      border: 2px solid rgba(255,255,255,0.4);
    }
    .timer-btn-stop:hover {
      background: rgba(255,255,255,0.35);
    }
    .timer-btn-save {
      background: white;
      color: var(--primary);
    }
    .timer-btn-save:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    /* ===== TIMER MINI ===== */
    .timer-mini {
      display: none;
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      padding: 10px 20px;
      border-radius: var(--radius-full);
      font-size: 14px;
      font-weight: 600;
      z-index: 90;
      box-shadow: var(--shadow-lg);
      cursor: pointer;
      align-items: center;
      gap: 10px;
      animation: fadeIn 0.3s ease;
      white-space: nowrap;
    }
    .timer-mini .timer-mini-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: white;
      animation: blink 1s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ===== SLEEP TRACKER ===== */
    .sleep-tracker {
      background: linear-gradient(135deg, #8B5CF6, #6D28D9);
      border-radius: var(--radius-lg);
      padding: 30px;
      text-align: center;
      color: white;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }
    .sleep-tracker::before {
      content: '';
      position: absolute;
      bottom: -30%;
      left: -15%;
      width: 140px;
      height: 140px;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
    }

    /* ===== FEED OPTIONS ===== */
    .feed-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .feed-option-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 24px 16px;
      background: var(--card-bg);
      border-radius: var(--radius-md);
      border: 2px solid var(--border);
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
    }
    .feed-option-btn:hover {
      border-color: var(--primary);
      background: var(--primary-50);
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }
    .feed-option-btn:active {
      transform: translateY(0);
    }
    .feed-option-icon {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: white;
    }
    .feed-option-icon.breast { background: linear-gradient(135deg, #FF6B9D, #FF8DB5); }
    .feed-option-icon.bottle { background: linear-gradient(135deg, #3B82F6, #60A5FA); }
    .feed-option-label {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .feed-option-desc {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* ===== EXCRETION SELECTOR ===== */
    .excretion-selector {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 16px;
      border: 1px solid var(--border-light);
    }
    .selector-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .selector-btn {
      padding: 10px 16px;
      border-radius: var(--radius);
      background: var(--bg);
      border: 2px solid transparent;
      cursor: pointer;
      transition: var(--transition);
      font-size: 13px;
      color: var(--text-secondary);
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .selector-btn:hover {
      background: var(--primary-50);
    }
    .selector-btn.selected {
      border-color: var(--primary);
      background: var(--primary-50);
      color: var(--primary-dark);
      font-weight: 500;
    }
    .color-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
      border: 1px solid rgba(0,0,0,0.1);
    }

    /* ===== QUICK ADD BUTTON ===== */
    .quick-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 24px;
      border-radius: var(--radius);
      background: var(--card-bg);
      border: 2px dashed var(--border);
      cursor: pointer;
      transition: var(--transition);
      font-size: 14px;
      color: var(--text-secondary);
      font-family: inherit;
      width: 100%;
      margin-bottom: 16px;
    }
    .quick-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-50);
    }

    /* ===== RECORD BADGE ===== */
    .record-type-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 500;
    }
    .badge-breast { background: rgba(255,107,157,0.1); color: var(--primary); }
    .badge-bottle { background: rgba(59,130,246,0.1); color: var(--info); }
    .badge-poop { background: rgba(245,158,11,0.1); color: var(--accent); }
    .badge-urine { background: rgba(59,130,246,0.1); color: var(--info); }
    .badge-sleep { background: rgba(139,92,246,0.1); color: var(--secondary); }
    .badge-growth { background: rgba(16,185,129,0.1); color: var(--success); }
    .badge-temp { background: rgba(239,68,68,0.1); color: var(--danger); }
    .badge-med { background: rgba(16,185,129,0.1); color: var(--success); }
    .badge-milestone { background: rgba(245,158,11,0.1); color: var(--accent); }

    /* ===== SLEEP QUALITY ===== */
    .quality-btn {
      padding: 12px 20px;
      border-radius: var(--radius);
      background: var(--bg);
      border: 2px solid transparent;
      cursor: pointer;
      transition: var(--transition);
      font-size: 14px;
      font-family: inherit;
      flex: 1;
      text-align: center;
      color: var(--text-secondary);
    }
    .quality-btn:hover {
      background: var(--primary-50);
    }
    .quality-btn.selected {
      border-color: var(--primary);
      background: var(--primary-50);
      color: var(--primary-dark);
      font-weight: 600;
    }

    /* ===== MILESTONE GRID ===== */
    .milestone-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .milestone-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      background: var(--bg);
      border-radius: var(--radius);
      border: 2px solid transparent;
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
    }
    .milestone-btn:hover {
      border-color: var(--primary);
      background: var(--primary-50);
    }
    .milestone-btn:active {
      transform: scale(0.98);
    }
    .milestone-btn i {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      font-size: 14px;
      flex-shrink: 0;
    }
    .milestone-btn span {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
    }

    /* ===== DONE ANIMATION ===== */
    .record-done {
      animation: recordDone 0.4s ease;
    }
    @keyframes recordDone {
      0% { transform: scale(1); }
      30% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    /* ===== TEMP WARNING ===== */
    .temp-display {
      font-size: 48px;
      font-weight: 700;
      text-align: center;
      margin: 16px 0;
      font-variant-numeric: tabular-nums;
    }
    .temp-normal { color: var(--success); }
    .temp-low-fever { color: var(--accent); }
    .temp-fever { color: var(--danger); }
    .temp-high-fever { color: var(--danger); animation: blink 0.6s ease-in-out infinite; }
    .temp-status {
      text-align: center;
      padding: 12px;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 16px;
    }
    .temp-status.normal { background: var(--success-50); color: var(--success); }
    .temp-status.low-fever { background: var(--warning-50); color: var(--warning); }
    .temp-status.fever { background: var(--danger-50); color: var(--danger); }
    .temp-status.high-fever { background: var(--danger-50); color: var(--danger); }
  </style>
</head>
<body>
  <div class="page-container">
    <header>
      <div class="header-top">
        <button class="action-btn" onclick="navigateTo('../index.html')"><i class="fa-solid fa-arrow-left"></i></button>
        <div>
          <div class="baby-name">记录中心</div>
          <div class="baby-age">随时记录宝宝成长</div>
        </div>
        <div class="action-btn" onclick="toggleMoreMenu()"><i class="fa-solid fa-ellipsis-vertical"></i></div>
      </div>
    </header>
    
    <main>
      <div class="tab-bar">
        <div class="tab-item active" onclick="switchTab('feed', this)"><i class="fa-solid fa-bottle-water"></i> 喂奶</div>
        <div class="tab-item" onclick="switchTab('excretion', this)"><i class="fa-solid fa-poop"></i> 排泄</div>
        <div class="tab-item" onclick="switchTab('sleep', this)"><i class="fa-solid fa-bed"></i> 睡眠</div>
        <div class="tab-item" onclick="switchTab('growth', this)"><i class="fa-solid fa-ruler-vertical"></i> 生长</div>
        <div class="tab-item" onclick="switchTab('temp', this)"><i class="fa-solid fa-temperature-half"></i> 体温</div>
        <div class="tab-item" onclick="switchTab('medication', this)"><i class="fa-solid fa-pills"></i> 用药</div>
        <div class="tab-item" onclick="switchTab('milestone', this)"><i class="fa-solid fa-trophy"></i> 里程碑</div>
      </div>
      
      <!-- ===== 喂奶 ===== -->
      <div id="feed-tab" class="tab-content">
        <!-- 正在计时中 -->
        <div id="feeding-timer" style="display: none;">
          <div class="timer-card">
            <div class="timer-label" id="feeding-timer-label">亲喂 · 左侧</div>
            <div class="timer-display" id="feeding-timer-display">00:00</div>
            <div class="timer-sub" id="feeding-timer-start">开始于 --:--</div>
            <div class="timer-actions">
              <button class="timer-btn timer-btn-stop" onclick="pauseFeedingTimer()"><i class="fa-solid fa-pause"></i> 暂停</button>
              <button class="timer-btn timer-btn-save" onclick="stopAndSaveFeeding()"><i class="fa-solid fa-check"></i> 结束喂奶</button>
            </div>
          </div>
        </div>
        
        <!-- 开始喂奶选择 -->
        <div id="feeding-start">
          <div class="feed-options">
            <button class="feed-option-btn" onclick="startFeedingTimer('breast', 'left')">
              <div class="feed-option-icon breast"><i class="fa-solid fa-bottle-water"></i></div>
              <div class="feed-option-label">亲喂左侧</div>
              <div class="feed-option-desc">点击开始计时</div>
            </button>
            <button class="feed-option-btn" onclick="startFeedingTimer('breast', 'right')">
              <div class="feed-option-icon breast"><i class="fa-solid fa-bottle-water"></i></div>
              <div class="feed-option-label">亲喂右侧</div>
              <div class="feed-option-desc">点击开始计时</div>
            </button>
            <button class="feed-option-btn" onclick="showBottleFeedForm()">
              <div class="feed-option-icon bottle"><i class="fa-solid fa-glass-water"></i></div>
              <div class="feed-option-label">瓶喂</div>
              <div class="feed-option-desc">输入奶量记录</div>
            </button>
          </div>
          
          <!-- 瓶喂表单（隐藏） -->
          <div id="bottle-feed-form" style="display: none;">
            <div class="form-card">
              <div class="form-group">
                <label class="form-label">奶量 (ml)</label>
                <div style="display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap;">
                  <button class="tab-item" onclick="setBottleAmount(30)" style="padding: 8px 14px;">30ml</button>
                  <button class="tab-item" onclick="setBottleAmount(60)" style="padding: 8px 14px;">60ml</button>
                  <button class="tab-item" onclick="setBottleAmount(90)" style="padding: 8px 14px;">90ml</button>
                  <button class="tab-item" onclick="setBottleAmount(120)" style="padding: 8px 14px;">120ml</button>
                  <button class="tab-item" onclick="setBottleAmount(150)" style="padding: 8px 14px;">150ml</button>
                  <button class="tab-item" onclick="setBottleAmount(180)" style="padding: 8px 14px;">180ml</button>
                  <button class="tab-item" onclick="setBottleAmount(210)" style="padding: 8px 14px;">210ml</button>
                </div>
                <input type="number" class="form-input" id="bottle-amount" placeholder="或输入自定义奶量">
              </div>
              <div style="display: flex; gap: 10px;">
                <button class="form-btn" style="flex: 1; background: #f0f0f0; color: #333;" onclick="hideBottleFeedForm()">取消</button>
                <button class="form-btn" style="flex: 1;" onclick="saveBottleFeed()"><i class="fa-solid fa-check"></i> 确认记录</button>
              </div>
            </div>
          </div>
        </div>
        
        <div class="section-title"><i class="fa-solid fa-clock-rotate-left" style="font-size:14px;"></i> 喂奶记录</div>
        <div id="feed-records"></div>
      </div>
      
      <!-- ===== 排泄 ===== -->
      <div id="excretion-tab" class="tab-content" style="display: none;">
        <button class="quick-btn" onclick="quickAddUrine()">
          <i class="fa-solid fa-droplet" style="color: var(--info);"></i> 快速记录小便
        </button>
        
        <div class="excretion-selector">
          <div class="form-group" style="margin-bottom: 14px;">
            <label class="form-label"><i class="fa-solid fa-palette"></i> 大便颜色</label>
            <div class="selector-row" id="poop-color-row">
              <button class="selector-btn" onclick="selectPoopColor(this, '黄色')"><span class="color-dot" style="background:#FFD700;"></span> 黄色</button>
              <button class="selector-btn" onclick="selectPoopColor(this, '金黄色')"><span class="color-dot" style="background:#DAA520;"></span> 金黄</button>
              <button class="selector-btn" onclick="selectPoopColor(this, '黄绿色')"><span class="color-dot" style="background:#9ACD32;"></span> 黄绿</button>
              <button class="selector-btn" onclick="selectPoopColor(this, '绿色')"><span class="color-dot" style="background:#22C55E;"></span> 绿色</button>
              <button class="selector-btn" onclick="selectPoopColor(this, '灰白色')"><span class="color-dot" style="background:#E5E5E5;border:1px solid #ccc;"></span> 灰白</button>
              <button class="selector-btn" onclick="selectPoopColor(this, '黑色')"><span class="color-dot" style="background:#1a1a1a;"></span> 黑色</button>
              <button class="selector-btn" onclick="selectPoopColor(this, '红色')"><span class="color-dot" style="background:#EF4444;"></span> 红色</button>
            </div>
          </div>
          <div class="form-group" style="margin-bottom: 14px;">
            <label class="form-label"><i class="fa-solid fa-shapes"></i> 大便性状</label>
            <div class="selector-row" id="poop-consistency-row">
              <button class="selector-btn" onclick="selectPoopConsistency(this, '水样')"><i class="fa-solid fa-droplet"></i> 水样</button>
              <button class="selector-btn" onclick="selectPoopConsistency(this, '稀便')"><i class="fa-solid fa-droplet"></i> 稀便</button>
              <button class="selector-btn" onclick="selectPoopConsistency(this, '软便')"><i class="fa-solid fa-cloud"></i> 软便</button>
              <button class="selector-btn" onclick="selectPoopConsistency(this, '糊状')"><i class="fa-solid fa-cloud"></i> 糊状</button>
              <button class="selector-btn" onclick="selectPoopConsistency(this, '条状')"><i class="fa-solid fa-grip-lines"></i> 条状</button>
              <button class="selector-btn" onclick="selectPoopConsistency(this, '干硬')"><i class="fa-solid fa-gem"></i> 干硬</button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">备注（选填）</label>
            <input type="text" class="form-input" id="poop-note" placeholder="如：奶瓣多、有黏液等">
          </div>
          <button class="form-btn" onclick="savePoopRecord()"><i class="fa-solid fa-check"></i> 保存大便记录</button>
        </div>
        
        <div class="section-title"><i class="fa-solid fa-clock-rotate-left" style="font-size:14px;"></i> 排泄记录</div>
        <div id="excretion-records"></div>
      </div>
      
      <!-- ===== 睡眠 ===== -->
      <div id="sleep-tab" class="tab-content" style="display: none;">
        <!-- 正在计时中 -->
        <div id="sleeping-timer" style="display: none;">
          <div class="sleep-tracker">
            <div class="timer-label">宝宝正在睡觉中...</div>
            <div class="timer-display" id="sleep-timer-display">00:00</div>
            <div class="timer-sub" id="sleep-timer-start">入睡于 --:--</div>
            <div class="timer-actions">
              <button class="timer-btn timer-btn-save" onclick="wakeUpAndSaveSleep()"><i class="fa-solid fa-sun"></i> 宝宝醒了，结束记录</button>
            </div>
          </div>
        </div>
        
        <!-- 开始睡眠 -->
        <div id="sleeping-start">
          <div class="form-card">
            <div style="text-align: center; margin-bottom: 20px;">
              <i class="fa-solid fa-moon" style="font-size: 32px; color: var(--secondary); margin-bottom: 12px; display: block;"></i>
              <div style="font-size: 15px; color: var(--text-secondary);">点击下方按钮，开始记录宝宝睡眠</div>
            </div>
            <button class="form-btn" onclick="startSleepTimer()" style="background: linear-gradient(135deg, #8B5CF6, #6D28D9); box-shadow: 0 10px 30px -5px rgba(139,92,246,0.3);">
              <i class="fa-solid fa-moon"></i> 开始哄睡 · 记录入睡时间
            </button>
          </div>
          
          <div style="text-align: center; color: var(--text-muted); font-size: 13px; margin: 16px 0;">或者手动添加一条睡眠记录</div>
          
          <div class="form-card">
            <div class="form-group">
              <label class="form-label">睡眠质量</label>
              <div style="display: flex; gap: 10px;">
                <button class="quality-btn" onclick="selectSleepQuality(this, 'good')"><i class="fa-solid fa-face-smile"></i> 好</button>
                <button class="quality-btn" onclick="selectSleepQuality(this, 'normal')"><i class="fa-solid fa-face-meh"></i> 一般</button>
                <button class="quality-btn" onclick="selectSleepQuality(this, 'poor')"><i class="fa-solid fa-face-frown"></i> 差</button>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">睡眠时长</label>
              <div style="display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap;">
                <button class="tab-item" onclick="setSleepDuration(30)" style="padding: 8px 14px;">30分钟</button>
                <button class="tab-item" onclick="setSleepDuration(60)" style="padding: 8px 14px;">1小时</button>
                <button class="tab-item" onclick="setSleepDuration(90)" style="padding: 8px 14px;">1.5小时</button>
                <button class="tab-item" onclick="setSleepDuration(120)" style="padding: 8px 14px;">2小时</button>
                <button class="tab-item" onclick="setSleepDuration(180)" style="padding: 8px 14px;">3小时</button>
              </div>
              <input type="number" class="form-input" id="sleep-duration" placeholder="或输入自定义时长（分钟）">
            </div>
            <button class="form-btn" onclick="saveManualSleep()" style="background: linear-gradient(135deg, #8B5CF6, #6D28D9);">
              <i class="fa-solid fa-check"></i> 保存睡眠记录
            </button>
          </div>
        </div>
        
        <div class="section-title"><i class="fa-solid fa-clock-rotate-left" style="font-size:14px;"></i> 睡眠记录</div>
        <div id="sleep-records"></div>
      </div>
      
      <!-- ===== 生长 ===== -->
      <div id="growth-tab" class="tab-content" style="display: none;">
        <div class="form-card">
          <div class="form-group">

  <script>
    // ===== GLOBAL STATE =====
    let feedingTimerInterval = null;
    let feedingStartTime = null;
    let feedingPaused = false;
    let feedingPausedElapsed = 0;
    let feedingType = 'breast';
    let feedingSide = 'left';
    
    let sleepTimerInterval = null;
    let sleepStartTime = null;
    
    let selectedPoopColor = null;
    let selectedPoopConsistency = null;
    let selectedSleepQuality = null;
    let pendingDelete = null;

    // ===== TAB SWITCHING =====
    function switchTab(tabName, tabEl) {
      document.querySelectorAll('.tab-bar .tab-item').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
      if (tabEl) {
        tabEl.classList.add('active');
        tabEl.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }
      document.getElementById(tabName + '-tab').style.display = 'block';
      
      const loadMap = {
        feed: loadFeedRecords, excretion: loadExcretionRecords,
        sleep: loadSleepRecords, growth: loadGrowthRecords,
        temp: loadTempRecords, medication: loadMedicationRecords,
        milestone: loadMilestoneRecords
      };
      if (loadMap[tabName]) loadMap[tabName]();
      
      const timerMini = document.getElementById('timer-mini');
      if (timerMini) {
        timerMini.style.display = (feedingTimerInterval && tabName !== 'feed') ? 'flex' : 'none';
      }
    }

    // ===== FEEDING TIMER =====
    function startFeedingTimer(type, side) {
      feedingType = type;
      feedingSide = side;
      feedingStartTime = Date.now();
      feedingPaused = false;
      feedingPausedElapsed = 0;
      
      document.getElementById('feeding-start').style.display = 'none';
      document.getElementById('feeding-timer').style.display = 'block';
      
      const sideText = side === 'left' ? '左侧' : '右侧';
      document.getElementById('feeding-timer-label').textContent = `亲喂 · ${sideText}`;
      document.getElementById('feeding-timer-start').textContent = '开始于 ' + new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
      document.getElementById('feeding-timer-display').textContent = '00:00';
      
      feedingTimerInterval = setInterval(updateFeedingTimer, 1000);
    }

    function updateFeedingTimer() {
      if (!feedingStartTime || feedingPaused) return;
      const elapsed = Date.now() - feedingStartTime - feedingPausedElapsed;
      const mins = Math.floor(elapsed / 60000);
      const secs = Math.floor((elapsed % 60000) / 1000);
      const display = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
      document.getElementById('feeding-timer-display').textContent = display;
      
      // 更新迷你计时器
      const mini = document.getElementById('timer-mini');
      if (mini && mini.style.display === 'flex') {
        document.getElementById('timer-mini-text').textContent = `正在喂奶 ${display}`;
      }
    }

    function pauseFeedingTimer() {
      if (feedingPaused) {
        // Resume
        feedingPaused = false;
        feedingStartTime = Date.now() - feedingPausedElapsed;
        feedingTimerInterval = setInterval(updateFeedingTimer, 1000);
        document.querySelector('.timer-btn-stop').innerHTML = '<i class="fa-solid fa-pause"></i> 暂停';
      } else {
        // Pause
        feedingPaused = true;
        feedingPausedElapsed = Date.now() - feedingStartTime;
        clearInterval(feedingTimerInterval);
        feedingTimerInterval = null;
        document.querySelector('.timer-btn-stop').innerHTML = '<i class="fa-solid fa-play"></i> 继续';
      }
    }

    function stopAndSaveFeeding() {
      clearInterval(feedingTimerInterval);
      feedingTimerInterval = null;
      
      const elapsed = feedingPaused 
        ? feedingPausedElapsed 
        : (Date.now() - feedingStartTime);
      const duration = Math.max(1, Math.round(elapsed / 60000));
      
      // Save record
      const records = loadData('feedRecords') || [];
      records.unshift({
        id: `feed_${Date.now()}`,
        type: 'breast',
        side: feedingSide,
        duration: duration,
        amount: null,
        time: new Date().toLocaleString('zh-CN'),
        user: '妈妈'
      });
      saveData('feedRecords', records);
      updateActivityLog('妈妈', `亲喂${feedingSide === 'left' ? '左侧' : '右侧'} ${duration}分钟`);
      
      // Reset UI
      document.getElementById('feeding-timer').style.display = 'none';
      document.getElementById('feeding-start').style.display = 'block';
      document.getElementById('timer-mini').style.display = 'none';
      
      showToast(`已记录亲喂${feedingSide === 'left' ? '左侧' : '右侧'} ${duration}分钟`);
      loadFeedRecords();
      
      feedingStartTime = null;
      feedingPaused = false;
      feedingPausedElapsed = 0;
    }

    // ===== BOTTLE FEED =====
    function showBottleFeedForm() {
      document.getElementById('bottle-feed-form').style.display = 'block';
    }
    function hideBottleFeedForm() {
      document.getElementById('bottle-feed-form').style.display = 'none';
      document.getElementById('bottle-amount').value = '';
    }
    function setBottleAmount(amount) {
      document.getElementById('bottle-amount').value = amount;
    }
    function saveBottleFeed() {
      const amount = parseInt(document.getElementById('bottle-amount').value);
      if (!amount || amount <= 0) {
        showToast('请输入奶量');
        return;
      }
      
      const records = loadData('feedRecords') || [];
      records.unshift({
        id: `feed_${Date.now()}`,
        type: 'bottle',
        side: null,
        duration: null,
        amount: amount,
        time: new Date().toLocaleString('zh-CN'),
        user: '妈妈'
      });
      saveData('feedRecords', records);
      updateActivityLog('妈妈', `瓶喂 ${amount}ml`);
      hideBottleFeedForm();
      showToast(`已记录瓶喂 ${amount}ml`);
      loadFeedRecords();
    }

    // ===== POOP RECORD =====
    function selectPoopColor(btn, color) {
      document.querySelectorAll('#poop-color-row .selector-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedPoopColor = color;
    }
    function selectPoopConsistency(btn, consistency) {
      document.querySelectorAll('#poop-consistency-row .selector-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedPoopConsistency = consistency;
    }
    function savePoopRecord() {
      if (!selectedPoopColor) { showToast('请选择大便颜色'); return; }
      if (!selectedPoopConsistency) { showToast('请选择大便性状'); return; }
      
      const note = document.getElementById('poop-note').value.trim();
      const records = loadData('excretionRecords') || [];
      records.unshift({
        id: `ex_${Date.now()}`,
        type: 'poop',
        color: selectedPoopColor,
        consistency: selectedPoopConsistency,
        urineCount: 0,
        note: note,
        time: new Date().toLocaleString('zh-CN'),
        user: '妈妈'
      });
      saveData('excretionRecords', records);
      updateActivityLog('妈妈', `记录大便(${selectedPoopColor}·${selectedPoopConsistency})`);
      
      // Reset
      selectedPoopColor = null;
      selectedPoopConsistency = null;
      document.querySelectorAll('.selector-btn').forEach(b => b.classList.remove('selected'));
      document.getElementById('poop-note').value = '';
      
      showToast('已记录大便');
      loadExcretionRecords();
    }
    function quickAddUrine() {
      const records = loadData('excretionRecords') || [];
      records.unshift({
        id: `ex_${Date.now()}`,
        type: 'urine',
        color: null,
        consistency: null,
        urineCount: 1,
        time: new Date().toLocaleString('zh-CN'),
        user: '妈妈'
      });
      saveData('excretionRecords', records);
      updateActivityLog('妈妈', '记录小便');
      showToast('已记录小便');
      loadExcretionRecords();
    }

    // ===== SLEEP TIMER =====
    function startSleepTimer() {
      sleepStartTime = Date.now();
      document.getElementById('sleeping-start').style.display = 'none';
      document.getElementById('sleeping-timer').style.display = 'block';
      document.getElementById('sleep-timer-start').textContent = '入睡于 ' + new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
      document.getElementById('sleep-timer-display').textContent = '00:00';
      
      sleepTimerInterval = setInterval(updateSleepTimer, 1000);
    }
    function updateSleepTimer() {
      if (!sleepStartTime) return;
      const elapsed = Date.now() - sleepStartTime;
      const hrs = Math.floor(elapsed / 3600000);
      const mins = Math.floor((elapsed % 3600000) / 60000);
      const secs = Math.floor((elapsed % 60000) / 1000);
      let display;
      if (hrs > 0) {
        display = String(hrs).padStart(2, '0') + ':' + String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
      } else {
        display = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
      }
      document.getElementById('sleep-timer-display').textContent = display;
    }
    function wakeUpAndSaveSleep() {
      clearInterval(sleepTimerInterval);
      sleepTimerInterval = null;
      
      const elapsed = Date.now() - sleepStartTime;
      const duration = Math.max(1, Math.round(elapsed / 60000));
      
      const records = loadData('sleepRecords') || [];
      records.unshift({
        id: `sleep_${Date.now()}`,
        startTime: new Date(sleepStartTime).toLocaleString('zh-CN'),
        endTime: new Date().toLocaleString('zh-CN'),
        quality: 'good',
        duration: duration,
        user: '妈妈'
      });
      saveData('sleepRecords', records);
      updateActivityLog('妈妈', `睡眠 ${duration}分钟`);
      
      document.getElementById('sleeping-timer').style.display = 'none';
      document.getElementById('sleeping-start').style.display = 'block';
      sleepStartTime = null;
      
      showToast(`宝宝睡了 ${duration} 分钟`);
      loadSleepRecords();
    }
    function selectSleepQuality(btn, quality) {
      document.querySelectorAll('.quality-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedSleepQuality = quality;
    }
    function setSleepDuration(mins) {
      document.getElementById('sleep-duration').value = mins;
    }
    function saveManualSleep() {
      const duration = parseInt(document.getElementById('sleep-duration').value);
      if (!duration || duration <= 0) { showToast('请输入睡眠时长'); return; }
      const quality = selectedSleepQuality || 'good';
      
      const now = new Date();
      const start = new Date(now.getTime() - duration * 60000);
      const records = loadData('sleepRecords') || [];
      records.unshift({
        id: `sleep_${Date.now()}`,
        startTime: start.toLocaleString('zh-CN'),
        endTime: now.toLocaleString('zh-CN'),
        quality: quality,
        duration: duration,
        user: '妈妈'
      });
      saveData('sleepRecords', records);
      updateActivityLog('妈妈', `记录睡眠 ${duration}分钟`);
      
      document.getElementById('sleep-duration').value = '';
      selectedSleepQuality = null;
      document.querySelectorAll('.quality-btn').forEach(b => b.classList.remove('selected'));
      
      showToast(`已记录睡眠 ${duration} 分钟`);
      loadSleepRecords();
    }

    // ===== TEMP =====
    function updateTempPreview() {
      const val = parseFloat(document.getElementById('temp-value').value);
      const preview = document.getElementById('temp-preview');
      if (isNaN(val) || val < 35 || val > 42) {
        preview.style.display = 'none';
        return;
      }
      preview.style.display = 'block';
      const displayEl = document.getElementById('temp-display-value');
      const statusEl = document.getElementById('temp-status-text');
      displayEl.textContent = val.toFixed(1) + '°C';
      
      if (val < 37.3) {
        displayEl.className = 'temp-display temp-normal';
        statusEl.className = 'temp-status normal';
        statusEl.textContent = '体温正常';
      } else if (val < 38.0) {
        displayEl.className = 'temp-display temp-low-fever';
        statusEl.className = 'temp-status low-fever';
        statusEl.textContent = '低烧，请密切关注';
      } else if (val < 39.0) {
        displayEl.className = 'temp-display temp-fever';
        statusEl.className = 'temp-status fever';
        statusEl.textContent = '发烧，建议物理降温';
      } else {
        displayEl.className = 'temp-display temp-high-fever';
        statusEl.className = 'temp-status high-fever';
        statusEl.textContent = '高烧！请及时就医';
      }
    }
    function saveTempRecord() {
      const value = parseFloat(document.getElementById('temp-value').value);
      if (isNaN(value) || value < 35 || value > 42) {
        showToast('请输入有效体温（35-42°C）');
        return;
      }
      const records = loadData('temperatureRecords') || [];
      records.unshift({
        id: `temp_${Date.now()}`,
        value: value,
        time: new Date().toLocaleString('zh-CN')
      });
      saveData('temperatureRecords', records);
      
      document.getElementById('temp-value').value = '';
      document.getElementById('temp-preview').style.display = 'none';
      
      showToast('已记录体温');
      loadTempRecords();
    }

    // ===== GROWTH =====
    function saveGrowthRecord() {
      const height = parseFloat(document.getElementById('growth-height').value);
      const weight = parseFloat(document.getElementById('growth-weight').value);
      const head = parseFloat(document.getElementById('growth-head').value);
      
      if (!height && !weight && !head) {
        showToast('请至少填写一项数据');
        return;
      }
      
      const records = loadData('growthRecords') || [];
      records.unshift({
        id: `growth_${Date.now()}`,
        date: new Date().toISOString().split('T')[0],
        height: height || null,
        weight: weight || null,
        headCircumference: head || null
      });
      saveData('growthRecords', records);
      
      document.getElementById('growth-height').value = '';
      document.getElementById('growth-weight').value = '';
      document.getElementById('growth-head').value = '';
      
      showToast('已记录生长数据');
      loadGrowthRecords();
    }

    // ===== MEDICATION =====
    function saveMedicationRecord() {
      const name = document.getElementById('med-name').value.trim();
      const dose = document.getElementById('med-dose').value.trim();
      const note = document.getElementById('med-note').value.trim();
      
      if (!name) { showToast('请输入药品名称'); return; }
      if (!dose) { showToast('请输入剂量'); return; }
      
      const records = loadData('medicationRecords') || [];
      records.unshift({
        id: `med_${Date.now()}`,
        name, dose, note,
        time: new Date().toLocaleString('zh-CN')
      });
      saveData('medicationRecords', records);
      
      document.getElementById('med-name').value = '';
      document.getElementById('med-dose').value = '';
      document.getElementById('med-note').value = '';
      
      showToast('已记录用药');
      loadMedicationRecords();
    }

    // ===== MILESTONE =====
    function saveMilestone(name) {
      if (!name) return;
      const records = loadData('milestoneRecords') || [];
      records.unshift({
        id: `milestone_${Date.now()}`,
        name,
        date: new Date().toISOString().split('T')[0]
      });
      saveData('milestoneRecords', records);
      showToast(`恭喜！${name}达成！`);
      loadMilestoneRecords();
    }
    function saveCustomMilestone() {
      const name = document.getElementById('milestone-custom').value.trim();
      if (!name) { showToast('请输入里程碑名称'); return; }
      saveMilestone(name);
      document.getElementById('milestone-custom').value = '';
    }

    // ===== DELETE =====
    function showConfirmModal(recordId, storageKey, reloadFn) {
      pendingDelete = { recordId, storageKey, reloadFn };
      document.getElementById('confirm-modal').style.display = 'flex';
    }
    function hideConfirmModal() {
      pendingDelete = null;
      document.getElementById('confirm-modal').style.display = 'none';
    }
    function confirmDelete() {
      if (!pendingDelete) return;
      const { recordId, storageKey, reloadFn } = pendingDelete;
      const records = loadData(storageKey) || [];
      saveData(storageKey, records.filter(r => r.id !== recordId));
      hideConfirmModal();
      showToast('已删除记录');
      if (reloadFn) reloadFn();
    }

    // ===== RECORD LIST RENDERING =====
    function viewAllBtn(type) {
      return `<div style="text-align:center;margin-top:14px;">
        <button class="form-btn" style="display:inline-flex;gap:6px;align-items:center;background:var(--bg);color:var(--text-secondary);border:1.5px solid var(--border);font-size:13px;" onclick="navigateTo('all-records.html?type=${type}')">
          显示全部 <i class="fa-solid fa-angle-right"></i>
        </button>
      </div>`;
    }

    function loadFeedRecords() {
      const records = loadData('feedRecords') || [];
      const container = document.getElementById('feed-records');
      if (!container) return;
      if (records.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-muted);font-size:14px;"><i class="fa-regular fa-clock" style="font-size:28px;display:block;margin-bottom:10px;opacity:0.5;"></i>暂无喂奶记录</div>';
        return;
      }
      container.innerHTML = records.slice(0, 10).map(r => `
        <div class="record-card">
          <div class="record-header">
            <span class="record-type-badge ${r.type === 'breast' ? 'badge-breast' : 'badge-bottle'}">
              <i class="fa-solid ${r.type === 'breast' ? 'fa-bottle-water' : 'fa-glass-water'}"></i>
              ${r.type === 'breast' ? '亲喂' + (r.side === 'left' ? '左侧' : '右侧') : '瓶喂'}
            </span>
            <span style="display:flex;align-items:center;gap:10px;">
              <span class="record-time">${r.time}</span>
              <span style="cursor:pointer;color:var(--text-muted);font-size:14px;" onclick="showConfirmModal('${r.id}','feedRecords',loadFeedRecords)"><i class="fa-regular fa-trash-can"></i></span>
            </span>
          </div>
          <div class="record-detail">${r.type === 'breast' ? r.duration + ' 分钟' : r.amount + ' ml'}</div>
        </div>
      `).join('') + (records.length > 10 ? viewAllBtn('feed') : '');
    }

    function loadExcretionRecords() {
      const records = loadData('excretionRecords') || [];
      const container = document.getElementById('excretion-records');
      if (!container) return;
      if (records.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-muted);font-size:14px;"><i class="fa-regular fa-clock" style="font-size:28px;display:block;margin-bottom:10px;opacity:0.5;"></i>暂无排泄记录</div>';
        return;
      }
      container.innerHTML = records.slice(0, 10).map(r => `
        <div class="record-card">
          <div class="record-header">
            <span class="record-type-badge ${r.type === 'poop' ? 'badge-poop' : 'badge-urine'}">
              <i class="fa-solid ${r.type === 'poop' ? 'fa-poop' : 'fa-droplet'}"></i>
              ${r.type === 'poop' ? '大便' : '小便'}
            </span>
            <span style="display:flex;align-items:center;gap:10px;">
              <span class="record-time">${r.time}</span>
              <span style="cursor:pointer;color:var(--text-muted);font-size:14px;" onclick="showConfirmModal('${r.id}','excretionRecords',loadExcretionRecords)"><i class="fa-regular fa-trash-can"></i></span>
            </span>
          </div>
          <div class="record-detail">${r.type === 'poop' ? r.color + ' · ' + r.consistency + (r.note ? ' · ' + r.note : '') : '小便 x' + r.urineCount}</div>
        </div>
      `).join('') + (records.length > 10 ? viewAllBtn('excretion') : '');
    }

    function loadSleepRecords() {
      const records = loadData('sleepRecords') || [];
      const container = document.getElementById('sleep-records');
      if (!container) return;
      if (records.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-muted);font-size:14px;"><i class="fa-regular fa-clock" style="font-size:28px;display:block;margin-bottom:10px;opacity:0.5;"></i>暂无睡眠记录</div>';
        return;
      }
      const qualityMap = {good:'好', normal:'一般', poor:'差'};
      container.innerHTML = records.slice(0, 10).map(r => `
        <div class="record-card">
          <div class="record-header">
            <span class="record-type-badge badge-sleep"><i class="fa-solid fa-bed"></i> 睡眠</span>
            <span style="display:flex;align-items:center;gap:10px;">
              <span class="record-time">${r.startTime}</span>
              <span style="cursor:pointer;color:var(--text-muted);font-size:14px;" onclick="showConfirmModal('${r.id}','sleepRecords',loadSleepRecords)"><i class="fa-regular fa-trash-can"></i></span>
            </span>
          </div>
          <div class="record-detail">${r.duration ? r.duration + ' 分钟' : '进行中'} · 质量: ${qualityMap[r.quality] || r.quality}</div>
        </div>
      `).join('') + (records.length > 10 ? viewAllBtn('sleep') : '');
    }

    function loadGrowthRecords() {
      const records = loadData('growthRecords') || [];
      const container = document.getElementById('growth-records');
      if (!container) return;
      if (records.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-muted);font-size:14px;"><i class="fa-regular fa-clock" style="font-size:28px;display:block;margin-bottom:10px;opacity:0.5;"></i>暂无生长记录</div>';
        return;
      }
      container.innerHTML = records.slice(0, 10).map(r => `
        <div class="record-card">
          <div class="record-header">
            <span class="record-type-badge badge-growth"><i class="fa-solid fa-ruler-vertical"></i> 生长</span>
            <span style="display:flex;align-items:center;gap:10px;">
              <span class="record-time">${r.date}</span>
              <span style="cursor:pointer;color:var(--text-muted);font-size:14px;" onclick="showConfirmModal('${r.id}','growthRecords',loadGrowthRecords)"><i class="fa-regular fa-trash-can"></i></span>
            </span>
          </div>
          <div class="record-detail">${r.height ? '身高 '+r.height+'cm' : ''} ${r.weight ? '| 体重 '+r.weight+'kg' : ''} ${r.headCircumference ? '| 头围 '+r.headCircumference+'cm' : ''}</div>
        </div>
      `).join('') + (records.length > 10 ? viewAllBtn('growth') : '');
    }

    function loadTempRecords() {
      const records = loadData('temperatureRecords') || [];
      const container = document.getElementById('temp-records');
      if (!container) return;
      if (records.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-muted);font-size:14px;"><i class="fa-regular fa-clock" style="font-size:28px;display:block;margin-bottom:10px;opacity:0.5;"></i>暂无体温记录</div>';
        return;
      }
      container.innerHTML = records.slice(0, 10).map(r => {
        const isFever = r.value >= 37.3;
        return `
        <div class="record-card">
          <div class="record-header">
            <span class="record-type-badge ${isFever ? 'badge-temp' : 'badge-growth'}"><i class="fa-solid fa-temperature-half"></i> 体温</span>
            <span style="display:flex;align-items:center;gap:10px;">
              <span class="record-time">${r.time}</span>
              <span style="cursor:pointer;color:var(--text-muted);font-size:14px;" onclick="showConfirmModal('${r.id}','temperatureRecords',loadTempRecords)"><i class="fa-regular fa-trash-can"></i></span>
            </span>
          </div>
          <div class="record-detail" style="font-weight:600; ${isFever ? 'color:var(--danger)' : ''}">${r.value}°C</div>
        </div>
      `;}).join('') + (records.length > 10 ? viewAllBtn('temp') : '');
    }

    function loadMedicationRecords() {
      const records = loadData('medicationRecords') || [];
      const container = document.getElementById('medication-records');
      if (!container) return;
      if (records.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-muted);font-size:14px;"><i class="fa-regular fa-clock" style="font-size:28px;display:block;margin-bottom:10px;opacity:0.5;"></i>暂无用药记录</div>';
        return;
      }
      container.innerHTML = records.slice(0, 10).map(r => `
        <div class="record-card">
          <div class="record-header">
            <span class="record-type-badge badge-med"><i class="fa-solid fa-pills"></i> ${r.name}</span>
            <span style="display:flex;align-items:center;gap:10px;">
              <span class="record-time">${r.time}</span>
              <span style="cursor:pointer;color:var(--text-muted);font-size:14px;" onclick="showConfirmModal('${r.id}','medicationRecords',loadMedicationRecords)"><i class="fa-regular fa-trash-can"></i></span>
            </span>
          </div>
          <div class="record-detail">剂量: ${r.dose}${r.note ? ' | ' + r.note : ''}</div>
        </div>
      `).join('') + (records.length > 10 ? viewAllBtn('medication') : '');
    }

    function loadMilestoneRecords() {
      const records = loadData('milestoneRecords') || [];
      const container = document.getElementById('milestone-records');
      if (!container) return;
      if (records.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-muted);font-size:14px;"><i class="fa-regular fa-clock" style="font-size:28px;display:block;margin-bottom:10px;opacity:0.5;"></i>暂无里程碑记录</div>';
        return;
      }
      container.innerHTML = records.slice(0, 10).map(r => `
        <div class="record-card">
          <div class="record-header">
            <span class="record-type-badge badge-milestone"><i class="fa-solid fa-trophy"></i> ${r.name}</span>
            <span style="display:flex;align-items:center;gap:10px;">
              <span class="record-time">${r.date}</span>
              <span style="cursor:pointer;color:var(--text-muted);font-size:14px;" onclick="showConfirmModal('${r.id}','milestoneRecords',loadMilestoneRecords)"><i class="fa-regular fa-trash-can"></i></span>
            </span>
          </div>
        </div>
      `).join('') + (records.length > 10 ? viewAllBtn('milestone') : '');
    }

    // ===== SCROLL TO TIMER =====
    function scrollToActiveTimer() {
      switchTab('feed', document.querySelectorAll('.tab-bar .tab-item')[0]);
      document.getElementById('feeding-timer').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // ===== INIT =====
    function initTabFromHash() {
      const hash = window.location.hash.replace('#', '');
      if (hash && document.getElementById(hash + '-tab')) {
        const tabMap = {feed:0, excretion:1, sleep:2, growth:3, temp:4, medication:5, milestone:6};
        const tabs = document.querySelectorAll('.tab-bar .tab-item');
        if (tabMap[hash] !== undefined && tabs[tabMap[hash]]) {
          switchTab(hash, tabs[tabMap[hash]]);
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadFeedRecords();
      loadTempRecords();
      loadMedicationRecords();
      initTabFromHash();
    });
    window.addEventListener('hashchange', initTabFromHash);
  </script>
</body>
</html>
