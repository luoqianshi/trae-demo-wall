<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宝宝成长记 - 全部记录</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .search-bar {
      position: relative;
      margin-bottom: 14px;
    }
    .search-bar input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-full);
      font-size: 14px;
      background: var(--card-bg);
      color: var(--text-primary);
      font-family: inherit;
      outline: none;
      transition: var(--transition);
    }
    .search-bar input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(255,107,157,0.1);
    }
    .search-bar i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }
    .filter-section {
      margin-bottom: 10px;
    }
    .filter-pills {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: none;
    }
    .filter-pills::-webkit-scrollbar { display: none; }
    .filter-pill {
      flex-shrink: 0;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border: 1.5px solid var(--border);
      background: var(--card-bg);
      color: var(--text-secondary);
      transition: var(--transition);
      font-family: inherit;
    }
    .filter-pill:hover { border-color: var(--primary); }
    .filter-pill.active {
      background: linear-gradient(135deg, #FF6B9D, #FF8FB1);
      border-color: transparent;
      color: white;
      box-shadow: 0 3px 10px rgba(255,107,157,0.3);
    }
    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      font-size: 13px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-light);
      margin-bottom: 12px;
    }
    .stats-bar .count { font-weight: 600; color: var(--text-primary); }
    .record-type-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 500;
    }
    .badge-breast { background: rgba(255,107,157,0.1); color: var(--primary); }
    .badge-bottle { background: rgba(59,130,246,0.1); color: var(--info); }
    .badge-poop { background: rgba(245,158,11,0.1); color: var(--accent); }
    .badge-urine { background: rgba(59,130,246,0.1); color: var(--info); }
    .badge-sleep { background: rgba(139,92,246,0.1); color: var(--secondary); }
    .badge-growth { background: rgba(16,185,129,0.1); color: var(--success); }
    .badge-temp { background: rgba(239,68,68,0.1); color: var(--danger); }
    .badge-med { background: rgba(16,185,129,0.1); color: var(--success); }
    .badge-milestone { background: rgba(245,158,11,0.1); color: var(--accent); }
    .load-more-btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 1.5px dashed var(--border);
      border-radius: var(--radius);
      background: transparent;
      color: var(--text-secondary);
      font-size: 14px;
      cursor: pointer;
      text-align: center;
      font-family: inherit;
      transition: var(--transition);
    }
    .load-more-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
    .load-more-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-muted);
      font-size: 14px;
    }
    .empty-state i {
      font-size: 40px;
      display: block;
      margin-bottom: 14px;
      opacity: 0.4;
    }
    .delete-confirm-body {
      text-align: center;
      padding: 10px 0 20px;
    }
    .delete-confirm-body i {
      font-size: 40px;
      color: var(--danger);
      margin-bottom: 12px;
    }
    .delete-confirm-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    .delete-confirm-desc { font-size: 13px; color: var(--text-secondary); margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="page-container">
    <header>
      <div class="header-top">
        <button class="action-btn" onclick="navigateTo('record.html')"><i class="fa-solid fa-arrow-left"></i></button>
        <div>
          <div class="baby-name">全部记录</div>
          <div class="baby-age">历史记录 · 筛选</div>
        </div>
        <div class="action-btn" style="visibility:hidden;"><i class="fa-solid fa-gear"></i></div>
      </div>
    </header>

    <main>
      <!-- 搜索 -->
      <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="search-input" placeholder="搜索记录内容..." oninput="handleSearch()">
      </div>

      <!-- 类型筛选 -->
      <div class="filter-section">
        <div class="filter-pills" id="type-filters">
          <button class="filter-pill active" data-type="all" onclick="selectTypeFilter(this)">全部</button>
          <button class="filter-pill" data-type="feed" onclick="selectTypeFilter(this)"><i class="fa-solid fa-bottle-water"></i> 喂奶</button>
          <button class="filter-pill" data-type="excretion" onclick="selectTypeFilter(this)"><i class="fa-solid fa-poop"></i> 排泄</button>
          <button class="filter-pill" data-type="sleep" onclick="selectTypeFilter(this)"><i class="fa-solid fa-bed"></i> 睡眠</button>
          <button class="filter-pill" data-type="growth" onclick="selectTypeFilter(this)"><i class="fa-solid fa-ruler-vertical"></i> 生长</button>
          <button class="filter-pill" data-type="temp" onclick="selectTypeFilter(this)"><i class="fa-solid fa-temperature-half"></i> 体温</button>
          <button class="filter-pill" data-type="medication" onclick="selectTypeFilter(this)"><i class="fa-solid fa-pills"></i> 用药</button>
          <button class="filter-pill" data-type="milestone" onclick="selectTypeFilter(this)"><i class="fa-solid fa-trophy"></i> 里程碑</button>
        </div>
      </div>

      <!-- 时间筛选 -->
      <div class="filter-section">
        <div class="filter-pills" id="time-filters">
          <button class="filter-pill active" data-time="all" onclick="selectTimeFilter(this)">全部时间</button>
          <button class="filter-pill" data-time="today" onclick="selectTimeFilter(this)">今天</button>
          <button class="filter-pill" data-time="week" onclick="selectTimeFilter(this)">本周</button>
          <button class="filter-pill" data-time="month" onclick="selectTimeFilter(this)">本月</button>
        </div>
      </div>

      <!-- 统计 -->
      <div class="stats-bar">
        <span>共找到 <span class="count" id="total-count">0</span> 条记录</span>
        <span style="font-size: 12px; color: var(--text-muted);">按时间倒序</span>
      </div>

      <!-- 列表 -->
      <div id="records-list"></div>
      <button class="load-more-btn" id="load-more-btn" onclick="loadMore()" style="display:none;">加载更多</button>
    </main>

    <nav class="nav-bar">
      <div class="nav-item" data-page="../index.html">
        <div class="nav-item-icon"><i class="fa-solid fa-house"></i></div>
        <div class="nav-item-label">首页</div>
      </div>
      <div class="nav-item active" data-page="record.html">
        <div class="nav-item-icon"><i class="fa-solid fa-pen-to-square"></i></div>
        <div class="nav-item-label">记录</div>
      </div>
      <div class="nav-item" data-page="community.html">
        <div class="nav-item-icon"><i class="fa-solid fa-comments"></i></div>
        <div class="nav-item-label">社区</div>
      </div>
      <div class="nav-item" data-page="mom.html">
        <div class="nav-item-icon"><i class="fa-solid fa-user"></i></div>
        <div class="nav-item-label">我的</div>
      </div>
    </nav>
  </div>

  <!-- 删除确认弹窗 -->
  <div class="modal-overlay" id="delete-modal" style="display:none;">
    <div class="modal-content" style="max-width:320px;">
      <button class="close-btn" onclick="closeDeleteModal()"><i class="fa-solid fa-xmark"></i></button>
      <div class="delete-confirm-body">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <div class="delete-confirm-title">确认删除</div>
        <div class="delete-confirm-desc">删除后该记录无法恢复，是否继续？</div>
        <div style="display:flex;gap:12px;">
          <button class="form-btn" style="flex:1;background:var(--bg);color:var(--text-secondary);" onclick="closeDeleteModal()">取消</button>
          <button class="form-btn" style="flex:1;background:var(--danger);" onclick="confirmDelete()">确认删除</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../data/mock.js"></script>
  <script src="../script.js"></script>
  <script>
    const PAGE_SIZE = 20;
    let currentType = 'all';
    let currentTime = 'all';
    let currentSearch = '';
    let currentPage = 0;
    let allUnifiedRecords = [];
    let filteredRecords = [];
    let pendingDelete = null;

    const TYPE_CONFIG = {
      feed:        { label: '喂奶',    icon: 'fa-bottle-water',   key: 'feedRecords',        badgeClass: 'badge-breast' },
      excretion:   { label: '排泄',    icon: 'fa-poop',            key: 'excretionRecords',   badgeClass: 'badge-poop' },
      sleep:       { label: '睡眠',    icon: 'fa-bed',             key: 'sleepRecords',       badgeClass: 'badge-sleep' },
      growth:      { label: '生长',    icon: 'fa-ruler-vertical',  key: 'growthRecords',      badgeClass: 'badge-growth' },
      temp:        { label: '体温',    icon: 'fa-temperature-half',key: 'temperatureRecords', badgeClass: 'badge-temp' },
      medication:  { label: '用药',    icon: 'fa-pills',           key: 'medicationRecords',  badgeClass: 'badge-med' },
      milestone:   { label: '里程碑',  icon: 'fa-trophy',          key: 'milestoneRecords',   badgeClass: 'badge-milestone' }
    };

    function parseTime(str) {
      if (!str) return null;
      const d = new Date(str);
      return isNaN(d.getTime()) ? null : d;
    }

    function getTodayStr() {
      return new Date().toISOString().split('T')[0];
    }

    function getWeekStart() {
      const now = new Date();
      const day = now.getDay();
      const diff = now.getDate() - day + (day === 0 ? -6 : 1);
      const monday = new Date(now.setDate(diff));
      monday.setHours(0,0,0,0);
      return monday;
    }

    function getMonthStart() {
      const now = new Date();
      return new Date(now.getFullYear(), now.getMonth(), 1);
    }

    function unifyRecords() {
      const unified = [];
      for (const [type, cfg] of Object.entries(TYPE_CONFIG)) {
        const records = loadData(cfg.key) || [];
        for (const r of records) {
          const time = parseTime(r.time || r.date || r.startTime);
          if (!time) continue;

          let title = '', detail = '', badgeClass = cfg.badgeClass, timeStr = '';

          if (type === 'feed') {
            title = r.type === 'breast' ? '亲喂' + (r.side === 'left' ? '左侧' : '右侧') : '瓶喂';
            detail = r.type === 'breast' ? r.duration + ' 分钟' : r.amount + ' ml';
            badgeClass = r.type === 'breast' ? 'badge-breast' : 'badge-bottle';
            timeStr = r.time;
          } else if (type === 'excretion') {
            title = r.type === 'poop' ? '大便' : '小便';
            detail = r.type === 'poop' ? (r.color + ' · ' + r.consistency + (r.note ? ' · ' + r.note : '')) : '小便 x' + (r.urineCount || 1);
            badgeClass = r.type === 'poop' ? 'badge-poop' : 'badge-urine';
            timeStr = r.time;
          } else if (type === 'sleep') {
            title = '睡眠';
            const qmap = {good:'好', normal:'一般', poor:'差'};
            detail = (r.duration ? r.duration + ' 分钟' : '进行中') + ' · 质量: ' + (qmap[r.quality] || r.quality);
            timeStr = r.startTime;
          } else if (type === 'growth') {
            title = '生长记录';
            detail = [r.height && '身高 ' + r.height + 'cm', r.weight && '体重 ' + r.weight + 'kg', r.headCircumference && '头围 ' + r.headCircumference + 'cm'].filter(Boolean).join(' | ');
            timeStr = r.date;
          } else if (type === 'temp') {
            title = '体温';
            detail = r.value + '°C';
            badgeClass = r.value >= 37.3 ? 'badge-temp' : 'badge-growth';
            timeStr = r.time;
          } else if (type === 'medication') {
            title = r.name;
            detail = '剂量: ' + r.dose + (r.note ? ' | ' + r.note : '');
            timeStr = r.time;
          } else if (type === 'milestone') {
            title = r.name;
            detail = '';
            timeStr = r.date;
          }

          unified.push({
            ...r,
            _type: type,
            _time: time,
            _title: title,
            _detail: detail,
            _badgeClass: badgeClass,
            _icon: cfg.icon,
            _label: cfg.label,
            _storageKey: cfg.key,
            _timeStr: timeStr
          });
        }
      }
      unified.sort((a, b) => b._time - a._time);
      return unified;
    }

    function applyFilters() {
      filteredRecords = allUnifiedRecords.filter(r => {
        // 类型筛选
        if (currentType !== 'all' && r._type !== currentType) return false;
        // 时间筛选
        if (currentTime !== 'all') {
          const t = r._time;
          const now = new Date();
          if (currentTime === 'today') {
            if (t.toDateString() !== now.toDateString()) return false;
          } else if (currentTime === 'week') {
            if (t < getWeekStart()) return false;
          } else if (currentTime === 'month') {
            if (t < getMonthStart()) return false;
          }
        }
        // 搜索筛选
        if (currentSearch) {
          const text = (r._title + ' ' + r._detail + ' ' + r._timeStr).toLowerCase();
          if (!text.includes(currentSearch.toLowerCase())) return false;
        }
        return true;
      });
      currentPage = 0;
      renderRecords(true);
    }

    function renderRecords(reset) {
      const container = document.getElementById('records-list');
      const loadMoreBtn = document.getElementById('load-more-btn');
      const totalEl = document.getElementById('total-count');
      totalEl.textContent = filteredRecords.length;

      if (filteredRecords.length === 0) {
        container.innerHTML = '<div class="empty-state"><i class="fa-regular fa-folder-open"></i>没有找到符合条件的记录</div>';
        loadMoreBtn.style.display = 'none';
        return;
      }

      const end = (currentPage + 1) * PAGE_SIZE;
      const pageRecords = filteredRecords.slice(0, end);

      const html = pageRecords.map(r => `
        <div class="record-card">
          <div class="record-header">
            <span class="record-type-badge ${r._badgeClass}">
              <i class="fa-solid ${r._icon}"></i> ${r._label}
            </span>
            <span style="display:flex;align-items:center;gap:10px;">
              <span class="record-time">${r._timeStr}</span>
              <span style="cursor:pointer;color:var(--text-muted);font-size:14px;" onclick="openDeleteModal('${r.id}','${r._storageKey}')">
                <i class="fa-regular fa-trash-can"></i>
              </span>
            </span>
          </div>
          <div class="record-detail" style="font-weight:500;color:var(--text-primary);">${r._title}</div>
          ${r._detail ? `<div class="record-detail">${r._detail}</div>` : ''}
        </div>
      `).join('');

      if (reset) {
        container.innerHTML = html;
      } else {
        container.insertAdjacentHTML('beforeend', html);
      }

      if (end >= filteredRecords.length) {
        loadMoreBtn.style.display = 'none';
      } else {
        loadMoreBtn.style.display = 'block';
        loadMoreBtn.textContent = '加载更多 (' + (filteredRecords.length - end) + ' 条)';
      }
    }

    function loadMore() {
      currentPage++;
      renderRecords(false);
    }

    function selectTypeFilter(btn) {
      document.querySelectorAll('#type-filters .filter-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentType = btn.dataset.type;
      applyFilters();
    }

    function selectTimeFilter(btn) {
      document.querySelectorAll('#time-filters .filter-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTime = btn.dataset.time;
      applyFilters();
    }

    function handleSearch() {
      currentSearch = document.getElementById('search-input').value.trim();
      applyFilters();
    }

    function openDeleteModal(id, storageKey) {
      pendingDelete = { id, storageKey };
      document.getElementById('delete-modal').style.display = 'flex';
    }

    function closeDeleteModal() {
      pendingDelete = null;
      document.getElementById('delete-modal').style.display = 'none';
    }

    function confirmDelete() {
      if (!pendingDelete) return;
      const records = loadData(pendingDelete.storageKey) || [];
      const filtered = records.filter(r => r.id !== pendingDelete.id);
      saveData(pendingDelete.storageKey, filtered);
      closeDeleteModal();
      showToast('已删除记录');
      allUnifiedRecords = unifyRecords();
      applyFilters();
    }

    document.querySelectorAll('.modal-overlay').forEach(o => {
      o.addEventListener('click', e => { if (e.target === o) o.style.display = 'none'; });
    });

    document.addEventListener('DOMContentLoaded', () => {
      allUnifiedRecords = unifyRecords();
      // 解析 URL type 参数
      const params = new URLSearchParams(window.location.search);
      const urlType = params.get('type');
      if (urlType && TYPE_CONFIG[urlType]) {
        currentType = urlType;
        document.querySelectorAll('#type-filters .filter-pill').forEach(b => {
          b.classList.toggle('active', b.dataset.type === urlType);
        });
      }
      applyFilters();
      initNavItems();
    });
  </script>
</body>
</html>
