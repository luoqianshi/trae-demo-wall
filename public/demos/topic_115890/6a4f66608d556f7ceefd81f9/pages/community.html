<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宝宝成长记 - 社区</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="page-container">
    <header>
      <div class="header-top">
        <button class="action-btn" onclick="navigateTo('../index.html')"><i class="fa-solid fa-arrow-left"></i></button>
        <div>
          <div class="baby-name">社区交流</div>
          <div class="baby-age">同月龄圈子 · 树洞倾诉</div>
        </div>
        <button class="action-btn" onclick="openPostModal()"><i class="fa-solid fa-pen"></i></button>
      </div>
    </header>
    
    <main>
      <div class="tab-bar">
        <div class="tab-item active" onclick="switchCommunityTab('community')"><i class="fa-solid fa-baby"></i> 同月龄圈</div>
        <div class="tab-item" onclick="switchCommunityTab('treehole')"><i class="fa-solid fa-tree"></i> 树洞</div>
      </div>
      
      <div id="community-section">
        <div id="month-filter" style="display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px;">
          <button class="tab-item active" onclick="filterByMonth('12个月')">12个月</button>
          <button class="tab-item" onclick="filterByMonth('11个月')">11个月</button>
          <button class="tab-item" onclick="filterByMonth('13个月')">13个月</button>
          <button class="tab-item" onclick="filterByMonth('10个月')">10个月</button>
          <button class="tab-item" onclick="filterByMonth('9个月')">9个月</button>
        </div>
        <div id="community-posts"></div>
      </div>
      
      <div id="treehole-section" style="display: none;">
        <div style="background: linear-gradient(135deg, #4A5568, #2D3748); border-radius: 20px; padding: 20px; margin-bottom: 20px; color: white;">
          <div style="font-size: 16px; font-weight: bold; margin-bottom: 8px;"><i class="fa-solid fa-tree"></i> 树洞</div>
          <div style="font-size: 13px; opacity: 0.9;">在这里，你可以匿名倾诉所有的烦恼和压力。没有人认识你，只有温暖和理解。</div>
        </div>
        <div id="treehole-posts"></div>
      </div>
    </main>
    
    <nav class="nav-bar">
      <div class="nav-item" data-page="../index.html">
        <div class="nav-item-icon"><i class="fa-solid fa-house"></i></div>
        <div class="nav-item-label">首页</div>
      </div>
      <div class="nav-item" data-page="record.html">
        <div class="nav-item-icon"><i class="fa-solid fa-pen-to-square"></i></div>
        <div class="nav-item-label">记录</div>
      </div>
      <div class="nav-item active">
        <div class="nav-item-icon"><i class="fa-solid fa-comments"></i></div>
        <div class="nav-item-label">社区</div>
      </div>
      <div class="nav-item" data-page="mom.html">
        <div class="nav-item-icon"><i class="fa-solid fa-user"></i></div>
        <div class="nav-item-label">我的</div>
      </div>
    </nav>
  </div>
  
  <div class="modal-overlay" id="post-modal" style="display: none;">
    <div class="modal-content">
      <button class="close-btn" onclick="closePostModal()"><i class="fa-solid fa-xmark"></i></button>
      <div class="modal-title"><i class="fa-solid fa-pen"></i> 发布帖子</div>
      <div style="margin-top: 20px;">
        <div class="form-group">
          <label class="form-label">选择板块</label>
          <select class="form-select" id="post-type">
            <option value="community">同月龄圈</option>
            <option value="treehole">树洞（匿名）</option>
          </select>
        </div>
        <div class="form-group" id="month-group-select">
          <label class="form-label">选择月龄</label>
          <select class="form-select" id="post-month">
            <option value="12个月">12个月</option>
            <option value="11个月">11个月</option>
            <option value="13个月">13个月</option>
            <option value="10个月">10个月</option>
            <option value="9个月">9个月</option>
          </select>
        </div>
        <div class="form-group" id="tags-group">
          <label class="form-label">添加标签</label>
          <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <button class="tab-item tag-btn" onclick="toggleTag('亲测有效')" style="padding: 6px 12px;">亲测有效</button>
            <button class="tab-item tag-btn" onclick="toggleTag('辅食')" style="padding: 6px 12px;">辅食</button>
            <button class="tab-item tag-btn" onclick="toggleTag('睡眠')" style="padding: 6px 12px;">睡眠</button>
            <button class="tab-item tag-btn" onclick="toggleTag('出牙')" style="padding: 6px 12px;">出牙</button>
            <button class="tab-item tag-btn" onclick="toggleTag('湿疹')" style="padding: 6px 12px;">湿疹</button>
            <button class="tab-item tag-btn" onclick="toggleTag('学步')" style="padding: 6px 12px;">学步</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">内容</label>
          <textarea class="form-input" id="post-content" placeholder="分享你的经验或心情..." rows="5"></textarea>
        </div>
        <button class="form-btn" onclick="publishPost()">发布</button>
      </div>
    </div>
  </div>
  
  <div class="modal-overlay" id="more-menu" style="display: none;">
    <div class="modal-content">
      <button class="close-btn" onclick="toggleMoreMenu()"><i class="fa-solid fa-xmark"></i></button>
      <div class="modal-title">更多功能</div>
      <div style="margin-top: 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;">
        <div class="action-item" onclick="navigateTo('family.html'); toggleMoreMenu()">
          <div class="action-item-icon photo" style="width: 50px; height: 50px; margin: 0 auto 10px;"><i class="fa-solid fa-people-roof"></i></div>
          <div class="action-item-label">家庭组</div>
        </div>
        <div class="action-item" onclick="navigateTo('vaccine.html'); toggleMoreMenu()">
          <div class="action-item-icon medication" style="width: 50px; height: 50px; margin: 0 auto 10px;"><i class="fa-solid fa-syringe"></i></div>
          <div class="action-item-label">疫苗计划</div>
        </div>
        <div class="action-item" onclick="navigateTo('mom.html'); toggleMoreMenu()">
          <div class="action-item-icon feed" style="width: 50px; height: 50px; margin: 0 auto 10px;"><i class="fa-solid fa-user"></i></div>
          <div class="action-item-label">我的</div>
        </div>
        <div class="action-item" onclick="navigateTo('poop.html'); toggleMoreMenu()">
          <div class="action-item-icon poop" style="width: 50px; height: 50px; margin: 0 auto 10px;"><i class="fa-solid fa-poop"></i></div>
          <div class="action-item-label">大便识别</div>
        </div>
        <div class="action-item" onclick="navigateTo('report.html'); toggleMoreMenu()">
          <div class="action-item-icon growth" style="width: 50px; height: 50px; margin: 0 auto 10px;"><i class="fa-solid fa-file-medical"></i></div>
          <div class="action-item-label">儿保报告</div>
        </div>
      </div>
    </div>
  </div>
  
  <style>
    .post-card {
      cursor: pointer;
    }
    .post-action.liked {
      color: var(--danger) !important;
    }
    .post-delete-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      transition: var(--transition);
    }
    .post-delete-btn:hover {
      background: rgba(255, 107, 107, 0.1);
      color: var(--danger);
    }
  </style>

  <div class="modal-overlay" id="delete-confirm-overlay" style="display: none;">
    <div class="modal-content" style="max-width: 320px; text-align: center;">
      <div style="font-size: 40px; margin-bottom: 12px;"><i class="fa-solid fa-triangle-exclamation" style="color: var(--danger);"></i></div>
      <div style="font-size: 16px; font-weight: 600; margin-bottom: 8px;">确认删除</div>
      <div style="font-size: 14px; color: var(--text-secondary); margin-bottom: 20px;">确定要删除这条帖子吗？删除后无法恢复。</div>
      <div style="display: flex; gap: 12px;">
        <button class="form-btn" style="flex: 1; background: var(--bg); color: var(--text-secondary);" onclick="cancelDeletePost()">取消</button>
        <button class="form-btn" style="flex: 1; background: var(--danger);" onclick="confirmDeletePost()">确认删除</button>
      </div>
    </div>
  </div>

  <script src="../data/mock.js"></script>
  <script src="../script.js"></script>
  
  <script>
    let selectedTags = [];
    let currentTab = 'community';
    let currentMonth = '12个月';
    const currentUser = '甜甜妈';
    const currentUserAvatar = 'person';

    function switchCommunityTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-bar .tab-item').forEach((t, i) => {
        t.classList.remove('active');
        if ((tab === 'community' && i === 0) || (tab === 'treehole' && i === 1)) {
          t.classList.add('active');
        }
      });
      document.getElementById('community-section').style.display = tab === 'community' ? 'block' : 'none';
      document.getElementById('treehole-section').style.display = tab === 'treehole' ? 'block' : 'none';
      if (tab === 'community') {
        renderCommunityPosts();
      } else {
        renderTreeholePosts();
      }
    }

    function filterByMonth(month) {
      currentMonth = month;
      document.querySelectorAll('#month-filter .tab-item').forEach(t => {
        t.classList.remove('active');
        if (t.textContent === month) {
          t.classList.add('active');
        }
      });
      renderCommunityPosts();
    }

    function createPostHTML(post) {
      const isOwner = post.author === currentUser && post.type !== 'treehole';
      const commentCount = post.commentList ? post.commentList.length : 0;
      const likeClass = post.likedByMe ? 'liked' : '';

      return `
        <div class="post-card" data-id="${post.id}" onclick="openPostDetail('${post.id}')">
          <div class="post-header">
            <div class="post-author">
              <div class="post-avatar"><i class="fa-solid fa-${post.avatar || (post.type === 'treehole' ? 'user-secret' : 'person')}"></i></div>
              <span class="post-author-name">${post.author}</span>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
              <span class="post-time">${post.time}</span>
              ${isOwner ? `<button class="post-delete-btn" onclick="event.stopPropagation(); deletePost('${post.id}')"><i class="fa-solid fa-trash-can"></i> 删除</button>` : ''}
            </div>
          </div>
          ${post.monthGroup ? `<div class="post-tags">
            <span class="post-tag">${post.monthGroup}</span>
            ${(post.tags || []).map(tag => `<span class="post-tag ${tag === '亲测有效' ? 'valid' : ''}">${tag}</span>`).join('')}
          </div>` : ''}
          <div class="post-content">${post.content}</div>
          <div class="post-actions" onclick="event.stopPropagation()">
            <span class="post-action ${likeClass}" onclick="toggleLike('${post.id}')">
              ${post.likedByMe ? '<i class="fa-solid fa-heart"></i>' : '<i class="fa-regular fa-heart"></i>'} ${post.likes}
            </span>
            <span class="post-action">
              <i class="fa-regular fa-comment"></i> ${commentCount}
            </span>
          </div>
        </div>
      `;
    }

    function renderCommunityPosts() {
      const posts = loadData('communityPosts') || [];
      const filtered = posts.filter(p => p.type === 'community' && p.monthGroup === currentMonth);
      const container = document.getElementById('community-posts');
      if (filtered.length > 0) {
        container.innerHTML = filtered.map(post => createPostHTML(post)).join('');
      } else {
        container.innerHTML = '<div style="text-align: center; padding: 40px; color: #999;">暂无该月龄的帖子</div>';
      }
    }

    function renderTreeholePosts() {
      const posts = loadData('communityPosts') || [];
      const filtered = posts.filter(p => p.type === 'treehole');
      const container = document.getElementById('treehole-posts');
      if (filtered.length > 0) {
        container.innerHTML = filtered.map(post => createPostHTML(post)).join('');
      } else {
        container.innerHTML = '<div style="text-align: center; padding: 40px; color: #999;">暂无树洞帖子</div>';
      }
    }

    function openPostDetail(postId) {
      navigateTo('post-detail.html?id=' + postId);
    }

    function toggleLike(postId) {
      const posts = loadData('communityPosts') || [];
      const postIndex = posts.findIndex(p => p.id === postId);
      if (postIndex === -1) return;

      const post = posts[postIndex];
      if (post.likedByMe) {
        post.likes--;
        post.likedByMe = false;
      } else {
        post.likes++;
        post.likedByMe = true;
      }

      saveData('communityPosts', posts);
      
      if (currentTab === 'community') {
        renderCommunityPosts();
      } else {
        renderTreeholePosts();
      }
    }

    let pendingDeletePostId = null;

    function deletePost(postId) {
      pendingDeletePostId = postId;
      const overlay = document.getElementById('delete-confirm-overlay');
      if (overlay) overlay.style.display = 'flex';
    }

    function cancelDeletePost() {
      pendingDeletePostId = null;
      const overlay = document.getElementById('delete-confirm-overlay');
      if (overlay) overlay.style.display = 'none';
    }

    function confirmDeletePost() {
      if (!pendingDeletePostId) return;

      let posts = loadData('communityPosts') || [];
      posts = posts.filter(p => p.id !== pendingDeletePostId);
      saveData('communityPosts', posts);

      pendingDeletePostId = null;
      const overlay = document.getElementById('delete-confirm-overlay');
      if (overlay) overlay.style.display = 'none';

      if (currentTab === 'community') {
        renderCommunityPosts();
      } else {
        renderTreeholePosts();
      }
      showToast('删除成功');
    }

    function openPostModal() {
      document.getElementById('post-modal').style.display = 'flex';
      selectedTags = [];
      document.querySelectorAll('.tag-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('post-content').value = '';
      document.getElementById('post-type').value = currentTab;
      updatePostModalVisibility();
    }

    function closePostModal() {
      document.getElementById('post-modal').style.display = 'none';
    }

    function toggleTag(tag) {
      const index = selectedTags.indexOf(tag);
      const btn = event.target;
      if (index === -1) {
        selectedTags.push(tag);
        btn.classList.add('active');
      } else {
        selectedTags.splice(index, 1);
        btn.classList.remove('active');
      }
    }

    function updatePostModalVisibility() {
      const type = document.getElementById('post-type').value;
      document.getElementById('month-group-select').style.display = type === 'community' ? 'block' : 'none';
      document.getElementById('tags-group').style.display = type === 'community' ? 'block' : 'none';
    }

    function publishPost() {
      const type = document.getElementById('post-type').value;
      const content = document.getElementById('post-content').value;
      if (!content.trim()) {
        showToast('请输入内容');
        return;
      }

      const posts = loadData('communityPosts') || [];
      const isTreehole = type === 'treehole';
      const monthValue = type === 'community' ? document.getElementById('post-month').value : null;
      const newPost = {
        id: `post_${Date.now()}`,
        type,
        monthGroup: monthValue,
        tags: type === 'community' ? [...selectedTags] : [],
        content,
        author: isTreehole ? '匿名' : currentUser,
        avatar: isTreehole ? 'user-secret' : currentUserAvatar,
        time: new Date().toLocaleString('zh-CN'),
        likes: 0,
        likedByMe: false,
        commentList: []
      };
      posts.unshift(newPost);
      saveData('communityPosts', posts);
      closePostModal();
      
      if (type === 'community') {
        currentMonth = monthValue;
        switchCommunityTab('community');
        filterByMonth(monthValue);
      } else {
        switchCommunityTab('treehole');
      }
      
      showToast('发布成功');
    }

    function migratePostData() {
      const posts = loadData('communityPosts') || [];
      let needSave = false;
      
      posts.forEach(post => {
        if (typeof post.likedByMe === 'undefined') {
          post.likedByMe = false;
          needSave = true;
        }
        if (!post.commentList) {
          post.commentList = [];
          needSave = true;
        }
        if (!post.avatar) {
          post.avatar = post.type === 'treehole' ? 'user-secret' : getRandomAvatar();
          needSave = true;
        }
        if (typeof post.comments !== 'undefined') {
          delete post.comments;
          needSave = true;
        }
      });
      
      if (needSave) {
        saveData('communityPosts', posts);
      }
    }

    function getRandomAvatar() {
      return 'person';
    }

    function initCommunityPage() {
      migratePostData();
      document.getElementById('post-type').addEventListener('change', updatePostModalVisibility);
      renderCommunityPosts();
      renderTreeholePosts();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initCommunityPage);
    } else {
      initCommunityPage();
    }
  </script>
</body>
</html>
