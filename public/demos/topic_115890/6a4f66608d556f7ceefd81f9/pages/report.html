<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宝宝成长记 - 儿保报告</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .time-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .time-btn {
      flex: 1;
      padding: 12px;
      border: 2px solid var(--border);
      border-radius: 15px;
      background: white;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      color: var(--text-secondary);
    }
    .time-btn.active {
      border-color: var(--primary);
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      font-weight: bold;
    }
    .report-card {
      background: white;
      border-radius: 25px;
      padding: 25px;
      box-shadow: 0 4px 20px rgba(255, 182, 193, 0.15);
      margin-bottom: 20px;
    }
    .report-header {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 2px dashed #eee;
    }
    .report-baby-avatar {
      width: 70px;
      height: 70px;
      font-size: 35px;
      margin: 0 auto 12px;
      background: linear-gradient(135deg, #FFB6C1, #ADD8E6);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid rgba(255,255,255,0.5);
    }
    .report-baby-name {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .report-baby-info {
      font-size: 13px;
      color: #999;
    }
    .report-section {
      padding: 15px 0;
      border-bottom: 1px dashed #f0f0f0;
    }
    .report-section:last-child {
      border-bottom: none;
    }
    .report-section-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--primary-dark);
    }
    .report-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .report-item {
      background: var(--bg);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }
    .report-item-value {
      font-size: 18px;
      font-weight: bold;
      color: var(--primary-dark);
    }
    .report-item-label {
      font-size: 11px;
      color: #999;
      margin-top: 4px;
    }
    .report-stats-row {
      display: flex;
      justify-content: space-around;
    }
    .report-stat {
      text-align: center;
    }
    .report-stat-value {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .report-stat-label {
      font-size: 12px;
      color: #999;
    }
    .abnormal-item {
      background: #FFF8F0;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .abnormal-item:last-child {
      margin-bottom: 0;
    }
    .abnormal-title {
      font-weight: bold;
      color: #E67E22;
      margin-bottom: 4px;
    }
    .abnormal-desc {
      color: #666;
      font-size: 12px;
    }
    .vaccine-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #f5f5f5;
      font-size: 13px;
    }
    .vaccine-item:last-child {
      border-bottom: none;
    }
    .vaccine-name {
      font-weight: 500;
    }
    .vaccine-status {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
    }
    .vaccine-status.completed {
      background: rgba(144, 238, 144, 0.2);
      color: #228B22;
    }
    .vaccine-status.pending {
      background: rgba(255, 165, 0, 0.2);
      color: #D2691E;
    }
    .action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .action-buttons .form-btn {
      flex: 1;
      margin-top: 0;
    }
    .history-section {
      background: white;
      border-radius: 25px;
      padding: 25px;
      box-shadow: 0 4px 20px rgba(255, 182, 193, 0.15);
      margin-bottom: 20px;
    }
    .history-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      background: var(--bg);
      border-radius: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .history-item:hover {
      transform: translateX(5px);
      box-shadow: 0 2px 10px rgba(255, 182, 193, 0.1);
    }
    .history-info {
      flex: 1;
    }
    .history-date {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 4px;
    }
    .history-range {
      font-size: 12px;
      color: #999;
    }
    .history-actions {
      display: flex;
      gap: 10px;
    }
    .history-action-btn {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }
    .history-action-btn.view {
      background: rgba(173, 216, 230, 0.2);
      color: #4682B4;
    }
    .history-action-btn.delete {
      background: rgba(255, 107, 107, 0.1);
      color: #ff6b6b;
    }
    .history-action-btn:hover {
      transform: scale(1.1);
    }
    .empty-history {
      text-align: center;
      padding: 30px;
      color: #999;
      font-size: 14px;
    }
    .preparation-section {
      background: white;
      border-radius: 25px;
      padding: 25px;
      box-shadow: 0 4px 20px rgba(255, 182, 193, 0.15);
      margin-bottom: 20px;
    }
    .preparation-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .checklist {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .checklist-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px;
      background: var(--bg);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .checklist-item:hover {
      background: rgba(255, 182, 193, 0.1);
    }
    .checklist-checkbox {
      width: 22px;
      height: 22px;
      border: 2px solid #ddd;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.3s ease;
      font-size: 14px;
    }
    .checklist-item.checked .checklist-checkbox {
      background: var(--success);
      border-color: var(--success);
      color: white;
    }
    .checklist-text {
      flex: 1;
      font-size: 14px;
      color: #333;
    }
    .checklist-item.checked .checklist-text {
      text-decoration: line-through;
      color: #999;
    }
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      border-radius: 25px;
      padding: 30px;
      width: 90%;
      max-width: 400px;
      max-height: 80vh;
      overflow-y: auto;
      position: relative;
    }
    .modal-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
      text-align: center;
    }
    .close-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      background: var(--bg);
      border: none;
      font-size: 18px;
      cursor: pointer;
    }
    .share-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .share-option {
      text-align: center;
      cursor: pointer;
      padding: 15px;
      border-radius: 15px;
      transition: all 0.3s ease;
    }
    .share-option:hover {
      background: var(--bg);
    }
    .share-icon {
      width: 50px;
      height: 50px;
      margin: 0 auto 8px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    .share-label {
      font-size: 12px;
      color: #666;
    }
    .tab-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      overflow-x: auto;
      padding-bottom: 5px;
    }
    .tab-item {
      padding: 10px 20px;
      background: white;
      border-radius: 25px;
      font-size: 14px;
      color: #666;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 2px 10px rgba(255, 182, 193, 0.1);
      border: 2px solid transparent;
    }
    .tab-item.active {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      font-weight: bold;
    }
    .growth-chart-placeholder {
      background: var(--bg);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      font-size: 13px;
      color: #999;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .report-card {
      animation: fadeIn 0.3s ease;
    }
  </style>
</head>
<body>
  <div class="page-container">
    <header>
      <div class="header-top">
        <button class="action-btn" onclick="navigateTo('../index.html')"><i class="fa-solid fa-arrow-left"></i></button>
        <div>
          <div class="baby-name">儿保报告</div>
          <div class="baby-age">自动生成 · 结构化摘要</div>
        </div>
        <button class="action-btn" onclick="generateReport()"><i class="fa-solid fa-rotate"></i></button>
      </div>
    </header>
    
    <main>
      <div class="tab-bar">
        <div class="tab-item active" data-tab="generate" onclick="switchTab('generate')"><i class="fa-solid fa-file-medical"></i> 生成报告</div>
        <div class="tab-item" data-tab="history" onclick="switchTab('history')"><i class="fa-solid fa-folder"></i> 历史报告</div>
        <div class="tab-item" data-tab="preparation" onclick="switchTab('preparation')"><i class="fa-solid fa-hospital"></i> 就诊准备</div>
      </div>

      <div id="tab-generate">
        <div class="time-selector">
          <button class="time-btn active" data-days="7" onclick="selectTimeRange(7)">近7天</button>
          <button class="time-btn" data-days="30" onclick="selectTimeRange(30)">近30天</button>
          <button class="time-btn" data-days="90" onclick="selectTimeRange(90)">近90天</button>
        </div>

        <div id="report-container">
          <div class="report-card" id="report-content">
          </div>
        </div>

        <div class="action-buttons">
          <button class="form-btn" onclick="saveReport()"><i class="fa-solid fa-floppy-disk"></i> 保存报告</button>
          <button class="form-btn" style="background: linear-gradient(135deg, #90EE90, #98FB98);" onclick="showShareModal()"><i class="fa-solid fa-share-from-square"></i> 导出分享</button>
        </div>
      </div>

      <div id="tab-history" style="display: none;">
        <div class="history-section">
          <div class="history-title"><i class="fa-solid fa-folder"></i> 历史报告</div>
          <div class="history-list" id="history-list">
          </div>
        </div>
      </div>

      <div id="tab-preparation" style="display: none;">
        <div class="preparation-section">
          <div class="preparation-title"><i class="fa-solid fa-hospital"></i> 就诊准备清单</div>
          <div class="checklist" id="checklist">
          </div>
        </div>
      </div>
    </main>
    
    <nav class="nav-bar">
      <div class="nav-item" data-page="../index.html">
        <div class="nav-item-icon"><i class="fa-solid fa-house"></i></div>
        <div class="nav-item-label">首页</div>
      </div>
      <div class="nav-item" data-page="record.html">
        <div class="nav-item-icon"><i class="fa-solid fa-pen-to-square"></i></div>
        <div class="nav-item-label">记录</div>
      </div>
      <div class="nav-item" data-page="community.html">
        <div class="nav-item-icon"><i class="fa-solid fa-comments"></i></div>
        <div class="nav-item-label">社区</div>
      </div>
      <div class="nav-item" data-page="mom.html">
        <div class="nav-item-icon"><i class="fa-solid fa-user"></i></div>
        <div class="nav-item-label">我的</div>
      </div>
    </nav>
  </div>

  <div class="modal-overlay" id="share-modal" style="display: none;">
    <div class="modal-content">
      <button class="close-btn" onclick="hideShareModal()"><i class="fa-solid fa-xmark"></i></button>
      <div class="modal-title">导出与分享</div>
      <div class="share-options">
        <div class="share-option" onclick="exportAsImage()">
          <div class="share-icon" style="background: rgba(255, 182, 193, 0.2);"><i class="fa-solid fa-image"></i></div>
          <div class="share-label">导出图片</div>
        </div>
        <div class="share-option" onclick="exportAsPDF()">
          <div class="share-icon" style="background: rgba(173, 216, 230, 0.2);"><i class="fa-solid fa-file"></i></div>
          <div class="share-label">导出PDF</div>
        </div>
        <div class="share-option" onclick="copyReportLink()">
          <div class="share-icon" style="background: rgba(144, 238, 144, 0.2);"><i class="fa-solid fa-copy"></i></div>
          <div class="share-label">复制链接</div>
        </div>
        <div class="share-option" onclick="shareToWeChat()">
          <div class="share-icon" style="background: rgba(0, 200, 0, 0.15);"><i class="fa-solid fa-comment"></i></div>
          <div class="share-label">微信好友</div>
        </div>
        <div class="share-option" onclick="shareToMoments()">
          <div class="share-icon" style="background: rgba(0, 180, 0, 0.1);"><i class="fa-solid fa-sun"></i></div>
          <div class="share-label">朋友圈</div>
        </div>
        <div class="share-option" onclick="sendToDoctor()">
          <div class="share-icon" style="background: rgba(255, 165, 0, 0.15);"><i class="fa-solid fa-user-doctor"></i></div>
          <div class="share-label">发送医生</div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="history-detail-modal" style="display: none;">
    <div class="modal-content" style="max-width: 450px;">
      <button class="close-btn" onclick="hideHistoryDetail()"><i class="fa-solid fa-xmark"></i></button>
      <div class="modal-title">历史报告详情</div>
      <div id="history-detail-content">
      </div>
    </div>
  </div>
  
  <script src="../data/mock.js"></script>
  <script src="../script.js"></script>
  
  <script>
    let currentTimeRange = 7;
    let currentReportData = null;

    const preparationItems = [
      { id: 'prep_1', text: '携带宝宝出生证明/户口本', checked: false },
      { id: 'prep_2', text: '携带儿童保健手册', checked: false },
      { id: 'prep_3', text: '携带疫苗接种本', checked: false },
      { id: 'prep_4', text: '准备好既往检查报告', checked: false },
      { id: 'prep_5', text: '记录宝宝近期饮食情况', checked: false },
      { id: 'prep_6', text: '记录宝宝近期睡眠情况', checked: false },
      { id: 'prep_7', text: '记录宝宝异常症状（如有）', checked: false },
      { id: 'prep_8', text: '准备要问医生的问题清单', checked: false },
      { id: 'prep_9', text: '宝宝吃饱睡好，精神状态佳', checked: false },
      { id: 'prep_10', text: '携带湿巾、尿布、换洗衣物', checked: false },
    ];

    function initReportPage() {
      loadPreparationItems();
      loadHistoryList();
      generateReport();
      initNavItems();
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-item').forEach(tab => {
        tab.classList.remove('active');
      });
      document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');

      document.getElementById('tab-generate').style.display = 'none';
      document.getElementById('tab-history').style.display = 'none';
      document.getElementById('tab-preparation').style.display = 'none';
      document.getElementById(`tab-${tabName}`).style.display = 'block';

      if (tabName === 'history') {
        loadHistoryList();
      }
    }

    function selectTimeRange(days) {
      currentTimeRange = days;
      document.querySelectorAll('.time-btn').forEach(btn => {
        btn.classList.remove('active');
        if (parseInt(btn.dataset.days) === days) {
          btn.classList.add('active');
        }
      });
      generateReport();
    }

    function generateReport() {
      const baby = loadData('baby');
      const feedRecords = loadData('feedRecords') || [];
      const sleepRecords = loadData('sleepRecords') || [];
      const growthRecords = loadData('growthRecords') || [];
      const excretionRecords = loadData('excretionRecords') || [];
      const temperatureRecords = loadData('temperatureRecords') || [];
      const medicationRecords = loadData('medicationRecords') || [];
      const vaccines = loadData('vaccines') || [];
      const milestoneRecords = loadData('milestoneRecords') || [];

      const now = new Date();
      const startDate = new Date(now.getTime() - currentTimeRange * 24 * 60 * 60 * 1000);

      const filteredFeed = filterRecordsByDate(feedRecords, startDate, now, 'time');
      const filteredSleep = filterRecordsByDate(sleepRecords, startDate, now, 'startTime');
      const filteredExcretion = filterRecordsByDate(excretionRecords, startDate, now, 'time');
      const filteredTemp = filterRecordsByDate(temperatureRecords, startDate, now, 'time');
      const filteredMeds = filterRecordsByDate(medicationRecords, startDate, now, 'time');

      const feedStats = calculateFeedStats(filteredFeed);
      const sleepStats = calculateSleepStats(filteredSleep);
      const excretionStats = calculateExcretionStats(filteredExcretion);
      const growthStats = calculateGrowthStats(growthRecords, startDate);
      const abnormalList = findAbnormalConditions(filteredTemp, filteredMeds, filteredSleep);
      const recentVaccines = getRecentVaccines(vaccines, startDate, now);

      currentReportData = {
        id: `report_${Date.now()}`,
        generatedAt: new Date().toLocaleString('zh-CN'),
        timeRange: currentTimeRange,
        baby: baby,
        feedStats,
        sleepStats,
        excretionStats,
        growthStats,
        abnormalList,
        recentVaccines,
        milestones: milestoneRecords.slice(0, 5)
      };

      renderReport(currentReportData);
    }

    function filterRecordsByDate(records, startDate, endDate, dateField) {
      return records.filter(record => {
        const recordDate = new Date(record[dateField].replace(/-/g, '/'));
        return recordDate >= startDate && recordDate <= endDate;
      });
    }

    function calculateFeedStats(records) {
      if (records.length === 0) {
        return { totalAmount: 0, avgAmount: 0, totalFeeds: 0, avgFeeds: 0, breastFeeds: 0, bottleFeeds: 0 };
      }

      let totalAmount = 0;
      let bottleFeeds = 0;
      let breastFeeds = 0;
      const dayMap = {};

      records.forEach(record => {
        const date = record.time.split(' ')[0];
        if (!dayMap[date]) dayMap[date] = 0;
        dayMap[date]++;

        if (record.type === 'bottle') {
          totalAmount += record.amount || 0;
          bottleFeeds++;
        } else {
          breastFeeds++;
          totalAmount += 120;
        }
      });

      const days = Object.keys(dayMap).length || 1;
      return {
        totalAmount: Math.round(totalAmount),
        avgAmount: Math.round(totalAmount / days),
        totalFeeds: records.length,
        avgFeeds: Math.round(records.length / days * 10) / 10,
        breastFeeds,
        bottleFeeds
      };
    }

    function calculateSleepStats(records) {
      if (records.length === 0) {
        return { totalMinutes: 0, avgMinutes: 0, avgHours: '0h', nightWakings: 0, naps: 0, quality: 'normal' };
      }

      let totalMinutes = 0;
      let naps = 0;
      let nightWakings = 0;
      const dayMap = {};

      records.forEach(record => {
        const date = record.startTime.split(' ')[0];
        if (!dayMap[date]) dayMap[date] = { minutes: 0, count: 0 };
        
        if (record.duration) {
          totalMinutes += record.duration;
          dayMap[date].minutes += record.duration;
        }
        dayMap[date].count++;
        naps++;
      });

      const days = Object.keys(dayMap).length || 1;
      const avgMinutes = Math.round(totalMinutes / days);
      const avgHours = `${Math.floor(avgMinutes / 60)}h${avgMinutes % 60 > 0 ? (avgMinutes % 60) + 'm' : ''}`;

      return {
        totalMinutes,
        avgMinutes,
        avgHours,
        nightWakings: Math.round(naps / days * 0.3),
        naps: Math.round(naps / days * 10) / 10,
        quality: avgMinutes >= 600 ? 'good' : avgMinutes >= 480 ? 'normal' : 'poor'
      };
    }

    function calculateExcretionStats(records) {
      if (records.length === 0) {
        return { avgPoop: 0, avgUrine: 0, poopColor: '黄色', poopConsistency: '软便' };
      }

      let poopCount = 0;
      let urineCount = 0;
      const colors = {};
      const consistencies = {};
      const dayMap = {};

      records.forEach(record => {
        const date = record.time.split(' ')[0];
        if (!dayMap[date]) dayMap[date] = { poop: 0, urine: 0 };

        if (record.type === 'poop') {
          poopCount++;
          dayMap[date].poop++;
          if (record.color) colors[record.color] = (colors[record.color] || 0) + 1;
          if (record.consistency) consistencies[record.consistency] = (consistencies[record.consistency] || 0) + 1;
        } else {
          urineCount += record.urineCount || 1;
          dayMap[date].urine += record.urineCount || 1;
        }
      });

      const days = Object.keys(dayMap).length || 1;
      const mostColor = Object.keys(colors).reduce((a, b) => colors[a] > colors[b] ? a : b, '黄色');
      const mostConsistency = Object.keys(consistencies).reduce((a, b) => consistencies[a] > consistencies[b] ? a : b, '软便');

      const consistencyMap = { 'soft': '软便', 'normal': '正常', 'hard': '硬便', 'loose': '稀便' };

      return {
        avgPoop: Math.round(poopCount / days * 10) / 10,
        avgUrine: Math.round(urineCount / days),
        poopColor: mostColor,
        poopConsistency: consistencyMap[mostConsistency] || mostConsistency
      };
    }

    function calculateGrowthStats(records, startDate) {
      if (records.length === 0) {
        return { currentHeight: 0, currentWeight: 0, currentHead: 0, heightChange: 0, weightChange: 0, headChange: 0 };
      }

      const sorted = [...records].sort((a, b) => new Date(a.date) - new Date(b.date));
      const latest = sorted[sorted.length - 1];
      
      let previous = null;
      for (let i = sorted.length - 2; i >= 0; i--) {
        if (new Date(sorted[i].date) >= startDate) {
          previous = sorted[i];
        } else {
          break;
        }
      }
      if (!previous && sorted.length > 1) {
        previous = sorted[0];
      }

      return {
        currentHeight: latest.height,
        currentWeight: latest.weight,
        currentHead: latest.headCircumference,
        heightChange: previous ? (latest.height - previous.height).toFixed(1) : 0,
        weightChange: previous ? (latest.weight - previous.weight).toFixed(1) : 0,
        headChange: previous ? (latest.headCircumference - previous.headCircumference).toFixed(1) : 0
      };
    }

    function findAbnormalConditions(tempRecords, medRecords, sleepRecords) {
      const abnormal = [];

      const highTemps = tempRecords.filter(t => t.value >= 37.5);
      if (highTemps.length > 0) {
        abnormal.push({
          title: `体温异常 (${highTemps.length}次)`,
          desc: `最高体温 ${Math.max(...highTemps.map(t => t.value))}°C，请注意观察`,
          type: 'fever'
        });
      }

      if (medRecords.length > 0) {
        const medNames = [...new Set(medRecords.map(m => m.name))];
        abnormal.push({
          title: `用药记录 (${medRecords.length}次)`,
          desc: `使用了 ${medNames.join('、')} 等药物`,
          type: 'medication'
        });
      }

      const poorSleep = sleepRecords.filter(s => s.quality === 'poor');
      if (poorSleep.length >= 3) {
        abnormal.push({
          title: '睡眠质量欠佳',
          desc: `近期有 ${poorSleep.length} 次睡眠质量较差，夜醒较频繁`,
          type: 'sleep'
        });
      }

      if (abnormal.length === 0) {
        abnormal.push({
          title: '一切正常',
          desc: '未发现明显异常情况，继续保持',
          type: 'normal'
        });
      }

      return abnormal;
    }

    function getRecentVaccines(vaccines, startDate, endDate) {
      return vaccines
        .filter(v => {
          const dueDate = new Date(v.dueDate);
          return dueDate >= startDate && dueDate <= endDate || v.status === 'completed' && v.completedDate && 
            new Date(v.completedDate) >= startDate && new Date(v.completedDate) <= endDate;
        })
        .slice(0, 5);
    }

    function saveReport() {
      if (!currentReportData) {
        showToast('请先生成报告');
        return;
      }

      const reports = loadData('savedReports') || [];
      const reportToSave = {
        ...currentReportData,
        savedAt: new Date().toLocaleString('zh-CN')
      };
      reports.unshift(reportToSave);
      saveData('savedReports', reports);
      showToast('报告已保存');
    }

    function loadHistoryList() {
      const reports = loadData('savedReports') || [];
      const container = document.getElementById('history-list');
      if (!container) return;

      if (reports.length === 0) {
        container.innerHTML = '<div class="empty-history">暂无历史报告<br>生成报告后可在此查看</div>';
        return;
      }

      container.innerHTML = reports.map(report => `
        <div class="history-item">
          <div class="history-info" onclick="viewHistoryReport('${report.id}')">
            <div class="history-date">${report.savedAt || report.generatedAt}</div>
            <div class="history-range">近${report.timeRange}天报告 · ${report.baby ? report.baby.name : '宝宝'}</div>
          </div>
          <div class="history-actions">
            <button class="history-action-btn view" onclick="event.stopPropagation(); viewHistoryReport('${report.id}')" title="查看"><i class="fa-solid fa-eye"></i></button>
            <button class="history-action-btn delete" onclick="event.stopPropagation(); deleteHistoryReport('${report.id}')" title="删除"><i class="fa-solid fa-trash-can"></i></button>
          </div>
        </div>
      `).join('');
    }

        return;

      const detailContent = document.getElementById('history-detail-content');
      if (detailContent) {
        const baby = report.baby || { name: '宝宝' };
        detailContent.innerHTML = `
          <div style="font-size: 14px; color: #666; margin-bottom: 15px; text-align: center;">

    function deleteHistoryReport(reportId) {
      if (!confirm('确定要删除这份报告吗？')) return;
      
      const reports = loadData('savedReports') || [];
      const filtered = reports.filter(r => r.id !== reportId);
      saveData('savedReports', filtered);
      loadHistoryList();
      showToast('已删除');
    }

      if (navigator.clipboard) {

        }).catch(() => {

    function loadPreparationItems() {
      const saved = loadData('preparationChecklist');
      let items = preparationItems;
      
      if (saved && saved.length > 0) {
        items = saved;
      }

      const container = document.getElementById('checklist');
      if (!container) return;

      container.innerHTML = items.map(item => `
        <div class="checklist-item ${item.checked ? 'checked' : ''}" onclick="toggleChecklistItem('${item.id}')">
          <div class="checklist-checkbox">${item.checked ? '✓' : ''}</div>
          <div class="checklist-text">${item.text}</div>
        </div>
      `).join('');
    }

    function toggleChecklistItem(itemId) {
      const saved = loadData('preparationChecklist');
      let items = saved && saved.length > 0 ? saved : preparationItems;

      items = items.map(item => {
        if (item.id === itemId) {
          return { ...item, checked: !item.checked };
        }
        return item;
      });

      saveData('preparationChecklist', items);
      loadPreparationItems();
    }

    document.addEventListener('DOMContentLoaded', initReportPage);
  </script>
