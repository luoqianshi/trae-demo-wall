<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宝宝成长记 - 大便识别</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .upload-area {
      width: 200px;
      height: 200px;
      border: 3px dashed #FFB6C1;
      border-radius: 20px;
      margin: 0 auto 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      overflow: hidden;
      position: relative;
    }
    .upload-area:hover {
      border-color: #FF69B4;
      background: rgba(255, 182, 193, 0.1);
    }
    .upload-area.has-image {
      border-style: solid;
    }
    .upload-area img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .upload-placeholder {
      text-align: center;
    }
    .upload-icon {
      font-size: 60px;
      margin-bottom: 10px;
    }
    .upload-text {
      font-size: 14px;
      color: #666;
    }
    .analyzing-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      z-index: 10;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 10px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .result-icon {
      font-size: 32px;
      margin-bottom: 5px;
    }
    .action-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 15px;
    }
    .action-buttons .form-btn {
      margin-top: 0;
      font-size: 14px;
      padding: 12px;
    }
    .action-buttons .form-btn.secondary {
      background: linear-gradient(135deg, #ADD8E6, #87CEEB);
    }
    .record-detail-btn {
      color: #FFB6C1;
      font-size: 12px;
      cursor: pointer;
      margin-right: 10px;
    }
    .poop-detail-modal .detail-section {
      margin-bottom: 20px;
    }
    .poop-detail-modal .detail-label {
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
    }
    .poop-detail-modal .detail-value {
      font-size: 16px;
      font-weight: bold;
    }
    .poop-detail-modal .detail-image {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 15px;
    }
    .status-normal {
      color: #228B22;
    }
    .status-warning {
      color: #D2691E;
    }
    .status-danger {
      color: #DC143C;
    }
    .suggestion-box {
      border-radius: 15px;
      padding: 15px;
      font-size: 14px;
      line-height: 1.6;
    }
    .suggestion-box.normal {
      background: rgba(144, 238, 144, 0.15);
      color: #228B22;
    }
    .suggestion-box.warning {
      background: rgba(255, 215, 0, 0.15);
      color: #B8860B;
    }
    .suggestion-box.danger {
      background: rgba(255, 107, 107, 0.15);
      color: #DC143C;
    }
  </style>
</head>
<body>
  <div class="page-container">
    <header>
      <div class="header-top">
        <button class="action-btn" onclick="navigateTo('../index.html')"><i class="fa-solid fa-arrow-left"></i></button>
        <div>
          <div class="baby-name">大便识别</div>
          <div class="baby-age">AI辅助分析 · 护理提示</div>
        </div>
        <div class="action-btn" style="cursor: pointer;" onclick="showToast('AI分析仅供参考，如有异常请及时就医')">?</div>
      </div>
    </header>
    
    <main>
      <div class="form-card" style="text-align: center;">
        <div class="upload-area" id="upload-area" onclick="triggerCamera()">
          <div class="upload-placeholder" id="upload-placeholder">
            <div class="upload-icon"><i class="fa-solid fa-camera"></i></div>
            <div class="upload-text">点击拍照或上传</div>
          </div>
          <img id="preview-image" src="" alt="大便照片" style="display: none;">
          <div class="analyzing-overlay" id="analyzing-overlay" style="display: none;">
            <div class="spinner"></div>
            <div>AI分析中...</div>
          </div>
        </div>
        <input type="file" id="poop-image" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
        <button class="form-btn" onclick="triggerCamera()"><i class="fa-solid fa-camera"></i> 拍照识别</button>
      </div>
      
      <div id="analysis-result" style="display: none;">
        <div class="form-card">
          <div class="section-title"><i class="fa-solid fa-chart-pie"></i> AI分析结果</div>
          
          <div style="display: flex; justify-content: space-around; margin: 20px 0;">
            <div style="text-align: center;">
              <div class="result-icon" id="result-color-icon"><span style="display:inline-block;width:28px;height:28px;border-radius:50%;background:#FFD700;"></span></div>
              <div style="font-size: 14px; font-weight: bold;" id="result-color-text">黄色</div>
              <div style="font-size: 12px; color: #999;">颜色</div>
            </div>
            <div style="text-align: center;">
              <div class="result-icon" id="result-consistency-icon"><i class="fa-solid fa-cloud"></i></div>
              <div style="font-size: 14px; font-weight: bold;" id="result-consistency-text">软便</div>
              <div style="font-size: 12px; color: #999;">性状</div>
            </div>
            <div style="text-align: center;">
              <div class="result-icon" id="result-status-icon"><i class="fa-solid fa-check"></i></div>
              <div style="font-size: 14px; font-weight: bold;" id="result-status-text">正常</div>
              <div style="font-size: 12px; color: #999;">状态</div>
            </div>
          </div>
          
          <div class="section-title"><i class="fa-solid fa-lightbulb"></i> 护理建议</div>
          <div class="suggestion-box normal" id="suggestion-box">
            大便颜色和性状都很正常，宝宝消化吸收良好。继续保持当前的喂养方式即可。
          </div>
          
          <div class="action-buttons">
            <button class="form-btn" onclick="savePoopRecord()"><i class="fa-solid fa-floppy-disk"></i> 保存记录</button>
            <button class="form-btn secondary" onclick="consultDoctor()"><i class="fa-solid fa-user-doctor"></i> 咨询医生</button>
          </div>
          <button class="form-btn" style="margin-top: 12px; background: linear-gradient(135deg, #9370DB, #BA55D3);" onclick="shareResult()"><i class="fa-solid fa-share-from-square"></i> 分享结果</button>
        </div>
      </div>
      
      <div class="section-title"><i class="fa-solid fa-clock-rotate-left"></i> 近期记录</div>
      <div id="excretion-records"></div>
    </main>
    
    <nav class="nav-bar">
      <div class="nav-item" data-page="../index.html">
        <div class="nav-item-icon"><i class="fa-solid fa-house"></i></div>
        <div class="nav-item-label">首页</div>
      </div>
      <div class="nav-item" data-page="record.html">
        <div class="nav-item-icon"><i class="fa-solid fa-pen-to-square"></i></div>
        <div class="nav-item-label">记录</div>
      </div>
      <div class="nav-item" data-page="community.html">
        <div class="nav-item-icon"><i class="fa-solid fa-comments"></i></div>
        <div class="nav-item-label">社区</div>
      </div>
      <div class="nav-item" data-page="mom.html">
        <div class="nav-item-icon"><i class="fa-solid fa-user"></i></div>
        <div class="nav-item-label">我的</div>
      </div>
    </nav>
  </div>
  
  <div class="modal-overlay" id="detail-modal" style="display: none;">
    <div class="modal-content poop-detail-modal">
      <button class="close-btn" onclick="closeDetailModal()"><i class="fa-solid fa-xmark"></i></button>
      <div class="modal-title">大便详情</div>
      <div id="detail-content"></div>
    </div>
  </div>
  
  <script src="../data/mock.js"></script>
  <script src="../script.js"></script>
  
  <script>
    let currentAnalysis = null;
    let currentImageData = null;
    
    const colorOptions = [
      { name: '黄色', icon: 'fa-circle', color: '#FFD700', status: 'normal', label: 'yellow' },
      { name: '金黄色', icon: 'fa-circle', color: '#FFA500', status: 'normal', label: 'golden' },
      { name: '黄绿色', icon: 'fa-circle', color: '#22C55E', status: 'normal', label: 'greenish' },
      { name: '绿色', icon: 'fa-circle', color: '#16A34A', status: 'warning', label: 'green' },
      { name: '灰白色', icon: 'fa-circle', color: '#D1D5DB', status: 'danger', label: 'gray' },
      { name: '黑色', icon: 'fa-circle', color: '#1F2937', status: 'danger', label: 'black' },
      { name: '红色', icon: 'fa-circle', color: '#DC2626', status: 'danger', label: 'red' }
    ];
    
    const consistencyOptions = [
      { name: '软便', icon: 'fa-cloud', status: 'normal', label: 'soft' },
      { name: '糊状', icon: 'fa-snowflake', status: 'normal', label: 'pasty' },
      { name: '条状', icon: 'fa-utensils', status: 'normal', label: 'formed' },
      { name: '稀水便', icon: 'fa-droplet', status: 'warning', label: 'watery' },
      { name: '干结', icon: 'fa-gem', status: 'warning', label: 'hard' },
      { name: '蛋花汤样', icon: 'fa-bowl-rice', status: 'danger', label: 'eggdrop' },
      { name: '泡沫多', icon: 'fa-burst', status: 'warning', label: 'foamy' }
    ];
    
    const suggestions = {
      normal: [
        '大便颜色和性状都很正常，宝宝消化吸收良好。继续保持当前的喂养方式即可。',
        '宝宝的便便很健康！说明消化系统运转正常，继续保持规律喂养。',
        '非常好的大便状态！说明宝宝喂养得当，肠道功能良好。'
      ],
      warning: [
        '注意观察宝宝的精神状态和食欲，如果持续异常建议调整饮食。',
        '大便性状略有异常，可能与饮食变化有关。建议适当补充水分，继续观察。',
        '颜色/性状略有变化，不用过于担心。注意观察后续排便情况，如有加重及时就医。'
      ],
      danger: [
        '大便颜色/性状异常，建议尽快带宝宝就医检查，排除消化道疾病可能。',
        '<i class="fa-solid fa-circle-exclamation"></i> 发现异常信号！请密切观察宝宝状态，如有不适请立即就医。',
        '这种情况需要引起重视，建议咨询儿科医生，必要时进行大便常规检查。'
      ]
    };
    
    function triggerCamera() {
      document.getElementById('poop-image').click();
    }
    
    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = function(e) {
        currentImageData = e.target.result;
        
        const previewImg = document.getElementById('preview-image');
        const placeholder = document.getElementById('upload-placeholder');
        const uploadArea = document.getElementById('upload-area');
        
        previewImg.src = currentImageData;
        previewImg.style.display = 'block';
        placeholder.style.display = 'none';
        uploadArea.classList.add('has-image');
        
        analyzeImage();
      };
      reader.readAsDataURL(file);
    }
    
    function analyzeImage() {
      const overlay = document.getElementById('analyzing-overlay');
      overlay.style.display = 'flex';
      
      setTimeout(() => {
        const colorResult = colorOptions[Math.floor(Math.random() * colorOptions.length)];
        const consistencyResult = consistencyOptions[Math.floor(Math.random() * consistencyOptions.length)];
        
        let overallStatus = 'normal';
        if (colorResult.status === 'danger' || consistencyResult.status === 'danger') {
          overallStatus = 'danger';
        } else if (colorResult.status === 'warning' || consistencyResult.status === 'warning') {
          overallStatus = 'warning';
        }
        
        const suggestionList = suggestions[overallStatus];
        const suggestion = suggestionList[Math.floor(Math.random() * suggestionList.length)];
        
        currentAnalysis = {
          color: colorResult,
          consistency: consistencyResult,
          status: overallStatus,
          suggestion: suggestion
        };
        
        displayAnalysisResult();
        
        overlay.style.display = 'none';
        showToast('AI分析完成');
      }, 1500);
    }
    
    function displayAnalysisResult() {
      const resultDiv = document.getElementById('analysis-result');
      resultDiv.style.display = 'block';
      
      document.getElementById('result-color-icon').innerHTML = currentAnalysis.color.color ? 
        '<span style="display:inline-block;width:28px;height:28px;border-radius:50%;background:' + currentAnalysis.color.color + ';"></span>' : 
        '<i class="fa-solid fa-' + (currentAnalysis.color.icon || 'circle') + '"></i>';
      document.getElementById('result-color-text').textContent = currentAnalysis.color.name;
      
      document.getElementById('result-consistency-icon').innerHTML = '<i class="fa-solid fa-' + (currentAnalysis.consistency.icon || 'cloud') + '"></i>';
      document.getElementById('result-consistency-text').textContent = currentAnalysis.consistency.name;
      
      const statusIcon = currentAnalysis.status === 'normal' ? 'fa-check' : currentAnalysis.status === 'warning' ? 'fa-triangle-exclamation' : 'fa-circle-exclamation';
      const statusText = currentAnalysis.status === 'normal' ? '正常' : currentAnalysis.status === 'warning' ? '注意' : '异常';
      document.getElementById('result-status-icon').innerHTML = '<i class="fa-solid fa-' + statusIcon + '"></i>';
      document.getElementById('result-status-text').textContent = statusText;
      
      const suggestionBox = document.getElementById('suggestion-box');
      suggestionBox.className = 'suggestion-box ' + currentAnalysis.status;
      suggestionBox.textContent = currentAnalysis.suggestion;
    }
    
    function savePoopRecord() {
      if (!currentAnalysis) {
        showToast('请先进行识别');
        return;
      }
      
      const records = loadData('excretionRecords') || [];
      const newRecord = {
        id: `ex_${Date.now()}`,
        type: 'poop',
        color: currentAnalysis.color.label,
        colorName: currentAnalysis.color.name,
        colorIcon: currentAnalysis.color.icon,
        consistency: currentAnalysis.consistency.label,
        consistencyName: currentAnalysis.consistency.name,
        consistencyIcon: currentAnalysis.consistency.icon,
        status: currentAnalysis.status,
        suggestion: currentAnalysis.suggestion,
        image: currentImageData,
        urineCount: 0,
        time: new Date().toLocaleString('zh-CN'),
        user: '妈妈'
      };
      
      records.unshift(newRecord);
      saveData('excretionRecords', records);
      updateActivityLog('妈妈', `记录大便(${currentAnalysis.color.name}${currentAnalysis.consistency.name})`);
      
      showToast('已保存大便记录');
      loadPoopRecords();
    }
    
    function consultDoctor() {
      showToast('正在跳转医生咨询...');
      setTimeout(() => {
        showToast('功能开发中，敬请期待');
      }, 1000);
    }
    
    function shareResult() {
      showToast('正在生成分享图片...');
      setTimeout(() => {
        showToast('分享功能开发中');
      }, 1000);
    }
    
    function loadPoopRecords() {
      const records = loadData('excretionRecords') || [];
      const poopRecords = records.filter(r => r.type === 'poop');
      const container = document.getElementById('excretion-records');
      
      if (container) {
        if (poopRecords.length === 0) {
          container.innerHTML = '<div style="text-align: center; color: #999; padding: 30px 0;">暂无记录</div>';
          return;
        }
        
        container.innerHTML = poopRecords.slice(0, 10).map(record => `
          <div class="record-card">
            <div class="record-header">
              <span class="record-type"><i class="fa-solid fa-poop"></i> 大便</span>
              <span style="display: flex; align-items: center; gap: 5px;">
                <span class="record-detail-btn" onclick="showRecordDetail('${record.id}')">详情</span>
                <span style="cursor: pointer; color: #ff6b6b; font-size: 16px;" onclick="deleteRecord('${record.id}', 'excretionRecords', loadPoopRecords)"><i class="fa-solid fa-trash-can"></i></span>
              </span>
            </div>
            <div class="record-detail">
              颜色: ${record.colorName || record.color} | 性状: ${record.consistencyName || record.consistency}
            </div>
            <div style="font-size: 12px; color: #999; margin-top: 5px;">${record.time}</div>
          </div>
        `).join('');
      }
    }
    
    function showRecordDetail(recordId) {
      const records = loadData('excretionRecords') || [];
      const record = records.find(r => r.id === recordId);
      
      if (!record) return;
      
      const statusMap = {
        normal: { text: '正常', class: 'status-normal', icon: 'fa-check' },
        warning: { text: '注意', class: 'status-warning', icon: 'fa-triangle-exclamation' },
        danger: { text: '异常', class: 'status-danger', icon: 'fa-circle-exclamation' }
      };
      
      const statusInfo = statusMap[record.status] || statusMap.normal;
      
      const detailContent = document.getElementById('detail-content');
      detailContent.innerHTML = `
        ${record.image ? `<img src="${record.image}" class="detail-image" alt="大便照片">` : ''}
        <div class="detail-section">
          <div class="detail-label">颜色</div>
          <div class="detail-value"><span style="display:inline-block;width:16px;height:16px;border-radius:50%;background:#FFD700;vertical-align:middle;"></span> ${record.colorName || record.color}</div>
        </div>
        <div class="detail-section">
          <div class="detail-label">性状</div>
          <div class="detail-value"><i class="fa-solid fa-cloud"></i> ${record.consistencyName || record.consistency}</div>
        </div>
        <div class="detail-section">
          <div class="detail-label">状态</div>
          <div class="detail-value ${statusInfo.class}">${statusInfo.icon} ${statusInfo.text}</div>
        </div>
        <div class="detail-section">
          <div class="detail-label">护理建议</div>
          <div class="suggestion-box ${record.status || 'normal'}">${record.suggestion || '请咨询医生'}</div>
        </div>
        <div class="detail-section">
          <div class="detail-label">记录时间</div>
          <div class="detail-value" style="font-size: 14px; font-weight: normal;">${record.time}</div>
        </div>
        <div class="detail-section">
          <div class="detail-label">记录人</div>
          <div class="detail-value" style="font-size: 14px; font-weight: normal;">${record.user || '妈妈'}</div>
        </div>
        <div class="action-buttons">
          <button class="form-btn" onclick="closeDetailModal(); consultDoctor();"><i class="fa-solid fa-user-doctor"></i> 咨询医生</button>
          <button class="form-btn secondary" onclick="closeDetailModal(); shareResult();"><i class="fa-solid fa-share-from-square"></i> 分享</button>
        </div>
      `;
      
      document.getElementById('detail-modal').style.display = 'flex';
    }
    
    function closeDetailModal() {
      document.getElementById('detail-modal').style.display = 'none';
    }
    
    function deleteRecord(recordId, storageKey, callback) {
      if (!confirm('确定要删除这条记录吗？')) return;
      
      let records = loadData(storageKey) || [];
      records = records.filter(r => r.id !== recordId);
      saveData(storageKey, records);
      
      showToast('已删除');
      if (callback) callback();
    }
    
    function initPoopPage() {
      loadBabyInfo();
      initNavItems();
      loadPoopRecords();
    }
    
    document.addEventListener('DOMContentLoaded', initPoopPage);
  </script>
</body>
</html>
