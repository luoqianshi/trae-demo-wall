<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>宝宝成长记 - 首页</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="page-container">
    <header>
      <div class="header-top">
        <div class="baby-info">
          <div class="baby-avatar"><i class="fa-solid fa-baby"></i></div>
          <div>
            <div class="baby-name">小糯米</div>
            <div class="baby-age">12个月</div>
          </div>
        </div>
        <div class="header-actions">
          <button class="action-btn" onclick="navigateTo('pages/report.html')"><i class="fa-solid fa-file-medical"></i></button>
          <button class="action-btn" onclick="navigateTo('pages/family.html')"><i class="fa-solid fa-people-roof"></i></button>
        </div>
      </div>
      <div class="status-cards">
        <div class="status-card">
          <div class="status-card-icon"><i class="fa-solid fa-bottle-water"></i></div>
          <div class="status-card-value">4小时前</div>
          <div class="status-card-label">上次喂奶</div>
        </div>
        <div class="status-card">
          <div class="status-card-icon"><i class="fa-solid fa-moon"></i></div>
          <div class="status-card-value">10小时</div>
          <div class="status-card-label">今日睡眠</div>
        </div>
        <div class="status-card">
          <div class="status-card-icon"><i class="fa-solid fa-weight-scale"></i></div>
          <div class="status-card-value">9.2kg</div>
          <div class="status-card-label">体重</div>
        </div>
      </div>
    </header>
    
    <main>
      <div class="quick-actions" id="quick-actions">
        <div class="action-item" onclick="navigateTo('pages/record.html#feed')">
          <div class="action-item-icon feed"><i class="fa-solid fa-bottle-water"></i></div>
          <div class="action-item-label">喂奶</div>
        </div>
        <div class="action-item" onclick="navigateTo('pages/record.html#excretion')">
          <div class="action-item-icon poop"><i class="fa-solid fa-poop"></i></div>
          <div class="action-item-label">排泄</div>
        </div>
        <div class="action-item" onclick="navigateTo('pages/record.html#sleep')">
          <div class="action-item-icon sleep"><i class="fa-solid fa-bed"></i></div>
          <div class="action-item-label">睡眠</div>
        </div>
        <div class="action-item" onclick="navigateTo('pages/record.html#growth')">
          <div class="action-item-icon growth"><i class="fa-solid fa-ruler-vertical"></i></div>
          <div class="action-item-label">生长</div>
        </div>
        <div class="action-item" onclick="navigateTo('pages/record.html#temp')">
          <div class="action-item-icon temp"><i class="fa-solid fa-temperature-half"></i></div>
          <div class="action-item-label">体温</div>
        </div>
        <div class="action-item" onclick="navigateTo('pages/record.html#medication')">
          <div class="action-item-icon medication"><i class="fa-solid fa-pills"></i></div>
          <div class="action-item-label">用药</div>
        </div>
        <div class="action-item" onclick="navigateTo('pages/record.html#milestone')">
          <div class="action-item-icon milestone"><i class="fa-solid fa-trophy"></i></div>
          <div class="action-item-label">里程碑</div>
        </div>
        <div class="action-item" onclick="navigateTo('pages/vaccine.html')">
          <div class="action-item-icon medication"><i class="fa-solid fa-syringe"></i></div>
          <div class="action-item-label">疫苗</div>
        </div>
        <div class="action-item quick-more" onclick="navigateTo('pages/poop.html')">
          <div class="action-item-icon poop"><i class="fa-solid fa-camera"></i></div>
          <div class="action-item-label">识便</div>
        </div>
        <div class="action-item quick-more" onclick="navigateTo('pages/family.html')">
          <div class="action-item-icon photo"><i class="fa-solid fa-people-roof"></i></div>
          <div class="action-item-label">家庭</div>
        </div>
        <div class="action-item quick-more" onclick="navigateTo('pages/report.html')">
          <div class="action-item-icon growth"><i class="fa-solid fa-file-medical"></i></div>
          <div class="action-item-label">报告</div>
        </div>
        <div class="action-item quick-more" onclick="navigateTo('pages/analysis.html')">
          <div class="action-item-icon milestone"><i class="fa-solid fa-chart-line"></i></div>
          <div class="action-item-label">分析</div>
        </div>
      </div>
      <div class="quick-toggle" onclick="toggleQuickActions()">
        <span id="quick-toggle-text">展开更多</span>
        <span id="quick-toggle-arrow"><i class="fa-solid fa-chevron-down"></i></span>
      </div>
      
      <div class="reminder-section">
        <div class="section-title"><i class="fa-solid fa-bell" style="font-size:14px;"></i> 今日提醒</div>
        <div class="reminder-list" id="reminder-list"></div>
      </div>
      
      <div class="recent-activity">
        <div class="section-title"><i class="fa-solid fa-clock-rotate-left" style="font-size:14px;"></i> 家庭动态</div>
        <div class="activity-list" id="activity-list"></div>
      </div>
    </main>
    
    <button class="voice-btn" id="voice-btn"><i class="fa-solid fa-microphone"></i></button>
    
    <nav class="nav-bar">
      <div class="nav-item active">
        <div class="nav-item-icon"><i class="fa-solid fa-house"></i></div>
        <div class="nav-item-label">首页</div>
      </div>
      <div class="nav-item" data-page="pages/record.html">
        <div class="nav-item-icon"><i class="fa-solid fa-pen-to-square"></i></div>
        <div class="nav-item-label">记录</div>
      </div>
      <div class="nav-item" data-page="pages/community.html">
        <div class="nav-item-icon"><i class="fa-solid fa-comments"></i></div>
        <div class="nav-item-label">社区</div>
      </div>
      <div class="nav-item" data-page="pages/mom.html">
        <div class="nav-item-icon"><i class="fa-solid fa-user"></i></div>
        <div class="nav-item-label">我的</div>
      </div>
    </nav>
  </div>
  
  <div class="modal-overlay" id="voice-modal" style="display: none;">
    <div class="modal-content">
      <button class="close-btn" id="close-voice-modal"><i class="fa-solid fa-xmark"></i></button>
      <div class="modal-title"><i class="fa-solid fa-microphone"></i> 语音助手</div>
      <div style="text-align: center; padding: 20px;">
        <div id="voice-result" style="font-size: 16px; color: #666;">正在听...</div>
        <div style="margin-top: 20px; font-size: 12px; color: #999;">
          试试说："记录母乳左侧15分钟"<br>
          "宝宝拉了，黄色稀便"<br>
          "开始哄睡"
        </div>
      </div>
    </div>
  </div>
  
  <div class="modal-overlay" id="more-menu" style="display: none;">
    <div class="modal-content">
      <button class="close-btn" onclick="toggleMoreMenu()"><i class="fa-solid fa-xmark"></i></button>
      <div class="modal-title">更多功能</div>
      <div style="margin-top: 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;">
        <div class="action-item" onclick="navigateTo('pages/family.html'); toggleMoreMenu()">
          <div class="action-item-icon photo" style="width: 50px; height: 50px; margin: 0 auto 10px;"><i class="fa-solid fa-people-roof"></i></div>
          <div class="action-item-label">家庭组</div>
        </div>
        <div class="action-item" onclick="navigateTo('pages/vaccine.html'); toggleMoreMenu()">
          <div class="action-item-icon medication" style="width: 50px; height: 50px; margin: 0 auto 10px;"><i class="fa-solid fa-syringe"></i></div>
          <div class="action-item-label">疫苗计划</div>
        </div>
        <div class="action-item" onclick="navigateTo('pages/mom.html'); toggleMoreMenu()">
          <div class="action-item-icon feed" style="width: 50px; height: 50px; margin: 0 auto 10px;"><i class="fa-solid fa-user"></i></div>
          <div class="action-item-label">我的</div>
        </div>
        <div class="action-item" onclick="navigateTo('pages/poop.html'); toggleMoreMenu()">
          <div class="action-item-icon poop" style="width: 50px; height: 50px; margin: 0 auto 10px;"><i class="fa-solid fa-poop"></i></div>
          <div class="action-item-label">大便识别</div>
        </div>
        <div class="action-item" onclick="navigateTo('pages/report.html'); toggleMoreMenu()">
          <div class="action-item-icon growth" style="width: 50px; height: 50px; margin: 0 auto 10px;"><i class="fa-solid fa-file-medical"></i></div>
          <div class="action-item-label">儿保报告</div>
        </div>
      </div>
    </div>
  </div>
  
  <script src="data/mock.js"></script>
  <script src="script.js"></script>
</body>
</html>
