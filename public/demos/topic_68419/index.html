<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 - 智途AI</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh;
  background: linear-gradient(135deg, #eaf3ff 0%, #f5f9ff 50%, #ffffff 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  position: relative; overflow: hidden;
}
body::before {
  content: ''; position: absolute; top: -200px; right: -200px;
  width: 500px; height: 500px; border-radius: 50%;
  background: radial-gradient(circle, rgba(43,125,233,0.08) 0%, transparent 70%);
}
body::after {
  content: ''; position: absolute; bottom: -150px; left: -150px;
  width: 400px; height: 400px; border-radius: 50%;
  background: radial-gradient(circle, rgba(108,180,238,0.08) 0%, transparent 70%);
}
.register-box {
  background: white; padding: 48px 40px; border-radius: 24px;
  box-shadow: 0 20px 60px rgba(43,125,233,0.12);
  width: 100%; max-width: 420px; position: relative; z-index: 1;
}
.login-logo { text-align: center; margin-bottom: 28px; }
.login-logo-icon {
  width: 56px; height: 56px; border-radius: 14px; margin: 0 auto 10px;
  background: linear-gradient(135deg, #2b7de9, #6cb4ee);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 24px; font-weight: 800;
}
.login-title {
  font-size: 24px; font-weight: 700; color: #1a2a3a;
  background: linear-gradient(135deg, #1a5fcf, #2b7de9);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.login-subtitle { font-size: 13px; color: #7a8fa6; margin-top: 4px; }
.form-group { margin-bottom: 16px; }
.form-group label {
  display: block; margin-bottom: 6px; font-weight: 600;
  color: #3a4a5e; font-size: 13px;
}
.form-group input {
  width: 100%; padding: 11px 14px; border: 2px solid #e8f0fc;
  border-radius: 12px; font-size: 14px; color: #2c3e50;
  background: #f9fbff; transition: all 0.2s;
  font-family: inherit;
}
.form-group input:focus {
  border-color: #2b7de9; background: #fff;
  box-shadow: 0 0 0 4px rgba(43,125,233,0.1); outline: none;
}
.btn-register {
  width: 100%; padding: 13px;
  background: linear-gradient(135deg, #2b7de9, #4a9af5);
  color: white; border: none; border-radius: 12px;
  font-size: 15px; font-weight: 600; cursor: pointer;
  transition: all 0.2s; font-family: inherit; margin-top: 8px;
}
.btn-register:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(43,125,233,0.35);
}
.btn-register:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
.toggle-link { text-align: center; margin-top: 20px; color: #7a8fa6; font-size: 14px; }
.toggle-link a { color: #2b7de9; text-decoration: none; font-weight: 600; }
.toggle-link a:hover { text-decoration: underline; }
.error-msg {
  background: #fff0f0; color: #e74c3c; padding: 10px 14px;
  border-radius: 10px; font-size: 13px; margin-bottom: 14px;
  border-left: 3px solid #e74c3c; display: none;
}
.error-msg.show { display: block; }
.success-msg {
  background: #f0fff4; color: #34c78e; padding: 10px 14px;
  border-radius: 10px; font-size: 13px; margin-bottom: 14px;
  border-left: 3px solid #34c78e; display: none;
}
.success-msg.show { display: block; }
</style>
</head>
<body>
<div class="register-box">
  <div class="login-logo">
    <div class="login-logo-icon">智</div>
    <div class="login-title">创建账号</div>
    <div class="login-subtitle">开启你的AI高效学习之旅</div>
  </div>

  <div class="error-msg" id="errorMsg"></div>
  <div class="success-msg" id="successMsg"></div>

  <form id="registerForm">
    <div class="form-group">
      <label>用户名</label>
      <input type="text" id="username" placeholder="请输入用户名（2-20字符）" required minlength="2" maxlength="20">
    </div>
    <div class="form-group">
      <label>邮箱</label>
      <input type="email" id="email" placeholder="请输入邮箱地址" required>
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="password" placeholder="请设置密码（至少6位）" required minlength="6">
    </div>
    <button type="submit" class="btn-register" id="registerBtn">注 册</button>
  </form>

  <div class="toggle-link">
    已有账号？<a href="login.html">返回登录</a>
  </div>
</div>

<script>
const API_BASE_URL = 'http://182.254.138.71/api';

document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value;
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const btn = document.getElementById('registerBtn');
  const errorMsg = document.getElementById('errorMsg');
  const successMsg = document.getElementById('successMsg');

  btn.disabled = true;
  btn.textContent = '注册中...';
  errorMsg.classList.remove('show');
  successMsg.classList.remove('show');

  try {
    const response = await fetch(`${API_BASE_URL}/auth/register`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, email, password })
    });

    const result = await response.json();
    if (result.success) {
      successMsg.textContent = '注册成功！即将跳转登录页...';
      successMsg.classList.add('show');
      setTimeout(() => { window.location.href = 'login.html'; }, 1500);
    } else {
      errorMsg.textContent = result.message || '注册失败，请重试';
      if (result.errors) {
        errorMsg.textContent = result.errors.map(e => e.msg).join('；');
      }
      errorMsg.classList.add('show');
    }
  } catch (err) {
    errorMsg.textContent = '无法连接到服务器，请确保后端服务已启动';
    errorMsg.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = '注 册';
  }
});
</script>
</body>
</html>
