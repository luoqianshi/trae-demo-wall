<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>拾光 · 每日生活小助手</title>
<style>
:root{--bg:#FAFAF8;--bg2:#F5F3EF;--ink:#2C2A28;--muted:#6B6864;--rule:#E0DCD6;--accent:#B87333;--accent2:#6B8E6B;--accent-rgb:184,115,51;--radius:12px;--shadow:0 1px 4px rgba(0,0,0,.06);--shadow-lg:0 4px 24px rgba(0,0,0,.1);--transition:.3s cubic-bezier(.4,0,.2,1)}
*,::before,::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:14px;line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit;font-size:inherit}
.app{max-width:420px;margin:0 auto;background:#fff;min-height:100vh;position:relative;overflow:hidden;box-shadow:0 0 30px rgba(0,0,0,.08)}
.page-scroll{padding:16px 16px 96px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page-scroll::-webkit-scrollbar{display:none}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-top:1px solid var(--rule);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0));z-index:100}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;cursor:pointer;transition:all var(--transition);position:relative}
.tab-item:active{transform:scale(.92)}
.tab-icon{font-size:20px}
.tab-item.active .tab-icon{transform:scale(1.15)}
.tab-label{font-size:10px;color:var(--muted);font-weight:500}
.tab-item.active .tab-label{color:var(--accent);font-weight:600}
.card{background:#fff;border-radius:var(--radius);padding:16px;margin-bottom:12px;border:1px solid var(--rule)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:24px;padding:12px 28px;font-size:15px;font-weight:500;cursor:pointer;transition:all var(--transition)}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(var(--accent-rgb),.35)}
.btn-secondary{background:var(--bg2);color:var(--ink);border:1px solid var(--rule)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:500}
.tag-happy{background:#FEF3E2;color:#B87333}
.tag-calm{background:#ECF7EC;color:#6B8E6B}
.tag-sad{background:#E8EFF6;color:#5A7A96}
.tag-excited{background:#FDE8DE;color:#C85A3E}
.tag-grateful{background:#F2F7E8;color:#6B8E6B}
.tag-anxious{background:#F3ECF3;color:#8A6A8A}
.tag-tired{background:#EDEDED;color:#6A6A6A}
.tag-moved{background:#F7EDE6;color:#B87050}
.section-title{font-size:15px;font-weight:600;color:var(--ink);margin:16px 0 10px}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty-icon{font-size:48px;margin-bottom:12px;opacity:.5}
.loading{text-align:center;padding:40px;color:var(--muted)}
.spinner{display:inline-block;width:24px;height:24px;border:3px solid var(--bg2);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.input{width:100%;background:var(--bg2);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--ink);outline:none;resize:none}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;visibility:hidden;transition:all .25s}
.modal-overlay.show{opacity:1;visibility:visible}
.modal-box{background:#fff;border-radius:16px;padding:28px 24px 20px;width:85%;max-width:340px;transform:scale(.9) translateY(20px);transition:transform .3s}
.modal-overlay.show .modal-box{transform:scale(1) translateY(0)}
.modal-title{font-size:17px;font-weight:600;margin-bottom:10px}
.modal-body{font-size:14px;color:var(--muted);margin-bottom:20px;line-height:1.6}
.modal-actions{display:flex;gap:10px}
.modal-actions .btn{flex:1;padding:11px 0}
.memory-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:500;opacity:0;visibility:hidden;transition:all .3s;padding:20px}
.memory-overlay.show{opacity:1;visibility:visible}
.memory-close{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;backdrop-filter:blur(10px)}
.memory-card{width:100%;max-width:340px;aspect-ratio:9/16;border-radius:24px;overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.4);transform:scale(.9) translateY(20px);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.memory-overlay.show .memory-card{transform:scale(1) translateY(0)}
.memory-card-bg{position:absolute;inset:0;background:linear-gradient(160deg,#8B5E3C 0%,#B87333 30%,#D4A574 60%,#E8C99B 100%);pointer-events:none}
.memory-card-bg::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 30% 20%,rgba(255,235,200,.3) 0%,transparent 50%),radial-gradient(circle at 70% 80%,rgba(200,150,100,.3) 0%,transparent 50%)}
.memory-card-content{position:relative;height:100%;display:flex;flex-direction:column;padding:36px 28px 28px;color:#fff;box-sizing:border-box}
.memory-card-top{text-align:center;margin-bottom:24px}
.memory-card-subtitle{font-size:11px;opacity:.8;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.memory-card-title{font-size:22px;font-weight:700;line-height:1.3}
.memory-card-divider{width:40px;height:2px;background:rgba(255,255,255,.6);margin:0 auto;border-radius:1px}
.memory-card-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px}
.memory-stat-row{display:flex;justify-content:space-around;text-align:center}
.memory-stat-item{flex:1}
.memory-stat-num{font-size:28px;font-weight:700;line-height:1;text-shadow:0 2px 8px rgba(0,0,0,.2)}
.memory-stat-label{font-size:11px;opacity:.85;margin-top:6px}
.memory-mood-wrap{background:rgba(255,255,255,.15);border-radius:16px;padding:16px;backdrop-filter:blur(10px);text-align:center}
.memory-mood-emoji{font-size:40px;margin-bottom:8px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.2))}
.memory-mood-label{font-size:13px;opacity:.9;margin-bottom:4px}
.memory-mood-desc{font-size:11px;opacity:.75;line-height:1.5}
.memory-quote{text-align:center;padding:8px 0}
.memory-quote-text{font-size:13px;line-height:1.7;opacity:.95;font-style:italic}
.memory-quote-text::before{content:'"';font-size:24px;opacity:.6;margin-right:4px}
.memory-quote-text::after{content:'"';font-size:24px;opacity:.6;margin-left:4px}
.memory-card-bottom{text-align:center;margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.2)}
.memory-brand{font-size:12px;opacity:.75;font-weight:500}
.memory-brand-sub{font-size:10px;opacity:.6;margin-top:2px}
.memory-actions{display:flex;gap:12px;margin-top:20px;width:100%;max-width:340px}
.memory-action-btn{flex:1;padding:12px 0;border-radius:12px;border:none;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .15s}
.memory-action-btn:active{transform:scale(.96)}
.memory-btn-save{background:#fff;color:var(--accent)}
.memory-btn-share{background:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(10px)}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);background:rgba(0,0,0,.78);color:#fff;padding:16px 28px;border-radius:12px;font-size:14px;z-index:600;opacity:0;visibility:hidden;transition:all .25s;text-align:center}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}
.greeting{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;padding-top:4px}
.greeting-date{font-size:13px;color:var(--muted);margin-top:2px}
.greeting-weather{text-align:center}
.weather-emoji{font-size:36px;display:block}
.weather-label{font-size:10px;color:var(--muted);margin-top:2px}
.streak-card{background:linear-gradient(135deg,#FAF6F0,#F5EFE8);text-align:center;padding:20px 16px;border-color:#e8e0d8}
.streak-num{font-size:32px;font-weight:700;color:var(--accent);line-height:1}
.streak-unit{font-size:13px;color:var(--muted);margin-left:4px}
.streak-label{font-size:11px;color:var(--muted);margin-top:4px}
.record-card{cursor:pointer;position:relative}
.record-content{font-size:14px;line-height:1.7;margin-bottom:10px;word-break:break-word}
.record-thumbs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.record-thumb{width:64px;height:64px;border-radius:8px;object-fit:cover;background:var(--bg2)}
.record-audio{width:100%;flex:1 0 100%}
.record-audio .audio-preview-player{padding:8px 10px}
.record-footer{display:flex;justify-content:space-between;align-items:center}
.record-time{font-size:11px;color:var(--muted)}
.fab{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom,0));left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:14px 32px;border-radius:28px;font-size:16px;font-weight:500;border:none;box-shadow:0 4px 20px rgba(var(--accent-rgb),.4);z-index:50;cursor:pointer;display:flex;align-items:center;gap:6px}
.fab:active{transform:translateX(-50%) scale(.95)}
.editor-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-top:4px}
.editor-back{width:36px;height:36px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px}
.editor-title{font-size:17px;font-weight:600;flex:1}
.editor-textarea{width:100%;min-height:140px;padding:16px;background:var(--bg2);border:1px solid var(--rule);border-radius:12px;font-size:15px;line-height:1.8;color:var(--ink);outline:none;resize:none}
.mood-picker{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.mood-chip{display:flex;flex-direction:column;align-items:center;padding:12px 6px;border-radius:12px;background:var(--bg2);border:2px solid transparent;cursor:pointer}
.mood-chip.active{background:rgba(var(--accent-rgb),.1);border-color:var(--accent)}
.mood-chip-emoji{font-size:24px;margin-bottom:2px}
.mood-chip-label{font-size:11px;color:var(--muted)}
.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.media-item{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--bg2)}
.media-item img{width:100%;height:100%;object-fit:cover}
.media-remove{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;border:none}
.media-add{aspect-ratio:1;border:2px dashed var(--rule);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--muted)}
.media-add-icon{font-size:28px}
.media-add-text{font-size:10px;margin-top:4px}
.save-bar{position:fixed;bottom:calc(72px + env(safe-area-inset-bottom,0));left:50%;transform:translateX(-50%);width:100%;max-width:420px;padding:0 16px;z-index:50}
.save-bar .btn{width:100%}
.editor-input-section{background:#fff;border-radius:12px;padding:8px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.editor-input-row{display:flex;align-items:flex-end;gap:8px}
.editor-voice-btn{width:40px;height:40px;border:none;background:transparent;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#666;transition:all .2s}
.editor-voice-btn:active{opacity:.6;transform:scale(.95)}
.editor-voice-btn.recording{color:#E53935}
.editor-textarea{flex:1;min-height:80px;border:none;background:transparent;padding:8px;font-size:14px;line-height:1.5;resize:none;outline:none}
.editor-img-btn{width:40px;height:40px;border:none;background:transparent;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#666;transition:all .2s}
.editor-img-btn:active{opacity:.6;transform:scale(.95)}
.editor-media-section{background:#fff;border-radius:12px;padding:12px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.media-upload-list{display:flex;flex-wrap:wrap;gap:10px}
.media-upload-item{position:relative;width:70px;height:70px;border-radius:8px;overflow:hidden}
.media-upload-item.audio-item{width:100%;height:auto;overflow:visible;border-radius:8px;padding:0;background:transparent}
.media-upload-thumb{width:100%;height:100%;object-fit:cover}
.media-upload-name{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.5);color:#fff;font-size:11px;padding:2px 4px;text-align:center}
.media-upload-remove{position:absolute;top:-10px;right:-10px;width:24px;height:24px;border-radius:50%;background:#E53935;color:#fff;border:none;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10}
.media-upload-add{width:70px;height:70px;border-radius:8px;border:2px dashed #D9D9D9;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#999;cursor:pointer;transition:all .2s}
.media-upload-add:hover{border-color:#B87333;color:#B87333}
.media-upload-add span:first-child{font-size:24px;margin-bottom:4px}
.media-upload-add span:last-child{font-size:11px}
.audio-preview-player{display:flex;align-items:center;gap:10px;padding:10px;background:#F5F5F5;border-radius:8px;width:100%}
.audio-play-btn{width:32px;height:32px;border-radius:50%;background:#fff;border:1px solid #D9D9D9;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#666;transition:all .2s;flex-shrink:0}
.audio-play-btn.playing{background:#B87333;color:#fff;border-color:#B87333}
.audio-preview-wave{display:flex;align-items:center;gap:3px;height:28px;flex-shrink:0}
.audio-bar{width:3px;background:#ccc;border-radius:2px;animation:audioWave 1s ease-in-out infinite}
.audio-bar:nth-child(1){height:10px}
.audio-bar:nth-child(2){height:18px}
.audio-bar:nth-child(3){height:24px}
.audio-bar:nth-child(4){height:18px}
.audio-bar:nth-child(5){height:10px}
.audio-preview-player.playing .audio-bar{background:#B87333}
.audio-progress{flex:1;height:4px;background:#E0E0E0;border-radius:2px;overflow:hidden}
.audio-progress-bar{height:100%;background:#B87333;border-radius:2px;width:0;transition:width .3s}
.audio-preview-time{font-size:12px;color:#999;flex-shrink:0;min-width:70px;text-align:right}
@keyframes audioWave{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.5)}}@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
.editor-save-bar{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0));position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;background:#fff;border-top:1px solid #E1E1E1;z-index:50;box-sizing:border-box}
.editor-save-bar .btn{width:100%;padding:12px;font-size:16px;border-radius:12px}
.chat-input-area{position:fixed;bottom:0;left:0;width:100%;max-width:420px;margin:0 auto;background:#F5F5F5;padding:8px 16px 20px;display:flex;align-items:flex-end;gap:10px;z-index:50;border-top:1px solid #E1E1E1}
.chat-input-row{flex:1;display:flex;align-items:flex-end;gap:8px}
.chat-input-wrap{flex:1;display:flex;align-items:flex-end;background:#fff;border:1px solid #D9D9D9;border-radius:20px;padding:4px}
.chat-input{flex:1;border:none;background:transparent;padding:8px 10px;font-size:14px;outline:none;resize:none;min-height:28px;max-height:100px;line-height:1.4}
.chat-input:focus{outline:none}
.chat-actions{display:flex;gap:12px}
.chat-action-btn{width:40px;height:40px;border:none;background:transparent;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#666;transition:all .2s}
.chat-action-btn:active{opacity:.6}
.chat-action-btn.recording{color:#E53935}
.chat-send-btn{padding:8px 20px;border:none;background:var(--accent);color:#fff;border-radius:20px;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s}
.chat-send-btn:disabled{opacity:.5;cursor:not-allowed}
.chat-media-preview{position:fixed;bottom:60px;left:0;width:100%;max-width:420px;margin:0 auto;padding:8px 16px;background:#F5F5F5;z-index:49}
.chat-media-list{display:flex;flex-wrap:wrap;gap:8px}
.chat-media-item{position:relative;width:60px;height:60px;border-radius:6px;flex-shrink:0}
.chat-media-item img{width:100%;height:100%;object-fit:cover;border-radius:6px}
.chat-media-item-audio{width:100%;height:100%;background:#F0F0F0;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#666}
.chat-media-remove{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:none;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.recording-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center}
.recording-overlay .recording-icon{width:80px;height:80px;border-radius:50%;background:#E53935;display:flex;align-items:center;justify-content:center;font-size:40px;margin-bottom:20px;animation:pulse 1s infinite}
.recording-overlay .recording-text{color:#fff;font-size:18px;margin-bottom:10px}
.recording-overlay .recording-time{color:rgba(255,255,255,.8);font-size:14px}
.recording-overlay .recording-cancel{color:#FFB7B7;font-size:14px;margin-top:20px}
.voice-hold-btn{flex:1;padding:12px;text-align:center;background:#fff;border:none;font-size:14px;color:#666;border-radius:20px;cursor:pointer;user-select:none}
.voice-hold-btn:active{background:#E8F0FE;color:#1677FF}
.view-header{text-align:center;padding:24px 16px}
.view-emoji{font-size:40px;margin-bottom:8px;display:block}
.view-mood{font-size:18px;font-weight:600;margin-bottom:4px}
.view-time{font-size:12px;color:var(--muted)}
.view-location{font-size:12px;color:var(--muted);margin-top:6px}
.view-content{padding:16px;font-size:15px;line-height:1.9;white-space:pre-wrap}
.view-actions{display:flex;gap:10px;position:fixed;bottom:calc(72px + env(safe-area-inset-bottom,0));left:50%;transform:translateX(-50%);width:100%;max-width:420px;padding:0 16px;z-index:50}
.view-actions .btn{flex:1}
.tl-page{padding-bottom:20px}
.tl-header{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--rule);padding-bottom:8px;box-shadow:0 2px 8px rgba(0,0,0,.04);margin:-16px -16px 12px;padding-left:16px;padding-right:16px}
.tl-content{padding:0}
.tl-filter{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
.tl-filter::-webkit-scrollbar{display:none}
.tl-filter-chip{padding:6px 14px;border-radius:16px;font-size:12px;white-space:nowrap;cursor:pointer;background:var(--bg2);border:1px solid transparent;flex-shrink:0}
.tl-filter-chip.active{background:var(--accent);color:#fff}
.tl-date-selector{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none;background:#fff;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.08);border:1px solid var(--rule);margin:8px 0}
.tl-date-selector::-webkit-scrollbar{display:none}
.tl-date-btn{padding:8px 14px;border-radius:10px;font-size:12px;white-space:nowrap;cursor:pointer;background:var(--bg2);color:var(--muted);border:1px solid transparent;flex-shrink:0;transition:all .2s}
.tl-date-btn.active{background:var(--accent);color:#fff}
.tl-date-btn.has-record::after{content:'';display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--accent2);margin-left:4px}
.tl-date-btn.active.has-record::after{background:#fff}
.tl-date-header{padding:12px 16px;background:var(--bg2);border-radius:10px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
.tl-date-header::after{content:'▼';font-size:10px;color:var(--muted);transition:transform .2s}
.tl-date-header.open::after{transform:rotate(180deg)}
.tl-calendar{background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.08);border:1px solid var(--rule);margin-bottom:12px;overflow:hidden}
.tl-cal-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--rule)}
.tl-cal-nav{width:32px;height:32px;border-radius:50%;border:none;background:var(--bg2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}

<script>
const S={tab:'home',loggedIn:true,records:[],streak:0,allRecords:[],capsuleData:null,profileData:null,settingsData:null,moodChart:[],summary:{},weather:null};
const OPEN_ID='web-preview-user';
const MOOD_MAP={tired:{emoji:'😴',label:'疲惫',color:'#9A9A9A',score:1},anxious:{emoji:'😰',label:'焦虑',color:'#8A6A8A',score:2},sad:{emoji:'😢',label:'难过',color:'#5A7A96',score:3},calm:{emoji:'😌',label:'平静',color:'#7EC8E3',score:4},moved:{emoji:'🥺',label:'感动',color:'#E8A87C',score:4},happy:{emoji:'😊',label:'开心',color:'#F5C563',score:5},excited:{emoji:'🤩',label:'兴奋',color:'#C85A3E',score:5},grateful:{emoji:'🙏',label:'感恩',color:'#B8D8BA',score:5}};
const MOODS=Object.entries(MOOD_MAP).map(([k,v])=>({key:k,...v}));
const WEEKS=['周日','周一','周二','周三','周四','周五','周六'];
const MONTHS=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

// ========== 工具函数（必须先定义） ==========
function $(id){return document.getElementById(id)}
function pad(n){return n<10?'0'+n:''+n}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function fmtTime(t){if(!t)return'';const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())}
function fmtDate(s){if(!s)return'';const d=new Date(s);return d.getFullYear()+'年'+MONTHS[d.getMonth()]+d.getDate()+'日 '+WEEKS[d.getDay()]}

// 本地日期格式化（使用本地时间，解决UTC时区差问题）
function _localDateStr(d){
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function _localDateTimeStr(d){
  return _localDateStr(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
}
function todayStr(){return _localDateStr(new Date())}

// ========== 本地Mock数据库（完全离线独立运行，使用localStorage持久化） ==========
// v5: 增加图文+语音、纯语音记录
const STORAGE_KEY='shiguang_demo_data_v6';
let _mockNextId=200;

// 演示图片（使用picsum.photos随机图片）
const _demoImages=[
  'https://picsum.photos/seed/sunset1/400/400',
  'https://picsum.photos/seed/coffee1/400/400',
  'https://picsum.photos/seed/flower1/400/400',
  'https://picsum.photos/seed/cat1/400/400',
  'https://picsum.photos/seed/food1/400/400',
  'https://picsum.photos/seed/book1/400/400',
];

function _loadDB(){
  try{const s=localStorage.getItem(STORAGE_KEY);if(s)return JSON.parse(s)}catch(e){console.warn('读取存储失败',e)}
  // 首次访问 - 生成丰富的预置演示数据（包含图片、语音、位置）
  const now=new Date();
  function makeDate(daysAgo,hour,minute){
    const d=new Date(now);
    d.setDate(d.getDate()-daysAgo);
    d.setHours(hour,minute||Math.floor(Math.random()*60),0,0);
    return d;
  }
  const samples=[
    // 今天（daysAgo=0）- 7条记录，包含图片、语音、图文+语音组合
    {content:'记录身边事，留住眼前人',mood:'moved',days:0,hour:21,media:[],location:'江西南昌'},
    {content:'收到了很久没联系的老朋友的消息，她说要来我的城市出差，约了下周见面。期待！',mood:'excited',days:0,hour:11,media:[],location:''},
    {content:'午餐吃了一家新开的日料，三文鱼特别新鲜，主厨还送了我们一份手卷。环境也很不错，拍了几张照片。',mood:'happy',days:0,hour:13,media:[{type:'image',url:_demoImages[4]},{type:'audio',url:'',duration:'0:15'}],location:'公司附近'},
    {content:'早上出门忘带伞，半路突然下了小雨，有点狼狈。不过到公司后喝了杯热咖啡，慢慢缓过来了。',mood:'calm',days:0,hour:9,media:[],location:'地铁站'},
    {content:'下午开了个长会，讨论了很久还是没达成结论，有点累。',mood:'tired',days:0,hour:16,media:[],location:''},
    {content:'今天写的代码一次跑通了！bug全修完，这种感觉太爽了！',mood:'excited',days:0,hour:20,media:[],location:''},
    {content:'今天天气很好，下班路上看到了很漂亮的晚霞，橙红色的天空像被打翻的颜料盘。停下来拍了好几张照片，还录了一段语音记录此刻的心情。',mood:'happy',days:0,hour:18,media:[{type:'image',url:_demoImages[0]},{type:'audio',url:'',duration:'0:28'}],location:'下班路上'},
    {content:'散步路过花店，看到向日葵开得特别好，买了一束带回家，还给花录了个小视频语音讲解～',mood:'grateful',days:0,hour:19,media:[{type:'image',url:_demoImages[2]},{type:'audio',url:'',duration:'0:22'}],location:'街边花店'},
    // 昨天 - 3条记录
    {content:'和朋友去了新开的咖啡店，拿铁拉花很好看，店主是个很温柔的姐姐。聊了一下午，感觉整个人都放松下来了。',mood:'calm',days:1,hour:15,media:[{type:'image',url:_demoImages[1]}],location:'街角咖啡店'},
    {content:'晚上录了一段语音日记，今天想对自己说：你已经做得很好了，慢慢来。',mood:'calm',days:1,hour:22,media:[{type:'audio',url:'',duration:'0:32'}],location:''},
    {content:'今天天气有点阴，但工作效率出奇地高，完成了这周的大部分任务。',mood:'calm',days:1,hour:18,media:[],location:''},
    // 前天 - 2条记录
    {content:'项目终于上线了！虽然加了一周班，但看到用户反馈的那一刻觉得一切都值了。晚上和团队一起吃了庆功宴，开心！',mood:'excited',days:2,hour:20,media:[],location:''},
    {content:'路边遇到一只超可爱的橘猫，蹲下来撸了五分钟，它居然在我脚边翻肚皮了～',mood:'happy',days:2,hour:19,media:[{type:'image',url:_demoImages[3]}],location:'小区门口'},
    // 3天前
    {content:'读到一句很喜欢的话："生活不是等待暴风雨过去，而是学会在雨中跳舞。" 记下来勉励自己。',mood:'grateful',days:3,hour:22,media:[{type:'image',url:_demoImages[5]}],location:''},
    // 4天前
    {content:'今天有点累，开了三个会，脑子转不动了。晚上早点休息，明天又是新的一天。',mood:'tired',days:4,hour:21,media:[],location:''},
    {content:'录了一段语音吐槽今天的工作，说完感觉好多了。',mood:'tired',days:4,hour:22,media:[{type:'audio',url:'',duration:'1:08'}],location:''},
    // 5天前
    {content:'周末在家整理房间，翻出了很多旧照片和信件，想起了很多以前的事情。时间过得真快啊。',mood:'moved',days:5,hour:16,media:[],location:''},
    {content:'买了一束向日葵插在花瓶里，整个房间都明亮起来了。',mood:'happy',days:5,hour:14,media:[{type:'image',url:_demoImages[2]}],location:'花店'},
    // 6天前
    {content:'早起去公园跑步，空气很清新，看到很多晨练的老人，还有可爱的小狗。新的一周，元气满满！',mood:'happy',days:6,hour:7,media:[],location:'城市公园'},
    // 7天前
    {content:'最近工作压力有点大，晚上有点焦虑睡不着。听了一会儿白噪音，慢慢平静下来了。',mood:'anxious',days:7,hour:23,media:[{type:'audio',url:'',duration:'1:15'}],location:''},
    // 8天前
    {content:'看了一部很感人的电影，讲的是亲情的故事，最后忍不住哭了。珍惜当下，多陪陪家人。',mood:'moved',days:8,hour:21,media:[],location:''},
  ];
  const records=samples.map((item,idx)=>{
    const d=makeDate(item.days,item.hour);
    return{
      id:idx+1,
      content:item.content,
      mood:item.mood,
      location:item.location||'',
      record_date:_localDateStr(d),
      created_at:_localDateTimeStr(d),
      updated_at:_localDateTimeStr(d),
      media:item.media||[]
    };
  });
  const db={records,nextId:200};
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(db))}catch(e){console.warn('保存失败',e)}
  return db;
}
let _mockDB=_loadDB();

function _saveDB(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(_mockDB))}catch(e){console.warn('保存失败',e)}}

function _calcStreak(){
  const dates=new Set(_mockDB.records.map(r=>r.record_date));
  let streak=0;const d=new Date();
  for(let i=0;i<365;i++){
    const ds=_localDateStr(d);
    if(dates.has(ds)){streak++;d.setDate(d.getDate()-1)}else break;
  }
  return streak;
}

async function api(path,opts={}){
  await new Promise(r=>setTimeout(r,80));
  const method=opts.method||'GET';
  // opts.body 可能是对象（来自直接调用）或JSON字符串（兼容）
  let body=null;
  if(opts.body){
    body=typeof opts.body==='string'?JSON.parse(opts.body):opts.body;
  }
  const records=_mockDB.records;
  
  // GET /records/today
  if(path.startsWith('/records/today')){
    const today=todayStr();
    const todayRecs=records.filter(r=>r.record_date===today).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
    return{code:0,data:{records:todayRecs,streak:_calcStreak()}};
  }
  // GET /weather
  if(path==='/weather'){
    return{code:0,data:{icon:'☀️',temp:26,city:'北京',description:'晴'}};
  }
  // GET /records (列表)
  if((path==='/records'||path.startsWith('/records?'))&&method==='GET'){
    let list=[...records].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
    const url=new URL('http://x'+path);
    const mood=url.searchParams.get('mood');
    const date=url.searchParams.get('date');
    if(mood)list=list.filter(r=>r.mood===mood);
    if(date)list=list.filter(r=>r.record_date===date);
    return{code:0,data:{list,total:list.length}};
  }
  // GET /capsule - 修复日期范围使用本地时间
  if(path.startsWith('/capsule')){
    const days=parseInt(path.split('days=')[1])||7;
    const endDate=new Date(),startDate=new Date();startDate.setDate(endDate.getDate()-days+1);
    const start=_localDateStr(startDate),end=_localDateStr(endDate);
    const filtered=records.filter(r=>r.record_date>=start&&r.record_date<=end).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
    const moodStats={};filtered.forEach(r=>{moodStats[r.mood]=(moodStats[r.mood]||0)+1});
    const totalDays=new Set(filtered.map(r=>r.record_date)).size;
    const moodDistribution=Object.entries(moodStats).map(([k,v])=>({key:k,label:(MOOD_MAP[k]||{}).label||k,count:v,color:(MOOD_MAP[k]||{}).color||'#999',percentage:filtered.length>0?Math.round((v/filtered.length)*100):0})).sort((a,b)=>b.count-a.count);
    return{code:0,data:{days,dateRange:{start,end},totalRecords:filtered.length,totalDays,moodDistribution,records:filtered.slice(0,20)}};
  }
  // GET /auth/profile
  if(path==='/auth/profile')return{code:0,data:{id:1,nickname:'拾光用户',avatar_url:''}};
  // GET /stats/monthly
  if(path.startsWith('/stats/monthly')){
    const monthStats={};
    records.forEach(r=>{const m=r.record_date.substring(0,7);if(!monthStats[m])monthStats[m]={total:0,moods:{}};monthStats[m].total++;monthStats[m].moods[r.mood]=(monthStats[m].moods[r.mood]||0)+1});
    const sortedMonths=Object.keys(monthStats).sort().reverse().slice(0,6);
    const monthlyData=sortedMonths.map(m=>({month:m,total:monthStats[m].total,moods:Object.entries(monthStats[m].moods).map(([k,v])=>({key:k,label:(MOOD_MAP[k]||{}).label||k,count:v,color:(MOOD_MAP[k]||{}).color||'#999'}))}));
    const recordDates=[...new Set(records.map(r=>r.record_date))];
    return{code:0,data:{monthlyData,summary:{totalRecords:records.length,totalDays:recordDates.length,firstDate:recordDates.sort()[0]||null}}};
  }
  // GET /settings
  if(path==='/settings')return{code:0,data:{reminder_time:'21:00',reminder_enabled:1,location_enabled:0}};
  // POST /records (创建) - 修复使用本地时间
  if(path==='/records'&&method==='POST'){
    const d=new Date();
    const rec={id:_mockDB.nextId++,content:body.content||'',mood:body.mood||'happy',location:body.location||'',record_date:_localDateStr(d),created_at:_localDateTimeStr(d),updated_at:_localDateTimeStr(d),media:body.media||[]};
    _mockDB.records.push(rec);_saveDB();return{code:0,data:rec};
  }
  // PUT /records/:id (更新)
  if(path.match(/^\/records\/\d+$/)&&method==='PUT'){
    const id=parseInt(path.split('/').pop());
    const idx=_mockDB.records.findIndex(r=>r.id===id);
    if(idx>=0){Object.assign(_mockDB.records[idx],body,{updated_at:_localDateTimeStr(new Date())});_saveDB();return{code:0,data:_mockDB.records[idx]}};
    return{code:404,message:'not found'};
  }
  // DELETE /records/:id
  if(path.match(/^\/records\/\d+$/)&&method==='DELETE'){
    const id=parseInt(path.split('/').pop());
    _mockDB.records=_mockDB.records.filter(r=>r.id!==id);_saveDB();return{code:0};
  }
  // GET /records/:id (单条)
  if(path.match(/^\/records\/\d+$/)){
    const id=parseInt(path.split('/').pop());
    return{code:0,data:_mockDB.records.find(r=>r.id===id)||null};
  }
  // POST /upload
  if(path==='/upload')return{code:0,data:{url:_demoImages[Math.floor(Math.random()*_demoImages.length)],type:'image'}};
  return{code:404,message:'not found'};
}

// 模拟语音播放（演示用）
let _demoAudioTimers={};
function playDemoAudio(btn,dur,containerId){
  const container=document.getElementById(containerId);
  if(!container)return;
  const player=container;
  const bar=player.querySelector('.audio-progress-bar');
  const timeSpan=player.querySelector('.audio-preview-time');
  const wave=player.querySelector('.audio-preview-wave');
  
  // 解析时长
  const parts=dur.split(':');
  const totalSec=parseInt(parts[0])*60+parseInt(parts[1]);
  
  if(btn.textContent==='⏸'){
    // 暂停
    btn.textContent='▶';
    player.classList.remove('playing');
    btn.classList.remove('playing');
    if(wave)wave.querySelectorAll('.audio-bar').forEach(b=>b.style.animationPlayState='paused');
    if(_demoAudioTimers[containerId]){clearInterval(_demoAudioTimers[containerId]);delete _demoAudioTimers[containerId]}
    return;
  }
  
  // 播放
  btn.textContent='⏸';
  player.classList.add('playing');
  btn.classList.add('playing');
  if(wave)wave.querySelectorAll('.audio-bar').forEach(b=>b.style.animationPlayState='running');
  
  let elapsed=0;
  const step=0.1;
  if(_demoAudioTimers[containerId])clearInterval(_demoAudioTimers[containerId]);
  _demoAudioTimers[containerId]=setInterval(()=>{
    elapsed+=step;
    const pct=Math.min(100,(elapsed/totalSec)*100);
    if(bar)bar.style.width=pct+'%';
    const rem=Math.max(0,totalSec-Math.floor(elapsed));
    if(timeSpan)timeSpan.textContent=Math.floor(rem/60)+':'+pad(rem%60);
    if(elapsed>=totalSec){
      clearInterval(_demoAudioTimers[containerId]);
      delete _demoAudioTimers[containerId];
      btn.textContent='▶';
      player.classList.remove('playing');
      btn.classList.remove('playing');
      if(bar)bar.style.width='0%';
      if(timeSpan)timeSpan.textContent=dur;
      if(wave)wave.querySelectorAll('.audio-bar').forEach(b=>b.style.animationPlayState='paused');
    }
  },step*1000);
}

function addImage(){
  const inp=document.createElement('input');
  inp.type='file';
  inp.accept='image/*,video/*';
  inp.multiple=true;
  inp.onchange=function(e){
    const files=Array.from(e.target.files);
    files.forEach(function(f,i){
      if(editorMedia.length>=9)return;
      const url=URL.createObjectURL(f);
      const type=f.type.startsWith('video')?'video':'image';
      editorMedia.push({url:url,file:f,type:type,id:'local_'+Date.now()+'_'+i});
    });
    renderEditor();
  };
  inp.click();
}

function editRecord(id){

    if(r.code!==0)return;
    const d=r.data;
    editorMood=d.mood||'happy';
    if(d.media){
      d.media.forEach(function(m){
        const media={url:m.url,type:m.type||'image',id:m.id||'media_'+Date.now()};
        if(m.type==='audio'){
          const audio=new Audio(m.url);
          audio.onloadedmetadata=function(){
            const dur=audio.duration;
            const min=Math.floor(dur/60);
            const sec=Math.floor(dur%60);
            media.duration=min+':'+(sec<10?'0':'')+sec;
            renderEditor();
          };
        }
        editorMedia.push(media);
      });
    }
    renderEditor();
    setTimeout(function(){
      if($('edContent')){
        $('edContent').value=d.content||'';
        selectMood(d.mood);
        if($('edLocation'))$('edLocation').value=d.location||'';

async function renderTimeline(p){

async function loadTimeline(append){
  if(append===undefined)append=false;
  if(tlLoading)return;
  tlLoading=true;
  if(!append){tlPage=1;tlHasMore=true}
  let params='?page='+tlPage+'&pageSize=20';
  if(tlFilter)params+='&mood='+tlFilter;
  if(tlDate)params+='&date='+tlDate;
  const r=await api('/records'+params);
  if(r.code===0){
    const list=r.data.list||[];
    list.forEach(function(rec){
      if(rec.media&&typeof rec.media==='string')try{rec.media=JSON.parse(rec.media)}catch(e){rec.media=[]}
    });
    if(append)tlRecords=tlRecords.concat(list);else tlRecords=list;
    tlHasMore=list.length===20;
    tlPage++;
  }
  tlLoading=false;
}

              thumbs+='<div class="audio-bar" style="animation-delay:100ms"></div>';
              thumbs+='<div class="audio-bar" style="animation-delay:200ms"></div>';

function renderCalendar(year,month){
  const firstDay=new Date(year,month,1);
  const lastDay=new Date(year,month+1,0);
  const startDay=firstDay.getDay();
  const daysInMonth=lastDay.getDate();
  const today=new Date();
  const todayDateStr=today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate());
  
  let html='<div class="tl-calendar">';
  html+='<div class="tl-cal-header">';
  html+='<button class="tl-cal-nav" onclick="prevMonth()">‹</button>';
  html+='<div class="tl-cal-title">'+year+'年'+(month+1)+'月</div>';
  html+='<button class="tl-cal-nav" onclick="nextMonth()">›</button>';
  html+='</div>';
  
  html+='<div class="tl-cal-weekdays">';
  ['日','一','二','三','四','五','六'].forEach(function(w){
    html+='<div class="tl-cal-weekday">'+w+'</div>';
  });
  html+='</div>';
  
  html+='<div class="tl-cal-days">';
  for(let i=0;i<startDay;i++){
    html+='<div class="tl-cal-day other-month"></div>';
  }
  
  for(let d=1;d<=daysInMonth;d++){
    const dateStr=year+'-'+pad(month+1)+'-'+pad(d);
    const isToday=dateStr===todayDateStr;
    const isSelected=tlDate===dateStr;
    const hasRecord=tlRecords.some(function(r){return (r.record_date||todayStr())===dateStr});
    
    let classes='tl-cal-day';
    if(isToday)classes+=' today';
    if(isSelected)classes+=' active';
    if(hasRecord)classes+=' has-record';
    
    html+='<div class="'+classes+'" onclick="selectDate(\''+dateStr+'\')">'+d+'</div>';
  }
  
  const remaining=42-(startDay+daysInMonth);
  for(let i=0;i<remaining;i++){
    html+='<div class="tl-cal-day other-month"></div>';
  }
  
  html+='</div></div>';
  return html;
}

function generateMemoryData(d){
  if(!d||!d.totalRecords)return null;
  const daysLabel={7:'近7天',30:'近30天',365:'近一年'}[d.days]||'这段时间';
  const topMood=d.moodDistribution&&d.moodDistribution[0];
  const topRatio=topMood?(topMood.count/d.totalRecords):0;
  const moodKeys=d.moodDistribution?d.moodDistribution.map(function(m){return m.key}):[];
  let moodType;
  if(moodKeys.length>=3&&topRatio<0.4){
    moodType='mixed';
  }else if(topMood){
    const s=MOOD_MAP[topMood.key]?MOOD_MAP[topMood.key].score:3;
    if(s>=5)moodType='happy';
    else if(s>=4)moodType='good';
    else if(s>=3)moodType='calm';
    else if(s>=2)moodType='sad';
    else moodType='down';
  }else{
    moodType='good';
  }
  const quotes=MEMORY_QUOTES[moodType];
  const quote=quotes[Math.floor(Math.random()*quotes.length)];
  const topEmoji=topMood&&MOOD_MAP[topMood.key]?MOOD_MAP[topMood.key].emoji:'😊';
  const topLabel=topMood?topMood.label:'愉悦';
  const avgMood=topMood?MOOD_MAP[topMood.key]?MOOD_MAP[topMood.key].label:'':'';
  return{
    period:daysLabel,
    totalRecords:d.totalRecords,
    totalDays:d.totalDays||0,
    topEmoji:topEmoji,
    topLabel:topLabel,
    topRatio:Math.round(topRatio*100),
    quote:quote,
    moodType:moodType
  };
}

function generateAISummary(moodChart){
  if(!moodChart||moodChart.length===0){
    return{type:'empty',emoji:'🌱',text:'还没有足够的记录来分析你的心情呢，多记录几条试试吧～'};
  }
  let totalScore=0,totalCount=0,moodCounts={};
  moodChart.forEach(function(m){
    if(!m.moods)return;
    m.moods.forEach(function(mm){
      const s=MOOD_MAP[mm.key]?MOOD_MAP[mm.key].score:3;
      totalScore+=s*mm.count;
      totalCount+=mm.count;
      moodCounts[mm.key]=(moodCounts[mm.key]||0)+mm.count;
    });
  });
  if(totalCount===0){
    return{type:'empty',emoji:'🌱',text:'还没有足够的记录来分析你的心情呢，多记录几条试试吧～'};
  }
  const avg=totalScore/totalCount;
  const sortedMoods=Object.entries(moodCounts).sort(function(a,b){return b[1]-a[1]});
  const topMood=sortedMoods[0][0];
  const topRatio=sortedMoods[0][1]/totalCount;
  let type,emoji;
  if(sortedMoods.length>=3&&topRatio<0.4){
    type='mixed';emoji='🌈';
  }else if(avg>=4.3){
    type='happy';emoji='😄';
  }else if(avg>=3.4){
    type='good';emoji='😊';
  }else if(avg>=2.6){
    type='calm';emoji='😌';
  }else if(avg>=1.7){
    type='sad';emoji='😔';
  }else{
    type='down';emoji='😢';
  }
  const templates=AI_TREE_HOLE[type];
  const text=templates[Math.floor(Math.random()*templates.length)];
  const topLabel=MOOD_MAP[topMood]?MOOD_MAP[topMood].label:'';
  let prefix='';
  if(type==='mixed'){
    prefix='这段时间你的心情像彩虹一样丰富，';
  }else{
    prefix='这段时间'+topLabel+'的心情出现得最多，';
  }
  return{type:type,emoji:emoji,text:prefix+text,avg:avg.toFixed(1),topMood:topMood,topLabel:topLabel};
}

function typewriterEffect(el,text,speed){
  if(!el)return;
  el.textContent='';
  let i=0;
  function type(){
    if(i<text.length){
      el.textContent+=text.charAt(i);
      i++;
      setTimeout(type,speed||25);
    }
  }
  type();
}

function renderLineChart(data){
  if(!data||data.length===0)return'<div style="text-align:center;padding:40px;color:var(--muted)">暂无数据</div>';
  const scores=data.map(function(m){
    if(!m.moods||m.moods.length===0)return 3;
    let total=0,cnt=0;
    m.moods.forEach(function(mm){
      const s=MOOD_MAP[mm.key]?MOOD_MAP[mm.key].score:3;
      total+=s*mm.count;
      cnt+=mm.count;
    });
    return cnt>0?(total/cnt):3;
  });
  const labels=data.map(function(m){return m.month?m.month.split('-')[1]+'月':''});
  const minScore=1,maxScore=5;
  const w=360,h=140,padX=30,padY=20;
  const cw=w-padX*2,ch=h-padY*2;
  const points=scores.map(function(s,i){
    const x=padX+(cw/(data.length-1))*i;
    const y=padY+ch-((s-minScore)/(maxScore-minScore))*ch;
    return{x,y,score:s,label:labels[i]};
  });
  let pathD='M '+points[0].x+' '+points[0].y;
  for(let i=1;i<points.length;i++){
    const prev=points[i-1];
    const curr=points[i];
    const cp1x=prev.x+(curr.x-prev.x)*0.4;
    const cp1y=prev.y;
    const cp2x=curr.x-(curr.x-prev.x)*0.4;
    const cp2y=curr.y;
    pathD+=' C '+cp1x+' '+cp1y+', '+cp2x+' '+cp2y+', '+curr.x+' '+curr.y;
  }
  let areaD=pathD+' L '+points[points.length-1].x+' '+h+' L '+points[0].x+' '+h+' Z';
  const accent=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  let grid='';
  for(let i=0;i<=4;i++){
    const y=padY+(ch/4)*i;
    grid+='<line x1="'+padX+'" y1="'+y+'" x2="'+(w-padX)+'" y2="'+y+'" stroke="#E8E4DF" stroke-width="1" stroke-dasharray="4,4"/>';
  }
  let dots='';
  points.forEach(function(p){
    dots+='<circle cx="'+p.x+'" cy="'+p.y+'" r="5" fill="'+accent+'" stroke="#fff" stroke-width="3" style="filter:drop-shadow(0 2px 4px rgba(184,115,51,.4))"/>';
  });
  let xLabels='';
  labels.forEach(function(l,i){
    const x=padX+(cw/(data.length-1))*i;
    xLabels+='<text x="'+x+'" y="'+(h+22)+'" text-anchor="middle" style="font-size:11px;fill:var(--muted);font-weight:500">'+l+'</text>';
  });
  return'<svg viewBox="0 0 '+w+' '+(h+30)+'" style="width:100%;height:auto;display:block">'+
    '<defs><linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="'+accent+'" stop-opacity="0.6"/><stop offset="100%" stop-color="'+accent+'" stop-opacity="0"/></linearGradient></defs>'+
    grid+
    '<path d="'+areaD+'" fill="url(#chartGrad)"/>'+
    '<path d="'+pathD+'" fill="none" stroke="'+accent+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 2px 6px rgba(184,115,51,.3))"/>'+
    dots+
    xLabels+
    '<text x="16" y="'+(padY)+'" text-anchor="end" style="font-size:10px;fill:var(--muted)">😊</text>'+
    '<text x="16" y="'+(padY+ch/2)+'" text-anchor="end" style="font-size:10px;fill:var(--muted)">😌</text>'+
    '<text x="16" y="'+(h-8)+'" text-anchor="end" style="font-size:10px;fill:var(--muted)">😢</text>'+
    '</svg>';
}

function renderDailyMoodChart(records){
  if(!records||records.length<2)return'';
  const sorted=records.slice().sort(function(a,b){return new Date(a.created_at)-new Date(b.created_at)});
  const minScore=1,maxScore=5;
  const w=360,h=160,padX=40,padY=24;
  const cw=w-padX*2,ch=h-padY*2;
  const times=sorted.map(function(r){
    const d=new Date(r.created_at);
    return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
  });
  const scores=sorted.map(function(r){return MOOD_MAP[r.mood]?MOOD_MAP[r.mood].score:3});
  const n=sorted.length;
  const points=sorted.map(function(r,i){
    const x=padX+(n===1?cw/2:cw*(i/(n-1)));
    const s=scores[i];
    const y=padY+ch-((s-minScore)/(maxScore-minScore))*ch;
    return{x,y,score:s,time:times[i],mood:r.mood};
  });
  let pathD='M '+points[0].x+' '+points[0].y;
  for(let i=1;i<points.length;i++){
    const prev=points[i-1];
    const curr=points[i];
    const cp1x=prev.x+(curr.x-prev.x)*0.4;
    const cp1y=prev.y;
    const cp2x=curr.x-(curr.x-prev.x)*0.4;
    const cp2y=curr.y;
    pathD+=' C '+cp1x+' '+cp1y+', '+cp2x+' '+cp2y+', '+curr.x+' '+curr.y;
  }
  const areaD=pathD+' L '+points[points.length-1].x+' '+(h-padY)+' L '+points[0].x+' '+(h-padY)+' Z';
  const accent=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  const moods=[
    {score:5,emoji:'😄',label:'开心'},
    {score:4,emoji:'😊',label:'愉悦'},
    {score:3,emoji:'😌',label:'平静'},
    {score:2,emoji:'😔',label:'低落'},
    {score:1,emoji:'😢',label:'难过'}
  ];
  let yLabels='';
  moods.forEach(function(m){
    const y=padY+ch-((m.score-minScore)/(maxScore-minScore))*ch;
    yLabels+='<text x="'+(padX-6)+'" y="'+(y+4)+'" text-anchor="end" style="font-size:12px">'+m.emoji+'</text>';
  });
  let grid='';
  for(let i=0;i<=4;i++){
    const y=padY+(ch/4)*i;
    grid+='<line x1="'+padX+'" y1="'+y+'" x2="'+(w-padX)+'" y2="'+y+'" stroke="#EDE9E3" stroke-width="1" stroke-dasharray="3,5"/>';
  }
  let dots='';
  points.forEach(function(p){
    const moodInfo=MOOD_MAP[p.mood]||{color:accent};
    dots+='<circle cx="'+p.x+'" cy="'+p.y+'" r="6" fill="'+accent+'" stroke="#fff" stroke-width="2.5" style="filter:drop-shadow(0 2px 6px rgba(184,115,51,.45))"/>';
  });
  let xLabels='';
  const total=points.length;
  const maxLabels=6;
  let showIndices=[];
  if(total<=maxLabels){
    for(let i=0;i<total;i++)showIndices.push(i);
  }else{
    const step=(total-1)/(maxLabels-1);
    for(let i=0;i<maxLabels;i++)showIndices.push(Math.round(i*step));
    if(showIndices[showIndices.length-1]!==total-1)showIndices[showIndices.length-1]=total-1;
  }
  showIndices.forEach(function(idx){
    const p=points[idx];
    xLabels+='<text x="'+p.x+'" y="'+(h+10)+'" text-anchor="middle" style="font-size:10px;fill:var(--muted);font-weight:500">'+p.time+'</text>';
  });
  const avgScore=scores.reduce(function(a,b){return a+b},0)/scores.length;
  const avgEmoji=avgScore>=4.5?'😄':avgScore>=3.5?'😊':avgScore>=2.5?'😌':avgScore>=1.5?'😔':'😢';
  return'<div class="card mood-trend-card">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">'+
    '<div style="font-size:14px;font-weight:600">今日心情趋势</div>'+
    '<div style="display:flex;align-items:center;gap:6px"><span style="font-size:18px">'+avgEmoji+'</span><span style="font-size:11px;color:var(--muted)">平均 '+avgScore.toFixed(1)+'</span></div>'+
    '</div>'+
    '<svg viewBox="0 0 '+w+' '+(h+16)+'" style="width:100%;height:auto;display:block;overflow:visible;padding-left:16px;margin-left:-16px">'+
    '<defs><linearGradient id="dailyGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="'+accent+'" stop-opacity="0.35"/><stop offset="100%" stop-color="'+accent+'" stop-opacity="0"/></linearGradient></defs>'+
    grid+
    '<path d="'+areaD+'" fill="url(#dailyGrad)"/>'+
    '<path d="'+pathD+'" fill="none" stroke="'+accent+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 1px 4px rgba(184,115,51,.25))"/>'+
    dots+
    yLabels+
    xLabels+
    '</svg></div>';

function startVoiceRecording(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    toast('您的浏览器不支持语音录制');
    return;
  }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    audioStream=stream;
    mediaRecorder=new MediaRecorder(stream);
    audioChunks=[];
    mediaRecorder.ondataavailable=function(e){audioChunks.push(e.data)};
    mediaRecorder.onstop=function(){
      if(audioChunks.length>0){
        const blob=new Blob(audioChunks,{type:'audio/webm'});
        const url=URL.createObjectURL(blob);
        if(editorMedia.length>=9){
          toast('最多添加9个媒体');
          audioChunks=[];
          return;
        }
        const audio=new Audio(url);
        audio.onloadedmetadata=function(){
          const duration=audio.duration;
          const m=Math.floor(duration/60);
          const s=Math.floor(duration%60);
          const durationStr=m+':'+(s<10?'0':'')+s;
          editorMedia.push({url:url,type:'audio',id:'local_audio_'+Date.now(),duration:durationStr});
          renderEditor();
          toast('录音已保存');
        };
      }
      if(audioStream){
        audioStream.getTracks().forEach(t=>t.stop());
        audioStream=null;
      }
      hideRecordingOverlay();
      clearInterval(recordingTimer);
      recordingTimer=null;
      isRecording=false;
      const btn=$('voiceBtn');
      if(btn){
        btn.textContent='🎤';
        btn.classList.remove('recording');
      }
    };
    mediaRecorder.start();
    recordingStartTime=Date.now();
    isRecording=true;
    const btn=$('voiceBtn');
    if(btn){
      btn.textContent='⏹';
      btn.classList.add('recording');
    }
    showRecordingOverlay();
    recordingTimer=setInterval(updateRecordingTime,1000);
  }).catch(function(err){
    console.error('录音失败:',err);
    toast('无法访问麦克风');
  });
}

function stopVoiceRecording(){
  if(mediaRecorder&&mediaRecorder.state==='recording'){
    mediaRecorder.stop();
  }
}

function cancelRecording(){
  if(mediaRecorder&&mediaRecorder.state==='recording'){
    mediaRecorder.stop();
    audioChunks=[];
  }
  hideRecordingOverlay();
  clearInterval(recordingTimer);
  recordingTimer=null;
  isRecording=false;
  if(audioStream){
    audioStream.getTracks().forEach(t=>t.stop());
    audioStream=null;
  }
  const btn=$('voiceBtn');
  if(btn){
    btn.textContent='🎤';
    btn.classList.remove('recording');
  }
  toast('录音已取消');
}

fetchToday().then(function(){render()});
</script>
</body>
</html>
