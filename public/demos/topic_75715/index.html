<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orchestra — 多 Agent 工作流编排 · 豆包设计系统</title>
<style>
  /* ============================================================
     Doubao (豆包) Design System Tokens
     - 深色（默认）：豆包深色，纯净无光效
     - 浅色：豆包白蓝，飞书原生体验
     ============================================================ */
  :root, :root[data-theme="dark"]{
    /* 背景 */
    --bg: #0e1115;
    --muted: #161a20;
    --secondary: #22252a;
    --ring: #00266b;
    --input: #333942;

    /* 表面 */
    --surface: var(--muted);
    --surface-2: var(--secondary);
    --surface-strong: #111419;
    --surface-solid: #1a1d23;

    /* 描边 */
    --border: rgba(255,255,255,0.10);
    --border-strong: rgba(255,255,255,0.18);
    --highlight: rgba(255,255,255,0.06);

    /* 文本 */
    --text-1: #eff1f4;
    --text-2: #e5e5e5;
    --text-3: rgba(255,255,255,0.50);

    /* 品牌与语义色 */
    --primary: #0065fd;
    --primary-soft: rgba(0,101,253,0.14);
    --primary-press: #0054cc;
    --primary-foreground: #ffffff;
    --accent-foreground: #bfdbfe;
    --destructive: #ef4444;
    --success: #18D58B;
    --warning: #FF9F0A;
    --danger: #ef4444;
    --cyan: #22d3ee;

    /* 侧边栏 */
    --sidebar: #161a20;
    --sidebar-border: #22252a;
    --sidebar-foreground: #eff1f4;

    /* 卡片 */
    --card: #161a20;
    --card-foreground: #eff1f4;

    /* 节点类型色（微调柔化） */
    --accent-agent: #3b82f6;
    --accent-convergence: #7c5cfc;
    --accent-condition: #fbbf24;
    --accent-humanReview: #22d3ee;
    --accent-deliver: #f87171;

    /* 节点实色 */
    --node-bg: #161a20;
    --node-title: #eff1f4;
    --node-sub: rgba(255,255,255,0.45);
    --node-port: rgba(255,255,255,0.5);

    /* 连线 */
    --edge: rgba(255,255,255,0.22);
    --edge-hover: var(--primary);
    --grid-dot: rgba(255,255,255,0.055);

    /* 输入控件 */
    --input-bg: var(--input);
    --input-border: var(--border);
    --input-text: var(--text-1);

    /* 阴影（豆包风格：轻柔） */
    --shadow-sm: 0 1px 4px rgba(0,0,0,0.20);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.28);
    --shadow-float: 0 8px 32px rgba(0,0,0,0.36);

    /* 圆角（豆包：19.2px 全局，14px 组件级） */
    --r-xl: 19.2px;
    --r-lg: 14px;
    --r-md: 10px;
    --r-sm: 8px;
    --r-xs: 6px;

    /* 动效（飞书原生：平滑自然） */
    --ease: cubic-bezier(0.4, 0, 0.2, 1);

    /* 字体 */
    --ui: 'Stack Sans Text', ui-sans-serif, sans-serif, system-ui;
    --mono: "SF Mono", Menlo, "JetBrains Mono", "Roboto Mono", monospace;

    /* 图表色 */
    --chart-1: #60a5fa;
    --chart-2: #3b82f6;
    --chart-3: #2563eb;
    --chart-4: #1d4ed8;
    --chart-5: #1e40af;
  }

  :root[data-theme="light"]{
    --bg: #ffffff;
    --muted: #f5f6f8;
    --secondary: #ebedf0;
    --ring: #00266b;
    --input: #f0f1f3;

    --surface: #f7f8fa;
    --surface-2: #eff1f4;
    --surface-strong: rgba(255,255,255,0.95);
    --surface-solid: #ffffff;

    --border: rgba(0,0,0,0.08);
    --border-strong: rgba(0,0,0,0.14);
    --highlight: rgba(0,0,0,0.04);

    --text-1: #0e1115;
    --text-2: #4e5969;
    --text-3: #86909c;

    --primary: #0065fd;
    --primary-soft: rgba(0,101,253,0.08);
    --primary-press: #0054cc;
    --primary-foreground: #ffffff;
    --accent-foreground: #1d4ed8;
    --destructive: #ef4444;
    --success: #00a86b;
    --warning: #e37318;
    --danger: #ef4444;
    --cyan: #06b6d4;

    --sidebar: #eff1f4;
    --sidebar-border: #e7eaef;
    --sidebar-foreground: #0e1115;

    --card: #ffffff;
    --card-foreground: #0e1115;

    --accent-agent: #2563eb;
    --accent-convergence: #7c3aed;
    --accent-condition: #d97706;
    --accent-humanReview: #0891b2;
    --accent-deliver: #dc2626;

    --node-bg: #ffffff;
    --node-title: #0e1115;
    --node-sub: #86909c;
    --node-port: rgba(0,0,0,0.35);

    --edge: rgba(0,0,0,0.14);
    --edge-hover: var(--primary);
    --grid-dot: rgba(0,0,0,0.06);

    --input-bg: var(--input);
    --input-border: var(--border);
    --input-text: var(--text-1);

    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    --shadow-float: 0 8px 24px rgba(0,0,0,0.12);
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--bg);
    color:var(--text-1);
    font-family:var(--ui);
    font-size:13px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
    user-select:none;
    animation:appIn .4s var(--ease) both;
  }
  @keyframes appIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  ::selection{background:var(--primary);color:#fff}

  /* ============ 整体布局 ============ */
  #app{display:flex;flex-direction:column;height:100vh;width:100vw;position:relative}

  /* ============ 顶栏（豆包朴素风格） ============ */
  #topbar{
    height:52px;flex-shrink:0;
    display:flex;align-items:center;
    padding:0 16px;gap:12px;
    background:var(--surface-strong);
    border-bottom:1px solid var(--border);
    position:relative;z-index:60;
  }
  .brand{display:flex;align-items:center;gap:10px}
  .brand .logo{
    width:28px;height:28px;border-radius:var(--r-sm);
    background:var(--primary);
    display:flex;align-items:center;justify-content:center;
    color:#fff;
  }
  .brand .logo svg{width:16px;height:16px;fill:#fff}
  .brand .brand-name{font-size:15px;font-weight:600;letter-spacing:.01em;color:var(--text-1)}
  .brand .sub{color:var(--text-3);font-weight:400;font-size:11px;letter-spacing:.02em;margin-left:2px}
  .topbar-spacer{flex:1}

  /* 按钮（豆包规范：pill shape 999px，38px 高，500 13px） */
  .btn{
    font-family:var(--ui);font-size:13px;font-weight:500;
    height:38px;padding:0 15px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--text-1);border-radius:999px;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;
    transition:transform .16s var(--ease),background .16s var(--ease),border-color .16s,filter .16s;
  }
  .btn:hover:not(:disabled){background:var(--surface-solid);border-color:var(--border-strong)}
  .btn:active:not(:disabled){transform:translateY(1px)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.primary{background:var(--primary);border-color:transparent;color:var(--primary-foreground);font-weight:600}
  .btn.primary:hover:not(:disabled){filter:brightness(1.06);background:var(--primary)}
  .btn.primary:active:not(:disabled){transform:translateY(1px);background:var(--primary-press)}
  .btn.danger{background:var(--destructive);border-color:transparent;color:#fff}
  .btn.danger:hover:not(:disabled){filter:brightness(1.06)}
  .btn .kbd{font-family:var(--mono);font-size:10px;opacity:.7;padding:2px 6px;border:1px solid currentColor;border-radius:6px;margin-left:3px}

  .icon-btn{
    width:38px;height:38px;border-radius:var(--r-md);
    border:1px solid var(--border);
    background:var(--surface-2);color:var(--text-1);cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;
    transition:transform .16s var(--ease),background .16s var(--ease),border-color .16s;
  }
  .icon-btn:hover{background:var(--surface-solid);border-color:var(--border-strong)}
  .icon-btn:active{transform:translateY(1px)}
  .icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  #theme-toggle .ico-moon{display:none}
  :root[data-theme="light"] #theme-toggle .ico-sun{display:none}
  :root[data-theme="light"] #theme-toggle .ico-moon{display:block}

  /* ============ 主区域（页面绝对定位 + 平滑转场） ============ */
  #main{flex:1;position:relative;overflow:hidden;min-height:0}
  .page{
    position:absolute;inset:0;display:flex;
    opacity:0;transform:translateY(12px);
    pointer-events:none;
    transition:opacity .28s var(--ease), transform .32s var(--ease);
  }
  .page.active{opacity:1;transform:none;pointer-events:auto;z-index:1}

  /* ============ Workflow 页 ============ */
  #palette{
    width:64px;flex-shrink:0;
    background:var(--surface-strong);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;align-items:center;
    padding:14px 0;gap:10px;z-index:5;
  }
  .palette-title{
    font-family:var(--mono);font-size:9px;color:var(--text-3);
    letter-spacing:.18em;text-transform:uppercase;
    writing-mode:vertical-rl;margin-bottom:6px;
  }
  .palette-node{
    width:44px;height:44px;border-radius:var(--r-md);
    background:var(--surface-2);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    cursor:grab;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--text-2);
    position:relative;
    transition:background .16s var(--ease),border-color .16s,color .16s;
  }
  .palette-node:hover{color:#fff;border-color:var(--border-strong);background:var(--surface-solid)}
  .palette-node:active{cursor:grabbing;transform:translateY(1px)}
  .palette-node .accent{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:var(--r-md) 0 0 var(--r-md)}
  .palette-node[data-t=agent] .accent{background:var(--accent-agent)}
  .palette-node[data-t=convergence] .accent{background:var(--accent-convergence)}
  .palette-node[data-t=condition] .accent{background:var(--accent-condition)}
  .palette-node[data-t=humanReview] .accent{background:var(--accent-humanReview)}
  .palette-node[data-t=deliver] .accent{background:var(--accent-deliver)}
  .palette-tooltip{
    position:absolute;left:54px;top:50%;transform:translateY(-50%);
    background:var(--surface-solid);border:1px solid var(--border);
    padding:5px 10px;border-radius:var(--r-sm);font-size:11px;white-space:nowrap;
    opacity:0;pointer-events:none;transition:opacity .15s var(--ease);z-index:100;box-shadow:var(--shadow-md);
    color:var(--text-1);
  }
  .palette-node:hover .palette-tooltip{opacity:1}

  #canvas-wrap{
    flex:1;min-width:0;position:relative;overflow:auto;
    background:var(--bg);
  }
  #canvas{
    position:relative;width:2400px;height:1600px;
    background-image:radial-gradient(circle, var(--grid-dot) 1px, transparent 1px);
    background-size:22px 22px;
  }
  #edges-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
  #edges-svg .edge{
    fill:none;stroke:var(--edge);stroke-width:1.6;
    transition:stroke .15s var(--ease),stroke-width .15s var(--ease);
  }
  #edges-svg .edge:hover{stroke:var(--edge-hover);stroke-width:2.2}
  #edges-svg .edge.flow{stroke:var(--primary);stroke-width:2.2;stroke-dasharray:7 4;animation:flow .9s linear infinite}
  #edges-svg .edge.skipped{stroke:var(--edge);stroke-dasharray:3 3;opacity:.4}
  @keyframes flow{to{stroke-dashoffset:-22}}
  #edges-svg .temp-edge{fill:none;stroke:var(--primary);stroke-width:2;stroke-dasharray:4 3;opacity:.85}

  /* 节点 */
  .node{
    position:absolute;width:186px;height:86px;
    background:var(--node-bg);
    border:1px solid var(--border);border-radius:var(--r-lg);overflow:visible;z-index:2;
    cursor:default;
    transition:box-shadow .16s var(--ease),border-color .16s var(--ease);
  }
  .node:hover{border-color:var(--border-strong);box-shadow:var(--shadow-md)}
  .node.selected{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft), var(--shadow-md)}
  .node .accent-bar{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:var(--r-lg) 0 0 var(--r-lg)}
  .node .header{
    height:26px;display:flex;align-items:center;justify-content:space-between;
    padding:0 10px 0 14px;
  }
  .node .type-label{font-family:var(--mono);font-size:10px;letter-spacing:.04em;font-weight:700}
  .node .drag-handle{cursor:grab;color:var(--text-3);font-size:14px;line-height:1;padding:2px}
  .node .drag-handle:active{cursor:grabbing}
  .node .body{padding:2px 14px 0}
  .node .title{font-size:13px;font-weight:600;color:var(--node-title);line-height:1.2}
  .node .subtitle{font-family:var(--mono);font-size:10px;color:var(--node-sub);margin-top:3px}
  .node .ports-row{
    position:absolute;left:0;right:0;bottom:0;height:18px;
    display:flex;align-items:center;justify-content:space-between;padding:0 10px;
  }
  .port{
    width:11px;height:11px;border-radius:50%;
    background:var(--surface-solid);border:2px solid var(--node-port);
    cursor:crosshair;position:relative;
    transition:border-color .12s var(--ease),background .12s var(--ease);
  }
  .port:hover{border-color:var(--primary);background:var(--primary)}
  .port.in-0{position:absolute;left:-6px;top:50%;transform:translateY(-50%)}
  .port.out-0,.port.out-1{position:absolute;right:-6px}
  .port.out-0{top:50%;transform:translateY(-50%)}
  .port.out-1{bottom:-1px;right:-6px;top:auto;transform:none}

  .node[data-state="running"]{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary),0 0 16px rgba(0,101,253,.25);animation:runPulse 2s var(--ease) infinite}
  .node[data-state="completed"]{border-color:var(--success);animation:nodePop .35s var(--ease)}
  .node[data-state="failed"]{border-color:var(--danger);box-shadow:0 0 12px rgba(239,68,68,.25)}
  .node[data-state="cancelled"]{border-color:var(--border-strong);border-style:dashed;opacity:.6}
  .node[data-state="skipped"]{border-color:var(--border);opacity:.42}
  .node[data-state="waitingForReview"]{border-color:var(--success);box-shadow:0 0 0 1px var(--success),0 0 12px rgba(24,213,139,.25);animation:waitPulse 2s var(--ease) infinite}
  @keyframes runPulse{0%,100%{box-shadow:0 0 0 1px var(--primary),0 0 12px rgba(0,101,253,.20)}50%{box-shadow:0 0 0 1px var(--primary),0 0 20px rgba(0,101,253,.35)}}
  @keyframes nodePop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
  @keyframes waitPulse{0%,100%{box-shadow:0 0 8px rgba(24,213,139,.20)}50%{box-shadow:0 0 16px rgba(24,213,139,.40)}}

  .iter-badge{
    position:absolute;top:-11px;right:-11px;
    font-family:var(--mono);font-size:10px;color:#fff;
    background:var(--accent-convergence);padding:2px 8px;border-radius:999px;
    letter-spacing:.04em;white-space:nowrap;box-shadow:var(--shadow-sm);
  }
  .status-pill{
    position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);
    font-family:var(--mono);font-size:9px;letter-spacing:.05em;
    padding:2px 8px;border-radius:999px;white-space:nowrap;
    background:var(--surface-strong);border:1px solid var(--border);
    color:var(--text-2);
  }
  .status-pill.running{color:var(--primary);border-color:var(--primary)}
  .status-pill.completed{color:var(--success);border-color:var(--success)}
  .status-pill.failed{color:var(--danger);border-color:var(--danger)}
  .status-pill.cancelled{color:var(--text-2);border-color:var(--border-strong)}
  .status-pill.skipped{color:var(--text-3)}
  .status-pill.waitingForReview{color:var(--success);border-color:var(--success)}

  /* Inspector（豆包风格：14px 圆角，柔和间距） */
  #inspector{
    width:296px;flex-shrink:0;
    background:var(--surface-strong);
    border-left:1px solid var(--border);
    display:flex;flex-direction:column;overflow:hidden;z-index:5;
  }
  .insp-header{
    padding:12px 16px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;
    background:var(--surface-2);
  }
  .insp-header .title{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-2)}
  .insp-header .node-id{font-family:var(--mono);font-size:10px;color:var(--text-3)}
  .insp-body{flex:1;overflow-y:auto;padding:14px;scroll-behavior:smooth}
  .insp-empty{padding:48px 22px;text-align:center;color:var(--text-3);font-size:12px;line-height:1.7}
  .insp-empty .icon{font-size:30px;display:block;margin-bottom:10px;opacity:.5}
  .insp-section{margin-bottom:14px;border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
  .insp-section .sec-title{
    padding:8px 12px;background:var(--surface-2);
    font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--text-2);border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:6px;
  }
  .insp-section .sec-title .dot{width:6px;height:6px;border-radius:50%}
  .insp-section .sec-body{padding:12px}
  .field{margin-bottom:9px}
  .field:last-child{margin-bottom:0}
  .field label{display:block;font-size:11px;color:var(--text-2);margin-bottom:5px;letter-spacing:.02em}
  .field input,.field textarea,.field select{
    width:100%;background:var(--input-bg);border:1px solid var(--input-border);
    color:var(--input-text);font-family:var(--ui);font-size:12px;
    padding:8px 10px;border-radius:var(--r-sm);outline:none;
    transition:border-color .15s var(--ease),box-shadow .15s var(--ease),background .15s var(--ease);
  }
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);background:var(--bg)}
  .field textarea{resize:vertical;min-height:66px;line-height:1.5}
  .field textarea.code,.field input.code{font-family:var(--mono);font-size:11px}
  .field .readonly{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--input-bg);border-radius:var(--r-sm);border:1px solid var(--input-border)}
  .field .readonly .v{font-family:var(--mono);font-size:11px;color:var(--text-1)}
  .field .readonly .k{font-size:10px;color:var(--text-3)}
  .field-hint{font-size:10px;color:var(--text-3);margin-top:4px;line-height:1.4}
  .field-warn{
    margin-top:9px;padding:9px 11px;background:rgba(255,159,10,.12);
    border:1px solid rgba(255,159,10,.45);border-radius:var(--r-sm);
    font-size:11px;color:var(--warning);line-height:1.5;
  }
  .review-actions{display:flex;gap:8px;margin-top:9px}
  .review-actions .btn{flex:1;justify-content:center;font-size:11px;padding:8px}
  .upstream-list{font-size:11px;color:var(--text-2);line-height:1.7}
  .upstream-list .item{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--border)}
  .upstream-list .item:last-child{border-bottom:none}
  .upstream-list .item .uuid{font-family:var(--mono);font-size:10px;color:var(--text-3)}

  /* ============ Output 面板（豆包风格底部面板） ============ */
  #output-panel{
    height:240px;flex-shrink:0;
    background:var(--surface-strong);
    border-top:1px solid var(--border);
    display:flex;flex-direction:column;
    transition:height .3s var(--ease);
  }
  #output-panel.collapsed{height:42px}
  .output-header{
    height:42px;flex-shrink:0;
    display:flex;align-items:center;
    padding:0 14px;gap:10px;
    border-bottom:1px solid var(--border);
    background:var(--surface-2);
  }
  .output-header .title{font-size:13px;font-weight:600;letter-spacing:.02em}
  .output-header .live-indicator{
    display:flex;align-items:center;gap:5px;
    font-family:var(--mono);font-size:10px;color:var(--primary);
    letter-spacing:.06em;
  }
  .output-header .live-indicator .dot{width:6px;height:6px;border-radius:50%;background:var(--primary);animation:livePulse 1.2s var(--ease) infinite}
  @keyframes livePulse{0%,100%{opacity:1}50%{opacity:.25}}
  .output-header .spacer{flex:1}
  .output-header .clear-btn,.output-header .export-btn{
    font-size:11px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);
    padding:5px 10px;border-radius:var(--r-sm);cursor:pointer;font-family:var(--ui);

  .output-header .export-btn:disabled{opacity:.4;cursor:not-allowed}
  .output-header .collapse-btn{
    background:transparent;border:none;color:var(--text-2);cursor:pointer;font-size:14px;padding:2px 6px;
    transition:color .15s var(--ease);
  }
  .output-header .collapse-btn:hover{color:var(--text-1)}
  .output-body{flex:1;overflow-y:auto;padding:6px 0;scroll-behavior:smooth}

  .log-group{border-bottom:1px solid var(--border)}

  .log-group-header{
    display:flex;align-items:center;gap:9px;

  }
  .log-group-header:hover{background:var(--surface-2)}
  .log-group-header .arrow{width:10px;color:var(--text-3);font-size:10px;transition:transform .15s var(--ease)}
  .log-group-header.expanded .arrow{transform:rotate(90deg)}
  .log-group-header .status-icon{width:14px;text-align:center;font-family:var(--mono)}
  .log-group-header .status-icon.running{color:var(--primary)}
  .log-group-header .status-icon.completed{color:var(--success)}
  .log-group-header .status-icon.failed{color:var(--danger)}
  .log-group-header .status-icon.cancelled{color:var(--text-2)}
  .log-group-header .status-icon.skipped{color:var(--text-3)}

  .log-group-header .title-text{flex:1;color:var(--text-1);font-weight:500}
  .log-group-header .count{font-family:var(--mono);font-size:10px;color:var(--text-3)}

  .log-group-header .pill{font-family:var(--mono);font-size:9px;letter-spacing:.05em;padding:3px 10px;border-radius:999px;font-weight:500}
  .log-group-header .pill.running{color:var(--primary);background:var(--primary-soft)}
  .log-group-header .pill.completed{color:var(--success);background:rgba(24,213,139,.12)}
  .log-group-header .pill.failed{color:var(--danger);background:rgba(239,68,68,.12)}
  .log-group-header .pill.cancelled{color:var(--text-2);background:var(--surface-2)}

  .log-group-body{padding:4px 14px 12px 32px;display:none}
  .log-group-body.expanded{display:block;animation:groupIn .2s var(--ease)}
  @keyframes groupIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
  .log-line{font-family:var(--mono);font-size:11px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
  .log-line.reasoning{color:var(--text-2);font-style:italic}
  .log-line.output{color:var(--text-1)}
  .log-line.error{color:var(--danger)}

  .log-line.info{color:var(--text-3)}

  /* ============ StatusBar（绝对定位） ============ */

  table.presets td{font-family:var(--mono);font-size:11px;color:var(--card-foreground)}
  table.presets tr:hover td{background:color-mix(in srgb, var(--primary) 16%, transparent)}

  /* ============ Toast（底部居中、圆角 12px） ============ */

    position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(8px);

    transition:opacity .25s var(--ease),transform .28s var(--ease);

  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* 滚动条（细窄、半透明） */

  ::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb, var(--text-3) 80%, transparent)}

  /* 帮助提示 */
  .help-hint{
    position:absolute;bottom:14px;right:14px;
    background:var(--surface-solid);border:1px solid var(--border);border-radius:var(--r-lg);

  /* ============ 确认弹窗（居中、圆角 18px、柔和阴影） ============ */

  .modal{

  .modal-actions{display:flex;gap:10px;justify-content:flex-end}

  /* ============ 底部导航（飞书风格 Tab Bar） ============ */
  #bottom-nav{

  .nav-tab .ico{width:18px;height:18px;display:flex;align-items:center;justify-content:center}

  .nav-tab .lbl{font-size:12px;font-weight:500}
  .nav-tab.active{color:var(--primary);background:var(--primary-soft)}
  .nav-tab:active{transform:translateY(1px)}

  /* 无障碍：尊重减弱动效 */
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  }
</style>
</head>
<body>
<div id="app">

<script>
/* ============================================================
   Orchestra Demo — 豆包设计系统 × 飞书原生交互（单文件实现）
   ============================================================ */

/* ---------- 工具函数 ---------- */
const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));

const uuid = () => 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
  const r = Math.random()*16|0; const v = c==='x'?r:(r&0x3|0x8); return v.toString(16);
});
const shortId = id => id ? id.slice(0,8) : '';
const sleep = ms => new Promise(r => setTimeout(r, ms));
const now = () => Date.now();
function fmtTime(ts){ if(!ts) return '—'; const d = new Date(ts); const pad=n=>String(n).padStart(2,'0'); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}` }
function fmtDuration(ms){ if(!ms || ms<0) return '—'; if(ms<1000) return `${ms}ms`; const s = ms/1000; if(s<60) return `${s.toFixed(1)}s`; const m=Math.floor(s/60); return `${m}m${Math.floor(s%60)}s` }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._timer); t._timer=setTimeout(()=>t.classList.remove('show'),2200) }

/* ---------- 节点类型配置（豆包配色，柔化） ---------- */
const NODE_TYPES = {
  agent:       { accent:'rgb(59,130,246)',  label:'Agent',         inPorts:1, outPorts:1 },
  convergence: { accent:'rgb(124,92,252)',  label:'Convergence',   inPorts:1, outPorts:1 },
  condition:   { accent:'rgb(251,191,36)',  label:'Condition',     inPorts:1, outPorts:2 },
  humanReview: { accent:'rgb(34,211,238)',  label:'Human Review',  inPorts:1, outPorts:1 },
  deliver:     { accent:'rgb(248,113,113)', label:'Deliver',       inPorts:1, outPorts:0 },
};

/* ---------- Agent 配置 ---------- */
const AGENT_CONFIGS = {
  echo:      { type:'CLI', displayName:'echo',      systemPrompt:'Echo agent — 原样返回输入内容', binary:'/bin/echo', timeoutSeconds:10 },
  sleep:     { type:'CLI', displayName:'sleep',     systemPrompt:'Sleep agent — 等待 1 秒后返回', binary:'/bin/sleep', timeoutSeconds:5 },
  trae:      { type:'CLI', displayName:'trae',      systemPrompt:'trae CLI 编码助手 — 通过 PTY 执行真实编码任务', binary:'trae', timeoutSeconds:30 },
  DSAPI:     { type:'HTTP', displayName:'DeepSeek API', systemPrompt:'DeepSeek Reasoner — 推理模型，流式输出 reasoning + content', baseURL:'https://api.deepseek.com/v1', model:'deepseek-reasoner', apiKeyRef:'DEEPSEEK_API_KEY', timeoutSeconds:30 },
};

const CLI_PRESETS = [
  { id:'echo',      binary:'/bin/echo',  displayName:'echo' },
  { id:'sleep',     binary:'/bin/sleep', displayName:'sleep' },
  { id:'trae',      binary:'trae',       displayName:'trae' },
];

/* ---------- 预置示例工作流 ---------- */
const initialNodes = [
  { id:'n1', type:'agent', position:{x:80,y:100}, title:'Brainstorm', agentName:'DSAPI', prompt:'为一个 SwiftUI AI 编排应用想 3 个产品名称', runState:'idle' },
  { id:'n2', type:'agent', position:{x:80,y:240}, title:'Research', agentName:'trae', prompt:'调研市面上类似产品的命名规律', runState:'idle' },
  { id:'n3', type:'convergence', position:{x:380,y:170}, title:'Convergence', agentName:'DSAPI', prompt:'综合 Brainstorm 和 Research 的结果，选出最佳名称', reviewPrompt:'评审选出的名称是否独特且易记，不满意则要求重选', maxRounds:3, runState:'idle' },
  { id:'n4', type:'humanReview', position:{x:640,y:100}, title:'Human Approval', reviewInstructions:'确认最终产品名称', runState:'idle' },
  { id:'n5', type:'deliver', position:{x:640,y:240}, title:'Deliver', outputPath:'./output/final-name.md', runState:'idle' },
];
const initialEdges = [
  { id:'e1', sourceNode:'n1', sourcePort:'out-0', targetNode:'n3', targetPort:'in-0' },
  { id:'e2', sourceNode:'n2', sourcePort:'out-0', targetNode:'n3', targetPort:'in-0' },
  { id:'e3', sourceNode:'n3', sourcePort:'out-0', targetNode:'n4', targetPort:'in-0' },
  { id:'e4', sourceNode:'n4', sourcePort:'out-0', targetNode:'n5', targetPort:'in-0' },
];

/* ---------- 全局状态 ---------- */
const state = {
  nodes: JSON.parse(JSON.stringify(initialNodes)),
  edges: JSON.parse(JSON.stringify(initialEdges)),
  selectedNodeIds: new Set(),
  inspectorNodeId: null,
  runLog: [],
  runRecord: null,
  runHistory: [],
  isRunning: false,
  isCancelled: false,
  currentRunPromise: null,
  pendingReview: null,
  activePage: 'workflow',
  collapsedGroups: new Set(),
  expandedGroups: new Set(['_sys']),
  selectedAgentId: 'echo',
  nodeStartTimes: {},
  nodeIter: {},
  clipboard: null,
};

/* ============================================================
   渲染：Canvas
   ============================================================ */
function renderCanvas(){
  const canvas = $('#canvas');
  $$('.node').forEach(n => n.remove());
  for(const node of state.nodes){
    const el = createNodeElement(node);
    canvas.appendChild(el);
  }
  renderEdges();
}

function createNodeElement(node){
  const t = NODE_TYPES[node.type];
  const el = document.createElement('div');
  el.className = 'node';
  el.dataset.id = node.id;
  el.dataset.state = node.runState || 'idle';
  el.style.left = node.position.x + 'px';
  el.style.top = node.position.y + 'px';
  if(state.selectedNodeIds.has(node.id)) el.classList.add('selected');

  const subtitle = (node.type==='agent'||node.type==='convergence') ? (node.agentName||'') : '';
  const iter = state.nodeIter[node.id];
  const iterBadge = (node.runState==='running' && iter) ? `<div class="iter-badge">↻ ${iter.iter}/${iter.max}</div>` : '';
  const statusPill = (node.runState && node.runState!=='idle') ? `<div class="status-pill ${node.runState}">${statusLabel(node.runState)}</div>` : '';

  let portsHtml = '<div class="ports-row">';
  portsHtml += `<div class="port in-0" data-node="${node.id}" data-port="in-0" data-dir="in"></div>`;
  if(t.outPorts>=1) portsHtml += `<div class="port out-0" data-node="${node.id}" data-port="out-0" data-dir="out"></div>`;
  if(t.outPorts>=2) portsHtml += `<div class="port out-1" data-node="${node.id}" data-port="out-1" data-dir="out"></div>`;
  portsHtml += '</div>';

  el.innerHTML = `
    <div class="accent-bar" style="background:${t.accent}"></div>
    <div class="header">
      <span class="type-label" style="color:${t.accent}">${t.label}</span>
      <span class="drag-handle" data-handle="1">⋮⋮</span>
    </div>
    <div class="body">
      <div class="title">${escapeHtml(node.title)}</div>
      ${subtitle ? `<div class="subtitle">${escapeHtml(subtitle)}</div>` : ''}
    </div>
    ${portsHtml}
    ${iterBadge}
    ${statusPill}
  `;

  const handle = el.querySelector('[data-handle="1"]');
  handle.addEventListener('mousedown', e => startNodeDrag(e, node));
  el.addEventListener('mousedown', e => {
    if(e.target.classList.contains('port')) return;
    if(e.button!==0) return;
    handleNodeClick(e, node);
    startNodeDrag(e, node);
  });
  el.addEventListener('contextmenu', e => {
    e.preventDefault();
    selectNode(node.id, false);
    toast(`已选中 ${node.title} — 在右侧 Inspector 编辑`);
  });

  el.querySelectorAll('.port').forEach(p => {
    p.addEventListener('mousedown', e => {
      e.stopPropagation();
      startEdgeDrag(e, node, p.dataset.port, p.dataset.dir);
    });
  });

  return el;
}

function statusLabel(s){
  return {
    idle:'idle', running:'running', completed:'completed', failed:'failed',
    cancelled:'cancelled', skipped:'skipped', waitingForReview:'waiting'
  }[s] || s;
}

function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }

/* ---------- 连线渲染 ---------- */
function renderEdges(){
  const svg = $('#edges-svg');
  svg.innerHTML = '';
  for(const edge of state.edges){
    const src = state.nodes.find(n=>n.id===edge.sourceNode);
    const tgt = state.nodes.find(n=>n.id===edge.targetNode);
    if(!src || !tgt) continue;
    const sp = portPos(src, edge.sourcePort, 'out');
    const tp = portPos(tgt, edge.targetPort, 'in');
    const path = bezierPath(sp, tp);
    const pathEl = document.createElementNS('http://www.w3.org/2000/svg','path');
    pathEl.setAttribute('d', path);
    pathEl.setAttribute('class','edge' + (src.runState==='running'?' flow':'') + (tgt.runState==='skipped'?' skipped':''));
    pathEl.dataset.edgeId = edge.id;
    pathEl.style.pointerEvents = 'stroke';
    pathEl.addEventListener('click', async (e) => {
      e.stopPropagation();
      const ok = await confirmGlass(`删除这条连线？\n${src.title} → ${tgt.title}`);
      if(ok){
        state.edges = state.edges.filter(ed => ed.id !== edge.id);
        renderEdges();
      }
    });
    svg.appendChild(pathEl);
  }
}

function portPos(node, portName, dir){
  const W = 186, H = 86;
  if(dir==='in'){
    return { x: node.position.x + 0, y: node.position.y + H - 9 };
  }
  if(portName==='out-0'){
    return { x: node.position.x + W, y: node.position.y + H - 9 };
  }
  if(portName==='out-1'){
    return { x: node.position.x + W, y: node.position.y + H - 4 };
  }
  return { x: node.position.x + W, y: node.position.y + H/2 };
}

function bezierPath(a, b){
  const dx = Math.max(40, Math.abs(b.x - a.x) * 0.5);
  return `M ${a.x} ${a.y} C ${a.x+dx} ${a.y}, ${b.x-dx} ${b.y}, ${b.x} ${b.y}`;
}

/* ============================================================
   画布交互
   ============================================================ */
function handleNodeClick(e, node){
  const additive = e.metaKey || e.ctrlKey || e.shiftKey;
  selectNode(node.id, additive);
}

function selectNode(id, additive){
  if(additive){
    if(state.selectedNodeIds.has(id)) state.selectedNodeIds.delete(id);
    else state.selectedNodeIds.add(id);
  } else {
    state.selectedNodeIds.clear();
    state.selectedNodeIds.add(id);
  }
  state.inspectorNodeId = state.selectedNodeIds.size===1 ? id : null;
  $$('.node').forEach(el => {
    el.classList.toggle('selected', state.selectedNodeIds.has(el.dataset.id));
  });
  renderInspector();
  updateRunButton();
}

function deselectAll(){
  state.selectedNodeIds.clear();
  state.inspectorNodeId = null;
  $$('.node').forEach(el => el.classList.remove('selected'));
  renderInspector();
  updateRunButton();
}

let dragState = null;
function startNodeDrag(e, node){
  if(e.button!==0) return;
  if(e.target.classList.contains('port')) return;
  const canvasRect = $('#canvas-wrap').getBoundingClientRect();
  const startX = e.clientX, startY = e.clientY;
  const origPos = { x: node.position.x, y: node.position.y };
  dragState = { node, startX, startY, origPos, canvasRect, moved:false };
  window.addEventListener('mousemove', onNodeDragMove);
  window.addEventListener('mouseup', onNodeDragEnd);
}
function onNodeDragMove(e){
  if(!dragState) return;
  const dx = e.clientX - dragState.startX;
  const dy = e.clientY - dragState.startY;
  if(Math.abs(dx)>2 || Math.abs(dy)>2) dragState.moved = true;
  const node = dragState.node;
  node.position.x = Math.max(0, dragState.origPos.x + dx);
  node.position.y = Math.max(0, dragState.origPos.y + dy);
  const el = document.querySelector(`.node[data-id="${node.id}"]`);
  if(el){ el.style.left = node.position.x+'px'; el.style.top = node.position.y+'px'; }
  renderEdges();
}
function onNodeDragEnd(){
  dragState = null;
  window.removeEventListener('mousemove', onNodeDragMove);
  window.removeEventListener('mouseup', onNodeDragEnd);
}

/* ---------- 连线拖拽 ---------- */
let edgeDragState = null;
function startEdgeDrag(e, node, portName, dir){
  if(dir!=='out') return;
  const startPos = portPos(node, portName, 'out');
  edgeDragState = { sourceNode: node.id, sourcePort: portName, startPos };
  const svg = $('#edges-svg');
  const tempPath = document.createElementNS('http://www.w3.org/2000/svg','path');
  tempPath.setAttribute('class','temp-edge');
  tempPath.setAttribute('d', `M ${startPos.x} ${startPos.y} L ${startPos.x} ${startPos.y}`);
  tempPath.id = '_temp-edge';
  svg.appendChild(tempPath);
  window.addEventListener('mousemove', onEdgeDragMove);
  window.addEventListener('mouseup', onEdgeDragEnd);
}
function onEdgeDragMove(e){
  if(!edgeDragState) return;
  const canvasRect = $('#canvas-wrap').getBoundingClientRect();
  const x = e.clientX - canvasRect.left + $('#canvas-wrap').scrollLeft;
  const y = e.clientY - canvasRect.top + $('#canvas-wrap').scrollTop;
  const sp = edgeDragState.startPos;
  const path = bezierPath(sp, {x,y});
  $('#_temp-edge').setAttribute('d', path);
}
function onEdgeDragEnd(e){
  if(!edgeDragState){ cleanupEdgeDrag(); return; }
  const target = document.elementFromPoint(e.clientX, e.clientY);
  if(target && target.classList.contains('port') && target.dataset.dir==='in'){
    const targetNodeId = target.dataset.node;
    const targetPort = target.dataset.port;
    if(targetNodeId !== edgeDragState.sourceNode){
      const exists = state.edges.some(ed => ed.sourceNode===edgeDragState.sourceNode && ed.sourcePort===edgeDragState.sourcePort && ed.targetNode===targetNodeId && ed.targetPort===targetPort);
      if(!exists){
        state.edges.push({
          id: uuid(),
          sourceNode: edgeDragState.sourceNode,
          sourcePort: edgeDragState.sourcePort,
          targetNode: targetNodeId,
          targetPort: targetPort,
        });
        renderEdges();
        toast('已连线');
      } else {
        toast('连线已存在');
      }
    }
  }
  cleanupEdgeDrag();
}
function cleanupEdgeDrag(){
  edgeDragState = null;
  const tp = $('#_temp-edge');
  if(tp) tp.remove();
  window.removeEventListener('mousemove', onEdgeDragMove);
  window.removeEventListener('mouseup', onEdgeDragEnd);
}

/* ---------- 键盘快捷键 ---------- */
document.addEventListener('keydown', e => {
  if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;

  if((e.metaKey||e.ctrlKey) && e.shiftKey && (e.key==='R'||e.key==='r')){
    e.preventDefault();
    runWorkflow();
    return;
  }
  if((e.key==='Delete'||e.key==='Backspace') && state.selectedNodeIds.size>0){
    e.preventDefault();
    deleteSelected();
    return;
  }
  if((e.metaKey||e.ctrlKey) && (e.key==='c'||e.key==='C') && state.selectedNodeIds.size>0){
    e.preventDefault();
    copySelection();
    return;
  }
  if((e.metaKey||e.ctrlKey) && (e.key==='v'||e.key==='V') && state.clipboard){
    e.preventDefault();
    pasteSelection();
    return;
  }
});

function deleteSelected(){
  const ids = Array.from(state.selectedNodeIds);
  state.nodes = state.nodes.filter(n => !ids.includes(n.id));
  state.edges = state.edges.filter(e => !ids.includes(e.sourceNode) && !ids.includes(e.targetNode));
  state.selectedNodeIds.clear();
  state.inspectorNodeId = null;
  renderCanvas();
  renderInspector();
  updateRunButton();
  toast(`已删除 ${ids.length} 个节点`);
}

function copySelection(){
  state.clipboard = Array.from(state.selectedNodeIds).map(id => {
    const n = state.nodes.find(x=>x.id===id);
    return n ? JSON.parse(JSON.stringify(n)) : null;
  }).filter(Boolean);
  toast(`已复制 ${state.clipboard.length} 个节点`);
}
function pasteSelection(){
  if(!state.clipboard) return;
  const newIds = [];
  for(const n of state.clipboard){
    const copy = JSON.parse(JSON.stringify(n));
    copy.id = uuid();
    copy.position = { x: n.position.x + 20, y: n.position.y + 20 };
    copy.runState = 'idle';
    state.nodes.push(copy);
    newIds.push(copy.id);
  }
  state.selectedNodeIds = new Set(newIds);
  state.inspectorNodeId = newIds.length===1 ? newIds[0] : null;
  renderCanvas();
  renderInspector();
  updateRunButton();
  toast(`已粘贴 ${newIds.length} 个节点`);
}

  const rect = $('#canvas-wrap').getBoundingClientRect();

function addNode(type, position){
  const id = 'n' + uuid().slice(0,8);
  const base = { id, type, position, title: NODE_TYPES[type].label, runState:'idle' };
  if(type==='agent') Object.assign(base, { agentName:'echo', prompt:'' });
  if(type==='convergence') Object.assign(base, { agentName:'DSAPI', prompt:'', reviewPrompt:'', maxRounds:3 });
  if(type==='condition') Object.assign(base, { conditionExpression:'true' });
  if(type==='humanReview') Object.assign(base, { reviewInstructions:'' });
  if(type==='deliver') Object.assign(base, { outputPath:'./output.md' });
  state.nodes.push(base);
  renderCanvas();
  selectNode(id, false);
  toast(`已添加 ${NODE_TYPES[type].label} 节点`);
}

function findUpstream(node){
  const upstreamIds = state.edges.filter(e => e.targetNode === node.id).map(e => e.sourceNode);
  return state.nodes.filter(n => upstreamIds.includes(n.id));
}

/* ---------- 拓扑排序 ---------- */
function topoSort(nodes, edges){
  const inDeg = {};
  const adj = {};
  nodes.forEach(n => { inDeg[n.id]=0; adj[n.id]=[]; });
  edges.forEach(e => {
    if(inDeg.hasOwnProperty(e.sourceNode) && inDeg.hasOwnProperty(e.targetNode)){
      adj[e.sourceNode].push(e.targetNode);
      inDeg[e.targetNode]++;
    }
  });
  const queue = nodes.filter(n => inDeg[n.id]===0).map(n=>n.id);
  const result = [];
  while(queue.length){
    const id = queue.shift();
    const n = nodes.find(x=>x.id===id);
    if(n) result.push(n);
    for(const next of adj[id]){
      inDeg[next]--;
      if(inDeg[next]===0) queue.push(next);
    }
  }
  nodes.forEach(n => { if(!result.find(r=>r.id===n.id)) result.push(n); });
  return result;
}

/* ---------- 选区 + BFS 上游 ---------- */
function computeSelectionWithUpstream(selectedIds){
  const sel = new Set(selectedIds);
  const queue = [...selectedIds];
  while(queue.length){
    const id = queue.shift();
    state.edges.filter(e => e.targetNode === id).forEach(e => {
      if(!sel.has(e.sourceNode)){
        sel.add(e.sourceNode);
        queue.push(e.sourceNode);
      }
    });
  }
  return state.nodes.filter(n => sel.has(n.id));
}

/* ---------- Run 主流程 ---------- */
async function runWorkflow(){
  if(state.isRunning) return;
  state.isRunning = true;
  state.isCancelled = false;
  updateRunButton();
  updateStopButton();
  $('#output-live').style.display = 'flex';
  $('#status-bar').classList.add('show');
  $('#status-bar').innerHTML = `<span>● 运行中</span><span class="sep">|</span><span id="status-info">初始化...</span>`;

  state.nodes.forEach(n => {
    n.runState = 'idle';
    n.output = null;
  });
  state.nodeStartTimes = {};
  state.nodeIter = {};
  state.runLog = [];
  state.expandedGroups = new Set(['_sys']);
  renderCanvas();
  scheduleRenderOutput();

  const sel = Array.from(state.selectedNodeIds);
  let execNodes = sel.length===0 ? state.nodes : computeSelectionWithUpstream(sel);
  const execIds = new Set(execNodes.map(n=>n.id));
  const execEdges = state.edges.filter(e => execIds.has(e.sourceNode) && execIds.has(e.targetNode));
  const sorted = topoSort(execNodes, execEdges);

  state.runRecord = {
    id: uuid(),
    workflowName: 'demo-workflow',
    status: 'inProgress',
    startedAt: now(),
    finishedAt: null,
    steps: [],
    variables: {},
    resumedFromRunId: null,
  };
  $('#export-btn').disabled = true;

  appendSystemLog(`▶ Run ${shortId(state.runRecord.id)} started · ${sorted.length} node(s) in execution set`);

  for(const node of sorted){
    if(state.isCancelled) break;
    await executeNode(node);
  }

  state.runRecord.finishedAt = now();
  if(state.isCancelled){
    state.runRecord.status = 'cancelled';
    appendSystemLog('■ Run cancelled');
  } else {
    state.runRecord.status = 'completed';
    appendSystemLog(`✓ Run completed · ${fmtDuration(state.runRecord.finishedAt - state.runRecord.startedAt)}`);
    burstSuccess();
  }

  state.isRunning = false;
  updateRunButton();
  updateStopButton();
  $('#output-live').style.display = 'none';
  $('#status-bar').classList.remove('show');
  $('#export-btn').disabled = false;
  scheduleRenderOutput();
}

/* 运行成功：顶部一个轻量成功反馈 */
function burstSuccess(){
  const bar = $('#status-bar');
  bar.classList.add('show');
  bar.style.background = 'rgba(24,213,139,.16)';
  bar.style.borderTopColor = 'var(--success)';
  bar.innerHTML = `<span>✓ 运行完成</span><span class="sep">|</span><span>所有节点已收敛</span>`;
  setTimeout(()=>{ bar.classList.remove('show'); bar.style.background=''; bar.style.borderTopColor=''; }, 1800);
}

/* ---------- executeNode ---------- */
async function executeNode(node){
  if(node.runState === 'skipped') return;
  if(node.runState === 'completed') return;

  node.runState = 'running';
  state.nodeStartTimes[node.id] = now();
  updateNodeUI(node);
  appendRunLog(node.id, node.title, '', 'info', true);
  setStatusInfo(`${node.title} · running`);

  try {
    switch(node.type){
      case 'agent': await simulateAgentRun(node); break;
      case 'convergence': await simulateConvergenceRun(node); break;
      case 'condition': simulateConditionEval(node); break;
      case 'humanReview': await simulateHumanReview(node); break;
      case 'deliver': simulateDeliver(node); break;
    }
    if(node.runState !== 'cancelled' && node.runState !== 'failed' && node.runState !== 'waitingForReview'){
      node.runState = 'completed';
    }
    state.runRecord.steps.push({
      stepId: node.id, title: node.title, status: node.runState,
      startedAt: state.nodeStartTimes[node.id], finishedAt: now(),
      output: node.output || null, error: node.runState==='failed' ? 'failed' : null,
    });
  } catch(e){
    node.runState = 'failed';
    appendRunLog(node.id, node.title, `[error] ${e.message}`, 'error');
    state.runRecord.steps.push({
      stepId: node.id, title: node.title, status:'failed',
      startedAt: state.nodeStartTimes[node.id], finishedAt: now(),
      output:null, error: e.message,
    });
  }

  delete state.nodeStartTimes[node.id];
  delete state.nodeIter[node.id];
  updateNodeUI(node);
  renderInspector();
}

function updateNodeUI(node){
  const el = document.querySelector(`.node[data-id="${node.id}"]`);
  if(el){
    el.dataset.state = node.runState || 'idle';
    const oldPill = el.querySelector('.status-pill'); if(oldPill) oldPill.remove();
    const oldIter = el.querySelector('.iter-badge'); if(oldIter) oldIter.remove();
    if(node.runState && node.runState!=='idle'){
      const pill = document.createElement('div');
      pill.className = 'status-pill ' + node.runState;
      pill.textContent = statusLabel(node.runState);
      el.appendChild(pill);
    }
    const iter = state.nodeIter[node.id];
    if(node.runState==='running' && iter){
      const ib = document.createElement('div');
      ib.className = 'iter-badge';
      ib.textContent = `↻ ${iter.iter}/${iter.max}`;
      el.appendChild(ib);
    }
  }
  renderEdges();
  scheduleRenderOutput();
}

function setStatusInfo(msg){
  const el = $('#status-info');
  if(el) el.textContent = msg;
}

/* ---------- simulateAgentRun ---------- */
async function simulateAgentRun(node){
  const reasoningText = generateReasoningText(node.prompt, node.title);
  const contentText = generateContentText(node.prompt, node.title);

  const rChunks = splitToChunks(reasoningText, 5);
  for(const chunk of rChunks){
    if(state.isCancelled) return;
    await sleep(60);
    appendRunLog(node.id, node.title, chunk, 'reasoning');
  }

  const cChunks = splitToChunks(contentText, 8);
  for(const chunk of cChunks){
    if(state.isCancelled) return;
    await sleep(90);
    appendRunLog(node.id, node.title, chunk, 'output');
  }

  node.output = contentText;
}

function generateReasoningText(prompt, title){
  return `让我思考一下「${prompt||'(空 prompt)'}」这个任务。\n` +
         `首先，我需要理解需求的核心——用户期望的产出是什么？\n` +
         `然后，考虑可能的方案：方案 A 是常规思路，方案 B 是反向解法，方案 C 是组合创新。\n` +
         `综合评估可行性与创新性后，我决定给出三种思路供上游选择。\n` +
         `（reasoning_content 流式输出，对应 DeepSeek reasoner 的推理过程）`;
}
function generateContentText(prompt, title){
  return `根据「${prompt||'(空 prompt)'}」，${title} 的回复：\n` +
         `1. 方案一：快速实现，覆盖核心场景，适合 MVP 验证\n` +
         `2. 方案二：完整实现，含边界处理与错误恢复，工程级健壮\n` +
         `3. 方案三：创新方案，结合最佳实践与差异化设计，长期 ROI 最高\n` +
         `推荐方案二，平衡了效率与完整性。`;
}
function splitToChunks(text, n){
  const lines = text.split('\n');
  const chunks = [];
  let cur = '';
  for(let i=0;i<lines.length;i++){
    cur += (cur?'\n':'') + lines[i];
    if((i+1)%n===0 || i===lines.length-1){ chunks.push(cur); cur=''; }
  }
  return chunks.length ? chunks : [text];
}

/* ---------- simulateConvergenceRun ---------- */
async function simulateConvergenceRun(node){
  const maxIter = node.maxRounds || 3;

  for(let iter=1; iter<=maxIter; iter++){
    if(state.isCancelled) return;
    state.nodeIter[node.id] = { iter, max: maxIter };
    updateNodeUI(node);

    appendRunLog(node.id, node.title, `=== Iteration ${iter}/${maxIter} ===`, 'info');

    await simulateAgentRun(node);

    if(state.isCancelled) return;

    if(!node.reviewPrompt){
      appendRunLog(node.id, node.title, 'Review Prompt 为空 → 直接 pass through', 'info');
      return;
    }

    if(iter < maxIter){
      appendRunLog(node.id, node.title, `Review: LOOP — 第 ${iter} 轮评审未通过，注入差异化 feedback 重跑上游`, 'info');
      appendRunLog(node.id, node.title, `↻ 重跑上游 agent（差异化 feedback：第 ${iter} 轮反馈聚焦"独特性与易记性"）`, 'info');
      await sleep(300);
      continue;
    } else {
      appendRunLog(node.id, node.title, `Review: PASS — 第 ${iter} 轮评审达标，convergence 收敛完成`, 'info');
      return;
    }
  }
}

/* ---------- simulateConditionEval ---------- */
function simulateConditionEval(node){
  const expr = (node.conditionExpression||'').trim();
  const result = expr==='true' || expr==='1';
  appendRunLog(node.id, node.title, `Condition: "${expr}" → ${result? 'TRUE → out-0':'FALSE → out-1'}`, 'output');
  const falsePort = result ? 'out-1' : 'out-0';
  const skippedEdges = state.edges.filter(e => e.sourceNode===node.id && e.sourcePort===falsePort);
  for(const e of skippedEdges){
    const tgt = state.nodes.find(n=>n.id===e.targetNode);
    if(tgt){
      markSkippedDownstream(tgt.id);
    }
  }
}
function markSkippedDownstream(nodeId){
  const n = state.nodes.find(x=>x.id===nodeId);
  if(!n) return;
  n.runState = 'skipped';
  state.runRecord.steps.push({
    stepId:n.id, title:n.title, status:'skipped',
    startedAt:null, finishedAt:null, output:null, error:null,
  });
  appendRunLog(n.id, n.title, 'Skipped (condition false branch)', 'info');
  updateNodeUI(n);
  state.edges.filter(e=>e.sourceNode===nodeId).forEach(e => markSkippedDownstream(e.targetNode));
}

/* ---------- simulateHumanReview ---------- */
async function simulateHumanReview(node){
  appendRunLog(node.id, node.title, `⏸ Waiting for human review: ${node.reviewInstructions||'(no instructions)'}`, 'info');
  node.runState = 'waitingForReview';
  state.selectedNodeIds.clear();
  state.selectedNodeIds.add(node.id);
  state.inspectorNodeId = node.id;
  $$('.node').forEach(el => el.classList.toggle('selected', el.dataset.id === node.id));
  updateNodeUI(node);
  renderInspector();
  setStatusInfo(`${node.title} · 等待审批 · 请在右侧 Inspector 处理`);

  await new Promise(resolve => {
    state.pendingReview = { stepId: node.id, resolve };
  });

  const approved = state.pendingReview.approved;
  appendRunLog(node.id, node.title, `Human review: ${approved?'APPROVED ✓':'REJECTED ✗'}`, 'output');
  node.runState = approved ? 'completed' : 'cancelled';
  if(!approved){
    state.edges.filter(e=>e.sourceNode===node.id).forEach(e => markSkippedDownstream(e.targetNode));
  }
}

function resolveReview(stepId, approved){
  if(!state.pendingReview || state.pendingReview.stepId !== stepId) return;
  state.pendingReview.approved = approved;
  state.pendingReview.resolve();
}

/* ---------- simulateDeliver ---------- */
function simulateDeliver(node){
  appendRunLog(node.id, node.title, `📄 已交付到：${node.outputPath||'(no path)'}`, 'success');
  appendRunLog(node.id, node.title, `交付内容：${state.nodes.find(n=>n.title==='Convergence')?.output || '(无上游输出)'}`, 'output');
}

/* ---------- Cancel ---------- */
function stopWorkflow(){
  if(!state.isRunning) return;
  state.isCancelled = true;
  state.nodes.forEach(n => {
    if(n.runState==='running' || n.runState==='waitingForReview'){
      n.runState = 'cancelled';
      updateNodeUI(n);
      if(state.pendingReview && state.pendingReview.stepId === n.id){
        state.pendingReview.approved = false;
        state.pendingReview.resolve();
      }
    }
  });
  appendSystemLog('■ Stop requested — 当前节点已标记 cancelled');
}

/* ============================================================
   RunLog / OutputPanel
   ============================================================ */
function appendRunLog(stepId, stepTitle, text, level, headerOnly){
  const streamable = level==='reasoning' || level==='output';
  if(!headerOnly && text && streamable){
    const last = state.runLog[state.runLog.length-1];
    if(last && last.stepId===stepId && last.level===level){
      last.text += (last.text? '\n':'') + text;
      scheduleRenderOutput();
      return;
    }
  }
  state.runLog.push({
    id: uuid(),
    timestamp: now(),
    stepId,
    stepTitle,
    text: text || '',
    level: level || 'info',
  });
  scheduleRenderOutput();
}

function appendSystemLog(text){
  state.runLog.push({
    id: uuid(),
    timestamp: now(),
    stepId: null,
    stepTitle: 'System',
    text,
    level: 'system',
  });
  scheduleRenderOutput();
}

/* rAF 合并渲染 */
let _roScheduled = false;
function scheduleRenderOutput(){
  if(_roScheduled) return;
  _roScheduled = true;
  requestAnimationFrame(() => { _roScheduled = false; renderOutput(); });
}

function renderOutput(){
  const body = $('#output-body');
  if(state.runLog.length===0){
    body.innerHTML = `<div class="output-empty">运行工作流后，流式输出将在此分组显示</div>`;
    return;
  }

  const groups = [];
  const groupMap = {};
  state.runLog.forEach(e => {
    if(e.stepId===null){
      if(groupMap['_sys']===undefined){ groupMap['_sys']=groups.length; groups.push({stepId:null, stepTitle:'System', entries:[], level:'system'}); }
      groups[groupMap['_sys']].entries.push(e);
    }
  });
  state.runLog.forEach(e => {
    if(e.stepId===null) return;
    if(groupMap[e.stepId]===undefined){
      groupMap[e.stepId] = groups.length;
      groups.push({stepId:e.stepId, stepTitle:e.stepTitle, entries:[]});
    }
    groups[groupMap[e.stepId]].entries.push(e);
  });

  const nodeStatus = id => {
    if(id===null) return 'system';
    const n = state.nodes.find(x=>x.id===id);
    return n ? (n.runState||'idle') : 'idle';
  };

  let html = '';
  for(const g of groups){
    const status = nodeStatus(g.stepId);
    const groupKey = g.stepId===null ? '_sys' : g.stepId;
    const expanded = state.expandedGroups.has(groupKey);
    const reasoningCount = g.entries.filter(e=>e.level==='reasoning').length;
    const outputCount = g.entries.filter(e=>['output','success','info','error'].includes(e.level)).length;
    const statusIcon = statusIconFor(status);
    const isRunning = status==='running' || status==='waitingForReview';
    const dur = state.nodeStartTimes[g.stepId] ? now()-state.nodeStartTimes[g.stepId] : null;

    html += `<div class="log-group">`;
    html += `<div class="log-group-header ${expanded?'expanded':''}" data-toggle="${groupKey}">`;
    html += `<span class="arrow">▶</span>`;
    html += `<span class="status-icon ${status}">${statusIcon}</span>`;
    html += `<span class="title-text">${escapeHtml(g.stepTitle)}</span>`;
    if(reasoningCount>0) html += `<span class="count reasoning">🧠 ${reasoningCount}</span>`;
    if(outputCount>0) html += `<span class="count">📝 ${outputCount}</span>`;
    if(isRunning && dur!=null) html += `<span class="duration">${fmtDuration(dur)}</span>`;
    html += `<span class="pill ${status}">${statusLabel(status)}</span>`;
    html += `</div>`;
    if(expanded){
      html += `<div class="log-group-body expanded">`;
      for(const e of g.entries){
        if(!e.text) continue;
        html += `<div class="log-line ${e.level}">${escapeHtml(e.text)}</div>`;
      }
      html += `</div>`;
    }
    html += `</div>`;
  }
  body.innerHTML = html;

  body.querySelectorAll('[data-toggle]').forEach(el => {
    el.addEventListener('click', () => {
      const key = el.dataset.toggle;
      if(state.expandedGroups.has(key)) state.expandedGroups.delete(key);
      else state.expandedGroups.add(key);
      scheduleRenderOutput();
    });
  });

  const atBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 60;
  if(atBottom) body.scrollTop = body.scrollHeight;
}

function statusIconFor(status){
  return {
    idle:'○', running:'◌', completed:'✓', failed:'✗',
    cancelled:'⊘', skipped:'⊘', waitingForReview:'⏸', system:'▸'
  }[status] || '○';
}

/* 每秒刷新 running 时长 */
setInterval(() => {
  if(state.isRunning && state.runLog.some(e => state.nodeStartTimes[e.stepId])){
    scheduleRenderOutput();
  }
}, 1000);

/* ============================================================
   确认弹窗
   ============================================================ */
function confirmGlass(msg){
  return new Promise(resolve => {
    const bd = $('#modal-backdrop');
    $('#modal-msg').textContent = msg;
    bd.classList.add('show');
    const okBtn = $('#modal-ok');
    const cancelBtn = $('#modal-cancel');
    const done = val => {
      bd.classList.remove('show');
      okBtn.removeEventListener('click', onOk);
      cancelBtn.removeEventListener('click', onCancel);
      resolve(val);
    };
    const onOk = () => done(true);
    const onCancel = () => done(false);
    okBtn.addEventListener('click', onOk);
    cancelBtn.addEventListener('click', onCancel);
  });
}

/* ============================================================
   Timeline 导出
   ============================================================ */
function exportTimeline(){
  const r = state.runRecord;
  if(!r){ toast('暂无可导出的运行记录'); return; }
  let md = `# Run Timeline\n\n`;
  md += `- **Run ID**: ${r.id}\n`;
  md += `- **Workflow**: ${r.workflowName}\n`;
  md += `- **Status**: ${r.status}\n`;
  md += `- **Started**: ${fmtTime(r.startedAt)}\n`;
  md += `- **Finished**: ${r.finishedAt ? fmtTime(r.finishedAt) : '—'}\n`;
  md += `- **Duration**: ${fmtDuration((r.finishedAt||now()) - r.startedAt)}\n`;
  if(r.resumedFromRunId) md += `- **Resumed From**: ${r.resumedFromRunId}\n`;
  md += `\n## Steps\n\n`;
  for(const step of r.steps){
    md += `### ${step.title} (${step.status})\n`;
    md += `- Started: ${step.startedAt?fmtTime(step.startedAt):'—'}\n`;
    md += `- Finished: ${step.finishedAt?fmtTime(step.finishedAt):'—'}\n`;
    md += `- Duration: ${(step.startedAt&&step.finishedAt)?fmtDuration(step.finishedAt-step.startedAt):'—'}\n`;
    if(step.output) md += `\n**Output:**\n\`\`\`\n${step.output}\n\`\`\`\n`;
    if(step.error) md += `\n**Error:** ${step.error}\n`;
    md += `\n`;
  }
  md += `## Full Log\n\n`;
  for(const e of state.runLog){
    md += `**[${e.stepTitle}]** (${e.level}) ${e.text}\n\n`;
  }

  const blob = new Blob([md], { type:'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `timeline-${r.id.slice(0,8)}.md`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Timeline 已导出');
}

/* ---------- Agents 页 ---------- */

}
