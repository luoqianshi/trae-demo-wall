<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旧物情报局 - 校园闲置交换社区</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }

        .app {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: #f5f5f5;
            position: relative;
        }

        /* ===== 顶部导航 ===== */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 12px 16px 0;
        }

        .topbar-title {
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .topbar-title .logo { display: flex; align-items: center; gap: 6px; }

        .search-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 13px;
            cursor: pointer;
        }

        .tabs {
            display: flex;
            gap: 0;
        }

        .tab {
            flex: 1;
            padding: 10px 0 8px;
            text-align: center;
            font-size: 14px;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab.active {
            color: #fff;
            font-weight: 600;
            border-bottom-color: #fff;
        }

        /* ===== Feed流 ===== */
        .feed {
            padding: 12px;
            padding-bottom: 80px;
        }

        .post-card {
            background: #fff;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .post-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .post-avatar.sell { background: linear-gradient(135deg, #667eea, #764ba2); }
        .post-avatar.buy { background: linear-gradient(135deg, #f093fb, #f5576c); }
        .post-avatar.swap { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        .post-avatar.donate { background: linear-gradient(135deg, #43e97b, #38f9d7); }

        .post-user { flex: 1; }
        .post-name { font-size: 14px; font-weight: 600; color: #333; }
        .post-meta { font-size: 11px; color: #999; display: flex; align-items: center; gap: 6px; }

        .post-type-badge {
            display: inline-block;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            color: #fff;
        }

        .post-type-badge.sell { background: #667eea; }
        .post-type-badge.buy { background: #f5576c; }
        .post-type-badge.swap { background: #4facfe; }
        .post-type-badge.donate { background: #43e97b; }

        .post-body {
            font-size: 15px;
            line-height: 1.6;
            color: #333;
            margin-bottom: 10px;
        }

        .post-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }

        .tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .tag.item { background: rgba(102,126,234,0.12); color: #667eea; }
        .tag.condition { background: rgba(255,193,7,0.15); color: #f57f17; }
        .tag.price { background: rgba(233,30,99,0.1); color: #e91e63; }
        .tag.free { background: rgba(76,175,80,0.12); color: #2e7d32; }
        .tag.swap-have { background: rgba(233,30,99,0.1); color: #c2185b; }
        .tag.swap-want { background: rgba(33,150,243,0.12); color: #1565c0; }

        .post-actions {
            display: flex;
            border-top: 1px solid #f0f0f0;
            padding-top: 10px;
            gap: 0;
        }

        .post-action {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-size: 13px;
            color: #999;
            cursor: pointer;
            padding: 4px 0;
            border-radius: 6px;
            transition: all 0.15s;
        }

        .post-action:hover { background: #f5f5f5; color: #667eea; }
        .post-action.liked { color: #e91e63; }

        /* ===== 评论 ===== */
        .comments-section {
            margin-top: 8px;
            border-top: 1px solid #f5f5f5;
            padding-top: 8px;
        }

        .comment-item {
            font-size: 13px;
            line-height: 1.5;
            padding: 4px 0;
            color: #555;
        }

        .comment-item .cname { font-weight: 600; color: #667eea; }

        .comment-input-row {
            display: flex;
            gap: 6px;
            margin-top: 6px;
        }

        .comment-input-row input {
            flex: 1;
            border: 1px solid #e0e0e0;
            border-radius: 16px;
            padding: 6px 12px;
            font-size: 13px;
            outline: none;
        }

        .comment-input-row input:focus { border-color: #667eea; }

        .comment-input-row button {
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 16px;
            padding: 6px 12px;
            font-size: 13px;
            cursor: pointer;
        }

        /* ===== 悬浮发帖按钮 ===== */
        .fab {
            position: fixed;
            bottom: 24px;
            right: calc(50% - 220px);
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            font-size: 28px;
            border: none;
            box-shadow: 0 4px 16px rgba(102,126,234,0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 90;
            transition: transform 0.2s;
        }

        .fab:hover { transform: scale(1.08); }

        /* ===== AI助手悬浮按钮 ===== */
        .ai-fab {
            position: fixed;
            bottom: 24px;
            left: calc(50% - 220px);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #43e97b, #38f9d7);
            color: #fff;
            font-size: 20px;
            border: none;
            box-shadow: 0 2px 10px rgba(67,233,123,0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 90;
            transition: transform 0.2s;
        }

        .ai-fab:hover { transform: scale(1.08); }

        /* ===== 发帖弹窗 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 200;
            justify-content: center;
            align-items: flex-end;
        }

        .modal-overlay.show { display: flex; }

        .modal {
            background: #fff;
            border-radius: 16px 16px 0 0;
            width: 100%;
            max-width: 480px;
            max-height: 85vh;
            padding: 20px;
            animation: slideUp 0.25s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-title {
            font-size: 17px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 16px;
        }

        .modal-close {
            position: absolute;
            right: 16px;
            top: 16px;
            background: none;
            border: none;
            font-size: 22px;
            color: #999;
            cursor: pointer;
        }

        .type-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }

        .type-option {
            flex: 1;
            padding: 10px 4px;
            border: 2px solid #eee;
            border-radius: 10px;
            text-align: center;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .type-option .type-icon { font-size: 20px; display: block; margin-bottom: 4px; }
        .type-option.active { border-color: #667eea; background: rgba(102,126,234,0.06); color: #667eea; font-weight: 600; }

        .modal textarea {
            width: 100%;
            border: 1.5px solid #e0e0e0;
            border-radius: 12px;
            padding: 12px;
            font-size: 15px;
            resize: none;
            height: 100px;
            outline: none;
            font-family: inherit;
            line-height: 1.5;
        }

        .modal textarea:focus { border-color: #667eea; }

        .modal-hint {
            font-size: 12px;
            color: #999;
            margin-top: 6px;
            line-height: 1.5;
        }

        .modal-tags-preview {
            margin-top: 10px;
            min-height: 28px;
        }

        .modal-tags-preview .label {
            font-size: 12px;
            color: #999;
            margin-bottom: 4px;
        }

        .publish-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 14px;
            transition: opacity 0.15s;
        }

        .publish-btn:hover { opacity: 0.9; }

        /* ===== 图片上传 ===== */
        .img-upload-area {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .img-upload-item {
            position: relative;
            width: 72px;
            height: 72px;
            border-radius: 8px;
            overflow: hidden;
        }

        .img-upload-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .img-upload-item .img-remove {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            color: #fff;
            border: none;
            font-size: 12px;
            line-height: 18px;
            text-align: center;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .img-upload-add {
            width: 72px;
            height: 72px;
            border: 2px dashed #d0d0d0;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #bbb;
            font-size: 12px;
            transition: border-color 0.2s;
        }

        .img-upload-add:hover { border-color: #667eea; color: #667eea; }
        .img-upload-add .plus { font-size: 22px; line-height: 1; margin-bottom: 2px; }

        /* ===== 帖子图片 ===== */
        .post-images {
            display: grid;
            gap: 4px;
            margin-bottom: 10px;
            border-radius: 8px;
            overflow: hidden;
        }

        .post-images.cols-1 { grid-template-columns: 1fr; max-width: 260px; }
        .post-images.cols-2 { grid-template-columns: 1fr 1fr; }
        .post-images.cols-3 { grid-template-columns: 1fr 1fr 1fr; }

        .post-images img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        .post-images img:hover { opacity: 0.85; }
        .post-images.cols-1 img { aspect-ratio: 4/3; }

        /* ===== 图片预览大图 ===== */
        .img-viewer {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 400;
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }

        .img-viewer.show { display: flex; }

        .img-viewer img {
            max-width: 95%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 4px;
        }

        /* ===== AI助手面板 ===== */
        .ai-panel {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 200;
        }

        .ai-panel.show { display: block; }

        .ai-panel-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.3);
        }

        .ai-panel-content {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            max-height: 70vh;
            background: #fff;
            border-radius: 16px 16px 0 0;
            display: flex;
            flex-direction: column;
            animation: slideUp 0.25s ease;
        }

        .ai-header {
            padding: 14px 16px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .ai-header-title { font-size: 15px; font-weight: 600; }

        .ai-close-btn {
            background: none;
            border: none;
            font-size: 20px;
            color: #999;
            cursor: pointer;
        }

        .ai-chat {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .ai-msg-row { display: flex; align-items: flex-start; gap: 8px; }
        .ai-msg-row.bot { flex-direction: row; }
        .ai-msg-row.me { flex-direction: row-reverse; }

        .ai-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            background: linear-gradient(135deg, #43e97b, #38f9d7);
        }

        .ai-avatar.me-av { background: linear-gradient(135deg, #f093fb, #f5576c); }

        .ai-bubble {
            max-width: 75%;
            padding: 10px 12px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.5;
        }

        .ai-msg-row.bot .ai-bubble { background: #f1f0f5; color: #333; border-bottom-left-radius: 4px; }
        .ai-msg-row.me .ai-bubble { background: #667eea; color: #fff; border-bottom-right-radius: 4px; }

        .ai-card {
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            border-left: 3px solid #2196f3;
            padding: 8px 10px;
            border-radius: 6px;
            margin-top: 6px;
            font-size: 13px;
            color: #1565c0;
        }

        .ai-input-row {
            padding: 10px 16px;
            border-top: 1px solid #f0f0f0;
            display: flex;
            gap: 8px;
        }

        .ai-input-row input {
            flex: 1;
            border: 1.5px solid #e0e0e0;
            border-radius: 20px;
            padding: 8px 14px;
            font-size: 14px;
            outline: none;
        }

        .ai-input-row input:focus { border-color: #667eea; }

        .ai-input-row button {
            background: linear-gradient(135deg, #43e97b, #38f9d7);
            color: #fff;
            border: none;
            border-radius: 20px;
            padding: 8px 14px;
            font-size: 14px;
            cursor: pointer;
        }

        /* ===== 搜索面板 ===== */
        .search-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #fff;
            z-index: 200;
            max-width: 480px;
            margin: 0 auto;
        }

        .search-overlay.show { display: block; }

        .search-top {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #f0f0f0;
        }

        .search-top input {
            flex: 1;
            border: none;
            font-size: 15px;
            outline: none;
        }

        .search-top button {
            background: none;
            border: none;
            font-size: 15px;
            color: #667eea;
            cursor: pointer;
        }

        .search-results {
            padding: 12px;
        }

        .search-empty {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        /* ===== 空状态 ===== */
        .empty-feed {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-feed .emoji { font-size: 48px; margin-bottom: 12px; }

        /* ===== 登录弹窗 ===== */
        .login-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 300;
            justify-content: center;
            align-items: center;
        }

        .login-overlay.show { display: flex; }

        .login-box {
            background: #fff;
            border-radius: 20px;
            width: 90%;
            max-width: 360px;
            padding: 32px 24px 24px;
            animation: slideUp 0.3s ease;
            text-align: center;
        }

        .login-logo {
            font-size: 48px;
            margin-bottom: 8px;
        }

        .login-title {
            font-size: 20px;
            font-weight: 700;
            color: #333;
            margin-bottom: 4px;
        }

        .login-subtitle {
            font-size: 13px;
            color: #999;
            margin-bottom: 24px;
        }

        .login-field {
            position: relative;
            margin-bottom: 14px;
        }

        .login-field input {
            width: 100%;
            border: 1.5px solid #e0e0e0;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .login-field input:focus { border-color: #667eea; }

        .login-field .code-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #667eea;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 8px;
        }

        .login-field .code-btn:disabled { color: #ccc; cursor: default; }

        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.15s;
        }

        .login-btn:hover { opacity: 0.9; }

        .login-switch {
            margin-top: 16px;
            font-size: 13px;
            color: #999;
        }

        .login-switch a {
            color: #667eea;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
        }

        .login-close {
            position: absolute;
            top: 12px;
            right: 14px;
            background: none;
            border: none;
            font-size: 22px;
            color: #999;
            cursor: pointer;
        }

        /* ===== 顶部用户区域 ===== */
        .user-area {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .user-avatar-sm {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            background: rgba(255,255,255,0.3);
            color: #fff;
            flex-shrink: 0;
        }

        .user-name-sm {
            color: #fff;
            font-size: 13px;
            max-width: 70px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .login-btn-topbar {
            background: rgba(255,255,255,0.25);
            border: none;
            color: #fff;
            padding: 5px 12px;
            border-radius: 14px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 500;
        }

        /* ===== 用户菜单弹窗 ===== */
        .user-menu-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.3);
            z-index: 250;
            justify-content: center;
            align-items: flex-end;
        }

        .user-menu-overlay.show { display: flex; }

        .user-menu {
            background: #fff;
            border-radius: 16px 16px 0 0;
            width: 100%;
            max-width: 480px;
            padding: 20px 24px;
            animation: slideUp 0.25s ease;
        }

        .user-menu-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .user-menu-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
        }

        .user-menu-info { text-align: left; }
        .user-menu-name { font-size: 16px; font-weight: 600; color: #333; }
        .user-menu-phone { font-size: 12px; color: #999; margin-top: 2px; }

        .user-menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 0;
            font-size: 15px;
            color: #333;
            border-bottom: 1px solid #f5f5f5;
            cursor: pointer;
        }

        .user-menu-item:last-child { border-bottom: none; }
        .user-menu-item .icon { font-size: 18px; }

        .user-menu-item.danger { color: #e91e63; }
    </style>
</head>
<body>
    <div class="app" id="app">
        <!-- 顶部导航 -->
        <div class="topbar">
            <div class="topbar-title">
                <div class="logo">🔍 旧物情报局</div>
                <div style="display:flex;align-items:center;gap:8px;">
                    <div id="userArea"></div>
                    <button class="search-btn" onclick="openSearch()">🔎 搜索</button>
                </div>
            </div>
            <div class="tabs" id="tabs">

    // ========== 标签提取 ==========
    function generateTags(text, type) {
        const tags = [];

        // 物品类型
        for (const [name, pattern] of Object.entries(itemPatterns)) {
            if (pattern.test(text)) tags.push({ text: name, cls: 'item' });
        }
        if (!tags.some(t => t.cls === 'item')) tags.push({ text: '其他', cls: 'item' });

        // 成色
        const condMatch = text.match(/九成新|八成新|全新|几乎全新|七成新|半新/);
        if (condMatch) tags.push({ text: condMatch[0], cls: 'condition' });

        // 价格
        if (/免费|送|不要钱|白给/.test(text)) {
            tags.push({ text: '免费', cls: 'free' });
        } else {
            const priceMatch = text.match(/(\d+)\s*[元块]/);
            if (priceMatch) tags.push({ text: priceMatch[1] + '元', cls: 'price' });
        }

        // 交换方向
        if (type === 'swap') {
            const haveMatch = text.match(/有[一们个把台件辆本套]?(.{1,8}?)(?:，|,|\s|想|换)/);
            const wantMatch = text.match(/想换[一们个把台件辆本套]?(.{1,8}?)(?:。|$|，|,|或者|还是)/);
            if (haveMatch) tags.push({ text: '出：' + haveMatch[1].trim(), cls: 'swap-have' });
            if (wantMatch) tags.push({ text: '求：' + wantMatch[1].trim(), cls: 'swap-want' });
        }

        // 书名
        const books = text.match(/《[^》]+》/g);
        if (books) {
            books.forEach(b => tags.push({ text: b, cls: 'item' }));
        }

        return tags;
    }

        }

        return `<div class="post-card" data-id="${post.id}">

    let uploadedImages = [];
    const MAX_IMAGES = 9;

    function openPostModal() {
        if (!requireLogin()) return;

        document.getElementById('postInput').value = '';

    function renderImgUpload() {
        const area = document.getElementById('imgUploadArea');
        const addBtn = `<div class="img-upload-add" onclick="document.getElementById('imgFileInput').click()"><span class="plus">+</span>图片</div>`;
        const items = uploadedImages.map((src, i) =>
            `<div class="img-upload-item"><img src="${src}"><button class="img-remove" onclick="removeImg(${i})">✕</button></div>`
        ).join('');
        area.innerHTML = items + (uploadedImages.length < MAX_IMAGES ? addBtn : '');
    }

    function handleImgUpload(input) {
        const files = Array.from(input.files);
        if (!files.length) return;
        const remaining = MAX_IMAGES - uploadedImages.length;
        const toProcess = files.slice(0, remaining);

        toProcess.forEach(file => {
            if (file.size > 5 * 1024 * 1024) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                compressImage(e.target.result, 800, 0.8, function(compressed) {
                    uploadedImages.push(compressed);
                    renderImgUpload();
                });
            };
            reader.readAsDataURL(file);
        });
        input.value = '';
    }

    function compressImage(dataUrl, maxW, quality, callback) {
        const img = new Image();
        img.onload = function() {
            let w = img.width, h = img.height;
            if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            callback(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = dataUrl;
    }

    function removeImg(index) {
        uploadedImages.splice(index, 1);
        renderImgUpload();
    }

    function viewImage(src) {
        document.getElementById('imgViewerSrc').src = src;
        document.getElementById('imgViewer').classList.add('show');
    }

    function selectType(type, el) {
        selectedType = type;
        document.querySelectorAll('.type-option').forEach(o => o.classList.remove('active'));
        el.classList.add('active');
        const placeholders = {
            sell: '描述你的闲置物品，如：我有一辆九成新自行车，150块出，宿舍楼下自取。',
            buy: '描述你想买什么，如：求购一台二手风扇，30以内可接受。',
            swap: '描述你的交换意向，如：我有一把吉他，想换个显示器。',
            donate: '描述你想捐赠的物品，如：我要捐出《高数》和《经济学原理》，免费送给需要的同学。'
        };
        document.getElementById('postInput').placeholder = placeholders[type];
        previewTags();
    }

    function previewTags() {
        const text = document.getElementById('postInput').value.trim();
        const container = document.getElementById('tagsPreview');
        if (!text) { container.innerHTML = ''; return; }
        const tags = generateTags(text, selectedType);
        if (tags.length === 0) { container.innerHTML = ''; return; }
        container.innerHTML = `<div class="label">AI识别标签预览：</div>` +
            tags.map(t => `<span class="tag ${t.cls}">${t.text}</span>`).join(' ');
    }

    function publishPost() {
        const text = document.getElementById('postInput').value.trim();
        if (!text) return;

        const tags = generateTags(text, selectedType);
        const newPost = {
            id: Date.now(),
            type: selectedType,
            user: { name: currentUser.name, emoji: currentUser.emoji },
            time: '刚刚',
            body: text,
            tags,
            images: uploadedImages.length > 0 ? [...uploadedImages] : [],
            likes: 0,
            liked: false,
            comments: []
        };

        posts.unshift(newPost);
        closePostModal();

        // 切到对应Tab
        const filterMap = { sell: 'sell', buy: 'buy', swap: 'swap', donate: 'all' };
        const targetFilter = filterMap[selectedType] || 'all';
        currentFilter = targetFilter;
        document.querySelectorAll('.tab').forEach(t => {
            t.classList.toggle('active', t.dataset.filter === targetFilter);
        });

        renderFeed();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ========== 搜索 ==========
    function openSearch() {
        document.getElementById('searchPanel').classList.add('show');
        document.getElementById('searchInput').value = '';
        document.getElementById('searchResults').innerHTML = '<div class="search-empty">输入关键词搜索闲置物品</div>';
        setTimeout(() => document.getElementById('searchInput').focus(), 100);
    }

    function closeSearch() {
        document.getElementById('searchPanel').classList.remove('show');
    }

    function doSearch() {
        const keyword = document.getElementById('searchInput').value.trim();
        const container = document.getElementById('searchResults');
        if (!keyword) {
            container.innerHTML = '<div class="search-empty">输入关键词搜索闲置物品</div>';
            return;
        }

        const searchTerms = expandSynonyms(keyword);

        const scoredResults = posts.map(post => {
            let score = 0;
            const body = post.body;
            const tagTexts = post.tags.map(t => t.text);

            searchTerms.forEach(term => {
                if (body.includes(term)) {
                    score += 10;
                    if (body.indexOf(term) === 0) score += 5;
                }
                tagTexts.forEach(tag => {
                    if (tag.includes(term)) {
                        score += 8;
                        if (tag.indexOf(term) === 0) score += 4;
                    }
                });
            });

            return { post, score };
        }).filter(item => item.score > 0)
          .sort((a, b) => b.score - a.score);

        if (scoredResults.length === 0) {
            container.innerHTML = `<div class="search-empty">没有找到包含"${escHtml(keyword)}"的帖子</div>`;
            return;
        }

        container.innerHTML = scoredResults.map(item => renderPostCard(item.post)).join('');
    }

    function expandSynonyms(keyword) {
        const terms = new Set([keyword]);
        for (const [main, syns] of Object.entries(synonyms)) {
            if (syns.includes(keyword)) {
                syns.forEach(s => terms.add(s));
            }
        }
        for (const term of [...terms]) {
            for (const [main, syns] of Object.entries(synonyms)) {
                if (syns.includes(term)) {
                    syns.forEach(s => terms.add(s));
                }
            }
        }
        return [...terms];
    }

    // ========== AI助手 ==========
    function openAiPanel() {
        document.getElementById('aiPanel').classList.add('show');
    }

    function closeAiPanel() {
        document.getElementById('aiPanel').classList.remove('show');
    }

    function sendAi() {
        const input = document.getElementById('aiInput');
        const text = input.value.trim();
        if (!text) return;
        input.value = '';

        const chat = document.getElementById('aiChat');

        // 用户消息
        chat.innerHTML += `<div class="ai-msg-row me">
            <div class="ai-avatar me-av">😊</div>
            <div class="ai-bubble">${escHtml(text)}</div>
        </div>`;

        // AI回复
        const reply = generateAiReply(text);
        chat.innerHTML += `<div class="ai-msg-row bot">
            <div class="ai-avatar">🤖</div>
            <div class="ai-bubble">${reply}</div>
        </div>`;

        chat.scrollTop = chat.scrollHeight;
    }

    function generateAiReply(text) {
        // 看行情
        if (/看行情|行情表|价格表/.test(text)) {
            let html = '📊 <b>校园二手行情</b>';
            const items = Object.entries(marketDB).slice(0, 8);
            items.forEach(([name, info]) => {
                html += `<div style="margin:4px 0;font-size:13px;">${name}：均价 <b>${info.avg}元</b>（${info.range}元）</div>`;
            });
            return html;
        }

        // 价格参谋
        const priceAskMatch = text.match(/(\d+)\s*[元块]/);
        let itemName = null;
        for (const [name, pattern] of Object.entries(itemPatterns)) {
            if (pattern.test(text)) { itemName = name; break; }
        }

        if (itemName && marketDB[itemName]) {
            const info = marketDB[itemName];
            const userPrice = priceAskMatch ? parseInt(priceAskMatch[1]) : null;

            if (userPrice && /能买|贵|划算|值|行不/.test(text)) {
                let verdict = '';
                if (userPrice <= info.avg * 0.8) verdict = '🟢 捡到宝了！低于均价，果断拿下！';
                else if (userPrice <= info.avg * 1.1) verdict = '🟡 价格合理，可以考虑。';
                else verdict = '🔴 偏贵了，建议砍价或再看看。';

                return `${verdict}<div class="ai-card">
                    📊 校园均价：<b>${info.avg}元</b><br>
                    📈 常见区间：${info.range}元<br>
                    💬 建议：${info.tip}<br>
                    ⚠️ 建议当面验货再付钱！
                </div>`;
            }

            return `<b>${itemName}</b>行情参考：<div class="ai-card">
                💰 均价：<b>${info.avg}元</b><br>
                📊 区间：${info.range}元<br>
                💬 建议：${info.tip}
            </div>`;
        }

        return `你可以问我：<br>• "二手自行车多少钱？"<br>• "苹果电脑3000能买吗？"<br>• "看行情"查看价格表`;
    }

    // ========== 工具 ==========
    function escHtml(str) {
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // ========== 登录系统 ==========
    let currentUser = null;
    let codeCountdown = 0;
    let pendingAction = null;

    function getStoredUser() {
        try {
            const data = localStorage.getItem('jiuwu_user');
            return data ? JSON.parse(data) : null;
        } catch { return null; }
    }

    function saveUser(user) {
        try { localStorage.setItem('jiuwu_user', JSON.stringify(user)); } catch {}
    }

    function removeUser() {
        try { localStorage.removeItem('jiuwu_user'); } catch {}
    }

    function renderUserArea() {
        const area = document.getElementById('userArea');
        if (!area) return;
        if (currentUser) {
            area.innerHTML = `<div class="user-area" onclick="openUserMenu()">
                <div class="user-avatar-sm">${currentUser.emoji || '😊'}</div>
                <span class="user-name-sm">${escHtml(currentUser.name)}</span>
            </div>`;
        } else {
            area.innerHTML = `<button class="login-btn-topbar" onclick="openLogin()">登录</button>`;
        }
    }

    function openLogin(action) {
        document.getElementById('loginOverlay').classList.add('show');
        document.getElementById('loginNickname').value = currentUser ? currentUser.name : '';
        document.getElementById('loginPhone').value = '';
        document.getElementById('loginCode').value = '';
        pendingAction = action || null;
    }

    function closeLogin() {
        document.getElementById('loginOverlay').classList.remove('show');
    }

    function sendCode() {
        const phone = document.getElementById('loginPhone').value.trim();
        if (phone.length !== 11 || !/^1\d{10}$/.test(phone)) {
            alert('请输入正确的手机号');
            return;
        }
        codeCountdown = 5;
        const btn = document.getElementById('codeBtn');
        btn.disabled = true;

        const timer = setInterval(() => {
            codeCountdown--;
            btn.textContent = codeCountdown > 0 ? `${codeCountdown}s` : '获取验证码';
            if (codeCountdown <= 0) {
                clearInterval(timer);
                btn.disabled = false;
                btn.textContent = '获取验证码';
                document.getElementById('loginCode').value = '1234';
            }
        }, 1000);
    }

    function doLogin() {
        const name = document.getElementById('loginNickname').value.trim();
        const phone = document.getElementById('loginPhone').value.trim();
        const code = document.getElementById('loginCode').value.trim();

        if (!name) { alert('请输入昵称'); return; }
        if (!phone || phone.length !== 11 || !/^1\d{10}$/.test(phone)) { alert('请输入正确的手机号'); return; }
        if (!code) { alert('请输入验证码（演示：点获取后自动填入1234）'); return; }

        const emojis = ['😊', '🎓', '💡', '⭐', '🌟', '🔥', '🎯', '🚀', '💪', '🌈'];
        currentUser = {
            id: Date.now(),
            name: name,
            phone: phone.replace(/(\d{3})\d{4}(\d{4})/, '$1****$2'),
            emoji: emojis[Math.floor(Math.random() * emojis.length)],
            createdAt: new Date().toISOString()
        };
        saveUser(currentUser);
        renderUserArea();
        closeLogin();
    }

    function requireLogin(callbackName) {
        if (currentUser) return true;
        openLogin(callbackName);
        return false;
    }

    function logout() {
        currentUser = null;
        removeUser();
        renderUserArea();
        closeUserMenu();
    }

    function openUserMenu() {
        if (!currentUser) return;
        const menu = document.getElementById('userMenu');
        menu.innerHTML = `
            <div class="user-menu-header">
                <div class="user-menu-avatar">${currentUser.emoji}</div>
                <div class="user-menu-info">
                    <div class="user-menu-name">${escHtml(currentUser.name)}</div>
                    <div class="user-menu-phone">${currentUser.phone}</div>
                </div>
            </div>
            <div class="user-menu-item"><span class="icon">📝</span> 我的发布</div>
            <div class="user-menu-item"><span class="icon">❤️</span> 我感兴趣的</div>
            <div class="user-menu-item"><span class="icon">💬</span> 我的评论</div>
            <div class="user-menu-item danger" onclick="logout()"><span class="icon">🚪</span> 退出登录</div>
        `;
        document.getElementById('userMenuOverlay').classList.add('show');
    }

    function closeUserMenu() {
        document.getElementById('userMenuOverlay').classList.remove('show');
    }

    // 点击遮罩关闭
    document.addEventListener('click', function(e) {
        const userMenuOverlay = document.getElementById('userMenuOverlay');
        if (e.target === userMenuOverlay) closeUserMenu();
        const loginOverlay = document.getElementById('loginOverlay');
        if (e.target === loginOverlay) closeLogin();
    });

    // ========== 初始化 ==========
    currentUser = getStoredUser();
    initPosts();
    renderFeed();
    renderUserArea();
    </script>
</body>
</html>
