<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>压力粉碎机</title>
<style>
  :root {
    --bg: #0a0014;
    --bg2: #120024;
    --accent: #ff2d78;
    --cyan: #00f0ff;
    --gold: #ffd700;
    --text: #e0e0ff;
    --text2: #7a7aaa;
    --success: #00f0ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", monospace;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* CRT scanline overlay */
  body::after {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 999;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px);
    animation: crtFlicker 4s linear infinite;
  }
  @keyframes crtFlicker { 0% { opacity: 0.97; } 5% { opacity: 0.95; } 10% { opacity: 0.98; } 15% { opacity: 0.96; } 20% { opacity: 1; } 80% { opacity: 1; } 82% { opacity: 0.9; } 84% { opacity: 1; } 100% { opacity: 0.98; } }
  /* Grid floor */
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: linear-gradient(rgba(255,45,120,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,45,120,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridPulse 4s ease-in-out infinite;
  }
  @keyframes gridPulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }

  /* ===== Matrix Rain ===== */
  #bgParticles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .bg-particle {
    position: absolute; border-radius: 2px;
    background: var(--accent);
    animation: rainDrop linear infinite;
    box-shadow: 0 0 6px var(--accent);
  }
  @keyframes rainDrop {
    0% { transform: translateY(-10vh) scaleY(1); opacity: 0; }
    5% { opacity: 0.8; }
    90% { opacity: 0.6; }
    100% { transform: translateY(110vh) scaleY(2.5); opacity: 0; }
  }

  /* ===== Page System ===== */
  .page { display: none; position: fixed; inset: 0; flex-direction: column; align-items: center; justify-content: center; padding: 24px; overflow-y: auto; z-index: 1; }
  .page.active { display: flex; animation: pageIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes pageIn { 0% { opacity: 0; transform: translateY(30px) scale(0.96); filter: blur(8px); } 100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }

  /* ===== Glitch Text ===== */
  @keyframes glitchText {
    0%,100% { text-shadow: 2px 0 var(--cyan), -2px 0 var(--accent); }
    25% { text-shadow: -2px 0 var(--cyan), 2px 0 var(--accent); }
    50% { text-shadow: 2px 2px var(--cyan), -2px -2px var(--accent); }
    75% { text-shadow: -2px -2px var(--cyan), 2px 2px var(--accent); }
  }

  /* ===== 1. Welcome Page ===== */
  #welcome { background: radial-gradient(ellipse at center, #1a0030 0%, #0a0014 60%); }
  #welcome h1 {
    font-size: clamp(52px, 10vw, 90px); font-weight: 900; font-family: monospace;
    color: #fff; margin-bottom: 8px; letter-spacing: 8px;
    text-shadow: 0 0 40px var(--accent), 0 0 80px var(--accent), 0 0 120px var(--accent), 0 0 10px var(--accent);
    animation: glitchText 4s infinite;
  }
  #welcome .typewriter { font-size: clamp(13px, 2.5vw, 18px); color: var(--cyan); height: 30px; margin-bottom: 48px; font-family: monospace; text-shadow: 0 0 10px var(--cyan); }
  #welcome .typewriter::after { content: '▌'; animation: blink 0.8s infinite; color: var(--accent); }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
  .btn-start {
    width: 140px; height: 140px; border-radius: 8px; border: 2px solid var(--accent);
    background: rgba(255,45,120,0.1); color: #fff; font-size: 18px; font-weight: 900;
    cursor: pointer; letter-spacing: 4px; position: relative; font-family: monospace;
    box-shadow: 0 0 30px rgba(255,45,120,0.5), 0 0 60px rgba(255,45,120,0.2), inset 0 0 30px rgba(255,45,120,0.1);
    animation: btnPulse 2s ease-in-out infinite; transition: all 0.2s;
    clip-path: polygon(10% 0, 90% 0, 100% 10%, 100% 90%, 90% 100%, 10% 100%, 0 90%, 0 10%);
  }
  .btn-start::after {
    content: ''; position: absolute; inset: -6px; clip-path: polygon(10% 0, 90% 0, 100% 10%, 100% 90%, 90% 100%, 10% 100%, 0 90%, 0 10%);
    border: 1px solid rgba(255,45,120,0.3); animation: pulseRing 2s ease-in-out infinite;
  }
  @keyframes pulseRing { 0%,100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.12); opacity: 0; } }
  @keyframes btnPulse { 0%,100% { box-shadow: 0 0 30px rgba(255,45,120,0.5), 0 0 60px rgba(255,45,120,0.2); } 50% { box-shadow: 0 0 50px rgba(255,45,120,0.8), 0 0 100px rgba(255,45,120,0.4); } }
  .btn-start:active { transform: scale(0.9); box-shadow: 0 0 60px rgba(255,45,120,1), 0 0 120px rgba(255,45,120,0.6); }

  /* ===== 2. Emotion Page ===== */
  .page-title { font-size: clamp(20px, 4vw, 28px); font-weight: 900; margin-bottom: 24px; text-align: center; letter-spacing: 2px; color: #fff; text-shadow: 0 0 20px var(--cyan); }
  .tags-wrap { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 500px; margin-bottom: 20px; }
  .tag-btn {
    padding: 10px 22px; border: 1.5px solid rgba(255,45,120,0.3);
    background: rgba(255,45,120,0.05); color: var(--text2); font-size: 14px;
    cursor: pointer; transition: all 0.3s; font-family: monospace; letter-spacing: 1px;
    clip-path: polygon(6px 0, calc(100% - 6px) 0, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 0 calc(100% - 6px), 0 6px);
  }
  .tag-btn:hover { border-color: var(--accent); background: rgba(255,45,120,0.1); color: #fff; }
  .tag-btn.selected { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 20px rgba(255,45,120,0.5); }
  .tag-btn:active { transform: scale(0.95); }
  .custom-input { display: flex; gap: 8px; margin-bottom: 16px; }
  .custom-input input {
    flex: 1; padding: 10px 16px; border: 1.5px solid rgba(0,240,255,0.3);
    background: rgba(0,240,255,0.05); color: #fff; font-size: 14px; outline: none;
    transition: border-color 0.3s; font-family: monospace; letter-spacing: 1px;
    clip-path: polygon(6px 0, calc(100% - 6px) 0, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 0 calc(100% - 6px), 0 6px);
  }
  .custom-input input:focus { border-color: var(--cyan); box-shadow: 0 0 16px rgba(0,240,255,0.3); }
  .custom-input input::placeholder { color: rgba(0,240,255,0.3); }
  .custom-input button {
    padding: 10px 20px; border: 1px solid var(--accent); background: rgba(255,45,120,0.1);
    color: var(--accent); font-size: 14px; cursor: pointer; font-family: monospace; letter-spacing: 1px;
    clip-path: polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px);
    transition: all 0.3s;
  }
  .custom-input button:hover { background: var(--accent); color: #fff; box-shadow: 0 0 16px rgba(255,45,120,0.4); }
  .selected-tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; min-height: 32px; margin-bottom: 20px; }
  .selected-tag {
    padding: 5px 14px; background: rgba(255,45,120,0.15); border: 1px solid rgba(255,45,120,0.4);
    font-size: 13px; color: var(--accent); display: flex; align-items: center; gap: 6px; cursor: pointer;
    clip-path: polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px);
  }
  .selected-tag .remove { font-size: 16px; line-height: 1; }

  /* ===== Buttons ===== */
  .btn-next {
    padding: 14px 48px; border: 2px solid rgba(255,45,120,0.2); background: transparent;
    color: var(--text2); font-size: 16px; font-weight: 900; cursor: pointer; transition: all 0.3s;
    letter-spacing: 3px; font-family: monospace;
    clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px);
  }
  .btn-next.active { border-color: var(--accent); background: rgba(255,45,120,0.1); color: #fff; box-shadow: 0 0 30px rgba(255,45,120,0.5), inset 0 0 30px rgba(255,45,120,0.05); }

  /* ===== 3. Target Page ===== */
  .cols { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; max-width: 600px; width: 100%; }
  .col { flex: 1; min-width: 200px; }
  .col-title { font-size: 13px; color: var(--cyan); margin-bottom: 12px; text-align: center; letter-spacing: 3px; font-family: monospace; text-shadow: 0 0 10px var(--cyan); }
  .emoji-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .emoji-cell {
    aspect-ratio: 1; border: 2px solid rgba(255,45,120,0.15);
    background: rgba(255,45,120,0.03); display: flex; align-items: center; justify-content: center;
    font-size: 44px; cursor: pointer; transition: all 0.3s;
    clip-path: polygon(6px 0, calc(100% - 6px) 0, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 0 calc(100% - 6px), 0 6px);
  }
  .emoji-cell:hover { border-color: var(--accent); background: rgba(255,45,120,0.08); }
  .emoji-cell.selected { border-color: var(--accent); background: rgba(255,45,120,0.15); transform: scale(1.08); box-shadow: 0 0 30px rgba(255,45,120,0.5), inset 0 0 20px rgba(255,45,120,0.1); }
  .upload-area {
    aspect-ratio: 1; border: 2px dashed rgba(0,240,255,0.2); display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.3s; overflow: hidden; background: rgba(0,240,255,0.02);
    color: var(--text2); font-size: 14px; text-align: center; flex-direction: column; gap: 8px;
    clip-path: polygon(6px 0, calc(100% - 6px) 0, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 0 calc(100% - 6px), 0 6px);
  }
  .upload-area:hover { border-color: var(--cyan); box-shadow: 0 0 20px rgba(0,240,255,0.2); }
  .upload-area.has-image { border-style: solid; border-color: var(--cyan); box-shadow: 0 0 24px rgba(0,240,255,0.3); }
  .upload-area img { width: 100%; height: 100%; object-fit: cover; }

  /* ===== 4. Weapon Page ===== */
  .weapon-grid { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; max-width: 700px; }
  .weapon-card {
    width: 150px; padding: 24px 14px; border: 2px solid rgba(255,45,120,0.15);
    background: rgba(255,45,120,0.03); text-align: center; cursor: pointer;
    transition: all 0.3s ease;
    clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);
  }
  .weapon-card:hover { transform: translateY(-6px); border-color: var(--accent); box-shadow: 0 8px 24px rgba(0,0,0,0.5), 0 0 20px rgba(255,45,120,0.2); }
  .weapon-card.selected { border-color: var(--gold); background: rgba(255,215,0,0.08); transform: scale(1.05); box-shadow: 0 0 40px rgba(255,215,0,0.4), 0 0 80px rgba(255,215,0,0.1), 0 8px 24px rgba(0,0,0,0.5); }
  .weapon-card.dimmed { opacity: 0.3; transform: scale(0.93); filter: grayscale(0.7); }
  .weapon-emoji { font-size: 56px; margin-bottom: 10px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4)); display: flex; align-items: center; justify-content: center; min-height: 60px; }
  .weapon-name { font-size: 15px; font-weight: 900; margin-bottom: 4px; letter-spacing: 1px; }
  .weapon-desc { font-size: 12px; color: var(--text2); font-family: monospace; }
  .weapon-effect { font-size: 11px; color: var(--cyan); margin-top: 4px; font-family: monospace; text-shadow: 0 0 8px var(--cyan); }

  /* ===== 5. Game Page ===== */
  #game { background: #050010; justify-content: flex-start; padding-top: 12px; }
  .game-hud {
    width: 100%; max-width: 500px; display: flex; justify-content: space-between; align-items: center;
    padding: 10px 20px; margin-bottom: 8px;
    background: rgba(0,0,0,0.6); border: 1px solid rgba(0,240,255,0.2);
    clip-path: polygon(6px 0, calc(100% - 6px) 0, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 0 calc(100% - 6px), 0 6px);
    box-shadow: 0 0 20px rgba(0,240,255,0.1), inset 0 0 20px rgba(0,240,255,0.03);
  }
  .hud-score { font-size: 14px; color: var(--cyan); font-family: monospace; text-shadow: 0 0 12px var(--cyan); letter-spacing: 1px; }
  .hud-score span { font-size: 32px; font-weight: 900; font-family: monospace; }
  .hud-timer { font-size: 14px; color: var(--text2); font-family: monospace; }
  .hud-timer span { font-size: 32px; font-weight: 900; font-family: monospace; color: var(--accent); text-shadow: 0 0 12px var(--accent); }
  .game-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; width: min(400px, 90vmin); padding: 0 8px; }
  .hole {
    aspect-ratio: 1; border-radius: 4px;
    background: radial-gradient(circle at 50% 60%, #1a0030 20%, #0a0014 70%);
    display: flex; align-items: center; justify-content: center; position: relative;
    cursor: pointer; overflow: visible; box-shadow: inset 0 6px 20px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,45,120,0.1);
    min-width: 44px; min-height: 44px; transition: box-shadow 0.2s;
    clip-path: polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px);
  }
  .hole:active { box-shadow: inset 0 4px 12px rgba(0,0,0,0.9), 0 0 0 2px var(--accent); }
  .mole {
    position: absolute; width: 80%; height: 80%; border-radius: 4px; display: flex;
    align-items: center; justify-content: center; font-size: 52px;
    transition: transform 0.1s ease; cursor: pointer;
    background: rgba(255,45,120,0.08); box-shadow: 0 6px 24px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,45,120,0.2), 0 0 16px rgba(255,45,120,0.1);
    animation: popUp 0.25s ease-out;
    z-index: 2; clip-path: polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px);
  }
  .mole img { width: 100%; height: 100%; object-fit: cover; border-radius: 2px; }
  @keyframes popUp { 0% { transform: translateY(70%) scale(0.1); opacity: 0; } 50% { transform: translateY(-8%) scale(1.08); } 100% { transform: translateY(0) scale(1); opacity: 1; } }
  .mole.hit { animation: glitchSquish 0.3s ease-in forwards; }
  @keyframes glitchSquish {
    0% { transform: scale(1.4, 1.4); filter: brightness(3); }
    15% { transform: scale(1.1, 0.8) translateX(-4px); filter: hue-rotate(90deg); }
    30% { transform: scale(1.3, 0.4) translateX(4px); filter: brightness(2); }
    60% { transform: scale(0.8, 0.1); opacity: 0.5; }
    100% { transform: scale(0.3, 0.02); opacity: 0; filter: blur(4px); }
  }
  .mole.taunt { animation: tauntAnim 0.5s ease-in forwards; }
  @keyframes tauntAnim { 0% { transform: rotate(0); } 30% { transform: rotate(18deg) scale(1.15); } 60% { transform: rotate(-12deg) scale(1.05); } 100% { transform: rotate(0) scale(0.2); opacity: 0; } }

  /* Impact ring */
  .impact-ring { position: fixed; border-radius: 4px; border: 2px solid var(--cyan); pointer-events: none; z-index: 99; animation: impactExpand 0.5s ease-out forwards; box-shadow: 0 0 10px var(--cyan); }
  @keyframes impactExpand { 0% { width: 10px; height: 10px; opacity: 1; } 100% { width: 140px; height: 140px; opacity: 0; } }

  /* Hit particles - pixel squares */
  .hit-particle { position: fixed; pointer-events: none; z-index: 99; animation: pixelBurst 0.5s ease-out forwards; }
  @keyframes pixelBurst {
    0% { opacity: 1; transform: translate(0, 0) scale(1) rotate(0deg); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0) rotate(180deg); }
  }

  .float-text { position: fixed; font-size: 36px; font-weight: 900; color: var(--cyan); pointer-events: none; z-index: 100; animation: glitchFloat 0.7s ease-out forwards; font-family: monospace; text-shadow: 0 0 20px var(--cyan), 0 0 40px var(--cyan); }
  @keyframes glitchFloat { 0% { opacity: 1; transform: translateY(0) scale(0.3); filter: hue-rotate(0); } 20% { transform: translateY(-15px) scale(1.4) translateX(-3px); filter: hue-rotate(30deg); } 40% { transform: translateY(-30px) scale(1.2) translateX(3px); } 100% { opacity: 0; transform: translateY(-80px) scale(1.6); filter: blur(2px); } }
  .pa-text { position: fixed; font-size: 52px; font-weight: 900; color: var(--accent); pointer-events: none; z-index: 100; animation: paFly 0.7s ease-out forwards; font-family: monospace; text-shadow: 0 0 30px var(--accent); }
  @keyframes paFly { 0% { opacity: 1; transform: translate(0,0) rotate(0deg) scale(0.3); } 50% { transform: translate(-20px,-40px) rotate(25deg) scale(1.5); filter: hue-rotate(60deg); } 100% { opacity: 0; transform: translate(30px,-80px) rotate(-20deg) scale(2); } }
  .game-shake { animation: shake 0.3s ease-out; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 10% { transform: translateX(-10px) translateY(3px); } 20% { transform: translateX(10px) translateY(-3px); } 30% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 50% { transform: translateX(-5px); } 60% { transform: translateX(5px); } 70% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
  .flash-overlay { position: fixed; inset: 0; background: rgba(255,45,120,0.3); pointer-events: none; z-index: 50; animation: flashFade 0.25s ease-out forwards; }
  @keyframes flashFade { 0% { opacity: 1; } 100% { opacity: 0; } }
  .game-start-overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center; z-index: 10;
    font-size: 24px; font-weight: 900; cursor: pointer; letter-spacing: 6px; font-family: monospace;
    color: var(--cyan); text-shadow: 0 0 20px var(--cyan);
    animation: overlayPulse 2s ease-in-out infinite;
    clip-path: polygon(6px 0, calc(100% - 6px) 0, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 0 calc(100% - 6px), 0 6px);
  }
  @keyframes overlayPulse { 0%,100% { background: rgba(0,0,0,0.8); } 50% { background: rgba(10,0,30,0.7); } }
  .game-preview { display: flex; align-items: center; gap: 12px; margin-top: 16px; font-size: 14px; color: var(--text2); font-family: monospace; }
  .game-preview .preview-icon { font-size: 32px; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5)); }
  .combo-text { position: fixed; top: 40%; left: 50%; transform: translate(-50%,-50%); font-size: clamp(32px, 7vw, 56px); font-weight: 900; color: var(--gold); pointer-events: none; z-index: 100; animation: comboPop 0.9s ease-out forwards; font-family: monospace; text-shadow: 0 0 40px var(--gold), 0 0 80px var(--gold); }
  @keyframes comboPop { 0% { opacity: 0; transform: translate(-50%,-50%) scale(0.2); filter: blur(10px); } 25% { opacity: 1; transform: translate(-50%,-50%) scale(1.3); filter: blur(0); } 100% { opacity: 0; transform: translate(-50%,-50%) scale(1.8); filter: blur(4px); } }

  /* ===== 6. Result Page ===== */
  #result { gap: 16px; }
  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .confetti-piece { position: absolute; width: 8px; height: 8px; animation: confettiFall linear forwards; }
  @keyframes confettiFall { 0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
  .result-card {
    background: rgba(10,0,20,0.95); border: 1px solid rgba(255,45,120,0.3);
    color: var(--text); border-radius: 4px; padding: 32px 24px;
    max-width: 400px; width: 100%; text-align: center; position: relative; z-index: 1;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 40px rgba(255,45,120,0.15), inset 0 0 60px rgba(255,45,120,0.03);
    clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);
  }
  .result-card .score-big { font-size: 72px; font-weight: 900; color: var(--cyan); font-family: monospace; text-shadow: 0 0 30px var(--cyan), 0 0 60px var(--cyan); }
  .result-card .stat-row { display: flex; justify-content: space-around; margin: 16px 0; font-size: 14px; }
  .result-card .stat-row .stat-val { font-size: 24px; font-weight: 900; font-family: monospace; color: var(--accent); }
  .result-card .rating { font-size: 22px; font-weight: 900; color: var(--gold); margin: 8px 0; text-shadow: 0 0 12px var(--gold); }
  .result-card .summary { font-size: 14px; color: var(--text2); margin: 8px 0 16px; font-family: monospace; }
  .result-card .stress-tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 16px; }

  score: 0,
  hits: 0,
  totalAppears: 0,
  combo: 0,
  maxCombo: 0,
  gameRunning: false,
  gameTimer: null,
  spawnTimer: null,
  timeLeft: 60,
  activeMole: null,
};

// ==================== INIT ====================
function init() {
  // Load persisted state
  loadState();

  // Spawn background particles
  spawnBgParticles();

  // Typewriter
  typewriterEffect('打它不是为了分，是为了听它求饶。', 'typewriter', 80);

  // Stress tags
  const tagsWrap = document.getElementById('stressTags');
  STRESS_OPTIONS.forEach(s => {
    const btn = document.createElement('div');
    btn.className = 'tag-btn';
    btn.textContent = s;
    if (state.stresses.includes(s)) btn.classList.add('selected');
    btn.onclick = () => toggleStress(s, btn);
    tagsWrap.appendChild(btn);
  });

  // Restore custom stresses
  state.stresses.forEach(s => {
    if (!STRESS_OPTIONS.includes(s)) {
      const btn = document.createElement('div');
      btn.className = 'tag-btn selected';
      btn.textContent = s;
      btn.onclick = () => toggleStress(s, btn);
      tagsWrap.appendChild(btn);
    }
  });

  updateSelectedTags();
  updateEmotionNext();

  // Emoji targets
  const emojiGrid = document.getElementById('emojiTargets');
  EMOJI_TARGETS.forEach(t => {
    const cell = document.createElement('div');
    cell.className = 'emoji-cell';
    if (state.target.type === 'emoji' && state.target.emoji === t.emoji) cell.classList.add('selected');
    cell.textContent = t.emoji;
    cell.title = t.label;
    cell.onclick = () => selectEmojiTarget(t, cell);
    emojiGrid.appendChild(cell);
  });

  // Restore target next button
  if (state.target.type) document.getElementById('btnTargetNext').classList.add('active');

  // Weapon cards
  const weaponGrid = document.getElementById('weaponGrid');
  WEAPONS.forEach(w => {
    const card = document.createElement('div');
    card.className = 'weapon-card';
    card.innerHTML = `<div class="weapon-emoji">${w.emoji}</div><div class="weapon-name">${w.name}</div><div class="weapon-desc">${w.desc}</div><div class="weapon-effect">${w.effect}</div>`;
    card.onclick = () => selectWeapon(w, card);
    weaponGrid.appendChild(card);
  });

  // Restore weapon selection
  if (state.weapon) {
    const cards = document.querySelectorAll('.weapon-card');
    WEAPONS.forEach((w, i) => {
      if (w.id === state.weapon.id) {
        cards[i].classList.add('selected');
        document.getElementById('btnWeaponNext').classList.add('active');
      } else {
        cards[i].classList.add('dimmed');
      }
    });
  }

  // Game grid
  const grid = document.getElementById('gameGrid');
  for (let i = 0; i < 9; i++) {
    const hole = document.createElement('div');
    hole.className = 'hole';
    hole.dataset.index = i;
    grid.appendChild(hole);
  }

  // Enter key for custom stress
  document.getElementById('customStress').addEventListener('keydown', e => {
    if (e.key === 'Enter') addCustomStress();
  });
}

function typewriterEffect(text, elId, speed) {
  const el = document.getElementById(elId);
  let i = 0;
  el.textContent = '';
  const timer = setInterval(() => {
    el.textContent += text[i];
    i++;
    if (i >= text.length) clearInterval(timer);
  }, speed);
}

// ==================== PAGE NAVIGATION ====================
function goTo(pageName) {
  // Validate
  if (pageName === 'target' && state.stresses.length === 0) return;
  if (pageName === 'weapon' && !state.target.type) return;
  if (pageName === 'game' && !state.weapon) return;

  // Clear game timers if leaving game
  if (state.gameRunning) {
    clearInterval(state.gameTimer);
    clearTimeout(state.spawnTimer);
    clearActiveMole();
    state.gameRunning = false;
  }

  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const page = document.getElementById(pageName);
  page.classList.add('active');

  if (pageName === 'target') {
    // Auto-select emoji if stress matches
    const firstStress = state.stresses[0];
    const match = EMOJI_TARGETS.find(t => t.label === firstStress);
    if (match) {
      const cells = document.querySelectorAll('#emojiTargets .emoji-cell');
      EMOJI_TARGETS.forEach((t, i) => {
        if (t.label === firstStress) selectEmojiTarget(t, cells[i]);
      });
    }
  }

  if (pageName === 'game') startGame();
}

function startJourney() {
  state = { stresses: [], target: { type: null, emoji: null, image: null }, weapon: null, score: 0, hits: 0, totalAppears: 0, combo: 0, maxCombo: 0, gameRunning: false, gameTimer: null, spawnTimer: null, timeLeft: 60, activeMole: null };
  try { localStorage.removeItem('stressCrusher_state'); } catch(e) {}
  resetEmotionUI();
  resetTargetUI();
  resetWeaponUI();
  goToPage('emotion');
}

function goToPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(name).classList.add('active');
}

// ==================== EMOTION ====================
function toggleStress(name, btn) {
  const idx = state.stresses.indexOf(name);
  if (idx >= 0) {
    state.stresses.splice(idx, 1);
    btn.classList.remove('selected');
  } else {
    if (state.stresses.length >= 3) return;
    state.stresses.push(name);
    btn.classList.add('selected');
  }
  updateSelectedTags();
  updateEmotionNext();
  saveState();
}

function addCustomStress() {
  const input = document.getElementById('customStress');
  const val = input.value.trim();
  if (!val) return;
  if (state.stresses.length >= 3) return;
  if (state.stresses.includes(val)) return;
  state.stresses.push(val);
  input.value = '';

  // Add as tag button if not exists
  const existing = Array.from(document.querySelectorAll('#stressTags .tag-btn')).find(b => b.textContent === val);
  if (!existing) {
    const tagsWrap = document.getElementById('stressTags');
    const btn = document.createElement('div');
    btn.className = 'tag-btn selected';
    btn.textContent = val;
    btn.onclick = () => toggleStress(val, btn);
    tagsWrap.appendChild(btn);
  }

  updateSelectedTags();
  updateEmotionNext();
  saveState();
}

function updateSelectedTags() {
  const container = document.getElementById('selectedTags');
  container.innerHTML = state.stresses.map(s => 
    `<span class="selected-tag" onclick="removeStress('${s}')">${s} <span class="remove">×</span></span>`
  ).join('');
}

function removeStress(name) {
  state.stresses = state.stresses.filter(s => s !== name);
  const btn = Array.from(document.querySelectorAll('#stressTags .tag-btn')).find(b => b.textContent === name);
  if (btn) btn.classList.remove('selected');
  updateSelectedTags();
  updateEmotionNext();
  saveState();
}

function updateEmotionNext() {
  const btn = document.getElementById('btnEmotionNext');
  if (state.stresses.length > 0) btn.classList.add('active');
  else btn.classList.remove('active');
}

function resetEmotionUI() {
  document.querySelectorAll('#stressTags .tag-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('selectedTags').innerHTML = '';
  document.getElementById('customStress').value = '';
  document.getElementById('btnEmotionNext').classList.remove('active');
}

// ==================== TARGET ====================
function selectEmojiTarget(t, cell) {
  state.target = { type: 'emoji', emoji: t.emoji, image: null };
  document.querySelectorAll('#emojiTargets .emoji-cell').forEach(c => c.classList.remove('selected'));
  cell.classList.add('selected');
  document.getElementById('uploadArea').classList.remove('has-image');
  document.getElementById('uploadArea').innerHTML = '<span style="font-size:32px;">📷</span><span>点击上传<br>JPG/PNG</span>';
  document.getElementById('btnTargetNext').classList.add('active');
  saveState();
}

function handleImageUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) { alert('图片不能超过2MB'); return; }
  const reader = new FileReader();
  reader.onload = e => {
    state.target = { type: 'image', emoji: null, image: e.target.result };
    document.querySelectorAll('#emojiTargets .emoji-cell').forEach(c => c.classList.remove('selected'));
    const area = document.getElementById('uploadArea');
    area.classList.add('has-image');
    area.innerHTML = `<img src="${e.target.result}" alt="target">`;
    document.getElementById('btnTargetNext').classList.add('active');
    saveState();
  };
  reader.readAsDataURL(file);
}

function resetTargetUI() {
  document.querySelectorAll('#emojiTargets .emoji-cell').forEach(c => c.classList.remove('selected'));
  const area = document.getElementById('uploadArea');
  area.classList.remove('has-image');
  area.innerHTML = '<span style="font-size:32px;">📷</span><span>点击上传<br>JPG/PNG</span>';
  document.getElementById('btnTargetNext').classList.remove('active');
  document.getElementById('fileInput').value = '';
}

// ==================== WEAPON ====================
function selectWeapon(w, card) {
  state.weapon = w;
  document.querySelectorAll('.weapon-card').forEach(c => {
    c.classList.remove('selected', 'dimmed');
    if (c !== card) c.classList.add('dimmed');
  });
  card.classList.add('selected');
  card.classList.remove('dimmed');
  document.getElementById('btnWeaponNext').classList.add('active');
  saveState();
}

function resetWeaponUI() {
  document.querySelectorAll('.weapon-card').forEach(c => c.classList.remove('selected', 'dimmed'));
  document.getElementById('btnWeaponNext').classList.remove('active');
}

// ==================== GAME ====================
function startGame() {
  // Reset game state
  state.score = 0;
  state.hits = 0;
  state.totalAppears = 0;
  state.combo = 0;
  state.maxCombo = 0;
  state.timeLeft = 60;
  state.gameRunning = false;
  state.activeMole = null;

  // Update UI
  document.getElementById('scoreDisplay').textContent = '0';
  document.getElementById('timerDisplay').textContent = '60';
  document.getElementById('weaponPreview').textContent = state.weapon.emoji;
  const tp = document.getElementById('targetPreview');
  if (state.target.type === 'image') {
    tp.innerHTML = `<img src="${state.target.image}" style="width:28px;height:28px;border-radius:2px;object-fit:cover;">`;
  } else {
    tp.textContent = state.target.emoji;
  }

  // Clear holes
  document.querySelectorAll('.hole').forEach(h => h.innerHTML = '');

  // Add start overlay
  const grid = document.getElementById('gameGrid');
  let overlay = document.getElementById('startOverlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'startOverlay';
    overlay.className = 'game-start-overlay';
    overlay.textContent = '👆 点击开始游戏';
    grid.parentElement.style.position = 'relative';
    grid.parentElement.appendChild(overlay);
  }
  overlay.style.display = 'flex';
  overlay.onclick = () => {
    overlay.style.display = 'none';
    state.gameRunning = true;
    // Init speech on user interaction
    if (window.speechSynthesis) {
      const u = new SpeechSynthesisUtterance('');
      u.volume = 0;
      speechSynthesis.speak(u);
    }
    runGameLoop();
  };
}

function runGameLoop() {
  if (!state.gameRunning) return;

  // Timer
  state.gameTimer = setInterval(() => {
    state.timeLeft--;
    document.getElementById('timerDisplay').textContent = state.timeLeft;
    if (state.timeLeft <= 0) {
      endGame();
    }
  }, 1000);

  // Spawn moles
  spawnMole();
}

function spawnMole() {
  if (!state.gameRunning) return;

  // Clear previous mole
  clearActiveMole();

  // Pick random hole
  const holes = document.querySelectorAll('.hole');
  const emptyHoles = Array.from(holes).filter(h => !h.querySelector('.mole'));
  if (emptyHoles.length === 0) {
    state.spawnTimer = setTimeout(spawnMole, 500);
    return;
  }

  const hole = emptyHoles[Math.floor(Math.random() * emptyHoles.length)];
  const mole = document.createElement('div');
  mole.className = 'mole';
  mole.style.cursor = `url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><text font-size="28" y="26">${state.weapon.emoji}</text></svg>') 16 16, auto`;

  if (state.target.type === 'image') {
    mole.innerHTML = `<img src="${state.target.image}" alt="target">`;
  } else {
    mole.textContent = state.target.emoji;
  }

  mole.onclick = (e) => {
    e.stopPropagation();
    if (!state.gameRunning) return;
    hitMole(mole, hole, e);
  };

  hole.appendChild(mole);
  state.activeMole = { mole, hole };
  state.totalAppears++;

  // Auto-hide after 1.5s
  const hideTimer = setTimeout(() => {
    if (state.activeMole && state.activeMole.mole === mole && state.gameRunning) {
      missMole(mole, hole);
    }
  }, 1500);

  mole._hideTimer = hideTimer;

  // Schedule next spawn
  const delay = 1000 + Math.random() * 1000;
  state.spawnTimer = setTimeout(spawnMole, delay);
}

function hitMole(mole, hole, event) {
  clearTimeout(mole._hideTimer);
  state.hits++;
  state.combo++;
  if (state.combo > state.maxCombo) state.maxCombo = state.combo;
  const points = state.weapon.points;
  state.score += points;

  // Update HUD
  document.getElementById('scoreDisplay').textContent = state.score;

  // Squish animation
  mole.classList.add('hit');

  // Impact ring at hit position
  showImpactRing(event.clientX, event.clientY);

  // Hit particles
  showHitParticles(event.clientX, event.clientY);

  // Float text
  showFloatText(event, `+${points}`);

  // Screen shake for all weapons
  const grid = document.getElementById('gameGrid');
  grid.classList.add('game-shake');
  setTimeout(() => grid.classList.remove('game-shake'), 350);

  // Weapon-specific effects
  applyWeaponEffect(event, mole);

  // Hit sound
  playHitSound();

  // Combo effects
  if (state.combo === 3) showComboText('三连击！');
  if (state.combo === 5) showComboText('五连绝世！');
  if (state.combo === 10) showComboText('🔥 十连暴走！');

  // Plead voice (queued)
  speak(getRandomPlead());

  // Remove after animation
  setTimeout(() => {
    if (mole.parentNode) mole.remove();
    state.activeMole = null;
  }, 250);
}

function missMole(mole, hole) {
  state.combo = 0;
  mole.classList.add('taunt');
  if (state.target.type === 'emoji') mole.textContent = '😜';
  speak(getRandomTaunt());
  setTimeout(() => {
    if (mole.parentNode) mole.remove();
    state.activeMole = null;
  }, 500);
}

function clearActiveMole() {
  if (state.activeMole) {
    const { mole } = state.activeMole;
    clearTimeout(mole._hideTimer);
    if (mole.parentNode) mole.remove();
    state.activeMole = null;
    state.combo = 0;
  }
}

function applyWeaponEffect(event, mole) {
  switch (state.weapon.id) {
    case 'mace':
      // Extra flash for mace
      const flash = document.createElement('div');
      flash.className = 'flash-overlay';
      document.body.appendChild(flash);
      setTimeout(() => flash.remove(), 300);
      break;
    case 'slipper':
      const pa = document.createElement('div');
      pa.className = 'pa-text';
      pa.textContent = '啪';
      pa.style.left = event.clientX - 24 + 'px';
      pa.style.top = event.clientY - 24 + 'px';
      document.body.appendChild(pa);
      setTimeout(() => pa.remove(), 700);
      break;
    case 'wand':
      const randomEmojis = ['🐷', '🐸', '🦄', '🐔', '🐵', '🦊'];
      const orig = mole.textContent;
      mole.textContent = randomEmojis[Math.floor(Math.random() * randomEmojis.length)];
      setTimeout(() => { mole.textContent = orig; }, 500);
      break;
  }
}

function showFloatText(event, text) {
  const el = document.createElement('div');
  el.className = 'float-text';
  el.textContent = text;
  el.style.left = event.clientX - 20 + 'px';
  el.style.top = event.clientY - 20 + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 800);
}

function showComboText(text) {
  const el = document.createElement('div');
  el.className = 'combo-text';
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 800);
}

function getRandomPlead() {
  const stress = state.stresses[0];
  const pool = PLEADS[stress] || PLEADS['通用'];
  return pool[Math.floor(Math.random() * pool.length)];
}

function getRandomTaunt() {
  return TAUNTS[Math.floor(Math.random() * TAUNTS.length)];
}

function showImpactRing(x, y) {
  const ring = document.createElement('div');
  ring.className = 'impact-ring';
  ring.style.left = (x - 60) + 'px';
  ring.style.top = (y - 60) + 'px';
  document.body.appendChild(ring);
  setTimeout(() => ring.remove(), 500);
}

function showHitParticles(x, y) {
  const colors = ['#ff2d78', '#00f0ff', '#ffd700', '#fff'];
  for (let i = 0; i < 10; i++) {
    const p = document.createElement('div');
    p.className = 'hit-particle';
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    const size = 4 + Math.random() * 8;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.boxShadow = '0 0 6px ' + p.style.background;
    const angle = Math.random() * Math.PI * 2;
    const dist = 30 + Math.random() * 60;
    p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 500);
  }
}

// ==================== AUDIO ====================
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  return audioCtx;
}

function playHitSound() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const t = ctx.currentTime;
  // 8-bit arcade hit: quick frequency sweep with noise burst
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.type = 'square';
  osc.frequency.setValueAtTime(800, t);
  osc.frequency.exponentialRampToValueAtTime(200, t + 0.06);
  osc.frequency.setValueAtTime(400, t + 0.06);
  osc.frequency.exponentialRampToValueAtTime(80, t + 0.12);
  gain.gain.setValueAtTime(0.25, t);
  gain.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
  osc.start(t);
  osc.stop(t + 0.12);
}

// ==================== VOICE QUEUE ====================
let chineseVoice = null;

function initVoices() {
  if (!window.speechSynthesis) return;
  const voices = speechSynthesis.getVoices();
  chineseVoice = voices.find(v => v.lang.startsWith('zh-CN')) || voices.find(v => v.lang.startsWith('zh')) || null;
}
if (window.speechSynthesis) {
  speechSynthesis.onvoiceschanged = initVoices;
  initVoices();
}

let voiceQueue = [];
let isSpeaking = false;

function speak(text) {
  if (!window.speechSynthesis) return;
  voiceQueue.push(text);
  if (!isSpeaking) processVoiceQueue();
}

function processVoiceQueue() {
  if (voiceQueue.length === 0) { isSpeaking = false; return; }
  isSpeaking = true;
  const text = voiceQueue.shift();
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN';
  u.rate = 1.5;
  u.pitch = 1.0;
  u.volume = 1;
  if (chineseVoice) u.voice = chineseVoice;
  u.onend = () => processVoiceQueue();
  u.onerror = () => processVoiceQueue();
  speechSynthesis.speak(u);
}

function endGame() {
  state.gameRunning = false;
  clearInterval(state.gameTimer);
  clearTimeout(state.spawnTimer);
  clearActiveMole();
  voiceQueue = [];
  isSpeaking = false;
  if (window.speechSynthesis) speechSynthesis.cancel();

  // Save high score
  saveHighScore(state.score);

  // Calculate stats
  const hitRate = state.totalAppears > 0 ? Math.round((state.hits / state.totalAppears) * 100) : 0;
  let rating;
  if (state.score <= 100) rating = '初级打工人 — 还需努力';
  else if (state.score <= 300) rating = '暴躁老哥 — 有点东西';
  else if (state.score <= 500) rating = '解压大师 — 压力见了你都跑';
  else rating = '情绪掌控者 — 你已经无敌了';

  const summary = SUMMARIES[Math.floor(Math.random() * SUMMARIES.length)];

  // Update result page
  animateScore(0, state.score, document.getElementById('resultScore'));
  document.getElementById('resultHitRate').textContent = hitRate + '%';
  document.getElementById('resultCombo').textContent = state.maxCombo;
  document.getElementById('resultBest').textContent = getHighScore();
  document.getElementById('resultRating').textContent = rating;
  document.getElementById('resultSummary').textContent = summary;
  document.getElementById('resultStressTags').innerHTML = state.stresses.map(s => `<span>${s}</span>`).join('');

  // Certificate data
  document.getElementById('certStress').textContent = state.stresses.join('、');
  document.getElementById('certRating').textContent = rating.split(' —')[0];
  document.getElementById('certDate').textContent = new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });

  // Show result page
  goToPage('result');

  // Confetti
  spawnConfetti();
}

// Animate score increment
function animateScore(from, to, el, duration = 800) {
  const startTime = performance.now();
  function step(timestamp) {
    const progress = Math.min((timestamp - startTime) / duration, 1);
    const current = Math.floor(from + (to - from) * easeOutCubic(progress));
    el.textContent = current;
    if (progress < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function easeOutCubic(t) {
  return 1 - Math.pow(1 - t, 3);
}

function spawnBgParticles() {
  const container = document.getElementById('bgParticles');
  container.innerHTML = '';
  const colors = ['#ff2d78', '#00f0ff', '#ffd700', '#ff2d78'];
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'bg-particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.top = -(Math.random() * 120) + '%';
    p.style.width = (1 + Math.random() * 3) + 'px';
    p.style.height = (8 + Math.random() * 20) + 'px';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDuration = (3 + Math.random() * 6) + 's';
    p.style.animationDelay = Math.random() * 5 + 's';
    p.style.opacity = (0.3 + Math.random() * 0.5);
    container.appendChild(p);
  }
}

function spawnConfetti() {
  const container = document.getElementById('confetti');
  container.innerHTML = '';
  const colors = ['#ff2d78', '#ffd700', '#00f0ff', '#ff2d78', '#ffd700', '#00f0ff', '#fff'];
  for (let i = 0; i < 60; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDuration = (2 + Math.random() * 3) + 's';
    piece.style.animationDelay = Math.random() * 1.5 + 's';
    piece.style.width = (6 + Math.random() * 10) + 'px';
    piece.style.height = (6 + Math.random() * 10) + 'px';
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    container.appendChild(piece);
  }
}

function replay() {
  document.getElementById('confetti').innerHTML = '';
  goToPage('weapon');
}

function showCert() {
  document.getElementById('certModal').classList.add('show');
}

function closeCert() {
  document.getElementById('certModal').classList.remove('show');
}

document.getElementById('certModal').addEventListener('click', function(e) {
  if (e.target === this) closeCert();
});

// ==================== PERSISTENCE ====================
function saveState() {
  const data = {
    stresses: state.stresses,
    target: state.target.type === 'image' ? { type: 'image', emoji: null, image: null } : state.target,
    weapon: state.weapon ? { id: state.weapon.id } : null,
  };
  try { localStorage.setItem('stressCrusher_state', JSON.stringify(data)); } catch(e) {}
}

function loadState() {
  try {
    const raw = localStorage.getItem('stressCrusher_state');
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data.stresses) state.stresses = data.stresses;
    if (data.weapon) state.weapon = WEAPONS.find(w => w.id === data.weapon.id) || null;
    if (data.target) {
      if (data.target.type === 'emoji' && data.target.emoji) {
        state.target = { type: 'emoji', emoji: data.target.emoji, image: null };
      }
    }
  } catch(e) {}
}

function saveHighScore(score) {
  try {
    const best = parseInt(localStorage.getItem('stressCrusher_highScore') || '0');
    if (score > best) localStorage.setItem('stressCrusher_highScore', score);
  } catch(e) {}
}

function getHighScore() {
  try { return parseInt(localStorage.getItem('stressCrusher_highScore') || '0'); } catch(e) { return 0; }
}

// ==================== BOOT ====================
init();
</script>
