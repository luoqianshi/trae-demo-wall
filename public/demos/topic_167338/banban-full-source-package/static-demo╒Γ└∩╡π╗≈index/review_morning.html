<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="mock-api.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伴伴 · 早间简报</title>
<link rel="stylesheet" href="figma-design-system.css">
<style>
  /* ==================== 早间简报页专属样式 ==================== */
  .morning-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 8px 32px 24px;
  }

  .app-main { display: flex; flex-direction: column; }
  .morning-wrap { display: flex; flex-direction: column; flex: 1; overflow: hidden; }

  /* ---- 蓝色小标签 ---- */
  .section-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 14px;
    background: var(--accent);
    color: #fff;
    border-radius: var(--r-pill);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.2px;
    font-family: 'Inter', var(--font-sans);
    box-shadow: 0 2px 8px rgba(47, 128, 237, 0.25);
  }

  /* ---- 中心太阳区 ---- */
  .sun-hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 18px 0 8px;
    animation: slideUp 0.6s ease-out both;
  }
  .sun-wrap {
    position: relative;
    width: 120px;
    height: 120px;
    margin-bottom: 18px;
    animation: floatY 4s ease-in-out infinite;
  }
  .sun-core {
    position: absolute;
    inset: 28px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #FFE680 0%, #FFB84D 55%, #FF9A3D 100%);
    box-shadow: 0 0 36px rgba(255, 184, 77, 0.55), 0 0 70px rgba(255, 154, 61, 0.25);
    animation: sunPulse 4s ease-in-out infinite;
  }
  @keyframes sunPulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 36px rgba(255,184,77,0.55), 0 0 70px rgba(255,154,61,0.25); }
    50% { transform: scale(1.05); box-shadow: 0 0 46px rgba(255,184,77,0.7), 0 0 90px rgba(255,154,61,0.35); }
  }
  .sun-rays {
    position: absolute;
    inset: 0;
    animation: sunRotate 40s linear infinite;
  }
  @keyframes sunRotate { to { transform: rotate(360deg); } }
  .sun-ray {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 4px;
    height: 18px;
    margin-left: -2px;
    margin-top: -60px;
    background: linear-gradient(180deg, #FFB84D, rgba(255,184,77,0));
    border-radius: 4px;
    transform-origin: 2px 60px;
  }

  .morning-greet {
    font-size: 15px;
    font-weight: 600;
    color: #F59E0B;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  .morning-title {
    font-family: 'MiSans VF', var(--font-sans);
    font-size: 40px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -0.5px;
    line-height: 1.15;
  }
  .morning-title .accent { color: var(--accent); }

  /* ---- AI 寄语卡片 ---- */
  .quote-card {
    position: relative;
    margin: 24px auto 0;
    max-width: 620px;
    background: linear-gradient(135deg, #E5F2FF 0%, #F0F7FF 100%);
    border: 1px solid rgba(47, 128, 237, 0.12);
    border-radius: var(--r-2xl);
    padding: 26px 32px 24px 44px;
    box-shadow: var(--shadow-card);
    animation: slideUp 0.6s ease-out 0.1s both;
  }
  .quote-mark {
    position: absolute;
    top: 12px;
    left: 16px;
    font-size: 52px;
    line-height: 1;
    font-family: Georgia, serif;
    color: var(--accent);
    opacity: 0.35;
  }
  .quote-text {
    font-family: 'MiSans VF', var(--font-sans);
    font-size: 19px;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.7;
    letter-spacing: 0.2px;
  }
  .quote-foot {
    margin-top: 12px;
    font-size: 12px;
    color: var(--accent);
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* ---- 能量时段分析 ---- */
  .energy-section {
    margin: 26px 0 0;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 22px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--r-xl);
    box-shadow: var(--shadow-sm);
    animation: slideUp 0.6s ease-out 0.15s both;
  }
  .energy-icon {
    width: 42px; height: 42px;
    border-radius: var(--r-md);
    background: linear-gradient(135deg, #FFF3E0, #FFE0B2);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .energy-text { flex: 1; }
  .energy-label {
    font-size: 12px;
    color: var(--text-tertiary);
    font-weight: 500;
    margin-bottom: 2px;
  }
  .energy-value {
    font-size: 15px;
    color: var(--text-primary);
    font-weight: 600;
    line-height: 1.5;
  }
  .energy-value .peak {
    color: #F59E0B;
    font-weight: 700;
  }
  .energy-bar {
    display: flex;
    gap: 3px;
    height: 32px;
    align-items: flex-end;
    margin-left: auto;
  }
  .energy-bar i {
    display: block;
    width: 8px;
    border-radius: 3px 3px 0 0;
    background: var(--border);
    transition: background var(--transition);
  }
  .energy-bar i.peak { background: #F59E0B; }
  .energy-bar i.mid { background: #93C5FD; }

  /* ---- 今日重点任务 ---- */
  .tasks-section {
    margin-top: 26px;
    animation: slideUp 0.6s ease-out 0.2s both;
  }
  .tasks-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .tasks-title {
    font-size: 17px;
    font-weight: 630;
    color: var(--text-primary);
    font-family: 'MiSans VF', var(--font-sans);
    display: flex; align-items: center; gap: 8px;
  }
  .tasks-count {
    font-size: 12px;
    color: var(--text-tertiary);
    background: var(--bg-muted);
    padding: 3px 10px;
    border-radius: var(--r-pill);
  }
  .task-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .task-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--r-xl);
    box-shadow: var(--shadow-sm);
    transition: all var(--transition);
    cursor: pointer;
  }
  .task-item:hover {
    border-color: var(--accent);
    box-shadow: var(--shadow-elevated);
    transform: translateX(3px);
  }
  .task-checkbox {
    width: 24px; height: 24px;
    border: 2px solid var(--border-hover);
    border-radius: 7px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all var(--transition);
    background: var(--bg-card);
  }
  .task-item.done .task-checkbox {
    background: var(--accent);
    border-color: var(--accent);
  }
  .task-checkbox svg {
    width: 14px; height: 14px;
    color: #fff;
    opacity: 0;
    transition: opacity var(--transition);
  }
  .task-item.done .task-checkbox svg { opacity: 1; }
  .task-body { flex: 1; min-width: 0; }
  .task-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    transition: all var(--transition);
  }
  .task-item.done .task-name {
    color: var(--text-faint);
    text-decoration: line-through;
  }
  .task-meta {
    font-size: 12px;
    color: var(--text-tertiary);
    margin-top: 2px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .task-time {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: var(--accent);
    font-weight: 500;
  }
  .task-cat-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ---- 底部按钮 ---- */
  .morning-footer {
    padding: 8px 32px 28px;
    flex-shrink: 0;
  }
  .start-day-btn {
    width: 100%;
    height: 54px;
    border: none;
    border-radius: var(--r-lg);
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-darker) 100%);
    color: #fff;
    font-family: 'MiSans VF', var(--font-sans);
    font-size: 17px;
    font-weight: 630;
    cursor: pointer;
    transition: all var(--transition-slow);
    box-shadow: 0 6px 18px rgba(47, 128, 237, 0.32);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    letter-spacing: 0.5px;
  }
  .start-day-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 26px rgba(47, 128, 237, 0.4);
  }
  .start-day-btn:active { transform: translateY(0); }
  .start-day-btn .arrow {
    transition: transform var(--transition);
  }
  .start-day-btn:hover .arrow { transform: translateX(4px); }
</style>
</head>
<body>
<div class="app-layout" id="app-layout">
  <!-- 侧边栏占位 -->
  <div id="sidebar-placeholder"></div>

  <!-- 主内容区 -->
  <main class="app-main">
    <div id="header-placeholder"></div>

    <div class="morning-wrap">
      <div class="app-content morning-scroll">
        <!-- 视图切换器 -->
        <div style="display: flex; justify-content: flex-end; padding: 8px 0 16px;">
          <div class="view-toggle">
            <button class="view-toggle-btn active" onclick="location.href='review_morning.html'">
              <i class="ti ti-sunrise"></i>
              <span>早间简报</span>
            </button>
            <button class="view-toggle-btn" onclick="location.href='review_evening.html'">
              <i class="ti ti-moon-stars"></i>
              <span>晚间复盘</span>
            </button>
          </div>
        </div>

        <!-- MORNING BRIEFING 标签 -->
        <div class="section-tag animate-fade-in">MORNING BRIEFING</div>

        <!-- 中心太阳区 -->
        <div class="sun-hero">
          <div class="sun-wrap">
            <div class="sun-rays" id="sun-rays"></div>
            <div class="sun-core"></div>
          </div>
          <div class="morning-greet">早安，林默</div>
          <h1 class="morning-title">新的一天<span class="accent">.</span></h1>
        </div>

        <!-- AI 寄语卡片 -->
        <div class="quote-card float">
          <span class="quote-mark">&ldquo;</span>
          <div class="quote-text" id="quote-text">今天先完成一个清晰的结果，再给灵感留一点空间。</div>
          <div class="quote-foot"><i class="ti ti-sparkles"></i> 伴伴为你生成的今日寄语</div>
        </div>

        <!-- 能量时段分析 -->
        <div class="energy-section">
          <div class="energy-icon">⚡</div>
          <div class="energy-text">
            <div class="energy-label">你的高效时段</div>
            <div class="energy-value">预计从 <span class="peak">09:00–11:00</span>、<span class="peak">15:00–17:00</span> 精力最盛</div>
          </div>
          <div class="energy-bar" id="energy-bar"></div>
        </div>

        <!-- 今日重点任务 -->
        <div class="tasks-section">
          <div class="tasks-header">
            <div class="tasks-title"><i class="ti ti-sparkles"></i> 今日 3 个重点</div>
            <div class="tasks-count" id="tasks-count">3 项</div>
          </div>
          <div class="task-list" id="task-list">
            <div class="task-item" style="justify-content:center;color:var(--text-faint);">正在加载今日计划…</div>
          </div>
        </div>
      </div>

      <!-- 底部按钮 -->
      <div class="morning-footer">
        <button class="start-day-btn hover-shrink hover-lift" id="start-day-btn">
          <span>开始今天</span>
          <span class="arrow">→</span>
        </button>
      </div>
    </div>
  </main>

  <!-- AI 助手面板占位 -->
  <div id="ai-placeholder"></div>
</div>

<script src="banban-icons.js"></script>
<script src="figma-components.js"></script>
<script>
  // ==================== 早间简报逻辑 ====================
  const FALLBACK_QUOTE = '今天先完成一个清晰的结果，再给灵感留一点空间。';
  const FALLBACK_TASKS = [
    { name: '完成作品集结构梳理', time: '09:40–11:00', cat: 'work', catColor: '#2E6EF0' },
    { name: '撰写本周复盘周报', time: '15:00–16:30', cat: 'work', catColor: '#2E6EF0' },
    { name: '阅读《深度工作》第四章', time: '20:00–20:45', cat: 'study', catColor: '#45B073' },
  ];

  // ---- 页面初始化 ----
  initPage('review', {
    header: {
      title: '复盘',
      subtitle: '',
      showControls: true,
    },
    ai: {
      insight: '你习惯把任务拆成清晰的状态推进，上午的专注块适合放结构化工作。今天先给主线一个清晰的"完成"定义。',
      suggestion: '先明确停止条件，再把主线拆成今天能完成的最小一步。',
    },
  });

  // ---- 太阳光芒生成 ----
  (function buildSunRays() {
    const wrap = document.getElementById('sun-rays');
    const count = 12;
    for (let i = 0; i < count; i++) {
      const ray = document.createElement('div');
      ray.className = 'sun-ray';
      ray.style.transform = `rotate(${(360 / count) * i}deg)`;
      wrap.appendChild(ray);
    }
  })();

  // ---- 能量柱生成 ----
  (function buildEnergyBar() {
    const bar = document.getElementById('energy-bar');
    // 模拟一天 9 个时段的能量
    const levels = [0.3, 0.85, 1.0, 0.7, 0.4, 0.9, 1.0, 0.6, 0.3];
    const peakIdx = [1, 2, 5, 6];
    levels.forEach((lv, i) => {
      const seg = document.createElement('i');
      seg.style.height = `${10 + lv * 22}px`;
      if (peakIdx.includes(i)) seg.classList.add('peak');
      else if (lv > 0.55) seg.classList.add('mid');
      bar.appendChild(seg);
    });
  })();

  // ---- 加载今日计划 + 寄语 ----
  async function loadMorningData() {
    // 并行获取计划与任务
    const [planRes, tasksRes] = await Promise.all([
      API.get('/api/plan/today'),
      API.get('/api/tasks?date=today'),
    ]);

    // 寄语
    let quote = FALLBACK_QUOTE;
    if (planRes) {
      quote = planRes.quote || planRes.briefing || planRes.message || (planRes.ai && planRes.ai.quote) || quote;
    }
    document.getElementById('quote-text').textContent = quote;

    // 任务
    let tasks = null;
    if (tasksRes) {
      tasks = Array.isArray(tasksRes) ? tasksRes : (tasksRes.tasks || tasksRes.items || null);
    }
    if (!tasks || !tasks.length) {
      if (planRes) {
        tasks = planRes.tasks || planRes.items || null;
      }
    }
    if (!tasks || !tasks.length) {
      tasks = FALLBACK_TASKS;
    }

    // 取前 3 项重点
    const top = tasks.slice(0, 3);
    document.getElementById('tasks-count').textContent = `${top.length} 项`;

    const listEl = document.getElementById('task-list');
    listEl.innerHTML = top.map((t, i) => {
      const name = t.name || t.title || t.content || '一项任务';
      const time = t.time || t.schedule || t.range || '';
      const cat = t.category || t.cat || '';
      const catColor = t.catColor || (cat === 'study' ? '#45B073' : cat === 'life' ? '#F57D38' : cat === 'exercise' ? '#734DE5' : '#2E6EF0');
      return `
        <div class="task-item" data-idx="${i}">
          <div class="task-checkbox checkbox-anim">
            <svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.5 3.5L13 4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="task-body">
            <div class="task-name">${escapeHtml(name)}</div>
            <div class="task-meta">
              ${cat ? `<span class="task-cat-dot" style="background:${catColor};"></span>` : ''}
              ${time ? `<span class="task-time">◷ ${escapeHtml(time)}</span>` : ''}
            </div>
          </div>
        </div>
      `;
    }).join('');

    // 任务勾选交互
    listEl.querySelectorAll('.task-item').forEach(item => {
      item.addEventListener('click', () => {
        item.classList.toggle('done');
      });
    });

    // 任务清单交错入场
    const taskList = document.querySelector('.priority-list') || document.querySelector('.task-list');
    if (taskList) addStaggerAnimation(taskList);

    // 复选框微交互（异步渲染后重新绑定，确保 initCheckboxAnim 生效）
    if (typeof initCheckboxAnim === 'function') initCheckboxAnim();
  }
  loadMorningData();

  // ---- 开始今天 ----
  document.getElementById('start-day-btn').addEventListener('click', async () => {
    // 尝试生成今日计划（如尚未生成）
    const res = await API.post('/api/generate-plan', { date: formatDate() });
    if (res) {
      showToast('今天开始了，加油 →');
    } else {
      showToast('今天开始了，加油 →');
    }
  });
</script>
</body>
</html>
