<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>初次认识 · 伴伴</title>
<style>
/* ================================================================
   伴伴 Onboarding — 复刻 Figma 设计参考 (蓝色系)
   设计令牌来源: Figma "sh设计参考" 全局变量
   ================================================================ */

:root {
  --bg: #F5F7FA;
  --bg2: #FFFFFF;
  --bg3: #F8FAFC;
  --bg4: #EFF6FF;
  --ink: #1A1F29;
  --ink2: #4D576B;
  --muted: #757394;
  --muted2: #98A1AD;
  --accent: #2F80ED;
  --accent-dark: #1677FF;
  --accent-light: rgba(47, 128, 237, 0.06);
  --accent-bg: #E5F2FF;
  --accent2: #10B981;
  --accent2-light: rgba(16, 185, 129, 0.08);
  --purple: #8B5CF6;
  --warning: #F59E0B;
  --danger: #EF4444;
  --rule: #D5DEE8;
  --rule2: #C4D1E0;
  --border: #D5DEE8;
  --gradient-warm: linear-gradient(135deg, #EFF6FF 0%, #E5F2FF 100%);
  --gradient-accent: linear-gradient(135deg, #2F80ED 0%, #1677FF 100%);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
  --shadow: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);
  --radius: 12px;
  --radius-sm: 10px;
  --radius-xs: 8px;
  --font: 'Inter', 'MiSans VF', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --transition: 0.2s ease;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }

html { font-size: 15px; -webkit-font-smoothing: antialiased; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  line-height: 1.7;
  min-height: 100vh;
  overflow-y: auto;
}

/* === Animations (复刻 lifelens-v2) === */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideInRight { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: translateX(0); } }
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
@keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
@keyframes spin { to { transform: rotate(360deg); } }

.animate-fade-in { animation: fadeIn 0.5s ease-out; }
.animate-slide-up { animation: slideUp 0.5s ease-out both; }
.animate-slide-in-right { animation: slideInRight 0.4s ease-out; }
.animate-breathe { animation: breathe 3s ease-in-out infinite; }
.animate-scale-in { animation: scaleIn 0.3s ease-out; }
.animate-shimmer {
  background: linear-gradient(90deg, var(--bg3) 25%, var(--bg2) 50%, var(--bg3) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s ease-in-out infinite;
}

/* === 主容器 === */
.onboarding-shell {
  max-width: 640px;
  margin: 0 auto;
  padding: 40px 24px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* === 进度条区 === */
.progress-section { margin-bottom: 32px; }
.progress-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
}
.progress-label {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
}
.progress-percent {
  font-size: 13px;
  color: var(--muted);
}
.progress-bar {
  height: 6px;
  border-radius: 3px;
  background: var(--bg3);
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  border-radius: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  transition: width 0.4s ease;
}

/* === 分类徽章 === */
.category-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 16px;
}
.category-badge .cat-icon {
  width: 16px;
  height: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* === 问题文本 === */
.question-text {
  font-size: 22px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.5;
  margin-bottom: 28px;
}
.question-hint {
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 20px;
}
.question-reason {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.6;
  margin-bottom: 16px;
  padding: 12px 16px;
  background: var(--accent-light);
  border-radius: var(--radius-xs);
  border-left: 3px solid var(--accent);
}

/* === 选项卡片（复刻 lifelens-v2）=== */
.option-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.option-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 18px 20px;
  border-radius: var(--radius);
  border: 2px solid var(--rule);
  background: var(--bg2);
  cursor: pointer;
  text-align: left;
  font-size: 15px;
  color: var(--ink);
  font-weight: 500;
  transition: all var(--transition);
  font-family: var(--font);
  animation: slideUp 0.5s ease-out both;
}
.option-card:hover {
  border-color: var(--accent);
  background: rgba(47, 128, 237, 0.04);
  transform: translateX(4px);
}
.option-card.selected {
  border-color: var(--accent);
  background: rgba(47, 128, 237, 0.06);
  box-shadow: 0 2px 12px rgba(47, 128, 237, 0.08);
}
/* 优先级选中样式 */
.option-card.selected.priority-1 { border-color: #1B3A6B; background: rgba(27, 58, 107, 0.08); box-shadow: 0 2px 12px rgba(27, 58, 107, 0.12); }
.option-card.selected.priority-1 .option-text { color: #1B3A6B; font-weight: 700; }
.option-card.selected.priority-2 { border-color: #4A90D9; background: rgba(74, 144, 217, 0.06); }
.option-card.selected.priority-2 .option-text { color: #2E6BA8; font-weight: 600; }
.option-card.selected.priority-3 { border-color: var(--accent); }
.option-card.selected.priority-3 .option-text { font-weight: 500; }
.option-badge {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-xs);
  background: var(--bg3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 700;
  color: var(--muted);
  flex-shrink: 0;
  transition: all var(--transition);
}
.option-card:hover .option-badge {
  background: var(--accent);
  color: #fff;
}
.option-card.selected .option-badge,
.option-badge.checked {
  background: var(--accent);
  color: #fff;
}
.option-badge.priority-1 { background: #1B3A6B !important; color: #fff; }
.option-badge.priority-2 { background: #4A90D9 !important; color: #fff; }
.option-badge.priority-3 { background: var(--accent) !important; color: #fff; }
.option-badge .priority-num { font-size: 15px; font-weight: 700; font-family: 'Inter', sans-serif; }
.option-badge.priority-1::after, .option-badge.priority-2::after, .option-badge.priority-3::after { content: ''; }
.option-card.selected .option-badge .badge-letter,
.option-badge.checked .badge-letter {
  display: none;
}
.option-text {
  flex: 1;
}
.option-card.selected .option-text {
  color: var(--accent);
  font-weight: 600;
}

/* === 行业网格 === */
.industry-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.industry-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 20px 12px;
  border-radius: var(--radius);
  border: 2px solid var(--rule);
  background: var(--bg2);
  cursor: pointer;
  transition: all var(--transition);
  text-align: center;
  font-family: var(--font);
  animation: slideUp 0.5s ease-out both;
}
.industry-card:hover {
  border-color: var(--accent);
  background: var(--accent-light);
  transform: translateY(-2px);
}
.industry-card.selected {
  border-color: var(--accent);
  background: var(--accent-light);
  box-shadow: 0 4px 16px rgba(47, 128, 237, 0.1);
}
.industry-icon { font-size: 28px; }
.industry-name {
  font-size: 14px;
  font-weight: 500;
  color: var(--ink2);
}
.industry-card.selected .industry-name {
  color: var(--accent);
  font-weight: 600;
}

/* === Chip 标签 === */
.chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.chip {
  padding: 10px 18px;
  border: 2px solid var(--rule);
  border-radius: 22px;
  background: var(--bg2);
  font-size: 14px;
  font-weight: 500;
  color: var(--ink2);
  cursor: pointer;
  transition: all var(--transition);
  font-family: var(--font);
  animation: slideUp 0.4s ease-out both;
}
.chip:hover {
  border-color: var(--accent);
  color: var(--accent);
  transform: translateY(-2px);
}
.chip.selected {
  border-color: var(--accent);
  background: var(--accent-light);
  color: var(--accent);
  font-weight: 600;
}
.chip.selected.priority-1 { border-color: #1B3A6B; background: rgba(27, 58, 107, 0.12); color: #1B3A6B; font-weight: 700; }
.chip.selected.priority-2 { border-color: #4A90D9; background: rgba(74, 144, 217, 0.10); color: #2E6BA8; font-weight: 600; }

/* === 角色卡片 === */
.role-grid {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.role-card {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 18px 20px;
  border-radius: var(--radius);
  border: 2px solid var(--rule);
  background: var(--bg2);
  cursor: pointer;
  transition: all var(--transition);
  font-family: var(--font);
  animation: slideUp 0.5s ease-out both;
}
.role-card:hover {
  border-color: var(--accent);
  background: var(--accent-light);
  transform: translateX(4px);
}
.role-card.selected {
  border-color: var(--accent);
  background: var(--accent-light);
  box-shadow: 0 2px 12px rgba(47, 128, 237, 0.08);
}
.role-card { position: relative; }
.role-card.selected.priority-1 { border-color: #1B3A6B; background: rgba(27, 58, 107, 0.08); box-shadow: 0 2px 12px rgba(27, 58, 107, 0.12); }
.role-card.selected.priority-1 .role-name { color: #1B3A6B; font-weight: 700; }
.role-card.selected.priority-2 { border-color: #4A90D9; background: rgba(74, 144, 217, 0.06); }
.role-card.selected.priority-2 .role-name { color: #2E6BA8; font-weight: 600; }
.role-priority-badge { position: absolute; top: 10px; right: 10px; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; font-family: 'Inter', sans-serif; color: #fff; }
.role-priority-badge.priority-1 { background: #1B3A6B; }
.role-priority-badge.priority-2 { background: #4A90D9; }
.role-priority-badge.priority-3 { background: var(--accent); }
.role-icon {
  font-size: 24px;
  flex-shrink: 0;
  margin-top: 2px;
}
.role-info { flex: 1; }
.role-name {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 4px;
}
.role-desc {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.5;
}
.role-card.selected .role-name { color: var(--accent); }

/* === 偏好卡片 === */
.pref-cards {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.pref-card {
  padding: 18px 20px;
  border-radius: var(--radius);
  border: 2px solid var(--rule);
  background: var(--bg2);
  cursor: pointer;
  transition: all var(--transition);
  font-family: var(--font);
  animation: slideUp 0.5s ease-out both;
}
.pref-card:hover {
  border-color: var(--accent);
  background: var(--accent-light);
  transform: translateX(4px);
}
.pref-card.selected {
  border-color: var(--accent);
  background: var(--accent-light);
  box-shadow: 0 2px 12px rgba(47, 128, 237, 0.08);
}
.pref-card { position: relative; }
.pref-card.selected.priority-1 { border-color: #1B3A6B; background: rgba(27, 58, 107, 0.08); box-shadow: 0 2px 12px rgba(27, 58, 107, 0.12); }
.pref-card.selected.priority-1 .pref-card-title { color: #1B3A6B; font-weight: 700; }
.pref-card.selected.priority-2 { border-color: #4A90D9; background: rgba(74, 144, 217, 0.06); }
.pref-card.selected.priority-2 .pref-card-title { color: #2E6BA8; font-weight: 600; }
.pref-priority-badge { position: absolute; top: 12px; right: 12px; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; font-family: 'Inter', sans-serif; color: #fff; }
.pref-priority-badge.priority-1 { background: #1B3A6B; }
.pref-priority-badge.priority-2 { background: #4A90D9; }
.pref-priority-badge.priority-3 { background: var(--accent); }
.pref-card-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 4px;
}
.pref-card-desc {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.5;
}
.pref-card.selected .pref-card-title { color: var(--accent); }

/* === 滑块 === */
.slider-block { margin-bottom: 24px; }
.slider-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.slider-label {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
}
.slider-value {
  font-size: 18px;
  font-weight: 700;
  color: var(--accent);
}
input[type="range"] {
  width: 100%;
  height: 6px;
  -webkit-appearance: none;
  appearance: none;
  background: var(--bg3);
  border-radius: 3px;
  outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  border: 3px solid var(--bg2);
  box-shadow: 0 2px 8px rgba(47, 128, 237, 0.3);
  transition: var(--transition);
}
input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }
.slider-ends {
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
}
.slider-end-label {
  font-size: 12px;
  color: var(--muted);
}

/* === 想法种子 === */
.seed-input-row {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}
.seed-input {
  flex: 1;
  padding: 14px 16px;
  border: 1.5px solid var(--rule);
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-family: var(--font);
  outline: none;
  background: var(--bg2);
  color: var(--ink);
  transition: var(--transition);
}
.seed-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-light);
}
.seed-input::placeholder { color: var(--muted); opacity: 0.7; }
.seed-add-btn {
  padding: 14px 24px;
  border: none;
  border-radius: var(--radius-sm);
  background: var(--gradient-accent);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: var(--font);
  transition: var(--transition);
  box-shadow: 0 2px 10px rgba(47, 128, 237, 0.25);
}
.seed-add-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(47, 128, 237, 0.35);
}
.seed-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 20px;
}
.seed-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  background: var(--accent-light);
  border-radius: var(--radius-sm);
  font-size: 14px;
  animation: slideUp 0.4s ease-out both;
}
.seed-item.focus {
  background: var(--gradient-warm);
  border: 1.5px solid var(--accent);
}
.seed-text {
  flex: 1;
  color: var(--ink);
}
.seed-focus-btn {
  padding: 4px 12px;
  border: 1px solid var(--rule);
  border-radius: 14px;
  background: var(--bg2);
  font-size: 12px;
  cursor: pointer;
  font-family: var(--font);
  color: var(--muted);
  transition: var(--transition);
}
.seed-focus-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}
.seed-remove {
  width: 28px;
  height: 28px;
  border: none;
  border-radius: 50%;
  background: transparent;
  font-size: 18px;
  cursor: pointer;
  color: var(--muted);
  font-family: var(--font);
  transition: var(--transition);
}
.seed-remove:hover { color: var(--danger); }
.seed-suggestions-title {
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 10px;
}
.suggestion-bubbles {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.suggestion-bubble {
  padding: 10px 16px;
  border: 1.5px dashed var(--rule);
  border-radius: 20px;
  background: transparent;
  font-size: 14px;
  color: var(--muted);
  cursor: pointer;
  transition: var(--transition);
  font-family: var(--font);
}
.suggestion-bubble:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-light);
}
.suggestion-bubble.added {
  opacity: 0.4;
  pointer-events: none;
  text-decoration: line-through;
}

/* === 其他输入框 === */
.other-input {
  margin-top: 10px;
  padding: 14px 16px;
  border: 1.5px solid var(--rule);
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-family: var(--font);
  outline: none;
  background: var(--bg2);
  color: var(--ink);
  transition: var(--transition);
  width: 100%;
}
.other-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-light);
}
.other-input::placeholder { color: var(--muted); opacity: 0.7; }

/* === AI 追问 === */
.followup-dimension-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 12px;
}

/* === 加载（复刻 lifelens-v2 Sparkles breathe）=== */
.loading-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1;
  gap: 24px;
  text-align: center;
  padding: 60px 20px;
}
.loading-icon {
  color: var(--accent);
  animation: breathe 3s ease-in-out infinite;
}
.loading-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--ink);
}
.loading-sub {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.6;
  max-width: 400px;
}
.loading-bar {
  width: 100%;
  max-width: 300px;
  height: 4px;
  border-radius: 2px;
  background: var(--bg3);
  overflow: hidden;
}
.loading-bar-fill {
  height: 100%;
  border-radius: 2px;
  width: 100%;
}

/* === 错误 === */
.error-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  padding: 40px 20px;
  text-align: center;
}
.error-icon { font-size: 48px; }
.error-text {
  font-size: 15px;
  color: var(--ink2);
}
.retry-btn {
  padding: 10px 24px;
  border: 1.5px solid var(--accent);
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--accent);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: var(--font);
  transition: var(--transition);
}
.retry-btn:hover {
  background: var(--accent-light);
}

/* === 预览页 === */
.preview-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.preview-card {
  padding: 16px;
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  background: var(--bg2);
}
.preview-card.full { grid-column: 1 / -1; }
.preview-section-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 4px;
}
.preview-card-label {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 6px;
}
.preview-card-value {
  font-size: 14px;
  color: var(--ink);
  line-height: 1.5;
}
.preview-tag {
  display: inline-block;
  padding: 3px 10px;
  margin: 2px;
  background: var(--accent-light);
  color: var(--accent);
  border-radius: 12px;
  font-size: 12px;

    internet_product: { label: "互联网/产品/研发", directions: ["产品经理","前端开发","后端开发","数据分析"], tasks: ["写需求","写代码","做原型","看数据"], tools: ["Cursor","VSCode","Figma","Notion","Git"], blocks: ["需求不清","技术选型","优先级冲突"] },

    gentle_companion: { label: "温和陪伴者",   description: "以温柔的方式陪伴，在你需要时给予支持。" },
    analyst:          { label: "冷静分析师",   description: "用理性视角分析问题，给出客观判断与建议。" },
    life_rhythm:      { label: "生活节奏管家", description: "关注你的生活节律与能量，帮你安排合适的节奏。" },
  },
  planStyles: {
    strict_schedule: { label: "严格时间表",   description: "按固定时间段安排任务，到点即做。" },
    flexible_path:   { label: "弹性路径",     description: "保留顺序与方向，时间可灵活调整。" },
    minimum_done:    { label: "最低完成版",   description: "先保证最小可交付，再逐步完善。" },
    energy_match:    { label: "能量匹配版",   description: "根据能量状态匹配合适难度的任务。" },
  },
};

const state = {
  qIndex: 0, totalQs: 0, questions: null,
  followupQuestions: null, followupLoading: false, followupError: "",
  followupRound: 0, maxFollowupRounds: 2,
  analysisLoading: false, analysisError: "", analysis: null,
  questionQueue: [],
  draft: {
    ideaResponse: [], blockers: [], execution: [],
    industry: "", directions: [], tasks: [], tools: [], workBlocks: [],
    seeds: [], focus: "",
    followupAnswers: [],
    role: [], warmth: 62, directness: 42, detail: 48,
    interruption: [], planStyle: [],
  },
};
let saveTimer = null;

function buildQuestionQueue() {
  const q = [];
  const aq = state.questions.actionQuestions;
  const industries = state.questions.industryMap;
  q.push({ type: 'choice', section: '行动方式', key: 'ideaResponse', question: aq.ideaResponse.question, options: aq.ideaResponse.options, maxSelections: 99 });
  q.push({ type: 'choice', section: '行动方式', key: 'blockers', question: aq.blockers.question, options: aq.blockers.options, maxSelections: 99 });
  q.push({ type: 'choice', section: '行动方式', key: 'execution', question: aq.execution.question, options: aq.execution.options, maxSelections: 99 });
  q.push({ type: 'industry', section: '工作画像', question: '你最接近哪个领域？' });
  if (state.draft.industry && industries[state.draft.industry]) {
    const ind = industries[state.draft.industry];
    q.push({ type: 'chips', section: '工作画像', key: 'directions', question: '你在关注或从事哪些方向？', options: ind.directions });
    q.push({ type: 'chips', section: '工作画像', key: 'tasks', question: '你日常会做哪些事？', options: ind.tasks });
    q.push({ type: 'chips', section: '工作画像', key: 'tools', question: '你平时用什么工具？', options: ind.tools });
    q.push({ type: 'chips', section: '工作画像', key: 'workBlocks', question: '哪些阻碍最常困扰你？', options: ind.blocks });
  }
  q.push({ type: 'seeds', section: '想法种子', question: '写下你脑子里冒出的那些想法' });
  // 多轮追问支持
  if (state.followupQuestions && state.followupQuestions.length > 0) {
    state.followupQuestions.forEach((fq, i) => {
      q.push({ type: 'followup', section: 'AI 追问', fqIndex: i, question: fq.question, options: fq.options, maxSelection: fq.maxSelection, dimension: fq.dimension, reason: fq.reason });
    });
  } else if (!state.followupLoading && !state.followupError) {
    q.push({ type: 'followup_loading', section: 'AI 追问' });
  }
  // 如果当前轮还没到最大轮数，在所有追问结束后插入下一轮 loading
  if (state.followupQuestions && state.followupQuestions.length > 0 && state.followupRound < state.maxFollowupRounds) {
    q.push({ type: 'followup_loading', section: 'AI 追问', nextRound: true });
  }
  q.push({ type: 'role', section: '沟通偏好', question: '你希望伴伴扮演什么角色？' });
  q.push({ type: 'slider', section: '沟通偏好', sliderKey: 'warmth', label: '温柔度', leftLabel: '理性直接', rightLabel: '温柔包容' });
  q.push({ type: 'slider', section: '沟通偏好', sliderKey: 'directness', label: '直接度', leftLabel: '委婉含蓄', rightLabel: '坦率直接' });
  q.push({ type: 'slider', section: '沟通偏好', sliderKey: 'detail', label: '主动性', leftLabel: '被动响应', rightLabel: '主动参与' });
  q.push({ type: 'pref', section: '沟通偏好', key: 'interruption', question: '伴伴可以多大程度主动打扰你？', options: INTERRUPTION_OPTIONS });
  q.push({ type: 'pref', section: '沟通偏好', key: 'planStyle', question: '你更喜欢哪种计划方式？', options: state.questions.planStyles });
  q.push({ type: 'preview', section: '初步理解' });
  q.push({ type: 'analysis', section: '人格分析' });
  state.questionQueue = q;
  state.totalQs = q.filter(item => item.type !== 'preview' && item.type !== 'analysis').length;
}

async function init() {
  await loadQuestions();
  buildQuestionQueue();
  renderQuestion();
}

async function loadQuestions() {
  try {
    const res = await fetch("/api/onboarding/questions");
    if (!res.ok) throw new Error("HTTP " + res.status);
    state.questions = await res.json();
  } catch (e) {
    state.questions = FALLBACK_QUESTIONS;
  }
}

function saveDraft() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { await fetch("/api/onboarding/draft", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ draft: state.draft }) }); } catch(e) {}
  }, 500);
}

async function loadFollowupQuestions(isNextRound = false) {
  if (isNextRound) {
    state.followupRound++;
  } else {
    state.followupRound = 1;
  }
  state.followupLoading = true; state.followupError = ""; renderQuestion();
  try {
    const prevAnswers = isNextRound ? state.draft.followupAnswers : null;
    const res = await fetch("/api/onboarding/followup", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ draft: state.draft, count: 5, round: state.followupRound, prev_answers: prevAnswers })
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    const newQuestions = data.questions || [];
    if (isNextRound) {
      state.followupQuestions = [...(state.followupQuestions || []), ...newQuestions];
      newQuestions.forEach(fq => {
        state.draft.followupAnswers.push({ questionId: fq.id, dimension: fq.dimension, question: fq.question, selected: [] });
      });
    } else {
      state.followupQuestions = newQuestions;
      state.draft.followupAnswers = newQuestions.map(q => ({ questionId: q.id, dimension: q.dimension, question: q.question, selected: [] }));
    }
  } catch (e) {
    state.followupError = e.message || "加载失败"; state.followupQuestions = [];
  } finally {
    state.followupLoading = false; buildQuestionQueue(); renderQuestion();
  }
}

async function loadAnalysis() {
  state.analysisLoading = true; state.analysisError = ""; renderQuestion();
  try {
    const res = await fetch("/api/onboarding/analysis", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ draft: state.draft }) });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    state.analysis = data.analysis || null;
  } catch (e) {
    state.analysisError = e.message || "分析失败";
  } finally {
    state.analysisLoading = false; renderQuestion();
  }
}

async function completeOnboarding() {
  const btn = document.getElementById("nextBtn");
  if (btn) { btn.disabled = true; btn.textContent = "正在保存..."; }
  try {
    const res = await fetch("/api/onboarding/complete", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ draft: state.draft }) });
    const data = await res.json();
    if (data.ok) { showToast("已保存，正在进入..."); setTimeout(() => { window.top.location.href = "/portal"; }, 600); }
    else throw new Error(data.error || "提交失败");
  } catch (e) {
    showToast("提交遇到问题，稍后重试");
    if (btn) { btn.disabled = false; btn.textContent = "进入伴伴"; }
  }
}

async function skipOnboarding() {
  showToast("跳过调研，进入伴伴...");
  try {
    const res = await fetch("/api/onboarding/skip", { method: "POST", headers: {"Content-Type":"application/json"} });
    const data = await res.json();
    if (data.ok) setTimeout(() => { window.top.location.href = "/portal"; }, 400);
    else throw new Error(data.error || "跳过失败");
  } catch (e) { showToast("跳过失败，请重试"); }
}

function nextQuestion() {
  const q = state.questionQueue[state.qIndex];
  if (!q) return;
  if (q.type === 'analysis') { completeOnboarding(); return; }
  if (!canProceedCurrent()) return;
  state.qIndex++;
  const nextQ = state.questionQueue[state.qIndex];
  // 第一轮追问 loading
  if (nextQ && nextQ.type === 'followup_loading' && !nextQ.nextRound && !state.followupLoading && !state.followupQuestions) { loadFollowupQuestions(false); return; }
  // 第二轮追问 loading
  if (nextQ && nextQ.type === 'followup_loading' && nextQ.nextRound && !state.followupLoading) { loadFollowupQuestions(true); return; }
  if (nextQ && nextQ.type === 'analysis' && !state.analysis && !state.analysisLoading) loadAnalysis();
  renderQuestion(); saveDraft();
}

function prevQuestion() {
  if (state.qIndex === 0) return;
  state.qIndex--; renderQuestion();
}

function canProceedCurrent() {
  const q = state.questionQueue[state.qIndex];
  if (!q) return true;
  const d = state.draft;
  switch (q.type) {
    case 'choice': return (d[q.key] || []).length > 0;
    case 'industry': return d.industry !== "";
    case 'chips': return (d[q.key] || []).length > 0;
    case 'seeds': return d.seeds.length > 0;
    case 'followup': return true;
    case 'followup_loading': return false;
    case 'role': return (d.role || []).length > 0;
    case 'slider': return true;
    case 'pref': return (d[q.key] || []).length > 0;
    case 'preview': return true;
    case 'analysis': return !state.analysisLoading;
    default: return true;
  }
}

// 单选题类型：自动跳转
const AUTO_ADVANCE_TYPES = ['choice_single', 'industry', 'role', 'pref'];

function isAutoAdvance() {
  const q = state.questionQueue[state.qIndex];
  if (!q) return false;
  if (q.type === 'industry') return true;
  return false;
}

function renderQuestion() {
  const container = document.getElementById("stepContent");
  const q = state.questionQueue[state.qIndex];
  if (!q) { container.innerHTML = '<div style="text-align:center;padding:40px;">加载中...</div>'; return; }
  let html = "";
  switch (q.type) {
    case 'choice': html = renderChoiceQuestion(q); break;
    case 'industry': html = renderIndustryQuestion(q); break;
    case 'chips': html = renderChipsQuestion(q); break;
    case 'seeds': html = renderSeedsQuestion(q); break;
    case 'followup': html = renderFollowupQuestion(q); break;
    case 'followup_loading': html = renderFollowupLoading(); break;
    case 'role': html = renderRoleQuestion(q); break;
    case 'slider': html = renderSliderQuestion(q); break;
    case 'pref': html = renderPrefQuestion(q); break;
    case 'preview': html = renderPreview(); break;
    case 'analysis': html = renderAnalysis(); break;
  }
  container.innerHTML = html;
  container.classList.remove("animate-slide-in-right");
  void container.offsetWidth;
  container.classList.add("animate-slide-in-right");
  updateProgress(); updateNav();
}

function getSectionBadge(section) {
  const info = SECTION_COLORS[section] || { color: 'var(--accent)', icon: '◆' };
  return `<span class="category-badge" style="background:${info.color}15;color:${info.color}"><span class="cat-icon">${info.icon}</span>${section}</span>`;
}

function renderChoiceQuestion(q) {
  const selected = state.draft[q.key] || [];
  const hint = "最多选 3 项 · 按选择顺序标注优先级（①深蓝 ②浅蓝）";
  const options = [...q.options, "__other__"];
  const cards = options.map((opt, idx) => {
    const isOther = opt === "__other__";
    const selIdx = selected.indexOf(opt);
    const isSelected = selIdx >= 0;
    const letter = String.fromCharCode(65 + idx);
    const label = isOther ? "其他" : escapeHtml(opt);
    const safeOpt = opt.replace(/'/g, "\\'");
    return `<button class="option-card ${isSelected ? "selected priority-" + Math.min(selIdx + 1, 3) : ""}" onclick="toggleSelect('${q.key}', '${safeOpt}', 3)" style="animation-delay:${idx * 0.05}s"><span class="option-badge ${isSelected ? "priority-" + Math.min(selIdx + 1, 3) : ""}">${isSelected ? `<span class="priority-num">${selIdx + 1}</span>` : `<span class="badge-letter">${letter}</span>`}</span><span class="option-text">${label}</span></button>`;
  }).join("");
  let otherInput = "";
  if (selected.includes("__other__")) {
    const otherText = state.draft[q.key + "_other"] || "";
    otherInput = `<div class="other-input-wrap" style="margin-top:10px;"><input type="text" class="other-input" placeholder="请输入你的答案..." value="${escapeHtml(otherText)}" oninput="setOtherText('${q.key}', this.value)" /></div>`;
  }
  return `${getSectionBadge(q.section)}<h2 class="question-text">${escapeHtml(q.question)}</h2><div class="question-hint">${hint}</div><div class="option-list">${cards}</div>${otherInput}`;
}

function renderIndustryQuestion(q) {
  const industries = state.questions.industryMap;
  const entries = Object.entries(industries);
  const cards = entries.map(([key, ind], idx) => {
    const icon = INDUSTRY_ICONS[key] || "📋";
    const isSelected = state.draft.industry === key;
    return `<div class="industry-card ${isSelected ? "selected" : ""}" onclick="selectIndustry('${key}')" style="animation-delay:${idx * 0.05}s"><div class="industry-icon">${icon}</div><div class="industry-name">${escapeHtml(ind.label)}</div></div>`;
  }).join("");
  return `${getSectionBadge(q.section)}<h2 class="question-text">${escapeHtml(q.question)}</h2><div class="question-hint">选择一个最接近的领域</div><div class="industry-grid">${cards}</div>`;
}

function renderChipsQuestion(q) {
  const selected = state.draft[q.key] || [];
  const options = [...q.options, "__other__"];
  const chips = options.map((item, idx) => {
    const isOther = item === "__other__";
    const selIdx = selected.indexOf(item);
    const isSelected = selIdx >= 0;
    const label = isOther ? "其他" : escapeHtml(item);
    const safeItem = item.replace(/'/g, "\\'");
    const prefix = isSelected ? (selIdx + 1) + " " : "";
    return `<button class="chip ${isSelected ? "selected priority-" + Math.min(selIdx + 1, 3) : ""}" onclick="toggleSelect('${q.key}', '${safeItem}', 3)" style="animation-delay:${idx * 0.04}s">${prefix}${label}</button>`;
  }).join("");
  let otherInput = "";
  if (selected.includes("__other__")) {
    const otherText = state.draft[q.key + "_other"] || "";
    otherInput = `<div class="other-input-wrap" style="margin-top:10px;"><input type="text" class="other-input" placeholder="请输入..." value="${escapeHtml(otherText)}" oninput="setOtherText('${q.key}', this.value)" /></div>`;
  }
  return `${getSectionBadge(q.section)}<h2 class="question-text">${escapeHtml(q.question)}</h2><div class="question-hint">最多选 3 项 · 按选择顺序标注优先级</div><div class="chip-row">${chips}</div>${otherInput}`;
}

function renderSeedsQuestion(q) {
  const suggestions = SEED_SUGGESTIONS[state.draft.industry] || SEED_SUGGESTIONS.default;
  const seedList = state.draft.seeds.map((seed, i) => {
    const isFocus = state.draft.focus === seed;
    return `<div class="seed-item ${isFocus ? "focus" : ""}" style="animation-delay:${i * 0.05}s"><span class="seed-text">${escapeHtml(seed)}</span><button class="seed-focus-btn" onclick="setFocus(${i})">${isFocus ? "🌟 焦点" : "设为焦点"}</button><button class="seed-remove" onclick="removeSeed(${i})">×</button></div>`;
  }).join("");
  const suggestionBubbles = suggestions.map((s, idx) => {
    const added = state.draft.seeds.includes(s);
    const safeS = s.replace(/'/g, "\\'");
    return `<button class="suggestion-bubble ${added ? "added" : ""}" ${added ? '' : `onclick="addSeed('${safeS}')"`} style="animation-delay:${idx * 0.04}s">${escapeHtml(s)}</button>`;
  }).join("");
  return `${getSectionBadge(q.section)}<h2 class="question-text">${escapeHtml(q.question)}</h2><div class="question-hint">不用想太多，先写下来就好</div><div class="seed-input-row"><input type="text" class="seed-input" id="seedInput" placeholder="比如：做一个个人博客..." onkeydown="if(event.key==='Enter'){addSeedFromInput();}" /><button class="seed-add-btn" onclick="addSeedFromInput()">添加</button></div>${state.draft.seeds.length > 0 ? `<div class="seed-list">${seedList}</div>` : ""}<div class="seed-suggestions-title">💡 也许你会感兴趣</div><div class="suggestion-bubbles">${suggestionBubbles}</div>`;
}

function renderFollowupLoading() {
  const q = state.questionQueue[state.qIndex];
  const isNextRound = q && q.nextRound;
  const roundNum = isNextRound ? state.followupRound + 1 : 1;
  if (state.followupError && (!state.followupQuestions || state.followupQuestions.length === 0)) {
    return `${getSectionBadge('AI 追问')}<h2 class="question-text">伴伴遇到了一点小问题</h2><div class="error-section"><div class="error-icon">💭</div><div class="error-text">${escapeHtml(state.followupError)}</div><button class="retry-btn" onclick="loadFollowupQuestions(${isNextRound})">重新试试</button></div><div class="question-hint">也可以直接点「下一题」跳过</div>`;
  }
  const title = isNextRound ? `伴伴想再深入聊聊…（第 ${roundNum} 轮）` : '伴伴正在思考要问什么…';
  const sub = isNextRound
    ? `根据你刚才的回答，伴伴发现了几个值得深挖的点`
    : '根据你前面的回答，伴伴在想几个更深入的追问';
  return `${getSectionBadge('AI 追问')}<h2 class="question-text">${title}</h2><div class="loading-section"><div class="loading-icon" style="font-size:48px;">✦</div><div class="loading-title">正在生成个性化问题…</div><div class="loading-sub">${sub}</div><div class="loading-bar"><div class="loading-bar-fill animate-shimmer"></div></div></div>`;
}

function renderFollowupQuestion(q) {
  const ans = state.draft.followupAnswers[q.fqIndex] || { selected: [] };
  const hint = "最多选 3 项 · 按选择顺序标注优先级 · 可跳过";
  const options = [...q.options, "__other__"];
  const dimColor = SECTION_COLORS['AI 追问'].color;
  const dimInfo = DIM_LABELS[q.dimension] || { label: q.dimension, icon: '🔮' };
  const round = Math.floor(q.fqIndex / 5) + 1;
  const cards = options.map((opt, idx) => {
    const isOther = opt === "__other__";
    const selIdx = ans.selected.indexOf(opt);
    const isSelected = selIdx >= 0;
    const letter = String.fromCharCode(65 + idx);
    const label = isOther ? "其他" : escapeHtml(opt);
    const safeOpt = opt.replace(/'/g, "\\'");
    return `<button class="option-card ${isSelected ? "selected priority-" + Math.min(selIdx + 1, 3) : ""}" onclick="toggleFollowupAnswer(${q.fqIndex}, '${safeOpt}', 3)" style="animation-delay:${idx * 0.05}s"><span class="option-badge ${isSelected ? "priority-" + Math.min(selIdx + 1, 3) : ""}">${isSelected ? `<span class="priority-num">${selIdx + 1}</span>` : `<span class="badge-letter">${letter}</span>`}</span><span class="option-text">${label}</span></button>`;

}

function renderRoleQuestion(q) {
  const roles = state.questions.roles;
  const entries = Object.entries(roles);
  const selected = state.draft.role || [];
  const cards = entries.map(([key, role], idx) => {

  }).join("");
  return `${getSectionBadge(q.section)}<h2 class="question-text">${escapeHtml(q.question)}</h2><div class="question-hint">最多选 3 项 · 按选择顺序标注优先级</div><div class="role-grid">${cards}</div>`;

function renderSliderQuestion(q) {
  const val = state.draft[q.sliderKey];
  return `${getSectionBadge(q.section)}<h2 class="question-text">${escapeHtml(q.label)}</h2><div class="question-hint">拖动滑块，找到让你舒服的尺度</div><div class="slider-block"><div class="slider-header"><span class="slider-label">${escapeHtml(q.label)}</span><span class="slider-value" id="slider-val-${q.sliderKey}">${val}</span></div><input type="range" min="0" max="100" value="${val}" oninput="updateSlider('${q.sliderKey}', this.value)" /><div class="slider-ends"><span class="slider-end-label">${escapeHtml(q.leftLabel)}</span><span class="slider-end-label">${escapeHtml(q.rightLabel)}</span></div></div>`;

function renderPrefQuestion(q) {
  const selected = state.draft[q.key] || [];
  const cards = q.options.map((opt, idx) => {
    let title, desc, value;
    if (typeof opt === 'object' && opt.id) {
      title = opt.label; desc = opt.desc; value = opt.id;
    } else {
      const [k, v] = Object.entries(opt)[0];
      title = v.label; desc = v.description; value = k;
    }
    const selIdx = selected.indexOf(value);
    const isSelected = selIdx >= 0;
    const badge = isSelected ? `<span class="pref-priority-badge priority-${Math.min(selIdx + 1, 3)}">${selIdx + 1}</span>` : "";
    return `<div class="pref-card ${isSelected ? "selected priority-" + Math.min(selIdx + 1, 3) : ""}" onclick="toggleSelect('${q.key}', '${value}', 3)" style="animation-delay:${idx * 0.05}s">${badge}<div class="pref-card-title">${escapeHtml(title)}</div><div class="pref-card-desc">${escapeHtml(desc)}</div></div>`;
  }).join("");
  return `${getSectionBadge(q.section)}<h2 class="question-text">${escapeHtml(q.question)}</h2><div class="question-hint">最多选 3 项 · 按选择顺序标注优先级</div><div class="pref-cards">${cards}</div>`;
}

function renderPreview() {
  const d = state.draft; const q = state.questions;
  const industries = q.industryMap; const roles = q.roles; const planStyles = q.planStyles;
  const industryLabel = d.industry && industries[d.industry] ? industries[d.industry].label : "未选择";
  const roleArr = d.role || [];

  const planArr = d.planStyle || [];
  const planLabel = planArr.length > 0 ? planArr.map(k => planStyles[k] ? planStyles[k].label : k).join(" → ") : "未选择";
  const intArr = d.interruption || [];
  const interruptionLabel = intArr.length > 0 ? intArr.map(id => { const o = INTERRUPTION_OPTIONS.find(o => o.id === id); return o ? o.label : id; }).join(" → ") : "未选择";
  const tags = (arr, key) => arr.length > 0 ? arr.map((t, i) => {
    const display = t === "__other__" ? (d[(key||'') + "_other"] || "其他") : t;

  return `${getSectionBadge('初步理解')}<h2 class="question-text">这是伴伴目前对你的理解</h2><div class="question-hint">确认后就会进入模型，后续随时可以调整</div><div class="preview-grid"><div class="preview-card full"><div class="preview-section-title">行动方式</div></div><div class="preview-card"><div class="preview-card-label">新想法时</div><div class="preview-card-value">${tags(d.ideaResponse, 'ideaResponse')}</div></div><div class="preview-card"><div class="preview-card-label">容易卡在</div><div class="preview-card-value">${tags(d.blockers, 'blockers')}</div></div><div class="preview-card full"><div class="preview-card-label">工作状态</div><div class="preview-card-value">${tags(d.execution, 'execution')}</div></div><div class="preview-card full"><div class="preview-section-title">工作画像</div></div><div class="preview-card"><div class="preview-card-label">领域</div><div class="preview-card-value">${escapeHtml(industryLabel)}</div></div><div class="preview-card"><div class="preview-card-label">方向</div><div class="preview-card-value">${tags(d.directions, 'directions')}</div></div><div class="preview-card"><div class="preview-card-label">任务</div><div class="preview-card-value">${tags(d.tasks, 'tasks')}</div></div><div class="preview-card"><div class="preview-card-label">工具</div><div class="preview-card-value">${tags(d.tools, 'tools')}</div></div><div class="preview-card full"><div class="preview-card-label">阻碍</div><div class="preview-card-value">${tags(d.workBlocks, 'workBlocks')}</div></div><div class="preview-card full"><div class="preview-section-title">想法种子</div></div><div class="preview-card full"><div class="preview-card-label">想法（${d.seeds.length}个）</div><div class="preview-card-value">${tags(d.seeds, 'seeds')}</div></div>${d.focus ? `<div class="preview-card full"><div class="preview-card-label">当前焦点</div><div class="preview-card-value">${escapeHtml(d.focus)}</div></div>` : ""}<div class="preview-card full"><div class="preview-section-title">沟通偏好</div></div><div class="preview-card"><div class="preview-card-label">角色</div><div class="preview-card-value">${escapeHtml(roleLabel)}</div></div><div class="preview-card"><div class="preview-card-label">打扰程度</div><div class="preview-card-value">${escapeHtml(interruptionLabel)}</div></div>${sliderBar("温柔度", d.warmth)}${sliderBar("直接度", d.directness)}${sliderBar("主动性", d.detail)}<div class="preview-card full"><div class="preview-card-label">计划方式</div><div class="preview-card-value">${escapeHtml(planLabel)}</div></div></div>`;
}

function renderAnalysis() {
  if (state.analysisLoading) {
    return `${getSectionBadge('人格分析')}<h2 class="question-text">伴伴正在认识你</h2><div class="loading-section"><div class="loading-icon" style="font-size:56px;animation:breathe 3s ease-in-out infinite;">✦</div><div class="loading-title">正在绘制你的心智地图…</div><div class="loading-sub">根据你的回答，绘制你的时间观与个人天节律</div><div class="loading-bar"><div class="loading-bar-fill animate-shimmer"></div></div></div>`;
  }
  if (state.analysisError && !state.analysis) {
    return `${getSectionBadge('人格分析')}<h2 class="question-text">遇到了一点小问题</h2><div class="error-section"><div class="error-icon">💭</div><div class="error-text">${escapeHtml(state.analysisError)}</div><button class="retry-btn" onclick="loadAnalysis()">重新试试</button><div class="question-hint">或者直接点「进入伴伴」跳过</div></div>`;
  }
  const a = state.analysis || {};
  const insightsHtml = (a.insights || []).map((ins, i) => `<div class="insight-card" style="animation-delay:${i * 0.1}s"><div class="insight-emoji">${escapeHtml(ins.emoji || "✨")}</div><div><div class="insight-title">${escapeHtml(ins.title || "")}</div><div class="insight-content">${escapeHtml(ins.content || "")}</div></div></div>`).join("");
  return `<div class="analysis-wrap"><div class="analysis-header"><div class="analysis-icon" style="font-size:40px;">💛</div><div class="analysis-title">你的个人画像</div><div class="analysis-subtitle">${escapeHtml(a.greeting || "很高兴认识你。")}</div></div>${insightsHtml ? `<div style="display:flex;flex-direction:column;gap:12px;">${insightsHtml}</div>` : ""}${a.communication ? `<div class="analysis-summary-card"><div class="analysis-summary-icon">💬</div><div class="analysis-summary-text">${escapeHtml(a.communication)}</div></div>` : ""}${a.energy ? `<div class="analysis-summary-card"><div class="analysis-summary-icon">🔋</div><div class="analysis-summary-text">${escapeHtml(a.energy)}</div></div>` : ""}${a.expectation ? `<div class="analysis-expectation">${escapeHtml(a.expectation)}</div>` : ""}</div>`;

function updateProgress() {
  const q = state.questionQueue[state.qIndex];
  if (!q) return;
  const progressSection = document.getElementById("progressSection");
  const progressLabel = document.getElementById("progressLabel");
  const progressPercent = document.getElementById("progressPercent");
  const progressFill = document.getElementById("progressFill");
  const footerHint = document.getElementById("footerHint");
  if (q.type === 'analysis' || q.type === 'preview') {
    progressSection.style.display = "block";
    const totalCount = state.questionQueue.length;
    const currentNum = state.qIndex + 1;
    progressLabel.textContent = q.section;
    progressPercent.textContent = Math.round((currentNum / totalCount) * 100) + "%";
    progressFill.style.width = ((currentNum / totalCount) * 100) + "%";
    footerHint.textContent = "";
    return;
  }
  progressSection.style.display = "block";
  const questionCount = state.questionQueue.filter(item => item.type !== 'preview' && item.type !== 'analysis').length;
  const currentIndex = state.questionQueue.slice(0, state.qIndex).filter(item => item.type !== 'preview' && item.type !== 'analysis').length;
  progressLabel.textContent = "第 " + (currentIndex + 1) + " / " + questionCount + " 题";
  const pct = Math.round(((currentIndex + 1) / questionCount) * 100);
  progressPercent.textContent = pct + "%";
  progressFill.style.width = ((currentIndex + 1) / questionCount) * 100 + "%";
  footerHint.textContent = q.section ? "正在了解：" + q.section : "";
}

function updateNav() {
  const q = state.questionQueue[state.qIndex];
  if (!q) return;
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const footer = document.getElementById("footer");

  // 检查是否选了"其他"——选了其他时需要显示 footer（有"下一步"按钮）
  const isOtherSelected = checkOtherSelected();

  // 单选题（非"其他"）：隐藏整个底部栏，完全复刻 lifelens-v2
  if (isAutoAdvance() && q.type !== 'followup_loading' && !isOtherSelected) {
    footer.style.display = "none";
    return;
  }

  // 其他情况：显示底部栏
  footer.style.display = "flex";
  prevBtn.style.visibility = state.qIndex === 0 ? "hidden" : "visible";

  if (q.type === 'analysis') {
    nextBtn.style.display = "inline-flex";
    nextBtn.textContent = "进入伴伴 ✦";
    nextBtn.classList.add("submit");
    nextBtn.disabled = state.analysisLoading;
  } else if (q.type === 'preview') {
    nextBtn.style.display = "inline-flex";
    nextBtn.textContent = "让伴伴认识你 ✦";
    nextBtn.classList.remove("submit");
    nextBtn.disabled = false;
  } else if (q.type === 'followup_loading') {
    nextBtn.style.display = "inline-flex";
    nextBtn.textContent = "跳过 ›";
    nextBtn.classList.remove("submit");
    nextBtn.disabled = false;
  } else {
    nextBtn.style.display = "inline-flex";
    nextBtn.textContent = "下一题 ›";
    nextBtn.classList.remove("submit");
    nextBtn.disabled = !canProceedCurrent();
  }
}

function checkOtherSelected() {
  const q = state.questionQueue[state.qIndex];
  if (!q) return false;
  const d = state.draft;
  if (q.type === 'choice' || q.type === 'chips') return (d[q.key] || []).includes('__other__');
  if (q.type === 'followup') {
    const ans = d.followupAnswers[q.fqIndex];
    return ans && ans.selected.includes('__other__');
  }
  return false;
}

function toggleSelect(key, value, limit) {
  const arr = state.draft[key] || [];
  const idx = arr.indexOf(value);
  if (idx > -1) {
    arr.splice(idx, 1);
    if (value === '__other__') removeOtherInput();
  } else {
    if (limit && arr.length >= limit) { showToast("最多选择 " + limit + " 项"); return; }
    arr.push(value);
    if (value === '__other__') showOtherInput(key);
  }
  state.draft[key] = arr; saveDraft();
  // 只更新选项卡片的视觉状态，不重新渲染整个页面
  updateOptionCards(key);
  updateNav();
}

function selectSingle(key, value) {
  state.draft[key] = value; saveDraft();
  if (value === '__other__') {
    // "其他"不自动跳转，直接弹出输入框
    updateOptionCards(key);
    showOtherInput(key);
    showFooter();
    updateNav();
  } else {
    // 非其他选项：自动跳转
    updateOptionCards(key);
    if (isAutoAdvance()) {
      setTimeout(() => { nextQuestion(); }, 300);
    }
  }
}

function updateOptionCards(key) {
  // 更新选项卡片的选中状态和优先级显示
  const cards = document.querySelectorAll('.option-card, .chip');
  const q = state.questionQueue[state.qIndex];
  if (!q) return;
  const selected = state.draft[key] || [];
  let opts = [];
  if (q.type === 'chips' || q.type === 'choice' || q.type === 'followup') {
    opts = [...(q.options || []), '__other__'];
  } else {
    opts = q.options || [];
  }
  cards.forEach((card, idx) => {
    const opt = opts[idx];
    if (!opt) return;
    const selIdx = selected.indexOf(opt);
    const isSelected = selIdx >= 0;
    const priorityClass = isSelected ? Math.min(selIdx + 1, 3) : 0;
    card.classList.remove('selected', 'priority-1', 'priority-2', 'priority-3');
    if (isSelected) {
      card.classList.add('selected');
      if (priorityClass > 0) card.classList.add('priority-' + priorityClass);
    }
    if (card.classList.contains('chip')) {
      const label = opt === '__other__' ? '其他' : escapeHtml(opt);
      const prefix = isSelected ? (selIdx + 1) + ' ' : '';
      card.innerHTML = prefix + label;
    }
    const badge = card.querySelector('.option-badge');
    if (badge) {
      badge.classList.remove('priority-1', 'priority-2', 'priority-3', 'checked');
      if (isSelected) {
        badge.classList.add('priority-' + priorityClass);
        badge.innerHTML = `<span class="priority-num">${selIdx + 1}</span>`;
      } else {
        const letter = String.fromCharCode(65 + idx);
        badge.innerHTML = `<span class="badge-letter">${letter}</span>`;
      }
    }
  });
}

function showOtherInput(key) {
  removeOtherInput();
  const otherText = state.draft[key + "_other"] || "";
  const wrap = document.createElement('div');
  wrap.className = 'other-input-wrap';
  wrap.style.cssText = 'animation: slideUp 0.3s ease-out both; margin-top: 10px;';
  wrap.innerHTML = `<input type="text" class="other-input" placeholder="请输入你的答案..." value="${escapeHtml(otherText)}" oninput="setOtherText('${key}', this.value)" />`;
  // 插入到选项列表后面
  const optionList = document.querySelector('.option-list, .chip-row');
  if (optionList && optionList.parentNode) {
    optionList.parentNode.insertBefore(wrap, optionList.nextSibling);
  }
  const input = wrap.querySelector('input');
  if (input) input.focus();
}

function removeOtherInput() {
  const existing = document.querySelector('.other-input-wrap');
  if (existing) existing.remove();
  // 也移除预渲染的 other-input（当从已选状态切换时）
  const standalone = document.querySelector('.other-input:not(.other-input-wrap .other-input)');
  if (standalone && !standalone.closest('.other-input-wrap')) standalone.remove();
}

function showFooter() {
  const footer = document.getElementById('footer');
  if (footer) footer.style.display = 'flex';
}

function hideFooter() {
  const footer = document.getElementById('footer');
  if (footer) footer.style.display = 'none';
}

function selectIndustry(key) {
  if (state.draft.industry === key) return;
  state.draft.industry = key;
  state.draft.directions = []; state.draft.tasks = []; state.draft.tools = []; state.draft.workBlocks = [];
  saveDraft(); buildQuestionQueue();
  setTimeout(() => { nextQuestion(); }, 300);
  renderQuestion();
}

function toggleFollowupAnswer(qIndex, option, maxSel) {
  const ans = state.draft.followupAnswers[qIndex];
  if (!ans) return;
  const idx = ans.selected.indexOf(option);
  if (idx > -1) {
    ans.selected.splice(idx, 1);
    if (option === '__other__') removeOtherInput();
  } else {
    if (ans.selected.length >= maxSel) { showToast("最多选择 " + maxSel + " 项"); return; }
    ans.selected.push(option);
    if (option === '__other__') showOtherInput('followup_' + qIndex);
  }
  saveDraft();
  const cards = document.querySelectorAll('.option-card, .chip');
  const opts = [...(state.questionQueue[state.qIndex].options || []), '__other__'];
  cards.forEach((card, idx2) => {
    const opt = opts[idx2];
    if (!opt) return;
    const selIdx = ans.selected.indexOf(opt);
    const isSelected = selIdx >= 0;
    const priorityClass = isSelected ? Math.min(selIdx + 1, 3) : 0;
    card.classList.remove('selected', 'priority-1', 'priority-2', 'priority-3');
    if (isSelected) {
      card.classList.add('selected');
      if (priorityClass > 0) card.classList.add('priority-' + priorityClass);
    }
    if (card.classList.contains('chip')) {
      const label = opt === '__other__' ? '其他' : escapeHtml(opt);
      const prefix = isSelected ? (selIdx + 1) + ' ' : '';
      card.innerHTML = prefix + label;
    }
    const badge = card.querySelector('.option-badge');
    if (badge) {
      badge.classList.remove('priority-1', 'priority-2', 'priority-3', 'checked');
      if (isSelected) {
        badge.classList.add('priority-' + priorityClass);
        badge.innerHTML = `<span class="priority-num">${selIdx + 1}</span>`;
      } else {
        badge.innerHTML = `<span class="badge-letter">${String.fromCharCode(65 + idx2)}</span>`;
      }
    }
  });
  updateNav();
}

function setOtherText(key, value) { state.draft[key + "_other"] = value; saveDraft(); }
function setFollowupOtherText(qIndex, value) { state.draft["followup_" + qIndex + "_other"] = value; saveDraft(); }

function addSeed(text) { text = (text || "").trim(); if (!text) return; if (state.draft.seeds.includes(text)) { showToast("这个想法已经添加过了"); return; } state.draft.seeds.push(text); if (!state.draft.focus) state.draft.focus = text; saveDraft(); renderQuestion(); }
function addSeedFromInput() { const input = document.getElementById("seedInput"); if (!input) return; addSeed(input.value); }
function removeSeed(index) { const removed = state.draft.seeds[index]; state.draft.seeds.splice(index, 1); if (state.draft.focus === removed) state.draft.focus = state.draft.seeds.length > 0 ? state.draft.seeds[0] : ""; saveDraft(); renderQuestion(); }
function setFocus(index) { state.draft.focus = state.draft.seeds[index]; saveDraft(); renderQuestion(); }
function updateSlider(key, value) { state.draft[key] = parseInt(value); const valEl = document.getElementById("slider-val-" + key); if (valEl) valEl.textContent = value; saveDraft(); }

function escapeHtml(str) { if (str == null) return ""; return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
function showToast(msg) { const toast = document.getElementById("toast"); toast.textContent = msg; toast.classList.add("show"); setTimeout(() => toast.classList.remove("show"), 2000); }

state.questionQueue = [{ type: 'choice', section: '行动方式', key: 'ideaResponse', question: '加载中...', options: [], maxSelections: 1 }];
state.totalQs = 1;
init();
</script>
</body>
</html>
