<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伴伴 · 认知层</title>
<style>
:root {
  --brand: #5B8A72;
  --brand-soft: rgba(91,138,114,0.08);
  --blue: #4A9FD4;
  --blue-soft: rgba(74,159,212,0.08);
  --purple: #9B7ED8;
  --purple-soft: rgba(155,126,216,0.08);
  --orange: #F5A623;
  --orange-soft: rgba(245,166,35,0.08);
  --pink: #E57373;
  --pink-soft: rgba(229,115,115,0.08);
  --teal: #26C6DA;
  --teal-soft: rgba(38,198,218,0.08);
  --gray: #78909C;
  --gray-soft: rgba(120,144,156,0.08);
  --green: #66BB6A;
  --green-soft: rgba(102,187,106,0.08);
  --text-dark: #2C3E50;
  --text-mid: #5B5B5B;
  --text-light: #8A9AA0;
  --bg: #F8FAFB;
  --bg-card: #FFFFFF;
  --border: #E8ECEF;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 2px 8px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.03);
  --shadow-hover: 0 4px 12px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.05);
}
* { margin:0; padding:0; box-sizing:border-box; }
html { font-size: 15px; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text-dark);
  line-height: 1.7; min-height: 100vh;
}

/* === S0 常驻态 — 顶部认知句条 === */
.cognition-bar {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex; align-items: center; gap: 12px;
  cursor: pointer; transition: all 0.2s;
}
.cognition-bar:hover { background: var(--brand-soft); }
.cognition-bar-icon {
  width: 36px; height: 36px; border-radius: 12px;
  background: var(--brand-soft); display: flex;
  align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.cognition-bar-text {
  flex: 1; min-width: 0;
}
.cognition-bar-sentence {
  font-size: 14px; color: var(--text-dark);
  font-weight: 500; line-height: 1.4;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cognition-bar-meta {
  font-size: 11px; color: var(--text-light); margin-top: 2px;
}
.cognition-bar-expand {
  font-size: 18px; color: var(--text-light);
  transition: transform 0.3s;
}
.cognition-bar.expanded .cognition-bar-expand { transform: rotate(180deg); }

/* === S1 预览态 — 悬浮展开 === */
.cognition-preview {
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: none;
}
.cognition-preview.show { display: block; }
.preview-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
}
.preview-card {
  background: var(--bg); border-radius: var(--radius-sm);
  padding: 10px 12px; cursor: pointer; transition: all 0.2s;
  border: 1px solid transparent;
}
.preview-card:hover { border-color: var(--border); box-shadow: var(--shadow); }
.preview-card-header { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.preview-card-icon { font-size: 14px; }
.preview-card-label { font-size: 11px; color: var(--text-light); font-weight: 600; }
.preview-card-sentence {
  font-size: 12px; color: var(--text-mid); line-height: 1.3;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}
.preview-card-confidence {
  height: 3px; border-radius: 2px; margin-top: 6px;
  background: var(--border); overflow: hidden;
}
.preview-card-confidence-fill { height: 100%; border-radius: 2px; }

/* === S2 完整态 — 八维图谱 === */
.cognition-map {
  max-width: 900px; margin: 0 auto; padding: 24px;
}
.map-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 20px;
}
.map-title { font-size: 18px; font-weight: 700; }
.map-actions { display: flex; gap: 8px; }
.map-btn {
  padding: 8px 16px; border: 1px solid var(--border);
  background: var(--bg-card); border-radius: var(--radius-sm);
  font-size: 13px; color: var(--text-mid); cursor: pointer;
  transition: all 0.2s;
}
.map-btn:hover { background: var(--brand-soft); color: var(--brand); border-color: var(--brand); }
.map-btn.primary { background: var(--brand); color: #FFF; border-color: var(--brand); }
.map-btn.primary:hover { opacity: 0.9; }

.dimension-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px;
}
.dimension-card {
  background: var(--bg-card); border-radius: var(--radius);
  padding: 20px; cursor: pointer; transition: all 0.2s;
  box-shadow: var(--shadow); border: 2px solid transparent;
}
.dimension-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
.dimension-card.paused { opacity: 0.5; }
.dimension-card-header {
  display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
}
.dimension-card-icon {
  width: 40px; height: 40px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}
.dimension-card-title { flex: 1; }
.dimension-card-label { font-size: 14px; font-weight: 700; }
.dimension-card-desc { font-size: 11px; color: var(--text-light); margin-top: 2px; }
.dimension-card-status {
  font-size: 10px; padding: 2px 8px; border-radius: 8px;
  font-weight: 600;
}
.dimension-card-status.high { background: var(--green-soft); color: var(--green); }
.dimension-card-status.mid { background: var(--orange-soft); color: var(--orange); }
.dimension-card-status.low { background: var(--pink-soft); color: var(--pink); }
.dimension-card-status.paused { background: var(--gray-soft); color: var(--gray); }

.dimension-card-sentence {
  font-size: 14px; color: var(--text-dark); line-height: 1.5;
  margin-bottom: 10px; font-weight: 500;
}
.dimension-card-sentence.empty { color: var(--text-light); font-style: italic; font-weight: 400; }

.dimension-card-bar {
  height: 4px; border-radius: 2px; background: var(--border);
  overflow: hidden; margin-bottom: 8px;
}
.dimension-card-bar-fill { height: 100%; border-radius: 2px; transition: width 0.5s; }

.dimension-card-footer {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 11px; color: var(--text-light);
}
.dimension-card-evidence { display: flex; align-items: center; gap: 4px; }
.dimension-card-scope {
  padding: 2px 6px; border-radius: 6px; font-size: 10px;
  background: var(--bg); color: var(--text-light);
}

/* === S3 详情态 — 模态弹窗 === */
.detail-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.3); z-index: 200;
  display: none; align-items: center; justify-content: center;
}
.detail-overlay.show { display: flex; }
.detail-panel {
  background: var(--bg-card); border-radius: var(--radius);
  width: 90%; max-width: 600px; max-height: 85vh;
  overflow-y: auto; padding: 24px;
  animation: slideUp 0.3s ease;
}
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.detail-header {
  display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
}
.detail-icon {
  width: 48px; height: 48px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px;
}
.detail-title { flex: 1; }
.detail-label { font-size: 18px; font-weight: 700; }
.detail-desc { font-size: 13px; color: var(--text-light); margin-top: 2px; }
.detail-close {
  width: 36px; height: 36px; border: none; background: var(--bg);
  border-radius: 50%; font-size: 18px; color: var(--text-light);
  cursor: pointer; transition: all 0.2s;
}
.detail-close:hover { background: var(--pink-soft); color: var(--pink); }

.detail-sentence-box {
  background: var(--bg); border-radius: var(--radius-sm);
  padding: 16px; margin-bottom: 16px;
}
.detail-sentence-label { font-size: 11px; color: var(--text-light); margin-bottom: 4px; }
.detail-sentence-text { font-size: 16px; font-weight: 500; line-height: 1.5; }
.detail-sentence-text.empty { color: var(--text-light); font-style: italic; }

.detail-meta {
  display: flex; gap: 16px; margin-bottom: 20px;
}
.detail-meta-item {
  flex: 1; background: var(--bg); border-radius: var(--radius-sm);
  padding: 10px 14px; text-align: center;
}
.detail-meta-label { font-size: 10px; color: var(--text-light); }
.detail-meta-value { font-size: 16px; font-weight: 700; margin-top: 2px; }

/* 修正操作 */
.correction-section { margin-bottom: 20px; }
.correction-title { font-size: 13px; font-weight: 600; margin-bottom: 10px; color: var(--text-mid); }
.correction-buttons {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
}
.corr-btn {
  padding: 10px; border: 1px solid var(--border);
  background: var(--bg-card); border-radius: var(--radius-sm);
  font-size: 13px; color: var(--text-mid); cursor: pointer;
  transition: all 0.2s; text-align: center;
}
.corr-btn:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }
.corr-btn.accurate:hover { border-color: var(--green); color: var(--green); background: var(--green-soft); }
.corr-btn.pause:hover { border-color: var(--gray); color: var(--gray); background: var(--gray-soft); }
.corr-btn.inaccurate:hover { border-color: var(--pink); color: var(--pink); background: var(--pink-soft); }

.corr-input {
  width: 100%; padding: 10px; border: 1px solid var(--border);
  border-radius: var(--radius-sm); font-size: 13px; margin-top: 8px;
  font-family: inherit; resize: vertical; min-height: 60px;
}
.corr-submit {
  margin-top: 8px; padding: 8px 16px; background: var(--brand);
  color: #FFF; border: none; border-radius: var(--radius-sm);
  font-size: 13px; cursor: pointer;
}
.corr-submit:hover { opacity: 0.9; }

/* 证据列表 */
.evidence-section { margin-bottom: 20px; }
.evidence-title { font-size: 13px; font-weight: 600; margin-bottom: 10px; color: var(--text-mid); }
.evidence-list { display: flex; flex-direction: column; gap: 8px; }
.evidence-item {
  display: flex; gap: 10px; padding: 10px 12px;
  background: var(--bg); border-radius: var(--radius-sm);
}
.evidence-dot {
  width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex-shrink: 0;
}
.evidence-dot.observed { background: var(--blue); }
.evidence-dot.onboarding { background: var(--purple); }
.evidence-dot.chat { background: var(--teal); }
.evidence-dot.review { background: var(--orange); }
.evidence-dot.ai_inference { background: var(--gray); }
.evidence-dot.user_stated { background: var(--green); }
.evidence-content { flex: 1; }
.evidence-text { font-size: 13px; color: var(--text-mid); line-height: 1.4; }
.evidence-meta { font-size: 10px; color: var(--text-light); margin-top: 4px; }

/* 沟通画像 */
.comm-section {
  margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border);
}
.comm-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 12px;
}
.comm-card {
  background: var(--bg); border-radius: var(--radius-sm); padding: 12px 14px;
}
.comm-label { font-size: 11px; color: var(--text-light); margin-bottom: 4px; }
.comm-value { font-size: 13px; font-weight: 500; }
.comm-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.comm-tag {
  font-size: 11px; padding: 2px 8px; border-radius: 8px;
  background: var(--bg-card); border: 1px solid var(--border);
}
.comm-tag.avoid { background: var(--pink-soft); color: var(--pink); border-color: var(--pink); }
.comm-tag.effective { background: var(--green-soft); color: var(--green); border-color: var(--green); }

/* Toast */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--text-dark); color: #FFF; padding: 10px 20px;
  border-radius: 24px; font-size: 13px; z-index: 300;
  opacity: 0; transition: opacity 0.3s; pointer-events: none;
}
.toast.show { opacity: 1; }

/* 空状态 */
.empty-state {
  text-align: center; padding: 60px 20px; color: var(--text-light);
}
.empty-state-icon { font-size: 48px; margin-bottom: 12px; }
.empty-state-text { font-size: 14px; }
.empty-state-hint { font-size: 12px; margin-top: 8px; }

/* Loading */
.loading { text-align: center; padding: 40px; color: var(--text-light); font-size: 14px; }

@media (max-width: 768px) {
  .preview-grid { grid-template-columns: repeat(2, 1fr); }
  .dimension-grid { grid-template-columns: 1fr; }
  .correction-buttons { grid-template-columns: 1fr; }
  .comm-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- S0 常驻态 -->
<div class="cognition-bar" id="cognitionBar" onclick="togglePreview()">
  <div class="cognition-bar-icon">🧠</div>
  <div class="cognition-bar-text">
    <div class="cognition-bar-sentence" id="barSentence">正在了解你...</div>
    <div class="cognition-bar-meta" id="barMeta">点击展开八维认知图谱</div>
  </div>
  <div class="cognition-bar-expand">▾</div>
</div>

<!-- S1 预览态 -->
<div class="cognition-preview" id="cognitionPreview">
  <div class="preview-grid" id="previewGrid">
    <div class="loading">加载中...</div>
  </div>
</div>

<!-- S2 完整态 -->
<div class="cognition-map" id="cognitionMap" style="display:none;">
  <div class="map-header">
    <div class="map-title">八维认知图谱</div>
    <div class="map-actions">
      <button class="map-btn" onclick="loadCommunicationProfile()">沟通画像</button>
      <button class="map-btn primary" onclick="refreshCognition()">AI 刷新认知</button>
    </div>
  </div>
  <div class="dimension-grid" id="dimensionGrid">
    <div class="loading">加载中...</div>
  </div>
</div>

<!-- 沟通画像区域 -->
<div id="commSection" style="display:none; max-width:900px; margin:0 auto; padding:0 24px 24px;">
  <div class="comm-section">
    <div class="map-title" style="margin-bottom:12px;">沟通画像</div>
    <div class="comm-grid" id="commGrid"></div>
  </div>
</div>

<!-- S3 详情弹窗 -->
<div class="detail-overlay" id="detailOverlay">
  <div class="detail-panel" id="detailPanel">
    <div class="loading">加载中...</div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const API_BASE = '';
let previewExpanded = false;

// === 工具函数 ===
function apiGet(path) {
  return fetch(API_BASE + path).then(r => r.json());
}
function apiPost(path, data) {
  return fetch(API_BASE + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data),
  }).then(r => r.json());
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
function confidenceColor(conf) {
  if (conf >= 0.7) return 'var(--green)';
  if (conf >= 0.4) return 'var(--orange)';
  return 'var(--pink)';
}
function confidenceLabel(conf) {
  if (conf >= 0.7) return { text: '高置信', cls: 'high' };
  if (conf >= 0.4) return { text: '中置信', cls: 'mid' };
  return { text: '低置信', cls: 'low' };
}
function scopeLabel(scope) {
  const map = { universal: '通用', work_only: '仅工作', recent_only: '仅近期' };
  return map[scope] || scope;
}
function sourceLabel(source) {
  const map = {
    observed: '观察', onboarding: '引导', chat: '对话',
    review: '复盘', ai_inference: 'AI推断', user_stated: '用户自述',
  };
  return map[source] || source;
}
function timeAgo(iso) {
  if (!iso) return '';
  const diff = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return '刚刚';
  if (mins < 60) return mins + '分钟前';
  const hours = Math.floor(mins / 60);
  if (hours < 24) return hours + '小时前';
  const days = Math.floor(hours / 24);
  return days + '天前';
}

// === S0: 加载常驻态摘要 ===
async function loadContextSummary() {
  try {
    const data = await apiGet('/api/cognition/context-summary');
    document.getElementById('barSentence').textContent = data.cognitionSentence || '我还在了解你';
    document.getElementById('barMeta').textContent =
      `${data.dimensionCount || 0} 个维度 · ${data.highConfidenceCount || 0} 个高置信`;
  } catch(e) {
    document.getElementById('barSentence').textContent = '认知服务未连接';
  }
}

// === S1: 预览态 ===
function togglePreview() {
  previewExpanded = !previewExpanded;
  document.getElementById('cognitionBar').classList.toggle('expanded', previewExpanded);
  document.getElementById('cognitionPreview').classList.toggle('show', previewExpanded);
  document.getElementById('cognitionMap').style.display = previewExpanded ? 'block' : 'none';

  if (previewExpanded) {
    loadMap();
  }
}

// === S2: 完整态八维图谱 ===
async function loadMap() {
  try {
    const data = await apiGet('/api/cognition/map');
    const items = data.items || {};
    const grid = document.getElementById('dimensionGrid');

    grid.innerHTML = Object.values(items).map(item => {
      const cl = confidenceLabel(item.confidence);
      const isEmpty = !item.cognitionSentence;
      const barColor = confidenceColor(item.confidence);
      const paused = item.status === 'paused';

      return `
        <div class="dimension-card ${paused ? 'paused' : ''}" onclick="openDetail('${item.dimension}')">
          <div class="dimension-card-header">
            <div class="dimension-card-icon" style="background:${barColor}22;">${item.icon}</div>
            <div class="dimension-card-title">
              <div class="dimension-card-label">${item.label}</div>
              <div class="dimension-card-desc">${item.description}</div>
            </div>
            <div class="dimension-card-status ${paused ? 'paused' : cl.cls}">
              ${paused ? '已暂停' : cl.text}
            </div>
          </div>
          <div class="dimension-card-sentence ${isEmpty ? 'empty' : ''}">
            ${item.cognitionSentence || '还没有足够的了解，等待观察...'}
          </div>
          <div class="dimension-card-bar">
            <div class="dimension-card-bar-fill" style="width:${item.confidence * 100}%;background:${barColor};"></div>
          </div>
          <div class="dimension-card-footer">
            <div class="dimension-card-evidence">📋 ${(item.evidenceIds || []).length} 条证据</div>
            <div class="dimension-card-scope">${scopeLabel(item.scope)}</div>
          </div>
        </div>
      `;
    }).join('');
  } catch(e) {
    document.getElementById('dimensionGrid').innerHTML =
      '<div class="loading">加载失败: ' + e.message + '</div>';
  }
}

// === S3: 详情态 ===
async function openDetail(dimension) {
  const overlay = document.getElementById('detailOverlay');
  const panel = document.getElementById('detailPanel');
  overlay.classList.add('show');
  panel.innerHTML = '<div class="loading">加载中...</div>';

  try {
    const data = await apiGet(`/api/cognition/dimensions/${dimension}`);
    const item = data.item;
    const evidence = data.evidence || [];
    const corrections = data.corrections || [];
    const cl = confidenceLabel(item.confidence);
    const barColor = confidenceColor(item.confidence);

    panel.innerHTML = `
      <div class="detail-header">
        <div class="detail-icon" style="background:${barColor}22;">${item.icon}</div>
        <div class="detail-title">
          <div class="detail-label">${item.label}</div>
          <div class="detail-desc">${item.description}</div>
        </div>
        <button class="detail-close" onclick="closeDetail()">✕</button>
      </div>

      <div class="detail-sentence-box">
        <div class="detail-sentence-label">认知句</div>
        <div class="detail-sentence-text ${!item.cognitionSentence ? 'empty' : ''}">
          ${item.cognitionSentence || '还没有形成认知，等待更多观察...'}
        </div>
      </div>

      <div class="detail-meta">
        <div class="detail-meta-item">
          <div class="detail-meta-label">置信度</div>
          <div class="detail-meta-value" style="color:${barColor};">${Math.round(item.confidence * 100)}%</div>
        </div>
        <div class="detail-meta-item">
          <div class="detail-meta-label">适用范围</div>
          <div class="detail-meta-value">${scopeLabel(item.scope)}</div>
        </div>
        <div class="detail-meta-item">
          <div class="detail-meta-label">证据数</div>
          <div class="detail-meta-value">${(item.evidenceIds || []).length}</div>
        </div>
        <div class="detail-meta-item">
          <div class="detail-meta-label">修正次数</div>
          <div class="detail-meta-value">${item.correctionCount || 0}</div>
        </div>
      </div>

      <div class="correction-section">
        <div class="correction-title">这个认知准确吗？</div>
        <div class="correction-buttons">
          <button class="corr-btn accurate" onclick="correctDimension('${dimension}', 'accurate')">✓ 准确</button>
          <button class="corr-btn" onclick="correctDimension('${dimension}', 'work_only')">💼 只适用于工作</button>
          <button class="corr-btn" onclick="correctDimension('${dimension}', 'recent_only')">📅 只是最近如此</button>
          <button class="corr-btn inaccurate" onclick="showCorrectionInput('${dimension}')">✗ 这句话不准确</button>
        </div>
        <div id="corrInputArea" style="display:none; margin-top:8px;">
          <textarea class="corr-input" id="corrNewSentence" placeholder="你觉得更准确的描述是什么？"></textarea>
          <button class="corr-submit" onclick="submitCorrection('${dimension}')">提交修正</button>
        </div>
        <button class="corr-btn pause" onclick="correctDimension('${dimension}', 'pause')" style="width:100%; margin-top:8px;">⏸ 暂停使用这个认知</button>
      </div>

      <div class="evidence-section">
        <div class="evidence-title">证据 (${evidence.length})</div>
        <div class="evidence-list">
          ${evidence.length === 0 ? '<div style="font-size:13px;color:var(--text-light);padding:8px;">还没有证据记录</div>' :
            evidence.map(ev => `
              <div class="evidence-item">
                <div class="evidence-dot ${ev.source}"></div>
                <div class="evidence-content">
                  <div class="evidence-text">${ev.content}</div>
                  <div class="evidence-meta">${sourceLabel(ev.source)} · ${timeAgo(ev.timestamp)} · 权重 ${ev.weight}</div>
                </div>
              </div>
            `).join('')
          }
        </div>
      </div>

      ${corrections.length > 0 ? `
        <div class="evidence-section">
          <div class="evidence-title">修正历史 (${corrections.length})</div>
          <div class="evidence-list">
            ${corrections.map(c => `
              <div class="evidence-item">
                <div class="evidence-dot" style="background:var(--orange);"></div>
                <div class="evidence-content">
                  <div class="evidence-text">${c.correction_type} ${c.note ? '· ' + c.note : ''}</div>
                  <div class="evidence-meta">${timeAgo(c.created_at)}</div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      ` : ''}
    `;
  } catch(e) {
    panel.innerHTML = '<div class="loading">加载失败: ' + e.message + '</div>';
  }
}

function closeDetail() {
  document.getElementById('detailOverlay').classList.remove('show');
}

let pendingCorrectionDim = null;
function showCorrectionInput(dimension) {
  pendingCorrectionDim = dimension;
  document.getElementById('corrInputArea').style.display = 'block';
  document.getElementById('corrNewSentence').focus();
}

async function submitCorrection(dimension) {
  const newSentence = document.getElementById('corrNewSentence').value.trim();
  if (!newSentence) { showToast('请输入修正后的描述'); return; }
  await doCorrect(dimension, 'inaccurate', { new_sentence: newSentence });
}

async function correctDimension(dimension, correctionType) {
  if (correctionType === 'inaccurate') return; // handled by showCorrectionInput
  await doCorrect(dimension, correctionType, {});
}

async function doCorrect(dimension, correctionType, extra) {
  try {
    const result = await apiPost('/api/cognition/correct', {
      dimension, correction_type: correctionType, ...extra,
    });
    if (result.ok) {
      showToast(correctionType === 'accurate' ? '已记录：这个认知是准确的' :
                correctionType === 'pause' ? '已暂停这个认知' :
                '已记录你的修正');
      closeDetail();
      loadMap();
      loadContextSummary();
    } else {
      showToast('修正失败: ' + (result.error || ''));
    }
  } catch(e) {
    showToast('修正失败: ' + e.message);
  }
}

// === AI刷新认知 ===
async function refreshCognition() {
  showToast('正在分析行为数据，生成认知...');
  try {
    const result = await apiPost('/api/cognition/refresh', {});
    if (result.ok || result.items) {
      showToast('✓ 认知已刷新');
      loadMap();
      loadContextSummary();
    } else {
      showToast('刷新失败: ' + (result.error || ''));
    }
  } catch(e) {
    showToast('刷新失败: ' + e.message);
  }
}

// === 沟通画像 ===
async function loadCommunicationProfile() {
  const section = document.getElementById('commSection');
  section.style.display = section.style.display === 'none' ? 'block' : 'none';
  if (section.style.display === 'block') {
    try {
      const data = await apiGet('/api/model/communication');
      const grid = document.getElementById('commGrid');
      grid.innerHTML = `
        <div class="comm-card">
          <div class="comm-label">默认语气</div>
          <div class="comm-value">${data.default_tone || 'warm_direct'}</div>
        </div>
        <div class="comm-card">
          <div class="comm-label">提醒风格</div>
          <div class="comm-value">${data.reminder_style || 'gentle_nudge'}</div>
        </div>
        <div class="comm-card">
          <div class="comm-label">打扰容忍度</div>
          <div class="comm-value">${data.interruption_tolerance || 'low'}</div>
        </div>
        <div class="comm-card">
          <div class="comm-label">更新时间</div>
          <div class="comm-value" style="font-size:12px;">${timeAgo(data.updated_at)}</div>
        </div>
        <div class="comm-card" style="grid-column: span 2;">
          <div class="comm-label">✓ 有效的沟通方式</div>
          <div class="comm-tags">
            ${(data.effective_styles || []).map(s => `<span class="comm-tag effective">${s}</span>`).join('')}
          </div>
        </div>
        <div class="comm-card" style="grid-column: span 2;">
          <div class="comm-label">✗ 应避免的沟通方式</div>
          <div class="comm-tags">
            ${(data.avoid_styles || []).map(s => `<span class="comm-tag avoid">${s}</span>`).join('')}
          </div>
        </div>
      `;
    } catch(e) {
      showToast('加载沟通画像失败');
    }
  }
}

// 点击遮罩关闭
document.getElementById('detailOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'detailOverlay') closeDetail();
});

// 初始化
loadContextSummary();
</script>
</body>
</html>
