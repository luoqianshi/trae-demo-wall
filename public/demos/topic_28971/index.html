<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>多页面问卷 Demo - 专业方向选择助手</title>
  <style>
    :root {
      --bg: #f3f7f6;
      --surface: #ffffff;
      --surface-soft: #f7fbf9;
      --surface-tint: #eaf6f2;
      --text: #142033;
      --muted: #667085;
      --muted-strong: #44546a;
      --line: #dce7e2;
      --line-strong: #bfd5cd;
      --brand: #087761;
      --brand-dark: #075347;
      --accent: #2f5fb8;
      --accent-soft: #eef4ff;
      --warning: #b96c17;
      --danger: #b42318;
      --shadow: 0 18px 48px rgba(20, 32, 51, 0.09);
      --shadow-soft: 0 10px 26px rgba(20, 32, 51, 0.06);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--text);
      background:
        linear-gradient(180deg, #edf5f2 0, #f8fbfa 38%, #f2f6f8 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button,
    a {
      touch-action: manipulation;
    }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 3px solid rgba(8, 119, 97, 0.22);
      outline-offset: 2px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1240px, calc(100% - 40px));
      margin: 0 auto;
      padding: 22px 0 56px;
    }

    .topbar {
      position: sticky;
      top: 12px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 13px 16px;
      border: 1px solid rgba(220, 231, 226, 0.9);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(14px);
    }

    .topbar strong {
      display: block;
      margin-bottom: 2px;
      font-size: 15px;
    }

    .topbar span {
      color: var(--muted);
      font-size: 13px;
    }

    .shell {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      gap: 18px;
      margin-top: 20px;
    }

    .side {
      position: sticky;
      top: 104px;
      align-self: start;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
    }

    .progress-card {
      padding: 18px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #fff, #f6fbf9);
    }

    .progress-card span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .progress-card strong {
      display: block;
      margin: 4px 0 6px;
      color: var(--brand);
      font-size: 36px;
      line-height: 1;
    }

    .progress-track {
      height: 9px;
      margin-top: 14px;
      overflow: hidden;
      border-radius: 999px;
      background: #e4ece8;
    }

    .progress-track i {
      display: block;
      width: var(--progress);
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--brand), var(--accent));
    }

    .step-list {
      display: grid;
      gap: 4px;
      padding: 10px;
    }

    .step-link {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      padding: 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--muted-strong);
    }

    .step-link:hover {
      background: var(--surface-soft);
    }

    .step-link.active {
      border-color: rgba(8, 119, 97, 0.35);
      background: var(--surface-tint);
      color: var(--brand-dark);
    }

    .step-link.done .index,
    .step-link.active .index {
      border-color: var(--brand);
      background: var(--brand);
      color: #fff;
    }

    .index {
      width: 30px;
      height: 30px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      color: var(--brand-dark);
      font-size: 13px;
      font-weight: 900;
    }

    .step-link b {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
    }

    .step-link small {
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .main {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .page-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 150px;
      gap: 20px;
      padding: 26px;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(90deg, rgba(8, 119, 97, 0.08), rgba(47, 95, 184, 0.05)),
        #fbfdfc;
    }

    .page-head h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.12;
      letter-spacing: 0;
    }

    .page-head p {
      max-width: 720px;
      margin: 0;
      color: var(--muted-strong);
      line-height: 1.75;
    }

    .page-number {
      align-self: center;
      display: grid;
      justify-items: center;
      gap: 4px;
      padding: 18px 12px;
      border: 1px solid rgba(8, 119, 97, 0.14);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.78);
    }

    .page-number b {
      color: var(--brand);
      font-size: 32px;
      line-height: 1;
    }

    .page-number span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    .page-body {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 18px;
      padding: 22px;
    }

    .panel,
    .aside-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.78);
    }

    .panel {
      padding: 20px;
    }

    .panel h2,
    .aside-card h3 {
      margin: 0 0 12px;
      line-height: 1.3;
    }

    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 16px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    label {
      font-weight: 780;
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      outline: none;
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(8, 119, 97, 0.12);
    }

    textarea {
      min-height: 106px;
      resize: vertical;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .tag-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      min-height: 36px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-soft);
      color: var(--text);
      cursor: pointer;
      font-weight: 760;
    }

    .tag.active {
      border-color: rgba(8, 119, 97, 0.45);
      background: var(--surface-tint);
      color: var(--brand-dark);
    }

    .question-list {
      display: grid;
      gap: 10px;
    }

    .question-row {
      display: grid;
      grid-template-columns: minmax(220px, 0.95fr) minmax(260px, 1.05fr);
      gap: 18px;
      align-items: center;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .question-row b {
      display: block;
      margin-bottom: 4px;
    }

    .question-row p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .scale {
      display: grid;
      gap: 8px;
    }

    .scale-labels {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .scale-control {
      display: grid;
      grid-template-columns: minmax(130px, 1fr) 46px;
      gap: 12px;
      align-items: center;
    }

    input[type="range"] {
      padding: 0;
      accent-color: var(--brand);
    }

    .score {
      min-height: 32px;
      display: inline-grid;
      place-items: center;
      border-radius: 8px;
      background: var(--surface-tint);
      color: var(--brand-dark);
      font-weight: 900;
    }

    .aside-card {
      position: sticky;
      top: 104px;
      padding: 18px;
      align-self: start;
    }

    .aside-card p,
    .aside-card li {
      color: var(--muted-strong);
      line-height: 1.7;
    }

    .aside-card ul {
      margin: 0;
      padding-left: 20px;
    }

    .note {
      margin-top: 14px;
      padding: 13px;
      border: 1px solid #d3e3ff;
      border-radius: 8px;
      background: var(--accent-soft);
      color: #234a8f;
      font-weight: 760;
      line-height: 1.65;
    }

    .footer-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      padding: 18px 22px;
      border-top: 1px solid var(--line);
      background: #fff;
    }

    .footer-actions span {
      margin-right: auto;
      color: var(--muted);
      font-size: 13px;
    }

    .btn {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 16px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: linear-gradient(180deg, #0b846d, var(--brand-dark));
      color: #fff;
      box-shadow: 0 10px 20px rgba(8, 119, 97, 0.17);
      cursor: pointer;
      font-weight: 850;
    }

    .btn:hover {
      background: linear-gradient(180deg, #087761, #053f36);
    }

    .btn.secondary {
      border-color: rgba(8, 119, 97, 0.13);
      background: #eff7f4;
      color: var(--brand-dark);
      box-shadow: none;
    }

    .btn.ghost {
      border-color: var(--line);
      background: #fff;
      color: var(--muted-strong);
      box-shadow: none;
    }

    .btn:disabled {
      opacity: 0.56;
      cursor: not-allowed;
      box-shadow: none;
    }

    .result-preview {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .result-card {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-soft);
    }

    .result-card b {
      display: block;
      margin-bottom: 8px;
      color: var(--brand-dark);
    }

    .result-card p {
      margin: 0;
      color: var(--muted-strong);
      font-size: 13px;
      line-height: 1.65;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 1020px) {
      .shell,
      .page-body {
        grid-template-columns: 1fr;
      }

      .side,
      .aside-card {
        position: static;
      }

      .step-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 700px) {
      .container {
        width: min(100% - 20px, 1240px);
        padding-top: 12px;
      }

      .topbar {
        position: static;
        align-items: stretch;
        flex-direction: column;
      }

      .shell {
        margin-top: 14px;
      }

      .page-head,
      .grid-2,
      .question-row,
      .result-preview,
      .step-list,
      .scale-control {
        grid-template-columns: 1fr;
      }

      .page-body,
      .page-head,
      .footer-actions {
        padding: 16px;
      }

      .footer-actions {
        align-items: stretch;
        flex-direction: column;
      }

      .footer-actions span,
      .footer-actions .btn {
        width: 100%;
      }

      .footer-actions span {
        margin-right: 0;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="topbar">
      <div>
        <strong>专业方向选择助手</strong>
        <span>多页面问卷 demo ｜ 每页只处理一个判断主题</span>
      </div>
      <a class="btn secondary" href="#basic">回到第 1 页</a>
    </header>

    <div class="shell">
      <aside class="side" aria-label="问卷页面导航">
        <div class="progress-card">
          <span>整体进度</span>
          <strong id="progressText">14%</strong>
          <span id="pageText">第 1 / 7 页</span>
          <div class="progress-track" style="--progress: 14%;">
            <i></i>
          </div>
        </div>
        <nav class="step-list" id="stepList"></nav>
      </aside>

      <section class="main" id="pageMount" aria-live="polite"></section>
    </div>
  </main>

  <template id="basic">
    <div class="page-head">
      <div>
        <h1>基础背景</h1>
        <p>先把会影响判断的现实信息放到桌面上。这里不追求一次写完，只要把阶段、地区、学业背景和家庭约束补清楚。</p>
      </div>
      <div class="page-number"><b>01</b><span>背景定位</span></div>
    </div>
    <div class="page-body">
      <section class="panel">
        <h2>这一页只收集基础信息</h2>
        <div class="grid-2">
          <div class="field">
            <label for="studentName">姓名（可选）</label>
            <input id="studentName" placeholder="例如：张同学" />
          </div>
          <div class="field">
            <label for="stage">当前阶段</label>
            <select id="stage">
              <option>请选择</option>
              <option>高二</option>
              <option>高三</option>
              <option>复读</option>
              <option>大一转专业前</option>
            </select>
          </div>
          <div class="field">
            <label for="region">所在地区</label>
            <input id="region" placeholder="例如：河南周口 / 四川绵阳" />
          </div>
          <div class="field">
            <label for="schoolType">学校类型</label>
            <select id="schoolType">
              <option>普通高中</option>
              <option>重点高中</option>
              <option>中职</option>
              <option>国际体系</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>高中已选科目</label>
          <div class="tag-grid">
            <button class="tag active" type="button">语文</button>
            <button class="tag active" type="button">数学</button>
            <button class="tag" type="button">英语</button>
            <button class="tag" type="button">物理</button>
            <button class="tag" type="button">化学</button>
            <button class="tag" type="button">生物</button>
            <button class="tag" type="button">历史</button>
            <button class="tag" type="button">政治</button>
            <button class="tag" type="button">地理</button>
          </div>
          <p class="hint">仅作为背景信息，不作为主推荐依据。</p>
        </div>
        <div class="field">
          <label for="basicNote">背景补充（可选）</label>
          <textarea id="basicNote" placeholder="例如：数学波动较大；家里希望尽量省内读；希望本科毕业后尽快就业。"></textarea>
        </div>
      </section>
      <aside class="aside-card">
        <h3>本页回答会影响</h3>
        <ul>
          <li>推荐结果是否考虑本地发展</li>
          <li>是否需要优先避开长周期路径</li>
          <li>专业建议能否贴近真实家庭条件</li>
        </ul>
        <div class="note">建议先填能确定的内容，不确定的地方可以留给后面补充。</div>
      </aside>
    </div>
  </template>

  <template id="redlines">
    <div class="page-head">
      <div>
        <h1>红线排除</h1>
        <p>先排除明显不适合的专业特征，再谈推荐。这里不是给人贴标签，而是减少后续推荐里的误伤项。</p>
      </div>
      <div class="page-number"><b>02</b><span>排除边界</span></div>
    </div>
    <div class="page-body">
      <section class="panel">
        <h2>这一页只确认不能长期接受的事情</h2>
        <div class="question-list">
          <div class="question-row">
            <div><b>大量背诵和记忆性训练</b><p>例如法条、病理、概念、理论体系的长期记忆。</p></div>
            <div class="scale"><div class="scale-labels"><span>完全不能接受</span><span>可以接受</span></div><div class="scale-control"><input type="range" min="1" max="5" value="3" /><span class="score">3</span></div></div>
          </div>
          <div class="question-row">
            <div><b>代码、数据、公式类训练</b><p>是否愿意长期面对抽象逻辑、调试、计算和数据分析。</p></div>
            <div class="scale"><div class="scale-labels"><span>完全不能接受</span><span>可以接受</span></div><div class="scale-control"><input type="range" min="1" max="5" value="4" /><span class="score">4</span></div></div>
          </div>
          <div class="question-row">
            <div><b>高频表达、汇报、演讲</b><p>很多专业未来需要公开表达、展示方案或持续沟通。</p></div>
            <div class="scale"><div class="scale-labels"><span>完全不能接受</span><span>可以接受</span></div><div class="scale-control"><input type="range" min="1" max="5" value="2" /><span class="score">2</span></div></div>
          </div>
          <div class="question-row">
            <div><b>长期值班、作息不稳定</b><p>某些方向的成长路径会伴随夜班、值班或突发任务。</p></div>
            <div class="scale"><div class="scale-labels"><span>完全不能接受</span><span>可以接受</span></div><div class="scale-control"><input type="range" min="1" max="5" value="2" /><span class="score">2</span></div></div>
          </div>
        </div>
      </section>
      <aside class="aside-card">
        <h3>即时反馈</h3>
        <p>目前较强的排除项：高频公开表达、长期值班。</p>
        <div class="note">这些选择会缩小推荐范围，但不会被当成绝对结论。</div>
      </aside>
    </div>
  </template>

  <template id="interest">
    <div class="page-head">
      <div>
        <h1>兴趣澄清</h1>
        <p>这一页区分“长期兴趣”和“短期印象”。兴趣如果只来自收入、标签或网络信息，后续会被标记为需要继续验证。</p>
      </div>
      <div class="page-number"><b>03</b><span>兴趣证据</span></div>
    </div>
    <div class="page-body">
      <section class="panel">
        <h2>这一页只看兴趣从哪里来</h2>
        <div class="field">
          <label>你对某个专业感兴趣，更多因为</label>
          <div class="tag-grid">
            <button class="tag active" type="button">学习内容</button>
            <button class="tag" type="button">工作形象</button>
            <button class="tag active" type="button">就业前景</button>
            <button class="tag" type="button">收入印象</button>
            <button class="tag" type="button">家长建议</button>
            <button class="tag" type="button">老师/同学影响</button>
          </div>
        </div>
        <div class="grid-2">
          <div class="field">
            <label for="duration">这个兴趣持续了多久</label>
            <select id="duration">
              <option>1-6 个月</option>
              <option>半年以上</option>
              <option>从小或长期关注</option>
              <option>没有明确兴趣</option>
            </select>
          </div>
          <div class="field">
            <label for="reality">如果真实内容和想象不同</label>
            <select id="reality">
              <option>愿意继续了解</option>
              <option>可以先了解</option>
              <option>不太愿意</option>
              <option>不确定</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="interestNote">真实体验补充（可选）</label>
          <textarea id="interestNote" placeholder="例如：看过课程视频后仍愿意继续学；担心真实学习内容和想象不一样。"></textarea>
        </div>
      </section>
      <aside class="aside-card">
        <h3>本页回答会影响</h3>
        <ul>
          <li>兴趣是否直接进入推荐依据</li>
          <li>哪些方向需要先做验证任务</li>
          <li>结果解释是否提示风险来源</li>
        </ul>
      </aside>
    </div>
  </template>

  <template id="tasks">
    <div class="page-head">

          <div class="question-row"><div><b>数据逻辑</b><p>查数据、做表格、验证结论。</p></div><div class="scale"><div class="scale-labels"><span>不愿长期做</span><span>愿意长期做</span></div><div class="scale-control"><input type="range" min="1" max="5" value="5" /><span class="score">5</span></div></div></div>
          <div class="question-row"><div><b>表达说服</b><p>汇报、沟通、组织观点。</p></div><div class="scale"><div class="scale-labels"><span>不愿长期做</span><span>愿意长期做</span></div><div class="scale-control"><input type="range" min="1" max="5" value="2" /><span class="score">2</span></div></div></div>
          <div class="question-row"><div><b>动手实践</b><p>搭建、操作、实验、排查问题。</p></div><div class="scale"><div class="scale-labels"><span>不愿长期做</span><span>愿意长期做</span></div><div class="scale-control"><input type="range" min="1" max="5" value="4" /><span class="score">4</span></div></div></div>
        </div>

      <aside class="aside-card">

  <template id="values">

      <div>
        <h1>价值观地域</h1>

    </div>
    <div class="page-body">
      <section class="panel">
        <h2>这一页只看你更想交换什么</h2>
        <div class="question-list">
          <div class="question-row"><div><b>稳定保障 vs 成长空间</b><p>更看重确定性，还是更愿意为上限承担波动。</p></div><div class="scale"><div class="scale-labels"><span>稳定保障</span><span>成长空间</span></div><div class="scale-control"><input type="range" min="1" max="5" value="3" /><span class="score">3</span></div></div></div>
          <div class="question-row"><div><b>收入回报 vs 兴趣投入</b><p>当二者不能兼得时，真实优先级是什么。</p></div><div class="scale"><div class="scale-labels"><span>收入回报</span><span>兴趣投入</span></div><div class="scale-control"><input type="range" min="1" max="5" value="2" /><span class="score">2</span></div></div></div>
          <div class="question-row"><div><b>大城市高节奏 vs 本地稳定发展</b><p>未来地域会显著影响专业方向的风险和机会。</p></div><div class="scale"><div class="scale-labels"><span>大城市</span><span>本地稳定</span></div><div class="scale-control"><input type="range" min="1" max="5" value="4" /><span class="score">4</span></div></div></div>
        </div>
      </section>
      <aside class="aside-card">
        <h3>本页回答会影响</h3>
        <ul>
          <li>省内、省会、一二线城市路径排序</li>
          <li>结果中是否优先强调稳定性</li>

  <template id="costs">
    <div class="page-head">

      <div class="page-number"><b>06</b><span>承受条件</span></div>
    </div>
    <div class="page-body">
      <section class="panel">
        <h2>这一页只确认专业背后的成本</h2>
        <div class="question-list">
          <div class="question-row"><div><b>接受长学制或较长培养周期</b><p>例如医学、科研、部分高门槛方向。</p></div><div class="scale"><div class="scale-labels"><span>不能接受</span><span>可以接受</span></div><div class="scale-control"><input type="range" min="1" max="5" value="3" /><span class="score">3</span></div></div></div>
          <div class="question-row"><div><b>接受强竞争和持续筛选</b><p>热门或高收入方向通常伴随更强竞争。</p></div><div class="scale"><div class="scale-labels"><span>不能接受</span><span>可以接受</span></div><div class="scale-control"><input type="range" min="1" max="5" value="2" /><span class="score">2</span></div></div></div>
          <div class="question-row"><div><b>接受经常加班或不规律作息</b><p>部分岗位成长快，但生活节奏代价更高。</p></div><div class="scale"><div class="scale-labels"><span>不能接受</span><span>可以接受</span></div><div class="scale-control"><input type="range" min="1" max="5" value="2" /><span class="score">2</span></div></div></div>
        </div>
      </section>
      <aside class="aside-card">
        <h3>即时摘要</h3>
        <p>目前对强竞争、不规律作息接受度较低。后续推荐会降低对这些代价依赖较强的方向优先级。</p>
      </aside>
    </div>
  </template>

  <template id="conflicts">
    <div class="page-head">
      <div>
        <h1>冲突确认</h1>
        <p>最后只处理前面答案里可能互相矛盾的地方。确认后再生成结果，推荐会更像真实情况。</p>
      </div>
      <div class="page-number"><b>07</b><span>生成前检查</span></div>
    </div>
    <div class="page-body">
      <section class="panel">
        <h2>这一页只确认关键矛盾</h2>
        <div class="field">
          <label for="conflict1">高收入期待与竞争承受度可能存在冲突</label>
          <p class="hint">高收入方向通常伴随更强竞争、持续学习或城市平台要求。你更愿意保稳定，还是愿意承担更高竞争？</p>
          <textarea id="conflict1" placeholder="例如：可以接受短期竞争，但不希望长期高压；更想优先保稳定。"></textarea>
        </div>
        <div class="field">
          <label for="conflict2">本地发展倾向与热门方向机会分布需要确认</label>
          <p class="hint">部分热门方向优质机会更集中在省会或一二线城市。</p>
          <textarea id="conflict2" placeholder="例如：可以先去外地积累两三年，但长期希望回本地或省内。"></textarea>
        </div>
        <div class="result-preview">
          <article class="result-card"><b>生成结果会包含</b><p>优先专业方向、暂不优先方向、每类方向的理由和风险提示。</p></article>
          <article class="result-card"><b>家长可读版本</b><p>把专业选择解释成现实路径、投入代价和可验证任务。</p></article>
          <article class="result-card"><b>下一步探索</b><p>给出课程、访谈、资料和体验任务，避免只凭想象决策。</p></article>
        </div>
      </section>
      <aside class="aside-card">
        <h3>生成前检查</h3>
        <ul>
          <li>基础背景已补充</li>
          <li>红线边界已表达</li>
          <li>兴趣来源已说明</li>
          <li>专业代价已确认</li>
        </ul>
        <div class="note">Demo 不会真的调用模型，只展示多页面交互结构。</div>
      </aside>
    </div>
  </template>

  <script>
    const pages = [
      { id: "basic", label: "基础背景", cue: "背景定位" },
      { id: "redlines", label: "红线排除", cue: "排除边界" },
      { id: "interest", label: "兴趣澄清", cue: "兴趣证据" },
      { id: "tasks", label: "任务偏好", cue: "长期任务" },
      { id: "values", label: "价值观地域", cue: "真实取舍" },
      { id: "costs", label: "专业代价", cue: "承受条件" },
      { id: "conflicts", label: "冲突确认", cue: "生成前检查" }
    ];

    const stepList = document.querySelector("#stepList");
    const pageMount = document.querySelector("#pageMount");
    const progressText = document.querySelector("#progressText");
    const pageText = document.querySelector("#pageText");
    const progressTrack = document.querySelector(".progress-track");

    function pageIndexFromHash() {
      const id = location.hash.replace("#", "") || pages[0].id;
      const index = pages.findIndex((page) => page.id === id);
      return index >= 0 ? index : 0;
    }

    function renderSteps(activeIndex) {
      stepList.innerHTML = pages.map((page, index) => {
        const classes = ["step-link"];
        if (index === activeIndex) classes.push("active");
        if (index < activeIndex) classes.push("done");
        return `
          <a class="${classes.join(" ")}" href="#${page.id}">
            <span class="index">${index + 1}</span>
            <span>
              <b>${page.label}</b>
              <small>${index < activeIndex ? "已查看" : index === activeIndex ? "当前页面" : page.cue}</small>
            </span>
          </a>
        `;
      }).join("");
    }

    function attachDemoBehavior() {
      document.querySelectorAll(".tag").forEach((button) => {
        button.addEventListener("click", () => button.classList.toggle("active"));
      });

      document.querySelectorAll('input[type="range"]').forEach((range) => {
        const score = range.closest(".scale-control")?.querySelector(".score");
        if (!score) return;
        range.addEventListener("input", () => {
          score.textContent = range.value;
        });
      });
    }

    function renderPage() {
      const activeIndex = pageIndexFromHash();
      const page = pages[activeIndex];
      const template = document.querySelector(`#${page.id}`);
      const percent = Math.round(((activeIndex + 1) / pages.length) * 100);

      progressText.textContent = `${percent}%`;
      pageText.textContent = `第 ${activeIndex + 1} / ${pages.length} 页`;
      progressTrack.style.setProperty("--progress", `${percent}%`);
      renderSteps(activeIndex);

      pageMount.innerHTML = "";
      pageMount.append(template.content.cloneNode(true));

      const actions = document.createElement("div");
      actions.className = "footer-actions";
      const previous = pages[activeIndex - 1];
      const next = pages[activeIndex + 1];
      actions.innerHTML = `
        <span>${next ? `下一页：${next.label}` : "已到最后一页，可以生成结果。"}</span>
        <a class="btn ghost" ${previous ? `href="#${previous.id}"` : "aria-disabled=\"true\""}>${previous ? "上一页" : "已是第一页"}</a>
        ${next ? `<a class="btn" href="#${next.id}">下一页</a>` : `<button class="btn" type="button">生成专业方向结果</button>`}
      `;
      pageMount.append(actions);
      attachDemoBehavior();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    window.addEventListener("hashchange", renderPage);
    renderPage();
  </script>
</body>
</html>
