<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>不善言辞对话生成器 - 让"我该怎么说"变成可配置的生成过程</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #4F46E5;
            --primary-light: #818CF8;
            --primary-dark: #3730A3;
            --bg: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-primary: #1E293B;
            --text-secondary: #64748B;
            --text-muted: #94A3B8;
            --border: #E2E8F0;
            --success: #10B981;
            --warning: #F59E0B;
            --gentle: #ECFDF5;
            --formal: #EFF6FF;
            --direct: #FFF7ED;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
            --radius: 12px;
            --radius-sm: 8px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .app-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px 16px;
        }

        /* Header */
        .app-header {
            text-align: center;
            padding: 40px 20px 32px;
            margin-bottom: 32px;
        }

        .app-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .app-header .subtitle {
            font-size: 15px;
            color: var(--text-secondary);
            max-width: 500px;
            margin: 0 auto;
        }

        .app-header .emoji-icon {
            font-size: 48px;
            margin-bottom: 16px;
            display: block;
        }

        /* Card */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            padding: 28px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title .step-num {
            width: 24px;
            height: 24px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .form-label .required {
            color: #EF4444;
            margin-left: 2px;
        }

        .form-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Scenario Selection */
        .scenario-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
        }

        .scenario-item {
            padding: 12px 14px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.2s ease;
            background: var(--card-bg);
        }

        .scenario-item:hover {
            border-color: var(--primary-light);
            color: var(--primary);
            background: #F5F3FF;
        }

        .scenario-item.active {
            border-color: var(--primary);
            color: var(--primary);
            background: #EEF2FF;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .scenario-item .scenario-emoji {
            display: block;
            font-size: 24px;
            margin-bottom: 6px;
        }

        /* Select & Input */
        .form-select, .form-input, .form-textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            color: var(--text-primary);
            background: var(--card-bg);
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .form-select:focus, .form-input:focus, .form-textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .form-textarea {
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }

        /* Tone Selection */
        .tone-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tone-btn {
            padding: 8px 18px;
            border: 1.5px solid var(--border);
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.2s ease;
            background: var(--card-bg);
        }

        .tone-btn:hover {
            border-color: var(--primary-light);
        }

        .tone-btn.active {
            border-color: var(--primary);
            color: var(--primary);
            background: #EEF2FF;
        }

        /* Generate Button */
        .generate-btn {
            width: 100%;
            padding: 14px 24px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .generate-btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-lg);
        }

        .generate-btn:active {
            transform: translateY(0);
        }

        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .generate-btn .loading-spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .generate-btn.loading .loading-spinner {
            display: block;
        }

        .generate-btn.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Results */
        .results-section {
            display: none;
        }

        .results-section.visible {
            display: block;
        }

        .result-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            padding: 24px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            position: relative;
            transition: box-shadow 0.2s;
        }

        .result-card:hover {
            box-shadow: var(--shadow-md);
        }

        .result-card.tone-gentle {
            border-left: 4px solid #10B981;
        }

        .result-card.tone-formal {
            border-left: 4px solid #3B82F6;
        }

        .result-card.tone-direct {
            border-left: 4px solid #F59E0B;
        }

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .tone-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .tone-tag.gentle {
            background: var(--gentle);
            color: #059669;
        }

        .tone-tag.formal {
            background: var(--formal);
            color: #2563EB;
        }

        .tone-tag.direct {
            background: var(--direct);
            color: #D97706;
        }

        .copy-btn {
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-size: 12px;
            color: var(--text-secondary);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .copy-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .copy-btn.copied {
            border-color: var(--success);
            color: var(--success);
            background: #F0FDF4;
        }

        .result-content {
            font-size: 15px;
            line-height: 1.8;
            color: var(--text-primary);
            white-space: pre-wrap;
            padding: 16px;
            background: #F8FAFC;
            border-radius: var(--radius-sm);
            border: 1px solid #F1F5F9;
        }

        .result-meta {
            margin-top: 12px;
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Custom scenario input */
        .custom-scenario-input {
            margin-top: 12px;
            display: none;
        }

        .custom-scenario-input.visible {
            display: block;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .app-container {
                padding: 16px 12px;
            }

            .app-header h1 {
                font-size: 22px;
            }

            .scenario-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .tone-options {
                gap: 8px;
            }

            .card {
                padding: 20px 16px;
            }
        }

        /* Animation */
        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Footer */
        .app-footer {
            text-align: center;
            padding: 32px 20px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .app-footer a {
            color: var(--primary);
            text-decoration: none;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text-primary);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 1000;
            transition: transform 0.3s ease;
            box-shadow: var(--shadow-lg);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <span class="emoji-icon">💬</span>
            <h1>不善言辞对话生成器</h1>
            <p class="subtitle">让"我该怎么说"变成可配置的生成过程。输入场景，选择语气，一键生成得体的沟通话术。</p>
        </header>

        <!-- Step 1: Scenario -->
        <div class="card">
            <div class="card-title">
                <span class="step-num">1</span>
                选择沟通场景
            </div>
            <div class="scenario-grid" id="scenarioGrid">
                <div class="scenario-item" data-scenario="催进度">
                    <span class="scenario-emoji">⏰</span>
                    催促进度
                </div>
                <div class="scenario-item" data-scenario="解释延期">
                    <span class="scenario-emoji">📅</span>
                    解释延期
                </div>
                <div class="scenario-item" data-scenario="拒绝请求">
                    <span class="scenario-emoji">🙅</span>
                    拒绝请求
                </div>
                <div class="scenario-item" data-scenario="提出反馈">
                    <span class="scenario-emoji">💡</span>
                    提出反馈
                </div>
                <div class="scenario-item" data-scenario="请假调休">
                    <span class="scenario-emoji">🏖️</span>
                    请假调休
                </div>
                <div class="scenario-item" data-scenario="同步风险">
                    <span class="scenario-emoji">⚠️</span>
                    同步风险
                </div>
                <div class="scenario-item" data-scenario="请求帮助">
                    <span class="scenario-emoji">🤝</span>
                    请求帮助
                </div>
                <div class="scenario-item" data-scenario="custom">
                    <span class="scenario-emoji">✏️</span>
                    自定义
                </div>
            </div>
            <div class="custom-scenario-input" id="customScenario">
                <input type="text" class="form-input" id="customScenarioInput" placeholder="请输入你的沟通场景，如：向客户报价、邀请同事聚餐...">
            </div>
        </div>

        <!-- Step 2: Details -->
        <div class="card">
            <div class="card-title">
                <span class="step-num">2</span>
                补充沟通细节
            </div>

            <div class="form-group">
                <label class="form-label">沟通对象 <span class="required">*</span></label>
                <select class="form-select" id="recipientSelect">
                    <option value="">请选择对象关系</option>
                    <option value="领导">直属领导/上级</option>
                    <option value="同事">平级同事</option>
                    <option value="下属">下属/团队成员</option>
                    <option value="客户">客户/甲方</option>
                    <option value="跨部门">跨部门协作方</option>
                    <option value="外部">外部合作伙伴</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">语气偏好</label>
                <div class="tone-options" id="toneOptions">
                    <div class="tone-btn active" data-tone="温和委婉">🌿 温和委婉</div>
                    <div class="tone-btn" data-tone="专业正式">👔 专业正式</div>
                    <div class="tone-btn" data-tone="直接高效">⚡ 直接高效</div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">关键信息 <span class="required">*</span></label>
                <textarea class="form-textarea" id="keyPointsInput" placeholder="请简要描述你需要传达的核心信息&#10;例如：项目因为第三方接口延迟，需要延期3天交付"></textarea>
                <p class="form-hint">写下你想说的关键点，工具会帮你组织成得体的表达</p>
            </div>

            <div class="form-group">
                <label class="form-label">补充上下文（可选）</label>
                <textarea class="form-textarea" id="contextInput" placeholder="如有特殊背景可补充，如：对方性格、之前沟通历史、紧迫程度等" style="min-height: 60px;"></textarea>
            </div>
        </div>

        <!-- Generate Button -->
        <button class="generate-btn" id="generateBtn" onclick="generateDialogue()">
            <span class="loading-spinner"></span>
            <span class="btn-text">✨ 生成得体话术</span>
        </button>

        <!-- Results -->
        <div class="results-section" id="resultsSection">
            <div style="margin-top: 32px; margin-bottom: 16px;">
                <h3 style="font-size: 18px; font-weight: 600;">📋 生成结果</h3>
                <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">三种语气版本，选择最适合当下情境的一个</p>
            </div>

            <div id="resultsContainer"></div>
        </div>

        <!-- Footer -->
        <footer class="app-footer">
            <p>由 TRAE AI 创造力大赛参赛作品 · 不善言辞对话生成器</p>
            <p style="margin-top: 4px;">让每一次关键沟通都从容不迫</p>
        </footer>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // State
        let selectedScenario = '';
        let selectedTone = '温和委婉';
        let isCustomScenario = false;

        // Scenario Selection
        document.querySelectorAll('.scenario-item').forEach(function(item) {
            item.addEventListener('click', function() {
                document.querySelectorAll('.scenario-item').forEach(function(el) {
                    el.classList.remove('active');
                });
                this.classList.add('active');
                var scenario = this.getAttribute('data-scenario');

                if (scenario === 'custom') {
                    isCustomScenario = true;
                    document.getElementById('customScenario').classList.add('visible');
                    selectedScenario = '';
                } else {
                    isCustomScenario = false;
                    document.getElementById('customScenario').classList.remove('visible');
                    selectedScenario = scenario;
                }
            });
        });

        // Custom scenario input
        document.getElementById('customScenarioInput').addEventListener('input', function() {
            selectedScenario = this.value;
        });

        // Tone Selection
        document.querySelectorAll('.tone-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tone-btn').forEach(function(el) {
                    el.classList.remove('active');
                });
                this.classList.add('active');
                selectedTone = this.getAttribute('data-tone');
            });
        });

        // Generate Dialogue
        function generateDialogue() {
            var recipient = document.getElementById('recipientSelect').value;
            var keyPoints = document.getElementById('keyPointsInput').value.trim();
            var context = document.getElementById('contextInput').value.trim();

            // Validation
            if (!selectedScenario) {
                showToast('请先选择一个沟通场景');
                return;
            }
            if (isCustomScenario && !selectedScenario) {
                showToast('请输入自定义场景描述');
                return;
            }
            if (!recipient) {
                showToast('请选择沟通对象');
                return;
            }
            if (!keyPoints) {
                showToast('请填写关键信息');
                return;
            }

            // Show loading
            var btn = document.getElementById('generateBtn');
            btn.classList.add('loading');
            btn.disabled = true;

            // Simulate generation delay
            setTimeout(function() {
                var results = generateResults(selectedScenario, recipient, keyPoints, context, selectedTone);
                renderResults(results);
                btn.classList.remove('loading');
                btn.disabled = false;

                // Scroll to results
                document.getElementById('resultsSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 1200);
        }

        // Core generation logic
        function generateResults(scenario, recipient, keyPoints, context, preferredTone) {
            var tones = ['温和委婉', '专业正式', '直接高效'];
            var results = [];

            for (var i = 0; i < tones.length; i++) {
                var tone = tones[i];
                var content = buildMessage(scenario, recipient, keyPoints, context, tone);
                var charCount = content.length;
                var estimatedTime = Math.ceil(charCount / 200);

                results.push({
                    tone: tone,
                    content: content,
                    charCount: charCount,
                    readTime: estimatedTime,
                    isPreferred: tone === preferredTone
                });
            }

            // Sort: preferred tone first
            results.sort(function(a, b) {
                if (a.isPreferred && !b.isPreferred) return -1;
                if (!a.isPreferred && b.isPreferred) return 1;
                return 0;
            });

            return results;
        }

        function buildMessage(scenario, recipient, keyPoints, context, tone) {
            var recipientTitle = getRecipientTitle(recipient);
            var greeting = getGreeting(recipient, tone);
            var closing = getClosing(recipient, tone);
            var body = buildBody(scenario, recipient, keyPoints, context, tone);

            var message = greeting + '\n\n' + body + '\n\n' + closing;
            return message;
        }

        function getRecipientTitle(recipient) {
            var map = {
                '领导': '领导',
                '同事': '',
                '下属': '',
                '客户': '您',
                '跨部门': '',
                '外部': '您'
            };
            return map[recipient] || '';
        }

        function getGreeting(recipient, tone) {
            var greetings = {
                '领导': {
                    '温和委婉': '领导您好，打扰您了，有件事想跟您汇报一下：',
                    '专业正式': '领导您好，现就相关情况向您做一个简要汇报：',
                    '直接高效': '领导好，跟您同步一个情况：'
                },
                '同事': {
                    '温和委婉': '嗨，方便的时候想跟你聊个事儿~',
                    '专业正式': '你好，有个工作相关的事情想跟你沟通一下：',
                    '直接高效': '嗨，跟你说个事：'
                },
                '下属': {
                    '温和委婉': '你好呀，有个事情想跟你聊一下：',
                    '专业正式': '你好，关于近期的工作安排，有几点想和你沟通：',
                    '直接高效': '你好，说个事情：'
                },
                '客户': {
                    '温和委婉': '您好，感谢您一直以来的支持与信任，有个情况想跟您说明一下：',
                    '专业正式': '尊敬的客户您好，现就相关事项向您做如下说明：',
                    '直接高效': '您好，跟您同步一个最新进展：'
                },
                '跨部门': {
                    '温和委婉': '你好~打扰一下，有个事情想跟你协调一下：',
                    '专业正式': '你好，关于跨部门协作的事项，想与你沟通如下：',
                    '直接高效': '你好，有个协作事项需要对齐一下：'
                },
                '外部': {
                    '温和委婉': '您好，打扰了，有件事情想和您沟通一下：',
                    '专业正式': '您好，现就相关事宜与您沟通如下：',
                    '直接高效': '您好，和您同步一个情况：'
                }
            };

            if (greetings[recipient] && greetings[recipient][tone]) {
                return greetings[recipient][tone];
            }
            return '你好：';
        }

        function getClosing(recipient, tone) {
            var closings = {
                '领导': {
                    '温和委婉': '以上是我的想法，您看这样处理可以吗？有什么需要调整的地方请随时指示，我这边立刻跟进。谢谢您！',
                    '专业正式': '以上情况特此汇报，如有需要补充之处请指示，我将及时跟进处理。感谢您的指导。',
                    '直接高效': '您看这样处理OK吗？有问题随时说，我马上调整。'
                },
                '同事': {
                    '温和委婉': '大概就是这些，你看看有没有什么问题~有任何想法随时找我聊哈，谢谢啦！',

            if (closings[recipient] && closings[recipient][tone]) {

        }

        function buildBody(scenario, recipient, keyPoints, context, tone) {
            var bodyTemplates = getBodyTemplates(scenario, tone);
            var body = replacePlaceholders(bodyTemplates, keyPoints, context, recipient);
            return body;
        }

        function getBodyTemplates(scenario, tone) {

                    '直接高效': '同步一个进度变化：\n\n{keyPoints}\n\n需要延期，新的预计完成时间确认后第一时间告诉你。有影响你安排的地方直接说，我来调整。'
                },
                '拒绝请求': {
                    '温和委婉': '你说的这个事情我认真想了一下，真的很想帮你，但目前确实有些困难：\n\n{keyPoints}\n\n不是不想配合，实在是现阶段精力/资源有限，怕答应了反而做不好耽误你。要不我们看看有没有其他方案，或者等这阵子忙完了再来推进？',

                    '直接高效': '给你一些直接反馈：\n\n{keyPoints}\n\n这些问题需要尽快调整，我们找个时间对一下改进方案。'
                },
                '请假调休': {
                    '温和委婉': '想跟你请个假/申请调休，情况是这样的：\n\n{keyPoints}\n\n我计划的时间是{plannedTime}，目前手头上的工作我会提前安排好，确保不影响进度。如果有紧急事项也可以随时联系我，你看方便批准吗？',
                    '专业正式': '现因个人事务需要申请休假/调休，具体情况如下：\n\n{keyPoints}\n\n请假时间：{plannedTime}。休假前将完成手头工作交接，确保业务连续性。恳请批准。',
                    '直接高效': '想请个假：\n\n{keyPoints}\n\n时间：{plannedTime}。工作会提前安排好，有急事可以找我。麻烦审批一下。'
                },
                '同步风险': {
                    '温和委婉': '有个情况想提前跟你预警一下，目前发现了一些潜在的风险点：\n\n{keyPoints}\n\n暂时还不确定是否一定会影响，但我觉得提前说一声比较好，这样万一有问题我们也有准备。你觉得需要做什么预防措施吗？',
                    '专业正式': '现就项目中识别到的风险事项进行同步：\n\n{keyPoints}\n\n风险等级：{riskLevel}。建议应对措施：提前准备备选方案，加强关键节点监控。请评估是否需要升级处理。',
                    '直接高效': '预警一个风险：\n\n{keyPoints}\n\n需要关注，建议提前准备Plan B。你看要不要拉个会对齐一下？'

        function replacePlaceholders(template, keyPoints, context, recipient) {
            var result = template.replace('{keyPoints}', keyPoints);

            // Add context if provided
            if (context) {
                result += '\n\n另外补充一下背景：' + context;
            }

            return result;
        }

        // Render Results
        function renderResults(results) {
            var container = document.getElementById('resultsContainer');
            container.innerHTML = '';

            var toneClassMap = {
                '温和委婉': 'gentle',
                '专业正式': 'formal',
                '直接高效': 'direct'
            };

            var toneEmojiMap = {
                '温和委婉': '🌿',
                '专业正式': '👔',
                '直接高效': '⚡'
            };

            for (var i = 0; i < results.length; i++) {
                var result = results[i];
                var toneClass = toneClassMap[result.tone];
                var emoji = toneEmojiMap[result.tone];
                var preferredBadge = result.isPreferred ? ' <span style="font-size:11px;background:#EEF2FF;color:#4F46E5;padding:2px 8px;border-radius:10px;margin-left:6px;">你选择的偏好</span>' : '';

                var cardHtml = '<div class="result-card tone-' + toneClass + ' fade-in">' +
                    '<div class="result-header">' +
                    '<span class="tone-tag ' + toneClass + '">' + emoji + ' ' + result.tone + preferredBadge + '</span>' +
                    '<button class="copy-btn" onclick="copyText(this, ' + i + ')">📋 复制</button>' +
                    '</div>' +
                    '<div class="result-content">' + escapeHtml(result.content) + '</div>' +
                    '<div class="result-meta">' +
                    '<span>📝 ' + result.charCount + ' 字</span>' +
                    '<span>⏱️ 预计阅读 ' + result.readTime + ' 分钟</span>' +
                    '</div>' +
                    '</div>';

                container.innerHTML += cardHtml;
            }

            // Store results for copy
            window._generatedResults = results;

            // Show results section
            document.getElementById('resultsSection').classList.add('visible');
        }

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.appendChild(document.createTextNode(text));
            return div.innerHTML;
        }

        // Copy to clipboard
        function copyText(btn, index) {
            var text = window._generatedResults[index].content;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function() {
                    showCopied(btn);
                }).catch(function() {
                    fallbackCopy(text, btn);
                });
            } else {
                fallbackCopy(text, btn);
            }
        }

        function fallbackCopy(text, btn) {
            var textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showCopied(btn);
            } catch (e) {
                showToast('复制失败，请手动复制');
            }
            document.body.removeChild(textarea);
        }

        function showCopied(btn) {
            btn.classList.add('copied');
            btn.innerHTML = '✅ 已复制';
            showToast('已复制到剪贴板');
            setTimeout(function() {
                btn.classList.remove('copied');
                btn.innerHTML = '📋 复制';
            }, 2000);
        }

        // Toast
        function showToast(message) {
            var toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(function() {
                toast.classList.remove('show');
            }, 2500);
        }
    </script>
