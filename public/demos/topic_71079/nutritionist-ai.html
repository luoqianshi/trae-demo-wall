async function checkOllamaStatus(baseUrl) {
  try {
    const res = await fetch(baseUrl.replace('/v1', '/api/tags'), { method: 'GET' });
    if (res.ok) {
      const data = await res.json();
      return { ok: true, models: data.models ? data.models.map(m => m.name) : [] };
    }
    return { ok: false, error: '无法连接' };
  } catch (e) {
    return { ok: false, error: e.message };
  }
}

const loadedPrompts = {};

async function loadPromptFromFile(personaId) {
  if (loadedPrompts[personaId]) return loadedPrompts[personaId];
  try {
    const url = `prompts/${personaId}.txt`;
    const res = await fetch(url);
    if (res.ok) {
      const text = await res.text();
      loadedPrompts[personaId] = text.trim();
      return loadedPrompts[personaId];
    }
  } catch (e) {
    console.warn('Failed to load prompt from file:', personaId, e);
  }
  return null;
}

function getPersonaSystemPrompt(personaId) {
  return loadedPrompts[personaId] || EMBEDDED_PROMPTS[personaId] || EMBEDDED_PROMPTS.professional;
}

async function preloadPrompts() {
  await Promise.all(['professional', 'fun', 'coach'].map(loadPromptFromFile));
}

async function callRealAI(messages, config, personaId) {
  const url = config.baseUrl + '/chat/completions';
  const body = {
    model: config.model,
    messages: [
      { role: 'system', content: getPersonaSystemPrompt(personaId) },
      ...messages.map(m => ({ role: m.type === 'user' ? 'user' : 'assistant', content: m.text }))
    ],
    temperature: 0.8,
    max_tokens: 500,
    stream: false
  };

  const res = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  });

  if (!res.ok) {
    const err = await res.text();
    throw new Error('Ollama调用失败: ' + err);
  }

  const data = await res.json();

function checkStorageQuota() {
  try {
    const key = 'storage_test_' + Date.now();
    const testData = 'x'.repeat(1024 * 1024);
    localStorage.setItem(key, testData);
    localStorage.removeItem(key);
    return { ok: true, message: '存储正常' };
  } catch (e) {
    if (e.name === 'QuotaExceededError') {
      return { ok: false, message: '存储空间不足，请清理浏览器缓存', type: 'quota' };
    }
    return { ok: false, message: '存储访问受限', type: 'permission' };
  }
}

function checkMemoryStatus() {
  if (typeof performance !== 'undefined' && performance.memory) {
    const used = performance.memory.usedJSHeapSize / (1024 * 1024);
    const total = performance.memory.totalJSHeapSize / (1024 * 1024);
    const percentage = (used / total) * 100;
    if (percentage > 85) {
      return { ok: false, message: `内存使用率过高 (${percentage.toFixed(1)}%)`, level: 'high' };
    }
    if (percentage > 70) {
      return { ok: true, message: `内存使用率偏高 (${percentage.toFixed(1)}%)`, level: 'medium' };
    }
    return { ok: true, message: `内存正常 (${percentage.toFixed(1)}%)`, level: 'low' };
  }
  return { ok: true, message: '内存检测不可用', level: 'unknown' };
}

async function runEnvironmentCheck() {
  const results = { api: [], resources: [], browser: [], overall: { passed: 0, warning: 0, error: 0, total: 0 } };
  
  for (const api of ENV_CHECK_CONFIG.requiredAPIs) {
    const passed = api.check();
    const level = api.critical && !passed ? 'error' : passed ? 'passed' : 'warning';
    results.api.push({ ...api, passed, level });
    results.overall[level]++;
    results.overall.total++;
  }
  
  for (const resource of ENV_CHECK_CONFIG.requiredResources) {
    try {
      const response = await fetch(resource.path, { method: 'HEAD', cache: 'no-cache' });
      const passed = response.ok;
      const level = resource.critical && !passed ? 'error' : passed ? 'passed' : 'warning';
      results.resources.push({ ...resource, passed, status: response.status, level });
      results.overall[level]++;
      results.overall.total++;
    } catch (e) {
      const level = resource.critical ? 'error' : 'warning';
      results.resources.push({ ...resource, passed: false, status: 0, error: e.message, level });
      results.overall[level]++;
      results.overall.total++;
    }
  }
  
  for (const feature of ENV_CHECK_CONFIG.browserFeatures) {
    const passed = feature.check();
    const level = feature.critical && !passed ? 'error' : passed ? 'passed' : 'warning';
    results.browser.push({ ...feature, passed, level });
    results.overall[level]++;
    results.overall.total++;
  }
  
  return results;
}

function formatEnvCheckResults(results) {
  const messages = [];
  const criticalErrors = results.api.filter(a => a.critical && !a.passed).concat(results.resources.filter(r => r.critical && !r.passed));
  
  if (criticalErrors.length > 0) {
    messages.push({ type: 'error', icon: '❌', message: `检测到 ${criticalErrors.length} 项关键依赖缺失，请检查浏览器兼容性`, details: criticalErrors.map(e => e.name).join(', ') });
  }
  
  const warnings = results.api.filter(a => !a.critical && !a.passed).concat(results.resources.filter(r => !r.critical && !r.passed));
  if (warnings.length > 0) {
    messages.push({ type: 'warning', icon: '⚠️', message: `检测到 ${warnings.length} 项可选功能不可用，部分功能可能受限`, details: warnings.map(w => w.name).join(', ') });
  }
  
  const missingResources = results.resources.filter(r => !r.passed && r.critical);
  if (missingResources.length > 0) {
    messages.push({ type: 'error', icon: '📦', message: `关键资源文件缺失: ${missingResources.map(r => r.path).join(', ')}`, action: '请确保所有文件完整' });
  }
  
  return messages;
}

async function autoFixEnvironment(issues) {
  const fixes = [];
  
  for (const issue of issues) {
    if (issue.type === 'error') {
      if (issue.action === 'clear_storage') {
        try {
          clearAllData();
          fixes.push({ issue: issue.message, result: 'success', action: '清理存储数据' });
        } catch (e) {
          fixes.push({ issue: issue.message, result: 'failed', action: '清理存储数据', error: e.message });
        }
      } else if (issue.action === 'reset_config') {
        try {
          saveAIConfig(DEFAULT_AI_CONFIG);
          fixes.push({ issue: issue.message, result: 'success', action: '重置AI配置' });
        } catch (e) {
          fixes.push({ issue: issue.message, result: 'failed', action: '重置AI配置', error: e.message });
        }
      } else if (issue.action === 'migrate_data') {
        try {
          await migrateOldData();
          fixes.push({ issue: issue.message, result: 'success', action: '迁移旧数据' });
        } catch (e) {
          fixes.push({ issue: issue.message, result: 'failed', action: '迁移旧数据', error: e.message });
        }
      }
    }
  }
  
  return fixes;
}

const LOG_STORAGE_KEY = 'nutritionist_ai_logs';
const MAX_LOG_ENTRIES = 500;

function logEvent(category, action, details = {}) {
  try {
    const entry = {
      timestamp: Date.now(),
      category,
      action,
      details: typeof details === 'string' ? details : JSON.stringify(details),
      page: window.location.pathname,
      referrer: document.referrer,
      userAgent: navigator.userAgent.substring(0, 200)
    };
    
    const logs = JSON.parse(localStorage.getItem(LOG_STORAGE_KEY) || '[]');
    logs.unshift(entry);
    
    if (logs.length > MAX_LOG_ENTRIES) {
      logs.splice(MAX_LOG_ENTRIES);
    }
    
    localStorage.setItem(LOG_STORAGE_KEY, JSON.stringify(logs));
  } catch (e) {
    console.warn('Failed to log event:', e);
  }
}

function getRecentLogs(count = 50) {
  try {
    const logs = JSON.parse(localStorage.getItem(LOG_STORAGE_KEY) || '[]');
    return logs.slice(0, count);
  } catch (e) {
    return [];
  }
}

function clearLogs() {
  localStorage.removeItem(LOG_STORAGE_KEY);
}

function monitorPerformance() {
  if (typeof PerformanceObserver !== 'undefined') {
    try {
      const observer = new PerformanceObserver((entries) => {
        for (const entry of entries) {
          if (entry.entryType === 'measure' || entry.entryType === 'resource') {
            logEvent('performance', entry.entryType, {
              name: entry.name,
              duration: entry.duration,
              size: entry.transferSize,
              type: entry.initiatorType
            });
          }
        }
      });
      observer.observe({ entryTypes: ['measure', 'resource'] });
      return observer;
    } catch (e) {
      console.warn('Performance observer not supported:', e);
    }
  }
  return null;
}

function monitorErrors() {
  window.addEventListener('error', (event) => {
    logEvent('error', 'runtime', {
      message: event.message,
      filename: event.filename,
      line: event.lineno,
      column: event.colno,
      error: event.error ? event.error.stack : 'no stack'
    });
  });
  
  window.addEventListener('unhandledrejection', (event) => {
    logEvent('error', 'promise', {
      reason: event.reason ? (typeof event.reason === 'string' ? event.reason : JSON.stringify(event.reason)) : 'unknown'
    });
  });
}

function monitorNetwork() {
  let onlineStatus = navigator.onLine;
  
  window.addEventListener('online', () => {
    onlineStatus = true;
    logEvent('network', 'online', {});
  });
  
  window.addEventListener('offline', () => {
    onlineStatus = false;
    logEvent('network', 'offline', {});
  });
  
  return () => onlineStatus;
}

function monitorStorageChanges() {
  window.addEventListener('storage', (event) => {
    logEvent('storage', 'change', {
      key: event.key,
      oldValue: event.oldValue ? 'exists' : null,
      newValue: event.newValue ? 'exists' : null,
      url: event.url
    });
  });
}

function secureSave(key, data) {
  try {
    const payload = {
      v: APP_VERSION,
      ts: Date.now(),
      d: data
    };
    localStorage.setItem(key, JSON.stringify(payload));
    return { success: true };
  } catch (e) {
    console.warn('Storage save failed:', e);
    if (e.name === 'QuotaExceededError') {
      return { success: false, error: 'storage_quota' };
    }
    return { success: false, error: 'storage_error' };
  }
}

function secureLoad(key, defaultValue = {}) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return defaultValue;
    const payload = JSON.parse(raw);
    if (payload.v !== APP_VERSION) {
      console.warn('Storage version mismatch, resetting');
      localStorage.removeItem(key);
      return defaultValue;
    }
    return payload.d || defaultValue;
  } catch (e) {
    console.warn('Storage load failed, resetting:', e);
    localStorage.removeItem(key);
    return defaultValue;
  }
}

function clearAllData() {
  try {
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(CHAT_HISTORY_KEY);
    localStorage.removeItem(TASKS_KEY);
    localStorage.removeItem(AI_CONFIG_KEY);
  } catch (e) {
    console.warn('Clear data failed:', e);
  }
}
