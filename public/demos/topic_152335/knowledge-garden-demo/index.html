@keyframes garden-shake {
  0%, 100% { transform: translateX(0); }
  15% { transform: translateX(-10px); }
  30% { transform: translateX(10px); }
  45% { transform: translateX(-8px); }
  60% { transform: translateX(8px); }
  75% { transform: translateX(-4px); }
}
@keyframes garden-flash-green {
  0% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
  30% { box-shadow: 0 0 50px 10px rgba(34,197,94,0.35); }
  100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
}
@keyframes garden-float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
@keyframes garden-grow {
  0% { transform: scale(0.3) translateY(8px); opacity: 0; }
  50% { transform: scale(1.15) translateY(-3px); }
  100% { transform: scale(1) translateY(0); opacity: 1; }
}
@keyframes garden-bloom {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}
@keyframes garden-sun {
  0%, 100% { opacity: 0.75; }
  50% { opacity: 1; }
}
@keyframes garden-drift {
  0% { transform: translateX(0); }
  100% { transform: translateX(30px); }
}
@keyframes garden-butterfly {
  0% { transform: translate(0, 0) rotate(0deg); }
  25% { transform: translate(25px, -20px) rotate(8deg); }
  50% { transform: translate(50px, 5px) rotate(-5deg); }
  75% { transform: translate(25px, 20px) rotate(4deg); }
  100% { transform: translate(0, 0) rotate(0deg); }
}
@keyframes garden-wilt {
  0% { transform: scale(1) rotate(0deg); opacity: 1; }
  50% { transform: scale(0.9) rotate(-3deg); opacity: 0.7; }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}
.animate-garden-shake { animation: garden-shake 0.5s ease-in-out; }
.animate-garden-flash-green { animation: garden-flash-green 1s ease-out; }
.animate-garden-float { animation: garden-float 4s ease-in-out infinite; }
.animate-garden-grow { animation: garden-grow 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
.animate-garden-bloom { animation: garden-bloom 2s ease-in-out infinite; }
.animate-garden-sun { animation: garden-sun 4s ease-in-out infinite; }
.animate-garden-drift { animation: garden-drift 8s ease-in-out infinite alternate; }
.animate-garden-butterfly { animation: garden-butterfly 6s ease-in-out infinite; }
.animate-garden-wilt { animation: garden-wilt 0.5s ease-in-out; }
