<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>救邻 - AI 急救指引</title>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/ai-guide.css">
</head>
<body>
<div id="app">
  <div class="ai-header">
    <h2>AI 急救助手</h2>
    <p>描述症状，获取即时急救指导</p>
  </div>
  <div class="ai-input-area">
    <textarea class="textarea" id="ai-input" placeholder="例如：家里老人突然倒地，没有反应，也没有呼吸..."></textarea>
  </div>
  <button class="btn btn-purple" onclick="getAIGuidance()">获取急救指引</button>
  
  <div class="ai-samples">
    <h3>常见症状</h3>
    <div class="sample-tags" id="sample-tags"></div>
  </div>

  <div class="ai-result" id="ai-result" style="display:none;"></div>
  <div class="ai-disclaimer">本指引仅供参考，紧急情况请立即拨打 120。本平台不替代专业医疗建议。</div>
</div>
<script src="js/common.js"></script>
<script src="js/data.js"></script>
<script src="js/ai-guide.js"></script>
</body>
</html>
