<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>救邻 - 志愿者</title>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/volunteer.css">
</head>
<body>
<div id="app">
  <div class="volunteer-header">
    <div class="volunteer-status">
      <div class="status-dot"></div>
      <span>在线可接单</span>
    </div>
    <div class="volunteer-name">李医生</div>
    <div class="volunteer-title">急诊科 · 执业证书已核验</div>
    <div class="volunteer-stats">
      <div class="volunteer-stat">
        <div class="volunteer-stat-num">12</div>
        <div class="volunteer-stat-label">累计救助</div>
      </div>
      <div class="volunteer-stat">
        <div class="volunteer-stat-num">98%</div>
        <div class="volunteer-stat-label">响应率</div>
      </div>
      <div class="volunteer-stat">
        <div class="volunteer-stat-num">4.9</div>
        <div class="volunteer-stat-label">评分</div>
      </div>
    </div>
  </div>

  <div class="toggle-online">
    <div class="toggle-label">
      <h3>在线接单</h3>
      <p>开启后系统将向您推送附近紧急救援</p>
    </div>
    <div class="switch on" id="online-switch" onclick="toggleOnline()"></div>
  </div>

  <div id="emergency-alert" class="emergency-alert">
    <div class="alert-icon">🚨</div>
    <div class="alert-title">附近有紧急救援</div>
    <div class="alert-distance">280m</div>
    <div class="alert-address">朝阳公园南门 · 心脏骤停</div>
    <div class="alert-btns">
      <button class="alert-btn accept" onclick="acceptTask()">立即接单</button>
      <button class="alert-btn reject" onclick="rejectTask()">暂不接单</button>
    </div>
  </div>

  <div id="task-detail" class="task-detail hidden">
    <div class="task-map">
      <div class="map-route"></div>
      <div class="map-point map-start">我</div>
      <div class="map-point map-end">患</div>
    </div>
    <div class="card">
      <div class="card-header">
        <div class="card-title"><span>🫀</span>救援任务</div>
        <div class="badge badge-red">心脏骤停</div>
      </div>
      <p style="font-size:14px;line-height:1.8;margin-bottom:12px;">
        <strong>患者位置：</strong>朝阳公园南门东侧 50 米<br>
        <strong>预计到达：</strong>步行 3 分钟<br>
        <strong>AED 设备：</strong>社区服务中心 AED 已解锁，距患者 150 米
      </p>
      <button class="btn btn-blue" style="width:100%;margin:0;" onclick="startNavigation()">开始导航</button>
    </div>
  </div>

  <div class="section-title">今日任务</div>
  <div class="task-list">
    <div class="card">
      <div class="list-item" style="padding-top:0;">
        <div class="avatar" style="background:var(--green-light);">📚</div>
        <div class="list-content">
          <div class="list-title">社区急救培训</div>
          <div class="list-desc">14:00 · 朝阳区红十字会 · CPR 复训课程</div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="js/common.js"></script>
<script src="js/volunteer.js"></script>
</body>
</html>
