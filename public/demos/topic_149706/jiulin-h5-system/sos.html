<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>救邻 - 紧急呼救</title>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/sos.css">
</head>
<body>
<div id="app">
  <!-- 症状选择 -->
  <div id="step-symptom" class="screen-section active">
    <div class="flow-header">
      <h2>发生了什么紧急情况？</h2>
      <p>请尽量选择最符合的症状，便于匹配最合适的救援力量</p>
    </div>
    <div class="symptom-grid" id="symptom-grid"></div>
    <button class="btn btn-primary" id="confirm-symptom" disabled onclick="startRescue()">确认并呼救</button>
  </div>

  <!-- 加载中 -->
  <div id="step-loading" class="screen-section loading-screen">
    <div class="loading-ring"></div>
    <div class="loading-title">正在为您调度救援</div>
    <div class="loading-status" id="loading-status">正在获取您的位置...</div>
    <div class="loading-log">
      <div class="log-item done" id="log-1">获取 GPS 定位</div>
      <div class="log-item pending" id="log-2">推送附近持证志愿者</div>
      <div class="log-item pending" id="log-3">触发 AED 设备调度</div>
      <div class="log-item pending" id="log-4">同步 120 急救中心</div>
    </div>
  </div>

  <!-- 救援中 -->
  <div id="step-rescue" class="screen-section">
    <div class="rescue-banner">
      <div class="rescue-timer" id="rescue-timer">00:00</div>
      <div class="rescue-timer-label">救援进行中 · 请保持冷静</div>
      <div class="rescue-status-pill">
        <div class="status-dot"></div>
        <span id="rescue-status-text">志愿者已接单，正在赶来</span>
      </div>
    </div>

    <div style="padding: 16px;">
      <div class="card">
        <div class="card-header">
          <div class="card-title"><span>👨‍⚕️</span>志愿者</div>
          <div class="badge badge-green">已接单</div>
        </div>
        <div class="rescue-person">
          <div class="person-avatar" style="background: var(--blue-light);">李</div>
          <div class="person-info">
            <div class="person-name">李医生 · 急诊科</div>
            <div class="person-meta">三甲医院 · 执业证书已核验</div>
          </div>
          <div class="person-distance">280m</div>
        </div>
        <button class="rescue-action btn-primary" onclick="callVolunteer()">电话联系志愿者</button>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title"><span>📍</span>AED 设备</div>
          <div class="badge badge-blue">已解锁</div>
        </div>
        <div class="rescue-person">
          <div class="person-avatar" style="background: var(--green-light);">A</div>
          <div class="person-info">
            <div class="person-name">社区服务中心 AED</div>
            <div class="person-meta">24小时公共 · 智能柜已解锁</div>
          </div>
          <div class="person-distance">150m</div>
        </div>
        <button class="rescue-action btn-blue" onclick="JLCommon.goTo('aed')">查看 AED 导航</button>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title"><span>🚑</span>120 急救</div>
          <div class="badge badge-orange">已通知</div>
        </div>
        <p style="font-size:13px;color:var(--gray-600);line-height:1.7;margin-bottom:12px;">您的位置和症状信息已同步至 120 调度中心，救护车正在赶来，请保持电话畅通。</p>
        <button class="rescue-action btn-green" onclick="call120()">拨打 120</button>
      </div>
    </div>

    <div class="guidance-box">
      <h3><span>📋</span>等待期间您可以这样做</h3>
      <ul class="guidance-list" id="rescue-guidance"></ul>
    </div>

    <button class="btn btn-secondary" onclick="JLCommon.goTo('home')">结束演示</button>
  </div>
</div>
<script src="js/common.js"></script>
<script src="js/data.js"></script>
<script src="js/sos.js"></script>
</body>
</html>
