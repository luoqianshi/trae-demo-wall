<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>救邻 - 首页</title>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/home.css">
</head>
<body>
<div id="app">
  <div class="home-header">
    <div class="home-greeting">下午好，守护者</div>
    <h1 class="home-title">黄金 4 分钟<br>每一秒都重要</h1>
    <div class="home-stats">
      <div class="home-stat">
        <div class="home-stat-num">1,247</div>
        <div class="home-stat-label">附近志愿者</div>
      </div>
      <div class="home-stat">
        <div class="home-stat-num">386</div>
        <div class="home-stat-label">可用 AED</div>
      </div>
      <div class="home-stat">
        <div class="home-stat-num">4.2</div>
        <div class="home-stat-label">平均响应(分)</div>
      </div>
    </div>
  </div>

  <div class="sos-section">
    <a href="sos.html" class="sos-btn">
      <div class="sos-btn-text">SOS</div>
      <div class="sos-btn-sub">3 秒呼救</div>
    </a>
    <p class="sos-warning">紧急情况下请同时拨打 120。本平台为信息匹配工具，不替代专业急救医疗服务。</p>
  </div>

  <div class="quick-actions">
    <a href="aed.html" class="quick-card">
      <div class="quick-icon" style="background: var(--green-light);">📍</div>
      <h3>附近 AED</h3>
      <p>查找周边可用除颤设备</p>
    </a>
    <a href="ai-guide.html" class="quick-card">
      <div class="quick-icon" style="background: var(--purple-light);">🤖</div>
      <h3>AI 急救指引</h3>
      <p>输入症状获取急救步骤</p>
    </a>
    <a href="volunteer.html" class="quick-card">
      <div class="quick-icon" style="background: var(--blue-light);">👨‍⚕️</div>
      <h3>志愿者入口</h3>
      <p>持证人员接单施救</p>
    </a>
    <a href="profile.html" class="quick-card">
      <div class="quick-icon" style="background: var(--orange-light);">⚖️</div>
      <h3>法律保障</h3>
      <p>好人法与保险说明</p>
    </a>
  </div>
</div>
<script src="js/common.js"></script>
<script src="js/home.js"></script>
</body>
</html>
