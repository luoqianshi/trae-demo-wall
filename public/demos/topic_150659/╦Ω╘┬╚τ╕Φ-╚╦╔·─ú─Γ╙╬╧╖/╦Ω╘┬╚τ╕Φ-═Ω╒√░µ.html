<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>岁月如歌 - 人生模拟游戏</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');

        :root {
            --color-bg: #1a1410;
            --color-bg-warm: #2a1f16;
            --color-paper: #faf6f0;
            --color-paper-dark: #f3ede4;
            --color-ink: #3c2a1a;
            --color-ink-light: #6b5344;
            --color-ink-muted: #9a8677;
            --color-accent: #c4956a;
            --color-accent-light: #d4a87c;
            --color-accent-dark: #a67849;
            --color-red: #c0392b;
            --color-red-light: #e74c3c;
            --color-gold: #d4a843;
            --color-gold-light: #f0c95e;
            --color-green: #5a7a5a;
            --color-teal: #4a8b7f;
            --color-shadow: rgba(58, 40, 26, 0.15);
            --color-shadow-heavy: rgba(58, 40, 26, 0.25);
            --font-serif: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
            --font-sans: 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font-sans);
            background: var(--color-bg);
            min-height: 100vh;
            padding: 24px 16px;
            overflow-x: hidden;
            position: relative;
            color: var(--color-ink);
        }

        /* Background texture */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(196, 149, 106, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(212, 168, 67, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(139, 90, 43, 0.06) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .stars-bg { display: none; }

        /* Container - book/diary style */
        .container {
            max-width: 880px;
            margin: 0 auto;
            background: var(--color-paper);
            border-radius: var(--radius-lg);
            box-shadow:
                0 4px 6px var(--color-shadow),
                0 20px 50px var(--color-shadow-heavy),
                inset 0 1px 0 rgba(255,255,255,0.6);
            overflow: hidden;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(196, 149, 106, 0.2);
        }

        /* Book spine effect */
        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 6px; height: 100%;
            background: linear-gradient(180deg, var(--color-accent-dark), var(--color-accent), var(--color-accent-dark));
            z-index: 2;
            border-radius: var(--radius-lg) 0 0 var(--radius-lg);
        }

        /* Paper texture overlay */
        .container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.02'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
        }

        /* Header - vintage style */
        .header {
            background: linear-gradient(135deg, #5a3e28 0%, #7a5a3e 40%, #6b4c33 100%);
            color: #f5e6d3;
            padding: 48px 40px 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(ellipse at center, rgba(212, 168, 67, 0.1) 0%, transparent 60%);
            animation: headerGlow 10s ease-in-out infinite;
        }

        @keyframes headerGlow {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        /* Decorative borders */
        .header::after {
            content: '';
            position: absolute;
            bottom: 0; left: 20px; right: 20px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--color-gold), transparent);
        }

        .header h1 {
            font-family: var(--font-serif);
            font-size: 34px;
            font-weight: 700;
            letter-spacing: 6px;
            color: #f5e6d3;
            margin-bottom: 8px;
            position: relative;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .header .subtitle {
            font-family: var(--font-serif);
            font-size: 14px;
            letter-spacing: 4px;
            opacity: 0.7;
            font-weight: 400;
        }

        .header p {
            opacity: 0.65;
            font-size: 14px;
            margin-top: 6px;
            letter-spacing: 1px;
        }

        /* Content area */
        .content {
            padding: 40px 48px 48px;
            position: relative;
            z-index: 2;
        }

        /* Section transitions */
        .section {
            opacity: 0;
            transform: translateY(16px);
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            position: absolute;
            width: calc(100% - 96px);
        }

        .section.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
            position: static;
        }

        /* Buttons - vintage ink style */
        .btn {
            background: linear-gradient(135deg, var(--color-accent) 0%, var(--color-accent-dark) 100%);
            color: #fff;
            border: none;
            padding: 14px 44px;
            border-radius: 6px;
            font-size: 15px;
            font-family: var(--font-serif);
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
            position: relative;
            overflow: hidden;
            font-weight: 500;
            letter-spacing: 3px;
            box-shadow: 0 2px 8px var(--color-shadow);
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::after { left: 100%; }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--color-shadow-heavy);
            background: linear-gradient(135deg, var(--color-accent-light) 0%, var(--color-accent) 100%);
        }
        .btn:active { transform: translateY(0); box-shadow: 0 1px 4px var(--color-shadow); }

        .btn-secondary {
            background: linear-gradient(135deg, var(--color-green) 0%, #4a6a4a 100%);
        }
        .btn-secondary:hover {
            background: linear-gradient(135deg, #6a8a6a 0%, var(--color-green) 100%);
            box-shadow: 0 6px 20px rgba(90, 122, 90, 0.3);
        }

        .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
        .btn:disabled::after { display: none; }

        /* Intro section */
        .intro-section { text-align: center; }
        .intro-section h2 {
            font-family: var(--font-serif);
            font-size: 24px;
            color: var(--color-ink);
            margin-bottom: 24px;
            font-weight: 600;
            letter-spacing: 2px;
        }
        .intro-section p {
            font-size: 15px;
            color: var(--color-ink-light);
            line-height: 2;
            margin-bottom: 16px;
        }

        /* Decorative divider */
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 24px 0;
            gap: 12px;
            color: var(--color-accent);
            font-size: 12px;
            letter-spacing: 4px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            max-width: 120px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--color-accent), transparent);
        }

        /* Input */
        .input-group { margin: 24px 0; }
        .input-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            color: var(--color-ink-light);
            font-family: var(--font-serif);
            letter-spacing: 1px;
        }
        .input-group input {
            width: 100%;
            max-width: 320px;
            padding: 14px 20px;
            border: 1.5px solid rgba(196, 149, 106, 0.3);
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-family: var(--font-serif);
            color: var(--color-ink);
            background: rgba(255,255,255,0.6);
            transition: all 0.3s ease;
            text-align: center;
            letter-spacing: 2px;
        }
        .input-group input:focus {
            border-color: var(--color-accent);
            box-shadow: 0 0 0 3px rgba(196, 149, 106, 0.12);
            outline: none;
            background: rgba(255,255,255,0.9);
        }
        
        .input-group input[type="checkbox"] {
            width: auto;
            max-width: none;
            padding: 0;
            border: 1.5px solid var(--color-accent);
            border-radius: 4px;
            height: 18px;
            width: 18px;
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
            position: relative;
            background: var(--color-paper);
            transition: all 0.3s ease;
        }
        
        .input-group input[type="checkbox"]:checked {
            background: var(--color-accent);
            border-color: var(--color-accent-dark);
        }
        
        .input-group input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--color-paper);
            font-size: 12px;
            font-weight: bold;
        }
        
        .input-group input[type="checkbox"]:hover {
            border-color: var(--color-accent-light);
            box-shadow: 0 0 0 2px rgba(196, 149, 106, 0.2);
        }

        /* Progress */
        .question-progress {
            display: flex;
            align-items: center;
            margin-bottom: 28px;
            gap: 12px;
        }
        .progress-bar {
            flex: 1;
            height: 6px;
            background: rgba(196, 149, 106, 0.15);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--color-accent-dark), var(--color-accent));
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 3px;
            position: relative;
        }
        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0; right: 0; width: 20px; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4));
            border-radius: 3px;
        }

        /* Question */
        .question-text {
            font-family: var(--font-serif);
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 28px;
            color: var(--color-ink);
            line-height: 1.7;
            text-align: center;
            letter-spacing: 1px;
        }

        /* Options */
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option {
            padding: 18px 24px;
            border: 1.5px solid rgba(196, 149, 106, 0.2);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 15px;
            font-family: var(--font-sans);
            color: var(--color-ink);
            background: rgba(255,255,255,0.5);
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .option::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: transparent;
            transition: background 0.3s ease;
        }

        .option::after {
            content: '';
            position: absolute;
            top: 12px; left: 16px;
            width: 20px; height: 20px;
            border: 1.5px solid rgba(196, 149, 106, 0.3);
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .option { padding-left: 52px; }

        .option:hover {
            border-color: var(--color-accent);
            background: rgba(245, 230, 211, 0.4);
            transform: translateX(4px);
            box-shadow: 0 4px 16px var(--color-shadow);
        }
        .option:hover::before { background: var(--color-accent); }
        .option:hover::after {
            border-color: var(--color-accent);
            background: rgba(196, 149, 106, 0.15);
        }

        .option.selected {
            border-color: var(--color-accent);
            background: rgba(245, 230, 211, 0.5);
            animation: optionSelect 0.4s ease;
        }
        .option.selected::after {
            border-color: var(--color-accent);
            background: var(--color-accent);
        }
        .option.selected::before { background: var(--color-accent); }

        @keyframes optionSelect {
            0% { transform: scale(0.98); }
            50% { transform: scale(1.01); }
            100% { transform: scale(1); }
        }

        /* Role info panel */
        .role-info {
            background: var(--color-paper-dark);
            padding: 28px;
            border-radius: var(--radius-md);
            margin-bottom: 24px;
            transition: all 0.3s ease;
            border: 1px solid rgba(196, 149, 106, 0.15);
        }
        .role-info:hover { box-shadow: 0 6px 20px var(--color-shadow); }
        .role-info h3 {
            font-family: var(--font-serif);
            font-size: 17px;
            color: var(--color-ink);
            margin-bottom: 16px;
            letter-spacing: 1px;
        }

        /* Archetype cards */
        .archetype-display {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            gap: 16px;
        }
        .archetype-item {
            text-align: center;
            padding: 24px 16px;
            background: rgba(255,255,255,0.6);
            border-radius: var(--radius-md);
            min-width: 150px;
            transition: all 0.3s ease;
            border: 1px solid rgba(196, 149, 106, 0.15);
            position: relative;
        }
        .archetype-item:first-child {
            border-color: var(--color-accent);
            background: rgba(245, 230, 211, 0.3);
        }
        .archetype-item:first-child::before {
            content: 'BEST';
            position: absolute;
            top: -1px; left: 50%; transform: translateX(-50%);
            background: var(--color-accent);
            color: #fff;
            font-size: 10px;
            letter-spacing: 2px;
            padding: 2px 12px;
            border-radius: 0 0 6px 6px;
            font-weight: 600;
        }
        .archetype-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px var(--color-shadow);
            border-color: var(--color-accent);
        }
        .archetype-item .name {
            font-family: var(--font-serif);
            font-size: 18px;
            font-weight: 700;
            color: var(--color-accent-dark);
        }
        .archetype-item .match {
            font-size: 13px;
            color: var(--color-ink-muted);
            margin-top: 6px;
        }
        .archetype-item .desc {
            font-size: 12px;
            color: var(--color-ink-muted);
            margin-top: 8px;
            line-height: 1.5;
        }
        .archetype-item .explanation {
            font-size: 13px;
            color: var(--color-ink-light);
            margin-top: 12px;
            line-height: 1.6;
            text-align: left;
            padding: 12px;
            background: rgba(245, 230, 211, 0.4);
            border-radius: var(--radius-sm);
            border-left: 3px solid var(--color-accent);
        }
        .archetype-item .strengths,
        .archetype-item .challenges,
        .archetype-item .famous {
            font-size: 12px;
            margin-top: 8px;
            text-align: left;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            line-height: 1.5;
        }
        .archetype-item .strengths {
            color: var(--color-green);
            background: rgba(90, 122, 90, 0.1);
        }
        .archetype-item .challenges {
            color: var(--color-red);
            background: rgba(192, 57, 43, 0.1);
        }
        .archetype-item .famous {
            color: var(--color-teal);
            background: rgba(74, 139, 127, 0.1);
        }

        /* Stats panel */
        .stats-panel {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }
        .radar-chart-container {
            width: 100%;
            max-width: 380px;
            height: 340px;
        }
        .radar-chart-container canvas { width: 100% !important; height: 100% !important; }

        /* Year display */
        .year-display { text-align: center; margin-bottom: 24px; }
        .year-display .year {
            font-family: var(--font-serif);
            font-size: 44px;
            font-weight: 700;
            color: var(--color-accent-dark);
            letter-spacing: 4px;
        }
        .year-display .age {
            font-family: var(--font-serif);
            font-size: 15px;
            color: var(--color-ink-muted);
            margin-top: 6px;
            letter-spacing: 1px;
        }

        /* Event card */
        .event-card {
            background: rgba(255, 251, 235, 0.6);
            border-left: 4px solid var(--color-gold);
            padding: 24px;
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            border-top: 1px solid rgba(212, 168, 67, 0.2);
            border-bottom: 1px solid rgba(212, 168, 67, 0.2);
            border-right: 1px solid rgba(212, 168, 67, 0.2);
        }
        .event-card:hover {
            transform: translateX(4px);
            box-shadow: 0 6px 20px var(--color-shadow);
        }
        .event-card h4 {
            font-family: var(--font-serif);
            font-size: 17px;
            color: var(--color-ink);
            margin-bottom: 10px;
            font-weight: 600;
        }
        .event-card p {
            font-size: 14px;
            color: var(--color-ink-light);
            line-height: 1.7;
        }

        /* Event type badges */
        .event-type {
            display: inline-flex;
            align-items: center;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 14px;
            font-weight: 500;
            letter-spacing: 1px;
        }
        .event-type.age { background: #e8ddd0; color: #7a5a3e; }
        .event-type.history { background: #f0e6d0; color: #8a6a2e; }
        .event-type.childhood { background: #e0e8d8; color: #5a6a3e; }
        .event-type.special { background: #e8d8e0; color: #7a4a6a; }
        .event-type.random { background: #f0e6d0; color: #8a5a2e; }
        .event-type.annual { background: #d8e0e8; color: #4a5a7a; }
        .event-type.branch { background: #e8d0d0; color: #8a4a4a; }

        .event-type::before { margin-right: 6px; font-size: 13px; }
        .event-type.age::before { content: '\2B50'; }
        .event-type.history::before { content: '\1F4C5'; }
        .event-type.childhood::before { content: '\1F468'; }
        .event-type.special::before { content: '\1F3AF'; }
        .event-type.random::before { content: '\1F3B2'; }
        .event-type.annual::before { content: '\1F4C8'; }
        .event-type.branch::before { content: '\1F504'; }
        
        .branch-event {
            border-left-color: var(--color-red);
            background: rgba(248, 235, 235, 0.6);
            border-top-color: rgba(192, 57, 43, 0.2);
            border-bottom-color: rgba(192, 57, 43, 0.2);
            border-right-color: rgba(192, 57, 43, 0.2);
        }
        
        .branch-source {
            font-size: 12px;
            color: var(--color-red);
            margin-bottom: 8px;
            font-style: italic;
        }

        /* Year summary */
        .year-summary {
            background: rgba(232, 221, 208, 0.5);
            padding: 24px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            border: 1px solid rgba(196, 149, 106, 0.15);
        }
        .year-summary h4 {
            font-family: var(--font-serif);
            color: var(--color-accent-dark);
            margin-bottom: 10px;
        }
        .year-summary p { color: var(--color-ink-light); line-height: 1.7; }

        /* Final stats */
        .final-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }
        .final-stat {
            background: var(--color-paper-dark);
            padding: 22px 16px;
            border-radius: var(--radius-md);
            text-align: center;
            transition: all 0.3s ease;
            border: 1px solid rgba(196, 149, 106, 0.12);
        }
        .final-stat:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--color-shadow);
        }
        .final-stat .label {
            font-family: var(--font-serif);
            font-size: 13px;
            color: var(--color-ink-muted);
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .final-stat .value {
            font-family: var(--font-serif);
            font-size: 34px;
            font-weight: 700;
            color: var(--color-accent-dark);
        }

        /* Biography */
        .biography {
            background: var(--color-paper-dark);
            padding: 32px;
            border-radius: var(--radius-md);
            margin-bottom: 24px;
            border: 1px solid rgba(196, 149, 106, 0.15);
        }
        .biography h3 {
            font-family: var(--font-serif);
            font-size: 18px;
            color: var(--color-ink);
            margin-bottom: 16px;
        }
        .biography p {
            font-size: 15px;
            color: var(--color-ink-light);
            line-height: 2;
            text-align: justify;
        }

        /* Chart */
        .chart-container { width: 100%; height: 400px; margin-bottom: 32px; }

        /* Five year summary */
        .five-year-summary {
            background: linear-gradient(135deg, rgba(224, 232, 216, 0.6), rgba(216, 224, 232, 0.6));
            padding: 28px;
            border-radius: var(--radius-md);
            margin-bottom: 24px;
            border: 1px solid rgba(196, 149, 106, 0.15);
        }
        .five-year-summary h3 {
            font-family: var(--font-serif);
            color: var(--color-green);
            margin-bottom: 16px;
            letter-spacing: 1px;
        }
        .five-year-summary p { color: var(--color-ink-light); line-height: 2; }

        /* Skip button */
        .skip-btn {
            background: rgba(232, 221, 208, 0.6) !important;

    <div class="container">

        <div class="content">
            <div id="intro" class="section active">

                    <div class="divider">- - -</div>
                    <p>这是一款互动小说式的人生模拟游戏。</p>
                    <p>你将回到1990年，在四十年的时光洪流中，<br>通过一次次选择，塑造属于自己的人生轨迹。</p>

                    </div>
                    <button class="btn" onclick="startGame()">开始游戏</button>
                </div>
            </div>

            <div id="test-section" class="section">
                <h2 style="text-align:center; color:var(--color-ink); margin-bottom:20px; font-family:var(--font-serif); letter-spacing:2px;">性格测试</h2>
                <div class="question-progress">
                    <button class="btn btn-secondary" style="padding:5px 15px; font-size:14px;" onclick="prevQuestion()" id="prev-btn" disabled>上一题</button>
                    <span id="current-question">1</span>
                    <div class="progress-bar">
                        <div id="progress-fill" class="progress-fill"></div>
                    </div>
                    <span id="total-questions">18</span>
                </div>
                <div id="question-text" class="question-text"></div>
                <div id="options" class="options"></div>
            </div>

            <div id="role-section" class="section">
                <div class="role-info">
                    <h3>你的性格原型</h3>
                    <div class="archetype-display" id="archetype-display"></div>
                </div>
                <div class="role-info">
                    <h3>初始属性</h3>
                    <div class="stats-panel" id="stats-panel">
                        <div class="radar-chart-container">
                            <canvas id="stats-radar-chart"></canvas>
                        </div>
                    </div>
                </div>
                <div style="text-align:center;">
                    <button class="btn" onclick="startLifeJourney()">开始人生旅程</button>
                </div>
            </div>

            <div id="journey-section" class="section">
                <div class="year-display">
                    <div class="year" id="current-year">1990年</div>
                    <div class="age" id="current-age">你0岁了</div>
                </div>
                <div class="event-counter">本年已回答 <span id="answered-count">0</span> 题</div>
                <div class="role-info">
                    <h3>当前属性</h3>
                    <div class="stats-panel" id="journey-stats">
                        <div class="radar-chart-container">
                            <canvas id="journey-radar-chart"></canvas>
                        </div>
                    </div>
                </div>
                <div id="event-container"></div>
                <div style="text-align:center; margin-top:20px;">
                    <button id="continue-btn" class="btn" onclick="showNextEvent()" style="display:none;">继续</button>
                </div>
            </div>

            <div id="five-year-summary-section" class="section">
                <div class="year-display">
                    <div class="year" id="summary-year-range"></div>
                    <div class="age" id="summary-age"></div>
                </div>
                <div class="five-year-summary" id="summary-content"></div>
                <div style="text-align:center;">
                    <button class="btn" onclick="continueJourney()">继续人生旅程</button>
                </div>
            </div>

            <div id="result-section" class="section">

                    <div class="year" id="final-year">2025年</div>
                </div>
                <div class="chart-container">

                </div>

                </div>
                <div style="text-align:center;">
                    <button class="btn" onclick="restartGame()">重新开始</button>
                </div>
            </div>
        </div>

const traitsList = ['warrior', 'hero', 'ruler', 'lover', 'martyr', 'sage', 'creator', 'magician', 'innocent', 'orphan', 'wanderer', 'jester'];

function randomTraits() {
    const result = [];
    while (result.length < 2) {
        const t = traitsList[Math.floor(Math.random() * traitsList.length)];
        if (!result.includes(t)) result.push(t);
    }
    return result;
}

function randomEffects() {
    const effects = {};
    const keys = ['wealth', 'health', 'relation', 'career', 'happiness', 'growth'];
    const count = Math.floor(Math.random() * 3) + 1;
    const used = new Set();
    for (let i = 0; i < count; i++) {
        let key;
        do { key = keys[Math.floor(Math.random() * keys.length)]; } while (used.has(key));
        used.add(key);
        const sign = Math.random() > 0.4 ? 1 : -1;
        effects[key] = sign * (Math.floor(Math.random() * 10) + 3);
    }
    return effects;
}

        id: `${type}_${idx + 1}`,
        name: evt.name,
        description: tpl.prefix + descs[idx % descs.length],
        options: tpl.options.map(text => ({
            text, traits: randomTraits(), effects: randomEffects()

        chain: `${type}_result`,
        minAge: evt.minAge,
        maxAge: evt.maxAge,
        requiresJob: evt.requiresJob,
        requiresCollege: evt.requiresCollege,
        requiresHighSchool: evt.requiresHighSchool,
        requiresMarried: evt.requiresMarried,
        requiresChildren: evt.requiresChildren,

        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
        }

        function startGame() {
            const birthYear = parseInt(document.getElementById('birth-year').value);
            const errorDiv = document.getElementById('birth-year-error');
            
            if (isNaN(birthYear) || birthYear < 1980 || birthYear > 2010) {
                errorDiv.textContent = '请输入有效的出生年份（1980-2010）';
                return;
            }
            
            errorDiv.textContent = '';
            GameState.birthYear = birthYear;
            
            if (birthYear <= 1990) {
                GameState.currentYear = 1990;
                GameState.currentAge = 1990 - birthYear;
            } else {
                GameState.currentYear = birthYear;
                GameState.currentAge = 0;
            }
            
            showSection('test-section');
            showQuestion();
        }

        function showQuestion() {
            const question = questionsData[GameState.currentQuestion];
            document.getElementById('question-text').textContent = question.text;
            document.getElementById('current-question').textContent = GameState.currentQuestion + 1;
            document.getElementById('total-questions').textContent = questionsData.length;
            document.getElementById('progress-fill').style.width = `${((GameState.currentQuestion + 1) / questionsData.length) * 100}%`;
            
            document.getElementById('prev-btn').disabled = GameState.currentQuestion === 0;
            
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            
            question.options.forEach((option, index) => {
                const optionEl = document.createElement('button');
                optionEl.className = 'option';
                optionEl.textContent = option.text;
                optionEl.onclick = () => selectOption(option, index);
                optionsDiv.appendChild(optionEl);
            });
        }

        function selectOption(option, index) {
            updateDimensionScores(option.scores);
            GameState.questionAnswers.push({ questionId: questionsData[GameState.currentQuestion].id, optionIndex: index, scores: option.scores });
            
            GameState.currentQuestion++;
            
            if (GameState.currentQuestion >= questionsData.length) {
                calculateArchetypes();
                showSection('role-section');
                displayArchetypes();
                displayStats('stats-panel');
            } else {
                showQuestion();
            }
        }

        function prevQuestion() {
            if (GameState.currentQuestion > 0) {
                GameState.currentQuestion--;
                const lastAnswer = GameState.questionAnswers.pop();
                if (lastAnswer) {
                    const scores = lastAnswer.scores;
                    Object.keys(scores).forEach(key => {
                        const dim = key === 'E' || key === 'I' ? 'EI' :
                                   key === 'S' || key === 'N' ? 'SN' :
                                   key === 'T' || key === 'F' ? 'TF' :
                                   key === 'J' || key === 'P' ? 'JP' :
                                   key === 'A' || key === 'C' ? 'AC' : 'IE';
                        if (key === 'E' || key === 'S' || key === 'T' || key === 'J' || key === 'A' || key === 'I') {
                            GameState.dimensionScores[dim] -= scores[key];
                        } else {
                            GameState.dimensionScores[dim] -= (3 - scores[key]);
                        }
                    });
                }
                showQuestion();
            }
        }

        function updateDimensionScores(scores) {
            Object.keys(scores).forEach(key => {
                const dim = key === 'E' || key === 'I' ? 'EI' :
                           key === 'S' || key === 'N' ? 'SN' :
                           key === 'T' || key === 'F' ? 'TF' :
                           key === 'J' || key === 'P' ? 'JP' :
                           key === 'A' || key === 'C' ? 'AC' : 'IE';
                if (key === 'E' || key === 'S' || key === 'T' || key === 'J' || key === 'A' || key === 'I') {
                    GameState.dimensionScores[dim] += scores[key];
                } else {
                    GameState.dimensionScores[dim] += (3 - scores[key]);
                }
            });
        }

        function calculateArchetypes() {
            const results = [];
            let totalScore = 0;
            
            Object.keys(archetypesData).forEach(key => {
                const archetype = archetypesData[key];
                let score = 0;
                
                score += calculateDimensionMatch('EI', archetype.dimensionScores['E']);
                score += calculateDimensionMatch('SN', archetype.dimensionScores['S']);
                score += calculateDimensionMatch('TF', archetype.dimensionScores['T']);
                score += calculateDimensionMatch('JP', archetype.dimensionScores['J']);
                score += calculateDimensionMatch('AC', archetype.dimensionScores['A']);
                score += calculateDimensionMatch('IE', archetype.dimensionScores['I']);
                
                results.push({ key, ...archetype, score });
                totalScore += score;
            });
            
            results.forEach(result => {
                result.percentage = totalScore > 0 ? Math.round((result.score / totalScore) * 100) : 0;
            });
            
            results.sort((a, b) => b.percentage - a.percentage);
            
            const top3 = results.slice(0, 3);
            const remainingPercent = 100 - top3.reduce((sum, r) => sum + r.percentage, 0);
            
            if (remainingPercent > 0 && top3.length > 0) {
                top3[0].percentage += remainingPercent;
            }
            
            GameState.archetypes = top3;
        }
        
        function calculateDimensionMatch(dimension, archetypeValue) {
            const maxScore = 18;
            const playerScore = GameState.dimensionScores[dimension];
            const archetypeScore = archetypeValue * 3;
            
            const diff = Math.abs(playerScore - archetypeScore);
            const maxDiff = maxScore;
            
            const matchRatio = 1 - (diff / maxDiff);
            return Math.max(0, matchRatio * 100);
        }

        function displayArchetypes() {
            const container = document.getElementById('archetype-display');
            container.innerHTML = '';
            GameState.archetypes.forEach((arch, index) => {
                const div = document.createElement('div');
                div.className = 'archetype-item';
                const rankLabels = ['第一位', '第二位', '第三位'];
                const strengthsHtml = arch.strengths ? `<div class="strengths"><strong>核心优势：</strong>${arch.strengths.join('、')}</div>` : '';
                const challengesHtml = arch.challenges ? `<div class="challenges"><strong>成长挑战：</strong>${arch.challenges.join('、')}</div>` : '';
                const famousHtml = arch.famousFigures ? `<div class="famous"><strong>代表人物：</strong>${arch.famousFigures.join('、')}</div>` : '';
                div.innerHTML = `
                    <div class="name">${rankLabels[index]}：${arch.name}</div>
                    <div class="match">占比: ${arch.percentage}%</div>
                    <div class="desc">${arch.description}</div>
                    <div class="explanation">${arch.explanation || ''}</div>
                    ${strengthsHtml}
                    ${challengesHtml}
                    ${famousHtml}
                `;
                container.appendChild(div);
            });
        }

        function refreshJourneyDisplay() {
            document.getElementById('current-year').textContent = `${GameState.currentYear}年`;
            document.getElementById('current-age').textContent = GameState.currentAge <= 6 ? `童年时期（0-6岁）` : `你${GameState.currentAge}岁了`;

        function loadChildhoodEvents() {
            const availableEvents = GameEventsData.childhoodEvents.filter(e => {
                const lastUsed = GameState.eventLastUsedYear[e.id] || 0;
                return GameState.currentYear - lastUsed >= 3;
            });
            GameState.currentYearEvents = availableEvents.map(e => ({ ...e, type: 'childhood' }));
            availableEvents.forEach(e => {
                GameState.eventLastUsedYear[e.id] = GameState.currentYear;
            });
            GameState.currentEventIndex = 0;
            GameState.yearEventsAnswered = 0;
            showNextEvent();
        }

        function loadYearEvents() {
            const year = GameState.currentYear.toString();
            const age = GameState.currentAge;
            const status = GameState.lifeStatus;
            
            const candidateEvents = [];
            const cooldowns = {
                history: 0,
                special: 0,
                annual: 3,
                random: 5
            };
            
            function isEventAvailable(event) {
                if (event.minAge !== undefined && age < event.minAge) return false;
                if (event.maxAge !== undefined && age > event.maxAge) return false;
                if (event.requiresJob && !status.hasJob) return false;
                if (event.requiresCollege && !status.hasCollege) return false;
                if (event.requiresHighSchool && !status.hasHighSchool) return false;
                if (event.requiresMarried && !status.hasMarried) return false;
                if (event.requiresChildren && !status.hasChildren) return false;
                if (event.requiresBusiness && !status.hasBusiness) return false;
                return true;
            }
            
            if (GameEventsData.historicalEvents[year]) {
                GameEventsData.historicalEvents[year].forEach(e => {
                    if (isEventAvailable(e)) {
                        candidateEvents.push({ ...e, type: 'history', probability: getEventProbability(e, age) });
                    }
                });
            }
            
            if (GameEventsData.specialEvents[age]) {
                const specialEvent = GameEventsData.specialEvents[age];
                const lastUsed = GameState.eventLastUsedYear[specialEvent.id] || 0;
                if (GameState.currentYear - lastUsed >= cooldowns.special && isEventAvailable(specialEvent)) {
                    candidateEvents.push({ ...specialEvent, type: 'special', probability: 0.95 });
                }
            }
            
            GameEventsData.annualGrowthEvents.forEach(e => {
                const lastUsed = GameState.eventLastUsedYear[e.id] || 0;
                if (GameState.currentYear - lastUsed >= cooldowns.annual && isEventAvailable(e)) {
                    candidateEvents.push({ ...e, type: 'annual', probability: getEventProbability(e, age) });
                }
            });
            
            const allRandomEvents = [];
            Object.values(GameEventsData.randomEventTypes).forEach(typeEvents => {
                typeEvents.forEach(e => {
                    const lastUsed = GameState.eventLastUsedYear[e.id] || 0;
                    if (GameState.currentYear - lastUsed >= cooldowns.random && isEventAvailable(e)) {
                        allRandomEvents.push({ ...e, type: 'random', probability: getEventProbability(e, age) });
                    }
                });
            });
            
            candidateEvents.push(...allRandomEvents);
            
            const highProbEvents = candidateEvents.filter(e => e.probability >= 0.3);
            const lowProbEvents = candidateEvents.filter(e => e.probability > 0 && e.probability < 0.3);
            
            const selectedEvents = [];
            
            if (highProbEvents.length > 0) {
                const shuffledHigh = highProbEvents.sort(() => Math.random() - 0.5);
                selectedEvents.push(...shuffledHigh.slice(0, 4));
            }
            
            if (lowProbEvents.length > 0 && Math.random() < 0.3) {
                const shuffledLow = lowProbEvents.sort(() => Math.random() - 0.5);
                selectedEvents.push(shuffledLow[0]);
            }
            
            while (selectedEvents.length < 5 && candidateEvents.length > 0) {
                const remaining = candidateEvents.filter(e => !selectedEvents.includes(e));
                if (remaining.length > 0) {
                    selectedEvents.push(remaining[Math.floor(Math.random() * remaining.length)]);
                } else {
                    break;
                }
            }
            
            selectedEvents.forEach(e => {
                GameState.eventLastUsedYear[e.id] = GameState.currentYear;
            });
            
            GameState.currentYearEvents = selectedEvents;
            GameState.currentEventIndex = 0;
            GameState.yearEventsAnswered = 0;
            
            showNextEvent();
        }
        
        function getEventProbability(event, age) {
            if (event.type === 'special') return 0.95;
            
            const status = GameState.lifeStatus;
            
            if (event.type === 'annual') {
                if (event.minAge !== undefined && age < event.minAge) return 0.05;
                
                if (event.requiresJob && !status.hasJob) return 0.02;
                if (event.requiresCollege && !status.hasCollege) return 0.02;
                if (event.requiresHighSchool && !status.hasHighSchool) return 0.02;
                if (event.requiresMarried && !status.hasMarried) return 0.02;
                if (event.requiresChildren && !status.hasChildren) return 0.02;
                if (event.requiresBusiness && !status.hasBusiness) return 0.02;
                
                if (event.requiresJob && status.hasJob) return 0.8;
                if (event.requiresCollege && status.hasCollege) return 0.8;
                
                return 0.7;
            }
            
            if (event.type === 'history') {
                const minAgeForHistory = 3;
                if (age < minAgeForHistory) return 0.05;
                if (age >= minAgeForHistory && age < 10) return 0.3;
                return 0.6;
            }
            
            if (event.type === 'random' && event.minAge !== undefined) {
                if (age < event.minAge) return 0.05;
                if (age > event.maxAge) return 0.05;
                
                if (event.requiresJob && !status.hasJob) return 0.02;
                if (event.requiresCollege && !status.hasCollege) return 0.02;
                if (event.requiresHighSchool && !status.hasHighSchool) return 0.02;
                if (event.requiresMarried && !status.hasMarried) return 0.02;
                if (event.requiresChildren && !status.hasChildren) return 0.02;
                if (event.requiresBusiness && !status.hasBusiness) return 0.02;
                
                if (age >= event.minAge && age <= event.maxAge) {
                    const midAge = (event.minAge + event.maxAge) / 2;
                    const distance = Math.abs(age - midAge) / (event.maxAge - event.minAge);
                    let baseProb = Math.max(0.1, 0.8 - distance * 0.6);
                    
                    if ((event.requiresJob && status.hasJob) ||
                        (event.requiresCollege && status.hasCollege)) {
                        baseProb = Math.min(0.9, baseProb * 1.2);
                    }
                    
                    return baseProb;
                }
            }
            
            return 0.5;
        }

        function getRandomEventType() {
            const types = Object.keys(GameEventsData.randomEventTypes);
            const randomType = types[Math.floor(Math.random() * types.length)];
            const eventsOfType = GameEventsData.randomEventTypes[randomType];
            return eventsOfType[Math.floor(Math.random() * eventsOfType.length)];
        }

        function showNextEvent() {
            const container = document.getElementById('event-container');
            const continueBtn = document.getElementById('continue-btn');
            
            if (GameState.chainReactions.length > 0) {
                const chain = GameState.chainReactions.shift();
                const branchEvents = GameEventsData.branchEvents[chain.type];
                if (branchEvents && branchEvents.length > 0) {
                    const status = GameState.lifeStatus;
                    const availableBranchEvents = branchEvents.filter(e => {
                        if (e.requiresJob && !status.hasJob) return false;
                        if (e.requiresCollege && !status.hasCollege) return false;
                        if (e.requiresHighSchool && !status.hasHighSchool) return false;
                        if (e.requiresMarried && !status.hasMarried) return false;
                        if (e.requiresChildren && !status.hasChildren) return false;
                        if (e.requiresBusiness && !status.hasBusiness) return false;
                        return true;
                    });
                    
                    if (availableBranchEvents.length > 0) {
                        const branchEvent = availableBranchEvents[Math.floor(Math.random() * availableBranchEvents.length)];
                        showBranchEvent(branchEvent, chain);
                        return;
                    }
                }
            }
            
            if (GameState.currentEventIndex >= GameState.currentYearEvents.length) {
                if (GameState.currentAge <= 6) {
                    container.innerHTML = '<p style="text-align:center; color:var(--color-ink-muted); font-family:var(--font-serif); letter-spacing:2px;">童年时期已结束，准备进入少年时代...</p>';
                    setTimeout(() => advanceToAge7(), 1500);
                    return;
                }
                container.innerHTML = `
                    <div style="text-align:center; padding:30px;">
                        <p style="color:var(--color-ink-muted); font-family:var(--font-serif); letter-spacing:2px; margin-bottom:20px;">今年的事件已全部完成</p>
                        <button class="btn" onclick="handleYearEnd()" style="margin-right:15px;">进入下一年</button>
                        <button class="btn btn-secondary" onclick="showResult()" style="background:var(--color-red); border-color:var(--color-red); color:#fff;">结束游戏</button>
                    </div>
                `;
                return;
            }
            
            const event = GameState.currentYearEvents[GameState.currentEventIndex];
            continueBtn.style.display = 'none';
            
            const typeLabel = event.type === 'age' ? '成长事件' : 
                             event.type === 'history' ? '历史事件' : 
                             event.type === 'special' ? '特殊事件' :
                             event.type === 'random' ? '随机事件' :

            container.innerHTML = `
                <div class="event-card">

                optionsDiv.appendChild(optionEl);

            const skipBtn = document.createElement('button');
            skipBtn.className = 'option skip-btn';
            skipBtn.textContent = '跳过此题';
            skipBtn.onclick = () => skipEvent();
            optionsDiv.appendChild(skipBtn);

        function selectBranchOption(event, option) {
            applyEffects(option.effects);

            GameState.lifeStory.push({
                year: GameState.currentYear,
                age: GameState.currentAge,
                event: event.name + '（分支）',
                choice: option.text,
                traits: option.traits
            });
            
            GameState.currentEventIndex++;
            refreshJourneyDisplay();
            showNextEvent();
        }

        function selectEventOption(event, option) {
            applyEffects(option.effects);
            updateLifeStatus(event, option);
            GameState.lifeStory.push({
                year: GameState.currentYear,
                age: GameState.currentAge,
                event: event.name,
                choice: option.text,
                traits: option.traits
            });
            
            if (event.chain) {
                GameState.chainReactions.push({
                    type: event.chain,
                    year: GameState.currentYear,
                    age: GameState.currentAge,
                    choice: option.text,
                    effects: option.effects
                });
            }
            
            GameState.yearEventsAnswered++;
            GameState.currentEventIndex++;
            refreshJourneyDisplay();
            showNextEvent();
        }

        function skipEvent() {
            GameState.skippedEvents.push({ year: GameState.currentYear, event: GameState.currentYearEvents[GameState.currentEventIndex].name });
            GameState.currentEventIndex++;
            showNextEvent();
        }

        function applyEffects(effects) {
            Object.keys(effects).forEach(key => {
                if (GameState.stats[key] !== undefined) {
                    const modifier = getTraitModifier();
                    GameState.stats[key] += effects[key] * modifier;
                    GameState.stats[key] = Math.max(0, Math.min(100, GameState.stats[key]));
                }
            });
        }
        
        function updateLifeStatus(event, option) {
            const status = GameState.lifeStatus;
            const eventName = event.name || '';
            const choiceText = option.text || '';
            const effects = option.effects || {};
            
            if (!status.hasJob && effects.career && effects.career > 0) {
                status.hasJob = true;
            }
            
            if (!status.hasCollege) {
                const collegeKeywords = ['大学', '考研', '读研', '本科', '高考', '录取', '入学'];
                if (collegeKeywords.some(k => eventName.includes(k) || choiceText.includes(k))) {
                    status.hasCollege = true;
                }
            }
            
            if (!status.hasHighSchool) {
                const hsKeywords = ['高中', '中考', '初中毕业', '升学', '重点高中', '职业高中'];
                if (hsKeywords.some(k => eventName.includes(k) || choiceText.includes(k))) {
                    status.hasHighSchool = true;
                }
            }
            
            if (!status.hasRelationship) {
                const relKeywords = ['恋爱', '表白', '暗恋', '约会', '恋人', '伴侣', '感情'];
                if (relKeywords.some(k => eventName.includes(k) || choiceText.includes(k))) {
                    status.hasRelationship = true;
                }
            }
            
            if (!status.hasMarried) {
                const marryKeywords = ['结婚', '婚姻', '婚礼', '裸婚', '新婚', '领证'];
                if (marryKeywords.some(k => eventName.includes(k) || choiceText.includes(k))) {
                    status.hasMarried = true;
                }
            }
            
            if (!status.hasChildren) {
                const childKeywords = ['孩子', '子女', '生育', '怀孕', '育儿', '宝宝', '孩子出生'];
                if (childKeywords.some(k => eventName.includes(k) || choiceText.includes(k))) {
                    status.hasChildren = true;
                }
            }
            
            if (!status.hasBusiness) {
                const businessKeywords = ['创业', '公司', '企业', '生意', '老板', '创业公司'];
                if (businessKeywords.some(k => eventName.includes(k) || choiceText.includes(k))) {
                    status.hasBusiness = true;
                }
            }
        }

        function getTraitModifier() {
            const primaryArchetype = GameState.archetypes[0]?.key || '';
            const modifiers = {
                'warrior': 1.2, 'hero': 1.2, 'ruler': 1.1,
                'lover': 1.1, 'martyr': 1.1, 'sage': 1.1,
                'creator': 1.1, 'magician': 1.1, 'innocent': 1.0,
                'orphan': 0.9, 'wanderer': 1.0, 'jester': 1.0
            };
            return modifiers[primaryArchetype] || 1.0;
        }

        
            
            

            

            
        function generateFiveYearSummary() {
            const startYear = GameState.currentYear - 4;
            const endYear = GameState.currentYear;
            
            document.getElementById('summary-year-range').textContent = `${startYear} - ${endYear}年`;
            document.getElementById('summary-age').textContent = `你现在${GameState.currentAge}岁`;
            
            const relevantHistory = GameState.history.filter(h => h.year >= startYear && h.year <= endYear);
            const relevantStory = GameState.lifeStory.filter(s => s.year >= startYear && s.year <= endYear);
            
            let summary = `在${startYear}至${endYear}这五年间，你的人生经历了许多变化。`;
            
            const statChanges = {};
            if (relevantHistory.length >= 2) {
                const first = relevantHistory[0].stats;
                const last = relevantHistory[relevantHistory.length - 1].stats;
                Object.keys(first).forEach(key => {
                    statChanges[key] = last[key] - first[key];
                });
            }
            
            const positiveChanges = Object.entries(statChanges).filter(([k, v]) => v > 5);
            const negativeChanges = Object.entries(statChanges).filter(([k, v]) => v < -5);
            
            const statNames = { wealth: '财富', health: '健康', relation: '人际关系', career: '事业', happiness: '幸福', growth: '成长' };
            
            if (positiveChanges.length > 0) {
                summary += ` 你的${positiveChanges.map(([k]) => statNames[k]).join('、')}有了显著提升。`;
            }
            
            if (negativeChanges.length > 0) {
                summary += ` ${negativeChanges.map(([k]) => statNames[k]).join('、')}有所下降。`;
            }
            
            if (relevantStory.length > 0) {
                const keyEvents = relevantStory.slice(-3);
                summary += ` 这五年中，你经历了${keyEvents.map(s => s.event).join('、')}等重要事件。`;
            }
            
            const archetype = GameState.archetypes[0];
            summary += ` 你的${archetype.name}特质(${archetype.description})在这些年中发挥了重要作用。`;
            
            document.getElementById('summary-content').innerHTML = `<h3>五年回顾</h3><p>${summary}</p>`;
            GameState.fiveYearSummaries.push({ startYear, endYear, summary });
        }

        function continueJourney() {
            advanceYear();
