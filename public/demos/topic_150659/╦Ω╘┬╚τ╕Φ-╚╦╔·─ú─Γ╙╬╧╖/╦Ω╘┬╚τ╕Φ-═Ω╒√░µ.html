        function advanceToAge7() {
            GameState.currentYear = GameState.birthYear + 7;
            GameState.currentAge = 7;
            GameState.yearEventsAnswered = 0;
            GameState.currentEventIndex = 0;
            GameState.currentYearEvents = [];
            
            showSection('journey-section');
            refreshJourneyDisplay();
            loadYearEvents();
        }

        function handleYearEnd() {
            saveYearHistory();
            if (GameState.currentYear % 5 === 0 && GameState.currentYear > 1990) {
                generateFiveYearSummary();
                showSection('five-year-summary-section');
            } else {
                advanceYear();
            }
        }
        
        function saveYearHistory() {
            GameState.history.push({
                year: GameState.currentYear,
                age: GameState.currentAge,
                stats: { ...GameState.stats }
            });
        }
        
        function advanceYear() {
            GameState.currentYear++;
            GameState.currentAge++;
            GameState.yearEventsAnswered = 0;
            GameState.currentEventIndex = 0;
            GameState.currentYearEvents = [];
            
            checkChainReactions();
            
            if (GameState.currentYear > 2025) {
                showResult();
            } else {
                showSection('journey-section');
                refreshJourneyDisplay();
                loadYearEvents();
            }
        }

        function checkChainReactions() {
            const reactionsToRemove = [];
            
            GameState.chainReactions.forEach((reaction, index) => {
                if (GameState.currentAge === reaction.age + 1) {
                    applyChainReaction(reaction);
                    reactionsToRemove.push(index);
                }
            });
            
            reactionsToRemove.reverse().forEach(index => {
                GameState.chainReactions.splice(index, 1);
            });
        }

        function applyChainReaction(reaction) {
            let bonusEffects = {};
            
            switch(reaction.type) {
                case 'gaokao_result':
                    if (reaction.effects.growth && reaction.effects.growth > 0) {
                        bonusEffects = { growth: 5, career: 5 };
                    } else {
                        bonusEffects = { happiness: -3 };
                    }
                    break;
                case 'career_start':
                    if (reaction.effects.career && reaction.effects.career > 0) {
                        bonusEffects = { career: 8, wealth: 5 };
                    }
                    break;
                case 'life_stage':
                    if (reaction.effects.relation && reaction.effects.relation > 0) {
                        bonusEffects = { relation: 5, happiness: 5 };
                    }
                    break;
                case 'karma_result':
                    if (reaction.effects.relation && reaction.effects.relation > 0) {
                        bonusEffects = { happiness: 5, wealth: 5 };
                    }
                    break;
                case 'investment_result':
                    if (reaction.effects.wealth && reaction.effects.wealth > 0) {
                        bonusEffects = { wealth: 10 };
                    } else if (reaction.effects.wealth && reaction.effects.wealth < 0) {
                        bonusEffects = { happiness: -5 };
                    }
                    break;
                case 'mentor_result':
                    if (reaction.effects.career && reaction.effects.career > 0) {
                        bonusEffects = { career: 10, growth: 5 };
                    }
                    break;
                case 'recovery_result':
                    if (reaction.effects.career && reaction.effects.career > 0) {
                        bonusEffects = { health: 5, happiness: 5 };
                    }
                    break;
                case 'health_result':
                    if (reaction.effects.health && reaction.effects.health > 0) {
                        bonusEffects = { health: 5, happiness: 3 };
                    }
                    break;
                case 'friendship_result':
                    if (reaction.effects.relation && reaction.effects.relation > 0) {
                        bonusEffects = { relation: 5 };
                    }
                    break;
                case 'trust_result':
                    if (reaction.effects.relation && reaction.effects.relation > 0) {
                        bonusEffects = { relation: 8 };
                    }
                    break;
                case 'love_result':
                    if (reaction.effects.happiness && reaction.effects.happiness > 0) {
                        bonusEffects = { happiness: 5, relation: 5 };
                    }
                    break;
                case 'family_result':
                    if (reaction.effects.relation && reaction.effects.relation > 0) {
                        bonusEffects = { relation: 10, happiness: 5 };
                    }
                    break;
                case 'wellness_result':
                    if (reaction.effects.health && reaction.effects.health > 0) {
                        bonusEffects = { health: 8, happiness: 3 };
                    }
                    break;
                case 'fitness_result':
                    if (reaction.effects.health && reaction.effects.health > 0) {
                        bonusEffects = { health: 10, happiness: 5 };
                    }
                    break;
                case 'diet_result':
                    if (reaction.effects.health && reaction.effects.health > 0) {
                        bonusEffects = { health: 6, happiness: 2 };
                    }
                    break;
                case 'promotion_result':
                    if (reaction.effects.career && reaction.effects.career > 0) {
                        bonusEffects = { career: 10, wealth: 8 };
                    }
                    break;
                case 'career_change_result':
                    if (reaction.effects.career && reaction.effects.career > 0) {
                        bonusEffects = { career: 12, growth: 5 };
                    }
                    break;
                case 'startup_result':
                    if (reaction.effects.career && reaction.effects.career > 0) {
                        bonusEffects = { career: 8, wealth: 5 };
                    }
                    break;
            }
            
            if (Object.keys(bonusEffects).length > 0) {
                applyEffects(bonusEffects);
                GameState.lifeStory.push({
                    year: GameState.currentYear,
                    age: GameState.currentAge,
                    event: '连锁反应',
                    choice: reaction.choice + '的后续影响',
                    traits: []
                });
            }
        }

        function showResult() {
            showSection('result-section');
            document.getElementById('final-year').textContent = '2025年';
            drawLifeChart();
            displayFinalStats();
            generateBiography();
        }

        function drawLifeChart() {
            const ctx = document.getElementById('life-chart').getContext('2d');
            
            // 确保有历史数据
            if (GameState.history.length === 0) {
                // 如果没有历史数据，创建模拟数据
                const startYear = Math.min(GameState.birthYear, 1990);
                for (let year = startYear; year <= 2025; year++) {
                    GameState.history.push({
                        year: year,
                        age: year - GameState.birthYear,
                        stats: { ...GameState.stats }
                    });
                }
            }
            
            const labels = GameState.history.map(h => `${h.year}年(${h.age}岁)`);
            const statNames = { wealth: '财富', health: '健康', relation: '人际关系', career: '事业', happiness: '幸福', growth: '成长' };
            const colors = {
                wealth: '#c0392b',
                health: '#4a8b7f',
                relation: '#d4a843',
                career: '#5a7a5a',
                happiness: '#9b59b6',
                growth: '#c4956a'
            };
            
            const datasets = Object.keys(statNames).map(key => ({
                label: statNames[key],
                data: GameState.history.map(h => Math.round(Math.max(0, Math.min(100, h.stats[key])))),
                borderColor: colors[key],
                backgroundColor: colors[key] + '33',
                borderWidth: 2.5,
                tension: 0.4,
                fill: false,
                pointRadius: 3,
                pointHoverRadius: 6,
                pointBackgroundColor: colors[key],
                pointBorderColor: '#fff',
                pointBorderWidth: 1
            }));
            
            // 计算平均幸福曲线
            const avgHappiness = GameState.history.map(h => {
                const stats = h.stats;
                return Math.round((stats.wealth + stats.health + stats.relation + stats.career + stats.happiness + stats.growth) / 6);
            });
            
            datasets.push({
                label: '综合评分',
                data: avgHappiness,
                borderColor: '#6b4c33',
                backgroundColor: 'rgba(107, 76, 51, 0.08)',
                borderWidth: 3,
                tension: 0.4,
                fill: true,
                pointRadius: 4,
                pointHoverRadius: 8,
                pointBackgroundColor: '#6b4c33',
                pointBorderColor: '#fff',
                pointBorderWidth: 2
            });
            
                        new Chart(ctx, {
                type: 'line',
                data: { labels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false
                    },
                    plugins: {
                        legend: { 
                            position: 'top',
                            labels: {
                                usePointStyle: true,
                                padding: 15,
                                font: { size: 12, family: "'Noto Sans SC', sans-serif" },
                                color: '#6b5344'
                            }
                        },
                        title: { 
                            display: true, 
                            text: '人生起落图 — 三十五年人生轨迹',
                            font: { size: 18, weight: 'bold', family: "'Noto Serif SC', serif" },
                            color: '#3c2a1a',
                            padding: { top: 10, bottom: 20 }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(58, 40, 26, 0.9)',
                            titleFont: { size: 14, family: "'Noto Serif SC', serif" },
                            bodyFont: { size: 12, family: "'Noto Sans SC', sans-serif" },
                            padding: 12,
                            cornerRadius: 8
                        }
                    },
                    scales: {
                        y: { 
                            min: 0, 
                            max: 100, 
                            title: { display: true, text: '属性值 (0-100)', font: { size: 14, family: "'Noto Sans SC', sans-serif" }, color: '#6b5344' },
                            grid: { color: 'rgba(196, 149, 106, 0.12)' },
                            ticks: { color: '#9a8677', font: { family: "'Noto Sans SC', sans-serif" } }
                        },
                        x: { 
                            title: { display: true, text: '年份 (年龄)', font: { size: 14, family: "'Noto Sans SC', sans-serif" }, color: '#6b5344' },
                            grid: { color: 'rgba(196, 149, 106, 0.08)' },
                            ticks: { color: '#9a8677', font: { family: "'Noto Sans SC', sans-serif" } }
                        }
                    }
                }
            });
        }

        function displayFinalStats() {
            const container = document.getElementById('final-stats');
            container.innerHTML = '';
            const statNames = { wealth: '财富', health: '健康', relation: '人际关系', career: '事业', happiness: '幸福', growth: '成长' };
            Object.keys(GameState.stats).forEach(key => {
                const value = Math.round(Math.max(0, Math.min(100, GameState.stats[key])));
                const div = document.createElement('div');
                div.className = 'final-stat';
                div.innerHTML = `<div class="label">${statNames[key]}</div><div class="value">${value}</div>`;
                container.appendChild(div);
            });
        }

        function generateBiography() {
            let biography = '';
            
            const birthYear = GameState.birthYear;
            const startYear = Math.min(birthYear, 1990);
            const endYear = 2025;
            const startAge = startYear - birthYear;
            const endAge = endYear - birthYear;
            const archetype = GameState.archetypes[0] || { name: '探索者', description: '追求人生意义' };
            
            // 开篇
            biography += `<h3 style="color:var(--color-accent-dark); margin-bottom:15px; font-family:var(--font-serif); letter-spacing:2px;">人生自传</h3>`;
            biography += `<p style="font-size:14px; color:#888; margin-bottom:20px;">`;
            biography += `出生年份：${birthYear}年 | 人生阶段：${startAge}岁 → ${endAge}岁 (${startYear}-${endYear}) | `;
            biography += `主导性格：${archetype.name}（${archetype.description}）`;
            biography += `</p>`;
            
            biography += `<hr style="border:none; height:1px; background:linear-gradient(90deg, transparent, var(--color-accent), transparent); margin:20px 0;">`;
            
            // 第一阶段：童年与成长
            const childhoodStart = startYear;
            const childhoodEnd = Math.min(startYear + 10, 2000);
            biography += `<h4 style="color:var(--color-accent-dark); margin-bottom:15px; font-family:var(--font-serif);">壹 · 童年与成长 (${childhoodStart}-${childhoodEnd})</h4>`;
            
            const childhood = GameState.lifeStory.filter(s => s.year >= childhoodStart && s.year <= childhoodEnd);
            if (childhood.length > 0) {
                biography += `<p style="line-height:1.8;">`;
                biography += `在我的童年和少年时期，我经历了许多塑造人生的关键时刻。`;
                if (startAge <= 10) {
                    biography += `那时的我还只是个懵懂的孩子，对世界充满好奇与期待。`;
                }
                biography += `</p>`;
                
                biography += `<ul style="margin:15px 0; padding-left:20px;">`;
                childhood.slice(0, 6).forEach(event => {
                    biography += `<li style="margin:10px 0; line-height:1.7; color:var(--color-ink-light);"><strong style="color:var(--color-accent-dark);">${event.year}年(${event.age}岁)</strong>：${event.event} — 我选择了「${event.choice}」</li>`;
                });
                biography += `</ul>`;
                
                // 童年阶段总结
                const childhoodStats = GameState.history.filter(h => h.year >= childhoodStart && h.year <= childhoodEnd);
                if (childhoodStats.length > 1) {
                    const first = childhoodStats[0].stats;
                    const last = childhoodStats[childhoodStats.length - 1].stats;
                    const growthChange = last.growth - first.growth;
                    if (growthChange > 10) {
                        biography += `<p style="line-height:1.8;">这段成长经历让我获得了宝贵的知识和经验，成长指数提升了${Math.round(growthChange)}点。</p>`;
                    }
                }
            } else {
                biography += `<p style="line-height:1.8;">这是我人生的起步阶段，奠定了未来发展的基础。我的${archetype.name}特质在这一时期开始显现，${archetype.description}。</p>`;
            }
            
            biography += `<p style="margin:15px 0; line-height:1.8; color:var(--color-ink-muted); font-style:italic;">`;
            biography += `<em>性格洞察：${archetype.name}特质让我在童年时期展现出${['勇敢探索', '细心观察', '乐于助人', '独立思考', '乐观向上'][Math.floor(Math.random() * 5)]}的倾向。</em>`;
            biography += `</p>`;
            
            // 第二阶段：青年与探索
            const youthStart = childhoodEnd + 1;
            const youthEnd = Math.min(youthStart + 9, 2010);
            biography += `<hr style="border:none; height:1px; background:linear-gradient(90deg, transparent, var(--color-accent), transparent); margin:20px 0;">`;
            biography += `<h4 style="color:var(--color-accent-dark); margin-bottom:15px; font-family:var(--font-serif);">贰 · 青年与探索 (${youthStart}-${youthEnd})</h4>`;
            
            const youth = GameState.lifeStory.filter(s => s.year >= youthStart && s.year <= youthEnd);
            if (youth.length > 0) {
                biography += `<p style="line-height:1.8;">`;
                biography += `青年时期是我人生的重要转折点，面临学业、事业、情感等多重选择。`;
                const teenAge = youthStart - birthYear;
                if (teenAge >= 15 && teenAge <= 20) {
                    biography += `青春期带来了更多的思考和挑战，我开始思考人生的方向。`;
                }
                biography += `</p>`;
                
                biography += `<ul style="margin:15px 0; padding-left:20px;">`;
                youth.slice(0, 6).forEach(event => {
                    biography += `<li style="margin:10px 0; line-height:1.7; color:var(--color-ink-light);"><strong style="color:var(--color-accent-dark);">${event.year}年(${event.age}岁)</strong>：${event.event} — 我选择了「${event.choice}」</li>`;
                });
                biography += `</ul>`;
                
                // 青年阶段总结
                const youthStats = GameState.history.filter(h => h.year >= youthStart && h.year <= youthEnd);
                if (youthStats.length > 1) {
                    const first = youthStats[0].stats;
                    const last = youthStats[youthStats.length - 1].stats;
                    const careerChange = last.career - first.career;
                    const relationChange = last.relation - first.relation;
                    if (careerChange > 15) {
                        biography += `<p style="line-height:1.8;">这一阶段，我的事业方向逐渐清晰，事业指数提升了${Math.round(careerChange)}点。</p>`;
                    }
                    if (relationChange > 10) {
                        biography += `<p style="line-height:1.8;">人际关系也在这一时期得到了发展，我学会了如何与他人建立更深的联系。</p>`;
                    }
                }
            } else {
                biography += `<p style="line-height:1.8;">这十年是我人生中重要的探索期，不断学习和成长，为未来奠定了坚实的基础。</p>`;
            }
            
            // 第三阶段：成熟与成就
            const matureStart = youthEnd + 1;
            const matureEnd = Math.min(matureStart + 9, 2020);
            biography += `<hr style="border:none; height:1px; background:linear-gradient(90deg, transparent, var(--color-accent), transparent); margin:20px 0;">`;
            biography += `<h4 style="color:var(--color-accent-dark); margin-bottom:15px; font-family:var(--font-serif);">叁 · 成熟与成就 (${matureStart}-${matureEnd})</h4>`;
            
            const mature = GameState.lifeStory.filter(s => s.year >= matureStart && s.year <= matureEnd);
            if (mature.length > 0) {
                biography += `<p style="line-height:1.8;">`;
                biography += `进入成熟阶段，我的生活更加稳定，但也面临着更多的责任和挑战。`;
                const matureAge = matureStart - birthYear;
                if (matureAge >= 25 && matureAge <= 35) {
                    biography += `在这个年龄段，我开始更多地思考事业发展和家庭生活的平衡。`;
                }
                biography += `</p>`;
                
                biography += `<ul style="margin:15px 0; padding-left:20px;">`;
                mature.slice(0, 6).forEach(event => {
                    biography += `<li style="margin:10px 0; line-height:1.7; color:var(--color-ink-light);"><strong style="color:var(--color-accent-dark);">${event.year}年(${event.age}岁)</strong>：${event.event} — 我选择了「${event.choice}」</li>`;
                });
                biography += `</ul>`;
                
                // 成熟阶段总结
                const matureStats = GameState.history.filter(h => h.year >= matureStart && h.year <= matureEnd);
                if (matureStats.length > 1) {
                    const first = matureStats[0].stats;
                    const last = matureStats[matureStats.length - 1].stats;
                    const wealthChange = last.wealth - first.wealth;
                    if (wealthChange > 20) {
                        biography += `<p style="line-height:1.8;">这一时期，我的财富积累取得了显著进步，财富指数提升了${Math.round(wealthChange)}点。</p>`;
                    }
                }
            } else {
                biography += `<p style="line-height:1.8;">这十年是事业发展的黄金时期，我积累了丰富的经验和人脉资源。</p>`;
            }
            
            // 第四阶段：沉淀与展望
            const recentStart = matureEnd + 1;
            const recentEnd = 2025;
            biography += `<hr style="border:none; height:1px; background:linear-gradient(90deg, transparent, var(--color-accent), transparent); margin:20px 0;">`;
            biography += `<h4 style="color:var(--color-accent-dark); margin-bottom:15px; font-family:var(--font-serif);">肆 · 沉淀与展望 (${recentStart}-${recentEnd})</h4>`;
            
            const recent = GameState.lifeStory.filter(s => s.year >= recentStart && s.year <= recentEnd);
            if (recent.length > 0) {
                biography += `<p style="line-height:1.8;">`;
                biography += `人生进入新阶段，我开始更多地关注内心的平静与满足，珍惜当下的每一刻。`;
                biography += `</p>`;
                
                biography += `<ul style="margin:15px 0; padding-left:20px;">`;
                recent.slice(0, 5).forEach(event => {
                    biography += `<li style="margin:10px 0; line-height:1.7; color:var(--color-ink-light);"><strong style="color:var(--color-accent-dark);">${event.year}年(${event.age}岁)</strong>：${event.event} — 我选择了「${event.choice}」</li>`;
                });
                biography += `</ul>`;
            } else {
                biography += `<p style="line-height:1.8;">在人生的后半程，我更加珍惜当下，追求内心的平和与生活的意义。</p>`;
            }
            
            // 人生总结
            biography += `<hr style="border:none; height:1px; background:linear-gradient(90deg, transparent, var(--color-accent), transparent); margin:20px 0;">`;
            biography += `<h4 style="color:var(--color-accent-dark); margin-bottom:15px; font-family:var(--font-serif);">伍 · 人生总结</h4>`;
            
            const finalStats = GameState.stats;
            const avgScore = Math.round((finalStats.wealth + finalStats.health + finalStats.relation + finalStats.career + finalStats.happiness + finalStats.growth) / 6);
            
            biography += `<p style="line-height:1.8;">回顾这${endAge - startAge}年的人生旅程，我经历了无数的选择与挑战，每一个决定都塑造了今天的我。</p>`;
            
            // 最终状态卡片
            biography += `<div style="background:rgba(232,221,208,0.5); padding:15px; border-radius:10px; margin:15px 0; border:1px solid rgba(196,149,106,0.15);">`;
            biography += `<p style="font-weight:bold; margin-bottom:10px; font-family:var(--font-serif); color:var(--color-ink);">最终人生状态评估</p>`;
            biography += `<div style="display:grid; grid-template-columns:repeat(3,1fr); gap:10px; text-align:center;">`;
            biography += `<div><span style="color:#9a8677;">财富</span><br><strong style="color:#c0392b;">${Math.round(finalStats.wealth)}</strong></div>`;
            biography += `<div><span style="color:#9a8677;">健康</span><br><strong style="color:#4a8b7f;">${Math.round(finalStats.health)}</strong></div>`;
            biography += `<div><span style="color:#9a8677;">人际关系</span><br><strong style="color:#d4a843;">${Math.round(finalStats.relation)}</strong></div>`;
            biography += `<div><span style="color:#9a8677;">事业</span><br><strong style="color:#5a7a5a;">${Math.round(finalStats.career)}</strong></div>`;
            biography += `<div><span style="color:#9a8677;">幸福</span><br><strong style="color:#9b59b6;">${Math.round(finalStats.happiness)}</strong></div>`;
            biography += `<div><span style="color:#9a8677;">成长</span><br><strong style="color:#c4956a;">${Math.round(finalStats.growth)}</strong></div>`;
            biography += `</div>`;
            biography += `<p style="text-align:center; margin-top:15px; font-size:18px; font-family:var(--font-serif); color:var(--color-ink);">综合评分：<strong style="color:var(--color-accent-dark);">${avgScore}</strong> 分</p>`;
            biography += `</div>`;
            
            // 人生感悟
            let conclusion = '';
            if (avgScore >= 80) {
                conclusion = `这是一段非常成功的人生旅程！你的${archetype.name}特质帮助你在人生道路上克服重重困难，实现了人生目标。你用智慧和勇气书写了精彩的人生篇章。`;
            } else if (avgScore >= 60) {
                conclusion = `你的人生充实而有意义，虽然有过挫折和困难，但${archetype.name}的特质让你始终保持前进的动力。每一次选择都让你更加成熟和智慧。`;
            } else if (avgScore >= 40) {
                conclusion = `人生充满挑战，这${endAge - startAge}年的旅程中有起有落。${archetype.name}的特质虽然指引你前行，但也有一些遗憾和未完成的梦想。`;
            } else {
                conclusion = `这段人生旅程充满了艰辛和挑战，但每一次经历都是成长的机会。${archetype.name}的特质将继续指引你在未来的道路上前行。`;
            }
            
            biography += `<p style="line-height:1.8; margin:15px 0; padding:15px; background:rgba(232,221,208,0.4); border-radius:10px; border-left:3px solid var(--color-accent);">`;
            biography += `<strong>人生感悟：</strong>${conclusion}`;
            biography += `</p>`;
            
            // 结束语
            biography += `<p style="text-align:center; margin:20px 0; color:#666; font-style:italic;">`;
            biography += `"人生没有重来，但每一个选择都塑造了今天的你。"<br>`;
            biography += `感谢你参与这段人生旅程，愿你的未来更加精彩！`;
            biography += `</p>`;
            
            // 统计信息
            biography += `<div style="background:rgba(232,221,208,0.3); padding:10px 15px; border-radius:8px; margin-top:15px; font-size:12px; color:var(--color-ink-muted); letter-spacing:1px;">`;
            biography += `统计：共经历 ${GameState.lifeStory.length} 个重要事件 | `;
            biography += `跳过 ${GameState.skippedEvents.length} 个事件`;
            biography += `</div>`;
            
            document.getElementById('biography-text').innerHTML = biography;
        }

        function restartGame() {
            Object.assign(GameState, {
                birthYear: 1985,
                currentYear: 1990,
                currentAge: 0,
                currentQuestion: 0,
                questionAnswers: [],
                dimensionScores: { EI: 0, SN: 0, TF: 0, JP: 0, AC: 0, IE: 0 },
                stats: { wealth: 50, health: 80, relation: 60, career: 20, happiness: 50, growth: 30 },
                history: [],
                archetypes: [],
                yearEventsAnswered: 0,
                skippedEvents: [],
                currentEventIndex: 0,
                currentYearEvents: [],
                lifeStory: [],
                fiveYearSummaries: []
            });
            document.getElementById('birth-year').value = '';
            showSection('intro');
        }
    </script>
</body>
</html>
