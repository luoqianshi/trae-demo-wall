<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="mock-api.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伴伴 · 晚间复盘</title>
<link rel="stylesheet" href="figma-design-system.css">
<style>
  /* ==================== 晚间复盘页专属样式 ==================== */
  .review-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 8px 32px 24px;
  }

  /* ---- 蓝色小标签 ---- */
  .section-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 14px;
    background: var(--accent);
    color: #fff;
    border-radius: var(--r-pill);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.2px;
    font-family: 'Inter', var(--font-sans);
    box-shadow: 0 2px 8px rgba(47, 128, 237, 0.25);
  }

  /* ---- 温暖大标题 ---- */
  .review-headline {
    font-family: 'MiSans VF', var(--font-sans);
    font-size: 38px;
    font-weight: 700;
    color: var(--text-primary);
    margin-top: 14px;
    letter-spacing: -0.5px;
    line-height: 1.2;
  }
  .review-headline .accent-dot {
    color: var(--accent);
  }

  /* ---- 区块通用 ---- */
  .review-block {
    margin-top: 28px;
    animation: slideUp 0.5s ease-out both;
  }
  .review-block:nth-child(2) { animation-delay: 0.05s; }
  .review-block:nth-child(3) { animation-delay: 0.1s; }
  .review-block:nth-child(4) { animation-delay: 0.15s; }

  .block-question {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 4px;
  }
  .block-helper {
    font-size: 13px;
    color: var(--text-tertiary);
    line-height: 1.6;
  }

  /* ---- 心情选择区 ---- */
  .mood-section {
    background: linear-gradient(135deg, rgba(229, 242, 255, 0.6) 0%, rgba(248, 250, 252, 0.6) 100%);
    border: 1px solid var(--border-light);
    border-radius: var(--r-2xl);
    padding: 24px 28px;
  }
  .mood-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-top: 16px;
  }
  .mood-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 22px 12px;
    background: var(--bg-card);
    border: 2px solid transparent;
    border-radius: var(--r-xl);
    cursor: pointer;
    transition: all var(--transition-slow);
    box-shadow: var(--shadow-sm);
    position: relative;
    overflow: hidden;
  }
  .mood-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(124, 58, 237, 0.04), transparent);
    opacity: 0;
    transition: opacity var(--transition);
  }
  .mood-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-elevated);
  }
  .mood-card:hover::before { opacity: 1; }
  .mood-card.selected {
    border-color: #7C3AED;
    background: #FAF5FF;
    box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.12), var(--shadow-elevated);
    transform: translateY(-2px);
  }
  .mood-card.selected::before { opacity: 1; }
  .mood-emoji {
    font-size: 34px;
    line-height: 1;
    transition: transform var(--transition-slow);
  }
  .mood-card:hover .mood-emoji { transform: scale(1.15); }
  .mood-card.selected .mood-emoji { transform: scale(1.2); }
  .mood-label {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
  }
  .mood-card.selected .mood-label { color: #6D28D9; }
  .mood-check {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #7C3AED;
    color: #fff;
    font-size: 12px;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .mood-card.selected .mood-check { display: flex; }

  /* ---- 心情卡片增强动画 ---- */
  .mood-card { transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .mood-card:hover { transform: translateY(-4px) scale(1.02); }
  .mood-card.selected { animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }

  /* ---- 反思问题块 ---- */
  .reflect-block {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--r-2xl);
    padding: 24px 28px;
    box-shadow: var(--shadow-card);
  }
  .reflect-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .reflect-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 28px;
    height: 24px;
    padding: 0 8px;
    background: var(--accent);
    color: #fff;
    border-radius: var(--r-xs);
    font-size: 12px;
    font-weight: 700;
    font-family: 'Inter', var(--font-sans);
    letter-spacing: 0.5px;
  }
  .reflect-tag {
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
  }
  .reflect-question {
    font-size: 18px;
    font-weight: 630;
    color: var(--text-primary);
    font-family: 'MiSans VF', var(--font-sans);
    margin: 6px 0 4px;
  }
  .reflect-helper {
    font-size: 13px;
    color: var(--text-tertiary);
    line-height: 1.65;
    margin-bottom: 14px;
  }
  .reflect-textarea {
    width: 100%;
    min-height: 110px;
    padding: 14px 16px;
    background: #F9FAFB;
    border: 1.5px solid var(--border);
    border-radius: var(--r-md);
    font-family: var(--font-sans);
    font-size: 15px;
    color: var(--text-primary);
    line-height: 1.7;
    resize: vertical;
    outline: none;
    transition: all var(--transition);
  }
  .reflect-textarea::placeholder {
    color: var(--text-placeholder);
  }
  .reflect-textarea:focus {
    border-color: var(--accent);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(47, 128, 237, 0.12), var(--shadow-glow);
  }

  /* ---- 底部生成按钮 ---- */
  .review-footer {
    padding: 8px 32px 28px;
    flex-shrink: 0;
  }
  .gen-review-btn {
    width: 100%;
    height: 54px;
    border: none;
    border-radius: var(--r-lg);
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-darker) 100%);
    color: #fff;
    font-family: 'MiSans VF', var(--font-sans);
    font-size: 17px;
    font-weight: 630;
    cursor: pointer;
    transition: all var(--transition-slow);
    box-shadow: 0 6px 18px rgba(47, 128, 237, 0.32);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    letter-spacing: 0.5px;
  }
  .gen-review-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 26px rgba(47, 128, 237, 0.4);
  }
  .gen-review-btn:active { transform: translateY(0); }
  .gen-review-btn.loading {
    pointer-events: none;
    opacity: 0.75;
  }
  .gen-review-btn .spinner {
    width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .gen-review-btn.loading .spinner { display: inline-block; }
  .gen-review-btn.loading .btn-text { opacity: 0.8; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- 完成任务快照 ---- */
  .done-tasks {
    margin-top: 16px;
    padding: 14px 16px;
    background: var(--bg-muted);
    border-radius: var(--r-md);
    border: 1px solid var(--border-light);
  }
  .done-tasks-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-tertiary);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .done-task-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .done-task-check {
    width: 16px; height: 16px;
    border-radius: 4px;
    background: var(--accent);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
    flex-shrink: 0;
  }

  .app-main { display: flex; flex-direction: column; }
  .review-content-wrap { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
</style>
</head>
<body>
<div class="app-layout" id="app-layout">
  <!-- 侧边栏占位 -->
  <div id="sidebar-placeholder"></div>

  <!-- 主内容区 -->
  <main class="app-main">
    <div id="header-placeholder"></div>

    <div class="review-content-wrap">
      <div class="app-content review-scroll">
        <!-- 视图切换器 -->
        <div style="display: flex; justify-content: flex-end; padding: 8px 0 16px;">
          <div class="view-toggle">
            <button class="view-toggle-btn" onclick="location.href='review_morning.html'">
              <i class="ti ti-sunrise"></i>
              <span>早间简报</span>
            </button>
            <button class="view-toggle-btn active" onclick="location.href='review_evening.html'">
              <i class="ti ti-moon-stars"></i>
              <span>晚间复盘</span>
            </button>
          </div>
        </div>

        <!-- EVENING REVIEW 标签 -->
        <div class="section-tag animate-fade-in">EVENING REVIEW</div>

        <!-- 温暖大标题 -->
        <h1 class="review-headline">今天<span class="accent-dot">，</span>辛苦了</h1>

        <!-- 心情选择区 -->
        <div class="review-block">
          <div class="block-question">此刻回看今天，你的感受更接近哪一种？</div>
          <div class="block-helper">选择一个最贴近的状态，帮助伴伴理解你今天的能量。</div>
          <div class="mood-section">
            <div class="mood-grid" id="mood-grid">
              <div class="mood-card" data-mood="tired">
                <span class="mood-check">✓</span>
                <span class="mood-emoji">😔</span>
                <span class="mood-label">疲惫</span>
              </div>
              <div class="mood-card" data-mood="messy">
                <span class="mood-check">✓</span>
                <span class="mood-emoji">😕</span>
                <span class="mood-label">有点乱</span>
              </div>
              <div class="mood-card" data-mood="okay">
                <span class="mood-check">✓</span>
                <span class="mood-emoji">🙂</span>
                <span class="mood-label">还不错</span>
              </div>
              <div class="mood-card" data-mood="full">
                <span class="mood-check">✓</span>
                <span class="mood-emoji">😊</span>
                <span class="mood-label">充实</span>
              </div>
            </div>
          </div>
        </div>

        <!-- 01 事实 -->
        <div class="review-block">
          <div class="reflect-block">
            <div class="reflect-header">
              <span class="reflect-num">01</span>
              <span class="reflect-tag">事实</span>
            </div>
            <div class="reflect-question">今天最值得被看见的一件事是什么？</div>
            <div class="reflect-helper">可以很小，比如：我终于把那个复杂的结构理顺了……</div>
            <textarea class="reflect-textarea" id="fact-text" placeholder="写下今天那个被你看见的瞬间"></textarea>

            <!-- 今日完成任务快照 -->
            <div class="done-tasks" id="done-tasks">
              <div class="done-tasks-title"><i class="ti ti-sparkles"></i> 今日已完成（伴伴帮你记着）</div>
              <div id="done-tasks-list">
                <div class="done-task-item"><span class="done-task-check">✓</span>正在读取今日完成的任务…</div>
              </div>
            </div>
          </div>
        </div>

        <!-- 02 理解 -->
        <div class="review-block">
          <div class="reflect-block">
            <div class="reflect-header">
              <span class="reflect-num">02</span>
              <span class="reflect-tag">理解</span>
            </div>
            <div class="reflect-question">什么帮助了你，什么又让你感到阻力？</div>
            <div class="reflect-helper">伴伴会把你的解释与行为事实分开保存，不会混为一谈。</div>
            <textarea class="reflect-textarea" id="insight-text" placeholder="哪些因素推着你前进，哪些又拉住了你？"></textarea>
          </div>
        </div>
      </div>

      <!-- 底部生成按钮 -->
      <div class="review-footer">
        <button class="gen-review-btn hover-shrink ripple-btn" id="gen-review-btn">
          <span class="spinner"></span>
          <span class="btn-text"><i class="ti ti-sparkles"></i> 生成今日复盘</span>
        </button>
      </div>
    </div>
  </main>

  <!-- AI 助手面板占位 -->
  <div id="ai-placeholder"></div>
</div>

<script src="banban-icons.js"></script>
<script src="figma-components.js"></script>
<script>
  // ==================== 晚间复盘逻辑 ====================
  const FALLBACK_DONE_TASKS = [
    { title: '完成项目结构梳理', category: 'work' },
    { title: '回复重要客户邮件', category: 'work' },
    { title: '阅读《深度工作》第三章', category: 'study' },
  ];

  let selectedMood = null;

  // ---- 页面初始化 ----
  initPage('review', {
    header: {
      title: '复盘',
      subtitle: '',
      showControls: true,
    },
    ai: {
      insight: '今天你在上午 10 点前后进入了一段较长的专注状态，下午的任务切换偏多。回看时，先看见自己做到的，再看卡住的地方。',
      suggestion: '写下今天最值得被看见的一件事，哪怕很小。把"做到"和"卡住"分开记录，复盘会更清晰。',
    },
  });

  // ---- 心情选择交互 ----
  const moodGrid = document.getElementById('mood-grid');
  moodGrid.addEventListener('click', (e) => {
    const card = e.target.closest('.mood-card');
    if (!card) return;
    const mood = card.dataset.mood;

    if (selectedMood === mood) {
      // 再次点击取消选中
      card.classList.remove('selected');
      selectedMood = null;
    } else {
      // 切换选中
      moodGrid.querySelectorAll('.mood-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      selectedMood = mood;
    }
  });

  // ---- 输入框聚焦动效 ----
  document.querySelectorAll('.reflect-input, textarea').forEach(input => {
    input.addEventListener('focus', function() {
      this.style.transition = 'all 0.25s ease';
      this.style.boxShadow = '0 0 0 3px rgba(47, 128, 237, 0.12)';
    });
    input.addEventListener('blur', function() {
      this.style.boxShadow = '';
    });
  });

  // ---- 入场交错动画 ----
  addStaggerAnimation(document.getElementById('mood-grid'));
  document.querySelectorAll('.reflect-block').forEach(block => addStaggerAnimation(block));

  // ---- 加载今日完成任务 ----
  async function loadDoneTasks() {
    const listEl = document.getElementById('done-tasks-list');
    const data = await API.get('/api/tasks?date=today');
    let tasks = null;
    if (data) {
      tasks = Array.isArray(data) ? data : (data.tasks || data.items || null);
    }
    if (!tasks || !tasks.length) {
      tasks = FALLBACK_DONE_TASKS;
    }
    // 过滤已完成
    const done = tasks.filter(t => t.completed || t.done || t.status === 'done' || t.status === 'completed');
    const renderList = done.length ? done : tasks;

    listEl.innerHTML = renderList.slice(0, 5).map(t => `
      <div class="done-task-item">
        <span class="done-task-check">✓</span>${escapeHtml(t.title || t.name || t.content || '一项任务')}
      </div>
    `).join('');
    if (!renderList.length) {
      listEl.innerHTML = '<div class="done-task-item" style="color:var(--text-faint);">今天还没有记录到的完成任务</div>';
    }
  }
  loadDoneTasks();

  // ---- 生成今日复盘 ----
  const genBtn = document.getElementById('gen-review-btn');
  genBtn.addEventListener('click', async () => {
    const fact = document.getElementById('fact-text').value.trim();
    const insight = document.getElementById('insight-text').value.trim();

    if (!selectedMood && !fact && !insight) {
      showToast('先选一个心情，或写下今天的一件事吧');
      return;
    }

    genBtn.classList.add('loading');
    const btnText = genBtn.querySelector('.btn-text');
    btnText.textContent = '生成中…';
    const typingEl = showTypingIndicator(document.querySelector('.review-output') || genBtn.parentElement);

    const payload = {
      type: 'evening_review',
      mood: selectedMood,
      fact,
      understanding: insight,
      date: formatDate(),
    };

    // 并行：发给 AI 分析 + 处理复盘事件
    const [chatRes, eventRes] = await Promise.all([
      API.post('/api/chat', {
        message: `晚间复盘：心情=${selectedMood || '未选'}；事实=${fact}；理解=${insight}`,
        context: 'evening_review',
        stream: false,
      }),
      API.post('/api/events/process', payload),
    ]);

    genBtn.classList.remove('loading');
    if (typingEl) typingEl.remove();
    btnText.innerHTML = '<i class="ti ti-sparkles"></i> 生成今日复盘';

    if (chatRes || eventRes) {
      // 更新 AI 面板内容
      const reply = (chatRes && (chatRes.reply || chatRes.response)) || null;
      if (reply) {
        const insightEl = document.querySelector('.ai-section .ai-section-text');
        if (insightEl) insightEl.textContent = reply;
      }
      showToast('复盘已保存，明天见 ☾');
    } else {
      showToast('复盘已记录（离线模式）');
    }
  });
</script>
</body>
</html>
