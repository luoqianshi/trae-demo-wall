<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="mock-api.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伴伴 · 行为认知</title>
<style>
:root {
  --bg: #faf8f5;
  --bg-soft: #f5f0ea;
  --card: #ffffff;
  --card-hover: #fdfbf8;
  --accent: #e8a87c;
  --accent-light: #f4d4be;
  --accent-soft: rgba(232, 168, 124, 0.12);
  --accent-border: rgba(232, 168, 124, 0.45);
  --mint: #85b79d;
  --text-dark: #4a4038;
  --text-mid: #6b6258;
  --text-light: #a89e92;
  --text-faint: #c4b8aa;
  --border: #ece5db;
  --border-soft: #f0ebe3;
  --radius: 16px;
  --radius-sm: 12px;
  --radius-xs: 8px;
  --shadow: 0 2px 8px rgba(120, 100, 80, 0.05), 0 6px 20px rgba(120, 100, 80, 0.04);
  --shadow-hover: 0 4px 12px rgba(120, 100, 80, 0.08), 0 10px 28px rgba(120, 100, 80, 0.06);
  --shadow-soft: 0 1px 4px rgba(120, 100, 80, 0.04);
  --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);

  --c-deep: #4A90D9;
  --c-light: #7BB3E8;
  --c-comm: #F5A623;
  --c-learn: #9B7ED8;
  --c-ent-a: #E57373;
  --c-ent-p: #EF9A9A;
  --c-rest: #66BB6A;
  --c-away: #BDBDBD;
  --c-unknown: #E0E0E0;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 15px; -webkit-font-smoothing: antialiased; }

body {
  font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text-dark);
  line-height: 1.7;
  min-height: 100vh;
}

.app {
  max-width: 900px;
  margin: 0 auto;
  padding: 24px 20px 60px;
}

/* ===== Header ===== */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 28px;
}

.header-title {
  font-size: 22px;
  font-weight: 600;
  color: var(--text-dark);
  letter-spacing: 0.5px;
}

.header-subtitle {
  font-size: 13px;
  color: var(--text-light);
  margin-top: 2px;
}

.header-actions {
  display: flex;
  gap: 8px;
}

.btn {
  padding: 8px 16px;
  border: 1.5px solid var(--border);
  border-radius: 100px;
  background: var(--card);
  font-family: inherit;
  font-size: 13px;
  color: var(--text-mid);
  cursor: pointer;
  transition: all var(--transition);
  white-space: nowrap;
}

.btn:hover {
  border-color: var(--accent-light);
  color: var(--text-dark);
  transform: translateY(-1px);
}

.btn-primary {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

.btn-primary:hover {
  background: #e0986a;
  border-color: #e0986a;
}

/* ===== 当前状态卡片 ===== */
.state-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 28px 24px;
  box-shadow: var(--shadow);
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
  transition: all var(--transition);
}

.state-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 4px;
  height: 100%;
  background: var(--state-color, var(--accent));
  transition: background var(--transition);
}

.state-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 16px;
}

.state-icon {
  font-size: 36px;
  line-height: 1;
}

.state-info {
  flex: 1;
}

.state-label {
  font-size: 20px;
  font-weight: 600;
  color: var(--text-dark);
}

.state-confidence {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 4px;
}

.confidence-bar {
  flex: 1;
  max-width: 120px;
  height: 4px;
  background: var(--border-soft);
  border-radius: 2px;
  overflow: hidden;
}

.confidence-fill {
  height: 100%;
  background: var(--state-color, var(--accent));
  border-radius: 2px;
  transition: width 0.6s ease;
}

.confidence-text {
  font-size: 12px;
  color: var(--text-light);
}

.state-source {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 100px;
  font-size: 11px;
  font-weight: 500;
}

.state-source.rules {
  background: rgba(91, 138, 114, 0.1);
  color: var(--mint);
}

.state-source.ai {
  background: var(--accent-soft);
  color: var(--accent);
}

.state-source.ai::before {
  content: 'AI';
  font-weight: 700;
  font-size: 10px;
}

/* ===== AI 推理 ===== */
.ai-reasoning {
  background: var(--bg-soft);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  margin-top: 12px;
  font-size: 14px;
  color: var(--text-mid);
  line-height: 1.6;
  display: none;
}

.ai-reasoning.visible { display: block; }

.ai-reasoning-label {
  font-size: 11px;
  color: var(--text-light);
  margin-bottom: 4px;
  letter-spacing: 0.3px;
}

/* ===== 建议动作 ===== */
.suggestion {
  background: linear-gradient(135deg, var(--accent-soft), rgba(133, 183, 157, 0.08));
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  margin-top: 12px;
  display: none;
}

.suggestion.visible { display: block; }

.suggestion-text {
  font-size: 14px;
  color: var(--text-dark);
  font-weight: 500;
}

.suggestion-reason {
  font-size: 12px;
  color: var(--text-light);
  margin-top: 4px;
}

/* ===== 时间感知 ===== */
.time-section {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
}

.time-card {
  background: var(--card);
  border-radius: var(--radius-sm);
  padding: 16px;
  box-shadow: var(--shadow-soft);
  transition: all var(--transition);
}

.time-card:hover {
  box-shadow: var(--shadow);
}

.time-card-label {
  font-size: 11px;
  color: var(--text-light);
  letter-spacing: 0.3px;
  margin-bottom: 6px;
}

.time-card-value {
  font-size: 15px;
  font-weight: 500;
  color: var(--text-dark);
}

.time-card-detail {
  font-size: 12px;
  color: var(--text-light);
  margin-top: 4px;
}

.lifestyle-note {
  grid-column: 1 / -1;
  background: linear-gradient(135deg, var(--accent-soft), rgba(133, 183, 157, 0.06));
  border: none;
  text-align: center;
}

.lifestyle-note .time-card-value {
  font-size: 14px;
  color: var(--text-mid);
  font-weight: 400;
  font-style: italic;
}

/* ===== 时间轴 ===== */
.timeline-section {
  background: var(--card);
  border-radius: var(--radius);
  padding: 24px 20px;
  box-shadow: var(--shadow);
  margin-bottom: 20px;
}

.section-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-dark);
  margin-bottom: 16px;
}

.timeline-track {
  display: flex;
  height: 40px;
  border-radius: var(--radius-xs);
  overflow: hidden;
  gap: 2px;
  background: var(--border-soft);
}

.timeline-segment {
  flex: 1;
  min-width: 4px;
  border-radius: 3px;
  transition: all 0.3s ease;
  cursor: pointer;
  position: relative;
}

.timeline-segment:hover {
  transform: scaleY(1.15);
  z-index: 2;
}

.timeline-segment:hover::after {
  content: attr(data-label);
  position: absolute;
  bottom: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--text-dark);
  color: white;
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 11px;
  white-space: nowrap;
  pointer-events: none;
}

.timeline-empty {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-faint);
  font-size: 13px;
}

.timeline-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 14px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-light);
}

.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 3px;
}

/* ===== 证据列表 ===== */
.evidence-section {
  background: var(--card);
  border-radius: var(--radius);
  padding: 24px 20px;
  box-shadow: var(--shadow);
  margin-bottom: 20px;
}

.evidence-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.evidence-item {
  padding: 10px 14px;
  background: var(--bg-soft);
  border-radius: var(--radius-xs);
  font-size: 13px;
  color: var(--text-mid);
  border-left: 3px solid var(--accent-light);
  transition: all var(--transition);
}

.evidence-item:hover {
  border-left-color: var(--accent);
  background: var(--card-hover);
}

/* ===== 模拟器 ===== */
.simulator-section {
  background: var(--card);
  border-radius: var(--radius);
  padding: 24px 20px;
  box-shadow: var(--shadow);
}

.simulator-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 10px;
}

.sim-card {
  padding: 14px 10px;
  background: var(--bg-soft);
  border: 2px solid transparent;
  border-radius: var(--radius-sm);
  text-align: center;
  cursor: pointer;
  transition: all var(--transition);
  user-select: none;
}

.sim-card:hover {
  border-color: var(--accent-light);
  background: var(--card-hover);
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}

.sim-card.active {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.sim-icon {
  font-size: 24px;
  margin-bottom: 6px;
}

.sim-label {
  font-size: 13px;
  color: var(--text-mid);
  font-weight: 500;
}

/* ===== 反馈按钮 ===== */
.feedback-row {
  display: flex;
  gap: 10px;
  margin-top: 16px;
  justify-content: center;
}

.feedback-btn {
  padding: 8px 20px;
  border: 1.5px solid var(--border);
  border-radius: 100px;
  background: var(--card);
  font-family: inherit;
  font-size: 13px;
  color: var(--text-mid);
  cursor: pointer;
  transition: all var(--transition);
  display: flex;
  align-items: center;
  gap: 6px;
}

.feedback-btn:hover {
  border-color: var(--accent);
  color: var(--text-dark);
}

.feedback-btn.correct:hover {
  background: rgba(102, 187, 106, 0.08);
  border-color: var(--c-rest);
  color: var(--c-rest);
}

.feedback-btn.wrong:hover {
  background: rgba(229, 115, 115, 0.08);
  border-color: var(--c-ent-a);
  color: var(--c-ent-a);
}

/* ===== Loading ===== */
.loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px;
  gap: 12px;
}

.spinner {
  width: 32px;
  height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loading-text {
  font-size: 14px;
  color: var(--text-light);
}

/* ===== Responsive ===== */
@media (max-width: 640px) {
  .time-section { grid-template-columns: 1fr; }
  .state-header { flex-direction: column; align-items: flex-start; gap: 8px; }
}
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <div class="header">
    <div>
      <div class="header-title">行为认知</div>
      <div class="header-subtitle">伴伴在默默理解你此刻在做什么</div>
    </div>
    <div class="header-actions">
      <button class="btn" onclick="refresh()">刷新</button>
      <button class="btn btn-primary" onclick="simulateRandom()">模拟场景</button>
    </div>
  </div>

  <!-- 当前状态 -->
  <div id="stateCard" class="state-card" style="--state-color: #E0E0E0;">
    <div class="loading">
      <div class="spinner"></div>
      <div class="loading-text">正在理解你此刻的状态…</div>
    </div>
  </div>

  <!-- 时间感知 -->
  <div class="time-section" id="timeSection" style="display:none;">
    <div class="time-card">
      <div class="time-card-label">物理时间</div>
      <div class="time-card-value" id="timePhysical">—</div>
      <div class="time-card-detail" id="timePhysicalDetail">—</div>
    </div>
    <div class="time-card">
      <div class="time-card-label">社会节律</div>
      <div class="time-card-value" id="timeSocial">—</div>
      <div class="time-card-detail" id="timeSocialDetail">—</div>
    </div>
    <div class="time-card">
      <div class="time-card-label">生理估计</div>
      <div class="time-card-value" id="timeBio">—</div>
      <div class="time-card-detail" id="timeBioDetail">—</div>
    </div>
    <div class="time-card">
      <div class="time-card-label">个人节律</div>
      <div class="time-card-value" id="timePersonal">—</div>
      <div class="time-card-detail" id="timePersonalDetail">—</div>
    </div>
    <div class="time-card lifestyle-note" id="lifestyleNote" style="display:none;">
      <div class="time-card-value" id="lifestyleText"></div>
    </div>
  </div>

  <!-- 时间轴 -->
  <div class="timeline-section">
    <div class="section-title">今日时间轴</div>
    <div class="timeline-track" id="timelineTrack">
      <div class="timeline-empty">还没有足够的数据 — 试试模拟场景</div>
    </div>
    <div class="timeline-legend" id="timelineLegend"></div>
  </div>

  <!-- 证据 -->
  <div class="evidence-section" id="evidenceSection" style="display:none;">
    <div class="section-title">判断依据</div>
    <div class="evidence-list" id="evidenceList"></div>
  </div>

  <!-- 模拟器 -->
  <div class="simulator-section">
    <div class="section-title">场景模拟器</div>
    <div style="font-size:13px;color:var(--text-light);margin-bottom:14px;">
      选择一个场景，看看伴伴怎么理解
    </div>
    <div class="simulator-grid" id="simulatorGrid"></div>
  </div>
</div>

<script>
// ============================================================
// State
// ============================================================

const CATEGORY_INFO = {
  deep_work: { label: "深度工作", color: "#4A90D9", icon: "\u{1F4A1}" },
  light_work: { label: "轻度工作", color: "#7BB3E8", icon: "\u{1F4DD}" },
  communication: { label: "沟通交流", color: "#F5A623", icon: "\u{1F4AC}" },
  learning: { label: "学习研究", color: "#9B7ED8", icon: "\u{1F4DA}" },
  entertainment_active: { label: "主动娱乐", color: "#E57373", icon: "\u{1F3AE}" },
  entertainment_passive: { label: "被动娱乐", color: "#EF9A9A", icon: "\u{1F3AC}" },
  rest: { label: "休息", color: "#66BB6A", icon: "\u{1F37C}" },
  away: { label: "离开", color: "#BDBDBD", icon: "\u{1F4A4}" },
  unknown: { label: "未知", color: "#E0E0E0", icon: "\u2753" },
};

const SIM_SCENARIOS = [
  { key: "coding", icon: "\u{1F4BB}", label: "写代码" },
  { key: "browsing", icon: "\u{1F50D}", label: "查资料" },
  { key: "social", icon: "\u{1F4AC}", label: "聊微信" },
  { key: "entertainment", icon: "\u{1F3AC}", label: "看视频" },
  { key: "away", icon: "\u{1F4A4}", label: "离开了" },
];

// ============================================================
// API
// ============================================================

async function api(path, options = {}) {
  const res = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...options,
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

// ============================================================
// Render
// ============================================================

function renderState(data) {
  const cat = CATEGORY_INFO[data.primary_state] || CATEGORY_INFO.unknown;
  const card = document.getElementById("stateCard");
  card.style.setProperty("--state-color", cat.color);

  const sourceBadge = data.source === "ai_with_rules"
    ? '<span class="state-source ai">AI 复核</span>'
    : '<span class="state-source rules">规则判断</span>';

  const overrideNote = data.ai_overrode_rules
    ? '<div style="font-size:12px;color:var(--text-light);margin-top:4px;">AI 推翻了规则初判</div>'
    : "";

  const reasoningHtml = data.ai_reasoning
    ? `<div class="ai-reasoning visible">
         <div class="ai-reasoning-label">AI 的理解</div>
         ${escapeHtml(data.ai_reasoning)}
       </div>`
    : "";

  const suggestionHtml = data.suggested_action
    ? `<div class="suggestion visible">
         <div class="suggestion-text">\u{1F49D} ${escapeHtml(data.suggested_action)}</div>
         ${data.suggested_action_reason ? `<div class="suggestion-reason">${escapeHtml(data.suggested_action_reason)}</div>` : ""}
       </div>`
    : "";

  const evidenceHtml = (data.evidence && data.evidence.length > 0)
    ? data.evidence.map(e => `<div class="evidence-item">${escapeHtml(e)}</div>`).join("")
    : '<div class="evidence-item" style="border-left-color:var(--border);">暂无判断依据</div>';

  card.innerHTML = `
    <div class="state-header">
      <div class="state-icon">${cat.icon}</div>
      <div class="state-info">
        <div class="state-label">${cat.label}</div>
        <div class="state-confidence">
          <div class="confidence-bar">
            <div class="confidence-fill" style="width:${(data.confidence * 100).toFixed(0)}%"></div>
          </div>
          <span class="confidence-text">置信度 ${(data.confidence * 100).toFixed(0)}%</span>
          ${sourceBadge}
        </div>
        ${overrideNote}
      </div>
    </div>
    ${reasoningHtml}
    ${suggestionHtml}
    <div class="feedback-row">
      <button class="feedback-btn correct" onclick="sendFeedback(true)">
        \u2714 判断对了
      </button>
      <button class="feedback-btn wrong" onclick="sendFeedback(false)">
        \u2718 不太对
      </button>
    </div>
  `;

  // 证据
  const evSection = document.getElementById("evidenceSection");
  if (data.evidence && data.evidence.length > 0) {
    evSection.style.display = "block";
    document.getElementById("evidenceList").innerHTML = evidenceHtml;
  } else {
    evSection.style.display = "none";
  }
}

function renderTimeContext(tc) {
  if (!tc) return;
  document.getElementById("timeSection").style.display = "grid";

  const p = tc.physical || {};
  document.getElementById("timePhysical").textContent = p.time_of_day_label || "—";
  document.getElementById("timePhysicalDetail").textContent =
    `${p.work_phase_label || ""} · ${p.datetime || ""}`;

  const s = tc.social || {};
  document.getElementById("timeSocial").textContent = s.day_type_label || "—";
  document.getElementById("timeSocialDetail").textContent =
    s.meal_time ? `正值${s.meal_time_label}` : (p.is_work_time ? "工作时间" : "非工作时间");

  const b = tc.biological || {};
  const bioText = [];
  if (b.hunger_probability > 0.5) bioText.push("有点饿");
  if (b.sleepiness_probability > 0.5) bioText.push("有点困");
  if (b.fatigue_level > 0.5) bioText.push("有些累");
  if (b.need_break_probability > 0.6) bioText.push("该歇歇了");
  document.getElementById("timeBio").textContent = bioText.length > 0 ? bioText.join(" · ") : "状态不错";
  document.getElementById("timeBioDetail").textContent =
    `连续工作 ${b.consecutive_work_hours || 0}h · 疲劳度 ${Math.round((b.fatigue_level || 0) * 100)}%`;

  const per = tc.personal || {};
  document.getElementById("timePersonal").textContent = per.chronotype_label || "—";
  document.getElementById("timePersonalDetail").textContent =
    per.is_peak_hour ? "正在高效时段" : "非高峰时段";

  // 生活感悟
  const note = tc.lifestyle_note || (tc.time_context && tc.time_context.lifestyle_note);
  if (note) {
    document.getElementById("lifestyleNote").style.display = "block";
    document.getElementById("lifestyleText").textContent = note;
  } else {
    document.getElementById("lifestyleNote").style.display = "none";
  }
}

function renderTimeline(timeline) {
  const track = document.getElementById("timelineTrack");
  if (!timeline || timeline.length === 0) {
    track.innerHTML = '<div class="timeline-empty">还没有足够的数据 — 试试模拟场景</div>';
    document.getElementById("timelineLegend").innerHTML = "";
    return;
  }

  // 按时间排序
  const sorted = [...timeline].sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

  // 渲染段
  track.innerHTML = sorted.map(item => {
    const cat = CATEGORY_INFO[item.primary_state] || CATEGORY_INFO.unknown;
    const time = new Date((item.timestamp || 0) * 1000);
    const timeStr = time.getHours().toString().padStart(2, "0") + ":" + time.getMinutes().toString().padStart(2, "0");
    return `<div class="timeline-segment"
              style="background:${cat.color};"
              data-label="${timeStr} ${cat.label} (${Math.round((item.confidence||0)*100)}%)"
              title="${timeStr} ${cat.label}"></div>`;
  }).join("");

  // 图例（只显示出现过的状态）
  const seen = new Set(sorted.map(s => s.primary_state));
  const legendItems = Array.from(seen).map(state => {
    const cat = CATEGORY_INFO[state] || CATEGORY_INFO.unknown;
    return `<div class="legend-item">
      <div class="legend-dot" style="background:${cat.color};"></div>
      ${cat.label}
    </div>`;
  }).join("");
  document.getElementById("timelineLegend").innerHTML = legendItems;
}

function renderSimulator() {
  document.getElementById("simulatorGrid").innerHTML = SIM_SCENARIOS.map(s => `
    <div class="sim-card" onclick="simulate('${s.key}')">
      <div class="sim-icon">${s.icon}</div>
      <div class="sim-label">${s.label}</div>
    </div>
  `).join("");
}

// ============================================================
// Actions
// ============================================================

function escapeHtml(text) {
  if (!text) return "";
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

async function refresh() {
  try {
    const data = await api("/api/behavior/current");
    renderState(data);
    if (data.time_context) renderTimeContext(data.time_context);
  } catch (e) {
    console.error("刷新失败:", e);
    document.getElementById("stateCard").innerHTML = `
      <div style="text-align:center;padding:20px;color:var(--text-light);">
        加载失败 — ${escapeHtml(e.message)}
        <button class="btn" style="margin-top:12px;" onclick="refresh()">重试</button>
      </div>`;
  }
}

async function simulate(scenario) {
  // 高亮选中
  document.querySelectorAll(".sim-card").forEach(c => c.classList.remove("active"));
  event && event.target && event.target.closest(".sim-card")?.classList.add("active");

  // 显示 loading
  document.getElementById("stateCard").innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      <div class="loading-text">伴伴正在观察…</div>
    </div>`;

  try {
    const data = await api("/api/behavior/simulate", {
      method: "POST",
      body: JSON.stringify({ scenario }),
    });
    renderState(data);
    if (data.time_context) renderTimeContext(data.time_context);

    // 刷新时间轴
    const tl = await api("/api/behavior/timeline?minutes=60");
    renderTimeline(tl.timeline);
  } catch (e) {
    console.error("模拟失败:", e);
    document.getElementById("stateCard").innerHTML = `
      <div style="text-align:center;padding:20px;color:var(--text-light);">
        模拟失败 — ${escapeHtml(e.message)}
      </div>`;
  }
}

async function simulateRandom() {
  const random = SIM_SCENARIOS[Math.floor(Math.random() * SIM_SCENARIOS.length)];
  simulate(random.key);
}

async function sendFeedback(correct) {
  try {
    await api("/api/behavior/feedback", {
      method: "POST",
      body: JSON.stringify({ correct }),
    });
    // 温暖的反馈
    const card = document.getElementById("stateCard");
    const note = document.createElement("div");
    note.style.cssText = "text-align:center;padding:8px;color:var(--mint);font-size:13px;";
    note.textContent = correct ? "谢谢，我会记住的" : "抱歉理解错了，我会继续学习";
    card.appendChild(note);
    setTimeout(() => note.remove(), 2000);
  } catch (e) {
    console.error("反馈失败:", e);
  }
}

// ============================================================
// Init
// ============================================================
renderSimulator();
refresh();

// 时间感知
api("/api/behavior/time-sense").then(renderTimeContext).catch(() => {});

// 自动刷新（30 秒）
setInterval(() => {
  refresh();
  api("/api/behavior/timeline?minutes=60").then(tl => renderTimeline(tl.timeline)).catch(() => {});
}, 30000);
</script>
