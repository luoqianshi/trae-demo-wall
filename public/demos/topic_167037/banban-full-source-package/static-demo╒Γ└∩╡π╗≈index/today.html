// ==================== AI 规划流程弹层逻辑 ====================

const PlanFlow = {
  currentStep: 1,
  totalSteps: 5,
  data: {
    todayInfo: null,       // 步骤1: 今日信息
    conditions: {          // 步骤2: 用户确认的条件
      main_goal: '',
      end_time: 23.0,      // 今日可规划到几点，默认 23:00
      energy_level: null,  // 精力状态：low/normal/high/uncertain，不设默认
      planning_intensity: 'balanced', // 计划强度：safe/balanced/sprint，默认适中
    },
    // 【重构】步骤2 数据 - 统一管理，去除重复数组
    step2: {
      selectedGoals: [],          // 选中的目标ID列表
      customGoals: [],            // 用户自定义添加的目标
      mustDoItems: [],            // 统一的必做事项数组（含 source 字段）
      mustDoConfirmedEmpty: false, // 用户是否确认"今天没有必做事项"
      selectedHabitIds: [],       // 勾选纳入计划的习惯ID
      breakdownConfirmed: false,  // 是否已确认目标拆解
      breakdownMode: 'confirm',   // confirm 或 skip
      // 添加必做事项的临时状态
      addingMustDo: {
        active: false,
        mode: null,          // 'direct' 直接新建 / 'select' 从已有选择
        title: '',           // 用户输入的标题
        domain: null,        // 识别出的领域
        domain_confidence: 0,// 领域置信度
        domain_confirmed: false, // 用户是否确认了领域
        duration_minutes: 45,   // 预计时间，默认45
        isClassifying: false,   // 是否正在调用领域识别API
      },
    },
    options: [],           // 步骤3: 三种方案
    selectedOption: null,  // 选中的方案
    tunedTasks: [],        // 步骤4: 微调后的任务
    removedTaskIds: [],    // 已删除的任务ID
    step4: {
      isRearranging: false,  // 是否正在重新安排
    },
  },

  // 打开弹层
  open() {
    this.currentStep = 1;
    this.data = {
      todayInfo: null,
      conditions: { main_goal: '', end_time: 23.0, energy_level: null, planning_intensity: 'balanced' },
      step2: {
        selectedGoals: [],
        customGoals: [],
        mustDoItems: [],
        mustDoConfirmedEmpty: false,
        selectedHabitIds: [],
        breakdownConfirmed: false,
        breakdownMode: 'confirm',
        addingMustDo: {
          active: false,
          mode: null,
          title: '',
          domain: null,
          domain_confidence: 0,
          domain_confirmed: false,
          duration_minutes: 45,
          isClassifying: false,
        },
      },
      options: [],
      selectedOption: null,
      tunedTasks: [],
      removedTaskIds: [],
      step4: {
        isRearranging: false,
      },
    };
    document.getElementById('plan-modal-overlay').classList.add('is-visible');
    this.renderStep(1);
    this.updateStepIndicator();
    // 自动加载步骤1
    this.loadStep1();
  },

  // 关闭弹层
  close() {
    document.getElementById('plan-modal-overlay').classList.remove('is-visible');
  },

  // 更新步骤指示器
  updateStepIndicator() {
    const items = document.querySelectorAll('#plan-steps-bar .step-item');
    const connectors = document.querySelectorAll('#plan-steps-bar .step-connector');
    items.forEach(item => {
      const step = parseInt(item.dataset.step);
      item.classList.remove('active', 'done');
      const dot = item.querySelector('.step-dot');
      if (step < this.currentStep) {
        item.classList.add('done');
        dot.innerHTML = '<i class="ti ti-check" style="font-size:14px;"></i>';
      } else if (step === this.currentStep) {
        item.classList.add('active');
        dot.textContent = step;
      } else {
        dot.textContent = step;
      }
    });
    connectors.forEach(conn => {
      const idx = parseInt(conn.dataset.connector);
      conn.classList.toggle('done', idx < this.currentStep);
    });
  },

  // 更新底部按钮状态
  updateFooter() {
    const backBtn = document.getElementById('plan-btn-back');
    const nextBtn = document.getElementById('plan-btn-next');
    const cancelBtn = document.getElementById('plan-btn-cancel');

    backBtn.style.display = this.currentStep > 1 ? 'flex' : 'none';

    // 各步骤的下一步按钮文本和可用状态
    const stepConfig = {
      1: { text: '读取中...', disabled: true, show: true },
      2: { text: '生成方案', disabled: !this.canProceedStep2().ok },
      3: { text: '下一步', disabled: !this.data.selectedOption },
      4: { text: '下一步', disabled: false },
      5: { text: '确认写入', disabled: false },
    };
    const cfg = stepConfig[this.currentStep];
    if (cfg) {
      nextBtn.textContent = cfg.text;
      nextBtn.disabled = cfg.disabled;
      nextBtn.style.display = cfg.show === false ? 'none' : 'flex';
    }

    // 取消按钮在最后一步变成"返回修改"
    if (this.currentStep === 5) {
      cancelBtn.textContent = '返回修改';
    } else {
      cancelBtn.textContent = '取消';
    }
  },

  // 步骤2是否可以继续 - 完整校验
  canProceedStep2() {
    const c = this.data.conditions;
    const s2 = this.data.step2;

    // 1. 结束时间已设置
    if (!c.end_time) return { ok: false, reason: '请设置今日结束时间' };

    // 2. 精力状态已选择（包括"不确定"）
    if (!c.energy_level) return { ok: false, reason: '请先选择精力状态' };

    // 3. 必做事项已确认（要么有事项，要么确认了"今天没有"）
    const hasMustDo = s2.mustDoItems.length > 0;
    if (!hasMustDo && !s2.mustDoConfirmedEmpty) {
      return { ok: false, reason: '请添加必做事项或确认今天没有' };
    }

    // 4. 所有新建的必做事项都有 domain
    const hasNoDomain = s2.mustDoItems.some(m => m.source === 'custom' && !m.domain_id);
    if (hasNoDomain) return { ok: false, reason: '部分必做事项还未选择领域' };

    // 5. 所有必做事项都有预计时间
    const hasNoDuration = s2.mustDoItems.some(m => !m.duration_minutes && !m.estimated_minutes);
    if (hasNoDuration) return { ok: false, reason: '部分必做事项缺少预计时间' };

    return { ok: true, reason: '' };
  },

  // 渲染当前步骤
  renderStep(step) {
    const body = document.getElementById('plan-modal-body');
    const title = document.getElementById('plan-modal-title');

    switch (step) {
      case 1:
        title.textContent = 'AI 规划助手';
        body.innerHTML = `
          <div class="step-loading">
            <div class="loading-spinner"></div>
            <div class="loading-text">正在读取今日信息...</div>
            <div class="loading-sub">获取任务、固定事件、习惯与可用时间</div>
          </div>
        `;
        break;
      case 2:
        title.textContent = '确认关键条件';
        this.renderStep2(body);
        break;
      case 3:
        title.textContent = '选择规划方案';
        this.renderStep3(body);
        break;
      case 4:
        title.textContent = '方案微调';
        this.renderStep4(body);
        break;
      case 5:
        title.textContent = '确认写入今日计划';
        this.renderStep5(body);
        break;
    }
    this.updateFooter();
  },

  // ===== 步骤 1: 读取今日信息 =====
  async loadStep1() {
    try {
      const res = await API.get('/api/plan/today-info');
      if (res) {
        this.data.todayInfo = res;
        // 【新增】规范化数据字段，统一后端不同命名风格
        this.normalizeTodayInfo(res);
        // 【新增】补充缺失字段的默认值（仅格式规范化，不注入假数据）
        this.fillMissingData(res);
        // 设置默认主目标
        if (!this.data.conditions.main_goal && res.suggested_main_goal) {
          this.data.conditions.main_goal = res.suggested_main_goal;
        }
        // 【新增】初始化步骤2的默认选中状态
        this.initStep2Defaults(res);
        // 短暂展示后自动进入下一步
        setTimeout(() => {
          this.goToStep(2);
        }, 800);
      } else {
        this.showStep1Error('读取失败，请检查网络');
      }
    } catch (e) {
      this.showStep1Error('读取失败: ' + e.message);
    }
  },

  // 【新增】规范化 todayInfo 数据字段，统一后端不同命名风格
  normalizeTodayInfo(info) {
    if (!info) return info;

    // 候选目标：把 estimated_hours 转成 estimated_minutes
    if (info.candidate_goals && info.candidate_goals.length) {
      info.candidate_goals = info.candidate_goals.map(g => {
        if (g.estimated_hours !== undefined && g.estimated_minutes === undefined) {
          g.estimated_minutes = Math.round(g.estimated_hours * 60);
        }
        if (g.estimated_minutes === undefined) {
          g.estimated_minutes = 60; // 默认 1 小时
        }
        // source 字段美化
        if (g.source === 'from_task') g.source = '待办任务';
        else if (g.source === 'from_canvas') g.source = '画布目标';
        else if (g.source === 'from_ai') g.source = 'AI 推荐';
        return g;
      });
    }

    // 必做事项：把 estimated_minutes 统一成 duration_minutes（前端用）
    if (info.must_do_actions && info.must_do_actions.length) {
      info.must_do_actions = info.must_do_actions.map(a => {
        if (a.estimated_minutes !== undefined && a.duration_minutes === undefined) {
          a.duration_minutes = a.estimated_minutes;
        }
        if (a.duration_minutes === undefined) {
          a.duration_minutes = 30; // 默认 30 分钟
        }
        return a;
      });
    }

    // 目标拆解：把 breakdown_logic 转成 logic，steps 统一格式
    if (info.goal_breakdown_suggestion) {
      const bd = info.goal_breakdown_suggestion;
      if (bd.breakdown_logic !== undefined && bd.logic === undefined) {
        bd.logic = bd.breakdown_logic;
      }
      // steps 如果是字符串数组，转成对象数组
      if (bd.steps && bd.steps.length && typeof bd.steps[0] === 'string') {
        bd.steps = bd.steps.map((s, i) => ({ index: i + 1, title: s }));
      }
    }

    // 候选行动：统一字段名
    if (info.candidate_actions && info.candidate_actions.length) {
      info.candidate_actions = info.candidate_actions.map(a => {
        if (a.estimated_minutes === undefined) a.estimated_minutes = 20;
        if (a.cognitive_load === undefined) a.cognitive_load = 'light';
        // 补充类型信息（中文名、颜色）
        if (a.type) {
          const tInfo = getTypeInfo(a.type);
          a.type_name = tInfo.name;
          a.type_color = tInfo.color;
        } else {
          // 旧数据无 type 字段，标记为待分类（不再默认工作类）
          a.type = null;
          a.type_name = '待分类';
          a.type_color = '#9CA3AF';
        }
        return a;
      });
    }

    // 候选目标：补充类型/分类信息
    if (info.candidate_goals && info.candidate_goals.length) {
      info.candidate_goals = info.candidate_goals.map(g => {
        // 如果没有 type，根据 type_breakdown 的主类型或标题推断
        if (!g.type) {
          if (g.type_breakdown && Array.isArray(g.type_breakdown) && g.type_breakdown.length > 0) {
            g.type = g.type_breakdown[0].type || g.type_breakdown[0].type_key || 'deep_work';
          }
        }
        return g;
      });
    }

    // 必做事项：补充类型信息
    if (info.must_do_actions && info.must_do_actions.length) {
      info.must_do_actions = info.must_do_actions.map(a => {
        if (a.type) {
          const tInfo = getTypeInfo(a.type);
          a.type_name = tInfo.name;
          a.type_color = tInfo.color;
        } else {
          // 旧数据无 type，根据标题简单推断，推断不出则标记待分类
          const title = (a.title || '').toLowerCase();
          let inferredType = null;
          if (title.includes('会') || title.includes('meeting')) inferredType = 'meeting';
          else if (title.includes('饭') || title.includes('餐') || title.includes('午')) inferredType = 'meal';
          else if (title.includes('休息') || title.includes('放松')) inferredType = 'rest';
          else if (title.includes('学习') || title.includes('读书') || title.includes('阅读')) inferredType = 'learning';
          else if (title.includes('运动') || title.includes('跑步') || title.includes('健身')) inferredType = 'exercise';
          if (inferredType) {
            a.type = inferredType;
            a.type_name = getTypeInfo(inferredType).name;
            a.type_color = getTypeInfo(inferredType).color;
          } else {
            a.type = null;
            a.type_name = '待分类';
            a.type_color = '#9CA3AF';
          }
        }
        return a;
      });
    }

    // 统一 type_breakdown 格式（如果顶层有）
    if (info.type_breakdown && Array.isArray(info.type_breakdown)) {
      info.type_breakdown = info.type_breakdown.map(tb => {
        const typeKey = tb.type || tb.type_key || 'deep_work';
        const tInfo = getTypeInfo(typeKey);
        return {
          type: typeKey,
          name: tb.name || tInfo.name,
          color: tb.color || tInfo.color,
          minutes: tb.minutes || tb.duration_minutes || 0,
          pct: tb.pct != null ? tb.pct : null,
        };
      });
    }

    return info;
  },

  // 【新增】规范化方案数据：给每个任务补充类型颜色和中文名，统一 type_breakdown 格式
  normalizeOptions(options) {
    if (!options || !options.length) return options;
    options.forEach(opt => {
      // 规范化任务列表
      if (opt.tasks && opt.tasks.length) {
        opt.tasks = opt.tasks.map(t => {
          const tInfo = getTypeInfo(t.type);
          t.type_name = tInfo.name;
          t.type_color = tInfo.color;
          // 统一 duration 字段
          if (t.duration === undefined && t.duration_minutes !== undefined) {
            t.duration = t.duration_minutes;
          }
          if (t.duration === undefined) {
            t.duration = 30; // 默认 30 分钟
          }
          return t;
        });
      }
      // 规范化 type_breakdown
      if (opt.type_breakdown && Array.isArray(opt.type_breakdown)) {
        opt.type_breakdown = opt.type_breakdown.map(tb => {
          const typeKey = tb.type || tb.type_key || 'deep_work';
          const tInfo = getTypeInfo(typeKey);
          return {
            type: typeKey,
            name: tb.name || tInfo.name,
            color: tb.color || tInfo.color,
            minutes: tb.minutes || tb.duration_minutes || 0,
            pct: tb.pct != null ? tb.pct : null,
          };
        });
        // 如果没有 pct，计算一下
        const total = opt.type_breakdown.reduce((s, b) => s + b.minutes, 0);
        if (total > 0 && opt.type_breakdown.some(b => b.pct == null)) {
          opt.type_breakdown.forEach(b => { b.pct = Math.round(b.minutes / total * 100); });
        }
      }
    });
    return options;
  },

  // 【新增】补充缺失字段的默认值（仅格式规范化，不注入假数据）
  // 空数据时保持空，由各模块自行展示空状态
  fillMissingData(info) {
    if (!info) return;

    // 确保候选目标数组存在（空数组也保留）
    if (!info.candidate_goals) info.candidate_goals = [];

    // 确保必做事项数组存在（空数组也保留）
    if (!info.must_do_actions) info.must_do_actions = [];

    // 确保候选行动数组存在（空数组也保留）
    if (!info.candidate_actions) info.candidate_actions = [];

    // 确保固定事件数组存在
    if (!info.fixed_events) info.fixed_events = [];

    // 确保今日习惯数组存在
    if (!info.today_habits) info.today_habits = [];

    // 目标拆解建议不存在就留空，不伪造
    if (!info.goal_breakdown_suggestion) info.goal_breakdown_suggestion = null;

    // 确保 suggested_main_goal 存在（空字符串表示无）
    if (info.suggested_main_goal === undefined) info.suggested_main_goal = '';
  },

  // 【新增】初始化步骤2的默认选中状态
  initStep2Defaults(info) {
    const s2 = this.data.step2;
    const cond = this.data.conditions;

    // 默认选中优先级最高的 1-2 个目标
    const goals = info.candidate_goals || [];
    s2.selectedGoals = goals.slice(0, Math.min(2, goals.length)).map(g => g.id);

    // 设置主目标 = 第一个选中的目标
    if (s2.selectedGoals.length > 0 && goals.length > 0) {
      const firstGoal = goals.find(g => g.id === s2.selectedGoals[0]);
      if (firstGoal) {
        cond.main_goal = firstGoal.title;
      }
    }

    // 统一必做事项数组（带 source 字段）- 从后端 must_do_actions 来
    s2.mustDoItems = (info.must_do_actions || []).map(a => ({
      ...a,
      source: 'existing',  // 来自后端的已有必做事项
      checked: true,
      duration_minutes: a.duration_minutes || a.estimated_minutes || 30,
    }));

    // 如果后端返回了必做事项，自动认为已确认（不是空）
    s2.mustDoConfirmedEmpty = s2.mustDoItems.length === 0 ? false : false;

    // 今日习惯：默认全部勾选
    const habits = info.today_habits || [];
    s2.selectedHabitIds = habits.map(h => h.id);

    // 拆解默认未确认
    s2.breakdownConfirmed = false;
    s2.breakdownMode = 'confirm';

    // 默认结束时间 23:00
    if (!cond.end_time) cond.end_time = 23.0;
    // 精力状态：不设默认，必须用户选择
    // 计划强度：默认适中
    if (!cond.planning_intensity) cond.planning_intensity = 'balanced';
  },

  showStep1Error(msg) {
    const body = document.getElementById('plan-modal-body');
    body.innerHTML = `
      <div class="step-loading">
        <i class="ti ti-alert-circle" style="font-size:48px;color:#F56565;"></i>
        <div class="loading-text">${escapeHtml(msg)}</div>
        <button class="btn-primary" onclick="PlanFlow.loadStep1()">重试</button>
      </div>
    `;
  },

  // ===== 步骤 2: 确认关键条件（重构版 - 完整条件面板）=====
  renderStep2(body) {
    const info = this.data.todayInfo || {};
    const cond = this.data.conditions;
    const s2 = this.data.step2;
    const candidateGoals = info.candidate_goals || [];
    const mustDoItems = s2.mustDoItems || [];
    const fixedEvents = info.fixed_events || [];
    const todayHabits = info.today_habits || [];
    const validation = this.canProceedStep2();

    // 计算可用时间（结束时间 - 固定事件总时长 - 当前时间）
    const availableMinutes = this.computeAvailableMinutes();

    body.innerHTML = `
      <!-- 缺失信息提示 -->
      ${!validation.ok ? `
        <div class="missing-info-banner">
          <i class="ti ti-info-circle"></i>
          <span>${escapeHtml(validation.reason)}</span>
        </div>
      ` : ''}

      <!-- A. 时间条件 -->
      <div class="step2-module">
        <div class="module-header">
          <div>
            <div class="module-title">
              <span class="module-icon" style="background:#E0F2FE;color:#0284C7;"><i class="ti ti-clock"></i></span>
              时间条件
            </div>
            <div class="module-subtitle">设置今日可规划时间范围</div>
          </div>
          <span class="module-badge" style="background:#E0F2FE;color:#0284C7;">A</span>
        </div>
        <div class="time-condition-row">
          <div class="time-condition-item">
            <div class="tc-label">今日可规划到</div>
            <div class="tc-value">
              <select class="end-time-select" id="end-time-select">
                ${[20, 21, 22, 23, 24].map(h => `
                  <option value="${h}" ${Math.floor(cond.end_time) === h ? 'selected' : ''}>${h}:00</option>
                `).join('')}
              </select>
            </div>
          </div>
          <div class="time-condition-item">
            <div class="tc-label">当前可用时间</div>
            <div class="tc-value available">
              <strong>${availableMinutes >= 60 ? Math.floor(availableMinutes / 60) + 'h ' : ''}${availableMinutes % 60}m</strong>
              <span class="tc-hint">结束时间 - 固定事件</span>
            </div>
          </div>
        </div>
      </div>

      <!-- B. 固定事件 -->
      <div class="step2-module">
        <div class="module-header">
          <div>
            <div class="module-title">
              <span class="module-icon" style="background:#F3E8FF;color:#7C3AED;"><i class="ti ti-calendar-event"></i></span>
              固定事件
            </div>
            <div class="module-subtitle">已有 ${fixedEvents.length} 个已安排的固定事件</div>
          </div>
          <span class="module-badge" style="background:#F3E8FF;color:#7C3AED;">B</span>
        </div>
        ${fixedEvents.length === 0 ? `
          <div class="empty-state-small">
            <span class="empty-text">暂无固定事件</span>
          </div>
        ` : `
          <div class="fixed-event-list">
            ${fixedEvents.slice(0, 6).map(e => {
              const startTime = e.start_time || e.startTime || '';
              const endTime = e.end_time || e.endTime || '';
              const timeStr = startTime && endTime ? `${startTime} - ${endTime}` : (startTime || '时间待定');
              const typeInfo = e.type ? getTypeInfo(e.type) : null;
              return `
                <div class="fixed-event-item">
                  <span class="fe-time">${timeStr}</span>
                  <span class="fe-title">${escapeHtml(e.title || '未命名事件')}</span>
                  ${typeInfo ? `<span class="fe-tag" style="background:${typeInfo.bg};color:${typeInfo.fg};">${typeInfo.name}</span>` : ''}
                </div>
              `;
            }).join('')}
            ${fixedEvents.length > 6 ? `
              <div class="fe-more">还有 ${fixedEvents.length - 6} 个固定事件</div>
            ` : ''}

      <!-- D. 今日习惯 -->

          <div class="habit-list">

              return `

      <!-- E. 精力状态 -->
      <div class="step2-module">
        <div class="module-header">
          <div>
            <div class="module-title">
              <span class="module-icon" style="background:#FCE7F3;color:#DB2777;"><i class="ti ti-battery"></i></span>
              精力状态
            </div>
            <div class="module-subtitle">选择你今天的精力水平</div>
          </div>
          <span class="module-badge" style="background:#FCE7F3;color:#DB2777;">E</span>
        </div>
        <div class="energy-options">
          <button class="energy-option ${cond.energy_level === 'low' ? 'selected' : ''}" data-energy="low">

            <div class="energy-icon">⚡</div>
            <div class="energy-label">一般</div>
            <div class="energy-desc">正常节奏</div>
          </button>
          <button class="energy-option ${cond.energy_level === 'high' ? 'selected' : ''}" data-energy="high">
            <div class="energy-icon">🔥</div>
            <div class="energy-label">充足</div>
            <div class="energy-desc">可以多安排</div>
          </button>

            <div class="energy-icon">❓</div>
            <div class="energy-label">不确定</div>

      <div class="step2-module">
        <div class="module-header">
          <div>

              <span class="module-icon" style="background:#FEF3C7;color:#D97706;"><i class="ti ti-gauge"></i></span>
              计划强度
            </div>
            <div class="module-subtitle">选择今日计划的松紧程度</div>
          </div>
          <span class="module-badge" style="background:#FEF3C7;color:#D97706;">F</span>
        </div>
        <div class="intensity-options">
          <button class="intensity-option ${cond.planning_intensity === 'safe' ? 'selected' : ''}" data-intensity="safe">
            <div class="intensity-name">轻松</div>
            <div class="intensity-desc">稳妥为主，留足缓冲</div>
          </button>
          <button class="intensity-option ${cond.planning_intensity === 'balanced' ? 'selected' : ''}" data-intensity="balanced">
            <div class="intensity-name">适中</div>
            <div class="intensity-desc">平衡效率和弹性</div>
          </button>
          <button class="intensity-option ${cond.planning_intensity === 'sprint' ? 'selected' : ''}" data-intensity="sprint">
            <div class="intensity-name">紧张</div>
            <div class="intensity-desc">冲刺模式，最大化产出</div>

        </div>
      </div>
    `;

    // 绑定事件
    this.bindStep2Events();
  },

  // ===== 渲染添加必做事项面板 =====
  renderAddMustDoPanel() {
    const s2 = this.data.step2;
    const adding = s2.addingMustDo;
    const info = this.data.todayInfo || {};
    const candidates = info.candidate_actions || [];

    if (adding.mode === 'select') {
      // 从已有行动中选择
      const existingIds = new Set(s2.mustDoItems.map(m => m.id));
      const available = candidates.filter(c => !existingIds.has(c.id));

      return `
        <div class="add-mustdo-panel">
          <div class="add-mustdo-header">
            <span class="add-mustdo-title">从已有行动中选择</span>
            <button class="text-btn" onclick="PlanFlow.cancelAddMustDo()">取消</button>
          </div>
          ${available.length === 0 ? `
            <div class="empty-state-small">
              <span class="empty-text">暂无可选的候选行动</span>
            </div>
          ` : `
            <div class="candidate-select-list">
              ${available.slice(0, 10).map(c => {
                const typeInfo = getTypeInfo(c.type);
                const duration = c.duration || c.estimated_minutes || 20;
                return `
                  <div class="candidate-select-item" data-candidate-id="${c.id}">
                    <div class="cs-checkbox"><i class="ti ti-check"></i></div>
                    <div class="cs-info">
                      <div class="cs-title">${escapeHtml(c.title)}</div>
                      <div class="cs-meta">
                        ${typeInfo ? `<span style="color:${typeInfo.fg};background:${typeInfo.bg};padding:1px 6px;border-radius:4px;font-size:11px;">${typeInfo.name}</span>` : ''}
                        <span>${duration}分钟</span>
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
            <div class="add-mustdo-footer">
              <button class="btn-primary btn-sm" onclick="PlanFlow.confirmSelectMustDo()">确认添加选中项</button>
            </div>
          `}
        </div>
      `;
    }

    // 直接新建模式
    const domainInfo = adding.domain ? getDomainInfo(adding.domain) : null;
    const confidence = adding.domain_confidence || 0;
    const showDomainPicker = !adding.domain_confirmed && confidence < 0.75;
    const lowConfidence = confidence < 0.45;

    return `
      <div class="add-mustdo-panel">
        <div class="add-mustdo-header">
          <span class="add-mustdo-title">添加必做事项</span>
          <button class="text-btn" onclick="PlanFlow.cancelAddMustDo()">取消</button>
        </div>

        <div class="add-mustdo-input-row">
          <input type="text" class="add-mustdo-input" id="mustdo-title-input"
            placeholder="输入必做事项标题..." value="${escapeHtml(adding.title)}"
            ${adding.isClassifying ? 'disabled' : ''}>
          ${adding.isClassifying ? '<div class="classifying-loading">识别中...</div>' : ''}
        </div>

        ${adding.title && !adding.isClassifying ? `
          <div class="domain-identify-section">
            ${confidence >= 0.75 && domainInfo ? `
              <div class="domain-high-confidence">
                <span class="di-label">已识别为：</span>
                <span class="di-domain" style="color:${domainInfo.color};">${domainInfo.icon} ${domainInfo.name}</span>
                <button class="text-btn" onclick="PlanFlow.showDomainPicker()">可修改</button>
              </div>
            ` : confidence >= 0.45 && domainInfo ? `
              <div class="domain-medium-confidence">
                <span class="di-label">推荐领域：</span>
                <span class="di-domain" style="color:${domainInfo.color};">${domainInfo.icon} ${domainInfo.name}</span>
                <button class="btn-primary btn-xs" onclick="PlanFlow.confirmDomain()">确认</button>
                <button class="text-btn" onclick="PlanFlow.showDomainPicker()">换一个</button>
              </div>
            ` : lowConfidence ? `
              <div class="domain-low-confidence">
                <i class="ti ti-help-circle" style="color:#F59E0B;"></i>
                <span>还不能确定属于哪个领域，请先选择类型</span>
              </div>
              <div class="domain-picker-grid">
                ${Object.entries(DOMAIN_MAP).map(([key, d]) => `
                  <button class="domain-picker-item" data-domain="${key}">
                    <span class="dp-icon">${d.icon}</span>
                    <span class="dp-name">${d.name}</span>
                  </button>
                `).join('')}
              </div>
            ` : ''}
          </div>

          <div class="duration-select-section">
            <span class="ds-label">预计时间：</span>
            <div class="duration-options">
              ${[15, 30, 45, 60, 90].map(m => `
                <button class="duration-option ${adding.duration_minutes === m ? 'selected' : ''}"
                  data-duration="${m}">${m}分钟</button>
              `).join('')}
            </div>
          </div>

          <div class="add-mustdo-footer">
            <button class="btn-primary btn-sm" onclick="PlanFlow.saveCustomMustDo()"
              ${(adding.domain && adding.domain_confirmed) || confidence >= 0.75 ? '' : 'disabled'}>
              添加到必做
            </button>
          </div>
        ` : ''}
      </div>
    `;
  },

  // ===== 计算可用时间 =====
  computeAvailableMinutes() {
    const cond = this.data.conditions;
    const info = this.data.todayInfo || {};
    const now = new Date();
    const currentHour = now.getHours() + now.getMinutes() / 60;
    const endHour = cond.end_time || 23;

    // 如果当前时间已经超过结束时间，返回 0
    if (currentHour >= endHour) return 0;

    let totalMinutes = (endHour - currentHour) * 60;

    // 减去固定事件时长（只计算在当前时间之后的）
    const fixedEvents = info.fixed_events || [];
    fixedEvents.forEach(e => {
      const dur = e.duration_minutes || e.estimated_minutes || 0;
      totalMinutes -= dur;
    });

    return Math.max(0, Math.round(totalMinutes));
  },

  bindStep2Events() {
    const self = this;
    const info = this.data.todayInfo || {};

    // A. 结束时间选择
    const endTimeSelect = document.getElementById('end-time-select');
    if (endTimeSelect) {
      endTimeSelect.addEventListener('change', (e) => {
        self.data.conditions.end_time = parseFloat(e.target.value);
        self.updateFooter();
        // 刷新可用时间显示
        self.renderStep2(document.getElementById('plan-modal-body'));
      });
    }

    // C. 必做事项勾选
    document.querySelectorAll('#mustdo-list .mustdo-item').forEach(item => {
      item.addEventListener('click', (e) => {
        if (e.target.closest('.mustdo-delete') || e.target.closest('.mustdo-checkbox')) return;
        const idx = parseInt(item.dataset.mustdoIdx);
        self.toggleMustDoCheck(idx);
      });
    });

    // D. 习惯勾选
    document.querySelectorAll('.habit-item').forEach(item => {
      item.addEventListener('click', () => {
        const habitId = item.dataset.habitId;
        const idx = self.data.step2.selectedHabitIds.indexOf(habitId);
        if (idx > -1) {
          self.data.step2.selectedHabitIds.splice(idx, 1);
        } else {
          self.data.step2.selectedHabitIds.push(habitId);
        }
        self.renderStep2(document.getElementById('plan-modal-body'));
        self.updateFooter();
      });
    });

    // E. 精力状态选择
    document.querySelectorAll('.energy-option').forEach(btn => {
      btn.addEventListener('click', () => {
        self.data.conditions.energy_level = btn.dataset.energy;
        self.renderStep2(document.getElementById('plan-modal-body'));
        self.updateFooter();
      });
    });

    // F. 计划强度选择
    document.querySelectorAll('.intensity-option').forEach(btn => {
      btn.addEventListener('click', () => {
        self.data.conditions.planning_intensity = btn.dataset.intensity;
        self.renderStep2(document.getElementById('plan-modal-body'));
      });
    });

    // 标题输入框：自动触发领域识别
    const titleInput = document.getElementById('mustdo-title-input');
    if (titleInput) {
      titleInput.focus();
      // 光标定位到末尾
      titleInput.setSelectionRange(titleInput.value.length, titleInput.value.length);
      titleInput.addEventListener('input', (e) => {
        const val = e.target.value;
        self.data.step2.addingMustDo.title = val;
        // 防抖调用领域识别
        clearTimeout(self._classifyTimer);
        if (val.trim().length >= 2) {
          self._classifyTimer = setTimeout(() => {
            self.classifyDomain(val.trim());
          }, 500);
        }
      });
    }

    // 持续时间选择
    document.querySelectorAll('.duration-option').forEach(btn => {
      btn.addEventListener('click', () => {
        self.data.step2.addingMustDo.duration_minutes = parseInt(btn.dataset.duration);
        self.renderStep2(document.getElementById('plan-modal-body'));
      });
    });

    // 领域选择
    document.querySelectorAll('.domain-picker-item').forEach(btn => {
      btn.addEventListener('click', () => {
        self.selectDomain(btn.dataset.domain);
      });
    });

    // 候选行动选择（多选）
    document.querySelectorAll('.candidate-select-item').forEach(item => {
      item.addEventListener('click', () => {
        item.classList.toggle('selected');
      });
    });
  },

  // ===== 必做事项：开始添加 =====
  startAddMustDo(mode) {
    const s2 = this.data.step2;
    s2.addingMustDo = {
      active: true,
      mode: mode,        // 'direct' 或 'select'
      title: '',
      domain: null,
      domain_confidence: 0,
      domain_confirmed: false,
      duration_minutes: 45,
      isClassifying: false,
    };
    this.renderStep2(document.getElementById('plan-modal-body'));
  },

  // ===== 必做事项：取消添加 =====
  cancelAddMustDo() {
    this.data.step2.addingMustDo = {
      active: false,
      mode: null,
      title: '',
      domain: null,
      domain_confidence: 0,
      domain_confirmed: false,
      duration_minutes: 45,
      isClassifying: false,
    };
    this.renderStep2(document.getElementById('plan-modal-body'));
  },

  // ===== 必做事项：调用领域识别 API =====
  async classifyDomain(title) {
    const adding = this.data.step2.addingMustDo;
    if (!adding.active) return;

    adding.isClassifying = true;
    adding.domain = null;
    adding.domain_confidence = 0;
    adding.domain_confirmed = false;
    this.renderStep2(document.getElementById('plan-modal-body'));

    try {
      const res = await API.post('/api/plan/classify-domain', { title: title });
      if (res && res.domain) {
        adding.domain = res.domain;
        adding.domain_confidence = res.confidence || 0;
        // 高置信度自动确认
        if (res.confidence >= 0.75) {
          adding.domain_confirmed = true;
        }
      } else {
        // API 失败或无结果，保持低置信度状态
        adding.domain = null;
        adding.domain_confidence = 0;
      }
    } catch (e) {
      console.warn('领域识别失败:', e);
      adding.domain = null;
      adding.domain_confidence = 0;
    } finally {
      adding.isClassifying = false;
      this.renderStep2(document.getElementById('plan-modal-body'));
    }
  },

  // ===== 必做事项：手动选择领域 =====
  selectDomain(domain) {
    const adding = this.data.step2.addingMustDo;
    adding.domain = domain;
    adding.domain_confirmed = true;
    adding.domain_confidence = 1.0;
    this.renderStep2(document.getElementById('plan-modal-body'));
  },

  // ===== 必做事项：确认推荐领域 =====
  confirmDomain() {
    this.data.step2.addingMustDo.domain_confirmed = true;
    this.renderStep2(document.getElementById('plan-modal-body'));
  },

  // ===== 必做事项：显示领域选择器 =====
  showDomainPicker() {
    this.data.step2.addingMustDo.domain_confirmed = false;
    this.data.step2.addingMustDo.domain_confidence = 0;
    this.data.step2.addingMustDo.domain = null;
    this.renderStep2(document.getElementById('plan-modal-body'));
  },

  // ===== 必做事项：保存自定义必做事项 =====
  async saveCustomMustDo() {
    const adding = this.data.step2.addingMustDo;
    const title = adding.title.trim();
    if (!title) {
      showToast('请输入必做事项内容');
      return;
    }
    if (!adding.domain_confirmed && adding.domain_confidence < 0.75) {
      showToast('请先选择领域');
      return;
    }

    const newMust = {
      id: 'custom_must_' + Date.now(),
      title: title,
      domain_id: adding.domain,
      domain: adding.domain,
      duration_minutes: adding.duration_minutes,
      source: 'custom',
      checked: true,
      isMustDo: true,
    };

    // 尝试调用后端 API 创建
    try {
      const res = await API.post('/api/plan/must-do/create', {
        title: title,
        domain: adding.domain,
        duration_minutes: adding.duration_minutes,
      });
      if (res && res.id) {
        newMust.id = res.id;
        // 补充后端返回的其他字段
        if (res.domain_id) newMust.domain_id = res.domain_id;
        if (res.duration_minutes) newMust.duration_minutes = res.duration_minutes;
      }
    } catch (e) {
      console.warn('创建必做事项 API 失败，本地添加:', e);
    }

    this.data.step2.mustDoItems.push(newMust);
    // 重置添加状态
    this.data.step2.addingMustDo.active = false;
    // 如果之前确认了空，现在有了就取消确认
    this.data.step2.mustDoConfirmedEmpty = false;
    this.renderStep2(document.getElementById('plan-modal-body'));
    this.updateFooter();
    showToast('已添加必做事项');
  },

  // ===== 必做事项：从已有行动选择 - 确认 =====
  confirmSelectMustDo() {
    const selected = document.querySelectorAll('.candidate-select-item.selected');
    if (selected.length === 0) {
      showToast('请至少选择一个行动');
      return;
    }

    const info = this.data.todayInfo || {};
    const candidates = info.candidate_actions || [];

    selected.forEach(item => {
      const cid = item.dataset.candidateId;
      const action = candidates.find(c => c.id === cid);
      if (action) {
        this.data.step2.mustDoItems.push({
          ...action,
          id: action.id,
          title: action.title,
          domain_id: action.domain_id || action.domain,
          domain: action.domain || null,
          duration_minutes: action.duration_minutes || action.duration || action.estimated_minutes || 20,
          source: 'selected',
          checked: true,
          isMustDo: true,
        });
      }
    });

    // 关闭添加面板
    this.data.step2.addingMustDo.active = false;
    this.data.step2.mustDoConfirmedEmpty = false;
    this.renderStep2(document.getElementById('plan-modal-body'));
    this.updateFooter();
    showToast(`已添加 ${selected.length} 个必做事项`);
  },

  // ===== 必做事项：勾选/取消勾选 =====
  toggleMustDoCheck(idx) {
    const item = this.data.step2.mustDoItems[idx];
    if (item) {
      item.checked = item.checked === false ? true : false;
    }
    this.renderStep2(document.getElementById('plan-modal-body'));
  },

  // ===== 必做事项：删除 =====
  removeMustDoItem(idx) {
    this.data.step2.mustDoItems.splice(idx, 1);
    // 如果删光了，清空确认状态
    if (this.data.step2.mustDoItems.length === 0) {
      this.data.step2.mustDoConfirmedEmpty = false;
    }
    this.renderStep2(document.getElementById('plan-modal-body'));
    this.updateFooter();
    showToast('已删除');
  },

  // ===== 必做事项：确认今天没有 =====
  confirmNoMustDoToday() {
    this.data.step2.mustDoConfirmedEmpty = true;
    this.renderStep2(document.getElementById('plan-modal-body'));
    this.updateFooter();
    showToast('已确认今天没有必做事项');
  },

  // ===== 必做事项：取消确认空 =====
  unconfirmNoMustDo() {
    this.data.step2.mustDoConfirmedEmpty = false;
    this.renderStep2(document.getElementById('plan-modal-body'));
    this.updateFooter();
  },

  // ===== 步骤 3: 三种方案（增强版）=====
  renderStep3(body) {
    if (this.data.options.length === 0) {
      // 加载中
      body.innerHTML = `
        <div class="step-loading">
          <div class="loading-spinner"></div>
          <div class="loading-text">正在生成三种规划方案...</div>
          <div class="loading-sub">根据你的条件定制稳妥 / 平衡 / 冲刺方案</div>
        </div>
      `;
      this.generateOptions();
      return;
    }

    const options = this.data.options;
    const isRegenerating = this.data.step3 && this.data.step3.isRegenerating;

    body.innerHTML = `
      <!-- 顶部标题 + 重新生成按钮 -->
      <div class="step3-header">
        <div class="step3-header-title">
          为你生成了 <strong>${options.length} 种</strong>不同强度的规划方案，选择最适合今天状态的一个
        </div>
        <button class="btn-regenerate ${isRegenerating ? 'loading' : ''}" id="btn-regenerate" onclick="PlanFlow.regenerateOptions()">
          <i class="ti ti-refresh"></i>
          ${isRegenerating ? '重新生成中...' : '让 AI 再重新写一遍试试'}
        </button>
      </div>

      <div class="options-grid">
        ${options.map(opt => `
          <div class="option-card ${opt.style} option-card-enhanced ${this.data.selectedOption === opt.id ? 'selected' : ''}" data-id="${opt.id}">
            <span class="option-badge">${opt.style === 'safe' ? '推荐' : opt.style === 'balanced' ? '经典' : '挑战'}</span>
            <div class="option-name">${opt.name}</div>
            <div class="option-desc">${opt.description}</div>

            <!-- 【新增】方案亮点 -->
            <div class="option-highlights">
              <div class="highlight-title">方案亮点</div>
              <div class="highlight-list">
                ${(opt.highlights || this.getDefaultHighlights(opt.style)).map(h => `
                  <div class="highlight-item">
                    <i class="ti ti-check-circle-filled"></i>
                    <span>${escapeHtml(h)}</span>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- 【新增】任务类型分布 -->
            ${(function() {
              let breakdownItems = [];
              if (opt.type_breakdown && Array.isArray(opt.type_breakdown)) {
                // 后端直接返回 type_breakdown，统一格式
                breakdownItems = opt.type_breakdown.map(tb => {
                  const info = getTypeInfo(tb.type || tb.type_key);
                  return {
                    type: tb.type || tb.type_key || 'deep_work',
                    name: tb.name || info.name,
                    color: tb.color || info.color,
                    minutes: tb.minutes || tb.duration_minutes || 0,
                    pct: tb.pct != null ? tb.pct : 0,
                  };
                });
                // 如果没有 pct，计算一下
                const total = breakdownItems.reduce((s, b) => s + b.minutes, 0);
                if (total > 0 && breakdownItems.some(b => b.pct === 0)) {
                  breakdownItems.forEach(b => { b.pct = Math.round(b.minutes / total * 100); });
                }
                breakdownItems.sort((a, b) => b.minutes - a.minutes);
              } else if (opt.tasks && opt.tasks.length) {
                // 从 tasks 计算
                const bd = computeTypeBreakdown(opt.tasks);
                breakdownItems = bd.items;
              }
              return renderTypeBreakdownBar(breakdownItems, 5);
            }).call(this)}

            <!-- 【新增】为什么这样安排 -->
            <div class="option-reasoning">
              <strong>为什么这样安排？</strong><br>
              ${escapeHtml(opt.reasoning || this.getDefaultReasoning(opt.style))}
            </div>

            <!-- 【新增】适合什么情况 -->
            <div class="option-fit-tags">
              <div class="fit-tags-title">适合什么情况</div>
              <div class="fit-tags">
                ${(opt.fitSituations || this.getDefaultFitSituations(opt.style)).map(s => `
                  <span class="fit-tag">${escapeHtml(s)}</span>
                `).join('')}
              </div>
            </div>

            <div class="option-stats">
              <div class="stat-item">
                <span class="stat-label">行动数</span>
                <span class="stat-value">${opt.action_count}</span>
              </div>
              <div class="stat-item">
                <span class="stat-label">总安排</span>
                <span class="stat-value">${opt.total_hours}h</span>
              </div>
              <div class="stat-item">
                <span class="stat-label">缓冲时间</span>
                <span class="stat-value">${opt.buffer_minutes}m</span>
              </div>
              <div class="stat-item">
                <span class="stat-label">留白率</span>
                <span class="stat-value">${Math.round(opt.buffer_ratio * 100)}%</span>
              </div>
            </div>

            <!-- 【增强】风险详情 -->
            <div class="option-risks">
              <div class="risk-title">风险详情</div>
              ${(opt.detailed_risks || this.getDefaultDetailedRisks(opt)).map(r => `
                <div class="risk-detail-item">
                  <i class="ti ti-alert-triangle"></i>
                  <div><strong>${escapeHtml(r.title)}</strong>：${escapeHtml(r.detail)}</div>
                </div>
              `).join('')}
            </div>

            <!-- 【新增】生成依据（可展开/收起） -->
            <div class="option-basis" data-opt-id="${opt.id}">
              <div class="basis-toggle" onclick="PlanFlow.toggleBasis('${opt.id}')">
                <i class="ti ti-chevron-down basis-icon"></i>
                <span>生成依据</span>
              </div>
              <div class="basis-content" id="basis-content-${opt.id}" style="display:none;">
                ${this.renderBasisContent(opt)}
              </div>
            </div>

            <div class="option-actions">
              <button class="btn-detail" onclick="PlanFlow.viewOptionDetail('${opt.id}')">查看详情</button>
              <button class="btn-select-option" onclick="PlanFlow.selectOption('${opt.id}')">选择这个方案</button>
            </div>
          </div>
        `).join('')}
      </div>
    `;

    // 卡片点击选择
    body.querySelectorAll('.option-card').forEach(card => {
      card.addEventListener('click', (e) => {
        if (e.target.closest('button')) return;
        this.selectOption(card.dataset.id);
      });
    });
  },

  // 【新增】获取默认亮点（MVP 模拟数据）
  getDefaultHighlights(style) {
    const map = {
      safe: [
        '核心任务优先完成，不留尾巴',
        '留出充足休息和缓冲时间',
        '下午安排轻量任务，避免疲劳',
      ],
      balanced: [
        '深度工作与轻量任务交替进行',
        '重要事项安排在精力高峰时段',
        '兼顾学习成长与日常事务',
      ],
      sprint: [
        '高密度安排，最大化产出',
        '挑战性任务集中攻克',
        '用番茄工作法保持专注',
      ],
    };
    return map[style] || map.balanced;
  },

  // 【新增】获取默认安排理由（MVP 模拟数据）
  getDefaultReasoning(style) {
    const map = {
      safe: '考虑到你今天精力一般，我选择了保守策略。把最重要的 2-3 件事稳稳完成，中间穿插足够的休息和缓冲，避免因为安排太满而焦虑或拖延。上午做深度工作，下午处理杂事，节奏比较轻松。',
      balanced: '这是最经典的一日规划。上午和下午各安排一段深度工作，中间用会议和杂事调剂。学习成长类任务放在精力较好的时段，生活事务穿插其中。整体松紧适度，既能推进重要事项，也不会太累。',
      sprint: '如果你今天状态很好、想冲刺一把，这个方案会把可用时间用得比较满。高认知负荷的任务集中安排，用短休息快速回血。适合有明确截止日期、需要今天有大进展的情况。',
    };
    return map[style] || map.balanced;
  },

  // 【新增】获取默认适合场景（MVP 模拟数据）
  getDefaultFitSituations(style) {
    const map = {
      safe: ['精力一般', '任务不多', '想轻松一点', '周五下午'],
      balanced: ['正常工作日', '状态平稳', '事务较多', '周一到周四'],
      sprint: ['截止日临近', '精力充沛', '想挑战自己', '专注日'],
    };
    return map[style] || map.balanced;
  },

  // 【新增】获取默认详细风险（MVP 模拟数据）
  getDefaultDetailedRisks(opt) {
    const style = opt.style;
    if (style === 'safe') {
      return [
        { title: '产出较少', detail: '由于安排偏保守，今天的总产出量可能只有平时的 70% 左右，部分次要任务可能顺延。' },
        { title: '节奏偏慢', detail: '缓冲和休息较多，如果中途进入状态后可能觉得节奏不够紧凑，容易走神。' },
      ];
    } else if (style === 'sprint') {
      return [
        { title: '容易疲劳', detail: '高密度安排对精力要求很高，下午 3-4 点可能出现明显疲惫，需要意志力坚持。' },
        { title: '容错率低', detail: '缓冲时间少，如果某个任务超时，后续安排可能整体后移，影响下班时间。' },
      ];
    } else {
      return [
        { title: '中规中矩', detail: '平衡方案没有明显短板，但也不会有特别突出的产出，适合常规工作日。' },
        { title: '切换成本', detail: '任务类型交替较多，如果深度工作进入状态慢，可能会损失一些效率。' },
      ];
    }
  },

  // 【新增】切换方案依据的展开/收起
  toggleBasis(optId) {
    const content = document.getElementById('basis-content-' + optId);
    const card = document.querySelector(`.option-basis[data-opt-id="${optId}"]`);
    const icon = card ? card.querySelector('.basis-icon') : null;
    if (content) {
      if (content.style.display === 'none') {
        content.style.display = 'block';
        if (icon) icon.style.transform = 'rotate(180deg)';
      } else {
        content.style.display = 'none';
        if (icon) icon.style.transform = 'rotate(0deg)';
      }
    }
  },

  // 【新增】渲染方案依据内容
  renderBasisContent(opt) {
    const cond = this.data.conditions;
    const s2 = this.data.step2;
    const info = this.data.todayInfo || {};
    const notes = [];

    // 从后端返回的全局 basis 读取（优先）
    const globalBasis = this.data.optionsBasis;
    if (globalBasis && Array.isArray(globalBasis) && globalBasis.length > 0) {
      return globalBasis.map(n => `
        <div class="basis-note-item">
          <i class="ti ti-point-filled" style="color:var(--accent);font-size:8px;"></i>
          <span>${escapeHtml(n)}</span>
        </div>
      `).join('');
    }

    // 从后端返回的 basis.notes 读取（单方案维度，兼容旧格式）
    const basis = opt.basis || (this.data.optionsBasis && this.data.optionsBasis[opt.id]) || null;
    if (basis && basis.notes && Array.isArray(basis.notes) && basis.notes.length > 0) {
      return basis.notes.map(n => `
        <div class="basis-note-item">
          <i class="ti ti-point-filled" style="color:var(--accent);font-size:8px;"></i>
          <span>${escapeHtml(n)}</span>
        </div>
      `).join('');
    }

    // 后端没有返回时，根据上下文动态生成依据
    // 时间条件
    const endHour = Math.floor(cond.end_time);
    notes.push(`结束时间：${endHour}:00`);

    // 精力状态
    const energyMap = { low: '精力较低', normal: '精力一般', high: '精力充足', uncertain: '精力不确定' };
    notes.push(`精力状态：${energyMap[cond.energy_level] || '未读取到精力状态'}`);

    // 计划强度
    const intensityMap = { safe: '轻松（稳妥）', balanced: '适中（平衡）', sprint: '紧张（冲刺）' };
    notes.push(`计划强度：${intensityMap[cond.planning_intensity] || '适中'}`);

    // 必做事项
    const mustDoCount = s2.mustDoItems ? s2.mustDoItems.filter(m => m.checked !== false).length : 0;
    if (s2.mustDoConfirmedEmpty) {
      notes.push('必做事项：已确认今天没有必做事项');
    } else if (mustDoCount > 0) {
      notes.push(`必做事项：${mustDoCount} 件`);
    } else {
      notes.push('必做事项：未读取到必做事项');
    }

    // 固定事件
    const fixedCount = (info.fixed_events || []).length;
    if (fixedCount > 0) {
      notes.push(`固定事件：${fixedCount} 个`);
    } else {
      notes.push('固定事件：未读取到固定事件');
    }

    // 习惯
    const habitCount = (s2.selectedHabitIds || []).length;
    if (habitCount > 0) {
      notes.push(`今日习惯：纳入 ${habitCount} 个`);
    } else {
      notes.push('今日习惯：未纳入习惯');
    }

    // 主目标
    if (cond.main_goal && cond.main_goal !== '__none__') {
      notes.push(`主目标：${cond.main_goal}`);
    } else {
      notes.push('主目标：未设置主目标');
    }

    return notes.map(n => `
      <div class="basis-note-item">
        <i class="ti ti-point-filled" style="color:var(--accent);font-size:8px;"></i>
        <span>${escapeHtml(n)}</span>
      </div>
    `).join('');
  },

  async generateOptions() {
    try {
      // 使用完整的规划上下文
      const context = this.buildPlanContext();

      const res = await API.post('/api/plan/options', context);
      if (res && res.options) {
        this.data.options = res.options;
        // 保存方案依据（如果有）
        this.data.optionsBasis = res.basis || null;
        // 规范化方案数据：补充类型信息
        this.normalizeOptions(this.data.options);
        this.renderStep3(document.getElementById('plan-modal-body'));
      } else {
        showToast('方案生成失败，请重试');
      }
    } catch (e) {
      showToast('方案生成失败: ' + e.message);
    }
  },

  // 【新增】重新生成方案
  async regenerateOptions() {
    const btn = document.getElementById('btn-regenerate');
    if (btn) {
      btn.classList.add('loading');
      btn.querySelector('i').style.animation = 'spin 1s linear infinite';
    }
    if (!this.data.step3) this.data.step3 = {};
    this.data.step3.isRegenerating = true;
    showToast('AI 正在重新生成方案...');

    try {
      // 使用完整规划上下文 + 重新生成标记
      const context = this.buildPlanContext();
      context.previous_options = this.data.options.map(o => o.id);
      context.regenerate = true;

      const res = await API.post('/api/plan/regenerate', context);
      if (res && res.options) {
        this.data.options = res.options;
        this.data.optionsBasis = res.basis || null;
        // 规范化方案数据：补充类型信息
        this.normalizeOptions(this.data.options);
        this.data.selectedOption = null;
        this.renderStep3(document.getElementById('plan-modal-body'));
        this.updateFooter();
        showToast('已重新生成方案');
      } else {
        showToast('重新生成失败，请重试');
        this.data.step3.isRegenerating = false;
        this.renderStep3(document.getElementById('plan-modal-body'));
      }
    } catch (e) {
      showToast('重新生成失败: ' + e.message);
      this.data.step3.isRegenerating = false;
      this.renderStep3(document.getElementById('plan-modal-body'));
    }
  },

  selectOption(optionId) {
    this.data.selectedOption = optionId;
    const option = this.data.options.find(o => o.id === optionId);
    if (option) {
      // 初始化微调数据
      this.data.tunedTasks = [...option.tasks];
      this.data.removedTaskIds = [];
    }
    // 更新UI
    document.querySelectorAll('.option-card').forEach(card => {
      card.classList.toggle('selected', card.dataset.id === optionId);
    });
    this.updateFooter();
  },

  viewOptionDetail(optionId) {
    const option = this.data.options.find(o => o.id === optionId);
    if (!option) return;
    const tasks = option.tasks || [];
    const taskList = tasks.map(t => {
      const d = new Date(t.startTime);
      const time = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      return `${time} - ${t.title} (${t.duration}分钟)`;
    }).join('\n');
    alert(`${option.name} 方案详情：\n\n${taskList}\n\n缓冲: ${option.buffer_minutes}分钟\n风险: ${option.risks.join('、')}`);
  },

  // ===== 步骤 4: 方案微调（增强版）=====
  renderStep4(body) {
    const option = this.data.options.find(o => o.id === this.data.selectedOption);
    if (!option) return;

    const tasks = this.data.tunedTasks;
    const activeTasks = tasks.filter(t => !this.data.removedTaskIds.includes(t.id));
    const removedTasks = tasks.filter(t => this.data.removedTaskIds.includes(t.id));
    const isRearranging = this.data.step4 && this.data.step4.isRearranging;

    // 计算类型分布（实时）
    const typeBreakdown = computeTypeBreakdown(activeTasks);

    body.innerHTML = `
      <!-- 顶部工具栏 -->
      <div class="step4-toolbar">
        <div class="step4-actions-left">
          <button class="btn-add-action" onclick="PlanFlow.showCandidateActions()">
            <i class="ti ti-plus"></i> 添加行动
          </button>
        </div>
        <div class="step4-title" style="font-size:14px;font-weight:600;color:var(--text-primary);">
          <i class="ti ti-adjustments" style="color:var(--accent);margin-right:4px;"></i>
          ${option.name}方案 · 时间轴预览
        </div>
        <div style="width:120px;"></div>
      </div>

      <div style="font-size:12.5px;color:var(--text-muted);margin-bottom:14px;">
        可以删除不需要的行动、添加新行动，然后让 AI 重新安排剩余时间
      </div>

      <!-- 主内容区：时间轴 + 右侧类型统计 -->
      <div class="step4-main-row">
        <!-- 时间轴 -->
        <div class="step4-timeline-wrap">
          <div class="tune-timeline" id="tune-timeline">
            ${activeTasks.map((t, idx) => {
              const d = new Date(t.startTime);
              const time = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
              const endD = new Date(t.startTime + t.duration * 60000);
              const endTime = `${String(endD.getHours()).padStart(2,'0')}:${String(endD.getMinutes()).padStart(2,'0')}`;
              const typeInfo = getTypeInfo(t.type);
              const cogLabel = { deep: '深度', medium: '中等', light: '轻松' }[t.cognitiveLoad || t.cognitive_load] || '中等';
              return `
                <div class="tune-task-item" data-id="${t.id}" data-idx="${idx}">
                  <div class="tune-task-time">${time} - ${endTime}</div>
                  <div class="tune-task-bar" style="background:${typeInfo.color};"></div>
                  <div class="tune-task-info">
                    <div class="tune-task-name">
                      <span class="task-type-tag" style="background:${typeInfo.bg};color:${typeInfo.fg};">
                        <span class="type-icon">${typeInfo.icon}</span>${typeInfo.name}
                      </span>
                      ${escapeHtml(t.title)}
                    </div>
                    <div class="tune-task-meta">${t.duration}分钟 · ${cogLabel}认知负荷 · ${t.priority === 'high' ? '高优' : t.priority === 'low' ? '低优' : '中优'}</div>
                  </div>
                  <div class="tune-task-actions">
                    <button class="tune-action-btn delete" title="删除此行动" onclick="PlanFlow.toggleRemoveTask('${t.id}')">
                      <i class="ti ti-trash"></i>
                    </button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          <!-- 【新增】已移除区域 -->
          ${removedTasks.length > 0 ? `
            <div class="removed-section">
              <div class="removed-section-header">
                <div class="removed-section-title">
                  <i class="ti ti-trash-x"></i>
                  已移除的行动
                </div>
                <span class="removed-count">${removedTasks.length} 个</span>
              </div>
              <div class="removed-list">
                ${removedTasks.map(t => `
                  <div class="removed-item">
                    <span class="removed-item-name">${escapeHtml(t.title)}</span>
                    <button class="btn-restore" onclick="PlanFlow.toggleRemoveTask('${t.id}')">
                      <i class="ti ti-rotate-ccw" style="margin-right:2px;"></i>撤销删除
                    </button>
                  </div>
                `).join('')}
              </div>
            </div>

    const info = this.data.todayInfo || {};

    // 过滤掉已经在方案中的行动
    const existingIds = new Set(this.data.tunedTasks.map(t => t.id));

    // 按类型分组
    const grouped = {};
    TYPE_GROUPS.forEach(g => { grouped[g.key] = []; });
    available.forEach(c => {
      const typeInfo = getTypeInfo(c.type);
      const cat = typeInfo.category || 'work';
      // 找到匹配的分组
      let groupKey = 'work';
      for (const g of TYPE_GROUPS) {
        if (g.types.includes(c.type) || g.key === cat) {
          groupKey = g.key;
          break;
        }
      }
      if (!grouped[groupKey]) grouped[groupKey] = [];
      grouped[groupKey].push(c);
    });

    const overlay = document.createElement('div');
    overlay.className = 'candidate-popup-overlay';

  // 【新增】添加候选行动到方案
  addCandidateAction(candidateId) {
    const info = this.data.todayInfo || {};
    const candidates = info.candidate_actions || [];
    const candidate = candidates.find(c => c.id === candidateId);
    if (!candidate) return;

    // 计算添加到时间轴末尾的开始时间
    const activeTasks = this.data.tunedTasks.filter(t => !this.data.removedTaskIds.includes(candidateId));
    let lastEndTime = Date.now(); // 默认从现在开始
    if (activeTasks.length > 0) {
      const lastTask = activeTasks[activeTasks.length - 1];
      lastEndTime = lastTask.startTime + lastTask.duration * 60000;
    }

    const newTask = {
      id: candidate.id,
      title: candidate.title,
      duration: candidate.duration,
      type: candidate.type || 'work',
      priority: 'medium',
      cognitiveLoad: candidate.cognitive_load || 'medium',
      startTime: lastEndTime + 5 * 60000, // 加 5 分钟间隔
      isNewlyAdded: true,
      originNodeId: candidate.id,
    };

    this.data.tunedTasks.push(newTask);
    showToast(`已添加：${candidate.title}`);
    this.closeCandidatePopup();
    this.renderStep4(document.getElementById('plan-modal-body'));
  },

  async rearrangeTasks() {
    if (this.data.step4) this.data.step4.isRearranging = true;
    this.renderStep4(document.getElementById('plan-modal-body'));
    showToast('AI 重新安排中...');

    const keptTasks = this.data.tunedTasks.filter(t => !this.data.removedTaskIds.includes(t.id));

    try {
      const cond = this.data.conditions;
      const res = await API.post('/api/plan/options', {
        main_goal: cond.main_goal === '__none__' ? '' : cond.main_goal,
        end_time: cond.end_time,
        energy_level: cond.energy_level,
        date: formatDate(new Date()),
        keep_actions: keptTasks.map(t => t.originNodeId || t.id),
        // 【新增】标记为重排请求
        rearrange: true,
        selected_option: this.data.selectedOption,
      });
      if (res && res.options) {
        this.data.options = res.options;
        // 规范化方案数据：补充类型信息
        this.normalizeOptions(this.data.options);
        const newOption = res.options.find(o => o.id === this.data.selectedOption) || res.options[1];
        if (newOption) {
          this.data.tunedTasks = [...newOption.tasks];
          this.data.removedTaskIds = [];
        }
        if (this.data.step4) this.data.step4.isRearranging = false;
        this.renderStep4(document.getElementById('plan-modal-body'));
        showToast('已重新安排');
      } else {
        if (this.data.step4) this.data.step4.isRearranging = false;
        this.renderStep4(document.getElementById('plan-modal-body'));
        showToast('重排失败，请重试');
      }
    } catch (e) {

      this.renderStep4(document.getElementById('plan-modal-body'));
      showToast('重排失败: ' + e.message);
    }

  // ===== 确认写入 =====
  async applyPlan() {
    const finalTasks = this.data.tunedTasks.filter(t => !this.data.removedTaskIds.includes(t.id));
    const option = this.data.options.find(o => o.id === this.data.selectedOption);
    const cond = this.data.conditions;

    const nextBtn = document.getElementById('plan-btn-next');
    const originalText = nextBtn.textContent;
    nextBtn.textContent = '写入中...';
    nextBtn.disabled = true;

    try {
      // 优先尝试后端 API
      let success = false;
      try {
        const res = await API.post('/api/plan/apply', {
          option_id: this.data.selectedOption,
          tasks: finalTasks,
          main_goal: cond.main_goal === '__none__' ? '' : cond.main_goal,
          fixed_items: option ? option.fixed_items : [],
          unplaced_tasks: option ? option.unplaced_tasks : [],
          date: formatDate(new Date()),
        });
        success = !!(res && res.ok);
      } catch (apiError) {
        console.warn('后端 API 不可用，使用本地 AIPlanManager:', apiError);
        success = false;
      }

      // 后端不可用时，使用本地 CommandBus 事务性写入
      if (!success && window.CommandBus && window.Store) {
        success = await this.applyPlanLocal(finalTasks, option, cond);
      }

      if (success) {
        showToast('计划已写入今日日程');
        this.close();
        // 刷新今日计划页面
        loadTodayData();
      } else {
        showToast('写入失败，请重试');
        nextBtn.textContent = originalText;
        nextBtn.disabled = false;
      }
    } catch (e) {
      showToast('写入失败: ' + e.message);
      nextBtn.textContent = originalText;
      nextBtn.disabled = false;
    }
  },

  // ===== 本地模式：使用 BanbanAIPlanManager 事务性写入 =====
  async applyPlanLocal(finalTasks, option, cond) {
    try {
      const APM = window.BanbanAIPlanManager;
      if (!APM) {
        console.error('BanbanAIPlanManager 不可用');
        return false;
      }
      
      const date = formatDate(new Date());
      
      // 步骤1：确保任务都在 Store 中（不存在的先创建）
      const taskNodeIds = [];
      for (const t of finalTasks) {
        let node = Store.getNode(t.id);
        if (!node) {
          // 创建节点
          const result = CommandBus.createNode({
            id: t.id,
            title: t.title,
            kind: t.kind || 'action',
            domain_id: t.domain || t.cat || 'general',
            priority: t.priority || 'medium',
            phase: 'candidate',
            commitment: 'maybe',
          });
          if (result && result.id) {
            taskNodeIds.push(result.id);
          }
        } else {
          taskNodeIds.push(node.id);
        }
      }
      
      // 步骤2：使用 CommandBus 批量创建日程块（事务性）
      const batch = CommandBus.startBatch('apply_plan');
      try {
        for (let i = 0; i < finalTasks.length; i++) {
          const t = finalTasks[i];
          const nodeId = taskNodeIds[i];
          
          // 计算时间
          let startTime = t.startTime || t.start_time;
          let durationMin = t.duration_minutes || t.estimatedMinutes || 60;
          
          if (startTime) {
            const startMin = parseInt(startTime.split(':')[0]) * 60 + parseInt(startTime.split(':')[1]);
            const endMin = startMin + durationMin;
            const endTime = `${Math.floor(endMin / 60).toString().padStart(2, '0')}:${(endMin % 60).toString().padStart(2, '0')}`;
            
            batch.scheduleAction({
              nodeId,
              date,
              startTime,
              endTime,
              source: 'ai_plan',
            });
          }
        }
        
        const results = batch.commit();
        const okCount = results.filter(r => r && r.id).length;
        
        // 记录 PlanVersion
        const planVersion = DataModel.createPlanVersion({
          planType: 'daily',
          dateRange: { start: date, end: date },
          ai_draft: false,
          ai_reasoning: '通过UI向导创建，本地事务性写入',
          status: 'applied',
          applied_at: DataModel.nowISO(),
        });
        Store._putPlanVersion(planVersion);
        
        console.log(`[PlanFlow] 本地事务性写入成功，创建 ${okCount}/${finalTasks.length} 个日程块`);
        return okCount > 0;
      } catch (e) {
        batch.rollback();
        throw e;
      }
    } catch (e) {
      console.error('本地写入异常:', e);
      return false;
    }
  },

  // ===== 步骤切换 =====
  goToStep(step) {
    if (step < 1 || step > this.totalSteps) return;
    this.currentStep = step;
    this.updateStepIndicator();
    this.renderStep(step);
  },

  nextStep() {
    if (this.currentStep === 5) {
      // 最后一步：确认写入
      this.applyPlan();
      return;
    }

    if (this.currentStep === 2) {
      // 从步骤2到步骤3：先校验上下文
      this.validateAndGenerate();
      return;
    }

    if (this.currentStep === 3 && !this.data.selectedOption) {
      showToast('请先选择一个方案');
      return;
    }

    this.goToStep(this.currentStep + 1);
  },

  // ===== 步骤2→3：校验上下文并生成方案 =====
  async validateAndGenerate() {
    const nextBtn = document.getElementById('plan-btn-next');
    const originalText = nextBtn.textContent;
    nextBtn.textContent = '校验中...';
    nextBtn.disabled = true;

    try {
      // 先调用校验 API
      const validateRes = await API.post('/api/plan/validate-context', this.buildPlanContext());
      if (!validateRes || !validateRes.valid) {
        const errorMsg = validateRes && validateRes.error ? validateRes.error : '上下文校验失败，请检查条件';
        showToast(errorMsg);
        // 显示错误原因在步骤2
        this._step2Error = errorMsg;
        this.renderStep2(document.getElementById('plan-modal-body'));
        nextBtn.textContent = originalText;
        nextBtn.disabled = !this.canProceedStep2().ok;
        return;
      }

      // 校验通过，进入步骤3并生成方案
      this.goToStep(3);
    } catch (e) {
      console.warn('上下文校验失败:', e);
      // 校验 API 失败时，仍然允许继续（降级处理）
      this.goToStep(3);
    } finally {
      nextBtn.textContent = originalText;
    }
  },

  // ===== 构建完整的规划上下文 =====
  buildPlanContext() {
    const cond = this.data.conditions;
    const s2 = this.data.step2;
    const info = this.data.todayInfo || {};

    // 收集勾选的必做事项（完整对象）
    const mustDoItems = (s2.mustDoItems || [])
      .filter(m => m.checked !== false)
      .map(m => ({
        id: m.id,
        title: m.title,
        domain_id: m.domain_id || m.domain || null,
        duration_minutes: m.duration_minutes || m.estimated_minutes || 30,
        source: m.source || 'existing',
        type: m.type || null,
      }));

    return {
      date: formatDate(new Date()),
      day_end_time: cond.end_time,
      energy_level: cond.energy_level,
      planning_intensity: cond.planning_intensity,
      main_goal: cond.main_goal === '__none__' ? '' : cond.main_goal,
      must_do_items: mustDoItems,
      must_do_confirmed_empty: s2.mustDoConfirmedEmpty || false,
      selected_habit_ids: s2.selectedHabitIds || [],
      selected_goal_ids: s2.selectedGoals || [],
      user_edits: {
        must_do_added: mustDoItems.filter(m => m.source === 'custom' || m.source === 'selected').length,
      },
      fixed_events: info.fixed_events || [],
      today_habits: info.today_habits || [],
    };
  },

  prevStep() {
    if (this.currentStep > 1) {
      this.goToStep(this.currentStep - 1);
    }
  },
};

// 绑定弹层事件
document.getElementById('plan-modal-close').addEventListener('click', () => PlanFlow.close());
document.getElementById('plan-btn-cancel').addEventListener('click', () => {
  if (PlanFlow.currentStep === 5) {
    PlanFlow.goToStep(4);
  } else {
    PlanFlow.close();
  }
});
document.getElementById('plan-btn-back').addEventListener('click', () => PlanFlow.prevStep());
document.getElementById('plan-btn-next').addEventListener('click', () => PlanFlow.nextStep());

// 点击遮罩关闭
document.getElementById('plan-modal-overlay').addEventListener('click', (e) => {
  if (e.target.id === 'plan-modal-overlay') {
    PlanFlow.close();
  }
});

// ESC 键关闭
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const overlay = document.getElementById('plan-modal-overlay');
    if (overlay.classList.contains('is-visible')) {
      PlanFlow.close();
    }
  }
});
</script>
</body>
