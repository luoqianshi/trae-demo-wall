<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="mock-api.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伴伴 · 今日时间线</title>
<link rel="stylesheet" href="figma-design-system.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg-page, #E5F2FF);
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    color: #64748B;
  }
  .redirect-box {
    text-align: center;
    padding: 40px;
  }
  .redirect-box h2 {
    color: #1E293B;
    margin-bottom: 12px;
    font-size: 18px;
  }
  .redirect-box p {
    font-size: 14px;
    margin-bottom: 20px;
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #BFDBFE;
    border-top-color: #2F80ED;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .redirect-link {
    color: #2F80ED;
    text-decoration: none;
    font-size: 13px;
  }
  .redirect-link:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="redirect-box">
    <div class="spinner"></div>
    <h2>正在跳转...</h2>
    <p>时间线视图已整合到今日模块中</p>
    <a href="compass.html#timeline" class="redirect-link">如果没有自动跳转，请点击这里</a>
  </div>
  <script>
    // 自动跳转到 compass.html 并默认显示时间线视图
    window.location.replace('compass.html#timeline');
  </script>
</body>
</html>
