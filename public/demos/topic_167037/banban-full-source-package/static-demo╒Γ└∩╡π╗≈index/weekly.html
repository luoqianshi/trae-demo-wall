<style>
/* ==================== 周规划总览页 · Figma Dev Mode 精确还原 ==================== */

/* ---------- 页面头部 Figma 精确值覆盖 ---------- */
.page-header { padding: 28px 28px 0; }

.page-title {
  font-family: 'MiSans VF', var(--font-sans);
  font-weight: 630;
  font-size: 31px !important;
  color: #1A1F29;
  letter-spacing: -0.01em;
  line-height: 1.2;
}
.page-date {
  font-family: 'MiSans VF', var(--font-sans);
  font-weight: 330;
  font-size: 16px;
  color: #757394;
  margin-top: 6px;
}
.page-subtitle {
  font-family: 'MiSans VF', var(--font-sans);
  font-weight: 330;
  font-size: 12px;
  color: #6B7B74;
  margin-left: 0;
  padding: 6px 28px 0;
}
/* 隐藏右侧自动生成的重复"今天是工作日"，保留左侧 subtitle 版本 */
.page-header > div:last-child > div[style*="font-size"] { display: none !important; }

/* 日期选择器 170×38 */
.date-picker {
  width: 170px;
  height: 38px;
  padding: 0 8px;
  justify-content: space-between;
  align-items: center;
  border: 1px solid #E3EBF5;
  border-radius: 10px;
  background: #fff;
  font-size: 12px;
  font-weight: 500;
  color: #404A5C;
  cursor: default;
  user-select: none;
  gap: 4px;
}
.dp-nav {
  cursor: pointer;
  font-size: 15px;
  color: #6B7B74;
  line-height: 1;
  padding: 0 2px;
  transition: color 0.15s ease;
}
.dp-nav:hover { color: #2F80ED; }
.dp-label {
  font-family: 'Inter', var(--font-sans);
  font-size: 12px;
  font-weight: 500;
  color: #404A5C;
  white-space: nowrap;
}

/* 今天按钮 64×38 */
.today-btn {
  width: 64px;
  height: 38px;
  padding: 0;
  justify-content: center;
  border: 1px solid #E3EBF5;
  border-radius: 10px;
  background: #fff;
  font-size: 12px;
  color: #293040;
}

/* 生成今日计划按钮 103×30 圆角15 */
.gen-plan-btn {
  width: 103px;
  height: 30px;
  padding: 0;
  border: none;
  border-radius: 15px;
  background: #2F80ED;
  color: #fff;
  font-size: 12px;
  font-weight: 630;
  font-family: 'MiSans VF', var(--font-sans);
  box-shadow: 0 2px 8px rgba(47, 128, 237, 0.25);
}
.gen-plan-btn:hover { background: var(--accent-dark); }
.gen-plan-btn.loading { pointer-events: none; opacity: 0.7; }

/* ---------- 主内容区 ---------- */
.weekly-content {
  background: #FFFFFF;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding: 0;
}

/* ---------- 核心看板容器 ---------- */
.weekly-board {
  margin: 14px 20px 20px;
  flex: 1;
  background: #FFFFFF;
  border: 1px solid #E9EEF4;
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  min-height: 0;
}

.board-scroll {
  flex: 1;
  overflow-x: auto;
  overflow-y: auto;
  display: flex;
  gap: 16px;
  padding: 18px 18px 24px;
  position: relative;
  cursor: grab;
  scroll-behavior: smooth;
}
.board-scroll.grabbing { cursor: grabbing; scroll-behavior: auto; }
.board-scroll::-webkit-scrollbar { height: 7px; width: 7px; }
.board-scroll::-webkit-scrollbar-thumb { background: #D7DEE8; border-radius: 4px; }
.board-scroll::-webkit-scrollbar-track { background: transparent; }

/* ---------- 看板列 ---------- */
.board-column {
  width: 240px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 2;
}
.column-header {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 4px 4px 14px;
  border-bottom: 1px solid #F0F4F8;
  margin-bottom: 14px;
}
.column-day {
  font-family: 'MiSans VF', var(--font-sans);
  font-size: 15px;
  font-weight: 600;
  color: #262B36;
}
.column-date {
  font-family: 'Inter', var(--font-sans);
  font-size: 12px;
  font-weight: 500;
  color: #98A1AD;
}
.column-cards {
  display: flex;
  flex-direction: column;
  gap: 14px;
  flex: 1;
  min-height: 80px;
  padding: 2px;
  border-radius: 12px;
  transition: background 0.2s ease, outline 0.15s ease;
}
.column-cards.drag-over {
  background: rgba(47, 128, 237, 0.05);
  outline: 2px dashed rgba(47, 128, 237, 0.35);
  outline-offset: 3px;
}
.column-empty {
  font-size: 12px;
  color: #C5CCD6;
  text-align: center;
  padding: 24px 0;
  font-family: 'MiSans VF', var(--font-sans);
}

/* ---------- 任务卡片 (240×100, 圆角12, 阴影 0 5 12 rgba(31,46,71,0.08)) ---------- */
.wc-card {
  width: 240px;
  min-height: 100px;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0px 5px 12px rgba(31, 46, 71, 0.08);
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  cursor: grab;
  position: relative;
  transition: box-shadow 0.2s ease, transform 0.15s ease;
  animation: slideUp 0.45s ease-out both;
}
.wc-card:hover {
  box-shadow: 0px 9px 22px rgba(31, 46, 71, 0.15);
  transform: translateY(-2px);
}
.wc-card:active { cursor: grabbing; }
.wc-card.dragging { opacity: 0.35; transform: scale(0.98); }

/* 顶部行：类别标签 + 更多 */
.wc-row-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.wc-cat-label {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: 8px;
}
.wc-cat-icon {
  font-size: 14px;
  line-height: 1;
}
.wc-cat-name {
  font-family: 'Inter', var(--font-sans);
  font-weight: 600;
  font-size: 13px;
  white-space: nowrap;
}
.wc-more {
  font-size: 14px;
  color: #4D5261;
  cursor: pointer;
  line-height: 1;
  letter-spacing: 1px;
  padding: 0 2px;
  user-select: none;
}
.wc-more:hover { color: #2F80ED; }

/* === 三类分类色（Figma 精确值） === */
/* 策略与规划 — 紫色系 #614DC7 */
.wc-card[data-cat="strategy"] .wc-cat-label {
  background: linear-gradient(180deg, rgba(237,232,255,1) 0%, rgba(250,247,255,1) 100%);
}
.wc-card[data-cat="strategy"] .wc-cat-icon,
.wc-card[data-cat="strategy"] .wc-cat-name { color: #614DC7; }

/* 执行与项目 — 绿色系 #599438 */
.wc-card[data-cat="execution"] .wc-cat-label {
  background: linear-gradient(180deg, rgba(235,247,212,1) 0%, rgba(247,252,237,1) 100%);
}
.wc-card[data-cat="execution"] .wc-cat-icon,
.wc-card[data-cat="execution"] .wc-cat-name { color: #599438; }

/* 恢复与个人 — 青色系 #2E8CA3 */
.wc-card[data-cat="recovery"] .wc-cat-label {
  background: linear-gradient(180deg, rgba(214,245,247,1) 0%, rgba(240,252,255,1) 100%);
}
.wc-card[data-cat="recovery"] .wc-cat-icon,
.wc-card[data-cat="recovery"] .wc-cat-name { color: #2E8CA3; }

/* 状态标签：绿底 #E8F5DE 文字 #57963D 圆角7 */
.wc-status {
  display: inline-block;
  align-self: flex-start;
  font-family: 'Inter', var(--font-sans);
  font-weight: 600;
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 7px;
  background: #E8F5DE;
  color: #57963D;
  margin-bottom: 6px;
  line-height: 1.5;
}

/* 任务标题 MiSans VF 330 19px */
.wc-title {
  font-family: 'MiSans VF', var(--font-sans);
  font-weight: 330;
  font-size: 19px;
  color: #1A1F29;
  line-height: 1.25;
  letter-spacing: -0.01em;
  word-break: break-word;
}

/* 底部行：进度条 + 时间 */
.wc-row-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: auto;
  padding-top: 8px;
}
/* 进度条 76×6 圆角3 底#E5E8ED 填充#6EA857 */
.wc-progress-track {
  width: 76px;
  height: 6px;
  background: #E5E8ED;
  border-radius: 3px;
  overflow: hidden;
  flex-shrink: 0;
}
.wc-progress-fill {
  height: 100%;
  background: #6EA857;
  border-radius: 3px;
  transition: width 0.7s cubic-bezier(0.16, 1, 0.3, 1);
}
/* 时间标注 Inter 400 11px #575E6B */
.wc-time {
  font-family: 'Inter', var(--font-sans);
  font-weight: 400;
  font-size: 11px;
  color: #575E6B;
  margin-left: auto;
}

/* ---------- 跨天依赖箭头 SVG 覆盖层 ---------- */
.board-arrows {
  position: absolute;
  top: 0;
  left: 0;
  pointer-events: none;
  z-index: 3;
  overflow: visible;
}

/* ---------- 看板顶部说明条 ---------- */
.board-hint {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 18px 0;
  font-size: 11px;
  color: #98A1AD;
  font-family: 'MiSans VF', var(--font-sans);
}
.board-hint .hint-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: #2F80ED;
}
</style>

<script>
/* ==================== 周规划总览页逻辑 ==================== */

// ==================== Store 桥接层 ====================
const WeekStoreBridge = {
  _syncing: false,

  // Store Node → 周规划任务卡片
  nodeToTask(node, scheduleBlock) {
    const domain = node.domain_id || 'general';
    
    // 推断分类
    let cat = 'strategy';
    if (node.kind === 'action' && (domain === 'work' || domain === 'study')) cat = 'execution';
    else if (domain === 'health' || domain === 'life' || node.kind === 'habit') cat = 'recovery';
    else if (node.kind === 'goal') cat = 'strategy';
    
    // 状态映射
    let status = '计划中';
    if (node.phase === 'completed') status = '已完成';
    else if (node.phase === 'active') status = '进行中';
    else if (node.phase === 'candidate') status = '待安排';
    else if (node.commitment === 'committed') status = '已确认';
    
    // 时间
    let time = '';
    if (scheduleBlock) {
      time = scheduleBlock.start_time;
    }
    
    // 进度（goal 类型用 goal_config.progress）
    let progress = null;
    if (node.kind === 'goal' && node.goal_config?.progress != null) {
      progress = node.goal_config.progress;
    } else if (node.kind === 'action') {
      progress = node.phase === 'completed' ? 100 : (node.phase === 'active' ? 50 : 0);
    }
    
    return {
      id: node.id,
      cat,
      title: node.title,
      status,
      time,
      progress,
      node_id: node.id,
      kind: node.kind,
      domain: node.domain_id,
      priority: node.priority,
    };
  },

  // 从 Store 获取本周数据
  getWeekFromStore() {
    if (!window.Store) return null;
    
    const monday = getWeekMonday(weekOffset);
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);
    
    const startStr = formatDate(monday);
    const endStr = formatDate(sunday);
    
    // 获取本周的日程块
    const blocks = Store.getScheduleBlocksByDateRange(startStr, endStr);
    
    // 按日期分组（前4天）
    const cols = [0, 1, 2, 3].map(d => ({ day: d, tasks: [] }));
    
    // 处理有日程块的任务
    blocks.forEach(block => {
      const node = Store.getNode(block.node_id);
      if (!node) return;
      
      const blockDate = new Date(block.date);
      const dayIdx = Math.floor((blockDate - monday) / 86400000);
      if (dayIdx < 0 || dayIdx > 3) return; // 只显示前4天
      
      const task = this.nodeToTask(node, block);
      task.block_id = block.id;
      cols[dayIdx].tasks.push(task);
    });
    
    // 按时间排序
    cols.forEach(col => {
      col.tasks.sort((a, b) => (a.time || '23:59').localeCompare(b.time || '23:59'));
    });
    
    // 如果全部为空，返回 fallback 保持设计完整性
    if (cols.every(c => c.tasks.length === 0)) {
      return null;
    }
    
    return { columns: cols };
  },

  // 获取未安排的行动（侧边栏/待分配池）
  getUnscheduledActions() {
    if (!window.Store) return [];
    
    const monday = getWeekMonday(weekOffset);
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);
    const startStr = formatDate(monday);
    const endStr = formatDate(sunday);
    
    // 获取所有未完成的行动
    const actions = Store.getActiveActions();
    
    // 过滤掉本周已有安排的
    const scheduledNodeIds = new Set();
    const blocks = Store.getScheduleBlocksByDateRange(startStr, endStr);
    blocks.forEach(b => {
      if (b.node_id) scheduledNodeIds.add(b.node_id);
    });
    
    return actions
      .filter(a => !scheduledNodeIds.has(a.id))
      .map(a => this.nodeToTask(a, null));
  },

  // 将行动安排到某一天
  scheduleActionToDay(nodeId, dayIndex, startTime) {
    if (!window.CommandBus) return null;
    
    const monday = getWeekMonday(weekOffset);
    const targetDate = new Date(monday);
    targetDate.setDate(monday.getDate() + dayIndex);
    const dateStr = formatDate(targetDate);
    
    // 默认时间：上午10点，时长60分钟
    const start = startTime || '10:00';
    const startMin = DataModel.timeToMinutes(start);
    const endMin = startMin + 60;
    const end = DataModel.minutesToTime(endMin);
    
    return CommandBus.scheduleAction({
      nodeId,
      date: dateStr,
      startTime: start,
      endTime: end,
      blockType: 'work',
    });
  },

  // 刷新视图
  refreshFromStore() {
    if (this._syncing) return;
    this._syncing = true;
    
    try {
      const storeData = this.getWeekFromStore();
      if (storeData) {
        weeklyData = storeData;
        renderBoard(weeklyData);
        afterRender();
      }
    } finally {
      setTimeout(() => { this._syncing = false; }, 50);
    }
  },

  // 设置事件监听
  setupListeners() {
    if (!window.EventBus) return;
    const EB = window.EventBus;
    
    const events = [
      EB.EVENTS.SCHEDULE_CREATED,
      EB.EVENTS.SCHEDULE_UPDATED,
      EB.EVENTS.SCHEDULE_DELETED,
      EB.EVENTS.SCHEDULE_MOVED,
      EB.EVENTS.NODE_CREATED,
      EB.EVENTS.NODE_UPDATED,
      EB.EVENTS.NODE_DELETED,
      EB.EVENTS.NODE_COMPLETED,
      EB.EVENTS.FOCUS_STARTED,
      EB.EVENTS.FOCUS_COMPLETED,
      EB.EVENTS.STORE_HYDRATED,
    ];
    
    events.forEach(evt => {
      EB.on(evt, () => {
        this.refreshFromStore();
      });
    });
    
    console.log('[WeekStoreBridge] 事件监听已设置');
  },

  // 初始化
  async init() {
    if (!window.BanbanCore) return;
    
    try {
      // 确保 Store 有数据
      if (Store.getAllNodes().length === 0) {
        await BanbanCore.init();
      }
      
      // 设置事件监听
      this.setupListeners();
      
      // 从 Store 刷新
      this.refreshFromStore();
      
      console.log('[WeekStoreBridge] 初始化完成');
    } catch (e) {
      console.warn('[WeekStoreBridge] 初始化失败:', e);
    }
  },
};

const SVG_NS = 'http://www.w3.org/2000/svg';
const WEEKDAY_CN = ['日', '一', '二', '三', '四', '五', '六'];
const DAY_LABELS = ['周一', '周二', '周三', '周四'];

// 三类任务元信息
const CAT_META = {
  strategy:  { name: '策略与规划', icon: '<i class="ti ti-target-arrow"></i>' },
  execution: { name: '执行与项目', icon: '<i class="ti ti-settings-cog"></i>' },
  recovery:  { name: '恢复与个人', icon: '<i class="ti ti-spa"></i>' },
};

// ---- Fallback 数据（API 失败时使用，1:1 还原 Figma 设计） ----
const FALLBACK_WEEKLY = {
  columns: [
    { day: 0, tasks: [
      { id: 's1', cat: 'strategy',  title: '季度OKR拆解与对齐',     status: '计划中', time: '09:00' },
      { id: 'e1', cat: 'execution', title: '核心模块接口开发',       status: '进行中', time: '14:00', progress: 60, dep: 'e2' },
    ]},
    { day: 1, tasks: [
      { id: 'e2', cat: 'execution', title: '接口联调与测试',         status: '进行中', time: '10:00', progress: 30, dep: 'e3' },
      { id: 'r1', cat: 'recovery',  title: '午间冥想与散步',         status: '日常',   time: '13:00' },
    ]},
    { day: 2, tasks: [
      { id: 's2', cat: 'strategy',  title: '用户反馈分析与优先级',   status: '已澄清', time: '11:00' },
      { id: 'e3', cat: 'execution', title: '性能优化与重构',         status: '待安排', time: '15:00', progress: 0,  dep: 'e4' },
    ]},
    { day: 3, tasks: [
      { id: 'r2', cat: 'recovery',  title: '周复盘与下周规划',       status: '日常',   time: '17:00' },
      { id: 'e4', cat: 'execution', title: '上线发布与监控',         status: '待安排', time: '16:00', progress: 0 },
    ]},
  ]
};

let weekOffset = 0;       // 周偏移：0=本周
let weeklyData = FALLBACK_WEEKLY;

// ---- 日期工具 ----
function getWeekMonday(offset = 0) {
  const today = new Date();
  const d = today.getDay();               // 0=周日
  const diff = d === 0 ? -6 : 1 - d;      // 本周一相对今天的天数
  const monday = new Date(today);
  monday.setHours(0, 0, 0, 0);
  monday.setDate(today.getDate() + diff + offset * 7);
  return monday;
}

function fmtFullDate(date) {
  return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日 星期${WEEKDAY_CN[date.getDay()]}`;
}

// ---- 渲染单张卡片 ----
function renderCard(task, index) {
  const meta = CAT_META[task.cat] || CAT_META.strategy;
  const progressHTML = (task.cat === 'execution')
    ? `<div class="wc-progress-track"><div class="wc-progress-fill" style="width:0%" data-target="${task.progress || 0}"></div></div>`
    : '';
  const depAttr = task.dep ? `data-dep="${task.dep}"` : '';
  return `
    <div class="wc-card" draggable="true" data-cat="${task.cat}" data-id="${task.id}" ${depAttr} style="animation-delay:${index * 0.06}s">
      <div class="wc-row-top">
        <div class="wc-cat-label">
          <span class="wc-cat-icon">${meta.icon}</span>
          <span class="wc-cat-name">${meta.name}</span>
        </div>
        <span class="wc-more" title="更多操作">•••</span>
      </div>
      <span class="wc-status">${escapeHtml(task.status || '')}</span>
      <div class="wc-title">${escapeHtml(task.title)}</div>
      <div class="wc-row-bottom">
        ${progressHTML}
        <span class="wc-time">${escapeHtml(task.time || '')}</span>
      </div>
    </div>
  `;
}

// ---- 渲染整个看板 ----
function renderBoard(data) {
  const container = document.getElementById('board-columns');
  if (!container) return;
  container.innerHTML = '';

  const monday = getWeekMonday(weekOffset);

  data.columns.forEach((col) => {
    const date = new Date(monday);
    date.setDate(monday.getDate() + col.day);

    const cardsHTML = (col.tasks || []).map((t, i) => renderCard(t, i)).join('');
    const emptyHTML = (!col.tasks || col.tasks.length === 0)
      ? '<div class="column-empty">暂无任务，拖拽卡片到此</div>' : '';

    const colEl = document.createElement('div');
    colEl.className = 'board-column';
    colEl.dataset.day = col.day;
    colEl.innerHTML = `
      <div class="column-header">
        <span class="column-day">${DAY_LABELS[col.day]}</span>
        <span class="column-date">${date.getMonth() + 1}/${date.getDate()}</span>
      </div>
      <div class="column-cards" data-day="${col.day}">
        ${cardsHTML}${emptyHTML}
      </div>
    `;
    container.appendChild(colEl);
  });

  bindCardDnD();
  bindColumnDnD();
}

// ---- 刷新日期选择器内容与导航 ----
function refreshDatePicker() {
  const dp = document.querySelector('.date-picker');
  if (!dp) return;
  const monday = getWeekMonday(weekOffset);
  const label = `${monday.getFullYear()}-${String(monday.getMonth() + 1).padStart(2, '0')}-${String(monday.getDate()).padStart(2, '0')} 周${WEEKDAY_CN[monday.getDay()]}`;
  dp.innerHTML =
    `<span class="dp-nav" data-dir="-1"><i class="ti ti-chevron-left"></i></span>` +
    `<span class="dp-label">${label}</span>` +
    `<span class="dp-nav" data-dir="1"><i class="ti ti-chevron-right"></i></span>`;
  dp.querySelectorAll('.dp-nav').forEach(nav => {
    nav.addEventListener('click', (e) => {
      e.stopPropagation();
      weekOffset += parseInt(nav.dataset.dir, 10);
      renderBoard(weeklyData);
      refreshDatePicker();
      afterRender();
    });
  });
}

// ---- 进度条动画（根据任务完成度动态填充） ----
function animateProgress() {
  document.querySelectorAll('.wc-progress-fill').forEach(fill => {
    const target = parseFloat(fill.dataset.target) || 0;
    requestAnimationFrame(() => { fill.style.width = target + '%'; });
  });
}

// ---- 跨天依赖箭头（SVG 贝塞尔曲线） ----
function drawArrows() {
  const svg = document.getElementById('board-arrows');
  const board = document.getElementById('board-scroll');
  if (!svg || !board) return;

  svg.innerHTML = `
    <defs>
      <marker id="arrow-head" markerWidth="10" markerHeight="10" refX="7" refY="5"
              orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,1 L8,5 L0,9 Z" fill="#1A1F29"/>
      </marker>
    </defs>
  `;
  svg.setAttribute('width', Math.max(board.scrollWidth, board.clientWidth));
  svg.setAttribute('height', Math.max(board.scrollHeight, board.clientHeight));

  const boardRect = board.getBoundingClientRect();
  const sources = [...document.querySelectorAll('.wc-card[data-dep]')];

  sources.forEach(srcCard => {
    const depId = srcCard.dataset.dep;
    const tgtCard = document.querySelector(`.wc-card[data-id="${depId}"]`);
    if (!tgtCard) return;

    const s = srcCard.getBoundingClientRect();
    const t = tgtCard.getBoundingClientRect();

    // 转换为看板内容坐标（含滚动偏移）
    const x1 = s.right - boardRect.left + board.scrollLeft;
    const y1 = s.top + s.height / 2 - boardRect.top + board.scrollTop;
    const x2 = t.left - boardRect.left + board.scrollLeft - 3;
    const y2 = t.top + t.height / 2 - boardRect.top + board.scrollTop;

    const dx = Math.max(30, (x2 - x1) * 0.45);
    const path = document.createElementNS(SVG_NS, 'path');
    path.setAttribute('d',
      `M ${x1.toFixed(1)} ${y1.toFixed(1)} ` +
      `C ${(x1 + dx).toFixed(1)} ${y1.toFixed(1)}, ` +
      `${(x2 - dx).toFixed(1)} ${y2.toFixed(1)}, ` +
      `${x2.toFixed(1)} ${y2.toFixed(1)}`);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', '#1A1F29');
    path.setAttribute('stroke-width', '1.5');
    path.setAttribute('stroke-opacity', '0.55');
    path.setAttribute('marker-end', 'url(#arrow-head)');
    svg.appendChild(path);
  });
}

// ---- 渲染后统一收尾 ----
function afterRender() {
  requestAnimationFrame(() => {
    animateProgress();
    drawArrows();
  });
}

// ---- 横向拖拽滚动（在空白处拖拽） ----
function bindBoardScroll() {
  const board = document.getElementById('board-scroll');
  if (!board) return;
  let down = false, startX = 0, startLeft = 0, moved = false;

  board.addEventListener('mousedown', (e) => {
    // 卡片或更多按钮上的按下不触发看板滚动（交给卡片拖拽）
    if (e.target.closest('.wc-card') || e.target.closest('.dp-nav')) return;
    down = true;
    moved = false;
    startX = e.pageX;
    startLeft = board.scrollLeft;
    board.classList.add('grabbing');
  });
  document.addEventListener('mousemove', (e) => {
    if (!down) return;
    const dx = e.pageX - startX;
    if (Math.abs(dx) > 3) moved = true;
    board.scrollLeft = startLeft - dx;
  });
  document.addEventListener('mouseup', () => {
    if (down) {
      down = false;
      board.classList.remove('grabbing');
    }
  });
  // 阻止看板拖拽时触发图片选中
  board.addEventListener('dragstart', (e) => {
    if (!e.target.closest('.wc-card')) e.preventDefault();
  });
  return { wasMoved: () => moved };
}

// ---- 卡片拖拽排序（HTML5 DnD） ----
function bindCardDnD() {
  document.querySelectorAll('.wc-card').forEach(card => {
    card.addEventListener('dragstart', (e) => {
      e.dataTransfer.setData('text/plain', card.dataset.id);
      e.dataTransfer.effectAllowed = 'move';
      card.classList.add('dragging');
    });
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      drawArrows();
    });
    // 更多按钮：点击切换进行中/待安排（轻交互）
    const more = card.querySelector('.wc-more');
    if (more) {
      more.addEventListener('click', (e) => {
        e.stopPropagation();
        showToast('任务菜单：编辑 / 归档 / 设置依赖');
      });
    }
  });
}

// ---- 列接收拖拽 ----
function bindColumnDnD() {
  document.querySelectorAll('.column-cards').forEach(col => {
    col.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      col.classList.add('drag-over');
    });
    col.addEventListener('dragleave', (e) => {
      if (!col.contains(e.relatedTarget)) col.classList.remove('drag-over');
    });
    col.addEventListener('drop', (e) => {
      e.preventDefault();
      col.classList.remove('drag-over');
      const cardId = e.dataTransfer.getData('text/plain');
      const targetDay = parseInt(col.dataset.day, 10);
      moveCardToDay(cardId, targetDay);
    });
  });
}

// ---- 跨列移动卡片 ----
function moveCardToDay(cardId, targetDay) {
  let moved = null;
  weeklyData.columns.forEach(col => {
    const idx = col.tasks.findIndex(t => String(t.id) === String(cardId));
    if (idx >= 0) { moved = col.tasks.splice(idx, 1)[0]; }
  });
  if (!moved) return;
  const target = weeklyData.columns.find(c => c.day === targetDay);
  if (target) target.tasks.push(moved);
  renderBoard(weeklyData);
  afterRender();
  showToast('已移动到 ' + DAY_LABELS[targetDay]);
}

// ---- 加载周数据（连接全部 API，失败回退） ----
//   GET /api/tasks       任务按日期分组（看板主数据）
//   GET /api/plan/today  今日计划（用于高亮今日 + 完成度）
//   GET /api/plan/nodes  计划节点（用于动态更新进度条）
//   POST /api/generate-plan 由头部按钮触发
//   POST /api/chat       由右侧 AI 面板（共享组件）触发
async function loadWeeklyData(silent = false) {
  const [tasksRes, planRes, nodesRes] = await Promise.all([
    API.get('/api/tasks'),
    API.get('/api/plan/today'),
    API.get('/api/plan/nodes'),
  ]);

  let data;
  if (tasksRes && Array.isArray(tasksRes.columns)) {
    data = { columns: tasksRes.columns.map(normalizeColumn) };
  } else if (tasksRes && Array.isArray(tasksRes.tasks)) {
    data = groupTasksByDay(tasksRes.tasks);
  } else if (Array.isArray(tasksRes)) {
    data = groupTasksByDay(tasksRes);
  } else {
    data = FALLBACK_WEEKLY;
    if (!silent) showToast('未获取到任务数据，已载入示例');
  }
  // 兜底：若归一化后无列，回退
  if (!data || !Array.isArray(data.columns) || data.columns.length === 0) {
    data = FALLBACK_WEEKLY;
  }

  // 用计划节点动态更新执行类任务的进度条（完成度）
  applyPlanProgress(data, nodesRes, planRes);

  weeklyData = data;
  renderBoard(weeklyData);
  refreshDatePicker();
  afterRender();
}

// 将计划节点 / 今日计划中的完成度合并到看板任务
function applyPlanProgress(data, nodesRes, planRes) {
  // 收集 {id|title -> progress} 映射
  const progMap = new Map();
  const collect = (arr) => {
    if (!Array.isArray(arr)) return;
    arr.forEach(n => {
      const key = (n.id != null ? String(n.id) : null) || (n.title || n.name || '');
      if (!key) return;
      const p = (typeof n.progress === 'number') ? n.progress
              : (typeof n.completion === 'number') ? n.completion
              : (typeof n.percent === 'number') ? n.percent : null;
      if (p != null) progMap.set(key, Math.max(0, Math.min(100, p)));
    });
  };
  collect(nodesRes && nodesRes.nodes);
  collect(nodesRes && nodesRes.items);
  collect(Array.isArray(nodesRes) ? nodesRes : null);
  collect(planRes && planRes.tasks);
  collect(planRes && planRes.blocks);

  if (progMap.size === 0) return;
  data.columns.forEach(col => {
    (col.tasks || []).forEach(t => {
      if (t.cat !== 'execution') return;
      const p = progMap.get(String(t.id)) ?? progMap.get(t.title);
      if (p != null) t.progress = p;
    });
  });
}

// 归一化单列结构
function normalizeColumn(col) {
  const day = (typeof col.day === 'number') ? col.day : (parseInt(col.day, 10) || 0);
  return {
    day: Math.max(0, Math.min(3, day)),
    tasks: (col.tasks || []).map(normalizeTask),
  };
}

// 归一化单任务结构（兼容多种字段名）
function normalizeTask(t) {
  const catRaw = (t.cat || t.category || t.type || '').toString().toLowerCase();
  let cat = 'strategy';
  if (catRaw.includes('exec') || catRaw.includes('执行') || catRaw.includes('project') || catRaw.includes('dev'))
    cat = 'execution';
  else if (catRaw.includes('recov') || catRaw.includes('rest') || catRaw.includes('恢复') || catRaw.includes('personal') || catRaw.includes('life') || catRaw.includes('个人'))
    cat = 'recovery';
  else if (catRaw.includes('strat') || catRaw.includes('plan') || catRaw.includes('策略') || catRaw.includes('规划') || catRaw.includes('work') || catRaw.includes('study'))
    cat = 'strategy';
  else {
    // 按标题关键词推断分类
    const title = (t.title || t.name || t.task || '').toLowerCase();
    if (/(开发|编码|接口|测试|联调|部署|上线|修复|调试|重构|优化|实现)/.test(title))
      cat = 'execution';
    else if (/(休息|冥想|散步|运动|锻炼|复盘|个人|生活|阅读|放松)/.test(title))
      cat = 'recovery';
  }

  return {
    id: String(t.id != null ? t.id : ('t' + Math.random().toString(36).slice(2, 8))),
    cat,
    title: t.title || t.name || t.task || '未命名任务',
    status: t.status || t.state || '计划中',
    time: t.time || t.start || '',
    progress: (typeof t.progress === 'number') ? t.progress
            : (typeof t.completion === 'number' ? t.completion : (cat === 'execution' ? 0 : null)),
    dep: t.dep || t.dependsOn || t.dependency || null,
  };
}

// 将扁平任务数组按日期分组成 4 列
function groupTasksByDay(tasks) {
  const monday = getWeekMonday(weekOffset);
  const cols = [0, 1, 2, 3].map(d => ({ day: d, tasks: [] }));

  // 检测任务是否有日期信息和分类信息
  const hasDateInfo = (tasks || []).some(t => t.day != null || t.date != null);
  // cat/category 必须是"策略/执行/恢复"类语义值，不是通用 type 字段
  const hasCategoryInfo = (tasks || []).some(t => {
    const c = (t.cat || t.category || '').toString().toLowerCase();
    return c.includes('strat') || c.includes('exec') || c.includes('recov') ||
           c.includes('策略') || c.includes('执行') || c.includes('恢复');
  });

  // 如果任务没有日期信息，或没有语义分类信息，使用 fallback 保持设计完整性
  if (!hasDateInfo || !hasCategoryInfo) {
    return FALLBACK_WEEKLY;
  }

  (tasks || []).forEach(raw => {
    const t = normalizeTask(raw);
    let dayIdx = -1;
    if (raw.day != null) dayIdx = parseInt(raw.day, 10);
    else if (raw.date) {
      const d = new Date(raw.date);
      if (!isNaN(d)) dayIdx = Math.round((d - monday) / 86400000);
    }
    if (dayIdx >= 0 && dayIdx <= 3) cols[dayIdx].tasks.push(t);
    else cols[0].tasks.push(t);
  });
  // 若全部为空，回退到 Fallback
  if (cols.every(c => c.tasks.length === 0)) return FALLBACK_WEEKLY;
  return { columns: cols };
}

// ==================== 页面初始化 ====================
document.addEventListener('DOMContentLoaded', () => {
  initPage('plan', {
    header: { title: '周规划总览', subtitle: '今天是工作日' },
    ai: {
      insight: '你倾向于有条理地规划任务，并愿意投入时间学习技术知识。；你倾向于先明确任务状态（计划中、已澄清、已归档），再逐步推进，并常在编程过程中边做边调整。；你倾向于在安静的环境中深度工作，喜欢整块时间专注， 并需要独自安排一会来处理复杂任务。',
      suggestion: '本周主线已清晰：先完成接口开发与联调，再推进性能优化与上线。建议为深度工作预留整块时间，把复杂任务安排在精力高峰时段，并在节点之间保留缓冲。',
    }
  });

  // 绑定看板交互
  bindBoardScroll();

  // 头部控件（事件委托，因按钮由共享组件渲染）
  // “今天”按钮：回到本周
  document.addEventListener('click', (e) => {
    if (e.target.closest('.today-btn')) {
      weekOffset = 0;
      renderBoard(weeklyData);
      refreshDatePicker();
      afterRender();
      showToast('已回到本周');
    }
  });

  // “生成今日计划”按钮：调用 API
  document.addEventListener('click', async (e) => {
    const btn = e.target.closest('.gen-plan-btn');
    if (!btn) return;
    if (btn.classList.contains('loading')) return;
    btn.classList.add('loading');
    const orig = btn.textContent;
    btn.textContent = '生成中';
    const res = await API.post('/api/generate-plan', { date: formatDate(new Date()) });
    btn.classList.remove('loading');
    btn.textContent = orig;
    if (res) {
      showToast('今日计划已生成');
      loadWeeklyData(true);
    } else {
      showToast('计划生成失败，已保留当前数据');
    }
  });

  // 日期选择器初始化
  refreshDatePicker();

  // 初始化 Store 桥接（优先从 Store 读取数据）
  if (window.BanbanCore) {
    WeekStoreBridge.init();
  } else {
    // 降级：旧的加载方式
    loadWeeklyData();
  }

  // 窗口尺寸变化时重绘箭头
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(drawArrows, 150);
  });

  // 字体/布局稳定后再次校正箭头
  window.addEventListener('load', () => setTimeout(drawArrows, 200));
});
</script>
