<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="mock-api.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>伴伴 · 开始认识</title>
  <style>
    /* ================================================================
       伴伴引导页 (Onboarding Welcome) — 1:1 复刻 Figma 设计图
       独立页面：不依赖 figma-design-system.css / figma-components.js
       ================================================================ */

    /* ---- 设计令牌 ---- */
    :root {
      --bg: #F5F7FA;
      --card-bg: #FFFFFF;
      --ink: #1A1A2E;
      --muted: #666666;
      --muted-light: #999999;
      --accent: #2563EB;
      --accent-soft: rgba(37, 99, 235, 0.08);
      --btn-bg: #0F172A;
      --btn-bg-hover: #020617;
      --feature-bg: #F8FAFC;
      --feature-border: #EEF2F7;
      --feature-border-hover: #2563EB;
      --shadow-card: 0 20px 60px rgba(15, 23, 42, 0.08), 0 8px 24px rgba(15, 23, 42, 0.04);
      --shadow-avatar-warm: 0 8px 32px rgba(255, 140, 66, 0.3);
      --shadow-avatar-cool: 0 4px 16px rgba(78, 205, 196, 0.2);
      --shadow-btn: 0 4px 12px rgba(15, 23, 42, 0.25);
      --shadow-btn-hover: 0 8px 24px rgba(15, 23, 42, 0.35);
      --font: 'Inter', 'MiSans VF', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      overflow-y: auto;
    }

    /* ---- 动画关键帧 ---- */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    @keyframes glow {
      0%, 100% { box-shadow: 0 8px 32px rgba(255, 140, 66, 0.3), 0 4px 16px rgba(78, 205, 196, 0.2); }
      50% { box-shadow: 0 12px 40px rgba(255, 140, 66, 0.4), 0 6px 20px rgba(78, 205, 196, 0.3); }
    }

    /* ---- 主容器 ---- */
    .onboarding-welcome {
      width: 100%;
      max-width: 440px;
      animation: fadeIn 0.6s ease-out;
    }

    /* ---- 卡片 ---- */
    .welcome-card {
      background: var(--card-bg);
      border-radius: 24px;
      box-shadow: var(--shadow-card);
      padding: 0 40px 40px;
      position: relative;
      animation: slideUp 0.6s ease-out both;
      animation-delay: 0.1s;
      overflow: visible;
    }

    /* ---- IP 品牌形象 ---- */
    .welcome-avatar {
      width: 120px;
      height: 120px;
      border-radius: 28px;
      background: linear-gradient(135deg, #FF8C42 0%, #FF6B9D 30%, #A78BFA 60%, #4ECDC4 100%);
      position: relative;
      margin: -60px auto 24px;
      box-shadow: var(--shadow-avatar-warm), var(--shadow-avatar-cool);
      animation: breathe 3s ease-in-out infinite, glow 3s ease-in-out infinite;
      opacity: 0.92;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 毛玻璃叠加层 — 增强半透明质感 */
    .welcome-avatar::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0.05) 50%, rgba(255, 255, 255, 0) 100%);
      pointer-events: none;
    }

    /* 高光反射 — 增加立体感 */
    .welcome-avatar::after {
      content: '';
      position: absolute;
      top: 8px;
      left: 12px;
      width: 32px;
      height: 18px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      filter: blur(4px);
      pointer-events: none;
    }

    .avatar-face {
      position: relative;
      display: flex;
      gap: 24px;
      z-index: 2;
    }

    .avatar-eye {
      width: 12px;
      height: 16px;
      background: #1A1A2E;
      border-radius: 50%;
    }

    /* ---- 英文标签 ---- */
    .welcome-label {
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    /* ---- 主标题 ---- */
    .welcome-title {
      text-align: center;
      font-size: 30px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.4;
      margin-bottom: 16px;
      letter-spacing: -0.01em;
    }

    /* ---- 说明文字 ---- */
    .welcome-desc {
      text-align: center;
      font-size: 15px;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 28px;
      max-width: 340px;
      margin-left: auto;
      margin-right: auto;
    }

    /* ---- 特性卡片 ---- */
    .welcome-feature {
      background: var(--feature-bg);
      border: 1px solid var(--feature-border);
      border-radius: 14px;
      padding: 16px 18px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 28px;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
      cursor: default;
    }

    .welcome-feature:hover {
      border-color: var(--feature-border-hover);
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.1);
    }

    .feature-icon {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--accent-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 16px;
      line-height: 1;
    }

    .feature-icon svg {
      width: 18px;
      height: 18px;
      fill: var(--accent);
    }

    .feature-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 4px;
      text-align: left;
    }

    .feature-desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
      text-align: left;
    }

    /* ---- 主行动按钮 ---- */
    .welcome-btn {
      width: 220px;
      height: 50px;
      margin: 0 auto;
      background: var(--btn-bg);
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      font-family: var(--font);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-btn);
      transition: background 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: 0.02em;
    }

    .welcome-btn:hover {
      background: var(--btn-bg-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow-btn-hover);
    }

    .welcome-btn:active {
      transform: translateY(0);
      box-shadow: var(--shadow-btn);
    }

    .welcome-btn .btn-arrow {
      display: inline-block;
      transition: transform 0.25s ease;
    }

    .welcome-btn:hover .btn-arrow {
      transform: translateX(4px);
    }

    /* ---- 时间提示 ---- */
    .welcome-time {
      text-align: center;
      font-size: 13px;
      color: var(--muted-light);
      margin-top: 16px;
    }

    /* ---- 跳过按钮 ---- */
    .skip-btn {
      display: block;
      width: 100%;
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: var(--font);
      font-size: 13px;
      cursor: pointer;
      padding: 12px 16px;
      margin-top: 8px;
      border-radius: 10px;
      transition: all 0.2s ease;
    }
    .skip-btn:hover {
      color: var(--accent);
      background: var(--accent-soft);
    }
    .skip-btn:active {
      transform: scale(0.98);
    }

    /* ---- 响应式 ---- */
    @media (max-width: 480px) {
      .welcome-card {
        padding: 0 24px 32px;
        border-radius: 20px;
      }
      .welcome-title { font-size: 26px; }
      .welcome-desc { font-size: 14px; }
      .welcome-btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="onboarding-welcome">
    <div class="welcome-card">
      <!-- IP 品牌形象 -->
      <div class="welcome-avatar">
        <div class="avatar-face">
          <div class="avatar-eye"></div>
          <div class="avatar-eye"></div>
        </div>
      </div>

      <!-- 英文标签 -->
      <div class="welcome-label">HELLO, I'M BANBAN</div>

      <!-- 主标题 -->
      <h1 class="welcome-title">你好，我是伴伴。</h1>

      <!-- 说明文字 -->
      <p class="welcome-desc">我不会用几道题定义你。我们会从一次轻松的认识开始，在之后共同生活和行动的过程中，慢慢形成更准确、也可以被你修正的理解。</p>

      <!-- 特性卡片 -->
      <div class="welcome-feature">
        <div class="feature-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 3L21 12L12 21L3 12Z"/>
          </svg>
        </div>
        <div>
          <div class="feature-title">理解属于你</div>
          <div class="feature-desc">每一个判断都会说明依据，你可以随时查看、修正或删除。</div>
        </div>
      </div>

      <!-- 主行动按钮 -->
      <button class="welcome-btn" id="startBtn">
        <span>开始认识彼此</span>
        <span class="btn-arrow">→</span>
      </button>

      <!-- 时间提示 -->
      <div class="welcome-time">大约需要 3 分钟</div>

      <!-- 跳过按钮 -->
      <button class="skip-btn" id="skipBtn">
        跳过问卷，直接体验 →
      </button>
    </div>
  </div>

  <script>
    // ================================================================
    // API 封装
    // ================================================================
    const API = {
      async get(url) {
        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      },
      async post(url, data) {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      }
    };

    // ================================================================
    // 初始化：检查是否已有用户配置
    // ================================================================
    (async function init() {
      try {
        const status = await API.get('/api/status');
        if (status && status.configured) {
          // 已配置，直接跳转主界面
          window.location.href='portal.html';
          return;
        }
      } catch (e) {
        // 接口异常时静默处理，停留在引导页
        console.warn('状态检查失败：', e);
      }

      // 按钮点击 → 跳转到问卷流程（带涟漪效果）
      const startBtn = document.getElementById('startBtn');
      if (startBtn) {
        // 涟漪效果
        startBtn.addEventListener('click', function(e) {
          const rect = this.getBoundingClientRect();
          const ripple = document.createElement('span');
          ripple.style.cssText = `position:absolute;border-radius:50%;background:rgba(255,255,255,0.4);pointer-events:none;width:${Math.max(rect.width, rect.height)}px;height:${Math.max(rect.width, rect.height)}px;left:${e.clientX - rect.left - Math.max(rect.width, rect.height) / 2}px;top:${e.clientY - rect.top - Math.max(rect.width, rect.height) / 2}px;transform:scale(0);animation:ripple 0.6s ease-out;`;
          this.appendChild(ripple);
          setTimeout(() => ripple.remove(), 600);
          // 延迟跳转让涟漪动画完成
          setTimeout(() => { window.location.href='onboarding.html'; }, 300);
        });

        // 鼠标跟随光效
        startBtn.addEventListener('mousemove', function(e) {
          const rect = this.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          this.style.background = `radial-gradient(circle at ${x}px ${y}px, #1e3a5f 0%, #0F172A 60%)`;
        });
        startBtn.addEventListener('mouseleave', function() {
          this.style.background = '#0F172A';
        });
      }

      // 跳过问卷按钮
      const skipBtn = document.getElementById('skipBtn');
      if (skipBtn) {
        skipBtn.addEventListener('click', function() {
          // 标记为已完成onboarding，使用默认配置
          try {
            localStorage.setItem('onboarding_completed', 'true');
            localStorage.setItem('user_profile', JSON.stringify({
              name: '小伴',
              wake_time: '07:00',
              sleep_time: '23:30',
              work_start: '09:00',
              work_end: '18:00',
              focus_blocks: ['09:00-11:30', '14:30-17:00'],
              goals: ['完成每日目标', '保持运动习惯', '坚持阅读'],
              productivity_peak: 'morning',
              onboarding_completed: true
            }));
          } catch(e) {}
          // 跳转到门户页
          window.location.href = 'portal.html';
        });
      }

      // 文字内容交错入场
      const card = document.querySelector('.welcome-card');
      if (card) {
        const children = card.children;
        Array.from(children).forEach((child, i) => {
          if (child !== document.querySelector('.welcome-avatar')) {
            child.style.opacity = '0';
            child.style.animation = `slideUp 0.6s ease-out both`;
            child.style.animationDelay = (i * 0.1 + 0.3) + 's';
          }
        });
      }
    })();
  </script>
</body>
</html>
