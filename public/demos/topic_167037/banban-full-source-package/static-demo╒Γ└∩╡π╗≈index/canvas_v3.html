  const panel = document.getElementById('aiResultPanel');
  if(panel) panel.style.display = 'none';
}

// ==================== 画布交互 ====================
function initCanvasInteraction(){
  const vp=document.getElementById('canvasViewport');

  vp.addEventListener('mousedown',(e)=>{
    // 仅左键触发平移/框选, 右键交给 contextmenu 处理
    if(e.button!==0) return;
    if(e.target.closest('.node-card')||e.target.closest('.sticky-card')||e.target.closest('.candidate-inbox')||
       e.target.closest('.add-node-btn')||e.target.closest('.bottom-toolbar')||e.target.closest('.expand-bubble')||
       e.target.closest('.ctx-menu')||e.target.closest('.new-node-menu')) return;
    hideContextMenu();
    closeNewNodeMenu();
    if(e.shiftKey){
      state.isBoxSelecting=true;
      state.boxSelectStart={x:e.clientX,y:e.clientY};
      const rect=vp.getBoundingClientRect();
      const r=document.getElementById('boxSelectRect');
      r.style.display='block';r.style.left=(e.clientX-rect.left)+'px';r.style.top=(e.clientY-rect.top)+'px';
      r.style.width='0px';r.style.height='0px';
      return;
    }
    state.isPanning=true;
    state.panStart={x:e.clientX-state.viewport.x,y:e.clientY-state.viewport.y};
    vp.classList.add('panning');
    if(state.isConnecting){ /* 点击空白取消连接模式起点 */ state.connectFrom=null; }
    deselectNode();
  });

  document.addEventListener('mousemove',(e)=>{
    // 拖拽连接
    if(state.dragConnect){
      state.dragConnect.currentWorld=screenToWorld(e.clientX,e.clientY);
      renderRelations();
      return;
    }
    if(state.isBoxSelecting){
      const rect=vp.getBoundingClientRect();
      const cx=e.clientX-rect.left, cy=e.clientY-rect.top;
      const sx=state.boxSelectStart.x-rect.left, sy=state.boxSelectStart.y-rect.top;
      const r=document.getElementById('boxSelectRect');
      r.style.left=Math.min(sx,cx)+'px';r.style.top=Math.min(sy,cy)+'px';
      r.style.width=Math.abs(cx-sx)+'px';r.style.height=Math.abs(cy-sy)+'px';
      return;
    }
    if(!state.isPanning) return;
    state.viewport.x=e.clientX-state.panStart.x;
    state.viewport.y=e.clientY-state.panStart.y;
    document.getElementById('canvasWorld').style.transform=`translate(${state.viewport.x}px,${state.viewport.y}px) scale(${state.viewport.scale})`;
    updateInfiniteGrid();
  });

  document.addEventListener('mouseup',(e)=>{
    if(state.dragConnect){
      // 判断是否落在某节点上
      const targetId=getNodeIdFromPoint(e.clientX,e.clientY);
      if(targetId && targetId!==state.dragConnect.fromId){
        completeConnect(state.dragConnect.fromId, targetId);
      }
      state.dragConnect=null;
      renderRelations();
      return;
    }
    if(state.isBoxSelecting){
      state.isBoxSelecting=false;
      document.getElementById('boxSelectRect').style.display='none';
      const rect=vp.getBoundingClientRect();
      const x1=Math.min(state.boxSelectStart.x,e.clientX)-rect.left;
      const y1=Math.min(state.boxSelectStart.y,e.clientY)-rect.top;
      const x2=Math.max(state.boxSelectStart.x,e.clientX)-rect.left;
      const y2=Math.max(state.boxSelectStart.y,e.clientY)-rect.top;
      state.selectedIds=[];
      state.nodes.forEach(n=>{
        const p=getDisplayPosition(n);
        const sx=p.x*state.viewport.scale+state.viewport.x;
        const sy=p.y*state.viewport.scale+state.viewport.y;
        if(sx<x2 && sx+200*state.viewport.scale>x1 && sy<y2 && sy+182*state.viewport.scale>y1){
          state.selectedIds.push(n.id);
        }
      });
      if(state.selectedIds.length===1){ state.selectedId=state.selectedIds[0]; }
      render();
      return;
    }
    if(state.isPanning){
      state.isPanning=false;
      vp.classList.remove('panning');
    }
  });

  // 滚轮缩放 (0.3 - 2.5x), 缩放至光标
  vp.addEventListener('wheel',(e)=>{
    if(e.target.closest('.candidate-inbox')||e.target.closest('.ctx-menu')) return;
    e.preventDefault();
    const delta = e.deltaY>0 ? 0.9 : 1.1;
    const newScale=Math.max(0.15,Math.min(4,state.viewport.scale*delta));
    if(newScale===state.viewport.scale) return;
    const rect=vp.getBoundingClientRect();
    const cx=e.clientX-rect.left, cy=e.clientY-rect.top;
    // 保持光标处世界点不变
    const wx=(cx-state.viewport.x)/state.viewport.scale;
    const wy=(cy-state.viewport.y)/state.viewport.scale;
    state.viewport.scale=newScale;
    state.viewport.x=cx-wx*newScale;
    state.viewport.y=cy-wy*newScale;
    render();
  },{passive:false});

  // 双击空白创建节点
  vp.addEventListener('dblclick',(e)=>{
    if(e.target.closest('.node-card')||e.target.closest('.sticky-card')||e.target.closest('.candidate-inbox')||
       e.target.closest('.add-node-btn')||e.target.closest('.bottom-toolbar')) return;
    const w=screenToWorld(e.clientX,e.clientY);
    createNodeAt(w.x-100, w.y-91);
  });

  // 空白处右键菜单
  vp.addEventListener('contextmenu',(e)=>{
    if(e.target.closest('.node-card')||e.target.closest('.sticky-card')) return;
    e.preventDefault();
    const w=screenToWorld(e.clientX,e.clientY);
    hideContextMenu();
    const menu=document.createElement('div');
    menu.className='ctx-menu'; menu.id='ctxMenu';
    menu.style.left=e.clientX+'px'; menu.style.top=e.clientY+'px';
    menu.innerHTML=`
      <div class="ctx-item" onclick="createNodeAt(${w.x-100},${w.y-91});hideContextMenu()"><span class="ctx-glyph"><i class="ti ti-plus"></i></span>在此新建节点</div>
      <div class="ctx-item" onclick="quickAddNode();hideContextMenu()"><span class="ctx-glyph"><i class="ti ti-bulb"></i></span>新建想法(居中)</div>
      <div class="ctx-item" onclick="createStickyNote();hideContextMenu()"><span class="ctx-glyph"><i class="ti ti-note"></i></span>添加便签</div>
      <div class="ctx-item" onclick="resetZoom();hideContextMenu()"><span class="ctx-glyph"><i class="ti ti-refresh"></i></span>重置缩放</div>
      <div class="ctx-item" onclick="aiOrganizeCanvas();hideContextMenu()"><span class="ctx-glyph"><i class="ti ti-align-box-left-top"></i></span>整理画布</div>`;
    document.body.appendChild(menu);
    const r=menu.getBoundingClientRect();
    if(r.right>window.innerWidth) menu.style.left=(window.innerWidth-r.width-8)+'px';
    if(r.bottom>window.innerHeight) menu.style.top=(window.innerHeight-r.height-8)+'px';
  });

  // 键盘快捷键
  document.addEventListener('keydown',(e)=>{
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.isContentEditable) return;
    if(e.key==='n'||e.key==='N') quickAddNode();
    if(e.ctrlKey&&e.key==='z'){ e.preventDefault(); undo(); }
    if(e.ctrlKey&&(e.key==='y'||(e.shiftKey&&e.key==='Z'))){ e.preventDefault(); redo(); }
    if((e.key==='Delete'||e.key==='Backspace')){
      if(state.selectedIds.length>0){ e.preventDefault(); deleteMultiSelected(); }
      else if(state.selectedId){ e.preventDefault(); deleteSelectedNode(); }
    }
    if(e.key==='Escape'){ deselectNode(); state.expandBubbles=[]; hideContextMenu(); if(state.isConnecting) toggleConnectMode(); render(); }
  });

  // 点击空白关闭菜单/取消选中
  document.addEventListener('click',(e)=>{
    // 点击新建节点菜单外部时关闭它
    const newNodeMenu = document.getElementById('newNodeMenu');
    if(newNodeMenu && newNodeMenu.style.display !== 'none' && !e.target.closest('.new-node-menu') && !e.target.closest('.tool-btn-add')){
      closeNewNodeMenu();
    }
    if(!e.target.closest('.node-card')&&!e.target.closest('.ctx-menu')&&!e.target.closest('.ai-panel')&&
       !e.target.closest('.candidate-inbox')&&!e.target.closest('.canvas-topbar')&&!e.target.closest('.bottom-toolbar')&&
       !e.target.closest('.new-node-menu')){
      if(state.selectedId) deselectNode();
    }
  });
}

function getNodeIdFromPoint(clientX,clientY){
  const el=document.elementFromPoint(clientX,clientY);
  if(!el) return null;
  const card=el.closest('.node-card');
  return card?card.getAttribute('data-node-id'):null;
}

// ---- 节点拖拽 ----
function onNodeMouseDown(e, nodeId){
  if(e.button!==0) return;
  // 从连接手柄拖出 → 创建连接
  if(e.target.classList.contains('card-connect')){
    e.stopPropagation(); e.preventDefault();
    state.dragConnect={ fromId:nodeId, currentWorld:screenToWorld(e.clientX,e.clientY) };
    return;
  }
  if(e.target.closest('.card-action')) return; // 操作按钮不触发拖拽
  e.stopPropagation();
  const node=state.nodes.find(n=>n.id===nodeId);
  if(!node) return;
  // 连接模式下不拖拽, 由 click 事件处理连接
  if(state.isConnecting){ return; }

  const startX=e.clientX, startY=e.clientY;
  const layout=node.layout||{};
  const displayPosition=getDisplayPosition(node);
  const nx=displayPosition.x, ny=displayPosition.y;
  let dragged=false;
  const cardEl=document.querySelector(`.node-card[data-node-id="${nodeId}"]`);

  const onMove=(ev)=>{
    const dx=(ev.clientX-startX)/state.viewport.scale;
    const dy=(ev.clientY-startY)/state.viewport.scale;
    if(Math.abs(dx)>2||Math.abs(dy)>2) dragged=true;
    if(dragged){
      if(!node.layout) node.layout={};
      if (state.focusPositions[node.id]) delete state.focusPositions[node.id];
      node.layout.x=nx+dx; node.layout.y=ny+dy;
      if(cardEl){ cardEl.style.left=node.layout.x+'px'; cardEl.style.top=node.layout.y+'px'; cardEl.classList.add('dragging'); }
      renderRelations(); renderGroups();
    }
  };
  const onUp=()=>{
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
    if(cardEl) cardEl.classList.remove('dragging');
    if(dragged){
      pushUndo({type:'MOVE_NODE',nodeId:node.id,before:{x:nx,y:ny},position:{x:node.layout.x,y:node.layout.y}});
      scheduleSave();
    }else{
      if(e.shiftKey) toggleMultiSelect(nodeId);
      else selectNode(nodeId);
    }
  };
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
}

// ---- 便签拖拽 ----
function onStickyMouseDown(e, stickyId){
  if(e.button!==0) return;
  e.stopPropagation();
  const st=state.stickyNotes.find(s=>s.id===stickyId);
  if(!st) return;
  const sx=e.clientX, sy=e.clientY;
  const l=st.layout||{}; const ox=l.x||0, oy=l.y||0;
  let dragged=false; const el=e.currentTarget;
  const onMove=(ev)=>{
    const dx=(ev.clientX-sx)/state.viewport.scale, dy=(ev.clientY-sy)/state.viewport.scale;
    if(Math.abs(dx)>2||Math.abs(dy)>2) dragged=true;
    if(dragged){ if(!st.layout)st.layout={}; st.layout.x=ox+dx; st.layout.y=oy+dy; el.style.left=st.layout.x+'px'; el.style.top=st.layout.y+'px'; el.classList.add('dragging'); }
  };
  const onUp=()=>{
    document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);
    el.classList.remove('dragging');
    if(dragged) scheduleSave();
  };
  document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onUp);
}

// ---- 选择 ----
function selectNode(nodeId){
  state.selectedId=nodeId; state.selectedIds=[];
  state.expandBubbles=[];
  const canvasMain = document.querySelector('.canvas-main');
  if (canvasMain && canvasMain.clientWidth < 1100 && candidatePanelVisible) {
    toggleCandidatePanel();
  }
  render(); updateAIPanel();
}
function deselectNode(){
  state.selectedId=null; state.selectedIds=[]; state.expandBubbles=[];
  render(); updateAIPanel();
}
function toggleMultiSelect(nodeId){
  const i=state.selectedIds.indexOf(nodeId);
  if(i>=0) state.selectedIds.splice(i,1); else state.selectedIds.push(nodeId);
  if(state.selectedIds.length===1) state.selectedId=state.selectedIds[0];
  else state.selectedId=null;
  render();
}
function deleteMultiSelected(){
  if(state.selectedIds.length===0) return;
  if(!confirm(`确认删除 ${state.selectedIds.length} 个节点？`)) return;
  const ids=new Set(state.selectedIds);
  state.nodes=state.nodes.filter(n=>!ids.has(n.id));
  state.relations=state.relations.filter(r=>!ids.has(r.sourceNodeId)&&!ids.has(r.targetNodeId));
  state.selectedIds=[]; state.selectedId=null;
  scheduleSave(); render(); showToast('已删除多个节点');
}

// ---- 缩放 ----
function zoomIn(){ zoomTo(state.viewport.scale*1.2); }
function zoomOut(){ zoomTo(state.viewport.scale/1.2); }
function zoomTo(scale){
  const newScale=Math.max(0.15,Math.min(4,scale));
  // 以视口中心为锚点
  const vp=document.getElementById('canvasViewport');
  const rect=vp.getBoundingClientRect();
  const cx=rect.width/2, cy=rect.height/2;
  const wx=(cx-state.viewport.x)/state.viewport.scale, wy=(cy-state.viewport.y)/state.viewport.scale;
  state.viewport.scale=newScale;
  state.viewport.x=cx-wx*newScale; state.viewport.y=cy-wy*newScale;
  render();
}

function fitCanvasToViewport(){
  const vp=document.getElementById('canvasViewport');
  const visibleNodes = getVisibleNodes();
  if(!vp || !visibleNodes.length) return;

  const positions=visibleNodes.map(node=>{
    const p=getDisplayPosition(node);
    const size=getNodeSize(node.kind);
    return {x:p.x,y:p.y,w:size.w,h:size.h};
  });
  const minX=Math.min(...positions.map(p=>p.x));
  const minY=Math.min(...positions.map(p=>p.y));
  const maxX=Math.max(...positions.map(p=>p.x+p.w));
  const maxY=Math.max(...positions.map(p=>p.y+p.h));

  const candidate=document.getElementById('candidatePanel');
  const detail=document.getElementById('detailPanel');
  const panelInset=el=>el && getComputedStyle(el).display!=='none' ? el.getBoundingClientRect().width+28 : 20;
  const leftInset=panelInset(candidate);
  const rightInset=panelInset(detail);
  const availableW=Math.max(240,vp.clientWidth-leftInset-rightInset);
  const availableH=Math.max(220,vp.clientHeight-80);
  const contentW=Math.max(1,maxX-minX);
  const contentH=Math.max(1,maxY-minY);
  const scale=Math.max(.3,Math.min(1,availableW/(contentW+80),availableH/(contentH+80)));

  state.viewport.scale=scale;
  state.viewport.x=leftInset+(availableW-contentW*scale)/2-minX*scale;
  state.viewport.y=40+(availableH-contentH*scale)/2-minY*scale;
  render();
}

function resetZoom(){ fitCanvasToViewport(); }

// ---- 视图/筛选 ----
function handleSearch(q){ state.filters.query=q; render(); }
function toggleMenu(){ showToast('菜单: 双击空白新建节点 · 右键节点更多操作 · Shift+拖拽框选'); }
function toggleMoreMenu(){ state.showAllRelations=!state.showAllRelations; render(); showToast(state.showAllRelations?'已显示全部关系':'仅显示主要关系'); }

// ==================== 节点 CRUD ====================
function quickAddNode(){
  const vp=document.getElementById('canvasViewport').getBoundingClientRect();
  const w=screenToWorld(vp.left+vp.width/2, vp.top+vp.height/2);
  createNodeAt(w.x-100, w.y-91);
}
function createNodeAt(x,y){
  const title=prompt('输入节点标题：');
  if(!title||!title.trim()) return;
  const now=new Date().toISOString();
  const newNode={
    id:'node_'+(state.nextId++), title:title.trim(), kind:'record',
    commitment:'observed', confirmationStatus:'confirmed', executionStatus:'unplanned',
    phase:'confirmed', source:'manual', confidence:1.0,
    layout:{x,y,isPinned:false,zIndex:1},
    origins:[{source:'manual',originalText:title.trim(),createdAt:now}],
    createdBy:'user', createdAt:now, updatedAt:now,
  };
  state.nodes.push(newNode);
  pushUndo({type:'CREATE_NODE',node:newNode});
  scheduleSave(); render(); selectNode(newNode.id);
  showToast('已新建节点');
}

function createStickyNote(){
  const text=prompt('输入便签内容：');
  if(!text||!text.trim()) return;
  const vp=document.getElementById('canvasViewport').getBoundingClientRect();
  const w=screenToWorld(vp.left+vp.width/2+(Math.random()-0.5)*120, vp.top+vp.height/2+(Math.random()-0.5)*80);
  const icons=[['♡','#E54D59'],['♧','#734DE5'],['★','#F5A623'],['✦','#2F80ED']];
  const ic=icons[Math.floor(Math.random()*icons.length)];
  const st={id:'sticky_'+(state.nextId++),text:text.trim(),icon:ic[0],color:ic[1],layout:{x:w.x-71,y:w.y-28}};
  state.stickyNotes.push(st);
  scheduleSave(); render(); showToast('已添加便签');
}

function deleteSelectedNode(){
  if(!state.selectedId) return;
  const node=state.nodes.find(n=>n.id===state.selectedId);
  if(!node) return;
  const rels=state.relations.filter(r=>r.sourceNodeId===state.selectedId||r.targetNodeId===state.selectedId);
  if(rels.length>0){
    if(!confirm(`该节点有 ${rels.length} 个关联关系，确认删除？`)) return;
  }
  pushUndo({type:'DELETE_NODE',node:node,relations:rels});
  state.nodes=state.nodes.filter(n=>n.id!==state.selectedId);
  state.relations=state.relations.filter(r=>r.sourceNodeId!==state.selectedId&&r.targetNodeId!==state.selectedId);
  state.selectedId=null;
  scheduleSave(); render(); showToast('已删除');
}

function togglePinSelected(nodeId){
  const id=nodeId||state.selectedId; if(!id) return;
  const node=state.nodes.find(n=>n.id===id); if(!node) return;
  if(!node.layout) node.layout={};
  const before=node.layout.isPinned;
  node.layout.isPinned=!node.layout.isPinned;
  if(node.layout.isPinned) node.manualImportance='high';
  node.updatedAt=new Date().toISOString();
  pushUndo({type:'PIN_NODE',nodeId:id,before});
  scheduleSave(); render();
  showToast(node.layout.isPinned?'已固定':'已取消固定');
}

function setAsFocus(nodeId){
  const id=nodeId||state.selectedId; if(!id) return;
  const node=state.nodes.find(n=>n.id===id); if(!node) return;
  if(!node.layout) node.layout={};
  node.layout.isPinned=true;
  // 居中视图到该节点
  const vp=document.getElementById('canvasViewport').getBoundingClientRect();
  const p=getDisplayPosition(node);
  state.viewport.scale=1;
  state.viewport.x=vp.width/2-p.x-100;
  state.viewport.y=vp.height/2-p.y-91;
  scheduleSave(); render();
  showToast('已设为焦点并居中');
}

function startInlineEdit(nodeId){
  const card=document.querySelector(`.node-card[data-node-id="${nodeId}"]`);
  if(!card) return;
  const titleEl=card.querySelector('.node-title');
  if(!titleEl) return;
  titleEl.setAttribute('contenteditable','true');
  titleEl.focus();
  // 选中文本
  const range = document.createRange();
  range.selectNodeContents(titleEl);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  
  const finish=()=>{
    titleEl.removeAttribute('contenteditable');
    const node=state.nodes.find(n=>n.id===nodeId);
    if(node && titleEl.textContent.trim() && titleEl.textContent!==node.title){
      pushUndo({type:'UPDATE_NODE',nodeId,before:{title:node.title}});
      node.title=titleEl.textContent.trim();
      node.updatedAt=new Date().toISOString();
      scheduleSave();
    }
    render();
    renderDetailPanel(state.selectedId);
    titleEl.removeEventListener('blur',finish);
    titleEl.removeEventListener('keydown',onKey);
  };
  const onKey=(e)=>{
    if(e.key==='Enter'){ e.preventDefault(); titleEl.blur(); }
    if(e.key==='Escape'){ 
      const node=state.nodes.find(n=>n.id===nodeId);
      if(node) titleEl.textContent=node.title; 
      titleEl.blur(); 
    }
  };
  titleEl.addEventListener('blur',finish);
  titleEl.addEventListener('keydown',onKey);
}

function completeConnect(sourceId,targetId){

// ==================== 撤销/重做 ====================
function updateUndoRedoButtons(){
  document.getElementById('undoBtn').style.opacity=state.undoStack.length?'1':'0.3';
  document.getElementById('redoBtn').style.opacity=state.redoStack.length?'1':'0.3';
}
function undo(){
  if(state.undoStack.length===0) return;
  const m=state.undoStack.pop(); state.redoStack.push(m);
  if(m.type==='MOVE_NODE'){ const n=state.nodes.find(x=>x.id===m.nodeId); if(n&&n.layout){n.layout.x=m.before.x;n.layout.y=m.before.y;} }
  else if(m.type==='CREATE_NODE'){ state.nodes=state.nodes.filter(x=>x.id!==m.node.id); }
  else if(m.type==='DELETE_NODE'){ state.nodes.push(m.node); state.relations.push(...(m.relations||[])); }
  else if(m.type==='PIN_NODE'){ const n=state.nodes.find(x=>x.id===m.nodeId); if(n&&n.layout) n.layout.isPinned=m.before; }
  else if(m.type==='UPDATE_NODE'){ const n=state.nodes.find(x=>x.id===m.nodeId); if(n) Object.assign(n,m.before); }
  else if(m.type==='ADD_RELATION'){ state.relations=state.relations.filter(r=>r.id!==m.relation.id); }
  updateUndoRedoButtons(); scheduleSave(); render();
}
function redo(){
  if(state.redoStack.length===0) return;
  const m=state.redoStack.pop(); state.undoStack.push(m);
  if(m.type==='MOVE_NODE'){ const n=state.nodes.find(x=>x.id===m.nodeId); if(n&&n.layout){n.layout.x=m.position.x;n.layout.y=m.position.y;} }
  else if(m.type==='CREATE_NODE'){ state.nodes.push(m.node); }
  else if(m.type==='DELETE_NODE'){ state.nodes=state.nodes.filter(x=>x.id!==m.node.id); state.relations=state.relations.filter(r=>!((m.relations||[]).includes(r))); }
  else if(m.type==='PIN_NODE'){ const n=state.nodes.find(x=>x.id===m.nodeId); if(n&&n.layout) n.layout.isPinned=!m.before; }
  else if(m.type==='UPDATE_NODE'){ const n=state.nodes.find(x=>x.id===m.nodeId); if(n) n.title=m.after||n.title; }
  else if(m.type==='ADD_RELATION'){ state.relations.push(m.relation); }
  updateUndoRedoButtons(); scheduleSave(); render();
}

// ==================== AI: 输入想法 (POST /api/events/process) ====================
async function submitInput(){
  const input=document.getElementById('aiInput');
  const text=input.value.trim();
  if(!text) return;
  input.value='';
  showAIThinking('正在分析...');
  let result;
  try{
    result=await apiPost('/api/events/process',{text, source:'chat', existing_nodes:state.nodes.map(n=>({id:n.id,title:n.title,kind:n.kind}))});
    if(result.error) throw new Error(result.error);
  }catch(e){
    console.warn('事件处理失败，回退本地分析:', e.message);
    result=mockClassify(text);
  }
  if(!result.shouldCreateNode){ showAIInfo('这条内容暂时不需要创建节点。'); return; }
  if(result.clarification&&result.clarification.required){ showClarification(result); return; }
  showCandidates(result);
}

function mockClassify(text){
  if(text.includes('想')||text.includes('希望')){
    return {shouldCreateNode:true,candidates:[{tempId:'c1',title:text,kind:'desire',commitment:'intended',confidence:0.85,evidence:'用户表达了意愿但缺少完成标准'}],clarification:{required:false}};
  }
  if(text.includes('明天')||text.includes('今晚')||text.includes('下午')){
    return {shouldCreateNode:true,candidates:[{tempId:'c1',title:text,kind:'action',commitment:'scheduled',confidence:0.9,estimatedMinutes:60,evidence:'有明确时间和动作'}],clarification:{required:false}};
  }
  return {shouldCreateNode:true,candidates:[{tempId:'c1',title:text,kind:'record',commitment:'observed',confidence:0.7,evidence:'新出现的想法，尚需确认'}],clarification:{required:true,question:'这只是一个想法，还是你想去做？',options:[{label:'只是记录一下',resultingKind:'record',resultingCommitment:'observed'},{label:'我想试试',resultingKind:'desire',resultingCommitment:'intended'}]}};
}

function showCandidates(result){
  const candidates=result.candidates||[];
  if(candidates.length===0){ showAIInfo('没有生成候选节点。'); return; }
  let html=`<div class="ai-result-header">
    <div class="ai-result-title"><span class="ai-result-dot info"></span>AI 分析结果</div>
    <button class="ai-result-close" onclick="hideAIResult()">✕</button>
  </div>
  <div class="ai-result-body">`;
  candidates.forEach((c,i)=>{
    const ks=getKindStyle(c.kind);
    html+=`<div class="ai-suggestion-item">
      <div class="ai-sug-icon" style="background:${ks.bg};color:${ks.color};">${ks.icon}</div>
      <div class="ai-sug-body">
        <div class="ai-sug-title">${escapeHtml(c.title)}</div>
        <div class="ai-sug-meta">
          <span class="ai-sug-tag" style="background:${ks.bg};color:${ks.color};">${ks.label}</span>
          <span class="ai-sug-tag" style="background:#F1F5F9;color:#6B7B74;">置信度 ${Math.round((c.confidence||0)*100)}%</span>

        <div class="ai-sug-actions">

          <button onclick="dismissCandidate(${i})">忽略</button>

function showClarification(result){
  const clar=result.clarification; const opts=clar.options||[];
  let html=`<div class="ai-result-header">
    <div class="ai-result-title"><span class="ai-result-dot info"></span>需要澄清</div>
    <button class="ai-result-close" onclick="hideAIResult()">✕</button>
  </div>
  <div class="ai-result-body">
    <div class="ai-info-text" style="margin-bottom:12px;">${escapeHtml(clar.question)}</div>`;
  opts.forEach((o,i)=>{ html+=`<div class="ai-suggestion-item"><div class="ai-sug-body"><div class="ai-sug-title">${escapeHtml(o.label)}</div><div class="ai-sug-actions"><button class="add" onclick="answerClarification(${i})">选择</button></div></div></div>`; });
  html += `</div>`;
  setAIDynamic(html);
  state._pendingClar={result,clar};
}
function answerClarification(i){
  if(!state._pendingClar) return;
  const {clar,node}=state._pendingClar;
  const opt=clar.options[i]; if(!opt) return;
  // 已有节点澄清: 直接更新属性
  if(node){
    pushUndo({type:'UPDATE_NODE',nodeId:node.id,before:{kind:node.kind,commitment:node.commitment}});
    node.kind=opt.resultingKind||node.kind;
    node.commitment=opt.resultingCommitment||node.commitment;
    node.confirmationStatus='confirmed'; node.updatedAt=new Date().toISOString();
    scheduleSave(); render(); showAIInfo('已更新节点属性');
    return;
  }
  // 新候选澄清: 按选择创建节点
  const cand=(state._pendingClar.result&&state._pendingClar.result.candidates||[])[0]||{};
  const newNode=makeNodeFromCandidate({...cand,kind:opt.resultingKind||cand.kind,commitment:opt.resultingCommitment||cand.commitment});
  state.nodes.push(newNode);
  state.candidates.push({id:'cand_'+state.nextId++,proposal:{...cand,kind:opt.resultingKind,commitment:opt.resultingCommitment},status:'accepted',originalText:cand.title,createdAt:new Date().toISOString()});
  scheduleSave(); render(); updateAIPanel();
  showAIInfo(`已将「${escapeHtml(newNode.title)}」放入画板。`);
}
function acceptCandidate(i){
  const c=state._pendingCandidates[i]; if(!c) return;
  const node=makeNodeFromCandidate(c);
  state.nodes.push(node);
  scheduleSave(); render(); selectNode(node.id);
  showAIInfo(`已将「${escapeHtml(node.title)}」放入画板。`);
  showToast('已添加到画板');
}
function dismissCandidate(i){
  if(state._pendingCandidates) state._pendingCandidates.splice(i,1);
  if(state._pendingCandidates&&state._pendingCandidates.length===0) showAIInfo('已忽略全部候选。');
  else showCandidates({candidates:state._pendingCandidates});
}
function makeNodeFromCandidate(c){
  const now=new Date().toISOString();
  const layout=layoutForNewNode();
  return {id:'node_'+(state.nextId++),title:c.title,kind:c.kind||'record',commitment:c.commitment||'observed',
    confirmationStatus:'pending',executionStatus:'unplanned',phase:'candidate',source:'chat',
    confidence:c.confidence||0.7,layout,origins:[{source:'chat',originalText:c.title,createdAt:now}],
    createdBy:'ai',createdAt:now,updatedAt:now};
}
function layoutForNewNode(){
  const vp=document.getElementById('canvasViewport').getBoundingClientRect();
  const w=screenToWorld(vp.left+vp.width/2,vp.top+vp.height/2);
  return {x:w.x-100+(Math.random()-0.5)*120,y:w.y-91+(Math.random()-0.5)*120,isPinned:false,zIndex:1};
}

// ==================== AI: 整理画布 ====================
function aiOrganizeCanvas(){
  const movable=state.nodes.filter(n=>!(n.layout||{}).isPinned);
  if(movable.length===0){ showToast('没有可整理的节点（全部已固定）'); return; }
  if(!confirm(`将整理 ${movable.length} 个未固定节点，已固定节点保持不动。`)) return;
  const kindOrder=['domain','project','outcome','action','habit','record'];
  const byKind={};
  movable.forEach(n=>{ const k=kindOrder.includes(n.kind)?n.kind:'record'; (byKind[k]=byKind[k]||[]).push(n); });
  let col=0;
  kindOrder.forEach(k=>{
    (byKind[k]||[]).forEach((n,i)=>{
      if(!n.layout)n.layout={};
      pushUndo({type:'MOVE_NODE',nodeId:n.id,before:{x:n.layout.x,y:n.layout.y},position:{x:120+col*240,y:120+i*210}});
      n.layout.x=120+col*240; n.layout.y=120+i*210;
    });
    if(byKind[k]) col++;
  });
  scheduleSave(); render(); showToast('已整理画布');
}

// ==================== 计划 (GET /api/plan/nodes, POST /api/plan/generate) ====================
async function addNodeToPlan(nodeId){
  const id=nodeId||state.selectedId; if(!id) return;
  const node=state.nodes.find(n=>n.id===id); if(!node) return;
  if(node.kind!=='action'&&node.kind!=='project'&&node.kind!=='goal'){
    showToast('只有行动、项目可以加入今日计划'); return;
  }
  try{
    // 使用 CommandBus 安排日程
    if (window.CommandBus) {
      const today = new Date().toISOString().slice(0, 10);
      // 估算一个时间（上午10点开始，或按现有时间）
      let startTime = '10:00';
      let duration = node.duration_minutes || node.estimatedMinutes || 60;
      if (duration > 180) duration = 60; // 太长的默认1小时
      const startMin = DataModel.timeToMinutes(startTime);
      const endTime = DataModel.minutesToTime(startMin + duration);

      const result = CommandBus.scheduleAction({
        nodeId: id,
        date: today,
        startTime,
        endTime,
        blockType: node.domain === 'work' ? 'work' : node.domain,
      });

      // 同步回 state（通过事件应该已经同步了，这里保险一下）
      if (result && result.node) {
        const idx = state.nodes.findIndex(n => n.id === id);
        if (idx >= 0) {
          state.nodes[idx] = { ...state.nodes[idx], ...CoreBridge.storeNodeToCanvas(result.node) };
        }
      }

      scheduleSave(); render(); showToast('已加入今日计划');
      return;
    }

    // 降级：旧逻辑
    await apiPost('/api/plan/generate',{nodeId:node.id,title:node.title,kind:node.kind});
  }catch(e){ console.warn('生成计划失败,本地标记:',e.message); }
  node.phase='planned';
  if(node.commitment==='observed'||node.commitment==='interested'||node.commitment==='intended') node.commitment='scheduled';
  node.executionStatus='scheduled'; node.updatedAt=new Date().toISOString();
  scheduleSave(); render(); showToast('已加入今日计划');
}
async function loadPlanNodes(){
  try{ return await apiGet('/api/plan/nodes'); }catch(e){ return null; }
}

async function decideCandidate(candidateId, decision){
  const cand=state.candidates.find(c=>c.id===candidateId);
  if(!cand) return;
  if(decision==='accepted'){
    const p=cand.proposal||{};
    const node=makeNodeFromCandidate({title:p.title||cand.originalText,kind:p.kind,commitment:p.commitment,confidence:p.confidence,evidence:p.evidence});
    node.confirmationStatus='confirmed';
    state.nodes.push(node);
  }
  cand.status=decision;
  scheduleSave(); render(); renderCandidateInbox(); updateAIPanel();
}

  }, 50);
}

// 确认创建节点
function confirmNodeCreate(nodeId) {
  const input = document.getElementById('nodeTitleInput');
  const title = input?.value?.trim();
  
  if (!title) {
    input?.focus();
    return;
  }
  
  const node = state.nodes.find(n => n.id === nodeId);
  if (node) {
    node.title = title;
    node.isDraft = false;
    node.confirmationStatus = 'confirmed';
    node.phase = 'incubation';
  }
  
  // 关闭模态框
  const modal = document.getElementById('nodeInputModal');
  if (modal) modal.remove();
  
  renderNodes();
  renderRelations();
  selectNode(nodeId);
  updateDomainCounts();
}

// 取消创建节点
function cancelNodeCreate(nodeId) {
  // 删除草稿节点
  state.nodes = state.nodes.filter(n => n.id !== nodeId);
  
  // 关闭模态框
  const modal = document.getElementById('nodeInputModal');
  if (modal) modal.remove();
  
  renderNodes();
  renderRelations();
  deselectNode();
}

// 从tips创建节点
function createTipNode(kind, title) {
  const center = getCanvasCenter();
  const nodeId = 'node_' + Date.now();
  const newNode = {
    id: nodeId,
    kind: kind,
    title: title,
    phase: 'incubation',
    confirmationStatus: 'confirmed',
    executionStatus: 'backlog',
    domain: 'life',
    layout: {
      x: center.x + 100,
      y: center.y - 50,
      zIndex: 10
    }
  };
  
  state.nodes.push(newNode);
  renderNodes();
  renderRelations();
  selectNode(nodeId);
  updateDomainCounts();
  showToast('已添加到画布');
}

// AI寻找想做的事情
function findGoalsAI() {
  const btn = document.querySelector('.find-goal-btn');
  if (btn) {
    btn.innerHTML = '<i class="ti ti-loader-2 ti-spin"></i> 正在思考...';
    btn.disabled = true;
  }
  
  // 模拟AI生成目标建议
  setTimeout(() => {
    const goals = [
      { title: '学习一门新技能', reason: '提升个人竞争力' },
      { title: '开始健身计划', reason: '保持身体健康' },
      { title: '读完10本书', reason: '扩展知识面' },
      { title: '学习投资理财', reason: '实现财务自由' },
      { title: '环游世界', reason: '开阔视野' },
    ];
    
    // 随机选3个作为建议
    const shuffled = goals.sort(() => Math.random() - 0.5);
    const suggestions = shuffled.slice(0, 3);
    
    // 在右侧面板显示建议
    const body = document.getElementById('detailPanelBody');
    if (body) {
      body.innerHTML = `
        <div style="padding: 20px 16px;">
          <div style="font-size: 15px; font-weight: 700; color: var(--text-primary); margin-bottom: 16px;">
            🎯 为你推荐的目标
          </div>
          <div style="display: flex; flex-direction: column; gap: 12px;">
            ${suggestions.map((g, i) => `
              <div style="padding: 14px; background: #F8F9FA; border-radius: 12px; cursor: pointer; transition: all .15s;" 
                   onmouseover="this.style.background='#F0F4FF'" 
                   onmouseout="this.style.background='#F8F9FA'"
                   onclick="addRecommendedGoal('${g.title}', '${g.reason}')">
                <div style="font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px;">
                  ${g.title}
                </div>
                <div style="font-size: 12px; color: var(--text-muted);">
                  ${g.reason}
                </div>
                <div style="margin-top: 8px; font-size: 12px; color: var(--accent); font-weight: 500;">
                  点击添加 →
                </div>
              </div>
            `).join('')}
          </div>
          <div style="margin-top: 20px; text-align: center;">
            <button onclick="findGoalsAI()" style="background: none; border: none; color: var(--accent); font-size: 13px; cursor: pointer; font-weight: 500;">
              换一批
            </button>
          </div>
        </div>
      `;
    }
  }, 800);
}

// 添加推荐的目标到画布
function addRecommendedGoal(title, reason) {
  const center = getCanvasCenter();
  const nodeId = 'node_' + Date.now();
  const newNode = {
    id: nodeId,
    kind: 'goal',
    title: title,
    phase: 'incubation',
    confirmationStatus: 'confirmed',
    executionStatus: 'backlog',
    domain: 'life',
    description: reason,
    layout: {
      x: center.x,
      y: center.y,
      zIndex: 10
    }
  };
  
  state.nodes.push(newNode);
  renderNodes();
  renderRelations();
  selectNode(nodeId);
  updateDomainCounts();
  showToast('已添加目标到画布');
}

// 获取画布中心位置（世界坐标）
function getCanvasCenter() {
  const viewport = document.getElementById('canvasViewport');
  if (!viewport) return { x: 200, y: 200 };
  const rect = viewport.getBoundingClientRect();
  return {
    x: (rect.width / 2 - state.viewport.x) / state.viewport.scale,
    y: (rect.height / 2 - state.viewport.y) / state.viewport.scale
  };
}

// 渲染候选面板
function renderCandidatePanel() {
  const list = document.getElementById('candidatePanelList');
  if (!list) return;
  
  const candidates = state.candidates?.length ? state.candidates : demoCandidates;
  
  document.getElementById('candidatePanelCount').textContent = candidates.length;
  
  list.innerHTML = candidates.map(c => {
    const kindColor = kindColors[c.kind] || '#6B7B74';
    const domainColor = domainColors[c.domain] || '#98A1AD';
    const kindLabel = kindLabels[c.kind] || c.kind;
    const domainLabel = domainLabels[c.domain] || c.domain;
    
    return `
      <div class="candidate-card" data-id="${c.id}" onclick="acceptCandidate('${c.id}')">
        <div class="candidate-card-header">
          <div class="candidate-card-type" style="color: ${kindColor};">
            <span class="type-dot" style="background: ${domainColor};"></span>
            ${domainLabel} · ${kindLabel}
          </div>
          <div class="candidate-card-progress">${c.progressText || ''}</div>
        </div>
        <div class="candidate-card-title">${escapeHtml(c.title)}</div>
        <div class="candidate-card-sub">${escapeHtml(c.sub || '')}</div>
        <div class="candidate-card-actions">
          <button class="candidate-card-btn primary" onclick="event.stopPropagation(); acceptCandidate('${c.id}')">确认</button>
          <button class="candidate-card-btn" onclick="event.stopPropagation(); modifyCandidate('${c.id}')">修改</button>
          <button class="candidate-card-btn" onclick="event.stopPropagation(); ignoreCandidate('${c.id}')">忽略</button>
        </div>
      </div>
    `;
  }).join('');
}

// 确认候选
function acceptCandidate(id) {
  const candidates = state.candidates?.length ? state.candidates : demoCandidates;
  const c = candidates.find(x => x.id === id);
  if (!c) return;
  
  // 在画布中心创建节点
  const vp = document.getElementById('canvasViewport').getBoundingClientRect();
  const w = screenToWorld(vp.left + vp.width / 2, vp.top + vp.height / 2);
  
  const now = new Date().toISOString();
  const newNode = {
    id: 'node_' + (state.nextId++),
    title: c.title,
    kind: c.kind,
    commitment: 'intended',
    confirmationStatus: 'confirmed',
    executionStatus: 'unplanned',
    phase: 'confirmed',
    source: 'candidate',
    confidence: c.progress / 100 || 0.7,
    domain: c.domain,
    layout: { x: w.x - 100, y: w.y - 91, isPinned: false, zIndex: 1 },
    origins: [{ source: 'candidate', originalText: c.title, createdAt: now }],
    createdBy: 'ai',
    createdAt: now,
    updatedAt: now,
  };
  
  state.nodes.push(newNode);
  pushUndo({ type: 'CREATE_NODE', node: newNode });
  
  // 从候选列表移除
  if (state.candidates?.length) {
    state.candidates = state.candidates.filter(x => x.id !== id);
  }
  
  scheduleSave();
  render();
  renderCandidatePanel();
  selectNode(newNode.id);
  showToast('已确认并添加到画布');
}

function modifyCandidate(id) {
  showToast('修改功能开发中...');
}

function ignoreCandidate(id) {
  if (state.candidates?.length) {
    state.candidates = state.candidates.filter(x => x.id !== id);
  }
  renderCandidatePanel();
  showToast('已忽略');
}

// 节点编辑面板：关闭后可从顶部铅笔入口或再次选择节点重新打开
let detailPanelVisible = true;
function setDetailPanelVisible(visible) {
  const panel = document.getElementById('detailPanel');
  if (!panel) return;
  detailPanelVisible = visible;
  panel.style.display = visible ? 'flex' : 'none';
}
function toggleDetailPanel() {
  setDetailPanelVisible(!detailPanelVisible);
}
function openDetailPanel() {
  setDetailPanelVisible(true);
  if (state.selectedId) renderDetailPanel(state.selectedId);
}

// 渲染详情面板
function renderDetailPanel(nodeId) {
  const body = document.getElementById('detailPanelBody');
  if (!body) return;
  
  const node = state.nodes.find(n => n.id === nodeId);
  if (!node) {
    body.innerHTML = `
      <div class="detail-empty">
        <div class="detail-empty-icon" style="font-size: 48px; margin-bottom: 16px;">🎯</div>
        <div style="font-size: 15px; font-weight: 600; color: var(--text-primary); margin-bottom: 8px;">还没有选择目标</div>
        <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 24px; line-height: 1.6;">
          选择画布上的一个节点查看详情<br>或让伴伴帮你寻找想做的事情
        </div>
        <button class="find-goal-btn" onclick="findGoalsAI()">
          <i class="ti ti-sparkles"></i>
          寻找想做的事情
        </button>
      </div>
    `;
    return;
  }
  
  const ks = getKindStyle(node.kind);
  const confL = getConfirmationLabel(node);
  const execL = getExecutionLabel(node);
  
  // 计算进度
  let progress = 0;
  let progressText = '0%';
  if (node.kind === 'action') {
    if (node.executionStatus === 'done') { progress = 100; progressText = '100%'; }
    else if (node.executionStatus === 'in_progress') { progress = 50; progressText = '进行中'; }
    else if (node.executionStatus === 'scheduled') { progress = 20; progressText = '已安排'; }
  } else if (node.kind === 'goal' || node.kind === 'outcome' || node.kind === 'project') {
    // 计算子行动的完成率
    const childRels = state.relations.filter(r => 
      (r.relation === 'decomposes_to' || r.relation === 'belongs_to') && 
      r.targetNodeId === node.id
    );
    const childActions = childRels.map(r => state.nodes.find(n => n.id === r.sourceNodeId)).filter(Boolean);
    const doneCount = childActions.filter(n => n.executionStatus === 'done').length;
    if (childActions.length > 0) {
      progress = Math.round((doneCount / childActions.length) * 100);
      progressText = `${doneCount}/${childActions.length} 完成`;
    }
  }
  
  // 关联节点
  const relatedRels = state.relations.filter(r => 
    r.sourceNodeId === node.id || r.targetNodeId === node.id
  );
  const relatedNodes = relatedRels.map(r => {
    const otherId = r.sourceNodeId === node.id ? r.targetNodeId : r.sourceNodeId;
    return state.nodes.find(n => n.id === otherId);
  }).filter(Boolean).slice(0, 5);
  
  body.innerHTML = `
    <div class="detail-type-tag" style="background: ${ks.bg}; color: ${ks.color};">
      <i class="ti ${getTypeIcon(node.kind)}"></i>
      ${ks.label}
    </div>
    
    <div class="detail-type-changer">
      <div class="detail-type-changer-label">修改类型</div>
      <div class="detail-type-grid">
        ${[
          {kind:'goal', label:'目标', icon:'ti-target'},
          {kind:'project', label:'项目', icon:'ti-briefcase'},
          {kind:'action', label:'行动', icon:'ti-bolt'},
          {kind:'habit', label:'习惯', icon:'ti-repeat'},
          {kind:'record', label:'记录', icon:'ti-notes'},
          {kind:'observation', label:'观察', icon:'ti-eye'},
          {kind:'question', label:'想法', icon:'ti-help-circle'},
        ].map(t => {
          const tks = getKindStyle(t.kind);
          return `
            <div class="detail-type-option ${node.kind === t.kind ? 'active' : ''}" 
                 onclick="changeNodeType('${node.id}', '${t.kind}')"
                 title="${t.label}">
              <div class="detail-type-option-icon" style="background: ${tks.bg}; color: ${tks.color};">
                <i class="ti ${t.icon}"></i>
              </div>
              <span class="detail-type-option-name">${t.label}</span>
            </div>
          `;
        }).join('')}
      </div>
    </div>
    
    <div class="detail-title">${escapeHtml(node.title || '')}</div>
    
    <div class="detail-section">
      <div class="detail-section-label">为什么重要</div>
      <div class="detail-section-content">
        这是当前作品集主线的核心成果，会影响求职材料和后续展示节奏。
      </div>
    </div>
    
    <div class="detail-section">
      <div class="detail-section-label">进度</div>
      <div class="detail-progress-bar">
        <div class="detail-progress-fill" style="width: ${progress}%; background: ${ks.color};"></div>
      </div>
      <div class="detail-progress-text">${progressText}</div>
    </div>
    
    <div class="detail-section">
      <div class="detail-section-label">关联节点</div>
      <div class="detail-related">
        ${relatedNodes.length ? relatedNodes.map(n => {
          const nks = getKindStyle(n.kind);
          return `
            <div class="detail-related-item" onclick="selectNode('${n.id}'); centerOnNode('${n.id}');">
              <div class="detail-related-icon" style="background: ${nks.bg}; color: ${nks.color};">
                <i class="ti ${getTypeIcon(n.kind)}"></i>
              </div>
              <div class="detail-related-text">${escapeHtml(n.title)}</div>
            </div>
          `;
        }).join('') : '<div style="font-size:12px;color:var(--text-muted);padding:8px 0;">暂无关联节点</div>'}
      </div>
    </div>
    
    <!-- AI 操作区域 -->
    <div class="detail-ai-actions">
      <button class="detail-ai-btn expand" onclick="aiExpandSelected('${node.id}')">
        <i class="ti ti-sparkles"></i>
        AI 联想
      </button>
      ${(['goal','project','outcome','habit'].includes(node.kind)) ? `
      <button class="detail-ai-btn decompose" onclick="aiDecomposeSelected('${node.id}')">
        <i class="ti ti-split"></i>
        AI 拆分
      </button>
      ` : `
      <button class="detail-ai-btn decompose" disabled title="该类型暂不支持拆分">
        <i class="ti ti-split"></i>
        AI 拆分
      </button>
      `}
    </div>
    
    <div style="margin-top: 8px;">
      <button class="detail-action-btn primary" onclick="addNodeToPlan('${node.id}')">
        加入今日路径 →
      </button>
      <button class="detail-action-btn secondary" onclick="startInlineEdit('${node.id}')">
        编辑节点
      </button>
    </div>
  `;
}

// 修改节点类型
function changeNodeType(nodeId, newKind) {
  const node = state.nodes.find(n => n.id === nodeId);
  if (!node || node.kind === newKind) return;
  
  pushUndo({type:'UPDATE_NODE', nodeId, before:{kind: node.kind}});
  node.kind = newKind;
  node.updatedAt = new Date().toISOString();
  scheduleSave();
  render();
  renderDetailPanel(nodeId);
  showToast(`已切换为${getKindStyle(newKind).label}类型`);
}

function getTypeIcon(kind) {
  const icons = {
    goal: 'ti-target',
    outcome: 'ti-flag',
    project: 'ti-briefcase',
    action: 'ti-bolt',
    habit: 'ti-repeat',
    record: 'ti-notes',
    observation: 'ti-eye',
    question: 'ti-help-circle',
    desire: 'ti-lightbulb',
  };
  return icons[kind] || 'ti-circle';
}

function centerOnNode(nodeId) {
  const node = state.nodes.find(n => n.id === nodeId);
  if (!node) return;
  const vp = document.getElementById('canvasViewport').getBoundingClientRect();
  const p = getDisplayPosition(node);
  const size = getNodeSize(node.kind);
  state.viewport.scale = 1;
  state.viewport.x = vp.width / 2 - p.x - size.w / 2;
  state.viewport.y = vp.height / 2 - p.y - size.h / 2;
  render();
}

// 重写 selectNode 以包含详情面板渲染
const _originalSelectNode = selectNode;
selectNode = function(id) {
  _originalSelectNode(id);
  openDetailPanel();
  renderDetailPanel(id);
};

</script>
</body>
