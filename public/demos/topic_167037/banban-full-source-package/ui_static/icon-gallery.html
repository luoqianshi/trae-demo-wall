<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伴伴 · 图标库</title>
<link rel="stylesheet" href="/figma-design-system.css">
<style>
/* ================================================================
   icon-gallery.html — 图标库展示页面
   ================================================================ */

.gallery-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 32px;
  display: flex;
  flex-direction: column;
  gap: 32px;
}

/* ---- 搜索栏 */
.gallery-search-wrap {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--bg-page);
  padding-bottom: 16px;
  padding-top: 8px;
}
.gallery-search {
  width: 100%;
  max-width: 480px;
  height: 48px;
  padding: 0 20px 0 52px;
  background: var(--bg-card);
  border: 1.5px solid var(--border);
  border-radius: var(--r-pill);
  font-family: var(--font-sans);
  font-size: 15px;
  color: var(--text-primary);
  outline: none;
  transition: border-color var(--transition), box-shadow var(--transition);
  box-shadow: var(--shadow-sm);
}
.gallery-search:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-light);
}
.gallery-search-icon {
  position: absolute;
  left: 18px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-faint);
  font-size: 20px;
  pointer-events: none;
}
.gallery-stats {
  margin-top: 12px;
  font-size: 13px;
  color: var(--text-muted);
}
.gallery-stats strong {
  color: var(--accent);
  font-weight: 600;
}

/* ---- 分类标题 */
.gallery-category {
  margin-bottom: 8px;
}
.gallery-category-title {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-secondary);
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.gallery-category-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border-light);
}
.gallery-category-icon {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--accent-light);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  color: var(--accent);
}

/* ---- 图标网格 ---- */
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px;
}

/* ---- 图标卡片 ---- */
.icon-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 20px 16px 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  transition: all 0.2s ease;
  position: relative;
  overflow: hidden;
}
.icon-card:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(47, 128, 237, 0.15);
}
.icon-card-icon {
  font-size: 28px;
  color: var(--text-primary);
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 48px;
  height: 48px;
  border-radius: 12px;
  background: var(--accent-light);
  color: var(--accent);
}
.icon-card-label {
  font-size: 12px;
  color: var(--text-secondary);
  text-align: center;
  line-height: 1.3;
  font-weight: 500;
}
.icon-card-key {
  font-size: 10.5px;
  color: var(--text-faint);
  font-family: var(--font-mono);
  background: var(--bg-hover);
  padding: 2px 6px;
  border-radius: 4px;
  margin-top: -4px;
}
.icon-card-copy {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 24px;
  height: 24px;
  border-radius: 6px;
  background: var(--bg-hover);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: var(--text-muted);
  opacity: 0;
  transition: all 0.2s ease;
}
.icon-card:hover .icon-card-copy {
  opacity: 1;
}
.icon-card-copy:hover {
  background: var(--accent);
  color: #fff;
}

/* ---- 空状态 ---- */
.gallery-empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}
.gallery-empty-icon {
  font-size: 48px;
  margin-bottom: 16px;
  opacity: 0.5;
}
.gallery-empty-text {
  font-size: 14px;
}

/* ---- Toast ---- */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--text-primary);
  color: #fff;
  padding: 12px 24px;
  border-radius: var(--r-pill);
  font-size: 13px;
  font-weight: 500;
  z-index: 9999;
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  align-items: center;
  gap: 8px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
}
.toast.show {
  transform: translateX(-50%) translateY(0);
}
.toast-icon {
  font-size: 16px;
}

/* ---- 响应式 ---- */
@media (max-width: 768px) {
  .gallery-content {
    padding: 20px 16px;
  }
  .gallery-grid {
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 8px;
  }
  .icon-card {
    padding: 16px 10px 10px;
  }
  .icon-card-icon {
    font-size: 24px;
    width: 40px;
    height: 40px;
  }
}
</style>
</head>
<body>
<div class="app-layout" id="app-layout">
  <!-- 侧边栏占位 -->
  <div id="sidebar-placeholder"></div>

  <!-- 主内容区 -->
  <main class="app-main">
    <div id="header-placeholder"></div>

    <div class="app-content">
      <div class="gallery-content">
        <!-- 搜索栏 -->
        <div class="gallery-search-wrap">
          <div style="position: relative; display: inline-block;">
            <i class="ti ti-search gallery-search-icon"></i>
            <input type="text" class="gallery-search" id="iconSearch" placeholder="搜索图标..." oninput="filterIcons(this.value)">
          </div>
          <div class="gallery-stats">
            共 <strong id="iconCount">0</strong> 个图标 · 基于 Tabler Icons (MIT License)
          </div>
        </div>

        <!-- 图标展示区 -->
        <div id="iconGallery">
          <!-- 动态生成 -->
        </div>

        <!-- 空状态 -->
        <div class="gallery-empty" id="emptyState" style="display:none;">
          <div class="gallery-empty-icon">🔍</div>
          <div class="gallery-empty-text">没有找到匹配的图标</div>
        </div>
      </div>
    </div>
  </main>

  <!-- AI 助手面板占位 -->
  <div id="ai-placeholder"></div>
</div>

<!-- Toast 提示 -->
<div class="toast" id="copyToast">
  <span class="toast-icon">✓</span>
  <span>已复制到剪贴板</span>
</div>

<script src="/banban-icons.js"></script>
<script src="/figma-components.js"></script>
<script>
// 图标分类（用于分组展示）
const ICON_CATEGORIES = [
  { key: 'task_cats', label: '任务大类', icon: '📁', prefix: '' },
  { key: 'activity', label: '活动类型', icon: '⚡', prefix: '' },
  { key: 'weekly', label: '周规划分类', icon: '📅', prefix: '' },
  { key: 'status', label: '任务状态', icon: '✅', prefix: 'status_' },
  { key: 'nav', label: '导航图标', icon: '🧭', prefix: 'nav_' },
  { key: 'action', label: '页面操作', icon: '🎯', prefix: 'action_' },
  { key: 'mood', label: '心情情绪', icon: '😊', prefix: 'mood_' },
  { key: 'time', label: '时间周期', icon: '⏰', prefix: 'time_' },
  { key: 'stat', label: '统计数据', icon: '📊', prefix: 'stat_' },
  { key: 'canvas', label: '画布节点', icon: '🎨', prefix: 'canvas_' },
  { key: 'ai', label: 'AI伴伴', icon: '🤖', prefix: 'ai_' },
  { key: 'file', label: '文件附件', icon: '📄', prefix: 'file_' },
  { key: 'settings', label: '设置偏好', icon: '⚙️', prefix: 'set_' },
  { key: 'social', label: '社交互动', icon: '💬', prefix: '' },
  { key: 'ecommerce', label: '电商商业', icon: '🛒', prefix: '' },
  { key: 'device', label: '设备硬件', icon: '📱', prefix: 'device_' },
  { key: 'weather', label: '天气自然', icon: '☀️', prefix: 'weather_' },
  { key: 'security', label: '安全保护', icon: '🛡️', prefix: '' },
  { key: 'arrow', label: '箭头方向', icon: '➡️', prefix: 'arrow_' },
  { key: 'edit', label: '编辑书写', icon: '✏️', prefix: '' },
  { key: 'view', label: '视图布局', icon: '🖼️', prefix: 'view_' },
  { key: 'misc', label: '杂项图标', icon: '✨', prefix: '' },
];

// 所有图标键列表
let allIcons = [];

// 初始化
document.addEventListener('DOMContentLoaded', () => {
  initPage('', {
    header: { title: '图标库', subtitle: '伴伴内部图标系统', showControls: false },
    ai: { insight: '这是图标库页面，你可以在这里浏览和搜索所有可用图标，点击图标可以复制使用。' }
  });

  // 获取所有图标
  const iconMap = BanbanIcon.list();
  allIcons = Object.entries(iconMap).map(([key, value]) => ({
    key,
    ...value
  }));

  // 更新计数
  document.getElementById('iconCount').textContent = allIcons.length;

  // 渲染图标
  renderIcons(allIcons);
});

// 按分类渲染图标
function renderIcons(icons) {
  const gallery = document.getElementById('iconGallery');
  const emptyState = document.getElementById('emptyState');

  if (icons.length === 0) {
    gallery.innerHTML = '';
    emptyState.style.display = 'block';
    return;
  }

  emptyState.style.display = 'none';

  // 按分类分组
  const groups = {};

  icons.forEach(icon => {
    const category = getCategory(icon.key);
    if (!groups[category]) {
      groups[category] = [];
    }
    groups[category].push(icon);
  });

  // 生成HTML
  let html = '';

  for (const cat of ICON_CATEGORIES) {
    const groupIcons = groups[cat.key] || [];
    if (groupIcons.length === 0) continue;

    html += `
      <div class="gallery-category">
        <div class="gallery-category-title">
          <span class="gallery-category-icon">${cat.icon}</span>
          ${cat.label}
          <span style="font-size:12px;color:var(--text-faint);font-weight:400;text-transform:none;letter-spacing:normal;">(${groupIcons.length})</span>
        </div>
        <div class="gallery-grid">
          ${groupIcons.map(icon => `
            <div class="icon-card" onclick="copyIcon('${icon.key}')" title="点击复制: ${icon.key}">
              <div class="icon-card-copy"><i class="ti ti-copy"></i></div>
              <div class="icon-card-icon">${BanbanIcon.get(icon.key)}</div>
              <div class="icon-card-label">${icon.label}</div>
              <div class="icon-card-key">${icon.key}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  gallery.innerHTML = html;
}

// 获取图标分类
function getCategory(key) {
  if (['work', 'study', 'life', 'team', 'exercise', 'rest') return 'task_cats';
  if (['research', 'design', 'communication', 'documentation', 'coding', 'reading', 'writing', 'thinking', 'meeting'].includes(key)) return 'activity';
  if (['strategy', 'execution', 'recovery'].includes(key)) return 'weekly';
  if (key.startsWith('status_')) return 'status';
  if (key.startsWith('nav_')) return 'nav';
  if (key.startsWith('action_')) return 'action';
  if (key.startsWith('mood_')) return 'mood';
  if (key.startsWith('time_')) return 'time';
  if (key.startsWith('stat_')) return 'stat';
  if (key.startsWith('canvas_')) return 'canvas';
  if (key.startsWith('ai_')) return 'ai';
  if (key.startsWith('file_')) return 'file';
  if (key.startsWith('set_')) return 'settings';
  if (['like', 'comment', 'share', 'follow', 'bookmark', 'reply', 'mention'].includes(key)) return 'social';
  if (['cart', 'wallet', 'credit_card', 'gift', 'discount', 'receipt', 'coin'].includes(key)) return 'ecommerce';
  if (key.startsWith('device_') || ['headphone', 'camera'].includes(key)) return 'device';
  if (key.startsWith('weather_') || ['temperature', 'location'].includes(key)) return 'weather';
  if (['shield', 'lock', 'unlock', 'key', 'fingerprint', 'face_id', 'verified'].includes(key)) return 'security';
  if (key.startsWith('arrow_') || ['refresh', 'sync'].includes(key)) return 'arrow';
  if (['edit', 'write', 'erase', 'cut', 'copy', 'paste', 'undo', 'redo', 'select'].includes(key)) return 'edit';
  if (key.startsWith('view_') || ['zoom_in', 'zoom_out'].includes(key)) return 'view';
  return 'misc';
}

// 搜索过滤
function filterIcons(keyword) {
  const kw = keyword.toLowerCase().trim();
  if (!kw) {
    renderIcons(allIcons);
    document.getElementById('iconCount').textContent = allIcons.length;
    return;
  }

  const filtered = allIcons.filter(icon =>
    icon.key.toLowerCase().includes(kw) ||
    icon.label.toLowerCase().includes(kw) ||
    icon.icon.toLowerCase().includes(kw)
  );

  document.getElementById('iconCount').textContent = filtered.length;
  renderIcons(filtered);
}

// 复制图标
function copyIcon(key) {
  const iconHtml = BanbanIcon.get(key);
  // 复制 key
  const textToCopy = `BanbanIcon.get('${key}')`;

  if (navigator.clipboard) {
    navigator.clipboard.writeText(key).then(() => {
      showToast('已复制: ' + key);
    });
  } else {
    // 降级方案
    const textarea = document.createElement('textarea');
    textarea.value = key;
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand('copy');
    document.body.removeChild(textarea);
    showToast('已复制: ' + key);
  }
}

// 显示 Toast
function showToast(message) {
  const toast = document.getElementById('copyToast');
  toast.querySelector('span:last-child').textContent = message;
  toast.classList.add('show');
  setTimeout(() => {
    toast.classList.remove('show');
  }, 2000);
}
</script>
</body>
</html>
