<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伴伴 · 聊天</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Microsoft YaHei UI', 'Segoe UI', sans-serif;
    background: #F8F4ED;
    color: #5A4A3A;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  /* 顶栏 */
  .header {
    background: #E8927C;
    color: white;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 2px 12px rgba(232, 146, 124, 0.3);
  }
  .header .dot { width: 10px; height: 10px; border-radius: 50%; background: #7CB5A8; }
  .header h1 { font-size: 17px; font-weight: 600; }
  /* 聊天区 */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .bubble {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.7;
    word-break: break-word;
    animation: fadeIn 0.3s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .bubble.user {
    background: #E8927C;
    color: white;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .bubble.ai {
    background: white;
    color: #5A4A3A;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
    box-shadow: 0 2px 8px rgba(139, 111, 92, 0.08);
  }
  .bubble.system {
    background: #F0EBE3;
    color: #9B8B7A;
    font-size: 12px;
    align-self: center;
    padding: 8px 14px;
  }
  /* 输入栏 */
  .input-bar {
    background: #F0EBE3;
    padding: 12px 16px;
    display: flex;
    gap: 10px;
    align-items: center;
    border-top: 1px solid #E8E0D5;
  }
  .input-bar input {
    flex: 1;
    height: 40px;
    border: 1px solid #E8E0D5;
    border-radius: 20px;
    padding: 0 16px;
    font-size: 14px;
    font-family: inherit;
    background: white;
    outline: none;
    transition: border-color 0.2s;
  }
  .input-bar input:focus { border-color: #E8927C; }
  .btn-voice {
    width: 44px; height: 44px;
    border: none; border-radius: 50%;
    background: #E8927C;
    color: white; font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .btn-voice:hover { background: #D17B66; transform: scale(1.05); }
  .btn-voice.recording { background: #EF4444; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
  .btn-send {
    height: 40px; padding: 0 20px;
    border: none; border-radius: 20px;
    background: #E8927C; color: white;
    font-size: 14px; font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-send:hover { background: #D17B66; }
  .btn-send:disabled { background: #D4B5AA; cursor: not-allowed; }
  /* 录音状态 */
  .recording-status {
    text-align: center;
    padding: 8px;
    color: #EF4444;
    font-size: 12px;
    display: none;
  }
  .recording-status.active { display: block; }
</style>
</head>
<body>
  <div class="header">
    <div class="dot"></div>
    <h1>伴伴</h1>
  </div>
  <div class="chat-area" id="chatArea"></div>
  <div class="recording-status" id="recStatus">正在录音... 点击麦克风结束</div>
  <div class="input-bar">
    <button class="btn-voice" id="btnVoice" onclick="toggleVoice()">🎤</button>
    <input type="text" id="chatInput" placeholder="说点什么..." onkeydown="if(event.key==='Enter')sendMessage()">
    <button class="btn-send" id="btnSend" onclick="sendMessage()">发送</button>
  </div>

<script>
const API = 'http://127.0.0.1:9527/api';
let isRecording = false;

// 初始化欢迎消息
addBubble('ai', '你好呀，我是伴伴~ 有什么想聊的，打字或者点麦克风说话都可以');

function addBubble(who, text) {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'bubble ' + who;
  div.textContent = text;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  
  addBubble('user', text);
  
  const btn = document.getElementById('btnSend');
  btn.textContent = '...';
  btn.disabled = true;
  
  try {
    const r = await fetch(API + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    const data = await r.json();
    if (data.ok) {
      addBubble('ai', data.reply);
    } else {
      addBubble('system', 'AI 暂时没有回应: ' + (data.error || '未知错误'));
    }
  } catch (e) {
    addBubble('system', '连接失败，请确认伴伴服务已启动');
  }
  
  btn.textContent = '发送';
  btn.disabled = false;
}

async function toggleVoice() {
  const btn = document.getElementById('btnVoice');
  const status = document.getElementById('recStatus');
  
  if (!isRecording) {
    // 开始录音
    try {
      const r = await fetch(API + '/voice/start', { method: 'POST' });
      const data = await r.json();
      if (data.ok) {
        isRecording = true;
        btn.textContent = '⏹';
        btn.classList.add('recording');
        status.classList.add('active');
      } else {
        addBubble('system', '无法启动录音: ' + (data.error || '请检查麦克风'));
      }
    } catch (e) {
      addBubble('system', '连接失败，请确认伴伴服务已启动');
    }
  } else {
    // 停止录音并识别
    btn.textContent = '🎤';
    btn.classList.remove('recording');
    status.classList.remove('active');
    isRecording = false;
    
    addBubble('system', '识别中...');
    
    try {
      const r = await fetch(API + '/voice/stop', { method: 'POST' });
      const data = await r.json();
      
      // 移除"识别中"提示
      const area = document.getElementById('chatArea');
      area.lastChild.remove();
      
      if (data.ok && data.text) {
        addBubble('user', data.text);
        
        // 自动发送给 AI
        const btn = document.getElementById('btnSend');
        btn.textContent = '...';
        btn.disabled = true;
        
        const r2 = await fetch(API + '/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: data.text })
        });
        const data2 = await r2.json();
        
        if (data2.ok) {
          addBubble('ai', data2.reply);
        } else {
          addBubble('system', 'AI 回复失败: ' + (data2.error || ''));
        }
        
        btn.textContent = '发送';
        btn.disabled = false;
      } else {
        addBubble('system', data.error || '没有识别到语音，请再试一次');
      }
    } catch (e) {
      addBubble('system', '语音识别连接失败');
    }
  }
}
</script>
</body>
</html>
