        <div class="clarification-options">
          ${options.map((opt, i) => `
            <button class="clarification-option" onclick="applyClarifyAnswer(${i})">
              ${opt.label}
            </button>
          `).join('')}
        </div>
      </div>
    `;
    state._pendingClarifyAnswer = { result, node };
  } catch(e) {
    showAIError('澄清失败：' + e.message);
  }
}

function applyClarifyAnswer(index) {
  const { result, node } = state._pendingClarifyAnswer;
  const opt = result.options[index];
  if (!opt || !node) return;

  // 文档13.6：AI返回patchProposal，用户确认才更新正式节点
  const patch = {};
  if (opt.resultingKind) patch.kind = opt.resultingKind;
  if (opt.resultingCommitment) patch.commitment = opt.resultingCommitment;

  // 构造 patchProposal 展示给用户确认
  const reason = opt.reason || `根据你的回答"${opt.label}"，将节点类型调整为 ${opt.resultingKind || node.kind}，承诺程度调整为 ${opt.resultingCommitment || node.commitment}`;
  const patchDisplay = Object.entries(patch).map(([k, v]) => {
    const labels = { kind: '内容类型', commitment: '承诺程度' };
    return `${labels[k] || k}: ${node[k] || '无'} → ${v}`;
  }).join('\n');

  if (!window.confirm(`AI 建议更新：\n\n${patchDisplay}\n\n理由：${reason}\n\n确认应用此更新？`)) {
    showToast('已取消更新');
    updateAIDock();
    return;
  }

  Object.assign(node, patch);
  node.updatedAt = new Date().toISOString();

  if (!state.mockMode) {
    queueMutation({ type: 'UPDATE_NODE', nodeId: node.id, patch });
  }
  render();
  showToast('已更新节点');
  updateAIDock();
}

async function aiClusterSuggest() {
  showAIThinking('正在分析归类...');

  try {
    const ungrouped = state.nodes.filter(n => !(n.layout || {}).groupId);
    let result;
    if (state.mockMode) {
      result = { clusters: [] };
    } else {
      try {
        result = await apiPost('/api/canvas/cluster-suggestions', {});
        if (result.error) {
          console.warn('AI归类失败:', result.error);
          result = { clusters: [] };
        }
      } catch(e) {
        console.warn('AI连接失败:', e.message);
        result = { clusters: [] };
      }
    }

    const clusters = result.clusters || [];
    if (clusters.length === 0) {
      showAIInfo('暂时没有发现可以归类的节点。');
      return;
    }

    const content = document.getElementById('aiContent');
    content.innerHTML = '<div class="ai-card"><div class="ai-card-label">AI 归类建议</div></div>';
    clusters.forEach((cl, i) => {
      const item = document.createElement('div');
      item.className = 'ai-suggestion-item';
      item.innerHTML = `
        <div class="ai-suggestion-body">
          <div class="ai-suggestion-title">${cl.title}</div>
          <div style="font-size:11px;color:var(--text-light);margin-bottom:4px;">${cl.reason}</div>
          <div style="font-size:11px;color:var(--text-faint);margin-bottom:6px;">包含 ${cl.nodeIds.length} 个节点</div>
          <div class="ai-suggestion-actions">
            <button class="add" onclick="acceptCluster(${i})">创建分组</button>
            <button onclick="this.closest('.ai-suggestion-item').remove()">忽略</button>
          </div>
        </div>
      `;
      content.appendChild(item);
    });
    state._pendingClusters = clusters;
  } catch(e) {
    showAIError('归类失败：' + e.message);
  }
}

function acceptCluster(index) {
  const clusters = state._pendingClusters;
  if (!clusters || !clusters[index]) return;
  const cl = clusters[index];

  const group = {
    id: 'group_' + state.nextId++,
    title: cl.title,
    description: cl.reason,
    position: { x: 0, y: 0 },
    size: { width: 400, height: 300 },
    isCollapsed: false,
    createdBy: 'ai',
    createdAt: new Date().toISOString(),
  };
  state.groups.push(group);

  cl.nodeIds.forEach(nid => {
    const node = state.nodes.find(n => n.id === nid);
    if (node) {
      if (!node.layout) node.layout = {};
      node.layout.groupId = group.id;
    }
  });

  if (!state.mockMode) {
    queueMutation({ type: 'CREATE_GROUP', group });
    queueMutation({ type: 'MOVE_TO_GROUP', nodeIds: cl.nodeIds, groupId: group.id });
  }
  render();
  showToast('✓ 已创建分组');
}

function aiOrganizeCanvas() {
  // 自动布局（文档13.9）：只作用于未固定节点
  const pinnedNodes = state.nodes.filter(n => (n.layout || {}).isPinned);
  const movableNodes = state.nodes.filter(n => !(n.layout || {}).isPinned);

  if (movableNodes.length === 0) {
    showToast('没有可整理的节点（全部已固定）');
    return;
  }

  if (!window.confirm(`将整理 ${movableNodes.length} 个未固定节点，已固定 ${pinnedNodes.length} 个节点保持不动。`)) return;

  // 按类型分行排列（简化的Dagre替代）
  const kindOrder = ['domain', 'project', 'outcome', 'action', 'habit', 'record'];
  const colWidth = 220;
  const rowHeight = 130;
  const startX = 100;
  const startY = 100;

  // 按类型分组
  const byKind = {};
  movableNodes.forEach(n => {
    const k = kindOrder.indexOf(n.kind) >= 0 ? n.kind : 'record';
    if (!byKind[k]) byKind[k] = [];
    byKind[k].push(n);
  });

  // 排列：每种类型一列，节点在列内垂直排列
  let col = 0;
  Object.keys(byKind).sort((a, b) => kindOrder.indexOf(a) - kindOrder.indexOf(b)).forEach(kind => {
    const nodes = byKind[kind];
    nodes.forEach((node, i) => {
      const layout = node.layout || {};
      layout.x = startX + col * colWidth;
      layout.y = startY + i * rowHeight;
      node.layout = layout;
      if (!state.mockMode) {
        queueMutation({ type: 'MOVE_NODE', nodeId: node.id, position: { x: layout.x, y: layout.y } });
      }
    });
    col++;
  });

  render();
  showToast(`已整理 ${movableNodes.length} 个节点`);
}

function deleteSelectedNode() {
  if (!state.selectedId) return;
  const node = state.nodes.find(n => n.id === state.selectedId);
  if (!node) return;

  // 检查依赖关系（文档24.2）
  const relatedRels = state.relations.filter(r =>
    r.sourceNodeId === state.selectedId || r.targetNodeId === state.selectedId
  );
  const childNodes = relatedRels.filter(r => r.sourceNodeId === state.selectedId && r.relation === 'decomposes_to');
  const plannedActions = relatedRels.filter(r => {
    const target = state.nodes.find(n => n.id === r.targetNodeId);
    if (!target) return false;
    const execStatus = target.executionStatus || deriveExecutionFromPhase(target.phase);
    return execStatus === 'scheduled' || execStatus === 'in_progress';
  });

  if (childNodes.length > 0 || plannedActions.length > 0) {
    const msg = `这个节点与 ${childNodes.length} 个子节点和 ${plannedActions.length} 个已安排/进行中的行为有关。\n删除后将保留执行记录，但不再显示在画板。\n\n确认删除？`;
    if (!window.confirm(msg)) return;
  }

  state.nodes = state.nodes.filter(n => n.id !== state.selectedId);
  state.relations = state.relations.filter(r =>
    r.sourceNodeId !== state.selectedId && r.targetNodeId !== state.selectedId
  );

  if (!state.mockMode) {
    queueMutation({ type: 'DELETE_NODE', nodeId: state.selectedId });
  }
  deselectNode();
  render();
  showToast('已删除');
}

function addNodeToPlan() {
  if (!state.selectedId) return;
  const node = state.nodes.find(n => n.id === state.selectedId);
  if (!node) return;

  // 文档13.10：只有 action 或可以生成 action 的节点能直接加入 Plan
  if (node.kind !== 'action' && node.kind !== 'project' && node.kind !== 'goal') {
    showToast('只有行为、项目或目标可以加入今日计划');
    return;
  }

  // 如果不是 action，提示先拆解出具体行为
  if (node.kind !== 'action') {
    if (!window.confirm(`"${node.title}" 还不是具体行为。\n是否先让 AI 拆解出下一步行为再加入今天？\n\n点击"取消"直接以当前类型加入计划。`)) {
      // 直接加入
      node.phase = 'planned';
      node.commitment = node.commitment === 'observed' || node.commitment === 'interested' || node.commitment === 'intended' ? 'committed' : node.commitment;
      node.updatedAt = new Date().toISOString();
      if (!state.mockMode) {
        queueMutation({ type: 'UPDATE_NODE', nodeId: node.id, patch: { phase: 'planned', commitment: node.commitment } });
      }
      render();
      openDetailDrawer(node);
      showToast('已加入今日计划');
      return;
    }
    // 先拆解
    aiDecomposeSelected();
    return;
  }

  // action 节点直接加入
  node.phase = 'planned';
  if (node.commitment === 'observed' || node.commitment === 'interested' || node.commitment === 'intended') {
    node.commitment = 'scheduled';
  }
  node.updatedAt = new Date().toISOString();

  if (!state.mockMode) {
    queueMutation({
      type: 'UPDATE_NODE',
      nodeId: node.id,
      patch: { phase: 'planned', commitment: 'scheduled' },
    });
  }
  render();
  openDetailDrawer(node);
  showToast('已加入今日计划');
}

// ==================== 撤销/重做 ====================
function undo() {
  if (state.undoStack.length === 0) return;
  const mutation = state.undoStack.pop();
  state.redoStack.push(mutation);

  // 简单反转操作
  if (mutation.type === 'MOVE_NODE') {
    const node = state.nodes.find(n => n.id === mutation.nodeId);
    if (node && mutation.before) {
      if (!node.layout) node.layout = {};
      node.layout.x = mutation.before.x;
      node.layout.y = mutation.before.y;
    }
  } else if (mutation.type === 'CREATE_NODE') {
    state.nodes = state.nodes.filter(n => n.id !== mutation.node.id);
  } else if (mutation.type === 'DELETE_NODE') {
    // 难以完全恢复，简化处理
    showToast('无法完全撤销删除');
  } else if (mutation.type === 'PIN_NODE') {
    const node = state.nodes.find(n => n.id === mutation.nodeId);
    if (node && node.layout) {
      node.layout.isPinned = !mutation.isPinned;
    }
  } else if (mutation.type === 'UPDATE_NODE') {
    const node = state.nodes.find(n => n.id === mutation.nodeId);
    if (node && mutation.before) {
      Object.assign(node, mutation.before);
    }
  }

  updateUndoRedoButtons();
  render();
}

function redo() {
  if (state.redoStack.length === 0) return;
  const mutation = state.redoStack.pop();
  state.undoStack.push(mutation);

  // 重做操作
  if (mutation.type === 'MOVE_NODE' && mutation.position) {
    const node = state.nodes.find(n => n.id === mutation.nodeId);
    if (node) {
      if (!node.layout) node.layout = {};
      node.layout.x = mutation.position.x;
      node.layout.y = mutation.position.y;
    }
  } else if (mutation.type === 'CREATE_NODE') {
    state.nodes.push(mutation.node);
  }

  updateUndoRedoButtons();
  render();
}

  };
}

// ==================== 语音识别（浏览器录音 → 后端转发 → 豆包2.0）====================
// !!! 以下语音识别代码保持不变 !!!
let voiceState = {
  recording: false,
  pollTimer: null,
  sendTimer: null,
  finalText: '',
  audioContext: null,
  mediaStream: null,
  processor: null,
  source: null,
  audioChunks: [],
  nativeRate: 48000,
};

async function toggleVoice() {
  if (voiceState.recording) {
    await stopVoice();
  } else {
    await startVoice();
  }
}

async function startVoice() {
  const btn = document.getElementById('voiceBtn');
  const statusEl = document.getElementById('voiceStatus');
  const input = document.getElementById('aiInput');

  try {
    // 1. 先通知后端连接豆包 WebSocket
    const startResp = await fetch('/api/voice/stream-start', { method: 'POST' });
    const startData = await startResp.json();
    if (!startData.ok) {
      showToast('语音启动失败：' + (startData.message || startData.error || ''));
      return;
    }

    // 2. 请求麦克风权限（浏览器原生采集，绕过 Python 音频问题）
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        channelCount: 1,
        echoCancellation: true,
        noiseSuppression: true,
      }
    });
    voiceState.mediaStream = stream;

    // 3. 创建 AudioContext
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    voiceState.audioContext = audioContext;
    voiceState.nativeRate = audioContext.sampleRate;

    // Chrome/Edge 需要 resume 才能开始处理音频
    if (audioContext.state === 'suspended') {
      await audioContext.resume();
    }

    const source = audioContext.createMediaStreamSource(stream);
    voiceState.source = source;

    // 4. ScriptProcessorNode 捕获音频（4096 采样块）
    const processor = audioContext.createScriptProcessor(4096, 1, 1);
    voiceState.processor = processor;

    voiceState.audioChunks = [];

    processor.onaudioprocess = function(e) {
      const inputData = e.inputBuffer.getChannelData(0);
      voiceState.audioChunks.push(new Float32Array(inputData));
    };

    // 连接：source → processor → zeroGain → destination（零增益避免回声）
    const zeroGain = audioContext.createGain();
    zeroGain.gain.value = 0;
    source.connect(processor);
    processor.connect(zeroGain);
    zeroGain.connect(audioContext.destination);

    // 5. 每 200ms 把采集的音频降采样到 16kHz PCM Int16，发送到后端
    voiceState.sendTimer = setInterval(() => {
      if (voiceState.audioChunks.length === 0) return;

      // 合并所有 chunks
      const totalLen = voiceState.audioChunks.reduce((acc, c) => acc + c.length, 0);
      const merged = new Float32Array(totalLen);
      let off = 0;
      for (const c of voiceState.audioChunks) { merged.set(c, off); off += c.length; }
      voiceState.audioChunks = [];

      // 降采样到 16kHz
      const ratio = voiceState.nativeRate / 16000;
      const targetLen = Math.round(merged.length / ratio);
      const downsampled = new Float32Array(targetLen);
      for (let i = 0; i < targetLen; i++) {
        downsampled[i] = merged[Math.round(i * ratio)] || 0;
      }

      // Float32 → Int16
      const pcm16 = new Int16Array(targetLen);
      for (let i = 0; i < targetLen; i++) {
        let s = Math.max(-1, Math.min(1, downsampled[i]));
        pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
      }

      // 发送 PCM 到后端（fire-and-forget）
      fetch('/api/voice/stream-audio', {
        method: 'POST',
        body: pcm16.buffer,
        headers: { 'Content-Type': 'application/octet-stream' },
      }).catch(() => {});
    }, 200);

    // 6. UI 更新
    voiceState.recording = true;
    voiceState.finalText = '';
    btn.classList.add('recording');
    btn.textContent = '⏹';
    statusEl.style.display = 'flex';
    statusEl.innerHTML = '<span class="wave-dot"></span><span class="wave-dot"></span><span class="wave-dot"></span> 正在聆听...';
    input.value = '';
    input.placeholder = '说话中...';

    // 7. 每 300ms 轮询识别结果
    voiceState.pollTimer = setInterval(pollVoiceStatus, 300);

  } catch(e) {
    showToast('麦克风启动失败：' + e.message);
    cleanupAudio();
    // 后端已连接但前端失败，通知后端停止
    try { await fetch('/api/voice/stream-stop', { method: 'POST' }); } catch(_) {}
  }
}

function cleanupAudio() {
  if (voiceState.sendTimer) { clearInterval(voiceState.sendTimer); voiceState.sendTimer = null; }
  if (voiceState.processor) { try { voiceState.processor.disconnect(); } catch(_){} voiceState.processor = null; }
  if (voiceState.source) { try { voiceState.source.disconnect(); } catch(_){} voiceState.source = null; }
  if (voiceState.audioContext) { try { voiceState.audioContext.close(); } catch(_){} voiceState.audioContext = null; }
  if (voiceState.mediaStream) { voiceState.mediaStream.getTracks().forEach(t => t.stop()); voiceState.mediaStream = null; }
  voiceState.audioChunks = [];
}

async function pollVoiceStatus() {
  try {
    const resp = await fetch('/api/voice/stream-status');
    const data = await resp.json();

    if (data.error) {
      return;
    }

    const partial = data.partial || '';
    const full = data.text || '';
    const input = document.getElementById('aiInput');

    if (full && full !== voiceState.finalText) {
      voiceState.finalText = full;
      input.value = full;
    } else if (partial) {
      input.value = (full ? full + ' ' : '') + partial;
    }
  } catch(e) {}
}

async function stopVoice() {
  const btn = document.getElementById('voiceBtn');
  const statusEl = document.getElementById('voiceStatus');
  const input = document.getElementById('aiInput');

  // 停止轮询和发送
  if (voiceState.pollTimer) { clearInterval(voiceState.pollTimer); voiceState.pollTimer = null; }
  if (voiceState.sendTimer) { clearInterval(voiceState.sendTimer); voiceState.sendTimer = null; }

  // 停止音频采集
  cleanupAudio();

  voiceState.recording = false;
  btn.classList.remove('recording');
  btn.textContent = '🎤';
  statusEl.style.display = 'none';
  input.placeholder = '最近在脑子里打转的事情...';

  try {
    const resp = await fetch('/api/voice/stream-stop', { method: 'POST' });
    const data = await resp.json();

    if (data.ok && data.text) {
      input.value = data.text;
      showToast(`✓ 识别完成（${data.engine}）：${data.text.substring(0, 30)}${data.text.length > 30 ? '...' : ''}`);
      // 自动触发 AI 分析
      setTimeout(() => submitInput(), 300);
    } else {
      showToast('未识别到语音内容');
    }
  } catch(e) {
    showToast('停止录音失败：' + e.message);
  }
}

// ==================== 工具函数 ====================
function showToast(msg) {
  const toast = document.createElement('div');
  toast.style.cssText = `position:fixed;top:70px;left:50%;transform:translateX(-50%);
    padding:10px 24px;border-radius:12px;font-size:13px;color:#FFF;z-index:9999;
    background:#1A1A1A;box-shadow:0 4px 16px rgba(0,0,0,0.15);animation:fadeIn 0.3s;`;
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2500);
}

window.addEventListener('load', () => {
  initCanvasInteraction();
  loadCanvas();
});
window.addEventListener('resize', render);

document.addEventListener('click', (e) => {
  if (!e.target.closest('.card') && !e.target.closest('.detail-drawer') &&
      !e.target.closest('.ai-dock') && !e.target.closest('.candidate-inbox') &&
      !e.target.closest('.top-bar') && !e.target.closest('.bottom-toolbar')) {
    // 点击画布空白处：取消选中并关闭详情面板
    if (state.selectedId) {
      deselectNode();
      closeDetailDrawer();
    }
  }
});
