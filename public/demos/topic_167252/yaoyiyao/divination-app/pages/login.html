<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 摇卦</title>
    <style id="theme-vars">
:root {
  /* ===== Brand Prefix: divination ===== */

  /* --- Color System --- */
  /* Cyberpunk x Chinese: deep obsidian + electric jade + gold imperial */
  --color-background: #0a0a0f;
  --color-background-elevated: #12121c;
  --color-background-surface: #1a1a28;
  --color-foreground-primary: #e8e4d9;
  --color-foreground-secondary: #9a96a6;
  --color-foreground-muted: #5a5666;
  --color-brand: #00e5a0;
  --color-brand-muted: rgba(0, 229, 160, 0.15);
  --color-brand-strong: #00ffb3;
  --color-accent-gold: #d4a853;
  --color-accent-gold-muted: rgba(212, 168, 83, 0.15);
  --color-accent-red: #ff3366;
  --color-accent-red-muted: rgba(255, 51, 102, 0.12);
  --color-border: rgba(255, 255, 255, 0.06);
  --color-border-strong: rgba(255, 255, 255, 0.12);

  /* State colors */
  --state-success: #00e5a0;
  --state-warning: #d4a853;
  --state-error: #ff3366;
  --state-info: #6ec6ff;

  /* --- Typography --- */
  --font-display: 'Noto Serif SC', 'Songti SC', serif;
  --font-body: 'Noto Sans SC', 'PingFang SC', sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;

  --text-xs: 0.6875rem;
  --text-sm: 0.75rem;
  --text-base: 0.875rem;
  --text-lg: 1rem;
  --text-xl: 1.25rem;
  --text-2xl: 1.5rem;
  --text-3xl: 2rem;
  --text-4xl: 2.5rem;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;

  --tracking-tight: -0.02em;
  --tracking-normal: 0;
  --tracking-wide: 0.05em;
  --tracking-wider: 0.1em;

  /* --- Spacing --- */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 12px;
  --spacing-lg: 16px;
  --spacing-xl: 24px;
  --spacing-2xl: 32px;
  --spacing-3xl: 48px;
  --spacing-4xl: 64px;

  /* --- Radius --- */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* --- Shadows --- */
  --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.3);
  --shadow-elevated: 0 8px 24px rgba(0, 0, 0, 0.4);
  --shadow-glow-brand: 0 0 20px rgba(0, 229, 160, 0.2);
  --shadow-glow-gold: 0 0 20px rgba(212, 168, 83, 0.2);

  /* --- Transitions --- */
  --transition-fast: 150ms ease;
  --transition-normal: 250ms ease;
  --transition-slow: 400ms ease;
}

/* Typography classes */
.divination-display {
  font-family: var(--font-display);
  font-weight: 700;
  letter-spacing: var(--tracking-wide);
  line-height: var(--leading-tight);
}

.divination-title-lg {
  font-family: var(--font-display);
  font-size: var(--text-3xl);
  font-weight: 700;
  letter-spacing: var(--tracking-wide);
  line-height: var(--leading-tight);
}

.divination-title {
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 600;
  letter-spacing: var(--tracking-wide);
  line-height: var(--leading-tight);
}

.divination-subtitle {
  font-family: var(--font-body);
  font-size: var(--text-lg);
  font-weight: 500;
  letter-spacing: var(--tracking-normal);
  line-height: var(--leading-normal);
  color: var(--color-foreground-secondary);
}

.divination-body {
  font-family: var(--font-body);
  font-size: var(--text-base);
  font-weight: 400;
  letter-spacing: var(--tracking-normal);
  line-height: var(--leading-relaxed);
  color: var(--color-foreground-primary);
}

.divination-caption {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  font-weight: 400;
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
  color: var(--color-foreground-muted);
}

.divination-mono {
  font-family: var(--font-mono);
  font-size: var(--text-sm);
  font-weight: 400;
  letter-spacing: var(--tracking-wide);
  color: var(--color-foreground-secondary);
}

/* I Ching trigram glyph style */
.divination-glyph {
  font-family: var(--font-display);
  font-size: var(--text-4xl);
  font-weight: 700;
  line-height: 1;
  color: var(--color-accent-gold);
  text-shadow: 0 0 12px rgba(212, 168, 83, 0.3);
}

/* Cyber neon text glow */
.divination-neon {
  text-shadow:
    0 0 4px rgba(0, 229, 160, 0.6),
    0 0 12px rgba(0, 229, 160, 0.3);
}

.divination-neon-gold {
  text-shadow:
    0 0 4px rgba(212, 168, 83, 0.6),
    0 0 12px rgba(212, 168, 83, 0.3);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--color-background);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-foreground-primary); font-family: var(--font-body); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="relative min-h-screen flex flex-col items-center px-4 overflow-hidden" style="background:var(--color-background);">

      <!-- Background decorative layer -->
      <div class="absolute inset-0 pointer-events-none overflow-hidden" aria-hidden="true">
        <!-- Subtle radial glow from top center (jade tint) -->
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-[500px] opacity-[0.08]" style="background:radial-gradient(ellipse at 50% 0%, var(--color-brand) 0%, transparent 70%);"></div>

        <!-- Faint circuit-board pattern -->
        <svg class="absolute inset-0 w-full h-full opacity-[0.025]" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <pattern id="login-circuit" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
              <path d="M0 24h18M24 24h24M24 0v18M24 24v24" stroke="var(--color-brand)" stroke-width="0.4" fill="none"/>
              <circle cx="24" cy="24" r="1.2" fill="var(--color-brand)"/>
              <circle cx="0" cy="24" r="0.8" fill="var(--color-brand)"/>
              <circle cx="48" cy="24" r="0.8" fill="var(--color-brand)"/>
              <circle cx="24" cy="0" r="0.8" fill="var(--color-brand)"/>
              <circle cx="24" cy="48" r="0.8" fill="var(--color-brand)"/>
            </pattern>
          </defs>
          <rect width="100%" height="100%" fill="url(#login-circuit)"/>
        </svg>

        <!-- Chinese cloud pattern — top left -->
        <svg class="absolute top-0 left-0 w-28 h-28 opacity-[0.035]" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 60 Q20 40 35 40 Q35 25 50 30 Q55 15 70 25 Q85 20 85 35 Q95 40 90 55 Q95 65 85 65 L20 65 Q10 65 20 60Z" fill="var(--color-accent-gold)"/>
        </svg>

        <!-- Chinese cloud pattern — bottom right -->
        <svg class="absolute bottom-8 right-0 w-24 h-24 opacity-[0.03]" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 40 Q15 55 30 55 Q30 70 50 65 Q55 80 70 70 Q85 75 85 60 Q95 55 90 45 Q95 35 85 35 L15 35 Q5 35 15 40Z" fill="var(--color-accent-gold)"/>
        </svg>

        <!-- Floating particles (6 subtle particles) -->
        <div class="absolute w-1 h-1 rounded-full" style="top:12%; left:15%; background:var(--color-brand); opacity:0.2; animation:login-float 5s ease-in-out infinite;"></div>
        <div class="absolute w-0.5 h-0.5 rounded-full" style="top:20%; right:20%; background:var(--color-accent-gold); opacity:0.15; animation:login-float 6s ease-in-out 1.2s infinite;"></div>
        <div class="absolute w-0.5 h-0.5 rounded-full" style="top:55%; left:10%; background:var(--color-brand); opacity:0.18; animation:login-float 4.5s ease-in-out 0.6s infinite;"></div>
        <div class="absolute w-1 h-1 rounded-full" style="top:75%; right:12%; background:var(--color-accent-gold); opacity:0.15; animation:login-float 5.5s ease-in-out 2s infinite;"></div>
        <div class="absolute w-0.5 h-0.5 rounded-full" style="top:40%; left:25%; background:var(--color-brand); opacity:0.12; animation:login-float 7s ease-in-out 3s infinite;"></div>
        <div class="absolute w-0.5 h-0.5 rounded-full" style="top:85%; left:50%; background:var(--color-accent-gold); opacity:0.1; animation:login-float 6.5s ease-in-out 1.8s infinite;"></div>
      </div>

      <!-- App Logo & Title Area -->
      <header class="relative z-10 flex flex-col items-center pt-10 pb-2 flex-shrink-0">
        <!-- CSS Yin-Yang Emblem -->
        <div class="relative w-16 h-16 flex items-center justify-center mb-4">
          <!-- Outer jade ring -->
          <div class="absolute inset-0 rounded-full" style="border:2px solid var(--color-brand); box-shadow:0 0 12px rgba(0,229,160,0.2);"></div>
          <!-- Inner yin-yang symbol -->
          <svg class="w-12 h-12" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
            <!-- Yin-yang circle -->
            <circle cx="24" cy="24" r="18" fill="none" stroke="var(--color-foreground-primary)" stroke-width="1" opacity="0.8"/>
            <!-- Yang (light) half — top -->
            <path d="M24 6 A18 18 0 0 1 24 42 A9 9 0 0 0 24 24 A9 9 0 0 1 24 6Z" fill="var(--color-foreground-primary)" opacity="0.85"/>
            <!-- Yin (dark) half — bottom -->
            <path d="M24 6 A9 9 0 0 0 24 24 A9 9 0 0 1 24 42 A18 18 0 0 1 24 6Z" fill="var(--color-background-elevated)" opacity="0.85"/>
            <!-- Yang dot -->
            <circle cx="24" cy="15" r="2.5" fill="var(--color-background-elevated)" opacity="0.85"/>
            <!-- Yin dot -->
            <circle cx="24" cy="33" r="2.5" fill="var(--color-foreground-primary)" opacity="0.85"/>
            <!-- Jade accent ring inside -->
            <circle cx="24" cy="24" r="18" fill="none" stroke="var(--color-brand)" stroke-width="0.5" opacity="0.3"/>
          </svg>
          <!-- Subtle outer glow -->
          <div class="absolute inset-0 rounded-full opacity-20" style="background:radial-gradient(circle, rgba(0,229,160,0.15) 0%, transparent 70%);"></div>
        </div>

        <!-- App title: 摇卦 -->
        <h1 class="divination-display divination-neon text-2xl tracking-[0.05em] text-center" style="color:var(--color-brand); text-wrap:balance; word-break:keep-all;">
          摇卦
        </h1>
        <!-- Caption -->
        <p class="mt-1.5 text-xs tracking-[0.08em] text-center" style="color:var(--color-foreground-muted); font-family:var(--font-mono);">
          铜钱起卦 · 问天知命
        </p>

        <!-- Decorative separator line -->
        <div class="flex items-center justify-center gap-3 mt-4">
          <div class="h-px w-10" style="background:linear-gradient(to right, transparent, var(--color-brand)); opacity:0.3;"></div>
          <svg class="w-3 h-3 opacity-30" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 0.5 Q9.5 3 9.5 6 Q9.5 9 6 11.5 Q2.5 9 2.5 6 Q2.5 3 6 0.5Z" stroke="var(--color-accent-gold)" stroke-width="0.6" fill="none"/>
          </svg>
          <div class="h-px w-10" style="background:linear-gradient(to left, transparent, var(--color-brand)); opacity:0.3;"></div>
        </div>
      </header>

      <!-- Login Form Card -->
      <section class="relative z-10 w-full max-w-sm mx-auto mt-4 flex-shrink-0" aria-label="登录表单">
        <div class="rounded-lg px-5 py-6" style="background:rgba(18,18,28,0.75); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid var(--color-border-strong); box-shadow:var(--shadow-elevated);">

          <!-- Card Title -->
          <h2 class="divination-title text-center text-xl tracking-[0.05em] mb-6" style="color:var(--color-accent-gold); text-shadow:0 0 8px rgba(212,168,83,0.3);">
            登录
          </h2>

          <!-- Input Field: Phone / Email -->
          <div class="mb-4">
            <label for="input-phone-email" class="block mb-1.5 text-xs tracking-[0.06em]" style="color:var(--color-foreground-muted); font-family:var(--font-mono);">
              手机号/邮箱
            </label>
            <div class="relative">
              <span class="absolute left-3 top-1/2 -translate-y-1/2 flex items-center" style="color:var(--color-foreground-muted);">
                <i data-lucide="user" class="w-4 h-4"></i>
              </span>
              <input
                id="input-phone-email"
                type="text"
                placeholder="请输入手机号或邮箱"
                autocomplete="username"
                readonly
                class="w-full rounded-lg pl-9 pr-3 py-3 text-sm transition-colors duration-150 outline-none"
                style="
                  background:rgba(26,26,40,0.6);
                  border:1px solid var(--color-border-strong);
                  color:var(--color-foreground-primary);
                  font-family:var(--font-body);
                "
              >
            </div>
          </div>

          <!-- Input Field: Password -->
          <div class="mb-2">
            <label for="input-password" class="block mb-1.5 text-xs tracking-[0.06em]" style="color:var(--color-foreground-muted); font-family:var(--font-mono);">
              密码
            </label>
            <div class="relative">
              <span class="absolute left-3 top-1/2 -translate-y-1/2 flex items-center" style="color:var(--color-foreground-muted);">
                <i data-lucide="lock" class="w-4 h-4"></i>
              </span>
              <input
                id="input-password"
                type="password"
                placeholder="请输入密码"
                autocomplete="current-password"
                readonly
                class="w-full rounded-lg pl-9 pr-3 py-3 text-sm transition-colors duration-150 outline-none"
                style="
                  background:rgba(26,26,40,0.6);
                  border:1px solid var(--color-border-strong);
                  color:var(--color-foreground-primary);
                  font-family:var(--font-body);
                "
              >
            </div>
          </div>

          <!-- Forgot Password link -->
          <div class="flex justify-end mb-5">
            <a href="#" class="text-xs transition-colors duration-150" style="color:var(--color-brand); font-family:var(--font-body); text-shadow:0 0 4px rgba(0,229,160,0.3);" tabindex="-1">
              忘记密码?
            </a>
          </div>

          <!-- Login Button -->
          <button
            id="btn-login"
            data-dom-id="btn-login"
            class="w-full flex items-center justify-center rounded-lg py-3 text-sm font-semibold tracking-[0.12em] transition-all duration-200"
            style="
              font-family: var(--font-display);
              color: var(--color-brand);
              background: transparent;
              border: 1.5px solid var(--color-brand);
              box-shadow: 0 0 12px rgba(0,229,160,0.1);
              min-height: 48px;
            "
          >
            登 录
          </button>

          <!-- Divider -->
          <div class="flex items-center justify-center gap-4 my-5">
            <div class="flex-1 h-px" style="background:linear-gradient(to right, transparent, var(--color-accent-gold)); opacity:0.2;"></div>
            <span class="text-xs whitespace-nowrap" style="color:var(--color-foreground-muted); font-family:var(--font-mono);">
              —— 或 ——
            </span>
            <div class="flex-1 h-px" style="background:linear-gradient(to left, transparent, var(--color-accent-gold)); opacity:0.2;"></div>
          </div>

          <!-- Third-party Login -->
          <div class="text-center">
            <p class="mb-3 text-xs tracking-[0.06em]" style="color:var(--color-foreground-muted); font-family:var(--font-mono);">
              其他登录方式
            </p>
            <div class="flex items-center justify-center gap-5">
              <!-- WeChat -->
              <button class="w-10 h-10 rounded-full flex items-center justify-center transition-transform duration-150" style="background:rgba(7,193,96,0.12); border:1px solid rgba(7,193,96,0.25);" tabindex="-1" aria-label="微信登录">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="#07C160" xmlns="http://www.w3.org/2000/svg">
                  <path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05a6.562 6.562 0 0 1-.285-1.893c0-3.665 3.372-6.63 7.53-6.63.276 0 .543.027.811.05C16.654 4.376 13.044 2.188 8.691 2.188zm-2.9 4.39a1.07 1.07 0 1 1 0 2.14 1.07 1.07 0 0 1 0-2.14zm5.802 0a1.07 1.07 0 1 1 0 2.14 1.07 1.07 0 0 1 0-2.14z"/>
                  <path d="M23.999 15.14c0-3.261-3.262-5.91-7.284-5.91-4.021 0-7.283 2.649-7.283 5.91 0 3.262 3.262 5.911 7.283 5.911.853 0 1.674-.118 2.44-.334a.716.716 0 0 1 .59.082l1.57.92a.268.268 0 0 0 .138.045c.132 0 .238-.108.238-.243 0-.058-.023-.116-.039-.174l-.322-1.223a.486.486 0 0 1 .176-.548c1.505-1.115 2.5-2.793 2.5-4.436zm-9.964-1.162a.886.886 0 1 1 0-1.772.886.886 0 0 1 0 1.772zm5.36 0a.886.886 0 1 1 0-1.772.886.886 0 0 1 0 1.772z"/>
                </svg>
              </button>
              <!-- QQ -->
              <button class="w-10 h-10 rounded-full flex items-center justify-center transition-transform duration-150" style="background:rgba(18,150,219,0.12); border:1px solid rgba(18,150,219,0.25);" tabindex="-1" aria-label="QQ登录">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="#1296DB" xmlns="http://www.w3.org/2000/svg">
                  <path d="M12 2C8.691 2 6 4.691 6 8v.5c-1.656.434-3 2.522-3 5.5 0 .836.09 1.597.256 2.268C2.63 17.255 4.055 19 6 19v2c0 .552.448 1 1 1h10c.552 0 1-.448 1-1v-2c1.945 0 3.37-1.745 3.744-2.732.166-.671.256-1.432.256-2.268 0-2.978-1.344-5.066-3-5.5V8c0-3.309-2.691-6-6-6z"/>
                </svg>
              </button>
              <!-- Apple -->
              <button class="w-10 h-10 rounded-full flex items-center justify-center transition-transform duration-150" style="background:rgba(255,255,255,0.06); border:1px solid var(--color-border-strong);" tabindex="-1" aria-label="Apple登录">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="var(--color-foreground-primary)" xmlns="http://www.w3.org/2000/svg">
                  <path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Switch to Register -->
          <div class="flex items-center justify-center gap-1.5 mt-5 pt-4" style="border-top:1px solid var(--color-border);">
            <span class="text-sm" style="color:var(--color-foreground-secondary);">
              还没有账号？
            </span>
            <a
              href="register.html"
              id="link-to-register"
              data-dom-id="link-to-register"
              class="text-sm font-medium transition-colors duration-150"
              style="color:var(--color-brand); text-shadow:0 0 4px rgba(0,229,160,0.3);"
            >
              立即注册
            </a>
          </div>

        </div>
      </section>

      <!-- Bottom spacer -->
      <div class="flex-1 min-h-4"></div>

      <!-- Footer decorative bar -->
      <footer class="relative z-10 w-full max-w-sm mx-auto flex-shrink-0 pb-6 px-4" aria-hidden="true">
        <div class="flex items-center justify-center gap-2">
          <div class="h-px flex-1" style="background:linear-gradient(to right, transparent, var(--color-accent-gold)); opacity:0.15;"></div>
          <!-- Gold wave/circuit motif -->
          <svg class="w-16 h-3 opacity-20" viewBox="0 0 64 12" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0 6 Q8 2 16 6 Q24 10 32 6 Q40 2 48 6 Q56 10 64 6" stroke="var(--color-accent-gold)" stroke-width="0.8" fill="none"/>
          </svg>
          <div class="h-px flex-1" style="background:linear-gradient(to left, transparent, var(--color-accent-gold)); opacity:0.15;"></div>
        </div>
      </footer>

    </main>

    <!-- Custom styles for animations and interactions -->
    <style>
      @keyframes login-float {
        0%, 100% { transform: translateY(0px); opacity: 0.15; }
        50% { transform: translateY(-10px); opacity: 0.28; }
      }

      /* Input focus states (visual only for mockup) */
      input:focus {
        border-color: var(--color-brand) !important;
        box-shadow: 0 0 0 1px var(--color-brand), 0 0 12px rgba(0,229,160,0.15);
      }

      /* Login button hover */
      #btn-login:hover {
        background: rgba(0, 229, 160, 0.08);
        box-shadow: 0 0 20px rgba(0,229,160,0.2), 0 0 40px rgba(0,229,160,0.08);
      }
      #btn-login:active {
        transform: scale(0.98);
        box-shadow: 0 0 8px rgba(0,229,160,0.15);
      }
      #btn-login:focus-visible {
        outline: 2px solid var(--color-brand);
        outline-offset: 2px;
      }

      /* Social button hover */
      button[aria-label]:hover {
        transform: translateY(-1px);
      }

      /* Reduced motion */
      @media (prefers-reduced-motion: reduce) {
        @keyframes login-float {
          0%, 100% { transform: none; opacity: 0.15; }
        }
        #btn-login:active { transform: none; }
        button[aria-label]:hover { transform: none; }
      }

      /* Touch device: disable hover transitions */
      @media (hover: none) {
        button[aria-label]:hover { transform: none; }
      }
    </style>
