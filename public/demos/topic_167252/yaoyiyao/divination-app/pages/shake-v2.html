<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摇卦</title>
    <style id="theme-vars">
:root {
  /* ===== Brand Prefix: divination ===== */

  /* --- Color System --- */
  /* Cyberpunk x Chinese: deep obsidian + electric jade + gold imperial */
  --color-background: #0a0a0f;
  --color-background-elevated: #12121c;
  --color-background-surface: #1a1a28;
  --color-foreground-primary: #e8e4d9;
  --color-foreground-secondary: #9a96a6;
  --color-foreground-muted: #5a5666;
  --color-brand: #00e5a0;
  --color-brand-muted: rgba(0, 229, 160, 0.15);
  --color-brand-strong: #00ffb3;
  --color-accent-gold: #d4a853;
  --color-accent-gold-muted: rgba(212, 168, 83, 0.15);
  --color-accent-red: #ff3366;
  --color-accent-red-muted: rgba(255, 51, 102, 0.12);
  --color-border: rgba(255, 255, 255, 0.06);
  --color-border-strong: rgba(255, 255, 255, 0.12);

  /* State colors */
  --state-success: #00e5a0;
  --state-warning: #d4a853;
  --state-error: #ff3366;
  --state-info: #6ec6ff;

  /* --- Typography --- */
  --font-display: 'Noto Serif SC', 'Songti SC', serif;
  --font-body: 'Noto Sans SC', 'PingFang SC', sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;

  --text-xs: 0.6875rem;
  --text-sm: 0.75rem;
  --text-base: 0.875rem;
  --text-lg: 1rem;
  --text-xl: 1.25rem;
  --text-2xl: 1.5rem;
  --text-3xl: 2rem;
  --text-4xl: 2.5rem;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;

  --tracking-tight: -0.02em;
  --tracking-normal: 0;
  --tracking-wide: 0.05em;
  --tracking-wider: 0.1em;

  /* --- Spacing --- */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 12px;
  --spacing-lg: 16px;
  --spacing-xl: 24px;
  --spacing-2xl: 32px;
  --spacing-3xl: 48px;
  --spacing-4xl: 64px;

  /* --- Radius --- */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* --- Shadows --- */
  --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.3);
  --shadow-elevated: 0 8px 24px rgba(0, 0, 0, 0.4);
  --shadow-glow-brand: 0 0 20px rgba(0, 229, 160, 0.2);
  --shadow-glow-gold: 0 0 20px rgba(212, 168, 83, 0.2);

  /* --- Transitions --- */
  --transition-fast: 150ms ease;
  --transition-normal: 250ms ease;
  --transition-slow: 400ms ease;
}

/* Typography classes */
.divination-display {
  font-family: var(--font-display);
  font-weight: 700;
  letter-spacing: var(--tracking-wide);
  line-height: var(--leading-tight);
}

.divination-title-lg {
  font-family: var(--font-display);
  font-size: var(--text-3xl);
  font-weight: 700;
  letter-spacing: var(--tracking-wide);
  line-height: var(--leading-tight);
}

.divination-title {
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 600;
  letter-spacing: var(--tracking-wide);
  line-height: var(--leading-tight);
}

.divination-subtitle {
  font-family: var(--font-body);
  font-size: var(--text-lg);
  font-weight: 500;
  letter-spacing: var(--tracking-normal);
  line-height: var(--leading-normal);
  color: var(--color-foreground-secondary);
}

.divination-body {
  font-family: var(--font-body);
  font-size: var(--text-base);
  font-weight: 400;
  letter-spacing: var(--tracking-normal);
  line-height: var(--leading-relaxed);
  color: var(--color-foreground-primary);
}

.divination-caption {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  font-weight: 400;
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
  color: var(--color-foreground-muted);
}

.divination-mono {
  font-family: var(--font-mono);
  font-size: var(--text-sm);
  font-weight: 400;
  letter-spacing: var(--tracking-wide);
  color: var(--color-foreground-secondary);
}

/* I Ching trigram glyph style */
.divination-glyph {
  font-family: var(--font-display);
  font-size: var(--text-4xl);
  font-weight: 700;
  line-height: 1;
  color: var(--color-accent-gold);
  text-shadow: 0 0 12px rgba(212, 168, 83, 0.3);
}

/* Cyber neon text glow */
.divination-neon {
  text-shadow:
    0 0 4px rgba(0, 229, 160, 0.6),
    0 0 12px rgba(0, 229, 160, 0.3);
}

.divination-neon-gold {
  text-shadow:
    0 0 4px rgba(212, 168, 83, 0.6),
    0 0 12px rgba(212, 168, 83, 0.3);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>

    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--color-background);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-foreground-primary); font-family: var(--font-body); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="relative min-h-screen flex flex-col items-center px-4 pb-8 overflow-hidden">

      <!-- Background decorative elements -->
      <div class="absolute inset-0 pointer-events-none overflow-hidden" aria-hidden="true">
        <!-- Faint circuit board pattern -->
        <svg class="absolute inset-0 w-full h-full opacity-[0.03]" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <pattern id="circuit" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
              <path d="M0 20h15M20 20h20M20 0v15M20 20v20" stroke="var(--color-brand)" stroke-width="0.5" fill="none"/>
              <circle cx="20" cy="20" r="1.5" fill="var(--color-brand)"/>
              <circle cx="0" cy="20" r="1" fill="var(--color-brand)"/>
              <circle cx="40" cy="20" r="1" fill="var(--color-brand)"/>
            </pattern>
          </defs>
          <rect width="100%" height="100%" fill="url(#circuit)"/>
        </svg>
        <!-- Chinese cloud motifs at edges -->
        <svg class="absolute top-0 left-0 w-32 h-32 opacity-[0.04]" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 60 Q20 40 35 40 Q35 25 50 30 Q55 15 70 25 Q85 20 85 35 Q95 40 90 55 Q95 65 85 65 L20 65 Q10 65 20 60Z" fill="var(--color-accent-gold)"/>
        </svg>
        <svg class="absolute bottom-4 right-0 w-32 h-32 opacity-[0.04]" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">

        </svg>
        <!-- Decorative floating dots -->

        <div class="absolute top-[60%] left-[8%] w-0.5 h-0.5 rounded-full opacity-15" style="background:var(--color-accent-gold); animation: float-dot 6s ease-in-out 0.5s infinite;"></div>
        <div class="absolute top-[70%] right-[12%] w-1 h-1 rounded-full opacity-20" style="background:var(--color-brand); animation: float-dot 4.5s ease-in-out 2s infinite;"></div>
      </div>

      <!-- Header -->
      <header class="relative z-10 pt-12 pb-2 text-center flex-shrink-0">
        <h1 class="divination-display divination-neon text-[2rem] leading-[1.25] tracking-[0.05em] whitespace-nowrap" style="color:var(--color-brand); font-size:var(--text-4xl); text-wrap:balance; word-break:keep-all;">
          摇卦
        </h1>
        <p class="mt-2 text-sm tracking-[0.08em]" style="color:var(--color-foreground-muted); font-family:var(--font-body);">
          铜钱起卦 · 问天知命
        </p>
        <!-- Decorative separator: circuit-line + cloud motif -->
        <div class="flex items-center justify-center gap-3 mt-4">
          <div class="h-px w-10" style="background:linear-gradient(to right, transparent, var(--color-brand)); opacity:0.4;"></div>
          <svg class="w-4 h-4 opacity-40" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 1 Q12 4 12 8 Q12 12 8 15 Q4 12 4 8 Q4 4 8 1Z" stroke="var(--color-accent-gold)" stroke-width="0.8" fill="none"/>
            <circle cx="8" cy="8" r="2" stroke="var(--color-brand)" stroke-width="0.6" fill="none"/>
          </svg>
          <div class="h-px w-10" style="background:linear-gradient(to left, transparent, var(--color-brand)); opacity:0.4;"></div>
        </div>
      </header>

      <!-- Question Input Area -->
      <div class="relative z-10 flex-shrink-0 w-full max-w-sm mx-auto mt-5">
        <div class="rounded-lg px-4 py-3" style="background:rgba(26, 26, 40, 0.6); border:1px solid var(--color-border-strong); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); box-shadow:inset 0 0 20px rgba(0,229,160,0.03);">
          <label class="block mb-2" style="font-family:var(--font-mono); font-size:var(--text-xs); letter-spacing:var(--tracking-wider); text-transform:uppercase; color:var(--color-foreground-muted);">所问之事</label>
          <div class="relative flex items-center">
            <i data-lucide="help-circle" class="absolute left-0 flex-shrink-0" style="width:16px; height:16px; color:var(--color-foreground-muted);"></i>
            <input
              type="text"
              id="input-question-v2"
              data-dom-id="input-question-v2"
              placeholder="请输入你想问的事情..."
              class="w-full rounded-md pl-6 pr-3 py-2 text-sm outline-none transition-all duration-200"
              style="
                font-family: var(--font-body);
                font-size: var(--text-sm);
                color: var(--color-foreground-primary);
                background: rgba(10, 10, 15, 0.5);
                border: 1px solid var(--color-border);
                caret-color: var(--color-brand);
              "
              value="最近的工作变动会不会顺利？"
              readonly
            />
          </div>
          <!-- Subtle jade border accent on the card top -->
          <div class="absolute top-0 left-4 right-4 h-px rounded-t-lg" style="background:linear-gradient(to right, transparent, var(--color-brand), transparent); opacity:0.3;"></div>
        </div>
      </div>

      <!-- Progress: counter -->
      <div class="relative z-10 mt-4 flex-shrink-0">
        <span class="divination-mono text-xs tracking-[0.12em]" style="color:var(--color-accent-gold);">
          第 6 / 6 爻 · 卦象已成
        </span>
      </div>

      <!-- Coin Arena (center, largest section) -->
      <section class="relative z-10 flex-1 flex flex-col items-center justify-center w-full max-w-sm mx-auto" aria-label="铜钱摇卦区">
        <div class="relative flex items-center justify-center gap-[-8px] mt-2 mb-6" style="width:260px; height:260px;">

          <!-- Coin 1 (left, slightly behind) -->
          <div class="absolute coin-float" style="left:18px; top:30px; z-index:1; animation: coin-idle 3s ease-in-out infinite 0s;">
            <svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <radialGradient id="coin-grad1" cx="50%" cy="40%" r="50%">
                  <stop offset="0%" stop-color="#c9a84c"/>

                  <stop offset="100%" stop-color="#7a5a1e"/>
                </radialGradient>
                <filter id="coin-glow1">
                  <feGaussianBlur stdDeviation="3" result="blur"/>

                </filter>
              </defs>
              <circle cx="40" cy="40" r="38" fill="url(#coin-grad1)" stroke="#d4a853" stroke-width="1.5"/>

              <text x="40" y="60" text-anchor="middle" font-family="serif" font-size="8" fill="#f5e6c8" font-weight="700">宝</text>
              <text x="22" y="43" text-anchor="middle" font-family="serif" font-size="6" fill="#f5e6c8" font-weight="600">元</text>
              <text x="58" y="43" text-anchor="middle" font-family="serif" font-size="6" fill="#f5e6c8" font-weight="600">通</text>
            </svg>
            <!-- Under-glow -->
            <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 w-14 h-2 rounded-full opacity-30" style="background:var(--color-accent-gold); filter:blur(6px);"></div>
          </div>

          <!-- Coin 2 (center, front) -->
          <div class="absolute coin-float" style="left:88px; top:20px; z-index:3; animation: coin-idle 3.5s ease-in-out infinite 0.3s;">
            <svg width="86" height="86" viewBox="0 0 86 86" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <radialGradient id="coin-grad2" cx="50%" cy="38%" r="50%">
                  <stop offset="0%" stop-color="#d4b05a"/>
                  <stop offset="45%" stop-color="#b8902e"/>
                  <stop offset="100%" stop-color="#8a6820"/>
                </radialGradient>
              </defs>
              <circle cx="43" cy="43" r="41" fill="url(#coin-grad2)" stroke="#d4a853" stroke-width="1.5"/>
              <circle cx="43" cy="43" r="35" fill="none" stroke="#d4a853" stroke-width="0.5" opacity="0.6"/>
              <rect x="37" y="37" width="12" height="12" rx="1" fill="none" stroke="#8b6914" stroke-width="1.3"/>
              <text x="43" y="27" text-anchor="middle" font-family="serif" font-size="9" fill="#f5e6c8" font-weight="700">开</text>
              <text x="43" y="65" text-anchor="middle" font-family="serif" font-size="9" fill="#f5e6c8" font-weight="700">宝</text>
              <text x="22" y="46" text-anchor="middle" font-family="serif" font-size="7" fill="#f5e6c8" font-weight="600">元</text>
              <text x="64" y="46" text-anchor="middle" font-family="serif" font-size="7" fill="#f5e6c8" font-weight="600">通</text>
            </svg>
            <!-- Under-glow (brighter for center coin) -->
            <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 w-16 h-2.5 rounded-full opacity-40" style="background:var(--color-accent-gold); filter:blur(8px);"></div>
          </div>

          <!-- Coin 3 (right, slightly behind) -->
          <div class="absolute coin-float" style="left:162px; top:34px; z-index:2; animation: coin-idle 2.8s ease-in-out infinite 0.6s;">
            <svg width="78" height="78" viewBox="0 0 78 78" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <radialGradient id="coin-grad3" cx="50%" cy="40%" r="50%">
                  <stop offset="0%" stop-color="#c4a048"/>
                  <stop offset="50%" stop-color="#a07828"/>
                  <stop offset="100%" stop-color="#785818"/>
                </radialGradient>
              </defs>
              <circle cx="39" cy="39" r="37" fill="url(#coin-grad3)" stroke="#d4a853" stroke-width="1.5"/>
              <circle cx="39" cy="39" r="31" fill="none" stroke="#d4a853" stroke-width="0.5" opacity="0.6"/>
              <rect x="34" y="34" width="10" height="10" rx="1" fill="none" stroke="#8b6914" stroke-width="1.2"/>
              <text x="39" y="24" text-anchor="middle" font-family="serif" font-size="8" fill="#f5e6c8" font-weight="700">开</text>
              <text x="39" y="59" text-anchor="middle" font-family="serif" font-size="8" fill="#f5e6c8" font-weight="700">宝</text>
              <text x="21" y="42" text-anchor="middle" font-family="serif" font-size="6" fill="#f5e6c8" font-weight="600">元</text>
              <text x="57" y="42" text-anchor="middle" font-family="serif" font-size="6" fill="#f5e6c8" font-weight="600">通</text>
            </svg>
            <!-- Under-glow -->
            <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 w-14 h-2 rounded-full opacity-30" style="background:var(--color-accent-gold); filter:blur(6px);"></div>
          </div>

        </div>
      </section>

      <!-- Current Coin Result Display (last toss result) -->

        <div class="rounded-lg px-4 py-3 text-center" style="background:var(--color-background-elevated); border:1px solid var(--color-border-strong);">
          <div class="flex items-center justify-center gap-3">
            <span class="text-xs tracking-[0.1em]" style="color:var(--color-foreground-muted); font-family:var(--font-mono);">上一次</span>
            <div class="flex items-center gap-1.5">

          <div class="flex items-center justify-between mb-2">
            <span class="divination-caption text-[10px] tracking-[0.15em]" style="color:var(--color-accent-gold);">上卦</span>
          </div>

          <!-- Line 6 (top, COMPLETED: 少阳, static yang = solid line) -->
          <div class="flex items-center gap-3 py-1.5">
            <span class="divination-mono text-[10px] w-5 text-right" style="color:var(--color-foreground-primary);">六</span>
            <div class="flex-1 flex items-center justify-center h-5">
              <div class="w-full h-[3px] rounded" style="background:var(--color-foreground-primary);"></div>
            </div>
            <span class="w-10 text-center text-[10px] whitespace-nowrap" style="color:var(--color-foreground-secondary); font-family:var(--font-mono);">少阳</span>
          </div>

          <!-- Line 5 (COMPLETED: 少阴, static yin = broken line) -->
          <div class="flex items-center gap-3 py-1.5">
            <span class="divination-mono text-[10px] w-5 text-right" style="color:var(--color-foreground-primary);">五</span>
            <div class="flex-1 flex items-center justify-center h-5 gap-3">
              <div class="flex-1 h-[3px] rounded" style="background:var(--color-foreground-primary);"></div>
              <div class="w-4"></div>
              <div class="flex-1 h-[3px] rounded" style="background:var(--color-foreground-primary);"></div>
            </div>
            <span class="w-10 text-center text-[10px] whitespace-nowrap" style="color:var(--color-foreground-secondary); font-family:var(--font-mono);">少阴</span>
          </div>

          <!-- Line 4 (completed: 少阳, static yang = solid line) -->
          <div class="flex items-center gap-3 py-1.5">
            <span class="divination-mono text-[10px] w-5 text-right" style="color:var(--color-foreground-primary);">四</span>
            <div class="flex-1 flex items-center justify-center h-5">
              <div class="w-full h-[3px] rounded" style="background:var(--color-foreground-primary);"></div>
            </div>
            <span class="w-10 text-center text-[10px] whitespace-nowrap" style="color:var(--color-foreground-secondary); font-family:var(--font-mono);">少阳</span>
          </div>

          <!-- Divider -->
          <div class="flex items-center gap-3 py-1">
            <div class="w-5"></div>
            <div class="flex-1 h-px" style="background:var(--color-border-strong);"></div>
            <div class="w-10"></div>
          </div>

          <!-- Lower Trigram label + lines 1-3 -->
          <div class="flex items-center justify-between mb-2">
            <span class="divination-caption text-[10px] tracking-[0.15em]" style="color:var(--color-accent-gold);">下卦</span>
          </div>

          <!-- Line 3 (completed: 老阴, changed yin = broken line) -->
          <div class="flex items-center gap-3 py-1.5">
            <span class="divination-mono text-[10px] w-5 text-right" style="color:var(--color-foreground-primary);">三</span>
            <div class="flex-1 flex items-center justify-center h-5 gap-3">
              <div class="flex-1 h-[3px] rounded" style="background:var(--color-foreground-primary);"></div>
              <div class="w-4"></div>
              <div class="flex-1 h-[3px] rounded" style="background:var(--color-foreground-primary);"></div>
            </div>
            <span class="w-10 text-center text-[10px] whitespace-nowrap" style="color:var(--color-accent-gold); font-family:var(--font-mono);">老阴</span>
          </div>

          <!-- Line 2 (completed: 少阳, static yang = solid line) -->
          <div class="flex items-center gap-3 py-1.5">
            <span class="divination-mono text-[10px] w-5 text-right" style="color:var(--color-foreground-primary);">二</span>
            <div class="flex-1 flex items-center justify-center h-5">
              <div class="w-full h-[3px] rounded" style="background:var(--color-foreground-primary);"></div>
            </div>
            <span class="w-10 text-center text-[10px] whitespace-nowrap" style="color:var(--color-foreground-secondary); font-family:var(--font-mono);">少阳</span>
          </div>

          <!-- Line 1 (bottom, completed: 老阳, changed yang = solid line with marker) -->
          <div class="flex items-center gap-3 py-1.5">
            <span class="divination-mono text-[10px] w-5 text-right" style="color:var(--color-foreground-primary);">初</span>
            <div class="flex-1 flex items-center justify-center h-5">
              <div class="w-full h-[3px] rounded relative" style="background:var(--color-foreground-primary);">
                <div class="absolute -top-0.5 -right-1 w-1.5 h-1.5 rounded-full" style="background:var(--color-accent-gold);"></div>
              </div>
            </div>
            <span class="w-10 text-center text-[10px] whitespace-nowrap" style="color:var(--color-accent-gold); font-family:var(--font-mono);">老阳</span>
          </div>

        </div>
      </div>

      <!-- Question Display (shown after tosses begin, displaying the user's asked question) -->
      <div class="relative z-10 flex-shrink-0 w-full max-w-sm mx-auto mt-4">
        <div class="rounded-lg px-4 py-3" style="background:rgba(26, 26, 40, 0.5); border:1px solid var(--color-border);">
          <div class="flex items-start gap-2">
            <span class="flex-shrink-0 pt-0.5" style="font-family:var(--font-mono); font-size:var(--text-xs); letter-spacing:var(--tracking-wider); text-transform:uppercase; color:var(--color-foreground-muted);">所问</span>
            <p class="text-sm" style="font-family:var(--font-body); color:var(--color-foreground-primary); font-size:var(--text-base); line-height:var(--leading-relaxed);">
              最近的工作变动会不会顺利？
            </p>
          </div>
        </div>
      </div>

      <!-- Action Area — State B: Completed 6 tosses, show "再摇一次" -->
      <div class="relative z-10 flex-shrink-0 w-full max-w-sm mx-auto mt-5 text-center">
        <!-- "摇一摇" button (hidden in completed state) -->
        <button
          id="btn-start-divine-v2"
          data-dom-id="btn-start-divine-v2"
          class="inline-flex items-center justify-center whitespace-nowrap rounded-lg px-8 py-3.5 text-base font-semibold tracking-[0.08em] transition-all duration-200"
          style="
            font-family: var(--font-display);
            color: var(--color-background);
            background: var(--color-brand);
            box-shadow: 0 0 20px rgba(0,229,160,0.25), 0 0 40px rgba(0,229,160,0.1);
            min-height: 48px;
            display: none;
          "
        >
          摇一摇
        </button>

        <!-- "再摇一次" button (visible in completed state) -->
        <button
          id="btn-reshake-v2"
          data-dom-id="btn-reshake-v2"
          class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-lg px-8 py-3.5 text-base font-semibold tracking-[0.08em] transition-all duration-200"
          style="
            font-family: var(--font-display);
            color: var(--color-background);
            background: var(--color-brand);
            box-shadow: 0 0 20px rgba(0,229,160,0.25), 0 0 40px rgba(0,229,160,0.1), 0 0 12px rgba(212,168,83,0.15);
            min-height: 48px;
            border: 1px solid rgba(212, 168, 83, 0.2);
          "
        >
          <i data-lucide="rotate-ccw" style="width:16px; height:16px; color:var(--color-background); opacity:0.8;"></i>
          再摇一次
        </button>
        <p class="mt-3 text-xs tracking-[0.06em]" style="color:var(--color-foreground-muted);">
          卦象已成，可重新起卦
        </p>
      </div>

      <!-- Bottom spacer for tab bar -->
      <div class="h-16 flex-shrink-0"></div>

    </main>

    <!-- Bottom Tab Bar -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 flex items-center justify-around" style="height:56px; background:rgba(18,18,28,0.85); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-top:1px solid var(--color-border);">
      <a class="tab-item active flex flex-col items-center justify-center gap-0.5 flex-1" data-dom-id="tab-home-v2" data-target="page-shake-v2" aria-label="首页" aria-current="page" style="text-decoration:none;">
        <i data-lucide="home" style="width:20px;height:20px;color:var(--color-brand);"></i>
        <span style="font-size:10px;font-family:var(--font-mono);color:var(--color-brand);letter-spacing:0.05em;">首页</span>
      </a>
      <a class="tab-item flex flex-col items-center justify-center gap-0.5 flex-1" data-dom-id="tab-share-v2" data-target="page-share" aria-label="分享" style="text-decoration:none;">
        <i data-lucide="share-2" style="width:20px;height:20px;color:var(--color-foreground-muted);"></i>
        <span style="font-size:10px;font-family:var(--font-mono);color:var(--color-foreground-muted);letter-spacing:0.05em;">分享</span>
      </a>
      <a class="tab-item flex flex-col items-center justify-center gap-0.5 flex-1" data-dom-id="tab-profile-v2" data-target="page-profile" aria-label="我" style="text-decoration:none;">
        <i data-lucide="user" style="width:20px;height:20px;color:var(--color-foreground-muted);"></i>
        <span style="font-size:10px;font-family:var(--font-mono);color:var(--color-foreground-muted);letter-spacing:0.05em;">我</span>
      </a>
      <a class="tab-item flex flex-col items-center justify-center gap-0.5 flex-1" data-dom-id="tab-settings-v2" data-target="page-settings" aria-label="设置" style="text-decoration:none;">
        <i data-lucide="settings" style="width:20px;height:20px;color:var(--color-foreground-muted);"></i>
        <span style="font-size:10px;font-family:var(--font-mono);color:var(--color-foreground-muted);letter-spacing:0.05em;">设置</span>
      </a>
    </nav>

    <!-- Custom styles for animations (placed before </body> per CSS-Ownership) -->
    <style>
      @keyframes coin-idle {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes float-dot {
        0%, 100% { transform: translateY(0px); opacity: 0.15; }
        50% { transform: translateY(-8px); opacity: 0.25; }
      }
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .coin-float { animation: none !important; }
        @keyframes float-dot { 0%, 100% { transform: none; opacity: 0.15; } }
        @keyframes pulse-glow { 0%, 100% { opacity: 0.8; } }
      }
    </style>
    <script>lucide.createIcons();</script>
</body>
</html>
