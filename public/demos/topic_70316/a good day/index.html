<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#F5F0EB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>更好的一天</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 顶部状态栏 -->
    <header id="header">
      <span id="streak-display">第 1 天</span>
      <span id="date-display"></span>
    </header>

    <!-- 启动页 -->
    <section id="splash-screen" class="page active">
      <div class="splash-content">
        <h1 class="splash-title">更好的一天</h1>
        <p class="splash-subtitle">每天给自己 2 分钟</p>
        <button id="start-btn" class="btn-primary">开始今天</button>
      </div>
    </section>

    <!-- 首次引导弹窗 -->
    <div id="first-guide-overlay" class="overlay hidden">
      <div class="guide-modal">
        <p>每天早上打开这里，<br>给自己 2 分钟。</p>
        <p class="guide-hint">建议设个闹钟提醒自己</p>
        <button id="guide-close-btn" class="btn-secondary">好的，记住了</button>
      </div>
    </div>

    <!-- 主流程区 -->
    <section id="main-flow" class="page hidden">
      <div id="flow-title" class="flow-title"></div>

      <!-- 呼吸动画 -->
      <div id="breathing-container">
        <div id="breathing-circle"></div>
        <div id="breathing-text">吸气…</div>
      </div>

      <!-- 音频进度 -->
      <div id="audio-progress" class="hidden">
        <div id="progress-bar"></div>
      </div>
    </section>

    <!-- 早安消息页 -->
    <section id="morning-message-page" class="page hidden">
      <div class="message-card">
        <p id="morning-message-text" class="morning-message-text"></p>
      </div>
      <button id="to-submit-btn" class="btn-primary">给陌生人留句话</button>
    </section>

    <!-- 投递页 -->
    <section id="submit-page" class="page hidden">
      <h2 class="submit-title">给一个陌生人<br>留一句话</h2>
      <p class="submit-hint">你的留言会存入信筒，<br>某天会被另一个陌生人读到</p>
      <div class="input-area">
        <textarea id="message-input" maxlength="30" placeholder="写点什么吧…" rows="2"></textarea>
        <span id="char-count">0/30</span>
      </div>
      <div id="submit-error" class="error-msg hidden"></div>
      <button id="submit-btn" class="btn-primary">投递</button>
      <button id="skip-submit-btn" class="btn-link">跳过</button>
    </section>

    <!-- 拆信页 -->
    <section id="letter-page" class="page hidden">
      <div id="letter-envelope" class="letter-envelope">
        <div class="envelope-body">
          <div class="envelope-flap"></div>
          <div class="envelope-icon">✉</div>
          <p class="envelope-label">你收到一封信</p>
          <p class="envelope-hint">点击拆开</p>
        </div>
      </div>
      <div id="letter-content" class="letter-content hidden">
        <div class="letter-paper">
          <p class="letter-salutation">亲爱的陌生人：</p>
          <p id="letter-body" class="letter-body-text"></p>
          <p class="letter-signature">—— 另一个陌生人</p>
        </div>
        <button id="letter-done-btn" class="btn-primary">读完了</button>
      </div>
    </section>

    <!-- 结束页 -->
    <section id="complete-page" class="page hidden">
      <div class="complete-content">
        <div class="complete-icon">✦</div>
        <h2 class="complete-title">今日已完成</h2>
        <p class="complete-subtitle">明天见</p>
        <p class="complete-hint">你可以设个闹钟，<br>明天早上再来</p>
      </div>
    </section>
  </div>

  <script src="js/content.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/sensitive-words.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/breathing.js"></script>
  <script src="js/message-pool.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
