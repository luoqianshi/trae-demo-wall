<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>程序员AI智能刷题</title>
<style>
  :root {
    --bg: #0a0e27;
    --bg2: #111936;
    --surface: #161f3a;
    --surface2: #1e2a4d;
    --ink: #e2e8f0;
    --muted: #94a3b8;
    --primary: #00d4ff;
    --accent2: #7c3aed;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --gradient: linear-gradient(135deg, #00d4ff 0%, #7c3aed 100%);
    --shadow: 0 4px 20px rgba(0,0,0,0.3);
    --radius: 16px;
    --radius-sm: 12px;
    --radius-xs: 8px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 3px; }

  /* Layout */
  .app { display:flex; flex-direction:column; min-height:100vh; }
  .header {
    position:sticky; top:0; z-index:100;
    background: rgba(10,14,39,0.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    padding: 12px 20px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .logo { display:flex; align-items:center; gap:10px; cursor:pointer; }
  .logo-icon {
    width: 34px; height: 34px; border-radius: 10px;
    background: var(--gradient); display:flex; align-items:center; justify-content:center;
    color: #000; font-size: 14px; font-weight: 800;
  }
  .logo-text {
    font-size: 1.1rem; font-weight:700;
    background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .nav { display:flex; gap:20px; }
  .nav-item {
    color: var(--muted); font-size:0.85rem; font-weight:500;
    padding: 4px 0; border-bottom: 2px solid transparent; cursor:pointer; transition: all 0.2s;
  }
  .nav-item:hover, .nav-item.active { color: var(--primary); border-color: var(--primary); }
  .header-actions { display:flex; gap:10px; align-items:center; }

  .main { flex:1; padding: 20px 16px 100px; max-width: 900px; margin: 0 auto; width:100%; }

  /* Mobile bottom nav */
  .mobile-nav {
    display:none; position:fixed; bottom:0; left:0; right:0;
    background: rgba(10,14,39,0.98); backdrop-filter: blur(10px);
    border-top: 1px solid rgba(255,255,255,0.05); z-index:100;
    justify-content:space-around; padding: 6px 0;
  }
  .mobile-nav-item {
    display:flex; flex-direction:column; align-items:center; gap:2px;
    color: var(--muted); font-size:0.6rem; flex:1; cursor:pointer; padding:4px 0; transition:all 0.2s;
    border: none; background: none;
  }
  .mobile-nav-item .icon { font-size:1.3rem; }
  .mobile-nav-item.active { color: var(--primary); }

  /* Buttons */
  .btn {
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding: 10px 20px; border-radius: var(--radius-sm); font-size:0.9rem; font-weight:600;
    border: none; cursor: pointer; transition: all 0.2s; text-decoration:none;
    background: var(--surface2); color: var(--ink);
  }
  .btn-primary { background: var(--gradient); color:#fff; box-shadow: 0 4px 16px rgba(0,212,255,0.25); }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,212,255,0.35); }
  .btn-secondary { background: var(--surface2); color: var(--ink); border: 1px solid rgba(255,255,255,0.08); }
  .btn-secondary:hover { border-color: rgba(0,212,255,0.3); }
  .btn-success { background: var(--success); color:#fff; }
  .btn-danger { background: var(--danger); color:#fff; }
  .btn-sm { padding: 6px 12px; font-size:0.8rem; border-radius: var(--radius-xs); }
  .btn-ghost { background:transparent; color:var(--muted); }
  .btn-ghost:hover { color: var(--ink); }

  /* Cards */
  .card {
    background: var(--surface); border-radius: var(--radius);
    border: 1px solid rgba(255,255,255,0.05); padding: 20px; margin-bottom: 16px;
  }
  .card-title { font-size:1.05rem; font-weight:600; margin-bottom:12px; display:flex; align-items:center; gap:8px; }

  /* Tags */
  .tag {
    display:inline-block; padding: 3px 10px; border-radius: 6px;
    font-size:0.75rem; font-weight:600; margin-right:4px;
  }
  .tag-java { background: rgba(239,68,68,0.15); color: #fca5a5; }
  .tag-frontend { background: rgba(59,130,246,0.15); color: #93c5fd; }
  .tag-algo { background: rgba(245,158,11,0.15); color: #fcd34d; }
  .tag-db { background: rgba(16,185,129,0.15); color: #6ee7b7; }
  .tag-os { background: rgba(139,92,246,0.15); color: #c4b5fd; }
  .tag-system { background: rgba(236,72,153,0.15); color: #f9a8d4; }
  .tag-ai { background: rgba(6,182,212,0.15); color: #67e8f9; }
  .tag-easy { background: rgba(16,185,129,0.15); color: #6ee7b7; }
  .tag-medium { background: rgba(245,158,11,0.15); color: #fcd34d; }
  .tag-hard { background: rgba(239,68,68,0.15); color: #fca5a5; }

  /* Home */
  .home-hero { text-align:center; padding: 40px 20px 30px; }
  .home-hero h1 {
    font-size: clamp(1.6rem, 5vw, 2.2rem); font-weight:800; margin-bottom:12px;
    background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .home-hero p { color: var(--muted); font-size:0.95rem; max-width: 500px; margin: 0 auto; }

  /* Stats */
  .stats-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:12px; margin-bottom:24px; }
  .stat-card { background:var(--surface); border-radius:var(--radius-sm); padding:16px; text-align:center; border:1px solid rgba(255,255,255,0.05); }
  .stat-num { font-size:1.6rem; font-weight:800; background:var(--gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
  .stat-label { font-size:0.8rem; color:var(--muted); margin-top:4px; }

  /* Subject grid */
  .subject-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:12px; margin-bottom:24px; }
  .subject-card {
    background: var(--surface); border-radius: var(--radius-sm); padding: 20px 12px;
    border: 1px solid rgba(255,255,255,0.05); text-align:center; cursor:pointer;
    transition: all 0.25s; position:relative; overflow:hidden;
  }
  .subject-card:hover { transform: translateY(-3px); border-color: rgba(0,212,255,0.2); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
  .subject-card .sub-icon { font-size: 2rem; margin-bottom: 8px; }
  .subject-card .sub-name { font-size:0.9rem; font-weight:600; margin-bottom:4px; }
  .subject-card .sub-count { font-size:0.75rem; color:var(--muted); }
  .subject-card .sub-progress-bar {
    position:absolute; bottom:0; left:0; height:3px; background:var(--gradient); border-radius:0 2px 0 0; transition: width 0.4s;
  }

  /* Question list */
  .q-list { display:flex; flex-direction:column; gap:10px; }
  .q-list-item {
    display:flex; align-items:center; gap:12px; padding:14px 16px;
    background:var(--surface); border-radius:var(--radius-sm); border:1px solid rgba(255,255,255,0.05);
    cursor:pointer; transition: all 0.2s;
  }
  .q-list-item:hover { border-color: rgba(0,212,255,0.2); }
  .q-list-item .q-num { width:32px; height:32px; border-radius:50%; background:var(--bg2); display:flex; align-items:center; justify-content:center; font-size:0.8rem; font-weight:700; flex-shrink:0; }
  .q-list-item .q-info { flex:1; min-width:0; }
  .q-list-item .q-text { font-size:0.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:4px; }
  .q-list-item .q-meta { display:flex; gap:6px; }
  .q-list-item .q-status { font-size:1.1rem; }

  /* Question detail */
  .question-card { background: var(--surface); border-radius: var(--radius); padding: 24px; border: 1px solid rgba(255,255,255,0.05); }
  .q-header { display:flex; align-items:center; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .q-title { font-size:1.1rem; font-weight:600; line-height:1.5; margin-bottom:16px; }
  .q-content { color: var(--muted); line-height: 1.8; margin-bottom: 20px; }
  .q-content h4 { color: var(--ink); margin: 16px 0 8px; font-size: 0.95rem; }
  .q-content ul { padding-left: 20px; margin: 8px 0; }
  .q-content li { margin: 4px 0; }
  .q-content code {
    background: var(--bg2); padding: 2px 6px; border-radius: 4px;
    font-family: "SFMono-Regular", Consolas, monospace; font-size: 0.85rem; color: var(--primary);
  }
  .q-content pre {
    background: var(--bg2); padding: 16px; border-radius: var(--radius-sm);
    overflow-x: auto; margin: 12px 0;
    font-family: "SFMono-Regular", Consolas, monospace; font-size: 0.85rem; line-height: 1.6;
    border: 1px solid rgba(255,255,255,0.05);
  }

  /* Options */
  .q-options { display:flex; flex-direction:column; gap:10px; margin-bottom:20px; }
  .q-option {
    padding: 14px 16px; border-radius: var(--radius-sm); border: 1.5px solid rgba(255,255,255,0.08);
    background: var(--bg2); cursor:pointer; display:flex; align-items:flex-start; gap:12px;
    transition: all 0.2s; font-size:0.95rem;
  }
  .q-option:hover { border-color: rgba(0,212,255,0.3); background: rgba(0,212,255,0.05); }
  .q-option.selected { border-color: var(--primary); background: rgba(0,212,255,0.08); }
  .q-option.correct { border-color: var(--success); background: rgba(16,185,129,0.08); }
  .q-option.wrong { border-color: var(--danger); background: rgba(239,68,68,0.08); }
  .q-option .opt-label {
    width: 28px; height: 28px; border-radius: 50%; background: var(--surface2);
    display:flex; align-items:center; justify-content:center; font-size:0.8rem; font-weight:700;
    flex-shrink:0; margin-top:1px;
  }
  .q-option.selected .opt-label { background: var(--primary); color:#000; }
  .q-option.correct .opt-label { background: var(--success); color:#000; }
  .q-option.wrong .opt-label { background: var(--danger); color:#fff; }
  .q-option .opt-text { flex:1; padding-top:3px; }

  /* Answer section */
  .answer-section { margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.05); }
  .answer-badge { display:inline-flex; align-items:center; gap:6px; padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
  .badge-correct { background: rgba(16,185,129,0.15); color: var(--success); }
  .badge-wrong { background: rgba(239,68,68,0.15); color: var(--danger); }
  .answer-explanation { color: var(--muted); line-height: 1.8; margin-top: 12px; font-size:0.9rem; }

  /* AI Analysis */
  .ai-analysis { margin-top: 20px; padding: 20px; border-radius: var(--radius-sm);
    background: var(--bg2); border: 1px solid rgba(255,255,255,0.05);
  }
  .ai-analysis-header { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .ai-analysis-title { font-weight:700; font-size:1rem; }
  .ai-badge-inline { display:inline-block; padding: 2px 10px; border-radius: 6px;
    background: var(--gradient); color:#fff; font-size:0.75rem; font-weight:700;
  }
  .ai-analysis-body { font-size: 0.9rem; line-height: 1.8; color: var(--muted); }
  .ai-analysis-body h4 { margin: 14px 0 8px; font-size: 0.9rem; color: var(--ink); }
  .ai-analysis-body ul { padding-left: 18px; margin: 8px 0; }
  .ai-analysis-body li { margin: 4px 0; }

  /* AI Chat Float */
  .ai-chat-btn {
    position:fixed; bottom:24px; right:24px; width:56px; height:56px; border-radius:50%;
    background:var(--gradient); color:#fff; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:1.5rem;
    box-shadow: 0 4px 20px rgba(0,212,255,0.3); z-index:90; transition: all 0.3s;
  }
  .ai-chat-btn:hover { transform: scale(1.05); }
  .ai-chat-panel {
    position:fixed; bottom:90px; right:24px; width:360px; max-height:480px;
    background:var(--surface); border-radius:var(--radius); border:1px solid rgba(255,255,255,0.08);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5); z-index:90;
    display:flex; flex-direction:column; overflow:hidden;
    transition: all 0.3s; opacity:0; transform: translateY(20px) scale(0.95); pointer-events:none;
  }
  .ai-chat-panel.open { opacity:1; transform: translateY(0) scale(1); pointer-events:auto; }
  .ai-chat-header { padding:14px 16px; border-bottom:1px solid rgba(255,255,255,0.05); display:flex; align-items:center; justify-content:space-between; }
  .ai-chat-header h4 { font-size:0.95rem; }
  .ai-chat-header .close-chat { background:none; border:none; color:var(--muted); cursor:pointer; font-size:1.2rem; }
  .ai-chat-body { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px; }
  .ai-chat-body .msg { max-width:85%; padding:10px 14px; border-radius:14px; font-size:0.85rem; line-height:1.6; }
  .ai-chat-body .msg.user { align-self:flex-end; background:var(--primary); color:#000; border-bottom-right-radius:4px; }
  .ai-chat-body .msg.ai { align-self:flex-start; background:var(--bg2); border:1px solid rgba(255,255,255,0.05); border-bottom-left-radius:4px; }
  .ai-chat-body .msg.ai .typing { display:inline-block; width:20px; height:8px; }
  .ai-chat-body .msg.ai .typing::after { content:'...'; animation: typing 1.2s infinite; }
  @keyframes typing { 0%,100%{opacity:0.3;} 50%{opacity:1;} }
  .ai-chat-input { display:flex; gap:8px; padding:10px 12px; border-top:1px solid rgba(255,255,255,0.05); }
  .ai-chat-input input { flex:1; background:var(--bg2); border:1px solid rgba(255,255,255,0.08); border-radius:10px; padding:8px 12px; color:var(--ink); font-size:0.85rem; outline:none; }
  .ai-chat-input input:focus { border-color: var(--primary); }
  .ai-chat-input button { background:var(--primary); color:#000; border:none; border-radius:10px; padding:8px 14px; cursor:pointer; font-weight:600; font-size:0.8rem; }

  /* Weakness */
  .weakness-list { display:flex; flex-direction:column; gap:12px; }
  .weakness-item { display:flex; align-items:center; gap:12px; }
  .weakness-item .w-name { width:90px; font-size:0.85rem; }
  .weakness-item .w-bar-wrap { flex:1; height:20px; background:var(--bg2); border-radius:10px; overflow:hidden; }
  .weakness-item .w-bar { height:100%; border-radius:10px; transition: width 0.4s; }
  .weakness-item .w-bar.good { background: var(--success); }
  .weakness-item .w-bar.warning { background: var(--warning); }
  .weakness-item .w-bar.danger { background: var(--danger); }
  .weakness-item .w-rate { width:45px; font-size:0.85rem; text-align:right; }
  .weakness-recommend { margin-top: 20px; padding: 20px; background: var(--bg2); border-radius: var(--radius-sm);
    border: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem;
  }
  .weakness-recommend h4 { margin-bottom: 10px; color: var(--primary); }
  .weakness-recommend ul { padding-left: 18px; }
  .weakness-recommend li { margin: 6px 0; color: var(--muted); }

  /* Progress bar */
  .progress-wrap { margin-bottom:24px; }
  .progress-info { display:flex; justify-content:space-between; font-size:0.85rem; color:var(--muted); margin-bottom:8px; }
  .progress-bar { height:8px; background:var(--bg2); border-radius:4px; overflow:hidden; }
  .progress-fill { height:100%; background:var(--gradient); border-radius:4px; transition: width 0.4s ease; }

  /* Filter / Mode */
  .mode-selector { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
  .mode-btn {
    padding: 8px 16px; border-radius: 10px; background: var(--surface);
    border: 1.5px solid rgba(255,255,255,0.08); color: var(--muted);
    cursor:pointer; font-size:0.85rem; font-weight:500; transition: all 0.2s;
  }
  .mode-btn.active { border-color: var(--primary); color: var(--primary); background: rgba(0,212,255,0.08); }

  /* Section title */
  .section-title { font-size:1.15rem; font-weight:700; margin-bottom:16px; display:flex; align-items:center; gap:8px; }

  /* Animations */
  @keyframes fadeIn { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
  .fade-in { animation: fadeIn 0.4s ease-out; }

  /* Toast */
  .toast {
    position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-60px);
    background:var(--surface); color:var(--ink); padding:10px 20px; border-radius:var(--radius-sm);
    border:1px solid rgba(255,255,255,0.08); box-shadow:0 8px 32px rgba(0,0,0,0.4);
    z-index:300; font-size:0.9rem; transition: transform 0.3s;
  }
  .toast.show { transform:translateX(-50%) translateY(0); }

  /* Modal */
  .modal-overlay {
    position:fixed; inset:0; background: rgba(0,0,0,0.7); z-index:200;
    display:flex; align-items:center; justify-content:center; padding:20px;
    opacity:0; pointer-events:none; transition: opacity 0.3s;
  }
  .modal-overlay.show { opacity:1; pointer-events:auto; }
  .modal-content {
    background:var(--surface); border-radius:var(--radius); padding:28px; max-width:420px; width:100%;
    border:1px solid rgba(255,255,255,0.08); transform: translateY(20px); transition: transform 0.3s;
  }
  .modal-overlay.show .modal-content { transform: translateY(0); }
  .modal-content h3 { margin-bottom:12px; }
  .modal-content p { color:var(--muted); font-size:0.9rem; margin-bottom:20px; }
  .modal-actions { display:flex; gap:10px; justify-content:flex-end; }

  /* Empty state */
  .empty-state { text-align:center; padding:60px 20px; color:var(--muted); }
  .empty-state .empty-icon { font-size:3rem; margin-bottom:12px; opacity:0.5; }

  /* Responsive */
  @media (max-width: 768px) {
    .header .nav { display:none; }
    .mobile-nav { display:flex; }
    .main { padding-bottom: 80px; }
    .subject-grid { grid-template-columns:repeat(2, 1fr); }
    .stats-grid { grid-template-columns:repeat(2, 1fr); }
    .ai-chat-panel { width: calc(100vw - 32px); right: 16px; bottom: 80px; }
    .ai-chat-btn { bottom: 80px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo" onclick="showHome()">
      <div class="logo-icon">AI</div>
      <span class="logo-text">智能刷题</span>
    </div>
    <nav class="nav">
      <div class="nav-item active" onclick="showHome()" data-nav="home">首页</div>
      <div class="nav-item" onclick="showQuestionList()" data-nav="questions">题库</div>
      <div class="nav-item" onclick="showWeakness()" data-nav="weakness">薄弱点</div>
    </nav>
    <div class="header-actions">
      <button class="btn btn-sm btn-ghost" onclick="showResetModal()">🔄 重置</button>
    </div>
  </header>

  <main class="main" id="mainContent"></main>

  <nav class="mobile-nav">
    <button class="mobile-nav-item active" onclick="showHome()" data-mnav="home">
      <span class="icon">🏠</span><span>首页</span>
    </button>
    <button class="mobile-nav-item" onclick="showQuestionList()" data-mnav="questions">
      <span class="icon">📝</span><span>题库</span>
    </button>
    <button class="mobile-nav-item" onclick="showWeakness()" data-mnav="weakness">
      <span class="icon">📊</span><span>薄弱点</span>
    </button>
  </nav>
</div>

<!-- AI Chat -->
<button class="ai-chat-btn" id="aiChatBtn" onclick="toggleChat()">🤖</button>
<div class="ai-chat-panel" id="aiChatPanel">
  <div class="ai-chat-header">
    <h4>🤖 AI 面试助手</h4>
    <button class="close-chat" onclick="toggleChat()">✕</button>
  </div>
  <div class="ai-chat-body" id="chatBody"></div>
  <div class="ai-chat-input">
    <input type="text" id="chatInput" placeholder="询问AI关于本题的知识点..." onkeypress="if(event.key==='Enter') sendChat()">
    <button onclick="sendChat()">发送</button>
  </div>
</div>

<!-- Reset Modal -->
<div class="modal-overlay" id="resetModal">
  <div class="modal-content">
    <h3>⚠️ 重置进度</h3>
    <p>确定要重置所有学习进度吗？此操作不可恢复，所有答题记录和聊天记录将被清空。</p>
    <div class="modal-actions">
      <button class="btn btn-secondary btn-sm" onclick="hideResetModal()">取消</button>
      <button class="btn btn-danger btn-sm" onclick="confirmReset()">确认重置</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===================== DATA =====================
const categories = [

// ===================== STATE =====================
let currentCategory = 'all';
let currentView = 'home';
let currentQuestion = null;
let userAnswers = JSON.parse(localStorage.getItem('ai_interview_answers') || '{}');
let chatHistory = JSON.parse(localStorage.getItem('ai_interview_chat') || '[]');
let filterDifficulty = 'all';
let filterStatus = 'all';

// ===================== UTILS =====================
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

function saveAnswers() {
  localStorage.setItem('ai_interview_answers', JSON.stringify(userAnswers));
}

function saveChat() {
  localStorage.setItem('ai_interview_chat', JSON.stringify(chatHistory));
}

function getQuestionStatus(qid) {
  const ans = userAnswers[qid];
  if (!ans) return 'new';
  return ans.correct ? 'done' : 'wrong';
}

function getStats() {
  const total = questionsData.length;
  const completed = Object.keys(userAnswers).length;
  const correct = Object.values(userAnswers).filter(a => a.correct).length;
  return { total, completed, correct };
}

function getCategoryStats() {
  const stats = {};
  categories.forEach(c => {
    const qs = questionsData.filter(q => q.category === c.id);
    const done = qs.filter(q => userAnswers[q.id]).length;
    stats[c.id] = { total: qs.length, done };
  });
  return stats;
}

function getWeaknessAnalysis() {
  const analysis = {};
  categories.forEach(c => {
    const qs = questionsData.filter(q => q.category === c.id);
    const answered = qs.filter(q => userAnswers[q.id]);
    const wrong = answered.filter(q => !userAnswers[q.id].correct).length;
    const total = qs.length;
    const accuracy = answered.length ? ((answered.length - wrong) / answered.length * 100) : 100;
    analysis[c.id] = { total, answered: answered.length, wrong, accuracy };
  });
  return analysis;
}

// ===================== RENDER =====================
function updateNav() {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.mobile-nav-item').forEach(el => el.classList.remove('active'));
  const navMap = { home: 'home', questions: 'questions', detail: 'questions', weakness: 'weakness' };
  const navEl = document.querySelector(`.nav-item[data-nav="${navMap[currentView]}"]`);
  const mNavEl = document.querySelector(`.mobile-nav-item[data-mnav="${navMap[currentView]}"]`);
  if (navEl) navEl.classList.add('active');
  if (mNavEl) mNavEl.classList.add('active');
}

  currentView = 'home';
  updateNav();
  const stats = getStats();
  const catStats = getCategoryStats();

    if (data.answered > 0 && data.accuracy < minAcc) {
      minAcc = data.accuracy;
      weakest = cid;
    }
  });

  document.getElementById('mainContent').innerHTML = `
    <div class="fade-in">
      <div class="home-hero">
        <h1>AI 智能刷题平台</h1>
        <p>7大技术专题，AI 深度解析，智能薄弱点分析，助你从技术面试中脱颖而出</p>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-num">${stats.total}</div>
          <div class="stat-label">总题数</div>

        <div class="stat-card">
          <div class="stat-num">${stats.completed}</div>
          <div class="stat-label">已完成</div>
        </div>
        <div class="stat-card">
          <div class="stat-num">${stats.completed > 0 ? Math.round(stats.correct / stats.completed * 100) : 0}%</div>
          <div class="stat-label">正确率</div>
        </div>

          <div class="stat-num">${stats.completed > 0 ? stats.completed - stats.correct : 0}</div>
          <div class="stat-label">待强化</div>
        </div>
      </div>

      ${weakest ? `
      <div class="card">
        <div class="card-title">⚠️ 薄弱点提醒</div>
        <div style="color: var(--muted); font-size: 0.9rem; margin-bottom: 12px;">
          你在 <strong style="color: var(--danger);">${categories.find(c => c.id === weakest)?.name}</strong> 
          专题的正确率较低（${Math.round(minAcc)}%），建议优先针对性练习。
        </div>
        <button class="btn btn-primary btn-sm" onclick="selectCategory('${weakest}')">去练习</button>
      </div>
      ` : ''}

      <div class="subject-grid">

          const s = catStats[c.id];
          const percent = s.total ? Math.round(s.done / s.total * 100) : 0;
          return `

              <div class="sub-progress-bar" style="width: ${percent}%"></div>

          `;
        }).join('')}
      </div>

      <div class="progress-wrap">
        <div class="progress-info"><span>总进度</span><span>${stats.completed}/${stats.total}</span></div>
        <div class="progress-bar"><div class="progress-fill" style="width: ${stats.total ? Math.round(stats.completed/stats.total*100) : 0}%"></div></div>
      </div>
    </div>
  `;
}

      <div class="q-list">
        ${qs.length === 0 ? `
          <div class="empty-state">
            <div class="empty-icon">📭</div>
            <div>暂无题目，尝试切换筛选条件</div>
          </div>
        ` : qs.map(q => {
          const status = getQuestionStatus(q.id);
          const statusIcon = status === 'done' ? '✅' : status === 'wrong' ? '❌' : '⭕';
          const diffLabel = q.difficulty === 'easy' ? '简单' : q.difficulty === 'medium' ? '中等' : '困难';
          return `
            <div class="q-list-item" onclick="showQuestion(${q.id})">
              <div class="q-num">${q.id}</div>
              <div class="q-info">
                <div class="q-text">${q.title}</div>
                <div class="q-meta">
                  <span class="tag tag-${q.difficulty}">${diffLabel}</span>
                  <span class="tag tag-${q.category}">${categories.find(c => c.id === q.category)?.name}</span>
                </div>
              </div>
              <div class="q-status">${statusIcon}</div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function showQuestion(qid) {
  currentView = 'detail';
  const q = questionsData.find(x => x.id === qid);
  if (!q) return;
  currentQuestion = q;
  const ans = userAnswers[qid];

  const cat = categories.find(c => c.id === q.category);
  const diffText = q.difficulty === 'easy' ? '简单' : q.difficulty === 'medium' ? '中等' : '困难';

  document.getElementById('mainContent').innerHTML = `
    <div class="fade-in">
      <div class="question-card">
        <div class="q-header">
          <span class="tag tag-${q.difficulty}">${diffText}</span>
          <span class="tag tag-${q.category}">${cat?.name}</span>
        </div>
        <div class="q-title">${q.id}. ${q.title}</div>
        <div class="q-content">${q.content}</div>

        <div class="q-options" id="optionsList">
          ${q.options.map((opt, idx) => {
            let cls = '';
            if (ans) {
              if (idx === q.correct) cls = 'correct';
              else if (idx === ans.selected && idx !== q.correct) cls = 'wrong';
            }
            const label = ['A', 'B', 'C', 'D'][idx];
            return `
              <div class="q-option ${cls}" onclick="selectOption(${idx})" data-idx="${idx}">
                <div class="opt-label">${label}</div>
                <div class="opt-text">${opt}</div>
              </div>
            `;
          }).join('')}
        </div>

        ${ans ? `
          <div class="answer-section">
            <div style="margin-bottom: 10px;">
              ${ans.correct ? '<span class="answer-badge badge-correct">✓ 回答正确</span>' : '<span class="answer-badge badge-wrong">✗ 回答错误</span>'}
            </div>
            <div class="answer-explanation">${q.explanation}</div>
          </div>

          <div class="ai-analysis">
            <div class="ai-analysis-header">
              <span class="ai-badge-inline">AI</span>
              <span class="ai-analysis-title">深度解析</span>
            </div>
            <div class="ai-analysis-body">${q.aiAnalysis}</div>
          </div>
        ` : ''}

        <div style="display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap;">
          <button class="btn btn-secondary btn-sm" onclick="showQuestionList()">← 返回列表</button>
          ${getPrevNext(q.id)}
        </div>
      </div>
    </div>
  `;

  renderChat();
  if (!ans) {
    addChatMessage('ai', `我是你的AI面试助手。本题考查的是「${cat?.name}」领域的${diffText}难度知识点。做题过程中有任何疑问，都可以随时问我！点击右下角 🤖 打开聊天。`);
  }
}

function getPrevNext(currentId) {
  let qs = questionsData;
  if (currentCategory !== 'all') {
    qs = qs.filter(q => q.category === currentCategory);
  }
  const idx = qs.findIndex(q => q.id === currentId);
  const prev = idx > 0 ? qs[idx - 1] : null;
  const next = idx < qs.length - 1 ? qs[idx + 1] : null;
  let html = '';
  if (prev) html += `<button class="btn btn-secondary btn-sm" onclick="showQuestion(${prev.id})">← 上一题</button>`;
  if (next) html += `<button class="btn btn-primary btn-sm" onclick="showQuestion(${next.id})">下一题 →</button>`;
  return html;
}

function selectOption(idx) {
  if (!currentQuestion) return;
  if (userAnswers[currentQuestion.id]) return;

  const correct = idx === currentQuestion.correct;
  userAnswers[currentQuestion.id] = { selected: idx, correct, time: Date.now() };
  saveAnswers();

  const options = document.querySelectorAll('.q-option');
  options.forEach((el, i) => {
    el.classList.remove('selected');
    if (i === currentQuestion.correct) el.classList.add('correct');
    else if (i === idx) el.classList.add('wrong');
  });

  showQuestion(currentQuestion.id);
  showToast(correct ? '回答正确！🎉' : '回答错误，查看解析巩固知识点');
}

// ===================== AI CHAT =====================
function toggleChat() {
  const panel = document.getElementById('aiChatPanel');
  panel.classList.toggle('open');
}

function renderChat() {
  const container = document.getElementById('chatBody');
  if (!container) return;
  const msgs = chatHistory.filter(c => c.qid === currentQuestion?.id);
  container.innerHTML = msgs.map(m => `
    <div class="msg ${m.role}">${m.content}</div>
  `).join('');
  container.scrollTop = container.scrollHeight;
}

function addChatMessage(role, content) {
  if (!currentQuestion) return;
  chatHistory.push({ qid: currentQuestion.id, role, content, time: Date.now() });
  saveChat();
  renderChat();
}

function sendChat() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || !currentQuestion) return;

  addChatMessage('user', text);
  input.value = '';

  setTimeout(() => {
    const response = generateAIResponse(text, currentQuestion);
    addChatMessage('ai', response);
  }, 600 + Math.random() * 800);
}

function generateAIResponse(text, question) {
  const lower = text.toLowerCase();
  const cat = categories.find(c => c.id === question.category)?.name;

  if (lower.includes('答案') || lower.includes('选')) {
    return `本题正确答案是 <strong>${['A', 'B', 'C', 'D'][question.correct]}</strong>。建议你结合解析理解背后的原理，而不是只记答案。需要我详细讲解为什么这个选项正确吗？`;
  }
  if (lower.includes('为什么') || lower.includes('原理') || lower.includes('讲解')) {
    return `这道题考查的是 <strong>${cat}</strong> 中的核心概念。让我为你梳理一下：\n\n${question.aiAnalysis.replace(/<[^>]+>/g, '').substring(0, 200)}...\n\n如果你想深入了解某个具体方面，可以继续问我！`;
  }
  if (lower.includes('关联') || lower.includes('相关') || lower.includes('延伸')) {
    return `这个知识点在实战中有很多延伸：\n\n1. <strong>面试高频追问</strong>：面试官常会根据这道题继续深挖，比如追问性能优化、边界条件、与其他技术的对比。\n\n2. <strong>实际应用</strong>：在实际项目中，这些原理直接影响系统的性能、可靠性和可维护性。\n\n3. <strong>学习路径</strong>：建议你在掌握基础后，进一步学习相关的源码实现和最佳实践。\n\n你想让我针对哪个方面展开？`;
  }
  if (lower.includes('你好') || lower.includes('hello') || lower.includes('hi')) {
    return `你好！我是你的AI面试助手。我可以帮你：\n• 讲解题目涉及的知识点\n• 分析面试中可能的追问方向\n• 推荐相关的学习资源\n• 模拟面试场景\n\n有什么我可以帮你的吗？`;
  }
  if (lower.includes('面试') || lower.includes('追问')) {
    return `针对这道题，面试官常见的追问方向包括：\n\n1. <strong>深度原理</strong>：底层实现机制、源码级别的理解\n2. <strong>性能对比</strong>：不同方案的时间/空间复杂度、适用场景\n3. <strong>实际问题</strong>：在生产环境中遇到过什么问题？如何排查和解决？\n4. <strong>扩展设计</strong>：如果数据量扩大100倍，方案如何调整？\n\n建议你针对这些方向提前准备。`;
  }

  return `这个问题很有价值！从 <strong>${cat}</strong> 的角度来看，建议你先掌握题目解析中的核心概念，然后再逐步深入到源码和实现细节。\n\n如果是准备面试，重点理解「为什么这样设计」和「在什么场景下使用」，而不仅仅是记住结论。还有什么想聊的吗？`;
}

// ===================== WEAKNESS =====================
function showWeakness() {
  currentView = 'weakness';
  updateNav();
  const analysis = getWeaknessAnalysis();
  const stats = getStats();

  let rows = '';
  categories.forEach(c => {
    const a = analysis[c.id];
    const barClass = a.accuracy >= 80 ? 'good' : a.accuracy >= 50 ? 'warning' : 'danger';
    rows += `
      <div class="weakness-item">
        <div class="w-name">${c.icon} ${c.name}</div>
        <div class="w-bar-wrap"><div class="w-bar ${barClass}" style="width: ${a.answered > 0 ? a.accuracy : 0}%"></div></div>
        <div class="w-rate">${a.answered > 0 ? Math.round(a.accuracy) + '%' : '-'}</div>
      </div>
    `;
  });

  const weakCats = categories.filter(c => {
    const a = analysis[c.id];
    return a.answered > 0 && a.accuracy < 70;
  }).map(c => c.name);

  document.getElementById('mainContent').innerHTML = `
    <div class="fade-in">
      <div class="section-title">📊 薄弱点分析</div>

      <div class="stats-grid" style="margin-bottom: 24px;">
        <div class="stat-card">
          <div class="stat-num">${stats.completed}</div>
          <div class="stat-label">已答题数</div>
        </div>
        <div class="stat-card">
          <div class="stat-num">${stats.completed > 0 ? Math.round(stats.correct/stats.completed*100) : 0}%</div>
          <div class="stat-label">整体正确率</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">各专题掌握情况</div>
        <div class="weakness-list">${rows}</div>
      </div>

      ${weakCats.length > 0 ? `
      <div class="weakness-recommend">
        <h4>🎯 AI 学习建议</h4>
        <ul>
          <li><strong>优先复习</strong>：${weakCats.join('、')} 专题的正确率偏低，建议优先针对性练习</li>
          <li><strong>错题回顾</strong>：重点复习标记为"待复习"的题目，理解错误原因</li>
          <li><strong>深度理解</strong>：不要只记答案，通过 AI 深度解析理解背后的设计思想</li>
          <li><strong>模拟面试</strong>：使用 AI 面试助手模拟面试官追问，检验理解深度</li>
        </ul>
        <button class="btn btn-primary btn-sm" style="margin-top: 12px;" onclick="selectCategory('${categories.find(c => analysis[c.id].answered > 0 && analysis[c.id].accuracy === Math.min(...Object.values(analysis).filter(a => a.answered > 0).map(a => a.accuracy)))?.id}')">开始针对性练习</button>
      </div>
      ` : stats.completed > 0 ? `
      <div class="weakness-recommend">
        <h4>🎉 表现不错！</h4>
        <ul>
          <li>你的整体正确率较高，继续保持！</li>
          <li>可以尝试挑战更多难题，或学习新的专题</li>
          <li>使用 AI 面试助手模拟真实面试场景</li>
        </ul>
      </div>
      ` : `
      <div class="weakness-recommend">
        <h4>📚 开始学习</h4>
        <ul>
          <li>你还没有答题记录，无法分析薄弱点</li>
          <li>先去题库练习一些题目吧！</li>
        </ul>
        <button class="btn btn-primary btn-sm" style="margin-top: 12px;" onclick="showQuestionList()">去刷题</button>
      </div>
      `}
    </div>
  `;
}

function selectCategory(cat) {
  currentCategory = cat;
  showQuestionList();
}

function setFilter(type, value) {
  if (type === 'difficulty') filterDifficulty = value;
  if (type === 'status') filterStatus = value;
  renderQuestionList();
}

// ===================== RESET =====================
function showResetModal() {
  document.getElementById('resetModal').classList.add('show');
}

function hideResetModal() {
  document.getElementById('resetModal').classList.remove('show');
}

function confirmReset() {
  userAnswers = {};
  chatHistory = [];
  saveAnswers();
  saveChat();
  hideResetModal();
  if (currentView === 'weakness') showWeakness();
  else if (currentView === 'questions') showQuestionList();
  else showHome();
  showToast('进度已重置');
}

// ===================== INIT =====================
function init() {
  showHome();
}

init();
</script>
