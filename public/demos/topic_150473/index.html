<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>GRITTY OUTFIT — 穿搭引擎</title>

  <style>
    /* ===================== DESIGN TOKENS ===================== */
    :root {
      /* Gritty Culture Blog - Dark Editorial Style */
      --black:        #0a0a0a;
      --black-light:  #141414;
      --black-card:   #1a1a1a;
      --gray-900:     #222222;
      --gray-800:     #2a2a2a;
      --gray-700:     #3a3a3a;
      --gray-600:     #555555;
      --gray-500:     #777777;
      --gray-400:     #999999;
      --gray-300:     #bbbbbb;
      --gray-200:     #dddddd;
      --gray-100:     #eeeeee;
      --white:        #f5f5f5;

      --accent:        #ff6b00;
      --accent-hover:  #ff8533;
      --accent-dark:   #cc5500;
      --accent-glow:   rgba(255, 107, 0, 0.35);

      --surface-solid:  #1a1a1a;
      --surface-medium: #141414;
      --surface-light:  #222222;
      --surface-hover:  #2a2a2a;

      --border-subtle:  rgba(255, 255, 255, 0.06);
      --border-visible: rgba(255, 255, 255, 0.10);
      --border-accent:  rgba(255, 107, 0, 0.30);

      --text-primary:   #f5f5f5;
      --text-secondary: #999999;
      --text-muted:     #555555;
      --text-accent:    #ff6b00;

      --radius-sm: 0.25rem;
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;

      --shadow-deep:
        0 16px 48px rgba(0, 0, 0, 0.50),
        0 4px 16px rgba(0, 0, 0, 0.30);
      --shadow-medium:
        0 8px 24px rgba(0, 0, 0, 0.35),
        0 2px 8px rgba(0, 0, 0, 0.20);
      --shadow-soft:
        0 4px 16px rgba(0, 0, 0, 0.25),
        0 1px 4px rgba(0, 0, 0, 0.15);
      --shadow-glow:
        0 0 24px var(--accent-glow),
        0 0 48px rgba(255, 107, 0, 0.12);
    }

    /* ===================== RESET ===================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      scroll-behavior: smooth;
    }
    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      color: var(--text-primary);
      background: var(--black);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      cursor: crosshair;
    }

    /* Custom cursor dot */
    body::after {
      content: '';
      position: fixed;
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.8;
      transform: translate(-50%, -50%);
      transition: opacity 0.2s ease;
      top: 50%;
      left: 50%;
    }

    button { font: inherit; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    img { display: block; max-width: 100%; }

    /* ===================== BACKGROUND LAYERS ===================== */
    .bg-grid {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    .bg-noise {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
      background-size: 256px 256px;
    }

    .bg-gradient {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 70% 50% at 15% 5%, rgba(80, 40, 10, 0.12), transparent),
        radial-gradient(ellipse 60% 40% at 85% 95%, rgba(60, 30, 5, 0.10), transparent),
        radial-gradient(ellipse 50% 50% at 50% 50%, rgba(20, 10, 0, 0.08), transparent);
    }

    /* ===================== PIXEL STRETCH ELEMENTS ===================== */
    .pixel-bar {
      position: absolute;
      background: linear-gradient(90deg, var(--accent), transparent);
      opacity: 0;
      transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      transform: scaleX(0);
      transform-origin: left center;
    }
    .pixel-bar.visible {
      opacity: 1;
      transform: scaleX(1);
    }

    .pixel-stretch-hover {
      position: relative;
      overflow: hidden;
    }
    .pixel-stretch-hover::before {
      content: '';
      position: absolute; inset: 0;
      z-index: 2;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
      background-size: 128px 128px;
      pointer-events: none;
    }
    .pixel-stretch-hover::after {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 3px;
      height: 100%;
      background: var(--accent);
      opacity: 0;
      transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
    }
    .pixel-stretch-hover:hover::after {
      width: 100%;
      opacity: 0.05;
    }

    /* ===================== SOLID SURFACES ===================== */
    .surface-card {
      background: var(--surface-solid);
      border: 1px solid var(--border-visible);
      box-shadow: var(--shadow-medium);
    }

    .surface-panel {
      background: var(--surface-medium);
      border: 1px solid var(--border-visible);
      box-shadow: var(--shadow-deep);
    }

    .surface-light-bg {
      background: var(--surface-light);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-soft);
    }

    /* ===================== FLOATING PARTICLES ===================== */
    .particles-canvas {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
    }

    /* ===================== LAYOUT ===================== */
    .app-shell {
      position: relative; z-index: 10;
      min-height: 100vh;
      max-width: 36rem;
      margin: 0 auto;
      padding: 0 1rem;
      padding-top: max(5.5rem, calc(1rem + env(safe-area-inset-top)));
      padding-bottom: max(7rem, calc(1.5rem + env(safe-area-inset-bottom)));
    }

    /* ===================== HERO SECTION ===================== */
    .hero-section {
      display: flex;
      align-items: stretch;
      min-height: 55vh;
      padding: 1.5rem 0 2rem;
      gap: 1.5rem;
      position: relative;
    }

    .hero-headline {
      font-size: clamp(4rem, 15vw, 8rem);
      font-weight: 900;
      letter-spacing: -0.08em;
      line-height: 0.85;
      color: var(--text-primary);
      flex-shrink: 0;
      writing-mode: vertical-rl;
      text-orientation: upright;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      position: relative;
    }
    .hero-headline::after {
      content: '';
      position: absolute;
      right: -0.5rem;
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--border-visible);
    }

    .hero-right {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-left: 1rem;
      flex: 1;
      min-width: 0;
    }

    .hero-overline {
      font-size: 0.625rem;
      font-weight: 900;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }
    .hero-overline span {
      color: var(--text-accent);
    }

    .hero-subtitle {
      font-size: clamp(1.125rem, 4vw, 1.75rem);
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-primary);
      margin-bottom: 0.375rem;
    }

    .hero-desc {
      font-size: 0.8125rem;
      color: var(--text-secondary);
      line-height: 1.75;
    }

    .hero-divider {
      width: 3rem;
      height: 2px;
      background: var(--accent);
      margin: 1.25rem 0;
      flex-shrink: 0;
    }

    .hero-stats {
      display: flex;
      gap: 2rem;
    }
    .hero-stat {
      display: flex;
      flex-direction: column;
    }
    .hero-stat .stat-num {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--accent);
      line-height: 1;
    }
    .hero-stat .stat-label {
      font-size: 0.625rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .hero-bottom-line {
      width: 100%;
      height: 1px;
      background: var(--accent);
      opacity: 0.6;
      margin-bottom: 2rem;
    }

    /* ===================== NAVBAR ===================== */
    .navbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 30;
      padding-top: max(0.5rem, env(safe-area-inset-top));
      padding-bottom: 0;
      padding-left: 0; padding-right: 0;
      background: var(--black);
      border-bottom: 1px solid var(--border-subtle);
    }

    .navbar-inner {
      max-width: 36rem; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.625rem 1rem;
    }

    .nav-brand {
      display: flex; align-items: center; gap: 0.75rem;
    }

    .nav-logo {
      width: 2.25rem; height: 2.25rem;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      position: relative;
      overflow: hidden;
      clip-path: polygon(0 0, 100% 0, 100% 75%, 75% 100%, 0 100%);
    }

    .nav-logo-text {
      font-size: 0.5625rem;
      font-weight: 900;
      letter-spacing: 0.14em;
      color: var(--black);
      text-transform: uppercase;
    }

    .nav-title {
      display: flex; flex-direction: column;
    }
    .nav-title span:first-child {
      font-size: 0.625rem; font-weight: 900;
      letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--text-muted);
    }
    .nav-title span:last-child {
      font-size: 0.9375rem; font-weight: 900;
      letter-spacing: -0.06em; color: var(--text-primary);
      text-transform: uppercase;
    }

    .nav-actions {
      display: flex; gap: 0.5rem;
    }

    .nav-btn {
      width: 2.25rem; height: 2.25rem;
      border-radius: var(--radius-md);
      background: var(--black-card);
      border: 1px solid var(--border-subtle);
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s ease-out;
    }
    .nav-btn:hover {
      background: var(--surface-hover);
      border-color: var(--border-accent);
      box-shadow: 0 0 16px rgba(255, 107, 0, 0.15);
      transform: translateY(-1px);
    }
    .nav-btn:active { transform: scale(0.92); }
    .nav-btn svg { width: 1rem; height: 1rem; color: var(--text-secondary); }

    /* ===================== SECTION HEADER ===================== */
    .section-header {
      display: flex; align-items: flex-end; justify-content: space-between;
      margin-bottom: 1rem; padding: 0 0.25rem;
    }
    .section-header h2 {
      font-size: 1.25rem; font-weight: 900;
      letter-spacing: -0.06em; color: var(--text-primary);
      text-transform: uppercase;
    }
    .section-header p {
      font-size: 0.8125rem; color: var(--text-muted);
      margin-top: 0.25rem;
      line-height: 1.65;
    }
    .section-badge {
      font-size: 0.625rem; font-weight: 900;
      letter-spacing: 0.15em; text-transform: uppercase;
      padding: 0.375rem 0.75rem;
      border-radius: var(--radius-sm);
      background: var(--surface-light);
      border: 1px solid var(--border-subtle);
      color: var(--text-accent);
    }

    /* ===================== FILTER PANEL - COMPACT HORIZONTAL BAR ===================== */
    .filter-panel {
      margin-bottom: 2.5rem;
      position: relative;
      background: var(--surface-solid);
      border: 1px solid var(--border-visible);
      box-shadow: var(--shadow-medium);
      overflow: hidden;
    }

    .filter-panel::before {
      content: '';
      position: absolute; top: 0; left: 0;
      width: 100%; height: 3px;
      background: linear-gradient(90deg, var(--accent), transparent 60%);
      opacity: 0.8;
    }

    .filter-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s ease;
      border-bottom: 1px solid var(--border-subtle);
    }
    .filter-header-row:hover {
      background: var(--surface-hover);
    }

    .filter-section-label {
      font-size: 0.625rem;
      font-weight: 900;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      position: relative;
      padding-left: 1rem;
    }
    .filter-section-label::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--accent);
    }

    .filter-header-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .filter-toggle-icon {
      font-size: 0.875rem;
      color: var(--text-secondary);
      transition: transform 0.3s ease;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem 1rem;
      padding: 0.75rem 1rem;
    }
    .filter-grid.collapsed {
      display: none;
    }

    .filter-group { margin-bottom: 0; }

    .filter-label {
      font-size: 0.5625rem; font-weight: 900;
      letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 0.5rem;
    }

    .filter-options {
      display: flex; flex-wrap: wrap; gap: 0.375rem;
    }

    .filter-chip {
      padding: 0.375rem 0.75rem;
      border-radius: var(--radius-md);
      font-size: 0.75rem; font-weight: 600;
      color: var(--text-secondary);
      background: var(--black-card);
      border: 0.5px solid rgba(255, 255, 255, 0.08);
      transition: all 0.2s ease-out;
      position: relative; overflow: hidden;
    }
    .filter-chip span { position: relative; z-index: 1; }
    .filter-chip:hover {
      border-color: var(--border-accent);
      box-shadow: 0 0 12px rgba(255, 107, 0, 0.12);
    }
    .filter-chip:active { transform: scale(0.94); }
    .filter-chip.active {
      color: var(--black);
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(255, 107, 0, 0.25), 0 2px 8px rgba(0,0,0,0.3);
    }
    .filter-chip.active span { color: var(--black); font-weight: 700; }

    /* Chip entrance animation */
    @keyframes chip-in {
      from { opacity: 0; transform: translateY(8px) scale(0.9); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .filter-chip { animation: chip-in 0.4s cubic-bezier(0.16, 1, 0.3, 1) backwards; }

    /* ===================== RESULT AREA ===================== */
    .result-section { margin-top: 0; }

    .result-section .section-header {
      border-left: 3px solid var(--accent);
      padding-left: 1rem;
      margin-bottom: 1.5rem;
    }
    .result-section .section-header h2 {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
    }
    .result-section .section-header h2 .section-num {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--text-muted);
      opacity: 0.4;
    }
    .result-section .section-header h2 .section-label-text {
      font-size: 0.75rem;
      font-weight: 900;
      letter-spacing: 0.15em;
    }

    /* ===================== EMPTY STATE - DRAMATIC ===================== */
    .empty-state {
      text-align: center;
      padding: 4rem 1rem;
      position: relative;
      overflow: hidden;
    }
    .empty-state::before,
    .empty-state::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 12rem;
      height: 1px;
      background: var(--border-visible);
    }
    .empty-state::before {
      transform: translate(-50%, -50%) rotate(45deg);
    }
    .empty-state::after {
      transform: translate(-50%, -50%) rotate(-45deg);
    }

    .empty-cross-ring {
      width: 6rem;
      height: 6rem;
      margin: 0 auto 1.5rem;
      border: 2px dashed var(--gray-700);
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: dash-rotate-ring 8s linear infinite;
    }
    @keyframes dash-rotate-ring {
      to { transform: rotate(360deg); }
    }
    .empty-cross-ring::before {
      content: '';
      position: absolute;
      width: 80%;
      height: 1px;
      background: var(--border-visible);
      transform: rotate(45deg);
    }
    .empty-cross-ring::after {
      content: '';
      position: absolute;
      width: 80%;
      height: 1px;
      background: var(--border-visible);
      transform: rotate(-45deg);
    }

    .empty-title {
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      position: relative;
      z-index: 1;
    }
    .empty-state .empty-desc {
      font-size: 0.8125rem;
      color: var(--text-muted);
      line-height: 1.65;
      position: relative;
      z-index: 1;
    }

    /* ===================== OUTFIT CARDS - MAGAZINE MIX ===================== */
    .outfit-card {
      border-radius: var(--radius-lg);
      margin-top: 1rem;
      position: relative; overflow: hidden;
      cursor: pointer;
      background: var(--surface-solid);
      border: 1px solid var(--border-visible);
      box-shadow: var(--shadow-medium);
      transition: all 0.3s ease-out;
    }
    .outfit-card::before {
      content: '';
      position: absolute; top: -1px; left: -1px;
      width: calc(100% + 2px); height: 3px;
      background: linear-gradient(90deg, var(--accent), transparent 80%);
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 10;
    }
    .outfit-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-deep), 0 0 24px rgba(255, 107, 0, 0.08);
      border-color: var(--border-accent);
    }
    .outfit-card:hover::before { opacity: 0.8; }
    .outfit-card:active { transform: scale(0.97); }

    /* Card entrance stagger */
    @keyframes card-enter {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .card-animate {
      animation: card-enter 0.5s cubic-bezier(0.16, 1, 0.3, 1) backwards;
    }

    /* Card background number */
    .card-number {
      position: absolute;
      top: -0.5rem; right: 0.75rem;
      font-size: 4rem;
      font-weight: 900;
      color: rgba(255, 107, 0, 0.06);
      line-height: 1;
      pointer-events: none;
      z-index: 0;
    }

    /* --- FEATURED CARD --- */
    .outfit-card.featured {
      padding: 0;
      margin-top: 0;
    }
    .outfit-card.featured .outfit-image-wrap {
      aspect-ratio: 16/9;
      border-radius: var(--radius-lg);
    }
    .outfit-card.featured .outfit-image-wrap::after {
      display: none;
    }
    .outfit-card.featured .outfit-overlay-text {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 2rem 1.25rem 1.25rem;
      background: linear-gradient(0deg, rgba(10,10,10,0.9) 0%, rgba(10,10,10,0.4) 50%, transparent 100%);
      z-index: 3;
    }
    .outfit-card.featured .outfit-overlay-text h3 {
      font-size: 1.375rem;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: var(--text-primary);
      margin-bottom: 0.25rem;
    }
    .outfit-card.featured .outfit-overlay-text p {
      font-size: 0.8125rem;
      color: var(--gray-300);
      line-height: 1.65;
    }
    .outfit-card.featured .outfit-overlay-text .outfit-tags {
      margin-top: 0.75rem;
    }

    /* --- HORIZONTAL CARD --- */
    .outfit-card.horizontal {
      display: flex;
      flex-direction: row;
      gap: 1rem;
      padding: 0;
    }
    .outfit-card.horizontal .outfit-image-wrap {
      width: 40%;
      flex-shrink: 0;
      aspect-ratio: 1/1;
      border-radius: var(--radius-lg) 0 0 var(--radius-lg);
    }
    .outfit-card.horizontal .outfit-image-wrap::after {
      display: none;
    }
    .outfit-card.horizontal .outfit-info {
      padding: 0.75rem 0.75rem 0.75rem 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex: 1;
      min-width: 0;
    }
    .outfit-card.horizontal .outfit-info h3 {
      font-size: 1rem; font-weight: 900;
      letter-spacing: -0.04em; color: var(--text-primary);
    }
    .outfit-card.horizontal .outfit-info p {
      font-size: 0.75rem; color: var(--text-muted);
      margin-top: 0.25rem; line-height: 1.65;
    }
    .outfit-card.horizontal .outfit-info .outfit-tags {
      margin-top: 0.5rem;
    }

    .outfit-image-wrap {
      position: relative; overflow: hidden;
      background: var(--black-card);
    }
    .outfit-image-wrap img {
      width: 100%; height: 100%;
      object-fit: cover; object-position: center;
      transition: transform 0.5s ease-out, filter 0.4s ease;
    }

          speedY: (Math.random() - 0.5) * 0.3,
          opacity: Math.random() * 0.3 + 0.05
        };
      }
      for (var i = 0; i < PARTICLE_COUNT; i++) particles.push(createParticle());

      function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(function (p) {
          p.x += p.speedX;
          p.y += p.speedY;
          if (p.x < 0) p.x = canvas.width;
          if (p.x > canvas.width) p.x = 0;
          if (p.y < 0) p.y = canvas.height;
          if (p.y > canvas.height) p.y = 0;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(255, 107, 0, " + p.opacity + ")";
          ctx.fill();
        });

        // Draw connections
        for (var a = 0; a < particles.length; a++) {
          for (var b = a + 1; b < particles.length; b++) {
            var dx = particles[a].x - particles[b].x;
            var dy = particles[a].y - particles[b].y;
            var dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 120) {
              ctx.beginPath();
              ctx.moveTo(particles[a].x, particles[a].y);
              ctx.lineTo(particles[b].x, particles[b].y);
              ctx.strokeStyle = "rgba(255, 107, 0, " + (0.06 * (1 - dist / 120)) + ")";
              ctx.lineWidth = 0.5;
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(animateParticles);
      }

        $$(".filter-options").forEach(function (group) {

          var chips = group.querySelectorAll(".filter-chip");
          chips.forEach(function (chip) {
            chip.addEventListener("click", function () {
              var val = chip.getAttribute("data-value");
              if (chip.classList.contains("active")) {
                chip.classList.remove("active");
                filters[filterKey] = null;
              } else {
                chips.forEach(function (c) { c.classList.remove("active"); });
                chip.classList.add("active");
                filters[filterKey] = val;
              }
              updateFilterCount();
            });
          });
        });
      }

      function updateFilterCount() {
        var count = 0;
        for (var k in filters) { if (filters[k]) count++; }
        filterCount.textContent = count > 0 ? count + " 已选" : "未选择";

        setTimeout(function () {
          currentOutfits = matchOutfits(filters);

            setTimeout(function () { toast.remove(); }, 350);

          grid.classList.toggle("collapsed");
          var icon = filterToggle.querySelector(".filter-toggle-icon");
          icon.textContent = grid.classList.contains("collapsed") ? "\u25B8" : "\u25BE";
        });
      }

      /* ---------- KEYBOARD ---------- */
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") closeDetail();
      });

      /* ---------- START ---------- */
      init();
    })();
  </script>
</body>
</html>
