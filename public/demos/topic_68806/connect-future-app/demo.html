<body>

<div id="app">
  <div class="header">
    <h1>衔接未来</h1>
    <p>您的智能生活服务助手</p>
  </div>

  <div class="speech-banner" id="speechBanner">正在聆听，请说话...</div>

  <div class="chat-area" id="chatArea"></div>

  <div class="input-area">
    <button class="voice-btn" id="voiceBtn" onclick="toggleVoice()">
      <span class="voice-indicator"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="8" y1="23" x2="16" y2="23"></line>
      </svg>
    </button>
    <input type="text" id="textInput" placeholder="输入文字或按麦克风说话..." autocomplete="off">
    <button class="send-btn" id="sendBtn" onclick="handleSend()">发送</button>
  </div>
  <div class="voice-notice" id="voiceNotice">当前浏览器不支持语音识别，请使用文字输入。推荐使用Chrome浏览器获得最佳体验。</div>
</div>

<script>
  // ====== Voice System ======
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const voiceBtn = document.getElementById('voiceBtn');
  const speechBanner = document.getElementById('speechBanner');
  const voiceNotice = document.getElementById('voiceNotice');
  let recognition = null;
  let isRecording = false;
  let ttsEnabled = true;

  // Check browser support
  if (!SpeechRecognition) {
    voiceBtn.style.opacity = '0.4';
    voiceBtn.style.pointerEvents = 'none';
    voiceNotice.style.display = 'block';
  }

  // Initialize speech recognition
  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'zh-CN';
    recognition.interimResults = true;
    recognition.continuous = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      isRecording = true;
      voiceBtn.classList.add('recording');
      speechBanner.classList.add('show');
      speechBanner.textContent = '正在聆听，请说话...';
      textInput.placeholder = '语音识别中...';
    };

    recognition.onresult = (event) => {
      let finalText = '';
      let interimText = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        if (event.results[i].isFinal) {
          finalText += event.results[i][0].transcript;
        } else {
          interimText += event.results[i][0].transcript;
        }
      }
      if (finalText) {
        textInput.value = finalText;
        speechBanner.textContent = '识别结果：' + finalText;
      } else if (interimText) {
        speechBanner.textContent = '正在识别：' + interimText;
        textInput.value = interimText;
      }
    };

    recognition.onend = () => {
      isRecording = false;
      voiceBtn.classList.remove('recording');
      speechBanner.classList.remove('show');
      textInput.placeholder = '输入文字或按麦克风说话...';

      // Auto-send if we got a result
      const text = textInput.value.trim();
      if (text) {
        setTimeout(() => handleSend(), 300);
      }
    };

    recognition.onerror = (event) => {
      isRecording = false;
      voiceBtn.classList.remove('recording');
      speechBanner.classList.remove('show');
      textInput.placeholder = '输入文字或按麦克风说话...';
      if (event.error === 'not-allowed') {
        speechBanner.textContent = '请允许麦克风权限';
        speechBanner.classList.add('show');
        setTimeout(() => speechBanner.classList.remove('show'), 3000);
      } else if (event.error !== 'aborted') {
        speechBanner.textContent = '语音识别出现问题，请重试';
        speechBanner.classList.add('show');
        setTimeout(() => speechBanner.classList.remove('show'), 2000);
      }
    };
  }

  function toggleVoice() {
    if (!recognition) return;
    if (isRecording) {
      recognition.abort();
    } else {
      textInput.value = '';
      try {
        recognition.start();
      } catch(e) {
        // Already started
      }
    }
  }

  // TTS: speak text aloud, return a promise
  function speak(text) {
    return new Promise((resolve) => {
      if (!ttsEnabled || !window.speechSynthesis) {
        resolve();
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-CN';
      utterance.rate = 0.9;
      utterance.pitch = 1.0;
      utterance.volume = 1.0;

      // Try to find a Chinese voice
      const voices = window.speechSynthesis.getVoices();
      const zhVoice = voices.find(v => v.lang.startsWith('zh'));
      if (zhVoice) utterance.voice = zhVoice;

      utterance.onend = resolve;
      utterance.onerror = resolve;
      window.speechSynthesis.speak(utterance);
    });
  }

  // Typewriter effect: show text char by char, call onDone when finished (and speech ends)
  function typewriterBubble(text, onDone) {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    const bubble = document.createElement('div');
    bubble.className = 'bubble bot';
    row.appendChild(bubble);
    chatArea.appendChild(row);

    // Disable input area while speaking
    const inputArea = document.querySelector('.input-area');
    inputArea.style.opacity = '0.4';
    inputArea.style.pointerEvents = 'none';

    let idx = 0;
    const chars = text.split('');
    const speed = 80; // ms per char
    let timer = null;
    let doneCalled = false;

    function callOnDone() {
      if (doneCalled) return;
      doneCalled = true;
      inputArea.style.opacity = '1';
      inputArea.style.pointerEvents = 'auto';
      if (onDone) onDone();
    }

    // Speak only ONCE
    const speechPromise = speak(text);

    // When speech finishes, ensure all text is shown and trigger onDone
    speechPromise.then(() => {
      if (idx < chars.length) {
        clearTimeout(timer);
        bubble.textContent = text;
        idx = chars.length;
        scrollToBottom();
      }
      callOnDone();
    });

    function typeNext() {
      if (idx < chars.length) {
        bubble.textContent += chars[idx];
        idx++;
        scrollToBottom();
        timer = setTimeout(typeNext, speed);
      } else {
        // Typing complete, wait for speech to finish
        speechPromise.then(callOnDone);
      }
    }

    // Start typing animation
    timer = setTimeout(typeNext, speed);

    scrollToBottom();
  }

  // Preload voices
  if (window.speechSynthesis) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  }

  // ====== State Machine ======
  const STATE = {
    IDLE: 'idle',
    WEATHER_CONFIRM_LOC: 'weather_confirm_loc',
    WEATHER_ASK_OUT: 'weather_ask_out',
    DIRECT_REMIND: 'direct_remind',
    ASK_DESTINATION: 'ask_destination',
    ASK_TIME: 'ask_time',
    DONE: 'done'
  };

  let currentState = STATE.IDLE;
  let context = {
    weather: null,
    destination: null,
    outTime: null
  };

  const chatArea = document.getElementById('chatArea');
  const textInput = document.getElementById('textInput');
  const sendBtn = document.getElementById('sendBtn');

  textInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') handleSend();
  });

  // ====== Mock Data ======
  const MOCK_WEATHER = {
    condition: '小雨',
    tempLow: 18,
    tempHigh: 22,
    tip: '建议您出门带伞，穿一件薄外套。'
  };

  const MOCK_HOSPITALS = [
    { name: '幸福社区卫生服务中心', distance: '1.2公里', duration: 18 },
    { name: '阳光社区卫生服务站', distance: '1.8公里', duration: 25 },
    { name: '人民路社区卫生服务中心', distance: '2.3公里', duration: 32 }
  ];

  // ====== Core Functions ======

  function scrollToBottom() {
    setTimeout(() => {
      chatArea.scrollTop = chatArea.scrollHeight;
    }, 50);
  }

  function addBubble(text, isUser) {
    const row = document.createElement('div');
    row.className = 'msg-row ' + (isUser ? 'user' : 'bot');
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + (isUser ? 'user' : 'bot');
    bubble.textContent = text;
    row.appendChild(bubble);
    chatArea.appendChild(row);
    scrollToBottom();
  }

  function addOptionButtons(options) {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    const group = document.createElement('div');
    group.className = 'option-group';
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn ' + (opt.primary ? 'primary' : (opt.info ? 'info' : ''));
      if (opt.info) {
        btn.innerHTML = opt.label + '<small>' + opt.sub + '</small>';
      } else {
        btn.textContent = opt.label;
      }
      btn.onclick = () => opt.onClick();
      group.appendChild(btn);
    });
    row.appendChild(group);
    chatArea.appendChild(row);
    scrollToBottom();
  }

  // Helper: typewriter text, then show buttons after speech ends
  function typewriterThenButtons(text, options) {
    typewriterBubble(text, () => {
      addOptionButtons(options);
    });
  }

  // Helper: typewriter text, then run a custom callback after speech ends
  function typewriterThen(text, cb) {
    typewriterBubble(text, () => {
      if (cb) cb();
    });
  }

  function addWeatherCard(weather) {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    const card = document.createElement('div');
    card.className = 'weather-card';
    card.innerHTML = `
      <div class="temp">${weather.condition} ${weather.tempLow}~${weather.tempHigh}°C</div>
      <div class="desc">下午天气情况</div>
      <div class="tip">${weather.tip}</div>
    `;
    row.appendChild(card);
    chatArea.appendChild(row);
    scrollToBottom();
  }

  function addReminderCard(title, detail) {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    const card = document.createElement('div');
    card.className = 'reminder-card';
    card.innerHTML = `
      <div class="title">${title}</div>
      <div class="detail">${detail}</div>
    `;
    row.appendChild(card);
    chatArea.appendChild(row);
    scrollToBottom();
  }

  function showTyping(cb, delay = 800) {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.id = 'typingRow';
    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.innerHTML = '<span></span><span></span><span></span>';
    row.appendChild(typing);
    chatArea.appendChild(row);
    scrollToBottom();
    setTimeout(() => {
      const el = document.getElementById('typingRow');
      if (el) el.remove();
      if (cb) cb();
    }, delay);
  }

  function handleSend() {
    const text = textInput.value.trim();
    if (!text) return;
    addBubble(text, true);
    textInput.value = '';
    processUserInput(text);
  }

  // ====== Welcome ======
  function welcome() {
    showTyping(() => {
      typewriterThenButtons(
        '欢迎使用"衔接未来"。我可以帮您查天气、设提醒。请问您现在需要什么帮助？',
        [
          { label: '查天气', primary: true, onClick: () => startWeather() },
          { label: '定提醒', primary: true, onClick: () => startDirectReminder() }
        ]
      );
    }, 600);
  }

  // ====== Weather Flow ======
  function startWeather() {
    addBubble('查天气', true);
    currentState = STATE.WEATHER_CONFIRM_LOC;
    showTyping(() => {
      typewriterThenButtons(
        '我理解您想查询天气。请问是查您现在所在位置吗？',
        [
          { label: '是的', primary: true, onClick: () => confirmLocation(true) },
          { label: '查其他城市', onClick: () => typewriterBubble('您可以输入城市名称，比如"北京"。') }
        ]
      );
    });
  }

  function confirmLocation(isCurrent) {
    addBubble('是的', true);
    context.weather = MOCK_WEATHER;
    currentState = STATE.WEATHER_ASK_OUT;
    showTyping(() => {
      addWeatherCard(context.weather);
      typewriterThenButtons(
        '您下午需要出门吗？如果要出门，我可以帮您设置提醒。请问您要去哪里？',
        [
          { label: '不用了', onClick: () => endConversation() }
        ]
      );
    }, 1000);
  }

  // ====== Direct Reminder Entry ======
  function startDirectReminder() {
    addBubble('定提醒', true);
    currentState = STATE.DIRECT_REMIND;
    showTyping(() => {
      typewriterThenButtons(
        '好的，我来帮您设置出门提醒。请问您要去哪里？',
        [
          { label: '取消', onClick: () => endConversation() }
        ]
      );
    });
  }

  // ====== Reminder Flow ======
  function askDestination(dest) {
    context.destination = dest;
    currentState = STATE.ASK_TIME;
    showTyping(() => {
      typewriterThen(
        `好的，您要去${dest}。请问您大概几点出门？`,
        () => {
          const hintRow = document.createElement('div');
          hintRow.className = 'msg-row bot';
          const hint = document.createElement('div');
          hint.style.fontSize = '0.82rem';
          hint.style.color = '#5A6B7F';
          hint.style.padding = '4px 14px';
          hint.style.marginTop = '2px';
          hint.textContent = '例如：下午2点、14:30、两点半';
          hintRow.appendChild(hint);
          chatArea.appendChild(hintRow);
          scrollToBottom();
        }
      );
    });
  }

  function askTime(timeStr) {
    context.outTime = timeStr;
    currentState = STATE.DONE;

    // Build reminder tip based on weather
    let tip = '';
    if (context.weather && context.weather.condition.includes('雨')) {
      tip = '下午有小雨，记得带伞哦。';
    } else if (context.weather && context.weather.tempLow < 10) {
      tip = '天气较冷，记得多穿点。';
    } else {
      tip = '祝您出门顺利！';
    }

    showTyping(() => {
      addReminderCard(
        '提醒已设置',
        `${timeStr} 提醒您准备出门\n目的地：${context.destination}\n温馨提示：${tip}`
      );
      typewriterThenButtons(
        '到时候我会准时提醒您。',
        [
          { label: '再查天气', onClick: () => startWeather() },
          { label: '完成', onClick: () => endConversation() }
        ]
      );
    }, 1000);
  }

  // ====== Text Input Handler ======
  function processUserInput(text) {
    const t = text.toLowerCase();

    // Simple keyword matching for demo
    if (currentState === STATE.IDLE) {
      if (t.includes('天气') || t.includes('下雨') || t.includes('晴')) {
        startWeather();
      } else if (t.includes('提醒') || t.includes('闹钟')) {
        startDirectReminder();
      } else {
        showTyping(() => {
          typewriterBubble('抱歉，我没听懂。您可以说"查天气"或"定提醒"。');
        });
      }
      return;
    }

    if (currentState === STATE.WEATHER_CONFIRM_LOC) {
      if (t.includes('是') || t.includes('对') || t.includes('当前')) {
        confirmLocation(true);
      } else {
        addBubble('您可以点击"是的"按钮，或输入城市名称。', false);
      }
      return;
    }

    if (currentState === STATE.WEATHER_ASK_OUT) {
      if (t.includes('不') || t.includes('不用') || t.includes('没')) {
        endConversation();
      } else if (text.trim().length > 0) {
        // User told us where they want to go
        askDestination(text.trim());
      } else {
        addBubble('请问您要去哪里？比如"去医院"、"去超市"等。', false);
      }
      return;
    }

    if (currentState === STATE.DIRECT_REMIND) {
      if (text.trim().length > 0) {
        askDestination(text.trim());
      } else {
        addBubble('请问您要去哪里？比如"去医院"、"去超市"等。', false);
      }
      return;
    }

    if (currentState === STATE.ASK_TIME) {
      if (text.trim().length > 0) {
        askTime(text.trim());
      } else {
        addBubble('请问您大概几点出门？例如：下午2点。', false);
      }
      return;
    }

    // Fallback
    showTyping(() => {
      typewriterBubble('您可以点击按钮选择，或重新描述您的需求。');
    });
  }

  function endConversation() {
    addBubble('完成', true);
    showTyping(() => {
      typewriterBubble('好的，祝您一切顺利！如果还有其他需要，随时叫我。', () => {
        currentState = STATE.IDLE;
      });
    });
  }

  // ====== Init ======
  window.onload = () => {
    welcome();
  };
</script>

</body>
</html>
