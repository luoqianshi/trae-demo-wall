<!-- Generated by Trae Work -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>开始转轮 | ROLL</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .spinning .reel-strip {
      transition: transform 0.1s linear;
    }
    .reel-strip.spin {
      animation: reelSpin 0.3s linear infinite;
    }
    @keyframes reelSpin {
      0% { transform: translateY(0); }
      100% { transform: translateY(-140px); }
    }
    .reel-item.selected {
      background: linear-gradient(180deg, #FFD700 0%, #F5A623 100%) !important;
      color: var(--slot-bg);
    }
    .reel-item.selected .emoji {
      transform: scale(1.15);
    }
    .roll-hint {
      text-align: center;
      color: rgba(255,255,255,0.7);
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    .lucky-meter {
      background: var(--slot-panel);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1.25rem;
    }
    .lucky-meter label {
      display: block;
      color: rgba(255,255,255,0.8);
      font-size: 0.8rem;
      margin-bottom: 0.4rem;
    }
    .lucky-bar {
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      overflow: hidden;
    }
    .lucky-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--carb), var(--vitamin), var(--protein));
      border-radius: 4px;
      transition: width 1s ease;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand"><span class="dot"></span> ROLL</div>
      <div class="step">3 / 4</div>
    </header>

    <div class="progress-bar">
      <div class="dot active"></div>
      <div class="dot active"></div>
      <div class="dot active"></div>
      <div class="dot"></div>
    </div>

    <main>
      <h1 style="text-align:center;">食运转轮</h1>
      <p style="text-align:center;">拉一下，让 AI 根据你的目标和体检报告，为你生成今日营养组合。</p>

      <div class="slot-machine">
        <div class="slot-header">ROLL</div>

        <div class="slot-labels">
          <div class="slot-label" style="color: var(--carb);">碳水主食</div>
          <div class="slot-label" style="color: var(--vitamin);">维生素纤维</div>
          <div class="slot-label" style="color: var(--protein);">优质蛋白</div>
        </div>

        <div class="reels" id="reels">
          <div class="reel carb" data-type="carb">
            <div class="reel-strip" id="strip-carb"></div>
          </div>
          <div class="reel vitamin" data-type="vitamin">
            <div class="reel-strip" id="strip-vitamin"></div>
          </div>
          <div class="reel protein" data-type="protein">
            <div class="reel-strip" id="strip-protein"></div>
          </div>
        </div>

        <div class="lucky-meter">
          <label>营养匹配度</label>
          <div class="lucky-bar">
            <div class="lucky-fill" id="luckyFill"></div>
          </div>
        </div>

        <div class="distance-selector" id="distanceSelector">
          <button class="distance-option active" data-distance="2">2km 内</button>
          <button class="distance-option" data-distance="4">4km 内</button>
          <button class="distance-option" data-distance="6">6km 内</button>
        </div>

        <p class="roll-hint">距离越远，可选外卖菜系越丰富</p>
      </div>
    </main>

    <div class="nav-buttons">
      <a href="goal.html" class="btn btn-secondary">上一步</a>
      <button class="btn btn-accent" id="spinBtn">开始拉霸</button>
      <a href="result.html" class="btn btn-primary" id="nextBtn" style="display:none;">查看结果</a>
    </div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    (function() {
      var data = RollApp.getData();
      var reels = RollData.reels;
      var spinBtn = document.getElementById('spinBtn');
      var nextBtn = document.getElementById('nextBtn');
      var luckyFill = document.getElementById('luckyFill');
      var distanceOptions = document.querySelectorAll('.distance-option');
      var isSpinning = false;

      // Init distance
      distanceOptions.forEach(function(btn) {
        if (btn.getAttribute('data-distance') === String(data.distance)) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
        btn.addEventListener('click', function() {
          distanceOptions.forEach(function(b) { b.classList.remove('active'); });
          btn.classList.add('active');
          data.distance = btn.getAttribute('data-distance');
          RollApp.saveData(data);
        });
      });

      // Init strips with duplicate items for looping visual
      function renderStrip(type) {
        var container = document.getElementById('strip-' + type);
        var items = reels[type];
        var html = '';
        // Triple the items for smooth loop
        for (var round = 0; round < 3; round++) {
          items.forEach(function(item, idx) {
            html += '<div class="reel-item" data-idx="' + idx + '">' +
              '<div class="emoji">' + item.emoji + '</div>' +
              '<div class="name">' + item.name + '</div>' +
              '</div>';
          });
        }
        container.innerHTML = html;
        // Start at middle set
        container.style.transform = 'translateY(-' + (items.length * 140) + 'px)';
      }

      ['carb', 'vitamin', 'protein'].forEach(renderStrip);

      function animateReel(type, finalIdx, duration, callback) {
        var strip = document.getElementById('strip-' + type);
        var items = reels[type];
        var itemHeight = 140;
        var setLength = items.length * itemHeight;
        var startOffset = -setLength; // middle set
        var endOffset = -setLength - (finalIdx * itemHeight);
        var startTime = null;

        // Add spin animation temporarily
        strip.classList.add('spin');

        function easeOutCubic(t) {
          return 1 - Math.pow(1 - t, 3);
        }

        function step(timestamp) {
          if (!startTime) startTime = timestamp;
          var elapsed = timestamp - startTime;
          var progress = Math.min(elapsed / duration, 1);
          var eased = easeOutCubic(progress);

          // Extra rotations: spin 2 full sets then settle
          var rotations = 2 * setLength;
          var currentOffset = startOffset - (rotations * eased) + ((endOffset - startOffset + rotations) * eased);

          strip.style.transform = 'translateY(' + currentOffset + 'px)';

          if (progress < 1) {
            requestAnimationFrame(step);
          } else {
            strip.classList.remove('spin');
            strip.style.transform = 'translateY(' + endOffset + 'px)';

            // Highlight selected item
            var selectedEl = strip.querySelector('.reel-item[data-idx="' + finalIdx + '"]');
            if (selectedEl) selectedEl.classList.add('selected');

            if (callback) callback();
          }
        }

        setTimeout(function() {
          requestAnimationFrame(step);
        }, 100);
      }

      function calculateMatch(result) {
        var score = 60;
        result.forEach(function(item) {
          if (data.goal === 'lose') {
            if (item.tags.indexOf('lowgi') !== -1) score += 8;
            if (item.tags.indexOf('fiber') !== -1) score += 5;
            if (item.tags.indexOf('highprotein') !== -1) score += 5;
          } else if (data.goal === 'gain') {
            if (item.tags.indexOf('highprotein') !== -1) score += 10;
            if (item.tags.indexOf('lowgi') !== -1) score += 3;
          } else {
            if (item.tags.indexOf('fiber') !== -1) score += 5;
            if (item.tags.indexOf('lowgi') !== -1) score += 3;
          }
          if (data.report === 'sugar' && item.tags.indexOf('lowgi') !== -1) score += 5;
          if (data.report === 'uric' && item.tags.indexOf('lowpurine') !== -1) score += 8;
          if (data.report === 'fat' && item.tags.indexOf('omega3') !== -1) score += 5;
        });
        return Math.min(score, 99);
      }

      spinBtn.addEventListener('click', function() {
        if (isSpinning) return;
        isSpinning = true;
        spinBtn.disabled = true;
        spinBtn.textContent = '转轮中...';
        nextBtn.style.display = 'none';
        luckyFill.style.width = '0%';

        // Clear previous selections
        document.querySelectorAll('.reel-item.selected').forEach(function(el) {
          el.classList.remove('selected');
        });

        var result = [
          reels.carb[RollData.weightedIndex(reels.carb, data)],
          reels.vitamin[RollData.weightedIndex(reels.vitamin, data)],
          reels.protein[RollData.weightedIndex(reels.protein, data)]
        ];

        // Find indices in original arrays
        var indices = [
          reels.carb.indexOf(result[0]),
          reels.vitamin.indexOf(result[1]),
          reels.protein.indexOf(result[2])
        ];

        data.rollResult = {
          carb: result[0],
          vitamin: result[1],
          protein: result[2],
          match: calculateMatch(result)
        };
        RollApp.saveData(data);

        var completed = 0;
        function onComplete() {
          completed++;
          if (completed === 3) {
            isSpinning = false;
            spinBtn.disabled = false;
            spinBtn.textContent = '再转一次';
            nextBtn.style.display = 'block';
            luckyFill.style.width = data.rollResult.match + '%';
          }
        }

        animateReel('carb', indices[0], 1800, onComplete);
        animateReel('vitamin', indices[1], 2400, onComplete);
        animateReel('protein', indices[2], 3000, onComplete);
      });

      nextBtn.addEventListener('click', function() {
        if (!data.rollResult) {
          alert('请先转轮生成今日组合');
          return false;
        }
      });
    })();
  </script>
</body>
</html>
