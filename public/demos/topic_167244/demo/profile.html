<!-- Generated by Trae Work -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>输入身体数据 | ROLL</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand"><span class="dot"></span> ROLL</div>
      <div class="step">1 / 4</div>
    </header>

    <div class="progress-bar">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <main>
      <h1>建立你的身体模型</h1>
      <p>输入基础数据，AI 会计算你的 BMI、基础代谢和每日热量需求。</p>

      <div class="card">
        <div class="form-group">
          <label for="height">身高（cm）</label>
          <input type="number" id="height" value="170" min="100" max="250">
        </div>
        <div class="form-group">
          <label for="weight">体重（kg）</label>
          <input type="number" id="weight" value="65" min="30" max="200">
        </div>
        <div class="form-group">
          <label for="age">年龄</label>
          <input type="number" id="age" value="25" min="10" max="100">
        </div>
        <div class="form-group">
          <label for="gender">性别</label>
          <select id="gender">
            <option value="male">男</option>
            <option value="female">女</option>
          </select>
        </div>
        <div class="form-group">
          <label for="activity">日常活动量</label>
          <select id="activity">
            <option value="1.2">久坐少动</option>
            <option value="1.375" selected>轻度活动</option>
            <option value="1.55">中度活动</option>
            <option value="1.725">高度活动</option>
          </select>
        </div>
        <div class="form-group">
          <label for="report">体检报告（模拟）</label>
          <select id="report">
            <option value="normal">指标正常</option>
            <option value="sugar">血糖偏高</option>
            <option value="uric">尿酸偏高</option>
            <option value="fat">血脂偏高</option>
          </select>
        </div>
      </div>
    </main>

    <div class="nav-buttons">
      <a href="index.html" class="btn btn-secondary">返回</a>
      <a href="goal.html" class="btn btn-primary" id="nextBtn">下一步</a>
    </div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    (function() {
      var data = RollApp.getData();
      document.getElementById('height').value = data.height;
      document.getElementById('weight').value = data.weight;
      document.getElementById('age').value = data.age;
      document.getElementById('gender').value = data.gender;
      document.getElementById('activity').value = data.activity;
      document.getElementById('report').value = data.report;

      function save() {
        RollApp.update('height', document.getElementById('height').value);
        RollApp.update('weight', document.getElementById('weight').value);
        RollApp.update('age', document.getElementById('age').value);
        RollApp.update('gender', document.getElementById('gender').value);
        RollApp.update('activity', document.getElementById('activity').value);
        RollApp.update('report', document.getElementById('report').value);
      }

      ['height','weight','age','gender','activity','report'].forEach(function(id) {
        document.getElementById(id).addEventListener('change', save);
        document.getElementById(id).addEventListener('input', save);
      });

      document.getElementById('nextBtn').addEventListener('click', save);
    })();
  </script>
</body>
</html>
