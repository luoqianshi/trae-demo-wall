<!-- Generated by Trae Work -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>选择目标 | ROLL</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand"><span class="dot"></span> ROLL</div>
      <div class="step">2 / 4</div>
    </header>

    <div class="progress-bar">
      <div class="dot active"></div>
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <main>
      <h1>你的饮食目标</h1>
      <p>选择目标后，AI 会为你计算每日热量缺口或盈余，并调整营养比例。</p>

      <div class="card">
        <div class="option-list">
          <div class="option active" data-goal="lose">
            <div class="icon">🔥</div>
            <div class="info">
              <div class="name">减脂</div>
              <div class="desc">每日制造约 500 kcal 热量缺口，降低体脂</div>
            </div>
          </div>
          <div class="option" data-goal="gain">
            <div class="icon">💪</div>
            <div class="info">
              <div class="name">增肌</div>
              <div class="desc">每日盈余约 300 kcal，提高蛋白质比例</div>
            </div>
          </div>
          <div class="option" data-goal="maintain">
            <div class="icon">⚖️</div>
            <div class="info">
              <div class="name">维持</div>
              <div class="desc">热量与消耗持平，保持营养均衡</div>
            </div>
          </div>
        </div>
      </div>

      <div class="card" id="metricsCard" style="display:none;">
        <h2>你的营养模型</h2>
        <div class="metrics">
          <div class="metric">
            <div class="value" id="bmi">--</div>
            <div class="label">BMI</div>
          </div>
          <div class="metric">
            <div class="value" id="bmr">--</div>
            <div class="label">基础代谢</div>
          </div>
          <div class="metric">
            <div class="value" id="tdee">--</div>
            <div class="label">每日总消耗</div>
          </div>
          <div class="metric">
            <div class="value" id="target">--</div>
            <div class="label">目标摄入</div>
          </div>
        </div>
        <p id="macroText" style="margin-bottom:0;"></p>
      </div>
    </main>

    <div class="nav-buttons">
      <a href="profile.html" class="btn btn-secondary">上一步</a>
      <a href="roll.html" class="btn btn-primary" id="nextBtn">下一步</a>
    </div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    (function() {
      var data = RollApp.getData();
      var options = document.querySelectorAll('.option');
      var metricsCard = document.getElementById('metricsCard');

      function updateMetrics() {
        var m = RollApp.calculateMetrics(data);
        document.getElementById('bmi').textContent = m.bmi;
        document.getElementById('bmr').textContent = m.bmr;
        document.getElementById('tdee').textContent = m.tdee;
        document.getElementById('target').textContent = m.target;

        var goalText = {
          lose: '减脂期',
          gain: '增肌期',
          maintain: '维持期'
        }[data.goal];
        document.getElementById('macroText').innerHTML =
          goalText + '建议每日摄入：<strong>' + m.carbG + 'g 碳水</strong>、<strong>' + m.proteinG + 'g 蛋白质</strong>、<strong>' + m.fatG + 'g 脂肪</strong>。';
        metricsCard.style.display = 'block';
      }

      options.forEach(function(opt) {
        if (opt.getAttribute('data-goal') === data.goal) {
          opt.classList.add('active');
        } else {
          opt.classList.remove('active');
        }
        opt.addEventListener('click', function() {
          options.forEach(function(o) { o.classList.remove('active'); });
          opt.classList.add('active');
          data.goal = opt.getAttribute('data-goal');
          RollApp.saveData(data);
          updateMetrics();
        });
      });

      updateMetrics();

      document.getElementById('nextBtn').addEventListener('click', function() {
        RollApp.saveData(data);
      });
    })();
  </script>
</body>
</html>
