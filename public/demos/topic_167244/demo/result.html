<!-- Generated by Trae Work -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日结果 | ROLL</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .plate-section {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .plate {
      width: 180px;
      height: 180px;
      margin: 0 auto 1.25rem;
      background: radial-gradient(circle, #fff 45%, var(--bg2) 46%, var(--bg2) 60%, #fff 61%);
      border-radius: 50%;
      box-shadow: 0 16px 40px rgba(44,36,25,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4.5rem;
      position: relative;
    }
    .plate::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 2px dashed var(--rule);
      border-radius: 50%;
    }
    .combo-name {
      font-family: var(--font);
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .combo-desc {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .food-tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1rem;
    }
    .food-tag {
      padding: 0.35rem 0.8rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .food-tag.carb { background: #DBEAFE; color: #1D4ED8; }
    .food-tag.vitamin { background: #DCFCE7; color: #15803D; }
    .food-tag.protein { background: #FEE2E2; color: #B91C1C; }

    .match-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--slot-bg);
      color: #fff;
      padding: 0.5rem 1rem;
      border-radius: 999px;
      font-family: var(--font);
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 1.25rem;
    }
    .match-badge .score {
      color: var(--accent3);
      font-size: 1.1rem;
    }

    .cuisine-card {
      background: #fff;
      border: 1px solid var(--rule);
      border-radius: 14px;
      padding: 1.25rem;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .cuisine-card .icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--bg2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }
    .cuisine-card .info { flex: 1; }
    .cuisine-card .name {
      font-family: var(--font);
      font-weight: 700;
      margin-bottom: 0.2rem;
    }
    .cuisine-card .meta {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .cuisine-card .distance {
      font-family: var(--font);
      font-weight: 700;
      color: var(--accent);
      font-size: 0.9rem;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
    }
    .empty-state .emoji {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand"><span class="dot"></span> ROLL</div>
      <div class="step">4 / 4</div>
    </header>

    <div class="progress-bar">
      <div class="dot active"></div>
      <div class="dot active"></div>
      <div class="dot active"></div>
      <div class="dot active"></div>
    </div>

    <main id="mainContent">
      <div class="empty-state" id="emptyState">
        <div class="emoji">🎰</div>
        <h2>还没有转轮结果</h2>
        <p>先去转轮页面生成你的今日营养组合吧。</p>
        <a href="roll.html" class="btn btn-primary" style="margin-top:1rem;">去转轮</a>
      </div>

      <div id="resultContent" style="display:none;">
        <h1 style="text-align:center;">今日推荐</h1>
        <p style="text-align:center;">AI 为你匹配的营养组合与附近可外卖菜系。</p>

        <div class="plate-section">
          <div class="match-badge">
            <span>营养匹配度</span>
            <span class="score" id="matchScore">--%</span>
          </div>
          <div class="plate" id="plateEmoji">🍽️</div>
          <div class="combo-name" id="comboName">--</div>
          <div class="combo-desc" id="comboDesc">--</div>
          <div class="food-tags" id="foodTags"></div>
        </div>

        <div class="card">
          <h2>营养分析</h2>
          <div class="metrics">
            <div class="metric">
              <div class="value" id="targetCal">--</div>
              <div class="label">目标热量 kcal</div>
            </div>
            <div class="metric">
              <div class="value" id="carbG">--</div>
              <div class="label">碳水 g</div>
            </div>
            <div class="metric">
              <div class="value" id="proteinG">--</div>
              <div class="label">蛋白质 g</div>
            </div>
            <div class="metric">
              <div class="value" id="fatG">--</div>
              <div class="label">脂肪 g</div>
            </div>
          </div>
          <p id="reportNote" style="margin-bottom:0;"></p>
        </div>

        <div class="card">
          <h2>附近推荐菜系</h2>
          <p style="margin-bottom:1rem;">根据你选择的 <strong id="distanceText">2km</strong> 范围推荐</p>
          <div id="cuisineList"></div>
        </div>
      </div>
    </main>

    <div class="nav-buttons" id="navButtons" style="display:none;">
      <a href="roll.html" class="btn btn-secondary">再转一次</a>
      <a href="index.html" class="btn btn-primary">完成</a>
    </div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    (function() {
      var data = RollApp.getData();
      var emptyState = document.getElementById('emptyState');
      var resultContent = document.getElementById('resultContent');
      var navButtons = document.getElementById('navButtons');

      if (!data.rollResult) {
        emptyState.style.display = 'block';
        resultContent.style.display = 'none';
        navButtons.style.display = 'none';
        return;
      }

      emptyState.style.display = 'none';
      resultContent.style.display = 'block';
      navButtons.style.display = 'flex';

      var r = data.rollResult;
      var metrics = RollApp.calculateMetrics(data);

      // Plate & combo
      document.getElementById('plateEmoji').textContent = r.carb.emoji + r.vitamin.emoji + r.protein.emoji;
      document.getElementById('comboName').textContent = r.carb.name + ' + ' + r.vitamin.name + ' + ' + r.protein.name;
      document.getElementById('comboDesc').textContent = r.carb.desc + ' · ' + r.vitamin.desc + ' · ' + r.protein.desc;
      document.getElementById('matchScore').textContent = r.match + '%';

      // Tags
      var tagsHtml = '';
      [
        { item: r.carb, type: 'carb', label: '碳水' },
        { item: r.vitamin, type: 'vitamin', label: '维生素' },
        { item: r.protein, type: 'protein', label: '蛋白质' }
      ].forEach(function(t) {
        tagsHtml += '<span class="food-tag ' + t.type + '">' + t.item.emoji + ' ' + t.label + '</span>';
      });
      document.getElementById('foodTags').innerHTML = tagsHtml;

      // Metrics
      document.getElementById('targetCal').textContent = metrics.target;
      document.getElementById('carbG').textContent = metrics.carbG;
      document.getElementById('proteinG').textContent = metrics.proteinG;
      document.getElementById('fatG').textContent = metrics.fatG;

      var reportMap = {
        sugar: '根据血糖情况，已优先推荐低 GI 碳水，帮助稳定餐后血糖。',
        uric: '根据尿酸情况，已优先推荐低嘌呤蛋白质，减少嘌呤摄入。',
        fat: '根据血脂情况，已优先推荐优质脂肪来源，优化脂类代谢。',
        normal: '体检指标正常，AI 按均衡营养模型为你推荐。'
      };
      document.getElementById('reportNote').textContent = reportMap[data.report] || reportMap.normal;

      // Cuisines
      var distance = data.distance || '2';
      document.getElementById('distanceText').textContent = distance + 'km';
      var cuisines = RollData.cuisines[distance] || RollData.cuisines['2'];
      var cuisineIcons = {
        '轻食沙拉': '🥗',
        '日式便当': '🍱',
        '中式小碗菜': '🍲',
        '潮汕牛肉饭': '🥩',
        '烤鱼': '🐟',
        '粤式蒸菜': '🥟',
        '减脂餐专线': '🔥'
      };
      var cuisineDescs = {
        '轻食沙拉': '低卡高纤，控体首选',
        '日式便当': '均衡搭配，份量可控',
        '中式小碗菜': '多样选择，少油少盐',
        '潮汕牛肉饭': '高蛋白低脂牛肉',
        '烤鱼': '优质蛋白，少油烹饪',
        '粤式蒸菜': '清淡蒸制，保留营养',
        '减脂餐专线': '专为减脂人群定制'
      };

      var listHtml = '';
      cuisines.forEach(function(name, idx) {
        listHtml += '<div class="cuisine-card">' +
          '<div class="icon">' + (cuisineIcons[name] || '🍽️') + '</div>' +
          '<div class="info">' +
          '<div class="name">' + name + '</div>' +
          '<div class="meta">' + (cuisineDescs[name] || '适合当前营养目标') + '</div>' +
          '</div>' +
          '<div class="distance">' + (0.8 + idx * 0.4).toFixed(1) + 'km</div>' +
          '</div>';
      });
      document.getElementById('cuisineList').innerHTML = listHtml;
    })();
  </script>
</body>
</html>
