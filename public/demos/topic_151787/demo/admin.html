<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>暖伴儿女 - 平台管理后台</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <div>
                <h1>暖伴儿女 - 平台管理后台</h1>
                <p style="margin-top: 5px; opacity: 0.9;">老年陪伴服务平台运营管理系统</p>
            </div>
            <div class="nav-links">
                <a href="#" class="active" onclick="showAdminPage('dashboard')">📊 数据概览</a>
                <a href="#" onclick="showAdminPage('tasks')">📋 任务管理</a>
                <a href="#" onclick="showAdminPage('users')">👥 用户管理</a>
                <a href="index.html" target="_blank">👤 用户端</a>
            </div>
        </div>

        <div id="dashboard-page" class="admin-page active">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="stat-total">156</div>
                    <div class="stat-label">平台总任务数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-pending">23</div>
                    <div class="stat-label">待处理任务</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-completed">108</div>
                    <div class="stat-label">已完成服务</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-active">89</div>
                    <div class="stat-label">活跃用户数</div>
                </div>
            </div>

            <div class="table-container">
                <h3 style="padding: 20px 20px 0; font-size: 18px;">最近任务动态</h3>
                <table>
                    <thead>
                        <tr>
                            <th>任务ID</th>
                            <th>服务类型</th>
                            <th>发布者</th>
                            <th>服务者</th>
                            <th>状态</th>
                            <th>创建时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="recent-tasks-table">
                    </tbody>
                </table>
            </div>
        </div>

        <div id="tasks-page" class="admin-page">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="font-size: 20px;">任务管理</h2>
                <div class="filter-bar" style="justify-content: flex-end;">
                    <span class="filter-tag active" onclick="filterAdminTasks('all', event)">全部</span>
                    <span class="filter-tag" onclick="filterAdminTasks('pending', event)">待接单</span>
                    <span class="filter-tag" onclick="filterAdminTasks('accepted', event)">已接单</span>
                    <span class="filter-tag" onclick="filterAdminTasks('in_progress', event)">服务中</span>
                    <span class="filter-tag" onclick="filterAdminTasks('pending_confirm', event)">待确认</span>
                    <span class="filter-tag" onclick="filterAdminTasks('completed', event)">已完成</span>
                    <span class="filter-tag" onclick="filterAdminTasks('cancelled', event)">已关闭</span>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>任务ID</th>
                            <th>服务类型</th>
                            <th>服务日期</th>
                            <th>服务地点</th>
                            <th>酬劳</th>
                            <th>发布者</th>
                            <th>服务者</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="admin-tasks-table">
                    </tbody>
                </table>
            </div>
        </div>

        <div id="users-page" class="admin-page">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="font-size: 20px;">用户管理</h2>
                <div class="filter-bar" style="justify-content: flex-end;">
                    <span class="filter-tag active" onclick="filterAdminUsers('all', event)">全部</span>
                    <span class="filter-tag" onclick="filterAdminUsers('publisher', event)">发布者</span>
                    <span class="filter-tag" onclick="filterAdminUsers('taker', event)">承接者</span>
                </div>
            </div>

            <div class="stats-grid" style="grid-template-columns: repeat(2, 1fr);">
                <div class="stat-card">
                    <div class="stat-value" id="stat-publishers">45</div>
                    <div class="stat-label">任务发布者</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-takers">44</div>
                    <div class="stat-label">服务承接者</div>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>用户ID</th>
                            <th>头像</th>
                            <th>昵称</th>
                            <th>角色</th>
                            <th>手机号</th>
                            <th>地址</th>
                            <th>状态</th>
                            <th>简介</th>
                        </tr>
                    </thead>
                    <tbody id="admin-users-table">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
