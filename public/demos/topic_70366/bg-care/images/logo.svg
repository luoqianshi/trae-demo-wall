<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B8E6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A6B4A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8F0E8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGrad)" />

  <!-- Outer ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3" />

  <!-- Heart shape (center) -->
  <g transform="translate(100, 78) scale(1.1)">
    <path d="M0,16 C-30,-10 -50,10 -50,30 C-50,55 -25,68 0,75 C25,68 50,55 50,30 C50,10 30,-10 0,16Z"
          fill="url(#heartGrad)" />

    <!-- Heartbeat line inside heart -->
    <polyline points="-24,22 -6,22 0,-4 6,22 24,22"
              fill="none" stroke="#6B8E6B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- BP monitor screen below heart -->
  <g transform="translate(100, 148)">
    <rect x="-36" y="-18" width="72" height="32" rx="5"
          fill="rgba(255,255,255,0.92)" />
    <text x="0" y="2" text-anchor="middle" font-family="'PingFang SC','Noto Serif SC',serif"
          font-size="14" font-weight="700" fill="#6B8E6B">128/82</text>
    <text x="0" y="13" text-anchor="middle" font-family="'PingFang SC',sans-serif"
          font-size="7" fill="#8FAB8F" font-weight="500">mmHg</text>
  </g>
</svg>
