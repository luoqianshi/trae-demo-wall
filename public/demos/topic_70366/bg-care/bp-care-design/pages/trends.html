    <style id="theme-vars">
/* ============================================
   BP Care 血压管家 - Brand Design Tokens
   Warm, caring, elderly-friendly design system
   ============================================ */

:root {
  /* ---- Color System ---- */
  /* Primary: Warm coral-rose - conveys care and health */
  --color-primary: #E8634A;
  --color-primary-light: #F28B73;
  --color-primary-lighter: #FBD4CC;
  --color-primary-dark: #C94D35;

  /* Neutral palette: warm grays */
  --color-bg: #FFF8F5;
  --color-bg-secondary: #FFF1EC;
  --color-bg-tertiary: #FFE8E0;
  --color-surface: #FFFFFF;
  --color-surface-elevated: #FFFFFF;
  --color-border: #F0DDD5;
  --color-border-light: #F7EBE5;

  /* Text hierarchy - high contrast for elderly */
  --color-text-primary: #2D1810;
  --color-text-secondary: #6B4F42;
  --color-text-tertiary: #9E8B82;
  --color-text-inverse: #FFFFFF;

  /* State colors */
  --state-success: #2EAE6A;
  --state-success-bg: #E8F8EF;
  --state-warning: #E6A817;
  --state-warning-bg: #FFF8E1;
  --state-error: #E63F3F;
  --state-error-bg: #FFEBEB;
  --state-info: #4A90D9;
  --state-info-bg: #EBF3FC;

  /* Health-specific semantic colors */
  --health-normal: #2EAE6A;
  --health-elevated: #E6A817;
  --health-high: #E8634A;
  --health-critical: #E63F3F;

  /* ---- Typography System ---- */
  /* Extra large scale for elderly readability */
  --font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --font-family-display: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;

  /* Type scale - larger than standard for accessibility */
  --font-size-xs: 12px;
  --font-size-sm: 14px;
  --font-size-base: 16px;
  --font-size-md: 18px;
  --font-size-lg: 22px;
  --font-size-xl: 28px;
  --font-size-2xl: 34px;
  --font-size-3xl: 42px;

  /* Line height - relaxed for readability */
  --line-height-tight: 1.3;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.7;

  /* Font weights */
  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  /* ---- Spacing System ---- */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 16px;
  --spacing-lg: 24px;
  --spacing-xl: 32px;
  --spacing-2xl: 48px;

  /* ---- Radius System ---- */
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* ---- Shadow System ---- */
  /* Very subtle for static cards, deeper for floating elements */
  --shadow-sm: 0 1px 3px rgba(45, 24, 16, 0.04);
  --shadow-md: 0 2px 8px rgba(45, 24, 16, 0.06);
  --shadow-lg: 0 8px 24px rgba(45, 24, 16, 0.1);

  /* ---- Component-specific ---- */
  --tab-bar-height: 56px;
  --header-height: 56px;
  --card-padding: 20px;
  --input-height: 52px;
  --button-height: 52px;
  --button-height-lg: 60px;
}

/* Dark mode placeholder (not primary focus for elderly app) */
html.dark {
  --color-bg: #1A1210;
  --color-bg-secondary: #241C18;
  --color-bg-tertiary: #2E2420;
  --color-surface: #2E2420;
  --color-surface-elevated: #382E28;
  --color-border: #3E342E;
  --color-border-light: #342A24;
  --color-text-primary: #F5E6DF;
  --color-text-secondary: #C4A99C;
  --color-text-tertiary: #8E7B72;
  --color-text-inverse: #2D1810;
}

    </style>

    <style type="text/tailwindcss">

            <div style="text-align: right;">
              <div style="font-size: var(--font-size-base); font-weight: var(--font-weight-bold); color: var(--color-text-primary);">
                <span style="color: var(--color-primary);">128</span> / <span style="color: var(--state-info);">82</span> mmHg
              </div>
              <div style="font-size: var(--font-size-sm); color: var(--color-text-tertiary); margin-top: 2px;">心率 72 次/分</div>
            </div>
          </div>

          <!-- Day Record 4 -->
          <div style="background: var(--color-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); padding: 14px 16px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 12px;">
              <div style="width: 10px; height: 10px; border-radius: 50%; background: #2EAE6A; flex-shrink: 0;"></div>
              <div>
                <div style="font-size: var(--font-size-base); font-weight: var(--font-weight-medium); color: var(--color-text-primary);">7月1日 周三</div>
                <div style="font-size: var(--font-size-sm); color: var(--color-text-tertiary); margin-top: 2px;">09:00 测量</div>
              </div>
            </div>
            <div style="text-align: right;">
              <div style="font-size: var(--font-size-base); font-weight: var(--font-weight-bold); color: var(--color-text-primary);">
                <span style="color: var(--color-primary);">125</span> / <span style="color: var(--state-info);">80</span> mmHg
              </div>
              <div style="font-size: var(--font-size-sm); color: var(--color-text-tertiary); margin-top: 2px;">心率 68 次/分</div>
            </div>
          </div>

          <!-- View All Button -->
          <button style="width: 100%; padding: 12px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); font-size: var(--font-size-sm); font-weight: var(--font-weight-medium); color: var(--color-primary); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px;">
            查看全部
            <span style="display: inline-flex; align-items: center;" data-icon="chevron-right" data-width="16" data-height="16"></span>
          </button>
        </div>
      </div>

      <!-- Bottom Tab Bar -->
      <div style="position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 375px; height: var(--tab-bar-height); background: var(--color-surface); border-top: 1px solid var(--color-border-light); display: flex; align-items: center; justify-content: space-around; z-index: 100;">
        <!-- Tab: Home -->
        <div data-dom-id="tab-home" data-tab-key="home" style="display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; padding: 4px 16px;">
          <span style="display: inline-flex; align-items: center; color: var(--color-text-tertiary);" data-icon="home" data-width="22" data-height="22"></span>
          <span style="font-size: var(--font-size-xs); color: var(--color-text-tertiary);">首页</span>
        </div>

        <!-- Tab: Trends (Active) -->
        <div data-dom-id="tab-trends" data-tab-key="trends" style="display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; padding: 4px 16px;">
          <span style="display: inline-flex; align-items: center; color: var(--color-primary);" data-icon="trending-up" data-width="22" data-height="22"></span>
          <span style="font-size: var(--font-size-xs); color: var(--color-primary); font-weight: var(--font-weight-semibold);">趋势</span>
        </div>

        <!-- Tab: Profile -->
        <div data-dom-id="tab-profile" data-tab-key="profile" style="display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; padding: 4px 16px;">
          <span style="display: inline-flex; align-items: center; color: var(--color-text-tertiary);" data-icon="user" data-width="22" data-height="22"></span>
          <span style="font-size: var(--font-size-xs); color: var(--color-text-tertiary);">我的</span>
        </div>
      </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
