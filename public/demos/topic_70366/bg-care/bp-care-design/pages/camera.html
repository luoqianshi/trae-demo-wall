<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拍照识别</title>
    <style id="theme-vars">
/* ============================================
   BP Care 血压管家 - Brand Design Tokens
   Warm, caring, elderly-friendly design system
   ============================================ */

:root {
  /* ---- Color System ---- */
  /* Primary: Warm coral-rose - conveys care and health */
  --color-primary: #E8634A;
  --color-primary-light: #F28B73;
  --color-primary-lighter: #FBD4CC;
  --color-primary-dark: #C94D35;

  /* Neutral palette: warm grays */
  --color-bg: #FFF8F5;
  --color-bg-secondary: #FFF1EC;
  --color-bg-tertiary: #FFE8E0;
  --color-surface: #FFFFFF;
  --color-surface-elevated: #FFFFFF;
  --color-border: #F0DDD5;
  --color-border-light: #F7EBE5;

  /* Text hierarchy - high contrast for elderly */
  --color-text-primary: #2D1810;
  --color-text-secondary: #6B4F42;
  --color-text-tertiary: #9E8B82;
  --color-text-inverse: #FFFFFF;

  /* State colors */
  --state-success: #2EAE6A;
  --state-success-bg: #E8F8EF;
  --state-warning: #E6A817;
  --state-warning-bg: #FFF8E1;
  --state-error: #E63F3F;
  --state-error-bg: #FFEBEB;
  --state-info: #4A90D9;
  --state-info-bg: #EBF3FC;

  /* Health-specific semantic colors */
  --health-normal: #2EAE6A;
  --health-elevated: #E6A817;
  --health-high: #E8634A;
  --health-critical: #E63F3F;

  /* ---- Typography System ---- */
  /* Extra large scale for elderly readability */
  --font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --font-family-display: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;

  /* Type scale - larger than standard for accessibility */
  --font-size-xs: 12px;
  --font-size-sm: 14px;
  --font-size-base: 16px;
  --font-size-md: 18px;
  --font-size-lg: 22px;
  --font-size-xl: 28px;
  --font-size-2xl: 34px;
  --font-size-3xl: 42px;

  /* Line height - relaxed for readability */
  --line-height-tight: 1.3;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.7;

  /* Font weights */
  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  /* ---- Spacing System ---- */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 16px;
  --spacing-lg: 24px;
  --spacing-xl: 32px;
  --spacing-2xl: 48px;

  /* ---- Radius System ---- */
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* ---- Shadow System ---- */
  /* Very subtle for static cards, deeper for floating elements */
  --shadow-sm: 0 1px 3px rgba(45, 24, 16, 0.04);
  --shadow-md: 0 2px 8px rgba(45, 24, 16, 0.06);
  --shadow-lg: 0 8px 24px rgba(45, 24, 16, 0.1);

  /* ---- Component-specific ---- */
  --tab-bar-height: 56px;
  --header-height: 56px;
  --card-padding: 20px;
  --input-height: 52px;
  --button-height: 52px;
  --button-height-lg: 60px;
}

/* Dark mode placeholder (not primary focus for elderly app) */
html.dark {
  --color-bg: #1A1210;
  --color-bg-secondary: #241C18;
  --color-bg-tertiary: #2E2420;
  --color-surface: #2E2420;
  --color-surface-elevated: #382E28;
  --color-border: #3E342E;
  --color-border-light: #342A24;
  --color-text-primary: #F5E6DF;
  --color-text-secondary: #C4A99C;
  --color-text-tertiary: #8E7B72;
  --color-text-inverse: #2D1810;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-surface); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="relative mx-auto" style="max-width: 375px; min-height: 100vh; display: flex; flex-direction: column; background: #1A1210; overflow: hidden;">

      <style>
        /* Camera page specific styles */
        .camera-page { position: relative; width: 100%; min-height: 100vh; display: flex; flex-direction: column; background: #1A1210; overflow: hidden; }

        /* Top nav bar */
        .camera-nav { position: relative; z-index: 10; height: 56px; display: flex; align-items: center; justify-content: center; background: rgba(26, 18, 16, 0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); flex-shrink: 0; }
        .camera-nav__back { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #FFFFFF; cursor: pointer; border: none; background: none; padding: 0; }
        .camera-nav__title { font-size: 18px; font-weight: var(--font-weight-semibold); color: #FFFFFF; letter-spacing: 0.5px; }

        /* Viewfinder area */
        .viewfinder { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, #0F0B09 0%, #1A1210 30%, #1E1612 100%); min-height: 0; }

        /* Vignette overlay */
        .viewfinder__vignette { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
        .viewfinder__vignette::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 40%, rgba(10, 6, 4, 0.6) 100%); }

        /* Focus frame */
        .focus-frame { position: relative; z-index: 2; width: 240px; height: 160px; border: 2px dashed rgba(255, 255, 255, 0.5); border-radius: var(--radius-md); display: flex; flex-direction: column; align-items: center; justify-content: center; }

        /* Corner brackets */
        .corner-bracket { position: absolute; width: 20px; height: 20px; border-color: #FFFFFF; border-style: solid; border-width: 0; z-index: 3; }
        .corner-bracket--tl { top: -2px; left: -2px; border-top-width: 3px; border-left-width: 3px; border-top-left-radius: 4px; }
        .corner-bracket--tr { top: -2px; right: -2px; border-top-width: 3px; border-right-width: 3px; border-top-right-radius: 4px; }
        .corner-bracket--bl { bottom: -2px; left: -2px; border-bottom-width: 3px; border-left-width: 3px; border-bottom-left-radius: 4px; }
        .corner-bracket--br { bottom: -2px; right: -2px; border-bottom-width: 3px; border-right-width: 3px; border-bottom-right-radius: 4px; }

        /* Scan line animation */
        .scan-line { position: absolute; left: 4px; right: 4px; height: 2px; background: linear-gradient(90deg, transparent, rgba(232, 99, 74, 0.7), transparent); z-index: 4; animation: scanMove 2.5s ease-in-out infinite; border-radius: 1px; box-shadow: 0 0 8px rgba(232, 99, 74, 0.4); }
        @keyframes scanMove { 0%, 100% { top: 8px; opacity: 0.3; } 50% { top: calc(100% - 10px); opacity: 0.9; } }

        /* Stylized BP monitor display */
        .bp-display { text-align: center; padding: 8px; }
        .bp-display__label { font-size: 10px; color: rgba(255, 255, 255, 0.5); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; font-family: "PingFang SC", sans-serif; }
        .bp-display__readings { font-size: 42px; font-weight: var(--font-weight-bold); color: #FFFFFF; line-height: 1; letter-spacing: 1px; font-family: "SF Mono", "Menlo", "Courier New", monospace; text-shadow: 0 0 20px rgba(232, 99, 74, 0.3); }
        .bp-display__unit { font-size: 10px; color: rgba(255, 255, 255, 0.4); margin-top: 4px; letter-spacing: 1px; }

        /* Guide text area */
        .guide-area { position: relative; z-index: 5; text-align: center; padding: 20px 24px 12px; flex-shrink: 0; }
        .guide-area__text { font-size: var(--font-size-md); color: #FFFFFF; font-weight: var(--font-weight-medium); line-height: var(--line-height-relaxed); }
        .guide-area__subtext { font-size: var(--font-size-xs); color: rgba(255, 255, 255, 0.45); margin-top: 6px; line-height: var(--line-height-normal); }

        /* Guide posture illustration */
        .guide-illustration { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; }
        .guide-illustration__icon { width: 36px; height: 36px; border-radius: 50%; background: rgba(232, 99, 74, 0.15); display: flex; align-items: center; justify-content: center; color: var(--color-primary); flex-shrink: 0; }
        .guide-illustration__icon svg { width: 18px; height: 18px; }

        /* Bottom controls */
        .controls-area { position: relative; z-index: 5; background: linear-gradient(180deg, rgba(26, 18, 16, 0.95) 0%, #1A1210 20%); padding: 8px 24px 36px; display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }

        /* Capture button */
        .capture-btn { width: 72px; height: 72px; border-radius: 50%; background: var(--color-primary); border: 4px solid rgba(255, 255, 255, 0.3); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 20px rgba(232, 99, 74, 0.4), 0 0 0 2px rgba(232, 99, 74, 0.2); transition: transform 0.15s ease, box-shadow 0.15s ease; margin-bottom: 14px; }
        .capture-btn:active { transform: scale(0.95); box-shadow: 0 2px 12px rgba(232, 99, 74, 0.3), 0 0 0 2px rgba(232, 99, 74, 0.15); }
        .capture-btn__icon { color: #FFFFFF; }

        .controls-area__hint { font-size: var(--font-size-sm); color: rgba(255, 255, 255, 0.5); text-align: center; line-height: var(--line-height-normal); max-width: 260px; }

        /* Dark overlay strips above/below frame to create camera UI feel */
        .viewfinder__overlay-top, .viewfinder__overlay-bottom, .viewfinder__overlay-left, .viewfinder__overlay-right { position: absolute; background: rgba(10, 6, 4, 0.35); z-index: 0; }
        .viewfinder__overlay-top { top: 0; left: 0; right: 0; height: 20%; }
        .viewfinder__overlay-bottom { bottom: 0; left: 0; right: 0; height: 20%; }
        .viewfinder__overlay-left { top: 20%; left: 0; width: 15%; bottom: 20%; }
        .viewfinder__overlay-right { top: 20%; right: 0; width: 15%; bottom: 20%; }
      </style>

      <!-- 1. Top Navigation Bar -->
      <div class="camera-nav">
        <button class="camera-nav__back" data-dom-id="back-home" aria-label="返回">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <span class="camera-nav__title">拍照识别</span>
      </div>

      <!-- 2. Camera Viewfinder Area -->
      <div class="viewfinder">
        <!-- Dark edge overlays for camera feel -->
        <div class="viewfinder__overlay-top"></div>
        <div class="viewfinder__overlay-bottom"></div>
        <div class="viewfinder__overlay-left"></div>
        <div class="viewfinder__overlay-right"></div>

        <!-- Vignette effect -->
        <div class="viewfinder__vignette"></div>

        <!-- Focus frame with corner markers -->
        <div class="focus-frame">
          <!-- Corner brackets -->
          <div class="corner-bracket corner-bracket--tl"></div>
          <div class="corner-bracket corner-bracket--tr"></div>
          <div class="corner-bracket corner-bracket--bl"></div>
          <div class="corner-bracket corner-bracket--br"></div>

          <!-- Scan line -->
          <div class="scan-line"></div>

          <!-- Stylized BP monitor display -->
          <div class="bp-display">
            <div class="bp-display__label">血压读数</div>
            <div class="bp-display__readings">128/82</div>
            <div class="bp-display__unit">mmHg</div>
          </div>
        </div>
      </div>

      <!-- 3. Guide Text -->
      <div class="guide-area">
        <div class="guide-area__text">请将血压计屏幕对准框内</div>
        <div class="guide-area__subtext">保持手机平稳，确保屏幕文字清晰可见</div>

        <!-- Small posture illustration -->
        <div class="guide-illustration">
          <div class="guide-illustration__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"></rect><path d="M8 21h8"></path><path d="M12 17v4"></path><circle cx="12" cy="10" r="2"></circle></svg>
          </div>
          <span style="font-size: 12px; color: rgba(255,255,255,0.35); line-height: 1.4;">将血压计正面朝向摄像头</span>
        </div>
      </div>

      <!-- 4. Bottom Controls Area -->
      <div class="controls-area">
        <!-- Large circular capture button -->
        <button class="capture-btn" aria-label="拍照">
          <svg class="capture-btn__icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
        </button>

        <div class="controls-area__hint">点击拍照，AI自动识别血压数据</div>
      </div>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
