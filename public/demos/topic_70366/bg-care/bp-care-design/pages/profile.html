<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心</title>
    <style id="theme-vars">
/* ============================================
   BP Care 血压管家 - Brand Design Tokens
   Warm, caring, elderly-friendly design system
   ============================================ */

:root {
  /* ---- Color System ---- */
  /* Primary: Warm coral-rose - conveys care and health */
  --color-primary: #E8634A;
  --color-primary-light: #F28B73;
  --color-primary-lighter: #FBD4CC;
  --color-primary-dark: #C94D35;

  /* Neutral palette: warm grays */
  --color-bg: #FFF8F5;
  --color-bg-secondary: #FFF1EC;
  --color-bg-tertiary: #FFE8E0;
  --color-surface: #FFFFFF;
  --color-surface-elevated: #FFFFFF;
  --color-border: #F0DDD5;
  --color-border-light: #F7EBE5;

  /* Text hierarchy - high contrast for elderly */
  --color-text-primary: #2D1810;
  --color-text-secondary: #6B4F42;
  --color-text-tertiary: #9E8B82;
  --color-text-inverse: #FFFFFF;

  /* State colors */
  --state-success: #2EAE6A;
  --state-success-bg: #E8F8EF;
  --state-warning: #E6A817;
  --state-warning-bg: #FFF8E1;
  --state-error: #E63F3F;
  --state-error-bg: #FFEBEB;
  --state-info: #4A90D9;
  --state-info-bg: #EBF3FC;

  /* Health-specific semantic colors */
  --health-normal: #2EAE6A;
  --health-elevated: #E6A817;
  --health-high: #E8634A;
  --health-critical: #E63F3F;

  /* ---- Typography System ---- */
  /* Extra large scale for elderly readability */
  --font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --font-family-display: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;

  /* Type scale - larger than standard for accessibility */
  --font-size-xs: 12px;
  --font-size-sm: 14px;
  --font-size-base: 16px;
  --font-size-md: 18px;
  --font-size-lg: 22px;
  --font-size-xl: 28px;
  --font-size-2xl: 34px;
  --font-size-3xl: 42px;

  /* Line height - relaxed for readability */
  --line-height-tight: 1.3;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.7;

  /* Font weights */
  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  /* ---- Spacing System ---- */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 16px;
  --spacing-lg: 24px;
  --spacing-xl: 32px;
  --spacing-2xl: 48px;

  /* ---- Radius System ---- */
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* ---- Shadow System ---- */
  /* Very subtle for static cards, deeper for floating elements */
  --shadow-sm: 0 1px 3px rgba(45, 24, 16, 0.04);
  --shadow-md: 0 2px 8px rgba(45, 24, 16, 0.06);
  --shadow-lg: 0 8px 24px rgba(45, 24, 16, 0.1);

  /* ---- Component-specific ---- */
  --tab-bar-height: 56px;
  --header-height: 56px;
  --card-padding: 20px;
  --input-height: 52px;
  --button-height: 52px;
  --button-height-lg: 60px;
}

/* Dark mode placeholder (not primary focus for elderly app) */
html.dark {
  --color-bg: #1A1210;
  --color-bg-secondary: #241C18;
  --color-bg-tertiary: #2E2420;
  --color-surface: #2E2420;
  --color-surface-elevated: #382E28;
  --color-border: #3E342E;
  --color-border-light: #342A24;
  --color-text-primary: #F5E6DF;
  --color-text-secondary: #C4A99C;
  --color-text-tertiary: #8E7B72;
  --color-text-inverse: #2D1810;
}

    </style>

    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-surface); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }

    <style>
        /* ========== Profile Page Styles ========== */
        .profile-page {
            min-height: 100vh;
            background: var(--color-bg);
            padding-bottom: calc(var(--tab-bar-height) + var(--spacing-xl));
            font-family: var(--font-family);
        }

        /* Profile Header */
        .profile-header {
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
            padding: var(--spacing-xl) var(--spacing-md) var(--spacing-2xl);
            border-radius: 0 0 var(--radius-xl) var(--radius-xl);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .profile-header::before {
            content: '';
            position: absolute;
            top: -40px;
            right: -40px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
        }

        .profile-header::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: -30px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
        }

        .avatar-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: var(--spacing-md);
            position: relative;
            z-index: 1;
        }

        .avatar-silhouette {
            width: 36px;
            height: 36px;
            position: relative;
        }

        .avatar-head {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.85);
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        .avatar-body {
            width: 30px;
            height: 16px;
            border-radius: 15px 15px 0 0;
            background: rgba(255, 255, 255, 0.85);
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        .profile-name {
            font-size: var(--font-size-lg);
            font-weight: var(--font-weight-bold);
            color: var(--color-text-inverse);
            margin-bottom: var(--spacing-xs);
            position: relative;
            z-index: 1;
        }

        .profile-subtitle {
            font-size: var(--font-size-sm);
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: var(--spacing-sm);
            position: relative;
            z-index: 1;
        }

        .profile-greeting {
            font-size: var(--font-size-sm);
            color: rgba(255, 255, 255, 0.9);
            position: relative;
            z-index: 1;
        }

        /* Content Area */
        .profile-content {
            padding: var(--spacing-lg) var(--spacing-md);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        /* AI Analysis Card */
        .ai-card {
            background: var(--color-surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            padding: var(--spacing-md) var(--card-padding);
            border-left: 6px solid var(--color-primary);
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .ai-card:active {
            transform: scale(0.98);
        }

        .ai-icon-circle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--color-primary-lighter);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-right: var(--spacing-md);
            position: relative;
        }

        .ai-sparkle {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 10px;
            height: 10px;
        }

        .ai-sparkle::before,
        .ai-sparkle::after {
            content: '';
            position: absolute;
            background: var(--color-primary);
            border-radius: 1px;
        }

        .ai-sparkle::before {
            width: 10px;
            height: 2px;
            top: 4px;
            left: 0;
        }

        .ai-sparkle::after {
            width: 2px;
            height: 10px;
            top: 0;
            left: 4px;
        }

        .ai-robot-face {
            width: 20px;
            height: 20px;
            border-radius: 6px;
            background: var(--color-primary);
            position: relative;
        }

        .ai-robot-face::before {
            content: '';
            position: absolute;
            top: 6px;
            left: 4px;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--color-text-inverse);
            box-shadow: 8px 0 0 0 var(--color-text-inverse);
        }

        .ai-robot-face::after {
            content: '';
            position: absolute;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 2px;
            border-radius: 1px;
            background: var(--color-text-inverse);
        }

        .ai-text-area {
            flex: 1;
        }

        .ai-card-title {
            font-size: var(--font-size-md);
            font-weight: var(--font-weight-bold);
            color: var(--color-text-primary);
            margin-bottom: 2px;
        }

        .ai-card-desc {
            font-size: var(--font-size-sm);
            color: var(--color-text-tertiary);
        }

        .arrow-right {
            width: 8px;
            height: 14px;
            border-top: 2px solid var(--color-text-tertiary);
            border-right: 2px solid var(--color-text-tertiary);
            transform: rotate(45deg);
            flex-shrink: 0;
            margin-left: var(--spacing-sm);
        }

        /* Section Headers */
        .section-header {
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-medium);
            color: var(--color-text-tertiary);
            padding: var(--spacing-xs) var(--spacing-sm);
            text-transform: none;
            letter-spacing: 0.02em;
        }

        /* Menu Card */
        .menu-card {
            background: var(--color-surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        .menu-item {
            display: flex;
            align-items: center;
            height: 56px;
            padding: 0 var(--card-padding);
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .menu-item:active {
            background: var(--color-bg-secondary);
        }

        .menu-item + .menu-item {
            border-top: 1px solid var(--color-border-light);
        }

        .menu-icon {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-right: var(--spacing-md);
        }

        .menu-icon-calendar {
            background: var(--state-info-bg);
        }

        .menu-icon-download {
            background: var(--state-success-bg);
        }

        .menu-icon-trash {
            background: var(--state-error-bg);
        }

        .menu-icon svg {
            width: 18px;
            height: 18px;
        }

        .menu-text {
            flex: 1;
            font-size: var(--font-size-base);
            color: var(--color-text-primary);
        }

        .menu-text-warning {
            color: var(--state-error);
        }

        /* Privacy Card */
        .privacy-card {
            background: var(--state-success-bg);
            border: 1.5px solid var(--health-normal);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg) var(--card-padding);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .privacy-shield-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(46, 174, 106, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: var(--spacing-md);
        }

        .shield-shape {
            width: 24px;
            height: 28px;
            position: relative;
        }

        .shield-body {
            width: 24px;
            height: 20px;
            background: var(--health-normal);
            border-radius: 4px 4px 10px 10px;
            position: absolute;
            bottom: 0;
        }

        .shield-top {
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 10px solid var(--health-normal);
            position: absolute;
            top: 0;
        }

        .shield-check {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 6px;
            border-left: 2px solid var(--color-text-inverse);
            border-bottom: 2px solid var(--color-text-inverse);
            transform: translateX(-50%) rotate(-45deg);
            margin-top: 2px;
        }

        .privacy-title {
            font-size: var(--font-size-base);
            font-weight: var(--font-weight-bold);
            color: var(--color-text-primary);
            margin-bottom: var(--spacing-sm);
        }

        .privacy-desc {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
            line-height: var(--line-height-relaxed);
        }

        /* About Section */
        .about-section {
            text-align: center;
            padding: var(--spacing-md) 0 var(--spacing-xs);
        }

        .about-text {
            font-size: var(--font-size-sm);
            color: var(--color-text-tertiary);
        }

        .about-version {
            font-size: var(--font-size-xs);
            color: var(--color-text-tertiary);
            margin-top: var(--spacing-xs);
        }

        /* Tab Bar */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: var(--tab-bar-height);
            background: var(--color-surface);
            border-top: 1px solid var(--color-border-light);
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 100;
            box-shadow: 0 -1px 4px rgba(45, 24, 16, 0.04);
        }

        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            height: 100%;
            cursor: pointer;
            gap: 2px;
        }

        .tab-item:active {
            opacity: 0.7;
        }

        .tab-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tab-label {
            font-size: var(--font-size-xs);
            color: var(--color-text-tertiary);
        }

        .tab-label-active {
            color: var(--color-primary);
            font-weight: var(--font-weight-medium);
        }

        /* Simple CSS icons for tab bar */
        .icon-home {
            width: 20px;
            height: 18px;
            position: relative;
        }

        .icon-home::before {
            content: '';
            position: absolute;
            bottom: 0;
            width: 20px;
            height: 12px;
            background: var(--color-text-tertiary);
            border-radius: 2px;
        }

        .icon-home::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 10px solid var(--color-text-tertiary);
        }

        .icon-trends {
            width: 20px;
            height: 18px;
            position: relative;
            display: flex;
            align-items: flex-end;
            gap: 3px;
        }

        .icon-trends::before {
            content: '';
            width: 4px;
            height: 10px;
            background: var(--color-text-tertiary);
            border-radius: 1px;
        }

        .icon-trends::after {
            content: '';
            width: 4px;
            height: 16px;
            background: var(--color-text-tertiary);
            border-radius: 1px;
        }

        .icon-trends-mid {
            width: 4px;
            height: 8px;
            background: var(--color-text-tertiary);
            border-radius: 1px;
        }

        .icon-profile {
            width: 20px;
            height: 20px;
            position: relative;
        }

        .icon-profile::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--color-primary);
        }

        .icon-profile::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 8px;
            border-radius: 8px 8px 0 0;
            background: var(--color-primary);
        }

        /* Active tab icon color overrides */
        .tab-item-active .icon-home::before,
        .tab-item-active .icon-home::after {
            border-bottom-color: var(--color-primary);
        }

        .tab-item-active .icon-home::before {
            background: var(--color-primary);
        }

        .tab-item-active .icon-trends::before,
        .tab-item-active .icon-trends::after {
            background: var(--color-primary);
        }

        .tab-item-active .icon-trends-mid {
            background: var(--color-primary);
        }

        /* Calendar icon for menu */
        .css-icon-calendar {
            width: 18px;
            height: 18px;
            position: relative;
        }

        .css-icon-calendar::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 0;
            width: 18px;
            height: 14px;
            border: 2px solid var(--state-info);
            border-radius: 2px;
            background: transparent;
        }

        .css-icon-calendar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 4px;
            width: 2px;
            height: 7px;
            background: var(--state-info);
            border-radius: 1px;
            box-shadow: 8px 0 0 0 var(--state-info);
        }

        /* Download icon for menu */
        .css-icon-download {
            width: 18px;
            height: 18px;
            position: relative;
        }

        .css-icon-download::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 10px;
            background: var(--health-normal);
            border-radius: 1px;
        }

        .css-icon-download::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-top: 6px solid var(--health-normal);
        }

        .css-icon-download-line {
            position: absolute;
            bottom: 0;
            left: 2px;
            width: 14px;
            height: 2px;
            background: var(--health-normal);
            border-radius: 1px;
        }

        /* Trash icon for menu */
        .css-icon-trash {
            width: 18px;
            height: 18px;
            position: relative;
        }

        .css-icon-trash-lid {
            position: absolute;
            top: 0;
            left: 2px;
            width: 14px;
            height: 3px;
            background: var(--state-error);
            border-radius: 1px;
        }

        .css-icon-trash-handle {
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 3px;
            background: var(--state-error);
            border-radius: 1px 1px 0 0;
        }

        .css-icon-trash-body {
            position: absolute;
            bottom: 0;
            left: 3px;
            width: 12px;
            height: 12px;
            border: 2px solid var(--state-error);
            border-top: none;
            border-radius: 0 0 2px 2px;
            background: transparent;
        }

        /* Device frame for preview */
        .device-frame {
            max-width: 375px;
            margin: 0 auto;
            background: var(--color-bg);
            min-height: 100vh;
            position: relative;
        }

        @media (min-width: 376px) {
            body {
                background: #f0e6e0;
            }
            .device-frame {
                box-shadow: 0 0 40px rgba(0, 0, 0, 0.15);
            }
        }
    </style>
</head>

                        <div class="menu-item">
