<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手动录入</title>
    <style id="theme-vars">
/* ============================================
   BP Care 血压管家 - Brand Design Tokens
   Warm, caring, elderly-friendly design system
   ============================================ */

:root {
  /* ---- Color System ---- */
  /* Primary: Warm coral-rose - conveys care and health */
  --color-primary: #E8634A;
  --color-primary-light: #F28B73;
  --color-primary-lighter: #FBD4CC;
  --color-primary-dark: #C94D35;

  /* Neutral palette: warm grays */
  --color-bg: #FFF8F5;
  --color-bg-secondary: #FFF1EC;
  --color-bg-tertiary: #FFE8E0;
  --color-surface: #FFFFFF;
  --color-surface-elevated: #FFFFFF;
  --color-border: #F0DDD5;
  --color-border-light: #F7EBE5;

  /* Text hierarchy - high contrast for elderly */
  --color-text-primary: #2D1810;
  --color-text-secondary: #6B4F42;
  --color-text-tertiary: #9E8B82;
  --color-text-inverse: #FFFFFF;

  /* State colors */
  --state-success: #2EAE6A;
  --state-success-bg: #E8F8EF;
  --state-warning: #E6A817;
  --state-warning-bg: #FFF8E1;
  --state-error: #E63F3F;
  --state-error-bg: #FFEBEB;
  --state-info: #4A90D9;
  --state-info-bg: #EBF3FC;

  /* Health-specific semantic colors */
  --health-normal: #2EAE6A;
  --health-elevated: #E6A817;
  --health-high: #E8634A;
  --health-critical: #E63F3F;

  /* ---- Typography System ---- */
  /* Extra large scale for elderly readability */
  --font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --font-family-display: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;

  /* Type scale - larger than standard for accessibility */
  --font-size-xs: 12px;
  --font-size-sm: 14px;
  --font-size-base: 16px;
  --font-size-md: 18px;
  --font-size-lg: 22px;
  --font-size-xl: 28px;
  --font-size-2xl: 34px;
  --font-size-3xl: 42px;

  /* Line height - relaxed for readability */
  --line-height-tight: 1.3;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.7;

  /* Font weights */
  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  /* ---- Spacing System ---- */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 16px;
  --spacing-lg: 24px;
  --spacing-xl: 32px;
  --spacing-2xl: 48px;

  /* ---- Radius System ---- */
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* ---- Shadow System ---- */
  /* Very subtle for static cards, deeper for floating elements */
  --shadow-sm: 0 1px 3px rgba(45, 24, 16, 0.04);
  --shadow-md: 0 2px 8px rgba(45, 24, 16, 0.06);
  --shadow-lg: 0 8px 24px rgba(45, 24, 16, 0.1);

  /* ---- Component-specific ---- */
  --tab-bar-height: 56px;
  --header-height: 56px;
  --card-padding: 20px;
  --input-height: 52px;
  --button-height: 52px;
  --button-height-lg: 60px;
}

/* Dark mode placeholder (not primary focus for elderly app) */
html.dark {
  --color-bg: #1A1210;
  --color-bg-secondary: #241C18;
  --color-bg-tertiary: #2E2420;
  --color-surface: #2E2420;
  --color-surface-elevated: #382E28;
  --color-border: #3E342E;
  --color-border-light: #342A24;
  --color-text-primary: #F5E6DF;
  --color-text-secondary: #C4A99C;
  --color-text-tertiary: #8E7B72;
  --color-text-inverse: #2D1810;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-surface); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
    <style>
      /* ============================================
         Page-specific styles: Manual Input (手动录入)
         ============================================ */

      body {
        font-family: var(--font-family);
        background: var(--color-bg);
        margin: 0;
        padding: 0;
        max-width: 375px;
        margin-left: auto;
        margin-right: auto;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }

      /* Top Navigation Bar */
      .nav-bar {
        position: sticky;
        top: 0;
        z-index: 10;
        height: var(--header-height);
        background: var(--color-surface);
        display: flex;
        align-items: center;
        padding: 0 var(--spacing-md);
        border-bottom: 1px solid var(--color-border-light);
        backdrop-filter: blur(12px);
      }

      .nav-bar .back-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        border: none;
        background: none;
        cursor: pointer;
        color: var(--color-text-primary);
        border-radius: var(--radius-md);
        transition: background 0.2s;
        flex-shrink: 0;
      }

      .nav-bar .back-btn:active {
        background: var(--color-bg-secondary);
      }

      .nav-bar .back-btn svg {
        width: 24px;
        height: 24px;
      }

      .nav-bar .nav-title {
        flex: 1;
        text-align: center;
        font-size: var(--font-size-lg);
        font-weight: var(--font-weight-semibold);
        color: var(--color-text-primary);
        padding-right: 44px; /* offset back button width for centering */
      }

      /* Form Card Container */
      .form-card {
        background: var(--color-surface);
        border-radius: var(--radius-xl);
        padding: var(--spacing-lg);
        margin: var(--spacing-md);
        box-shadow: var(--shadow-md);
      }

      /* Date Time Display */
      .datetime-display {
        display: flex;
        align-items: center;
        gap: var(--spacing-sm);
        padding-bottom: var(--spacing-lg);
        margin-bottom: var(--spacing-lg);
        border-bottom: 1px solid var(--color-border-light);
        color: var(--color-text-secondary);
        font-size: var(--font-size-base);
      }

      .datetime-display svg {
        width: 20px;
        height: 20px;
        color: var(--color-text-tertiary);
        flex-shrink: 0;
      }

      /* Input Field Card */
      .input-field-card {
        background: var(--color-bg);
        border-radius: var(--radius-lg);
        padding: var(--spacing-lg);
        margin-bottom: var(--spacing-md);
        border-left: 4px solid var(--color-border);
        transition: box-shadow 0.2s;
      }

      .input-field-card:active {
        box-shadow: var(--shadow-md);
      }

      .input-field-card.accent-coral {
        border-left-color: var(--color-primary);
      }

      .input-field-card.accent-green {
        border-left-color: var(--health-normal);
      }

      .input-field-card.accent-blue {
        border-left-color: var(--state-info);
      }

      .input-field-label {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: var(--spacing-sm);
      }

      .input-field-label .label-text {
        font-size: var(--font-size-md);
        font-weight: var(--font-weight-medium);
        color: var(--color-text-primary);
      }

      .input-field-label .label-unit {
        font-size: var(--font-size-sm);
        color: var(--color-text-tertiary);
        font-weight: var(--font-weight-normal);
      }

      .input-field-input {
        width: 100%;
        height: 60px;
        border: 2px solid var(--color-border);
        border-radius: var(--radius-md);
        background: var(--color-surface);
        font-size: var(--font-size-2xl);
        font-weight: var(--font-weight-bold);
        color: var(--color-text-primary);
        padding: 0 var(--spacing-md);
        outline: none;
        box-sizing: border-box;
        transition: border-color 0.2s, box-shadow 0.2s;
        font-family: var(--font-family);
        -webkit-appearance: none;
        appearance: none;
      }

      .input-field-input:focus {
        border-color: var(--color-primary-light);
        box-shadow: 0 0 0 3px var(--color-primary-lighter);
      }

      .input-field-input::placeholder {
        color: var(--color-text-tertiary);
        font-weight: var(--font-weight-normal);
        font-size: var(--font-size-lg);
      }

      /* Hide number input spinners */
      .input-field-input::-webkit-outer-spin-button,
      .input-field-input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      .input-field-input[type=number] {
        -moz-appearance: textfield;
      }

      /* Save Button */
      .save-btn {
        width: 100%;
        height: 60px;
        border: none;
        border-radius: var(--radius-xl);
        background: var(--color-primary);
        color: var(--color-text-inverse);
        font-size: 20px;
        font-weight: var(--font-weight-semibold);
        font-family: var(--font-family);
        cursor: pointer;
        margin-top: var(--spacing-lg);
        transition: background 0.2s, transform 0.1s;
        letter-spacing: 2px;
      }

      .save-btn:active {
        background: var(--color-primary-dark);
        transform: scale(0.98);
      }

      /* Health Reference Card */
      .health-reference-card {
        background: var(--color-surface);
        border-radius: var(--radius-xl);
        padding: var(--spacing-lg);
        margin: 0 var(--spacing-md) var(--spacing-xl);
        box-shadow: var(--shadow-md);
      }

      .health-reference-title {
        font-size: var(--font-size-md);
        font-weight: var(--font-weight-semibold);
        color: var(--color-text-primary);
        margin-bottom: var(--spacing-md);
        display: flex;
        align-items: center;
        gap: var(--spacing-sm);
      }

      .health-reference-title svg {
        width: 20px;
        height: 20px;
        color: var(--color-text-tertiary);
      }

      .reference-row {
        display: flex;
        align-items: center;
        gap: var(--spacing-sm);
        padding: var(--spacing-sm) 0;
      }

      .reference-row + .reference-row {
        border-top: 1px solid var(--color-border-light);
      }

      .reference-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      .reference-dot.normal { background: var(--health-normal); }
      .reference-dot.elevated { background: var(--health-elevated); }
      .reference-dot.high { background: var(--health-high); }

      .reference-badge {
        display: inline-flex;
        align-items: center;
        padding: 2px 10px;
        border-radius: var(--radius-full);
        font-size: var(--font-size-sm);
        font-weight: var(--font-weight-medium);
        flex-shrink: 0;
        min-width: 48px;
        justify-content: center;
      }

      .reference-badge.normal {
        background: var(--state-success-bg);
        color: var(--health-normal);
      }

      .reference-badge.elevated {
        background: var(--state-warning-bg);
        color: var(--health-elevated);
      }

      .reference-badge.high {
        background: var(--state-error-bg);
        color: var(--health-high);
      }

      .reference-desc {
        font-size: var(--font-size-sm);
        color: var(--color-text-secondary);
        line-height: var(--line-height-relaxed);
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>

      <!-- Top Navigation Bar -->
      <nav class="nav-bar">
        <button class="back-btn" data-dom-id="back-home" aria-label="返回">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <span class="nav-title">手动录入</span>
      </nav>

      <!-- Main Form Card -->
      <div class="form-card">

        <!-- Date & Time Display -->
        <div class="datetime-display">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>2026年7月4日 上午 09:30</span>
        </div>

        <!-- Systolic Pressure Input (收缩压/高压) -->
        <div class="input-field-card accent-coral">
          <div class="input-field-label">
            <span class="label-text">收缩压（高压）</span>
            <span class="label-unit">mmHg</span>
          </div>
          <input type="number" class="input-field-input" placeholder="请输入" value="128" inputmode="numeric">
        </div>

        <!-- Diastolic Pressure Input (舒张压/低压) -->
        <div class="input-field-card accent-green">
          <div class="input-field-label">
            <span class="label-text">舒张压（低压）</span>
            <span class="label-unit">mmHg</span>
          </div>
          <input type="number" class="input-field-input" placeholder="请输入" value="82" inputmode="numeric">
        </div>

        <!-- Heart Rate Input (心率) -->
        <div class="input-field-card accent-blue">
          <div class="input-field-label">
            <span class="label-text">心率</span>
            <span class="label-unit">次/分</span>
          </div>
          <input type="number" class="input-field-input" placeholder="请输入" value="72" inputmode="numeric">
        </div>

        <!-- Save Button -->
        <button class="save-btn">保存记录</button>
      </div>

      <!-- Health Reference Card -->
      <div class="health-reference-card">
        <div class="health-reference-title">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          血压参考范围
        </div>

        <div class="reference-row">
          <span class="reference-badge normal">正常</span>
          <span class="reference-dot normal"></span>
          <span class="reference-desc">高压 &lt; 120 且 低压 &lt; 80</span>
        </div>

        <div class="reference-row">
          <span class="reference-badge elevated">偏高</span>
          <span class="reference-dot elevated"></span>
          <span class="reference-desc">高压 120-139 或 低压 80-89</span>
        </div>

        <div class="reference-row">
          <span class="reference-badge high">高血压</span>
          <span class="reference-dot high"></span>
          <span class="reference-desc">高压 &ge; 140 或 低压 &ge; 90</span>
        </div>
      </div>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
