/* ============================================
   BP Care 血压管家 - Brand Design Tokens
   Warm, caring, elderly-friendly design system
   ============================================ */

:root {
  /* ---- Color System ---- */
  /* Primary: Warm coral-rose - conveys care and health */
  --color-primary: #E8634A;
  --color-primary-light: #F28B73;
  --color-primary-lighter: #FBD4CC;
  --color-primary-dark: #C94D35;

  /* Neutral palette: warm grays */
  --color-bg: #FFF8F5;
  --color-bg-secondary: #FFF1EC;
  --color-bg-tertiary: #FFE8E0;
  --color-surface: #FFFFFF;
  --color-surface-elevated: #FFFFFF;
  --color-border: #F0DDD5;
  --color-border-light: #F7EBE5;

  /* Text hierarchy - high contrast for elderly */
  --color-text-primary: #2D1810;
  --color-text-secondary: #6B4F42;
  --color-text-tertiary: #9E8B82;
  --color-text-inverse: #FFFFFF;

  /* State colors */
  --state-success: #2EAE6A;
  --state-success-bg: #E8F8EF;
  --state-warning: #E6A817;
  --state-warning-bg: #FFF8E1;
  --state-error: #E63F3F;
  --state-error-bg: #FFEBEB;
  --state-info: #4A90D9;
  --state-info-bg: #EBF3FC;

  /* Health-specific semantic colors */
  --health-normal: #2EAE6A;
  --health-elevated: #E6A817;
  --health-high: #E8634A;
  --health-critical: #E63F3F;

  /* ---- Typography System ---- */
  /* Extra large scale for elderly readability */
  --font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --font-family-display: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;

  /* Type scale - larger than standard for accessibility */
  --font-size-xs: 12px;
  --font-size-sm: 14px;
  --font-size-base: 16px;
  --font-size-md: 18px;
  --font-size-lg: 22px;
  --font-size-xl: 28px;
  --font-size-2xl: 34px;
  --font-size-3xl: 42px;

  /* Line height - relaxed for readability */
  --line-height-tight: 1.3;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.7;

  /* Font weights */
  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  /* ---- Spacing System ---- */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 16px;
  --spacing-lg: 24px;
  --spacing-xl: 32px;
  --spacing-2xl: 48px;

  /* ---- Radius System ---- */
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* ---- Shadow System ---- */
  /* Very subtle for static cards, deeper for floating elements */
  --shadow-sm: 0 1px 3px rgba(45, 24, 16, 0.04);
  --shadow-md: 0 2px 8px rgba(45, 24, 16, 0.06);
  --shadow-lg: 0 8px 24px rgba(45, 24, 16, 0.1);

  /* ---- Component-specific ---- */
  --tab-bar-height: 56px;
  --header-height: 56px;
  --card-padding: 20px;
  --input-height: 52px;
  --button-height: 52px;
  --button-height-lg: 60px;
}

/* Dark mode placeholder (not primary focus for elderly app) */
html.dark {
  --color-bg: #1A1210;
  --color-bg-secondary: #241C18;
  --color-bg-tertiary: #2E2420;
  --color-surface: #2E2420;
  --color-surface-elevated: #382E28;
  --color-border: #3E342E;
  --color-border-light: #342A24;
  --color-text-primary: #F5E6DF;
  --color-text-secondary: #C4A99C;
  --color-text-tertiary: #8E7B72;
  --color-text-inverse: #2D1810;
}

/* ========== Page-specific styles for Home Page ========== */

/* Reset & base */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

.home-page {
  max-width: 375px;
  margin: 0 auto;
  min-height: 100vh;
  background-color: var(--color-bg);
  font-family: var(--font-family);
  color: var(--color-text-primary);
  padding-bottom: calc(var(--tab-bar-height) + var(--spacing-lg));
  position: relative;
  overflow-x: hidden;
}

/* ---- Status Bar ---- */
.status-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 20px;
  background: var(--color-primary);
  color: var(--color-text-inverse);
  font-size: var(--font-size-sm);
  font-weight: var(--font-weight-medium);
  height: 44px;
}

.status-bar .status-time {
  font-weight: var(--font-weight-semibold);
  font-size: var(--font-size-base);
}

.status-bar .status-icons {
  display: flex;
  align-items: center;
  gap: 6px;
}

.status-bar .icon-signal {
  width: 16px;
  height: 12px;
  position: relative;
}

.status-bar .icon-signal::before,
.status-bar .icon-signal::after {
  content: '';
  position: absolute;
  bottom: 0;
  width: 3px;
  background: var(--color-text-inverse);
  border-radius: 1px;
}

.status-bar .icon-signal::before { left: 0; height: 5px; }
.status-bar .icon-signal::after { left: 5px; height: 8px; }
.status-bar .icon-signal span:nth-child(1) { position: absolute; bottom: 0; left: 10px; width: 3px; height: 12px; background: var(--color-text-inverse); border-radius: 1px; }
.status-bar .icon-signal span:nth-child(2) { position: absolute; bottom: 0; left: 15px; width: 3px; height: 12px; background: var(--color-text-inverse); border-radius: 1px; }

.status-bar .icon-wifi {
  width: 16px;
  height: 12px;
  position: relative;
}

.status-bar .icon-wifi::before {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 4px;
  height: 4px;
  background: var(--color-text-inverse);
  border-radius: 50%;
}

.status-bar .icon-wifi::after {
  content: '';
  position: absolute;
  bottom: 2px;
  left: 50%;
  transform: translateX(-50%);
  width: 12px;
  height: 8px;
  border: 2px solid var(--color-text-inverse);
  border-bottom: none;
  border-radius: 12px 12px 0 0;
}

.status-bar .icon-battery {
  width: 22px;
  height: 10px;
  border: 1.5px solid var(--color-text-inverse);
  border-radius: 2px;
  position: relative;
}

.status-bar .icon-battery::before {
  content: '';
  position: absolute;
  left: 2px;
  top: 2px;
  width: 14px;
  height: 4px;
  background: var(--color-text-inverse);
  border-radius: 1px;
}

.status-bar .icon-battery::after {
  content: '';
  position: absolute;
  right: -4px;
  top: 2px;
  width: 2px;
  height: 4px;
  background: var(--color-text-inverse);
  border-radius: 0 1px 1px 0;
}

/* ---- Page Header ---- */
.page-header {
  background: var(--color-primary);
  padding: 12px 20px 20px;
  color: var(--color-text-inverse);
}

.page-header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.page-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: var(--font-size-lg);
  font-weight: var(--font-weight-bold);
}

.page-title .heart-icon {
  display: inline-flex;
  width: 26px;
  height: 26px;
}

.page-title .heart-icon svg {
  width: 26px;
  height: 26px;
  fill: var(--color-text-inverse);
}

.greeting {
  font-size: var(--font-size-base);
  font-weight: var(--font-weight-normal);
  margin-top: 6px;
  opacity: 0.9;
}

/* ---- BP Summary Card ---- */
.bp-summary-card {
  margin: -4px 16px 0;
  background: var(--color-surface);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
}

.bp-card-header {
  background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-light) 100%);
  padding: 24px 20px 20px;
  color: var(--color-text-inverse);
}

.bp-card-label {
  font-size: var(--font-size-sm);
  opacity: 0.85;
  font-weight: var(--font-weight-medium);
}

.bp-card-date {
  font-size: var(--font-size-base);
  font-weight: var(--font-weight-semibold);
  margin-top: 4px;
}

.bp-card-status-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
}

.health-badge {
  display: inline-flex;
  align-items: center;
  padding: 4px 14px;
  border-radius: var(--radius-full);
  font-size: var(--font-size-sm);
  font-weight: var(--font-weight-semibold);
}

.health-badge.elevated {
  background: var(--state-warning-bg);
  color: var(--health-elevated);
}

.health-badge.normal {
  background: var(--state-success-bg);
  color: var(--health-normal);
}

.bp-card-status-text {
  font-size: var(--font-size-sm);
  opacity: 0.85;
}

/* ---- Metrics Row ---- */
.bp-metrics {
  display: flex;
  justify-content: space-around;
  padding: 24px 12px 28px;
  gap: 8px;
}

.bp-metric {
  flex: 1;
  text-align: center;
  padding: 0 4px;
}

.bp-metric:not(:last-child) {
  border-right: 1px solid var(--color-border-light);
}

.bp-metric-value {
  font-size: var(--font-size-2xl);
  font-weight: var(--font-weight-bold);
  line-height: var(--line-height-tight);
}

.bp-metric-value.elevated {
  color: var(--health-elevated);
}

.bp-metric-value.normal {
  color: var(--health-normal);
}

.bp-metric-unit {
  font-size: var(--font-size-sm);
  color: var(--color-text-secondary);
  font-weight: var(--font-weight-normal);
  margin-left: 2px;
}

.bp-metric-label {
  font-size: var(--font-size-sm);
  color: var(--color-text-secondary);
  margin-top: 6px;
  line-height: var(--line-height-normal);
}

/* ---- Health Tip ---- */
.bp-card-tip {
  background: var(--color-bg-secondary);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 8px;
  border-top: 1px solid var(--color-border-light);
}

.bp-card-tip .tip-icon {
  flex-shrink: 0;
  width: 20px;
  height: 20px;
  color: var(--color-primary);
}

.bp-card-tip .tip-icon svg {
  width: 20px;
  height: 20px;
}

.bp-card-tip .tip-text {
  font-size: var(--font-size-sm);
  color: var(--color-text-secondary);
  line-height: var(--line-height-normal);
}

/* ---- Quick Action Buttons ---- */
.quick-actions {
  display: flex;
  gap: 12px;
  padding: 20px 16px 0;
}

.action-btn {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: var(--button-height-lg);
  border-radius: var(--radius-xl);
  font-size: var(--font-size-md);
  font-weight: var(--font-weight-semibold);
  cursor: pointer;
  border: none;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  text-decoration: none;
}

.action-btn:active {
  transform: scale(0.97);
}

.action-btn.primary {
  background: var(--color-primary);
  color: var(--color-text-inverse);
  box-shadow: 0 4px 12px rgba(232, 99, 74, 0.3);
}

.action-btn.primary:hover {
  box-shadow: 0 6px 16px rgba(232, 99, 74, 0.4);
}

.action-btn.outline {
  background: var(--color-surface);
  color: var(--color-primary);
  border: 2px solid var(--color-primary);
}

.action-btn.outline:hover {
  background: var(--color-primary-lighter);
}

.action-btn .btn-icon {
  width: 22px;
  height: 22px;
}

.action-btn .btn-icon svg {
  width: 22px;
  height: 22px;
}

/* ---- Today's Records Section ---- */
.records-section {
  padding: 24px 16px 0;
}

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--spacing-md);
}

.section-title {
  font-size: var(--font-size-lg);

}

.section-link .arrow-icon {

  height: 16px;
}

.section-link .arrow-icon svg {
  width: 16px;
  height: 16px;
}

.record-card {
  background: var(--color-surface);
  border-radius: var(--radius-lg);
  padding: 16px 20px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-md);

.record-time .time-label {

.record-divider {

.record-data {

.record-values {

.record-val {

}

.record-val-label {

.record-hr {

.record-right {

.tab-bar {

.tab-item .tab-icon {

}

.tab-item .tab-icon svg {

}

.tab-item .tab-label {

  color: var(--color-text-tertiary);

}

.tab-item.active .tab-icon {
  color: var(--color-primary);
}

.tab-item.active .tab-label {
  color: var(--color-primary);
}
</style>
