<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI健康分析</title>
    <style id="theme-vars">
/* ============================================
   BP Care 血压管家 - Brand Design Tokens
   Warm, caring, elderly-friendly design system
   ============================================ */

:root {
  /* ---- Color System ---- */
  /* Primary: Warm coral-rose - conveys care and health */
  --color-primary: #E8634A;
  --color-primary-light: #F28B73;
  --color-primary-lighter: #FBD4CC;
  --color-primary-dark: #C94D35;

  /* Neutral palette: warm grays */
  --color-bg: #FFF8F5;
  --color-bg-secondary: #FFF1EC;
  --color-bg-tertiary: #FFE8E0;
  --color-surface: #FFFFFF;
  --color-surface-elevated: #FFFFFF;
  --color-border: #F0DDD5;
  --color-border-light: #F7EBE5;

  /* Text hierarchy - high contrast for elderly */
  --color-text-primary: #2D1810;
  --color-text-secondary: #6B4F42;
  --color-text-tertiary: #9E8B82;
  --color-text-inverse: #FFFFFF;

  /* State colors */
  --state-success: #2EAE6A;
  --state-success-bg: #E8F8EF;
  --state-warning: #E6A817;
  --state-warning-bg: #FFF8E1;
  --state-error: #E63F3F;
  --state-error-bg: #FFEBEB;
  --state-info: #4A90D9;
  --state-info-bg: #EBF3FC;

  /* Health-specific semantic colors */
  --health-normal: #2EAE6A;
  --health-elevated: #E6A817;
  --health-high: #E8634A;
  --health-critical: #E63F3F;

  /* ---- Typography System ---- */
  /* Extra large scale for elderly readability */
  --font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --font-family-display: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;

  /* Type scale - larger than standard for accessibility */
  --font-size-xs: 12px;
  --font-size-sm: 14px;
  --font-size-base: 16px;
  --font-size-md: 18px;
  --font-size-lg: 22px;
  --font-size-xl: 28px;
  --font-size-2xl: 34px;
  --font-size-3xl: 42px;

  /* Line height - relaxed for readability */
  --line-height-tight: 1.3;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.7;

  /* Font weights */
  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  /* ---- Spacing System ---- */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 16px;
  --spacing-lg: 24px;
  --spacing-xl: 32px;
  --spacing-2xl: 48px;

  /* ---- Radius System ---- */
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* ---- Shadow System ---- */
  /* Very subtle for static cards, deeper for floating elements */
  --shadow-sm: 0 1px 3px rgba(45, 24, 16, 0.04);
  --shadow-md: 0 2px 8px rgba(45, 24, 16, 0.06);
  --shadow-lg: 0 8px 24px rgba(45, 24, 16, 0.1);

  /* ---- Component-specific ---- */
  --tab-bar-height: 56px;
  --header-height: 56px;
  --card-padding: 20px;
  --input-height: 52px;
  --button-height: 52px;
  --button-height-lg: 60px;
}

/* Dark mode placeholder (not primary focus for elderly app) */
html.dark {
  --color-bg: #1A1210;
  --color-bg-secondary: #241C18;
  --color-bg-tertiary: #2E2420;
  --color-surface: #2E2420;
  --color-surface-elevated: #382E28;
  --color-border: #3E342E;
  --color-border-light: #342A24;
  --color-text-primary: #F5E6DF;
  --color-text-secondary: #C4A99C;
  --color-text-tertiary: #8E7B72;
  --color-text-inverse: #2D1810;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-surface); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
    <style>
    /* ===== AI Analysis Page Specific Styles ===== */

    .page-container {
      max-width: 375px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--color-bg);
      font-family: var(--font-family);
      position: relative;
      overflow: hidden;
    }

    /* --- Top Navigation Bar --- */
    .nav-bar {
      height: var(--header-height);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border-light);
      position: relative;
      flex-shrink: 0;
      z-index: 10;
    }

    .nav-back {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--color-text-primary);
    }

    .nav-back-arrow {
      width: 24px;
      height: 24px;
      border-left: 3px solid var(--color-text-primary);
      border-bottom: 3px solid var(--color-text-primary);
      transform: rotate(45deg);
      margin-left: 4px;
    }

    .nav-title {
      font-size: var(--font-size-md);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-primary);
      line-height: var(--line-height-tight);
    }

    /* --- Chat Area --- */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: var(--spacing-md);
      padding-bottom: 80px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .chat-row {
      display: flex;
      gap: 10px;
      max-width: 100%;
    }

    .chat-row.user {
      flex-direction: row-reverse;
    }

    /* Avatar circles */
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-full);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
    }

    .avatar-ai {
      background: var(--color-primary);
      color: var(--color-text-inverse);
      position: relative;
      overflow: hidden;
    }

    .avatar-ai-icon {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Simple robot/heart icon for AI avatar using CSS */
    .ai-icon-heart {
      position: relative;
      width: 18px;
      height: 16px;
    }
    .ai-icon-heart::before,
    .ai-icon-heart::after {
      content: '';
      position: absolute;
      top: 0;
      width: 10px;
      height: 14px;
      border-radius: 10px 10px 0 0;
      background: var(--color-text-inverse);
    }
    .ai-icon-heart::before {
      left: 0;
      transform: rotate(-45deg);
      transform-origin: bottom right;
    }
    .ai-icon-heart::after {
      right: 0;
      transform: rotate(45deg);
      transform-origin: bottom left;
    }

    .avatar-user {
      background: var(--color-bg-tertiary);
      color: var(--color-text-secondary);
    }

    /* Chat bubbles */
    .bubble {
      max-width: calc(100% - 56px);
      padding: 14px 18px;
      font-size: var(--font-size-base);
      line-height: var(--line-height-relaxed);
      word-break: break-word;
    }

    .bubble-user {
      background: var(--color-primary);
      color: var(--color-text-inverse);
      border-radius: var(--radius-xl) var(--radius-sm) var(--radius-xl) var(--radius-xl);
      font-size: var(--font-size-base);
      font-weight: var(--font-weight-normal);
    }

    .bubble-ai {
      background: var(--color-bg-secondary);
      color: var(--color-text-primary);
      border-radius: var(--radius-sm) var(--radius-xl) var(--radius-xl) var(--radius-xl);
      font-size: var(--font-size-base);
    }

    .bubble-ai-large {
      font-size: var(--font-size-md);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-primary);
    }

    /* --- Analysis Report Card Bubble --- */
    .bubble-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: 0;
      overflow: hidden;
      box-shadow: var(--shadow-md);
      max-width: calc(100% - 56px);
    }

    .card-header {
      background: var(--color-bg-secondary);
      padding: 16px 20px;
      border-bottom: 1px solid var(--color-border-light);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-header-icon {
      font-size: 20px;
      line-height: 1;
    }

    .card-header-title {
      font-size: var(--font-size-md);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-primary);
    }

    .card-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Overall Assessment Section */
    .assessment-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section-label {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
      color: var(--color-primary);
      letter-spacing: 0.5px;
    }

    .assessment-text {
      font-size: var(--font-size-md);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-primary);
      line-height: var(--line-height-relaxed);
    }

    /* Health Score Bar */
    .score-bar-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .score-bar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .score-label {
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
    }

    .score-value {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-bold);
      color: var(--health-elevated);
    }

    .score-bar-track {
      width: 100%;
      height: 10px;
      background: var(--color-bg-tertiary);
      border-radius: var(--radius-full);
      overflow: hidden;
    }

    .score-bar-fill {
      height: 100%;
      width: 75%;
      background: linear-gradient(90deg, var(--health-elevated), #F0C040);
      border-radius: var(--radius-full);
      transition: width 0.6s ease;
    }

    /* Key Findings Section */
    .findings-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .finding-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .finding-icon {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-full);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      line-height: 1;
    }

    .finding-icon.warning {
      background: var(--state-warning-bg);
      color: var(--state-warning);
    }

    .finding-icon.success {
      background: var(--state-success-bg);
      color: var(--state-success);
    }

    .finding-icon.info {
      background: var(--state-info-bg);
      color: var(--state-info);
    }

    /* CSS-only icons for findings */
    .icon-triangle {
      width: 0;
      height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-bottom: 12px solid var(--state-warning);
    }

    .icon-check {
      width: 14px;
      height: 10px;
      border-left: 3px solid var(--state-success);
      border-bottom: 3px solid var(--state-success);
      transform: rotate(-45deg);
      margin-top: -2px;
    }

    .icon-bulb {
      width: 12px;
      height: 12px;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      border: 2px solid var(--state-info);
      position: relative;
    }
    .icon-bulb::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      height: 3px;
      background: var(--state-info);
      border-radius: 0 0 2px 2px;
    }

    .finding-text {
      font-size: var(--font-size-base);
      color: var(--color-text-primary);
      line-height: var(--line-height-relaxed);
      flex: 1;
      padding-top: 3px;
    }

    /* Recommendations Section */
    .recommendations-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .recommendation-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 12px 14px;
      background: var(--color-bg-secondary);
      border-radius: var(--radius-md);
    }

    .recommendation-label {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
      color: var(--color-primary);
      white-space: nowrap;
      min-width: 56px;
      padding-top: 1px;
    }

    .recommendation-text {
      font-size: var(--font-size-base);
      color: var(--color-text-primary);
      line-height: var(--line-height-relaxed);
    }

    /* Divider between sections */
    .section-divider {
      height: 1px;
      background: var(--color-border-light);
      width: 100%;
    }

    /* --- AI Closing Bubble --- */
    .bubble-closing {
      font-size: var(--font-size-base);
      color: var(--color-text-secondary);
      line-height: var(--line-height-relaxed);
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    .heart-icon-small {
      display: inline-block;
      flex-shrink: 0;
      width: 16px;
      height: 14px;
      position: relative;
      margin-top: 4px;
    }
    .heart-icon-small::before,
    .heart-icon-small::after {
      content: '';
      position: absolute;
      top: 0;
      width: 9px;
      height: 12px;
      border-radius: 9px 9px 0 0;
      background: var(--color-primary);
    }
    .heart-icon-small::before {
      left: 0;
      transform: rotate(-45deg);
      transform-origin: bottom right;
    }
    .heart-icon-small::after {
      right: 0;
      transform: rotate(45deg);
      transform-origin: bottom left;
    }

    /* --- Input Area --- */
    .input-area {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--color-surface);
      border-top: 1px solid var(--color-border-light);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }

    .input-field {
      flex: 1;
      height: 44px;
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: 0 18px;
      font-size: var(--font-size-base);
      color: var(--color-text-primary);
      outline: none;
      font-family: var(--font-family);
    }

    .input-field::placeholder {
      color: var(--color-text-tertiary);
    }

    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-full);
      background: var(--color-primary);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Send arrow icon via CSS */
    .send-icon {
      width: 20px;
      height: 20px;
      position: relative;
    }
    .send-icon::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 12px;
      height: 12px;
      border-right: 2.5px solid var(--color-text-inverse);
      border-top: 2.5px solid var(--color-text-inverse);
      transform: translate(-30%, -50%) rotate(45deg);
    }
    .send-icon::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 46%;
      width: 16px;
      height: 0;
      border-top: 2.5px solid var(--color-text-inverse);
      transform: translateY(-50%);
    }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>
      <div class="page-container">

        <!-- ===== Top Navigation Bar ===== -->
        <div class="nav-bar">
          <div class="nav-back" data-dom-id="back-home">
            <div class="nav-back-arrow"></div>
          </div>
          <span class="nav-title">AI健康分析</span>
        </div>

        <!-- ===== Chat Area ===== -->
        <div class="chat-area no-scrollbar">

          <!-- User Bubble: Request -->
          <div class="chat-row user">
            <div class="avatar avatar-user">张</div>
            <div class="bubble bubble-user">帮我看看最近的血压情况</div>
          </div>

          <!-- AI Bubble: Greeting -->
          <div class="chat-row">
            <div class="avatar avatar-ai">
              <div class="ai-icon-heart"></div>
            </div>
            <div class="bubble bubble-ai bubble-ai-large">
              张叔叔您好！我来帮您看看最近的血压数据~
            </div>
          </div>

          <!-- AI Bubble: Analysis Report Card -->
          <div class="chat-row">
            <div class="avatar avatar-ai" style="visibility: hidden;">
              <div class="ai-icon-heart"></div>
            </div>
            <div class="bubble-card">

              <!-- Card Header -->
              <div class="card-header">
                <span class="card-header-icon">📊</span>
                <span class="card-header-title">近7天血压分析报告</span>
              </div>

              <!-- Card Body -->
              <div class="card-body">

                <!-- Overall Assessment -->
                <div class="assessment-section">
                  <span class="section-label">整体评价</span>
                  <p class="assessment-text">血压基本平稳，但收缩压偶有偏高</p>

                  <!-- Health Score Bar -->
                  <div class="score-bar-container">
                    <div class="score-bar-header">
                      <span class="score-label">健康指数</span>
                      <span class="score-value">75 / 100</span>
                    </div>
                    <div class="score-bar-track">
                      <div class="score-bar-fill"></div>
                    </div>
                  </div>
                </div>

                <div class="section-divider"></div>

                <!-- Key Findings -->
                <div class="findings-section">
                  <span class="section-label">温馨提示</span>

                  <div class="finding-item">
                    <div class="finding-icon warning">
                      <div class="icon-triangle"></div>
                    </div>
                    <span class="finding-text">最近3天收缩压有轻微上升趋势，建议持续关注</span>
                  </div>

                  <div class="finding-item">
                    <div class="finding-icon success">
                      <div class="icon-check"></div>
                    </div>
                    <span class="finding-text">心率保持在正常范围内，很棒！</span>
                  </div>

                  <div class="finding-item">
                    <div class="finding-icon info">
                      <div class="icon-bulb"></div>
                    </div>
                    <span class="finding-text">建议每天固定时间测量，数据更准确</span>
                  </div>
                </div>

                <div class="section-divider"></div>

                <!-- Recommendations -->
                <div class="recommendations-section">
                  <span class="section-label">健康建议</span>

                  <div class="recommendation-item">
                    <span class="recommendation-label">饮食方面</span>
                    <span class="recommendation-text">减少盐分摄入，多吃蔬菜水果</span>
                  </div>

                  <div class="recommendation-item">
                    <span class="recommendation-label">运动方面</span>
                    <span class="recommendation-text">建议每天散步30分钟</span>
                  </div>

                  <div class="recommendation-item">
                    <span class="recommendation-label">用药方面</span>
                    <span class="recommendation-text">请遵医嘱按时服药</span>
                  </div>
                </div>

              </div>
            </div>
          </div>

          <!-- AI Closing Bubble -->
          <div class="chat-row">
            <div class="avatar avatar-ai">
              <div class="ai-icon-heart"></div>
            </div>
            <div class="bubble bubble-ai">
              <div class="bubble-closing">
                <span class="heart-icon-small"></span>
                <span>以上建议仅供参考，如有不适请及时就医哦~</span>
              </div>
            </div>
          </div>

        </div>

        <!-- ===== Input Area ===== -->
        <div class="input-area">
          <input class="input-field" type="text" placeholder="输入您的问题..." />
          <button class="send-btn">
            <div class="send-icon"></div>
          </button>
        </div>

      </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
