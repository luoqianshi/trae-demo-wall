<section class="stats-page">
  <!-- 背景装饰 -->
  <div class="stats-bg-grid"></div>
  <div class="stats-bg-glow"></div>

  <!-- 标题区 -->
  <div class="stats-header">
    <div class="stats-header-deco left"></div>
    <div class="stats-header-center">
      <div class="stats-sub">CULTURAL CREATIVE DATA ANALYTICS</div>
      <h1 class="stats-title">文创数据统计看板</h1>
      <div class="stats-tags">
        <span class="stats-tag">深色科技国风</span>
        <span class="stats-tag">实时大屏</span>
        <span class="stats-tag">12 月数据</span>
      </div>
    </div>
    <div class="stats-header-deco right"></div>
  </div>

  <!-- 顶部 KPI -->
  <div class="stats-kpis" id="stats-kpis"></div>

  <!-- 主体图表区 -->
  <div class="stats-grid">
    <!-- 销量趋势 -->
    <div class="stats-panel large">
      <div class="panel-head-dark">
        <span class="panel-title-dark">文创销量趋势</span>
        <span class="panel-sub-dark">SALES TREND · 万元</span>
        <div class="panel-legend">
          <span><i style="background:#E8C97A"></i>线上销量</span>
          <span><i style="background:#2E8B7A"></i>线下销量</span>
        </div>
      </div>
      <div id="chart-sales" class="stats-chart"></div>
    </div>

    <!-- 品类占比 -->
    <div class="stats-panel">
      <div class="panel-head-dark">
        <span class="panel-title-dark">品类销量占比</span>
        <span class="panel-sub-dark">CATEGORY SHARE</span>
      </div>
      <div id="chart-category-stats" class="stats-chart"></div>
    </div>

    <!-- 游客访问量 -->
    <div class="stats-panel">
      <div class="panel-head-dark">
        <span class="panel-title-dark">游客访问量</span>
        <span class="panel-sub-dark">VISITORS · 万人次</span>
      </div>
      <div id="chart-visitors" class="stats-chart"></div>
    </div>

    <!-- 区县销量排行 -->
    <div class="stats-panel">
      <div class="panel-head-dark">
        <span class="panel-title-dark">区县销量排行</span>
        <span class="panel-sub-dark">DISTRICT RANK</span>
      </div>
      <div id="chart-rank" class="stats-chart"></div>
    </div>

    <!-- 用户画像 -->
    <div class="stats-panel">
      <div class="panel-head-dark">
        <span class="panel-title-dark">用户年龄画像</span>
        <span class="panel-sub-dark">USER PORTRAIT</span>
      </div>
      <div id="chart-portrait" class="stats-chart"></div>
    </div>

    <!-- 实时订单流 -->
    <div class="stats-panel large">
      <div class="panel-head-dark">
        <span class="panel-title-dark">实时订单流</span>
        <span class="panel-sub-dark">LIVE ORDER STREAM</span>
        <span class="live-dot">● LIVE</span>
      </div>
      <div class="order-stream" id="order-stream"></div>
    </div>
  </div>
</section>
