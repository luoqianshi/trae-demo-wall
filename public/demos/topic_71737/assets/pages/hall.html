<section class="hall-page">
  <!-- 顶部标题区 -->
  <div class="hall-hero">
    <div class="hall-hero-deco"></div>
    <div class="hall-hero-text">
      <div class="hall-sub">DIGITAL HERITAGE EXHIBITION HALL</div>
      <h1 class="hall-title">非遗文化数字展厅</h1>
      <p class="hall-desc">穿越时光的指尖技艺 · 触手可及的非遗之美。拖动展品多角度观赏，点击周边展品了解工艺流变。</p>
    </div>
    <div class="hall-hero-stamp">
      <div class="cn-stamp">非遗<br/>真品</div>
    </div>
  </div>

  <!-- 展品切换 -->
  <div class="hall-tabs" id="hall-tabs"></div>

  <!-- 主体：3D 展柜 + 图集 -->
  <div class="hall-main">
    <!-- 左侧工艺信息 -->
    <div class="hall-side">
      <div class="hall-info cn-card">
        <div class="info-cat" id="info-cat"></div>
        <h2 class="info-name" id="info-name"></h2>
        <div class="info-en" id="info-en"></div>
        <div class="info-meta">
          <span class="info-region" id="info-region"></span>
          <span class="info-divider">·</span>
          <span class="info-tag" id="info-tag"></span>
        </div>
        <p class="info-desc" id="info-desc"></p>

        <div class="info-palette">
          <span class="palette-label">传统配色</span>
          <div class="palette-dots" id="palette-dots"></div>
        </div>
      </div>

      <div class="hall-steps cn-card">
        <div class="steps-head"><span class="section-title" style="font-size:16px">工艺步骤</span></div>
        <ol class="steps-list" id="steps-list"></ol>
      </div>
    </div>

    <!-- 中央 3D 展柜 -->
    <div class="hall-stage">
      <div class="stage-frame">
        <div class="stage-spotlight"></div>
        <div id="three-canvas" class="three-canvas"></div>
        <div class="stage-base"></div>
        <div class="stage-hint">
          <span class="hint-icon">⟲</span>
          <span>拖拽旋转 · 滚轮缩放 · 自动巡展</span>
        </div>
        <div class="stage-corner tl"></div>
        <div class="stage-corner tr"></div>
        <div class="stage-corner bl"></div>
        <div class="stage-corner br"></div>
      </div>
      <div class="stage-ctrl">
        <button class="cn-btn ghost" id="reset-view">重置视角</button>
        <button class="cn-btn gold" id="auto-rotate">自动旋转</button>
      </div>
    </div>

    <!-- 右侧展品列表 -->
    <div class="hall-side">
      <div class="hall-gallery cn-card">
        <div class="gallery-head"><span class="section-title" style="font-size:16px">同期展品</span></div>
        <div class="gallery-grid" id="gallery-grid"></div>
      </div>
      <div class="hall-quote cn-card">
        <div class="quote-mark">"</div>
        <p class="quote-text">纸上得来终觉浅，绝知此事要躬行。每一件非遗珍品，都是匠人半生心血的凝结。</p>
        <div class="quote-from">—— 潍坊非遗保护中心</div>
      </div>
    </div>
  </div>

  <!-- 底部工艺图集（环绕） -->
  <div class="hall-orbit">
    <div class="orbit-head">
      <span class="section-title">工艺图集 · 环绕展示</span>
      <span class="orbit-tip">Hover 查看工艺步骤</span>
    </div>
    <div class="orbit-track" id="orbit-track"></div>
  </div>
</section>
