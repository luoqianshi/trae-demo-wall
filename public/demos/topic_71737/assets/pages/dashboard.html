<section class="dashboard">
  <!-- 大屏标题 -->
  <div class="db-header">
    <div class="db-header-bg"></div>
    <div class="db-title-row">
      <div class="db-side-deco left"></div>
      <div class="db-title-center">
        <div class="db-sub">WEIFANG INTANGIBLE CULTURAL HERITAGE · DATA COCKPIT</div>
        <h1 class="db-title">鸢韵潍风 · 潍坊非遗数字文创可视化大屏</h1>
        <div class="db-tags">
          <span class="db-tag">实时数据</span>
          <span class="db-tag">全域覆盖</span>
          <span class="db-tag">12 区县</span>
          <span class="db-tag">17 项国家级名录</span>
        </div>
      </div>
      <div class="db-side-deco right"></div>
    </div>
  </div>

  <!-- 顶部 KPI -->
  <div class="db-kpis" id="db-kpis"></div>

  <!-- 主体三栏 -->
  <div class="db-main">
    <!-- 左栏 -->
    <div class="db-col left">
      <div class="db-panel">
        <div class="panel-head">
          <span class="panel-title">非遗品类分布</span>
          <span class="panel-sub">CATEGORY</span>
        </div>
        <div id="chart-category" class="chart-box"></div>
      </div>
      <div class="db-panel">
        <div class="panel-head">
          <span class="panel-title">传承人等级构成</span>
          <span class="panel-sub">INHERITOR LEVEL</span>
        </div>
        <div id="chart-level" class="chart-box"></div>
      </div>
    </div>

    <!-- 中间地图 -->
    <div class="db-col center">
      <div class="db-panel map-panel">
        <div class="panel-head">
          <span class="panel-title">潍坊区县非遗热力地图</span>
          <span class="panel-sub">WEIFANG HEATMAP</span>
          <span class="panel-tip" id="map-tip">点击区县查看详情</span>
        </div>
        <div id="chart-map" class="chart-map"></div>
        <div class="map-legend">
          <span class="legend-item"><i style="background:#2E8B7A"></i>稀少</span>
          <span class="legend-item"><i style="background:#C9A14A"></i>适中</span>
          <span class="legend-item"><i style="background:#C8392F"></i>密集</span>
        </div>
      </div>
    </div>

    <!-- 右栏 -->
    <div class="db-col right">
      <div class="db-panel">
        <div class="panel-head">
          <span class="panel-title">各区县非遗数量</span>
          <span class="panel-sub">DISTRICT COUNT</span>
        </div>
        <div id="chart-district" class="chart-box"></div>
      </div>
      <div class="db-panel">
        <div class="panel-head">
          <span class="panel-title">非遗年度增长趋势</span>
          <span class="panel-sub">GROWTH TREND</span>
        </div>
        <div id="chart-trend" class="chart-box"></div>
      </div>
    </div>
  </div>

  <!-- 底部 3D 轮播 -->
  <div class="db-carousel">
    <div class="carousel-head">
      <span class="section-title">热门非遗展品 · 沉浸巡展</span>
      <div class="carousel-ctrl">
        <button class="car-btn" id="car-prev">‹</button>
        <button class="car-btn" id="car-next">›</button>
      </div>
    </div>
    <div class="carousel-stage">
      <div class="carousel-track" id="carousel-track"></div>
    </div>
  </div>

  <!-- 角落祥云装饰 -->
  <svg class="cloud-deco" style="top:80px;left:20px;width:140px" viewBox="0 0 100 60"><path d="M10 40 Q 20 20 40 30 Q 50 15 65 30 Q 80 25 90 40 Q 80 50 65 45 Q 50 55 35 45 Q 20 50 10 40 Z" fill="#C9A14A"/></svg>
  <svg class="cloud-deco" style="bottom:40px;right:20px;width:160px" viewBox="0 0 100 60"><path d="M10 40 Q 20 20 40 30 Q 50 15 65 30 Q 80 25 90 40 Q 80 50 65 45 Q 50 55 35 45 Q 20 50 10 40 Z" fill="#C8392F"/></svg>
</section>
