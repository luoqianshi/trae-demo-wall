<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鸢韵潍风 · 潍坊非遗数字文创可视化平台</title>
  <link rel="stylesheet" href="assets/css/global.css" />
  <!-- Element Plus -->
  <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.4/dist/index.css" />
  <style>
    .page-loading {
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      color: var(--ink-3);
      letter-spacing: 4px;
    }
    .loading-seal {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, var(--vermilion), var(--vermilion-2));
      color: #FFF6E6;
      font-family: var(--font-brush);
      font-size: 38px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 10px;
      transform: rotate(-5deg);
      animation: sealPulse 1.4s ease-in-out infinite;
    }
    @keyframes sealPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(168, 40, 32, 0.5); }
      50% { box-shadow: 0 0 0 14px rgba(168, 40, 32, 0); }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- 顶部导航 -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-seal">鸢</div>
        <div>
          <div class="brand-title">鸢韵潍风</div>
          <div class="brand-sub">WEIFANG INTANGIBLE HERITAGE</div>
        </div>
      </div>

      <nav class="nav-menu">
        <a class="nav-item" data-route="/dashboard" href="#/dashboard">总览大屏</a>
        <a class="nav-item" data-route="/hall" href="#/hall">数字展厅</a>
        <a class="nav-item" data-route="/masters" href="#/masters">匠人档案</a>
        <a class="nav-item" data-route="/travel" href="#/travel">文旅地图</a>
        <a class="nav-item" data-route="/stats" href="#/stats">数据看板</a>
        <a class="nav-item" data-route="/gallery" href="#/gallery">纹样素材库</a>
      </nav>

      <div class="topbar-time" id="topbar-time">--:--:--</div>
    </header>

    <!-- 路由容器 -->
    <main id="page-view" class="page-view"></main>
  </div>

  <!-- 依赖 -->
  <script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus@2.4.4/dist/index.full.min.js"></script>
  <script src="https://unpkg.com/element-plus@2.4.4/dist/locale/zh-cn.min.js"></script>
  <script src="https://unpkg.com/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://unpkg.com/three@0.149.0/build/three.min.js"></script>

  <!-- 业务脚本 -->
  <script src="assets/mock/data.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/router.js"></script>
  <script>
    // Element Plus 初始化
    const { createApp } = Vue;
    const app = createApp({ setup() { return {}; } });
    app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
    app.mount(document.createElement('div'));

    // 启动时钟 + 路由
    WF.startClock(document.getElementById('topbar-time'));
    Router.init();
  </script>
</body>
</html>
