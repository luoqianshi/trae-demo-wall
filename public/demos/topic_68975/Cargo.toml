[package]
name = "offdiff"
version = "0.1.0"
edition = "2021"
description = "A Git diff tool for Office documents that preserves formatting"
license = "MIT"

[lib]
crate-type = ["lib"]

[dependencies]
clap = { version = "4", features = ["derive"] }
zip = "2"
quick-xml = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen"]
