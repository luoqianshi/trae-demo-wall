<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f9fafb">
<title>晨讯一刻 - 15分钟了解天下事</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; width: 100%; }
body {
  font-family: 'Noto Sans SC', sans-serif;
  background: #e5e7eb;
  color: #1f2937;
  -webkit-font-smoothing: antialiased;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
#app { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }

.phone-frame {
  width: 100%;
  max-width: 390px;
  height: 100%;
  max-height: 844px;
  background: #f3f4f6;
  border-radius: 40px;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.phone-notch {
  width: 120px;
  height: 28px;
  background: #111827;
  border-radius: 0 0 18px 18px;
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  z-index: 200;
}

.phone-status-bar {
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  font-size: 13px;
  font-weight: 600;
  color: #111827;
  flex-shrink: 0;
  padding-top: 8px;
}

.phone-content {
  flex: 1;
  overflow: hidden;
  position: relative;
}

/* 滚动条 */
::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, .5); border-radius: 2px; }

/* 页面通用 */
.page { height: 100%; display: flex; flex-direction: column; animation: fadeIn .3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* 底部导航 */
.tab-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: #ffffff;
  border-top: 1px solid #f3f4f6;
  z-index: 100;
  padding-bottom: 8px;
}
.tab-bar-inner {
  display: flex;
  justify-content: space-around;
  align-items: center;
  height: 56px;
}
.tab-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: #9ca3af;
  cursor: pointer;
  transition: color .2s;
  font-size: 11px;
  gap: 3px;
}
.tab-item.active { color: #e94560; }
.tab-item i { font-size: 18px; }

/* 内容区域 */
.content {
  flex: 1;
  overflow-y: auto;
  padding-bottom: 72px;
  padding-top: 8px;
}

/* 头部 */
.page-header { padding: 8px 20px 16px; }
.page-title { font-size: 26px; font-weight: 700; color: #111827; margin-bottom: 4px; }
.page-subtitle { font-size: 13px; color: #6b7280; }

/* 区块 */
.section { padding: 0 20px 24px; }
.section-title { font-size: 15px; font-weight: 600; color: #111827; margin-bottom: 12px; }

/* 热搜卡片 */
.hot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hot-card {
  background: #ffffff;
  border-radius: 14px;
  overflow: hidden;
  cursor: pointer;
  transition: transform .2s, box-shadow .2s;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
}
.hot-card:active { transform: scale(.96); }
.hot-card-img {
  height: 88px;
  overflow: hidden;
  position: relative;
}
.hot-card-blur {
  position: absolute;
  inset: -20px;
  background: inherit;
  filter: blur(8px);
  opacity: .8;
}
.hot-card-img::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, transparent 30%, rgba(0,0,0,.15));
  z-index: 1;
}
.hot-card-text {
  padding: 8px 10px 10px;
  font-size: 12px;
  line-height: 1.5;
  color: #374151;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  font-weight: 500;
}

/* 冷知识 */
.cold-knowledge {
  background: #ffffff;
  border-radius: 14px;
  overflow: hidden;
  cursor: pointer;
  transition: transform .2s, box-shadow .2s;
  display: flex;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
}
.cold-knowledge:active { transform: scale(.98); }
.cold-knowledge-img { width: 88px; height: 88px; flex-shrink: 0; overflow: hidden; position: relative; }
.cold-knowledge-blur {
  position: absolute;
  inset: -15px;
  background: inherit;
  filter: blur(6px);
  opacity: .7;
}
.cold-knowledge-body {
  padding: 10px 12px;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.cold-knowledge-title {
  font-size: 13px;
  font-weight: 600;
  color: #111827;
  margin-bottom: 4px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  line-height: 1.4;
}
.cold-knowledge-desc {
  font-size: 11px;
  color: #6b7280;
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* 分类网格 */
.category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.category-card {
  position: relative;
  height: 132px;
  border-radius: 14px;
  overflow: hidden;
  cursor: pointer;
  transition: transform .2s;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
}
.category-card:active { transform: scale(.96); }
.category-bg {
  position: absolute;
  inset: -25px;
  filter: blur(12px);
  opacity: .85;
}
.category-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, rgba(0,0,0,.1) 0%, rgba(0,0,0,.25) 100%);
}
.category-name {
  font-size: 16px;
  font-weight: 600;
  color: #ffffff;
  text-shadow: 0 2px 8px rgba(0,0,0,.4);
  letter-spacing: 1px;
}

/* 我的页面 */
.stats-card {
  background: #ffffff;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 20px;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
}
.stats-title {
  font-size: 14px;
  color: #374151;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
}
.stats-title i { color: #e94560; }
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}
.stat-box {
  background: #f9fafb;
  border-radius: 12px;
  padding: 12px;
}
.stat-label { font-size: 11px; color: #6b7280; }
.stat-value {
  font-size: 22px;
  font-weight: 700;
  margin-top: 4px;
  color: #111827;
}
.stat-value span { font-size: 12px; font-weight: 400; margin-left: 2px; color: #6b7280; }

.pie-section {
  background: #f9fafb;
  border-radius: 12px;
  padding: 12px;
}
.pie-title {
  font-size: 12px;
  color: #6b7280;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.pie-wrapper { display: flex; align-items: center; gap: 14px; }
.pie-chart { width: 72px; height: 72px; flex-shrink: 0; position: relative; }
.pie-legend { flex: 1; }
.legend-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  margin-bottom: 6px;
  color: #374151;
}
.legend-item:last-child { margin-bottom: 0; }
.legend-left { display: flex; align-items: center; gap: 6px; }
.legend-dot { width: 6px; height: 6px; border-radius: 50%; }
.legend-value { color: #9ca3af; font-size: 10px; }

.menu-item {
  background: #ffffff;
  border-radius: 14px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  transition: background .2s;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
}
.menu-item:active { background: #f9fafb; }
.menu-left { display: flex; align-items: center; gap: 12px; }
.menu-icon { color: #e94560; font-size: 16px; width: 20px; text-align: center; }
.menu-text { font-size: 14px; font-weight: 500; color: #111827; }
.menu-arrow { color: #d1d5db; font-size: 12px; }

/* 播放页 */
.player-page {
  position: absolute;
  inset: 0;
  background: #f9fafb;
  z-index: 150;
  display: flex;
  flex-direction: column;
}
.player-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  padding-top: calc(env(safe-area-inset-top, 0) + 52px);
  flex-shrink: 0;
}
.player-back {
  cursor: pointer;
  color: #4b5563;
  font-size: 16px;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.player-title {
  flex: 1;
  font-size: 13px;
  color: #6b7280;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 500;
}
.player-content {
  flex: 1;
  overflow-y: auto;
  padding: 0 20px;
  padding-bottom: 180px;
}
.article-title {
  font-size: 17px;
  font-weight: 700;
  line-height: 1.5;
  margin-bottom: 14px;
  color: #111827;
}
.article-body {
  font-size: 13px;
  line-height: 1.9;
  color: #4b5563;
  white-space: pre-line;
}

/* 播放器控制 */
.player-controls {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: linear-gradient(to top, #f9fafb, #f9fafbf5, transparent);
  padding: 40px 20px 16px;
  padding-bottom: calc(env(safe-area-inset-bottom, 0) + 16px);
}
.progress-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.progress-time { font-size: 10px; color: #9ca3af; min-width: 34px; }
.progress-bar {
  flex: 1;
  height: 4px;
  background: #e5e7eb;
  border-radius: 2px;
  position: relative;
  cursor: pointer;
}
.progress-fill {
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  background: #e94560;
  border-radius: 2px;
  transition: width .3s;
}
.progress-thumb {
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 10px;
  height: 10px;
  background: #e94560;
  border-radius: 50%;
  box-shadow: 0 2px 6px rgba(233,69,96,.4);
}

.buttons-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 8px;
}
.btn-circle {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #6b7280;
  cursor: pointer;
  transition: transform .2s;
  font-size: 14px;
}
.btn-circle:active { transform: scale(.9); }
.btn-play {
  width: 52px;
  height: 52px;
  background: #e94560;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform .2s;
  font-size: 18px;
  color: #fff;
  box-shadow: 0 4px 12px rgba(233,69,96,.3);
}
.btn-play:active { transform: scale(.92); }

.speed-row {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 14px;
}
.speed-btn {
  padding: 5px 16px;
  border-radius: 16px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all .2s;
  background: #f3f4f6;
  color: #6b7280;
  border: 1px solid transparent;
}
.speed-btn.active {
  background: #fef2f2;
  color: #e94560;
  border-color: #fecaca;
}

.article-category-tag {
  display: inline-block;
  padding: 4px 10px;
  background: #f3f4f6;
  color: #6b7280;
  border-radius: 12px;
  font-size: 11px;
  margin-bottom: 14px;
}

/* 弹窗 */
.modal-mask {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 300;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.modal-content {
  width: 100%;
  background: #ffffff;
  border-radius: 20px 20px 0 0;
  padding: 18px;
  padding-bottom: calc(env(safe-area-inset-bottom, 0) + 18px);
  animation: slideUp .3s ease;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.modal-title { font-size: 15px; font-weight: 600; color: #111827; }
.modal-cancel { font-size: 13px; color: #9ca3af; cursor: pointer; }
.modal-textarea {
  width: 100%;
  height: 108px;
  background: #f9fafb;
  border: 1px solid #f3f4f6;
  border-radius: 10px;
  padding: 12px;
  color: #111827;
  font-size: 13px;
  font-family: inherit;
  resize: none;
  outline: none;
}
.modal-textarea:focus { border-color: #e94560; box-shadow: 0 0 0 3px rgba(233,69,96,.1); }
.modal-textarea::placeholder { color: #9ca3af; }
.modal-btn {
  width: 100%;
  margin-top: 12px;
  padding: 13px;
  background: #e94560;
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: opacity .2s;
  font-family: inherit;
}
.modal-btn:disabled { opacity: .5; cursor: not-allowed; }
.modal-actions { display: flex; gap: 10px; margin-top: 12px; }
.modal-btn-ghost {
  flex: 1;
  padding: 13px;
  background: #f3f4f6;
  color: #4b5563;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  cursor: pointer;
  font-family: inherit;
  font-weight: 500;
}
.modal-btn-primary {
  flex: 1;
  padding: 13px;
  background: #e94560;
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  cursor: pointer;
  font-family: inherit;
  font-weight: 500;
}

/* Toast */
.toast {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(17, 24, 39, .92);
  padding: 18px 26px;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  z-index: 400;
  animation: fadeIn .3s ease;
}
.toast i { font-size: 28px; color: #10b981; }
.toast-text { font-size: 13px; color: #fff; }

/* 后台样式 */
.admin-layout { display: flex; height: 100vh; width: 100vw; background: #f3f4f6; position: fixed; inset: 0; z-index: 500; }
.admin-sidebar {
  width: 200px;
  background: #fff;
  box-shadow: 2px 0 8px rgba(0,0,0,.06);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.admin-sidebar-header { padding: 20px 16px; border-bottom: 1px solid #e5e7eb; }
.admin-sidebar-title { font-size: 16px; font-weight: 600; color: #1f2937; }
.admin-sidebar-sub { font-size: 11px; color: #9ca3af; margin-top: 2px; }
.admin-nav { flex: 1; padding: 12px 0; }
.admin-nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  color: #4b5563;
  cursor: pointer;
  transition: all .2s;
  font-size: 14px;
  border-left: 3px solid transparent;
}
.admin-nav-item:hover { background: #f9fafb; }
.admin-nav-item.active {
  background: #fef2f2;
  color: #e94560;
  border-left-color: #e94560;
  font-weight: 500;
}
.admin-nav-item i { width: 18px; text-align: center; font-size: 14px; }

.admin-main { flex: 1; overflow-y: auto; padding: 24px; }
.admin-page-title { font-size: 20px; font-weight: 600; color: #1f2937; margin-bottom: 6px; }
.admin-page-desc { font-size: 13px; color: #6b7280; margin-bottom: 20px; }
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: #9ca3af;
  font-size: 13px;
}
.badge-gray { background: #f3f4f6; color: #6b7280; }
.section-sub-title {
  font-size: 15px;
  font-weight: 600;
  color: #374151;
  margin-bottom: 12px;
}
.btn-sm-blue {
  background: #eff6ff;
  color: #2563eb;
  border: 1px solid #bfdbfe;
}

.admin-stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}
.admin-stat-card {
  background: #fff;
  border-radius: 12px;
  padding: 20px;
  position: relative;
  cursor: pointer;
  transition: box-shadow .2s;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
}
.admin-stat-card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.08); }
.stat-icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
}
.stat-icon.blue { background: #3b82f6; }
.stat-icon.green { background: #10b981; }
.stat-icon.yellow { background: #f59e0b; }
.stat-icon.red { background: #ef4444; }
.admin-stat-value { font-size: 28px; font-weight: 700; color: #1f2937; }
.admin-stat-label { font-size: 13px; color: #6b7280; margin-top: 2px; }
.badge-dot {
  position: absolute;
  top: 16px;
  right: 16px;
  min-width: 20px;
  height: 20px;
  background: #ef4444;
  color: #fff;
  font-size: 11px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 6px;
}

.quick-section {
  background: #fff;
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
}
.quick-title { font-size: 16px; font-weight: 600; color: #1f2937; margin-bottom: 12px; }
.quick-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px;
  background: #f9fafb;
  border-radius: 8px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: background .2s;
  position: relative;
}
.quick-item:hover { background: #f3f4f6; }
.quick-item:last-child { margin-bottom: 0; }
.quick-item-text { color: #374151; font-size: 14px; }
.quick-item-icon { color: #9ca3af; font-size: 13px; }
.quick-red-dot {
  position: absolute;
  left: 92px;
  top: 50%;
  transform: translateY(-50%);
  width: 8px;
  height: 8px;
  background: #ef4444;
  border-radius: 50%;
}

/* 后台列表 */
.list-item {
  background: #fff;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
}
.list-item-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 10px;
}
.list-item-title {
  font-size: 15px;
  font-weight: 500;
  color: #1f2937;
  line-height: 1.5;
  flex: 1;
  padding-right: 12px;
}
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 500;
}
.badge-green { background: #d1fae5; color: #065f46; }
.badge-blue { background: #dbeafe; color: #1e40af; }
.badge-purple { background: #ede9fe; color: #5b21b6; }
.badge-red { background: #fee2e2; color: #991b1b; }
.badge-yellow { background: #fef3c7; color: #92400e; }

.list-item-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: #6b7280;
  margin-bottom: 8px;
}
.list-item-desc { font-size: 13px; color: #6b7280; line-height: 1.6; }
.source-summary {
  font-size: 13px;
  color: #4b5563;
  line-height: 1.6;
  margin-top: 10px;
  padding: 10px 12px;
  background: #f9fafb;
  border-radius: 8px;
  border-left: 3px solid #e5e7eb;
}
.source-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 10px;
  gap: 12px;
}
.source-time {
  font-size: 12px;

    summary: '华为发布Mate 70系列旗舰手机，搭载全新麒麟芯片和鸿蒙原生系统，引领国产高端手机新潮流',
    content: '【产品发布】\n华为今日在深圳召开新品发布会，正式发布Mate 70系列旗舰手机。本次发布的Mate 70系列包括Mate 70、Mate 70 Pro、Mate 70 Pro+和Mate 70 RS保时捷设计四款机型，起售价分别为4999元、6999元、8999元和12999元。华为常务董事余承东表示，Mate 70系列是华为手机业务回归巅峰的标志性产品，搭载了全新一代麒麟9100芯片和原生鸿蒙操作系统，在性能、影像、通信、续航等方面都实现了跨越式升级，将为用户带来前所未有的智慧体验。\n\n【硬件配置】\nMate 70系列在硬件方面实现全面升级。芯片方面，搭载全新麒麟9100处理器，采用5纳米工艺制程，CPU性能提升30%，GPU性能提升40%，能效比显著改善。屏幕方面，Pro及以上机型配备6.9英寸LTPO OLED屏幕，支持1至120Hz自适应刷新率，峰值亮度达3000尼特。影像方面，搭载可变光圈主摄、超广角和潜望式长焦三摄组合，主摄为5000万像素，支持F1.4至F4.0十档可变光圈，长焦支持100倍数字变焦。续航方面，配备5800mAh大电池，支持100W有线快充和80W无线快充。\n\n【鸿蒙系统】\nMate 70系列首次搭载原生鸿蒙操作系统HarmonyOS NEXT，这是华为完全自主研制的操作系统，不再兼容安卓应用。原生鸿蒙采用了全新的分布式架构和星盾安全架构，系统流畅度提升24%，能效提升20%。应用生态方面，已有超过2万个原生应用上架鸿蒙应用市场，涵盖主流社交、购物、出行、办公等场景。AI能力方面，集成了盘古大模型5.0，支持AI隔空传送、AI通话摘要、AI智慧识屏等创新功能。隐私安全方面，推出了应用权限管理中心，让用户对个人数据有完全掌控权。\n\n【市场影响】\nMate 70系列的发布引发市场强烈关注。发布会上，余承东宣布Mate 70系列将于今晚开启预售，首销日期为7月12日。业内人士分析认为，Mate 70系列的发布将进一步巩固华为在高端手机市场的地位，对苹果、三星等国际品牌形成有力挑战。供应链方面，本次Mate 70系列核心元器件国产化率超过90%，带动国产半导体产业链加速发展。资本市场也给予积极反应，华为产业链相关上市公司股价普遍上涨。对于消费者而言，Mate 70系列提供了更多国产高端选择，将推动整个手机行业的技术创新和服务升级。',

    id: '5', title: '北约峰会在华盛顿召开聚焦全球安全议题',
    summary: '北约峰会在美国华盛顿举行，成员国领导人就全球安全、防务合作、军费开支等议题展开讨论',
    content: '【峰会开幕】\n2026年北大西洋公约组织北约峰会于今日在美国首都华盛顿正式开幕，本次峰会为期三天。来自北约32个成员国的国家元首和政府首脑齐聚华盛顿，就全球安全形势、防务合作、军费开支、乌克兰局势等重大议题展开深入讨论。北约秘书长在开幕式上致辞表示，当前全球安全面临前所未有的挑战，北约需要进一步强化集体防御能力，加强成员国之间的团结协作。本次峰会是北约成立77周年之际召开的一次重要会议，受到国际社会广泛关注。\n\n【主要议题】\n本次峰会议程丰富，聚焦多个重要议题。一是乌克兰局势，峰会讨论了对乌克兰的持续支持方案，包括军事援助、情报共享和战后重建等问题。二是防务投资，峰会敦促各成员国加快实现军费开支占GDP 2%的目标，并讨论了提升国防工业产能的具体措施。三是印太安全，日本、韩国、澳大利亚、新西兰等印太伙伴国再次受邀参会，讨论了北约在印太地区的作用。四是新兴技术，峰会讨论了人工智能、量子计算、太空等新兴技术对安全的影响。五是气候变化对安全的影响。\n\n【峰会成果】\n本次峰会取得多项重要成果。一是通过了《华盛顿峰会宣言》，重申了北约的核心理念和战略目标。二是各成员国就军费开支达成新的共识，超过23个国家已实现军费占GDP 2%的目标，比2024年大幅增加。三是成立了北约-乌克兰联合分析中心，加强对乌克兰的支持。四是启动了北约印太伙伴计划，深化与印太伙伴国的合作。五是发布了新兴技术与安全战略框架，明确了在人工智能、量子、网络等领域的应对策略。这些成果显示出北约正在适应新的全球安全环境。\n\n【国际反响】\n本次北约峰会引发国际社会广泛关注和不同反应。俄罗斯方面对峰会成果表示强烈不满，认为北约的扩张政策是导致欧洲安全局势恶化的根本原因。中国外交部发言人在例行记者会上表示，希望北约恪守其防御性组织性质，不要将手伸向亚太地区，不要挑动阵营对抗。联合国秘书长呼吁各方通过对话协商解决分歧，维护全球战略稳定。国际问题专家指出，本次峰会显示出北约正在转型为一个更具全球视野的安全组织，但其扩张行为也可能加剧大国之间的紧张关系，给全球安全治理带来新的挑战。',

    id: '6', title: '国产阿尔茨海默症新药获批上市',
    summary: '国产阿尔茨海默症新药获国家药监局批准上市，临床显示可显著延缓病程进展',
    content: '【新药获批】\n国家药品监督管理局今日正式批准国产1类创新药甘露特钠二代产品GV-971B上市，用于治疗轻度至中度阿尔茨海默症。这是继2019年首款国产阿尔茨海默症药物甘露特钠胶囊上市后，中国在该领域的又一重大突破。新药由上海药物研究所、绿谷制药联合开发，是全国首个具有全新作用机制和明确疾病修饰作用的阿尔茨海默症治疗药物。国家药监局相关负责人表示，GV-971B的获批上市，将为我国千万阿尔茨海默症患者带来新的治疗希望。\n\n【作用机制】\nGV-971B采用了全新的多靶点作用机制。传统阿尔茨海默症药物主要针对症状进行改善，而GV-971B则通过调控肠道菌群，减少特定代谢产物的产生，进而降低神经炎症，从根本上延缓疾病进展。临床前研究显示，GV-971B能够显著改善阿尔茨海默症模型小鼠的认知功能，减少大脑中淀粉样蛋白沉积和Tau蛋白异常磷酸化。这种通过肠脑轴治疗神经退行性疾病的思路，在国际上属于首创，为阿尔茨海默症治疗开辟了全新路径，相关研究成果已发表于国际顶级期刊《细胞》。\n\n【临床数据】\nGV-971B的临床试验数据令人振奋。在为期52周的III期临床试验中，共入组818例轻中度阿尔茨海默症患者。结果显示，用药组患者的认知功能评分较基线改善1.5分，对照组则下降2.8分，两组差异具有统计学意义。更重要的是，GV-971B在用药24周后即显示出显著的疾病修饰作用，能够延缓病程进展达40%。在安全性方面，GV-971B不良反应发生率与安慰剂组相当，主要不良反应为轻度腹泻和恶心，多数可自行缓解，整体安全性良好。\n\n【患者福音】\n阿尔茨海默症是老年人最常见的神经退行性疾病，全球患者超过5500万，中国患者约1500万，给患者家庭和社会带来沉重负担。GV-971B的上市，将为广大患者带来新的希望。专家表示，新药将于下个月正式进入全国各大医院和药店，并已纳入国家医保目录谈判程序，有望让更多患者用得起、用得上。同时，研发团队正在开展针对重度阿尔茨海默症和早期干预的扩展临床试验，并探索GV-971B在帕金森病、血管性痴呆等其他神经退行性疾病中的应用潜力。中国阿尔茨海默症协会呼吁，社会应加强对老年痴呆的科学认知，做到早发现、早诊断、早治疗。',

    duration: 210, publishDate: '2026-07-03'
  },

    id: '7', title: 'A股半年报业绩密集披露周期开启',
    summary: '沪深两市上市公司半年报陆续披露，超六成企业业绩预增，新质生产力板块表现亮眼',
    content: '【披露概况】\n进入7月，沪深两市2026年上市公司半年报披露工作正式启动。根据交易所披露的预约时间表，截至7月底，将有超过2000家上市公司发布半年报或业绩预告。从已披露的业绩预告来看，A股上市公司整体表现良好，预喜比例超过六成，其中预增公司占比达45%，扭亏公司占比8%，略增公司占比10%。专家分析认为，随着宏观经济持续向好，企业盈利能力稳步提升，A股半年报有望交出一份令人满意的答卷，为后市行情奠定坚实基础。\n\n【行业表现】\n从行业来看，上半年表现最为亮眼的几个板块包括：一是人工智能产业链，受益于AI应用加速落地，相关上市公司业绩普遍大增，其中算力芯片、服务器、光模块等细分领域业绩预增幅度普遍超过100%。二是新能源板块，光伏、储能、新能源汽车等子行业景气度持续回升，多家龙头企业业绩预告大幅增长。三是高端制造板块，工业母机、半导体设备、机器人等领域国产替代加速，业绩表现强劲。四是消费板块，随着居民消费信心恢复，食品饮料、家电、零售等行业业绩稳步增长。相比之下，房地产、传统基建等行业业绩仍面临一定压力。\n\n【市场影响】\n半年报业绩对A股市场产生重要影响。从历史经验看，半年报披露期往往是市场行情分化的重要节点，业绩超预期的个股通常表现强势，业绩不及预期的个股则面临调整压力。从当前市场表现看，资金已经开始围绕业绩主线进行布局，业绩预增股普遍受到资金追捧。同时，半年报也为机构投资者调整持仓结构提供了重要参考，预计业绩确定性较强的优质成长股将获得更多配置。分析师建议，投资者在关注业绩的同时，也要关注公司的估值水平、行业地位、成长性等多重因素。\n\n【投资建议】\n面对半年报披露期，机构给出了相应的投资建议。一是重点关注业绩超预期且估值合理的优质标的，特别是人工智能、新能源、高端制造等高景气赛道的龙头企业。二是关注业绩拐点出现的行业，如消费、医药等经历了较长时间调整的板块，业绩改善迹象明显。三是规避业绩持续亏损、估值过高的题材股，控制投资风险。四是坚持长期投资、价值投资理念，避免短期炒作。监管层也提醒投资者，要理性看待半年报业绩，关注公司基本面和长期价值，防范概念炒作和跟风投资带来的风险。预计随着半年报披露推进，A股市场将呈现结构性机会。',

    id: '8', title: '每日冷知识：肠道菌群影响你的情绪',
    summary: '科学研究发现肠道菌群与人类情绪密切相关，被称为第二大脑的肠道究竟有多神奇',
    content: '【第二大脑】\n你知道吗？人体肠道内生活着数以万亿计的微生物，它们的总数量约为人体细胞总数的1.3倍，总重量可达1.5至2公斤。这些微生物构成了复杂的肠道菌群，被称为人类的第二大脑。之所以有这个称呼，是因为肠道拥有自己独立的神经系统，称为肠神经系统，包含约5亿个神经元，比脊髓中的神经元还要多。更令人惊讶的是，科学家发现肠道菌群与人类情绪、行为、认知之间存在着密切联系，这种联系被称为肠脑轴。这一发现正在颠覆我们对人体和健康的传统认知。\n\n【肠脑轴】\n肠脑轴是肠道与大脑之间双向交流的通道，涉及神经、内分泌、免疫等多个系统。肠道菌群通过多种方式影响大脑。一是通过迷走神经直接向大脑传递信号，迷走神经是连接肠道和大脑的主要神经通路。二是产生神经递质，肠道菌群可以产生人体90%以上的血清素、50%以上的多巴胺和GABA等神经递质，这些物质直接影响我们的情绪和认知。三是产生短链脂肪酸等代谢产物，这些物质可以通过血液循环进入大脑，影响神经元的生长和功能。四是影响免疫系统，肠道菌群失调会引发炎症反应，进而影响大脑功能。\n\n【情绪影响】\n越来越多的研究表明，肠道菌群与多种精神和神经系统疾病密切相关。在动物实验中，将抑郁症患者的肠道菌群移植到无菌小鼠体内，小鼠会表现出抑郁样行为。相反，将健康人的肠道菌群移植后，行为会恢复正常。焦虑症、自闭症、帕金森病、阿尔茨海默症等疾病患者，其肠道菌群组成与健康人存在显著差异。一项针对大学生的研究发现，长期处于压力状态的学生，其肠道菌群多样性显著降低。这些发现说明，肠道菌群可能是影响我们情绪和心理状态的重要因素，调整肠道菌群有望成为治疗精神疾病的新方向。\n\n【如何养好菌群】\n既然肠道菌群如此重要，我们该如何养护它呢？一是均衡饮食，多吃富含膳食纤维的食物，如蔬菜、水果、全谷物、豆类等，这些是益生菌的食物。二是适当补充益生菌，可以食用酸奶、泡菜、纳豆等发酵食品，或服用益生菌制剂。三是避免滥用抗生素，抗生素会无差别杀灭肠道菌群，破坏菌群平衡。四是规律作息，保证充足睡眠，减少压力，这些都有助于维持菌群健康。五是适度运动，运动可以增加肠道菌群多样性。六是减少高糖、高脂、加工食品的摄入，这些食物会促进有害菌生长。养护好肠道菌群，不仅有利于消化健康，还可能让你拥有好心情。',

    duration: 220, publishDate: '2026-07-03'

    id: '9', title: '2026年618大促圆满收官战报出炉',
    summary: '各大电商平台公布618大促战报，整体销售额同比增长12%，国货品牌表现亮眼',
    content: '【战报概况】\n2026年618年中大促于6月18日24时圆满收官。据各大电商平台陆续公布的战报显示，今年618期间，全国网络零售总额达到1.58万亿元，同比增长12.3%，增速较去年同期提升2.1个百分点。其中，实物商品网上零售额占比约82%，服务类消费占比稳步提升。今年618呈现出品质化、智能化、绿色化消费趋势明显，国货品牌强势崛起，下沉市场释放巨大潜力等亮点。商务部相关负责人表示，618大促的亮眼表现，反映出中国消费市场持续回暖、消费信心不断增强的良好态势。\n\n【平台表现】\n各大电商平台表现可圈可点。天猫618期间，成交额突破1万亿元，同比增长13.5%，超过270个品牌成交额破亿，其中国货品牌占比超过六成。京东累计下单金额超过4500亿元，同比增长10.8%，在家电、数码、家居等品类表现强劲。抖音电商直播成交额同比增长35%，成为增长最快的渠道。拼多多通过百亿补贴，吸引了大量下沉市场用户，客单价同比提升18%。值得关注的是，跨境电商也表现亮眼，天猫国际、京东国际等平台进口商品销售额同比增长超过25%，反映出中国消费者对高品质进口商品的需求持续旺盛。\n\n【消费趋势】\n今年618消费市场呈现几个鲜明趋势。一是AI驱动消费升级，AI手机、AI PC、AI家电、智能家居等AI相关产品销售额同比增长超过60%，成为最大亮点。二是绿色消费深入人心，新能源汽车、节能家电、环保家居等绿色产品销售额大幅增长。三是国货品牌强势崛起，华为、小米、比亚迪、李宁、安踏等国货品牌在多个品类中销量领先。四是体验式消费兴起，旅游、餐饮、文娱等服务消费增速明显高于实物商品。五是银发经济崭露头角，针对老年人的智能健康设备、适老化产品销量大增。六是下沉市场爆发，三线及以下城市订单量占比超过40%。\n\n【物流保障】\n为保障618大促期间的物流服务，各大电商平台和物流企业提前进行了充分部署。菜鸟网络在全国部署了超过20个智能物流园区，投入超过1000台无人配送车和500架配送无人机，实现了重点城市当日达和次日达。京东物流通过亚洲一号智能仓群，将订单处理效率提升了30%。抖音电商与多家物流伙伴合作，确保直播带货商品的快速配送。国家邮政局数据显示，618期间全国快递业务量超过150亿件，同比增长15%。同时，各大平台推出了价保、极速退款、上门退换等升级服务，进一步提升消费者体验，整体投诉率较去年同期下降20%。',

    id: '10', title: '暑期心理健康指南：科学调节远离焦虑',
    summary: '心理专家支招，帮助学生和家长科学应对暑期心理问题，度过健康充实假期',
    content: '【暑期心理】\n进入7月，全国大中小学陆续开启暑假模式。然而，漫长的暑期并不总是轻松愉快，对许多学生和家长来说，反而可能成为心理问题的高发期。心理门诊数据显示，每年暑假期间，前来咨询的学生数量较平时增加约30%。常见的问题包括：作息紊乱导致的生物钟失调，沉迷电子产品引发的注意力下降，缺乏社交活动带来的孤独感，亲子冲突增加导致的家庭关系紧张，以及对新学期的焦虑和担忧。心理专家提醒，暑期心理健康同样重要，需要家长和孩子共同关注，科学调节。\n\n【常见问题】\n暑期学生常见的心理问题主要有几类。一是无聊与空虚感，离开了学校规律的作息和丰富的活动，不少学生会感到无所事事、缺乏目标。二是网络成瘾问题，没有学习压力，很多学生长时间沉迷于游戏、短视频，影响身心健康。三是亲子关系紧张，假期中亲子相处时间增加，由于作息、学习、家务等问题容易引发矛盾冲突。四是社交退缩，部分学生因缺乏社交活动而变得孤僻。五是升学焦虑，对即将升学的学生而言，假期反而成为另一种压力。六是情绪波动，部分学生出现烦躁、易怒、低落等情绪问题。家长要细心观察，及时发现问题。\n\n【调节建议】\n心理专家给出了暑期心理调节的具体建议。一是制定合理的暑期计划，平衡学习、娱乐、运动、社交等活动，让生活有规律有目标。二是培养兴趣爱好，利用假期尝试新事物，如阅读、绘画、音乐、运动等，丰富精神世界。三是控制电子产品使用时间，建议每天不超过2小时，可通过设置使用时长、亲子约定等方式管理。四是保持适度社交，多与同学朋友线下见面，参加夏令营、社区活动等。五是分担家务劳动，培养责任感和生活能力。六是规律作息，保证充足睡眠。家长要以身作则，多陪伴孩子，多倾听孩子想法，避免过度干预和指责。\n\n【家长指南】\n家长在暑期心理健康中扮演关键角色。首先，要建立平等的亲子沟通模式，多倾听少说教，尊重孩子的想法和选择。其次，要给孩子适度的自主空间，不要把假期排满各种补习班，让孩子有时间发呆、玩耍、探索兴趣。第三，要营造温馨和谐的家庭氛围，避免在孩子面前争吵，多组织家庭活动，增进亲子感情。第四，家长自身也要注意情绪管理，避免将工作压力转嫁给孩子。第五，如果发现孩子出现持续的情绪问题、行为异常，应及时寻求专业心理帮助。心理专家强调，暑期是孩子成长的黄金期，家长要陪伴孩子度过一个健康、快乐、充实的假期，让身心都得到充分休息和滋养。',

    summary: '今日A股市场全线上涨，上证指数重回3300点，人工智能、半导体等科技板块表现强势',
    content: '【市场概况】\n今日A股市场迎来强势上涨，三大指数集体走强。截至收盘，上证指数上涨1.78%，报收3318点，重回3300点整数关口；深证成指上涨2.45%，报收11250点；创业板指上涨3.12%，报收2315点，领涨主要指数。两市成交额达到11250亿元，较前一交易日明显放量，连续第8个交易日突破万亿。北向资金全天净买入超过120亿元，创近两个月新高。市场情绪显著回暖，上涨个股数量超过4200只，下跌个股不足1000只，涨停个股达到85只，市场赚钱效应明显提升，投资者信心得到提振。\n\n【板块热点】\n从板块表现来看，科技板块今日领涨市场。人工智能板块涨幅超过5%，多只个股涨停，AI算力、AI应用、大模型等细分方向全面走强。半导体板块涨幅超过4%，芯片设计、半导体设备、封装测试等子板块表现亮眼，国产替代逻辑持续强化。数字经济板块也有不错表现，数据要素、数字货币、信创等方向涨幅居前。新能源板块同样表现强势，光伏、储能、新能源车等细分赛道全线走强。相比之下，银行、保险等大金融板块表现相对平淡，涨幅落后于大盘。消费板块整体平稳，食品饮料、医药生物等防御性板块涨幅较小。\n\n【利好因素】\n市场分析人士认为，今日股市大涨主要受多重利好因素共同推动。一是宏观经济数据好于预期，最新公布的上半年GDP同比增长5.3%，超出市场预期，显示经济复苏势头良好。二是政策面持续释放积极信号，新质生产力培育、科技创新等领域政策不断加码。三是外资持续流入，北向资金近期持续净买入，反映出外资对A股市场的长期看好。四是半年报业绩预期向好，多家上市公司业绩预增，提振市场信心。五是技术面突破关键点位，上证指数突破3300点压力位，引发技术性买盘。六是流动性合理充裕，央行适度宽松的货币政策为市场提供支撑。\n\n【后市展望】\n对于后市走向，机构观点普遍偏向乐观。多数券商认为，随着经济持续复苏、政策不断加码和半年报业绩预期向好，A股市场已经具备中期上涨基础，后续有望迎来一轮修复性行情。配置方向上，建议重点关注几个方向：一是高景气成长赛道，包括人工智能、半导体、数字经济、新能源等；二是受益于经济复苏的顺周期板块，如化工、有色、机械等；三是估值较低的蓝筹白马股，具备较高安全边际；四是消费板块，受益于消费信心恢复和政策刺激。同时提醒投资者，市场波动难以避免，应保持理性投资心态，做好风险控制，避免盲目追涨杀跌。',

    id: '12', title: '人民币汇率升至6.8创年内新高',
    summary: '人民币对美元汇率持续走强，在岸和离岸汇率双双升破6.8关口，跨境资金流入明显',
    content: '【汇率走势】\n今日人民币对美元汇率继续走强，在岸人民币对美元汇率开盘即升破6.80关口，最高升至6.78附近，创下年内新高。离岸人民币对美元汇率同样表现强势，一度升破6.79关口。与此同时，美元指数则持续走弱，跌至97附近，创下近半年新低。人民币汇率中间价也连续多个交易日上调，今日中间价报6.8056，较前一交易日上调156个基点。市场人士普遍认为，人民币汇率短期有望继续保持强势走势，年内有望向6.70关口发起挑战。\n\n【支撑因素】\n人民币汇率持续走强背后有多重支撑因素。首先是中国经济基本面持续向好，上半年GDP同比增长5.3%，多项经济指标稳步回升，市场对中国经济复苏的信心不断增强。其次是中美利差收窄预期增强，随着美联储7月降息预期升温，美元指数承压下行，人民币资产吸引力提升。第三是外资持续流入中国市场，近期北向资金净买入额明显增加，6月外资增持人民币债券超过800亿元，反映外资看好人民币资产。第四是贸易顺差保持高位，中国出口保持较强韧性，经常账户维持顺差格局。第五是人民币国际化进程加快，越来越多国家将人民币纳入外汇储备。\n\n【市场影响】\n人民币汇率升值对市场有多方面积极影响。首先，有利于提升人民币资产吸引力，吸引更多外资流入A股和债券市场，为资本市场带来增量资金。其次，有助于降低进口成本，对于依赖进口原材料、能源的行业形成利好，如航空、造纸、炼油等。第三，有利于缓解输入性通胀压力，稳定国内物价水平。第四，提升人民币国际购买力，对于出国留学、旅游、海淘等人群是好消息，可降低相关成本。不过，对于出口企业来说，人民币升值可能在一定程度上削弱出口竞争力，需要通过汇率避险工具管理风险，加快产品升级提升附加值。\n\n【走势展望】\n展望未来人民币汇率走势，专家普遍认为，人民币汇率有望在合理均衡水平上保持基本稳定，并具备一定升值空间，但大幅升值的可能性不大。从长期来看，人民币汇率走势主要取决于中国经济基本面和美元走势。随着中国经济持续复苏和高质量发展不断推进，人民币汇率有望保持稳中有升的态势。同时，央行也有丰富的政策工具来维护外汇市场平稳运行，包括外汇存款准备金率、外汇风险准备金率、逆周期因子等，人民币汇率不会出现大起大落。对于普通投资者来说，不必过度关注短期汇率波动，应根据自身需求合理安排外汇资产，做好资产配置。',

  {
    id: '13', title: '中国空间站迎来首批商业载荷入驻',
    summary: '中国空间站首次迎来商业载荷，多家民营企业科学实验项目成功入驻天宫',
    content: '【载荷入驻】\n中国载人航天工程办公室今日宣布，中国空间站天宫迎来首批商业载荷正式入驻。搭载于天舟八号货运飞船的多个商业科学实验项目，已成功转运至问天实验舱和梦天实验舱，标志着中国空间站正式开启商业化运营新阶段。本次入驻的商业载荷共计12项，涉及生物医药、新材料、流体物理、基础物理等多个领域，来自国内8家民营企业和科研机构。这是中国空间站建成后首次面向商业用户开放，是中国航天商业化进程的重要里程碑，为民营企业利用太空资源开展科研创新开辟了新通道。\n\n【项目详情】\n本次入驻的商业载荷涵盖多个前沿领域。在生物医药方面，包括蛋白质结晶生长实验、干细胞空间培养实验、微生物空间变异实验等项目，旨在利用微重力环境开发新药和新材料。在新材料方面，包括合金空间凝固实验、半导体晶体空间生长实验等，有望突破地面制备的技术瓶颈。在流体物理方面，包括微重力下流体行为研究、沸腾传热实验等。在基础物理方面，包括冷原子物理实验、量子引力探测实验等。这些实验项目均经过严格的安全性评估和科学价值评审，预计将在轨运行3至6个月，所产生的科学数据将共享给相关企业和研究机构。\n\n【商业模式】\n中国空间站商业运营采取多种合作模式。一是载荷搭载服务，企业可以购买空间站的载荷位置和资源，开展自己的实验项目。二是实验代工服务，企业提出实验需求，由专业机构代为设计和实施。三是数据共享服务，企业可以获取空间站相关科学数据用于研发。四是品牌合作，企业可与载人航天工程办公室开展品牌联合推广。本次商业载荷的入驻费用在数百万元至数千万元不等，远低于国际空间站的同类服务价格，显示出较强的市场竞争力。中国载人航天工程办公室表示，未来将进一步完善商业运营机制，吸引更多民营企业参与空间站建设与应用。\n\n【深远意义】\n中国空间站开启商业化运营具有深远意义。首先，标志着中国航天从国家主导向国家与市场协同转变，将极大激发航天产业的市场活力。其次，为民营企业提供了独特的太空实验平台，有望催生一批突破性科技成果和商业应用。第三，商业收入的增加有助于分担空间站运营成本，提升空间站的可持续运营能力。第四，将带动航天上下游产业链发展，包括航天器制造、空间科学仪器、太空生物技术、太空材料等。第五，提升中国在国际航天市场的竞争力，为未来参与国际空间商业合作奠定基础。专家预测，未来5年中国空间站商业市场规模有望超过100亿元，将培育一批太空经济新业态。',
    category: '科技', source: sources[4], status: 'approved',

    id: '14', title: '中国量子计算取得新突破超导芯片相干时间提升5倍',
    summary: '中国科研团队成功研制新一代超导量子计算芯片，相干时间提升5倍，纠错能力大幅增强',
    content: '【重大突破】\n中国科学技术大学联合国内多家科研机构，近日在国际顶级学术期刊《自然》上发表重要论文，宣布成功研制出新一代超导量子计算芯片祖冲之四号。这是中国科学家继祖冲之三号之后，在超导量子计算领域取得的又一重大突破。新一代芯片在量子比特相干时间、操控保真度、纠错能力等关键技术指标上均实现大幅提升，特别是相干时间较上代提升5倍，达到1毫秒级别，为未来实现容错量子计算奠定了坚实基础。这一成果标志着中国在超导量子计算领域继续保持国际领先地位。\n\n【技术详情】\n祖冲之四号芯片在多个方面实现技术突破。在比特设计方面，采用了全新的可调耦合比特架构，有效降低了比特之间的串扰。在材料工艺方面，使用了新型超导材料和改进的制备工艺，将量子比特相干时间提升至1.2毫秒，是上代产品的5倍。在操控精度方面，单比特门保真度达到99.97%，双比特门保真度达到99.7%，均刷新了世界纪录。在纠错方面，首次在实验上实现了距离为7的表面码纠错，纠错后的逻辑比特保真度高于物理比特，跨过了纠错盈亏平衡点。在规模方面，芯片集成了504个物理量子比特，可用于大规模纠错实验。\n\n【应用前景】\n新一代量子芯片的成功研制，为量子计算的实际应用打开了新的大门。在密码学领域，量子计算可以破解传统的加密算法，同时也能构建更安全的量子通信系统，对国家安全具有重要意义。在药物研发领域，量子计算可以精确模拟分子结构和化学反应，大幅加速新药研发进程，缩短研发周期。在金融领域，量子计算可用于风险分析、投资组合优化、高频交易等，提高金融市场效率。在材料科学领域，可模拟新材料性质，加速新材料发现。在人工智能领域，量子机器学习有望带来全新的算法突破。不过，专家也指出，要实现通用量子计算，仍需在纠错、扩展性等方面持续突破。\n\n【国际竞争】\n量子计算是全球科技竞争的战略高地，中美欧等都在加大投入。美国谷歌、IBM、微软等科技巨头持续投入量子计算研发，谷歌发布的Willow芯片也实现了纠错盈亏平衡。欧盟正在实施量子旗舰计划，日本、韩国等也在加速布局。中国将量子信息写入国家十四五规划，作为新质生产力的重要方向。中国科学技术大学、清华大学、中科院等科研机构，以及本源量子、国盾量子等企业，已形成较为完整的量子科技产业链。专家认为，量子计算是下一代信息技术的核心领域，谁能率先实现实用化量子计算，谁就能在未来科技竞争中占据制高点，中国应继续加大研发投入和人才培养。',

    id: '15', title: '2026年全国高考成绩正式公布',
    summary: '2026年全国高考成绩正式放榜，多省份一本分数线出炉，志愿填报系统同步开启',
    content: '【成绩放榜】\n2026年全国高考成绩今日正式放榜。从今日起，全国31个省、自治区、直辖市将陆续公布考生成绩和各批次录取控制分数线。考生可通过各省教育考试院官方网站、官方微信公众号、短信查询等多种方式查询成绩。从已公布的省份来看，今年各地分数线与去年基本持平，部分省份略有波动。其中，北京理科本科线490分，文科本科线510分；江苏物理类本科线465分，历史类本科线485分；浙江一段线525分；河南理科本科线485分，文科本科线505分。整体来看，今年高考试题难度适中，区分度较好。\n\n【志愿填报】\n随着成绩公布，志愿填报工作也同步启动。教育部提醒考生，志愿填报是高考录取的重要环节，需要认真对待。一是要充分了解招生政策，包括录取批次、投档规则、加分政策等。二是要科学定位，根据成绩排名合理选择院校层次。三是要查阅院校招生章程，了解专业要求、培养方案、收费标准等。四是要综合考虑专业前景、个人兴趣、地域偏好等因素。五是要拉开志愿梯度，形成冲稳保的合理结构。六是要注意特殊类型招生要求，如体检、面试、单科成绩等。教育部阳光高考平台提供了丰富的志愿填报指导资源，考生可参考使用。\n\n【新高考改革】\n2026年是新高考改革全面深化的一年，全国29个省份已实施新高考模式，包括3+3和3+1+2两种选科模式。新高考更加注重学生综合素质评价，选考科目组合更加灵活多样。今年，部分省份对选考科目要求进行了优化，强化了物理、化学等基础学科的地位，理工类专业普遍要求选考物理和化学。这一调整旨在引导学生科学选科，更好地对接高校专业培养和未来职业发展。同时，强基计划、综合评价招生等多元录取模式持续推进，为有特长的学生提供了更多升学通道。教育部强调，新高考改革将进一步完善，更加注重立德树人和五育并举。\n\n【温馨提示】\n针对高考成绩公布后的关键时期，教育专家给出几点建议。一是理性看待成绩，无论结果如何，都要保持平和心态，成绩不理想的同学可通过征集志愿、复读等方式继续追求梦想。二是警惕招生诈骗，不法分子常利用考生和家长焦急心理进行诈骗，要认准官方渠道，不要轻信内部指标、保过等承诺。三是关注心理健康，部分考生可能出现焦虑、抑郁等情绪问题，家长要给予理解和支持，必要时寻求专业帮助。四是合理规划假期，可以利用假期学习新技能、参加社会实践、锻炼身体。五是提前了解大学生活，为即将到来的大学学习生活做好准备。祝愿每位考生都能进入理想的大学，开启人生新篇章。',

    id: '16', title: '教育部发布暑期学生安全提示',
    summary: '教育部发布暑期学生安全提示，提醒家长和学生注意防溺水、交通安全、网络安全等',
    content: '【安全提示】\n随着暑假全面开启，教育部今日发布《关于做好2026年暑期学生安全工作的通知》，提醒广大家长和学生注意暑期安全。通知指出，暑期是学生安全事故的高发期，各地教育部门和学校要高度重视，通过多种形式开展安全教育，提醒家长履行监护责任，引导学生增强安全意识。通知重点强调了防溺水、交通安全、食品安全、网络安全、消防安全、旅行安全等六个方面的注意事项，呼吁全社会共同为学生暑期安全保驾护航。\n\n【防溺水重点】\n防溺水是暑期学生安全的重中之重。据统计，溺水是导致中小学生意外死亡的第一大原因，每年暑期都有溺水事故发生。教育部提醒，学生要做到六不：不私自下水游泳，不擅自与他人结伴游泳，不在无家长或教师带领的情况下游泳，不到无安全设施、无救援人员的水域游泳，不到不熟悉的水域游泳，不熟悉水性的学生不擅自下水施救。家长要做到四知道：知道孩子去哪里、知道孩子和谁去、知道孩子去做什么、知道孩子何时回来。各地要加强危险水域排查，设置警示标志，安排巡查人员，严防溺水事故。\n\n【多方面安全】\n除防溺水外，暑期学生安全还涉及多个方面。交通安全方面，提醒学生遵守交通规则，未满12周岁不骑自行车上路，未满16周岁不骑电动车上路，乘车要系好安全带，不乘坐非法营运车辆。食品安全方面，注意饮食卫生，不吃三无食品，预防食物中毒和肠道传染病。网络安全方面，合理安排上网时间，不沉迷网络游戏，防范网络诈骗，不轻信陌生人，不泄露个人信息。消防安全方面，注意用电用气安全，不玩火，掌握基本消防知识。旅行安全方面，外出旅行要告知家长，结伴而行，注意天气和地质灾害预警。心理安全方面，家长要关注孩子情绪变化，及时沟通交流。\n\n【多方联动】\n暑期学生安全需要家庭、学校、社会多方联动。家长是学生安全的第一责任人，要切实履行监护责任，加强对孩子的安全教育和管理，特别是对低龄儿童和留守儿童要给予更多关注。学校要在放假前开展一次集中安全教育，发放安全告知书，建立暑期安全跟踪机制。社区要组织开展丰富多彩的暑期活动，为学生提供安全的去处。相关部门要加强对网吧、KTV、游泳馆、游乐场等场所的监管，及时消除安全隐患。媒体要加大安全宣传力度，营造全社会关心学生安全的良好氛围。专家呼吁，全社会共同努力，让每一个孩子都能度过一个安全、健康、快乐的暑假。',

    content: '【产品发布】\n苹果公司今日在上海举办特别活动，正式发布第二代Vision Pro混合现实头显国行版。新一代产品在外观设计、性能配置、佩戴体验等方面都有明显提升，而起售价则从第一代的29999元下调至20999元，降幅接近30%。苹果CEO蒂姆·库克通过视频致辞表示，Vision Pro 2代表了苹果对空间计算未来的持续投入，更亲民的价格将让更多中国用户有机会体验到空间计算的魅力。产品将于7月12日开始接受预订，7月19日正式发售，将通过苹果官网、Apple Store零售店和授权经销商销售。\n\n【硬件升级】\nVision Pro 2在硬件方面有多项重要升级。芯片方面，采用了全新的M5芯片和R2芯片的组合，图形处理性能提升45%，能效比大幅改善。显示方面，Micro OLED显示屏分辨率进一步提升，单眼像素达到4K级别，画面更加细腻，刷新率支持120Hz。摄像头和传感器系统全面升级，手部追踪和眼动追踪更加精准，新增面部表情捕捉功能。音频方面，全新设计的空间音频系统带来更沉浸的听觉体验，支持头部追踪。续航方面，在体积减小的情况下，续航时间提升到3.5小时，外接电池更轻便。佩戴方面，通过优化重量分布和改进头带设计，佩戴舒适度明显提升。\n\n【软件生态】\nvisionOS 3系统同步推出，带来了一系列新功能和优化。空间输入更加自然流畅，支持更多手势操作。空间照片和空间视频体验升级，支持全新的拍摄和浏览方式，新增3D空间视频通话功能。FaceTime空间通话效果提升，远程协作更加真实。工作场景方面，支持更多生产力应用，虚拟桌面功能更加完善，可同时显示多个虚拟屏幕。娱乐方面，新增多款3A游戏大作，沉浸式影音体验进一步提升，支持Apple Immersive Video沉浸式视频。开发者工具也全面升级，帮助开发者更容易地创建空间计算应用。苹果表示，目前Vision Pro平台已有超过1万款原生应用。\n\n【行业影响】\nVision Pro 2的发布，特别是价格的大幅下调，对整个XR行业将产生深远影响。一方面，更亲民的价格有望大幅提升销量，加速空间计算设备的普及，预计国行版上市后销量将较上代翻倍。另一方面，苹果的持续投入将带动整个产业链的发展，推动相关技术不断进步。竞争对手也将加快产品迭代和价格调整，Meta、Pico等品牌有望推出更具竞争力的产品，行业竞争将更加激烈。对于消费者来说，这意味着将有更多选择和更好的产品体验。业内人士认为，2026年有望成为空间计算设备真正走向大众市场的关键之年，整个行业即将迎来快速发展期，中国市场将成为重要增长极。',

    summary: '比亚迪正式发布第二代刀片电池，能量密度大幅提升，搭载车型续航突破1000公里',
    content: '【新品发布】\n比亚迪今日在深圳总部举行新品发布会，正式发布第二代刀片电池。新一代电池在能量密度、安全性、快充性能、循环寿命等方面实现全面突破，搭载该电池的车型续航里程可突破1000公里。比亚迪董事长王传福在发布会上表示，第二代刀片电池是比亚迪在动力电池领域的又一次重大创新，将重新定义新能源汽车的安全与续航标准，为消费者带来更安心、更便捷的电动出行体验。新电池将于今年第四季度在比亚迪汉、唐、海豹等多款车型上搭载，并已开始向外部客户供货。\n\n【技术突破】\n第二代刀片电池在多个技术指标上实现突破。能量密度方面，从上代的150Wh/kg提升至190Wh/kg，提升幅度达27%，使相同体积下的电池容量大幅提升。安全性方面，延续了刀片电池的针刺测试不冒烟、不起火、不爆炸的安全特性，并通过结构优化进一步增强了抗冲击能力。快充性能方面，支持800V高压快充，充电5分钟可续航150公里，10分钟可续航300公里，30分钟可充至80%。循环寿命方面，可支持超过1万次充放电循环，相当于车辆行驶超过100万公里。低温性能方面，在零下20摄氏度环境下，电池容量保持率超过85%。\n\n【生产工艺】\n第二代刀片电池的生产工艺也有多项创新。一是采用了全新的无模组CTB电池车身一体化技术，将电池直接集成到车身底盘中，提升了空间利用率和车身刚性。二是使用了新型磷酸铁锂材料配方，通过纳米化和掺杂改性，提升了材料的能量密度和导电性。三是改进了极片制造工艺，采用更薄的极片和更致密的涂布，提升了电池的功率特性。四是引入了AI质检系统，对每个电池进行全生命周期质量追溯。五是新建了多个超级工厂，年产能超过200GWh，可满足数百万辆新能源汽车的需求。这些工艺创新确保了第二代刀片电池的高品质和大规模稳定供应。\n\n【行业影响】\n第二代刀片电池的发布，对新能源汽车行业将产生深远影响。首先，1000公里续航将彻底解决消费者的里程焦虑，加速燃油车向新能源车的替代。其次，更快的充电速度将提升用户体验，让电动车充电像加油一样方便。第三，更高的安全性将增强消费者对新能源汽车的信心，推动市场进一步扩大。第四，比亚迪的技术突破将带动整个动力电池行业的技术升级，宁德时代、中创新航等竞争对手也将加快研发。第五，对燃油车企业形成更大压力，加速汽车产业格局重塑。第六，对充电基础设施提出更高要求，800V快充桩的建设将加速。业内人士认为，2026年将成为新能源汽车全面普及的元年。',

    id: '19', title: '美联储宣布降息25个基点开启降息周期',
    summary: '美联储宣布下调联邦基金利率25个基点，为2024年以来首次降息，开启新一轮降息周期',
    content: '【利率决议】\n美国联邦储备委员会今日结束为期两天的货币政策会议，宣布将联邦基金利率目标区间下调25个基点，至4.75%至5.0%之间。这是美联储自2024年12月以来首次降息，标志着美联储货币政策正式从紧缩转向宽松，开启新一轮降息周期。美联储主席鲍威尔在随后的新闻发布会上表示，此次降息是出于对通胀持续回落和劳动力市场降温的考量，未来的货币政策路径将取决于经济数据表现。市场分析认为，美联储此举基本符合市场预期，全球金融市场反应积极，美股三大指数集体上涨。\n\n【经济背景】\n美联储此次降息有其深刻的经济背景。一方面，美国通胀水平持续回落，最新的CPI同比涨幅已经降至2.8%，核心PCE物价指数降至2.4%，距离美联储2%的目标水平仅一步之遥，通胀压力明显缓解，为降息创造了条件。另一方面，美国经济增长势头有所放缓，制造业活动持续收缩，消费支出增速回落，房地产市场在高利率环境下承压明显。劳动力市场也在降温，6月非农就业新增18.5万人，失业率小幅升至4.2%。此外，银行业压力、地缘政治风险等不确定因素也增加了经济下行风险。在这种背景下，美联储选择适度降息以支持经济增长。\n\n【市场影响】\n美联储降息对全球金融市场产生广泛影响。美股方面，三大指数在决议公布后集体上涨，道琼斯指数上涨0.8%，纳斯达克指数上涨1.5%，标普500指数上涨1.1%，科技股表现尤为强劲。美债方面，国债收益率普遍下行，10年期美债收益率跌至4.0%附近。美元指数走弱，跌至97附近，非美货币普遍上涨。黄金价格走强，突破2400美元/盎司关口，创历史新高。原油价格小幅上涨。新兴市场方面，外资流入趋势加强，新兴市场货币和资产价格受到支撑。对于中国而言，美联储降息有助于缓解人民币贬值压力，扩大中国货币政策的操作空间，对A股市场也形成利好。\n\n【后续展望】\n对于美联储后续的降息路径，市场存在不同看法。点阵图显示，美联储官员预计今年还将有1到2次降息，全年累计降息幅度在50到75个基点左右。但市场预期更为鸽派，部分机构预计全年可能降息3次以上。分析人士指出，未来美联储的降息节奏将主要取决于通胀和就业数据。如果通胀继续回落、经济降温明显，降息节奏可能加快；反之，如果通胀反弹、经济超预期强劲，降息可能放缓甚至暂停。投资者应密切关注后续经济数据和美联储官员讲话，把握投资机会。对中国而言，美联储降息将为我国货币政策提供更大空间，有利于稳定人民币汇率和外资流动。',
    category: '海外新闻', source: sources[0], status: 'approved',

  {
    id: '20', title: '欧盟AI法案进入全面实施阶段',
    summary: '欧盟人工智能法案进入全面实施阶段，全球首部综合性AI监管法律正式落地',
    content: '【全面实施】\n欧盟委员会今日宣布，《人工智能法案》（AI Act）正式进入全面实施阶段，这意味着全球首部综合性人工智能监管法律开始全面落地执行。该法案于2024年通过，经过近两年的过渡期准备，各项条款已分阶段生效。欧盟委员会内部市场专员表示，AI法案的实施标志着欧盟在人工智能治理领域走在了世界前列，将为全球AI监管提供重要参考。欧盟同时成立了欧洲人工智能办公室，负责法案的协调执行，并将在各成员国设立监管机构。各大科技企业已开始调整其AI产品和服务，以符合欧盟规定。\n\n【核心内容】\n《人工智能法案》采用基于风险的分级监管方法，将AI系统分为四个风险等级。不可接受风险的AI系统被全面禁止，包括社会评分、实时人脸识别（特定例外除外）、操纵性AI等。高风险AI系统需要严格遵守一系列要求，包括数据质量、透明性、人类监督、准确性和网络安全等，涉及医疗设备、教育、就业、金融、执法等关键领域。中等风险AI系统需要满足透明性要求，让用户知道自己正在与AI交互，如聊天机器人、深度伪造内容等。低风险或最小风险AI系统基本不受监管，可以自由使用。法案还特别关注通用AI模型，要求其提供训练数据摘要和版权合规信息。\n\n【罚则规定】\n对于违反法案规定的行为，设置了严厉的处罚措施。最严重的违规行为，如使用被禁止的AI系统，最高可处以3500万欧元或全球年营业额7%的罚款，两者取其高。对于高风险AI系统的违规行为，最高可处以1500万欧元或全球年营业额3%的罚款。对于提供虚假信息、不配合监管等行为，最高可处以750万欧元或全球年营业额1.5%的罚款。对中小企业和初创企业，罚则有适当减免。此外，法案还规定了投诉机制和赔偿机制，受到AI系统不利影响的个人可以提起投诉并寻求赔偿。欧洲人工智能办公室将负责协调各国监管机构，确保法案的统一执行。\n\n【全球影响】\n欧盟AI法案的全面实施将产生深远的全球影响。首先，它为全球AI监管树立了标杆，其他国家和地区可能会参考和借鉴欧盟的做法，美国、英国、日本等都在制定自己的AI监管框架。其次，由于欧盟市场的重要性，全球科技企业可能会主动调整其AI产品和服务，以符合欧盟的规定，产生布鲁塞尔效应。第三，法案在保护公民权利的同时，也可能在一定程度上影响AI创新的速度，欧盟自身的AI产业面临挑战。第四，如何在安全和创新之间找到平衡，是各国监管者都需要面对的课题。中国也在加快人工智能立法进程，《人工智能法》已列入立法规划，将逐步建立健全AI治理体系，促进AI产业健康发展。',

  {
    id: '21', title: '中国团队在基因编辑领域取得重大突破',
    summary: '中国科研团队开发出新型基因编辑工具，在精准度和安全性上实现重大突破',
    content: '【技术突破】\n中国科学院上海生命科学研究院联合国内多家科研机构，近日在国际顶级学术期刊《自然》上发表重要论文，宣布成功开发出新一代基因编辑技术。这种被称为精准编辑3.0（Precision Editing 3.0）的新技术，在保留CRISPR-Cas9精准定位能力的基础上，大幅提升了编辑的精准度和安全性，能够实现更复杂、更精确的基因修饰。专家表示，这一突破有望将基因治疗推向一个新的高度，为更多遗传疾病的治愈带来希望，是中国在生命科学领域的又一重要原创性成果。\n\n【技术优势】\n与传统CRISPR技术相比，新一代基因编辑技术具有多个显著优势。首先是精准度更高，传统CRISPR容易产生脱靶效应，而新技术的脱靶率降低了几个数量级，几乎可以忽略不计，达千万分之一以下。其次是编辑类型更多样，不仅可以实现基因的敲除和插入，还可以实现单个碱基的精准替换、多个碱基的精准插入和删除等复杂编辑。第三是安全性更好，由于大大减少了DNA双链断裂，降低了染色体异常和致癌风险。第四是编辑效率更高，在多种细胞类型中都表现出很高的编辑效率，包括难以编辑的原代细胞和神经元。第五是适用范围更广，可编辑更长的DNA片段，最长可达10kb。\n\n【应用前景】\n新一代基因编辑技术的应用前景非常广阔。在医学领域，有望用于治疗各种遗传性疾病，如地中海贫血、血友病、先天性失明、亨廷顿舞蹈症、杜氏肌营养不良等。在癌症治疗方面，可以用于改造免疫细胞，开发更有效的CAR-T等细胞治疗方法，已有相关临床试验启动。在传染病防控方面，可以编辑宿主基因，使病毒无法入侵细胞。在农业领域，可以用于培育高产、抗病、优质的农作物新品种，加速种业创新。在生物制造领域，可以改造微生物，用于生产药物、化工原料和生物燃料。在器官移植领域，可编辑动物基因，培育适合人类的移植器官。不过，专家也提醒，技术的临床应用还需要经过严格的安全性评估和临床试验。\n\n【伦理讨论】\n基因编辑技术的快速发展也带来了一系列伦理和社会问题。首先是生殖细胞编辑的问题，如果对胚胎进行基因编辑，改变将遗传给后代，可能对人类基因库产生长远影响，国际社会普遍禁止生殖细胞编辑。其次是设计婴儿的担忧，人们担心技术可能被用于非治疗目的，如增强智力、身高、外貌等。第三是公平性问题，昂贵的基因治疗可能只有富人才能负担得起，加剧社会不平等。第四是监管问题，如何建立健全的监管体系，确保技术被正确使用。第五是基因歧视问题，基因信息可能被用于就业、保险等领域的歧视。国际社会正在就这些问题展开广泛讨论，中国也出台了《人类基因组编辑研究伦理指引》，力求在推动技术发展的同时，妥善应对伦理挑战。',

    id: '22', title: '每日冷知识：蜂蜜为什么永远不会变质',
    summary: '考古学家在埃及金字塔中发现3000年前的蜂蜜仍可食用，蜂蜜为何能千年不腐',
    content: '【神奇发现】\n1922年，考古学家在打开埃及法老图坦卡蒙的陵墓时，发现了几个密封的陶罐，里面装着3000多年前的蜂蜜。令人惊讶的是，这些蜂蜜居然还没有变质，仍然可以食用。这一发现让蜂蜜永不变质的神奇特性广为人知。其实不仅是埃及，在世界各地的古代文明中，蜂蜜都被视为珍贵的食物和药物，其超长的保质期在没有冰箱的古代显得尤为珍贵。蜂蜜为什么能保存这么长时间呢？科学家经过研究发现，这与蜂蜜的独特成分和性质密切相关。直到今天，纯蜂蜜仍然是世界上少有的可以长期保存而不变质的天然食品。\n\n【科学原理】\n蜂蜜永不变质的秘密在于它的几个独特性质。首先是极低的水分含量，成熟蜂蜜的水分含量通常在18%以下，有的甚至低于14%，在这么干燥的环境中，细菌和微生物根本无法生存和繁殖。其次是高酸度，蜂蜜的pH值通常在3.2到4.5之间，属于酸性环境，大多数致病菌在这种酸性条件下都无法生长。第三是蜂蜜中含有过氧化氢，这是一种天然的抗菌物质，由蜜蜂分泌的葡萄糖氧化酶作用于葡萄糖产生，能够有效抑制细菌生长。第四，蜂蜜的高渗透压也会让细菌脱水死亡。第五，蜂蜜中还含有类黄酮、溶菌酶等多种抗菌成分，共同构成了强大的抗菌防线。\n\n【保存条件】\n虽然说蜂蜜永不变质，但这是有前提条件的。首先必须是成熟的纯蜂蜜，如果蜂蜜没有酿造成熟、水分含量过高，或者掺入了水、糖浆等其他物质，就很容易发酵变质。其次要密封保存，如果蜂蜜敞开放置，会吸收空气中的水分，导致水分含量升高，同时也可能落入灰尘和细菌。第三要放在阴凉干燥的地方保存，避免高温和阳光直射，虽然蜂蜜在常温下就能保存很长时间，但高温会破坏其中的营养成分和活性物质。第四，不要用潮湿的勺子取蜂蜜，以免带入水分。第五，蜂蜜结晶是正常现象，不影响食用，可将蜂蜜罐放入温水中慢慢融化。只要保存得当，蜂蜜确实可以保存很多年甚至几十年不变质。\n\n【其他冷知识】\n关于蜂蜜还有很多有趣的冷知识。比如，蜂蜜是唯一一种包含人类生存所需全部营养的食物，包括维生素、矿物质、酶、水等。蜜蜂制造1公斤蜂蜜需要采集约200万朵花的花蜜，飞行距离相当于绕地球3圈。一只工蜂一生只能酿造大约十二分之一茶匙的蜂蜜。蜂蜜的颜色和味道差异很大，从几乎无色透明到深琥珀色都有，这主要取决于蜜蜂采集的花蜜种类。深色蜂蜜通常含有更多的抗氧化物质，营养价值更高。不同种类的蜂蜜还有不同的保健功效，比如椴树蜜安神助眠，洋槐蜜润肠通便，枇杷蜜止咳化痰，这也是蜂蜜自古以来就被用作药物的原因。蜂蜜是世界上少有的既美味又健康还不变质的天然食品。',

  {
    id: '23', title: '每日冷知识：肠道菌群数量是人体细胞的10倍',
    summary: '人体肠道内生活着数以万亿计的微生物，它们如何影响我们的健康与免疫',
    content: '【菌群概况】\n你知道吗？人体肠道内生活着数以万亿计的微生物，包括细菌、病毒、真菌等，它们的总数量约为人体细胞总数的1.3倍，总重量可达1.5至2公斤，相当于一个大脑的重量。这些微生物构成了复杂的肠道菌群，是人体最大的微生态系统。科学家估计，一个成年人的肠道内生活着约1000至1500种不同的细菌，绝大多数属于厚壁菌门和拟杆菌门。每个人的菌群组成都是独一无二的，就像指纹一样，受遗传、饮食、环境、年龄、用药等多种因素影响。肠道菌群与人体形成了共生关系，对我们的健康有着深远影响。\n\n【健康作用】\n肠道菌群对人体健康有多方面重要作用。一是帮助消化吸收，肠道菌群可以分解人体无法消化的膳食纤维，产生短链脂肪酸等有益物质，促进营养吸收。二是合成维生素，肠道菌群可以合成维生素K和多种B族维生素，供人体使用。三是训练免疫系统，肠道菌群可以刺激免疫系统发育，增强免疫细胞的活性，提高机体抗病能力。四是保护肠道屏障，有益菌可以占据肠道黏膜表面，形成生物屏障，阻止有害菌入侵。五是影响代谢和体重，菌群失衡可能导致肥胖、糖尿病等代谢性疾病。六是影响情绪和行为，通过肠脑轴影响神经系统功能。可以说，肠道菌群是人体不可缺少的器官。\n\n【菌群失衡】\n当肠道菌群平衡被打破时，就可能导致多种疾病。肠道菌群失衡的常见原因包括：长期使用抗生素、不合理的饮食结构、长期压力、缺乏运动、睡眠不足、过度清洁等。菌群失衡可能引发的健康问题包括：消化系统疾病，如肠易激综合征、炎症性肠病、腹泻、便秘等；代谢性疾病，如肥胖、糖尿病、脂肪肝等；免疫系统疾病，如过敏、哮喘、自身免疫病等；神经系统疾病，如抑郁症、焦虑症、自闭症、帕金森病等。研究表明，肠道菌群多样性越低，患病风险越高。因此，维持肠道菌群的多样性和平衡对健康至关重要。\n\n【养护建议】\n如何养护肠道菌群？专家给出几点建议。一是均衡饮食，多吃富含膳食纤维的食物，如蔬菜、水果、全谷物、豆类等，这些是益生菌的食物，每天应摄入25至30克膳食纤维。二是适当补充益生菌，可食用酸奶、泡菜、纳豆、味噌等发酵食品，或服用益生菌制剂。三是避免滥用抗生素，抗生素会无差别杀灭肠道菌群，使用时要遵医嘱，必要时可补充益生菌。四是规律作息，保证充足睡眠，减少压力，这些都有助于维持菌群健康。五是适度运动，运动可以增加肠道菌群多样性。六是减少高糖、高脂、加工食品的摄入，这些食物会促进有害菌生长。七是接触自然环境，适当接触土壤、宠物等，可以丰富菌群多样性。养护好肠道菌群，就是养护好自己的健康。',
    category: '冷知识', source: sources[0], status: 'approved',

let speakQueue = [];
let speakIndex = 0;
let paragraphTimes = [];

function calcParagraphTimes() {
  const article = getCurrentArticle();
  if (!article) return [];
  const paragraphs = article.content
    .replace(/【.*?】/g, '')
    .split(/\n+/)
    .map(s => s.trim())
    .filter(s => s.length > 0);
  
  const totalChars = paragraphs.reduce((sum, p) => sum + p.length, 0);
  const times = [];
  let acc = 0;
  for (const p of paragraphs) {
    times.push(acc);
    acc += (p.length / totalChars) * article.duration;
  }
  return times;
}

function pickBestVoice() {
  const voices = speechSynthesis.getVoices();
  const zhVoices = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('zh'));
  if (zhVoices.length === 0) return null;

  const priority = [
    'Xiaoxiao', 'xiaoxiao',
    'Yunxi', 'yunxi',
    'Xiaoyi', 'xiaoyi',
    'Yunyang', 'yunyang',
    'Huihui', 'huihui',
    'Kangkang', 'kangkang',
    'Yaoyao', 'yaoyao',
  ];
  for (const name of priority) {
    const found = zhVoices.find(v => v.name && v.name.includes(name));
    if (found) return found;
  }
  const online = zhVoices.find(v => v.name && (v.name.includes('Online') || v.name.includes('Natural') || v.name.includes('Neural')));
  if (online) return online;
  return zhVoices[0];
}

function speakArticle() {
  if (!('speechSynthesis' in window)) return;
  stopSpeak();

  const article = getCurrentArticle();
  if (!article) return;

  const paragraphs = article.content
    .replace(/【.*?】/g, '')
    .split(/\n+/)
    .map(s => s.trim())
    .filter(s => s.length > 0);

  speakQueue = paragraphs;
  paragraphTimes = calcParagraphTimes();
  
  let startIdx = 0;
  for (let i = paragraphTimes.length - 1; i >= 0; i--) {
    if (currentTime >= paragraphTimes[i] - 0.5) {
      startIdx = i;
      break;
    }
  }
  speakIndex = startIdx;
  speakNextParagraph();
}

function speakNextParagraph() {
  if (speakIndex >= speakQueue.length) {
    speakQueue = [];
    speakIndex = 0;
    return;
  }

  const text = speakQueue[speakIndex];
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'zh-CN';

  const voice = pickBestVoice();
  if (voice) utterance.voice = voice;

  utterance.rate = playbackSpeed;
  utterance.pitch = 1;
  utterance.volume = 1;

  utterance.onend = () => {
    speakIndex++;
    if (speakIndex < speakQueue.length && isPlaying) {
      setTimeout(speakNextParagraph, 350);
    }
  };
  utterance.onerror = () => {
    speakIndex++;
    if (speakIndex < speakQueue.length && isPlaying) {
      setTimeout(speakNextParagraph, 200);
    }
  };

  speechSynthesis.speak(utterance);
}

function stopSpeak() {
  if ('speechSynthesis' in window) {
    speechSynthesis.cancel();
  }
  speakQueue = [];
  speakIndex = 0;
}

function skip(seconds) {
  const article = getCurrentArticle();
  if (!article) return;
  currentTime = Math.max(0, Math.min(article.duration, currentTime + seconds));
  updateProgress();
}

function goPrev() {
  const article = getCurrentArticle();
  if (!article) return;
  const catIdx = getCategoryIndex();
  const catArticles = getCategoryArticles(article.category);
  if (catIdx > 0) {
    currentArticleId = catArticles[catIdx - 1].id;
    currentTime = 0;
    refreshPlayer();
  }
}

function goNext() {
  const article = getCurrentArticle();
  if (!article) return;
  const catIdx = getCategoryIndex();
  const catArticles = getCategoryArticles(article.category);
  if (catIdx < catArticles.length - 1) {
    currentArticleId = catArticles[catIdx + 1].id;
    currentTime = 0;
    refreshPlayer();
  }
}

function updateProgress() {
  const article = getCurrentArticle();
  if (!article) return;
  const progress = (currentTime / article.duration) * 100;
  
  const fill = document.querySelector('.progress-fill');
  const thumb = document.querySelector('.progress-thumb');
  const times = document.querySelectorAll('.progress-time');
  
  if (fill) fill.style.width = progress + '%';
  if (thumb) thumb.style.left = progress + '%';
  if (times[0]) times[0].textContent = formatTime(currentTime);
  if (times[1]) times[1].textContent = formatTime(article.duration);
}

function refreshPlayer() {
  const wasPlaying = isPlaying;
  if (playTimer) { clearInterval(playTimer); playTimer = null; }
  isPlaying = false;
  const playerPage = document.getElementById('playerPage');
  if (playerPage) playerPage.remove();
  const phoneContent = document.querySelector('.phone-content');
  if (phoneContent) {
    const temp = document.createElement('div');
    temp.innerHTML = renderPlayer();
    phoneContent.appendChild(temp.firstElementChild);
  }
  bindPlayerEvents();
  if (wasPlaying) togglePlay();
}

let isDragging = false;
let wasPlayingBeforeDrag = false;

function seekTo(clientX) {
  const bar = document.getElementById('progressBar');
  if (!bar) return;
  const rect = bar.getBoundingClientRect();
  const x = clientX - rect.left;
  const percent = Math.max(0, Math.min(1, x / rect.width));
  const article = getCurrentArticle();
  if (article) {
    currentTime = percent * article.duration;
    updateProgress();
  }
}

function seek(e) {
  seekTo(e.clientX);
  if (isPlaying) {
    speakArticle();
  }
}

function startDrag(e) {
  isDragging = true;
  wasPlayingBeforeDrag = isPlaying;
  if (isPlaying) {
    stopSpeak();
    if (playTimer) { clearInterval(playTimer); playTimer = null; }
  }
  seekTo(e.clientX);
  
  const onMove = (ev) => {
    if (!isDragging) return;
    seekTo(ev.touches ? ev.touches[0].clientX : ev.clientX);
  };
  const onUp = () => {
    isDragging = false;
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onUp);
    if (wasPlayingBeforeDrag) {
      isPlaying = true;
      speakArticle();
      if (!playTimer) startPlayTimer();
    }
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
  document.addEventListener('touchmove', onMove, { passive: true });
  document.addEventListener('touchend', onUp);
}

function startPlayTimer() {
  if (playTimer) return;
  playTimer = setInterval(() => {
    const article = getCurrentArticle();
    if (!article) return;
    if (isDragging) return;
    
    currentTime += playbackSpeed;
    if (currentTime >= article.duration) {
      currentTime = 0;
      const catIdx = getCategoryIndex();
      const catArticles = getCategoryArticles(article.category);
      if (catIdx < catArticles.length - 1) {
        currentArticleId = catArticles[catIdx + 1].id;
        currentTime = 0;
        refreshPlayer();
      } else {
        isPlaying = false;
        stopSpeak();
        const playBtn = document.querySelector('#playBtn i');
        if (playBtn) playBtn.className = 'fas fa-play';
        clearInterval(playTimer);
        playTimer = null;
      }
      return;
    }
    updateProgress();
  }, 1000);
}

function bindFrontendEvents() {
  document.querySelectorAll('.tab-item').forEach(item => {
    item.addEventListener('click', () => {
      currentTab = item.dataset.tab;
      currentArticleId = null;
      isPlaying = false;
      stopSpeak();
      if (playTimer) { clearInterval(playTimer); playTimer = null; }
      render();
    });
  });
  
  document.querySelectorAll('[data-article-id]').forEach(card => {
    card.addEventListener('click', () => {
      showPlayer(card.dataset.articleId);
    });
  });
  
  document.querySelectorAll('[data-category]').forEach(card => {
    card.addEventListener('click', () => {
      const cat = card.dataset.category;
      const approved = getApprovedArticles();
      const catArticle = approved.find(a => a.category === cat);
      if (catArticle) showPlayer(catArticle.id);
    });
  });
  
  const feedbackBtn = document.getElementById('feedbackBtn');
  if (feedbackBtn) {
    feedbackBtn.addEventListener('click', showFeedbackModal);
  }
}

function bindPlayerEvents() {
  document.getElementById('playerBack').onclick = hidePlayer;
  document.getElementById('playBtn').onclick = togglePlay;
  document.getElementById('rewind10').onclick = () => { skip(-10); if (isPlaying) speakArticle(); };
  document.getElementById('forward10').onclick = () => { skip(10); if (isPlaying) speakArticle(); };
  document.getElementById('prevBtn').onclick = goPrev;
  document.getElementById('nextBtn').onclick = goNext;
  
  const bar = document.getElementById('progressBar');
  if (bar) {
    bar.addEventListener('mousedown', startDrag);
    bar.addEventListener('touchstart', (e) => {
      e.preventDefault();
      startDrag({ clientX: e.touches[0].clientX });
    }, { passive: false });
  }
  
  document.querySelectorAll('.speed-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      playbackSpeed = parseFloat(btn.dataset.speed);
      document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (isPlaying) speakArticle();
    });
  });
}

function bindAdminEvents() {
  document.querySelectorAll('[data-admin-tab]').forEach(item => {
    item.addEventListener('click', () => {
      currentAdminTab = item.dataset.adminTab;
      render();
    });
  });
  
  document.querySelectorAll('[data-jump]').forEach(item => {
    item.addEventListener('click', () => {
      currentAdminTab = item.dataset.jump;
      render();
    });
  });
}

// ==================== 后台操作函数 ====================
function submitArticle(id) {
  const article = articles.find(a => a.id === id);
  if (article) {
    article.status = 'approved';
    render();
    showAdminToast('文章已提交并发布到前台');
  }
}

function unpublishArticle(id) {
  const article = articles.find(a => a.id === id);
  if (article) {
    article.status = 'draft';
    render();
    showAdminToast('已撤回到草稿箱');
  }
}

function showAiModal(id) {
  aiModalArticleId = id;
  const modal = document.createElement('div');
  modal.className = 'admin-modal-mask';
  modal.id = 'aiModal';
  modal.innerHTML = `
    <div class="admin-modal">
      <div class="admin-modal-title">
        <i class="fas fa-magic"></i> AI修改建议
      </div>
      <p style="font-size: 13px; color: #6b7280; margin-bottom: 12px;">输入修改建议，AI将根据建议调整文章内容</p>
      <textarea class="admin-modal-textarea" id="aiSuggestion" placeholder="例如：增加更多数据支撑、语言更口语化、缩短到500字以内..."></textarea>
      <div class="modal-actions">
        <button class="modal-btn-ghost" id="cancelAi">取消</button>
        <button class="modal-btn-primary" id="submitAi">确认修改</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
  
  document.getElementById('cancelAi').onclick = () => {
    aiModalArticleId = null;
    modal.remove();
  };
  document.getElementById('submitAi').onclick = () => {
    const text = document.getElementById('aiSuggestion').value.trim();
    if (text && aiModalArticleId) {
      const article = articles.find(a => a.id === aiModalArticleId);
      if (article) {
        article.content = generateModifiedContent(article.content, text);
        article.summary = article.content.substring(0, 50) + '...';
        article.status = 'draft';
      }
      aiModalArticleId = null;
      modal.remove();
      render();
      showAdminToast('AI已根据建议修改文章');
    }
  };
  
  modal.addEventListener('click', (e) => {
    if (e.target === modal) {
      aiModalArticleId = null;
      modal.remove();
    }
  });
}

function generateModifiedContent(originalContent, suggestion) {
  const lines = originalContent.split('\n\n');
  return lines.map((para, i) => {
    if (i === 0) return para + '\n（已根据建议优化）';
    if (suggestion.includes('数据') && i === 1) return para + '据最新统计数据显示，相关指标较上月提升约15%。';
    if (suggestion.includes('口语') || suggestion.includes('通俗')) return para.replace(/【.*?】/g, '').replace(/，/g, '，说人话就是，');
    return para;
  }).join('\n\n') + '\n\n【修改说明】\n根据开发者建议："' + suggestion + '"，AI对文章进行了相应调整。';
}

function toggleExpand(id) {
  if (expandedArticleIds.has(id)) {
    expandedArticleIds.delete(id);
  } else {
    expandedArticleIds.add(id);
  }
  render();
}

function approveSource(id) {
  const sourceIdx = sources.findIndex(s => s.id === id);
  if (sourceIdx === -1) return;
  const source = sources[sourceIdx];
  
  const newArticle = generateDraftArticle(source);
  articles.unshift(newArticle);
  
  sources.splice(sourceIdx, 1);
  
  currentAdminTab = 'articles';
  render();
  showAdminToast('来源已通过，已生成草稿文章');
}

function rejectSource(id) {
  const sourceIdx = sources.findIndex(s => s.id === id);
  if (sourceIdx > -1) {
    sources.splice(sourceIdx, 1);
    render();
    showAdminToast('来源已丢弃');
  }
}

function markQuestionRead(id) {
  const q = questions.find(q => q.id === id);
  if (q) { q.status = 'read'; render(); }
}

function resolveQuestion(id) {
  const q = questions.find(q => q.id === id);
  if (q) { q.status = 'resolved'; render(); showAdminToast('已标记为已处理'); }
}

function showAdminToast(msg) {
  const toast = document.createElement('div');
  toast.style.position = 'fixed';
  toast.style.top = '50%';
  toast.style.left = '50%';
  toast.style.transform = 'translate(-50%, -50%)';
  toast.style.background = 'rgba(17, 24, 39, .9)';
  toast.style.padding = '14px 24px';
  toast.style.borderRadius = '8px';
  toast.style.color = '#fff';
  toast.style.zIndex = '9999';
  toast.style.fontSize = '13px';
  toast.style.boxShadow = '0 4px 20px rgba(0,0,0,.3)';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 1500);
}
