<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统训练营 — 难哄</title>
  <script src="./shared/config.js?v=5"></script>
  <script src="./training_data_part1.js"></script>
  <script src="./training_data_part2.js"></script>
  <style>
    :root {
      --bg: #FBF7F4;
      --bg2: #F5EDE6;
      --ink: #3D2E2A;
      --muted: #8B7D74;
      --rule: #E8DDD3;
      --accent: #E8826B;
      --accent2: #5BA5A0;
      --accent-light: #F4C4B5;
      --accent2-light: #B8DCDA;
      --danger: #d9534f;
      --purple: #9b59b6;
      --shadow: 0 2px 12px rgba(61,46,42,0.08);
      --shadow-lg: 0 8px 32px rgba(61,46,42,0.12);
      --radius: 14px;
      --radius-lg: 20px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* ===== Top Bar ===== */
    .top-bar {
      max-width: 960px; margin: 0 auto; padding: 1.25rem 1.5rem 0;
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 0.5rem;
    }
    .back-link {
      display: inline-flex; align-items: center; gap: 4px;
      color: var(--muted); text-decoration: none; font-size: 14px;
      padding: 6px 14px; border-radius: 20px; border: 1px solid var(--rule);
      background: var(--bg2); transition: all 0.25s ease;
    }
    .back-link:hover { color: var(--accent); border-color: var(--accent); }

    /* ===== Layout ===== */
    .page { max-width: 960px; margin: 0 auto; padding: 1rem 1.5rem 4rem; }
    .header { text-align: center; margin-bottom: 2rem; }
    .header h1 { font-size: 2rem; font-weight: 800; letter-spacing: 0.05em; margin-bottom: 0.25rem; }
    .header .subtitle { font-size: 0.95rem; color: var(--muted); }

    /* ===== Screens ===== */
    .screen { display: none; animation: fadeIn 0.4s ease; }
    .screen.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* ===== Relationship Cards ===== */
    .rel-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-bottom: 2rem; }
    .rel-card {
      background: var(--bg2); border: 2px solid var(--rule);
      border-radius: var(--radius-lg); padding: 1.75rem 1.5rem;
      cursor: pointer; transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
      text-align: center; position: relative; overflow: hidden;
    }
    .rel-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--accent); }
    .rel-card .rel-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
    .rel-card .rel-name { font-size: 1.15rem; font-weight: 700; margin-bottom: 0.3rem; }
    .rel-card .rel-desc { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.6rem; }
    .rel-card .rel-meta { font-size: 0.78rem; color: var(--accent2); font-weight: 600; }
    .rel-badge {
      position: absolute; top: 0.8rem; right: 0.8rem;
      font-size: 0.7rem; padding: 3px 10px; border-radius: 12px; font-weight: 600;
    }
    .rel-badge.done { background: var(--accent2-light); color: var(--accent2); }
    .rel-badge.todo { background: var(--accent-light); color: var(--accent); }
    .rel-badge.partial { background: #FFF3CD; color: #856404; }

    /* ===== Position Selection ===== */
    .pos-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-bottom: 2rem; }
    .pos-card {
      background: var(--bg2); border: 2px solid var(--rule);
      border-radius: var(--radius-lg); padding: 2rem 1.5rem;
      cursor: pointer; transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
      text-align: center;
    }
    .pos-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--accent2); }
    .pos-card .pos-name { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.5rem; }
    .pos-card .pos-desc { font-size: 0.88rem; color: var(--muted); margin-bottom: 0.6rem; }
    .pos-badge { display: inline-block; font-size: 0.75rem; padding: 3px 10px; border-radius: 12px; font-weight: 600; }
    .pos-badge.done { background: var(--accent2-light); color: var(--accent2); }
    .pos-badge.todo { background: var(--accent-light); color: var(--accent); }

    /* ===== Main Header & Tabs ===== */
    .main-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .main-header h2 { font-size: 1.3rem; font-weight: 700; flex: 1; }
    .main-tabs {
      display: flex; gap: 0.5rem; margin-bottom: 1.5rem;
      border-bottom: 2px solid var(--rule);
    }
    .tab-btn {
      padding: 0.7rem 1.2rem; border: none; background: none;
      font-size: 0.95rem; font-weight: 600; color: var(--muted);
      cursor: pointer; border-bottom: 3px solid transparent;
      transition: all 0.25s; font-family: inherit; margin-bottom: -2px;
    }
    .tab-btn:hover { color: var(--ink); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-content { display: none; animation: fadeIn 0.3s ease; }
    .tab-content.active { display: block; }

    /* ===== Scenario Accordion ===== */
    .scenario-item {
      background: var(--bg2); border: 1px solid var(--rule);
      border-radius: var(--radius); margin-bottom: 0.8rem; overflow: hidden;
      transition: box-shadow 0.25s;
    }
    .scenario-item.open { box-shadow: var(--shadow); }
    .scenario-header {
      padding: 1rem 1.25rem; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
      transition: background 0.2s;
    }
    .scenario-header:hover { background: rgba(232,130,107,0.04); }
    .scenario-title { font-size: 1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .scenario-num {
      width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; background: var(--accent-light); color: var(--accent);
      font-size: 0.8rem; font-weight: 700; flex-shrink: 0;
    }
    .scenario-toggle { font-size: 1.2rem; color: var(--muted); transition: transform 0.3s; }
    .scenario-item.open .scenario-toggle { transform: rotate(180deg); }
    .scenario-body { max-height: 0; overflow: hidden; transition: max-height 0.5s ease; }
    .scenario-item.open .scenario-body { max-height: 6000px; }
    .scenario-content { padding: 0 1.25rem 1.25rem; }

    .scn-section { margin-bottom: 1rem; }
    .scn-section:last-child { margin-bottom: 0; }
    .scn-label {
      font-size: 0.8rem; font-weight: 700; margin-bottom: 0.4rem;
      display: flex; align-items: center; gap: 4px;
    }
    .scn-label.principles { color: var(--accent2); }
    .scn-label.case { color: var(--accent); }
    .scn-label.pitfalls { color: var(--danger); }
    .scn-label.triggers { color: var(--purple); }
    .scn-label.otherSide { color: var(--accent2); }

    .scn-principles { list-style: none; padding: 0; }
    .scn-principles li {
      font-size: 0.88rem; padding: 5px 0 5px 1.4rem;
      position: relative; line-height: 1.7;
    }
    .scn-principles li::before { content: '✓'; position: absolute; left: 0; color: var(--accent2); font-weight: 700; }

    .scn-case {
      background: rgba(232,130,107,0.06); border-left: 3px solid var(--accent);
      border-radius: 0 10px 10px 0; padding: 0.85rem 1rem;
      font-size: 0.88rem; line-height: 1.8;
    }
    .scn-pitfalls {
      background: rgba(217,83,79,0.04); border-left: 3px solid var(--danger);
      border-radius: 0 10px 10px 0; padding: 0.85rem 1rem;
      font-size: 0.88rem; line-height: 1.8;
    }
    .scn-triggers { display: flex; flex-wrap: wrap; gap: 6px; }
    .scn-trigger-tag {
      font-size: 0.8rem; padding: 3px 10px; border-radius: 12px;
      background: rgba(155,89,182,0.08); color: var(--purple); font-weight: 600;
    }
    .scn-other-side {
      background: rgba(91,165,160,0.06); border-left: 3px solid var(--accent2);
      border-radius: 0 10px 10px 0; padding: 0.85rem 1rem;
      font-size: 0.88rem; line-height: 1.8;
    }

    /* ===== Mini Chat ===== */
    .chat-setup { display: flex; gap: 0.6rem; margin-bottom: 1rem; align-items: center; flex-wrap: wrap; }
    .chat-setup select {
      flex: 1; min-width: 200px; padding: 0.7rem;
      border: 2px solid var(--rule); border-radius: 10px;
      font-size: 0.9rem; font-family: inherit; background: var(--bg2); color: var(--ink);
    }
    .chat-setup select:focus { border-color: var(--accent); outline: none; }

    .chat-box {
      background: var(--bg2); border: 1px solid var(--rule);
      border-radius: var(--radius); overflow: hidden;
    }
    .chat-messages {
      height: 380px; overflow-y: auto; padding: 1rem;
      display: flex; flex-direction: column; gap: 0.6rem;
    }
    .chat-msg {
      max-width: 80%; padding: 0.7rem 1rem; border-radius: 14px;
      font-size: 0.9rem; line-height: 1.6; word-break: break-word;
    }
    .chat-msg.bot { align-self: flex-start; background: var(--bg); border: 1px solid var(--rule); }
    .chat-msg.user { align-self: flex-end; background: var(--accent); color: #fff; }
    .chat-msg.system {
      align-self: center; font-size: 0.8rem; color: var(--muted);
      background: none; padding: 0.3rem; text-align: center;
    }
    .chat-typing {
      align-self: flex-start; color: var(--muted); font-size: 0.85rem;
      padding: 0.5rem 1rem; font-style: italic;
    }
    .chat-input-area {
      display: flex; gap: 0.5rem; padding: 0.8rem;
      border-top: 1px solid var(--rule); background: var(--bg);
    }
    .chat-input-area input {
      flex: 1; padding: 0.7rem; border: 2px solid var(--rule);
      border-radius: 10px; font-size: 0.9rem; font-family: inherit;
      background: var(--bg2); color: var(--ink);
    }
    .chat-input-area input:focus { border-color: var(--accent); outline: none; }
    .chat-tip { font-size: 0.88rem; color: var(--muted); text-align: center; padding: 2rem 1rem; }

    /* ===== Quiz ===== */
    .quiz-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem; }
    .quiz-progress-text { font-size: 0.85rem; color: var(--muted); }
    .quiz-progress-bar { width: 100%; height: 6px; background: var(--rule); border-radius: 4px; overflow: hidden; margin-bottom: 1.5rem; }
    .quiz-progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 4px; transition: width 0.5s; }

    .question-card {
      background: var(--bg2); border: 1px solid var(--rule); border-radius: var(--radius-lg);
      padding: 1.75rem; margin-bottom: 1.25rem;
    }
    .question-scenario {
      font-size: 0.82rem; color: var(--muted); margin-bottom: 0.3rem;
      background: rgba(91,165,160,0.06); padding: 4px 10px; border-radius: 8px; display: inline-block;
    }
    .question-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem; line-height: 1.6; }
    .question-hint { font-size: 0.82rem; color: var(--accent2); margin-bottom: 1rem; }
    .option-card {
      display: flex; align-items: flex-start; gap: 0.6rem;
      padding: 0.85rem 1rem; background: var(--bg); border: 2px solid var(--rule);
      border-radius: 12px; cursor: pointer; transition: all 0.2s; user-select: none; margin-bottom: 0.6rem;
    }
    .option-card:hover { border-color: var(--accent-light); }
    .option-card.selected { border-color: var(--accent); background: rgba(232,130,107,0.08); }
    .option-card.multi .option-letter { border-radius: 4px; }
    .option-letter {
      flex-shrink: 0; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; background: var(--rule); color: var(--muted); font-size: 0.8rem; font-weight: 700;
    }
    .option-card.selected .option-letter { background: var(--accent); color: #fff; }
    .option-text { font-size: 0.92rem; line-height: 1.6; padding-top: 2px; }
    .quiz-nav { display: flex; gap: 0.6rem; margin-top: 1rem; flex-wrap: wrap; }

    /* ===== Buttons ===== */
    .btn { padding: 0.8rem 1.5rem; border: none; border-radius: 12px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.25s; font-family: inherit; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #d4674f; }
    .btn-secondary { background: var(--bg2); color: var(--ink); border: 1px solid var(--rule); }
    .btn-secondary:hover { border-color: var(--accent2); color: var(--accent2); }
    .btn-teal { background: var(--accent2); color: #fff; }
    .btn-teal:hover { background: #4a8c87; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-sm { padding: 0.5rem 1rem; font-size: 0.85rem; }

    /* ===== Results ===== */
    .result-hero { text-align: center; padding: 2rem 1.5rem; border-radius: var(--radius-lg); margin-bottom: 1.5rem; }
    .result-hero.all-correct { background: linear-gradient(135deg, rgba(91,165,160,0.1), rgba(91,165,160,0.04)); border: 1px solid var(--accent2-light); }
    .result-hero.has-wrong { background: linear-gradient(135deg, rgba(232,130,107,0.08), rgba(232,130,107,0.03)); border: 1px solid var(--accent-light); }
    .result-hero .score-num { font-size: 3rem; font-weight: 800; margin-bottom: 0.3rem; }
    .result-hero.all-correct .score-num { color: var(--accent2); }
    .result-hero.has-wrong .score-num { color: var(--accent); }
    .result-hero .score-label { font-size: 0.95rem; color: var(--muted); }
    .result-hero .score-msg { font-size: 1.05rem; font-weight: 600; margin-top: 0.6rem; }

    .result-section { margin-bottom: 1.5rem; }
    .result-section-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 0.6rem; display: flex; align-items: center; gap: 6px; }
    .review-card {
      background: var(--bg2); border: 1px solid var(--rule); border-radius: var(--radius);
      padding: 1.25rem; margin-bottom: 0.8rem;
    }
    .review-card.wrong { border-color: rgba(217,83,79,0.2); background: rgba(217,83,79,0.03); }
    .review-card.correct { border-color: var(--accent2-light); }
    .review-card .review-num { font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }
    .review-card .review-q { font-size: 0.95rem; font-weight: 600; margin-bottom: 0.5rem; }
    .review-card .review-ans { font-size: 0.85rem; line-height: 1.7; margin-bottom: 0.3rem; }

    .saved-banner {
      background: linear-gradient(135deg, rgba(91,165,160,0.08), rgba(91,165,160,0.02));
      border: 1px solid var(--accent2-light); border-radius: var(--radius);
      padding: 1rem 1.25rem; margin-bottom: 1.5rem;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem;
    }
    .saved-banner .saved-info { font-size: 0.9rem; color: var(--accent2); font-weight: 600; }

    /* ===== Responsive ===== */
    @media (max-width: 640px) {
      .rel-grid, .pos-grid { grid-template-columns: 1fr; }
      .main-tabs { flex-wrap: wrap; }
      .tab-btn { padding: 0.6rem 0.8rem; font-size: 0.85rem; }
      .header h1 { font-size: 1.6rem; }
      .question-card { padding: 1.25rem; }
      .chat-messages { height: 300px; }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="./index.html" class="back-link">← 返回首页</a>
    <span id="api-status"></span>
  </div>

  <div class="page">
    <!-- ===== Screen 1: Relationship Selection ===== -->
    <div class="screen active" id="screen-rel">
      <div class="header">
        <h1>系统训练营</h1>
        <div class="subtitle">选择关系 → 确定角色 → 场景学习 → 对话演练 → 系统考核</div>
      </div>
      <div class="rel-grid" id="rel-grid"></div>
    </div>

    <!-- ===== Screen 2: Position Selection ===== -->
    <div class="screen" id="screen-pos">
      <div class="header">
        <h1 id="pos-title"></h1>
        <div class="subtitle" id="pos-subtitle"></div>
      </div>
      <div class="pos-grid" id="pos-grid"></div>
      <div style="text-align:center;">
        <button class="btn btn-secondary" onclick="showScreen('rel')">← 返回选择关系</button>
      </div>
    </div>

    <!-- ===== Screen 3: Main Learning ===== -->
    <div class="screen" id="screen-main">
      <div class="main-header">
        <button class="btn btn-secondary btn-sm" onclick="backFromMain()">← 返回</button>
        <h2 id="main-title"></h2>
      </div>
      <div class="main-tabs">
        <button class="tab-btn active" data-tab="learn" onclick="switchTab('learn')">📖 场景学习</button>
        <button class="tab-btn" data-tab="chat" onclick="switchTab('chat')">💬 情景演练</button>
        <button class="tab-btn" data-tab="quiz" onclick="switchTab('quiz')">✍️ 系统考核</button>
      </div>

      <!-- Tab: Scenario Learning -->
      <div class="tab-content active" id="tab-learn">
        <div id="scenario-list"></div>
      </div>

      <!-- Tab: Practice Chat -->
      <div class="tab-content" id="tab-chat">
        <div class="chat-setup">
          <select id="chat-scenario-select">
            <option value="">选择一个场景开始演练</option>
          </select>
          <button class="btn btn-teal btn-sm" onclick="startChat()">开始演练</button>
          <button class="btn btn-secondary btn-sm" onclick="resetChat()">重置对话</button>
        </div>
        <div class="chat-tip" id="chat-tip">选择一个场景，AI 将扮演关系中的「对方」与你进行对话演练。也可以不选场景，自由对话。</div>
        <div class="chat-box" id="chat-box" style="display:none;">
          <div class="chat-messages" id="chat-messages"></div>
          <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="输入你的回应..." />
            <button class="btn btn-primary btn-sm" onclick="sendChatMessage()">发送</button>
          </div>
        </div>
        <div style="margin-top:1.5rem; text-align:center;">
          <button class="btn btn-secondary btn-sm" onclick="goToCompanion()">→ 前往 AI 陪伴机器人（完整版预演）</button>
        </div>
      </div>

      <!-- Tab: Quiz -->
      <div class="tab-content" id="tab-quiz">
        <div id="quiz-container"></div>
      </div>
    </div>
  </div>

  <script>
    // ===== Data Merge & Normalization =====
    var RELATIONSHIPS = {};
    if (typeof TRAINING_DATA_PART1 !== 'undefined') Object.assign(RELATIONSHIPS, TRAINING_DATA_PART1);
    if (typeof TRAINING_DATA_PART2 !== 'undefined') Object.assign(RELATIONSHIPS, TRAINING_DATA_PART2);

    var REL_ORDER = ['partner', 'family', 'workplace', 'friendship', 'selfcare'];

    function normalizeQ(q) {
      return {
        q: q.q || q.question || '',
        scenario: q.scenario || '',
        multi: q.multi || false,
        options: q.options || [],
        correct: q.correct,
        explain: q.explain || q.explanation || ''
      };
    }

    function getScenarios(relKey, posKey) {
      var rel = RELATIONSHIPS[relKey];
      if (!rel) return [];
      if (!rel.positions) return rel.scenarios || [];
      return (rel.scenarios && rel.scenarios[posKey]) || [];
    }

    function getQuestions(relKey, posKey) {
      var rel = RELATIONSHIPS[relKey];
      if (!rel) return [];
      var raw;
      if (!rel.positions) raw = rel.questions || [];
      else raw = (rel.questions && rel.questions[posKey]) || [];
      return raw.map(normalizeQ);
    }

    function getOtherSide(scn) {
      return scn.otherSide || scn.innerVoice || '';
    }

    // ===== State & Storage =====
    var state = { rel: null, pos: null, tab: 'learn', quizAnswers: {}, chatMessages: [] };
    var STORAGE_KEY = 'nanhong_training_v3';

    function getAllResults() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
      catch (e) { return {}; }
    }
    function resultKey(rel, pos) { return pos ? rel + '_' + pos : rel; }
    function getSaved(rel, pos) { return getAllResults()[resultKey(rel, pos)]; }
    function saveResult(rel, pos, data) {
      var all = getAllResults();
      all[resultKey(rel, pos)] = data;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
    }
    function deleteResult(rel, pos) {
      var all = getAllResults();
      delete all[resultKey(rel, pos)];
      localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
    }

    // ===== Navigation =====
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
      document.getElementById('screen-' + id).classList.add('active');
      window.scrollTo(0, 0);
    }

    function switchTab(tab) {
      state.tab = tab;
      document.querySelectorAll('.tab-btn').forEach(function(b) {
        b.classList.toggle('active', b.dataset.tab === tab);
      });
      document.querySelectorAll('.tab-content').forEach(function(c) {
        c.classList.toggle('active', c.id === 'tab-' + tab);
      });
      if (tab === 'quiz') renderQuiz();
      if (tab === 'chat') renderChatSetup();
    }

    // ===== Relationship Selection =====
    function renderRelationships() {
      var grid = document.getElementById('rel-grid');
      grid.innerHTML = '';
      REL_ORDER.forEach(function(key) {
        var rel = RELATIONSHIPS[key];
        if (!rel) return;
        var hasPositions = rel.positions && Object.keys(rel.positions).length > 0;
        var completed = 0, total = 0;
        if (hasPositions) {
          Object.keys(rel.positions).forEach(function(pos) {
            total++;
            if (getSaved(key, pos)) completed++;
          });
        } else {
          total = 1;
          if (getSaved(key, null)) completed = 1;
        }
        var card = document.createElement('div');
        card.className = 'rel-card';
        card.onclick = function() { selectRelationship(key); };
        var badge = '';
        if (completed === total && total > 0) badge = '<span class="rel-badge done">已完成</span>';
        else if (completed > 0) badge = '<span class="rel-badge partial">' + completed + '/' + total + ' 已完成</span>';
        else badge = '<span class="rel-badge todo">' + (hasPositions ? total + '个角色' : '未开始') + '</span>';
        card.innerHTML =
          badge +
          '<div class="rel-icon">' + rel.icon + '</div>' +
          '<div class="rel-name">' + rel.name + '</div>' +
          '<div class="rel-desc">' + rel.desc + '</div>' +
          '<div class="rel-meta">' + (hasPositions ? '选择你的角色开始训练' : '直接开始学习') + '</div>';
        grid.appendChild(card);
      });
    }

    function selectRelationship(key) {
      state.rel = key;
      var rel = RELATIONSHIPS[key];
      if (!rel.positions || Object.keys(rel.positions).length === 0) {
        state.pos = null;
        enterMain();
      } else {
        renderPositions(key);
        showScreen('pos');
      }
    }

    // ===== Position Selection =====
    function renderPositions(relKey) {
      var rel = RELATIONSHIPS[relKey];
      document.getElementById('pos-title').textContent = rel.icon + ' ' + rel.name;
      document.getElementById('pos-subtitle').textContent = rel.desc + ' — 选择你在关系中的位置';
      var grid = document.getElementById('pos-grid');
      grid.innerHTML = '';
      Object.keys(rel.positions).forEach(function(posKey) {
        var pos = rel.positions[posKey];
        var saved = getSaved(relKey, posKey);
        var card = document.createElement('div');
        card.className = 'pos-card';
        card.onclick = function() { state.pos = posKey; enterMain(); };
        var badge = saved
          ? '<span class="pos-badge done">已完成 · ' + saved.score + '/' + saved.total + '分</span>'
          : '<span class="pos-badge todo">未开始</span>';
        card.innerHTML =
          '<div class="pos-name">' + pos.name + '</div>' +
          '<div class="pos-desc">' + pos.desc + '</div>' +
          badge;
        grid.appendChild(card);
      });
    }

    // ===== Main Learning =====
    function enterMain() {
      var rel = RELATIONSHIPS[state.rel];
      var posName = state.pos ? rel.positions[state.pos].name : '';
      document.getElementById('main-title').textContent = rel.icon + ' ' + rel.name + (posName ? ' · ' + posName : '');
      state.tab = 'learn';
      document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.toggle('active', b.dataset.tab === 'learn'); });
      document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.toggle('active', c.id === 'tab-learn'); });
      renderScenarios();
      showScreen('main');
    }

    function backFromMain() {
      var rel = RELATIONSHIPS[state.rel];
      if (rel.positions && Object.keys(rel.positions).length > 0) {
        renderPositions(state.rel);
        showScreen('pos');
      } else {
        showScreen('rel');
      }
    }

    // ===== Scenario Accordion =====
    function renderScenarios() {
      var scenarios = getScenarios(state.rel, state.pos);
      var container = document.getElementById('scenario-list');
      container.innerHTML = '';
      if (scenarios.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--muted);">暂无学习内容</div>';
        return;
      }
      scenarios.forEach(function(scn, i) {
        var item = document.createElement('div');
        item.className = 'scenario-item';
        item.innerHTML =
          '<div class="scenario-header" onclick="toggleScenario(' + i + ')">' +
            '<div class="scenario-title"><span class="scenario-num">' + (i + 1) + '</span>' + scn.title + '</div>' +
            '<span class="scenario-toggle">▼</span>' +
          '</div>' +
          '<div class="scenario-body"><div class="scenario-content">' +
            '<div class="scn-section"><div class="scn-label principles">✓ 核心原则</div>' +
              '<ul class="scn-principles">' + scn.principles.map(function(p) { return '<li>' + p + '</li>'; }).join('') + '</ul>' +
            '</div>' +
            '<div class="scn-section"><div class="scn-label case">📋 案例分析</div>' +
              '<div class="scn-case">' + scn.case + '</div>' +
            '</div>' +
            '<div class="scn-section"><div class="scn-label pitfalls">⚠️ 常见误区</div>' +
              '<div class="scn-pitfalls">' + scn.pitfalls + '</div>' +
            '</div>' +
            '<div class="scn-section"><div class="scn-label triggers">🚨 敏感词警报</div>' +
              '<div class="scn-triggers">' + scn.triggers.map(function(t) { return '<span class="scn-trigger-tag">' + t + '</span>'; }).join('') + '</div>' +
            '</div>' +
            '<div class="scn-section"><div class="scn-label otherSide">🔄 换位思考</div>' +
              '<div class="scn-other-side">' + getOtherSide(scn) + '</div>' +
            '</div>' +
          '</div></div>';
        container.appendChild(item);
      });
    }

    function toggleScenario(index) {
      var items = document.querySelectorAll('.scenario-item');
      if (items[index]) items[index].classList.toggle('open');
    }

    // ===== Mini Chat =====
    function renderChatSetup() {
      var select = document.getElementById('chat-scenario-select');
      var scenarios = getScenarios(state.rel, state.pos);
      select.innerHTML = '<option value="">自由对话（不指定场景）</option>';
      scenarios.forEach(function(scn, i) {
        select.innerHTML += '<option value="' + i + '">' + scn.title + '</option>';
      });
      document.getElementById('chat-box').style.display = 'none';
      document.getElementById('chat-tip').style.display = 'block';
      state.chatMessages = [];
    }

    function getChatSystemPrompt() {
      var rel = RELATIONSHIPS[state.rel];
      var posName = state.pos ? rel.positions[state.pos].name : '';
      var relName = rel.name;
      var aiRole = '', userRole = '';
      var pk = state.pos;
      if (state.rel === 'partner') { aiRole = pk === 'strong' ? '伴侣（弱势方）' : '伴侣（强势方）'; userRole = pk === 'strong' ? '强势方' : '弱势方'; }
      else if (state.rel === 'family') { aiRole = pk === 'parent' ? '孩子' : '父母'; userRole = pk === 'parent' ? '父母' : '孩子'; }
      else if (state.rel === 'workplace') { aiRole = pk === 'employee' ? '领导' : '员工'; userRole = pk === 'employee' ? '员工' : '领导'; }
      else if (state.rel === 'friendship') { aiRole = pk === 'listener' ? '来找你倾诉的朋友' : '倾听你的朋友'; userRole = pk === 'listener' ? '倾听者' : '倾诉者'; }
      else if (state.rel === 'selfcare') { aiRole = '你内心的另一个声音'; userRole = '你自己'; }

      var prompt = '你正在扮演一个情感对话练习中的角色。用户正在学习「' + relName + '」中作为「' + userRole + '」的沟通方式。你扮演' + aiRole + '。';
      var select = document.getElementById('chat-scenario-select');
      if (select && select.value !== '') {
        var scenarios = getScenarios(state.rel, state.pos);
        var scn = scenarios[parseInt(select.value)];
        prompt += '当前练习场景：「' + scn.title + '」。场景要点：' + scn.principles.join('；') + '。请以这个场景为背景开始对话，自然地扮演你的角色。';
      } else {
        prompt += '请自然地开始一段日常对话。';
      }
      prompt += '\n要求：\n1. 说话像真实的人，像微信聊天一样自然口语化\n2. 不要说教，不要分析，不要分点列条目，不要说"作为AI"\n3. 每次回复不超过3句话\n4. 适度制造沟通难度，但不要无理取闹\n5. 根据用户的回应做出真实自然的反应';
      return prompt;
    }

    async function startChat() {
      var select = document.getElementById('chat-scenario-select');
      var scenarioIdx = select.value;
      state.chatMessages = [];
      document.getElementById('chat-box').style.display = 'block';
      document.getElementById('chat-tip').style.display = 'none';
      document.getElementById('chat-messages').innerHTML = '';
      if (scenarioIdx !== '') {
        var scenarios = getScenarios(state.rel, state.pos);
        var scn = scenarios[parseInt(scenarioIdx)];
        addChatMessage('system', '💬 当前演练场景：' + scn.title);
      } else {
        addChatMessage('system', '💬 自由对话模式 — AI 将扮演对方角色');
      }
      // AI starts
      addChatTyping();
      try {
        var sysPrompt = getChatSystemPrompt();
        var reply = await NanHongAPI.chat(
          [{ role: 'system', content: sysPrompt + '\n请直接说第一句话开始对话，不要加任何说明。' },
           { role: 'user', content: '（请开始对话）' }],
          { max_tokens: 200 }
        );
        removeChatTyping();
        addChatMessage('bot', reply);
      } catch (e) {
        removeChatTyping();
        addChatMessage('bot', getLocalChatReply());
      }
    }

    function resetChat() {
      document.getElementById('chat-box').style.display = 'none';
      document.getElementById('chat-tip').style.display = 'block';
      document.getElementById('chat-messages').innerHTML = '';
      state.chatMessages = [];
    }

    function goToCompanion() {
      var rel = RELATIONSHIPS[state.rel];
      var params = new URLSearchParams();
      params.set('from', 'training');
      params.set('rel', state.rel);
      if (state.pos) params.set('pos', state.pos);
      var select = document.getElementById('chat-scenario-select');
      if (select && select.value !== '') {
        var scenarios = getScenarios(state.rel, state.pos);
        var scn = scenarios[parseInt(select.value)];
        if (scn) params.set('scenario', scn.title);
      }
      // Map training relationship to companion rehearsal role
      var roleMap = {
        partner: 'partner', family: 'parent', workplace: 'boss',
        friendship: 'friend', selfcare: 'custom'
      };
      if (roleMap[state.rel]) params.set('role', roleMap[state.rel]);
      window.location.href = './companion.html?' + params.toString();
    }

    async function sendChatMessage() {
      var input = document.getElementById('chat-input');
      var text = input.value.trim();
      if (!text) return;
      input.value = '';
      addChatMessage('user', text);
      state.chatMessages.push({ role: 'user', content: text });
      addChatTyping();
      try {
        var sysPrompt = getChatSystemPrompt();
        var apiMessages = [{ role: 'system', content: sysPrompt }];
        state.chatMessages.forEach(function(m) {
          apiMessages.push({ role: m.role === 'user' ? 'user' : 'assistant', content: m.content });
        });
        var reply = await NanHongAPI.chat(apiMessages, { max_tokens: 300 });
        removeChatTyping();
        addChatMessage('bot', reply);
        state.chatMessages.push({ role: 'assistant', content: reply });
      } catch (e) {
        removeChatTyping();
        var fallback = getLocalChatReply();
        addChatMessage('bot', fallback);
        state.chatMessages.push({ role: 'assistant', content: fallback });
      }
    }

    function getLocalChatReply() {
      var replies = [
        '嗯，我在听。你继续说。',
        '你这么想我能理解，但是...',
        '我不太确定你是什么意思。',
        '那你打算怎么办？',
        '我听到了。继续。',
        '说实话，你这么说我有点不舒服。',
        '我不是那个意思，你别想太多。',
        '所以呢？你想表达什么？'
      ];
      return replies[Math.floor(Math.random() * replies.length)];
    }

    function addChatMessage(type, text) {
      var container = document.getElementById('chat-messages');
      var msg = document.createElement('div');
      msg.className = 'chat-msg ' + type;
      msg.textContent = text;
      container.appendChild(msg);
      container.scrollTop = container.scrollHeight;
    }

    function addChatTyping() {
      var container = document.getElementById('chat-messages');
      var typing = document.createElement('div');
      typing.className = 'chat-typing';
      typing.id = 'chat-typing';
      typing.textContent = '对方正在输入...';
      container.appendChild(typing);
      container.scrollTop = container.scrollHeight;
    }

    function removeChatTyping() {
      var typing = document.getElementById('chat-typing');
      if (typing) typing.remove();
    }

    // ===== Quiz =====
    function renderQuiz() {
      var container = document.getElementById('quiz-container');
      var saved = getSaved(state.rel, state.pos);
      if (saved) { renderSavedResult(container, saved); return; }
      var questions = getQuestions(state.rel, state.pos);
      state.quizAnswers = {};
      var html =
        '<div class="quiz-top"><span class="quiz-progress-text">共 ' + questions.length + ' 题，请全部完成后提交</span></div>' +
        '<div class="quiz-progress-bar"><div class="quiz-progress-fill" id="quiz-progress" style="width:0%"></div></div>';
      questions.forEach(function(q, i) {
        var isMulti = q.multi;
        html +=
          '<div class="question-card" data-q="' + i + '">' +
            (q.scenario ? '<div class="question-scenario">场景：' + q.scenario + '</div>' : '') +
            '<div class="question-title">' + (i + 1) + '. ' + q.q + '</div>' +
            (isMulti ? '<div class="question-hint">多选题：选择所有正确选项</div>' : '') +
            '<div class="options" data-q="' + i + '">' +
              q.options.map(function(opt, j) {
                return '<div class="option-card' + (isMulti ? ' multi' : '') + '" onclick="selectOption(' + i + ',' + j + ',' + isMulti + ')" data-q="' + i + '" data-o="' + j + '">' +
                  '<div class="option-letter">' + String.fromCharCode(65 + j) + '</div>' +
                  '<div class="option-text">' + opt + '</div>' +
                '</div>';
              }).join('') +
            '</div>' +
          '</div>';
      });
      html += '<div class="quiz-nav"><button class="btn btn-primary" onclick="submitQuiz()">提交考核</button></div>';
      container.innerHTML = html;
    }

    function selectOption(qIdx, optIdx, isMulti) {
      if (isMulti) {
        if (!state.quizAnswers[qIdx]) state.quizAnswers[qIdx] = [];
        var arr = state.quizAnswers[qIdx];
        var pos = arr.indexOf(optIdx);
        if (pos >= 0) arr.splice(pos, 1);
        else arr.push(optIdx);
      } else {
        state.quizAnswers[qIdx] = optIdx;
      }
      // Update UI
      var options = document.querySelectorAll('.option-card[data-q="' + qIdx + '"]');
      options.forEach(function(opt) {
        var o = parseInt(opt.dataset.o);
        if (isMulti) {
          opt.classList.toggle('selected', state.quizAnswers[qIdx] && state.quizAnswers[qIdx].indexOf(o) >= 0);
        } else {
          opt.classList.toggle('selected', state.quizAnswers[qIdx] === o);
        }
      });
      // Update progress
      var questions = getQuestions(state.rel, state.pos);
      var answered = 0;
      questions.forEach(function(q, i) {
        var ans = state.quizAnswers[i];
        if (ans !== undefined && (!Array.isArray(ans) || ans.length > 0)) answered++;
      });
      var pct = (answered / questions.length) * 100;
      var bar = document.getElementById('quiz-progress');
      if (bar) bar.style.width = pct + '%';
    }

    function submitQuiz() {
      var questions = getQuestions(state.rel, state.pos);
      var unanswered = 0;
      questions.forEach(function(q, i) {
        var ans = state.quizAnswers[i];
        if (ans === undefined || (Array.isArray(ans) && ans.length === 0)) unanswered++;
      });
      if (unanswered > 0) {
        if (!confirm('还有 ' + unanswered + ' 题未作答，确定要提交吗？')) return;
      }
      var correct = 0;
      var wrongDetails = [];
      questions.forEach(function(q, i) {
        var ans = state.quizAnswers[i];
        var isCorrect = checkAnswer(q, ans);
        if (isCorrect) correct++;
        else wrongDetails.push({ index: i, question: q, userAnswer: ans });
      });
      var total = questions.length;
      var resultData = {
        completed: true,
        score: correct,
        total: total,
        answers: state.quizAnswers,
        wrongDetails: wrongDetails.map(function(w) { return { index: w.index, userAnswer: w.userAnswer }; }),
        date: new Date().toISOString(),
        aiSummary: null
      };
      saveResult(state.rel, state.pos, resultData);
      renderResult(document.getElementById('quiz-container'), correct, total, questions, wrongDetails, true);
      getAIAnalysis(correct, total, questions, wrongDetails);
      // Refresh relationship grid badges
      renderRelationships();
    }

    function checkAnswer(q, ans) {
      if (ans === undefined) return false;
      if (q.multi) {
        if (!Array.isArray(ans) || !Array.isArray(q.correct)) return false;
        if (ans.length !== q.correct.length) return false;
        return q.correct.every(function(c) { return ans.indexOf(c) >= 0; });
      } else {
        return ans === q.correct;
      }
    }

    function formatAns(ans, options) {
      if (ans === undefined || ans === null) return '未作答';
      if (Array.isArray(ans)) {
        if (ans.length === 0) return '未作答';
        return ans.map(function(a) { return String.fromCharCode(65 + a) + '. ' + options[a]; }).join('；');
      }
      return String.fromCharCode(65 + ans) + '. ' + options[ans];
    }

    function renderResult(container, score, total, questions, wrongDetails, showAIPlaceholder) {
      var allCorrect = score === total;
      var html =
        '<div class="result-hero ' + (allCorrect ? 'all-correct' : 'has-wrong') + '">' +
          '<div class="score-num">' + score + '/' + total + '</div>' +
          '<div class="score-label">' + (allCorrect ? '全部正确！' : '继续加油') + '</div>' +
          '<div class="score-msg">' + (allCorrect ? '你已经掌握了这个角色的核心要点 🎉' : (total - score) + '题需要重点复习') + '</div>' +
        '</div>';
      if (showAIPlaceholder) {
        html += '<div class="result-section"><div class="result-section-title">🤖 AI 深度分析</div>' +
          '<div class="review-card" id="ai-analysis-loading"><div style="text-align:center;padding:1rem;color:var(--muted);">正在生成个性化分析...</div></div></div>';
      }
      // Wrong answers
      if (wrongDetails.length > 0) {
        html += '<div class="result-section"><div class="result-section-title">📌 错题回顾</div>';
        wrongDetails.forEach(function(w) {
          var q = w.question;
          html +=
            '<div class="review-card wrong">' +
              '<div class="review-num">第 ' + (w.index + 1) + ' 题</div>' +
              '<div class="review-q">' + q.q + '</div>' +
              '<div class="review-ans"><strong>你的答案：</strong>' + formatAns(w.userAnswer, q.options) + '</div>' +
              '<div class="review-ans" style="color:var(--accent2);"><strong>正确答案：</strong>' + formatAns(q.correct, q.options) + '</div>' +
              '<div class="review-ans" style="margin-top:0.5rem;color:var(--muted);">' + q.explain + '</div>' +
            '</div>';
        });
        html += '</div>';
      }
      // All correct summary
      if (allCorrect) {
        html += '<div class="result-section"><div class="result-section-title">🌟 考核总结</div>';
        questions.forEach(function(q, i) {
          html +=
            '<div class="review-card correct">' +
              '<div class="review-num">第 ' + (i + 1) + ' 题</div>' +
              '<div class="review-q">' + q.q + '</div>' +
              '<div class="review-ans" style="color:var(--muted);">' + q.explain + '</div>' +
            '</div>';
        });
        html += '</div>';
      }
      html += '<div class="quiz-nav" style="margin-top:1.5rem;">' +
        '<button class="btn btn-secondary" onclick="retakeQuiz()">重新测试</button>' +
        '<button class="btn btn-primary" onclick="backFromMain()">完成</button>' +
      '</div>';
      container.innerHTML = html;
    }

    function renderSavedResult(container, saved) {
      var questions = getQuestions(state.rel, state.pos);
      var wrongDetails = (saved.wrongDetails || []).map(function(w) {
        return { index: w.index, question: questions[w.index] || {}, userAnswer: w.userAnswer };
      });
      var html =
        '<div class="saved-banner">' +
          '<div class="saved-info">✅ 已完成 · 得分：' + saved.score + '/' + saved.total + ' · ' + new Date(saved.date).toLocaleString('zh-CN') + '</div>' +
        '</div>';
      if (saved.aiSummary) {
        html += '<div class="result-section"><div class="result-section-title">🤖 AI 分析</div><div class="review-card">' + saved.aiSummary + '</div></div>';
      }
      if (wrongDetails.length > 0) {
        html += '<div class="result-section"><div class="result-section-title">📌 错题回顾</div>';
        wrongDetails.forEach(function(w) {
          var q = w.question;
          html +=
            '<div class="review-card wrong">' +
              '<div class="review-num">第 ' + (w.index + 1) + ' 题</div>' +
              '<div class="review-q">' + (q.q || '') + '</div>' +
              '<div class="review-ans"><strong>你的答案：</strong>' + formatAns(w.userAnswer, q.options || []) + '</div>' +
              '<div class="review-ans" style="color:var(--accent2);"><strong>正确答案：</strong>' + formatAns(q.correct, q.options || []) + '</div>' +
              '<div class="review-ans" style="margin-top:0.5rem;color:var(--muted);">' + (q.explain || '') + '</div>' +
            '</div>';
        });
        html += '</div>';
      }
      html += '<div class="quiz-nav" style="margin-top:1.5rem;">' +
        '<button class="btn btn-secondary" onclick="retakeQuiz()">重新测试</button>' +
        '<button class="btn btn-primary" onclick="backFromMain()">返回</button>' +
      '</div>';
      container.innerHTML = html;
    }

    function retakeQuiz() {
      if (!confirm('确定要重新测试吗？之前的成绩将被覆盖。')) return;
      deleteResult(state.rel, state.pos);
      state.quizAnswers = {};
      renderQuiz();
      renderRelationships();
    }

    async function getAIAnalysis(score, total, questions, wrongDetails) {
      var loadingEl = document.getElementById('ai-analysis-loading');
      if (!loadingEl) return;
      try {
        var rel = RELATIONSHIPS[state.rel];
        var posName = state.pos ? rel.positions[state.pos].name : '自我';
        var allCorrect = score === total;
        var prompt = '';
        if (allCorrect) {
          prompt = '用户在「' + rel.name + '」关系训练中，作为「' + posName + '」完成了全部' + total + '道题，全部正确。\n\n请给出一段简短的表扬和总结（150字以内），肯定用户对这个角色的理解，并鼓励用户在真实生活中实践。语气要温暖真诚，不要分点列条目。';
        } else {
          var wrongSummary = wrongDetails.map(function(w) {
            var q = w.question;
            return '题' + (w.index + 1) + '：' + q.q + '\n用户选了：' + formatAns(w.userAnswer, q.options) + '\n正确答案解析：' + q.explain;
          }).join('\n\n');
          prompt = '用户在「' + rel.name + '」关系训练中，作为「' + posName + '」完成了' + total + '道题，答对' + score + '题，答错' + (total - score) + '题。\n\n以下是用户的错题情况：\n' + wrongSummary + '\n\n请给出一段个性化的分析和鼓励（200字以内）：\n1. 着重指出用户的主要认知盲区\n2. 给出具体的改进建议\n3. 语气要鼓励而非批评，让用户感到被支持\n4. 不要分点列条目，用自然的段落表达';
        }
        var reply = await NanHongAPI.chat(
          [{ role: 'system', content: '你是情感沟通训练导师，请直接回答，不要推理过程。' },
           { role: 'user', content: prompt }],
          { max_tokens: 600 }
        );
        if (loadingEl) { loadingEl.innerHTML = reply; loadingEl.id = 'ai-analysis-done'; }
        var saved = getSaved(state.rel, state.pos);
        if (saved) { saved.aiSummary = reply; saveResult(state.rel, state.pos, saved); }
      } catch (e) {
        if (loadingEl) loadingEl.innerHTML = '<div style="color:var(--muted);">分析生成失败，请稍后重试。</div>';
      }
    }

    // ===== Init =====
    window.addEventListener('DOMContentLoaded', function() {
      renderRelationships();
      if (typeof NanHongAPI !== 'undefined') {
        var status = NanHongAPI.getStatusBadge ? NanHongAPI.getStatusBadge() : '';
        document.getElementById('api-status').innerHTML = status;
      }
      // Enter key for chat
      var chatInput = document.getElementById('chat-input');
      if (chatInput) {
        chatInput.addEventListener('keypress', function(e) {
          if (e.key === 'Enter') sendChatMessage();
        });
      }
    });
  </script>
</body>
</html>
