@keyframes fadeIn {

}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes bounce {

}

// ==================== 场景分析函数 ====================
function analyzeScene(inputText) {
  const text = inputText.toLowerCase();

  // 关系类型检测（先检测更具体的关键词）
  let relationship = '其他';
  let relScore = 0;
  if (/妈|爸|父母|催婚|相亲|找对象|孩子|儿子|女儿|家长|家里|外婆|外公|爷爷|奶奶/.test(text)) {
    relationship = '亲子关系'; relScore = 3;
  } else if (/女友|女朋友|男朋友|老婆|老公|伴侣|另一半|恋人|冷战|分手|吵架.*她|吵架.*他/.test(text)) {
    relationship = '伴侣关系'; relScore = 3;
  } else if (/同事|领导|老板|项目|工作|职场|汇报|甩锅|批评|公司|上班|加班/.test(text)) {
    relationship = '职场关系'; relScore = 3;
  } else if (/朋友|闺蜜|哥们|群里|同学|背后|坏话/.test(text)) {
    relationship = '朋友关系'; relScore = 3;
  }

  // 情绪状态检测（先检测更具体的情绪）
  let emotion = '其他';
  if (/气|愤怒|火|烦死|讨厌|恨|又气|气死|爆发|吵架|骂/.test(text)) {
    emotion = '愤怒';
  } else if (/委屈|难过|哭|伤心|心疼|冷战|不理|冷漠|被.*冤枉/.test(text)) {
    emotion = '委屈';
  } else if (/愧疚|对不起|后悔|不应该|自责|不好意思|是我的错/.test(text)) {
    emotion = '愧疚';
  } else if (/焦虑|担心|害怕|不知道怎么办|迷茫|不知道该怎么|慌|怕/.test(text)) {
    emotion = '焦虑';
  } else if (/催|相亲|逼|念叨|唠叨|又.*催|没完|受不了|烦|无语|无奈|累了|心累|窒息/.test(text)) {
    emotion = '无奈烦躁';
  } else if (/冷|不说话|不回|已读不回|沉默|分房|疏远/.test(text)) {
    emotion = '失落';
  }

  // 冲突程度检测
  let conflictLevel = '轻微';
  if (/冷战|不理|分手|辞职|决裂|撕|骂|批评|哭|当着所有人|背后说/.test(text)) {
    conflictLevel = '严重';
  } else if (/生气|委屈|不满|争执|矛盾|吵架|催|甩锅/.test(text)) {
    conflictLevel = '中等';
  }

  // 情绪勒索检测
  let isBlackmail = false;
  if (/不爱我|分手|离开|不.*就.*|如果你不|除非你|不然就|你要是不|就是不爱/.test(text)) {
    isBlackmail = true;
  }

  // 核心问题推断（根据具体场景细化）
  let coreIssue = '沟通障碍';
  if (relationship === '伴侣关系') {
    if (/冷战|不理|不说话|不回/.test(text)) {
      coreIssue = '冷暴力与情感疏离';
    } else {
      coreIssue = isBlackmail ? '情绪勒索与边界侵犯' : '被忽视感与需求未表达';
    }
  } else if (relationship === '亲子关系') {
    if (/催.*相亲|催婚|催.*找对象|逼.*结婚|逼.*相亲/.test(text)) {
      coreIssue = '婚恋自主权与父母焦虑的冲突';
    } else if (/管.*太多|控制|不让|不许|必须/.test(text)) {
      coreIssue = '个人边界与过度干预的冲突';
    } else {
      coreIssue = '代际价值观差异与关心方式错位';
    }
  } else if (relationship === '职场关系') {
    if (/甩锅|推责任|背锅|赖我|怪我/.test(text)) {
      coreIssue = '责任归属与职业声誉风险';
    } else {
      coreIssue = '公平感受与职业发展受阻';
    }
  } else if (relationship === '朋友关系') {
    coreIssue = '信任危机与社交孤立';
  }

  // 建议生成
  let suggestion = '';
  if (isBlackmail) {
    suggestion = '警惕情绪勒索，先保护好自己的边界，不要在被施压的当下做决定';
  } else if (conflictLevel === '严重') {
    suggestion = '先降温再沟通，避免冲动决策，不在情绪上头时说重要的话';
  } else if (conflictLevel === '中等') {
    suggestion = '先共情对方感受，再表达自己的立场，用"我"开头而非"你"开头';
  } else {
    suggestion = '主动沟通，坦诚表达感受，趁问题还小的时候解决';
  }

  // 生成标签
  let tags = [relationship];
  if (emotion !== '其他') tags.push('情绪：' + emotion);
  tags.push('冲突：' + conflictLevel);
  if (isBlackmail) tags.push('情绪勒索');

  return {
    relationship,
    emotion,
    conflictLevel,
    coreIssue,
    isBlackmail,
    suggestion,
    tags
  };
}

// ==================== 场景匹配逻辑 ====================
function matchScene(analysis, inputText) {
  // 优先检测情绪勒索
  if (analysis.isBlackmail) {
    return sceneData[4];
  }

  // 根据关系类型匹配
  switch (analysis.relationship) {
    case '伴侣关系': return sceneData[0];
    case '亲子关系': return sceneData[1];
    case '职场关系': return sceneData[2];
    case '朋友关系': return sceneData[3];
    default:
      // 如果关系类型未识别，用关键词匹配
      return matchByKeywords(inputText);
  }
}

    { keywords: ['妈', '爸', '父母', '催', '找对象', '相亲', '别管我', '亲子', '孩子'], sceneId: 1 },
    { keywords: ['同事', '领导', '项目', '甩锅', '批评', '职场', '责任', '汇报', '公司'], sceneId: 2 },
    { keywords: ['朋友', '群里', '坏话', '背后', '误解', '误会', '不理我', '同学'], sceneId: 3 },
    { keywords: ['工资卡', '不爱我', '勒索', '要挟', '交出', '不爱', '分手'], sceneId: 4 }
  ];

  let bestMatch = 0;
  let maxScore = 0;

  keywordMap.forEach(item => {
    let score = 0;
    item.keywords.forEach(kw => {
      if (inputText.includes(kw)) score += 1;
    });
    if (score > maxScore) {
      maxScore = score;
      bestMatch = item.sceneId;
    }
  });

  return sceneData[bestMatch];
}

// 将AI返回的JSON转换为内部场景数据结构
function convertAIResponse(aiResult, inputText) {
  // 支持扁平结构（新格式）和嵌套结构（旧格式兼容）
  var sa = aiResult.sceneAnalysis || aiResult;
  var blackmailRaw = sa.emotionalBlackmail !== undefined ? sa.emotionalBlackmail : sa.isBlackmail;
  var isBlackmail = false;
  if (typeof blackmailRaw === 'boolean') {
    isBlackmail = blackmailRaw;
  } else if (typeof blackmailRaw === 'string') {
    isBlackmail = /true|是|检测到|涉及|存在|勒索/.test(blackmailRaw);
  }

  // 场景分析 — 用本地分析补充核心问题（AI精简JSON中不含此字段）
  var relationship = sa.relationship || '其他';
  var emotionState = sa.emotionState || '未明确';
  var conflictLevel = sa.conflictLevel || '中等';
  var localAnalysis = analyzeScene(inputText);
  var analysis = {
    relationship: relationship,
    emotion: emotionState,
    conflictLevel: conflictLevel,
    coreIssue: isBlackmail ? '情绪勒索与边界侵犯' : (localAnalysis.coreIssue || '沟通障碍'),
    isBlackmail: isBlackmail,
    suggestion: (aiResult.suggestions && aiResult.suggestions[0]) || localAnalysis.suggestion || '先共情对方感受，再表达自己的立场',
    tags: [relationship, '情绪：' + emotionState, '冲突：' + conflictLevel]
  };
  if (isBlackmail) analysis.tags.push('情绪勒索');

  // 构建话术方案
  var plans = [];
  if (aiResult.planA) {
    plans.push(aiPlanToInternalPlan(aiResult.planA, true));
  }
  if (aiResult.planB) {
    plans.push(aiPlanToInternalPlan(aiResult.planB, false));
  }
  if (plans.length === 0) {
    plans.push({
      name: 'AI建议方案',
      recommended: true,
      summary: '根据场景分析生成的回应建议',
      steps: [{ phase: '建议', content: '请先共情对方感受，再表达自己的立场', principle: '真诚是最好的话术' }],
      reactions: []
    });
  }

  // 对方反应预判（支持新旧两种格式）
  var opReaction = '';
  var opFollowUp = '';
  if (aiResult.opponentPrediction) {
    opReaction = aiResult.opponentPrediction.reaction || '';
    opFollowUp = aiResult.opponentPrediction.followUp || '';
  } else {
    opReaction = aiResult.opponentReaction || '';
    opFollowUp = aiResult.followUp || '';
  }
  if (opReaction || opFollowUp) {
    var reaction = {
      label: '对方反应预判',
      type: 'most-likely',
      description: opReaction || '对方可能有各种反应，需根据实际情况灵活应对',
      reply: opFollowUp || '根据对方反应灵活调整话术，保持真诚和耐心'
    };
    plans.forEach(function(plan) {
      if (!plan.reactions) plan.reactions = [];
      plan.reactions.push(reaction);
    });
  }

  // 行动建议
  var actions = [];
  var actionTypes = [
    { type: 'immediate', label: '即时', icon: '⚡' },
    { type: 'shortterm', label: '短期', icon: '📅' },
    { type: 'longterm', label: '长期', icon: '🌱' }
  ];
  if (aiResult.suggestions && aiResult.suggestions.length) {
    aiResult.suggestions.forEach(function(s, i) {
      var at = actionTypes[Math.min(i, 2)];
      actions.push({ type: at.type, label: at.label, icon: at.icon, content: s });
    });
  }
  // 补充方案内的行动建议
  plans.forEach(function(plan) {
    if (plan._aiActions && plan._aiActions.length) {
      plan._aiActions.forEach(function(a) {
        actions.push({ type: 'shortterm', label: '行动', icon: '✅', content: a });
      });
      delete plan._aiActions;
    }
  });
  if (actions.length === 0) {
    actions.push({ type: 'immediate', label: '即时', icon: '⚡', content: '先冷静下来，不要在情绪上头时做决定' });
    actions.push({ type: 'shortterm', label: '短期', icon: '📅', content: '找一个合适的时机与对方沟通' });
    actions.push({ type: 'longterm', label: '长期', icon: '🌱', content: '建立健康的沟通习惯，定期交流感受' });
  }

  // 警示信息（情绪勒索）
  var warningText = null;
  if (isBlackmail) {
    if (typeof blackmailRaw === 'string' && blackmailRaw.length > 10) {
      warningText = '检测到此场景可能涉及情绪勒索。' + blackmailRaw;
    } else {
      warningText = '检测到此场景可能涉及情绪勒索。健康的关系不应以"不爱"作为要挟条件。建议先照顾好自己的感受，不必急于回应，也不要在被施压的当下做重大决定。';
    }
  }

  var scene = {
    id: 999,
    label: 'AI分析',
    icon: '🤖',
    input: inputText,
    isWarning: isBlackmail,
    analysis: analysis,
    warning: warningText,
    plans: plans,
    actions: actions,
    source: 'ai'
  };

  return { analysis: analysis, scene: scene, source: 'ai' };
}

// 将AI方案转换为内部plan结构
function aiPlanToInternalPlan(aiPlan, recommended) {
  var steps = [];
  if (aiPlan.scripts && aiPlan.scripts.length) {
    aiPlan.scripts.forEach(function(script, i) {
      var isLast = (i === aiPlan.scripts.length - 1);
      steps.push({
        phase: '话术 ' + (i + 1),
        content: script,
        principle: isLast && aiPlan.principle ? aiPlan.principle : '注意语气真诚，按顺序表达，给对方回应的空间'
      });
    });
  } else {
    steps.push({
      phase: '建议',
      content: aiPlan.title || '请根据实际情况灵活应对',
      principle: aiPlan.principle || '真诚沟通'
    });
  }

  return {
    name: aiPlan.title || (recommended ? '方案A' : '方案B'),
    recommended: recommended,
    summary: aiPlan.principle || '',
    steps: steps,
    reactions: [],
    _aiActions: aiPlan.actions || []
  };
}

// 调用AI生成建议，失败时回退到本地规则引擎
async function generateResponse(inputText) {
  // 安全检查：NanHongAPI未加载时直接使用本地逻辑
  if (!window.NanHongAPI) {
    console.warn('[ER] NanHongAPI 未加载，使用本地规则引擎');
    return generateResponseFallback(inputText);
  }

  var systemPrompt = [
    '你是"难哄"平台的情绪价值专家。用户描述一个冲突场景，你基于该场景生成回应建议。',
    '直接输出JSON，不要推理过程。所有内容必须和用户描述的场景完全一致。',
    '',
    'JSON格式如下（用```json包裹）：',
    '```json',
    '{',
    '  "relationship": "关系类型（基于用户描述的人物）",',
    '  "emotionState": "用户情绪状态",',
    '  "conflictLevel": "低/中/高",',
    '  "isBlackmail": false,',
    '  "planA": {',
    '    "title": "方案A标题",',
    '    "scripts": ["针对场景的具体话术1", "话术2", "话术3"],',
    '    "principle": "原理"',
    '  },',
    '  "planB": {',
    '    "title": "方案B标题",',
    '    "scripts": ["话术1", "话术2"],',
    '    "principle": "原理"',
    '  },',
    '  "opponentReaction": "对方可能的反应",',
    '  "followUp": "跟进话术",',
    '  "suggestions": ["即时建议", "短期建议", "长期建议"]',
    '}',
    '```',
    '',
    '要求：话术必须提到用户场景中的具体事件和人物，不要用泛称，不要套模板。'
  ].join('\n');

  var userPrompt = '场景描述：' + inputText;

  var result = await NanHongAPI.chatJSON(systemPrompt, userPrompt, function() {
    return generateResponseFallback(inputText);
  }, { maxTokens: 16000, temperature: 0.8, timeout: 120000 });

  // 如果是回退结果（本地规则引擎），直接返回
  if (result && typeof result === 'object' && result.analysis && result.scene) {
    return result;
  }

  // 如果是AI返回的JSON对象（支持嵌套和扁平两种格式），转换为内部格式
  if (result && typeof result === 'object' && (result.sceneAnalysis || result.relationship || result.planA)) {
    return convertAIResponse(result, inputText);
  }

  // 如果是字符串（解析失败），尝试手动提取
  if (typeof result === 'string') {
    console.warn('[ER] AI返回字符串，尝试提取JSON');
    try {
      var match = result.match(/\{[\s\S]*\}/);
      if (match) {
        var parsed = JSON.parse(match[0]);
        if (parsed.relationship || parsed.planA || parsed.sceneAnalysis) {
          return convertAIResponse(parsed, inputText);
        }
      }
    } catch(e2) {}
  }

  // 其他情况，使用回退
  console.warn('[ER] AI响应格式异常，使用本地规则引擎');
  return generateResponseFallback(inputText);
}

// ==================== 获取建议主函数 ====================
async function getAdvice() {
  var inputText = sceneInput.value.trim();

  if (!inputText) {
    showInputError('请先描述你遇到的冲突场景');
    return;
  }

  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span>⏳</span> 分析中...';

  responseSection.classList.add('visible');
  responseContent.style.display = 'none';
  loadingBox.classList.add('visible');
  actionBar.classList.remove('visible');
  document.body.classList.remove('action-bar-visible');

  setTimeout(function() {
    responseSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 100);

  var loadingMessages = [
    '正在分析场景...',
    '正在理解情绪...',
    '正在匹配话术策略...',
    '正在生成建议...'
  ];
  var msgIndex = 0;
  var msgTimer = setInterval(function() {
    if (msgIndex < loadingMessages.length) {
      loadingText.textContent = loadingMessages[msgIndex];
      msgIndex++;
    }
  }, 400);

  try {
    var result = await generateResponse(inputText);
    clearInterval(msgTimer);
    currentAnalysis = result.analysis;
    currentScene = result.scene;
    currentPlanIndex = 0;
    displayResponse(inputText);
    saveToHistory(inputText, currentScene);
  } catch(e) {
    clearInterval(msgTimer);
    console.error('[ER] 生成建议失败，使用本地规则引擎:', e);
    if (window.NanHongAPI) NanHongAPI.toast('生成失败，已切换到本地模式', 'error');
    var fallbackResult = generateResponseFallback(inputText);
    currentAnalysis = fallbackResult.analysis;
    currentScene = fallbackResult.scene;
    currentPlanIndex = 0;
    displayResponse(inputText);
    saveToHistory(inputText, currentScene);
  } finally {
    submitBtn.disabled = false;
    submitBtn.innerHTML = '<span>🔍</span> 重新获取建议';
  }
}

function addPracticeMessage(role, content, stepIndex) {
  const chatArea = document.getElementById('chatArea');
  if (!chatArea) return;

  practiceState.messages.push({ role, content, stepIndex });

  let bubbleHtml = '';
  if (role === 'ai') {
    if (stepIndex !== undefined && stepIndex !== null) {
      const step = practiceState.plan.steps[stepIndex];
      bubbleHtml = `
        <div class="chat-step-label">第${stepIndex + 1}步 · ${step.phase}</div>
        <div>${escapeHtml(step.content)}</div>
      `;
    } else {
      bubbleHtml = `<div>${escapeHtml(content)}</div>`;
    }
  } else {
    bubbleHtml = `<div>${escapeHtml(content)}</div>`;
  }

  const msgHtml = `
    <div class="chat-msg ${role}">
      <div class="chat-avatar">${role === 'ai' ? '🤖' : '👤'}</div>
      <div>
        ${role === 'ai' && stepIndex === undefined && practiceState.lastAnalysis ? `<div class="chat-analysis">📊 ${practiceState.lastAnalysis}</div>` : ''}
        <div class="chat-bubble">${bubbleHtml}</div>
      </div>
    </div>
  `;

  chatArea.insertAdjacentHTML('beforeend', msgHtml);
  chatArea.scrollTop = chatArea.scrollHeight;

  // 更新轮次
  const roundInfo = document.getElementById('chatRoundInfo');
  if (roundInfo) {
    roundInfo.textContent = `第 ${practiceState.rounds} / ${practiceState.maxRounds} 轮`;
  }
}

function handlePracticeInput() {
  const chatInput = document.getElementById('chatInput');
  if (!chatInput) return;

  const userReply = chatInput.value.trim();
  if (!userReply) return;

  // 添加用户消息
  addPracticeMessage('user', userReply);
  chatInput.value = '';
  chatInput.style.height = 'auto';

  practiceState.rounds++;

  // 分析回复
  const analysis = analyzeReply(userReply);
  practiceState.lastAnalysis = analysis.suggestion;

  if (analysis.type === 'escalation') practiceState.escalationCount++;
  if (analysis.type === 'absolute') practiceState.absoluteCount++;
  if (analysis.type === 'softening') practiceState.softeningCount++;

  // 检查是否结束
  if (practiceState.rounds >= practiceState.maxRounds) {
    setTimeout(() => {
      endPractice();
    }, 500);
    return;
  }

  // 给出下一步建议
  setTimeout(() => {
    const nextStepIndex = practiceState.currentStep + 1;

    if (nextStepIndex < practiceState.plan.steps.length) {
      // 还有下一步，显示下一步
      practiceState.currentStep = nextStepIndex;
      addPracticeMessage('ai', null, nextStepIndex);
    } else {
      // 没有更多步骤了，根据分析给出反应回复
      const reply = getReactionReply(userReply, analysis, practiceState.plan);
      addPracticeMessage('ai', reply);
    }
  }, 600);
}

function analyzeReply(text) {
  // 检测绝对化语言
  if (/每次|总是|永远|从来不|一直|从来/.test(text)) {
    return {
      type: 'absolute',
      suggestion: '对方使用了绝对化表达（"每次""总是"等），不要反驳绝对词，尝试理解背后的情绪，把主动权交给对方'
    };
  }
  // 检测情绪升级
  if (/滚|闭嘴|别说了|烦死了|够了|不想听|不想理你|分手|算了|随便你/.test(text)) {
    return {
      type: 'escalation',
      suggestion: '对方情绪升级了，建议主动退一步，给双方冷静时间，不要继续施压'
    };
  }
  // 检测软化迹象
  if (/好吧|也是|我知道|算了|行吧|嗯|那好吧|你说得对|其实我也/.test(text)) {
    return {
      type: 'softening',
      suggestion: '对方情绪有所缓和，可以继续推进沟通，适当表达感谢和承诺'
    };
  }
  // 检测沉默/犹豫
  if (/沉默|不知道|随便|......|。。|无语/.test(text)) {
    return {
      type: 'silence',
      suggestion: '对方在犹豫或沉默，给一点空间，不要催促，可以用行动代替语言'
    };
  }
  // 检测质疑
  if (/真的吗|你确定|能做到吗|又骗我|我不信|说得好听/.test(text)) {
    return {
      type: 'skeptical',
      suggestion: '对方在质疑你的诚意，不要辩解，用具体的行动和承诺来证明'
    };
  }
  return {
    type: 'neutral',
    suggestion: '保持真诚，继续表达你的感受，注意倾听对方的真实需求'
  };
}

function getReactionReply(userReply, analysis, plan) {
  // 尝试匹配预设反应
  for (let reaction of plan.reactions) {
    if (reaction.type === 'most-likely' && analysis.type === 'skeptical') {
      return reaction.reply;
    }
    if (reaction.type === 'possible' && (analysis.type === 'silence' || analysis.type === 'softening')) {
      return reaction.reply;
    }
    if (reaction.type === 'worst-case' && (analysis.type === 'escalation' || analysis.type === 'absolute')) {
      return reaction.reply;
    }
  }

  // 默认回复
  const defaultReplies = {
    'absolute': '不要反驳对方的绝对化表达。可以说："你说得对，我确实做得不够好。你告诉我，我怎么做才能让你满意？"——把主动权交给对方。',
    'escalation': '对方情绪升级了，建议主动退一步。"我知道你现在不想听我说话，我先去做点别的，你冷静了叫我。"——给双方冷静时间。',
    'softening': '对方情绪有所缓和，可以继续推进。"谢谢你愿意听我说。以后我一定注意，不会再让你这么难过。"',
    'silence': '对方在犹豫，给一点空间。"你不用现在回复我，我只是想让你知道我的想法。你要是想聊了随时找我。"',
    'skeptical': '对方在质疑你的诚意。"我知道你不太信，但我这次是真的想改。你看我以后的表现就好。"',
    'neutral': '保持真诚，继续表达你的感受。"我只是想让你知道我在乎你的感受，我们一起想办法好吗？"'
  };

  return defaultReplies[analysis.type] || defaultReplies.neutral;
}

function endPractice() {
  practiceState.completed = true;

  // 计算分数
  let score = 50;
  score += practiceState.rounds * 8; // 每轮8分
  if (practiceState.escalationCount === 0) score += 10;
  if (practiceState.rounds >= 5) score += 5;
  score = Math.min(100, score);

  // 生成改进建议
  let suggestions = [];
  if (practiceState.escalationCount > 0) {
    suggestions.push('对方情绪升级时，注意主动退一步，不要继续施压');
  }
  if (practiceState.absoluteCount > 0) {
    suggestions.push('面对绝对化表达（"每次""总是"），不要反驳绝对词，尝试理解背后的情绪');
  }
  if (practiceState.softeningCount > 0) {
    suggestions.push('对方情绪缓和时是推进沟通的好时机，及时表达感谢和承诺');
  }
  if (practiceState.rounds < 5) {
    suggestions.push('建议完整走完5轮对话，多练习不同场景');
  }
  if (suggestions.length === 0) {
    suggestions.push('表现不错！继续保持真诚和耐心');
    suggestions.push('可以尝试用不同的话术方案再预演一次，对比效果');
  }

  const body = document.getElementById('practiceBody');
  let suggestionsHtml = suggestions.map(s =>
    `<div class="practice-suggestion-item">${s}</div>`
  ).join('');

  body.innerHTML = `
    <div class="practice-result">
      <div class="practice-score">${score}</div>
      <div class="practice-score-label">预演评分（满分100）</div>
      <div class="practice-breakdown">
        <div class="practice-breakdown-item">
          <span class="practice-breakdown-label">沟通完整度</span>
          <span class="practice-breakdown-score">${practiceState.rounds}/5 轮</span>
        </div>
        <div class="practice-breakdown-item">
          <span class="practice-breakdown-label">情绪升级次数</span>
          <span class="practice-breakdown-score">${practiceState.escalationCount} 次</span>
        </div>
        <div class="practice-breakdown-item">
          <span class="practice-breakdown-label">绝对化表达次数</span>
          <span class="practice-breakdown-score">${practiceState.absoluteCount} 次</span>
        </div>
        <div class="practice-breakdown-item">
          <span class="practice-breakdown-label">缓和迹象次数</span>
          <span class="practice-breakdown-score">${practiceState.softeningCount} 次</span>
        </div>
      </div>
      <div class="practice-suggestions">
        <div class="practice-suggestions-title">📝 改进建议</div>
        ${suggestionsHtml}
      </div>
      <div style="margin-top:20px;display:flex;gap:10px;justify-content:center;">

      </div>
    </div>
  `;
}

      </div>
      <div class="form-group">
        <label class="form-label">冲突原因分析 <span class="required">*</span></label>
        <textarea class="form-textarea" id="reviewCause" placeholder="分析冲突的根本原因是什么？"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">使用了哪个话术方案 <span class="required">*</span></label>
        <select class="form-select" id="reviewPlan">
          ${planOptions}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">话术效果如何 <span class="required">*</span></label>
        <div class="form-radio-group" id="reviewEffectGroup">
          <label class="form-radio-label" data-value="good">
            <input type="radio" name="effect" value="good"> 很好，问题解决了
          </label>
          <label class="form-radio-label" data-value="ok">
            <input type="radio" name="effect" value="ok"> 一般，有所改善
          </label>
          <label class="form-radio-label" data-value="bad">
            <input type="radio" name="effect" value="bad"> 不太好，效果有限
          </label>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">对方反应</label>
        <textarea class="form-textarea" id="reviewReaction" placeholder="对方当时的反应是什么？"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">学到了什么 <span class="required">*</span></label>
        <textarea class="form-textarea" id="reviewLearned" placeholder="从这次冲突中学到了什么？"></textarea>
      </div>
      <button class="form-submit-btn" onclick="saveReview()">保存复盘</button>
    </div>
  `;

  // 单选按钮样式
  const radioLabels = document.querySelectorAll('#reviewEffectGroup .form-radio-label');
  radioLabels.forEach(label => {
    label.addEventListener('click', function() {
      radioLabels.forEach(l => l.classList.remove('checked'));
      this.classList.add('checked');
      this.querySelector('input').checked = true;
    });
  });

  openModal('reviewModal');
}

function saveReview() {
  const cause = document.getElementById('reviewCause').value.trim();
  const planIndex = document.getElementById('reviewPlan').value;
  const effectInput = document.querySelector('input[name="effect"]:checked');
  const reaction = document.getElementById('reviewReaction').value.trim();
  const learned = document.getElementById('reviewLearned').value.trim();

  if (!cause) {
    showToast('请填写冲突原因分析');
    return;
  }
  if (!effectInput) {
    showToast('请选择话术效果');
    return;
  }
  if (!learned) {
    showToast('请填写学到了什么');
    return;
  }

  const review = {
    id: Date.now(),
    scene: currentScene.label,
    sceneId: currentScene.id,
    planIndex: parseInt(planIndex),
    planName: currentScene.plans[planIndex].name,
    cause: cause,
    effect: effectInput.value,
    reaction: reaction,
    learned: learned,
    time: new Date().toLocaleString('zh-CN', {
      month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
    })
  };

  let reviews = getReviews();
  reviews.unshift(review);
  if (reviews.length > 50) reviews = reviews.slice(0, 50);
  localStorage.setItem(REVIEW_KEY, JSON.stringify(reviews));

  // 显示成功页面
  const body = document.getElementById('reviewBody');
  body.innerHTML = `
    <div class="review-success">
      <div class="review-success-icon">✅</div>
      <div class="review-success-text">复盘已保存！</div>
      <div class="review-success-sub">每一次复盘都是成长的一步，继续加油</div>
      <div style="margin-top:20px;">
        <button class="form-submit-btn" onclick="closeModal('reviewModal')" style="width:auto;padding:12px 32px;">完成</button>
      </div>
    </div>
  `;

  renderReviews();
}

// ==================== 模态弹窗控制 ====================
function openModal(modalId) {
  document.getElementById(modalId).classList.add('visible');
}

function closeModal(modalId) {
  document.getElementById(modalId).classList.remove('visible');
}

// 点击遮罩关闭弹窗
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', function(e) {
    if (e.target === this) {
      this.classList.remove('visible');
    }
  });
});

// ESC关闭弹窗
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay.visible').forEach(m => {
      m.classList.remove('visible');
    });
  }
});

// ==================== Toast 提示 ====================
function showToast(msg) {
  let toast = document.getElementById('toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast';
    toast.style.cssText = `
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(61,46,42,0.9);
      color: #fff;
      padding: 10px 24px;
      border-radius: 24px;
      font-size: 14px;
      font-family: var(--font);
      z-index: 999;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    `;
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.opacity = '1';
  setTimeout(() => {
    toast.style.opacity = '0';
  }, 2500);
}

// ==================== 输入错误提示 ====================
function showInputError(msg) {
  const existing = document.querySelector('.input-error');
  if (existing) existing.remove();

  const error = document.createElement('div');
  error.className = 'input-error';
  error.textContent = msg;
  error.style.cssText = `
    color: #D9534F;
    font-size: 13px;
    margin-top: 8px;
    padding: 6px 0;
    animation: fadeInUp 0.3s ease-out;
  `;

  sceneInput.parentNode.insertBefore(error, sceneInput.nextSibling);

  sceneInput.style.borderColor = '#D9534F';
  sceneInput.style.animation = 'shake 0.4s ease';
  setTimeout(() => {
    sceneInput.style.borderColor = '';
    sceneInput.style.animation = '';
  }, 600);

  setTimeout(() => {
    if (error.parentNode) error.remove();
  }, 3000);
}

// ==================== localStorage 历史记录 ====================
const HISTORY_KEY = 'nanHong_er_history';
const REVIEW_KEY = 'nanHong_er_reviews';

function saveToHistory(inputText, scene) {
  let history = getHistory();
  const record = {
    id: Date.now(),
    text: inputText,
    sceneLabel: scene.label,
    sceneId: scene.id,
    isWarning: scene.isWarning,
    time: new Date().toLocaleString('zh-CN', {
      month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
    })
  };
  history.unshift(record);
  if (history.length > 20) history = history.slice(0, 20);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  renderHistory();
}

function getHistory() {
  try {
    const data = localStorage.getItem(HISTORY_KEY);
    return data ? JSON.parse(data) : [];
  } catch (e) {
    return [];
  }
}

function renderHistory() {
  const history = getHistory();

  if (history.length === 0) {
    historyList.innerHTML = `
      <div class="history-empty">
        <div class="history-empty-icon">📝</div>
        暂无查询记录<br>开始你的第一次咨询吧
      </div>
    `;
    return;
  }

  historyList.innerHTML = history.map(item => `
    <div class="history-item" onclick="loadHistoryItem(${item.id})">
      <div class="history-item-text">${escapeHtml(item.text)}</div>
      <div class="history-item-time">${item.time}</div>
      <span class="history-item-badge ${item.isWarning ? 'badge-warning' : 'badge-normal'}">
        ${item.isWarning ? '⚠️ ' : ''}${item.sceneLabel}
      </span>
    </div>
  `).join('');
}

function loadHistoryItem(id) {
  const history = getHistory();
  const item = history.find(h => h.id === id);
  if (!item) return;

  sceneInput.value = item.text;
  sceneInput.style.height = 'auto';
  sceneInput.style.height = sceneInput.scrollHeight + 'px';

  presetButtons.forEach(b => b.classList.remove('active'));

  window.scrollTo({ top: 0, behavior: 'smooth' });

  // 如果是AI生成的场景（id=999）或未知场景，使用本地规则引擎重建
  var scene;
  if (item.sceneId === 999 || item.sceneId === undefined || !sceneData[item.sceneId]) {
    currentAnalysis = analyzeScene(item.text);
    scene = matchScene(currentAnalysis, item.text);
  } else {
    scene = sceneData[item.sceneId];
    currentAnalysis = analyzeScene(item.text);
  }
  currentScene = scene;
  currentPlanIndex = 0;

  responseSection.classList.add('visible');
  loadingBox.classList.add('visible');
  responseContent.style.display = 'none';
  actionBar.classList.remove('visible');
  document.body.classList.remove('action-bar-visible');

  setTimeout(() => {
    loadingBox.classList.remove('visible');
    displayResponse(item.text);
  }, 1000);

  responseSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function clearHistory() {
  if (getHistory().length === 0) return;
  if (confirm('确定要清空所有查询记录吗？')) {
    localStorage.removeItem(HISTORY_KEY);
    renderHistory();
  }
}

// ==================== localStorage 复盘记录 ====================
function getReviews() {
  try {
    const data = localStorage.getItem(REVIEW_KEY);
    return data ? JSON.parse(data) : [];
  } catch (e) {
    return [];
  }
}

function renderReviews() {
  const reviews = getReviews();

  if (reviews.length === 0) {
    reviewList.innerHTML = `
      <div class="history-empty">
        <div class="history-empty-icon">📔</div>
        暂无复盘记录<br>解决问题后来做个复盘吧
      </div>
    `;
    return;
  }

  const effectMap = {
    'good': { label: '效果很好', class: 'effect-good' },
    'ok': { label: '一般', class: 'effect-ok' },
    'bad': { label: '不太好', class: 'effect-bad' }
  };

  reviewList.innerHTML = reviews.map(item => {
    const effect = effectMap[item.effect] || effectMap.ok;
    return `
      <div class="review-item" onclick="loadReviewDetail(${item.id})">
        <div class="review-item-scene">${item.scene} · ${item.planName}</div>
        <div class="review-item-meta">
          <span>${item.time}</span>
          <span class="review-item-effect ${effect.class}">${effect.label}</span>
        </div>
      </div>
    `;
  }).join('');
}

function loadReviewDetail(id) {
  const reviews = getReviews();
  const item = reviews.find(r => r.id === id);
  if (!item) return;

  const effectMap = {
    'good': '很好，问题解决了',
    'ok': '一般，有所改善',
    'bad': '不太好，效果有限'
  };

  const body = document.getElementById('reviewBody');
  body.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:16px;">
      <div>
        <div style="font-size:13px;color:var(--text-sub);margin-bottom:4px;">冲突场景</div>
        <div style="font-size:14px;color:var(--text-main);padding:12px 14px;background:var(--card-bg);border-radius:10px;line-height:1.7;">${escapeHtml(item.scene)}</div>
      </div>
      <div>
        <div style="font-size:13px;color:var(--text-sub);margin-bottom:4px;">使用方案</div>
        <div style="font-size:14px;color:var(--text-main);">${escapeHtml(item.planName)}</div>
      </div>
      <div>
        <div style="font-size:13px;color:var(--text-sub);margin-bottom:4px;">冲突原因</div>
        <div style="font-size:14px;color:var(--text-main);padding:12px 14px;background:var(--card-bg);border-radius:10px;line-height:1.7;">${escapeHtml(item.cause)}</div>
      </div>
      <div>
        <div style="font-size:13px;color:var(--text-sub);margin-bottom:4px;">话术效果</div>
        <div style="font-size:14px;color:var(--text-main);">${effectMap[item.effect] || item.effect}</div>
      </div>
      ${item.reaction ? `
      <div>
        <div style="font-size:13px;color:var(--text-sub);margin-bottom:4px;">对方反应</div>
        <div style="font-size:14px;color:var(--text-main);padding:12px 14px;background:var(--card-bg);border-radius:10px;line-height:1.7;">${escapeHtml(item.reaction)}</div>
      </div>
      ` : ''}
      <div>
        <div style="font-size:13px;color:var(--text-sub);margin-bottom:4px;">学到了什么</div>
        <div style="font-size:14px;color:var(--text-main);padding:12px 14px;background:rgba(91,165,160,0.06);border-radius:10px;line-height:1.7;border-left:3px solid var(--teal);">${escapeHtml(item.learned)}</div>
      </div>
      <div style="font-size:12px;color:var(--text-sub);text-align:right;">${item.time}</div>
    </div>
  `;

  openModal('reviewModal');
}

function clearReviews() {
  if (getReviews().length === 0) return;
  if (confirm('确定要清空所有复盘记录吗？')) {
    localStorage.removeItem(REVIEW_KEY);
    renderReviews();
  }
}

// ==================== HTML 转义 ====================
function escapeHtml(str) {
  if (typeof str !== 'string') return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ==================== 文本框自适应高度 ====================
sceneInput.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.max(120, this.scrollHeight) + 'px';
});

// ==================== 键盘快捷键 ====================
sceneInput.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    getAdvice();
  }
});

// ==================== 页面初始化 ====================
renderHistory();
renderReviews();
</script>
</body>
</html>
