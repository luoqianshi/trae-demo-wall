/* ==================== Storage 工具 ==================== */
var PREFIX = 'nanhong_daily_';
function lsGet(key) {
  try { var v = localStorage.getItem(PREFIX + key); return v ? JSON.parse(v) : null; }
  catch(e) { return null; }
}
function lsSet(key, val) {
  try { localStorage.setItem(PREFIX + key, JSON.stringify(val)); } catch(e) {}
}

/* ==================== 日期工具 ==================== */
function formatDate(d) {
  var y = d.getFullYear();
  var m = String(d.getMonth() + 1).padStart(2, '0');
  var day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}
function formatTime() {
  var d = new Date();
  var h = String(d.getHours()).padStart(2, '0');
  var m = String(d.getMinutes()).padStart(2, '0');
  return h + ':' + m;
}
function todayStr() { return formatDate(new Date()); }

/* ==================== Toast ==================== */
var toastTimer = null;
function showToast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { el.classList.remove('show'); }, 2200);
}

/* ==================== 随机工具 ==================== */
function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ==================== HTML转义 & AI JSON解析 ==================== */
function esc(text) {
  if (text === null || text === undefined) return '';
  var div = document.createElement('div');
  div.textContent = String(text);
  return div.innerHTML;
}
function parseAIJSON(text) {
  if (!text) return null;
  var jsonStr = text;
  var codeBlockMatch = text.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (codeBlockMatch) {
    jsonStr = codeBlockMatch[1].trim();
  } else {
    var jsonMatch = text.match(/[\[{][\s\S]*[\]}]/);
    if (jsonMatch) jsonStr = jsonMatch[0];
  }
  try { return JSON.parse(jsonStr); } catch(e) { return null; }
}

/* ==================== 心情统计 ==================== */
function getStreak() {
  var records = getMoodRecords();
  if (records.length === 0) return 0;
  var streak = 0;
  var today = new Date();
  var todayStrFmt = formatDate(today);
  var checkedInToday = records.some(function(r) { return r.date === todayStrFmt; });
  var startOffset = checkedInToday ? 0 : 1;
  for (var i = startOffset; i < 365; i++) {
    var d = new Date(today);
    d.setDate(d.getDate() - i);
    var ds = formatDate(d);
    if (records.some(function(r) { return r.date === ds; })) {
      streak++;
    } else {
      break;
    }
  }
  return streak;
}

function renderStats() {
  var records = getMoodRecords();
  var section = document.getElementById('stats-section');
  if (records.length === 0) {
    section.style.display = 'none';
    return;
  }
  section.style.display = 'block';
  document.getElementById('streak-num').textContent = getStreak();
  renderMoodCurve();
}

function renderMoodCurve() {
  var records = getMoodRecords();
  var today = new Date();
  var days = [];
  var dayNames = ['日','一','二','三','四','五','六'];
  for (var i = 6; i >= 0; i--) {
    var d = new Date(today);
    d.setDate(d.getDate() - i);
    var ds = formatDate(d);
    var rec = null;
    for (var j = 0; j < records.length; j++) {
      if (records[j].date === ds) { rec = records[j]; break; }
    }
    days.push({
      date: ds,
      label: dayNames[d.getDay()],
      isToday: i === 0,
      mood: rec ? rec.mood : null
    });
  }

  var moodToY = { 5: 25, 4: 55, 3: 85, 2: 115, 1: 145 };
  var xPositions = [40, 130, 220, 310, 400, 490, 580];
  var svgW = 620, svgH = 185;

  var svg = '<svg class="mood-curve-svg" viewBox="0 0 ' + svgW + ' ' + svgH + '" xmlns="http://www.w3.org/2000/svg">';
  // 背景网格线
  var gridYs = [25, 55, 85, 115, 145];
  var gridLabels = ['很好','不错','一般','不太好','很糟'];
  for (var gi = 0; gi < gridYs.length; gi++) {
    svg += '<line x1="20" y1="' + gridYs[gi] + '" x2="' + (svgW - 10) + '" y2="' + gridYs[gi] + '" stroke="#E8DDD3" stroke-width="1" stroke-dasharray="3,4" opacity="0.6"/>';
    svg += '<text x="8" y="' + (gridYs[gi] + 3) + '" font-size="9" fill="#C4B5A9" text-anchor="start">' + gridLabels[gi] + '</text>';
  }

  // 连线
  var linePoints = [];
  for (var pi = 0; pi < days.length; pi++) {
    if (days[pi].mood !== null) {
      linePoints.push(xPositions[pi] + ',' + moodToY[days[pi].mood]);
    }
  }
  if (linePoints.length >= 2) {
    svg += '<polyline points="' + linePoints.join(' ') + '" fill="none" stroke="#E8826B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>';
  }
  // 渐变填充区域
  if (linePoints.length >= 2) {
    var areaPoints = linePoints.slice();
    var firstX = parseFloat(linePoints[0].split(',')[0]);
    var lastX = parseFloat(linePoints[linePoints.length - 1].split(',')[0]);
    areaPoints.unshift(firstX + ',160');
    areaPoints.push(lastX + ',160');
    svg += '<polygon points="' + areaPoints.join(' ') + '" fill="#E8826B" opacity="0.08"/>';
  }

  // 数据点
  for (var di = 0; di < days.length; di++) {
    var day = days[di];
    var x = xPositions[di];
    if (day.mood !== null) {
      var y = moodToY[day.mood];
      var moodObj = MOODS.filter(function(m) { return m.id === day.mood; })[0];
      if (day.isToday) {
        svg += '<circle cx="' + x + '" cy="' + y + '" r="9" fill="#E8826B" opacity="0.2"/>';
        svg += '<circle cx="' + x + '" cy="' + y + '" r="5.5" fill="#E8826B" stroke="#fff" stroke-width="2"/>';
      } else {
        svg += '<circle cx="' + x + '" cy="' + y + '" r="4.5" fill="#E8826B" stroke="#fff" stroke-width="1.5"/>';
      }
      svg += '<title>' + day.label + '：' + moodObj.label + '</title>';
    } else {
      svg += '<circle cx="' + x + '" cy="85" r="3.5" fill="none" stroke="#E8DDD3" stroke-width="1.5"/>';
    }
    // 日期标签
    svg += '<text x="' + x + '" y="178" font-size="10" fill="' + (day.isToday ? '#E8826B' : '#8B7D74') + '" text-anchor="middle" font-weight="' + (day.isToday ? '700' : '400') + '">' + (day.isToday ? '今天' : day.label) + '</text>';
  }

  svg += '</svg>';
  document.getElementById('curve-container').innerHTML = svg;
}

function pickCard(pool, moodId, excludeIds) {
  var avail = pool.filter(function(c) {
    return c.moods.indexOf(moodId) !== -1 &&
      excludeIds.indexOf(c.id) === -1 &&
      getDisliked().indexOf(c.id) === -1;
  });
  if (avail.length === 0) {
    avail = pool.filter(function(c) {
      return excludeIds.indexOf(c.id) === -1 &&
        getDisliked().indexOf(c.id) === -1;
    });
  }
  if (avail.length === 0) return null;
  return pickRandom(avail);
}

function renderAICards(data) {
  var container = document.getElementById('cards-container');

  (data.quotes || []).forEach(function(q, i) {

      id: 'ai_q_' + ts + '_' + i, type: 'quote',
      text: q.content || '', source: q.source || '佚名', interpretation: q.interpretation || ''
    });
  });

    cards.push({
      id: 'ai_e_' + ts + '_' + i, type: 'exercise',

      steps: Array.isArray(ex.steps) ? ex.steps : [], suit: ex.suitable || '适合需要放松的时候'
    });
  });
  (data.stories || []).forEach(function(s, i) {
    var content = s.content || '';
    cards.push({
      id: 'ai_s_' + ts + '_' + i, type: 'story',

      preview: content.length > 30 ? content.substring(0, 30) + '...' : content,

function buildCardElement(card) {
  var el = document.createElement('div');
  el.className = 'healing-card';
  el.dataset.cardId = card.id;

  // 兼容本地预置卡片（按id前缀）和AI生成卡片（按type字段）
  var cardType = card.type;
  if (!cardType) {
    if (card.id.indexOf('q') === 0) cardType = 'quote';
    else if (card.id.indexOf('e') === 0) cardType = 'exercise';
    else cardType = 'story';
  }

  var typeBadge = '', mainContent = '', detailContent = '';

  if (cardType === 'quote') {
    typeBadge = '<span class="card-type-badge badge-quote">治愈金句</span>';
    mainContent = '<div class="card-quote-text">"' + esc(card.text) + '"</div><div class="card-source">— ' + esc(card.source) + '</div>';
    detailContent = '<div class="detail-label">解读</div><div>' + esc(card.interpretation) + '</div>';
  } else if (cardType === 'exercise') {
    typeBadge = '<span class="card-type-badge badge-exercise">情绪练习</span>';
    mainContent = '<div class="card-title">' + esc(card.title) + '</div><div class="card-meta">用时约 ' + esc(card.duration) + '</div>';
    var stepsHtml = (card.steps || []).map(function(s) { return '<li>' + esc(s) + '</li>'; }).join('');
    detailContent = '<div class="detail-label">练习步骤</div><ol class="step-list">' + stepsHtml + '</ol><div class="exercise-suit">' + esc(card.suit) + '</div>';
  } else {
    typeBadge = '<span class="card-type-badge badge-story">暖心故事</span>';
    var preview = card.preview || '';
    mainContent = '<div class="card-title">' + esc(card.title) + '</div><div class="card-preview">' + esc(preview) + '</div>';
    var storyContent = card.content || '';
    var storyHtml = storyContent.split('\n\n').map(function(p) { return '<p style="margin-bottom:8px;">' + esc(p) + '</p>'; }).join('');
    detailContent = '<div class="detail-label">完整故事</div>' + storyHtml;
    if (card.warmth) {
      detailContent += '<div style="margin-top:10px;color:var(--accent);font-style:italic;font-size:0.85rem;">' + esc(card.warmth) + '</div>';
    }
  }

  var isFav = getFavorites().indexOf(card.id) !== -1;
  el.innerHTML =
    typeBadge +
    '<div class="card-main-content">' + mainContent + '</div>' +
    '<div class="card-detail"><div class="card-detail-inner">' + detailContent + '</div></div>' +
    '<div class="card-expand-hint"><span>点击卡片查看详情</span> <span class="arrow">&#9662;</span></div>' +
    '<div class="card-actions">' +
      '<button class="card-action-btn fav-btn ' + (isFav ? 'active' : '') + '">' +
        (isFav ? '\u2665 已收藏' : '\u2661 收藏') +
      '</button>' +
      '<button class="card-action-btn dislike-btn">不感兴趣</button>' +
    '</div>';

  // 展开详情
  el.addEventListener('click', function(e) {
    if (e.target.closest('.card-actions')) return;
    el.classList.toggle('expanded');
    var hint = el.querySelector('.card-expand-hint span:first-child');
    if (hint) hint.textContent = el.classList.contains('expanded') ? '收起详情' : '点击卡片查看详情';
  });

  // 收藏
  el.querySelector('.fav-btn').addEventListener('click', function(e) {
    e.stopPropagation();
    toggleFavorite(card.id, this);
  });

  // 不感兴趣
  el.querySelector('.dislike-btn').addEventListener('click', function(e) {
    e.stopPropagation();
    var disliked = getDisliked();
    if (disliked.indexOf(card.id) === -1) disliked.push(card.id);
    lsSet('disliked', disliked);
    el.style.opacity = '0';
    el.style.transform = 'translateX(20px)';
    setTimeout(function() {
      el.remove();
      // 补一张同类型卡片
      replaceCard(card, moodId);
    }, 300);
    showToast('已记录，下次不推荐这类内容');
  });

  return el;
}

function replaceCard(removedCard, moodId) {
  // 兼容AI卡片和本地卡片
  var cardType = removedCard.type;
  if (!cardType) {
    if (removedCard.id.indexOf('q') === 0) cardType = 'quote';
    else if (removedCard.id.indexOf('e') === 0) cardType = 'exercise';
    else cardType = 'story';
  }
  var pool;
  if (cardType === 'quote') pool = QUOTES;
  else if (cardType === 'exercise') pool = EXERCISES;
  else pool = STORIES;

  var replacement = pickCard(pool, moodId, sessionShownCards);
  if (replacement) {
    sessionShownCards.push(replacement.id);
    var container = document.getElementById('cards-container');
    container.appendChild(buildCardElement(replacement));
  }
}

function toggleFavorite(cardId, btn) {
  var favs = getFavorites();
  var idx = favs.indexOf(cardId);
  if (idx === -1) {
    favs.push(cardId);
    btn.classList.add('active');
    btn.innerHTML = '\u2665 已收藏';
    showToast('已收藏到我的治愈卡片');
  } else {
    favs.splice(idx, 1);
    btn.classList.remove('active');
    btn.innerHTML = '\u2661 收藏';
    showToast('已取消收藏');
  }
  lsSet('favorites', favs);
  updateFavBadge();
}

function updateFavBadge() {
  var favs = getFavorites();
  var badge = document.getElementById('fav-badge');
  if (favs.length > 0) {
    badge.textContent = '已收藏 ' + favs.length + ' 张';
    badge.style.display = 'inline-block';
  } else {
    badge.style.display = 'none';
  }
}

/* ==================== 推荐行动 ==================== */
function getCompletedActions() {
  var key = 'actions_' + todayStr();
  return lsGet(key) || [];
}
function setCompletedActions(arr) {
  lsSet('actions_' + todayStr(), arr);
}

var currentActionIndices = [];

async function renderActions(moodId) {
  if (moodId === undefined) moodId = getCurrentMood();
  var container = document.getElementById('actions-container');
  var mood = MOODS.filter(function(m) { return m.id === moodId; })[0];

  // AI接入点B：尝试AI生成行动建议
  if (window.NanHongAPI && NanHongAPI.isConfigured()) {
    container.innerHTML = '<div class="ai-loading"><span class="ai-spin"></span><span>正在为你思考合适的行动...</span></div>';
    try {
      var sysPrompt = '用户今天的情绪是"' + mood.label + '"。请推荐2个适合今天做的小行动，帮助用户改善情绪。\n返回JSON格式：\n[{"action": "行动建议", "reason": "为什么这个行动有帮助"}]';
      var userPrompt = '我今天心情' + mood.label + '，请推荐2个具体、可执行、温暖的小行动。';
      var response = await NanHongAPI.chat(sysPrompt, userPrompt, { temperature: 0.85, maxTokens: 800, timeout: 25000 });
      var data = parseAIJSON(response);
      if (data && Array.isArray(data) && data.length > 0) {
        container.innerHTML = '';
        renderAIActions(data);
        return;
      }
    } catch(e) {
      console.warn('[daily] AI生成行动建议失败，使用本地数据:', e.message);
    }
    showToast('AI暂不可用，已使用本地行动建议');
  }

  // Fallback：使用本地预置数据
  renderLocalActions(moodId);
}

function renderAIActions(actions) {
  var container = document.getElementById('actions-container');
  var completed = getCompletedActions();
  var picked = actions.slice(0, 2);
  currentActionIndices = picked;

  picked.forEach(function(act, i) {
    var isDone = completed.indexOf(i) !== -1;
    var actionText = typeof act === 'string' ? act : (act.action || '');
    var reason = (typeof act === 'object' && act.reason) ? act.reason : '';
    var item = document.createElement('div');
    item.className = 'action-item' + (isDone ? ' completed' : '');
    item.innerHTML =
      '<div class="action-checkbox">' +
        '<svg viewBox="0 0 16 16"><polyline points="3,8 7,12 13,4"/></svg>' +
      '</div>' +
      '<div class="action-content">' +
        '<div class="action-text">' + esc(actionText) + '</div>' +
        (reason ? '<div class="action-reason">' + esc(reason) + '</div>' : '') +
        (isDone ? '<div class="action-encourage">' + pickRandom(ENCOURAGEMENTS) + '</div>' : '') +
      '</div>';
    item.querySelector('.action-checkbox').addEventListener('click', function() {
      toggleAction(i, item);
    });
    container.appendChild(item);
  });
}

function renderLocalActions(moodId) {
  var container = document.getElementById('actions-container');
  container.innerHTML = '';
  var pool = ACTIONS[moodId] || ACTIONS[3];
  var shuffled = shuffle(pool);
  var picked = shuffled.slice(0, 2);
  currentActionIndices = picked;

  var completed = getCompletedActions();

  picked.forEach(function(action, i) {
    var isDone = completed.indexOf(i) !== -1;
    var item = document.createElement('div');
    item.className = 'action-item' + (isDone ? ' completed' : '');
    item.innerHTML =
      '<div class="action-checkbox">' +
        '<svg viewBox="0 0 16 16"><polyline points="3,8 7,12 13,4"/></svg>' +
      '</div>' +
      '<div class="action-content">' +
        '<div class="action-text">' + esc(action) + '</div>' +
        (isDone ? '<div class="action-encourage">' + pickRandom(ENCOURAGEMENTS) + '</div>' : '') +
      '</div>';
    item.querySelector('.action-checkbox').addEventListener('click', function() {
      toggleAction(i, item);
    });
    container.appendChild(item);
  });
}

function toggleAction(index, item) {
  var completed = getCompletedActions();
  if (completed.indexOf(index) !== -1) return; // 已完成不可取消
  completed.push(index);
  setCompletedActions(completed);
  item.classList.add('completed');
  var content = item.querySelector('.action-content');
  var enc = document.createElement('div');
  enc.className = 'action-encourage';
  enc.textContent = pickRandom(ENCOURAGEMENTS);
  content.appendChild(enc);
  showToast('完成了一个小行动，真棒！');
}

var selectedDiaryTags = [];

function renderDiaryTags() {
  var container = document.getElementById('diary-tags');
  container.innerHTML = '';
  DIARY_TAGS.forEach(function(tag) {
    var el = document.createElement('span');
    el.className = 'diary-tag';
    el.textContent = tag;
    el.addEventListener('click', function() {
      var idx = selectedDiaryTags.indexOf(tag);
      if (idx === -1) {
        selectedDiaryTags.push(tag);
        el.classList.add('selected');
      } else {
        selectedDiaryTags.splice(idx, 1);
        el.classList.remove('selected');
      }
    });
    container.appendChild(el);
  });
}

function getDiaries() { return lsGet('diaries') || []; }

function saveDiary() {
  var text = document.getElementById('diary-text').value.trim();
  if (!text) {
    showToast('写点什么再保存吧');
    return;
  }
  if (selectedDiaryTags.length === 0) {
    showToast('选一个情绪标签吧');
    return;
  }
  var diaries = getDiaries();
  var entry = {
    id: Date.now(),
    date: todayStr(),
    time: formatTime(),
    tags: selectedDiaryTags.slice(),
    content: text,
    aiFeedback: null
  };
  diaries.unshift(entry);
  if (diaries.length > 50) diaries = diaries.slice(0, 50);
  lsSet('diaries', diaries);

  // 清空输入
  document.getElementById('diary-text').value = '';
  selectedDiaryTags = [];
  renderDiaryTags();
  renderDiaryList();
  showToast('日记已保存，好好照顾自己');

  // AI接入点C：异步请求AI温暖回应（可选功能）
  requestDiaryAIFeedback(entry);
}

async function requestDiaryAIFeedback(entry) {
  if (!window.NanHongAPI || !NanHongAPI.isConfigured()) return;

  var entryEl = document.querySelector('.diary-entry[data-id="' + entry.id + '"]');
  if (!entryEl) return;

  var feedbackDiv = document.createElement('div');
  feedbackDiv.className = 'ai-feedback';
  feedbackDiv.innerHTML = '<div class="ai-feedback-label"><span class="ai-spin"></span> AI 正在温暖回应...</div>';
  entryEl.appendChild(feedbackDiv);

  try {
    var sysPrompt = '用户写了一段情绪日记：' + entry.content + '\n用户选择的情绪标签：' + entry.tags.join('、') + '\n请给用户一段温暖的回应（2-3句话），像一位理解你的朋友在回复你。不要给建议，只是共情和陪伴。';
    var userPrompt = '请温暖地回应我的日记。';
    var response = await NanHongAPI.chat(sysPrompt, userPrompt, { temperature: 0.9, maxTokens: 200, timeout: 20000 });
    var feedback = (response || '').trim();
    if (!feedback) { feedbackDiv.remove(); return; }

    feedbackDiv.innerHTML = '<div class="ai-feedback-label">&#10024; 来自AI的温暖回应</div><div>' + esc(feedback) + '</div>';

    // 持久化AI反馈
    var diaries = getDiaries();
    for (var i = 0; i < diaries.length; i++) {
      if (diaries[i].id === entry.id) { diaries[i].aiFeedback = feedback; break; }
    }
    lsSet('diaries', diaries);
  } catch(e) {
    console.warn('[daily] AI日记反馈失败:', e.message);
    feedbackDiv.remove();
  }
}

function renderDiaryList() {
  var diaries = getDiaries();
  var container = document.getElementById('diary-list');
  if (diaries.length === 0) {
    container.innerHTML = '<div class="diary-empty">还没有写过日记，试试记录今天的感受吧</div>';
    return;
  }
  var recent = diaries.slice(0, 7);
  var html = '<div class="diary-list-title">最近 ' + recent.length + ' 条日记</div>';
  recent.forEach(function(d) {
    var tagsHtml = d.tags.map(function(t) {
      return '<span class="diary-entry-tag">' + t + '</span>';
    }).join('');
    var summary = d.content.length > 120 ? d.content.substring(0, 120) + '...' : d.content;
    var feedbackHtml = '';
    if (d.aiFeedback) {
      feedbackHtml = '<div class="ai-feedback"><div class="ai-feedback-label">&#10024; 来自AI的温暖回应</div><div>' + esc(d.aiFeedback) + '</div></div>';
    }
    html +=
      '<div class="diary-entry" data-id="' + d.id + '">' +
        '<button class="diary-delete" title="删除">&times;</button>' +
        '<div class="diary-entry-header">' +
          '<span class="diary-entry-date">' + d.date + ' ' + d.time + '</span>' +
          '<div class="diary-entry-tags">' + tagsHtml + '</div>' +
        '</div>' +
        '<div class="diary-entry-content">' + summary + '</div>' +
        feedbackHtml +
      '</div>';
  });
  container.innerHTML = html;

  // 绑定删除
  container.querySelectorAll('.diary-delete').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var entry = this.closest('.diary-entry');
      var id = parseInt(entry.dataset.id);
      deleteDiary(id);
    });
  });
}

function deleteDiary(id) {
  var diaries = getDiaries();
  diaries = diaries.filter(function(d) { return d.id !== id; });
  lsSet('diaries', diaries);
  renderDiaryList();
  showToast('日记已删除');
}

  { id:'book4', slot:'midday', moods:[1,2,3], title:'《也许你该找个人聊聊》', author:'洛莉\u00B7戈特利布', summary:'一位心理治疗师讲述自己和来访者的故事，揭示：每个人都在挣扎，而倾诉本身就有疗愈的力量。', why:'如果你心里有很多话没人说，这本书会让你觉得：你不是一个人在扛。而且，说出来，会好很多。' },

  { id:'book7', slot:'evening', moods:[2,3,4], title:'《蛤蟆先生去看心理医生》', author:'罗伯特\u00B7戴博德', summary:'以童话形式讲述抑郁的蛤蟆先生通过心理咨询重新认识自己的过程，温柔地介绍心理学常识。', why:'如果你想了解自己的情绪却不知从何入手，这本小书会像一位老朋友，陪你慢慢看清自己。' }
];

/* ==================== 情绪画像 ==================== */
function getEmotionProfile() {
  try {
    var raw = localStorage.getItem('nanhong_emotion_profile');
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return buildEmotionProfile(getMoodRecords(), getDiaries());
}

function buildEmotionProfile(records, diaries) {
  var avgMood = 3;
  var recentMoods = [];
  var tagCount = {};
  if (records.length > 0) {
    var recent = records.slice(-10);
    var sum = 0;
    recent.forEach(function(r) { sum += r.mood; recentMoods.push(r.mood); });
    avgMood = Math.round(sum / recent.length);
  }
  if (diaries.length > 0) {
    diaries.slice(0, 10).forEach(function(d) {
      (d.tags || []).forEach(function(t) { tagCount[t] = (tagCount[t] || 0) + 1; });
    });
  }
  var sortedTags = Object.keys(tagCount).sort(function(a, b) { return tagCount[b] - tagCount[a]; });
  return {
    avgMood: avgMood,
    recentMoods: recentMoods,
    dominantEmotion: sortedTags[0] || null,
    emotionTags: sortedTags.slice(0, 3),
    needsComfort: avgMood <= 2,
    source: 'derived',
    updatedAt: todayStr()
  };
}

function profileToText(profile) {
  if (!profile) return '新用户，暂无情绪记录';
  var m = MOODS.filter(function(x) { return x.id === profile.avgMood; })[0];
  var parts = ['平均心情：' + (m ? m.label : '一般')];
  if (profile.dominantEmotion) parts.push('常记录情绪：' + profile.dominantEmotion);
  if (profile.emotionTags && profile.emotionTags.length > 1) parts.push('情绪标签：' + profile.emotionTags.join('、'));
  if (profile.needsComfort) parts.push('近期可能需要更多安抚');
  return parts.join('；');
}

/* ==================== 时段检测 ==================== */
function getCurrentTimeSlot() {
  var hour = new Date().getHours();
  for (var i = 0; i < TIME_SLOTS.length; i++) {
    if (hour >= TIME_SLOTS[i].range[0] && hour < TIME_SLOTS[i].range[1]) return TIME_SLOTS[i].id;
  }
  return 'evening';
}

var currentSlot = 'morning';

/* ==================== 时段治愈推荐 ==================== */
function renderTimeSlotTabs() {
  var container = document.getElementById('time-slot-tabs');
  container.innerHTML = '';
  TIME_SLOTS.forEach(function(slot) {
    var tab = document.createElement('button');
    tab.className = 'time-slot-tab' + (slot.id === currentSlot ? ' active' : '');
    tab.innerHTML = '<span class="tab-icon">' + slot.icon + '</span>' +
      '<span>' + slot.label + '</span>' +
      '<span class="tab-time">' + slot.time + '</span>';
    tab.addEventListener('click', function() {
      currentSlot = slot.id;
      renderTimeSlotTabs();
      renderTimeSlotContent();
    });
    container.appendChild(tab);
  });
}

function renderTimeSlotCurrent() {
  var el = document.getElementById('time-slot-current');
  var nowSlotId = getCurrentTimeSlot();
  var nowSlot = TIME_SLOTS.filter(function(s) { return s.id === nowSlotId; })[0];
  var viewSlot = TIME_SLOTS.filter(function(s) { return s.id === currentSlot; })[0];
  var isNow = currentSlot === nowSlotId;
  el.innerHTML = '<span>' + (isNow ? '当前时段' : '你正在浏览') + '</span>' +
    '<span>' + viewSlot.icon + ' ' + viewSlot.label + ' \u00B7 ' + viewSlot.desc + '</span>' +
    (isNow ? '<span class="now-tag">现在</span>' : '');
}

function renderPersonalizedHint(profile) {
  var area = document.getElementById('personalized-hint-area');
  if (!area) return;
  var hasMoodData = profile && profile.recentMoods && profile.recentMoods.length > 0;
  var hasEmotionData = profile && profile.dominantEmotion;
  if (!hasMoodData && !hasEmotionData) {
    area.innerHTML = '<div class="personalized-hint">\u{1F465} 签到心情后，内容会根据你的状态个性化推荐</div>';
    return;
  }
  var m = MOODS.filter(function(x) { return x.id === profile.avgMood; })[0];
  var hint = '已根据你的情绪画像（' + (m ? m.label : '一般');
  if (hasEmotionData) hint += '、常感' + profile.dominantEmotion;
  hint += '）为你匹配内容';
  area.innerHTML = '<div class="personalized-hint">\u{1F465} ' + esc(hint) + '</div>';
}

async function renderTimeSlotContent() {
  var container = document.getElementById('content-cards-container');
  var profile = getEmotionProfile();
  var moodId = getCurrentMood();

  renderTimeSlotCurrent();
  renderPersonalizedHint(profile);

  // AI接入点D：尝试AI生成个性化时段内容
  if (window.NanHongAPI && NanHongAPI.isConfigured()) {
    container.innerHTML = '<div class="ai-loading"><span class="ai-spin"></span><span>正在为你匹配专属治愈内容...</span></div>';
    try {
      var slot = TIME_SLOTS.filter(function(s) { return s.id === currentSlot; })[0];
      var mood = MOODS.filter(function(m) { return m.id === moodId; })[0];
      var profileText = profileToText(profile);
      var sysPrompt = '你是"难哄"平台的治愈内容策展人。用户当前浏览的时段是"' + slot.label + '"（' + slot.desc + '）。\n用户情绪画像：' + profileText + '。今日心情：' + mood.label + '。\n\n请为用户推荐3条治愈内容，类型分别为：\n1. 治愈系插画/摄影/漫画（用emoji和文字描绘一幅温暖画面）\n2. 经典文学金句（来自真实文学作品，附出处和温暖解读）\n3. 情绪成长类书籍推荐（真实书名、作者、简介、为什么适合该用户）\n\n返回JSON格式（用```json代码块包裹）：\n{\n  "contents": [\n    {\n      "type": "illustration|photography|comic|literature|book",\n      "slot": "' + currentSlot + '",\n      "title": "标题",\n      "emoji": "2-3个emoji",\n      "desc": "画面描述/书籍简介",\n      "quote": "金句内容（literature类型用）",\n      "author": "作者（literature/book用）",\n      "work": "出处作品（literature用）",\n      "interp": "金句解读（literature用）",\n      "summary": "书籍简介（book用）",\n      "why": "为什么适合用户（book用）",\n      "feeling": "画面感受关键词（illustration用）"\n    }\n  ]\n}';
      var userPrompt = '请根据我的情绪状态和当前时段，推荐3条治愈内容。';
      var response = await NanHongAPI.chat(sysPrompt, userPrompt, { temperature: 0.9, maxTokens: 2048, timeout: 30000 });
      var data = parseAIJSON(response);
      if (data && data.contents && Array.isArray(data.contents) && data.contents.length > 0) {
        container.innerHTML = '';
        data.contents.forEach(function(c) {
          container.appendChild(buildContentCard(c, true));
        });
        updateContentFavBadge();
        return;
      }
    } catch(e) {
      console.warn('[daily] AI生成时段内容失败，使用本地数据:', e.message);
    }
    showToast('AI暂不可用，已为你精选本地治愈内容');
  }

  renderLocalContent(currentSlot, moodId);
}

function renderLocalContent(slotId, moodId) {
  var container = document.getElementById('content-cards-container');
  container.innerHTML = '';

  var illustPool = ILLUSTRATIONS.filter(function(c) { return c.slot === slotId; });
  var litPool = LITERATURE_QUOTES.filter(function(c) { return c.slot === slotId; });
  var bookPool = BOOK_RECOMMENDATIONS.filter(function(c) { return c.slot === slotId; });

  function moodFilter(pool) {
    var filtered = pool.filter(function(c) { return c.moods.indexOf(moodId) !== -1; });
    return filtered.length > 0 ? filtered : pool;
  }

  var picked = [];
  var iP = moodFilter(illustPool);
  var lP = moodFilter(litPool);
  var bP = moodFilter(bookPool);
  if (iP.length > 0) picked.push(pickRandom(iP));
  if (lP.length > 0) picked.push(pickRandom(lP));
  if (bP.length > 0) picked.push(pickRandom(bP));

  if (picked.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:20px;color:var(--muted);font-size:0.88rem;">这个时段暂无更多内容</div>';
    updateContentFavBadge();
    return;
  }

  picked.forEach(function(card) {
    container.appendChild(buildContentCard(card, false));
  });
  updateContentFavBadge();
}

function buildContentCard(card, isAI) {
  var el = document.createElement('div');
  el.className = 'content-card';

  var cardId = isAI ? 'ai_c_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6) : card.id;
  var cardSlot = card.slot || currentSlot;
  var displayType = card.type || 'illustration';
  var typeLabel = '';
  var typeBadgeClass = '';

  if (displayType === 'photography') { typeLabel = '治愈摄影'; typeBadgeClass = 'type-badge-illustration'; }
  else if (displayType === 'comic') { typeLabel = '治愈漫画'; typeBadgeClass = 'type-badge-illustration'; }
  else if (displayType === 'illustration') { typeLabel = '治愈插画'; typeBadgeClass = 'type-badge-illustration'; }
  else if (displayType === 'literature') { typeLabel = '文学金句'; typeBadgeClass = 'type-badge-literature'; }
  else if (displayType === 'book') { typeLabel = '书籍推荐'; typeBadgeClass = 'type-badge-book'; }

  var cardData = {
    id: cardId, type: displayType, typeLabel: typeLabel, slot: cardSlot,
    title: card.title || '', emoji: card.emoji || '', desc: card.desc || card.summary || '',
    source: card.source || '', interp: card.interp || '', author: card.author || '',
    why: card.why || '', feeling: card.feeling || '', quote: card.quote || '', work: card.work || '',
    isAI: isAI
  };
  el.dataset.cardId = cardId;
  el._cardData = cardData;

  var slotObj = TIME_SLOTS.filter(function(s) { return s.id === cardSlot; })[0];
  var slotBadge = '<span class="slot-badge slot-' + cardSlot + '">' + (slotObj ? slotObj.icon + ' ' + slotObj.label : '') + '</span>';
  var typeBadge = '<span class="card-type-badge ' + typeBadgeClass + '">' + typeLabel + '</span>';

  var body = '';
  if (displayType === 'illustration' || displayType === 'photography' || displayType === 'comic') {
    body = '<div class="illust-visual">' + esc(card.emoji || '') + '</div>' +
      '<div class="illust-title">' + esc(card.title || '') + '</div>' +
      '<div class="illust-desc">' + esc(card.desc || '') + '</div>' +
      (card.feeling ? '<div class="illust-feeling">感受：' + esc(card.feeling) + '</div>' : '');
  } else if (displayType === 'literature') {
    body = '<div class="lit-quote">"' + esc(card.quote || card.desc || '') + '"</div>' +
      '<div class="lit-source">— ' + esc(card.author || '') + (card.work ? ' ' + esc(card.work) : '') + '</div>' +
      (card.interp ? '<div class="lit-interp">' + esc(card.interp) + '</div>' : '');
  } else if (displayType === 'book') {
    body = '<div class="book-title">' + esc(card.title || '') + '</div>' +
      '<div class="book-author">' + esc(card.author || '') + '</div>' +
      '<div class="book-summary">' + esc(card.desc || card.summary || '') + '</div>' +
      (card.why ? '<div class="book-why"><span class="book-why-label">为什么适合你：</span>' + esc(card.why) + '</div>' : '');
  }

  var isFav = false;
  var favs = getContentFavorites();
  for (var i = 0; i < favs.length; i++) {
    if (favs[i].id === cardId) { isFav = true; break; }
  }

  el.innerHTML =
    '<div class="content-card-top"><div class="content-card-badges">' + slotBadge + typeBadge + '</div></div>' +
    body +
    '<div class="content-card-actions">' +
      '<button class="card-action-btn fav-btn ' + (isFav ? 'active' : '') + '">' +
        (isFav ? '\u2665 已收藏' : '\u2661 收藏') +
      '</button>' +
    '</div>';

  el.querySelector('.fav-btn').addEventListener('click', function(e) {
    e.stopPropagation();
    toggleContentFavorite(cardData, this);
  });

  return el;
}

/* ==================== 内容收藏 ==================== */
function getContentFavorites() { return lsGet('content_favorites') || []; }

function toggleContentFavorite(cardData, btn) {
  var favs = getContentFavorites();
  var idx = -1;
  for (var i = 0; i < favs.length; i++) {
    if (favs[i].id === cardData.id) { idx = i; break; }
  }
  if (idx === -1) {
    favs.unshift({
      id: cardData.id, type: cardData.type, typeLabel: cardData.typeLabel, slot: cardData.slot,
      title: cardData.title, emoji: cardData.emoji, desc: cardData.desc, source: cardData.source,
      interp: cardData.interp, author: cardData.author, why: cardData.why, feeling: cardData.feeling,
      quote: cardData.quote, work: cardData.work,
      savedAt: new Date().toISOString()
    });
    btn.classList.add('active');
    btn.innerHTML = '\u2665 已收藏';
    showToast('已收藏到我的治愈内容');
  } else {
    favs.splice(idx, 1);
    btn.classList.remove('active');
    btn.innerHTML = '\u2661 收藏';
    showToast('已取消收藏');
  }
  lsSet('content_favorites', favs);
  updateContentFavBadge();
  renderFavoritesList();
}

function updateContentFavBadge() {
  var favs = getContentFavorites();
  var badge = document.getElementById('content-fav-badge');
  if (!badge) return;
  if (favs.length > 0) {
    badge.textContent = '已收藏 ' + favs.length + ' 条';
    badge.style.display = 'inline-block';
  } else {
    badge.style.display = 'none';
  }
}

function renderFavoritesList() {
  var container = document.getElementById('fav-list-container');
  if (!container) return;
  var favs = getContentFavorites();

  if (favs.length === 0) {
    container.innerHTML = '<div class="fav-empty">还没有收藏内容，去上方遇到喜欢的治愈内容，点收藏吧</div>';
    return;
  }

  var html = '<div class="fav-list">';
  favs.forEach(function(f) {
    var slotObj = TIME_SLOTS.filter(function(s) { return s.id === f.slot; })[0];
    var slotIcon = slotObj ? slotObj.icon : '';
    var slotLabel = slotObj ? slotObj.label : '';
    var preview = '';
    if (f.type === 'illustration' || f.type === 'photography' || f.type === 'comic') {
      preview = (f.emoji ? f.emoji + ' ' : '') + (f.title || '');
    } else if (f.type === 'literature') {
      preview = '"' + (f.quote || f.desc || '') + '" — ' + (f.author || '');
    } else if (f.type === 'book') {
      preview = (f.title || '') + (f.author ? ' \u00B7 ' + f.author : '');
    }
    html +=
      '<div class="fav-item" data-id="' + esc(f.id) + '">' +
        '<div class="fav-item-content">' +
          '<div class="fav-item-title">' + esc(f.typeLabel || '治愈内容') + ' \u00B7 ' + esc(slotIcon + ' ' + slotLabel) + '</div>' +
          '<div class="fav-item-preview">' + esc(preview) + '</div>' +
        '</div>' +
        '<button class="fav-remove" title="取消收藏">&times;</button>' +
      '</div>';
  });
  html += '</div>';
  container.innerHTML = html;

  container.querySelectorAll('.fav-remove').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var item = this.closest('.fav-item');
      removeContentFavorite(item.dataset.id);
    });
  });
}

function removeContentFavorite(id) {
  var favs = getContentFavorites();
  favs = favs.filter(function(f) { return f.id !== id; });
  lsSet('content_favorites', favs);
  updateContentFavBadge();
  renderFavoritesList();
  var cardEl = document.querySelector('.content-card[data-card-id="' + id + '"]');
  if (cardEl) {
    var btn = cardEl.querySelector('.fav-btn');
    if (btn) { btn.classList.remove('active'); btn.innerHTML = '\u2661 收藏'; }
  }
  showToast('已取消收藏');
}

/* ==================== 初始化 ==================== */
function init() {
  // API状态徽章 & 设置链接
  var statusArea = document.getElementById('api-status-area');
  if (statusArea && window.NanHongAPI) {
    statusArea.innerHTML = NanHongAPI.getStatusBadge() + '<a href="./settings.html" class="api-settings-link">设置</a>';
  }

  // 心情签到
  renderMoodButtons();
  var todayMood = getTodayMood();
  if (todayMood !== null) {
    renderMoodConfirm(todayMood);
  }

  // 心情统计
  renderStats();

  // 治愈卡片（async，后台加载）
  renderCards(getCurrentMood());

  // 推荐行动（async，后台加载）
  renderActions(getCurrentMood());

  // 情绪日记
  renderDiaryTags();
  renderDiaryList();

  // 时段治愈推荐（async，后台加载）
  currentSlot = getCurrentTimeSlot();
  renderTimeSlotTabs();
  renderTimeSlotContent();

  // 我的收藏
  renderFavoritesList();
  updateContentFavBadge();

  // 事件绑定
  document.getElementById('diary-save-btn').addEventListener('click', saveDiary);
  document.getElementById('refresh-cards').addEventListener('click', function() {
    renderCards(getCurrentMood()).then(function() {
      showToast('已为你换了一批新卡片');
    });
  });
  document.getElementById('refresh-actions').addEventListener('click', function() {
    renderActions(getCurrentMood()).then(function() {
      showToast('已为你换了新的行动建议');
    });
  });
  document.getElementById('refresh-content').addEventListener('click', function() {
    renderTimeSlotContent().then(function() {
      showToast('已为你换了一批新内容');
    });
  });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
