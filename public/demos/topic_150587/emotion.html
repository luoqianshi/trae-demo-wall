var STORAGE_KEY = 'nanhong_emotion_v1';

var state = {
  currentStep: 0,
  phase: 'questionnaire', /* questionnaire | loading | draft | final */
  basicInfo: {
    nickname: '', ageRange: '', gender: '', mbti: '', zodiac: '', workStatus: []
  },
  answers: {
    step1: [], step2: [], step3: [], step4: [],
    step5: '', step6: [], step7: [], step8: ''
  },
  otherTexts: { step1:'', step2:'', step3:'', step4:'', step6:'', step7:'' },
  report: null,
  visibility: 'public'
};

function save(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
}
function load(){
  try {
    var s = localStorage.getItem(STORAGE_KEY);
    if(s){
      var parsed = JSON.parse(s);
      state = parsed;
      if(!state.basicInfo) state.basicInfo = {nickname:'',ageRange:'',gender:'',mbti:'',zodiac:'',workStatus:[]};
      if(!state.answers) state.answers = {step1:[],step2:[],step3:[],step4:[],step5:'',step6:[],step7:[],step8:''};
      if(!state.otherTexts) state.otherTexts = {step1:'',step2:'',step3:'',step4:'',step6:'',step7:''};
      if(!state.phase) state.phase = 'questionnaire';
      if(!state.visibility) state.visibility = 'public';
    }
  } catch(e){}
}
function resetState(){
  state = {
    currentStep: 0, phase: 'questionnaire',
    basicInfo: {nickname:'',ageRange:'',gender:'',mbti:'',zodiac:'',workStatus:[]},
    answers: {step1:[],step2:[],step3:[],step4:[],step5:'',step6:[],step7:[],step8:''},
    otherTexts: {step1:'',step2:'',step3:'',step4:'',step6:'',step7:''},

  };

}

/* ==================== DOM引用 ==================== */
var $main = document.getElementById('main');
var $stepNum = document.getElementById('stepNum');
var $progressFill = document.getElementById('progressFill');
var $progressWrap = document.getElementById('progressWrap');

/* ==================== 渲染：进度条 ==================== */
function renderProgress(){
  if(state.phase === 'loading'){
    $progressWrap.style.display = 'none';
    return;
  }
  $progressWrap.style.display = '';
  if(state.phase === 'final'){
    $stepNum.textContent = '8';
    $progressFill.style.width = '100%';
  } else if(state.phase === 'draft'){
    $stepNum.textContent = '8';
    $progressFill.style.width = '100%';
  } else {
    $stepNum.textContent = state.currentStep;
    $progressFill.style.width = (state.currentStep / 8 * 100) + '%';
  }
}

/* ==================== 渲染：主入口 ==================== */
function render(){
  renderProgress();
  if(state.phase === 'questionnaire'){
    if(state.currentStep === 0){
      $main.innerHTML = renderBasicInfo();
    } else if(state.currentStep >= 1 && state.currentStep <= 7){
      $main.innerHTML = renderQuestion(state.currentStep);
    } else if(state.currentStep === 8){
      $main.innerHTML = renderStep8();
    }
  } else if(state.phase === 'loading'){
    $main.innerHTML = renderLoading();
  } else if(state.phase === 'draft'){
    $main.innerHTML = renderDraft();
  } else if(state.phase === 'final'){
    $main.innerHTML = renderFinal();
  }
  $main.scrollTop = 0;
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ==================== 渲染：问卷步骤 ==================== */
function renderQuestion(stepNum){
  var q = QUESTIONS[stepNum - 1];
  var stepKey = 'step' + stepNum;
  var answers = state.answers[stepKey] || [];
  var isMulti = q.type === 'multi';
  var allOpts = q.options.slice();
  if(isMulti) allOpts.push(OTHER_LABEL);

  var html = '<div class="step-content">';
  html += '<div class="step-header">';
  html += '<span class="step-badge">Step ' + stepNum + ' / 8</span>';
  html += '<h2 class="step-title">' + q.title + '</h2>';
  html += '<p class="step-subtitle">' + q.subtitle + '</p>';
  html += '<p class="step-desc">' + q.desc + '</p>';
  html += '</div>';

  html += '<div class="options">';
  allOpts.forEach(function(opt){
    var selected = isMulti ? (answers.indexOf(opt) > -1) : (answers === opt);
    var checkType = isMulti ? 'option-check' : 'option-radio';
    var checkContent = (isMulti && selected) ? '✓' : '';
    html += '<div class="option' + (selected?' selected':'') + '" data-step="' + stepNum + '" data-option="' + esc(opt) + '">';
    html += '<span class="' + checkType + '">' + checkContent + '</span>';
    html += '<span class="option-label">' + opt + '</span>';
    html += '</div>';

    /* "其他"展开区域 */
    if(opt === OTHER_LABEL && isMulti){
      var otherText = state.otherTexts[stepKey] || '';
      html += '<div class="other-expand' + (selected?' open':'') + '">';
      html += '<input type="text" class="other-input" placeholder="请补充你的答案..." value="' + esc(otherText) + '" data-step="' + stepNum + '" maxlength="50">';
      html += '</div>';
    }
  });
  html += '</div>';

  /* 导航按钮 */
  html += '<div class="btn-group">';
  html += '<button class="btn btn-secondary" data-action="prev">← 上一步</button>';
  if(stepNum < 7){
    html += '<button class="btn btn-primary" data-action="next">下一步 →</button>';
  } else {
    html += '<button class="btn btn-primary" data-action="next">下一步 →</button>';
  }
  html += '</div>';
  html += '</div>';
  return html;
}

function renderCard(r, isDraft){

  var html = '<div class="emotion-card">';

  html += '<div class="card-header-row">';
  html += '<span class="card-label">情绪名片</span>';

    html += '<div class="visibility-control">';
    html += '<span class="vis-btn' + (state.visibility==='public'?' active':'') + '" data-vis="public">🌍公开</span>';
    html += '<span class="vis-btn' + (state.visibility==='friends'?' active':'') + '" data-vis="friends">👥好友</span>';
    html += '<span class="vis-btn' + (state.visibility==='private'?' active':'') + '" data-vis="private">🔒自己</span>';

  }
  html += '</div>';

  /* 昵称 */
  html += '<div class="card-name">' + esc(cd.nickname) + '</div>';

  /* 标签 */
  html += '<div class="card-tags">';
  cd.tags.forEach(function(t){
    html += '<span class="card-tag">' + esc(t) + '</span>';
  });
  html += '</div>';

  /* 情绪雷区 */
  if(cd.triggers.length){
    html += '<div class="card-section">';
    html += '<div class="card-section-head"><span class="card-section-icon">⚡</span><span class="card-section-title">情绪雷区</span></div>';

      html += '<span class="card-item danger">' + esc(t) + '</span>';

/* ==================== 格式化回答（供AI分析） ==================== */
function formatAnswers(){
  var bi = state.basicInfo;
  var a = state.answers;
  var lines = [];

  lines.push('姓名/昵称：' + (bi.nickname || '未填写'));
  lines.push('年龄段：' + (bi.ageRange || '未填写'));
  lines.push('性别：' + (bi.gender || '未填写'));
  lines.push('MBTI：' + (bi.mbti || '未填写'));
  lines.push('星座：' + (bi.zodiac || '未填写'));
  lines.push('工作生活状态：' + ((bi.workStatus || []).join('、') || '未填写'));
  lines.push('');

  function processStep(stepKey, stepNum, title){
    var items = (a[stepKey] || []).slice();
    var otherText = state.otherTexts[stepKey];
    if(otherText && otherText.trim()){
      items.push('其他：' + otherText.trim());
    }
    return '步骤' + stepNum + ' - ' + title + '：' + (items.length > 0 ? items.join('、') : '未选择');
  }

  lines.push(processStep('step1', 1, '情绪雷区（什么事情会让你情绪炸毛）'));
  lines.push(processStep('step2', 2, '安抚方式（什么能让你平复）'));
  lines.push(processStep('step3', 3, '求救信号（需要关心时如何表达）'));
  lines.push(processStep('step4', 4, '开心密码（什么能让你开心）'));
  lines.push('步骤5 - 冷静期需求（冲突后需要怎样冷静）：' + (a.step5 || '未选择'));
  lines.push(processStep('step6', 6, '沟通偏好（希望对方怎样做）'));
  lines.push(processStep('step7', 7, '禁忌行为（无法接受的行为）'));
  lines.push('步骤8 - 补充说明：' + (a.step8 || '无'));

  return lines.join('\n');
}

/* ==================== AI报告生成引擎（本地规则，作为fallback） ==================== */
function generateReportFallback(){

  return {

    strengths: genStrengths(),

  };

/* ==================== AI报告生成引擎（接入大模型API） ==================== */
async function generateReport(){
  var fallback = generateReportFallback();

  var systemPrompt = [
    '你是"难哄"平台的情绪分析专家。用户完成了情绪说明书问卷，请根据用户的回答，生成一份个性化、有温度的情绪分析报告。',
    '',
    '请以JSON格式返回，结构严格如下（不要包含markdown代码块标记，直接返回纯JSON）：',
    '{',
    '  "profile": ["段落1", "段落2", "段落3"],',
    '  "strengths": ["优势1", "优势2", "优势3"],',
    '  "growth": ["建议1", "建议2", "建议3"],',
    '  "relationships": {',
    '    "intimate": "亲密关系建议",',
    '    "workplace": "职场关系建议",',
    '    "family": "家庭关系建议"',
    '  },',
    '  "riskWarning": "风险提示文字，如果没有风险则为空字符串",',
    '  "usageInstruction": "一句话使用说明"',
    '}',
    '',
    '字段说明：',
    '- profile: 用2-3段文字描述这个人的情绪特点，包括性格倾向、情绪触发模式、自我调节方式等。要具体、个性化，不要泛泛而谈。',
    '- strengths: 列出3-4个情绪方面的优势，每个用一句话描述。',
    '- growth: 给出3-4条具体的、可执行的成长建议，帮助用户更好地管理情绪和沟通。',
    '- relationships.intimate: 针对亲密关系的建议。',
    '- relationships.workplace: 针对职场关系的建议。',
    '- relationships.family: 针对家庭关系的建议。',
    '- riskWarning: 如果用户的回答中透露出潜在的心理风险（如极端情绪、自我否定倾向等），给出温和的提示和建议。如果没有风险，返回空字符串。',
    '- usageInstruction: 一句话告诉别人如何与这个人相处，格式如"和XXX沟通时，..."，其中XXX为用户的昵称。',
    '',
    '请用中文回答，语气温暖、专业、有同理心，像一位理解你的朋友在给你写信。只返回JSON，不要包含其他内容。'
  ].join('\n');

  var userPrompt = formatAnswers();

  var report = await NanHongAPI.chatJSON(systemPrompt, userPrompt, function(){
    return fallback;
  }, { maxTokens: 3000, temperature: 0.85 });

  /* 如果返回的是字符串（JSON解析失败），使用fallback */
  if(typeof report === 'string'){
    report = fallback;
  }

  /* 验证并填充缺失字段 */
  report.profile = (Array.isArray(report.profile) && report.profile.length > 0) ? report.profile : fallback.profile;
  report.strengths = (Array.isArray(report.strengths) && report.strengths.length > 0) ? report.strengths : fallback.strengths;
  report.growth = (Array.isArray(report.growth) && report.growth.length > 0) ? report.growth : fallback.growth;

  if(!report.relationships || typeof report.relationships !== 'object'){
    report.relationships = fallback.relationships;
  } else {
    if(!report.relationships.intimate) report.relationships.intimate = fallback.relationships.intimate;
    if(!report.relationships.workplace) report.relationships.workplace = fallback.relationships.workplace;
    if(!report.relationships.family) report.relationships.family = fallback.relationships.family;
  }

  if(!report.riskWarning){
    report.riskWarning = null;
  }
  if(!report.usageInstruction){
    report.usageInstruction = fallback.usageInstruction;
  }

  /* Part A（情绪名片卡）使用本地结构化数据 */
  report.cardData = buildCardData();

  return report;
}

/* --- 情绪特征画像 --- */
function genProfile(){
  var bi = state.basicInfo;
  var a = state.answers;
  var parts = [];

  /* Part 1: 开头（年龄+工作状态） */
  parts.push(genOpening());

  /* Part 2: MBTI描述 */
  if(bi.mbti && bi.mbti !== '不确定' && MBTI_DESC[bi.mbti]){
    parts.push(MBTI_DESC[bi.mbti]);
  }

  /* Part 3: 情绪敏感度 */
  var triggerCount = (a.step1 || []).length;
  parts.push(genSensitivity(triggerCount));

  /* Part 4: 安抚类型分析 */
  parts.push(genSoothingAnalysis(a.step2 || []));

  /* Part 5: 补充说明 */
  if(a.step8 && a.step8.trim()){
    parts.push('你还特别提到：「' + a.step8.trim() + '」\n\n这份补充很重要，它反映了你内心深处最真实的需求。记住，能把它写出来，说明你对自己的情绪有很好的觉察。让信任的人也知道这一点，会让你们的关系更加贴近。');
  }

  return parts;
}

function genOpening(){
  var bi = state.basicInfo;
  var ws = bi.workStatus || [];
  var genderPrefix = '';
  if(bi.gender === '女') genderPrefix = '一位';
  else if(bi.gender === '男') genderPrefix = '一位';
  else genderPrefix = '';

  var agePart = bi.ageRange ? bi.ageRange + '的' : '';
  var rolePart = '';

  if(ws.indexOf('加班频繁') > -1){
    rolePart = '处于高频运转的工作节奏中，你的情绪系统承受着持续的负荷。高强度的工作让你习惯了"先处理事情，再处理情绪"，但那些被搁置的情绪并没有消失，而是在悄悄积累。';
  } else if(ws.indexOf('创业中') > -1){
    rolePart = '正处于创业阶段，不确定性是你的日常。这种状态让你的情绪如同过山车——时而充满激情，时而焦虑不安。你需要比常人更强的情绪调节能力来应对各种突发状况。';
  } else if(ws.indexOf('求职中') > -1){
    rolePart = '正在寻找新的职业方向，等待和不确定感可能是你当前最大的情绪挑战。在这个阶段，自我怀疑和焦虑容易找上门，但也正是重新认识自己的好时机。';
  } else if(ws.indexOf('学生') > -1){
    rolePart = '仍处于求学阶段，你正在经历自我认知和情绪模式成型的关键期。学业压力、人际探索、未来迷茫——这些都在塑造着你的情绪反应方式。';
  } else if(ws.indexOf('自由职业') > -1){
    rolePart = '过着自由职业的生活，时间灵活但也意味着缺少明确的工作-休息边界。情绪容易在"过度投入"和"过度放松"之间摇摆，自律和自我关怀同样重要。';
  } else if(ws.indexOf('工作稳定') > -1){
    rolePart = '拥有相对稳定的工作节奏，这给了你处理情绪的空间和余力。但稳定也意味着情绪的积累可能更隐蔽——那些"还好"的日子下，可能藏着未被表达的真实感受。';
  } else if(ws.indexOf('独居') > -1){
    rolePart = '独居的状态给了你充足的自我消化空间，但也可能让情绪在封闭中放大。没有室友或家人的即时反馈，你更容易陷入自我对话的情绪漩涡。';
  } else if(ws.indexOf('恋爱中') > -1){
    rolePart = '处于恋爱中，亲密关系是你当前情绪波动的重要来源。甜蜜和摩擦交织，你在关系中不断探索着自己的情绪边界和需求。';
  } else if(ws.indexOf('已婚') > -1){
    rolePart = '已婚的状态意味着你的情绪与另一个人深度绑定。日常的磨合、沟通的频率、彼此的情绪状态，都在持续影响着你的情绪体验。';
  } else {
    rolePart = '你的情绪模式正在各种生活角色的交织中不断演化。';
  }

  var prefix = '';
  if(genderPrefix && agePart){
    prefix = '作为' + genderPrefix + agePart + '你，';
  } else if(agePart){
    prefix = '作为' + agePart + '你，';
  } else if(genderPrefix){
    prefix = '作为' + genderPrefix + '你，';
  } else {
    prefix = '你';
  }

  return prefix + rolePart;
}

function genSensitivity(count){
  if(count >= 8){
    return '从你选择的情绪雷区来看（共' + count + '个），你的情绪感知力较为敏锐。这意味着你对关系中的细微变化有着高度觉察——这既是你的天赋（你能共情很多别人感受不到的东西），也可能是你的负担（容易在别人还没意识到的时候就受伤）。学会区分"被触发"和"真正受伤"，会帮助你不被情绪淹没。';
  } else if(count >= 4){
    return '从你选择的情绪雷区来看（共' + count + '个），你的情绪感知处于适中水平，既不是钝感型也不是高敏型。你能感受到情绪的波动，但也保留了一定的缓冲空间。这种平衡感是一种优势——你既不会因为太敏感而内耗，也不会因为太钝感而错过重要的信号。';
  } else if(count >= 1){
    return '从你选择的情绪雷区来看（共' + count + '个），你的情绪阈值相对较高，不容易被日常小事触发情绪反应。这说明你有较好的情绪稳定性，但也需要注意——有时候"不生气"不等于"没受伤"，那些被你忽略的小情绪可能在积累。定期check-in自己的感受，会让你的情绪系统更健康。';
  } else {
    return '你暂时没有标记明确的情绪雷区，这要么说明你目前处于情绪平稳期，要么可能是你习惯性地忽略了自己的感受。不妨在日常生活中多留意一下：哪些时刻让你心里"咯噔"了一下？那些就是你的情绪信号。';
  }
}

function genSoothingAnalysis(soothing){
  var internal = ['独处冷静','写下来','空间+时间','听音乐'];
  var external = ['被人倾听','肢体安慰（拥抱等）','被认可"你有权利生气"','对方先道歉','给我一个台阶','有人陪着但不说话'];
  var action = ['吃好吃的','运动发泄'];

  var iCount = 0, eCount = 0, aCount = 0;
  soothing.forEach(function(s){
    if(internal.indexOf(s) > -1) iCount++;
    if(external.indexOf(s) > -1) eCount++;
    if(action.indexOf(s) > -1) aCount++;
  });

  if(iCount > eCount && iCount > 0){
    return '在安抚方式上，你更偏向"内向型"——你需要自己的空间来消化情绪，外界的过多介入反而会让你更烦躁。这不是冷漠，而是你自我修复的方式。但也要记得，适度的依赖不是软弱，偶尔让别人走进来，会让关系更深。';
  } else if(eCount > iCount && eCount > 0){
    return '在安抚方式上，你更偏向"外向型"——你需要通过和外界的互动来平复情绪，被看见、被回应是你情绪复原的关键。这种特质让你在关系中有很强的连接感，但也可以尝试培养一些独自安抚的能力，这样在独处时也不会太脆弱。';
  } else if(iCount > 0 || eCount > 0){
    return '在安抚方式上，你呈现出"混合型"特征——有时候你需要自己的空间，有时候你又渴望被理解和回应。这种灵活性说明你对自己的情绪需求有较好的觉察，能在不同情境下调用不同的安抚策略。';
  } else {
    return '在安抚方式上，你似乎还没有形成明确的偏好。这其实意味着你还在探索什么对自己最有效——不妨多尝试不同的方式，慢慢建立起自己的"情绪急救包"。';
  }
}

/* --- 优势分析 --- */
function genStrengths(){
  var bi = state.basicInfo;
  var a = state.answers;
  var pool = [];

  var triggerCount = (a.step1 || []).length;
  var taboos = a.step7 || [];
  var soothing = a.step2 || [];
  var signals = a.step3 || [];
  var comm = a.step6 || [];
  var calmDown = a.step5 || '';

  /* 1. 情绪觉察力 */
  if(triggerCount >= 6){
    pool.push('情绪觉察力强：你能识别出很多情绪触发点，这说明你对自己的内心世界有深入的观察和了解。很多人终其一生都不知道自己为什么不舒服，而你已经迈出了最关键的一步——看见。');
  } else if(triggerCount >= 3){
    pool.push('情绪边界意识好：你能识别出若干情绪触发点，说明你对自我的边界有一定认知。这种"知道什么会让自己不舒服"的能力，是情绪健康的基础。');
  }

  /* 2. 自我调节意识 */
  if(soothing.indexOf('独处冷静') > -1 || soothing.indexOf('写下来') > -1 || soothing.indexOf('空间+时间') > -1){
    pool.push('自我调节意识好：你知道如何给自己空间来消化情绪，这种"不依赖外界即时回应"的能力是一种成熟的情绪管理方式。你不会把自己的情绪完全寄托在别人身上，这是很健康的边界感。');
  }

  /* 3. 沟通直接坦诚 */
  if(signals.indexOf('直接说') > -1){
    pool.push('沟通方式直接坦诚：在需要关心时你会选择直接表达，这避免了"猜心游戏"带来的误解和消耗。直接不等于粗暴——你愿意打开自己让别人看见，这本身就是一种勇气。');
  }

  /* 4. 情绪边界清晰 */
  if(taboos.length <= 4 && taboos.length > 0){
    pool.push('情绪边界清晰且适度：你标记的禁忌行为不多但很明确，这说明你知道自己的底线在哪里，同时没有过度设防。这种"有原则但不僵化"的边界感，是健康关系的基石。');
  }

  /* 5. 善于寻求支持 */
  if(soothing.indexOf('被人倾听') > -1 || soothing.indexOf('对方先道歉') > -1){
    pool.push('善于寻求支持：你允许自己在脆弱时依赖他人，这不是软弱，而是一种重要的情绪能力。知道"我需要被倾听"并敢于表达，比独自硬扛要健康得多。');
  }

  /* 6. 有自我反思习惯 */
  if(a.step8 && a.step8.trim()){
    pool.push('有自我反思习惯：你在补充说明中写下了内心真实的想法，这种自我梳理和表达的习惯非常宝贵。能把感受具象化为文字，说明你对自己的情绪有深层的理解和反思能力。');
  }

  /* 7. 恢复力强 */

/* --- 构建名片数据 --- */
function buildCardData(){
  var bi = state.basicInfo;
  var a = state.answers;

  /* 标签 */
  var tags = [];
  if(bi.ageRange) tags.push(bi.ageRange);
  if(bi.gender && bi.gender !== '不愿透露') tags.push(bi.gender);
  if(bi.mbti && bi.mbti !== '不确定') tags.push(bi.mbti);
  if(bi.zodiac && bi.zodiac !== '不关注') tags.push(bi.zodiac + '座');
  (bi.workStatus || []).forEach(function(w){ tags.push(w); });

  /* 各维度取前4个 + 其他 */
  function processItems(stepKey, max){
    var items = (a[stepKey] || []).slice();
    var otherText = state.otherTexts[stepKey];
    var hasOther = items.indexOf(OTHER_LABEL) > -1;
    if(hasOther){
      items = items.filter(function(x){ return x !== OTHER_LABEL; });
      if(otherText && otherText.trim()){
        items.push('其他：' + otherText.trim());
      }
    }
    return items.slice(0, max || 4);
  }

  return {
    nickname: bi.nickname || '匿名用户',
    tags: tags,
    triggers: processItems('step1', 4),
    soothing: processItems('step2', 4),
    signals: processItems('step3', 3),
    happiness: processItems('step4', 3),
    taboos: processItems('step7', 3)
  };
}

/* ==================== 工具函数 ==================== */
function esc(s){
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ==================== 事件处理 ==================== */
function handleClick(e){
  var target = e.target;

  /* 选项点击 */
  var option = target.closest('.option');
  if(option){
    var stepNum = parseInt(option.dataset.step);
    var opt = option.dataset.option;
    toggleOption(stepNum, opt, option);
    return;
  }

  /* Pill点击（基础信息） */
  var pill = target.closest('.pill');
  if(pill){
    var group = pill.closest('.pill-group') || pill.closest('.mbti-grid');
    if(group){
      var field = group.dataset.field;
      var isMulti = group.dataset.multi === '1';
      var value = pill.dataset.value;
      togglePill(field, value, isMulti, pill);
      return;
    }
  }

  /* 可见范围 */
  var visBtn = target.closest('.vis-btn');
  if(visBtn){
    state.visibility = visBtn.dataset.vis;
    save();
    render();
    return;
  }

  /* 动作按钮 */
  var actionBtn = target.closest('[data-action]');
  if(actionBtn){
    var action = actionBtn.dataset.action;
    handleAction(action, actionBtn).catch(function(e){
      console.error('[emotion] handleAction error:', e);
    });
    return;
  }
}

function handleInput(e){
  var target = e.target;

  /* 昵称 */
  if(target.id === 'nickname'){
    state.basicInfo.nickname = target.value;
    save();
    return;
  }

  /* 其他文本 */
  if(target.classList.contains('other-input')){
    var stepNum = parseInt(target.dataset.step);
    state.otherTexts['step' + stepNum] = target.value;
    save();
    return;
  }

  /* Step 8 文本 */
  if(target.id === 'step8-text'){
    state.answers.step8 = target.value;
    var countEl = document.getElementById('charCount');
    if(countEl) countEl.textContent = target.value.length;
    save();
    return;
  }
}

function toggleOption(stepNum, opt, el){
  var stepKey = 'step' + stepNum;
  var q = QUESTIONS[stepNum - 1];
  var isMulti = q.type === 'multi';

  if(isMulti){
    var arr = state.answers[stepKey] || [];
    var idx = arr.indexOf(opt);
    if(idx > -1){
      arr.splice(idx, 1);
      el.classList.remove('selected');
      var check = el.querySelector('.option-check');
      if(check) check.textContent = '';
    } else {
      arr.push(opt);
      el.classList.add('selected');
      var check2 = el.querySelector('.option-check');
      if(check2) check2.textContent = '✓';
    }
    state.answers[stepKey] = arr;

    /* 处理"其他"展开 */
    if(opt === OTHER_LABEL){
      var expand = el.nextElementSibling;
      if(expand && expand.classList.contains('other-expand')){
        if(arr.indexOf(OTHER_LABEL) > -1){
          expand.classList.add('open');
          setTimeout(function(){
            var input = expand.querySelector('.other-input');
            if(input) input.focus();
          }, 300);
        } else {
          expand.classList.remove('open');
        }
      }
    }
  } else {
    /* 单选 */
    state.answers[stepKey] = opt;
    /* 更新DOM */
    var siblings = el.parentNode.querySelectorAll('.option');
    siblings.forEach(function(s){
      s.classList.remove('selected');
      var r = s.querySelector('.option-radio');
      if(r) r.innerHTML = '';
    });
    el.classList.add('selected');
  }

  save();
}

function togglePill(field, value, isMulti, el){
  if(isMulti){
    var arr = state.basicInfo[field] || [];
    var idx = arr.indexOf(value);
    if(idx > -1){
      arr.splice(idx, 1);
      el.classList.remove('active');
    } else {
      arr.push(value);
      el.classList.add('active');
    }
    state.basicInfo[field] = arr;
  } else {
    state.basicInfo[field] = value;
    /* 更新DOM */
    var siblings = el.parentNode.querySelectorAll('.pill');
    siblings.forEach(function(s){ s.classList.remove('active'); });
    el.classList.add('active');
  }
  save();
}

async function handleAction(action, btn){
  switch(action){
    case 'next-from-basic':
      if(!state.basicInfo.nickname || !state.basicInfo.nickname.trim()){
        showInlineError(btn, '请先填写昵称');
        return;
      }
      state.currentStep = 1;
      save();
      render();
      break;
    case 'next':
      if(state.currentStep < 8){
        state.currentStep++;
        save();
        render();
      }
      break;
    case 'prev':
      if(state.currentStep > 0){
        state.currentStep--;
        save();
        render();
      }
      break;
    case 'generate':
      state.phase = 'loading';
      save();
      render();
      try {
        state.report = await generateReport();
        state.phase = 'draft';
        save();
        render();
      } catch(err) {
        console.error('[emotion] 生成报告失败:', err);
        state.phase = 'questionnaire';
        state.currentStep = 8;
        save();
        render();
        if(window.NanHongAPI){
          NanHongAPI.toast('生成报告失败，请重试: ' + (err.message || err), 'error');
        }
      }
      break;
    case 'confirm':
      state.phase = 'final';
      save();
      render();
      showConfetti();
      break;
    case 'modify':
      state.phase = 'questionnaire';
      state.currentStep = 1;
      state.report = null;
      save();
      render();
      break;
    case 'restart':
      if(confirm('确定要重新填写吗？当前的所有数据将被清除。')){
        resetState();
        render();
      }
      break;
    case 'toggle-report':
      var body = document.getElementById('collapseBody');
      if(body){
        if(body.style.maxHeight === '0px' || body.style.maxHeight === ''){
          body.style.maxHeight = body.scrollHeight + 'px';
          btn.classList.add('open');
          btn.querySelector('span:first-child').textContent = '收起完整AI分析报告';
        } else {
          body.style.maxHeight = '0px';
          btn.classList.remove('open');
          btn.querySelector('span:first-child').textContent = '查看完整AI分析报告';
        }
      }
      break;
  }
}

function showInlineError(btn, msg){
  var existing = btn.parentNode.querySelector('.error-msg');
  if(existing) existing.remove();
  var err = document.createElement('div');
  err.className = 'error-msg';
  err.textContent = msg;
  btn.parentNode.insertBefore(err, btn.nextSibling);
  setTimeout(function(){ if(err.parentNode) err.remove(); }, 3000);
}

function showConfetti(){
  var colors = ['#E8826B','#5BA5A0','#C9A96E','#F4C4B5','#B8DCDA','#FBEAE4'];
  var container = document.createElement('div');
  container.className = 'confetti-container';
  for(var i = 0; i < 60; i++){
    var piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = Math.random() * 0.5 + 's';
    piece.style.animationDuration = (1.2 + Math.random() * 1.2) + 's';
    piece.style.width = (6 + Math.random() * 8) + 'px';
    piece.style.height = (6 + Math.random() * 8) + 'px';
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    container.appendChild(piece);
  }
  document.body.appendChild(container);
  setTimeout(function(){
    if(container.parentNode) container.remove();
  }, 3500);
}

/* ==================== 初始化 ==================== */
function init(){
  load();
  /* 渲染API状态徽章和设置链接 */
  var apiStatusEl = document.getElementById('apiStatus');
  if(apiStatusEl && window.NanHongAPI){
    apiStatusEl.innerHTML = NanHongAPI.getStatusBadge() +
      '<a href="./settings.html" style="font-size:12px;color:var(--text-sub);text-decoration:none;display:inline-flex;align-items:center;gap:0.2rem;">' +
      '<span>\u2699</span> API设置</a>';
  }
  /* 如果有已确认的报告，显示最终状态 */
  if(state.phase === 'draft' && !state.report){
    state.phase = 'questionnaire';
    state.currentStep = 0;
  }
  if(state.phase === 'final' && !state.report){
    state.phase = 'questionnaire';
    state.currentStep = 0;
  }
  render();

  /* 事件绑定 */
  $main.addEventListener('click', handleClick);
  $main.addEventListener('input', handleInput);
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
</body>
</html>
