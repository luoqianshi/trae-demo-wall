<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心声电台 - 你的AI情感陪伴</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%; max-width: 860px; height: 92vh;
            background: white; border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* ---- Header ---- */
        .header {
            background: linear-gradient(135deg, #ff6b6b 0%, #f8a44c 100%);
            padding: 16px 24px;
            display: flex; align-items: center; color: white; position: relative;
            flex-shrink: 0;
        }
        .back-btn {
            position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            background: rgba(255,255,255,0.25); border: none; color: white;
            width: 38px; height: 38px; border-radius: 50%; font-size: 18px;
            cursor: pointer; transition: background 0.3s;
            display: flex; align-items: center; justify-content: center;
        }
        .back-btn:hover { background: rgba(255,255,255,0.45); }
        .header-content { flex: 1; text-align: center; }
        .header-content h1 { font-size: 2em; margin-bottom: 4px; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        .header-content p { font-size: 0.95em; opacity: 0.9; }
        .nav-btn {
            position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
            background: rgba(255,255,255,0.25); border: none; color: white;
            width: 38px; height: 38px; border-radius: 50%; font-size: 18px;
            cursor: pointer; transition: background 0.3s;
            display: flex; align-items: center; justify-content: center;
        }
        .nav-btn:hover { background: rgba(255,255,255,0.45); }

        /* ---- Chat View ---- */
        .chat-view { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .chat-container { flex: 1; padding: 20px; overflow-y: auto; background: #f8f9fa; }
        .message { margin-bottom: 16px; display: flex; flex-direction: column; }
        .message.user { align-items: flex-end; }
        .message.ai { align-items: flex-start; }
        .message-bubble {
            max-width: 72%; padding: 14px 18px; border-radius: 20px;
            font-size: 15px; line-height: 1.6; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .message.user .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border-bottom-right-radius: 5px;
        }
        .message.ai .message-bubble { background: white; color: #333; border-bottom-left-radius: 5px; }
        .emotion-tag { font-size: 11px; padding: 4px 10px; border-radius: 10px; margin-top: 4px; display: inline-block; }
        .emotion-tag.positive { background: #d4edda; color: #155724; }
        .emotion-tag.negative { background: #f8d7da; color: #721c24; }
        .emotion-tag.neutral { background: #e2e3e5; color: #383d41; }
        .input-area { padding: 16px 20px; background: white; border-top: 1px solid #eee; flex-shrink: 0; }
        .input-wrapper { display: flex; gap: 10px; }
        .input-wrapper input {
            flex: 1; padding: 14px 18px; border: 2px solid #eee;
            border-radius: 25px; font-size: 15px; outline: none; transition: border-color 0.3s;
        }
        .input-wrapper input:focus { border-color: #667eea; }
        .input-wrapper button {
            padding: 14px 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 25px;
            font-size: 15px; cursor: pointer; transition: transform 0.2s;
        }
        .input-wrapper button:hover { transform: scale(1.05); }
        .typing-indicator {
            display: none; padding: 14px 18px; background: white;
            border-radius: 20px; border-bottom-left-radius: 5px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08); align-self: flex-start;
        }
        .typing-dots { display: flex; gap: 5px; }
        .typing-dots span {
            width: 8px; height: 8px; background: #667eea; border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }
        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing { 0%,80%,100%{transform:scale(0)} 40%{transform:scale(1)} }

        /* ---- Recommend Card ---- */
        .recommend-card {
            max-width: 85%; margin-top: 10px; background: white;
            border-radius: 16px; padding: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        .recommend-card h4 { font-size: 14px; color: #888; margin-bottom: 12px; font-weight: normal; }
        .recommend-section { margin-bottom: 12px; }
        .recommend-section:last-child { margin-bottom: 0; }
        .recommend-section-title { font-size: 13px; color: #999; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .recommend-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .recommend-link {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 14px; background: #f5f5f5; border-radius: 20px;
            text-decoration: none; color: #333; font-size: 14px;
            transition: all 0.2s; border: 1px solid #eee;
        }
        .recommend-link:hover { background: #667eea; color: white; border-color: #667eea; }
        .recommend-link .link-icon { font-size: 16px; }
        .literature-block {
            background: linear-gradient(135deg, #fdf6e3 0%, #fef9ef 100%);
            border-radius: 12px; padding: 14px 18px; border-left: 3px solid #f8a44c;
        }
        .literature-text { font-size: 15px; line-height: 1.8; color: #555; font-style: italic; }
        .literature-source { font-size: 13px; color: #aaa; margin-top: 6px; text-align: right; font-style: normal; }

        /* ---- Dashboard View ---- */
        .dashboard-view {
            flex: 1; overflow-y: auto; padding: 24px; background: #f8f9fa;
            display: none;
        }
        .dashboard-view.active { display: block; }
        .chat-view.active { display: flex; }

        .section-title {
            font-size: 18px; font-weight: 600; color: #333;
            margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
        }

        /* Emotion Curve */
        .chart-card {
            background: white; border-radius: 16px; padding: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 24px;
        }
        .chart-card canvas { width: 100%; }

        /* Calendar */
        .calendar-card {
            background: white; border-radius: 16px; padding: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 24px;
        }
        .calendar-nav {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
        }
        .calendar-nav button {
            background: #f0f0f0; border: none; width: 32px; height: 32px;
            border-radius: 50%; cursor: pointer; font-size: 16px; transition: background 0.2s;
        }
        .calendar-nav button:hover { background: #ddd; }
        .calendar-nav span { font-size: 16px; font-weight: 600; color: #333; }
        .calendar-grid {
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center;
        }
        .calendar-grid .day-header { font-size: 12px; color: #999; padding: 8px 0; }
        .calendar-grid .day-cell {
            padding: 8px 0; border-radius: 10px; font-size: 13px;
            position: relative; min-height: 44px; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
        }
        .calendar-grid .day-cell.empty { background: transparent; }
        .calendar-grid .day-cell .day-num { font-weight: 500; color: #555; }
        .calendar-grid .day-cell .day-dot {
            width: 8px; height: 8px; border-radius: 50%; margin-top: 2px;
        }
        .day-dot.positive { background: #28a745; }
        .day-dot.negative { background: #dc3545; }
        .day-dot.neutral { background: #ffc107; }
        .day-dot.default { background: #6c757d; }
        .day-cell.today { background: #fff3e0; }

        /* Insight Card */
        .insight-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px; padding: 24px; color: white;
            box-shadow: 0 4px 16px rgba(102,126,234,0.3); margin-bottom: 24px;
        }
        .insight-card h3 { font-size: 17px; margin-bottom: 12px; }
        .insight-card p { font-size: 14px; line-height: 1.7; opacity: 0.95; margin-bottom: 16px; }
        .insight-btn {
            display: inline-block; padding: 10px 20px; background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.4); border-radius: 20px;
            color: white; text-decoration: none; font-size: 14px;
            cursor: pointer; transition: background 0.2s;
        }
        .insight-btn:hover { background: rgba(255,255,255,0.35); }

        /* Milestones */
        .milestone-card {
            background: white; border-radius: 16px; padding: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 24px;
        }
        .badges-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
        .badge-item {
            display: flex; flex-direction: column; align-items: center;
            padding: 16px; border-radius: 14px; min-width: 100px;
            transition: transform 0.2s;
        }
        .badge-item:hover { transform: scale(1.05); }
        .badge-item.locked { background: #f0f0f0; opacity: 0.5; }
        .badge-item.unlocked-7 { background: linear-gradient(135deg, #a8e063, #56ab2f); }
        .badge-item.unlocked-14 { background: linear-gradient(135deg, #f7971e, #ffd200); }
        .badge-item.unlocked-30 { background: linear-gradient(135deg, #e44d26, #f16529); }
        .badge-icon { font-size: 36px; margin-bottom: 8px; }
        .badge-label { font-size: 13px; font-weight: 600; color: white; }
        .badge-item.locked .badge-label { color: #999; }
        .milestone-summary {
            font-size: 14px; line-height: 1.7; color: #555;
            padding: 14px; background: #f8f9fa; border-radius: 12px;
        }
        .milestone-summary strong { color: #667eea; }

        /* ---- Care Modal ---- */
        .care-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 2000;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.4s;
        }
        .care-overlay.show { opacity: 1; pointer-events: auto; }
        .care-modal {
            background: white; border-radius: 20px; padding: 36px;
            max-width: 400px; text-align: center; transform: translateY(20px);
            transition: transform 0.4s; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .care-overlay.show .care-modal { transform: translateY(0); }
        .care-modal .care-icon { font-size: 48px; margin-bottom: 16px; }
        .care-modal h3 { font-size: 20px; color: #333; margin-bottom: 12px; }
        .care-modal p { font-size: 15px; color: #666; line-height: 1.7; margin-bottom: 20px; }
        .care-modal button {
            padding: 12px 32px;
            background: linear-gradient(135deg, #ff6b6b 0%, #f8a44c 100%);
            color: white; border: none; border-radius: 25px;
            font-size: 15px; cursor: pointer; transition: transform 0.2s;
        }
        .care-modal button:hover { transform: scale(1.05); }

        /* ---- Welcome ---- */
        .welcome-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #0a0a2a 0%, #1a1a4e 50%, #2a2a6a 100%);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; transition: opacity 0.5s; opacity: 1;
            overflow: hidden;
        }
        .welcome-screen.hidden { opacity: 0; pointer-events: none; }
        
        /* Stars effect */
        .welcome-screen::before,
        .welcome-screen::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .welcome-screen::before {
            background: 
                radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.8) 0%, transparent 100%),
                radial-gradient(1px 1px at 40% 70%, rgba(255,255,255,0.6) 0%, transparent 100%),
                radial-gradient(1px 1px at 60% 20%, rgba(255,255,255,0.7) 0%, transparent 100%),
                radial-gradient(1px 1px at 80% 50%, rgba(255,255,255,0.5) 0%, transparent 100%),
                radial-gradient(1px 1px at 10% 60%, rgba(255,255,255,0.9) 0%, transparent 100%),
                radial-gradient(1px 1px at 50% 40%, rgba(255,255,255,0.6) 0%, transparent 100%),
                radial-gradient(1px 1px at 70% 80%, rgba(255,255,255,0.8) 0%, transparent 100%),
                radial-gradient(1px 1px at 30% 10%, rgba(255,255,255,0.7) 0%, transparent 100%),
                radial-gradient(1px 1px at 90% 40%, rgba(255,255,255,0.5) 0%, transparent 100%),
                radial-gradient(1px 1px at 15% 80%, rgba(255,255,255,0.6) 0%, transparent 100%),
                radial-gradient(1px 1px at 55% 15%, rgba(255,255,255,0.9) 0%, transparent 100%),
                radial-gradient(1px 1px at 75% 55%, rgba(255,255,255,0.7) 0%, transparent 100%);
            animation: twinkle 4s ease-in-out infinite alternate;
        }
        .welcome-screen::after {
            background: 
                radial-gradient(1px 1px at 25% 25%, rgba(255,255,255,0.4) 0%, transparent 100%),
                radial-gradient(1px 1px at 45% 65%, rgba(255,255,255,0.3) 0%, transparent 100%),
                radial-gradient(1px 1px at 65% 35%, rgba(255,255,255,0.5) 0%, transparent 100%),
                radial-gradient(1px 1px at 85% 75%, rgba(255,255,255,0.2) 0%, transparent 100%),
                radial-gradient(1px 1px at 5% 45%, rgba(255,255,255,0.6) 0%, transparent 100%),
                radial-gradient(1px 1px at 35% 85%, rgba(255,255,255,0.3) 0%, transparent 100%),
                radial-gradient(1px 1px at 55% 55%, rgba(255,255,255,0.4) 0%, transparent 100%),
                radial-gradient(1px 1px at 95% 15%, rgba(255,255,255,0.5) 0%, transparent 100%);
            animation: twinkle 6s ease-in-out infinite alternate-reverse;
        }
        
        @keyframes twinkle {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        
        /* Moon */
        .moon {
            position: absolute;
            top: 15%;
            right: 15%;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #fff8dc 0%, #fffacd 50%, #fff8dc 100%);
            box-shadow: 
                0 0 30px rgba(255,250,205,0.4),
                0 0 60px rgba(255,250,205,0.2),
                inset 0 0 20px rgba(255,255,255,0.3);
            animation: moonGlow 8s ease-in-out infinite;
        }
        .moon-shadow {
            position: absolute;
            top: -5px;
            left: 20px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a1a4e 0%, #2a2a6a 100%);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
        }
        
        @keyframes moonGlow {
            0%, 100% { 
                box-shadow: 
                    0 0 30px rgba(255,250,205,0.4),
                    0 0 60px rgba(255,250,205,0.2),
                    inset 0 0 20px rgba(255,255,255,0.3);
            }
            50% { 
                box-shadow: 
                    0 0 40px rgba(255,250,205,0.6),
                    0 0 80px rgba(255,250,205,0.3),
                    inset 0 0 25px rgba(255,255,255,0.4);
            }
        }
        .welcome-content { text-align: center; color: white; }
        .welcome-content h1 {
            font-size: 4em; margin-bottom: 16px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
        }
        .welcome-content p { font-size: 1.4em; margin-bottom: 28px; opacity: 0.9; }
        .welcome-content .start-btn {
            padding: 18px 48px; font-size: 1.2em; background: white;
            color: #ff6b6b; border: none; border-radius: 30px;
            cursor: pointer; transition: transform 0.2s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .welcome-content .start-btn:hover { transform: scale(1.05); }
        .features { display: flex; justify-content: center; gap: 30px; margin-top: 36px; }
        .feature-item { text-align: center; }
        .feature-item .icon { font-size: 3em; margin-bottom: 8px; }
        .feature-item span { font-size: 15px; }

        /* ---- Scrollbar ---- */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
    </style>
</head>
<body>

<!-- ============ Welcome Screen ============ -->
<div class="welcome-screen" id="welcomeScreen">
    <!-- Moon -->
    <div class="moon">
        <div class="moon-shadow"></div>
    </div>
    <div class="welcome-content">
        <h1>心声电台</h1>
        <p>你的AI情感陪伴，在这里倾听你的每一个心声</p>
        <div class="features">
            <div class="feature-item"><div class="icon">💝</div><span>情感支持</span></div>
            <div class="feature-item"><div class="icon">🌙</div><span>深夜陪伴</span></div>
            <div class="feature-item"><div class="icon">🎯</div><span>心理疏导</span></div>
        </div>
        <br><br>
        <button class="start-btn" onclick="startChat()">开始对话</button>
    </div>
</div>

<!-- ============ Care Modal ============ -->
<div class="care-overlay" id="careOverlay">
    <div class="care-modal">
        <div class="care-icon">🤗</div>
        <h3 id="careTitle">昨晚没来记录，是不是太累了？</h3>
        <p id="careText">今天好吗？无论发生了什么，我都在这里等你。</p>
        <button onclick="closeCare()">我回来了 ❤️</button>
    </div>
</div>

<!-- ============ Main Container ============ -->
<div class="container">
    <div class="header">
        <button class="back-btn" id="backBtn" onclick="handleBack()" title="返回">&#8592;</button>
        <div class="header-content">
            <h1 id="headerTitle">心声电台</h1>
            <p id="headerSubtitle">在这里，每一个声音都值得被听见</p>
        </div>
        <button class="nav-btn" id="navBtn" onclick="toggleDashboard()" title="心情日志">📊</button>
    </div>

    <!-- Chat View -->
    <div class="chat-view active" id="chatView">
        <div class="chat-container" id="chatContainer">
            <div class="message ai">
                <div class="message-bubble">
                    你好！我是心声电台的AI陪伴师。无论你想聊什么，我都会在这里倾听你。今天有什么想分享的吗？
                </div>
                <div class="emotion-tag positive">温暖问候</div>
            </div>
            <div class="typing-indicator" id="typingIndicator">
                <div class="typing-dots"><span></span><span></span><span></span></div>
            </div>
        </div>
        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="输入你想说的话..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">发送</button>
            </div>
        </div>
    </div>

    <!-- Dashboard View -->
    <div class="dashboard-view" id="dashboardView">
        <!-- Emotion Curve -->
        <div class="section-title">📈 情绪曲线</div>
        <div class="chart-card">
            <canvas id="emotionChart" height="200"></canvas>
        </div>

        <!-- Calendar -->
        <div class="section-title">📅 心情日历</div>
        <div class="calendar-card">
            <div class="calendar-nav">
                <button onclick="changeMonth(-1)">&#8249;</button>
                <span id="calendarTitle"></span>
                <button onclick="changeMonth(1)">&#8250;</button>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>

        <!-- Weekly Insight -->
        <div class="section-title">💡 情绪洞察</div>
        <div class="insight-card" id="insightCard">
            <h3>本周心情小结</h3>
            <p id="insightText">继续记录你的心情，周日会为你生成专属洞察哦~</p>
            <button class="insight-btn" id="insightBtn" style="display:none" onclick="playInsightPlaylist()">🎵 查看为你整理的本周专属歌单</button>
        </div>

        <!-- Milestones -->
        <div class="section-title">🏆 情绪里程碑</div>
        <div class="milestone-card">
            <div class="badges-row" id="badgesRow"></div>
            <div class="milestone-summary" id="milestoneSummary">开始每天记录心情，解锁属于你的里程碑吧！</div>
        </div>
    </div>
</div>

<script>
/* =============================================
   Data Layer — localStorage
   ============================================= */
const STORAGE_KEY = 'xinsheng_radio_data';

function loadData() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
    } catch(e) {}
    return { records: [], lastVisit: null, usualHour: 22 };
}

function saveData(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function addRecord(emotion, text) {
    const data = loadData();
    const now = new Date();
    const dateStr = now.getFullYear() + '-' +
        String(now.getMonth()+1).padStart(2,'0') + '-' +
        String(now.getDate()).padStart(2,'0');
    const timeStr = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');

    data.records.push({ date: dateStr, time: timeStr, emotion, text });
    data.lastVisit = now.toISOString();
    // Compute usual hour from records
    if (data.records.length >= 3) {
        const hours = data.records.map(r => parseInt(r.time.split(':')[0]));
        const avg = Math.round(hours.reduce((a,b)=>a+b,0) / hours.length);
        data.usualHour = avg;
    }
    saveData(data);
    checkMilestones(data);
    return data;
}

/* =============================================
   Emotion Keywords & Responses
   ============================================= */
const emotionKeywords = {
    positive: ['开心','快乐','高兴','幸福','喜欢','爱','美好','棒','好','赞','感谢','谢谢','希望','太好了','不错','满足'],
    negative: ['难过','伤心','痛苦','害怕','担心','焦虑','压力','孤独','寂寞','累','疲倦','失望','绝望','崩溃','烦','烦躁','无助','失眠'],
    neutral: ['感觉','觉得','认为','可能','也许','大概','不知道','想','思考','一般','还行','还好','平常']
};

const aiResponses = {
    positive: [
        "听到你这么说真开心！你的快乐也感染了我呢~",
        "太好了！保持这份美好的心情，今天一定会是美好的一天！",
        "你的积极态度真的很棒！有什么特别让你开心的事情想分享吗？"
    ],
    negative: [
        "我理解你现在可能不太舒服。愿意和我多聊聊吗？我会一直在这里听你说。",
        "有时候生活确实会给我们带来压力。深呼吸，我在这里陪着你。",
        "你的感受很重要。如果你想倾诉，我会认真听的。"
    ],
    neutral: [
        "嗯，我明白你的意思。可以再多说一些吗？",
        "我在认真听呢。还有什么想和我分享的吗？",
        "谢谢你的分享。我很好奇更多关于你的想法。"
    ],
    default: [
        "我在听呢，继续说吧。",
        "嗯嗯，然后呢？",
        "我理解你的感受。"
    ]
};

function analyzeEmotion(text) {
    let p=0, n=0, u=0;
    emotionKeywords.positive.forEach(w => { if(text.includes(w)) p++; });
    emotionKeywords.negative.forEach(w => { if(text.includes(w)) n++; });
    emotionKeywords.neutral.forEach(w => { if(text.includes(w)) u++; });
    if(p>n && p>u) return 'positive';
    if(n>p && n>u) return 'negative';
    if(u>0) return 'neutral';
    return 'default';
}

function getAIResponse(emotion) {
    const r = aiResponses[emotion] || aiResponses.default;
    return r[Math.floor(Math.random()*r.length)];
}

    return [...arr].sort(()=>0.5-Math.random()).slice(0, n);
}

function sendMessage() {
    const input = document.getElementById('userInput');
    const message = input.value.trim();
    if (!message) return;

    addMessage(message, 'user');
    input.value = '';

    showTypingIndicator();

    setTimeout(() => {
        hideTypingIndicator();
        const emotion = analyzeEmotion(message);
        const response = getAIResponse(emotion);
        addMessage(response, 'ai', emotion);

        // Record emotion
        addRecord(emotion, message);

        // Show recommend card
        setTimeout(() => {
            const chatContainer = document.getElementById('chatContainer');
            const typingIndicator = document.getElementById('typingIndicator');
            chatContainer.insertBefore(buildRecommendCard(emotion), typingIndicator);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }, 400);
    }, 800 + Math.random()*800);
}

function addMessage(text, sender, emotion=null) {
    const chatContainer = document.getElementById('chatContainer');
    const typingIndicator = document.getElementById('typingIndicator');
    const div = document.createElement('div');
    div.className = `message ${sender}`;
    div.innerHTML = `<div class="message-bubble">${text}</div>`;
    if (emotion && sender==='ai') {
        const labels = {positive:'积极情绪',negative:'需要关怀',neutral:'平静交流',default:'倾听中'};
        div.innerHTML += `<div class="emotion-tag ${emotion}">${labels[emotion]||'倾听中'}</div>`;
    }
    chatContainer.insertBefore(div, typingIndicator);
    chatContainer.scrollTop = chatContainer.scrollHeight;
}

function showTypingIndicator() {
    const ind = document.getElementById('typingIndicator');
    ind.style.display = 'block';
    document.getElementById('chatContainer').scrollTop = document.getElementById('chatContainer').scrollHeight;
}
function hideTypingIndicator() { document.getElementById('typingIndicator').style.display = 'none'; }
function handleKeyPress(e) { if(e.key==='Enter') sendMessage(); }

function checkCarePush() {
    const data = loadData();
    if (!data.lastVisit || data.records.length < 3) return;

    const last = new Date(data.lastVisit);
    const now = new Date();
    const daysDiff = Math.floor((now - last) / 86400000);
    const currentHour = now.getHours();

    // If last visit was yesterday and user usually records around now
    if (daysDiff >= 1) {
        const usualHour = data.usualHour || 22;
        // If it's past their usual time, or it's the next day
        if (daysDiff === 1 && currentHour >= usualHour) return; // still time today
        if (daysDiff >= 1) {
            const titles = [
                "昨晚没来记录，是不是太累了？",
                "好几天没见你了，最近还好吗？",
                "想你了，今天好吗？"
            ];
            const texts = [
                "今天好吗？无论发生了什么，我都在这里等你。",
                "生活中有时会特别忙碌，记得照顾好自己。",
                "无论开心还是难过，随时都可以来找我聊聊。"
            ];
            const idx = daysDiff >= 3 ? 2 : daysDiff >= 2 ? 1 : 0;
            document.getElementById('careTitle').textContent = titles[idx];
            document.getElementById('careText').textContent = texts[idx];
            document.getElementById('careOverlay').classList.add('show');
        }
    }
}

function closeCare() {
    document.getElementById('careOverlay').classList.remove('show');
    // Update lastVisit so we don't keep showing
    const data = loadData();
    data.lastVisit = new Date().toISOString();
    saveData(data);
}

/* ---- Emotion Curve ---- */
function renderEmotionChart() {
    const canvas = document.getElementById('emotionChart');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.parentElement.getBoundingClientRect();
    const w = rect.width - 40;
    const h = 180;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.scale(dpr, dpr);

    const data = loadData();
    const today = new Date();
    const days = 14; // last 14 days
    const points = [];

    for (let i = days-1; i >= 0; i--) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        const ds = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
        const dayRecords = data.records.filter(r => r.date === ds);
        let avg = null;
        if (dayRecords.length > 0) {
            const vals = dayRecords.map(r => emotionValue[r.emotion] || 2);
            avg = vals.reduce((a,b)=>a+b,0) / vals.length;
        }
        points.push({ date: ds, label: (d.getMonth()+1)+'/'+d.getDate(), value: avg });
    }

    // Clear
    ctx.clearRect(0, 0, w, h);

    const padL = 40, padR = 20, padT = 20, padB = 30;
    const chartW = w - padL - padR;
    const chartH = h - padT - padB;

    // Grid lines
    ctx.strokeStyle = '#eee';
    ctx.lineWidth = 1;
    for(let v=1; v<=3; v++) {
        const y = padT + chartH - ((v-1)/2) * chartH;
        ctx.beginPath();
        ctx.moveTo(padL, y);
        ctx.lineTo(padL+chartW, y);
        ctx.stroke();

        ctx.fillStyle = '#bbb';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'right';
        const labels = {1:'低落',2:'平静',3:'开心'};
        ctx.fillText(labels[v], padL-6, y+4);
    }

    // Draw line
    const validPoints = points.filter(p => p.value !== null);
    if (validPoints.length < 2) {
        ctx.fillStyle = '#ccc';
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('继续记录心情，曲线会在这里展示哦~', w/2, h/2);
        return;
    }

    ctx.strokeStyle = '#667eea';
    ctx.lineWidth = 2.5;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    points.forEach((p, i) => {
        if (p.value === null) return;
        const x = padL + (i / (days-1)) * chartW;
        const y = padT + chartH - ((p.value - 1) / 2) * chartH;
        if (i === 0 || points.slice(0, i).every(pp => pp.value === null)) {
            ctx.moveTo(x, y);
        } else {
            ctx.lineTo(x, y);
        }
    });
    ctx.stroke();

    // Gradient fill
    const grad = ctx.createLinearGradient(0, padT, 0, padT+chartH);
    grad.addColorStop(0, 'rgba(102,126,234,0.2)');
    grad.addColorStop(1, 'rgba(102,126,234,0.02)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    let firstValid = true;
    points.forEach((p, i) => {
        if (p.value === null) return;
        const x = padL + (i / (days-1)) * chartW;
        const y = padT + chartH - ((p.value - 1) / 2) * chartH;
        if (firstValid) { ctx.moveTo(x, padT+chartH); ctx.lineTo(x, y); firstValid = false; }
        else ctx.lineTo(x, y);
    });
    // Close back down
    for (let i = points.length-1; i>=0; i--) {
        if (points[i].value === null) continue;
        const x = padL + (i / (days-1)) * chartW;
        ctx.lineTo(x, padT+chartH);
        break;
    }
    ctx.closePath();
    ctx.fill();

    // Dots and x-labels
    points.forEach((p, i) => {
        const x = padL + (i / (days-1)) * chartW;
        // X label
        ctx.fillStyle = '#999';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'center';
        if (i % 2 === 0 || i === days-1) {
            ctx.fillText(p.label, x, h - 6);
        }
        if (p.value === null) return;
        const y = padT + chartH - ((p.value - 1) / 2) * chartH;
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI*2);
        ctx.fillStyle = emotionColor[points[i] ? Object.keys(emotionValue).find(k=>emotionValue[k]===Math.round(p.value))||'default' : 'default'] || '#667eea';
        ctx.fill();
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 2;
        ctx.stroke();
    });
}

/* ---- Calendar ---- */
function renderCalendar() {
    const data = loadData();
    const grid = document.getElementById('calendarGrid');
    const title = document.getElementById('calendarTitle');
    const y = calendarYear, m = calendarMonth;
    title.textContent = `${y}年${m+1}月`;

    const firstDay = new Date(y, m, 1).getDay();
    const daysInMonth = new Date(y, m+1, 0).getDate();
    const today = new Date();

    let html = '';
    const headers = ['日','一','二','三','四','五','六'];
    headers.forEach(h => html += `<div class="day-header">${h}</div>`);

    // Build emotion map for this month
    const emotionMap = {};
    data.records.forEach(r => {
        if (r.date.startsWith(`${y}-${String(m+1).padStart(2,'0')}`)) {
            const day = parseInt(r.date.split('-')[2]);
            // Last record of the day wins
            emotionMap[day] = r.emotion;
        }
    });

    // Empty cells before first day
    for(let i=0; i<firstDay; i++) html += '<div class="day-cell empty"></div>';

    for(let d=1; d<=daysInMonth; d++) {
        const isToday = (y===today.getFullYear() && m===today.getMonth() && d===today.getDate());
        const emo = emotionMap[d];
        const dotHtml = emo ? `<div class="day-dot ${emo}"></div>` : '';
        html += `<div class="day-cell ${isToday?'today':''}"><span class="day-num">${d}</span>${dotHtml}</div>`;
    }

    grid.innerHTML = html;
}

function changeMonth(delta) {
    calendarMonth += delta;
    if (calendarMonth > 11) { calendarMonth = 0; calendarYear++; }
    if (calendarMonth < 0) { calendarMonth = 11; calendarYear--; }
    renderCalendar();
}

/* ---- Weekly Insight ---- */
function renderInsight() {
    const data = loadData();
    const textEl = document.getElementById('insightText');
    const btnEl = document.getElementById('insightBtn');

    const today = new Date();
    const weekRecords = [];
    for (let i=0; i<7; i++) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        const ds = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
        const dayRecs = data.records.filter(r => r.date === ds);
        if (dayRecs.length > 0) {
            weekRecords.push({ date: ds, day: ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()], records: dayRecs });
        }
    }

    if (weekRecords.length === 0) {
        textEl.textContent = '继续记录你的心情，周日会为你生成专属洞察哦~';
        btnEl.style.display = 'none';
        return;
    }

    // Analyze patterns
    let negDays = [], posDays = [], totalNeg = 0, totalPos = 0;
    weekRecords.forEach(w => {
        const negCount = w.records.filter(r => r.emotion==='negative').length;
        const posCount = w.records.filter(r => r.emotion==='positive').length;
        totalNeg += negCount;
        totalPos += posCount;
        if (negCount > posCount) negDays.push(w.day);
        if (posCount > negCount) posDays.push(w.day);
    });

    let summary = '';
    if (negDays.length >= 2) {
        summary = `你这周的焦虑和低落感集中在${negDays.join('和')}，试着在那些日子给自己多一些放松的时间吧。`;
    } else if (posDays.length >= 3) {
        summary = `这周你有${posDays.length}天都保持了积极的心情，状态很不错！继续保持~`;
    } else if (totalNeg > totalPos && totalNeg > 0) {
        summary = `这周有些辛苦，低落的时刻比较多。没关系，允许自己休息，下周会更好的。`;
    } else if (totalPos > totalNeg) {
        summary = `这周整体情绪向好，开心的时刻比难过的多。记录下让你快乐的事，以后可以重温~`;
    } else {
        summary = `这周情绪比较平稳，有${weekRecords.length}天都在认真记录。坚持下去，你会更了解自己。`;
    }

    textEl.textContent = summary;
    btnEl.style.display = 'inline-block';
}

/* ---- Milestones ---- */
function checkMilestones(data) {
    // Compute consecutive days
    const dates = [...new Set(data.records.map(r=>r.date))].sort();
    let streak = 1;
    for (let i = dates.length-1; i > 0; i--) {
        const curr = new Date(dates[i]);
        const prev = new Date(dates[i-1]);
        if ((curr - prev) === 86400000) { streak++; }
        else break;
    }
    data.currentStreak = streak;
    data.totalDays = dates.length;
    saveData(data);
}

function renderMilestones() {
    const data = loadData();
    const badgesRow = document.getElementById('badgesRow');
    const summaryEl = document.getElementById('milestoneSummary');

    const streak = data.currentStreak || 0;
    const totalDays = data.totalDays || [...new Set(data.records.map(r=>r.date))].length;

    const badges = [
        { days: 7, icon: '🌱', label: '连续7天', cls: 'unlocked-7' },
        { days: 14, icon: '🌟', label: '连续14天', cls: 'unlocked-14' },
        { days: 30, icon: '🏆', label: '连续30天', cls: 'unlocked-30' }
    ];

    let html = '';
    badges.forEach(b => {
        const unlocked = streak >= b.days;
        html += `<div class="badge-item ${unlocked ? b.cls : 'locked'}">
            <div class="badge-icon">${unlocked ? b.icon : '🔒'}</div>
            <div class="badge-label">${b.label}${unlocked ? ' ✓' : ''}</div>
        </div>`;
    });
    badgesRow.innerHTML = html;

    // Summary text
    if (totalDays === 0) {
        summaryEl.innerHTML = '开始每天记录心情，解锁属于你的里程碑吧！';
    } else if (streak >= 30) {
        summaryEl.innerHTML = `太了不起了！你已经连续记录 <strong>${streak}</strong> 天，总共记录了 <strong>${totalDays}</strong> 天。你比很多人都更了解自己了。`;
    } else if (streak >= 14) {
        // Compare this week vs last week negative days
        const today = new Date();
        let thisWeekNeg = 0, lastWeekNeg = 0;
        for(let i=0; i<7; i++) {
            const d = new Date(today); d.setDate(d.getDate()-i);
            const ds = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
            thisWeekNeg += data.records.filter(r=>r.date===ds&&r.emotion==='negative').length;
        }
        for(let i=7; i<14; i++) {
            const d = new Date(today); d.setDate(d.getDate()-i);
            const ds = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
            lastWeekNeg += data.records.filter(r=>r.date===ds&&r.emotion==='negative').length;
        }
        const diff = lastWeekNeg - thisWeekNeg;
        let trend = '';
        if (diff > 0) trend = `低落的次数比上周少了 <strong>${diff}</strong> 次，你的情绪在慢慢好转 💪`;
        else if (diff < 0) trend = `这周辛苦了一些，但坚持记录本身就是勇气 ✨`;
        else trend = `过去两周你一直在认真面对自己的情绪，这很了不起 🌈`;
        summaryEl.innerHTML = `你已经连续记录 <strong>${streak}</strong> 天，总共 <strong>${totalDays}</strong> 天。${trend}`;
    } else if (streak >= 7) {
        summaryEl.innerHTML = `你已经连续记录 <strong>${streak}</strong> 天！习惯正在养成中，继续加油 💪`;
    } else {
        summaryEl.innerHTML = `已记录 <strong>${totalDays}</strong> 天，当前连续 <strong>${streak}</strong> 天。再坚持 ${7-streak} 天就能解锁第一个徽章！`;
    }
}

    ws.classList.remove('hidden');
    ws.style.display = 'flex';
