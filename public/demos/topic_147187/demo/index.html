<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6366f1" />
    <title>远程辅导软件</title>
    <script>
      (function() {
        try {
          var storedMode = localStorage.getItem('theme-mode');
          var mode = storedMode === 'light' || storedMode === 'dark' || storedMode === 'system' || storedMode === 'time' ? storedMode : 'system';
          var resolve = function(m) {
            if (m === 'light') return 'light';
            if (m === 'dark') return 'dark';
            if (m === 'time') {
              var h = new Date().getHours();
              return (h >= 19 || h < 7) ? 'dark' : 'light';
            }
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          };
          var resolved = resolve(mode);
          document.documentElement.classList.add(resolved);

          var storedAccent = localStorage.getItem('theme-accent');
          var accentMap = {
            indigo: '99,102,241',
            emerald: '16,185,129',
            rose: '244,63,94',
            amber: '245,158,11',
            sky: '14,165,233'
          };
          var colors = {
            indigo: { main: '#6366f1', dark: '#818cf8' },
            emerald: { main: '#10b981', dark: '#34d399' },
            rose: { main: '#f43f5e', dark: '#fb7185' },
            amber: { main: '#f59e0b', dark: '#fbbf24' },
            sky: { main: '#0ea5e9', dark: '#38bdf8' }
          };
          var accent = accentMap[storedAccent] ? storedAccent : 'indigo';
          document.documentElement.style.setProperty('--accent-rgb', accentMap[accent]);
          document.documentElement.style.setProperty('--accent-color', colors[accent].main);
          document.documentElement.style.setProperty('--accent-color-dark', colors[accent].dark);
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
