<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>24点 BOSS战</title>
<style>
/* ===== THEME VARIABLES ===== */
:root{
  --bg-deep:#08080f;--bg-mid:#0c0c18;--bg-light:#1a1a35;
  --gold:#d4a030;--gold-soft:rgba(212,160,48,.15);
  --cyan:#4ed8d8;--red:#ff4d6d;--magenta:#b14ed8;
  --text:rgba(240,232,208,.95);--text-sub:rgba(200,190,170,.7);--text-dim:rgba(150,140,120,.5);
  --card-bg:#f8f4ea;--card-red:#d32f2f;--card-black:#1a1a1a;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:var(--text);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{background:#000;background-attachment:fixed;position:relative;display:flex;align-items:center;justify-content:center}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 20% 80%,rgba(78,216,216,.04) 0%,transparent 40%),radial-gradient(circle at 80% 20%,rgba(177,78,216,.05) 0%,transparent 40%);pointer-events:none;animation:vortex 24s ease-in-out infinite;z-index:0}
@keyframes vortex{0%,100%{transform:rotate(0deg) scale(1)}50%{transform:rotate(180deg) scale(1.05)}}
#app{width:100%;max-width:430px;height:100%;max-height:932px;position:relative;z-index:1;background:radial-gradient(ellipse at 50% 30%,var(--bg-light) 0%,var(--bg-mid) 50%,var(--bg-deep) 100%);overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.8)}
.mono{font-family:'SF Mono','Menlo','Consolas',monospace}

/* ===== MAIN MENU (matches frame-v4.html) ===== */
.header{text-align:center;padding-top:32px;position:relative;z-index:1}
.header-title{font-size:48px;font-weight:900;color:var(--text);line-height:1;letter-spacing:.04em;text-shadow:0 2px 16px rgba(212,160,48,.1)}
.card-stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;width:100%;z-index:1}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:56px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3;opacity:.3;transition:opacity .3s}
.nav:hover{opacity:.7}
.nav-left{left:8px}.nav-right{right:8px}
.nav svg{width:16px;height:16px;stroke:rgba(212,160,48,.7);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.card-img{max-height:55vh;max-width:75vw;object-fit:contain;filter:drop-shadow(0 16px 40px rgba(0,0,0,.6)) drop-shadow(0 2px 8px rgba(212,160,48,.06));z-index:2;transition:transform .4s cubic-bezier(.25,.1,.25,1);cursor:pointer}
.card-img:hover{transform:translateY(-4px)}
.pagination{display:flex;align-items:center;justify-content:center;gap:14px;padding:18px 0 20px;z-index:1}
.dot{width:8px;height:8px;background:rgba(100,90,80,.4);border-radius:50%;transition:all .4s cubic-bezier(.25,.1,.25,1);cursor:pointer}
.dot.active{width:24px;border-radius:4px;background:rgba(212,160,48,.85);box-shadow:0 0 8px rgba(212,160,48,.4),0 0 20px rgba(212,160,48,.15)}
.bottom{display:flex;align-items:center;justify-content:center;gap:16px;padding-bottom:28px;z-index:1}
.bottom-btn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.25;transition:opacity .3s}
.bottom-btn:hover{opacity:.5}
.bottom-btn svg{width:14px;height:14px;stroke:rgba(212,160,48,.7);fill:none;stroke-width:1.5}
.bottom-ver{font-size:9px;color:rgba(100,90,80,.4);letter-spacing:.08em}

/* ===== GAME BOARD ===== */
.game-board{width:100%;height:100%;display:flex;flex-direction:column;position:relative}
.status-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;padding-top:calc(12px + var(--safe-top));font-size:13px;color:var(--text-sub)}
.status-item{display:flex;gap:4px;align-items:center}
.status-item .mono{color:var(--gold);font-weight:700;font-size:16px}
.boss-area{width:72px;height:72px;border-radius:50%;background:radial-gradient(circle,var(--bg-light),var(--bg-deep));border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--gold);cursor:pointer;position:relative;transition:transform .2s}
.boss-area:active{transform:scale(.9)}

/* ===== NUMBER CARDS ===== */
.num-card{width:60px;height:84px;background:var(--card-bg);border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.05) inset;display:flex;flex-direction:column;justify-content:space-between;padding:5px 7px;cursor:grab;transition:transform .2s,box-shadow .2s;position:relative;font-family:'SF Mono',monospace;color:var(--card-black)}
.num-card.red{color:var(--card-red)}
.num-card.dragging{opacity:.5;cursor:grabbing}
.num-card.highlight{box-shadow:0 0 16px var(--gold),0 4px 12px rgba(0,0,0,.5);transform:translateY(-4px)}
.num-card.used{display:none}
.num-card .rank-tl{font-size:16px;font-weight:700;line-height:1}
.num-card .suit-tl{font-size:11px;line-height:1}
.num-card .rank-center{font-size:32px;font-weight:900;text-align:center;line-height:1}
.num-card .suit-br{font-size:11px;line-height:1;align-self:flex-end;transform:rotate(180deg)}
.num-card.modified::after{content:'!';position:absolute;top:-4px;right:-4px;width:16px;height:16px;background:var(--gold);color:var(--bg-deep);border-radius:50%;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center}

/* ===== OPERATOR CARDS ===== */
.op-card{width:52px;height:68px;background:linear-gradient(180deg,#2a2a4a 0%,#1a1a30 100%);border:2px solid rgba(212,160,48,.4);border-radius:8px;color:var(--gold);font-size:28px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;flex-direction:column;gap:2px}
.op-card:active{transform:scale(.95)}
.op-card.disabled{opacity:.3;cursor:not-allowed;filter:grayscale(.8)}
.op-card.forced{border-color:var(--gold);box-shadow:0 0 16px var(--gold);animation:pulse-gold 1.2s ease-in-out infinite}
.op-card.reversed{border-color:var(--magenta);color:var(--magenta)}
@keyframes pulse-gold{0%,100%{box-shadow:0 0 8px var(--gold-soft)}50%{box-shadow:0 0 20px var(--gold)}}

/* ===== ICON BUTTONS ===== */
.icon-btn{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.4);border:1px solid rgba(212,160,48,.3);color:var(--gold);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;font-size:18px}
.icon-btn:hover{background:rgba(212,160,48,.2);border-color:rgba(212,160,48,.6);transform:scale(1.08)}
.icon-btn:active{transform:scale(.95)}
.icon-btn svg{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.icon-btn:active{transform:scale(.9)}

/* ===== MODAL ===== */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;animation:fade-in .3s}
.modal{background:linear-gradient(180deg,#1a1a2e 0%,#0d0d1a 100%);border:2px solid var(--gold-deep);border-radius:4px;padding:0;min-width:260px;max-width:320px;text-align:center;box-shadow:0 0 0 1px rgba(212,160,48,.15),0 8px 32px rgba(0,0,0,.9),0 0 40px rgba(212,160,48,.08);animation:pop-in .3s cubic-bezier(.34,1.56,.64,1);overflow:hidden}
.modal-banner{height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.modal-body{padding:24px 28px 20px}
.modal-title{font-size:20px;font-weight:900;color:var(--gold);margin-bottom:6px;letter-spacing:1px;text-shadow:0 0 12px rgba(212,160,48,.3)}
.modal-sub{font-size:12px;color:var(--text-sub);margin-bottom:10px;line-height:1.6}
.modal-result{font-size:42px;font-weight:900;font-family:'SF Mono',monospace;margin:10px 0;letter-spacing:2px}
.modal-result.success{color:var(--cyan);text-shadow:0 0 16px rgba(78,216,216,.4)}
.modal-result.fail{color:var(--red);text-shadow:0 0 16px rgba(255,80,80,.3)}
.modal-btn{display:block;width:100%;padding:10px;background:linear-gradient(180deg,#3a2a0a 0%,#1a1200 100%);color:var(--gold);border:none;border-top:1px solid var(--gold-deep);font-size:15px;font-weight:700;cursor:pointer;letter-spacing:3px;transition:background .2s}
.modal-btn:hover{background:linear-gradient(180deg,#4a3a0a 0%,#2a1a00 100%)}
.modal-btn:active{background:linear-gradient(180deg,#2a1a00 0%,#1a0a00 100%)}

/* ===== TOAST ===== */
.toast{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:var(--text);padding:8px 18px;border-radius:18px;font-size:13px;z-index:200;pointer-events:none;animation:toast-anim 1.2s ease-out forwards}
@keyframes toast-anim{0%{opacity:0;transform:translateX(-50%) translateY(20px)}20%,80%{opacity:1;transform:translateX(-50%) translateY(0)}100%{opacity:0;transform:translateX(-50%) translateY(-10px)}}

/* ===== DECK VIEW ===== */
.deck-view{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px}
.deck-stack{width:36px;height:50px;background:linear-gradient(135deg,#1a1a35,#0c0c18);border:1.5px solid var(--gold);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:var(--gold);font-family:'SF Mono',monospace;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.deck-label{font-size:9px;color:var(--text-dim)}

/* ===== BUBBLE ===== */
.bubble{position:absolute;left:110%;top:0;white-space:nowrap;background:rgba(0,0,0,.85);color:var(--text);padding:5px 10px;border-radius:10px;font-size:12px;border:1px solid var(--gold);z-index:5;max-width:200px}

/* ===== ANIMATIONS ===== */
@keyframes card-fly-in{0%{transform:translateY(-200px) rotate(-20deg) scale(.5);opacity:0}60%{transform:translateY(10px) rotate(5deg) scale(1.05);opacity:1}100%{transform:translateY(0) rotate(0) scale(1);opacity:1}}
@keyframes number-bump{0%,100%{transform:scale(1)}50%{transform:scale(1.4)}}
.bump{animation:number-bump .4s ease-out}
@keyframes card-vanish{0%{transform:scale(1) rotate(0);opacity:1}100%{transform:scale(0) rotate(180deg) translateY(-40px);opacity:0}}
.vanish{animation:card-vanish .5s ease-in forwards}
@keyframes flash-red{0%,100%{box-shadow:0 0 0 rgba(255,77,109,0)}50%{box-shadow:0 0 20px rgba(255,77,109,.8)}}
.flash-warn{animation:flash-red .6s ease-out 2}
@keyframes boss-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.boss-bounce{animation:boss-bounce .6s ease-out}
@keyframes idle-sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.idle-sway{animation:idle-sway 4s ease-in-out infinite;transform-origin:center bottom}

/* ===== MATCH3 EFFECTS ===== */
.m3-fx-layer{position:absolute;inset:0;pointer-events:none;z-index:50;overflow:hidden}
@keyframes m3-pop{0%{transform:translate(-50%,-50%) scale(0) rotate(-30deg);opacity:0}30%{transform:translate(-50%,-50%) scale(1.3) rotate(10deg);opacity:1}70%{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:1}100%{transform:translate(-50%,-50%) scale(1.4) rotate(0);opacity:0}}
.m3-fx-text{position:absolute;left:50%;top:50%;font-size:42px;font-weight:900;color:var(--gold);text-shadow:0 0 16px rgba(212,160,48,.8),0 0 32px rgba(212,160,48,.4),0 4px 8px rgba(0,0,0,.8);animation:m3-pop 1.2s cubic-bezier(.34,1.56,.64,1) forwards;letter-spacing:3px;font-family:'SF Mono',monospace}
@keyframes m3-spark{0%{transform:translate(-50%,-50%) scale(0);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(0);opacity:0}}
.m3-fx-spark{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);animation:m3-spark .8s ease-out forwards}
@keyframes m3-ring{0%{transform:translate(-50%,-50%) scale(0);opacity:1;border-width:6px}100%{transform:translate(-50%,-50%) scale(3);opacity:0;border-width:1px}}
.m3-fx-ring{position:absolute;left:50%;top:50%;width:80px;height:80px;border-radius:50%;border:6px solid var(--gold);animation:m3-ring .8s ease-out forwards}
.m3-fx-text.combo-1{color:var(--cyan);text-shadow:0 0 16px rgba(78,216,216,.8),0 0 32px rgba(78,216,216,.4),0 4px 8px rgba(0,0,0,.8)}
.m3-fx-text.combo-2{color:var(--magenta);text-shadow:0 0 16px rgba(177,78,216,.8),0 0 32px rgba(177,78,216,.4),0 4px 8px rgba(0,0,0,.8)}
.m3-fx-text.combo-3{color:#ffeb3b;text-shadow:0 0 16px rgba(255,235,59,.8),0 0 32px rgba(255,150,0,.5),0 4px 8px rgba(0,0,0,.8);font-size:36px}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ===== SFX MODULE (Web Audio API, 8-bit style) =====
const BGM = (() => {
  let ctx=null,enabled=false;
  // 音符频率表
  const N={C2:65.41,D2:73.42,E2:82.41,F2:87.31,G2:98.00,A2:110.00,B2:123.47,
    C3:130.81,D3:146.83,E3:164.81,F3:174.61,G3:196.00,A3:220.00,B3:246.94,
    C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392.00,A4:440.00,B4:493.88,
    C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880.00,B5:987.77,
    R:0};
  function playTone(freq,start,dur,type='square',vol=0.12){
    if(freq===0)return;
    // 确保 ctx 已初始化
    if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)()}
    if(ctx.state==='suspended')ctx.resume();
    const g=ctx.createGain();
    const o=ctx.createOscillator();
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(0,start);
    g.gain.linearRampToValueAtTime(vol,start+0.01);
    g.gain.setValueAtTime(vol,start+dur*0.7);
    g.gain.linearRampToValueAtTime(0,start+dur);
    o.connect(g).connect(ctx.destination);
    o.start(start);o.stop(start+dur+0.02);
  }
  function start(){enabled=true;if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)()}if(ctx.state==='suspended')ctx.resume()}
  function stop(){enabled=false}
  function toggle(){enabled=!enabled;if(enabled){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)()}if(ctx.state==='suspended')ctx.resume()}return enabled}
  function isOn(){return enabled}
  function playSfx(type){
    if(!enabled||!ctx)return;
    if(ctx.state==='suspended')ctx.resume();
    const t=ctx.currentTime;
    if(type==='success'){[659.25,783.99,1046.5].forEach((f,i)=>playTone(f,t+i*0.08,0.12,'square',0.15))}
    else if(type==='fail'){[392,329.63,261.63].forEach((f,i)=>playTone(f,t+i*0.1,0.15,'sawtooth',0.12))}
    else if(type==='flip'){playTone(880,t,0.06,'square',0.1);playTone(1318.51,t+0.06,0.06,'square',0.1)}
    else if(type==='op-add'){
      // 加法：上扬两音 (C5->E5)
      playTone(523.25,t,0.08,'square',0.14);
      playTone(659.25,t+0.06,0.1,'square',0.14);
    }
    else if(type==='op-sub'){
      // 减法：下沉两音 (E5->C5)
      playTone(659.25,t,0.08,'square',0.14);
      playTone(523.25,t+0.06,0.1,'square',0.14);
    }
    else if(type==='op-mul'){
      // 乘法：跳跃三连音 (G4->C5->G5)
      playTone(392,t,0.06,'square',0.13);
      playTone(523.25,t+0.05,0.06,'square',0.13);
      playTone(783.99,t+0.1,0.1,'square',0.14);
    }
    else if(type==='op-div'){
      // 除法：清脆分流音 (A5->E5->C5)
      playTone(880,t,0.06,'square',0.13);
      playTone(659.25,t+0.05,0.06,'square',0.13);
      playTone(523.25,t+0.1,0.1,'square',0.14);
    }
    else if(type==='op-invalid'){
      // 无效操作：低沉错误音 (Buzz)
      playTone(196,t,0.12,'sawtooth',0.16);
      playTone(185,t+0.1,0.15,'sawtooth',0.16);
    }
    else if(type==='op-match24'){
      // 算出24点：超级玛丽通关号角 (C5->E5->G5->C6 上行琶音)
      [523.25,659.25,783.99,1046.5].forEach((f,i)=>playTone(f,t+i*0.07,0.14,'square',0.16));
      // 叠加低音强调
      playTone(261.63,t,0.4,'triangle',0.1);
    }
    else if(type==='drag'){
      // 拖动反馈：轻微短音
      playTone(440,t,0.04,'square',0.06);
    }
    // === 消消乐牌包专属音效 ===
    else if(type==='m3-merge'){
      // 普通合并音：清脆两音 (E5->A5)
      playTone(659.25,t,0.06,'square',0.13);
      playTone(880,t+0.05,0.1,'square',0.14);
    }
    else if(type==='m3-match'){
      // 消除24点：根据 combo 播放不同音阶（连击越多音越高）
      const base=[523.25,587.33,659.25,698.46,783.99,880,987.77,1046.5];
      [0,1,2,3].forEach(i=>playTone(base[Math.min(i,7)],t+i*0.04,0.08,'square',0.14));
      // 收尾高音
      playTone(1318.51,t+0.18,0.16,'square',0.13);
    }
    else if(type==='m3-combo'){
      // 连击递增音：上升音阶 (C5->E5->G5->C6)
      [523.25,659.25,783.99,1046.5].forEach((f,i)=>playTone(f,t+i*0.05,0.09,'triangle',0.12));
    }
    else if(type==='m3-item-j'){
      // 道具J：全消下行扫荡音 (C6->G5->C5->G4)
      [1046.5,783.99,523.25,392].forEach((f,i)=>playTone(f,t+i*0.06,0.1,'sawtooth',0.14));
    }
    else if(type==='m3-item-q'){
      // 道具Q：柔和自运算音 (A4->D5->G4 摇摆)
      playTone(440,t,0.08,'triangle',0.13);
      playTone(587.33,t+0.08,0.08,'triangle',0.13);
      playTone(392,t+0.16,0.12,'triangle',0.13);
    }
    else if(type==='m3-item-k'){
      // 道具K：高亢强制24音 (C5->G5->C6 上行+持续)
      [523.25,783.99,1046.5].forEach((f,i)=>playTone(f,t+i*0.06,0.1,'square',0.15));
      playTone(1046.5,t+0.18,0.25,'square',0.14);
    }
    else if(type==='m3-invalid'){
      // 无效操作：温和提示音 (G4->F4 下行)
      playTone(392,t,0.1,'triangle',0.12);
      playTone(349.23,t+0.08,0.12,'triangle',0.12);
    }
    else if(type==='m3-restart'){
      // 重置音：清亮回旋 (C5->E5->G5->E5->C5)
      [523.25,659.25,783.99,659.25,523.25].forEach((f,i)=>playTone(f,t+i*0.06,0.08,'square',0.13));
    }
  }
  return{start,stop,toggle,isOn,playSfx};
})();

// ===== LOGIC LAYER (pure JS, no DOM dependency) =====
const Logic = (() => {

// --- Mulberry32 seeded RNG ---
function createRng(seed){let s=seed>>>0;return function(){s=(s+0x6D2B79F5)>>> 0;let t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
function shuffle(arr,rng){const out=[...arr];for(let i=out.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
function pick(arr,rng){return arr[Math.floor(rng()*arr.length)]}
function intInRange(min,max,rng){return min+Math.floor(rng()*(max-min+1))}

// --- Deck ---
const SUITS=['spade','heart','diamond','club'];
function createNumberDeck(){const d=[];for(const s of SUITS)for(let v=1;v<=10;v++)d.push({suit:s,value:v,id:`${v}-${s}`});return d}
function dealHand(deck,rng,target=24){
  for(let attempt=0;attempt<200;attempt++){
    const sh=shuffle(deck,rng);
    const hand=sh.slice(0,4);
    if(canReach(hand.map(c=>c.value),target))return{hand,deckLeft:sh.slice(4)};
  }
  const sh=shuffle(deck,rng);return{hand:sh.slice(0,4),deckLeft:sh.slice(4)}
}

// --- Operations ---
const OPS=['+','-','*','/'];

// --- Solver (exhaustive) ---
function canReach(nums,target,opts={}){

}
function _canReachWithOp(nums,target,disabled,mustUse){
  for(const p of _perms(nums))if(_dfs(p,0,target,disabled,mustUse,false))return true;

}
function _dfs(arr,idx,target,disabled,mustUse,usedForced){
  if(idx===arr.length-1)return Math.abs(arr[idx]-target)<0.5;
  for(const op of OPS){
    if(disabled.has(op))continue;
    if(op==='/'&&arr[idx+1]===0)continue;
    const r=compute(arr[idx],op,arr[idx+1]);
    if(!Number.isFinite(r)||Math.abs(r)>1e6)continue;
    const next=arr.slice(0,idx).concat([r]).concat(arr.slice(idx+2));

}

// --- Interference (人鱼牌包用，保留原有12张效果) ---
const JOKER_POOL=[];
for(const s of SUITS)for(const r of['J','Q','K'])JOKER_POOL.push(`${r}-${s}`);

function applyInterference(cardId,cards,rng,ctx={}){
  const[rank,suit]=cardId.split('-');
  if(rank==='J')return _applyJ(suit,cards,rng,ctx);
  if(rank==='Q')return _applyQ(suit,cards,rng,ctx);
  if(rank==='K')return _applyK(suit,cards,rng,ctx);
  throw new Error('Unknown:'+cardId);
}
function _applyJ(suit,cards,rng,ctx){
  if(suit==='heart'){const i=Math.floor(rng()*cards.length);const d=intInRange(1,2,rng);const ov=cards[i].value;const nv=Math.min(10,ov+d);return{cards:cards.map((c,j)=>j===i?{...c,value:nv,modified:true}:c),state:ctx.state,jEffect:{idx:i,oldVal:ov,newVal:nv}}}
  if(suit==='spade'){const i=Math.floor(rng()*cards.length);const d=intInRange(1,2,rng);const ov=cards[i].value;const nv=Math.max(1,ov-d);return{cards:cards.map((c,j)=>j===i?{...c,value:nv,modified:true}:c),state:ctx.state,jEffect:{idx:i,oldVal:ov,newVal:nv}}}
  if(suit==='club'){const i=Math.floor(rng()*cards.length);const ov=cards[i].value;return{cards:cards.filter((_,j)=>j!==i),state:ctx.state,removedCount:1,jEffect:{idx:i,oldVal:ov,removed:true}}}

}
function _applyQ(suit,cards,rng,ctx){
  const st=ctx.state||{disabled:new Set(),forced:new Set(),reversed:{}};
  const op=pick([...OPS],rng);
  if(suit==='spade')st.disabled=new Set([...st.disabled,op]);
  else if(suit==='diamond')st.forced=new Set([...st.forced,op]);
  else if(suit==='heart')st.reversed={...st.reversed,[op]:_reverseOf(op)};
  return{cards,state:st,qEffect:{suit,op}};
}
function _reverseOf(op){return{'+':'-','-':'+','*':'/','/':'*'}[op]}
function _applyK(suit,cards,rng,ctx){const{newTarget}=targetForK(`K-${suit}`,rng);return{cards,state:ctx.state,target:newTarget,kEffect:{suit,newTarget}}}
function targetForK(cardId,rng){const r=rng||Math.random;const s=cardId.split('-')[1];if(s==='heart')return{newTarget:intInRange(25,27,r)};if(s==='spade')return{newTarget:intInRange(21,23,r)};if(s==='diamond')return{newTarget:48};if(s==='club')return{newTarget:12};return{newTarget:24}}

// --- Interference (搞怪牌包专用，精简6张) ---
// J♥/J♠：一张翻倍、一张减半（向上取整）
// J♣/J♦：直接消除2张数字牌（不补牌）
// Q♥：禁用 + 和 -
// Q♠：禁用 × 和 ÷
// K♥/K♦：随机变化结果目标（18~36，排除24）
const FUNNY_JOKER_POOL=['J-heart','J-spade','Q-heart','Q-spade','K-heart','K-diamond'];
function applyFunnyInterference(cardId,cards,rng,ctx={}){
  const[rank,suit]=cardId.split('-');
  if(rank==='J')return _applyFunnyJ(suit,cards,rng,ctx);
  if(rank==='Q')return _applyFunnyQ(suit,cards,rng,ctx);
  if(rank==='K')return _applyFunnyK(suit,cards,rng,ctx);
  throw new Error('Unknown:'+cardId);
}
function _applyFunnyJ(suit,cards,rng,ctx){
  if(suit==='heart'||suit==='spade'){
    if(cards.length<2)return{cards,state:ctx.state,jEffect:{lessThan2:true}};
    const idxs=_pickTwoDistinct(cards.length,rng);
    const i1=idxs[0],i2=idxs[1];
    const v1=cards[i1].value,v2=cards[i2].value;
    const nv1=Math.min(10,v1*2);
    const nv2=Math.max(1,Math.ceil(v2/2));
    const newCards=cards.map((c,j)=>{
      if(j===i1)return{...c,value:nv1,modified:true};
      if(j===i2)return{...c,value:nv2,modified:true};
      return c;
    });
    return{cards:newCards,state:ctx.state,jEffect:{idx1:i1,idx2:i2,oldVal1:v1,newVal1:nv1,oldVal2:v2,newVal2:nv2,type:'double-halve'}};
  }
  if(cards.length<2)return{cards,state:ctx.state,jEffect:{lessThan2:true}};
  const idxs=_pickTwoDistinct(cards.length,rng);
  const removed=cards.filter((_,j)=>j===idxs[0]||j===idxs[1]).map(c=>c.value);
  const newCards=cards.filter((_,j)=>j!==idxs[0]&&j!==idxs[1]);
  return{cards:newCards,state:ctx.state,removedCount:2,jEffect:{removedIdxs:idxs,removedVals:removed,type:'remove2'}};
}
function _pickTwoDistinct(n,rng){
  if(n<2)return[0,0];
  let i1=Math.floor(rng()*n),i2;
  do{i2=Math.floor(rng()*n)}while(i2===i1);
  return[i1,i2];
}
function _applyFunnyQ(suit,cards,rng,ctx){
  const st=ctx.state||{disabled:new Set(),forced:new Set(),reversed:{}};
  if(suit==='heart'){st.disabled=new Set([...st.disabled,'+','-']);return{cards,state:st,qEffect:{suit,disabledOps:['+','-']}}}
  if(suit==='spade'){st.disabled=new Set([...st.disabled,'*','/']);return{cards,state:st,qEffect:{suit,disabledOps:['*','/']}}}
  return{cards,state:st,qEffect:{suit,disabledOps:[]}};
}
function _applyFunnyK(suit,cards,rng,ctx){
  let newTarget;
  do{newTarget=intInRange(18,36,rng)}while(newTarget===24);
  return{cards,state:ctx.state,target:newTarget,kEffect:{suit,newTarget,random:true}};
}

// --- Event Bus ---
function createBus(){const ls=new Map();return{on(e,f){if(!ls.has(e))ls.set(e,new Set());ls.get(e).add(f);return()=>ls.get(e).delete(f)},emit(e,p){const s=ls.get(e);if(!s)return;for(const f of[...s])f(p)}}}

// --- Pack: Classic ---
function createClassicGame(rng){
  const bus=createBus();let deck=createNumberDeck();let hand=[],jp=[],ji=0,round=0,success=0;
  let opState={disabled:new Set(),forced:new Set(),reversed:{}};let target=24;const history=[];
  const initJp=()=>{jp=[...JOKER_POOL];for(let i=jp.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[jp[i],jp[j]]=[jp[j],jp[i]]}ji=0};
  initJp();

  return{bus,deck,hand,round,success,target,opState,history,congratulated:false,
    startRound(){if(deck.length<4){deck=createNumberDeck()}const{hand:h,deckLeft:dl}=dealHand(deck,rng);hand=h;this.hand=hand;deck=dl;this.deck=deck;round++;this.round=round;opState={disabled:new Set(),forced:new Set(),reversed:{}};target=24;this.target=target;bus.emit('round:start',{round,hand});this.applyInterference();initialHand=hand.map(c=>({...c}));return hand},

  };

// --- Pack: Mermaid ---
function createMermaidGame(rng){
  const bus=createBus();let deck=createNumberDeck();let hand=[],jp=[],ji=0,round=0,score=0,success=0;
  let opState={disabled:new Set(),forced:new Set(),reversed:{}};let target=24;const history=[];
  const initJp=()=>{jp=[...JOKER_POOL];for(let i=jp.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[jp[i],jp[j]]=[jp[j],jp[i]]}ji=0};
  initJp();
  let initialHand=[];
  let lastInterfere=null;
  return{bus,deck,hand,round,score,success,target,opState,history,lastInterfere,
    startRound(){if(deck.length<4)deck=createNumberDeck();const{hand:h,deckLeft:dl}=dealHand(deck,rng);hand=h;this.hand=hand;deck=dl;this.deck=deck;round++;this.round=round;opState={disabled:new Set(),forced:new Set(),reversed:{}};target=24;this.target=target;lastInterfere=null;this.lastInterfere=null;bus.emit('round:start',{round,hand});this.applyInterference();initialHand=hand.map(c=>({...c}));return hand},

  };

// --- Pack: Funny (player is BOSS) ---
function createFunnyGame(rng){
  const bus=createBus();let deck=createNumberDeck();let hand=[],jp=[],numberHand=[],round=0,block=0,solved=0;
  let opState={disabled:new Set(),forced:new Set(),reversed:{}};let target=24;
  function shuffleJp(){jp=[...FUNNY_JOKER_POOL];for(let i=jp.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[jp[i],jp[j]]=[jp[j],jp[i]]}}
  shuffleJp();

  return{bus,deck,hand,numberHand,round,block,solved,target,opState,
    startRound(){if(deck.length<4)deck=createNumberDeck();const{hand:h,deckLeft:dl}=dealHand(deck,rng);numberHand=h;this.numberHand=numberHand;deck=dl;this.deck=deck;round++;this.round=round;opState={disabled:new Set(),forced:new Set(),reversed:{}};target=24;this.target=target;bus.emit('round:start',{round,hand:numberHand,jokerHand:hand});return numberHand},
    playJoker(cid){const idx=hand.indexOf(cid);if(idx<0)return null;hand.splice(idx,1);const r=applyFunnyInterference(cid,numberHand,rng,{state:opState,deck});numberHand=r.cards;this.numberHand=numberHand;if(r.target){target=r.target;this.target=target}if(r.deck){deck=r.deck;this.deck=deck}if(r.state)opState=r.state;if(jp.length===0)shuffleJp();if(jp.length>0)hand.push(jp.shift());this.hand=hand;bus.emit('joker:played',{cardId:cid,hand:numberHand,target});return r},
    runAI(){const nums=numberHand.map(c=>c.value);const solvable=canReach(nums,target,{disabledOps:opState.disabled,forcedOps:opState.forced});const outcome=solvable?'solved':'blocked';if(solvable){solved++;this.solved=solved}else{block++;this.block=block}bus.emit('ai:done',{outcome,target});return{outcome,target}},
    isOver(){return round>=10}
  };
}

// --- Pack: Match3 (independent logic) ---
function createMatch3Game(rng){
  const bus=createBus();let deck=createNumberDeck();let field=[];let score=0,combo=0,maxCombo=0;
  let itemJ=false,itemQ=false,itemK=false;
  for(let i=deck.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}
  field=deck.splice(0,4);
  bus.emit('game:init',{field,deck});
  function refill(n){const add=Math.min(n,deck.length);const added=deck.splice(0,add);return added}
  return{bus,deck,field,score,combo,maxCombo,itemJ,itemQ,itemK,
    reorderField(from,to){
      const arr=[...field];const[m]=arr.splice(from,1);arr.splice(to,0,m);field=arr;this.field=field;
    },
    playOp(li,ri,op){
      const a=field[li].value,b=field[ri].value;
      if(op==='/'&&b===0){bus.emit('op:invalid',{reason:'div-zero'});return{invalid:true,reason:'div-zero'}}
      const r=compute(a,op,b);const match=r===24;
      if(match){
        combo++;maxCombo=Math.max(maxCombo,combo);this.combo=combo;this.maxCombo=maxCombo;
        score++;this.score=score;
        const nf=field.filter((_,j)=>j!==li&&j!==ri);
        field=nf;
        const added=refill(2);
        field=field.concat(added);this.field=field;
        bus.emit('op:match',{result:r,combo,score,added});
        return{result:r,isMatch:true,combo}
      }else{
        const nf=[...field];nf[li]={...nf[li],value:r,modified:true};nf.splice(ri,1);field=nf;
        combo=0;this.combo=combo;const added=refill(1);field=field.concat(added);this.field=field;bus.emit('op:done',{result:r,added});return{result:r,isMatch:false}
      }
    },
    playItemJ(){
      if(itemJ)return null;
      const removed=field.length;
      field=[];const added=refill(Math.min(4,deck.length));field=field.concat(added);this.field=field;itemJ=true;this.itemJ=true;
      bus.emit('item:used',{type:'J',count:removed});
      return{type:'J',count:removed}
    },
    playItemK(index){
      if(itemK)return null;const nf=[...field];nf.splice(index,1);field=nf;const added=refill(1);field=field.concat(added);this.field=field;itemK=true;this.itemK=true;combo++;maxCombo=Math.max(maxCombo,combo);this.combo=combo;this.maxCombo=maxCombo;score++;this.score=score;bus.emit('item:used',{type:'K'});return{type:'K'}
    },
    playItemQ(op){
      if(itemQ)return null;const a=field[0].value;const r=compute(a,op,a);field[0]={...field[0],value:r,modified:true};itemQ=true;this.itemQ=true;bus.emit('item:used',{type:'Q',result:r});return{type:'Q',result:r}
    },
    isOver(){return deck.length===0&&field.length<=1},
    reset(){
      deck=createNumberDeck();
      for(let i=deck.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}
      field=deck.splice(0,4);
      score=0;this.score=0;combo=0;this.combo=0;maxCombo=0;this.maxCombo=0;
      itemJ=false;this.itemJ=false;itemQ=false;this.itemQ=false;itemK=false;this.itemK=false;
      this.deck=deck;this.field=field;
      bus.emit('game:init',{field,deck});
    }
  };
}

// --- Operator Card ---
function createOpCard(op,st={}){
  const e=el('div','op-card');e.dataset.op=op;
  const display=(st.reversed&&st.reversed[op])||op;
  e.textContent=OP_GLYPH[display]||display;
  if(st.disabled&&st.disabled.has(op))e.classList.add('disabled');
  if(st.forced&&st.forced.has(op))e.classList.add('forced');
  if(st.reversed&&st.reversed[op])e.classList.add('reversed');
  return e;
}
function createOpRow(st={}){const row=el('div');row.style.cssText='display:flex;gap:10px;justify-content:center;align-items:center;';for(const op of Logic.OPS)row.appendChild(createOpCard(op,st));return row}
function bindOpPlay(scope,playFn){
  let pressY=null,lastTap=0,locked=false;
  function trigger(op){if(locked)return;locked=true;playFn(op);setTimeout(()=>{locked=false},500)}
  scope.addEventListener('touchstart',e=>{const t=e.touches[0];pressY=t.clientY},{passive:true});
  scope.addEventListener('touchend',e=>{
    if(pressY===null)return;
    const dy=e.changedTouches[0].clientY-pressY;
    const card=e.target.closest('.op-card');
    if(!card){pressY=null;return}
    const now=Date.now();
    if(dy<-30){trigger(card.dataset.op);lastTap=now;pressY=null;return}
    if(now-lastTap<300){trigger(card.dataset.op);lastTap=0}
    else{lastTap=now}
    pressY=null
  });
  scope.addEventListener('dblclick',e=>{const card=e.target.closest('.op-card');if(card)trigger(card.dataset.op)});
}

// --- Drag Reorder ---
function enableDrag(container,onReorder){
  let dragEl=null,startX=0,origIdx=-1,cardW=80;
  function getCards(){return[...container.children].filter(c=>c.classList.contains('num-card'))}
  function down(e){const t=e.target.closest('.num-card');if(!t)return;dragEl=t;origIdx=getCards().indexOf(t);startX=e.clientX??e.touches?.[0]?.clientX??0;cardW=t.offsetWidth+12;dragEl.classList.add('dragging');if(e.cancelable)e.preventDefault()}
  function move(e){if(!dragEl)return;const x=e.clientX??e.touches?.[0]?.clientX??0;dragEl.style.transform=`translateX(${x-startX}px) scale(1.1)`}
  function up(e){if(!dragEl)return;const x=e.clientX??e.changedTouches?.[0]?.clientX??startX;const dx=x-startX;dragEl.style.transform='';dragEl.classList.remove('dragging');const cards=getCards();if(Math.abs(dx)>cardW/2){const shift=Math.round(dx/cardW);const ni=Math.max(0,Math.min(cards.length-1,origIdx+shift));if(ni!==origIdx)onReorder(origIdx,ni)}dragEl=null}
  container.addEventListener('mousedown',down);
  container.addEventListener('touchstart',down,{passive:false});
  window.addEventListener('mousemove',move);
  window.addEventListener('touchmove',move,{passive:true});
  window.addEventListener('mouseup',up);
  window.addEventListener('touchend',up);
}
// 运算符卡牌拖动排序（仅水平拖动触发，垂直滑动让给 bindOpPlay 处理打出）
function enableDragOp(container,onReorder){
  let dragEl=null,startX=0,startY=0,origIdx=-1,cardW=60,moved=false,lockedDir=null;
  function down(e){const t=e.target.closest('.op-card');if(!t)return;dragEl=t;origIdx=[...container.children].indexOf(t);startX=e.clientX??e.touches?.[0]?.clientX??0;startY=e.clientY??e.touches?.[0]?.clientY??0;cardW=t.offsetWidth+10;moved=false;lockedDir=null;if(e.cancelable)e.preventDefault()}
  function move(e){if(!dragEl)return;const x=e.clientX??e.touches?.[0]?.clientX??startX;const y=e.clientY??e.touches?.[0]?.clientY??startY;const dx=x-startX,dy=y-startY;
    if(!lockedDir){if(Math.abs(dx)>8||Math.abs(dy)>8)lockedDir=Math.abs(dx)>Math.abs(dy)?'x':'y';else return}
    if(lockedDir==='y'){return}
    moved=true;dragEl.style.transform=`translateX(${dx}px) scale(1.1)`;if(e.cancelable)e.preventDefault()
  }
  function up(e){if(!dragEl)return;const x=e.clientX??e.changedTouches?.[0]?.clientX??startX;const dx=x-startX;dragEl.style.transform='';dragEl.classList.remove('dragging');if(moved&&Math.abs(dx)>cardW/2){const shift=Math.round(dx/cardW);const ni=Math.max(0,Math.min(container.children.length-1,origIdx+shift));if(ni!==origIdx)onReorder(origIdx,ni)}dragEl=null;moved=false;lockedDir=null}
  container.addEventListener('mousedown',down);
  container.addEventListener('touchstart',down,{passive:false});
  window.addEventListener('mousemove',move);
  window.addEventListener('touchmove',move,{passive:false});
  window.addEventListener('mouseup',up);
  window.addEventListener('touchend',up);
}

    bd.innerHTML=`<div class="modal" style="max-width:320px;max-height:70vh;overflow:auto;text-align:left"><div class="modal-banner"></div><div class="modal-body"><div class="modal-title" style="text-align:center">本局记录</div><div style="font-size:11px;color:var(--text-dim);text-align:right;margin-bottom:8px">最近在上</div><div id="rec-list"></div></div><button class="modal-btn" id="close-rec">关闭</button></div>`;
    document.body.appendChild(bd);
    const list=bd.querySelector('#rec-list');
    if(records.length===0)list.innerHTML='<div style="color:var(--text-dim);text-align:center;padding:20px">暂无记录</div>';
    else list.innerHTML=records.map(r=>`<div style="border-bottom:1px solid rgba(212,160,48,.15);padding:8px 0;font-size:13px"><div style="color:var(--gold)">第${r.round}轮 ${r.success?'✓':'✗'}</div><div style="color:var(--text-sub);font-family:monospace">结果=${r.result}</div>${r.steps&&r.steps.length?`<div style="color:var(--text-dim);font-size:11px;font-family:'SF Mono',monospace;line-height:1.6;margin-top:2px">${r.steps.join(' → ')}</div>`:''}</div>`).join('');
    const close=()=>bd.remove();
    bd.addEventListener('click',e=>{if(e.target===bd)close()});
    bd.querySelector('#close-rec').addEventListener('click',close);
  });

  function render(){
    const sf=statusFields.find(f=>f.key==='round'),sf2=statusFields.find(f=>f.key==='success'||f.key==='score');
    updateStatus(bar,'round',`${state.round}/10`);
    if(state.success!==undefined&&statusFields.some(f=>f.key==='success'))updateStatus(bar,'success',`${state.success}/6`);
    if(state.score!==undefined&&statusFields.some(f=>f.key==='score'))updateStatus(bar,'score',`${state.score}/60`);
    if(statusFields.some(f=>f.key==='deck'))updateStatus(bar,'deck',`${state.deck.length}`);
    dv.setCount(state.deck.length);
    zC.innerHTML='';
    state.hand.forEach((c,i)=>{
      const e=createNumCard(c,{highlight:i<2&&state.hand.length>1});
      e.style.animation=`card-fly-in 0.5s ${i*.08}s backwards`;
      zC.appendChild(e);
    });
    zO.innerHTML='';
    zO.appendChild(createOpRow(state.opState));
  }
  bindOpPlay(zO,playOp);
  enableDrag(zC,(from,to)=>{const arr=[...state.hand];const[m]=arr.splice(from,1);arr.splice(to,0,m);state.hand=arr;render()});

  function playOp(op){
    if(state.hand.length<2)return;
    if(!Logic.canOperate(op,state.opState)){showToast('该运算符已被禁用');BGM.playSfx('op-invalid');return}
    const forcedOps=state.opState&&state.opState.forced?state.opState.forced:new Set();
    const isLastOp=state.hand.length===2;
    if(isLastOp&&forcedOps.size>0&&!forcedUsed&&!forcedOps.has(op)){
      const fl=[...forcedOps].map(o=>OP_GLYPH[o]).join('、');
      showToast(`必须使用 ${fl} 完成本轮运算`);zC.classList.add('flash-warn');setTimeout(()=>zC.classList.remove('flash-warn'),1200);BGM.playSfx('op-invalid');return
    }
    const a=state.hand[0].value,b=state.hand[1].value;
    const v=Logic.validateOp(a,op,b,{minResult:1});
    if(!v.ok){showToast(v.reason==='div-zero'?'除数不能为零':'结果不能小于1');zC.classList.add('flash-warn');setTimeout(()=>zC.classList.remove('flash-warn'),1200);BGM.playSfx('op-invalid');return}
    BGM.playSfx(op==='+'?'op-add':op==='-'?'op-sub':op==='*'?'op-mul':'op-div');
    const cards=zC.querySelectorAll('.num-card');
    bump(cards[0]);vanish(cards[1]);
    stepLog.push(`${a}${OP_GLYPH[op]}${b}=${v.result}`);
    if(forcedOps.has(op))forcedUsed=true;
    setTimeout(()=>{
      const nh=[...state.hand];
      nh[0]={...nh[0],value:v.result,modified:true};
      nh.splice(1,1);
      state.hand=nh;
      showToast(`= ${v.result}`);
      if(state.hand.length===1){
        if(v.result===state.target)BGM.playSfx('op-match24');
        finishRound();
      }else render();
    },400);
  }

  function finishRound(){
    const final=state.hand[0].value;
    const success=final===state.target;
    if(success&&state.recordSuccess){state.recordSuccess();bossBounce(boss);bossSay(boss,pick(VOICE.success))}
    else if(success){bossBounce(boss);bossSay(boss,pick(VOICE.success))}
    else{bossBounce(boss);bossSay(boss,pick(VOICE.fail))}
    records.unshift({round:state.round,success,result:final,steps:[...stepLog]});
    stepLog=[];
    const gained=state.scoreForResult?state.recordResult(final):undefined;
    updateStatus(bar,'round',`${state.round}/10`);
    if(state.success!==undefined&&statusFields.some(f=>f.key==='success'))updateStatus(bar,'success',`${state.success}/6`);
    if(state.score!==undefined&&statusFields.some(f=>f.key==='score'))updateStatus(bar,'score',`${state.score}/60`);
    const justWon=success&&state.success===6&&!state.congratulated;
    if(justWon)state.congratulated=true;
    UI.showModal({title:justWon?'恭喜达成6次24点！':(success?'算出来了！':'差一点点'),result:final,sub:justWon?`已达成6次24点，可继续挑战至第10轮<br>本回合结果${final}`:(success?`目标${state.target}`:`目标${state.target}，差${Math.abs(final-state.target)}${gained!==undefined?`<br>+${gained}分`:''}`),success,onDone:()=>{
      interfereEl.style.display='none';currentInterfere=null;forcedUsed=false;
      if(state.isOver())onFinish(state);
      else{state.startRound();render();if(state.shouldInterfere())setTimeout(()=>{bossBounce(boss);bossSay(boss,pick(VOICE.interfere))},200)}
    }});
  }

  bus.on('round:interfere',()=>render());
  state.startRound();forcedUsed=false;
  render();
  if(state.shouldInterfere())setTimeout(()=>{bossBounce(boss);bossSay(boss,pick(VOICE.interfere))},300);
}

// --- Game Board: Match3 ---
function mountMatch3Board(root,{state,bus,onHome}){
  const VOICE={combo1:'Nice!',combo2:'Good!',combo3:'Unbelievable!',near:'差一点点~',low:'快没牌了哦！',idle:['加油加油~','下一张该打什么呢~']};

  function playMatchFx(combo){
    const txt=combo>=3?'UNBELIEVABLE!':combo===2?'GOOD!':combo===1?'NICE!':'24!';
    const cls=combo>=3?'combo-3':combo===2?'combo-2':combo===1?'combo-1':'';
    const t=el('div',`m3-fx-text ${cls}`);t.textContent=txt;fxLayer.appendChild(t);

      s.style.setProperty('--dx',Math.cos(ang)*dist+'px');
      s.style.setProperty('--dy',Math.sin(ang)*dist+'px');
      s.style.background=combo>=3?'#ffeb3b':combo===2?'var(--magenta)':'var(--cyan)';
      s.style.boxShadow=`0 0 8px ${s.style.background}`;
      fxLayer.appendChild(s);
    }
    setTimeout(()=>{t.remove();ring.remove();fxLayer.querySelectorAll('.m3-fx-spark').forEach(s=>s.remove())},1300);

  boss.addEventListener('click',()=>bossSay(boss,pick(VOICE.idle)));

  bossTip.innerHTML='运算后自动补牌<br>左下角有道具<br>看能算出多少次24点';
  zB.appendChild(bossTip);

  const itemBtn=mkBtn('\uD83C\uDCCF','道具牌');itemBtn.style.fontSize='20px';zBt.appendChild(itemBtn);
  const opWrap=el('div');opWrap.style.cssText='flex:1;display:flex;align-items:center;justify-content:center;';
  opWrap.appendChild(createOpRow());
  bindOpPlay(opWrap,playOp);
  zBt.appendChild(opWrap);

  const resetBtn=mkBtn('\uD83D\uDD04','重置');
  zBt.appendChild(resetBtn);

    confirmReset();
  });
  function confirmReset(){
    const bd=el('div','modal-backdrop');
    bd.innerHTML=`<div class="modal" style="max-width:280px"><div class="modal-banner"></div><div class="modal-body"><div class="modal-title">重置游戏</div><div class="modal-sub">将重新发牌，分数和连击清零</div></div><div style="display:flex;border-top:1px solid var(--gold-deep)"><button class="modal-btn" id="cancel-btn" style="border-top:none;border-right:1px solid var(--gold-deep)">取消</button><button class="modal-btn" id="ok-btn" style="border-top:none">确定</button></div></div>`;

      bd.remove();

      updateAll();

      if(r.combo>=2)BGM.playSfx('m3-combo');
      bump(els[0]);vanish(els[0]);vanish(els[1]);

        showToast('= 24!');bossBounce(boss);bossSay(boss,comboVoice(state.combo));updateAll();

    }else if(type==='Q'){
      const picker=el('div','modal-backdrop');
      picker.innerHTML=`<div class="modal"><div class="modal-banner"></div><div class="modal-body"><div class="modal-title">选择运算符</div><div style="display:flex;gap:10px;justify-content:center;margin:14px 0">${Logic.OPS.map(op=>`<button data-op="${op}" style="background:linear-gradient(180deg,#2a2a4a,#1a1a30);border:2px solid var(--gold-deep);color:var(--gold);width:46px;height:56px;border-radius:4px;font-size:24px;font-weight:900;cursor:pointer">${OP_GLYPH[op]}</button>`).join('')}</div></div></div>`;
      document.body.appendChild(picker);
      picker.querySelectorAll('button[data-op]').forEach(b=>b.addEventListener('click',()=>{const op=b.dataset.op;picker.remove();const r=state.playItemQ(op);if(r){BGM.playSfx('m3-item-q');showToast(`Q: ${state.field[0].value}`);updateAll();renderField()}}));
      picker.addEventListener('click',e=>{if(e.target===picker)picker.remove()});
    }else if(type==='K'){
      BGM.playSfx('m3-item-k');
      showToast('点击场上要变24的牌');
      const handlers=[];
      zC.querySelectorAll('.num-card').forEach((el,i)=>{
        const h=()=>{handlers.forEach(([e,h])=>e.removeEventListener('click',h));state.playItemK(i);updateAll();renderField();bossBounce(boss);bossSay(boss,comboVoice(state.combo));showToast('K: 牌变24+1分');if(state.isOver())showFinal()};
        el.addEventListener('click',h);handlers.push([el,h]);
      });
    }
  }

  function showFinal(){
    UI.showModal({title:'游戏结束',result:`${state.score}分`,sub:`最高连击${state.maxCombo}`,success:state.score>0,onDone:onHome});
  }

  itemBtn.addEventListener('click',openItemPanel);
  updateAll();renderField();
}

return{mountMainMenu,mountClassicBoard,mountMermaidBoard,mountFunnyBoard,mountMatch3Board,createNumCard,bump,vanish,createOpCard,createOpRow,createStatusBar,updateStatus,createBossArea,bossBounce,bossSay,createDeckView,enableDrag,showModal,showToast,pick,el,mkBtn,PACKS};
})();

// ===== APP ENTRY =====
(function(){
  const app=document.getElementById('app');

  function goMenu(){
    app.innerHTML='';
    app.style.display='';app.style.flexDirection='';app.style.height='';
    UI.mountMainMenu(app,goGame);
  }

  function goGame(packId){
    app.innerHTML='';
    const rng=Logic.createRng(Date.now()&0xffffffff);
    let state;
    if(packId==='classic'){state=Logic.createClassicGame(rng);UI.mountClassicBoard(app,{state,bus:state.bus,onHome:goMenu})}
    else if(packId==='mermaid'){state=Logic.createMermaidGame(rng);UI.mountMermaidBoard(app,{state,bus:state.bus,onHome:goMenu})}
    else if(packId==='funny'){state=Logic.createFunnyGame(rng);UI.mountFunnyBoard(app,{state,bus:state.bus,onHome:goMenu})}
    else if(packId==='match3'){state=Logic.createMatch3Game(rng);UI.mountMatch3Board(app,{state,bus:state.bus,onHome:goMenu})}
    else{UI.showToast('未知牌包');goMenu()}
  }

  goMenu();
})();
</script>
</body>
