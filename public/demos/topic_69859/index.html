<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeBeat 节奏编程</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- WebGL 3D 隧道背景 -->
<canvas id="webgl-canvas"></canvas>
<!-- 背景粒子画布 -->
<canvas id="bg-canvas"></canvas>

<!-- 主容器 -->
<div id="app">

  <!-- ========== 开始界面 ========== -->
  <div id="start-screen" class="screen">
    <img src="images/codebeat-title.webp" class="start-title" alt="CodeBeat 节奏编程">
    <p class="start-subtitle">用音符编写代码，用节奏创造世界</p>

    <div class="instructions">
      <div class="instruction-card">
        <span class="key key-d">D</span>
        <span class="desc">显影</span>
      </div>
      <div class="instruction-card">
        <span class="key key-f">F</span>
        <span class="desc">显影</span>
      </div>
      <div class="instruction-card">
        <span class="key key-j">J</span>
        <span class="desc">显影</span>
      </div>
      <div class="instruction-card">
        <span class="key key-k">K</span>
        <span class="desc">重绘</span>
      </div>
    </div>

    <div class="settings-panel">
      <div class="settings-row">
        <span class="label">速度</span>
        <button class="option-btn" data-speed="slow">慢速</button>
        <button class="option-btn speed-active" data-speed="normal">普通</button>
        <button class="option-btn" data-speed="fast">快速</button>
      </div>
      <div class="settings-row">
        <span class="label">画作</span>
        <button class="option-btn artwork-active" data-artwork="cat">🐱 小猫</button>
        <button class="option-btn" data-artwork="heart">❤️ 爱心</button>
        <button class="option-btn" data-artwork="star">⭐ 星星</button>
      </div>
      <div class="settings-row">
        <span class="label">时长</span>
        <button class="option-btn" data-duration="30">30s</button>
        <button class="option-btn duration-active" data-duration="45">45s</button>
        <button class="option-btn" data-duration="60">60s</button>
        <button class="option-btn" data-duration="75">75s</button>
      </div>
      <div class="settings-row">
        <span class="label">模式</span>
        <button class="mode-btn mode-normal active" data-mode="normal">🎵 普通</button>
        <button class="mode-btn mode-life" data-mode="life">💗 生命</button>
      </div>
    </div>

    <button class="btn-start" id="btn-start">开 始 游 戏</button>
    <p style="font-size:11px;color:var(--text-dim);margin-top:8px;">空格键暂停 | Esc 返回主菜单</p>
  </div>

  <!-- ========== 游戏界面 ========== -->
  <div id="game-screen" class="screen hidden">
    <div class="game-hud">
      <div class="hud-item">
        <div class="hud-label">分数</div>
        <div class="hud-value score" id="hud-score">0</div>
      </div>
      <div class="hud-item">
        <div class="hud-label">连击</div>
        <div class="hud-value combo" id="hud-combo">0</div>
      </div>
      <div class="hud-item">
        <div class="hud-label">准确率</div>
        <div class="hud-value accuracy" id="hud-accuracy">100%</div>
      </div>
      <div class="hud-item">
        <div class="hud-label">时间</div>
        <div class="hud-timer" id="hud-timer">75s</div>
      </div>
      <div class="hud-item">
        <div class="hud-label">完成度</div>
        <div class="hud-value completion" id="hud-completion" style="color:var(--pink)">0%</div>
      </div>
      <div class="hud-item hearts-container hidden" id="hud-hearts">
        <div class="hud-label">生命</div>
        <div class="hearts-display" id="hearts-display"></div>
      </div>
    </div>

    <div class="game-main">
      <!-- 左侧轨道 -->
      <div id="tracks-area">
        <div class="track" data-key="D">
          <div class="track-notes" id="track-D"></div>
          <div class="judge-line" id="judge-D"></div>
          <div class="track-label">D</div>
        </div>
        <div class="track" data-key="F">
          <div class="track-notes" id="track-F"></div>
          <div class="judge-line" id="judge-F"></div>
          <div class="track-label">F</div>
        </div>
        <div class="track" data-key="J">
          <div class="track-notes" id="track-J"></div>
          <div class="judge-line" id="judge-J"></div>
          <div class="track-label">J</div>
        </div>
        <div class="track" data-key="K">
          <div class="track-notes" id="track-K"></div>
          <div class="judge-line" id="judge-K"></div>
          <div class="track-label">K</div>
        </div>
      </div>

      <!-- 右侧画布 -->
      <div id="canvas-area">
        <canvas id="draw-canvas"></canvas>
      </div>
    </div>
  </div>

  <!-- ========== 结果界面 ========== -->
  <div id="result-screen" class="screen hidden">
    <h2 class="result-title">作品完成！</h2>
    <div class="result-artwork" id="result-artwork"></div>
    <div class="result-stats">
      <div class="stat-item">
        <img class="grade-img" id="result-grade-img" src="" alt="评价">
        <div class="stat-label">评价</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="result-score" style="color:var(--gold)">0</div>
        <div class="stat-label">总分</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="result-maxcombo" style="color:var(--cyan)">0</div>
        <div class="stat-label">最高连击</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="result-accuracy" style="color:var(--green)">100%</div>
        <div class="stat-label">准确率</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="result-perfect" style="color:var(--gold)">0</div>
        <div class="stat-label">Perfect</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="result-great" style="color:var(--purple)">0</div>
        <div class="stat-label">Great</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="result-good" style="color:var(--blue)">0</div>
        <div class="stat-label">Good</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="result-miss" style="color:var(--red)">0</div>
        <div class="stat-label">Miss</div>
      </div>
    </div>
    <div class="key-sequence" id="key-sequence">
      <span style="color:var(--text-dim)">代码序列：</span>
    </div>
    <div class="result-buttons">
      <button class="btn btn-primary" id="btn-replay">再 来 一 局</button>
      <button class="btn btn-secondary" id="btn-save">保 存 作 品</button>
      <button class="btn btn-secondary" id="btn-menu">返 回 菜 单</button>
    </div>
  </div>

  <!-- ========== 暂停遮罩 ========== -->
  <div id="pause-overlay" class="hidden">
    <div class="pause-title">已 暂 停</div>
    <p style="color:var(--text-dim);font-size:14px;">按空格键继续</p>
    <button class="btn btn-secondary" id="btn-resume">继 续</button>
    <button class="btn btn-secondary" id="btn-quit">返 回 菜 单</button>
  </div>

  <!-- ========== 开场倒计时 ========== -->
  <div id="countdown-overlay" class="hidden">
    <div class="countdown-number" id="countdown-number">3</div>
  </div>

</div>

<!-- JS 模块（按依赖顺序加载） -->
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/dom.js"></script>
<script src="js/core/EventBus.js"></script>
<script src="js/core/StateMachine.js"></script>
<script src="js/utils/ObjectPool.js"></script>
<script src="js/audio.js"></script>
<script src="js/webgl.js"></script>
<script src="js/particles.js"></script>
<script src="js/pixel-art.js"></script>
<script src="js/canvas.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>

</body>
</html>
