<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>奥特曼传奇躲避战</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: #0a0a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Microsoft YaHei', sans-serif;
            touch-action: none;
            user-select: none;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 900px;
            background: linear-gradient(180deg, #0a0a4a 0%, #1a1a6e 50%, #0a0a3e 100%);
            overflow: hidden;
        }
        canvas { display: block; width: 100%; height: 100%; }
        #ui {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            pointer-events: none;
            z-index: 10;
        }
        #startScreen, #gameOverScreen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 30, 0.88);
            z-index: 20;
            pointer-events: all;
        }
        #gameOverScreen { display: none; }
        .title {
            font-size: 32px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 20px #ff6600, 0 0 40px #ff3300;
            margin-bottom: 10px;
            text-align: center;
        }
        .subtitle {
            font-size: 14px;
            color: #aaaaff;
            margin-bottom: 25px;
            text-align: center;
        }
        .btn {
            padding: 12px 40px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #ff6600, #ff3300);
            border: 2px solid #ffd700;
            border-radius: 25px;
            cursor: pointer;
            pointer-events: all;
            transition: transform 0.2s, box-shadow 0.2s;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 102, 0, 0.5);
        }
        .score-display {
            position: absolute;
            top: 10px; left: 15px;
            font-size: 16px;
            color: #ffd700;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        .hp-bar {
            position: absolute;
            top: 10px; right: 15px;
            width: 120px; height: 16px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #ffd700;
            border-radius: 8px;
            overflow: hidden;
        }
        .hp-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff3300, #ff6600, #ffaa00);
            transition: width 0.3s;
            width: 100%;
        }
        .hp-text {
            position: absolute;
            top: 30px; right: 15px;
            font-size: 11px;
            color: #ffd700;
        }
        .level-display {
            position: absolute;
            top: 28px; left: 15px;
            font-size: 12px;
            color: #ffaa00;
        }
        .energy-bar {
            position: absolute;
            top: 45px; left: 15px;
            width: 100px; height: 10px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #00ccff;
            border-radius: 5px;
            overflow: hidden;
        }
        .energy-fill {
            height: 100%;
            background: linear-gradient(90deg, #0044ff, #00ccff, #00ffff);
            transition: width 0.2s;
            width: 0%;
        }
        .energy-text {
            position: absolute;
            top: 58px; left: 15px;
            font-size: 10px;
            color: #00ccff;
        }
        .controls-hint {
            margin-top: 20px;
            font-size: 12px;
            color: #8888cc;
            text-align: center;
            line-height: 1.8;
        }
        .final-score {
            font-size: 42px;
            color: #ffd700;
            font-weight: bold;
            text-shadow: 0 0 20px #ff6600;
            margin: 15px 0;
        }
        /* 技能栏 */
        #skillBar {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 15;
            pointer-events: all;
        }
        .skill-slot {
            width: 46px;
            height: 46px;
            border-radius: 10px;
            border: 2px solid #ffd700;
            background: rgba(0, 0, 30, 0.7);
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: border-color 0.2s;
            overflow: hidden;
        }
        .skill-slot.ready { border-color: #00ff88; }
        .skill-slot.active { border-color: #00ffff; box-shadow: 0 0 15px rgba(0,255,255,0.5); }
        .skill-slot .skill-icon {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .skill-slot .skill-icon svg {
            width: 20px;
            height: 20px;
        }
        .skill-slot .skill-key {
            font-size: 9px;
            color: #aaa;
            margin-top: 1px;
        }
        .skill-slot .cooldown-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #fff;
            font-weight: bold;
        }
        .skill-slot:hover { border-color: #ff8800; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="ui">
            <div class="score-display">得分: <span id="score">0</span></div>
            <div class="level-display">等级: <span id="level">1</span></div>
            <div class="energy-bar"><div class="energy-fill" id="energyFill"></div></div>
            <div class="energy-text">能量: <span id="energyVal">0</span>/100</div>
            <div class="hp-bar"><div class="hp-fill" id="hpFill"></div></div>
            <div class="hp-text">生命</div>
        </div>
        <div id="skillBar"></div>
        <div id="startScreen">
            <div class="title">奥特曼传奇躲避战</div>
            <div class="subtitle">操控奥特曼，释放华丽技能，消灭一切怪兽！</div>
            <button class="btn" id="startBtn">开始战斗</button>
            <div class="controls-hint">
                ← → 或 A/D 键移动 &nbsp;|&nbsp; 1~8 释放技能<br>
                空格键释放当前选中技能<br>
                手机端点击技能图标释放
            </div>
        </div>
        <div id="gameOverScreen">
            <div class="title">战斗结束</div>
            <div class="final-score" id="finalScore">0</div>
            <div class="subtitle" id="finalRank">评价: 见习战士</div>
            <button class="btn" id="restartBtn">再次挑战</button>
        </div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('gameContainer');

function resizeCanvas() {
    canvas.width = container.clientWidth;
    canvas.height = container.clientHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

/* ========== 游戏全局状态 ========== */
let gameState = 'start';
let score = 0, level = 1, hp = 100, maxHp = 100;
let energy = 0, maxEnergy = 100;
let frameCount = 0;
let obstacles = [], particles = [], stars = [], skillEffects = [], floatingTexts = [];

/* ========== 奥特曼玩家 ========== */
const player = {
    x: 0, y: 0,
    width: 54, height: 80,
    speed: 5.5,
    invincible: false,
    invincibleTimer: 0,
    direction: 0,
    shieldActive: false,
    shieldTimer: 0,
    dashTimer: 0,
    freezeActive: false,
    freezeTimer: 0,
    ultBeamActive: false,
    ultBeamTimer: 0,
    magnetActive: false,
    magnetTimer: 0,
    currentSkillIdx: 0,
    animPhase: 0
};

/* ========== 技能系统 ========== */
const skills = [
    { name: '斯派修姆光线', key: '1', icon: 'beam', color: '#00ccff', energyCost: 25, cooldown: 0, maxCooldown: 180, ready: true, desc: '十字光线扫射全屏' },
    { name: '奥特屏障', key: '2', icon: 'shield', color: '#ffdd00', energyCost: 20, cooldown: 0, maxCooldown: 300, ready: true, desc: '护盾吸收3次伤害' },
    { name: '奥特冲刺', key: '3', icon: 'dash', color: '#ff8800', energyCost: 15, cooldown: 0, maxCooldown: 120, ready: true, desc: '瞬间无敌冲刺' },
    { name: '八分光轮', key: '4', icon: 'slash', color: '#00ffaa', energyCost: 30, cooldown: 0, maxCooldown: 240, ready: true, desc: '切割飞行轨迹上的敌人' },
    { name: '奥特冷冻', key: '5', icon: 'freeze', color: '#aaddff', energyCost: 20, cooldown: 0, maxCooldown: 360, ready: true, desc: '冻结所有敌人3秒' },
    { name: '奥特炸弹', key: '6', icon: 'bomb', color: '#ff4444', energyCost: 35, cooldown: 0, maxCooldown: 420, ready: true, desc: '全屏爆炸清除障碍' },
    { name: '奥特磁力', key: '7', icon: 'magnet', color: '#ff66ff', energyCost: 15, cooldown: 0, maxCooldown: 180, ready: true, desc: '吸走附近敌人+加分' },
    { name: '终极光线', key: '8', icon: 'ultbeam', color: '#ffffff', energyCost: 50, cooldown: 0, maxCooldown: 600, ready: true, desc: '超强大光线毁灭一切' }
];

// 构建技能栏UI
function buildSkillBar() {
    const bar = document.getElementById('skillBar');
    bar.innerHTML = '';
    skills.forEach((sk, i) => {
        const slot = document.createElement('div');
        slot.className = 'skill-slot ready';
        slot.id = 'skill_' + i;
        slot.title = `${sk.name} [${sk.key}]\n${sk.desc}\n能量消耗: ${sk.energyCost}`;
        slot.innerHTML = `
            <div class="skill-icon">${getSkillSVG(sk.icon, sk.color)}</div>
            <div class="skill-key">${sk.key}</div>
        `;
        slot.addEventListener('click', () => useSkill(i));
        bar.appendChild(slot);
    });
}

function getSkillSVG(icon, color) {
    const svgs = {
        beam: `<svg viewBox="0 0 24 24"><line x1="12" y1="2" x2="12" y2="22" stroke="${color}" stroke-width="2"/><line x1="2" y1="12" x2="22" y2="12" stroke="${color}" stroke-width="2"/><circle cx="12" cy="12" r="6" fill="none" stroke="${color}" stroke-width="1.5"/></svg>`,
        shield: `<svg viewBox="0 0 24 24"><path d="M12 2L3 7v6c0 5.5 3.8 10.7 9 12 5.2-1.3 9-6.5 9-12V7L12 2z" fill="none" stroke="${color}" stroke-width="2"/><path d="M12 2L3 7v6c0 5.5 3.8 10.7 9 12 5.2-1.3 9-6.5 9-12V7L12 2z" fill="${color}" opacity="0.2"/></svg>`,
        dash: `<svg viewBox="0 0 24 24"><path d="M5 12h14M15 7l5 5-5 5" stroke="${color}" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
        slash: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="${color}" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="${color}"/></svg>`,
        freeze: `<svg viewBox="0 0 24 24"><line x1="12" y1="2" x2="12" y2="22" stroke="${color}" stroke-width="2"/><line x1="4" y1="6" x2="20" y2="18" stroke="${color}" stroke-width="1.5"/><line x1="4" y1="18" x2="20" y2="6" stroke="${color}" stroke-width="1.5"/></svg>`,
        bomb: `<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7" fill="none" stroke="${color}" stroke-width="2"/><path d="M12 6v3M10 3h4" stroke="${color}" stroke-width="2" stroke-linecap="round"/><circle cx="10" cy="11" r="1.5" fill="${color}"/><circle cx="14" cy="15" r="1.5" fill="${color}"/></svg>`,
        magnet: `<svg viewBox="0 0 24 24"><path d="M6 3v9a6 6 0 0012 0V3M6 6h-2v4h2M18 6h2v4h-2" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round"/></svg>`,
        ultbeam: `<svg viewBox="0 0 24 24"><polygon points="12,1 16,10 12,8 8,10" fill="${color}"/><polygon points="8,10 16,10 18,22 6,22" fill="${color}" opacity="0.7"/><line x1="12" y1="1" x2="12" y2="22" stroke="#fff" stroke-width="1"/></svg>`
    };
    return svgs[icon] || '';
}

function updateSkillUI() {
    skills.forEach((sk, i) => {
        const el = document.getElementById('skill_' + i);
        if (!el) return;
        const cdOverlay = el.querySelector('.cooldown-overlay');
        if (sk.cooldown > 0) {
            el.className = 'skill-slot';
            if (!cdOverlay) {
                const ov = document.createElement('div');
                ov.className = 'cooldown-overlay';
                ov.textContent = Math.ceil(sk.cooldown / 60);
                el.appendChild(ov);
            } else {
                cdOverlay.textContent = Math.ceil(sk.cooldown / 60);
            }
        } else {
            el.className = 'skill-slot' + (sk.energyCost <= energy ? ' ready' : '');
            if (cdOverlay) cdOverlay.remove();
        }
    });
}

function useSkill(idx) {
    if (gameState !== 'playing') return;
    const sk = skills[idx];
    if (sk.cooldown > 0 || energy < sk.energyCost) return;

    energy -= sk.energyCost;
    sk.cooldown = sk.maxCooldown;

    switch(idx) {
        case 0: castBeam(); break;
        case 1: castShield(); break;
        case 2: castDash(); break;
        case 3: castSlash(); break;
        case 4: castFreeze(); break;
        case 5: castBomb(); break;
        case 6: castMagnet(); break;
        case 7: castUltBeam(); break;
    }

    updateSkillUI();
}

/* ========== 技能实现 ========== */
function castBeam() {
    // 斯派修姆光线: 十字交叉光线横扫全屏
    skillEffects.push({ type: 'beam', x: player.x, y: player.y, timer: 45, maxTimer: 45, width: 50 });
    // 对屏幕上所有障碍造成伤害
    obstacles.forEach(obs => {
        if (Math.abs(obs.x - player.x) < 60 || Math.abs(obs.y - player.y) < 100) {
            destroyObstacle(obs);
        }
    });
    addFloatingText(player.x, player.y - 60, '斯派修姆光线!', '#00ccff');
    createExplosion(player.x, player.y, '#00ccff', 30);
}

function castShield() {
    player.shieldActive = true;
    player.shieldTimer = 300; // 5秒
    skillEffects.push({ type: 'shield', x: player.x, y: player.y, timer: 300 });
    addFloatingText(player.x, player.y - 60, '奥特屏障!', '#ffdd00');
}

function castDash() {
    player.invincible = true;
    player.invincibleTimer = 20;
    player.dashTimer = 15;
    // 冲刺方向
    const dir = player.direction || 1;
    player.x += dir * 80;
    player.x = Math.max(player.width, Math.min(canvas.width - player.width, player.x));
    // 残影粒子
    for (let i = 0; i < 10; i++) {
        particles.push({
            x: player.x - dir * i * 8, y: player.y + (Math.random() - 0.5) * 30,
            vx: -dir * 2, vy: (Math.random() - 0.5) * 2,
            life: 1, color: '#ff8800', size: 8
        });
    }
    addFloatingText(player.x, player.y - 60, '奥特冲刺!', '#ff8800');
}

function castSlash() {
    // 八分光轮: 水平抛出光轮
    skillEffects.push({ type: 'slash', x: player.x, y: player.y - 20, vx: 10, timer: 60 });
    addFloatingText(player.x, player.y - 60, '八分光轮!', '#00ffaa');
    createExplosion(player.x, player.y, '#00ffaa', 15);
}

function castFreeze() {
    player.freezeActive = true;
    player.freezeTimer = 180;
    skillEffects.push({ type: 'freeze', timer: 30, maxTimer: 30 });
    obstacles.forEach(obs => { obs.frozen = true; obs.frozenTimer = 180; });
    addFloatingText(canvas.width / 2, canvas.height / 2 - 50, '奥特冷冻!', '#aaddff');
}

function castBomb() {
    // 全屏爆炸
    skillEffects.push({ type: 'bomb', x: player.x, y: player.y, timer: 30, maxTimer: 30, radius: 0, maxRadius: 400 });
    obstacles.forEach(obs => destroyObstacle(obs));
    addFloatingText(canvas.width / 2, canvas.height / 2 - 50, '奥特炸弹!', '#ff4444');
    // 屏幕震动效果
    screenShake = 15;
}

function castMagnet() {
    player.magnetActive = true;
    player.magnetTimer = 180;
    skillEffects.push({ type: 'magnet', x: player.x, y: player.y, timer: 180 });
    addFloatingText(player.x, player.y - 60, '奥特磁力!', '#ff66ff');
}

function castUltBeam() {
    player.ultBeamActive = true;
    player.ultBeamTimer = 60;
    player.invincible = true;
    player.invincibleTimer = 60;
    skillEffects.push({ type: 'ultbeam', x: player.x, y: player.y, timer: 60, maxTimer: 60 });
    // 立即消灭全部
    obstacles.forEach(obs => destroyObstacle(obs));
    addFloatingText(canvas.width / 2, 100, '终极光线!', '#ffffff');
    screenShake = 25;
    // 大量粒子
    for (let i = 0; i < 60; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 3;
        particles.push({
            x: player.x, y: player.y - 40,
            vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 5,
            life: 1.5, color: ['#ffffff', '#00ccff', '#ffdd00', '#ff6600'][Math.floor(Math.random() * 4)],
            size: Math.random() * 5 + 3
        });
    }
}

function destroyObstacle(obs) {
    createExplosion(obs.x, obs.y, obs.color || '#ff8800', 12);
    score += 50;
    obs.destroyed = true;
}

function addFloatingText(x, y, text, color) {
    floatingTexts.push({ x, y, text, color, life: 1 });
}

let screenShake = 0;

/* ========== 输入系统 ========== */
const keys = {};
let touchX = null;

document.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
    // 技能键
    if (e.key >= '1' && e.key <= '8') useSkill(parseInt(e.key) - 1);
});
document.addEventListener('keyup', (e) => { keys[e.key] = false; });

canvas.addEventListener('touchstart', (e) => { e.preventDefault(); const t = e.touches[0]; const r = canvas.getBoundingClientRect(); touchX = t.clientX - r.left; });
canvas.addEventListener('touchmove', (e) => { e.preventDefault(); const t = e.touches[0]; const r = canvas.getBoundingClientRect(); touchX = t.clientX - r.left; });
canvas.addEventListener('touchend', () => { touchX = null; });

/* ========== 星空 ========== */
function initStars() {
    stars = [];
    for (let i = 0; i < 100; i++) {
        stars.push({
            x: Math.random() * canvas.width, y: Math.random() * canvas.height,
            size: Math.random() * 2 + 0.5, speed: Math.random() * 1.2 + 0.3,
            brightness: Math.random()
        });
    }
}

/* ========== 绘制: 奥特曼（精细建模） ========== */
function drawUltraman(x, y) {
    ctx.save();
    const w = player.width, h = player.height;
    const inv = player.invincible;

    if (inv && Math.floor(frameCount / 3) % 2 === 0) ctx.globalAlpha = 0.4;

    // 护盾光环
    if (player.shieldActive) {
        ctx.beginPath();
        const sr = w * 1.2 + Math.sin(frameCount * 0.1) * 5;
        ctx.arc(x, y, sr, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 221, 0, ' + (0.4 + Math.sin(frameCount * 0.15) * 0.2) + ')';
        ctx.lineWidth = 3;
        ctx.shadowColor = '#ffdd00';
        ctx.shadowBlur = 20;
        ctx.stroke();
        ctx.shadowBlur = 0;
    }

    // 磁力光环
    if (player.magnetActive) {
        ctx.beginPath();
        const mr = w * 2 + Math.sin(frameCount * 0.15) * 10;
        ctx.arc(x, y, mr, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 100, 255, ' + (0.2 + Math.sin(frameCount * 0.2) * 0.15) + ')';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    const breath = Math.sin(frameCount * 0.06) * 2;
    const bodyY = y - h/2 + 22 + breath;

    // 腿部（带光影）
    ctx.fillStyle = '#cc0000';
    // 左腿
    drawRoundedRect(x - 14, bodyY + h - 40, 11, 24, 3);
    ctx.fillStyle = '#c0c0c0';
    ctx.fillRect(x - 12, bodyY + h - 38, 3, 18);
    // 右腿
    ctx.fillStyle = '#cc0000';
    drawRoundedRect(x + 3, bodyY + h - 40, 11, 24, 3);
    ctx.fillStyle = '#c0c0c0';
    ctx.fillRect(x + 9, bodyY + h - 38, 3, 18);

    // 靴子
    ctx.fillStyle = '#cc0000';
    drawRoundedRect(x - 16, bodyY + h - 18, 15, 8, 3);
    drawRoundedRect(x + 1, bodyY + h - 18, 15, 8, 3);

    // 身体主体
    const bodyGrad = ctx.createLinearGradient(x - w/2, bodyY, x + w/2, bodyY);
    bodyGrad.addColorStop(0, '#aa0000');
    bodyGrad.addColorStop(0.3, '#dd0000');
    bodyGrad.addColorStop(0.5, '#ee1111');
    bodyGrad.addColorStop(0.7, '#dd0000');
    bodyGrad.addColorStop(1, '#aa0000');
    ctx.fillStyle = bodyGrad;
    drawRoundedRect(x - w/2 + 10, bodyY, w - 20, h - 32, 5);

    // 银色胸甲线条
    ctx.fillStyle = '#d0d0d0';
    ctx.beginPath();
    ctx.moveTo(x - 4, bodyY + 2);
    ctx.lineTo(x + 4, bodyY + 2);
    ctx.lineTo(x + 6, bodyY + h - 34);
    ctx.lineTo(x - 6, bodyY + h - 34);
    ctx.closePath();
    ctx.fill();

    // 胸甲V字纹
    ctx.strokeStyle = '#888';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x - 12, bodyY + 5);
    ctx.lineTo(x, bodyY + 15);
    ctx.lineTo(x + 12, bodyY + 5);
    ctx.stroke();

    // 计时器（胸口蓝色灯）
    const timerPulse = hp < 30 ? (Math.sin(frameCount * 0.3) > 0 ? '#ff0000' : '#440000') : '#00aaff';
    ctx.fillStyle = timerPulse;
    ctx.shadowColor = timerPulse;
    ctx.shadowBlur = hp < 30 ? 12 : 6;
    ctx.beginPath();
    ctx.ellipse(x, bodyY + 15, 5, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // 手臂（更细致）
    const armSwing = Math.sin(frameCount * 0.08) * 3;
    // 左臂
    ctx.save();
    ctx.translate(x - w/2 + 6, bodyY + 5);
    ctx.rotate(-0.15 + Math.sin(frameCount * 0.08) * 0.1);
    const armGrad1 = ctx.createLinearGradient(0, 0, 0, 32);
    armGrad1.addColorStop(0, '#cc0000');
    armGrad1.addColorStop(0.4, '#dd0000');
    armGrad1.addColorStop(1, '#aa0000');
    ctx.fillStyle = armGrad1;
    drawRoundedRect(-6, 0, 12, 32, 4);
    // 银线
    ctx.fillStyle = '#c0c0c0';
    ctx.fillRect(-1, 3, 3, 24);
    // 拳头
    ctx.fillStyle = '#cc0000';
    ctx.beginPath();
    ctx.arc(0, 34, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 右臂
    ctx.save();
    ctx.translate(x + w/2 - 6, bodyY + 5);
    ctx.rotate(0.15 - Math.sin(frameCount * 0.08) * 0.1);
    ctx.fillStyle = armGrad1;
    drawRoundedRect(-6, 0, 12, 32, 4);
    ctx.fillStyle = '#c0c0c0';
    ctx.fillRect(-1, 3, 3, 24);
    ctx.fillStyle = '#cc0000';
    ctx.beginPath();
    ctx.arc(0, 34, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 头部
    const headY = bodyY - 16;
    const headGrad = ctx.createRadialGradient(x, headY, 2, x, headY, 20);
    headGrad.addColorStop(0, '#ee2222');
    headGrad.addColorStop(0.7, '#cc0000');
    headGrad.addColorStop(1, '#880000');
    ctx.fillStyle = headGrad;
    ctx.beginPath();
    ctx.ellipse(x, headY, 20, 16, 0, 0, Math.PI * 2);
    ctx.fill();

    // 头冠（头脊）
    ctx.fillStyle = '#dd0000';
    ctx.beginPath();
    ctx.moveTo(x - 3, headY - 14);
    ctx.lineTo(x, headY - 28);
    ctx.lineTo(x + 3, headY - 14);
    ctx.closePath();
    ctx.fill();
    // 头冠发光
    ctx.fillStyle = '#ff4444';
    ctx.beginPath();
    ctx.arc(x, headY - 26, 2, 0, Math.PI * 2);
    ctx.fill();

    // 银色面部线条
    ctx.fillStyle = '#c0c0c0';
    ctx.beginPath();
    ctx.moveTo(x - 14, headY - 5);
    ctx.lineTo(x - 8, headY - 10);
    ctx.lineTo(x - 6, headY + 5);
    ctx.lineTo(x - 10, headY + 10);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x + 14, headY - 5);
    ctx.lineTo(x + 8, headY - 10);
    ctx.lineTo(x + 6, headY + 5);
    ctx.lineTo(x + 10, headY + 10);
    ctx.closePath();
    ctx.fill();

    // 眼睛（大而发光）
    const eyeGlow = 0.8 + Math.sin(frameCount * 0.1) * 0.2;
    // 左眼
    ctx.fillStyle = '#ffff00';
    ctx.shadowColor = '#ffff00';
    ctx.shadowBlur = 8 * eyeGlow;
    ctx.beginPath();
    ctx.ellipse(x - 10, headY - 3, 7, 5, -0.15, 0, Math.PI * 2);
    ctx.fill();
    // 眼睛高光
    ctx.fillStyle = '#ffffff';
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.ellipse(x - 12, headY - 5, 2, 2, 0, 0, Math.PI * 2);
    ctx.fill();
    // 右眼
    ctx.fillStyle = '#ffff00';
    ctx.shadowColor = '#ffff00';
    ctx.shadowBlur = 8 * eyeGlow;
    ctx.beginPath();
    ctx.ellipse(x + 10, headY - 3, 7, 5, 0.15, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.ellipse(x + 8, headY - 5, 2, 2, 0, 0, Math.PI * 2);
    ctx.fill();

    // 头灯（彩色指示灯）
    ctx.fillStyle = '#00ffff';
    ctx.shadowColor = '#00ffff';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.ellipse(x, headY - 13, 3, 2.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // 身体发光轮廓（微弱外发光）
    ctx.strokeStyle = 'rgba(0, 150, 255, 0.15)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(x, y, w * 0.6, h * 0.55, 0, 0, Math.PI * 2);
    ctx.stroke();

    ctx.restore();
}

function drawRoundedRect(x, y, w, h, r) {
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
    ctx.fill();
}

/* ========== 绘制: 怪兽（精细建模） ========== */
function drawObstacle(obs) {
    ctx.save();
    ctx.translate(obs.x, obs.y);

    // 冰冻效果
    if (obs.frozen) {
        ctx.globalAlpha = 0.8;
        ctx.fillStyle = 'rgba(150, 220, 255, 0.3)';
        ctx.beginPath();
        ctx.arc(0, 0, obs.radius + 8, 0, Math.PI * 2);
        ctx.fill();
    }

    if (obs.type === 'meteor') {
        // 陨石 - 多层次岩石
        const grad = ctx.createRadialGradient(-obs.radius/3, -obs.radius/3, obs.radius * 0.1, 0, 0, obs.radius);
        grad.addColorStop(0, '#aa7744');
        grad.addColorStop(0.5, '#774422');
        grad.addColorStop(1, '#442211');
        ctx.fillStyle = grad;
        ctx.beginPath();
        // 不规则形状
        for (let a = 0; a < Math.PI * 2; a += 0.3) {
            const r = obs.radius + Math.sin(a * 3 + obs.rotAngle) * obs.radius * 0.2;
            const px = Math.cos(a) * r, py = Math.sin(a) * r;
            a === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        // 坑洞
        ctx.fillStyle = '#553311';
        ctx.beginPath();
        ctx.arc(obs.radius * 0.2, obs.radius * 0.1, obs.radius * 0.25, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(-obs.radius * 0.3, -obs.radius * 0.2, obs.radius * 0.15, 0, Math.PI * 2);
        ctx.fill();
        // 火焰尾迹
        for (let i = 0; i < 3; i++) {
            ctx.fillStyle = `rgba(255, ${80 + i * 50}, 0, ${0.4 - i * 0.1})`;
            ctx.beginPath();
            ctx.moveTo(-obs.radius * (0.8 + i * 0.3), obs.radius * 0.2 * (i - 1));
            ctx.lineTo(-obs.radius * (2.5 + i * 0.4), obs.radius * 0.4);
            ctx.lineTo(-obs.radius * (2.5 + i * 0.4), -obs.radius * 0.4);
            ctx.closePath();
            ctx.fill();
        }
        // 发光
        ctx.shadowColor = '#ff6600';
        ctx.shadowBlur = 10;

    } else if (obs.type === 'monster') {
        // 怪兽 - 贝琉拉风格
        const r = obs.radius;
        const bob = Math.sin(frameCount * 0.06 + (obs.x || 0)) * 3;

        // 身体
        const bodyGrad = ctx.createRadialGradient(0, bob, r * 0.1, 0, bob, r);
        bodyGrad.addColorStop(0, obs.mColor || '#33aa33');
        bodyGrad.addColorStop(0.6, obs.mColor2 || '#227722');
        bodyGrad.addColorStop(1, obs.mColor3 || '#114411');
        ctx.fillStyle = bodyGrad;
        ctx.beginPath();
        ctx.ellipse(0, bob, r * 1.1, r, 0, 0, Math.PI * 2);
        ctx.fill();

        // 鳞片纹理
        ctx.strokeStyle = 'rgba(0, 60, 0, 0.4)';
        ctx.lineWidth = 1;
        for (let i = -2; i <= 2; i++) {
            ctx.beginPath();
            ctx.arc(0, bob + i * 8, r * (0.4 + Math.abs(i) * 0.15), -0.8, 0.8);
            ctx.stroke();
        }

        // 腹部条纹
        ctx.fillStyle = obs.bellyColor || '#88cc44';
        ctx.beginPath();
        ctx.ellipse(0, bob + 5, r * 0.5, r * 0.7, 0, 0, Math.PI * 2);
        ctx.fill();

        // 眼睛（发光）
        ctx.fillStyle = obs.eyeColor || '#ff2200';
        ctx.shadowColor = obs.eyeColor || '#ff2200';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.ellipse(-r * 0.35, bob - r * 0.35, r * 0.22, r * 0.18, -0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(r * 0.35, bob - r * 0.35, r * 0.22, r * 0.18, 0.2, 0, Math.PI * 2);
        ctx.fill();
        // 瞳孔
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(-r * 0.33, bob - r * 0.33, r * 0.08, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(r * 0.37, bob - r * 0.33, r * 0.08, 0, Math.PI * 2);
        ctx.fill();

        // 嘴巴
        ctx.strokeStyle = '#111';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-r * 0.4, bob + r * 0.15);
        ctx.quadraticCurveTo(-r * 0.1, bob + r * 0.35, 0, bob + r * 0.2);
        ctx.quadraticCurveTo(r * 0.1, bob + r * 0.35, r * 0.4, bob + r * 0.15);
        ctx.stroke();

        // 牙齿
        ctx.fillStyle = '#fff';
        for (let i = 0; i < 4; i++) {
            const tx = -r * 0.25 + i * r * 0.16;
            ctx.beginPath();
            ctx.moveTo(tx - 2, bob + r * 0.18);
            ctx.lineTo(tx, bob + r * 0.28);
            ctx.lineTo(tx + 2, bob + r * 0.18);
            ctx.closePath();
            ctx.fill();
        }

        // 角/冠
        ctx.fillStyle = obs.hornColor || '#557733';
        ctx.beginPath();
        ctx.moveTo(-r * 0.4, bob - r + 5);
        ctx.lineTo(-r * 0.7, bob - r * 1.7);
        ctx.lineTo(-r * 0.1, bob - r + 2);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(r * 0.4, bob - r + 5);
        ctx.lineTo(r * 0.7, bob - r * 1.7);
        ctx.lineTo(r * 0.1, bob - r + 2);
        ctx.closePath();
        ctx.fill();

        // 尾巴
        ctx.strokeStyle = obs.mColor2 || '#227722';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, bob + r);
        ctx.quadraticCurveTo(r * 0.5, bob + r + 15, r * 0.2, bob + r + 25);
        ctx.stroke();

        // 小爪子
        ctx.fillStyle = obs.hornColor || '#557733';
        for (let side = -1; side <= 1; side += 2) {
            for (let c = 0; c < 3; c++) {
                ctx.beginPath();
                ctx.arc(side * (r * 0.7 + c * 3), bob + r * 0.6, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }

    } else if (obs.type === 'laser') {
        // 激光束
        const lc = obs.color || '#ff0088';
        // 外层光晕
        ctx.shadowColor = lc;
        ctx.shadowBlur = 25;
        ctx.fillStyle = lc;
        ctx.globalAlpha = 0.3;
        ctx.fillRect(-obs.width, -obs.height/2, obs.width * 2, obs.height);
        // 核心光束
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 15;
        ctx.fillStyle = lc;
        ctx.fillRect(-obs.width/2, -obs.height/2, obs.width, obs.height);
        // 白色核心
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.fillRect(-obs.width/6, -obs.height/2, obs.width/3, obs.height);
        // 闪烁粒子
        for (let i = 0; i < 3; i++) {
            const py = -obs.height/2 + Math.random() * obs.height;
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc((Math.random() - 0.5) * obs.width * 0.5, py, 2, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    ctx.restore();
}

/* ========== 粒子系统 ========== */
function drawParticles() {
    particles = particles.filter(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.02;
        p.vx *= 0.97;
        p.vy *= 0.97;
        if (p.life <= 0) return false;
        ctx.save();
        ctx.globalAlpha = Math.min(1, p.life);
        ctx.fillStyle = p.color;
        if (p.glow) { ctx.shadowColor = p.color; ctx.shadowBlur = 8; }
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(0.5, p.size * Math.min(1, p.life)), 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        return true;
    });
}

function createExplosion(x, y, color, count = 15) {
    for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 / count) * i + Math.random() * 0.5;
        const speed = Math.random() * 5 + 2;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
            life: 1, color, size: Math.random() * 4 + 2, glow: true
        });
    }
}

/* ========== 浮动文字 ========== */
function drawFloatingTexts() {
    floatingTexts = floatingTexts.filter(ft => {
        ft.y -= 1.5;
        ft.life -= 0.02;
        if (ft.life <= 0) return false;
        ctx.save();
        ctx.globalAlpha = ft.life;
        ctx.fillStyle = ft.color;
        ctx.shadowColor = ft.color;
        ctx.shadowBlur = 10;
        ctx.font = 'bold 16px Microsoft YaHei';
        ctx.textAlign = 'center';
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
        return true;
    });
}

/* ========== 技能特效绘制 ========== */
function drawSkillEffects() {
    skillEffects = skillEffects.filter(eff => {
        eff.timer--;
        const t = 1 - eff.timer / (eff.maxTimer || eff.timer);

        if (eff.type === 'beam') {
            // 十字光线
            const bw = eff.width * (1 - t * 0.5);
            ctx.save();
            ctx.globalAlpha = 1 - t;
            ctx.shadowColor = '#00ccff';
            ctx.shadowBlur = 30;
            ctx.fillStyle = '#00ccff';
            // 水平
            ctx.fillRect(0, eff.y - bw * 0.15, canvas.width, bw * 0.3);
            // 垂直
            ctx.fillRect(eff.x - bw * 0.15, 0, bw * 0.3, canvas.height);
            // 白色核心
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, eff.y - 3, canvas.width, 6);
            ctx.fillRect(eff.x - 3, 0, 6, canvas.height);
            ctx.restore();
        }

        if (eff.type === 'shield') {
            // 护盾（跟随玩家）
            eff.x = player.x;
            eff.y = player.y;
            ctx.save();
            ctx.globalAlpha = 0.15 + Math.sin(frameCount * 0.1) * 0.1;
            const sr = player.width * 1.3;
            const sg = ctx.createRadialGradient(eff.x, eff.y, 0, eff.x, eff.y, sr);
            sg.addColorStop(0, 'rgba(255, 221, 0, 0.3)');
            sg.addColorStop(0.7, 'rgba(255, 221, 0, 0.1)');
            sg.addColorStop(1, 'rgba(255, 221, 0, 0)');
            ctx.fillStyle = sg;
            ctx.beginPath();
            ctx.arc(eff.x, eff.y, sr, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        if (eff.type === 'slash') {
            // 光轮
            eff.x += eff.vx;
            ctx.save();
            ctx.globalAlpha = 1 - t * 0.5;
            ctx.shadowColor = '#00ffaa';
            ctx.shadowBlur = 20;
            ctx.strokeStyle = '#00ffaa';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(eff.x, eff.y, 20 + Math.sin(frameCount * 0.3) * 3, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(eff.x, eff.y, 6, 0, Math.PI * 2);
            ctx.fill();
            // 拖尾
            for (let i = 1; i <= 5; i++) {
                ctx.globalAlpha = (1 - t) * (1 - i * 0.2);
                ctx.beginPath();
                ctx.arc(eff.x - i * 12, eff.y, 3, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
            // 碰撞检测: 消灭路径上的障碍
            obstacles.forEach(obs => {
                const dx = eff.x - obs.x, dy = eff.y - obs.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const hitR = obs.radius || obs.width / 2;
                if (dist < hitR + 25 && !obs.destroyed) {
                    destroyObstacle(obs);
                }
            });
        }

        if (eff.type === 'freeze') {
            // 冰冻全屏闪烁
            ctx.save();
            ctx.globalAlpha = (1 - t) * 0.3;
            ctx.fillStyle = '#aaddff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            // 冰晶粒子
            for (let i = 0; i < 8; i++) {
                const ix = Math.random() * canvas.width, iy = Math.random() * canvas.height;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(ix, iy, 3, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        if (eff.type === 'bomb') {
            // 爆炸扩散
            eff.radius = eff.maxRadius * t;
            ctx.save();
            ctx.globalAlpha = (1 - t) * 0.6;
            ctx.strokeStyle = '#ff4444';
            ctx.shadowColor = '#ff6600';
            ctx.shadowBlur = 20;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(eff.x, eff.y, eff.radius, 0, Math.PI * 2);
            ctx.stroke();
            // 内环
            ctx.strokeStyle = '#ffaa00';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(eff.x, eff.y, eff.radius * 0.6, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = 'rgba(255, 100, 0, 0.1)';
            ctx.beginPath();
            ctx.arc(eff.x, eff.y, eff.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        if (eff.type === 'magnet') {
            eff.x = player.x;
            eff.y = player.y;
            // 吸引粒子效果
            obstacles.forEach(obs => {
                const dx = eff.x - obs.x, dy = eff.y - obs.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 200 && !obs.destroyed) {
                    const force = (200 - dist) / 200 * 3;
                    obs.x += (dx / dist) * force;
                    obs.y += (dy / dist) * force;
                    // 吸引粒子
                    if (Math.random() > 0.7) {
                        particles.push({
                            x: obs.x, y: obs.y,
                            vx: (eff.x - obs.x) * 0.05, vy: (eff.y - obs.y) * 0.05,
                            life: 0.6, color: '#ff66ff', size: 2, glow: true
                        });
                    }
                }
            });
            ctx.save();
            ctx.globalAlpha = 0.1 + Math.sin(frameCount * 0.15) * 0.05;
            ctx.strokeStyle = '#ff66ff';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 8]);
            ctx.beginPath();
            ctx.arc(eff.x, eff.y, 200, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.restore();
        }

        if (eff.type === 'ultbeam') {
            eff.x = player.x;
            eff.y = player.y;
            // 超级光线从奥特曼头顶射出
            ctx.save();
            ctx.globalAlpha = 0.8;
            // 主光柱
            const beamW = 30 + Math.sin(frameCount * 0.5) * 10;
            const grad = ctx.createLinearGradient(eff.x, eff.y - 50, eff.x, 0);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.2, '#00ccff');
            grad.addColorStop(0.5, '#0088ff');
            grad.addColorStop(1, 'rgba(0, 100, 255, 0)');
            ctx.fillStyle = grad;
            ctx.shadowColor = '#00ccff';
            ctx.shadowBlur = 40;
            ctx.fillRect(eff.x - beamW, 0, beamW * 2, eff.y - 50);
            // 白色核心
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.fillRect(eff.x - beamW * 0.2, 0, beamW * 0.4, eff.y - 50);
            // 扩散光
            ctx.fillStyle = 'rgba(0, 200, 255, 0.05)';
            ctx.beginPath();
            ctx.moveTo(eff.x - beamW * 2, 0);
            ctx.lineTo(eff.x, eff.y - 50);
            ctx.lineTo(eff.x + beamW * 2, 0);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            // 持续产生粒子
            if (frameCount % 2 === 0) {
                for (let i = 0; i < 5; i++) {
                    particles.push({
                        x: eff.x + (Math.random() - 0.5) * beamW * 2,
                        y: Math.random() * eff.y * 0.5,
                        vx: (Math.random() - 0.5) * 3,
                        vy: -Math.random() * 5,
                        life: 0.8,
                        color: ['#fff', '#00ccff', '#0088ff'][Math.floor(Math.random() * 3)],
                        size: Math.random() * 3 + 1,
                        glow: true
                    });
                }
            }
        }

        return eff.timer > 0;
    });
}

/* ========== 背景 ========== */
function drawBackground() {
    const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    gradient.addColorStop(0, '#030318');
    gradient.addColorStop(0.4, '#080838');
    gradient.addColorStop(0.8, '#0a0a4a');
    gradient.addColorStop(1, '#150a3e');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 星云
    ctx.save();
    ctx.globalAlpha = 0.06;
    const ng = ctx.createRadialGradient(canvas.width * 0.3, canvas.height * 0.2, 10, canvas.width * 0.3, canvas.height * 0.2, 150);
    ng.addColorStop(0, '#ff4488');
    ng.addColorStop(1, 'transparent');
    ctx.fillStyle = ng;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const ng2 = ctx.createRadialGradient(canvas.width * 0.7, canvas.height * 0.4, 10, canvas.width * 0.7, canvas.height * 0.4, 120);
    ng2.addColorStop(0, '#4488ff');
    ng2.addColorStop(1, 'transparent');
    ctx.fillStyle = ng2;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.restore();

    stars.forEach(star => {
        star.y += star.speed;
        if (star.y > canvas.height) { star.y = 0; star.x = Math.random() * canvas.width; }
        const a = 0.3 + star.brightness * 0.7 + Math.sin(frameCount * 0.05 + star.x) * 0.1;
        ctx.fillStyle = `rgba(255, 255, 255, ${a})`;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();
    });

    // 远景地面（城市轮廓）
    ctx.fillStyle = '#0c0c3a';
    for (let i = 0; i < canvas.width; i += 30) {
        const bh = 15 + Math.sin(i * 0.05) * 10 + Math.cos(i * 0.08) * 8;
        ctx.fillRect(i, canvas.height - 30 - bh, 25, bh + 30);
    }
    // 窗户灯光
    for (let i = 0; i < canvas.width; i += 30) {
        const bh = 15 + Math.sin(i * 0.05) * 10 + Math.cos(i * 0.08) * 8;
        for (let wy = canvas.height - 30 - bh + 5; wy < canvas.height - 30; wy += 8) {
            for (let wx = i + 4; wx < i + 22; wx += 8) {
                if (Math.random() > 0.4) {
                    ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255, 220, 100, 0.6)' : 'rgba(100, 200, 255, 0.4)';
                    ctx.fillRect(wx, wy, 4, 4);
                }
            }
        }
    }

    // 地面
    ctx.fillStyle = '#12123a';
    ctx.fillRect(0, canvas.height - 30, canvas.width, 30);
    const groundGrad = ctx.createLinearGradient(0, canvas.height - 35, 0, canvas.height - 30);
    groundGrad.addColorStop(0, '#2a2a6a');
    groundGrad.addColorStop(1, '#12123a');
    ctx.fillStyle = groundGrad;
    ctx.fillRect(0, canvas.height - 35, canvas.width, 5);
}

/* ========== 怪兽生成 ========== */
const monsterStyles = [
    { name: '贝琉拉', mColor: '#33aa33', mColor2: '#227722', mColor3: '#114411', bellyColor: '#88cc44', eyeColor: '#ff2200', hornColor: '#557733' },
    { name: '哥莫拉', mColor: '#884422', mColor2: '#663311', mColor3: '#441100', bellyColor: '#cc9966', eyeColor: '#ffaa00', hornColor: '#aa6633' },
    { name: '雷德王', mColor: '#666688', mColor2: '#555577', mColor3: '#333355', bellyColor: '#9999bb', eyeColor: '#ff4444', hornColor: '#8888aa' },
    { name: '巴尔坦', mColor: '#225588', mColor2: '#114477', mColor3: '#002255', bellyColor: '#66aacc', eyeColor: '#ff0066', hornColor: '#3377aa' },
    { name: '杰顿', mColor: '#111111', mColor2: '#222222', mColor3: '#000000', bellyColor: '#444444', eyeColor: '#ffff00', hornColor: '#333333' }
];

function spawnObstacle() {
    const roll = Math.random();
    let type;
    if (roll < 0.35) type = 'meteor';
    else if (roll < 0.75) type = 'monster';
    else type = 'laser';

    let obs = { type, x: 0, y: -50, speed: 0, destroyed: false, frozen: false, frozenTimer: 0, rotAngle: Math.random() * Math.PI * 2 };

    if (type === 'meteor') {
        obs.radius = Math.random() * 12 + 15;
        obs.x = Math.random() * (canvas.width - 60) + 30;
        obs.speed = Math.random() * 2.5 + 3 + level * 0.3;
    } else if (type === 'monster') {
        obs.radius = Math.random() * 8 + 18;
        obs.speed = Math.random() * 1.2 + 1.5 + level * 0.15;
        obs.x = Math.random() > 0.5 ? -40 : canvas.width + 40;
        obs.y = Math.random() * (canvas.height * 0.45) + 60;
        obs.direction = obs.x < 0 ? 1 : -1;
        // 随机怪兽样式
        const style = monsterStyles[Math.floor(Math.random() * monsterStyles.length)];
        Object.assign(obs, style);
    } else if (type === 'laser') {
        obs.width = Math.random() * 25 + 18;
        obs.height = Math.random() * 80 + 80;
        obs.x = Math.random() * (canvas.width - obs.width - 40) + obs.width / 2 + 20;
        obs.y = -obs.height;
        obs.speed = Math.random() * 1.5 + 2 + level * 0.25;
        obs.color = ['#ff0088', '#ff4400', '#cc00ff', '#ff0044'][Math.floor(Math.random() * 4)];
        obs.radius = 0; // for compatibility
    }

    obstacles.push(obs);
}

/* ========== 障碍物更新 ========== */
function updateObstacles() {
    obstacles = obstacles.filter(obs => {
        if (obs.destroyed) return false;

        if (obs.frozen) {
            obs.frozenTimer--;
            if (obs.frozenTimer <= 0) obs.frozen = false;
            return true;
        }

        if (obs.type === 'monster') {
            obs.x += obs.speed * obs.direction;
            obs.y += Math.sin(frameCount * 0.04 + (obs.x || 0)) * 0.8;
            if (obs.x < -60 || obs.x > canvas.width + 60) return false;
        } else {
            obs.y += obs.speed;
            if (obs.type === 'meteor') obs.rotAngle += 0.05;
        }

        if (obs.y > canvas.height + 100) return false;

        // 碰撞
        if (!player.invincible) {
            let hit = false;
            if (obs.type === 'meteor' || obs.type === 'monster') {
                const dx = player.x - obs.x, dy = player.y - obs.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < (obs.radius || 20) + player.width / 3) hit = true;
            } else if (obs.type === 'laser') {
                if (player.x > obs.x - obs.width / 2 - player.width / 2 &&
                    player.x < obs.x + obs.width / 2 + player.width / 2 &&
                    player.y > obs.y - obs.height / 2 &&
                    player.y < obs.y + obs.height / 2) hit = true;
            }

            if (hit) {
                if (player.shieldActive) {
                    player.shieldTimer -= 60;
                    if (player.shieldTimer <= 60) player.shieldActive = false;
                    createExplosion(obs.x, obs.y, '#ffdd00', 10);
                    obs.destroyed = true;
                    score += 20;
                    addFloatingText(obs.x, obs.y - 20, '格挡!', '#ffdd00');
                    return false;
                }
                hp -= 15;
                player.invincible = true;
                player.invincibleTimer = 45;
                createExplosion(player.x, player.y, '#ff4400', 18);
                obs.destroyed = true;
                if (hp <= 0) { hp = 0; gameOver(); }
                document.getElementById('hpFill').style.width = (hp / maxHp * 100) + '%';
                return false;
            }
        }

        // 磁力吸引消灭
        if (player.magnetActive) {
            const dx = player.x - obs.x, dy = player.y - obs.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 40) {
                destroyObstacle(obs);
                score += 30;
                return false;
            }
        }

        return true;
    });
}

/* ========== 玩家更新 ========== */
function updatePlayer() {
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) { player.x -= player.speed; player.direction = -1; }
    if (keys['ArrowRight'] || keys['d'] || keys['D']) { player.x += player.speed; player.direction = 1; }
    if (touchX !== null) {
        if (touchX < canvas.width / 2) { player.x -= player.speed; player.direction = -1; }
        else { player.x += player.speed; player.direction = 1; }
    }
    player.x = Math.max(player.width / 2, Math.min(canvas.width - player.width / 2, player.x));
    player.y = canvas.height - 120;

    if (player.invincible) {
        player.invincibleTimer--;
        if (player.invincibleTimer <= 0) player.invincible = false;
    }
    if (player.shieldActive) {
        player.shieldTimer--;
        if (player.shieldTimer <= 0) player.shieldActive = false;
    }
    if (player.freezeActive) {
        player.freezeTimer--;
        if (player.freezeTimer <= 0) player.freezeActive = false;
    }
    if (player.magnetActive) {
        player.magnetTimer--;
        if (player.magnetTimer <= 0) player.magnetActive = false;
    }
    if (player.ultBeamActive) {
        player.ultBeamTimer--;
        if (player.ultBeamTimer <= 0) player.ultBeamActive = false;
    }
}

/* ========== 游戏主循环 ========== */
function updateGame() {
    frameCount++;
    score++;

    const newLevel = Math.floor(score / 600) + 1;
    if (newLevel > level) {
        level = newLevel;
        document.getElementById('level').textContent = level;
        createExplosion(canvas.width / 2, canvas.height / 2, '#00ff88', 25);
        addFloatingText(canvas.width / 2, canvas.height / 2 - 80, '等级 ' + level + '!', '#00ff88');
    }

    // 能量自动恢复
    energy = Math.min(maxEnergy, energy + 0.15);
    document.getElementById('energyVal').textContent = Math.floor(energy);
    document.getElementById('energyFill').style.width = (energy / maxEnergy * 100) + '%';

    document.getElementById('score').textContent = score;

    const spawnRate = Math.max(25, 85 - level * 5);
    if (frameCount % spawnRate === 0) spawnObstacle();
    if (level > 3 && frameCount % 55 === 0) spawnObstacle();
    if (level > 6 && frameCount % 40 === 0) spawnObstacle();

    // 技能冷却
    skills.forEach(sk => {
        if (sk.cooldown > 0) sk.cooldown--;
    });

    updatePlayer();
    updateObstacles();
    updateSkillUI();

    // 屏幕震动衰减
    if (screenShake > 0) screenShake--;
}

function gameLoop() {
    if (gameState !== 'playing') return;

    ctx.save();
    if (screenShake > 0) {
        ctx.translate((Math.random() - 0.5) * screenShake * 1.5, (Math.random() - 0.5) * screenShake * 1.5);
    }

    ctx.clearRect(-10, -10, canvas.width + 20, canvas.height + 20);
    drawBackground();
    drawSkillEffects();
    obstacles.forEach(obs => drawObstacle(obs));
    drawUltraman(player.x, player.y);
    drawParticles();
    drawFloatingTexts();

    ctx.restore();

    updateGame();
    requestAnimationFrame(gameLoop);
}

/* ========== 游戏流程 ========== */
function startGame() {
    gameState = 'playing';
    score = 0; level = 1; hp = 100; energy = 0; frameCount = 0;
    obstacles = []; particles = []; skillEffects = []; floatingTexts = [];
    player.x = canvas.width / 2; player.y = canvas.height - 120;
    player.invincible = false; player.shieldActive = false; player.freezeActive = false;
    player.magnetActive = false; player.ultBeamActive = false;
    player.direction = 0;
    skills.forEach(sk => sk.cooldown = 0);

    document.getElementById('score').textContent = '0';
    document.getElementById('level').textContent = '1';
    document.getElementById('hpFill').style.width = '100%';
    document.getElementById('energyFill').style.width = '0%';
    document.getElementById('energyVal').textContent = '0';
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('gameOverScreen').style.display = 'none';

    buildSkillBar();
    initStars();
    gameLoop();
}

function gameOver() {
    gameState = 'gameover';
    let rank = '见习战士';
    if (score > 8000) rank = '光之巨人';
    else if (score > 5000) rank = '传奇英雄';
    else if (score > 3000) rank = '奥特兄弟';
    else if (score > 2000) rank = '宇宙警备队';
    else if (score > 1000) rank = '精英战士';
    else if (score > 500) rank = '正式战士';
    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalRank').textContent = '评价: ' + rank;
    document.getElementById('gameOverScreen').style.display = 'flex';
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);

initStars();
buildSkillBar();
drawBackground();

function animateStars() {
    if (gameState === 'start') {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBackground();
        requestAnimationFrame(animateStars);
    }
}
animateStars();
</script>
