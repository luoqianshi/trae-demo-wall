<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游之锚 - 运营情感化召回工具</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ECharts CDN -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ========== 全局基础 ========== */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background: #F7F3EC;
            color: #3D3229;
            min-width: 1200px; /* 适配1440x900，最小宽度保证布局不崩 */
            overflow-x: auto;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #D0C8C0; border-radius: 3px; }

        /* ========== 卡片通用样式 ========== */
        .card-base {
            background: #FFFFFF;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card-base:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 35px -5px rgba(0,0,0,0.08);
        }

        /* ========== 按钮通用样式 ========== */
        .btn-brand {
            background: #FF8C42;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
            font-family: inherit;
        }
        .btn-brand:hover {
            transform: scale(1.02);
            background: #F07A30;
            box-shadow: 0 4px 16px rgba(255,140,66,0.35);
        }
        .btn-brand:active {
            transform: scale(0.98);
        }
        .btn-brand:disabled {
            background: #CCC;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ========== 侧边栏 ========== */
        #sidebar {
            position: fixed;
            left: 0; top: 0; bottom: 0;
            width: 220px;
            background: #2C2F33;
            z-index: 100;
            display: flex;
            flex-direction: column;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 24px;
            color: #A0A4AB;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }
        .nav-item:hover {
            background: rgba(255,255,255,0.05);
            color: #E0E2E5;
        }
        .nav-item.active {
            background: #40444B;
            color: #FFB085;
            border-left-color: #FF8C42;
        }

        /* ========== 主内容区 ========== */
        #mainArea { margin-left: 220px; min-height: 100vh; }

        /* ========== 顶部栏 ========== */
        #topbar {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(247,243,236,0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding: 14px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* ========== 页面切换 ========== */
        .page-section { display: none; }
        .page-section.active { display: block; animation: pageFadeIn 0.35s ease; }
        @keyframes pageFadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        /* ========== 指标卡片 ========== */
        .metric-card {
            background: #FFFFFF;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
            padding: 24px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .metric-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 35px -5px rgba(0,0,0,0.08);
        }
        @keyframes flashGreen {
            0% { box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
            30% { box-shadow: 0 10px 25px -5px rgba(76,175,125,0.3); border-color: rgba(76,175,125,0.3); }
            100% { box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border-color: transparent; }
        }
        .flash-green { animation: flashGreen 0.6s ease; border: 1px solid transparent; }

        /* ========== 表格 ========== */
        .player-table th {
            background: #F9F5F0;
            color: #8B7E74;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 14px 20px;
            text-align: left;
        }
        .player-table td { padding: 14px 20px; border-bottom: 1px solid #F0E8E0; }
        .player-table tr { transition: background 0.2s ease; }
        .player-table tbody tr:hover { background: #FFF3E9; }
        .player-table tbody tr:last-child td { border-bottom: none; }

        /* ========== 聊天抽屉 ========== */
        .drawer-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(44,47,51,0.35);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }
        .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
        .drawer-panel {
            position: fixed;
            top: 0; right: 0; bottom: 0;
            width: 420px;
            background: #FFF9F5;
            z-index: 201;
            transform: translateX(100%);
            transition: transform 0.35s ease;
            display: flex;
            flex-direction: column;
            box-shadow: -10px 0 40px rgba(0,0,0,0.1);
        }
        .drawer-panel.open { transform: translateX(0); }

        /* 聊天气泡动画 */
        @keyframes chatBubbleIn {
            from { opacity: 0; transform: translateY(10px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0)   scale(1); }
        }
        .chat-bubble { animation: chatBubbleIn 0.35s ease forwards; }

        /* 系统消息（左对齐，灰色背景） */
        .msg-system {
            background: #f1f0f0;
            color: #3D3229;
            border-radius: 16px 16px 16px 4px;
            padding: 12px 16px;
            font-size: 14px;
            line-height: 1.7;
            max-width: 85%;
            word-break: break-word;
        }
        /* 玩家回复（右对齐，橙色背景） */
        .msg-player {
            background: #FFE1CC;
            color: #3D3229;
            border-radius: 16px 16px 4px 16px;
            padding: 12px 16px;
            font-size: 14px;
            line-height: 1.7;
            max-width: 85%;
            word-break: break-word;
        }
        /* 礼物卡片 */
        .gift-card-box {
            background: #FFFFFF;
            border: 1px solid #FFE4D0;
            border-radius: 16px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 85%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        /* ========== Toast ========== */
        @keyframes toastSlideIn {
            from { opacity: 0; transform: translateX(40px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes toastSlideOut {
            from { opacity: 1; transform: translateX(0); }
            to   { opacity: 0; transform: translateX(40px); }
        }
        .toast-item {
            animation: toastSlideIn 0.4s ease forwards;
        }
        .toast-item.hiding {
            animation: toastSlideOut 0.3s ease forwards;
        }

        /* ========== 搜索和下拉 ========== */
        .input-search {
            border: 1px solid #E8DDD0;
            border-radius: 12px;
            padding: 10px 14px 10px 38px;
            font-size: 14px;
            font-family: inherit;
            background: #FFFFFF;
            color: #3D3229;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            width: 220px;
        }
        .input-search:focus {
            border-color: #FF8C42;
            box-shadow: 0 0 0 3px rgba(255,140,66,0.15);
        }
        .select-filter {
            border: 1px solid #E8DDD0;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 14px;
            font-family: inherit;
            background: #FFFFFF;
            color: #3D3229;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .select-filter:focus { border-color: #FF8C42; }

        /* ========== 状态标签 ========== */
        .status-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 20px;
        }

        /* ========== VIP标签 ========== */
        .vip-tag {
            font-size: 12px;
            font-weight: 500;
            padding: 4px 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- ========================================================== -->
    <!-- 左侧导航栏                                                 -->
    <!-- ========================================================== -->
    <aside id="sidebar">
        <!-- Logo -->
        <div style="padding: 28px 24px 20px;">
            <div style="display:flex; align-items:center; gap:10px;">
                <div style="width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg,#FF8C42,#FFB085); display:flex; align-items:center; justify-content:center; color:white; font-size:18px;">
                    <i class="fas fa-anchor"></i>
                </div>
                <div>
                    <div style="color:white; font-size:16px; font-weight:700; letter-spacing:1px;">游之锚</div>
                    <div style="color:#8B8E93; font-size:11px; margin-top:2px;">运营情感化召回</div>
                </div>
            </div>
        </div>
        <!-- 导航菜单 -->
        <nav style="flex:1; padding: 8px 0;">
            <div class="nav-item active" data-page="dashboard" onclick="switchPage('dashboard')">
                <i class="fas fa-chart-line" style="width:20px; text-align:center;"></i>
                <span>数据总览</span>
            </div>
            <div class="nav-item" data-page="players" onclick="switchPage('players')">
                <i class="fas fa-users" style="width:20px; text-align:center;"></i>
                <span>流失玩家管理</span>
            </div>
            <div class="nav-item" data-page="records" onclick="switchPage('records')">
                <i class="fas fa-clipboard-list" style="width:20px; text-align:center;"></i>
                <span>召回记录</span>
            </div>
            <div class="nav-item" data-page="settings" onclick="switchPage('settings')">
                <i class="fas fa-cog" style="width:20px; text-align:center;"></i>
                <span>系统设置</span>
            </div>
        </nav>
        <!-- 底部 -->
        <div style="padding:16px 24px; border-top:1px solid rgba(255,255,255,0.08); color:#5A5D63; font-size:11px;">
            游之锚 v1.0.0 Demo
        </div>
    </aside>

    <!-- ========================================================== -->
    <!-- 主内容区                                                   -->
    <!-- ========================================================== -->
    <div id="mainArea">

        <!-- 顶部栏 -->
        <header id="topbar">
            <div>
                <h1 id="greetingText" style="font-size:18px; font-weight:600; color:#3D3229;"></h1>
                <p id="dateText" style="font-size:12px; color:#8B7E74; margin-top:3px;"></p>
            </div>
            <div style="display:flex; align-items:center; gap:16px;">
                <!-- 铃铛 -->
                <div style="position:relative; width:38px; height:38px; border-radius:10px; background:white; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,0.04); transition:background 0.2s;" onmouseover="this.style.background='#FFF3E9'" onmouseout="this.style.background='white'">
                    <i class="fas fa-bell" style="color:#8B7E74; font-size:15px;"></i>
                    <span id="bellBadge" style="position:absolute; top:-2px; right:-2px; width:10px; height:10px; background:#FF6B6B; border-radius:50%; border:2px solid #F7F3EC;"></span>
                </div>
                <!-- 头像 -->
                <div style="width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#FF8C42,#FFB085); display:flex; align-items:center; justify-content:center; color:white; font-size:13px; font-weight:700; cursor:pointer;">
                    运
                </div>
            </div>
        </header>

        <!-- 内容区 -->
        <div style="padding: 24px 32px 40px;">

            <!-- ===================== 页面1：数据总览 ===================== -->
            <div id="page-dashboard" class="page-section active">
                <!-- 4个指标卡片 -->
                <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 24px;">
                    <!-- 当前在线 -->
                    <div class="metric-card">
                        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
                            <span style="font-size:13px; color:#8B7E74; font-weight:500;">当前在线玩家</span>
                            <div style="width:40px; height:40px; border-radius:12px; background:#EBF4FF; display:flex; align-items:center; justify-content:center;">
                                <i class="fas fa-gamepad" style="color:#4A90D9; font-size:16px;"></i>
                            </div>
                        </div>
                        <div style="font-size:28px; font-weight:700; color:#3D3229; font-variant-numeric: tabular-nums;">3,247</div>
                        <div style="margin-top:8px; font-size:12px; color:#4CAF7D; font-weight:500;">
                            <i class="fas fa-arrow-up" style="font-size:10px;"></i> 12% <span style="color:#B8ADA3; font-weight:400;">较昨日</span>
                        </div>
                    </div>
                    <!-- 7天流失 -->
                    <div class="metric-card">
                        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
                            <span style="font-size:13px; color:#8B7E74; font-weight:500;">7天流失玩家</span>
                            <div style="width:40px; height:40px; border-radius:12px; background:#FFF0E8; display:flex; align-items:center; justify-content:center;">
                                <i class="fas fa-user-minus" style="color:#FF8C42; font-size:16px;"></i>
                            </div>
                        </div>
                        <div style="font-size:28px; font-weight:700; color:#3D3229; font-variant-numeric: tabular-nums;">489</div>
                        <div style="margin-top:8px; font-size:12px; color:#FF6B6B; font-weight:500;">
                            <i class="fas fa-arrow-up" style="font-size:10px;"></i> 5.3% <span style="color:#B8ADA3; font-weight:400;">较上周</span>
                        </div>
                    </div>
                    <!-- 已执行关怀（动态） -->
                    <div id="cardCare" class="metric-card">
                        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
                            <span style="font-size:13px; color:#8B7E74; font-weight:500;">已执行关怀</span>
                            <div style="width:40px; height:40px; border-radius:12px; background:#E8F5E9; display:flex; align-items:center; justify-content:center;">
                                <i class="fas fa-heart" style="color:#4CAF7D; font-size:16px;"></i>
                            </div>
                        </div>
                        <div id="careCountDisplay" style="font-size:28px; font-weight:700; color:#3D3229; font-variant-numeric: tabular-nums;">128</div>
                        <div style="margin-top:8px; font-size:12px; color:#4CAF7D; font-weight:500;">
                            <i class="fas fa-arrow-up" style="font-size:10px;"></i> 8.6% <span style="color:#B8ADA3; font-weight:400;">较上周</span>
                        </div>
                    </div>
                    <!-- 回流转化率（动态） -->
                    <div id="cardConv" class="metric-card">
                        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
                            <span style="font-size:13px; color:#8B7E74; font-weight:500;">回流转化率</span>
                            <div style="width:40px; height:40px; border-radius:12px; background:#E8F5E9; display:flex; align-items:center; justify-content:center;">
                                <i class="fas fa-chart-line" style="color:#4CAF7D; font-size:16px;"></i>
                            </div>
                        </div>
                        <div style="display:flex; align-items:baseline; gap:4px;">
                            <span id="convRateDisplay" style="font-size:28px; font-weight:700; color:#4CAF7D; font-variant-numeric: tabular-nums;">26.3</span>
                            <span style="font-size:16px; font-weight:600; color:#4CAF7D;">%</span>
                        </div>
                        <div style="margin-top:8px; font-size:12px; color:#4CAF7D; font-weight:500;">
                            <i class="fas fa-arrow-up" style="font-size:10px;"></i> 2.1% <span style="color:#B8ADA3; font-weight:400;">较上周</span>
                        </div>
                    </div>
                </div>

                <!-- ECharts 趋势图 -->
                <div class="card-base" style="padding: 24px; margin-bottom: 24px;">
                    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
                        <h2 style="font-size:16px; font-weight:600; color:#3D3229;">近7天流失与召回趋势</h2>
                        <div style="display:flex; gap:20px; font-size:12px; color:#8B7E74;">
                            <span style="display:flex; align-items:center; gap:6px;"><span style="width:16px; height:3px; background:#FF6B6B; border-radius:2px;"></span>流失人数</span>
                            <span style="display:flex; align-items:center; gap:6px;"><span style="width:16px; height:3px; background:#FF8C42; border-radius:2px;"></span>召回人数</span>
                        </div>
                    </div>
                    <div id="trendChart" style="width:100%; height:300px;"></div>
                </div>

                <!-- 待关怀高危玩家 -->
                <div class="card-base" style="padding: 24px;">
                    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
                        <h2 style="font-size:16px; font-weight:600; color:#3D3229;">待关怀高危玩家</h2>
                        <span style="font-size:12px; color:#8B7E74;">共 2 位</span>
                    </div>
                    <div id="urgentPlayersList"></div>
                </div>
            </div>

            <!-- ===================== 页面2：流失玩家管理 ===================== -->
            <div id="page-players" class="page-section">
                <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;">
                    <h2 style="font-size:18px; font-weight:600; color:#3D3229;">流失玩家管理</h2>
                    <div style="display:flex; gap:12px;">
                        <!-- 搜索框 -->
                        <div style="position:relative;">
                            <i class="fas fa-search" style="position:absolute; left:14px; top:50%; transform:translateY(-50%); color:#B8ADA3; font-size:13px;"></i>
                            <input type="text" id="searchInput" class="input-search" placeholder="搜索玩家昵称..." oninput="filterPlayers()">
                        </div>
                        <!-- 状态下拉 -->
                        <select id="statusFilter" class="select-filter" onchange="filterPlayers()">
                            <option value="">全部状态</option>
                            <option value="高危">高危</option>
                            <option value="预警">预警</option>
                        </select>
                    </div>
                </div>
                <!-- 数据表格 -->
                <div class="card-base" style="overflow:hidden;">
                    <div style="overflow-x:auto;">
                        <table class="player-table" style="width:100%; border-collapse:collapse;">
                            <thead>
                                <tr>
                                    <th>玩家</th>
                                    <th>标签</th>
                                    <th>最后登录</th>
                                    <th>流失天数</th>
                                    <th>状态</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="playersTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- ===================== 页面3：召回记录 ===================== -->
            <div id="page-records" class="page-section">
                <h2 style="font-size:18px; font-weight:600; color:#3D3229; margin-bottom:20px;">召回记录</h2>
                <div class="card-base" style="padding: 40px; text-align:center; color:#B8ADA3;">
                    <i class="fas fa-clipboard-list" style="font-size:48px; margin-bottom:16px; color:#E8DDD0;"></i>
                    <p style="font-size:15px;">召回记录功能正在开发中</p>
                    <p style="font-size:13px; margin-top:8px;">敬请期待完整版</p>
                </div>
            </div>

            <!-- ===================== 页面4：系统设置 ===================== -->
            <div id="page-settings" class="page-section">
                <h2 style="font-size:18px; font-weight:600; color:#3D3229; margin-bottom:20px;">系统设置</h2>
                <div class="card-base" style="padding: 40px; text-align:center; color:#B8ADA3;">
                    <i class="fas fa-cog" style="font-size:48px; margin-bottom:16px; color:#E8DDD0;"></i>
                    <p style="font-size:15px;">系统设置功能正在开发中</p>
                    <p style="font-size:13px; margin-top:8px;">敬请期待完整版</p>
                </div>
            </div>

        </div>
    </div>

    <!-- ========================================================== -->
    <!-- 召回聊天抽屉                                               -->
    <!-- ========================================================== -->
    <div id="drawerBackdrop" class="drawer-backdrop" onclick="closeDrawer()"></div>
    <div id="drawerPanel" class="drawer-panel">
        <!-- 抽屉头部 -->
        <div style="padding:18px 24px; border-bottom:1px solid #F0E8E0; display:flex; align-items:center; justify-content:space-between; background:#FFF9F5; flex-shrink:0;">
            <div>
                <h3 id="drawerTitle" style="font-size:15px; font-weight:600; color:#3D3229;"></h3>
                <p style="font-size:12px; color:#8B7E74; margin-top:2px;">模拟微信推送召回</p>
            </div>
            <button onclick="closeDrawer()" style="width:32px; height:32px; border-radius:8px; border:none; background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; color:#8B7E74; font-size:18px; transition:background 0.2s;" onmouseover="this.style.background='#F0E8E0'" onmouseout="this.style.background='transparent'">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <!-- 聊天区 -->
        <div id="chatArea" style="flex:1; overflow-y:auto; padding:20px 24px; display:flex; flex-direction:column; gap:14px;">

/** 页面切换 */
function switchPage(pageName) {
    state.currentPage = pageName;
    // 更新页面显示
    document.querySelectorAll('.page-section').forEach(p => p.classList.remove('active'));
    const target = document.getElementById('page-' + pageName);
    if (target) target.classList.add('active');
    // 更新导航高亮
    document.querySelectorAll('.nav-item').forEach(el => {
        el.classList.toggle('active', el.dataset.page === pageName);
    });
    // 切回 Dashboard 时重绘图表
    if (pageName === 'dashboard' && trendChart) {
        setTimeout(() => trendChart.resize(), 50);
    }
}

/** 打开召回抽屉 */
function openRecallDrawer(playerId) {
    const player = players.find(p => p.id === playerId);
    if (!player) return;
    state.selectedPlayer = player;
    state.drawerStep = 'chatting';

    // 设置标题
    document.getElementById('drawerTitle').textContent = `正在对「${player.name}」执行关怀`;

    // 清空聊天区
    const chatArea = document.getElementById('chatArea');
    chatArea.innerHTML = '';

    // 重置按钮
    const btn = document.getElementById('sendBtn');
    btn.disabled = true;
    btn.textContent = '发送并等待玩家回应';
    btn.style.background = '#FF8C42';
    btn.onclick = sendRecallMessage;

    // 打开抽屉
    document.getElementById('drawerBackdrop').classList.add('open');
    document.getElementById('drawerPanel').classList.add('open');

    // 逐条显示系统消息
    player.messages.forEach((msg, idx) => {
        setTimeout(() => {
            if (msg.type === 'text') {
                addSystemText(msg.content);
            } else if (msg.type === 'gift') {
                addSystemGift(msg.title, msg.desc);
            }
        }, 400 + idx * 700);
    });

    // 消息全部显示后启用按钮
    setTimeout(() => {
        btn.disabled = false;
    }, 400 + player.messages.length * 700 + 200);
}

/** 关闭抽屉 */
function closeDrawer() {
    document.getElementById('drawerBackdrop').classList.remove('open');
    document.getElementById('drawerPanel').classList.remove('open');
    state.selectedPlayer = null;
    state.drawerStep = 'idle';
}

/** 添加系统文本消息（左对齐） */
function addSystemText(text) {
    const chatArea = document.getElementById('chatArea');
    const div = document.createElement('div');
    div.className = 'chat-bubble';
    div.style.cssText = 'display:flex; justify-content:flex-start;';
    div.innerHTML = `<div class="msg-system">${escapeHtml(text)}</div>`;
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
}

/** 添加系统礼物卡片（左对齐） */
function addSystemGift(title, desc) {
    const chatArea = document.getElementById('chatArea');
    const div = document.createElement('div');
    div.className = 'chat-bubble';
    div.style.cssText = 'display:flex; justify-content:flex-start;';
    div.innerHTML = `
        <div class="gift-card-box">
            <div style="width:44px; height:44px; border-radius:12px; background:linear-gradient(135deg,#FF8C42,#FFB085); display:flex; align-items:center; justify-content:center; color:white; font-size:20px; flex-shrink:0;">
                <i class="fas fa-gift"></i>
            </div>
            <div>
                <div style="font-weight:600; font-size:14px; color:#3D3229;">${escapeHtml(title)}</div>
                <div style="font-size:12px; color:#8B7E74; margin-top:2px;">${escapeHtml(desc)}</div>
            </div>
        </div>
    `;
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
}

/** 添加玩家回复消息（右对齐） */
function addPlayerReply(text) {
    const chatArea = document.getElementById('chatArea');
    const div = document.createElement('div');
    div.className = 'chat-bubble';
    div.style.cssText = 'display:flex; justify-content:flex-end;';
    div.innerHTML = `<div class="msg-player">${escapeHtml(text)}</div>`;
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
}

/** 发送召回消息 */
function sendRecallMessage() {
    if (!state.selectedPlayer || state.drawerStep !== 'chatting') return;
    const player = state.selectedPlayer;
    const btn = document.getElementById('sendBtn');

    // 1. 按钮显示"发送中..."，禁用 0.8 秒
    btn.disabled = true;
    btn.textContent = '发送中...';
    state.drawerStep = 'sent';

    setTimeout(() => {
        // 2. 玩家回复气泡弹出
        addPlayerReply(player.reply);
        state.drawerStep = 'replied';

        // 3. Toast 提示
        showToast('✅ 玩家已触发回流，预计回流概率提升30%！');

        // 4. 数据联动：关怀次数 +1，卡片闪烁
        state.careCount += 1;
        const careCard = document.getElementById('cardCare');
        const careDisplay = document.getElementById('careCountDisplay');
        careDisplay.textContent = state.careCount;
        careCard.classList.remove('flash-green');
        void careCard.offsetWidth; // 触发重绘
        careCard.classList.add('flash-green');

        // 5. 转化率增加 0.5%~1.5%（随机）
        const increase = +(Math.random() * 1.0 + 0.5).toFixed(1);
        state.conversionRate = +((state.conversionRate + increase).toFixed(1));
        if (state.conversionRate > 99) state.conversionRate = 99;
        const convCard = document.getElementById('cardConv');
        const convDisplay = document.getElementById('convRateDisplay');
        convDisplay.textContent = state.conversionRate.toFixed(1);
        convCard.classList.remove('flash-green');
        void convCard.offsetWidth;
        convCard.classList.add('flash-green');

        // 6. 按钮变为完成状态
        btn.textContent = '✓ 已发送 · 玩家已读';
        btn.style.background = '#4CAF7D';

        // 隐藏铃铛红点（首次召回后）
        const badge = document.getElementById('bellBadge');
        if (badge) badge.style.display = 'none';

    }, 800);
}

/** 显示 Toast */
function showToast(message) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = 'toast-item';
    toast.style.cssText = 'pointer-events:auto; background:white; border-radius:14px; padding:14px 20px; box-shadow:0 8px 30px rgba(0,0,0,0.12); border:1px solid #E8DDD0; display:flex; align-items:center; gap:10px; max-width:320px;';
    toast.innerHTML = `
        <i class="fas fa-check-circle" style="color:#4CAF7D; font-size:18px; flex-shrink:0;"></i>
        <span style="font-size:14px; color:#3D3229; line-height:1.5;">${escapeHtml(message)}</span>
    `;
    container.appendChild(toast);

    // 3秒后消失
    setTimeout(() => {
        toast.classList.add('hiding');
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

/** 筛选玩家 */
function filterPlayers() {
    const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
    const status = document.getElementById('statusFilter').value;
    let filtered = players;
    if (keyword) {
        filtered = filtered.filter(p => p.name.toLowerCase().includes(keyword));
    }
    if (status) {
        filtered = filtered.filter(p => p.status === status);
    }
    renderPlayerTable(filtered);
}

/** 重置演示数据 */
function resetDemo() {
    state.careCount = INITIAL.careCount;
    state.conversionRate = INITIAL.conversionRate;
    state.selectedPlayer = null;
    state.drawerStep = 'idle';

    // 关闭抽屉
    closeDrawer();

    // 恢复数字显示
    document.getElementById('careCountDisplay').textContent = state.careCount;
    document.getElementById('convRateDisplay').textContent = state.conversionRate.toFixed(1);

    // 恢复搜索和筛选
    document.getElementById('searchInput').value = '';
    document.getElementById('statusFilter').value = '';
    renderPlayerTable(players);

    // 恢复铃铛红点
    const badge = document.getElementById('bellBadge');
    if (badge) badge.style.display = 'block';

    showToast('演示数据已重置');
}

/** 根据时间返回问候语 */
function getGreeting() {
    const h = new Date().getHours();
    if (h < 6)  return '夜深了，注意休息';
    if (h < 12) return '上午好，运营同学';
    if (h < 14) return '中午好，运营同学';
    if (h < 18) return '下午好，运营同学';
    return '晚上好，运营同学';
}

/** 返回日期字符串 */
function getDateStr() {
    const d = new Date();
    const weeks = ['日','一','二','三','四','五','六'];
    return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 星期${weeks[d.getDay()]}`;
}

/** HTML 转义防止 XSS */
function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

    // 渲染表格和列表
    renderPlayerTable(players);
    renderUrgentPlayers();

    // 初始化图表
    initChart();

    // 默认显示 Dashboard
    switchPage('dashboard');
}

// DOM 加载完成后执行
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
