appId: com.datapilot.desktop
productName: DataPilot
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
extraResources:
  - from: src/sandbox/python
    to: sandbox-python
  - from: resources/samples
    to: samples
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
