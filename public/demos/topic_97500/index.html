<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光语 —— 视障人士找物助手 Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        /* ========== 设计令牌 ========== */
        :root {
            --bg-deep: #0a0a0f;
            --bg-surface: #14141e;
            --bg-elevated: #1c1c2a;
            --bg-glass: rgba(20, 20, 30, 0.75);
            --accent-amber: #ffa500;
            --accent-amber-dim: #cc8400;
            --accent-cyan: #00d4ff;
            --accent-green: #00ff88;
            --accent-red: #ff4444;
            --text-primary: #f0f0f5;
            --text-secondary: #9999aa;
            --text-muted: #555566;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-active: rgba(255, 165, 0, 0.4);
            --shadow-glow: 0 0 24px rgba(255, 165, 0, 0.15);
            --shadow-cyan: 0 0 24px rgba(0, 212, 255, 0.25);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --font-display: 'Noto Serif SC', Georgia, serif;
            --font-body: 'Noto Sans SC', -apple-system, sans-serif;
        }

        /* ========== 全局重置 ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-deep);
            color: var(--text-primary);
            font-family: var(--font-body);
            -webkit-font-smoothing: antialiased;
        }

        /* ========== 主容器 ========== */
        #app {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ========== 顶部控制栏 ========== */
        .topbar {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 32px;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-subtle);
            flex-shrink: 0;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            font-family: var(--font-display);
            font-size: 28px;
            font-weight: 900;
            color: var(--accent-amber);
            text-shadow: 0 0 20px rgba(255, 165, 0, 0.3);
            letter-spacing: 4px;
        }

        .logo-sub {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .target-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .target-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 8px 16px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: var(--font-body);
            min-width: 72px;
        }

        .target-btn:hover {
            background: rgba(255, 165, 0, 0.08);
            border-color: var(--border-active);
            color: var(--text-primary);
            transform: translateY(-1px);
        }

        .target-btn.active {
            background: rgba(255, 165, 0, 0.12);
            border-color: var(--accent-amber);
            color: var(--accent-amber);
            box-shadow: var(--shadow-glow);
        }

        .target-btn .emoji {
            font-size: 24px;
            line-height: 1;
        }

        .target-btn .label {
            font-size: 11px;
            font-weight: 500;
        }

        .guide-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 500;
        }

        .guide-toggle:hover {
            border-color: var(--border-active);
            color: var(--text-primary);
        }

        .guide-toggle.active {
            background: rgba(0, 255, 136, 0.1);
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        .guide-toggle .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: all 0.25s ease;
        }

        .guide-toggle.active .dot {
            background: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ========== Canvas 场景 ========== */
        .canvas-wrapper {
            position: relative;
            flex: 1;
            overflow: hidden;
        }

        #scene {
            display: block;
            width: 100%;
            height: 100%;
            cursor: none;
        }

        /* ========== 场景覆盖层 ========== */
        .overlay-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .overlay-hint.visible {
            opacity: 1;
        }

        .overlay-hint .hint-title {
            font-family: var(--font-display);
            font-size: 32px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .overlay-hint .hint-desc {
            font-size: 14px;
            color: var(--text-secondary);
            letter-spacing: 1px;
        }

        /* ========== 底部状态栏 ========== */
        .statusbar {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 32px;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-subtle);
            flex-shrink: 0;
        }

        .status-group {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .status-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .status-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .status-value {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }

        .status-value.amber { color: var(--accent-amber); }
        .status-value.cyan { color: var(--accent-cyan); }
        .status-value.green { color: var(--accent-green); }
        .status-value.muted { color: var(--text-muted); }

        .audio-bars {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 24px;
        }

        .audio-bar {
            width: 4px;
            background: var(--accent-amber);
            border-radius: 2px;
            transition: height 0.1s ease;
            min-height: 3px;
            opacity: 0.3;
        }

        .audio-bar.active {
            opacity: 1;
        }

        /* ========== Toast 提示 ========== */
        .toast-container {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            pointer-events: none;
        }

        .toast {
            padding: 12px 24px;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-active);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
            box-shadow: var(--shadow-glow);
            animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
        }

        .toast.success {
            border-color: var(--accent-green);
            box-shadow: 0 0 24px rgba(0, 255, 136, 0.2);
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes toastOut {
            to { opacity: 0; transform: translateY(-10px); }
        }

        /* ========== 说明面板 ========== */
        .help-panel {
            position: absolute;
            bottom: 70px;
            right: 24px;
            z-index: 5;
            max-width: 280px;
            padding: 16px 20px;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.8;
            transition: opacity 0.3s ease;
        }

        .help-panel.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .help-panel .help-title {
            font-family: var(--font-display);
            font-size: 14px;
            font-weight: 600;
            color: var(--accent-amber);
            margin-bottom: 8px;
        }

        .help-panel .help-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .help-panel .help-icon {
            color: var(--accent-cyan);
            font-weight: 600;
            min-width: 60px;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- 顶部控制栏 -->
        <div class="topbar">
            <div class="topbar-left">
                <div>
                    <div class="logo">光语</div>
                    <div class="logo-sub">Find by Sound</div>
                </div>
            </div>
            <div class="target-buttons" id="targetButtons">
                <!-- 按钮由 JS 动态生成 -->
            </div>
            <div style="display: flex; gap: 8px;">
                <button class="guide-toggle" id="guideToggle">
                    <span class="dot"></span>
                    <span id="guideToggleText">开始引导</span>
                </button>
            </div>
        </div>

        <!-- Canvas 场景 -->
        <div class="canvas-wrapper">
            <canvas id="scene"></canvas>
            <div class="overlay-hint" id="overlayHint">
                <div class="hint-title">点击上方按钮选择要找的物品</div>
                <div class="hint-desc">戴上耳机体验最佳 · 鼠标模拟手部位置</div>
            </div>
            <div class="help-panel" id="helpPanel">
                <div class="help-title">音频引导说明</div>
                <div class="help-row"><span class="help-icon">左声道</span><span>目标在左侧，请向右移动</span></div>
                <div class="help-row"><span class="help-icon">右声道</span><span>目标在右侧，请向左移动</span></div>
                <div class="help-row"><span class="help-icon">高音调</span><span>目标在上方，请向下移动</span></div>
                <div class="help-row"><span class="help-icon">低音调</span><span>目标在下方，请向上移动</span></div>
                <div class="help-row"><span class="help-icon">节奏快</span><span>接近目标</span></div>
                <div class="help-row"><span class="help-icon">叮！</span><span>到达目标，可以抓取</span></div>
            </div>
        </div>

        <!-- 底部状态栏 -->
        <div class="statusbar">
            <div class="status-group">
                <div class="status-item">
                    <div class="status-label">目标</div>
                    <div class="status-value muted" id="statusTarget">未选择</div>
                </div>
                <div class="status-item">
                    <div class="status-label">距离</div>
                    <div class="status-value muted" id="statusDistance">—</div>
                </div>
                <div class="status-item">
                    <div class="status-label">方向</div>
                    <div class="status-value muted" id="statusDirection">—</div>
                </div>
                <div class="status-item">
                    <div class="status-label">状态</div>
                    <div class="status-value muted" id="statusState">待机</div>
                </div>
            </div>
            <div class="status-group">
                <div class="status-item">
                    <div class="status-label">音频反馈</div>
                    <div class="audio-bars" id="audioBars">
                        <div class="audio-bar" style="height: 6px;"></div>
                        <div class="audio-bar" style="height: 12px;"></div>
                        <div class="audio-bar" style="height: 18px;"></div>
                        <div class="audio-bar" style="height: 14px;"></div>
                        <div class="audio-bar" style="height: 8px;"></div>
                        <div class="audio-bar" style="height: 12px;"></div>
                        <div class="audio-bar" style="height: 6px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast 容器 -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
    // ========================================
    // 光语 Demo —— 核心逻辑
    // ========================================

    // ========== 类型定义 ==========
    /**
     * @typedef {Object} SceneItem
     * @property {string} id
     * @property {string} name
     * @property {string} emoji
     * @property {number} x
     * @property {number} y
     * @property {number} size
     */

    /**
     * @typedef {Object} Point
     * @property {number} x
     * @property {number} y
     */

    /**
     * @typedef {Object} RelativePosition
     * @property {number} dx
     * @property {number} dy
     * @property {number} distance
     * @property {boolean} isAtTarget
     * @property {string} direction
     * @property {number} pan
     * @property {number} frequency
     * @property {number} tempo
     */

    // ========== 场景物品数据 ==========
    /** @type {SceneItem[]} */
    const SCENE_ITEMS = [
        { id: 'medicine', name: '药盒', emoji: '💊', x: 0, y: 0, size: 64 },
        { id: 'remote',   name: '遥控器', emoji: '🎮', x: 0, y: 0, size: 64 },
        { id: 'cup',      name: '水杯', emoji: '☕', x: 0, y: 0, size: 64 },
        { id: 'keys',     name: '钥匙', emoji: '🔑', x: 0, y: 0, size: 64 },
        { id: 'phone',    name: '手机', emoji: '📱', x: 0, y: 0, size: 64 },
    ];

    // 像素到厘米换算
    const PX_TO_CM = 0.4;
    // 到达目标的阈值（像素）
    const TARGET_THRESHOLD = 50;

    // ========== 状态 ==========
    const state = {
        /** @type {SceneItem|null} */
        targetItem: null,
        /** @type {Point} */
        mousePos: { x: 0, y: 0 },
        isGuiding: false,
        isFound: false,
        canvasWidth: 0,
        canvasHeight: 0,
        audioInitialized: false,
    };

    // ========== AudioEngine 音频引擎 ==========
    const AudioEngine = {
        ctx: null,
        masterGain: null,

        init() {
            if (state.audioInitialized) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
            this.masterGain = this.ctx.createGain();
            this.masterGain.gain.value = 0.15;
            this.masterGain.connect(this.ctx.destination);
            state.audioInitialized = true;
        },

        /**
         * 播放一次提示音
         * @param {number} pan -1(左) ~ 1(右)
         * @param {number} frequency 音高频率 Hz
         * @param {number} duration 持续时间 ms
         */
        playTone(pan, frequency, duration = 120) {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const panner = this.ctx.createStereoPanner();
            panner.pan.value = Math.max(-1, Math.min(1, pan));
            osc.type = 'sine';
            osc.frequency.value = frequency;
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.5, now + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration / 1000);
            osc.connect(gain);
            gain.connect(panner);
            panner.connect(this.masterGain);
            osc.start(now);
            osc.stop(now + duration / 1000 + 0.05);
        },

        /** 播放成功音（上升音阶） */
        playSuccessSound() {
            if (!this.ctx) return;
            const notes = [523.25, 659.25, 783.99, 1046.50]; // C5 E5 G5 C6
            notes.forEach((freq, i) => {
                setTimeout(() => {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.4, now + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.connect(gain);
                    gain.connect(this.masterGain);
                    osc.start(now);
                    osc.stop(now + 0.35);
                }, i * 80);
            });
        },

        /** 语音播报 */
        speak(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'zh-CN';
            utter.rate = 1.1;
            utter.pitch = 1.0;
            window.speechSynthesis.speak(utter);
        },
    };

    // ========== DirectionCalculator 方向计算 ==========
    /**
     * @param {Point} hand
     * @param {Point} target
     * @returns {RelativePosition}
     */
    function calcRelativePosition(hand, target) {
        const dx = target.x - hand.x;
        const dy = target.y - hand.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        const isAtTarget = distance < TARGET_THRESHOLD;

        // 方向描述
        let direction = '';
        const horizDir = Math.abs(dx) < 30 ? '' : (dx > 0 ? '右' : '左');
        const vertDir = Math.abs(dy) < 30 ? '' : (dy > 0 ? '下' : '上');
        if (horizDir && vertDir) direction = horizDir + vertDir + '方';
        else if (horizDir) direction = horizDir + '方';
        else if (vertDir) direction = vertDir + '方';
        else direction = '正中';

        // 声像：目标在右→pan偏右（引导向右），但提示音在反方向引导
        // 手在目标左侧(dx>0) → 需要向右移动 → 右声道提示
        const pan = Math.max(-1, Math.min(1, dx / 300));

        // 音高：目标在上方(dy<0) → 高音；下方(dy>0) → 低音
        const baseFreq = 600;
        const frequency = Math.max(300, Math.min(1000, baseFreq - dy * 0.8));

        // 节奏：距离越近越快
        const tempo = Math.max(150, Math.min(800, distance * 2.5));

        return { dx, dy, distance, isAtTarget, direction, pan, frequency, tempo };
    }

    // ========== SceneRenderer 场景渲染 ==========
    const SceneRenderer = {
        /** @param {CanvasRenderingContext2D} ctx */
        drawBackground(ctx, w, h) {
            // 深色渐变背景
            const grad = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, Math.max(w, h) / 1.2);
            grad.addColorStop(0, '#1a1a28');
            grad.addColorStop(0.6, '#0f0f18');
            grad.addColorStop(1, '#08080d');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            // 网格线
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
            ctx.lineWidth = 1;
            const gridSize = 50;
            for (let x = 0; x < w; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, h);
                ctx.stroke();
            }
            for (let y = 0; y < h; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(w, y);
                ctx.stroke();
            }

            // 暗角效果
            const vignette = ctx.createRadialGradient(w / 2, h / 2, h / 3, w / 2, h / 2, h / 1.2);
            vignette.addColorStop(0, 'rgba(0, 0, 0, 0)');
            vignette.addColorStop(1, 'rgba(0, 0, 0, 0.5)');
            ctx.fillStyle = vignette;
            ctx.fillRect(0, 0, w, h);
        },

        /**
         * @param {CanvasRenderingContext2D} ctx
         * @param {SceneItem[]} items
         */
        drawItems(ctx, items) {
            items.forEach(item => {
                const isTarget = state.targetItem && state.targetItem.id === item.id;
                const isFound = state.isFound && isTarget;

                // 物品光晕
                if (isTarget) {
                    const glowRadius = item.size * 1.5;
                    const glow = ctx.createRadialGradient(item.x, item.y, 0, item.x, item.y, glowRadius);
                    const color = isFound ? 'rgba(0, 255, 136, 0.3)' : 'rgba(0, 212, 255, 0.25)';
                    glow.addColorStop(0, color);
                    glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(item.x, item.y, glowRadius, 0, Math.PI * 2);
                    ctx.fill();

                    // 目标脉冲圈
                    if (!isFound) {
                        const pulsePhase = (Date.now() % 2000) / 2000;
                        const pulseRadius = item.size + pulsePhase * 40;
                        const pulseAlpha = (1 - pulsePhase) * 0.4;
                        ctx.strokeStyle = `rgba(0, 212, 255, ${pulseAlpha})`;
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.arc(item.x, item.y, pulseRadius, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                }

                // 物品背景圆
                ctx.fillStyle = isTarget
                    ? (isFound ? 'rgba(0, 255, 136, 0.1)' : 'rgba(0, 212, 255, 0.08)')
                    : 'rgba(255, 255, 255, 0.03)';
                ctx.beginPath();
                ctx.arc(item.x, item.y, item.size * 0.6, 0, Math.PI * 2);
                ctx.fill();

                // 物品边框
                if (isTarget) {
                    ctx.strokeStyle = isFound ? 'rgba(0, 255, 136, 0.6)' : 'rgba(0, 212, 255, 0.5)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(item.x, item.y, item.size * 0.6, 0, Math.PI * 2);
                    ctx.stroke();
                }

                // Emoji
                ctx.font = `${item.size}px serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(item.emoji, item.x, item.y);

                // 标签
                ctx.font = '12px "Noto Sans SC", sans-serif';
                ctx.fillStyle = isTarget ? 'rgba(0, 212, 255, 0.9)' : 'rgba(255, 255, 255, 0.3)';
                ctx.fillText(item.name, item.x, item.y + item.size * 0.7);
            });
        },

        /**
         * @param {CanvasRenderingContext2D} ctx
         * @param {Point} from
         * @param {Point} to
         */
        drawGuideLine(ctx, from, to) {
            if (!state.targetItem || state.isFound) return;
            const dx = to.x - from.x;
            const dy = to.y - from.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < TARGET_THRESHOLD) return;

            // 虚线引导
            ctx.strokeStyle = 'rgba(255, 165, 0, 0.2)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([6, 8]);
            ctx.beginPath();
            ctx.moveTo(from.x, from.y);
            ctx.lineTo(to.x, to.y);
            ctx.stroke();
            ctx.setLineDash([]);
        },

        /**
         * @param {CanvasRenderingContext2D} ctx
         * @param {number} x
         * @param {number} y
         */
        drawHand(ctx, x, y) {
            const isAtTarget = state.targetItem && !state.isFound &&
                Math.sqrt(
                    Math.pow(state.targetItem.x - x, 2) +
                    Math.pow(state.targetItem.y - y, 2)
                ) < TARGET_THRESHOLD;

            // 手部光晕
            const glowColor = isAtTarget ? 'rgba(0, 255, 136, 0.3)' : 'rgba(255, 165, 0, 0.15)';
            const glow = ctx.createRadialGradient(x, y, 0, x, y, 40);
            glow.addColorStop(0, glowColor);
            glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(x, y, 40, 0, Math.PI * 2);
            ctx.fill();

            // 手部圆环
            ctx.strokeStyle = isAtTarget ? 'rgba(0, 255, 136, 0.8)' : 'rgba(255, 165, 0, 0.6)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(x, y, 16, 0, Math.PI * 2);
            ctx.stroke();

            // 内部点
            ctx.fillStyle = isAtTarget ? 'rgba(0, 255, 136, 1)' : 'rgba(255, 165, 0, 0.9)';
            ctx.beginPath();
            ctx.arc(x, y, 4, 0, Math.PI * 2);
            ctx.fill();

            // 十字准星
            ctx.strokeStyle = isAtTarget ? 'rgba(0, 255, 136, 0.4)' : 'rgba(255, 165, 0, 0.3)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(x - 24, y);
            ctx.lineTo(x - 18, y);
            ctx.moveTo(x + 18, y);
            ctx.lineTo(x + 24, y);
            ctx.moveTo(x, y - 24);
            ctx.lineTo(x, y - 18);
            ctx.moveTo(x, y + 18);
            ctx.lineTo(x, y + 24);
            ctx.stroke();
        },
    };

    // ========== 布局物品 ==========
    function layoutItems() {
        const w = state.canvasWidth;
        const h = state.canvasHeight;
        const padding = 120;
        // 随机但均匀分布
        const positions = [
            { x: w * 0.2, y: h * 0.35 },
            { x: w * 0.5, y: h * 0.25 },
            { x: w * 0.8, y: h * 0.4 },
            { x: w * 0.35, y: h * 0.7 },
            { x: w * 0.7, y: h * 0.65 },
        ];
        SCENE_ITEMS.forEach((item, i) => {
            item.x = positions[i].x;
            item.y = positions[i].y;
        });
    }

    // ========== UI 更新 ==========
    function buildTargetButtons() {
        const container = document.getElementById('targetButtons');
        container.innerHTML = '';
        SCENE_ITEMS.forEach(item => {
            const btn = document.createElement('button');
            btn.className = 'target-btn';
            btn.dataset.itemId = item.id;
            btn.innerHTML = `<span class="emoji">${item.emoji}</span><span class="label">${item.name}</span>`;
            btn.addEventListener('click', () => selectTarget(item.id));
            container.appendChild(btn);
        });
    }

    function selectTarget(itemId) {
        const item = SCENE_ITEMS.find(i => i.id === itemId);
        if (!item) return;

        AudioEngine.init();

        state.targetItem = item;
        state.isFound = false;
        state.isGuiding = true;

        // 更新按钮状态
        document.querySelectorAll('.target-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.itemId === itemId);
        });

        // 更新引导开关
        const toggle = document.getElementById('guideToggle');
        toggle.classList.add('active');
        document.getElementById('guideToggleText').textContent = '引导中';

        // 隐藏提示
        document.getElementById('overlayHint').classList.remove('visible');

        // 语音播报
        const w = state.canvasWidth;
        const h = state.canvasHeight;
        const centerX = w / 2;
        const centerY = h / 2;
        const dx = item.x - centerX;
        const dy = item.y - centerY;
        const distCm = Math.round(Math.sqrt(dx * dx + dy * dy) * PX_TO_CM);
        let dirText = '';
        if (Math.abs(dx) < 50 && Math.abs(dy) < 50) dirText = '正前方';
        else {
            const horiz = Math.abs(dx) < 50 ? '' : (dx > 0 ? '右' : '左');
            const vert = Math.abs(dy) < 50 ? '' : (dy > 0 ? '下' : '前上方');
            dirText = horiz + vert;
        }
        AudioEngine.speak(`${item.name}在你${dirText}，大约${distCm}厘米`);

        showToast(`寻找：${item.name}`, 'info');
        updateStatus();
    }

    function toggleGuide() {
        if (!state.targetItem) {
            showToast('请先选择要找的物品', 'info');
            return;
        }
        state.isGuiding = !state.isGuiding;
        const toggle = document.getElementById('guideToggle');
        const text = document.getElementById('guideToggleText');
        if (state.isGuiding) {
            toggle.classList.add('active');
            text.textContent = '引导中';
        } else {
            toggle.classList.remove('active');
            text.textContent = '已暂停';
        }
        updateStatus();
    }

    function updateStatus() {
        const targetEl = document.getElementById('statusTarget');
        const distEl = document.getElementById('statusDistance');
        const dirEl = document.getElementById('statusDirection');
        const stateEl = document.getElementById('statusState');

        if (!state.targetItem) {
            targetEl.textContent = '未选择';
            targetEl.className = 'status-value muted';
            distEl.textContent = '—';
            distEl.className = 'status-value muted';
            dirEl.textContent = '—';
            dirEl.className = 'status-value muted';
            stateEl.textContent = '待机';
            stateEl.className = 'status-value muted';
            return;
        }

        targetEl.textContent = `${state.targetItem.emoji} ${state.targetItem.name}`;
        targetEl.className = 'status-value amber';

        if (state.isFound) {
            distEl.textContent = '已到达';
            distEl.className = 'status-value green';
            dirEl.textContent = '可以抓取';
            dirEl.className = 'status-value green';
            stateEl.textContent = '完成';
            stateEl.className = 'status-value green';
            return;
        }

        if (!state.isGuiding) {
            stateEl.textContent = '已暂停';
            stateEl.className = 'status-value muted';
            return;
        }

        const rel = calcRelativePosition(state.mousePos, state.targetItem);
        const distCm = Math.round(rel.distance * PX_TO_CM);
        distEl.textContent = `${distCm} cm`;
        distEl.className = distCm < 20 ? 'status-value green' : 'status-value cyan';
        dirEl.textContent = rel.direction;
        dirEl.className = 'status-value cyan';
        stateEl.textContent = rel.isAtTarget ? '到达目标' : '引导中';
        stateEl.className = rel.isAtTarget ? 'status-value green' : 'status-value amber';
    }

    // ========== Toast ==========
    function showToast(text, type = 'info') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast ${type === 'success' ? 'success' : ''}`;
        toast.textContent = text;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    // ========== 音频引导循环 ==========
    let lastToneTime = 0;
    let wasAtTarget = false;

    function audioGuideLoop(timestamp) {
        if (state.isGuiding && state.targetItem && !state.isFound) {
            const rel = calcRelativePosition(state.mousePos, state.targetItem);

            if (rel.isAtTarget) {
                if (!wasAtTarget) {
                    AudioEngine.playSuccessSound();
                    AudioEngine.speak('可以抓取');
                    wasAtTarget = true;
                    showToast('到达目标！点击物品完成抓取', 'success');
                    updateAudioBars(true, 'green');
                }
            } else {
                wasAtTarget = false;
                if (timestamp - lastToneTime > rel.tempo) {
                    AudioEngine.playTone(rel.pan, rel.frequency, 100);
                    lastToneTime = timestamp;
                    updateAudioBars(true, 'amber');
                }
            }
        } else {
            wasAtTarget = false;
        }
        requestAnimationFrame(audioGuideLoop);
    }

    function updateAudioBars(active, color) {
        const bars = document.querySelectorAll('.audio-bar');
        bars.forEach((bar, i) => {
            if (active && state.isGuiding) {
                bar.classList.add('active');
                bar.style.background = color === 'green' ? 'var(--accent-green)' : 'var(--accent-amber)';
                const h = Math.random() * 20 + 4;
                bar.style.height = `${h}px`;
            } else {
                bar.classList.remove('active');
                bar.style.height = `${4 + i * 2}px`;
                bar.style.background = 'var(--accent-amber)';
            }
        });
    }

    // ========== Canvas 渲染循环 ==========
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
        const wrapper = canvas.parentElement;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = wrapper.clientWidth * dpr;
        canvas.height = wrapper.clientHeight * dpr;
        canvas.style.width = wrapper.clientWidth + 'px';
        canvas.style.height = wrapper.clientHeight + 'px';
        ctx.scale(dpr, dpr);
        state.canvasWidth = wrapper.clientWidth;
        state.canvasHeight = wrapper.clientHeight;
        layoutItems();
    }

    function renderLoop() {
        const w = state.canvasWidth;
        const h = state.canvasHeight;
        ctx.clearRect(0, 0, w, h);

        SceneRenderer.drawBackground(ctx, w, h);
        SceneRenderer.drawItems(ctx, SCENE_ITEMS);

        if (state.targetItem && !state.isFound) {
            SceneRenderer.drawGuideLine(ctx, state.mousePos, state.targetItem);
        }

        SceneRenderer.drawHand(ctx, state.mousePos.x, state.mousePos.y);

        if (state.isGuiding && state.targetItem && !state.isFound) {
            updateStatus();
        }

        requestAnimationFrame(renderLoop);
    }

    // ========== 事件绑定 ==========
    function initEvents() {
        // 鼠标移动
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            state.mousePos.x = e.clientX - rect.left;
            state.mousePos.y = e.clientY - rect.top;
        });

        // 点击物品抓取
        canvas.addEventListener('click', (e) => {
            if (!state.targetItem || state.isFound) return;
            const rect = canvas.getBoundingClientRect();
            const cx = e.clientX - rect.left;
            const cy = e.clientY - rect.top;
            const dx = state.targetItem.x - cx;
            const dy = state.targetItem.y - cy;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < TARGET_THRESHOLD) {
                state.isFound = true;
                state.isGuiding = false;
                AudioEngine.playSuccessSound();
                AudioEngine.speak(`拿到了${state.targetItem.name}`);
                showToast(`抓取成功：${state.targetItem.name}`, 'success');
                const toggle = document.getElementById('guideToggle');
                toggle.classList.remove('active');
                document.getElementById('guideToggleText').textContent = '开始引导';
                updateStatus();
            }
        });

        // 引导开关
        document.getElementById('guideToggle').addEventListener('click', toggleGuide);

        // 窗口大小变化
        window.addEventListener('resize', resizeCanvas);

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ') {
                e.preventDefault();
                toggleGuide();
            } else if (e.key === 'Escape') {
                state.targetItem = null;
                state.isGuiding = false;
                state.isFound = false;
                document.querySelectorAll('.target-btn').forEach(b => b.classList.remove('active'));
                document.getElementById('guideToggle').classList.remove('active');
                document.getElementById('guideToggleText').textContent = '开始引导';
                document.getElementById('overlayHint').classList.add('visible');
                updateStatus();
            }
        });
    }

    // ========== 初始化 ==========
    function init() {
        resizeCanvas();
        buildTargetButtons();
        initEvents();

        // 初始鼠标位置居中
        state.mousePos.x = state.canvasWidth / 2;
        state.mousePos.y = state.canvasHeight / 2;

        // 显示初始提示
        setTimeout(() => {
            document.getElementById('overlayHint').classList.add('visible');
        }, 300);

        // 启动渲染循环
        requestAnimationFrame(renderLoop);
        requestAnimationFrame(audioGuideLoop);

        updateStatus();
    }

    // DOM 就绪后初始化
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
    </script>
</body>
</html>
