<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>山西省主题党团日活动规划地图</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 初始加载动画 -->
    <div class="initial-loading" id="initial-loading">
        <div class="loader-icon"></div>
        <div class="loader-title">山西省红色旅游规划系统</div>
        <div class="loader-sub" id="loading-text">正在加载系统...</div>
    </div>

    <div class="app-container" id="app-container" style="display:none;">
        <!-- 顶部导航栏 -->
        <header class="header">
            <div class="header-left">
                <div class="logo-icon"><i class="fas fa-map-marked-alt"></i></div>
                <h1>山西省主题党团日活动规划地图</h1>
            </div>
            <div class="header-right">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="搜索红色景点...">
                    <button id="search-btn"><i class="fas fa-search"></i></button>
                </div>
                <button class="btn btn-gold" id="route-planning-btn">
                    <i class="fas fa-route"></i> 路线规划
                </button>
            </div>
        </header>

        <!-- 主内容区域 -->
        <div class="main-content">
            <!-- 左侧景点列表 -->
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <h2><i class="fas fa-landmark"></i> 红色景点</h2>
                    <div class="filter-options">
                        <select id="region-filter">
                            <option value="all">全山西省</option>
                            <option value="taiyuan">太原市</option>
                            <option value="datong">大同市</option>
                            <option value="yangquan">阳泉市</option>
                            <option value="changzhi">长治市</option>
                            <option value="jincheng">晋城市</option>
                            <option value="shuozhou">朔州市</option>
                            <option value="jinzhong">晋中市</option>
                            <option value="yuncheng">运城市</option>
                            <option value="xinzhou">忻州市</option>
                            <option value="linfen">临汾市</option>
                            <option value="lvliang">吕梁市</option>
                        </select>
                        <select id="category-filter">
                            <option value="all">全部类型</option>
                            <option value="museum">纪念馆/博物馆</option>
                            <option value="battle">战役遗址</option>
                            <option value="memorial">纪念碑/纪念地</option>
                            <option value="former">故居/旧址</option>
                        </select>
                    </div>
                </div>
                <div class="spot-list" id="spot-list">
                    <div class="empty-state">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>正在加载景点数据...</p>
                    </div>
                </div>
            </aside>

            <!-- 地图容器 -->
            <div class="map-container">
                <div id="map"></div>
                <div class="map-controls">
                    <button class="map-control-btn" id="zoom-in" title="放大"><i class="fas fa-plus"></i></button>
                    <button class="map-control-btn" id="zoom-out" title="缩小"><i class="fas fa-minus"></i></button>
                    <button class="map-control-btn" id="locate-btn" title="定位"><i class="fas fa-crosshairs"></i></button>
                    <button class="map-control-btn" id="reset-view" title="重置视图"><i class="fas fa-compress-arrows-alt"></i></button>
                </div>
                <div class="map-legend">
                    <h4>图例</h4>
                    <div class="legend-item"><span class="legend-marker museum"></span><span>纪念馆/博物馆</span></div>
                    <div class="legend-item"><span class="legend-marker battle"></span><span>战役遗址</span></div>
                    <div class="legend-item"><span class="legend-marker memorial"></span><span>纪念碑/纪念地</span></div>
                    <div class="legend-item"><span class="legend-marker former"></span><span>故居/旧址</span></div>
                </div>
            </div>

            <!-- 右侧面板 -->
            <aside class="right-panel" id="right-panel">
                <!-- 景点详情 -->
                <div class="panel-tab active" id="spot-detail-tab">
                    <div class="spot-detail">
                        <div class="detail-header">
                            <h3 id="detail-title">选择景点查看详情</h3>
                            <button class="close-btn" id="close-detail"><i class="fas fa-times"></i></button>
                        </div>
                        <div class="detail-content">
                            <div class="detail-image" id="detail-image">
                                <div class="placeholder-text">
                                    <i class="fas fa-image"></i>
                                    <span>暂无图片</span>
                                </div>
                            </div>
                            <div class="detail-info">
                                <div class="info-item">
                                    <label><i class="fas fa-map-marker-alt"></i> 地址</label>
                                    <span id="detail-address">-</span>
                                </div>
                                <div class="info-item">
                                    <label><i class="far fa-clock"></i> 开放</label>
                                    <span id="detail-hours">-</span>
                                </div>
                                <div class="info-item">
                                    <label><i class="fas fa-phone"></i> 电话</label>
                                    <span id="detail-phone">-</span>
                                </div>
                                <div class="info-item">
                                    <label><i class="fas fa-star"></i> 评分</label>
                                    <span id="detail-rating">-</span>
                                </div>
                                <div class="info-item">
                                    <label><i class="fas fa-align-left"></i> 简介</label>
                                    <p id="detail-desc">-</p>
                                </div>
                            </div>
                        </div>
                        <div class="detail-actions">
                            <button class="btn btn-primary" id="add-to-route"><i class="fas fa-plus-circle"></i> 添加到行程</button>
                            <button class="btn btn-secondary" id="start-navigation"><i class="fas fa-directions"></i> 导航</button>
                        </div>
                    </div>
                </div>

                <!-- 行程规划 -->
                <div class="panel-tab" id="route-plan-tab">
                    <div class="route-planning">
                        <div class="route-header">
                            <h3><i class="fas fa-clipboard-list"></i> 行程规划</h3>
                            <div class="route-actions">
                                <button class="btn btn-sm" id="optimize-route" title="优化路线"><i class="fas fa-magic"></i></button>
                                <button class="btn btn-sm" id="clear-route" title="清空行程"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        </div>
                        <div class="route-settings">
                            <div class="setting-item">
                                <label>出发地</label>
                                <div class="address-search-wrapper">
                                    <input type="text" id="custom-start-point" placeholder="输入地址搜索（如：太原火车站）" autocomplete="off">
                                    <div class="address-suggestions" id="address-suggestions"></div>
                                </div>
                                <input type="hidden" id="start-point" value="custom">
                                <input type="hidden" id="start-coords" value="">
                            </div>
                            <div class="setting-item">
                                <label>出行方式</label>
                                <select id="travel-mode">
                                    <option value="driving">驾车</option>
                                    <option value="walking">步行</option>
                                    <option value="transit">公共交通</option>
                                </select>
                            </div>
                            <div class="setting-item">
                                <label>行程天数</label>
                                <select id="trip-days">
                                    <option value="1">1天</option>
                                    <option value="2" selected>2天</option>
                                    <option value="3">3天</option>
                                    <option value="5">5天</option>
                                    <option value="7">7天</option>
                                </select>
                            </div>
                        </div>
                        <div class="route-stops" id="route-stops">
                            <div class="empty-state"><i class="fas fa-route"></i><p>暂无行程站点，请添加景点</p></div>
                        </div>
                        <div class="route-summary" id="route-summary"></div>
                        <div class="route-actions-main">
                            <button class="btn btn-primary btn-block" id="generate-plan"><i class="fas fa-calendar-alt"></i> 生成行程方案</button>
                            <button class="btn btn-secondary btn-block" id="export-plan"><i class="fas fa-file-export"></i> 导出行程</button>
                        </div>
                    </div>
                </div>
            </aside>
        </div>

        <!-- 底部状态栏 -->
        <footer class="footer">
            <div class="footer-left">
                <span>当前显示：<strong id="display-count">0</strong> 个景点</span>
                <span>|</span>
                <span>行程已选：<strong id="route-count">0</strong> 个景点</span>
            </div>
            <div class="footer-center">
                <span class="version">山西省红色旅游规划系统 v1.0</span>
            </div>
            <div class="footer-right">
                <button class="footer-btn" id="feedback-btn"><i class="fas fa-comment-alt"></i> 意见反馈</button>
            </div>
        </footer>
    </div>

    <!-- 弹窗 -->
    <div class="modal" id="route-modal">
        <div class="modal-content" style="max-width:560px;">
            <div class="modal-header">
                <h3><i class="fas fa-route"></i> 路线规划详情</h3>
                <button class="close-btn" id="close-route-modal"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" id="route-modal-body"></div>
        </div>
    </div>

    <!-- 加载动画 -->
    <div class="loading-overlay" id="loading">
        <div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i><p>加载中...</p></div>
    </div>

    <!-- 提示消息 -->
    <div class="toast-container" id="toast-container"></div>

    <!-- 高德地图 JS API 1.4.15（无需安全密钥，更稳定） -->
    <script src="https://webapi.amap.com/maps?v=1.4.15&key=b8dc5f9e23d122f80c1d1c89ecf1ec79&plugin=AMap.PlaceSearch,AMap.Autocomplete,AMap.Geocoder,AMap.Driving"></script>

    <!-- 应用脚本 -->
    <script src="js/spots-data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
