<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="description" content="拾句 — 划走浮躁，拾起经典。用短视频的方式重新打开经典阅读。" />
    <title>拾句 · 划走浮躁，拾起经典</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+SC:wght@400;500;600&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // 在React加载前设置主题，避免CSS变量未定义导致空白
      (function() {
        try {
          var stored = localStorage.getItem('shiju-theme-store');
          if (stored) {
            var parsed = JSON.parse(stored);
            var theme = parsed && parsed.state && parsed.state.theme;
            if (theme === 'light' || theme === 'dark') {
              document.documentElement.setAttribute('data-theme', theme);
            }
          }
        } catch (e) {}
      })();
    </script>

`宋代`,category:[`历史`,`感慨`],emotion:[`豪迈`,`苍凉`],difficulty:3,wordCount:15,tags:[`宋词`,`苏轼`,`赤壁`]},{id:`038`,type:`quote`,text:`北冥有鱼，其名为鲲。鲲之大，不知其几千里也。`,source:`庄子`,author:`庄周`,translator:``,chapter:`逍遥游`,region:`中国古典`,era:`古代`,dynasty:`战国`,category:[`哲学`,`想象`],emotion:[`壮阔`,`自由`],difficulty:3,wordCount:19,tags:[`庄子`,`鲲鹏`,`逍遥`]},{id:`043`,type:`quote`,text:`关关雎鸠，在河之洲。窈窕淑女，君子好逑。`,source:`诗经`,author:`佚名`,translator:``,chapter:`周南·关雎`,region:`中国古典`,era:`古代`,dynasty:`先秦`,category:[`爱情`,`美好`],emotion:[`纯真`,`美好`],difficulty:2,wordCount:16,tags:[`诗经`,`爱情`,`关雎`]},{id:`047`,type:`quote`,text:`我与我周旋久，宁做我。`,source:`世说新语`,author:`刘义庆`,translator:``,chapter:`品藻篇`,region:`中国古典`,era:`古代`,dynasty:`南朝宋`,category:[`自我`,`独立`],emotion:[`坚定`,`洒脱`],difficulty:3,wordCount:9,tags:[`世说新语`,`自我`,`独立`]},{id:`015`,type:`quote`,text:`逝者如斯夫，不舍昼夜。`,source:`论语`,author:`孔子`,translator:``,chapter:`子罕篇`,region:`中国古典`,era:`古代`,dynasty:`春秋`,category:[`时间`,`感悟`],emotion:[`感慨`,`珍惜`],difficulty:2,wordCount:8,tags:[`论语`,`时间`,`川上`]},{id:`035`,type:`quote`,text:`众里寻他千百度，蓦然回首，那人却在，灯火阑珊处。`,source:`宋词三百首`,author:`辛弃疾`,translator:``,chapter:`青玉案·元夕`,region:`中国古典`,era:`古代`,dynasty:`宋代`,category:[`寻觅`,`人生`],emotion:[`惊喜`,`感悟`],difficulty:3,wordCount:24,tags:[`宋词`,`辛弃疾`,`元夕`]},{id:`101`,type:`quote`,text:`使生如夏花之绚烂，死如秋叶之静美。`,source:`飞鸟集`,author:`泰戈尔`,translator:`郑振铎`,chapter:``,region:`全球诗歌`,era:`20世纪`,dynasty:``,category:[`生死`,`美`],emotion:[`绚烂`,`静谧`],difficulty:2,wordCount:16,tags:[`泰戈尔`,`飞鸟集`,`生死`]},{id:`201`,type:`passage`,text:`穿过县界长长的隧道，便是雪国。夜空下一片白茫茫。火车在信号所前停了下来。一位姑娘从对面座位上站起身来，把岛村座位前的玻璃窗打开。一股冷空气卷着灌了进来。`,highlight:`穿过县界长长的隧道，便是雪国。夜空下一片白茫茫。`,source:`雪国`,author:`川端康成`,translator:`叶渭渠`,chapter:`开篇`,region:`日本`,era:`20世纪`,dynasty:``,category:[`唯美`,`入境`],emotion:[`清冷`,`幽美`],difficulty:3,wordCount:80,tags:[`川端康成`,`雪国`,`开篇`,`唯美`]}],dd={"001":{context:`此为《红楼梦》开篇题诗，曹雪芹以自嘲口吻道出创作心路。书中写尽贾府兴衰，字字血泪，却恐无人能解其中深意。`,analysis:`『荒唐言』与『辛酸泪』形成强烈对比，虚构的故事承载着真实的痛楚。『痴』字既是自嘲也是自许，『味』字留白，余韵悠长。`,crossReference:`与《庄子》『大梦』思想遥相呼应，皆以梦喻真；亦近于汤显祖《牡丹亭》题词『情不知所起，一往而深』之痴绝。`,modernRelevance:`在信息爆炸的今天，我们每个人都在书写自己的『荒唐言』——朋友圈、短视频、日记。谁又能真正理解谁？这提醒我们珍视那些愿意读懂自己的人。`,furtherReading:[`《红楼梦脂评汇校本》`,`《庄子·齐物论》`,`《牡丹亭》`]},"011":{context:`《论语》开篇第一章，孔子将学习、交友、修身三者并列，奠定了儒家为学之道的基调。三者层层递进，从个人到他人再到修养。`,analysis:`两个反问句『不亦……乎』温润如玉，既有自得之乐又有分享之喜。『说』（悦）在内，『乐』在外，由内而外的愉悦层次分明。`,crossReference:`与《学记》『教学相长』相呼应；亦近于《孟子》『得天下英才而教育之，三乐也』之乐。`,modernRelevance:`在碎片化学习时代，『时习之』提醒我们知识需要反复实践才能内化。而远方朋友的到来，在数字时代更显珍贵——线下相聚的温度无可替代。`,furtherReading:[`《论语集注》朱熹`,`《学记》`,`《孟子·尽心上》`]},"019":{context:`《道德经》开篇第一章，老子开门见山提出『道』的核心概念。此句为全书总纲，奠定了道家哲学的基石。`,analysis:`六个字三组对偶，节奏铿锵。『可道』之『道』与『常道』之『道』一字两义，既是言说又是大道。语言在此触及了自身的边界。`,crossReference:`与《庄子·齐物论》『言非吹也，言者有言』相呼应；亦近于维特根斯坦『凡是不可说的，必须保持沉默』。`,modernRelevance:`在标签化、定义化的时代，我们习惯用概念框定一切。老子提醒我们：真正的本质永远在语言之外。放下执念，才能看见更广阔的世界。`,furtherReading:[`《道德经注》王弼`,`《庄子·齐物论》`,`《逻辑哲学论》维特根斯坦`]},"026":{context:`李白被赐金放还，离开长安时作《行路难》三首。前文写『欲渡黄河冰塞川，将登太行雪满山』之困顿，此处突然扬起，以豪迈收束。`,analysis:`『长风破浪』化用宗悫『愿乘长风破万里浪』之典，气势磅礴。『直挂云帆』之『直』字，斩钉截铁，一扫前文迷茫，尽显太白本色。`,crossReference:`与曹操《短歌行》『老骥伏枥，志在千里』同为困顿中的豪迈；亦近于杜甫《望岳》『会当凌绝顶』之壮志。`,modernRelevance:`在职场内卷与躺平之间，李白给出了第三种答案：承认路难，但坚信风终会来。这种『有信心的等待』，比盲目乐观更真实，比彻底放弃更有力。`,furtherReading:[`《李太白全集》`,`《宗悫传》`,`《短歌行》曹操`]},"033":{context:`苏轼贬谪黄州，游赤壁矶时作此词。面对大江，联想到三国赤壁之战的英雄人物，感慨时光无情，豪杰终归尘土。`,analysis:`『大江东去』以空间写时间，江水奔流即是历史流逝。『淘尽』二字力透纸背，千古英雄在自然面前不过沙粒。豪迈中见苍凉，苍凉中见旷达。`,crossReference:`与杨慎《临江仙》『滚滚长江东逝水』同咏历史沧桑；亦近于陈子昂《登幽州台歌》『前不见古人，后不见来者』之孤独。`,modernRelevance:`在追求流量的时代，今天的『风流人物』可能明天就被遗忘。苏轼提醒我们：与其追逐不朽，不如在当下活出生命的厚度。`,furtherReading:[`《苏轼词集》`,`《三国志·周瑜传》`,`《临江仙》杨慎`]},"038":{context:`《庄子·逍遥游》开篇，以夸张至极的想象描绘鲲鹏之巨大。鲲本为小鱼之名，庄子却赋予其千里之躯，以此打破常人的认知局限。`,analysis:`『不知其几千里也』用不确定的数字制造无限感。庄子以极言大（鲲鹏）与极言小（蜩与学鸠）的对比，揭示大小之辨的相对性，为后文逍遥之旨铺垫。`,crossReference:`与《楚辞·天问》的宏大想象一脉相承；亦近于李白《大鹏赋》对鲲鹏意象的再创造。`,modernRelevance:`在算法推荐将我们困在信息茧房的今天，庄子提醒我们：你所以为的『大』，可能只是蜩与学鸠眼中的天空。真正的自由，是认识到局限后的超越。`,furtherReading:[`《庄子注》郭象`,`《楚辞·天问》`,`《大鹏赋》李白`]},"043":{context:`《诗经》开篇第一首，以雎鸠和鸣起兴，引出君子对淑女的爱慕。全诗从相思到追求再到琴瑟和谐，是先秦爱情诗的典范。`,analysis:`『关关』拟声，『雎鸠』起兴，自然之景与人之情浑然一体。『窈窕』二字兼具外在美与内在美，奠定了中国古典审美中内外兼修的理想。`,crossReference:`与《蒹葭》『所谓伊人，在水一方』同为诗经爱情名篇；亦近于《楚辞·湘君》中对爱人的追寻。`,modernRelevance:`在速食爱情的社交软件时代，这种从自然中萌发的、含蓄而真挚的爱慕显得格外珍贵。它提醒我们：真正的美好，不需要算法匹配，而是心灵的自然共鸣。`,furtherReading:[`《诗经注析》`,`《蒹葭》`,`《楚辞·湘君》`]},"047":{context:`殷浩被桓温问及与桓温相比如何，殷浩答：『我与我周旋久，宁做我。』此语见《世说新语·品藻》，展现了魏晋名士的自我意识。`,analysis:`『周旋』二字极妙，暗示自我并非一成不变，而是在内心不断对话、博弈、和解。『宁做我』三字斩钉截铁，是对自我的最终确认与接纳。`,crossReference:`与《论语》『君子求诸己』相呼应；亦近于存在主义萨特『存在先于本质』——人通过自我选择定义自己。`,modernRelevance:`在社交媒体让人不断比较的时代，『我与我周旋久，宁做我』是最好的解药。与其在别人的评价中迷失，不如在内心的对话中找到自己。`,furtherReading:[`《世说新语笺疏》`,`《存在与虚无》萨特`,`《论语·卫灵公》`]},"015":{context:`孔子立于川上，见流水不息，感叹时光流逝。此语虽短，却是中国文化中最经典的时间感悟之一。`,analysis:`『逝者』既指流水也指时光，一语双关。『不舍昼夜』四字，将时间的无情与恒常凝练至极。没有悲叹，只有冷静的注视，反而更有力量。`,crossReference:`与屈原《离骚》『日月忽其不淹兮，春与秋其代序』同感时光飞逝；亦近于曹操《短歌行》『对酒当歌，人生几何』之慨叹。`,modernRelevance:`在短视频让时间消失于无形的今天，孔子的川上之叹尤为警醒。时间不会因为我们的麻木而停下，唯有『不舍昼夜』地珍惜，才不负此生。`,furtherReading:[`《论语集注》朱熹`,`《离骚》屈原`,`《短歌行》曹操`]},"035":{context:`辛弃疾写元夕灯会，表面寻人，实则寄托理想。在繁华热闹中独寻一人，而那人不在灯火辉煌处，却在灯火阑珊的冷落角落。`,analysis:`『千百度』极言寻觅之苦，『蓦然回首』陡然转折，『灯火阑珊处』以冷落反衬珍贵。王国维以此喻人生最高境界——历经求索后的顿悟。`,crossReference:`王国维《人间词话》以此喻做学问第三境界；亦近于《诗经·蒹葭》『溯洄从之，道阻且长』之追寻。`,modernRelevance:`在信息过载的时代，我们『众里寻他千百度』——找答案、找方向、找意义。而真正的答案往往不在最热闹的地方，而在静下心来后的蓦然回首中。`,furtherReading:[`《人间词话》王国维`,`《蒹葭》`,`《辛弃疾词选》`]},101:{context:`泰戈尔《飞鸟集》最广为流传的诗句之一。以夏花与秋叶对举，将生死两个沉重命题化为自然意象。`,analysis:`『绚烂』与『静美』形成鲜明对照：生当如夏花般热烈绽放，死当如秋叶般安然飘落。两个比喻跨越生死，赋予生命以审美意义。`,crossReference:`与庄子『生之来不能却，其去不能止』的生死观相呼应；亦近于里尔克『死是生命的一面』之思辨。`,modernRelevance:`在惧怕死亡、回避谈论终点的现代文化中，泰戈尔提醒我们：死亡不必是恐惧的对象，而可以是优雅的完成。活得热烈，走得安静。`,furtherReading:[`《飞鸟集》全本`,`《庄子·至乐》`,`《杜伊诺哀歌》里尔克`]},201:{context:`川端康成《雪国》开篇，被誉为日本文学最美开篇之一。一列火车驶出隧道，进入雪国，主人公岛村登场。`,analysis:`『穿过县界长长的隧道，便是雪国』一句完成空间转换：隧道是分界，雪国是另一个世界。『夜空下一片白茫茫』以色彩极简营造意境，冷峻而唯美。`,crossReference:`与沈从文《边城》开篇『由四川过湖南去，靠东有一条官路』同以地理起笔；亦近于鲁迅《故乡》『从蓬莱门出发』之旅程开端。`,modernRelevance:`在现代生活的隧道里——通勤、加班、琐事——我们都渴望『穿过隧道』，进入属于自己的『雪国』。川端提醒我们：美，往往在另一端等待。`,furtherReading:[`《雪国》全本`,`《古都》川端康成`,`《边城》沈从文`]}},fd={爱情:[`043`],美:[`101`,`201`],品格:[`047`],人生:[`001`,`015`,`033`,`035`],生命:[`101`],时代:[`033`],时间:[`015`],希望:[`026`],学习:[`011`],友谊:[`011`,`035`],哲学:[`019`,`038`],志向:[`026`],自我:[`047`],自由:[`038`]},pd=JSON.parse(`[{"id":"001","text":"满纸荒唐言，一把辛酸泪。都云作者痴，谁解其中味。","source":"红楼梦","author":"曹雪芹","dynasty":"清代","chapter":"第一回","category":["人生","感悟"],"emotion":["悲凉","自嘲"],"difficulty":3,"wordCount":20,"tags":["红楼梦","开篇","人生如梦"],"type":"quote","region":"中国古典","era":"古代"},{"id":"002","text":"假作真时真亦假，无为有处有还无。","source":"红楼梦","author":"曹雪芹","dynasty":"清代","chapter":"第一回","category":["哲学","真假"],"emotion":["深邃","超然"],"difficulty":4,"wordCount":14,"tags":["红楼梦","太虚幻境","真假"],"type":"quote","region":"中国古典","era":"古代"},{"id":"003","text":"世事洞明皆学问，人情练达即文章。","source":"红楼梦","author":"曹雪芹","dynasty":"清代","chapter":"第五回","category":["处世","智慧"],"emotion":["通透","豁达"],"difficulty":2,"wordCount":14,"tags":["红楼梦","处世","学问"],"type":"quote","region":"中国古典","era":"古代"},{"id":"004","text":"一个是阆苑仙葩，一个是美玉无瑕。若说没奇缘，今生偏又遇着他。","source":"红楼梦","author":"曹雪芹","dynasty":"清代","chapter":"第五回","category":["爱情","命运"],"emotion":["哀婉","无奈"],"difficulty":3,"wordCount":26,"tags":["红楼梦","宝黛","缘分"],"type":"quote","region":"中国古典","era":"古代"},{"id":"005","text":"质本洁来还洁去，强于污淖陷渠沟。","source":"红楼梦","author":"曹雪芹","dynasty":"清代","chapter":"第二十七回","category":["品格","人生"],"emotion":["刚烈","孤高"],"difficulty":3,"wordCount":14,"tags":["红楼梦","黛玉","葬花"],"type":"quote","region":"中国古典","era":"古代"},{"id":"006","text":"好风凭借力，送我上青云。","source":"红楼梦","author":"曹雪芹","dynasty":"清代","chapter":"第七十回","category":["志向","抱负"],"emotion":["豪迈","昂扬"],"difficulty":2,"wordCount":10,"tags":["红楼梦","薛宝钗","柳絮词"],"type":"quote","region":"中国古典","era":"古代"},{"id":"007","text":"机关算尽太聪明，反算了卿卿性命。","source":"红楼梦","author":"曹雪芹","dynasty":"清代","chapter":"第五回","category":["处世","警示"],"emotion":["讽刺","悲叹"],"difficulty":3,"wordCount":14,"tags":["红楼梦","王熙凤","聪明反被聪明误"],"type":"quote","region":"中国古典","era":"古代"},{"id":"008","text":"千里搭长棚，没有个不散的筵席。","source":"红楼梦","author":"曹雪芹","dynasty":"清代","chapter":"第七十二回","category":["人生","聚散"],"emotion":["苍凉","释然"],"difficulty":2,"wordCount":14,"tags":["红楼梦","离别","筵席"],"type":"quote","region":"中国古典","era":"古代"},{"id":"009","text":"都道是金玉良姻，俺只念木石前盟。","source":"红楼梦","author":"曹雪芹","dynasty":"清代","chapter":"第五回","category":["爱情","执念"],"emotion":["痴情","执拗"],"difficulty":3,"wordCount":14,"tags":["红楼梦","宝黛","金玉良缘"],"type":"quote","region":"中国古典","era":"古代"},{"id":"010","text":"一朝春尽红颜老，花落人亡两不知。","source":"红楼梦","author":"曹雪芹","dynasty":"清代","chapter":"第二十七回","category":["生命","感伤"],"emotion":["凄美","哀伤"],"difficulty":2,"wordCount":14,"tags":["红楼梦","黛玉","葬花吟"],"type":"quote","region":"中国古典","era":"古代"},{"id":"011","text":"学而时习之，不亦说乎？有朋自远方来，不亦乐乎？","source":"论语","author":"孔子","dynasty":"春秋","chapter":"学而篇","category":["学习","交友"],"emotion":["愉悦","温暖"],"difficulty":2,"wordCount":20,"tags":["论语","学习","友谊"],"type":"quote","region":"中国古典","era":"古代"},{"id":"012","text":"三人行，必有我师焉。择其善者而从之，其不善者而改之。","source":"论语","author":"孔子","dynasty":"春秋","chapter":"述而篇","category":["学习","修身"],"emotion":["谦逊","自省"],"difficulty":2,"wordCount":24,"tags":["论语","学习","谦虚"],"type":"quote","region":"中国古典","era":"古代"},{"id":"013","text":"己所不欲，勿施于人。","source":"论语","author":"孔子","dynasty":"春秋","chapter":"卫灵公篇","category":["处世","道德"],"emotion":["平和","理性"],"difficulty":1,"wordCount":8,"tags":["论语","黄金法则","恕道"],"type":"quote","region":"中国古典","era":"古代"},{"id":"014","text":"知者不惑，仁者不忧，勇者不惧。","source":"论语","author":"孔子","dynasty":"春秋","chapter":"子罕篇","category":["修身","品格"],"emotion":["坚定","从容"],"difficulty":2,"wordCount":12,"tags":["论语","三达德","君子"],"type":"quote","region":"中国古典","era":"古代"},{"id":"015","text":"逝者如斯夫，不舍昼夜。","source":"论语","author":"孔子","dynasty":"春秋","chapter":"子罕篇","category":["时间","感悟"],"emotion":["感慨","珍惜"],"difficulty":2,"wordCount":8,"tags":["论语","时间","川上"],"type":"quote","region":"中国古典","era":"古代"},{"id":"016","text":"不愤不启，不悱不发。举一隅不以三隅反，则不复也。","source":"论语","author":"孔子","dynasty":"春秋","chapter":"述而篇","category":["教育","方法"],"emotion":["严谨","启发"],"difficulty":3,"wordCount":22,"tags":["论语","启发式教育","举一反三"],"type":"quote","region":"中国古典","era":"古代"},{"id":"017","text":"君子坦荡荡，小人长戚戚。","source":"论语","author":"孔子","dynasty":"春秋","chapter":"述而篇","category":["品格","修身"],"emotion":["坦荡","对比"],"difficulty":2,"wordCount":10,"tags":["论语","君子","小人"],"type":"quote","region":"中国古典","era":"古代"},{"id":"018","text":"工欲善其事，必先利其器。","source":"论语","author":"孔子","dynasty":"春秋","chapter":"卫灵公篇","category":["方法","准备"],"emotion":["务实","理性"],"difficulty":1,"wordCount":10,"tags":["论语","准备","工具"],"type":"quote","region":"中国古典","era":"古代"},{"id":"019","text":"道可道，非常道。名可名，非常名。","source":"道德经","author":"老子","dynasty":"春秋","chapter":"第一章","category":["哲学","道"],"emotion":["玄妙","超然"],"difficulty":5,"wordCount":12,"tags":["道德经","开篇","道"],"type":"quote","region":"中国古典","era":"古代"},{"id":"020","text":"上善若水。水善利万物而不争，处众人之所恶，故几于道。","source":"道德经","author":"老子","dynasty":"春秋","chapter":"第八章","category":["品格","哲学"],"emotion":["谦逊","包容"],"difficulty":4,"wordCount":22,"tags":["道德经","水","不争"],"type":"quote","region":"中国古典","era":"古代"},{"id":"021","text":"合抱之木，生于毫末；九层之台，起于累土；千里之行，始于足下。","source":"道德经","author":"老子","dynasty":"春秋","chapter":"第六十四章","category":["积累","坚持"],"emotion":["踏实","坚定"],"difficulty":3,"wordCount":28,"tags":["道德经","积累","起点"],"type":"quote","region":"中国古典","era":"古代"},{"id":"022","text":"祸兮福之所倚，福兮祸之所伏。","source":"道德经","author":"老子","dynasty":"春秋","chapter":"第五十八章","category":["哲学","辩证"],"emotion":["通透","警醒"],"difficulty":3,"wordCount":12,"tags":["道德经","祸福","辩证"],"type":"quote","region":"中国古典","era":"古代"},{"id":"023","text":"天下难事，必作于易；天下大事，必作于细。","source":"道德经","author":"老子","dynasty":"春秋","chapter":"第六十三章","category":["方法","做事"],"emotion":["务实","从容"],"difficulty":3,"wordCount":16,"tags":["道德经","难易","细节"],"type":"quote","region":"中国古典","era":"古代"},{"id":"024","text":"知人者智，自知者明。胜人者有力，自胜者强。","source":"道德经","author":"老子","dynasty":"春秋","chapter":"第三十三章","category":["修身","智慧"],"emotion":["自省","坚定"],"difficulty":3,"wordCount":16,"tags":["道德经","自知","自胜"],"type":"quote","region":"中国古典","era":"古代"},{"id":"025","text":"大音希声，大象无形。","source":"道德经","author":"老子","dynasty":"春秋","chapter":"第四十一章","category":["哲学","美学"],"emotion":["玄妙","空灵"],"difficulty":4,"wordCount":8,"tags":["道德经","大音","大象"],"type":"quote","region":"中国古典","era":"古代"},{"id":"026","text":"长风破浪会有时，直挂云帆济沧海。","source":"唐诗三百首","author":"李白","dynasty":"唐代","chapter":"行路难·其一","category":["志向","抱负"],"emotion":["豪迈","乐观"],"difficulty":2,"wordCount":14,"tags":["唐诗","李白","壮志"],"type":"quote","region":"中国古典","era":"古代"},{"id":"027","text":"天生我材必有用，千金散尽还复来。","source":"唐诗三百首","author":"李白","dynasty":"唐代","chapter":"将进酒","category":["自信","人生"],"emotion":["豪放","自信"],"difficulty":2,"wordCount":14,"tags":["唐诗","李白","自信"],"type":"quote","region":"中国古典","era":"古代"},{"id":"028","text":"会当凌绝顶，一览众山小。","source":"唐诗三百首","author":"杜甫","dynasty":"唐代","chapter":"望岳","category":["志向","格局"],"emotion":["豪迈","壮阔"],"difficulty":2,"wordCount":10,"tags":["唐诗","杜甫","泰山"],"type":"quote","region":"中国古典","era":"古代"},{"id":"029","text":"海内存知己，天涯若比邻。","source":"唐诗三百首","author":"王勃","dynasty":"唐代","chapter":"送杜少府之任蜀州","category":["友谊","离别"],"emotion":["豁达","温暖"],"difficulty":1,"wordCount":10,"tags":["唐诗","友谊","送别"],"type":"quote","region":"中国古典","era":"古代"},{"id":"030","text":"莫愁前路无知己，天下谁人不识君。","source":"唐诗三百首","author":"高适","dynasty":"唐代","chapter":"别董大","category":["友谊","鼓励"],"emotion":["豪迈","温暖"],"difficulty":2,"wordCount":14,"tags":["唐诗","送别","鼓励"],"type":"quote","region":"中国古典","era":"古代"},{"id":"031","text":"曾经沧海难为水，除却巫山不是云。","source":"唐诗三百首","author":"元稹","dynasty":"唐代","chapter":"离思五首·其四","category":["爱情","思念"],"emotion":["深情","怅惘"],"difficulty":3,"wordCount":14,"tags":["唐诗","爱情","思念"],"type":"quote","region":"中国古典","era":"古代"},{"id":"032","text":"人生得意须尽欢，莫使金樽空对月。","source":"唐诗三百首","author":"李白","dynasty":"唐代","chapter":"将进酒","category":["人生","及时行乐"],"emotion":["豪放","洒脱"],"difficulty":2,"wordCount":14,"tags":["唐诗","李白","将进酒"],"type":"quote","region":"中国古典","era":"古代"},{"id":"033","text":"大江东去，浪淘尽，千古风流人物。","source":"宋词三百首","author":"苏轼","dynasty":"宋代","chapter":"念奴娇·赤壁怀古","category":["历史","感慨"],"emotion":["豪迈","苍凉"],"difficulty":3,"wordCount":15,"tags":["宋词","苏轼","赤壁"],"type":"quote","region":"中国古典","era":"古代"},{"id":"034","text":"但愿人长久，千里共婵娟。","source":"宋词三百首","author":"苏轼","dynasty":"宋代","chapter":"水调歌头·明月几时有","category":["思念","祝福"],"emotion":["温柔","祝愿"],"difficulty":2,"wordCount":10,"tags":["宋词","苏轼","中秋"],"type":"quote","region":"中国古典","era":"古代"},{"id":"035","text":"众里寻他千百度，蓦然回首，那人却在，灯火阑珊处。","source":"宋词三百首","author":"辛弃疾","dynasty":"宋代","chapter":"青玉案·元夕","category":["寻觅","人生"],"emotion":["惊喜","感悟"],"difficulty":3,"wordCount":24,"tags":["宋词","辛弃疾","元夕"],"type":"quote","region":"中国古典","era":"古代"},{"id":"036","text":"莫道不销魂，帘卷西风，人比黄花瘦。","source":"宋词三百首","author":"李清照","dynasty":"宋代","chapter":"醉花阴·薄雾浓云愁永昼","category":["思念","愁绪"],"emotion":["哀婉","憔悴"],"difficulty":3,"wordCount":15,"tags":["宋词","李清照","相思"],"type":"quote","region":"中国古典","era":"古代"},{"id":"037","text":"问君能有几多愁？恰似一江春水向东流。","source":"宋词三百首","author":"李煜","dynasty":"南唐","chapter":"虞美人·春花秋月何时了","category":["愁绪","亡国"],"emotion":["哀痛","苍凉"],"difficulty":2,"wordCount":17,"tags":["宋词","李煜","亡国"],"type":"quote","region":"中国古典","era":"古代"},{"id":"038","text":"北冥有鱼，其名为鲲。鲲之大，不知其几千里也。","source":"庄子","author":"庄周","dynasty":"战国","chapter":"逍遥游","category":["哲学","想象"],"emotion":["壮阔","自由"],"difficulty":3,"wordCount":19,"tags":["庄子","鲲鹏","逍遥"],"type":"quote","region":"中国古典","era":"古代"},{"id":"039","text":"天地与我并生，而万物与我为一。","source":"庄子","author":"庄周","dynasty":"战国","chapter":"齐物论","category":["哲学","天人合一"],"emotion":["超然","辽阔"],"difficulty":4,"wordCount":12,"tags":["庄子","齐物","天人合一"],"type":"quote","region":"中国古典","era":"古代"},{"id":"040","text":"吾生也有涯，而知也无涯。","source":"庄子","author":"庄周","dynasty":"战国","chapter":"养生主","category":["学习","生命"],"emotion":["清醒","谦逊"],"difficulty":2,"wordCount":10,"tags":["庄子","生命","知识"],"type":"quote","region":"中国古典","era":"古代"},{"id":"041","text":"子非鱼，安知鱼之乐？","source":"庄子","author":"庄周","dynasty":"战国","chapter":"秋水","category":["哲学","认知"],"emotion":["机智","超脱"],"difficulty":3,"wordCount":9,"tags":["庄子","鱼之乐","认知"],"type":"quote","region":"中国古典","era":"古代"},{"id":"042","text":"相濡以沫，不如相忘于江湖。","source":"庄子","author":"庄周","dynasty":"战国","chapter":"大宗师","category":["人生","自由"],"emotion":["洒脱","释然"],"difficulty":4,"wordCount":12,"tags":["庄子","江湖","自由"],"type":"quote","region":"中国古典","era":"古代"},{"id":"043","text":"关关雎鸠，在河之洲。窈窕淑女，君子好逑。","source":"诗经","author":"佚名","dynasty":"先秦","chapter":"周南·关雎","category":["爱情","美好"],"emotion":["纯真","美好"],"difficulty":2,"wordCount":16,"tags":["诗经","爱情","关雎"],"type":"quote","region":"中国古典","era":"古代"},{"id":"044","text":"昔我往矣，杨柳依依。今我来思，雨雪霏霏。","source":"诗经","author":"佚名","dynasty":"先秦","chapter":"小雅·采薇","category":["思乡","时光"],"emotion":["惆怅","感伤"],"difficulty":3,"wordCount":16,"tags":["诗经","思乡","采薇"],"type":"quote","region":"中国古典","era":"古代"},{"id":"045","text":"蒹葭苍苍，白露为霜。所谓伊人，在水一方。","source":"诗经","author":"佚名","dynasty":"先秦","chapter":"秦风·蒹葭","category":["爱情","寻觅"],"emotion":["朦胧","执着"],"difficulty":3,"wordCount":16,"tags":["诗经","爱情","蒹葭"],"type":"quote","region":"中国古典","era":"古代"},{"id":"046","text":"知我者，谓我心忧；不知我者，谓我何求。","source":"诗经","author":"佚名","dynasty":"先秦","chapter":"王风·黍离","category":["孤独","知音"],"emotion":["孤独","无奈"],"difficulty":3,"wordCount":16,"tags":["诗经","孤独","知音"],"type":"quote","region":"中国古典","era":"古代"},{"id":"047","text":"我与我周旋久，宁做我。","source":"世说新语","author":"刘义庆","dynasty":"南朝宋","chapter":"品藻篇","category":["自我","独立"],"emotion":["坚定","洒脱"],"difficulty":3,"wordCount":9,"tags":["世说新语","自我","独立"],"type":"quote","region":"中国古典","era":"古代"},{"id":"048","text":"未若柳絮因风起。","source":"世说新语","author":"刘义庆","dynasty":"南朝宋","chapter":"言语篇","category":["才情","比喻"],"emotion":["灵动","雅致"],"difficulty":2,"wordCount":7,"tags":["世说新语","谢道韫","咏雪"],"type":"quote","region":"中国古典","era":"古代"},{"id":"049","text":"本自同根生，相煎何太急。","source":"世说新语","author":"刘义庆","dynasty":"南朝宋","chapter":"文学篇","category":["亲情","感慨"],"emotion":["悲愤","无奈"],"difficulty":2,"wordCount":10,"tags":["世说新语","曹植","七步诗"],"type":"quote","region":"中国古典","era":"古代"},{"id":"050","text":"人生贵得适意尔，何能羁宦数千里以要名爵乎！","source":"世说新语","author":"刘义庆","dynasty":"南朝宋","chapter":"识鉴篇","category":["人生","自由"],"emotion":["洒脱","通透"],"difficulty":4,"wordCount":20,"tags":["世说新语","适意","自由"],"type":"quote","region":"中国古典","era":"古代"},{"id":"051","type":"quote","text":"希望是本无所谓有，无所谓无的。这正如地上的路；其实地上本没有路，走的人多了，也便成了路。","source":"故乡","author":"鲁迅","translator":"","chapter":"尾声","region":"中国现当代","era":"现代","dynasty":"","category":["希望","人生"],"emotion":["苍凉","坚韧"],"difficulty":3,"wordCount":36,"tags":["鲁迅","故乡","希望","路"]},{"id":"052","type":"quote","text":"从来如此，便对么？","source":"狂人日记","author":"鲁迅","translator":"","chapter":"日记","region":"中国现当代","era":"现代","dynasty":"","category":["质疑","传统"],"emotion":["冷峻","激愤"],"difficulty":2,"wordCount":8,"tags":["鲁迅","狂人日记","质疑"]},{"id":"053","type":"quote","text":"哀其不幸，怒其不争。","source":"摩罗诗力说","author":"鲁迅","translator":"","chapter":"","region":"中国现当代","era":"现代","dynasty":"","category":["悲悯","批判"],"emotion":["沉痛","愤慨"],"difficulty":2,"wordCount":8,"tags":["鲁迅","哀其不幸","批判"]},{"id":"054","type":"quote","text":"其实地上本没有路，走的人多了，也便成了路。","source":"故乡","author":"鲁迅","translator":"","chapter":"尾声","region":"中国现当代","era":"现代","dynasty":"","category":["希望","行动"],"emotion":["坚定","温暖"],"difficulty":2,"wordCount":21,"tags":["鲁迅","路","希望"]},{"id":"055","type":"quote","text":"我在这繁响的拥抱中，也懒散而且舒适，从白天以至初夜的疑虑，全给祝福的空气一扫而空了。","source":"祝福","author":"鲁迅","translator":"","chapter":"","region":"中国现当代","era":"现代","dynasty":"","category":["讽刺","冷漠"],"emotion":["苍凉","讽刺"],"difficulty":4,"wordCount":38,"tags":["鲁迅","祝福","讽刺"]},{"id":"056","type":"quote","text":"人是为了活着本身而活着的，而不是为了活着之外的任何事物所活着。","source":"活着","author":"余华","translator":"","chapter":"自序","region":"中国现当代","era":"当代","dynasty":"","category":["人生","存在"],"emotion":["深沉","豁达"],"difficulty":3,"wordCount":27,"tags":["余华","活着","人生"]},{"id":"057","type":"quote","text":"生活是种律动，须有光有影，有左有右，有晴有雨，滋味就含在这变而不猛的曲折里。","source":"小病","author":"老舍","translator":"","chapter":"","region":"中国现当代","era":"现代","dynasty":"","category":["生活","哲理"],"emotion":["通透","豁达"],"difficulty":3,"wordCount":33,"tags":["老舍","生活","律动"]},{"id":"058","type":"quote","text":"满天星光，满屋月亮，人生何如，为什么这么悲凉。","source":"呼兰河传","author":"萧红","translator":"","chapter":"","region":"中国现当代","era":"现代","dynasty":"","category":["悲凉","人生"],"emotion":["苍凉","孤独"],"difficulty":2,"wordCount":19,"tags":["萧红","呼兰河传","悲凉"]},{"id":"059","type":"quote","text":"花开了，就像睡醒了似的。鸟飞了，就像在天上逛似的。虫子叫了，就像虫子在说话似的。","source":"呼兰河传","author":"萧红","translator":"","chapter":"","region":"中国现当代","era":"现代","dynasty":"","category":["童趣","自然"],"emotion":["天真","温暖"],"difficulty":2,"wordCount":33,"tags":["萧红","呼兰河传","童趣"]},{"id":"060","type":"quote","text":"燕子去了，有再来的时候；杨柳枯了，有再青的时候；桃花谢了，有再开的时候。","source":"匆匆","author":"朱自清","translator":"","chapter":"","region":"中国现当代","era":"现代","dynasty":"","category":["时间","感悟"],"emotion":["怅然","温柔"],"difficulty":2,"wordCount":32,"tags":["朱自清","匆匆","时间"]},{"id":"061","type":"quote","text":"悄悄的我走了，正如我悄悄的来；我挥一挥衣袖，不带走一片云彩。","source":"再别康桥","author":"徐志摩","translator":"","chapter":"","region":"中国现当代","era":"现代","dynasty":"","category":["离别","洒脱"],"emotion":["惆怅","洒脱"],"difficulty":2,"wordCount":30,"tags":["徐志摩","再别康桥","离别"]},{"id":"062","type":"quote","text":"这是一沟绝望的死水，清风吹不起半点漪沦。","source":"死水","author":"闻一多","translator":"","chapter":"","region":"中国现当代","era":"现代","dynasty":"","category":["批判","绝望"],"emotion":["愤懑","冷峻"],"difficulty":2,"wordCount":18,"tags":["闻一多","死水","批判"]},{"id":"063","type":"quote","text":"撑着油纸伞，独自彷徨在悠长、悠长又寂寥的雨巷。","source":"雨巷","author":"戴望舒","translator":"","chapter":"","region":"中国现当代","era":"现代","dynasty":"","category":["孤独","惆怅"],"emotion":["忧郁","朦胧"],"difficulty":2,"wordCount":21,"tags":["戴望舒","雨巷","孤独"]},{"id":"064","type":"quote","text":"曾因酒醉鞭名马，生怕情多累美人。","source":"钓台题壁","author":"郁达夫","translator":"","chapter":"","region":"中国现当代","era":"现代","dynasty":"","category":["豪情","自嘲"],"emotion":["疏狂","惆怅"],"difficulty":3,"wordCount":14,"tags":["郁达夫","豪情","自嘲"]},{"id":"065","type":"quote","text":"不乱于心，不困于情。不畏将来，不念过往。如此，安好。","source":"不宠无惊过一生","author":"丰子恺","translator":"","chapter":"","region":"中国现当代","era":"现代","dynasty":"","category":["豁达","人生"],"emotion":["平和","通透"],"difficulty":2,"wordCount":22,"tags":["丰子恺","豁达","人生"]},{"id":"066","type":"quote","text":"穿过县界长长的隧道，便是雪国。夜空下一片白茫茫。","source":"雪国","author":"川端康成","translator":"叶渭渠","chapter":"开篇","region":"日本","era":"20世纪","dynasty":"","category":["唯美","孤独"],"emotion":["清冷","幽美"],"difficulty":2,"wordCount":20,"tags":["川端康成","雪国","唯美"]},{"id":"067","type":"quote","text":"凌晨四点钟，看到海棠花未眠。","source":"花未眠","author":"川端康成","translator":"叶渭渠","chapter":"","region":"日本","era":"20世纪","dynasty":"","category":["唯美","瞬间"],"emotion":["静谧","惊艳"],"difficulty":1,"wordCount":13,"tags":["川端康成","海棠","唯美"]},{"id":"068","type":"quote","text":"生而为人，我很抱歉。","source":"二十世纪旗手","author":"太宰治","translator":"佚名","chapter":"","region":"日本","era":"20世纪","dynasty":"","category":["自嘲","悲哀"],"emotion":["颓废","悲凉"],"difficulty":1,"wordCount":9,"tags":["太宰治","人间失格","自嘲"]},{"id":"069","type":"quote","text":"胆小鬼连幸福都会害怕，碰到棉花都会受伤，有时还被幸福所伤。","source":"人间失格","author":"太宰治","translator":"佚名","chapter":"手记","region":"日本","era":"20世纪","dynasty":"","category":["自卑","敏感"],"emotion":["颓废","脆弱"],"difficulty":2,"wordCount":28,"tags":["太宰治","人间失格","自卑"]},{"id":"070","type":"quote","text":"薄暮时分，罗生门下。一个仆人正在等待雨停。","source":"罗生门","author":"芥川龙之介","translator":"鲁迅","chapter":"开篇","region":"日本","era":"20世纪","dynasty":"","category":["境遇","无依"],"emotion":["萧索","迷惘"],"difficulty":2,"wordCount":18,"tags":["芥川龙之介","罗生门","开篇"]},{"id":"071","type":"quote","text":"人生不如一行波德莱尔。","source":"侏儒的话","author":"芥川龙之介","translator":"佚名","chapter":"","region":"日本","era":"20世纪","dynasty":"","category":["虚无","人生"],"emotion":["冷彻","虚无"],"difficulty":3,"wordCount":11,"tags":["芥川龙之介","虚无","波德莱尔"]},{"id":"072","type":"quote","text":"猫的命运，在它被生下来的时候，就已经决定了。","source":"我是猫","author":"夏目漱石","translator":"佚名","chapter":"","region":"日本","era":"20世纪","dynasty":"","category":["命运","讽刺"],"emotion":["冷峻","幽默"],"difficulty":2,"wordCount":19,"tags":["夏目漱石","我是猫","命运"]},{"id":"073","type":"quote","text":"今晚月色真美。","source":"心","author":"夏目漱石","translator":"佚名","chapter":"","region":"日本","era":"20世纪","dynasty":"","category":["含蓄","爱情"],"emotion":["温柔","含蓄"],"difficulty":1,"wordCount":7,"tags":["夏目漱石","月色","含蓄"]},{"id":"074","type":"quote","text":"古池呀，青蛙跳入水声响。","source":"俳句","author":"松尾芭蕉","translator":"佚名","chapter":"","region":"日本","era":"古代","dynasty":"","category":["禅意","瞬间"],"emotion":["静谧","空灵"],"difficulty":2,"wordCount":12,"tags":["松尾芭蕉","俳句","禅意"]},{"id":"075","type":"quote","text":"夏草兵卒梦痕。","source":"俳句","author":"松尾芭蕉","translator":"佚名","chapter":"奥州小道","region":"日本","era":"古代","dynasty":"","category":["历史","感怀"],"emotion":["苍凉","悠远"],"difficulty":3,"wordCount":7,"tags":["松尾芭蕉","俳句","历史"]},{"id":"076","type":"quote","text":"世间之事，往往因细故而启其端。","source":"枕草子","author":"清少纳言","translator":"佚名","chapter":"","region":"日本","era":"古代","dynasty":"","category":["感悟","世情"],"emotion":["清雅","通透"],"difficulty":2,"wordCount":13,"tags":["清少纳言","枕草子","世情"]},{"id":"077","type":"quote","text":"只怕大梦一场，醒来仍是孤身。","source":"金阁寺","author":"三岛由纪夫","translator":"佚名","chapter":"","region":"日本","era":"20世纪","dynasty":"","category":["虚幻","孤独"],"emotion":["凄美","虚无"],"difficulty":3,"wordCount":13,"tags":["三岛由纪夫","金阁寺","虚幻"]},{"id":"078","type":"quote","text":"美，是可怕的。","source":"金阁寺","author":"三岛由纪夫","translator":"佚名","chapter":"","region":"日本","era":"20世纪","dynasty":"","category":["美","恐惧"],"emotion":["震撼","战栗"],"difficulty":2,"wordCount":5,"tags":["三岛由纪夫","美","恐惧"]},{"id":"079","type":"quote","text":"闲寂呀，蝉声渗入岩石中。","source":"俳句","author":"松尾芭蕉","translator":"佚名","chapter":"","region":"日本","era":"古代","dynasty":"","category":["禅意","自然"],"emotion":["空灵","幽深"],"difficulty":2,"wordCount":11,"tags":["松尾芭蕉","俳句","禅意"]},{"id":"080","type":"quote","text":"纵令盼得爱人在身旁，夜半来朝半去，徒留怅惘。","source":"源氏物语","author":"紫式部","translator":"佚名","chapter":"","region":"日本","era":"古代","dynasty":"","category":["爱情","无常"],"emotion":["缠绵","怅惘"],"difficulty":3,"wordCount":22,"tags":["紫式部","源氏物语","爱情"]},{"id":"081","type":"quote","text":"假如生活欺骗了你，不要悲伤，不要心急。","source":"假如生活欺骗了你","author":"普希金","translator":"佚名","chapter":"","region":"俄罗斯","era":"19世纪","dynasty":"","category":["希望","坚韧"],"emotion":["温暖","坚定"],"difficulty":1,"wordCount":16,"tags":["普希金","希望","坚韧"]},{"id":"082","type":"quote","text":"一切都是瞬息，一切都将会过去；而那过去了的，就会成为亲切的怀恋。","source":"假如生活欺骗了你","author":"普希金","translator":"佚名","chapter":"","region":"俄罗斯","era":"19世纪","dynasty":"","category":["时间","怀恋"],"emotion":["温暖","释然"],"difficulty":2,"wordCount":28,"tags":["普希金","时间","怀恋"]},{"id":"083","type":"quote","text":"幸福的家庭都是相似的，不幸的家庭各有各的不幸。","source":"安娜·卡列尼娜","author":"托尔斯泰","translator":"草婴","chapter":"开篇","region":"俄罗斯","era":"19世纪","dynasty":"","category":["人生","哲理"],"emotion":["深沉","睿智"],"difficulty":2,"wordCount":22,"tags":["托尔斯泰","安娜卡列尼娜","开篇"]},{"id":"084","type":"quote","text":"我们平等的相爱，因为我们互相了解，互相尊重。","source":"童年·少年·青年","author":"托尔斯泰","translator":"草婴","chapter":"","region":"俄罗斯","era":"19世纪","dynasty":"","category":["爱情","平等"],"emotion":["温暖","真挚"],"difficulty":2,"wordCount":20,"tags":["托尔斯泰","爱情","平等"]},{"id":"085","type":"quote","text":"如果爱一个人，那就爱整个的他，实事求是地照他本来的面目去爱他。","source":"复活","author":"托尔斯泰","translator":"草婴","chapter":"","region":"俄罗斯","era":"19世纪","dynasty":"","category":["爱情","接纳"],"emotion":["深沉","宽容"],"difficulty":3,"wordCount":28,"tags":["托尔斯泰","复活","爱"]},{"id":"086","type":"quote","text":"人不是因为美丽才可爱，而是因为可爱才美丽。","source":"战争与和平","author":"托尔斯泰","translator":"草婴","chapter":"","region":"俄罗斯","era":"19世纪","dynasty":"","category":["美","爱情"],"emotion":["温暖","睿智"],"difficulty":1,"wordCount":19,"tags":["托尔斯泰","美","可爱"]},{"id":"087","type":"quote","text":"我是个小人物，但我并不因此而自卑。","source":"外套","author":"果戈里","translator":"满涛","chapter":"","region":"俄罗斯","era":"19世纪","dynasty":"","category":["自尊","小人物"],"emotion":["自持","坚韧"],"difficulty":2,"wordCount":16,"tags":["果戈里","小人物","自尊"]},{"id":"088","type":"quote","text":"人应当相信自己说的话，他才能说出心里的话。","source":"罗亭","author":"屠格涅夫","translator":"巴金","chapter":"","region":"俄罗斯","era":"19世纪","dynasty":"","category":["真诚","信念"],"emotion":["坚定","诚挚"],"difficulty":2,"wordCount":20,"tags":["屠格涅夫","真诚","信念"]},{"id":"089","type":"quote","text":"不要再藏匿了，把心里的话说出来吧。","source":"父与子","author":"屠格涅夫","translator":"巴金","chapter":"","region":"俄罗斯","era":"19世纪","dynasty":"","category":["真诚","勇气"],"emotion":["恳切","坚定"],"difficulty":2,"wordCount":16,"tags":["屠格涅夫","父与子","真诚"]},{"id":"090","type":"quote","text":"简洁是天才的姐妹。","source":"给弟弟的信","author":"契诃夫","translator":"汝龙","chapter":"","region":"俄罗斯","era":"19世纪","dynasty":"","category":["写作","简洁"],"emotion":["睿智","精炼"],"difficulty":1,"wordCount":8,"tags":["契诃夫","简洁","写作"]},{"id":"091","type":"quote","text":"我喜欢你是寂静的，仿佛你消失了一样。","source":"二十首情诗和一首绝望的歌","author":"聂鲁达","translator":"李宗荣","chapter":"","region":"拉美","era":"20世纪","dynasty":"","category":["爱情","寂静"],"emotion":["深情","怅惘"],"difficulty":2,"wordCount":18,"tags":["聂鲁达","爱情","寂静"]},{"id":"092","type":"quote","text":"你从远处聆听我，我的声音却无法触及你。","source":"二十首情诗和一首绝望的歌","author":"聂鲁达","translator":"李宗荣","chapter":"","region":"拉美","era":"20世纪","dynasty":"","category":["距离","爱情"],"emotion":["深情","无奈"],"difficulty":2,"wordCount":19,"tags":["聂鲁达","距离","爱情"]},{"id":"093","type":"quote","text":"今夜我可以写出最哀伤的诗篇。","source":"二十首情诗和一首绝望的歌","author":"聂鲁达","translator":"李宗荣","chapter":"","region":"拉美","era":"20世纪","dynasty":"","category":["哀伤","诗"],"emotion":["凄美","深情"],"difficulty":1,"wordCount":13,"tags":["聂鲁达","哀伤","诗"]},{"id":"094","type":"quote","text":"爱是这么短，遗忘是那么长。","source":"二十首情诗和一首绝望的歌","author":"聂鲁达","translator":"李宗荣","chapter":"","region":"拉美","era":"20世纪","dynasty":"","category":["爱情","遗忘"],"emotion":["凄美","惆怅"],"difficulty":1,"wordCount":12,"tags":["聂鲁达","爱","遗忘"]},{"id":"095","type":"quote","text":"我在这里爱你，地平线徒然地将你隐藏。","source":"二十首情诗和一首绝望的歌","author":"聂鲁达","translator":"李宗荣","chapter":"","region":"拉美","era":"20世纪","dynasty":"","category":["爱情","远方"],"emotion":["深情","辽远"],"difficulty":2,"wordCount":17,"tags":["聂鲁达","爱","远方"]},{"id":"096","type":"quote","text":"我是黑暗中的旅行者，在寻找光明的路上。","source":"绝望的歌","author":"聂鲁达","translator":"李宗荣","chapter":"","region":"拉美","era":"20世纪","dynasty":"","category":["寻找","光明"],"emotion":["苍凉","坚定"],"difficulty":2,"wordCount":18,"tags":["聂鲁达","寻找","光明"]},{"id":"097","type":"quote","text":"未知的大海啊，你藏着我所有的秘密。","source":"元素的颂歌","author":"聂鲁达","translator":"李宗荣","chapter":"","region":"拉美","era":"20世纪","dynasty":"","category":["自然","秘密"],"emotion":["敬畏","辽远"],"difficulty":2,"wordCount":16,"tags":["聂鲁达","海","秘密"]},{"id":"098","type":"quote","text":"生命是一条河，我们都是渡河的人。","source":"鲁文·达里奥诗选","author":"鲁文·达里奥","translator":"佚名","chapter":"","region":"拉美","era":"19世纪","dynasty":"","category":["生命","哲理"],"emotion":["辽阔","沉思"],"difficulty":2,"wordCount":16,"tags":["达里奥","生命","河"]},{"id":"099","type":"quote","text":"我种植我的自由，开出一朵花。","source":"鲁文·达里奥诗选","author":"鲁文·达里奥","translator":"佚名","chapter":"","region":"拉美","era":"19世纪","dynasty":"","category":["自由","希望"],"emotion":["明丽","坚定"],"difficulty":2,"wordCount":13,"tags":["达里奥","自由","花"]},{"id":"100","type":"quote","text":"种树的最佳时间是二十年前，仅次于它的最佳时间是现在。","source":"箴言集","author":"何塞·马蒂","translator":"佚名","chapter":"","region":"拉美","era":"19世纪","dynasty":"","category":["行动","当下"],"emotion":["睿智","恳切"],"difficulty":2,"wordCount":24,"tags":["马蒂","行动","当下"]},{"id":"101","type":"quote","text":"使生如夏花之绚烂，死如秋叶之静美。","source":"飞鸟集","author":"泰戈尔","translator":"郑振铎","chapter":"","region":"全球诗歌","era":"20世纪","dynasty":"","category":["生死","美"],"emotion":["绚烂","静谧"],"difficulty":2,"wordCount":16,"tags":["泰戈尔","飞鸟集","生死"]},{"id":"102","type":"quote","text":"世界以痛吻我，要我报之以歌。","source":"飞鸟集","author":"泰戈尔","translator":"郑振铎","chapter":"","region":"全球诗歌","era":"20世纪","dynasty":"","category":["苦难","豁达"],"emotion":["坚韧","温暖"],"difficulty":2,"wordCount":14,"tags":["泰戈尔","飞鸟集","豁达"]},{"id":"103","type":"quote","text":"如果你因失去了太阳而流泪，那么你也失去了群星了。","source":"飞鸟集","author":"泰戈尔","translator":"郑振铎","chapter":"","region":"全球诗歌","era":"20世纪","dynasty":"","category":["失去","豁达"],"emotion":["怅然","释怀"],"difficulty":2,"wordCount":23,"tags":["泰戈尔","飞鸟集","失去"]},{"id":"104","type":"quote","text":"天空没有翅膀的痕迹，但我已飞过。","source":"飞鸟集","author":"泰戈尔","translator":"郑振铎","chapter":"","region":"全球诗歌","era":"20世纪","dynasty":"","category":["存在","淡然"],"emotion":["旷达","淡泊"],"difficulty":1,"wordCount":16,"tags":["泰戈尔","飞鸟集","淡然"]},{"id":"105","type":"quote","text":"我的心是旷野的鸟，在你的眼睛里找到了它的天空。","source":"园丁集","author":"泰戈尔","translator":"冰心","chapter":"","region":"全球诗歌","era":"20世纪","dynasty":"","category":["爱情","归宿"],"emotion":["温柔","深情"],"difficulty":2,"wordCount":23,"tags":["泰戈尔","园丁集","爱情"]},{"id":"106","type":"quote","text":"忧郁的是，我无法用双手拥抱你。","source":"恶之花","author":"波特莱尔","translator":"佚名","chapter":"","region":"全球诗歌","era":"19世纪","dynasty":"","category":["忧郁","爱情"],"emotion":["颓美","怅惘"],"difficulty":3,"wordCount":15,"tags":["波特莱尔","恶之花","忧郁"]},{"id":"107","type":"quote","text":"你给了我泥土，而我把它变成了黄金。","source":"恶之花","author":"波特莱尔","translator":"佚名","chapter":"","region":"全球诗歌","era":"19世纪","dynasty":"","category":["蜕变","创造力"],"emotion":["狂傲","炽烈"],"difficulty":2,"wordCount":15,"tags":["波特莱尔","恶之花","创造"]},{"id":"108","type":"quote","text":"醉下去，永远地醉下去。为了不感受时间那可怕的重担压碎你的肩膀。","source":"巴黎的忧郁","author":"波特莱尔","translator":"佚名","chapter":"","region":"全球诗歌","era":"19世纪","dynasty":"","category":["逃避","时间"],"emotion":["颓废","沉重"],"difficulty":3,"wordCount":30,"tags":["波特莱尔","醉","时间"]},{"id":"109","type":"quote","text":"秋日里小提琴的呜咽，用单调的忧郁慰藉我的心。","source":"感伤的对话","author":"魏尔伦","translator":"佚名","chapter":"","region":"全球诗歌","era":"19世纪","dynasty":"","category":["秋","忧郁"],"emotion":["凄美","缠绵"],"difficulty":3,"wordCount":22,"tags":["魏尔伦","秋","忧郁"]},{"id":"110","type":"quote","text":"天空正在水上哭泣，温柔地哭泣。","source":"感伤的对话","author":"魏尔伦","translator":"佚名","chapter":"","region":"全球诗歌","era":"19世纪","dynasty":"","category":["自然","哀愁"],"emotion":["凄美","温柔"],"difficulty":2,"wordCount":14,"tags":["魏尔伦","天空","哀愁"]},{"id":"111","type":"quote","text":"我找到她了，是谁呢？我找到了她。","source":"魏尔伦诗选","author":"魏尔伦","translator":"佚名","chapter":"","region":"全球诗歌","era":"19世纪","dynasty":"","category":["寻找","爱情"],"emotion":["欣喜","缠绵"],"difficulty":2,"wordCount":14,"tags":["魏尔伦","寻找","爱情"]},{"id":"112","type":"quote","text":"生活在别处。","source":"兰波诗选","author":"兰波","translator":"佚名","chapter":"","region":"全球诗歌","era":"19世纪","dynasty":"","category":["理想","远方"],"emotion":["向往","怅惘"],"difficulty":1,"wordCount":5,"tags":["兰波","远方","理想"]},{"id":"113","type":"quote","text":"我永恒的灵魂，注视着你的心，纵然黑夜孤寂，白昼如焚。","source":"地狱一季","author":"兰波","translator":"佚名","chapter":"","region":"全球诗歌","era":"19世纪","dynasty":"","category":["灵魂","孤独"],"emotion":["炽烈","孤绝"],"difficulty":3,"wordCount":24,"tags":["兰波","灵魂","孤独"]},{"id":"114","type":"quote","text":"有何胜利可言？挺住意味着一切。","source":"祭沃尔夫·卡尔克罗伊德伯爵","author":"里尔克","translator":"佚名","chapter":"","region":"全球诗歌","era":"20世纪","dynasty":"","category":["坚持","苦难"],"emotion":["坚毅","悲壮"],"difficulty":2,"wordCount":13,"tags":["里尔克","坚持","苦难"]},{"id":"115","type":"quote","text":"谁此刻没有房子，就不必建造；谁此刻孤独，就永远孤独。","source":"秋日","author":"里尔克","translator":"佚名","chapter":"","region":"全球诗歌","era":"20世纪","dynasty":"","category":["孤独","此刻"],"emotion":["清冷","决绝"],"difficulty":3,"wordCount":24,"tags":["里尔克","秋日","孤独"]},{"id":"116","type":"quote","text":"我要认出你的风暴，并且怒吼着与你相迎。","source":"杜伊诺哀歌","author":"里尔克","translator":"佚名","chapter":"","region":"全球诗歌","era":"20世纪","dynasty":"","category":["勇气","迎接"],"emotion":["激越","坚定"],"difficulty":3,"wordCount":19,"tags":["里尔克","风暴","勇气"]},{"id":"117","type":"quote","text":"当你老了，头发花白，睡意沉沉，倦坐在炉边，取下这本书来，慢慢读着。","source":"当你老了","author":"叶芝","translator":"袁可嘉","chapter":"","region":"全球诗歌","era":"20世纪","dynasty":"","category":["爱情","暮年"],"emotion":["深情","沧桑"],"difficulty":2,"wordCount":30,"tags":["叶芝","当你老了","爱情"]},{"id":"118","type":"quote","text":"多少人爱你青春欢畅的时辰，爱慕你的美丽，假意或真心，只有一个人爱你那朝圣者的灵魂。","source":"当你老了","author":"叶芝","translator":"袁可嘉","chapter":"","region":"全球诗歌","era":"20世纪","dynasty":"","category":["爱情","灵魂"],"emotion":["深情","深沉"],"difficulty":3,"wordCount":38,"tags":["叶芝","灵魂","爱情"]},{"id":"119","type":"quote","text":"一切都四散了，再也保不住中心。","source":"第二次降临","author":"叶芝","translator":"袁可嘉","chapter":"","region":"全球诗歌","era":"20世纪","dynasty":"","category":["混乱","时代"],"emotion":["苍凉","震撼"],"difficulty":3,"wordCount":14,"tags":["叶芝","四散","时代"]},{"id":"120","type":"quote","text":"我是无名之辈，你是谁？","source":"狄金森诗选","author":"狄金森","translator":"江枫","chapter":"","region":"全球诗歌","era":"19世纪","dynasty":"","category":["自我","身份"],"emotion":["孤清","诙谐"],"difficulty":1,"wordCount":11,"tags":["狄金森","自我","无名"]},{"id":"121","type":"quote","text":"希望是有羽毛的东西，它栖息在灵魂上，唱着没有歌词的歌。","source":"狄金森诗选","author":"狄金森","translator":"江枫","chapter":"","region":"全球诗歌","era":"19世纪","dynasty":"","category":["希望","灵魂"],"emotion":["温暖","轻盈"],"difficulty":2,"wordCount":24,"tags":["狄金森","希望","灵魂"]},{"id":"122","type":"quote","text":"如果我能使一颗心免于哀伤，我就不虚此生。","source":"狄金森诗选","author":"狄金森","translator":"江枫","chapter":"","region":"全球诗歌","era":"19世纪","dynasty":"","category":["悲悯","价值"],"emotion":["温柔","坚定"],"difficulty":2,"wordCount":18,"tags":["狄金森","悲悯","价值"]},{"id":"123","type":"quote","text":"我自身是地狱，谁还能把我贬到更深的地方。","source":"狄金森诗选","author":"狄金森","translator":"江枫","chapter":"","region":"全球诗歌","era":"19世纪","dynasty":"","category":["绝望","自我"],"emotion":["孤绝","深沉"],"difficulty":3,"wordCount":20,"tags":["狄金森","地狱","绝望"]},{"id":"124","type":"quote","text":"我自己即是矛盾，但我无所谓。","source":"草叶集","author":"惠特曼","translator":"楚图南","chapter":"自我之歌","region":"全球诗歌","era":"19世纪","dynasty":"","category":["自我","接纳"],"emotion":["旷达","豪迈"],"difficulty":2,"wordCount":13,"tags":["惠特曼","自我","矛盾"]},{"id":"125","type":"quote","text":"我赞美我自己，歌唱我自己。","source":"草叶集","author":"惠特曼","translator":"楚图南","chapter":"自我之歌","region":"全球诗歌","era":"19世纪","dynasty":"","category":["自我","赞美"],"emotion":["豪迈","坦荡"],"difficulty":1,"wordCount":12,"tags":["惠特曼","赞美","自我"]},{"id":"126","type":"quote","text":"每一个属于我的原子，也属于你。","source":"草叶集","author":"惠特曼","translator":"楚图南","chapter":"自我之歌","region":"全球诗歌","era":"19世纪","dynasty":"","category":["联结","平等"],"emotion":["温暖","辽阔"],"difficulty":2,"wordCount":13,"tags":["惠特曼","原子","联结"]},{"id":"127","type":"quote","text":"冬天来了，春天还会远吗？","source":"西风颂","author":"雪莱","translator":"江枫","chapter":"","region":"全球诗歌","era":"古代","dynasty":"","category":["希望","坚韧"],"emotion":["激越","光明"],"difficulty":1,"wordCount":12,"tags":["雪莱","西风颂","希望"]},{"id":"128","type":"quote","text":"美即是真，真即是美。","source":"希腊古瓮颂","author":"济慈","translator":"佚名","chapter":"","region":"全球诗歌","era":"古代","dynasty":"","category":["美","真"],"emotion":["沉思","纯净"],"difficulty":1,"wordCount":9,"tags":["济慈","美","真"]},{"id":"129","type":"quote","text":"她走在美的光彩中，像无云的夜空，繁星闪烁。","source":"她走在美的光彩中","author":"拜伦","translator":"穆旦","chapter":"","region":"全球诗歌","era":"古代","dynasty":"","category":["美","夜晚"],"emotion":["惊艳","纯净"],"difficulty":2,"wordCount":21,"tags":["拜伦","美","夜"]},{"id":"130","type":"quote","text":"谁讲过这些话，谁就是我所寻找的人。","source":"叶芝诗选","author":"叶芝","translator":"袁可嘉","chapter":"","region":"全球诗歌","era":"20世纪","dynasty":"","category":["寻找","认同"],"emotion":["恳切","深情"],"difficulty":2,"wordCount":16,"tags":["叶芝","寻找","认同"]},{"id":"131","type":"quote","text":"To be, or not to be, that is the question.","source":"哈姆雷特","author":"莎士比亚","translator":"朱生豪","chapter":"第三幕","region":"欧洲","era":"古代","dynasty":"","category":["存在","抉择"],"emotion":["沉思","悲怆"],"difficulty":2,"wordCount":10,"tags":["莎士比亚","哈姆雷特","存在"]},{"id":"132","type":"quote","text":"生存还是毁灭，这是一个值得考虑的问题。","source":"哈姆雷特","author":"莎士比亚","translator":"朱生豪","chapter":"第三幕","region":"欧洲","era":"古代","dynasty":"","category":["存在","抉择"],"emotion":["沉思","悲怆"],"difficulty":2,"wordCount":17,"tags":["莎士比亚","哈姆雷特","生存"]},{"id":"133","type":"quote","text":"简洁是智慧的灵魂，冗长是肤浅的藻饰。","source":"哈姆雷特","author":"莎士比亚","translator":"朱生豪","chapter":"第二幕","region":"欧洲","era":"古代","dynasty":"","category":["智慧","简洁"],"emotion":["睿智","精炼"],"difficulty":3,"wordCount":16,"tags":["莎士比亚","简洁","智慧"]},{"id":"134","type":"quote","text":"凡是过去，皆为序章。","source":"暴风雨","author":"莎士比亚","translator":"朱生豪","chapter":"","region":"欧洲","era":"古代","dynasty":"","category":["时间","开始"],"emotion":["旷达","睿智"],"difficulty":1,"wordCount":8,"tags":["莎士比亚","暴风雨","序章"]},{"id":"135","type":"quote","text":"凡是有钱的单身汉，总想娶位太太，这是一条举世公认的真理。","source":"傲慢与偏见","author":"简·奥斯汀","translator":"王科一","chapter":"开篇","region":"欧洲","era":"古代","dynasty":"","category":["讽刺","婚姻"],"emotion":["机智","幽默"],"difficulty":2,"wordCount":26,"tags":["奥斯汀","傲慢与偏见","开篇"]},{"id":"136","type":"quote","text":"骄傲多半不外乎我们对我们自己的估价，虚荣却牵涉到我们希望别人对我们的看法。","source":"傲慢与偏见","author":"简·奥斯汀","translator":"王科一","chapter":"","region":"欧洲","era":"古代","dynasty":"","category":["骄傲","虚荣"],"emotion":["睿智","透彻"],"difficulty":3,"wordCount":32,"tags":["奥斯汀","骄傲","虚荣"]},{"id":"137","type":"quote","text":"这是最好的时代，这是最坏的时代。","source":"双城记","author":"狄更斯","translator":"宋兆霖","chapter":"开篇","region":"欧洲","era":"19世纪","dynasty":"","category":["时代","矛盾"],"emotion":["雄浑","苍凉"],"difficulty":2,"wordCount":15,"tags":["狄更斯","双城记","时代"]},{"id":"138","type":"quote","text":"它是世界上最美好的一切，也是最坏的一切；它是智慧，也是愚昧。","source":"双城记","author":"狄更斯","translator":"宋兆霖","chapter":"开篇","region":"欧洲","era":"19世纪","dynasty":"","category":["矛盾","时代"],"emotion":["雄浑","沉思"],"difficulty":3,"wordCount":27,"tags":["狄更斯","双城记","矛盾"]},{"id":"139","type":"quote","text":"世界上最宽阔的是海洋，比海洋更宽阔的是天空，比天空更宽阔的是人的胸怀。","source":"悲惨世界","author":"雨果","translator":"李丹","chapter":"","region":"欧洲","era":"19世纪","dynasty":"","category":["宽容","胸怀"],"emotion":["雄浑","温暖"],"difficulty":2,"wordCount":32,"tags":["雨果","悲惨世界","宽容"]},{"id":"140","type":"quote","text":"释放无限光明的是人心，制造无边黑暗的也是人心。","source":"悲惨世界","author":"雨果","translator":"李丹","chapter":"","region":"欧洲","era":"19世纪","dynasty":"","category":["人心","光明"],"emotion":["深沉","警醒"],"difficulty":3,"wordCount":22,"tags":["雨果","人心","光明"]},{"id":"141","type":"quote","text":"人，有了物质才能生存；人，有了理想才谈得上生活。","source":"悲惨世界","author":"雨果","translator":"李丹","chapter":"","region":"欧洲","era":"19世纪","dynasty":"","category":["理想","生存"],"emotion":["坚定","深沉"],"difficulty":2,"wordCount":24,"tags":["雨果","理想","生存"]},{"id":"142","type":"quote","text":"人在顺境中要忍耐，在逆境中需要的是勇气。","source":"基督山伯爵","author":"大仲马","translator":"蒋学模","chapter":"","region":"欧洲","era":"19世纪","dynasty":"","category":["忍耐","勇气"],"emotion":["坚定","睿智"],"difficulty":2,"wordCount":21,"tags":["大仲马","忍耐","勇气"]},{"id":"143","type":"quote","text":"人类的一切智慧都包含在这四个字里面：等待和希望。","source":"基督山伯爵","author":"大仲马","translator":"蒋学模","chapter":"结尾","region":"欧洲","era":"19世纪","dynasty":"","category":["智慧","希望"],"emotion":["雄浑","温暖"],"difficulty":2,"wordCount":22,"tags":["大仲马","希望","智慧"]},{"id":"144","type":"quote","text":"一个人需要隐藏多少秘密，才能巧妙地度过一生。","source":"荒原","author":"艾略特","translator":"赵萝蕤","chapter":"","region":"欧洲","era":"20世纪","dynasty":"","category":["秘密","人生"],"emotion":["沉思","苍凉"],"difficulty":3,"wordCount":22,"tags":["艾略特","秘密","人生"]},{"id":"145","type":"quote","text":"四月是最残忍的季节，从死去的土地里培育出丁香。","source":"荒原","author":"艾略特","translator":"赵萝蕤","chapter":"开篇","region":"欧洲","era":"20世纪","dynasty":"","category":["时间","残忍"],"emotion":["冷峻","苍凉"],"difficulty":3,"wordCount":19,"tags":["艾略特","四月","荒原"]},{"id":"146","type":"quote","text":"我们都活在阴沟里，但仍有人仰望星空。","source":"温德米尔夫人的扇子","author":"王尔德","translator":"钱之德","chapter":"","region":"欧洲","era":"19世纪","dynasty":"","category":["境遇","理想"],"emotion":["苍凉","诗意"],"difficulty":2,"wordCount":17,"tags":["王尔德","星空","理想"]},{"id":"147","type":"quote","text":"做你自己，因为别人都有人做了。","source":"王尔德语录","author":"王尔德","translator":"佚名","chapter":"","region":"欧洲","era":"19世纪","dynasty":"","category":["自我","独特"],"emotion":["机智","洒脱"],"difficulty":1,"wordCount":12,"tags":["王尔德","自我","独特"]},{"id":"148","type":"quote","text":"生活模仿艺术，远胜于艺术模仿生活。","source":"意图","author":"王尔德","translator":"佚名","chapter":"","region":"欧洲","era":"19世纪","dynasty":"","category":["艺术","模仿"],"emotion":["机智","颠覆"],"difficulty":3,"wordCount":17,"tags":["王尔德","艺术","模仿"]},{"id":"149","type":"quote","text":"有一天早晨，格里高尔·萨姆沙从不安的睡梦中醒来，发现自己躺在床上变成了一只巨大的甲虫。","source":"变形记","author":"卡夫卡","translator":"李文俊","chapter":"开篇","region":"欧洲","era":"20世纪","dynasty":"","category":["异化","荒诞"],"emotion":["冷峻","震撼"],"difficulty":3,"wordCount":38,"tags":["卡夫卡","变形记","开篇"]},{"id":"150","type":"quote","text":"书必须是凿开我们心中冰封海洋的斧头。","source":"卡夫卡书信集","author":"卡夫卡","translator":"李文俊","chapter":"","region":"欧洲","era":"20世纪","dynasty":"","category":["书","觉醒"],"emotion":["冷峻","深沉"],"difficulty":3,"wordCount":16,"tags":["卡夫卡","书","觉醒"]},{"id":"151","type":"quote","text":"今天，妈妈死了。也许是昨天，我不知道。","source":"局外人","author":"加缪","translator":"柳鸣九","chapter":"开篇","region":"欧洲","era":"20世纪","dynasty":"","category":["冷漠","荒诞"],"emotion":["冷峻","震撼"],"difficulty":2,"wordCount":15,"tags":["加缪","局外人","开篇"]},{"id":"152","type":"quote","text":"对未来的真正慷慨，是把一切献给现在。","source":"反抗者","author":"加缪","translator":"柳鸣九","chapter":"","region":"欧洲","era":"20世纪","dynasty":"","category":["当下","慷慨"],"emotion":["坚定","深沉"],"difficulty":3,"wordCount":15,"tags":["加缪","当下","奉献"]},{"id":"153","type":"quote","text":"在隆冬，我终于知道，我身上有一个不可战胜的夏天。","source":"回到提帕萨","author":"加缪","translator":"柳鸣九","chapter":"","region":"欧洲","era":"20世纪","dynasty":"","category":["坚韧","希望"],"emotion":["坚毅","温暖"],"difficulty":3,"wordCount":22,"tags":["加缪","夏天","坚韧"]},{"id":"154","type":"quote","text":"满地都是六便士，他却抬头看见了月亮。","source":"月亮与六便士","author":"毛姆","translator":"傅惟慈","chapter":"","region":"欧洲","era":"20世纪","dynasty":"","category":["理想","现实"],"emotion":["诗意","怅惘"],"difficulty":2,"wordCount":16,"tags":["毛姆","月亮","理想"]},{"id":"155","type":"quote","text":"追逐梦想就是追逐自己的厄运，在满地都是六便士的街上，他抬起头看到了月光。","source":"月亮与六便士","author":"毛姆","translator":"傅惟慈","chapter":"","region":"欧洲","era":"20世纪","dynasty":"","category":["梦想","代价"],"emotion":["诗意","悲壮"],"difficulty":3,"wordCount":32,"tags":["毛姆","梦想","月光"]},{"id":"156","type":"quote","text":"做自己最想做的事，生活在自己喜爱的环境里，淡薄宁静，与世无争，这难道是糟蹋自己吗？","source":"月亮与六便士","author":"毛姆","translator":"傅惟慈","chapter":"","region":"欧洲","era":"20世纪","dynasty":"","category":["选择","生活"],"emotion":["洒脱","质问"],"difficulty":3,"wordCount":36,"tags":["毛姆","选择","生活"]},{"id":"157","type":"quote","text":"于是我们奋力向前划，逆水行舟，被不断地向后推，直至回到往昔岁月。","source":"了不起的盖茨比","author":"菲茨杰拉德","translator":"巫宁坤","chapter":"结尾","region":"美国","era":"20世纪","dynasty":"","category":["奋斗","时间"],"emotion":["悲壮","苍凉"],"difficulty":3,"wordCount":30,"tags":["菲茨杰拉德","盖茨比","结尾"]},{"id":"158","type":"quote","text":"所有的光鲜亮丽都敌不过时间，并且一去不复返。","source":"了不起的盖茨比","author":"菲茨杰拉德","translator":"巫宁坤","chapter":"","region":"美国","era":"20世纪","dynasty":"","category":["时间","虚幻"],"emotion":["苍凉","怅惘"],"difficulty":2,"wordCount":18,"tags":["菲茨杰拉德","时间","虚幻"]},{"id":"159","type":"quote","text":"一个人要像他从未拥有过那样去生活。","source":"了不起的盖茨比","author":"菲茨杰拉德","translator":"巫宁坤","chapter":"","region":"美国","era":"20世纪","dynasty":"","category":["生活","洒脱"],"emotion":["旷达","怅惘"],"difficulty":2,"wordCount":16,"tags":["菲茨杰拉德","生活","洒脱"]},{"id":"160","type":"quote","text":"一个人可以被毁灭，但不能被打败。","source":"老人与海","author":"海明威","translator":"吴劳","chapter":"","region":"美国","era":"20世纪","dynasty":"","category":["坚韧","尊严"],"emotion":["坚毅","悲壮"],"difficulty":2,"wordCount":15,"tags":["海明威","老人与海","坚韧"]},{"id":"161","type":"quote","text":"现在不是去想缺少什么的时候，该想一想凭现有的东西你能做什么。","source":"老人与海","author":"海明威","translator":"吴劳","chapter":"","region":"美国","era":"20世纪","dynasty":"","category":["行动","当下"],"emotion":["坚毅","务实"],"difficulty":2,"wordCount":27,"tags":["海明威","行动","当下"]},{"id":"162","type":"quote","text":"勇气就是压力下的优雅。","source":"老人与海","author":"海明威","translator":"吴劳","chapter":"","region":"美国","era":"20世纪","dynasty":"","category":["勇气","优雅"],"emotion":["坚毅","从容"],"difficulty":1,"wordCount":10,"tags":["海明威","勇气","优雅"]},{"id":"163","type":"quote","text":"所有动物一律平等，但有些动物比其他动物更平等。","source":"动物农场","author":"奥威尔","translator":"荣如德","chapter":"结尾","region":"欧洲","era":"20世纪","dynasty":"","category":["讽刺","平等"],"emotion":["冷峻","讽刺"],"difficulty":2,"wordCount":21,"tags":["奥威尔","动物农场","讽刺"]},{"id":"164","type":"quote","text":"战争即和平，自由即奴役，无知即力量。","source":"1984","author":"奥威尔","translator":"董乐山","chapter":"","region":"欧洲","era":"20世纪","dynasty":"","category":["权力","操控"],"emotion":["冷峻","震撼"],"difficulty":3,"wordCount":14,"tags":["奥威尔","1984","权力"]},{"id":"165","type":"quote","text":"谁控制过去就控制未来，谁控制现在就控制过去。","source":"1984","author":"奥威尔","translator":"董乐山","chapter":"","region":"欧洲","era":"20世纪","dynasty":"","category":["权力","历史"],"emotion":["冷峻","警醒"],"difficulty":3,"wordCount":20,"tags":["奥威尔","1984","权力"]},{"id":"166","type":"quote","text":"我到林中去，因为我希望谨慎地生活，只面对生活的基本事实。","source":"瓦尔登湖","author":"梭罗","translator":"徐迟","chapter":"我生活的地方","region":"美国","era":"19世纪","dynasty":"","category":["简朴","生活"],"emotion":["宁静","坚定"],"difficulty":3,"wordCount":24,"tags":["梭罗","瓦尔登湖","简朴"]},{"id":"167","type":"quote","text":"一个人放下的东西越多，他就越富有。","source":"瓦尔登湖","author":"梭罗","translator":"徐迟","chapter":"","region":"美国","era":"19世纪","dynasty":"","category":["简朴","富有"],"emotion":["旷达","睿智"],"difficulty":2,"wordCount":16,"tags":["梭罗","简朴","富有"]},{"id":"168","type":"quote","text":"如果一个人跟不上他的同伴，那也许是因为他听到的是另一种鼓声。","source":"瓦尔登湖","author":"梭罗","translator":"徐迟","chapter":"结束语","region":"美国","era":"19世纪","dynasty":"","category":["独立","个性"],"emotion":["旷达","坚定"],"difficulty":3,"wordCount":28,"tags":["梭罗","独立","鼓声"]},{"id":"169","type":"quote","text":"不要追随前人的足迹，去自己开辟一条路。","source":"爱默生散文集","author":"爱默生","translator":"佚名","chapter":"自立","region":"美国","era":"19世纪","dynasty":"","category":["独立","自立"],"emotion":["坚定","激越"],"difficulty":2,"wordCount":18,"tags":["爱默生","自立","独立"]},{"id":"170","type":"quote","text":"做你害怕做的事，然后你会发现，不过如此。","source":"爱默生散文集","author":"爱默生","translator":"佚名","chapter":"","region":"美国","era":"19世纪","dynasty":"","category":["勇气","突破"],"emotion":["坚定","豁达"],"difficulty":2,"wordCount":18,"tags":["爱默生","勇气","突破"]},{"id":"201","type":"passage","text":"穿过县界长长的隧道，便是雪国。夜空下一片白茫茫。火车在信号所前停了下来。一位姑娘从对面座位上站起身来，把岛村座位前的玻璃窗打开。一股冷空气卷着灌了进来。姑娘将身子探出窗外，仿佛向远方呼唤似地喊道：\\n'站长先生，站长先生。'\\n一个把围巾裹到鼻子上、帽耳耷拉在耳朵边的男子，提着灯，踏着雪，慢腾腾地走了过来。姑娘已经探出了半个身子。岛村心想：已经这么冷了吗？他向窗外望去，只见铁路人员当作临时房子的旧木板房，星罗棋布地分散在山脚下。","highlight":"穿过县界长长的隧道，便是雪国。夜空下一片白茫茫。","source":"雪国","author":"川端康成","translator":"叶渭渠","chapter":"开篇","region":"日本","era":"20世纪","dynasty":"","category":["唯美","入境"],"emotion":["清冷","幽美"],"difficulty":3,"wordCount":195,"tags":["川端康成","雪国","开篇","唯美"]},{"id":"202","type":"passage","text":"今天，妈妈死了。也许是昨天，我不知道。我收到养老院的一封电报，说：'母死。明日葬。专此通知。'这说明不了什么。可能是昨天死的。养老院在马伦戈，离阿尔及尔八十公里。我乘两点的公共汽车去，下午到，赶得上守灵，明天晚上即可回来。这是我目前的想法。不过，我明天要给老板请两天假，理由是母亲去世。这样，我去的时候就可以守灵一夜，回来的时候还可以休息一天。这样，老板就不会不高兴了。","highlight":"今天，妈妈死了。也许是昨天，我不知道。","source":"局外人","author":"加缪","translator":"柳鸣九","chapter":"开篇","region":"欧洲","era":"20世纪","dynasty":"","category":["冷漠","荒诞"],"emotion":["冷峻","震撼"],"difficulty":3,"wordCount":168,"tags":["加缪","局外人","开篇","荒诞"]},{"id":"203","type":"passage","text":"盖茨比信奉这盏绿灯，这个一年年在我们眼前渐渐远去的极乐的未来。它从前逃脱了我们的追求，不过那没关系——明天我们跑得更快一点，把胳膊伸得更远一点……总有一天……\\n于是我们奋力向前划，逆水行舟，被不断地向后推，直至回到往昔岁月。","highlight":"于是我们奋力向前划，逆水行舟，被不断地向后推，直至回到往昔岁月。","source":"了不起的盖茨比","author":"菲茨杰拉德","translator":"巫宁坤","chapter":"结尾","region":"美国","era":"20世纪","dynasty":"","category":["奋斗","时间"],"emotion":["悲壮","苍凉"],"difficulty":4,"wordCount":110,"tags":["菲茨杰拉德","盖茨比","结尾","奋斗"]},{"id":"204","type":"passage","text":"我到林中去，因为我希望谨慎地生活，只面对生活的基本事实，看看我是否能学得到生活所教育我的东西，免得我在临死的时候，发现自己未曾真正生活过。我不想去过那非生活的生活，因为生活是如此的艰辛；我也不想去隐退，除非有绝对的必要。我想要深刻地生活，吸取生活中所有的精髓。","highlight":"我到林中去，因为我希望谨慎地生活，只面对生活的基本事实。","source":"瓦尔登湖","author":"梭罗","translator":"徐迟","chapter":"我生活的地方","region":"美国","era":"19世纪","dynasty":"","category":["简朴","哲思"],"emotion":["宁静","坚定"],"difficulty":4,"wordCount":122,"tags":["梭罗","瓦尔登湖","简朴","哲思"]},{"id":"205","type":"passage","text":"再没有比驯养更美好的事了。如果你想要一个朋友，那就驯养我吧！\\n'我该怎么做呢？'小王子问。\\n'你必须很有耐心。'狐狸说，'你先坐在草地上，坐得离我远一点，就像这样。我用眼角的余光看你，你什么也不要说。语言是误会的源头。但是，每一天，你都可以坐得近一点……'\\n'你每天最好在同一时间来。'狐狸说。","highlight":"如果你想要一个朋友，那就驯养我吧！","source":"小王子","author":"圣埃克苏佩里","translator":"马振骋","chapter":"第二十一章","region":"欧洲","era":"20世纪","dynasty":"","category":["友谊","驯养"],"emotion":["温暖","治愈"],"difficulty":2,"wordCount":137,"tags":["小王子","驯养","友谊","治愈"]},{"id":"206","type":"passage","text":"旧历的年底毕竟最像年底，村镇上不必说，就在天空中也显出将到新年的气象来。灰白色的沉重的晚云中间时常漏出些星光，仿佛是忽然隐去似的。近处的空气也仿佛深灰色的，混杂着将到新年的气息。天色愈阴暗了，午后竟又下起雪来，雪花大的有梅花那么大，满天飞舞，夹着烟霭和忙碌的气息，将鲁镇乱成一团糟。","highlight":"旧历的年底毕竟最像年底，村镇上不必说，就在天空中也显出将到新年的气象来。","source":"祝福","author":"鲁迅","translator":"","chapter":"开篇","region":"中国现当代","era":"现代","dynasty":"","category":["叙事","年味"],"emotion":["冷峻","苍凉"],"difficulty":3,"wordCount":119,"tags":["鲁迅","祝福","开篇","叙事"]},{"id":"207","type":"passage","text":"严冬一封锁了大地的时候，则大地满地裂着口。从南到北，从东到西，几寸长的，一丈长的，还有好几丈长的，它们毫无方向地，便随时随地，只要严冬一到，大地就裂开口了。严寒把大地冻裂了。这种人，本来也是天真爽快的，但因为被冻裂了，便什么都裂开了。花会裂开，树会裂开，连石头也会裂开。","highlight":"严冬一封锁了大地的时候，则大地满地裂着口。","source":"呼兰河传","author":"萧红","translator":"","chapter":"开篇","region":"中国现当代","era":"现代","dynasty":"","category":["严冬","叙事"],"emotion":["苍凉","萧索"],"difficulty":3,"wordCount":116,"tags":["萧红","呼兰河传","开篇","严冬"]},{"id":"208","type":"passage","text":"我这一生，尽是可耻之事。我过的是一种充满耻辱的生活。我所过的'如同那个人一样的生活'，对那个女人的'如同那个人一样的生活'，也是一种充满了耻辱的生活。然而，我又坚信，自己绝非丧失了作为人的资格。我宁可说，正因为我自觉是一个人，才愈发感觉到这种耻辱。我越是自觉，越是感到可耻，越是厌恶自己，便越觉得自己活得不像一个人。","highlight":"我这一生，尽是可耻之事。","source":"人间失格","author":"太宰治","translator":"佚名","chapter":"第一手记","region":"日本","era":"20世纪","dynasty":"","category":["自白","耻辱"],"emotion":["颓废","悲凉"],"difficulty":4,"wordCount":130,"tags":["太宰治","人间失格","自白","颓废"]},{"id":"209","type":"passage","text":"一天早晨，格里高尔·萨姆沙从不安的睡梦中醒来，发现自己躺在床上变成了一只巨大的甲虫。他仰卧着，那硬得像铁甲一般的背贴着床，他稍稍一抬头，便看见自己那穹顶似的棕色肚子。肚子分成许多块弧形的硬片，被子几乎盖不住肚子尖，都快滑下来了。比起他庞大的身躯来，他那许多只腿真是细得可怜，都在他眼前无可奈何地舞动着。","highlight":"一天早晨，格里高尔·萨姆沙从不安的睡梦中醒来，发现自己躺在床上变成了一只巨大的甲虫。","source":"变形记","author":"卡夫卡","translator":"李文俊","chapter":"开篇","region":"欧洲","era":"20世纪","dynasty":"","category":["异化","荒诞"],"emotion":["冷峻","震撼"],"difficulty":4,"wordCount":143,"tags":["卡夫卡","变形记","开篇","荒诞"]},{"id":"210","type":"passage","text":"鲁镇的酒店的格局，是和别处不同的：都是当街一个曲尺形的大柜台，柜里面预备着热水，可以随时温酒。做工的人，傍午傍晚散了工，每每花四文铜钱，买一碗酒，——这是二十多年前的事，现在每碗要涨到十文，——靠柜外站着，热热的喝了休息；倘肯多花一文，便可以买一碟盐煮笋，或者茴香豆，做下酒物了，如果出到十几文，那就能买一样荤菜。","highlight":"鲁镇的酒店的格局，是和别处不同的。","source":"孔乙己","author":"鲁迅","translator":"","chapter":"开篇","region":"中国现当代","era":"现代","dynasty":"","category":["叙事","市井"],"emotion":["冷峻","克制"],"difficulty":3,"wordCount":124,"tags":["鲁迅","孔乙己","开篇","市井"]},{"id":"211","type":"passage","text":"幸福的家庭都是相似的，不幸的家庭各有各的不幸。奥布隆斯基家里一切都混乱了。妻子发现丈夫和他们家从前的法国女家庭教师有暧昧关系，她向丈夫声明她不能和他再在一个屋子里住下去了。这种状态已经继续了三天，不但夫妻二人，就是他们全家和仆人们都为此感到痛苦。所有的家庭成员和仆人都觉得他们在一起生活是受不了的。","highlight":"幸福的家庭都是相似的，不幸的家庭各有各的不幸。","source":"安娜·卡列尼娜","author":"托尔斯泰","translator":"草婴","chapter":"开篇","region":"俄罗斯","era":"19世纪","dynasty":"","category":["家庭","不幸"],"emotion":["深沉","睿智"],"difficulty":4,"wordCount":125,"tags":["托尔斯泰","安娜卡列尼娜","开篇","家庭"]},{"id":"212","type":"passage","text":"薄暮时分，罗生门下。一个仆人正在等待雨停。在宽阔的阶梯底下，有一个男人。但是，这个男人为了避开风雨，便特意钻到门下边来。这罗生门，在朱雀大路上，除了这个仆人，再没有别人。世界本就是如此宽广，但是又如此狭窄。这并非是因为朱雀大路上有什么特别的事故，只是因为，在平安朝的盛世，罗生门这个地方，连一个避雨的人也没有。","highlight":"薄暮时分，罗生门下。","source":"罗生门","author":"芥川龙之介","translator":"鲁迅","chapter":"开篇","region":"日本","era":"20世纪","dynasty":"","category":["萧索","境遇"],"emotion":["萧索","迷惘"],"difficulty":3,"wordCount":144,"tags":["芥川龙之介","罗生门","开篇","萧索"]},{"id":"213","type":"passage","text":"凡是有钱的单身汉，总想娶位太太，这是一条举世公认的真理。这样的真理在家家户户的心目中都是根深蒂固的，因此，人们总是把它当作理所当然的事情，以至于这样的单身汉一搬到新地方，邻居们哪怕对他的性情或见识一无所知，也会马上把他看作自己某一个女儿的合法财产。","highlight":"凡是有钱的单身汉，总想娶位太太，这是一条举世公认的真理。","source":"傲慢与偏见","author":"简·奥斯汀","translator":"王科一","chapter":"开篇","region":"欧洲","era":"古代","dynasty":"","category":["讽刺","婚姻"],"emotion":["机智","幽默"],"difficulty":3,"wordCount":111,"tags":["奥斯汀","傲慢与偏见","开篇","讽刺"]},{"id":"214","type":"passage","text":"那是我们最美好的时代，那是最糟糕的时代；那是智慧的年头，那是愚昧的年头；那是信仰的时期，那是怀疑的时期；那是光明的季节，那是黑暗的季节；那是希望的春天，那是失望的冬天；我们全都在直奔天堂，我们全都在直奔相反的方向。简而言之，那时跟现在非常相像，某些最喧嚣的权威坚持要用形容词的最高级来形容它。","highlight":"那是我们最美好的时代，那是最糟糕的时代。","source":"双城记","author":"狄更斯","translator":"宋兆霖","chapter":"开篇","region":"欧洲","era":"19世纪","dynasty":"","category":["时代","矛盾"],"emotion":["雄浑","苍凉"],"difficulty":4,"wordCount":145,"tags":["狄更斯","双城记","开篇","时代"]},{"id":"215","type":"passage","text":"他不再梦见风暴，不再梦见妇女，不再梦见伟大的事件，不再梦见大鱼，不再梦见搏斗，不再梦见力量的较量，也不再梦见他本人。他只梦见那些地方和海滩上的狮子。它们在暮色中像小猫一样玩耍着，他爱它们就像爱那个男孩一样。他从未梦见过那个男孩。他就这样醒了，从敞开的窗外望见月亮，把裤子拉上穿上，走到棚屋外面去小便。","highlight":"他不再梦见风暴，不再梦见妇女，不再梦见伟大的事件。","source":"老人与海","author":"海明威","translator":"吴劳","chapter":"","region":"美国","era":"20世纪","dynasty":"","category":["梦境","宁静"],"emotion":["宁静","苍凉"],"difficulty":3,"wordCount":130,"tags":["海明威","老人与海","狮子","梦境"]},{"id":"216","type":"passage","text":"所有的动物一律平等，但有些动物比其他动物更平等。从此以后，似乎不再有任何动物提出过异议。到了这个时候，一切动物在猪面前都自惭形秽。最后，猪开始用两条腿走路了。几天以后，猪在庄园里到处走动，用后腿直立行走。再过几天，他们开始用前蹄提着鞭子。于是，一切 animal 都在猪的统治之下。","highlight":"所有的动物一律平等，但有些动物比其他动物更平等。","source":"动物农场","author":"奥威尔","translator":"荣如德","chapter":"结尾","region":"欧洲","era":"20世纪","dynasty":"","category":["讽刺","权力"],"emotion":["冷峻","讽刺"],"difficulty":3,"wordCount":119,"tags":["奥威尔","动物农场","讽刺","权力"]},{"id":"217","type":"passage","text":"你要是没读过《汤姆·索亚历险记》那本书，你就不知道我是谁。不过那也没关系。那本书是马克·吐温先生写的，他讲的大体是实话。有些事是他胡编的，不过大体上他讲的还是实话。这没什么。我从来没见过一个讲究说实话的人，会偶尔不讲点实话。波莉姨妈——也就是汤姆的波莉姨妈——玛丽，还有道格拉斯寡妇，他们都在那本书里讲过。","highlight":"你要是没读过《汤姆·索亚历险记》那本书，你就不知道我是谁。","source":"哈克贝利·费恩历险记","author":"马克·吐温","translator":"张万里","chapter":"开篇","region":"美国","era":"19世纪","dynasty":"","category":["叙事","自由"],"emotion":["洒脱","幽默"],"difficulty":3,"wordCount":138,"tags":["马克吐温","哈克贝利","开篇","自由"]},{"id":"218","type":"passage","text":"使生如夏花之绚烂，死如秋叶之静美。生之盛放，是夏花之热烈，是炽烈的、不留退路的盛放；死之静美，是秋叶之安宁，是优雅的、毫无遗憾的飘落。生与死之间，是漫长的盛夏与深秋。我们走过的每一步，都印在时间里。时间不会等待，生命不会重来。我们在盛放中燃烧，在飘落中安息。这就是生命，这就是美。","highlight":"使生如夏花之绚烂，死如秋叶之静美。","source":"飞鸟集","author":"泰戈尔","translator":"郑振铎","chapter":"","region":"全球诗歌","era":"20世纪","dynasty":"","category":["生死","美"],"emotion":["绚烂","静谧"],"difficulty":3,"wordCount":124,"tags":["泰戈尔","飞鸟集","生死","美"]},{"id":"219","type":"passage","text":"当你老了，头发花白，睡意沉沉，倦坐在炉边，取下这本书来，慢慢读着，追梦当年的眼神，那柔美的神采与深幽的阴影。多少人爱你青春欢畅的时辰，爱慕你的美丽，假意或真心，只有一个人爱你那朝圣者的灵魂，爱你衰老了的脸上痛苦的皱纹。","highlight":"只有一个人爱你那朝圣者的灵魂。","source":"当你老了","author":"叶芝","translator":"袁可嘉","chapter":"","region":"全球诗歌","era":"20世纪","dynasty":"","category":["爱情","暮年"],"emotion":["深情","沧桑"],"difficulty":3,"wordCount":102,"tags":["叶芝","当你老了","爱情","暮年"]},{"id":"220","type":"passage","text":"今夜我可以写出最哀伤的诗篇。写，比如说，'夜空群星晶莹，远处星光摇曳在蔚蓝风中。'夜空的风在空中回旋，歌唱。今夜我可以写出最哀伤的诗篇。我爱过她，有时她也爱过我。如同许多夜晚，我曾拥她在怀。在无尽的天空下一遍又一遍地吻过她。她爱过我，有时我也爱过她。怎奈少了她的爱，我怎能不渴望。","highlight":"今夜我可以写出最哀伤的诗篇。","source":"二十首情诗和一首绝望的歌","author":"聂鲁达","translator":"李宗荣","chapter":"第二十首","region":"拉美","era":"20世纪","dynasty":"","category":["哀伤","爱情"],"emotion":["凄美","深情"],"difficulty":3,"wordCount":122,"tags":["聂鲁达","哀伤","诗","爱情"]},{"id":"221","type":"passage","text":"主啊！是时候了。夏日曾经很盛大。把你的阴影落在日晷上，让秋风刮过田野。让最后的果实长得丰满，再给它们两天南方的气候，迫使它们成熟，把最后的甘甜酿入浓酒。谁这时没有房屋，就不必建筑；谁这时孤独，就永远孤独，就醒着，读着，写着长信，在林荫道上来回不安地游荡，当着落叶纷飞。","highlight":"谁这时没有房屋，就不必建筑；谁这时孤独，就永远孤独。","source":"秋日","author":"里尔克","translator":"冯至","chapter":"","region":"全球诗歌","era":"20世纪","dynasty":"","category":["秋日","孤独"],"emotion":["清冷","决绝"],"difficulty":3,"wordCount":118,"tags":["里尔克","秋日","孤独","决绝"]},{"id":"222","type":"passage","text":"据说，在雅尔塔，早晨的海面上，可以看见远处的轮船。古罗夫在那里认识了一位女士，她年轻、美丽，名叫安娜·谢尔盖耶芙娜。她独自一人来到雅尔塔，丈夫留在某个省城里。她曾在邮政局工作，后来嫁了一个公务员。她对古罗夫说：'我过的是一种枯燥的、乏味的生活，没有什么人可以谈谈心，没有什么人可以诉诉苦。'","highlight":"我过的是一种枯燥的、乏味的生活，没有什么人可以谈谈心。","source":"带小狗的女人","author":"契诃夫","translator":"汝龙","chapter":"开篇","region":"俄罗斯","era":"19世纪","dynasty":"","category":["邂逅","孤独"],"emotion":["忧郁","细腻"],"difficulty":3,"wordCount":122,"tags":["契诃夫","带小狗的女人","邂逅","孤独"]},{"id":"223","type":"passage","text":"我喜欢你是寂静的，仿佛你消失了一样，遥远且哀伤，仿佛你已经死了。一个字，一个微笑，已经足够。我感到欢喜，欢喜那并非真实的存在。让我借你的沉默与你说话，你的沉默明亮如灯，简单如指环。你就像黑夜，拥有寂寞与群星。你的沉默就是星星的沉默，遥远而明亮。我喜欢你是寂静的，仿佛你消失了一样。","highlight":"我喜欢你是寂静的，仿佛你消失了一样。","source":"二十首情诗和一首绝望的歌","author":"聂鲁达","translator":"李宗荣","chapter":"第十五首","region":"拉美","era":"20世纪","dynasty":"","category":["爱情","寂静"],"emotion":["深情","怅惘"],"difficulty":3,"wordCount":126,"tags":["聂鲁达","寂静","爱情","深情"]},{"id":"224","type":"passage","text":"我赞美我自己，歌唱我自己，我所讲的一切，将是对你也有利的一切，因为属于我的每一个原子，也属于你。我，今年三十七岁，身体健康，我开始吟唱，希望我能永不停息地唱下去，直到死亡。我现在要使我自己成为一首诗，要使你成为一首诗。我和你同在，你也和我同在，我们俩人互为表里。","highlight":"我赞美我自己，歌唱我自己。","source":"草叶集","author":"惠特曼","translator":"楚图南","chapter":"自我之歌","region":"全球诗歌","era":"19世纪","dynasty":"","category":["自我","赞美"],"emotion":["豪迈","坦荡"],"difficulty":3,"wordCount":107,"tags":["惠特曼","草叶集","自我","赞美"]},{"id":"225","type":"passage","text":"希望是有羽毛的东西，它栖息在灵魂上，唱着没有歌词的歌，从来没有停止过，在最狂暴的风中，我听见过它，最寒冷的大地上，也从未因为缺少面包而感到战栗。它给予我温暖，哪怕在最寒冷的夜晚。希望是那一根羽毛，那一根最温暖的羽毛，它在灵魂的深处歌唱，无需任何语言。我听见它在唱，一直唱，从未停止。","highlight":"希望是有羽毛的东西，它栖息在灵魂上。","source":"狄金森诗选","author":"狄金森","translator":"江枫","chapter":"第254首","region":"全球诗歌","era":"19世纪","dynasty":"","category":["希望","灵魂"],"emotion":["温暖","坚韧"],"difficulty":3,"wordCount":123,"tags":["狄金森","希望","灵魂","温暖"]},{"id":"226","type":"passage","text":"海燕叫喊着，飞掠过去，像黑色的闪电，箭一般的穿过乌云，翅膀激起波浪的飞沫。看吧，它飞舞着，像个精灵，——高傲的、黑色的暴风雨的精灵，——它一边大笑，它一边高叫，它笑那些乌云，它为欢乐而高叫！这个敏感的精灵，——它从雷声的震怒里，早就听出了困乏，它深信，乌云遮不住太阳，——是的，遮不住的！","highlight":"乌云遮不住太阳，——是的，遮不住的！","source":"海燕","author":"高尔基","translator":"戈宝权","chapter":"","region":"俄罗斯","era":"20世纪","dynasty":"","category":["勇气","信念"],"emotion":["激越","豪迈"],"difficulty":3,"wordCount":125,"tags":["高尔基","海燕","勇气","信念"]},{"id":"227","type":"passage","text":"我记得那美妙的一瞬，在我的面前出现了你，有如昙花一现的幻影，有如纯洁之美的精灵。在那无望的忧愁的折磨中，在那喧闹的浮华生活的困扰中，我的耳边长久地响着你温柔的声音，我还在睡梦中见到你可爱的面容。许多年过去了。狂暴的激情驱散了往日的梦想，于是我忘记了你温柔的声音，和你那神圣的面容。","highlight":"我记得那美妙的一瞬，在我的面前出现了你。","source":"普希金诗选","author":"普希金","translator":"戈宝权","chapter":"","region":"俄罗斯","era":"19世纪","dynasty":"","category":["爱情","追忆"],"emotion":["深情","怅惘"],"difficulty":3,"wordCount":126,"tags":["普希金","美妙的一瞬","爱情","追忆"]},{"id":"228","type":"passage","text":"简爱：你以为，因为我穷、低微、不美、矮小，我就没有灵魂没有心吗？你想错了！我的灵魂跟你的一样，我的心也跟你的完全一样！要是上帝赐予我一点美貌和大量财富，我也能让你难以离开我，就像我现在难以离开你一样。我现在不是凭着习俗、常规，甚至不是凭着肉体在和你说话——而是我的精神在同你的精神说话。","highlight":"我的灵魂跟你的一样，我的心也跟你的完全一样！","source":"简·爱","author":"夏洛蒂·勃朗特","translator":"吴钧陶","chapter":"第二十三章","region":"欧洲","era":"19世纪","dynasty":"","category":["自尊","爱情"],"emotion":["激越","真挚"],"difficulty":4,"wordCount":134,"tags":["勃朗特","简爱","自尊","爱情"]},{"id":"229","type":"passage","text":"乡绅屈利劳尼先生、李甫西大夫和其他几位先生，要我把有关金银岛的全部详情，从头至尾毫无保留地写下来。只有宝藏的精确方位除外，那是因为今天岛上还有没取走的宝藏。我于是拿起笔来，回到一千七百某年的我父亲开设的本葆海军上将客店，回想当年那个棕色脸上带着刀疤、提着一只水手衣物箱的老海员，他第一次到我们屋顶下来寄宿的情景。","highlight":"我于是拿起笔来，回想当年那个棕色脸上带着刀疤的老海员。","source":"金银岛","author":"史蒂文森","translator":"荣如德","chapter":"开篇","region":"欧洲","era":"19世纪","dynasty":"","category":["冒险","回忆"],"emotion":["期待","神秘"],"difficulty":3,"wordCount":137,"tags":["史蒂文森","金银岛","开篇","冒险"]},{"id":"230","type":"passage","text":"我们知道的东西再多，也是我们不知的东西中极小的一部分。我们以为知识渊博，其实我们连自己的身体都还没认识清楚。有一种东西，它比天空更宽广，比大地更深厚，那就是人的内心。我们读书，不是为了寻找答案，而是为了更好地提出问题。真正的智慧，不在于知道多少，而在于知道自己不知道什么。","highlight":"我们读书，不是为了寻找答案，而是为了更好地提出问题。","source":"蒙田随笔","author":"蒙田","translator":"马振骋","chapter":"论经验","region":"欧洲","era":"古代","dynasty":"","category":["智慧","读书"],"emotion":["睿智","谦逊"],"difficulty":4,"wordCount":123,"tags":["蒙田","随笔","智慧","读书"]}]`),md={100:{context:`此句常被归于何塞·马蒂（1853-1895）的箴言。马蒂是古巴民族英雄、诗人、思想家。这句话以"种树"为喻，讲行动的时机，已成为时间管理的经典格言。`,analysis:`"最佳时间"是过去（二十年前），"仅次于它的最佳时间"是现在。全句揭示了一个深刻的时间哲理：过去的已经过去，但"现在"永远是最优解。这是对"拖延"与"后悔"的最佳解药——别等，也别悔，现在就种。`,crossReference:`与陶渊明"悟已往之不谏，知来者之可追"同属对时间的洞察。亦近于乔布斯"Stay hungry, stay foolish"，同是行动的鼓励。`,modernRelevance:`在"拖延症"成为时代病的今天，这句话是最佳解药。无论是学英语、健身、写作还是创业，最好的时机永远是"二十年前"，其次是"现在"。别再用"已经晚了"作为借口——现在就是最好的开始。`,furtherReading:[`《何塞·马蒂箴言集》`,`《归去来兮辞》陶渊明`,`《乔布斯传》`]},101:{context:`出自泰戈尔《飞鸟集》（1916年）。泰戈尔以326首短诗组成这部诗集，此句是最广为流传的一首。以夏花与秋叶对举，将生死两个沉重命题化为自然意象。泰戈尔1913年获诺贝尔文学奖，是亚洲第一人。`,analysis:`"绚烂"与"静美"形成鲜明对照：生当如夏花般热烈绽放，死当如秋叶般安然飘落。两个比喻跨越生死，赋予生命以审美意义。全句以自然喻人生，将东方哲学的生死观融入现代诗形，是泰戈尔"梵我合一"思想的诗化。`,crossReference:`与庄子"生之来不能却，其去不能止"的生死观相呼应。亦近于里尔克"死是生命的一面"之思辨，同是将死亡自然化。`,modernRelevance:`在惧怕死亡、回避谈论终点的现代文化中，泰戈尔提醒我们：死亡不必是恐惧的对象，而可以是优雅的完成。活得热烈，走得安静——这是对生命最好的交代。`,furtherReading:[`《飞鸟集》泰戈尔`,`《庄子·至乐》`,`《杜伊诺哀歌》里尔克`]},102:{context:`出自泰戈尔《飞鸟集》。此句以"痛吻"与"报歌"的对比，写面对苦难的态度。这是泰戈尔最受争议也最受推崇的诗句之一——有人视为伟大，有人视为鸡汤。`,analysis:`"世界以痛吻我"是被动受苦，"要我报之以歌"是主动回应。"吻"一词将"痛"柔化，暗示苦难中藏着某种温柔。全句不是要求"感谢苦难"，而是选择"以歌回应"——歌，是对苦难的最高超越。这是斯多葛式的坚韧。`,crossReference:`与尼采"凡不能杀死我的，必使我更强大"同属苦难哲学。亦近于《圣经》"从前你们的意思是要害我，但神的意思原是好的"，同是苦难的转化。`,modernRelevance:`在"受害者有罪论"和"感谢苦难"两种极端之间，泰戈尔给出了第三种答案：不感谢苦难，但"报之以歌"。苦难不值得感谢，但你的回应方式，定义了你是谁。`,furtherReading:[`《飞鸟集》泰戈尔`,`《查拉图斯特拉如是说》尼采`,`《圣经·创世记》`]},103:{context:`出自泰戈尔《飞鸟集》。此句以"太阳"与"群星"的对比，写失去与获得的关系。这是泰戈尔最富哲理的诗句之一，常被引用以安慰失恋或失意者。`,analysis:`"太阳"是大的失去，"群星"是小的获得。泰戈尔揭示了一个心理真相：为大的失去流泪，会让你错过小的获得。"也失去了"三字尤为痛切——失去已经是痛，再因流泪而错过，是双重的损失。这是对"沉溺"的警醒。`,crossReference:`与普希金"假如生活欺骗了你，不要悲伤"同属对悲伤的劝慰。亦近于佛家"放下执着"，同是劝人不要困于失去。`,modernRelevance:`在失恋、失业、失意后，我们常"为太阳流泪"而错过"群星"。泰戈尔提醒我们：失去已成事实，但"群星"仍在。抬起头，才能看见那些你因低头流泪而错过的美好。`,furtherReading:[`《飞鸟集》泰戈尔`,`《普希金诗选》`,`《心经》`]},104:{context:`出自泰戈尔《飞鸟集》。此句以"天空没有痕迹"与"我已飞过"的对比，写行动与结果的关系。这是泰戈尔对"过程"与"结果"最精炼的表达。`,analysis:`"没有翅膀的痕迹"是无果，"我已飞过"是有行。全句将"飞过"本身视为价值，不必留下"痕迹"。这是对"结果导向"的根本质疑——飞过的体验，比痕迹更重要。这是过程哲学的诗化。`,crossReference:`与加缪"攀登顶峰的奋斗本身足以充实人的心灵"同属过程哲学。亦近于王阳明"知行合一"，同是将行动本身视为价值。`,modernRelevance:`在KPI驱动的时代，我们执着于"痕迹"——业绩、成果、点赞数。泰戈尔提醒我们："飞过"本身就是意义。有些最美的体验，不会留下任何"痕迹"，但它们构成了生命的厚度。`,furtherReading:[`《飞鸟集》泰戈尔`,`《西西弗神话》加缪`,`《传习录》王阳明`]},105:{context:`出自泰戈尔《园丁集》（1913年）。这是泰戈尔的情诗集，此句以"旷野的鸟"喻心，写爱情中的归属感。泰戈尔的情诗既有东方的含蓄，又有现代的直白。`,analysis:`"旷野的鸟"是心的状态——自由但无归属。"在你的眼睛里找到了它的天空"是爱的达成——爱不是囚禁，而是"天空"。全句将爱化为空间，将心化为鸟，以"找到"完成归属。这是对爱最美好的定义：爱是给心一片天空。`,crossReference:`与舒婷"我必须是你近旁的一株木棉"同属平等爱观。亦近于聂鲁达"我喜欢你是寂静的"，同是以自然意象写爱。`,modernRelevance:`在控制欲被视为"在乎"的时代，泰戈尔提醒我们：真正的爱，不是给鸟一个笼子，而是给心一片"天空"。爱是自由，不是囚禁。能让你"找到天空"的人，才是对的人。`,furtherReading:[`《园丁集》泰戈尔`,`《致橡树》舒婷`,`《二十首情诗》聂鲁达`]},106:{context:`出自波特莱尔《恶之花》（1857年）。这是法国象征主义诗歌的奠基之作，因"伤风败俗"曾被禁。波特莱尔以"恶"中寻"美"，开创了现代诗歌的"审丑"传统。此句写无法拥抱的忧郁。`,analysis:`"忧郁的是"奠定基调，"无法用双手拥抱你"是忧郁的源头。"拥抱"本是亲密动作，"无法"二字将其化为距离。全句以最简单的语言，写出了最深的渴望与最远的距离。这是象征主义的典型——以具象写抽象。`,crossReference:`与李商隐"相见时难别亦难"同属无法触及的痛。亦近于聂鲁达"我的声音却无法触及你"，同是距离的忧郁。`,modernRelevance:`在异地恋、网友关系日益普遍的时代，"无法用双手拥抱"是常态。波特莱尔提醒我们：身体的距离，是所有忧郁中最本质的一种。所有的视频、语音，都无法替代"双手拥抱"的温度。`,furtherReading:[`《恶之花》波特莱尔`,`《无题》李商隐`,`《二十首情诗》聂鲁达`]},107:{context:`此句常被引为波特莱尔《恶之花》中的诗句。波特莱尔以"泥土"与"黄金"的转化，写艺术创造的本质。这是波特莱尔"审丑"美学的核心命题——从庸常中提炼美。`,analysis:`"泥土"是庸常，"黄金"是价值，"我把它变成"是转化。全句将艺术创造的本质一语道破：艺术家不是逃避现实，而是"把泥土变成黄金"。这是对唯美主义的深化——美不在远方，而在转化的能力。`,crossReference:`与艾略特"诗不是情感的释放，而是情感的逃避"同属艺术转化论。亦近于《红楼梦》"把污泥涂满全身"后开出花来，同是化丑为美。`,modernRelevance:`在"逃离现实"被视为解药的时代，波特莱尔提醒我们：真正的艺术家不逃离"泥土"，而是"把它变成黄金"。这种转化的能力，不仅是艺术，更是生活——如何在庸常中提炼意义，是每个人的修行。`,furtherReading:[`《恶之花》波特莱尔`,`《艾略特诗选》`,`《红楼梦》曹雪芹`]},108:{context:`此句出自波特莱尔《巴黎的忧郁》（1863年）中的"沉醉吧"。波特莱尔以"醉"喻一切让人逃避时间重担的事物——酒、诗、美德。这是颓废派的精神宣言。`,analysis:`"醉下去"是行动，"永远地"是程度，"为了不感受时间"是目的。"可怕的重担"将时间拟物化，"压碎"是结果。全句揭示了人类逃避时间的本能——通过"醉"（无论是何种醉）来抵抗时间的流逝。这是对必死性的反抗。`,crossReference:`与苏轼"人生如梦，一尊还酹江月"同属以酒抗时间。亦近于海德格尔"向死而生"，同是对时间有限性的回应。`,modernRelevance:`在短视频、游戏、社交网络成为"新时代的酒"的今天，波特莱尔的话尤为刺心。我们都在"醉"——为了"不感受时间那可怕的重担"。但波特莱尔也提醒："醉"有多种，选哪种"醉"，定义了你是谁。`,furtherReading:[`《巴黎的忧郁》波特莱尔`,`《赤壁赋》苏轼`,`《存在与时间》海德格尔`]},109:{context:`出自魏尔伦《感伤的对话》（1870年）。魏尔伦是法国象征主义诗人，此句以"小提琴"喻秋风，写季节的忧郁。这是"为艺术而艺术"的典型表达。`,analysis:`"小提琴的呜咽"是通感，将听觉（呜咽）与视觉（小提琴）融合。"单调的忧郁"将抽象情感具体化。"慰藉"一词尤为关键——忧郁本身成了慰藉。这是颓废美学的核心：在忧郁中寻找美与慰藉。`,crossReference:`与李商隐"秋阴不散霜飞晚"同属秋之忧郁。亦近于波特莱尔"忧郁"系列，同是以美写哀。`,modernRelevance:`在"正能量"被过度推崇的时代，魏尔伦提醒我们：忧郁也有其美。"单调的忧郁"可以"慰藉"心灵。允许自己感受忧郁，不必急于"振作"，是对情感完整性的尊重。`,furtherReading:[`《魏尔伦诗选》`,`《无题》李商隐`,`《恶之花》波特莱尔`]},110:{context:`此句出自魏尔伦《感伤的对话》。魏尔伦以"天空在水上哭泣"的奇喻，写雨与泪的交融。这是象征主义"通感"手法的典范。`,analysis:`"天空正在水上哭泣"是拟人，将天空与水拟为哭泣者。"温柔地"修饰"哭泣"，将悲伤柔化。全句以自然意象写人的情感，达到物我交融的境界。这是"情景交融"的法式版本。`,crossReference:`与秦观"自在飞花轻似梦，无边丝雨细如愁"同以雨写愁。亦近于王维"空山新雨后"，同是雨中意境。`,modernRelevance:`在快节奏生活中，我们很少注意"天空在水上哭泣"。魏尔伦提醒我们：自然与人的情感是相通的。偶尔停下，看一看"温柔地哭泣"的天空，会发现悲伤也可以如此美。`,furtherReading:[`《魏尔伦诗选》`,`《浣溪沙》秦观`,`《山居秋暝》王维`]},111:{context:`此句出自魏尔伦诗选。魏尔伦的诗常以模糊与重复为特征，此句以"我找到她了"的重复，写一种迟来的确认。这是象征主义对"确定"的暧昧处理。`,analysis:`"我找到她了"是陈述，"是谁呢"是疑问，"我找到了她"是重复确认。全句在"找到"与"是谁"之间摇摆，暗示找到的不是具体的人，而是一种感觉、一种状态。这是象征主义的典型——意义在模糊中生成。`,crossReference:`与辛弃疾"众里寻他千百度，蓦然回首"同属寻找与发现。亦近于普鲁斯特"重新找到的时光"，同是迟来的确认。`,modernRelevance:`在"确定"被推崇的时代，魏尔伦的暧昧尤为珍贵。有时我们"找到"的，不是某个具体的人或物，而是一种心境。"是谁呢"不重要，重要的是"找到了"的感觉。`,furtherReading:[`《魏尔伦诗选》`,`《青玉案·元夕》辛弃疾`,`《追忆似水年华》普鲁斯特`]},112:{context:`此句出自兰波《兰波诗选》（1873年）。兰波19岁写出此句，成为"生活在别处"的经典表达。这句话影响了整个20世纪的文学与哲学，米兰·昆德拉以此为书名写小说。`,analysis:`"生活在别处"是对"此处"的否定，也是对"别处"的渴望。全句以极简语言，写出了人类永恒的"别处情结"——此处是庸常，别处是理想。这是浪漫主义的核心冲动，也是现代人精神漂泊的写照。`,crossReference:`与陶渊明"归去来兮"同属对"别处"的向往。亦近于海德格尔"被抛入世界"，同是对"此处"的不安。`,modernRelevance:`在"诗与远方"成为流行语的时代，兰波的这句话显得尤为刺心。我们总以为"生活在别处"，但兰波也暗示：别处也是此处。真正的"别处"，不在地理，而在心境——能否在"此处"活出"别处"的感觉。`,furtherReading:[`《兰波诗选》`,`《生活在别处》米兰·昆德拉`,`《归去来兮辞》陶渊明`]},113:{context:`此句出自兰波《地狱一季》（1873年）。兰波在这部散文诗中记录了自己的精神危机。此句以"永恒的灵魂"与"黑夜白昼"的对比，写存在之痛。这是兰波"通灵者"诗学的核心表达。`,analysis:`"永恒的灵魂"是不变，"注视着你的心"是连接，"黑夜孤寂白昼如焚"是双重的痛苦。全句将"永恒"与"瞬息"、"孤独"与"炽烈"并置，写出存在主义的焦虑。这是兰波19岁写出的惊人成熟之作。`,crossReference:`与鲁迅"绝望之于虚妄，正与希望相同"同属绝望中的坚持。亦近于里尔克"有何胜利可言，挺住意味着一切"，同是痛苦中的存在。`,modernRelevance:`在"躺平"与"内卷"之间，兰波的"黑夜孤寂白昼如焚"写出了现代人的真实状态——夜晚孤独，白天焦虑。但"永恒的灵魂"仍在"注视"，这种自我觉察，本身就是抵抗。`,furtherReading:[`《地狱一季》兰波`,`《野草》鲁迅`,`《祭沃尔夫·卡尔克罗伊德伯爵》里尔克`]},114:{context:`此句出自里尔克《祭沃尔夫·卡尔克罗伊德伯爵》（1907年）。里尔克在悼念友人时写下这首长诗，此句是全诗最广为流传的一行。这是里尔克对"胜利"与"挺住"最精炼的表达。`,analysis:`"有何胜利可言"是否定，"挺住意味着一切"是肯定。全句将"胜利"与"挺住"对立，暗示在生命面前，没有真正的"胜利"，只有"挺住"。这是对"成功学"的根本质疑——活着本身，就是最大的成就。`,crossReference:`与加缪"必须想象西西弗是幸福的"同属存在主义坚持。亦近于海明威"人可以被毁灭，但不能被打败"，同是不屈的精神。`,modernRelevance:`在"成功"被过度神化的时代，里尔克提醒我们：人生没有"胜利"，只有"挺住"。当你觉得自己"一事无成"时，能"挺住"就已经是"一切"。这是对庸常人生最大的温柔。`,furtherReading:[`《里尔克诗选》`,`《西西弗神话》加缪`,`《老人与海》海明威`]},115:{context:`此句出自里尔克《秋日》（1902年）。里尔克写秋日的孤独，此句是全诗的核心。这是里尔克"物诗"的代表作，以极简语言写存在之孤独。冯至的中文翻译被誉为"神译"。`,analysis:`"谁此刻没有房子"是物质的无根，"就不必建造"是放弃；"谁此刻孤独"是精神的孤独，"就永远孤独"是命运。全句将"此刻"与"永远"关联，暗示此刻的状态决定永恒。这是对"孤独"的终极肯定——不是要克服，而是要承受。`,crossReference:`与陈子昂"前不见古人，后不见来者"同属终极孤独。亦近于海德格尔"人是被抛入世界的"，同是存在的孤独。`,modernRelevance:`在"社交"被视为解药的时代，里尔克提醒我们：有些孤独是"永远"的，不必勉强治愈。接受"此刻孤独"，反而能找到内心的安宁。孤独不是缺陷，而是存在的本相。`,furtherReading:[`《里尔克诗选》`,`《登幽州台歌》陈子昂`,`《存在与时间》海德格尔`]},116:{context:`此句出自里尔克《杜伊诺哀歌》（1912-1922年）。这是里尔克最重要的作品，写于十年的精神危机中。此句以"认出风暴"与"怒吼相迎"，写面对命运的态度。这是里尔克"英雄式"的诗学宣言。`,analysis:`"认出"是觉察，"风暴"是命运，"怒吼着与你相迎"是态度。全句将"风暴"拟人化，与之"相迎"而非逃避。"怒吼"一词尤妙——不是恐惧，而是怒吼。这是对命运的主动拥抱，是尼采"命运之爱"的诗化。`,crossReference:`与海明威"人可以被毁灭，但不能被打败"同属英雄主义。亦近于尼采"命运之爱"，同是对命运的拥抱。`,modernRelevance:`在"避险"成为常态的时代，里尔克提醒我们：风暴不可避免，但"相迎"的方式可以选择。与其被动承受，不如"怒吼着相迎"。这种态度，不是鲁莽，而是对生命的极致投入。`,furtherReading:[`《杜伊诺哀歌》里尔克`,`《老人与海》海明威`,`《查拉图斯特拉如是说》尼采`]},117:{context:`此句出自叶芝《当你老了》（1893年）。叶芝以此诗献给心仪的茅德·冈，仿龙沙十四行诗体。这是叶芝最著名的情诗，也是英语文学最经典的"老去之爱"。全诗写一种超越青春的爱。`,analysis:`"当你老了"是假设，"头发花白""睡意沉沉""倦坐""慢慢读"是细节。全句以未来视角写当下的爱——我不只爱你青春的模样，更爱你老去后的安宁。这是对"青春崇拜"的反拨，是爱的成熟表达。`,crossReference:`与龙沙"当你老了，坐在烛光旁"同源（叶芝仿龙沙）。亦近于《诗经》"执子之手，与子偕老"，同是白头之约。`,modernRelevance:`在"颜值"主导的恋爱市场，叶芝提醒我们：真正的爱，是爱"老去"后的对方。当你能在心中想象对方"头发花白"的模样仍选择爱，那才是超越青春的、真正的爱。`,furtherReading:[`《叶芝诗选》`,`《龙沙十四行诗》`,`《诗经·击鼓》`]},118:{context:`此句出自叶芝《当你老了》，紧接"当你老了"。叶芝在诗中对比"众人"与"一人"的爱——众人爱青春，一人爱"朝圣者的灵魂"。这是叶芝对茅德·冈的深情告白，也是对爱的最高定义。`,analysis:`"多少人"是众，"一个人"是一；"青春欢畅"是外在，"朝圣者的灵魂"是内在；"假意或真心"是混杂，"一个人"是纯粹。全句以多重对比，将爱从外在美升华到内在灵魂。"朝圣者"一词尤妙——爱是神圣的旅程。`,crossReference:`与泰戈尔"心是旷野的鸟"同属灵魂之爱。亦近于但丁对贝雅特丽齐的爱，同是将爱精神化。`,modernRelevance:`在"看脸"的时代，叶芝提醒我们：爱"朝圣者的灵魂"，才是爱的最高形态。当你爱的人不再"青春欢畅"，你是否仍爱ta"朝圣者的灵魂"？这是对每一段关系的终极考验。`,furtherReading:[`《叶芝诗选》`,`《飞鸟集》泰戈尔`,`《神曲》但丁`]},119:{context:`此句出自叶芝《第二次降临》（1919年）。一战刚结束，叶芝目睹文明崩坏，写下此诗。"一切都四散了，再也保不住中心"是全诗最著名的诗句，道出了现代文明的核心困境——失序。`,analysis:`"四散"是状态，"保不住中心"是原因。"中心"一词多义——文明的中心、价值的中心、自我的中心。全句以极简语言，写出了现代性的核心体验：中心失序，万物四散。这是对"现代危机"最精准的诊断。`,crossReference:`与艾略特《荒原》"四月是最残忍的季节"同属现代危机表达。亦近于鲁迅"铁屋子"隐喻，同是对时代的诊断。`,modernRelevance:`在信息过载、价值多元的时代，我们都有"保不住中心"的体验。叶芝提醒我们：中心需要主动"保"，否则必然"四散"。在所有的喧嚣中，找到并守住自己的"中心"，是现代人的必修课。`,furtherReading:[`《叶芝诗选》`,`《荒原》艾略特`,`《野草》鲁迅`]},120:{context:`此句出自狄金森诗选。狄金森一生隐居，写诗1700余首，生前只发表7首。此句以"无名之辈"自居，是对"名人"文化的反讽。狄金森是美国文学最伟大的诗人之一，死后才被发现。`,analysis:`"我是无名之辈"是自贬也是自傲，"你是谁"是邀请。全句将"无名"与"名人"对立，暗示"成名"是"无聊"的——"做个名人多无聊啊！"。这是对"出名"的根本质疑，也是对"隐匿"的肯定。`,crossReference:`与陶渊明"不为五斗米折腰"同属隐逸精神。亦近于梭罗"我到林中去"，同是主动选择"无名"。`,modernRelevance:`在"流量"成为硬通货的时代，狄金森的"无名之辈"尤为刺心。我们拼命"出名"，却忘了"无名"的自由。狄金森提醒我们：有些伟大的灵魂，刻意选择"无名"——因为"有名"会打扰灵魂的宁静。`,furtherReading:[`《狄金森诗选》`,`《归园田居》陶渊明`,`《瓦尔登湖》梭罗`]},121:{context:`此句出自狄金森诗选。狄金森以"有羽毛的东西"喻希望，是文学中最独特的希望隐喻之一。全句以极简语言，写希望的脆弱与坚韧。`,analysis:`"有羽毛的东西"是具象，"栖息在灵魂上"是位置，"没有歌词的歌"是声音。全句将希望化为鸟，但不是高飞的鸟，而是"栖息"的鸟——希望不在远方，就在灵魂上。"没有歌词"尤妙——希望是纯粹的旋律，无需言语。`,crossReference:`与《圣经》"信是所望之事的实底"同属希望的定义。亦近于鲁迅"希望是本无所谓有"，同是对希望本质的思考。`,modernRelevance:`在"丧文化"盛行的时代，狄金森提醒我们：希望一直在"灵魂上"，只是有时我们听不见它的"歌"。"没有歌词"意味着希望不需要理由——它唱着，所以我们在。这是一种纯粹的存在性希望。`,furtherReading:[`《狄金森诗选》`,`《圣经·希伯来书》`,`《故乡》鲁迅`]},122:{context:`此句出自狄金森诗选。狄金森以"使一颗心免于哀伤"为人生意义，是对"不虚此生"最温柔的定义。这是狄金森最动人的诗句之一。`,analysis:`"如果我能"是假设，"使一颗心免于哀伤"是行动，"不虚此生"是意义。全句将人生意义归于"一颗心"——不必拯救世界，只需减轻一个人的痛苦。这是对"伟大"的反拨，是对"微小"的肯定。`,crossReference:`与特蕾莎修女"我们无法做伟大的事，只能用伟大的爱做小事"同属微小的善。亦近于鲁迅"有一分热，发一分光"，同是个体意义的肯定。`,modernRelevance:`在"改变世界"成为野心的时代，狄金森提醒我们："一颗心"就够了。如果你能让一个人少一点哀伤，这一生就没有虚度。这是对"意义"最温柔、最可行的定义。`,furtherReading:[`《狄金森诗选》`,`《特蕾莎修女箴言》`,`《鲁迅杂文选》`]},123:{context:`此句出自狄金森诗选。狄金森以"我自身是地狱"写内心的痛苦，是对"地狱"概念的内化。这与但丁的地狱不同——地狱不在彼岸，就在心中。`,analysis:`"我自身是地狱"是内化，"谁还能把我贬到更深的地方"是反诘。全句将"地狱"从外部移到内部，暗示最深的痛苦来自自身。"谁还能"三字尤为痛切——已经到了最深处，再无更深的可能。这是绝望的极致，也是绝望的极限。`,crossReference:`与萨特"他人即地狱"相反——狄金森认为"自身即地狱"。亦近于《哈姆雷特》"丹麦是一座监狱"，同是将痛苦内化。`,modernRelevance:`在抑郁、焦虑成为流行病的时代，狄金森的"我自身是地狱"道出了许多人的真实感受。但"谁还能把我贬到更深"也暗示一种奇异的解脱——已经到底，不会更糟。这是绝望中的微光。`,furtherReading:[`《狄金森诗选》`,`《禁闭》萨特`,`《哈姆雷特》莎士比亚`]},124:{context:`此句出自惠特曼《草叶集》（1855年）。惠特曼以此诗集开创了美国现代诗歌。此句以"矛盾"自许，是对"一致性"的反拨。这是惠特曼"自我"诗学的核心宣言。`,analysis:`"我自己即是矛盾"是承认，"但我无所谓"是态度。全句将"矛盾"从缺陷化为常态，暗示真正的人是复杂的、多面的。"无所谓"三字尤妙——不是"解决"矛盾，而是"容纳"矛盾。这是对"单一自我"的根本质疑。`,crossReference:`与惠特曼"我赞美我自己"同属自我肯定。亦近于蒙田"我描绘我自己"，同是对"复杂自我"的接纳。`,modernRelevance:`在"人设"要求一致性的时代，惠特曼提醒我们：人是"矛盾"的，不必勉强一致。你可以既勇敢又怯懦，既理性又感性。"无所谓"矛盾，才是完整的自我。`,furtherReading:[`《草叶集》惠特曼`,`《蒙田随笔》`,`《自我之歌》惠特曼`]},125:{context:`此句为《草叶集》"自我之歌"的开篇。惠特曼以此句奠定了美国诗歌"自我颂歌"的传统。这是"美国精神"的诗化宣言——自信、张扬、不羁。`,analysis:`"我赞美我自己"是自我肯定，"歌唱我自己"是自我表达。全句将"赞美"与"歌唱"并置，暗示自我肯定本身就是艺术。这是对"谦逊"的反拨，是对"自我价值"的极致肯定。惠特曼的"我"既是个人，也是"所有人"。`,crossReference:`与爱默生"相信自己"同属美国个人主义。亦近于李白"天生我材必有用"，同是自我肯定。`,modernRelevance:`在"谦虚"被推崇的时代，惠特曼的"我赞美我自己"显得张扬。但他提醒我们：真正的谦虚不是否定自我，而是诚实地肯定自我。能"赞美自己"的人，才能真诚地赞美他人。`,furtherReading:[`《草叶集》惠特曼`,`《论自立》爱默生`,`《将进酒》李白`]},126:{context:`此句出自《草叶集》"自我之歌"。惠特曼以"原子"喻人，写个体与普遍的连接。这是惠特曼"民主诗学"的核心——每个个体都包含所有人。`,analysis:`"属于我的原子"是个体，"也属于你"是普遍。全句以"原子"喻人，暗示最微观的也是最普遍的。这是对"个体"与"集体"的辩证——我不只是我，你也包含我。惠特曼的"我"是民主的"我"，包容所有人。`,crossReference:`与《庄子》"万物与我为一"同属万物一体。亦近于佛家"一即一切，一切即一"，同是微观与普遍的辩证。`,modernRelevance:`在"个人主义"与"集体主义"对立的时代，惠特曼给出了第三种答案："我的原子也属于你"。个体与普遍不是对立，而是相通。这种"连接的诗学"，是化解分裂的良方。`,furtherReading:[`《草叶集》惠特曼`,`《齐物论》庄子`,`《华严经》`]},127:{context:`此句出自雪莱《西风颂》（1819年）。雪莱以"西风"喻革命力量，此句为全诗结尾，是最广为流传的诗句。这是浪漫主义对"未来"最乐观的表达。`,analysis:`"冬天来了"是现状的困难，"春天还会远吗"是未来的希望。全句以季节循环喻历史进程，暗示困难之后必有新生。这是对"进步"的信仰——历史是螺旋上升的。雪莱的乐观不是天真，而是基于对规律的洞察。`,crossReference:`与《道德经》"反者道之动"同属循环哲学。亦近于雪莱"诗人是未被承认的世界立法者"，同是浪漫主义的进步信念。`,modernRelevance:`在"至暗时刻"，雪莱这句话是永恒的慰藉。无论是个人低谷还是社会危机，"冬天"之后必有"春天"。但雪莱也暗示："春天"不会自动到来，需要"西风"（行动）的推动。`,furtherReading:[`《雪莱诗选》`,`《道德经》`,`《解放了的普罗米修斯》雪莱`]},128:{context:`此句出自济慈《希腊古瓮颂》（1819年）。济慈面对一只古希腊陶瓮，思考"美"与"真"的关系。这是济慈"唯美主义"的核心命题，也是西方美学的经典命题。`,analysis:`"美即是真"是等同，"真即是美"是反证。全句将"美"与"真"互为定义，暗示真正的美蕴含真理，真正的真呈现为美。这是对"美"的本体论提升——美不是装饰，而是真理的显现。济慈以此完成了浪漫主义美学的闭环。`,crossReference:`与柏拉图"美是真的光辉"同源。亦近于王尔德"生活模仿艺术"，同是将美与真关联。`,modernRelevance:`在"美"被简化为"颜值"的时代，济慈提醒我们：真正的"美"是"真"的显现。当你被一首诗、一幅画、一首音乐深深打动，那是"真"通过"美"向你显现。美不是表面的，而是最深的真实。`,furtherReading:[`《济慈诗选》`,`《会饮篇》柏拉图`,`《意图》王尔德`]},129:{context:`此句出自拜伦《她走在美的光彩中》（1814年）。拜伦以"无云的夜空"喻美人，是浪漫主义诗歌的典范。这是拜伦最著名的抒情诗之一。`,analysis:`"走在美的光彩中"是动态，"像无云的夜空"是比喻，"繁星闪烁"是细节。全句以"夜空"喻美，将美从"明亮"转向"深邃"——不是耀眼的美，而是星辰般的静谧之美。这是对"美"的重新定义。`,crossReference:`与《诗经》"巧笑倩兮，美目盼兮"同属女性美赞歌。亦近于苏轼"淡妆浓抹总相宜"，同是对美的捕捉。`,modernRelevance:`在"白瘦幼"审美单一的时代，拜伦提醒我们：美可以是"夜空"般的——深邃、静谧、星光点点。不必是耀眼的白昼美，也可以是沉静的夜空美。美的形态，远比流行标准丰富。`,furtherReading:[`《拜伦诗选》`,`《诗经·卫风》`,`《饮湖上初晴后雨》苏轼`]},130:{context:`此句出自叶芝诗选。叶芝以"谁讲过这些话"写一种寻找与确认。这是叶芝对"真理"或"灵魂伴侣"的寻找——谁是"我所寻找的人"。`,analysis:`"谁讲过这些话"是追溯，"谁就是我所寻找的人"是确认。全句将"讲过的话"化为寻找的线索，暗示灵魂的共鸣通过语言发生。这是对"知音"的诗化表达——当你听见"这些话"，你就找到了"那个人"。`,crossReference:`与辛弃疾"众里寻他千百度"同属寻找。亦近于伯牙子期"高山流水"，同是知音的寻找。`,modernRelevance:`在"匹配"被算法化的时代，叶芝提醒我们：真正的寻找，不是条件匹配，而是"讲过的话"——灵魂的语言。当你听见一个人说的话，心想"这就是我一直在找的"，那才是真正的相遇。`,furtherReading:[`《叶芝诗选》`,`《青玉案·元夕》辛弃疾`,`《列子·汤问》`]},131:{context:`出自莎士比亚《哈姆雷特》第三幕第一场（约1600年）。这是世界文学最著名的独白之一，哈姆雷特在剧中思考"生存还是毁灭"。原句以英语写成，其语言本身的节奏与韵律构成了独特的力量。`,analysis:`"To be"是存在，"or not to be"是虚无，"that is the question"是追问。全句以最简单的词汇，触及最根本的哲学问题。英语原句的节奏感——"be"与"be"的对仗，"question"的余韵——使其成为英语世界最深刻的格言。这是语言哲学的极致。`,crossReference:`与加缪"真正严肃的哲学问题只有一个，那就是自杀"同属存在追问。亦近于屈原"宁溘死以流亡兮"，同是生死的抉择。`,modernRelevance:`在现代生活的"活着"与"不活"之间，我们每天都在做微小的"to be or not to be"——是坚持还是放弃，是真实还是虚伪。哈姆雷特提醒我们：这个"question"永远在场，需要时时直面。`,furtherReading:[`《哈姆雷特》莎士比亚`,`《西西弗神话》加缪`,`《离骚》屈原`]},132:{context:`此句为《哈姆雷特》"To be, or not to be"的中文翻译（朱生豪译本）。翻译让这句话进入中文世界，成为中文读者最熟悉的莎士比亚台词。翻译本身就是一次再创造。`,analysis:`"生存"与"毁灭"对举，比英文的"be"与"not be"更具象。"值得考虑的问题"将"question"中文化，带上了理性的色彩。翻译让这句话从英语的节奏美，转为中文的思辨美。朱生豪的翻译，本身就是文学。`,crossReference:`与司马迁"人固有一死，或重于泰山，或轻于鸿毛"同属生死抉择。亦近于鲁迅"绝望之于虚妄"，同是对"活"的追问。`,modernRelevance:`在中文世界，"生存还是毁灭"已成为日常用语。但它的分量不该被熟悉消解。当面临重大抉择——辞职、分手、理想与现实的冲突——这句话提醒我们：这是"值得考虑的问题"，不是小事。`,furtherReading:[`《哈姆雷特》莎士比亚（朱生豪译）`,`《报任安书》司马迁`,`《野草》鲁迅`]},133:{context:`此句出自莎士比亚《哈姆雷特》第二幕第二场。波洛涅斯向国王王后汇报时，啰嗦冗长，却说出了这句关于"简洁"的格言。这是莎士比亚的妙笔——让最啰嗦的人说出"简洁"的真理。`,analysis:`"简洁"与"智慧"关联，"冗长"与"肤浅"关联。全句将文风与思维深度等同，暗示真正深刻的思想必然简洁。这是对"啰嗦"的最优雅讽刺——由一个啰嗦角色说出，更增反讽。莎士比亚的智慧，在于让"简洁"本身成为示范。`,crossReference:`与契诃夫"简洁是天才的姐妹"同属简洁美学。亦近于《文心雕龙》"句有可削，足见其疏"，同是主张精炼。`,modernRelevance:`在PPT文化、长文泛滥的时代，"简洁"是稀缺品。莎士比亚提醒我们：能用一句话说清的，不要用十句。简洁不仅是文风，更是思维的清晰——只有想清楚，才能写简洁。`,furtherReading:[`《哈姆雷特》莎士比亚`,`《契诃夫书信集》`,`《文心雕龙》刘勰`]},134:{context:`此句出自莎士比亚《暴风雨》（约1611年）第一幕第二场。米兰公爵普洛斯彼罗被弟弟篡位流亡荒岛，他对女儿米兰达说：过去之事皆为序章。这是莎士比亚晚期对"过去"与"未来"关系的洞察。`,analysis:`"凡是过去"是全部的历史，"皆为序章"是全部的重新定义。全句将"过去"从"终结"化为"开始"，暗示真正的故事在"过去"之后才开始。这是对"过去"的解放——过去不是枷锁，而是序章。莎士比亚晚期作品的成熟智慧。`,crossReference:`与《论语》"成事不说，遂事不谏，既往不咎"同属对过去的态度。亦近于普鲁斯特"重新找到的时光"，同是过去与未来的辩证。`,modernRelevance:`在被"过去"困住的时代——过去的失败、创伤、遗憾——莎士比亚提醒我们：过去只是"序章"，真正的故事还在后面。这种"序章意识"，是面向未来的最大解放。`,furtherReading:[`《暴风雨》莎士比亚`,`《论语·八佾》`,`《追忆似水年华》普鲁斯特`]},135:{context:`此句为简·奥斯汀《傲慢与偏见》（1813年）的开篇，是英国文学最著名的开篇之一。奥斯汀以反讽口吻，道出了当时社会的婚姻本质。这部小说被誉为"最完美的英国小说"。`,analysis:`"凡是有钱的单身汉"是对象，"总想娶位太太"是需求，"举世公认的真理"是反讽。奥斯汀以"真理"二字制造反讽——这不是"真理"，而是"社会偏见"。全句奠定了全书反讽基调，也揭示了婚姻的经济本质。`,crossReference:`与曹雪芹"都道是金玉良姻"同属对婚姻的冷眼。亦近于张爱玲"婚姻是长期的卖淫"（更尖锐），同是对婚姻现实的揭示。`,modernRelevance:`在"门当户对"回归、相亲市场繁荣的时代，奥斯汀的"真理"依然刺心。200年前的反讽，今天读来仍是现实。当我们评估"条件"时，是否意识到自己也在"举世公认的真理"之中？`,further
