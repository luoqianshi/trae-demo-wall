<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>华夏战纪 - 五千年战争史诗</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@300;500;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:'Noto Sans SC',sans-serif;color:#fff;user-select:none}
canvas{display:block;pointer-events:none}
#ui-overlay{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
#ui-overlay>*{pointer-events:auto}
/* ===== 主菜单 ===== */
#main-menu{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
background:linear-gradient(180deg,rgba(20,5,0,0.95),rgba(60,20,0,0.85),rgba(20,5,0,0.95));
background-image:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><text x="10" y="60" font-size="50" fill="rgba(180,120,40,0.03)">战</text></svg>')}
#main-menu h1{font-family:'Ma Shan Zheng',cursive;font-size:72px;color:#d4a24e;text-shadow:0 0 40px rgba(212,162,78,0.6),0 4px 8px rgba(0,0,0,0.8);
margin-bottom:8px;letter-spacing:12px;animation:titleGlow 3s ease-in-out infinite}
#main-menu .subtitle{font-size:20px;color:#c4956a;margin-bottom:40px;letter-spacing:6px;font-weight:300}
@keyframes titleGlow{0%,100%{text-shadow:0 0 40px rgba(212,162,78,0.6),0 4px 8px rgba(0,0,0,0.8)}50%{text-shadow:0 0 60px rgba(212,162,78,0.9),0 4px 12px rgba(0,0,0,0.8),0 0 100px rgba(212,162,78,0.3)}}
.menu-btn{position:relative;z-index:20;background:linear-gradient(135deg,rgba(180,120,40,0.2),rgba(120,60,10,0.3));border:1px solid rgba(212,162,78,0.5);
color:#d4a24e;padding:14px 60px;font-size:18px;font-family:'Noto Sans SC',sans-serif;cursor:pointer;margin:8px;border-radius:4px;
transition:all .3s;letter-spacing:4px;min-width:260px}
.menu-btn:hover{background:linear-gradient(135deg,rgba(212,162,78,0.4),rgba(180,120,40,0.5));
border-color:#d4a24e;transform:scale(1.05);box-shadow:0 0 20px rgba(212,162,78,0.3)}
/* ===== 关卡选择 ===== */
#level-select{position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;align-items:center;
background:linear-gradient(180deg,rgba(15,5,0,0.97),rgba(40,15,0,0.95));padding:30px;overflow-y:auto}
#level-select h2{font-family:'Ma Shan Zheng',cursive;font-size:36px;color:#d4a24e;margin:20px 0;letter-spacing:8px}
#level-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;width:100%;max-width:1200px;padding:20px}
.level-card{background:linear-gradient(145deg,rgba(60,30,10,0.8),rgba(30,15,5,0.9));border:1px solid rgba(212,162,78,0.3);
border-radius:8px;padding:20px;cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
.level-card:hover{border-color:#d4a24e;transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,0.5),0 0 16px rgba(212,162,78,0.2)}
.level-card.locked{opacity:0.4;cursor:not-allowed}
.level-card.completed{border-color:rgba(80,200,120,0.6)}
.level-card.completed::after{content:'✓';position:absolute;top:10px;right:10px;color:#4CAF50;font-size:24px;font-weight:bold}
.level-num{font-size:14px;color:#c4956a;margin-bottom:6px}
.level-name{font-family:'Ma Shan Zheng',cursive;font-size:22px;color:#d4a24e;margin-bottom:8px}
.level-type{font-size:12px;padding:3px 10px;border-radius:10px;display:inline-block}
.type-naval{background:rgba(30,100,200,0.3);color:#6ab4ff;border:1px solid rgba(30,100,200,0.5)}
.type-land{background:rgba(80,160,60,0.3);color:#8fdc6a;border:1px solid rgba(80,160,60,0.5)}
.type-defense{background:rgba(200,160,40,0.3);color:#ffc84a;border:1px solid rgba(200,160,40,0.5)}
.level-era{font-size:12px;color:#a08060;margin-top:8px}
.back-btn{position:absolute;top:20px;left:20px;background:rgba(60,30,10,0.8);border:1px solid rgba(212,162,78,0.4);
color:#d4a24e;padding:10px 24px;cursor:pointer;border-radius:4px;font-size:14px;font-family:'Noto Sans SC',sans-serif;transition:all .3s;z-index:20}
.back-btn:hover{background:rgba(212,162,78,0.3);border-color:#d4a24e}
/* ===== 战斗UI ===== */
#battle-ui{position:absolute;top:0;left:0;width:100%;height:100%;display:none;pointer-events:none}
#battle-hud-top{position:absolute;top:0;left:0;width:100%;padding:16px 24px;display:flex;justify-content:space-between;align-items:flex-start;
background:linear-gradient(180deg,rgba(0,0,0,0.6),transparent);pointer-events:auto}
.hud-info{text-align:center}
.hud-label{font-size:11px;color:#a08060;letter-spacing:2px}
.hud-value{font-size:20px;color:#d4a24e;font-weight:700}
#battle-hud-bottom{position:absolute;bottom:0;left:0;width:100%;padding:16px 24px;
background:linear-gradient(0deg,rgba(0,0,0,0.7),transparent);pointer-events:auto;display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
.unit-btn{background:linear-gradient(135deg,rgba(80,40,10,0.8),rgba(50,25,5,0.9));border:1px solid rgba(212,162,78,0.4);
color:#d4a24e;padding:12px 20px;cursor:pointer;border-radius:6px;font-family:'Noto Sans SC',sans-serif;font-size:13px;transition:all .3s;min-width:100px;text-align:center}
.unit-btn:hover{border-color:#d4a24e;background:rgba(212,162,78,0.2);transform:scale(1.05)}
.unit-btn.selected{border-color:#ffc84a;background:rgba(212,162,78,0.3);box-shadow:0 0 12px rgba(212,162,78,0.3)}
.unit-cost{font-size:10px;color:#c4956a;display:block;margin-top:2px}
#resource-bar{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);
background:rgba(0,0,0,0.6);border:1px solid rgba(212,162,78,0.3);border-radius:20px;padding:6px 20px;
font-size:14px;color:#d4a24e;white-space:nowrap;pointer-events:auto}
#pause-btn{position:absolute;top:16px;right:24px;background:rgba(60,30,10,0.8);border:1px solid rgba(212,162,78,0.4);
color:#d4a24e;width:40px;height:40px;cursor:pointer;border-radius:4px;font-size:18px;pointer-events:auto}
/* ===== 过场动画 ===== */
#cutscene{position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;
background:rgba(0,0,0,0.92);z-index:30}
#cutscene .era-title{font-family:'Ma Shan Zheng',cursive;font-size:48px;color:#d4a24e;margin-bottom:10px;animation:fadeInUp 1s ease}
#cutscene .era-period{font-size:18px;color:#c4956a;margin-bottom:30px;letter-spacing:4px;animation:fadeInUp 1s ease .2s both}
#cutscene .story-text{max-width:700px;text-align:center;font-size:16px;line-height:2;color:#e8d5b8;animation:fadeInUp 1s ease .5s both}
#cutscene .skip-hint{position:absolute;bottom:30px;font-size:12px;color:#605040;letter-spacing:2px;animation:fadeInUp 1s ease 1s both}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
/* ===== 结算画面 ===== */
#result-screen{position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;
background:rgba(0,0,0,0.9);z-index:35}
#result-screen h2{font-family:'Ma Shan Zheng',cursive;font-size:56px;margin-bottom:20px}
.victory{color:#4CAF50}
.defeat{color:#e74c3c}
#result-screen .result-text{font-size:16px;color:#e8d5b8;text-align:center;max-width:600px;line-height:1.8;margin-bottom:30px}
/* ===== 新中国成立特殊画面 ===== */
#new-china-screen{position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;
background:linear-gradient(180deg,rgba(180,20,20,0.9),rgba(200,40,0,0.85));z-index:40}
#new-china-screen h1{font-family:'Ma Shan Zheng',cursive;font-size:64px;color:#FFD700;text-shadow:0 0 40px rgba(255,215,0,0.5);
animation:titleGlow 2s ease-in-out infinite;margin-bottom:20px}
#new-china-screen p{font-size:20px;color:#fff;text-align:center;max-width:600px;line-height:2;margin-bottom:20px}
/* ===== 下一款预告 ===== */
#next-game-banner{position:absolute;bottom:20px;right:20px;background:linear-gradient(135deg,rgba(180,40,20,0.8),rgba(120,20,10,0.9));
border:1px solid rgba(255,100,50,0.5);border-radius:8px;padding:16px 20px;max-width:280px;z-index:25;pointer-events:auto}
#next-game-banner h4{color:#ffa040;font-size:14px;margin-bottom:6px}
#next-game-banner p{color:#e8c0a0;font-size:12px;line-height:1.6}
/* ===== Toast提示 ===== */
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:rgba(60,30,10,0.9);border:1px solid rgba(212,162,78,0.5);
color:#d4a24e;padding:12px 30px;border-radius:6px;font-size:14px;z-index:100;animation:toastIn .5s ease;pointer-events:none}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
/* ===== 滚动条 ===== */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:rgba(30,15,5,0.5)}
::-webkit-scrollbar-thumb{background:rgba(212,162,78,0.4);border-radius:3px}
</style>
</head>
<body>
<canvas id="game-canvas"></canvas>
<div id="ui-overlay">
<!-- 主菜单 -->
<div id="main-menu">
<h1>华夏战纪</h1>
<div class="subtitle">上下五千年 · 战争史诗</div>
<button class="menu-btn" onclick="showLevelSelect()">开 始 战 役</button>
<button class="menu-btn" onclick="showIntro()">游戏介绍</button>
<div style="margin-top:40px;font-size:12px;color:#605040;letter-spacing:2px">
<p>横跨清末 · 民国 · 抗日战争</p>
<p style="margin-top:6px">21场史诗战役 · 等你来战</p>
</div>
</div>

<!-- 关卡选择 -->
<div id="level-select">
<button class="back-btn" onclick="showMainMenu()">◀ 返回</button>
<h2>战役选择</h2>
<div id="level-grid"></div>
</div>

<!-- 战斗UI -->
<div id="battle-ui">
<div id="battle-hud-top">
<div class="hud-info"><div class="hud-label">波次</div><div class="hud-value" id="wave-num">1/3</div></div>
<div class="hud-info"><div class="hud-label" id="level-title-hud">战役名称</div></div>
<div class="hud-info"><div class="hud-label">敌军</div><div class="hud-value" id="enemy-count">0</div></div>
</div>
<div id="resource-bar">粮草: <span id="resource-val">500</span></div>
<div id="battle-hud-bottom"></div>
<button id="pause-btn" onclick="togglePause()">⏸</button>
</div>

<!-- 过场 -->
<div id="cutscene">
<div class="era-title" id="cut-title"></div>
<div class="era-period" id="cut-period"></div>
<div class="story-text" id="cut-story"></div>
<div class="skip-hint">点击任意处继续</div>
</div>

<!-- 结算 -->
<div id="result-screen">
<h2 id="result-title"></h2>
<div class="result-text" id="result-text"></div>
<button class="menu-btn" onclick="nextLevel()" id="next-level-btn">下一关</button>
<button class="menu-btn" onclick="backToLevels()">返回选关</button>
</div>

<!-- 新中国成立 -->
<div id="new-china-screen">
<h1>中华人民共和国成立</h1>
<p>一九四九年十月一日，毛泽东主席在天安门城楼上庄严宣告：<br><br>"中华人民共和国中央人民政府今天成立了！"</p>
<p style="color:#FFD700;font-size:24px;margin-top:10px">中国人民从此站起来了！</p>
<button class="menu-btn" style="margin-top:30px;border-color:rgba(255,215,0,0.6)" onclick="closeNewChina()">继续</button>
</div>

<!-- 下一款预告 -->
<div id="next-game-banner" style="display:none">
<h4>🔥 下一款即将上线</h4>
<p>全新战役篇章即将开启！<br>上线时间：7月31日<br>敬请期待更多精彩历史战役...</p>
</div>
</div>

<!-- Three.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== 游戏配置 =====
const LEVELS = [
  {id:1,name:"牧野之战",era:"公元前1046年",dynasty:"西周",type:"land",
   desc:"周武王率诸侯联军讨伐商纣王，于牧野展开决战。商军倒戈，周朝建立，开启了中国历史上第一个有详细文字记载的王朝更替。",
   enemyWaves:3,enemyPerWave:8,resStart:400},
  {id:2,name:"长平之战",era:"公元前260年",dynasty:"战国",type:"land",

  {id:3,name:"巨鹿之战",era:"公元前207年",dynasty:"秦末",type:"land",

   enemyWaves:3,enemyPerWave:12,resStart:300},
  {id:4,name:"赤壁之战",era:"公元208年",dynasty:"三国",type:"naval",

  {id:5,name:"淝水之战",era:"公元383年",dynasty:"东晋",type:"land",

  {id:6,name:"虎牢关之战",era:"公元621年",dynasty:"唐朝",type:"defense",

  {id:7,name:"长安保卫战",era:"公元756年",dynasty:"唐朝",type:"defense",

  {id:8,name:"鄱阳湖水战",era:"公元1363年",dynasty:"元末",type:"naval",

   enemyWaves:4,enemyPerWave:9,resStart:450},
  {id:9,name:"土木堡之变",era:"公元1449年",dynasty:"明朝",type:"land",

   enemyWaves:3,enemyPerWave:10,resStart:350},
  {id:10,name:"台州抗倭",era:"公元1561年",dynasty:"明朝",type:"defense",

  {id:11,name:"萨尔浒之战",era:"公元1619年",dynasty:"明朝/后金",type:"land",
   desc:'努尔哈赤以\u201c凭尔几路来，我只一路去\u201d之策，集中兵力各个击破明军四路大军，后金从此崛起。',

  {id:12,name:"雅克萨之战",era:"公元1685年",dynasty:"清朝",type:"defense",
   desc:"康熙帝派遣清军围攻沙俄占领的雅克萨城，两次围城迫使沙俄签订《尼布楚条约》，确立了中俄东段边界。",

  {id:13,name:"鸦片战争",era:"公元1840年",dynasty:"清朝末期",type:"naval",

// ===== 游戏状态 =====
let gameState = {
  screen:'menu', currentLevel:null, paused:false,
  resources:500, wave:1, enemiesAlive:0, totalEnemies:0,
  selectedUnit:null, playerUnits:[], enemyUnits:[], particles:[],
  completedLevels: JSON.parse(localStorage.getItem('completedLevels')||'[]'),

// ===== Three.js 引擎 =====
let scene, camera, renderer, clock;
let terrain, waterPlane, cityGroup;
let ambientLight, dirLight;

function initThree(){
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
  renderer = new THREE.WebGLRenderer({canvas:document.getElementById('game-canvas'), antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  clock = new THREE.Clock();

  ambientLight = new THREE.AmbientLight(0x8899aa, 0.5);
  scene.add(ambientLight);
  dirLight = new THREE.DirectionalLight(0xffeedd, 0.8);
  dirLight.position.set(50, 80, 50);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.width = 2048;
  dirLight.shadow.mapSize.height = 2048;
  scene.add(dirLight);

  window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
}

function animate(){
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  if(gameState.screen==='battle' && !gameState.paused){
    updateBattle(delta);
    updateParticles(delta);
  }
  if(waterPlane) animateWater(delta);
  renderer.render(scene, camera);
}

// ===== 场景构建 =====
function clearScene(){
  while(scene.children.length > 0){
    const obj = scene.children[0];
    if(obj.geometry) obj.geometry.dispose();
    if(obj.material){
      if(Array.isArray(obj.material)) obj.material.forEach(m=>m.dispose());
      else obj.material.dispose();
    }
    scene.remove(obj);
  }
  scene.add(ambientLight);
  scene.add(dirLight);
  waterPlane = null; terrain = null; cityGroup = null;
  gameState.playerUnits = [];
  gameState.enemyUnits = [];
  gameState.particles = [];
}

function buildBattleScene(level){
  clearScene();
  const levelData = LEVELS.find(l=>l.id===level);
  gameState.currentLevel = levelData;
  gameState.resources = levelData.resStart;
  gameState.wave = 1;
  gameState.enemiesAlive = 0;
  gameState.totalEnemies = 0;
  gameState.paused = false;
  gameState.selectedUnit = null;

  // 雾
  scene.fog = new THREE.FogExp2(levelData.type==='naval'?0x1a3050:0x2a1a10, 0.008);

  // 天空色
  if(levelData.type==='naval'){
    scene.background = new THREE.Color(0x1a3050);
    ambientLight.color.set(0x6688aa);
    ambientLight.intensity = 0.6;
  } else if(levelData.dynasty==='抗日战争'){
    scene.background = new THREE.Color(0x4a2020);
    ambientLight.color.set(0xaa6655);
    ambientLight.intensity = 0.5;
  } else {
    scene.background = new THREE.Color(0x2a1a10);
    ambientLight.color.set(0x8899aa);
    ambientLight.intensity = 0.5;
  }

  if(levelData.type==='naval') buildNavalScene();
  else if(levelData.type==='defense') buildDefenseScene();
  else buildLandScene();

  // 相机
  camera.position.set(0, 40, 50);
  camera.lookAt(0, 0, 0);

  // 生成敌方波次
  spawnWave(1);
}

function buildNavalScene(){
  // 海面
  const waterGeo = new THREE.PlaneGeometry(120, 120, 80, 80);
  const waterMat = new THREE.MeshPhongMaterial({
    color:0x1a6090, transparent:true, opacity:0.85,
    shininess:100, specular:0x4488aa
  });
  waterPlane = new THREE.Mesh(waterGeo, waterMat);
  waterPlane.rotation.x = -Math.PI/2;
  waterPlane.receiveShadow = true;
  scene.add(waterPlane);

  // 波浪初始
  const pos = waterPlane.geometry.attributes.position;
  for(let i=0;i<pos.count;i++){
    pos.setZ(i, Math.random()*0.5);
  }
  waterPlane.geometry.attributes.position.needsUpdate = true;

  // 远山
  for(let i=0;i<8;i++){
    const mtn = new THREE.Mesh(
      new THREE.ConeGeometry(8+Math.random()*12, 15+Math.random()*20, 6),
      new THREE.MeshPhongMaterial({color:0x2a4a3a})
    );
    mtn.position.set(-50+i*14, 5, -55);
    scene.add(mtn);

}

function buildLandScene(){
  // 地面
  const groundGeo = new THREE.PlaneGeometry(120, 120, 40, 40);
  const pos = groundGeo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x = pos.getX(i), y = pos.getY(i);
    pos.setZ(i, Math.sin(x*0.1)*Math.cos(y*0.1)*2 + Math.random()*0.5);
  }
  groundGeo.computeVertexNormals();
  const groundMat = new THREE.MeshPhongMaterial({color:0x4a7a3a, flatShading:true});
  terrain = new THREE.Mesh(groundGeo, groundMat);
  terrain.rotation.x = -Math.PI/2;
  terrain.receiveShadow = true;
  scene.add(terrain);

  // 树木
  for(let i=0;i<40;i++){
    const tree = createTree();
    tree.position.set(-50+Math.random()*100, 0, -50+Math.random()*100);
    if(Math.abs(tree.position.x)<20 && Math.abs(tree.position.z)<20) continue;
    scene.add(tree);
  }

  // 石头
  for(let i=0;i<15;i++){
    const rock = new THREE.Mesh(
      new THREE.DodecahedronGeometry(1+Math.random()*2, 0),
      new THREE.MeshPhongMaterial({color:0x666655})
    );
    rock.position.set(-40+Math.random()*80, 0.5, -40+Math.random()*80);
    rock.rotation.set(Math.random(), Math.random(), Math.random());
    rock.castShadow = true;
    scene.add(rock);
  }
}

// ===== 水面动画 =====
function animateWater(delta){
  const time = clock.elapsedTime;
  const pos = waterPlane.geometry.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x = pos.getX(i), y = pos.getY(i);
    pos.setZ(i, Math.sin(x*0.15+time)*Math.cos(y*0.15+time*0.8)*0.8);
  }
  pos.needsUpdate = true;
  waterPlane.geometry.computeVertexNormals();
}

// ===== 单位系统 =====

      ));
      group.children[0].position.y = 0.6;
      // 头
      group.add(new THREE.Mesh(
        new THREE.SphereGeometry(0.25, 8, 8),
        new THREE.MeshPhongMaterial({color:0xddbb99})
      ));
      group.children[1].position.y = 1.45;
      cost = 30;

    case 'archer':

        new THREE.CylinderGeometry(0.25, 0.3, 1.1, 8),
        new THREE.MeshPhongMaterial({color:isEnemy?0xaa2222:0x2266aa})
      ));
      group.children[0].position.y = 0.55;
      group.add(new THREE.Mesh(
        new THREE.SphereGeometry(0.22, 8, 8),
        new THREE.MeshPhongMaterial({color:0xddbb99})
      ));
      group.children[1].position.y = 1.3;
      cost = 50;
      break;
    case 'cavalry':
      hp=50; attack=10; range=2; speed=5;
      // 马
      const horseBody = new THREE.Mesh(
        new THREE.BoxGeometry(0.8, 0.6, 1.6),
        new THREE.MeshPhongMaterial({color:isEnemy?0x882222:0x224488})
      );
      horseBody.position.y = 0.7;
      group.add(horseBody);
      // 马腿
      for(let lx of [-0.3,0.3]) for(let lz of [-0.5,0.5]){
        const leg = new THREE.Mesh(
          new THREE.CylinderGeometry(0.06, 0.06, 0.6, 6),
          new THREE.MeshPhongMaterial({color:0x554433})
        );
        leg.position.set(lx, 0.3, lz);
        group.add(leg);
      }
      // 骑手
      group.add(new THREE.Mesh(
        new THREE.CylinderGeometry(0.2, 0.25, 0.8, 8),
        new THREE.MeshPhongMaterial({color:isEnemy?enemyColor:playerColor})
      ));

    case 'ship':

// ===== 波次系统 =====
function spawnWave(waveNum){
  const levelData = gameState.currentLevel;
  const count = levelData.enemyPerWave + (waveNum-1)*2;
  gameState.enemiesAlive += count;
  gameState.totalEnemies += count;
  updateHUD();

  const types = ['soldier'];
  if(levelData.type==='naval') types.push('ship');
  if(levelData.type==='defense') types.push('catapult', 'archer');
  if(levelData.type==='land' && waveNum>=2) types.push('cavalry', 'archer');

  for(let i=0;i<count;i++){
    const type = types[Math.floor(Math.random()*types.length)];
    let pos;
    const angle = Math.random()*Math.PI*2;
    const dist = 30 + Math.random()*15;
    if(levelData.type==='defense'){
      // 敌人从城外进攻
      pos = new THREE.Vector3(Math.cos(angle)*dist, levelData.type==='naval'?0:0.6, Math.sin(angle)*dist);
    } else {
      pos = new THREE.Vector3(-40+Math.random()*20, levelData.type==='naval'?0.4:0.6, -40+Math.random()*20);
    }
    const enemy = createUnit(type, true, pos);
    enemy.targetPos = new THREE.Vector3(
      -10+Math.random()*20,
      levelData.type==='naval'?0.4:0.6,
      -10+Math.random()*20
    );
    gameState.enemyUnits.push(enemy);
    scene.add(enemy.mesh);
  }

  showToast(`第 ${waveNum}/${levelData.enemyWaves} 波敌军来袭！`);
  speak(`第${waveNum}波敌军来袭，准备战斗！`);
}

// ===== 战斗更新 =====
function updateBattle(delta){
  // 更新玩家单位 - 寻找并攻击敌人
  gameState.playerUnits.forEach(unit=>{
    if(!unit.alive) return;
    let nearestEnemy = null, nearestDist = Infinity;
    gameState.enemyUnits.forEach(e=>{
      if(!e.alive) return;
      const d = unit.mesh.position.distanceTo(e.mesh.position);
      if(d<nearestDist){nearestDist=d;nearestEnemy=e;}
    });
    if(nearestEnemy && nearestDist <= unit.range){
      // 攻击
      unit.attackTimer -= delta;
      if(unit.attackTimer<=0){
        nearestEnemy.hp -= unit.attack;
        unit.attackTimer = 1;
        // 创建攻击效果
        createAttackEffect(unit.mesh.position, nearestEnemy.mesh.position);
        if(nearestEnemy.hp<=0) killUnit(nearestEnemy);
      }
    } else if(nearestEnemy) {
      // 移动向敌人
      const dir = nearestEnemy.mesh.position.clone().sub(unit.mesh.position).normalize();
      unit.mesh.position.add(dir.multiplyScalar(unit.speed*delta));
      // 朝向
      unit.mesh.lookAt(nearestEnemy.mesh.position);
    }
    // 浮动动画
    unit.mesh.position.y += Math.sin(clock.elapsedTime*2+unit.mesh.id)*0.002;
  });

  // 更新敌人单位
  gameState.enemyUnits.forEach(unit=>{
    if(!unit.alive) return;
    let nearestPlayer = null, nearestDist = Infinity;
    gameState.playerUnits.forEach(p=>{
      if(!p.alive) return;
      const d = unit.mesh.position.distanceTo(p.mesh.position);
      if(d<nearestDist){nearestDist=d;nearestPlayer=p;}
    });
    if(nearestPlayer && nearestDist <= unit.range){
      unit.attackTimer -= delta;
      if(unit.attackTimer<=0){
        nearestPlayer.hp -= unit.attack;
        unit.attackTimer = 1.2;
        createAttackEffect(unit.mesh.position, nearestPlayer.mesh.position, true);
        if(nearestPlayer.hp<=0) killUnit(nearestPlayer);
      }
    } else if(nearestPlayer) {
      const dir = nearestPlayer.mesh.position.clone().sub(unit.mesh.position).normalize();
      unit.mesh.position.add(dir.multiplyScalar(unit.speed*delta));
      unit.mesh.lookAt(nearestPlayer.mesh.position);
    } else if(unit.targetPos){
      // 向目标点移动
      const dir = unit.targetPos.clone().sub(unit.mesh.position);
      if(dir.length()>1) {
        dir.normalize();
        unit.mesh.position.add(dir.multiplyScalar(unit.speed*delta));
      }
    }
    unit.mesh.position.y += Math.sin(clock.elapsedTime*1.5+unit.mesh.id)*0.001;
  });

  // 清理死亡单位
  gameState.playerUnits = gameState.playerUnits.filter(u=>u.alive);
  gameState.enemyUnits = gameState.enemyUnits.filter(u=>u.alive);

  // 检查波次
  if(gameState.enemiesAlive<=0){
    if(gameState.wave < gameState.currentLevel.enemyWaves){
      gameState.wave++;
      setTimeout(()=>spawnWave(gameState.wave), 2000);
    } else {
      // 胜利！
      setTimeout(()=>showResult(true), 1500);
    }
  }

  // 检查失败 - 所有玩家单位死亡且没有资源
  if(gameState.playerUnits.length===0 && gameState.resources<25){
    setTimeout(()=>showResult(false), 1500);
  }

  updateHUD();
}

function killUnit(unit){
  unit.alive = false;
  gameState.enemiesAlive--;
  scene.remove(unit.mesh);
  createDeathEffect(unit.mesh.position.clone());
  // 死亡单位释放少量资源
  if(unit.isEnemy) gameState.resources += 5;
  // 资源自然增长
  gameState.resources += 2;
}

// ===== 粒子效果 =====
function createAttackEffect(from, to, isEnemy=false){
  const color = isEnemy ? 0xff4444 : 0x44aaff;
  for(let i=0;i<5;i++){
    const geo = new THREE.SphereGeometry(0.1, 4, 4);
    const mat = new THREE.MeshBasicMaterial({color, transparent:true, opacity:1});
    const p = new THREE.Mesh(geo, mat);
    p.position.copy(from);
    const dir = to.clone().sub(from).normalize();
    p.userData = {vel: dir.multiplyScalar(15+Math.random()*5), life:0.5+Math.random()*0.3};
    gameState.particles.push(p);
    scene.add(p);
  }
}

function createDeathEffect(pos){
  for(let i=0;i<12;i++){
    const geo = new THREE.BoxGeometry(0.15, 0.15, 0.15);
    const mat = new THREE.MeshBasicMaterial({
      color: new THREE.Color().setHSL(0.08, 0.8, 0.3+Math.random()*0.3),
      transparent:true, opacity:1
    });
    const p = new THREE.Mesh(geo, mat);
    p.position.copy(pos);
    p.position.y += 0.5;
    const angle = Math.random()*Math.PI*2;
    const up = 3+Math.random()*5;
    p.userData = {
      vel: new THREE.Vector3(Math.cos(angle)*3, up, Math.sin(angle)*3),
      life: 1+Math.random()*0.5
    };
    gameState.particles.push(p);
    scene.add(p);
  }
}

function updateParticles(delta){
  gameState.particles.forEach((p,i)=>{
    if(!p.userData || p.userData.life<=0) return;
    p.userData.life -= delta;
    p.position.add(p.userData.vel.clone().multiplyScalar(delta));
    p.userData.vel.y -= 9.8*delta;
    p.material.opacity = Math.max(0, p.userData.life);
    p.scale.setScalar(p.userData.life);
    if(p.userData.life<=0){
      scene.remove(p);
      gameState.particles.splice(i,1);
    }
  });
}

// ===== 部署单位 =====
function deployUnit(type){
  if(gameState.paused) return;
  const cost = getUnitCost(type);
  if(gameState.resources < cost){
    showToast('粮草不足！');
    return;
  }
  gameState.resources -= cost;

  const pos = new THREE.Vector3(
    -8+Math.random()*16,
    gameState.currentLevel.type==='naval'?0.4:0.6,
    8+Math.random()*8
  );
  const unit = createUnit(type, false, pos);
  gameState.playerUnits.push(unit);
  scene.add(unit.mesh);

  // 部署动画
  unit.mesh.scale.set(0.01,0.01,0.01);
  animateScale(unit.mesh, 1, 0.3);

  updateHUD();
}

function getUnitCost(type){
  const costs = {soldier:30, archer:50, cavalry:80, ship:120, catapult:100};
  return costs[type]||30;
}

function animateScale(mesh, target, duration){
  const start = mesh.scale.x;
  const startTime = clock.elapsedTime;
  function tick(){
    const t = Math.min(1, (clock.elapsedTime-startTime)/duration);
    const s = start + (target-start)*t;
    mesh.scale.set(s,s,s);
    if(t<1) requestAnimationFrame(tick);
  }
  tick();
}

// ===== HUD更新 =====
function updateHUD(){
  const lv = gameState.currentLevel;
  if(!lv) return;
  document.getElementById('wave-num').textContent = `${gameState.wave}/${lv.enemyWaves}`;
  document.getElementById('enemy-count').textContent = gameState.enemiesAlive;
  document.getElementById('resource-val').textContent = Math.floor(gameState.resources);
  document.getElementById('level-title-hud').textContent = lv.name;

  // 更新按钮状态
  document.querySelectorAll('.unit-btn').forEach(btn=>{
    const type = btn.dataset.type;
    const cost = getUnitCost(type);
    if(gameState.resources < cost) btn.style.opacity='0.5';
    else btn.style.opacity='1';
  });
}

// ===== 点击部署 =====
function setupBattleClick(){
  // 避免重复绑定
  if(gameState._battleClickBound) return;
  gameState._battleClickBound = true;

  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();

  document.addEventListener('click', (e)=>{
    if(gameState.screen!=='battle' || gameState.paused) return;
    if(!gameState.selectedUnit) return;
    // 忽略对UI按钮的点击
    if(e.target.closest('#battle-hud-bottom') || e.target.closest('#resource-bar') || e.target.closest('#pause-btn')) return;

    mouse.x = (e.clientX/window.innerWidth)*2-1;
    mouse.y = -(e.clientY/window.innerHeight)*2+1;
    raycaster.setFromCamera(mouse, camera);

    const groundPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
    const target = new THREE.Vector3();
    raycaster.ray.intersectPlane(groundPlane, target);

    if(target && target.length()>0){
      const cost = getUnitCost(gameState.selectedUnit);
      if(gameState.resources >= cost){
        gameState.resources -= cost;
        const y = gameState.currentLevel.type==='naval'?0.4:0.6;
        target.y = y;
        const unit = createUnit(gameState.selectedUnit, false, target);
        gameState.playerUnits.push(unit);
        scene.add(unit.mesh);
        unit.mesh.scale.set(0.01,0.01,0.01);
        animateScale(unit.mesh, 1, 0.3);
        updateHUD();
      } else {
        showToast('粮草不足！');
      }
    }
  });
}

// ===== UI切换 =====
function hideAll(){
  ['main-menu','level-select','battle-ui','cutscene','result-screen','new-china-screen'].forEach(id=>{
    document.getElementById(id).style.display='none';
  });
}

function showMainMenu(){
  hideAll();
  gameState.screen = 'menu';
  document.getElementById('main-menu').style.display='flex';
  document.getElementById('next-game-banner').style.display='none';
  clearScene();
  // 背景粒子
  buildMenuBackground();
}

function buildMenuBackground(){
  scene.background = new THREE.Color(0x0a0500);
  scene.fog = new THREE.FogExp2(0x0a0500, 0.02);
  camera.position.set(0, 20, 30);
  camera.lookAt(0, 5, 0);

  // 飘落的粒子（模拟火星）
  for(let i=0;i<100;i++){
    const p = new THREE.Mesh(
      new THREE.SphereGeometry(0.05+Math.random()*0.1, 4, 4),
      new THREE.MeshBasicMaterial({color:0xff6600, transparent:true, opacity:0.3+Math.random()*0.5})
    );
    p.position.set(-30+Math.random()*60, Math.random()*20, -10+Math.random()*20);
    p.userData = {
      speed: 0.5+Math.random()*1.5,
      sway: Math.random()*Math.PI*2
    };
    gameState.particles.push(p);
    scene.add(p);
  }
  // 旗帜装饰
  const banner = new THREE.Group();
  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.15, 0.15, 15, 8),
    new THREE.MeshPhongMaterial({color:0x8a6a3a})
  );
  pole.position.set(0, 7.5, -5);
  banner.add(pole);
  const cloth = new THREE.Mesh(
    new THREE.PlaneGeometry(6, 4, 10, 5),
    new THREE.MeshPhongMaterial({color:0xcc2200, side:THREE.DoubleSide})
  );
  cloth.position.set(3, 11, -5);
  banner.add(cloth);
  banner.userData.cloth = cloth;
  banner.userData.isBanner = true;
  scene.add(banner);
  gameState._bannerCloth = cloth;

  // 简单循环动画
  if(!gameState._menuAnim){
    gameState._menuAnim = true;
    function menuAnim(){
      if(gameState.screen!=='menu') return;
      const t = clock.elapsedTime;
      // 粒子下落
      gameState.particles.forEach(p=>{
        if(p.userData.speed){
          p.position.y -= p.userData.speed * 0.016;
          p.position.x += Math.sin(t+p.userData.sway)*0.02;
          if(p.position.y<-2) p.position.y = 20;
        }
      });
      // 旗帜飘动
      if(gameState._bannerCloth){
        const pos = gameState._bannerCloth.geometry.attributes.position;
        for(let i=0;i<pos.count;i++){
          const x = pos.getX(i), y = pos.getY(i);
          pos.setZ(i, Math.sin(x*1.5+t*2)*0.3+Math.cos(y*2+t)*0.15);
        }
        pos.needsUpdate = true;
      }
      requestAnimationFrame(menuAnim);
    }
    menuAnim();
  }
}

function showLevelSelect(){
  hideAll();
  gameState.screen = 'select';
  document.getElementById('level-select').style.display='flex';
  clearScene();
  buildLevelGrid();
}

function buildLevelGrid(){
  const grid = document.getElementById('level-grid');
  grid.innerHTML = '';
  LEVELS.forEach(lv=>{
    const card = document.createElement('div');
    card.className = 'level-card';
    const isCompleted = gameState.completedLevels.includes(lv.id);
    const isUnlocked = gameState.unlockedLevels.includes(lv.id);
    if(isCompleted) card.classList.add('completed');
    if(!isUnlocked) card.classList.add('locked');

    const typeLabel = {naval:'水上之战',land:'陆地之战',defense:'保卫城池'}[lv.type];
    const typeClass = {naval:'type-naval',land:'type-land',defense:'type-defense'}[lv.type];

    card.innerHTML = `
      <div class="level-num">第 ${lv.id} 关</div>
      <div class="level-name">${lv.name}</div>
      <span class="level-type ${typeClass}">${typeLabel}</span>
      <div class="level-era">${lv.dynasty} · ${lv.era}</div>
    `;

    if(isUnlocked){
      card.onclick = ()=> startLevel(lv.id);
    }
    grid.appendChild(card);
  });
}

// ===== 开始关卡 =====
function startLevel(id){
  hideAll();
  gameState.screen = 'battle';
  document.getElementById('next-game-banner').style.display='block';

  // 过场
  const lv = LEVELS.find(l=>l.id===id);
  document.getElementById('cut-title').textContent = lv.name;
  document.getElementById('cut-period').textContent = `${lv.dynasty} · ${lv.era}`;
  document.getElementById('cut-story').textContent = lv.desc;
  document.getElementById('cutscene').style.display='flex';

  buildBattleScene(id);

  speak(lv.desc);

  // 点击跳过过场
  document.getElementById('cutscene').onclick = ()=>{
    document.getElementById('cutscene').style.display='none';
    document.getElementById('cutscene').onclick = null;
    document.getElementById('battle-ui').style.display='block';
    buildUnitButtons(lv.type);
    setupBattleClick();
  };
}

function buildUnitButtons(type){
  const container = document.getElementById('battle-hud-bottom');
  container.innerHTML = '';
  let units = [];
  if(type==='naval') units = [
    {type:'soldier',name:'水兵',cost:30},
    {type:'ship',name:'战船',cost:120},
    {type:'archer',name:'弓箭手',cost:50}
  ];
  else if(type==='defense') units = [
    {type:'soldier',name:'步兵',cost:30},
    {type:'archer',name:'弓箭手',cost:50},
    {type:'catapult',name:'投石车',cost:100},
    {type:'cavalry',name:'骑兵',cost:80}
  ];
  else units = [
    {type:'soldier',name:'步兵',cost:30},
    {type:'archer',name:'弓箭手',cost:50},
    {type:'cavalry',name:'骑兵',cost:80}
  ];

  units.forEach(u=>{
    const btn = document.createElement('button');
    btn.className = 'unit-btn';
    btn.dataset.type = u.type;
    btn.innerHTML = `${u.name}<span class="unit-cost">粮草 ${u.cost}</span>`;
    btn.onclick = ()=>{
      document.querySelectorAll('.unit-btn').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      gameState.selectedUnit = u.type;
    };
    container.appendChild(btn);
  });
}

// ===== 结算 =====
function showResult(victory){
  if(gameState.screen!=='battle') return;
  gameState.screen = 'result';
  document.getElementById('battle-ui').style.display='none';

  if(victory){
    const lv = gameState.currentLevel;
    if(!gameState.completedLevels.includes(lv.id)){
      gameState.completedLevels.push(lv.id);
      localStorage.setItem('completedLevels', JSON.stringify(gameState.completedLevels));
    }
    // 解锁下一关
    if(lv.id<21 && !gameState.unlockedLevels.includes(lv.id+1)){
      gameState.unlockedLevels.push(lv.id+1);
      localStorage.setItem('unlockedLevels', JSON.stringify(gameState.unlockedLevels));
    }

    document.getElementById('result-title').textContent = '大捷！';
    document.getElementById('result-title').className = 'victory';
    document.getElementById('result-text').textContent =
      `${lv.name}胜利！${lv.dynasty}的将士们用鲜血和勇气书写了不朽的传奇。`;

    speak('大捷！我军取得了辉煌的胜利！');
  } else {
    document.getElementById('result-title').textContent = '战败...';
    document.getElementById('result-title').className = 'defeat';
    document.getElementById('result-text').textContent =
      '我军寡不敌众，暂时败退。调整战术，再来一次吧！';
    speak('战败了。不要气馁，重新部署再来一次！');
  }

  // 最后一关特殊处理
  if(victory && lv.id===21){
    document.getElementById('result-text').textContent += '\n\n所有战役已完成！';
    document.getElementById('next-level-btn').textContent = '观看结局';
    document.getElementById('next-level-btn').onclick = ()=> showNewChinaScreen();
  } else if(victory && lv.id<21){
    document.getElementById('next-level-btn').textContent = '下一关';
    document.getElementById('next-level-btn').onclick = ()=> startLevel(lv.id+1);
  } else {
    document.getElementById('next-level-btn').textContent = '重新挑战';
    document.getElementById('next-level-btn').onclick = ()=> startLevel(lv.id);
  }

  document.getElementById('result-screen').style.display='flex';
}

// ===== 语音系统 =====
function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'zh-CN';
  utter.rate = 0.9;
  utter.pitch = 1;

  // 尝试找中文语音
  const voices = window.speechSynthesis.getVoices();
  const zhVoice = voices.find(v=>v.lang.startsWith('zh'));
  if(zhVoice) utter.voice = zhVoice;

  window.speechSynthesis.speak(utter);
}

// 预加载语音列表
if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged = ()=> window.speechSynthesis.getVoices();
}

  setTimeout(()=> toast.remove(), 2500);
}
