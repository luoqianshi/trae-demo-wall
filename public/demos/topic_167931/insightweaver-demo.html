  <script>
/**
 * 存储层封装（技术文档 7.3 节 localStorage → chrome.storage 迁移）
 *
 * 双模式适配：
 *   - 扩展环境：chrome.storage.local（异步，跨标签页同步）
 *   - 单文件 demo / 非扩展环境：localStorage（同步，仅本地）
 *
 * 统一返回 Promise，调用方无需关心底层差异
 * 存储键名见 IW.STORAGE_KEYS
 */
(function (IW) {
  'use strict';

  const HAS_CHROME_STORAGE = typeof chrome !== 'undefined' && chrome.storage && chrome.storage.local;
  const KEYS = IW.STORAGE_KEYS;

  /**
   * 读取单个键
   * @param {string} key
   * @returns {Promise<any>}
   */
  function get(key) {
    if (HAS_CHROME_STORAGE) {
      return new Promise((resolve) => {
        chrome.storage.local.get(key, (res) => resolve(res[key]));
      });
    }
    // localStorage 兜底（单文件 demo 场景）
    return new Promise((resolve) => {
      try { resolve(JSON.parse(localStorage.getItem(key) || 'null')); }
      catch (e) { resolve(null); }
    });
  }

  /**
   * 写入单个键
   * @param {string} key
   * @param {any} value
   * @returns {Promise<void>}
   */
  function set(key, value) {
    if (HAS_CHROME_STORAGE) {
      return new Promise((resolve) => {
        const obj = {}; obj[key] = value;
        chrome.storage.local.set(obj, () => resolve());
      });
    }
    return new Promise((resolve) => {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
      resolve();
    });
  }

  /**
   * 删除单个键
   * @param {string} key
   * @returns {Promise<void>}
   */
  function remove(key) {
    if (HAS_CHROME_STORAGE) {
      return new Promise((resolve) => chrome.storage.local.remove(key, () => resolve()));
    }
    return new Promise((resolve) => { localStorage.removeItem(key); resolve(); });
  }

  /* ---------- 业务封装 ---------- */

  /**
   * 获取所有用户批注（技术文档 5.4 节 renderUserAnnotationsInline 的数据源）
   * @returns {Promise<Array<{quote,note,type,aid,time}>>}
   */
  function getAnnotations() {
    return get(KEYS.ANNOTATIONS).then((arr) => Array.isArray(arr) ? arr : []);
  }

  /**
   * 保存批注（新增或覆盖）
   * @param {object} annotation - {quote,note,type,aid,time}
   * @returns {Promise<Array>}
   */
  async function saveAnnotation(annotation) {
    const arr = await getAnnotations();
    // 同 quote+aid 视为更新（避免重复内联渲染冲突）
    const idx = arr.findIndex(a => a.quote === annotation.quote && a.aid === annotation.aid);
    if (idx >= 0) { arr[idx] = annotation; } else { arr.push(annotation); }
    await set(KEYS.ANNOTATIONS, arr);
    return arr;
  }

  /**
   * 删除批注（按 quote+aid 定位）
   * @param {string} quote
   * @param {number} aid
   * @returns {Promise<Array>}
   */
  async function deleteAnnotation(quote, aid) {
    const arr = await getAnnotations();
    const filtered = arr.filter(a => !(a.quote === quote && a.aid === aid));
    await set(KEYS.ANNOTATIONS, filtered);
    return filtered;
  }

  /**
   * 获取评论回复映射 { cid: [{type,text,time}] }
   * @returns {Promise<object>}
   */
  async function getReplies() {
    const obj = await get(KEYS.REPLIES);
    return obj && typeof obj === 'object' ? obj : {};
  }

  /**
   * 给指定评论添加回复
   * @param {string} cid - 评论ID
   * @param {{type:string,text:string}} reply
   * @returns {Promise<object>} 完整 replies 映射
   */
  async function saveReply(cid, reply) {
    const obj = await getReplies();
    if (!Array.isArray(obj[cid])) { obj[cid] = []; }
    obj[cid].push(Object.assign({ time: Date.now() }, reply));
    await set(KEYS.REPLIES, obj);
    return obj;
  }

  /**
   * 读取设置（数据源模式等）
   * @returns {Promise<{dataMode:string,searchApiKey:string,commentApiKeys:object}>}
   */
  async function getSettings() {
    const s = await get(KEYS.SETTINGS);

  }

  /**
   * 写入设置（合并）
   * @param {object} patch
   * @returns {Promise<object>}
   */
  async function saveSettings(patch) {
    const cur = await getSettings();
    const next = Object.assign({}, cur, patch);
    await set(KEYS.SETTINGS, next);
    return next;
  }

  /**

   */
  function getFactsDB() { return get(KEYS.FACTS_DB); }

  /**

   */
  function setFactsDB(facts) { return set(KEYS.FACTS_DB, facts); }

  /**

  async function getAggregatedArticles() {

    return Array.isArray(arr) ? arr : [];
  }

  /**

   * @returns {Promise<Array>}
   */
  async function aggregateArticle(article) {
    const arr = await getAggregatedArticles();
    const exists = arr.find(a => (article.url && a.url === article.url) || (article.id && a.id === article.id));
    if (!exists) { arr.push(article); await set(KEYS.ARTICLES, arr); }
    return arr;
  }

    getFactsDB, setFactsDB,

  };

  <script>
/**
 * 消息通信协议（技术文档 9.2 模块2.4 content ↔ background ↔ popup）
 *
 * Manifest V3 中：
 *   - content script 不能直接调 chrome.runtime.sendMessage 的部分 API，需通过 chrome.runtime.sendMessage
 *   - background service worker 通过 chrome.runtime.onMessage 监听
 *   - popup 通过 chrome.runtime.sendMessage 与 background 通信
 *
 * 提供统一的消息发送/监听辅助函数，避免散落的 chrome.runtime 调用
 */
(function (IW) {
  'use strict';

  const HAS_RUNTIME = typeof chrome !== 'undefined' && chrome.runtime && chrome.runtime.sendMessage;

  /**
   * 发送消息（content / popup → background）
   * 在非扩展环境（单文件 demo）下，回退到 IW._localBus 事件总线
   * @param {{type:string, [payload]:any}} message
   * @returns {Promise<any>}
   */
  function send(message) {
    if (HAS_RUNTIME) {
      return new Promise((resolve, reject) => {
        chrome.runtime.sendMessage(message, (res) => {
          if (chrome.runtime.lastError) {
            // 接收方不存在时不算致命错误，返回 null
            resolve(null);
          } else {
            resolve(res);
          }
        });
      });
    }
    // 单文件 demo 兜底：本地事件总线
    return new Promise((resolve) => {
      const bus = IW._localBus = IW._localBus || { handlers: {} };
      const handlers = bus.handlers[message.type] || [];
      let settled = false;
      handlers.forEach((h) => {
        if (!settled) {
          const r = h(message.payload);
          if (r && typeof r.then === 'function') {
            settled = true;
            r.then(resolve);
          } else {
            settled = true;
            resolve(r);
          }
        }
      });
      if (!settled) { resolve(null); }
    });
  }

  /**
   * 注册消息处理器（background / 单文件 demo 用）
   * @param {string} type - IW.MSG.* 中的类型
   * @param {(payload:any, sender?:object)=>any|Promise} handler
   */
  function on(type, handler) {
    if (HAS_RUNTIME && chrome.runtime.onMessage) {
      chrome.runtime.onMessage.addListener((msg, sender, sendResponse) => {
        if (msg && msg.type === type) {
          const r = handler(msg.payload, sender);
          if (r && typeof r.then === 'function') {
            r.then((res) => sendResponse(res));
            return true; // 保持 channel 开启等待异步响应
          }
          sendResponse(r);
          return false;
        }
        return false;
      });
      return;
    }
    // 单文件 demo 兜底
    const bus = IW._localBus = IW._localBus || { handlers: {} };
    bus.handlers[type] = bus.handlers[type] || [];
    bus.handlers[type].push(handler);
  }

  /**
   * 向指定标签页的 content script 发送消息（background → content）
   * @param {number} tabId
   * @param {object} message
   * @returns {Promise<any>}
   */
  function sendToTab(tabId, message) {
    if (typeof chrome !== 'undefined' && chrome.tabs && chrome.tabs.sendMessage) {
      return new Promise((resolve) => {
        chrome.tabs.sendMessage(tabId, message, (res) => resolve(res));
      });
    }
    return Promise.resolve(null);
  }

  IW.messaging = { send, on, sendToTab, HAS_RUNTIME };
})(self.IW = self.IW || {});

  </script>

  <script>
/**
 * LLM 服务（技术文档 7.1 节、9.2 模块6.2-6.4）
 *
 * 职责：
 *   - 关联链条评估：分析搜索结果与中心事件的关联路径，生成 chain[]
 *   - significance 自动生成：长链（>3步）的意义说明
 *   - 强度分级：根据链条长度 + 来源权威度评定 strong/medium/weak
 *
 * 双模式：
 *   - mock：基于规则启发式生成（无需 LLM API key）
 *   - real：调用真实 LLM API（需配置 endpoint + key，由 settings.llmApiKey 指定）
 *
 * 避坑（技术文档 7.1 节要点5）：
 *   搜索结果必须支持多源交叉验证，不能退化为单源信息。
 *   本服务的 evaluateRelevance 会过滤掉无法关联到已有 FACTS 的结果。
 */
(function (IW) {
  'use strict';

  const THRESHOLD = IW.LONG_CHAIN_THRESHOLD;

  /**
   * 强度分级算法（技术文档 7.1 节要点4）
   * 链条 ≤2 步且来源为权威媒体 → strong
   * 链条 3 步或来源为行业报告/论文 → medium
   * 链条 >3 步或来源为博客/论坛 → weak
   * @param {Array} chain
   * @param {string} source
   * @returns {'strong'|'medium'|'weak'}
   */
  function gradeStrength(chain, source) {
    const len = chain.length;
    const authoritative = IW.STRENGTH_RULES.strong.sources;
    const medium = IW.STRENGTH_RULES.medium.sources;
    if (len <= 2 && authoritative.some(s => source.includes(s))) return 'strong';
    if (len <= 3 || medium.some(s => source.includes(s))) return 'medium';
    return 'weak';
  }

  /**
   * 关联链条评估（mock 模式：基于关键词的启发式路径生成）
   * real 模式下应由 LLM 分析"中心事件 → 搜索结果"的语义关联路径
   * @param {string} centerEvent - 中心事件（如"塔塔电子泄密"）
   * @param {{title:string,source:string,snippet?:string}} result
   * @param {object} facts - 已有 FACTS 数据库，用于交叉验证过滤
   * @returns {{chain:Array<{n:string,s:string}>, significance?:string, relatedFid?:string}}
   */
  function evaluateChain_mock(centerEvent, result, facts) {
    // 启发式：根据标题/snippet 与 FACTS refs 的文本重合度生成中间节点
    const text = (result.title + ' ' + (result.snippet || '')).toLowerCase();
    const chain = [{ n: centerEvent, s: 'strong' }];
    let relatedFid = null;

    // 尝试在 FACTS 中找到关联事实
    for (const fid in facts) {
      const f = facts[fid];
      const hit = f.refs.some(r => text.includes(r.excerpt.slice(0, 6)) || text.includes(f.label.slice(0, 4)));
      if (hit) {
        chain.push({ n: f.label, s: 'medium' });
        relatedFid = fid;
        break;
      }
    }
    // 通用中间节点
    chain.push({ n: result.source + '相关分析', s: 'medium' });
    chain.push({ n: '搜索结果原文', s: 'weak' });

    let significance;
    if (chain.length > THRESHOLD) {
      significance = generateSignificance_mock(chain, result, relatedFid);
    }
    return { chain, significance, relatedFid };
  }

  /**
   * 长链推导意义说明生成（mock 模式）
   * real 模式下由 LLM 生成
   * @param {Array} chain
   * @param {object} result
   * @param {string|null} relatedFid
   * @returns {string}
   */
  function generateSignificance_mock(chain, result, relatedFid) {
    const steps = chain.length;
    if (relatedFid) {
      return steps + '步推导：搜索结果与已有事实"' + IW.FACTS[relatedFid].label + '"存在关联，可提供补充视角，但不能直接证实该事实。';
    }
    return steps + '步推导：搜索结果与中心事件关联逐步减弱，仅可作为背景参考，不应作为直接证据。';
  }

  /**
   * LLM 服务统一入口
   * @param {string} mode - 'mock' | 'real'
   * @param {object} params - {centerEvent, result, facts, settings}
   * @returns {Promise<{chain, significance?, relatedFid?}>}
   */
  async function evaluateRelevance(mode, params) {
    if (mode === IW.DATA_MODE.REAL && params.settings && params.settings.llmApiKey) {
      // real 模式：调用 LLM API
      try {
        return await evaluateChain_real(params);
      } catch (e) {
        // 失败降级为 mock
        console.warn('[InsightWeaver] LLM 真实调用失败，降级为 mock:', e);
        return evaluateChain_mock(params.centerEvent, params.result, params.facts);
      }
    }
    return evaluateChain_mock(params.centerEvent, params.result, params.facts);
  }

  /**
   * real 模式：调用 LLM API 评估关联链条
   * 这里给出接口契约，具体 endpoint 由 settings.llmEndpoint 配置
   * 兼容 OpenAI Chat Completions 风格
   */
  async function evaluateChain_real(params) {
    const s = params.settings;
    const endpoint = s.llmEndpoint || 'https://api.openai.com/v1/chat/completions';
    const prompt = buildPrompt(params);
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + s.llmApiKey
      },
      body: JSON.stringify({
        model: s.llmModel || 'gpt-4o-mini',
        messages: [
          { role: 'system', content: '你是信息关联分析助手。分析搜索结果与中心事件的关联路径，输出 JSON：{chain:[{n,s}], significance?, relatedFid?}。s 取值 strong/medium/weak。' },
          { role: 'user', content: prompt }
        ],
        temperature: 0.2
      })
    });
    const data = await res.json();
    const content = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    return JSON.parse(content);
  }

  function buildPrompt(params) {
    const factsList = Object.keys(params.facts).map(fid => '- ' + fid + ': ' + params.facts[fid].label).join('\n');
    return '中心事件：' + params.centerEvent +
      '\n搜索结果标题：' + params.result.title +
      '\n来源：' + params.result.source +
      '\n摘要：' + (params.result.snippet || '(无)') +
      '\n\n已有事实库：\n' + factsList +
      '\n\n请分析该搜索结果与中心事件的关联路径（每步标注强度），若链条超过3步请给出 significance 说明，若能关联到已有事实请标注 relatedFid。仅输出 JSON。';
  }

  IW.llm = {
    gradeStrength,
    evaluateRelevance,
    evaluateChain_mock,
    generateSignificance_mock
  };
})(self.IW = self.IW || {});

  </script>

  <script>
/**
 * AI 搜索服务（技术文档 7.1 节、9.2 模块6）
 *
 * 职责：
 *   - 根据当前文章主题检索权威源
 *   - 调用 LLM 服务生成关联链条与强度评估
 *   - 多源交叉验证过滤（避坑：不能退化为单源信息）
 *   - 保持 AI_SOURCES 的 {cat, items[{title, source, strength, chain, significance}]} 结构
 *
 * 双模式：
 *   - mock：直接返回 IW.AI_SOURCES 静态数据
 *   - real：调用 Bing/Google Search API + LLM 评估
 *
 * 配置项（settings）：
 *   - searchProvider: 'bing' | 'google' | 'mock'
 *   - searchApiKey: 搜索 API key
 *   - llmApiKey / llmEndpoint / llmModel
 */
(function (IW) {
  'use strict';

  /**
   * 提取文章关键词（用于搜索 query）
   * 简单实现：取标题中长度≥2 的中文词 + 英文单词
   * @param {object} article
   * @returns {string}
   */
  function extractKeywords(article) {
    const title = article.title || '';
    // 中文按字符切分取连续≥2字的片段，英文按空格
    const cn = title.match(/[\u4e00-\u9fa5]{2,}/g) || [];
    const en = title.match(/[A-Za-z]{4,}/g) || [];
    return (cn.slice(0, 3).join(' ') + ' ' + en.slice(0, 3).join(' ')).trim();
  }

  /**
   * mock 模式：返回静态 AI_SOURCES
   * @returns {Promise<Array>}
   */
  function search_mock() {
    return Promise.resolve(JSON.parse(JSON.stringify(IW.AI_SOURCES)));
  }

  /**
   * real 模式：调用真实搜索 API
   * @param {object} article - 当前文章
   * @param {object} settings - 配置
   * @returns {Promise<Array>} AI_SOURCES 结构
   */
  async function search_real(article, settings) {
    const query = extractKeywords(article);
    let results = [];
    if (settings.searchProvider === 'bing') {
      results = await searchBing(query, settings.searchApiKey);
    } else if (settings.searchProvider === 'google') {
      results = await searchGoogle(query, settings.searchApiKey);
    } else {
      // 无配置则降级
      return search_mock();
    }

    // LLM 评估 + 交叉验证过滤
    const facts = IW.FACTS;
    const enriched = [];
    for (const r of results) {
      const eval_ = await IW.llm.evaluateRelevance(IW.DATA_MODE.REAL, {
        centerEvent: article.title,
        result: r,
        facts: facts,
        settings: settings
      });
      // 避坑：必须能关联到已有 FACTS 才展示
      if (eval_.relatedFid) {
        enriched.push({
          title: r.title,
          source: r.source,
          date: r.date || '',
          type: r.type || 'media',
          strength: IW.llm.gradeStrength(eval_.chain, r.source),
          chain: eval_.chain,
          significance: eval_.significance
        });
      }
    }

    // 按来源权威度分类
    return categorize(enriched);
  }

  /**
   * Bing Search API 调用（技术文档 7.1 节）
   * @param {string} query
   * @param {string} apiKey
   * @returns {Promise<Array<{title,source,snippet,date,type}>>}
   */
  async function searchBing(query, apiKey) {
    const endpoint = 'https://api.bing.microsoft.com/v7.0/search?q=' + encodeURIComponent(query) + '&count=20&responseFilter=Webpages';
    const res = await fetch(endpoint, { headers: { 'Ocp-Apim-Subscription-Key': apiKey } });
    const data = await res.json();
    const pages = (data.webPages && data.webPages.value) || [];
    return pages.map(p => ({
      title: p.name,
      source: extractDomain(p.url),
      snippet: p.snippet,
      date: p.datePublished || '',
      type: 'media',
      url: p.url
    }));
  }

  /**
   * Google Custom Search API 调用
   * @param {string} query
   * @param {string} apiKey - 格式 "key:cx"
   * @returns {Promise<Array>}
   */
  async function searchGoogle(query, apiKey) {
    const [key, cx] = apiKey.split(':');
    const endpoint = 'https://www.googleapis.com/customsearch/v1?key=' + key + '&cx=' + cx + '&q=' + encodeURIComponent(query) + '&num=10';
    const res = await fetch(endpoint);
    const data = await res.json();
    const items = data.items || [];
    return items.map(it => ({
      title: it.title,
      source: extractDomain(it.link),
      snippet: it.snippet || '',
      date: '',
      type: 'media',
      url: it.link
    }));
  }

  function extractDomain(url) {
    try { return new URL(url).hostname.replace(/^www\./, ''); }
    catch (e) { return url; }
  }

  /**
   * 按来源类型分类（权威媒体 / 学术论文 / 数据库行业报告）
   * @param {Array} items
   * @returns {Array<{cat,color,items}>}
   */
  function categorize(items) {
    const cats = [
      { cat: '权威媒体', color: '#4f46e5', match: ['reuters', 'bloomberg', 'ft.com', 'techcrunch', 'nytimes', 'wsj'], items: [] },
      { cat: '学术论文', color: '#0891b2', match: ['ieee', 'acm', 'arxiv', 'springer', 'sciencedirect', 'nature'], items: [] },
      { cat: '数据库/行业报告', color: '#f59e0b', match: ['gartner', 'idc', 'forrester', 'apple.com', 'statista'], items: [] }
    ];
    const fallback = { cat: '其他来源', color: '#8a8a8a', match: [], items: [] };
    items.forEach((it) => {
      const src = (it.source || '').toLowerCase();
      let placed = false;
      for (const c of cats) {
        if (c.match.some(m => src.includes(m))) { c.items.push(it); placed = true; break; }
      }
      if (!placed) { fallback.items.push(it); }
    });
    const result = cats.filter(c => c.items.length > 0);
    if (fallback.items.length > 0) { result.push(fallback); }
    return result;
  }

  /**
   * AI 搜索服务统一入口
   * @param {object} article - 当前文章
   * @param {object} settings - {dataMode, searchProvider, searchApiKey, ...}
   * @returns {Promise<Array>}
   */
  function search(article, settings) {
    if (settings && settings.dataMode === IW.DATA_MODE.REAL && settings.searchApiKey) {
      return search_real(article, settings).catch((e) => {
        console.warn('[InsightWeaver] AI 搜索真实调用失败，降级为 mock:', e);
        return search_mock();
      });
    }
    return search_mock();
  }

  IW.searchService = { search, extractKeywords, categorize };
})(self.IW = self.IW || {});

  </script>

  <script>
/**
 * 评论采集服务（技术文档 7.2 节、9.2 模块7）
 *
 * 职责：
 *   - 从微博 / 知乎 / X / Hacker News 等平台采集热门评论
 *   - 评论清洗管道（去重 / 去噪 / 过滤 / 排序）
 *   - 情绪分析 → sentiment（正/中/负比例）
 *   - 词云生成 → wordCloud（分词 + 词频 + 情感词典标注）
 *   - 情感细分 → emotions
 *
 * 双模式：
 *   - mock：直接返回 IW.COMMENT_ANALYSIS 静态数据
 *   - real：调用平台 API + 本地情绪分析
 *
 * 避坑（技术文档 7.2 节要点5）：
 *   评论分析必须保持三维体系（词云+环形图+情感条），不能退化为简单关键词展示。
 *   本服务输出结构始终包含 sentiment + emotions + wordCloud + hotComments 四字段。
 */
(function (IW) {
  'use strict';

  /**
   * mock 模式：返回静态 COMMENT_ANALYSIS
   * @returns {Promise<Array>}
   */
  function collect_mock() {
    return Promise.resolve(JSON.parse(JSON.stringify(IW.COMMENT_ANALYSIS)));
  }

  /**
   * real 模式：调用平台 API 采集评论
   * @param {object} article - 当前文章
   * @param {object} settings - {commentApiKeys: {weibo, zhihu, hn}, dataMode}
   * @returns {Promise<Array>} COMMENT_ANALYSIS 结构
   */
  async function collect_real(article, settings) {
    const keys = settings.commentApiKeys || {};
    const tasks = [];
    // Hacker News 有公开 API，无需 key
    tasks.push(collectHackerNews(article).then(analyze).then(r => Object.assign({ plat: 'Hacker News', ic: 'HN', c: '#ff6600' }, r)));
    // 微博 / 知乎 需 key（此处给出接口契约，实际需对接平台开放平台）
    if (keys.weibo) {
      tasks.push(collectWeibo(article, keys.weibo).then(analyze).then(r => Object.assign({ plat: '微博', ic: '微', c: '#e6162d' }, r)));
    }
    if (keys.zhihu) {
      tasks.push(collectZhihu(article, keys.zhihu).then(analyze).then(r => Object.assign({ plat: '知乎', ic: '知', c: '#0084ff' }, r)));
    }

  /**
   * 情绪分析 + 词云生成 + 情感细分（避坑：必须三维体系）
   * @param {Array<{text,likes,id}>} rawComments
   * @returns {{sentiment, emotions, wordCloud, hotComments, count}}
   */
  function analyze(rawComments) {
    if (!rawComments || rawComments.length === 0) {
      return { sentiment: { positive: 33, neutral: 34, negative: 33 }, emotions: [['中性', 100, '#8a8a8a']], wordCloud: [], hotComments: [], count: '0' };
    }
    // 1. 清洗：去重、去空、过滤过短
    const cleaned = uniqueBy(rawComments.filter(c => c.text && c.text.length >= 2), 'text');

    // 2. 情绪分析（mock 词典法；real 模式应接入情绪分析模型）
    const sentiment = { positive: 0, neutral: 0, negative: 0 };
    const emotions = {};
    cleaned.forEach(c => {
      const s = analyzeSentiment(c.text);
      sentiment[s.polarity]++;
      s.emotions.forEach(e => { emotions[e] = (emotions[e] || 0) + 1; });
    });
    const total = cleaned.length || 1;
    sentiment.positive = Math.round(sentiment.positive / total * 100);
    sentiment.neutral = Math.round(sentiment.neutral / total * 100);
    sentiment.negative = 100 - sentiment.positive - sentiment.neutral;

    // 3. 情感细分条
    const emotionColors = { 担忧: '#ef4444', 愤怒: '#f59e0b', 嘲讽: '#8a8a8a', 分析: '#4f46e5', 理性: '#4f46e5', 关注: '#0891b2', 中立: '#8a8a8a', 乐观: '#10b981', 同情: '#10b981' };
    const emotionsArr = Object.keys(emotions)
      .map(k => [k, Math.round(emotions[k] / total * 100), emotionColors[k] || '#8a8a8a'])
      .sort((a, b) => b[1] - a[1])
      .slice(0, 5);

    // 4. 词云：分词 + 词频
    const wordCloud = buildWordCloud(cleaned).slice(0, 12);

    // 5. 热门评论（按点赞数排序，取 Top 5）
    const hotComments = cleaned.sort((a, b) => b.likes - a.likes).slice(0, 5).map(c => ({
      text: c.text, likes: c.likes, sentiment: analyzeSentiment(c.text).polarity === 1 ? 'positive' : (analyzeSentiment(c.text).polarity === -1 ? 'negative' : 'neutral'), id: c.id
    }));

    return { sentiment, emotions: emotionsArr, wordCloud, hotComments, count: String(cleaned.length) };
  }

  /* ---------- 情绪分析（mock 词典法） ---------- */
  const NEG_WORDS = ['不靠谱', '失败', '危险', '严重', '泄露', '危机', '担忧', '愤怒', '崩', '跌', '质疑', '不', '差', '糟'];
  const POS_WORDS = ['利好', '受益', '增长', '机会', '乐观', '进步', '提升', '突破'];
  const NEU_WORDS = ['分析', '评估', '研究', '讨论', '认为', '表示', '指出', '说明'];
  const EMOTION_MAP = { '担忧': ['担忧', '危险', '危机'], '愤怒': ['愤怒', '不靠谱', '糟'], '嘲讽': ['果然', '又是', '还敢'], '分析': ['分析', '评估', '研究'], '理性': ['理性', '客观', '逻辑'], '关注': ['关注', '留意', '观察'], '乐观': ['乐观', '利好', '增长'], '同情': ['同情', '可惜'] };

  function analyzeSentiment(text) {
    let neg = 0, pos = 0, neu = 0;
    NEG_WORDS.forEach(w => { if (text.includes(w)) neg++; });
    POS_WORDS.forEach(w => { if (text.includes(w)) pos++; });
    NEU_WORDS.forEach(w => { if (text.includes(w)) neu++; });
    const polarity = neg > pos ? -1 : (pos > neg ? 1 : 0);
    const emotions = [];
    for (const e in EMOTION_MAP) {
      if (EMOTION_MAP[e].some(w => text.includes(w))) { emotions.push(e); }
    }
    if (emotions.length === 0) { emotions.push(polarity === -1 ? '担忧' : (polarity === 1 ? '乐观' : '中立')); }
    return { polarity, emotions };
  }

  /* ---------- 词云生成 ---------- */
  function buildWordCloud(comments) {
    const freq = {};
    comments.forEach(c => {
      // 简单分词：2-4 字中文片段 + 英文单词
      const tokens = (c.text.match(/[\u4e00-\u9fa5]{2,4}/g) || []).concat(c.text.match(/[A-Za-z]{3,}/g) || []);
      tokens.forEach(t => { freq[t] = (freq[t] || 0) + 1; });
    });
    return Object.keys(freq)
      .map(w => ({
        w: w,
        s: Math.min(40, 10 + freq[w] * 4),
        sent: analyzeSentiment(w).polarity === -1 ? 'neg' : (analyzeSentiment(w).polarity === 1 ? 'pos' : 'neu')
      }))
      .sort((a, b) => b.s - a.s);
  }

  function stripHtml(html) {
    return html.replace(/<[^>]+>/g, '').replace(/&[a-z]+;/g, ' ').trim();
  }

  function uniqueBy(arr, key) {
    const seen = {};
    return arr.filter(it => {
      const k = it[key];
      if (seen[k]) { return false; }
      seen[k] = true; return true;
    });
  }

  /**
   * 评论采集服务统一入口
   * @param {object} article
   * @param {object} settings
   * @returns {Promise<Array>}
   */
  function collect(article, settings) {
    if (settings && settings.dataMode === IW.DATA_MODE.REAL) {
      return collect_real(article, settings).catch((e) => {
        console.warn('[InsightWeaver] 评论采集真实调用失败，降级为 mock:', e);
        return collect_mock();
      });
    }
    return collect_mock();
  }

  IW.commentService = { collect, analyze, buildWordCloud };

  /* ====================================================================
     初始化：浮动按钮 + Shadow DOM 面板
     ==================================================================== */
  function init() {
    // 浮动按钮
    const fab = document.createElement('button');
    fab.className = 'iw-fab';
    fab.title = '知海拾贝 InsightWeaver';
    fab.innerHTML = '知海<span class="iw-fab-dot"></span>';
    fab.addEventListener('click', togglePanel);
    document.documentElement.appendChild(fab);

    // Shadow DOM 宿主
    const host = document.createElement('div');
    host.id = 'iw-shadow-host';
    host.style.cssText = 'position:fixed;inset:0;z-index:2147483647;pointer-events:none';
    document.documentElement.appendChild(host);
    shadow = host.attachShadow({ mode: 'open' });

    // 注入样式
    const style = document.createElement('style');
    style.textContent = SHADOW_STYLE;
    shadow.appendChild(style);

    // 面板根
    const panel = document.createElement('div');
    panel.className = 'iw-root hidden';
    panel.style.pointerEvents = 'auto';
    shadow.appendChild(panel);
    root = panel;

    panel.innerHTML = buildPanelHTML();
    bindPanelEvents();

    // 加载持久化数据
    loadPersistedData();

    // 监听 background 广播
    listenToBackground();
  }

  function togglePanel() {
    panelOpen = !panelOpen;
    root.classList.toggle('hidden', !panelOpen);
    const fab = document.querySelector('.iw-fab');
    if (fab) { fab.classList.toggle('iw-fab-active', panelOpen); }
    if (panelOpen) {
      renderArticle(currentArticle);
    }
  }

  function buildPanelHTML() {
    const arts = IW.ARTICLES;
    const facts = IW.FACTS;
    const counts = { confirmed: 0, partial: 0, verify: 0, diverge: 0 };
    Object.keys(facts).forEach(k => { counts[facts[k].type] = (counts[facts[k].type] || 0) + 1; });

    return `
      <div class="topbar">
        <div class="top-left">
          <button class="close-btn" id="iwClose" title="关闭">×</button>
          <span class="brand-dot"></span>
          <div class="switcher" id="iwSwitcher">
            <div class="switcher-btn" id="iwSwBtn">
              <span class="switcher-num" id="iwSwNum">①</span>
              <span class="switcher-title" id="iwSwTitle">${arts[0].title}</span>
              <span style="color:#8a8a8a">▾</span>
            </div>
            <div class="switcher-menu" id="iwSwMenu"></div>
          </div>
        </div>
        <div class="top-right">
          <div class="agg-chip" id="iwAggChip" title="打开交叉验证聚合">
            <span class="dots">
              <i style="background:#10b981"></i><i style="background:#eab308"></i><i style="background:#f59e0b"></i><i style="background:#ef4444"></i><i style="background:#4f46e5"></i>
            </span>
            <span>${Object.keys(facts).length} 条事实</span>
          </div>
          <span class="progress-pct" id="iwPct">0%</span>
        </div>
      </div>

      <div class="article-wrap" id="iwWrap">
        <div class="article-lead" id="iwArtLead"></div>
        <div class="article-body">
          <h1 id="iwArtTitle"></h1>
          <div class="article-meta" id="iwArtMeta"></div>
          <div id="iwArtBody"></div>
        </div>
      </div>

      <div class="progress-rail" id="iwRail">
        <div class="progress-fill" id="iwRailFill"></div>
      </div>

      <div class="hover-popup" id="iwPopup"></div>
      <div class="ctx-menu" id="iwCtxMenu">
        <button class="ctx-btn" data-act="annotate">✎ 批注</button>
        <button class="ctx-btn" data-act="factcheck">✓ 核查</button>
        <button class="ctx-btn" data-act="wordanalyze">A 用词</button>
      </div>
      <div class="anno-input" id="iwAnnoInput">
        <div class="anno-input-quote" id="iwAnnoQuote"></div>
        <div class="anno-input-types" id="iwAnnoTypes"></div>
        <textarea id="iwAnnoText" placeholder="记录你的思考…"></textarea>
        <div class="anno-input-actions">
          <button class="ai-cancel" id="iwAnnoCancel">取消</button>
          <button class="ai-save" id="iwAnnoSave">保存</button>
        </div>
      </div>

      <div class="dock" id="iwDock">
        ${Object.keys(IW.OVERLAY_CONF).map(k => {
          const c = IW.OVERLAY_CONF[k];
          return `<button class="dock-btn" data-overlay="${k}" style="position:relative">
            <span>${c.icon}</span>
            <span class="tip">${c.title}</span>
            ${k === 'anno' ? '<span class="dock-badge" id="iwAnnoBadge" style="display:none"></span>' : ''}
          </button>`;
        }).join('')}
      </div>

      <div class="overlay-scrim" id="iwScrim"></div>
      <div class="overlay" id="iwOverlay">
        <div class="overlay-head">
          <div class="overlay-title" id="iwOvTitle"></div>
          <button class="overlay-close" id="iwOvClose">×</button>
        </div>
        <div class="overlay-body" id="iwOvBody"></div>
      </div>
    `;
  }

  function bindPanelEvents() {
    const $ = (id) => shadow.getElementById(id);

    $('iwClose').addEventListener('click', togglePanel);

    // Switcher
    $('iwSwBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      $('iwSwitcher').classList.toggle('open');
      buildSwitcher();
    });

    // agg chip
    $('iwAggChip').addEventListener('click', () => openOverlay('agg'));

    // Dock
    root.querySelectorAll('.dock-btn').forEach(btn => {
      btn.addEventListener('click', () => openOverlay(btn.dataset.overlay));
    });

    // Overlay close
    $('iwOvClose').addEventListener('click', closeOverlay);
    $('iwScrim').addEventListener('click', closeOverlay);

    // 上下文菜单
    root.querySelectorAll('.ctx-btn').forEach(btn => {
      btn.addEventListener('click', () => handleCtxAction(btn.dataset.act));
    });

    // 批注输入
    $('iwAnnoCancel').addEventListener('click', () => $('iwAnnoInput').classList.remove('show'));
    $('iwAnnoSave').addEventListener('click', saveAnnotationFromInput);

    // 文本选区（在 shadow root 内检测）
    root.addEventListener('mouseup', handleTextSelection);
    root.addEventListener('touchend', handleTextSelection);

    // 全局点击：关闭浮窗/菜单
    root.addEventListener('click', (e) => {
      const t = e.target;
      if (!t.closest('.switcher') && !t.closest('.switcher-menu')) {
        $('iwSwitcher').classList.remove('open');
      }
      if (!t.closest('.hover-popup') && !t.closest('.iw-anno') && !t.closest('.user-anno')) {
        const pop = $('iwPopup');
        if (!pop.classList.contains('pinned')) { hidePopup(); }
      }
      if (!t.closest('.ctx-menu') && !t.closest('.anno-input')) {
        $('iwCtxMenu').classList.remove('show');
        $('iwAnnoInput').classList.remove('show');
      }
    });

    // 滚动进度
    root.addEventListener('scroll', updateProgress, { passive: true });

    // 键盘导航
    document.addEventListener('keydown', (e) => {
      if (!panelOpen) { return; }
      if (e.key === 'Escape') { handleEscape(); }
      else if (e.key === 'ArrowLeft' && !isInputFocused()) { renderArticle(Math.max(1, currentArticle - 1)); }
      else if (e.key === 'ArrowRight' && !isInputFocused()) { renderArticle(Math.min(IW.ARTICLES.length, currentArticle + 1)); }
    });
  }

  function isInputFocused() {
    const a = root.activeElement;
    return a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT');
  }

  function handleEscape() {
    const $ = (id) => shadow.getElementById(id);
    if ($('iwAnnoInput').classList.contains('show')) { $('iwAnnoInput').classList.remove('show'); return; }
    if ($('iwCtxMenu').classList.contains('show')) { $('iwCtxMenu').classList.remove('show'); return; }
    if (activeOverlay) { closeOverlay(); return; }
    const pop = $('iwPopup');
    if (pop.classList.contains('pinned')) { hidePopup(); }
  }

  /* ====================================================================
     文章渲染（技术文档 4.4 节 renderArticle 6 步流水线）
     ==================================================================== */
  function renderArticle(id) {
    const $ = (id2) => shadow.getElementById(id2);
    currentArticle = id;
    const a = IW.ARTICLES.find(x => x.id === id);
    if (!a) { return; }
    $('iwArtLead').textContent = a.angle;
    $('iwArtTitle').textContent = a.title;
    $('iwArtMeta').innerHTML = '<span class="meta-angle">' + a.angle + '</span><span>·</span><span>' + a.source + '</span><span>·</span><span>' + a.date + '</span>';
    $('iwArtBody').innerHTML = a.html;
    $('iwSwNum').textContent = CIRC[id - 1];
    $('iwSwTitle').textContent = a.title;
    root.querySelectorAll('.switcher-item').forEach(el => {
      el.classList.toggle('cur', +el.dataset.aid === id);
    });
    root.scrollTop = 0;
    attachAnno();
    renderUserAnnotationsInline();
    buildMarkers();
    updateProgress();
    if (id === 1 && !hintShown) {
      hintShown = true;
      setTimeout(() => {
        const first = root.querySelector('.iw-anno');
        if (first) { first.classList.add('hint-pulse'); setTimeout(() => first.classList.remove('hint-pulse'), 5200); }
      }, 600);
    }
  }

  function buildSwitcher() {
    const menu = shadow.getElementById('iwSwMenu');
    menu.innerHTML = '<div class="switcher-head">5篇聚合 · 同一事件不同角度</div>' +
      IW.ARTICLES.map(a => `
        <div class="switcher-item ${a.id === currentArticle ? 'cur' : ''}" data-aid="${a.id}">
          <div class="si-num">${CIRC[a.id - 1]}</div>
          <div class="si-main">
            <div class="si-title">${a.title}</div>
            <div class="si-sub"><span class="si-angle">${a.angle}</span><span>·</span><span>${a.source}</span><span>·</span><span>${a.date}</span></div>
          </div>
        </div>`).join('');
    menu.querySelectorAll('.switcher-item').forEach(el => {
      el.addEventListener('click', () => {
        renderArticle(+el.dataset.aid);
        shadow.getElementById('iwSwitcher').classList.remove('open');
      });
    });
  }

  /* ====================================================================
     标注悬停浮窗（技术文档 5.2 节）
     ==================================================================== */
  let hideTimer = null;
  function attachAnno() {
    root.querySelectorAll('.iw-anno').forEach(el => {
      el.addEventListener('mouseenter', () => showPopup(el));
      el.addEventListener('mouseleave', hidePopupDelay);
      el.addEventListener('click', (e) => { e.stopPropagation(); showPopup(el, true); });
    });
  }

  function hidePopupDelay() {
    const pop = shadow.getElementById('iwPopup');
    if (pop.classList.contains('pinned')) { return; }
    clearTimeout(hideTimer);
    hideTimer = setTimeout(hidePopup, 180);
  }

  function hidePopup() {
    const pop = shadow.getElementById('iwPopup');
    pop.classList.remove('show', 'pinned');
    pinnedFid = null;
  }

  function showPopup(el, pin) {
    const pop = shadow.getElementById('iwPopup');
    if (pop.classList.contains('pinned') && !pin) { return; } // 钉住状态保护
    const fid = el.dataset.fid;
    const f = IW.FACTS[fid];
    if (!f) { return; }
    pop.innerHTML = buildPopupHTML(fid);
    if (pin) {
      pop.classList.add('pinned');
      pinnedFid = fid;
    } else {
      pop.classList.remove('pinned');
    }
    // 定位
    const r = el.getBoundingClientRect();
    pop.style.visibility = 'hidden';
    pop.classList.add('show');
    const pw = pop.offsetWidth, ph = pop.offsetHeight;
    pop.style.visibility = '';
    let top = r.top - ph - 12;
    if (r.top < 60) { top = r.bottom + 12; }
    let left = r.left + r.width / 2 - pw / 2;
    left = Math.max(12, Math.min(left, window.innerWidth - pw - 12));
    pop.style.top = top + 'px';
    pop.style.left = left + 'px';
    // 跳转按钮
    const jumpBtn = pop.querySelector('[data-jump]');
    if (jumpBtn) { jumpBtn.addEventListener('click', () => { hidePopup(); jumpToFact(fid); }); }
    const findMoreBtn = pop.querySelector('[data-findmore]');
    if (findMoreBtn) { findMoreBtn.addEventListener('click', () => { openOverlay('ai'); }); }
  }

  function buildPopupHTML(fid) {
    const f = IW.FACTS[fid];
    const m = IW.TYPE_META[f.type];
    let head, note = '', verifyEmpty = '', divergeBanner = '';
    if (f.type === 'confirmed') head = '<span class="pop-icon" style="background:#10b981">✓</span> 已确认（' + f.count + '篇一致）';
    else if (f.type === 'partial') head = '<span class="pop-icon" style="background:#eab308">◐</span> 部分确认（' + f.count + '篇提及）';
    else if (f.type === 'verify') {
      head = '<span class="pop-icon" style="background:#f59e0b">⚠</span> 待验证（仅1篇提及）';
      verifyEmpty = '<div class="pop-verify-empty"><span>🔍</span><span>此为单源孤证，建议寻找更多来源佐证</span></div>';
    } else if (f.type === 'diverge') {
      head = '<span class="pop-icon" style="background:#ef4444">⚠</span> 观点分歧';
      divergeBanner = '<div class="pop-diverge-banner">不同文章对此有不同判断，建议对比</div>';
    }
    const refsHTML = f.refs.map(r => {
      const srcName = r.aid === currentArticle ? '本文' : (IW.ARTICLES.find(a => a.id === r.aid) || {}).source || '文章' + r.aid;
      const isCur = r.aid === currentArticle;
      return '<div class="pop-ref"><div class="pop-ref-src">' + (isCur ? '<b>本文</b>' : srcName) + '</div><div class="pop-ref-text">' + r.excerpt + '</div></div>';
    }).join('');
    const jumpLabel = f.type === 'diverge' ? '对比分歧观点' : '跳转对比';
    const action = f.type === 'verify'
      ? '<div class="pop-action"><button class="pop-btn" data-jump="1">' + jumpLabel + '</button><button class="pop-btn" data-findmore="1">寻找更多来源</button></div>'
      : '<div class="pop-action"><button class="pop-btn" data-jump="1">' + jumpLabel + '</button></div>';
    return '<div class="pop-head">' + head + '</div>' + divergeBanner + '<div class="pop-refs">' + refsHTML + '</div>' + verifyEmpty + action;
  }

  /* ====================================================================
     智能跳转（技术文档 5.3 节，修正偏移4：查找当前文章以外的引用源）
     ==================================================================== */
  function jumpToFact(fid) {
    const f = IW.FACTS[fid];
    if (!f) { return; }
    const ref = f.refs.find(r => r.aid !== currentArticle) || f.refs[0];
    if (!ref) { return; }
    const doScroll = () => {
      const el = root.querySelector('[data-fid="' + fid + '"]');
      if (el) {
        const top = el.getBoundingClientRect().top + root.scrollTop - root.clientHeight * IW.SCROLL_OFFSET_RATIO;
        root.scrollTo({ top: top, behavior: 'smooth' });
        el.classList.add('flash');
        setTimeout(() => el.classList.remove('flash'), IW.FLASH_DURATION);
      }
    };
    if (ref.aid !== currentArticle) {
      renderArticle(ref.aid);
      setTimeout(doScroll, 120);
    } else {
      doScroll();
    }
  }

  /* ====================================================================
     滚动进度线 + 标记（技术文档 5.5 节）
     ==================================================================== */
  function updateProgress() {
    const wrap = shadow.getElementById('iwWrap');
    if (!wrap) { return; }
    const rail = shadow.getElementById('iwRail');
    const fill = shadow.getElementById('iwRailFill');
    const pct = Math.min(1, Math.max(0, root.scrollTop / (root.scrollHeight - root.clientHeight)));
    fill.style.height = (pct * 100) + '%';
    rail.classList.add('show');
    shadow.getElementById('iwPct').textContent = Math.round(pct * 100) + '%';
  }

  function buildMarkers() {
    const rail = shadow.getElementById('iwRail');
    // 清除旧标记
    rail.querySelectorAll('.progress-mark').forEach(el => el.remove());
    const wrap = shadow.getElementById('iwWrap');
    const seen = {};
    root.querySelectorAll('.iw-anno').forEach(el => {
      const fid = el.dataset.fid;
      if (seen[fid]) { return; }
      seen[fid] = true;
      const pct = (el.offsetTop - wrap.offsetTop) / wrap.offsetHeight;
      const clamped = Math.max(0.02, Math.min(0.98, pct));
      const mark = document.createElement('div');
      mark.className = 'progress-mark';
      mark.style.top = (clamped * 100) + '%';
      mark.style.background = IW.TYPE_META[el.dataset.type].color;
      mark.title = IW.FACTS[fid].label;
      mark.addEventListener('click', () => jumpToFact(fid));
      rail.appendChild(mark);
    });
  }

  /* ====================================================================
     文本选区与批注（技术文档 5.4 节、6.5 节，偏移6：高优先级思考入口）
     ==================================================================== */
  function handleTextSelection() {
    const sel = shadow.getSelection ? shadow.getSelection() : window.getSelection();
    if (!sel || sel.isCollapsed) { return; }
    const text = sel.toString();
    if (text.length < 2) { return; }
    const range = sel.getRangeAt(0);
    const artBody = shadow.getElementById('iwArtBody');
    if (!artBody || !artBody.contains(range.startContainer)) { return; }
    pendingSelection = { range, rect: range.getBoundingClientRect(), text };
    const menu = shadow.getElementById('iwCtxMenu');
    menu.style.top = (pendingSelection.rect.bottom + 8) + 'px';
    menu.style.left = Math.max(10, Math.min(pendingSelection.rect.left + pendingSelection.rect.width / 2 - 60, window.innerWidth - 140)) + 'px';
    menu.classList.add('show');
  }

  function handleCtxAction(act) {
    if (!pendingSelection) { return; }
    pendingAction = act;
    const menu = shadow.getElementById('iwCtxMenu');
    menu.classList.remove('show');
    if (act === 'annotate') {
      openAnnoInput();
    } else if (act === 'factcheck') {
      openOverlay('fc');
    } else if (act === 'wordanalyze') {
      openOverlay('wa');
    }
  }

    ).join('');
    let selectedType = IW.ANNO_TYPES[0].key;
    typesBox.querySelectorAll('.anno-type-btn').forEach((btn, i) => {

  function saveAnnotationFromInput() {
    const inp = shadow.getElementById('iwAnnoInput');
    const txt = shadow.getElementById('iwAnnoText');
    if (!pendingSelection) { return; }
    const note = txt.value.trim();
    if (!note) { txt.focus(); return; }
    const anno = {
      quote: pendingSelection.text,
      note: note,
      type: inp._getSelectedType ? inp._getSelectedType() : 'think',
      aid: currentArticle,
      time: Date.now()
    };
    send({ type: M.SAVE_ANNOTATION, payload: anno }).then(() => {
      userAnnotations.push(anno);
      inp.classList.remove('show');
      renderUserAnnotationsInline();
      updateAnnoBadge();
    });
  }

  /* ====================================================================
     批注内联渲染（技术文档 5.4 节，TreeWalker API）
     ==================================================================== */
  function renderUserAnnotationsInline() {
    const artBody = shadow.getElementById('iwArtBody');
    if (!artBody) { return; }
    const annos = userAnnotations.filter(a => a.aid === currentArticle);
    if (annos.length === 0) { return; }
    const walker = document.createTreeWalker(artBody, NodeFilter.SHOW_TEXT, null);
    const matches = [];
    let node;
    while ((node = walker.nextNode())) {
      if (node.parentElement && node.parentElement.classList.contains('user-anno')) { continue; }
      annos.forEach((a, idx) => {
        if (node.textContent.includes(a.quote)) { matches.push({ node, anno: a, idx }); }
      });
    }
    matches.forEach(({ node, anno }) => {
      const text = node.textContent;
      const pos = text.indexOf(anno.quote);
      if (pos < 0) { return; }
      const before = text.slice(0, pos);
      const match = text.slice(pos, pos + anno.quote.length);
      const after = text.slice(pos + anno.quote.length);
      const span = document.createElement('span');
      span.className = 'user-anno';
      span.textContent = match;
      span.title = anno.note;
      span.addEventListener('click', () => showAnnoDetail(anno));
      const parent = node.parentNode;
      parent.insertBefore(document.createTextNode(before), node);
      parent.insertBefore(span, node);
      parent.insertBefore(document.createTextNode(after), node);
      parent.removeChild(node);
    });
  }

  function showAnnoDetail(anno) {
    const pop = shadow.getElementById('iwPopup');
    const typeMeta = IW.ANNO_TYPES.find(t => t.key === anno.type) || IW.ANNO_TYPES[0];
    pop.innerHTML = '<div class="pop-head"><span class="pop-icon" style="background:' + typeMeta.color + '">' + typeMeta.icon + '</span> 个人批注 · ' + typeMeta.label + ' <span style="font-size:10px;color:#ec4899;font-weight:700;margin-left:auto">高优先级</span></div>' +
      '<div class="pop-ref"><div class="pop-ref-src">原文摘录</div><div class="pop-ref-text" style="font-style:italic">' + anno.quote + '</div></div>' +
      '<div class="pop-ref" style="background:#f5f3ff"><div class="pop-ref-src">我的批注</div><div class="pop-ref-text">' + anno.note + '</div></div>' +
      '<div class="pop-action"><button class="pop-btn" id="iwDelAnno">删除批注</button></div>';
    pop.classList.add('show', 'pinned');
    const delBtn = pop.querySelector('#iwDelAnno');
    if (delBtn) {
      delBtn.addEventListener('click', () => {
        send({ type: M.DELETE_ANNOTATION, payload: { quote: anno.quote, aid: anno.aid } }).then(() => {
          userAnnotations = userAnnotations.filter(a => !(a.quote === anno.quote && a.aid === anno.aid));
          hidePopup();
          renderArticle(currentArticle);
          updateAnnoBadge();
        });
      });
    }
  }

  function updateAnnoBadge() {
    const badge = shadow.getElementById('iwAnnoBadge');
    if (badge) {
      const count = userAnnotations.length;
      badge.style.display = count > 0 ? 'block' : 'none';
      badge.textContent = count > 9 ? '9+' : count;
    }
  }

  /* ====================================================================
     Dock 浮层系统（技术文档 6.4 节）
     ==================================================================== */
  function openOverlay(key) {
    const $ = (id) => shadow.getElementById(id);
    if (activeOverlay === key) { closeOverlay(); return; }
    closeOverlay();
    const conf = IW.OVERLAY_CONF[key];
    $('iwOvTitle').innerHTML = '<span class="overlay-icon" style="background:' + conf.color + '">' + conf.icon + '</span>' + conf.title;
    let html = '';
    switch (key) {
      case 'agg': html = buildAggregate(); break;
      case 'graph': html = buildGraph(); break;
      case 'cmt': html = buildComments(); break;
      case 'tl': html = buildTimeline(); break;
      case 'ai': html = buildAISearch(); break;
      case 'anno': html = buildUserAnnotations(); break;
      case 'fc': html = buildFactCheck(); break;
      case 'wa': html = buildWordAnalysis(); break;
    }
    $('iwOvBody').innerHTML = html;
    $('iwOverlay').classList.add('show');
    $('iwScrim').classList.add('show');
    activeOverlay = key;
    root.querySelectorAll('.dock-btn').forEach(b => {
      const active = b.dataset.overlay === key;
      b.classList.toggle('active', active);
      if (active) { b.style.background = conf.color; } else { b.style.background = ''; }
    });
    bindOverlayEvents(key);
  }

  function closeOverlay() {
    const $ = (id) => shadow.getElementById(id);
    $('iwOverlay').classList.remove('show');
    $('iwScrim').classList.remove('show');
    activeOverlay = null;
    root.querySelectorAll('.dock-btn').forEach(b => { b.classList.remove('active'); b.style.background = ''; });
  }

  function bindOverlayEvents(key) {
    if (key === 'agg' || key === 'fc') {
      root.querySelectorAll('.agg-item, .fc-item').forEach(el => {
        el.addEventListener('click', () => {
          const fid = el.dataset.fid;
          if (fid) { closeOverlay(); jumpToFact(fid); }
        });
      });
    } else if (key === 'graph') {
      root.querySelectorAll('.graph-node').forEach(el => {
        el.addEventListener('click', () => {
          const fids = (el.dataset.fids || '').split(',').filter(Boolean);
          for (const fid of fids) {
            const target = IW.FACTS[fid];
            if (target && target.refs.some(r => r.aid === currentArticle)) {
              closeOverlay(); jumpToFact(fid); return;
            }
          }
          if (fids[0]) { closeOverlay(); jumpToFact(fids[0]); }
        });
      });
    } else if (key === 'cmt') {
      root.querySelectorAll('.cmt-reply-btn').forEach(btn => {
        btn.addEventListener('click', () => toggleReplyInput(btn.dataset.cid));
      });
    } else if (key === 'anno') {
      root.querySelectorAll('.anno-act').forEach(btn => {
        const act = btn.dataset.act;
        const idx = +btn.dataset.idx;
        if (act === 'jump') {
          const a = userAnnotations[idx];
          if (a) { closeOverlay(); if (a.aid !== currentArticle) { renderArticle(a.aid); } setTimeout(() => {
            const walker = document.createTreeWalker(shadow.getElementById('iwArtBody'), NodeFilter.SHOW_TEXT);
            let node;
            while ((node = walker.nextNode())) {
              if (node.textContent.includes(a.quote) && node.parentElement && node.parentElement.classList.contains('user-anno')) {
                const top = node.getBoundingClientRect().top + root.scrollTop - root.clientHeight * 0.4;
                root.scrollTo({ top, behavior: 'smooth' });
                node.parentElement.classList.add('flash');
                setTimeout(() => node.parentElement.classList.remove('flash'), IW.FLASH_DURATION);
                break;
              }
            }
          }, 150); }
        } else if (act === 'del') {
          const a = userAnnotations[idx];
          if (a) {
            send({ type: M.DELETE_ANNOTATION, payload: { quote: a.quote, aid: a.aid } }).then(() => {
              userAnnotations.splice(idx, 1);
              openOverlay('anno');
              updateAnnoBadge();
            });
          }
        }
      });
    }
  }

  /* ====================================================================
     渲染层：8 个浮层 builder（技术文档 4.4 节）
     ==================================================================== */

  // 聚合视图
  function buildAggregate() {
    const groups = { confirmed: [], partial: [], verify: [], diverge: [] };
    Object.keys(IW.FACTS).forEach(fid => {
      const f = IW.FACTS[fid];
      if (groups[f.type]) { groups[f.type].push({ fid, f }); }
    });
    const order = ['confirmed', 'partial', 'verify', 'diverge'];
    return order.map(type => {
      const items = groups[type];
      if (items.length === 0) { return ''; }
      const meta = IW.TYPE_META[type];
      return '<div class="agg-group"><div class="agg-group-head"><span class="agg-dot" style="background:' + meta.color + '"></span>' + meta.name + '（' + items.length + '）</div>' +
        items.map(({ fid, f }) => '<div class="agg-item" data-fid="' + fid + '"><div class="agg-item-label">' + f.label + '</div><div class="agg-item-meta">' + f.count + ' 篇文章引用 · ' + f.refs.map(r => '文' + r.aid).join('/') + '</div></div>').join('') +
        '</div>';
    }).join('');
  }

  // 实体图谱（SVG 8节点7边）
  function buildGraph() {
    const nodes = [
      { id: 'tata', x: 250, y: 60, r: 26, label: '塔塔电子', sub: '事件主体', c: '#4f46e5', facts: ['630gb', 'tata-statement'] },
      { id: 'worldleaks', x: 90, y: 150, r: 22, label: 'World Leaks', sub: '攻击组织', c: '#ef4444', facts: ['worldleaks'] },
      { id: 'apple', x: 410, y: 150, r: 24, label: '苹果', sub: '供应链上游', c: '#0891b2', facts: ['iphone18'] },
      { id: 'data', x: 130, y: 270, r: 22, label: '630GB 数据', sub: '泄露内容', c: '#f59e0b', facts: ['630gb', '20wan', 'iphone18'] },
      { id: 'ransom', x: 270, y: 320, r: 20, label: '4000万赎金', sub: '勒索金额', c: '#ef4444', facts: ['ransom'] },
      { id: 'darkweb', x: 50, y: 320, r: 20, label: '暗网', sub: '数据流向', c: '#8a8a8a', facts: ['darkweb'] },
      { id: 'china', x: 410, y: 320, r: 22, label: '中国代工', sub: '对比参照', c: '#10b981', facts: ['security0812', 'china-concentration'] },
      { id: 'vpn', x: 270, y: 130, r: 18, label: 'VPN 0day', sub: '攻击向量', c: '#f59e0b', facts: ['vpn-zero-day'] }
    ];
    const edges = [
      { from: 'worldleaks', to: 'tata', label: '攻击' },
      { from: 'tata', to: 'apple', label: '代工' },
      { from: 'tata', to: 'data', label: '泄露' },
      { from: 'worldleaks', to: 'ransom', label: '勒索' },
      { from: 'data', to: 'darkweb', label: '流出' },
      { from: 'tata', to: 'vpn', label: '利用漏洞' },
      { from: 'tata', to: 'china', label: '对比' }
    ];
    const nodeMap = {}; nodes.forEach(n => nodeMap[n.id] = n);
    let svg = '<svg class="graph-svg" viewBox="0 0 500 380">';
    edges.forEach(e => {
      const a = nodeMap[e.from], b = nodeMap[e.to];
      svg += '<line class="graph-edge" x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '"/>';
      svg += '<text class="graph-edge-label" x="' + ((a.x + b.x) / 2) + '" y="' + ((a.y + b.y) / 2 - 4) + '" text-anchor="middle">' + e.label + '</text>';
    });
    nodes.forEach(n => {
      svg += '<g class="graph-node" data-fids="' + n.facts.join(',') + '">';
      svg += '<circle cx="' + n.x + '" cy="' + n.y + '" r="' + n.r + '" fill="' + n.c + '" opacity="0.85"/>';

      svg += '</g>';
    });
    svg += '</svg>';
    return svg + '<div style="font-size:11px;color:#8a8a8a;text-align:center;margin-top:8px">点击节点跳转到相关事实标注</div>';
  }

  // 评论分析（三维体系：环形图+词云+情感条，技术文档 5.6/5.7 节）
  function buildComments() {
    return IW.COMMENT_ANALYSIS.map(p => {
      const r = 45;
      const C = 2 * Math.PI * r;
      const total = p.sentiment.positive + p.sentiment.neutral + p.sentiment.negative || 1;
      const negDash = C * (p.sentiment.negative / total);
      const neuDash = C * (p.sentiment.neutral / total);
      const posDash = C * (p.sentiment.positive / total);
      // 环形图
      const ring = '<svg width="120" height="120" viewBox="0 0 110 110">' +
        '<circle cx="55" cy="55" r="' + r + '" fill="none" stroke="#f0eee9" stroke-width="12"/>' +
        '<g transform="rotate(-90 55 55)">' +
        '<circle cx="55" cy="55" r="' + r + '" fill="none" stroke="#ef4444" stroke-width="12" stroke-dasharray="' + negDash + ' ' + (C - negDash) + '" stroke-dashoffset="' + (C * 0.25) + '"/>' +
        '<circle cx="55" cy="55" r="' + r + '" fill="none" stroke="#8a8a8a" stroke-width="12" stroke-dasharray="' + neuDash + ' ' + (C - neuDash) + '" stroke-dashoffset="' + (C * 0.25 - negDash) + '"/>' +
        '<circle cx="55" cy="55" r="' + r + '" fill="none" stroke="#10b981" stroke-width="12" stroke-dasharray="' + posDash + ' ' + (C - posDash) + '" stroke-dashoffset="' + (C * 0.25 - negDash - neuDash) + '"/>' +
        '</g></svg>';
      // 词云
      const wc = p.wordCloud.map((w, i) => {
        const angle = (i / p.wordCloud.length) * Math.PI * 2;
        const radius = 45 + w.s * 0.4;
        const x = 50 + Math.cos(angle) * radius * 0.7;
        const y = 50 + Math.sin(angle) * radius * 0.45;
        const color = w.sent === 'neg' ? '#ef4444' : (w.sent === 'pos' ? '#10b981' : '#8a8a8a');
        const opacity = 0.6 + w.s / 50;
        return '<span class="cmt-wc-word" style="left:' + x + '%;top:' + y + '%;font-size:' + (8 + w.s * 0.25) + 'px;color:' + color + ';opacity:' + opacity + '">' + w.w + '</span>';
      }).join('');
      // 情感细分条
      const emo = p.emotions.map(e => '<div class="cmt-emo"><span class="cmt-emo-label">' + e[0] + '</span><div class="cmt-emo-bar"><div class="cmt-emo-fill" style="width:' + e[1] + '%;background:' + e[2] + '"></div></div><span class="cmt-emo-val">' + e[1] + '%</span></div>').join('');
      // 热门评论 + 回复
      const replies = commentReplies[p.hotComments[0] ? p.hotComments[0].id : ''] || [];
      const hot = p.hotComments.map(c => {
        const reps = (commentReplies[c.id] || []).map(rp => {
          const tag = IW.REPLY_TAGS.find(t => t.key === rp.type) || IW.REPLY_TAGS[0];
          return '<div class="cmt-reply"><span style="color:' + tag.color + ';font-weight:600">[' + tag.label + ']</span> ' + escapeHtml(rp.text) + '</div>';
        }).join('');
        return '<div class="cmt-hot-item"><div class="cmt-hot-text">' + escapeHtml(c.text) + '</div><div class="cmt-hot-meta"><span>👍 ' + c.likes + '</span><span class="cmt-reply-btn" data-cid="' + c.id + '">回复</span></div>' + reps + '<div class="cmt-reply-input" id="replyInput_' + c.id + '"><textarea placeholder="你的思考…"></textarea><div class="cmt-reply-tags">' + IW.REPLY_TAGS.map((t, i) => '<span class="cmt-tag ' + (i === 0 ? 'sel' : '') + '" data-tag="' + t.key + '" style="' + (i === 0 ? 'background:' + t.color + ';border-color:transparent' : '') + '">' + t.label + '</span>').join('') + '</div><button class="ai-save" style="margin-top:6px;padding:5px 12px" data-cid="' + c.id + '">提交回复</button></div></div>';
      }).join('');
      return '<div class="cmt-platform"><div class="cmt-head"><div class="cmt-ic" style="background:' + p.c + '">' + p.ic + '</div><div><div class="cmt-plat">' + p.plat + '</div><div class="cmt-count">' + p.count + '</div></div></div>' +
        '<div class="cmt-row"><div class="cmt-ring-box">' + ring + '<div style="font-size:10px;color:#8a8a8a;margin-top:-8px">红=负 灰=中 绿=正</div></div><div class="cmt-wc-box">' + wc + '</div></div>' +
        '<div class="cmt-emotions">' + emo + '</div>' +
        '<div class="cmt-hot">' + hot + '</div></div>';
    }).join('');
  }

  function toggleReplyInput(cid) {
    const inp = shadow.getElementById('replyInput_' + cid);
    if (!inp) { return; }
    inp.classList.toggle('show');
    if (inp.classList.contains('show')) {
      // 标签切换
      inp.querySelectorAll('.cmt-tag').forEach((tag, i) => {
        tag.addEventListener('click', () => {
          inp.querySelectorAll('.cmt-tag').forEach(t => { t.classList.remove('sel'); t.style.background = ''; t.style.borderColor = ''; });
          tag.classList.add('sel');
          tag.style.background = IW.REPLY_TAGS[i].color;
          tag.style.borderColor = 'transparent';
        });
      });
      const submitBtn = inp.querySelector('button[data-cid]');
      if (submitBtn) {
        submitBtn.addEventListener('click', () => {
          const text = inp.querySelector('textarea').value.trim();
          if (!text) { return; }
          const selTag = inp.querySelector('.cmt-tag.sel');
          const type = selTag ? selTag.dataset.tag : 'think';
          send({ type: M.SAVE_REPLY, payload: { cid: cid, reply: { type: type, text: text } } }).then(() => {
            if (!commentReplies[cid]) { commentReplies[cid] = []; }
            commentReplies[cid].push({ type, text, time: Date.now() });
            openOverlay('cmt');
          });
        });
      }
    }
  }

  // AI 搜索聚合（技术文档 5.8 节，长链推导展开）
  function buildAISearch() {
    return IW.AI_SOURCES.map(cat => {
      const items = cat.items.map(item => {
        const chainHTML = item.chain.map((node, i) => {
          const sColor = node.s === 'strong' ? '#10b981' : (node.s === 'medium' ? '#f59e0b' : '#ef4444');
          const sLabel = node.s === 'strong' ? '强' : (node.s === 'medium' ? '中' : '弱');
          return '<span class="ai-chain-node">' + node.n + '</span>' + (i < item.chain.length - 1 ? '<span class="ai-chain-arrow">→<span class="ai-chain-strength" style="background:' + sColor + ';color:#fff">' + sLabel + '</span></span>' : '');
        }).join('');
        const strengthBadge = '<span class="ai-strength-badge" style="background:' + (item.strength === 'strong' ? '#10b981' : (item.strength === 'medium' ? '#f59e0b' : '#ef4444')) + ';color:#fff">' + (item.strength === 'strong' ? '强关联' : (item.strength === 'medium' ? '中关联' : '弱关联')) + '</span>';
        const sig = (item.chain.length > IW.LONG_CHAIN_THRESHOLD && item.significance) ? '<div class="ai-significance">' + item.significance + '</div>' : '';
        return '<div class="ai-item" style="border-left-color:' + (item.strength === 'strong' ? '#10b981' : (item.strength === 'medium' ? '#f59e0b' : '#ef4444')) + '"><div class="ai-item-title">' + escapeHtml(item.title) + strengthBadge + '</div><div class="ai-item-src">' + item.source + ' · ' + item.date + '</div><div class="ai-chain">' + chainHTML + '</div>' + sig + '</div>';
      }).join('');
      return '<div class="ai-cat"><div class="ai-cat-head"><span style="color:' + cat.color + '">' + cat.cat + '</span>（' + cat.items.length + '条）</div>' + items + '</div>';
    }).join('');
  }

  // 合并时间轴
  function buildTimeline() {
    const events = [
      { date: '6月12日', content: 'World Leaks 在暗网发布声明，声称攻破塔塔电子服务器', sources: '文1/文2/文3' },
      { date: '6月13日', content: '塔塔电子启动应急响应，确认20万份文件失窃', sources: '文2' },
      { date: '6月14日', content: '泄露样本在暗网流传，iPhone 18 Pro设计图纸现身', sources: '文2/文4' },
      { date: '6月15日', content: '安全研究机构确认数据真实性', sources: '文2' },
      { date: '6月16日', content: '塔塔电子发表声明确认网络入侵', sources: '文1/文2/文5' },
      { date: '6月17日', content: '苹果派遣安全团队赴印度，TechCrunch报道', sources: '文2/文5' },
      { date: '6月18日', content: '产业链分析：花旗上调长电科技目标价', sources: '文1' },
      { date: '6月19日', content: '深度评论：印度制造信任危机', sources: '文3/文4' }
    ];
    return events.map(e => '<div class="tl-item"><div class="tl-date">' + e.date + '</div><div class="tl-content"><div>' + e.content + '</div><div class="tl-sources">来源：' + e.sources + '</div></div></div>').join('');
  }

  // 事实核查
  function buildFactCheck() {
    return IW.FACT_CHECKS.map(fc => {
      const f = IW.FACTS[fc.fid];
      if (!f) { return ''; }
      const verdictMap = { confirmed: { label: '已确认', color: '#10b981' }, unverified: { label: '待验证', color: '#f59e0b' }, diverged: { label: '观点分歧', color: '#ef4444' } };
      const v = verdictMap[fc.verdict] || verdictMap.unverified;
      return '<div class="fc-item verdict-' + fc.verdict + '" data-fid="' + fc.fid + '"><div class="fc-label">' + f.label + '</div><div class="fc-verdict" style="background:' + v.color + ';color:#fff">' + v.label + ' · ' + fc.sources + '源</div><div class="fc-note">' + fc.note + '</div></div>';
    }).join('');
  }

  // 用词分析
  function buildWordAnalysis() {
    return IW.WORD_ANALYSIS.map(cat => {
      const words = cat.words.map(w => '<div class="wa-word"><div class="wa-word-head"><span class="wa-word-text" style="color:' + cat.color + '">' + w.word + '</span><span class="wa-word-freq">出现 ' + w.freq + ' 次 · 文' + w.articles.join('/') + '</span></div><div class="wa-note">' + w.note + '</div></div>').join('');
      return '<div class="wa-cat"><div class="wa-cat-head" style="color:' + cat.color + '">' + cat.cat + '</div>' + words + '</div>';
    }).join('');
  }

  // 用户批注列表
  function buildUserAnnotations() {
    if (userAnnotations.length === 0) {
      return '<div class="anno-empty">还没有批注。选中文本即可添加你的思考——这是系统中优先级最高的信息。</div>';
    }
    return userAnnotations.map((a, idx) => {
      const typeMeta = IW.ANNO_TYPES.find(t => t.key === a.type) || IW.ANNO_TYPES[0];
      const artTitle = (IW.ARTICLES.find(x => x.id === a.aid) || {}).title || '';
      return '<div class="anno-item"><div class="anno-item-head"><span class="anno-type" style="background:' + typeMeta.color + '">' + typeMeta.label + '</span><span class="anno-priority">★ 高优先级</span></div><div class="anno-quote">' + escapeHtml(a.quote) + '</div><div class="anno-note">' + escapeHtml(a.note) + '</div><div class="anno-actions"><button class="anno-act" data-act="jump" data-idx="' + idx + '">跳转原文</button><button class="anno-act" data-act="del" data-idx="' + idx + '">删除</button></div><div style="font-size:10px;color:#8a8a8a;margin-top:5px">' + artTitle + '</div></div>';
    }).join('');
  }

  /* ====================================================================
     工具函数
     ==================================================================== */
  function escapeHtml(s) {
    if (!s) { return ''; }
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  /* ====================================================================
     持久化数据加载
     ==================================================================== */
  function loadPersistedData() {
    send({ type: M.GET_ANNOTATIONS }).then(async (arr) => {
      userAnnotations = Array.isArray(arr) ? arr : [];
      // Demo 模式首次加载注入预置批注（展示批注功能效果）
      if (userAnnotations.length === 0 && IW.DEMO_MODE) {
        const seeds = [
          { quote: '引发苹果保密体系的严重担忧', note: '这个表述将责任归于苹果保密体系，但泄密发生在代工厂端。需区分苹果保密协议与代工厂安全治理的边界。', type: 'think', aid: 1, time: Date.now() - 86400000 * 2 },
          { quote: '供应链多元化是长期战略', note: '这个判断是否过于乐观？若安全事件持续发生，产业转移节奏可能不降反升——企业会更急于分散风险而非维持现状。', type: 'question', aid: 3, time: Date.now() - 86400000 },
          { quote: '苹果必须在成本优势与安全风险之间重新权衡', note: '联想到三星Note7事件后的供应链改革，苹果可能也需要建立分级安全认证体系，而非简单依赖代工厂自查。', type: 'associate', aid: 4, time: Date.now() - 21600000 }
        ];
        for (const a of seeds) { await send({ type: M.SAVE_ANNOTATION, payload: a }); }
        userAnnotations = seeds;
      }
      if (panelOpen) { renderUserAnnotationsInline(); }
      updateAnnoBadge();
    });
    send({ type: M.GET_REPLIES }).then(async (obj) => {
      commentReplies = obj || {};
      // Demo 模式首次加载注入预置评论回复（展示四标签回复功能）
      if (Object.keys(commentReplies).length === 0 && IW.DEMO_MODE) {
        const seedReplies = {
          'wb1': [{ type: 'fact', text: '「不靠谱」的结论需更多数据支撑。目前仅1篇文章提及安全投入0.8%-1.2%，且未找到原始研究报告出处。', time: Date.now() - 86400000 }],
          'zh2': [{ type: 'think', text: 'VPN零日漏洞说法确实需要更多技术细节。若属实，说明塔塔电子网络边界防护存在系统性缺陷，而非单个漏洞。', time: Date.now() - 43200000 }],
          'hn1': [{ type: 'modal', text: '"unverified"措辞谨慎。供应链安全领域，未经证实的信息传播同样危险，需区分推测与事实。', time: Date.now() - 10800000 }]
        };
        for (const cid in seedReplies) {
          for (const r of seedReplies[cid]) { await send({ type: M.SAVE_REPLY, payload: { cid, reply: r } }); }
        }
        commentReplies = seedReplies;
      }
    });
  }

  /* ====================================================================
     监听 background 广播
     ==================================================================== */
  function listenToBackground() {
    if (typeof chrome !== 'undefined' && chrome.runtime && chrome.runtime.onMessage) {
      chrome.runtime.onMessage.addListener((msg, sender, sendResponse) => {
        if (!msg) { return false; }
        if (msg.type === M.ANNOTATIONS_UPDATED) {
          userAnnotations = msg.payload || [];
          if (panelOpen) { renderUserAnnotationsInline(); }
          updateAnnoBadge();
        } else if (msg.type === M.FACTS_UPDATED) {
          IW.FACTS = msg.payload || IW.FACTS;
          if (panelOpen) { renderArticle(currentArticle); }
        } else if (msg.type === 'iw_toggle_panel') {
          togglePanel();
        } else if (msg.type === 'iw_open_anno') {
          if (!panelOpen) { togglePanel(); }
          // 预填批注（来自上下文菜单的选中文本）
          pendingSelection = { text: msg.payload.quote, rect: { bottom: 200, left: 100 } };
          pendingAction = 'annotate';
          openAnnoInput();
        } else if (msg.type === 'iw_aggregate_self') {
          // 将当前页面注册到聚合库
          send({ type: M.AGGREGATE_ARTICLE, payload: { url: msg.payload.url, title: msg.payload.title, source: location.hostname, angle: '当前页面', date: new Date().toISOString().slice(0, 10) } });
        } else if (msg.type === 'iw_open_overlay') {
          // Popup 请求打开指定浮层（agg/cmt/ai 等）
          if (!panelOpen) { togglePanel(); }
          if (msg.payload && msg.payload.key) { openOverlay(msg.payload.key); }
        }
        return false;
      });
    }
  }

  /* ---------- 启动 ---------- */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})(self.IW = self.IW || {});

  </script>

  <!-- Demo post-bootstrap: auto-open + control bar -->
  <script>
  (function () {
    'use strict';

    /* 自动打开沉浸面板（模拟点击 FAB），然后隐藏 FAB */
    function autoOpen() {
      var fab = document.querySelector('.iw-fab');
      if (fab) {
        fab.click();
        fab.style.display = 'none';
      } else {
        setTimeout(autoOpen, 50);
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function () { setTimeout(autoOpen, 50); });
    } else {
      setTimeout(autoOpen, 50);
    }

    /* Demo 控制条：mock/real 切换 */
    function buildDemoBar() {
      var bar = document.createElement('div');
      bar.id = 'iw-demo-bar';
      bar.innerHTML =
        '<span class="iw-demo-label">数据源</span>' +
        '<button data-mode="mock" class="iw-demo-btn active">Mock</button>' +
        '<button data-mode="real" class="iw-demo-btn">Real</button>' +
        '<span class="iw-demo-hint" id="iwDemoHint">静态预设数据</span>';
      document.body.appendChild(bar);

      var hint = bar.querySelector('#iwDemoHint');
      function applyMode(mode) {
        bar.querySelectorAll('.iw-demo-btn').forEach(function (b) {
          b.classList.toggle('active', b.dataset.mode === mode);
        });
        hint.textContent = mode === 'real' ? '真实 API（需网络）' : '静态预设数据';
      }

      IW.storage.getSettings().then(function (s) {
        applyMode(s && s.dataMode ? s.dataMode : 'mock');
      });
      bar.querySelectorAll('.iw-demo-btn').forEach(function (b) {
        b.addEventListener('click', function () {
          var mode = b.dataset.mode;
          applyMode(mode);
          IW.storage.saveSettings({ dataMode: mode });
        });
      });
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function () { setTimeout(buildDemoBar, 100); });
    } else {
      setTimeout(buildDemoBar, 100);
    }
  })();
  </script>
