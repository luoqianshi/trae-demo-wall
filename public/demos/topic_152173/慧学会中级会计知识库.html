<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>慧学会 · 中级会计知识库</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #3b82f6;
  --primary-dark: #1d4ed8;
  --accent: #06b6d4;
  --gold: #f59e0b;
  --green: #10b981;
  --purple: #8b5cf6;
  --pink: #ec4899;
  --red: #ef4444;
  --bg-dark: #0f172a;
  --bg-card: #1e293b;
  --bg-hover: #334155;
  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --border: #334155;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--bg-dark);
  color: var(--text-primary);
  overflow-x: hidden;
  min-height: 100vh;
}

#particles-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
  pointer-events: none;
}

/* 音乐播放器 */
.music-player {
  position: fixed;
  bottom: 20px;
  left: 20px;
  z-index: 50;
  background: rgba(30, 41, 59, 0.95);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: 50px;
  padding: 8px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  transition: all 0.3s ease;
}

.music-player:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(0,0,0,0.4);
}

.music-player.playing .music-btn {
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(6, 182, 212, 0.4); }
  50% { box-shadow: 0 0 0 8px rgba(6, 182, 212, 0); }
}

.music-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.9rem;
  transition: all 0.2s ease;
  flex-shrink: 0;
}

.music-btn:hover {
  transform: scale(1.1);
}

.music-info {
  font-size: 0.8rem;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100px;
  cursor: pointer;
  transition: color 0.2s;
}

.music-info:hover {
  color: var(--accent);
}

.music-volume {
  width: 50px;
  height: 4px;
  -webkit-appearance: none;
  background: var(--bg-hover);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}

.music-volume::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  transition: transform 0.2s;
}

.music-volume::-webkit-slider-thumb:hover {
  transform: scale(1.2);
}

/* 工具菜单 */
.tool-menu {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 50;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 10px;
}

.tool-main-btn {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, #8b5cf6, #06b6d4);
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  box-shadow: 0 4px 20px rgba(139, 92, 246, 0.3);
  transition: all 0.3s ease;
}

.tool-main-btn:hover {
  transform: scale(1.1);
  box-shadow: 0 6px 25px rgba(139, 92, 246, 0.4);
}

.tool-main-btn.recording {
  background: linear-gradient(135deg, #ef4444, #f97316);
  animation: recordPulse 1.5s infinite;
}

@keyframes recordPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
  50% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
}

.tool-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
  opacity: 0;
  transform: translateY(10px);
  pointer-events: none;
  transition: all 0.3s ease;
}

.tool-actions.show {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.tool-action-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(30, 41, 59, 0.95);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text-primary);
  font-size: 0.85rem;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
}

.tool-action-btn:hover {
  background: rgba(59, 130, 246, 0.15);
  border-color: var(--primary);
  transform: translateX(-4px);
}

.tool-action-btn .icon {
  font-size: 1rem;
}

.tool-action-btn .label {
  font-weight: 500;
}

.tool-action-btn .desc {
  font-size: 0.7rem;
  color: var(--text-secondary);
  margin-top: 2px;
}

.tool-action-btn div {
  display: flex;
  flex-direction: column;
}

/* 录制计时器 */
.record-timer {
  position: fixed;
  bottom: 78px;
  right: 20px;
  z-index: 50;
  background: rgba(30, 41, 59, 0.95);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 0.8rem;
  color: var(--text-secondary);
  display: none;
  align-items: center;
  gap: 8px;
}

.record-timer.show {
  display: flex;
}

.record-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ef4444;
  animation: blink 1s infinite;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* 截图闪光效果 */
.screenshot-flash {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: white;
  opacity: 0;
  pointer-events: none;
  z-index: 9999;
  transition: opacity 0.1s ease;
}

.screenshot-flash.active {
  opacity: 0.5;
}

@media (max-width: 768px) {
  .tool-menu { bottom: 70px; right: 15px; }
  .tool-main-btn { width: 44px; height: 44px; font-size: 1.1rem; }
  .record-timer { bottom: 128px; right: 15px; }
}

/* 头部 */
header {
  position: relative;
  z-index: 10;
  padding: 50px 40px 30px;
  text-align: center;
  background: linear-gradient(180deg, rgba(59,130,246,0.15) 0%, transparent 100%);
  border-bottom: 1px solid var(--border);
}

.hero-title {
  font-size: 2.8rem;
  font-weight: 800;
  background: linear-gradient(135deg, var(--primary), var(--accent), var(--gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 10px;
  animation: fadeInUp 0.8s ease-out;
}

.hero-subtitle {
  font-size: 1rem;
  color: var(--text-secondary);
  margin-bottom: 24px;
  animation: fadeInUp 0.8s ease-out 0.1s both;
}

.search-container {
  max-width: 550px;
  margin: 0 auto 24px;
  position: relative;
  animation: fadeInUp 0.8s ease-out 0.2s both;
}

.search-input {
  width: 100%;
  padding: 14px 22px 14px 48px;
  font-size: 0.95rem;
  background: var(--bg-card);
  border: 2px solid var(--border);
  border-radius: 50px;
  color: var(--text-primary);
  outline: none;
  transition: all 0.3s ease;
}

.search-input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(59,130,246,0.2);
}

.search-icon {
  position: absolute;
  left: 18px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-secondary);
  font-size: 1.1rem;
}

.stats-bar {
  display: flex;
  justify-content: center;
  gap: 32px;
  flex-wrap: wrap;
  animation: fadeInUp 0.8s ease-out 0.3s both;
}

.stat-item { text-align: center; }

.stat-number {
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--accent);
}

.stat-label {
  font-size: 0.85rem;
  color: var(--text-secondary);
  margin-top: 2px;
}

/* Tab导航 */
.tab-nav {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 20px;
  padding: 0 20px;
  flex-wrap: wrap;
}

.tab-btn {
  padding: 10px 22px;
  border-radius: 50px;
  cursor: pointer;
  font-size: 0.9rem;
  font-weight: 500;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  transition: all 0.3s ease;
}

.tab-btn:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}

.tab-btn.active {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: white;
  border-color: transparent;
  box-shadow: 0 4px 15px rgba(59,130,246,0.4);
}

/* 分类导航 */
.nav-container {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(15,23,42,0.9);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 12px 30px;
}

.nav-tabs {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  max-width: 1400px;
  margin: 0 auto;
}

.nav-tab {
  padding: 8px 16px;
  border-radius: 50px;
  cursor: pointer;
  font-size: 0.85rem;
  font-weight: 500;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  transition: all 0.3s ease;
  white-space: nowrap;
}

.nav-tab:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
  transform: translateY(-1px);
}

.nav-tab.active {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: white;
  border-color: transparent;
}

/* 主内容 */
main {
  position: relative;
  z-index: 10;
  max-width: 1400px;
  margin: 0 auto;
  padding: 30px;
}

/* 章节标题 */
.section-title {
  font-size: 1.5rem;
  font-weight: 700;
  margin: 30px 0 18px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.section-icon {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.3rem;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  box-shadow: 0 4px 12px rgba(59,130,246,0.3);
}

.section-score {
  margin-left: auto;
  font-size: 0.85rem;
  color: var(--gold);
  background: rgba(245,158,11,0.15);
  padding: 4px 12px;
  border-radius: 20px;
}

/* 卡片网格 */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
  margin-bottom: 30px;
}

.knowledge-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
}

.knowledge-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.3s ease;
}

.knowledge-card:hover {
  transform: translateY(-4px);
  border-color: var(--primary);
  box-shadow: 0 16px 32px rgba(0,0,0,0.3), 0 0 0 1px rgba(59,130,246,0.2);
}

.knowledge-card:hover::before {
  transform: scaleX(1);
}

.card-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.card-icon {
  width: 36px;
  height: 36px;
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  flex-shrink: 0;
}

.card-title {
  font-size: 1rem;
  font-weight: 600;
  line-height: 1.4;
}

.card-desc {
  font-size: 0.85rem;
  color: var(--text-secondary);
  line-height: 1.6;
  margin-bottom: 12px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.tag {
  padding: 3px 8px;
  border-radius: 5px;
  font-size: 0.7rem;
  font-weight: 500;
  background: rgba(59,130,246,0.15);
  color: var(--primary);
}

.tag.highlight {
  background: rgba(245,158,11,0.15);
  color: var(--gold);
}

.tag.easy {
  background: rgba(16,185,129,0.15);
  color: var(--green);
}

.tag.hard {
  background: rgba(239,68,68,0.15);
  color: var(--red);
}

/* 答题模式按钮 */
.practice-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 10px;
  padding: 6px 12px;
  background: rgba(139,92,246,0.15);
  color: var(--purple);
  border: none;
  border-radius: 6px;
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.2s ease;
}

.practice-btn:hover {
  background: rgba(139,92,246,0.25);
}

/* 模态框 */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.modal-overlay.show {
  display: flex;
  opacity: 1;
}

.modal-content {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 18px;
  max-width: 750px;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  position: relative;
  transform: scale(0.9) translateY(20px);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.modal-overlay.show .modal-content {
  transform: scale(1) translateY(0);
}

.modal-header {
  padding: 24px 24px 16px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--bg-card);
  z-index: 1;
}

.modal-close {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: none;
  background: var(--bg-hover);
  color: var(--text-primary);
  font-size: 1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
}

.modal-close:hover {
  background: var(--primary);
  transform: rotate(90deg);
}

.modal-title {
  font-size: 1.3rem;
  font-weight: 700;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.modal-section {
  padding: 16px 24px;
}

.modal-section h3 {
  font-size: 1rem;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.modal-section p {
  color: var(--text-secondary);
  line-height: 1.8;
  margin-bottom: 8px;
  font-size: 0.9rem;
}

.modal-section ul {
  list-style: none;
  padding-left: 0;
}

.modal-section li {
  padding: 6px 0 6px 20px;
  position: relative;
  color: var(--text-secondary);
  line-height: 1.7;
  font-size: 0.9rem;
}

.modal-section li::before {
  content: '▸';
  position: absolute;
  left: 0;
  color: var(--primary);
  font-weight: bold;
}

.formula-box {
  background: rgba(59,130,246,0.1);
  border: 1px solid rgba(59,130,246,0.3);
  border-radius: 10px;
  padding: 12px 16px;
  margin: 10px 0;
  font-family: 'Courier New', monospace;
  font-size: 0.9rem;
  color: var(--accent);
  text-align: center;
}

.example-box {
  background: rgba(16,185,129,0.1);
  border: 1px solid rgba(16,185,129,0.3);
  border-radius: 10px;
  padding: 12px 16px;
  margin: 10px 0;
  font-size: 0.85rem;
  line-height: 1.7;
  color: var(--text-secondary);
}

.example-box strong {
  color: var(--green);
}

/* 题目样式 */
.question-box {
  background: rgba(139,92,246,0.08);
  border: 1px solid rgba(139,92,246,0.3);
  border-radius: 12px;
  padding: 16px;
  margin: 12px 0;
}

.question-text {
  font-size: 0.95rem;
  line-height: 1.7;
  margin-bottom: 12px;
  color: var(--text-primary);
}

.option-item {
  padding: 10px 14px;
  margin: 6px 0;
  background: var(--bg-dark);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s ease;
  font-size: 0.9rem;
}

.option-item:hover {
  border-color: var(--primary);
  background: rgba(59,130,246,0.1);
}

.option-item.selected {
  border-color: var(--primary);
  background: rgba(59,130,246,0.2);
}

.option-item.correct {
  border-color: var(--green);
  background: rgba(16,185,129,0.2);
}

.option-item.wrong {
  border-color: var(--red);
  background: rgba(239,68,68,0.2);
}

.submit-btn {
  margin-top: 12px;
  padding: 10px 24px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
}

.submit-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(59,130,246,0.4);
}

.answer-explanation {
  margin-top: 12px;
  padding: 12px;
  background: rgba(245,158,11,0.1);
  border: 1px solid rgba(245,158,11,0.3);
  border-radius: 8px;
  font-size: 0.85rem;
  line-height: 1.7;
  color: var(--text-secondary);
}

.answer-explanation strong {
  color: var(--gold);
}

/* 错题集页面 */
.wrong-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 12px;
}

.wrong-stats {
  display: flex;
  gap: 20px;
}

.wrong-stat {
  text-align: center;
  padding: 12px 24px;
  background: var(--bg-card);
  border-radius: 12px;
  border: 1px solid var(--border);
}

.wrong-stat-num {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--gold);
}

.wrong-stat-label {
  font-size: 0.8rem;
  color: var(--text-secondary);
  margin-top: 2px;
}

.wrong-filter {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.wrong-item {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
}

.wrong-item-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.wrong-chapter {
  font-size: 0.8rem;
  color: var(--accent);
  background: rgba(6,182,212,0.15);
  padding: 3px 8px;
  border-radius: 4px;
}

.wrong-date {
  font-size: 0.75rem;
  color: var(--text-secondary);
}

.wrong-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.wrong-action-btn {
  padding: 6px 14px;
  border: none;
  border-radius: 6px;
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.2s ease;
}

.btn-review {
  background: rgba(59,130,246,0.15);
  color: var(--primary);
}

.btn-review:hover { background: rgba(59,130,246,0.25); }

.btn-knowledge {
  background: rgba(139,92,246,0.15);
  color: var(--purple);
}

.btn-knowledge:hover { background: rgba(139,92,246,0.25); }

.btn-mastered {
  background: rgba(16,185,129,0.15);
  color: var(--green);
}

.btn-mastered:hover { background: rgba(16,185,129,0.25); }

/* 学习计划页面 */
.plan-setup {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 24px;
}

.plan-form-group {
  margin-bottom: 16px;
}

.plan-label {
  display: block;
  font-size: 0.9rem;
  color: var(--text-secondary);
  margin-bottom: 6px;
}

.plan-input {

function renderStats() {
  document.getElementById('totalKnowledge').textContent = knowledgeData.length;
  document.getElementById('totalQuestion').textContent = questionData.length;
  document.getElementById('wrongCount').textContent = getWrongQuestions().length;
}

function renderTabs() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTab = btn.dataset.tab;
      renderMainContent();
    });
  });
}

function renderCategoryNav() {
  document.querySelectorAll('.nav-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentCategory = tab.dataset.category;
      renderMainContent();
    });
  });
}

function renderMainContent() {
  const main = document.getElementById('mainContent');
  const categoryNav = document.getElementById('categoryNav');
  
  if (currentTab === 'knowledge') {
    categoryNav.style.display = 'block';
    renderKnowledgeTab(main);
  } else if (currentTab === 'practice') {
    categoryNav.style.display = 'block';
    renderPracticeTab(main);
  } else if (currentTab === 'wrong') {
    categoryNav.style.display = 'none';
    renderWrongTab(main);
  } else if (currentTab === 'plan') {
    categoryNav.style.display = 'none';
    renderPlanTab(main);
  }
}

function filterKnowledge() {
  let data = knowledgeData;
  
  if (currentCategory !== 'all') {
    data = data.filter(item => item.category === currentCategory);
  }
  
  if (searchQuery) {
    const query = searchQuery.toLowerCase();
    data = data.filter(item => 
      item.title.toLowerCase().includes(query) ||
      item.desc.toLowerCase().includes(query) ||
      item.tags.some(tag => tag.toLowerCase().includes(query)) ||
      item.content.overview.toLowerCase().includes(query)
    );
  }
  
  return data;
}

function renderKnowledgeTab(main) {
  const data = filterKnowledge();
  const chapters = {};
  
  data.forEach(item => {
    if (!chapters[item.chapterFull]) {
      chapters[item.chapterFull] = [];
    }
    chapters[item.chapterFull].push(item);
  });
  
  let html = '';
  for (const [chapter, items] of Object.entries(chapters)) {
    html += `
      <h2 class="section-title">
        <span class="section-icon">📖</span>
        ${chapter}
        <span class="section-progress">${items.length} 个知识点</span>
      </h2>
      <div class="card-grid">
        ${items.map(item => renderKnowledgeCard(item)).join('')}
      </div>
    `;
  }
  
  if (data.length === 0) {
    html = emptyState('🔍', '没有找到相关内容', '试试其他关键词吧');
  }
  
  main.innerHTML = html;
  
  document.querySelectorAll('.knowledge-card').forEach(card => {
    card.addEventListener('click', () => {
      const id = parseInt(card.dataset.kid);
      openKnowledgeModal(id);
    });
  });
}

function renderKnowledgeCard(item) {
  const highlightText = (text) => {
    if (!searchQuery) return text;
    const regex = new RegExp(`(${searchQuery})`, 'gi');
    return text.replace(regex, '<mark>$1</mark>');
  };
  
  const questionCount = item.questions ? item.questions.length : 0;
  
  return `
    <div class="knowledge-card" data-kid="${item.id}">
      <div class="card-header">
        <div class="card-icon" style="background: ${item.color}22; color: ${item.color}">${item.icon}</div>
        <div class="card-title">${highlightText(item.title)}</div>
      </div>
      <div class="card-desc">${highlightText(item.desc)}</div>
      <div class="card-tags">
        ${item.tags.map(tag => `
          <span class="tag ${tag.includes('高频') || tag.includes('重点') ? 'highlight' : tag.includes('基础') ? 'easy' : tag.includes('难') ? 'hard' : ''}">${tag}</span>
        `).join('')}
        ${questionCount > 0 ? `<span class="tag" style="background: rgba(139,92,246,0.15); color: var(--purple);">${questionCount}题</span>` : ''}
      </div>
    </div>
  `;
}

function renderQuestionCard(q) {
  const isAnswered = selectedQuestionAnswer[q.id] && selectedQuestionAnswer[q.id].submitted;
  const selected = selectedQuestionAnswer[q.id] ? selectedQuestionAnswer[q.id].selected : [];
  const kItem = knowledgeData.find(k => k.id === q.knowledgeId);
  
  let typeLabel = '🔘 单选题';
  if (q.type === 'multiple') typeLabel = '☑️ 多选题';
  if (q.type === 'judge') typeLabel = '✅ 判断题';
  
  return `
    <div class="question-box" id="question-${q.id}">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap; gap:8px;">
        <span style="font-size:0.8rem; color:var(--accent);">${typeLabel} · ${q.chapter}</span>
        ${kItem ? `
          <span style="font-size:0.8rem; cursor:pointer; color:var(--primary); display:inline-flex; align-items:center; gap:4px;" onclick="goToKnowledge(${q.knowledgeId})">
            📖 查看知识点 →
          </span>
        ` : ''}
      </div>
      <div class="question-text">${q.question}</div>
      ${q.options.map((opt, idx) => {
        let cls = 'option-item';
        if (selected.includes(idx)) cls += ' selected';
        if (isAnswered) {
          const isCorrect = q.answer.includes(String.fromCharCode(65 + idx));
          const wasSelected = selected.includes(idx);
          if (isCorrect) cls += ' correct';
          else if (wasSelected) cls += ' wrong';
        }
        return `<div class="${cls}" data-qid="${q.id}" data-idx="${idx}">${opt}</div>`;
      }).join('')}
      ${!isAnswered ? `
        <button class="submit-btn" data-qid="${q.id}">提交答案</button>
      ` : `
        <div class="answer-explanation">
          <strong>正确答案：${q.answer}</strong><br>
          ${q.explanation}
          ${kItem ? `
            <div style="margin-top:12px; padding-top:12px; border-top:1px solid var(--border);">
              <span style="font-size:0.85rem; cursor:pointer; color:var(--primary); display:inline-flex; align-items:center; gap:4px;" onclick="goToKnowledge(${q.knowledgeId})">
                📖 查看相关知识点：${kItem.title} →
              </span>
            </div>
          ` : ''}
        </div>
      `}
    </div>
  `;
}

function handleOptionClick(qId, optIdx) {
  const q = questionData.find(qq => qq.id === qId);
  if (!q || selectedQuestionAnswer[qId]?.submitted) return;
  
  if (!selectedQuestionAnswer[qId]) {
    selectedQuestionAnswer[qId] = { selected: [], submitted: false };
  }
  
  const selected = selectedQuestionAnswer[qId].selected;
  
  if (q.type === 'single') {
    selectedQuestionAnswer[qId].selected = [optIdx];
  } else {
    if (selected.includes(optIdx)) {
      selectedQuestionAnswer[qId].selected = selected.filter(i => i !== optIdx);
    } else {
      selectedQuestionAnswer[qId].selected = [...selected, optIdx];
    }
  }
  
  renderMainContent();
}

function handleSubmitAnswer(qId) {
  const q = questionData.find(qq => qq.id === qId);
  if (!q || !selectedQuestionAnswer[qId] || selectedQuestionAnswer[qId].submitted) return;
  
  const selected = selectedQuestionAnswer[qId].selected;
  if (selected.length === 0) {
    alert('请先选择一个答案');
    return;
  }
  
  selectedQuestionAnswer[qId].submitted = true;
  
  const userAnswer = selected.sort().map(i => String.fromCharCode(65 + i)).join('');
  const isCorrect = userAnswer === q.answer;
  
  // 如果错了，加入错题集
  if (!isCorrect) {
    addToWrongSet(qId);
  }
  
  renderMainContent();
  renderStats();
}

function addToWrongSet(qId) {
  const wrongs = getWrongQuestions();
  if (!wrongs.find(w => w.qId === qId)) {
    wrongs.unshift({
      qId,
      addedAt: new Date().toISOString(),
      mastered: false
    });
    saveWrongQuestions(wrongs);
  }
}

function openQuestionModal(qId) {
  closeModal();

    currentTab = 'practice';
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('[data-tab="practice"]').classList.add('active');
    renderMainContent();
    // 滚动到题目
    setTimeout(() => {
      const el = document.getElementById(`question-${qId}`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 200);
  }, 300);
}

      <span class="section-progress">${activeWrongs.length} 道</span>
    </h2>
  `;
  
  if (activeWrongs.length === 0) {
    html += emptyState('🎉', '太棒了！没有错题', '继续刷题，保持下去');
  } else {
    activeWrongs.forEach(w => {
      const q = questionData.find(qq => qq.id === w.qId);
      if (!q) return;
      const knowledge = knowledgeData.find(k => k.id === q.knowledgeId);
      
      html += `
        <div class="wrong-item">
          <div class="wrong-item-header">
            <span class="wrong-chapter">${q.chapter} · ${q.type === 'single' ? '单选' : q.type === 'judge' ? '判断' : '多选'}</span>
            <span class="wrong-date">${formatDate(w.addedAt)}</span>
          </div>
          <div style="font-size:0.9rem; line-height:1.7; margin-bottom:8px;">${q.question}</div>
          <div style="font-size:0.85rem; color: var(--gold);">正确答案：${q.answer}</div>
          <div class="wrong-actions">
            <button class="wrong-action-btn btn-review" onclick="reviewQuestion(${q.id})">📝 重新做</button>
            ${knowledge ? `<button class="wrong-action-btn btn-knowledge" onclick="goToKnowledge(${knowledge.id})">📖 查看知识点</button>` : ''}
            <button class="wrong-action-btn btn-mastered" onclick="markMastered(${q.id})">✅ 已掌握</button>
          </div>
        </div>
      `;
    });
  }
  
  if (masteredWrongs.length > 0) {
    html += `
      <h2 class="section-title">
        <span class="section-icon">✅</span>
        已掌握
        <span class="section-progress">${masteredWrongs.length} 道</span>
      </h2>
    `;
    masteredWrongs.forEach(w => {
      const q = questionData.find(qq => qq.id === w.qId);
      if (!q) return;
      html += `
        <div class="wrong-item" style="opacity: 0.6;">
          <div class="wrong-item-header">
            <span class="wrong-chapter">${q.chapter}</span>
            <span class="wrong-date" style="color: var(--green);">已掌握</span>
          </div>
          <div style="font-size:0.9rem; line-height:1.7;">${q.question.substring(0, 80)}...</div>
        </div>
      `;
    });
  }
  
  main.innerHTML = html;
}

function reviewQuestion(qId) {
  selectedQuestionAnswer[qId] = { selected: [], submitted: false };
  currentTab = 'practice';
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('[data-tab="practice"]').classList.add('active');
  currentCategory = 'all';
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.querySelector('[data-category="all"]').classList.add('active');

  setTimeout(() => {

  document.querySelector('[data-tab="knowledge"]').classList.add('active');

function markMastered(qId) {

  }

  renderStats();

function renderPlanTimeline(config) {
  const progress = getPlanProgress();
  const schedule = generateSchedule(config);
  const total = schedule.length;
  const done = schedule.filter(d => progress[d.day]).length;
  const percent = Math.round((done / total) * 100);
  
  let html = `
    <div class="plan-progress">
      <h2 style="margin-bottom:10px;">📊 学习进度</h2>
      <div class="progress-bar">
        <div class="progress-fill" style="width: ${percent}%"></div>
      </div>
      <div class="progress-text">已完成 ${done} / ${total} 天 · ${percent}%</div>
    </div>
    
    <div style="display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;">
      <button class="wrong-action-btn btn-knowledge" onclick="resetPlan()">🔄 重新制定计划</button>
    </div>
  `;
  
  schedule.forEach(day => {
    const isDone = progress[day.day];
    html += `
      <div class="plan-day ${isDone ? 'done' : ''}">
        <div class="plan-day-num">${day.day}</div>
        <div class="plan-day-content">
          <div class="plan-day-title">第${day.day}天 · ${day.title}</div>
          <div class="plan-day-items">
            ${day.items.map(item => `• ${item}`).join('<br>')}
          </div>
        </div>
        <button class="check-btn" onclick="toggleDayProgress(${day.day})">
          ${isDone ? '✓ 已完成' : '打卡'}
        </button>
      </div>
    `;
  });
  
  return html;
}

function generateSchedule(config) {
  const { days, goal } = config;
  const schedule = [];
  
  // 简化版：按重要性分配天数
  const sortedChapters = [...chapterList].sort((a, b) => b.score - a.score);
  const totalScore = sortedChapters.reduce((sum, c) => sum + c.score, 0);
  
  let dayNum = 1;
  const studyDays = Math.min(days, chapterList.length + 10); // 预留复习时间
  
  // 分配章节
  sortedChapters.forEach(chapter => {
    const chapterDays = Math.max(1, Math.round((chapter.score / totalScore) * (studyDays * 0.7)));
    const items = [];
    
    if (chapterDays === 1) {
      items.push(`学习${chapter.name}核心知识点`);
      items.push(`做配套练习题`);
    } else {
      items.push(`${chapter.name}（上）：基础概念与确认计量`);
      items.push(`${chapter.name}（下）：后续计量与特殊处理`);
      items.push(`${chapter.name}：习题巩固`);
    }
    
    schedule.push({
      day: dayNum++,
      title: chapter.name,
      items: items.slice(0, chapterDays),
      chapterId: chapter.id
    });
  });
  
  // 复习阶段
  const reviewDays = Math.max(5, studyDays - dayNum + 1);
  for (let i = 0; i < reviewDays; i++) {
    schedule.push({
      day: dayNum++,
      title: `总复习第${i + 1}天`,
      items: [
        '回顾重点章节知识点',
        '刷错题集',
        '做模拟题'
      ]
    });
  }
  
  return schedule;
}

function toggleDayProgress(day) {
  const progress = getPlanProgress();
  if (progress[day]) {
    delete progress[day];
  } else {
    progress[day] = new Date().toISOString();
  }
  savePlanProgress(progress);
  renderMainContent();
}

async function takeScreenshot() {
  const flash = document.getElementById('screenshotFlash');
  
  flash.classList.add('active');
  setTimeout(() => flash.classList.remove('active'), 100);
  
  try {
    const canvas = await capturePage();
    const link = document.createElement('a');
    const now = new Date();
    const filename = `慧学会知识库_截图_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}${String(now.getSeconds()).padStart(2,'0')}.png`;
    link.download = filename;
    link.href = canvas.toDataURL('image/png');
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  } catch (err) {
    console.error('截图失败:', err);
    alert('截图失败，请使用系统截图功能（Windows: Win+Shift+S，Mac: Cmd+Shift+4）');
  }
}

async function capturePage() {
  const width = document.documentElement.scrollWidth;
  const height = document.documentElement.scrollHeight;
  const canvas = document.createElement('canvas');
  const scale = window.devicePixelRatio || 1;
  
  canvas.width = width * scale;
  canvas.height = height * scale;
  
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);
  
  const bgColor = getComputedStyle(document.body).backgroundColor || '#0f172a';
  
  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, width, height);
  
  const html = document.documentElement.outerHTML;
  const svg = `
    <svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}">
      <foreignObject width="100%" height="100%">
        <div xmlns="http://www.w3.org/1999/xhtml" style="width:${width}px; height:${height}px;">
          ${html}
        </div>
      </foreignObject>
    </svg>
  `;
  
  const img = new Image();
  const svgBlob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(svgBlob);
  
  await new Promise((resolve, reject) => {
    img.onload = resolve;
    img.onerror = reject;
    img.src = url;
  });
  
  ctx.drawImage(img, 0, 0, width, height);
  URL.revokeObjectURL(url);
  
  return canvas;
}

async function toggleRecording() {
  if (isRecording) {
    stopRecording();
  } else {
    await startRecording();
  }
}

async function startRecording() {
  if (!canScreenRecord()) {
    alert('您的浏览器不支持屏幕录制功能。\n\n建议：\n1. 使用 Chrome 或 Edge 浏览器\n2. 或者使用系统录屏功能（Win+G / Cmd+Shift+5）\n3. 也可以使用截图功能保存页面');
    return;
  }
  
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({
      video: {
        cursor: 'always'
      },
      audio: false
    });
    
    const mimeTypes = [
      'video/webm;codecs=vp9',
      'video/webm;codecs=vp8',
      'video/webm',
      'video/mp4'
    ];
    
    let selectedMimeType = '';
    for (const type of mimeTypes) {
      if (MediaRecorder.isTypeSupported(type)) {
        selectedMimeType = type;
        break;
      }
    }
    
    if (!selectedMimeType) {
      alert('您的浏览器不支持支持的视频格式');
      return;
    }
    
    mediaRecorder = new MediaRecorder(stream, {
      mimeType: selectedMimeType,
      videoBitsPerSecond: 2500000
    });
    
    recordedChunks = [];
    
    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) {
        recordedChunks.push(e.data);
      }
    };
    
    mediaRecorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type: selectedMimeType });
      const url = URL.createObjectURL(blob);
      
      const a = document.createElement('a');
      a.href = url;
      const now = new Date();
      const filename = `慧学会知识库_录制_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}.webm`;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      
      stream.getTracks().forEach(track => track.stop());
    };
    
    mediaRecorder.start();
    isRecording = true;
    recordStartTime = Date.now();
    
    const mainBtn = document.getElementById('toolMainBtn');
    const recordTimer = document.getElementById('recordTimer');
    mainBtn.textContent = '⏹';
    mainBtn.title = '停止录制';
    mainBtn.classList.add('recording');
    recordTimer.classList.add('show');
    
    startRecordTimer();
    
    stream.getVideoTracks()[0].addEventListener('ended', () => {
      if (isRecording) {
        stopRecording();
      }
    });
    
  } catch (err) {
    console.error('录制失败:', err);
    if (err.name !== 'NotAllowedError') {
      alert('录制失败: ' + err.message + '\n\n可以试试截图功能，或者使用系统自带的录屏工具。');
    }
  }
}

function stopRecording() {
  if (mediaRecorder && isRecording) {
    mediaRecorder.stop();
    isRecording = false;
    
    const mainBtn = document.getElementById('toolMainBtn');
    const recordTimer = document.getElementById('recordTimer');
    mainBtn.textContent = '⚙️';
    mainBtn.title = '工具箱';
    mainBtn.classList.remove('recording');
    recordTimer.classList.remove('show');
    
    stopRecordTimer();
  }
}

function startRecordTimer() {
  updateRecordTimer();
  recordTimerInterval = setInterval(updateRecordTimer, 1000);
}

function stopRecordTimer() {
  if (recordTimerInterval) {
    clearInterval(recordTimerInterval);
    recordTimerInterval = null;
  }
}

function updateRecordTimer() {
  const elapsed = Math.floor((Date.now() - recordStartTime) / 1000);
  const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
  const seconds = (elapsed % 60).toString().padStart(2, '0');
  document.getElementById('recordTime').textContent = `${minutes}:${seconds}`;
}

// ==================== 背景音乐 ====================

// 使用Web Audio API生成白噪音（免版权问题）
let audioCtx = null;
let noiseSource = null;
let gainNode = null;
let isMusicPlaying = false;
let currentMusicType = 0;
const musicTypes = ['🌊 白噪音', '🎵 雨声', '🌲 森林音', '🧘 冥想音乐'];

function initMusic() {
  const toggleBtn = document.getElementById('musicToggle');
  const volumeSlider = document.getElementById('musicVolume');
  const info = document.getElementById('musicInfo');
  
  toggleBtn.addEventListener('click', toggleMusic);
  info.addEventListener('click', switchMusicType);
  volumeSlider.addEventListener('input', (e) => {
    if (gainNode) {
      gainNode.gain.value = e.target.value / 100;
    }
  });
}

function toggleMusic() {
  const btn = document.getElementById('musicToggle');
  const info = document.getElementById('musicInfo');
  const player = document.getElementById('musicPlayer');
  
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  
  if (isMusicPlaying) {
    stopMusic();
    btn.textContent = '▶';
    info.textContent = '🎵 点击播放';
    player.classList.remove('playing');
  } else {
    playMusic();
    btn.textContent = '⏸';
    info.textContent = musicTypes[currentMusicType];
    player.classList.add('playing');
  }
}

function playMusic() {
  if (!audioCtx) return;
  
  stopMusic();
  
  gainNode = audioCtx.createGain();
  gainNode.gain.value = document.getElementById('musicVolume').value / 100;
  gainNode.connect(audioCtx.destination);
  
  // 生成不同类型的声音
  const bufferSize = 2 * audioCtx.sampleRate;
  const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const output = noiseBuffer.getChannelData(0);
  
  if (currentMusicType === 0) {
    // 白噪音
    for (let i = 0; i < bufferSize; i++) {
      output[i] = Math.random() * 2 - 1;
    }
  } else if (currentMusicType === 1) {
    // 雨声（粉噪音近似）
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    for (let i = 0; i < bufferSize; i++) {
      const white = Math.random() * 2 - 1;
      b0 = 0.99886 * b0 + white * 0.0555179;
      b1 = 0.99332 * b1 + white * 0.0750759;
      b2 = 0.96900 * b2 + white * 0.1538520;
      b3 = 0.86650 * b3 + white * 0.3104856;
      b4 = 0.55000 * b4 + white * 0.5329522;
      b5 = -0.7616 * b5 - white * 0.0168980;
      output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.11;
      b6 = white * 0.115926;
    }
  } else if (currentMusicType === 2) {
    // 森林音（低频噪音模拟风声）
    for (let i = 0; i < bufferSize; i++) {
      output[i] = (Math.random() * 2 - 1) * 0.3;
    }
  } else {
    // 冥想音乐（简单的正弦波叠加）
    const freq1 = 100; // 基础频率
    const freq2 = 150;
    const freq3 = 200;
    for (let i = 0; i < bufferSize; i++) {
      const t = i / audioCtx.sampleRate;
      output[i] = (Math.sin(2 * Math.PI * freq1 * t) * 0.3 +
                   Math.sin(2 * Math.PI * freq2 * t) * 0.2 +
                   Math.sin(2 * Math.PI * freq3 * t) * 0.1) * 0.5;
    }
  }
  
  noiseSource = audioCtx.createBufferSource();
  noiseSource.buffer = noiseBuffer;
  noiseSource.loop = true;
  noiseSource.connect(gainNode);
  noiseSource.start();
  
  isMusicPlaying = true;
}

function stopMusic() {
  if (noiseSource) {
    try {
      noiseSource.stop();
    } catch(e) {}
    noiseSource.disconnect();
    noiseSource = null;
  }
  if (gainNode) {
    gainNode.disconnect();
    gainNode = null;
  }
  isMusicPlaying = false;
}

function switchMusicType() {
  currentMusicType = (currentMusicType + 1) % musicTypes.length;
  document.getElementById('musicInfo').textContent = musicTypes[currentMusicType];
  if (isMusicPlaying) {
    playMusic();
  }
}

// ==================== 粒子背景 ====================

function initParticles() {
  const canvas = document.getElementById('particles-canvas');
  const ctx = canvas.getContext('2d');
  
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);
  
  const particles = [];
  const particleCount = 40;
  
  for (let i = 0; i < particleCount; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: Math.random() * 2 + 1,
      speedX: (Math.random() - 0.5) * 0.4,
      speedY: (Math.random() - 0.5) * 0.4,
      opacity: Math.random() * 0.4 + 0.15
    });
  }
  
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    particles.forEach((p, i) => {
      p.x += p.speedX;
      p.y += p.speedY;
      
      if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
      if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;
      
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(59, 130, 246, ${p.opacity})`;
      ctx.fill();
      
      particles.slice(i + 1).forEach(p2 => {
        const dx = p.x - p2.x;
        const dy = p.y - p2.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 120) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.strokeStyle = `rgba(59, 130, 246, ${0.08 * (1 - dist / 120)})`;
          ctx.stroke();
        }
      });
    });
    
    requestAnimationFrame(animate);
  }
  animate();
}
