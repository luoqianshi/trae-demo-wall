<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>就业体验 - 人生预演</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
  <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/experience.css">
</head>
<body class="min-h-screen font-sans antialiased flex flex-col" data-page="explore">

  <div id="nav-root"></div>

  <main class="flex-1">

    <!-- Hero -->
    <section class="bg-[var(--background)] border-b border-[var(--border)]">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-12 sm:py-16">
        <div class="max-w-3xl">
          <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-amber-100 text-amber-700 text-xs font-medium mb-4">
            <i data-lucide="briefcase" class="w-3.5 h-3.5"></i>
            就业模式
          </span>
          <h1 class="text-3xl sm:text-4xl lg:text-5xl font-bold text-[var(--foreground)] tracking-tight" style="text-wrap: balance; word-break: keep-all;">
            选择一个职业，开始你的预演
          </h1>
          <p class="mt-4 text-base sm:text-lg text-[var(--muted-foreground)] leading-relaxed max-w-2xl">
            从投递简历、AI 面试、拿到 offer，到完成真实工作挑战。每个职业都是一段完整的工作日模拟。
          </p>
        </div>
        <div class="mt-6 flex flex-wrap items-center gap-2 text-sm">
          <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white border border-[var(--border)] text-[var(--muted-foreground)]">
            <i data-lucide="users" class="w-4 h-4 text-amber-600"></i>
            <span><strong id="job-count">0</strong> 个职业可选</span>
          </span>
          <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white border border-[var(--border)] text-[var(--muted-foreground)]">
            <i data-lucide="clock" class="w-4 h-4 text-amber-600"></i>
            <span>单次约 8-15 分钟</span>
          </span>
          <a href="archive.html" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-amber-100 text-amber-700 font-medium hover:bg-amber-200 transition-colors">
            <i data-lucide="book-open" class="w-4 h-4"></i>
            <span>查看我的成长档案</span>
            <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
          </a>
        </div>
      </div>
    </section>

    <!-- Job Grid -->
    <section class="py-12 sm:py-16">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-xl sm:text-2xl font-semibold text-[var(--foreground)] tracking-tight">职业库</h2>
          <div class="hidden sm:flex items-center gap-2 text-xs text-[var(--muted-foreground)]">
            <i data-lucide="info" class="w-3.5 h-3.5"></i>
            <span>点击任意职业卡片进入体验</span>
          </div>
        </div>
        <div id="job-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
          <!-- injected by experience.js -->
        </div>
      </div>
    </section>

    <!-- Flow Preview -->
    <section class="py-12 sm:py-16 bg-[var(--muted)]">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
        <h2 class="text-xl sm:text-2xl font-semibold text-[var(--foreground)] tracking-tight text-center mb-10">每个职业的体验流程</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
          <div class="bg-white rounded-xl p-5 border border-[var(--border)]">
            <div class="w-10 h-10 rounded-lg bg-amber-100 text-amber-600 flex items-center justify-center mb-3">
              <i data-lucide="user" class="w-5 h-5"></i>
            </div>
            <div class="text-sm font-bold text-[var(--foreground)] mb-1">1. 自我介绍</div>
            <div class="text-xs text-[var(--muted-foreground)] leading-relaxed">填写名字、选择个人标签、写出求职动机</div>
          </div>
          <div class="bg-white rounded-xl p-5 border border-[var(--border)]">
            <div class="w-10 h-10 rounded-lg bg-amber-100 text-amber-600 flex items-center justify-center mb-3">
              <i data-lucide="message-circle" class="w-5 h-5"></i>
            </div>
            <div class="text-sm font-bold text-[var(--foreground)] mb-1">2. AI 面试</div>
            <div class="text-xs text-[var(--muted-foreground)] leading-relaxed">与 HR 和直属上级多轮对话，AI 根据你的回答追问</div>
          </div>
          <div class="bg-white rounded-xl p-5 border border-[var(--border)]">
            <div class="w-10 h-10 rounded-lg bg-amber-100 text-amber-600 flex items-center justify-center mb-3">
              <i data-lucide="door-open" class="w-5 h-5"></i>
            </div>
            <div class="text-sm font-bold text-[var(--foreground)] mb-1">3. 入职日</div>
            <div class="text-xs text-[var(--muted-foreground)] leading-relaxed">完成入职清单、认识团队、记录第一天的感受</div>
          </div>
          <div class="bg-white rounded-xl p-5 border border-[var(--border)]">
            <div class="w-10 h-10 rounded-lg bg-amber-100 text-amber-600 flex items-center justify-center mb-3">
              <i data-lucide="target" class="w-5 h-5"></i>
            </div>
            <div class="text-sm font-bold text-[var(--foreground)] mb-1">4. 工作挑战</div>
            <div class="text-xs text-[var(--muted-foreground)] leading-relaxed">完成 3 个真实工作场景的决策挑战</div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <div id="footer-root"></div>

  <script src="js/main.js"></script>
  <script src="js/experience.js"></script>
  <script src="js/explore-page.js"></script>
</body>
</html>
