<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#b9161d" />
<title>AI 脸谱工坊 · 腾讯混元 3D 生成</title>

<!-- Google model-viewer：一份代码通吃桌面/移动端/微信内置浏览器 -->
<script type="module" src="./assets/model-viewer.min.js"></script>
<!-- Alpine.js：轻量响应式，无需打包 -->
<script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>

<style>
  :root {
    --vermilion: #b9161d;
    --vermilion-deep: #8a0d13;
    --gilt: #d8a84f;
    --gilt-deep: #b98a2c;
    --ink: #1a1a1a;
    --paper: #f8efdf;
    --paper-warm: #ede0c4;
    --muted: #6b5a3e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { padding-bottom: 80px; }

  /* ══ Hero ══ */
  .hero {
    padding: 32px 24px 20px;
    display: flex; align-items: center; gap: 16px;
  }
  .logo {
    width: 60px; height: 60px; border-radius: 50%;
    background: var(--vermilion); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 900;
    box-shadow: 0 4px 14px rgba(185,22,29,.4);
    border: 3px solid var(--gilt);
  }
  .hero-text h1 {
    font-size: 26px; color: var(--vermilion); letter-spacing: 4px; line-height: 1.2;
  }
  .hero-text .sub {
    font-size: 12px; color: var(--muted); margin-top: 4px;
  }

  /* ══ Steps ══ */
  .steps {
    display: flex; align-items: center; justify-content: center;
    padding: 12px 20px 20px;
  }
  .step { display: flex; flex-direction: column; align-items: center; font-size: 14px; color: var(--gilt); font-weight: 700; }
  .step-label { font-size: 11px; color: var(--muted); margin-top: 2px; font-weight: 400; }
  .step-line { width: 24px; height: 1.5px; background: var(--gilt); opacity: .4; margin: 0 8px; }

  /* ══ Section ══ */
  .section { padding: 0 20px 20px; }
  .section-title {
    text-align: center; font-size: 14px; color: var(--vermilion);
    letter-spacing: 4px; font-weight: 600; margin-bottom: 12px;
  }
  .section-title::before, .section-title::after {
    content: '·'; margin: 0 6px; color: var(--gilt);
  }

  /* ══ Roles ══ */
  .role-scroll {
    display: flex; gap: 12px; overflow-x: auto;
    padding: 8px 0; scrollbar-width: none;
    scroll-snap-type: x mandatory;
  }
  .role-scroll::-webkit-scrollbar { display: none; }
  .role-card {
    flex-shrink: 0; scroll-snap-align: center;
    width: 92px; height: 118px; border-radius: 12px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #fff; cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,.15);
    border: 2px solid transparent;
    transition: transform .2s, border-color .2s;
    user-select: none;
  }
  .role-card.active {
    border-color: var(--gilt);
    transform: translateY(-4px);
    box-shadow: 0 8px 18px rgba(185,22,29,.4);
  }
  .role-circle {
    width: 52px; height: 52px; border-radius: 50%;
    background: rgba(255,255,255,.9); color: var(--vermilion);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 900;
    border: 2px solid var(--gilt);
    margin-bottom: 8px;
  }
  .role-name {
    font-size: 13px; font-weight: 600;
    text-shadow: 0 1px 3px rgba(0,0,0,.4);
    letter-spacing: 2px;
  }

  /* ══ Colors ══ */
  .colors {
    display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
  }
  .color-wrap {
    display: flex; flex-direction: column; align-items: center;
    padding: 8px 6px; border-radius: 10px; cursor: pointer;
    background: rgba(255,255,255,.4);
    border: 2px solid transparent;
    transition: all .2s; min-width: 60px;
  }
  .color-wrap.active {
    background: #fff; border-color: var(--gilt);
  }
  .swatch {
    width: 36px; height: 36px; border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,.2);
  }
  .swatch-name { font-size: 12px; color: var(--ink); margin-top: 6px; }
  .color-meaning {
    text-align: center; font-size: 12px; color: var(--muted);
    margin-top: 10px; font-style: italic;
  }

  /* ══ Purposes ══ */
  .purposes { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip {
    padding: 8px 16px; border: 1.5px solid var(--gilt);
    border-radius: 20px; font-size: 13px; color: var(--vermilion);
    background: #fff; cursor: pointer; user-select: none;
    transition: all .2s;
  }
  .chip.on {
    background: var(--vermilion); color: #fff; border-color: var(--vermilion);
  }

  /* ══ Prompt ══ */
  .prompt-card {
    margin: 12px 20px; padding: 16px;
    background: #fff; border-radius: 14px;
    border: 1.5px solid var(--gilt);
    box-shadow: 0 4px 14px rgba(0,0,0,.06);
  }
  .prompt-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px;
  }
  .prompt-tag { font-size: 13px; color: var(--vermilion); font-weight: 700; }
  .prompt-mark {
    font-size: 12px; color: var(--gilt);
    padding: 2px 8px; background: rgba(216,168,79,.15);
    border-radius: 10px;
  }
  .prompt-text {
    font-size: 13px; color: var(--ink); line-height: 1.6;
    max-height: 90px; overflow-y: auto;
  }
  .prompt-actions { display: flex; gap: 8px; margin-top: 12px; }
  .btn-optimize {
    flex: 1; padding: 10px 0; border-radius: 24px;
    background: linear-gradient(135deg, var(--gilt), var(--gilt-deep));
    color: #fff; font-size: 13px; font-weight: 700;
    border: none; cursor: pointer;
    letter-spacing: 1px;
    transition: opacity .2s;
  }
  .btn-optimize:disabled { opacity: .6; cursor: not-allowed; }
  .btn-reset {
    padding: 10px 20px; border-radius: 24px;
    background: transparent; color: var(--muted);
    border: 1.5px solid var(--gilt);
    font-size: 13px; cursor: pointer;
  }

  /* ══ 主 CTA ══ */
  .actions { padding: 0 20px; }
  .btn-primary {
    width: 100%; padding: 16px 0; border-radius: 30px;
    background: linear-gradient(135deg, var(--vermilion), var(--vermilion-deep));
    color: #fff; font-size: 16px; font-weight: 700;
    letter-spacing: 4px; border: none; cursor: pointer;
    box-shadow: 0 6px 18px rgba(185,22,29,.35);
    margin-bottom: 12px;
  }
  .btn-primary:disabled {
    background: #c9b89a; box-shadow: none; cursor: not-allowed;
  }
  .btn-secondary {
    width: 100%; padding: 14px 0; border-radius: 30px;
    background: #fff; color: var(--vermilion);
    border: 1.5px solid var(--vermilion);
    font-size: 14px; cursor: pointer;
  }

  /* ══ Viewer ══ */
  .viewer-section {
    padding: 20px; margin-top: 20px;
    background: #fff;
    border-top: 3px dashed var(--gilt);
    border-bottom: 3px dashed var(--gilt);
  }
  .viewer-title {
    text-align: center; font-size: 18px; color: var(--vermilion);
    font-weight: 700; letter-spacing: 6px; margin-bottom: 4px;
  }
  .viewer-sub {
    text-align: center; font-size: 12px; color: var(--muted);
    margin-bottom: 16px;
  }
  model-viewer {
    width: 100%; height: 60vh; min-height: 380px;
    background: radial-gradient(ellipse at center, var(--paper-warm) 0%, var(--paper) 70%);
    border-radius: 20px;
    --poster-color: transparent;
  }
  .viewer-hint {
    text-align: center; font-size: 12px; color: var(--muted);
    margin-top: 10px;
  }
  .placeholder-poster {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--muted); font-size: 14px;
    background: radial-gradient(ellipse at center, var(--paper-warm) 0%, var(--paper) 70%);
  }
  .spinner-ring {
    width: 70px; height: 70px; border-radius: 50%;
    border: 5px solid rgba(216,168,79,.25);
    border-top-color: var(--gilt);
    animation: spin 1.2s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .progress-bar {
    width: 100%; height: 6px;
    background: rgba(216,168,79,.15);
    border-radius: 3px; overflow: hidden;
    margin-top: 14px;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--vermilion), var(--gilt));
    transition: width .4s;
  }

  /* ══ Print ══ */
  .print-card {
    margin: 20px; padding: 18px;
    background: #fff; border: 1.5px solid var(--gilt);
    border-radius: 14px;
  }
  .print-title {
    font-size: 15px; color: var(--vermilion);
    font-weight: 700; margin-bottom: 12px;
  }
  .print-row { display: flex; justify-content: space-around; }
  .print-item { display: flex; flex-direction: column; align-items: center; }
  .print-key { font-size: 11px; color: var(--muted); }
  .print-val { font-size: 18px; color: var(--vermilion); font-weight: 800; margin-top: 4px; }

  /* ══ Scenes ══ */
  .scenes { padding: 0 20px 20px; }
  .scenes-title {
    text-align: center; font-size: 14px; color: var(--vermilion);
    letter-spacing: 4px; font-weight: 600; margin-bottom: 12px;
  }
  .scenes-title::before, .scenes-title::after { content: '·'; margin: 0 6px; color: var(--gilt); }
  .scene-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .scene-item {
    background: #fff; border: 1.5px solid rgba(216,168,79,.4);
    border-radius: 12px; padding: 14px 8px;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .scene-emoji { font-size: 26px; }
  .scene-name { font-size: 12px; color: var(--vermilion); font-weight: 700; margin-top: 6px; letter-spacing: 1px; }
  .scene-desc { font-size: 10px; color: var(--muted); margin-top: 3px; line-height: 1.4; }

  /* ══ Footer ══ */
  .foot {
    text-align: center; padding: 20px;
    border-top: 1px dashed var(--gilt);
    margin-top: 12px;
  }
  .foot-line { font-size: 12px; color: var(--vermilion); font-weight: 700; letter-spacing: 4px; }
  .foot-cap { font-size: 10px; color: var(--muted); margin-top: 4px; }

  /* ══ Toast ══ */
  .toast {
    position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
    padding: 12px 24px; background: rgba(26,26,26,.9); color: #fff;
    border-radius: 24px; font-size: 13px; z-index: 999;
    box-shadow: 0 6px 20px rgba(0,0,0,.3);
    animation: slideUp .3s;
  }
  @keyframes slideUp { from { opacity: 0; transform: translate(-50%, 20px); } }
</style>
</head>
<body x-data="app()" x-init="init()">

<!-- Hero -->
<header class="hero">
  <div class="logo">脸</div>
  <div class="hero-text">
    <h1>AI 脸谱工坊</h1>
    <div class="sub">腾讯混元 · 一键生成可打印的非遗脸谱</div>
  </div>
</header>

<!-- Steps -->
<div class="steps">
  <div class="step">①<span class="step-label">选角色</span></div>
  <div class="step-line"></div>
  <div class="step">②<span class="step-label">配色调</span></div>
  <div class="step-line"></div>
  <div class="step">③<span class="step-label">AI 优化</span></div>
  <div class="step-line"></div>
  <div class="step">④<span class="step-label">3D 生成</span></div>
</div>

<!-- Roles -->
<section class="section">
  <div class="section-title">角色（12 位京剧名角）</div>
  <div class="role-scroll">
    <template x-for="r in presets.roles" :key="r.id">
      <div class="role-card"
           :class="{ active: role === r.id }"
           :style="{ background: r.color }"
           @click="role = r.id">
        <div class="role-circle">面</div>
        <div class="role-name" x-text="r.name"></div>
      </div>
    </template>
  </div>
</section>

<!-- Colors -->
<section class="section">
  <div class="section-title">主色调（含寓意）</div>
  <div class="colors">
    <template x-for="c in presets.colors" :key="c.id">
      <div class="color-wrap"
           :class="{ active: color === c.id }"
           @click="color = c.id">
        <div class="swatch" :style="{ background: c.hex }"></div>
        <div class="swatch-name" x-text="c.name"></div>
      </div>
    </template>
  </div>
  <div class="color-meaning" x-show="currentMeaning" x-text="currentMeaning"></div>
</section>

<!-- Purposes -->
<section class="section">
  <div class="section-title">使用场景</div>
  <div class="purposes">
    <template x-for="p in presets.purposes" :key="p.id">
      <div class="chip" :class="{ on: purposes.includes(p.id) }" @click="togglePurpose(p.id)" x-text="p.name"></div>
    </template>
  </div>
</section>

<!-- Prompt -->
<div class="prompt-card">
  <div class="prompt-head">
    <span class="prompt-tag">🧠 Hunyuan3D Prompt</span>
    <span class="prompt-mark" x-text="optimized ? '已 AI 优化 ✨' : '基础版'"></span>
  </div>
  <div class="prompt-text" x-text="displayedPrompt"></div>
  <div class="prompt-actions">
    <button class="btn-optimize" @click="optimizePrompt()" :disabled="!role || optimizing">
      <span x-show="!optimizing">✨ AI 优化提示词</span>
      <span x-show="optimizing">优化中…</span>
    </button>
    <button class="btn-reset" @click="resetPrompt()" x-show="optimized">重置</button>
  </div>
</div>

<!-- CTA -->
<div class="actions">
  <button class="btn-primary" @click="generateModel()" :disabled="!role || generating">
    <span x-show="!generating">🎭 生成 3D 脸谱</span>
    <span x-show="generating">正在雕刻…</span>
  </button>
</div>

<!-- Viewer -->
<section class="viewer-section" x-show="showViewer">
  <h2 class="viewer-title">3D 脸谱预览</h2>
  <div class="viewer-sub" x-text="viewerSub"></div>

  <model-viewer
    x-ref="modelViewer"
    :src="glbUrl"
    alt="AI 生成的京剧脸谱 3D 模型"
    camera-controls
    touch-action="pan-y"
    auto-rotate
    auto-rotate-delay="2000"
    rotation-per-second="15deg"
    shadow-intensity="1"
    exposure="1.05"
    environment-image="neutral"
    interaction-prompt="none"
    :poster="previewUrl">
    <div slot="poster" class="placeholder-poster">
      <div class="spinner-ring"></div>
      <div x-text="loadingText"></div>
      <div class="progress-bar"><div class="progress-fill" :style="`width:${progressPct}%`"></div></div>
    </div>
  </model-viewer>

  <div class="viewer-hint">✋ 单指旋转 · 双指缩放 · PBR 光影渲染</div>
</section>

<!-- Print params -->
<div class="print-card" x-show="showViewer">
  <div class="print-title">🖨️ 3D 打印预估</div>
  <div class="print-row">
    <div class="print-item"><span class="print-key">材料</span><span class="print-val">PLA</span></div>
    <div class="print-item"><span class="print-key">重量</span><span class="print-val">18g</span></div>
    <div class="print-item"><span class="print-key">耗时</span><span class="print-val">1h20m</span></div>
    <div class="print-item"><span class="print-key">精度</span><span class="print-val">0.2mm</span></div>
  </div>
</div>

<!-- Scenes -->
<section class="scenes">
  <div class="scenes-title">应用场景</div>
  <div class="scene-list">
    <div class="scene-item"><span class="scene-emoji">🎓</span><span class="scene-name">校园美育</span><span class="scene-desc">戏曲课堂教具</span></div>
    <div class="scene-item"><span class="scene-emoji">👨‍👧</span><span class="scene-name">亲子 DIY</span><span class="scene-desc">周末打印涂色</span></div>
    <div class="scene-item"><span class="scene-emoji">🎁</span><span class="scene-name">文旅伴手礼</span><span class="scene-desc">景区非遗周边</span></div>
  </div>
</section>

<!-- Footer -->
<footer class="foot">
  <div class="foot-line">PLA · 18g · 1h20m · 0.2mm</div>
  <div class="foot-cap">非遗文创 · 校园美育 · 文旅伴手礼</div>
</footer>

<!-- Toast -->
<div class="toast" x-show="toast" x-text="toast" x-transition></div>

<script>
// ─── API 基地址 ──────────────────────────────
// 部署到腾讯云后改成 'https://<你的域名>'。开发时用 localhost。
const API_BASE = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
  ? 'http://localhost:3001'
  : '';  // 空字符串 = 用当前域名（Nginx 反代 /api）

// ─── 本地兜底 presets（12 角色 / 10 色调 / 6 用途）───
const FALLBACK = {
  roles: [
    { id: 'guangong',  name: '关公',   color: '#b9161d', prompt: 'Peking opera red face mask of General Guan Yu, phoenix eyes, silkworm brows, intricate gold trims, symmetrical' },
    { id: 'baogong',   name: '包公',   color: '#1a1a1a', prompt: 'Peking opera black face mask of Justice Bao with crescent moon on forehead' },
    { id: 'caocao',    name: '曹操',   color: '#b8b3a4', prompt: 'Peking opera white face mask of Cao Cao, narrow cunning eyes' },
    { id: 'shenjiang', name: '神将',   color: '#d8a84f', prompt: 'Peking opera gold face mask of a divine general, lotus and thunder patterns' },
    { id: 'monkey',    name: '孙悟空', color: '#e89b3d', prompt: 'Peking opera Monkey King face mask, peach-shaped pattern around eyes' },
    { id: 'zhangfei',  name: '张飞',   color: '#3a4d8c', prompt: 'Butterfly-pattern blue-black face mask of Zhang Fei, fierce round bell eyes' },
    { id: 'lubu',      name: '吕布',   color: '#e0d8b0', prompt: 'Cream-white face mask of warrior Lu Bu, elegant handsome features' },
    { id: 'liyuan',    name: '李元霸', color: '#7a4d20', prompt: 'Bronze face mask of Li Yuanba, muscular ferocious expression' },
    { id: 'yangyanzhao', name: '杨延昭', color: '#8a2020', prompt: 'Dark-red face mask of Yang Yanzhao, loyal righteous expression' },
    { id: 'zhongkui',  name: '钟馗',   color: '#5a1a1a', prompt: 'Crimson face mask of ghost-hunter Zhong Kui, wild bushy beard' },
    { id: 'erlang',    name: '二郎神', color: '#c4a862', prompt: 'Golden face mask of Erlang Shen with vertical third eye on forehead' },
    { id: 'muguiying', name: '穆桂英', color: '#e5a5b8', prompt: 'Rose-pink face mask of female general Mu Guiying, peony flower on forehead' },
  ],
  colors: [
    { id: 'vermilion', name: '朱红', hex: '#b9161d', meaning: '忠义 · 关公' },
    { id: 'ink',       name: '墨黑', hex: '#1a1a1a', meaning: '刚正 · 包公' },
    { id: 'paper',     name: '素白', hex: '#f8efdf', meaning: '奸诈 · 曹操' },
    { id: 'gilt',      name: '鎏金', hex: '#d8a84f', meaning: '神圣 · 神将' },
    { id: 'azure',     name: '青碧', hex: '#2a6b6e', meaning: '刚勇 · 窦尔敦' },
    { id: 'cinnabar',  name: '丹砂', hex: '#c94824', meaning: '赤诚 · 姜维' },
    { id: 'cyanine',   name: '藏青', hex: '#243c6b', meaning: '威武 · 张飞' },
    { id: 'amber',     name: '琥珀', hex: '#b06a24', meaning: '英勇 · 李元霸' },
    { id: 'peach',     name: '桃粉', hex: '#e5a5b8', meaning: '巾帼 · 穆桂英' },
    { id: 'malachite', name: '石绿', hex: '#4a8e5a', meaning: '妖异 · 精怪' },
  ],
  purposes: [
    { id: 'school',     name: '校园美育' },
    { id: 'diy',        name: '亲子 DIY' },
    { id: 'travel',     name: '文旅文创' },
    { id: 'gift',       name: '非遗礼盒' },
    { id: 'stage',      name: '戏曲舞台道具' },
    { id: 'collection', name: '个人收藏' },
  ],
};

function app() {
  return {
    presets: FALLBACK,
    role: '',
    color: 'vermilion',
    purposes: [],
    optimized: '',
    optimizing: false,
    generating: false,
    showViewer: false,
    viewerSub: '',
    loadingText: '排队中…',
    progressPct: 15,
    glbUrl: '',
    previewUrl: '',
    toast: '',
    _pollTimer: null,

    async init() {
      try {
        const res = await fetch(`${API_BASE}/api/mask/presets`);
        if (res.ok) this.presets = await res.json();
      } catch (e) {
        console.warn('presets 使用本地兜底');
      }
      // 兜底样本：?demo=guangong|baogong|caocao
      const demo = new URLSearchParams(location.search).get('demo');
      if (demo && ['guangong', 'baogong', 'caocao'].includes(demo)) {
        this.glbUrl = `./assets/samples/${demo}.glb`;
        this.showViewer = true;
        this.progressPct = 100;
        this.loadingText = '样本模型已加载';
        this.viewerSub = `${demo} · 样本演示`;
      }
    },

    get currentMeaning() {
      const c = this.presets.colors.find(x => x.id === this.color);
      return c?.meaning || '';
    },

    get basePrompt() {
      const r = this.presets.roles.find(x => x.id === this.role);
      const c = this.presets.colors.find(x => x.id === this.color);
      return r ? `${r.prompt}, dominant color ${c?.name || ''}, suitable for 3D printing, intricate symmetric pattern`
               : '请先选择脸谱角色…';
    },

    get displayedPrompt() {
      return this.optimized || this.basePrompt;
    },

    togglePurpose(id) {
      this.purposes = this.purposes.includes(id) ? this.purposes.filter(x => x !== id) : [...this.purposes, id];
    },

    async optimizePrompt() {
      if (!this.role || this.optimizing) return;
      this.optimizing = true;
      try {
        const res = await fetch(`${API_BASE}/api/ai/optimize-prompt`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: this.basePrompt }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'AI 优化失败');
        this.optimized = data.optimized || '';
        this.showToast('✨ 提示词已优化');
      } catch (e) {
        this.showToast(e.message);
      } finally {
        this.optimizing = false;
      }
    },

    resetPrompt() {
      this.optimized = '';
      this.showToast('已重置为基础版');
    },

    async generateModel() {
      if (!this.role || this.generating) return;
      this.generating = true;
      this.showViewer = true;
      this.glbUrl = '';
      this.previewUrl = '';
      this.progressPct = 15;
      this.loadingText = '正在提交任务到腾讯混元 3D…';
      const roleName = this.presets.roles.find(x => x.id === this.role)?.name || '';
      const colorName = this.presets.colors.find(x => x.id === this.color)?.name || '';
      this.viewerSub = `${roleName} · ${colorName} · 由腾讯混元 3D 生成`;

      try {
        const submitRes = await fetch(`${API_BASE}/api/hy3d/submit`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: this.displayedPrompt }),
        });
        const submitData = await submitRes.json();
        if (!submitRes.ok) throw new Error(submitData.error || '提交失败');
        this.pollJob(submitData.jobId);
      } catch (e) {
        this.generating = false;
        this.loadingText = e.message;
        this.showToast(e.message);
      }
    },

    pollJob(jobId) {
      let count = 0;
      const poll = async () => {
        count++;
        // 对数进度条
        this.progressPct = Math.min(92, 15 + 77 * (1 - Math.exp(-count / 20)));
        this.loadingText = `混元 3D 雕刻中… (${Math.floor(count * 6 / 60)}分${count * 6 % 60}秒)`;
        try {
          const res = await fetch(`${API_BASE}/api/hy3d/query/${jobId}`);
          const data = await res.json();
          const status = (data.status || '').toLowerCase();

          if (data.previewUrl) this.previewUrl = data.previewUrl;
          if (data.glbUrl) {
            this.glbUrl = data.glbUrl;
            this.progressPct = 100;
            this.loadingText = '✓ 生成完成';
            this.generating = false;
            this._pollTimer = null;
            this.showToast('🎉 3D 脸谱已生成');
            return;
          }
          if (status.includes('fail') || status.includes('error')) {
            this.generating = false;
            this.loadingText = '生成失败，请重试';
            this._pollTimer = null;
            return;
          }
          this._pollTimer = setTimeout(poll, 6000);
        } catch (e) {
          this._pollTimer = setTimeout(poll, 8000);
        }
      };
      poll();
    },

    showToast(msg) {
      this.toast = msg;
      setTimeout(() => (this.toast = ''), 2500);
    },
  };
}
</script>
</body>
</html>
