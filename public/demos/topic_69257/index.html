<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI语音药盒 - 智慧助老</title>
<style>
/* ========== CSS Variables ========== */
:root {
    --primary: #FF8C42;
    --primary-dark: #E6732A;
    --primary-light: #FFE0CC;
    --secondary: #4CAF50;
    --secondary-dark: #388E3C;
    --secondary-light: #C8E6C9;
    --danger: #F44336;
    --warning: #FF9800;
    --info: #2196F3;
    --bg: #FFF8F0;
    --card-bg: #FFFFFF;
    --text: #333333;
    --text-light: #666666;
    --text-white: #FFFFFF;
    --border: #FFE0CC;
    --shadow: 0 4px 12px rgba(255, 140, 66, 0.15);
    --shadow-hover: 0 6px 20px rgba(255, 140, 66, 0.25);
    --radius: 16px;
    --radius-sm: 10px;
    --font-size-base: 18px;
    --font-size-lg: 22px;
    --font-size-xl: 28px;
    --font-size-xxl: 36px;
    --transition: all 0.3s ease;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { font-size: var(--font-size-base); scroll-behavior: smooth; }

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    overflow-x: hidden;
}

::-webkit-scrollbar { width: 12px; }
::-webkit-scrollbar-track { background: var(--primary-light); border-radius: 10px; }
::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--primary-dark); }

/* ========== Header ========== */
header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: var(--text-white);
    padding: 0 24px;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 2px 15px rgba(255, 140, 66, 0.3);
}

nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 1400px;
    margin: 0 auto;
    height: 80px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: var(--font-size-xl);
    font-weight: 800;
    letter-spacing: 1px;
}

.logo-icon {
    width: 48px;
    height: 48px;
    background: var(--text-white);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    animation: pulse-logo 2s infinite;
}

@keyframes pulse-logo {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,0.4); }
    50% { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(255,255,255,0); }
}

.nav-datetime {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    font-size: var(--font-size-lg);
    font-weight: 600;
}

#navDate { font-size: 16px; opacity: 0.9; }
#navTime { font-size: var(--font-size-xl); font-weight: 800; font-variant-numeric: tabular-nums; }

/* ========== Main ========== */
main { max-width: 1400px; margin: 0 auto; padding: 24px; }
section { margin-bottom: 40px; }

.section-title {
    font-size: var(--font-size-xxl);
    font-weight: 800;
    color: var(--primary-dark);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.section-title .icon { font-size: 32px; }

/* ========== Overview Cards ========== */
.overview-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
}

.time-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow);
    transition: var(--transition);
    border-left: 6px solid var(--primary);
    animation: slideInLeft 0.5s ease forwards;
    opacity: 0;
}

.time-card:nth-child(1) { animation-delay: 0.1s; border-left-color: #FFB74D; }
.time-card:nth-child(2) { animation-delay: 0.2s; border-left-color: #4FC3F7; }
.time-card:nth-child(3) { animation-delay: 0.3s; border-left-color: #81C784; }
.time-card:nth-child(4) { animation-delay: 0.4s; border-left-color: #BA68C8; }

@keyframes slideInLeft {
    from { opacity: 0; transform: translateX(-40px); }
    to { opacity: 1; transform: translateX(0); }
}

.time-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
.time-card.reminding { animation: blinkAlert 1s infinite; }

@keyframes blinkAlert {
    0%, 100% { box-shadow: 0 0 0 0 rgba(244, 67, 54, 0); }
    50% { box-shadow: 0 0 20px 4px rgba(244, 67, 54, 0.4); }
}

.time-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
}

.time-card-title {
    font-size: var(--font-size-xl);
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
}

.time-card-time { font-size: 18px; color: var(--text-light); font-weight: 600; }

.time-card-status {
    display: inline-block;
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 16px;
    font-weight: 700;
}

.status-pending { background: #FFF3E0; color: #E65100; }
.status-done { background: var(--secondary-light); color: var(--secondary-dark); }
.status-reminding { background: #FFEBEE; color: var(--danger); animation: pulse-text 1s infinite; }

@keyframes pulse-text { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

.medicine-list { list-style: none; }

.medicine-list li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid #F5F5F5;
    font-size: 19px;
}

.medicine-list li:last-child { border-bottom: none; }

.medicine-list .pill-icon {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
}

.btn-announce {
    width: 100%;
    padding: 14px;
    margin-top: 14px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: var(--text-white);
    border: none;
    border-radius: var(--radius-sm);
    font-size: var(--font-size-lg);
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.btn-announce:hover { transform: scale(1.02); box-shadow: 0 4px 15px rgba(255, 140, 66, 0.4); }
.btn-announce:active { transform: scale(0.98); }

.btn-announce.speaking {
    background: linear-gradient(135deg, var(--secondary), var(--secondary-dark));
    animation: speakingPulse 1.5s infinite;
}

@keyframes speakingPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.4); }
    50% { box-shadow: 0 0 0 10px rgba(76, 175, 80, 0); }
}

.btn-taken {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    background: var(--secondary-light);
    color: var(--secondary-dark);
    border: 2px solid var(--secondary);
    border-radius: var(--radius-sm);
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
}

.btn-taken:hover { background: var(--secondary); color: var(--text-white); }

/* ========== Medication Panel ========== */
.medication-panel {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 28px;
    box-shadow: var(--shadow);
}

.add-med-form {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
    padding-bottom: 24px;
    border-bottom: 2px dashed var(--border);
}

.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group label { font-size: 16px; font-weight: 700; color: var(--text-light); }

.form-group input, .form-group select, .form-group textarea {
    padding: 12px 16px;
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 18px;
    transition: var(--transition);
    font-family: inherit;
    background: #FFFBF7;
}

.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(255, 140, 66, 0.15);
}

.btn-add {
    grid-column: 1 / -1;
    padding: 16px 48px;
    background: linear-gradient(135deg, var(--secondary), var(--secondary-dark));
    color: var(--text-white);
    border: none;
    border-radius: var(--radius-sm);
    font-size: var(--font-size-lg);
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
    justify-self: start;
}

.btn-add:hover { transform: scale(1.02); box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4); }

.medicine-table { width: 100%; border-collapse: collapse; font-size: 18px; }

.medicine-table th {
    background: var(--primary-light);
    color: var(--primary-dark);
    padding: 14px 16px;
    text-align: left;
    font-weight: 700;
    font-size: 17px;
}

.medicine-table th:first-child { border-radius: 8px 0 0 8px; }
.medicine-table th:last-child { border-radius: 0 8px 8px 0; }

.medicine-table td { padding: 14px 16px; border-bottom: 1px solid #F5F5F5; }
.medicine-table tr:hover { background: #FFF8F0; }
.medicine-table tr { animation: fadeInRow 0.4s ease; }

@keyframes fadeInRow {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    margin: 2px;
}

.badge-morning { background: #FFF3E0; color: #E65100; }
.badge-noon { background: #E3F2FD; color: #1565C0; }
.badge-evening { background: #E8F5E9; color: #2E7D32; }
.badge-bedtime { background: #F3E5F5; color: #7B1FA2; }

.btn-delete {
    padding: 8px 16px;
    background: #FFEBEE;
    color: var(--danger);
    border: 2px solid #FFCDD2;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
}

.btn-delete:hover { background: var(--danger); color: var(--text-white); }

/* ========== Calendar ========== */
.calendar-panel {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 28px;
    box-shadow: var(--shadow);
}

.calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
}

.calendar-title { font-size: var(--font-size-xl); font-weight: 800; color: var(--primary-dark); }

.btn-cal-nav {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--card-bg);
    font-size: 24px;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--primary);
}

.btn-cal-nav:hover { background: var(--primary); color: var(--text-white); border-color: var(--primary); }

.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
}

.calendar-weekday {
    text-align: center;
    font-size: 16px;
    font-weight: 700;
    color: var(--text-light);
    padding: 8px 0;
}

.calendar-day {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    font-size: 20px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    position: relative;
    border: 2px solid transparent;
}

.calendar-day:hover { border-color: var(--primary); transform: scale(1.05); }
.calendar-day.empty { cursor: default; }
.calendar-day.empty:hover { border-color: transparent; transform: none; }

.calendar-day.taken { background: var(--secondary-light); color: var(--secondary-dark); }
.calendar-day.taken::after {
    content: '✓';
    position: absolute;
    bottom: 4px;
    font-size: 14px;
    color: var(--secondary-dark);
    font-weight: 800;
}

.calendar-day.not-taken { background: #F5F5F5; color: #999; }
.calendar-day.today { border: 3px solid var(--primary); background: var(--primary-light); font-weight: 800; }
.calendar-day.future { color: #CCC; cursor: not-allowed; }

.calendar-legend {
    display: flex;
    gap: 24px;
    margin-top: 20px;
    justify-content: center;
    font-size: 16px;
}

.legend-item { display: flex; align-items: center; gap: 8px; }
.legend-color { width: 24px; height: 24px; border-radius: 6px; }

.calendar-flip { animation: calendarFlip 0.4s ease; }

@keyframes calendarFlip {
    0% { transform: rotateY(0deg); opacity: 1; }
    50% { transform: rotateY(90deg); opacity: 0.5; }
    100% { transform: rotateY(0deg); opacity: 1; }
}

/* ========== Inventory ========== */
.inventory-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
}

.inventory-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow);
    transition: var(--transition);
}

.inventory-card:hover { box-shadow: var(--shadow-hover); }

.inventory-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
}

.inventory-name { font-size: var(--font-size-lg); font-weight: 700; }
.inventory-count { font-size: 18px; font-weight: 700; color: var(--text-light); }
.inventory-count.low { color: var(--danger); }

.progress-bar {
    width: 100%;
    height: 24px;
    background: #F0F0F0;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
}

.progress-fill {
    height: 100%;
    border-radius: 12px;
    transition: width 0.8s ease;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 10px;
    font-size: 14px;
    font-weight: 700;
    color: var(--text-white);
}

.progress-fill.high { background: linear-gradient(90deg, var(--secondary), var(--secondary-dark)); }
.progress-fill.mid { background: linear-gradient(90deg, var(--warning), #F57C00); }
.progress-fill.low { background: linear-gradient(90deg, var(--danger), #D32F2F); }

.inventory-detail { margin-top: 10px; font-size: 15px; color: var(--text-light); }

/* ========== Emergency ========== */
.emergency-panel {
    background: linear-gradient(135deg, #FFF3E0, #FFE0B2);
    border-radius: var(--radius);
    padding: 32px;
    box-shadow: var(--shadow);
    text-align: center;
}

.emergency-title {
    font-size: var(--font-size-xl);
    font-weight: 800;
    color: var(--danger);
    margin-bottom: 20px;
}

.emergency-contacts {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
}

.contact-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 24px 32px;
    background: var(--text-white);
    border: 3px solid var(--primary);
    border-radius: var(--radius);
    cursor: pointer;
    transition: var(--transition);
    min-width: 160px;
}

.contact-btn:hover {
    transform: translateY(-4px);
    box-shadow: 0 6px 20px rgba(255, 140, 66, 0.3);
    background: var(--primary);
    color: var(--text-white);
}

.contact-btn:hover .contact-icon { background: var(--text-white); color: var(--primary); }

.contact-icon {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--primary-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    transition: var(--transition);
}

.contact-name { font-size: var(--font-size-lg); font-weight: 700; }
.contact-relation { font-size: 16px; color: var(--text-light); }

/* Dial Modal */
.dial-modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    z-index: 9999;
    align-items: center;
    justify-content: center;
}

.dial-modal-overlay.active { display: flex; }

.dial-modal {
    background: var(--card-bg);
    border-radius: 24px;
    padding: 40px;
    text-align: center;
    max-width: 400px;
    width: 90%;
    animation: dialModalIn 0.3s ease;
}

@keyframes dialModalIn {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
}

.dial-avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: var(--primary-light);
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    position: relative;
}

.dial-avatar::before, .dial-avatar::after {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 3px solid var(--primary);
    animation: ringPulse 1.5s infinite;
}

.dial-avatar::after { animation-delay: 0.5s; }

@keyframes ringPulse {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.8); opacity: 0; }
}

.dial-name { font-size: var(--font-size-xl); font-weight: 800; margin-bottom: 8px; }
.dial-phone { font-size: var(--font-size-lg); color: var(--text-light); margin-bottom: 20px; }
.dial-status { font-size: 18px; color: var(--secondary); font-weight: 600; margin-bottom: 24px; min-height: 28px; }

.btn-hangup {
    padding: 16px 48px;
    background: var(--danger);
    color: var(--text-white);
    border: none;
    border-radius: 50px;
    font-size: var(--font-size-lg);
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
}

.btn-hangup:hover { transform: scale(1.05); box-shadow: 0 4px 15px rgba(244, 67, 54, 0.4); }

/* ========== Tips Carousel ========== */
.tips-panel {
    background: linear-gradient(135deg, var(--secondary-light), #E8F5E9);
    border-radius: var(--radius);
    padding: 28px;
    box-shadow: var(--shadow);
    overflow: hidden;
}

.tips-track { display: flex; transition: transform 0.5s ease; }

.tip-slide { min-width: 100%; text-align: center; padding: 20px; }
.tip-icon { font-size: 48px; margin-bottom: 12px; }
.tip-title { font-size: var(--font-size-lg); font-weight: 700; color: var(--secondary-dark); margin-bottom: 8px; }
.tip-content { font-size: 18px; color: var(--text); max-width: 800px; margin: 0 auto; }

.tips-dots { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }

.tip-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: rgba(76, 175, 80, 0.3);
    cursor: pointer;
    transition: var(--transition);
}

.tip-dot.active { background: var(--secondary); transform: scale(1.3); }

/* ========== Toast ========== */
.toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--text);
    color: var(--text-white);
    padding: 16px 32px;
    border-radius: 50px;
    font-size: 18px;
    font-weight: 600;
    z-index: 10000;
    transition: transform 0.3s ease;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}

.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { background: var(--secondary); }
.toast.error { background: var(--danger); }
.toast.warning { background: var(--warning); }

/* ========== Responsive ========== */
@media (max-width: 768px) {
    :root {
        --font-size-base: 16px;
        --font-size-lg: 20px;
        --font-size-xl: 24px;
        --font-size-xxl: 28px;
    }
    nav { height: auto; flex-direction: column; padding: 12px 0; gap: 8px; }
    .nav-datetime { align-items: center; }
    .overview-grid { grid-template-columns: 1fr; }
    .add-med-form { grid-template-columns: 1fr; }
    .medicine-table { font-size: 16px; }
    .medicine-table th, .medicine-table td { padding: 10px 8px; }
    .calendar-day { font-size: 16px; }
    .emergency-contacts { flex-direction: column; }
    .contact-btn { width: 100%; }
}

@media (max-width: 480px) {
    main { padding: 12px; }
    .logo { font-size: 20px; }
    .calendar-grid { gap: 4px; }
    .calendar-day { font-size: 14px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}

button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 3px solid var(--info);
    outline-offset: 2px;
}

footer {
    text-align: center;
    padding: 24px;
    color: var(--text-light);
    font-size: 16px;
    border-top: 2px solid var(--border);
    margin-top: 40px;
}

footer span { color: var(--primary); font-weight: 700; }
</style>
</head>
<body>

<header>
    <nav>
        <div class="logo">
            <div class="logo-icon">💊</div>
            <span>AI语音药盒</span>
        </div>
        <div class="nav-datetime">
            <span id="navDate">加载中...</span>
            <span id="navTime">--:--:--</span>
        </div>
    </nav>
</header>

<main>
    <section id="overview">
        <h2 class="section-title"><span class="icon">📋</span> 今日用药概览</h2>
        <div class="overview-grid" id="overviewGrid"></div>
    </section>

    <section id="medication">
        <h2 class="section-title"><span class="icon">💊</span> 药品管理</h2>
        <div class="medication-panel">
            <div class="add-med-form">
                <div class="form-group">

                    <div class="contact-icon">👨‍⚕️</div><div class="contact-name">李医生</div><div class="contact-relation">社区医生</div>

    <p>AI语音药盒 — <span>智慧助老</span> | 让科技温暖每一位老人 | 2026 Trae应用开发赛</p>
</footer>

<script>
// ========== Pre-loaded Data ==========
let medicines = [
    { id: 1, name: '阿司匹林肠溶片', dose: '1片', freq: 'morning,evening', stock: 28, maxStock: 30, note: '饭后服用' },
    { id: 2, name: '二甲双胍片', dose: '0.5g', freq: 'morning,noon,evening', stock: 12, maxStock: 60, note: '餐中服用' },
    { id: 3, name: '硝苯地平缓释片', dose: '1片', freq: 'morning', stock: 5, maxStock: 30, note: '早晨空腹' },
    { id: 4, name: '阿托伐他汀钙片', dose: '20mg', freq: 'bedtime', stock: 25, maxStock: 30, note: '睡前服用' },
    { id: 5, name: '复方丹参滴丸', dose: '10丸', freq: 'morning,noon,evening', stock: 45, maxStock: 100, note: '舌下含服' },
    { id: 6, name: '维生素B12', dose: '1片', freq: 'morning', stock: 18, maxStock: 30, note: '早餐后' }
];

let nextMedId = 7;

// 7-day medication records (taken/not taken)
// Format: 'YYYY-MM-DD': { morning: true/false, noon: true/false, evening: true/false, bedtime: true/false }
let medRecords = {};
function generateRecords() {
    const today = new Date();
    for (let i = 6; i >= 0; i--) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        const key = formatDateKey(d);
        if (i === 2) {
            medRecords[key] = { morning: true, noon: false, evening: true, bedtime: true };
        } else if (i === 0) {
            medRecords[key] = { morning: true, noon: true, evening: false, bedtime: false };
        } else {
            medRecords[key] = { morning: true, noon: true, evening: true, bedtime: true };
        }
    }
}

// Also generate records for previous days in the current month
function generateMonthRecords(year, month) {
    const today = new Date();
    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);
    for (let day = 1; day <= lastDay.getDate(); day++) {
        const d = new Date(year, month, day);
        if (d > today) continue;
        const key = formatDateKey(d);
        if (!medRecords[key]) {
            // Random-ish: weekends more likely to be fully taken
            const dow = d.getDay();
            if (dow === 0 || dow === 6) {
                medRecords[key] = { morning: true, noon: true, evening: true, bedtime: true };
            } else {
                const r = (day * 7 + month * 13) % 10;
                if (r < 7) {
                    medRecords[key] = { morning: true, noon: true, evening: true, bedtime: true };
                } else if (r < 9) {
                    medRecords[key] = { morning: true, noon: false, evening: true, bedtime: true };
                } else {
                    medRecords[key] = { morning: false, noon: false, evening: true, bedtime: false };
                }
            }
        }
    }
}

// ========== Time Slots Config ==========
const timeSlots = [
    { key: 'morning', label: '早晨', icon: '🌅', time: '07:00', color: '#FFB74D' },
    { key: 'noon', label: '中午', icon: '☀️', time: '12:00', color: '#4FC3F7' },
    { key: 'evening', label: '晚上', icon: '🌙', time: '18:00', color: '#81C784' },
    { key: 'bedtime', label: '睡前', icon: '💤', time: '21:00', color: '#BA68C8' }
];

// ========== Health Tips ==========
const healthTips = [
    { icon: '💊', title: '按时服药', content: '请严格按照医嘱按时按量服药，不要自行增减剂量或停药。漏服药物时，请及时咨询医生。' },
    { icon: '🍽️', title: '饮食搭配', content: '服药期间注意饮食禁忌。如服用降压药时应低盐饮食，服用降糖药时应控制糖分摄入。' },
    { icon: '💧', title: '多喝水', content: '每天保证充足的水分摄入（1500-2000ml），服药时用温开水送服，不要用茶水或果汁。' },
    { icon: '🚶', title: '适量运动', content: '每天坚持30分钟适度运动，如散步、太极拳等。但避免空腹运动，防止低血糖。' },
    { icon: '😴', title: '充足睡眠', content: '保证每天7-8小时睡眠，良好的睡眠有助于身体恢复和药物吸收。睡前避免饮用浓茶咖啡。' },
    { icon: '❤️', title: '定期体检', content: '建议每月测量一次血压血糖，每三个月复查一次。出现不适症状及时就医，不要拖延。' },
    { icon: '☀️', title: '晒太阳', content: '每天上午9-10点或下午4-5点晒太阳15-30分钟，有助于维生素D合成，促进钙质吸收。' },
    { icon: '🥗', title: '营养均衡', content: '饮食要荤素搭配，多吃蔬菜水果。少油少盐少糖，每餐七分饱，细嚼慢咽助消化。' }
];

// ========== Utility Functions ==========
function formatDateKey(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + d;
}

function showToast(msg, type) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = 'toast show';
    if (type) toast.classList.add(type);
    setTimeout(function() { toast.classList.remove('show'); }, 3000);
}

// ========== Clock ==========
function updateClock() {
    const now = new Date();
    const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
    const dateStr = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日 ' + weekdays[now.getDay()];
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    document.getElementById('navDate').textContent = dateStr;
    document.getElementById('navTime').textContent = h + ':' + m + ':' + s;
}

// ========== Render Overview ==========
function renderOverview() {
    const grid = document.getElementById('overviewGrid');
    const todayKey = formatDateKey(new Date());
    const todayRecord = medRecords[todayKey] || { morning: false, noon: false, evening: false, bedtime: false };
    const now = new Date();
    const currentHour = now.getHours();

    let html = '';
    timeSlots.forEach(function(slot) {
        const meds = medicines.filter(function(med) { return med.freq.split(',').indexOf(slot.key) !== -1; });
        const isTaken = todayRecord[slot.key];
        const isReminderTime = !isTaken && meds.length > 0 && (
            (slot.key === 'morning' && currentHour >= 7 && currentHour < 12) ||
            (slot.key === 'noon' && currentHour >= 12 && currentHour < 18) ||
            (slot.key === 'evening' && currentHour >= 18 && currentHour < 21) ||
            (slot.key === 'bedtime' && currentHour >= 21)
        );

        let statusClass = isTaken ? 'status-done' : (isReminderTime ? 'status-reminding' : 'status-pending');
        let statusText = isTaken ? '✅ 已服用' : (isReminderTime ? '⏰ 该吃药了' : '⏳ 待服用');

        html += '<div class="time-card' + (isReminderTime ? ' reminding' : '') + '">';
        html += '<div class="time-card-header">';
        html += '<div class="time-card-title">' + slot.icon + ' ' + slot.label + '</div>';
        html += '<span class="time-card-status ' + statusClass + '">' + statusText + '</span>';
        html += '</div>';
        html += '<div class="time-card-time">提醒时间：' + slot.time + '</div>';
        html += '<ul class="medicine-list">';
        if (meds.length === 0) {
            html += '<li style="color: #999;">暂无药品</li>';
        } else {
            meds.forEach(function(med) {
                const pillColors = ['#FFB74D', '#4FC3F7', '#81C784', '#BA68C8', '#FF8A65', '#AED581'];
                const colorIdx = med.id % pillColors.length;
                html += '<li><div class="pill-icon" style="background:' + pillColors[colorIdx] + '; color:white;">💊</div>';
                html += '<div><strong>' + med.name + '</strong> ' + med.dose;
                if (med.note) html += '<br><small style="color:#999;">' + med.note + '</small>';
                html += '</div></li>';
            });
        }
        html += '</ul>';
        if (meds.length > 0 && !isTaken) {
            html += '<button class="btn-announce" onclick="announceReminder(\'' + slot.key + '\')">🔊 点击播报</button>';
            html += '<button class="btn-taken" onclick="markTaken(\'' + slot.key + '\')">✓ 标记已服用</button>';
        } else if (isTaken) {
            html += '<button class="btn-taken" disabled style="opacity:0.6;cursor:default;">✓ 已完成</button>';
        }
        html += '</div>';
    });
    grid.innerHTML = html;
}

// ========== Speech Synthesis ==========
let currentUtterance = null;
let speakingButton = null;

function announceReminder(slotKey) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        var slot = timeSlots.filter(function(s) { return s.key === slotKey; })[0];
        var meds = medicines.filter(function(m) { return m.freq.split(',').indexOf(slotKey) !== -1; });
        var text = '您好，现在是' + slot.label + '服药时间。请服用以下药品：';
        meds.forEach(function(med, idx) {
            text += (idx + 1) + '，' + med.name + '，' + med.dose + '。';
            if (med.note) text += '注意，' + med.note + '。';
        });
        text += '请按时服药，祝您身体健康。';

        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN';
        utterance.rate = 0.8;
        utterance.pitch = 1.0;
        utterance.volume = 1.0;

        // Find the button that was clicked
        var buttons = document.querySelectorAll('.btn-announce');
        buttons.forEach(function(btn) {
            if (btn.getAttribute('onclick') && btn.getAttribute('onclick').indexOf(slotKey) !== -1) {
                btn.classList.add('speaking');
                btn.innerHTML = '🔊 正在播报...';
                speakingButton = btn;
            }
        });

        utterance.onend = function() {
            if (speakingButton) {
                speakingButton.classList.remove('speaking');
                speakingButton.innerHTML = '🔊 点击播报';
                speakingButton = null;
            }
            showToast('播报完成', 'success');
        };

        utterance.onerror = function() {
            if (speakingButton) {
                speakingButton.classList.remove('speaking');
                speakingButton.innerHTML = '🔊 点击播报';
                speakingButton = null;
            }
            showToast('播报失败，请重试', 'error');
        };

        currentUtterance = utterance;
        window.speechSynthesis.speak(utterance);
        showToast('正在播报用药提醒...', 'success');
    } else {
        showToast('您的浏览器不支持语音播报功能', 'error');
    }
}

// ========== Mark Taken ==========
function markTaken(slotKey) {
    const todayKey = formatDateKey(new Date());
    if (!medRecords[todayKey]) {
        medRecords[todayKey] = { morning: false, noon: false, evening: false, bedtime: false };
    }
    medRecords[todayKey][slotKey] = true;
    // Decrease stock
    const slotMeds = medicines.filter(function(m) { return m.freq.split(',').indexOf(slotKey) !== -1; });
    slotMeds.forEach(function(med) { if (med.stock > 0) med.stock--; });
    renderOverview();
    renderMedicineTable();
    renderInventory();
    showToast('已标记为服用，好样的！💪', 'success');
    // Speak encouragement
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance('很好，您已按时服药，继续保持！');
        u.lang = 'zh-CN';
        u.rate = 0.8;
        window.speechSynthesis.speak(u);
    }
}

// ========== Medicine Table ==========
function renderMedicineTable() {
    const tbody = document.getElementById('medicineTableBody');
    const freqLabels = { morning: '早晨', noon: '中午', evening: '晚上', bedtime: '睡前' };
    let html = '';
    medicines.forEach(function(med) {
        html += '<tr>';
        html += '<td><strong>' + med.name + '</strong></td>';
        html += '<td>' + med.dose + '</td>';
        html += '<td>';
        med.freq.split(',').forEach(function(f) {
            html += '<span class="badge badge-' + f + '">' + freqLabels[f] + '</span> ';
        });
        html += '</td>';
        html += '<td>' + med.stock + ' / ' + med.maxStock + '</td>';
        html += '<td>' + (med.note || '-') + '</td>';
        html += '<td><button class="btn-delete" onclick="deleteMedicine(' + med.id + ')">🗑️ 删除</button></td>';
        html += '</tr>';
    });
    tbody.innerHTML = html;
}

// ========== Add Medicine ==========
function addMedicine() {
    const name = document.getElementById('medName').value.trim();
    const dose = document.getElementById('medDose').value.trim();
    const freq = document.getElementById('medFreq').value;
    const stock = parseInt(document.getElementById('medStock').value) || 0;
    const note = document.getElementById('medNote').value.trim();

    if (!name) { showToast('请输入药品名称', 'error'); return; }
    if (!dose) { showToast('请输入剂量', 'error'); return; }

    medicines.push({ id: nextMedId++, name: name, dose: dose, freq: freq, stock: stock, maxStock: Math.max(stock, 30), note: note });
    renderMedicineTable();
    renderOverview();
    renderInventory();
    // Clear form
    document.getElementById('medName').value = '';
    document.getElementById('medDose').value = '';
    document.getElementById('medStock').value = '30';
    document.getElementById('medNote').value = '';
    showToast('药品添加成功！', 'success');
}

// ========== Delete Medicine ==========
function deleteMedicine(id) {
    if (confirm('确定要删除这个药品吗？')) {
        medicines = medicines.filter(function(m) { return m.id !== id; });
        renderMedicineTable();
        renderOverview();
        renderInventory();
        showToast('药品已删除', 'success');
    }
}

// ========== Calendar ==========
let calDate = new Date();

function renderCalendar() {
    const grid = document.getElementById('calendarGrid');
    const year = calDate.getFullYear();
    const month = calDate.getMonth();
    const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
    document.getElementById('calTitle').textContent = year + '年' + monthNames[month];

    generateMonthRecords(year, month);

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const today = new Date();
    const todayKey = formatDateKey(today);

    const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
    let html = '';
    weekdays.forEach(function(w) { html += '<div class="calendar-weekday">' + w + '</div>'; });

    for (let i = 0; i < firstDay; i++) { html += '<div class="calendar-day empty"></div>'; }

    for (let day = 1; day <= daysInMonth; day++) {
        const date = new Date(year, month, day);
        const key = formatDateKey(date);
        const isToday = (key === todayKey);
        const isFuture = date > today;
        const record = medRecords[key];

        let classes = 'calendar-day';
        if (isToday) classes += ' today';
        if (isFuture) { classes += ' future'; }
        else if (record) {
            const allTaken = record.morning && record.noon && record.evening && record.bedtime;
            if (allTaken) classes += ' taken';
            else classes += ' not-taken';
        } else if (!isFuture) {
            classes += ' not-taken';
        }

        html += '<div class="' + classes + '" onclick="showDayDetail(\'' + key + '\')">' + day + '</div>';
    }
    grid.innerHTML = html;
    grid.classList.add('calendar-flip');
    setTimeout(function() { grid.classList.remove('calendar-flip'); }, 400);
}

function changeMonth(delta) {
    calDate.setMonth(calDate.getMonth() + delta);
    renderCalendar();
}

function showDayDetail(dateKey) {
    const record = medRecords[dateKey];
    if (record) {
        var parts = dateKey.split('-');
        var dateStr = parts[1] + '月' + parts[2] + '日';
        var msg = dateStr + ' 用药记录：\n';
        msg += '早晨：' + (record.morning ? '✅ 已服' : '❌ 未服') + '\n';
        msg += '中午：' + (record.noon ? '✅ 已服' : '❌ 未服') + '\n';
        msg += '晚上：' + (record.evening ? '✅ 已服' : '❌ 未服') + '\n';
        msg += '睡前：' + (record.bedtime ? '✅ 已服' : '❌ 未服');
        alert(msg);
    } else {
        showToast('该日期暂无记录', 'warning');
    }
}

// ========== Inventory ==========
function renderInventory() {
    const grid = document.getElementById('inventoryGrid');
    let html = '';
    medicines.forEach(function(med) {
        const percent = med.maxStock > 0 ? Math.round((med.stock / med.maxStock) * 100) : 0;
        let fillClass = 'high';
        if (percent < 30) fillClass = 'low';
        else if (percent < 60) fillClass = 'mid';
        const isLow = percent < 30;
        const daysLeft = med.stock > 0 ? Math.floor(med.stock / Math.max(med.freq.split(',').length, 1)) : 0;
        html += '<div class="inventory-card">';
        html += '<div class="inventory-header">';
        html += '<div class="inventory-name">💊 ' + med.name + '</div>';
        html += '<div class="inventory-count' + (isLow ? ' low' : '') + '">' + med.stock + '/' + med.maxStock + '</div>';
        html += '</div>';
        html += '<div class="progress-bar"><div class="progress-fill ' + fillClass + '" style="width:' + percent + '%;">' + percent + '%</div></div>';
        html += '<div class="inventory-detail">';
        if (isLow) {
            html += '⚠️ 库存不足！约还可服用 ' + daysLeft + ' 天，请及时补充。';
        } else {
            html += '约还可服用 ' + daysLeft + ' 天。';
        }
        html += '</div>';
        html += '</div>';
    });
    grid.innerHTML = html;
}

// ========== Emergency Dial ==========
let dialTimer = null;
let dialStep = 0;

function dialContact(relation, name, phone) {
    const modal = document.getElementById('dialModal');
    const icons = { '儿子': '👨', '女儿': '👩', '老伴': '👵', '社区医生': '👨‍⚕️' };
    document.getElementById('dialAvatar').textContent = icons[relation] || '📞';
    document.getElementById('dialName').textContent = name + '（' + relation + '）';
    document.getElementById('dialPhone').textContent = '📞 ' + phone;
    document.getElementById('dialStatus').textContent = '正在拨号';
    dialStep = 0;
    modal.classList.add('active');

    const steps = ['正在拨号', '嘟...嘟...', '正在连接...', '等待接听...', '通话中...'];
    dialTimer = setInterval(function() {
        dialStep++;
        if (dialStep < steps.length) {
            document.getElementById('dialStatus').textContent = steps[dialStep];
        }
    }, 1500);

    // Voice announcement
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        var text = '正在为您拨打' + relation + name + '的电话，号码是' + phone.replace(/-/g, '').replace(/x/g, '星') + '。';
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'zh-CN';
        u.rate = 0.8;
        window.speechSynthesis.speak(u);
    }
}

function hangUp() {
    document.getElementById('dialModal').classList.remove('active');
    if (dialTimer) { clearInterval(dialTimer); dialTimer = null; }
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    showToast('已挂断', 'success');
}

// ========== Health Tips Carousel ==========
let currentTip = 0;
let tipsTimer = null;

function renderTips() {
    const track = document.getElementById('tipsTrack');
    const dots = document.getElementById('tipsDots');
    let html = '';
    healthTips.forEach(function(tip) {
        html += '<div class="tip-slide">';
        html += '<div class="tip-icon">' + tip.icon + '</div>';
        html += '<div class="tip-title">' + tip.title + '</div>';
        html += '<div class="tip-content">' + tip.content + '</div>';
        html += '</div>';
    });
    track.innerHTML = html;

    let dotsHtml = '';
    healthTips.forEach(function(_, i) {
        dotsHtml += '<div class="tip-dot' + (i === 0 ? ' active' : '') + '" onclick="goToTip(' + i + ')"></div>';
    });
    dots.innerHTML = dotsHtml;
}

function goToTip(index) {
    currentTip = index;
    const track = document.getElementById('tipsTrack');
    track.style.transform = 'translateX(-' + (index * 100) + '%)';
    document.querySelectorAll('.tip-dot').forEach(function(dot, i) {
        dot.classList.toggle('active', i === index);
    });
    if (tipsTimer) { clearInterval(tipsTimer); startTipsTimer(); }
}

function startTipsTimer() {
    tipsTimer = setInterval(function() {
        currentTip = (currentTip + 1) % healthTips.length;
        goToTip(currentTip);
    }, 5000);
}

// ========== Auto Reminder Check ==========
function checkReminders() {
    const now = new Date();
    const todayKey = formatDateKey(now);
    const record = medRecords[todayKey] || { morning: false, noon: false, evening: false, bedtime: false };
    const hour = now.getHours();
    const minute = now.getMinutes();
    // Check if it's reminder time (within the first 5 minutes of the slot)
    const checkTimes = [
        { key: 'morning', h: 7 },
        { key: 'noon', h: 12 },
        { key: 'evening', h: 18 },
        { key: 'bedtime', h: 21 }
    ];
    checkTimes.forEach(function(ct) {
        if (hour === ct.h && minute < 5 && !record[ct.key]) {
            const slot = timeSlots.filter(function(s) { return s.key === ct.key; })[0];
            var meds = medicines.filter(function(m) { return m.freq.split(',').indexOf(ct.key) !== -1; });
            if (meds.length > 0) {
                announceReminder(ct.key);
                showToast('⏰ ' + slot.label + '用药提醒！', 'warning');
            }
        }
    });
}

// ========== Init ==========
function init() {
    generateRecords();
    generateMonthRecords(new Date().getFullYear(), new Date().getMonth());
    renderOverview();
    renderMedicineTable();
    renderCalendar();
    renderInventory();
    renderTips();
    startTipsTimer();

    // Start clock
    updateClock();
    setInterval(updateClock, 1000);

    // Check reminders every minute
    setInterval(checkReminders, 60000);
    checkReminders();

    // Re-render overview every minute to update reminder states
    setInterval(renderOverview, 60000);
}

// Start when DOM is ready
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}
</script>
