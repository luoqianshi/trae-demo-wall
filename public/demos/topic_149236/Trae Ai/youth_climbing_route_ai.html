<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>青少年专项定制攀岩定线 AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    body { font-family: 'Segoe UI','Microsoft YaHei',sans-serif; background:#0f172a; color:#e2e8f0; }
    .panel { background:#1e293b; border-radius:12px; border:1px solid #334155; }
    .input-group { margin-bottom:14px; }
    .input-group label { display:block; font-size:13px; color:#94a3b8; margin-bottom:4px; }
    input, select { width:100%; background:#0f172a; border:1px solid #475569; border-radius:6px; padding:6px 10px; color:#e2e8f0; }
    .checkbox-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .checkbox-item { display:flex; align-items:center; gap:6px; background:#0f172a; padding:6px 8px; border-radius:6px; border:1px solid #334155; }
    .checkbox-item input { width:auto; }
    .checkbox-item label { margin:0; color:#cbd5e1; font-size:12px; }
    .btn { background:#3b82f6; color:white; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; font-weight:600; transition:.2s; }
    .btn:hover { background:#2563eb; }
    .tab { padding:10px 18px; cursor:pointer; border-bottom:2px solid transparent; color:#94a3b8; }
    .tab.active { color:#3b82f6; border-bottom-color:#3b82f6; }
    .tab-content { display:none; }
    .tab-content.active { display:block; }
    canvas#plan2d { background:#f8fafc; border-radius:8px; width:100%; height:600px; }
    #wall3d { width:100%; height:600px; border-radius:8px; background:#0b1120; }
    .tag { display:inline-block; padding:2px 8px; border-radius:12px; font-size:12px; margin-right:6px; }
    .tag-crux { background:#fee2e2; color:#991b1b; }
    .tag-warmup { background:#dcfce7; color:#166534; }
    .tag-core { background:#dbeafe; color:#1e40af; }
  </style>
</head>
<body class="min-h-screen">
  <div class="p-6 max-w-[1600px] mx-auto">
    <header class="mb-6 flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold text-white">青少年专项定制攀岩定线 AI</h1>
        <p class="text-slate-400 text-sm mt-1">基于生理参数 + 技术短板 + 赛事标准，自动生成 2D 定线图与 3D 环绕岩壁模型</p>
      </div>
      <div class="text-right text-xs text-slate-500">
        v0.1 Prototype · 适配 U8–U18
      </div>
    </header>

    <div class="grid grid-cols-[360px_1fr] gap-6">
      <!-- 输入面板 -->
      <aside class="panel p-5 h-fit">
        <h2 class="font-semibold mb-4 text-white">输入参数</h2>

        <div class="input-group">
          <label>年龄组</label>
          <select id="ageGroup">
            <option value="U8">U8</option>
            <option value="U9">U9</option>
            <option value="U10">U10</option>
            <option value="U11">U11</option>
            <option value="U12" selected>U12</option>
            <option value="U15">U15</option>
            <option value="U17">U17</option>
            <option value="U18">U18</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div class="input-group">
            <label>净身高 (cm)</label>
            <input type="number" id="height" value="145">
          </div>
          <div class="input-group">
            <label>臂展 (cm)</label>
            <input type="number" id="wingspan" value="148">
          </div>
          <div class="input-group">
            <label>腿长 (cm)</label>
            <input type="number" id="legLength" value="78">
          </div>
          <div class="input-group">
            <label>体重 (kg)</label>
            <input type="number" id="weight" value="38">
          </div>
        </div>

        <div class="input-group">
          <label>柔韧度等级</label>
          <select id="flexibility">
            <option value="poor">差</option>
            <option value="normal" selected>一般</option>
            <option value="good">优秀</option>
          </select>
        </div>

        <div class="input-group">
          <label>技术短板（可选 1–3 项）</label>
          <div class="checkbox-grid" id="weaknesses">
            <div class="checkbox-item"><input type="checkbox" value="finger" id="w_finger" checked><label for="w_finger">指力弱</label></div>
            <div class="checkbox-item"><input type="checkbox" value="endurance" id="w_endurance"><label for="w_endurance">小臂耐力差</label></div>
            <div class="checkbox-item"><input type="checkbox" value="lock" id="w_lock"><label for="w_lock">锁肩无力</label></div>
            <div class="checkbox-item"><input type="checkbox" value="pullup" id="w_pullup"><label for="w_pullup">引体薄弱</label></div>
            <div class="checkbox-item"><input type="checkbox" value="foot" id="w_foot"><label for="w_foot">踩点不稳</label></div>
            <div class="checkbox-item"><input type="checkbox" value="heel" id="w_heel"><label for="w_heel">脚跟勾不会</label></div>
            <div class="checkbox-item"><input type="checkbox" value="coord" id="w_coord"><label for="w_coord">协调/摆荡差</label></div>
            <div class="checkbox-item"><input type="checkbox" value="dynamic" id="w_dynamic"><label for="w_dynamic">动态跳不敢</label></div>
            <div class="checkbox-item"><input type="checkbox" value="flex" id="w_flex"><label for="w_flex">柔韧/开胯差</label></div>
          </div>
        </div>

        <div class="input-group">
          <label>岩壁类型</label>
          <select id="wallType">
            <option value="lead" selected>难度赛道（先锋）</option>
            <option value="boulder">抱石墙</option>
            <option value="speed">速度赛道</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div class="input-group">
            <label>岩壁高度 (m)</label>
            <input type="number" id="wallHeight" value="12" step="0.5">
          </div>
          <div class="input-group">
            <label>岩壁宽度 (m)</label>
            <input type="number" id="wallWidth" value="8" step="0.5">
          </div>
        </div>

        <div class="input-group">
          <label>立体结构</label>
          <select id="wallShape">
            <option value="flat" selected>单面直墙</option>
            <option value="L">L 型转角墙</option>
            <option value="curved">环绕曲面墙</option>
            <option value="arete">岩脊 / 外转角墙</option>
            <option value="dihedral">内角 / Dihedral</option>
            <option value="arch">拱顶墙</option>
          </select>
        </div>

        <div class="input-group">
          <label>岩壁角度</label>
          <select id="wallAngle">
            <option value="vertical" selected>垂直直壁</option>
            <option value="slab">斜板（俯角/平衡）</option>
            <option value="overhang">仰角（力量）</option>
            <option value="roof">屋檐（技巧/倒挂）</option>
          </select>
        </div>

        <div class="input-group">
          <label>线路风格</label>
          <select id="routeStyle">
            <option value="auto" selected>自动（赛事轮换）</option>
            <option value="balance">平衡线</option>
            <option value="dynamic">协调动态线</option>
            <option value="power">能力力量线</option>
            <option value="technical">复杂技巧线</option>
          </select>
        </div>

        <div class="input-group">
          <label>目标难度</label>
          <select id="difficulty">
            <option value="5.9">5.9</option>
            <option value="5.10a">5.10a</option>
            <option value="5.10b">5.10b</option>
            <option value="5.10c" selected>5.10c</option>
            <option value="5.10d">5.10d</option>
            <option value="5.11a">5.11a</option>
            <option value="5.11b">5.11b</option>
            <option value="5.11c">5.11c</option>
            <option value="5.11d">5.11d</option>
            <option value="5.12a">5.12a</option>
            <option value="5.12b">5.12b</option>
            <option value="5.12c">5.12c</option>
          </select>
        </div>

        <div class="input-group">
          <label>训练模式</label>
          <select id="trainingMode">
            <option value="focused" selected>专项补强线</option>
            <option value="comp">综合竞技线</option>
            <option value="endurance">耐力长线路</option>
          </select>
        </div>

        <div class="input-group">
          <label>套餐模式</label>
          <select id="packageMode">
            <option value="single" selected>单条线路</option>
            <option value="set3">3 条梯度套餐（入门→进阶→竞技）</option>
          </select>
        </div>

        <button class="btn w-full mt-2" onclick="generateRoute()">生成专属线路</button>
      </aside>

      <!-- 输出区 -->
      <main class="panel p-5">
        <div id="routeSelector" class="hidden mb-3 flex flex-wrap gap-2"></div>
        <div class="flex border-b border-slate-700 mb-4">
          <div class="tab active" data-tab="plan" onclick="switchTab('plan', this)">2D 平面定线图</div>
          <div class="tab" data-tab="model" onclick="switchTab('model', this)">3D 环绕岩壁模型</div>
          <div class="tab" data-tab="report" onclick="switchTab('report', this)">配套训练报告</div>
        </div>

        <div id="plan" class="tab-content active">
          <canvas id="plan2d" width="1200" height="700"></canvas>
          <div class="mt-3 flex gap-4 text-sm text-slate-400">
            <span><span class="inline-block w-3 h-3 rounded-full bg-red-500 mr-1"></span>主攀爬线路</span>
            <span><span class="inline-block w-3 h-3 rounded-full bg-green-500 mr-1"></span>起步段</span>
            <span><span class="inline-block w-3 h-3 rounded-full bg-blue-500 mr-1"></span>核心难点段</span>
            <span><span class="inline-block w-3 h-3 rounded-full bg-purple-500 mr-1"></span>顶点崩溃段</span>
          </div>
        </div>

        <div id="model" class="tab-content">
          <div id="wall3d"></div>
          <div class="mt-3 flex flex-wrap items-center gap-4 text-sm text-slate-400">
            <span>左键旋转 · 滚轮缩放 · 右键平移</span>
            <span><span class="inline-block w-3 h-3 rounded-full bg-red-500 mr-1"></span>攀爬轨迹</span>
            <span><span class="inline-block w-3 h-3 rounded-full bg-yellow-400 mr-1"></span>岩点</span>
            <button id="autoRotateBtn" class="text-xs bg-slate-700 hover:bg-slate-600 text-white px-3 py-1 rounded" onclick="toggleAutoRotate()">开启 360° 自动环绕</button>
          </div>
        </div>

        <div id="report" class="tab-content">
          <div id="reportContent" class="space-y-4 text-slate-200">
            <p class="text-slate-500">点击左侧「生成专属线路」后，训练报告将在此显示。</p>
          </div>
          <button class="btn mt-4" onclick="downloadReport()">导出训练报告为文本</button>
        </div>
      </main>
    </div>
  </div>

<script>
/* ============ 全局状态 ============ */
let routeData = null;   // 当前主线路（兼容单条模式）
let routeSet = null;    // 套餐模式：[主线路, 进阶, 竞技]
let activeRouteIndex = 0; // 套餐中高亮的线路
let scene3d = null;
let renderer3d = null;
let camera3d = null;
let controls3d = null;
let wallGroup3d = null;
let autoRotate = false;

/* ============ 常量与配置 ============ */
const AGE_LIMITS = {
  U8:  { maxSpan: 55,  maxDyn: 40,  heightRange: [110, 130] },
  U9:  { maxSpan: 60,  maxDyn: 45,  heightRange: [120, 135] },
  U10: { maxSpan: 65,  maxDyn: 50,  heightRange: [125, 140] },
  U11: { maxSpan: 70,  maxDyn: 55,  heightRange: [130, 145] },
  U12: { maxSpan: 80,  maxDyn: 60,  heightRange: [135, 155] },
  U15: { maxSpan: 100, maxDyn: 85,  heightRange: [150, 170] },
  U17: { maxSpan: 115, maxDyn: 95,  heightRange: [160, 180] },
  U18: { maxSpan: 120, maxDyn: 105, heightRange: [165, 185] }
};

const HOLD_TYPES = {
  jug:     { name: '大点',   color: '#22c55e', kind: 'hand', radius: 22, shape: 'jug',       size: [0.28, 0.18, 0.12] },
  crimp:   { name: '小抠点', color: '#f59e0b', kind: 'hand', radius: 12, shape: 'crimp',      size: [0.14, 0.08, 0.05] },
  sloper:  { name: '造型点', color: '#8b5cf6', kind: 'hand', radius: 18, shape: 'sloper',     size: [0.22, 0.22, 0.10] },
  pinch:   { name: '捏点',   color: '#ec4899', kind: 'hand', radius: 15, shape: 'pinch',      size: [0.12, 0.18, 0.10] },
  foot:    { name: '踩点',   color: '#64748b', kind: 'foot', radius: 10, shape: 'foot',       size: [0.12, 0.10, 0.04] },
  pocket:  { name: '指洞点', color: '#14b8a6', kind: 'hand', radius: 11, shape: 'pocket',     size: [0.13, 0.10, 0.08] },
  under:   { name: '反抠点', color: '#ef4444', kind: 'hand', radius: 14, shape: 'undercut',   size: [0.18, 0.12, 0.08] },
  heel:    { name: '脚跟勾点',color: '#f97316', kind: 'foot', radius: 13, shape: 'heel',       size: [0.16, 0.10, 0.10] }
};

const WEAKNESS_MOVES = {
  finger:   { hold: 'crimp',  action: '连续小抠点静态锁', tags: ['指力', '锁力'] },
  endurance:{ hold: 'crimp',  action: '长耐力横移段', tags: ['耐力'] },
  lock:     { hold: 'under',  action: '锁肩反抠控制', tags: ['锁肩'] },
  pullup:   { hold: 'jug',    action: '引体式大点拉起', tags: ['上肢'] },
  foot:     { hold: 'foot',   action: '薄踩点精确踩脚', tags: ['下肢'] },
  heel:     { hold: 'sloper', action: '脚跟勾折膝', tags: [' heel hook'] },
  coord:    { hold: 'pinch',  action: '交叉手侧拉摆荡', tags: ['协调'] },
  dynamic:  { hold: 'jug',    action: '动态跳跃抓点', tags: ['动态'] },
  flex:     { hold: 'sloper', action: '大开胯侧身伸展', tags: ['柔韧'] }
};

// 赛事线路风格模板：参考十四运会 / U系列赛事四类风格
const ROUTE_STYLES = {
  balance: {
    name: '平衡线',
    desc: '踩小点支撑、身体移动、撑推动作，强调重心控制与动作规划',
    moves: [
      { hold: 'foot',   action: '踩小点平衡转移',      tags: ['平衡', '下肢'] },
      { hold: 'sloper', action: '侧身撑推稳定重心',    tags: ['平衡', '撑推'] },
      { hold: 'pinch',  action: '双手对抗捏点转移',    tags: ['平衡', '对抗'] },
      { hold: 'foot',   action: '换脚后慢速出右手',    tags: ['平衡', '换脚'] },
      { hold: 'sloper', action: '斜板开胯伸展抓点',    tags: ['平衡', '柔韧'] }
    ],
    stepH: 0.55,
    lateralRatio: 0.7,
    cruxEvery: 2
  },
  dynamic: {
    name: '协调动态线',
    desc: '连贯摆荡、交叉脚、动态跳跃，强调身体协调与爆发力',
    moves: [
      { hold: 'jug',    action: '动态起步跳跃',        tags: ['动态', '爆发'] },
      { hold: 'jug',    action: '摆荡后侧身跳',        tags: ['动态', '摆荡'] },
      { hold: 'pinch',  action: '交叉手脚协同发力',    tags: ['协调', '交叉'] },
      { hold: 'jug',    action: '后撤步交叉脚启动',    tags: ['动态', '交叉脚'] },
      { hold: 'sloper', action: '双脚蹬摆双手抓点',    tags: ['动态', '协调'] }
    ],
    stepH: 0.75,
    lateralRatio: 0.5,
    cruxEvery: 2
  },
  power: {
    name: '能力力量线',
    desc: '大角度、大跨度、持续输出，强调上肢力量与核心控制',
    moves: [
      { hold: 'jug',    action: '仰角大点强力拉起',    tags: ['力量', '上肢'] },
      { hold: 'under',  action: '锁肩反抠控制重心',    tags: ['力量', '锁肩'] },
      { hold: 'crimp',  action: '长距离小抠点抓握',    tags: ['力量', '指力'] },
      { hold: 'jug',    action: '开门动作稳定Top',      tags: ['力量', '核心'] },
      { hold: 'pocket', action: '指洞点连续发力',      tags: ['力量', '耐力'] }
    ],
    stepH: 0.85,
    lateralRatio: 0.35,
    cruxEvery: 3
  },
  technical: {
    name: '复杂技巧线',
    desc: '勾挂、撑推、涨手涨脚、Kneebar，强调动作次序与阅读线路',
    moves: [
      { hold: 'sloper', action: '脚跟勾倒挂转移',      tags: ['技巧', '勾挂'] },
      { hold: 'under',  action: '扒电梯门撑推动作',    tags: ['技巧', '撑推'] },
      { hold: 'jug',    action: '涨手/涨脚转身',       tags: ['技巧', '涨手'] },
      { hold: 'heel',   action: 'Kneebar稳定重心',     tags: ['技巧', 'Kneebar'] },
      { hold: 'sloper', action: '人体旗帜静态控制',    tags: ['技巧', '核心'] }
    ],
    stepH: 0.60,
    lateralRatio: 0.55,
    cruxEvery: 2
  }
};

// 岩壁角度对动作与岩点的影响
const WALL_ANGLES = {
  vertical: { name: '垂直直壁', holdBias: null,   stepMul: 1.0, lateralMul: 1.0 },
  slab:     { name: '斜板',     holdBias: 'sloper', stepMul: 0.9, lateralMul: 1.2 },
  overhang: { name: '仰角',     holdBias: 'jug',    stepMul: 1.1, lateralMul: 0.7 },
  roof:     { name: '屋檐',     holdBias: 'under',  stepMul: 1.0, lateralMul: 0.6 }
};

/* ============ 工具函数 ============ */
function rand(min, max) { return Math.random() * (max - min) + min; }
function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function dist2d(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function dist3d(a, b) { return Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z); }

// 创建单个路径点
function createPoint(pos, segment, idx, holdType, action, tags, isCrux, difficultyBoost, wallW, wallH) {
  return {
    x: pos.x, y: pos.y, z: pos.z,
    segment,
    idx,
    holdType,
    footType: 'foot',
    footX: clamp(pos.x + rand(-0.2, 0.2), 0.3, wallW - 0.3),
    footY: clamp(pos.y - rand(0.5, 0.8), 0.15, wallH - 0.5),
    footZ: clamp(pos.z + rand(-0.15, 0.15), -wallW * 0.25, wallW * 0.25),
    action,
    tags,
    isCrux,
    difficultyBoost
  };
}

// 赛事风格收尾动作
function styleFinisher(style) {
  const map = {
    balance: '顶点平衡控制收尾',
    dynamic: '顶点动态跳跃收尾',
    power: '顶点力量开门收尾',
    technical: '顶点技巧Kneebar收尾'
  };
  return map[style] || '顶点复合发力收尾';
}

// 线路后处理：休息点、难点丛集、特殊动作组合
function enrichRoute(points, style, angle) {
  const wallW = points[0]._wallW || 8; // 占位，实际不需要
  // 标记难点丛集：每个 crux 点后 1–2 步也增加难度
  for (let i = 1; i < points.length - 2; i++) {
    const p = points[i];
    if (p.isCrux && (p.segment.type === 'core' || p.segment.type === 'crux')) {
      const clusterLen = randInt(1, 2);
      for (let k = 1; k <= clusterLen && i + k < points.length - 1; k++) {
        const q = points[i + k];
        if (q.segment.type !== 'warmup' && !q.isRest) {
          q.isCrux = true;
          q.difficultyBoost *= 1.15;
          // 难点丛集内形成特殊动作组合
          q.action = comboAction(p.action, q.action);
        }
      }
    }
  }

  // 插入休息大点：在连续难点后或每 3–4 个非起步点给一个休息 jug
  let sinceRest = 0;
  for (let i = 2; i < points.length - 1; i++) {
    sinceRest++;
    const p = points[i];
    const prev = points[i - 1];
    if (p.isCrux) sinceRest++;
    if (sinceRest >= 3 && !p.isCrux && p.segment.type !== 'warmup' && Math.random() < 0.55) {
      p.holdType = 'jug';
      p.action = '休息大点调整呼吸';
      p.tags = ['休息'];
      p.isRest = true;
      p.difficultyBoost = 0.8;
      sinceRest = 0;
    }
  }

  // 特定风格全局调味
  if (style === 'technical' && angle === 'roof') {
    // 屋檐技巧线增加倒挂勾挂密度
    points.forEach((p, i) => {
      if (i > 2 && i < points.length - 2 && Math.random() < 0.25) {
        p.footType = 'heel';
        if (!p.isRest) p.action = '屋檐倒挂脚跟勾';
      }
    });
  }
}

function comboAction(prev, curr) {
  const combos = [
    '摆荡后动态出点',
    '勾挂转侧拉',
    '锁肩后大跨度抓点',
    '换脚后连续发力',
    '侧身折膝出点',
    '撑推转移重心',
    '脚跟勾配合上高脚'
  ];
  if (Math.random() < 0.25) return combos[randInt(0, combos.length - 1)];
  return curr;
}

// 路径模式库：让每条线路形态明显不同
function pickPathPattern(style, angle, shape, wallW, wallH) {
  const patterns = [];

  // 1. 经典之字形横移（平衡/技术）
  patterns.push({
    name: 'zigzag',
    getPoint: (i, n, current, maxSpan) => {
      const direction = Math.floor(i / 2) % 2 === 0 ? 1 : -1;
      const dx = direction * rand(maxSpan * 0.25, maxSpan * 0.55) / 100;
      let dz = shapeZ(shape, i, n, wallW);
      return {
        x: clamp(current.x + dx, 0.4, wallW - 0.4),
        y: current.y + rand(0.4, 0.9),
        z: clamp(dz, -wallW * 0.35, wallW * 0.35)
      };
    }
  });

  // 2. 直线力量线（力量/仰角）
  patterns.push({
    name: 'straight',
    getPoint: (i, n, current, maxSpan) => {
      const wiggle = (Math.random() - 0.5) * (maxSpan * 0.25 / 100);
      return {
        x: clamp(current.x + wiggle, 0.4, wallW - 0.4),
        y: current.y + rand(0.6, 1.1),
        z: current.z
      };
    }
  });

  // 3. 对角线traverse（斜板/平衡）
  patterns.push({
    name: 'diagonal',
    getPoint: (i, n, current, maxSpan) => {
      const dir = i % 2 === 0 ? 1 : -1;
      const dx = dir * rand(maxSpan * 0.35, maxSpan * 0.65) / 100;
      return {
        x: clamp(current.x + dx, 0.4, wallW - 0.4),
        y: current.y + rand(0.25, 0.65),
        z: current.z
      };
    }
  });

  // 4. S形曲线（技术/复杂）
  patterns.push({
    name: 'scurve',
    getPoint: (i, n, current, maxSpan) => {
      const t = (i / n) * Math.PI * 1.5;
      const dx = Math.cos(t) * (maxSpan * 0.45 / 100);
      let dz = shape === 'curved' ? Math.sin(t * 2) * wallW * 0.2 : 0;
      return {
        x: clamp(current.x + dx, 0.4, wallW - 0.4),
        y: current.y + rand(0.4, 0.85),
        z: clamp(dz, -wallW * 0.35, wallW * 0.35)
      };
    }
  });

  // 5. 大跨度动态跳跃线（动态）
  patterns.push({
    name: 'dynoline',
    getPoint: (i, n, current, maxSpan) => {
      const direction = Math.random() > 0.5 ? 1 : -1;
      const dx = direction * rand(maxSpan * 0.4, maxSpan * 0.7) / 100;
      return {
        x: clamp(current.x + dx, 0.4, wallW - 0.4),
        y: current.y + rand(0.5, 1.0),
        z: current.z
      };
    }
  });

  // 6. 阶梯线：清晰左右交替、向上攀登
  patterns.push({
    name: 'staircase',
    getPoint: (i, n, current, maxSpan) => {
      const direction = i % 2 === 0 ? 1 : -1;
      const dx = direction * rand(maxSpan * 0.3, maxSpan * 0.6) / 100;
      return {
        x: clamp(current.x + dx, 0.4, wallW - 0.4),
        y: current.y + rand(0.55, 0.95),
        z: shapeZ(shape, i, n, wallW)
      };
    }
  });

  // 7. 大横移线：长距离横向再向上
  patterns.push({
    name: 'bigtraverse',
    getPoint: (i, n, current, maxSpan) => {
      const direction = Math.floor(i / 3) % 2 === 0 ? 1 : -1;
      const dx = direction * rand(maxSpan * 0.45, maxSpan * 0.75) / 100;
      return {
        x: clamp(current.x + dx, 0.4, wallW - 0.4),
        y: current.y + rand(0.2, 0.55),
        z: current.z
      };
    }
  });

  // 8. 裂缝线：垂直略带左右交替
  patterns.push({
    name: 'crack',
    getPoint: (i, n, current, maxSpan) => {
      const direction = i % 2 === 0 ? 1 : -1;
      const dx = direction * rand(maxSpan * 0.1, maxSpan * 0.25) / 100;
      return {
        x: clamp(current.x + dx, wallW * 0.45, wallW * 0.55),
        y: current.y + rand(0.55, 0.95),
        z: current.z
      };
    }
  });

  // 9. 波浪线：上下起伏的节奏线
  patterns.push({
    name: 'wave',
    getPoint: (i, n, current, maxSpan) => {
      const t = (i / n) * Math.PI * 3;
      const dx = Math.sin(t) * (maxSpan * 0.5 / 100);
      const dyBonus = Math.cos(t) * 0.25;
      return {
        x: clamp(current.x + dx, 0.4, wallW - 0.4),
        y: current.y + rand(0.4, 0.85) + dyBonus,
        z: shapeZ(shape, i, n, wallW)
      };
    }
  });

  // 12. 金字塔线：先外扩再内收，顶点集中爆发
  patterns.push({
    name: 'pyramid',
    getPoint: (i, n, current, maxSpan) => {
      const progress = i / n;
      const widthFactor = Math.sin(progress * Math.PI); // 0 → 1 → 0
      const dx = (progress < 0.5 ? 1 : -1) * widthFactor * (maxSpan * 0.6 / 100);
      return {
        x: clamp(current.x + dx, 0.4, wallW - 0.4),
        y: current.y + rand(0.45, 0.9),
        z: shapeZ(shape, i, n, wallW)
      };
    }
  });

  // 13. 折返线：大幅折返，强调读线与方向变化
  patterns.push({
    name: 'switchback',
    getPoint: (i, n, current, maxSpan) => {
      const direction = i % 3 === 0 ? 1 : i % 3 === 1 ? -1 : 0;
      const dx = direction * rand(maxSpan * 0.35, maxSpan * 0.7) / 100;
      return {
        x: clamp(current.x + dx, 0.4, wallW - 0.4),
        y: current.y + rand(0.35, 0.75),
        z: shapeZ(shape, i, n, wallW)
      };
    }
  });

  // 14. 扩散线：从窄到宽再收拢，适合技术阅读
  patterns.push({
    name: 'flare',
    getPoint: (i, n, current, maxSpan) => {
      const progress = i / n;
      const spread = 1 - Math.abs(progress - 0.5) * 2; // 0 → 1 → 0
      const dx = (i % 2 === 0 ? 1 : -1) * spread * (maxSpan * 0.55 / 100);
      return {
        x: clamp(current.x + dx, 0.4, wallW - 0.4),
        y: current.y + rand(0.4, 0.85),
        z: shapeZ(shape, i, n, wallW)
      };
    }
  });

  // 10. 屋顶横移线（屋檐/角度）
  patterns.push({
    name: 'rooftraverse',
    getPoint: (i, n, current, maxSpan) => {
      const direction = Math.floor(i / 2) % 2 === 0 ? 1 : -1;
      const dx = direction * rand(maxSpan * 0.3, maxSpan * 0.6) / 100;
      return {
        x: clamp(current.x + dx, 0.4, wallW - 0.4),
        y: current.y + rand(0.15, 0.45),
        z: current.z
      };
    }
  });

  // 11. 转角环绕（立体墙）
  if (shape === 'L' || shape === 'curved' || shape === 'arete' || shape === 'dihedral' || shape === 'arch') {
    patterns.push({
      name: 'wrap',
      getPoint: (i, n, current, maxSpan) => {
        const progress = i / n;
        if (shape === 'L') {
          const x = progress < 0.5 ? current.x + rand(0.1, 0.4) : wallW * 0.6;
          const z = progress < 0.5 ? 0 : current.z + rand(0.2, 0.6);
          return { x: clamp(x, 0.4, wallW - 0.4), y: current.y + rand(0.4, 0.8), z: clamp(z, 0, wallW * 0.45) };
        } else if (shape === 'curved') {
          const angle = progress * Math.PI * 2;
          const r = wallW * 0.42;
          return { x: wallW * 0.5 + Math.sin(angle) * r, y: current.y + rand(0.35, 0.75), z: Math.cos(angle) * r };
        } else if (shape === 'arete') {
          // 岩脊：沿墙面边缘上下
          const side = Math.random() > 0.5 ? 0.15 : wallW - 0.15;
          return { x: clamp(side + rand(-0.2, 0.2), 0.3, wallW - 0.3), y: current.y + rand(0.4, 0.85), z: rand(0, 0.4) };
        } else if (shape === 'dihedral') {
          // 内角：左右墙交替
          const side = i % 2 === 0 ? 0.15 : wallW - 0.15;
          return { x: clamp(side + rand(-0.15, 0.15), 0.3, wallW - 0.3), y: current.y + rand(0.4, 0.85), z: rand(0, 0.35) };
        } else {
          // arch：沿拱形曲面
          const t = progress * Math.PI;
          return { x: wallW * 0.5 + Math.cos(t) * wallW * 0.35, y: current.y + rand(0.35, 0.75), z: Math.sin(t) * wallW * 0.25 };
        }
      }
    });
  }

  // 风格偏好
  const stylePrefs = {
    balance: ['zigzag', 'diagonal', 'staircase', 'wave', 'flare'],
    dynamic: ['dynoline', 'scurve', 'staircase', 'wave', 'switchback'],
    power: ['straight', 'dynoline', 'crack', 'staircase', 'pyramid'],
    technical: ['scurve', 'zigzag', 'wrap', 'bigtraverse', 'wave', 'switchback', 'flare']
  };
  const anglePrefs = {
    slab: ['diagonal', 'zigzag', 'wave', 'bigtraverse'],
    overhang: ['straight', 'dynoline', 'crack', 'staircase'],
    roof: ['rooftraverse', 'straight', 'wrap'],
    vertical: null
  };
  const shapePrefs = {
    arete: ['wrap', 'crack', 'staircase'],
    dihedral: ['wrap', 'zigzag', 'scurve'],
    arch: ['wrap', 'wave', 'scurve'],
    L: ['wrap', 'zigzag', 'diagonal'],
    curved: ['wrap', 'scurve', 'wave'],
    flat: null
  };

  let candidates = patterns;
  if (stylePrefs[style]) {
    candidates = patterns.filter(p => stylePrefs[style].includes(p.name));
  }
  if (anglePrefs[angle] && anglePrefs[angle].length > 0) {
    const angleCandidates = patterns.filter(p => anglePrefs[angle].includes(p.name));
    if (angleCandidates.length > 0) candidates = angleCandidates;
  }
  if (shapePrefs[shape] && shapePrefs[shape].length > 0) {
    const shapeCandidates = patterns.filter(p => shapePrefs[shape].includes(p.name));
    if (shapeCandidates.length > 0) candidates = shapeCandidates;
  }
  return candidates[randInt(0, candidates.length - 1)];
}

function shapeZ(shape, i, n, wallW) {
  if (shape === 'L' && i > n * 0.35 && i < n * 0.75) return rand(0.3, 0.9);
  if (shape === 'curved') return Math.sin((i / n) * Math.PI * 2) * (wallW * 0.25);
  if (shape === 'arch') return Math.sin((i / n) * Math.PI) * wallW * 0.2;
  if (shape === 'dihedral') return rand(0, 0.25);
  return 0;
}

function getInputs() {
  return {
    ageGroup: document.getElementById('ageGroup').value,
    height: +document.getElementById('height').value,
    wingspan: +document.getElementById('wingspan').value,
    legLength: +document.getElementById('legLength').value,
    weight: +document.getElementById('weight').value,
    flexibility: document.getElementById('flexibility').value,
    weaknesses: Array.from(document.querySelectorAll('#weaknesses input:checked')).map(cb => cb.value),
    wallType: document.getElementById('wallType').value,
    wallHeight: +document.getElementById('wallHeight').value,
    wallWidth: +document.getElementById('wallWidth').value,
    wallShape: document.getElementById('wallShape').value,
    wallAngle: document.getElementById('wallAngle').value,
    routeStyle: document.getElementById('routeStyle').value,
    difficulty: document.getElementById('difficulty').value,
    trainingMode: document.getElementById('trainingMode').value,
    packageMode: document.getElementById('packageMode').value
  };
}

/* ============ 定线算法核心 ============ */
const DIFF_KEYS = ['5.9','5.10a','5.10b','5.10c','5.10d','5.11a','5.11b','5.11c','5.11d','5.12a','5.12b','5.12c'];
const DIFF_MAP = Object.fromEntries(DIFF_KEYS.map((k, i) => [k, i + 1]));

// 套餐用线路配色（2D 轨迹 / 3D 轨迹）
const ROUTE_COLORS = [
  { stroke: '#ef4444', glow: 0xff3333, name: '入门线' },
  { stroke: '#3b82f6', glow: 0x3388ff, name: '进阶线' },
  { stroke: '#a855f7', glow: 0xaa55ff, name: '竞技线' }
];

function adjustDifficulty(diff, delta) {
  const idx = DIFF_KEYS.indexOf(diff);
  if (idx < 0) return diff;
  return DIFF_KEYS[clamp(idx + delta, 0, DIFF_KEYS.length - 1)];
}

function buildRoute(rawInputs, overrides = {}) {
  const inputs = { ...rawInputs, ...overrides };
  const limits = AGE_LIMITS[inputs.ageGroup];
  const maxReach = inputs.wingspan * 0.55;
  const effectiveMaxSpan = Math.min(limits.maxSpan, inputs.wingspan * 0.75);
  const effectiveMaxDyn = limits.maxDyn;

  const wallH = inputs.wallHeight;
  const wallW = inputs.wallWidth;
  const shape = inputs.wallShape;

  const diffLevel = DIFF_MAP[inputs.difficulty] || 4;

  // 生成锚点：三段式
  const segments = [
    { name: '起步段',   type: 'warmup', startH: 0,   endH: wallH * 0.25, color: '#22c55e' },
    { name: '核心难点段', type: 'core',   startH: wallH * 0.25, endH: wallH * 0.75, color: '#3b82f6' },
    { name: '顶点崩溃段', type: 'crux',   startH: wallH * 0.75, endH: wallH,       color: '#a855f7' }
  ];

  // 选择线路风格（auto 则赛事轮换）
  const styleKeys = Object.keys(ROUTE_STYLES);
  const selectedStyle = inputs.routeStyle === 'auto'
    ? styleKeys[randInt(0, styleKeys.length - 1)]
    : inputs.routeStyle;
  const style = ROUTE_STYLES[selectedStyle];
  const angle = WALL_ANGLES[inputs.wallAngle];

  // 基于短板 + 风格构建动作库
  const focusMoves = inputs.weaknesses.map(w => WEAKNESS_MOVES[w]);
  const styleMoves = style.moves.slice();
  const movePool = [];
  for (let i = 0; i < 10; i++) {
    if (i % 5 < 3) movePool.push(styleMoves[i % styleMoves.length]);
    else movePool.push(focusMoves[i % focusMoves.length]);
  }

  // 生成路径点
  const points = [];
  const stepH = style.stepH * angle.stepMul * (1 - (diffLevel - 1) * 0.015); // 难度越高步距略紧
  const numPoints = Math.max(10, Math.min(24, Math.floor(wallH / stepH)));

  // 套餐模式下让 3 条线路从岩壁不同横向位置起步，避免重叠
  const colorIdx = overrides.colorIdx || 0;
  const lateralOffset = inputs.packageMode === 'set3' ? (colorIdx - 1) * wallW * 0.18 : 0;
  let current = { x: clamp(wallW * 0.5 + lateralOffset, wallW * 0.2, wallW * 0.8), y: 0.3, z: 0 };
  points.push(createPoint(current, segments[0], 0, 'jug', '起步', ['热身'], false, 1.0, wallW, wallH));

  // 路径模式：根据风格和结构随机选择
  const pattern = pickPathPattern(selectedStyle, inputs.wallAngle, shape, wallW, wallH);

  for (let i = 1; i < numPoints; i++) {
    const progress = i / (numPoints - 1);
    const h = progress * wallH;
    const seg = segments.find(s => h >= s.startH && h < s.endH) || segments[2];

    // 按模式计算下一个目标位置
    let next = pattern.getPoint(i, numPoints, current, effectiveMaxSpan, wallW, wallH);

    // 高度推进：保证向上趋势，但允许模式做横向/斜向变化
    let dy = stepH * rand(0.8, 1.3);
    if (selectedStyle === 'power') dy *= 1.15;
    if (selectedStyle === 'balance') dy *= 0.9;

    next.y = Math.max(next.y, current.y + dy * 0.5);
    next.y = Math.min(next.y, current.y + dy * 1.5);
    next.y = clamp(next.y, h - 0.2, h + 0.4);

    // 人体工学校验
    if (dist3d(current, next) > effectiveMaxSpan / 100) {
      const ratio = (effectiveMaxSpan / 100) / dist3d(current, next) * 0.9;
      next.x = current.x + (next.x - current.x) * ratio;
      next.y = current.y + (next.y - current.y) * ratio;
      next.z = current.z + (next.z - current.z) * ratio;
    }

    const reachRequired = next.y - current.y;
    if (reachRequired > maxReach / 100) {
      next.y = current.y + maxReach / 100;
    }

    let difficultyBoost = (seg.type === 'core' ? 1.25 : seg.type === 'crux' ? 1.5 : 1.0);
    // 难度等级整体加压
    difficultyBoost *= 1 + (diffLevel - 4) * 0.04;

    // 动作选择
    let move = movePool[i % movePool.length];
    if (seg.type === 'warmup') {
      move = { hold: 'jug', action: '基础抓握热身', tags: ['热身'] };
    }
    if (inputs.trainingMode === 'endurance' && seg.type === 'core') {
      move = { ...focusMoves[0], action: '长耐力' + focusMoves[0].action };
    }

    // 角度岩点偏好
    if (angle.holdBias && seg.type !== 'warmup' && Math.random() < 0.35) {
      move = { ...move, hold: angle.holdBias };
    }

    let footType = 'foot';
    if (move.action.includes('脚跟勾') || move.action.includes('倒挂') || move.action.includes('Kneebar')) footType = 'heel';

    const footX = clamp(next.x + rand(-0.3, 0.3), 0.3, wallW - 0.3);
    const footY = clamp(next.y - rand(0.5, 0.9), 0.15, wallH - 0.5);
    const footZ = clamp(next.z + rand(-0.2, 0.2), -wallW * 0.25, wallW * 0.25);

    const isCrux = (seg.type === 'core' || seg.type === 'crux') && (i % style.cruxEvery === 0);

    points.push({
      x: next.x,
      y: next.y,
      z: next.z,
      segment: seg,
      idx: i,
      holdType: move.hold,
      footType,
      footX,
      footY,
      footZ,
      action: move.action,
      tags: move.tags,
      isCrux,
      difficultyBoost,
      style: selectedStyle
    });

    current = next;
  }

  // 确保终点到达顶部
  const last = points[points.length - 1];
  last.y = wallH - 0.2;
  last.segment = segments[2];
  last.isCrux = true;
  last.action = styleFinisher(selectedStyle);
  last.holdType = 'jug';
  last.footType = 'foot';
  last.footX = clamp(last.x + 0.1, 0.3, wallW - 0.3);
  last.footY = clamp(last.y - 0.6, 0.15, wallH - 0.5);
  last.footZ = last.z;

  enrichRoute(points, selectedStyle, inputs.wallAngle);

  return {
    inputs,
    points,
    segments,
    focusMoves,
    limits,
    effectiveMaxSpan,
    effectiveMaxDyn,
    maxReach,
    diffLevel,
    style: selectedStyle,
    styleName: style.name,
    styleDesc: style.desc,
    angle: inputs.wallAngle,
    angleName: angle.name,
    patternName: pattern.name,
    colorIdx: overrides.colorIdx || 0
  };
}

function generateRoute() {
  const inputs = getInputs();
  if (inputs.weaknesses.length === 0) {
    alert('请至少选择一项技术短板');
    return;
  }
  if (inputs.weaknesses.length > 3) {
    alert('最多选择 3 项短板');
    return;
  }

  if (inputs.packageMode === 'set3') {
    // 3 条梯度套餐：入门(-2) → 进阶(目标) → 竞技(+2)
    // 强制 3 条线路风格不同，最大化多样性
    const baseDiff = inputs.difficulty;
    const styleKeys = Object.keys(ROUTE_STYLES);
    const shuffled = styleKeys.sort(() => Math.random() - 0.5);
    const setConfigs = [
      { difficulty: adjustDifficulty(baseDiff, -2), trainingMode: 'focused', routeStyle: shuffled[0], colorIdx: 0 },
      { difficulty: baseDiff, trainingMode: 'comp', routeStyle: shuffled[1], colorIdx: 1 },
      { difficulty: adjustDifficulty(baseDiff, 2), trainingMode: 'comp', routeStyle: shuffled[2], colorIdx: 2 }
    ];
    routeSet = setConfigs.map(cfg => buildRoute(inputs, cfg));
    routeData = routeSet[1]; // 主展示用进阶线
    activeRouteIndex = 1;
  } else {
    routeSet = null;
    routeData = buildRoute(inputs, { colorIdx: 0 });
    activeRouteIndex = 0;
  }

  render2D();
  render3D();
  renderReport();
  updateRouteSelector();
  switchTab('plan');
}

/* ============ 2D 渲染 ============ */
function render2D() {
  const canvas = document.getElementById('plan2d');
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;
  const routes = routeSet || [routeData];
  const d0 = routes[0];

  ctx.clearRect(0, 0, w, h);

  // 绘图比例
  const pad = 60;
  const scaleX = (w - pad * 2) / d0.inputs.wallWidth;
  const scaleY = (h - pad * 2) / d0.inputs.wallHeight;

  // 背景网格
  ctx.strokeStyle = '#e2e8f0';
  ctx.lineWidth = 1;
  for (let i = 0; i <= d0.inputs.wallWidth; i += 1) {
    ctx.beginPath();
    ctx.moveTo(pad + i * scaleX, pad);
    ctx.lineTo(pad + i * scaleX, h - pad);
    ctx.stroke();
  }
  for (let i = 0; i <= d0.inputs.wallHeight; i += 1) {
    ctx.beginPath();
    ctx.moveTo(pad, h - pad - i * scaleY);
    ctx.lineTo(w - pad, h - pad - i * scaleY);
    ctx.stroke();
  }

  // 岩壁轮廓
  ctx.strokeStyle = '#0f172a';
  ctx.lineWidth = 3;
  ctx.strokeRect(pad, pad, w - pad * 2, h - pad * 2);

  // 绘制多条线路：套餐模式下全部显示，单条模式只显示主线路
  routes.forEach((d, routeIdx) => {
    const color = ROUTE_COLORS[d.colorIdx || routeIdx] || ROUTE_COLORS[0];
    const isActive = routeSet ? routeIdx === activeRouteIndex : true;
    const alpha = routeSet ? (isActive ? 1 : 0.55) : 1;
    const lineWidth = routeSet ? (isActive ? 6 : 3.5) : 6;
    const glowWidth = routeSet ? (isActive ? 14 : 8) : 14;

    // 轨迹线
    ctx.beginPath();
    d.points.forEach((p, i) => {
      const px = pad + p.x * scaleX;
      const py = h - pad - p.y * scaleY;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    });
    ctx.strokeStyle = hexToRgba(color.stroke, 0.22 * alpha);
    ctx.lineWidth = glowWidth;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
    ctx.strokeStyle = hexToRgba(color.stroke, alpha);
    ctx.lineWidth = lineWidth;
    ctx.stroke();

    // 方向箭头
    for (let i = 1; i < d.points.length; i += 2) {
      const p1 = d.points[i - 1], p2 = d.points[i];
      const x1 = pad + p1.x * scaleX, y1 = h - pad - p1.y * scaleY;
      const x2 = pad + p2.x * scaleX, y2 = h - pad - p2.y * scaleY;
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      const ang = Math.atan2(y2 - y1, x2 - x1);
      ctx.beginPath();
      ctx.moveTo(mx - 8 * Math.cos(ang - 0.4), my - 8 * Math.sin(ang - 0.4));
      ctx.lineTo(mx, my);
      ctx.lineTo(mx - 8 * Math.cos(ang + 0.4), my - 8 * Math.sin(ang + 0.4));
      ctx.strokeStyle = `rgba(255,255,255,${0.9 * alpha})`;
      ctx.lineWidth = routeSet ? (isActive ? 3 : 2) : 3;
      ctx.stroke();
    }

    // 支点：套餐非高亮线路缩小显示
    const holdScale = routeSet ? (isActive ? 1.0 : 0.65) : 1.0;
    d.points.forEach((p, i) => {
      const px = pad + p.x * scaleX;
      const py = h - pad - p.y * scaleY;
      drawHold(ctx, px, py, p.holdType, holdScale);

      if (isActive) {
        const info = HOLD_TYPES[p.holdType];
        const r = info.radius * holdScale;
        ctx.beginPath();
        ctx.arc(px + r * 0.6, py - r * 0.6, 10, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.95)';
        ctx.fill();
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(i + 1, px + r * 0.6, py - r * 0.6 + 1);
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
      }

      // 脚点
      const fpx = pad + p.footX * scaleX;
      const fpy = h - pad - p.footY * scaleY;
      drawFootHold(ctx, fpx, fpy, p.footType, 0.8 * holdScale);

      // 标注难点动作（仅高亮线路详细标注）
      if (isActive && (p.isCrux || i === d.points.length - 1)) {
        ctx.font = 'bold 12px sans-serif';
        const text = p.action;
        const tw = ctx.measureText(text).width;
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.fillRect(px + 12, py - 22, tw + 8, 18);
        ctx.fillStyle = '#0f172a';
        ctx.fillText(text, px + 16, py - 10);
      }

      // 起步/终点标记
      if (isActive) {
        if (i === 0) {
          ctx.fillStyle = '#22c55e';
          ctx.font = 'bold 14px sans-serif';
          ctx.fillText('起', px - 20, py + 5);
        }
        if (i === d.points.length - 1) {
          ctx.fillStyle = '#a855f7';
          ctx.font = 'bold 14px sans-serif';
          ctx.fillText('顶', px + 16, py + 5);
        }
      }
    });
  });

  // 标尺与线路信息
  ctx.fillStyle = '#334155';
  ctx.font = '12px sans-serif';
  ctx.fillText(`高度: ${d0.inputs.wallHeight}m · 宽度: ${d0.inputs.wallWidth}m · 角度: ${d0.angleName}`, pad, 25);
  if (routeSet) {
    const summary = routeSet.map((d, i) => `${ROUTE_COLORS[i].name}: ${d.styleName} · ${d.inputs.difficulty} · ${d.patternName}`).join('  |  ');
    ctx.fillText(`套餐：${summary}`, pad, 43);
  } else {
    ctx.fillText(`线路风格: ${d0.styleName}（${d0.styleDesc}）`, pad, 43);
    ctx.fillText(`路径形态: ${d0.patternName} · 最大跨距: ${d0.effectiveMaxSpan}cm`, w - 360, 43);
  }

  // 图例：岩点类型 + 套餐线路颜色
  let lx = pad;
  Object.entries(HOLD_TYPES).forEach(([k, v]) => {
    drawHold(ctx, lx + 10, h - 25, k, 0.8);
    ctx.fillStyle = '#334155';
    ctx.fillText(v.name, lx + 25, h - 20);
    lx += 90;
  });

  if (routeSet) {
    lx = w - pad - 260;
    routeSet.forEach((d, i) => {
      const c = ROUTE_COLORS[i].stroke;
      ctx.beginPath();
      ctx.arc(lx + 8, h - 25, 6, 0, Math.PI * 2);
      ctx.fillStyle = c;
      ctx.fill();
      ctx.fillStyle = '#334155';
      ctx.fillText(`${ROUTE_COLORS[i].name} ${d.inputs.difficulty}`, lx + 18, h - 20);
      lx += 90;
    });
  }
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function drawHold(ctx, x, y, type, scale) {
  const info = HOLD_TYPES[type];
  const r = info.radius * scale;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = info.color;
  ctx.fill();
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function drawFootHold(ctx, x, y, type, scale) {
  const info = HOLD_TYPES[type];
  const r = info.radius * scale;
  ctx.beginPath();
  // 脚点用菱形/椭圆区分
  ctx.ellipse(x, y, r * 1.2, r * 0.7, Math.PI / 4, 0, Math.PI * 2);
  ctx.fillStyle = info.color;
  ctx.fill();
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  // 内部小标记
  ctx.beginPath();
  ctx.arc(x, y, r * 0.3, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fill();
}

function generateNoiseHolds(w, h, count) {
  const holds = [];
  for (let i = 0; i < count; i++) {
    holds.push({
      x: rand(0.2, w - 0.2),
      y: rand(0.5, h - 0.3),
      type: Object.keys(HOLD_TYPES)[randInt(0, Object.keys(HOLD_TYPES).length - 1)]
    });
  }
  return holds;
}

/* ============ 3D 渲染 ============ */
function render3D() {
  const container = document.getElementById('wall3d');
  if (!scene3d) init3D();
  while (wallGroup3d.children.length > 0) wallGroup3d.remove(wallGroup3d.children[0]);

  const routes = routeSet || [routeData];
  const d0 = routes[0];
  const wallW = d0.inputs.wallWidth;
  const wallH = d0.inputs.wallHeight;
  const shape = d0.inputs.wallShape;

  // 岩壁材质
  const wallMat = new THREE.MeshStandardMaterial({ color: 0xcbd5e1, roughness: 0.9, side: THREE.DoubleSide });

  // 内容组：便于对直墙做角度旋转
  const contentGroup = new THREE.Group();
  wallGroup3d.add(contentGroup);

  const wallAngleRad = {
    vertical: 0,
    slab: -Math.PI / 6,     // 斜板：向后仰 30°
    overhang: Math.PI / 5,  // 仰角：向前倾 36°
    roof: Math.PI / 2.3     // 屋檐：接近水平
  }[d0.inputs.wallAngle] || 0;

  if (shape === 'flat') {
    const geo = new THREE.PlaneGeometry(wallW, wallH, 20, 20);
    const wall = new THREE.Mesh(geo, wallMat);
    wall.position.set(wallW / 2, wallH / 2, 0);
    contentGroup.add(wall);
    contentGroup.rotation.x = wallAngleRad;
  } else if (shape === 'L') {
    const g1 = new THREE.PlaneGeometry(wallW * 0.6, wallH, 16, 20);
    const w1 = new THREE.Mesh(g1, wallMat);
    w1.position.set(wallW * 0.3, wallH / 2, 0);
    contentGroup.add(w1);
    const g2 = new THREE.PlaneGeometry(wallW * 0.4, wallH, 16, 20);
    const w2 = new THREE.Mesh(g2, wallMat);
    w2.rotation.y = Math.PI / 2;
    w2.position.set(wallW * 0.6, wallH / 2, wallW * 0.2);
    contentGroup.add(w2);
  } else if (shape === 'curved') {
    const geo = new THREE.CylinderGeometry(wallW * 0.45, wallW * 0.45, wallH, 32, 20, true, Math.PI, Math.PI);
    const wall = new THREE.Mesh(geo, wallMat);
    wall.position.set(wallW * 0.5, wallH / 2, 0);
    wall.rotation.y = Math.PI / 2;
    contentGroup.add(wall);
  } else if (shape === 'arete') {
    // 岩脊：两个相交平面形成外角
    const g1 = new THREE.PlaneGeometry(wallW * 0.5, wallH, 12, 20);
    const w1 = new THREE.Mesh(g1, wallMat);
    w1.position.set(wallW * 0.25, wallH / 2, 0);
    contentGroup.add(w1);
    const g2 = new THREE.PlaneGeometry(wallW * 0.5, wallH, 12, 20);
    const w2 = new THREE.Mesh(g2, wallMat);
    w2.rotation.y = -Math.PI / 3;
    w2.position.set(wallW * 0.75, wallH / 2, wallW * 0.22);
    contentGroup.add(w2);
  } else if (shape === 'dihedral') {
    // 内角：两个相交平面形成内角
    const g1 = new THREE.PlaneGeometry(wallW * 0.5, wallH, 12, 20);
    const w1 = new THREE.Mesh(g1, wallMat);
    w1.position.set(wallW * 0.25, wallH / 2, wallW * 0.25);
    w1.rotation.y = Math.PI / 6;
    contentGroup.add(w1);
    const g2 = new THREE.PlaneGeometry(wallW * 0.5, wallH, 12, 20);
    const w2 = new THREE.Mesh(g2, wallMat);
    w2.rotation.y = -Math.PI / 6;
    w2.position.set(wallW * 0.75, wallH / 2, wallW * 0.25);
    contentGroup.add(w2);
  } else if (shape === 'arch') {
    // 拱顶：半圆柱面
    const geo = new THREE.CylinderGeometry(wallW * 0.55, wallW * 0.55, wallH, 32, 20, true, 0, Math.PI);
    const wall = new THREE.Mesh(geo, wallMat);
    wall.position.set(wallW * 0.5, wallH / 2, -wallW * 0.35);
    wall.rotation.y = Math.PI / 2;
    contentGroup.add(wall);
  }

  // 根据岩壁结构计算岩点实际空间位置
  function placeOnWall(x, y, z, offset) {
    if (shape === 'flat') {
      return new THREE.Vector3(x, y, z + offset);
    } else if (shape === 'L') {
      if (z > 0.3) return new THREE.Vector3(wallW * 0.6 + offset, y, z);
      return new THREE.Vector3(x, y, offset);
    } else if (shape === 'curved') {
      const angle = (x / wallW) * Math.PI - Math.PI / 2;
      const r = wallW * 0.45 + offset;
      return new THREE.Vector3(wallW * 0.5 + Math.sin(angle) * r, y, Math.cos(angle) * r - wallW * 0.45 * 0.3);
    } else if (shape === 'arete') {
      // x<0.5 在左墙面，x>0.5 在右墙面（外角）
      if (x < wallW * 0.55) {
        return new THREE.Vector3(x, y, offset);
      } else {
        const t = (x - wallW * 0.5) / (wallW * 0.5);
        return new THREE.Vector3(wallW * 0.5 + t * wallW * 0.25, y, t * wallW * 0.44 + offset);
      }
    } else if (shape === 'dihedral') {
      // 内角两面
      if (x < wallW * 0.5) {
        const t = x / (wallW * 0.5);
        return new THREE.Vector3(t * wallW * 0.22, y, (1 - t) * wallW * 0.22 + offset);
      } else {
        const t = (x - wallW * 0.5) / (wallW * 0.5);
        return new THREE.Vector3(wallW * 0.22 + t * wallW * 0.28, y, t * wallW * 0.22 + offset);
      }
    } else if (shape === 'arch') {
      const t = x / wallW;
      const angle = t * Math.PI;
      const r = wallW * 0.55 + offset;
      return new THREE.Vector3(wallW * 0.5 + Math.cos(angle) * r - r * 0.5, y, Math.sin(angle) * r);
    }
    return new THREE.Vector3(x, y, offset);
  }

  // 按真实岩点类型创建几何体
  function createHoldMesh(type, opacity = 1.0) {
    const info = HOLD_TYPES[type];
    const [sx, sy, sz] = info.size;
    let geo;
    switch (info.shape) {
      case 'jug':
        geo = new THREE.BoxGeometry(sx, sy, sz, 4, 4, 2);
        // 顶部做圆角化：把上表面顶点往外拉，模拟大点弧度
        const pos = geo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const py = pos.getY(i);
          if (py > 0) {
            const px = pos.getX(i), pz = pos.getZ(i);
            const d = Math.sqrt(px * px + pz * pz);
            const factor = 1 - Math.min(d / (sx * 0.8), 1) * 0.25;
            pos.setY(i, py * factor + sz * 0.15);
          }
        }
        geo.computeVertexNormals();
        break;
      case 'crimp':
        geo = new THREE.BoxGeometry(sx, sy, sz);
        break;
      case 'sloper':
        geo = new THREE.SphereGeometry(sx * 0.5, 16, 12);
        geo.scale(1, 0.55, 0.65);
        break;
      case 'pinch':
        geo = new THREE.BoxGeometry(sx, sy, sz, 4, 4, 2);
        const pp = geo.attributes.position;
        for (let i = 0; i < pp.count; i++) {
          const px = pp.getX(i), py = pp.getY(i);
          const t = Math.abs(py) / (sy * 0.5);
          pp.setX(i, px * (0.65 + 0.35 * t));
          pp.setZ(i, pp.getZ(i) * (0.65 + 0.35 * t));
        }
        geo.computeVertexNormals();
        break;
      case 'foot':
        geo = new THREE.CylinderGeometry(sx * 0.5, sx * 0.45, sz, 12);
        geo.rotateX(Math.PI / 2);
        break;
      case 'heel':
        geo = new THREE.CylinderGeometry(sx * 0.45, sx * 0.35, sz, 12);
        geo.rotateX(Math.PI / 2);
        break;
      case 'pocket':
        geo = new THREE.CylinderGeometry(sx * 0.45, sx * 0.35, sz * 0.6, 12);
        break;
      case 'undercut':
        geo = new THREE.BoxGeometry(sx, sy, sz, 4, 4, 2);
        const up = geo.attributes.position;
        for (let i = 0; i < up.count; i++) {
          if (up.getY(i) > 0 && up.getZ(i) > 0) up.setZ(i, up.getZ(i) * 0.3);
        }
        geo.computeVertexNormals();
        break;
      default:
        geo = new THREE.SphereGeometry(info.radius / 100, 16, 16);
    }
    const mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(info.color),
      roughness: 0.7,
      metalness: 0.1,
      transparent: opacity < 1,
      opacity: opacity
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true;
    return mesh;
  }

  // 添加多条线路的岩点与轨迹
  routes.forEach((d, routeIdx) => {
    const isActive = routeSet ? routeIdx === activeRouteIndex : true;
    const color = ROUTE_COLORS[d.colorIdx || routeIdx] || ROUTE_COLORS[0];
    const holdOpacity = isActive ? 1.0 : 0.55;
    const handOffset = isActive ? 0.06 : 0.04;

    d.points.forEach(p => {
      // 手点
      const hand = createHoldMesh(p.holdType, holdOpacity);
      const handPos = placeOnWall(p.x, p.y, p.z, handOffset);
      hand.position.copy(handPos);
      if (shape === 'curved') {
        const angle = (p.x / wallW) * Math.PI - Math.PI / 2;
        hand.rotation.y = -angle;
      }
      contentGroup.add(hand);

      // 脚点
      const foot = createHoldMesh(p.footType, 0.75 * holdOpacity);
      const footPos = placeOnWall(p.footX, p.footY, p.footZ, 0.04);
      foot.position.copy(footPos);
      if (shape === 'curved') {
        const angle = (p.footX / wallW) * Math.PI - Math.PI / 2;
        foot.rotation.y = -angle;
      }
      contentGroup.add(foot);
    });

    // 攀爬轨迹
    const curvePoints = d.points.map(p => placeOnWall(p.x, p.y, p.z, 0.18));
    const curve = new THREE.CatmullRomCurve3(curvePoints);
    const tubeRadius = isActive ? 0.05 : 0.035;
    const tubeGeo = new THREE.TubeGeometry(curve, 64, tubeRadius, 8, false);
    const tubeMat = new THREE.MeshStandardMaterial({ color: color.glow, emissive: color.glow, emissiveIntensity: isActive ? 0.6 : 0.3, roughness: 0.4 });
    const tube = new THREE.Mesh(tubeGeo, tubeMat);
    contentGroup.add(tube);

    // 轨迹外发光晕
    const glowGeo = new THREE.TubeGeometry(curve, 64, tubeRadius * 2.8, 8, false);
    const glowMat = new THREE.MeshBasicMaterial({ color: color.glow, transparent: true, opacity: isActive ? 0.22 : 0.12 });
    const glow = new THREE.Mesh(glowGeo, glowMat);
    contentGroup.add(glow);
  });

  // 青少年身高参考模型（仅显示在中间/高亮线路附近）
  const refH = d0.inputs.height / 100;
  const bodyGroup = new THREE.Group();
  const bodyGeo = new THREE.CylinderGeometry(0.12, 0.12, refH * 0.8, 16);
  const bodyMat = new THREE.MeshBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.4 });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  bodyGroup.add(body);
  const headGeo = new THREE.SphereGeometry(0.12, 16, 16);
  const head = new THREE.Mesh(headGeo, bodyMat);
  head.position.y = refH * 0.45;
  bodyGroup.add(head);
  const refRoute = routes[activeRouteIndex] || routes[0];
  bodyGroup.position.set(refRoute.points[Math.floor(refRoute.points.length / 2)].x, refH * 0.5, 0.25);
  contentGroup.add(bodyGroup);

  // 调整相机：根据角度给一个好的初始视角
  const angleCam = {
    vertical: { x: wallW * 0.8, y: wallH * 0.7, z: wallW * 1.2 },
    slab:     { x: wallW * 0.5, y: wallH * 0.4, z: wallW * 1.6 },
    overhang: { x: wallW * 0.5, y: wallH * 0.9, z: wallW * 1.4 },
    roof:     { x: wallW * 0.5, y: wallH * 1.3, z: wallW * 1.2 }
  }[d0.inputs.wallAngle];
  camera3d.position.set(angleCam.x, angleCam.y, angleCam.z);
  controls3d.target.set(wallW * 0.5, wallH * 0.5, 0);
  controls3d.update();
}

function init3D() {
  const container = document.getElementById('wall3d');
  scene3d = new THREE.Scene();
  scene3d.background = new THREE.Color(0x0b1120);

  camera3d = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 100);

  renderer3d = new THREE.WebGLRenderer({ antialias: true });
  renderer3d.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer3d.domElement);

  controls3d = new THREE.OrbitControls(camera3d, renderer3d.domElement);
  controls3d.enableDamping = true;

  const ambient = new THREE.AmbientLight(0xffffff, 0.6);
  scene3d.add(ambient);
  const dir = new THREE.DirectionalLight(0xffffff, 0.8);
  dir.position.set(5, 10, 7);
  scene3d.add(dir);

  wallGroup3d = new THREE.Group();
  scene3d.add(wallGroup3d);

  animate3D();
}

function animate3D() {
  requestAnimationFrame(animate3D);
  if (controls3d) {
    if (autoRotate) {
      controls3d.autoRotate = true;
      controls3d.autoRotateSpeed = 1.5;
    } else {
      controls3d.autoRotate = false;
    }
    controls3d.update();
  }
  if (renderer3d && scene3d && camera3d) renderer3d.render(scene3d, camera3d);
}

function toggleAutoRotate() {
  autoRotate = !autoRotate;
  const btn = document.getElementById('autoRotateBtn');
  if (btn) {
    btn.textContent = autoRotate ? '停止 360° 自动环绕' : '开启 360° 自动环绕';
    btn.className = autoRotate
      ? 'text-xs bg-red-600 hover:bg-red-500 text-white px-3 py-1 rounded'
      : 'text-xs bg-slate-700 hover:bg-slate-600 text-white px-3 py-1 rounded';
  }
}

/* ============ 训练报告 ============ */
function renderRouteReport(d) {
  const inp = d.inputs;
  const cruxPoints = d.points.filter(p => p.isCrux);
  const totalDistance = d.points.slice(1).reduce((sum, p, i) => sum + dist3d(d.points[i], p), 0).toFixed(2);
  return `
    <div class="bg-slate-800 p-5 rounded-lg border-l-4" style="border-color:${ROUTE_COLORS[d.colorIdx].stroke}">
      <h3 class="text-lg font-bold text-white mb-3">线路总览 · ${ROUTE_COLORS[d.colorIdx].name} · ${inp.difficulty}</h3>
      <p><strong>适配对象：</strong>${inp.ageGroup} · ${inp.height}cm / 臂展${inp.wingspan}cm</p>
      <p><strong>赛事风格：</strong>${d.styleName} · ${d.styleDesc}</p>
      <p><strong>岩壁角度：</strong>${d.angleName} · 路径形态：${d.patternName}</p>
      <p><strong>训练目标：</strong>${inp.weaknesses.map(w => WEAKNESS_MOVES[w].action).join(' + ')}</p>
      <p><strong>线路长度：</strong>约 ${totalDistance}m · 支点数量：${d.points.length} 个</p>
      <p><strong>结构：</strong>三段式（起步段 / 核心难点段 / 顶点崩溃段）</p>
    </div>

    <div class="bg-slate-800 p-5 rounded-lg">
      <h3 class="text-lg font-bold text-white mb-3">难点拆解</h3>
      ${cruxPoints.map((p) => `
        <div class="mb-3 pb-3 border-b border-slate-700 last:border-0">
          <span class="tag tag-${p.segment.type}">${p.segment.name}</span>
          <span class="font-semibold">P${p.idx + 1}</span> · 高度 ${p.y.toFixed(2)}m
          <p class="mt-1 text-slate-300">动作：${p.action} · 岩点：${HOLD_TYPES[p.holdType].name} · 标签：${p.tags.join('/')}</p>
        </div>
      `).join('')}
    </div>
  `;
}

function renderReport() {
  const routes = routeSet || [routeData];
  const inp = routeData.inputs;

  let html = '';
  if (routeSet) {
    html += `
      <div class="bg-slate-800 p-5 rounded-lg mb-4">
        <h3 class="text-lg font-bold text-white mb-3">3 条梯度套餐安排</h3>
        <p>本套餐按「入门 → 进阶 → 竞技」难度递进，覆盖同一短板的不同表达形式，适合青少年周期化训练。</p>
        <div class="mt-3 grid grid-cols-3 gap-3">
          ${routeSet.map((d, i) => `
            <div class="p-3 rounded" style="background:${ROUTE_COLORS[i].stroke}22; border:1px solid ${ROUTE_COLORS[i].stroke}55">
              <div class="font-bold text-white">${ROUTE_COLORS[i].name}</div>
              <div class="text-sm text-slate-300">${d.inputs.difficulty}</div>
              <div class="text-sm text-slate-300">${d.styleName}</div>
              <div class="text-sm text-slate-300">${d.patternName}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  routes.forEach(d => {
    html += renderRouteReport(d);
  });

  html += `
    <div class="bg-slate-800 p-5 rounded-lg">
      <h3 class="text-lg font-bold text-white mb-3">课后辅助训练建议</h3>
      <ul class="list-disc list-inside space-y-1 text-slate-300">
        ${inp.weaknesses.map(w => `<li>${WEAKNESS_MOVES[w].action}：每组 8–12 次，3–4 组，组间休息 2–3 分钟</li>`).join('')}
        <li>核心稳定训练：死虫式、平板支撑，每周 2–3 次</li>
        <li>攀爬后手指/肩袖拉伸，每次 10 分钟</li>
      </ul>
    </div>

    <div class="bg-slate-800 p-5 rounded-lg">
      <h3 class="text-lg font-bold text-white mb-3">训练计划</h3>
      <p><strong>单次攀爬：</strong>完成线路 3–5 次，每次尝试专注 1 个短板动作</p>
      <p><strong>组次安排：</strong>3 组，每组间休息 5–8 分钟</p>
      <p><strong>强度控制：</strong>心率达到最大心率 70%–85%，避免连续力竭</p>
    </div>

    <div class="bg-slate-800 p-5 rounded-lg">
      <h3 class="text-lg font-bold text-white mb-3">赛事对标</h3>
      <p>本线路难度定位于 <strong>${inp.difficulty}</strong>，对应全国青少年攀岩锦标赛 / U 系列赛事 ${inp.ageGroup} 组别主流难度区间。</p>
      <p>线路结构符合青少年赛事定线规范：三段式梯度、横向位移占比 ≥ 60%、核心难点与顶点崩溃段分离。</p>
    </div>
  `;

  document.getElementById('reportContent').innerHTML = html;
}

function downloadReport() {
  if (!routeData) { alert('请先生成线路'); return; }
  const content = document.getElementById('reportContent').innerText;
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '青少年攀岩训练报告.txt';
  a.click();
  URL.revokeObjectURL(url);
}

/* ============ Tab 切换 ============ */
function updateRouteSelector() {
  const container = document.getElementById('routeSelector');
  if (!routeSet) {
    container.classList.add('hidden');
    container.innerHTML = '';
    return;
  }
  container.classList.remove('hidden');
  container.innerHTML = '<span class="text-sm text-slate-400 self-center mr-2">高亮线路：</span>' +
    routeSet.map((d, i) => {
      const active = i === activeRouteIndex;
      const c = ROUTE_COLORS[i].stroke;
      return `<button class="px-3 py-1 rounded text-sm text-white transition" style="background:${active ? c : c + '55'}; border:2px solid ${c}" onclick="setActiveRoute(${i})">${ROUTE_COLORS[i].name} · ${d.inputs.difficulty}</button>`;
    }).join('');
}

function setActiveRoute(idx) {
  if (!routeSet || idx < 0 || idx >= routeSet.length) return;
  activeRouteIndex = idx;
  routeData = routeSet[idx];
  render2D();
  render3D();
  updateRouteSelector();
}

function switchTab(id, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  const activeTab = el || document.querySelector(`.tab[data-tab="${id}"]`);
  if (activeTab) activeTab.classList.add('active');
  document.getElementById(id).classList.add('active');
  if (id === 'model' && renderer3d) {
    const container = document.getElementById('wall3d');
    renderer3d.setSize(container.clientWidth, container.clientHeight);
    camera3d.aspect = container.clientWidth / container.clientHeight;
    camera3d.updateProjectionMatrix();
  }
}

// 页面加载后自动生成一次示例
window.addEventListener('load', () => {
  generateRoute();
});
</script>
