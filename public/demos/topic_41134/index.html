// ═══════════ 持久化：摊位信息 ═══════════
// 数据格式: { stallName: { dist, status:'active'|'paused', lastReport:timestamp, pausedSince:timestamp } }
const STALLS_KEY = 'cn_market_stalls';
function loadStalls() { try { return JSON.parse(localStorage.getItem(STALLS_KEY)) || {}; } catch(e) { return {}; } }
function saveStalls(d) { localStorage.setItem(STALLS_KEY, JSON.stringify(d)); }

// 初始化演示摊位（只在新用户第一次打开时写入）
function seedStalls() {
  const existing = loadStalls();
  if (Object.keys(existing).length === 0) {
    const now = Date.now();
    const seed = {
      '李阿姨蔬菜摊': { dist:50, status:'active', lastReport:now },
      '老张生鲜': { dist:120, status:'active', lastReport:now },
      '便民菜站': { dist:80, status:'active', lastReport:now },
      '王记蔬果': { dist:30, status:'active', lastReport:now },
      '社区菜篮子': { dist:200, status:'active', lastReport:now },
      '小刘平价菜': { dist:150, status:'active', lastReport:now },
    };
    saveStalls(seed);
    return seed;
  }
  // 迁移旧数据：给没有 status 字段的摊位补上
  let changed = false;
  Object.keys(existing).forEach(k => {
    if (!existing[k].status) { existing[k].status = 'active'; changed = true; }
    if (!existing[k].lastReport) { existing[k].lastReport = Date.now(); changed = true; }
  });
  if (changed) saveStalls(existing);
  return existing;
}

// 自动暂停：连续3天未报价的摊位
const AUTO_PAUSE_DAYS = 3;
function autoPauseCheck() {
  const stalls = loadStalls();
  let changed = false;
  const cutoff = Date.now() - AUTO_PAUSE_DAYS * 24 * 60 * 60 * 1000;
  Object.keys(stalls).forEach(k => {
    if (stalls[k].status === 'active' && stalls[k].lastReport < cutoff) {
      stalls[k].status = 'paused';
      stalls[k].pausedSince = Date.now();
      changed = true;
    }
  });
  if (changed) saveStalls(stalls);
  return stalls;
}

// 获取所有摊位（排除已删除的）
function getAllStalls() {
  const stalls = seedStalls();
  // 自动暂停检查
  autoPauseCheck();
  const result = {};
  Object.keys(stalls).forEach(k => {
    if (stalls[k].status !== 'deleted') {
      result[k] = stalls[k];
    }
  });
  return result;
}

// 注册新摊位
function registerStall(name, dist) {
  const stalls = loadStalls();
  if (!stalls[name]) {
    stalls[name] = { dist: dist || 50, status: 'active', lastReport: Date.now() };
  } else {
    if (stalls[name].status === 'paused') {
      stalls[name].status = 'active';
      stalls[name].lastReport = Date.now();
      delete stalls[name].pausedSince;
    }
    if (dist && dist !== 50) stalls[name].dist = dist;
  }
  saveStalls(stalls);
  return stalls;
}

// 暂停摊位
function togglePauseStall(name) {
  if (!isStallUnlocked(name)) { showToast('⚠️ 请先输入摊位密码解锁'); return; }
  const stalls = loadStalls();
  if (!stalls[name]) return;
  if (stalls[name].status === 'paused') {
    stalls[name].status = 'active';
    delete stalls[name].pausedSince;
  } else {
    stalls[name].status = 'paused';
    stalls[name].pausedSince = Date.now();
  }
  saveStalls(stalls);
  renderMgmtList();
}

// 软删除摊位
function deleteStall(name) {
  if (confirm('确定要删除「' + name + '」吗？删除后消费者端将不再显示。')) {
    doDeleteStall(name);
  }
}
function doDeleteStall(name) {
  if (!isStallUnlocked(name)) { showToast('⚠️ 请先输入摊位密码解锁'); return; }
  const stalls = loadStalls();
  if (stalls[name]) {
    stalls[name].status = 'deleted';
    saveStalls(stalls);
    // 删除后从解锁列表移除
    const unlocked = getUnlockedStalls();
    const idx = unlocked.indexOf(name);
    if (idx >= 0) { unlocked.splice(idx, 1); saveUnlockedStalls(unlocked); }
  }
  renderMgmtList();
  renderRecentStalls();
  showToast('已删除「' + name + '」');
}

// ═══════════ PIN 安全机制 ═══════════
const UNLOCKED_KEY = 'cn_market_unlocked';

function getUnlockedStalls() {
  try { return JSON.parse(sessionStorage.getItem(UNLOCKED_KEY)) || []; } catch(e) { return []; }
}

function saveUnlockedStalls(arr) {
  sessionStorage.setItem(UNLOCKED_KEY, JSON.stringify(arr));
}

function isStallUnlocked(name) {
  const stalls = loadStalls();
  // 种子摊位（无 PIN 哈希）始终视为已解锁
  if (stalls[name] && !stalls[name].pinHash) return true;
  return getUnlockedStalls().includes(name);
}

function unlockStall(name) {
  const unlocked = getUnlockedStalls();
  if (!unlocked.includes(name)) {
    unlocked.push(name);
    saveUnlockedStalls(unlocked);
  }
}

async function hashPIN(pin) {
  const encoder = new TextEncoder();
  const data = encoder.encode('cn_market_' + pin);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

async function setPIN(stallName, pin) {
  const stalls = loadStalls();
  if (!stalls[stallName]) return false;
  stalls[stallName].pinHash = await hashPIN(pin);
  saveStalls(stalls);
  return true;
}

async function verifyPIN(stallName, pin) {
  const stalls = loadStalls();
  if (!stalls[stallName] || !stalls[stallName].pinHash) return false;
  const hash = await hashPIN(pin);
  return hash === stalls[stallName].pinHash;
}

// ═══════════ 持久化：价格数据 ═══════════
const PRICES_KEY = 'cn_market_prices';
function loadPrices() { try { return JSON.parse(localStorage.getItem(PRICES_KEY)) || {}; } catch(e) { return {}; } }
function savePrices(d) { localStorage.setItem(PRICES_KEY, JSON.stringify(d)); }

// ═══════════ 今日摊位报价（活跃排前，暂停排后） ═══════════
function todayPrices(veg) {
  const stored = loadPrices();
  const today = new Date().toISOString().slice(0,10);
  const key = veg.id + '_' + today;
  const existing = stored[key] || {};
  const allStalls = getAllStalls();

  const active = [];
  const paused = [];
  const seen = {};

  // 已有报价的摊位
  Object.keys(existing).forEach(sname => {
    seen[sname] = true;
    const d = allStalls[sname];
    if (!d) return; // 已删除跳过
    const entry = { name: sname, dist: d.dist, price: existing[sname].price, fresh: existing[sname].freshness||5, status: d.status };
    if (d.status === 'paused') paused.push(entry); else active.push(entry);
  });

  // 只展示真实数据，不生成模拟价格

  // 按当前排序模式排序
  const mode = sortMode === 'carousel' ? carouselPhase : sortMode;
  sortEntries(active, mode);
  sortEntries(paused, mode);
  return active.concat(paused);
}

function sortEntries(arr, mode) {
  if (mode === 'fresh') {
    // 最新鲜：新鲜度降序，同分则价格升序
    arr.sort((a, b) => b.fresh - a.fresh || a.price - b.price);
  } else if (mode === 'balance') {
    // 兼顾性价比：新鲜度/价格 比值降序
    arr.sort((a, b) => (b.fresh / b.price) - (a.fresh / a.price));
  } else {
    // 最便宜（默认）：价格升序
    arr.sort((a, b) => a.price - b.price);
  }
}

// ═══════════ 排序模式管理 ═══════════
let sortMode = 'cheap'; // 'cheap' | 'fresh' | 'balance' | 'carousel'
let carouselPhase = 'cheap'; // 轮播当前阶段
let carouselTimer = null;

function switchSortMode(mode) {
  sortMode = mode;
  // 更新按钮状态
  document.querySelectorAll('.sort-btn').forEach(b => {
    b.classList.remove('active', 'carousel-active');
  });
  const btn = document.getElementById('sort-' + mode);
  if (btn) btn.classList.add('active');

  // 管理轮播定时器
  clearInterval(carouselTimer);
  if (mode === 'carousel') {
    carouselPhase = 'cheap';
    carouselTimer = setInterval(function() {
      carouselPhase = carouselPhase === 'cheap' ? 'fresh' : 'cheap';
      // 更新轮播按钮状态
      const cBtn = document.getElementById('sort-carousel');
      if (cBtn) {
        cBtn.classList.remove('active');
        cBtn.classList.add('carousel-active');
        cBtn.innerHTML = carouselPhase === 'cheap' ? '🔄 轮播<span class="sub">💰比价格</span>' : '🔄 轮播<span class="sub">⭐比品质</span>';
      }
      renderAllVegs(input.value.trim());
    }, 3000);
  }
  renderAllVegs(input.value.trim());
}

// ═══════════ 浏览模式：渲染所有菜品 ═══════════
const input = document.getElementById('search-input');
let expandedVeg = null; // 当前展开的菜品 ID

function renderAllVegs(filter) {
  const container = document.getElementById('veg-list');
  const q = (filter || '').trim().toLowerCase();
  const filtered = q ? VEGS.filter(v => v.name.includes(q) || v.cat.includes(q)) : VEGS;
  
  if (filtered.length === 0) {
    container.innerHTML = '<div class="no-result"><span class="big">🔍</span><p>没找到"' + q + '"相关菜品</p></div>';
    return;
  }

  // 按分类分组
  const cats = [];
  const seen = {};
  filtered.forEach(v => {
    if (!seen[v.cat]) { seen[v.cat] = []; cats.push({ name: v.cat, vegs: seen[v.cat] }); }
    seen[v.cat].push(v);
  });

  let html = '';
  const effMode = sortMode === 'carousel' ? carouselPhase : sortMode;
  const badgeText = { cheap: '最便宜', fresh: '最新鲜', balance: '性价比' };
  const badgeKey = effMode;
  cats.forEach(cat => {
    html += '<div class="cat-header">' + (cat.vegs[0]?.emoji || '') + ' ' + cat.name + '</div>';
    html += '<div class="veg-grid">';
    cat.vegs.forEach(v => {
      const tp = todayPrices(v);
      const active = tp.filter(p => p.status !== 'paused');
      const best = active[0] || tp[0];
      const isExpanded = expandedVeg === v.id;
      html += '<div class="veg-card' + (isExpanded ? ' expanded' : '') + '" onclick="toggleVegDetail(\'' + v.id + '\')" id="card-' + v.id + '">';
      html += '<div class="vname">' + v.emoji + ' ' + v.name + '</div>';
      html += '<div class="vprice">¥' + (best ? best.price.toFixed(2) : '--') + '</div>';
      const label = best
        ? (badgeKey === 'fresh' ? '⭐' + best.fresh + ' @ ' + best.name : '¥' + best.price.toFixed(2) + ' @ ' + best.name)
        : '暂无报价';
      html += '<div class="vstall">' + label + '</div>';
      if (best && active.length > 0 && active[0] === best) {
        html += '<div class="vcheap">' + (badgeText[badgeKey] || '最佳') + '</div>';
      }
      html += '</div>';
      html += '<div class="veg-detail' + (isExpanded ? ' show' : '') + '" id="detail-' + v.id + '"></div>';
    });
    html += '</div>';
  });
  container.innerHTML = html;

  // 如果当前有展开的，重新渲染详情
  if (expandedVeg && filtered.some(v => v.id === expandedVeg)) {
    renderVegDetail(expandedVeg);
  }
}

function toggleVegDetail(id) {
  if (expandedVeg === id) {
    // 收起
    expandedVeg = null;
  } else {
    expandedVeg = id;
  }
  renderAllVegs(input.value.trim());
}

function renderVegDetail(id) {
  const veg = VEGS.find(v => v.id === id);
  if (!veg) return;
  const detail = document.getElementById('detail-' + id);
  if (!detail) return;
  
  const tp = todayPrices(veg);
  const activeList = tp.filter(p => p.status !== 'paused');
  const pausedList = tp.filter(p => p.status === 'paused');

  if (activeList.length === 0 && pausedList.length > 0) {
    const best = pausedList[0];
    detail.innerHTML = `
      <div class="best-card" style="background:#999590">
        <div class="label">⚠️ 今天所有摊位都暂停营业</div>
        <div class="stall">${best.name}</div>
        <div class="price">¥${best.price.toFixed(2)}</div>
        <div class="meta">距入口 ${best.dist}m · 新鲜度 ${'⭐'.repeat(best.fresh)}</div>
      </div>
      ${pausedList.slice(1).map(p => `
        <div class="stall-row paused">
          <div class="rank rx">—</div>
          <div class="info"><div class="sn">${p.name}<span class="paused-badge">暂停</span></div><div class="sm">${p.dist}m</div></div>
          <div class="p">¥${p.price.toFixed(2)}</div>
          <div class="diff">—</div>
        </div>
      `).join('')}
    `;
    return;
  }

  if (activeList.length === 0) {
    detail.innerHTML = '<div class="no-result" style="padding:1rem"><span class="big">🚫</span><p>暂无摊位报价</p></div>';
    return;
  }

  const best = activeList[0];
  const modeLabel = { cheap: '最便宜', fresh: '最新鲜', balance: '性价比最高' };
  const effMode = sortMode === 'carousel' ? carouselPhase : sortMode;
  let html = `
    <div class="best-card">
      <div class="label">🏆 今天买「${veg.name}」${modeLabel[effMode] || '最佳'}的是</div>
      <div class="stall">${best.name}</div>
      <div class="price">¥${best.price.toFixed(2)}</div>
      <div class="meta">距入口 ${best.dist}m · 新鲜度 ${'⭐'.repeat(best.fresh)}</div>
    </div>
    <div class="other-title">其他摊位比价</div>
    ${activeList.slice(1).map((p, idx) => {
      const priceDiff = p.price - best.price;
      const freshDiff = best.fresh - p.fresh;
      let diffStr, diffClass;
      if (effMode === 'fresh') {
        diffStr = freshDiff > 0 ? '少 ' + freshDiff + '⭐' : '—';
        diffClass = freshDiff > 0 ? 'up' : 'down';
      } else {
        diffStr = priceDiff > 0.01 ? '贵 ¥' + priceDiff.toFixed(2) : '—';
        diffClass = priceDiff > 0.01 ? 'up' : 'down';
      }
      return `
        <div class="stall-row">
          <div class="rank r${idx+2 > 3 ? 'x' : idx+2}">${idx+2}</div>
          <div class="info">
            <div class="sn">${p.name}</div>
            <div class="sm">${p.dist}m · ${'⭐'.repeat(p.fresh)}</div>
          </div>
          <div class="p ${priceDiff > 0.1 ? 'hi' : 'lo'}">¥${p.price.toFixed(2)}</div>
          <div class="diff ${diffClass}">${diffStr}</div>
        </div>
      `;
    }).join('')}`;

  if (pausedList.length > 0) {
    html += `
    <div class="paused-divider">── 以下摊位今日暂停营业 ──</div>
    ${pausedList.map(p => `
      <div class="stall-row paused">
        <div class="rank rx">—</div>
        <div class="info"><div class="sn">${p.name}<span class="paused-badge">暂停</span></div><div class="sm">${p.dist}m</div></div>
        <div class="p">¥${p.price.toFixed(2)}</div>
        <div class="diff">—</div>
      </div>
    `).join('')}`;
  }

  detail.innerHTML = html;
}

// 语音输入：填入搜索框并过滤
let listening = false;
let recognition = null;

function toggleVoice() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    showToast('你的浏览器不支持语音输入，请手动输入菜名');
    return;
  }
  if (listening) { recognition && recognition.stop(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'zh-CN';
  recognition.interimResults = false;
  recognition.continuous = false;

  const btn = document.getElementById('btn-voice');
  btn.classList.add('listening');
  listening = true;

  recognition.onresult = function(e) {
    const text = e.results[0][0].transcript;
    input.value = text;
    expandedVeg = null;
    renderAllVegs(text);
    // 如果只有一个匹配，自动展开
    const matches = VEGS.filter(v => v.name.includes(text) || v.cat.includes(text));
    if (matches.length === 1) {
      expandedVeg = matches[0].id;
      renderAllVegs(text);
    }
  };

  recognition.onerror = function() { showToast('没听清，请再试一次或手动输入'); };
  recognition.onend = function() { btn.classList.remove('listening'); listening = false; };
  recognition.start();
}

function updatePinHint() {
  const sname = document.getElementById('owner-stall').value.trim();
  const hint = document.getElementById('pin-hint');
  const pinInput = document.getElementById('owner-pin');
  if (!sname) {
    hint.style.display = 'none';
    pinInput.placeholder = '摊位密码（4-6位数字）';
    return;
  }
  const stalls = loadStalls();
  const stallExists = !!stalls[sname] && stalls[sname].status !== 'deleted';
  const hasPin = stallExists && !!stalls[sname].pinHash;
  const unlocked = isStallUnlocked(sname);
  if (!stallExists) {
    hint.style.display = 'block';
    hint.textContent = '首次使用该摊位，请设置一个密码（4-6位数字），以后管理摊位时使用';
    pinInput.placeholder = '设置密码';
  } else if (hasPin && !unlocked) {
    hint.style.display = 'block';
    hint.textContent = '该摊位已设密码，请输入密码验证身份';
    pinInput.placeholder = '输入密码';
  } else {
    hint.style.display = 'none';
    pinInput.placeholder = '摊位密码（4-6位数字）';
  }
}

function renderRecentStalls() {
  const container = document.getElementById('recent-stalls');
  const stalls = getAllStalls();
  const allNames = Object.keys(stalls);
  // 仅显示已解锁的摊位
  const names = allNames.filter(n => isStallUnlocked(n));
  if (names.length === 0) { container.innerHTML = ''; return; }
  container.innerHTML = '<span style="font-size:0.75rem;color:var(--muted);line-height:2">我的摊位：</span>' +
    names.map(n => {
      const isPaused = stalls[n].status === 'paused';
      return `<span class="qr-chip${isPaused ? ' paused' : ''}" onclick="quickStall('${n.replace(/'/g, "\\'")}')">${n}${isPaused ? ' (暂停)' : ''}</span>`;
    }).join('');
}

function quickStall(name) {
  document.getElementById('owner-stall').value = name;
  updatePinHint();
}

function renderMgmtList() {
  autoPauseCheck(); // 打开管理面板时也检查一次
  const container = document.getElementById('mgmt-list');
  const stalls = loadStalls();
  const allNames = Object.keys(stalls).filter(k => stalls[k].status !== 'deleted');
  // 仅显示已解锁的摊位
  const names = allNames.filter(n => isStallUnlocked(n));
  if (names.length === 0) {
    container.innerHTML = '<div style="text-align:center;color:var(--muted);font-size:0.85rem;padding:0.5rem">请先在上方输入摊位名称和密码解锁</div>';
    return;
  }
  const now = Date.now();
  container.innerHTML = names.map(n => {
    const s = stalls[n];
    const isPaused = s.status === 'paused';
    const daysSinceReport = Math.floor((now - (s.lastReport || 0)) / (24*60*60*1000));
    let statHtml = '';
    if (isPaused) {
      statHtml = '<span class="mstat" style="color:#856404">暂停中</span>';
    } else if (daysSinceReport >= 2) {
      statHtml = '<span class="mstat" style="color:#C45C3E">' + daysSinceReport + '天未报</span>';
    }
    const pauseBtn = isPaused
      ? '<button class="btn-sm btn-sm-resume" onclick="togglePauseStall(\'' + n.replace(/'/g, "\\'") + '\')">恢复</button>'
      : '<button class="btn-sm btn-sm-pause" onclick="togglePauseStall(\'' + n.replace(/'/g, "\\'") + '\')">暂停</button>';
    const hasPin = !!s.pinHash;
    return `
      <div class="mgmt-row">
        <div class="mn">${n}${hasPin ? ' <span style="color:var(--green);font-size:0.75rem">🔒</span>' : ''}</div>
        ${statHtml}
        ${pauseBtn}
        <button class="btn-sm btn-sm-del" onclick="deleteStall('${n.replace(/'/g, "\\'")}')">删除</button>
      </div>
    `;
  }).join('');
}

async function submitOwnerPrice() {
  const sname = document.getElementById('owner-stall').value.trim();
  const vid = document.getElementById('owner-veg').value;
  const price = parseFloat(document.getElementById('owner-price').value);
  const dist = parseInt(document.getElementById('owner-dist').value) || 50;
  const pinInput = document.getElementById('owner-pin').value.trim();

  if (!sname) { showToast('请输入你的摊位名称'); return; }
  if (!price || price <= 0) { showToast('请输入有效的价格'); return; }

  const stalls = loadStalls();
  const stallExists = !!stalls[sname] && stalls[sname].status !== 'deleted';
  const hasPin = stallExists && !!stalls[sname].pinHash;

  // 情况1：新摊位 → 必须设置 PIN
  if (!stallExists) {
    if (!pinInput || pinInput.length < 4 || pinInput.length > 6 || !/^\d+$/.test(pinInput)) {
      showToast('⚠️ 首次使用，请设置一个4-6位数字密码');
      document.getElementById('owner-pin').focus();
      return;
    }
    // 注册摊位 + 设置 PIN
    registerStall(sname, dist);
    await setPIN(sname, pinInput);
    unlockStall(sname);
    document.getElementById('owner-pin').value = '';
    updatePinHint();
  }
  // 情况2：已存在且有 PIN 且未解锁 → 验证 PIN
  else if (hasPin && !isStallUnlocked(sname)) {
    if (!pinInput) {
      showToast('⚠️ 请输入摊位密码验证身份');
      document.getElementById('owner-pin').focus();
      return;
    }
    const verified = await verifyPIN(sname, pinInput);
    if (!verified) {
      showToast('❌ 密码错误，请重试');
      document.getElementById('owner-pin').value = '';
      document.getElementById('owner-pin').focus();
      return;
    }
    unlockStall(sname);
    document.getElementById('owner-pin').value = '';
    updatePinHint();
  }
  // 情况3：已存在但无 PIN（种子摊位）→ 直接通过
  // 情况4：已存在且已解锁 → 直接通过

  // 更新摊位信息
  registerStall(sname, dist);
  const updatedStalls = loadStalls();
  if (updatedStalls[sname]) {
    updatedStalls[sname].lastReport = Date.now();
    saveStalls(updatedStalls);
  }
  // 记住上次使用的摊位名
  localStorage.setItem('cn_last_stall', sname);

  // 保存价格
  const stored = loadPrices();
  const today = new Date().toISOString().slice(0,10);
  const key = vid + '_' + today;
  if (!stored[key]) stored[key] = {};
  stored[key][sname] = { price: price, freshness: 5, ts: Date.now() };
  savePrices(stored);

  document.getElementById('owner-price').value = '';
  document.getElementById('owner-dist').value = '';
  const veg = VEGS.find(v => v.id === vid);
  showToast('✅ ' + sname + ' · ' + veg.name + ' ¥' + price.toFixed(2) + ' 已上报！');
  renderRecentStalls();
  renderMgmtList();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), 2000);
}

// ═══════════ 摊位名称输入监听：动态 PIN 提示 ═══════════
document.getElementById('owner-stall').addEventListener('input', updatePinHint);

// 初始化种子数据，并执行自动暂停检查
seedStalls();
autoPauseCheck();

// 初始渲染所有菜品
renderAllVegs();
</script>
