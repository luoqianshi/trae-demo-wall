<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI碎片信息整理助手</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>AI碎片信息整理助手</h1>
            <p>将聊天记录、会议速记和临时事项整理为结构化信息</p>
            <div class="header-right">
                <span id="currentDate"></span>
                <button id="loadExampleTopBtn">载入示例</button>
            </div>
        </header>

        <main>
            <div class="input-panel">
                <h2>原始信息</h2>
                <textarea id="sourceText" placeholder="请粘贴聊天记录、会议速记、课堂笔记或临时待办……"></textarea>
                <div class="input-footer">
                    <span id="charCount">0 字</span>
                    <div class="input-buttons">
                        <button id="loadExampleBtn">载入示例</button>
                        <button id="clearInputBtn">清空</button>
                    </div>
                </div>
                <button id="analyzeBtn" class="main-btn">开始整理</button>
                <div id="inputMessage"></div>
            </div>

            <div class="result-panel">
                <h2>整理结果</h2>
                <div id="resultEmpty">输入内容并点击开始整理</div>
                <div id="resultContent" class="hidden">
                    <div class="result-card">
                        <h3>内容摘要</h3>
                        <p id="summaryText"></p>
                    </div>

                    <div class="result-card">
                        <h3>待办事项</h3>
                        <table id="taskTable">
                            <thead>
                                <tr>
                                    <th>序号</th>
                                    <th>待办事项</th>
                                    <th>时间</th>
                                    <th>相关人员</th>
                                    <th>优先级</th>
                                    <th>完成状态</th>
                                </tr>
                            </thead>
                            <tbody id="taskTableBody"></tbody>
                        </table>
                    </div>

                    <div class="result-card">
                        <h3>时间节点</h3>
                        <ul id="timeList"></ul>
                    </div>

                    <div class="result-card">
                        <h3>涉及人员</h3>
                        <div id="peopleList"></div>
                    </div>

                    <div class="result-card">
                        <h3>重要提醒</h3>
                        <ul id="reminderList"></ul>
                    </div>

                    <div class="result-actions">
                        <button id="copyResultBtn">复制结果</button>
                        <button id="exportMarkdownBtn">导出Markdown</button>
                        <button id="saveRecordBtn">保存记录</button>
                        <button id="clearResultBtn">清空结果</button>
                    </div>
                </div>
            </div>
        </main>

        <section class="history-section">
            <div class="history-header">
                <h2>历史整理记录</h2>
                <button id="clearHistoryBtn">清空全部历史</button>
            </div>
            <div id="historyEmpty">暂无历史记录</div>
            <div id="historyList"></div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
