<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 编辑器 - Coding Land</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="../common.js"></script>
    <script src="code-editor.js"></script>
    <script src="ai.js?v=2"></script>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a2e;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #606070;
            --color-web-1: #ff00ff;
            --color-web-2: #00ffff;
            --border-color: rgba(255, 255, 255, 0.1);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --font-display: 'Space Grotesk', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --gradient-web: linear-gradient(135deg, #ff00ff, #00ffff);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font-display);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                linear-gradient(rgba(255, 0, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 14px 0;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-back {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-back:hover { color: var(--color-web-2); }

        .nav-logo {
            font-family: var(--font-mono);
            font-size: 1.2rem;
            font-weight: 700;
        }

        .logo-text {
            background: var(--gradient-web);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-bracket { color: var(--color-web-2); font-weight: 300; }

        .editor-container {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 32px;
        }

        .editor-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .editor-tag {
            display: inline-block;
            padding: 5px 14px;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 100px;
            font-size: 0.75rem;
            color: var(--color-web-2);
            margin-bottom: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .editor-title {
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .gradient-text {
            background: var(--gradient-web);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .editor-desc {
            color: var(--text-secondary);
            font-size: 1rem;
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.7;
        }

        .editor-section {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--color-web-2);
            margin-bottom: 20px;
        }

        /* ===== AI 代码审查面板 ===== */
        .ai-review-panel {
            background: var(--glass-bg);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 24px;
        }
        .ai-review-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .ai-review-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--color-web-2);
        }
        .ai-badge {
            display: inline-block;
            padding: 2px 8px;
            background: var(--gradient-web);
            color: var(--bg-primary);
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .ai-review-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            background: var(--gradient-web);
            border: none;
            border-radius: 8px;
            color: var(--bg-primary);
            font-family: var(--font-display);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .ai-review-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(255, 0, 255, 0.4);
        }
        .ai-status {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-family: var(--font-mono);
        }
        .ai-output {
            background: var(--bg-primary);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 16px 20px;
            font-size: 0.88rem;
            line-height: 1.7;
            color: var(--text-secondary);
            max-height: 500px;
            overflow-y: auto;
            white-space: pre-wrap;
            display: none;
        }
        .ai-output.show { display: block; }
        .ai-output code {
            font-family: var(--font-mono);
            background: var(--bg-tertiary);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--color-web-1);
        }

        /* ===== AI 问答区 ===== */
        .ai-chat-panel {
            background: var(--glass-bg);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 24px;
        }
        .ai-chat-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
        }
        .chat-header {
            font-size: 1rem;
            font-weight: 600;
            color: var(--color-web-2);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-messages {
            background: var(--bg-primary);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
            min-height: 100px;
            max-height: 300px;
            overflow-y: auto;
        }

        .chat-message {
            margin-bottom: 12px;
            padding: 10px 14px;
            border-radius: 8px;
        }

        .chat-message.user {
            background: rgba(0, 255, 255, 0.1);
            color: var(--text-primary);
            text-align: right;
        }

        .chat-message.ai {
            background: rgba(255, 0, 255, 0.1);
            color: var(--text-secondary);
        }

        .chat-message:last-child { margin-bottom: 0; }

        .chat-input {
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 10px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: var(--font-display);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input input:focus {
            border-color: var(--color-web-2);
        }

        .chat-input input::placeholder {
            color: var(--text-muted);
        }

        .chat-input button {
            padding: 10px 20px;
            background: var(--gradient-web);
            border: none;
            border-radius: 8px;
            color: var(--bg-primary);
            font-family: var(--font-display);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chat-input button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(255, 0, 255, 0.4);
        }

        @media (max-width: 600px) {
            .nav-container { padding: 0 16px; }
            .editor-container { padding: 28px 16px; }
            .editor-section { padding: 20px; }
            .chat-input {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="../../index.html" class="nav-back">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                <span>返回首页</span>
            </a>
            <div class="nav-logo">
                <span class="logo-bracket">&lt;</span>
                <span class="logo-text">Coding Land</span>
                <span class="logo-bracket">/&gt;</span>
            </div>
            <div></div>
        </div>
    </nav>

    <div class="editor-container">
        <div class="editor-header">
            <span class="editor-tag">Web 前端 · HTML</span>
            <h1 class="editor-title"><span class="gradient-text">HTML 编辑器</span></h1>
            <p class="editor-desc">
                自由编写 HTML 代码，实时预览效果，AI 帮你审查代码、解答问题。
            </p>
        </div>

        <div class="editor-section">
            <h3 class="section-title">代码编辑器</h3>
            <code-editor default='<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的网页</title>
</head>
<body>
    
</body>
</html>'></code-editor>
        </div>

        <div class="ai-review-panel">
            <div class="ai-review-header">
                <div class="ai-review-title">AI 代码审查</div>
                <button class="ai-review-btn" id="aiReviewBtn">检查代码</button>
            </div>
            <div class="ai-output" id="aiOutput"></div>
        </div>

        <div class="ai-chat-panel">
            <div class="chat-header">AI 问答</div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="输入你的问题...">
                <button id="chatSendBtn">发送</button>
            </div>
        </div>
    </div>

    <script>
        const aiReviewBtn = document.getElementById('aiReviewBtn');
        const aiOutput = document.getElementById('aiOutput');

        aiReviewBtn.addEventListener('click', async () => {
            const editor = document.querySelector('code-editor');
            const code = editor.getValue();
            if (!code.trim()) {
                aiOutput.textContent = '请先在编辑器中写一些代码！';
                aiOutput.classList.add('show');
                return;
            }
            aiOutput.textContent = 'AI 正在审查代码，请稍候...';
            aiOutput.classList.add('show');
            aiReviewBtn.disabled = true;
            aiReviewBtn.style.opacity = '0.6';
            
            const result = await AICodeCheck(code);
            aiOutput.textContent = result;
            aiReviewBtn.disabled = false;
            aiReviewBtn.style.opacity = '1';
        });

        const chatInput = document.getElementById('chatInput');
        const chatSendBtn = document.getElementById('chatSendBtn');
        const chatMessages = document.getElementById('chatMessages');

        chatSendBtn.addEventListener('click', async () => {
            const message = chatInput.value.trim();
            if (!message) return;

            const userMsg = document.createElement('div');
            userMsg.className = 'chat-message user';
            userMsg.textContent = message;
            chatMessages.appendChild(userMsg);

            chatInput.value = '';

            const aiMsg = document.createElement('div');
            aiMsg.className = 'chat-message ai';
            aiMsg.textContent = 'AI 正在思考...';
            chatMessages.appendChild(aiMsg);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            
            const answer = await AIChat(message);
            aiMsg.textContent = answer;
            chatMessages.scrollTop = chatMessages.scrollHeight;
        });

        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                chatSendBtn.click();
            }
        });

        window.addEventListener('beforeunload', function(e) {
            e.preventDefault();
            e.returnValue = '是否离开？你所做的更改可能未保存。';
            return e.returnValue;
        });
    </script>
</body>
</html>
