<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web 前端课程 - Coding Land</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="lessons.js"></script>
    <script src="../common.js"></script>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a2e;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #606070;
            --color-web-1: #ff00ff;
            --color-web-2: #00ffff;
            --color-practice: #ff00ff;
            --color-total: #ffaa00;
            --border-color: rgba(255, 255, 255, 0.1);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --font-display: 'Space Grotesk', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --gradient-web: linear-gradient(135deg, #ff00ff, #00ffff);
            --gradient-practice: linear-gradient(135deg, #ff00ff, #aa00ff);
            --gradient-total: linear-gradient(135deg, #ffaa00, #ff5500);
            --success-color: #39ff14;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font-display);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                linear-gradient(rgba(255, 0, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
        }

        body::after {
            content: '';
            position: fixed;
            top: 10%; right: -100px;
            width: 400px; height: 400px;
            background: var(--color-web-1);
            filter: blur(120px);
            opacity: 0.12;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        /* ===== 导航栏 ===== */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 16px 0;
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-back {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-back:hover { color: var(--color-web-2); }

        .nav-logo {
            font-family: var(--font-mono);
            font-size: 1.3rem;
            font-weight: 700;
        }

        .logo-text {
            background: var(--gradient-web);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-bracket { color: var(--color-web-2); font-weight: 300; }

        /* ===== 主体 ===== */
        .course-container {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            margin: 0 auto;
            padding: 48px 32px 80px;
        }

        .course-header {
            text-align: center;
            margin-bottom: 48px;
        }

        .course-tag {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(255, 0, 255, 0.1);
            border: 1px solid rgba(255, 0, 255, 0.3);
            border-radius: 100px;
            font-size: 0.8rem;
            color: var(--color-web-1);
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .course-title {
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -1px;
        }

        .gradient-text {
            background: var(--gradient-web);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .course-desc {
            color: var(--text-secondary);
            font-size: 1.05rem;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.7;
        }

        /* ===== 分类区域 ===== */
        .category-section {
            margin-bottom: 56px;
        }
        .category-section:last-child {
            margin-bottom: 0;
        }

        .section-header {
            margin-bottom: 24px;
        }

        .section-title-row {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .section-title {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .section-title.title-lesson {
            background: var(--gradient-web);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .section-title.title-practice {
            background: var(--gradient-practice);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .section-title.title-total {
            background: var(--gradient-total);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .section-count {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* ===== 进度条 ===== */
        .progress-section {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px 28px;
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .progress-info {
            flex-shrink: 0;
        }

        .progress-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .progress-count {
            font-family: var(--font-mono);
            font-size: 1.6rem;
            font-weight: 700;
        }

        .progress-count .current {
            background: var(--gradient-web);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .progress-count.practice .current {
            background: var(--gradient-practice);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .progress-count.total .current {
            background: var(--gradient-total);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .progress-bar-wrap {
            flex: 1;
            height: 8px;
            background: var(--bg-tertiary);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--gradient-web);
            border-radius: 4px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 12px rgba(255, 0, 255, 0.4);
        }
        .progress-bar-fill.fill-practice {
            background: var(--gradient-practice);
            box-shadow: 0 0 12px rgba(255, 0, 255, 0.4);
        }
        .progress-bar-fill.fill-total {
            background: var(--gradient-total);
            box-shadow: 0 0 12px rgba(255, 170, 0, 0.4);
        }

        /* ===== 课程列表 ===== */
        .lessons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .lesson-card {
            position: relative;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
        }

        .lesson-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--gradient-web);
            opacity: 0;
            transition: opacity 0.3s;
            border-radius: 16px;
            z-index: -1;
        }

        .lesson-card:hover {
            border-color: rgba(255, 0, 255, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 8px 32px rgba(255, 0, 255, 0.15);
        }

        .lesson-card.completed {
            border-color: rgba(57, 255, 20, 0.3);
        }

        .lesson-card.completed::after {
            content: '✓';
            position: absolute;
            top: 16px;
            right: 16px;
            width: 28px;
            height: 28px;
            background: var(--success-color);
            color: var(--bg-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            box-shadow: 0 0 12px rgba(57, 255, 20, 0.4);
            z-index: 4;
        }

        .lesson-num {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--color-web-2);
            font-weight: 600;
            letter-spacing: 1px;
        }

        .lesson-card-title {
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.4;
        }

        .lesson-card-type {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 20px;
            margin-bottom: 6px;
            color: #fff;
        }
        .lesson-card .lesson-card-type {
            background: rgba(0, 255, 255, 0.15);
            color: #00ffff;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }

        .lesson-card-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .lesson-card-arrow {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: var(--color-web-2);
            margin-top: auto;
            padding-top: 8px;
        }

        .lesson-card.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .lesson-card.locked .lesson-card-arrow {
            color: var(--text-muted);
        }

        /* 小实战卡片样式（紫色边框） */
        .lesson-card.practice-card {
            border-color: rgba(255, 0, 255, 0.3);
            background: linear-gradient(135deg, rgba(255, 0, 255, 0.08), rgba(0, 255, 255, 0.05));
        }
        .lesson-card.practice-card .lesson-num {
            color: var(--color-practice);
        }
        .lesson-card.practice-card .lesson-card-arrow {
            color: var(--color-practice);
        }
        .lesson-card.practice-card:hover {
            border-color: rgba(255, 0, 255, 0.6);
            box-shadow: 0 8px 30px rgba(255, 0, 255, 0.2);
        }

        /* 总实战卡片样式（金色/橙色边框） */
        .lesson-card.total-practice-card {
            border-color: rgba(255, 170, 0, 0.4);
            background: linear-gradient(135deg, rgba(255, 170, 0, 0.1), rgba(255, 85, 0, 0.05));
        }
        .lesson-card.total-practice-card .lesson-num {
            color: var(--color-total);
        }
        .lesson-card.total-practice-card .lesson-card-arrow {
            color: var(--color-total);
        }
        .lesson-card.total-practice-card:hover {
            border-color: rgba(255, 170, 0, 0.7);
            box-shadow: 0 8px 30px rgba(255, 170, 0, 0.2);
        }

        /* 跳级至此按钮（仅未解锁课程显示，位于卡片右下角） */
        .jump-btn {
            position: absolute;
            right: 14px;
            bottom: 14px;
            display: none;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: linear-gradient(135deg, #ff4466, #ff00ff);
            border: none;
            border-radius: 100px;
            color: #fff;
            font-family: var(--font-display);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 16px rgba(255, 68, 102, 0.35);
            z-index: 5;
        }

        .lesson-card.locked .jump-btn {
            display: inline-flex;
        }

        .jump-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 22px rgba(255, 68, 102, 0.55);
        }

        /* 加载状态 */
        .loading {
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
            font-family: var(--font-mono);
            grid-column: 1 / -1;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            .nav-container { padding: 0 16px; }
            .course-container { padding: 32px 16px 60px; }
            .progress-section {
                flex-direction: column;
                text-align: center;
                gap: 16px;
            }
            .lessons-grid {
                grid-template-columns: 1fr;
            }
            .section-title { font-size: 1.35rem; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="../../index.html" class="nav-back">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                <span>返回首页</span>
            </a>
            <div class="nav-logo">
                <span class="logo-bracket">&lt;</span>
                <span class="logo-text">Web 课程</span>
                <span class="logo-bracket">/&gt;</span>
            </div>
            <div style="width: 80px;"></div>
        </div>
    </nav>

    <div class="course-container">
        <div class="course-header">
            <span class="course-tag">Web 前端开发</span>
            <h1 class="course-title"><span class="gradient-text">课程目录</span></h1>
            <p class="course-desc">系统学习 HTML、CSS、JavaScript，80 节普通课 + 16 个小实战 + 5 个总实战</p>
        </div>

        <!-- ===== 普通课程区域 ===== -->
        <section class="category-section">
            <div class="section-header">
                <div class="section-title-row">
                    <h2 class="section-title title-lesson">普通课程</h2>
                    <span class="section-count">80 课</span>
                </div>
                <div class="progress-section">
                    <div class="progress-info">
                        <div class="progress-label">学习进度</div>
                        <div class="progress-count">
                            <span class="current" id="lessonProgressCurrent">0</span>
                            <span style="color: var(--text-muted);"> / </span>
                            <span id="lessonProgressTotal">0</span>
                        </div>
                    </div>
                    <div class="progress-bar-wrap">
                        <div class="progress-bar-fill" id="lessonProgressBar" style="width: 0%"></div>
                    </div>
                </div>
            </div>
            <div class="lessons-grid" id="lessonsGrid">
                <div class="loading">正在加载课程...</div>
            </div>
        </section>

        <!-- ===== 小实战区域 ===== -->
        <section class="category-section">
            <div class="section-header">
                <div class="section-title-row">
                    <h2 class="section-title title-practice">小实战</h2>
                    <span class="section-count">16 课</span>
                </div>
                <div class="progress-section">
                    <div class="progress-info">
                        <div class="progress-label">实战进度</div>
                        <div class="progress-count practice">
                            <span class="current" id="practiceProgressCurrent">0</span>
                            <span style="color: var(--text-muted);"> / </span>
                            <span id="practiceProgressTotal">0</span>
                        </div>
                    </div>
                    <div class="progress-bar-wrap">
                        <div class="progress-bar-fill fill-practice" id="practiceProgressBar" style="width: 0%"></div>
                    </div>
                </div>
            </div>
            <div class="lessons-grid" id="practicesGrid">
                <div class="loading">正在加载实战...</div>
            </div>
        </section>

        <!-- ===== 总实战区域 ===== -->
        <section class="category-section">
            <div class="section-header">
                <div class="section-title-row">
                    <h2 class="section-title title-total">总实战</h2>
                    <span class="section-count">5 课</span>
                </div>
                <div class="progress-section">
                    <div class="progress-info">
                        <div class="progress-label">总实战进度</div>
                        <div class="progress-count total">
                            <span class="current" id="totalProgressCurrent">0</span>
                            <span style="color: var(--text-muted);"> / </span>
                            <span id="totalProgressTotal">0</span>
                        </div>
                    </div>
                    <div class="progress-bar-wrap">
                        <div class="progress-bar-fill fill-total" id="totalProgressBar" style="width: 0%"></div>
                    </div>
                </div>
            </div>
            <div class="lessons-grid" id="totalPracticesGrid">
                <div class="loading">正在加载总实战...</div>
            </div>
        </section>
    </div>

    <script>
    // 三个分类的独立配置
        const CONFIGS = [
            {
                courseKey: 'web_lesson',
                gridId: 'lessonsGrid',
                progressCurrentId: 'lessonProgressCurrent',
                progressTotalId: 'lessonProgressTotal',
                progressBarId: 'lessonProgressBar',
                prefix: 'LESSON',
                filePattern: 'lesson-{n}.html',
                cardClass: '',
                showType: true,
                actionText: '开始学习',
                reviewText: '复习课程'
            },
            {
                courseKey: 'web_practice',
                gridId: 'practicesGrid',
                progressCurrentId: 'practiceProgressCurrent',
                progressTotalId: 'practiceProgressTotal',
                progressBarId: 'practiceProgressBar',
                prefix: '实战',
                filePattern: 'practice-{n}.html',
                cardClass: 'practice-card',
                showType: false,
                actionText: '开始实战',
                reviewText: '复习实战'
            },
            {
                courseKey: 'web_total_practice',
                gridId: 'totalPracticesGrid',
                progressCurrentId: 'totalProgressCurrent',
                progressTotalId: 'totalProgressTotal',
                progressBarId: 'totalProgressBar',
                prefix: '总实战',
                filePattern: 'total-practice-{n}.html',
                cardClass: 'total-practice-card',
                showType: false,
                actionText: '开始实战',
                reviewText: '复习实战'
            }
        ];

        // 通用渲染：每个分类独立调用，独立 courseKey / 进度 / 解锁逻辑
        async function renderCategory(cfg) {
            const items = await CL_Common.loadLessons(cfg.courseKey, 'lessons.js');
            const completed = CL_Common.getCompletedLessons(cfg.courseKey);
            const total = items.length;
            const grid = document.getElementById(cfg.gridId);

            document.getElementById(cfg.progressCurrentId).textContent = completed.length;
            document.getElementById(cfg.progressTotalId).textContent = total;
            const pct = total > 0 ? (completed.length / total * 100) : 0;
            document.getElementById(cfg.progressBarId).style.width = pct + '%';

            grid.innerHTML = '';

            if (total === 0) {
                grid.innerHTML = '<div class="loading">无法加载数据。</div>';
                return;
            }

            for (let i = 0; i < total; i++) {
                const num = i + 1;
                const isCompleted = completed.includes(num);
                // 顺序解锁：第1课始终解锁，第N课需要第N-1课完成
                const isLocked = num > 1 && !completed.includes(num - 1) && !completed.includes(num);
                const data = items[i];
                const file = cfg.filePattern.replace('{n}', num);

                const card = document.createElement('a');
                card.className = 'lesson-card'
                    + (isCompleted ? ' completed' : '')
                    + (isLocked ? ' locked' : '')
                    + (cfg.cardClass ? ' ' + cfg.cardClass : '');
                card.href = isLocked ? '#' : file;
                card.dataset.file = file;

                const numLabel = `${cfg.prefix} ${String(num).padStart(2, '0')}`;
                const actionLabel = isCompleted ? cfg.reviewText : (isLocked ? '未解锁' : cfg.actionText);

                let typeTag = '';
                if (cfg.showType && data.type) {
                    typeTag = `<div class="lesson-card-type">${data.type}</div>`;
                }

                card.innerHTML = `
                    <div class="lesson-num">${numLabel}</div>
                    ${typeTag}
                    <div class="lesson-card-title">${data.title}</div>
                    <div class="lesson-card-desc">${data.desc}</div>
                    <div class="lesson-card-arrow">
                        <span>${actionLabel}</span>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                    </div>
                    <button class="jump-btn" data-num="${num}" data-file="${file}" title="解锁并跳转到第 ${num} 课">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                        <span>跳级至此</span>
                    </button>
                `;
                grid.appendChild(card);
            }

            // 跳级按钮 & 锁定卡片处理
            grid.addEventListener('click', (e) => {
                const btn = e.target.closest('.jump-btn');
                if (btn) {
                    e.preventDefault();
                    e.stopPropagation();
                    const num = parseInt(btn.dataset.num, 10);
                    const file = btn.dataset.file;
                    if (confirm(`确认跳级到第 ${num} 课吗？\n这将自动标记第 1 至 ${num - 1} 课为已完成。`)) {
                        CL_Common.unlockUntil(cfg.courseKey, num);
                        window.location.href = file;
                    }
                    return;
                }
                // 锁定卡片其它区域点击：阻止跳转
                const lockedCard = e.target.closest('.lesson-card.locked');
                if (lockedCard) {
                    e.preventDefault();
                }
            });
        }

        async function init() {
            for (const cfg of CONFIGS) {
                await renderCategory(cfg);
            }
        }

        init();
    </script>
</body>
</html>
