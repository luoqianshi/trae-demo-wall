<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI随时刷</title>
    <link rel="icon" type="image/png" href="logo/1781078647600.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="styles/chat-section.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="main-header">
        <div class="header-container">
            <!-- 左侧：Logo + 意见反馈 -->
            <div class="header-left-group">
                <div class="header-logo-group">
                    <div class="logo-icon">
                        <img src="logo/fSMTHE5vQ.jpeg" alt="AI随时刷" class="logo-img">
                    </div>
                    <h1 class="header-title">AI随时刷</h1>
                </div>
                <button class="btn-feedback" id="feedbackBtn" title="用户意见箱">
                    <img src="icons/idea.png" alt="意见箱" />
                </button>
            </div>

            <!-- 中间：主导航 -->
            <nav class="main-nav" id="mainNav">
                <button class="nav-link" data-section="practice">✍️ 题目练习</button>
                <button class="nav-link" data-section="history">📋 历史记录</button>
                <button class="nav-link trae-browser-inspect-draggable" data-section="chat"><img src="logo/1781078647600.png" alt="AI 助手" style="width:20px;height:20px;vertical-align:middle;"></button>
                <button class="nav-link" data-section="wrong">📕 错题本</button>
                <button class="nav-link" data-section="export">📊 导出统计</button>
            </nav>

            <!-- 移动端菜单按钮 -->
            <button class="mobile-menu-btn" id="mobileMenuBtn" title="菜单">
                ☰
            </button>

            <!-- 右侧：用户区域 -->
            <div class="header-right-group">
                <!-- 主题切换入口 -->
                <div class="theme-switcher" id="themeSwitcher">
                    <button class="btn-theme-toggle" id="themeToggleBtn" title="单击切换主题，长按展开菜单">🌞</button>
                    <div class="theme-dropdown" id="themeDropdown">
                        <div class="theme-option active" data-theme="light">☀️ 浅色模式</div>
                        <div class="theme-option" data-theme="dark">🌙 深色模式</div>
                        <div class="theme-option" data-theme="eye-care">👁️ 护眼模式</div>
                    </div>
                </div>

                <button class="btn-login" id="loginBtn" onclick="window.location.href='auth/login.html'">🔐 登录/注册</button>
                <div class="user-info" id="userStatus" style="display: none;">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <span class="username" id="displayUsername">用户</span>
                    <button class="btn-logout" id="logoutBtn">登出</button>
                </div>
            </div>
        </div>
    </header>

    <!-- 主容器 -->
    <div class="container">
        <!-- 组件容器 - 动态加载内容 -->
        <div id="app-content">
            <!-- 组件将在这里动态加载 -->
            <div class="loading-state" style="text-align: center; padding: 60px 20px;">
                <div class="loading"></div>
                <p style="margin-top: 20px; color: #999;">正在加载...</p>
            </div>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div class="toast" id="toast"></div>

    <!-- 模态框容器 - 动态加载 -->
    <div id="modal-container"></div>

    <!-- 登录提醒弹窗（仅在用户触发功能时显示，不影响浏览体验） -->
    <div class="login-reminder-modal" id="loginReminderModal" style="display: none;">
        <div class="login-reminder-card">
            <div class="login-reminder-icon">🔐</div>
            <h3 class="login-reminder-title">需要登录</h3>
            <p class="login-reminder-desc" id="loginReminderDesc"></p>
            <div class="login-reminder-hint">登录后即可享受完整的 AI 智能问答、题目练习、错题本等全部功能服务。</div>
            <div class="login-reminder-actions">
                <button class="login-reminder-btn-secondary" id="loginReminderContinueBtn">继续浏览</button>
                <button class="login-reminder-btn-primary" id="loginReminderGoBtn">去登录</button>
            </div>
        </div>
    </div>

    <!-- AI 格式化助手弹窗样式 -->
    <link rel="stylesheet" href="styles/ai-formatter-modal.css">

    <!-- KaTeX 数学公式渲染库 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    
    <!-- 导出功能依赖库 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    
    <!-- API 配置 -->
    <script src="js/api-config.js?v=3"></script>

    <!-- XSS 防护库 -->
    <script src="js/purify.min.js"></script>
    <script src="js/xss-protection.js"></script>

    <script>
        // 使用 api-config.js 中的配置，支持开发和生产环境自动切换
        const API_BASE_URL = (typeof window.API_CONFIG !== 'undefined' && window.API_CONFIG.BASE_URL) 
            ? window.API_CONFIG.BASE_URL 
            : '/api';
    </script>
    
    <!-- 组件加载器 -->
    <script src="js/component-loader.js"></script>
    
    <!-- 业务逻辑模块 -->
    <script src="js/auth.js?v=20260619b"></script>
    <script src="js/storage.js"></script>
    <script src="js/question-format-validator.js"></script>
    <!-- 共享导入服务（上传页面和聊天页面共用） -->
    <script src="js/question-import-service.js"></script>
    <script src="js/question-parser.js?v=20260612"></script>
    <!-- 数学公式渲染模块 -->
    <script src="js/math-renderer.js?v=20260617"></script>
    <!-- AI 服务模块（包含基础函数） -->
    <script src="js/ai-service.js"></script>
    <!-- 使用安全的 AI 服务模块（通过后端代理） -->
    <script src="js/ai-service-secure.js"></script>
    <!-- AI 格式化助手弹窗 -->
    <script src="js/ai-formatter-modal.js"></script>
    <script src="js/practice.js"></script>
    <script src="js/wrong-book.js"></script>
    <script src="js/history.js"></script>
    <!-- AI Agent 聊天页面 -->
    <script src="js/chat-page.js?v=20260617b"></script>
    <script src="js/app.js?v=20260607"></script>

    <script>
        // 初始化应用
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                console.log('📦 开始加载组件...');
                
                // 先清除加载状态
                document.getElementById('app-content').innerHTML = '';
                
                // 加载所有组件
                await ComponentLoader.loadComponents([
                    { name: 'chat-section', target: '#app-content' },
                    { name: 'practice-section', target: '#app-content' },
                    { name: 'history-section', target: '#app-content' },
                    { name: 'wrong-section', target: '#app-content' },
                    { name: 'export-section', target: '#app-content' },
                    { name: 'modals', target: '#modal-container' },
                    { name: 'ai-formatter-modal', target: '#modal-container' }
                ]);

                console.log('✅ 所有组件加载完成');
                
                // 初始化：默认显示聊天页面，隐藏其他section
                document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
                const defaultSection = document.getElementById('chat');
                if (defaultSection) defaultSection.classList.add('active');
                
                // 初始化 AI 格式化助手弹窗
                if (window.AiFormatterModal) {
                    window.AiFormatterModal.init();
                    console.log('✅ AI 格式化助手弹窗已就绪');
                }
                
                // 等待一小段时间确保所有模块都已加载
                setTimeout(() => {
                    console.log('🔧 检查 App 对象...');
                    console.log('  - App.initAuth:', typeof window.App.initAuth);
                    console.log('  - App.init:', typeof window.App.init);
                    
                    // 初始化 App（在组件加载完成后）
                    if (window.App && window.App.init) {
                        console.log('🚀 开始初始化应用...');
                        try {
                            window.App.init();
                        } catch (initError) {
                            console.error('❌ App.init() 执行失败:', initError);
                            document.getElementById('app-content').innerHTML = `
                                <div class="empty-state">
                                    <div class="empty-icon">⚠️</div>
                                    <div class="empty-text">应用初始化失败</div>
                                    <p style="color: #999; margin-top: 10px;">${initError.message}</p>
                                    <button class="btn btn-primary" onclick="location.reload()" style="margin-top: 20px;">重新加载</button>
                                </div>
                            `;
                        }
                    } else {
                        console.error('❌ App 对象或 init 方法不存在');
                    }
                }, 100);
                
            } catch (error) {
                console.error('❌ 组件加载失败:', error);
                document.getElementById('app-content').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">⚠️</div>
                        <div class="empty-text">应用加载失败</div>
                        <p style="color: #999; margin-top: 10px;">${error.message}</p>
                        <button class="btn btn-primary" onclick="location.reload()" style="margin-top: 20px;">重新加载</button>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
