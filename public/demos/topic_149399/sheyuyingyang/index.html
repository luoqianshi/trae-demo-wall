<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>舌语 · 中医体质辨识</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;500;700;900&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- 装饰背景：草本纹样 + 渐变光晕 -->
  <div class="ambient" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- 应用主体：固定 480px 宽度居中（模拟手机应用） -->
  <main id="app" class="app-shell"></main>

  <!-- Toast 提示 -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- 粒子 confetti 容器 -->
  <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>

  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
