/**
 * 奇幻英语闯关 - 统计页
 * @module stats
 * @description 学习数据统计：正确率趋势、知识点掌握度、学习时长等
 */
(function (window) {
  'use strict';

  /** 阶段中文名映射（优先使用全局配置） */
  var STAGE_NAMES = (window.EA_CONFIG && window.EA_CONFIG.STAGE_NAMES)
    ? window.EA_CONFIG.STAGE_NAMES
    : {
      grade1a: '一年级上册', grade1b: '一年级下册',
      grade2a: '二年级上册', grade2b: '二年级下册',
      grade3a: '三年级上册', grade3b: '三年级下册',
      grade4a: '四年级上册', grade4b: '四年级下册',
      grade5a: '五年级上册', grade5b: '五年级下册',
      grade6a: '六年级上册', grade6b: '六年级下册',
      primary_review: '小升初综合'
    };

  /** 阶段渲染顺序（优先使用全局配置） */
  var STAGE_ORDER = (window.EA_CONFIG && window.EA_CONFIG.STAGE_ORDER)
    ? window.EA_CONFIG.STAGE_ORDER
    : [
      'grade1a', 'grade1b', 'grade2a', 'grade2b',
      'grade3a', 'grade3b', 'grade4a', 'grade4b',
      'grade5a', 'grade5b', 'grade6a', 'grade6b',
      'primary_review'
    ];

  /**
   * 创建统计行
   * @param {string} label - 标签
   * @param {string|number} value - 值
   * @returns {HTMLElement}
   */
  function createStatRow(label, value) {
    var row = Renderer.createDiv('stats-row');
    row.appendChild(Renderer.createElement('span', '', label));
    row.appendChild(Renderer.createElement('span', 'text-primary', String(value)));
    return row;
  }

  /**
   * @namespace StatsPage
   */
  var StatsPage = {
    /**
     * 渲染统计页
     * @param {HTMLElement} container - 页面容器
     */
    render: function (container) {
      if (!container) return;
      Renderer.clearContainer(container);

      var page = Renderer.createDiv('stats-page');
      container.appendChild(page);

      // 标题
      var header = Renderer.createDiv('page-header');
      header.appendChild(Renderer.createElement('h1', 'page-title', '学习统计'));
      page.appendChild(header);

      // 加载中
      page.appendChild(Renderer.createElement('div', 'text-center text-muted mt-lg', '加载中...'));

      // 同步获取的数据
      var balance = RewardEngine.getBalance();
      var checkinStatus = RewardEngine.getCheckinStatus();
      var checkinHistory = StorageManager.get('checkin_history', []);
      if (!Array.isArray(checkinHistory)) checkinHistory = [];

      // 计算最长连续打卡
      var bestStreak = 0;
      checkinHistory.forEach(function (h) {
        if (h && h.streak > bestStreak) bestStreak = h.streak;
      });
      if (checkinStatus.streak > bestStreak) {
        bestStreak = checkinStatus.streak;
      }

      // 并行加载异步数据
      var progressPromise = LevelEngine.getProgress();
      var weakPointsPromise = AdaptiveEngine.getWeakPoints();

      Promise.all([progressPromise, weakPointsPromise]).then(function (results) {
        Renderer.clearContainer(page);
        page.appendChild(header);

        var progress = results[0];
        var weakPoints = results[1];

        // === 学习概览 ===
        var overviewSection = Renderer.createDiv('stats-section');
        overviewSection.appendChild(Renderer.createElement('h3', 'stats-section-title', '学习概览'));
        overviewSection.appendChild(createStatRow('学习天数', checkinHistory.length + ' 天'));
        overviewSection.appendChild(createStatRow('已完成关卡',
          progress.completedLevels + ' / ' + progress.totalLevels));
        overviewSection.appendChild(createStatRow('总星数', progress.totalStars));
        overviewSection.appendChild(createStatRow('总积分', balance));
        page.appendChild(overviewSection);

        // === 关卡进度（按阶段） ===
        var stageSection = Renderer.createDiv('stats-section');
        stageSection.appendChild(Renderer.createElement('h3', 'stats-section-title', '关卡进度'));

        STAGE_ORDER.forEach(function (stage) {
          var data = progress.byStage[stage] || { total: 0, completed: 0, stars: 0 };
          var stageName = STAGE_NAMES[stage] || stage;

          // 阶段标题行
          var labelRow = Renderer.createDiv('stats-row');
          labelRow.appendChild(Renderer.createElement('span', '', stageName));
          labelRow.appendChild(Renderer.createElement('span', 'text-muted',
            data.completed + ' / ' + data.total + '（⭐' + data.stars + '）'));
          stageSection.appendChild(labelRow);

          // 进度条
          stageSection.appendChild(ProgressBar.create({
            current: data.completed,
            total: data.total,
            label: stageName
          }));
        });
        page.appendChild(stageSection);

        // === 打卡记录 ===
        var checkinSection = Renderer.createDiv('stats-section');
        checkinSection.appendChild(Renderer.createElement('h3', 'stats-section-title', '打卡记录'));
        checkinSection.appendChild(createStatRow('当前连续', checkinStatus.streak + ' 天'));
        checkinSection.appendChild(createStatRow('最长连续', bestStreak + ' 天'));
        checkinSection.appendChild(createStatRow('今日签到',
          checkinStatus.todayCheckedIn ? '✅ 已签到' : '⬜ 未签到'));
        page.appendChild(checkinSection);

        // === 知识点掌握度 ===
        var weakSection = Renderer.createDiv('stats-section');
        weakSection.appendChild(Renderer.createElement('h3', 'stats-section-title', '知识点掌握度'));

        if (weakPoints && weakPoints.length > 0) {
          weakPoints.forEach(function (wp) {
            var row = Renderer.createDiv('stats-row');
            row.appendChild(Renderer.createElement('span', '', wp.knowledgePoint));
            row.appendChild(Renderer.createElement('span', 'text-error',
              '错误率 ' + Math.round(wp.errorRate * 100) + '%（' + wp.wrongCount + '/' + wp.totalCount + '）'));
            weakSection.appendChild(row);
          });
        } else {
          weakSection.appendChild(Renderer.createElement('p', 'text-muted',
            '暂无薄弱知识点，继续保持！'));
        }
        page.appendChild(weakSection);

      }).catch(function (err) {
        Renderer.clearContainer(page);
        page.appendChild(header);
        page.appendChild(Renderer.createElement('div', 'text-center text-error mt-lg',
          '加载统计数据失败：' + (err && err.message ? err.message : '未知错误')));
      });
    },
  };

  Router.register('#/stats', StatsPage.render);
  window.StatsPage = StatsPage;
})(window);

  function handleExport() {

    }).catch(function (err) {

    });

  /**

   * @param {Object} result - 导入结果
   * @param {HTMLElement} previewEl - 预览区域
   * @param {HTMLElement} errorEl - 错误区域
   * @returns {boolean} 是否成功
   */
  function showImportResult(result, previewEl, errorEl) {
    Renderer.clearContainer(previewEl);

    if (result.success) {
      previewEl.appendChild(Renderer.createElement('div', 'text-primary',
        '✓ 导入成功：' + result.count + ' 条题目'));
      previewEl.style.display = 'block';
      errorEl.style.display = 'none';
      return true;
    }

    previewEl.style.display = 'none';
    if (result.errors && result.errors.length > 0) {
      // 使用 textContent 避免 XSS 风险（错误信息来自用户导入数据）
      errorEl.textContent = result.errors.map(function (e) {
        return '• ' + e;
      }).join('\n');
      errorEl.style.display = 'block';
    }
    return false;
  }

  /**
   * 处理文件导入
   * @param {File} file - 文件对象
   * @param {HTMLElement} previewEl - 预览区域
   * @param {HTMLElement} errorEl - 错误区域
   */
  function handleFileImport(file, previewEl, errorEl) {
    var name = (file.name || '').toLowerCase();
    var importPromise;

    if (name.endsWith('.csv')) {
      importPromise = ImportExport.importCSV(file);
    } else {
      // .json / .txt / 其他均按 JSON 文本处理
      importPromise = ImportExport.importJSON(file);
    }

    importPromise.then(function (result) {
      var success = showImportResult(result, previewEl, errorEl);
      if (success) {
        Toast.success('成功导入 ' + result.count + ' 条数据');
      } else {
        Toast.error('导入失败，请检查文件格式');
      }
    }).catch(function (err) {
      errorEl.textContent = '导入失败：' + (err && err.message ? err.message : '未知错误');
      errorEl.style.display = 'block';
      previewEl.style.display = 'none';
    });
  }

   */
  function handleTextImport(text, previewEl, errorEl) {
    ImportExport.importText(text).then(function (result) {
      var success = showImportResult(result, previewEl, errorEl);
      if (success) {
        Toast.success('成功导入 ' + result.count + ' 条数据');
        setTimeout(function () { Modal.hide(); }, 1200);

      importZone.classList.remove('drag-over');

          storyRight.appendChild(Renderer.createElement('span', 'settings-item-value',
            (storyline.icon || '') + ' ' + storyline.name));
          storyRight.appendChild(Button.create({
            text: '切换',
            variant: 'outline',
            size: 'sm',
            onClick: function () { Router.navigate('#/story-select'); }
          }));
          storyItem.appendChild(storyRight);
          userSection.appendChild(storyItem);
        }
      }

      page.appendChild(userSection);

      // === 数据管理 ===
      var dataSection = Renderer.createDiv('settings-section');
      dataSection.appendChild(Renderer.createElement('div', 'settings-section-title', '数据管理'));

      // 导出备份
      var exportItem = Renderer.createDiv('settings-item');
      exportItem.appendChild(Renderer.createElement('span', 'settings-item-label', '导出备份'));
      exportItem.appendChild(Button.create({
        text: '导出',
        variant: 'outline',
        size: 'sm',
        onClick: function () { handleExport(); }
      }));
      dataSection.appendChild(exportItem);

      // 导入数据
      var importItem = Renderer.createDiv('settings-item');
      importItem.appendChild(Renderer.createElement('span', 'settings-item-label', '导入数据'));
      importItem.appendChild(Button.create({
        text: '导入',
        variant: 'outline',
        size: 'sm',
        onClick: function () { showImportModal(); }
      }));
      dataSection.appendChild(importItem);

      // 下载模板
      var templateItem = Renderer.createDiv('settings-item');
      templateItem.appendChild(Renderer.createElement('span', 'settings-item-label', '下载模板'));
      templateItem.appendChild(Button.create({
        text: '下载',
        variant: 'outline',
        size: 'sm',
        onClick: function () { handleDownloadTemplate(); }
      }));
      dataSection.appendChild(templateItem);

      // 清空数据（危险操作）
      var clearItem = Renderer.createDiv('settings-item');
      clearItem.appendChild(Renderer.createElement('span', 'settings-item-label settings-item-danger',
        '清空所有数据'));
      clearItem.appendChild(Button.create({
        text: '清空',
        variant: 'ghost',
        size: 'sm',
        onClick: function () { handleClearData(); }
      }));
      dataSection.appendChild(clearItem);
      page.appendChild(dataSection);

      // === 音乐设置 ===
      if (window.AudioEngine && AudioEngine.isSupported()) {
        var audioSection = Renderer.createDiv('settings-section');
        audioSection.appendChild(Renderer.createElement('div', 'settings-section-title', '音乐设置'));

        var audioState = AudioEngine.getState();

        // 背景音乐开关
        var musicItem = Renderer.createDiv('settings-item');
        musicItem.appendChild(Renderer.createElement('span', 'settings-item-label', '背景音乐'));
        var musicToggleBtn = Button.create({
          text: audioState.playing ? '关闭' : '开启',
          variant: audioState.playing ? 'primary' : 'outline',
          size: 'sm',
          onClick: function () {
            var result = AudioEngine.toggle();
            musicToggleBtn.textContent = result.playing ? '关闭' : '开启';
            musicToggleBtn.className = 'btn btn-' + (result.playing ? 'primary' : 'outline') + ' btn-sm';
            if (window.Toast) {
              Toast.info(result.playing ? '音乐已开启' : '音乐已关闭');
            }
          }
        });
        musicItem.appendChild(musicToggleBtn);
        audioSection.appendChild(musicItem);

        // 监听音频状态变化事件，同步按钮（处理异步播放和外部触发如 data:cleared）
        if (window.EventBus) {
          // 先移除旧监听器，避免重复注册导致内存泄漏
          if (_audioStateHandler) {
            EventBus.off('audio:stateChanged', _audioStateHandler);
          }
          _audioStateHandler = function (state) {
            musicToggleBtn.textContent = state.playing ? '关闭' : '开启';
            musicToggleBtn.className = 'btn btn-' + (state.playing ? 'primary' : 'outline') + ' btn-sm';
          };
          EventBus.on('audio:stateChanged', _audioStateHandler);
        }

        // 音量调节
        var volumeItem = Renderer.createDiv('settings-item');
        volumeItem.style.flexDirection = 'column';
        volumeItem.style.alignItems = 'stretch';
        volumeItem.appendChild(Renderer.createElement('span', 'settings-item-label',
          '音量（' + Math.round(audioState.volume * 100) + '%）'));

        var volumeSlider = document.createElement('input');
        volumeSlider.type = 'range';
        volumeSlider.min = '0';
        volumeSlider.max = '100';
        volumeSlider.value = Math.round(audioState.volume * 100);
        volumeSlider.style.width = '100%';
        volumeSlider.style.marginTop = '8px';
        volumeSlider.addEventListener('input', function () {
          var vol = parseInt(volumeSlider.value, 10) / 100;
          AudioEngine.setVolume(vol);
          // 更新标签
          var labelEl = volumeItem.querySelector('.settings-item-label');
          if (labelEl) {
            labelEl.textContent = '音量（' + volumeSlider.value + '%）';
          }
        });
        volumeItem.appendChild(volumeSlider);
        audioSection.appendChild(volumeItem);

        // 曲目选择（多曲目供用户选择）
        var trackItem = Renderer.createDiv('settings-item');
        trackItem.style.flexDirection = 'column';
        trackItem.style.alignItems = 'stretch';
        trackItem.appendChild(Renderer.createElement('span', 'settings-item-label',
          '背景曲目（当前：' + AudioEngine.getCurrentThemeName() + '）'));

        var themes = AudioEngine.getThemes();
        var trackSelect = document.createElement('select');
        trackSelect.className = 'form-control';
        trackSelect.style.width = '100%';
        trackSelect.style.marginTop = '8px';
        trackSelect.style.padding = '8px';
        trackSelect.style.borderRadius = 'var(--radius-md)';
        trackSelect.style.border = '1px solid var(--color-border)';
        themes.forEach(function (t) {
          var opt = document.createElement('option');
          opt.value = t.id;
          opt.textContent = t.name;
          if (t.id === audioState.theme) opt.selected = true;
          trackSelect.appendChild(opt);
        });
        trackSelect.addEventListener('change', function () {
          AudioEngine.selectTrack(trackSelect.value);
          var trackLabel = trackItem.querySelector('.settings-item-label');
          if (trackLabel) {
            trackLabel.textContent = '背景曲目（当前：' + AudioEngine.getCurrentThemeName() + '）';
          }
          if (window.Toast) {
            Toast.info('已切换至：' + AudioEngine.getCurrentThemeName());
          }
        });
        trackItem.appendChild(trackSelect);
        audioSection.appendChild(trackItem);

        page.appendChild(audioSection);
      }

      // === 关于 ===
      var aboutSection = Renderer.createDiv('settings-section');
      aboutSection.appendChild(Renderer.createElement('div', 'settings-section-title', '关于'));

      var version = (window.EA_CONFIG && window.EA_CONFIG.APP_VERSION) || '1.0.0';
      var storageMode = (window.EA_APP_STATE && window.EA_APP_STATE.storageMode) || 'indexedDB';

      aboutSection.appendChild(createSettingsItem('应用版本', 'v' + version));
      aboutSection.appendChild(createSettingsItem('存储模式', storageMode));
      aboutSection.appendChild(createSettingsItem('应用描述', '奇幻英语闯关 - 面向小学生的英语学习益智游戏'));
      page.appendChild(aboutSection);
    },
  };

  Router.register('#/settings', SettingsPage.render);
  window.SettingsPage = SettingsPage;
})(window);

/**
 * 奇幻英语闯关 - 应用入口
 * @module app
 * @description 应用初始化、启动流程
 */
(function (window) {
  'use strict';

  /**
   * @namespace App
   */
  var App = {
    /**
     * 应用启动
     */
    init: function () {
      console.log('[App] Initializing English Adventure v' + window.EA_CONFIG.APP_VERSION);

      // 1. 初始化存储层
      this._initStorage()
        .then(function () {
          // 2. 检查用户状态
          var user = StorageManager.get('user_profile');
          if (user) {
            window.EA_APP_STATE.currentUser = user;
            document.getElementById('navbar-nickname').textContent = user.nickname;
          }

          // 3. 初始化路由
          Router.init();

          // 4. 初始化音频引擎（读取偏好、订阅事件，不创建 AudioContext）
          if (window.AudioEngine) {
            AudioEngine.init();
          }

          // 5. 根据用户状态决定首页
          if (!user) {
            Router.navigate('#/welcome');
          } else if (window.StoryEngine && !StoryEngine.hasSelected()) {
            Router.navigate('#/story-select');
          } else {
            Router.navigate('#/home');
          }
        })
        .catch(function (err) {
          console.error('[App] Init failed:', err);
          // 降级：只使用 localStorage
          window.EA_APP_STATE.storageMode = 'localStorage';
          Router.init();
          Router.navigate('#/home');
        });
    },

    /**
     * 初始化存储层
     * @returns {Promise}
     */
    _initStorage: function () {
      var self = this;
      return IDB.init()
        .then(function () {
          console.log('[App] IndexedDB initialized');
          window.EA_APP_STATE.storageMode = 'indexedDB';
          // 检查是否需要初始化预设题库
          return QuestionBank.isInitialized().then(function (initialized) {
            if (!initialized) {
              return QuestionBank.initPresetQuestions();
            }
          });
        })
        .catch(function () {
          console.warn('[App] IndexedDB unavailable, falling back to localStorage');
          window.EA_APP_STATE.storageMode = 'localStorage';
          // 降级模式：将预设题库写入 localStorage，确保功能可用
          return self._initPresetToLocal();
        });
    },

    /**
     * 降级模式：将预设题库初始化到 localStorage
     * @returns {Promise}
     */
    _initPresetToLocal: function () {
      return QuestionBank.isInitialized().then(function (initialized) {
        if (!initialized) {
          return QuestionBank.initPresetQuestions();
        }
      }).catch(function () {
        console.warn('[App] Preset questions init failed in fallback mode');
      }).then(function () {
        EventBus.emit('storage:fallback');
      });
    },
  };

  // DOM 加载完成后启动
  document.addEventListener('DOMContentLoaded', function () {
    App.init();
  });

  window.App = App;
})(window);

</script>
</body>
</html>
