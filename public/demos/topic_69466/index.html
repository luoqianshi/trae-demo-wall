  /**
   * 创建错误对象

   * @param {string} message - 错误描述
   * @param {string} [path] - 错误位置路径
   * @returns {{ code: string, message: string, path: string }}

  function makeError(code, message, path) {

  var Validator = {
    /**
     * 校验导入的 JSON 数据结构
     * 支持两种格式：

     *   2. 分离格式：{ version, levels: [...], questions: [...] }（exportData 导出格式）
     * @param {*} data - 待校验的数据
     * @returns {{ valid: boolean, errors: Array<{code, message, path}> }}
     */
    validateImportData: function (data) {
      var errors = [];

      if (data === null || typeof data !== 'object' || Array.isArray(data)) {
        errors.push(makeError(
          'INVALID_FORMAT',
          '数据格式无效，应为包含 version 和 levels 的对象',
          'root'
        ));
        return { valid: false, errors: errors };
      }

      // 校验 version
      if (!data.version) {

          'MISSING_VERSION',
          '缺少 version 字段',
          'version'

        errors.push(makeError(

          'NO_LEVELS',

          'levels'

      // 判断是否为分离格式（levels 不含内嵌 questions，但有顶层 questions 数组）
      var isSeparatedFormat = Array.isArray(data.questions) && data.questions.length > 0 &&

                  qPath + (err.path ? '.' + err.path : '')

            }

      if (!type) {
        errors.push(makeError('INVALID_TYPE', '缺少题目类型 type 字段', 'type'));
        return { valid: false, errors: errors };
      }

      if (!typeConfig) {
        errors.push(makeError(
          'INVALID_TYPE',
          '无效的题目类型：' + type + '（支持：word_match, listening, spelling, grammar_choice）',
          'type'

            'MISSING_OPTIONS',
            '选项数量不足，' + type + ' 题型需要至少 ' + typeConfig.optionsCount + ' 个选项',

          for (var i = 0; i < options.length; i++) {
            if (options[i] === undefined || options[i] === null || options[i] === '') {

                'MISSING_OPTIONS',
                '第 ' + (i + 1) + ' 个选项内容为空',
                'options[' + i + ']'

              'correct'
            ));
          }
        }

        errors.push(makeError('LEVEL_NO_NAME', '关卡缺少 name 字段或名称为空', 'name'));

        errors.push(makeError('LEVEL_NO_QUESTIONS', '关卡缺少 questions 数组', 'questions'));

        errors.push(makeError(
          'LEVEL_NO_QUESTIONS',
          '关卡至少需要 1 道题目',
          'questions'
        ));
      }

    },

  /* ================================================================== *
   * 本地工具函数 (不依赖 Helpers，保证数据文件可独立生成)
   * ================================================================== */

  /**
   * Fisher-Yates 洗牌 (返回新数组)
   */
  function shuffle(arr) {
    var copy = arr.slice();
    for (var i = copy.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = copy[i];
      copy[i] = copy[j];
      copy[j] = tmp;
    }
    return copy;
  }

  /**
   * 从词汇表中挑选 n 个干扰项 (中文翻译)
   */
  function pickDistractors(correctCn, allWords, n) {
    var others = allWords.filter(function (w) {
      return w.cn !== correctCn;
    });
    return shuffle(others).slice(0, n).map(function (w) {
      return w.cn;
    });
  }

  /**
   * 生成 word_match 选项 (4 个，含正确项)
   */
  function makeOptions(correctCn, allWords, correctPosition) {
    var distractors = pickDistractors(correctCn, allWords, 3);
    var options = [];
    var dIdx = 0;
    for (var i = 0; i < 4; i++) {
      if (i === correctPosition) {
        options.push(correctCn);
      } else {
        options.push(distractors[dIdx++]);
      }
    }
    return { options: options, correct: correctPosition };
  }

  /**
   * 生成拼写提示 (保留首字母及部分字母，其余用 _ 替换)
   * 示例: library → "l _ b _ a _ y"
   */
  function makeSpellingHint(word) {
    var letters = word.split('');
    var result = [];
    for (var i = 0; i < letters.length; i++) {
      if (i === 0) {
        result.push(letters[i]);
      } else if (i === letters.length - 1 && letters.length <= 6) {
        result.push(letters[i]);
      } else if (i % 3 === 0) {
        result.push(letters[i]);
      } else {
        result.push('_');
      }
    }
    return result.join(' ');
  }

  /* ================================================================== *
   * 题目生成器
   * ================================================================== */

  function makeWordMatch(levelNum, qNum, word, allWords, difficulty, kp) {
    var correctPos = (levelNum + qNum) % 4;
    var opt = makeOptions(word.cn, allWords, correctPos);
    return {
      id: 'preset-' + levelNum + '-' + qNum,
      type: 'word_match',
      levelId: 'preset-' + levelNum,
      english: word.en,
      chinese: word.cn,
      difficulty: difficulty,
      knowledgePoint: kp,
      options: opt.options,
      correct: opt.correct,
      hint: word.hint
    };
  }

  function makeListening(levelNum, qNum, word, allWords, difficulty, kp) {
    var correctPos = (levelNum + qNum) % 4;
    var opt = makeOptions(word.cn, allWords, correctPos);
    return {
      id: 'preset-' + levelNum + '-' + qNum,
      type: 'listening',
      levelId: 'preset-' + levelNum,
      english: word.en,
      chinese: word.cn,
      difficulty: difficulty,
      knowledgePoint: kp,
      options: opt.options,
      correct: opt.correct,
      hint: word.hint,
      audioText: word.en
    };
  }

  function makeSpelling(levelNum, qNum, word, allWords, difficulty, kp) {
    // 拼写题改为选择题模式：根据中文释义和字母提示，选择正确的英文单词
    var correctPos = (levelNum + qNum) % 4;
    // 从 allWords 中挑选 3 个英文干扰项（排除正确答案）
    var otherEnglish = allWords.filter(function (w) { return w.en !== word.en; })
      .map(function (w) { return w.en; });
    var distractors = shuffle(otherEnglish).slice(0, 3);
    var options = [];
    var dIdx = 0;
    for (var i = 0; i < 4; i++) {
      if (i === correctPos) {
        options.push(word.en);
      } else {
        options.push(distractors[dIdx++]);
      }
    }
    return {
      id: 'preset-' + levelNum + '-' + qNum,
      type: 'spelling',
      levelId: 'preset-' + levelNum,
      english: word.en,
      chinese: word.cn,
      difficulty: difficulty,
      knowledgePoint: kp,
      options: options,
      correct: correctPos,
      hint: makeSpellingHint(word.en)
    };
  }

  function makeGrammarChoice(levelNum, qNum, grammarData, difficulty) {
    return {
      id: 'preset-' + levelNum + '-' + qNum,
      type: 'grammar_choice',
      levelId: 'preset-' + levelNum,
      english: grammarData.english,
      chinese: grammarData.chinese,
      difficulty: difficulty,
      knowledgePoint: grammarData.kp,
      options: grammarData.options,
      correct: grammarData.correct,
      explanation: grammarData.explanation
    };
  }

  /* ================================================================== *
   * 1-2年级题型生成器：4 word_match + 3 listening + 3 spelling
   * ================================================================== */
  function generateLowGradeLevel(levelNum, words, difficulty, kp) {
    for (var i = 0; i < 10; i++) {
      if (i < 4) {
        questions.push(makeWordMatch(levelNum, i + 1, words[i], words, difficulty, kp));
      } else if (i < 7) {
        questions.push(makeListening(levelNum, i + 1, words[i], words, difficulty, kp));
      } else {
        questions.push(makeSpelling(levelNum, i + 1, words[i], words, difficulty, kp));
      }
    }
  }

  /* ================================================================== *
   * 3-4年级题型生成器：4 word_match + 3 listening + 2 spelling + 1 grammar
   * ================================================================== */
  function generateMidGradeLevel(levelNum, words, difficulty, kp, grammarData) {
    for (var i = 0; i < 10; i++) {
      if (i < 4) {
        questions.push(makeWordMatch(levelNum, i + 1, words[i], words, difficulty, kp));
      } else if (i < 7) {
        questions.push(makeListening(levelNum, i + 1, words[i], words, difficulty, kp));
      } else if (i < 9) {
        questions.push(makeSpelling(levelNum, i + 1, words[i], words, difficulty, kp));
      } else {
        questions.push(makeGrammarChoice(levelNum, i + 1, grammarData, difficulty));
      }
    }
  }

        { levelIndex: 21, title: '朱紫国', description: '国王患病三年，孙悟空妙手回春，揭榜治病。', unlockedText: '孙悟空用马尿和锅底灰做成药丸，治好国王，又降服赛太岁救回王后！' },
        { levelIndex: 22, title: '盘丝洞', description: '七个蜘蛛精在盘丝洞设下陷阱，日日去濯垢泉洗澡。', unlockedText: '孙悟空请来毗蓝婆菩萨，收服蜘蛛精和蜈蚣精，盘丝洞烟消云散！' },
        { levelIndex: 23, title: '狮驼岭', description: '狮驼岭三魔——青毛狮子、黄牙老象、大鹏金翅雕拦路。', unlockedText: '如来佛祖亲自出手降服大鹏金翅雕，文殊普贤收回狮象，狮驼岭转危为安！' },
        { levelIndex: 24, title: '比丘国', description: '鹿妖用小儿心肝炼制长生不老药，比丘国人心惶惶。', unlockedText: '孙悟空救出鹅笼中的小儿，降服鹿妖和狐狸精，比丘国恢复安宁！' },
        { levelIndex: 25, title: '无底洞', description: '金鼻白毛老鼠精在无底洞作乱，掳走唐僧。', unlockedText: '孙悟空请来托塔李天王和哪吒三太子，收服老鼠精，救出师父！' },
        { levelIndex: 26, title: '灭法国', description: '灭法国国王发誓要杀一万个和尚，师徒危险重重。', unlockedText: '孙悟空剃光国王头发，国王幡然醒悟，灭法国改名钦法国！' },
        { levelIndex: 27, title: '隐雾山', description: '豹子精在隐雾山拦路，用假人头骗孙悟空说唐僧已死。', unlockedText: '孙悟空识破假人头，一棒打死豹子精，师徒继续前行！' },
        { levelIndex: 28, title: '凤仙郡', description: '凤仙郡三年大旱，百姓民不聊生。', unlockedText: '孙悟空上天求雨，凤仙郡百姓行善积德，天降甘霖万物复苏！' },
        { levelIndex: 29, title: '玉华州', description: '三位王子拜孙悟空、猪八戒、沙和尚为师学艺。', unlockedText: '兵器被黄狮精盗走，孙悟空夺回兵器，三位王子武艺大增！' },
        { levelIndex: 30, title: '金平府', description: '犀牛精假扮佛爷，每年正月十五骗取香油。', unlockedText: '孙悟空请来四木禽星，降服三只犀牛精，金平府百姓拍手称快！' },
        { levelIndex: 31, title: '天竺国', description: '玉兔精假扮公主，在天竺国抛绣球招唐僧为驸马。', unlockedText: '嫦娥仙子收走玉兔，真公主回到宫中，师徒继续西行！' },
        { levelIndex: 32, title: '铜台府', description: '师徒被诬陷为盗贼，身陷囹圄。', unlockedText: '孙悟空巧妙周旋，揪出真凶，师徒洗清冤屈！' },
        { levelIndex: 33, title: '凌云渡', description: '唐僧脱去凡胎，登上凌云渡无底船。', unlockedText: '唐僧抛弃凡胎肉身，终于脱胎换骨，距离灵山仅一步之遥！' },
        { levelIndex: 34, title: '灵山脚下', description: '师徒来到灵山脚下，玉真观金顶大仙迎接。', unlockedText: '灵山就在眼前，师徒四人激动不已，十四年的艰辛即将修成正果！' },
        { levelIndex: 35, title: '阿难迦叶', description: '阿难和迦叶尊者索要人事，传了无字真经。', unlockedText: '孙悟空发现是无字真经，返回灵山质问，阿难迦叶改传有字真经！', collectible: { name: '锦斓袈裟', icon: '👘' } },
        { levelIndex: 36, title: '再求真经', description: '孙悟空重返灵山，索要有字真经。', unlockedText: '如来佛祖发话，唐僧师徒终于拿到了五千零四十八卷有字真经！' },
        { levelIndex: 37, title: '老鼋渡河', description: '老鼋驮师徒过通天河，因忘记问寿数怒沉经书。', unlockedText: '老鼋沉入水底，经书被打湿，师徒四人狼狈上岸，这也是一难！' },
        { levelIndex: 38, title: '晒经石', description: '经书打湿，师徒在石上晾晒经书。', unlockedText: '经书在晒经石上晾干，石头留下了经文的印记，成为千古遗迹！' },
        { levelIndex: 39, title: '归途遇险', description: '取经归途中，残存妖魔再次拦路。', unlockedText: '师徒四人八十一难已满，最后妖魔被轻松化解，归途坦荡！' },
        { levelIndex: 40, title: '重返长安', description: '师徒四人历经千辛万苦，回到长安城。', unlockedText: '长安城万人空巷，百姓夹道欢迎取经归来的高僧！', collectible: { name: '通关文牒', icon: '📜' } },
        { levelIndex: 41, title: '唐王迎接', description: '唐太宗李世民亲自迎接取经归来的唐僧。', unlockedText: '唐王感激唐僧不远万里取回真经，设宴款待师徒四人！' },
        { levelIndex: 42, title: '雁塔藏经', description: '经书藏于大雁塔，永世流传。', unlockedText: '五千零四十八卷真经入藏大雁塔，佛法东传，功德无量！' },
        { levelIndex: 43, title: '功德圆满', description: '唐僧师徒功德圆满，被八大金刚接引重返灵山。', unlockedText: '八大金刚驾云而来，接引唐僧师徒重返灵山受封！' },
        { levelIndex: 44, title: '封佛受职', description: '如来佛祖在金殿上分封师徒四人。', unlockedText: '如来佛祖论功行赏，师徒四人各有封赏，修成正果！' },
        { levelIndex: 45, title: '斗战胜佛', description: '孙悟空被封为斗战胜佛。', unlockedText: '孙悟空功德圆满，被封为斗战胜佛，头上的紧箍咒自然消失！' },
        { levelIndex: 46, title: '净坛使者', description: '猪八戒被封为净坛使者。', unlockedText: '猪八戒被封为净坛使者，天下供品尽归他享用，乐得合不拢嘴！' },
        { levelIndex: 47, title: '取得真经', description: '金身罗汉、八部天龙，师徒四人终成正果。', unlockedText: '历经九九八十一难，唐僧师徒终于取得真经，修成正果！', collectible: { name: '真经', icon: '📖' } }
      ]

      var result = Helpers.shuffleArray(arr);
      if (Array.isArray(result)) return result;

    var copy = arr.slice();
    for (var i = copy.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));

        })

          });
          return Promise.all(qPromises);
        })
        .then(function () {
          // 将第一关设为 unlocked
          var firstLevel = levels[0];
          if (firstLevel) {
            return IDB.add('user_progress', {
              levelId: firstLevel.id,

              stars: 0,
              bestAccuracy: 0,
              playCount: 0,
              completedAt: null
            });

  /**
   * 获取今天的日期字符串 YYYY-MM-DD
   * @returns {string}
   */
  function getTodayStr() {
    var d = new Date();
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  /**
   * 获取昨天的日期字符串
   * @returns {string}
   */
  function getYesterdayStr() {
    var d = new Date();
    d.setDate(d.getDate() - 1);
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  /**
   * 计算两个日期字符串之间的天数差 (date2 - date1)
   * @param {string} dateStr1 - YYYY-MM-DD
   * @param {string} dateStr2 - YYYY-MM-DD
   * @returns {number}
   */
  function getDaysDiff(dateStr1, dateStr2) {
    var d1 = new Date(dateStr1 + 'T00:00:00');
    var d2 = new Date(dateStr2 + 'T00:00:00');
    var ms = d2.getTime() - d1.getTime();
    return Math.round(ms / (1000 * 60 * 60 * 24));
  }

     * 构建徽章检查上下文 (从 StorageManager 读取运行时累计数据)
     * @param {number} [totalPoints] - 当前积分余额 (不传则读取)
     * @param {number} [currentStreak] - 当前连续签到天数 (不传则读取)
     * @returns {Object}
     * @private
     */
    _buildBadgeContext: function (totalPoints, currentStreak) {
      return {
        completedLevels: StorageManager.get('completed_levels_count', 0),
        totalStars: StorageManager.get('total_stars', 0),
        totalPoints: typeof totalPoints === 'number' ? totalPoints : this.getBalance(),
        currentStreak: typeof currentStreak === 'number' ? currentStreak : StorageManager.get('checkin_streak', 0),
        perfectClears: StorageManager.get('perfect_clears', 0),
        completedTypes: StorageManager.get('completed_types', [])
      };

    /**
     * 关卡完成时更新累计统计并检查徽章
     * 应由 LevelEngine.submitResult 在通关后调用
     * @param {Object} result - { levelId, passed, stars, accuracy, points }
     * @param {Array<Object>} [questions] - 本关题目列表 (用于统计题型)
     * @returns {Array<Object>} - 新解锁的徽章
     */
    onLevelCompleted: function (result, questions) {
      if (!result || !result.passed) return [];

      // 更新已完成关卡数 (取 max，避免重复通关重复计数)
      var completedLevels = StorageManager.get('completed_levels_count', 0);
      // 通过比较 ID 去重：存储已通关的 levelId 列表
      var completedLevelIds = StorageManager.get('completed_level_ids', []);
      if (completedLevelIds.indexOf(result.levelId) === -1) {
        completedLevelIds.push(result.levelId);
        StorageManager.set('completed_level_ids', completedLevelIds);
        completedLevels = completedLevelIds.length;
        StorageManager.set('completed_levels_count', completedLevels);
      }

      // 更新累计星星数 (取所有已通关关卡的当前星级之和)
      // 此处简化：累加本次星级 (LevelEngine 已保证 bestStars 取最大值，重复通关不会重复加星)
      // 更精确做法是遍历 user_progress 求和，但为避免异步，使用增量累加 + 去重
      var totalStars = StorageManager.get('total_stars', 0);
      var starredLevelIds = StorageManager.get('starred_level_ids', {});
      var prevStars = starredLevelIds[result.levelId] || 0;
      if (result.stars > prevStars) {
        totalStars += (result.stars - prevStars);
        starredLevelIds[result.levelId] = result.stars;
        StorageManager.set('total_stars', totalStars);
        StorageManager.set('starred_level_ids', starredLevelIds);
      }

      // 更新满分通关数 (accuracy === 1)
      if (result.accuracy === 1) {
        var perfectClears = StorageManager.get('perfect_clears', 0);
        var perfectLevelIds = StorageManager.get('perfect_level_ids', []);
        if (perfectLevelIds.indexOf(result.levelId) === -1) {
          perfectLevelIds.push(result.levelId);
          StorageManager.set('perfect_level_ids', perfectLevelIds);
          StorageManager.set('perfect_clears', perfectLevelIds.length);
        }
      }

      // 更新已练习题型
      if (questions && questions.length > 0) {
        var completedTypes = StorageManager.get('completed_types', []);
        questions.forEach(function (q) {
          if (q.type && completedTypes.indexOf(q.type) === -1) {
            completedTypes.push(q.type);
          }
        });
        StorageManager.set('completed_types', completedTypes);
      }

      // 检查徽章
      var newlyEarned = this.checkBadges(this._buildBadgeContext());

      // 发射徽章解锁事件
      if (newlyEarned.length > 0) {
        EventBus.emit('reward:badgesUnlocked', newlyEarned);
      }

      return newlyEarned;
    },

    /**

     * @param {string} type - 'earn' | 'spend'
     * @param {string} source - 来源/用途
     * @param {number} amount - 金额
     * @param {number} balance - 交易后余额

    _recordTransaction: function (type, source, amount, balance) {
      var history = StorageManager.get('reward_history', []);
      if (!Array.isArray(history)) history = [];

      history.push({
        type: type,
        source: source,
        amount: amount,
        balance: balance,
        timestamp: new Date().toISOString()
      });

      // 只保留最近 200 条
      if (history.length > 200) {
        history = history.slice(-200);
      }

      StorageManager.set('reward_history', history);
    }

/**
 * 奇幻英语闯关 - 自适应引擎
 * @module adaptiveEngine
 * @description 根据答题表现动态调整难度，识别薄弱知识点，推荐针对性练习
 */
(function (window) {
  'use strict';

  var IDB = window.IDB;
  var EventBus = window.EventBus;
  var EA_CONFIG = window.EA_CONFIG;
  var Helpers = window.Helpers;
  var StorageManager = window.StorageManager;

  /** 加权正确率权重 (最近 5 条记录，从新到旧) */
  var WEIGHTS = [0.35, 0.25, 0.2, 0.12, 0.08];

  /** 难度上调阈值 */
  var INCREASE_THRESHOLD = 0.8;
  /** 难度下调阈值 */
  var DECREASE_THRESHOLD = 0.5;

  /**
   * Fisher-Yates 洗牌 (返回新数组)
   * @param {Array} arr
   * @returns {Array}
   */
  function shuffle(arr) {
    if (Helpers && typeof Helpers.shuffleArray === 'function') {
      var result = Helpers.shuffleArray(arr);
      if (Array.isArray(result)) return result;
    }
    var copy = arr.slice();
    for (var i = copy.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = copy[i];
      copy[i] = copy[j];
      copy[j] = tmp;
    }
    return copy;
  }

  /**
   * @namespace AdaptiveEngine
   */
  var AdaptiveEngine = {
    /**
     * 评估用户当前难度等级
     * @returns {Promise<Object>} - { currentLevel, trend, recentAccuracy, recommendation, recordsAnalyzed, difficultyChanged }
     */
    evaluateDifficulty: function () {

      return IDB.getAll('learning_records')
        .then(function (records) {
          // 按创建时间倒序排列，取最近 5 条
          records.sort(function (a, b) {
            var ta = a.createdAt ? new Date(a.createdAt).getTime() : 0;
            var tb = b.createdAt ? new Date(b.createdAt).getTime() : 0;
            return tb - ta;
          });
          var recent = records.slice(0, 5);

          // 不足 3 条记录，返回默认值
          if (recent.length < 3) {
            return {
              currentLevel: 2,
              trend: 'stable',
              recentAccuracy: 0,
              recommendation: 'maintain',
              recordsAnalyzed: recent.length,
              difficultyChanged: false
            };
          }

          // 计算加权正确率
          var weightedSum = 0;
          var weightSum = 0;
          for (var i = 0; i < recent.length; i++) {
            var w = WEIGHTS[i] || 0;
            var acc = typeof recent[i].accuracy === 'number' ? recent[i].accuracy : 0;
            weightedSum += acc * w;
            weightSum += w;
          }
          var weightedAccuracy = weightSum > 0 ? weightedSum / weightSum : 0;

          // 读取当前难度调整状态
          var adjustments = StorageManager.get('difficulty_adjustments', {
            level: 2,
            lastDirection: 'stable',
            debounceCount: 0
          });

          // 确定新方向
          var newDirection;
          if (weightedAccuracy > INCREASE_THRESHOLD) {
            newDirection = 'up';
          } else if (weightedAccuracy < DECREASE_THRESHOLD) {
            newDirection = 'down';
          } else {
            newDirection = 'stable';
          }

          // 防抖检查
          var shouldChange = false;
          if (newDirection === adjustments.lastDirection && newDirection !== 'stable') {
            adjustments.debounceCount = (adjustments.debounceCount || 0) + 1;
            if (adjustments.debounceCount >= EA_CONFIG.DIFFICULTY_DEBOUNCE) {
              shouldChange = true;
              adjustments.debounceCount = 0;
            }
          } else {
            adjustments.debounceCount = newDirection === 'stable' ? 0 : 1;
          }

          // 应用难度变化
          var difficultyChanged = false;
          if (shouldChange) {
            if (newDirection === 'up') {
              adjustments.level = Math.min(5, (adjustments.level || 2) + 1);
              difficultyChanged = true;
            } else if (newDirection === 'down') {
              adjustments.level = Math.max(1, (adjustments.level || 2) - 1);
              difficultyChanged = true;
            }
          }

          adjustments.lastDirection = newDirection;
          StorageManager.set('difficulty_adjustments', adjustments);

          if (difficultyChanged) {
            EventBus.emit('adaptive:difficultyChanged', {
              oldLevel: adjustments.level - (newDirection === 'up' ? 1 : -1),
              newLevel: adjustments.level,
              direction: newDirection,
              accuracy: weightedAccuracy
            });
          }

          var recommendation;
          if (newDirection === 'up') {
            recommendation = shouldChange ? 'increased' : 'increase';
          } else if (newDirection === 'down') {
            recommendation = shouldChange ? 'decreased' : 'decrease';
          } else {
            recommendation = 'maintain';
          }

          return {
            currentLevel: adjustments.level,
            trend: newDirection,
            recentAccuracy: weightedAccuracy,
            recommendation: recommendation,
            recordsAnalyzed: recent.length,
            difficultyChanged: difficultyChanged
          };
        })
        .catch(function (err) {
          console.error('[AdaptiveEngine] evaluateDifficulty failed:', err);
          return {
            currentLevel: 2,
            trend: 'stable',
            recentAccuracy: 0,
            recommendation: 'maintain',
            recordsAnalyzed: 0,
            difficultyChanged: false
          };
        });
    },

    /**
     * 获取用户的薄弱知识点
     * @returns {Promise<Array<Object>>} - [{ knowledgePoint, errorRate, wrongCount, totalCount }]
     */
    getWeakPoints: function () {
      return IDB.getAll('wrong_questions')
        .then(function (wrongRecords) {
          return IDB.getAll('questions').then(function (allQuestions) {
            // 统计每个知识点的题目总数
            var totalByKP = {};
            allQuestions.forEach(function (q) {
              var kp = q.knowledgePoint;
              if (kp) {
                totalByKP[kp] = (totalByKP[kp] || 0) + 1;
              }
            });

            // 按知识点分组错题 (去重 questionId)
            var wrongByKP = {};
            wrongRecords.forEach(function (r) {
              var kp = r.knowledgePoint;
              if (!kp) return;
              if (!wrongByKP[kp]) {
                wrongByKP[kp] = { count: 0, questionIds: {} };
              }
              wrongByKP[kp].count++;
              if (r.questionId) {
                wrongByKP[kp].questionIds[r.questionId] = true;
              }
            });

            // 计算错误率并筛选
            var weakPoints = [];
            Object.keys(wrongByKP).forEach(function (kp) {
              var data = wrongByKP[kp];
              var uniqueWrong = Object.keys(data.questionIds).length;
              var totalCount = totalByKP[kp] || uniqueWrong;
              var errorRate = totalCount > 0 ? Math.min(1, uniqueWrong / totalCount) : 0;

              if (errorRate > EA_CONFIG.WEAK_POINT_THRESHOLD) {
                weakPoints.push({
                  knowledgePoint: kp,
                  errorRate: errorRate,
                  wrongCount: uniqueWrong,
                  totalCount: totalCount
                });
              }
            });

            // 按错误率降序排列
            weakPoints.sort(function (a, b) {
              return b.errorRate - a.errorRate;
            });

            return weakPoints;
          });
        })
        .catch(function (err) {
          console.error('[AdaptiveEngine] getWeakPoints failed:', err);
          return [];
        });
    },

    /**
     * 推荐针对性练习题
     * @param {number} [count=5] - 推荐数量
     * @returns {Promise<Array<Object>>}
     */
    recommendQuestions: function (count) {
      count = count || 5;
      var self = this;

      return self.getWeakPoints()
        .then(function (weakPoints) {
          if (!weakPoints || weakPoints.length === 0) {
            // 无薄弱知识点，返回随机题目
            return IDB.getAll('questions').then(function (allQuestions) {
              return shuffle(allQuestions).slice(0, count);
            });
          }

          // 取前 3 个薄弱知识点
          var topWeakPoints = weakPoints.slice(0, 3);
          var promises = topWeakPoints.map(function (wp) {
            return IDB.getByIndex('questions', 'knowledgePoint', wp.knowledgePoint)
              .then(function (questions) {
                return questions;
              });
          });

          return Promise.all(promises).then(function (results) {
            // 合并所有题目
            var allCandidates = [];
            results.forEach(function (qs) {
              allCandidates = allCandidates.concat(qs);
            });

            // 优先选择未答错的题目 (不在 wrong_questions 中的)
            return IDB.getAll('wrong_questions').then(function (wrongRecords) {
              var wrongIds = {};
              wrongRecords.forEach(function (r) {
                if (r.questionId) wrongIds[r.questionId] = true;
              });

              // 分离未答错和已答错的题目
              var unseen = allCandidates.filter(function (q) {
                return !wrongIds[q.id];
              });
              var seen = allCandidates.filter(function (q) {
                return wrongIds[q.id];
              });

              // 优先未答错的，不足时补充已答错的
              var pool = unseen.concat(seen);

              // 洗牌并截取
              var shuffled = shuffle(pool);
              return shuffled.slice(0, count);
            });
          });
        })
        .catch(function (err) {
          console.error('[AdaptiveEngine] recommendQuestions failed:', err);
          return [];
        });
    },

    /**
     * 记录错题
     * @param {string} questionId - 题目 ID
     * @param {*} userAnswer - 用户答案
     * @param {*} correctAnswer - 正确答案
     * @returns {Promise<void>}
     */
    recordWrongAnswer: function (questionId, userAnswer, correctAnswer) {
      if (!questionId) {
        return Promise.reject(new Error('questionId is required'));
      }

      // 获取题目以得到知识点
      return IDB.get('questions', questionId)
        .then(function (question) {
          var knowledgePoint = question ? question.knowledgePoint : 'unknown';

          var record = {
            questionId: questionId,
            userAnswer: userAnswer,
            correctAnswer: correctAnswer,
            knowledgePoint: knowledgePoint,
            createdAt: new Date().toISOString()
          };

          return IDB.add('wrong_questions', record);
        })
        .then(function () {
          EventBus.emit('adaptive:wrongAnswerRecorded', {
            questionId: questionId,
            userAnswer: userAnswer,
            correctAnswer: correctAnswer
          });
        })
        .catch(function (err) {
          console.error('[AdaptiveEngine] recordWrongAnswer failed:', err);
          throw err;
        });

  };

  window.AdaptiveEngine = AdaptiveEngine;
})(window);

/**
 * 奇幻英语闯关 - 导入导出引擎
 * @module importExport
 * @description 支持 JSON/CSV/文本格式的题目数据导入导出
 */
(function (window) {
  'use strict';

  var IDB = window.IDB;
  var StorageManager = window.StorageManager;
  var EventBus = window.EventBus;
  var Validator = window.Validator;

  var ALL_STORES = ['levels', 'questions', 'user_progress', 'learning_records', 'wrong_questions'];

  /* ------------------------------------------------------------------ *
   * 内联工具函数
   * ------------------------------------------------------------------ */

  /**
   * 生成 UUID (优先使用 Helpers，否则使用 crypto 回退)
   * @returns {string}
   */
  function generateUUID() {
    var Helpers = window.Helpers;
    if (Helpers && typeof Helpers.generateUUID === 'function') {
      var uuid = Helpers.generateUUID();
      if (typeof uuid === 'string' && uuid.length > 0) return uuid;
    }
    if (window.crypto && typeof window.crypto.randomUUID === 'function') {
      return window.crypto.randomUUID();
    }
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = Math.random() * 16 | 0;
      var v = c === 'x' ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
  }

  /**
   * 读取文件为文本
   * @param {File} file
   * @returns {Promise<string>}
   */
  function readFileAsText(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function (e) { resolve(e.target.result); };
      reader.onerror = function (e) { reject(new Error('Failed to read file: ' + (e.target.error || 'unknown'))); };
      reader.readAsText(file);
    });
  }

  /**
   * 验证导入数据结构 (内联实现，不依赖 Validator 的具体方法)
   * @param {*} data
   * @returns {{ valid: boolean, errors: Array<string> }}
   */
  function validateImportData(data) {
    var errors = [];

    if (data === null || data === undefined) {
      return { valid: false, errors: ['Data is null or undefined'] };
    }

    if (typeof data !== 'object' || Array.isArray(data)) {
      return { valid: false, errors: ['Data must be an object'] };
    }

    // 支持两种格式:
    // 1. { levels: [...], questions: [...] }
    // 2. { levels: [{ id, name, questions: [...] }] } (关卡内嵌题目)
    if (!data.levels && !data.questions) {
      errors.push('Data must contain "levels" or "questions" field');
      return { valid: false, errors: errors };
    }

    // 验证 levels
    if (data.levels) {
      if (!Array.isArray(data.levels)) {
        errors.push('"levels" must be an array');
      } else {
        data.levels.forEach(function (level, idx) {
          if (!level || typeof level !== 'object') {
            errors.push('Level at index ' + idx + ' is not a valid object');
          } else if (!level.id && !level.name) {
            errors.push('Level at index ' + idx + ' must have "id" or "name"');
          }
        });
      }
    }

    // 验证 questions
    if (data.questions) {
      if (!Array.isArray(data.questions)) {
        errors.push('"questions" must be an array');
      } else {
        data.questions.forEach(function (q, idx) {
          if (!q || typeof q !== 'object') {
            errors.push('Question at index ' + idx + ' is not a valid object');
          } else if (!q.english && !q.question) {
            errors.push('Question at index ' + idx + ' must have "english" or "question" field');
          }
        });
      }
    }

    return { valid: errors.length === 0, errors: errors };
  }

  /**
   * 解析 CSV 文本为对象数组 (内联实现，不依赖 CSVParser)
   * @param {string} text
   * @returns {Array<Object>}
   */
  function parseCSV(text) {
    // 优先使用 CSVParser
    if (CSVParser && typeof CSVParser.parseCSV === 'function') {
      var result = CSVParser.parseCSV(text);
      if (Array.isArray(result) && result.length > 0) return result;
    }

    // 内联 CSV 解析
    var lines = text.split(/\r\n|\n|\r/).filter(function (l) { return l.trim().length > 0; });
    if (lines.length === 0) return [];

    var headers = parseCSVLine(lines[0]);
    var rows = [];
    for (var i = 1; i < lines.length; i++) {
      var values = parseCSVLine(lines[i]);
      var row = {};
      headers.forEach(function (h, idx) {
        row[h] = values[idx] !== undefined ? values[idx] : '';
      });
      rows.push(row);
    }
    return rows;
  }

  /**
   * 解析单行 CSV (支持引号包裹)
   * @param {string} line
   * @returns {Array<string>}
   */
  function parseCSVLine(line) {
    var result = [];
    var current = '';
    var inQuotes = false;
    for (var i = 0; i < line.length; i++) {
      var ch = line[i];
      if (ch === '"') {
        if (inQuotes && line[i + 1] === '"') {
          current += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (ch === ',' && !inQuotes) {
        result.push(current.trim());
        current = '';
      } else {
        current += ch;
      }
    }
    result.push(current.trim());
    return result;
  }

  /* ------------------------------------------------------------------ *
   * 导入导出引擎
   * ------------------------------------------------------------------ */

  /**
   * @namespace ImportExport
   */
  var ImportExport = {
    /**
     * 从 JSON 文件导入题目
     * @param {File} file - JSON 文件对象
     * @returns {Promise<{ success: boolean, count: number, errors: Array<string> }>}
     */
    importJSON: function (file) {
      var self = this;
      if (!file) {
        return Promise.resolve({ success: false, count: 0, errors: ['No file provided'] });
      }

      return readFileAsText(file)
        .then(function (text) {
          return self.importText(text);
        })
        .catch(function (err) {
          console.error('[ImportExport] importJSON failed:', err);
          return { success: false, count: 0, errors: [err.message] };
        });
    },

    /**
     * 从 CSV 文件导入题目
     * @param {File} file - CSV 文件对象
     * @returns {Promise<{ success: boolean, count: number, errors: Array<string> }>}
     */
    importCSV: function (file) {
      var self = this;
      if (!file) {
        return Promise.resolve({ success: false, count: 0, errors: ['No file provided'] });
      }

      return readFileAsText(file)
        .then(function (text) {
          var rows = parseCSV(text);
          if (rows.length === 0) {
            return { success: false, count: 0, errors: ['CSV file is empty'] };
          }

          // 验证表头 (需要 english, chinese)
          var headers = Object.keys(rows[0]);
          var hasEnglish = headers.indexOf('english') !== -1;
          var hasChinese = headers.indexOf('chinese') !== -1;

          if (!hasEnglish || !hasChinese) {
            var missing = [];
            if (!hasEnglish) missing.push('english');
            if (!hasChinese) missing.push('chinese');
            return {
              success: false,
              count: 0,
              errors: ['Missing required headers: ' + missing.join(', ')]
            };
          }

          // 每 10 行分组为一个关卡
          var levels = [];
          var questions = [];
          var levelCount = 1;

          for (var i = 0; i < rows.length; i++) {
            var groupIdx = Math.floor(i / 10);
            if (groupIdx >= levelCount - 1) {
              var levelId = 'csv-' + (groupIdx + 1);
              levels.push({
                id: levelId,
                name: '导入关卡 ' + (groupIdx + 1),
                nameEn: 'Imported Level ' + (groupIdx + 1),
                stage: 'imported',
                difficulty: 2,
                questionCount: 10,
                knowledgePoints: [rows[i].knowledge_point || 'imported']
              });
              levelCount = groupIdx + 2;
            }

            var row = rows[i];
            var qLevelId = 'csv-' + (groupIdx + 1);
            var qId = 'csv-' + (groupIdx + 1) + '-' + (i % 10 + 1);

            var question = {
              id: qId,
              type: row.type || 'word_match',
              levelId: qLevelId,
              english: row.english,
              chinese: row.chinese,
              difficulty: parseInt(row.difficulty, 10) || 2,
              knowledgePoint: row.knowledge_point || 'imported'
            };

            if (row.hint) {
              question.hint = row.hint;
            }
            if (row.options) {
              question.options = row.options.split('|');
            }
            if (row.correct !== undefined && row.correct !== '') {
              var correctVal = parseInt(row.correct, 10);
              question.correct = isNaN(correctVal) ? row.correct : correctVal;
            }

            questions.push(question);
          }

          return self._writeToIDB(levels, questions);
        })
        .catch(function (err) {
          console.error('[ImportExport] importCSV failed:', err);
          return { success: false, count: 0, errors: [err.message] };
        });
    },

    /**
     * 从纯文本 (JSON 格式) 导入题目
     * @param {string} text - JSON 文本
     * @returns {Promise<{ success: boolean, count: number, errors: Array<string> }>}
     */
    importText: function (text) {
      var self = this;
      if (!text || typeof text !== 'string') {
        return Promise.resolve({ success: false, count: 0, errors: ['No text provided'] });
      }

      var data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        return Promise.resolve({
          success: false,
          count: 0,
          errors: ['Invalid JSON: ' + e.message]
        });
      }

      // 验证数据
      var validation = validateImportData(data);
      if (!validation.valid) {
        return Promise.resolve({
          success: false,
          count: 0,
          errors: validation.errors
        });
      }

      // 也尝试使用 Validator (如果可用)
      if (Validator && typeof Validator.validateImportData === 'function') {
        // 直接使用原始数据校验，不自动补充 version（让 MISSING_VERSION 错误能正确触发）
        var extValidation = Validator.validateImportData(data);
        if (extValidation && !extValidation.valid) {
          return Promise.resolve({
            success: false,
            count: 0,
            errors: extValidation.errors || validation.errors
          });
        }
      }

      // 提取 levels 和 questions
      var levels = data.levels || [];
      var questions = data.questions || [];

      // 处理内嵌格式: levels[].questions
      if (questions.length === 0 && levels.length > 0) {
        var extractedQuestions = [];
        levels.forEach(function (level) {
          if (level.questions && Array.isArray(level.questions)) {
            level.questions.forEach(function (q, idx) {
              var question = Object.assign({}, q);
              if (!question.id) {
                question.id = (level.id || 'level') + '-' + (idx + 1);
              }
              question.levelId = level.id;
              extractedQuestions.push(question);
            });
            delete level.questions; // 不存储内嵌题目到 levels store
          }
        });
        questions = extractedQuestions;
      }

      // 恢复 localStorage 数据（与 exportData 对称）
      if (data.localStorage && typeof data.localStorage === 'object') {
        var ls = data.localStorage;
        var lsKeys = [
          'reward_balance', 'earned_badges', 'checkin_last_date', 'checkin_streak',
          'checkin_history', 'reward_history', 'user_profile', 'difficulty_adjustments',
          'completed_types', 'completed_levels_count', 'completed_level_ids',
          'total_stars', 'starred_level_ids', 'perfect_clears', 'perfect_level_ids',
          'level_results_cache'
        ];
        lsKeys.forEach(function (key) {
          if (ls[key] !== undefined && ls[key] !== null) {
            StorageManager.set(key, ls[key]);
          }
        });
        // 剧情系统数据（通过 StorageManager 统一存储）
        if (ls.storyline_selected !== undefined && ls.storyline_selected !== null) {
          StorageManager.set('storyline_selected', ls.storyline_selected);
        }
        if (ls.story_collectibles !== undefined && ls.story_collectibles !== null) {
          StorageManager.set('story_collectibles', ls.story_collectibles);
        }
        // 背景音乐偏好（v1.3.2 新增）
        if (ls.audio_enabled !== undefined && ls.audio_enabled !== null) {
          StorageManager.set('audio_enabled', ls.audio_enabled);
        }
        if (ls.audio_volume !== undefined && ls.audio_volume !== null) {
          StorageManager.set('audio_volume', ls.audio_volume);
        }
        if (ls.audio_theme !== undefined && ls.audio_theme !== null) {
          StorageManager.set('audio_theme', ls.audio_theme);
        }
      }

      return self._writeToIDB(levels, questions);
    },

    /**
     * 导出所有数据
     * @returns {Promise<Object>} - 扁平结构：{ version, exportedAt, levels, questions, ..., localStorage }
     */
    exportData: function () {
      var self = this;

      // 并行获取所有 IDB store 数据
      var idbPromises = ALL_STORES.map(function (storeName) {
        return IDB.getAll(storeName).then(function (data) {
          return { store: storeName, data: data || [] };
        });
      });

      return Promise.all(idbPromises)
        .then(function (results) {

          var exported = {
            version: window.EA_CONFIG ? window.EA_CONFIG.APP_VERSION : '1.0.0',
            exportedAt: new Date().toISOString()
          };

          // IDB 数据 - 直接放在顶层

            exported[item.store] = item.data;
          });

          exported.localStorage = {
            reward_balance: StorageManager.get('reward_balance', 0),
            earned_badges: StorageManager.get('earned_badges', []),
            checkin_last_date: StorageManager.get('checkin_last_date', null),
            checkin_streak: StorageManager.get('checkin_streak', 0),
            checkin_history: StorageManager.get('checkin_history', []),
            reward_history: StorageManager.get('reward_history', []),
            user_profile: StorageManager.get('user_profile', null),
            difficulty_adjustments: StorageManager.get('difficulty_adjustments', null),
            completed_types: StorageManager.get('completed_types', []),
            // 徽章累计统计 (v1.1 新增)
            completed_levels_count: StorageManager.get('completed_levels_count', 0),
            completed_level_ids: StorageManager.get('completed_level_ids', []),

            storyline_selected: StorageManager.get('storyline_selected', null),
            story_collectibles: StorageManager.get('story_collectibles', []),
            // 背景音乐偏好 (v1.3.2 新增)
            audio_enabled: StorageManager.get('audio_enabled', false),
            audio_volume: StorageManager.get('audio_volume', 0.3),
            audio_theme: StorageManager.get('audio_theme', 'default')
          };

          return exported;
        })
        .catch(function (err) {
          console.error('[ImportExport] exportData failed:', err);
          throw err;
        });
    },

    /**
     * 触发浏览器下载文件
     * @param {*} data - 要下载的数据 (对象会自动 JSON.stringify)
     * @param {string} filename - 文件名
     */
    downloadFile: function (data, filename) {
      var content;
      if (typeof data === 'string') {
        content = data;
      } else {
        content = JSON.stringify(data, null, 2);
      }

      var blob = new Blob([content], { type: 'application/json;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var link = document.createElement('a');
      link.href = url;
      link.download = filename || 'export.json';
      link.style.display = 'none';

      document.body.appendChild(link);
      link.click();

      // 清理
      setTimeout(function () {
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }, 100);
    },

    /**
     * 导出并下载备份文件
     * @returns {Promise<void>}
     */
    exportAndDownload: function () {
      var self = this;
      return self.exportData().then(function (data) {
        var date = new Date().toISOString().slice(0, 10);
        var filename = 'english-adventure-backup-' + date + '.json';
        self.downloadFile(data, filename);
      });
    },

    /**
     * 清除所有用户数据并重置到初始状态
     * 清空 IDB + localStorage 后，重新初始化预设题目（含解锁第一关）
     * @returns {Promise<void>}
     */
    clearAllData: function () {
      var clearPromises = ALL_STORES.map(function (storeName) {
        return IDB.clear(storeName).catch(function () {
          // 单个 store 清空失败不阻断
        });
      });

      return Promise.all(clearPromises)
        .then(function () {
          StorageManager.clearAll();
          EventBus.emit('data:cleared');
          console.log('[ImportExport] All user data cleared, reinitializing preset data...');

          // 重新初始化预设题目（内部会清空 levels/questions/user_progress 并解锁第一关）
          var QuestionBank = window.QuestionBank;
          if (QuestionBank && typeof QuestionBank.initPresetQuestions === 'function') {
            return QuestionBank.initPresetQuestions();
          }
          return null;
        })
        .then(function () {
          console.log('[ImportExport] Reset complete, preset data restored');
        })
        .catch(function (err) {
          console.error('[ImportExport] clearAllData failed:', err);
          throw err;
        });
    },

    /**
     * 将 levels 和 questions 写入 IDB (使用 put 支持覆盖导入)
     * @param {Array} levels
     * @param {Array} questions
     * @returns {Promise<{ success: boolean, count: number, errors: Array<string> }>}
     * @private
     */
    _writeToIDB: function (levels, questions) {
      var errors = [];
      var levelCount = 0;
      var questionCount = 0;

      // 写入 levels (update 内部用 put，支持覆盖，适合重复导入/恢复备份)
      var levelPromises = (levels || []).map(function (level) {
        return IDB.update('levels', level)
          .then(function () { levelCount++; })
          .catch(function (err) {
            errors.push('Failed to add level "' + (level.id || 'unknown') + '": ' + err.message);
          });
      });

      // 写入 questions
      var questionPromises = (questions || []).map(function (q) {
        return IDB.update('questions', q)
          .then(function () { questionCount++; })
          .catch(function (err) {
            errors.push('Failed to add question "' + (q.id || 'unknown') + '": ' + err.message);
          });
      });

      return Promise.all(levelPromises.concat(questionPromises))
        .then(function () {
          EventBus.emit('data:imported', {
            levels: levelCount,
            questions: questionCount
          });
          return {
            success: questionCount > 0 || levelCount > 0,
            count: questionCount,
            errors: errors
          };
        })
        .catch(function (err) {
          console.error('[ImportExport] _writeToIDB failed:', err);
          return {
            success: false,
            count: 0,
            errors: [err.message]
          };
        });
    }
  };

  window.ImportExport = ImportExport;
})(window);

/**
 * 奇幻英语闯关 - 剧情引擎
 * @module storyEngine
 * @description 管理剧情选择、进度和展示，数据存储在 localStorage
 */
(function (window) {
  'use strict';

  // StorageManager 会自动加 ea_ 前缀，这里使用不带前缀的键名
  var STORAGE_KEY = 'storyline_selected';
  var COLLECTIBLES_KEY = 'story_collectibles';

  /**
   * @namespace StoryEngine
   */
  var StoryEngine = {
    /**
     * 获取所有剧情线
     * @returns {Array}
     */
    getStorylines: function () {
      return window.STORYLINES || [];
    },

    /**
     * 获取当前选中的剧情线
     * @returns {Object|null}
     */
    getCurrentStoryline: function () {
      var selectedId = this._getSelectedId();
      if (!selectedId) return null;
      var storylines = this.getStorylines();
      for (var i = 0; i < storylines.length; i++) {
        if (storylines[i].id === selectedId) {
          return storylines[i];
        }
      }
      return null;
    },

    /**
     * 选择剧情线
     * @param {string} storylineId - 剧情线 ID
     * @returns {boolean} 是否成功
     */
    selectStoryline: function (storylineId) {
      var storylines = this.getStorylines();
      var found = false;
      for (var i = 0; i < storylines.length; i++) {
        if (storylines[i].id === storylineId) {
          found = true;
          break;
        }
      }
      if (!found) return false;

      try {
        StorageManager.set(STORAGE_KEY, storylineId);
      } catch (e) {
        return false;
      }

      if (window.EventBus) {
        EventBus.emit('storyline:selected', { id: storylineId });
      }
      return true;
    },

    /**
     * 获取指定关卡的剧情节点
     * @param {number} levelIndex - 关卡索引（0-47）
     * @returns {Object|null}
     */
    getStoryNode: function (levelIndex) {
      var storyline = this.getCurrentStoryline();

      if (question.type === 'word_match') {
        // 单词匹配：看英文选中文释义（英文是学习主体，应作为题目）
        questionText = question.english || question.chinese || '';
      } else if (question.type === 'grammar_choice') {
        // 语法选择：显示英文填空句
        questionText = question.english || question.chinese || '';
      } else if (question.type === 'listening') {

        questionText = '请听音频后选择正确答案';
      } else if (question.type === 'spelling') {

/**
 * 奇幻英语闯关 - ProgressBar 组件
 * @module progressBar
 * @description 进度条组件，支持百分比显示和动画
 */
(function (window) {
  'use strict';

  /**
   * 计算百分比
   * @param {number} current
   * @param {number} total
   * @returns {number} 0-100
   */
  function calcPercent(current, total) {
    var c = Number(current) || 0;
    var t = Number(total) || 0;
    if (t <= 0) return 0;
    var pct = (c / t) * 100;
    if (pct < 0) pct = 0;
    if (pct > 100) pct = 100;
    return pct;
  }

  /**
   * @namespace ProgressBar
   */
  var ProgressBar = {
    /**
     * 创建进度条元素
     * @param {Object} options - 配置
     * @param {number} [options.current=0] - 当前进度
     * @param {number} [options.total=100] - 总量
     * @param {string} [options.label] - 进度文本标签
     * @returns {HTMLDivElement} 包含 update 方法的进度条元素
     */
    create: function (options) {
      options = options || {};
      var current = options.current !== undefined ? options.current : 0;
      var total = options.total !== undefined ? options.total : 100;
      var label = options.label || '';

      var container = document.createElement('div');
      container.className = 'progress-container';

      // 进度文本
      var textEl = document.createElement('div');
      textEl.className = 'progress-text';
      container.appendChild(textEl);

      // 进度条轨道
      var bar = document.createElement('div');
      bar.className = 'progress-bar';

      // 进度条填充
      var fill = document.createElement('div');
      fill.className = 'progress-bar-fill';
      bar.appendChild(fill);

      container.appendChild(bar);

      /**
       * 更新进度
       * @param {number} newCurrent - 当前进度
       * @param {number} [newTotal] - 总量
       */
      container.update = function (newCurrent, newTotal) {
        if (newTotal !== undefined) {
          total = newTotal;
        }
        current = newCurrent;
        var pct = calcPercent(current, total);
        fill.style.width = pct + '%';

        if (label) {
          textEl.textContent = label + '：' + current + ' / ' + total;
        } else {
          textEl.textContent = current + ' / ' + total;
        }
      };

      // 初始化显示
      container.update(current, total);

      return container;
    },
  };

  window.ProgressBar = ProgressBar;
})(window);

/**
 * 奇幻英语闯关 - 关卡地图页
 * @module levelMap
 * @description 关卡地图：展示所有关卡节点，支持按阶段分组浏览
 */
(function (window) {
  'use strict';

  /** 阶段中文名映射（优先使用全局配置） */
  var STAGE_NAMES = (window.EA_CONFIG && window.EA_CONFIG.STAGE_NAMES)
    ? window.EA_CONFIG.STAGE_NAMES
    : {
      grade1a: '一年级上册', grade1b: '一年级下册',
      grade2a: '二年级上册', grade2b: '二年级下册',
      grade3a: '三年级上册', grade3b: '三年级下册',
      grade4a: '四年级上册', grade4b: '四年级下册',
      grade5a: '五年级上册', grade5b: '五年级下册',
      grade6a: '六年级上册', grade6b: '六年级下册',
      primary_review: '小升初综合'
    };

  /** 阶段渲染顺序（优先使用全局配置） */
  var STAGE_ORDER = (window.EA_CONFIG && window.EA_CONFIG.STAGE_ORDER)
    ? window.EA_CONFIG.STAGE_ORDER
    : [
      'grade1a', 'grade1b', 'grade2a', 'grade2b',
      'grade3a', 'grade3b', 'grade4a', 'grade4b',
      'grade5a', 'grade5b', 'grade6a', 'grade6b',
      'primary_review'
    ];

  /**
   * 创建关卡节点点击回调
   * @param {Object} level - 关卡数据
   */
  function handleLevelClick(level) {
    if (level.status === 'locked') {
      Toast.warning('该关卡尚未解锁');
      return;
    }
    Router.navigate('#/play?level=' + encodeURIComponent(level.id));
  }

  /**
   * 渲染单个阶段区块
   * @param {string} stage - 阶段标识
   * @param {Array<Object>} levels - 该阶段的关卡列表
   * @returns {DocumentFragment}
   */
  function renderStageSection(stage, levels) {
    var frag = document.createDocumentFragment();

    frag.appendChild(Renderer.createElement('h3', 'stats-section-title',
      STAGE_NAMES[stage] || stage));

    var grid = Renderer.createDiv('level-grid');
    levels.forEach(function (level) {
      var node = LevelNode.create(level, {
        onClick: function (lvl) { handleLevelClick(lvl); }
      });
      grid.appendChild(node);
    });
    frag.appendChild(grid);

    return frag;
  }

  /**
   * @namespace LevelMapPage
   */
  var LevelMapPage = {
    /**
     * 渲染关卡地图
     * @param {HTMLElement} container - 页面容器
     */
    render: function (container) {
      if (!container) return;
      Renderer.clearContainer(container);

      var page = Renderer.createDiv('level-map');
      container.appendChild(page);

      // 标题
      var header = Renderer.createDiv('page-header');
      header.appendChild(Renderer.createElement('h1', 'page-title', '关卡地图'));
      page.appendChild(header);

      // 剧情进度
      if (window.StoryEngine && StoryEngine.hasSelected()) {
        var storyline = StoryEngine.getCurrentStoryline();
        if (storyline) {
          var storyProgress = StoryEngine.getProgress();
          var storyProgressDiv = Renderer.createDiv('play-story-progress');
          storyProgressDiv.style.marginBottom = 'var(--spacing-md)';
          storyProgressDiv.style.textAlign = 'left';
          storyProgressDiv.style.padding = '0';
          storyProgressDiv.textContent = (storyline.icon || '') + ' ' + storyline.name +
            ' · 剧情进度：' + storyProgress.completed + ' / ' + storyProgress.total +
            ' 章（' + storyProgress.percentage + '%）';
          page.appendChild(storyProgressDiv);
        }
      }

      // 加载中
      var loading = Renderer.createElement('div', 'text-center text-muted mt-lg', '加载中...');
      page.appendChild(loading);

      LevelEngine.getLevels().then(function (levels) {
        Renderer.clearContainer(page);
        page.appendChild(header);

        if (!levels || levels.length === 0) {
          page.appendChild(Renderer.createElement('div', 'text-center text-muted mt-lg',
            '暂无关卡数据，请先导入题库'));
          return;
        }

        // 顶部总进度条
        LevelEngine.getProgress().then(function (progress) {
          var pb = ProgressBar.create({
            current: progress.completedLevels,
            total: progress.totalLevels,
            label: '总进度'
          });
          page.insertBefore(pb, header.nextSibling);
        });

        // 如果已选剧情，为每个关卡附加剧情章节信息
        var storyNodesMap = {};
        if (window.StoryEngine && StoryEngine.hasSelected()) {
          var storyline = StoryEngine.getCurrentStoryline();
          if (storyline && storyline.nodes) {
            storyline.nodes.forEach(function (node) {
              if (node.levelIndex !== undefined) {
                storyNodesMap[node.levelIndex] = node;
              }
            });
          }
        }

        // 按阶段分组
        var byStage = {};
        levels.forEach(function (level, idx) {
          var stage = level.stage || 'other';
          if (!byStage[stage]) byStage[stage] = [];
          // 附加剧情章节信息
          var levelIndex = idx;
          if (level.id) {
            var match = level.id.match(/preset-(\d+)/);
            if (match) levelIndex = parseInt(match[1], 10) - 1;
          }
          if (storyNodesMap[levelIndex]) {
            level._storyNode = storyNodesMap[levelIndex];
          }
          byStage[stage].push(level);
        });

        // 对每个阶段的关卡按 ID 数字排序，确保 preset-1 < preset-2 < ... < preset-10
        Object.keys(byStage).forEach(function (stage) {
          byStage[stage].sort(function (a, b) {
            var aMatch = a.id && a.id.match(/preset-(\d+)/);
            var bMatch = b.id && b.id.match(/preset-(\d+)/);
            if (aMatch && bMatch) {
              return parseInt(aMatch[1], 10) - parseInt(bMatch[1], 10);
            }
            return 0;
          });
        });

        // 按预设顺序渲染各阶段
        STAGE_ORDER.forEach(function (stage) {
          var stageLevels = byStage[stage];
          if (stageLevels && stageLevels.length > 0) {
            page.appendChild(renderStageSection(stage, stageLevels));
            delete byStage[stage];
          }
        });

        // 渲染其余未分类的阶段
        Object.keys(byStage).forEach(function (stage) {
          page.appendChild(renderStageSection(stage, byStage[stage]));
        });
      }).catch(function (err) {
        Renderer.clearContainer(page);
        page.appendChild(header);
        page.appendChild(Renderer.createElement('div', 'text-center text-error mt-lg',
          '加载关卡失败：' + (err && err.message ? err.message : '未知错误')));
      });
    },
  };

  Router.register('#/level-map', LevelMapPage.render);
  window.LevelMapPage = LevelMapPage;
})(window);

/**
 * 奇幻英语闯关 - 答题页
 * @module play
 * @description 答题/闯关页面：展示题目、计时、提交答案、进度指示
 */
(function (window) {
  'use strict';

  /**
   * 清理页面状态中所有待执行的定时器
   * @param {Object} state - 页面状态
   */
  function clearTimers(state) {
    if (state.timers && state.timers.length) {
      state.timers.forEach(function (t) { clearTimeout(t); });
      state.timers = [];
    }
  }

  /**
   * 注册定时器到页面状态，便于页面切换时统一清理
   * @param {Object} state - 页面状态
   * @param {number} timerId - setTimeout 返回的 ID
   */
  function addTimer(state, timerId) {
    if (!state.timers) state.timers = [];
    state.timers.push(timerId);
  }

  /**
   * 解析 hash 查询字符串
   * @param {string} hash - 如 '#/play?level=preset-1'
   * @returns {Object} - { level: 'preset-1' }
   */
  function parseHashQuery(hash) {
    var queryIndex = hash.indexOf('?');
    if (queryIndex < 0) return {};
    var queryString = hash.substring(queryIndex + 1);
    var params = {};
    var pairs = queryString.split('&');
    for (var i = 0; i < pairs.length; i++) {
      var pair = pairs[i].split('=');
      if (pair.length === 2) {
        params[decodeURIComponent(pair[0])] = decodeURIComponent(pair[1]);
      }
    }
    return params;
  }

  /**
   * 使用 Web Speech API 朗读文本
   * 不支持时静默忽略
   * @param {string} text - 要朗读的文本
   */
  function speak(text) {
    if (!text) return;
    if (!window.speechSynthesis || typeof SpeechSynthesisUtterance === 'undefined') return;
    try {
      // 取消正在播放的语音
      window.speechSynthesis.cancel();
      var utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.8;
      utterance.pitch = 1;
      window.speechSynthesis.speak(utterance);
    } catch (e) {
      // 不支持时忽略
    }
  }

  /**
   * 渲染当前题目到题目容器
   * @param {HTMLElement} questionContainer - 题目容器
   * @param {Object} state - 页面状态
   * @param {HTMLElement} page - 页面根元素
   */
  function renderQuestion(questionContainer, state, page) {
    Renderer.clearContainer(questionContainer);
    var question = state.questions[state.currentIndex];

    var questionCard = QuestionCard.create(question, {
      onSelect: function (index, q) {
        handleAnswer(index, q, state, page, questionContainer);
      },
      onPlayAudio: function (q) {
        var audioText = q.audioText || q.english || '';
        speak(audioText);
      }
    });
    questionContainer.appendChild(questionCard);

    // 更新进度文字和进度条（确保切题后进度同步）
    var progressText = page.querySelector('.play-progress-text');
    if (progressText) {
      progressText.textContent = '第 ' + (state.currentIndex + 1) + ' / ' + state.questions.length + ' 题';
    }
    var progressBar = page.querySelector('.progress-container');
    if (progressBar && progressBar.update) {
      progressBar.update(state.currentIndex, state.questions.length);
    }

    // 听力题自动播放音频
    if (question.type === 'listening') {
      var t = setTimeout(function () {
        var audioText = question.audioText || question.english || '';
        speak(audioText);
      }, 300);
      addTimer(state, t);
    }
  }

  /**
   * 处理选项选择
   * @param {number} selectedIndex - 用户选择的选项索引
   * @param {Object} question - 当前题目
   * @param {Object} state - 页面状态
   * @param {HTMLElement} page - 页面根元素
   * @param {HTMLElement} questionContainer - 题目容器
   */
  function handleAnswer(selectedIndex, question, state, page, questionContainer) {
    var correctIndex = question.correct;
    var isCorrect = selectedIndex === correctIndex;

    // 记录答题
    state.answers.push({
      questionId: question.id,
      selected: selectedIndex,
      correct: isCorrect
    });

    // 更新连击
    if (isCorrect) {
      state.combo++;
      if (state.combo > state.maxCombo) state.maxCombo = state.combo;
    } else {
      state.combo = 0;
      // 记录错题到自适应引擎
      if (window.AdaptiveEngine && question.id) {
        AdaptiveEngine.recordWrongAnswer(
          question.id,
          selectedIndex,
          correctIndex
        ).catch(function () { /* 忽略错题记录失败 */ });
      }
    }

    // 高亮正确/错误选项，禁用所有选项
    var options = questionContainer.querySelectorAll('.play-option');
    options.forEach(function (opt, idx) {
      opt.classList.remove('selected');
      opt.classList.add('disabled');
      if (idx === correctIndex) {
        opt.classList.add('correct');
      } else if (idx === selectedIndex && !isCorrect) {
        opt.classList.add('wrong');
      }
    });

    // 更新连击显示
    var comboEl = page.querySelector('.play-combo');
    if (comboEl) {
      if (state.combo >= 2) {
        comboEl.textContent = '🔥 连击 ' + state.combo + '！';
      } else {
        comboEl.textContent = '';
      }
    }

    // 向导反馈（答对/答错）
    if (window.StoryEngine) {
      var guide = StoryEngine.getGuide();
      if (guide) {
        var feedbackEl = page.querySelector('.play-guide-feedback');
        if (!feedbackEl) {
          feedbackEl = Renderer.createDiv('play-guide-feedback');
          var comboEl2 = page.querySelector('.play-combo');
          if (comboEl2 && comboEl2.nextSibling) {
            page.insertBefore(feedbackEl, comboEl2.nextSibling);
          } else {
            page.appendChild(feedbackEl);
          }
        }
        if (isCorrect) {
          feedbackEl.className = 'play-guide-feedback praise';
          feedbackEl.textContent = guide.emoji + ' ' + StoryEngine.getRandomPhrase('praise');
        } else {
          feedbackEl.className = 'play-guide-feedback comfort';
          feedbackEl.textContent = guide.emoji + ' ' + StoryEngine.getRandomPhrase('comfort');
        }
      }
    }

    // 更新进度条
    var progressBar = page.querySelector('.progress-container');
    if (progressBar && progressBar.update) {
      progressBar.update(state.currentIndex + 1, state.questions.length);
    }
    var progressText = page.querySelector('.play-progress-text');
    if (progressText) {
      progressText.textContent = '第 ' + (state.currentIndex + 1) + ' / ' + state.questions.length + ' 题';
    }

    // 延迟 1 秒后进入下一题
    var nextTimer = setTimeout(function () {
      state.currentIndex++;
      if (state.currentIndex >= state.questions.length) {
        finishLevel(state);
      } else {
        renderQuestion(questionContainer, state, page);
      }
    }, 1000);
    addTimer(state, nextTimer);
  }

  /**
   * 完成关卡：提交结果并跳转
   * @param {Object} state - 页面状态
   */
  function finishLevel(state) {
    var levelId = state.levelId;
    var answers = state.answers;
    var timeSpent = Math.round((Date.now() - state.startTime) / 1000);

    LevelEngine.submitResult(levelId, answers).then(function (result) {
      // 积分已在 LevelEngine.submitResult 内部通过 RewardEngine.earnPoints 发放，此处不再重复调用

      // 计算统计数据
      var correctCount = 0;
      answers.forEach(function (a) { if (a.correct) correctCount++; });
      var total = answers.length;
      var accuracy = total > 0 ? (correctCount / total) : 0;

      // 跳转结果页（携带完整统计参数）
      Router.navigate(
        '#/result?level=' + encodeURIComponent(levelId) +
        '&stars=' + result.stars +
        '&passed=' + (result.passed ? 1 : 0) +
        '&correct=' + correctCount +
        '&total=' + total +
        '&accuracy=' + accuracy.toFixed(2) +
        '&points=' + result.points +
        '&time=' + timeSpent
      );
    }).catch(function (err) {
      Toast.error('提交结果失败：' + (err && err.message ? err.message : '未知错误'));
      setTimeout(function () { Router.navigate('#/level-map'); }, 1500);
    });
  }

  /**
   * 渲染答题页主体

  }

  /**
   * @namespace PlayPage

  var PlayPage = {
    /**

      var params = parseHashQuery(hash);
      var levelId = params.level;

      // 提取关卡索引（用于剧情系统）
      var levelIndex = 0;
      var match = levelId ? String(levelId).match(/preset-(\d+)/) : null;
      if (match) {
        levelIndex = parseInt(match[1], 10) - 1;
      }

      if (!levelId) {
        container.appendChild(Renderer.createElement('div', 'page text-center text-muted mt-lg',
          '缺少关卡参数'));
        container.appendChild(Button.create({
          text: '返回地图', variant: 'primary', block: true,
          onClick: function () { Router.navigate('#/level-map'); }
        }));
        return;
      }

      var page = Renderer.createDiv('play-page');
      container.appendChild(page);

      // 加载中
      page.appendChild(Renderer.createElement('div', 'text-center text-muted mt-lg', '加载中...'));

      // 页面状态
      var state = {
        questions: [],
        currentIndex: 0,
        answers: [],
        combo: 0,
        maxCombo: 0,
        levelId: levelId,
        levelIndex: levelIndex,
        startTime: Date.now(),
        timers: [],  // 待执行的定时器，页面切换时清理
        active: true  // 页面活跃标志，防止异步回调操作已卸载的 DOM
      };

      // 注册页面卸载清理函数，避免定时器操作已卸载的 DOM
      if (window.Router) {
        Router.onCleanup(function () {
          state.active = false;  // 标记页面已卸载，异步回调将跳过渲染
          clearTimers(state);
          // 取消正在播放的语音
          if (window.speechSynthesis) {
            try { window.speechSynthesis.cancel(); } catch (e) { /* 忽略 */ }
          }
        });
      }

      LevelEngine.startLevel(levelId).then(function (questions) {
        // 如果页面已卸载（用户已导航到其他页面），跳过渲染
        if (!state.active) return;

        Renderer.clearContainer(page);
        state.questions = questions;

        if (!questions || questions.length === 0) {
          page.appendChild(Renderer.createElement('div', 'text-center text-muted mt-lg',
            '该关卡暂无题目'));
          page.appendChild(Button.create({
            text: '返回地图', variant: 'primary', block: true,
            onClick: function () { Router.navigate('#/level-map'); }
          }));
          return;
        }

        renderPlayPage(page, state);
      }).catch(function (err) {
        // 如果页面已卸载，跳过错误渲染
        if (!state.active) return;

        Renderer.clearContainer(page);
        var msg;
        if (err && err.code === 403) {
          msg = '该关卡尚未解锁';
        } else if (err && err.code === 404) {
          msg = '该关卡暂无题目';
        } else {
          msg = (err && err.message) ? err.message : '加载关卡失败';
        }
        page.appendChild(Renderer.createElement('div', 'text-center text-error mt-lg', msg));
        page.appendChild(Button.create({
          text: '返回地图', variant: 'primary', block: true,
          onClick: function () { Router.navigate('#/level-map'); }
        }));
      });
    },
  };

  Router.register('#/play', PlayPage.render);
  window.PlayPage = PlayPage;
})(window);

/**
 * 奇幻英语闯关 - 结果页
 * @module result
 * @description 答题结果展示：得分、星级、错题回顾、积分奖励
 */
(function (window) {
  'use strict';

  /**
   * 解析 hash 查询字符串
   * @param {string} hash - 如 '#/result?level=preset-1&stars=3&passed=1'
   * @returns {Object}
   */
  function parseHashQuery(hash) {
    var queryIndex = hash.indexOf('?');
    if (queryIndex < 0) return {};
    var queryString = hash.substring(queryIndex + 1);
    var params = {};
    var pairs = queryString.split('&');
    for (var i = 0; i < pairs.length; i++) {
      var pair = pairs[i].split('=');
      if (pair.length === 2) {
        params[decodeURIComponent(pair[0])] = decodeURIComponent(pair[1]);
      }
    }
    return params;
  }

  /**
   * 创建统计行
   * @param {string} label - 标签
   * @param {string} value - 值
   * @returns {HTMLElement}
   */
  function createStatRow(label, value) {
    var row = Renderer.createDiv('result-stat-row');
    row.appendChild(Renderer.createElement('span', 'result-stat-label', label));
    row.appendChild(Renderer.createElement('span', 'result-stat-value', String(value)));
    return row;
  }

  /**
   * 格式化用时
   * @param {number} seconds - 秒数
   * @returns {string}
   */
  function formatTime(seconds) {
    seconds = parseInt(seconds, 10) || 0;
    if (seconds < 60) return seconds + ' 秒';
    var min = Math.floor(seconds / 60);
    var sec = seconds % 60;
    return min + ' 分 ' + sec + ' 秒';
  }

  /**
   * 获取下一关 ID（仅对 preset-N 格式有效）
   * @param {string} levelId - 当前关卡 ID
   * @returns {string|null}
   */
  function getNextLevelId(levelId) {
    var match = String(levelId).match(/preset-(\d+)/);
    if (!match) return null;
    var num = parseInt(match[1], 10);
    var maxLevels = (window.EA_CONFIG && window.EA_CONFIG.PRESET_LEVEL_COUNT) || 48;
    if (num >= maxLevels) return null;
    return 'preset-' + (num + 1);
  }

  /**
   * @namespace ResultPage
   */
  var ResultPage = {
    /**
     * 渲染结果页
     * @param {HTMLElement} container - 页面容器
     */
    render: function (container) {
      if (!container) return;
      Renderer.clearContainer(container);

      var hash = window.location.hash || '';
      var params = parseHashQuery(hash);

      var levelId = params.level || '';
      var stars = parseInt(params.stars, 10) || 0;
      var passed = params.passed === '1' || params.passed === 'true';
      var correctCount = parseInt(params.correct, 10) || 0;
      var total = parseInt(params.total, 10) || 0;
      var accuracy = parseFloat(params.accuracy) || 0;
      var points = parseInt(params.points, 10) || 0;
      var timeSpent = parseInt(params.time, 10) || 0;

      var page = Renderer.createDiv('result-page');
      container.appendChild(page);

      // 提取关卡索引
      var levelIndex = 0;
      var lvlMatch = String(levelId).match(/preset-(\d+)/);
      if (lvlMatch) {
        levelIndex = parseInt(lvlMatch[1], 10) - 1;
      }

      // 添加剧情主题 class
      if (window.StoryEngine) {
        var storyline = StoryEngine.getCurrentStoryline();
        if (storyline) {
          page.classList.add('story-theme-' + storyline.id);
        }
      }

      // 状态图标
      page.appendChild(Renderer.createElement('div', 'result-status', passed ? '🎉' : '😢'));

      // 标题
      page.appendChild(Renderer.createElement('h2', 'result-title',
        passed ? '通关成功！' : '再接再厉！'));

      // 星级动画（逐个弹出）
      var starsContainer = Renderer.createDiv('result-stars');
      page.appendChild(starsContainer);

      for (var i = 0; i < 3; i++) {
        var star = Renderer.createElement('span', 'star', i < stars ? '★' : '☆');
        star.style.opacity = '0';
        star.style.transform = 'scale(0)';
        star.style.transition = 'all 0.4s ease';
        star.style.display = 'inline-block';
        starsContainer.appendChild(star);

        // 闭包捕获正确的 star 和延迟
        (function (s, delay) {
          setTimeout(function () {
            s.style.opacity = '1';
            s.style.transform = 'scale(1)';
          }, delay);
        })(star, 300 + i * 300);
      }

      // 统计信息
      var stats = Renderer.createDiv('result-stats');
      page.appendChild(stats);

      stats.appendChild(createStatRow('答对题数', correctCount + ' / ' + total));
      stats.appendChild(createStatRow('正确率', Math.round(accuracy * 100) + '%'));
      stats.appendChild(createStatRow('用时', formatTime(timeSpent)));
      stats.appendChild(createStatRow('获得积分', '+' + points));

      // 积分高亮
      if (points > 0) {
        page.appendChild(Renderer.createElement('div', 'result-points', '💰 +' + points + ' 积分'));
      }

      // 剧情解锁文本
      if (passed && window.StoryEngine) {
        var storyline = StoryEngine.getCurrentStoryline();
        if (storyline) {
          var storyNode = StoryEngine.getStoryNode(levelIndex);
          if (storyNode && storyNode.unlockedText) {
            var storyBox = Renderer.createDiv('result-story-box');
            storyBox.appendChild(Renderer.createElement('div', 'result-story-label',
              (storyline.icon || '') + ' ' + storyline.name + ' · 剧情解锁'));
            storyBox.appendChild(Renderer.createElement('div', 'result-story-text',
              storyNode.unlockedText));
            page.appendChild(storyBox);
          }

          // 向导庆祝语
          var guide = StoryEngine.getGuide();
          if (guide) {
            var celebration = Renderer.createDiv('result-guide-celebration');
            celebration.appendChild(Renderer.createElement('div', 'guide-emoji', guide.emoji));
            celebration.appendChild(Renderer.createElement('div', 'guide-text',
              StoryEngine.getRandomPhrase('celebration')));
            page.appendChild(celebration);
          }

          // 收集品获取
          if (StoryEngine.isCollectibleNode(levelIndex)) {
            StoryEngine.addCollectedItem(levelIndex);
            var collectibles = StoryEngine.getCollectibles();
            var acquiredItem = null;
            for (var ci = 0; ci < collectibles.length; ci++) {
              if (collectibles[ci].nodeIndex === levelIndex) {
                acquiredItem = collectibles[ci];
                break;
              }
            }
            if (acquiredItem) {
              var collectibleBox = Renderer.createDiv('collectible-acquired');
              collectibleBox.appendChild(Renderer.createElement('div', 'collectible-icon', acquiredItem.icon));
              collectibleBox.appendChild(Renderer.createElement('div', 'collectible-label', '获得收集品'));
              collectibleBox.appendChild(Renderer.createElement('div', 'collectible-name', acquiredItem.name));
              page.appendChild(collectibleBox);
            }

            // 收集品进度
            var collectProgress = StoryEngine.getCollectibleProgress();
            if (collectProgress.total > 0) {
              var collectProgressText = Renderer.createElement('div', 'result-story-progress',
                '🎁 收集品：' + collectProgress.collected + ' / ' + collectProgress.total);
              page.appendChild(collectProgressText);
            }
          }

          // 剧情进度更新
          var storyProgress = StoryEngine.getProgress();
          if (storyProgress.total > 0) {
            var storyProgressText = Renderer.createElement('div', 'result-story-progress',
              '📖 剧情进度：' + storyProgress.completed + ' / ' + storyProgress.total +
              ' 章（' + storyProgress.percentage + '%）');
            page.appendChild(storyProgressText);
          }
        }
      }

      // 操作按钮
      var actions = Renderer.createDiv('result-actions');
      page.appendChild(actions);

      // 重试
      actions.appendChild(Button.create({
        text: '🔄 重试',
        variant: 'outline',
        block: true,
        onClick: function () {
          Router.navigate('#/play?level=' + encodeURIComponent(levelId));
        }
      }));

      // 下一关（仅通关且存在下一关时显示）
      if (passed) {
        var nextLevelId = getNextLevelId(levelId);
        if (nextLevelId) {
          actions.appendChild(Button.create({
            text: '➡️ 下一关',
            variant: 'primary',
            block: true,
            onClick: function () {
              Router.navigate('#/play?level=' + encodeURIComponent(nextLevelId));
            }
          }));
        }
      }

      // 返回地图
      actions.appendChild(Button.create({
        text: '🗺️ 返回地图',
        variant: 'ghost',
        block: true,
        onClick: function () { Router.navigate('#/level-map'); }
      }));
    },
  };

  Router.register('#/result', ResultPage.render);
  window.ResultPage = ResultPage;
})(window);

 * 奇幻英语闯关 - 剧情选择页

    /**

    _createStoryCard: function (storyline, currentSelectedId) {

      var desc = Renderer.createElement('div', 'story-card-desc', storyline.description);

      var btnVariant = isSelected ? 'outline' : 'primary';
      var btn = Button.create({
        text: btnText,
        variant: btnVariant,
        block: true,

/**

(function (window) {

  /**
   * 检查节点是否已通关
   * @param {number} levelIndex - 关卡索引
   * @returns {boolean}
   */
  function isNodeCompleted(levelIndex) {
    if (!window.LevelEngine || typeof LevelEngine.getLevelResult !== 'function') return false;
    var levelId = 'preset-' + (levelIndex + 1);
    var result = LevelEngine.getLevelResult(levelId);
    return !!(result && result.passed);
  }

  /**
   * 获取下一个待通关的节点索引
   * @param {Array} nodes - 节点列表
   * @returns {number}
   */
  function getNextNodeIndex(nodes) {
    for (var i = 0; i < nodes.length; i++) {

        return nodes[i].levelIndex;
      }
    }
    return -1;
  }

   * 创建收集品展示区域
   * @param {Object} storyline - 剧情线数据

    for (var i = 0; i < progress.items.length; i++) {

  /**

   * @returns {HTMLElement}
   */
  function createTimelineNode(node, index, isCollectible, isCollected, completed, nextNodeIndex) {
    var nodeEl = Renderer.createDiv('story-review-node');

    // 状态判断
    if (completed) {
      nodeEl.classList.add('unlocked');

      nodeEl.classList.add('current');

      (index + 1) + '. ' + node.title);

    nodeEl.appendChild(Renderer.createElement('div', 'story-review-node-desc', node.description));

    // 徽章
    if (completed) {
      nodeEl.appendChild(Renderer.createElement('span', 'story-review-node-badge completed', '✅ 已完成'));
    }
    if (isCollectible) {
      if (isCollected) {
        nodeEl.appendChild(Renderer.createElement('span', 'story-review-node-badge collected', '🎁 已收集'));
      } else {
        nodeEl.appendChild(Renderer.createElement('span', 'story-review-node-badge collectible', '🎁 收集品'));
      }
    }

    // 点击事件
    if (completed) {
      nodeEl.addEventListener('click', function () {

  /**
   * @namespace StoryReviewPage
   */
  var StoryReviewPage = {
    /**

    render: function (container) {

      Renderer.clearContainer(container);

      var page = Renderer.createDiv('story-review-page');

      // 检查是否选择了剧情
      if (!window.StoryEngine || !StoryEngine.hasSelected()) {
