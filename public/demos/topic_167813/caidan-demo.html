<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>彩蛋 Demo - 开发测试版</title>
<style>
/* 手机内共享样式 */
#content-area .calendar-cell { width: 12px; height: 12px; border-radius: 2px; margin: 2px; }
#content-area .calendar-cell.checked { background: #4caf50; }
#content-area .calendar-cell.unchecked { background: #e0e0e0; }
</style>
</head>
<body>

<!-- 应用挂载点 -->
<div id="app-root"></div>

<!-- 应用代码 -->
<script>
// ==================== Mock 数据 ====================
const MockData = (() => {
  function generateCheckinHistory() {
    const history = [];
    const today = new Date();
    for (let i = 89; i >= 0; i--) {
      const date = new Date(today);
      date.setDate(date.getDate() - i);
      const dateStr = date.toISOString().slice(0, 10);
      const checked = i < 7 ? true : Math.random() > 0.35;
      history.push({ date: dateStr, checked });
    }
    return history;
  }

  return {
    user: { phone: '138****1234', nickname: '用户' },
    tasks: [{
      id: 1,
      type: 'steps',
      name: '每日步数打卡',
      target: 3000,
      rewardCash: 1.00,
      rewardGoods: { type: 'egg', name: '新鲜鸡蛋', perCheckin: 1, exchangeThreshold: 12 },
      checkinHistory: generateCheckinHistory(),
      goodsCollected: 8,
      totalCashEarned: 36.50,
      todayChecked: false
    }],
    earnings: (() => {
      const list = [];
      const today = new Date();
      for (let i = 6; i >= 0; i--) {
        const date = new Date(today);
        date.setDate(date.getDate() - i);
        list.push({ date: date.toISOString().slice(0, 10), amount: 1.00 });
      }
      return list;
    })()
  };
})();

// ==================== 应用代码 ====================
const App = (() => {
  let _state = null;
  let _container = null;
  let _currentTab = 'checkin';
  let _currentPage = 'home';

  // ---- DOM 工具 ----
  function _renderPhoneShell() {
    const shell = document.createElement('div');
    shell.id = 'phone-shell';
    shell.style.cssText = 'width:375px;height:812px;margin:80px auto;border-radius:40px;border:8px solid #1a1a2e;background:#f5f5f5;overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(0,0,0,0.3);display:flex;flex-direction:column;';
    _container.appendChild(shell);
    return shell;
  }

  function _renderTabBar(shell) {
    const tabBar = document.createElement('div');
    tabBar.id = 'tab-bar';
    tabBar.style.cssText = 'display:flex;height:44px;background:#fff;border-bottom:1px solid #e0e0e0;flex-shrink:0;';
    [
      { name: 'checkin', label: '打卡端' },
      { name: 'funder', label: '资助端' }
    ].forEach(tab => {
      const btn = document.createElement('button');
      btn.className = 'tab-btn';
      btn.dataset.tab = tab.name;
      btn.textContent = tab.label;
      btn.style.cssText = 'flex:1;border:none;background:transparent;font-size:15px;cursor:pointer;color:#999;transition:all 0.2s;';
      btn.addEventListener('click', () => App.switchTab(tab.name));
      tabBar.appendChild(btn);
    });
    shell.appendChild(tabBar);
    return tabBar;
  }

  function _renderContentArea(shell) {
    const content = document.createElement('div');
    content.id = 'content-area';
    content.style.cssText = 'flex:1;overflow-y:auto;position:relative;';
    shell.appendChild(content);
    return content;
  }

  function _renderBottomNav(shell) {
    const nav = document.createElement('div');
    nav.id = 'bottom-nav';
    nav.style.cssText = 'display:flex;height:60px;background:#fff;border-top:1px solid #e0e0e0;flex-shrink:0;';
    const items = [
      { tab: 'checkin', pages: [{ name: 'home', label: '首页' }, { name: 'warehouse', label: '仓库' }] },
      { tab: 'funder', pages: [{ name: 'home', label: '首页' }, { name: 'create', label: '创建' }] }
    ];
    _renderNavItems(nav, items[0].pages);
    nav.dataset.currentTab = 'checkin';
    nav.dataset.navConfig = JSON.stringify(items);
    shell.appendChild(nav);
    return nav;
  }

  function _renderNavItems(nav, pages) {
    nav.innerHTML = '';
    pages.forEach(page => {
      const item = document.createElement('div');
      item.className = 'nav-item';
      item.dataset.page = page.name;
      item.textContent = page.label;
      item.style.cssText = 'flex:1;display:flex;align-items:center;justify-content:center;font-size:12px;color:#999;cursor:pointer;flex-direction:column;';
      item.addEventListener('click', () => App.navigate(page.name));
      if (page.name === 'home') item.style.color = '#ff8c00';
      nav.appendChild(item);
    });
  }

  function _updateTabBar(tabName) {
    const tabBar = document.querySelector('#tab-bar');
    if (!tabBar) return;
    tabBar.querySelectorAll('.tab-btn').forEach(btn => {
      if (btn.dataset.tab === tabName) {
        btn.style.color = tabName === 'checkin' ? '#ff8c00' : '#4a90d9';
        btn.style.fontWeight = '600';
        btn.style.borderBottom = '2px solid ' + (tabName === 'checkin' ? '#ff8c00' : '#4a90d9');
      } else {
        btn.style.color = '#999'; btn.style.fontWeight = 'normal'; btn.style.borderBottom = 'none';
      }
    });
  }

  function _updateBottomNav(tabName) {
    const nav = document.querySelector('#bottom-nav');
    if (!nav) return;
    const config = JSON.parse(nav.dataset.navConfig);
    const tabConfig = config.find(t => t.tab === tabName);
    if (tabConfig) { _renderNavItems(nav, tabConfig.pages); nav.dataset.currentTab = tabName; }
  }

  // ---- 初始化 ----
  function init(container) {
    if (typeof container === 'string') _container = document.querySelector(container);
    else _container = container;
    _container.innerHTML = '';

    _state = {
      currentTab: 'checkin', currentPage: 'home',
      tasks: JSON.parse(JSON.stringify(MockData.tasks)),
      earnings: JSON.parse(JSON.stringify(MockData.earnings)),
      earningsExpanded: false,
      checkinVerifying: false,
      modal: null,
      calendarView: false,
      toast: null
    };

    const shell = _renderPhoneShell();
    _renderTabBar(shell);
    _renderContentArea(shell);
    _renderBottomNav(shell);
    _currentTab = 'checkin'; _currentPage = 'home';
    _updateTabBar('checkin');
    _renderCurrentPage();
  }

  function switchTab(tabName) {
    _state.currentTab = tabName; _state.currentPage = 'home';
    _currentTab = tabName; _currentPage = 'home';
    _state.calendarView = false;
    _updateTabBar(tabName); _updateBottomNav(tabName); _renderCurrentPage();
  }

  function navigate(pageName) {
    _state.currentPage = pageName; _currentPage = pageName;
    _state.calendarView = false;
    const nav = document.querySelector('#bottom-nav');
    if (nav) {
      nav.querySelectorAll('.nav-item').forEach(item => {
        const color = _currentTab === 'checkin' ? '#ff8c00' : '#4a90d9';
        item.style.color = item.dataset.page === pageName ? color : '#999';
      });
    }
    _renderCurrentPage();
  }

  function _renderCurrentPage() {
    const contentArea = document.querySelector('#content-area');
    if (!contentArea) return;
    contentArea.innerHTML = '';
    const tab = _currentTab, page = _currentPage;
    if (tab === 'checkin' && page === 'home') _renderCheckinHome(contentArea);
    else if (tab === 'checkin' && page === 'warehouse') _renderWarehouse(contentArea);
    else if (tab === 'funder' && page === 'home') _renderFunderHome(contentArea);
    else if (tab === 'funder' && page === 'create') _renderCreateTask(contentArea);
  }

  // ---- 弹窗/遮罩 通用 ----
  function _showModal(html, id) {
    _closeModal();
    const modal = document.createElement('div');
    modal.id = id || 'modal';
    modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:9999;';
    modal.innerHTML = html;
    _state.modal = modal;
    const shell = document.querySelector('#phone-shell');
    if (shell) shell.appendChild(modal);
  }

  function _closeModal() {
    if (_state.modal) {
      _state.modal.remove();
      _state.modal = null;
    }
  }

  function _showToast(message) {
    const toast = document.createElement('div');
    toast.id = 'toast';
    toast.style.cssText = 'position:fixed;top:100px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;z-index:10000;animation:fadeInOut 2s forwards;';
    toast.textContent = message;
    const shell = document.querySelector('#phone-shell');
    if (shell) shell.appendChild(toast);
    setTimeout(() => { if (toast.parentNode) toast.remove(); }, 2000);
  }

  // ---- 打卡端首页 ----
  function _renderCheckinHome(container) {
    const task = _state.tasks[0];
    const done = task.todayChecked;

    const taskCard = document.createElement('div');
    taskCard.id = 'task-card';
    taskCard.style.cssText = 'margin:16px;border-radius:16px;padding:24px;text-align:center;' + (done ? 'background:#e8f5e9;border:1px solid #a5d6a7;' : 'background:linear-gradient(135deg,#fff8e1,#ffecb3);border:1px solid #ffe082;');

    if (done) {
      taskCard.innerHTML = `<div style="font-size:14px;color:#666;margin-bottom:8px;">${task.name}</div><div style="font-size:28px;font-weight:700;color:#43a047;">今日已完成</div><div style="font-size:14px;color:#666;margin-top:12px;">祝福金 +${task.rewardCash.toFixed(2)}元 | 鸡蛋 +${task.rewardGoods.perCheckin}</div>`;
    } else {
      taskCard.innerHTML = `<div style="font-size:14px;color:#666;margin-bottom:8px;">${task.name}</div><div style="font-size:13px;color:#999;margin-bottom:4px;">每天走${task.target}步就能领</div><div style="font-size:24px;font-weight:700;color:#f57c00;margin:12px 0;">今日可领祝福金 ${task.rewardCash.toFixed(2)}元</div><button id="btn-checkin" style="background:linear-gradient(135deg,#ff8c00,#ff6d00);color:#fff;border:none;border-radius:24px;padding:12px 48px;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 4px 12px rgba(255,140,0,0.4);">立即打卡</button>`;
      const btn = taskCard.querySelector('#btn-checkin');
      if (btn) btn.addEventListener('click', () => App.checkin());
    }
    container.appendChild(taskCard);

    const warehouseEntry = document.createElement('div');
    warehouseEntry.id = 'warehouse-entry';
    warehouseEntry.style.cssText = 'margin:0 16px 12px;background:#fff;border-radius:12px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border:1px solid #e0e0e0;cursor:pointer;';
    warehouseEntry.innerHTML = `<div style="display:flex;align-items:center;gap:10px;"><span style="font-size:24px;">🥚</span><span style="font-size:15px;color:#333;">我的仓库</span></div><div style="display:flex;align-items:center;gap:6px;"><span style="font-size:14px;color:#ff8c00;font-weight:600;">x${task.goodsCollected}</span><span style="color:#ccc;">›</span></div>`;
    warehouseEntry.addEventListener('click', () => App.navigate('warehouse'));
    container.appendChild(warehouseEntry);

    const progressBar = document.createElement('div');
    progressBar.id = 'goods-progress';
    progressBar.style.cssText = 'margin:0 16px 16px;';
    const progress = Math.min(task.goodsCollected / task.rewardGoods.exchangeThreshold, 1);
    const remaining = task.rewardGoods.exchangeThreshold - task.goodsCollected;
    progressBar.innerHTML = `<div style="font-size:12px;color:#999;margin-bottom:4px;">离兑换还差 ${remaining > 0 ? remaining : 0} 个</div><div style="background:#e0e0e0;border-radius:8px;height:8px;overflow:hidden;"><div style="background:linear-gradient(90deg,#ff8c00,#ffb74d);height:100%;width:${progress * 100}%;border-radius:8px;transition:width 0.3s;"></div></div>`;
    container.appendChild(progressBar);

    const earningsSection = document.createElement('div');
    earningsSection.id = 'earnings-section';
    earningsSection.style.cssText = 'margin:0 16px 16px;text-align:center;';
    earningsSection.innerHTML = `<div id="earnings-toggle" style="font-size:13px;color:#999;cursor:pointer;padding:8px;">累计已得祝福金 ${task.totalCashEarned.toFixed(2)}元 ›</div><div id="earnings-detail" style="display:${_state.earningsExpanded ? 'block' : 'none'};background:#fff;border-radius:8px;padding:8px;margin-top:8px;border:1px solid #e0e0e0;">${_state.earnings.map(e => `<div style="display:flex;justify-content:space-between;padding:6px 8px;font-size:13px;border-bottom:1px solid #f0f0f0;"><span style="color:#666;">${e.date}</span><span style="color:#f57c00;font-weight:600;">+${e.amount.toFixed(2)}元</span></div>`).join('')}</div>`;
    earningsSection.querySelector('#earnings-toggle').addEventListener('click', () => {
      _state.earningsExpanded = !_state.earningsExpanded;
      const detail = earningsSection.querySelector('#earnings-detail');
      detail.style.display = _state.earningsExpanded ? 'block' : 'none';
    });
    container.appendChild(earningsSection);
  }

  // ---- 打卡流程: 验证动画 + 成功弹窗 ----
  function _renderCheckinVerify(container) {
    container.innerHTML = `
      <div id="verify-overlay" style="position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,0.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;">
        <div style="font-size:48px;margin-bottom:16px;">🚶</div>
        <div style="font-size:16px;color:#666;margin-bottom:20px;">正在验证今日步数...</div>
        <div id="verify-progress-ring" style="width:60px;height:60px;border:4px solid #e0e0e0;border-top-color:#ff8c00;border-radius:50%;animation:spin 1s linear infinite;"></div>
      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    `;
  }

  function _renderCheckinSuccess(container) {
    const task = _state.tasks[0];
    const goods = task.rewardGoods;
    const shouldAlertExchange = task.goodsCollected >= goods.exchangeThreshold && (task.goodsCollected - goods.perCheckin) < goods.exchangeThreshold;

    const html = `
      <div style="background:#fff;border-radius:16px;padding:32px 24px;text-align:center;max-width:300px;width:80%;margin:0 16px;box-shadow:0 10px 40px rgba(0,0,0,0.3);">
        <div style="font-size:48px;margin-bottom:12px;">🎉</div>
        <div style="font-size:16px;color:#333;margin-bottom:4px;">今日祝福金已到账</div>
        <div style="font-size:32px;font-weight:700;color:#f57c00;margin-bottom:8px;">+${task.rewardCash.toFixed(2)}元</div>
        <div style="font-size:14px;color:#666;border-top:1px solid #f0f0f0;padding-top:12px;margin-top:12px;">+🥚 ${goods.name} x${goods.perCheckin}</div>
        <button id="btn-success-close" style="margin-top:24px;background:linear-gradient(135deg,#ff8c00,#ff6d00);color:#fff;border:none;border-radius:24px;padding:10px 40px;font-size:15px;font-weight:600;cursor:pointer;width:100%;">太好了</button>
      </div>
    `;
    _showModal(html, 'checkin-success-modal');

    document.getElementById('btn-success-close').addEventListener('click', () => {
      _closeModal();
      if (shouldAlertExchange) {
        _showExchangeAlert();
      }
      _renderCurrentPage();
    });
  }

  function _showExchangeAlert() {
    const html = `
      <div style="background:#fff;border-radius:16px;padding:24px;text-align:center;max-width:280px;width:80%;margin:0 16px;box-shadow:0 10px 40px rgba(0,0,0,0.3);">
        <div style="font-size:36px;margin-bottom:8px;">🎊</div>
        <div style="font-size:16px;color:#f57c00;font-weight:600;margin-bottom:8px;">恭喜！</div>
        <div style="font-size:14px;color:#666;">您攒的鸡蛋已满一盒，可以兑换啦～</div>
        <button id="btn-alert-close" style="margin-top:16px;background:#4caf50;color:#fff;border:none;border-radius:20px;padding:10px 32px;font-size:14px;cursor:pointer;">去看看</button>
      </div>
    `;
    _showModal(html, 'exchange-alert-modal');
    document.getElementById('btn-alert-close').addEventListener('click', () => {
      _closeModal();
      App.navigate('warehouse');
    });
  }

  function checkin(skipAnimation) {
    if (skipAnimation) {
      _state.tasks[0].todayChecked = true;
      _state.tasks[0].goodsCollected += _state.tasks[0].rewardGoods.perCheckin;
      _state.tasks[0].totalCashEarned += _state.tasks[0].rewardCash;
      _state.earnings.push({ date: new Date().toISOString().slice(0, 10), amount: _state.tasks[0].rewardCash });
      _renderCurrentPage();
      return;
    }
    _state.checkinVerifying = true;
    const contentArea = document.querySelector('#content-area');
    if (contentArea) _renderCheckinVerify(contentArea);

    setTimeout(() => {
      _state.checkinVerifying = false;
      _state.tasks[0].todayChecked = true;
      _state.tasks[0].goodsCollected += _state.tasks[0].rewardGoods.perCheckin;
      _state.tasks[0].totalCashEarned += _state.tasks[0].rewardCash;
      _state.earnings.push({ date: new Date().toISOString().slice(0, 10), amount: _state.tasks[0].rewardCash });

      const contentArea2 = document.querySelector('#content-area');
      if (contentArea2) _renderCheckinSuccess(contentArea2);
    }, 1500);
  }

  // ---- 仓库 + 兑换 ----
  function _renderWarehouse(container) {
    const task = _state.tasks[0];
    const goods = task.rewardGoods;
    const progress = Math.min(task.goodsCollected / goods.exchangeThreshold, 1);
    const canExchange = task.goodsCollected >= goods.exchangeThreshold;

    container.innerHTML = '';

    const title = document.createElement('div');
    title.style.cssText = 'font-size:18px;font-weight:600;color:#333;padding:20px 16px 12px;';
    title.textContent = '我的仓库';
    container.appendChild(title);

    // 物资卡片
    const card = document.createElement('div');
    card.id = 'warehouse-card';
    card.style.cssText = 'margin:0 16px 16px;background:#fff;border-radius:16px;padding:20px;border:1px solid #e0e0e0;';
    card.innerHTML = `
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
        <span style="font-size:36px;">🥚</span>
        <div>
          <div style="font-size:16px;font-weight:600;color:#333;">${goods.name}</div>
          <div style="font-size:14px;color:#999;">已攒 ${task.goodsCollected} 个</div>
        </div>
      </div>
      <div style="background:#e0e0e0;border-radius:8px;height:10px;overflow:hidden;margin-bottom:12px;">
        <div id="warehouse-progress-bar" style="background:linear-gradient(90deg,#ff8c00,#ffb74d);height:100%;width:${progress * 100}%;border-radius:8px;transition:width 0.3s;"></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:13px;color:#999;">${canExchange ? '已满一盒，可兑换' : `还差 ${goods.exchangeThreshold - task.goodsCollected} 个`}</span>
        <button id="btn-exchange" style="background:${canExchange ? 'linear-gradient(135deg,#ff8c00,#ff6d00)' : '#e0e0e0'};color:${canExchange ? '#fff' : '#999'};border:none;border-radius:16px;padding:8px 24px;font-size:14px;font-weight:600;cursor:${canExchange ? 'pointer' : 'not-allowed'};">${canExchange ? '立即兑换' : '还需 ' + (goods.exchangeThreshold - task.goodsCollected) + ' 个'}</button>
      </div>
    `;
    container.appendChild(card);

    // 模拟凑满按钮（演示用）
    const mockBtn = document.createElement('div');
    mockBtn.id = 'mock-fill-btn';
    mockBtn.style.cssText = 'margin:0 16px;text-align:center;font-size:12px;color:#ccc;cursor:pointer;padding:8px;';
    mockBtn.textContent = '⚡ 模拟凑满（演示用）';
    mockBtn.addEventListener('click', () => {
      const needed = goods.exchangeThreshold - task.goodsCollected;
      if (needed > 0) {
        task.goodsCollected = goods.exchangeThreshold;
        task.totalCashEarned += needed * task.rewardCash;
        for (let i = 0; i < needed; i++) {
          _state.earnings.push({ date: new Date().toISOString().slice(0, 10), amount: task.rewardCash });
        }
        _renderCurrentPage();
      }
    });
    container.appendChild(mockBtn);

    // 绑定兑换按钮
    const exchangeBtn = card.querySelector('#btn-exchange');
    if (exchangeBtn && canExchange) {
      exchangeBtn.addEventListener('click', () => App.exchange());
    }
  }

  function _renderExchangeConfirm(container) {
    const html = `
      <div style="background:#fff;border-radius:16px;padding:24px;text-align:center;max-width:280px;width:80%;margin:0 16px;box-shadow:0 10px 40px rgba(0,0,0,0.3);">
        <div style="font-size:32px;margin-bottom:8px;">🎁</div>
        <div style="font-size:16px;font-weight:600;color:#333;margin-bottom:4px;">确认兑换</div>
        <div style="font-size:14px;color:#666;margin-bottom:16px;">新鲜鸡蛋 x12</div>
        <div style="font-size:12px;color:#999;margin-bottom:20px;">将为您发货到：北京市朝阳区xxx</div>
        <div style="display:flex;gap:10px;">
          <button id="btn-exchange-cancel" style="flex:1;background:#f5f5f5;color:#666;border:none;border-radius:16px;padding:10px;font-size:14px;cursor:pointer;">再想想</button>
          <button id="btn-exchange-confirm" style="flex:1;background:linear-gradient(135deg,#ff8c00,#ff6d00);color:#fff;border:none;border-radius:16px;padding:10px;font-size:14px;cursor:pointer;font-weight:600;">确认兑换</button>
        </div>
      </div>
    `;
    _showModal(html, 'exchange-confirm-modal');
    document.getElementById('btn-exchange-cancel').addEventListener('click', _closeModal);
    document.getElementById('btn-exchange-confirm').addEventListener('click', () => {
      _closeModal();
      const task = _state.tasks[0];
      task.goodsCollected = 0;
      _showToast('兑换成功！我们会尽快为您发货');
      _renderCurrentPage();
    });
  }

  function exchange() {
    _renderExchangeConfirm();
  }

  // ---- 资助端首页 ----
  function _renderFunderHome(container) {
    const task = _state.tasks[0];
    const done = task.todayChecked;

    container.innerHTML = '';

    // 顶部文案
    const header = document.createElement('div');
    header.style.cssText = 'padding:16px;font-size:13px;color:#999;text-align:center;';
    header.textContent = '您正在默默守护 1 位家人';
    container.appendChild(header);

    // 任务卡片
    const card = document.createElement('div');
    card.id = 'funder-task-card';
    card.style.cssText = 'margin:0 16px 16px;background:#fff;border-radius:16px;padding:20px;border:1px solid #e0e0e0;position:relative;' + (done ? 'border-left:4px solid #4caf50;' : '');

    const streak = 7; // 连续打卡天数（Mock）
    const progress = task.goodsCollected / task.rewardGoods.exchangeThreshold;

    card.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <span style="font-size:18px;font-weight:600;color:#333;">妈妈</span>
        <div style="display:flex;align-items:center;gap:6px;">
          <span id="status-light" style="width:10px;height:10px;border-radius:50%;background:${done ? '#4caf50' : '#ccc'};display:inline-block;"></span>
          <span style="font-size:12px;color:${done ? '#4caf50' : '#999'};">${done ? '今日已打卡' : '今日未打卡'}</span>
        </div>
      </div>
      <div style="font-size:14px;color:#666;margin-bottom:8px;">已送出祝福金 ${task.totalCashEarned.toFixed(2)}元</div>
      <div style="font-size:14px;color:#666;margin-bottom:12px;">连续打卡 ${streak} 天</div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
        <span style="font-size:16px;">🥚</span>
        <div style="flex:1;background:#e0e0e0;border-radius:8px;height:8px;overflow:hidden;">
          <div style="background:linear-gradient(90deg,#4a90d9,#7bb3f0);height:100%;width:${progress * 100}%;border-radius:8px;"></div>
        </div>
        <span style="font-size:12px;color:#999;">${task.goodsCollected}/${task.rewardGoods.exchangeThreshold}</span>
      </div>
      <div style="font-size:13px;color:#4a90d9;margin-bottom:12px;">${done ? '妈妈连续打卡7天了，真棒！' : '今天还没打卡哦～'}</div>
      <div style="display:flex;gap:10px;">
        <button id="btn-view-detail" style="flex:1;background:#f0f7ff;color:#4a90d9;border:none;border-radius:12px;padding:8px;font-size:13px;cursor:pointer;">查看详情</button>
        <button id="btn-remind" style="flex:1;background:#fff5e6;color:#ff8c00;border:1px solid #ffe0b2;border-radius:12px;padding:8px;font-size:13px;cursor:pointer;">提醒打卡</button>
      </div>
    `;
    container.appendChild(card);

    // 绑定按钮
    card.querySelector('#btn-view-detail').addEventListener('click', () => {
      _state.calendarView = true;
      _renderFunderCalendar(container);
    });
    card.querySelector('#btn-remind').addEventListener('click', () => {
      _showToast('已发送关怀提醒');
    });
  }

  // ---- 暖心历 ----
  function _renderFunderCalendar(container) {
    const task = _state.tasks[0];
    container.innerHTML = '';

    // 返回按钮
    const backBtn = document.createElement('div');
    backBtn.style.cssText = 'padding:12px 16px;font-size:14px;color:#4a90d9;cursor:pointer;';
    backBtn.innerHTML = '‹ 返回';
    backBtn.addEventListener('click', () => { _state.calendarView = false; _renderFunderHome(container); });
    container.appendChild(backBtn);

    // 标题
    const title = document.createElement('div');
    title.style.cssText = 'font-size:18px;font-weight:600;color:#333;padding:0 16px 12px;';
    title.textContent = '暖心历 - 妈妈';
    container.appendChild(title);

    // 统计
    const stats = document.createElement('div');
    stats.id = 'calendar-stats';
    stats.style.cssText = 'display:flex;justify-content:space-around;padding:12px 16px;margin:0 16px 16px;background:#f0f7ff;border-radius:12px;';

    // 计算统计
    const history = task.checkinHistory;
    const checkedCount = history.filter(h => h.checked).length;
    const recent = history.slice(-30);
    const monthCount = recent.filter(h => h.checked).length;
    let streak = 0;
    for (let i = history.length - 1; i >= 0; i--) {
      if (history[i].checked) streak++; else break;
    }

    stats.innerHTML = `
      <div style="text-align:center;"><div style="font-size:20px;font-weight:700;color:#4a90d9;">${streak}</div><div style="font-size:11px;color:#999;">连续天数</div></div>
      <div style="text-align:center;"><div style="font-size:20px;font-weight:700;color:#4a90d9;">${checkedCount}</div><div style="font-size:11px;color:#999;">累计打卡</div></div>
      <div style="text-align:center;"><div style="font-size:20px;font-weight:700;color:#4a90d9;">${monthCount}</div><div style="font-size:11px;color:#999;">本月打卡</div></div>
    `;
    container.appendChild(stats);

    // 日历矩阵
    const calendarWrap = document.createElement('div');
    calendarWrap.id = 'calendar-grid';
    calendarWrap.style.cssText = 'margin:0 16px;padding:12px;background:#fff;border-radius:12px;border:1px solid #e0e0e0;';

    // 生成日历：最近 12 周（约 3 个月）
    const weeksToShow = 12;
    const cellSize = 12;
    const gap = 3;
    const days = ['日', '一', '二', '三', '四', '五', '六'];

    let calendarHtml = '<div style="display:flex;gap:4px;margin-bottom:8px;">';
    days.forEach(d => { calendarHtml += `<span style="font-size:10px;color:#999;width:${cellSize}px;text-align:center;">${d}</span>`; });
    calendarHtml += '</div>';

    // 获取最近 12 周的数据
    const recentHistory = history.slice(-(weeksToShow * 7));
    // 补齐到周一开始
    const firstDate = new Date(recentHistory[0].date);
    const dayOfWeek = firstDate.getDay();
    const padDays = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
    const padded = [];
    for (let i = 0; i < padDays; i++) padded.push({ date: '', checked: false });
    padded.push(...recentHistory);

    // 补齐到周日结束
    const remaining = (7 - (padded.length % 7)) % 7;
    for (let i = 0; i < remaining; i++) padded.push({ date: '', checked: false });

    calendarHtml += '<div style="display:flex;flex-direction:column;gap:' + gap + 'px;">';
    for (let w = 0; w < padded.length / 7; w++) {
      calendarHtml += '<div style="display:flex;gap:' + gap + 'px;">';
      for (let d = 0; d < 7; d++) {
        const idx = w * 7 + d;
        const h = padded[idx];
        if (h && h.date) {
          calendarHtml += `<div class="calendar-cell ${h.checked ? 'checked' : 'unchecked'}" data-date="${h.date}" title="${h.date} ${h.checked ? '已打卡' : '未打卡'}"></div>`;
        } else {
          calendarHtml += `<div style="width:${cellSize}px;height:${cellSize}px;"></div>`;
        }
      }
      calendarHtml += '</div>';
    }
    calendarHtml += '</div>';

    calendarWrap.innerHTML = calendarHtml;
    container.appendChild(calendarWrap);
  }

  // ---- 创建任务 ----
  function _renderCreateTask(container) {
    container.innerHTML = '';

    const title = document.createElement('div');
    title.style.cssText = 'font-size:18px;font-weight:600;color:#333;padding:20px 16px 12px;';
    title.textContent = '创建打卡任务';
    container.appendChild(title);

    const form = document.createElement('div');
    form.id = 'create-task-form';
    form.style.cssText = 'margin:0 16px;';
    form.innerHTML = `
      <div style="margin-bottom:16px;">
        <div style="font-size:14px;color:#666;margin-bottom:8px;">选择任务类型</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <div class="task-type-option selected" data-type="steps" style="flex:1;min-width:70px;background:#fff5e6;border:2px solid #ff8c00;border-radius:12px;padding:12px;text-align:center;cursor:pointer;">
            <div style="font-size:24px;">🚶</div>
            <div style="font-size:12px;color:#ff8c00;margin-top:4px;">步数打卡</div>
          </div>
          <div class="task-type-option" data-type="location" style="flex:1;min-width:70px;background:#f5f5f5;border:1px solid #e0e0e0;border-radius:12px;padding:12px;text-align:center;cursor:pointer;opacity:0.5;">
            <div style="font-size:24px;">📍</div>
            <div style="font-size:12px;color:#999;margin-top:4px;">定位签到</div>
          </div>
          <div class="task-type-option" data-type="sleep" style="flex:1;min-width:70px;background:#f5f5f5;border:1px solid #e0e0e0;border-radius:12px;padding:12px;text-align:center;cursor:pointer;opacity:0.5;">
            <div style="font-size:24px;">😴</div>
            <div style="font-size:12px;color:#999;margin-top:4px;">睡眠打卡</div>
          </div>
          <div class="task-type-option" data-type="screen" style="flex:1;min-width:70px;background:#f5f5f5;border:1px solid #e0e0e0;border-radius:12px;padding:12px;text-align:center;cursor:pointer;opacity:0.5;">
            <div style="font-size:24px;">📱</div>
            <div style="font-size:12px;color:#999;margin-top:4px;">屏幕时长</div>
          </div>
        </div>
      </div>

      <div style="margin-bottom:16px;">
        <div style="font-size:14px;color:#666;margin-bottom:8px;">最低步数</div>
        <input id="input-target" type="number" value="3000" style="width:100%;padding:10px 12px;border:1px solid #e0e0e0;border-radius:8px;font-size:14px;box-sizing:border-box;">
      </div>

      <div style="margin-bottom:16px;">
        <div style="font-size:14px;color:#666;margin-bottom:8px;">每日祝福金（元）</div>
        <input id="input-cash" type="number" value="1.00" step="0.01" style="width:100%;padding:10px 12px;border:1px solid #e0e0e0;border-radius:8px;font-size:14px;box-sizing:border-box;">
      </div>

      <div style="margin-bottom:16px;">
        <div style="font-size:14px;color:#666;margin-bottom:8px;">物资奖励</div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="font-size:24px;">🥚</span>
          <span style="font-size:14px;color:#333;">鸡蛋</span>
          <span style="font-size:13px;color:#999;">每次打卡 +1，12个可兑换</span>
        </div>
      </div>

      <div style="margin-bottom:16px;">
        <div style="font-size:14px;color:#666;margin-bottom:8px;">对方手机号</div>
        <input id="input-phone" type="tel" placeholder="请输入手机号" style="width:100%;padding:10px 12px;border:1px solid #e0e0e0;border-radius:8px;font-size:14px;box-sizing:border-box;">
      </div>

      <button id="btn-create-task" style="width:100%;background:linear-gradient(135deg,#ff8c00,#ff6d00);color:#fff;border:none;border-radius:24px;padding:14px;font-size:16px;font-weight:600;cursor:pointer;margin-bottom:16px;">确认创建并支付</button>
    `;
    container.appendChild(form);

    // 任务类型选择
    form.querySelectorAll('.task-type-option').forEach(opt => {
      opt.addEventListener('click', () => {
        form.querySelectorAll('.task-type-option').forEach(o => {
          o.style.border = o.dataset.type === 'steps' ? '1px solid #e0e0e0' : '1px solid #e0e0e0';
          o.style.background = '#f5f5f5';
          o.style.opacity = '0.5';
          o.querySelector('div:last-child').style.color = '#999';
        });
        opt.style.border = '2px solid #ff8c00';
        opt.style.background = '#fff5e6';
        opt.style.opacity = '1';
        opt.querySelector('div:last-child').style.color = '#ff8c00';
      });
    });

    // 创建按钮
    form.querySelector('#btn-create-task').addEventListener('click', () => {
      const cash = parseFloat(form.querySelector('#input-cash').value) || 1;
      const target = parseInt(form.querySelector('#input-target').value) || 3000;
      const phone = form.querySelector('#input-phone').value || '138****9999';
      App.createTask({ cash, target, phone });
    });
  }

  function createTask(data) {
    // 模拟支付
    const html = `
      <div style="background:#fff;border-radius:16px;padding:32px 24px;text-align:center;max-width:280px;width:80%;margin:0 16px;box-shadow:0 10px 40px rgba(0,0,0,0.3);">
        <div style="font-size:48px;margin-bottom:12px;">⏳</div>
        <div style="font-size:16px;color:#333;margin-bottom:8px;">正在创建任务...</div>
        <div style="font-size:13px;color:#999;">任务金 ${data.cash.toFixed(2)}元/天</div>
      </div>
    `;
    _showModal(html, 'create-loading-modal');

    setTimeout(() => {
      _closeModal();
      _state.tasks.push({
        id: _state.tasks.length + 1,
        type: 'steps',
        name: '每日步数打卡',
        target: data.target,
        rewardCash: data.cash,
        rewardGoods: { type: 'egg', name: '新鲜鸡蛋', perCheckin: 1, exchangeThreshold: 12 },
        checkinHistory: [],
        goodsCollected: 0,
        totalCashEarned: 0,
        todayChecked: false
      });

      const successHtml = `
        <div style="background:#fff;border-radius:16px;padding:32px 24px;text-align:center;max-width:280px;width:80%;margin:0 16px;box-shadow:0 10px 40px rgba(0,0,0,0.3);">
          <div style="font-size:48px;margin-bottom:12px;">✅</div>
          <div style="font-size:16px;font-weight:600;color:#333;margin-bottom:8px;">任务创建成功！</div>
          <div style="font-size:13px;color:#666;margin-bottom:16px;">对方会在打开打卡端时自动收到任务</div>
          <button id="btn-create-success" style="width:100%;background:linear-gradient(135deg,#4a90d9,#7bb3f0);color:#fff;border:none;border-radius:24px;padding:12px;font-size:15px;cursor:pointer;">返回首页</button>
        </div>
      `;
      _showModal(successHtml, 'create-success-modal');
      document.getElementById('btn-create-success').addEventListener('click', () => {
        _closeModal();
        App.navigate('home');
      });
    }, 1500);
  }

  // ---- 公共接口 ----
  function getState() { return JSON.parse(JSON.stringify(_state)); }

  function resetTodayCheckin() {
    _state.tasks[0].todayChecked = false;
    _state.tasks[0].goodsCollected -= _state.tasks[0].rewardGoods.perCheckin;
    _state.tasks[0].totalCashEarned -= _state.tasks[0].rewardCash;
    _state.earnings.pop();
    _renderCurrentPage();
  }

  return { init, switchTab, navigate, getState, checkin, exchange, createTask, resetTodayCheckin };
})();

// 自动初始化
window.addEventListener('DOMContentLoaded', function() {
  App.init('#app-root');
});
</script>
