            height: 40px;
        }

            background: #8b5cf6;

        .bottom-nav-wrapper {

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const defaultKnowledgePackages = [
            { id: 1, name: '一年级数学上册', subject: '数学', grade: '一年级', semester: '上册', isUrgent: false, points: [
                { id: 101, name: '10以内加减法', mastery: 95, status: 'mastered', lastReview: '2025-07-10' },
                { id: 102, name: '认识数字1-10', mastery: 90, status: 'mastered', lastReview: '2025-07-09' },

            { id: 2, name: '一年级语文上册', subject: '语文', grade: '一年级', semester: '上册', isUrgent: false, points: [
                { id: 201, name: '汉语拼音', mastery: 88, status: 'mastered', lastReview: '2025-07-10' },

                { id: 302, name: '常见颜色单词', mastery: 78, status: 'learning', lastReview: '2025-07-08' },

            ]},
            { id: 99, name: '紧急知识点', subject: '综合', grade: '全部', semester: '紧急', isUrgent: true, points: [
                { id: 9901, name: '凑十法', mastery: 30, status: 'weak', lastReview: '2025-07-10' },
                { id: 9902, name: '平翘舌音区分', mastery: 25, status: 'weak', lastReview: '2025-07-10' }
            ]}
        ];

        const generatePracticePlan = (packages, dailyTarget, currentGrade) => {
            let plan = [];
            const filteredPackages = packages.filter(p => p.grade === currentGrade || p.isUrgent || p.isPersonal);
            
            filteredPackages.forEach(pkg => {
                pkg.points.forEach(point => {
                    const now = new Date();
                    const lastReview = point.lastReview ? new Date(point.lastReview) : new Date(0);
                    const diffDays = Math.floor((now - lastReview) / (1000 * 60 * 60 * 24));
                    
                    let shouldReview = false;
                    if (pkg.isUrgent) {
                        shouldReview = true;
                    } else if (point.status === 'weak') {
                        shouldReview = diffDays >= 0;
                    } else if (point.status === 'learning') {
                        shouldReview = diffDays >= 1;
                    } else if (point.status === 'mastered') {
                        const reviewDays = [1, 3, 7, 15];
                        shouldReview = reviewDays.includes(diffDays);
                    }
                    
                    if (shouldReview) {
                        plan.push({
                            ...point,
                            packageName: pkg.name,
                            packageId: pkg.id,
                            subject: pkg.subject,
                            isUrgent: pkg.isUrgent
                        });
                    }
                });
            });
            
            plan.sort((a, b) => {
                if (a.isUrgent && !b.isUrgent) return -1;
                if (!a.isUrgent && b.isUrgent) return 1;
                if (a.status === 'weak' && b.status !== 'weak') return -1;
                if (a.status !== 'weak' && b.status === 'weak') return 1;
                return a.mastery - b.mastery;
            });
            
            return plan.slice(0, dailyTarget);
        };

        function AIChat({ onAddPoint, currentGrade }) {
            const [isOpen, setIsOpen] = useState(false);
            const [messages, setMessages] = useState([]);
            const [isRecording, setIsRecording] = useState(false);
            const [inputText, setInputText] = useState('');
            const [suggestedPoint, setSuggestedPoint] = useState(null);
            const [isAdded, setIsAdded] = useState(false);
            const [isTyping, setIsTyping] = useState(false);

            const detectKnowledgePoint = (text) => {
                const mathPatterns = ['加减', '乘除', '几何', '方程', '分数', '小数', '图形', '面积', '周长', '体积', '角度', '公式'];
                const chinesePatterns = ['拼音', '汉字', '成语', '古诗', '课文', '阅读', '写作', '词语'];
                const englishPatterns = ['单词', '语法', '句型', '时态', '音标', '阅读', '写作'];

                for (const pattern of mathPatterns) {
                    if (text.includes(pattern)) return { name: pattern + '知识', subject: '数学' };
                }
                for (const pattern of chinesePatterns) {
                    if (text.includes(pattern)) return { name: pattern + '知识', subject: '语文' };
                }
                for (const pattern of englishPatterns) {
                    if (text.includes(pattern)) return { name: pattern + '知识', subject: '英语' };
                }
                return null;
            };

            const knowledgePoints = {
                math: {
                    '一年级': ['20以内加减法', '认识数字', '比较大小', '找规律'],
                    '二年级': ['100以内加减法', '乘法口诀', '除法初步', '认识图形'],
                    '三年级': ['万以内加减法', '两位数乘一位数', '分数初步', '长方形正方形周长'],
                    '四年级': ['三位数乘两位数', '混合运算', '认识大数', '三角形'],
                    '五年级': ['小数加减法', '小数乘除法', '平行四边形面积', '长方体正方体'],
                    '六年级': ['分数乘除法', '百分数', '比例', '圆的面积']
                },
                chinese: {
                    '一年级': ['汉语拼音', '简单汉字', '词语搭配', '看图说话'],
                    '二年级': ['多音字', '近义词反义词', '造句', '日记'],
                    '三年级': ['成语', '阅读理解', '作文', '修辞手法'],
                    '四年级': ['古诗词', '说明文阅读', '作文写作', '标点符号'],
                    '五年级': ['文言文', '记叙文', '修辞手法运用', '修改病句'],
                    '六年级': ['古诗词鉴赏', '散文阅读', '议论文', '写作技巧']
                },
                english: {
                    '一年级': ['26个字母', '简单单词', '日常用语', '字母发音'],
                    '二年级': ['常见单词', '简单句型', '情景对话', '音标'],
                    '三年级': ['单词拼写', '一般现在时', '阅读短文', '写作句子'],
                    '四年级': ['比较级', '一般过去时', '阅读理解', '小作文'],
                    '五年级': ['现在进行时', '情态动词', '阅读技巧', '作文'],
                    '六年级': ['一般将来时', '宾语从句', '综合阅读', '英语写作']
                }
            };

            const analyzeQuestion = (text) => {
                let subject = 'unknown';
                let point = '';
                let grade = currentGrade;
                let questionType = 'general';
                let detailPoint = '';

                const mathKeywords = [
                    '加减', '乘除', '等于', '计算', '多少', '几', '倍', '平均', '和', '差', '积', '商',
                    '分数', '小数', '百分数', '比例', '方程', '解', '应用题', '几何', '图形', '面积',
                    '周长', '体积', '边长', '半径', '直径', '角', '三角形', '正方形', '长方形', '圆形',
                    '平行四边形', '梯形', '长方体', '正方体', '圆柱', '圆锥', '运算', '算式', '列式',
                    '余数', '整除', '因数', '倍数', '质数', '合数', '最大公因数', '最小公倍数',
                    '统计', '概率', '平均数', '统计图', '单位换算', '时间', '长度', '重量', '面积单位',
                    '进位', '退位', '凑十法', '破十法', '竖式', '口算',
                    '排队', '前面有', '后面有', '之间', '植树', '间隔', '锯木头', '剪绳子',
                    '鸡兔同笼', '相遇', '追及', '行程', '平均分', '比多', '比少', '几个人', '多少人',
                    '共多少', '一共', '第几', '排第'
                ];

                const chineseKeywords = [
                    '拼音', '汉字', '词语', '成语', '古诗', '诗词', '课文', '作文', '写作',
                    '造句', '日记', '修辞', '比喻', '拟人', '排比', '夸张', '反问', '设问',
                    '近义词', '反义词', '多音字', '形近字', '同音字', '词语搭配', '标点符号',
                    '句子成分', '主谓宾', '文言文', '翻译', '实词', '虚词', '名句', '默写',
                    '阅读理解', '概括', '中心思想', '段落大意', '人物形象', '写作手法',
                    '部首', '笔画', '笔顺', '成语故事', '寓言', '童话', '记叙文', '说明文', '议论文'
                ];

                const englishKeywords = [
                    '单词', '词汇', '语法', '时态', '句型', '句子', '音标', '发音', '拼写',
                    '名词', '动词', '形容词', '副词', '介词', '连词', '代词', '冠词',
                    '一般现在时', '一般过去时', '一般将来时', '现在进行时', '过去进行时',
                    '现在完成时', '过去完成时', '比较级', '最高级', '被动语态', '情态动词',
                    '从句', '宾语从句', '定语从句', '状语从句', '阅读', '写作', '口语',
                    '对话', '翻译', '完形填空', '选词填空', '词性', '词义', '搭配', '短语'
                ];

                const hasMathSymbols = /[\d+\-\×\*\/÷％％=\(\)]/.test(text) && text.match(/\d/) && text.match(/[\-\+\×\*\/=]/);
                const hasEnglishWords = /[a-zA-Z]{2,}/.test(text);
                const hasChineseChars = /[一-龥]{2,}/.test(text);
                const isEnglishQuery = text.includes('英文') || text.includes('英语') || 
                                       text.includes('怎么说') || text.includes('怎么读') ||
                                       text.includes('用英') || text.includes('translate') ||
                                       text.includes('翻译') || text.includes('音标') ||
                                       text.includes('单词') || text.includes('词汇') ||
                                       text.includes('语法') || text.includes('时态') ||
                                       text.includes('句型') || text.includes('介词') ||
                                       text.includes('冠词') || text.includes('动词') ||
                                       text.includes('名词') || text.includes('形容词') ||
                                       text.includes('副词') || text.includes('代词') ||
                                       text.includes('连词') || text.includes('复数') ||
                                       text.includes('比较级') || text.includes('最高级') ||
                                       text.includes('进行时') || text.includes('完成时') ||
                                       /\bin\s+(the\s+)?(class|school|room|park|classroom)/i.test(text) ||
                                       /\bthe\s+(class|school|room|park|classroom)/i.test(text) ||
                                       /\b(am|is|are|was|were|do|does|did|have|has|had|can|could|will|would)\s+/i.test(text);

                // 检查是否包含数学关键词
                const hasMathKeyword = mathKeywords.some(keyword => text.includes(keyword));
                // 检查是否包含语文关键词
                const hasChineseKeyword = chineseKeywords.some(keyword => text.includes(keyword));

                if (isEnglishQuery) {
                    subject = '英语';
                } else if (hasMathSymbols) {
                    subject = '数学';
                } else if (hasMathKeyword) {
                    subject = '数学';
                } else if (hasEnglishWords) {
                    subject = '英语';
                } else if (hasChineseKeyword) {
                    subject = '语文';
                } else if (hasChineseChars) {
                    subject = '语文';
                }

                if (subject === 'unknown') {
                    for (const keyword of englishKeywords) {
                        if (text.includes(keyword)) {
                            subject = '英语';
                            break;
                        }
                    }
                }
                if (subject === 'unknown') {
                    for (const keyword of chineseKeywords) {
                        if (text.includes(keyword)) {
                            subject = '语文';
                            break;
                        }
                    }
                }

                if (subject === '数学') {
                    const mathMatch = text.match(/(\d+)\s*([\+\-\×\*\/÷])\s*(\d+)/);
                    if (mathMatch) {
                        const num1 = parseInt(mathMatch[1]);
                        const op = mathMatch[2];
                        const num2 = parseInt(mathMatch[3]);
                        questionType = 'calculation';
                        if (op === '+' || op === '-') {
                            const hasCarry = op === '+' 
                                ? (num1 % 10 + num2 % 10 >= 10)
                                : (num1 % 10 < num2 % 10);
                            const num1Digits = num1.toString().length;
                            const num2Digits = num2.toString().length;
                            const maxDigits = Math.max(num1Digits, num2Digits);
                            
                            if (num1 <= 10 && num2 <= 10) {
                                point = '10以内加减法';
                                detailPoint = hasCarry ? '10以内进位加法' : '10以内加减法';
                                grade = '一年级';
                            } else if (num1 <= 20 && num2 <= 20) {
                                point = '20以内加减法';
                                if (op === '+') {
                                    detailPoint = hasCarry ? '20以内进位加法' : '20以内不进位加法';
                                } else {
                                    detailPoint = hasCarry ? '20以内退位减法' : '20以内不退位减法';
                                }
                                grade = '一年级';
                            } else if (num1 <= 100 && num2 <= 100) {
                                point = '100以内加减法';
                                if (maxDigits === 2) {
                                    if (op === '+') {
                                        detailPoint = hasCarry ? '两位数进位加法' : '两位数不进位加法';
                                    } else {
                                        detailPoint = hasCarry ? '两位数退位减法' : '两位数不退位减法';
                                    }
                                } else {
                                    detailPoint = '100以内加减法';
                                }
                                grade = '二年级';
                            } else if (num1 <= 1000 && num2 <= 1000) {
                                point = '万以内加减法';
                                detailPoint = '三位数加减法';
                                grade = '三年级';
                            } else {
                                point = '大数加减法';
                                detailPoint = '多位数加减法';
                                grade = '四年级';
                            }
                        } else if (op === '×' || op === '*') {
                            if (num1 <= 9 && num2 <= 9) {
                                point = '乘法口诀';
                                detailPoint = '表内乘法';
                                grade = '二年级';
                            } else if (num2 <= 9) {
                                point = '多位数乘一位数';
                                detailPoint = '两位数乘一位数';
                                grade = '三年级';
                            } else {
                                point = '多位数乘法';
                                detailPoint = '两位数乘两位数';
                                grade = '四年级';
                            }
                        } else if (op === '/' || op === '÷') {
                            if (num2 <= 9 && num1 % num2 === 0) {
                                point = '表内除法';
                                detailPoint = '用乘法口诀求商';
                                grade = '二年级';
                            } else {
                                point = '多位数除法';
                                detailPoint = num2 <= 9 ? '除数是一位数的除法' : '除数是两位数的除法';
                                grade = '四年级';
                            }
                        }
                    } else if (text.includes('应用题') || text.includes('解决问题')) {
                        point = '数学应用题';
                        detailPoint = '解决问题';
                        questionType = 'word_problem';
                        grade = '三年级';
                    } else if (text.includes('凑十法')) {
                        point = '20以内进位加法';
                        detailPoint = '凑十法';
                        grade = '一年级';
                    } else if (text.includes('破十法')) {
                        point = '20以内退位减法';
                        detailPoint = '破十法';
                        grade = '一年级';
                    } else if (text.includes('竖式') || text.includes('列竖式')) {
                        point = '竖式计算';
                        detailPoint = '竖式加减法';
                        grade = '二年级';
                    } else if (text.includes('面积')) {
                        if (text.includes('长方形') || text.includes('正方形')) {
                            point = '长方形正方形面积';
                            detailPoint = '长方形和正方形的面积';
                            grade = '三年级';
                        } else if (text.includes('平行四边形')) {
                            point = '平行四边形面积';
                            detailPoint = '平行四边形的面积';
                            grade = '五年级';
                        } else if (text.includes('三角形')) {
                            point = '三角形面积';
                            detailPoint = '三角形的面积';
                            grade = '五年级';
                        } else if (text.includes('梯形')) {
                            point = '梯形面积';
                            detailPoint = '梯形的面积';
                            grade = '五年级';
                        } else if (text.includes('圆')) {
                            point = '圆的面积';
                            detailPoint = '圆的面积';
                            grade = '六年级';
                        }
                    } else if (text.includes('周长')) {
                        point = '图形周长';
                        detailPoint = '长方形和正方形的周长';
                        grade = '三年级';
                    } else if (text.includes('分数')) {
                        if (text.includes('加减法')) {
                            point = '分数加减法';
                            detailPoint = '异分母分数加减法';
                            grade = '五年级';
                        } else if (text.includes('乘除法')) {
                            point = '分数乘除法';
                            detailPoint = '分数乘法和除法';
                            grade = '六年级';
                        } else {
                            point = '分数初步认识';
                            detailPoint = '分数的意义';
                            grade = '三年级';
                        }
                    } else if (text.includes('小数')) {
                        if (text.includes('加减法')) {
                            point = '小数加减法';
                            detailPoint = '小数加法和减法';
                            grade = '四年级';
                        } else if (text.includes('乘除法')) {
                            point = '小数乘除法';
                            detailPoint = '小数乘法和除法';
                            grade = '五年级';
                        } else {

                const prevAiMsg = history.length > 0 ? history[history.length - 1] : null;
                const prevAnalysis = history.find(m => m.role === 'ai' && m.content.includes('题目分析'));
                
                if (prevAiMsg && prevAiMsg.role === 'ai') {
                    if (prevAiMsg.content.includes('解题步骤') || prevAiMsg.content.includes('学习步骤')) {
                        if (text.includes('继续') || text.includes('下一步') || text.includes('然后呢')) {
                            if (prevAiMsg.content.includes('数学')) {
                                return '好的！我们继续学习数学~ 请告诉我你想练习的下一道题目，或者有什么不明白的地方？';
                            } else if (prevAiMsg.content.includes('语文')) {
                                return '好的！我们继续学习语文~ 请告诉我你想练习的下一个内容，或者有什么不明白的地方？';
                            } else if (prevAiMsg.content.includes('英语')) {
                                return '好的！我们继续学习英语~ 请告诉我你想练习的下一个内容，或者有什么不明白的地方？';
                            }
                        }
                        
                        if (text.includes('再来一题') || text.includes('再做一道')) {
                            return '好的！请告诉我你想练习哪方面的题目，我来帮你出题~';
                        }
                        
                        if (text.includes('还有吗') || text.includes('还有其他的')) {
                            return '当然有！你想了解哪方面的知识？我可以继续给你讲解~';
                        }
                    }
                }

                if (prevAnalysis) {
                    const prevSubjectMatch = prevAnalysis.content.match(/学科：(\S+)/);
                    if (prevSubjectMatch && prevSubjectMatch[1] !== '自动识别中') {
                        const prevSubject = prevSubjectMatch[1];
                        if (text.includes('这道题') || text.includes('这个') || text.includes('那道题')) {
                            if (prevSubject === '数学') {
                                return `我们刚才讨论的是数学${prevAnalysis.content.includes('知识点：') ? prevAnalysis.content.match(/知识点：(\S+)/)[1] : ''}的内容。请告诉我具体的问题，我来帮你解答！`;
                            } else if (prevSubject === '语文') {
                                return `我们刚才讨论的是语文${prevAnalysis.content.includes('知识点：') ? prevAnalysis.content.match(/知识点：(\S+)/)[1] : ''}的内容。请告诉我具体的问题，我来帮你解答！`;
                            } else if (prevSubject === '英语') {
                                return `我们刚才讨论的是英语${prevAnalysis.content.includes('知识点：') ? prevAnalysis.content.match(/知识点：(\S+)/)[1] : ''}的内容。请告诉我具体的问题，我来帮你解答！`;
                            }
                        }
                    }
                }

                const greetings = ['你好', '嗨', 'hello', 'hi', '哈喽', '早上好', '下午好', '晚上好'];
                if (greetings.some(g => text.includes(g))) {
                    const now = new Date();
                    const timeOfDay = now.getHours() < 12 ? '早上' : now.getHours() < 18 ? '下午' : '晚上';
                    return `${timeOfDay}好！我是AI小知，专门帮${currentGrade}的同学解决学习问题。无论是数学、语文还是英语，我都会一步步引导你找到答案！有什么问题可以问我~`;
                }

                const thanks = ['谢谢', '感谢', 'thanks', '太谢谢你了'];
                if (thanks.some(t => text.includes(t))) {
                    return `不客气！有问题随时来找我~ 如果还有其他学习上的困惑，我很乐意帮忙！💪`;
                }

                const confirmations = ['对', '是的', '没错', '好的', '知道了'];
                if (confirmations.some(c => text.includes(c))) {
                    if (prevAiMsg && prevAiMsg.content.includes('解题步骤')) {
                        return '太棒了！你理解了这道题的解法。如果还有其他问题，随时问我~';
                    } else if (prevAiMsg && prevAiMsg.content.includes('学习步骤')) {
                        return '很好！继续加油！你想练习哪方面的题目？';
                    } else {
                        return '好的！那我们继续~ 你想解决哪个问题？';
                    }
                }

                const denials = ['不对', '不是', '错了', '不对吧'];
                if (denials.some(d => text.includes(d))) {
                    return '哦，可能我理解错了！请再详细描述一下你的问题，我重新帮你分析~';
                }

                const helpRequests = ['帮帮我', '求助', '求救', '救命'];
                if (helpRequests.some(h => text.includes(h))) {
                    return '别担心！我来帮你~ 请告诉我你遇到了什么问题，无论是数学、语文还是英语，我都会耐心帮你解答！';
                }

                if (text.includes('怎么') || text.includes('如何')) {
                    return `📚 题目分析\n学科：自动识别中\n知识点：方法类问题\n\n🎯 解题思路\n\n第一步：先明确问题的核心是什么\n第二步：回忆${currentGrade}学过的相关方法\n第三步：尝试用不同方法解决\n\n请告诉我具体的题目，我来帮你分析！`;
                }

                if (text.includes('为什么') || text.includes('原因') || text.includes('原理')) {
                    return `📚 题目分析\n学科：自动识别中\n知识点：原理类问题\n\n🎯 理解思路\n\n第一步：观察相关现象\n第二步：思考背后的规律\n第三步：总结原理\n\n请告诉我具体想了解哪个知识点的原理？`;
                }

                if (text.includes('不会') || text.includes('不懂') || text.includes('不明白') || text.includes('不清楚')) {
                    return `没关系！${currentGrade}刚开始学习这些内容，确实会觉得有点难。让我们慢慢分解：\n\n第一步：告诉我你哪里不懂\n第二步：我们从最基础的概念开始\n第三步：一步一步来，你一定可以的！💪\n\n请描述一下你遇到的问题~`;
                }

                if (text.includes('复习') || text.includes('回顾')) {
                    return `好的！我们来复习一下~ \n\n请告诉我你想复习哪个学科的内容？\n• 数学：可以复习加减法、乘法口诀、几何图形等\n• 语文：可以复习拼音、成语、古诗词等\n• 英语：可以复习单词、时态、句型等`;
                }

                if (text.includes('练习') || text.includes('做题')) {
                    return `好的！我们来做练习~ \n\n请告诉我你想练习哪个学科的题目？\n• 数学：加减法、乘法、除法、应用题等\n• 语文：拼音、词语、句子、阅读理解等\n• 英语：单词、语法、时态、阅读理解等`;
                }

                if (subject !== 'unknown' && !point) {
                    return `📚 题目分析\n学科：${subject}\n适合年级：${grade}\n\n我识别到你在问${subject}问题，但还不确定具体是哪个知识点。\n\n请告诉我更具体的问题，比如：\n${subject === '数学' ? '• 15+28等于多少？\n• 长方形的面积怎么算？\n• 什么是分数？' : ''}\n${subject === '语文' ? '• "美丽"的近义词是什么？\n• 如何写一篇作文？\n• 古诗《静夜思》的意思是什么？' : ''}\n${subject === '英语' ? '• apple的复数形式是什么？\n• 什么是一般现在时？\n• 如何用英语表达"我喜欢看书"？' : ''}\n\n我会一步步引导你找到答案！`;
                }

                return `📚 题目分析\n学科：自动识别中\n\n我来帮你分析这个问题！但我需要更多信息~ \n\n请直接告诉我题目内容，比如：\n• 数学题：15+28等于多少？\n• 语文题："美丽"的近义词是什么？\n• 英语题：apple的复数形式是什么？\n\n我会自动识别学科并一步步引导你解决！`;
            };

            const handleSend = async (text) => {
                if (!text.trim()) return;
                setMessages(prev => [...prev, { role: 'user', content: text }]);
                setInputText('');
                setIsTyping(true);
                await new Promise(resolve => setTimeout(resolve, 1500));
                const analysis = analyzeQuestion(text);
                setIsAdded(false);
                if (analysis.subject !== 'unknown' && analysis.point) {
                    setSuggestedPoint({ name: analysis.detailPoint || analysis.point, subject: analysis.subject });
                } else {
                    const point = detectKnowledgePoint(text);
                    setSuggestedPoint(point);
                }
                const aiResponse = getStepByStepResponse(text, messages);
                setMessages(prev => [...prev, { role: 'ai', content: aiResponse }]);
                setIsTyping(false);
            };

            const handleAddSuggestedPoint = () => {
                if (suggestedPoint && !isAdded) {
                    onAddPoint(suggestedPoint);
                    setIsAdded(true);
                }
            };

            const startRecording = () => {
                if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    const recognition = new SpeechRecognition();
                    recognition.lang = 'zh-CN';
                    recognition.continuous = false;
                    recognition.interimResults = false;
                    recognition.onstart = () => setIsRecording(true);
                    recognition.onend = () => setIsRecording(false);
                    recognition.onresult = (event) => {
                        const transcript = event.results[0][0].transcript;
                        setInputText(transcript);
                    };
                    recognition.onerror = () => {
                        setIsRecording(false);
                        alert('语音识别失败，请重试或手动输入');
                    };
                    recognition.start();
                } else {
                    alert('您的浏览器不支持语音识别');
                }
            };

            return (
                <>
                    <button
                        onClick={() => setIsOpen(true)}
                        className="absolute right-4 bottom-24 w-12 h-12 bg-gradient-to-br from-purple-500 via-pink-500 to-purple-600 rounded-full shadow-xl flex items-center justify-center text-white z-40 hover:scale-110 transition-transform"
                    >
                        <span className="text-xl">🤖</span>
                    </button>

                    {isOpen && (
                        <div className="absolute inset-0 bg-black bg-opacity-50 flex items-end justify-center z-50">
                            <div className="bg-white rounded-t-2xl w-full h-auto max-h-[55vh] flex flex-col overflow-hidden">
                                <div className="flex justify-between items-center px-3 py-2 border-b border-gray-100 flex-shrink-0">
                                    <div className="flex items-center space-x-1.5">
                                        <div className="w-6 h-6 bg-gradient-to-br from-purple-500 to-pink-500 rounded-full flex items-center justify-center text-white text-[10px]">🤖</div>
                                        <div>
                                            <div className="font-bold text-xs">AI小知</div>
                                            <div className="text-[9px] text-gray-400">自动识别学科</div>
                                        </div>
                                    </div>
                                    <button onClick={() => setIsOpen(false)} className="w-5 h-5 bg-gray-100 rounded-full flex items-center justify-center text-gray-500 text-[10px]">✕</button>
                                </div>

                                <div className="flex-1 overflow-y-auto overflow-x-hidden px-2.5 py-2 space-y-2" style={{ maxHeight: 'calc(55vh - 80px)' }}>
                                    {messages.length === 0 && (
                                        <div className="text-center py-4">
                                            <div className="text-2xl mb-1.5">👋</div>
                                            <p className="text-xs text-gray-500">你好！我是AI小知</p>
                                            <p className="text-[10px] text-gray-400 mt-0.5">输入问题，自动识别学科</p>
                                        </div>
                                    )}

                                    {messages.map((msg, index) => (
                                        <div key={index} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                            {msg.role === 'ai' && (
                                                <div className="w-5 h-5 bg-gradient-to-br from-purple-500 to-pink-500 rounded-full flex items-center justify-center text-white text-[8px] mr-1 mt-0.5 flex-shrink-0">🤖</div>
                                            )}
                                            <div className={`${
                                                msg.role === 'user'
                                                    ? 'max-w-[70%] px-2 py-1 rounded-xl rounded-tr-sm text-xs bg-gradient-to-r from-purple-500 to-pink-500 text-white'
                                                    : 'max-w-[80%] rounded-xl rounded-tl-sm text-[11px] bg-gray-50 text-gray-800 border border-gray-100'
                                            }`}>
                                                {msg.role === 'user' ? msg.content : (
                                                    <div className="px-1.5 py-0.5 space-y-0.5">
                                                        {msg.content.split('\n').map((line, i) => {
                                                            if (!line.trim()) return <div key={i} className="h-0.5"></div>;
                                                            if (line.startsWith('📚') || line.startsWith('🎯') || line.startsWith('💡') || line.startsWith('📐') || line.startsWith('📝')) {
                                                                return <div key={i} className="font-bold text-purple-700 mt-1 text-[11px]">{line}</div>;
                                                            }
                                                            if (line.startsWith('✅')) {
                                                                return <div key={i} className="font-bold text-green-600 bg-green-50 px-1 py-0.5 rounded-md mt-0.5 text-[11px]">{line}</div>;
                                                            }
                                                            if (line.startsWith('━━')) {
                                                                return <div key={i} className="border-t border-dashed border-purple-200 my-0.5"></div>;
                                                            }
                                                            if (line.startsWith('学科：') || line.startsWith('知识点：') || line.startsWith('适合年级：')) {
                                                                const [label, value] = line.split('：');
                                                                return <div key={i} className="flex items-center text-[10px]"><span className="text-gray-400 mr-1">{label}：</span><span className={label === '知识点' ? 'text-purple-600 font-medium' : 'text-gray-700'}>{value}</span></div>;
                                                            }
                                                            if (/^\d+\./.test(line)) {
                                                                return <div key={i} className="pl-1 text-gray-700 leading-relaxed">{line}</div>;
                                                            }
                                                            if (line.startsWith('•') || line.startsWith('例')) {
                                                                return <div key={i} className="pl-2 text-gray-600 text-[10px] leading-relaxed">{line}</div>;
                                                            }
                                                            return <div key={i} className="text-gray-700 leading-relaxed">{line}</div>;
                                                        })}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    ))}

                                    {isTyping && (
                                        <div className="flex justify-start">
                                            <div className="w-5 h-5 bg-gradient-to-br from-purple-500 to-pink-500 rounded-full flex items-center justify-center text-white text-[8px] mr-1 mt-0.5 flex-shrink-0">🤖</div>
                                            <div className="bg-gray-50 px-2.5 py-1.5 rounded-xl rounded-tl-sm border border-gray-100">
                                                <div className="flex space-x-0.5">
                                                    <div className="w-0.5 h-0.5 bg-purple-400 rounded-full animate-bounce" style={{ animationDelay: '0ms' }}></div>
                                                    <div className="w-0.5 h-0.5 bg-purple-400 rounded-full animate-bounce" style={{ animationDelay: '150ms' }}></div>
                                                    <div className="w-0.5 h-0.5 bg-purple-400 rounded-full animate-bounce" style={{ animationDelay: '300ms' }}></div>
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {suggestedPoint && (
                                        <div className="bg-gradient-to-r from-purple-50 to-pink-50 rounded-lg p-2 border border-purple-100">
                                            <div className="flex items-center justify-between mb-1">
                                                <div className="flex items-center space-x-1">
                                                    <span className="text-xs">⭐</span>
                                                    <span className="text-[10px] font-bold text-purple-700">发现知识点</span>
                                                </div>
                                                {isAdded && (
                                                    <span className="text-[9px] text-green-600 font-medium">✓ 已添加</span>
                                                )}
                                            </div>
                                            <div className="flex items-center justify-between">
                                                <div>
                                                    <div className="text-[11px] font-bold text-gray-700">{suggestedPoint.name}</div>
                                                    <div className="text-[9px] text-gray-400">{currentGrade} {suggestedPoint.subject}</div>
                                                </div>
                                                <button onClick={handleAddSuggestedPoint} disabled={isAdded} className={`px-2 py-0.5 rounded-md text-[10px] font-bold transition ${
                                                    isAdded
                                                        ? 'bg-gray-200 text-gray-500 cursor-default'
                                                        : 'bg-gradient-to-r from-purple-500 to-pink-500 text-white active:scale-95'
                                                }`}>
                                                    {isAdded ? '已添加' : '+ 添加'}
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div className="px-2.5 py-2 border-t border-gray-100 flex-shrink-0 bg-white">
                                    <div className="flex items-center space-x-1.5">
                                        <button onClick={startRecording} className={`w-7 h-7 rounded-full flex items-center justify-center transition text-[10px] flex-shrink-0 ${
                                            isRecording ? 'bg-red-500 text-white animate-pulse' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                                        }`}>🎤</button>
                                        <input type="text" value={inputText} onChange={(e) => setInputText(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && handleSend(inputText)} placeholder="输入问题" className="flex-1 px-2.5 py-1.5 bg-gray-100 rounded-full text-xs focus:outline-none focus:ring-2 focus:ring-purple-300" />
                                        <button onClick={() => handleSend(inputText)} disabled={!inputText.trim()} className={`w-7 h-7 rounded-full flex items-center justify-center transition text-[10px] flex-shrink-0 ${
                                            inputText.trim() ? 'bg-gradient-to-r from-purple-500 to-pink-500 text-white' : 'bg-gray-100 text-gray-400 cursor-not-allowed'
                                        }`}>➤</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </>
            );
        }

        function App() {
            const [currentPage, setCurrentPage] = useState('practice');
            const [knowledgePackages, setKnowledgePackages] = useState(defaultKnowledgePackages);
            const [userSettings, setUserSettings] = useState({
                grade: '一年级',
                dailyTarget: 10,
                reminderEnabled: true,
                reminderTime: '20:00'
            });
            const [showAddModal, setShowAddModal] = useState(false);
            const [showAddPackageModal, setShowAddPackageModal] = useState(false);

            const [todayStats, setTodayStats] = useState({
                completed: 0,
                toStrengthen: 0
            });

            const practicePlan = useMemo(() => {
                return generatePracticePlan(knowledgePackages, userSettings.dailyTarget, userSettings.grade);
            }, [knowledgePackages, userSettings.dailyTarget, userSettings.grade]);

            const updatePointMastery = (packageId, pointId, newMastery, newStatus, assessLevel) => {
                setKnowledgePackages(prev => prev.map(pkg => {
                    if (pkg.id === packageId) {
                        return {
                            ...pkg,
                            points: pkg.points.map(point => {
                                if (point.id === pointId) {
                                    return {
                                        ...point,
                                        mastery: newMastery,
                                        status: newStatus,
                                        lastReview: new Date().toISOString().split('T')[0]
                                    };
                                }
                                return point;
                            })
                        };
                    }
                    return pkg;
                }));

                if (assessLevel === 1) {
                    setTodayStats(prev => ({
                        ...prev,
                        completed: Math.min(userSettings.dailyTarget, prev.completed + 1),
                        toStrengthen: prev.toStrengthen + 1
                    }));
                } else {
                    setTodayStats(prev => ({
                        ...prev,
                        completed: Math.min(userSettings.dailyTarget, prev.completed + 1)
                    }));
                }
            };

            const addKnowledgePoint = (pointData) => {
                let targetPackage = knowledgePackages.find(p => p.isPersonal && p.subject === pointData.subject);

                if (targetPackage) {
                    setKnowledgePackages(prev => prev.map(pkg => {
                        if (pkg.id === targetPackage.id) {
                            return {
                                ...pkg,
                                points: [...pkg.points, {
                                    id: Date.now(),
                                    name: pointData.name,
                                    mastery: 0,
                                    status: 'weak',
                                    lastReview: new Date().toISOString().split('T')[0]
                                }]
                            };
                        }
                        return pkg;
                    }));
                } else {
                    setKnowledgePackages(prev => [...prev, {
                        id: Date.now(),
                        name: `个性知识点-${pointData.subject}`,
                        subject: pointData.subject,
                        grade: userSettings.grade,
                        semester: '其他',
                        isUrgent: false,
                        isPersonal: true,
                        points: [{
                            id: Date.now(),
                            name: pointData.name,
                            mastery: 0,
                            status: 'weak',
                            lastReview: new Date().toISOString().split('T')[0]
                        }]
                    }]);
                }
            };

            const addKnowledgePackage = (packageData) => {
                setKnowledgePackages(prev => [...prev, {
                    id: Date.now(),
                    name: packageData.name,
                    subject: packageData.subject,
                    grade: packageData.grade,
                    semester: packageData.semester || '其他',
                    isUrgent: packageData.isUrgent || false,
                    points: []
                }]);
            };

            const deleteKnowledgePoint = (packageId, pointId) => {
                setKnowledgePackages(prev => prev.map(pkg => {
                    if (pkg.id === packageId) {
                        return {
                            ...pkg,
                            points: pkg.points.filter(p => p.id !== pointId)
                        };
                    }
                    return pkg;
                }));
            };

            const updateKnowledgePoint = (packageId, pointId, newName) => {
                setKnowledgePackages(prev => prev.map(pkg => {
                    if (pkg.id === packageId) {
                        return {
                            ...pkg,
                            points: pkg.points.map(p => {
                                if (p.id === pointId) {
                                    return { ...p, name: newName };
                                }
                                return p;
                            })
                        };
                    }
                    return pkg;
                }));
            };

            return (
                <div className="app-container">
                    <main className="flex-1 overflow-y-auto scrollbar-hide">
                        {currentPage === 'practice' && (
                            <PracticePage 
                                plan={practicePlan} 
                                onAssess={updatePointMastery}
                                dailyTarget={userSettings.dailyTarget}
                                todayStats={todayStats}
                            />
                        )}
                        {currentPage === 'library' && (
                            <LibraryPage 
                                packages={knowledgePackages} 
                                currentGrade={userSettings.grade}
                                onAddPackage={() => setShowAddPackageModal(true)}
                                onDeletePoint={deleteKnowledgePoint}
                                onUpdatePoint={updateKnowledgePoint}
                            />
                        )}
                        {currentPage === 'guardian' && (
                            <GuardianPage 
                                packages={knowledgePackages}
                                onUpdateMastery={updatePointMastery}
                            />
                        )}
                        {currentPage === 'profile' && (
                            <ProfilePage 
                                settings={userSettings} 
                                onUpdateSettings={setUserSettings}
                                packages={knowledgePackages}
                            />
                        )}
                        {currentPage === 'add' && (
                            <AddPointPage 
                                onAdd={addKnowledgePoint}
                                currentGrade={userSettings.grade}
                                onBack={() => setCurrentPage('practice')}
                            />
                        )}

                const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
                const month = now.getMonth() + 1;

                        newStatus = 'weak';

                    case 2:
                        newMastery = Math.min(100, newMastery + 15);
                        newStatus = newMastery >= 80 ? 'mastered' : newMastery >= 50 ? 'learning' : 'weak';
                        break;
                    case 3:
                        newMastery = Math.min(100, newMastery + 25);
                        newStatus = newMastery >= 80 ? 'mastered' : newMastery >= 50 ? 'learning' : 'weak';

        function KnowledgePointList({ points, packageId, onDelete, onUpdate }) {
            const [selectedPoints, setSelectedPoints] = useState([]);
            const [editingId, setEditingId] = useState(null);
            const [editValue, setEditValue] = useState('');

            const toggleSelect = (pointId) => {
                setSelectedPoints(prev => 
                    prev.includes(pointId) 
                        ? prev.filter(id => id !== pointId)
                        : [...prev, pointId]
                );
            };

            const selectAll = () => {
                if (selectedPoints.length === points.length) {
                    setSelectedPoints([]);
                } else {
                    setSelectedPoints(points.map(p => p.id));
                }
            };

            const deleteSelected = () => {
                selectedPoints.forEach(pointId => {
                    onDelete(packageId, pointId);
                });
                setSelectedPoints([]);
            };

            const startEdit = (point) => {
                setEditingId(point.id);
                setEditValue(point.name);
            };

            const saveEdit = (pointId) => {
                if (editValue.trim()) {
                    onUpdate(packageId, pointId, editValue.trim());
                }
                setEditingId(null);
                setEditValue('');
            };

            const cancelEdit = () => {
                setEditingId(null);
                setEditValue('');
            };

            return (
                <div>
                    {points.length > 1 && (
                        <div className="flex items-center justify-between mb-2">
                            <button 
                                onClick={selectAll}
                                className="text-[10px] text-white opacity-80 flex items-center"
                            >
                                <span className="mr-1">{selectedPoints.length === points.length ? '✓' : '○'}</span>
                                全选
                            </button>
                            {selectedPoints.length > 0 && (
                                <button 
                                    onClick={deleteSelected}
                                    className="text-[10px] bg-red-500 bg-opacity-80 px-2 py-0.5 rounded-full"
                                >
                                    删除 ({selectedPoints.length})
                                </button>
                            )}
                        </div>
                    )}
                    <div className="space-y-1">
                        {points.map(point => (
                            <div 
                                key={point.id}
                                className={`flex items-center space-x-2 p-2 rounded-lg ${
                                    selectedPoints.includes(point.id) 
                                        ? 'bg-white bg-opacity-40' 
                                        : 'bg-white bg-opacity-20'
                                }`}
                            >
                                {points.length > 1 && (
                                    <button 
                                        onClick={() => toggleSelect(point.id)}
                                        className={`w-4 h-4 rounded-full border-2 flex items-center justify-center ${
                                            selectedPoints.includes(point.id)
                                                ? 'bg-white border-white'
                                                : 'bg-transparent border-white'
                                        }`}
                                    >
                                        {selectedPoints.includes(point.id) && (
                                            <span className="text-[10px] font-bold">✓</span>
                                        )}
                                    </button>
                                )}
                                {editingId === point.id ? (
                                    <div className="flex-1 flex items-center space-x-1">
                                        <input 
                                            type="text"
                                            value={editValue}
                                            onChange={(e) => setEditValue(e.target.value)}
                                            className="flex-1 bg-white text-gray-800 text-xs rounded px-2 py-1 outline-none"
                                            autoFocus
                                            onBlur={saveEdit.bind(null, point.id)}

                                <select
                                    value={grade}
                                    onChange={(e) => setGrade(e.target.value)}
                                    className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-blue-400 bg-white"
                                >
                                    {grades.map(g => <option key={g}>{g}</option>)}
                                </select>
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1.5">描述</label>
                                <textarea
                                    value={description}
                                    onChange={(e) => setDescription(e.target.value)}
                                    placeholder="简单描述这个知识点包..."
                                    rows="3"
                                    className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-blue-400 resize-none"
                                />
                            </div>
                        </div>

                        <div className="p-5 border-t border-gray-100 flex space-x-3">
                            <button
                                onClick={onClose}
                                className="flex-1 py-2.5 bg-gray-100 text-gray-600 rounded-lg text-sm font-medium"
                            >
                                取消
                            </button>
                            <button
                                onClick={handleAdd}
                                disabled={!name}
                                className={`flex-1 py-2.5 rounded-lg text-sm font-medium transition ${
                                    name
                                        ? 'bg-gradient-to-r from-blue-500 to-purple-600 text-white'
                                        : 'bg-gray-100 text-gray-400 cursor-not-allowed'
                                }`}
                            >
                                创建
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
