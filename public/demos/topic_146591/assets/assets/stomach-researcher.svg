<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <!-- 身体渐变 -->
    <radialGradient id="bodyGrad" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFB6C1"/>
      <stop offset="50%" stop-color="#FF9AAE"/>
      <stop offset="100%" stop-color="#F08090"/>
    </radialGradient>
    <!-- 腮红渐变 -->
    <radialGradient id="blushGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B8A" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF6B8A" stop-opacity="0"/>
    </radialGradient>
    <!-- 白大褂渐变 -->
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F0F0"/>
    </linearGradient>
    <!-- 阴影 -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 地面阴影 -->
  <ellipse cx="100" cy="225" rx="55" ry="10" fill="#000000" opacity="0.1"/>

  <!-- 左腿 -->
  <ellipse cx="85" cy="210" rx="12" ry="18" fill="#FF9AAE"/>
  <ellipse cx="85" cy="210" rx="12" ry="18" fill="none" stroke="#E06070" stroke-width="2"/>

  <!-- 右腿 -->
  <ellipse cx="115" cy="210" rx="12" ry="18" fill="#FF9AAE"/>
  <ellipse cx="115" cy="210" rx="12" ry="18" fill="none" stroke="#E06070" stroke-width="2"/>

  <!-- 左手 -->
  <ellipse cx="45" cy="155" rx="14" ry="22" fill="#FF9AAE" transform="rotate(-20 45 155)"/>
  <ellipse cx="45" cy="155" rx="14" ry="22" fill="none" stroke="#E06070" stroke-width="2" transform="rotate(-20 45 155)"/>

  <!-- 右手 -->
  <ellipse cx="155" cy="155" rx="14" ry="22" fill="#FF9AAE" transform="rotate(20 155 155)"/>
  <ellipse cx="155" cy="155" rx="14" ry="22" fill="none" stroke="#E06070" stroke-width="2" transform="rotate(20 155 155)"/>

  <!-- 白大褂主体 -->
  <path d="M 55 130 
           Q 50 140 48 160 
           Q 45 190 50 210 
           L 75 210 
           L 75 170 
           Q 75 160 80 155 
           L 100 170 
           L 120 155 
           Q 125 160 125 170 
           L 125 210 
           L 150 210 
           Q 155 190 152 160 
           Q 150 140 145 130 
           Q 130 120 100 120 
           Q 70 120 55 130 Z" 
        fill="url(#coatGrad)" stroke="#D0D0D0" stroke-width="2"/>

  <!-- 白大褂领子 -->
  <path d="M 65 125 L 85 150 L 100 165 L 115 150 L 135 125" 
        fill="none" stroke="#E0E0E0" stroke-width="3" stroke-linecap="round"/>
  
  <!-- 白大褂口袋 -->
  <rect x="115" y="175" width="22" height="18" rx="3" fill="#F8F8F8" stroke="#D0D0D0" stroke-width="1.5"/>
  <line x1="115" y1="180" x2="137" y2="180" stroke="#D0D0D0" stroke-width="1"/>

  <!-- 白大褂纽扣 -->
  <circle cx="100" cy="155" r="3" fill="#E0E0E0"/>
  <circle cx="100" cy="175" r="3" fill="#E0E0E0"/>
  <circle cx="100" cy="195" r="3" fill="#E0E0E0"/>

  <!-- 身体主体（胃部形状） -->
  <path d="M 70 60 
           Q 60 80 55 110 
           Q 50 140 60 160 
           Q 75 175 100 175 
           Q 125 175 140 160 
           Q 150 140 145 110 
           Q 140 80 130 60 
           Q 120 40 100 40 
           Q 80 40 70 60 Z" 
        fill="url(#bodyGrad)" stroke="#E06070" stroke-width="2.5"/>

  <!-- 胃部高光 -->
  <ellipse cx="85" cy="75" rx="12" ry="8" fill="#FFFFFF" opacity="0.4" transform="rotate(-20 85 75)"/>
  <circle cx="80" cy="70" r="4" fill="#FFFFFF" opacity="0.5"/>

  <!-- 小呆毛 -->
  <path d="M 95 42 Q 90 25 100 20 Q 110 25 105 42" 
        fill="#FF9AAE" stroke="#E06070" stroke-width="2" stroke-linecap="round"/>

  <!-- 左眼 -->
  <g transform="translate(78, 95)">
    <!-- 眼镜框 -->
    <circle cx="0" cy="0" r="16" fill="none" stroke="#4A3728" stroke-width="3"/>
    <!-- 眼睛 -->
    <circle cx="0" cy="0" r="8" fill="#2C1810"/>
    <circle cx="3" cy="-3" r="3" fill="#FFFFFF"/>
    <circle cx="-2" cy="4" r="1.5" fill="#FFFFFF" opacity="0.6"/>
  </g>

  <!-- 右眼 -->
  <g transform="translate(122, 95)">
    <!-- 眼镜框 -->
    <circle cx="0" cy="0" r="16" fill="none" stroke="#4A3728" stroke-width="3"/>
    <!-- 眼睛 -->
    <circle cx="0" cy="0" r="8" fill="#2C1810"/>
    <circle cx="3" cy="-3" r="3" fill="#FFFFFF"/>
    <circle cx="-2" cy="4" r="1.5" fill="#FFFFFF" opacity="0.6"/>
  </g>

  <!-- 眼镜鼻梁 -->
  <path d="M 94 95 Q 100 90 106 95" fill="none" stroke="#4A3728" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 眼镜腿 -->
  <line x1="62" y1="95" x2="55" y2="92" stroke="#4A3728" stroke-width="2" stroke-linecap="round"/>
  <line x1="138" y1="95" x2="145" y2="92" stroke="#4A3728" stroke-width="2" stroke-linecap="round"/>

  <!-- 嘴巴 -->
  <path d="M 92 120 Q 100 128 108 120" fill="none" stroke="#4A3728" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 左腮红 -->
  <ellipse cx="68" cy="115" rx="10" ry="6" fill="url(#blushGrad)"/>

  <!-- 右腮红 -->
  <ellipse cx="132" cy="115" rx="10" ry="6" fill="url(#blushGrad)"/>

</svg>