<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>茶亭 · 财富江湖</title>
<link rel="stylesheet" href="../css/style-guofeng.css">
<script src="../js/app.js"></script>
</head>
<body>
<!-- 顶部导航栏 -->
<nav class="top-nav">
  <div class="nav-brand" onclick="goBack()">
    <span class="brand-icon">⛰️</span>
    财富<span>江湖</span>
  </div>
  <div class="nav-links">
    <a class="nav-link" onclick="goBack()"><span class="nav-icon">🗺️</span>江湖</a>
    <a class="nav-link" onclick="goTo('yiguan.html')"><span class="nav-icon">🏥</span>医馆</a>
    <a class="nav-link active" onclick="location.reload()"><span class="nav-icon">⚖️</span>茶亭</a>
    <a class="nav-link" onclick="goTo('guanxing.html')"><span class="nav-icon">🔮</span>观星台</a>
    <a class="nav-link" onclick="goTo('zhulin.html')"><span class="nav-icon">🌳</span>竹林</a>
  </div>
  <div class="nav-right">
    <button class="back-btn" onclick="goBack()">← 返回江湖</button>
  </div>
</nav>

<div class="page-content">

<div class="page-header">
  <div>
    <div class="page-title">⚖️ 茶亭 · 值不值判官</div>
    <div class="page-subtitle">中国式消费场景，AI帮你掌眼</div>
  </div>
</div>

<!-- NPC 钱掌柜 -->
<div class="npc-dialogue">
  <div class="npc-avatar">💰</div>
  <div class="npc-content">
    <div class="npc-name">钱掌柜<span class="npc-title">客栈老板</span></div>
    <div class="npc-text">客官里边请！说说你要买什么，我帮你掌掌眼。这江湖上的东西，有的值，有的不值，可别花了冤枉钱。</div>
  </div>
</div>

<!-- 场景选择 -->
<div class="card" id="scenario-card">
  <div class="card-title">🏮 中国式消费场景</div>
  <p class="text-stone" style="font-size:13px;margin-bottom:14px">选一个场景，或者自己输入：</p>
  <div class="scenario-grid" id="scenario-grid"></div>
</div>

<!-- 自定义输入 -->
<div class="card" id="input-card">
  <div class="card-title">✍️ 描述你的消费</div>
  <div class="form-group">
    <label>要买什么 / 花什么钱</label>
    <input type="text" id="d-item" placeholder="例：份子钱 / iPhone / 健身年卡">
  </div>
  <div class="form-row">
    <div class="form-group">
      <label>金额 (¥)</label>
      <input type="number" id="d-amount" placeholder="800">
    </div>
    <div class="form-group">
      <label>月收入 (¥)</label>
      <input type="number" id="d-income" placeholder="12000">
    </div>
  </div>
  <div class="form-group">
    <label>补充说明（可选）</label>
    <textarea id="d-detail" rows="2" placeholder="例：同事结婚，关系一般，在杭州"></textarea>
  </div>
  <button class="btn btn-primary btn-block" onclick="runDecision()">请钱掌柜掌眼</button>
</div>

<!-- 加载中 -->
<div class="card hidden" id="dec-loading">
  <div class="card-title">⚖️ 判断中...</div>
  <p class="text-center loading-pulse" style="padding:30px 0;font-size:16px;color:var(--stone)">钱掌柜正在掂量...</p>
</div>

<!-- 结果 -->
<div id="dec-result" class="hidden">
  <div class="result-box">
    <div class="result-title">钱掌柜的判断</div>
    <div id="verdict-box" style="text-align:center;padding:20px 0">
      <div id="verdict-icon" style="font-size:48px;margin-bottom:8px">⚖️</div>
      <div id="verdict-text" style="font-size:24px;font-weight:700;letter-spacing:4px">--</div>
    </div>
    <div class="card" style="margin:0;box-shadow:none;border:1px solid rgba(74,124,89,0.1)">
      <p id="verdict-reason" style="font-size:14px;line-height:1.8;color:var(--ink)"></p>
      <div class="mt-2">
        <span class="stamp" id="dec-source">模拟模式</span>
        <span style="font-size:12px;color:var(--stone);margin-left:8px">占月收入 <span id="verdict-ratio">--</span></span>
      </div>
    </div>
  </div>

  <!-- 章回故事 -->
  <div class="card">
    <div class="card-title">📜 本回故事</div>
    <div id="chapter-box">
      <p class="text-center loading-pulse text-stone" style="padding:20px 0">说书人正在编撰...</p>
    </div>
  </div>

  <button class="btn btn-secondary btn-block" onclick="resetDecision()">再判一次</button>
</div>

<!-- 历史决策 -->
<div class="card">
  <div class="card-title">📖 消费录</div>
  <div id="history-list"></div>
</div>

<!-- 江湖迷局：行为金融学小剧场 -->
<div class="card" id="trap-card">
  <div class="card-title">🎭 江湖迷局 · 你能识破吗</div>
  <p class="text-stone" style="font-size:13px;margin-bottom:16px">江湖处处是套路，以下皆是真实消费陷阱。选一个试试你的火眼金睛：</p>
  <div class="scenario-grid" style="grid-template-columns: repeat(2, 1fr)" id="trap-grid"></div>
  <div id="trap-stage" class="hidden" style="margin-top:16px"></div>
</div>

</div><!-- /page-content -->

<script>
function goBack() { window.location.href = '../index.html'; }
function goTo(url) { window.location.href = url; }

let selectedScenario = null;

function renderScenarios() {
  const grid = document.getElementById('scenario-grid');
  grid.innerHTML = CHINESE_SCENARIOS.map(s => `
    <div class="scenario-card" data-id="${s.id}" onclick="selectScenario('${s.id}')">
      <div class="s-icon">${s.icon}</div>
      <div class="s-name">${s.name}</div>
      <div class="s-desc">${s.desc}</div>
    </div>
  `).join('');
}

function selectScenario(id) {
  document.querySelectorAll('.scenario-card').forEach(c => c.classList.remove('active'));
  document.querySelector(`[data-id="${id}"]`).classList.add('active');
  const s = getScenarioById(id);
  selectedScenario = s;
  // 自动填充
  const d = getData();
  document.getElementById('d-item').value = s.name;
  // 根据场景设置默认金额
  const defaults = { gift_money: 800, house_down: 300000, spring_festival: 3000, new_phone: 8999, gym_card: 2000, milk_tea: 30, wedding_gift: 100000, education_fund: 50000 };
  document.getElementById('d-amount').value = defaults[id] || '';
  document.getElementById('d-income').value = d.user.income || '';
  document.getElementById('d-detail').value = s.template
    .replace('${city}', d.user.city || '杭州')
    .replace('${income}', d.user.income || 12000)
    .replace('${amount}', defaults[id] || '');
}

async function runDecision() {
  const item = document.getElementById('d-item').value.trim();
  const amount = Number(document.getElementById('d-amount').value) || 0;
  const income = Number(document.getElementById('d-income').value) || 0;
  const detail = document.getElementById('d-detail').value.trim();

  if (!item || !amount) {
    alert('请填写消费名称和金额');
    return;
  }

  document.getElementById('scenario-card').classList.add('hidden');
  document.getElementById('input-card').classList.add('hidden');
  document.getElementById('dec-loading').classList.remove('hidden');

  setTimeout(async () => {
    const sim = simulateDecision(item, amount, income);
    const d = getData();
    let result = sim.result;
    let reason = sim.reason;
    let source = 'simulated';

    if (d.aiMode === 'real' && d.apiKey) {
      const prompt = `用户想花${amount}元购买/支出「${item}」。月收入${income}元，积蓄${d.user.savings}元。
      补充信息：${detail}
      占月收入比例：${(sim.ratio * 100).toFixed(1)}%。
      请判断这笔消费"值得"、"可考虑"还是"不值得"，并给出80字以内的理由。格式：结论|理由`;
      const llmResult = await callQwen('你是钱掌柜，一位精明的客栈老板，擅长判断消费值不值。', prompt);
      if (llmResult) {
        const parts = llmResult.split('|');
        if (parts.length >= 2) {
          result = parts[0].trim();
          reason = parts.slice(1).join('|').trim();
          source = 'llm';
        }
      }
    }

    // 保存
    const record = {
      id: uid(), date: getToday(), item, amount, result, reason,
      scenario: selectedScenario ? selectedScenario.id : 'custom',
      detail
    };
    d.decisions = d.decisions || [];
    d.decisions.unshift(record);
    d.stats.totalDecisions = (d.stats.totalDecisions || 0) + 1;
    if (result === '值得' || result === '可考虑') d.stats.goodDecisions = (d.stats.goodDecisions || 0) + 1;
    upgradeBuilding('chatting');
    const expResult = addExp(sim.exp, '消费决策');
    saveData(d);

    // 推送江湖事件
    const itemDisplay = item.length > 8 ? item.substring(0, 8) + '…' : item;
    const eventMsg = result === '值得'
      ? `钱掌柜掂了掂「${itemDisplay}」，点头赞许："好眼力，这笔买卖值当！"`
      : result === '可考虑'
      ? `钱掌柜沉吟片刻："「${itemDisplay}」嘛……可买可不买，客官自己掂量。"`
      : `钱掌柜掷碎银于案上，冷笑离去："「${itemDisplay}」？休要浪费银两！"`;
    pushEvent('钱掌柜', '💰', eventMsg, result === '值得' ? 'good' : result === '可考虑' ? 'warn' : 'bad');

    // 显示结果
    showDecision(result, reason, source, sim.ratio, record);

    // 生成章回
    const chapter = await generateStoryChapter('decision', { item, amount, result, reason });
    document.getElementById('chapter-box').innerHTML = `
      <div class="chapter-card">
        <div class="chapter-title">${chapter.title}</div>
        <div class="chapter-body">${chapter.body}</div>
        <div class="chapter-meta">
          <span>📅 ${chapter.date}</span>
          <span>${chapter.source === 'llm' ? '🤖 AI生成' : '✍️ 模拟'}</span>
          <span>+${sim.exp} EXP</span>
          ${expResult.leveledUp ? '<span class="text-gold">🎉 升级！</span>' : ''}
        </div>
      </div>
    `;

    checkQuests();
    renderHistory();
  }, 800);
}

function showDecision(result, reason, source, ratio, record) {
  document.getElementById('dec-loading').classList.add('hidden');
  document.getElementById('dec-result').classList.remove('hidden');

  const iconMap = { '值得': '✅', '可考虑': '🤔', '不值得': '❌' };
  const colorMap = { '值得': 'var(--mountain)', '可考虑': 'var(--gold)', '不值得': 'var(--red)' };

  document.getElementById('verdict-icon').textContent = iconMap[result] || '⚖️';
  document.getElementById('verdict-text').textContent = result;
  document.getElementById('verdict-text').style.color = colorMap[result] || 'var(--ink)';
  document.getElementById('verdict-reason').textContent = reason;
  document.getElementById('verdict-ratio').textContent = (ratio * 100).toFixed(1) + '%';
  document.getElementById('dec-source').textContent = source === 'llm' ? '🤖 AI判断' : '✍️ 模拟判断';
}

function resetDecision() {
  document.getElementById('dec-result').classList.add('hidden');
  document.getElementById('scenario-card').classList.remove('hidden');
  document.getElementById('input-card').classList.remove('hidden');
  document.querySelectorAll('.scenario-card').forEach(c => c.classList.remove('active'));
  selectedScenario = null;
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderHistory() {
  const d = getData();
  const el = document.getElementById('history-list');
  if (!d.decisions || d.decisions.length === 0) {
    el.innerHTML = '<p class="text-stone text-center" style="padding:12px 0">尚无消费记录</p>';
    return;
  }
  const resultMap = { '值得': '✅', '可考虑': '🤔', '不值得': '❌' };
  el.innerHTML = d.decisions.slice(0, 5).map(dec => `
    <div class="chapter-card" style="border-left-color:${dec.result === '值得' ? 'var(--mountain)' : dec.result === '不值得' ? 'var(--red)' : 'var(--gold)'}">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:14px;font-weight:700">${resultMap[dec.result] || '⚖️'} ${dec.item}</span>
        <span style="font-size:11px;color:var(--stone)">${dec.date}</span>
      </div>
      <div style="font-size:12px;color:var(--stone);margin-top:4px">${formatMoney(dec.amount)} · ${dec.result}</div>
    </div>
  `).join('');
}

// 初始化
renderScenarios();
const d = getData();
if (d.user.income) document.getElementById('d-income').value = d.user.income;
renderHistory();

// ============================================
// 行为金融学陷阱小剧场
// ============================================
const BEHAVIORAL_TRAPS = [
  {
    id: 'anchoring',
    name: '原价迷魂阵',
    icon: '⚓',
    desc: '锚定效应',
    scene: '路边摊主高声吆喝："原价100两纹银，今日特惠只要60两！" 你正要掏钱——',
    options: [
      { label: '毫不犹豫买下', feedback: '你中了锚定效应！摊主随口说的"原价100两"根本没有依据，此物平日只卖40两。锚定效应让你被第一个数字牢牢拴住，60两看似便宜实则溢价50%。' },
      { label: '先去三家比价', feedback: '不愧是行走江湖的老手！你避开了锚定效应的陷阱——摊主的"原价"只是个随意锚点，比价后你会发现真相。江湖铁律：莫信第一个数。' }
    ],
    concept: '锚定效应：人在决策时过度依赖最先接触到的信息（锚点），即使该信息毫无参考价值。商家正是利用"原价→现价"的对比来制造便宜错觉。'
  },
  {
    id: 'loss_aversion',
    name: '错失恐惧阵',
    icon: '⏳',
    desc: '损失厌恶',
    scene: '客栈小二神色慌张："客官，最后两间上房了！再过一炷香，隔壁商队就全包了！" 你本打算找家便宜的——',
    options: [
      { label: '咬牙订下上房', feedback: '你被损失厌恶拿捏了。人对"即将失去"的恐惧远大于"可能获得"的喜悦——宁可多花银子也不愿想象自己没房住的画面。其实方圆三里还有三家客栈。' },
      { label: '谢绝出门寻别家', feedback: '沉得住气！你战胜了损失厌恶——小二制造的"即将失去"的紧迫感是经典话术。人天然厌恶损失，但真正亏的是为虚假紧迫多付的冤枉钱。' }
    ],
    concept: '损失厌恶：人对损失的痛苦感约是同等收益快感的两倍。商家利用"限时/限量/即将售罄"来触发你对"错过"的恐惧，让你为躲避想象中的损失而付出真金白银。'
  },
  {
    id: 'mental_account',
    name: '意外横财劫',
    icon: '🎰',
    desc: '心理账户',
    scene: '年关将至，你收到一笔3000两的年终赏金。路过兵器铺，看中一把3000两的宝刀——这钱是你辛苦攒了半年才存下的，平日绝不会买——',
    options: [
      { label: '赏金嘛，犒劳自己', feedback: '你掉进了心理账户的陷阱！大脑把"辛苦攒的钱"和"意外之财"存在不同的心理账户里。你觉得赏金花起来不心疼，但3000两就是3000两——买刀和从积蓄里掏钱没有任何区别。' },
      { label: '存入银库，视同血汗钱', feedback: '理智之选。你识破了心理账户的幻觉——无论钱从哪来，它的购买力完全相同。把赏金和积蓄一视同仁，按既定理财计划来，才是真正的财富自由之路。' }
    ],
    concept: '心理账户：人在潜意识中把钱分进不同"账户"（工资、奖金、红包、彩票……），并区别对待。但理性的金钱观是：一块钱就是一块钱，不管它从哪来。'
  },
  {
    id: 'sunk_cost',
    name: '沉船不归路',
    icon: '⚰️',
    desc: '沉没成本',
    scene: '半年前你花800两办了一张练功房年卡，至今只去了三次。今日天寒地冻，你浑身酸痛不想动，但你心想"不去就浪费了"——',
    options: [
      { label: '硬撑着去练功', feedback: '沉没成本在操控你！800两已经花出去了，无论你今天去不去，这笔钱都回不来了。而你现在还额外搭上了"本可以休息的时间"和"逼自己受苦的心情"——双输。' },
      { label: '休息，明日再说', feedback: '明智。你认清了沉没成本的本质：已经发生且不可回收的支出，不应影响当前决策。800两已如泼出去的水，你该考虑的是"今天去练功对我现在的价值"，而非"如何让已花出去的钱显得不亏"。' }
    ],
    concept: '沉没成本谬误：人倾向于因为已经投入了时间/金钱/感情而继续坚持，即使继续下去只会损失更多。江湖箴言：别为打翻的牛奶哭泣。'
  }
];

function renderTraps() {
  const grid = document.getElementById('trap-grid');
  grid.innerHTML = BEHAVIORAL_TRAPS.map(t => `
    <div class="scenario-card" onclick="startTrap('${t.id}')" style="cursor:pointer">
      <div class="s-icon">${t.icon}</div>
      <div class="s-name">${t.name}</div>
      <div class="s-desc">${t.desc}</div>
    </div>
  `).join('');
}

function startTrap(id) {
  const trap = BEHAVIORAL_TRAPS.find(t => t.id === id);
  if (!trap) return;

  const stage = document.getElementById('trap-stage');
  stage.classList.remove('hidden');
  stage.innerHTML = `
    <div style="background:rgba(245,240,232,0.6);border-radius:12px;padding:20px;border:1px solid rgba(192,57,43,0.15)">
      <div style="font-size:14px;font-weight:700;color:var(--red);margin-bottom:12px;letter-spacing:1px">
        ${trap.icon} ${trap.name} · <span style="color:var(--stone);font-weight:400">${trap.desc}</span>
      </div>
      <div style="font-size:15px;line-height:1.9;color:var(--ink);margin-bottom:16px;font-style:italic">
        「${trap.scene}」
      </div>
      <div style="display:flex;gap:12px;flex-wrap:wrap" id="trap-options">
        ${trap.options.map((opt, i) => `
          <button class="btn btn-secondary" onclick="revealTrap('${id}', ${i})" style="flex:1;min-width:180px">${opt.label}</button>
        `).join('')}
      </div>
      <div id="trap-feedback" style="margin-top:16px"></div>
    </div>
  `;

  // 滚动到陷阱区域
  stage.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function revealTrap(id, choiceIdx) {
  const trap = BEHAVIORAL_TRAPS.find(t => t.id === id);
  if (!trap) return;

  const isGood = choiceIdx === 1;
  const feedback = document.getElementById('trap-feedback');
  const selectedOption = trap.options[choiceIdx];
  const verdictColor = isGood ? 'var(--mountain)' : 'var(--red)';
  const verdictIcon = isGood ? '🎯' : '💸';

  feedback.innerHTML = `
    <div style="background:rgba(255,255,255,0.8);border-radius:10px;padding:16px;border-left:4px solid ${verdictColor};margin-bottom:12px">
      <div style="font-size:16px;font-weight:700;color:${verdictColor};margin-bottom:8px">${verdictIcon} ${selectedOption.feedback}</div>
    </div>
    <div style="background:rgba(255,248,220,0.6);border-radius:10px;padding:14px;border:1px solid rgba(212,168,67,0.2)">
      <div style="font-size:12px;color:var(--gold-dark);font-weight:700;margin-bottom:4px">📖 江湖秘籍</div>
      <div style="font-size:13px;color:var(--ink);line-height:1.8">${trap.concept}</div>
    </div>
    <button class="btn btn-secondary" onclick="startTrap('${id}')" style="margin-top:12px">🔄 换个选择试试</button>
  `;

  // 禁用选项按钮
  document.querySelectorAll('#trap-options button').forEach(b => b.disabled = true);
}

// 初始化江湖迷局
renderTraps();
</script>
</body>
</html>
