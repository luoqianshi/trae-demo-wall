<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>观星台 · 财富江湖</title>
<link rel="stylesheet" href="../css/style-guofeng.css">
<script src="../js/app.js"></script>
</head>
<body>
<!-- 顶部导航栏 -->
<nav class="top-nav">
  <div class="nav-brand" onclick="goBack()">
    <span class="brand-icon">⛰️</span>
    财富<span>江湖</span>
  </div>
  <div class="nav-links">
    <a class="nav-link" onclick="goBack()"><span class="nav-icon">🗺️</span>江湖</a>
    <a class="nav-link" onclick="goTo('yiguan.html')"><span class="nav-icon">🏥</span>医馆</a>
    <a class="nav-link" onclick="goTo('chatting.html')"><span class="nav-icon">⚖️</span>茶亭</a>
    <a class="nav-link active" onclick="location.reload()"><span class="nav-icon">🔮</span>观星台</a>
    <a class="nav-link" onclick="goTo('zhulin.html')"><span class="nav-icon">🌳</span>竹林</a>
  </div>
  <div class="nav-right">
    <button class="back-btn" onclick="goBack()">← 返回江湖</button>
  </div>
</nav>

<div class="page-content">

<div class="page-header">
  <div>
    <div class="page-title">🔮 观星台 · 未来推演</div>
    <div class="page-subtitle">展开命运折扇，推演目标达成之路</div>
  </div>
</div>

<!-- NPC 星语师 -->
<div class="npc-dialogue">
  <div class="npc-avatar">🔮</div>
  <div class="npc-content">
    <div class="npc-name">星语师<span class="npc-title">观星台主</span></div>
    <div class="npc-text">星垂平野阔，月涌大江流。要知未来财运，先静心。告诉我你想达成什么，我便为你展开命运折扇。</div>
  </div>
</div>

<!-- 目标选择 -->
<div class="card" id="goal-card">
  <div class="card-title">🌌 选择目标</div>
  <div class="scenario-grid" id="goal-grid"></div>
</div>

<!-- 推演表单 -->
<div class="card" id="pred-form-card">
  <div class="card-title">⏳ 推演参数</div>
  <div class="form-group">
    <label>你的目标</label>
    <input type="text" id="p-goal" placeholder="例：买房首付 / 结婚 / 创业 / 养老">
  </div>
  <div class="form-row">
    <div class="form-group">
      <label>需要金额 (¥)</label>
      <input type="number" id="p-amount" placeholder="300000">
    </div>
    <div class="form-group">
      <label>期限 (年)</label>
      <input type="number" id="p-years" placeholder="5" min="1" max="30">
    </div>
  </div>
  <div class="form-group">
    <label>每月能存 (¥)</label>
    <input type="number" id="p-monthly" placeholder="5000">
  </div>
  <button class="btn btn-primary btn-block" onclick="runPrediction()">展开命运折扇</button>
</div>

<!-- 加载中 -->
<div class="card hidden" id="pred-loading">
  <div class="card-title">🔮 观星中...</div>
  <p class="text-center loading-pulse" style="padding:30px 0;font-size:16px;color:var(--stone)">星语师正在展开折扇，星河流转...</p>
</div>

<!-- 结果 -->
<div id="pred-result" class="hidden">
  <div class="result-box">
    <div class="result-title">命运折扇</div>
    <div style="text-align:center;padding:20px 0">
      <div id="prob-circle" style="width:140px;height:140px;border-radius:50%;background:conic-gradient(var(--mountain) 0deg,var(--mountain) 0deg,rgba(74,124,89,0.15) 0deg);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;position:relative">
        <div style="position:absolute;width:110px;height:110px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column">
          <span id="prob-value" style="font-size:36px;font-weight:700;color:var(--mountain)">0</span>
          <span style="font-size:12px;color:var(--stone)">达成概率</span>
        </div>
      </div>
      <div id="prob-label" style="font-size:14px;color:var(--stone)">--</div>
    </div>
  </div>

  <!-- 路径建议 -->
  <div class="card">
    <div class="card-title">🛤️ 星语师指引</div>
    <p id="pred-path" style="font-size:14px;line-height:1.8;color:var(--ink)"></p>
    <div class="mt-2" style="font-size:12px;color:var(--stone)">
      <div>每月需存：<span id="pred-need" class="text-green" style="font-weight:700">--</span></div>
      <div>当前差距：<span id="pred-gap" class="text-red" style="font-weight:700">--</span></div>
    </div>
    <div class="mt-2"><span class="stamp" id="pred-source">模拟模式</span></div>
  </div>

  <!-- 章回故事 -->
  <div class="card">
    <div class="card-title">📜 本回故事</div>
    <div id="chapter-box">
      <p class="text-center loading-pulse text-stone" style="padding:20px 0">说书人正在编撰...</p>
    </div>
  </div>

  <button class="btn btn-secondary btn-block" onclick="resetPrediction()">再观一次</button>
</div>

<!-- 历史推演 -->
<div class="card">
  <div class="card-title">📖 星象录</div>
  <div id="history-list"></div>
</div>

</div><!-- /page-content -->

<script>
function goBack() { window.location.href = '../index.html'; }
function goTo(url) { window.location.href = url; }

const GOALS = [
  { id: 'house', name: '买房首付', icon: '🏠', amount: 300000, years: 5 },
  { id: 'wedding', name: '结婚基金', icon: '💍', amount: 150000, years: 3 },
  { id: 'business', name: '创业资金', icon: '🏪', amount: 200000, years: 3 },
  { id: 'retire', name: '养老储备', icon: '🌅', amount: 1000000, years: 25 },
  { id: 'education', name: '教育基金', icon: '📚', amount: 200000, years: 10 },
  { id: 'travel', name: '环球旅行', icon: '✈️', amount: 80000, years: 2 },
  { id: 'car', name: '买车', icon: '🚗', amount: 150000, years: 3 },
  { id: 'custom', name: '自定义', icon: '✨', amount: 0, years: 5 }
];

function renderGoals() {
  document.getElementById('goal-grid').innerHTML = GOALS.map(g => `
    <div class="scenario-card" data-id="${g.id}" onclick="selectGoal('${g.id}')">
      <div class="s-icon">${g.icon}</div>
      <div class="s-name">${g.name}</div>
      <div class="s-desc">${g.years}年计划</div>
    </div>
  `).join('');
}

function selectGoal(id) {
  document.querySelectorAll('.scenario-card').forEach(c => c.classList.remove('active'));
  document.querySelector(`[data-id="${id}"]`).classList.add('active');
  const g = GOALS.find(x => x.id === id);
  document.getElementById('p-goal').value = g.name;
  if (g.amount) document.getElementById('p-amount').value = g.amount;
  document.getElementById('p-years').value = g.years;
  const d = getData();
  const monthly = Math.round((d.user.income || 12000) * 0.3);
  document.getElementById('p-monthly').value = monthly;
}

async function runPrediction() {
  const goal = document.getElementById('p-goal').value.trim();
  const amount = Number(document.getElementById('p-amount').value) || 0;
  const years = Number(document.getElementById('p-years').value) || 1;
  const monthly = Number(document.getElementById('p-monthly').value) || 0;

  if (!goal || !amount) {
    alert('请填写目标和金额');
    return;
  }

  document.getElementById('goal-card').classList.add('hidden');
  document.getElementById('pred-form-card').classList.add('hidden');
  document.getElementById('pred-loading').classList.remove('hidden');

  setTimeout(async () => {
    const d = getData();
    // 用monthly覆盖默认
    const tempData = JSON.parse(JSON.stringify(d));
    tempData.user.income = monthly > 0 ? Math.round(monthly / 0.3) : d.user.income;
    const sim = simulatePrediction(goal, amount, years, tempData);

    let path = sim.path;
    let source = 'simulated';
    const needMonthly = Math.round((amount - d.user.savings) / (years * 12));

    if (d.aiMode === 'real' && d.apiKey) {
      const prompt = `目标：${goal}，需要${amount}元，计划${years}年达成。
当前积蓄：${d.user.savings}元，月收入：${d.user.income}元，月存：${monthly}元。
推演达成概率：${sim.prob}%。
请给出100字以内的路径建议，包括是否需要调整储蓄比例、减少支出或增加收入。`;
      const llmResult = await callQwen('你是星语师，一位神秘的观星者，用诗意而实际的语言给出财务建议。', prompt);
      if (llmResult) { path = llmResult; source = 'llm'; }
    }

    // 保存
    const record = {
      id: uid(), date: getToday(), goal, amount, years, prob: sim.prob, path,
      monthlySave: monthly, source
    };
    d.predictions = d.predictions || [];
    d.predictions.unshift(record);
    d.stats.totalPredictions = (d.stats.totalPredictions || 0) + 1;
    upgradeBuilding('guanxing');
    const expResult = addExp(25, '未来推演');
    saveData(d);

    // 显示
    showPrediction(sim.prob, path, source, needMonthly, sim.gap, record);

    // 章回
    const chapter = await generateStoryChapter('prediction', { goal, amount, years, prob: sim.prob });
    document.getElementById('chapter-box').innerHTML = `
      <div class="chapter-card">
        <div class="chapter-title">${chapter.title}</div>
        <div class="chapter-body">${chapter.body}</div>
        <div class="chapter-meta">
          <span>📅 ${chapter.date}</span>
          <span>${chapter.source === 'llm' ? '🤖 AI生成' : '✍️ 模拟'}</span>
          <span>+25 EXP</span>
          ${expResult.leveledUp ? '<span class="text-gold">🎉 升级！</span>' : ''}
        </div>
      </div>
    `;

    checkQuests();
    renderHistory();
  }, 1000);
}

function showPrediction(prob, path, source, needMonthly, gap, record) {
  document.getElementById('pred-loading').classList.add('hidden');
  document.getElementById('pred-result').classList.remove('hidden');

  // 动画概率
  const circle = document.getElementById('prob-circle');
  const deg = prob * 3.6;
  circle.style.background = `conic-gradient(var(--mountain) 0deg, var(--mountain) ${deg}deg, rgba(74,124,89,0.15) ${deg}deg)`;

  let cur = 0;
  const target = prob;
  const interval = setInterval(() => {
    cur += Math.ceil(target / 20);
    if (cur >= target) { cur = target; clearInterval(interval); }
    document.getElementById('prob-value').textContent = cur;
  }, 30);

  let label = '';
  if (prob >= 80) label = '🌟 星辰坦途，大有可期';
  else if (prob >= 50) label = '⛅ 星光闪烁，需加努力';
  else label = '🌧️ 星象晦暗，需调整方向';
  document.getElementById('prob-label').textContent = label;

  document.getElementById('pred-path').textContent = path;
  document.getElementById('pred-need').textContent = formatMoney(Math.max(needMonthly, 0)) + '/月';
  document.getElementById('pred-gap').textContent = formatMoney(Math.max(gap, 0));
  document.getElementById('pred-source').textContent = source === 'llm' ? '🤖 AI推演' : '✍️ 模拟推演';
}

function resetPrediction() {
  document.getElementById('pred-result').classList.add('hidden');
  document.getElementById('goal-card').classList.remove('hidden');
  document.getElementById('pred-form-card').classList.remove('hidden');
  document.querySelectorAll('.scenario-card').forEach(c => c.classList.remove('active'));
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderHistory() {
  const d = getData();
  const el = document.getElementById('history-list');
  if (!d.predictions || d.predictions.length === 0) {
    el.innerHTML = '<p class="text-stone text-center" style="padding:12px 0">尚无观星记录</p>';
    return;
  }
  el.innerHTML = d.predictions.slice(0, 5).map(p => `
    <div class="chapter-card" style="border-left-color:var(--water)">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:14px;font-weight:700;color:var(--mountain)">${p.prob}% · ${p.goal}</span>
        <span style="font-size:11px;color:var(--stone)">${p.date}</span>
      </div>
      <div style="font-size:12px;color:var(--stone);margin-top:4px">${formatMoney(p.amount)} · ${p.years}年计划</div>
    </div>
  `).join('');
}

// 初始化
renderGoals();
renderHistory();
</script>
</body>
</html>
