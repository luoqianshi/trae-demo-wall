<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>财富江湖</title>
<link rel="stylesheet" href="css/style-guofeng.css">
<script src="js/app.js"></script>
</head>
<body>

<!-- 顶部导航栏 -->
<nav class="top-nav">
  <div class="nav-brand" onclick="goTo('index.html')">
    <span class="brand-icon">⛰️</span>
    财富<span>江湖</span>
  </div>
  <div class="nav-links">
    <a class="nav-link active" onclick="goTo('index.html')"><span class="nav-icon">🗺️</span>江湖</a>
    <a class="nav-link" onclick="goTo('pages/yiguan.html')"><span class="nav-icon">🏥</span>医馆</a>
    <a class="nav-link" onclick="goTo('pages/chatting.html')"><span class="nav-icon">⚖️</span>茶亭</a>
    <a class="nav-link" onclick="goTo('pages/guanxing.html')"><span class="nav-icon">🔮</span>观星台</a>
    <a class="nav-link" onclick="goTo('pages/zhulin.html')"><span class="nav-icon">🌳</span>竹林</a>
  </div>
  <div class="nav-right">
    <div class="user-chip" onclick="toggleSettings()">
      <span class="chip-level" id="badge-level">Lv.1</span>
      <span class="chip-name" id="badge-name">少侠</span>
      <span class="chip-icon">⚙️</span>
    </div>
  </div>
</nav>

<!-- 沉浸式世界舞台 -->
<div class="world-stage">

  <!-- 全屏青绿山水SVG长卷 -->
  <div class="world-map">
    <svg viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- 渐变定义 -->
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#E8F0E8"/>
          <stop offset="40%" stop-color="#D4E8D6"/>
          <stop offset="100%" stop-color="#C8E6C9"/>
        </linearGradient>
        <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#A8D4D1"/>
          <stop offset="50%" stop-color="#7EB8C8"/>
          <stop offset="100%" stop-color="#5B9AB0"/>
        </linearGradient>
        <linearGradient id="mountainFar" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="rgba(91,140,106,0.15)"/>
          <stop offset="100%" stop-color="rgba(91,140,106,0.35)"/>
        </linearGradient>
        <linearGradient id="mountainMid" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="rgba(74,124,89,0.35)"/>
          <stop offset="100%" stop-color="rgba(74,124,89,0.55)"/>
        </linearGradient>
        <linearGradient id="mountainNear" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="rgba(60,100,75,0.5)"/>
          <stop offset="100%" stop-color="rgba(50,85,65,0.75)"/>
        </linearGradient>
      </defs>

      <!-- 天空背景 -->
      <rect width="1200" height="700" fill="url(#skyGrad)"/>

      <!-- 远山层（三层叠加，营造深度） -->
      <path d="M0,200 Q150,140 300,170 Q450,130 600,160 Q750,140 900,170 Q1050,150 1200,180 L1200,280 L0,280 Z" fill="url(#mountainFar)" opacity="0.6"/>
      <path d="M0,230 Q200,180 400,200 Q600,170 800,200 Q1000,180 1200,210 L1200,310 L0,310 Z" fill="url(#mountainFar)" opacity="0.8"/>

      <!-- 中景山（青绿山水主峰） -->
      <path d="M0,320 Q100,250 200,280 Q300,240 400,270 Q500,220 600,260 Q700,230 800,270 Q900,240 1000,280 Q1100,250 1200,290 L1200,400 L0,400 Z" fill="url(#mountainMid)"/>
      <path d="M0,360 Q120,300 250,330 Q380,290 500,320 Q620,280 740,320 Q860,290 980,330 Q1100,300 1200,340 L1200,440 L0,440 Z" fill="url(#mountainMid)" opacity="0.85"/>

      <!-- 山峰高光（石青色点缀） -->
      <path d="M180,275 Q200,250 220,275 Z" fill="rgba(107,174,143,0.4)"/>
      <path d="M380,265 Q400,235 420,265 Z" fill="rgba(107,174,143,0.4)"/>
      <path d="M580,255 Q600,220 620,255 Z" fill="rgba(107,174,143,0.35)"/>
      <path d="M780,265 Q800,235 820,265 Z" fill="rgba(107,174,143,0.4)"/>
      <path d="M980,275 Q1000,245 1020,275 Z" fill="rgba(107,174,143,0.35)"/>

      <!-- 水面（江河） -->
      <rect x="0" y="400" width="1200" height="120" fill="url(#waterGrad)" opacity="0.5"/>
      <!-- 水波纹 -->
      <path d="M0,430 Q100,425 200,430 T400,430 T600,430 T800,430 T1000,430 T1200,430" stroke="rgba(255,255,255,0.2)" stroke-width="1" fill="none"/>
      <path d="M0,460 Q150,455 300,460 T600,460 T900,460 T1200,460" stroke="rgba(255,255,255,0.15)" stroke-width="1" fill="none"/>
      <path d="M0,490 Q120,485 240,490 T480,490 T720,490 T960,490 T1200,490" stroke="rgba(255,255,255,0.12)" stroke-width="1" fill="none"/>

      <!-- 近景山 -->
      <path d="M0,500 Q80,460 160,480 Q240,450 320,475 Q400,455 480,480 L1200,500 L1200,600 L0,600 Z" fill="url(#mountainNear)"/>
      <path d="M0,540 Q100,510 200,525 Q300,505 400,530 Q500,515 600,535 Q700,520 800,540 Q900,525 1000,545 Q1100,530 1200,550 L1200,700 L0,700 Z" fill="rgba(50,85,65,0.8)"/>

      <!-- 云雾层 -->
      <ellipse cx="200" cy="120" rx="100" ry="18" fill="rgba(255,255,255,0.45)"/>
      <ellipse cx="500" cy="90" rx="80" ry="14" fill="rgba(255,255,255,0.35)"/>
      <ellipse cx="800" cy="110" rx="120" ry="20" fill="rgba(255,255,255,0.4)"/>
      <ellipse cx="1050" cy="80" rx="70" ry="12" fill="rgba(255,255,255,0.3)"/>
      <ellipse cx="350" cy="160" rx="90" ry="15" fill="rgba(255,255,255,0.25)"/>
      <ellipse cx="700" cy="170" rx="100" ry="16" fill="rgba(255,255,255,0.2)"/>

      <!-- 小船（江上） -->
      <g transform="translate(450,440)">
        <path d="M-18,0 Q0,8 18,0 L15,4 L-15,4 Z" fill="#8B7355"/>
        <line x1="0" y1="0" x2="0" y2="-20" stroke="#8B7355" stroke-width="1.5"/>
        <path d="M0,-20 L12,-14 L0,-8 Z" fill="rgba(192,57,43,0.7)"/>
        <ellipse cx="0" cy="8" rx="22" ry="3" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>
      </g>

      <!-- 飞鸟群 -->
      <g transform="translate(700,100)" opacity="0.4">
        <path d="M0,0 Q6,-5 12,0 Q18,-5 24,0" stroke="#2C2C2C" stroke-width="1.2" fill="none"/>
      </g>
      <g transform="translate(740,120)" opacity="0.35">
        <path d="M0,0 Q5,-4 10,0 Q15,-4 20,0" stroke="#2C2C2C" stroke-width="1" fill="none"/>
      </g>
      <g transform="translate(780,95)" opacity="0.3">
        <path d="M0,0 Q4,-3 8,0 Q12,-3 16,0" stroke="#2C2C2C" stroke-width="1" fill="none"/>
      </g>

      <!-- 涟漪 -->
      <ellipse cx="300" cy="470" rx="30" ry="4" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>
      <ellipse cx="300" cy="470" rx="18" ry="3" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
      <ellipse cx="800" cy="490" rx="24" ry="3.5" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>

      <!-- 松树点缀（近景） -->
      <g transform="translate(100,520)">
        <line x1="0" y1="0" x2="0" y2="-30" stroke="#5A4A3A" stroke-width="2"/>
        <path d="M-8,-15 Q0,-20 8,-15 M-10,-22 Q0,-28 10,-22 M-6,-8 Q0,-12 6,-8" stroke="rgba(74,124,89,0.7)" stroke-width="2" fill="none"/>
      </g>
      <g transform="translate(1080,530)">
        <line x1="0" y1="0" x2="0" y2="-35" stroke="#5A4A3A" stroke-width="2"/>
        <path d="M-9,-18 Q0,-24 9,-18 M-11,-26 Q0,-32 11,-26 M-7,-10 Q0,-14 7,-10" stroke="rgba(74,124,89,0.7)" stroke-width="2" fill="none"/>
      </g>

      <!-- 朱红印章 -->
      <rect x="1130" y="640" width="40" height="40" rx="4" fill="rgba(192,57,43,0.85)"/>
      <text x="1150" y="666" font-size="14" fill="#fff" text-anchor="middle" font-family="serif" font-weight="bold">江湖</text>

      <!-- 远处楼阁（观星台暗示） -->
      <g transform="translate(950,280)" opacity="0.5">
        <rect x="-8" y="-20" width="16" height="20" fill="rgba(139,115,85,0.6)"/>
        <polygon points="-12,-20 12,-20 0,-32" fill="rgba(139,115,85,0.5)"/>
        <line x1="0" y1="-32" x2="0" y2="-40" stroke="rgba(139,115,85,0.5)" stroke-width="1"/>
      </g>
    </svg>
  </div>

  <!-- 地图建筑入口 -->
  <div class="map-building yiguan" id="b-yiguan" onclick="goTo('pages/yiguan.html')">
    <div class="b-icon">🏥</div>
    <div class="b-label">医馆</div>
    <div class="b-desc">钱包体检</div>
  </div>

  <div class="map-building chatting" id="b-chatting" onclick="goTo('pages/chatting.html')">
    <div class="b-icon">⚖️</div>
    <div class="b-label">茶亭</div>
    <div class="b-desc">值不值判官</div>
  </div>

  <div class="map-building guanxing" id="b-guanxing" onclick="goTo('pages/guanxing.html')">
    <div class="b-icon">🔮</div>
    <div class="b-label">观星台</div>
    <div class="b-desc">未来推演</div>
  </div>

  <div class="map-building zhulin" id="b-zhulin" onclick="goTo('pages/zhulin.html')">
    <div class="b-icon">🌳</div>
    <div class="b-label">竹林</div>
    <div class="b-desc">成长森林</div>
  </div>

  <!-- 左浮动面板：角色信息 -->
  <div class="float-panel panel-left">
    <div class="hero-header">
      <div class="hero-avatar" id="hero-avatar">🧑‍🌾</div>
      <div class="hero-info">
        <h2 id="hero-name">少侠</h2>
        <p id="hero-title">初入江湖 · <span id="hero-city">某城</span></p>
      </div>
    </div>

    <div class="attr-grid">
      <div class="attr-item"><div class="attr-name">修为</div><div class="attr-value" id="attr-wisdom">10</div></div>
      <div class="attr-item"><div class="attr-name">胆识</div><div class="attr-value" id="attr-courage">10</div></div>
      <div class="attr-item"><div class="attr-name">财运</div><div class="attr-value" id="attr-luck">10</div></div>
    </div>

    <div class="exp-bar">
      <div class="exp-label">
        <span id="exp-text">经验 0/100</span>
        <span id="exp-pct">0%</span>
      </div>
      <div class="exp-track"><div class="exp-fill" id="exp-fill" style="width:0%"></div></div>
    </div>

    <div class="panel-section-title">⚔️ 悬赏榜</div>
    <div class="quest-list" id="quest-list">
      <p class="text-stone text-center" style="padding:8px 0;font-size:12px">暂无任务</p>
    </div>
  </div>

  <!-- 右浮动面板：江湖日志 -->
  <div class="float-panel panel-right">
    <div class="panel-section-title">📜 江湖日志</div>
    <div id="chapter-list">
      <p class="text-stone text-center" style="padding:16px 0;font-size:13px">尚未有江湖事迹，去各处走走吧。</p>
    </div>
  </div>

  <!-- NPC引路人浮窗 -->
  <div class="npc-float">
    <div class="npc-dialogue">
      <div class="npc-avatar">🎣</div>
      <div class="npc-content">
        <div class="npc-name">老渔翁<span class="npc-title">江湖引路人</span></div>
        <div class="npc-text" id="guide-text">江湖路远，钱袋要稳，脚步要轻。少侠，先去医馆把个脉，再去茶亭论论价。</div>
      </div>
    </div>
  </div>

</div>

<!-- 遮罩 -->
<div class="overlay" id="overlay" onclick="toggleSettings()"></div>

<!-- 设置面板 -->
<div class="settings-panel" id="settings-panel">
  <h3>⚙️ 少侠设置</h3>

  <div class="setting-group">
    <label>侠名</label>
    <input type="text" id="set-name" placeholder="你的名字">
  </div>
  <div class="form-row" style="margin-bottom:16px">
    <div class="setting-group">
      <label>年龄</label>
      <input type="number" id="set-age" placeholder="28">
    </div>
    <div class="setting-group">
      <label>城市</label>
      <input type="text" id="set-city" placeholder="杭州">
    </div>
  </div>
  <div class="setting-group">
    <label>职业</label>
    <input type="text" id="set-job" placeholder="上班族">
  </div>
  <div class="form-row" style="margin-bottom:16px">
    <div class="setting-group">
      <label>月收入(¥)</label>
      <input type="number" id="set-income" placeholder="12000">
    </div>
    <div class="setting-group">
      <label>积蓄(¥)</label>
      <input type="number" id="set-savings" placeholder="50000">
    </div>
  </div>
  <div class="form-row" style="margin-bottom:20px">
    <div class="setting-group">
      <label>负债(¥)</label>
      <input type="number" id="set-debt" placeholder="8000">
    </div>
    <div class="setting-group">
      <label>月固定支出(¥)</label>
      <input type="number" id="set-fixed" placeholder="6000">
    </div>
  </div>

  <hr style="border:none;border-top:1px solid rgba(74,124,89,0.15);margin:20px 0">

  <div class="setting-group">
    <label>AI 模式</label>
    <select id="set-aimode">
      <option value="simulate">模拟模式（无需API）</option>
      <option value="real">真实AI（通义千问）</option>
    </select>
  </div>
  <div class="setting-group" id="apikey-group" style="margin-bottom:20px">
    <label>通义千问 API Key</label>
    <input type="password" id="set-apikey" placeholder="sk-xxxxxxxx">
  </div>

  <button class="btn btn-primary btn-block" onclick="saveSettings()">保存</button>
  <button class="btn btn-gold btn-block mt-2" onclick="loadDemo()">加载演示数据</button>
  <button class="btn btn-secondary btn-block mt-2" onclick="resetData()">重置所有数据</button>
</div>

<script>
// === 首页逻辑 ===
function goTo(url) { window.location.href = url; }

function toggleSettings() {
  const panel = document.getElementById('settings-panel');
  const overlay = document.getElementById('overlay');
  const isOpen = panel.classList.toggle('open');
  overlay.classList.toggle('open', isOpen);
  if (isOpen) fillSettingsForm();
}

function fillSettingsForm() {
  const d = getData();
  document.getElementById('set-name').value = d.user.name || '';
  document.getElementById('set-age').value = d.user.age || '';
  document.getElementById('set-city').value = d.user.city || '';
  document.getElementById('set-job').value = d.user.job || '';
  document.getElementById('set-income').value = d.user.income || '';
  document.getElementById('set-savings').value = d.user.savings || '';
  document.getElementById('set-debt').value = d.user.debt || '';
  document.getElementById('set-fixed').value = d.user.monthlyFixed || '';
  document.getElementById('set-aimode').value = d.aiMode || 'simulate';
  document.getElementById('set-apikey').value = d.apiKey || '';
  document.getElementById('apikey-group').style.display = d.aiMode === 'real' ? 'block' : 'none';
}

document.getElementById('set-aimode').addEventListener('change', function() {
  document.getElementById('apikey-group').style.display = this.value === 'real' ? 'block' : 'none';
});

function saveSettings() {
  const d = getData();
  d.user.name = document.getElementById('set-name').value || '少侠';
  d.user.age = document.getElementById('set-age').value;
  d.user.city = document.getElementById('set-city').value;
  d.user.job = document.getElementById('set-job').value;
  d.user.income = Number(document.getElementById('set-income').value) || 0;
  d.user.savings = Number(document.getElementById('set-savings').value) || 0;
  d.user.debt = Number(document.getElementById('set-debt').value) || 0;
  d.user.monthlyFixed = Number(document.getElementById('set-fixed').value) || 0;
  d.aiMode = document.getElementById('set-aimode').value;
  d.apiKey = document.getElementById('set-apikey').value;
  saveData(d);
  toggleSettings();
  renderHome();
}

function loadDemo() {
  loadDemoData();
  toggleSettings();
  renderHome();
}

function resetData() {
  if (!confirm('确定要重置所有数据吗？此操作不可恢复。')) return;
  localStorage.removeItem(APP_KEY);
  location.reload();
}

function renderHome() {
  const d = getData();
  const lvInfo = calcLevel(d.hero.exp);

  // 顶部用户标识
  document.getElementById('badge-level').textContent = 'Lv.' + lvInfo.level;
  document.getElementById('badge-name').textContent = d.user.name || '少侠';

  // 角色面板
  document.getElementById('hero-name').textContent = d.user.name || '少侠';
  document.getElementById('hero-title').textContent = (d.hero.title || getTitleByLevel(lvInfo.level)) + ' · ' + (d.user.city || '某城');
  document.getElementById('hero-city').textContent = d.user.city || '某城';
  document.getElementById('attr-wisdom').textContent = d.hero.wisdom || 10;
  document.getElementById('attr-courage').textContent = d.hero.courage || 10;
  document.getElementById('attr-luck').textContent = d.hero.luck || 10;

  // 经验条
  document.getElementById('exp-text').textContent = '经验 ' + lvInfo.curExp + '/' + lvInfo.needExp;
  document.getElementById('exp-pct').textContent = Math.round(lvInfo.pct) + '%';
  document.getElementById('exp-fill').style.width = lvInfo.pct + '%';

  // 建筑等级
  ['yiguan','chatting','guanxing','zhulin'].forEach(key => {
    const el = document.getElementById('b-' + key);
    if (!el) return;
    const lv = d.buildings[key] || 0;
    el.classList.remove('level-0','level-1','level-2','level-3','locked');
    if (lv === 0) el.classList.add('level-0');
    else if (lv <= 1) el.classList.add('level-1');
    else if (lv <= 2) el.classList.add('level-2');
    else el.classList.add('level-3');
  });

  // 江湖日志
  const chapterEl = document.getElementById('chapter-list');
  if (d.chapters && d.chapters.length > 0) {
    chapterEl.innerHTML = d.chapters.slice(0, 6).map(ch => `
      <div class="chapter-card">
        <div class="chapter-title">${ch.title}</div>
        <div class="chapter-body">${ch.body}</div>
        <div class="chapter-meta">
          <span>📅 ${ch.date}</span>
          <span>${ch.source === 'llm' ? '🤖 AI生成' : '✍️ 模拟'}</span>
        </div>
      </div>
    `).join('');
  } else {
    chapterEl.innerHTML = '<p class="text-stone text-center" style="padding:16px 0;font-size:13px">尚未有江湖事迹，去各处走走吧。</p>';
  }

  // 任务
  checkQuests();
  const d2 = getData();
  const questEl = document.getElementById('quest-list');
  const activeQuests = d2.quests.active || [];
  const completedQuests = (d2.quests.completed || []).slice(-3);
  if (activeQuests.length > 0) {
    questEl.innerHTML = activeQuests.map(q => `
      <div class="quest-item">
        <div class="quest-icon">⚔️</div>
        <div class="quest-info">
          <div class="quest-name">${q.name}</div>
          <div class="quest-desc">${q.desc} (${q.progress}/${q.target})</div>
        </div>
        <div class="quest-reward">+${q.reward}EXP</div>
      </div>
    `).join('');
  } else if (completedQuests.length > 0) {
    questEl.innerHTML = completedQuests.map(q => `
      <div class="quest-item" style="opacity:0.6">
        <div class="quest-icon">✅</div>
        <div class="quest-info">
          <div class="quest-name">${q.name}</div>
          <div class="quest-desc">已完成</div>
        </div>
        <div class="quest-reward">+${q.reward}EXP</div>
      </div>
    `).join('') + '<p class="text-stone text-center mt-2" style="font-size:11px">所有任务已完成</p>';
  } else {
    questEl.innerHTML = '<p class="text-stone text-center" style="padding:8px 0;font-size:12px">暂无任务</p>';
  }
}

// 初始化
renderHome();
</script>
</body>
</html>
