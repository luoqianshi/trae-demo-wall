.badge-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.badge-item {
  text-align: center;
  padding: 12px 8px;
  border-radius: 8px;
  transition: all 0.3s ease;
}

.badge-item.unlocked {
  background: rgba(74,124,89,0.08);
  border: 1px solid rgba(74,124,89,0.2);
}

  box-shadow: 0 4px 12px rgba(74,124,89,0.15);
}

.badge-item.locked {
  background: rgba(100,100,100,0.05);
  border: 1px dashed rgba(150,150,150,0.3);
  opacity: 0.6;
}

.badge-icon {

}

<script>
function goBack() { window.location.href = '../index.html'; }
function goTo(url) { window.location.href = url; }

function getBadgeSVG(icon, color, unlocked) {
  const size = 60;
  const cx = size / 2;
  const cy = size / 2;
  const opacity = unlocked ? 1 : 0.3;
  const strokeOpacity = unlocked ? 1 : 0.2;
  
  let innerSVG = '';
  
  if (icon === 'cross') {
    innerSVG = `
      <circle cx="${cx}" cy="${cy}" r="16" fill="${color}" opacity="${opacity * 0.2}"/>
      <line x1="${cx - 10}" y1="${cy}" x2="${cx + 10}" y2="${cy}" stroke="${color}" stroke-width="4" stroke-linecap="round" opacity="${opacity}"/>
      <line x1="${cx}" y1="${cy - 10}" x2="${cx}" y2="${cy + 10}" stroke="${color}" stroke-width="4" stroke-linecap="round" opacity="${opacity}"/>
      <circle cx="${cx}" cy="${cy}" r="5" fill="${color}" opacity="${opacity}"/>
    `;
  } else if (icon === 'balance') {
    innerSVG = `
      <circle cx="${cx}" cy="${cy}" r="16" fill="${color}" opacity="${opacity * 0.2}"/>
      <line x1="${cx}" y1="${cy - 14}" x2="${cx}" y2="${cy + 14}" stroke="${color}" stroke-width="3" opacity="${opacity}"/>
      <line x1="${cx - 16}" y1="${cy - 14}" x2="${cx + 16}" y2="${cy - 14}" stroke="${color}" stroke-width="3" stroke-linecap="round" opacity="${opacity}"/>
      <ellipse cx="${cx - 12}" cy="${cy - 14}" rx="5" ry="3" fill="${color}" opacity="${opacity * 0.6}"/>
      <ellipse cx="${cx + 12}" cy="${cy - 14}" rx="5" ry="3" fill="${color}" opacity="${opacity * 0.6}"/>
      <circle cx="${cx}" cy="${cy + 12}" r="4" fill="${color}" opacity="${opacity}"/>
    `;
  } else if (icon === 'crystal') {
    innerSVG = `
      <circle cx="${cx}" cy="${cy}" r="16" fill="${color}" opacity="${opacity * 0.2}"/>
      <polygon points="${cx},${cy-14} ${cx+12},${cy-2} ${cx+12},${cy+10} ${cx},${cy+16} ${cx-12},${cy+10} ${cx-12},${cy-2}" fill="${color}" opacity="${opacity * 0.7}" stroke="${color}" stroke-width="2" opacity="${opacity}"/>
      <line x1="${cx}" y1="${cy-14}" x2="${cx}" y2="${cy+16}" stroke="white" stroke-width="1" opacity="${opacity * 0.5}"/>
      <circle cx="${cx - 3}" cy="${cy - 4}" r="2" fill="white" opacity="${opacity * 0.6}"/>
    `;
  }
  
  return `
    <svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
      <defs>
        <linearGradient id="badgeGrad-${icon}" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="${color}" stop-opacity="${opacity * 0.3}"/>
          <stop offset="100%" stop-color="${color}" stop-opacity="${opacity * 0.1}"/>
        </linearGradient>
      </defs>
      <path d="M${cx},${size-8} L${size-8},${cy+10} L${size-8},${8} L${cx},${2} L${8},${8} L${8},${cy+10} Z" 
            fill="url(#badgeGrad-${icon})" stroke="${color}" stroke-width="2" opacity="${strokeOpacity}"/>
      <path d="M${cx},${size-8} L${size-8},${cy+10} L${size-8},${8} L${cx},${2} L${8},${8} L${8},${cy+10} Z" 
            fill="none" stroke="${color}" stroke-width="2" opacity="${opacity}" stroke-linejoin="round"/>
      ${innerSVG}
      ${!unlocked ? `<rect x="0" y="0" width="${size}" height="${size}" fill="rgba(0,0,0,0.15)"/><path d="M${size*0.2},${size*0.8} L${size*0.8},${size*0.2}" stroke="#999" stroke-width="3" stroke-linecap="round" opacity="0.6"/>` : ''}
    </svg>
  `;
}

function renderBadges() {
  checkBadges();
  const badges = getBadges();
  const el = document.getElementById('badge-grid');
  
  if (!el) return;
  
  let html = '';
  
  badges.unlocked.forEach(b => {
    html += `
      <div class="badge-item unlocked">
        <div class="badge-icon">${getBadgeSVG(b.icon, b.color, true)}</div>
        <div class="badge-name">${b.name}</div>
        <div class="badge-desc">${b.desc}</div>
        <div class="badge-date">${b.unlockedAt}</div>
      </div>
    `;
  });
  
  badges.locked.forEach(b => {
    html += `
      <div class="badge-item locked">
        <div class="badge-icon">${getBadgeSVG(b.icon, b.color, false)}</div>
        <div class="badge-name">${b.name}</div>
        <div class="badge-desc">${b.desc}</div>
        <div class="badge-locked-hint">未解锁</div>
      </div>
    `;
  });
  
  el.innerHTML = html;
}

const STAGE_NAMES = ['荒地', '嫩芽初现', '新竹三五', '翠竹成行', '竹林小成', '郁郁葱葱', '竹海连绵', '仙竹环绕', '竹林秘境', '万竹归宗', '竹仙境界'];
const STAGE_DESCS = [
  '你的竹林才刚刚发芽...',
  '几株嫩竹破土而出，生机盎然。',
  '三五新竹亭亭玉立，初具规模。',

  '郁郁葱葱，竹影婆娑，已有鸟雀栖息。',
  '竹海连绵，走入其中，心旷神怡。',
  '仙气缭绕，竹林间似有灵光闪动。',
  '竹林秘境，竹仙时常现身指点。',
  '万竹归宗，每一株竹都记录着你的修为。',
  '竹仙境界，你已是竹林的主人。'
];

function drawBamboo(stage) {
  const group = document.getElementById('bamboo-group');
  const count = Math.min(stage * 3 + 1, 30);
  let html = '';

  for (let i = 0; i < count; i++) {
    const x = 40 + (i % 10) * 36 + Math.sin(i * 0.7) * 8;
    const y = 300 - Math.random() * 10;
    const h = 80 + (stage * 15) + Math.random() * 40;
    const w = 6 + stage * 0.4;
    const opacity = 0.6 + Math.random() * 0.4;

    // 竹竿
    html += `<rect x="${x - w/2}" y="${y - h}" width="${w}" height="${h}" rx="2" fill="url(#bambooGrad)" opacity="${opacity}"/>`;

    // 竹节
    const segments = Math.floor(h / 30);
    for (let s = 1; s < segments; s++) {
      html += `<line x1="${x - w/2 - 2}" y1="${y - s * 30}" x2="${x + w/2 + 2}" y2="${y - s * 30}" stroke="#3D6B4A" stroke-width="1.5" opacity="${opacity}"/>`;
    }

    // 竹叶（高处才长叶）
    if (stage >= 1) {
      const leafY = y - h + 5;
      const leafCount = 2 + Math.floor(stage / 2);
      for (let l = 0; l < leafCount; l++) {
        const angle = -60 + l * (120 / leafCount);
        const rad = angle * Math.PI / 180;
        const lx = x + Math.sin(rad) * 20;
        const ly = leafY - Math.abs(Math.cos(rad)) * 8;
        html += `<ellipse cx="${lx}" cy="${ly}" rx="12" ry="3" transform="rotate(${angle} ${lx} ${ly})" fill="#5B8C6A" opacity="${opacity * 0.8}"/>`;
      }
    }
  }

  // 如果stage足够高，加竹笋
  if (stage >= 3) {
    for (let i = 0; i < Math.min(stage - 2, 5); i++) {
      const x = 50 + Math.random() * 300;
      const y = 295 + Math.random() * 8;
      html += `<path d="M${x-4},${y} L${x},${y-14} L${x+4},${y} Z" fill="#6BAE7A" opacity="0.7"/>`;
    }
  }

  // 如果stage很高，加灵气粒子
  if (stage >= 7) {
    for (let i = 0; i < 5; i++) {
      const x = 60 + Math.random() * 280;
      const y = 80 + Math.random() * 120;
      html += `<circle cx="${x}" cy="${y}" r="2" fill="#E8D174" opacity="0.6"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite" begin="${i * 0.6}s"/></circle>`;
    }
  }

  group.innerHTML = html;
}

function renderForest() {
  const d = getData();
  updateForest();
  const d2 = getData();
  const stage = d2.hero.forestStage || 0;

  drawBamboo(stage);

  // 阶段标记
  const stageEl = document.getElementById('forest-stage');
  stageEl.innerHTML = STAGE_NAMES.map((name, i) => 
    `<div class="stage-badge ${i <= stage ? 'active' : ''}">${name}</div>`
  ).join('');

  document.getElementById('forest-desc').textContent = STAGE_DESCS[stage] || STAGE_DESCS[0];

  // 角色信息
  const lvInfo = calcLevel(d2.hero.exp);
  document.getElementById('hero-name').textContent = d2.user.name || '少侠';
  document.getElementById('hero-title').textContent = (d2.hero.title || getTitleByLevel(lvInfo.level)) + ' · Lv.' + lvInfo.level;
  document.getElementById('attr-wisdom').textContent = d2.hero.wisdom || 10;
  document.getElementById('attr-courage').textContent = d2.hero.courage || 10;
  document.getElementById('attr-luck').textContent = d2.hero.luck || 10;
  document.getElementById('exp-text').textContent = '经验 ' + lvInfo.curExp + '/' + lvInfo.needExp;
  document.getElementById('exp-level').textContent = 'Lv.' + lvInfo.level;
  document.getElementById('exp-fill').style.width = lvInfo.pct + '%';
  document.getElementById('hero-coins').textContent = d2.hero.coins || 0;
  document.getElementById('stat-exams').textContent = d2.stats.totalCheckups || 0;
  document.getElementById('stat-decisions').textContent = d2.stats.totalDecisions || 0;
  document.getElementById('stat-predictions').textContent = d2.stats.totalPredictions || 0;
}

function renderQuests() {
  checkQuests();
  const d = getData();
  const el = document.getElementById('quest-list');
  const active = d.quests.active || [];
  const completed = d.quests.completed || [];

  if (active.length === 0 && completed.length === 0) {
    el.innerHTML = '<p class="text-stone text-center" style="padding:12px 0">暂无任务</p>';
    return;
  }

  let html = '';
  active.forEach(q => {
    const pct = q.target > 0 ? (q.progress / q.target * 100) : 0;
    html += `
      <div class="quest-item">
        <div class="quest-icon">⚔️</div>
        <div class="quest-info">
          <div class="quest-name">${q.name}</div>
          <div class="quest-desc">${q.desc}</div>
          <div class="exp-track mt-1" style="height:4px"><div class="exp-fill" style="width:${pct}%"></div></div>
          <div style="font-size:11px;color:var(--stone);margin-top:2px">${q.progress}/${q.target}</div>
        </div>
        <div class="quest-reward">+${q.reward}EXP</div>
      </div>
    `;
  });

  completed.slice(-5).forEach(q => {
    html += `
      <div class="quest-item" style="opacity:0.5">
        <div class="quest-icon">✅</div>
        <div class="quest-info">
          <div class="quest-name">${q.name}</div>
          <div class="quest-desc">已完成</div>
        </div>
        <div class="quest-reward">+${q.reward}EXP</div>
      </div>
    `;
  });

  el.innerHTML = html;
}

function renderChapters() {
  const d = getData();
  const el = document.getElementById('chapter-list');
  if (!d.chapters || d.chapters.length === 0) {
    el.innerHTML = '<p class="text-stone text-center" style="padding:20px 0">尚未有江湖事迹，去各处走走吧。</p>';
    return;
  }
  el.innerHTML = d.chapters.map(ch => `
    <div class="chapter-card">
      <div class="chapter-title">${ch.title}</div>
      <div class="chapter-body">${ch.body}</div>
      <div class="chapter-meta">
        <span>📅 ${ch.date}</span>
        <span>${ch.source === 'llm' ? '🤖 AI生成' : '✍️ 模拟'}</span>
        <span>${ch.type === 'exam' ? '🏥' : ch.type === 'decision' ? '⚖️' : '🔮'}</span>
      </div>
    </div>
  `).join('');
}

function renderWisdomScrolls() {
  const grid = document.getElementById('scroll-grid');
  grid.innerHTML = WISDOM_SCROLLS.map((ws, i) => `
    <div class="wisdom-scroll-card" onclick="flipScroll(this)" data-flipped="false">
      <div class="wisdom-scroll-inner">
        <div class="wisdom-scroll-front">
          <div class="ws-icon">${ws.icon}</div>
          <div class="ws-title">${ws.title}</div>
          <div class="ws-hint">「${ws.front}」</div>
          <div class="ws-tap-hint">点击翻看</div>
        </div>
        <div class="wisdom-scroll-back">
          <div class="ws-back-title">${ws.icon} ${ws.title}</div>
          <div class="ws-back-content">${ws.back}</div>
          <div class="ws-tap-hint">点击翻回</div>
        </div>
      </div>
    </div>
  `).join('');
}

function flipScroll(card) {
  const isFlipped = card.getAttribute('data-flipped') === 'true';
  card.setAttribute('data-flipped', isFlipped ? 'false' : 'true');
}

// 初始化（竹简翻牌优先，不受其他模块影响）
