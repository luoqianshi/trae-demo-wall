function validateForm(prefix) {
  let isValid = true;
  const fields = [
    { id: 'age', label: '年龄', type: 'range', min: 18, max: 100, required: false },
    { id: 'income', label: '月收入', type: 'nonNegative', required: true },
    { id: 'savings', label: '当前积蓄', type: 'nonNegative', required: true },
    { id: 'debt', label: '负债总额', type: 'nonNegative', required: false },
    { id: 'fixed', label: '月固定支出', type: 'nonNegative', required: true },
    { id: 'flexible', label: '月弹性支出', type: 'nonNegative', required: false },
    { id: 'insurance', label: '保险保障', type: 'range', min: 0, max: 100, required: false },
    { id: 'invest', label: '投资比例', type: 'range', min: 0, max: 100, required: false },
    { id: 'goal', label: '目标清晰度', type: 'range', min: 0, max: 100, required: false }
  ];

  fields.forEach(field => {
    const el = document.getElementById(prefix + '-' + field.id);
    if (!el) return;
    
    const value = el.value.trim();
    const group = el.closest('.form-group');
    const errorEl = group.querySelector('.field-error');
    
    if (errorEl) errorEl.remove();
    
    group.classList.remove('has-error');

    if (value === '') {
      if (field.required) {
        showFieldError(group, field.label + '不能为空');
        isValid = false;
      }
      return;
    }

    const numValue = Number(value);
    if (isNaN(numValue)) {
      showFieldError(group, field.label + '请输入有效数字');
      isValid = false;
      return;
    }

    if (field.type === 'nonNegative') {
      if (numValue < 0) {
        showFieldError(group, field.label + '不能为负数');
        isValid = false;
      }
    } else if (field.type === 'range') {
      if (numValue < field.min || numValue > field.max) {
        showFieldError(group, field.label + '请输入' + field.min + '-' + field.max + '之间的数值');
        isValid = false;
      }
    }
  });

  if (!isValid) {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  
  return isValid;
}

function showFieldError(group, message) {
  group.classList.add('has-error');
  const errorEl = document.createElement('div');
  errorEl.className = 'field-error show';
  errorEl.textContent = '⚠️ ' + message;
  group.appendChild(errorEl);
  
  const input = group.querySelector('input');
  if (input) {
    input.addEventListener('input', function clearError() {
      errorEl.remove();
      group.classList.remove('has-error');
      input.removeEventListener('input', clearError);
    });
  }
}

function clearValidationErrors(prefix) {
  const section = document.getElementById(prefix === 'f' ? 'demo-section' : 'precise-section');
  if (!section) return;
  section.querySelectorAll('.field-error').forEach(el => el.remove());
  section.querySelectorAll('.form-group').forEach(el => el.classList.remove('has-error'));
}

const DIM_KEYS = ['saving', 'debt', 'liquidity', 'protection', 'investment', 'consumption', 'goal', 'emergency'];
let quizAnswers = {};

function buildQuiz() {
  const container = document.getElementById('quiz-questions');
  const dots = document.getElementById('quiz-dots');
  dots.innerHTML = QUIZ_QUESTIONS.map((_, i) =>
    `<span class="dot" id="dot-${i}"></span>`
  ).join('');

  container.innerHTML = QUIZ_QUESTIONS.map((q, qi) => `
    <div class="quiz-card" id="quiz-card-${qi}">
      <div class="q-header">
        <span class="q-num">${qi + 1}</span>
        <span class="q-text">${q.text}</span>
      </div>
      <div class="q-options" id="q-opts-${qi}">
        ${q.options.map((o, oi) => `
          <span class="q-opt" onclick="pickQuiz(${qi}, ${oi})">${o.label}</span>
        `).join('')}
      </div>
    </div>
  `).join('');

  updateProgress();
}

function pickQuiz(qi, oi) {
  quizAnswers[qi] = oi;
  // Update visual
  const opts = document.querySelectorAll(`#q-opts-${qi} .q-opt`);
  opts.forEach((el, i) => el.classList.toggle('picked', i === oi));
  // Highlight card
  document.getElementById(`quiz-card-${qi}`).classList.add('selected');
  // Update progress
  updateProgress();
}

function updateProgress() {
  const answered = Object.keys(quizAnswers).length;
  document.getElementById('quiz-status').textContent = `${answered}/${QUIZ_QUESTIONS.length} 题`;
  QUIZ_QUESTIONS.forEach((_, i) => {
    document.getElementById(`dot-${i}`).classList.toggle('done', quizAnswers[i] !== undefined);
  });
  const btn = document.getElementById('quiz-submit-btn');
  if (answered === QUIZ_QUESTIONS.length) {
    btn.disabled = false;
    btn.textContent = '六问已毕，开始把脉';
  } else {
    btn.disabled = true;
    btn.textContent = `回答全部 6 题后开始把脉`;
  }
}

function submitQuiz() {
  if (Object.keys(quizAnswers).length < QUIZ_QUESTIONS.length) return;

  // Calculate dimension scores from quiz answers
  const dimAccum = {};
  const dimCount = {};
  QUIZ_QUESTIONS.forEach((q, qi) => {
    const chosen = q.options[quizAnswers[qi]];
    Object.entries(chosen.score).forEach(([dim, val]) => {
      dimAccum[dim] = (dimAccum[dim] || 0) + val;
      dimCount[dim] = (dimCount[dim] || 0) + 1;
    });
  });

  // Average per dimension
  const dimensions = {};
  DIM_KEYS.forEach(key => {
    if (dimCount[key]) {
      dimensions[key] = Math.round(dimAccum[key] / dimCount[key]);
    } else {
      dimensions[key] = 50; // unreachable, but guard
    }
  });

  // Total score: weighted average
  const total = Math.round(
    DIM_KEYS.reduce((sum, k) => sum + dimensions[k], 0) / DIM_KEYS.length
  );

  const result = simulateExamFromDims(dimensions, total);
  finishExam(result, 'quick');
}

function simulateExam(formData) {
  const income = Number(formData.income) || 0;
  const savings = Number(formData.savings) || 0;
  const debt = Number(formData.debt) || 0;
  const monthlyFixed = Number(formData.monthlyFixed) || 0;
  const flexible = Number(formData.flexible) || 0;
  const insurance = Number(formData.insurance) || 0;
  const invest = Number(formData.invest) || 0;
  const goalClarity = Number(formData.goalClarity) || 0;

  const saving = income > 0
    ? Math.min(100, Math.round((savings / Math.max(income * 12, 1)) * 200))
    : Math.min(100, Math.round((savings / Math.max(monthlyFixed * 6, 1)) * 100));

  const debtScore = income > 0
    ? Math.max(0, 100 - Math.round((debt / Math.max(income * 12, 1)) * 200))
    : (debt === 0 ? 100 : 30);

  const liquidity = monthlyFixed > 0
    ? Math.min(100, Math.round((savings / monthlyFixed) * 20))
    : (savings > 0 ? 100 : 50);

  const protection = Math.min(100, Math.round(insurance * 1.5));

  const investment = income > 0
    ? Math.min(100, Math.round((invest / income) * 200))
    : Math.min(100, invest);

  const consumption = income > 0
    ? Math.max(0, 100 - Math.abs(Math.round(((flexible / income) - 0.2) * 200)))
    : 50;

  const goal = Math.min(100, goalClarity);

  const totalMonthlyExpense = monthlyFixed + flexible;
  const emergency = totalMonthlyExpense > 0
    ? Math.min(100, Math.round((savings / totalMonthlyExpense) * 25))
    : (savings > 0 ? 80 : 30);

  const dimensions = {
    saving: Math.max(5, Math.min(100, saving)),
    debt: Math.max(5, Math.min(100, debtScore)),
    liquidity: Math.max(5, Math.min(100, liquidity)),
    protection: Math.max(5, Math.min(100, protection)),
    investment: Math.max(5, Math.min(100, investment)),
    consumption: Math.max(5, Math.min(100, consumption)),
    goal: Math.max(5, Math.min(100, goal)),
    emergency: Math.max(5, Math.min(100, emergency))
  };

  const weights = { saving: 1.5, debt: 1.5, liquidity: 1, protection: 1, investment: 1, consumption: 1, goal: 1, emergency: 1 };
  let totalWeight = 0, weightedSum = 0;
  for (const [key, val] of Object.entries(dimensions)) {
    const w = weights[key];
    weightedSum += val * w;
    totalWeight += w;
  }
  const score = Math.round(weightedSum / totalWeight);

  let overall, advice;
  if (score >= 80) {
    overall = '康健';
    advice = '财脉康健，根基扎实。储蓄有方，负债可控，应急有余。建议在现有基础上适当增加投资比例，让钱生钱。每月复盘一次，保持即可。';
  } else if (score >= 60) {
    overall = '尚可';
    advice = '脉象平稳，但隐有淤堵。若结余偏低，需审视弹性支出；若应急不足，当先蓄三月之粮。小步调整，三月后再来复诊。';
  } else {
    overall = '虚弱';
    advice = '财脉虚弱，需速调理。若入不敷出，当先开源节流；若负债沉重，制定还款计划为第一要务。先从记账开始，知晓银钱去向，再徐徐图之。';
  }

  return { score, overall, advice, dimensions };
}

  if (mode === 'quick') {

  document.querySelector('.card:has(#quiz-section)').classList.remove('hidden');
}
