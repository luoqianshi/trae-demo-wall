<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天训练室 - 从把天聊死到聊天高手</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --warm-bg: #FDF8F3;
            --warm-card: #FFFFFF;
            --warm-primary: #E8A87C;
            --warm-primary-light: #F5D5C0;
            --warm-secondary: #85C1B2;
            --warm-accent: #D4A574;
            --warm-text: #4A403A;
            --warm-text-light: #8B7E74;
            --warm-border: #F0E6DC;
            --warm-shadow: rgba(74, 64, 58, 0.08);
            --warm-highlight: #FFF5EB;
            --warm-success: #7EB8A2;
            --warm-warning: #E8A87C;
            --warm-danger: #D4918C;
            --warm-purple: #B8A9C9;
            --warm-blue: #9BB8D3;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--warm-bg);
            color: var(--warm-text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 背景装饰 */
        .bg-decoration {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .bg-decoration::before {
            content: '';
            position: absolute;
            top: -50%; right: -20%;
            width: 80%; height: 100%;
            background: radial-gradient(ellipse, var(--warm-primary-light) 0%, transparent 70%);
            opacity: 0.4;
            animation: float 20s ease-in-out infinite;
        }
        .bg-decoration::after {
            content: '';
            position: absolute;
            bottom: -30%; left: -10%;
            width: 60%; height: 80%;
            background: radial-gradient(ellipse, var(--warm-secondary) 0%, transparent 70%);
            opacity: 0.15;
            animation: float 25s ease-in-out infinite reverse;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.05); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }

        /* 主容器 */
        .app-container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        /* 头部 */
        .header {
            text-align: center;
            padding: 40px 0 30px;
            animation: fadeInDown 0.8s ease-out;
        }
        .header h1 {
            font-family: 'Noto Serif SC', serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--warm-text);
            margin-bottom: 10px;
        }
        .header .subtitle {
            font-size: 1.1rem;
            color: var(--warm-text-light);
            font-weight: 300;
        }

        /* 导航标签 */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            animation: fadeInUp 0.8s ease-out 0.2s both;
            flex-wrap: wrap;
        }
        .nav-tab {
            padding: 12px 24px;
            border-radius: 50px;
            border: 2px solid var(--warm-border);
            background: var(--warm-card);
            color: var(--warm-text-light);
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Sans SC', sans-serif;
        }
        .nav-tab:hover {
            border-color: var(--warm-primary);
            color: var(--warm-primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--warm-shadow);
        }
        .nav-tab.active {
            background: var(--warm-primary);
            border-color: var(--warm-primary);
            color: white;
            box-shadow: 0 4px 16px rgba(232, 168, 124, 0.3);
        }

        /* 内容区域 */
        .content-area { animation: fadeIn 0.6s ease-out; }
        .section { display: none; }
        .section.active { display: block; }

        /* 分类选择卡片 */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .category-card {
            background: var(--warm-card);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            box-shadow: 0 2px 12px var(--warm-shadow);
        }
        .category-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px var(--warm-shadow);
            border-color: var(--warm-primary-light);
        }
        .category-card.active {
            border-color: var(--warm-primary);
            background: var(--warm-highlight);
        }
        .category-icon {
            font-size: 2rem;
            margin-bottom: 8px;
        }
        .category-title {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 4px;
        }
        .category-desc {
            font-size: 0.8rem;
            color: var(--warm-text-light);
        }

        /* 聊天训练区 */
        .chat-container {
            background: var(--warm-card);
            border-radius: 24px;
            box-shadow: 0 8px 32px var(--warm-shadow);
            overflow: hidden;
            min-height: 500px;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            padding: 20px 24px;
            background: linear-gradient(135deg, var(--warm-primary-light) 0%, var(--warm-highlight) 100%);
            border-bottom: 1px solid var(--warm-border);
        }
        .chat-header h3 {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.2rem;
            color: var(--warm-text);
        }
        .chat-header .scene-info {
            font-size: 0.85rem;
            color: var(--warm-text-light);
            margin-top: 4px;
        }
        .chat-messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            max-height: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            display: flex;
            gap: 12px;
            animation: slideIn 0.4s ease-out;
        }
        .message.user { flex-direction: row-reverse; }
        .message-avatar {
            width: 40px; height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .message.bot .message-avatar { background: var(--warm-primary-light); }
        .message.user .message-avatar { background: var(--warm-secondary); }
        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .message.bot .message-content {
            background: var(--warm-highlight);
            border-bottom-left-radius: 4px;
        }
        .message.user .message-content {
            background: var(--warm-secondary);
            color: white;
            border-bottom-right-radius: 4px;
        }

        /* 选项区域 */
        .options-area {
            padding: 20px 24px;
            background: var(--warm-bg);
            border-top: 1px solid var(--warm-border);
        }
        .options-title {
            font-size: 0.9rem;
            color: var(--warm-text-light);
            margin-bottom: 12px;
            font-weight: 500;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-btn {
            padding: 14px 18px;
            background: var(--warm-card);
            border: 2px solid var(--warm-border);
            border-radius: 14px;
            cursor: pointer;
            text-align: left;
            font-size: 0.95rem;
            color: var(--warm-text);
            transition: all 0.3s ease;
            font-family: 'Noto Sans SC', sans-serif;
            line-height: 1.5;
        }
        .option-btn:hover {
            border-color: var(--warm-primary);
            background: var(--warm-highlight);
            transform: translateX(4px);
        }
        .option-btn.selected { border-color: var(--warm-primary); background: var(--warm-primary-light); }
        .option-btn.correct { border-color: var(--warm-success); background: #E8F5F0; }
        .option-btn.incorrect { border-color: var(--warm-danger); background: #FDF0EF; }

        /* 反馈区域 */
        .feedback-area {
            margin-top: 16px;
            padding: 16px;
            border-radius: 14px;
            animation: fadeIn 0.4s ease-out;
        }
        .feedback-area.good { background: #E8F5F0; border: 1px solid var(--warm-success); }
        .feedback-area.bad { background: #FDF0EF; border: 1px solid var(--warm-danger); }
        .feedback-title {
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .feedback-area.good .feedback-title { color: var(--warm-success); }
        .feedback-area.bad .feedback-title { color: var(--warm-danger); }
        .feedback-text {
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--warm-text);
        }
        .feedback-tip {
            margin-top: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--warm-text-light);
        }
        .next-btn {
            margin-top: 12px;
            padding: 10px 24px;
            background: var(--warm-primary);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Sans SC', sans-serif;
        }
        .next-btn:hover {
            background: var(--warm-accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(232, 168, 124, 0.3);
        }

        /* 技巧学习卡片 */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .skill-card {
            background: var(--warm-card);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 4px 20px var(--warm-shadow);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .skill-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 32px var(--warm-shadow);
            border-color: var(--warm-primary-light);
        }
        .skill-card.expanded {
            border-color: var(--warm-primary);
            grid-column: 1 / -1;
        }
        .skill-number {
            display: inline-block;
            width: 32px; height: 32px;
            background: var(--warm-primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }
        .skill-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--warm-text);
        }
        .skill-desc {
            font-size: 0.9rem;
            color: var(--warm-text-light);
            line-height: 1.6;
        }
        .skill-detail {
            display: none;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--warm-border);
        }
        .skill-card.expanded .skill-detail {
            display: block;
            animation: fadeIn 0.4s ease-out;
        }
        .skill-example {
            background: var(--warm-highlight);
            padding: 16px;
            border-radius: 12px;
            margin-top: 12px;
        }
        .skill-example-label {
            font-size: 0.8rem;
            color: var(--warm-primary);
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .skill-example-dialog {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .example-line {
            font-size: 0.9rem;
            line-height: 1.5;
        }
        .example-line .speaker {
            font-weight: 600;
            color: var(--warm-primary);
        }

        /* 进度统计 */
        .stats-container {
            background: var(--warm-card);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 4px 20px var(--warm-shadow);
            text-align: center;
        }
        .stats-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.3rem;
            margin-bottom: 24px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }
        .stat-item {
            padding: 20px;
            background: var(--warm-bg);
            border-radius: 16px;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--warm-primary);
            font-family: 'Noto Serif SC', serif;
        }
        .stat-label {
            font-size: 0.85rem;
            color: var(--warm-text-light);
            margin-top: 4px;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--warm-border);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--warm-primary), var(--warm-secondary));
            border-radius: 4px;
            transition: width 0.6s ease;
        }

        .ai-end-btn {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            padding: 8px 16px;
            border: 1px solid var(--warm-border);
            border-radius: 20px;
            background: var(--warm-bg);
            color: var(--warm-text-light);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .ai-end-btn:hover {
            border-color: var(--warm-primary);
            color: var(--warm-primary);
            background: rgba(232, 168, 124, 0.05);
        }

        /* AI陪练区 */
        .ai-role-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .ai-role-card {
            background: var(--warm-card);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            box-shadow: 0 2px 12px var(--warm-shadow);
        }
        .ai-role-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px var(--warm-shadow);
        }
        .ai-role-card.active {
            border-color: var(--warm-secondary);
            background: #F0F9F6;
        }
        .ai-role-avatar {
            font-size: 2.5rem;
            margin-bottom: 8px;
        }
        .ai-role-name {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 4px;
        }
        .ai-role-desc {
            font-size: 0.8rem;
            color: var(--warm-text-light);
        }

        /* AI聊天输入 */
        .ai-input-area {
            display: flex;
            gap: 10px;
            padding: 16px 24px;
            background: var(--warm-bg);
            border-top: 1px solid var(--warm-border);
        }
        .ai-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid var(--warm-border);
            border-radius: 50px;
            font-size: 0.95rem;
            font-family: 'Noto Sans SC', sans-serif;
            outline: none;
            transition: border-color 0.3s ease;
        }
        .ai-input:focus {
            border-color: var(--warm-primary);
        }
        .ai-send-btn {
            padding: 12px 24px;
            background: var(--warm-secondary);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Sans SC', sans-serif;
        }
        .ai-send-btn:hover {
            background: #6BAF9E;
            transform: translateY(-2px);
        }

        /* 打字机效果 */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: var(--warm-highlight);
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            width: fit-content;
        }
        .typing-dot {
            width: 8px; height: 8px;
            background: var(--warm-primary);
            border-radius: 50%;
            animation: typingBounce 1.4s ease-in-out infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        /* 开始屏幕 */
        .start-screen {
            text-align: center;
            padding: 60px 20px;
        }
        .start-screen h2 {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.8rem;
            margin-bottom: 16px;
        }
        .start-screen p {
            color: var(--warm-text-light);
            margin-bottom: 32px;
            line-height: 1.8;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        .start-btn {
            padding: 16px 48px;
            background: var(--warm-primary);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Sans SC', sans-serif;
            box-shadow: 0 4px 16px rgba(232, 168, 124, 0.3);
        }
        .start-btn:hover {
            background: var(--warm-accent);
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(232, 168, 124, 0.4);
        }

        /* 场景选择器 */
        .scene-selector {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 0;
            margin-bottom: 16px;
        }
        .scene-chip {
            padding: 8px 16px;
            background: var(--warm-card);
            border: 2px solid var(--warm-border);
            border-radius: 50px;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
            font-family: 'Noto Sans SC', sans-serif;
        }
        .scene-chip:hover {
            border-color: var(--warm-primary);
        }
        .scene-chip.active {
            background: var(--warm-primary);
            border-color: var(--warm-primary);
            color: white;
        }

        /* 动画 */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* API配置区域 */
        .api-config-area {
            background: var(--warm-card);
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px var(--warm-shadow);
            overflow: hidden;
        }
        .api-config-toggle {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .api-config-toggle:hover {
            background: var(--warm-highlight);
        }
        .api-status {
            font-size: 0.8rem;
            padding: 4px 12px;
            border-radius: 50px;
            font-weight: 500;
        }
        .api-status.connected {
            background: #E8F5F0;
            color: var(--warm-success);
        }
        .api-status.disconnected {
            background: #FDF0EF;
            color: var(--warm-danger);
        }
        .api-config-panel {
            border-top: 1px solid var(--warm-border);
            animation: fadeIn 0.3s ease-out;
        }
        .api-config-content {
            padding: 20px;
        }
        .api-info {
            font-size: 0.85rem;
            color: var(--warm-text-light);
            margin-bottom: 8px;
        }
        .api-info a {
            color: var(--warm-primary);
            text-decoration: none;
        }
        .api-input, .api-select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--warm-border);
            border-radius: 12px;
            font-size: 0.9rem;
            font-family: 'Noto Sans SC', sans-serif;
            margin-bottom: 12px;
            outline: none;
            transition: border-color 0.3s ease;
        }
        .api-input:focus, .api-select:focus {
            border-color: var(--warm-primary);
        }
        .api-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        .api-save-btn, .api-test-btn {
            flex: 1;
            padding: 10px 20px;
            border: none;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Sans SC', sans-serif;
        }
        .api-save-btn {
            background: var(--warm-primary);
            color: white;
        }
        .api-save-btn:hover {
            background: var(--warm-accent);
        }
        .api-test-btn {
            background: var(--warm-bg);
            color: var(--warm-text);
            border: 2px solid var(--warm-border);
        }
        .api-test-btn:hover {
            border-color: var(--warm-primary);
        }
        .api-tip {
            font-size: 0.8rem;
            color: var(--warm-text-light);
            font-style: italic;
        }

        /* 加载动画 */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--warm-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-spinner {
            width: 60px;
            height: 60px;
            margin-bottom: 20px;
        }
        .spinner {
            width: 100%;
            height: 100%;
            border: 4px solid var(--warm-border);
            border-top-color: var(--warm-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            font-size: 1.1rem;
            color: var(--warm-text-light);
            font-family: 'Noto Serif SC', serif;
        }

        /* 评价弹窗 */
        .evaluation-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10001;
            animation: fadeIn 0.3s ease-out;
        }
        .evaluation-overlay.hidden {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .evaluation-container {
            background: var(--warm-card);
            border-radius: 24px;
            max-width: 500px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.15);
            animation: slideUp 0.4s ease-out;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .evaluation-header {
            display: flex;
            align-items: center;
            padding: 24px;
            background: linear-gradient(135deg, var(--warm-primary-light) 0%, var(--warm-highlight) 100%);
            border-radius: 24px 24px 0 0;
            position: relative;
        }
        .evaluation-avatar {
            font-size: 3rem;
            margin-right: 16px;
        }
        .evaluation-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--warm-text);
        }
        .evaluation-close {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            border: none;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            font-size: 1.2rem;
            color: var(--warm-text-light);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .evaluation-close:hover {
            background: rgba(255, 255, 255, 1);
            color: var(--warm-text);
        }
        .evaluation-total {
            text-align: center;
            padding: 24px;
            background: var(--warm-bg);
        }
        .total-score {
            font-size: 4rem;
            font-weight: 700;
            color: var(--warm-primary);
            font-family: 'Noto Serif SC', serif;
            line-height: 1;
        }
        .total-label {
            font-size: 0.9rem;
            color: var(--warm-text-light);
            margin-top: 8px;
        }
        .total-comment {
            font-size: 1rem;
            color: var(--warm-text);
            margin-top: 12px;
            font-weight: 500;
        }
        .evaluation-dimensions {
            padding: 0 24px 24px;
        }
        .dimension-item {
            margin-bottom: 20px;
        }
        .dimension-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .dimension-icon {
            font-size: 1.2rem;
            margin-right: 8px;
        }
        .dimension-name {
            flex: 1;
            font-weight: 600;
            color: var(--warm-text);
        }
        .dimension-score {
            font-weight: 700;
            color: var(--warm-primary);
            font-size: 1rem;
        }
        .dimension-bar {
            height: 8px;
            background: var(--warm-border);
            border-radius: 4px;
            overflow: hidden;
        }
        .dimension-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--warm-primary), var(--warm-secondary));
            border-radius: 4px;
            transition: width 0.8s ease;
        }
        .dimension-comment {
            font-size: 0.85rem;
            color: var(--warm-text-light);
            margin-top: 6px;
            text-align: right;
        }
        .evaluation-actions {
            display: flex;
            gap: 12px;
            padding: 20px 24px;
            border-top: 1px solid var(--warm-border);
        }
        .eval-btn {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Sans SC', sans-serif;
        }
        .eval-restart {
            background: var(--warm-primary);
            color: white;
        }
        .eval-restart:hover {
            background: var(--warm-accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(232, 168, 124, 0.3);
        }
        .eval-back {
            background: var(--warm-bg);
            color: var(--warm-text);
            border: 2px solid var(--warm-border);
        }
        .eval-back:hover {
            border-color: var(--warm-primary);
            color: var(--warm-primary);
        }

        /* Toast提示 */
        .toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 24px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 500;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            z-index: 10000;
            animation: toastSlideIn 0.3s ease-out;
            max-width: 90%;
            text-align: center;
        }
        .toast-success {
            background: #E8F5F0;
            color: #7EB8A2;
            border: 1px solid #B8DFD3;
        }
        .toast-error {
            background: #FDF0EF;
            color: #D4918C;
            border: 1px solid #ECC8C5;
        }
        .toast-warning {
            background: #FFF8E7;
            color: #E8A87C;
            border: 1px solid #F5D5C0;
        }
        .toast-info {
            background: #FFFFFF;
            color: #4A403A;
            border: 1px solid var(--warm-border);
        }
        @keyframes toastSlideIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* 语音输入按钮 */
        .voice-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid var(--warm-border);
            background: var(--warm-card);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .voice-btn:hover {
            border-color: var(--warm-primary);
            background: var(--warm-highlight);
        }
        .voice-btn.recording {
            background: var(--warm-danger);
            border-color: var(--warm-danger);
            color: white;
            animation: voicePulse 1.5s ease-in-out infinite;
        }
        @keyframes voicePulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(212, 145, 140, 0.4); }
            50% { box-shadow: 0 0 0 10px rgba(212, 145, 140, 0); }
        }

        /* 流式消息光标闪烁 */
        .message-streaming .message-content::after {
            content: '|';
            display: inline;
            animation: cursorBlink 0.8s step-end infinite;
            color: var(--warm-text-light);
            margin-left: 2px;
            font-weight: 300;
        }
        @keyframes cursorBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* 情感指示器 */
        .emotion-indicator {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.7);
            color: var(--warm-text-light);
            border: 1px solid var(--warm-border);
            transition: all 0.3s ease;
        }
        .chat-header {
            position: relative;
        }
        .chat-header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .chat-header-left {
            flex: 1;
        }
        .emotion-indicator.positive { background: #E8F5F0; color: var(--warm-success); border-color: #B8DFD3; }
        .emotion-indicator.negative { background: #FDF0EF; color: var(--warm-danger); border-color: #ECC8C5; }
        .emotion-indicator.neutral { background: var(--warm-highlight); color: var(--warm-primary); border-color: var(--warm-primary-light); }

        /* AI聊天操作按钮 */
        .ai-chat-actions {
            display: flex;
            gap: 10px;
            padding: 12px 24px;
            background: var(--warm-bg);
            border-top: 1px solid var(--warm-border);
            justify-content: center;
        }
        .end-chat-btn, .restart-btn {
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Sans SC', sans-serif;
        }
        .end-chat-btn {
            background: var(--warm-primary);
            color: white;
            border: none;
        }
        .end-chat-btn:hover {
            background: var(--warm-accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(232, 168, 124, 0.3);
        }
        .restart-btn {
            background: var(--warm-card);
            color: var(--warm-text);
            border: 2px solid var(--warm-border);
        }
        .restart-btn:hover {
            border-color: var(--warm-primary);
            color: var(--warm-primary);
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .header h1 { font-size: 1.8rem; }
            .stats-grid { grid-template-columns: 1fr; }
            .message-content { max-width: 85%; }
            .category-grid { grid-template-columns: repeat(2, 1fr); }
            .ai-role-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="bg-decoration"></div>
    
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-spinner">
            <div class="spinner"></div>
        </div>
        <div class="loading-text">正在加载聊天训练室...</div>
    </div>
    
    <div class="app-container">
        <header class="header">
            <h1>聊天训练室</h1>
            <p class="subtitle">从把天聊死到聊天高手，用提问搭建双向通道</p>
        </header>

        <nav class="nav-tabs">
            <button class="nav-tab active" data-section="training">对话训练</button>
            <button class="nav-tab" data-section="skills">技巧学习</button>
            <button class="nav-tab" data-section="ai-practice">AI陪练</button>
            <button class="nav-tab" data-section="progress">我的进度</button>
        </nav>

        <main class="content-area">
            <!-- 对话训练区 -->
            <section id="training" class="section active">
                <!-- 分类选择 -->
                <div class="category-grid" id="category-grid">
                    <div class="category-card active" data-category="basic">
                        <div class="category-icon">📚</div>
                        <div class="category-title">基础训练</div>
                        <div class="category-desc">5个基础场景</div>
                    </div>
                    <div class="category-card" data-category="daily">
                        <div class="category-icon">🍻</div>
                        <div class="category-title">日常对话</div>
                        <div class="category-desc">酒桌/闺蜜/夫妻/同学</div>
                    </div>
                    <div class="category-card" data-category="argue">
                        <div class="category-icon">🔥</div>
                        <div class="category-title">吵架回怼</div>
                        <div class="category-desc">修辞+地方特色</div>
                    </div>
                </div>

                <!-- 场景选择器 -->
                <div class="scene-selector" id="scene-selector"></div>

                <div class="chat-container">
                    <div class="chat-header">
                        <h3 id="scene-title">场景：朋友分享日常</h3>
                        <div class="scene-info" id="scene-desc">练习用提问延续对话，避免单向输出</div>
                    </div>
                    
                    <div class="chat-messages" id="chat-messages"></div>

                    <div class="options-area" id="options-area">
                        <div class="options-title">选择你的回复方式：</div>
                        <div class="options-list" id="options-list"></div>
                        <div id="feedback-container"></div>
                    </div>
                </div>
            </section>

            <!-- 技巧学习区 -->
            <section id="skills" class="section">
                <div class="skills-grid" id="skills-grid"></div>
            </section>

            <!-- AI陪练区 -->
            <section id="ai-practice" class="section">
                <div class="ai-role-grid" id="ai-role-grid"></div>
                
                <div class="chat-container">
                    <div class="chat-header">
                        <div class="chat-header-inner">
                            <div class="chat-header-left">
                                <h3 id="ai-chat-title">选择一个角色开始练习</h3>
                                <div class="scene-info" id="ai-chat-desc">AI会根据你的回复自然回应</div>
                            </div>
                            <span class="emotion-indicator" id="emotion-indicator" style="display: none;">😊 开心</span>
                        </div>
                        <button class="ai-end-btn" id="ai-end-btn" style="display: none;">结束聊天</button>
                    </div>
                    
                    <div class="chat-messages" id="ai-chat-messages"></div>

                    <div class="ai-input-area" id="ai-input-area" style="display: none;">
                        <input type="text" class="ai-input" id="ai-input" placeholder="输入你的回复..." />
                        <button class="voice-btn" id="voice-btn" title="语音输入">🎤</button>
                        <button class="ai-send-btn" id="ai-send-btn">发送</button>
                    </div>
                    <div class="ai-chat-actions" id="ai-chat-actions" style="display: none;">
                        <button class="end-chat-btn" id="end-chat-btn">📝 结束聊天并评价</button>
                        <button class="restart-btn" id="restart-btn">🔄 重新开始</button>
                    </div>
                </div>
            </section>

            <!-- 进度统计区 -->
            <section id="progress" class="section">
                <div class="stats-container">
                    <h2 class="stats-title">学习进度</h2>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-value" id="stat-completed">0</div>
                            <div class="stat-label">已完成场景</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="stat-correct">0</div>
                            <div class="stat-label">正确选择</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="stat-streak">0</div>
                            <div class="stat-label">连续正确</div>
                        </div>
                    </div>
                    <div style="text-align: left;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                            <span style="font-size: 0.9rem; color: var(--warm-text-light);">总体进度</span>
                            <span style="font-size: 0.9rem; font-weight: 600; color: var(--warm-primary);" id="progress-percent">0%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="data.js"></script>
    <script src="harness.js"></script>
    <script src="app.js"></script>
</body>
</html>
