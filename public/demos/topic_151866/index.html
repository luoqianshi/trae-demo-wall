<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>失败博物馆 - 允许一切发生</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&display=swap');
        
        :root {
            --paper-bg: #f5e6d3;
            --paper-dark: #d4c4a8;
            --ink: #5c4a3a;
            --accent: #8b7355;
            --warm: #e8d4b8;
            --shadow: rgba(92, 74, 58, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'ZCOOL KuaiLe', cursive;
            background: linear-gradient(135deg, var(--paper-bg) 0%, var(--warm) 100%);
            min-height: 100vh;
            color: var(--ink);
            overflow-x: hidden;
        }

        .paper-texture {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.3;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            z-index: 0;
        }

        header {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 20px;
            background: rgba(245, 230, 211, 0.8);
            border-bottom: 2px dashed var(--accent);
        }

        header h1 {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 2.5rem;
            color: var(--ink);
            margin-bottom: 5px;
        }

        header p {
            font-size: 1rem;
            color: var(--accent);
            font-style: italic;
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 15px;
            background: rgba(245, 230, 211, 0.6);
            border-bottom: 1px solid var(--paper-dark);
            position: relative;
            z-index: 10;
        }

        .nav-tabs button {
            padding: 10px 25px;
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 1.1rem;
            background: transparent;
            border: 2px solid var(--accent);
            border-radius: 20px;
            color: var(--accent);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-tabs button:hover,
        .nav-tabs button.active {
            background: var(--accent);
            color: var(--paper-bg);
            transform: scale(1.05);
        }

        .content {
            position: relative;
            z-index: 10;
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .tab-panel {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .tab-panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: rgba(255, 254, 252, 0.9);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px var(--shadow);
            border: 1px solid var(--paper-dark);
            margin-bottom: 30px;
        }

        .card-title {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 1.8rem;
            color: var(--ink);
            margin-bottom: 20px;
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 20px;
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 1.1rem;
            background: rgba(245, 230, 211, 0.5);
            border: 2px dashed var(--accent);
            border-radius: 10px;
            resize: none;
            color: var(--ink);
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--ink);
            background: rgba(245, 230, 211, 0.8);
        }

        * {
            overflow-x: hidden;
        }

        .record-content, .exhibit-content {
            word-wrap: break-word;
            word-break: break-all;
        }

        .btn-primary {
            display: block;
            width: 100%;
            padding: 15px;
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 1.3rem;
            background: linear-gradient(135deg, var(--accent), #a68b6a);
            border: none;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(139, 115, 85, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(139, 115, 85, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .result-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .result-modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        .result-card {
            background: linear-gradient(135deg, var(--paper-bg), var(--warm));
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 3px solid var(--ink);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            animation: bounceIn 0.5s ease;
            position: relative;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.5); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .result-card::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border: 2px dashed var(--accent);
            border-radius: 25px;
            pointer-events: none;
        }

        .medal-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: spin 3s linear infinite;
        }

        .achievement-path {
            background: rgba(245, 230, 211, 0.5);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px dashed var(--accent);
        }

        .path-title {
            font-size: 1.2rem;
            color: var(--ink);
            margin-bottom: 15px;
            font-weight: bold;
        }

        .path-steps {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .step {
            text-align: center;
            padding: 10px;
            border-radius: 10px;
            transition: all 0.3s ease;
            min-width: 120px;
        }

        .step.locked {
            opacity: 0.4;
            background: rgba(212, 196, 168, 0.5);
        }

        .step.unlocked {
            opacity: 1;
            background: rgba(232, 212, 184, 0.8);
            border: 2px solid var(--accent);
        }

        .step-icon {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .step-name {
            font-size: 0.8rem;
            color: var(--ink);
            word-break: break-word;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--paper-dark);
            border-radius: 4px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--warm));
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .progress-text {
            font-size: 0.8rem;
            color: var(--accent);
            margin-top: 5px;
            text-align: right;
        }

        @keyframes spin {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }

        .medal-name {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 2rem;
            color: var(--ink);
            margin-bottom: 20px;
        }

        .comfort-text {
            font-size: 1.3rem;
            color: var(--accent);
            line-height: 1.8;
            margin-bottom: 30px;
            font-style: italic;
        }

        .btn-close {
            padding: 10px 30px;
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 1.1rem;
            background: var(--ink);
            color: var(--paper-bg);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-close:hover {
            transform: scale(1.1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(245, 230, 211, 0.6);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            border: 2px dashed var(--accent);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            background: rgba(245, 230, 211, 0.9);
        }

        .stat-number {
            font-size: 3rem;
            font-weight: bold;
            color: var(--ink);
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 1rem;
            color: var(--accent);
        }

        .record-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .record-item {
            background: rgba(245, 230, 211, 0.5);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 5px solid var(--accent);
            transition: all 0.3s ease;
        }

        .record-item:hover {
            background: rgba(245, 230, 211, 0.8);
            transform: translateX(5px);
        }

        .record-date {
            font-size: 0.9rem;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .record-content {
            font-size: 1.1rem;
            color: var(--ink);
            margin-bottom: 10px;
        }

        .record-medal {
            display: inline-block;
            padding: 5px 15px;
            background: var(--warm);
            border-radius: 15px;
            font-size: 0.9rem;
            color: var(--accent);
            border: 1px solid var(--accent);
        }

        .museum-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .exhibit-card {
            background: rgba(255, 254, 252, 0.9);
            padding: 25px;
            border-radius: 15px;
            border: 1px solid var(--paper-dark);
            box-shadow: 0 5px 20px var(--shadow);
            transition: all 0.3s ease;
            position: relative;
        }

        .exhibit-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 30px var(--shadow);
        }

        .exhibit-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, var(--accent), var(--warm), var(--accent));
            border-radius: 15px 15px 0 0;
        }

        .exhibit-content {
            font-size: 1.1rem;
            color: var(--ink);
            margin-bottom: 20px;
            line-height: 1.6;
            min-height: 80px;
        }

        .exhibit-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .interaction-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 8px 15px;
            background: transparent;
            border: 2px solid var(--accent);
            border-radius: 20px;
            color: var(--accent);
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .interaction-btn:hover {
            background: var(--accent);
            color: var(--paper-bg);
            transform: scale(1.1);
        }

        .interaction-btn span {
            font-size: 1.2rem;
        }

        .exhibit-date {
            font-size: 0.8rem;
            color: var(--accent);
        }

        .checkin-wall {
            background: rgba(245, 230, 211, 0.8);
            border-radius: 15px;
            padding: 20px;
            border: 2px dashed var(--accent);
            margin-bottom: 20px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 10px;
        }

        .calendar-nav-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            background: transparent;
            color: var(--accent);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .calendar-nav-btn:hover {
            background: var(--accent);
            color: var(--paper-bg);
            transform: scale(1.1);
        }

        .calendar-title {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 1.5rem;
            color: var(--ink);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .calendar-day-header {
            text-align: center;
            padding: 10px;
            font-size: 0.9rem;
            color: var(--accent);
            font-weight: bold;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .calendar-day:hover {
            transform: scale(1.05);
            background: rgba(139, 115, 85, 0.1);
        }

        .calendar-day.other-month {
            opacity: 0.3;
            cursor: default;
        }

        .calendar-day.has-record {
            background: rgba(232, 212, 184, 0.6);
            border: 2px solid var(--accent);
        }

        .calendar-day.has-record::after {
            content: '';
            position: absolute;
            bottom: 5px;
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
        }

        .calendar-day.today {
            background: var(--accent);
            color: white;
        }

        .calendar-day.today.has-record::after {
            background: white;
        }

        .day-number {
            font-size: 1rem;
        }

        .day-count {
            font-size: 0.7rem;
            opacity: 0.8;
            margin-top: 2px;
        }

        .selected-date-info {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 254, 252, 0.9);
            border-radius: 10px;
            border-left: 5px solid var(--accent);
        }

        .selected-date-title {
            font-size: 1.2rem;
            color: var(--ink);
            margin-bottom: 10px;
            font-weight: bold;
        }

        .selected-date-records {
            max-height: 200px;
            overflow-y: auto;
        }

        .no-record-text {
            text-align: center;
            color: var(--accent);
            font-style: italic;
        }

        .exhibit-card.mine {
            border: 2px solid var(--accent);
            background: rgba(232, 212, 184, 0.5);
        }

        .exhibit-card.mine::before {
            background: linear-gradient(90deg, var(--accent), #ffd700, var(--accent));
        }

        .exhibit-mine-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 3px 8px;
            background: var(--accent);
            color: white;
            border-radius: 10px;
            font-size: 0.7rem;
        }

        .music-control {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: var(--ink);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(92, 74, 58, 0.4);
            transition: all 0.3s ease;
            z-index: 100;
        }

        .music-control:hover {
            transform: scale(1.1);
        }

        .music-control span {
            font-size: 1.5rem;
            color: var(--paper-bg);
        }

        .delete-btn {
            margin-top: 10px;
            padding: 5px 15px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 20px;
            color: #ef4444;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            transform: scale(1.05);
        }

        .music-control.playing span::before {
            content: '⏸';
        }

        .music-control.paused span::before {
            content: '🎵';
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: var(--accent);
            font-size: 0.9rem;
            margin-top: 50px;
            border-top: 1px dashed var(--accent);
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }
            
            .nav-tabs {
                flex-wrap: wrap;
                gap: 10px;
            }
            
            .nav-tabs button {
                padding: 8px 15px;
                font-size: 0.9rem;
            }
            
            .content {
                padding: 15px;
            }
            
            .card {
                padding: 20px;
            }
            
            .result-card {
                padding: 30px 20px;
            }
            
            .museum-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="paper-texture"></div>
    
    <header>
        <h1>失败博物馆</h1>
        <p>允许一切发生，也允许自己搞砸</p>
    </header>
    
    <nav class="nav-tabs">
        <button class="active" onclick="switchTab('record')">📝 记录搞砸</button>
        <button onclick="switchTab('checkin')">📅 打卡墙</button>
        <button onclick="switchTab('profile')">📋 我的履历</button>
        <button onclick="switchTab('museum')">🏛️ 失败博物馆</button>
    </nav>
    
    <main class="content">
        <section id="record" class="tab-panel active">
            <div class="card">
                <h2 class="card-title">📝 记录今天的搞砸/摆烂</h2>
                <textarea id="recordInput" placeholder="今天又搞砸了什么？例如：&#10;「今天又把老板交代的事忘了」&#10;「减肥计划第三天，吃了顿火锅」&#10;「说好的早睡，结果刷手机到凌晨两点」"></textarea>
                <button class="btn-primary" onclick="submitRecord()">📤 扔进去</button>
            </div>
        </section>
        
        <section id="checkin" class="tab-panel">
            <div class="card">
                <h2 class="card-title">📅 我的打卡墙</h2>
                
                <div class="checkin-wall">
                    <div class="calendar-header">
                        <button class="calendar-nav-btn" onclick="changeMonth(-1)">◀</button>
                        <div class="calendar-title" id="calendarTitle"></div>
                        <button class="calendar-nav-btn" onclick="changeMonth(1)">▶</button>
                    </div>
                    <div class="calendar-grid" id="calendarGrid"></div>
                    <div class="selected-date-info" id="selectedDateInfo"></div>
                </div>
                
                <div class="stat-card" style="margin-top: 20px;">
                    <div class="stat-number" id="checkinTotal">0</div>
                    <div class="stat-label">累计打卡天数</div>
                </div>
            </div>
        </section>
        
        <section id="profile" class="tab-panel">
            <div class="card">
                <h2 class="card-title">📋 我的搞砸履历表</h2>
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number" id="statDays">0</div>
                        <div class="stat-label">累计摆烂天数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="statStreak">0</div>
                        <div class="stat-label">连续失败记录</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="statMedals">0</div>
                        <div class="stat-label">获得勋章数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="statSleep">0%</div>
                        <div class="stat-label">睡眠质量击败</div>
                    </div>
                </div>
                
                <div class="card-title" style="font-size: 1.5rem;">� 成就进阶路线</div>
                <div id="achievementPaths">
                </div>
                
                <div class="card-title" style="font-size: 1.5rem;">� 我的奇葩勋章墙</div>
                <div class="record-list" id="medalWall">
                    <p style="text-align: center; color: var(--accent);">还没有获得任何勋章，快去搞砸一件事吧！</p>
                </div>
                
                <div class="card-title" style="font-size: 1.5rem;">📜 搞砸记录</div>
                <div class="record-list" id="recordList">
                    <p style="text-align: center; color: var(--accent);">还没有记录，今天搞砸点什么吧！</p>
                </div>
            </div>
        </section>
        
        <section id="museum" class="tab-panel">
            <div class="card">
                <h2 class="card-title">🏛️ 失败博物馆 · 匿名共鸣</h2>
                <p style="text-align: center; color: var(--accent); margin-bottom: 20px;">在这里，你不是一个人</p>
                <div class="museum-grid" id="museumGrid">
                </div>
            </div>
        </section>
    </main>
    
    <div class="result-modal" id="resultModal">
        <div class="result-card">
            <div class="medal-icon">🏅</div>
            <div class="medal-name" id="medalName"></div>
            <div class="comfort-text" id="comfortText"></div>
            <button class="btn-close" onclick="closeModal()">太好了，我安心了</button>
        </div>
    </div>
    
    <div class="music-control paused" id="musicControl" onclick="toggleMusic()">
        <span></span>
    </div>
    
    <footer class="footer">
        <p>🌙 失败不是终点，而是勋章</p>
    </footer>

    <script>
        const comfortPhrases = {

        function calculateOfflineActivity() {
            const lastVisitTime = localStorage.getItem('lastVisitTime');
            const now = Date.now();
            
            if (lastVisitTime) {
                const lastTime = parseInt(lastVisitTime);
                const timeDiff = now - lastTime;
                const minutesDiff = Math.floor(timeDiff / (1000 * 60));
                
                if (minutesDiff > 0) {
                    const cycles = Math.min(minutesDiff, 120);
                    
                    exhibitData.forEach(exhibit => {
                        for (let i = 0; i < cycles; i++) {
                            if (Math.random() < 0.15) {
                                exhibit.hugs += Math.floor(Math.random() * 2);
                            }
                            if (Math.random() < 0.1) {
                                exhibit.cheers += Math.floor(Math.random() * 2);
                            }

                    localStorage.setItem('exhibitData', JSON.stringify(exhibitData));
                    
                    if (document.getElementById('museum').classList.contains('active')) {
                        renderMuseum();
                    }
                }
            }
            
            localStorage.setItem('lastVisitTime', now.toString());
        }

        }

            return userRecords.filter(r => r.date === dateStr);
        }

        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            document.getElementById('calendarTitle').textContent = `${year}年${month + 1}月`;
            
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDay = firstDay.getDay();
            const totalDays = lastDay.getDate();
            
            const today = formatDate(new Date());
            
            let html = '<div class="calendar-day-header">日</div><div class="calendar-day-header">一</div><div class="calendar-day-header">二</div><div class="calendar-day-header">三</div><div class="calendar-day-header">四</div><div class="calendar-day-header">五</div><div class="calendar-day-header">六</div>';
            
            for (let i = 0; i < startDay; i++) {
                html += '<div class="calendar-day other-month"></div>';
            }
            
            for (let day = 1; day <= totalDays; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const count = getRecordCountByDate(dateStr);
                const isToday = dateStr === today;
                const hasRecord = count > 0;
                
                html += `
                    <div class="calendar-day ${hasRecord ? 'has-record' : ''} ${isToday ? 'today' : ''}" onclick="selectDate('${dateStr}')">
                        <div class="day-number">${day}</div>
                        ${hasRecord ? `<div class="day-count">${count}条</div>` : ''}
                    </div>
                `;
            }
            
            document.getElementById('calendarGrid').innerHTML = html;
            
            if (!selectedDate) {
                selectDate(today);
            }
            
            updateCheckinTotal();

        function classifyContent(content) {
            const negativeKeywords = ['不摆烂', '不躺平', '要努力', '要奋斗', '要自律', '要减肥', '要社交', '要早起', '要运动', '要学习', '要工作', '拒绝摆烂', '拒绝躺平', '今天也要加油', '元气满满', '打鸡血', '正能量', '卷起来', '冲鸭', '奥利给'];
            
            for (const neg of negativeKeywords) {
                if (content.includes(neg)) {
                    return 'general';
                }
            }
            
            for (const [category, path] of Object.entries(achievementPaths)) {
                if (category === 'general') continue;
                for (const keyword of path.keywords) {
                    if (content.includes(keyword)) {
                        return category;
                    }
                }
            }
            
            const generalKeywords = ['摆烂', '躺平', '佛系', '咸鱼', '瘫了', '废了', '不想动', '算了', '毁灭吧', '累了', '歇会儿', '放空', '发呆', '无聊', '无聊透顶', '人生无意义', '活着好累', '想静静', '什么都不想做', '摆烂的一天', '躺平的一天'];
            
            for (const gk of generalKeywords) {
                if (content.includes(gk)) {
                    return 'general';
                }
            }
            
            return 'general';
        }

        function getComfortPhrase(category) {
            const phrases = comfortPhrases[category] || comfortPhrases.healing;
            return phrases[Math.floor(Math.random() * phrases.length)];
        }

        function getCurrentMedal(category) {
            const path = achievementPaths[category];
            const count = userStats[category] || 0;
            
            let currentStep = null;
            for (let i = path.steps.length - 1; i >= 0; i--) {
                if (count >= path.steps[i].threshold) {
                    currentStep = path.steps[i];
                    break;
                }
            }
            
            if (!currentStep && count >= 1) {
                currentStep = path.steps[0];
            }
            
            return currentStep || { name: "摆烂新手", icon: "🌱" };
        }

        function submitRecord() {
            const input = document.getElementById('recordInput');
            const content = input.value.trim();
            
            if (!content) {
                alert('请输入今天搞砸了什么~');
                return;
            }
            
            const category = classifyContent(content);
            const comfortPhrase = getComfortPhrase(category);
            
            userStats[category] = (userStats[category] || 0) + 1;
            userStats.total = (userStats.total || 0) + 1;
            
            const medal = getCurrentMedal(category);
            
            const newRecord = {
                id: Date.now(),
                content: content,
                date: new Date().toISOString().split('T')[0],
                medal: medal,
                category: category
            };
            
            userRecords.unshift(newRecord);
            
            if (!userMedals.find(m => m.name === medal.name)) {
                userMedals.push(medal);
            }
            
            checkUltimateAchievements();
            
            localStorage.setItem('userRecords', JSON.stringify(userRecords));
            localStorage.setItem('userMedals', JSON.stringify(userMedals));
            localStorage.setItem('userStats', JSON.stringify(userStats));
            
            const newExhibit = {
                id: Date.now(),
                content: content,
                date: new Date().toISOString().split('T')[0],
                hugs: 0,
                cheers: 0
            };
            
            exhibitData.unshift(newExhibit);

        function checkUltimateAchievements() {
            let maxLevelCount = 0;
            for (const [category, path] of Object.entries(achievementPaths)) {
                const maxThreshold = path.steps[path.steps.length - 1].threshold;
                if ((userStats[category] || 0) >= maxThreshold) {
                    maxLevelCount++;
                }
            }
            
            if (maxLevelCount >= 3) {
                const nobel = { name: "摆烂界诺贝尔和平奖", icon: "🏆" };
                if (!userMedals.find(m => m.name === nobel.name)) {
                    userMedals.push(nobel);
                }
            }
            
            if (maxLevelCount >= 4) {
                const selfHealing = { name: "自我和解终身成就奖", icon: "🌟" };
                if (!userMedals.find(m => m.name === selfHealing.name)) {
                    userMedals.push(selfHealing);
                }
            }
            
            if (userStats.total >= 100) {
                const maxHuman = { name: "反向打卡·满级人类", icon: "💎" };
                if (!userMedals.find(m => m.name === maxHuman.name)) {

        function updateProfile() {
            const uniqueDates = [...new Set(userRecords.map(r => r.date))];
            const days = uniqueDates.length;
            const maxStreak = calculateMaxStreak();
            const unlockedMedals = calculateUnlockedMedals();
            const sleepScore = calculateSleepScore();
            
            document.getElementById('statDays').textContent = days;
            document.getElementById('statStreak').textContent = maxStreak;
            document.getElementById('statMedals').textContent = unlockedMedals;
            document.getElementById('statSleep').textContent = sleepScore + '%';
            
            renderAchievementPaths();
            renderMedalWall();
            renderRecordList();

        function calculateMaxStreak() {
            if (userRecords.length === 0) return 0;
            
            const dates = [...new Set(userRecords.map(r => r.date))].sort();
            
            let maxStreak = 1;
            let currentStreak = 1;
            
            for (let i = 1; i < dates.length; i++) {
                const prev = new Date(dates[i - 1]);
                const curr = new Date(dates[i]);
                const diff = (curr - prev) / (1000 * 60 * 60 * 24);
                
                if (diff === 1) {
                    currentStreak++;
                    maxStreak = Math.max(maxStreak, currentStreak);
                } else {
                    currentStreak = 1;
                }
            }
            
            return maxStreak;
        }

        function calculateUnlockedMedals() {
            let count = 0;
            for (const [category, path] of Object.entries(achievementPaths)) {
                const stats = userStats[category] || 0;
                for (const step of path.steps) {
                    if (stats >= step.threshold) {
                        count++;
                    }
                }
            }
            
            if (userStats.total >= 50) count++;
            if (userStats.total >= 100) count++;
            
            return count;
        }

        function calculateSleepScore() {
            let score = 50;
            
            const sleepKeywords = ['失眠', '熬夜', '晚睡', '没睡', '睡不着', '凌晨', '修仙', '夜猫子', '黑眼圈', '困倦', '疲惫', '精神萎靡'];
            
            userRecords.forEach(record => {
                for (const keyword of sleepKeywords) {
                    if (record.content.includes(keyword)) {
                        score = Math.min(100, score + 2);
                        break;
                    }
                }
            });
            
            return Math.max(0, score);
        }

        function renderAchievementPaths() {
            const container = document.getElementById('achievementPaths');
            
            let html = '';
            for (const [category, path] of Object.entries(achievementPaths)) {
                const count = userStats[category] || 0;
                const maxThreshold = path.steps[path.steps.length - 1].threshold;
                const progress = Math.min(100, (count / maxThreshold) * 100);
                
                html += `
                    <div class="achievement-path">
                        <div class="path-title">${path.icon} ${path.name}</div>
                        <div class="path-steps">
                `;
                
                path.steps.forEach((step, index) => {
                    const unlocked = count >= step.threshold;
                    html += `
                        <div class="step ${unlocked ? 'unlocked' : 'locked'}">
                            <div class="step-icon">${unlocked ? step.icon : '🔒'}</div>
                            <div class="step-name">${step.name}</div>
                            <div style="font-size: 0.7rem; color: var(--accent);">${step.threshold}次</div>
                        </div>
                    `;
                });
                
                html += `
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${progress}%"></div>
                        </div>
                        <div class="progress-text">当前进度：${count}/${maxThreshold}次</div>
                    </div>
                `;
            }
            
            container.innerHTML = html;
        }

        function calculateStreak() {
            if (userRecords.length === 0) return 0;
            
            let streak = 1;
            const dates = userRecords.map(r => r.date).sort((a, b) => new Date(b) - new Date(a));
            
            for (let i = 0; i < dates.length - 1; i++) {
                const current = new Date(dates[i]);
                const next = new Date(dates[i + 1]);
                const diff = (current - next) / (1000 * 60 * 60 * 24);
                
                if (diff === 1) {
                    streak++;
                } else {
                    break;
                }
            }
            
            return streak;
        }

        function deleteRecord(id) {
            if (confirm('确定要删除这条记录吗？删除后无法恢复哦~')) {
                const recordToDelete = userRecords.find(r => r.id === id);
                if (recordToDelete) {
                    userRecords = userRecords.filter(r => r.id !== id);
                    
                    if (recordToDelete.category && userStats[recordToDelete.category]) {
                        userStats[recordToDelete.category] = Math.max(0, userStats[recordToDelete.category] - 1);
                    }
                    userStats.total = Math.max(0, userStats.total - 1);
                    
                    localStorage.setItem('userRecords', JSON.stringify(userRecords));
                    localStorage.setItem('userStats', JSON.stringify(userStats));
                    
                    updateProfile();
                    
                    if (selectedDate) {
                        selectDate(selectedDate);
                    }
                    
                    if (document.getElementById('museum').classList.contains('active')) {
                        renderMuseum();
                    }
                }
            }
        }

        function renderMuseum() {
            const container = document.getElementById('museumGrid');
            
            let myRecord = null;
            const showMyRecord = Math.random() < 0.05 && userRecords.length > 0;
            if (showMyRecord) {
                myRecord = userRecords[0];
            }
            
            const otherExhibits = exhibitData.filter(exhibit => {
                const isMine = userRecords.some(r => r.content === exhibit.content && r.date === exhibit.date);
                return !isMine;
            });
            
            const shuffledOthers = otherExhibits.sort(() => Math.random() - 0.5);
            const displayOthers = shuffledOthers.slice(0, showMyRecord ? 14 : 15);
            
            let displayData = [];
            if (showMyRecord && myRecord) {
                displayData.push({
                    id: myRecord.id,
                    content: myRecord.content,
                    date: myRecord.date,
                    hugs: 0,
                    cheers: 0,
                    isMine: true
                });
            }
            displayData = displayData.concat(displayOthers.map(e => ({ ...e, isMine: false })));
            
            while (displayData.length < 15 && otherExhibits.length > displayOthers.length) {
                const remaining = otherExhibits.slice(displayOthers.length);
                const randomIndex = Math.floor(Math.random() * remaining.length);
                displayData.push({ ...remaining[randomIndex], isMine: false });
            }
            
            container.innerHTML = displayData.map(exhibit => {
                return `
                    <div class="exhibit-card ${exhibit.isMine ? 'mine' : ''}">
                        ${exhibit.isMine ? '<div class="exhibit-mine-badge">我的</div>' : ''}
                        <div class="exhibit-content">${exhibit.content}</div>
                        <div class="exhibit-stats">
                            <button class="interaction-btn" onclick="addHug(${exhibit.id})">
                                <span>🤗</span> ${exhibit.hugs}
                            </button>
                            <button class="interaction-btn" onclick="addCheer(${exhibit.id})">
                                <span>🍻</span> ${exhibit.cheers}
                            </button>
                            <span class="exhibit-date">${exhibit.date}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

            exhibitData.forEach(exhibit => {
                if (Math.random() < 0.3) {
                    exhibit.hugs += Math.floor(Math.random() * 3);
                }
                if (Math.random() < 0.2) {
                    exhibit.cheers += Math.floor(Math.random() * 2);
                }
            });
            
            localStorage.setItem('exhibitData', JSON.stringify(exhibitData));
            
            if (document.getElementById('museum').classList.contains('active')) {

        }, 180000);

        function addHug(id) {
            const exhibit = exhibitData.find(e => e.id === id);
            if (exhibit) {
                exhibit.hugs++;
                localStorage.setItem('exhibitData', JSON.stringify(exhibitData));
                renderMuseum();
            }
        }

        function addCheer(id) {
            const exhibit = exhibitData.find(e => e.id === id);
            if (exhibit) {
                exhibit.cheers++;
                localStorage.setItem('exhibitData', JSON.stringify(exhibitData));
                renderMuseum();
            }
        }

        function toggleMusic() {
            const control = document.getElementById('musicControl');
            control.classList.toggle('playing');
            control.classList.toggle('paused');
            
            if (control.classList.contains('playing')) {
                alert('背景音乐已开启（实际音乐需浏览器自动播放策略支持）');
            } else {
                alert('背景音乐已关闭');
            }
        }

        updateProfile();
        renderMuseum();
    </script>
</body>
</html>
