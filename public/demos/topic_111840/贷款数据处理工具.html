<script>
// ============================================================
// 全局状态
// ============================================================
const state = { loanFiles: [], repayFiles: [], loanDf: null, repayDf: null, processed: null, summary: null, smallLoanData: null };
// ============================================================
// 日志
// ============================================================
function log(msg, level='info') {
  const ts = new Date().toLocaleTimeString();
  const el = document.getElementById('log');
  const div = document.createElement('div');
  div.innerHTML = `<span class="ts">[${ts}]</span><span class="${level}">${msg}</span>`;
  el.appendChild(div); el.scrollTop = el.scrollHeight;
}
// ============================================================
// 文件上传
// ============================================================
function setupDropZone(zoneId, inputId, listId, filesKey) {
  const zone = document.getElementById(zoneId), input = document.getElementById(inputId), list = document.getElementById(listId);
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
  zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('dragover'); handleFiles(e.dataTransfer.files, filesKey, list); });
  input.addEventListener('change', () => { handleFiles(input.files, filesKey, list); input.value = ''; });
}
function handleFiles(fileList, key, listEl) {
  for (const f of fileList) {
    if (!f.name.match(/\.(xlsx|xls)$/i)) { toast('仅支持 .xlsx/.xls 文件', 'error'); continue; }
    const reader = new FileReader();
    reader.onload = e => { state[key].push({ name: f.name, data: new Uint8Array(e.target.result) }); renderFileList(key, listEl); log(`已加载: ${f.name} (${(f.size/1024).toFixed(1)}KB)`, 'success'); };
    reader.readAsArrayBuffer(f);
  }
}
function renderFileList(key, listEl) {
  listEl.innerHTML = state[key].map((f,i) => `<div class="item"><span class="name">${f.name}</span><span class="size">${(f.data.length/1024).toFixed(1)}KB</span><span class="del" onclick="removeFile('${key}',${i})">×</span></div>`).join('');
}
function removeFile(key, idx) { state[key].splice(idx,1); renderFileList(key, document.getElementById(key==='loanFiles'?'loanFiles':'repayFiles')); }
setupDropZone('loanDrop','loanInput','loanFiles','loanFiles');
setupDropZone('repayDrop','repayInput','repayFiles','repayFiles');
// ============================================================
// Toast
// ============================================================
function toast(msg, level='') { const el = document.createElement('div'); el.className = `toast ${level}`; el.textContent = msg; document.body.appendChild(el); setTimeout(() => el.remove(), 3000); }
// ============================================================
// 字段映射
// ============================================================
const FIELD_MAPPING = { '贷款利率%':'年利率（%）','执行年利率(%)':'年利率（%）','年利率(%)':'年利率（%）','年利率%':'年利率（%）','贷款发放金额':'贷款本金','发放金额':'贷款本金','当前余额':'剩余本金','贷款余额':'剩余本金','客户经理':'经办人','业务员':'经办人','担保人(含授信的担保)':'担保方式','担保':'担保方式','贷款状态':'当前状态','状态':'当前状态','还款日期':'到期日','应还日期':'到期日' };
const NUMERIC_FIELDS = ['年利率（%）','贷款本金','剩余本金','还本金额'];
const DATE_FIELDS = ['起息日','到期日','还款日期'];
const TEXT_FIELDS = ['借据号','证件号码','贷款合同号'];
// ============================================================
// Excel读取
// ============================================================
function readExcelFile(u8) {
  const wb = XLSX.read(u8, { type: 'array' });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', blankrows: false });
  let headerRow = 2;
  for (let i = 0; i < Math.min(20, aoa.length); i++) { if (aoa[i].some(c => String(c).includes('客户名称'))) { headerRow = i; break; } }
  const json = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', blankrows: false });
  const headers = json[headerRow].map(h => String(h).trim());
  const rows = json.slice(headerRow + 1).filter(r => r.some(c => c !== ''));
  return rows.map(row => { const obj = {}; headers.forEach((h,i) => { obj[h] = row[i] !== undefined ? row[i] : ''; }); return obj; });
}
function normalizeColumns(df) { return df.map(row => { const nr = {}; for (const [k,v] of Object.entries(row)) { nr[FIELD_MAPPING[k]||k] = v; } return nr; }); }
function convertDataTypes(df) {
  return df.map(row => {
    const r = {...row};
    for (const f of NUMERIC_FIELDS) { const v = parseFloat(String(r[f]||'').replace(/,/g,'').replace(/\s/g,'')); r[f] = isNaN(v) ? 0 : v; }
    for (const f of DATE_FIELDS) {
      if (r[f] !== undefined && r[f] !== '') {
        const v = String(r[f]);
        if (/^\d{4}-\d{2}-\d{2}/.test(v)) r[f] = v.substring(0,10);
        else if (/^\d{4,5}$/.test(v) && parseInt(v) > 30000) { const d = new Date((parseInt(v)-25569)*86400000); r[f] = d.toISOString().substring(0,10); }
      } else r[f] = '';
    }
    for (const f of TEXT_FIELDS) { if (r[f] !== undefined) r[f] = String(r[f]||'').trim(); }
    return r;
  });
}
function classifyLoanType(cn) {
  if (!cn) return '自营';
  const s = String(cn).toUpperCase();
  if (s.includes('旅游')||s.includes('LVYOU')) return '旅游';
  if (s.includes('农业')||s.includes('NONGYE')) return '农业';
  if (s.includes('委贷')||s.includes('WEIDAI')||s.includes('委托')) return '委贷';
  return '自营';
}
function mergeLoanFiles(files) {
  let all = [];
  for (const f of files) { let df = readExcelFile(f.data); df = normalizeColumns(df); df = convertDataTypes(df); all = all.concat(df); }
  all = all.map(r => ({...r, '当前状态': r['当前状态']||'未结清', '贷款类型': classifyLoanType(r['贷款合同号']), '还本金额': r['还本金额']||0 }));
  return all;
}
function mergeRepaymentFiles(files) {
  let all = [];
  for (const f of files) { let df = readExcelFile(f.data); df = normalizeColumns(df); df = convertDataTypes(df); all = all.concat(df); }
  all = all.map(r => ({...r, '当前状态': '已还款', '贷款类型': classifyLoanType(r['贷款合同号']), '还本金额': r['还本金额']||0 }));
  return all;
}
// ============================================================
// 日期聚类
// ============================================================
function clusterDates(dates, threshold) {
  if (dates.length === 0) return [];
  const sorted = [...new Set(dates.filter(d => d))].sort();
  const groups = []; let current = [sorted[0]];
  for (let i = 1; i < sorted.length; i++) {
    const diff = (new Date(sorted[i]) - new Date(current[0])) / 86400000;
    if (diff < threshold) current.push(sorted[i]); else { groups.push(current); current = [sorted[i]]; }
  }
  groups.push(current); return groups;
}
// ============================================================
// 小额判定 + 同笔判定
// ============================================================
function calculateSmallLoan(df, config) {
  const { amountThreshold, dayThreshold } = config;
  df = df.map(r => ({...r, '是否小额': '-', '同笔判定': '-'}));
  const selfLoans = df.filter(r => r['贷款类型'] === '自营');
  if (selfLoans.length === 0) return df;
  const customers = [...new Set(selfLoans.map(r => r['客户名称']).filter(Boolean))];
  let ggi = 0;
  for (const cust of customers) {
    const cl = selfLoans.filter(r => r['客户名称'] === cust);
    const sd = [...new Set(cl.map(r => r['起息日']).filter(d => d && d.length >= 8))];
    if (sd.length === 0) continue;
    const dgs = clusterDates(sd, dayThreshold);
    for (const gd of dgs) {
      if (gd.length === 0) continue; ggi++;
      const gm = cl.filter(r => gd.includes(r['起息日']));
      if (gm.length === 0) continue;
      const tb = gm.reduce((s,r) => s + (r['剩余本金']||0), 0);
      const isSmall = tb <= amountThreshold ? '是' : '否';
      for (const row of gm) {
        const oi = df.indexOf(row);
        if (oi >= 0) {
          const wo = String(row['当前状态']||'') === '已核销';
          df[oi]['是否小额'] = wo ? '-' : isSmall;
          df[oi]['同笔判定'] = wo ? '-' : `组${ggi}`;
        }
      }
    }
  }
  return df;
}
// ============================================================
// 利息计算（V1.5.0规则）
// ============================================================
function calculateInterest(df, startDate, endDate) {
  const sd = new Date(startDate), ed = new Date(endDate);
  df = df.map(r => {
    const qs = String(r['起息日']||'').substring(0,10), ds = String(r['到期日']||'').substring(0,10);
    const qd = new Date(qs), dd = new Date(ds);
    const qv = !isNaN(qd.getTime()), dv = !isNaN(dd.getTime());
    let days = 0;
    if (qv && dv) {
      const as = qd > sd ? qd : sd, ae = dd < ed ? dd : ed;
      days = Math.floor((ae-as)/86400000) + 1;
      if (days > 0 && dd <= ed && (r['产品类型']||'') !== '总对总转贷') days = days - 1;
      if (days < 0) days = 0;
    }
    const org = String(r['贷款合同号']||'');
    return {...r, '计息起始日': startDate, '计息终止日': endDate, '计息天数': days, '计息金额': 0, '税后利息': 0, '放款年': 0, '放款月': 0, '到期年': 0, '到期月': 0, '所属机构': r['所属机构']||(org.includes('鲁')?'山东':'浙江'), '产品类型': r['产品类型']||'', '考核税后利息（4月起1.2系数）': 0, _interest_formula: true, _date_formula: true };
  });
  return df;
}
// ============================================================
// 还款匹配
// ============================================================
function mergeRepaymentToLoan(loanDf, repayDf) {
  if (!repayDf || repayDf.length === 0) return loanDf;
  const lk = new Set(), rd = {}, dd = {};
  for (const r of loanDf) {
    const jj = String(r['借据号']||'').trim(), ht = String(r['贷款合同号']||'').trim();
    if (!jj && !ht) continue;
    const k = `${jj}||${ht}`; lk.add(k);
    if (!rd[k] && (r['年利率（%）']||0) > 0) rd[k] = r['年利率（%）'];
    if (!dd[k] && r['起息日']) dd[k] = String(r['起息日']).substring(0,10);
  }
  const matched = [];
  for (const r of repayDf) {
    const jj = String(r['借据号']||'').trim(), ht = String(r['贷款合同号']||'').trim();
    const k = `${jj}||${ht}`;
    if (!lk.has(k)) continue;
    const m = {...r, '年利率（%）': rd[k]||r['年利率（%）']||0, '起息日': dd[k]||r['起息日']||'', '是否小额': '-', '同笔判定': '-'};
    for (const f of ['还本金额','剩余本金','年利率（%）','贷款本金']) m[f] = parseFloat(m[f])||0;
    matched.push(m);
  }
  return [...loanDf, ...matched];
}
// ============================================================
// 产品类型
// ============================================================
function computeProductType(row) {
  const lt = row['贷款类型']||'', cn = String(row['贷款合同号']||'');
  if (lt !== '自营') return lt;
  if (cn.includes('转借')) return '总对总转贷';
  if (cn.includes('票质')) return '商票质押';
  if (cn.includes('授字')) {
    const p = (row['贷款本金']||0), r = (row['还本金额']||0);
    const q = new Date(row['起息日']), d = new Date(row['到期日']);
    const term = Math.floor((d-q)/86400000);
    if ((p>20000000||r>20000000) && term<31) return '大额转贷';
    return '普通自营';
  }
  return '异常';
}
// ============================================================
// 汇总统计
// ============================================================
function calculateSummary(df) {
  const active = df.filter(r => r['贷款类型']==='自营' && r['当前状态']!=='已核销' && r['当前状态']!=='已还款');
  const tb = active.reduce((s,r) => s+(r['剩余本金']||0), 0);
  const sb = active.filter(r => r['是否小额']==='是').reduce((s,r) => s+(r['剩余本金']||0), 0);
  return { totalSelfBalance: tb, smallLoanBalance: sb, smallLoanRatio: tb>0 ? (sb/tb*100) : 0 };
}

function parseDateFromFilename(files) {
  if (!files||files.length===0) { const n=new Date(); return {year:n.getFullYear(),month:n.getMonth()+1}; }
  const name = files[0].name;
  let m = name.match(/(\d{4})年(\d{1,2})月/); if (m) return {year:parseInt(m[1]),month:parseInt(m[2])};
  m = name.match(/(\d{4})-(\d{1,2})/); if (m) return {year:parseInt(m[1]),month:parseInt(m[2])};
  m = name.match(/(\d{4})(\d{2})(\d{2})/); if (m) { const y=parseInt(m[1]),mo=parseInt(m[2]),d=parseInt(m[3]); if (d<16) { if (mo===1) return {year:y-1,month:12}; return {year:y,month:mo-1}; } return {year:y,month:mo}; }
  m = name.match(/(\d{4})(\d{2})/); if (m) return {year:parseInt(m[1]),month:parseInt(m[2])};
  const n = new Date(); return {year:n.getFullYear(),month:n.getMonth()+1};
}

  XLSX.utils.book_append_sheet(wb, ws, '合并明细');
  XLSX.writeFile(wb, '贷款明细_处理结果.xlsx');
  log('✓ Excel导出完成','success');
  toast('Excel导出成功！');
}
