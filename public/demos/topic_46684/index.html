function renderMerchantTabBar(active) {
  const tabs = [
    { id: 'dashboard', icon: '📊', label: '工作台' },
    { id: 'product-manage', icon: '📦', label: '商品' },
    { id: 'order-manage', icon: '📋', label: '订单' },
    { id: 'ai-config', icon: '🤖', label: 'AI配置' },
    { id: 'plan', icon: '💎', label: '套餐' },
  ];
  return `
    <div class="merchant-tab-bar">
      ${tabs.map(t => `
        <div class="m-tab-item ${active === t.id ? 'active' : ''}" onclick="navigate('${t.id}')">
          <div class="tab-icon">${t.icon}</div>
          <div class="tab-label">${t.label}</div>
        </div>
      `).join('')}
    </div>
  `;
}

// ===== Actions =====
function addToCart(name, price, emoji) {
  const existing = cart.find(c => c.name === name);
  if (existing) {
    existing.qty++;
  } else {
    cart.push({ id: Date.now(), name, spec: '默认规格', price, qty: 1, emoji });
  }
  showToast(`已加入购物车: ${name}`);
}

function changeQty(index, delta) {
  cart[index].qty += delta;
  if (cart[index].qty <= 0) cart.splice(index, 1);
  render();
}

function sendChat() {
  const input = document.getElementById('chatInput');
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  aiMessages.push({ role: 'user', text, products: [] });
  input.value = '';
  render();
  setTimeout(() => {
    const replies = {
      '优惠': { text: '今天店里有多重优惠！🎉\n1️⃣ 满30减5元\n2️⃣ 新用户首单立减8元\n3️⃣ 饮品类满20减3元\n要帮您推荐凑单商品吗？', products: [] },
      '推荐': { text: '根据您的偏好，为您推荐以下热销饮品：', products: [{ name: '可口可乐 330ml', price: 3, emoji: '🥤', img: 'assets/product_cola.jpg' }, { name: '农夫山泉矿泉水', price: 2, emoji: '💧', img: 'assets/product_water.jpg' }] },
      '订单': { text: '您最近一笔订单 ORD20240624001 目前状态为"配送中"，骑手已取件，预计15分钟内送达。🚴', products: [] },
      '人工': { text: '好的，正在为您转接人工客服，请稍候...\n⏳ 平均等待时间约30秒', products: [] },
    };
    let reply = { text: '感谢您的提问！我已记录您的需求，稍后会有专人跟进处理。😊', products: [] };
    for (const [key, val] of Object.entries(replies)) {
      if (text.includes(key)) { reply = val; break; }
    }
    aiMessages.push({ role: 'bot', ...reply });
    render();
    const el = document.getElementById('chatMessages');
    if (el) el.scrollTop = el.scrollHeight;
  }, 800);
}

function sendQuickReply(text) {
  const input = document.getElementById('chatInput');
  if (input) input.value = text;
  sendChat();
}

// ===== Init =====
render();
