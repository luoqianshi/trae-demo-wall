<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>过往墙 · 记忆的每一层</title>
<style>
/* ============ 基础重置 ============ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-0: #0a0618;
  --bg-1: #1a0b2e;
  --bg-2: #16213e;
  --accent-harsh: #ff2e9c;
  --accent-true: #ffd86b;
  --accent-blue: #00e5ff;
  --text-main: #e8e8f0;
  --text-dim: #9a9ab0;
  --panel-bg: rgba(20, 14, 40, 0.55);
  --panel-border: rgba(255, 255, 255, 0.12);
  --glow-harsh: 0 0 24px rgba(255, 46, 156, 0.5);
  --glow-true: 0 0 24px rgba(255, 216, 107, 0.5);
  --glow-blue: 0 0 24px rgba(0, 229, 255, 0.5);
  --radius: 14px;
  --font-cn: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', system-ui, sans-serif;
}

html, body { width: 100%; height: 100%; overflow: hidden; }

body {
  font-family: var(--font-cn);
  /* 背景由 Canvas 接管，此处保留基础色作为后备 */
  background: var(--bg-0);
  color: var(--text-main);
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

#app {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}

/* ============ 画布 ============ */
#stage {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

/* ============ 顶部标题 ============ */
.topbar {
  position: absolute;
  top: 28px;
  left: 36px;
  z-index: 10;
  pointer-events: none;
}
.topbar .title {
  display: flex;
  align-items: center;
  gap: 10px;
}
.topbar h1 {
  font-size: 26px;
  font-weight: 600;
  letter-spacing: 6px;
  background: linear-gradient(90deg, #fff, var(--accent-blue), var(--accent-true), #fff);
  background-size: 300% 100%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: shimmer 5s ease-in-out infinite;
  text-shadow: 0 0 30px rgba(0, 229, 255, 0.5);
}

@keyframes shimmer {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}
.logo-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--accent-true);
  box-shadow: var(--glow-true);
  animation: pulse 2s ease-in-out infinite;
}
.subtitle {
  margin-top: 6px;
  font-size: 13px;
  color: var(--text-dim);
  letter-spacing: 1px;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.4); opacity: 0.7; }
}

/* ============ 启动遮罩 ============ */
.starter {
  position: absolute;
  inset: 0;
  z-index: 100;
  background: radial-gradient(ellipse at 50% 50%, rgba(26, 11, 46, 0.85), rgba(10, 6, 24, 0.96));
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.8s ease;
}
.starter::before {
  content: '';
  position: absolute;
  top: 20%;
  left: 15%;
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, rgba(255, 216, 107, 0.15) 0%, transparent 70%);
  border-radius: 50%;
  animation: floatOrb1 8s ease-in-out infinite;
  pointer-events: none;
}
.starter::after {
  content: '';
  position: absolute;
  bottom: 20%;
  right: 15%;
  width: 250px;
  height: 250px;
  background: radial-gradient(circle, rgba(255, 46, 156, 0.15) 0%, transparent 70%);
  border-radius: 50%;
  animation: floatOrb2 10s ease-in-out infinite;
  pointer-events: none;
}
@keyframes floatOrb1 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(40px, -30px) scale(1.1); }
  66% { transform: translate(-20px, 20px) scale(0.9); }
}
@keyframes floatOrb2 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(-30px, 40px) scale(1.15); }
  66% { transform: translate(25px, -25px) scale(0.85); }
}
.starter.hidden {
  opacity: 0;
  pointer-events: none;
}
.starter-inner {
  text-align: center;
  padding: 40px 60px;
}
.starter-title {
  font-size: 48px;
  font-weight: 300;
  letter-spacing: 8px;
  background: linear-gradient(90deg, var(--accent-true), var(--accent-blue), var(--accent-harsh));
  background-size: 200% 100%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 20px;
  animation: shimmer 5s ease-in-out infinite;
  text-shadow: 0 0 40px rgba(255, 216, 107, 0.4);
}
.starter-desc {
  color: var(--text-dim);
  line-height: 1.8;
  font-size: 14px;
  letter-spacing: 1px;
  margin-bottom: 40px;
}
.start-btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 16px 40px;
  font-size: 15px;
  font-family: inherit;
  color: #fff;
  background: linear-gradient(135deg, rgba(255, 216, 107, 0.3), rgba(0, 229, 255, 0.3));
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.3s ease;
  letter-spacing: 3px;
  box-shadow:
    0 8px 32px rgba(255, 216, 107, 0.3),
    0 0 60px rgba(255, 46, 156, 0.2),
    inset 0 0 20px rgba(255, 255, 255, 0.05);
}
.start-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 40px rgba(255, 216, 107, 0.3);
  border-color: rgba(255, 255, 255, 0.5);
}

/* ============ 控制面板 ============ */
.panel {
  position: absolute;
  top: 50%;
  right: 28px;
  transform: translateY(-50%);
  width: 280px;
  max-height: calc(100vh - 60px);
  background: rgba(20, 14, 40, 0.65);
  backdrop-filter: blur(30px) saturate(1.5);
  -webkit-backdrop-filter: blur(30px) saturate(1.5);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: var(--radius);
  z-index: 20;
  overflow: hidden;
  box-shadow:
    0 20px 60px rgba(0, 0, 0, 0.5),
    inset 0 0 40px rgba(255, 255, 255, 0.02);
  transition: transform 0.4s ease, opacity 0.4s ease;
}
.panel::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent-true), var(--accent-blue), var(--accent-harsh), var(--accent-blue), var(--accent-true));
  background-size: 200% 100%;
  animation: panelGlow 4s linear infinite;
  z-index: 1;
}
@keyframes panelGlow {
  0% { background-position: 0% 50%; }
  100% { background-position: 200% 50%; }
}
@supports not (backdrop-filter: blur(24px)) {
  .panel { background: rgba(20, 14, 40, 0.88); }
}

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 22px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}
.panel-title {
  font-size: 15px;
  letter-spacing: 2px;
  color: #fff;
  font-weight: 500;
}
.panel-toggle {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: var(--text-main);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.3s ease;
}
.panel-toggle:hover { background: rgba(255, 255, 255, 0.1); }
.panel.collapsed .panel-body { display: none; }
.panel.collapsed .panel-toggle { transform: rotate(180deg); }

.panel-body {
  padding: 20px 22px;
  max-height: calc(100vh - 140px);
  overflow-y: auto;
}
.panel-body::-webkit-scrollbar { width: 4px; }
.panel-body::-webkit-scrollbar-track { background: transparent; }
.panel-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

.ctrl-group { margin-bottom: 22px; }

.ctrl-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 10px;
  letter-spacing: 1px;
}
.ctrl-label.inline { margin-top: 12px; }
.ctrl-value {
  font-size: 11px;
  color: var(--accent-true);
  font-variant-numeric: tabular-nums;
}

/* 模式切换 */
.mode-switch {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 6px;
  padding: 4px;
  background: rgba(0, 0, 0, 0.3);
  border-radius: 10px;
}
.mode-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 6px;
  background: transparent;
  border: none;
  color: var(--text-dim);
  font-family: inherit;
  font-size: 13px;
  border-radius: 7px;
  cursor: pointer;
  transition: all 0.3s ease;
}
.mode-btn:hover { color: #fff; }
.mode-btn.active {
  background: linear-gradient(135deg, rgba(255, 46, 156, 0.3), rgba(0, 229, 255, 0.3));
  color: #fff;
  box-shadow: 0 0 16px rgba(0, 229, 255, 0.2);
}
.panel.mode-harsh .mode-btn.active {
  background: linear-gradient(135deg, rgba(255, 46, 156, 0.35), rgba(255, 100, 150, 0.25));
  color: #fff;
  box-shadow: var(--glow-harsh);
}
.panel.mode-true .mode-btn.active {
  background: linear-gradient(135deg, rgba(255, 216, 107, 0.35), rgba(255, 255, 180, 0.2));
  color: #fff;
  box-shadow: var(--glow-true);
}
.mode-icon { font-size: 12px; }

/* Range */
.ctrl-range {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 4px;
  background: linear-gradient(90deg, var(--accent-true), rgba(255,255,255,0.1));
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}
.ctrl-range::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  background: #fff;
  border-radius: 50%;
  box-shadow: 0 0 12px rgba(255, 216, 107, 0.6);
  cursor: pointer;
  transition: transform 0.2s ease;
}
.ctrl-range::-webkit-slider-thumb:hover { transform: scale(1.2); }
.ctrl-range::-moz-range-thumb {
  width: 16px;
  height: 16px;
  background: #fff;
  border: none;
  border-radius: 50%;
  box-shadow: 0 0 12px rgba(255, 216, 107, 0.6);
  cursor: pointer;
}

/* Music row */
.music-row {
  display: flex;
  gap: 8px;
  margin-bottom: 6px;
}
.pill-btn, .file-btn, .primary-btn, .ghost-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 9px 14px;
  font-family: inherit;
  font-size: 12px;
  letter-spacing: 1px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.25s ease;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.04);
  color: var(--text-main);
  flex: 1;
}
.pill-btn:hover, .file-btn:hover, .ghost-btn:hover {
  background: rgba(255,255,255,0.1);
  border-color: rgba(255,255,255,0.25);
}
.file-btn { cursor: pointer; }

/* 混合模式子选项 */
.mix-options {
  display: none;
  margin-top: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  background: rgba(0, 229, 255, 0.05);
  border: 1px solid rgba(0, 229, 255, 0.15);
}
.panel.mode-mix .mix-options { display: block; }

.toggle-row {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 2px 0;
  cursor: pointer;
  user-select: none;
}
.toggle-label {
  font-size: 12px;
  color: var(--text-main);
  letter-spacing: 2px;
}
.toggle-hint {
  flex: 1;
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 1px;
  text-align: right;
  opacity: 0.6;
}
.ctrl-toggle {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}
.toggle-slider {
  position: relative;
  width: 38px;
  height: 22px;
  background: rgba(255,255,255,0.1);
  border-radius: 20px;
  transition: background 0.3s ease, box-shadow 0.3s ease;
  border: 1px solid rgba(255,255,255,0.1);
  flex-shrink: 0;
}
.toggle-slider::before {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #fff;
  transition: transform 0.3s ease;
  box-shadow: 0 2px 6px rgba(0,0,0,0.4);
}
.ctrl-toggle:checked ~ .toggle-slider {
  background: linear-gradient(135deg, rgba(255, 46, 156, 0.4), rgba(0, 229, 255, 0.4));
  border-color: rgba(255, 255, 255, 0.4);
  box-shadow: 0 0 12px rgba(0, 229, 255, 0.3), inset 0 0 6px rgba(255, 46, 156, 0.3);
}
.ctrl-toggle:checked ~ .toggle-slider::before {
  transform: translateX(16px);
}

/* Primary / Ghost buttons */
.actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.primary-btn {
  background: linear-gradient(135deg, var(--accent-true), var(--accent-blue));
  color: #fff;
  border: none;
  padding: 12px;
  font-weight: 500;
  box-shadow:
    0 6px 20px rgba(255, 216, 107, 0.3),
    0 0 40px rgba(0, 229, 255, 0.2);
}
.primary-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 28px rgba(255, 216, 107, 0.4);
}

.panel-footer {
  text-align: center;
  margin-top: 10px;
  padding-top: 14px;
  border-top: 1px solid rgba(255,255,255,0.06);
}
.quote-hint {
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 2px;
}

/* ============ 聊天气泡容器 ============ */
.chat-container {
  position: absolute;
  top: 90px;
  left: 50%;
  transform: translateX(-50%);
  width: min(520px, 88vw);
  bottom: 30px;
  z-index: 15;
  overflow: hidden;
  pointer-events: none;
  mask-image: linear-gradient(to top, transparent 0%, rgba(0,0,0,0.3) 5%, #000 12%, #000 92%, rgba(0,0,0,0.3) 96%, transparent 100%);
  -webkit-mask-image: linear-gradient(to top, transparent 0%, rgba(0,0,0,0.3) 5%, #000 12%, #000 92%, rgba(0,0,0,0.3) 96%, transparent 100%);
}
.chat-inner {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 18px 8px;
  transition: transform 0.5s ease;
}

/* ============ 聊天气泡 ============ */
.chat-bubble {
  position: relative;
  max-width: 82%;
  padding: 14px 18px;
  border-radius: 20px;
  font-size: 15px;
  line-height: 1.6;
  letter-spacing: 1px;
  word-break: break-word;
  animation: bubbleIn 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
  backface-visibility: hidden;
  transform: translateZ(0);
}

/* 狠话气泡 — 右侧，冷色调（像发送的消息） */
.chat-bubble.harsh {
  align-self: flex-end;
  background: linear-gradient(135deg, rgba(255, 46, 156, 0.25), rgba(180, 40, 120, 0.30));
  border: 1px solid rgba(255, 46, 156, 0.35);
  border-bottom-right-radius: 6px;
  color: #ffd0e8;
  box-shadow:
    0 4px 20px rgba(255, 46, 156, 0.2),
    inset 0 0 30px rgba(255, 46, 156, 0.05);
  text-shadow: 0 0 8px rgba(255, 46, 156, 0.3);
}
.chat-bubble.harsh::after {
  content: '';
  position: absolute;
  right: -6px;
  bottom: 8px;
  width: 12px;
  height: 12px;
  background: radial-gradient(ellipse at top left, rgba(255, 46, 156, 0.25), transparent 70%);
  border-radius: 0 0 6px 0;
  clip-path: polygon(0 0, 100% 0, 0 100%);
}

/* 真心气泡 — 左侧，暖色调（像接收的消息） */
.chat-bubble.true {
  align-self: flex-start;
  background: linear-gradient(135deg, rgba(255, 216, 107, 0.20), rgba(200, 160, 50, 0.25));
  border: 1px solid rgba(255, 216, 107, 0.35);
  border-bottom-left-radius: 6px;
  color: #fff3cc;
  box-shadow:
    0 4px 20px rgba(255, 216, 107, 0.15),
    inset 0 0 30px rgba(255, 216, 107, 0.05);
  text-shadow: 0 0 8px rgba(255, 216, 107, 0.3);
}
.chat-bubble.true::after {
  content: '';
  position: absolute;
  left: -6px;
  bottom: 8px;
  width: 12px;
  height: 12px;
  background: radial-gradient(ellipse at top right, rgba(255, 216, 107, 0.25), transparent 70%);
  border-radius: 0 0 0 6px;
  clip-path: polygon(0 0, 100% 0, 100% 100%);
}

/* 气泡内作者 */
.chat-bubble .bubble-author {
  display: block;
  margin-top: 8px;
  font-size: 10px;
  letter-spacing: 2px;
  opacity: 0.55;
}
.chat-bubble.harsh .bubble-author {
  color: rgba(255, 200, 220, 0.7);
  text-align: right;
}
.chat-bubble.true .bubble-author {
  color: rgba(255, 240, 200, 0.7);
  text-align: left;
}

/* 时间戳分隔 */
.chat-time-divider {
  align-self: center;
  font-size: 10px;
  color: var(--text-dim);
  letter-spacing: 2px;
  padding: 6px 14px;
  background: rgba(255, 255, 255, 0.04);
  border-radius: 10px;
  animation: bubbleIn 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
}

@keyframes bubbleIn {
  0% {
    opacity: 0;
    transform: translateY(16px);
  }
  100% {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ============ 响应式 ============ */
@media (max-width: 900px) {
  .topbar { left: 20px; top: 18px; }
  .topbar h1 { font-size: 20px; }
  .subtitle { font-size: 11px; }
  .panel {
    top: auto;
    bottom: 16px;
    right: 16px;
    left: 16px;
    width: auto;
    transform: none;
    max-height: 45vh;
  }
  .panel.collapsed { max-height: 60px; }
  .chat-container {
    top: 70px;
    bottom: 16px;
    width: 92vw;
  }
  .chat-bubble {
    font-size: 13px;
    padding: 12px 15px;
  }
  .starter-title { font-size: 30px; letter-spacing: 3px; }
}
</style>
</head>
<body>
  <div id="app">
    <canvas id="stage"></canvas>

    <!-- 顶部标题 -->
    <header class="topbar">
      <div class="title">
        <span class="logo-dot"></span>
        <h1>过往墙</h1>
      </div>
      <div class="subtitle">每一段过往，都在墙上留下印记。</div>
    </header>

    <!-- 启动遮罩 -->
    <div id="starter" class="starter">
      <div class="starter-inner">
        <div class="starter-title">欢迎来到 · 过往墙</div>
        <p class="starter-desc">每一层墙砖，镌刻着一段或尖锐或温暖的过往。<br />点击下方，开始翻阅你的回忆。</p>
        <button id="startBtn" class="start-btn">
          <span>开始翻阅</span>
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12h14M13 5l7 7-7 7"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- 控制面板 -->
    <aside id="panel" class="panel mode-mix">
      <div class="panel-header">
        <div class="panel-title">控制面板</div>
        <button id="panelToggle" class="panel-toggle" title="收起/展开">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </button>
      </div>

      <div class="panel-body">
        <!-- 模式切换 -->
        <section class="ctrl-group">
          <label class="ctrl-label">墙面风格</label>
          <div class="mode-switch">
            <button class="mode-btn" data-mode="harsh">
              <span class="mode-icon">✦</span>
              <span>狠话</span>
            </button>
            <button class="mode-btn" data-mode="true">
              <span class="mode-icon">✧</span>
              <span>真心</span>
            </button>
            <button class="mode-btn active" data-mode="mix">
              <span class="mode-icon">✺</span>
              <span>混合</span>
            </button>
          </div>
          <!-- 混合模式子开关 -->
          <div id="mixOptions" class="mix-options">
            <label class="toggle-row">
              <span class="toggle-label">奇偶交替</span>
              <span class="toggle-hint">狠 真 狠 真 …</span>
              <input id="alternateToggle" type="checkbox" class="ctrl-toggle" checked />
              <span class="toggle-slider"></span>
            </label>
          </div>
        </section>

        <!-- 滚动速度 -->
        <section class="ctrl-group">
          <label class="ctrl-label">
            翻阅速度
            <span id="speedValue" class="ctrl-value">1.0x</span>
          </label>
          <input id="speedRange" type="range" min="0.2" max="3" step="0.1" value="1" class="ctrl-range" />
        </section>

<script>
// ============ audio.js ============
// 背景音乐控制器：支持外部文件 + Web Audio API 合成环境音
// 过往墙版本：合成音中加入随氛围变化的泛音
(function (global) {
  function AudioController() {
    this.audioCtx = null;
    this.isPlaying = false;
    this.volume = 0.6;

    this.audioEl = null;
    this.externalSourceNode = null;

    this.synthNodes = null;
    this.synthGain = null;

    this.sourceType = 'synth';

    // 氛围色调 (0-360)，用于微调合成音音高
    this.moodHue = 280;
  }

  AudioController.prototype._ensureCtx = function () {
    if (!this.audioCtx) {
      var Ctx = global.AudioContext || global.webkitAudioContext;
      if (!Ctx) return false;
      this.audioCtx = new Ctx();
    }
    if (this.audioCtx.state === 'suspended') {
      this.audioCtx.resume();
    }
    return true;
  };

  // 设置氛围色调（影响合成音和弦音高）
  AudioController.prototype.setMoodHue = function (hue) {
    this.moodHue = hue || 280;
  };

  AudioController.prototype._startSynth = function () {
    if (!this._ensureCtx()) return;
    var ctx = this.audioCtx;
    var now = ctx.currentTime;
    var self = this;

    var master = ctx.createGain();
    master.gain.value = 0;
    master.gain.linearRampToValueAtTime(this.volume * 0.35, now + 2.5);
    master.connect(ctx.destination);
    this.synthGain = master;

    // 根据氛围色调调整基频（暖色 → 略低，冷色 → 略高）
    var moodShift = (self.moodHue - 180) / 180 * 0.08; // -0.08 ~ 0.08 倍频程
    var baseFreq = 110 * Math.pow(2, moodShift);

    var freqs = [baseFreq, baseFreq * 1.498, baseFreq * 2]; // 近似 A2/E3/A3
    var oscs = [];
    freqs.forEach(function (f, i) {
      var o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.value = f;
      var g = ctx.createGain();
      g.gain.value = 0.18 + i * 0.04;
      var lfo = ctx.createOscillator();
      lfo.frequency.value = 0.08 + i * 0.05;
      var lfoGain = ctx.createGain();
      lfoGain.gain.value = 0.05;
      lfo.connect(lfoGain);
      lfoGain.connect(g.gain);
      o.connect(g);
      g.connect(master);
      o.start(now);
      lfo.start(now);
      oscs.push(o, lfo);
    });

    // 白噪音（柔和呼吸感）
    var bufferSize = 2 * ctx.sampleRate;
    var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * 0.12;
    }
    var noise = ctx.createBufferSource();
    noise.buffer = buffer;
    noise.loop = true;
    var noiseFilter = ctx.createBiquadFilter();
    noiseFilter.type = 'lowpass';
    noiseFilter.frequency.value = 600;
    var noiseGain = ctx.createGain();
    noiseGain.gain.value = 0.08;
    noise.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(master);
    noise.start(now);
    oscs.push(noise);

    this.synthNodes = oscs;
    this.sourceType = 'synth';
  };

  AudioController.prototype._stopSynth = function () {
    var ctx = this.audioCtx;
    if (!ctx || !this.synthNodes) return;
    var now = ctx.currentTime;
    if (this.synthGain) {
      this.synthGain.gain.cancelScheduledValues(now);
      this.synthGain.gain.setValueAtTime(this.synthGain.gain.value, now);
      this.synthGain.gain.linearRampToValueAtTime(0, now + 0.6);
    }
    var nodes = this.synthNodes;
    var gain = this.synthGain;
    setTimeout(function () {
      try {
        nodes.forEach(function (n) { n.stop && n.stop(); n.disconnect && n.disconnect(); });
        if (gain) gain.disconnect();
      } catch (e) {}
    }, 700);
    this.synthNodes = null;
    this.synthGain = null;
  };

  AudioController.prototype._startExternal = function () {
    if (!this.audioEl || !this._ensureCtx()) return;
    var ctx = this.audioCtx;
    var el = this.audioEl;
    if (!this.externalSourceNode) {
      this.externalSourceNode = ctx.createMediaElementSource(el);
      var g = ctx.createGain();
      g.gain.value = this.volume;
      this.externalGain = g;
      this.externalSourceNode.connect(g);
      g.connect(ctx.destination);
    }
    el.volume = 1;
    el.loop = true;
    try { el.play(); } catch (e) {}
    this.sourceType = 'external';
  };

  AudioController.prototype._stopExternal = function () {
    if (this.audioEl) {
      try { this.audioEl.pause(); } catch (e) {}
    }
  };

  AudioController.prototype.start = function () {
    if (this.isPlaying) return;
    if (this.audioEl && this.audioEl.src) {
      this._startExternal();
    } else {
      this._startSynth();
    }
    this.isPlaying = true;
  };

  AudioController.prototype.stop = function () {
    if (!this.isPlaying) return;
    this._stopSynth();
    this._stopExternal();
    this.isPlaying = false;
  };

  AudioController.prototype.toggle = function () {
    this.isPlaying ? this.stop() : this.start();
    return this.isPlaying;
  };

  AudioController.prototype.setVolume = function (v) {
    this.volume = Math.max(0, Math.min(1, v));
    if (this.audioCtx && this.synthGain) {
      try {
        this.synthGain.gain.linearRampToValueAtTime(this.volume * 0.35, this.audioCtx.currentTime + 0.3);
      } catch (e) {}
    }
    if (this.externalGain && this.audioCtx) {
      try {
        this.externalGain.gain.linearRampToValueAtTime(this.volume, this.audioCtx.currentTime + 0.2);
      } catch (e) {}
    }
    if (this.audioEl) {
      this.audioEl.volume = this.volume;
    }
  };

  AudioController.prototype.loadFile = function (file) {
    if (!this.audioEl) {
      this.audioEl = new Audio();
    }
    var url = URL.createObjectURL(file);
    this.audioEl.src = url;
    this.audioEl.loop = true;
    if (this.isPlaying) {
      this._stopSynth();
      this._startExternal();
    }
  };

  global.AudioController = AudioController;
})(window);
</script>

  function CanvasScene(canvas) {

    var h = this.canvas.clientHeight || global.innerHeight;
    if (w === this.width && h === this.height) return;
    this.canvas.width = Math.floor(w * this.dpr);
    this.canvas.height = Math.floor(h * this.dpr);
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    this.width = w;
    this.height = h;
  };

  CanvasScene.prototype.setMode = function (mode) {
    this.mode = mode;
  };

  // 根据当前语录更新目标氛围
  CanvasScene.prototype._updateMoodTarget = function (quote) {
    if (!quote) return;
    var hue = typeof quote.moodHue === 'number' ? quote.moodHue : 280;
    var type = quote.type;

    // 根据语录类型调整饱和度/亮度
    var sat, light;
    if (type === 'true') {
      // 真心 → 温暖明亮，饱和度高一些
      sat = 35 + (Math.abs(hue - 40) % 30);
      light = 20 + (Math.abs(hue % 20)) * 0.5;
    } else {
      // 狠话 → 冷峻深沉，饱和度适中偏低
      if (hue > 180 && hue < 300) {
        sat = 50;
        light = 15;
      } else {
        sat = 30;
        light = 18;
      }
    }
    this.targetMoodHue = hue;
    this.targetMoodSat = sat;
    this.targetMoodLight = light;
    this.moodTransition = 0;
  };

  // 设置语录：单数组或双池形式
  CanvasScene.prototype.setQuotes = function (a, b) {
    if (Array.isArray(a) && Array.isArray(b)) {
      this.harshPool = a.slice();
      this.truePool = b.slice();
      this._rebuildMixQuotes();
    } else {
      this.quotes = (a || []).slice();
      this.harshPool = [];
      this.truePool = [];
      this._shuffle(this.quotes);
    }
    // 初始化氛围为第一条语录的语气
    if (this.quotes.length) {
      this.currentMoodHue = this.quotes[0].moodHue || 280;
      this.targetMoodHue = this.currentMoodHue;
    }
  };

  CanvasScene.prototype._rebuildMixQuotes = function () {
    var h = this.harshPool.slice();
    var t = this.truePool.slice();
    if (!h.length && !t.length) {
      this.quotes = [];
      return;
    }
    if (this.mixAlternate) {
      this._shuffle(h);
      this._shuffle(t);
      var result = [];
      var maxLen = Math.max(h.length, t.length);
      for (var i = 0; i < maxLen; i++) {
        if (h.length) result.push(h[i % h.length]);
        if (t.length) result.push(t[i % t.length]);
      }
      this.quotes = result;
    } else {
      var combined = h.concat(t);
      this._shuffle(combined);
      this.quotes = combined;
    }
  };

  CanvasScene.prototype.setMixAlternate = function (on) {
    var v = !!on;
    if (this.mixAlternate === v) return;
    this.mixAlternate = v;
    if (this.harshPool.length || this.truePool.length) {
      this._rebuildMixQuotes();
      this.offset = 0;
    }
  };

  CanvasScene.prototype._shuffle = function (arr) {
    if (!arr || !arr.length) return;
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
  };

  CanvasScene.prototype.shuffle = function () {
    if (this.harshPool.length || this.truePool.length) {
      this._rebuildMixQuotes();
    } else {
      this._shuffle(this.quotes);
    }
    this.offset = 0;
  };

  CanvasScene.prototype.highlightRandom = function () {
    if (!this.quotes.length) return null;
    var idx = Math.floor(Math.random() * this.quotes.length);
    this.highlightIndex = idx;
    var self = this;
    clearTimeout(this._highlightTimer);
    this._highlightTimer = setTimeout(function () {
      self.highlightIndex = -1;
    }, 3800);
    // 更新背景氛围到随机选中的语录
    this._updateMoodTarget(this.quotes[idx]);
    return this.quotes[idx];
  };

  CanvasScene.prototype.start = function () {
    if (this.running) return;
    this.running = true;
    this._lastTime = performance.now();
    var self = this;
    function frame(t) {
      if (!self.running) return;
      var dt = Math.min(0.05, (t - self._lastTime) / 1000);
      self._lastTime = t;
      self.update(dt);
      self.draw();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  };

  CanvasScene.prototype.stop = function () {
    this.running = false;
  };

  CanvasScene.prototype.update = function (dt) {
    this.time += dt;

    // 语录切换计数器（根据速度定时触发新语录）
    if (this.quotes.length) {
      this._quoteTimer = (this._quoteTimer || 0) + dt;
      var quoteInterval = 3.0 / this.speed; // 基础间隔约3秒，速度越快越短
      if (this._quoteTimer >= quoteInterval) {
        this._quoteTimer -= quoteInterval;
        this._advanceQuote();
      }
    }

    // 背景氛围平滑过渡
    this._updateMoodTransition(dt);

    // 更新浮动光球
    for (var i = 0; i < this.orbs.length; i++) {
      var o = this.orbs[i];
      o.x += o.vx * dt * 60;
      o.y += o.vy * dt * 60;
      if (o.x < -o.r) o.x = this.width + o.r;
      if (o.x > this.width + o.r) o.x = -o.r;
      if (o.y < -o.r) o.y = this.height + o.r;
      if (o.y > this.height + o.r) o.y = -o.r;
    }

    // 更新流星
    this._nextShootTime -= dt;
    if (this._nextShootTime <= 0) {
      this.shootingStars.push(this._createShootingStar());
      this._nextShootTime = 3 + Math.random() * 6;
    }
    for (var j = this.shootingStars.length - 1; j >= 0; j--) {
      var ss = this.shootingStars[j];
      ss.x += ss.vx * dt * 60;
      ss.y += ss.vy * dt * 60;
      ss.life += dt;
      ss.alpha = Math.max(0, 1 - ss.life / ss.maxLife);
      if (ss.life >= ss.maxLife) {
        this.shootingStars.splice(j, 1);
      }
    }

    // 更新粒子数量（平滑过渡，避免数量剧烈跳动）
    var target = Math.floor((this.fxIntensity / 100) * 60) + 8;
    this._targetParticleCount = this._targetParticleCount * 0.9 + target * 0.1;
    while (this.particles.length < this._targetParticleCount) {
      this.particles.push(this._createParticle());
    }
    if (this.particles.length > this._targetParticleCount + 3) {
      this.particles.length = Math.floor(this._targetParticleCount);
    }
    for (var k = 0; k < this.particles.length; k++) {
      var p = this.particles[k];
      p.y += p.vy * dt * 60;
      p.x += p.vx * dt * 60;
      p.life += dt;
      p.alpha = Math.max(0, Math.min(1, 1 - p.life / p.maxLife));
      if (p.life >= p.maxLife || p.y < -20 || p.x < -20 || p.x > this.width + 20) {
        this.particles[k] = this._createParticle();
      }
    }
  };

  // 推进到下一句语录
  CanvasScene.prototype._advanceQuote = function () {
    if (!this.quotes.length) return;
    this._quoteIndex = ((this._quoteIndex || 0) + 1) % this.quotes.length;
    var q = this.quotes[this._quoteIndex];
    if (typeof this.onMainQuoteChange === 'function') {
      this.onMainQuoteChange(q, this._quoteIndex, q && q.type);
    }
    this._updateMoodTarget(q);
  };

  // 氛围平滑过渡
  CanvasScene.prototype._updateMoodTransition = function (dt) {
    var speed = 2.0; // 过渡速度（秒），数值越大越慢越平滑
    this.moodTransition = Math.min(1, this.moodTransition + dt / speed);

    // easeOutCubic 缓动
    var t = this.moodTransition;
    t = 1 - Math.pow(1 - t, 3);

    this.currentMoodHue = this._lerpHue(this.currentMoodHue, this.targetMoodHue, t);
    this.currentMoodSat = this.currentMoodSat + (this.targetMoodSat - this.currentMoodSat) * t;
    this.currentMoodLight = this.currentMoodLight + (this.targetMoodLight - this.currentMoodLight) * t;
  };

  // 色调插值（处理环绕）
  CanvasScene.prototype._lerpHue = function (from, to, t) {
    var diff = to - from;
    if (diff > 180) diff -= 360;
    if (diff < -180) diff += 360;
    return ((from + diff * t) % 360 + 360) % 360;
  };

  CanvasScene.prototype._createParticle = function () {
    var colors = this.colorSchemes[this.mode].particle;
    var moodColor = 'hsl(' + this.currentMoodHue.toFixed(1) + ', ' +
      (40 + this.currentMoodSat).toFixed(1) + '%, ' + (40 + this.currentMoodLight).toFixed(1) + '%)';
    var allColors = colors.concat([moodColor, moodColor]);
    return {
      x: Math.random() * this.width,
      y: this.height + Math.random() * 200,
      vx: (Math.random() - 0.5) * 0.3,
      vy: -0.3 - Math.random() * 0.7,
      r: 0.8 + Math.random() * 2.2,
      color: allColors[Math.floor(Math.random() * allColors.length)],
      life: 0,
      maxLife: 3 + Math.random() * 4,
      alpha: 0.5 + Math.random() * 0.5,
      twinkle: Math.random() * TAU
    };
  };

  CanvasScene.prototype._scheme = function () {
    return this.colorSchemes[this.mode] || this.colorSchemes.mix;
  };

  CanvasScene.prototype.draw = function () {
    var ctx = this.ctx;
    var W = this.width, H = this.height;
    var scheme = this._scheme();

    // 背景色受当前氛围影响（保留一位小数，实现连续过渡）
    ctx.fillStyle = 'hsl(' + this.currentMoodHue.toFixed(1) + ', ' +
      (this.currentMoodSat * this.moodInfluence * 0.4).toFixed(1) + '%, ' +
      (5 + this.currentMoodLight * 0.3 * this.moodInfluence).toFixed(1) + '%)';
    ctx.fillRect(0, 0, W, H);

    // 绘制星空背景
    this._drawStars(ctx);

    // 绘制星云/极光渐变（受语录氛围驱动）
    this._drawNebula(ctx, scheme);

    // 绘制浮动光球
    this._drawOrbs(ctx, scheme);

    // 绘制流星
    this._drawShootingStars(ctx, scheme);

    // 画粒子
    this._drawParticles(ctx, scheme);

    // 暗角效果
    this._drawVignette(ctx);
  };

  CanvasScene.prototype._drawStars = function (ctx) {
    var starColor = 'hsl(' + ((this.currentMoodHue + 30) % 360).toFixed(1) + ', 20%, 90%)';
    ctx.save();
    ctx.fillStyle = starColor;
    for (var i = 0; i < this.stars.length; i++) {
      var s = this.stars[i];
      // 缩小闪烁幅度：0.65~1.0，避免忽明忽暗
      var tw = 0.65 + 0.35 * Math.sin(this.time * s.speed * 0.4 + s.twinkle);
      ctx.globalAlpha = tw * 0.7;
      ctx.beginPath();
      ctx.arc(s.x % this.width, s.y % this.height, s.r, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  };

  // 星云渐变 — 每 3 帧更新位置，颜色每帧实时跟随氛围渐变
  CanvasScene.prototype._nebulaFrame = 0;
  CanvasScene.prototype._nebulaCache = null;

  CanvasScene.prototype._drawNebula = function (ctx, scheme) {
    var W = this.width, H = this.height;
    this._nebulaFrame = (this._nebulaFrame || 0) + 1;

    // 每 3 帧或尺寸变化时更新渐变中心位置
    if (this._nebulaFrame % 3 === 1 || !this._nebulaCache || this._nebulaCache.w !== W || this._nebulaCache.h !== H) {
      this._nebulaCache = {
        w: W, h: H,
        nx: W * 0.3 + Math.sin(this.time * 0.05) * W * 0.1,
        ny: H * 0.4 + Math.cos(this.time * 0.07) * H * 0.08,
        n2x: W * 0.75 + Math.cos(this.time * 0.06) * W * 0.12,
        n2y: H * 0.55 + Math.sin(this.time * 0.08) * H * 0.1
      };
    }

    var c = this._nebulaCache;
    var h = this.currentMoodHue;
    var s = this.currentMoodSat * this.moodInfluence;
    var l = this.currentMoodLight;
    var hs = (h + this.time * 4) % 360;

    ctx.save();
    ctx.globalCompositeOperation = 'screen';

    var g1 = ctx.createRadialGradient(c.nx, c.ny, 0, c.nx, c.ny, W * 0.55);
    g1.addColorStop(0, 'hsla(' + h.toFixed(1) + ', ' + s.toFixed(1) + '%, ' + (40 + l * 0.6).toFixed(1) + '%, 0.3)');
    g1.addColorStop(0.4, 'hsla(' + ((h + 40) % 360).toFixed(1) + ', ' + (s * 0.7).toFixed(1) + '%, ' + (25 + l * 0.3).toFixed(1) + '%, 0.15)');
    g1.addColorStop(0.8, 'hsla(' + ((h + 120) % 360).toFixed(1) + ', ' + (s * 0.3).toFixed(1) + '%, 10%, 0.06)');
    g1.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g1;
    ctx.fillRect(0, 0, W, H);

    var g2 = ctx.createRadialGradient(c.n2x, c.n2y, 0, c.n2x, c.n2y, W * 0.4);
    g2.addColorStop(0, 'hsla(' + ((h + 180) % 360).toFixed(1) + ', ' + (s * 0.5).toFixed(1) + '%, 30%, 0.18)');
    g2.addColorStop(0.5, 'hsla(' + ((h + 220) % 360).toFixed(1) + ', ' + (s * 0.3).toFixed(1) + '%, 15%, 0.08)');
    g2.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g2;
    ctx.fillRect(0, 0, W, H);

    var g3 = ctx.createLinearGradient(0, 0, W, H);
    g3.addColorStop(0, 'hsla(' + hs.toFixed(1) + ', ' + (s * 0.8).toFixed(1) + '%, 45%, 0.1)');
    g3.addColorStop(0.5, 'hsla(' + ((hs + 120) % 360).toFixed(1) + ', ' + (s * 0.5).toFixed(1) + '%, 35%, 0.06)');
    g3.addColorStop(1, 'hsla(' + ((hs + 240) % 360).toFixed(1) + ', ' + (s * 0.8).toFixed(1) + '%, 40%, 0.1)');
    ctx.fillStyle = g3;
    ctx.fillRect(0, 0, W, H);

    ctx.restore();
  };

  CanvasScene.prototype._drawOrbs = function (ctx, scheme) {
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    for (var i = 0; i < this.orbs.length; i++) {
      var o = this.orbs[i];
      var grad = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.r);
      // 光球颜色混合氛围色调（保留一位小数，渐变过渡）
      var orbHue = (this.currentMoodHue + i * 50) % 360;
      var orbSat = 60 + this.currentMoodSat * 0.5;
      ctx.globalAlpha = o.alpha * (0.6 + this.moodInfluence * 0.4);
      grad.addColorStop(0, 'hsl(' + orbHue.toFixed(1) + ', ' + orbSat.toFixed(1) + '%, 50%)');
      grad.addColorStop(0.6, 'hsl(' + orbHue.toFixed(1) + ', ' + (orbSat * 0.6).toFixed(1) + '%, 30%)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(o.x - o.r, o.y - o.r, o.r * 2, o.r * 2);
    }
    ctx.restore();
  };

  CanvasScene.prototype._drawVignette = function (ctx) {
    var W = this.width, H = this.height;
    var grad = ctx.createRadialGradient(W / 2, H / 2, W * 0.3, W / 2, H / 2, W * 0.8);
    grad.addColorStop(0, 'rgba(0, 0, 0, 0)');
    var vignetteAlpha = 0.45 + (1 - this.moodInfluence) * 0.1;
    grad.addColorStop(1, 'hsla(' + this.currentMoodHue.toFixed(1) + ', ' +
      (this.currentMoodSat * 0.3).toFixed(1) + '%, 3%, ' + vignetteAlpha.toFixed(2) + ')');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  };

  CanvasScene.prototype._createShootingStar = function () {
    var W = this.width, H = this.height;
    var angle = Math.PI * 0.15 + Math.random() * Math.PI * 0.2;
    var speed = 6 + Math.random() * 8;
    return {
      x: Math.random() * W * 0.8,
      y: Math.random() * H * 0.3,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      len: 60 + Math.random() * 100,
      life: 0,
      maxLife: 0.8 + Math.random() * 0.8,
      alpha: 1
    };
  };

  CanvasScene.prototype._drawShootingStars = function (ctx, scheme) {
    if (!this.shootingStars.length) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var moodColor = 'hsl(' + this.currentMoodHue.toFixed(1) + ', ' +
      this.currentMoodSat.toFixed(1) + '%, 70%)';
    for (var i = 0; i < this.shootingStars.length; i++) {
      var ss = this.shootingStars[i];
      var dist = Math.sqrt(ss.vx * ss.vx + ss.vy * ss.vy);
      var tailX = ss.x - ss.vx / dist * ss.len;
      var tailY = ss.y - ss.vy / dist * ss.len;
      var grad = ctx.createLinearGradient(tailX, tailY, ss.x, ss.y);
      grad.addColorStop(0, 'rgba(255, 255, 255, 0)');
      grad.addColorStop(0.7, moodColor);
      grad.addColorStop(1, '#ffffff');
      ctx.globalAlpha = ss.alpha;
      ctx.strokeStyle = grad;
      ctx.lineWidth = 1.5;
      ctx.shadowColor = moodColor;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(tailX, tailY);
      ctx.lineTo(ss.x, ss.y);
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.arc(ss.x, ss.y, 2, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  };

  CanvasScene.prototype._drawParticles = function (ctx, scheme) {
    var len = this.particles.length;
    if (!len) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < len; i++) {
      var p = this.particles[i];
      // 缩小闪烁幅度 + 降低频率
      var tw = 0.75 + 0.25 * Math.sin(p.life * 1.8 + p.twinkle);
      ctx.globalAlpha = p.alpha * tw * 0.8;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 6; // 减小发光半径
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  };

  global.CanvasScene = CanvasScene;
})(window);
</script>

<script>
// ============ app.js ============
// 主入口：串联场景、音频、控制面板 — 过往墙 · 聊天气泡版
(function () {
  var $ = function (id) { return document.getElementById(id); };

  var canvas = $('stage');
  var scene = new window.CanvasScene(canvas);
  var audio = new window.AudioController();

  // 聊天气泡管理
  var chatInner = $('chatInner');
  var maxBubbles = 7; // 屏幕上最多保留的气泡数
  var bubbleCounter = 0;

  // 添加聊天气泡（优化：使用 textContent 避免 HTML 解析开销）
  function addChatBubble(quote) {
    if (!quote) return;
    var type = quote.type || 'harsh';

    var bubble = document.createElement('div');
    bubble.className = 'chat-bubble ' + type;

    var textSpan = document.createElement('span');
    textSpan.className = 'bubble-text';
    textSpan.textContent = quote.text;

    var authorSpan = document.createElement('span');
    authorSpan.className = 'bubble-author';
    authorSpan.textContent = '\u2014 ' + (quote.author || '\u7f51\u7edc');

    bubble.appendChild(textSpan);
    bubble.appendChild(authorSpan);

    // 每隔几条插入时间分隔
    bubbleCounter++;
    if (bubbleCounter % 5 === 0) {
      var divider = document.createElement('div');
      divider.className = 'chat-time-divider';
      var now = new Date();
      divider.textContent = '\u2014 ' +
        now.getHours().toString().padStart(2, '0') + ':' +
        now.getMinutes().toString().padStart(2, '0') + ' \u2014';
      chatInner.appendChild(divider);
    }

    chatInner.appendChild(bubble);

    // 移除超出限制的旧气泡（直接移除，避免 setTimeout 堆积）
    var children = chatInner.children;
    var bubbleCount = 0;
    var timeCount = 0;
    for (var i = children.length - 1; i >= 0; i--) {
      var child = children[i];
      if (child.classList.contains('chat-bubble')) {
        bubbleCount++;
        if (bubbleCount > maxBubbles) child.remove();
      } else if (child.classList.contains('chat-time-divider')) {
        timeCount++;
      }
    }
    // 确保只保留一条时间分隔线
    var dividers = chatInner.querySelectorAll('.chat-time-divider');
    for (var d = 0; d < dividers.length - 1; d++) {
      dividers[d].remove();
    }

    // 滚动到最新消息（同步操作，无 rAF 开销）
    var container = $('chatContainer');
    if (chatInner.scrollHeight > container.clientHeight) {
      chatInner.style.transform = 'translateY(-' + (chatInner.scrollHeight - container.clientHeight) + 'px)';
    }

    // 将氛围色调传递给音频合成器
    if (quote.moodHue !== undefined) {
      audio.setMoodHue(quote.moodHue);
    }
  }

  // 当前模式
  var currentMode = 'mix';
  function applyQuotes(mode) {
    var data = window.QUOTES;
    var list;
    if (mode === 'harsh') {
      list = data.harsh.slice();
      scene.setMode(mode);
      scene.setQuotes(list);
    } else if (mode === 'true') {
      list = data.true.slice();
      scene.setMode(mode);
      scene.setQuotes(list);
    } else {
      scene.setMode(mode);
      scene.setQuotes(data.harsh.slice(), data.true.slice());
      list = scene.quotes;
    }
    $('currentQuote').textContent = '\u2014 共 ' + list.length + ' 段记忆 \u2014';
  }

  scene.onMainQuoteChange = function (q, idx, type) {
    addChatBubble(q);
  };

  // 面板折叠
  var panel = $('panel');
  $('panelToggle').addEventListener('click', function () {
    panel.classList.toggle('collapsed');
  });

  // 模式切换按钮
  var modeButtons = document.querySelectorAll('.mode-btn');
  modeButtons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      modeButtons.forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      var mode = btn.getAttribute('data-mode');
      currentMode = mode;
      panel.classList.remove('mode-harsh', 'mode-true', 'mode-mix');
      if (mode === 'harsh') panel.classList.add('mode-harsh');
      if (mode === 'true') panel.classList.add('mode-true');
      if (mode === 'mix') panel.classList.add('mode-mix');
      applyQuotes(mode);
      scene.shuffle();
    });
  });

  // 混合模式 — 奇偶交替开关
  $('alternateToggle').addEventListener('change', function (e) {
    scene.setMixAlternate(e.target.checked);
    $('currentQuote').textContent = '\u2014 共 ' + scene.quotes.length + ' 段记忆 \u2014';
  });

  // 速度
  $('speedRange').addEventListener('input', function (e) {
    var v = parseFloat(e.target.value);
    scene.speed = v;
    $('speedValue').textContent = v.toFixed(1) + 'x';
  });

  // 特效
  $('fxRange').addEventListener('input', function (e) {
    var v = parseInt(e.target.value, 10);
    scene.fxIntensity = v;
    var label = v < 25 ? '\u5f31' : v < 60 ? '\u4e2d' : v < 85 ? '\u5f3a' : '\u6781';
    $('fxValue').textContent = label;
  });

  // 字体大小
  $('sizeRange').addEventListener('input', function (e) {
    var v = parseInt(e.target.value, 10);
    scene.fontSize = v;
    $('sizeValue').textContent = v + 'px';
  });

  // 背景氛围影响力滑块
  $('moodRange').addEventListener('input', function (e) {
    var v = parseInt(e.target.value, 10) / 100;
    scene.moodInfluence = v;
    if (v < 0.25) {
      $('moodValue').textContent = '\u5fae\u5f31';
    } else if (v < 0.5) {
      $('moodValue').textContent = '\u8f7b\u5fae';
    } else if (v < 0.75) {
      $('moodValue').textContent = '\u968f\u8bed\u5f55';
    } else {
      $('moodValue').textContent = '\u5f3a\u70c8';
    }
  });

  // 音乐按钮
  var musicBtn = $('musicBtn');
  var musicBtnText = $('musicBtnText');
  var musicState = $('musicState');
  function updateMusicUI() {
    if (audio.isPlaying) {
      musicBtnText.textContent = '\u5173\u95ed';
      musicState.textContent = '\u64ad\u653e\u4e2d';
    } else {
      musicBtnText.textContent = '\u5f00\u542f';
      musicState.textContent = '\u5173\u95ed';
    }
  }
  musicBtn.addEventListener('click', function () {
    audio.toggle();
    updateMusicUI();
  });

  // 音量
  $('volRange').addEventListener('input', function (e) {
    var v = parseInt(e.target.value, 10) / 100;
    audio.setVolume(v);
    $('volValue').textContent = Math.round(v * 100) + '%';
  });

  // 上传音乐
  $('fileInput').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    audio.loadFile(f);
    if (!audio.isPlaying) {
      audio.toggle();
      updateMusicUI();
    } else {
      musicState.textContent = '\u5916\u90e8\u97f3\u6e90';
    }
  });

  // 随机翻阅
  $('randomBtn').addEventListener('click', function () {
    var q = scene.highlightRandom();
    if (q) addChatBubble(q);
  });

  $('resetBtn').addEventListener('click', function () {
    scene.offset = 0;
    scene.shuffle();
    chatInner.innerHTML = '';
    bubbleCounter = 0;
    chatInner.style.transform = 'translateY(0)';
  });

  // 启动界面
  var starter = $('starter');
  $('startBtn').addEventListener('click', function () {
    starter.classList.add('hidden');
    applyQuotes(currentMode);
    scene.start();
    audio.setVolume(parseInt($('volRange').value, 10) / 100);
    audio.start();
    updateMusicUI();
    setTimeout(function () { starter.style.display = 'none'; }, 900);

    if (scene.quotes.length) {
      var first = scene.quotes[0];
      addChatBubble(first);
    }
  });

  // 初始化显示
  scene.setMixAlternate($('alternateToggle').checked);
  applyQuotes(currentMode);
})();
</script>
</body>
</html>
