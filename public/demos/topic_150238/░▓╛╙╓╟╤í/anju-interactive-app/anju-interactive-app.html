  <main class="app">

        <label class="field">性价比<select id="value"><option selected>优先性价比</option><option>优先通勤</option><option>优先生活品质</option><option>均衡推荐</option></select></label>
      </form>

        <button class="chip" data-filter="中介帮租">中介帮租</button>
        <button class="chip" data-filter="高性价比">高性价比</button>
