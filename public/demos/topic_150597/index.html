<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>星梦岐境</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <!-- ========== Page 1: 序言页 ========== -->
    <section id="page-prologue" class="page prologue-page active">
      <!-- 云雾背景图层1（缓慢平移 + 缩放呼吸） -->
      <div class="cloud-layer">
        <img class="cloud-img cloud-img-1" src="images/cloud-bg.png" alt="">
      </div>
      <!-- 云雾背景图层2（反向飘动，叠加层次感） -->
      <div class="cloud-layer cloud-layer-2">
        <img class="cloud-img cloud-img-2" src="images/cloud-bg.png" alt="">
      </div>
      <!-- 顶部丁达尔光晕 -->
      <div class="halo-layer"></div>
      <!-- 文字区域 -->
      <div class="text-area">
        <div class="paragraph" id="prologue-part1"></div>
        <div class="paragraph" id="prologue-part2"></div>
      </div>
      <!-- 底部提示：步入梦境 -->
      <div class="footer-hint" id="prologue-hint">
        <span class="hint-text">步入梦境</span>
      </div>
    </section>

    <!-- ========== Page 2: 四象首页 ========== -->
    <section id="page-index" class="page home-page">
      <!-- 背景星点层 -->
      <div class="star-layer" id="index-stars"></div>
      <!-- 顶部大标题 -->
      <div class="header">
        <span class="main-title">星梦岐境</span>
      </div>
      <!-- 四象网格 2x2 -->
      <div class="symbol-grid" id="symbol-grid"></div>
    </section>

    <!-- ========== Page 3: 星宿列表页 ========== -->
    <section id="page-list" class="page list-page">
      <!-- 背景星点层 -->
      <div class="star-layer" id="list-stars"></div>
      <!-- 顶部：返回 + 四象名称 -->
      <div class="header">
        <div class="back-btn" id="list-back-btn">
          <span class="back-icon">←</span>
        </div>
        <span class="group-title" id="list-group-title"></span>
      </div>
      <!-- 竖向 swiper：7个星宿，滑动+点击选中 -->
      <div class="constellation-swiper" id="constellation-swiper"></div>
      <!-- 底部按钮：步入此境 -->
      <div class="footer">
        <div class="enter-btn" id="list-enter-btn">
          <span class="enter-text">步入此境</span>
        </div>
      </div>
    </section>

    <!-- ========== Page 4: 故事交互页 ========== -->
    <section id="page-story" class="page story-page">
      <!-- Step 1: 星宿引子 -->
      <div class="step step-1" id="step-1">
        <div class="step1-header">
          <span class="xingming-name" id="story-name"></span>
          <span class="xingming-dot"> · </span>
          <span class="xingming-title" id="story-title"></span>
        </div>
        <div class="step1-body">
          <div class="text-line" id="step1-intro"></div>
          <div class="text-line medicine-line" id="step1-medicine"></div>
        </div>
        <div class="tap-hint" id="step1-hint">轻触继续</div>
      </div>

      <!-- Step 2: 场景风貌 -->
      <div class="step step-2" id="step-2">
        <div class="step2-scene" id="step2-scene"></div>
        <div class="step2-npc" id="step2-npc"></div>
        <div class="tap-hint" id="step2-hint">轻触继续</div>
      </div>

      <!-- Step 3: 轻交互 -->
      <div class="step step-3" id="step-3">
        <div class="interaction" id="interaction">
          <div class="interaction-index" id="interaction-index"></div>
          <div class="interaction-name" id="interaction-name"></div>
          <div class="interaction-action" id="interaction-action"></div>
          <div class="interaction-stage">
            <!-- 呼吸光圈 -->
            <div class="breath-area" id="breath-area">
              <div class="breath-ring"></div>
              <div class="breath-core"></div>
              <!-- 涟漪层 -->
              <div class="ripples-layer" id="ripples-layer"></div>
            </div>
            <!-- 反馈 + 禅意 -->
            <div class="interaction-feedback" id="interaction-feedback">
              <span class="feedback-text" id="feedback-text"></span>
              <span class="zen-text" id="zen-text"></span>
            </div>
          </div>
        </div>
      </div>

      <!-- Step 4: 结语 -->
      <div class="step step-4" id="step-4">
        <div class="step4-ending" id="step4-ending"></div>
        <!-- 保存手札按钮 -->
        <div class="save-btn" id="save-btn">保存手札</div>
        <!-- 轻触返回提示 -->
        <div class="back-hint" id="back-hint">轻触屏幕，返回星宿列表</div>
      </div>

      <!-- 隐藏 Canvas，用于生成手札图片 -->
      <canvas id="card-canvas" width="600" height="900" class="card-canvas"></canvas>
    </section>

  </div>

  <!-- Toast 提示 -->
  <div id="toast" class="toast"></div>
  <!-- Loading 加载 -->
  <div id="loading" class="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">正在生成手札</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
