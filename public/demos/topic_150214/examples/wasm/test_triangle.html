<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>WebGL 测试 - 单个三角形</title>
    <style>
        body { background: #1a1a2e; color: #e0e0e0; font-family: sans-serif; }
        canvas { width: 800px; height: 400px; border: 2px solid #333; background: #000; }
        .info { margin: 20px; }
    </style>
</head>
<body>
    <div class="info">
        <h1>WebGL 测试 - 单个三角形</h1>
        <div id="log"></div>
    </div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const logDiv = document.getElementById('log');
        
        function log(msg) {
            logDiv.textContent += msg + '\n';
            console.log(msg);
        }

        const gl = canvas.getContext('webgl');
        if (!gl) {
            log('❌ WebGL 不可用');
            alert('WebGL 不可用');
        }

        const vertexShaderSource = `
            attribute vec3 aPosition;
            void main() {
                gl_Position = vec4(aPosition, 1.0);
            }
        `;

        const fragmentShaderSource = `
            precision mediump float;
            void main() {
                gl_FragColor = vec4(0.0, 0.83, 1.0, 1.0);
            }
        `;

        function createShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                log('Shader 错误: ' + gl.getShaderInfoLog(shader));
                return null;
            }
            return shader;
        }

        const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
        const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);
        
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            log('程序链接失败: ' + gl.getProgramInfoLog(program));
        }

        gl.useProgram(program);

        const vertices = new Float32Array([
            -0.5, -0.5, 0,
             0.5, -0.5, 0,
             0,    0.5, 0
        ]);

        const positionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

        const posLoc = gl.getAttribLocation(program, 'aPosition');
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);

        gl.clearColor(0.1, 0.1, 0.1, 1);
        gl.clear(gl.COLOR_BUFFER_BIT);

        gl.drawArrays(gl.TRIANGLES, 0, 3);

        const err = gl.getError();
        if (err !== gl.NO_ERROR) {
            log('WebGL 错误: ' + err);
        } else {
            log('✅ 渲染完成');
        }
    </script>
</body>
</html>
