<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TraeGeo AI 3D建模引擎</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧊</text></svg>" />
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #16213e 100%); color: #e0e0e0; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #00d4ff; font-size: 2.5em; margin: 0; text-shadow: 0 0 20px rgba(0, 212, 255, 0.3); }
        .header p { color: #888; margin-top: 10px; }
        
        .demo-section { background: rgba(30, 30, 60, 0.8); backdrop-filter: blur(10px); border-radius: 12px; padding: 24px; margin-bottom: 20px; border: 1px solid rgba(0, 212, 255, 0.1); }
        .demo-section h2 { color: #00d4ff; margin-top: 0; display: flex; align-items: center; gap: 10px; }
        .demo-section h2::before { content: ''; width: 4px; height: 24px; background: #00d4ff; border-radius: 2px; }
        
        .btn { background: linear-gradient(135deg, #00d4ff, #0099cc); color: #0f0f23; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: all 0.3s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0, 212, 255, 0.3); }
        .btn:disabled { background: #555; cursor: not-allowed; transform: none; box-shadow: none; }
        
        .output { background: #0f0f23; padding: 15px; border-radius: 6px; font-family: 'Consolas', monospace; white-space: pre-wrap; height: 120px; overflow-y: auto; border: 1px solid #333; font-size: 13px; }
        canvas { width: 100%; height: 500px; border-radius: 8px; background: #000; border: 2px solid #333; }
        .stats { display: flex; gap: 20px; margin-top: 15px; flex-wrap: wrap; }
        .stat { background: rgba(0, 0, 0, 0.3); padding: 12px 24px; border-radius: 6px; display: flex; flex-direction: column; }
        .stat-label { font-size: 12px; color: #888; }
        .stat-value { font-size: 20px; font-weight: bold; color: #00d4ff; }
        
        .input-group { display: flex; gap: 12px; align-items: flex-start; }
        textarea { flex: 1; padding: 12px; border: 2px solid #333; border-radius: 6px; background: #0f0f23; color: #e0e0e0; font-size: 14px; font-family: 'Segoe UI', sans-serif; resize: vertical; min-height: 60px; }
        textarea:focus { outline: none; border-color: #00d4ff; }
        
        .suggestions { margin-top: 12px; font-size: 13px; color: #888; }
        .suggestions span { display: inline-block; background: rgba(0, 212, 255, 0.1); color: #00d4ff; padding: 5px 12px; border-radius: 20px; margin-right: 8px; margin-bottom: 5px; cursor: pointer; transition: all 0.3s; }
        .suggestions span:hover { background: rgba(0, 212, 255, 0.2); }
        
        .ollama-config { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .config-item { display: flex; align-items: center; gap: 8px; }
        .config-item label { font-size: 13px; color: #888; }
        .config-item input { padding: 6px 10px; border: 1px solid #333; border-radius: 4px; background: #0f0f23; color: #e0e0e0; font-size: 13px; width: 150px; }
        
        .loading-indicator { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(0, 212, 255, 0.3); border-radius: 50%; border-top-color: #00d4ff; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .status-online { background: rgba(0, 255, 100, 0.2); color: #00ff64; }
        .status-offline { background: rgba(255, 0, 0, 0.2); color: #ff4444; }
        .status-processing { background: rgba(0, 212, 255, 0.2); color: #00d4ff; }
        
        .instruction-preview { background: rgba(0, 212, 255, 0.05); border: 1px solid rgba(0, 212, 255, 0.2); border-radius: 6px; padding: 15px; margin-top: 15px; }
        .instruction-preview h4 { color: #00d4ff; margin: 0 0 10px 0; font-size: 14px; }
        .instruction-preview code { display: block; font-size: 12px; color: #a0a0a0; word-break: break-all; }
        
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav-tab { padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: all 0.3s; }
        .nav-tab.active { background: #00d4ff; color: #0f0f23; }
        .nav-tab:not(.active) { background: rgba(0, 212, 255, 0.1); color: #00d4ff; }
        .nav-tab:hover:not(.active) { background: rgba(0, 212, 255, 0.2); }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧊 TraeGeo AI 3D建模引擎</h1>
            <p>自然语言 → Ollama → 3D模型 | 完全自主可控几何内核</p>
        </div>

        <div class="nav-tabs">
            <div class="nav-tab active" onclick="switchTab('ai')">AI 生成</div>
            <div class="nav-tab" onclick="switchTab('basic')">基础几何体</div>
            <div class="nav-tab" onclick="switchTab('operations')">几何运算</div>
        </div>

        <div id="ai-tab" class="tab-content active">
            <div class="demo-section">
                <h2>AI 自然语言生成模型</h2>
                <div class="ollama-config">
                    <div class="config-item">
                        <label>模型:</label>
                        <input type="text" id="ollamaModel" value="qwen" placeholder="qwen, llama3, gemma">
                    </div>
                    <div class="config-item">
                        <label>服务器:</label>
                        <input type="text" id="ollamaUrl" value="http://localhost:11434" placeholder="http://localhost:11434">
                    </div>
                    <button class="btn" id="checkOllamaBtn">检查连接</button>
                    <span id="ollamaStatus" class="status-badge status-offline">未连接</span>
                </div>
                
                <div class="input-group">
                    <textarea id="aiInput" placeholder="输入建模需求，例如：&#10;生成一个半径5cm的球体&#10;做一个带圆角的长方体机箱&#10;生成一个机械零件，带孔、凹槽和倒角&#10;创建一个杯子，带把手，壁厚2mm"></textarea>
                    <button class="btn" id="aiGenerateBtn">
                        <span id="btnText">生成模型</span>
                        <span id="btnLoading" class="loading-indicator" style="display:none"></span>
                    </button>
                </div>
                
                <div class="suggestions">
                    示例：
                    <span onclick="fillSuggestion('生成一个半径5cm的球体')">半径5cm的球体</span>
                    <span onclick="fillSuggestion('做一个带圆角的长方体机箱')">带圆角的机箱</span>
                    <span onclick="fillSuggestion('生成一个机械零件，带孔、凹槽和倒角')">机械零件</span>
                    <span onclick="fillSuggestion('创建一个杯子，带把手，壁厚2mm')">带把手的杯子</span>
                </div>
                
                <div class="instruction-preview" id="instructionPreview" style="display:none">
                    <h4>解析的建模指令:</h4>
                    <code id="instructionCode"></code>
                </div>
            </div>
        </div>

        <div id="basic-tab" class="tab-content">
            <div class="demo-section">
                <h2>创建基础几何体</h2>
                <div class="input-group">
                    <input type="text" id="shapeInput" placeholder="输入几何体名称：立方体、球体、圆柱体、圆锥体、四面体、八面体" style="flex:1; min-height:44px;">
                    <button class="btn" id="createShapeBtn">创建</button>
                </div>
                <div class="suggestions">
                    支持的几何体：<span>立方体</span><span>球体</span><span>圆柱体</span><span>圆锥体</span><span>四面体</span><span>八面体</span>
                </div>
            </div>
        </div>

        <div id="operations-tab" class="tab-content">
            <div class="demo-section">
                <h2>几何运算</h2>
                <button class="btn" id="createBtn">创建立方体</button>
                <button class="btn" id="booleanBtn">布尔并集</button>
                <button class="btn" id="loadBtn">重新加载引擎</button>
            </div>
        </div>

        <div class="demo-section">
            <h2>3D 预览</h2>
            <canvas id="canvas"></canvas>
            <div class="stats">
                <div class="stat">
                    <span class="stat-label">实体</span>
                    <span class="stat-value" id="entities">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">顶点</span>
                    <span class="stat-value" id="vertices">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">三角形</span>
                    <span class="stat-value" id="triangles">0</span>
                </div>
            </div>
            <div class="output" id="log">点击按钮开始...</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const logDiv = document.getElementById('log');
        const aiInput = document.getElementById('aiInput');
        const ollamaModel = document.getElementById('ollamaModel');
        const ollamaUrl = document.getElementById('ollamaUrl');
        const ollamaStatus = document.getElementById('ollamaStatus');
        
        let gl = null;
        let program = null;
        let positionBuffer = null;
        let normalBuffer = null;
        let meshData = null;
        let traeGeo = null;

        function log(msg) {
            logDiv.textContent = msg + '\n';
            console.log(msg);
        }

        function addLog(msg) {
            logDiv.textContent = msg + '\n' + logDiv.textContent;
            console.log(msg);
        }

        function switchTab(tabName) {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelector(`.nav-tab[onclick="switchTab('${tabName}')"]`).classList.add('active');
            document.getElementById(`${tabName}-tab`).classList.add('active');
        }

        function fillSuggestion(text) {
            aiInput.value = text;
        }

        async function checkOllamaConnection() {
            const url = ollamaUrl.value;
            try {
                const response = await fetch(`${url}/api/models`);
                if (response.ok) {
                    ollamaStatus.className = 'status-badge status-online';
                    ollamaStatus.textContent = '已连接';
                    addLog('✅ Ollama 服务连接成功');
                } else {
                    ollamaStatus.className = 'status-badge status-offline';
                    ollamaStatus.textContent = '连接失败';
                    addLog('❌ Ollama 服务连接失败');
                }
            } catch (e) {
                ollamaStatus.className = 'status-badge status-offline';
                ollamaStatus.textContent = '未连接';
                addLog('❌ 无法连接到 Ollama: ' + e.message);
            }
        }

        async function sendToOllama(prompt) {
            const model = ollamaModel.value;
            const url = ollamaUrl.value;
            
            const systemPrompt = `你是一个专业的3D建模指令生成器，为TraeGeo几何引擎提供建模指令。

## 角色定位
- 输入：用户用自然语言描述的建模需求
- 输出：严格的JSON格式建模指令
- 目标：将用户的自然语言描述转换为几何引擎可执行的操作序列

## 必须遵守的规则
1. 严格输出JSON格式，不包含任何额外文本、解释或注释
2. JSON必须符合提供的Schema规范
3. 使用标准单位（默认mm，用户指定时使用用户指定的单位）
4. 操作顺序必须符合建模逻辑：先创建基本体，再进行变换和布尔运算
5. 所有数值必须是合理的正数
6. 如果用户描述不完整，使用合理的默认值

## 支持的操作类型
- create_primitive: 创建基本体（box, sphere, cylinder, cone, tetrahedron, octahedron）
- transform: 变换（平移、旋转、缩放）
- boolean: 布尔运算（union, difference, intersection）
- fillet: 圆角
- chamfer: 倒角
- hole: 打孔
- extrude: 拉伸
- revolve: 旋转成型
- shell: 抽壳

## 输出格式要求
- 必须以完整的JSON对象开始和结束
- 不要使用markdown代码块标记
- 确保JSON语法正确，所有引号配对，逗号正确
- 浮点数使用点号作为小数点

## 示例
输入：生成一个半径5cm的球体
输出：{"operations":[{"type":"create_primitive","primitive_type":"sphere","params":{"name":"sphere_1","dimensions":[50.0],"position":[0,0,0],"rotation":[0,0,0],"scale":[1,1,1]}}],"units":"mm","version":"1.0"}

输入：做一个带圆角的长方体机箱
输出：{"operations":[{"type":"create_primitive","primitive_type":"box","params":{"name":"chassis","dimensions":[400,200,400],"position":[0,0,0],"rotation":[0,0,0],"scale":[1,1,1]}},{"type":"fillet","target":"chassis","edges":["edge_1","edge_2","edge_3","edge_4","edge_5","edge_6","edge_7","edge_8"],"radius":10.0}],"units":"mm","version":"1.0"}

输入：生成一个机械零件，带孔、凹槽和倒角
输出：{"operations":[{"type":"create_primitive","primitive_type":"box","params":{"name":"part","dimensions":[100,50,30],"position":[0,0,0],"rotation":[0,0,0],"scale":[1,1,1]}},{"type":"chamfer","target":"part","edges":["edge_1","edge_2","edge_3","edge_4"],"distance":5.0},{"type":"hole","target":"part","params":{"position":[50,25,0],"direction":[0,0,1],"diameter":20.0,"depth":30.0}},{"type":"create_primitive","primitive_type":"box","params":{"name":"slot","dimensions":[80,10,15],"position":[10,20,0],"rotation":[0,0,0],"scale":[1,1,1]}},{"type":"boolean","operation":"difference","target":"part","tool":"slot"}],"units":"mm","version":"1.0"}

输入：创建一个杯子，带把手，壁厚2mm
输出：{"operations":[{"type":"create_primitive","primitive_type":"cylinder","params":{"name":"outer","dimensions":[40,100],"position":[0,0,0],"rotation":[0,0,0],"scale":[1,1,1]}},{"type":"create_primitive","primitive_type":"cylinder","params":{"name":"inner","dimensions":[38,98],"position":[0,1,0],"rotation":[0,0,0],"scale":[1,1,1]}},{"type":"boolean","operation":"difference","target":"outer","tool":"inner"},{"type":"create_primitive","primitive_type":"cylinder","params":{"name":"handle","dimensions":[15,80],"position":[45,50,0],"rotation":[0,0,90],"scale":[1,1,1]}},{"type":"create_primitive","primitive_type":"cylinder","params":{"name":"handle_inner","dimensions":[11,76],"position":[45,50,0],"rotation":[0,0,90],"scale":[1,1,1]}},{"type":"boolean","operation":"difference","target":"handle","tool":"handle_inner"},{"type":"boolean","operation":"union","target":"outer","tool":"handle"}],"units":"mm","version":"1.0"}`;

            const requestBody = {
                model: model,
                prompt: prompt,
                stream: false,
                options: {
                    temperature: 0.1,
                    top_p: 0.9,
                    max_tokens: 2000
                },
                system: systemPrompt
            };

            const response = await fetch(`${url}/api/generate`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            });

            if (!response.ok) {
                throw new Error(`Ollama 错误: ${response.status} ${response.statusText}`);
            }

            const data = await response.json();
            return data.response;
        }

        function parseInstruction(jsonStr) {
            let json = jsonStr.trim();
            const jsonMatch = json.match(/\{[\s\S]*\}/);
            if (jsonMatch) {
                json = jsonMatch[0];
            }
            return JSON.parse(json);
        }

        function executeInstruction(instruction) {
            const operations = instruction.operations;
            let lastGeometry = null;
            let entities = [];

            for (const op of operations) {
                switch (op.type) {
                    case 'create_primitive':
                        const geom = createGeometryByType(op.primitive_type, op.params);
                        if (geom) {
                            entities.push({ name: op.params.name, geom });
                            lastGeometry = geom;
                        }
                        break;
                    case 'transform':
                        break;
                    case 'boolean':
                        if (entities.length >= 2) {
                            lastGeometry = entities[entities.length - 1].geom;
                        }
                        break;
                    case 'fillet':
                    case 'chamfer':
                    case 'hole':
                    case 'shell':
                        break;
                    default:
                        break;
                }
            }

            if (lastGeometry) {
                return {
                    vertices: new Float32Array(lastGeometry.vertices),
                    normals: new Float32Array(lastGeometry.normals),
                    numVertices: lastGeometry.vertices.length / 3,
                    numTriangles: lastGeometry.vertices.length / 9
                };
            }
            return null;
        }

        function createGeometryByType(primitiveType, params) {
            const dims = params.dimensions || [];
            switch (primitiveType.toLowerCase()) {
                case 'box':
                    const bx = dims[0] || 1;
                    const by = dims[1] || 1;
                    const bz = dims[2] || 1;
                    return createBoxGeometry(bx, by, bz);
                case 'sphere':
                    const sr = dims[0] || 0.7;
                    return createSphereGeometry(sr, 32, 16);
                case 'cylinder':
                    const cr = dims[0] || 0.5;
                    const ch = dims[1] || 1.5;
                    return createCylinderGeometry(cr, ch, 32);
                case 'cone':
                    const coner = dims[0] || 0.5;
                    const coneH = dims[1] || 1.5;
                    return createConeGeometry(coner, coneH, 32);
                case 'tetrahedron':
                    return createTetrahedronGeometry();
                case 'octahedron':
                    return createOctahedronGeometry();
                default:
                    return createBoxGeometry(1, 1, 1);
            }
        }

        function initGL() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = Math.max(rect.width, 800);
            canvas.height = 500;
            
            gl = canvas.getContext('webgl');
            if (!gl) {
                log('❌ WebGL 不可用');
                return false;
            }

            const vertexShader = createShader(gl, gl.VERTEX_SHADER, `
                attribute vec3 aPosition;
                attribute vec3 aNormal;
                uniform mat4 uModelView;
                uniform mat4 uProjection;
                varying vec3 vNormal;
                void main() {
                    gl_Position = uProjection * uModelView * vec4(aPosition, 1.0);
                    vNormal = mat3(uModelView) * aNormal;
                }
            `);
            
            const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, `
                precision mediump float;
                varying vec3 vNormal;
                void main() {
                    vec3 light = normalize(vec3(1.0, 1.0, 1.0));
                    float diff = max(dot(normalize(vNormal), light), 0.3);
                    gl_FragColor = vec4(0.0, 0.83, 1.0, 1.0) * diff;
                }
            `);

            if (!vertexShader || !fragmentShader) {
                return false;
            }

            program = createProgram(gl, vertexShader, fragmentShader);
            if (!program) {
                return false;
            }

            positionBuffer = gl.createBuffer();
            normalBuffer = gl.createBuffer();

            gl.clearColor(0.1, 0.1, 0.1, 1);
            gl.enable(gl.DEPTH_TEST);
            
            return true;
        }

        function createShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                log('❌ Shader 编译失败: ' + gl.getShaderInfoLog(shader));
                return null;
            }
            return shader;
        }

        function createProgram(gl, vShader, fShader) {
            const prog = gl.createProgram();
            gl.attachShader(prog, vShader);
            gl.attachShader(prog, fShader);
            gl.linkProgram(prog);
            if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
                log('❌ 程序链接失败: ' + gl.getProgramInfoLog(prog));
                return null;
            }
            return prog;
        }

        function createPerspective(fov, aspect, near, far) {
            const f = 1.0 / Math.tan(fov * Math.PI / 180 / 2);
            const nf = 1 / (near - far);
            return new Float32Array([
                f / aspect, 0, 0, 0,
                0, f, 0, 0,
                0, 0, (far + near) * nf, -1,
                0, 0, 2 * far * near * nf, 0
            ]);
        }

        function createLookAt(eye, center, up) {
            let x0, x1, x2, y0, y1, y2, z0, z1, z2, len;
            const eyex = eye[0], eyey = eye[1], eyez = eye[2];
            const upx = up[0], upy = up[1], upz = up[2];
            const centerx = center[0], centery = center[1], centerz = center[2];
            
            z0 = eyex - centerx; z1 = eyey - centery; z2 = eyez - centerz;
            len = Math.sqrt(z0*z0 + z1*z1 + z2*z2);
            z0 /= len; z1 /= len; z2 /= len;
            
            x0 = upy * z2 - upz * z1; x1 = upz * z0 - upx * z2; x2 = upx * z1 - upy * z0;
            len = Math.sqrt(x0*x0 + x1*x1 + x2*x2);
            if (len === 0) { x0 = 0; x1 = 0; x2 = 0; } else { x0 /= len; x1 /= len; x2 /= len; }
            
            y0 = z1 * x2 - z2 * x1; y1 = z2 * x0 - z0 * x2; y2 = z0 * x1 - z1 * x0;

            const result = new Float32Array(16);
            result[0] = x0; result[1] = y0; result[2] = z0; result[3] = 0;
            result[4] = x1; result[5] = y1; result[6] = z1; result[7] = 0;
            result[8] = x2; result[9] = y2; result[10] = z2; result[11] = 0;
            result[12] = -(x0 * eyex + x1 * eyey + x2 * eyez);
            result[13] = -(y0 * eyex + y1 * eyey + y2 * eyez);
            result[14] = -(z0 * eyex + z1 * eyey + z2 * eyez);
            result[15] = 1;
            return result;
        }

        function render() {
            if (!gl || !program || !meshData) {
                return;
            }

            gl.viewport(0, 0, canvas.width, canvas.height);
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
            gl.useProgram(program);

            gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, meshData.vertices, gl.STATIC_DRAW);
            const posLoc = gl.getAttribLocation(program, 'aPosition');
            gl.enableVertexAttribArray(posLoc);
            gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);

            gl.bindBuffer(gl.ARRAY_BUFFER, normalBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, meshData.normals, gl.STATIC_DRAW);
            const normLoc = gl.getAttribLocation(program, 'aNormal');
            gl.enableVertexAttribArray(normLoc);
            gl.vertexAttribPointer(normLoc, 3, gl.FLOAT, false, 0, 0);

            const aspect = canvas.width / canvas.height;
            const proj = createPerspective(45, aspect, 0.1, 100);
            const view = createLookAt([3, 3, 4], [0, 0, 0], [0, 1, 0]);

            const projLoc = gl.getUniformLocation(program, 'uProjection');
            gl.uniformMatrix4fv(projLoc, false, proj);

            const viewLoc = gl.getUniformLocation(program, 'uModelView');
            gl.uniformMatrix4fv(viewLoc, false, view);

            gl.drawArrays(gl.TRIANGLES, 0, meshData.numVertices);

            const err = gl.getError();
            if (err !== gl.NO_ERROR) {
                addLog('❌ WebGL 错误: ' + err);
            } else {
                addLog(`✅ 渲染成功: ${meshData.numTriangles} 三角形, ${meshData.numVertices} 顶点`);
            }
        }

        function createBoxGeometry(width, height, depth) {
            const vertices = [];
            const normals = [];
            const hw = width / 2, hh = height / 2, hd = depth / 2;

            function addFace(nx, ny, nz, v0, v1, v2, v3) {
                vertices.push(v0[0], v0[1], v0[2]);
                vertices.push(v1[0], v1[1], v1[2]);
                vertices.push(v2[0], v2[1], v2[2]);
                vertices.push(v0[0], v0[1], v0[2]);
                vertices.push(v2[0], v2[1], v2[2]);
                vertices.push(v3[0], v3[1], v3[2]);
                for (let i = 0; i < 6; i++) {
                    normals.push(nx, ny, nz);
                }
            }

            addFace(0, 0, -1, [-hw,-hh,-hd], [hw,-hh,-hd], [hw,hh,-hd], [-hw,hh,-hd]);
            addFace(0, 0, 1,  [hw,-hh,hd], [-hw,-hh,hd], [-hw,hh,hd], [hw,hh,hd]);
            addFace(-1, 0, 0, [-hw,-hh,hd], [-hw,-hh,-hd], [-hw,hh,-hd], [-hw,hh,hd]);
            addFace(1, 0, 0,  [hw,-hh,-hd], [hw,-hh,hd], [hw,hh,hd], [hw,hh,-hd]);
            addFace(0, -1, 0, [-hw,-hh,hd], [hw,-hh,hd], [hw,-hh,-hd], [-hw,-hh,-hd]);
            addFace(0, 1, 0,  [-hw,hh,-hd], [hw,hh,-hd], [hw,hh,hd], [-hw,hh,hd]);

            return { vertices, normals };
        }

        function createSphereGeometry(radius, slices, stacks) {
            const vertices = [];
            const normals = [];
            
            for (let i = 0; i <= stacks; i++) {
                const lat0 = Math.PI * (-0.5 + (i - 1) / stacks);
                const lat1 = Math.PI * (-0.5 + i / stacks);
                const z0 = Math.sin(lat0);
                const z1 = Math.sin(lat1);
                const r0 = Math.cos(lat0);
                const r1 = Math.cos(lat1);
                
                for (let j = 0; j <= slices; j++) {
                    const lng = 2 * Math.PI * (j - 1) / slices;
                    const x = Math.cos(lng);
                    const y = Math.sin(lng);
                    
                    vertices.push(r0 * x * radius, r0 * y * radius, z0 * radius);
                    vertices.push(r1 * x * radius, r1 * y * radius, z1 * radius);
                    
                    normals.push(r0 * x, r0 * y, z0);
                    normals.push(r1 * x, r1 * y, z1);
                }
            }
            
            return { vertices, normals };
        }

        function createCylinderGeometry(radius, height, slices) {
            const vertices = [];
            const normals = [];
            const halfHeight = height / 2;

            for (let i = 0; i < slices; i++) {
                const angle0 = (i / slices) * Math.PI * 2;
                const angle1 = ((i + 1) / slices) * Math.PI * 2;
                const x0 = Math.cos(angle0);
                const y0 = Math.sin(angle0);
                const x1 = Math.cos(angle1);
                const y1 = Math.sin(angle1);

                vertices.push(x0 * radius, y0 * radius, -halfHeight);
                vertices.push(x1 * radius, y1 * radius, -halfHeight);
                vertices.push(x0 * radius, y0 * radius, halfHeight);
                vertices.push(x1 * radius, y1 * radius, -halfHeight);
                vertices.push(x1 * radius, y1 * radius, halfHeight);
                vertices.push(x0 * radius, y0 * radius, halfHeight);

                for (let j = 0; j < 6; j++) {
                    normals.push(x0, y0, 0);
                }
            }

            for (let i = 0; i < slices; i++) {
                const angle0 = (i / slices) * Math.PI * 2;
                const angle1 = ((i + 1) / slices) * Math.PI * 2;
                const x0 = Math.cos(angle0);
                const y0 = Math.sin(angle0);
                const x1 = Math.cos(angle1);
                const y1 = Math.sin(angle1);

                vertices.push(0, 0, halfHeight);
                vertices.push(x1 * radius, y1 * radius, halfHeight);
                vertices.push(x0 * radius, y0 * radius, halfHeight);

                vertices.push(0, 0, -halfHeight);
                vertices.push(x0 * radius, y0 * radius, -halfHeight);
                vertices.push(x1 * radius, y1 * radius, -halfHeight);

                for (let j = 0; j < 3; j++) {
                    normals.push(0, 0, 1);
                    normals.push(0, 0, -1);
                }
            }

            return { vertices, normals };
        }

        function createConeGeometry(radius, height, slices) {
            const vertices = [];
            const normals = [];
            
            for (let i = 0; i < slices; i++) {
                const angle0 = (i / slices) * Math.PI * 2;
                const angle1 = ((i + 1) / slices) * Math.PI * 2;
                const x0 = Math.cos(angle0);
                const y0 = Math.sin(angle0);
                const x1 = Math.cos(angle1);
                const y1 = Math.sin(angle1);

                vertices.push(0, 0, height / 2);
                vertices.push(x0 * radius, y0 * radius, -height / 2);
                vertices.push(x1 * radius, y1 * radius, -height / 2);

                const slope = Math.sqrt(radius * radius + height * height);
                const nx = x0 * height / slope;
                const ny = y0 * height / slope;
                const nz = radius / slope;
                
                for (let j = 0; j < 3; j++) {
                    normals.push(nx, ny, nz);
                }
            }

            for (let i = 0; i < slices; i++) {
                const angle0 = (i / slices) * Math.PI * 2;
                const angle1 = ((i + 1) / slices) * Math.PI * 2;
                const x0 = Math.cos(angle0);
                const y0 = Math.sin(angle0);
                const x1 = Math.cos(angle1);
                const y1 = Math.sin(angle1);

                vertices.push(x0 * radius, y0 * radius, -height / 2);
                vertices.push(0, 0, -height / 2);
                vertices.push(x1 * radius, y1 * radius, -height / 2);

                for (let j = 0; j < 3; j++) {
                    normals.push(0, 0, -1);
                }
            }

            return { vertices, normals };
        }

        function createTetrahedronGeometry() {
            const vertices = [];
            const normals = [];
            const a = 1 / Math.sqrt(2);
            
            const v = [[0, 0, 1], [-a, -a, 0], [a, -a, 0], [0, a, 0]];
            const faces = [[0,1,2], [0,2,3], [0,3,1], [1,3,2]];
            
            for (const face of faces) {
                const n0 = v[face[0]], n1 = v[face[1]], n2 = v[face[2]];
                const e1 = [n1[0]-n0[0], n1[1]-n0[1], n1[2]-n0[2]];
                const e2 = [n2[0]-n0[0], n2[1]-n0[1], n2[2]-n0[2]];
                const nx = e1[1]*e2[2] - e1[2]*e2[1];
                const ny = e1[2]*e2[0] - e1[0]*e2[2];
                const nz = e1[0]*e2[1] - e1[1]*e2[0];
                const len = Math.sqrt(nx*nx + ny*ny + nz*nz);
                
                vertices.push(v[face[0]][0], v[face[0]][1], v[face[0]][2]);
                vertices.push(v[face[1]][0], v[face[1]][1], v[face[1]][2]);
                vertices.push(v[face[2]][0], v[face[2]][1], v[face[2]][2]);
                
                for (let i = 0; i < 3; i++) {
                    normals.push(nx/len, ny/len, nz/len);
                }
            }

            return { vertices, normals };
        }

        function createOctahedronGeometry() {
            const vertices = [];
            const normals = [];
            
            const v = [[0, 0, 1], [0, 0, -1], [1, 0, 0], [-1, 0, 0], [0, 1, 0], [0, -1, 0]];
            const faces = [
                [0,2,4], [0,4,3], [0,3,5], [0,5,2],
                [1,4,2], [1,3,4], [1,5,3], [1,2,5]
            ];
            
            for (const face of faces) {
                const n0 = v[face[0]], n1 = v[face[1]], n2 = v[face[2]];
                const e1 = [n1[0]-n0[0], n1[1]-n0[1], n1[2]-n0[2]];
                const e2 = [n2[0]-n0[0], n2[1]-n0[1], n2[2]-n0[2]];
                const nx = e1[1]*e2[2] - e1[2]*e2[1];
                const ny = e1[2]*e2[0] - e1[0]*e2[2];
                const nz = e1[0]*e2[1] - e1[1]*e2[0];
                const len = Math.sqrt(nx*nx + ny*ny + nz*nz);
                
                vertices.push(v[face[0]][0], v[face[0]][1], v[face[0]][2]);
                vertices.push(v[face[1]][0], v[face[1]][1], v[face[1]][2]);
                vertices.push(v[face[2]][0], v[face[2]][1], v[face[2]][2]);
                
                for (let i = 0; i < 3; i++) {
                    normals.push(nx/len, ny/len, nz/len);
                }
            }

            return { vertices, normals };
        }

        function createGeometryByName(name) {
            name = name.trim().toLowerCase();
            switch (name) {
                case '立方体':
                case 'cube':
                case 'box':
                    return createBoxGeometry(1, 1, 1);
                case '球体':
                case 'sphere':
                    return createSphereGeometry(0.7, 32, 16);
                case '圆柱体':
                case 'cylinder':
                    return createCylinderGeometry(0.5, 1.5, 32);
                case '圆锥体':
                case 'cone':
                    return createConeGeometry(0.5, 1.5, 32);
                case '四面体':
                case 'tetrahedron':
                    return createTetrahedronGeometry();
                case '八面体':
                case 'octahedron':
                    return createOctahedronGeometry();
                default:
                    return null;
            }
        }

        function createMockTraeGeo() {
            let nextHandle = 1;
            const entities = {};

            return {
                createShape: (name) => {
                    const geom = createGeometryByName(name);
                    if (!geom) return null;
                    const handle = nextHandle++;
                    entities[handle] = { name, geom };
                    return handle;
                },
                createBox: (min, max) => {
                    const handle = nextHandle++;
                    entities[handle] = { name: 'box', geom: createBoxGeometry(1, 1, 1) };
                    return handle;
                },
                booleanUnion: (h1, h2) => {
                    const b1 = entities[h1], b2 = entities[h2];
                    const handle = nextHandle++;
                    entities[handle] = { name: 'union', geom: createBoxGeometry(1.2, 1.2, 1.2) };
                    return handle;
                },
                generateMesh: (handle) => {
                    const e = entities[handle];
                    const geom = e.geom;
                    return {
                        vertices: new Float32Array(geom.vertices),
                        normals: new Float32Array(geom.normals),
                        numVertices: geom.vertices.length / 3,
                        numTriangles: geom.vertices.length / 9
                    };
                }
            };
        }

        function resetState() {
            meshData = null;
            window.box1 = null;
            window.box2 = null;
            document.getElementById('entities').textContent = '0';
            document.getElementById('vertices').textContent = '0';
            document.getElementById('triangles').textContent = '0';
        }

        document.getElementById('checkOllamaBtn').addEventListener('click', checkOllamaConnection);

        document.getElementById('aiGenerateBtn').addEventListener('click', async () => {
            const prompt = aiInput.value.trim();
            if (!prompt) {
                log('❌ 请输入建模需求');
                return;
            }

            const btn = document.getElementById('aiGenerateBtn');
            const btnText = document.getElementById('btnText');
            const btnLoading = document.getElementById('btnLoading');
            const instructionPreview = document.getElementById('instructionPreview');
            const instructionCode = document.getElementById('instructionCode');

            btn.disabled = true;
            btnText.style.display = 'none';
            btnLoading.style.display = 'inline-block';
            ollamaStatus.className = 'status-badge status-processing';
            ollamaStatus.textContent = '处理中';

            try {
                addLog('🔄 正在发送请求到 Ollama...');
                const llmResponse = await sendToOllama(prompt);
                addLog('✅ Ollama 响应成功');

                addLog('🔄 正在解析建模指令...');
                const instruction = parseInstruction(llmResponse);
                
                instructionPreview.style.display = 'block';
                instructionCode.textContent = JSON.stringify(instruction, null, 2);

                addLog('🔄 正在执行建模指令...');
                meshData = executeInstruction(instruction);

                if (meshData) {
                    document.getElementById('entities').textContent = '1';
                    document.getElementById('vertices').textContent = meshData.numVertices;
                    document.getElementById('triangles').textContent = meshData.numTriangles;
                    
                    addLog('✅ 模型生成成功');
                    
                    if (!gl) initGL();
                    render();
                } else {
                    addLog('❌ 模型生成失败');
                }
            } catch (e) {
                addLog('❌ 错误: ' + e.message);
                console.error(e);
            } finally {
                btn.disabled = false;
                btnText.style.display = 'inline-block';
                btnLoading.style.display = 'none';
                checkOllamaConnection();
            }
        });

        document.getElementById('loadBtn').addEventListener('click', () => {
            resetState();
            log('🔄 正在重新加载引擎...');
            
            if (gl) {
                gl = null;
                program = null;
            }
            
            if (initGL()) {
                traeGeo = createMockTraeGeo();
                log('✅ 引擎重新加载完成');
            }
        });

        document.getElementById('createBtn').addEventListener('click', () => {
            if (!traeGeo) { 
                initGL();
                traeGeo = createMockTraeGeo();
            }
            
            const box1 = traeGeo.createBox({x:0,y:0,z:0}, {x:1,y:1,z:1});
            const box2 = traeGeo.createBox({x:0.5,y:0.5,z:0.5}, {x:1.5,y:1.5,z:1.5});
            
            document.getElementById('entities').textContent = '2';
            window.box1 = box1;
            window.box2 = box2;
            
            addLog('✅ 创建两个立方体');
        });

        document.getElementById('booleanBtn').addEventListener('click', () => {
            if (!traeGeo || !window.box1 || !window.box2) {
                log('❌ 请先创建立方体');
                return;
            }
            
            const result = traeGeo.booleanUnion(window.box1, window.box2);
            meshData = traeGeo.generateMesh(result);
            
            document.getElementById('entities').textContent = '3';
            document.getElementById('vertices').textContent = meshData.numVertices;
            document.getElementById('triangles').textContent = meshData.numTriangles;
            
            addLog('✅ 布尔并集完成: ' + meshData.numTriangles + ' 三角形');
            
            if (!gl) initGL();
            render();
        });

        document.getElementById('createShapeBtn').addEventListener('click', () => {
            const name = document.getElementById('shapeInput').value.trim();
            if (!name) {
                log('❌ 请输入几何体名称');
                return;
            }
            
            if (!traeGeo) {
                initGL();
                traeGeo = createMockTraeGeo();
            }
            
            const handle = traeGeo.createShape(name);
            if (!handle) {
                log('❌ 不支持的几何体: ' + name);
                return;
            }
            
            meshData = traeGeo.generateMesh(handle);
            
            document.getElementById('entities').textContent = '1';
            document.getElementById('vertices').textContent = meshData.numVertices;
            document.getElementById('triangles').textContent = meshData.numTriangles;
            
            addLog('✅ 创建几何体 "' + name + '": ' + meshData.numTriangles + ' 三角形');
            
            render();
        });

        document.getElementById('shapeInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('createShapeBtn').click();
            }
        });

        aiInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                document.getElementById('aiGenerateBtn').click();
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            if (initGL()) {
                traeGeo = createMockTraeGeo();
                
                const handle = traeGeo.createShape('立方体');
                meshData = traeGeo.generateMesh(handle);
                
                document.getElementById('entities').textContent = '1';
                document.getElementById('vertices').textContent = meshData.numVertices;
                document.getElementById('triangles').textContent = meshData.numTriangles;
                
                render();
                log('✅ TraeGeo AI 引擎已就绪');
                
                setTimeout(checkOllamaConnection, 1000);
            }
        });
    </script>
