<style>
/* ===== 全局样式 ===== */
:root {
  --bg-base: #0b1220;
  --bg-elevated: #131c2e;
  --bg-card: #182338;
  --bg-input: #0f1828;
  --border: #233148;

  --warning-soft: rgba(245, 165, 36, 0.12);
  --danger: #f5544e;
  --info: #4a9eff;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.25);
  --shadow-glow: 0 0 0 1px var(--accent-soft), 0 4px 24px rgba(61, 220, 151, 0.08);
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;

}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #000; color: var(--text-primary); font-family: var(--font-sans); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; overflow: hidden; display: flex; justify-content: center; }
#app { height: 100%; width: 100%; max-width: 430px; background: var(--bg-base); position: relative; box-shadow: 0 0 60px rgba(0,0,0,0.5); }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea { font-family: inherit; border: none; outline: none; background: none; color: inherit; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* 工具类 */

.flex-col { display: flex; flex-direction: column; }
.flex-center { display: flex; align-items: center; justify-content: center; }
.flex-between { display: flex; align-items: center; justify-content: space-between; }
.gap-4 { gap: 4px; } .gap-8 { gap: 8px; } .gap-12 { gap: 12px; } .gap-16 { gap: 16px; }
.mono { font-family: var(--font-mono); }
.gradient-text { background: linear-gradient(135deg, var(--accent) 0%, #6ee7b7 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 var(--accent-glow); animation: pulse 1.8s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--accent-glow); } 70% { box-shadow: 0 0 0 8px rgba(61, 220, 151, 0); } 100% { box-shadow: 0 0 0 0 rgba(61, 220, 151, 0); } }

.loading-bar { position: relative; overflow: hidden; background: var(--bg-input); }
.loading-bar::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, var(--accent), transparent); animation: loading-slide 1.4s infinite; }
@keyframes loading-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

/* ===== App 样式 ===== */
.app-shell { display: flex; flex-direction: column; height: 100%; background: var(--bg-base); }
.app-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background: var(--bg-elevated); border-bottom: 1px solid var(--border); flex-shrink: 0; height: 60px; }

.tab-item.active .tab-icon { filter: drop-shadow(0 0 6px var(--accent-glow)); }
.tab-label { font-size: 11px; font-weight: 500; }

}

/* ===== InitScreen 样式 ===== */
.init-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; overflow-y: auto; background: radial-gradient(ellipse at top, rgba(61, 220, 151, 0.06), transparent 50%), var(--bg-base); }
.init-hero { text-align: center; margin-bottom: 32px; }

.hero-title { font-size: 36px; font-weight: 800; letter-spacing: 2px; }
.hero-sub { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
.init-card { width: 100%; max-width: 480px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-card); }
.stage-list { display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }
.stage-item { display: flex; align-items: flex-start; gap: 12px; opacity: 0.5; transition: opacity 0.2s; }
.stage-item.done, .stage-item.active { opacity: 1; }
.stage-icon { flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--bg-card); border: 1px solid var(--border); }
.stage-item.done .stage-icon { background: var(--accent-soft); border-color: var(--accent); }
.stage-item.active .stage-icon { background: var(--accent-soft); border-color: var(--accent); }
.stage-pending { font-size: 12px; color: var(--text-muted); font-weight: 600; }

.stage-name { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 2px; }
.stage-desc { font-size: 12px; color: var(--text-secondary); }
.progress-bar-wrap { margin-top: 4px; }

.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #6ee7b7); border-radius: 2px; transition: width 0.3s ease; box-shadow: 0 0 8px var(--accent-glow); }
.progress-text { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: var(--text-secondary); }

.tip-row { display: flex; font-size: 12px; }

.error-icon { width: 48px; height: 48px; border-radius: 50%; background: rgba(245, 84, 78, 0.15); color: var(--danger); font-size: 28px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; border: 2px solid var(--danger); }
.error-title { font-size: 16px; font-weight: 600; color: var(--text-primary); margin-bottom: 8px; }

/* ===== ChatView 样式 ===== */
.chat-view { display: flex; flex-direction: column; height: 100%; }

.home-btn { display: flex; align-items: center; gap: 5px; padding: 6px 12px; margin: 10px 20px 0; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 12px; color: var(--text-secondary); transition: all 0.15s; align-self: flex-start; }
.home-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.message { display: flex; gap: 12px; margin-bottom: 20px; max-width: 800px; margin-left: auto; margin-right: auto; }
.msg-avatar { flex-shrink: 0; width: 32px; height: 32px; border-radius: 8px; background: var(--bg-card); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--text-secondary); }
.message-user .msg-avatar { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.message-assistant .msg-avatar { background: var(--accent-soft); color: var(--accent); }
.msg-body { flex: 1; min-width: 0; }
.msg-content { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px; font-size: 14px; line-height: 1.6; word-wrap: break-word; }
.message-user .msg-content { background: var(--accent-soft); border-color: var(--accent); color: var(--text-primary); }
.msg-text { color: var(--text-primary); }

.msg-text .md-inline { background: var(--bg-input); padding: 1px 5px; border-radius: 3px; font-family: var(--font-mono); font-size: 12px; color: var(--warning); }
.msg-text .md-codeblock { background: var(--bg-input); padding: 10px 12px; border-radius: var(--radius-sm); font-family: var(--font-mono); font-size: 12px; overflow-x: auto; border: 1px solid var(--border); margin: 6px 0; white-space: pre-wrap; }
.msg-text ul { margin: 6px 0; padding-left: 18px; list-style: disc; }
.msg-text li { margin: 2px 0; }
.cursor { display: inline-block; width: 7px; height: 15px; background: var(--accent); vertical-align: text-bottom; margin-left: 2px; animation: blink 1s steps(2) infinite; }
@keyframes blink { to { opacity: 0; } }
.refs { margin-top: 10px; }
.refs-title { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-muted); font-weight: 600; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.ref-list { display: flex; flex-direction: column; gap: 6px; }
.ref-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; cursor: pointer; transition: border-color 0.15s; }
.ref-item:hover { border-color: var(--accent); }
.ref-head { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.ref-no { font-family: var(--font-mono); color: var(--accent); font-weight: 600; flex-shrink: 0; }
.ref-title { color: var(--text-secondary); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ref-score { font-family: var(--font-mono); color: var(--text-muted); font-size: 11px; flex-shrink: 0; }
.ref-content { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-secondary); line-height: 1.6; }
.msg-actions { display: flex; gap: 8px; margin-top: 8px; }
.action-btn { display: flex; align-items: center; gap: 4px; padding: 4px 10px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; font-size: 11px; color: var(--text-secondary); transition: all 0.15s; }
.action-btn:hover { border-color: var(--accent); color: var(--accent); }
.action-btn.active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.loading-content { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
.msg-loading-wrap { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.msg-loading-top { display: flex; align-items: center; gap: 10px; }
.msg-progress { width: 100%; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.msg-progress-bar { height: 100%; background: linear-gradient(90deg, var(--accent), #6ee7b7); border-radius: 2px; animation: progress-slide 1.8s ease-in-out infinite; }
@keyframes progress-slide { 0% { width: 10%; margin-left: 0; } 50% { width: 50%; margin-left: 25%; } 100% { width: 10%; margin-left: 90%; } }
.loader-dots { display: flex; gap: 3px; }
.loader-dots span { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: bounce 1.2s infinite; }
.loader-dots span:nth-child(2) { animation-delay: 0.2s; }
.loader-dots span:nth-child(3) { animation-delay: 0.4s; }

.loading-text { font-size: 13px; color: var(--text-secondary); }
.input-bar { flex-shrink: 0; padding: 12px 20px 8px; background: var(--bg-elevated); border-top: 1px solid var(--border); }
.input-wrap { display: flex; align-items: flex-end; gap: 8px; background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 8px 10px; transition: border-color 0.15s; max-width: 800px; margin: 0 auto; }
.input-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.input-hint { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; color: var(--text-muted); max-width: 800px; margin-left: auto; margin-right: auto; }

@media (min-width: 768px) {

}

/* ===== ErrorLookupView 样式 ===== */

.sop-link { color: var(--accent); font-family: var(--font-mono); }
.ask-btn { display: flex; align-items: center; gap: 6px; margin-top: 14px; padding: 8px 14px; background: var(--accent); color: var(--bg-base); border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; transition: all 0.15s; cursor: pointer; }
.ask-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px var(--accent-glow); }
.error-list { display: flex; flex-direction: column; gap: 16px; }
.error-group { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
.group-title { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--bg-card); border-bottom: 1px solid var(--border); }
.group-name { font-size: 13px; font-weight: 600; color: var(--text-primary); }

.error-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--border); text-align: left; transition: background 0.1s; cursor: pointer; background: none; color: inherit; width: 100%; font-family: inherit; text-align: left; padding: 10px 14px; }
.error-item:last-child { border-bottom: none; }

.item-code { font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--warning); background: var(--warning-soft); padding: 3px 8px; border-radius: 4px; flex-shrink: 0; min-width: 60px; text-align: center; }

function tokenize(text) {
  if (!text) return [];
  const raw = text.toLowerCase().trim().replace(/[^\u4e00-\u9fa5a-zA-Z0-9\-_]/g, ' ');
  const tokens = [];
  const cnMatches = raw.match(/[\u4e00-\u9fa5]{2,6}/g) || [];
  for (const w of cnMatches) {
    if (!STOP_WORDS.has(w)) tokens.push(w);
    if (w.length > 3) { tokens.push(w.slice(0, 2)); tokens.push(w.slice(-2)); }
    if (w.length >= 5) { tokens.push(w.slice(1, 4)); tokens.push(w.slice(2, 5)); }
  }
  const enMatches = raw.match(/[a-zA-Z0-9][\w\-]+/g) || [];
  for (const w of enMatches) { if (w.length > 1) tokens.push(w.toLowerCase()); }
  const codeMatches = raw.match(/[Ee][-]?\d{1,3}/g) || [];
  for (const c of codeMatches) { tokens.push(c.toUpperCase().replace('E-', 'E-')); }
  return [...new Set(tokens)];
}

function expandSynonyms(tokens) {
  const expanded = [...tokens];
  for (const t of tokens) { const syns = SYNONYMS[t]; if (syns) expanded.push(...syns); }
  return expanded;
}

function buildSparseVector(text) {
  const vec = {};
  for (const t of tokenize(text)) vec[t] = (vec[t] || 0) + 1;
  return vec;
}

function sparseDot(a, b) {
  let score = 0;
  for (const key of Object.keys(b)) if (key in a) score += a[key] * b[key];
  return score;
}

function sparseNorm(vec) {
  let sum = 0;
  for (const v of Object.values(vec)) sum += v * v;
  return Math.sqrt(sum);
}

function sparseCosine(a, b) {
  const dot = sparseDot(a, b);
  const na = sparseNorm(a), nb = sparseNorm(b);
  if (na === 0 || nb === 0) return 0;
  return dot / (na * nb);
}

let indexReady = false, allChunks = null, chunkVectors = null;

function buildIndex(onProgress) {
  allChunks = []; chunkVectors = [];
  for (const sop of SOP_DATASET) {
    for (let i = 0; i < sop.chunks.length; i++) {
      const c = sop.chunks[i];
      const fullText = `${sop.title} ${c.title} ${c.content} ${sop.category} ${sop.docNo}`;
      const chunk = {
        id: `${sop.id}-c${i}`, sopId: sop.id, title: c.title, content: c.content,
        docNo: sop.docNo, category: sop.category, version: sop.version,
        sopTitle: sop.title, chunkIndex: i, errorCodes: sop.errorCodes || []
      };
      allChunks.push(chunk);
      chunkVectors.push(buildSparseVector(fullText));
      if (onProgress) onProgress(allChunks.length, getTotalChunkCount(), 'index');
    }
  }
  indexReady = true;
  if (onProgress) onProgress(getTotalChunkCount(), getTotalChunkCount(), 'done');
}

function getTotalChunkCount() {
  return SOP_DATASET.reduce((sum, s) => sum + s.chunks.length, 0);
}

async function search(question, topK) {
  if (topK === undefined) topK = 5;
  if (!indexReady) throw new Error('索引尚未构建');
  const qTokens = expandSynonyms(tokenize(question));
  const qVec = buildSparseVector(qTokens.join(' '));
  const scored = [];
  for (let i = 0; i < chunkVectors.length; i++) {
    const score = sparseCosine(qVec, chunkVectors[i]);
    if (score > 0) scored.push({ chunk: allChunks[i], score });
  }
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, topK).map(s => ({ ...s.chunk, score: s.score }));
}

function lookupErrorCode(code) {
  const upper = code.toUpperCase().trim();
  const normalized = upper.replace(/^E-?/, 'E-');
  const exact = ERROR_CODE_TABLE.find(e =>
    e.code === upper || e.code === normalized ||
    e.code.replace('-', '') === upper.replace('-', '')
  );
  if (exact) {
    const sop = SOP_DATASET.find(s => s.id === exact.sopRef);
    return { ...exact, sop };
  }
  return null;
}

async function answer(question, onToken, onRetrieved) {
  const docs = await search(question, 5);
  if (onRetrieved) onRetrieved(docs);
  const ans = formatAnswerFromDocs(question, docs);
  if (onToken) {
    const chars = ans.split('');
    for (let i = 0; i < chars.length; i++) {
      await new Promise(r => setTimeout(r, 15));
      onToken(chars[i], chars.slice(0, i + 1).join(''));
    }
  }
  return { answer: ans, refs: docs };
}

function formatAnswerFromDocs(question, docs) {
  if (docs.length === 0) {
    return '未在当前 SOP 库中找到与您问题直接相关的内容。建议您：\n\n' +
      '1. 尝试用更简洁的关键词提问（如"电机安装""焊接质量"）\n' +
      '2. 切换到「异常速查」Tab 输入报警代码\n' +
      '3. 咨询工艺工程师获取更专业的指导';
  }
  if (docs.length === 1 || (docs[0]?.score > 0.35)) {
    const d = docs[0];
    let ans = `根据【${d.sopTitle}｜${d.docNo}】的记录：\n\n`;
    ans += d.content;
    ans += `\n\n（参考文档编号：${d.docNo} · 版本 ${d.version}）`;
    return ans;
  }
  let ans = `以下是与"${question}"相关的 SOP 内容（已匹配 ${docs.length} 条）：\n\n`;
  for (let i = 0; i < Math.min(docs.length, 3); i++) {
    const d = docs[i];
    ans += `---\n${i + 1}. 【${d.docNo}】${d.sopTitle} - ${d.title}\n${d.content}\n(匹配度 ${(d.score * 100).toFixed(0)}%)\n\n`;
  }
  ans += '以上内容来自 SOP 库。如有疑问请咨询工艺工程师。';
  return ans;
}

// ========== Storage 收藏/历史 ==========
const FAV_KEY = 'wingquery_favorites', HIST_KEY = 'wingquery_history';

function readJSON(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch { return fallback; }
}
function writeJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}

function getFavorites() { return readJSON(FAV_KEY, []); }
function addFavorite(item) {
  const favs = getFavorites();
  if (!favs.find(f => f.question === item.question)) { favs.unshift({ ...item, favAt: Date.now() }); writeJSON(FAV_KEY, favs); }
}
function removeFavorite(question) { writeJSON(FAV_KEY, getFavorites().filter(f => f.question !== question)); }
function isFavorite(question) { return getFavorites().some(f => f.question === question); }
function getHistory() { return readJSON(HIST_KEY, []); }
function addHistory(item) { writeJSON(HIST_KEY, [{ ...item, ts: Date.now() }, ...getHistory()].slice(0, 100)); }
function clearHistory() { writeJSON(HIST_KEY, []); }

      loading.value=true; streaming.value=true; abortFlag=false;
      try {
        loadingText.value='正在检索 SOP...';
        const result=await answer(question,
          (delta,full)=>{ if(abortFlag)return; aiMsg.content=full; loadingText.value=''; scrollToBottom(); },
          (refs)=>{ aiMsg.refs=refs; loadingText.value='生成回答中...'; }
        );
        aiMsg.content=result.answer; aiMsg.refs=result.refs; aiMsg.streaming=false; aiMsg.faved=isFavorite(question);
        addHistory({question,answer:result.answer,refs:result.refs.map(r=>({docNo:r.docNo,sopTitle:r.sopTitle,title:r.title}))});
      } catch(e) {
        aiMsg.content='出错了：'+(e.message||e)+'\n\n请稍后重试，或检查浏览器控制台。'; aiMsg.streaming=false;
      } finally {
        loading.value=false; streaming.value=false; await scrollToBottom();
      }
    }

    function stop() {
      abortFlag=true;
      const last=messages.value[messages.value.length-1];
      if(last&&last.streaming){last.streaming=false;if(!last.content)last.content='（已停止生成）';}
      streaming.value=false; loading.value=false;
    }

    async function scrollToBottom(){ await nextTick(); if(messagesEl.value){ messagesEl.value.scrollTop=messagesEl.value.scrollHeight; }}
    function autoResize(){ const el=inputEl.value; if(!el)return; el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,120)+'px'; }
    function resetInputHeight(){ if(inputEl.value) inputEl.value.style.height='auto'; }
    function newline(){ input.value+='\n'; autoResize(); }
    function toggleRefExpand(msgId,idx){ const k=msgId+'-'+idx; if(expandedRefs.has(k))expandedRefs.delete(k); else expandedRefs.add(k); }

    async function copyText(text){
      try{ await navigator.clipboard.writeText(text); const last=messages.value[messages.value.length-1]; if(last){last.copied=true;setTimeout(()=>{last.copied=false},1500);} }catch{}
    }

    function toggleFav(msg){
      if(msg.faved){
        const q=messages.value.find((m,i)=>m.role==='user'&&messages.value.indexOf(m)===messages.value.indexOf(msg)-1);
        removeFavorite(q?.content||''); msg.faved=false;
      } else{
        const q=messages.value.find((m,i)=>m.role==='user'&&messages.value.indexOf(m)===messages.value.indexOf(msg)-1);
        if(q){ addFavorite({question:q.content,answer:msg.content,refs:msg.refs?.map(r=>({docNo:r.docNo,sopTitle:r.sopTitle,title:r.title}))}); msg.faved=true; }
      }
    }

    return { suggestions,messages,input,loading,streaming,loadingText,messagesEl,inputEl,expandedRefs,goHome,formatViews,renderMarkdown,send,ask,stop,scrollToBottom,autoResize,resetInputHeight,newline,toggleRefExpand,copyText,toggleFav };
  }
});

// ========== ErrorLookupView 组件 ==========
app.component('error-lookup-view', {
  emits:['ask'],
  template: `
<div class="error-view">
  <div class="error-header" v-show="!selected">
    <h2 class="view-title">异常代码速查</h2>
    <p class="view-desc">输入或选择报警代码，快速定位原因与处置方案</p>
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M21 21 L16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input v-model="query" class="search-input" placeholder="输入代码（如 E-101）或关键词（如 电机、过热）"/>
      <button v-if="query" class="_clear-btn" @click="query=''"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M6 6 L18 18 M18 6 L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
  </div>

  <div class="error-scroll">
  <div v-if="selected" class="detail-card">
    <button class="detail-close" @click="selected=null">&times;</button>
    <div class="detail-head">
      <span class="detail-code">{{ selected.code }}</span>
      <span class="detail-system">{{ selected.system }}</span>
      <span class="detail-desc">{{ selected.desc }}</span>
    </div>
    <div class="detail-body">
      <div class="detail-row"><div class="detail-label">可能原因</div><div class="detail-value">{{ selected.cause }}</div></div>
      <div class="detail-row"><div class="detail-label">处置方式</div><div class="detail-value">{{ selected.action }}</div></div>
      <div v-if="selected.sop" class="detail-row"><div class="detail-label">参考 SOP</div><div class="detail-value"><span class="sop-link">{{ selected.sop.docNo }} · {{ selected.sop.title }}</span></div></div>
    </div>
    <button class="ask-btn" @click="$emit('ask',selected.desc+'（'+selected.code+'）如何处理？')">
      <svg viewBox="0 0 24 24" width="14" height="14"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" fill="currentColor"/></svg>
      问翼问详细处置流程
    </button>
  </div>

  <div class="error-list">
    <div v-for="group in groupedFiltered" :key="group.system" class="error-group">
      <div class="group-title"><span class="group-name">{{ group.system }}</span><span class="group-count">{{ group.items.length }} 项</span></div>
      <div class="group-items">
        <button v-for="item in group.items" :key="item.code" class="error-item" :class="{active:selected?.code===item.code}" @click="selected=item">
          <span class="item-code">{{ item.code }}</span><span class="item-desc">{{ item.desc }}</span>
        </button>
      </div>
    </div>
    <div v-if="groupedFiltered.length===0" class="_empty">未找到匹配的异常代码</div>
  </div>
  </div>
</div>`,
  setup(_, { emit }) {
    const query=ref(''), selected=ref(null);
    const enrichedTable=computed(()=>ERROR_CODE_TABLE.map(e=>({...e,sop:SOP_DATASET.find(s=>s.id===e.sopRef)})));
    const filtered=computed(()=>{
      const q=query.value.trim().toLowerCase();
      if(!q) return enrichedTable.value;
      return enrichedTable.value.filter(e=>e.code.toLowerCase().includes(q)||e.desc.toLowerCase().includes(q)||e.cause.toLowerCase().includes(q)||e.system.toLowerCase().includes(q));
    });
    const groupedFiltered=computed(()=>{
      const map=new Map();
      for(const item of filtered.value){if(!map.has(item.system))map.set(item.system,[]);map.get(item.system).push(item);}
      return Array.from(map.entries()).map(([system,items])=>({system,items}));
    });
    return { query,selected,groupedFiltered };
  }
});

// ========== FavoritesView 组件 ==========
app.component('favorites-view', {
  emits:['pick'],
  template: `
<div class="fav-view">
  <div class="fav-header">
    <div class="tabs">
      <button class="_fav-tab" :class="{active:sub==='fav'}" @click="sub='fav'">收藏 ({{ favorites.length }})</button>
      <button class="_fav-tab" :class="{active:sub==='hist'}" @click="sub='hist'">历史 ({{ history.length }})</button>
    </div>
    <button v-if="sub==='hist'&&history.length" class="_fav-clear-btn" @click="clearHist">清空</button>
  </div>
  <div v-if="sub==='fav'" class="_list">
    <div v-if="favorites.length===0" class="_empty-state">
      <svg viewBox="0 0 24 24" width="48" height="48" class="_empty-icon"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      <div class="_empty-title">还没有收藏</div><div class="_empty-desc">在问答界面遇到有用的回答，点收藏按钮即可保存</div>
    </div>
    <div v-for="(fav,i) in favorites" :key="i" class="card">
      <div class="card-q" @click="$emit('pick',fav.question)"><svg viewBox="0 0 24 24" width="13" height="13" class="card-q-icon"><path d="M9 12 L11 14 L15 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>{{ fav.question }}</div>
      <div class="card-a">{{ truncate(fav.answer,120) }}</div>
      <div v-if="fav.refs?.length" class="card-refs"><span v-for="r in fav.refs.slice(0,3)" :key="r.docNo" class="card-ref">{{ r.docNo }}</span></div>
      <div class="card-foot"><span class="card-time">{{ formatTime(fav.favAt) }}</span><button class="card-del" @click="removeFav(fav.question)">移除</button></div>
    </div>
  </div>
  <div v-else class="_list">
    <div v-if="history.length===0" class="_empty-state">
      <svg viewBox="0 0 24 24" width="48" height="48" class="_empty-icon"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 7 L12 12 L15 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <div class="_empty-title">还没有问答记录</div><div class="_empty-desc">去问答界面提个问题试试</div>
    </div>
    <div v-for="(h,i) in history" :key="i" class="hist-item" @click="$emit('pick',h.question)"><div class="hist-q">{{ h.question }}</div><div class="hist-meta"><span class="hist-time">{{ formatTime(h.ts) }}</span><span v-if="h.refs?.length" class="hist-refs">{{ h.refs.length }} 条引用</span></div></div>
  </div>
</div>`,
  setup(_, { emit }) {
    const sub=ref('fav'); const favorites=ref([]); const history=ref([]);
    function refresh(){ favorites.value=getFavorites(); history.value=getHistory(); }
    function removeFav(q){ removeFavorite(q); refresh(); }
    function clearHist(){ if(confirm('确定清空所有历史记录？')){ clearHistory(); refresh(); }}
    function truncate(text,n){ if(!text)return''; return text.length>n?text.slice(0,n)+'...':text; }
    function formatTime(ts){
      const d=new Date(ts),now=new Date(),diff=(now-d)/1000;
      if(diff<60)return'刚刚'; if(diff<3600)return Math.floor(diff/60)+' 分钟前'; if(diff<86400)return Math.floor(diff/3600)+' 小时前';
      const m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0'),hh=String(d.getHours()).padStart(2,'0'),mm=String(d.getMinutes()).padStart(2,'0');
      return m+'-'+day+' '+hh+':'+mm;
    }
    onMounted(refresh);
    return { sub,favorites,history,removeFav,clearHist,truncate,formatTime };
  }
});
