/* ============================================================
   SECTION 2: 数据持久化层
   ============================================================ */
var Storage = {
  KEYS: { fav: "eat_fav", bl: "eat_bl", hist: "eat_hist" },
  _get(key, def) {
    try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }
    catch(e) { return def; }
  },
  _set(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} },
  getFavorites()    { return this._get(this.KEYS.fav, []); },
  setFavorites(arr) { this._set(this.KEYS.fav, arr); },
  addFavorite(id)   { var a = this.getFavorites(); if (a.indexOf(id) === -1) a.push(id); this.setFavorites(a); },
  removeFavorite(id){ var a = this.getFavorites(); a = a.filter(function(x){return x!==id}); this.setFavorites(a); },
  isFavorite(id)    { return this.getFavorites().indexOf(id) !== -1; },
  getBlacklist()    { return this._get(this.KEYS.bl, []); },
  setBlacklist(arr) { this._set(this.KEYS.bl, arr); },
  addToBlacklist(id){ var a = this.getBlacklist(); if (a.indexOf(id) === -1) a.push(id); this.setBlacklist(a); },
  removeFromBlacklist(id){ var a = this.getBlacklist(); a = a.filter(function(x){return x!==id}); this.setBlacklist(a); },
  isBlacklisted(id) { return this.getBlacklist().indexOf(id) !== -1; },
  getHistory()      { return this._get(this.KEYS.hist, []); },
  setHistory(arr)   { this._set(this.KEYS.hist, arr); },
  addHistory(id)    {
    var h = this.getHistory();
    h.unshift({ foodId: id, date: new Date().toISOString() });
    if (h.length > 90) h = h.slice(0, 90);
    this.setHistory(h);
  },
  cleanOldHistory(days) {
    var cutoff = Date.now() - days * 86400000;
    var h = this.getHistory().filter(function(r){ return new Date(r.date).getTime() > cutoff; });
    this.setHistory(h);
  }
};
Storage.cleanOldHistory(30);

/* ============================================================
   SECTION 3: 推荐算法引擎
   ============================================================ */
var Engine = {
  filter: function(prefs, blacklist, sessionExcluded) {
    return FOOD_DB.filter(function(f) {
      if (blacklist.indexOf(f.id) !== -1) return false;
      if (sessionExcluded.indexOf(f.id) !== -1) return false;
      if (prefs.cuisine !== "any" && f.category !== prefs.cuisine) return false;
      if (prefs.dineStyle !== "any" && f.dineStyle.indexOf(prefs.dineStyle) === -1) return false;
      return true;
    });
  },
  weight: function(food, prefs, history, favorites) {
    var w = 1.0;
    if (prefs.taste !== "any") {
      if (prefs.taste === "spicy") {
        w *= food.taste.indexOf("spicy") !== -1 ? 2.0 : 0.3;
      } else if (prefs.taste === "mild") {
        w *= (food.taste.indexOf("mild") !== -1 || food.taste.indexOf("savory") !== -1) ? 2.0 : 0.2;
      }
    }
    if (prefs.budget !== "any") {
      if (food.budget === prefs.budget) { w *= 2.0; }
      else if ((prefs.budget === "cheap" && food.budget === "normal") || (prefs.budget === "normal" && food.budget === "premium")) { w *= 0.5; }
      else { w *= 0.1; }
    }
    if (prefs.weather !== "any" && food.weather.indexOf(prefs.weather) !== -1) { w *= 1.8; }
    else if (prefs.weather !== "any") { w *= 0.5; }
    var lastEaten = null;
    for (var i = 0; i < history.length; i++) {
      if (history[i].foodId === food.id) { lastEaten = history[i]; break; }
    }
    if (lastEaten) {
      var days = Math.floor((Date.now() - new Date(lastEaten.date).getTime()) / 86400000);
      if (days <= 0) w *= 0.05;
      else if (days <= 1) w *= 0.2;
      else if (days <= 3) w *= 0.5;
      else if (days <= 7) w *= 0.8;
    } else {
      w *= 1.5;
    }
    if (favorites.indexOf(food.id) !== -1) w *= 1.5;
    return Math.max(0.01, w);
  },
  pick: function(candidates) {
    var total = 0;
    for (var i = 0; i < candidates.length; i++) total += candidates[i].w;
    var r = Math.random() * total;
    for (var j = 0; j < candidates.length; j++) {
      r -= candidates[j].w;
      if (r <= 0) return candidates[j].food;
    }
    return candidates[candidates.length - 1].food;
  },
  reason: function(food, prefs, history, favorites) {
    var parts = [];
    if (prefs.taste !== "any" && food.taste.indexOf(prefs.taste) !== -1) {
      parts.push({ spicy: "正合你今天想吃辣的", mild: "清淡口味，刚好配你" }[prefs.taste] || "");
    }
    if (prefs.budget !== "any" && food.budget === prefs.budget) {
      parts.push({ cheap: "价格实惠不心疼", normal: "价格适中刚刚好", premium: "今天值得好好犒劳自己" }[prefs.budget] || "");
    }
    if (prefs.weather !== "any" && food.weather.indexOf(prefs.weather) !== -1) {
      parts.push({ hot: "天热吃这个清爽", cold: "天冷吃这个暖和", normal: "" }[prefs.weather] || "");
    }
    var lastEaten = null;
    for (var i = 0; i < history.length; i++) {
      if (history[i].foodId === food.id) { lastEaten = history[i]; break; }
    }
    if (!lastEaten) { parts.push("你最近没吃过，换换口味"); }
    else {
      var days = Math.floor((Date.now() - new Date(lastEaten.date).getTime()) / 86400000);
      if (days >= 5) parts.push(days + " 天没吃了，可以再来一次");
    }
    if (favorites.indexOf(food.id) !== -1) parts.push("你的老朋友，一直在收藏夹里");
    parts = parts.filter(function(s){ return s && s.length > 0; });
    if (parts.length === 0) parts.push(food.description);
    if (parts.length > 2) {
      parts.sort(function(){ return Math.random() - 0.5; });
      parts = parts.slice(0, 2);
    }
    return parts.join("；");
  },
  recommend: function(prefs, history, favorites, blacklist, sessionExcluded) {
    var candidates = this.filter(prefs, blacklist, sessionExcluded);
    if (candidates.length === 0) return null;
    var self = this;
    var weighted = candidates.map(function(f) {
      return { food: f, w: self.weight(f, prefs, history, favorites) };
    });
    var food = this.pick(weighted);
    var reason = this.reason(food, prefs, history, favorites);
    return { food: food, reason: reason };
  }
};

/* ============================================================
   SECTION 4: UI 控制器
   ============================================================ */
var UI = {
  prefs: { taste: "any", cuisine: "any", budget: "any", dineStyle: "any", weather: "normal" },
  sessionExcluded: [],
  currentFood: null,

  init: function() {
    this.bindPills();
    this.bindWeather();
    this.bindToggle();
    this.bindTabs();
    this.bindActions();
  },

  bindPills: function() {
    var self = this;
    var groups = document.querySelectorAll(".pills");
    for (var g = 0; g < groups.length; g++) {
      (function(group) {
        var groupName = group.getAttribute("data-group");
        var pills = group.querySelectorAll(".pill");
        for (var p = 0; p < pills.length; p++) {
          pills[p].addEventListener("click", function() {
            for (var q = 0; q < pills.length; q++) pills[q].classList.remove("active");
            this.classList.add("active");
            self.prefs[groupName] = this.getAttribute("data-value");
          });
        }
      })(groups[g]);
    }
  },

  bindWeather: function() {
    var self = this;
    var btns = document.querySelectorAll(".weather-btn");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", function() {
        for (var j = 0; j < btns.length; j++) btns[j].classList.remove("active");
        this.classList.add("active");
        self.prefs.weather = this.getAttribute("data-weather");
      });
    }
  },

  bindToggle: function() {
    var toggle = document.getElementById("prefToggle");
    var body = document.getElementById("prefBody");
    var arrow = document.getElementById("prefArrow");
    toggle.addEventListener("click", function() {
      body.classList.toggle("open");
      arrow.classList.toggle("open");
    });
  },

  bindTabs: function() {
    var self = this;
    var tabs = document.querySelectorAll(".tab-item");
    var views = { home: document.getElementById("view-home"), fav: document.getElementById("view-fav"), bl: document.getElementById("view-bl") };
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].addEventListener("click", function() {
        for (var j = 0; j < tabs.length; j++) tabs[j].classList.remove("active");
        this.classList.add("active");
        var t = this.getAttribute("data-tab");
        for (var k in views) views[k].classList.remove("active");
        views[t].classList.add("active");
        if (t === "fav") self.renderFavorites();
        if (t === "bl") self.renderBlacklist();
      });
    }
  },

  bindActions: function() {
    var self = this;
    document.getElementById("recBtn").addEventListener("click", function() { self.handleRecommend(); });
    document.getElementById("favBtn").addEventListener("click", function() { self.handleFavorite(); });
    document.getElementById("eatBtn").addEventListener("click", function() { self.handleEat(); });
    document.getElementById("blBtn").addEventListener("click", function() { self.handleBlacklist(); });
  },

  handleRecommend: function() {
    var self = this;
    var btn = document.getElementById("recBtn");
    var card = document.getElementById("resultCard");
    var empty = document.getElementById("emptyResult");
    this.sessionExcluded = [];
    card.classList.remove("show");
    empty.classList.remove("show");
    btn.classList.add("loading");
    btn.querySelector(".btn-text").textContent = "正在为你挑选...";
    setTimeout(function() {
      var result = Engine.recommend(
        self.prefs, Storage.getHistory(), Storage.getFavorites(), Storage.getBlacklist(), self.sessionExcluded
      );
      btn.classList.remove("loading");
      btn.querySelector(".btn-text").textContent = "帮我决定！";
      if (!result) {
        empty.classList.add("show");
        return;
      }
      self.currentFood = result.food;
      self.showResult(result.food, result.reason);
    }, 800);
  },

  showResult: function(food, reason) {
    var card = document.getElementById("resultCard");
    document.getElementById("resEmoji").textContent = food.emoji;
    document.getElementById("resName").textContent = food.name;
    var tagsHtml = '<span class="result-tag">' + food.categoryLabel + '</span>';
    tagsHtml += '<span class="result-tag">' + food.price + '元</span>';
    if (food.taste.length > 0) {
      var tasteMap = { spicy: "辣", mild: "清淡", savory: "咸鲜", sweet: "甜", sour: "酸" };
      var tasteStr = food.taste.map(function(t){ return tasteMap[t] || t; }).join("/");
      tagsHtml += '<span class="result-tag">' + tasteStr + '</span>';
    }
    document.getElementById("resTags").innerHTML = tagsHtml;
    document.getElementById("resReason").textContent = reason;
    this.updateFavBtn();
    card.classList.remove("show");
    void card.offsetWidth;
    card.classList.add("show");
    document.getElementById("emptyResult").classList.remove("show");
  },

  handleFavorite: function() {
    if (!this.currentFood) return;
    var id = this.currentFood.id;
    if (Storage.isFavorite(id)) {
      Storage.removeFavorite(id);
      this.toast("已取消收藏");
    } else {
      Storage.addFavorite(id);
      this.toast("已收藏 💗");
    }
    this.updateFavBtn();
  },

  updateFavBtn: function() {
    var btn = document.getElementById("favBtn");
    if (this.currentFood && Storage.isFavorite(this.currentFood.id)) {
      btn.classList.add("fav-active");
      btn.textContent = "已收藏";
    } else {
      btn.classList.remove("fav-active");
      btn.textContent = "收藏";
    }
  },

  handleEat: function() {
    if (!this.currentFood) return;
    Storage.addHistory(this.currentFood.id);
    this.toast("已记录，下次不会再优先推荐 ✅");
  },

  handleBlacklist: function() {
    if (!this.currentFood) return;
    var id = this.currentFood.id;
    var name = this.currentFood.name;
    Storage.addToBlacklist(id);
    // 如果在收藏夹里，一并移除
    if (Storage.isFavorite(id)) Storage.removeFavorite(id);
    this.toast("已将「" + name + "」加入黑名单 🚫");
    // 自动触发一次重新推荐
    var self = this;
    this.sessionExcluded.push(id);
    var btn = document.getElementById("recBtn");
    btn.classList.add("loading");
    btn.querySelector(".btn-text").textContent = "重新推荐...";
    setTimeout(function() {
      var result = Engine.recommend(
        self.prefs, Storage.getHistory(), Storage.getFavorites(), Storage.getBlacklist(), self.sessionExcluded
      );
      btn.classList.remove("loading");
      btn.querySelector(".btn-text").textContent = "帮我决定！";
      if (!result) {
        document.getElementById("resultCard").classList.remove("show");
        document.getElementById("emptyResult").classList.add("show");
        return;
      }
      self.currentFood = result.food;
      self.showResult(result.food, result.reason);
    }, 600);
  },

  renderFavorites: function() {
    var favs = Storage.getFavorites();
    var listEl = document.getElementById("favList");
    var emptyEl = document.getElementById("favEmpty");
    if (favs.length === 0) {
      listEl.innerHTML = "";
      emptyEl.style.display = "";
      return;
    }
    emptyEl.style.display = "none";
    var self = this;
    var html = "";
    for (var i = 0; i < favs.length; i++) {
      var food = this.findFood(favs[i]);
      if (!food) continue;
      html += '<div class="food-item">'
        + '<span class="fi-emoji">' + food.emoji + '</span>'
        + '<div class="fi-info"><div class="fi-name">' + food.name + '</div>'
        + '<div class="fi-meta">' + food.categoryLabel + ' · ' + food.price + '元</div></div>'
        + '<button class="fi-btn danger" data-id="' + food.id + '">取消收藏</button>'
        + '</div>';
    }
    listEl.innerHTML = html;
    var btns = listEl.querySelectorAll(".fi-btn");
    for (var j = 0; j < btns.length; j++) {
      btns[j].addEventListener("click", function() {
        Storage.removeFavorite(this.getAttribute("data-id"));
        self.toast("已取消收藏");
        self.renderFavorites();
        self.updateFavBtn();
      });
    }
  },

  renderBlacklist: function() {
    var bl = Storage.getBlacklist();
    var listEl = document.getElementById("blList");
    var emptyEl = document.getElementById("blEmpty");
    if (bl.length === 0) {
      listEl.innerHTML = "";
      emptyEl.style.display = "";
      return;
    }
    emptyEl.style.display = "none";
    var self = this;
    var html = "";
    for (var i = 0; i < bl.length; i++) {
      var food = this.findFood(bl[i]);
      if (!food) continue;
      html += '<div class="food-item">'
        + '<span class="fi-emoji">' + food.emoji + '</span>'
        + '<div class="fi-info"><div class="fi-name">' + food.name + '</div>'
        + '<div class="fi-meta">' + food.categoryLabel + '</div></div>'
        + '<button class="fi-btn" data-id="' + food.id + '">解除屏蔽</button>'
        + '</div>';
    }
    listEl.innerHTML = html;
    var btns = listEl.querySelectorAll(".fi-btn");
    for (var j = 0; j < btns.length; j++) {
      btns[j].addEventListener("click", function() {
        Storage.removeFromBlacklist(this.getAttribute("data-id"));
        self.toast("已解除屏蔽");
        self.renderBlacklist();
      });
    }
  },

  findFood: function(id) {
    for (var i = 0; i < FOOD_DB.length; i++) {
      if (FOOD_DB[i].id === id) return FOOD_DB[i];
    }
    return null;
  },

  toast: function(msg) {
    var wrap = document.getElementById("toastWrap");
    var el = document.createElement("div");
    el.className = "toast";
    el.textContent = msg;
    wrap.appendChild(el);
    setTimeout(function() {
      el.classList.add("out");
      setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 300);
    }, 1800);
  }
};

document.addEventListener("DOMContentLoaded", function() { UI.init(); });
</script>
