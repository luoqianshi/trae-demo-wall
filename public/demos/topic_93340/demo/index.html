      </div>

let currentQuestion = 0;

// ===== 页面切换 =====
function showScreen(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  const screen = document.getElementById(screenId);
  screen.classList.remove('hidden');
  screen.classList.add('fade-in');
  window.scrollTo(0, 0);
}

// ===== 开始测试 =====
function startQuiz() {
  currentQuestion = 0;
  scores = [0, 0, 0, 0, 0, 0, 0, 0];
  renderQuestion();
  showScreen('quizScreen');
}

// ===== 渲染题目 =====
function renderQuestion() {
  const q = questions[currentQuestion];
  const content = document.getElementById('questionContent');
  const progress = ((currentQuestion) / questions.length) * 100;

  document.getElementById('progressFill').style.width = progress + '%';
  document.getElementById('currentNum').textContent = currentQuestion + 1;

  content.classList.remove('question-slide');
  content.classList.add('out');

  setTimeout(() => {
    content.innerHTML = `
      <p class="question-index">QUESTION ${currentQuestion + 1}</p>
      <h2 class="question-text">${q.text}</h2>
      <div class="options">
        ${q.options.map((opt, i) => `
          <button class="option" onclick="selectOption(${i})">
            <span class="option-letter">${String.fromCharCode(65 + i)}</span>${opt.text}
          </button>
        `).join('')}
      </div>
    `;
    content.classList.remove('out');
    content.classList.add('question-slide');
  }, 250);
}

// ===== 选择选项 =====
function selectOption(optionIndex) {
  const q = questions[currentQuestion];
  const option = q.options[optionIndex];

  // 加分
  for (const [personalityId, score] of Object.entries(option.scores)) {
    scores[personalityId] += score;
  }

  // 视觉反馈
  const buttons = document.querySelectorAll('.option');
  buttons.forEach((btn, i) => {
    btn.style.pointerEvents = 'none';
    if (i === optionIndex) btn.classList.add('selected');
  });

  // 下一题或结束
  setTimeout(() => {
    if (currentQuestion < questions.length - 1) {
      currentQuestion++;
      renderQuestion();
    } else {
      showResult();
    }
  }, 400);
}

// ===== 显示结果 =====
function showResult() {
  // 找最高分
  let maxScore = -1;
  let maxIndex = 0;
  scores.forEach((s, i) => {
    if (s > maxScore) {
      maxScore = s;
      maxIndex = i;
    }
  });

  resultPersonality = personalities[maxIndex];

  // 先显示加载页
  showScreen('loadingScreen');

  // 1.5秒后显示结果
  setTimeout(() => {
    renderResult(resultPersonality);
    showScreen('resultScreen');
  }, 1500);
}

function saveShareImage() {
  const btn = document.getElementById('shareSaveBtn');
  const shareCard = document.getElementById('shareCard');
  const shareImgContainer = document.getElementById('shareImgContainer');
  const shareImg = document.getElementById('shareImg');
  const shareTips = document.getElementById('shareTips');
  const shareTip = document.getElementById('shareTip');

  // 检查 html2canvas 是否加载
  if (typeof html2canvas === 'undefined') {
    shareTip.textContent = '图片库加载中，请稍候再试...';
    // 给用户提示可以直接截图
    setTimeout(() => {
      shareTip.textContent = '也可以直接截图保存哦~';
    }, 2000);
    return;
  }

  btn.textContent = '生成中...';
  btn.disabled = true;

  html2canvas(shareCard, {
    scale: 2,
    useCORS: true,
    backgroundColor: null,
    logging: false
  }).then(canvas => {
    // 生成图片并显示
    const dataUrl = canvas.toDataURL('image/png');
    shareImg.src = dataUrl;
    shareImgContainer.classList.add('show');
    shareCard.style.display = 'none';
    shareTips.style.display = 'block';

    btn.textContent = '✅ 图片已生成，长按保存';
    shareTip.textContent = '保存后分享到朋友圈或好友';

    // 尝试自动下载（电脑端可用）
    try {
      const link = document.createElement('a');
      link.download = '我的美食人格-' + resultPersonality.name + '.png';
      link.href = dataUrl;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    } catch (e) {
      // 自动下载失败也没关系，用户可以长按保存
    }

    setTimeout(() => {
      btn.textContent = '📸 重新生成';
      btn.disabled = false;
    }, 3000);
  }).catch(err => {
    console.error('生成失败:', err);
    btn.textContent = '生成失败，直接截图也可以哦';
    shareTip.textContent = '手机可以同时按电源键+音量键截图';
    setTimeout(() => {
      btn.textContent = '📸 再试一次';
      btn.disabled = false;
    }, 3000);
  });
}

      document.getElementById('shareTips').style.display = 'none';
      document.getElementById('shareTip').textContent = '点击按钮生成分享图';
      document.getElementById('shareSaveBtn').textContent = '📸 生成分享图片';
      document.getElementById('shareSaveBtn').disabled = false;
    }, 300);
  }
}
</script>
</body>
