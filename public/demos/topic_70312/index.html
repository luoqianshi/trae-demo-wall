s 猫?",questionCn:"哪个词表示猫？",options:["cat","dog","bird","fish"],answer:"cat",hint:"猫的英文是？",explanation:"cat 是猫的意思。"},{id:"e2u3l1q4",type:"fill",question:"The ___ says meow.",questionCn:"___会喵喵叫。",answer:"cat",hint:"哪种动物喵喵叫？",explanation:"猫 cat 会喵喵叫。",acceptableAnswers:["cat","Cat","CAT"],ttsText:"The cat says meow."},{id:"e2u3l1q5",type:"flashcard",question:"Read the word aloud.",questionCn:"大声读出这个单词。",answer:"cat",hint:"猫",explanation:"cat 表示猫。",ttsText:"cat"}]},{id:"e2u3l2",unitId:"e2u3",order:2,title:"Bird and Fish",titleCn:"鸟和鱼",teachingMethod:"Direct Method 直接法",learningObjective:'认读 bird/fish，能用 "can" 描述动物能力',content:[{type:"word",text:"bird",textCn:"鸟",ttsText:"bird"},{type:"word",text:"fish",textCn:"鱼",ttsText:"fish"},{type:"sentence",text:"The bird can fly.",textCn:"鸟会飞。",ttsText:"The bird can fly."},{type:"animation",text:"Bird flying and fish swimming",textCn:"鸟飞鱼游场景",animationType:"sceneBuild",ttsText:"bird, fish"}],iDo:'家长做鸟飞动作说 "bird can fly"，做鱼游动作说 "fish can swim"。',weDo:"家长和孩子一起做动作跟读，理解 can 的含义。",youDo:"孩子独立做动作并说出句子。",parentTips:'用公园的鸟和鱼缸里的鱼教学，让孩子通过观察真实动物学习。强调 can 表示"能、会"。',practiceQuestions:[{id:"e2u3l2q1",type:"choice",question:"Which animal can fly?",questionCn:"哪种动物会飞？",options:["bird","fish","cat","dog"],answer:"bird",hint:"会飞的动物。",explanation:"鸟 bird 会飞。",ttsText:"Which animal can fly?"},{id:"e2u3l2q2",type:"choice",question:"Which animal lives in water?",questionCn:"哪种动物住在水里？",options:["fish","bird","cat","dog"],answer:"fish",hint:"水里的动物。",explanation:"鱼 fish 住在水里。"},{id:"e2u3l2q3",type:"choice",question:"Which word means 鱼?",questionCn:"哪个词表示鱼？",options:["fish","bird","cat","dog"],answer:"fish",hint:"鱼的英文是？",explanation:"fish 是鱼的意思。"},{id:"e2u3l2q4",type:"fill",question:"The ___ can fly.",questionCn:"___会飞。",answer:"bird",hint:"哪种动物会飞？",explanation:"鸟 bird 会飞。",acceptableAnswers:["bird","Bird","BIRD"],ttsText:"The bird can fly."},{id:"e2u3l2q5",type:"flashcard",question:"Read the word aloud.",questionCn:"大声读出这个单词。",answer:"bird",hint:"鸟",expla  moo.",textCn:"牛说哞。",ttsText:"The cow says moo."},{type:"animation",text:"Farm animals scene",textCn:"农场动物场景",animationType:"sceneBuild",ttsText:"pig, cow"}],iDo:'家长模仿牛叫声 "moo" 说 "cow"，模仿猪叫声 "oink" 说 "pig"。',weDo:"家长和孩子一起模仿农场动物叫声，跟读单词。",youDo:"孩子独立模仿叫声并说出单词。",parentTips:"用农场动物图片教学，让孩子了解不同动物的叫声。可以联系绘本《Old MacDonald Had a Farm》学习。",practiceQuestions:[{id:"e2u3l4q1",type:"choice",question:"Which animal says moo?",questionCn:"哪种动物哞哞叫？",options:["cow","pig","cat","dog"],answer:"cow",hint:"哞哞叫的动物。",explanation:"牛 cow 会哞哞叫 moo。",ttsText:"Which animal says moo?"},{id:"e2u3l4q2",type:"choice",question:"Which animal says oink?",questionCn:"哪种动物哼哼叫？",options:["pig","cow","bird","fish"],answer:"pig",hint:"哼哼叫的动物。",explanation:"猪 pig 会哼哼叫 oink。",ttsText:"Which animal says oink?"},{id:"e2u3l4q3",type:"choice",question:"Which word means 牛?",questionCn:"哪个词表示牛？",options:["cow","pig","cat","dog"],answer:"cow",hint:"牛的英文是？",explanation:"cow 是牛的意思。"},{id:"e2u3l4q4",type:"fill",question:"The ___ says moo.",questionCn:"___会哞哞叫。",answer:"cow",hint:"哪种动物哞哞叫？",explanation:"牛 cow 会哞哞叫。",acceptableAnswers:["cow","Cow","COW"],ttsText:"The cow says moo."},{id:"e2u3l4q5",type:"flashcard",question:"Read the word aloud.",questionCn:"大声读出这个单词。",answer:"pig",hint:"猪",explanation:"pig 表示猪。",ttsText:"pig"}]},{id:"e2u3l5",unitId:"e2u3",order:5,title:"Zoo Animals",titleCn:"动物园的动物",teachingMethod:"Situational Method 情景法",learningObjective:'综合运用动物词汇，能用 "I see animals at the zoo." 表达',content:[{type:"sentence",text:"I see animals at the zoo.",textCn:"我在动物园看到动物。",ttsText:"I see animals at the zoo."},{type:"sentence",text:"The zoo has many animals.",textCn:"动物园有很多动物。",ttsText:"The zoo has many animals."},{type:"animation",text:"Zoo animals scene build",textCn:"动物园场景构建",animationType:"sceneBuild",ttsText:"I see animals at the zoo."},{type:"tip",text:"Visit the zoo to practice animal words.",textCn:"去动物园练习动物单词。"}],iDo:'家长用动物园图片示范，说 "I see animals at the zoo." 并指认各种动物。',weDo:"家长和孩子一起看动物园图片，说出认识的动物单词。",youDo:'孩子独立说出 "I see animals at the zoo." 并指认动物。',parentTips:"周末带孩子去动物园，用英语指认动物，让学习融入生活。可以拍照后回家复习。",practiceQuestions:[{id:"e2u3l5q1",type:"choice",question:"Where can you see many animals?",questionCn:"在哪里能看到很多动物？",options:["zoo","home","school","park"],answer:"zoo",hint:"看动物的地方。",explanation:"动物园 zoo 能看到很多动物。",ttsText:"Where can you see many animals?"},{id:"e2u3l5q2",type:"choice",question:"Which is an animal?",questionCn:"哪个是动物？",options:["cat","red","blue","family"],answer:"cat",hint:"找出动物。",explanation:"cat（猫）是动物。"},{id:"e2u3l5q3",type:"choice",question:"I see ___ at the zoo.",questionCn:"我在动物园看到___。",options:["animals","colors","families","babies"],answer:"animals",hint:"动物园里有什么？",explanation:"动物园里有动物 animals。",ttsText:"I see animals at the zoo."},{id:"e2u3l5q4",type:"fill",question:"I see ___ at the zoo.",questionCn:"我在动物园看到___。",answer:"animals",hint:"动物园里的东西。",explanation:"动物园里有动物 animals。",acceptableAnswers:["animals","Animals","ANIMALS"],ttsText:"I see animals at the zoo."},{id:"e2u3l5q5",type:"flashcard",question:"Read the word aloud.",questionCn:"大声读出这个单词。",answer:"animal",hint:"动物",explanation:"animal 表示动物。",ttsText:"animal"}]}]}],hy=[{id:"e3u1",grade:3,order:1,title:"Fruits",titleCn:"水果",lessons:[{id:"e3u1l1",unitId:"e3u1",order:1,title:"Apple and Banana",titleCn:"苹果和香蕉",teachingMethod:"直接法 Direct Method",learningObjective:"认识 apple 和 banana，能用 This is a/an... 句型介绍水果",content:[{type:"word",text:"apple",textCn:"苹果",ttsText:"apple"},{type:"word",text:"banana",textCn:"香蕉",ttsText:"banana"},{type:"animation",text:"This is an apple.",textCn:"这是一个苹果。",animationType:"cardReveal",ttsText:"This is an apple."},{type:"animation",text:"This is a banana.",textCn:"这是一根香蕉。",animationType:"cardReveal",ttsText:"This is a banana."}],iDo:'家长拿起苹果说 "This is an apple."，慢速清晰示范，让孩子听清每个音节',weDo:'家长和孩子一起指物说单词："apple, apple, 苹果"，重复 3 次',youDo:"孩子独立指认桌上水果说出对应英语单词和句子",parentTips:"准备真实水果作为教具，让孩子摸、闻、说，多感官记忆效果更好。注意 an apple（元音开头用 an），a banana（辅音开头用 a）。",practiceQuestions:[{id:"e3u1l1q1",type:"choice",question:"Which one is an apple?",questionCn:"哪一个是苹果？",options:["banana","apple","orange","dog"],answer:"apple",hint:"红色或绿色的圆水果",explanation:"apple 是苹果，红色或绿色圆形水果。banana 是香蕉，长条黄色。",ttsText:"Which one is an apple?"},{id:"e3u1l1q2",type:"choice",question:"Which one is a banana?",questionCn:"哪一个是香蕉？",options:["banana","apple","cat","grape"],answer:"banana",hint:"长条黄色水果",explanation:"banana 是香蕉，长条弯曲黄色水果。",ttsText:"Which one is a banana?"},{id:"e3u1l1q3",type:"choice",question:"Choose the correct sentence.",questionCn:"选择正确的句子。",options:["This is a apple.","This is an apple.","This is the apple.","This apple is."],answer:"This is an apple.",hint:"apple 元音开头，用 an",explanation:"apple 以元音音素开头，前面用 an，不用 a。",ttsText:"Choose the correct sentence."},{id:"e3u1l1q4",type:"fill",question:"This is a ___. (香蕉)",questionCn:"这是一根___。",answer:"banana",acceptableAnswers:["banana","Banana"],hint:"长条黄色水果",explanation:"banana 香蕉，注意拼写 b-a-n-a-n-a。",ttsText:"This is a banana."},{id:"e3u1l1q5",type:"flashcard",question:"Read the word: apple",questionCn:"朗读单词：apple",answer:"apple",hint:"苹果，元音开头",explanation:"apple 苹果，重音在第一音节 AP-ple。",ttsText:"apple"}]},{id:"e3u1l2",unitId:"e3u1",order:2,title:"Orange and Grape",titleCn:"橘子和葡萄",teachingMethod:"情景法 Situational Method",learningObjective:"认识 orange 和 grape，能用 What is this? It is... 句型提问回答",content:[{type:"word",text:"orange",textCn:"橘子",ttsText:"orange"},{type:"word",text:"grape",textCn:"葡萄",ttsText:"grape"},{type:"sentence",text:"What is this?",textCn:"这是什么？",ttsText:"What is this?"},{type:"animation",text:"It is an orange.",textCn:"它是一个橘子。",animationType:"cardReveal",ttsText:"It is an orange."}],iDo:'家长指橘子问 "What is this?"，自己回答 "It is an orange."',weDo:"家长问，孩子答；孩子问，家长答，互换角色",youDo:"孩子独立完成问答：What is this? It is a grape.",parentTips:"用真实橘子和葡萄让孩子观察颜色、形状。grape 通常用复数 grapes，本课先学单数。",practiceQuestions:[{id:"e3u1l2q1",type:"choice",question:"What is this? (橘子)",questionCn:"这是什么？（橘子）",options:["It is an orange.","It is a grape.","It is an apple.","It is a banana."],answer:"It is an orange.",hint:"橙色圆水果",explanation:"orange 橘子，橙色，圆形。回答时用 It is... 句型。",ttsText:"What is this?"},{id:"e3u1l2q2",type:"choice",question:"What is this? (葡萄)",questionCn:"这是什么？（葡萄）",options:["It is an orange.","It is a grape.","It is a banana.","It is an apple."],answer:"It is a grape.",hint:"紫色或绿色小圆果",explanation:"grape 葡萄，紫色或绿色，成串生长。",ttsText:"What is this?"},{id:"e3u1l2q3",type:"choice",question:"Which is orange color?",questionCn:"哪个是橙色的？",options:["grape","banana","orange","apple"],answer:"orange",hint:"颜色和水果同名",explanation:"orange 既是橘子也是橙色，一语双关。",ttsText:"Which is orange color?"},{id:"e3u1l2q4",type:"fill",question:"It is a ___. (葡萄)",questionCn:"它是一颗___。",answer:"grape",acceptableAnswers:["grape","Grape"],hint:"紫色小圆果",explanation:"grape 葡萄，拼写 g-r-a-p-e。",ttsText:"It is a grape."},{id:"e3u1l2q5",type:"flashcard",question:"Read the word: orange",questionCn:"朗读单词：orange",answer:"orange",hint:"橘子和橙色",explanation:"orange 既是橘子也是橙色，重音在第一音节 OR-ange。",ttsText:"orange"}]},{id:"e3u1l3",unitId:"e3u1",order:3,title:"Watermelon",titleCn:"西瓜",teachingMethod:"交际法 Communicative Method",learningObjective:"认识 watermelon，能用 Is this a...? Yes/No 提问回答",content:[{type:"word",text:"watermelon",textCn:"西瓜",ttsText:"watermelon"},{type:"word",text:"melon",textCn:"瓜",ttsText:"melon"},{type:"sentence",text:"Is this a watermelon?",textCn:"这是一个西瓜吗？",ttsText:"Is this a watermelon?"},{type:"animation",text:"Yes, it is.",textCn:"是的，它是。",animationType:"dialoguePlay",speaker:"child",ttsText:"Yes, it is."}],iDo:'家长拿西瓜问 "Is this a watermelon?"，回答 "Yes, it is."',weDo:"家长用不同水果提问，孩子用 Yes/No 回答",youDo:'孩子独立提问 "Is this a...?"，家长回答',parentTips:"watermelon 是复合词 water+melon，可拆开教孩子记忆。西瓜切开时让孩子描述颜色：red, green, black（籽）。",practiceQuestions:[{id:"e3u1l3q1",type:"choice",question:"Is this a watermelon? (是)",questionCn:"这是一个西瓜吗？（是）",options:["Yes, it is.","No, it is not.","Yes, I am.","No, this is."],answer:"Yes, it is.",hint:"肯定回答",explanation:"Is this...? 的肯定回答是 Yes, it is. Cn:"苹果味道如何？（好吃）",options:["Yummy!","Yuck!","Bad!","No!"],answer:"Yummy!",hint:"表示美味",explanation:"Yummy! 表示好吃美味。Yuck! 表示难吃。",ttsText:"Yummy!"},{id:"e3u1l5q2",type:"choice",question:"Let's ___ fruits.",questionCn:"我们___水果吧。",options:["share","shares","sharing","shared"],answer:"share",hint:"Let's 后接动词原形",explanation:"Let's = Let us，后接动词原形 share 分享。",ttsText:"Let us share fruits."},{id:"e3u1l5q3",type:"choice",question:"Have an apple, please. - ___",questionCn:"请吃个苹果。- ___",options:["Thank you!","No, thanks.","Sorry.","Goodbye."],answer:"Thank you!",hint:"接受邀请要道谢",explanation:"接受别人给的东西要说 Thank you! 表示感谢。",ttsText:"Thank you!"},{id:"e3u1l5q4",type:"fill",question:"Let's ___ fruits! (分享)",questionCn:"我们___水果吧！",answer:"share",acceptableAnswers:["share","Share"],hint:"动词原形，分享",explanation:"share 分享，Let's 后接动词原形。",ttsText:"Let us share fruits!"},{id:"e3u1l5q5",type:"flashcard",question:"Read the word: yummy",questionCn:"朗读单词：yummy",answer:"yummy",hint:"美味的",explanation:"yummy 美味的，儿童常用口语词，双音节 yum-my。",ttsText:"yummy"}]}]},{id:"e3u2",grade:3,order:2,title:"Body Parts",titleCn:"身体部位",lessons:[{id:"e3u2l1",unitId:"e3u2",order:1,title:"Head and Face",titleCn:"头和脸",teachingMethod:"TPR 全身反应法",learningObjective:"认识 head, face, hair，能边指边说",content:[{type:"word",text:"head",textCn:"头",ttsText:"head"},{type:"word",text:"face",textCn:"脸",ttsText:"face"},{type:"word",text:"hair",textCn:"头发",ttsText:"hair"},{type:"animation",text:"Touch your head.",textCn:"摸摸你的头。",animationType:"listenRepeat",speaker:"parent",ttsText:"Touch your head."}],iDo:'家长边指自己头边说 "head, head, head"，慢速清晰',weDo:"家长说单词，孩子指对应部位；互换角色",youDo:'孩子独立完成 "Touch your head/face/hair" 的指令',parentTips:"TPR 全身反应法让孩子用身体动作学英语，记忆更深。可配合镜子让孩子看自己指认部位。",practiceQuestions:[{id:"e3u2l1q1",type:"choice",question:"Touch your ___. (头)",questionCn:"摸摸你的___。（头）",options:["head","hand","foot","nose"],answer:"head",hint:"脖子上面",explanation:"head 头，脖子上的圆形部分。",ttsText:"Touch your head."},{id:"e3u2l1q2",type:"choice",question:"This is my ___. (脸)",
