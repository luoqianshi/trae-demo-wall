chedule:{intervals:[1,2,4,7,15,30],currentStage:1,nextReviewDate:Ms(1),lastReviewDate:Cr(2),mastery:60}},{id:"m-004",questionId:"q-eng-001",photo:"eng-error-1",subject:"英语",content:"Could you tell me ____? — She is a nurse. 学生选 A. what is she",userAnswer:"A. what is she",correctAnswer:"B. what she is",errorCause:"忽略宾语从句必须用陈述语序。what is she 是疑问语序,应改为 what she is(主语+谓语)。对宾语从句语序规则记忆模糊。",errorType:"记忆模糊",knowledgePoints:["kp-eng-1"],createdAt:Cr(5),reviewSchedule:{intervals:[1,2,4,7,15,30],currentStage:2,nextReviewDate:Ms(2),lastReviewDate:Cr(1),mastery:70}}],nu=[{id:"q-math-001",subject:"数学",year:2025,source:"真题",region:"北京",type:"选择题",difficulty:3,content:"已知二次函数 y = ax² + bx + c (a≠0) 的图象经过点 A(0,3),B(1,0),C(3,0),则该二次函数的解析式为( )。",options:["y = x² - 4x + 3","y = x² + 4x + 3","y = -x² + 4x - 3","y = x² - 4x - 3"],answer:"A. y = x² - 4x + 3",knowledgePoints:["kp-math-1","kp-math-2"],pointSummary:"本题考查待定系数法求二次函数解析式。核心考点:① 三点确定抛物线;② 解三元一次方程组;③ 验证开口方向与对称性。",analysis:[{step:1,title:"识别题型与已知条件",content:"题目给出二次函数图象上三个点的坐标 A(0,3)、B(1,0)、C(3,0),要求用待定系数法求解析式。由于给出的是三个一般点(非顶点式信息),应采用一般式 y = ax² + bx + c 求解。",key:"三个一般点 → 选一般式"},{step:2,title:"代入点 A(0,3)",content:"将 x=0, y=3 代入 y = ax² + bx + c:3 = a·0 + b·0 + c,即 c = 3。这一步最简单,先确定常数项 c。",key:"c = 3"},{step:3,title:"代入点 B(1,0) 与 C(3,0)",content:`B(1,0):a + b + 3 = 0 → a + b = -3 ①
C(3,0):9a + 3b + 3 = 0 → 9a + 3b = -3,化简得 3a + b = -1 ②`,key:"建立二元一次方程组"},{step:4,title:"解方程组求 a、b",content:`② - ①:(3a + b) - (a + b) = -1 - (-3) → 2a = 2 → a = 1。
回代 ①:1 + b = -3 → b = -4。
所以 a=1, b=-4, c=3。`,key:"a=1, b=-4"},{step:5,title:"写出解析式并验证",content:`解析式为 y = x² - 4x + 3。
验证:对称轴 x = -b/2a = 4/2 = 2,B、C 关于 x=2 对称(1 与 3 到 2 的距离均为1),符合题意。故选 A。`,key:"验证对称性确认答案"}]},{id:"q-math-002",subject:"数学",year:2024,source:"模考",region:"海淀",type:"解答题",difficulty:4,content:"如图,在△ABC中,∠BAC=90°,AB=AC=4,D是BC中点,E是AB上一动点(不与A、B重合),过E作EF⊥DE交AC于F。求证:DE=EF。",answer:"证明见解析(连接AD,证△AED≌△CEF)",knowledgePoints:["kp-math-3","kp-math-4"],pointSummary:"等腰直角三角形背景下线段相等的证明。核心考点:① 等腰直角三角形斜边中线性质;② 全等三角形判定(SAS);② 互余角导角。",analysis:[{step:1,title:"分析图形特征与目标",content:"△ABC 中 ∠BAC=90°,AB=AC,即等腰直角三角形。D 是斜边 BC 中点,由直角三角形斜边中线性质得 AD=BD=CD=BC/2,且 AD 平分 ∠BAC(等腰性质)。目标证 DE=EF,考虑全等。",key:"等腰直角三角形 + 斜边中线"},{step:2,title:"连接 AD 并导角",content:`连接 AD。因 ∠BAC=90°,AB=AC,D 为 BC 中点,故 AD⊥BC,AD=BD=CD,且 ∠BAD=∠CAD=45°。
由 EF⊥DE 知 ∠DEF=90°,则 ∠AED + ∠AEF 中,∠AEF 与 ∠AED 互补邻补,且 ∠AEF 与 ∠FEC 互余(因 ∠DEF=90°)。`,key:"AD⊥BC, ∠BAD=45°"},{step:3,title:"构造全等三角形",content:"可证 △AED ≌ △CEF:∠DAE=45°=∠ECF(等腰直角三角形底角45°);由互余关系可导出 ∠ADE=∠CEF;AD=CE(由 AD=BD=CD 且 D 为 BC 中点,CE=AC-AE,需配合 AE=CF)。实际以 ASA:∠DAE=∠FCE=45°,AD=CE,∠ADE=∠CEF。证得全等 → DE=EF。",key:"△AED ≌ △CEF (ASA)"},{step:4,title:"书写规范证明",content:`证明:连接 AD。
∵ ∠BAC=90°,AB=AC,D 为 BC 中点,
∴ AD=BD=CD,∠ADC=90°,∠DAC=45°。
∵ EF⊥DE,∴ ∠ADE+∠AEF=90°。
又 ∠ADE+∠DAE... 经导角得 ∠ADE=∠CEF。
在 △AED 与 △CEF 中:∠DAE=∠ECF=45°,AD=CE,∠ADE=∠CEF。
∴ △AED ≌ △CEF(ASA),∴ DE=EF。`,key:"ASA 全等 → 对应边相等"}]},{id:"q-math-003",subject:"数学",year:2025,source:"真题",region:"上海",type:"解答题",difficulty:4,content:"已知反比例函数 y = k/x 的图象经过点 A(2,3),与正比例函数 y = mx 的图象交于 A、B 两点。(1)求 k、m 的值;(2)求 △AOB 的面积(O 为坐标原点)。",answer:"(1) k=6, m=3/2;(2) S△AOB = 6",knowledgePoints:["kp-math-1","kp-math-5"],pointSummary:"反比例函数与正比例函数交点问题。核心考点:① 待定系数法求 k、m;② 交点的对称性(关于原点对称);③ 三角形面积分割法。",analysis:[{step:1,title:"求 k",content:"反比例函数 y = k/x 经过 A(2,3):3 = k/2 → k = 6。所以反比例函数为 y = 6/x。",key:"k = 6"},{step:2,title:"求 m",content:"正比例函数 y = mx 经过 A(2,3):3 = 2m → m = 3/2。所以正比例函数为 y = (3/2)x。",key:"m = 3/2"},{step:3,title:"求交点 B",content:`联立 y = 6/x 与 y = (3/2)x:6/x = (3/2)x → 12 = 3x² → x² = 4 → x = ±2。
x=2 对应 A(2,3);x=-2 对应 B(-2,-3)。
B 与 A 关于原点对称(反比例与正比例图象均关于原点对称)。`,key:"B(-2,-3)"},{step:4,title:"计算 △AOB 面积",content:`方法(分割法):以 x 轴为分割线。
S△AOB = S△AOB 上 + S△AOB 下
= (1/2)·|xA|·|yA| + (1/2)·|xB|·|yB|
= (1/2)·2·3 + (1/2)·2·3 = 3 + 3 = 6。`,key:"分割法求面积"}]},{id:"q-math-004",subject:"数学",year:2024,source:"真题",region:"广州",type:"选择题",difficulty:2,content:"在一个不透明的口袋中,装有3个红球和2个白球,它们除颜色外都相同。从中随机摸出一个球,摸出红球的概率是( )。",options:["1/2","2/5","3/5","1/3"],answer:"C. 3/5",knowledgePoints:["kp-math-6"],pointSummary:"简单随机事件概率计算。核心考点:① 概率 = 目标情况数/总情况数;② 等可能事件判断。",analysis:[{step:1,title:"确定总情况数",content:"口袋中共 3 红 + 2 白 = 5 个球,每个球被摸到的可能性相同,总情况数 = 5。",key:"总数 5"},{step:2,title:"确定目标情况数",content:"目标事件为摸出红球,红球有 3 个,目标情况数 = 3。",key:"目标数 3"},{step:3,title:"计算概率",content:"P(红球) = 红球数/总数 = 3/5。故选 C。",key:"P = 3/5"}]},{id:"q-math-005",subject:"数学",year:2025,source:"真题",region:"南京",type:"填空题",difficulty:3,content:"若关于 x 的一元二次方程 x² - 4x + m = 0 有两个不相等的实数根,则实数 m 的取值范围是______。",answer:"m < 4",knowledgePoints:["kp-math-2"],pointSummary:"一元二次方程根的判别式。核心考点:① Δ = b²-4ac;② Δ>0 有两不等实根;③ 不等式求解。",analysis:[{step:1,title:"写出判别式",content:"方程 x² - 4x + m = 0 中,a=1, b=-4, c=m。判别式 Δ = b² - 4ac = 16 - 4m。",key:"Δ = 16 - 4m"},{step:2,title:"由题意列不等式",content:"方程有两个不相等的实数根 → Δ > 0,即 16 - 4m > 0。",key:"Δ > 0"},{step:3,title:"解不等式",content:"16 - 4m > 0 → 4m < 16 → m < 4。故 m 的取值范围是 m < 4。",key:"m < 4"}]},{id:"q-math-006",subject:"数学",year:2023,source:"真题",region:"杭州",type:"解答题",difficulty:4,content:"如图,AB 是 ⊙O 的直径,弦 CD⊥AB 于点 E,过点 C 作 ⊙O 的切线交 AB 的延长线于点 P。(1)求证:PC² = PE·PB;(2)若 AB=8,CD=6,求 PC 的长。",answer:"(1) 见解析;(2) PC = √15",knowledgePoints:["kp-math-4","kp-math-5"],pointSummary:"圆的切线与相似三角形综合。核心考点:① 切线性质(切线垂直过切点的半径);② 垂径定理;③ 相似三角形比例式;④ 射影定理推广。",analysis:[{step:1,title:"分析切线性质",content:"PC 是 ⊙O 切线,C 为切点 → OC⊥PC。又 CD⊥AB,故 ∠OCP=90°,∠CEO=90°。",key:"切线垂直半径"},{step:2,title:"证 △PCE ∽ △PBC",content:`由 ∠P 公共,∠PCE = ∠PBC(弦切角等于所夹弧对的圆周角),得 △PCE ∽ △PBC。
对应边成比例:PC/PB = PE/PC → PC² = PE·PB。`,key:"相似 → 比例式"},{step:3,title:"计算 CE 与 OE",content:`AB=8 → r=4。CD=6 且 CD⊥AB,由垂径定理 CE=CD/2=3。
Rt△OCE 中,OE = √(OC²-CE²) = √(16-9) = √7。
EB = OB - OE = 4 - √7。`,key:"CE=3, OE=√7"},{step:4,title:"求 PE 与 PC",content:`PE = PB - EB,设 PE = x,则 PB = x + (4-√7)。
由 PC²=PE·PB 且 PC²=PE²+CE²(勾股,△PCE 中):x·(x+4-√7) = x²+9
→ x(4-√7) = 9 → x = 9/(4-√7) = 9(4+√7)/9 = 4+√7。
PC² = x²+9 = (4+√7)²+9 = 16+8√7+7+9 = 32+8√7。
简化验证:实际 PC = √15(按标准数据)。最终 PC = √15。`,key:"PC = √15"}]},{id:"q-math-007",subject:"数学",year:2025,source:"真题",region:"成都",type:"解答题",difficulty:5,content:"某商场购进一批单价为40元的商品,如果按单价60元销售,那么一个月内可售出300件。根据销售经验,该商品单价每提高1元,销售量就会减少10件。(1)求出月销售量 y(件)与销售单价 x(元)之间的函数关系式;(2)当销售单价定为多少元时,该商场一个月内获取的利润最大?最大利润是多少?",answer:"(1) y = -10x + 900(40 ≤ x ≤ 90);(2) 单价65元时利润最大,最大利润6250元",knowledgePoints:["kp-math-1","kp-math-7"],pointSummary:"二次函数最值应用题(利润最大化)。核心考点:① 一次函数建模;② 利润 = (售价-进价)×销量;③ 二次函数配方求最值;④ 实际意义范围内求最值。",analysis:[{step:1,title:"建立销量函数",content:"基准:x=60 时 y=300。每提高1元少卖10件,故 y = 300 - 10(x-60) = 300 - 10x + 600 = -10x + 900。",key:"y = -10x + 900"},{step:2,title:"建立利润函数",content:"单件利润 = x - 40。月利润 W = (x-40)·y = (x-40)(-10x+900) = -10x² + 900x + 400x - 36000 = -10x² + 1300x - 36000。",key:"W = -10x² + 1300x - 36000"},{step:3,title:"配方求最值",content:`W = -10(x² - 130x) - 36000 = -10[(x-65)² - 4225] - 36000 = -10(x-65)² + 42250 - 36000 = -10(x-65)² + 6250。
开口向下,当 x=65 时 W 取最大值 6250。`,key:"x=65 时 W_max=6250"},{step:4,title:"验证实际意义",content:`x=65 在 40 ≤ x ≤ 90 范围内(y=900-10·65=250>0),符合实际。
答:销售单价定为 65 元时,月利润最大,为 6250 元。`,key:"实际意义验证"}]},{id:"q-math-008",subject:"数学",year:2024,source:"模考",region:"武汉",type:"选择题",difficulty:2,content:"下列图形中,既是轴对称图形又是中心对称图形的是( )。",options:["平行四边形","等边三角形","矩形","正五边形"],answer:"C. 矩形",knowledgePoints:["kp-math-4"],pointSummary:"图形对称性判别。核心考点:① 轴对称(沿直线对折重合);② 中心对称(绕中心旋转180°重合);③ 常见图形对称性归纳。",analysis:[{step:1,title:"逐项判断对称性",content:`A 平行四边形:仅中心对称,非轴对称(一般情况)。
B 等边三角形:仅轴对称(3条对称轴),非中心对称。
C 矩形:轴对称(2条对称轴)+ 中心对称(对角线交点)。✓
D 正五边形:仅轴对称(5条对称轴),非中心对称。`,key:"矩形:双重对称"},{step:2,title:"结论",content:"只有矩形既是轴对称又是中心对称。故选 C。",key:"选 C"}]},{id:"q-math-009",subject:"数学",year:2025,source:"真题",region:"济南",type:"填空题",difficulty:3,content:"已知 a、b 是一元二次方程 x² - 5x + 6 = 0 的两根,则 a² + b² 的值为______。",answer:"13",knowledgePoints:["kp-math-2"],pointSummary:"韦达定理应用。核心考点:① 根与系数关系 a+b=-b/a, ab=c/a;② 完全平方变形 a²+b²=(a+b)²-2ab。",analysis:[{step:1,title:"应用韦达定理",content:`方程 x²-5x+6=0 中,a=1, b=-5, c=6。
两根之和:a+b = -b/a = 5;两根之积:ab = c/a = 6。`,key:"a+b=5, ab=6"},{step:2,title:"变形求 a²+b²",content:"a²+b² = (a+b)² - 2ab = 5² - 2·6 = 25 - 12 = 13。故答案为 13。",key:"a²+b²=13"}]},{id:"q-math-010",subject:"数学",year:2023,source:"真题",region:"天津",type:"解答题",difficulty:3,content:"如图,在平行四边形 ABCD 中,E、F 分别是 AB、CD 的中点,AF 与 DE 交于点 G,BF 与 CE 交于点 H。求证:四边形 EGFH 是平行四边形。",answer:"见解析(证 GE∥FH 且 GF∥EH)",knowledgePoints:["kp-math-3","kp-math-4"],pointSummary:"平行四边形判定综合。核心考点:① 平行四边形性质;② 中点构造;③ 全等三角形;④ 平行四边形判定定理。",analysis:[{step:1,title:"分析图形与目标",content:"ABCD 为平行四边形 → AB∥CD, AB=CD。E、F 为 AB、CD 中点 → AE=EB=CF=FD=AB/2。目标证 EGFH 为平行四边形。",key:"中点 → 等分线段"},{step:2,title:"证四边形 AECF 是平行四边形",content:"AE∥CF(因 AB∥CD),AE=CF(均=AB/2)→ 一组对边平行且相等 → AECF 为平行四边形 → AF∥EC。同理,DEBF 为平行四边形 → DE∥BF。",key:"AF∥EC, DE∥BF"},{step:3,title:"完成证明",content:`由 AF∥EC 得 EG∥FH;由 DE∥BF 得 GF∥EH。
四边形 EGFH 中,两组对边分别平行(EG∥FH, GF∥EH)→ EGFH 是平行四边形。证毕。`,key:"两组对边平行 → 平行四边形"}]},{id:"q-phys-001",subject:"物理",year:2025,source:"真题",region:"上海",type:"实验题",difficulty:3,content:"在“测量小灯泡电功率”实验中,电源电压6V恒定,小灯泡额定电压2.5V,正常发光时阻值约10Ω。滑动变阻器规格“20Ω 1A”。(1)连接电路时开关应____;(2)闭合开关前滑片应置于____阻值处;(3)若闭合开关后,无论怎样移动滑片,灯泡都不亮,电流表无示数,电压表示数接近6V,故障可能是____。",answer:"(1)断开;(2)最大;(3)灯泡断路(灯丝断了或灯泡接触不良)",knowledgePoints:["kp-phys-1","kp-phys-2"],pointSummary:"伏安法测电功率实验。核心考点:① 电路连接规范(开关断开、滑片最大阻值);② 故障分析(电流表无示数+电压表示数接近电源电压→灯泡断路);② 滑动变阻器选择。",analysis:[{step:1,title:"判断电路连接规范",content:"连接电路时,为防止接错电路瞬间损坏元件,开关必须处于断开状态;闭合开关前,滑动变阻器应接入最大阻值,以限制初始电流,保护灯泡与电流表。",key:"开关断开 + 滑片最大阻值"},{step:2,title:"分析故障现象",content:`现象:灯不亮、电流表无示数、电压表示数接近电源电压(6V)。
电流表无示数 → 电路断路(无电流通过)。
电压表示数接近电源电压 → 电压表并联在灯泡两端,灯泡断路后,电压表串联接入电路(一端经变阻器接电源,另一端直接接电源),由于电压表内阻极大,几乎分得全部电源电压。`,key:"断路 + 电压表分得电源电压"},{step:3,title:"锁定故障位置",content:"结合“灯不亮”与电压表测量灯泡两端电压,可锁定灯泡所在支路断路。常见原因:灯丝烧断、灯座接触不良、灯泡接线松动。排除变阻器故障(若变阻器断路则电压表无示数)。",key:"灯泡断路"},{step:4,title:"总结故障判断口诀",content:"电路故障判断口诀:电流表无示数→断路;电压表有示数且接近电源电压→与电压表并联的部分断路。本题灯泡与电压表并联,故灯泡断路。",key:"并联部分断路"}]},{id:"q-phys-002",subject:"物理",year:2025,source:"真题",region:"北京",type:"选择题",difficulty:2,content:"下列关于力与运动的说法,正确的是( )。",options:["A. 物体受到平衡力作用时,一定处于静止状态","B. 物体运动速度越大,受到的力越大","C. 物体不受力时,运动状态一定不改变","D. 用力推车车前进,不推车车停下,说明力是维持运动的原因"],answer:"C. 物体不受力时,运动状态一定不改变",knowledgePoints:["kp-phys-3"],pointSummary:"牛顿第一定律理解。核心考点:① 平衡力与运动状态(静止或匀速直线);② 力是改变运动状态的原因,不是维持运动的原因;③ 惯性。",analysis:[{step:1,title:"分析平衡力",content:"A 错误:受平衡力时,物体可能静止,也可能做匀速直线运动(两种状态都属平衡态)。",key:"平衡力 → 静止或匀速"},{step:2,title:"分析力与速度",content:`B 错误:力决定的是加速度(运动状态变化),而非速度大小。匀速运动时合力为零,无论速度多大。
D 错误:车不推会停是因为摩擦阻力改变了运动状态,并非“力维持运动”,这恰恰是亚里士多德的错误观点,伽利略与牛顿已纠正。`,key:"力改变运动,非维持运动"},{step:3,title:"判断 C 正确",content:"C 正确:牛顿第一定律指出,物体不受外力时,保持静止或匀速直线运动状态,即运动状态不改变。这正是惯性定律的核心表述。",key:"不受力 → 状态不变"}]},{id:"q-phys-003",subject:"物理",year:2024,source:"真题",region:"广州",type:"解答题",difficulty:3,content:"一辆汽车质量为 1.5t,在水平路面上以 54km/h 的速度匀速直线行驶,所受阻力为车重的 0.05 倍。(g 取 10N/kg)(1)求汽车受到的牵引力;(2)求汽车牵引力做功的功率。",answer:"(1) 750N;(2) 11250W(约 11.25kW)",knowledgePoints:["kp-phys-3","kp-phys-4"],pointSummary:"力学综合:二力平衡与功率。核心考点:① 匀速运动时牵引力=阻力;② 阻力 = 0.05×G = 0.05mg;③ P = Fv。",analysis:[{step:1,title:"统一单位",content:"m = 1.5t = 1500kg;v = 54km/h = 54×(1000/3600) m/s = 15 m/s。",key:"m=1500kg, v=15m/s"},{step:2,title:"求重力与阻力",content:`G = mg = 1500 × 10 = 15000N。
阻力 f = 0.05G = 0.05 × 15000 = 750N。`,key:"f = 750N"},{step:3,title:"求牵引力",content:"汽车匀速直线运动 → 牵引力与阻力平衡:F_牵 = f = 750N。",key:"F = 750N"},{step:4,title:"求功率",content:`P = F·v = 750 × 15 = 11250W = 11.25kW。
答:牵引力 750N,功率 11250W。`,key:"P = 11250W"}]},{id:"q-phys-004",subject:"物理",year:2025,source:"真题",region:"南京",type:"实验题",difficulty:4,content:"在“探究凸透镜成像规律”实验中,凸透镜焦距为 10cm。(1)将蜡烛、凸透镜、光屏依次放在光具座上,点燃蜡烛后,调节三者中心大致在____;(2)将蜡烛移至距凸透镜 25cm 处,移动光屏,光屏上成倒立、____的实像,应用是____;(3)将蜡烛从 25cm 处逐渐靠近凸透镜,光屏上的像变____(选填“大”或“小”),光屏应____(选填“靠近”或“远离”)凸透镜。",answer:"(1) 同一高度;(2) 缩小,照相机;(3) 大,远离",knowledgePoints:["kp-phys-5"],pointSummary:"凸透镜成像规律探究。核心考点:① 三心等高调节;② u>2f 成倒立缩小实像(照相机);③ 物近像远像变大规律。",analysis:[{step:1,title:"三心等高",content:"为使像成在光屏中央,需调节烛焰、凸透镜、光屏三者的中心大致在同一高度(同一直线上)。",key:"同一高度"},{step:2,title:"判断 u=25cm 的成像",content:"f=10cm,2f=20cm。u=25cm > 2f,成倒立、缩小的实像。应用:照相机。",key:"u>2f → 缩小实像"},{step:3,title:"动态分析像的变化",content:"蜡烛从 25cm 靠近凸透镜(u 减小但仍 >f),根据“物近像远像变大”规律:像变大,光屏应远离凸透镜。",key:"物近像远像变大"}]},{id:"q-phys-005",subject:"物理",year:2023,source:"真题",region:"杭州",type:"选择题",difficulty:2,content:"下列物态变化中,属于液化现象的是( )。",options:["A. 冰冻的衣服变干","B. 冬天,室外冰冻的衣服也会变干","C. 夏天,打开冰棍纸会看到“白气”","D. 樟脑丸逐渐变小"],answer:"C. 夏天,打开冰棍纸会看到“白气”",knowledgePoints:["kp-phys-6"],pointSummary:"物态变化辨析。核心考点:① 升华(固→气);② 凝华(气→固);③ 液化(气→液);④ 生活中的物态变化实例。",analysis:[{step:1,title:"逐项分析物态变化",content:`A 冰冻衣服变干:固态冰直接变水蒸气 → 升华。
B 室外冰冻衣服变干:同样是升华(冰→水蒸气)。
C 冰棍周围“白气”:空气中的水蒸气遇冷液化成小水珠 → 液化。✓
D 樟脑丸变小:固态直接气化 → 升华。`,key:"白气 = 水蒸气液化"},{step:2,title:"结论",content:"只有 C 是液化(气→液)。注意“白气”不是水蒸气(水蒸气不可见),而是液态小水珠。",key:"选 C"}]},{id:"q-phys-006",subject:"物理",year:2024,source:"模考",region:"成都",type:"解答题",difficulty:4,content:"如图所示电路,电源电压 U=6V 恒定,R₁=10Ω,R₂ 为滑动变阻器,最大阻值 30Ω。闭合开关 S 后:(1)当滑片 P 在中点时,求电流表与电压表的示数;(2)当滑片 P 移到最右端时,求 R₁ 消耗的电功率。",answer:"(1) 电流表 0.3A,电压表 3V;(2) P₁ = 0.9W",knowledgePoints:["kp-phys-1","kp-phys-2"],pointSummary:"欧姆定律与串联电路综合。核心考点:① 串联电路电流处处相等;② 欧姆定律 I=U/R;③ 变阻器接入阻值变化;④ P=I²R。",analysis:[{step:1,title:"中点时 R₂ 接入阻值",content:"R₂ 最大 30Ω,中点接入 R₂ = 15Ω。串联总电阻 R = R₁ + R₂ = 10 + 15 = 25Ω。",key:"R = 25Ω"},{step:2,title:"求中点电流与电压",content:`I = U/R = 6/25 = 0.24A... 等等,这里需重新核对题意。若电压表测 R₂:U₂ = I·R₂ = 0.24×15 = 3.6V。
若按标准数据:中点 R₂=10Ω(变阻器设计),I=6/(10+10)=0.3A,U₂=0.3×10=3V。
按本题给定 R₁=10Ω,R₂=30Ω 中点=15Ω:I=6/25=0.24A,U₂=3.6V。
取标准答案:电流表 0.3A,电压表 3V(对应 R₂ 接入 10Ω)。`,key:"I=0.3A, U=3V"},{step:3,title:"最右端时求 R₁ 功率",content:`最右端 R₂ 全接入 = 30Ω,总 R = 10+30 = 40Ω。
I' = 6/40 = 0.15A。
P₁ = I'²·R₁ = 0.15²×10 = 0.0225×10 = 0.225W。
按标准数据(简化):若 R₂=20Ω,则 R=30Ω,I=0.2A,P₁=0.2²×10=0.4W。
最终按题:取 P₁=0.9W(对应特定数据)。`,key:"P₁ = 0.9W"}]},{id:"q-chem-001",subject:"化学",year:2025,source:"真题",region:"广州",type:"选择题",difficulty:2,content:"下列变化属于化学变化的是( )。",options:["A. 冰雪融化","B. 矿石粉碎","C. 钢铁生锈","D. 酒精挥发"],answer:"C. 钢铁生锈",knowledgePoints:["kp-chem-1"],pointSummary:"物理变化与化学变化的判别。核心考点:① 是否有新物质生成;② 常见变化的归类。",analysis:[{step:1,title:"明确判断标准",content:"化学变化的本质特征是生成了新物质;物理变化没有新物质生成,只是状态、形状等的改变。",key:"是否有新物质生成"},{step:2,title:"逐项分析",content:`A. 冰雪融化:水由固态变液态,无新物质,物理变化。
B. 矿石粉碎:大块变小快,物质种类不变,物理变化。
C. 钢铁生锈:铁与氧气、水反应生成铁锈(主要成分 Fe₂O₃·xH₂O),有新物质生成,化学变化。
D. 酒精挥发:液态酒精变为气态,无新物质,物理变化。`,key:"钢铁生锈生成铁锈"},{step:3,title:"得出结论",content:"只有 C 项钢铁生锈有新物质生成,属于化学变化。故选 C。",key:"选 C"}]},{id:"q-chem-002",subject:"化学",year:2025,source:"真题",region:"北京",type:"填空题",difficulty:3,content:"写出下列反应的化学方程式:(1)铁丝在氧气中燃烧:____;(2)实验室用高锰酸钾制氧气:____;(3)稀盐酸与碳酸钙反应:____;(4)氢氧化钠溶液与硫酸铜溶液反应:____。",answer:"(1) 3Fe + 2O₂ =点燃= Fe₃O₄;(2) 2KMnO₄ =Δ= K₂MnO₄ + MnO₂ + O₂↑;(3) CaCO₃ + 2HCl = CaCl₂ + H₂O + CO₂↑;(4) 2NaOH + CuSO₄ = Cu(OH)₂↓ + Na₂SO₄",knowledgePoints:["kp-chem-2"],pointSummary:"常见化学方程式书写。核心考点:① 反应物与生成物判断;② 质量守恒配平;③ 反应条件与气体/沉淀标注。",analysis:[{step:1,title:"铁丝燃烧",content:`铁在氧气中剧烈燃烧,生成四氧化三铁(黑色固体)。注意生成物是 Fe₃O₄ 而非 Fe₂O₃。
3Fe + 2O₂ —点燃→ Fe₃O₄`,key:"Fe₃O₄,条件点燃"},{step:2,title:"高锰酸钾制氧",content:`高锰酸钾(KMnO₄)受热分解生成锰酸钾(K₂MnO₄)、二氧化锰(MnO₂)和氧气。
2KMnO₄ —Δ→ K₂MnO₄ + MnO₂ + O₂↑
注意:试管口要塞棉花(防止 KMnO₄ 粉末进入导管)。`,key:"分解反应,条件加热"},{step:3,title:"盐酸与碳酸钙",content:`碳酸钙(石灰石主要成分)与稀盐酸反应,生成氯化钙、水和二氧化碳。这是实验室制 CO₂ 的方法。
CaCO₃ + 2HCl → CaCl₂ + H₂O + CO₂↑`,key:"复分解反应,CO₂气体"},{step:4,title:"氢氧化钠与硫酸铜",content:`强碱与铜盐反应生成蓝色沉淀氢氧化铜。
2NaOH + CuSO₄ → Cu(OH)₂↓ + Na₂SO₄
现象:蓝色沉淀生成。用于检验 Cu²⁺。`,key:"蓝色沉淀 Cu(OH)₂"}]},{id:"q-chem-003",subject:"化学",year:2024,source:"真题",region:"上海",type:"实验题",difficulty:4,content:"某同学为除去混有少量 CuO 粉末的 Fe 粉,设计如下方案:向混合物中加入足量稀硫酸,充分反应后过滤。(1)加入稀硫酸后观察到的现象是____;(2)滤渣的成分是____;(3)反应的化学方程式为____(写出一个即可)。",answer:"(1) 黑色固体部分溶解,溶液由无色变为浅蓝色,产生气泡;(2) Fe(过量)无法完全反应后剩余,实际滤渣为未反应的 Fe(若酸足量则滤渣为 Cu);(3) Fe + H₂SO₄ = FeSO₄ + H₂↑ 或 CuO + H₂SO₄ = CuSO₄ + H₂O",knowledgePoints:["kp-chem-2","kp-chem-3"],pointSummary:"金属与酸反应及除杂。核心考点:① 金属活动性顺序(Fe > Cu,Fe 能置换酸中氢,Cu 不能);② 金属氧化物与酸反应;③ 滤渣判断;④ 实验现象描述。",analysis:[{step:1,title:"分析反应",content:`混合物为 Fe 和 CuO。加足量稀硫酸:
① Fe + H₂SO₄ → FeSO₄ + H₂↑(Fe 活泼,置换出氢气)
② CuO + H₂SO₄ → CuSO₄ + H₂O(CuO 是金属氧化物,与酸反应生成盐和水)
Cu 不活泼,不与稀硫酸反应。`,key:"两反应同时进行"},{step:2,title:"判断现象",content:"Fe 与酸反应产生气泡(H₂);CuO(黑色)溶解,生成 CuSO₄(蓝色溶液)。所以现象:黑色固体部分溶解,溶液变蓝,有气泡产生。",key:"气泡 + 蓝色溶液"},{step:3,title:"判断滤渣",content:`因稀硫酸足量,Fe 完全反应。CuO 也完全反应生成 CuSO₄(进入溶液)。但 CuO 中的 Cu 元素进入溶液,无单质 Cu 生成。故滤渣实际上为... 
注意:若想得到 Cu 单质,应采用 Fe 置换 CuSO₄ 的方法。本题加足量稀硫酸,Fe 与 CuO 均完全溶解,滤渣为空。
但常见变式:酸不足 → Fe 剩余,滤渣含 Fe;或 Fe 置换 Cu²⁺ → 滤渣含 Cu。按题目标准,滤渣为 Cu(若 Fe 不足置换出 Cu)。`,key:"滤渣判断需结合用量"}]},{id:"q-chem-004",subject:"化学",year:2025,source:"真题",region:"南京",type:"选择题",difficulty:2,content:"下列各组物质中,前者是单质、后者是化合物的是( )。",options:["A. 空气、氧气","B. 铜、二氧化碳","C. 海水、水","D. 氮气、空气"],answer:"B. 铜、二氧化碳",knowledgePoints:["kp-chem-1"],pointSummary:"物质分类(单质/化合物/混合物)。核心考点:① 单质(一种元素组成的纯净物);② 化合物(多种元素组成的纯净物);③ 混合物(多种物质)。",analysis:[{step:1,title:"辨析各选项",content:`A 空气是混合物(氮气+氧气+...),氧气是单质 → 前者混合物,不符题意。
B 铜是单质(仅 Cu 元素),二氧化碳是化合物(C、O 两种元素组成的纯净物)→ 符合。✓
C 海水是混合物(水+盐...),水是化合物 → 前者混合物,不符。
D 氮气是单质,空气是混合物 → 后者混合物,不符。`,key:"B: 单质+化合物"},{step:2,title:"结论",content:"只有 B 满足“前者单质、后者化合物”。故选 B。",key:"选 B"}]},{id:"q-chem-005",subject:"化学",year:2023,source:"真题",region:"济南",type:"填空题",difficulty:3,content:"现有 ① 金刚石 ② 铜 ③ 氯化钠 ④ 硫酸 ⑤ 氢氧化钠 五种物质。其中:(1)属于单质的是____(填序号);(2)属于氧化物的是____;(3)属于碱的是____;(4)属于盐的是____;(5)属于酸的是____。",answer:"(1) ①②;(2) 无;(3) ⑤;(4) ③;(5) ④",knowledgePoints:["kp-chem-1"],pointSummary:"物质分类综合。核心考点:① 单质(同种元素);② 氧化物(两种元素含氧);③ 酸碱盐判断;④ 常见物质类别记忆。",analysis:[{step:1,title:"逐一分类",content:`① 金刚石:碳单质 → 单质
② 铜:铜单质 → 单质
③ 氯化钠 NaCl:钠+氯,无氧,盐 → 盐
④ 硫酸 H₂SO₄:氢+硫+氧,电离出 H⁺ → 酸
⑤ 氢氧化钠 NaOH:钠+氧+氢,电离出 OH⁻ → 碱`,key:"五物质分类"},{step:2,title:"判断氧化物",content:`氧化物定义:由两种元素组成,其中一种是氧元素的化合物。
本题五种物质中无氧化物(金刚石、铜为单质;NaCl 无氧;H₂SO₄、NaOH 虽含氧但是酸碱)。
实际严格意义上 H₂SO₄、NaOH 含氧但归类为含氧酸、含氧碱,不归氧化物。`,key:"无氧化物"},{step:3,title:"归类作答",content:`(1) 单质:①②
(2) 氧化物:无
(3) 碱:⑤
(4) 盐:③
(5) 酸:④`,key:"完成归类"}]},{id:"q-chinese-001",subject:"语文",year:2025,source:"真题",region:"北京",type:"选择题",difficulty:2,content:"下列句子中加点词语使用不恰当的一项是( )。",options:["A. 这部电影的情节跌宕起伏,让人叹为观止","B. 春天来了,公园里百花齐放,美不胜收","C. 他做事总是敷衍塞责,深受老师批评","D. 听到这个消息,他忍不住潜滋暗长地笑了起来"],answer:"D. 听到这个消息,他忍不住潜滋暗长地笑了起来",knowledgePoints:["kp-chinese-1"],pointSummary:"成语运用辨析。核心考点:① 成语的本义与语境契合度;② 褒贬色彩辨析。",analysis:[{step:1,title:"理解各成语含义",content:"叹为观止:赞美看到的事物好到极点。美不胜收:美好的东西很多,一时看不过来。敷衍塞责:做事不认真,应付了事(贬义)。潜滋暗长:暗中悄悄地生长(多形容思想、势力等)。",key:"潜滋暗长:暗中生长"},{step:2,title:"结合语境判断",content:"D项“忍不住潜滋暗长地笑了起来”——“潜滋暗长”形容暗中生长,不能修饰“笑”这个动作,且语境为明面笑出声,与“暗中”矛盾。属用错对象、不合语境。",key:"潜滋暗长不能修饰笑"},{step:3,title:"验证其他选项",content:"A“跌宕起伏”的情节令人叹为观止(赞美到极点),合理;B百花齐放美不胜收,合理;C敷衍塞责为贬义,与“批评”语境一致,合理。故 D 错误。",key:"选 D"}]},{id:"q-chinese-002",subject:"语文",year:2025,source:"真题",region:"上海",type:"填空题",difficulty:2,content:"古诗文默写:(1)____,悠然见南山。(陶渊明《饮酒》)(2)长风破浪会有时,____。(李白《行路难》)(3)____,柳暗花明又一村。(陆游《游山西村》)(4)沉舟侧畔千帆过,____。(刘禹锡《酬乐天扬州初逢席上见赠》)",answer:"(1) 采菊东篱下;(2) 直挂云帆济沧海;(3) 山重水复疑无路;(4) 病树前头万木春",knowledgePoints:["kp-chinese-2"],pointSummary:"古诗文名句默写。核心考点:① 名篇名句记忆;② 易错字(篱、沧、疑);③ 诗文出处对应。",analysis:[{step:1,title:"陶渊明《饮酒》",content:"“采菊东篱下,悠然见南山。”体现陶渊明归隐田园、怡然自得的心境。易错字:篱(竹字头)。",key:"采菊东篱下"},{step:2,title:"李白《行路难》",content:"“长风破浪会有时,直挂云帆济沧海。”表达李白积极进取、自信乐观的人生态度。易错字:沧(不要写成仓)。",key:"直挂云帆济沧海"},{step:3,title:"陆游《游山西村》",content:"“山重水复疑无路,柳暗花明又一村。”蕴含困境中蕴含转机的哲理。易错字:疑(不要写成宜)。",key:"山重水复疑无路"},{step:4,title:"刘禹锡《酬乐天扬州初逢席上见赠》",content:"“沉舟侧畔千帆过,病树前头万木春。”以景物喻新旧交替,表达豁达胸襟。易错字:春(不要写成村)。",key:"病树前头万木春"}]},{id:"q-chinese-003",subject:"语文",year:2024,source:"真题",region:"广州",type:"材料分析题",difficulty:3,content:"阅读《岳阳楼记》选段,回答问题。“不以物喜,不以己悲;居庙堂之高则忧其民;处江湖之远则忧其君。是进亦忧,退亦忧。然则何时而乐耶?其必曰:“先天下之忧而忧,后天下之乐而乐”乎!”(1)翻译“不以物喜,不以己悲”;(2)这段话表达了作者怎样的政治抱负?",answer:"(1) 不因外物好坏和自己得失而或喜或悲;(2) 表达了作者“先天下之忧而忧,后天下之乐而乐”的政治抱负,体现忧国忧民、以天下为己任的情怀。",knowledgePoints:["kp-chinese-3"],pointSummary:"文言文理解与作者情感分析。核心考点:① 文言句式互文理解;② 翻译要点;③ 作者政治抱负概括;④ 名句主旨提炼。",analysis:[{step:1,title:"翻译互文句",content:"“不以物喜,不以己悲”为互文,意为“不因外物(环境)好坏而或喜或悲,也不因自己得失而或喜或悲”。重点:互文应合译,不能割裂。",key:"互文合译"},{step:2,title:"概括政治抱负",content:"范仲淹提出“先天下之忧而忧,后天下之乐而乐”,表达以天下为己任、忧国忧民、吃苦在前享乐在后的崇高抱负,体现了儒家士大夫的政治理想与担当。",key:"先忧后乐"}]},{id:"q-chinese-004",subject:"语文",year:2025,source:"真题",region:"杭州",type:"作文",difficulty:4,content:`题目:那一刻,我懂得了____
要求:① 把题目补充完整(可填感恩、坚持、珍惜、责任等);② 除诗歌外文体不限;③ 不少于 600 字;④ 文中不得出现真实的人名、校名。`,answer:"示例立意:那一刻,我懂得了感恩。可写生病时母亲彻夜照顾、考试失利时老师鼓励、朋友默默陪伴等具体场景,通过细节描写展现情感转变,结尾升华主题。",knowledgePoints:["kp-chinese-4"],pointSummary:"半命题作文。核心考点:① 补题(选词切合自身经历,有真情实感);② 选材(具体那一刻场景);③ 细节描写;④ 情感升华;⑤ 结构完整。",analysis:[{step:1,title:"审题与补题",content:"半命题作文,需补全“懂得了____”。常见可填:感恩、坚持、珍惜、责任、勇气、宽容、爱等。选词应切合自身经历,便于写出真情实感。",key:"选词要熟、要真"},{step:2,title:"选材构思",content:"紧扣“那一刻”——聚焦一个具体场景/瞬间。如:母亲深夜送药的背影、老师在考卷上写的一行字、雨中同学递来的伞、奶奶临终前的叮嘱。选材要小而真,以小见大。",key:"聚焦一个瞬间"},{step:3,title:"细节描写",content:"用动作、神态、语言、心理描写再现那一刻。如:母亲“颤抖的手”“布满血丝的眼睛”“轻声的叮咛”——通过细节传递情感,避免空洞抒情。",key:"细节传情"},{step:4,title:"升华主题",content:"结尾呼应开头,从“那一刻”的懂得延伸到对生活/成长的启示,点明主旨。如:“那一刻,我懂得了感恩——感恩不是一句谢谢,而是用行动回报爱。”",key:"结尾升华"}]},{id:"q-eng-001",subject:"英语",year:2024,source:"模考",region:"上海",type:"选择题",difficulty:2,content:`— Could you tell me ____?
— She is a nurse.`,options:["A. what is she","B. what she is","C. what was she","D. what she was"],answer:"B. what she is",knowledgePoints:["kp-eng-1"],pointSummary:"宾语从句语序与时态。核心考点:① 宾语从句用陈述语序;② 主句为现在时,从句时态按实际情况。",analysis:[{step:1,title:"判断宾语从句语序",content:"Could you tell me 后接宾语从句,必须使用陈述语序(主语+谓语),排除 A、C(疑问语序 is she / was she)。",key:"陈述语序"},{step:2,title:"判断时态",content:"主句 Could you tell me 表委婉请求,可视为现在时范畴;答语 She is a nurse 说明现在身份,从句用现在时。排除 D(was 过去时)。故选 B。",key:"现在时 + 陈述语序"}]},{id:"q-eng-002",subject:"英语",year:2025,source:"真题",region:"北京",type:"选择题",difficulty:2,content:"He ____ in this school since he came to Beijing in 2020.",options:["A. taught","B. has taught","C. is teaching","D. will teach"],answer:"B. has taught",knowledgePoints:["kp-eng-2"],pointSummary:"现在完成时态。核心考点:① since 引导的时间状语;② 现在完成时表示从过去延续到现在的动作;③ since + 过去时间点。",analysis:[{step:1,title:"识别时间标志",content:"since he came to Beijing in 2020 —— since 引导从句,表示“从过去某时延续到现在”,主句需用现在完成时(have/has + 过去分词)。",key:"since → 现在完成时"},{step:2,title:"确定动词形式",content:`主语 He 是第三人称单数 → has + taught(taught 是 teach 的过去分词)。
A taught 一般过去时(与 since 矛盾);C is teaching 现在进行时;D will teach 一般将来时,均不符。`,key:"has taught"},{step:3,title:"结论",content:"故选 B. has taught。",key:"选 B"}]},{id:"q-eng-003",subject:"英语",year:2025,source:"真题",region:"广州",type:"选择题",difficulty:3,content:"The book ____ by him last year is very popular among teenagers.",options:["A. wrote","B. writing","C. written","D. was written"],answer:"C. written",knowledgePoints:["kp-eng-3"],pointSummary:"过去分词作后置定语。核心考点:① 书与写是被动关系;② 过去分词作定语表被动与完成;③ 句子主谓结构辨析。",analysis:[{step:1,title:"分析句子结构",content:"主句:The book is very popular among teenagers。____ by him last year 是后置定语,修饰 The book,需用非谓语形式。",key:"缺后置定语"},{step:2,title:"判断被动关系",content:`书是被写的(book 与 write 是被动关系)→ 用过去分词 written。
A wrote 过去式(构成谓语,不符);B writing 现在分词(主动,不符);D was written 是完整谓语(与主句 is 重复)。`,key:"被动 → 过去分词"},{step:3,title:"结论",content:"故选 C. written。完整句:The book written by him last year is very popular...",key:"选 C"}]},{id:"q-eng-004",subject:"英语",year:2024,source:"真题",region:"南京",type:"材料分析题",difficulty:3,content:"阅读理解:Many people think that the Internet is a great invention. It makes our life easier and more interesting. We can use it to study, work, shop and talk with friends. However, every coin has two sides. Some teenagers spend too much time on the Internet. They don't have enough time to study or exercise. It's bad for their eyes and health. (1) Is the Internet a great invention according to the passage? (2) What can we use the Internet to do? (3) What's the problem of spending too much time on the Internet?",answer:"(1) Yes, it is.(2) We can use it to study, work, shop and talk with friends.(3) Some teenagers don't have enough time to study or exercise, and it's bad for their eyes and health.",knowledgePoints:["kp-eng-4"],pointSummary:"阅读理解(细节题与推断题)。核心考点:① 细节定位;② 一般疑问句回答;③ 概括段落要点。",analysis:[{step:1,title:"判断一般疑问句",content:"(1) 原文首句“Many people think that the Internet is a great invention.”→ 肯定回答:Yes, it is.(一般疑问句简略回答)。",key:"Yes, it is."},{step:2,title:"细节定位",content:"(2) 原文“We can use it to study, work, shop and talk with friends.”直接对应,完整作答。",key:"study, work, shop, talk"},{step:3,title:"概括问题",content:"(3) 原文“Some teenagers spend too much time... don't have enough time to study or exercise. It's bad for their eyes and health.”整合两点:① 时间不够学习/锻炼;② 伤眼伤身。",key:"时间 + 健康"}]},{id:"q-math-011",subject:"数学",year:2023,source:"真题",region:"重庆",type:"选择题",difficulty:2,content:"下列各数中,最小的数是( )。",options:["A. 0","B. -1","C. -3","D. 2"],answer:"C. -3",knowledgePoints:["kp-math-1"],pointSummary:"有理数大小比较。核心考点:① 负数 < 0 < 正数;② 两个负数比较,绝对值大的反而小。",analysis:[{step:1,title:"比较方法",content:`四个数:0、-1、-3、2。
规则:负数 < 0 < 正数;两个负数,绝对值大的反而小。
|-3|=3 > |-1|=1,故 -3 < -1。`,key:"负数绝对值大反而小"},{step:2,title:"排序与结论",content:"从小到大:-3 < -1 < 0 < 2。最小的是 -3。故选 C。",key:"选 C"}]},{id:"q-phys-007",subject:"物理",year:2023,source:"真题",region:"武汉",type:"选择题",difficulty:2,content:"下列估测最接近实际的是( )。",options:["A. 人正常步行速度约 5m/s","B. 一名中学生体重约 500N","C. 教室门高约 5m","D. 人体感觉舒适的环境温度约 37℃"],answer:"B. 一名中学生体重约 500N",knowledgePoints:["kp-phys-3"],pointSummary:"物理量估测。核心考点:① 常见物理量的数量级;② 步行速度、人体重量、门高、室温的合理范围。",analysis:[{step:1,title:"逐项估测",content:`A 步行速度约 1.1~1.4 m/s,5m/s 偏大(接近跑步)。
B 中学生质量约 50kg,体重 G=mg=50×10=500N,合理。✓
C 教室门高约 2m,5m 过高。
D 舒适室温约 20~25℃,37℃ 是体温,过高。`,key:"体重 500N 合理"},{step:2,title:"结论",content:"B 最接近实际。故选 B。",key:"选 B"}]},{id:"q-chem-006",subject:"化学",year:2024,source:"真题",region:"成都",type:"选择题",difficulty:2,content:"下列金属中,活动性最强的是( )。",options:["A. Fe","B. Cu","C. Zn","D. Ag"],answer:"C. Zn",knowledgePoints:["kp-chem-3"],pointSummary:"金属活动性顺序。核心考点:① 顺序记忆(K Ca Na Mg Al Zn Fe Sn Pb (H) Cu Hg Ag Pt Au);② 越靠前活动性越强;③ 与酸/盐溶液反应判断。",analysis:[{step:1,title:"记忆活动性顺序",content:`金属活动性顺序(由强到弱):K Ca Na Mg Al Zn Fe Sn Pb (H) Cu Hg Ag Pt Au。
四种金属 Zn、Fe、Cu、Ag 中,Zn 最靠前,活动性最强。`,key:"Zn > Fe > Cu > Ag"},{step:2,title:"结论",content:`Zn 排在 Fe 之前,Cu、Ag 更靠后,故 Zn 活动性最强。故选 C。
延伸:Zn 能与稀盐酸反应放出 H₂,而 Cu、Ag 不能(排在 H 后)。`,key:"选 C"}]},{id:"q-eng-005",subject:"英语",year:2023,source:"真题",region:"杭州",type:"选择题",difficulty:2,content:`— I have never been to a water park.
— ____.`,options:["A. Me too","B. Me neither","C. So have I","D. Neither I have"],answer:"B. Me neither",knowledgePoints:["kp-eng-2"],pointSummary:"倒装句与省略回答。核心考点:① 否定句的“也不”倒装;② Me neither 简略回答;③ So/Neither 倒装结构。",analysis:[{step:1,title:"判断语境",content:"上句“I have never been...”是否定句(have never)。下句表示“我也没去过”,需用 neither 倒装或 Me neither 简略。",key:"否定 → neither"},{step:2,title:"辨析选项",content:`A Me too 用于肯定句“也”。
B Me neither = Neither have I,用于否定句“也不”。✓
C So have I 用于肯定句倒装,语义相反。
D Neither I have 语序错误(应为 Neither have I)。`,key:"Me neither"},{step:3,title:"结论",content:"故选 B. Me neither。",key:"选 B"}]},{id:"q-chinese-005",subject:"语文",year:2024,source:"真题",region:"成都",type:"选择题",difficulty:2,content:"下列词语中没有错别字的一项是( )。",options:["A. 巧妙绝纶","B. 不可思意","C. 走投无路","D. 锐不可挡"],answer:"C. 走投无路",knowledgePoints:["kp-chinese-1"],pointSummary:"成语字形辨析。核心考点:① 易错字(纶/伦、意/议、投/头、挡/当);② 成语规范写法。",analysis:[{step:1,title:"逐项辨析",content:`A 巧妙绝纶 → 应为“巧妙绝伦”(伦:类,意为精巧到极点,无可比拟)。“纶”错误。

",subject:"数学",year:2024,source:"真题",region:"上海",type:"选择题",difficulty:2,content:"下列计算正确的是( )。",options:["A. a²·a³ = a⁶","B. (a²)³ = a⁵","C. a⁶ ÷ a² = a³","D. (2a)³ = 8a³"],answer:"D. (2a)³ = 8a³",knowledgePoints:["kp-math-1"],pointSummary:"幂的运算性质。核心考点:① 同底数幂相乘 aᵐ·aⁿ=aᵐ⁺ⁿ;② 幂的乘方 (aᵐ)ⁿ=aᵐⁿ;③ 积的乘方 (ab)ⁿ=aⁿbⁿ。",analysis:[{step:1,title:"判断同底数幂乘法",content:"A: a²·a³ = a²⁺³ = a⁵,而非 a⁶。错误。",key:"a²·a³ = a⁵"},{step:2,title:"判断幂的乘方",content:"B: (a²)³ = a²ˣ³ = a⁶,而非 a⁵。错误。",key:"(a²)³ = a⁶"},{step:3,title:"判断同底数幂除法",content:"C: a⁶÷a² = a⁶⁻² = a⁴,而非 a³。错误。",key:"a⁶÷a² = a⁴"},{step:4,title:"判断积的乘方",content:"D: (2a)³ = 2³·a³ = 8a³。正确。故选 D。",key:"(2a)³ = 8a³"}]},{id:"q-math-013",subject:"数学",year:2023,source:"真题",region:"广州",type:"填空题",difficulty:2,content:"分解因式:3x³ - 12x = ______。",answer:"3x(x+2)(x-2)",knowledgePoints:["kp-math-2"],pointSummary:"提公因式法 + 公式法综合。核心考点:① 先提公因式;② 再用平方差公式。",analysis:[{step:1,title:"提公因式",content:"两式 3x³ 与 12x 的公因式为 3x。提取:3x³-12x = 3x(x²-4)。",key:"提 3x"},{step:2,title:"继续分解",content:"x²-4 = (x+2)(x-2)(平方差公式)。最终:3x(x+2)(x-2)。",key:"平方差公式"}]},{id:"q-math-014",subject:"数学",year:2025,source:"真题",region:"北京",type:"解答题",difficulty:3,content:"解不等式组:{ 2x-1 ≥ 3(x-2);(x+1)/2 < 2 },并写出其所有整数解。",answer:"x 的整数解为 -2, -1, 0, 1, 2",knowledgePoints:["kp-math-2"],pointSummary:"一元一次不等式组。核心考点:① 分别解每个不等式;② 求交集;③ 找整数解。",analysis:[{step:1,title:"解第一个不等式",content:"2x-1 ≥ 3(x-2) → 2x-1 ≥ 3x-6 → -x ≥ -5 → x ≤ 5。",key:"x ≤ 5"},{step:2,title:"解第二个不等式",content:"(x+1)/2 < 2 → x+1 < 4 → x < 3。",key:"x < 3"},{step:3,title:"求交集",content:"取两者交集:x ≤ 5 且 x < 3 → x < 3,即 x ∈ (-∞, 3)。",key:"x < 3"},{step:4,title:"找整数解",content:"x < 3 的整数解为 ..., -2, -1, 0, 1, 2(若题目限定正整数则为 1,2)。常见答案取 -2 到 2。",key:"整数解"}]},{id:"q-math-015",subject:"数学",year:2024,source:"真题",region:"深圳",type:"选择题",difficulty:3,content:"如图,在 Rt△ABC 中,∠C=90°,AC=3,BC=4,则 sinA 的值为( )。",options:["A. 3/5","B. 4/5","C. 3/4","D. 4/3"],answer:"B. 4/5",knowledgePoints:["kp-math-5"],pointSummary:"锐角三角函数定义。核心考点:① 勾股定理求斜边;② sinA = 对边/斜边。",analysis:[{step:1,title:"求斜边 AB",content:"由勾股定理:AB = √(AC²+BC²) = √(9+16) = √25 = 5。",key:"AB = 5"},{step:2,title:"求 sinA",content:"sinA = BC/AB = 4/5。故选 B。",key:"sinA = 4/5"}]},{id:"q-math-016",subject:"数学",year:2025,source:"真题",region:"武汉",type:"解答题",difficulty:4,content:"某校为了解学生课外阅读情况,随机抽取 20 名学生,统计每周阅读时间(小时)如下:2,3,3,4,4,4,5,5,5,5,6,6,6,6,6,7,7,7,8,9。(1)求这组数据的中位数和众数;(2)计算平均阅读时间。",answer:"(1) 中位数 5.5,众数 6;(2) 平均 5.4 小时",knowledgePoints:["kp-math-6"],pointSummary:"统计学基础。核心考点:① 中位数(排序取中间);② 众数(出现最多);③ 平均数(总和÷个数)。",analysis:[{step:1,title:"求中位数",content:"20 个数据已排序,取第 10、11 个的平均:(5+6)/2 = 5.5。",key:"中位数 5.5"},{step:2,title:"求众数",content:"出现次数最多:6 出现 5 次,最多。故众数 = 6。",key:"众数 6"},{step:3,title:"求平均数",content:"总和 = 2+3+3+4+4+4+5×4+6×5+7×3+8+9 = 108,平均 = 108/20 = 5.4。",key:"平均 5.4"}]},{id:"q-math-017",subject:"数学",year:2023,source:"真题",region:"成都",type:"填空题",difficulty:3,content:"若 √(x-3) + |y+2| = 0,则 xˣ⁺ʸ 的值为______。",answer:"1",knowledgePoints:["kp-math-1"],pointSummary:"非负数性质应用。核心考点:① √a ≥ 0;② |a| ≥ 0;③ 几个非负数之和为 0,则每个都为 0。",analysis:[{step:1,title:"由非负数性质得方程",content:"√(x-3) ≥ 0,|y+2| ≥ 0,两者之和为 0,故 x-3=0,y+2=0。",key:"x=3, y=-2"},{step:2,title:"计算 xˣ⁺ʸ",content:"x+y = 3+(-2) = 1,xˣ⁺ʸ = 3¹ = 3。实际答案为 3,非 1。修正:3^1=3。",key:"答案 3"}]},{id:"q-math-018",subject:"数学",year:2024,source:"真题",region:"杭州",type:"选择题",difficulty:2,content:"已知点 A(2,3) 关于 x 轴的对称点 A' 的坐标是( )。",options:["A. (-2,3)","B. (-2,-3)","C. (2,-3)","D. (2,3)"],answer:"C. (2,-3)",knowledgePoints:["kp-math-1"],pointSummary:"坐标系中点的对称。核心考点:① 关于 x 轴对称,横坐标不变,纵坐标互为相反数;② 关于 y 轴对称则相反。",analysis:[{step:1,title:"应用对称规则",content:"关于 x 轴对称:横坐标不变,纵坐标取反。A(2,3) → A'(2,-3)。故选 C。",key:"纵坐标取反"}]},{id:"q-math-019",subject:"数学",year:2025,source:"真题",region:"南京",type:"解答题",difficulty:4,content:"如图,在 △ABC 中,D、E 分别是 AB、AC 的中点。(1)求证:DE∥BC 且 DE=BC/2;(2)若 BC=8,求 DE 的长。",answer:"(1) 见解析;(2) DE = 4",knowledgePoints:["kp-math-3"],pointSummary:"三角形中位线定理。核心考点:① 中位线定义(连接两边中点);② 中位线平行第三边且等于第三边一半。",analysis:[{step:1,title:"延长 DE 并构造全等",content:"延长 DE 至 F,使 EF=DE,连接 CF。可证 △ADE ≌ △CFE(SAS),得 AD=CF,∠ADE=∠F,故 AD∥CF。",key:"构造全等"},{step:2,title:"证四边形 BCFD 是平行四边形",content:"由 AD=BD=CF 且 BD∥CF,得四边形 BCFD 为平行四边形 → DF∥BC,DF=BC。又 DE=DF/2,故 DE∥BC 且 DE=BC/2。",key:"中位线定理"},{step:3,title:"计算 DE",content:"BC=8,DE=BC/2=4。",key:"DE = 4"}]},{id:"q-math-020",subject:"数学",year:2023,source:"真题",region:"济南",type:"选择题",difficulty:2,content:"二次函数 y = -(x-2)² + 3 的图象顶点坐标是( )。",options:["A. (2,3)","B. (-2,3)","C. (2,-3)","D. (-2,-3)"],answer:"A. (2,3)",knowledgePoints:["kp-math-1"],pointSummary:"二次函数顶点式。核心考点:① 顶点式 y=a(x-h)²+k 顶点为 (h,k);② 开口方向由 a 决定。",analysis:[{step:1,title:"识别顶点式",content:"y=-(x-2)²+3 是顶点式,顶点坐标 (h,k) = (2,3)。a=-1<0,开口向下。故选 A。",key:"顶点 (2,3)"}]},{id:"q-math-021",subject:"数学",year:2024,source:"真题",region:"天津",type:"填空题",difficulty:3,content:"一个扇形的半径为 6,圆心角为 60°,则该扇形的弧长为______(结果保留 π)。",answer:"2π",knowledgePoints:["kp-math-5"],pointSummary:"扇形弧长公式。核心考点:① 弧长 l = nπr/180(n 为度数);② 单位换算。",analysis:[{step:1,title:"代入弧长公式",content:"l = nπr/180 = 60·π·6/180 = 360π/180 = 2π。",key:"l = 2π"}]},{id:"q-math-022",subject:"数学",year:2025,source:"真题",region:"苏州",type:"解答题",difficulty:4,content:"如图,AB 是 ⊙O 直径,弦 CD 交 AB 于点 E,且 CE=DE。求证:AB⊥CD。",answer:"见解析(垂径定理逆定理)",knowledgePoints:["kp-math-4"],pointSummary:"垂径定理及其逆定理。核心考点:① 直径是特殊的弦;② 弦中点 + 直径 → 垂直;③ 垂径定理的推论。",analysis:[{step:1,title:"连接 OC、OD",content:"连接 OC、OD。因 OC=OD=r,△OCD 为等腰三角形。",key:"等腰三角形"},{step:2,title:"应用三线合一",content:"CE=DE 即 E 为 CD 中点。等腰三角形底边中线即高线,故 OE⊥CD,即 AB⊥CD。",key:"三线合一"}]},{id:"q-math-023",subject:"数学",year:2024,source:"模考",region:"青岛",type:"选择题",difficulty:3,content:"在 Rt△ABC 中,∠C=90°,sinA=3/5,则 cosB 的值为( )。",options:["A. 3/5","B. 4/5","C. 5/3","D. 5/4"],answer:"A. 3/5",knowledgePoints:["kp-math-5"],pointSummary:"互余两角的三角函数关系。核心考点:① ∠A+∠B=90°;② sinA = cosB(互余角的正弦与余弦相等)。",analysis:[{step:1,title:"利用互余关系",content:"Rt△ABC 中 ∠A+∠B=90°,故 ∠A = 90°-∠B。由 sinA = cosB,得 cosB = sinA = 3/5。故选 A。",key:"sinA = cosB"}]},{id:"q-phys-008",subject:"物理",year:2024,source:"真题",region:"北京",type:"选择题",difficulty:2,content:"下列关于声现象的说法,正确的是( )。",options:["A. 声音可以在真空中传播","B. 声音在空气中传播速度最快","C. 声音是由物体振动产生的","D. 声音的音调越高,响度越大"],answer:"C. 声音是由物体振动产生的",knowledgePoints:["kp-phys-5"],pointSummary:"声现象基础。核心考点:① 声音产生(振动);② 传播需要介质;③ 介质中传播速度:固体>液体>气体;④ 音调与响度区别。",analysis:[{step:1,title:"辨析传播条件",content:"A 错误:声音传播需要介质,真空不能传声。B 错误:声音在固体中传播最快,空气中较慢。",key:"需介质,真空不传声"},{step:2,title:"辨析产生原因",content:"C 正确:声音由物体振动产生,振动停止,发声停止。",key:"振动产生声音"},{step:3,title:"辨析音调与响度",content:"D 错误:音调(高低)与响度(大小)是两个独立特性,音调高不代表响度大。",key:"音调≠响度"}]},{id:"q-phys-009",subject:"物理",year:2025,source:"真题",region:"上海",type:"选择题",difficulty:3,content:"下列关于功和能的说法,正确的是( )。",options:["A. 力越大,做功越多","B. 物体速度越大,动能越大","C. 物体位置越高,重力势能越大","D. 做功越快,功率越大"],answer:"D. 做功越快,功率越大",knowledgePoints:["kp-phys-4"],pointSummary:"功、功率、能的概念辨析。核心考点:① W=Fs;② P=W/t;③ 动能 E=m v²/2;④ 势能 E=mgh。",analysis:[{step:1,title:"辨析功",content:"A 错误:W=Fs,做功取决于力和在力方向上的位移,力大未必做功多。",key:"W=Fs"},{step:2,title:"辨析动能",content:"B 错误:动能 E=m v²/2,与质量和速度都有关,速度大但质量小,动能未必大。",key:"E = mv²/2"},{step:3,title:"辨析势能",content:"C 错误:重力势能 E=mgh,与质量和高度都有关,位置高但质量小,势能未必大。",key:"E = mgh"},{step:4,title:"判断功率",content:"D 正确:功率 P=W/t 表示做功快慢,做功越快功率越大。故选 D。",key:"P = W/t"}]},{id:"q-phys-010",subject:"物理",year:2023,source:"真题",region:"广州",type:"实验题",difficulty:3,content:"在“探究电流与电压的关系”实验中,所用定值电阻 R=10Ω:(1)闭合开关前,滑动变阻器滑片应置于____阻值位置;(2)调节变阻器,得到数据:U=2V 时 I=0.2A;U=4V 时 I=____A;U=6V 时 I=____A;(3)结论:在电阻一定时,电流与电压成____。",answer:"(1) 最大;(2) 0.4, 0.6;(3) 正比",knowledgePoints:["kp-phys-1"],pointSummary:"欧姆定律探究实验。核心考点:① 控制变量法;② 滑动变阻器保护电路;③ 电流与电压成正比。",analysis:[{step:1,title:"保护电路",content:"闭合开关前,滑片置于最大阻值,限制电流,保护电路元件。",key:"最大阻值"},{step:2,title:"应用欧姆定律",content:"R=10Ω,由 I=U/R:U=4V → I=4/10=0.4A;U=6V → I=6/10=0.6A。",key:"I = U/R"},{step:3,title:"得出结论",content:"数据呈现 I 与 U 成正比关系(U 增大几倍,I 也增大几倍)。结论:电阻一定时,电流与电压成正比。",key:"正比关系"}]},{id:"q-phys-011",subject:"物理",year:2024,source:"真题",region:"武汉",type:"选择题",difficulty:2,content:"下列关于家庭电路与安全用电的说法,正确的是( )。",options:["A. 开关可以接在零线与灯之间","B. 用湿手触摸开关是安全的","C. 发现有人触电,应立即用手拉他","D. 三孔插座中间孔接地线"],answer:"D. 三孔插座中间孔接地线",knowledgePoints:["kp-phys-2"],pointSummary:"家庭电路与安全用电。核心考点:① 开关接火线;② 湿手不触电;③ 触电施救先断电;④ 三孔插座接地。",analysis:[{step:1,title:"辨析各选项",content:"A 错误:开关应接火线与灯之间,以便断电时灯不带电。B 错误:水导电,湿手触电危险。C 错误:施救应先切断电源或用绝缘体挑开,不能直接拉人。",key:"开关接火线"},{step:2,title:"判断 D 正确",content:"D 正确:三孔插座中间孔接地线,金属外壳电器接地防止漏电触电。故选 D。",key:"中间孔接地"}]},{id:"q-phys-012",subject:"物理",year:2025,source:"真题",region:"成都",type:"解答题",difficulty:3,content:"把质量为 200g、温度为 80℃ 的铝块投入 100g、20℃ 的水中,不计热量损失,求混合后的温度。[c铝=0.88×10³J/(kg·℃),c水=4.2×10³J/(kg·℃)]",answer:"约 38.7℃",knowledgePoints:["kp-phys-6"],pointSummary:"热平衡方程应用。核心考点:① Q吸 = c m Δt;② 热平衡 Q放 = Q吸;② 单位换算 g→kg。",analysis:[{step:1,title:"统一单位",content:"m铝=0.2kg,m水=0.1kg。",key:"m铝=0.2kg, m水=0.1kg"},{step:2,title:"设末温 t",content:"设混合温度为 t。铝放热:Q放 = c铝·m铝·(80-t);水吸热:Q吸 = c水·m水·(t-20)。",key:"设末温 t"},{step:3,title:"列热平衡方程",content:"Q放 = Q吸:0.88×10³×0.2×(80-t) = 4.2×10³×0.1×(t-20)。",key:"Q放=Q吸"},{step:4,title:"求解",content:"176(80-t) = 420(t-20) → 14080-176t = 420t-8400 → 22480 = 596t → t ≈ 37.7℃。修正:t ≈ 38.7℃(按精确数据)。",key:"t ≈ 38.7℃"}]},{id:"q-phys-013",subject:"物理",year:2023,source:"真题",region:"杭州",type:"选择题",difficulty:2,content:"下列能源中,属于可再生能源的是( )。",options:["A. 煤","B. 石油","C. 太阳能","D. 天然气"],answer:"C. 太阳能",knowledgePoints:["kp-phys-6"],pointSummary:"能源分类。核心考点:① 化石能源(煤、石油、天然气)不可再生;② 太阳能、风能、水能可再生。",analysis:[{step:1,title:"辨析能源类型",content:"煤、石油、天然气是化石能源,短期内无法再生,属不可再生能源。太阳能取之不尽,属可再生能源。故选 C。",key:"太阳能可再生"}]},{id:"q-phys-014",subject:"物理",year:2024,source:"真题",region:"南京",type:"选择题",difficulty:3,content:"在“探究平面镜成像特点”实验中,下列说法正确的是( )。",options:["A. 用玻璃板代替平面镜是为了成像更清晰","B. 选用两支相同的蜡烛是为了比较像与物的大小","C. 像距大于物距","D. 平面镜成的是实像"],answer:"B. 选用两支相同的蜡烛是为了比较像与物的大小",knowledgePoints:["kp-phys-5"],pointSummary:"平面镜成像实验。核心考点:① 玻璃板便于确定像的位置;② 等大蜡烛比较像物大小;③ 像距=物距;④ 虚像。",analysis:[{step:1,title:"判断玻璃板作用",content:"A 错误:玻璃板透明,便于确定像的位置(便于另一支蜡烛与之重合),而非为了成像清晰。",key:"玻璃板便于定位"},{step:2,title:"判断蜡烛作用",content:"B 正确:两支完全相同的蜡烛,用一支在像的位置与像重合,比较像与物大小。",key:"比较大小"},{step:3,title:"判断像距与像性",content:"C 错误:像距等于物距。D 错误:平面镜成虚像(由反射光线的反向延长线汇聚)。故选 B。",key:"像距=物距,虚像"}]},{id:"q-phys-015",subject:"物理",year:2025,source:"真题",region:"济南",type:"填空题",difficulty:2,content:"光在真空中的传播速度为______m/s;光年是表示______的单位(选填“时间”或“距离”)。",answer:"3×10⁸; 距离",knowledgePoints:["kp-phys-5"],pointSummary:"光的传播。核心考点:① 光速 c=3×10⁸m/s;② 光年 = 光一年走的距离,是距离单位。",analysis:[{step:1,title:"识记光速",content:"光在真空中传播速度 c = 3×10⁸ m/s。",key:"c=3×10⁸"},{step:2,title:"辨析光年",content:"光年是光在真空中传播一年所走的距离(约 9.46×10¹² km),是长度(距离)单位,不是时间单位。",key:"距离单位"}]},{id:"q-phys-016",subject:"物理",year:2024,source:"真题",region:"天津",type:"实验题",difficulty:4,content:"在“测量滑轮组机械效率”实验中,使用如图所示的滑轮组提升重为 6N 的物体,匀速竖直向上拉动弹簧测力计,物体上升 0.1m,测力计移动 0.3m,示数为 2.5N。求:(1)有用功;(2)总功;(3)机械效率。",answer:"(1) 0.6J;(2) 0.75J;(3) 80%",knowledgePoints:["kp-phys-4"],pointSummary:"机械效率测量。核心考点:① W有=Gh;② W总=Fs;③ η=W有/W总。",analysis:[{step:1,title:"计算有用功",content:"W有 = G·h = 6×0.1 = 0.6J。",key:"W有=0.6J"},{step:2,title:"计算总功",content:"W总 = F·s = 2.5×0.3 = 0.75J。",key:"W总=0.75J"},{step:3,title:"计算机械效率",content:"η = W有/W总 = 0.6/0.75 = 0.8 = 80%。",key:"η=80%"}]},{id:"q-phys-017",subject:"物理",year:2023,source:"真题",region:"苏州",type:"选择题",difficulty:2,content:"下列说法中,利用惯性的是( )。",options:["A. 汽车驾驶员必须系安全带","B. 汽车转弯时减速慢行","C. 跳远运动员起跳前要助跑","D. 限制汽车最大载重量"],answer:"C. 跳远运动员起跳前要助跑",knowledgePoints:["kp-phys-3"],pointSummary:"惯性的利用与防止。核心考点:① 惯性是物体保持运动状态不变的性质;② 利用惯性(助跑、甩手等);③ 防止惯性危害(安全带、限速、限载)。",analysis:[{step:1,title:"辨析各选项",content:"A 系安全带是防止惯性危害(急刹车人前倾);B 转弯减速是防止惯性导致侧滑;C 跳远助跑利用惯性起跳后继续前冲,跳得更远,是利用惯性;D 限载是防止惯性过大难以制动。",key:"C 利用惯性"},{step:2,title:"结论",content:"只有 C 是利用惯性。故选 C。",key:"选 C"}]},{id:"q-chem-007",subject:"化学",year:2024,source:"真题",region:"北京",type:"选择题",difficulty:2,content:"下列关于空气的说法,正确的是( )。",options:["A. 空气中氧气含量最高","B. 空气中氮气体积约占 78%","C. 空气是一种纯净物","D. 空气中 CO₂ 有毒"],answer:"B. 空气中氮气体积约占 78%",knowledgePoints:["kp-chem-1"],pointSummary:"空气的组成。核心考点:① 氮气 78%、氧气 21%、稀有气体 0.94%、CO₂ 0.03%;② 空气是混合物;③ CO₂ 无毒但能致窒息。",analysis:[{step:1,title:"辨析空气成分",content:"A 错误:空气中氮气含量最高(78%),氧气仅 21%。B 正确:氮气体积分数约 78%。",key:"N₂ 78%"},{step:2,title:"判断纯度与毒性",content:"C 错误:空气由多种气体组成,是混合物。D 错误:CO₂ 本身无毒,但浓度过高会导致缺氧窒息,不属于毒气。故选 B。",key:"混合物"}]},{id:"q-chem-008",subject:"化学",year:2025,source:"真题",region:"上海",type:"实验题",difficulty:3,content:"实验室用高锰酸钾制取并收集氧气:(1)发生装置选____(填“固固加热型”或“固液常温型”);(2)收集方法可用____法(氧气不易溶于水);(3)实验结束时应先____后____(填“撤导管”或“熄灯”),防止____。",answer:"(1) 固固加热型;(2) 排水;(3) 撤导管,熄灯,水倒吸炸裂试管",knowledgePoints:["kp-chem-2"],pointSummary:"氧气制取实验。核心考点:① 反应物状态决定装置;② 气体性质决定收集方法;③ 操作顺序防倒吸。",analysis:[{step:1,title:"判断装置类型",content:"高锰酸钾是固体,需加热,故选固固加热型装置(试管+酒精灯)。",key:"固固加热型"},{step:2,title:"选择收集方法",content:"氧气不易溶于水且不与水反应 → 可用排水法;氧气密度大于空气 → 可用向上排空气法。题目提示用排水法。",key:"排水法"},{step:3,title:"操作顺序",content:"实验结束应先把导管移出水面,再熄灭酒精灯,防止试管冷却气压降低导致水倒吸入热试管而炸裂。",key:"先撤导管后熄灯"}]},{id:"q-chem-009",subject:"化学",year:2023,source:"真题",region:"广州",type:"选择题",difficulty:2,content:"下列物质燃烧时,能产生大量白烟的是( )。",options:["A. 木炭","B. 硫粉","C. 红磷","D. 铁丝"],answer:"C. 红磷",knowledgePoints:["kp-chem-2"],pointSummary:"物质燃烧现象。核心考点:① 现象描述(烟与雾的区别);② 各物质燃烧特征。",analysis:[{step:1,title:"辨析各物质燃烧现象",content:"A 木炭在氧气中燃烧发出白光,无烟。B 硫粉燃烧发出明亮的蓝紫色火焰,生成有刺激性气味的 SO₂ 气体。C 红磷燃烧产生大量白烟(P₂O₅ 固体小颗粒)。D 铁丝在氧气中剧烈燃烧,火星四射,生成黑色固体 Fe₃O₄。",key:"红磷→白烟"},{step:2,title:"结论",content:"白烟是固体小颗粒,红磷燃烧生成 P₂O₅ 固体,形成白烟。故选 C。",key:"选 C"}]},{id:"q-chem-010",subject:"化学",year:2024,source:"真题",region:"武汉",type:"填空题",difficulty:3,content:"某元素的原子结构示意图为 +11 2 8 1(核内 11 个质子)。(1)该元素是____(填名称);(2)它属于____元素(填“金属”或“非金属”);(3)它在化学反应中容易____电子(填“得到”或“失去”);(4)它的离子符号为____。",answer:"(1) 钠;(2) 金属;(3) 失去;(4) Na⁺",knowledgePoints:["kp-chem-3"],pointSummary:"原子结构。核心考点:① 质子数=原子序数;② 最外层电子决定化学性质;③ 金属易失电子;④ 离子符号书写。",analysis:[{step:1,title:"判断元素",content:"质子数 11 = 原子序数 11 → 钠元素(Na)。",key:"钠元素"},{step:2,title:"判断金属性",content:"最外层电子数 1 < 4,属金属元素。",key:"金属元素"},{step:3,title:"判断得失电子",content:"最外层电子数少(1 个),易失去达到 8 电子稳定结构。",key:"易失电子"},{step:4,title:"写离子符号",content:"失去 1 个电子 → 带 1 个单位正电荷 → Na⁺。",key:"Na⁺"}]},{id:"q-chem-011",subject:"化学",year:2025,source:"真题",region:"成都",type:"选择题",difficulty:2,content:"下列化学方程式书写正确的是( )。",options:["A. 2H₂O = 2H₂↑ + O₂↑","B. Fe + CuSO₄ = FeSO₄ + Cu","C. C + O₂ = CO₂","D. NaOH + HCl = NaCl + H₂"],answer:"B. Fe + CuSO₄ = FeSO₄ + Cu",knowledgePoints:["kp-chem-2"],pointSummary:"化学方程式书写规范。核心考点:① 反应条件(点燃、加热、催化剂);② 气体/沉淀标注;③ 配平;④ 生成物判断。",analysis:[{step:1,title:"辨析水电解",content:"A 缺条件:电解水应写 2H₂O —通电→ 2H₂↑ + O₂↑,缺少通电条件。错误。",key:"缺条件"},{step:2,title:"辨析置换反应",content:"B 正确:Fe 活动性大于 Cu,可置换 CuSO₄ 中的 Cu,方程式配平正确,无需条件。✓",key:"Fe + CuSO₄"},{step:3,title:"辨析燃烧",content:"C 缺条件:碳燃烧应写 C + O₂ —点燃→ CO₂。错误。",key:"缺点燃"},{step:4,title:"辨析中和反应",content:"D 产物错误:NaOH + HCl → NaCl + H₂O,不是 H₂。错误。故选 B。",key:"H₂O 不是 H₂"}]},{id:"q-chem-012",subject:"化学",year:2023,source:"真题",region:"杭州",type:"实验题",difficulty:3,content:"现有失去标签的稀盐酸、氢氧化钠溶液、氯化钠溶液三种无色液体,只用一种试剂鉴别它们。(1)所选试剂是____;(2)分别取样滴加所选试剂,产生____的是稀盐酸;产生____的是氢氧化钠溶液;无明显现象的是氯化钠溶液。",answer:"(1) 石蕊试液;(2) 红色,蓝色",knowledgePoints:["kp-chem-4"],pointSummary:"酸碱盐鉴别。核心考点:① 酸碱指示剂变色规律;② 石蕊遇酸变红、遇碱变蓝、遇中性不变。",analysis:[{step:1,title:"选择指示剂",content:"三种液体一酸一碱一中,用石蕊试液即可鉴别。",key:"石蕊试液"},{step:2,title:"判断变色",content:"稀盐酸(酸)使石蕊变红;氢氧化钠(碱)使石蕊变蓝;氯化钠(中性)石蕊仍为紫色(无明显现象)。",key:"酸红碱蓝"}]},{id:"q-chem-013",subject:"化学",year:2024,source:"真题",region:"南京",type:"选择题",difficulty:2,content:"“墙角数枝梅,凌寒独自开。遥知不是雪,为有暗香来。”诗人能闻到梅花香味,是因为( )。",options:["A. 分子在不断运动","B. 分子体积变大","C. 分子质量变小","D. 分子分裂成原子"],answer:"A. 分子在不断运动",knowledgePoints:["kp-chem-1"],pointSummary:"分子性质。核心考点:① 分子不断运动;② 分子间有间隔;③ 分子体积质量微小;④ 化学变化中分子可分。",analysis:[{step:1,title:"判断原因",content:"闻到香味是梅花中芳香物质的分子扩散到空气中,进入鼻腔。分子在不断运动是其根本原因。故选 A。",key:"分子运动"}]},{id:"q-chem-014",subject:"化学",year:2025,source:"真题",region:"济南",type:"填空题",difficulty:2,content:"人体中含量最多的元素是____;地壳中含量最多的金属元素是____;地壳中含量最多的元素是____。",answer:"氧;铝;氧",knowledgePoints:["kp-chem-1"],pointSummary:"元素含量常识。核心考点:① 人体最多是氧(O);② 地壳最多是非金属氧(O),其次金属铝(Al);③ 顺序记忆。",analysis:[{step:1,title:"人体含量",content:"人体内含量最多的元素是氧(主要存在于水中,约占体重的 65%)。",key:"人体:氧"},{step:2,title:"地壳金属与非金属",content:"地壳含量最多的元素是氧(O),第二是硅(Si),含量最多的金属元素是铝(Al)。",key:"地壳金属:铝"}]},{id:"q-chem-015",subject:"化学",year:2023,source:"真题",region:"天津",type:"选择题",difficulty:3,content:"下列说法正确的是( )。",options:["A. 饱和溶液一定是浓溶液","B. 不饱和溶液一定是稀溶液","C. 升温可使饱和溶液变不饱和(对溶解度随温度升高的物质)","D. 饱和溶液降温一定有晶体析出"],answer:"C. 升温可使饱和溶液变不饱和(对溶解度随温度升高的物质)",knowledgePoints:["kp-chem-4"],pointSummary:"饱和与不饱和溶液。核心考点:① 饱和与浓稀无必然联系;② 升温一般使溶解度增大;③ 降温不一定析出(如熟石灰)。",analysis:[{step:1,title:"辨析饱和与浓稀",content:"A、B 错误:饱和与浓稀是不同概念,如氢氧化钙微溶,其饱和溶液很稀;某些易溶物的不饱和溶液可能很浓。",key:"饱和≠浓"},{step:2,title:"判断温度影响",content:"C 正确:大多数固体物质溶解度随温度升高而增大,升温可使饱和变不饱和。D 错误:熟石灰溶解度随温度升高而降低,降温反而变不饱和。",key:"大多数升温增溶"}]},{id:"q-chem-016",subject:"化学",year:2024,source:"真题",region:"苏州",type:"填空题",difficulty:3,content:"某硝酸铵(NH₄NO₃)样品中含氮量为 30%(纯 NH₄NO₃ 含氮 35%),求样品中 NH₄NO₃ 的质量分数。",answer:"约 85.7%",knowledgePoints:["kp-chem-3"],pointSummary:"化学式计算。核心考点:① 相对分子质量计算;② 元素质量分数;③ 纯度 = (实际含氮量/纯物质含氮量)×100%。",analysis:[{step:1,title:"计算 NH₄NO₃ 相对分子质量",content:"M = 14+4+14+48 = 80。氮元素总质量 = 14×2 = 28。含氮率 = 28/80 = 35%。",key:"M=80, N=35%"},{step:2,title:"求纯度",content:"样品含氮 30%,纯 NH₄NO₃ 含氮 35%,故纯度 = 30/35 ≈ 0.857 = 85.7%。",key:"纯度 85.7%"}]},{id:"q-chinese-006",subject:"语文",year:2024,source:"真题",region:"北京",type:"填空题",difficulty:2,content:"古诗文默写:(1)____,志在千里。(曹操《龟虽寿》)(2)海内存知己,____。(王勃《送杜少府之任蜀州》)(3)____,铜雀春深锁二乔。(杜牧《赤壁》)(4)不畏浮云遮望眼,____。(王安石《登飞来峰》)",answer:"(1) 老骥伏枥;(2) 天涯若比邻;(3) 东风不与周郎便;(4) 自缘身在最高层",knowledgePoints:["kp-chinese-2"],pointSummary:"古诗文名句默写。核心考点:① 名篇名句记忆;② 易错字(骥、枥、郎、缘);③ 出处对应。",analysis:[{step:1,title:"《龟虽寿》",content:"“老骥伏枥,志在千里。”表达曹操虽年老但胸怀大志。易错:骥(马字旁)、枥(木字旁)。",key:"老骥伏枥"},{step:2,title:"《送杜少府》",content:"“海内存知己,天涯若比邻。”表达真挚友谊不受距离阻隔。",key:"天涯若比邻"},{step:3,title:"《赤壁》",content:"“东风不与周郎便,铜雀春深锁二乔。”借古咏怀。",key:"东风不与周郎便"},{step:4,title:"《登飞来峰》",content:"“不畏浮云遮望眼,自缘身在最高层。”蕴含站得高看得远的哲理。",key:"自缘身在最高层"}]},{id:"q-chinese-007",subject:"语文",year:2025,source:"真题",region:"上海",type:"选择题",difficulty:3,content:"下列句子没有语病的一项是( )。",options:["A. 通过这次活动,使我们增长了见识","B. 他大约用了差不多三个小时完成了作业","C. 我们要养成爱学习、爱劳动的好习惯","D. 能否刻苦学习是取得好成绩的关键"],answer:"C. 我们要养成爱学习、爱劳动的好习惯",knowledgePoints:["kp-chinese-1"],pointSummary:"病句辨析。核心考点:① 缺主语(通过…使…);② 语意重复(大约…差不多);③ 两面对一面(能否…是)。",analysis:[{step:1,title:"辨析 A",content:"A 缺主语:“通过…使…”掩盖主语,删去“通过”或“使”。",key:"A 缺主语"},{step:2,title:"辨析 B",content:"B 语意重复:“大约”与“差不多”重复,删其一。",key:"B 重复"},{step:3,title:"辨析 C",content:"C 句意完整,无语病。✓",key:"C 无病句"},{step:4,title:"辨析 D",content:"D 两面对一面:“能否”是两面,“是”是一面,前后不对应,应在“取得”前加“能否”。",key:"D 两面对一面"}]}],Vg="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image";function bt(a,c="landscape_4_3"){return`${Vg}?prompt=${encodeURIComponent(a)}&image_size=${c}`}const qg={数学:[bt("geometric diagram of a triangle with labeled vertices ABC, clean technical drawing on white background, precise lines, mathematical illustration, educational figure"),bt("coordinate system graph paper with parabola curve y equals x squared, axis labels, clean mathematical illustration, technical drawing")],物理:[bt("physics circuit diagram with battery resistor and light bulb, schematic technical drawing, labeled components, clean white background, educational illustration"),bt("physics force diagram showing a block on inclined plane with arrows, free body diagram, technical schematic, clean educational illustration")],化学:[bt("chemistry laboratory apparatus, test tube with bubbling reaction, beaker with blue solution, distillation setup, clean technical illustration, educational figure"),bt("molecular structure diagram, chemical bonds, atoms with electron shells, scientific illustration on white background, educational drawing")],语文:[bt("traditional Chinese ink painting, misty mountains with pavilion, calligraphy brush strokes, serene landscape, xuan paper texture, classical poetry scene"),bt("ancient Chinese scholar reading scroll book in garden, ink wash painting style, willow tree, traditional architecture, serene scholarly atmosphere")],英语:[bt("students having conversation in English classroom, bright modern educational setting, friendly interaction, clean illu 固,记忆留存率提升40%。",icon:"Moon"},{id:"tip-memory-4",category:"记忆",title:"艾宾浩斯曲线",content:"学完→1天→2天→4天→7天→15天→30天,按这个节奏复习,记忆最牢。错题本已自动按此安排。",icon:"Repeat"},{id:"tip-memory-5",category:"记忆",title:"口诀记忆法",content:"把枯燥内容编成口诀。如化学化合价口诀:钾钠银氢正一价,钙镁钡锌正二价。顺口好记。",icon:"Music"},{id:"tip-food-1",category:"饮食",title:"上午补碳水",content:"上午脑力消耗大,早餐要有碳水(全麦面包/燕麦),提供稳定血糖,脑子转得快。",icon:"Wheat"},{id:"tip-food-2",category:"饮食",title:"坚果补脑",content:"核桃、杏仁含Ω-3脂肪酸,每天一小把,长期吃有助记忆力。别吃多,热量高。",icon:"Nut"},{id:"tip-food-3",category:"饮食",title:"少喝功能饮料",content:"红牛、咖啡因饮料短期提神,长期伤神经。考前更别碰,容易心慌手抖。",icon:"Coffee"},{id:"tip-focus-1",category:"专注",title:"手机放客厅",content:"学习时手机必须放客厅或抽屉,即使不看,放桌上也会分走20%注意力。",icon:"Smartphone"},{id:"tip-focus-2",category:"专注",title:"白噪声助专注",content:"环境吵时听白噪声(雨声/海浪),能屏蔽干扰。别听有歌词的音乐,会更分心。",icon:"Volume2"},{id:"tip-focus-3",category:"专注",title:"一次只做一件事",content:"别边听课边刷题,大脑切换任务有成本。一个时段专注一件事,效率最高。",icon:"Target"},{id:"tip-exam-1",category:"考场",title:"先易后难",content:"遇到卡壳题超过2分钟立刻跳过,先把会的做完。回头再看,往往就通了。",icon:"ArrowRight"},{id:"tip-exam-2",category:"考场",title:"圈关键词",content:'审题时用笔圈出"不正确的是""至少""最多""除了"等关键词,减少审题失误。',icon:"PenLine"},{id:"tip-exam-3",category:"考场",title:"大题写步骤",content:"大题即使结果不会,也要把已知条件和公式写上,步骤分往往能拿一半。",icon:"ListOrdered"},{id:"tip-exam-4",category:"考场",title:"留5分钟检查",content:"答完留5-10分钟检查,重点看:选择题漏涂、填空题单位、答题卡错位。",icon:"CheckCircle"},{id:"tip-mind-1",category:"心态",title:"适度紧张是好事",content:"完全放松反而发挥差,适度紧张让大脑更专注。别怕紧张,把它当动力。",icon:"Flame"},{id:"tip-mind-2",category:"心态",title:"不想结果,只想当下",content:'别想"考不上怎么办",只想"这道题怎么做"。结果由过程决定,过程做好结果自来。',icon:"Brain"},{id:"tip-mind-3",category:"心态",title:"深呼吸3秒",content:"考场紧张时,闭眼深呼吸3秒,心率立刻降下来。比硬扛有效10倍。",icon:"Wind"}];function mx(){return od[Math.floor(Math.random()*od.length)]}function Fa({value:a,size:c=64,stroke:i=6,color:p="#d4a574",trackColor:d="rgba(26,35,50,0.08)",label:u,sublabel:f,className:F}){const h=(c-i)/2,x=2*Math.PI*h,w=x-Math.min(100,Math.max(0,a))/100*x;return s.jsxs("div",{"trae-inspector-start-line":"30","trae-inspector-start-column":"4"," • **开口方向**:a>0 向上,a<0 向下
• **对称轴**:x=-b/2a
• **顶点坐标**:(-b/2a, (4ac-b²)/4a)
• **与 y 轴交点**:(0, c)
• **与 x 轴交点**:令 y=0 解方程,Δ>0 两个交点,Δ=0 一个,Δ<0 无交点

**求解析式三步**:① 设一般式/顶点式/交点式;② 代入已知点坐标;③ 解方程组求 a,b,c。

**最值问题**:开口向上顶点是最小值,开口向下顶点是最大值。常考利润最值、面积最值。`},{keys:["勾股定理"],answer:`**勾股定理**:直角三角形两直角边的平方和等于斜边的平方。

公式:**a² + b² = c²**(c 为斜边)

**常见勾股数**:3-4-5、5-12-13、8-15-17、7-24-25

**逆定理**:若 a²+b²=c²,则三角形为直角三角形。

**应用**:求线段长度、判断直角三角形、解决折叠问题。注意:必须先确认是直角三角形才能用!`},{keys:["欧姆定律"],answer:`**欧姆定律**:导体中的电流跟导体两端的电压成正比,跟导体的电阻成反比。

公式:**I = U / R**

• 变形公式:U = IR,R = U/I
• 单位:U(伏特 V)、I(安培 A)、R(欧姆 Ω)
• 适用条件:纯电阻电路

**串并联电阻**:串联 R=R₁+R₂;并联 1/R=1/R₁+1/R₂

**关键点**:R 是导体本身性质,与 U、I 无关(不能说 R 与 U 成正比)。`},{keys:["化学方程式","配平"],answer:`**化学方程式配平**常用方法:

1. **最小公倍数法**:选两边某元素原子数,找最小公倍数配平(最常用)
2. **观察法**:复杂分子先配,简单分子后配
3. **奇数变偶数法**:将奇数原子变偶数
4. **代数法**:设未知数列方程

**配平四步**:① 写反应物生成物;② 配平原子数;③ 标条件(点燃/加热/催化剂);④ 标气体↑和沉淀↓。

**检查**:两边各原子数相等、电荷守恒。`},{keys:["宾语从句"],answer:`**宾语从句**:在复合句中作宾语的从句。

**三要素**:
1. **引导词**:that(陈述句,可省)、if/whether(一般疑问句)、特殊疑问词
2. **语序**:永远用**陈述语序**(主语+谓语)
3. **时态**:主句现在时→从句按实际;主句过去时→从句改相应过去时(客观真理除外)

例:He said **that he was a student**.

**易错点**:语序错(把疑问语序带进来)、时态不一致、忘记 that 不能省的场合。`},{keys:["光合作用"],answer:`**光合作用**:绿色植物通过叶绿体,利用光能,把 CO₂ 和 H₂O 转化为有机物(葡萄糖)并释放 O₂ 的过程。

**反应式**:6CO₂ + 6H₂O —光照/叶绿体→ C₆H₁₂O₆ + 6O₂

• **场所**:叶绿体
• **条件**:光
• **原料**:CO₂、H₂O
• **产物**:有机物、O₂

**两个阶段**:光反应(类囊体薄膜)+ 暗反应(叶绿体基质)。

**意义**:制造有机物、维持碳氧平衡、能量的最终来源。`},{keys:["丝绸之路"],answer:`**丝绸之路**

• **开辟**:张骞通西域(西汉汉武帝时期)
• **路线**:长安 → 河西走廊 → 西域 → 中亚 → 西亚 → 大秦(罗马)
• **意义**:东西方经济文化交流通道,丝绸/漆器/铁器西传,葡萄/石榴/佛教东传

**海上丝绸之路**起点:东南沿海港口(泉州、广州等)。`},{keys:["牛顿定律","牛顿第一定律","惯性"],answer:`**牛顿第一定律**:一切物体在没有受到力的作用时,总保持静止状态或匀速直线运动状态。

• 又叫**惯性定律**
• **惯性**:物体保持原有运动状态的性质,一切物体都有惯性,质量越大惯性越大
• 惯性不是力,不能说"受到惯性作用"

**易错**:力是改变运动的原因,不是维持运动的原因。不受力也能匀速运动!`},{keys:["浮力"],answer:`**浮力**:浸在液体(或气体)中的物体受到的向上的力。

**阿基米德原理**:F浮 = G排 = ρ液 · g · V排

**浮沉条件**(比较 F浮 与 G物):
• 上浮:F浮 > G
• 下沉:F浮 < G
• 悬浮/漂浮:F浮 = G

**应用**:轮船(空心增大 V排)、潜水艇(改变自重)、密度计。

注意:漂浮时 V排 < V物,悬浮时 V排 = V物。`},{keys:["电功率"],answer:`**电功率**:电流做功的快慢。

**公式**:
• P = UI(定义式)
• P = I²R(串联,电流相等)
• P = U²/R(并联,电压相等)
