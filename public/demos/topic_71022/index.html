<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>微光星球 - 让成长有温度</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div id="app">
    <nav class="navbar">
      <div class="nav-brand">
        <div class="logo-icon">🌍</div>
        <span class="brand-name">微光星球</span>
      </div>
      <div class="nav-links">
        <button class="nav-btn active" data-page="home">首页</button>
        <button class="nav-btn" data-page="planet">星球</button>
        <button class="nav-btn" data-page="library">图书馆</button>
        <button class="nav-btn" data-page="leaderboard">排行榜</button>
        <button class="nav-btn" data-page="donations">公益</button>
      </div>
    </nav>

    <main class="main-content">
      <section id="page-home" class="page active">
        <div class="hero-section">
          <div class="hero-content">
            <h1>微光星球</h1>
            <p>让成长有温度，让善意可积累</p>
            <div class="hero-stats">
              <div class="stat-card">
                <div class="stat-value" id="home-prosperity">0</div>
                <div class="stat-label">繁荣度</div>
              </div>
              <div class="stat-card">
                <div class="stat-value" id="home-trees">0</div>
                <div class="stat-label">已种植树木</div>
              </div>
              <div class="stat-card">
                <div class="stat-value" id="home-donations">0</div>
                <div class="stat-label">公益捐赠(元)</div>
              </div>
              <div class="stat-card">
                <div class="stat-value" id="home-streak">0</div>
                <div class="stat-label">连续打卡(天)</div>
              </div>
            </div>
          </div>
          <div class="hero-visual">
            <div class="mini-planet">
              <div class="planet-surface">
                <div class="tree-1"></div>
                <div class="tree-2"></div>
                <div class="tree-3"></div>
                <div class="tree-4"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="section">
          <h2 class="section-title">🌱 今日行动</h2>
          <div class="action-grid" id="action-grid">
          </div>
        </div>

        <div class="section">
          <h2 class="section-title">🏆 我的成就</h2>
          <div class="achievement-grid" id="achievement-grid">
          </div>
        </div>

        <div class="section">
          <h2 class="section-title">📊 本周挑战</h2>
          <div class="challenge-card" id="challenge-card">
          </div>
        </div>
      </section>

      <section id="page-planet" class="page">
        <div class="planet-container">
          <div class="planet-header">
            <h2>我的星球</h2>
            <div class="planet-level">等级 <span id="planet-level">1</span></div>
          </div>
          <div class="planet-3d">
            <div class="planet-globe">
              <div class="globe-surface">
                <div class="globe-tree" style="top: 20%; left: 30%;">🌲</div>
                <div class="globe-tree" style="top: 40%; left: 60%;">🌳</div>
                <div class="globe-tree" style="top: 60%; left: 25%;">🌴</div>
                <div class="globe-tree" style="top: 35%; left: 75%;">🌲</div>
                <div class="globe-tree" style="top: 70%; left: 55%;">🌳</div>
                <div class="globe-tree" style="top: 25%; left: 50%;">🌲</div>
              </div>
            </div>
          </div>
          <div class="planet-controls">
            <button class="control-btn" id="btn-plant">🌱 种植新树</button>
            <button class="control-btn" id="btn-water">💧 浇水</button>
            <button class="control-btn" id="btn-fertilize">🌿 施肥</button>
          </div>
          <div class="tree-list" id="tree-list">
          </div>
        </div>
      </section>

      <section id="page-library" class="page">
        <div class="library-container">
          <div class="library-header">
            <h2>知识图书馆</h2>
            <div class="library-tabs">
              <button class="tab-btn active" data-tab="levels">关卡列表</button>
              <button class="tab-btn" data-tab="wrong">错题本</button>
            </div>
          </div>
          <div id="tab-levels" class="tab-content active">
            <div class="levels-grid" id="levels-grid">
            </div>
          </div>
          <div id="tab-wrong" class="tab-content">
            <div class="wrong-list" id="wrong-list">
              <p class="empty-message">暂无错题，继续保持！</p>
            </div>
          </div>
          <div id="quiz-modal" class="modal hidden">
            <div class="modal-content">
              <div class="modal-header">
                <h3 id="quiz-title">答题闯关</h3>
                <button class="close-btn" id="close-quiz">×</button>
              </div>
              <div class="quiz-container" id="quiz-container">
                <div class="question-progress">
                  <span id="current-question">1</span> / <span id="total-questions">10</span>
                </div>
                <div class="question-card" id="question-card">
                  <div class="question-text" id="question-text"></div>
                  <div class="options-list" id="options-list"></div>
                </div>
                <div class="quiz-result" id="quiz-result" class="hidden">
                  <div class="result-icon" id="result-icon"></div>
                  <div class="result-text" id="result-text"></div>
                  <div class="result-score" id="result-score"></div>
                  <button class="modal-btn" id="btn-quiz-next">继续</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section id="page-leaderboard" class="page">
        <div class="leaderboard-container">
          <div class="leaderboard-header">
            <h2>排行榜</h2>
            <div class="leaderboard-tabs">
              <button class="tab-btn active" data-tab="personal">个人榜</button>
              <button class="tab-btn" data-tab="team">队伍榜</button>
            </div>
          </div>
          <div id="leaderboard-personal" class="leaderboard-content">
            <div class="my-rank-card">
              <div class="rank-badge">我的排名</div>
              <div class="rank-avatar">👤</div>
              <div class="rank-info">
                <div class="rank-name">我的微光</div>
                <div class="rank-score">繁荣度: <span id="my-prosperity">0</span></div>
              </div>
              <div class="rank-position" id="my-rank">--</div>
            </div>
            <div class="leaderboard-list" id="personal-list">
            </div>
          </div>
          <div id="leaderboard-team" class="leaderboard-content hidden">
            <div class="team-rank-list" id="team-list">
            </div>
          </div>
        </div>
      </section>

      <section id="page-donations" class="page">
        <div class="donations-container">
          <div class="donations-header">
            <h2>公益捐赠</h2>
            <div class="energy-info">
              当前可捐赠能量: <span id="donation-energy">0</span> 繁荣度
            </div>
          </div>
          <div class="projects-grid" id="projects-grid">
          </div>
          <div class="donation-history">
            <h3>我的捐赠记录</h3>
            <div class="history-list" id="history-list">
              <p class="empty-message">暂无捐赠记录</p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="toast" class="toast hidden">
      <div class="toast-icon" id="toast-icon"></div>
      <div class="toast-message" id="toast-message"></div>
    </div>

    <div id="modal-overlay" class="modal-overlay hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modal-title">提示</h3>
          <button class="close-btn" id="close-modal">×</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
      </div>
    </div>
  </div>

  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
