{code:"INFP",name:"调停者",group:"NF",shortDesc:"温柔真诚的价值追寻者，忠于内心的信念。",traits:["真诚","理想主义","共情"]},{code:"ENFJ",name:"主人公",group:"NF",shortDesc:"富有感染力的引导者，擅长激发他人的潜能。",traits:["感染力","利他","组织"]},{code:"ENFP",name:"竞选者",group:"NF",shortDesc:"热情洋溢的自由灵魂，总能发现生活的可能性。",traits:["热情","好奇","自由"]},{code:"ISTJ",name:"物流师",group:"SJ",shortDesc:"踏实可靠的执行者，重视秩序、规则和责任。",traits:["可靠","严谨","务实"]},{code:"ISFJ",name:"守卫者",group:"SJ",shortDesc:"温暖而细心的守护者，默默照顾身边每一个人。",traits:["体贴","尽责","细致"]},{code:"ESTJ",name:"总经理",group:"SJ",shortDesc:"务实高效的组织者，擅长建立秩序和推进执行。",traits:["高效","组织","务实"]},{code:"ESFJ",name:"执政官",group:"SJ",shortDesc:"热忱友善的协调者，重视人际和谐与传统价值。",traits:["友善","负责","和谐"]},{code:"ISTP",name:"鉴赏家",group:"SP",shortDesc:"冷静务实的实干家，擅长动手解决实际问题。",traits:["实干","冷静","灵活"]},{code:"ISFP",name:"探险家",group:"SP",shortDesc:"敏感而自由的艺术家，用感官体验世界的美。",traits:["艺术感知","温和","自由"]},{code:"ESTP",name:"企业家",group:"SP",shortDesc:"行动力十足的冒险家，善于抓住眼前的机会。",traits:["行动派","敏锐","冒险"]},{code:"ESFP",name:"表演者",group:"SP",shortDesc:"活力四射的舞台中心，热爱分享快乐和精彩瞬间。",traits:["热情","表现力","随性"]}],LP=[{code:"R",name:"现实型",emoji:"🔧",color:"#E76F51",description:"喜欢动手操作、和具体事物打交道，享受看得见摸得着的成果。",keywords:["动手","机械","工具","户外","实操","建造"]},{code:"I",name:"研究型",emoji:"🔬",color:"#6B8E9F",description:"喜欢观察、分析和探索，享受追根究底、搞清原理的过程。",keywords:["分析","研究","逻辑","探究","思考","科学"]},{code:"A",name:"艺术型",emoji:"🎨",color:"#F4A261",description:"喜欢创造和表达，享受在自由空间里把内心的东西变成作品。",keywords:["创造","设计","表达","审美","想象","原创"]},{code:"S",name:"社会型",emoji:"🤝",color:"#8FB996",description:"喜欢与人交流、帮助他人，享受在陪伴和影响中创造价值。",keywords:["助人","沟通","共情","教育","协作","服务"]},{code:"E",name:"企业型",emoji:"💼",color:"#C4956C",description:"喜欢影响和领导他人，享受推动事情发生、达成目标的过程。",keywords:["领导","说服","目标","经营","决策","推动"]},{code:"C",name:"常规型",emoji:"📊",color:"#DDB892",description:"喜欢有序、规范的环境，享受把事情整理清楚、确保准确无误。",keywords:["条理","细节","规范","数据","流程","准确"]}],Ts=[{id:1,question:"周末有一整天空闲，以下哪种方式最让你心动？",options:[{text:"修理家电、组装家具，或者做个木工小物件，享受动手创造的满足感",type:"R"},{text:"研究一个一直好奇的话题，泡在文献和教程里追根究底",type:"I"},{text:"画画、写东西、拍照或剪视频，把内心的感受表达出来",type:"A"},{text:"约朋友吃饭聊天，或者去参加一个感兴趣的聚会",type:"S"}]},{id:2,question:"在团队项目中，你天然倾向哪种角色？",options:[{text:"负责推动进度、协调资源，带领大家往目标冲",type:"E"},{text:"把任务拆解成清晰的流程和节点，确保每步不出错",type:"C"},{text:"搞定技术难题、做原型、跑现场，动手解决实际问题",type:"R"},{text:"做调研、分析数据、写方案，给团队提供智力支持",type:"I"}]},{id:3,question:"朋友找你帮忙，哪种忙你最乐意帮？",options:[{text:"帮TA构思一个创意方案，或者设计一张海报、想一个文案",type:"A"},{text:"倾听TA的烦恼，陪着聊一晚上，帮TA理清情绪",type:"S"},{text:"帮TA规划接下来怎么做、对接什么资源，推动事情往前走",type:"E"},{text:"帮TA整理资料、对账、排行程，把乱七八糟的事理顺",type:"C"}]},{id:4,question:"你心目中理想的工作环境是？",options:[{text:"有车间、有工具、有现场，能随时动手试错的地方",type:"R"},{text:"有白板、有咖啡、有安静角落，可以自由创作和头脑风暴",type:"A"},{text:"有人气、有互动、有温度，每天和不同的人打交道",type:"S"},{text:"节奏快、目标明确、能拍板做主，每天都有新挑战",type:"E"}]},{id:5,question:"学一项新技能时，你最享受哪个环节？",options:[{text:"搞懂背后的原理和逻辑，从底层理解为什么这样运作",type:"I"},{text:"按部就班地练习，从基础到进阶，系统扎实地掌握",type:"C"},{text:"直接上手试，边做边调，在实践中摸索出门道",type:"R"},{text:"用自己的方式重新诠释，加入个人风格变成作品",type:"A"}]},{id:6,question:"业余时间，以下哪个最接近你的理想状态？",options:[{text:"和朋友聚会、做志愿者、或者参加社群活动，和人在一起",type:"S"},{text:"琢磨一个副业项目、研究商业模式、寻找赚钱机会",type:"E"},{text:"整理房间、做手账、规划下周日程，享受秩序的安心",type:"C"},{text:"看纪录片、读科普文章、上在线课程，满足求知欲",type:"I"}]},{id:7,question:"面对一个从未做过的任务，你的第一反应是？",options:[{text:"先动手试一个粗版，边做边改，在实操中找到感觉",type:"R"},{text:"找做过的人聊聊经验，或者组个小团队一起商量",type:"S"},{text:"先研究类似案例、搞清楚原理，再制定方案",type:"I"},{text:"快速判断能不能做、怎么做最有价值，然后推动落地",type:"E"}]},{id:8,question:"哪种工作状态最让你窒息？",options:[{text:"每天重复模板化的任务，完全没有创意发挥的空间",type:"A"},{text:"流程混乱、职责不清、数据对不上，一切都乱糟糟",type:"C"},{text:"整天对着机器和图纸，一整天说不上几句话",type:"R"},{text:"一个人闷头干，和谁都没交流，像一座孤岛",type:"S"}]},{id:9,question:"如果让你组织一场活动，你最想负责？",options:[{text:"做主题策划和视觉设计，让活动有灵魂、有美感",type:"A"},{text:"当主持人或外联，负责拉资源、搞气氛、推动全场",type:"E"},{text:"做嘉宾邀请和内容设计，确保干货满满",type:"I"},{text:"做预算、排期、物料清单，确保每个环节严丝合缝",type:"C"}]},{id:10,question:"你觉得最理想的成就感来自？",options:[{text:"亲手做出一个看得见摸得着的实物，比如一件家具、一道菜",type:"R"},{text:"谈成一笔大单、推动一个重要项目、带领团队达成目标",type:"E"},{text:"把一堆混乱的数据和流程整理得井井有条、准确无误",type:"C"},{text:'创作了一个打动人心的作品，被人说"说出了我的感受"',type:"A"}]},{id:11,question:"别人最常怎么夸你？",options:[{text:'"你分析问题好透彻，总能看到别人看不到的逻辑"',type:"I"},{text:'"你真好，总是愿意听我说、帮我出主意"',type:"S"},{text:'"你做事好靠谱，交给你就放心，细节从不出错"',type:"C"},{text:'"你动手能力好强，什么坏了都能修好"',type:"R"}]},{id:12,question:"如果不用考虑收入，你最想做什么工作？",options:[{text:"开一个工作室或小品牌，做一个有美学的产品或空间",type:"A"},{text:"创业做一个自己相信的东西，从零到一建起来",type:"E"},{text:"做研究、写论文、探索未知领域，在知识边界往外推一步",type:"I"},{text:"做老师、咨询师或社工，一对一地帮助别人改变人生",type:"S"}]}],og=[{title:"机械工程师",emoji:"🔧",hollandCode:"RIE",mbtiFit:["SP","SJ"],description:"用物理原理和工程技术，把图纸变成看得见摸得着的机器和产品。",dayInLife:"我每天到公司先和团队过一遍当天的设计任务，然后对着 CAD 软件调整零件尺寸、做结构受力分析。下午多半泡在车间，和师傅们一起试装样机，亲手拧螺丝、量公差。看着一个想法从图纸变成能转动的实物，是我最享受的时刻。",careerLadder:[{step:1,title:"助理工程师",description:"跟随资深工程师完成图纸绘制和基础计算",timeframe:"第 1 年"},{step:2,title:"机械工程师",description:"独立负责模块设计，参与样机试制",timeframe:"第 2-3 年"},{step:3,title:"高级工程师",description:"主导整机方案，带新人，把控技术方向",timeframe:"第 4-6 年"},{step:4,title:"技术主管 / 项目经理",description:"统筹整个产品线的技术与团队",timeframe:"第 7 年以上"}]},{title:"园艺师",emoji:"🌱",hollandCode:"RAS",mbtiFit:["SP","NF"],description:"和植物打交道，用双手把空间变成有生命力的花园和绿地。",dayInLife:"我的工作从清晨开始，先巡视一遍养护区域，看看哪些植物需要浇水、修剪或换盆。上午大多在户外动手——松土、施肥、造型修剪，一边干一边感受泥土和草木的气息。下午会画一些种植方案图，和客户讨论植物搭配，把一片荒地变成会呼吸的风景。",careerLadder:[{step:1,title:"园艺学徒",description:"学习植物养护基础，协助日常打理",timeframe:"第 1 年"},{step:2,title:"园艺师",description:"独立负责区域养护和简单造景",timeframe:"第 2-3 年"},{step:3,title:"造景设计师",description:"主导花园方案设计，对接客户",timeframe:"第 4-6 年"},{step:4,title:"园艺总监",description:"运营自己的工作室或景观团队",timeframe:"第 7 年以上"}]},{title:"烘焙师",emoji:"🥖",hollandCode:"RCE",mbtiFit:["SP","SJ"],description:"用精确的配比和双手的温度，把面粉变成面包和甜点。",dayInLife:"我凌晨就到店里把烤箱预热，按配方称量面粉、酵母和黄油，揉面、发酵、整形，每一步都要掐着时间来。出炉那一刻满屋飘香，我把面包摆上展柜，和早起的客人聊几句。下午研发新品，反复试做试吃，直到口感和外形都满意为止。",careerLadder:[{step:1,title:"烘焙学徒",description:"学习基础配方和操作规范",timeframe:"第 1 年"},{step:2,title:"烘焙师",description:"独立完成日常出品，把控品质",timeframe:"第 2-3 年"},{step:3,title:"研发主理",description:"负责新品研发和成本控制",timeframe:"第 4-6 年"},{step:4,title:"店长 / 品牌主理人",description:"经营自己的烘焙品牌",timeframe:"第 7 年以上"}]},{title:"数据分析师",emoji:"📈",hollandCode:"ICR",mbtiFit:["NT"],description:"从海量数据里挖出规律，用数字回答业务最关心的问题。",dayInLife:'我每天上午先跑一遍昨晚更新的数据报表，看看有没有异常波动需要排查。接着写 SQL 和 Python 把数据清洗、建模，做可视化图表。下午和业务团队开会，把复杂的数字翻译成"下一步该怎么做"的建议，看到自己的分析真的影响了决策，很有成就感。',careerLadder:[{step:1,title:"初级分析师",description:"负责日常报表和基础查询",timeframe:"第 1 年"},{step:2,title:"数据分析师",description:"独立完成专题分析，产出洞察",timeframe:"第 2-3 年"},{step:3,title:"高级分析师",description:"主导复杂建模，带新人",timeframe:"第 4-6 年"},{step:4,title:"数据团队负责人",description:"统筹数据体系建设和团队",timeframe:"第 7 年以上"}]},{title:"产品研究员",emoji:"🔬",hollandCode:"IAS",mbtiFit:["NT","NF"],description:"用科学方法研究用户行为，为产品决策提供扎实依据。",dayInLife:"我的工作常常从设计一份用户访谈提纲开始，然后约不同用户深聊，听他们讲真实的使用场景和痛点。上午整理访谈记录、做编码分析，下午写研究报告，把模糊的反馈变成清晰的产品建议。我喜欢在数据和故事之间找到平衡，让团队真正理解用户。",careerLadder:[{step:1,title:"研究助理",description:"协助访谈和数据整理",timeframe:"第 1 年"},{step:2,title:"用户研究员",description:"独立设计并执行研究项目",timeframe:"第 2-3 年"},{step:3,title:"高级研究员",description:"主导研究方向，影响产品战略",timeframe:"第 4-6 年"},{step:4,title:"研究负责人",description:"搭建研究体系，带领团队",timeframe:"第 7 年以上"}]},{title:"软件工程师",emoji:"💻",hollandCode:"IRC",mbtiFit:["NT"],description:"用代码构建数字产品，把逻辑变成可以运行的程序。",dayInLife:'我到工位先看一遍代码评审和昨晚的构建结果，然后戴上耳机进入编码状态。上午写功能模块、调试 bug，下午和产品经理对需求、和同事做技术方案讨论。解决一个卡了很久的问题时那种"通了"的感觉，是这个职业最让人上瘾的瞬间。',careerLadder:[{step:1,title:"初级工程师",description:"完成分配的模块开发",timeframe:"第 1 年"},{step:2,title:"软件工程师",description:"独立负责功能，参与架构讨论",timeframe:"第 2-4 年"},{step:3,title:"高级工程师",description:"主导技术方案，指导新人",timeframe:"第 5-7 年"},{step:4,title:"技术专家 / 架构师",description:"把控系统架构和技术方向",timeframe:"第 8 年以上"}]},{title:"平面设计师",emoji:"🎨",hollandCode:"AES",mbtiFit:["SP","NF"],description:"用视觉语言传递信息，让品牌和内容被看见、被记住。",dayInLife:"我每天先过一遍设计需求和反馈，然后在 Figma 里开始排版、调色、试字体。上午做主视觉方案，下午和客户或运营对稿，根据反馈反复打磨细节。最开心的时刻是看到一个想法从草图变成成品，出现在海报、包装或屏幕上。",careerLadder:[{step:1,title:"初级设计师",description:"完成基础排版和执行类设计",timeframe:"第 1 年"},{step:2,title:"平面设计师",description:"独立负责项目视觉",timeframe:"第 2-3 年"},{step:3,title:"资深设计师",description:"主导品牌视觉方向",timeframe:"第 4-6 年"},{step:4,title:"设计总监 / 独立设计师",description:"带团队或经营个人工作室",timeframe:"第 7 年以上"}]},{title:"内容创作者",emoji:"✍️",hollandCode:"AIS",mbtiFit:["NF","SP"],description:"用文字、视频或音频表达观点，连接和你有共鸣的人。",dayInLife:'我的一天没有固定打卡，上午通常是灵感最活跃的时候，我会写文案、录播客或剪视频。下午回复读者留言、和合作方沟通选题，晚上复盘数据看看哪条内容引发了讨论。能靠表达自己想表达的东西生活，并收到陌生人的"谢谢你写出了我的感受"，是这件事最珍贵的回报。',careerLadder:[{step:1,title:"新手创作者",description:"建立账号，持续输出练习",timeframe:"第 1 年"},{step:2,title:"稳定创作者",description:"形成风格，积累第一批粉丝",timeframe:"第 2-3 年"},{step:3,title:"成熟创作者",description:"商业化变现，建立个人品牌",timeframe:"第 4-6 年"},{step:4,title:"内容主理人 / 工作室",description:"带团队运营矩阵或品牌",timeframe:"第 7 年以上"}]},{title:"室内设计师",emoji:"🏠",hollandCode:"AER",mbtiFit:["SP"],description:"把空间和美学结合，让人住得舒服、用得顺心。",dayInLife:"我上午通常在画施工图和效果图，调整空间动线、材质和灯光。下午去工地现场量房、和施工队确认细节，回来再改方案。看着一个毛坯房一点点变成有温度的家，业主推开门那一刻眼里的惊喜，是这个职业最大的满足。",careerLadder:[{step:1,title:"设计助理",description:"协助画图和现场测量",timeframe:"第 1 年"},{step:2,title:"室内设计师",description:"独立负责中小型项目",timeframe:"第 2-4 年"},{step:3,title:"资深设计师",description:"主导大型项目，建立口碑",timeframe:"第 5-7 年"},{step:4,title:"设计总监 / 工作室主理人",description:"经营自己的设计品牌",timeframe:"第 8 年以上"}]},{title:"心理咨询师",emoji:"🌿",hollandCode:"SAI",mbtiFit:["NF"],description:"用专业和共情陪伴他人，帮来访者看见自己、走出困境。",dayInLife:'我每天接待几位来访者，在安静的咨询室里听他们讲述自己的故事，一起梳理情绪和卡点。咨询间隙我会写咨询记录、做督导和案例讨论，持续学习新的方法。当一个来访者告诉我"这周我终于敢迈出那一步了"，我知道这份陪伴是有意义的。',careerLadder:[{step:1,title:"见习咨询师",description:"积累咨询时长，接受督导",timeframe:"第 1-2 年"},{step:2,title:"心理咨询师",description:"独立接案，建立来访者信任",timeframe:"第 3-5 年"},{step:3,title:"资深咨询师",description:"处理复杂案例，带教新人",timeframe:"第 6-9 年"},{step:4,title:"督导师 / 机构主理人",description:"提供督导或经营咨询机构",timeframe:"第 10 年以上"}]},{title:"培训师",emoji:"📚",hollandCode:"SEA",mbtiFit:["NF","NT"],description:"把知识和经验设计成课程，帮别人学会新本领。",dayInLife:"我的工作分两块：没课的日子在备课，设计课程框架、做案例和练习；有课的日子站在讲台上，带着一群人做互动练习，看他们从不会到会。课后我会收集反馈、迭代内容，也常常被学员的进步打动——教别人这件事本身，也在不断重塑我自己。",careerLadder:[{step:1,title:"培训助理",description:"协助课程组织与基础授课",timeframe:"第 1 年"},{step:2,title:"培训师",description:"独立交付课程，打磨授课技巧",timeframe:"第 2-3 年"},{step:3,title:"高级培训师",description:"开发原创课程体系",timeframe:"第 4-6 年"},{step:4,title:"培训总监 / 自由讲师",de
