<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>华夏览胜 - 全国美景美食地图</title>
  <!-- ECharts 核心库 -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    /* 关键布局样式（内联确保不依赖缓存） */
    html, body { width: 100%; height: 100%; }
    body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; overflow: hidden; }

    .home-hero {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .home-body {
      display: flex;
      flex-direction: row;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .hero-header {
      text-align: left;
      padding: 40px 15px 30px 30px;
      width: 200px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      z-index: 10;
    }

    .hero-header h1 {
      font-size: clamp(1.8rem, 3vw, 3.2rem);
      color: #fff;
      letter-spacing: 8px;
      text-shadow: 0 2px 20px rgba(197, 48, 48, 0.5);
      margin-bottom: 0;
      white-space: nowrap;
      display: inline-block;
    }
    .hero-header h1 span { color: #d69e2e; }

    /* 黄线分隔：宽度与华夏览胜标题文字等宽 */
    .hero-divider {
      width: 100%;
      height: 3px;
      background: #d69e2e;
      margin: 15px 0;
      border-radius: 2px;
      min-width: 80px;
    }

    .hero-header p {
      color: rgba(255,255,255,0.7);
      font-size: clamp(0.85rem, 1.2vw, 1.1rem);
      letter-spacing: 4px;
      line-height: 1.8;
    }

    .map-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px 20px;
      min-height: 0;
      position: relative;
    }

    #chinaMap {
      width: 100%;
      height: 100%;
    }

    .hero-footer {
      text-align: center;
      padding: 10px 20px;
      color: rgba(255,255,255,0.5);
      font-size: 0.8rem;
      position: relative;
      z-index: 10;
      flex-shrink: 0;
    }

    /* 悬浮卡片样式 */
    .hover-card {
      position: fixed;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      width: 320px;
      z-index: 1000;
      pointer-events: none;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      overflow: hidden;
    }
    .hover-card.visible { opacity: 1; transform: translateY(0); }

    .hover-card-header {
      background: linear-gradient(135deg, #c53030, #9b2c2c);
      color: #fff;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .hover-card-header .province-name {
      font-size: 1.3rem;
      font-weight: bold;
      letter-spacing: 2px;
    }
    .hover-card-header .season-badge {
      background: rgba(255,255,255,0.2);
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
    }

    .hover-card-body { padding: 14px 18px; }
    .hover-card-body h4 {
      color: #c53030;
      font-size: 0.85rem;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hover-card-body h4::before {
      content: '';
      width: 3px;
      height: 14px;
      background: #d69e2e;
      border-radius: 2px;
    }
    .hover-card-body .item-list { list-style: none; margin-bottom: 10px; }
    .hover-card-body .item-list li {
      font-size: 0.85rem;
      color: #4a5568;
      padding: 2px 0;
    }
    .hover-card-body .item-list li strong { color: #1a202c; }

    .hover-card-footer {
      padding: 10px 18px 14px;
      font-size: 0.8rem;
      color: #c53030;
      text-align: center;
      border-top: 1px solid #e2e8f0;
    }

    /* 响应式：窄屏幕（<900px）恢复上下布局 */
    @media (max-width: 900px) {
      .home-body { flex-direction: column; }
      .hero-header {
        text-align: center;
        width: 100%;
        padding: 15px 20px 8px;
        justify-content: flex-start;
        align-items: center;
      }
      .hero-header::after { display: none; }
      .hero-header h1 { font-size: 1.5rem; letter-spacing: 4px; }
      .hero-divider { width: auto; }
      .hero-header p { font-size: 0.8rem; letter-spacing: 2px; }
      #chinaMap { flex: 1; }
      .hover-card { width: 280px; }
    }
  </style>
</head>
<body>
  <div class="home-hero">
    <!-- 左右分栏主体 -->
    <div class="home-body">
      <!-- 左侧标题区 -->
      <div class="hero-header">
        <h1>华夏<span>览胜</span></h1>
        <div class="hero-divider"></div>
        <p>探寻神州美景<br>品味中华美食</p>
      </div>

      <!-- 右侧地图区 -->
      <div class="map-container">
        <div id="chinaMap"></div>
      </div>
    </div>

    <!-- 底部说明 -->
    <div class="hero-footer">
      鼠标悬停查看各省美景美食 · 点击省份进入详情页
    </div>
  </div>

  <!-- 自定义悬浮卡片 -->
  <div class="hover-card" id="hoverCard">
    <div class="hover-card-header">
      <span class="province-name" id="cardProvinceName"></span>
      <span class="season-badge" id="cardSeason"></span>
    </div>
    <div class="hover-card-body">
      <h4>美景推荐</h4>
      <ul class="item-list" id="cardScenery"></ul>
      <h4>特色美食</h4>
      <ul class="item-list" id="cardFood"></ul>
    </div>
    <div class="hover-card-footer">点击查看详情</div>
  </div>

  <!-- 数据与逻辑 -->
  <script src="js/data.js?v=23"></script>
  <script src="js/map.js?v=40"></script>
  <script>
    // 同步黄线宽度与标题等宽
    function syncDividerWidth() {
      var h1 = document.querySelector('.hero-header h1');
      var divider = document.querySelector('.hero-divider');
      if (h1 && divider) {
        var w = h1.offsetWidth;
        if (w > 0) divider.style.width = w + 'px';
      }
    }
    syncDividerWidth();
    window.addEventListener('resize', syncDividerWidth);
  </script>
</body>
</html>
