<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>产品中心 - 曲阳雕刻供应链平台</title>
  <meta name="description" content="安平丝网产品中心，不锈钢网、电焊网、护栏网、钢板网、冲孔网、过滤网、铜网、装饰网全品类丝网产品，源头厂家直供。" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="products">
  <div id="site-header"></div>

  <!-- 页面 Banner -->
  <section class="page-banner">
    <div class="container">
      <h1>产品中心</h1>
      <div class="breadcrumb">
        <a href="index.html">首页</a><span>/</span>产品中心
      </div>
    </div>
  </section>

  <!-- 产品列表 -->
  <section class="section">
    <div class="container">
      <!-- 筛选栏 -->
      <div class="filter-bar">
        <div class="filter-group">
          <label>分类：</label>
          <div class="filter-chips" id="catChips"></div>
        </div>
        <div class="filter-group" style="margin-left:auto;">
          <label>排序：</label>
          <select class="filter-select" id="sortSelect">
            <option value="default">默认排序</option>
            <option value="price-asc">价格从低到高</option>
            <option value="price-desc">价格从高到低</option>
          </select>
        </div>
      </div>

      <!-- 结果计数 -->
      <div style="margin-bottom:18px; color:var(--color-text-muted); font-size:14px;">
        <span id="resultCount">共 0 个产品</span>
      </div>

      <!-- 产品网格 -->
      <div class="product-grid" id="productList"></div>

      <!-- 分页 -->
      <div class="pagination" id="productPagination"></div>
    </div>
  </section>

  <!-- CTA -->
  <section class="section section-soft">
    <div class="container">
      <div class="cta-banner">
        <div>
          <h2>没找到合适的产品？</h2>
          <p>提交询价单，源头厂家为您定制生产</p>
        </div>
        <a href="inquiry.html" class="btn btn-accent btn-lg">立即询价</a>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="main.js"></script>
</body>
</html>
