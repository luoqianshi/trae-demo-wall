<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>新闻资讯 - 曲阳雕刻供应链平台</title>
  <meta name="description" content="安平丝网行业资讯，提供丝网行业动态、政策解读、技术科普、展会资讯等一手信息。" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="news">
  <div id="site-header"></div>

  <!-- 页面 Banner -->
  <section class="page-banner">
    <div class="container">
      <h1>新闻资讯</h1>
      <div class="breadcrumb">
        <a href="index.html">首页</a><span>/</span>新闻资讯
      </div>
    </div>
  </section>

  <!-- 资讯列表 -->
  <section class="section">
    <div class="container">
      <!-- 筛选栏 -->
      <div class="filter-bar">
        <div class="filter-group">
          <label>分类：</label>
          <div class="filter-chips">
            <button class="chip active">全部</button>
            <button class="chip">行业动态</button>
            <button class="chip">政策解读</button>
            <button class="chip">技术科普</button>
            <button class="chip">展会资讯</button>
          </div>
        </div>
      </div>

      <!-- 资讯列表 -->
      <div class="news-grid" id="newsList"></div>

      <!-- 分页 -->
      <div class="pagination">
        <button disabled>上一页</button>
        <button class="active">1</button>
        <button>2</button>
        <button>3</button>
        <button>下一页</button>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="main.js"></script>
  <script>
    // 资讯分类筛选（前端交互）
    document.addEventListener("DOMContentLoaded", function () {
      var chips = document.querySelectorAll(".filter-chips .chip");
      chips.forEach(function (chip) {
        chip.addEventListener("click", function () {
          chips.forEach(function (c) { c.classList.remove("active"); });
          chip.classList.add("active");
        });
      });
    });
  </script>
</body>
</html>
