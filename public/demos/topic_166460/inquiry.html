<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>在线询价 - 曲阳雕刻供应链平台</title>
  <meta name="description" content="安平丝网在线询价，填写需求表单，1小时内获得多家源头厂家报价。" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="inquiry">
  <div id="site-header"></div>

  <!-- 页面 Banner -->
  <section class="page-banner">
    <div class="container">
      <h1>在线询价</h1>
      <div class="breadcrumb">
        <a href="index.html">首页</a><span>/</span>在线询价
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container" style="max-width:880px;">
      <!-- 询价说明 -->
      <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-bottom:30px;">
        <div style="text-align:center; padding:22px; background:#fff; border:1px solid var(--color-border); border-radius:var(--radius-lg);">
          <div style="font-size:28px; margin-bottom:6px;">⚡</div>
          <h4 style="font-size:15px; margin-bottom:4px;">1小时响应</h4>
          <p style="font-size:13px; color:var(--color-text-muted);">提交后1小时内报价</p>
        </div>
        <div style="text-align:center; padding:22px; background:#fff; border:1px solid var(--color-border); border-radius:var(--radius-lg);">
          <div style="font-size:28px; margin-bottom:6px;">🏭</div>
          <h4 style="font-size:15px; margin-bottom:4px;">多家比价</h4>
          <p style="font-size:13px; color:var(--color-text-muted);">源头厂家价格对比</p>
        </div>
        <div style="text-align:center; padding:22px; background:#fff; border:1px solid var(--color-border); border-radius:var(--radius-lg);">
          <div style="font-size:28px; margin-bottom:6px;">🛡️</div>
          <h4 style="font-size:15px; margin-bottom:4px;">品质保障</h4>
          <p style="font-size:13px; color:var(--color-text-muted);">资质认证可追溯</p>
        </div>
      </div>

      <!-- 成功提示 -->
      <div class="form-success" id="inquirySuccess">
        ✓ 询价单提交成功！我们的客服将在1小时内与您联系，请保持电话畅通。
      </div>

      <!-- 询价表单 -->
      <div class="form-card">
        <h2 style="font-size:22px; margin-bottom:6px;">填写询价单</h2>
        <p style="color:var(--color-text-muted); font-size:14px; margin-bottom:24px;">带 <span style="color:var(--color-danger);">*</span> 为必填项，信息越完整报价越精准</p>

        <form id="inquiryForm" novalidate>
          <div class="form-grid">
            <div class="form-group full">
              <label>产品名称 <span class="req">*</span></label>
              <input type="text" name="product" class="form-control" placeholder="如：304不锈钢编织网 100目" data-required />
              <span class="form-error">请填写产品名称</span>
            </div>

            <div class="form-group">
              <label>材质</label>
              <select name="material" class="form-control">
                <option value="">请选择材质</option>
                <option>不锈钢304</option>
                <option>不锈钢316</option>
                <option>不锈钢316L</option>
                <option>不锈钢201</option>
                <option>黄铜(H62)</option>
                <option>紫铜(T2)</option>
                <option>铁丝</option>
                <option>低碳钢丝</option>
                <option>铝合金</option>
                <option>热镀锌钢丝</option>
                <option>冷镀锌钢丝</option>
                <option>PVC涂层</option>
                <option>其他</option>
              </select>
            </div>

            <div class="form-group">
              <label>目数 / 网孔</label>
              <input type="text" name="mesh" class="form-control" placeholder="如：100目 或 50×50mm" />
            </div>

            <div class="form-group">
              <label>丝径 / 板厚</label>
              <input type="text" name="wire" class="form-control" placeholder="如：0.10mm 或 2.5mm" />
            </div>

            <div class="form-group">
              <label>宽度 × 长度</label>
              <input type="text" name="size" class="form-control" placeholder="如：1m × 30m" />
            </div>

            <div class="form-group">
              <label>需求数量</label>
              <input type="text" name="quantity" class="form-control" placeholder="如：500 ㎡" />
            </div>

            <div class="form-group">
              <label>用途说明</label>
              <input type="text" name="usage" class="form-control" placeholder="如：食品过滤 / 公路隔离" />
            </div>

            <div class="form-group">
              <label>联系人 <span class="req">*</span></label>
              <input type="text" name="contact" class="form-control" placeholder="请输入您的姓名" data-required />
              <span class="form-error">请填写联系人姓名</span>
            </div>

            <div class="form-group">
              <label>联系电话 <span class="req">*</span></label>
              <input type="tel" name="phone" class="form-control" placeholder="手机号或座机号" data-required />
              <span class="form-error">请填写正确的联系电话</span>
            </div>

            <div class="form-group full">
              <label>公司名称</label>
              <input type="text" name="company" class="form-control" placeholder="选填，便于我们提供更优报价" />
            </div>

            <div class="form-group full">
              <label>补充说明</label>
              <textarea name="remark" class="form-control" placeholder="如有特殊要求请详细描述，如表面处理、包装、交期等"></textarea>
            </div>
          </div>

          <div class="form-submit">
            <button type="submit" class="btn btn-accent btn-lg" style="width:100%;">提交询价单</button>
          </div>
          <p class="form-note">提交即表示您同意我们通过电话与您联系确认需求。您的信息将严格保密，仅用于本次询价。</p>
        </form>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="main.js"></script>
</body>
</html>
