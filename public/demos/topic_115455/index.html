<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>街角有它 — 城市流浪动物智能救助</title>
<style>
/* ==================== 设计系统 ==================== */
:root {
  --color-primary: #FF8C42;
  --color-primary-light: #FFF1E6;
  --color-primary-dark: #E6722D;
  --color-secondary: #4ECDC4;
  --color-success: #52C41A;
  --color-warning: #FAAD14;
  --color-danger: #FF4D4F;
  --color-bg: #F7F8FA;
  --color-card: #FFFFFF;
  --color-text: #262626;
  --color-text-secondary: #8C8C8C;
  --color-text-disabled: #BFBFBF;
  --color-border: #F0F0F0;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-pill: 999px;
  --shadow-card: 0 2px 8px rgba(0,0,0,0.04);
  --shadow-hover: 0 4px 12px rgba(0,0,0,0.08);
  --shadow-fab: 0 4px 16px rgba(255,140,66,0.32);
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 24px;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #E8EAED;
  color: var(--color-text);
  font-size: 14px;
  line-height: 1.5;
  display:flex; justify-content:center; min-height:100vh;
}
/* 手机模拟器框架 */
#phone-frame {
  width: 100%; max-width: 430px; min-height: 100vh; background: var(--color-bg);
  position: relative; overflow: hidden; box-shadow: 0 0 40px rgba(0,0,0,0.1);
}
@media (min-width: 480px) { #phone-frame { margin: 20px 0; border-radius: 24px; overflow: hidden; min-height: calc(100vh - 40px); } }

/* ==================== 通用样式 ==================== */
.page { min-height: 100vh; padding: var(--space-lg); padding-bottom: 80px; }
.page-padding { padding: var(--space-lg); padding-bottom: 80px; }
.card { background: var(--color-card); border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: var(--space-lg); margin-bottom: var(--space-md); }
.btn-primary { background: var(--color-primary); color: #fff; border: none; border-radius: var(--radius-pill); padding: 11px 20px; font-size: 15px; font-weight: 500; cursor: pointer; transition: all .15s; text-align:center; }
.btn-primary:active { opacity:.85; transform:scale(.98); }
.btn-outline { background: var(--color-card); color: var(--color-primary); border: none; border-radius: var(--radius-pill); padding: 11px 20px; font-size: 15px; font-weight: 500; cursor: pointer; transition: all .15s; }
.btn-outline:active { opacity:.85; }
.btn-block { width:100%; display:block; }
.btn-danger { background: var(--color-danger); }
.hover-btn:active { opacity:.85; transform:scale(.98); }
.text-secondary { color: var(--color-text-secondary); }
.text-primary { color: var(--color-primary); }
.text-danger { color: var(--color-danger); }
.text-sm { font-size: 12px; }
.text-lg { font-size: 16px; }
.text-xl { font-size: 18px; font-weight: 600; }
.text-bold { font-weight: 600; }
.text-ellipsis { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.flex { display:flex; }
.flex-col { display:flex; flex-direction:column; }
.flex-center { display:flex; align-items:center; justify-content:center; }
.flex-between { display:flex; align-items:center; justify-content:space-between; }
.flex-1 { flex:1; min-width:0; }
.gap-sm { gap: var(--space-sm); }
.gap-md { gap: var(--space-md); }
.divider { height:1px; background: var(--color-border); margin: var(--space-sm) 0; }
input, textarea, select { font-family: inherit; font-size: 14px; outline: none; border: none; }
input:focus, textarea:focus { outline: none; }

/* ==================== 导航栏 ==================== */
.navbar { background: var(--color-card); padding: 12px 16px; display:flex; align-items:center; justify-content:space-between; position: sticky; top:0; z-index:100; border-bottom: 1px solid var(--color-border); }
.navbar-title { font-size: 17px; font-weight: 600; }
.navbar-back { font-size: 22px; color: var(--color-text); cursor: pointer; width: 30px; }
.navbar-right { font-size: 14px; color: var(--color-primary); cursor: pointer; }

/* ==================== TabBar ==================== */
#tabbar { position: fixed; bottom:0; left:50%; transform: translateX(-50%); width:100%; max-width:430px; background: var(--color-card); display:flex; border-top: 1px solid var(--color-border); z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
.tab-item { flex:1; display:flex; flex-direction:column; align-items:center; padding: 8px 0 6px; cursor:pointer; color: var(--color-text-secondary); transition: color .15s; position: relative; }
.tab-item.active { color: var(--color-primary); }
.tab-icon { font-size: 22px; line-height:1; }
.tab-label { font-size: 10px; margin-top: 2px; }
.tab-badge { position:absolute; top:4px; right:50%; margin-right:-20px; background: var(--color-danger); color:#fff; font-size:10px; min-width:16px; height:16px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 4px; }

/* ==================== 首页 ==================== */
.map-banner { background: linear-gradient(135deg, #FF8C42, #FFB370); border-radius: var(--radius-lg); padding: 20px; color: #fff; margin-bottom: var(--space-md); }
.quick-actions { display:flex; gap: 8px; margin-bottom: var(--space-md); }
.quick-action { flex:1; background: var(--color-card); border-radius: var(--radius-md); padding: 14px 8px; text-align:center; box-shadow: var(--shadow-card); cursor:pointer; transition: all .15s; }
.quick-action:active { transform: scale(.96); opacity:.85; }
.qa-icon { font-size: 28px; margin-bottom: 4px; }
.qa-label { font-size: 12px; color: var(--color-text); }
.map-banner h2 { font-size: 20px; margin-bottom: 6px; }
.map-banner p { font-size: 13px; opacity: .9; }
.view-switch { display:flex; background: var(--color-card); border-radius: var(--radius-pill); padding: 3px; margin-bottom: var(--space-md); }
.view-switch .vs-btn { flex:1; text-align:center; padding: 7px; border-radius: var(--radius-pill); font-size: 13px; cursor:pointer; color: var(--color-text-secondary); transition: all .15s; }
.view-switch .vs-btn.active { background: var(--color-primary); color: #fff; }
.report-item { display:flex; gap: 12px; background: var(--color-card); border-radius: var(--radius-md); padding: 12px; margin-bottom: var(--space-sm); box-shadow: var(--shadow-card); cursor:pointer; transition: all .15s; }
.report-item:active { transform: scale(.98); }
.report-cover { width: 80px; height: 80px; border-radius: var(--radius-sm); object-fit: cover; background: var(--color-primary-light); display:flex; align-items:center; justify-content:center; font-size: 32px; flex-shrink:0; }
.report-info { flex:1; min-width:0; }
.report-title-row { display:flex; align-items:center; justify-content:space-between; margin-bottom: 4px; }
.report-meta { font-size: 12px; color: var(--color-text-secondary); }
.report-time { font-size: 11px; color: var(--color-text-disabled); margin-top: 4px; }

/* ==================== 状态标签 ==================== */
.status-tag { display:inline-block; padding: 2px 8px; border-radius: var(--radius-pill); font-size: 11px; font-weight: 500; }
.status-pending { background: #FFF7E6; color: #D48806; }
.status-helping { background: #E6F7FF; color: #1890FF; }
.status-resolved { background: #F6FFED; color: #52C41A; }
.status-available { background: #F6FFED; color: #52C41A; }
.status-applying { background: #FFF7E6; color: #D48806; }
.status-adopted { background: #F0F0F0; color: #8C8C8C; }
.status-approved { background: #F6FFED; color: #52C41A; }
.status-rejected { background: #FFF1F0; color: #FF4D4F; }

/* ==================== 空状态 ==================== */
.empty-state { text-align:center; padding: 60px 20px; }
.empty-icon { font-size: 56px; margin-bottom: 12px; }
.empty-text { font-size: 15px; color: var(--color-text); margin-bottom: 4px; }
.empty-desc { font-size: 13px; color: var(--color-text-secondary); }

/* ==================== 表单 ==================== */
.section-card { background: var(--color-card); border-radius: var(--radius-md); box-shadow: var(--shadow-card); margin-bottom: var(--space-md); overflow: hidden; }
.section-title { padding: 12px 16px 6px; font-size: 14px; font-weight: 600; color: var(--color-text-secondary); }
.section-body { padding: 6px 16px 16px; }
.opt-row { display:flex; gap: 8px; flex-wrap: wrap; }
.opt { padding: 8px 16px; border-radius: var(--radius-pill); background: var(--color-bg); font-size: 13px; cursor: pointer; transition: all .15s; border: 1px solid transparent; }
.opt.active { background: var(--color-primary-light); color: var(--color-primary); border-color: var(--color-primary); }
.opt-danger.active { background: #FFF1F0; color: var(--color-danger); border-color: var(--color-danger); }
.textarea { width:100%; min-height: 80px; padding: 10px; background: var(--color-bg); border-radius: var(--radius-sm); font-size: 14px; resize: none; line-height: 1.5; }
.text-input { width:100%; padding: 10px 12px; background: var(--color-bg); border-radius: var(--radius-sm); font-size: 14px; }
.loc-row { display:flex; align-items:center; gap: 8px; padding: 10px; background: var(--color-bg); border-radius: var(--radius-sm); cursor:pointer; }
.loc-icon { font-size: 20px; }
.loc-text { flex:1; }
.loc-name { font-size: 14px; }
.loc-name.placeholder { color: var(--color-text-disabled); }
.loc-edit { font-size: 13px; color: var(--color-primary); }
.loc-input { width:100%; padding: 10px; background: var(--color-bg); border-radius: var(--radius-sm); font-size: 14px; margin-top: 8px; }

/* ==================== 图片上传 ==================== */
.uploader { display:flex; flex-wrap: wrap; gap: 8px; }
.upload-item { width: 100px; height: 100px; border-radius: var(--radius-sm); position: relative; overflow: hidden; }
.upload-item img { width:100%; height:100%; object-fit: cover; }
.upload-del { position:absolute; top:2px; right:2px; width:20px; height:20px; background:rgba(0,0,0,.5); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; cursor:pointer; }
.upload-add { width:100px; height:100px; border: 1px dashed var(--color-text-disabled); border-radius: var(--radius-sm); display:flex; align-items:center; justify-content:center; font-size:32px; color: var(--color-text-disabled); cursor:pointer; background: var(--color-bg); }

/* ==================== 健康状态切换 ==================== */
.health-toggle { display:flex; align-items:center; gap: 8px; padding: 10px 12px; background: var(--color-bg); border-radius: var(--radius-sm); cursor: pointer; margin-bottom: 8px; transition: all .15s; }
.health-toggle.active { background: #F6FFED; }
.health-toggle-icon { width: 20px; height: 20px; border-radius: 50%; display:flex; align-items:center; justify-content:center; font-size: 12px; flex-shrink:0; background: var(--color-text-disabled); color: #fff; }
.health-toggle.active .health-toggle-icon { background: var(--color-success); }
.health-toggle-label { flex:1; font-size: 14px; color: var(--color-text-secondary); }
.health-toggle.active .health-toggle-label { color: var(--color-success); }

/* ==================== 领养列表 ==================== */
.animal-card { background: var(--color-card); border-radius: var(--radius-md); box-shadow: var(--shadow-card); overflow: hidden; margin-bottom: var(--space-md); cursor:pointer; transition: all .15s; }
.animal-card:active { transform: scale(.98); }
.animal-cover { width:100%; height: 200px; object-fit: cover; background: var(--color-primary-light); display:flex; align-items:center; justify-content:center; font-size: 60px; }
.animal-body { padding: 12px; }
.animal-name { font-size: 16px; font-weight: 600; }
.animal-meta { font-size: 12px; color: var(--color-text-secondary); margin-top: 4px; }
.animal-personality { font-size: 13px; color: var(--color-text); margin-top: 6px; }
.filter-bar { display:flex; gap: 8px; margin-bottom: var(--space-md); overflow-x: auto; }
.filter-chip { padding: 6px 14px; border-radius: var(--radius-pill); background: var(--color-card); font-size: 13px; cursor:pointer; white-space: nowrap; transition: all .15s; border: 1px solid var(--color-border); }
.filter-chip.active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }

/* ==================== 详情页 ==================== */
.detail-cover { width:100%; height: 280px; object-fit: cover; background: var(--color-primary-light); display:flex; align-items:center; justify-content:center; font-size: 80px; }
.detail-body { padding: var(--space-lg); padding-bottom: 100px; }
.detail-title { font-size: 20px; font-weight: 600; }
.detail-meta { font-size: 13px; color: var(--color-text-secondary); margin-top: 4px; }
.health-row { display:flex; gap: 12px; margin-top: 12px; flex-wrap:wrap; }
.health-item { display:flex; align-items:center; gap: 4px; font-size: 13px; }
.health-ok { color: var(--color-success); }
.health-no { color: var(--color-text-disabled); }
.detail-section { margin-top: 16px; }
.detail-section h3 { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
.detail-section p { font-size: 14px; color: var(--color-text); line-height: 1.6; white-space: pre-wrap; }
.detail-bottom { position: fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px; padding: 12px 16px; background: var(--color-card); border-top: 1px solid var(--color-border); z-index: 100; display:flex; gap: 8px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
.detail-bottom.two-btn { gap: 12px; }
.detail-bottom.two-btn button { flex:1; }

/* ==================== 个人中心 ==================== */
.profile { display:flex; align-items:center; gap: 12px; background: var(--color-card); border-radius: var(--radius-md); padding: 16px; margin-bottom: var(--space-md); box-shadow: var(--shadow-card); }
.avatar { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; background: var(--color-primary-light); display:flex; align-items:center; justify-content:center; font-size: 28px; cursor:pointer; }
.profile-info { flex:1; min-width:0; }
.nick-input { font-size: 16px; font-weight: 600; border: none; background: transparent; width:100%; }
.profile-desc { font-size: 12px; color: var(--color-text-secondary); margin-top: 2px; }
.login-arrow { font-size: 22px; color: var(--color-text-disabled); }
.role-bar { display:flex; gap: 8px; margin-bottom: var(--space-md); overflow-x: auto; }
.role-chip { padding: 6px 14px; border-radius: var(--radius-pill); font-size: 13px; cursor:pointer; white-space: nowrap; background: var(--color-card); border: 1px solid var(--color-border); transition: all .15s; position: relative; }
.role-chip.active { background: var(--color-primary-light); color: var(--color-primary); border-color: var(--color-primary); }
.tab-bar-mine { display:flex; background: var(--color-card); border-radius: var(--radius-pill); padding: 3px; margin-bottom: var(--space-md); }
.tab-bar-mine .tb-item { flex:1; text-align:center; padding: 7px 4px; border-radius: var(--radius-pill); font-size: 12px; cursor:pointer; color: var(--color-text-secondary); transition: all .15s; position: relative; }
.tab-bar-mine .tb-item.active { background: var(--color-primary); color: #fff; }
.record-card { display:flex; gap: 10px; background: var(--color-card); border-radius: var(--radius-md); padding: 10px; margin-bottom: var(--space-sm); box-shadow: var(--shadow-card); cursor:pointer; transition: all .15s; }
.record-card:active { transform: scale(.98); }
.rc-cover { width: 64px; height: 64px; border-radius: var(--radius-sm); object-fit: cover; background: var(--color-primary-light); display:flex; align-items:center; justify-content:center; font-size: 28px; flex-shrink:0; }
.rc-info { flex:1; min-width:0; }
.rc-title-row { display:flex; align-items:center; justify-content:space-between; }
.rc-meta { font-size: 12px; color: var(--color-text-secondary); }
.rc-time { font-size: 11px; color: var(--color-text-disabled); }

/* ==================== 登录页 ==================== */
.login-page { padding: 40px 24px; }
.login-logo { text-align:center; margin: 32px 0 24px; }
.login-logo-icon { font-size: 60px; }
.login-logo h1 { font-size: 24px; margin-top: 8px; }
.login-logo p { font-size: 14px; color: var(--color-text-secondary); margin-top: 4px; }
.login-avatar-picker { display:flex; justify-content:center; margin: 20px 0; }
.login-avatar-btn { width: 80px; height: 80px; border-radius: 50%; border: 2px dashed var(--color-primary); display:flex; align-items:center; justify-content:center; font-size: 36px; color: var(--color-primary); cursor:pointer; background: var(--color-primary-light); overflow:hidden; }
.login-avatar-btn img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
.feature-list { background: var(--color-card); border-radius: var(--radius-md); padding: 16px; margin-bottom: var(--space-md); box-shadow: var(--shadow-card); }
.feature-item { display:flex; align-items:flex-start; gap: 12px; padding: 10px 0; }
.feature-item:not(:last-child) { border-bottom: 1px solid var(--color-border); }
.feature-icon { width: 36px; height: 36px; border-radius: var(--radius-sm); background: var(--color-primary-light); display:flex; align-items:center; justify-content:center; font-size: 18px; flex-shrink:0; }
.feature-text { flex:1; }
.feature-name { font-size: 14px; font-weight: 600; }
.feature-desc { font-size: 12px; color: var(--color-text-secondary); margin-top: 2px; }

/* ==================== 申请列表 ==================== */
.app-item { background: var(--color-card); border-radius: var(--radius-md); padding: 12px; margin-bottom: var(--space-sm); box-shadow: var(--shadow-card); }
.app-header { display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px; }
.app-name { font-size: 14px; font-weight: 600; }
.app-contact { font-size: 13px; color: var(--color-primary); }
.app-reason { font-size: 13px; color: var(--color-text-secondary); margin: 6px 0; }
.app-actions { display:flex; gap: 8px; margin-top: 8px; }
.app-actions button { flex:1; padding: 8px; border-radius: var(--radius-pill); border: none; font-size: 13px; cursor:pointer; }
.btn-approve { background: var(--color-success); color: #fff; }
.btn-reject { background: var(--color-bg); color: var(--color-text-secondary); }

/* ==================== 弹窗 ==================== */
.modal-mask { position:fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); z-index:200; display:flex; align-items:center; justify-content:center; }
.modal-content { background: var(--color-card); border-radius: var(--radius-lg); padding: 20px; width: 85%; max-width: 360px; }
.modal-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; text-align:center; }
.modal-option { padding: 12px; border-radius: var(--radius-sm); background: var(--color-bg); margin-bottom: 8px; cursor:pointer; display:flex; align-items:center; gap: 8px; }
.modal-option.active { background: var(--color-primary-light); color: var(--color-primary); }

/* 图片预览 */
.preview-mask { position:fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.9); z-index:300; display:flex; align-items:center; justify-content:center; }
.preview-mask img { max-width: 90%; max-height: 80vh; border-radius: 8px; }
.preview-close { position:absolute; top:16px; right:16px; color:#fff; font-size:32px; cursor:pointer; width:40px; height:40px; display:flex; align-items:center; justify-content:center; }

/* ==================== Toast ==================== */
#toast { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background: rgba(0,0,0,0.8); color:#fff; padding: 10px 20px; border-radius: var(--radius-sm); font-size: 14px; z-index: 999; pointer-events:none; opacity:0; transition: opacity .2s; }
#toast.show { opacity:1; }
#loading { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background: rgba(0,0,0,0.8); color:#fff; padding: 16px 20px; border-radius: var(--radius-md); font-size: 14px; z-index: 999; display:none; }
#loading.show { display:block; }
#loading .spinner { width: 24px; height: 24px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; margin: 0 auto 8px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ==================== 加载/状态 ==================== */
.loading-text { text-align:center; padding: 20px; color: var(--color-text-secondary); font-size: 13px; }
.no-more { text-align:center; padding: 16px; color: var(--color-text-disabled); font-size: 12px; }
.load-more { text-align:center; padding: 16px; color: var(--color-primary); font-size: 13px; cursor:pointer; }
.fab { position:fixed; right: 16px; bottom: 90px; width: 48px; height: 48px; border-radius: 50%; background: var(--color-primary); color: #fff; display:flex; align-items:center; justify-content:center; font-size: 28px; box-shadow: var(--shadow-fab); cursor:pointer; z-index: 50; transition: all .15s; }
.fab:active { transform: scale(.9); }
</style>
</head>
<body>
<div id="phone-frame">
  <div id="app"></div>
</div>
<div id="toast"></div>
<div id="loading"><div class="spinner"></div><div id="loading-text">加载中...</div></div>

<script>
// ==================== 常量 ====================
const ANIMAL_TYPE = { cat: '猫咪', dog: '狗狗', other: '其他' };
const REPORT_STATUS = { pending: '待救助', helping: '救助中', resolved: '已解决' };
const ADOPT_STATUS = { available: '待领养', applying: '申请中', adopted: '已领养' };
const APPLICATION_STATUS = { pending: '待审核', approved: '已通过', rejected: '已拒绝' };
const HEALTH_CONDITION = { healthy: '健康', injured: '受伤', sick: '生病', unknown: '不清楚' };
const URGENCY_LEVEL = { low: '不紧急', medium: '一般', high: '紧急' };
const GENDER = { male: '公', female: '母' };
const ROLE = { discoverer: '发现者', publisher: '发布者', adopter: '领养者', volunteer: '志愿者' };
const ROLE_LABEL = { discoverer: '发现者', publisher: '发布者', adopter: '领养者', volunteer: '志愿者' };
const STATUS_TAG_CLASS = {
  pending: 'status-pending', helping: 'status-helping', resolved: 'status-resolved',
  available: 'status-available', applying: 'status-applying', adopted: 'status-adopted',
  approved: 'status-approved', rejected: 'status-rejected'
};

// ==================== 存储层（兼容 file:// 协议） ====================
// file:// 协议下 localStorage 可能被限制，降级为内存存储
const _memoryStore = {};
const Storage = {
  getItem(key) {
    try {
      if (typeof localStorage !== 'undefined' && localStorage.getItem) {
        return localStorage.getItem(key);
      }
    } catch(e) {}
    return _memoryStore[key] || null;
  },
  setItem(key, value) {
    try {
      if (typeof localStorage !== 'undefined' && localStorage.setItem) {
        localStorage.setItem(key, value);
        return;
      }
    } catch(e) {}
    _memoryStore[key] = value;
  },
  removeItem(key) {
    try {
      if (typeof localStorage !== 'undefined' && localStorage.removeItem) {
        localStorage.removeItem(key);
        return;
      }
    } catch(e) {}
    delete _memoryStore[key];
  }
};

// ==================== 本地数据库 ====================
const DB = {
  get(table) {
    try { return JSON.parse(Storage.getItem('tajia_' + table) || '[]'); } catch(e) { return []; }
  },
  set(table, data) { Storage.setItem('tajia_' + table, JSON.stringify(data)); },
  insert(table, record) {
    const list = this.get(table);
    record._id = 'id_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    record.createdAt = record.createdAt || new Date().toISOString();
    list.push(record);
    this.set(table, list);
    return record;
  },
  update(table, id, patch) {
    const list = this.get(table);
    const idx = list.findIndex(x => x._id === id);
    if (idx >= 0) { Object.assign(list[idx], patch); this.set(table, list); return list[idx]; }
    return null;
  },
  findById(table, id) { return this.get(table).find(x => x._id === id); },
  findByOpenid(table, openid) { return this.get(table).filter(x => x._openid === openid); }
};

// ==================== 模拟用户系统 ====================
const Auth = {
  getCurrentUser() {
    try { return JSON.parse(Storage.getItem('tajia_user') || 'null'); } catch(e) { return null; }
  },
  setUser(user) { Storage.setItem('tajia_user', JSON.stringify(user)); },
  clearUser() { Storage.removeItem('tajia_user'); },
  getOpenid() {
    let oid = Storage.getItem('tajia_openid');
    if (!oid) { oid = 'local_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10); Storage.setItem('tajia_openid', oid); }
    return oid;
  },
  isLoggedIn() { const u = this.getCurrentUser(); return !!(u && u._openid); }
};

// ==================== 本地函数（替代云函数） ====================
const Cloud = {
  // login（基于账号生成 openid，相同账号登录得到相同用户）
  login(account) {
    const openid = 'acct_' + account;
    Storage.setItem('tajia_openid', openid);
    const users = DB.get('users');
    let user = users.find(u => u._openid === openid);
    if (user) {
      user.lastLoginAt = new Date().toISOString();
      DB.update('users', user._id, { lastLoginAt: user.lastLoginAt });
    } else {
      user = DB.insert('users', { _openid: openid, nickName: '', avatarUrl: '', roles: ['discoverer'], activeRole: 'discoverer' });
    }
    return Promise.resolve({ _id: user._id, _openid: openid, nickName: user.nickName || '', avatarUrl: user.avatarUrl || '', roles: user.roles || ['discoverer'], activeRole: user.activeRole || 'discoverer' });
  },
  // updateUser
  updateUser(data) {
    const user = Auth.getCurrentUser();
    if (!user) return Promise.reject({ message: '请先登录' });
    const patch = {};
    if (data.nickName !== undefined) patch.nickName = data.nickName;
    if (data.avatarUrl !== undefined) patch.avatarUrl = data.avatarUrl;
    if (data.roles !== undefined) patch.roles = data.roles;
    if (data.activeRole !== undefined) patch.activeRole = data.activeRole;
    const updated = DB.update('users', user._id, patch);
    Object.assign(user, patch);
    Auth.setUser(user);
    return Promise.resolve(user);
  },
  // addReport
  addReport(data) {
    const user = Auth.getCurrentUser();
    if (!user) return Promise.reject({ message: '请先登录' });
    if (!data.type || !data.location) return Promise.reject({ message: '参数不完整' });
    if (!data.images || !data.images.length) return Promise.reject({ message: '请至少上传一张照片' });
    const record = DB.insert('reports', {
      _openid: user._openid, type: data.type, images: data.images, location: data.location,

    });

  },

    const reports = DB.get('reports').sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
    const list = reports.map(r => ({ ...r, distance: lat != null ? Math.round(Math.random() * radius) : 0 }));
    return Promise.resolve({ list });
  },
  // getAnimals
  getAnimals({ type = 'all', page = 1, pageSize = 20, sortBy = 'latest', lat, lng }) {
    let animals = DB.get('animals').sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
    if (type !== 'all') animals = animals.filter(a => a.type === type);
    const start = (page - 1) * pageSize;
    const list = animals.slice(start, start + pageSize).map(a => ({ ...a, distance: lat != null ? Math.round(Math.random() * 50000) : null }));
    return Promise.resolve({ list, total: animals.length, hasMore: start + list.length < animals.length });
  },
  // addAnimal
  addAnimal(data) {
    const user = Auth.getCurrentUser();
    if (!user) return Promise.reject({ message: '请先登录' });
    if (!data.type || !data.images || !data.images.length) return Promise.reject({ message: '参数不完整' });
    const record = DB.insert('animals', {
      _openid: user._openid, name: data.name || '', type: data.type, breed: data.breed || '',
      age: data.age || '', gender: data.gender || '', images: data.images,
      personality: data.personality || '', healthStatus: data.healthStatus || { sterilized: false, vaccinated: false, dewormed: false },
      location: data.location || null, address: data.address || '', story: data.story || '', status: 'available'
    });
    return Promise.resolve({ _id: record._id });
  },
  // submitAdoption
  submitAdoption({ animalId, applicant, reason }) {
    const user = Auth.getCurrentUser();
    if (!user) return Promise.reject({ message: '请先登录' });
    if (!animalId || !applicant || !applicant.name || !applicant.phone) return Promise.reject({ message: '请填写姓名与联系方式' });
    const animal = DB.findById('animals', animalId);
    if (!animal) return Promise.reject({ message: '该动物不存在' });
    if (animal.status === 'adopted') return Promise.reject({ message: '该动物已被领养' });
    const apps = DB.get('adoption_applications');
    if (apps.find(a => a._openid === user._openid && a.animalId === animalId)) return Promise.reject({ message: '你已提交过该动物的领养申请' });
    const record = DB.insert('adoption_applications', { _openid: user._openid, animalId, applicant, reason: reason || '', status: 'pending', publisherRead: false });
    if (animal.status === 'available') DB.update('animals', animalId, { status: 'applying' });
    return Promise.resolve({ _id: record._id });
  },
  // getMyRecords
  getMyRecords({ type = 'reports', page = 1, pageSize = 20 }) {
    const user = Auth.getCurrentUser();
    if (!user) return Promise.reject({ message: '请先登录' });
    const map = { reports: 'reports', animals: 'animals', applications: 'adoption_applications' };
    const col = map[type]; if (!col) return Promise.reject({ message: '未知记录类型' });
    let list = DB.findByOpenid(col, user._openid).sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
    const start = (page - 1) * pageSize;
    const pageList = list.slice(start, start + pageSize);
    if (type === 'applications') {
      pageList.forEach(a => { a.animal = DB.findById('animals', a.animalId) || null; });
    }
    return Promise.resolve({ list: pageList, total: list.length, hasMore: start + pageList.length < list.length });
  },
  // getReceivedApplications
  getReceivedApplications({ scope = 'mine', status, animalId, page = 1, pageSize = 20, markRead = false }) {
    const user = Auth.getCurrentUser();
    if (!user) return Promise.reject({ message: '请先登录' });
    let animalIds = [];
    if (animalId) {
      const animal = DB.findById('animals', animalId);
      if (!animal || animal._openid !== user._openid) return Promise.reject({ message: '无权查看' });
      animalIds = [animalId];
    } else if (scope === 'all') {
      // 志愿者：查所有pending
    } else {
      const myAnimals = DB.findByOpenid('animals', user._openid);
      animalIds = myAnimals.map(a => a._id);
      if (!animalIds.length) return Promise.resolve({ list: [], total: 0, hasMore: false, unreadCount: 0 });
    }
    let apps = DB.get('adoption_applications');
    if (animalIds.length) apps = apps.filter(a => animalIds.includes(a.animalId));
    if (status) apps = apps.filter(a => a.status === status);
    else if (scope === 'all') apps = apps.filter(a => a.status === 'pending');
    apps = apps.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
    const start = (page - 1) * pageSize;
    const list = apps.slice(start, start + pageSize);
    list.forEach(a => { a.animal = DB.findById('animals', a.animalId) || null; });
    let unreadCount = 0;
    if (scope === 'mine' && page === 1) {
      unreadCount = apps.filter(a => a.status === 'pending' && !a.publisherRead).length;
    }
    if (markRead && scope === 'mine' && list.length) {
      list.forEach(a => { if (a.status === 'pending' && !a.publisherRead) { DB.update('adoption_applications', a._id, { publisherRead: true }); } });
      unreadCount = 0;
    }
    return Promise.resolve({ list, total: apps.length, hasMore: start + list.length < apps.length, unreadCount });
  },
  // reviewApplication
  reviewApplication({ applicationId, action }) {
    const user = Auth.getCurrentUser();
    if (!user) return Promise.reject({ message: '请先登录' });
    if (!applicationId || !['approve','reject'].includes(action)) return Promise.reject({ message: '参数错误' });
    const app = DB.findById('adoption_applications', applicationId);
    if (!app) return Promise.reject({ message: '申请不存在' });
    if (app.status !== 'pending') return Promise.reject({ message: '该申请已处理' });
    const animal = DB.findById('animals', app.animalId);
    if (!animal || animal._openid !== user._openid) return Promise.reject({ message: '无权审核' });
    if (animal.status === 'adopted') return Promise.reject({ message: '该动物已被领养' });
    const newStatus = action === 'approve' ? 'approved' : 'rejected';
    DB.update('adoption_applications', applicationId, { status: newStatus, reviewedAt: new Date().toISOString(), publisherRead: true });
    if (action === 'approve') {
      DB.update('animals', animal._id, { status: 'adopted' });
      DB.get('adoption_applications').filter(a => a.animalId === animal._id && a.status === 'pending' && a._id !== applicationId).forEach(a => {
        DB.update('adoption_applications', a._id, { status: 'rejected', reviewedAt: new Date().toISOString(), publisherRead: true });
      });
    }
    return Promise.resolve({ applicationId, status: newStatus });
  },
  // getAnimalDetail
  getAnimalDetail({ id }) {
    if (!id) return Promise.reject({ message: '缺少ID' });
    const animal = DB.findById('animals', id);
    if (!animal) return Promise.reject({ message: '动物不存在' });
    const user = Auth.getCurrentUser();
    animal.isOwner = !!(user && user._openid && animal._openid === user._openid);
    return Promise.resolve(animal);
  },
  // getReportDetail
  getReportDetail({ id }) {
    if (!id) return Promise.reject({ message: '缺少ID' });
    const report = DB.findById('reports', id);
    if (!report) return Promise.reject({ message: '上报不存在' });
    return Promise.resolve(report);
  }
};

// ==================== 工具函数 ====================
const Utils = {
  formatTime(date) {
    const d = new Date(date); const now = Date.now(); const diff = now - d.getTime();
    const m = 60000, h = 3600000, day = 86400000;
    if (diff < m) return '刚刚';
    if (diff < h) return Math.floor(diff/m) + '分钟前';
    if (diff < day) return Math.floor(diff/h) + '小时前';
    if (diff < 7*day) return Math.floor(diff/day) + '天前';
    return (d.getMonth()+1) + '月' + d.getDate() + '日';
  },
  formatDateTime(date) {
    const d = new Date(date); const p = n => String(n).padStart(2,'0');
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
  },
  formatDistance(meters) {
    if (meters == null) return '';
    if (meters < 1000) return meters + 'm';
    return (meters/1000).toFixed(1) + 'km';
  },
  getDistance(lat1, lng1, lat2, lng2) {
    const R = 6371000; const toRad = d => d*Math.PI/180;
    const dLat = toRad(lat2-lat1), dLng = toRad(lng2-lng1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
    return Math.round(2*R*Math.asin(Math.sqrt(a)));
  }
};

  const mask = document.createElement('div');
  mask.className = 'preview-mask';
  mask.innerHTML = `<div class="preview-close" onclick="this.parentElement.remove()">×</div><img src="${src}">`;

}
// 复制链接
function copyLink() {
  const url = location.href;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(() => toast('链接已复制')).catch(() => fallbackCopy(url));
  } else {
    fallbackCopy(url);
  }
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('链接已复制'); } catch(e) { toast('复制失败，请手动复制'); }
  document.body.removeChild(ta);
}

// ==================== 路由（纯内存路由，不依赖 location.hash，兼容 file:// 协议） ====================
const Router = {
  stack: [],
  currentTab: 'index',
  currentPath: '/index',
  currentQuery: {},
  init() {
    this.render('/index', {});
  },
  navigate(path, query) {
    this.stack.push({ path: this.currentPath, query: this.currentQuery });
    this.render(path, query || {});
  },
  back() {
    if (this.stack.length) {
      const prev = this.stack.pop();
      this.render(prev.path, prev.query);
    } else {
      this.switchTab('index');
    }
  },
  switchTab(tab) {
    this.currentTab = tab;
    this.stack = [];
    this.render('/' + tab, {});
  },
  render(path, query) {
    this.currentPath = path;
    this.currentQuery = query || {};
    const app = document.getElementById('app');
    const pageName = path.replace(/^\//, '').split('/')[0];
    const isTab = ['index','adopt','mine'].includes(pageName);
    if (isTab) this.currentTab = pageName;
    const renderer = Pages[pageName] || Pages.index;
    app.innerHTML = renderer.render(query) + (isTab ? this.tabBarHTML() : '');
    if (renderer.init) renderer.init(query);
    window.scrollTo(0, 0);
  },
  tabBarHTML() {
    const tabs = [
      { name: 'index', icon: '📍', label: '流浪地图' },
      { name: 'adopt', icon: '🐾', label: '领养中心' },
      { name: 'mine', icon: '👤', label: '个人' }
    ];
    return `<div id="tabbar">${tabs.map(t => `
      <div class="tab-item ${this.currentTab===t.name?'active':''}" onclick="Router.switchTab('${t.name}')">
        <div class="tab-icon">${t.icon}</div>
        <div class="tab-label">${t.label}</div>
        ${t.name==='mine' && UnreadBadge.get() ? `<div class="tab-badge">${UnreadBadge.get()}</div>` : ''}
      </div>`).join('')}</div>`;
  }
};

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

  toggleRole(role, el) {

    const newRoles = this._tempRoles;

    // 如果当前activeRole不在新roles中，切换到第一个
    if (!newRoles.includes(user.activeRole)) {

    showLoading('处理中...');
    Cloud.reviewApplication({ applicationId: id, action }).then(() => {
      hideLoading();
      toast(action==='approve'?'已通过':'已拒绝');

      this.loadList(true);
      UnreadBadge.refresh().then(() => this.updateBadge());

      const file = input.files[0]; if (!file) return;
      fileToBase64(file).then(base64 => {

        });
      });

  onNameConfirm(name) {

      toast('昵称已更新');

  updateBadge() {
    const badge = document.getElementById('received-badge');

      badge.textContent = n;

  logout() {
    if (!confirm('确定退出登录？')) return;

    Router.switchTab('index');

      }, 500);

      const files = Array.from(input.files);
      if (!files.length) return;
      Promise.all(files.map(fileToBase64)).then(images => {
        this.data.images = this.data.images.concat(images).slice(0, 6);
        this.renderImages();
      });

    const el = document.getElementById('report-uploader');

    el.innerHTML = this.data.images.map((img, i) => `<div class="upload-item"><img src="${img}" onclick="previewImage('${img}')"><div class="upload-del" onclick="event.stopPropagation();Pages.report.delImage(${i})">×</div></div>`).join('') + (this.data.images.length < 6 ? '<div class="upload-add" onclick="Pages.report.addImage()">+</div>' : '');

      document.getElementById('report-addr-input').value = this.data.address;

    if (!navigator.geolocation) { fallback(); return; }
    navigator.geolocation.getCurrentPosition(pos => {
      hideLoading();
      this.data.location = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      this.data.address = '已定位到当前位置';

      document.getElementById('report-loc').classList.remove('placeholder');

    if (v) {
      this.data.address = v;

      document.getElementById('report-loc').textContent = v;
      document.getElementById('report-loc').classList.remove('placeholder');

  submit() {
    if (!checkLogin('/report')) return;
    const d = this.data;
    if (!d.images.length) { toast('请上传至少一张照片'); return; }
    if (!d.location) { toast('请选择位置或输入地址'); return; }
    d.description = document.getElementById('report-desc').value;
    showLoading('提交中...');
    Cloud.addReport(d).then(() => {
      hideLoading();
      toast('上报成功，感谢你');
      setTimeout(() => Router.back(), 1000);
    }).catch(err => { hideLoading(); showError(err); });
  }
};

Pages['adopt-detail'] = {
  render(q) {
    return `<div class="navbar"><div class="navbar-back" onclick="Router.back()">‹</div><div class="navbar-title">领养详情</div></div>
    <div id="ad-content"><div class="loading-text">加载中...</div></div>`;
  },
  init(q) {
    this.currentId = q.id;
    this.loadDetail(q.id);
  },
  loadDetail(id) {
    Cloud.getAnimalDetail({ id }).then(animal => {
      const typeText = ANIMAL_TYPE[animal.type] || '其他';
      const statusText = ADOPT_STATUS[animal.status] || '待领养';
      const emoji = animal.type === 'cat' ? '🐱' : (animal.type === 'dog' ? '🐶' : '🐾');
      const cover = animal.images && animal.images[0]
        ? `<img src="${animal.images[0]}" class="detail-cover" onclick="previewImage('${animal.images[0]}')">`
        : `<div class="detail-cover">${emoji}</div>`;
      // 字段兼容：description→story
      const story = animal.story || animal.description || '';
      // 字段兼容：location.address→address, latitude/longitude→lat/lng
      let address = animal.address || '';
      if (!address && animal.location) address = animal.location.address || '';
      // 字段兼容：gender可能存中文
      const genderText = animal.gender ? (GENDER[animal.gender] || animal.gender) : '';

      const hs = animal.healthStatus || {};
      const healthList = [['sterilized','已绝育'],['vaccinated','已疫苗'],['dewormed','已驱虫']].map(([k,l]) => `<div class="health-item ${hs[k]?'health-ok':'health-no'}">${hs[k]?'✓':'○'} ${l}</div>`).join('');
      const imgs = animal.images && animal.images.length > 1
        ? `<div class="detail-section"><h3>更多照片</h3><div class="flex" style="gap:8px;flex-wrap:wrap">${animal.images.slice(1).map(img => `<img src="${img}" style="width:100px;height:100px;border-radius:8px;object-fit:cover;cursor:pointer" onclick="previewImage('${img}')">`).join('')}</div></div>`
        : '';
      const isOwner = animal.isOwner;
      const canApply = !isOwner && animal.status !== 'adopted';

      // 发布者视角：显示收到的申请
      let appsHtml = '';
      if (isOwner) {
        appsHtml = `<div class="detail-section" id="owner-apps"><h3>收到的申请</h3><div class="loading-text">加载中...</div></div>`;
      }

      // 底部操作栏
      let bottomBar = '';
      if (isOwner) {
        bottomBar = `<div class="detail-bottom"><button class="btn-outline btn-block" onclick="Pages['adopt-detail'].share()">分享给更多人</button></div>`;
      } else if (canApply) {
        bottomBar = `<div class="detail-bottom two-btn">
          <button class="btn-outline" onclick="Pages['adopt-detail'].share()">分享</button>
          <button class="btn-primary" onclick="Router.navigate('/adopt-apply',{animalId:'${id}'})">申请领养</button>
        </div>`;
      } else if (animal.status === 'adopted') {
        bottomBar = `<div class="detail-bottom"><button class="btn-outline btn-block" disabled style="opacity:.5">已被领养</button></div>`;
      }

      const publisherName = animal.publisherName ? `<div class="detail-meta">发布者：${animal.publisherName}</div>` : '';

      document.getElementById('ad-content').innerHTML = `${cover}
      <div class="detail-body">
        <div class="flex-between">
          <span class="detail-title">${animal.name || typeText}</span>
          <span class="status-tag ${STATUS_TAG_CLASS[animal.status]||'status-available'}">${statusText}</span>
        </div>
        <div class="detail-meta">${typeText}${animal.breed?' · '+animal.breed:''}${animal.age?' · '+animal.age:''}${genderText?' · '+genderText:''}</div>
        ${animal.personality?`<div class="detail-meta">性格：${animal.personality}</div>`:''}
        ${address?`<div class="detail-meta">📍 ${address}</div>`:''}
        ${publisherName}
        <div class="health-row">${healthList}</div>
        ${story?`<div class="detail-section"><h3>关于它</h3><p>${story}</p></div>`:''}
        ${imgs}
        ${appsHtml}
      </div>${bottomBar}`;

      if (isOwner) this.loadApps(id);
    }).catch(err => {
      document.getElementById('ad-content').innerHTML = `<div class="empty-state"><div class="empty-icon">🐾</div><div class="empty-text">加载失败</div><div class="empty-desc">${err.message||'动物不存在'}</div></div>`;
    });
  },
  loadApps(animalId) {
    Cloud.getReceivedApplications({ scope: 'mine', animalId, page: 1 }).then(data => {
      const list = (data && data.list) || [];
      const el = document.getElementById('owner-apps');
      if (!el) return;
      if (!list.length) { el.innerHTML = '<h3>收到的申请</h3><div class="text-secondary" style="padding:8px 0">暂无申请</div>'; return; }
      el.innerHTML = '<h3>收到的申请</h3>' + list.map(a => {
        const housingText = a.applicant.housing ? ({own:'自有住房', 'rent-stable':'稳定租房', 'rent-shared':'合租', dorm:'宿舍'}[a.applicant.housing] || a.applicant.housing) : '';
        return `<div class="app-item">
          <div class="app-header"><span class="app-name">${a.applicant.name}</span><span class="status-tag ${STATUS_TAG_CLASS[a.status]||'status-pending'}">${APPLICATION_STATUS[a.status]||'待审核'}</span></div>
          <div class="app-contact">📞 ${a.applicant.phone} <span style="color:var(--color-text-secondary);margin-left:8px">${a.applicant.age||''} · ${housingText}</span></div>
          ${a.applicant.experience?`<div class="app-reason">经验：${a.applicant.experience}</div>`:''}
          ${a.reason?`<div class="app-reason">理由：${a.reason}</div>`:''}
          <div class="rc-time">${Utils.formatTime(a.createdAt)}</div>
          ${a.status==='pending'?`<div class="app-actions"><button class="btn-reject" onclick="Pages['adopt-detail'].review('${a._id}','reject')">拒绝</button><button class="btn-approve" onclick="Pages['adopt-detail'].review('${a._id}','approve')">通过</button></div>`:''}
        </div>`;
      }).join('');
    }).catch(() => {});
  },
  review(id, action) {
    if (!confirm(action==='approve'?'确定通过？通过后其他申请将自动拒绝。':'确定拒绝？')) return;
    showLoading('处理中...');
    Cloud.reviewApplication({ applicationId: id, action }).then(() => {
      hideLoading();
      toast(action==='approve'?'已通过':'已拒绝');
      this.loadDetail(this.currentId);
    }).catch(err => { hideLoading(); showError(err); });
  },
  share() {
    copyLink();

      </div></div></div>
      <div class="section-card"><div class="section-title">居住情况</div><div class="section-body"><div class="opt-row">

      </div></div></div>
      <div class="section-card"><div class="section-title">养宠经验</div><div class="section-body"><textarea class="textarea" id="aa-exp" placeholder="是否有养宠经验、目前是否有宠物等（选填）" maxlength="300"></textarea></div></div>
      <div class="section-card"><div class="section-title">领养理由</div><div class="section-body"><textarea class="textarea" id="aa-reason" placeholder="为什么想领养TA？会怎样照顾TA？" maxlength="500"></textarea></div></div>
      <button class="btn-primary btn-block" onclick="Pages['adopt-apply'].submit('${q.animalId||''}')">提交申请</button>
    </div>`;
  },
  init(q) {
    this.data = { age: '26-35', housing: 'own' };
  },
  pick(key, val, el) {
    this.data[key] = val;
    el.parentElement.querySelectorAll('.opt').forEach(o => o.classList.remove('active'));
    el.classList.add('active');
  },
  submit(animalId) {
    if (!checkLogin('/adopt-apply?animalId='+animalId)) return;
    const name = document.getElementById('aa-name').value.trim();
    const phone = document.getElementById('aa-phone').value.trim();
    const reason = document.getElementById('aa-reason').value.trim();
    const experience = document.getElementById('aa-exp').value.trim();
    if (!name) { toast('请填写姓名'); return; }
    if (!phone || !/^1\d{10}$/.test(phone)) { toast('请填写正确的手机号'); return; }
    if (!reason) { toast('请填写领养理由'); return; }
    showLoading('提交中...');
    Cloud.submitAdoption({ animalId, applicant: { name, phone, age: this.data.age, housing: this.data.housing, experience }, reason }).then(() => {
      hideLoading();
      toast('申请已提交');
      setTimeout(() => Router.back(), 1000);
    }).catch(err => { hideLoading(); showError(err); });
  }
};
