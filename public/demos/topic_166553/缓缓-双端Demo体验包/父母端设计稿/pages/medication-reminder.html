<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>缓缓</title>
    <style id="theme-vars">
/* 缓缓 Huanhuan — Brand Design Tokens (Parent App) */
/* Version 1.0 · Mobile · Elderly-Friendly */

:root {
  /* === Color System === */
  --color-primary: #2D6A4F;
  --color-primary-light: #40916C;
  --color-primary-lighter: #52B788;
  --color-primary-bg: #D8F3DC;
  --color-primary-bg-soft: #F0FAF4;

  --color-warm-cream: #F4F1DE;
  --color-coral: #E07A5F;
  --color-coral-light: #F2A68B;
  --color-coral-bg: #FDF0EB;

  --color-bg: #FFFFFF;
  --color-bg-secondary: #F8F9FA;
  --color-bg-elevated: #FFFFFF;

  --color-text: #1B1B1B;
  --color-text-secondary: #6B7280;
  --color-text-tertiary: #9CA3AF;
  --color-text-inverse: #FFFFFF;

  --color-border: #E5E7EB;
  --color-border-light: #F3F4F6;

  --state-success: #2D6A4F;
  --state-warning: #E07A5F;
  --state-error: #DC2626;
  --state-info: #3B82F6;

  /* === Typography === */
  --font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-size-display: 28px;
  --font-size-h1: 24px;
  --font-size-h2: 22px;
  --font-size-h3: 20px;
  --font-size-body: 18px;
  --font-size-body-large: 20px;
  --font-size-caption: 16px;
  --font-size-small: 14px;

  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;

  --line-height-tight: 1.3;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.6;

  /* === Spacing === */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;
  --space-4xl: 40px;

  /* === Radius === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* === Shadows === */
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.08);

  /* === Touch Targets (Elderly-Friendly) === */
  --button-height: 56px;
  --button-height-large: 64px;
  --button-radius: 12px;
  --icon-size: 24px;
  --icon-size-large: 32px;
  --min-touch-target: 48px;

  /* === Overlay === */
  --overlay-bg: rgba(27, 27, 27, 0.6);
  --overlay-card-bg: rgba(255, 255, 255, 0.98);
}

html {
  font-size: 18px;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--font-family);
  color: var(--color-text);
  background-color: var(--color-bg);
  line-height: var(--line-height-normal);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Large touch targets for elderly users */
button, a, [role="button"] {
  min-height: var(--min-touch-target);
  min-width: var(--min-touch-target);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="bg-warm-cream min-h-screen flex flex-col items-center justify-center">

  <!-- Heart health icon -->
  <div class="w-20 h-20 rounded-full flex items-center justify-center text-4xl" style="background-color: #FDE8E0;">
    🫀
  </div>

  <!-- Section label -->
  <p class="mt-6 text-h1 font-semibold text-coral text-center">安康守护</p>

  <!-- Time display -->
  <div class="mt-4 text-center">
    <p class="text-display font-semibold text-gray-800">08:00</p>
    <p class="text-caption text-gray-400">上午</p>
  </div>

  <!-- Medicine info card -->
  <div class="mt-8 bg-white rounded-2xl px-8 py-6 shadow-sm mx-10 w-full max-w-sm">
    <p class="text-3xl">💊</p>
    <p class="mt-2 text-h2 font-semibold text-gray-800">该吃降压药了</p>
    <p class="mt-2 text-body text-gray-500">苯磺酸氨氯地平片</p>
    <p class="mt-1 text-body text-gray-400">1 片，温水送服</p>
    <p class="mt-4 text-caption text-primary cursor-pointer">🔊 再听一遍</p>
  </div>

  <!-- Bottom action buttons -->
  <div class="mt-10 px-10 w-full max-w-sm flex gap-3">
    <div class="flex-1 bg-primary text-white rounded-xl py-4 text-body font-medium text-center cursor-pointer">✅ 已服用</div>
    <div class="flex-1 bg-white text-gray-600 rounded-xl py-4 text-body font-medium text-center border-2 border-gray-200 cursor-pointer">⏰ 等会提醒</div>
  </div>

</body>
</html>
