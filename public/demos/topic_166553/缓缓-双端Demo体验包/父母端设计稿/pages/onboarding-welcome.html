<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>缓缓 - 欢迎页</title>
    <style id="theme-vars">
/* 缓缓 Huanhuan — Brand Design Tokens (Parent App) */
/* Version 1.0 · Mobile · Elderly-Friendly */

:root {
  /* === Color System === */
  --color-primary: #2D6A4F;
  --color-primary-light: #40916C;
  --color-primary-lighter: #52B788;
  --color-primary-bg: #D8F3DC;
  --color-primary-bg-soft: #F0FAF4;

  --color-warm-cream: #F4F1DE;
  --color-coral: #E07A5F;
  --color-coral-light: #F2A68B;
  --color-coral-bg: #FDF0EB;

  --color-bg: #FFFFFF;
  --color-bg-secondary: #F8F9FA;
  --color-bg-elevated: #FFFFFF;

  --color-text: #1B1B1B;
  --color-text-secondary: #6B7280;
  --color-text-tertiary: #9CA3AF;
  --color-text-inverse: #FFFFFF;

  --color-border: #E5E7EB;
  --color-border-light: #F3F4F6;

  --state-success: #2D6A4F;
  --state-warning: #E07A5F;
  --state-error: #DC2626;
  --state-info: #3B82F6;

  /* === Typography === */
  --font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-size-display: 28px;
  --font-size-h1: 24px;
  --font-size-h2: 22px;
  --font-size-h3: 20px;
  --font-size-body: 18px;
  --font-size-body-large: 20px;
  --font-size-caption: 16px;
  --font-size-small: 14px;

  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;

  --line-height-tight: 1.3;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.6;

  /* === Spacing === */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;
  --space-4xl: 40px;

  /* === Radius === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* === Shadows === */
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.08);

  /* === Touch Targets (Elderly-Friendly) === */
  --button-height: 56px;
  --button-height-large: 64px;
  --button-radius: 12px;
  --icon-size: 24px;
  --icon-size-large: 32px;
  --min-touch-target: 48px;

  /* === Overlay === */
  --overlay-bg: rgba(27, 27, 27, 0.6);
  --overlay-card-bg: rgba(255, 255, 255, 0.98);
}

html {
  font-size: 18px;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--font-family);
  color: var(--color-text);
  background-color: var(--color-bg);
  line-height: var(--line-height-normal);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Large touch targets for elderly users */
button, a, [role="button"] {
  min-height: var(--min-touch-target);
  min-width: var(--min-touch-target);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-primary-light: var(--color-primary-light);
    --color-primary-lighter: var(--color-primary-lighter);
    --color-primary-bg: var(--color-primary-bg);
    --color-warm-cream: var(--color-warm-cream);
    --color-coral: var(--color-coral);
    --color-coral-light: var(--color-coral-light);
    --color-border: var(--color-border);
    --color-border-light: var(--color-border-light);
    --font-size-display: 28px;
    --line-height-display: 1.3;
    --font-size-h1: 24px;
    --line-height-h1: 1.3;
    --font-size-h2: 22px;
    --line-height-h2: 1.3;
    --font-size-h3: 20px;
    --line-height-h3: 1.5;
    --font-size-body: 18px;
    --line-height-body: 1.5;
    --font-size-body-lg: 20px;
    --line-height-body-lg: 1.5;
    --font-size-caption: 16px;
    --line-height-caption: 1.5;
  }
  @layer base {
    body { background: var(--color-bg); color: var(--color-text); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="min-h-screen flex flex-col items-center justify-center px-6 bg-white" style="max-width: 375px; margin: 0 auto;">
        <!-- Center content area -->
        <div class="flex flex-col items-center">
            <!-- App logo -->
            <img src="../assets/onboarding-logo.jpg" alt="缓缓 logo" class="w-28 h-28 rounded-2xl object-cover mx-auto">
            <!-- App name -->
            <p class="text-2xl font-semibold text-primary mt-6">缓缓</p>
            <!-- Tagline -->
            <p class="text-body text-gray-500 mt-2">日子缓缓，陪伴轻轻</p>
            <!-- Spacing -->
            <div class="mt-4"></div>
            <!-- Welcome heading -->
            <h1 class="text-h1 font-semibold text-gray-800">您好，我是缓缓</h1>
            <!-- Welcome copy -->
            <p class="text-body-lg text-gray-500 mt-2">往后日子缓缓过，我轻轻陪着您。</p>
        </div>

        <!-- Bottom area -->
        <div class="mt-auto pb-12 w-full">
            <!-- Primary CTA button -->
            <button class="w-full bg-primary text-white rounded-xl text-body font-medium py-4">开始使用</button>
            <!-- Step dots -->
            <div class="flex justify-center gap-2 mt-6">
                <span class="w-6 h-2 rounded-full bg-primary"></span>
                <span class="w-2 h-2 rounded-full bg-gray-300"></span>
                <span class="w-2 h-2 rounded-full bg-gray-300"></span>
            </div>
        </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
