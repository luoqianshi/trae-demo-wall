<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>缓缓</title>
    <style id="theme-vars">
/* 缓缓 Huanhuan — Brand Design Tokens (Parent App) */
/* Version 1.0 · Mobile · Elderly-Friendly */

:root {
  /* === Color System === */
  --color-primary: #2D6A4F;
  --color-primary-light: #40916C;
  --color-primary-lighter: #52B788;
  --color-primary-bg: #D8F3DC;
  --color-primary-bg-soft: #F0FAF4;

  --color-warm-cream: #F4F1DE;
  --color-coral: #E07A5F;
  --color-coral-light: #F2A68B;
  --color-coral-bg: #FDF0EB;

  --color-bg: #FFFFFF;
  --color-bg-secondary: #F8F9FA;
  --color-bg-elevated: #FFFFFF;

  --color-text: #1B1B1B;
  --color-text-secondary: #6B7280;
  --color-text-tertiary: #9CA3AF;
  --color-text-inverse: #FFFFFF;

  --color-border: #E5E7EB;
  --color-border-light: #F3F4F6;

  --state-success: #2D6A4F;
  --state-warning: #E07A5F;
  --state-error: #DC2626;
  --state-info: #3B82F6;

  /* === Typography === */
  --font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-size-display: 28px;
  --font-size-h1: 24px;
  --font-size-h2: 22px;
  --font-size-h3: 20px;
  --font-size-body: 18px;
  --font-size-body-large: 20px;
  --font-size-caption: 16px;
  --font-size-small: 14px;

  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;

  --line-height-tight: 1.3;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.6;

  /* === Spacing === */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;
  --space-4xl: 40px;

  /* === Radius === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* === Shadows === */
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.08);

  /* === Touch Targets (Elderly-Friendly) === */
  --button-height: 56px;
  --button-height-large: 64px;
  --button-radius: 12px;
  --icon-size: 24px;
  --icon-size-large: 32px;
  --min-touch-target: 48px;

  /* === Overlay === */
  --overlay-bg: rgba(27, 27, 27, 0.6);
  --overlay-card-bg: rgba(255, 255, 255, 0.98);
}

html {
  font-size: 18px;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--font-family);
  color: var(--color-text);
  background-color: var(--color-bg);
  line-height: var(--line-height-normal);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Large touch targets for elderly users */
button, a, [role="button"] {
  min-height: var(--min-touch-target);
  min-width: var(--min-touch-target);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="bg-white min-h-screen max-w-[375px] mx-auto">

  <!-- Header bar -->
  <div class="text-body font-medium text-gray-600 px-6 py-4 border-b border-gray-100">
    &larr; 去楼下看看
  </div>

  <!-- Hero image -->
  <img src="../assets/riverside-park.jpg" class="w-full h-52 object-cover" alt="滨河公园">

  <!-- Content area -->
  <div class="px-6 mt-5">

    <!-- Location card -->
    <div class="rounded-xl border border-gray-100 p-5">
      <!-- Location name row -->
      <div class="flex items-center gap-2">
        <svg class="w-5 h-5 text-primary flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z"/>
        </svg>
        <span class="text-h2 font-semibold text-gray-800">滨河公园</span>
      </div>

      <!-- Distance info -->
      <div class="mt-2 text-body text-gray-500">
        离您约 800 米，步行 12 分钟
      </div>

      <!-- Weather info -->
      <div class="mt-2 flex items-center gap-2 text-body text-primary">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9a3.75 3.75 0 1 0 0 7.5A3.75 3.75 0 0 0 12 9Z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1.5m0 15V21m-7.5-10.5H3m18 0h-1.5M6.343 6.343l1.06 1.06m9.193 9.194 1.06 1.06M6.343 17.657l1.06-1.06m9.193-9.194 1.06-1.06"/>
        </svg>
        <span>现在 25&deg;C，微风，适合散步</span>
      </div>
    </div>

    <!-- Navigation button -->
    <div class="mt-6">
      <div class="bg-primary text-white rounded-xl py-4 text-body font-medium text-center w-full">
        &#x1F4CD; 一键导航
      </div>
    </div>

  </div>

  <!-- Bottom action area -->
  <div class="mt-8 px-6 pb-10 flex gap-3">
    <div class="flex-1 bg-primary-bg text-primary rounded-xl py-4 text-body font-medium text-center border border-primary-bg">
      &#x1F6B6; 我到了
    </div>
    <div class="flex-1 bg-gray-50 text-gray-400 rounded-xl py-4 text-body font-medium text-center">
      这次算了
    </div>
  </div>

</body>
</html>
