<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>缓缓</title>
    <style id="theme-vars">
/* 缓缓 Huanhuan — Brand Design Tokens (Parent App) */
/* Version 1.0 · Mobile · Elderly-Friendly */

:root {
  /* === Color System === */
  --color-primary: #2D6A4F;
  --color-primary-light: #40916C;
  --color-primary-lighter: #52B788;
  --color-primary-bg: #D8F3DC;
  --color-primary-bg-soft: #F0FAF4;

  --color-warm-cream: #F4F1DE;
  --color-coral: #E07A5F;
  --color-coral-light: #F2A68B;
  --color-coral-bg: #FDF0EB;

  --color-bg: #FFFFFF;
  --color-bg-secondary: #F8F9FA;
  --color-bg-elevated: #FFFFFF;

  --color-text: #1B1B1B;
  --color-text-secondary: #6B7280;
  --color-text-tertiary: #9CA3AF;
  --color-text-inverse: #FFFFFF;

  --color-border: #E5E7EB;
  --color-border-light: #F3F4F6;

  --state-success: #2D6A4F;
  --state-warning: #E07A5F;
  --state-error: #DC2626;
  --state-info: #3B82F6;

  /* === Typography === */
  --font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-size-display: 28px;
  --font-size-h1: 24px;
  --font-size-h2: 22px;
  --font-size-h3: 20px;
  --font-size-body: 18px;
  --font-size-body-large: 20px;
  --font-size-caption: 16px;
  --font-size-small: 14px;

  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;

  --line-height-tight: 1.3;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.6;

  /* === Spacing === */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;
  --space-4xl: 40px;

  /* === Radius === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* === Shadows === */
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.08);

  /* === Touch Targets (Elderly-Friendly) === */
  --button-height: 56px;
  --button-height-large: 64px;
  --button-radius: 12px;
  --icon-size: 24px;
  --icon-size-large: 32px;
  --min-touch-target: 48px;

  /* === Overlay === */
  --overlay-bg: rgba(27, 27, 27, 0.6);
  --overlay-card-bg: rgba(255, 255, 255, 0.98);
}

html {
  font-size: 18px;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--font-family);
  color: var(--color-text);
  background-color: var(--color-bg);
  line-height: var(--line-height-normal);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Large touch targets for elderly users */
button, a, [role="button"] {
  min-height: var(--min-touch-target);
  min-width: var(--min-touch-target);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen bg-white pb-24">

  <!-- Header -->
  <div class="text-h2 font-semibold text-gray-800 px-6 py-4 border-b border-gray-100">
    用药计划
  </div>

  <!-- Date label -->
  <div class="text-body text-gray-500 px-6 mt-4">
    今天 &middot; 3月15日 周六
  </div>

  <!-- Timeline cards -->
  <div class="px-6 mt-5 flex flex-col gap-3">

    <!-- Card 1: Completed (taken) -->
    <div class="bg-primary-bg-soft rounded-xl p-4 border border-primary-bg">
      <div class="flex justify-between items-center">
        <span class="text-caption font-medium text-primary">08:00</span>
        <span class="text-caption font-medium text-primary">&#9989; 已服用</span>
      </div>
      <div class="mt-2">
        <span class="text-body font-medium text-gray-700">降压药（苯磺酸氨氯地平）</span>
      </div>
    </div>

    <!-- Card 2: Pending (needs action) -->
    <div class="bg-white rounded-xl p-4 border-2 border-coral shadow-sm">
      <div class="flex justify-between items-center">
        <span class="text-caption font-medium text-coral">12:30</span>
        <span class="text-caption font-medium text-coral">&#9203; 待服用</span>
      </div>
      <div class="mt-2">
        <span class="text-body font-semibold text-gray-800">钙片</span>
      </div>
      <div class="flex gap-2 mt-3">
        <div class="flex-1 bg-primary text-white rounded-lg py-3 text-caption font-medium text-center">&#9989; 已服用</div>
        <div class="flex-1 bg-coral-bg text-coral rounded-lg py-3 text-caption font-medium text-center">&#9200; 等会提醒</div>
      </div>
    </div>

    <!-- Card 3: Future (not yet time) -->
    <div class="bg-gray-50 rounded-xl p-4 border border-gray-100">
      <div class="flex justify-between items-center">
        <span class="text-caption text-gray-400">20:00</span>
        <span class="text-caption text-gray-300">&middot; 未到时间</span>
      </div>
      <div class="mt-2">
        <span class="text-body text-gray-400">降压药</span>
      </div>
    </div>

  </div>

  <!-- Add reminder button -->
  <div class="px-6 mt-6">
    <div class="w-full border-2 border-dashed border-gray-200 rounded-xl py-4 text-body text-gray-400 text-center">
      + 添加提醒
    </div>
  </div>

  <!-- Bottom tab bar -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 flex justify-around py-3 pb-4">
    <span class="text-caption text-gray-400">&#127807; 今日</span>
    <span class="text-caption font-medium text-primary border-b-2 border-primary pb-1">&#128138; 用药</span>
    <span class="text-caption text-gray-400">&#128104;&zwj;&#8205;&#128105;&zwj;&#8205;&#128467; 家人</span>
  </div>

</body>
</html>
