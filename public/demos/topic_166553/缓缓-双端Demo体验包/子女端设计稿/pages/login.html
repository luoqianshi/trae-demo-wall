<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>缓缓 — 登录</title>
    <style id="theme-vars">
/* 缓缓 Huanhuan — Brand Design Tokens (Child App) */
/* Version 1.0 · Mobile · Modern Clean */

:root {
  /* === Color System (shared brand DNA) === */
  --color-primary: #2D6A4F;
  --color-primary-light: #40916C;
  --color-primary-lighter: #52B788;
  --color-primary-bg: #D8F3DC;
  --color-primary-bg-soft: #F0FAF4;

  --color-warm-cream: #F4F1DE;
  --color-coral: #E07A5F;
  --color-coral-light: #F2A68B;
  --color-coral-bg: #FDF0EB;

  --color-bg: #FFFFFF;
  --color-bg-secondary: #F5F5F5;
  --color-bg-elevated: #FFFFFF;

  --color-text: #1B1B1B;
  --color-text-secondary: #6B7280;
  --color-text-tertiary: #9CA3AF;
  --color-text-inverse: #FFFFFF;

  --color-border: #E5E7EB;
  --color-border-light: #F3F4F6;

  --state-success: #2D6A4F;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* === Typography (slightly tighter for younger users) === */
  --font-family: -apple-system, "SF Pro Display", "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
  --font-size-display: 24px;
  --font-size-h1: 20px;
  --font-size-h2: 18px;
  --font-size-h3: 16px;
  --font-size-body: 15px;
  --font-size-body-large: 16px;
  --font-size-caption: 13px;
  --font-size-small: 12px;

  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;

  --line-height-tight: 1.3;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.6;

  /* === Spacing === */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;
  --space-4xl: 40px;

  /* === Radius === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* === Shadows === */
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.08);

  /* === Touch Targets (standard for younger users) === */
  --button-height: 48px;
  --button-height-large: 52px;
  --button-radius: 12px;
  --icon-size: 20px;
  --icon-size-large: 24px;
  --min-touch-target: 44px;

  /* === Alert colors === */
  --alert-red: #EF4444;
  --alert-yellow: #F59E0B;
  --alert-green: #2D6A4F;
  --alert-gray: #9CA3AF;
}

html {
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--font-family);
  color: var(--color-text);
  background-color: var(--color-bg-secondary);
  line-height: var(--line-height-normal);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-primary-light: var(--color-primary-light);
    --color-primary-lighter: var(--color-primary-lighter);
    --color-primary-bg: var(--color-primary-bg);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-bg-secondary); color: var(--color-text); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="flex min-h-screen flex-col items-center justify-center bg-[var(--color-bg)]" style="max-width: 375px; margin: 0 auto;">

      <!-- Brand Area -->
      <div class="text-center">
        <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-[var(--color-primary-bg)] text-3xl">
          🌿
        </div>
        <p class="mt-4 font-semibold text-[var(--color-primary)]" style="font-size: var(--font-size-display); line-height: var(--line-height-tight);">
          缓缓
        </p>
        <p class="mt-1" style="font-size: var(--font-size-body); color: var(--color-text-tertiary); line-height: var(--line-height-normal);">
          日子缓缓，陪伴轻轻
        </p>
      </div>

      <!-- Form Area -->
      <div class="mt-10 w-full px-8">
        <!-- Phone Input -->
        <input
          type="tel"
          placeholder="手机号"
          class="w-full rounded-xl border border-[var(--color-border)] px-4 py-3.5 placeholder-[var(--color-text-tertiary)]"
          style="font-size: var(--font-size-body); background-color: var(--color-bg-secondary); line-height: var(--line-height-normal);"
        />

        <!-- Verification Code Row -->
        <div class="mt-3 flex gap-3">
          <input
            type="text"
            placeholder="验证码"
            class="flex-1 rounded-xl border border-[var(--color-border)] px-4 py-3.5 placeholder-[var(--color-text-tertiary)]"
            style="font-size: var(--font-size-body); background-color: var(--color-bg-secondary); line-height: var(--line-height-normal);"
          />
          <button
            class="rounded-xl px-4 font-medium text-[var(--color-primary)] bg-[var(--color-primary-bg)]"
            style="font-size: var(--font-size-caption); line-height: var(--line-height-normal);"
          >
            获取
          </button>
        </div>

        <!-- CTA Button -->
        <button
          class="mt-6 w-full rounded-xl py-3.5 font-medium text-[var(--color-text-inverse)] bg-[var(--color-primary)]"
          style="font-size: var(--font-size-body); line-height: var(--line-height-normal);"
        >
          登录
        </button>
      </div>

      <!-- Bottom Text -->
      <p class="mt-6 text-center" style="font-size: var(--font-size-small); color: var(--color-text-tertiary); line-height: var(--line-height-relaxed);">
        登录即同意《用户协议》和《隐私政策》
      </p>

    </main>
</body>
</html>
