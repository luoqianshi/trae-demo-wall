<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>关怀提醒 - 缓缓</title>
    <style id="theme-vars">
/* 缓缓 Huanhuan — Brand Design Tokens (Child App) */
/* Version 1.0 · Mobile · Modern Clean */

:root {
  /* === Color System (shared brand DNA) === */
  --color-primary: #2D6A4F;
  --color-primary-light: #40916C;
  --color-primary-lighter: #52B788;
  --color-primary-bg: #D8F3DC;
  --color-primary-bg-soft: #F0FAF4;

  --color-warm-cream: #F4F1DE;
  --color-coral: #E07A5F;
  --color-coral-light: #F2A68B;
  --color-coral-bg: #FDF0EB;

  --color-bg: #FFFFFF;
  --color-bg-secondary: #F5F5F5;
  --color-bg-elevated: #FFFFFF;

  --color-text: #1B1B1B;
  --color-text-secondary: #6B7280;
  --color-text-tertiary: #9CA3AF;
  --color-text-inverse: #FFFFFF;

  --color-border: #E5E7EB;
  --color-border-light: #F3F4F6;

  --state-success: #2D6A4F;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* === Typography (slightly tighter for younger users) === */
  --font-family: -apple-system, "SF Pro Display", "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
  --font-size-display: 24px;
  --font-size-h1: 20px;
  --font-size-h2: 18px;
  --font-size-h3: 16px;
  --font-size-body: 15px;
  --font-size-body-large: 16px;
  --font-size-caption: 13px;
  --font-size-small: 12px;

  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;

  --line-height-tight: 1.3;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.6;

  /* === Spacing === */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;
  --space-4xl: 40px;

  /* === Radius === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* === Shadows === */
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.08);

  /* === Touch Targets (standard for younger users) === */
  --button-height: 48px;
  --button-height-large: 52px;
  --button-radius: 12px;
  --icon-size: 20px;
  --icon-size-large: 24px;
  --min-touch-target: 44px;

  /* === Alert colors === */
  --alert-red: #EF4444;
  --alert-yellow: #F59E0B;
  --alert-green: #2D6A4F;
  --alert-gray: #9CA3AF;
}

html {
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--font-family);
  color: var(--color-text);
  background-color: var(--color-bg-secondary);
  line-height: var(--line-height-normal);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-bg-secondary); color: var(--color-text); }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
    </style>
</head>
<body style="min-height: 100vh; padding-bottom: 80px; background-color: var(--color-bg-secondary); font-family: var(--font-family); color: var(--color-text);">

    <!-- App Shell: 375px centered -->
    <div style="max-width: 375px; margin: 0 auto; min-height: 100vh; position: relative; background-color: var(--color-bg-secondary);">

        <!-- Header -->
        <div style="background: var(--color-bg); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: var(--font-size-h2); font-weight: var(--font-weight-semibold); color: var(--color-text);">关怀提醒</span>
            <span style="font-size: var(--font-size-caption); color: var(--color-primary); cursor: pointer;">全部已读</span>
        </div>

        <!-- Content -->
        <div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 12px;">

            <!-- Alert Card 1 — URGENT -->
            <div style="background: var(--color-bg); border-radius: var(--radius-xl); padding: 20px; border-left: 4px solid var(--state-error);">
                <!-- Top row -->
                <div style="display: flex; align-items: center; gap: 6px;">
                    <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--state-error); display: inline-block; flex-shrink: 0;"></span>
                    <span style="font-size: var(--font-size-caption); font-weight: var(--font-weight-medium); color: var(--color-text);">妈妈 · 10分钟前</span>
                </div>
                <!-- Message -->
                <div style="margin-top: 8px; font-size: var(--font-size-body); color: var(--color-text); line-height: var(--line-height-normal);">
                    12:30 的钙片还未确认服用
                </div>
                <!-- Action buttons -->
                <div style="margin-top: 12px; display: flex; gap: 8px;">
                    <div style="flex: 1; background: var(--color-coral-bg); color: var(--color-coral); border-radius: var(--radius-md); padding: 10px 0; font-size: var(--font-size-caption); font-weight: var(--font-weight-medium); text-align: center; cursor: pointer;">
                        打电话
                    </div>
                    <div style="flex: 1; background: var(--color-bg-secondary); color: var(--color-text-secondary); border-radius: var(--radius-md); padding: 10px 0; font-size: var(--font-size-caption); font-weight: var(--font-weight-medium); text-align: center; cursor: pointer;">
                        稍后提醒
                    </div>
                </div>
            </div>

            <!-- Alert Card 2 — INFO -->
            <div style="background: var(--color-bg); border-radius: var(--radius-xl); padding: 20px; border-left: 4px solid var(--state-warning);">
                <!-- Top row -->
                <div style="display: flex; align-items: center; gap: 6px;">
                    <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--state-warning); display: inline-block; flex-shrink: 0;"></span>
                    <span style="font-size: var(--font-size-caption); font-weight: var(--font-weight-medium); color: var(--color-text);">妈妈 · 2小时前</span>
                </div>
                <!-- Message -->
                <div style="margin-top: 8px; font-size: var(--font-size-body); color: var(--color-text); line-height: var(--line-height-normal);">
                    今天下午手机使用较少
                </div>
                <!-- Subtitle -->
                <div style="margin-top: 4px; font-size: var(--font-size-caption); color: var(--color-text-secondary); line-height: var(--line-height-normal);">
                    可能休息得不错 😊
                </div>
            </div>

            <!-- Alert Card 3 — RESOLVED -->
            <div style="background: var(--color-bg); border-radius: var(--radius-xl); padding: 20px; border-left: 4px solid var(--color-border);">
                <!-- Top row -->
                <div style="display: flex; align-items: center; gap: 6px;">
                    <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--color-text-tertiary); display: inline-block; flex-shrink: 0;"></span>
                    <span style="font-size: var(--font-size-caption); font-weight: var(--font-weight-medium); color: var(--color-text);">妈妈 · 昨天</span>
                </div>
                <!-- Message -->
                <div style="margin-top: 8px; font-size: var(--font-size-body); color: var(--color-text); line-height: var(--line-height-normal);">
                    降压药已按时服用 ✅
                </div>
            </div>

        </div>

        <!-- Bottom Tab Bar -->
        <div style="position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 375px; background: var(--color-bg); border-top: 1px solid var(--color-border-light); display: flex; justify-content: space-around; align-items: center; padding: 8px 0 20px; z-index: 50;">
            <!-- Tab: 首页 -->
            <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer;">
                <span style="font-size: 20px; line-height: 1;">🏠</span>
                <span style="font-size: var(--font-size-small); color: var(--color-text-tertiary);">首页</span>
            </div>
            <!-- Tab: 互动 -->
            <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer;">
                <span style="font-size: 20px; line-height: 1;">💬</span>
                <span style="font-size: var(--font-size-small); color: var(--color-text-tertiary);">互动</span>
            </div>
            <!-- Tab: 提醒 (active) -->
            <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer;">
                <span style="font-size: 20px; line-height: 1;">🔔</span>
                <span style="font-size: var(--font-size-small); color: var(--color-primary); font-weight: var(--font-weight-medium);">提醒</span>
            </div>
            <!-- Tab: 我的 -->
            <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer;">
                <span style="font-size: 20px; line-height: 1;">👤</span>
                <span style="font-size: var(--font-size-small); color: var(--color-text-tertiary);">我的</span>
            </div>
        </div>

    </div>

</body>
</html>
