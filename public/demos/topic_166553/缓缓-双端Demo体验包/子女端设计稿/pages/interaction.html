<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>互动 - 缓缓</title>
    <style id="theme-vars">
/* 缓缓 Huanhuan — Brand Design Tokens (Child App) */
/* Version 1.0 · Mobile · Modern Clean */

:root {
  /* === Color System (shared brand DNA) === */
  --color-primary: #2D6A4F;
  --color-primary-light: #40916C;
  --color-primary-lighter: #52B788;
  --color-primary-bg: #D8F3DC;
  --color-primary-bg-soft: #F0FAF4;

  --color-warm-cream: #F4F1DE;
  --color-coral: #E07A5F;
  --color-coral-light: #F2A68B;
  --color-coral-bg: #FDF0EB;

  --color-bg: #FFFFFF;
  --color-bg-secondary: #F5F5F5;
  --color-bg-elevated: #FFFFFF;

  --color-text: #1B1B1B;
  --color-text-secondary: #6B7280;
  --color-text-tertiary: #9CA3AF;
  --color-text-inverse: #FFFFFF;

  --color-border: #E5E7EB;
  --color-border-light: #F3F4F6;

  --state-success: #2D6A4F;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* === Typography (slightly tighter for younger users) === */
  --font-family: -apple-system, "SF Pro Display", "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
  --font-size-display: 24px;
  --font-size-h1: 20px;
  --font-size-h2: 18px;
  --font-size-h3: 16px;
  --font-size-body: 15px;
  --font-size-body-large: 16px;
  --font-size-caption: 13px;
  --font-size-small: 12px;

  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;

  --line-height-tight: 1.3;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.6;

  /* === Spacing === */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;
  --space-4xl: 40px;

  /* === Radius === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* === Shadows === */
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.08);

  /* === Touch Targets (standard for younger users) === */
  --button-height: 48px;
  --button-height-large: 52px;
  --button-radius: 12px;
  --icon-size: 20px;
  --icon-size-large: 24px;
  --min-touch-target: 44px;

  /* === Alert colors === */
  --alert-red: #EF4444;
  --alert-yellow: #F59E0B;
  --alert-green: #2D6A4F;
  --alert-gray: #9CA3AF;
}

html {
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--font-family);
  color: var(--color-text);
  background-color: var(--color-bg-secondary);
  line-height: var(--line-height-normal);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-bg-secondary); color: var(--color-text); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* Typography utility classes */
      .text-h2 { font-size: var(--font-size-h2); }
      .text-caption { font-size: var(--font-size-caption); }
      .text-small { font-size: var(--font-size-small); }
      .text-body { font-size: var(--font-size-body); }

      /* Interaction card heart icon pulse */
      .heart-icon {
        color: var(--color-coral);
        animation: heartPulse 2s ease-in-out infinite;
      }
      @keyframes heartPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.15); }
      }

      /* Textarea styling */
      .message-textarea::placeholder {
        color: var(--color-text-tertiary);
      }
    </style>
</head>
<body class="min-h-screen pb-20 font-sans antialiased" style="max-width: 375px; margin: 0 auto; background-color: var(--color-bg-secondary);">

    <!-- Header -->
    <header style="background-color: var(--color-bg); padding: 16px 24px;">
      <h1 class="text-h2" style="font-weight: var(--font-weight-semibold); color: var(--color-text); margin: 0;">互动</h1>
    </header>

    <!-- Content -->
    <main style="padding: 16px; display: flex; flex-direction: column; gap: 12px;">

      <!-- Interaction Card 1: Like notification -->
      <div style="background-color: var(--color-bg); border-radius: 16px; padding: 20px; box-shadow: var(--shadow-sm);">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <div>
            <div style="display: flex; align-items: center; gap: 6px;">
              <span style="font-size: 20px;">👵</span>
              <span class="text-caption" style="font-weight: var(--font-weight-medium); color: var(--color-text-secondary);">妈妈</span>
            </div>
            <span class="text-small" style="color: var(--color-text-tertiary); margin-left: 26px;">今天 16:00</span>
          </div>
          <div class="heart-icon" style="display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; background-color: var(--color-coral-bg); border-radius: 50%;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--color-coral)" stroke="none">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
          </div>
        </div>
        <p class="text-body" style="margin-top: 8px; color: var(--color-text); line-height: var(--line-height-normal);">您点赞了「下楼看花」</p>
      </div>

      <!-- Interaction Card 2: Comment notification -->
      <div style="background-color: var(--color-bg); border-radius: 16px; padding: 20px; box-shadow: var(--shadow-sm);">
        <div style="display: flex; align-items: center; gap: 6px;">
          <span style="font-size: 20px;">👵</span>
          <span class="text-caption" style="color: var(--color-text-secondary);">妈妈</span>
          <span class="text-small" style="color: var(--color-text-tertiary); margin: 0 2px;">·</span>
          <span class="text-caption" style="color: var(--color-text-secondary);">今天 08:15</span>
        </div>
        <p class="text-body" style="margin-top: 8px; color: var(--color-text); line-height: var(--line-height-normal);">您留言：吃药真乖，周末来看您 ❤️</p>
      </div>

      <!-- Message Input Card -->
      <div style="background-color: var(--color-bg); border-radius: 16px; padding: 20px; box-shadow: var(--shadow-sm);">
        <p class="text-caption" style="font-weight: var(--font-weight-medium); color: var(--color-text-tertiary); margin: 0 0 8px 0;">给妈妈留言</p>
        <textarea
          class="message-textarea text-body"
          placeholder="妈，天冷了多穿点..."
          style="
            width: 100%;
            height: 80px;
            border: 1px solid var(--color-border);
            border-radius: 12px;
            padding: 12px 16px;
            background-color: var(--color-bg-secondary);
            color: var(--color-text);
            font-family: var(--font-family);
            font-size: var(--font-size-body);
            line-height: var(--line-height-normal);
            resize: none;
            outline: none;
            box-sizing: border-box;
          "
        ></textarea>
        <div style="margin-top: 12px; display: flex; justify-content: flex-end;">
          <button style="
            background-color: var(--color-primary);
            color: var(--color-text-inverse);
            border: none;
            border-radius: 8px;
            padding: 8px 20px;
            font-size: var(--font-size-caption);
            font-weight: var(--font-weight-medium);
            font-family: var(--font-family);
            cursor: pointer;
            min-height: var(--min-touch-target);
          ">发送</button>
        </div>
      </div>

    </main>

    <!-- Bottom Tab Bar -->
    <nav style="
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 375px;
      background-color: var(--color-bg);
      border-top: 1px solid var(--color-border-light);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 0 20px 0;
      box-shadow: 0 -1px 4px rgba(0,0,0,0.04);
      z-index: 50;
    ">
      <!-- 首页 -->
      <a href="home.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; min-width: 44px; min-height: 44px; justify-content: center;">
        <span style="font-size: 20px;">🏠</span>
        <span class="text-small" style="color: var(--color-text-tertiary); font-weight: var(--font-weight-medium);">首页</span>
      </a>
      <!-- 互动 (active) -->
      <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; min-width: 44px; min-height: 44px; justify-content: center;">
        <span style="font-size: 20px;">💬</span>
        <span class="text-small" style="color: var(--color-primary); font-weight: var(--font-weight-semibold);">互动</span>
      </a>
      <!-- 提醒 -->
      <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; min-width: 44px; min-height: 44px; justify-content: center;">
        <span style="font-size: 20px;">🔔</span>
        <span class="text-small" style="color: var(--color-text-tertiary); font-weight: var(--font-weight-medium);">提醒</span>
      </a>
      <!-- 我的 -->
      <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; min-width: 44px; min-height: 44px; justify-content: center;">
        <span style="font-size: 20px;">👤</span>
        <span class="text-small" style="color: var(--color-text-tertiary); font-weight: var(--font-weight-medium);">我的</span>
      </a>
    </nav>

</body>
</html>
