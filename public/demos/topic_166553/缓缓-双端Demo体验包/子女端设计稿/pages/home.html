<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>缓缓 - 子女端 - 首页</title>
    <style id="theme-vars">
/* 缓缓 Huanhuan — Brand Design Tokens (Child App) */
/* Version 1.0 · Mobile · Modern Clean */

:root {
  /* === Color System (shared brand DNA) === */
  --color-primary: #2D6A4F;
  --color-primary-light: #40916C;
  --color-primary-lighter: #52B788;
  --color-primary-bg: #D8F3DC;
  --color-primary-bg-soft: #F0FAF4;

  --color-warm-cream: #F4F1DE;
  --color-coral: #E07A5F;
  --color-coral-light: #F2A68B;
  --color-coral-bg: #FDF0EB;

  --color-bg: #FFFFFF;
  --color-bg-secondary: #F5F5F5;
  --color-bg-elevated: #FFFFFF;

  --color-text: #1B1B1B;
  --color-text-secondary: #6B7280;
  --color-text-tertiary: #9CA3AF;
  --color-text-inverse: #FFFFFF;

  --color-border: #E5E7EB;
  --color-border-light: #F3F4F6;

  --state-success: #2D6A4F;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* === Typography (slightly tighter for younger users) === */
  --font-family: -apple-system, "SF Pro Display", "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
  --font-size-display: 24px;
  --font-size-h1: 20px;
  --font-size-h2: 18px;
  --font-size-h3: 16px;
  --font-size-body: 15px;
  --font-size-body-large: 16px;
  --font-size-caption: 13px;
  --font-size-small: 12px;

  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;

  --line-height-tight: 1.3;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.6;

  /* === Spacing === */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;
  --space-4xl: 40px;

  /* === Radius === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* === Shadows === */
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.08);

  /* === Touch Targets (standard for younger users) === */
  --button-height: 48px;
  --button-height-large: 52px;
  --button-radius: 12px;
  --icon-size: 20px;
  --icon-size-large: 24px;
  --min-touch-target: 44px;

  /* === Alert colors === */
  --alert-red: #EF4444;
  --alert-yellow: #F59E0B;
  --alert-green: #2D6A4F;
  --alert-gray: #9CA3AF;
}

html {
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--font-family);
  color: var(--color-text);
  background-color: var(--color-bg-secondary);
  line-height: var(--line-height-normal);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen pb-20" style="max-width: 375px; margin: 0 auto; background-color: var(--color-bg-secondary);">

  <!-- Header Bar -->
  <header style="background-color: var(--color-bg); padding: 16px 24px;">
    <span class="text-h2 text-primary">缓缓</span>
  </header>

  <!-- Content Area -->
  <main style="padding: 16px; display: flex; flex-direction: column; gap: 12px;">

    <!-- Parent Card -->
    <section style="background-color: var(--color-bg); border-radius: var(--radius-xl); padding: 20px; box-shadow: var(--shadow-sm);">
      <!-- Top Row: Parent Name + Status Badge -->
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 24px;">👵</span>
          <span class="text-h2 text-text-main">妈妈</span>
        </div>
        <span style="font-size: var(--font-size-caption); font-weight: var(--font-weight-medium); color: var(--color-primary); background-color: var(--color-primary-bg); border-radius: var(--radius-full); padding: 4px 12px;">今天 ✅ 良好</span>
      </div>

      <!-- Divider -->
      <div style="margin-top: 16px; border-top: 1px solid var(--color-border-light);"></div>

      <!-- Timeline -->
      <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 10px;">
        <!-- Row 1: Completed -->
        <div style="display: flex; align-items: center; gap: 10px;">
          <span style="font-size: 14px; color: var(--state-success);">✅</span>
          <span class="text-body text-text-secondary">08:00 按时服药</span>
        </div>
        <!-- Row 2: Activity -->
        <div style="display: flex; align-items: center; gap: 10px;">
          <span style="font-size: 14px;">🌺</span>
          <span class="text-body text-text-secondary">15:30 下楼看花</span>
        </div>
        <!-- Row 3: Pending Confirmation -->
        <div style="display: flex; align-items: center; gap: 10px;">
          <span style="font-size: 14px;">⏳</span>
          <span class="text-body text-coral">12:30 钙片待确认</span>
        </div>
      </div>

      <!-- Action Buttons -->
      <div style="margin-top: 16px; display: flex; gap: 8px;">
        <button style="flex: 1; border-radius: var(--radius-lg); background-color: var(--color-coral-bg); padding: 10px 0; text-align: center; font-size: var(--font-size-caption); font-weight: var(--font-weight-medium); color: var(--color-coral); border: none; cursor: pointer;">❤️ 点赞</button>
        <button style="flex: 1; border-radius: var(--radius-lg); background-color: var(--color-primary-bg); padding: 10px 0; text-align: center; font-size: var(--font-size-caption); font-weight: var(--font-weight-medium); color: var(--color-primary); border: none; cursor: pointer;">💬 留言</button>
      </div>
    </section>

    <!-- Weekly Summary Card -->
    <section style="background-color: var(--color-bg); border-radius: var(--radius-xl); padding: 20px; box-shadow: var(--shadow-sm);">
      <h3 class="text-h3 text-text-main">本周小结</h3>
      <div style="margin-top: 12px; display: flex; flex-direction: column; gap: 8px;">
        <div class="text-body text-text-secondary">完成生活建议 5 次</div>
        <div class="text-body text-text-secondary">按时服药 6/7 天</div>
        <div class="text-body text-text-secondary">您的互动 3 次</div>
      </div>
    </section>

  </main>

  <!-- Bottom Tab Bar -->
  <nav style="position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 375px; background-color: var(--color-bg); border-top: 1px solid var(--color-border-light); padding: 10px 0 16px 0;">
    <div style="display: flex; justify-content: space-around; align-items: center;">
      <!-- Tab 1: Active -->
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer;">
        <span style="font-size: 18px;">🏠</span>
        <span style="font-size: var(--font-size-caption); font-weight: var(--font-weight-medium); color: var(--color-primary);">首页</span>
      </div>
      <!-- Tab 2 -->
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer;">
        <span style="font-size: 18px;">💬</span>
        <span style="font-size: var(--font-size-caption); color: var(--color-text-tertiary);">互动</span>
      </div>
      <!-- Tab 3 -->
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer;">
        <span style="font-size: 18px;">🔔</span>
        <span style="font-size: var(--font-size-caption); color: var(--color-text-tertiary);">提醒</span>
      </div>
      <!-- Tab 4 -->
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer;">
        <span style="font-size: 18px;">👤</span>
        <span style="font-size: var(--font-size-caption); color: var(--color-text-tertiary);">我的</span>
      </div>
    </div>
  </nav>


    <style>
      /* === Page-level utility classes === */
      .text-h2 {
        font-size: var(--font-size-h2);
        font-weight: var(--font-weight-semibold);
      }
      .text-h3 {
        font-size: var(--font-size-h3);
        font-weight: var(--font-weight-semibold);
      }
      .text-body {
        font-size: var(--font-size-body);
      }
      .text-caption {
        font-size: var(--font-size-caption);
      }
      .text-primary {
        color: var(--color-primary);
      }
      .text-coral {
        color: var(--color-coral);
      }
      .text-text-main {
        color: var(--color-text);
      }
      .text-text-secondary {
        color: var(--color-text-secondary);
      }
      .text-text-tertiary {
        color: var(--color-text-tertiary);
      }
      .bg-coral-bg {
        background-color: var(--color-coral-bg);
      }
      .bg-primary-bg {
        background-color: var(--color-primary-bg);
      }
      .border-border-light {
        border-color: var(--color-border-light);
      }
    </style>
</body>
</html>
