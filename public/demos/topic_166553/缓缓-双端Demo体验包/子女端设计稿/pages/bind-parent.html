<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绑定父母 - 缓缓</title>
    <style id="theme-vars">
/* 缓缓 Huanhuan — Brand Design Tokens (Child App) */
/* Version 1.0 · Mobile · Modern Clean */

:root {
  /* === Color System (shared brand DNA) === */
  --color-primary: #2D6A4F;
  --color-primary-light: #40916C;
  --color-primary-lighter: #52B788;
  --color-primary-bg: #D8F3DC;
  --color-primary-bg-soft: #F0FAF4;

  --color-warm-cream: #F4F1DE;
  --color-coral: #E07A5F;
  --color-coral-light: #F2A68B;
  --color-coral-bg: #FDF0EB;

  --color-bg: #FFFFFF;
  --color-bg-secondary: #F5F5F5;
  --color-bg-elevated: #FFFFFF;

  --color-text: #1B1B1B;
  --color-text-secondary: #6B7280;
  --color-text-tertiary: #9CA3AF;
  --color-text-inverse: #FFFFFF;

  --color-border: #E5E7EB;
  --color-border-light: #F3F4F6;

  --state-success: #2D6A4F;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* === Typography (slightly tighter for younger users) === */
  --font-family: -apple-system, "SF Pro Display", "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
  --font-size-display: 24px;
  --font-size-h1: 20px;
  --font-size-h2: 18px;
  --font-size-h3: 16px;
  --font-size-body: 15px;
  --font-size-body-large: 16px;
  --font-size-caption: 13px;
  --font-size-small: 12px;

  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;

  --line-height-tight: 1.3;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.6;

  /* === Spacing === */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;
  --space-4xl: 40px;

  /* === Radius === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* === Shadows === */
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.08);

  /* === Touch Targets (standard for younger users) === */
  --button-height: 48px;
  --button-height-large: 52px;
  --button-radius: 12px;
  --icon-size: 20px;
  --icon-size-large: 24px;
  --min-touch-target: 44px;

  /* === Alert colors === */
  --alert-red: #EF4444;
  --alert-yellow: #F59E0B;
  --alert-green: #2D6A4F;
  --alert-gray: #9CA3AF;
}

html {
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--font-family);
  color: var(--color-text);
  background-color: var(--color-bg-secondary);
  line-height: var(--line-height-normal);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }

      /* Mobile app viewport */
      .app-shell {
        max-width: 375px;
        margin: 0 auto;
        min-height: 100vh;
        background-color: var(--color-bg);
        position: relative;
      }

      /* Typography utilities */
      .text-h2 {
        font-size: var(--font-size-h2);
        font-weight: var(--font-weight-medium);
        line-height: var(--line-height-tight);
      }
      .text-body {
        font-size: var(--font-size-body);
        font-weight: var(--font-weight-regular);
        line-height: var(--line-height-normal);
      }
      .text-caption {
        font-size: var(--font-size-caption);
        font-weight: var(--font-weight-regular);
        line-height: var(--line-height-normal);
      }
      .text-small {
        font-size: var(--font-size-small);
        font-weight: var(--font-weight-regular);
        line-height: var(--line-height-normal);
      }

      /* Digit box */
      .digit-box {
        width: 48px;
        height: 56px;
        border-radius: var(--radius-md);
        border: 2px solid var(--color-border);
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: var(--font-size-h2);
        font-weight: var(--font-weight-semibold);
        color: var(--color-primary);
      }

      /* Input field */
      .input-field {
        width: 100%;
        border-radius: var(--radius-xl);
        border: 1px solid var(--color-border);
        padding: 12px 16px;
        font-size: var(--font-size-body);
        font-family: var(--font-family);
        color: var(--color-text);
        background: #fff;
        outline: none;
        box-sizing: border-box;
      }
      .input-field:focus {
        border-color: var(--color-primary-light);
      }

      /* Primary button */
      .btn-primary {
        width: 100%;
        background-color: var(--color-primary);
        color: var(--color-text-inverse);
        border: none;
        border-radius: var(--radius-xl);
        padding: 14px 0;
        font-size: var(--font-size-body);
        font-weight: var(--font-weight-medium);
        font-family: var(--font-family);
        cursor: pointer;
        transition: background-color 0.2s;
      }
      .btn-primary:hover {
        background-color: var(--color-primary-light);
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>
      <div class="app-shell">

        <!-- Header -->
        <div style="padding: 16px 24px; border-bottom: 1px solid var(--color-border-light); display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 18px; color: var(--color-text); cursor: pointer;">&#8592;</span>
          <span class="text-h2" style="font-weight: var(--font-weight-medium);">绑定父母</span>
        </div>

        <!-- Instruction text -->
        <div style="padding: 0 24px; margin-top: 24px;">
          <p class="text-body" style="color: var(--color-text-secondary);">请父母在缓缓 App 中查看绑定码或二维码</p>
        </div>

        <!-- QR scan area -->
        <div style="margin: 24px 24px 0; border: 2px dashed var(--color-border); border-radius: var(--radius-xl); padding: 48px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: var(--color-bg-secondary);">
          <span style="font-size: 36px;">&#x1F4F7;</span>
          <p class="text-body" style="margin-top: 12px; font-weight: var(--font-weight-medium); color: var(--color-text-secondary);">扫描二维码</p>
        </div>

        <!-- Manual code entry -->
        <div style="padding: 0 24px; margin-top: 32px;">
          <p class="text-caption" style="color: var(--color-text-tertiary); text-align: center;">或手动输入绑定码</p>
          <div style="display: flex; justify-content: center; gap: 8px; margin-top: 12px;">
            <div class="digit-box">8</div>
            <div class="digit-box">3</div>
            <div class="digit-box">5</div>
            <div class="digit-box">2</div>
            <div class="digit-box">1</div>
            <div class="digit-box">6</div>
          </div>
        </div>

        <!-- Relationship label + input -->
        <div style="padding: 0 24px; margin-top: 24px;">
          <label class="text-caption" style="display: block; color: var(--color-text-tertiary); margin-bottom: 4px;">称呼</label>
          <input type="text" class="input-field" value="妈妈" readonly>
        </div>

        <!-- Submit button -->
        <div style="padding: 0 24px; margin-top: 24px;">
          <button class="btn-primary">发送绑定请求</button>
        </div>

        <!-- Warning text -->
        <p class="text-small" style="text-align: center; color: var(--color-text-tertiary); margin-top: 12px; padding: 0 24px;">
          <span style="margin-right: 2px;">&#x26A0;&#xFE0F;</span> 需父母在手机上确认后生效
        </p>

      </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
