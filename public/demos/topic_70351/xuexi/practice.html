<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>章节练习 - 语智</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/questions.css">
  <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js" defer></script>
  <script src="js/common.js" defer></script>
  <script src="js/practice.js" defer></script>
</head>
<body>
  <nav class="nav nav-surface" data-nav-bar>
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">语智</a>
      <div class="nav-links">
        <a href="index.html" class="nav-link" data-nav="home">首页</a>
        <a href="reading.html" class="nav-link" data-nav="reading">阅读探索</a>
        <a href="writing.html" class="nav-link" data-nav="writing">写作助手</a>
        <a href="questions.html" class="nav-link active" data-nav="questions">题库练习</a>
      </div>
      <div style="display:flex;align-items:center;gap:0.75rem;flex-shrink:0;">
        <div class="nav-avatar">林</div>
        <button class="nav-menu-btn" data-nav-toggle aria-label="菜单" aria-expanded="false">
          <i data-lucide="menu" style="width:20px;height:20px;"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="mobile-nav" data-mobile-nav>
    <a href="index.html" class="mobile-nav-link" data-nav="home">首页</a>
    <a href="reading.html" class="mobile-nav-link" data-nav="reading">阅读探索</a>
    <a href="writing.html" class="mobile-nav-link" data-nav="writing">写作助手</a>
    <a href="questions.html" class="mobile-nav-link" data-nav="questions">题库练习</a>
  </div>

  <main class="practice-main">
    <div class="practice-container">
      <div class="practice-header">
        <a href="questions.html" class="practice-back">
          <i data-lucide="arrow-left" style="width:16px;height:16px;"></i>
          返回题库
        </a>
        <div class="practice-progress">
          <div class="progress-bar">
            <div class="progress-bar-fill" data-progress-fill style="width:0%;"></div>
          </div>
          <span data-progress-text>0 / 0</span>
        </div>
      </div>

      <div class="practice-card" data-practice-card>
        <div class="practice-type">
          <span data-type-name>选择题</span>
          <span class="practice-difficulty" data-difficulty>中等</span>
        </div>
        <p class="practice-question" data-question-content>加载中...</p>
        <div data-question-body></div>
        <div class="practice-analysis" data-analysis>
          <p class="analysis-label">
            <i data-lucide="lightbulb" style="width:14px;height:14px;"></i>
            解析
          </p>
          <p class="analysis-text" data-analysis-text></p>
          <p class="analysis-answer">
            正确答案：<strong data-correct-answer></strong>
          </p>
        </div>
      </div>

      <div class="practice-actions">
        <div class="practice-result" data-result></div>
        <div class="practice-nav">
          <button class="btn-ghost" data-prev style="display:none;">
            <i data-lucide="chevron-left" style="width:16px;height:16px;"></i>
            上一题
          </button>
          <button class="btn-primary" data-next style="display:none;">
            下一题
            <i data-lucide="chevron-right" style="width:16px;height:16px;"></i>
          </button>
          <button class="btn-primary" data-submit style="display:none;">
            提交答案
          </button>
        </div>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>
</html>
