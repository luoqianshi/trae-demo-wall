<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>题库练习 - 语境 AI课堂</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/questions.css">
  <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js" defer></script>
  <script src="js/common.js" defer></script>
  <script src="js/questions.js" defer></script>
</head>
<body>
  <nav class="nav nav-surface" data-nav-bar>
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">语境</a>
      <div class="nav-links">
        <a href="index.html" class="nav-link" data-nav="home">首页</a>
        <a href="reading.html" class="nav-link" data-nav="reading">阅读探索</a>
        <a href="writing.html" class="nav-link" data-nav="writing">写作助手</a>
        <a href="questions.html" class="nav-link" data-nav="questions">题库练习</a>
      </div>
      <div style="display:flex;align-items:center;gap:0.75rem;flex-shrink:0;">
        <div class="nav-avatar">林</div>
        <button class="nav-menu-btn" data-nav-toggle aria-label="菜单" aria-expanded="false">
          <i data-lucide="menu" style="width:20px;height:20px;"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="mobile-nav" data-mobile-nav>
    <a href="index.html" class="mobile-nav-link" data-nav="home">首页</a>
    <a href="reading.html" class="mobile-nav-link" data-nav="reading">阅读探索</a>
    <a href="writing.html" class="mobile-nav-link" data-nav="writing">写作助手</a>
    <a href="questions.html" class="mobile-nav-link" data-nav="questions">题库练习</a>
  </div>

  <main class="questions-main">
    <section class="qb-hero">
      <div class="container">
        <div class="qb-hero-inner fade-in">
          <div>
            <h1 class="qb-hero-title">语文题库</h1>
            <p class="qb-hero-desc">系统化教材同步题库，从基础到提升，逐题突破</p>
          </div>
          <div class="qb-stats">
            <div class="qb-stat">
              <p class="qb-stat-num" data-stat-textbooks>0</p>
              <p class="qb-stat-label">册教材</p>
            </div>
            <div class="qb-stat">
              <p class="qb-stat-num" data-stat-units>0</p>
              <p class="qb-stat-label">个单元</p>
            </div>
            <div class="qb-stat">
              <p class="qb-stat-num" data-stat-questions>0</p>
              <p class="qb-stat-label">道题目</p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="qb-section">
      <div class="container">
        <div class="qb-tabs">
          <button class="qb-tab active" data-tab="textbooks">
            <i data-lucide="book-open" style="width:16px;height:16px;"></i>
            按教材
          </button>
          <button class="qb-tab" data-tab="exam">
            <i data-lucide="file-text" style="width:16px;height:16px;"></i>
            模拟考试
          </button>
          <button class="qb-tab" data-tab="wrong">
            <i data-lucide="alert-circle" style="width:16px;height:16px;"></i>
            错题本
          </button>
          <button class="qb-tab" data-tab="random">
            <i data-lucide="shuffle" style="width:16px;height:16px;"></i>
            随机练习
          </button>
        </div>

        <div class="qb-tab-content" data-tab-content="textbooks">
          <div class="qb-grade-tabs">
            <button class="qb-grade-tab active" data-grade="all">全部</button>
            <button class="qb-grade-tab" data-grade="七年级">七年级</button>
            <button class="qb-grade-tab" data-grade="八年级">八年级</button>
            <button class="qb-grade-tab" data-grade="九年级">九年级</button>
          </div>
          <div class="qb-textbook-grid" data-textbook-grid></div>
        </div>

        <div class="qb-tab-content" data-tab-content="exam" style="display:none;">
          <div class="qb-empty">
            <i data-lucide="file-text" style="width:48px;height:48px;color:var(--color-text-tertiary);"></i>
            <p class="body-md" style="color:var(--color-text-secondary);margin-top:1rem;">模拟考试功能开发中，敬请期待</p>
          </div>
        </div>

        <div class="qb-tab-content" data-tab-content="wrong" style="display:none;">
          <div class="qb-wrong-list" data-wrong-list>
            <div class="qb-empty">
              <i data-lucide="check-circle" style="width:48px;height:48px;color:var(--state-success);"></i>
              <p class="body-md" style="color:var(--color-text-secondary);margin-top:1rem;">暂无错题，继续加油！</p>
            </div>
          </div>
        </div>

        <div class="qb-tab-content" data-tab-content="random" style="display:none;">
          <div class="qb-random-wrap">
            <p class="body-md" style="color:var(--color-text-secondary);text-align:center;margin-bottom:1.5rem;">从整个题库随机抽题，检验你的知识掌握程度</p>
            <div class="qb-random-actions">
              <button class="btn-primary" data-random-start>
                <i data-lucide="play" style="width:16px;height:16px;"></i>
                开始随机练习
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer" style="margin-top:3rem;">
    <div class="footer-inner">
      <span class="footer-text">语境 AI课堂 — 中学语文学习AI助手</span>
      <span class="footer-text">系统化题库，科学练习</span>
    </div>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>
</html>
