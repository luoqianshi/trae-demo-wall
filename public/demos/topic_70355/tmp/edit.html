<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>编辑人员</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#162033;font-family:'Microsoft YaHei','PingFang SC',sans-serif}a{color:#173f8a;text-decoration:none}.topbar{height:64px;background:#14284a;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 32px;box-shadow:0 8px 24px #0b1b3329}.logo{color:#fff;font-weight:800;letter-spacing:2px}.topbar nav a{color:#e8eefc;margin-left:22px}.container{max-width:1180px;margin:28px auto;padding:0 18px}.page-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.page-head h1{margin:0 0 6px;font-size:26px}.page-head p,.sub,.hint{color:#657084;font-size:13px}.card{background:#fff;border:1px solid #e3e8ef;border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 12px 36px #1d2b4410}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.person-form label,.login-card label{display:block;font-weight:700;color:#2b3650;margin-bottom:14px}.person-form input,.person-form select,.filters input,.filters select,.login-card input{width:100%;padding:12px;border:1px solid #cfd7e3;border-radius:10px;margin-top:6px;background:#fff}.btn,button{display:inline-flex;align-items:center;justify-content:center;border:1px solid #cbd5e1;border-radius:10px;padding:9px 13px;background:#fff;color:#14284a;cursor:pointer;font-weight:700}.primary{background:#f28c28!important;border-color:#f28c28!important;color:white!important}.full{width:100%;padding:13px}.danger{background:#fff1f0;color:#a51c16;border:1px solid #ffc8c3}.ok{background:#eefaf1;color:#0e6b2e;border:1px solid #bde8c8}.alert{padding:12px 14px;border-radius:12px;margin:14px 0}.filters{display:flex;gap:10px;align-items:end;margin-bottom:16px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:13px;border-bottom:1px solid #e8edf3;text-align:left;vertical-align:top}th{background:#f7f9fc;color:#4d5b72}.empty{text-align:center;color:#7a8496;padding:40px}.ops{display:flex;gap:8px;flex-wrap:wrap}.ops form{display:inline}.ops button{padding:0;border:0;background:none;color:#b42318}.badge{display:inline-block;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:800}.badge.ok{background:#e8f7ee;color:#177245;border:0}.badge.warn{background:#fff4db;color:#9b5c00;border:0}.badge.expired{background:#ffe8e5;color:#b42318;border:0}.section-head{display:flex;justify-content:space-between;align-items:center}.qual-block{border:1px dashed #cbd5e1;border-radius:14px;padding:14px;margin-top:12px;background:#fbfcff}.sticky-actions{position:sticky;bottom:0;background:#fffffff2;border:1px solid #e4e9f0;border-radius:16px;padding:14px;margin-bottom:20px;display:flex;gap:10px}.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid #dce3ed}.login-body{min-height:100vh;background:linear-gradient(135deg,#14284a,#1e4c7b 55%,#f28c28);display:grid;place-items:center}.login-shell{width:min(440px,92vw)}.login-card{background:#fffffff2;border-radius:24px;padding:32px;box-shadow:0 25px 70px #07152d66}.brand-mark{width:56px;height:56px;border-radius:18px;background:#f28c28;color:#fff;display:grid;place-items:center;font-weight:900}.qr-card{text-align:center}.qr-card img{max-width:360px;width:100%;border:1px solid #e0e6ef}.mobile{max-width:520px;margin:0 auto;padding:12px;background:#eef2f7;min-height:100vh}.mobile-hero{background:#14284a;color:#fff;border-radius:0 0 26px 26px;text-align:center;padding:26px 16px;margin:-12px -12px 16px}.avatar{width:132px;height:132px;border-radius:24px;background:#dce3ed;color:#506176;margin:0 auto 14px;display:grid;place-items:center;overflow:hidden;border:4px solid #fff;cursor:pointer}.avatar img{width:100%;height:100%;object-fit:cover}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.info{background:#f7f9fc;border-radius:12px;padding:10px}.info b{display:block;color:#657084;font-size:12px}.gallery img{width:88px;height:88px;object-fit:cover;border-radius:12px;margin:5px;border:1px solid #d7dfeb}.preview-mask{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;z-index:10}.preview-mask img{max-width:94vw;max-height:90vh}.face-status{margin-top:12px;padding:12px;border-radius:12px;background:#f1f5f9}.face-status.pass{background:#e8f7ee;color:#136c3a}.face-status.fail{background:#ffe8e5;color:#a51c16}@media(max-width:760px){.grid,.info-grid{grid-template-columns:1fr}.filters,.page-head{flex-direction:column;align-items:stretch}.topbar{padding:0 14px}.container{margin:16px auto}.ops{display:block}.ops a,.ops form{margin-right:8px}}</style></head><body><header class='topbar'><a class='logo' href='/persons'>工作牌管理</a><nav><a href='/persons'>人员列表</a><a href='/accounts'>账号管理</a><a href='/logout'>退出登录</a></nav></header><main class='container'><div class='page-head'><div><h1>编辑人员</h1><p>带 * 的项目必须填写，图片保存后可通过 URL 访问。</p></div><a class='btn' href='/persons'>返回列表</a></div><form id='personForm' class='person-form' method='post' enctype='multipart/form-data' onsubmit='return validatePersonForm(true)'><section class='card'><h2>基本信息</h2><div class='grid'><label>姓名 *<input type='text' name='name' value='张三' placeholder='最多 5 个汉字'></label><label>性别 *<select name='gender'><option value='男' selected>男</option><option value='女'>女</option></select></label><label>年龄 *<input type='text' name='age' value='45' placeholder='16-65'></label><label>民族<input type='text' name='nation' value='汉族' placeholder='如：汉族'></label><label>政治面貌<input type='text' name='politicalStatus' value='群众' placeholder='群众/党员等'></label><label>岗位 *<input type='text' name='job' value='安全员' placeholder='如：安全员'></label><label>所在工区 *<input type='text' name='workArea' value='一工区' placeholder=''></label><label>所在公司 *<input type='text' name='company' value='示例建设公司' placeholder=''></label></div><label>人员照片 <input id='photoFile' type='file' name='photo' accept='image/*'><div class='thumbs'><a target='_blank' href='/uploads/person-photo/1783144266244-48109b8b28.png'><img src='/uploads/person-photo/1783144266244-48109b8b28.png'></a></div></label></section><section class='card'><h2>保险信息</h2><div class='grid'><label>保险有效期<input type='date' name='insuranceExpiry' value='2026-07-20' placeholder='yyyy-MM-dd'></label></div><label>保险资料图片 *（最多 20 张，单张 5MB）<input id='insuranceFiles' type='file' name='insuranceImages' multiple accept='image/*'><div class='thumbs'><a target='_blank' href='/uploads/insurance/1783144266252-1578815692.png'><img src='/uploads/insurance/1783144266252-1578815692.png'></a></div></label></section><section class='card'><div class='section-head'><h2>执业资格</h2><button type='button' class='btn' onclick='addQualification()'>增加执业资格</button></div><p class='sub'>默认 0 项，最多 5 项；填写名称后必须上传 1-3 张证书图片并填写有效期。</p><div id='qualificationBox'><div class='qual-block' data-idx='0'><input type='hidden' name='qualificationExisting0' value='qualification/1783144266260-37a0296405.png'><div class='grid'><label>执业资格名称<input name='qualificationName0' value='安全员证'></label><label>有效期<input type='date' name='qualificationExpiry0' value='2026-07-25'></label></div><label>证书图片（1-3 张）<input type='file' name='qualificationCert0' multiple accept='image/*'><div class='thumbs'><a target='_blank' href='/uploads/qualification/1783144266260-37a0296405.png'><img src='/uploads/qualification/1783144266260-37a0296405.png'></a></div></label><button type='button' onclick="this.closest('.qual-block').remove()">删除</button></div></div></section><section class='card'><h2>技术职称和学历</h2><div class='grid'><label>技术职称<input type='text' name='technicalTitle' value='工程师' placeholder=''></label><label>技术职称专业<input type='text' name='technicalTitleMajor' value='土木工程' placeholder='选择技术职称后必填'></label><label>最高学历<input type='text' name='highestEducation' value='本科' placeholder=''></label><label>最高学位<input type='text' name='highestDegree' value='学士' placeholder=''></label><label>毕业院校<input type='text' name='graduateSchool' value='示例大学' placeholder=''></label><label>所学专业<input type='text' name='major' value='土木工程' placeholder=''></label><label>毕业时间<input type='date' name='graduationDate' value='2010-07-01' placeholder='yyyy-MM-dd'></label><label>进场时间<input type='date' name='entryDate' value='2026-07-04' placeholder='yyyy-MM-dd'></label></div></section><section class='card'><h2>安全培训考试</h2><div class='grid'><label>安全考试成绩 *<input type='text' name='safetyScore' value='88' placeholder='60-100'></label></div><label>安全责任书图片<input type='file' name='responsibilityImages' multiple accept='image/*'></label><label>安全培训图片<input type='file' name='trainingImages' multiple accept='image/*'></label><label>考试资料图片<input type='file' name='examImages' multiple accept='image/*'></label></section><input type='hidden' id='qualificationIndexes' name='qualificationIndexes'><div class='sticky-actions'><button class='primary'>保存</button><a class='btn' href='/persons'>取消</a></div></form><script>var qualNext=1;function fileOk(file,max,msg){if(!file)return true;if(!file.type.startsWith('image/')){alert(msg+'必须是图片类型');return false;}if(file.size>max){alert(msg+'超过大小限制');return false;}return true;}function validatePersonForm(edit){var f=document.getElementById('personForm');var name=f.name.value.trim();if(!/^[\u4e00-\u9fa5]{1,5}$/.test(name)){alert('姓名必须为 1 到 5 个汉字');return false;}var age=parseInt(f.age.value,10);if(isNaN(age)||age<16||age>65){alert('年龄必须在 16 到 65 岁之间');return false;}if(age>60){alert('提示：该人员年龄已超过 60 岁，请确认是否符合进场要求。');}var score=parseInt(f.safetyScore.value,10);if(isNaN(score)||score<60||score>100){alert('安全考试成绩必须在 60 到 100 分之间');return false;}if(f.technicalTitle.value.trim()&& !f.technicalTitleMajor.value.trim()){alert('选择技术职称后必须填写技术职称专业');return false;}var photo=document.getElementById('photoFile');if(!edit&&photo.files.length===0){alert('新增人员必须上传人员照片');return false;}if(photo.files[0]&&!fileOk(photo.files[0],20*1024*1024,'人员照片'))return false;var ins=document.getElementById('insuranceFiles');if(!edit&&ins.files.length===0){alert('新增人员必须上传至少 1 张保险图片');return false;}if(ins.files.length>20){alert('保险图片最多 20 张');return false;}var all=document.querySelectorAll('input[type=file]');for(var i=0;i<all.length;i++){if(all[i].id==='photoFile')continue;for(var j=0;j<all[i].files.length;j++){if(!fileOk(all[i].files[j],5*1024*1024,'证件图片'))return false;}}var indexes=[];var blocks=document.querySelectorAll('.qual-block');for(var b=0;b<blocks.length;b++){var block=blocks[b];var idx=block.dataset.idx;indexes.push(idx);var nm=block.querySelector('[name=qualificationName'+idx+']').value.trim();var exp=block.querySelector('[name=qualificationExpiry'+idx+']').value.trim();var ex=block.querySelector('[name=qualificationExisting'+idx+']').value.trim();var files=block.querySelector('[name=qualificationCert'+idx+']').files.length;var count=(ex?ex.split(',').filter(Boolean).length:0)+files;if(nm&&(exp===''||count<1||count>3)){alert('执业资格填写名称后，必须填写有效期并提供 1 到 3 张证书图片');return false;}}document.getElementById('qualificationIndexes').value=indexes.join(',');return true;}function addQualification(){var box=document.getElementById('qualificationBox');if(box.children.length>=5){alert('最多允许 5 个执业资格');return;}var i=qualNext++;var div=document.createElement('div');div.className='qual-block';div.dataset.idx=i;div.innerHTML='<input type="hidden" name="qualificationExisting'+i+'"><div class="grid"><label>执业资格名称<input name="qualificationName'+i+'"></label><label>有效期<input type="date" name="qualificationExpiry'+i+'"></label></div><label>证书图片（1-3 张）<input type="file" name="qualificationCert'+i+'" multiple accept="image/*"></label><button type="button" onclick="this.closest(\'.qual-block\').remove()">删除</button>';box.appendChild(div);}</script></main></body></html>
