<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>InfoKeeper — 个人信息碎片管理器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f0f2f5;
    color: #1a1a2e;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* ===== 容器 ===== */
  .app-container {
    width: 420px;
    max-width: 100vw;
    height: 700px;
    max-height: 100vh;
    max-height: 100dvh;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.12);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ===== 页面容器（滑动） ===== */
  .page-viewport {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  .page {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #fff;
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
  }
  .page-main { transform: translateX(0); }
  .page-detail { transform: translateX(100%); }
  .page-detail.open { transform: translateX(0); }
  .page-main.slide-left { transform: translateX(-30%); }

  /* ===== 主页面 ===== */
  .main-header {
    padding: 20px 20px 12px;
    border-bottom: 1px solid #f0f0f0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .main-header h1 {
    font-size: 20px;
    font-weight: 700;
    color: #1a1a2e;
  }
  .main-header .header-actions {
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .main-header .header-actions button {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 18px;
    color: #666;
    padding: 4px;
    border-radius: 8px;
    transition: background 0.2s;
    line-height: 1;
  }
  .main-header .header-actions button:hover {
    background: #f0f2f5;
  }
  .main-header .header-actions .user-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; color: #999; padding: 2px 6px;
    background: #f5f5f5; border-radius: 20px;
    white-space: nowrap; max-width: 100px;
  }
  .main-header .header-actions .user-badge svg.icon { width: 14px; height: 14px; }
  #logoutBtn:hover { color: #e74c3c !important; background: #fde8e8 !important; }

  /* ===== 搜索框 ===== */
  .search-bar, .detail-search-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-bottom: 1px solid #f0f0f0;
    background: #fff;
  }
  .search-bar .search-icon,
  .detail-search-bar .search-icon {
    color: #999;
    display: flex;
    flex-shrink: 0;
  }
  .search-bar .search-icon svg.icon,
  .detail-search-bar .search-icon svg.icon { width: 16px; height: 16px; }
  .search-bar input,
  .detail-search-bar input {
    flex: 1;
    border: none;
    background: transparent;
    font-size: 14px;
    outline: none;
    color: #1a1a2e;
    min-width: 0;
  }
  .search-bar input::placeholder,
  .detail-search-bar input::placeholder { color: #bbb; }
  .search-bar .search-clear,
  .detail-search-bar .search-clear {
    background: none; border: none; cursor: pointer;
    color: #ccc; padding: 2px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity 0.2s, color 0.2s;
    flex-shrink: 0;
  }
  .search-bar .search-clear.visible,
  .detail-search-bar .search-clear.visible { opacity: 1; }
  .search-bar .search-clear:hover,
  .detail-search-bar .search-clear:hover { color: #666; }
  .search-bar .search-clear svg.icon,
  .detail-search-bar .search-clear svg.icon { width: 14px; height: 14px; }

  /* 搜索结果 */
  .search-group { margin-bottom: 8px; }
  .search-group .group-item { border-bottom: none; }
  .search-entries {
    padding-left: 56px;
    padding-right: 12px;
    padding-bottom: 6px;
  }
  .search-entry {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .search-entry:hover { background: #f8f9ff; }
  .search-entry-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #1a73e8;
    margin-top: 7px;
    flex-shrink: 0;
  }
  .search-entry-info { min-width: 0; flex: 1; }
  .search-entry-title {
    font-size: 13px; font-weight: 600;
    color: #1a1a2e;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .search-entry-content {
    font-size: 12px; color: #888;
    margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .search-entry mark, .group-item .name mark, .entry-card mark {
    background: #ffeb3b;
    color: #1a1a2e;
    border-radius: 2px;
    padding: 0 1px;
  }

  .group-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 16px;
  }
  .group-list::-webkit-scrollbar { width: 4px; }
  .group-list::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }

  .group-item {
    display: flex;
    align-items: center;
    padding: 14px 12px;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.15s;
    border-bottom: 1px solid #f5f5f5;
  }
  .group-item:hover { background: #f8f9ff; }
  .group-item .icon {
    width: 40px; height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    margin-right: 12px;
    flex-shrink: 0;
  }
  .group-item .icon.github { background: #2b3137; color: #fff; }
  .group-item .icon.wechat { background: #07c160; color: #fff; }
  .group-item .icon.default { background: #e8f0fe; color: #1a73e8; }

  .group-item .info { flex: 1; min-width: 0; }
  .group-item .info .name { font-size: 15px; font-weight: 600; }
  .group-item .info .preview {
    font-size: 12px; color: #999;
    margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .group-item .actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .group-item .actions button {
    background: none; border: none; cursor: pointer;
    font-size: 16px; color: #ccc; padding: 6px;
    border-radius: 8px; transition: all 0.2s; line-height: 1;
  }
  .group-item .actions button.edit-group-btn:hover { color: #1a73e8; background: #e8f0fe; }
  .group-item .actions button.del-btn:hover { color: #e74c3c; background: #fde8e8; }
  .group-item .actions .arrow {
    font-size: 18px; color: #ccc;
    padding: 6px 4px;
  }

  /* ===== 底部添加按钮 ===== */
  .add-group-bar {
    padding: 12px 20px 20px;
    border-top: 1px solid #f0f0f0;
  }
  .add-group-bar button {
    width: 100%;
    padding: 12px;
    border: 2px dashed #d0d5dd;
    border-radius: 12px;
    background: none;
    color: #666;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .add-group-bar button:hover {
    border-color: #1a73e8;
    color: #1a73e8;
    background: #f0f5ff;
  }

  /* ===== 详情页 ===== */
  .detail-header {
    padding: 16px 20px;
    border-bottom: 1px solid #f0f0f0;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .detail-header .back-btn {
    background: none; border: none; cursor: pointer;
    font-size: 22px; color: #333; padding: 4px;
    border-radius: 8px; transition: background 0.2s; line-height: 1;
  }
  .detail-header .back-btn:hover { background: #f0f2f5; }
  .detail-header .title {
    flex: 1;
    font-size: 18px; font-weight: 700;
  }
  .detail-header .add-entry-btn {
    background: none; border: none; cursor: pointer;
    font-size: 14px; color: #1a73e8; font-weight: 600;
    padding: 6px 12px; border-radius: 8px;
    transition: background 0.2s;
  }
  .detail-header .add-entry-btn:hover { background: #e8f0fe; }
  .detail-header .del-group-btn {
    background: none; border: none; cursor: pointer;
    font-size: 16px; color: #ccc; padding: 6px;
    border-radius: 8px; transition: all 0.2s; line-height: 1;
  }
  .detail-header .del-group-btn:hover { color: #e74c3c; background: #fde8e8; }

  .entry-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px 20px;
  }
  .entry-list::-webkit-scrollbar { width: 4px; }
  .entry-list::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }

  .entry-card {
    background: #f8f9fc;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 12px;
    position: relative;
    transition: background 0.2s;
  }
  .entry-card:hover { background: #f0f2f8; }
  .entry-card .entry-title {
    font-size: 14px; font-weight: 600;
    color: #1a1a2e;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .entry-card .entry-title .tag {
    font-size: 11px; font-weight: 400;
    color: #999;
  }
  .entry-card .entry-content {
    font-size: 13px;
    color: #555;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .entry-card .entry-image {
    margin-top: 8px;
    max-width: 100%;
    max-height: 200px;
    border-radius: 8px;
    cursor: zoom-in;
    display: block;
    border: 1px solid #eee;
  }
  .entry-card .entry-actions {
    position: absolute;
    top: 10px; right: 10px;
    display: flex; gap: 4px;
    opacity: 0.6;
    transition: opacity 0.2s;
  }
  .entry-card:hover .entry-actions,
  .entry-card .entry-actions:focus-within { opacity: 1; }
  .entry-card .entry-actions button {
    background: none; border: none; cursor: pointer;
    font-size: 14px; color: #999; padding: 4px 6px;
    border-radius: 6px; transition: all 0.15s; line-height: 1;
  }
  .entry-card .entry-actions .edit-btn:hover { color: #1a73e8; background: #e8f0fe; }
  .entry-card .entry-actions .del-entry-btn:hover { color: #e74c3c; background: #fde8e8; }
  /* 图片查看弹窗 */
  .image-viewer {
    display: none;
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.8);
    z-index: 5000;
    justify-content: center; align-items: center;
    cursor: zoom-out;
  }
  .image-viewer.show { display: flex; }
  .image-viewer img {
    max-width: 90vw;
    max-height: 90vh;
    border-radius: 8px;
  }

  .empty-state {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100%; color: #ccc; font-size: 14px;
  }
  .empty-state .big-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
  .empty-state .big-icon svg { width: 48px; height: 48px; }

  /* ===== 弹窗 ===== */
  .modal-overlay {
    display: none;
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.35);
    z-index: 4000;
    justify-content: center; align-items: center;
    animation: fadeIn 0.2s ease;
  }
  .modal-overlay.show { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: #fff;
    border-radius: 16px;
    padding: 24px;
    width: 340px;
    max-width: 90vw;
    box-shadow: 0 12px 48px rgba(0,0,0,0.2);
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .modal h3 { font-size: 17px; font-weight: 700; margin-bottom: 16px; }
  .modal label { font-size: 13px; color: #666; display: block; margin-bottom: 4px; margin-top: 12px; }
  .modal label:first-of-type { margin-top: 0; }
  .modal input,
  .modal textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid #e0e0e0;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
    font-family: inherit;
  }
  .modal input:focus,
  .modal textarea:focus { border-color: #1a73e8; }
  .modal textarea { min-height: 80px; resize: vertical; }
  .modal .modal-actions {
    display: flex; gap: 8px;
    margin-top: 18px;
    justify-content: flex-end;
  }
  .modal .modal-actions button {
    padding: 8px 20px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
  }
  .modal .modal-actions .btn-cancel {
    background: #f0f2f5; color: #666;
  }
  .modal .modal-actions .btn-cancel:hover { background: #e5e7eb; }
  .modal .modal-actions .btn-confirm {
    background: #1a73e8; color: #fff;
  }
  .modal .modal-actions .btn-confirm:hover { background: #1557b0; }
  .modal .modal-actions .btn-danger {
    background: #e74c3c; color: #fff;
  }
  .modal .modal-actions .btn-danger:hover { background: #c0392b; }
  .modal .img-upload-area {
    margin-top: 10px;
  }
  .modal .img-upload-btn {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 6px 12px;
    border: 1.5px dashed #d0d5dd; border-radius: 8px;
    background: none; color: #666;
    font-size: 13px; cursor: pointer;
    transition: all 0.2s;
  }
  .modal .img-upload-btn:hover {
    border-color: #1a73e8; color: #1a73e8; background: #f0f5ff;
  }
  .modal .img-preview-wrap {
    margin-top: 8px; position: relative;
    display: inline-block;
  }
  .modal .img-preview-wrap img {
    max-width: 100%; max-height: 120px;
    border-radius: 8px; border: 1px solid #eee;
  }
  .modal .img-preview-wrap .img-remove {
    position: absolute; top: -8px; right: -8px;
    width: 22px; height: 22px; border-radius: 50%;
    border: none; background: #e74c3c; color: #fff;
    font-size: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
  }
  /* SVG 图标通用尺寸 */
  button svg.icon { width: 18px; height: 18px; vertical-align: middle; }
  .header-actions button svg.icon { width: 20px; height: 20px; }
  .group-item .icon svg { width: 22px; height: 22px; }
  .group-item .actions button svg.icon { width: 16px; height: 16px; }
  .group-item .actions .arrow svg.icon { width: 18px; height: 18px; }
  .detail-header .back-btn svg.icon { width: 24px; height: 24px; }
  .detail-header .del-group-btn svg.icon { width: 18px; height: 18px; }
  .add-group-bar button svg.icon { width: 16px; height: 16px; }
  .detail-header .add-entry-btn svg.icon { width: 14px; height: 14px; }
  .login-box .login-icon svg { width: 48px; height: 48px; }
  /* 设置弹窗 */
  .settings-modal { width: 380px; }
  .settings-section { margin-top: 16px; padding-top: 14px; border-top: 1px solid #f0f0f0; }
  .settings-section:first-of-type { margin-top: 4px; }
  .settings-section-title { font-size: 13px; font-weight: 700; color: #333; margin-bottom: 10px; }
  .settings-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 16px; border: 1.5px solid #e0e0e0;
    border-radius: 10px; background: #fff; color: #333;
    font-size: 13px; font-weight: 600; cursor: pointer;
    transition: all 0.2s;
  }
  .settings-btn:hover { border-color: #1a73e8; color: #1a73e8; background: #f0f5ff; }
  .settings-btn-danger { border-color: #fde8e8; color: #e74c3c; }
  .settings-btn-danger:hover { border-color: #e74c3c; background: #fde8e8; }
  .settings-desc { font-size: 12px; color: #aaa; margin-top: 6px; margin-bottom: 4px; }
  .settings-close-btn { background: #f0f2f5; color: #666; padding: 8px 24px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .settings-close-btn:hover { background: #e5e7eb; }
  #settingsModal .modal-actions { justify-content: center; }
  /* 导出选择弹窗 */
  .export-modal { width: 360px; }
  .export-options {
    max-height: 320px;
    overflow-y: auto;
    margin: 12px 0 4px;
  }
  .modal .export-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s;
    margin-bottom: 4px;
  }
  .modal .export-option:hover { background: #f8f9ff; }
  .export-option input[type="radio"] {
    width: 16px; height: 16px;
    accent-color: #1a73e8;
    flex-shrink: 0;
  }
  .export-option-icon {
    color: #1a73e8;
    display: flex;
    flex-shrink: 0;
  }
  .export-option-icon svg.icon { width: 18px; height: 18px; }
  .export-option-text {
    font-size: 14px; color: #333;
    flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .export-option-sep {
    font-size: 12px; color: #aaa;
    padding: 8px 12px 4px;
  }
  .export-empty {
    font-size: 13px; color: #999;
    padding: 12px;
    text-align: center;
  }
  /* 恢复弹窗 */
  #recoverModal .modal { text-align: center; }
  #recoverModal .modal h3 { display: flex; align-items: center; justify-content: center; gap: 8px; }
  #recoverModal .modal h3 svg.icon { width: 22px; height: 22px; color: #e67e22; }

  /* 数据恢复列表弹窗 */
  .recovery-modal { width: 380px; }
  .recovery-list { margin: 12px 0 4px; }
  .recovery-empty {
    font-size: 13px; color: #999;
    padding: 20px 12px; text-align: center;
  }
  .recovery-item {
    display: flex; align-items: center; gap: 10px;
    padding: 12px;
    background: #f8f9fc;
    border-radius: 10px;
    margin-bottom: 8px;
  }
  .recovery-item-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: #e8f0fe; color: #1a73e8;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .recovery-item-icon svg.icon { width: 18px; height: 18px; }
  .recovery-item-info { flex: 1; min-width: 0; }
  .recovery-item-title { font-size: 14px; font-weight: 600; color: #1a1a2e; }
  .recovery-item-meta { font-size: 12px; color: #999; margin-top: 2px; }
  .recovery-item-actions { flex-shrink: 0; }
  .recovery-item-actions button {
    background: #1a73e8; color: #fff;
    border: none; border-radius: 8px;
    padding: 6px 12px; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: background 0.2s;
  }
  .recovery-item-actions button:hover { background: #1557b0; }
  .recovery-item-actions button.danger {
    background: #fff; color: #e74c3c;
    border: 1.5px solid #fde8e8;
  }
  .recovery-item-actions button.danger:hover { background: #fde8e8; }
  .recovery-section-title {
    font-size: 12px; font-weight: 700; color: #999;
    text-transform: uppercase; letter-spacing: 0.5px;
    padding: 12px 4px 4px; margin-top: 4px;
  }
  .recovery-section-title:first-child { margin-top: 0; }

  /* ===== 导出/导入 ===== */
  .toast {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%);
    background: #323232;
    color: #fff;
    padding: 10px 24px;
    border-radius: 10px;
    font-size: 14px;
    z-index: 2000;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* ===== 登录页 ===== */
  .login-page {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    display: flex; justify-content: center; align-items: center;
    z-index: 3000;
  }
  .login-page.hidden { display: none; }
  .login-box {
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 36px 32px 32px;
    width: 360px;
    max-width: 90vw;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    text-align: center;
    animation: loginFadeIn 0.5s ease;
  }
  @keyframes loginFadeIn {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .login-box .login-icon { font-size: 48px; margin-bottom: 8px; }

<script>
// ============================================================
// 版本迁移：语义化版本比较，仅低版本升级时清一次旧数据
// ============================================================
const APP_VERSION = [2, 0];
const raw = localStorage.getItem('infokeeper_version');
const stored = raw ? raw.split('.').map(Number) : null;
if (!stored || stored[0] < APP_VERSION[0] || (stored[0] === APP_VERSION[0] && stored[1] < APP_VERSION[1])) {
  Object.keys(localStorage).filter(k => k.startsWith('infokeeper_') && k !== 'infokeeper_version').forEach(k => localStorage.removeItem(k));
  localStorage.setItem('infokeeper_version', APP_VERSION.join('.'));
}

// ============================================================
// 数据
// ============================================================
const DEFAULT_DATA = { groups: [], trash: [] };
const TRASH_EXPIRY_DAYS = 3;

let currentUser = null;
let data = loadData();
let currentGroupId = null;
let editingGroupId = null;   // 编辑分组时的 ID，null 表示新建
let editingEntryId = null;   // 编辑条目时的 ID，null 表示新建
let mainSearchQuery = '';    // 主界面全局搜索关键字
let detailSearchQuery = '';  // 详情页组内搜索关键字

// 图片上传相关状态
let pendingImageId = null;   // 用户本次新上传的 IndexedDB 图片 ID；null 表示未上传新图
let pendingImageRemoved = false; // 用户点击了移除图片
let originalEntryImage = null;   // 编辑前的原 image 值（用于清理旧 IndexedDB 记录）
let pendingFile = null;      // 用户已选择但未确定上传方式的文件
let currentPreviewUrl = null; // 当前预览用的 object URL（用于 revoke）

// 详情页图片 URL 缓存：imageId -> objectURL，避免每次渲染重建 URL
const imageUrlCache = new Map();
function getImageUrl(id, blob) {
  if (imageUrlCache.has(id)) return imageUrlCache.get(id);
  const url = URL.createObjectURL(blob);
  imageUrlCache.set(id, url);
  return url;
}
function revokeImageUrl(id) {
  const url = imageUrlCache.get(id);
  if (url) { URL.revokeObjectURL(url); imageUrlCache.delete(id); }
}
function clearImageUrlCache() {
  for (const url of imageUrlCache.values()) {
    URL.revokeObjectURL(url);
  }
  imageUrlCache.clear();
}

// ============================================================
// 工具函数
// ============================================================
function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function storageKey() {
  return currentUser ? `infokeeper_data_${currentUser}` : 'infokeeper_data';
}

function loadData() {
  try {
    const raw = localStorage.getItem(storageKey());
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.groups && Array.isArray(parsed.groups)) {
        if (!parsed.trash) parsed.trash = [];
        purgeExpiredTrash(parsed);
        return parsed;
      }
    }
    // 兼容旧数据：首次登录时从通用 key 迁移
    if (currentUser) {
      const oldRaw = localStorage.getItem('infokeeper_data');
      if (oldRaw) {
        const parsed = JSON.parse(oldRaw);
        if (parsed && parsed.groups && Array.isArray(parsed.groups)) {
          if (!parsed.trash) parsed.trash = [];
          saveData(parsed);
          return parsed;
        }
      }
    }
  } catch (e) { /* ignore */ }
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}

function saveData(d) {
  localStorage.setItem(storageKey(), JSON.stringify(d || data));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2000);
}

// ============================================================
// IndexedDB 图片存储层（容量大，避免 localStorage 撑爆）
// ============================================================
const imageDB = {
  DB_NAME: 'infokeeper_images',
  STORE_NAME: 'images',
  _db: null,
  _available: null,

  async init() {
    if (this._available !== null) return this._available;
    try {
      this._db = await new Promise((resolve, reject) => {
        const req = indexedDB.open(this.DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(this.STORE_NAME)) {
            db.createObjectStore(this.STORE_NAME, { keyPath: 'id', autoIncrement: true });
          }
        };
        req.onsuccess = (e) => resolve(e.target.result);
        req.onerror = () => reject(req.error);
      });
      this._available = true;
    } catch (e) {
      console.warn('IndexedDB unavailable, falling back to base64:', e);
      this._available = false;
    }
    return this._available;
  },

  async save(blob) {
    if (!await this.init()) return null;
    return new Promise((resolve, reject) => {
      const tx = this._db.transaction(this.STORE_NAME, 'readwrite');
      const store = tx.objectStore(this.STORE_NAME);
      const req = store.add({ blob });
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },

  async get(id) {
    if (!await this.init()) return null;
    return new Promise((resolve, reject) => {
      const tx = this._db.transaction(this.STORE_NAME, 'readonly');
      const store = tx.objectStore(this.STORE_NAME);
      const req = store.get(id);
      req.onsuccess = () => resolve(req.result ? req.result.blob : null);
      req.onerror = () => reject(req.error);
    });
  },

  async delete(id) {
    if (!await this.init()) return;
    return new Promise((resolve) => {
      const tx = this._db.transaction(this.STORE_NAME, 'readwrite');
      tx.objectStore(this.STORE_NAME).delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
    });
  },

  async clearAll() {
    if (!await this.init()) return;
    return new Promise((resolve) => {
      const tx = this._db.transaction(this.STORE_NAME, 'readwrite');
      tx.objectStore(this.STORE_NAME).clear();
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
    });
  }
};

// ============================================================
// 清除所有本地数据（localStorage + IndexedDB）
// ============================================================
function clearAllLocalData() {
  // 1. 删除所有 infokeeper_* 前缀的 localStorage
  try {
    Object.keys(localStorage)
      .filter(k => k.startsWith('infokeeper_'))
      .forEach(k => localStorage.removeItem(k));
  } catch (e) { /* ignore */ }

  // 2. 删除 IndexedDB 数据库 infokeeper_images（如果存在）
  try {
    const req = indexedDB.deleteDatabase('infokeeper_images');
    req.onsuccess = () => { location.reload(); };
    req.onerror = () => { location.reload(); };
    req.onblocked = () => { location.reload(); };
    // 兜底：如果事件迟迟不触发，1.5s 后强制刷新
    setTimeout(() => location.reload(), 1500);
  } catch (e) {
    location.reload();
  }
}

// Canvas 压缩图片：限制最大宽度，输出 jpeg blob
function compressImage(file, maxWidth, quality) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxWidth) {
          height = Math.round(height * maxWidth / width);
          width = maxWidth;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => resolve(blob), 'image/jpeg', quality);
      };
      img.onerror = () => { console.warn('compressImage: image load failed'); resolve(null); };
      img.src = e.target.result;
    };
    reader.onerror = () => { console.warn('compressImage: file read failed'); resolve(null); };
    reader.readAsDataURL(file);
  });
}

// ============================================================
// 渲染：主页
// ============================================================
function getIcon(name) {
  const ch = name.trim().slice(0, 1) || '?';
  const letter = ch.toUpperCase();
  return {
    svg: `<span style="font-size:20px;font-weight:700;line-height:1;text-transform:uppercase;">${escapeHtml(letter)}</span>`,
    cls: 'default'
  };
}

function renderMain() {
  const container = document.getElementById('groupList');
  if (!data.groups.length) {
    container.innerHTML = `<div class="empty-state"><div class="big-icon">${icon('folder')}</div>暂无分组，点击下方按钮添加</div>`;
    return;
  }

  const query = mainSearchQuery.trim().toLowerCase();
  if (query) {
    renderMainSearchResults(container, query);
    return;
  }

  container.innerHTML = data.groups.map(g => {
    const ic = getIcon(g.name);
    const preview = g.entries.length ? g.entries[0].title + (g.entries.length > 1 ? ` 等 ${g.entries.length} 项` : '') : '暂无内容';
    return `
      <div class="group-item" data-id="${g.id}">
        <div class="icon ${ic.cls}">${ic.svg}</div>
        <div class="info">
          <div class="name">${escapeHtml(g.name)}</div>
          <div class="preview">${escapeHtml(preview)}</div>
        </div>
        <div class="actions">
          <button class="edit-group-btn" data-id="${g.id}" title="编辑分组">${icon('pencil')}</button>
          <button class="del-btn" data-id="${g.id}" title="删除分组">${icon('trash')}</button>
          <span class="arrow">${icon('arrow')}</span>
        </div>
      </div>
    `;
  }).join('');

  bindGroupItemEvents(container);
}

function renderMainSearchResults(container, query) {
  const results = [];
  for (const g of data.groups) {
    const matched = sortEntries(g.entries.filter(e =>
      boundaryIncludes(e.title, query) || boundaryIncludes(e.content || '', query)
    ));
    if (matched.length || boundaryIncludes(g.name, query)) {
      results.push({ group: g, entries: matched });
    }
  }

  if (!results.length) {
    container.innerHTML = `<div class="empty-state"><div class="big-icon">${icon('search')}</div>未找到匹配的条目</div>`;
    return;
  }

  container.innerHTML = results.map(({ group, entries }) => {
    const ic = getIcon(group.name);
    const entryHtml = entries.length ? `
      <div class="search-entries">
        ${entries.map(e => `
          <div class="search-entry" data-group-id="${group.id}" data-entry-id="${e.id}">
            <span class="search-entry-dot"></span>
            <div class="search-entry-info">
              <div class="search-entry-title">${highlightText(escapeHtml(e.title), query)}</div>
              <div class="search-entry-content">${highlightText(escapeHtml(truncateText(e.content, 60)), query)}</div>
            </div>
          </div>
        `).join('')}
      </div>
    ` : '';
    return `
      <div class="search-group" data-id="${group.id}">
        <div class="group-item">
          <div class="icon ${ic.cls}">${ic.svg}</div>
          <div class="info">
            <div class="name">${highlightText(escapeHtml(group.name), query)}</div>
            <div class="preview">${entries.length} 个匹配条目</div>
          </div>
          <div class="actions">
            <span class="arrow">${icon('arrow')}</span>
          </div>
        </div>
        ${entryHtml}
      </div>
    `;
  }).join('');

  // 点击分组或条目进入详情
  container.querySelectorAll('.search-group').forEach(el => {
    el.addEventListener('click', (e) => {
      const entryEl = e.target.closest('.search-entry');
      if (entryEl) {
        const group = data.groups.find(g => g.id === entryEl.dataset.groupId);
        const entry = group ? group.entries.find(x => x.id === entryEl.dataset.entryId) : null;
        if (entry) {
          entry.usageCount = (entry.usageCount || 0) + 1;
          saveData();
        }
        openDetail(entryEl.dataset.groupId, entryEl.dataset.entryId);
        return;
      }
      openDetail(el.dataset.id);
    });
  });
}

function bindGroupItemEvents(container) {
  // 点击行 → 进入详情
  container.querySelectorAll('.group-item').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('.del-btn') || e.target.closest('.edit-group-btn')) return;
      openDetail(el.dataset.id);
    });
  });
  // 删除按钮
  container.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (confirm('确定要删除该分组吗？（可到回收站恢复）')) {
        const removed = data.groups.find(g => g.id === btn.dataset.id);
        if (removed) {
          data.trash.push({
            type: 'group',
            group: JSON.parse(JSON.stringify(removed)),
            deletedAt: new Date().toISOString()
          });
          data.groups = data.groups.filter(g => g.id !== btn.dataset.id);
        }
        saveData();
        renderMain();
        showToast('已移至回收站');
      }
    });
  });
  // 编辑分组按钮
  container.querySelectorAll('.edit-group-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      openGroupModal(btn.dataset.id);
    });
  });
}

function truncateText(str, max) {
  if (!str) return '';
  return str.length > max ? str.slice(0, max) + '…' : str;
}

// 搜索边界：允许中文逐字匹配，但不让英文单词被拆字匹配
function isSearchBoundary(text, index) {
  if (index <= 0) return true;
  const prev = text[index - 1];
  if (/\s/.test(prev)) return true;
  if (/[,.!?;:\-_[({<"'`~@#$%^&*+=|\\\/]/.test(prev)) return true;
  return prev.charCodeAt(0) > 127;
}

function boundaryIncludes(text, query) {
  if (!query || !text) return false;
  const lowerText = text.toLowerCase();
  const lowerQuery = query.toLowerCase();
  let i = 0;
  while (i < lowerText.length) {
    const idx = lowerText.indexOf(lowerQuery, i);
    if (idx === -1) return false;
    if (isSearchBoundary(text, idx)) return true;
    i = idx + 1;
  }
  return false;
}

function getBoundaryMatchRanges(text, query) {
  if (!query || !text) return [];
  const lowerText = text.toLowerCase();
  const lowerQuery = query.toLowerCase();
  const ranges = [];
  let i = 0;
  while (i < lowerText.length) {
    const idx = lowerText.indexOf(lowerQuery, i);
    if (idx === -1) break;
    if (isSearchBoundary(text, idx)) {
      ranges.push({ start: idx, end: idx + query.length });
    }
    i = idx + 1;
  }
  return ranges;
}

function highlightText(html, query) {
  if (!query) return html;
  const ranges = getBoundaryMatchRanges(html, query);
  if (!ranges.length) return html;
  let result = '';
  let last = 0;
  for (const r of ranges) {
    result += html.slice(last, r.start);
    result += `<mark>${html.slice(r.start, r.end)}</mark>`;
    last = r.end;
  }
  result += html.slice(last);
  return result;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// 在当前分组中为条目标题生成不重复的名称（排除自身 ID）
function getUniqueEntryTitle(group, baseTitle, excludeId) {
  let title = baseTitle;
  let index = 1;
  while (group.entries.some(e => e.title === title && e.id !== excludeId)) {
    title = `${baseTitle} (${index})`;
    index++;
  }
  return title;
}

// 用于汉字首字母排序的拼音锚点（按拼音顺序取每字母最靠前的常见字）
const PY_ANCHORS = {
  a: '阿', b: '八', c: '擦', d: '搭', e: '鹅', f: '发',
  g: '嘎', h: '哈', j: '击', k: '喀', l: '拉', m: '妈',
  n: '那', o: '哦', p: '趴', q: '七', r: '然', s: '撒',
  t: '他', w: '挖', x: '西', y: '压', z: '匝'
};
const PY_LETTERS = Object.keys(PY_ANCHORS);
const zhCollator = new Intl.Collator('zh-CN');

// 取标题首字符的排序首字母：英文直接取字母，汉字按拼音首字母
function firstSortLetter(s) {
  if (!s) return '';
  const ch = s[0];
  if (/[a-zA-Z]/.test(ch)) return ch.toLowerCase();
  let lo = 0, hi = PY_LETTERS.length - 1, ans = PY_LETTERS.length;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (zhCollator.compare(PY_ANCHORS[PY_LETTERS[mid]], ch) <= 0) {
      ans = mid;
      lo = mid + 1;
    } else {
      hi = mid - 1;
    }
  }
  return ans >= 0 ? PY_LETTERS[ans] : '';
}

// 按使用频率降序、标题首字母/拼音首字母升序排列条目
function sortEntries(entries) {
  return [...entries].sort((a, b) => {
    const countDiff = (b.usageCount || 0) - (a.usageCount || 0);
    if (countDiff !== 0) return countDiff;
    const la = firstSortLetter(a.title);
    const lb = firstSortLetter(b.title);
    if (la !== lb) return la.localeCompare(lb, 'en');
    return zhCollator.compare(a.title, b.title);
  });
}

// 渲染：详情页
// ============================================================
function renderDetail() {
  const group = data.groups.find(g => g.id === currentGroupId);
  if (!group) { goBack(); return; }

  document.getElementById('detailTitle').textContent = group.name;
  const container = document.getElementById('entryList');
  const query = detailSearchQuery.trim().toLowerCase();

  const filtered = query
    ? group.entries.filter(e =>
        boundaryIncludes(e.title, query) || boundaryIncludes(e.content || '', query)
      )
    : group.entries;
  const entries = sortEntries(filtered);

  if (!group.entries.length) {
    container.innerHTML = `<div class="empty-state"><div class="big-icon">${icon('image')}</div>暂无条目，点击右上角添加</div>`;
    return;
  }
  if (!entries.length) {
    container.innerHTML = `<div class="empty-state"><div class="big-icon">${icon('search')}</div>未找到匹配的条目</div>`;
    return;
  }

  container.innerHTML = entries.map(e => {
    let imgHtml = '';
    if (typeof e.image === 'number') {
      // IndexedDB ID：先渲染占位，异步加载
      const cachedUrl = imageUrlCache.get(e.image);
      const srcAttr = cachedUrl ? `src="${escapeHtml(cachedUrl)}" data-src="${escapeHtml(cachedUrl)}"` : '';
      imgHtml = `<img class="entry-image" ${srcAttr} data-img-id="${e.image}" alt="${escapeHtml(e.title)}">`;
    } else if (typeof e.image === 'string' && e.image.startsWith('data:image')) {
      // 旧 base64：直接作为 src
      imgHtml = `<img class="entry-image" src="${escapeHtml(e.image)}" alt="${escapeHtml(e.title)}" data-src="${escapeHtml(e.image)}">`;
    }
    return `
    <div class="entry-card" data-id="${e.id}">
      <div class="entry-title">${query ? highlightText(escapeHtml(e.title), query) : escapeHtml(e.title)}</div>
      ${imgHtml}
      <div class="entry-content">${query ? highlightText(escapeHtml(e.content || ''), query) : escapeHtml(e.content || '')}</div>
      <div class="entry-actions">
        <button class="edit-btn" data-id="${e.id}" title="编辑">${icon('pencil')}</button>
        <button class="del-entry-btn" data-id="${e.id}" title="删除">${icon('trash')}</button>
      </div>
    </div>
  `}).join('');

  // 异步加载未缓存的 IndexedDB 图片
  container.querySelectorAll('img.entry-image[data-img-id]').forEach(img => {
    const id = Number(img.dataset.imgId);
    if (img.src) return; // 已有缓存 URL，无需加载
    imageDB.get(id).then(blob => {
      if (!blob) { img.style.display = 'none'; return; }
      const url = getImageUrl(id, blob);
      // 仅在元素仍在 DOM 中时设置
      if (img.isConnected) {
        img.src = url;
        img.dataset.src = url;
      }
    }).catch(() => { img.style.display = 'none'; });
  });

  // 点击条目卡片（非操作按钮、非图片）记录使用频率
  container.querySelectorAll('.entry-card').forEach(card => {
    card.addEventListener('click', (e) => {
      if (e.target.closest('.entry-actions button')) return;
      if (e.target.closest('.entry-image')) return; // 点击图片交给图片查看器
      const entry = group.entries.find(x => x.id === card.dataset.id);
      if (entry) {
        entry.usageCount = (entry.usageCount || 0) + 1;
        saveData();
        renderDetail();
      }
    });
  });

  container.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', () => openEntryModal(btn.dataset.id));
  });
  container.querySelectorAll('.del-entry-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (confirm('确定要删除该条目吗？（可到回收站恢复）')) {
        const g = data.groups.find(x => x.id === currentGroupId);
        if (g) {
          const removed = g.entries.find(x => x.id === btn.dataset.id);
          if (removed) {
            data.trash.push({
              type: 'entry',
              entry: JSON.parse(JSON.stringify(removed)),
              groupId: g.id,
              groupName: g.name,
              deletedAt: new Date().toISOString()
            });
          }
          g.entries = g.entries.filter(e => e.id !== btn.dataset.id);
          saveData();
          renderDetail();
          renderMain();
          showToast('已移至回收站');
        }
      }
    });
  });
}

// ============================================================
// 页面切换
// ============================================================
function openDetail(groupId, entryId) {
  currentGroupId = groupId;
  detailSearchQuery = '';
  const detailInput = document.getElementById('detailSearchInput');
  const detailClear = document.getElementById('detailSearchClear');
  if (detailInput) detailInput.value = '';
  if (detailClear) detailClear.classList.remove('visible');
  document.getElementById('pageMain').classList.add('slide-left');
  document.getElementById('pageDetail').classList.add('open');
  renderDetail();
  if (entryId) {
    setTimeout(() => {
      const card = document.querySelector(`.entry-card .edit-btn[data-id="${entryId}"]`);
      if (card) {
        const entryCard = card.closest('.entry-card');
        entryCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        entryCard.style.background = '#e8f0fe';
        setTimeout(() => { entryCard.style.background = ''; }, 1200);
      }
    }, 50);
  }
}

function goBack() {
  document.getElementById('pageMain').classList.remove('slide-left');
  document.getElementById('pageDetail').classList.remove('open');
  currentGroupId = null;
}

function openEntryModal(id) {
  editingEntryId = id || null;
  // 重置图片状态：清理上一次未确认的临时上传（覆盖层点击关闭等场景）
  if (pendingImageId) {
    imageDB.delete(pendingImageId).catch(() => {});
  }
  if (currentPreviewUrl) { URL.revokeObjectURL(currentPreviewUrl); currentPreviewUrl = null; }
  pendingImageId = null;
  pendingImageRemoved = false;
  originalEntryImage = null;
  pendingFile = null;

  const titleEl = document.getElementById('entryModalTitle');
  const titleInput = document.getElementById('entryTitleInput');
  const contentInput = document.getElementById('entryContentInput');
  const previewWrap = document.getElementById('imgPreviewWrap');
  const previewImg = document.getElementById('imgPreview');
  const group = data.groups.find(g => g.id === currentGroupId);

  if (id && group) {
    const entry = group.entries.find(e => e.id === id);
    titleEl.textContent = '编辑条目';
    titleInput.value = entry ? entry.title : '';
    contentInput.value = entry ? entry.content : '';
    // 恢复图片预览
    if (entry && entry.image) {
      originalEntryImage = entry.image;
      previewWrap.style.display = 'inline-block';
      if (typeof entry.image === 'number') {
        // IndexedDB ID：异步加载 blob
        previewImg.src = '';
        delete previewImg.dataset.src;
        imageDB.get(entry.image).then(blob => {
          if (!blob) {
            // 图片已丢失，标记移除
            previewWrap.style.display = 'none';
            return;
          }
          // 仅在仍是同一编辑会话时设置预览
          if (editingEntryId === id && !pendingImageId && !pendingImageRemoved) {
            currentPreviewUrl = URL.createObjectURL(blob);
            previewImg.src = currentPreviewUrl;
            previewImg.dataset.src = currentPreviewUrl;
          }
        }).catch(() => {
          previewWrap.style.display = 'none';
        });
      } else if (typeof entry.image === 'string' && entry.image.startsWith('data:image')) {
        // 旧 base64：直接显示，保存时迁移到 IndexedDB
        previewImg.src = entry.image;
        previewImg.dataset.src = entry.image;
      } else {
        previewImg.src = '';
        delete previewImg.dataset.src;
        previewWrap.style.display = 'none';
      }
    } else {
      previewImg.src = '';
      delete previewImg.dataset.src;
      previewWrap.style.display = 'none';
    }
  } else {
    titleEl.textContent = '新建条目';
    titleInput.value = '';
    contentInput.value = '';
    previewImg.src = '';
    delete previewImg.dataset.src;
    previewWrap.style.display = 'none';
  }
  document.getElementById('entryModal').classList.add('show');
  titleInput.focus();
}

document.getElementById('addEntryBtn').addEventListener('click', () => openEntryModal(null));
document.getElementById('entryModalConfirm').addEventListener('click', async () => {
  let title = document.getElementById('entryTitleInput').value.trim();
  const content = document.getElementById('entryContentInput').value.trim();
  if (!title) { showToast('请输入标题'); return; }
  const group = data.groups.find(g => g.id === currentGroupId);
  if (!group) return;

  // 检测同分组下是否存在同名条目（编辑时排除自身），提示自动重命名
  const duplicateEntry = group.entries.find(e => e.title === title && e.id !== editingEntryId);
  if (duplicateEntry) {
    const suggestedTitle = getUniqueEntryTitle(group, title, editingEntryId);
    if (!confirm(`已存在名为 "${title}" 的条目，是否创建为 "${suggestedTitle}"？`)) {
      return;
    }
    title = suggestedTitle;
  }

  // 计算新的 image 值
  let newImage = undefined;
  if (pendingImageId) {
    // 用户上传了新图
    newImage = pendingImageId;
    // 若编辑场景下原图片是 IndexedDB ID，删除旧记录
    if (editingEntryId && typeof originalEntryImage === 'number') {
      imageDB.delete(originalEntryImage).catch(() => {});
    }
  } else if (pendingImageRemoved) {
    // 用户移除了图片
    newImage = undefined;
    if (editingEntryId && typeof originalEntryImage === 'number') {
      imageDB.delete(originalEntryImage).catch(() => {});
    }
  } else if (editingEntryId) {
    // 编辑且未改动图片：保留原值；若旧值是 base64，则迁移到 IndexedDB
    if (typeof originalEntryImage === 'string' && originalEntryImage.startsWith('data:image')) {
      try {
        // base64 -> blob
        const resp = await fetch(originalEntryImage);
        const blob = await resp.blob();
        const migratedId = await imageDB.save(blob);
        if (migratedId != null) {
          newImage = migratedId;
        } else {
          newImage = originalEntryImage; // 迁移失败保留原值
        }
      } catch (e) {
        console.warn('migrate base64 image failed', e);
        newImage = originalEntryImage;
      }
    } else {
      newImage = originalEntryImage;
    }
  }

  if (editingEntryId) {
    const entry = group.entries.find(e => e.id === editingEntryId);
    if (entry) {
      entry.title = title;
      entry.content = content;
      if (newImage === undefined) delete entry.image; else entry.image = newImage;
    }
    showToast('已更新');
  } else {
    const newEntry = { id: genId(), title, content };
    if (newImage !== undefined) newEntry.image = newImage;
    group.entries.push(newEntry);
    showToast('已添加条目');
  }
  saveData();
  // 清理预览 URL
  if (currentPreviewUrl) { URL.revokeObjectURL(currentPreviewUrl); currentPreviewUrl = null; }
  pendingImageId = null;
  pendingImageRemoved = false;
  originalEntryImage = null;
  pendingFile = null;
  renderDetail();
  renderMain();
  document.getElementById('entryModal').classList.remove('show');
});

// 设置 / 数据管理 / 账号注销
// ============================================================
const DELETED_ACCOUNTS_KEY = 'infokeeper_deleted';
const PROTECTION_DAYS = 3;

function loadDeletedAccounts() {
  try { return normalizeDeletedAccounts(JSON.parse(localStorage.getItem(DELETED_ACCOUNTS_KEY)) || {}); } catch { return {}; }
}
function saveDeletedAccounts(acc) {
  localStorage.setItem(DELETED_ACCOUNTS_KEY, JSON.stringify(normalizeDeletedAccounts(acc)));
}

// 清理并规范化注销/重置备份记录，防止损坏数据导致恢复弹窗无法触发
function normalizeDeletedAccounts(acc) {
  if (!acc || typeof acc !== 'object') return {};
  const result = {};
  for (const key of Object.keys(acc)) {
    const info = acc[key];
    if (!info || typeof info !== 'object') continue;
    let deletedAt = info.deletedAt;
    if (!deletedAt || isNaN(new Date(deletedAt).getTime())) {
      deletedAt = new Date().toISOString();
    }
    result[key] = {
      password: String(info.password || ''),
      data: (info.data && Array.isArray(info.data.groups)) ? info.data : { groups: [] },
      deletedAt
    };
  }
  return result;
}

// 显示恢复弹窗（统一入口，避免 onclick 覆盖与监听器累积）
function showRecoverModal(titleHtml, msg, onConfirm, onCancel) {
  const modal = document.getElementById('recoverModal');
  const confirmBtn = document.getElementById('recoverConfirm');
  const cancelBtn = document.getElementById('recoverCancel');
  document.getElementById('recoverModalTitle').innerHTML = titleHtml;
  document.getElementById('recoverModalMsg').textContent = msg;

  const newConfirm = confirmBtn.cloneNode(true);
  const newCancel = cancelBtn.cloneNode(true);

}

    );

// 打开“可恢复数据”弹窗，列出当前账号可恢复的重置备份
function openDataRecoveryModal() {
  const modal = document.getElementById('dataRecoveryModal');
  const list = document.getElementById('recoveryList');
  const deleted = loadDeletedAccounts();
  const resetKey = '_reset_' + currentUser;
  const resetBackup = deleted[resetKey];

  const parts = [];

  // 重置备份（如果有）
  if (resetBackup && resetBackup.password === users[currentUser]) {
    const deletedTime = new Date(resetBackup.deletedAt).getTime();
    const remaining = Math.max(0, Math.ceil(PROTECTION_DAYS - (Date.now() - deletedTime) / (1000 * 60 * 60 * 24)));
    const groupCount = resetBackup.data.groups.length;
    const entryCount = resetBackup.data.groups.reduce((sum, g) => sum + (g.entries ? g.entries.length : 0), 0);
    parts.push(`<div class="recovery-section-title">重置备份</div>`);
    parts.push(`<div class="recovery-item">
      <div class="recovery-item-icon">${icon('refresh')}</div>
      <div class="recovery-item-info">
        <div class="recovery-item-title">重置数据备份</div>
        <div class="recovery-item-meta">${groupCount} 个分组 · ${entryCount} 个条目 · 剩 ${remaining} 天</div>
      </div>
      <div class="recovery-item-actions">
        <button class="recover-item-btn" data-key="${escapeHtml(resetKey)}">恢复</button>
      </div>
    </div>`);
  }

  // 回收站（已删除的分组/条目）
  if (data.trash && data.trash.length) {
    parts.push(`<div class="recovery-section-title">已删除的条目（保留 3 天）</div>`);
    data.trash.forEach((item, idx) => {
      if (item.type === 'group') {
        const g = item.group;
        const ec = (g.entries || []).length;
        parts.push(`<div class="recovery-item">
          <div class="recovery-item-icon" style="color:#e74c3c">${icon('trash')}</div>
          <div class="recovery-item-info">
            <div class="recovery-item-title">${escapeHtml(g.name)}</div>
            <div class="recovery-item-meta">分组 · ${ec} 个条目</div>
          </div>
          <div class="recovery-item-actions">
            <button class="restore-item-btn" data-idx="${idx}">恢复</button>
            <button class="recovery-item-actions danger permadel-item-btn" data-idx="${idx}">永久删除</button>
          </div>
        </div>`);
      } else {
        parts.push(`<div class="recovery-item">
          <div class="recovery-item-icon" style="color:#e74c3c">${icon('image')}</div>
          <div class="recovery-item-info">
            <div class="recovery-item-title">${escapeHtml(item.entry.title)}</div>
            <div class="recovery-item-meta">条目 · 来自「${escapeHtml(item.groupName || '未知分组')}」</div>
          </div>
          <div class="recovery-item-actions">
            <button class="restore-item-btn" data-idx="${idx}">恢复</button>
            <button class="recovery-item-actions danger permadel-item-btn" data-idx="${idx}">永久删除</button>
          </div>
        </div>`);
      }
    });
  }

  if (!parts.length) {
    list.innerHTML = `<div class="recovery-empty"><div class="big-icon">${icon('folder')}</div>暂无可恢复数据</div>`;
  } else {
    list.innerHTML = parts.join('');

    // 重置备份恢复
    list.querySelectorAll('.recover-item-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.key;
        const backup = loadDeletedAccounts()[key];
        if (!backup) return;
        if (!confirm('恢复后将覆盖当前数据，确定继续？')) return;
        data = backup.data;
        if (!data.trash) data.trash = [];
        saveData();
        renderMain();
        const del = loadDeletedAccounts();
        delete del[key];
        saveDeletedAccounts(del);
        showToast('数据已恢复');
        openDataRecoveryModal();
      });
    });

    // 回收站恢复
    list.querySelectorAll('.restore-item-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = Number(btn.dataset.idx);
        restoreTrashItem(idx);
        openDataRecoveryModal();
      });
    });

    // 回收站永久删除
    list.querySelectorAll('.permadel-item-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = Number(btn.dataset.idx);
        const prevLen = data.trash.length;
        deleteTrashItem(idx);
        if (data.trash.length !== prevLen) openDataRecoveryModal();
      });
    });
  }

  modal.classList.add('show');
}

function downloadJson(payload, filename) {
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

// 将 data 中所有 IndexedDB 图片 ID 解析为 base64 数据 URL，返回新对象
async function resolveImagesToBase64(source) {
  const clone = JSON.parse(JSON.stringify(source));
  const tasks = [];
  for (const g of clone.groups) {
    for (const e of g.entries || []) {
      if (typeof e.image === 'number') {
        tasks.push(
          imageDB.get(e.image).then(blob => {
            if (!blob) { delete e.image; return; }
            return new Promise((resolve) => {
              const reader = new FileReader();
              reader.onload = () => { e.image = reader.result; resolve(); };
              reader.onerror = () => { delete e.image; resolve(); };
              reader.readAsDataURL(blob);
            });
          })
        );
      }
    }
  }
  await Promise.all(tasks);
  return clone;
}

async function exportAll() {
  const resolved = await resolveImagesToBase64(data);
  downloadJson(resolved, `InfoKeeper_${new Date().toISOString().slice(0, 10)}.json`);
  showToast('全部数据导出成功');
}

async function exportGroup(groupId) {
  const group = data.groups.find(g => g.id === groupId);
  if (!group) return;
  const safeName = group.name.replace(/[\\/:*?"<>|]/g, '_');
  const resolved = await resolveImagesToBase64({ groups: [group] });
  downloadJson(resolved, `InfoKeeper_${safeName}_${new Date().toISOString().slice(0, 10)}.json`);
  showToast(`分组「${group.name}」导出成功`);
}

function openExportModal() {
  const modal = document.getElementById('exportModal');
  const list = document.getElementById('exportGroupList');
  if (!data.groups.length) {
    list.innerHTML = '<div class="export-empty">暂无分组，无法按分组导出</div>';
  } else {
    list.innerHTML = data.groups.map(g => `
      <label class="export-option">
        <input type="radio" name="exportTarget" value="${g.id}">
        <span class="export-option-icon">${icon('folder-open')}</span>
        <span class="export-option-text">${escapeHtml(g.name)}</span>
      </label>
    `).join('');
  }
  // 默认选中“全部导出”
  const allRadio = modal.querySelector('input[name="exportTarget"][value="__all__"]');
  if (allRadio) allRadio.checked = true;
  modal.classList.add('show');
}

// 合并导入数据：保留现有内容，同名分组合并条目（跳过重复标题），新分组直接追加
function mergeImportedData(current, imported) {
  const merged = JSON.parse(JSON.stringify(current));
  for (const impGroup of imported.groups) {
    if (!impGroup || !impGroup.name || !Array.isArray(impGroup.entries)) continue;
    const existing = merged.groups.find(g => g.name === impGroup.name);
    if (!existing) {
      // 新分组：重新生成 ID，避免与现有分组冲突
      merged.groups.push({
        id: genId(),
        name: impGroup.name,
        entries: impGroup.entries.map(e => ({ ...e, id: genId() }))
      });
    } else {
      // 同名分组：追加不存在的新条目
      for (const impEntry of impGroup.entries) {
        if (!existing.entries.some(e => e.title === impEntry.title)) {
          existing.entries.push({ ...impEntry, id: genId() });
        }
      }
    }
  }
  return merged;
}

document.getElementById('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const imported = JSON.parse(ev.target.result);
      if (imported && imported.groups && Array.isArray(imported.groups)) {
        if (confirm('导入将合并到当前数据，同名分组中相同标题的条目将跳过，确定继续吗？')) {
          data = mergeImportedData(data, imported);
          saveData();
          renderMain();
          showToast('导入成功');
        }
      } else {
        showToast('文件格式不正确');
      }
    } catch (err) {
      showToast('文件解析失败');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

function loadUsers() {
  try {
    const raw = localStorage.getItem('infokeeper_users');
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object') return parsed;
    }
  } catch (e) { /* ignore */ }
  return {}; // 无默认用户，需注册
}
function saveUsers(users) {
  localStorage.setItem('infokeeper_users', JSON.stringify(users));
}

// 登录逻辑
// ============================================================
document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('loginPassword').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('loginAccount').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('loginPassword').focus();
});

function doLogin() {
  const account = document.getElementById('loginAccount').value.trim();
  const password = document.getElementById('loginPassword').value.trim();
  const errorEl = document.getElementById('loginError');

  if (!account) { errorEl.textContent = '⚠️ 请输入账号'; return; }
  if (!password) { errorEl.textContent = '⚠️ 请输入密码'; return; }

  if (users[account] === password) {
    currentUser = account;
    data = loadData();
    document.getElementById('userBadge').innerHTML = icon('user') + '<span>' + escapeHtml(account) + '</span>';
    document.getElementById('loginPage').classList.add('hidden');
    document.getElementById('appContainer').style.display = 'flex';
    renderMain();
    // 异步检查是否有可恢复的数据备份
    setTimeout(() => checkAndRecoverData(account), 300);
  } else if (!users[account]) {
    // 检查是否是已注销账号
    const deleted = loadDeletedAccounts();
    if (deleted[account]) {
      const info = deleted[account];
      const deletedTime = new Date(info.deletedAt).getTime();
      const elapsed = Date.now() - deletedTime;
      const days = elapsed / (1000 * 60 * 60 * 24);
      if (!isNaN(days) && days < PROTECTION_DAYS) {
        const remaining = Math.ceil(PROTECTION_DAYS - days);
        // 密码正确则恢复
        if (password === info.password) {
          const acct = account, inf = info, del = deleted;
          showRecoverModal(
            icon('alert') + ' 检测到已注销账号',
            `账号 ${acct} 已于 ${new Date(inf.deletedAt).toLocaleDateString()} 注销，剩余 ${remaining} 天保护期。是否恢复？`,
            () => {
              users[acct] = inf.password;
              saveUsers(users);
              currentUser = acct;
              data = inf.data;
              saveData();
              delete del[acct];
              saveDeletedAccounts(del);
              document.getElementById('userBadge').innerHTML = icon('user') + '<span>' + escapeHtml(acct) + '</span>';
              document.getElementById('loginPage').classList.add('hidden');
              document.getElementById('appContainer').style.display = 'flex';
              renderMain();
              showToast('账号已恢复');
            },
            () => {
              errorEl.textContent = '⚠️ 账号已注销，未恢复';
            }
          );
          return;
        } else {
          errorEl.textContent = `⚠️ 账号已注销（保护期剩 ${remaining} 天），密码错误`;
          return;
        }
      } else {
        // 超过保护期或日期无效，永久删除
        delete deleted[account];
        saveDeletedAccounts(deleted);
      }
    }
    errorEl.textContent = '⚠️ 账号不存在，请重新输入';
    document.getElementById('loginAccount').focus();
    document.getElementById('loginAccount').select();
  } else {
    errorEl.textContent = '⚠️ 密码错误，请重新输入';
    document.getElementById('loginPassword').focus();
    document.getElementById('loginPassword').select();
  }
}

// 注册逻辑
// ============================================================
document.getElementById('registerBtn').addEventListener('click', doRegister);

  if (e.key === 'Enter') doRegister();
});

});
document.getElementById('regAccount').addEventListener('keydown', (e) => {

});

function doRegister() {
  const account = document.getElementById('regAccount').value.trim();
  const password = document.getElementById('regPassword').value.trim();
  const confirmPassword = document.getElementById('regConfirm').value.trim();
  const errorEl = document.getElementById('regError');

  if (!account) { errorEl.textContent = '⚠️ 请输入账号'; return; }
  if (account.length < 4) { errorEl.textContent = '⚠️ 账号至少 4 位'; return; }
  if (!password) { errorEl.textContent = '⚠️ 请设置密码'; return; }
  if (password.length < 6) { errorEl.textContent = '⚠️ 密码至少 6 位'; return; }
  if (password !== confirmPassword) { errorEl.textContent = '⚠️ 两次密码不一致'; return; }

  if (users[account]) {
    errorEl.textContent = '⚠️ 账号已存在，请直接登录';
    return;
  }

  // 检查是否处于注销保护期，防止他人占用原账号
  const deleted = loadDeletedAccounts();
  if (deleted[account]) {
    const info = deleted[account];
    const deletedTime = new Date(info.deletedAt).getTime();
    const elapsed = Date.now() - deletedTime;
    const days = elapsed / (1000 * 60 * 60 * 24);
    if (!isNaN(days) && days < PROTECTION_DAYS) {
      const remaining = Math.ceil(PROTECTION_DAYS - days);
      errorEl.textContent = `⚠️ 该账号已注销，保护期内不可注册（剩 ${remaining} 天）`;
      return;
    }
  }

  users[account] = password;
  saveUsers(users);

  // 注册成功后，填入账号并切换到登录（密码不自动填充，避免密码框隐藏导致重复输入）
  document.getElementById('loginAccount').value = account;
  document.getElementById('loginPassword').value = '';
  document.getElementById('loginError').textContent = '';
  document.getElementById('switchToLogin').click();
  showToast('注册成功，请手动输入密码登录');
}

// ============================================================
// 回收站功能
// ============================================================
function purgeExpiredTrash(d) {
  if (!d || !Array.isArray(d.trash)) return;
  const cutoff = Date.now() - TRASH_EXPIRY_DAYS * 24 * 60 * 60 * 1000;
  d.trash = d.trash.filter(item => new Date(item.deletedAt).getTime() >= cutoff);
}

function restoreTrashItem(idx) {
  const item = data.trash[idx];
  if (!item) return;
  if (item.type === 'group') {
    data.groups.push(JSON.parse(JSON.stringify(item.group)));
  } else {
    let g = data.groups.find(x => x.id === item.groupId);
    if (!g) {
      g = { id: genId(), name: item.groupName || '恢复的分组', entries: [] };
      data.groups.push(g);
    }
    g.entries.push(JSON.parse(JSON.stringify(item.entry)));
  }
  data.trash.splice(idx, 1);
  saveData();
  renderMain();
  showToast('已恢复');
}

function deleteTrashItem(idx) {
  if (!data.trash[idx]) return;
  if (!confirm('永久删除该项？不可恢复。')) return;
  data.trash.splice(idx, 1);
  saveData();
  showToast('已永久删除');
}

// 启动时清理过期的注销账号与重置备份（统一保留 3 天）
(function purgeExpiredDeleted() {
  const deleted = loadDeletedAccounts();
  let changed = false;
  for (const key of Object.keys(deleted)) {
    const info = deleted[key];
    const elapsed = Date.now() - new Date(info.deletedAt).getTime();
    if (elapsed >= PROTECTION_DAYS * 24 * 60 * 60 * 1000) {
      delete deleted[key];
      changed = true;
    }
  }
  if (changed) saveDeletedAccounts(deleted);
})();
