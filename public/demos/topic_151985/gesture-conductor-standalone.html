<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手势指挥家 - Gesture Conductor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;--bg2:#12121a;--card:rgba(255,255,255,.02);
  --border:rgba(255,255,255,.06);--text:#e8e8f0;--text2:#9999b0;
  --acc:#7c3aed;--accl:#a78bfa;--green:#22c55e;--red:#ef4444;--orange:#f59e0b;--blue:#3b82f6;
}
html,body{height:100%;width:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text)}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-20px) scale(1.05)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* 开始界面 */
#start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;width:100vw;text-align:center;background:radial-gradient(ellipse at center,#1a1040 0%,#0a0a0f 70%);position:relative;overflow:hidden}
.start-orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.3;animation:float 6s ease-in-out infinite}
.start-orb:nth-child(1){width:300px;height:300px;background:var(--acc);top:20%;left:30%}
.start-orb:nth-child(2){width:200px;height:200px;background:var(--blue);top:50%;right:25%;animation-delay:-3s}
.start-content{position:relative;z-index:2;max-width:500px;padding:2rem}
.start-icon{font-size:4rem;margin-bottom:1.5rem;animation:float 3s ease-in-out infinite}
#start-screen h1{font-size:2.5rem;font-weight:900;background:linear-gradient(135deg,#c4b5fd,#818cf8,#a78bfa,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.5rem}
.start-subtitle{font-size:1rem;color:var(--text2);margin-bottom:2rem;line-height:1.6}
.start-error{color:var(--red);font-size:.85rem;margin-bottom:1rem;padding:.8rem;background:rgba(239,68,68,.1);border-radius:12px}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.9rem 2rem;border:none;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;transition:all .2s;color:#fff}
.btn-primary{background:linear-gradient(135deg,var(--acc),#5b21b6);box-shadow:0 0 30px rgba(124,58,237,.3)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 0 40px rgba(124,58,237,.5)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-sm{padding:.5rem 1rem;font-size:.85rem;border-radius:8px}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--acc);background:rgba(124,58,237,.08)}

/* 主界面 */
#main-layout{display:flex;width:100%;height:100%;display:none}
#camera-panel{flex:1;position:relative;background:#000;display:flex;align-items:center;justify-content:center;min-width:0}
#camera-panel video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#gesture-canvas{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}
.gesture-label{position:absolute;bottom:1rem;left:50%;transform:translateX(-50%);padding:.5rem 1.5rem;border-radius:100px;font-size:1rem;font-weight:600;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);color:var(--accl);transition:all .2s}
.gesture-label.active{border-color:var(--acc);box-shadow:0 0 20px rgba(124,58,237,.3);color:#fff}
.no-hand{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#666;pointer-events:none}
.no-hand .icon{font-size:3rem;opacity:.4;margin-bottom:.5rem}
.no-hand p{font-size:.9rem}
.loading-overlay{position:absolute;inset:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;z-index:10}
.spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite}
.loading-text{color:var(--text2);font-size:.9rem}

/* 侧边栏 */
#sidebar{width:340px;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.sidebar-header{padding:1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sidebar-header h2{font-size:1.1rem;font-weight:700}
.preset-name{font-size:.8rem;color:var(--accl)}
.control-section{padding:1.2rem 1.5rem;border-bottom:1px solid var(--border)}
.control-section h3{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:#666;margin-bottom:1rem}
.param-row{display:flex;align-items:center;margin-bottom:.8rem}
.param-label{font-size:.85rem;color:var(--text2);display:flex;align-items:center;gap:.4rem;width:80px;flex-shrink:0}
.param-value{font-size:.85rem;font-weight:600;min-width:40px;text-align:right}
.param-bar{flex:1;height:6px;background:rgba(255,255,255,.08);border-radius:3px;margin:0 .8rem;overflow:hidden}
.param-bar-fill{height:100%;border-radius:3px;transition:width .1s ease-out}
.param-bar-fill.volume{background:var(--green)}
.param-bar-fill.tempo{background:var(--orange)}
.param-bar-fill.reverb{background:var(--blue)}
.track-row{display:flex;align-items:center;gap:.6rem;padding:.5rem;border-radius:8px;margin-bottom:.3rem}
.track-row.soloed{background:rgba(124,58,237,.1);border:1px solid rgba(124,58,237,.2)}
.track-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1rem;background:var(--card);border:1px solid var(--border)}
.track-name{width:40px;font-size:.8rem;color:var(--text2)}
.track-vol-bar{flex:1;height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.track-vol-fill{height:100%;background:var(--acc);border-radius:2px;transition:width .1s}
.gesture-guide{padding:1.2rem 1.5rem}
.guide-item{display:flex;align-items:center;gap:.8rem;padding:.5rem 0;border-bottom:1px solid rgba(255,255,255,.03);font-size:.8rem}
.guide-item:last-child{border-bottom:none}
.guide-gesture{font-size:1.2rem;width:32px;text-align:center}
.guide-effect{color:var(--accl);font-weight:500}
.transport{display:flex;align-items:center;gap:.8rem;padding:1rem 1.5rem;border-top:1px solid var(--border);margin-top:auto}
.btn-play{width:48px;height:48px;border-radius:50%;border:none;background:var(--acc);color:#fff;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;box-shadow:0 0 20px rgba(124,58,237,.3);flex-shrink:0}
.btn-play:hover{transform:scale(1.05);box-shadow:0 0 30px rgba(124,58,237,.5)}
.btn-play.playing{background:var(--red);box-shadow:0 0 20px rgba(239,68,68,.3)}

@media(max-width:768px){
  #main-layout{flex-direction:column}
  #sidebar{width:100%;height:45%;border-left:none;border-top:1px solid var(--border)}
  #camera-panel{height:55%}
}
</style>
</head>
<body>

<!-- 开始界面 -->
<div id="start-screen">
  <div class="start-orb"></div>
  <div class="start-orb"></div>
  <div class="start-content">
    <div class="start-icon">🎼</div>
    <h1>手势指挥家</h1>
    <p class="start-subtitle">用双手指挥一支乐队<br>摄像头捕捉手势，实时转化为音乐<br>你不是听众，你是指挥</p>
    <div id="start-error" class="start-error" style="display:none"></div>
    <button id="btn-start" class="btn btn-primary">🎛 开始指挥</button>
  </div>
</div>

<!-- 主界面 -->
<div id="main-layout">
  <div id="camera-panel">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="gesture-canvas"></canvas>
    <div id="loading-overlay" class="loading-overlay">
      <div class="spinner"></div>
      <div id="loading-text" class="loading-text">正在加载手势模型...</div>
    </div>
    <div id="no-hand" class="no-hand" style="display:none">
      <div class="icon">🤚</div>
      <p>将手伸入摄像头范围</p>
    </div>
    <div id="gesture-label" class="gesture-label">🤚 等待手势...</div>
  </div>
  <div id="sidebar">
    <div class="sidebar-header">
      <div><h2>控制面板</h2><div id="preset-display" class="preset-name" style="color:#c4b5fd">古典乐章</div></div>
      <button id="btn-guide" class="btn btn-sm btn-outline">隐藏指南</button>
    </div>
    <div class="control-section">
      <h3>音乐参数</h3>
      <div class="param-row">
        <span class="param-label">🔊 总音量</span>
        <div class="param-bar"><div id="vol-bar" class="param-bar-fill volume" style="width:70%"></div></div>
        <span id="vol-val" class="param-value">70%</span>
      </div>
      <div class="param-row">
        <span class="param-label">⏱ 速度</span>
        <div class="param-bar"><div id="tempo-bar" class="param-bar-fill tempo" style="width:33%"></div></div>
        <span id="tempo-val" class="param-value">1.00x</span>
      </div>
      <div class="param-row">
        <span class="param-label">🏛 混响</span>
        <div class="param-bar"><div id="reverb-bar" class="param-bar-fill reverb" style="width:20%"></div></div>
        <span id="reverb-val" class="param-value">20%</span>
      </div>
    </div>
    <div class="control-section">
      <h3>乐器轨道</h3>
      <div id="track-piano" class="track-row">
        <div class="track-icon">🎹</div><span class="track-name">钢琴</span>
        <div class="track-vol-bar"><div class="track-vol-fill" style="width:80%"></div></div>
      </div>
      <div id="track-drums" class="track-row">
        <div class="track-icon">🥁</div><span class="track-name">鼓</span>
        <div class="track-vol-bar"><div class="track-vol-fill" style="width:90%"></div></div>
      </div>
      <div id="track-bass" class="track-row">
        <div class="track-icon">🎸</div><span class="track-name">贝斯</span>
        <div class="track-vol-bar"><div class="track-vol-fill" style="width:70%"></div></div>
      </div>
      <div id="track-strings" class="track-row">
        <div class="track-icon">🎻</div><span class="track-name">弦乐</span>
        <div class="track-vol-bar"><div class="track-vol-fill" style="width:60%"></div></div>
      </div>
    </div>
    <div id="gesture-guide" class="gesture-guide">
      <h3 style="font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:#666;margin-bottom:.8rem">手势操作指南</h3>
      <div class="guide-item"><span class="guide-gesture">☝</span><span class="guide-effect">食指上指 → 音量升高</span></div>
      <div class="guide-item"><span class="guide-gesture">👇</span><span class="guide-effect">食指下指 → 音量降低</span></div>
      <div class="guide-item"><span class="guide-gesture">✌</span><span class="guide-effect">剪刀手 → 混响调节</span></div>
      <div class="guide-item"><span class="guide-gesture">✋</span><span class="guide-effect">五指张开 → 暂停/播放</span></div>
      <div class="guide-item"><span class="guide-gesture">✊</span><span class="guide-effect">握拳 → 切换曲目</span></div>
      <div class="guide-item"><span class="guide-gesture">👈</span><span class="guide-effect">拇指左指 → 钢琴独奏</span></div>
      <div class="guide-item"><span class="guide-gesture">👉</span><span class="guide-effect">拇指右指 → 鼓独奏</span></div>
    </div>
    <div class="transport">
      <button id="btn-play" class="btn-play">▶</button>
      <div style="flex:1">
        <div style="font-size:.85rem;font-weight:600" id="play-status">已暂停</div>
        <div style="font-size:.75rem;color:#666" id="preset-status">古典乐章 · 全乐器</div>
      </div>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.12/+esm"
  }
}
</script>

<script type="module">
// ============= 音频引擎 =============
const NOTES = { C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392.00,A4:440.00,B4:493.88, C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880.00,B5:987.77 };

const PIANO_PTRN = [
  {n:'C4',t:0,d:0.4},{n:'E4',t:0.5,d:0.4},{n:'G4',t:1.0,d:0.4},{n:'C5',t:1.5,d:0.6},
  {n:'G4',t:2.0,d:0.3},{n:'E4',t:2.5,d:0.3},{n:'C4',t:3.0,d:0.5},{n:'D4',t:3.5,d:0.4},
  {n:'F4',t:4.0,d:0.4},{n:'A4',t:4.5,d:0.4},{n:'G4',t:5.0,d:0.3},{n:'F4',t:5.5,d:0.3},
  {n:'E4',t:6.0,d:0.4},{n:'D4',t:6.5,d:0.4},{n:'C4',t:7.0,d:0.8}
];
const BASS_PTRN = [
  {n:'C4',t:0,d:0.9},{n:'C4',t:1.0,d:0.9},{n:'G4',t:2.0,d:0.9},{n:'G4',t:3.0,d:0.9},
  {n:'F4',t:4.0,d:0.9},{n:'F4',t:5.0,d:0.9},{n:'C4',t:6.0,d:0.9},{n:'C4',t:7.0,d:0.9}
];
const STR_PTRN = [
  {n:'C4',t:0,d:1.8},{n:'G4',t:2.0,d:1.8},{n:'F4',t:4.0,d:1.8},{n:'C4',t:6.0,d:1.8}
];

const PRESETS = [
  {name:'古典乐章',tempo:1.0,vols:[0.9,0.4,0.5,0.8],reverb:0.35,color:'#c4b5fd'},
  {name:'流行节拍',tempo:1.2,vols:[0.7,0.95,0.8,0.4],reverb:0.15,color:'#818cf8'},
  {name:'电子氛围',tempo:0.85,vols:[0.5,0.7,0.9,0.7],reverb:0.5,color:'#a78bfa'}
];

let audioCtx = null;
let masterGain, dryGain, reverbGain, reverbNode;
let trackGains = [];
let params = {
  masterVolume:0.7, tempo:1.0, reverb:0.2, soloTrack:-1,
  trackVolumes:[0.8,0.9,0.7,0.6], isPlaying:false, currentPreset:0
};
let loopTimer = null;

function createReverb(dur,decay){
  const sr = audioCtx.sampleRate;
  const len = sr * dur;
  const buf = audioCtx.createBuffer(2, len, sr);
  for(let ch=0;ch<2;ch++){
    const d = buf.getChannelData(ch);
    for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/len, decay);
  }
  return buf;
}

function playNote(trackIdx, freq, start, dur, wave='sine', gain=0.3){
  const osc = audioCtx.createOscillator();
  const env = audioCtx.createGain();
  osc.type=wave; osc.frequency.value=freq;
  env.gain.setValueAtTime(0,start);
  env.gain.linearRampToValueAtTime(gain,start+0.02);
  env.gain.setValueAtTime(gain,start+dur*0.7);
  env.gain.linearRampToValueAtTime(0,start+dur);
  osc.connect(env); env.connect(trackGains[trackIdx]);
  osc.start(start); osc.stop(start+dur+0.05);
}

function playDrum(start, type){
  const sr = audioCtx.sampleRate;
  const buf = audioCtx.createBuffer(1, sr*0.2, sr);
  const d = buf.getChannelData(0);
  if(type==='kick'){
    let f=150;
    for(let i=0;i<sr*0.2;i++){const t=i/sr;f*=0.996;d[i]=Math.sin(2*Math.PI*f*t)*Math.exp(-t*20)*0.8}
  }else if(type==='snare'){
    for(let i=0;i<sr*0.2;i++){const t=i/sr;d[i]=(Math.sin(2*Math.PI*180*t)*Math.exp(-t*15)*0.3+(Math.random()*2-1)*Math.exp(-t*25)*0.7)*0.6}
  }else{
    for(let i=0;i<sr*0.2;i++){const t=i/sr;d[i]=(Math.random()*2-1)*Math.exp(-t*60)*0.3}
  }
  const s = audioCtx.createBufferSource(); s.buffer=buf;
  s.connect(trackGains[1]); s.start(start);
}

function scheduleLoop(){
  if(!params.isPlaying) return;
  const now = audioCtx.currentTime;
  const t = params.tempo;
  const bd = 0.5/t;
  PIANO_PTRN.forEach(({n,time,dur})=>playNote(0,NOTES[n]||261.63,now+time/t,(dur/t)*0.9,'triangle',0.25));
  BASS_PTRN.forEach(({n,time,dur})=>playNote(2,(NOTES[n]||261.63)/2,now+time/t,(dur/t)*0.9,'sawtooth',0.2));
  STR_PTRN.forEach(({n,time,dur})=>playNote(3,NOTES[n]||261.63,now+time/t,(dur/t)*0.95,'sine',0.15));
  for(let b=0;b<16;b++){
    const bt=now+b*bd;
    if(b%2===0) playDrum(bt,'kick');
    if(b%2===1) playDrum(bt+bd*0.5,'snare');
    playDrum(bt,'hihat');
    playDrum(bt+bd*0.25,'hihat');
  }
  loopTimer = setTimeout(scheduleLoop, Math.max((8/t)*1000-100, 100));
}

function initAudio(){
  if(audioCtx) return;
  audioCtx = new AudioContext();
  masterGain = audioCtx.createGain(); masterGain.gain.value=params.masterVolume;
  dryGain = audioCtx.createGain(); dryGain.gain.value=0.8;
  reverbNode = audioCtx.createConvolver(); reverbNode.buffer=createReverb(2.5,0.5);
  reverbGain = audioCtx.createGain(); reverbGain.gain.value=params.reverb;
  dryGain.connect(masterGain); reverbGain.connect(masterGain);
  masterGain.connect(audioCtx.destination);
  const pans=[-0.5,0,0.3,0.5];
  for(let i=0;i<4;i++){
    const g = audioCtx.createGain(); g.gain.value=params.trackVolumes[i];
    const p = audioCtx.createStereoPanner(); p.pan.value=pans[i];
    g.connect(p); p.connect(dryGain); p.connect(reverbNode);
    trackGains.push(g);
  }
}

function updateParams(p){
  Object.assign(params, p);
  if(masterGain) masterGain.gain.linearRampToValueAtTime(params.masterVolume, audioCtx.currentTime+0.05);
  if(reverbGain) reverbGain.gain.linearRampToValueAtTime(params.reverb, audioCtx.currentTime+0.05);
  trackGains.forEach((g,i)=>{
    const v = params.soloTrack===-1 ? params.trackVolumes[i] : (params.soloTrack===i?1.0:0.05);
    g.gain.linearRampToValueAtTime(v, audioCtx.currentTime+0.05);
  });
  updateUI();
}

function togglePlay(){
  if(params.isPlaying){ params.isPlaying=false; clearTimeout(loopTimer); }
  else { params.isPlaying=true; scheduleLoop(); }
  updateUI();
}

// ============= 手势识别 =============
const HAND = {WRIST:0,THUMB_CMC:1,THUMB_MCP:2,THUMB_IP:3,THUMB_TIP:4,
  INDEX_MCP:5,INDEX_PIP:6,INDEX_DIP:7,INDEX_TIP:8,
  MIDDLE_MCP:9,MIDDLE_PIP:10,MIDDLE_DIP:11,MIDDLE_TIP:12,
  RING_MCP:13,RING_PIP:14,RING_DIP:15,RING_TIP:16,
  PINKY_MCP:17,PINKY_PIP:18,PINKY_DIP:19,PINKY_TIP:20};

function isFingerExt(lm, tip, pip, mcp){ return lm[tip]&&lm[pip]&&lm[mcp]&&lm[tip].y<lm[pip].y&&lm[pip].y<lm[mcp].y; }
function isThumbExt(lm, handed){
  const t=lm[HAND.THUMB_TIP],i=lm[HAND.THUMB_IP],m=lm[HAND.THUMB_MCP];
  if(!t||!i||!m) return false;
  return handed==='Right'?t.x<i.x&&i.x<m.x:t.x>i.x&&i.x>m.x;
}

function classifyGesture(lm, handed){
  const ie=isFingerExt(lm,HAND.INDEX_TIP,HAND.INDEX_PIP,HAND.INDEX_MCP);
  const me=isFingerExt(lm,HAND.MIDDLE_TIP,HAND.MIDDLE_PIP,HAND.MIDDLE_MCP);
  const re=isFingerExt(lm,HAND.RING_TIP,HAND.RING_PIP,HAND.RING_MCP);
  const pe=isFingerExt(lm,HAND.PINKY_TIP,HAND.PINKY_PIP,HAND.PINKY_MCP);
  const te=isThumbExt(lm,handed);
  const cnt=[te,ie,me,re,pe].filter(Boolean).length;
  if(cnt===0) return 'FIST';
  if(cnt>=4) return 'OPEN_PALM';
  if(ie&&me&&!re&&!pe&&!te) return 'PEACE';
  if(ie&&!me&&!re&&!pe){
    const ity=lm[HAND.INDEX_TIP].y, wy=lm[HAND.WRIST].y;
    return ity<wy-0.1?'POINT_UP':ity>wy+0.1?'POINT_DOWN':'POINT_UP';
  }
  if(te&&!ie&&!me&&!re&&!pe){
    const ttx=lm[HAND.THUMB_TIP].x, wx=lm[HAND.WRIST].x;
    return handed==='Right'?(ttx<wx?'THUMB_LEFT':'THUMB_RIGHT'):(ttx>wx?'THUMB_LEFT':'THUMB_RIGHT');
  }
  return 'NONE';
}

function drawSkeleton(ctx, lm, w, h){
  ctx.clearRect(0,0,w,h);
  const conns=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]];
  ctx.strokeStyle='rgba(167,139,250,0.6)';ctx.lineWidth=2;ctx.beginPath();
  conns.forEach(([a,b])=>{if(lm[a]&&lm[b]){ctx.moveTo(lm[a].x*w,lm[a].y*h);ctx.lineTo(lm[b].x*w,lm[b].y*h)}});
  ctx.stroke();
  lm.forEach((p,i)=>{
    ctx.beginPath();ctx.arc(p.x*w,p.y*h,i===0?5:3,0,Math.PI*2);
    ctx.fillStyle=i===0?'rgba(124,58,237,0.9)':'rgba(167,139,250,0.7)';ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;ctx.stroke();
  });
  [4,8,12,16,20].forEach(i=>{if(lm[i]){ctx.beginPath();ctx.arc(lm[i].x*w,lm[i].y*h,5,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,0.9)';ctx.fill()}});
}

// ============= UI 更新 =============
const GESTURE_NAMES={NONE:'等待手势...',OPEN_PALM:'五指张开 · 暂停/播放',FIST:'握拳 · 切换曲目',POINT_UP:'食指上指 · 音量升',POINT_DOWN:'食指下指 · 音量降',PEACE:'剪刀手 · 混响调节',THUMB_LEFT:'拇指左指 · 钢琴独奏',THUMB_RIGHT:'拇指右指 · 鼓独奏'};
const GESTURE_ICONS={NONE:'🤚',OPEN_PALM:'✋',FIST:'✊',POINT_UP:'☝',POINT_DOWN:'👇',PEACE:'✌',THUMB_LEFT:'👈',THUMB_RIGHT:'👉'};
const TRACKS=['钢琴','鼓','贝斯','弦乐'];

function updateUI(){
  const p=params, preset=PRESETS[p.currentPreset];
  document.getElementById('vol-bar').style.width=(p.masterVolume*100)+'%';
  document.getElementById('vol-val').textContent=Math.round(p.masterVolume*100)+'%';
  document.getElementById('tempo-bar').style.width=((p.tempo-0.5)/1.5*100)+'%';
  document.getElementById('tempo-val').textContent=p.tempo.toFixed(2)+'x';
  document.getElementById('reverb-bar').style.width=(p.reverb*100)+'%';
  document.getElementById('reverb-val').textContent=Math.round(p.reverb*100)+'%';
  document.getElementById('preset-display').textContent=preset.name;
  document.getElementById('preset-display').style.color=preset.color;
  const trackIds=['track-piano','track-drums','track-bass','track-strings'];
  trackIds.forEach((id,i)=>{
    const el=document.getElementById(id);
    el.classList.toggle('soloed',p.soloTrack===i);
    const vol=p.soloTrack===-1?p.trackVolumes[i]:(p.soloTrack===i?1.0:0.05);
    el.querySelector('.track-vol-fill').style.width=(vol*100)+'%';
  });
  document.getElementById('btn-play').textContent=p.isPlaying?'⏸':'▶';
  document.getElementById('btn-play').classList.toggle('playing',p.isPlaying);
  document.getElementById('play-status').textContent=p.isPlaying?'播放中':'已暂停';
  document.getElementById('preset-status').textContent=preset.name+' · '+(p.soloTrack>=0?TRACKS[p.soloTrack]+' 独奏':'全乐器');
}

// ============= 主流程 =============
import { HandLandmarker, FilesetResolver } from '@mediapipe/tasks-vision';

let handLandmarker = null;
let videoEl, canvasEl, ctx;
let gestureHistory = {type:'NONE',count:0};
let prevGesture = 'NONE';
let openPalmFrames = 0, fistFrames = 0;
let animFrame = 0;

async function init(){
  initAudio();
  await audioCtx.resume();
  document.getElementById('loading-text').textContent='正在加载手势模型...';

  const vision = await FilesetResolver.forVisionTasks(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.12/wasm'
  );
  handLandmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:'GPU'},
    runningMode:'VIDEO',numHands:2,minHandDetectionConfidence:0.6,minTrackingConfidence:0.5
  });

  document.getElementById('loading-overlay').style.display='none';
  document.getElementById('no-hand').style.display='flex';
  startDetection();
}

function startDetection(){
  const detect = () => {
    if(!videoEl || videoEl.readyState<2){ animFrame=requestAnimationFrame(detect); return; }
    const results = handLandmarker.detectForVideo(videoEl, performance.now());
    if(results.landmarks && results.landmarks.length>0){
      document.getElementById('no-hand').style.display='none';
      const lm = results.landmarks[0];
      const handed = (results.handednesses?.[0]?.[0]?.categoryName==='Left'?'Left':'Right');
      const landmarks = lm.map(l=>({x:l.x,y:l.y,z:l.z}));
      const gType = classifyGesture(landmarks, handed);

      if(gType===gestureHistory.type) gestureHistory.count++;
      else { gestureHistory.type=gType; gestureHistory.count=1; }
      const confirmed = gestureHistory.count>=3 ? gestureHistory.type : 'NONE';

      // 手势处理
      if(confirmed==='OPEN_PALM'){ openPalmFrames++; if(openPalmFrames===15) togglePlay(); }
      else openPalmFrames=0;
      if(confirmed==='FIST'){ fistFrames++; if(fistFrames===20){
        const np=(params.currentPreset+1)%3; const p=PRESETS[np];
        updateParams({currentPreset:np,tempo:p.tempo,trackVolumes:p.vols,reverb:p.reverb});
        fistFrames=0;
      }}else fistFrames=0;
      if(confirmed==='POINT_UP'||confirmed==='POINT_DOWN'){
        const vol=1.0-Math.max(0,Math.min(1,lm[HAND.WRIST].y));
        if(Math.abs(Math.round(vol*100)/100-params.masterVolume)>0.02) updateParams({masterVolume:Math.round(vol*100)/100});
      }
      if(confirmed==='PEACE'){
        const rev=1.0-Math.max(0,Math.min(1,lm[HAND.WRIST].y));
        if(Math.abs(Math.round(rev*100)/100-params.reverb)>0.02) updateParams({reverb:Math.round(rev*100)/100});
      }
      if(confirmed==='THUMB_LEFT'&&prevGesture!=='THUMB_LEFT') updateParams({soloTrack:params.soloTrack===0?-1:0});
      if(confirmed==='THUMB_RIGHT'&&prevGesture!=='THUMB_RIGHT') updateParams({soloTrack:params.soloTrack===1?-1:1});
      prevGesture=confirmed;

      // 更新手势标签
      const gl=document.getElementById('gesture-label');
      gl.textContent=GESTURE_ICONS[confirmed]+' '+GESTURE_NAMES[confirmed];
      gl.classList.toggle('active',confirmed!=='NONE');

      // 绘制骨架
      canvasEl.width=canvasEl.clientWidth; canvasEl.height=canvasEl.clientHeight;
      drawSkeleton(ctx, landmarks, canvasEl.width, canvasEl.height);
    } else {
      document.getElementById('no-hand').style.display='flex';
      gestureHistory={type:'NONE',count:0}; prevGesture='NONE';
      const gl=document.getElementById('gesture-label');
      gl.textContent='🤚 等待手势...'; gl.classList.remove('active');
      ctx.clearRect(0,0,canvasEl.width,canvasEl.height);
    }
    animFrame=requestAnimationFrame(detect);
  };
  detect();
}

// ============= 事件绑定 =============
document.getElementById('btn-start').addEventListener('click', async ()=>{
  document.getElementById('btn-start').disabled=true;
  document.getElementById('btn-start').textContent='加载中...';
  document.getElementById('start-error').style.display='none';
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:{width:{ideal:640},height:{ideal:480},facingMode:'user'},audio:false});
    videoEl = document.getElementById('video');
    videoEl.srcObject = stream;
    await videoEl.play();
    canvasEl = document.getElementById('gesture-canvas');
    ctx = canvasEl.getContext('2d');
    document.getElementById('start-screen').style.display='none';
    document.getElementById('main-layout').style.display='flex';
    await init();
  }catch(e){
    document.getElementById('start-error').style.display='block';
    document.getElementById('start-error').textContent='启动失败: '+(e.message||'未知错误');
    document.getElementById('btn-start').disabled=false;
    document.getElementById('btn-start').textContent='🎛 开始指挥';
  }
});

document.getElementById('btn-play').addEventListener('click', togglePlay);
document.getElementById('btn-guide').addEventListener('click', ()=>{
  const g=document.getElementById('gesture-guide');
  const btn=document.getElementById('btn-guide');
  if(g.style.display==='none'){ g.style.display='block'; btn.textContent='隐藏指南'; }
  else { g.style.display='none'; btn.textContent='手势指南'; }
});
</script>
