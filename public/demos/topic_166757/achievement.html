<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>专注自习室 - 成就</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .nav-header {
      background-color: #FFFFFF;
      padding: 20px 16px 8px;
      text-align: center;
      border-bottom: 1px solid #E8EDEB;
    }
    
    .nav-title {
      font-size: 17px;
      font-weight: 700;
      color: #2C3E50;
    }
    
    .coins-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: linear-gradient(135deg, #FEF5E8 0%, #F2F7F5 100%);
    }
    
    .coins-left {
      display: flex;
      align-items: center;
    }
    
    .coins-icon {
      font-size: 26px;
      margin-right: 10px;
    }
    
    .coins-info {
      display: flex;
      flex-direction: column;
    }
    
    .coins-amount {
      font-size: 18px;
      font-weight: 700;
      color: #E8A87C;
    }
    
    .coins-label {
      font-size: 10px;
      color: #A0AAB4;
    }
    
    .coins-right {
      text-align: right;
    }
    
    .level-badge {
      font-size: 11px;
      font-weight: 600;
      color: #6BB5A8;
      background-color: #FFFFFF;
      padding: 4px 12px;
      border-radius: 10px;
    }
    
    .level-progress-bar {
      width: 80px;
      height: 4px;
      background-color: rgba(255,255,255,0.6);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 3px;
    }
    
    .level-progress-fill {
      height: 100%;
      background-color: #E8A87C;
      border-radius: 2px;
    }
    
    .section-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }
    
    .section-card {
      background-color: #FFFFFF;
      border-radius: 12px;
      padding: 12px 8px;
      text-align: center;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .section-card.active {
      border-color: #6BB5A8;
      background-color: #F2F7F5;
    }
    
    .section-icon {
      font-size: 24px;
      display: block;
      margin-bottom: 6px;
    }
    
    .section-name {
      font-size: 11px;
      color: #2C3E50;
      font-weight: 600;
    }
    
    .tab-content {
      display: none;
    }
    
    .tab-content.active {
      display: block;
    }
    
    .achievement-item {
      display: flex;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #E8EDEB;
    }
    
    .achievement-item:last-child {
      border-bottom: none;
    }
    
    .ach-icon {
      font-size: 20px;
      margin-right: 10px;
      width: 32px;
      text-align: center;
    }
    
    .ach-info {
      flex: 1;
    }
    
    .ach-name {
      font-size: 13px;
      font-weight: 600;
      color: #2C3E50;
      display: block;
      margin-bottom: 3px;
    }
    
    .ach-progress {
      font-size: 10px;
      color: #A0AAB4;
    }
    
    .ach-status {
      margin-left: 10px;
    }
    
    .shop-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    
    .shop-item {
      background-color: #F2F7F5;
      border-radius: 10px;
      padding: 12px 10px;
      text-align: center;
    }
    
    .shop-icon {
      font-size: 22px;
      display: block;
      margin-bottom: 6px;
    }
    
    .shop-name {
      font-size: 12px;
      color: #2C3E50;
      display: block;
      margin-bottom: 4px;
    }
    
    .shop-price {
      font-size: 11px;
      color: #E8A87C;
      display: block;
      margin-bottom: 6px;
    }
    
    .btn-shop {
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      border: none;
      cursor: pointer;
    }
    
    .btn-shop.btn-primary {
      background-color: #6BB5A8;
      color: #FFFFFF;
    }
    
    .btn-shop.btn-disabled {
      background-color: #E8EDEB;
      color: #A0AAB4;
    }
    
    .app-usage-form {
      margin-top: 10px;
    }
    
    .input-row-time {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    
    .input-field-name {
      margin-bottom: 8px;
    }
    
    .input-field-time {
      flex: 1;
    }
    
    .btn-add {
      flex: 1;
      padding: 8px;
      font-size: 12px;
    }
    
    .edit-hint {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    
    .edit-cancel {
      color: #6BB5A8;
      font-size: 11px;
      cursor: pointer;
    }
    
    .usage-item {
      padding: 10px 0;
      border-bottom: 1px solid #E8EDEB;
    }
    
    .usage-item:last-child {
      border-bottom: none;
    }
    
    .usage-info {
      flex: 1;
    }
    
    .usage-name {
      font-size: 13px;
      font-weight: 600;
      color: #2C3E50;
      display: block;
      margin-bottom: 3px;
    }
    
    .usage-time {
      font-size: 10px;
      color: #A0AAB4;
    }
    
    .usage-actions {
      display: flex;
      gap: 14px;
    }
    
    .action-btn {
      font-size: 11px;
      color: #6BB5A8;
      cursor: pointer;
    }
    
    .action-delete {
      color: #E88B8B;
    }
    
    .usage-compare {
      padding-top: 10px;
    }
    
    .usage-verdict {
      font-size: 11px;
      display: block;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="nav-header">
    <div class="nav-title">成就与激励</div>
  </div>
  
  <div class="coins-header">
    <div class="coins-left">
      <span class="coins-icon">🪙</span>
      <div class="coins-info">
        <span class="coins-amount" id="coins">0</span>
        <span class="coins-label">专注币余额</span>
      </div>
    </div>
    <div class="coins-right">
      <span class="level-badge" id="levelBadge">Lv.1</span>
      <div class="level-progress-bar">
        <div class="level-progress-fill" id="levelProgress" style="width: 0%"></div>
      </div>
    </div>
  </div>

  <div class="section-grid">
    <div class="section-card active" onclick="onSwitchTab('achievements')">
      <span class="section-icon">🏆</span>
      <span class="section-name">成就勋章</span>
    </div>
    <div class="section-card" onclick="onSwitchTab('shop')">
      <span class="section-icon">🛍️</span>
      <span class="section-name">专注商店</span>
    </div>
    <div class="section-card" onclick="onSwitchTab('usage')">
      <span class="section-icon">📊</span>
      <span class="section-name">使用报告</span>
    </div>
  </div>
  
  <div class="page-container" id="app">
    <div class="tab-content active" id="achievementsTab">
      <div class="card">
        <div class="achievement-item" id="ach7Days">
          <div class="ach-icon">🔒</div>
          <div class="ach-info">
            <span class="ach-name">连续专注 7 天</span>
            <span class="ach-progress">进度：0/7 天</span>
          </div>
          <div class="ach-status">
            <span class="badge badge-locked">未解锁</span>
          </div>
        </div>

        <div class="achievement-item" id="ach30Days">
          <div class="ach-icon">🔒</div>
          <div class="ach-info">
            <span class="ach-name">连续专注 30 天</span>
            <span class="ach-progress">进度：0/30 天</span>
          </div>
          <div class="ach-status">
            <span class="badge badge-locked">未解锁</span>
          </div>
        </div>

        <div class="achievement-item" id="ach100Hours">
          <div class="ach-icon">🔒</div>
          <div class="ach-info">
            <span class="ach-name">专注大师</span>
            <span class="ach-progress">总专注 100 小时 · 进度：0/100 小时</span>
          </div>
          <div class="ach-status">
            <span class="badge badge-locked">未解锁</span>
          </div>
        </div>

        <div class="achievement-item" id="achDeepFocus">
          <div class="ach-icon">🔒</div>
          <div class="ach-info">
            <span class="ach-name">深度专注者</span>
            <span class="ach-progress">完成10次深度专注 · 进度：0/10</span>
          </div>
          <div class="ach-status">
            <span class="badge badge-locked">未解锁</span>
          </div>
        </div>
      </div>
    </div>

    <div class="tab-content" id="shopTab">
      <div class="card">
        <span class="card-title">用专注币兑换奖励</span>
        <div class="shop-grid">
          <div class="shop-item">
            <span class="shop-icon">🌅</span>
            <span class="shop-name">日出示意图</span>
            <span class="shop-price">50 币</span>
            <button class="btn-shop btn-disabled" id="buySunrise">不足</button>
          </div>
          <div class="shop-item">
            <span class="shop-icon">🌊</span>
            <span class="shop-name">海洋星空</span>
            <span class="shop-price">50 币</span>
            <button class="btn-shop btn-disabled" id="buyOcean">不足</button>
          </div>
          <div class="shop-item">
            <span class="shop-icon">🌧️</span>
            <span class="shop-name">雨声白噪音</span>
            <span class="shop-price">30 币</span>
            <button class="btn-shop btn-disabled" id="buyRain">不足</button>
          </div>
          <div class="shop-item">
            <span class="shop-icon">☕</span>
            <span class="shop-name">咖啡厅音效</span>
            <span class="shop-price">30 币</span>
            <button class="btn-shop btn-disabled" id="buyCafe">不足</button>
          </div>
        </div>
      </div>
    </div>

    <div class="tab-content" id="usageTab">
      <div class="card">
        <span class="card-title">记录APP使用时长</span>

        <div class="app-usage-form">
          <div id="editHint" style="display: none;" class="edit-hint">
            <span class="text-small text-muted">正在编辑：<span id="editingAppName"></span></span>
            <span class="edit-cancel" onclick="onCancelEdit()">取消</span>
          </div>
          <input
            class="input-field-name"
            placeholder="APP名称"
            id="appNameInput"
          />
          <div class="input-row-time">
            <input
              class="input-field-time"
              placeholder="分钟"
              type="number"
              id="appMinutesInput"
            />
            <button class="btn-primary btn-add" onclick="onAddAppUsage()">添加</button>
          </div>
        </div>

        <div id="usageList"></div>

        <div id="usageEmpty" class="empty-state mt-10">
          <span class="text-small text-muted">点击上方添加APP使用记录</span>
        </div>
      </div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab-item" onclick="switchTab('index.html')">
      <span class="tab-icon">🎯</span>
      <span class="tab-text">专注</span>
    </div>
    <div class="tab-item" onclick="switchTab('stats.html')">
      <span class="tab-icon">📊</span>
      <span class="tab-text">统计</span>
    </div>
    <div class="tab-item active" onclick="switchTab('achievement.html')">
      <span class="tab-icon">🏆</span>
      <span class="tab-text">成就</span>
    </div>
    <div class="tab-item" onclick="switchTab('room.html')">
      <span class="tab-icon">👥</span>
      <span class="tab-text">结伴</span>
    </div>
  </div>

  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script>
    let appUsageList = []
    let editingId = null

    function loadData() {
      const userData = store.userData
      
      document.getElementById('coins').textContent = userData.coins
      
      const level = Util.calcLevel(userData.totalFocusMinutes)
      document.getElementById('levelBadge').textContent = `Lv.${level}`
      
      const coinsRemaining = 100 - (userData.coins % 100)
      const progress = ((userData.coins % 100) / 100) * 100
      document.getElementById('levelProgress').style.width = `${progress}%`
      
      const consecutiveDays = userData.consecutiveDays
      const totalFocusHours = Math.floor(userData.totalFocusMinutes / 60)
      const deepFocusCount = store.records.filter(r => r.isDeepFocus && r.isSuccess).length
      
      updateAchievement('ach7Days', consecutiveDays >= 7, consecutiveDays, 7, '🔥')
      updateAchievement('ach30Days', consecutiveDays >= 30, consecutiveDays, 30, '⭐')
      updateAchievement('ach100Hours', totalFocusHours >= 100, totalFocusHours, 100, '👑')
      updateAchievement('achDeepFocus', deepFocusCount >= 10, deepFocusCount, 10, '🧘')
      
      updateShopButtons(userData.coins)
      
      loadAppUsage()
    }

    function onSwitchTab(tab) {
      document.querySelectorAll('.section-card').forEach(t => t.classList.remove('active'))
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'))
      
      event.currentTarget.classList.add('active')
      document.getElementById(`${tab}Tab`).classList.add('active')
    }

    function updateAchievement(id, unlocked, current, target, icon) {
      const item = document.getElementById(id)
      const iconEl = item.querySelector('.ach-icon')
      const progressEl = item.querySelector('.ach-progress')
      const statusEl = item.querySelector('.badge')
      
      if (unlocked) {
        item.classList.remove('locked')
        item.classList.add('unlocked')
        iconEl.textContent = icon
        statusEl.textContent = '已解锁'
        statusEl.className = 'badge badge-unlocked'
      } else {
        item.classList.remove('unlocked')
        item.classList.add('locked')
        iconEl.textContent = '🔒'
        statusEl.textContent = '未解锁'
        statusEl.className = 'badge badge-locked'
      }
      
      if (id === 'ach100Hours') {
        progressEl.textContent = `总专注 100 小时 · 进度：${current}/100 小时`
      } else if (id === 'achDeepFocus') {
        progressEl.textContent = `完成10次深度专注 · 进度：${current}/10`
      } else {
        progressEl.textContent = `进度：${current}/${target} 天`
      }
    }

    function updateShopButtons(coins) {
      updateShopButton('buySunrise', coins >= 50)
      updateShopButton('buyOcean', coins >= 50)
      updateShopButton('buyRain', coins >= 30)
      updateShopButton('buyCafe', coins >= 30)
    }

    function updateShopButton(id, canBuy) {
      const btn = document.getElementById(id)
      if (canBuy) {
        btn.className = 'btn-shop btn-primary'
        btn.textContent = '兑换'
        btn.onclick = () => onBuy(id.replace('buy', ''))
      } else {
        btn.className = 'btn-shop btn-disabled'
        btn.textContent = '不足'
        btn.onclick = null
      }
    }

    function onBuy(item) {
      const prices = {
        Sunrise: 50,
        Ocean: 50,
        Rain: 30,
        Cafe: 30
      }
      const names = {
        Sunrise: '日出示意图',
        Ocean: '海洋星空',
        Rain: '雨声白噪音',
        Cafe: '咖啡厅音效'
      }
      
      const price = prices[item]
      if (store.userData.coins >= price) {
        Util.showModal({
          title: '确认兑换',
          content: `确定用 ${price} 专注币兑换 ${names[item]} 吗？`,
          confirmText: '兑换',
          cancelText: '取消'
        }).then(res => {
          if (res.confirm) {
            store.userData.coins -= price
            store.saveUserData()
            Util.showToast(`兑换成功！获得 ${names[item]}`)
            loadData()
          }
        })
      }
    }

    function loadAppUsage() {
      const stored = localStorage.getItem('appUsageList')
      if (stored) {
        appUsageList = JSON.parse(stored)
      }
      updateAppUsageUI()
    }

    function saveAppUsage() {
      localStorage.setItem('appUsageList', JSON.stringify(appUsageList))
      updateAppUsageUI()
    }

    function updateAppUsageUI() {
      const list = document.getElementById('usageList')
      const empty = document.getElementById('usageEmpty')
      
      if (appUsageList.length === 0) {
        list.innerHTML = ''
        empty.style.display = 'block'
        return
      }
      
      empty.style.display = 'none'
      
      const today = Util.getToday()
      const todayRecords = store.records.filter(r => r.date === today && r.isSuccess)
      const todayFocusMinutes = todayRecords.reduce((sum, r) => sum + r.duration, 0)
      const totalPhoneMinutes = appUsageList.reduce((sum, item) => sum + item.minutes, 0)
      
      list.innerHTML = appUsageList.map(item => {
        const percent = todayFocusMinutes > 0 ? (item.minutes / todayFocusMinutes) * 100 : 0
        return `
          <div class="usage-item">
            <div class="flex-between">
              <div class="usage-info">
                <span class="usage-name">${item.name}</span>
                <span class="usage-time">${item.minutes} 分钟</span>
              </div>
              <div class="usage-actions">
                <span class="action-btn" onclick="onEditAppUsage('${item.id}')">编辑</span>
                <span class="action-btn action-delete" onclick="onDeleteAppUsage('${item.id}')">删除</span>
              </div>
            </div>
            <div class="progress-bar mt-6">
              <div class="progress-fill ${item.minutes > todayFocusMinutes ? 'danger-fill' : ''}" style="width: ${Math.min(100, percent)}%"></div>
            </div>
          </div>
        `
      }).join('') + `
        <div class="divider"></div>
        <div class="usage-compare">
          <span class="text-small text-muted">手机使用总计：${totalPhoneMinutes} 分钟</span>
          <div class="mt-6"></div>
          <span class="text-small text-muted">今日专注总计：${todayFocusMinutes} 分钟</span>
          <div class="mt-6"></div>
          <span class="usage-verdict ${totalPhoneMinutes <= todayFocusMinutes ? 'accent-text' : ''}" style="${totalPhoneMinutes > todayFocusMinutes ? 'color:#E88B8B' : ''}">
            ${totalPhoneMinutes <= todayFocusMinutes ? '👍 专注时间多于手机使用，继续保持！' : '⚠️ 手机使用时间超过专注时间'}
          </span>
        </div>
      `
    }

    function onAddAppUsage() {
      const name = document.getElementById('appNameInput').value.trim()
      const minutes = parseInt(document.getElementById('appMinutesInput').value)
      
      if (!name) {
        Util.showToast('请输入APP名称')
        return
      }
      
      if (isNaN(minutes) || minutes <= 0) {
        Util.showToast('请输入有效的分钟数')
        return
      }
      
      if (editingId) {
        const index = appUsageList.findIndex(item => item.id === editingId)
        if (index !== -1) {
          appUsageList[index] = { ...appUsageList[index], name, minutes }
        }
        editingId = null
      } else {
        appUsageList.push({
          id: Util.generateId(),
          name,
          minutes,
          percent: 0
        })
      }
      
      saveAppUsage()
      clearInputs()
      document.getElementById('editHint').style.display = 'none'
    }

    function onEditAppUsage(id) {
      const item = appUsageList.find(item => item.id === id)
      if (item) {
        editingId = id
        document.getElementById('appNameInput').value = item.name
        document.getElementById('appMinutesInput').value = item.minutes
        document.getElementById('editingAppName').textContent = item.name
        document.getElementById('editHint').style.display = 'flex'
      }
    }

    function onCancelEdit() {
      editingId = null
      clearInputs()
      document.getElementById('editHint').style.display = 'none'
    }

    function onDeleteAppUsage(id) {
      Util.showModal({
        title: '确认删除',
        content: '确定要删除这条记录吗？',
        confirmText: '删除',
        cancelText: '取消'
      }).then(res => {
        if (res.confirm) {
          appUsageList = appUsageList.filter(item => item.id !== id)
          saveAppUsage()
        }
      })
    }

    function clearInputs() {
      document.getElementById('appNameInput').value = ''
      document.getElementById('appMinutesInput').value = ''
    }

    function switchTab(url) {
      Util.switchTab(url)
    }

    window.addEventListener('load', loadData)
  </script>
</body>
</html>
