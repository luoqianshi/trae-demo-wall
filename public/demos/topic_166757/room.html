<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>专注自习室 - 结伴</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .nav-header {
      background-color: #FFFFFF;
      padding: 16px 14px 6px;
      text-align: center;
      border-bottom: 1px solid #E8EDEB;
    }
    
    .nav-title {
      font-size: 16px;
      font-weight: 700;
      color: #2C3E50;
    }
    
    .room-header {
      text-align: center;
      padding: 20px 14px;
    }
    
    .room-welcome-icon {
      font-size: 44px;
      display: block;
      margin-bottom: 10px;
    }
    
    .room-welcome-title {
      font-size: 17px;
      font-weight: 600;
      color: #2C3E50;
      display: block;
      margin-bottom: 6px;
    }
    
    .room-welcome-desc {
      font-size: 11px;
      color: #A0AAB4;
    }
    
    .room-title {
      font-size: 14px;
      font-weight: 600;
      color: #2C3E50;
    }
    
    .room-code {
      font-size: 12px;
      color: #6BB5A8;
      font-family: 'Menlo', 'Consolas', monospace;
    }
    
    .btn-share {
      background-color: #6BB5A8;
      color: #FFFFFF;
      border: none;
      padding: 6px 16px;
      border-radius: 8px;
      font-size: 11px;
      cursor: pointer;
    }
    
    .my-status {
      background: linear-gradient(135deg, #E8F5F1 0%, #F2F7F5 100%);
    }
    
    .member-item {
      display: flex;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #E8EDEB;
    }
    
    .member-item:last-child {
      border-bottom: none;
    }
    
    .member-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      margin-right: 10px;
    }
    
    .avatar-placeholder {
      background-color: #E8F5F1;
    }
    
    .avatar-text {
      font-size: 14px;
      color: #6BB5A8;
      font-weight: 700;
    }
    
    .member-name {
      font-size: 13px;
      font-weight: 600;
      color: #2C3E50;
      display: block;
      margin-bottom: 3px;
    }
    
    .member-status {
      font-size: 10px;
    }
    
    .log-item {
      padding: 8px 0;
      border-bottom: 1px solid #E8EDEB;
    }
    
    .log-item:last-child {
      border-bottom: none;
    }
    
    .distracted-text {
      color: #E88B8B;
    }
    
    .join-code-input {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="nav-header">
    <div class="nav-title">自习结伴</div>
  </div>
  
  <div class="page-container" id="app">
    <div id="notInRoom">
      <div class="room-header">
        <span class="room-welcome-icon">👥</span>
        <span class="room-welcome-title">自习结伴</span>
        <span class="room-welcome-desc">和好友一起专注，互相监督</span>
      </div>

      <div class="card">
        <span class="card-title">创建房间</span>
        <span class="card-subtitle">创建后生成房间号，分享给好友加入</span>
        <button class="btn-primary mt-14" onclick="onCreateRoom()" style="width:100%">创建自习房间</button>
      </div>

      <div class="card">
        <span class="card-title">加入房间</span>
        <input
          class="join-code-input"
          placeholder="输入6位房间号"
          id="joinCodeInput"
          maxlength="6"
        />
        <button class="btn-outline mt-14" onclick="onJoinRoom()" style="width:100%">加入房间</button>
      </div>
    </div>

    <div id="inRoom" style="display: none;">
      <div class="card">
        <div class="flex-between">
          <span class="room-title">自习房间</span>
          <span class="room-code">房间号：<span id="roomIdDisplay"></span></span>
        </div>
        <div class="flex-between mt-14">
          <span class="text-small text-muted"><span id="memberCount">0</span> 人在线</span>
          <button class="btn-share" onclick="onShareRoom()">分享房间</button>
        </div>
      </div>

      <div class="my-status card">
        <div class="flex-between">
          <span>我的状态</span>
          <span id="myStatusText" class="text-muted">⚪ 离线</span>
        </div>
        <button
          class="btn-primary mt-14"
          id="toggleOnlineBtn"
          onclick="onToggleOnline()"
          style="width:100%"
        >开始专注</button>
      </div>

      <div class="card">
        <span class="card-title">房间成员</span>
        <div id="memberList"></div>
        <div id="emptyMembers" class="empty-state">
          <span class="text-muted">暂无成员</span>
        </div>
      </div>

      <div class="card">
        <span class="card-title">房间动态</span>
        <div id="activityLog"></div>
        <div id="emptyLog" class="empty-state">
          <span class="text-muted">暂无动态</span>
        </div>
      </div>

      <div class="mt-20 mb-20">
        <button class="btn-outline" onclick="onLeaveRoom()" style="width: 100%">离开房间</button>
      </div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab-item" onclick="switchTab('index.html')">
      <span class="tab-icon">🎯</span>
      <span class="tab-text">专注</span>
    </div>
    <div class="tab-item" onclick="switchTab('stats.html')">
      <span class="tab-icon">📊</span>
      <span class="tab-text">统计</span>
    </div>
    <div class="tab-item" onclick="switchTab('achievement.html')">
      <span class="tab-icon">🏆</span>
      <span class="tab-text">成就</span>
    </div>
    <div class="tab-item active" onclick="switchTab('room.html')">
      <span class="tab-icon">👥</span>
      <span class="tab-text">结伴</span>
    </div>
  </div>

  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script>
    function loadData() {
      if (store.roomData) {
        showInRoom()
      } else {
        showNotInRoom()
      }
    }

    function showNotInRoom() {
      document.getElementById('notInRoom').style.display = 'block'
      document.getElementById('inRoom').style.display = 'none'
    }

    function showInRoom() {
      document.getElementById('notInRoom').style.display = 'none'
      document.getElementById('inRoom').style.display = 'block'
      
      const roomData = store.roomData
      document.getElementById('roomIdDisplay').textContent = roomData.roomId
      document.getElementById('memberCount').textContent = roomData.members.length
      
      updateMemberList()
      updateActivityLog()
      updateMyStatus()
    }

    function updateMemberList() {
      const list = document.getElementById('memberList')
      const empty = document.getElementById('emptyMembers')
      const members = store.roomData.members
      
      if (members.length === 0) {
        list.innerHTML = ''
        empty.style.display = 'block'
        return
      }
      
      empty.style.display = 'none'
      
      list.innerHTML = members.map(member => {
        return `
          <div class="member-item">
            <div class="flex-center">
              ${member.avatarUrl ? 
                `<img class="member-avatar" src="${member.avatarUrl}" />` : 
                `<div class="member-avatar avatar-placeholder flex-center-full"><span class="avatar-text">${member.nickName ? member.nickName[0] : '?'}</span></div>`
              }
              <div>
                <span class="member-name">${member.nickName || '匿名用户'}</span>
                <span class="member-status text-small ${member.isOnline ? 'accent-text' : member.distracted ? 'text-danger' : 'text-muted'}">
                  ${member.isOnline ? '专注中' : member.distracted ? '分心了！' : '离线'}
                </span>
              </div>
            </div>
          </div>
        `
      }).join('')
    }

    function updateActivityLog() {
      const log = document.getElementById('activityLog')
      const empty = document.getElementById('emptyLog')
      const logs = store.roomData.activityLog
      
      if (logs.length === 0) {
        log.innerHTML = ''
        empty.style.display = 'block'
        return
      }
      
      empty.style.display = 'none'
      
      log.innerHTML = logs.map(item => {
        return `
          <div class="log-item">
            <span class="text-small ${item.type === 'distracted' ? 'distracted-text' : 'text-muted'}">
              ${item.message}
            </span>
          </div>
        `
      }).join('')
      
      log.scrollTop = log.scrollHeight
    }

    function updateMyStatus() {
      const member = store.roomData.members.find(m => m.nickName === '我')
      if (member) {
        const statusText = document.getElementById('myStatusText')
        const btn = document.getElementById('toggleOnlineBtn')
        
        if (member.isOnline) {
          statusText.textContent = '🟢 在线专注中'
          statusText.className = 'accent-text'
          btn.textContent = '结束专注'
          btn.className = 'btn-danger mt-14'
        } else {
          statusText.textContent = '⚪ 离线'
          statusText.className = 'text-muted'
          btn.textContent = '开始专注'
          btn.className = 'btn-primary mt-14'
        }
      }
    }

    function onCreateRoom() {
      const roomId = store.createRoom()
      Util.showToast(`房间创建成功！房间号：${roomId}`)
      showInRoom()
    }

    function onJoinRoom() {
      const code = document.getElementById('joinCodeInput').value.trim()
      if (!code || code.length !== 6) {
        Util.showToast('请输入6位房间号')
        return
      }
      
      store.joinRoom(code)
      Util.showToast(`已加入房间 ${code}`)
      showInRoom()
    }

    function onShareRoom() {
      const roomId = store.roomData.roomId
      navigator.clipboard.writeText(`一起来专注自习室吧！房间号：${roomId}`).then(() => {
        Util.showToast('房间号已复制到剪贴板')
      }).catch(() => {
        Util.showToast('复制失败，请手动复制')
      })
    }

    function onToggleOnline() {
      const member = store.roomData.members.find(m => m.nickName === '我')
      if (member) {
        const newStatus = !member.isOnline
        store.toggleOnline(newStatus)
        updateMyStatus()
        updateMemberList()
        updateActivityLog()
        
        Util.showToast(newStatus ? '已开始专注' : '已结束专注')
      }
    }

    function onLeaveRoom() {
      Util.showModal({
        title: '确认离开',
        content: '确定要离开这个房间吗？',
        confirmText: '离开',
        cancelText: '取消'
      }).then(res => {
        if (res.confirm) {
          store.leaveRoom()
          Util.showToast('已离开房间')
          showNotInRoom()
        }
      })
    }

    function switchTab(url) {
      Util.switchTab(url)
    }

    window.addEventListener('load', loadData)
  </script>
</body>
</html>
