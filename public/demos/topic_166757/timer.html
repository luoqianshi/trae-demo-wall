<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>专注自习室 - 计时器</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .nav-header {
      background-color: #FFFFFF;
      padding: 16px 14px 6px;
      text-align: center;
      border-bottom: 1px solid #E8EDEB;
      position: relative;
    }
    
    .nav-title {
      font-size: 16px;
      font-weight: 700;
      color: #2C3E50;
    }
    
    .back-btn {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      cursor: pointer;
      color: #A0AAB4;
    }
    
    .timer-container {
      padding: 10px;
    }
    
    .timer-display {
      text-align: center;
      padding: 14px 0;
    }
    
    .photo-prompt {
      background-color: #FEF5E8;
      margin-bottom: 10px;
      border-radius: 12px;
      padding: 12px;
    }
    
    .photo-prompt.photo-done {
      background-color: #E8F5F1;
    }
    
    .photo-text {
      font-size: 12px;
      color: #E8A87C;
    }
    
    .photo-done .photo-text {
      color: #6BB5A8;
    }
    
    .photo-btn {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      font-size: 12px;
    }
    
    .timer-clock {
      margin: 16px 0;
    }
    
    .timer-number {
      font-size: 40px;
      font-weight: 300;
      font-family: 'Menlo', 'Consolas', 'Courier New', monospace;
      color: #2C3E50;
      letter-spacing: 2px;
    }
    
    .timer-mode-badge {
      display: inline-flex;
      align-items: center;
      background-color: #F2F7F5;
      padding: 6px 16px;
      border-radius: 16px;
      margin-bottom: 10px;
    }
    
    .mode-icon {
      font-size: 16px;
      margin-right: 6px;
    }
    
    .mode-text {
      font-size: 12px;
      color: #6BB5A8;
      font-weight: 600;
    }
    
    .timer-status {
      font-size: 12px;
    }
    
    .cooling-text {
      color: #E8A87C;
    }
    
    .timer-progress {
      margin-top: 14px;
    }
    
    .timer-controls {
      margin-top: 16px;
    }
    
    .control-row {
      display: flex;
      gap: 10px;
    }
    
    .control-btn {
      flex: 1;
    }
    
    .start-btn {
      width: 100%;
      padding: 12px;
      font-size: 14px;
    }
    
    .cooling-info {
      text-align: center;
      padding: 14px;
      background-color: #FEF5E8;
      border-radius: 12px;
    }
    
    .cooling-msg {
      font-size: 13px;
      color: #E8A87C;
      display: block;
      margin-bottom: 6px;
    }
    
    .cooling-elapsed {
      font-size: 11px;
      color: #5A6C7A;
      display: block;
    }
    
    .finish-section {
      text-align: center;
      padding: 16px;
    }
    
    .finish-icon {
      font-size: 40px;
      display: block;
      margin-bottom: 10px;
    }
    
    .fail-icon {
      font-size: 40px;
      display: block;
      margin-bottom: 10px;
    }
    
    .finish-text {
      font-size: 17px;
      font-weight: 700;
      color: #2C3E50;
      display: block;
      margin-bottom: 8px;
    }
    
    .finish-stats {
      font-size: 12px;
      color: #A0AAB4;
      display: block;
      margin-bottom: 8px;
    }
    
    .finish-coins {
      font-size: 13px;
      color: #6BB5A8;
      display: block;
      margin-bottom: 10px;
    }
    
    .aux-tools {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 14px;
      padding-bottom: 14px;
    }
    
    .tool-item {
      font-size: 12px;
      color: #5A6C7A;
      padding: 8px 18px;
      background-color: #FFFFFF;
      border-radius: 16px;
      border: 1px solid #E8EDEB;
      cursor: pointer;
    }
    
    .tool-item:active {
      background-color: #F2F7F5;
    }
    
    .photo-compare {
      margin-top: 10px;
    }
    
    .photo-box {
      flex: 1;
      text-align: center;
    }
    
    .photo-thumb {
      width: 100%;
      height: 80px;
      border-radius: 10px;
      object-fit: cover;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="nav-header">
    <span class="back-btn" onclick="goBack()">←</span>
    <div class="nav-title">专注计时</div>
  </div>
  
  <div class="page-container timer-container" id="app">
    <div class="timer-display">
      <div class="photo-prompt" id="photoPrompt" style="display: none;">
        <span class="photo-text">📸 请先拍照记录开始状态</span>
        <button class="btn-outline photo-btn" onclick="onTakeStartPhoto()">拍照打卡</button>
      </div>

      <div class="photo-prompt photo-done" id="photoDone" style="display: none;">
        <span class="photo-text">✅ 开始照片已记录</span>
      </div>

      <div class="timer-clock">
        <span class="timer-number" id="displayTime">25:00</span>
      </div>

      <div class="timer-mode-badge">
        <span class="mode-icon" id="modeIcon">🍅</span>
        <span class="mode-text" id="modeName">番茄专注</span>
      </div>

      <div class="timer-status text-center mt-10">
        <span id="statusText" class="text-muted">准备开始</span>
      </div>

      <div class="timer-progress" id="progressSection" style="display: none;">
        <div class="flex-between">
          <span class="text-small text-muted">已坚持 <span id="elapsedText">0分钟</span></span>
          <span class="text-small text-muted">目标 <span id="targetText">25分钟</span></span>
        </div>
        <div class="progress-bar mt-6">
          <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <div class="timer-controls">
      <div id="idleState">
        <button class="btn-primary start-btn" onclick="onStart()">开始专注</button>
      </div>

      <div id="runningState" style="display: none;" class="control-row">
        <button class="btn-outline control-btn" onclick="onPause()">暂停</button>
        <button class="btn-danger control-btn" onclick="onConfirmEnd()">结束</button>
      </div>

      <div id="pausedState" style="display: none;" class="control-row">
        <button class="btn-primary control-btn" onclick="onResume()">继续</button>
        <button class="btn-danger control-btn" onclick="onConfirmEnd()">结束</button>
      </div>

      <div id="coolingState" style="display: none;" class="cooling-info">
        <span class="cooling-msg">正在退出中，请稍候···</span>
        <span class="cooling-elapsed">已坚持 <span id="coolingElapsed">0分钟</span>，别放弃！</span>
        <button class="btn-outline control-btn mt-14" onclick="onCancelCoolDown()">不退了，继续</button>
      </div>

      <div id="finishedState" style="display: none;" class="finish-section">
        <div id="needEndPhoto" style="display: none;">
          <button class="btn-primary start-btn" onclick="onTakeEndPhoto()">拍照核验</button>
        </div>
        <div id="finishContent" style="display: none;">
          <span class="finish-icon">🎉</span>
          <span class="finish-text">专注完成！</span>
          <span class="finish-stats text-muted">本次专注 <span id="finishElapsed">0分钟</span></span>
          <span class="finish-coins accent-text" id="finishCoins">+0 专注币</span>
          <button class="btn-primary control-btn mt-20" onclick="onBackHome()">返回首页</button>
        </div>
      </div>

      <div id="failedState" style="display: none;" class="finish-section">
        <span class="fail-icon">💔</span>
        <span class="finish-text">专注中断</span>
        <span class="finish-stats text-muted">已坚持 <span id="failElapsed">0分钟</span></span>
        <span class="text-small text-muted">别灰心，下次一定行！</span>
        <button class="btn-primary control-btn mt-20" onclick="onBackHome()">返回首页</button>
      </div>
    </div>

    <div class="aux-tools" id="auxTools" style="display: none;">
      <div class="tool-item" onclick="onToggleAudio()">
        <span id="audioIcon">🔇</span> 白噪音
      </div>
      <div class="tool-item" onclick="onQuickMemo()">
        <span>📝 记杂念</span>
      </div>
    </div>

    <div class="photo-compare card" id="photoCompare" style="display: none;">
      <div class="flex-between">
        <div class="photo-box">
          <span class="text-small text-muted">开始前</span>
          <img id="startPhotoImg" src="" mode="aspectFill" class="photo-thumb">
        </div>
        <span class="accent-text">→</span>
        <div class="photo-box">
          <span class="text-small text-muted">结束后</span>
          <img id="endPhotoImg" src="" mode="aspectFill" class="photo-thumb">
        </div>
      </div>
    </div>
  </div>

  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script>
    const state = {
      mode: '',
      modeName: '',
      modeIcon: '',
      targetMinutes: 25,
      targetSeconds: 0,
      remainingSeconds: 0,
      displayTime: '00:00',
      elapsedSeconds: 0,
      elapsedText: '0分钟',
      targetText: '25分钟',
      progressPercent: 0,
      status: 'idle',
      timerInterval: null,
      startTimestamp: 0,
      coolDownSeconds: 30,
      coolDownTimer: null,
      needsPhoto: true,
      startPhoto: '',
      endPhoto: '',
      isDeepFocus: true,
      earnedCoins: 0,
      hasSwitched: false,
      isPlayingAudio: false
    }

    function init() {
      const query = Util.parseQueryString()
      const mode = query.mode || 'pomodoro'
      const duration = parseInt(query.duration) || 25
      
      state.mode = mode
      state.targetMinutes = duration
      state.targetSeconds = duration * 60
      state.remainingSeconds = state.targetSeconds
      state.displayTime = Util.formatTime(state.targetSeconds)
      state.targetText = Util.formatMinutes(duration)
      state.modeName = Util.getModeName(mode)
      state.modeIcon = Util.getModeIcon(mode)

      updateUI()
    }

    function updateUI() {
      document.getElementById('displayTime').textContent = state.displayTime
      document.getElementById('modeIcon').textContent = state.modeIcon
      document.getElementById('modeName').textContent = state.modeName
      document.getElementById('elapsedText').textContent = state.elapsedText
      document.getElementById('targetText').textContent = state.targetText
      document.getElementById('progressFill').style.width = `${state.progressPercent}%`
      
      updateStatusText()
      updateVisibility()
    }

    function updateStatusText() {
      const statusText = document.getElementById('statusText')
      switch(state.status) {
        case 'idle':
          statusText.textContent = '准备开始'
          statusText.className = 'text-muted'
          break
        case 'running':
          statusText.textContent = '专注中···'
          statusText.className = 'accent-text pulse'
          break
        case 'paused':
          statusText.textContent = '已暂停'
          statusText.className = 'text-muted'
          break
        case 'cooling':
          statusText.textContent = `冷静期 ${state.coolDownSeconds}s`
          statusText.className = 'cooling-text'
          break
      }
    }

    function updateVisibility() {
      document.getElementById('idleState').style.display = state.status === 'idle' ? 'block' : 'none'
      document.getElementById('runningState').style.display = state.status === 'running' ? 'block' : 'none'
      document.getElementById('pausedState').style.display = state.status === 'paused' ? 'block' : 'none'
      document.getElementById('coolingState').style.display = state.status === 'cooling' ? 'block' : 'none'
      document.getElementById('finishedState').style.display = state.status === 'finished' ? 'block' : 'none'
      document.getElementById('failedState').style.display = state.status === 'failed' ? 'block' : 'none'
      document.getElementById('progressSection').style.display = state.status !== 'idle' ? 'block' : 'none'
      document.getElementById('auxTools').style.display = state.status === 'running' ? 'flex' : 'none'
      
      if (state.status === 'finished') {
        document.getElementById('needEndPhoto').style.display = state.needsPhoto && !state.endPhoto ? 'block' : 'none'
        document.getElementById('finishContent').style.display = !state.needsPhoto || state.endPhoto ? 'block' : 'none'
      }
    }

    function onStart() {
      Util.showModal({
        title: '即将开始专注',
        content: '请将手机放入抽屉或另一房间，远离干扰！',
        confirmText: '我准备好了',
        cancelText: '再等等'
      }).then(res => {
        if (res.confirm) {
          _doStart()
        }
      })
    }

    function _doStart() {
      const now = Date.now()
      state.status = 'running'
      state.startTimestamp = now
      state.isDeepFocus = true
      state.hasSwitched = false

      store.isTiming = true
      store.currentMode = state.mode
      store.timerStartTime = now

      const interval = setInterval(() => {
        _tick()
      }, 1000)
      state.timerInterval = interval

      updateUI()
    }

    function _tick() {
      if (state.status !== 'running') return

      const now = Date.now()
      const elapsedTotal = Math.floor((now - state.startTimestamp) / 1000)
      const remaining = Math.max(0, state.targetSeconds - elapsedTotal)

      state.remainingSeconds = remaining
      state.displayTime = Util.formatTime(remaining)
      state.elapsedSeconds = elapsedTotal
      state.elapsedText = Util.formatMinutes(Math.floor(elapsedTotal / 60))
      state.progressPercent = Math.min(100, Math.floor((elapsedTotal / state.targetSeconds) * 100))

      updateUI()

      if (remaining <= 0) {
        _finish(true)
      }
    }

    function onPause() {
      if (state.status !== 'running') return
      _clearTimer()
      state.status = 'paused'
      updateUI()
    }

    function onResume() {
      if (state.status !== 'paused') return

      const elapsed = state.elapsedSeconds
      const newStart = Date.now() - elapsed * 1000

      state.status = 'running'
      state.startTimestamp = newStart

      store.timerStartTime = newStart

      const interval = setInterval(() => {
        _tick()
      }, 1000)
      state.timerInterval = interval

      updateUI()
    }

    function onConfirmEnd() {
      Util.showModal({
        title: '确定要结束吗？',
        content: '结束专注将进入30秒冷静期',
        confirmText: '确定结束',
        cancelText: '继续专注',
        confirmColor: '#E88B8B'
      }).then(res => {
        if (res.confirm) {
          _startCoolDown()
        }
      })
    }

    function _startCoolDown() {
      _clearTimer()
      state.status = 'cooling'
      state.coolDownSeconds = 30

      const coolTimer = setInterval(() => {
        if (state.coolDownSeconds <= 1) {
          clearInterval(coolTimer)
          state.coolDownTimer = null
          _finish(false)
        } else {
          state.coolDownSeconds--
          updateStatusText()
          document.getElementById('coolingElapsed').textContent = state.elapsedText
        }
      }, 1000)
      state.coolDownTimer = coolTimer

      document.getElementById('coolingElapsed').textContent = state.elapsedText
      updateUI()
    }

    function onCancelCoolDown() {
      if (state.coolDownTimer) {
        clearInterval(state.coolDownTimer)
      }
      state.coolDownTimer = null

      const elapsed = state.elapsedSeconds
      const newStart = Date.now() - elapsed * 1000
      state.status = 'running'
      state.startTimestamp = newStart
      store.timerStartTime = newStart

      const interval = setInterval(() => {
        _tick()
      }, 1000)
      state.timerInterval = interval

      updateUI()
    }

    function _finish(isComplete) {
      _clearTimer()
      _clearCoolDown()

      const minutes = Math.floor(state.elapsedSeconds / 60)
      const isDeep = state.isDeepFocus && !state.hasSwitched

      if (isComplete) {
        let coins = Math.floor(minutes / 5)
        if (isDeep) {
          coins = Math.floor(coins * 1.5)
        }

        state.status = 'finished'
        state.isDeepFocus = isDeep
        state.earnedCoins = coins

        store.userData.totalFocusMinutes += minutes
        if (minutes > store.userData.deepestFocusMinutes) {
          store.userData.deepestFocusMinutes = minutes
        }
        store.userData.coins += coins
        store.userData.totalSuccess++
        store.updateConsecutiveDays()
        store.saveUserData()

        const record = {
          id: Util.generateId(),
          date: Util.getToday(),
          mode: state.mode,
          duration: minutes,
          isSuccess: true,
          isDeepFocus: isDeep,
          startTime: Util.formatDateTime(state.startTimestamp),
          endTime: Util.formatDateTime(Date.now())
        }
        store.addRecord(record)

        document.getElementById('finishElapsed').textContent = Util.formatMinutes(minutes)
        document.getElementById('finishCoins').textContent = isDeep ? `🏆 深度专注 +${coins} 专注币` : `+${coins} 专注币`
      } else {
        state.status = 'failed'
        state.earnedCoins = 0

        store.userData.totalFocusMinutes += minutes
        store.userData.totalFail++
        store.updateConsecutiveDays()
        store.saveUserData()

        const record = {
          id: Util.generateId(),
          date: Util.getToday(),
          mode: state.mode,
          duration: minutes,
          isSuccess: false,
          isDeepFocus: isDeep,
          startTime: Util.formatDateTime(state.startTimestamp),
          endTime: Util.formatDateTime(Date.now())
        }
        store.addRecord(record)

        document.getElementById('failElapsed').textContent = Util.formatMinutes(minutes)
      }

      store.isTiming = false
      store.currentMode = ''
      store.timerStartTime = null

      updateUI()
    }

    function onInterrupt() {
      _clearTimer()
      _clearCoolDown()
      state.status = 'failed'
      state.isDeepFocus = false
      state.hasSwitched = true
      state.earnedCoins = 0

      const minutes = Math.floor(state.elapsedSeconds / 60)
      store.userData.totalFail++
      store.updateConsecutiveDays()
      store.saveUserData()

      const record = {
        id: Util.generateId(),
        date: Util.getToday(),
        mode: state.mode,
        duration: minutes,
        isSuccess: false,
        isDeepFocus: false,
        startTime: Util.formatDateTime(state.startTimestamp),
        endTime: Util.formatDateTime(Date.now())
      }
      store.addRecord(record)

      document.getElementById('failElapsed').textContent = Util.formatMinutes(minutes)

      store.isTiming = false
      store.currentMode = ''
      store.timerStartTime = null

      updateUI()
    }

    function onTakeStartPhoto() {
      const input = document.createElement('input')
      input.type = 'file'
      input.accept = 'image/*'
      input.capture = 'environment'
      input.onchange = (e) => {
        const file = e.target.files[0]
        if (file) {
          const reader = new FileReader()
          reader.onload = (event) => {
            state.startPhoto = event.target.result
            document.getElementById('photoPrompt').style.display = 'none'
            document.getElementById('photoDone').style.display = 'block'
            Util.showToast('拍照成功')
          }
          reader.readAsDataURL(file)
        }
      }
      input.click()
    }

    function onTakeEndPhoto() {
      const input = document.createElement('input')
      input.type = 'file'
      input.accept = 'image/*'
      input.capture = 'environment'
      input.onchange = (e) => {
        const file = e.target.files[0]
        if (file) {
          const reader = new FileReader()
          reader.onload = (event) => {
            state.endPhoto = event.target.result
            
            if (state.startPhoto) {
              document.getElementById('startPhotoImg').src = state.startPhoto
              document.getElementById('endPhotoImg').src = state.endPhoto
              document.getElementById('photoCompare').style.display = 'block'
            }
            
            document.getElementById('needEndPhoto').style.display = 'none'
            document.getElementById('finishContent').style.display = 'block'
            Util.showToast('核验通过')
          }
          reader.readAsDataURL(file)
        }
      }
      input.click()
    }

    function onToggleAudio() {
      if (state.isPlayingAudio) {
        document.getElementById('audioIcon').textContent = '🔇'
        state.isPlayingAudio = false
        Util.showToast('白噪音已关闭')
      } else {
        document.getElementById('audioIcon').textContent = '🔊'
        state.isPlayingAudio = true
        Util.showToast('白噪音已开启')
      }
    }

    function onQuickMemo() {
      Util.showModal({
        title: '记录杂念',
        editable: true,
        placeholderText: '写下此刻的杂念，休息时再看',
        confirmText: '记录'
      }).then(res => {
        if (res.confirm && res.content && res.content.trim()) {
          const memo = {
            id: Util.generateId(),
            content: res.content.trim(),
            createTime: Util.formatDateTime(Date.now())
          }
          store.addMemo(memo)
          Util.showToast('已记录')
        }
      })
    }

    function onBackHome() {
      Util.switchTab('index.html')
    }

    function goBack() {
      if (state.status === 'running' || state.status === 'paused') {
        Util.showModal({
          title: '确定要退出吗？',
          content: '正在专注中，退出将中断计时',
          confirmText: '确定退出',
          cancelText: '继续专注'
        }).then(res => {
          if (res.confirm) {
            onBackHome()
          }
        })
      } else {
        onBackHome()
      }
    }

    function _clearTimer() {
      if (state.timerInterval) {
        clearInterval(state.timerInterval)
        state.timerInterval = null
      }
    }

    function _clearCoolDown() {
      if (state.coolDownTimer) {
        clearInterval(state.coolDownTimer)
        state.coolDownTimer = null
      }
    }

    window.addEventListener('load', init)
  </script>
</body>
</html>
