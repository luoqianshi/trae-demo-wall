<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>专注自习室 - 数据统计</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .nav-header {
      background-color: #FFFFFF;
      padding: 16px 14px 6px;
      text-align: center;
      border-bottom: 1px solid #E8EDEB;
    }
    
    .nav-title {
      font-size: 16px;
      font-weight: 700;
      color: #2C3E50;
    }
    
    .period-tabs {
      display: flex;
      margin-bottom: 10px;
      background-color: #E8EDEB;
      border-radius: 6px;
      padding: 3px;
    }
    
    .period-tab {
      flex: 1;
      text-align: center;
      padding: 8px;
      font-size: 12px;
      color: #A0AAB4;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .period-tab.active {
      background-color: #FFFFFF;
      color: #6BB5A8;
      font-weight: 600;
    }
    
    .stats-summary {
      margin-top: 0;
    }
    
    .summary-row {
      display: flex;
      justify-content: space-around;
    }
    
    .summary-item {
      text-align: center;
      flex: 1;
    }
    
    .summary-value {
      display: block;
      font-size: 16px;
      font-weight: 700;
      color: #2C3E50;
      margin-bottom: 3px;
    }
    
    .summary-label {
      font-size: 10px;
      color: #A0AAB4;
    }
    
    .chart-canvas {
      width: 100%;
      height: 120px;
    }
    
    .chart-legend {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 10px;
    }
    
    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 2px;
    }
    
    .legend-dot.deep {
      background-color: #6BB5A8;
    }
    
    .legend-dot.normal {
      background-color: #E8A87C;
    }
    
    .record-item {
      padding: 10px 0;
      border-bottom: 1px solid #E8EDEB;
    }
    
    .record-item:last-child {
      border-bottom: none;
    }
    
    .record-icon {
      font-size: 16px;
      margin-right: 10px;
    }
    
    .record-duration {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #2C3E50;
    }
    
    .export-section {
      text-align: center;
      padding: 10px 0 14px;
    }
    
    .export-btn {
      width: 100%;
      padding: 10px 20px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="nav-header">
    <div class="nav-title">数据统计</div>
  </div>
  
  <div class="page-container" id="app">
    <div class="period-tabs">
      <div class="period-tab active" onclick="onSwitchPeriod('today')">今日</div>
      <div class="period-tab" onclick="onSwitchPeriod('week')">本周</div>
      <div class="period-tab" onclick="onSwitchPeriod('month')">本月</div>
    </div>

    <div class="stats-summary card">
      <div class="summary-row">
        <div class="summary-item">
          <span class="summary-value" id="totalMinutes">0</span>
          <span class="summary-label">总时长(分钟)</span>
        </div>
        <div class="summary-item">
          <span class="summary-value accent-text" id="successCount">0</span>
          <span class="summary-label">成功次数</span>
        </div>
        <div class="summary-item">
          <span class="summary-value" style="color:#E88B8B" id="failCount">0</span>
          <span class="summary-label">失败/中断</span>
        </div>
      </div>
      <div class="divider"></div>
      <div class="summary-row">
        <div class="summary-item">
          <span class="summary-value" id="deepFocusCount">0</span>
          <span class="summary-label">深度专注</span>
        </div>
        <div class="summary-item">
          <span class="summary-value" id="maxFocusMinutes">0分钟</span>
          <span class="summary-label">最长单次</span>
        </div>
        <div class="summary-item">
          <span class="summary-value" id="pomodoroCount">0次</span>
          <span class="summary-label">番茄完成</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">专注时长分布</div>
      <canvas id="statsChart" class="chart-canvas"></canvas>
      <div class="chart-legend">
        <div class="legend-item">
          <div class="legend-dot deep"></div>
          <span class="text-small text-muted">深度专注</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot normal"></div>
          <span class="text-small text-muted">普通专注</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="flex-between">
        <span class="card-title" id="recordTitle">今日记录</span>
      </div>
      <div id="emptyRecords" class="empty-state" style="display: none;">
        <span class="text-muted">暂无记录，快去专注吧</span>
      </div>
      <div id="recordList"></div>
    </div>

    <div class="export-section">
      <button class="btn-outline export-btn" onclick="onExportData()">导出数据 (JSON)</button>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab-item" onclick="switchTab('index.html')">
      <span class="tab-icon">🎯</span>
      <span class="tab-text">专注</span>
    </div>
    <div class="tab-item active" onclick="switchTab('stats.html')">
      <span class="tab-icon">📊</span>
      <span class="tab-text">统计</span>
    </div>
    <div class="tab-item" onclick="switchTab('achievement.html')">
      <span class="tab-icon">🏆</span>
      <span class="tab-text">成就</span>
    </div>
    <div class="tab-item" onclick="switchTab('room.html')">
      <span class="tab-icon">👥</span>
      <span class="tab-text">结伴</span>
    </div>
  </div>

  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script>
    let currentPeriod = 'today'

    function loadData() {
      const records = store.records || []
      const filteredRecords = filterRecordsByPeriod(records, currentPeriod)
      
      const statsData = calculateStats(filteredRecords)
      updateStatsUI(statsData)
      updateRecordList(filteredRecords)
      drawChart(filteredRecords)
    }

    function filterRecordsByPeriod(records, period) {
      const today = Util.getToday()
      
      if (period === 'today') {
        return records.filter(r => r.date === today)
      } else if (period === 'week') {
        const weekRange = Util.getWeekRange()
        return records.filter(r => r.date >= weekRange.start && r.date <= weekRange.end)
      } else if (period === 'month') {
        const monthRange = Util.getMonthRange()
        return records.filter(r => r.date >= monthRange.start && r.date <= monthRange.end)
      }
      return records
    }

    function calculateStats(records) {
      let totalMinutes = 0
      let successCount = 0
      let failCount = 0
      let deepFocusCount = 0
      let maxFocusMinutes = 0
      let pomodoroCount = 0

      records.forEach(record => {
        if (record.isSuccess) {
          totalMinutes += record.duration
          successCount++
          if (record.isDeepFocus) deepFocusCount++
          if (record.duration > maxFocusMinutes) maxFocusMinutes = record.duration
          if (record.mode === 'pomodoro') pomodoroCount++
        } else {
          failCount++
        }
      })

      return {
        totalMinutes,
        successCount,
        failCount,
        deepFocusCount,
        maxFocusMinutes,
        pomodoroCount,
        records
      }
    }

    function updateStatsUI(statsData) {
      document.getElementById('totalMinutes').textContent = statsData.totalMinutes
      document.getElementById('successCount').textContent = statsData.successCount
      document.getElementById('failCount').textContent = statsData.failCount
      document.getElementById('deepFocusCount').textContent = statsData.deepFocusCount
      document.getElementById('maxFocusMinutes').textContent = statsData.maxFocusMinutes + '分钟'
      document.getElementById('pomodoroCount').textContent = statsData.pomodoroCount + '次'
      
      const titles = {
        today: '今日记录',
        week: '本周记录',
        month: '本月记录'
      }
      document.getElementById('recordTitle').textContent = titles[currentPeriod]
    }

    function updateRecordList(records) {
      const list = document.getElementById('recordList')
      const empty = document.getElementById('emptyRecords')
      
      if (records.length === 0) {
        list.innerHTML = ''
        empty.style.display = 'block'
        return
      }
      
      empty.style.display = 'none'
      
      const sortedRecords = [...records].sort((a, b) => new Date(b.startTime) - new Date(a.startTime))
      
      list.innerHTML = sortedRecords.map(record => {
        const icon = record.mode === 'pomodoro' ? '🍅' : record.mode === 'reading' ? '📖' : '📚'
        const badgeClass = record.isSuccess ? 'badge-success' : 'badge-fail'
        const badgeText = record.isSuccess ? '成功' : '失败'
        
        return `
          <div class="record-item">
            <div class="flex-between">
              <div class="flex-center">
                <span class="record-icon">${icon}</span>
                <div>
                  <span class="record-duration">${record.isDeepFocus ? '🏆' : ''} ${record.duration}分钟</span>
                  <span class="text-small text-muted">${record.startTime}</span>
                </div>
              </div>
              <div class="badge ${badgeClass}">${badgeText}</div>
            </div>
          </div>
        `
      }).join('')
    }

    function drawChart(records) {
      const canvas = document.getElementById('statsChart')
      const ctx = canvas.getContext('2d')
      
      const rect = canvas.getBoundingClientRect()
      canvas.width = rect.width * window.devicePixelRatio
      canvas.height = rect.height * window.devicePixelRatio
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio)
      
      ctx.clearRect(0, 0, rect.width, rect.height)
      
      if (records.length === 0) {
        ctx.fillStyle = '#A0AAB4'
        ctx.font = '12px sans-serif'
        ctx.textAlign = 'center'
        ctx.fillText('暂无数据', rect.width / 2, rect.height / 2)
        return
      }
      
      const dates = [...new Set(records.map(r => r.date))].sort()
      const maxValue = Math.max(...records.map(r => r.duration), 1)
      
      const padding = { top: 20, right: 16, bottom: 24, left: 24 }
      const chartWidth = rect.width - padding.left - padding.right
      const chartHeight = rect.height - padding.top - padding.bottom
      const barWidth = chartWidth / dates.length * 0.5
      const barGap = chartWidth / dates.length * 0.5
      
      ctx.strokeStyle = '#E8EDEB'
      ctx.lineWidth = 1
      for (let i = 0; i <= 2; i++) {
        const y = padding.top + (chartHeight / 2) * i
        ctx.beginPath()
        ctx.moveTo(padding.left, y)
        ctx.lineTo(rect.width - padding.right, y)
        ctx.stroke()
        
        ctx.fillStyle = '#A0AAB4'
        ctx.font = '10px sans-serif'
        ctx.textAlign = 'right'
        ctx.fillText(Math.round(maxValue - (maxValue / 2) * i), padding.left - 6, y + 3)
      }
      
      const dateMap = {}
      records.forEach(record => {
        if (!dateMap[record.date]) {
          dateMap[record.date] = { deep: 0, normal: 0 }
        }
        if (record.isDeepFocus) {
          dateMap[record.date].deep += record.duration
        } else {
          dateMap[record.date].normal += record.duration
        }
      })
      
      dates.forEach((date, index) => {
        const x = padding.left + index * (barWidth + barGap) + barGap / 2
        const deepHeight = (dateMap[date].deep / maxValue) * chartHeight
        const normalHeight = (dateMap[date].normal / maxValue) * chartHeight
        
        ctx.fillStyle = '#6BB5A8'
        ctx.fillRect(x, padding.top + chartHeight - deepHeight, barWidth, deepHeight)
        
        ctx.fillStyle = '#E8A87C'
        ctx.fillRect(x, padding.top + chartHeight - deepHeight - normalHeight, barWidth, normalHeight)
        
        ctx.fillStyle = '#A0AAB4'
        ctx.font = '10px sans-serif'
        ctx.textAlign = 'center'
        const dateLabel = date.substring(5)
        ctx.fillText(dateLabel, x + barWidth / 2, rect.height - 6)
      })
    }

    function onSwitchPeriod(period) {
      currentPeriod = period
      
      document.querySelectorAll('.period-tab').forEach(tab => {
        tab.classList.remove('active')
      })
      event.currentTarget.classList.add('active')
      
      loadData()
    }

    function onExportData() {
      const data = {
        userData: store.userData,
        records: store.records,
        exportTime: new Date().toISOString()
      }
      
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })
      const url = URL.createObjectURL(blob)
      const a = document.createElement('a')
      a.href = url
      a.download = `focus-data-${Util.getToday()}.json`
      a.click()
      URL.revokeObjectURL(url)
      
      Util.showToast('数据导出成功')
    }

    function switchTab(url) {
      Util.switchTab(url)
    }

    window.addEventListener('load', loadData)
    window.addEventListener('resize', loadData)
  </script>
</body>
</html>
