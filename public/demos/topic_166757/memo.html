<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>专注自习室 - 备忘录</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .nav-header {
      background-color: #FFFFFF;
      padding: 16px 14px 6px;
      text-align: center;
      border-bottom: 1px solid #E8EDEB;
    }
    
    .nav-title {
      font-size: 16px;
      font-weight: 700;
      color: #2C3E50;
    }
    
    .memo-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .memo-count {
      font-size: 11px;
      color: #A0AAB4;
    }
    
    .memo-item {
      padding: 10px 0;
      border-bottom: 1px solid #E8EDEB;
    }
    
    .memo-item:last-child {
      border-bottom: none;
    }
    
    .memo-content {
      font-size: 13px;
      color: #2C3E50;
      line-height: 1.4;
      margin-bottom: 6px;
      display: block;
    }
    
    .memo-time {
      font-size: 10px;
      color: #A0AAB4;
    }
    
    .memo-actions {
      display: flex;
      gap: 14px;
      margin-top: 8px;
    }
    
    .action-btn {
      font-size: 11px;
      color: #6BB5A8;
      cursor: pointer;
    }
    
    .action-delete {
      color: #E88B8B;
    }
    
    .add-section {
      margin-top: 10px;
    }
    
    .add-btn {
      width: 100%;
      padding: 10px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="nav-header">
    <div class="nav-title">杂念备忘录</div>
  </div>
  
  <div class="page-container" id="app">
    <div class="card">
      <div class="memo-header">
        <span class="card-title">📝 我的备忘录</span>
        <span class="memo-count" id="memoCount">0 条</span>
      </div>

      <div id="emptyMemos" class="empty-state" style="display: none;">
        <span class="text-muted">暂无记录，写下此刻的想法吧</span>
      </div>

      <div id="memoList"></div>

      <div class="divider"></div>

      <div class="add-section">
        <textarea
          placeholder="写下此刻的杂念，休息时再看..."
          id="memoInput"
        ></textarea>
        <button class="btn-primary mt-14 add-btn" onclick="onAddMemo()">添加记录</button>
      </div>
    </div>

    <div class="card">
      <div class="flex-center-full">
        <span class="text-small text-muted">管理备忘录</span>
      </div>
      <button class="btn-danger mt-14" onclick="onClearAll()" style="width:100%">清空所有记录</button>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab-item" onclick="switchTab('index.html')">
      <span class="tab-icon">🎯</span>
      <span class="tab-text">专注</span>
    </div>
    <div class="tab-item" onclick="switchTab('stats.html')">
      <span class="tab-icon">📊</span>
      <span class="tab-text">统计</span>
    </div>
    <div class="tab-item" onclick="switchTab('achievement.html')">
      <span class="tab-icon">🏆</span>
      <span class="tab-text">成就</span>
    </div>
    <div class="tab-item active" onclick="switchTab('memo.html')">
      <span class="tab-icon">📝</span>
      <span class="tab-text">备忘</span>
    </div>
  </div>

  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script>
    let editingId = null

    function loadData() {
      const memos = store.memoList || []
      document.getElementById('memoCount').textContent = `${memos.length} 条`
      updateMemoList(memos)
    }

    function updateMemoList(memos) {
      const list = document.getElementById('memoList')
      const empty = document.getElementById('emptyMemos')
      
      if (memos.length === 0) {
        list.innerHTML = ''
        empty.style.display = 'block'
        return
      }
      
      empty.style.display = 'none'
      
      const sortedMemos = [...memos].sort((a, b) => new Date(b.createTime) - new Date(a.createTime))
      
      list.innerHTML = sortedMemos.map(memo => {
        return `
          <div class="memo-item">
            <span class="memo-content">${memo.content}</span>
            <span class="memo-time">${memo.createTime}</span>
            <div class="memo-actions">
              <span class="action-btn" onclick="onEditMemo('${memo.id}')">编辑</span>
              <span class="action-btn action-delete" onclick="onDeleteMemo('${memo.id}')">删除</span>
            </div>
          </div>
        `
      }).join('')
    }

    function onAddMemo() {
      const content = document.getElementById('memoInput').value.trim()
      
      if (!content) {
        Util.showToast('请输入内容')
        return
      }
      
      if (editingId) {
        store.updateMemo(editingId, content)
        editingId = null
        Util.showToast('已更新')
      } else {
        const memo = {
          id: Util.generateId(),
          content,
          createTime: Util.formatDateTime(Date.now())
        }
        store.addMemo(memo)
        Util.showToast('已添加')
      }
      
      document.getElementById('memoInput').value = ''
      loadData()
    }

    function onEditMemo(id) {
      const memo = store.memoList.find(m => m.id === id)
      if (memo) {
        editingId = id
        document.getElementById('memoInput').value = memo.content
        Util.showToast('已进入编辑模式')
      }
    }

    function onDeleteMemo(id) {
      Util.showModal({
        title: '确认删除',
        content: '确定要删除这条记录吗？',
        confirmText: '删除',
        cancelText: '取消'
      }).then(res => {
        if (res.confirm) {
          store.deleteMemo(id)
          if (editingId === id) {
            editingId = null
            document.getElementById('memoInput').value = ''
          }
          Util.showToast('已删除')
          loadData()
        }
      })
    }

    function onClearAll() {
      if (store.memoList.length === 0) {
        Util.showToast('暂无记录')
        return
      }
      
      Util.showModal({
        title: '确认清空',
        content: '确定要清空所有备忘录吗？此操作不可恢复。',
        confirmText: '清空',
        cancelText: '取消'
      }).then(res => {
        if (res.confirm) {
          store.clearMemos()
          editingId = null
          document.getElementById('memoInput').value = ''
          Util.showToast('已清空')
          loadData()
        }
      })
    }

    function switchTab(url) {
      Util.switchTab(url)
    }

    window.addEventListener('load', loadData)
  </script>
</body>
</html>
