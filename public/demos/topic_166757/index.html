<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>专注自习室</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .nav-header {
      background-color: #FFFFFF;
      padding: 16px 14px 6px;
      text-align: center;
      border-bottom: 1px solid #E8EDEB;
    }
    
    .nav-title {
      font-size: 16px;
      font-weight: 700;
      color: #2C3E50;
    }
    
    .hero-card {
      padding: 14px;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #E8F5F1 0%, #F2F7F5 100%);
    }
    
    .hero-row {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .hero-item {
      flex: 1;
      text-align: center;
    }
    
    .hero-value {
      display: block;
      font-size: 22px;
      font-weight: 700;
      font-family: 'Menlo', 'Consolas', 'Courier New', monospace;
      color: #2C3E50;
    }
    
    .hero-value.coins {
      color: #E8A87C;
    }
    
    .hero-label {
      display: block;
      font-size: 10px;
      color: #7B8B83;
      margin-top: 3px;
    }
    
    .hero-divider {
      width: 1px;
      height: 30px;
      background-color: #D8E3DE;
    }
    
    .mode-section {
      margin-bottom: 10px;
    }
    
    .mode-entry {
      background-color: #FFFFFF;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #E8EDEB;
      box-shadow: 0 1px 4px rgba(0,0,0,0.02);
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .mode-entry:active {
      background-color: #F2F7F5;
      border-color: #6BB5A8;
    }
    
    .mode-icon {
      font-size: 20px;
      margin-right: 10px;
    }
    
    .mode-info {
      flex: 1;
    }
    
    .mode-name {
      font-size: 13px;
      font-weight: 600;
      color: #2C3E50;
      display: block;
    }
    
    .mode-desc {
      font-size: 10px;
      color: #A0AAB4;
      margin-top: 3px;
      display: block;
    }
    
    .mode-arrow {
      font-size: 14px;
      color: #6BB5A8;
      font-weight: 300;
    }
    
    .bottom-card {
      padding: 12px;
    }
    
    .streak-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .streak-icon {
      font-size: 18px;
    }
    
    .streak-value {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #2C3E50;
    }
    
    .streak-label {
      display: block;
      font-size: 9px;
      color: #A0AAB4;
    }
    
    .lock-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(255, 255, 255, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    
    .lock-card {
      text-align: center;
      padding: 30px 20px;
    }
    
    .lock-icon {
      font-size: 40px;
      display: block;
      margin-bottom: 14px;
    }
    
    .lock-title {
      font-size: 18px;
      font-weight: 700;
      color: #2C3E50;
      display: block;
      margin-bottom: 10px;
    }
    
    .lock-desc {
      font-size: 11px;
      color: #A0AAB4;
      display: block;
    }
  </style>
</head>
<body>
  <div class="nav-header">
    <div class="nav-title">专注自习室</div>
  </div>
  
  <div class="page-container" id="app">
    <div class="hero-card card">
      <div class="hero-row">
        <div class="hero-item">
          <span class="hero-value" id="todayMinutes">0</span>
          <span class="hero-label">今日专注</span>
        </div>
        <div class="hero-divider"></div>
        <div class="hero-item">
          <span class="hero-value coins" id="coins">0</span>
          <span class="hero-label">专注币</span>
        </div>
      </div>

      <div class="mt-14">
        <div class="flex-between">
          <span class="text-small text-muted">今日目标 2小时</span>
          <span class="text-small accent-text" id="todayProgress">0%</span>
        </div>
        <div class="progress-bar mt-6">
          <div class="progress-fill" id="progressBar" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <div class="mode-section">
      <div class="mode-entry" onclick="onSelectMode('pomodoro')">
        <div class="flex-center">
          <span class="mode-icon">🍅</span>
          <div class="mode-info">
            <span class="mode-name">番茄专注</span>
            <span class="mode-desc">25分钟专注 · 5分钟休息</span>
          </div>
        </div>
        <span class="mode-arrow">→</span>
      </div>

      <div class="mode-entry" onclick="onSelectMode('selfstudy')">
        <div class="flex-center">
          <span class="mode-icon">📚</span>
          <div class="mode-info">
            <span class="mode-name">自由自习</span>
            <span class="mode-desc">自定义时长 · 随心所学</span>
          </div>
        </div>
        <span class="mode-arrow">→</span>
      </div>

      <div class="mode-entry" onclick="onSelectMode('reading')">
        <div class="flex-center">
          <span class="mode-icon">📖</span>
          <div class="mode-info">
            <span class="mode-name">阅读模式</span>
            <span class="mode-desc">沉浸式阅读 · 远离干扰</span>
          </div>
        </div>
        <span class="mode-arrow">→</span>
      </div>
    </div>

    <div class="card bottom-card">
      <div class="flex-between">
        <div class="streak-item">
          <span class="streak-icon">🔥</span>
          <div>
            <span class="streak-value" id="consecutiveDays">0天</span>
            <span class="streak-label">连续打卡</span>
          </div>
        </div>
        <div class="streak-item">
          <span class="streak-icon">⭐</span>
          <div>
            <span class="streak-value">Lv.<span id="level">1</span></span>
            <span class="streak-label" id="levelName">见习专注者</span>
          </div>
        </div>
      </div>
    </div>

    <div class="lock-overlay" id="lockOverlay" style="display: none;">
      <div class="lock-card">
        <span class="lock-icon">🔒</span>
        <span class="lock-title">今日专注已锁定</span>
        <span class="lock-desc">您今日切出次数已达上限，请明天再来</span>
      </div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab-item active" onclick="switchTab('index.html')">
      <span class="tab-icon">🎯</span>
      <span class="tab-text">专注</span>
    </div>
    <div class="tab-item" onclick="switchTab('stats.html')">
      <span class="tab-icon">📊</span>
      <span class="tab-text">统计</span>
    </div>
    <div class="tab-item" onclick="switchTab('achievement.html')">
      <span class="tab-icon">🏆</span>
      <span class="tab-text">成就</span>
    </div>
    <div class="tab-item" onclick="switchTab('room.html')">
      <span class="tab-icon">👥</span>
      <span class="tab-text">结伴</span>
    </div>
  </div>

  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script>
    function loadData() {
      const userData = store.userData
      const today = Util.getToday()

      let todayMinutes = 0
      const records = store.records || []
      records.forEach(record => {
        if (record.date === today && record.isSuccess) {
          todayMinutes += record.duration || 0
        }
      })

      const todayProgress = Math.min(100, Math.floor((todayMinutes / 120) * 100))
      const level = Util.calcLevel(userData.totalFocusMinutes)
      const levelName = Util.getLevelName(level)

      document.getElementById('todayMinutes').textContent = todayMinutes === 0 ? '0' : Util.formatMinutes(todayMinutes)
      document.getElementById('coins').textContent = userData.coins
      document.getElementById('todayProgress').textContent = `${todayProgress}%`
      document.getElementById('progressBar').style.width = `${todayProgress}%`
      document.getElementById('consecutiveDays').textContent = `${userData.consecutiveDays}天`
      document.getElementById('level').textContent = level
      document.getElementById('levelName').textContent = levelName

      if (store.isLocked) {
        document.getElementById('lockOverlay').style.display = 'flex'
      }
    }

    function onSelectMode(mode) {
      if (store.isLocked) {
        Util.showToast('今日专注已锁定')
        return
      }

      let defaultDuration = 25
      if (mode === 'selfstudy') {
        showDurationPicker(mode)
        return
      } else if (mode === 'reading') {
        defaultDuration = 45
      }

      Util.navigateTo(`timer.html?mode=${mode}&duration=${defaultDuration}`)
    }

    function showDurationPicker(mode) {
      Util.showModal({
        title: '设置自习时长',
        editable: true,
        placeholderText: '输入分钟数（1-180）',
        confirmText: '确定',
        cancelText: '取消'
      }).then(res => {
        if (res.confirm && res.content) {
          const duration = parseInt(res.content)
          if (isNaN(duration) || duration < 1 || duration > 180) {
            Util.showToast('请输入1-180之间的数字')
            return
          }
          Util.navigateTo(`timer.html?mode=${mode}&duration=${duration}`)
        }
      })
    }

    function switchTab(url) {
      Util.switchTab(url)
    }

    window.addEventListener('load', loadData)
  </script>
</body>
</html>
