<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>万象选股 · 插件化多券商量化筛选引擎</title>
<style>
  :root{
    --ink-deep:#0a0f14;--ink-mid:#0d1a20;--ink-light:#132028;
    --bronze:#c9a96e;--bronze-dim:#8a7350;--bronze-glow:rgba(201,169,110,0.15);
    --celadon:#5d8a9e;--celadon-dim:#3d5f6e;
    --cinnabar:#d4574a;--jade:#4a9e6d;
    --silver:#a8b5c0;--silver-dim:#5a6a75;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:var(--ink-deep);color:var(--silver);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:14px;line-height:1.7;min-height:100vh;
  }
  .app{display:grid;grid-template-columns:220px 1fr;grid-template-rows:auto 1fr;height:100vh;overflow:hidden}

  /* Header */
  .header{
    grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;
    padding:0 24px;height:56px;background:var(--ink-mid);border-bottom:1px solid rgba(201,169,110,0.12);
  }
  .brand{display:flex;align-items:center;gap:12px}
  .brand-seal{
    width:32px;height:32px;border-radius:4px;border:1.5px solid var(--bronze);
    display:flex;align-items:center;justify-content:center;
    font-size:16px;font-weight:700;color:var(--bronze);background:rgba(201,169,110,0.08)
  }
  .brand-name{font-size:16px;font-weight:600;color:var(--bronze);letter-spacing:.08em}
  .brand-sub{font-size:11px;color:var(--silver-dim);margin-left:8px}
  .header-status{display:flex;align-items:center;gap:16px;font-size:12px}
  .ws-indicator{display:flex;align-items:center;gap:6px}
  .ws-dot{width:7px;height:7px;border-radius:50%;background:var(--jade);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  /* Sidebar */
  .sidebar{
    background:var(--ink-mid);border-right:1px solid rgba(201,169,110,0.1);
    padding:20px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:16px
  }
  .sb-title{font-size:10px;color:var(--bronze-dim);letter-spacing:.15em;text-align:center;margin-bottom:4px}
  .broker{
    background:rgba(10,15,20,0.6);border:1.5px solid var(--paper-border);border-radius:50%;
    width:90px;height:90px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:4px;cursor:pointer;transition:all .3s;position:relative;
    --paper-border:rgba(201,169,110,0.15)
  }
  .broker:hover{transform:scale(1.05)}
  .broker.active{border-color:var(--bronze);box-shadow:0 0 16px rgba(201,169,110,0.2)}
  .broker.off{border-color:rgba(90,106,117,0.3);opacity:.6}
  .broker .b-name{font-size:11px;font-weight:600;color:var(--bronze)}
  .broker .b-status{font-size:9px;padding:1px 6px;border-radius:8px;border:1px solid var(--jade);color:var(--jade)}
  .broker.off .b-status{border-color:var(--silver-dim);color:var(--silver-dim)}
  .broker .b-ping{font-size:9px;color:var(--silver-dim);margin-top:2px}
  .add-broker{
    width:90px;height:90px;border-radius:50%;border:1.5px dashed rgba(90,106,117,0.4);
    margin:0 auto;display:flex;align-items:center;justify-content:center;
    font-size:24px;color:var(--silver-dim);cursor:pointer;transition:all .2s
  }
  .add-broker:hover{border-color:var(--bronze);color:var(--bronze)}

  /* Main */
  .main{padding:20px 24px;overflow-y:auto;background:var(--ink-deep)}

  /* Metrics */
  .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
  .metric{
    background:rgba(201,169,110,0.04);border:1px solid rgba(201,169,110,0.1);border-radius:8px;
    padding:14px 16px;transition:all .2s
  }
  .metric:hover{border-color:rgba(201,169,110,0.25)}
  .metric-label{font-size:10px;color:var(--silver-dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
  .metric-val{font-size:22px;font-weight:600;color:var(--silver);letter-spacing:.02em}
  .metric-val.bull{color:var(--cinnabar)}
  .metric-val.bear{color:var(--jade)}

  /* Control */
  .control{
    display:flex;align-items:center;gap:12px;background:var(--ink-mid);border:1px solid rgba(201,169,110,0.1);
    border-radius:8px;padding:14px 18px;margin-bottom:20px;flex-wrap:wrap
  }
  .ctrl-group{display:flex;align-items:center;gap:8px}
  .ctrl-label{font-size:12px;color:var(--silver-dim)}
  .ctrl-select,.ctrl-btn{
    background:var(--ink-light);border:1px solid rgba(201,169,110,0.2);color:var(--silver);
    padding:7px 14px;border-radius:6px;font-size:13px;cursor:pointer;outline:none
  }
  .ctrl-select:focus{border-color:var(--bronze)}
  .ctrl-btn{
    background:linear-gradient(135deg,rgba(201,169,110,0.15),rgba(201,169,110,0.05));
    color:var(--bronze);font-weight:600;border-color:var(--bronze);transition:all .2s
  }
  .ctrl-btn:hover{box-shadow:0 0 12px rgba(201,169,110,0.2)}
  .ctrl-btn:disabled{opacity:.5;cursor:not-allowed}
  .ctrl-btn.running{animation:btnRun 1.5s infinite alternate}
  @keyframes btnRun{from{box-shadow:0 0 6px rgba(201,169,110,.1)}to{box-shadow:0 0 20px rgba(201,169,110,.4)}}

  /* Loading */
  .loading-wrap{display:none;text-align:center;padding:30px}
  .loading-wrap.active{display:block}
  .loading-coin{
    width:48px;height:48px;border-radius:50%;border:2px solid var(--bronze);border-top-color:transparent;
    margin:0 auto 12px;animation:spin 1s linear infinite;display:flex;align-items:center;justify-content:center;
    font-size:14px;color:var(--bronze)
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-text{font-size:13px;color:var(--bronze-dim)}

  /* Table */
  .table-wrap{background:var(--ink-mid);border:1px solid rgba(201,169,110,0.1);border-radius:8px;overflow:hidden}
  .table-head{display:grid;grid-template-columns:1.2fr .9fr .8fr .7fr .8fr .8fr;background:rgba(201,169,110,0.04);padding:10px 16px;font-size:11px;color:var(--silver-dim);border-bottom:1px solid rgba(201,169,110,0.1)}
  .table-row{display:grid;grid-template-columns:1.2fr .9fr .8fr .7fr .8fr .8fr;padding:10px 16px;font-size:13px;border-bottom:1px solid rgba(201,169,110,0.05);transition:all .2s;animation:fadeIn .4s ease both}
  .table-row:hover{background:rgba(201,169,110,0.04)}
  .table-row .sym{color:var(--bronze);font-weight:600}
  .table-row .score{color:var(--bronze);font-weight:600}
  .table-row .weight{color:var(--celadon)}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  /* Toast */
  .toast{
    position:fixed;top:20px;right:20px;background:var(--ink-mid);border:1px solid rgba(201,169,110,0.2);
    border-radius:8px;padding:12px 18px;font-size:13px;color:var(--silver);z-index:1000;
    transform:translateX(150%);transition:transform .4s ease;max-width:300px
  }
  .toast.show{transform:translateX(0)}
  .toast-title{font-weight:600;color:var(--bronze);margin-bottom:4px}

  /* Responsive */
  @media(max-width:900px){
    .app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
    .sidebar{flex-direction:row;flex-wrap:wrap;justify-content:center;padding:12px}
    .broker,.add-broker{width:64px;height:64px}
    .metrics{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand">
      <div class="brand-seal">选</div>
      <span class="brand-name">万象选股</span>
      <span class="brand-sub">Universal Stock Screener</span>
    </div>
    <div class="header-status">
      <div class="ws-indicator"><div class="ws-dot"></div><span>WebSocket 实时推送中</span></div>
      <span>引擎版本 v0.1.0-MVP</span>
    </div>
  </header>

  <aside class="sidebar">
    <div class="sb-title">数据源</div>
    <div class="broker active" data-broker="ht" onclick="switchBroker('ht')">
      <div class="b-name">华泰</div>
      <div class="b-status">已连接</div>
      <div class="b-ping">12ms</div>
    </div>
    <div class="broker" data-broker="ak" onclick="switchBroker('ak')">
      <div class="b-name">AKShare</div>
      <div class="b-status">已连接</div>
      <div class="b-ping">28ms</div>
    </div>
    <div class="broker off" data-broker="ts" onclick="switchBroker('ts')">
      <div class="b-name" style="color:var(--silver-dim)">Tushare</div>
      <div class="b-status">未启用</div>
    </div>
    <div class="broker off" data-broker="xq" onclick="switchBroker('xq')">
      <div class="b-name" style="color:var(--silver-dim)">雪球</div>
      <div class="b-status">未启用</div>
    </div>
    <div class="add-broker" onclick="showToast('插件化架构演示','任意券商只需实现 BrokerAdapter 接口即可接入')">+</div>
  </aside>

  <main class="main">
    <div class="metrics">
      <div class="metric">
        <div class="metric-label">市场状态</div>
        <div class="metric-val bull" id="mktStatus">牛市</div>
      </div>
      <div class="metric">
        <div class="metric-label">目标仓位</div>
        <div class="metric-val" id="targetPos">85%</div>
      </div>
      <div class="metric">
        <div class="metric-label">股票池</div>
        <div class="metric-val" id="poolSize">300</div>
      </div>
      <div class="metric">
        <div class="metric-label">最终选出</div>
        <div class="metric-val" style="color:var(--bronze)" id="pickCount">--</div>
      </div>
    </div>

    <div class="control">
      <div class="ctrl-group">
        <span class="ctrl-label">策略模型：</span>
        <select class="ctrl-select" id="strategy">
          <option value="value">价值投资</option>
          <option value="momentum">动量趋势</option>
          <option value="reversal">反转策略</option>
          <option value="lowvol">低波动率</option>
          <option value="multi" selected>多因子 IC 加权</option>
        </select>
      </div>
      <div class="ctrl-group">
        <span class="ctrl-label">数据源：</span>
        <select class="ctrl-select" id="source">
          <option value="ht">华泰 xtquant</option>
          <option value="ak">AKShare 免费</option>
          <option value="multi">多路聚合验证</option>
        </select>
      </div>
      <button class="ctrl-btn" id="runBtn" onclick="runScreen()">▶ 运行选股</button>
    </div>

    <div class="loading-wrap" id="loading">
      <div class="loading-coin">选</div>
      <div class="loading-text">策略引擎计算中 · 并行获取多源数据 · 因子打分 · 组合优化</div>
    </div>

    <div class="table-wrap" id="resultWrap" style="display:none">
      <div class="table-head">
        <div>代码</div><div>行业</div><div>现价</div><div>PE</div><div>得分</div><div>权重</div>
      </div>
      <div id="resultBody"></div>
    </div>
  </main>
</div>

<div class="toast" id="toast">
  <div class="toast-title" id="toastTitle"></div>
  <div id="toastBody"></div>
</div>

<script>
const stocks=[
  {sym:'600036.SH',name:'招商银行',ind:'银行',price:32.50,pe:5.2},
  {sym:'600519.SH',name:'贵州茅台',ind:'消费',price:1680.00,pe:28.5},
  {sym:'000001.SZ',name:'平安银行',ind:'金融',price:12.30,pe:4.8},
  {sym:'600276.SH',name:'恒瑞医药',ind:'医药',price:45.20,pe:62.3},
  {sym:'300750.SZ',name:'宁德时代',ind:'新能源',price:198.50,pe:18.6},
  {sym:'600900.SH',name:'长江电力',ind:'公用',price:25.80,pe:18.2},
  {sym:'000858.SZ',name:'五粮液',ind:'消费',price:142.00,pe:22.1},
  {sym:'601318.SH',name:'中国平安',ind:'金融',price:48.60,pe:8.5},
  {sym:'600887.SH',name:'伊利股份',ind:'消费',price:28.40,pe:19.8},
  {sym:'002415.SZ',name:'海康威视',ind:'科技',price:32.10,pe:25.4}
];

let activeBroker='ht';
let wsInterval;

function switchBroker(id){
  activeBroker=id;
  document.querySelectorAll('.broker').forEach(b=>b.classList.remove('active'));
  const target=document.querySelector('.broker[data-broker="'+id+'"]');
  if(target)target.classList.add('active');
  const names={ht:'华泰 xtquant',ak:'AKShare 免费',ts:'Tushare 付费',xq:'雪球 API'};
  document.getElementById('source').value=(id==='ht'||id==='ak')?id:'ht';
  showToast('数据源切换','已切换至 '+names[id]+'，选股结果将使用该数据源');
}

function runScreen(){
  const btn=document.getElementById('runBtn');
  const load=document.getElementById('loading');
  const wrap=document.getElementById('resultWrap');
  const body=document.getElementById('resultBody');

  btn.disabled=true;btn.classList.add('running');btn.textContent='选股中...';
  load.classList.add('active');wrap.style.display='none';body.innerHTML='';

  setTimeout(()=>{
    load.classList.remove('active');
    btn.disabled=false;btn.classList.remove('running');btn.textContent='▶ 运行选股';

    const strategy=document.getElementById('strategy').value;
    const multi=(strategy==='multi');
    const picks=shuffle([...stocks]).slice(0,5).map((s,i)=>{
      const scoreBase=multi?0.85:0.75;
      const score=(scoreBase-Math.random()*0.25).toFixed(4);
      const weight=(20-Math.random()*5).toFixed(1);
      const drift=(Math.random()-0.5)*0.8;
      return{...s,price:(s.price+drift).toFixed(2),score,weight};
    }).sort((a,b)=>b.score-a.score);

    document.getElementById('pickCount').textContent=picks.length;
    picks.forEach((p,idx)=>{
      const row=document.createElement('div');row.className='table-row';row.style.animationDelay=(idx*0.08)+'s';
      row.innerHTML='<div class="sym">'+p.sym+'<br><span style="font-size:11px;color:var(--silver-dim)">'+p.name+'</span></div>'+
        '<div>'+p.ind+'</div><div>¥'+p.price+'</div><div>'+p.pe+'</div>'+
        '<div class="score">'+p.score+'</div><div class="weight">'+p.weight+'%</div>';
      body.appendChild(row);
    });
    wrap.style.display='block';
    startRealtime(picks);
    showToast('选股完成','策略：'+document.getElementById('strategy').selectedOptions[0].text+' · 选出 '+picks.length+' 只标的');
  },2200);
}

function startRealtime(picks){
  if(wsInterval)clearInterval(wsInterval);
  wsInterval=setInterval(()=>{
    const sym=picks[Math.floor(Math.random()*picks.length)].sym;
    showToast('WebSocket 推送','['+sym+'] 价格更新 · 因子得分重算完成');
  },8000);
}

function showToast(title,body){
  const t=document.getElementById('toast');
  document.getElementById('toastTitle').textContent=title;
  document.getElementById('toastBody').textContent=body;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3500);
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// Simulate market status rotation
setInterval(()=>{
  const statuses=[{t:'牛市',c:'bull',p:'85%'},{t:'震荡',c:'',p:'60%'},{t:'熊市',c:'bear',p:'30%'}];
  const s=statuses[Math.floor(Math.random()*statuses.length)];
  const el=document.getElementById('mktStatus');
  el.textContent=s.t;el.className='metric-val '+s.c;
  document.getElementById('targetPos').textContent=s.p;
},30000);
</script>
</body>
</html>
