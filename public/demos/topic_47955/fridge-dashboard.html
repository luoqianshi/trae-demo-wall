<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的冰箱 - 储物清单</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #e0f0ff 0%, #f5faff 50%, #ffffff 100%);
    min-height: 100vh;
    color: #2c3e50;
    padding-bottom: 100px;
  }

  .header {
    background: linear-gradient(135deg, #4da6ff 0%, #66b3ff 100%);
    color: #fff;
    padding: 32px 24px;
    text-align: center;
    box-shadow: 0 4px 12px rgba(77, 166, 255, 0.3);
    border-radius: 0 0 28px 28px;
    position: relative;
  }

  .header .bell-btn {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255, 255, 255, 0.22);
    border: none;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.18s ease, transform 0.15s;
  }

  .header .bell-btn:hover { background: rgba(255, 255, 255, 0.4); }
  .header .bell-btn:active { transform: translateY(-50%) scale(0.94); }

  .header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 2px;
  }

  .header p {
    font-size: 14px;
    opacity: 0.9;
    margin-top: 6px;
  }

  .header .fridge-icon {
    font-size: 40px;
    display: block;
    margin-bottom: 8px;
  }

  .container {
    max-width: 960px;
    margin: 24px auto 0;
    padding: 0 16px;
  }

  .cards-wrapper {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .card {
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06), 0 2px 6px rgba(0, 0, 0, 0.04);
    padding: 24px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    border: 1px solid rgba(77, 166, 255, 0.08);
  }

  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.1), 0 4px 10px rgba(0, 0, 0, 0.06);
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(0, 0, 0, 0.06);
  }

  .card-title {
    font-size: 18px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 22px;
    height: 22px;
    padding: 0 7px;
    border-radius: 11px;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
  }

  .badge.warn { background: #ff7a45; }
  .badge.danger { background: #ff4d4f; }
  .badge.ok { background: #52c41a; }
  .badge.blue { background: #1890ff; }

  .warn-icon { color: #ff7a45; font-size: 22px; }
  .low-icon { color: #1890ff; font-size: 22px; }

  .empty-state {
    text-align: center;
    padding: 28px 0;
    color: #8c9bab;
    font-size: 14px;
  }

  .empty-state .emoji {
    font-size: 36px;
    display: block;
    margin-bottom: 8px;
    opacity: 0.6;
  }

  .item-list {
    list-style: none;
  }

  .item-list li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    margin-bottom: 8px;
    background: #f7fbff;
    border-radius: 12px;
    border-left: 4px solid #ff7a45;
    font-size: 15px;
  }

  .item-list li.low-stock {
    border-left-color: #1890ff;
    background: #f0f7ff;
  }

  .item-list li.danger-exp {
    border-left-color: #ff4d4f;
    background: #fff2f0;
  }

  .item-list li:last-child { margin-bottom: 0; }

  .item-name {
    font-weight: 600;
    color: #2c3e50;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .item-sub {
    font-size: 12px;
    color: #8c9bab;
    font-weight: 400;
  }

  .item-tag {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    background: rgba(24, 144, 255, 0.12);
    color: #1890ff;
    margin-left: 8px;
    font-weight: 600;
    vertical-align: middle;
  }

  .expiry-info {
    font-size: 13px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 8px;
    background: #ffe7d6;
    color: #d4380d;
  }

  .expiry-info.danger {
    background: #ffccc7;
    color: #cf1322;
  }

  .stock-info {
    font-size: 13px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 8px;
    background: #d6e4ff;
    color: #0958d9;
  }

  .nav-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #ffffff;
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 14px 16px max(14px, env(safe-area-inset-bottom));
    box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.08);
    border-top: 1px solid rgba(0, 0, 0, 0.06);
    z-index: 999;
  }

  .nav-btn {
    flex: 1;
    max-width: 220px;
    padding: 14px 12px;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.18s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: #fff;
  }

  .nav-btn .btn-ico {
    font-size: 20px;
  }

  .nav-btn.put-in {
    background: linear-gradient(135deg, #52c41a 0%, #73d13d 100%);
    box-shadow: 0 4px 12px rgba(82, 196, 26, 0.35);
  }
  .nav-btn.put-in:active { transform: scale(0.96); box-shadow: 0 2px 6px rgba(82, 196, 26, 0.3); }

  .nav-btn.take-out {
    background: linear-gradient(135deg, #fa8c16 0%, #ffa940 100%);
    box-shadow: 0 4px 12px rgba(250, 140, 22, 0.35);
  }
  .nav-btn.take-out:active { transform: scale(0.96); box-shadow: 0 2px 6px rgba(250, 140, 22, 0.3); }

  .nav-btn.history {
    background: linear-gradient(135deg, #1890ff 0%, #40a9ff 100%);
    box-shadow: 0 4px 12px rgba(24, 144, 255, 0.35);
  }
  .nav-btn.history:active { transform: scale(0.96); box-shadow: 0 2px 6px rgba(24, 144, 255, 0.3); }

  .summary {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 16px 0 8px;
    flex-wrap: wrap;
  }

  .summary-chip {
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(8px);
    padding: 6px 14px;
    border-radius: 16px;
    font-size: 13px;
    font-weight: 500;
    color: #4a6785;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
  }

  .summary-chip strong {
    color: #1890ff;
    margin-right: 2px;
  }

  @media (max-width: 640px) {
    .cards-wrapper {
      grid-template-columns: 1fr;
    }
    .header h1 { font-size: 24px; }
    .card { padding: 20px; }
    .container { padding: 0 12px; margin-top: 16px; }
    .nav-btn { font-size: 13px; padding: 12px 8px; }
    .nav-btn .btn-ico { font-size: 18px; }
  }
</style>
</head>
<body>

<div class="header">
  <span class="fridge-icon">🧊</span>
  <h1>我的冰箱</h1>
  <p>智能管理 · 新鲜不浪费</p>
  <button class="bell-btn" id="bellBtn" title="提醒设置">🔔</button>
</div>

<div class="container">
  <div class="summary">
    <div class="summary-chip">共 <strong id="totalCount">0</strong> 件物品</div>
    <div class="summary-chip">订阅 <strong id="subCount">0</strong> 件</div>
    <div class="summary-chip">临保 <strong id="expCount" style="color:#ff4d4f">0</strong> 件</div>
  </div>

  <div class="cards-wrapper">
    <div class="card">
      <div class="card-header">
        <div class="card-title">
          <span class="warn-icon">⚠️</span>
          临保提醒
          <span class="badge warn" id="expiryBadge">0</span>
        </div>
      </div>
      <div id="expiryList"></div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">
          <span class="low-icon">📉</span>
          存量预警
          <span class="badge blue" id="stockBadge">0</span>
        </div>
      </div>
      <div id="stockList"></div>
    </div>
  </div>
</div>

<div class="nav-bar">
  <button class="nav-btn put-in" id="btnPut">
    <span class="btn-ico">➕</span>
    存入物品
  </button>
  <button class="nav-btn take-out" id="btnTake">
    <span class="btn-ico">➖</span>
    取出物品
  </button>
  <button class="nav-btn history" id="btnHis">
    <span class="btn-ico">📜</span>
    历史记录
  </button>
</div>

<script>
var fridgeData = (function () {
  var DEFAULTS = {
    subscriptions: ["牛奶", "鸡蛋", "吐司"],
    items: [
      { id: 1, name: "牛奶",   category: "乳制品",  expiryDate: "2026-06-24", quantity: 500,  unit: "克", subscribed: true  },
      { id: 2, name: "鸡蛋",   category: "蛋类",    expiryDate: "2026-06-27", quantity: 1,    unit: "件", subscribed: true  },
      { id: 3, name: "吐司",   category: "主食",    expiryDate: "2026-06-25", quantity: 2,    unit: "件", subscribed: true  },
      { id: 4, name: "草莓",   category: "水果",    expiryDate: "2026-06-23", quantity: 500,  unit: "克", subscribed: false },
      { id: 5, name: "酸奶",   category: "乳制品",  expiryDate: "2026-06-30", quantity: 2,    unit: "件", subscribed: false },
      { id: 6, name: "胡萝卜", category: "蔬菜",    expiryDate: "2026-07-05", quantity: 800,  unit: "克", subscribed: false },
      { id: 7, name: "猪肉",   category: "肉类",    expiryDate: "2026-06-28", quantity: 300,  unit: "克", subscribed: true  },
      { id: 8, name: "芒果",   category: "水果",    expiryDate: "2026-06-29", quantity: 4,    unit: "件", subscribed: false }
    ]
  };

  try {
    var raw = localStorage.getItem("fridgeData");
    if (raw) {
      var obj = JSON.parse(raw);
      if (obj && Array.isArray(obj.items)) return obj;
    }
  } catch (e) {}

  try { localStorage.setItem("fridgeData", JSON.stringify(DEFAULTS)); } catch (e) {}
  return DEFAULTS;
})();

function persistFridgeData() {
  try {
    localStorage.setItem("fridgeData", JSON.stringify(fridgeData));
  } catch (e) {}
}

var EXPIRY_THRESHOLD_DAYS = 3;
var LOW_STOCK_THRESHOLD = 3;

function daysUntil(dateStr) {
  var today = new Date();
  today.setHours(0, 0, 0, 0);
  var target = new Date(dateStr);
  target.setHours(0, 0, 0, 0);
  return Math.round((target - today) / (1000 * 60 * 60 * 24));
}

function renderExpiry() {
  var items = fridgeData.items.filter(function(it) {
    return daysUntil(it.expiryDate) <= EXPIRY_THRESHOLD_DAYS;
  });

  var listEl = document.getElementById("expiryList");
  var badge = document.getElementById("expiryBadge");
  badge.textContent = items.length;

  if (items.length === 0) {
    listEl.innerHTML = '<div class="empty-state"><span class="emoji">🌿</span>暂无临保物品</div>';
    return;
  }

  var html = '<ul class="item-list">';
  items.sort(function(a, b) { return daysUntil(a.expiryDate) - daysUntil(b.expiryDate); });

  items.forEach(function(it) {
    var d = daysUntil(it.expiryDate);
    var label;
    var className = "";
    if (d < 0) { label = "已过期"; className = "danger"; }
    else if (d === 0) { label = "今天到期"; className = "danger"; }
    else if (d === 1) { label = "还剩 1 天"; className = "danger"; }
    else { label = "还剩 " + d + " 天"; className = ""; }

    var liClass = d <= 1 ? "danger-exp" : "";
    var tag = it.subscribed ? '<span class="item-tag">订阅</span>' : '';

    html += '<li class="' + liClass + '">'
      + '<div class="item-name">' + it.name + tag + '<span class="item-sub">' + it.category + '</span></div>'
      + '<span class="expiry-info ' + className + '">' + label + '</span>'
      + '</li>';
  });
  html += '</ul>';
  listEl.innerHTML = html;
}

function renderStock() {
  var items = fridgeData.items.filter(function(it) {
    if (!it.subscribed) return false;
    var unit = it.unit || "件";
    var qty = it.quantity;
    if (unit === "件") return qty <= LOW_STOCK_THRESHOLD;
    if (unit === "克") return qty <= 200;
    return qty <= LOW_STOCK_THRESHOLD;
  });

  var listEl = document.getElementById("stockList");
  var badge = document.getElementById("stockBadge");
  badge.textContent = items.length;

  if (items.length === 0) {
    listEl.innerHTML = '<div class="empty-state"><span class="emoji">✅</span>所有订阅物品存量充足</div>';
    return;
  }

  var html = '<ul class="item-list">';
  items.sort(function(a, b) { return a.quantity - b.quantity; });

  items.forEach(function(it) {
    var unit = it.unit || "件";
    var qtyLabel = "剩余 " + it.quantity + " " + unit;
    if (it.quantity === 1 && unit === "件") qtyLabel = "仅剩 1 " + unit;
    if (unit === "克" && it.quantity <= 200) qtyLabel = "仅剩 " + it.quantity + " 克";

    html += '<li class="low-stock">'
      + '<div class="item-name">' + it.name + '<span class="item-sub">订阅 · ' + it.category + '</span></div>'
      + '<span class="stock-info">' + qtyLabel + '</span>'
      + '</li>';
  });
  html += '</ul>';
  listEl.innerHTML = html;
}

function renderSummary() {
  document.getElementById("totalCount").textContent = fridgeData.items.length;
  var subCount = fridgeData.items.filter(function(it) { return it.subscribed; }).length;
  document.getElementById("subCount").textContent = subCount;
  var expCount = fridgeData.items.filter(function(it) {
    return daysUntil(it.expiryDate) <= EXPIRY_THRESHOLD_DAYS;
  }).length;
  document.getElementById("expCount").textContent = expCount;
}

function refreshAll() {
  renderExpiry();
  renderStock();
  renderSummary();
}

document.getElementById("btnPut").addEventListener("click", function() {
  console.log("跳转到存入页面 put-in.html");
  window.location.href = "put-in.html";
});

document.getElementById("bellBtn").addEventListener("click", function() {
  console.log("跳转到提醒设置页面 subscriptions.html");
  window.location.href = "subscriptions.html";
});

document.getElementById("btnTake").addEventListener("click", function() {
  console.log("跳转到取出页面 take-out.html");
  window.location.href = "take-out.html";
});

document.getElementById("btnHis").addEventListener("click", function() {
  console.log("跳转到历史记录页面 history.html");
  window.location.href = "history.html";
});

refreshAll();
</script>
</body>
</html>
