<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>存入物品 - 我的冰箱</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #e0f0ff 0%, #f5faff 50%, #ffffff 100%);
    min-height: 100vh;
    color: #2c3e50;
    padding-bottom: 140px;
  }

  .header {
    background: linear-gradient(135deg, #52c41a 0%, #73d13d 100%);
    color: #fff;
    padding: 28px 24px 32px;
    text-align: center;
    box-shadow: 0 4px 12px rgba(82, 196, 26, 0.3);
    border-radius: 0 0 28px 28px;
    position: relative;
  }

  .header h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 2px;
  }

  .header p {
    font-size: 14px;
    opacity: 0.9;
    margin-top: 6px;
  }

  .header .page-icon {
    font-size: 40px;
    display: block;
    margin-bottom: 6px;
  }

  .back-btn {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255, 255, 255, 0.22);
    border: none;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.18s ease;
  }
  .back-btn:hover { background: rgba(255, 255, 255, 0.35); }

  .container {
    max-width: 640px;
    margin: 24px auto 0;
    padding: 0 16px;
  }

  .form-card {
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06), 0 2px 6px rgba(0, 0, 0, 0.04);
    padding: 24px;
    border: 1px solid rgba(82, 196, 26, 0.08);
  }

  .form-group {
    margin-bottom: 18px;
  }

  .form-group label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #2c3e50;
    margin-bottom: 8px;
  }

  .form-group label .required {
    color: #ff4d4f;
    margin-left: 2px;
  }

  .form-group .note {
    font-size: 12px;
    color: #8c9bab;
    margin-top: 6px;
    line-height: 1.5;
  }

  .form-group .note .highlight {
    color: #1890ff;
    font-weight: 500;
  }

  .form-group input[type="text"],
  .form-group input[type="number"],
  .form-group input[type="date"],
  .form-group select {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    border: 1.5px solid #dbe3ec;
    border-radius: 12px;
    background: #fafbfd;
    color: #2c3e50;
    transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    outline: none;
    font-family: inherit;
  }

  .form-group input:focus,
  .form-group select:focus {
    border-color: #52c41a;
    background: #ffffff;
    box-shadow: 0 0 0 4px rgba(82, 196, 26, 0.12);
  }

  .form-group .error-hint {
    color: #ff4d4f;
    font-size: 12px;
    margin-top: 6px;
    display: none;
  }

  .form-group.error input,
  .form-group.error select {
    border-color: #ff4d4f;
  }

  .form-group.error .error-hint {
    display: block;
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .divider {
    border-top: 1px dashed rgba(0, 0, 0, 0.1);
    margin: 18px 0;
  }

  .actions {
    display: flex;
    gap: 12px;
    margin-top: 26px;
  }

  .btn {
    flex: 1;
    padding: 14px 16px;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    font-family: inherit;
  }

  .btn:active { transform: scale(0.97); }

  .btn-primary {
    background: linear-gradient(135deg, #52c41a 0%, #73d13d 100%);
    color: #fff;
    box-shadow: 0 4px 12px rgba(82, 196, 26, 0.35);
  }
  .btn-primary:hover { opacity: 0.95; }

  .btn-secondary {
    background: #f2f4f7;
    color: #2c3e50;
  }
  .btn-secondary:hover { background: #e6e9ee; }

  .nav-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #ffffff;
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 14px 16px max(14px, env(safe-area-inset-bottom));
    box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.08);
    border-top: 1px solid rgba(0, 0, 0, 0.06);
    z-index: 999;
  }

  .nav-btn {
    flex: 1;
    max-width: 220px;
    padding: 14px 12px;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.18s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: #fff;
    font-family: inherit;
  }

  .nav-btn .btn-ico { font-size: 20px; }
  .nav-btn.put-in { background: linear-gradient(135deg, #52c41a 0%, #73d13d 100%); box-shadow: 0 4px 12px rgba(82, 196, 26, 0.35); }
  .nav-btn.put-in.active { box-shadow: 0 0 0 3px rgba(82,196,26,0.25), 0 4px 12px rgba(82,196,26,0.35); }
  .nav-btn.put-in:active { transform: scale(0.96); }
  .nav-btn.take-out { background: linear-gradient(135deg, #fa8c16 0%, #ffa940 100%); box-shadow: 0 4px 12px rgba(250,140,22,0.35); }
  .nav-btn.take-out:active { transform: scale(0.96); }
  .nav-btn.home { background: linear-gradient(135deg, #1890ff 0%, #40a9ff 100%); box-shadow: 0 4px 12px rgba(24,144,255,0.35); }
  .nav-btn.home:active { transform: scale(0.96); }

  .toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.82);
    color: #fff;
    padding: 12px 22px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    z-index: 9999;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translate(-50%, 4px);
  }

  @media (max-width: 640px) {
    .form-row { grid-template-columns: 1fr; }
    .header h1 { font-size: 22px; }
    .form-card { padding: 20px; }
    .container { padding: 0 12px; margin-top: 16px; }
    .nav-btn { font-size: 13px; padding: 12px 8px; }
    .nav-btn .btn-ico { font-size: 18px; }
  }
</style>
</head>
<body>

<div class="header">
  <button class="back-btn" id="btnBackHeader">← 返回</button>
  <span class="page-icon">➕</span>
  <h1>存入物品</h1>
  <p>往冰箱里加点新鲜的</p>
</div>

<div class="container">
  <div class="form-card">
    <form id="putinForm" novalidate>
      <div class="form-group" id="groupName">
        <label>品名 <span class="required">*</span></label>
        <input type="text" id="name" placeholder="例如：黄瓜 / 牛奶 / 鸡胸肉" maxlength="20" autocomplete="off">
        <div class="error-hint" id="errName">请填写品名</div>
      </div>

      <div class="form-group" id="groupCategory">
        <label>类别 <span class="required">*</span></label>
        <select id="category">
          <option value="">请选择类别</option>
          <option value="蔬菜">蔬菜</option>
          <option value="水果">水果</option>
          <option value="肉类">肉类</option>
          <option value="乳制品">乳制品</option>
          <option value="饮料">饮料</option>
          <option value="其他">其他</option>
        </select>
        <div class="error-hint" id="errCategory">请选择类别</div>
      </div>

      <div class="form-row">
        <div class="form-group" id="groupDate">
          <label>生产日期</label>
          <input type="date" id="produceDate">
        </div>

        <div class="form-group" id="groupShelf">
          <label>保质期（天）</label>
          <input type="number" id="shelfDays" min="1" max="3650" step="1" placeholder="例如：7">
          <div class="note">若填写生产日期，则<span class="highlight">此字段必填</span></div>
          <div class="error-hint" id="errShelf">请填写保质期（天）</div>
        </div>
      </div>

      <div class="form-group" id="groupExpiry">
        <label>到期时间</label>
        <input type="date" id="expiryDate">
        <div class="note">若填写此项，则<span class="highlight">忽略生产日期和保质期</span></div>
        <div class="error-hint" id="errExpiry">请检查到期时间</div>
      </div>

      <div class="form-group" id="groupQty">
        <label>数量</label>
        <input type="number" id="quantity" min="1" max="9999" step="1" value="1">
        <div class="note">果蔬肉类可保持默认 1</div>
      </div>

      <div class="divider"></div>

      <div class="actions">
        <button type="button" class="btn btn-secondary" id="btnBack">返回</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<div class="nav-bar">
  <button class="nav-btn home" id="btnHome">
    <span class="btn-ico">🏠</span>
    主页面
  </button>
  <button class="nav-btn put-in active">
    <span class="btn-ico">➕</span>
    存入物品
  </button>
  <button class="nav-btn take-out" id="btnTake">
    <span class="btn-ico">➖</span>
    取出物品
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  var MAIN_PAGE = "fridge-dashboard.html";

  function showToast(msg, duration) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(el._t);
    el._t = setTimeout(function () {
      el.classList.remove("show");
    }, duration || 1600);
  }

  function goHome() {
    window.location.href = MAIN_PAGE;
  }

  function todayISO() {
    var d = new Date();
    d.setHours(0, 0, 0, 0);
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var dd = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + dd;
  }

  function computeExpiry(produceISO, shelfDays) {
    if (!produceISO || !shelfDays) return null;
    var p = new Date(produceISO);
    if (isNaN(p.getTime())) return null;
    var d = new Date(p.getTime());
    d.setDate(d.getDate() + parseInt(shelfDays, 10));
    if (isNaN(d.getTime())) return null;
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var dd = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + dd;
  }

  function getFridgeData() {
    try {
      var raw = localStorage.getItem("fridgeData");
      if (raw) {
        var obj = JSON.parse(raw);
        if (obj && Array.isArray(obj.items)) return obj;
      }
    } catch (e) {}
    return { items: [] };
  }

  function saveFridgeData(data) {
    try {
      localStorage.setItem("fridgeData", JSON.stringify(data));
    } catch (e) {}
  }

  function setError(groupId, errId, msg) {
    if (groupId) {
      document.getElementById(groupId).classList.toggle("error", !!msg);
    }
    if (errId) {
      var el = document.getElementById(errId);
      if (el) el.textContent = msg || "";
    }
  }

  function validate(form) {
    var name = form.name.value.trim();
    var category = form.category.value;
    var produceDate = form.produceDate.value.trim();
    var shelfDaysRaw = form.shelfDays.value.trim();
    var expiryDate = form.expiryDate.value.trim();
    var qtyRaw = form.quantity.value.trim();

    setError("groupName", "errName", null);
    setError("groupCategory", null, null);
    setError("groupShelf", "errShelf", null);
    setError("groupExpiry", "errExpiry", null);

    var ok = true;

    if (!name) {
      setError("groupName", "errName", "请填写品名");
      ok = false;
    }

    if (!category) {
      setError("groupCategory", null, null);
      document.getElementById("groupCategory").classList.add("error");
      ok = false;
    } else {
      document.getElementById("groupCategory").classList.remove("error");
    }

    if (expiryDate) {
      if (isNaN(new Date(expiryDate).getTime())) {
        setError("groupExpiry", "errExpiry", "到期时间格式不正确");
        ok = false;
      }
    } else {
      if (produceDate && !shelfDaysRaw) {
        setError("groupShelf", "errShelf", "已填写生产日期，保质期必填");
        ok = false;
      }
      if (produceDate && shelfDaysRaw) {
        var shelfNum = parseInt(shelfDaysRaw, 10);
        if (isNaN(shelfNum) || shelfNum <= 0) {
          setError("groupShelf", "errShelf", "保质期必须是大于 0 的整数");
          ok = false;
        }
      }
      if (!expiryDate && !produceDate && !shelfDaysRaw) {
        setError("groupExpiry", "errExpiry", "请至少填写到期时间，或（生产日期+保质期）");
        ok = false;
      }
    }

    if (!qtyRaw) qtyRaw = "1";
    var qtyNum = parseInt(qtyRaw, 10);
    if (isNaN(qtyNum) || qtyNum <= 0) {
      document.getElementById("groupQty").classList.add("error");
      ok = false;
    } else {
      document.getElementById("groupQty").classList.remove("error");
    }

    if (!ok) return null;

    var finalExpiry;
    if (expiryDate) {
      finalExpiry = expiryDate;
    } else {
      finalExpiry = computeExpiry(produceDate, parseInt(shelfDaysRaw, 10));
    }

    if (!finalExpiry) {
      setError("groupExpiry", "errExpiry", "无法计算到期时间，请检查日期");
      return null;
    }

    var fridge = getFridgeData();
    var maxId = 0;
    fridge.items.forEach(function (it) {
      if (it && typeof it.id === "number" && it.id > maxId) maxId = it.id;
    });

    var newItem = {
      id: maxId + 1,
      name: name,
      category: category,
      expiryDate: finalExpiry,
      quantity: qtyNum,
      subscribed: false
    };

    fridge.items.push(newItem);
    saveFridgeData(fridge);

    return newItem;
  }

  document.getElementById("putinForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var form = e.target;
    var item = validate(form);
    if (!item) return;

    showToast("存入成功！", 1400);
    setTimeout(function () {
      goHome();
    }, 900);
  });

  document.getElementById("btnBack").addEventListener("click", goHome);
  document.getElementById("btnBackHeader").addEventListener("click", goHome);
  document.getElementById("btnHome").addEventListener("click", goHome);

  document.getElementById("btnTake").addEventListener("click", function () {
    alert("取出页面：功能预留，可后续集成。");
  });

  (function init() {
    var today = todayISO();
    document.getElementById("produceDate").setAttribute("max", "9999-12-31");
    document.getElementById("expiryDate").setAttribute("min", today);
  })();
})();
</script>
</body>
</html>
