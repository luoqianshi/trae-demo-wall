<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>取出物品 - 我的冰箱</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #fff4e6 0%, #fff8f0 50%, #ffffff 100%);
    min-height: 100vh;
    color: #2c3e50;
  }

  .header {
    background: linear-gradient(135deg, #fa8c16 0%, #ffa940 100%);
    color: #fff;
    padding: 24px 20px 20px;
    border-radius: 0 0 28px 28px;
    box-shadow: 0 4px 12px rgba(250, 140, 22, 0.3);
    position: relative;
  }

  .header .back {
    position: absolute;
    left: 16px;
    top: 16px;
    background: rgba(255, 255, 255, 0.25);
    border: none;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
// 之前
{ id, name, category, expiryDate, quantity, subscribed }

// 现在（新增 unit）
{ id, name, category, expiryDate, quantity, unit, subscribed }
// unit: "件" | "克"
  .header h1 { font-size: 22px; font-weight: 700; text-align: center; margin-top: 4px; }
  .header .sub { text-align: center; font-size: 12.5px; opacity: 0.88; margin-top: 6px; }

  .container { max-width: 640px; margin: 20px auto 40px; padding: 0 16px; }

  .summary { display: flex; justify-content: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .summary-chip {
    background: #fff; padding: 6px 14px; border-radius: 16px; font-size: 13px;
    font-weight: 500; color: #5a7a9a; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
  }
  .summary-chip strong { color: #fa8c16; margin-right: 2px; }

  .category { margin-bottom: 18px; }

  .cat-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; margin-bottom: 10px;
    background: rgba(250, 140, 22, 0.1); border-radius: 12px;
  }
  .cat-head .cat-label { font-size: 14px; font-weight: 700; color: #d46b08; display: flex; align-items: center; gap: 8px; }
  .cat-head .cat-count { font-size: 12px; color: #d46b08; font-weight: 600; padding: 2px 10px; background: rgba(255,255,255,0.7); border-radius: 10px; }

  .cat-list { background: #fff; border-radius: 16px; box-shadow: 0 4px 14px rgba(0,0,0,0.06); overflow: hidden; }
  .cat-list .item {
    display: flex; align-items: center; padding: 14px 16px;
    border-bottom: 1px solid rgba(0,0,0,0.04);
    cursor: pointer; transition: background 0.12s;
  }
  .cat-list .item:last-child { border-bottom: none; }
  .cat-list .item:hover { background: #fff8ef; }
  .cat-list .item:active { background: #ffe7cc; }

  .cat-list .item .info { flex: 1; min-width: 0; }
  .cat-list .item .name { font-size: 15.5px; font-weight: 600; color: #2c3e50; }
  .cat-list .item .meta { font-size: 12px; color: #9aa9b8; margin-top: 3px; }
  .cat-list .item .meta .sep { margin: 0 6px; color: #c5d0da; }
  .cat-list .item .meta .exp-soon { color: #ff4d4f; font-weight: 600; }

  .cat-list .item .qty {
    background: linear-gradient(135deg, #fa8c16, #ffa940);
    color: #fff; font-size: 14px; font-weight: 700;
    padding: 6px 12px; border-radius: 18px; margin-right: 10px;
    box-shadow: 0 2px 8px rgba(250, 140, 22, 0.35);
  }
  .cat-list .item .unit-tag {
    background: rgba(255,255,255,0.8); color: #d46b08;
    font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 8px;
    margin-right: 10px;
  }

  .cat-list .item .arrow { color: #c5d0da; font-size: 16px; flex-shrink: 0; }

  .empty { padding: 60px 20px; text-align: center; color: #9aa9b8; font-size: 14px; }
  .empty .ico { font-size: 56px; display: block; margin-bottom: 10px; opacity: 0.7; }

  .mask {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    z-index: 999; display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.18s; padding: 0 24px;
  }
  .mask.show { opacity: 1; pointer-events: auto; }

  .modal {
    background: #fff; border-radius: 20px;
    padding: 24px 24px 20px; width: 100%; max-width: 360px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    transform: translateY(20px) scale(0.96); transition: transform 0.2s;
  }
  .mask.show .modal { transform: translateY(0) scale(1); }

  .modal .title { font-size: 17px; font-weight: 700; color: #2c3e50; text-align: center; margin-bottom: 14px; line-height: 1.5; }
  .modal .name-chip { display: inline-block; background: rgba(250,140,22,0.12); color: #d46b08; padding: 2px 10px; border-radius: 10px; font-weight: 700; margin: 0 3px; }

  .modal .preview {
    background: #fafbfe; border-radius: 12px; padding: 12px 14px;
    margin-bottom: 18px; font-size: 13px; color: #5a7a9a;
    display: flex; justify-content: space-between; align-items: center;
  }

  .modal .qty-input-wrap { margin-bottom: 18px; }
  .modal .qty-input-wrap label {
    display: block; font-size: 13px; font-weight: 600; color: #34495e; margin-bottom: 8px;
  }
  .modal .qty-input {
    width: 100%; padding: 12px 14px; font-size: 16px; font-weight: 600;
    border: 1.5px solid #dfe5ed; border-radius: 12px; background: #f8fbff;
    outline: none; font-family: inherit; text-align: center;
    transition: border-color 0.18s, box-shadow 0.18s;
  }
  .modal .qty-input:focus { border-color: #fa8c16; box-shadow: 0 0 0 3px rgba(250,140,22,0.15); }
  .modal .qty-input.error { border-color: #ff4d4f; background: #fff5f5; }

  .modal .qty-hint { font-size: 11.5px; color: #8c9bab; margin-top: 6px; text-align: center; }

  .modal .btns { display: flex; gap: 10px; margin-bottom: 8px; }
  .modal .btn {
    flex: 1; padding: 13px 10px; border: none; border-radius: 12px;
    font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }

  .modal .btn.primary {
    background: linear-gradient(135deg, #fa8c16, #ffa940); color: #fff;
    box-shadow: 0 3px 10px rgba(250, 140, 22, 0.35);
  }
  .modal .btn.primary:active { transform: scale(0.96); }

  .modal .btn.danger {
    background: #fff1f0; color: #ff4d4f; box-shadow: inset 0 0 0 1px #ffccc7;
  }
  .modal .btn.danger:active { transform: scale(0.96); background: #ffe6e6; }

  .modal .cancel {
    width: 100%; padding: 11px 10px; border: none; background: #eef2f7;
    border-radius: 12px; color: #4a6785; font-size: 13px; font-weight: 500;
    cursor: pointer; font-family: inherit; transition: background 0.12s;
  }
  .modal .cancel:hover { background: #e1e7f0; }

  .toast {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: #fff; color: #2c3e50; padding: 12px 20px; border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15); font-size: 13px; font-weight: 500;
    display: flex; align-items: center; gap: 8px;
    opacity: 0; pointer-events: none; transition: all 0.25s ease; z-index: 1001;
    border-left: 4px solid #fa8c16;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 480px) {
    .header h1 { font-size: 20px; }
    .container { padding: 0 12px; }
    .modal { padding: 20px 18px 16px; }
  }
</style>
</head>
<body>

<div class="header">
  <button class="back" id="backBtn" title="返回主页">‹</button>
  <h1>➖ 取出物品</h1>
  <div class="sub">点击物品即可取出或整份拿走</div>
</div>

<div class="container">
  <div class="summary">
    <div class="summary-chip">共 <strong id="totalCount">0</strong> 件物品</div>
    <div class="summary-chip"><strong id="catCount">0</strong> 个类别</div>
  </div>
  <div id="groupWrap"></div>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <div class="title" id="modalTitle">取出 <span id="mName"></span>？</div>
    <div class="preview" id="modalPreview"></div>
    <div id="modalDynamicArea"></div>
    <div class="btns" id="modalBtns"></div>
    <button class="cancel" id="btnCancel">取消</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var STORAGE_KEY = "fridgeData";
var HISTORY_KEY = "fridgeHistory";
var CATEGORY_ORDER = ["蔬菜", "水果", "肉类", "乳制品", "饮料", "主食", "蛋类", "其他"];
var CATEGORY_ICON = {
  "蔬菜": "🥬", "水果": "🍎", "肉类": "🍖", "乳制品": "🥛",
  "饮料": "🥤", "主食": "🍞", "蛋类": "🥚", "其他": "🍱"
};

var currentItemId = null;

function loadData() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) { return null; }
}
function saveData(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

function loadHistory() {
  try { var r = localStorage.getItem(HISTORY_KEY); return r ? JSON.parse(r) : []; }
  catch (e) { return []; }
}
function saveHistory(arr) { localStorage.setItem(HISTORY_KEY, JSON.stringify(arr)); }

function addHistoryLog(action, itemName, quantityChange) {
  var arr = loadHistory();
  arr.unshift({ timestamp: new Date().toISOString(), action: action, itemName: itemName, quantityChange: quantityChange });
  if (arr.length > 500) arr = arr.slice(0, 500);
  saveHistory(arr);
}

function escape(str) {
  return String(str).replace(/[&<>"']/g, function(c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function daysUntil(dateStr) {
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var target = new Date(dateStr); target.setHours(0, 0, 0, 0);
  return Math.round((target - today) / 86400000);
}

function render() {
  var data = loadData();
  var wrap = document.getElementById("groupWrap");

  if (!data || !data.items || data.items.length === 0) {
    wrap.innerHTML = '<div class="empty"><span class="ico">🧊</span>冰箱里空空如也，去存入一些食材吧～</div>';
    document.getElementById("totalCount").textContent = "0";
    document.getElementById("catCount").textContent = "0";
    return;
  }

  var groups = {};
  data.items.forEach(function(it) {
    var c = it.category || "其他";
    if (!groups[c]) groups[c] = [];
    groups[c].push(it);
  });

  var cats = Object.keys(groups);
  document.getElementById("totalCount").textContent = data.items.length;
  document.getElementById("catCount").textContent = cats.length;

  var html = "";

  CATEGORY_ORDER.forEach(function(cat) {
    if (!groups[cat]) return;
    var list = groups[cat];
    var icon = CATEGORY_ICON[cat] || "🍱";
    html += renderCategoryHTML(cat, icon, list);
  });

  cats.filter(function(c) { return CATEGORY_ORDER.indexOf(c) === -1; }).forEach(function(cat) {
    html += renderCategoryHTML(cat, "🍱", groups[cat]);
  });

  wrap.innerHTML = html;

  wrap.querySelectorAll(".item").forEach(function(el) {
    el.addEventListener("click", function() {
      var id = parseInt(el.getAttribute("data-id"), 10);
      openModal(id);
    });
  });
}

function renderCategoryHTML(cat, icon, list) {
  var html = '<div class="category">' +
    '<div class="cat-head"><div class="cat-label">' + icon + ' ' + escape(cat) + '</div><div class="cat-count">' + list.length + ' 件</div></div>' +
    '<div class="cat-list">';
  list.forEach(function(it) {
    var d = daysUntil(it.expiryDate);
    var soon = d <= 3 ? 'exp-soon' : '';
    var unit = it.unit || "件";
    var unitIcon = unit === "克" ? "⚖️" : "📦";
    html +=
      '<div class="item" data-id="' + it.id + '">' +
        '<div class="info">' +
          '<div class="name">' + escape(it.name) + '</div>' +
          '<div class="meta">' +
            '<span class="' + soon + '">到期 ' + escape(it.expiryDate) + '</span>' +
            '<span class="sep">·</span>' +
            '<span>剩余 ' + it.quantity + ' ' + escape(unit) + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="unit-tag">' + unitIcon + ' ' + escape(unit) + '</div>' +
        '<div class="qty">' + it.quantity + '</div>' +
        '<div class="arrow">›</div>' +
      '</div>';
  });
  html += '</div></div>';
  return html;
}

function getItemById(id) {
  var data = loadData();
  if (!data || !data.items) return null;
  for (var i = 0; i < data.items.length; i++) {
    if (data.items[i].id === id) return data.items[i];
  }
  return null;
}

function openModal(id) {
  var it = getItemById(id);
  if (!it) return;
  currentItemId = id;
  var unit = it.unit || "件";

  document.getElementById("modalTitle").innerHTML =
    '取出 <span class="name-chip">' + escape(it.name) + '</span>？';

  document.getElementById("modalPreview").innerHTML =
    '<span>当前剩余</span>' +
    '<span style="font-weight:700;color:#d46b08;">' + it.quantity + ' ' + escape(unit) + '</span>';

  var dynamicArea = document.getElementById("modalDynamicArea");
  var btns = document.getElementById("modalBtns");

  if (unit === "件") {
    dynamicArea.innerHTML = "";
    if (it.quantity <= 1) {
      btns.innerHTML =
        '<button class="btn primary" id="btnTakeOne">取出最后 1 件</button>' +
        '<button class="btn danger" id="btnTakeAll">全部取出</button>';
    } else {
      btns.innerHTML =
        '<button class="btn primary" id="btnTakeOne">取出 1 件</button>' +
        '<button class="btn danger" id="btnTakeAll">全部取出（' + it.quantity + ' 件）</button>';
    }
    document.getElementById("btnTakeOne").addEventListener("click", doTakeOnePiece);
    document.getElementById("btnTakeAll").addEventListener("click", doTakeAll);
  } else {
    dynamicArea.innerHTML =
      '<div class="qty-input-wrap">' +
        '<label>请输入要取出的克数</label>' +
        '<input type="number" class="qty-input" id="gramsInput" min="1" max="' + it.quantity + '" placeholder="例如：200">' +
        '<div class="qty-hint">最小 1 克，最大 ' + it.quantity + ' 克（超出会自动取出全部）</div>' +
      '</div>';
    btns.innerHTML =
      '<button class="btn primary" id="btnConfirm">确认取出</button>' +
      '<button class="btn danger" id="btnTakeAll">全部取出（' + it.quantity + ' 克）</button>';
    document.getElementById("btnConfirm").addEventListener("click", doTakeGrams);
    document.getElementById("btnTakeAll").addEventListener("click", doTakeAll);
    setTimeout(function() {
      var inp = document.getElementById("gramsInput");
      if (inp) inp.focus();
    }, 60);
  }

  document.getElementById("mask").classList.add("show");
}

function closeModal() {
  document.getElementById("mask").classList.remove("show");
  currentItemId = null;
}

function getCurrentItem() {
  if (currentItemId == null) return null;
  return getItemById(currentItemId);
}

function locateInData(id) {
  var data = loadData();
  if (!data || !data.items) return { data: data, it: null, idx: -1 };
  for (var i = 0; i < data.items.length; i++) {
    if (data.items[i].id === id) return { data: data, it: data.items[i], idx: i };
  }
  return { data: data, it: null, idx: -1 };
}

function doTakeOnePiece() {
  var loc = locateInData(currentItemId);
  if (!loc.it) return;

  if (loc.it.quantity <= 1) {
    addHistoryLog("删除", loc.it.name, "-1件");
    loc.data.items.splice(loc.idx, 1);
    showToast("已取出 " + loc.it.name + "，冰箱里没有了");
  } else {
    loc.it.quantity -= 1;
    addHistoryLog("取出", loc.it.name, "-1件");
    showToast("已取出 1 件 " + loc.it.name + "，剩余 " + loc.it.quantity + " 件");
  }

  saveData(loc.data);
  closeModal();
  render();
}

function doTakeGrams() {
  var loc = locateInData(currentItemId);
  if (!loc.it) return;

  var inp = document.getElementById("gramsInput");
  if (!inp) return;

  var takeG = parseInt(inp.value, 10);
  if (!takeG || takeG <= 0) {
    inp.classList.add("error");
    showToast("请输入要取出的克数（大于 0）", true);
    clearTimeout(doTakeGrams._t);
    doTakeGrams._t = setTimeout(function() { inp.classList.remove("error"); }, 1500);
    return;
  }

  var unit = loc.it.unit || "克";

  if (takeG >= loc.it.quantity) {
    addHistoryLog("删除", loc.it.name, "-" + loc.it.quantity + unit);
    loc.data.items.splice(loc.idx, 1);
    showToast("已取出全部 " + loc.it.quantity + " 克 " + loc.it.name);
  } else {
    loc.it.quantity -= takeG;
    addHistoryLog("取出", loc.it.name, "-" + takeG + unit);
    showToast("已取出 " + takeG + " 克 " + loc.it.name + "，剩余 " + loc.it.quantity + " 克");
  }

  saveData(loc.data);
  closeModal();
  render();
}

function doTakeAll() {
  var loc = locateInData(currentItemId);
  if (!loc.it) return;
  var unit = loc.it.unit || "件";
  var removed = loc.it.quantity;
  addHistoryLog("删除", loc.it.name, "-" + removed + unit);
  loc.data.items.splice(loc.idx, 1);
  saveData(loc.data);
  showToast("已全部取出 " + removed + " " + unit + " " + loc.it.name);
  closeModal();
  render();
}

function showToast(msg) {
  var t = document.getElementById("toast");
  t.textContent = "✅ " + msg;
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(function() { t.classList.remove("show"); }, 1600);
}

document.getElementById("backBtn").addEventListener("click", function() {
  window.location.href = "fridge-dashboard.html";
});

document.getElementById("btnCancel").addEventListener("click", closeModal);

document.getElementById("mask").addEventListener("click", function(e) {
  if (e.target === document.getElementById("mask")) closeModal();
});

document.addEventListener("keydown", function(e) {
  if (e.key === "Escape" && currentItemId != null) closeModal();
  if (e.key === "Enter" && currentItemId != null) {
    var c = document.getElementById("gramsInput");
    if (c && c.value) {
      var btn = document.getElementById("btnConfirm");
      if (btn) btn.click();
    }
  }
});

render();
</script>
</body>
</html>
