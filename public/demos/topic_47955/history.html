<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>历史记录 - 我的冰箱</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #e0f0ff 0%, #f5faff 50%, #ffffff 100%);
    min-height: 100vh;
    color: #2c3e50;
  }

  .header {
    background: linear-gradient(135deg, #4da6ff 0%, #66b3ff 100%);
    color: #fff;
    padding: 24px 20px 20px;
    border-radius: 0 0 28px 28px;
    box-shadow: 0 4px 12px rgba(77, 166, 255, 0.3);
    position: relative;
  }

  .header .back {
    position: absolute;
    left: 16px;
    top: 16px;
    background: rgba(255, 255, 255, 0.25);
    border: none;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .header h1 {
    font-size: 22px;
    font-weight: 700;
    text-align: center;
    margin-top: 4px;
  }

  .header .sub {
    text-align: center;
    font-size: 12.5px;
    opacity: 0.85;
    margin-top: 6px;
  }

  .container {
    max-width: 640px;
    margin: 20px auto 32px;
    padding: 0 16px;
  }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .toolbar .count {
    font-size: 13px;
    color: #5a7a9a;
    font-weight: 500;
  }

  .toolbar .count strong { color: #1890ff; margin: 0 2px; }

  .toolbar .clear-btn {
    background: #fff;
    border: 1px solid #e0e8f1;
    color: #ff4d4f;
    font-size: 12.5px;
    padding: 6px 14px;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }

  .toolbar .clear-btn:hover { background: #fff1f0; border-color: #ffccc7; }

  .card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06), 0 2px 6px rgba(0, 0, 0, 0.04);
    overflow: hidden;
  }

  .empty {
    padding: 56px 20px;
    text-align: center;
    color: #9aa9b8;
    font-size: 14px;
  }

  .empty .ico { font-size: 56px; display: block; margin-bottom: 10px; opacity: 0.65; }

  .log-item {
    display: flex;
    align-items: center;
    padding: 14px 18px;
    border-bottom: 1px solid rgba(0, 0, 0, 0.04);
    gap: 12px;
  }

  .log-item:last-child { border-bottom: none; }

  .log-item .ico {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .log-item .ico.put {
    background: rgba(82, 196, 26, 0.12);
  }
  .log-item .ico.take {
    background: rgba(250, 140, 22, 0.12);
  }
  .log-item .ico.del {
    background: rgba(255, 77, 79, 0.12);
  }

  .log-item .main {
    flex: 1;
    min-width: 0;
  }

  .log-item .row1 {
    font-size: 15px;
    font-weight: 600;
    color: #2c3e50;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .log-item .row1 .name {
    color: #2c3e50;
  }

  .log-item .row1 .qty {
    font-size: 14px;
    font-weight: 700;
    padding: 2px 9px;
    border-radius: 8px;
  }

  .log-item .row1 .qty.put {
    background: rgba(82, 196, 26, 0.12);
    color: #389e0d;
  }
  .log-item .row1 .qty.take {
    background: rgba(250, 140, 22, 0.14);
    color: #d46b08;
  }
  .log-item .row1 .qty.del {
    background: rgba(255, 77, 79, 0.14);
    color: #cf1322;
  }

  .log-item .row2 {
    font-size: 12px;
    color: #9aa9b8;
    margin-top: 4px;
  }

  .log-item .act-tag {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 8px;
    margin-right: 6px;
    flex-shrink: 0;
  }

  .log-item .act-tag.put { background: rgba(82, 196, 26, 0.1); color: #389e0d; }
  .log-item .act-tag.take { background: rgba(250, 140, 22, 0.1); color: #d46b08; }
  .log-item .act-tag.del  { background: rgba(255, 77, 79, 0.1); color: #cf1322; }

  .toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: #fff;
    color: #2c3e50;
    padding: 12px 20px;
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s ease;
    z-index: 1000;
    border-left: 4px solid #4da6ff;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 480px) {
    .header h1 { font-size: 20px; }
    .container { padding: 0 12px; }
    .card { border-radius: 16px; }
    .log-item { padding: 12px 14px; }
    .log-item .ico { width: 36px; height: 36px; font-size: 16px; border-radius: 10px; }
  }
</style>
</head>
<body>

<div class="header">
  <button class="back" id="backBtn" title="返回主页">‹</button>
  <h1>📜 历史记录</h1>
  <div class="sub">查看所有存取操作日志</div>
</div>

<div class="container">
  <div class="toolbar">
    <div class="count">共 <strong id="totalCount">0</strong> 条记录（显示最近 64 条）</div>
    <button class="clear-btn" id="clearBtn">清空记录</button>
  </div>

  <div class="card" id="logWrap"></div>
</div>

<div class="toast" id="toast"></div>

<script>
var HISTORY_KEY = "fridgeHistory";
var MAX_SHOW = 64;

function loadHistory() {
  try {
    var raw = localStorage.getItem(HISTORY_KEY);
    if (!raw) return [];
    var arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch (e) {
    return [];
  }
}

function saveHistory(arr) {
  try {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(arr));
  } catch (e) {}
}

function fmtDate(ts) {
  if (!ts) return "";
  var d = new Date(ts);
  if (isNaN(d.getTime())) return ts;
  var pad = function(n) { return n < 10 ? "0" + n : "" + n; };
  var today = new Date();
  today.setHours(0, 0, 0, 0);
  var target = new Date(d);
  target.setHours(0, 0, 0, 0);
  var dayDiff = Math.round((target - today) / 86400000);

  var datePart;
  if (dayDiff === 0) datePart = "今天";
  else if (dayDiff === -1) datePart = "昨天";
  else if (dayDiff === -2) datePart = "前天";
  else datePart = (d.getMonth() + 1) + "月" + d.getDate() + "日";

  var timePart = pad(d.getHours()) + ":" + pad(d.getMinutes());
  return datePart + " " + timePart;
}

function render() {
  var all = loadHistory();
  var show = all.slice(0, MAX_SHOW);

  document.getElementById("totalCount").textContent = all.length;

  var wrap = document.getElementById("logWrap");

  if (show.length === 0) {
    wrap.innerHTML = '<div class="empty">' +
      '<span class="ico">📭</span>' +
      '还没有任何操作记录。<br>存入或取出物品后，操作会自动记录在这里。' +
      '</div>';
    return;
  }

  var html = "";
  for (var i = 0; i < show.length; i++) {
    var e = show[i];
    var act = e.action || "操作";
    var cls = "put";
    var icon = "";
    if (act === "存入") { cls = "put"; icon = "➕"; }
    else if (act === "取出") { cls = "take"; icon = "➖"; }
    else if (act === "删除") { cls = "del"; icon = "🗑️"; }
    else { cls = "put"; icon = "•"; }

    var qty = e.quantityChange != null ? ("" + e.quantityChange) : "";

    html +=
      '<div class="log-item">' +
        '<div class="ico ' + cls + '">' + icon + '</div>' +
        '<div class="main">' +
          '<div class="row1">' +
            '<span class="act-tag ' + cls + '">' + act + '</span>' +
            '<span class="name">' + escape(e.itemName || "(未知)") + '</span>' +
            (qty ? '<span class="qty ' + cls + '">' + escape(qty) + '</span>' : '') +
          '</div>' +
          '<div class="row2">' + fmtDate(e.timestamp) + '</div>' +
        '</div>' +
      '</div>';
  }

  wrap.innerHTML = html;
}

function escape(str) {
  return String(str).replace(/[&<>"']/g, function(c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function showToast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(function() {
    t.classList.remove("show");
  }, 1600);
}

document.getElementById("backBtn").addEventListener("click", function() {
  window.location.href = "fridge-dashboard.html";
});

document.getElementById("clearBtn").addEventListener("click", function() {
  var ok = window.confirm("确定清空全部操作记录吗？此操作不可恢复。");
  if (!ok) return;
  saveHistory([]);
  showToast("已清空历史记录");
  render();
});

render();
</script>
</body>
</html>
