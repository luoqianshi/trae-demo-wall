<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>方案库 - Budget Buddy 预算伙伴</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-layout">
    <header class="header">
      <div class="header-inner">
        <a href="index.html" class="header-logo">
          <div class="header-logo-icon"><span class="icon" data-icon="abacus"></span></div>
          <span class="header-logo-text">Budget Buddy</span>
        </a>
        
        <nav class="header-nav">
          <a href="index.html" class="header-nav-item">
            <span class="header-nav-icon"><span class="icon" data-icon="home"></span></span>
            <span>首页</span>
          </a>
          <a href="templates.html" class="header-nav-item active">
            <span class="header-nav-icon"><span class="icon" data-icon="templates"></span></span>
            <span>方案库</span>
          </a>
          <a href="customize.html" class="header-nav-item">
            <span class="header-nav-icon"><span class="icon" data-icon="customize"></span></span>
            <span>定制预算</span>
          </a>
          <a href="profile.html" class="header-nav-item">
            <span class="header-nav-icon"><span class="icon" data-icon="profile"></span></span>
            <span>我的方案</span>
          </a>
        </nav>

        <div class="header-search">
          <div class="search-bar">
            <span class="search-icon"><span class="icon" data-icon="search"></span></span>
            <input type="text" placeholder="搜索预算方案、活动类型、关键词..." id="searchInput">
          </div>
        </div>

        <div class="header-actions">
          <button class="topbar-icon-btn" title="通知"><span class="icon" data-icon="bell"></span></button>
          <button class="topbar-icon-btn" title="收藏"><span class="icon" data-icon="heart"></span></button>
          <div class="topbar-avatar" title="个人中心"><span class="icon" data-icon="user"></span></div>
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="page-content">
        <div class="page-header-simple">
          <div class="breadcrumb">
            <a href="index.html">首页</a>
            <span class="breadcrumb-sep">/</span>
            <span>方案库</span>
          </div>
          <h1 class="page-title">预算方案库</h1>
          <p class="page-subtitle">精选优质活动预算方案，即取即用，省心省力</p>
        </div>

        <div class="filter-section">
          <div class="filter-group">
            <span class="filter-group-label">预算区间</span>
            <div class="filter-tags" id="budgetFilterTags">
              <span class="filter-tag active" data-value="all" onclick="filterByBudget(this, 'all')">全部</span>
              <span class="filter-tag" data-value="0-10000" onclick="filterByBudget(this, '0-10000')">1万以下</span>
              <span class="filter-tag" data-value="10000-50000" onclick="filterByBudget(this, '10000-50000')">1-5万</span>
              <span class="filter-tag" data-value="50000-100000" onclick="filterByBudget(this, '50000-100000')">5-10万</span>
              <span class="filter-tag" data-value="100000-500000" onclick="filterByBudget(this, '100000-500000')">10-50万</span>
              <span class="filter-tag" data-value="500000+" onclick="filterByBudget(this, '500000+')">50万以上</span>
            </div>
          </div>
          <div class="filter-group">
            <span class="filter-group-label">参与人数</span>
            <div class="filter-tags" id="peopleFilterTags">
              <span class="filter-tag active" data-value="all" onclick="filterByPeople(this, 'all')">全部</span>
              <span class="filter-tag" data-value="0-20" onclick="filterByPeople(this, '0-20')">20人以下</span>
              <span class="filter-tag" data-value="20-50" onclick="filterByPeople(this, '20-50')">20-50人</span>
              <span class="filter-tag" data-value="50-100" onclick="filterByPeople(this, '50-100')">50-100人</span>
              <span class="filter-tag" data-value="100-200" onclick="filterByPeople(this, '100-200')">100-200人</span>
              <span class="filter-tag" data-value="200+" onclick="filterByPeople(this, '200+')">200人以上</span>
            </div>
          </div>
        </div>

        <div class="result-sort-bar">
          <div class="result-count" id="resultCount">共 0 个方案</div>
          <div class="sort-dropdown">
            <select id="sortSelect" onchange="renderTemplatesList()">
              <option value="popular">最受欢迎</option>
              <option value="rating">评分最高</option>
              <option value="price-asc">价格从低到高</option>
              <option value="price-desc">价格从高到低</option>
            </select>
          </div>
        </div>

        <div class="templates-grid" id="templatesGrid">
        </div>

        <footer class="footer">
          <p class="footer-slogan"><span data-icon="abacus"></span> <strong>Budget Buddy 预算伙伴</strong> — 让每一次活动预算都简单高效</p>
        </footer>
      </div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    initTemplatesPage();
  </script>
</body>
</html>
