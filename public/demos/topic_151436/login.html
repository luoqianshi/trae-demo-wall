<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录注册 - Budget Buddy 预算伙伴</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-layout">
    <header class="header">
      <div class="header-inner">
        <a href="index.html" class="header-logo">
          <div class="header-logo-icon"><span class="icon" data-icon="abacus"></span></div>
          <span class="header-logo-text">Budget Buddy</span>
        </a>

        <nav class="header-nav">
          <a href="index.html" class="header-nav-item">
            <span class="header-nav-icon"><span class="icon" data-icon="home"></span></span>
            <span>首页</span>
          </a>
          <a href="templates.html" class="header-nav-item">
            <span class="header-nav-icon"><span class="icon" data-icon="templates"></span></span>
            <span>方案库</span>
          </a>
          <a href="customize.html" class="header-nav-item">
            <span class="header-nav-icon"><span class="icon" data-icon="customize"></span></span>
            <span>定制预算</span>
          </a>
          <a href="profile.html" class="header-nav-item">
            <span class="header-nav-icon"><span class="icon" data-icon="profile"></span></span>
            <span>我的方案</span>
          </a>
        </nav>

        <div class="header-search">
          <div class="search-bar">
            <span class="search-icon"><span class="icon" data-icon="search"></span></span>
            <input type="text" placeholder="搜索预算方案、活动类型、关键词...">
          </div>
        </div>

        <div class="header-actions">
          <button class="topbar-icon-btn" title="通知"><span class="icon" data-icon="bell"></span></button>
          <button class="topbar-icon-btn" title="收藏"><span class="icon" data-icon="heart"></span></button>
        </div>
      </div>
    </header>

    <main class="main-content">
  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-left">
        <div class="auth-brand">
          <div class="auth-logo-icon"><span class="icon" data-icon="abacus"></span></div>
          <h1>Budget Buddy</h1>
          <p>预算伙伴</p>
        </div>
        <div class="auth-hero-text">
          <h2>让活动预算更简单</h2>
          <p>智能分配 · 灵活调整 · 一键导出</p>
        </div>
        <div class="auth-features">
          <div class="auth-feature-item">
            <span data-icon="bolt"></span>
            <span>3分钟生成完整预算方案</span>
          </div>
          <div class="auth-feature-item">
            <span data-icon="chart"></span>
            <span>可视化图表，占比一目了然</span>
          </div>
          <div class="auth-feature-item">
            <span data-icon="download"></span>
            <span>支持Excel/PDF/PPT导出</span>
          </div>
        </div>
      </div>

      <div class="auth-right">
        <div class="auth-card">
          <div class="auth-tabs">
            <button class="auth-tab active" data-tab="login">登录</button>
            <button class="auth-tab" data-tab="register">注册</button>
          </div>

          <div class="auth-form-wrap" id="loginForm">
            <h3 class="auth-title">欢迎回来</h3>
            <p class="auth-subtitle">请输入手机号登录你的账号</p>

            <div class="login-mode-switch">
              <span class="mode-switch-btn active" data-mode="password">密码登录</span>
              <span class="mode-switch-divider">|</span>
              <span class="mode-switch-btn" data-mode="code">验证码登录</span>
            </div>

            <form class="auth-form" id="passwordLoginForm">
              <div class="form-group">
                <label class="form-label">手机号</label>
                <input type="tel" class="form-input" id="loginPhone" placeholder="请输入11位手机号" maxlength="11">
                <div class="form-error" id="loginPhoneError"></div>
              </div>
              <div class="form-group">
                <label class="form-label">密码</label>
                <input type="password" class="form-input" id="loginPassword" placeholder="请输入密码">
                <div class="form-error" id="loginPasswordError"></div>
              </div>
              <button type="button" class="btn btn-primary btn-block" onclick="handlePasswordLogin()">登 录</button>
            </form>

            <form class="auth-form" id="codeLoginForm" style="display:none;">
              <div class="form-group">
                <label class="form-label">手机号</label>
                <input type="tel" class="form-input" id="codeLoginPhone" placeholder="请输入11位手机号" maxlength="11">
                <div class="form-error" id="codeLoginPhoneError"></div>
              </div>
              <div class="form-group">
                <label class="form-label">验证码</label>
                <div class="code-input-group">
                  <input type="text" class="form-input" id="codeLoginCode" placeholder="请输入6位验证码" maxlength="6">
                  <button type="button" class="btn btn-outline btn-sm code-btn" id="sendCodeBtn" onclick="sendLoginCode()">获取验证码</button>
                </div>
                <div class="form-error" id="codeLoginCodeError"></div>
              </div>
              <div class="demo-code-tip" id="demoCodeTip" style="display:none;">
                演示验证码：<strong>123456</strong>
              </div>
              <button type="button" class="btn btn-primary btn-block" onclick="handleCodeLogin()">登 录</button>
            </form>

            <div class="auth-footer-tip">
              还没有账号？<a href="javascript:;" onclick="switchAuthTab('register')">立即注册</a>
            </div>
          </div>

          <div class="auth-form-wrap" id="registerForm" style="display:none;">
            <h3 class="auth-title">创建新账号</h3>
            <p class="auth-subtitle">完成注册，开启智能预算之旅</p>

            <form class="auth-form">
              <div class="form-group">
                <label class="form-label">手机号</label>
                <input type="tel" class="form-input" id="regPhone" placeholder="请输入11位手机号" maxlength="11">
                <div class="form-error" id="regPhoneError"></div>
              </div>
              <div class="form-group">
                <label class="form-label">设置密码</label>
                <input type="password" class="form-input" id="regPassword" placeholder="请设置密码（6-20位）">
                <div class="form-error" id="regPasswordError"></div>
              </div>
              <div class="form-group">
                <label class="form-label">确认密码</label>
                <input type="password" class="form-input" id="regConfirmPassword" placeholder="请再次输入密码">
                <div class="form-error" id="regConfirmPasswordError"></div>
              </div>
              <div class="form-row-2">
                <div class="form-group">
                  <label class="form-label">行业</label>
                  <select class="form-input" id="regIndustry">
                    <option value="">请选择行业</option>
                    <option value="internet">互联网/科技</option>
                    <option value="finance">金融</option>
                    <option value="education">教育</option>
                    <option value="medical">医疗健康</option>
                    <option value="manufacturing">制造业</option>
                    <option value="retail">零售/电商</option>
                    <option value="marketing">市场营销/广告</option>
                    <option value="service">服务业</option>
                    <option value="other">其他</option>
                  </select>
                  <div class="form-error" id="regIndustryError"></div>
                </div>
                <div class="form-group">
                  <label class="form-label">职业</label>
                  <select class="form-input" id="regOccupation">
                    <option value="">请选择职业</option>
                    <option value="manager">管理岗</option>
                    <option value="hr">人力资源</option>
                    <option value="admin">行政/后勤</option>
                    <option value="marketing">市场/品牌</option>
                    <option value="sales">销售</option>
                    <option value="tech">技术/研发</option>
                    <option value="finance">财务/会计</option>
                    <option value="designer">设计</option>
                    <option value="freelance">自由职业</option>
                    <option value="other">其他</option>
                  </select>
                  <div class="form-error" id="regOccupationError"></div>
                </div>
              </div>
              <button type="button" class="btn btn-primary btn-block" onclick="handleRegister()">注 册</button>
            </form>

            <div class="auth-footer-tip">
              已有账号？<a href="javascript:;" onclick="switchAuthTab('login')">直接登录</a>
            </div>
          </div>
        </div>

        <p class="auth-copyright">© 2024 Budget Buddy 预算伙伴</p>
      </div>
    </div>
  </div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    initLoginPage();
  </script>
</body>
</html>
