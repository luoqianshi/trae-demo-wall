<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暗焰 — 煤气灯效应心理视觉小说</title>
<style>
/* ===== 全局重置与基础 ===== */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:"Noto Serif SC","Source Han Serif SC","STSong","SimSun",serif; }

/* ===== 游戏容器 ===== */
#game-container {
  position:relative; width:100vw; height:100vh; max-width:1280px; max-height:720px;
  margin:auto; overflow:hidden; background:#000;
}

/* ===== 背景层 ===== */
#bg-layer {
  position:absolute; top:0; left:0; width:100%; height:100%;
  background-size:cover; background-position:center;
  transition: opacity 1.2s ease, background-image 1.2s ease;
  filter: brightness(var(--bg-brightness, 1)) saturate(var(--bg-saturate, 1));
}

/* ===== 场景滤镜层（用于心理扭曲效果） ===== */
#distortion-overlay {
  position:absolute; top:0; left:0; width:100%; height:100%;
  pointer-events:none; opacity:0; transition: opacity 2s ease;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.6) 100%);
}
#distortion-overlay.active { opacity:1; }

/* ===== 角色层 ===== */
#character-layer {
  position:absolute; bottom:0; left:0; width:100%; height:85%;
  display:flex; justify-content:center; align-items:flex-end;
  pointer-events:none;
}
.character-sprite {
  position:absolute; bottom:0; height:100%; max-height:85vh;
  transition: opacity 0.6s ease, transform 0.6s ease, filter 0.8s ease;
  object-fit:contain; object-position: bottom center;
}
.character-left { left:5%; transform:translateX(-20px); }
.character-center { left:50%; transform:translateX(-50%); }
.character-right { right:5%; transform:translateX(20px); }
.character-hidden { opacity:0; }
.character-visible { opacity:1; }
.character-dim { filter:brightness(0.6) saturate(0.5); }
.character-shake {
  animation: charShake 0.3s ease-in-out infinite;
}
@keyframes charShake {
  0%,100% { transform:translateX(0); }
  25% { transform:translateX(-3px); }
  75% { transform:translateX(3px); }
}

/* ===== 对话框层 ===== */
#dialog-layer {
  position:absolute; bottom:0; left:0; width:100%; height:32%;
  display:flex; flex-direction:column;
}
#dialog-box {
  flex:1; margin:0 2% 2% 2%; padding:20px 28px;
  background: linear-gradient(180deg, rgba(15,15,25,0.88) 0%, rgba(10,10,18,0.95) 100%);
  border:1px solid rgba(120,120,180,0.2);
  border-radius:6px 6px 2px 2px;
  backdrop-filter: blur(8px);
  cursor:pointer; position:relative;
  box-shadow: 0 -4px 30px rgba(0,0,0,0.4);
}
#speaker-name {
  font-size:18px; font-weight:700; letter-spacing:2px;
  margin-bottom:8px; text-shadow:0 0 10px rgba(100,140,255,0.3);
  transition: color 0.5s ease;
}
#speaker-name.narrator { color:rgba(180,180,200,0.7); font-style:italic; letter-spacing:4px; }
#speaker-name.linxi { color:#7eb8da; }
#speaker-name.luming { color:#e8b87e; }
#speaker-name.inner { color:#c89bef; font-style:italic; }

#dialog-text {
  font-size:16px; line-height:1.8; color:rgba(230,230,240,0.92);
  letter-spacing:0.5px; min-height:60px;
}
#dialog-text .typewriter { border-right:2px solid rgba(200,200,255,0.6); padding-right:2px; }

/* 点击提示 */
#click-indicator {
  position:absolute; bottom:12px; right:20px;
  width:12px; height:12px;
  border-right:2px solid rgba(200,200,255,0.5);
  border-bottom:2px solid rgba(200,200,255,0.5);
  transform:rotate(45deg);
  animation: clickBounce 1.2s ease-in-out infinite;
  opacity:0; transition: opacity 0.3s;
}
#click-indicator.visible { opacity:1; }
@keyframes clickBounce {
  0%,100% { transform:rotate(45deg) translate(0,0); opacity:0.5; }
  50% { transform:rotate(45deg) translate(3px,3px); opacity:1; }
}

/* ===== 选择层 ===== */
#choice-layer {
  position:absolute; top:0; left:0; width:100%; height:100%;
  display:none; flex-direction:column; justify-content:center; align-items:center;
  background:rgba(5,5,15,0.5); z-index:20;
}
#choice-layer.active { display:flex; }
#choice-container {
  display:flex; flex-direction:column; gap:14px; width:70%; max-width:600px;
}
.choice-btn {
  padding:14px 24px; font-family:inherit; font-size:15px;
  color:rgba(220,220,240,0.9); letter-spacing:1px;
  background: linear-gradient(135deg, rgba(30,30,60,0.85), rgba(20,20,45,0.9));
  border:1px solid rgba(120,120,180,0.3);
  border-radius:4px; cursor:pointer;
  transition: all 0.4s ease; text-align:center; line-height:1.5;
}
.choice-btn:hover {
  background: linear-gradient(135deg, rgba(50,40,90,0.9), rgba(40,30,70,0.95));
  border-color:rgba(160,140,220,0.6);
  transform:translateX(8px);
  box-shadow:0 0 20px rgba(100,80,180,0.3);
}
.choice-btn.sanity-low {
  border-color:rgba(180,60,60,0.4);
  animation: choiceTremble 2s ease-in-out infinite;
}
@keyframes choiceTremble {
  0%,100% { transform:translateX(0); }
  25% { transform:translateX(-1px); }
  75% { transform:translateX(1px); }
}

/* ===== 理智值 HUD ===== */
#sanity-hud {
  position:absolute; top:16px; right:20px; z-index:30;
  display:flex; align-items:center; gap:10px;
  padding:8px 16px; border-radius:20px;
  background:rgba(10,10,20,0.7); border:1px solid rgba(100,100,160,0.2);
  backdrop-filter:blur(4px);
  opacity:0; transition: opacity 1s ease;
}
#sanity-hud.visible { opacity:1; }
#sanity-label { font-size:12px; color:rgba(180,180,200,0.7); letter-spacing:2px; }
#sanity-bar-bg {
  width:120px; height:8px; border-radius:4px;
  background:rgba(40,40,60,0.8); overflow:hidden;
}
#sanity-bar {
  height:100%; border-radius:4px; transition: width 1.5s ease, background 1.5s ease;
  background: linear-gradient(90deg, #6eb8ff, #a088ff);
}
#sanity-value { font-size:12px; color:rgba(200,200,220,0.8); min-width:30px; text-align:right; }

/* ===== 章节标题 ===== */
#chapter-title {
  position:absolute; top:0; left:0; width:100%; height:100%;
  display:none; flex-direction:column; justify-content:center; align-items:center;
  background:#0a0a14; z-index:40;
}
#chapter-title.active { display:flex; }
#chapter-number { font-size:14px; color:rgba(160,140,200,0.5); letter-spacing:6px; margin-bottom:16px; }
#chapter-name { font-size:36px; color:rgba(220,210,240,0.9); letter-spacing:8px; text-shadow:0 0 30px rgba(100,80,180,0.3); }
#chapter-subtitle { font-size:14px; color:rgba(140,140,170,0.5); letter-spacing:4px; margin-top:20px; font-style:italic; }

/* ===== 心理扭曲文字效果 ===== */
.text-distort {
  animation: textDistort 0.15s ease-in-out infinite alternate;
}
@keyframes textDistort {
  0% { transform:translate(0,0); filter:none; }
  100% { transform:translate(-1px,1px); filter:blur(0.5px); }
}
.text-fade {
  animation: textFade 2s ease-in-out;
}
@keyframes textFade {
  0%,100% { opacity:1; }
  50% { opacity:0.3; }
}

/* ===== 黑幕转场 ===== */
#fade-overlay {
  position:absolute; top:0; left:0; width:100%; height:100%;
  background:#000; opacity:0; pointer-events:none;
  transition: opacity 0.8s ease; z-index:50;
}
#fade-overlay.active { opacity:1; }

/* ===== 标题画面 ===== */
#title-screen {
  position:absolute; top:0; left:0; width:100%; height:100%;
  display:flex; flex-direction:column; justify-content:center; align-items:center;
  background:
    radial-gradient(ellipse at 50% 80%, rgba(80,20,30,0.25) 0%, transparent 60%),
    radial-gradient(ellipse at 30% 20%, rgba(60,30,80,0.15) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 60%, rgba(40,15,60,0.2) 0%, transparent 55%),
    linear-gradient(180deg, #080610 0%, #0d0818 30%, #140a1e 60%, #1a0c18 100%);
  z-index:60;
  overflow:hidden;
}
#title-screen::before {
  content:''; position:absolute; bottom:0; left:0; width:100%; height:40%;
  background: radial-gradient(ellipse at 50% 100%, rgba(120,40,30,0.12) 0%, transparent 70%);
  pointer-events:none; animation: emberGlow 6s ease-in-out infinite alternate;
}
#title-screen::after {
  content:''; position:absolute; top:0; left:0; width:100%; height:100%;
  background: radial-gradient(circle at 50% 50%, transparent 30%, rgba(0,0,0,0.3) 100%);
  pointer-events:none;
}
@keyframes emberGlow {
  0% { opacity:0.4; }
  100% { opacity:0.8; }
}

/* 火焰粒子容器 */
.flame-container {
  position:absolute; top:0; left:0; width:100%; height:100%;
  pointer-events:none; z-index:0; overflow:hidden;
}
.flame {
  position:absolute; bottom:-10px;
  width:5px; height:5px; border-radius:50%;
  background: radial-gradient(circle, rgba(200,80,40,0.6) 0%, rgba(160,50,60,0.3) 50%, rgba(120,40,80,0.1) 100%);
  animation: flameRise 4s ease-out infinite;
  pointer-events:none;
}
.flame:nth-child(1)  { width:6px; height:6px; left:10%; animation-delay:0s;   animation-duration:3.8s; }
.flame:nth-child(2)  { width:4px; height:4px; left:20%; animation-delay:1.2s; animation-duration:4.5s; }
.flame:nth-child(3)  { width:7px; height:7px; left:35%; animation-delay:0.6s; animation-duration:3.5s; }
.flame:nth-child(4)  { width:5px; height:5px; left:45%; animation-delay:2.1s; animation-duration:4.2s; }
.flame:nth-child(5)  { width:8px; height:8px; left:55%; animation-delay:0.3s; animation-duration:3.2s; }
.flame:nth-child(6)  { width:4px; height:4px; left:65%; animation-delay:1.8s; animation-duration:4.8s; }
.flame:nth-child(7)  { width:6px; height:6px; left:75%; animation-delay:0.9s; animation-duration:3.6s; }
.flame:nth-child(8)  { width:5px; height:5px; left:85%; animation-delay:2.5s; animation-duration:4.0s; }
.flame:nth-child(9)  { width:7px; height:7px; left:90%; animation-delay:1.5s; animation-duration:3.4s; }
.flame:nth-child(10) { width:4px; height:4px; left:50%; animation-delay:3s;   animation-duration:5.0s; }
.flame:nth-child(11) { width:6px; height:6px; left:30%; animation-delay:2.8s; animation-duration:4.3s; }
.flame:nth-child(12) { width:5px; height:5px; left:70%; animation-delay:0.4s; animation-duration:3.9s; }
@keyframes flameRise {
  0%   { transform:translateY(0) scale(1); opacity:1; }
  40%  { opacity:0.7; }
  100% { transform:translateY(-300px) scale(0.3); opacity:0; }
}

/* 浮动文字 */
.floating-words {
  position:absolute; top:0; left:0; width:100%; height:100%;
  pointer-events:none; z-index:0; overflow:hidden;
}
.floating-words span {
  position:absolute;
  font-family:"Noto Serif SC","Source Han Serif SC","STSong","SimSun",serif;
  color:rgba(160,120,180,0.25);
  animation: wordFloat 10s ease-in-out infinite;
  pointer-events:none; user-select:none;
  text-shadow:0 0 8px rgba(120,60,100,0.15);
}
@keyframes wordFloat {
  0%, 100% { transform:translateY(0); opacity:0.1; }
  25%      { transform:translateY(-15px); opacity:0.35; }
  50%      { transform:translateY(5px); opacity:0.15; }
  75%      { transform:translateY(-20px); opacity:0.4; }
}

/* 标题 - 呼吸发光 + 浮动 */
#title-screen h1 {
  font-size:52px; color:rgba(220,210,240,0.9); letter-spacing:16px;
  position:relative; z-index:1;
  animation: titleFloat 6s ease-in-out infinite, titleGlow 3s ease-in-out infinite;
}
@keyframes titleGlow {
  0%, 100% { text-shadow:0 0 40px rgba(100,60,160,0.3), 0 0 80px rgba(80,40,140,0.15); }
  50%      { text-shadow:0 0 60px rgba(140,80,200,0.6), 0 0 120px rgba(100,60,180,0.3), 0 2px 30px rgba(180,120,220,0.2); }
}
@keyframes titleFloat {
  0%, 100% { transform:translateY(0); }
  50%      { transform:translateY(-6px); }
}

/* 副标题 - 逐字母淡入 */
#title-screen .subtitle {
  font-size:14px; color:rgba(160,140,200,0.5); letter-spacing:6px;
  margin-top:16px; position:relative; z-index:1;
  overflow:hidden;
}
#title-screen .subtitle span {
  display:inline-block;
  opacity:0;
  animation: letterFadeIn 0.8s ease forwards;
}
@keyframes letterFadeIn {
  0%   { opacity:0; transform:translateY(8px); filter:blur(2px); }
  100% { opacity:1; transform:translateY(0); filter:blur(0); }
}

/* 标语 - 闪烁 */
#title-screen .tagline {
  font-size:12px; color:rgba(120,110,160,0.4); letter-spacing:3px;
  margin-top:40px; font-style:italic; position:relative; z-index:1;
  animation: taglineFlicker 5s ease-in-out infinite;
}
@keyframes taglineFlicker {
  0%, 100% { opacity:0.4; }
  20%      { opacity:0.55; }
  40%      { opacity:0.3; }
  60%      { opacity:0.5; }
  80%      { opacity:0.35; }
}

/* 版本信息 */
.version-text {
  font-size:10px; color:rgba(100,90,130,0.3); letter-spacing:2px;
  margin-top:24px; position:relative; z-index:1;
  text-align:center;
}

/* 开始按钮 - 边框流光 */
#start-btn {
  margin-top:36px; padding:14px 50px; font-family:inherit;
  font-size:16px; color:rgba(200,190,230,0.8); letter-spacing:8px;
  background:transparent; border:1px solid rgba(120,100,180,0.3);
  border-radius:2px; cursor:pointer; position:relative; z-index:1;
  transition: all 0.5s ease;
  animation: borderShimmer 4s linear infinite;
  overflow:hidden;
}
@keyframes borderShimmer {
  0%   { box-shadow:-30px 0 20px rgba(120,80,200,0.15), 30px 0 20px rgba(80,40,140,0.05); }
  25%  { box-shadow:-15px 0 20px rgba(80,40,140,0.05), 45px 0 20px rgba(120,80,200,0.15); }
  50%  { box-shadow:0px 0 20px rgba(140,100,220,0.2), 0px 0 20px rgba(100,60,180,0.1); }
  75%  { box-shadow:15px 0 20px rgba(80,40,140,0.05), -45px 0 20px rgba(120,80,200,0.15); }
  100% { box-shadow:-30px 0 20px rgba(120,80,200,0.15), 30px 0 20px rgba(80,40,140,0.05); }
}
#start-btn:hover {
  background:rgba(60,40,100,0.3); border-color:rgba(160,140,220,0.5);
  box-shadow:0 0 30px rgba(100,80,180,0.3), 0 0 60px rgba(120,80,200,0.15);
  transform:translateY(-2px);
  animation:none;
}

/* ===== 结局画面 ===== */
#ending-screen {
  position:absolute; top:0; left:0; width:100%; height:100%;
  display:none; flex-direction:column; justify-content:center; align-items:center;
  background:#0a0a14; z-index:55;
}
#ending-screen.active { display:flex; }
#ending-label { font-size:14px; color:rgba(160,140,200,0.5); letter-spacing:6px; margin-bottom:20px; }
#ending-title { font-size:32px; color:rgba(220,210,240,0.85); letter-spacing:8px; text-shadow:0 0 20px rgba(100,80,180,0.3); }
#ending-desc { font-size:14px; color:rgba(160,155,180,0.6); letter-spacing:2px; margin-top:20px; max-width:500px; text-align:center; line-height:1.8; }
#ending-restart {
  margin-top:50px; padding:12px 40px; font-family:inherit;
  font-size:14px; color:rgba(180,170,210,0.7); letter-spacing:4px;
  background:transparent; border:1px solid rgba(100,90,150,0.3);
  border-radius:2px; cursor:pointer; transition:all 0.4s;
}
#ending-restart:hover {
  background:rgba(40,30,70,0.3); border-color:rgba(140,120,200,0.4);
}

/* ===== 粒子效果 ===== */
#particles-canvas {
  position:absolute; top:0; left:0; width:100%; height:100%;
  pointer-events:none; z-index:1;
}

/* ===== 暂停菜单 ===== */
#pause-menu {
  position:absolute; top:0; left:0; width:100%; height:100%;
  display:none; justify-content:center; align-items:center;
  background:rgba(5,5,15,0.7); z-index:45;
  backdrop-filter:blur(4px);
}
#pause-menu.active { display:flex; }
.pause-content {
  display:flex; flex-direction:column; align-items:center; gap:16px;
  padding:40px 60px; border-radius:8px;
  background: linear-gradient(180deg, rgba(20,18,35,0.95), rgba(12,10,22,0.98));
  border:1px solid rgba(120,120,180,0.25);
  box-shadow:0 0 40px rgba(60,40,120,0.3);
}
.pause-title {
  font-size:22px; color:rgba(220,210,240,0.85); letter-spacing:6px;
  text-shadow:0 0 20px rgba(100,80,180,0.3); margin-bottom:8px;
}
.pause-btn {
  padding:12px 40px; font-family:inherit; font-size:15px;
  color:rgba(200,190,230,0.8); letter-spacing:4px;
  background:transparent; border:1px solid rgba(120,100,180,0.3);
  border-radius:2px; cursor:pointer; transition:all 0.4s ease;
  min-width:200px; text-align:center;
}
.pause-btn:hover {
  background:rgba(60,40,100,0.3); border-color:rgba(160,140,220,0.5);
  box-shadow:0 0 20px rgba(100,80,180,0.2); transform:translateY(-1px);
}

/* ===== 响应式 ===== */
@media (max-width:768px) {
  #game-container { max-height:100vh; max-width:100vw; }
  #dialog-box { padding:14px 18px; }
  #dialog-text { font-size:14px; }
  #speaker-name { font-size:15px; }
  #chapter-name { font-size:24px; letter-spacing:4px; }
  #title-screen h1 { font-size:32px; letter-spacing:8px; }
  #choice-container { width:85%; }
}

/* ===== 暂停菜单升级 ===== */
.pause-divider {
  width:80%; height:1px; margin:8px 0;
  background:linear-gradient(90deg, transparent, rgba(120,120,180,0.3), transparent);
}
.pause-section-title {
  font-size:11px; color:rgba(160,140,200,0.5); letter-spacing:3px; margin:4px 0;
}
.pause-chapters {
  display:flex; flex-direction:column; gap:6px; width:100%; max-width:280px;
}
.pause-chapter-btn {
  padding:8px 16px; font-family:inherit; font-size:12px;
  color:rgba(180,170,210,0.6); letter-spacing:2px; text-align:left;
  background:rgba(15,13,28,0.6); border:1px solid rgba(80,70,120,0.15);
  border-radius:2px; cursor:default; transition:all 0.3s;
  opacity:0.3; pointer-events:none;
}
.pause-chapter-btn.unlocked {
  opacity:1; pointer-events:auto; cursor:pointer; color:rgba(200,190,230,0.8);
}
.pause-chapter-btn.unlocked:hover {
  background:rgba(50,40,90,0.5); border-color:rgba(120,100,180,0.4);
  transform:translateX(4px);
}
.pause-chapter-btn.current {
  border-color:rgba(140,120,220,0.5); color:rgba(180,170,230,0.9);
}
.pause-chapter-btn .chapter-sub {
  font-size:10px; color:rgba(140,130,170,0.4); display:block; margin-top:2px;
}
.pause-achievements-btn {
  font-size:12px !important; padding:10px 40px !important;
  color:rgba(200,170,120,0.7) !important;
  border-color:rgba(180,140,60,0.3) !important;
}
.pause-achievements-btn:hover {
  background:rgba(60,45,20,0.3) !important;
  border-color:rgba(200,160,80,0.5) !important;
}

/* ===== 成就面板 ===== */
#achievement-panel {
  position:absolute; top:0; left:0; width:100%; height:100%;
  display:none; flex-direction:column; justify-content:center; align-items:center;
  background:rgba(5,5,15,0.85); z-index:46;
  backdrop-filter:blur(6px);
}
#achievement-panel.active { display:flex; }
.ach-content {
  display:flex; flex-direction:column; align-items:center; gap:12px;
  padding:30px 40px; border-radius:8px; max-width:500px; width:90%; max-height:70vh;
  overflow-y:auto;
  background:linear-gradient(180deg, rgba(20,18,35,0.95), rgba(12,10,22,0.98));
  border:1px solid rgba(120,120,180,0.25);
  box-shadow:0 0 40px rgba(60,40,120,0.3);
}
.ach-title {
  font-size:20px; color:rgba(220,200,140,0.85); letter-spacing:6px;
  text-shadow:0 0 20px rgba(140,100,40,0.3); margin-bottom:8px;
}
.ach-grid {
  display:grid; grid-template-columns:1fr; gap:10px; width:100%;
}
.ach-item {
  display:flex; align-items:center; gap:12px;
  padding:10px 14px; border-radius:4px;
  background:rgba(15,13,28,0.5); border:1px solid rgba(80,70,120,0.15);
  opacity:0.3; pointer-events:none;
}
.ach-item.unlocked {
  opacity:1; border-color:rgba(180,140,60,0.3);
}
.ach-icon {
  width:32px; height:32px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:14px; background:rgba(30,25,50,0.8);
  border:1px solid rgba(80,70,120,0.2);
}
.ach-item.unlocked .ach-icon {
  background:linear-gradient(135deg, rgba(180,140,60,0.3), rgba(120,80,30,0.2));
  border-color:rgba(200,160,80,0.4);
}
.ach-name { font-size:13px; color:rgba(200,190,230,0.8); letter-spacing:2px; }
.ach-item.unlocked .ach-name { color:rgba(220,200,140,0.9); }
.ach-desc { font-size:11px; color:rgba(140,130,170,0.5); letter-spacing:1px; margin-top:2px; }
.ach-back {
  margin-top:12px; padding:8px 30px; font-family:inherit; font-size:12px;
  color:rgba(160,150,190,0.6); letter-spacing:3px;
  background:transparent; border:1px solid rgba(100,90,150,0.2);
  border-radius:2px; cursor:pointer; transition:all 0.3s;
}
.ach-back:hover { background:rgba(40,30,70,0.3); border-color:rgba(140,120,200,0.4); }

/* ===== 结局成就展示 ===== */
.ending-achievements {
  margin-top:20px; padding:12px 20px; border-radius:4px;
  background:rgba(20,18,30,0.5); border:1px solid rgba(140,120,180,0.15);
}
.ending-achievements-title {
  font-size:11px; color:rgba(200,180,120,0.5); letter-spacing:3px; margin-bottom:8px;
}
.ending-ach-item {
  font-size:11px; color:rgba(180,170,140,0.6); letter-spacing:1px; padding:3px 0;
}
.ending-ach-item.new { color:rgba(220,200,120,0.85); }
.ending-ach-item::before { content:'★ '; opacity:0.5; }
.ending-ach-item.new::before { opacity:1; }

</style>
</head>
<body>

<div id="game-container">
  <!-- 背景层 -->
  <div id="bg-layer"></div>
  <div id="distortion-overlay"></div>

  <!-- 粒子层 -->
  <canvas id="particles-canvas"></canvas>

  <!-- 角色层 -->
  <div id="character-layer"></div>

  <!-- 对话层 -->
  <div id="dialog-layer">
    <div id="dialog-box">
      <div id="speaker-name"></div>
      <div id="dialog-text"></div>
      <div id="click-indicator"></div>
    </div>
  </div>

  <!-- 选择层 -->
  <div id="choice-layer">
    <div id="choice-container"></div>
  </div>

  <!-- 理智值HUD -->
  <div id="sanity-hud">
    <span id="sanity-label">理智</span>
    <div id="sanity-bar-bg"><div id="sanity-bar"></div></div>
    <span id="sanity-value">100</span>
  </div>

  <!-- 章节标题 -->
  <div id="chapter-title">
    <div id="chapter-number"></div>
    <div id="chapter-name"></div>
    <div id="chapter-subtitle"></div>
  </div>

  <!-- 黑幕 -->
  <div id="fade-overlay"></div>

  <!-- 标题画面 -->
  <div id="title-screen">
    <div class="flame-container">
      <div class="flame" style="left:10%;animation-delay:0s;"></div>
      <div class="flame" style="left:20%;animation-delay:1.2s;"></div>
      <div class="flame" style="left:35%;animation-delay:0.6s;"></div>
      <div class="flame" style="left:45%;animation-delay:2.1s;"></div>
      <div class="flame" style="left:55%;animation-delay:0.3s;"></div>
      <div class="flame" style="left:65%;animation-delay:1.8s;"></div>
      <div class="flame" style="left:75%;animation-delay:0.9s;"></div>
      <div class="flame" style="left:85%;animation-delay:2.5s;"></div>
      <div class="flame" style="left:90%;animation-delay:1.5s;"></div>
      <div class="flame" style="left:50%;animation-delay:3s;"></div>
      <div class="flame" style="left:30%;animation-delay:2.8s;"></div>
      <div class="flame" style="left:70%;animation-delay:0.4s;"></div>
    </div>
    <div class="floating-words">
      <span style="left:5%;top:20%;font-size:11px;animation-delay:0s;">记得吗</span>
      <span style="left:85%;top:15%;font-size:13px;animation-delay:3s;">你错了</span>
      <span style="left:15%;top:70%;font-size:10px;animation-delay:6s;">太敏感了</span>
      <span style="left:75%;top:65%;font-size:12px;animation-delay:2s;">没关系</span>
      <span style="left:45%;top:80%;font-size:14px;animation-delay:5s;">都是你记错了</span>
      <span style="left:90%;top:45%;font-size:11px;animation-delay:8s;">你不正常</span>
      <span style="left:8%;top:45%;font-size:13px;animation-delay:4s;">我在乎你</span>
      <span style="left:60%;top:25%;font-size:10px;animation-delay:7s;">太紧张了</span>
      <span style="left:35%;top:10%;font-size:12px;animation-delay:1s;">你确定吗</span>
    </div>
    <h1>暗 焰</h1>
    <div class="subtitle">GASLIGHT</div>
    <div class="tagline">「 你确定，你记得的是真的吗？ 」</div>
    <div class="version-text">v1.0 &nbsp;|&nbsp; 心理学科普作品 &nbsp;|&nbsp; 谨以此献给每一个曾在暗焰中挣扎的人</div>
    <button id="start-btn">开 始</button>
  </div>

  <!-- 结局画面 -->
  <div id="ending-screen">
    <div id="ending-label">ENDING</div>
    <div id="ending-title"></div>
    <div id="ending-desc"></div>
    <button id="ending-restart">重新开始</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
