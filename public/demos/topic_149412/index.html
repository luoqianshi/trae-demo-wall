<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数见 - AI 数据助手</title>
<link rel="stylesheet" href="shared.css">
<style>
  /* ===== 导航主页特有样式 ===== */
  html, body { overflow: auto; }

  .app-header {
    position: fixed; top: 0; left: 0; right: 0; height: var(--header-height);
    background: var(--color-bg-elevated); border-bottom: 1px solid var(--color-border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 var(--space-6); z-index: 100; box-shadow: var(--shadow-sm);
  }

  .app-header-left { display: flex; align-items: center; gap: var(--space-3); }
  .app-header-left .logo {
    width: 28px; height: 28px; border-radius: 6px;
    background: var(--brand-primary); display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 14px; text-decoration: none;
  }
  .app-header-left .brand {
    font-size: var(--text-lg); font-weight: var(--weight-bold); letter-spacing: -0.01em;
    text-decoration: none; color: var(--color-text);
  }
  .app-header-left .tag {
    font-size: var(--text-xs); font-weight: var(--weight-medium);
    color: var(--color-text-tertiary); background: var(--color-bg-inset);
    padding: 2px var(--space-2); border-radius: var(--radius-full);
  }

  .header-nav {
    display: flex; align-items: center; gap: 2px; margin-left: var(--space-8);
  }
  .header-nav a {
    display: flex; align-items: center; gap: var(--space-2);
    padding: var(--space-2) var(--space-3); border-radius: var(--radius-md);
    font-size: var(--text-sm); font-weight: var(--weight-medium);
    color: var(--color-text-secondary); text-decoration: none; transition: all 0.15s;
  }
  .header-nav a:hover { background: var(--color-bg-inset); color: var(--color-text); }
  .header-nav a.active { background: var(--brand-primary); color: #fff; }

  .app-header-right { display: flex; align-items: center; gap: var(--space-4); }

  /* ===== 主页主体 ===== */
  .home-body {
    min-height: 100vh; display: flex; flex-direction: column;
    padding-top: var(--header-height);
  }

  .home-main {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: var(--space-8) var(--space-6);
  }

  .home-hero {
    text-align: center; margin-bottom: var(--space-8);
  }
  .home-hero .hero-title {
    font-size: 26px; font-weight: var(--weight-bold); color: var(--color-text);
    letter-spacing: -0.02em; margin-bottom: var(--space-2);
  }
  .home-hero .hero-subtitle {
    font-size: var(--text-base); color: var(--color-text-tertiary);
  }

  /* ===== 功能入口卡片 ===== */
  .feature-cards {
    display: flex; gap: var(--space-6); max-width: 960px; width: 100%;
    justify-content: center;
  }

  .feature-card {
    flex: 1; min-width: 0; max-width: 300px;
    background: var(--color-bg-elevated); border: 1px solid var(--color-border);
    border-radius: var(--radius-xl); padding: var(--space-8) var(--space-6);
    text-align: center; text-decoration: none; color: inherit;
    box-shadow: var(--shadow-sm); transition: transform 0.25s ease, box-shadow 0.25s ease;
    cursor: pointer;
  }
  .feature-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 16px 32px -8px rgba(0,0,0,0.12), 0 4px 12px -4px rgba(0,0,0,0.08);
  }

  .feature-card .feature-icon {
    width: 56px; height: 56px; border-radius: var(--radius-lg);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto var(--space-5);
  }
  .feature-card .feature-icon.folder {
    background: var(--brand-primary-light); color: var(--brand-primary);
  }
  .feature-card .feature-icon.chart {
    background: var(--color-success-light); color: var(--color-success);
  }
  .feature-card .feature-icon.lightning {
    background: var(--color-warning-light); color: var(--color-warning);
  }

  .feature-card .feature-title {
    font-size: var(--text-lg); font-weight: var(--weight-semibold);
    color: var(--color-text); margin-bottom: var(--space-3);
  }
  .feature-card .feature-desc {
    font-size: var(--text-sm); color: var(--color-text-secondary);
    line-height: 1.6; margin-bottom: var(--space-5);
  }
  .feature-card .feature-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
    padding: 8px 20px; border-radius: var(--radius-md);
    font-family: inherit; font-size: var(--text-sm); font-weight: var(--weight-medium);
    background: var(--brand-primary); color: #fff; border: none;
    cursor: pointer; transition: background 0.15s; text-decoration: none;
  }
  .feature-card .feature-btn:hover { background: var(--brand-primary-hover); }

  /* ===== 页脚 ===== */
  .home-footer {
    text-align: center; padding: var(--space-5) 0;
    border-top: 1px solid var(--color-border-light);
  }
  .home-footer .footer-version {
    font-size: var(--text-xs); color: var(--color-text-tertiary);
  }

  /* ===== 响应式 ===== */
  @media (max-width: 768px) {
    .feature-cards {
      flex-direction: column; align-items: center;
    }
    .feature-card { max-width: 400px; width: 100%; }
    .header-nav { display: none; }
  }
</style>
</head>
<body>

<!-- ========== HEADER ========== -->
<header class="app-header">
  <div class="app-header-left">
    <a href="index.html" class="logo">数</a>
    <a href="index.html" class="brand">数见</a>
    <span class="tag">AI 数据助手</span>
    <nav class="header-nav">
      <a href="data-management.html">数据管理</a>
      <a href="metrics-config.html">指标配置</a>
      <a href="skills-qa.html">技能管理</a>
    </nav>
  </div>
  <div class="app-header-right">
    <div class="avatar">张</div>
  </div>
</header>

<!-- ========== 主页主体 ========== -->
<div class="home-body">
  <main class="home-main">
    <div class="home-hero">
      <h1 class="hero-title">欢迎使用数见</h1>
      <p class="hero-subtitle">AI 驱动的数据管理平台，让数据洞察触手可及</p>
    </div>

    <div class="feature-cards">
      <!-- 卡片1：数据管理 -->
      <a href="data-management.html" class="feature-card">
        <div class="feature-icon folder">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
          </svg>
        </div>
        <h3 class="feature-title">数据管理</h3>
        <p class="feature-desc">上传和管理数据文件，预览数据内容，查看数据质量报告</p>
        <span class="feature-btn">进入</span>
      </a>

      <!-- 卡片2：指标配置 -->
      <a href="metrics-config.html" class="feature-card">
        <div class="feature-icon chart">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 20V10M12 20V4M6 20v-6"/>
          </svg>
        </div>
        <h3 class="feature-title">指标配置</h3>
        <p class="feature-desc">定义和编辑业务指标口径，管理指标版本，追溯变更历史</p>
        <span class="feature-btn">进入</span>
      </a>

      <!-- 卡片3：技能管理 -->
      <a href="skills-qa.html" class="feature-card">
        <div class="feature-icon lightning">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
        </div>
        <h3 class="feature-title">技能管理</h3>
        <p class="feature-desc">智能问答，自然语言查询数据，自动生成图表和分析洞察</p>
        <span class="feature-btn">进入</span>
      </a>
    </div>
  </main>

  <!-- ========== 页脚 ========== -->
  <footer class="home-footer">
    <span class="footer-version">v1.0</span>
  </footer>
</div>

</body>
</html>
