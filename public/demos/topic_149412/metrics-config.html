<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>指标配置 - 数见 AI 数据助手</title>
<link rel="stylesheet" href="shared.css">
<script src="db.js?v=7"></script>
<style>
/* ===== PAGE LAYOUT ===== */
.metrics-layout { display: flex; height: 100%; }

/* ===== LEFT PANEL ===== */
.metrics-left {
  width: 300px; min-width: 300px; background: var(--color-bg-elevated); border-right: 1px solid var(--color-border);
  display: flex; flex-direction: column; overflow: hidden;
}
.metrics-left-header { padding: var(--space-4) var(--space-4) var(--space-3); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.metrics-left-title { font-size: var(--text-base); font-weight: var(--weight-semibold); }
.metrics-list { flex: 1; overflow-y: auto; padding: 0 var(--space-4) var(--space-4); }
.metrics-left-footer { padding: var(--space-3) var(--space-4); border-top: 1px solid var(--color-border); flex-shrink: 0; }

.metric-card {
  background: var(--color-bg-inset); border: 1px solid var(--color-border); border-radius: var(--radius-md);
  padding: var(--space-3); margin-bottom: var(--space-2); cursor: pointer; transition: all 0.15s;
}
.metric-card:hover { border-color: var(--brand-primary-muted); }
.metric-card.active { border-color: var(--brand-primary); background: var(--brand-primary-light); box-shadow: 0 0 0 1px var(--brand-primary); }
.metric-card .metric-name { font-weight: var(--weight-semibold); font-size: var(--text-sm); margin-bottom: 2px; }
.metric-card .metric-desc { font-size: 11px; color: var(--color-text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.metric-card .metric-meta { font-size: 10px; color: var(--color-text-tertiary); margin-top: 4px; }

/* ===== RIGHT PANEL ===== */
.metrics-right { flex: 1; overflow-y: auto; padding: var(--space-6); background: var(--color-bg); display: flex; flex-direction: column; }

.metrics-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--color-text-tertiary); }
.metrics-empty .empty-icon { margin-bottom: var(--space-4); opacity: 0.3; }
.metrics-empty .empty-title { font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--color-text-secondary); margin-bottom: var(--space-1); }

/* Editor header */
.metric-editor-header { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-5); flex-shrink: 0; flex-wrap: wrap; }
.metric-editor-title { font-size: var(--text-xl); font-weight: var(--weight-bold); letter-spacing: -0.02em; }
.metric-editor-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: var(--radius-full); font-size: var(--text-xs); font-weight: var(--weight-semibold); background: var(--brand-primary-light); color: var(--brand-primary); border: 1px solid var(--brand-primary-muted); }

/* Method tabs */
.method-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--color-border); margin-bottom: var(--space-5); }
.method-tab { padding: var(--space-3) var(--space-5); font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--color-text-secondary); cursor: pointer; border: none; background: none; font-family: inherit; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; }
.method-tab:hover { color: var(--color-text); }
.method-tab.active { color: var(--brand-primary); border-bottom-color: var(--brand-primary); }

/* Editor body */
.metric-editor-body { background: var(--color-bg-elevated); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-5); flex-shrink: 0; }

.form-row { display: flex; gap: var(--space-4); margin-bottom: var(--space-4); }
.form-row .form-group { flex: 1; margin-bottom: 0; }

/* Select cards for field */
.field-select-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); margin-top: var(--space-2); }
.field-select-card {
  padding: var(--space-3); border: 1px solid var(--color-border); border-radius: var(--radius-md);
  cursor: pointer; font-size: var(--text-sm); text-align: center; transition: all 0.15s; background: var(--color-bg-elevated); color: var(--color-text);
}
.field-select-card:hover { border-color: var(--brand-primary-muted); }
.field-select-card.selected { border-color: var(--brand-primary); background: var(--brand-primary-light); color: var(--brand-primary); font-weight: var(--weight-semibold); box-shadow: 0 0 0 1px var(--brand-primary); }
.field-select-card.disabled { opacity: 0.4; cursor: not-allowed; border-color: var(--color-border); }

/* Calculation options */
.calc-options { display: flex; gap: var(--space-3); margin-top: var(--space-2); }
.calc-option {
  flex: 1; padding: var(--space-3) var(--space-4); border: 1px solid var(--color-border); border-radius: var(--radius-md);
  cursor: pointer; text-align: center; transition: all 0.15s; background: var(--color-bg-elevated); position: relative;
}
.calc-option:hover { border-color: var(--brand-primary-muted); }
.calc-option.selected { border-color: var(--brand-primary); background: var(--brand-primary-light); box-shadow: 0 0 0 1px var(--brand-primary); }
.calc-option.disabled { opacity: 0.4; cursor: not-allowed; border-color: var(--color-border); }
.calc-option .calc-icon { margin-bottom: var(--space-1); color: var(--color-text-tertiary); }
.calc-option.selected .calc-icon { color: var(--brand-primary); }
.calc-option .calc-label { font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--color-text); }
.calc-option.selected .calc-label { color: var(--brand-primary); }
.calc-option .calc-hint { font-size: 10px; color: var(--color-text-tertiary); margin-top: 2px; }

/* SQL Preview */
.sql-preview { margin-top: var(--space-5); }
.sql-preview-label { font-size: var(--text-xs); font-weight: var(--weight-semibold); color: var(--color-text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: var(--space-2); }
.sql-preview-box {
  background: #1e1e2e; border: 1px solid var(--color-border); border-radius: var(--radius-md);
  padding: var(--space-4); font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace; font-size: 13px;
  color: #a6accd; line-height: 1.6; position: relative; overflow: hidden;
}
.sql-preview-box .sql-keyword { color: #c792ea; font-weight: 600; }
.sql-preview-box .sql-func { color: #82aaff; }
.sql-preview-box .sql-string { color: #c3e88d; }
.sql-preview-box .sql-comment { color: #676e95; font-style: italic; }
.sql-preview-box .sql-auto-tag { position: absolute; top: 8px; right: 12px; font-size: 10px; color: var(--color-success); background: rgba(16,185,129,0.1); padding: 2px 8px; border-radius: var(--radius-full); }

/* NL method */
.nl-input-wrap { display: flex; gap: var(--space-3); align-items: flex-start; }
.nl-input-wrap textarea { flex: 1; }
.nl-input-wrap .btn { height: 44px; flex-shrink: 0; align-self: flex-start; }
.nl-suggestions { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-3); }
.nl-suggestion { padding: var(--space-2) var(--space-3); background: var(--color-bg-inset); border: 1px solid var(--color-border); border-radius: var(--radius-full); font-size: var(--text-sm); color: var(--color-text-secondary); cursor: pointer; transition: all 0.15s; font-family: inherit; }
.nl-suggestion:hover { border-color: var(--brand-primary); color: var(--brand-primary); background: var(--brand-primary-light); }

.nl-result { margin-top: var(--space-4); padding: var(--space-4); background: var(--color-bg-inset); border-radius: var(--radius-md); border-left: 3px solid var(--brand-primary); }
.nl-result .nl-result-title { font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--brand-primary); margin-bottom: var(--space-2); }
.nl-result .nl-result-item { font-size: var(--text-sm); color: var(--color-text-secondary); margin-bottom: 4px; }
.nl-result .nl-result-item strong { color: var(--color-text); }

/* Actions */
.metric-editor-actions { display: flex; gap: var(--space-2); margin-top: var(--space-5); }

/* Version history */
.version-history { margin-top: var(--space-5); flex-shrink: 0; }
.version-history-title { font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--color-text-secondary); margin-bottom: var(--space-3); }
.version-timeline { position: relative; padding-left: var(--space-6); }
.version-timeline::before { content: ''; position: absolute; left: 7px; top: 4px; bottom: 4px; width: 2px; background: var(--color-border); }
.version-item { position: relative; padding: var(--space-2) 0 var(--space-3) var(--space-2); }
.version-item::before { content: ''; position: absolute; left: -20px; top: 10px; width: 10px; height: 10px; border-radius: 50%; background: var(--color-bg-elevated); border: 2px solid var(--color-border); }
.version-item.latest::before { background: var(--brand-primary); border-color: var(--brand-primary); box-shadow: 0 0 0 3px var(--brand-primary-light); }
.version-item .version-tag { font-size: var(--text-xs); font-weight: var(--weight-semibold); color: var(--color-text); margin-bottom: 2px; }
.version-item.latest .version-tag { color: var(--brand-primary); }
.version-item .version-sql { font-family: 'SF Mono', monospace; font-size: 11px; color: var(--color-text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.version-item .version-time { font-size: 10px; color: var(--color-text-tertiary); margin-top: 2px; }

/* Confirm dialog */
.confirm-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.35); z-index: 300; display: flex; align-items: center; justify-content: center; animation: fadeIn 0.15s ease; }
.confirm-dialog { background: var(--color-bg-elevated); border-radius: var(--radius-lg); padding: var(--space-6); box-shadow: var(--shadow-lg); max-width: 400px; width: 90%; animation: scaleIn 0.2s ease; }
.confirm-dialog h3 { font-size: var(--text-lg); font-weight: var(--weight-semibold); margin-bottom: var(--space-2); }
.confirm-dialog p { font-size: var(--text-sm); color: var(--color-text-secondary); margin-bottom: var(--space-5); line-height: 1.5; }
.confirm-dialog .confirm-actions { display: flex; gap: var(--space-2); justify-content: flex-end; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes scaleIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* Card delete btn */
.metric-card-inner { display: flex; align-items: flex-start; justify-content: space-between; }
.metric-card .card-delete-btn { display: none; width: 20px; height: 20px; border-radius: var(--radius-sm); border: none; background: transparent; cursor: pointer; color: var(--color-text-tertiary); font-size: 14px; line-height: 1; align-items: center; justify-content: center; flex-shrink: 0; margin-left: var(--space-2); }
.metric-card:hover .card-delete-btn { display: flex; }
.metric-card .card-delete-btn:hover { background: var(--color-error-light); color: var(--color-error); }

/* Form label with icon */
.form-label-with-icon { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-2); }
.form-label-with-icon .form-label { margin-bottom: 0; }

/* Responsive */
@media (max-width: 900px) { .field-select-grid { grid-template-columns: repeat(2, 1fr); } .form-row { flex-direction: column; } }
@media (max-width: 640px) { .field-select-grid { grid-template-columns: 1fr; } .calc-options { flex-direction: column; } .header-nav { display: none; } }
</style>
</head>

<div class="page-body">

    <div class="metrics-left">

        <span class="metrics-left-title">指标列表</span>

      <div class="metrics-left-footer">
        <button class="btn btn-outline btn-sm" style="width:100%;" onclick="createNewMetric()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>

<script>
// ============================================================
// DATA SCHEMA
// ============================================================
// Fallback schema for demo when no backend data
const FALLBACK_SCHEMA = {
  transactions: {
    label: 'transactions',
    fields: [
      { name: '用户ID', type: 'string', isTime: false },
      { name: '商品ID', type: 'string', isTime: false },
      { name: '下单时间', type: 'datetime', isTime: true },
      { name: '购买时间', type: 'datetime', isTime: true },
      { name: '购买数量', type: 'number', isTime: false },
      { name: '消费金额', type: 'number', isTime: false },
      { name: '优惠券', type: 'number', isTime: false },
      { name: '红包', type: 'number', isTime: false },
      { name: '实付订单', type: 'number', isTime: false },
      { name: '订单状态', type: 'string', isTime: false },
      { name: '退单时间', type: 'datetime', isTime: true }
    ]
  },
  users: {
    label: 'users',
    fields: [
      { name: '用户ID', type: 'string', isTime: false },
      { name: '用户性别', type: 'string', isTime: false },
      { name: '用户年龄', type: 'number', isTime: false },
      { name: '用户省份', type: 'string', isTime: false }
    ]
  },
  products: {
    label: 'products',
    fields: [
      { name: '商品ID', type: 'string', isTime: false },
      { name: '商品名称', type: 'string', isTime: false },
      { name: '商品类别', type: 'string', isTime: false },
      { name: '单价', type: 'number', isTime: false }
    ]
  }
};

let TABLE_SCHEMA = {}; // Populated dynamically from API

async function loadSchemas() {
  try {
    const data = await ShujianDB.getAllSchemas();
    const schemas = {};
    for (const tableName in data) {
      const entry = data[tableName];
      schemas[tableName] = {
        label: tableName,
        fields: entry.schema || []
      };
    }
    if (Object.keys(schemas).length > 0) {
      TABLE_SCHEMA = schemas;
      return true;
    }
  } catch(e) {
    console.log('ShujianDB schema unavailable:', e.message);
  }
  TABLE_SCHEMA = FALLBACK_SCHEMA;
  return false;
}

const CALC_OPTIONS = [
  { key: 'sum', label: '求和', hint: 'SUM', icon: 'Σ', supports: ['number'] },
  { key: 'count', label: '计数', hint: 'COUNT', icon: '#', supports: ['string','number','datetime'] },
  { key: 'count_distinct', label: '去重', hint: 'COUNT DISTINCT', icon: '◊', supports: ['string','number','datetime'] }
];

// ============================================================
// STORAGE
// ============================================================
const STORAGE_KEY = 'shujian-metrics-config-v2';

function loadMetricsData() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) { try { return JSON.parse(raw); } catch(e) {} }
  return getDefaultMetricsData();
}

function getDefaultMetricsData() {
  return {
    globalVersion: 'v1.0',
    activeMetricId: 'metric-1',
    method: 'visual', // 'visual' or 'nl'
    metrics: [
      {
        id: 'metric-1', name: '销售额',
        config: { table: 'transactions', field: '实付订单', calc: 'sum', timeField: '购买时间' },
        formula: 'SUM(实付订单)',
        description: '实际支付的订单总金额（扣除优惠券和红包）',
        unit: '元', version: 'v1.0',
        history: [{ version: 'v1.0', formula: 'SUM(实付订单)', description: '实际支付的订单总金额（扣除优惠券和红包）', time: '2025-07-01 10:00' }]
      },
      {
        id: 'metric-2', name: '订单数',
        config: { table: 'transactions', field: '用户ID', calc: 'count_distinct', timeField: '购买时间' },
        formula: "COUNT(DISTINCT 用户ID)",
        description: '有效订单总数（去重后的用户数）',
        unit: '单', version: 'v1.0',
        history: [{ version: 'v1.0', formula: "COUNT(DISTINCT 用户ID)", description: '有效订单总数', time: '2025-07-01 10:00' }]
      },
      {
        id: 'metric-3', name: '客单价',
        config: { table: 'transactions', field: '实付订单', calc: 'sum', timeField: '购买时间' },
        formula: 'SUM(实付订单) / COUNT(DISTINCT 用户ID)',
        description: '平均每单支付金额',
        unit: '元', version: 'v1.0',
        history: [{ version: 'v1.0', formula: 'SUM(实付订单) / COUNT(DISTINCT 用户ID)', description: '平均每单支付金额', time: '2025-07-01 10:00' }]
      },
      {
        id: 'metric-4', name: '退款率',
        config: { table: 'transactions', field: '订单状态', calc: 'count', timeField: '退单时间' },
        formula: "SUM(CASE WHEN 订单状态='已退款' THEN 1 ELSE 0 END) * 100.0 / COUNT(*)",
        description: '已退款订单占总订单的比例',
        unit: '%', version: 'v1.0',
        history: [{ version: 'v1.0', formula: "SUM(CASE WHEN 订单状态='已退款' THEN 1 ELSE 0 END) * 100.0 / COUNT(*)", description: '已退款订单占比', time: '2025-07-01 10:00' }]
      }
    ]
  };
}

function saveMetricsData(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

let appData = loadMetricsData();
// Migration: if old format exists, convert
if (appData.metrics[0] && appData.metrics[0].formula && !appData.metrics[0].config) {
  appData.metrics.forEach(m => {
    m.config = m.config || { table: m.table || 'transactions', field: '实付订单', calc: 'sum', timeField: '购买时间' };
  });
}

// ============================================================
// RENDER
// ============================================================
function renderAll() {
  renderLeftPanel();
  renderRightPanel();
  updateGlobalVersionBadge();
}

function renderLeftPanel() {
  const listEl = document.getElementById('metrics-list');
  const versionEl = document.getElementById('left-version');
  versionEl.textContent = appData.globalVersion;

  let html = '';
  appData.metrics.forEach(m => {
    const isActive = appData.activeMetricId === m.id;
    const historyCount = m.history.length;
    html += '<div class="metric-card' + (isActive ? ' active' : '') + '" onclick="selectMetric(\'' + m.id + '\')">';
    html += '<div class="metric-card-inner">';
    html += '<div style="flex:1;min-width:0;">';
    html += '<div class="metric-name">' + escapeHtml(m.name) + '</div>';
    const shortDesc = escapeHtml(m.formula).split('\n')[0];
    html += '<div class="metric-desc" title="' + escapeHtml(m.formula) + '">' + shortDesc + '</div>';
    html += '<div class="metric-meta">' + m.version + ' · ' + historyCount + ' 个版本</div>';
    html += '</div>';
    html += '<button class="card-delete-btn" title="删除指标" onclick="event.stopPropagation(); confirmDeleteMetric(\'' + m.id + '\')">';
    html += '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>';
    html += '</button>';
    html += '</div>';
    html += '</div>';
  });
  listEl.innerHTML = html;
}

function renderRightPanel() {
  const rightEl = document.getElementById('metrics-right');
  const metric = findMetricById(appData.activeMetricId);

  if (!metric) {
    rightEl.innerHTML = '<div class="metrics-empty"><div class="empty-icon"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10M12 20V4M6 20v-6"/></svg></div><div class="empty-title">选择一个指标以查看和编辑配置</div><div class="empty-hint">从左侧列表中选择一个已有指标，或点击下方按钮新建</div></div>';
    return;
  }

  const cfg = metric.config || {};
  const historyHtml = metric.history.slice().reverse().map((h, i) => '<div class="version-item' + (i === 0 ? ' latest' : '') + '"><div class="version-tag">' + h.version + '</div><div class="version-sql" title="' + escapeHtml(h.formula) + '">' + escapeHtml(h.formula) + '</div><div class="version-time">' + h.time + '</div></div>').join('');

  // Determine which method tab is active
  const method = appData.method || 'visual';

  rightEl.innerHTML = '';

  // Header
  const header = document.createElement('div');
  header.className = 'metric-editor-header';
  header.innerHTML = '<span class="metric-editor-title">' + escapeHtml(metric.name) + '</span><span class="metric-editor-badge">' + metric.version + '</span>';
  rightEl.appendChild(header);

  // Method tabs
  const tabs = document.createElement('div');
  tabs.className = 'method-tabs';
  tabs.innerHTML = '<button class="method-tab' + (method === 'visual' ? ' active' : '') + '" onclick="switchMethod(\'visual\')">可视化配置</button><button class="method-tab' + (method === 'nl' ? ' active' : '') + '" onclick="switchMethod(\'nl\')">自然语言描述</button>';
  rightEl.appendChild(tabs);

  // Editor body
  const body = document.createElement('div');
  body.className = 'metric-editor-body';
  if (method === 'visual') {
    body.innerHTML = buildVisualEditor(metric, cfg);
  } else {
    body.innerHTML = buildNLEditor(metric, cfg);
  }
  rightEl.appendChild(body);

  // SQL Preview

  sqlPreview.className = 'sql-preview';
  sqlPreview.innerHTML = '<div class="sql-preview-label">自动生成的 SQL</div><div class="sql-preview-box" id="sql-preview-box"><span class="sql-auto-tag">AI 自动生成</span>' + highlightSQL(metric.formula) + '</div>';
  rightEl.appendChild(sqlPreview);

  // Version History
  const vh = document.createElement('div');
  vh.className = 'version-history';
  vh.innerHTML = '<div class="version-history-title">版本历史</div><div class="version-timeline">' + historyHtml + '</div>';
  rightEl.appendChild(vh);

  // If visual method, attach dynamic listeners
  if (method === 'visual') {
    attachVisualListeners(metric);
    updateVisualPreview(metric);
  }
}

function currentMetric() { return findMetricById(appData.activeMetricId); }

function changeTable() {
  const table = document.getElementById('edit-table').value;
  const metric = currentMetric();
  if (!metric) return;

  // Reset field, calc, time when table changes
  metric.config = metric.config || {};
  metric.config.table = table;
  metric.config.field = '';
  metric.config.calc = '';
  metric.config.timeField = '';

  renderRightPanel();
}

function selectField(el, fieldName) {
  const metric = currentMetric();
  if (!metric) return;

  // Update UI
  document.querySelectorAll('#field-grid .field-select-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');

  metric.config = metric.config || {};
  metric.config.field = fieldName;

  // Reset calc if incompatible
  const schema = TABLE_SCHEMA[metric.config.table];
  const field = schema.fields.find(f => f.name === fieldName);
  if (field && metric.config.calc) {
    const calcOpt = CALC_OPTIONS.find(c => c.key === metric.config.calc);
    if (calcOpt && !calcOpt.supports.includes(field.type)) {
      metric.config.calc = '';
    }
  }

  updateCalcOptionsUI(metric);
  updateVisualPreview(metric);
}

function selectCalc(el, calcKey) {
  if (el.classList.contains('disabled')) return;
  const metric = currentMetric();
  if (!metric) return;

  document.querySelectorAll('#calc-options .calc-option').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');

  metric.config = metric.config || {};
  metric.config.calc = calcKey;

  updateVisualPreview(metric);
}

function updateCalcOptionsUI(metric) {
  const cfg = metric.config || {};
  const schema = TABLE_SCHEMA[cfg.table];
  const field = schema.fields.find(f => f.name === cfg.field);
  if (!field) return;

  document.querySelectorAll('#calc-options .calc-option').forEach(el => {
    const calcKey = el.getAttribute('data-calc');
    const calcOpt = CALC_OPTIONS.find(c => c.key === calcKey);
    const supported = calcOpt && calcOpt.supports.includes(field.type);
    el.classList.toggle('disabled', !supported);
  });
}

function updateVisualPreview(metric) {
  const cfg = metric.config || {};
  const table = cfg.table || 'transactions';
  const field = cfg.field || '';
  const calc = cfg.calc || '';
  const timeField = cfg.timeField || '';

  // Generate formula
  let formula = '';
  if (calc === 'sum') {
    formula = 'SUM(' + field + ')';
  } else if (calc === 'count') {
    formula = 'COUNT(' + (field ? field : '*') + ')';
  } else if (calc === 'count_distinct') {
    formula = 'COUNT(DISTINCT ' + field + ')';
  } else {
    formula = 'SELECT ...';
  }

  // If timeField selected, add a comment
  if (timeField && formula !== 'SELECT ...') {
    formula = formula + '\n-- WHERE ' + timeField + ' BETWEEN [开始时间] AND [结束时间]';
  }

  metric.formula = formula;

  // Auto-generate description always in visual mode
  const descEl = document.getElementById('edit-description');
  if (descEl) {
    const autoDesc = generateAutoDescription(table, field, calc, timeField);
    descEl.value = autoDesc;
  }

  // Update SQL preview box
  const box = document.getElementById('sql-preview-box');
  if (box) {
    box.innerHTML = '<span class="sql-auto-tag">AI 自动生成</span>' + highlightSQL(formula);
  }
}

// ============================================================
// NL PARSER (Simulated AI)
// ============================================================
function parseNLToConfig(text) {
  const lower = text.toLowerCase();

  // ===== 复合公式识别（优先处理） =====
  // 客单价 = 销售额 / 订单数
  if (lower.includes('客单价') || ((lower.includes('平均') && lower.includes('订单')) && lower.includes('/')) || (lower.includes('销售额') && lower.includes('订单数') && (lower.includes('/') || lower.includes('除以') || lower.includes('比')))) {
    const result = {
      config: { table: 'transactions', field: '实付订单', calc: 'sum', timeField: '购买时间' },
      formula: 'SUM(实付订单) / COUNT(DISTINCT 用户ID)',
      description: '平均每笔订单的实际支付金额，等于销售额除以订单数'
    };
    return result;
  }

  // 退款率 = 退款数 / 总订单数
  if (lower.includes('退款率') || (lower.includes('退款') && lower.includes('率'))) {
    const result = {
      config: { table: 'transactions', field: '订单状态', calc: 'count', timeField: '退单时间' },
      formula: "SUM(CASE WHEN 订单状态='已退款' THEN 1 ELSE 0 END) * 100.0 / COUNT(*)",
      description: '已退款订单占总订单的百分比'
    };
    return result;
  }

  // 复购率 = 购买多次的用户数 / 总用户数
  if (lower.includes('复购率') || (lower.includes('复购') && lower.includes('率'))) {
    const result = {
      config: { table: 'transactions', field: '用户ID', calc: 'count_distinct', timeField: '购买时间' },
      formula: 'COUNT(DISTINCT CASE WHEN COUNT(用户ID) > 1 THEN 用户ID END) * 100.0 / COUNT(DISTINCT 用户ID)',
      description: '购买超过一次的用户占总用户的百分比'
    };
    return result;
  }

  // 通用除法识别："A除以B" 或 "A/B"
  const divMatch = text.match(/(.+?)(?:除以|\/|比上|除)(.+)/);
  if (divMatch && !lower.includes('退款') && !lower.includes('客单')) {
    const numerator = divMatch[1].trim();
    const denominator = divMatch[2].trim();
    const numConfig = parseSimpleMetric(numerator);
    const denConfig = parseSimpleMetric(denominator);
    if (numConfig && denConfig) {
      const result = {
        config: { table: numConfig.config.table, field: numConfig.config.field, calc: numConfig.config.calc, timeField: numConfig.config.timeField || denConfig.config.timeField },
        formula: numConfig.formula + ' / ' + denConfig.formula,
        description: numerator + '除以' + denominator
      };
      return result;
    }
  }

  // ===== 基于已有指标运算识别 =====
  // 识别 "指标A / 指标B" 或 "指标A除以指标B"
  const metrics = (typeof getMetricsConfig === 'function' ? getMetricsConfig() : null);
  if (metrics && metrics.metrics) {
    const metricNames = metrics.metrics.map(m => m.name);
    const foundMetrics = metricNames.filter(n => text.includes(n));
    if (foundMetrics.length >= 2) {
      // 找到两个已有指标的运算
      let formula = '';
      let desc = '';
      const ops = [
        { pattern: /(.+?)\s*(?:\/|除以|比上)\s*(.+)/, op: ' / ', desc: '除以' },
        { pattern: /(.+?)\s*(?:\+|加上|加上)\s*(.+)/, op: ' + ', desc: '加上' },
        { pattern: /(.+?)\s*(?:\-|减去|减)\s*(.+)/, op: ' - ', desc: '减去' },
        { pattern: /(.+?)\s*(?:\*|乘以|乘)\s*(.+)/, op: ' * ', desc: '乘以' }
      ];
      for (const opDef of ops) {
        const m = text.match(opDef.pattern);
        if (m) {
          const left = m[1].trim();
          const right = m[2].trim();
          const leftMetric = metrics.metrics.find(mt => left.includes(mt.name));
          const rightMetric = metrics.metrics.find(mt => right.includes(mt.name));
          if (leftMetric && rightMetric) {
            const leftFormula = leftMetric.formula.split('\n')[0].split('--')[0].trim();
            const rightFormula = rightMetric.formula.split('\n')[0].split('--')[0].trim();
            formula = '(' + leftFormula + ')' + opDef.op + '(' + rightFormula + ')';
            desc = leftMetric.name + opDef.desc + rightMetric.name;
            const result = {
              config: { table: leftMetric.config.table, field: leftMetric.config.field, calc: leftMetric.config.calc, timeField: leftMetric.config.timeField },
              formula: formula,
              description: desc
            };
            return result;
          }
        }
      }
    }
  }

  // ===== 单字段聚合（原有逻辑） =====
  return parseSimpleMetric(text);
}

// 辅助函数：解析单个简单指标描述
function parseSimpleMetric(text) {
  const lower = text.toLowerCase();

  // Determine table
  let table = 'transactions';
  if (lower.includes('用户') && !lower.includes('订单')) table = 'users';
  else if (lower.includes('商品') || lower.includes('产品')) table = 'products';

  // Determine field
  let field = '';
  if (lower.includes('销售额') || lower.includes('实付') || lower.includes('收入')) field = '实付订单';
  else if (lower.includes('消费') || lower.includes('金额')) field = '消费金额';
  else if ((lower.includes('订单') && lower.includes('数')) || (lower.includes('用户') && (lower.includes('数') || lower.includes('量')))) field = '用户ID';
  else if (lower.includes('退款') || lower.includes('退货')) field = '订单状态';
  else if (lower.includes('数量')) field = '购买数量';
  else if (lower.includes('单价')) field = '单价';
  else if (lower.includes('年龄')) field = '用户年龄';
  else { field = '实付订单'; }

  // Determine calc
  let calc = 'sum';
  if (lower.includes('去重') || lower.includes('不同') || lower.includes('distinct')) calc = 'count_distinct';
  else if (lower.includes('计数') || lower.includes('统计') || (lower.includes('数') && !lower.includes('销售额') && !lower.includes('金额'))) calc = 'count';
  else if (lower.includes('求和') || lower.includes('总和') || lower.includes('总额')) calc = 'sum';
  else if (lower.includes('占比') || lower.includes('比例') || lower.includes('率')) calc = 'count';

  // Determine time field
  let timeField = '';
  if (lower.includes('退单')) timeField = '退单时间';
  else if (lower.includes('购买')) timeField = '购买时间';
  else if (lower.includes('下单')) timeField = '下单时间';
  else {
    const schema = (typeof TABLE_SCHEMA !== 'undefined' && TABLE_SCHEMA[table]);
    const tf = schema ? schema.fields.find(f => f.isTime) : null;
    if (tf) timeField = tf.name;
    else if (table === 'transactions') timeField = '购买时间';
  }

  // Generate formula
  let formula = '';
  if (calc === 'sum') formula = 'SUM(' + field + ')';
  else if (calc === 'count') formula = 'COUNT(' + (field ? field : '*') + ')';
  else if (calc === 'count_distinct') formula = 'COUNT(DISTINCT ' + field + ')';

  if (timeField && formula.indexOf('WHERE') === -1) {
    formula = formula + '\n-- WHERE ' + timeField + ' BETWEEN [开始时间] AND [结束时间]';
  }

  const description = generateAutoDescription(table, field, calc, timeField);

  return {
    config: { table, field, calc, timeField },
    formula, description
  };
}

// ============================================================
// HELPERS
// ============================================================
function typeLabel(type) {
  return { string: '文本', number: '数值', datetime: '时间' }[type] || type;
}

function calcLabel(key) {
  const opt = CALC_OPTIONS.find(c => c.key === key);
  return opt ? opt.label + ' (' + opt.hint + ')' : key;
}

function generateAutoDescription(table, field, calc, timeField) {
  const calcName = { sum: '求和', count: '计数', count_distinct: '去重计数' }[calc] || calc;
  const tableName = TABLE_SCHEMA[table] ? TABLE_SCHEMA[table].label : table;
  let desc = '对「' + tableName + '」表的「' + field + '」字段进行' + calcName;
  if (timeField) desc += '，按「' + timeField + '」筛选时间范围';
  return desc;
}

function highlightSQL(sql) {
  return escapeHtml(sql)
    .replace(/(SUM|COUNT|DISTINCT|CASE|WHEN|THEN|ELSE|END|SELECT|WHERE|BETWEEN|AND|AS|FROM)/g, '<span class="sql-keyword">$1</span>')
    .replace(/(\'[^\']*\')/g, '<span class="sql-string">$1</span>')
    .replace(/(--.*)/g, '<span class="sql-comment">$1</span>')
    .replace(/(SUM|COUNT)\(/g, '<span class="sql-func">$1</span>(');
}

// ============================================================
// ACTIONS
// ============================================================
function switchMethod(method) {
  appData.method = method;
  saveMetricsData(appData);
  renderRightPanel();
}

function selectMetric(id) {
  appData.activeMetricId = id;
  saveMetricsData(appData);
  renderAll();
}

function cancelEdit() {
  appData.activeMetricId = null;
  saveMetricsData(appData);
  renderAll();
}

function saveMetric() {
  const metric = findMetricById(appData.activeMetricId);
  if (!metric) return;

  const method = appData.method || 'visual';
  let configChanged = false;

  if (method === 'visual') {
    const table = document.getElementById('edit-table').value;
    const unit = document.getElementById('edit-unit').value.trim();
    const description = document.getElementById('edit-description').value.trim();
    const timeFieldEl = document.getElementById('edit-timeField');
    const timeField = timeFieldEl ? timeFieldEl.value : '';

    metric.unit = unit;
    metric.description = description;
    metric.config = metric.config || {};
    metric.config.table = table;
    metric.config.timeField = timeField;

    // Ensure field and calc are selected
    if (!metric.config.field || !metric.config.calc) {
      showToast('请完成字段和计算方式的选择', 'warning');
      return;
    }

    // Update formula based on visual config
    updateVisualPreview(metric);

    // Check if config changed
    const prev = metric.history[metric.history.length - 1];
    configChanged = !prev || metric.formula !== prev.formula || table !== (prev.config && prev.config.table);

  } else {
    // NL method: config already set by generateFromNL
    const unit = document.getElementById('edit-unit').value.trim();
    const description = document.getElementById('edit-description').value.trim();
    metric.unit = unit;
    if (description) metric.description = description;

    const prev = metric.history[metric.history.length - 1];
    configChanged = !prev || metric.formula !== prev.formula;
  }

  if (configChanged) {
    const newVersion = bumpVersion(metric.version);
    metric.version = newVersion;
    appData.globalVersion = newVersion;
    metric.history.push({
      version: newVersion,
      formula: metric.formula,
      description: metric.description,
      config: JSON.parse(JSON.stringify(metric.config)),
      time: nowString()
    });
    showToast('指标「' + metric.name + '」已更新，当前版本 ' + newVersion, 'success');
  } else {
    showToast('指标「' + metric.name + '」已保存（配置未变更，版本号不变）', 'success');
  }

  saveMetricsData(appData);
  renderAll();
}

function createNewMetric() {
  // 提供两种创建方式
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'new-metric-modal';
  overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:1000;display:flex;align-items:center;justify-content:center;';
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  
  const metrics = appData.metrics || [];
  const metricCheckboxes = metrics.map(m => 
    `<label style="display:flex;align-items:center;gap:6px;padding:4px 0;font-size:13px;cursor:pointer;">
      <input type="checkbox" value="${m.id}" class="existing-metric-cb" onchange="updateFormulaPreview()"> 
      ${escapeHtml(m.name)} <code style="background:var(--color-bg);padding:1px 4px;border-radius:3px;font-size:11px;color:var(--color-text-tertiary);">${escapeHtml(m.formula.split('\n')[0])}</code>
    </label>`
  ).join('');
  
  overlay.innerHTML = `
    <div style="background:var(--color-bg-card);border-radius:var(--radius-lg);padding:24px;width:480px;max-width:90vw;box-shadow:0 8px 32px rgba(0,0,0,0.2);">
      <div style="font-size:16px;font-weight:600;margin-bottom:16px;">新建指标</div>
      
      <div style="margin-bottom:12px;">
        <label style="display:block;font-size:12px;color:var(--color-text-tertiary);margin-bottom:4px;font-weight:600;">指标名称</label>
        <input type="text" id="new-metric-name" placeholder="例如：客单价" style="width:100%;padding:8px 10px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-bg-elevated);color:var(--color-text);font-size:13px;">
      </div>
      
      <div style="margin-bottom:12px;">
        <label style="display:block;font-size:12px;color:var(--color-text-tertiary);margin-bottom:4px;font-weight:600;">创建方式</label>
        <div style="display:flex;gap:12px;">
          <label style="display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;">
            <input type="radio" name="create-mode" value="simple" checked onchange="toggleCreateMode()"> 从零配置
          </label>
          <label style="display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;">
            <input type="radio" name="create-mode" value="composite" onchange="toggleCreateMode()"> 基于已有指标运算
          </label>
          <label style="display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;">
            <input type="radio" name="create-mode" value="nl" onchange="toggleCreateMode()"> 自然语言描述
          </label>
        </div>
      </div>
      
      <div id="composite-area" style="display:none;margin-bottom:12px;">
        <label style="display:block;font-size:12px;color:var(--color-text-tertiary);margin-bottom:4px;font-weight:600;">选择已有指标和运算符</label>
        <div style="max-height:150px;overflow-y:auto;border:1px solid var(--color-border);border-radius:var(--radius-md);padding:8px;margin-bottom:8px;">
          ${metricCheckboxes}
        </div>
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;">
          <select id="composite-op" onchange="updateFormulaPreview()" style="padding:6px 8px;border:1px solid var(--color-border);border-radius:var(--radius-md);font-size:13px;">
            <option value="/">÷ 除以</option>
            <option value="+">+ 加上</option>
            <option value="-">- 减去</option>
            <option value="*">× 乘以</option>
          </select>
          <span style="font-size:11px;color:var(--color-text-tertiary);">勾选2个指标，选择运算符</span>
        </div>
        <div id="formula-preview" style="padding:8px;background:var(--color-bg-inset);border-radius:var(--radius-md);font-size:12px;color:var(--color-text-secondary);font-family:monospace;"></div>
      </div>
      
      <div id="nl-area" style="display:none;margin-bottom:12px;">
        <label style="display:block;font-size:12px;color:var(--color-text-tertiary);margin-bottom:4px;font-weight:600;">用自然语言描述</label>
        <textarea id="new-metric-nl" rows="2" placeholder="例如：销售额除以订单数" style="width:100%;padding:8px 10px;border:1px solid var(--color-border);border-radius:var(--radius-md);font-size:13px;resize:vertical;"></textarea>
      </div>
      
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px;">
        <button class="btn btn-secondary btn-sm" onclick="document.getElementById('new-metric-modal').remove()">取消</button>
        <button class="btn btn-primary btn-sm" onclick="confirmCreateMetric()">创建</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
}

function toggleCreateMode() {
  const mode = document.querySelector('input[name="create-mode"]:checked').value;
  document.getElementById('composite-area').style.display = mode === 'composite' ? 'block' : 'none';
  document.getElementById('nl-area').style.display = mode === 'nl' ? 'block' : 'none';
}

function updateFormulaPreview() {
  const checked = document.querySelectorAll('.existing-metric-cb:checked');
  const op = document.getElementById('composite-op').value;
  const preview = document.getElementById('formula-preview');
  if (checked.length < 2) {
    preview.textContent = '请勾选至少2个指标';
    return;
  }
  const metrics = appData.metrics || [];
  const selected = Array.from(checked).map(cb => metrics.find(m => m.id === cb.value)).filter(Boolean);
  const formulas = selected.map(m => '(' + m.formula.split('\n')[0].split('--')[0].trim() + ')');
  const names = selected.map(m => m.name);
  const opLabel = { '/': ' ÷ ', '+': ' + ', '-': ' - ', '*': ' × ' }[op] || ' ' + op + ' ';
  preview.textContent = names.join(opLabel) + ' = ' + formulas.join(op);
}

function confirmCreateMetric() {
  const name = document.getElementById('new-metric-name').value.trim();
  if (!name) { showToast('请输入指标名称', 'warning'); return; }
  
  const mode = document.querySelector('input[name="create-mode"]:checked').value;
  let config, formula, description;
  
  if (mode === 'composite') {
    const checked = document.querySelectorAll('.existing-metric-cb:checked');
    if (checked.length < 2) { showToast('请勾选至少2个已有指标', 'warning'); return; }
    const op = document.getElementById('composite-op').value;
    const metrics = appData.metrics || [];
    const selected = Array.from(checked).map(cb => metrics.find(m => m.id === cb.value)).filter(Boolean);
    const formulas = selected.map(m => '(' + m.formula.split('\n')[0].split('--')[0].trim() + ')');
    const names = selected.map(m => m.name);
    const opLabel = { '/': '除以', '+': '加上', '-': '减去', '*': '乘以' }[op] || op;
    formula = formulas.join(' ' + op + ' ');
    description = names.join(opLabel);
    config = { table: selected[0].config.table, field: selected[0].config.field, calc: selected[0].config.calc, timeField: selected[0].config.timeField };
  } else if (mode === 'nl') {
    const nlText = document.getElementById('new-metric-nl').value.trim();
    if (!nlText) { showToast('请输入自然语言描述', 'warning'); return; }
    const parsed = parseNLToConfig(nlText);
    config = parsed.config;
    formula = parsed.formula;
    description = parsed.description;
  } else {
    config = { table: 'transactions', field: '', calc: '', timeField: '' };
    formula = 'SELECT ...';
    description = '';
  }
  
  const newMetric = {
    id: generateId(),
    name: name,
    config: config,
    formula: formula,
    description: description,
    unit: '',
    version: 'v1.0',
    history: [{ version: 'v1.0', formula: formula, description: description, time: nowString() }]
  };
  
  appData.metrics.push(newMetric);
  appData.activeMetricId = newMetric.id;
  appData.method = mode === 'nl' ? 'nl' : 'visual';
  saveMetricsData(appData);
  renderAll();
  document.getElementById('new-metric-modal').remove();
  showToast('指标「' + name + '」已创建', 'success');
}

function confirmDeleteMetric(id) {
  const metric = findMetricById(id);
  if (!metric) return;
  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.id = 'confirm-overlay';
  overlay.innerHTML = '<div class="confirm-dialog"><h3>确认删除</h3><p>确定要删除指标「<strong>' + escapeHtml(metric.name) + '</strong>」吗？<br/>此操作将删除该指标的所有版本历史，且不可撤销。</p><div class="confirm-actions"><button class="btn btn-secondary btn-sm" onclick="closeConfirm()">取消</button><button class="btn btn-danger btn-sm" onclick="executeDeleteMetric(\'' + id + '\')">确认删除</button></div></div>';
  document.getElementById('confirm-container').appendChild(overlay);
  overlay.addEventListener('click', function(e) { if (e.target === overlay) closeConfirm(); });
}

function closeConfirm() { const o = document.getElementById('confirm-overlay'); if (o) o.remove(); }

function executeDeleteMetric(id) {
  closeConfirm();
  const metric = findMetricById(id);
  if (!metric) return;
  const name = metric.name;
  const idx = findMetricIndexById(id);
  appData.metrics.splice(idx, 1);
  if (appData.activeMetricId === id) {
    appData.activeMetricId = appData.metrics.length > 0 ? appData.metrics[0].id : null;
  }
  saveMetricsData(appData);
  renderAll();
  showToast('指标「' + name + '」已删除', 'warning');
}

// ============================================================
// UTILS
// ============================================================
function findMetricById(id) { return appData.metrics.find(m => m.id === id) || null; }
function findMetricIndexById(id) { return appData.metrics.findIndex(m => m.id === id); }
function escapeHtml(str) { return str.replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c])); }
function generateId() { return 'metric-' + Date.now() + '-' + Math.random().toString(36).substr(2, 6); }
function bumpVersion(v) { const m = v.match(/^v(\d+)\.(\d+)$/); if (!m) return 'v1.1'; let major = parseInt(m[1], 10), minor = parseInt(m[2], 10); minor++; if (minor > 99) { major++; minor = 0; } return 'v' + major + '.' + minor; }
function nowString() { const d = new Date(); const pad = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function updateGlobalVersionBadge() { document.getElementById('global-version').textContent = '口径版本 ' + appData.globalVersion; }

function showToast(msg, type) {
  type = type || 'success';
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  let icon = '';
  if (type === 'success') icon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>';
  else if (type === 'warning') icon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>';
  else icon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>';
  el.innerHTML = icon + ' ' + msg;
  container.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s ease'; setTimeout(() => el.remove(), 300); }, 3000);
}

  await ShujianDB.init();
  await loadSchemas();
  renderAll();
})();
