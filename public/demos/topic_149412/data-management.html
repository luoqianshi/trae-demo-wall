<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据管理 - 数见 AI 数据助手</title>
<link rel="stylesheet" href="shared.css">
<script src="db.js?v=7"></script>
<style>
/* ===== PAGE-SPECIFIC STYLES ===== */

/* Upload zone */
.upload-wrapper { margin-bottom: var(--space-6); }
.upload-zone { cursor: pointer; transition: all 0.2s; }
.upload-zone .upload-icon svg { color: var(--color-text-tertiary); }
.upload-zone:hover .upload-icon svg,
.upload-zone.drag-over .upload-icon svg { color: var(--brand-primary); }
.upload-actions { display: flex; justify-content: center; margin-top: var(--space-4); }
.upload-actions .file-input-wrap { position: relative; }
.upload-actions .file-input-wrap input[type="file"] {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
}
.format-tags { display: flex; justify-content: center; gap: var(--space-3); margin-top: var(--space-4); }
.format-tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px; border-radius: var(--radius-full);
  background: var(--brand-primary-light); color: var(--brand-primary);
  font-size: var(--text-xs); font-weight: var(--weight-semibold);
}
.format-tag.active { background: var(--brand-primary); color: #fff; }

/* Section */
.section { margin-bottom: var(--space-6); }
.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-4); }
.section-title { font-size: var(--text-lg); font-weight: var(--weight-semibold); }

/* File table */
.file-list-table { width: 100%; border-collapse: collapse; }
.file-list-table thead th {
  text-align: left; padding: 10px 12px; font-weight: var(--weight-semibold);
  color: var(--color-text-secondary); background: var(--color-bg-inset);
  border-bottom: 1px solid var(--color-border); white-space: nowrap;
  font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.03em;
}
.file-list-table tbody td { padding: 12px; border-bottom: 1px solid var(--color-border-light); font-size: var(--text-sm); color: var(--color-text); }
.file-list-table tbody tr:hover td { background: var(--brand-primary-light); }
.file-list-table tbody tr:last-child td { border-bottom: none; }
.file-list-table .file-name-cell { font-weight: var(--weight-semibold); display: flex; align-items: center; gap: var(--space-2); }
.file-list-table .file-icon { width: 32px; height: 32px; border-radius: var(--radius-md); background: var(--brand-primary-light); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.file-list-table .file-icon svg { color: var(--brand-primary); }
.file-list-table .status-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: var(--radius-full); font-size: var(--text-xs); font-weight: var(--weight-medium); }
.file-list-table .action-btns { display: flex; gap: var(--space-2); }

/* Data quality cards */
.quality-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-4); margin-bottom: var(--space-6); }
.quality-card { background: var(--color-bg-elevated); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-5); }
.quality-card .qc-label { font-size: var(--text-xs); color: var(--color-text-tertiary); margin-bottom: var(--space-2); }
.quality-card .qc-value { font-size: var(--text-2xl); font-weight: var(--weight-bold); letter-spacing: -0.02em; margin-bottom: var(--space-2); }
.quality-card .qc-desc { font-size: var(--text-xs); color: var(--color-text-secondary); }
.quality-card .qc-progress { margin-top: var(--space-2); }

/* Missing detail table */
.missing-detail { margin-top: var(--space-4); }
.missing-detail .md-title { font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--color-text-secondary); margin-bottom: var(--space-3); }
.missing-table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
.missing-table thead th { text-align: left; padding: 8px 12px; font-weight: var(--weight-semibold); color: var(--color-text-secondary); background: var(--color-bg-inset); border-bottom: 1px solid var(--color-border); font-size: var(--text-xs); }
.missing-table tbody td { padding: 8px 12px; border-bottom: 1px solid var(--color-border-light); }
.missing-table tbody tr:last-child td { border-bottom: none; }

/* Preview panel */
.preview-panel { background: var(--color-bg-elevated); border: 1px solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; }
.preview-panel .preview-header { display: flex; align-items: center; justify-content: space-between; padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--color-border); }
.preview-panel .preview-title { font-size: var(--text-base); font-weight: var(--weight-semibold); }
.preview-panel .preview-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--color-border); padding: 0 var(--space-5); background: var(--color-bg-inset); }
.preview-tab { padding: var(--space-3) var(--space-4); font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--color-text-secondary); cursor: pointer; border: none; background: none; font-family: inherit; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; }
.preview-tab:hover { color: var(--color-text); }
.preview-tab.active { color: var(--brand-primary); border-bottom-color: var(--brand-primary); }
.preview-panel .preview-body { padding: var(--space-5); overflow-x: auto; }
.preview-table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
.preview-table thead th { text-align: left; padding: 8px 12px; font-weight: var(--weight-semibold); color: var(--color-text-secondary); background: var(--color-bg-inset); border-bottom: 1px solid var(--color-border); white-space: nowrap; font-size: var(--text-xs); }
.preview-table tbody td { padding: 8px 12px; border-bottom: 1px solid var(--color-border-light); color: var(--color-text); white-space: nowrap; max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
.preview-table tbody tr:hover td { background: var(--brand-primary-light); }
.preview-table tbody tr:last-child td { border-bottom: none; }
.preview-table .missing-cell { color: var(--color-warning); font-style: italic; }
.preview-row-count { font-size: var(--text-xs); color: var(--color-text-tertiary); margin-top: var(--space-3); text-align: right; }

/* Toast */
.toast { position: fixed; top: 70px; right: 20px; z-index: 200; padding: 12px 16px; border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: var(--weight-medium); box-shadow: var(--shadow-lg); animation: slideIn 0.3s ease; display: flex; align-items: center; gap: 8px; }
.toast.info { background: var(--brand-primary-light); color: var(--brand-primary); border: 1px solid var(--brand-primary-muted); }
.toast.success { background: var(--color-success-light); color: #065f46; border: 1px solid #a7f3d0; }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* Quality Report Modal */
.qr-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 300; display: flex; align-items: center; justify-content: center; animation: fadeIn 0.2s ease; }
.qr-modal { background: var(--color-bg-elevated); border-radius: var(--radius-xl); width: 90%; max-width: 720px; max-height: 85vh; display: flex; flex-direction: column; box-shadow: var(--shadow-xl); border: 1px solid var(--color-border); animation: scaleIn 0.2s ease; }
.qr-modal-header { display: flex; align-items: center; justify-content: space-between; padding: var(--space-5) var(--space-6); border-bottom: 1px solid var(--color-border); flex-shrink: 0; }
.qr-modal-title { font-size: var(--text-lg); font-weight: var(--weight-semibold); display: flex; align-items: center; gap: var(--space-2); }
.qr-modal-close { width: 32px; height: 32px; border-radius: var(--radius-md); border: none; background: var(--color-bg-inset); color: var(--color-text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.qr-modal-close:hover { background: var(--color-border); }
.qr-modal-body { padding: var(--space-5) var(--space-6); overflow-y: auto; flex: 1; }
.qr-score { display: flex; align-items: center; gap: var(--space-4); margin-bottom: var(--space-5); padding: var(--space-4); background: var(--color-bg-inset); border-radius: var(--radius-lg); }
.qr-score-ring { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: var(--text-xl); font-weight: var(--weight-bold); flex-shrink: 0; border: 4px solid; }
.qr-score-ring.good { border-color: var(--color-success); color: var(--color-success); background: var(--color-success-light); }
.qr-score-ring.warn { border-color: var(--color-warning); color: var(--color-warning); background: #fffbeb; }
.qr-score-ring.bad { border-color: var(--color-error); color: var(--color-error); background: #fef2f2; }
.qr-score-label { font-size: var(--text-sm); color: var(--color-text-secondary); }
.qr-section { margin-bottom: var(--space-5); }
.qr-section-title { font-size: var(--text-base); font-weight: var(--weight-semibold); margin-bottom: var(--space-3); display: flex; align-items: center; gap: var(--space-2); }
.qr-issue { padding: var(--space-3) var(--space-4); background: var(--color-bg-inset); border-radius: var(--radius-md); margin-bottom: var(--space-2); border-left: 3px solid var(--color-warning); }
.qr-issue.error { border-left-color: var(--color-error); }
.qr-issue.success { border-left-color: var(--color-success); }
.qr-issue-title { font-weight: var(--weight-semibold); font-size: var(--text-sm); margin-bottom: 2px; }
.qr-issue-desc { font-size: var(--text-xs); color: var(--color-text-secondary); }
.qr-issue-meta { font-size: var(--text-xs); color: var(--color-text-tertiary); margin-top: 4px; }
.qr-advice { padding: var(--space-3) var(--space-4); background: var(--brand-primary-light); border-radius: var(--radius-md); margin-bottom: var(--space-2); }
.qr-advice-title { font-weight: var(--weight-semibold); font-size: var(--text-sm); color: var(--brand-primary); margin-bottom: 2px; }
.qr-advice-desc { font-size: var(--text-xs); color: var(--color-text-secondary); }
.qr-loading { text-align: center; padding: var(--space-8); color: var(--color-text-tertiary); }
.qr-empty { text-align: center; padding: var(--space-6); color: var(--color-text-tertiary); font-size: var(--text-sm); }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes scaleIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* Responsive */
@media (max-width: 1024px) { .quality-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px) {
  .quality-grid { grid-template-columns: 1fr; }
  .header-nav { display: none; }
}
/* 表关联配置 */
.relation-table { width:100%; border-collapse:collapse; font-size:13px; }
.relation-table th { text-align:left; padding:8px 12px; background:var(--color-bg-elevated); color:var(--color-text-tertiary); font-weight:var(--weight-semibold); font-size:11px; text-transform:uppercase; border-bottom:1px solid var(--color-border); }
.relation-table td { padding:8px 12px; border-bottom:1px solid var(--color-border); color:var(--color-text-secondary); }
.relation-table tr:hover td { background:var(--color-bg-inset); }
.relation-link { display:inline-flex; align-items:center; gap:4px; font-weight:var(--weight-semibold); color:var(--brand-primary); }
.relation-arrow { color:var(--color-text-tertiary); font-size:16px; }
.modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); z-index:1000; display:flex; align-items:center; justify-content:center; }
.modal-box { background:var(--color-bg-card); border-radius:var(--radius-lg); padding:24px; width:440px; max-width:90vw; box-shadow:0 8px 32px rgba(0,0,0,0.2); }
.modal-title { font-size:16px; font-weight:var(--weight-semibold); margin-bottom:16px; }
.modal-field { margin-bottom:12px; }
.modal-field label { display:block; font-size:12px; color:var(--color-text-tertiary); margin-bottom:4px; font-weight:var(--weight-semibold); }
.modal-field select, .modal-field input { width:100%; padding:8px 10px; border:1px solid var(--color-border); border-radius:var(--radius-md); background:var(--color-bg-elevated); color:var(--color-text); font-size:13px; }
.modal-field select:focus, .modal-field input:focus { outline:none; border-color:var(--brand-primary); box-shadow:0 0 0 2px var(--brand-primary-muted); }
.modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }
</style>
</head>
<body>

<!-- ========== HEADER ========== -->
<header class="app-header">
  <div class="app-header-left">
    <a href="index.html" class="logo">数</a>

</header>

<!-- ========== PAGE BODY ========== -->
<div class="page-body" style="padding: var(--space-6);">

  <!-- ===== SECTION 1: Upload Zone ===== -->
  <div class="section upload-wrapper">
    <div class="upload-zone"
         id="upload-zone"
         onclick="document.getElementById('file-input').click()"
         ondragover="handleDragOver(event)"
         ondragleave="handleDragLeave(event)"
         ondrop="handleDrop(event)">
      <div class="upload-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </div>
      <div class="upload-title">拖拽文件到此处或点击上传</div>
      <div class="upload-hint">支持 CSV、Excel (.xlsx/.xls) 格式，单文件最大 100MB</div>
      <div class="format-tags">
        <span class="format-tag"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> CSV</span>
        <span class="format-tag active"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> XLSX</span>
        <span class="format-tag"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> XLS</span>
      </div>
    </div>
    <div class="upload-actions">
      <div class="file-input-wrap">
        <input type="file" id="file-input" accept=".csv,.xlsx,.xls" onchange="handleFileSelect(event)" style="display:none;"/>
        <button class="btn btn-primary btn-lg" onclick="document.getElementById('file-input').click()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          选择文件上传
        </button>
      </div>
    </div>
  </div>

  <!-- ===== SECTION 2: File List ===== -->
  <div class="section">
    <div class="section-header">
      <div class="section-title">已上传文件</div>
      <span class="badge badge-neutral" id="file-count-badge">加载中...</span>
    </div>
    <div class="card" style="padding: 0; overflow: hidden;">
      <table class="file-list-table">
        <thead>
          <tr>
            <th>文件名</th>
            <th>类型</th>
            <th>大小</th>
            <th>行数</th>
            <th>列数</th>
            <th>上传时间</th>
            <th>状态</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="file-list-body">
          <tr><td colspan="8" style="text-align:center;color:var(--color-text-tertiary);padding:24px;">加载中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 表关联配置 -->
  <div class="section-card" id="relation-section" style="margin-bottom:24px;">
    <div class="section-header">
      <div class="section-title" style="display:flex;align-items:center;gap:8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--brand-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
        表关联配置
      </div>
      <button class="btn btn-outline btn-sm" onclick="showAddRelationModal()">新增关联</button>
    </div>
    <p style="font-size:12px;color:var(--color-text-tertiary);margin-bottom:12px;">配置不同表之间的关联关系，智能问答时将自动关联并显示名称信息（如商品ID → 商品名称）。</p>
    <div id="relation-list"></div>
  </div>

  <!-- ===== SECTION 3: Data Preview ===== -->
  <div class="section">
    <div class="section-header">
      <div class="section-title">数据预览</div>
    </div>
    <div class="preview-panel">
      <div class="preview-tabs" id="preview-tabs">
        <!-- Tabs rendered by JS -->
      </div>
      <div class="preview-body" id="preview-body">
        <!-- Preview table rendered by JS -->
      </div>
    </div>
  </div>

  <!-- ===== SECTION 4: Data Quality ===== -->
  <div class="section">
    <div class="section-header">
      <div class="section-title">数据质量</div>
    </div>
    <div class="quality-grid" id="quality-grid">
      <div class="quality-card">
        <div class="qc-label">数据完整度</div>
        <div class="qc-value" style="color: var(--color-success);" id="q-completeness">-</div>
        <div class="progress-bar">
          <div class="progress-fill info" id="q-completeness-bar" style="width: 0%;"></div>
        </div>
        <div class="qc-desc" style="margin-top: var(--space-2);">总体数据质量</div>
      </div>
      <div class="quality-card">
        <div class="qc-label">缺失值</div>
        <div class="qc-value" style="color: var(--color-warning);" id="q-missing">-</div>
        <div class="qc-desc" id="q-missing-desc">-</div>
      </div>
      <div class="quality-card">
        <div class="qc-label">重复行</div>
        <div class="qc-value" style="color: var(--color-success);" id="q-duplicate">-</div>
        <div class="qc-desc">数据重复情况</div>
      </div>
      <div class="quality-card">
        <div class="qc-label">覆盖时间</div>
        <div class="qc-value" style="font-size: var(--text-xl);" id="q-time">-</div>
        <div class="qc-desc" id="q-time-desc">-</div>
      </div>
    </div>

    <!-- Missing values detail -->
    <div class="card missing-detail">
      <div class="md-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px;"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77.333.192 2 1.732 2z"/></svg>
        缺失字段明细
      </div>
      <table class="missing-table">
        <thead>
          <tr>
            <th style="width:40px;">#</th>
            <th>字段名</th>
            <th>所属表</th>
            <th>缺失条数</th>
            <th>缺失率</th>
            <th>影响</th>
          </tr>
        </thead>
        <tbody id="missing-table-body">
          <!-- Rendered by JS -->
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- Quality Report Modal -->
<div id="qr-modal-overlay" style="display:none;"></div>

<script>
// ====== DEMO DATA (always shown) ======
const DEMO_FILES = [
  { name: 'transactions.csv', type: 'CSV', size: '15KB', rows: 200, cols: 11, time: '2025-07-01 09:15', key: 'demo_transactions' },
  { name: 'users.xlsx', type: 'XLSX', size: '1KB', rows: 10, cols: 4, time: '2025-07-01 09:16', key: 'demo_users' },
  { name: 'products.csv', type: 'CSV', size: '1KB', rows: 10, cols: 4, time: '2025-07-01 09:16', key: 'demo_products' }
];

// ====== STATE ======
let realTables = [];
let currentTab = 'demo_transactions';

// ====== LOAD TABLES ======
async function loadTables() {
  const dbTables = ShujianDB.getTables();
  realTables = (ShujianDB.metadata.tables || []).filter(t => dbTables.includes(t.table_name));
  renderFileList();
  renderPreviewTabs();
  // 自动选中第一个有效标签
  if (!currentTab || (!DEMO_PREVIEW[currentTab] && !realTables.find(t => t.table_name === currentTab))) {
    currentTab = realTables.length > 0 ? realTables[0].table_name : 'demo_transactions';
  }
  await switchPreviewTab(currentTab);
  renderRelations();
}

// ====== RENDER FILE LIST ======
function renderFileList() {
  const tbody = document.getElementById('file-list-body');
  const badge = document.getElementById('file-count-badge');

  let html = '';

  // 如果 realTables 非空，说明数据库中已有数据（含预置演示数据），只显示 realTables
  if (realTables.length > 0) {
    badge.textContent = '共 ' + realTables.length + ' 个文件';
    realTables.forEach(t => {
      const size = formatSize(t.file_size);
      const time = t.uploaded_at ? t.uploaded_at.replace('T', ' ').substring(0, 16) : '-';
      const isDemo = ['transactions','users','products'].includes(t.table_name) && t.file_size === 0;
      html += '<tr>';
      html += '<td><div class="file-name-cell"><div class="file-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></div>' + escapeHtml(t.original_name) + '</div></td>';
      html += '<td>' + t.file_type + '</td>';
      html += '<td>' + size + '</td>';
      html += '<td>' + t.row_count.toLocaleString() + ' 行</td>';
      html += '<td>' + t.col_count + ' 列</td>';
      html += '<td>' + time + '</td>';
      html += '<td><span class="badge ' + (isDemo ? 'badge-info' : 'badge-success') + '">' + (isDemo ? '演示' : '已就绪') + '</span></td>';
      html += '<td><div class="action-btns"><button class="btn btn-outline btn-sm" onclick="switchPreviewTab(\'' + t.table_name + '\')">预览</button><button class="btn btn-info btn-sm" onclick="showQualityReport(\'' + t.table_name + '\', \'' + escapeHtml(t.original_name) + '\')">诊断</button>' + (isDemo ? '<button class="btn btn-secondary btn-sm" disabled title="演示文件不可删除">删除</button>' : '<button class="btn btn-secondary btn-sm" onclick="handleDelete(\'' + t.table_name + '\', \'' + escapeHtml(t.original_name) + '\')">删除</button>') + '</div></td>';
      html += '</tr>';
    });
  } else {
    // Demo files (fallback when DB is empty)
    badge.textContent = '共 ' + DEMO_FILES.length + ' 个文件';
    DEMO_FILES.forEach(d => {
      html += '<tr>';
      html += '<td><div class="file-name-cell"><div class="file-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></div>' + escapeHtml(d.name) + '</div></td>';
      html += '<td>' + d.type + '</td>';
      html += '<td>' + d.size + '</td>';
      html += '<td>' + d.rows.toLocaleString() + ' 行</td>';
      html += '<td>' + d.cols + ' 列</td>';
      html += '<td>' + d.time + '</td>';
      html += '<td><span class="badge badge-info">演示</span></td>';
      html += '<td><div class="action-btns"><button class="btn btn-outline btn-sm" onclick="switchPreviewTab(\'' + d.key + '\')">预览</button><button class="btn btn-secondary btn-sm" disabled title="演示文件不可删除">删除</button></div></td>';
      html += '</tr>';
    });
  }

  tbody.innerHTML = html;
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + 'B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + 'KB';
  return (bytes / (1024 * 1024)).toFixed(1) + 'MB';
}

// ====== RENDER PREVIEW TABS ======
function renderPreviewTabs() {
  const container = document.getElementById('preview-tabs');
  let html = '';

  // 如果 realTables 非空，说明数据库中已有数据（含预置演示数据），只显示 real tabs
  if (realTables.length > 0) {
    realTables.forEach(t => {
      const active = t.table_name === currentTab ? ' active' : '';
      html += '<button class="preview-tab' + active + '" data-tab="' + escapeHtml(t.table_name) + '" onclick="switchPreviewTab(\'' + t.table_name + '\')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px;"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>' + escapeHtml(t.original_name || t.table_name) + '</button>';
    });
  } else {
    // Demo tabs (fallback when DB is empty)
    DEMO_FILES.forEach(d => {
      const active = d.key === currentTab ? ' active' : '';
      html += '<button class="preview-tab' + active + '" data-tab="' + d.key + '" onclick="switchPreviewTab(\'' + d.key + '\')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px;"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>' + escapeHtml(d.name) + '</button>';
    });
  }

  container.innerHTML = html;
}

// ====== SWITCH TAB ======
async function switchPreviewTab(tabName) {
  currentTab = tabName;
  document.querySelectorAll('.preview-tab').forEach(tab => {
    tab.classList.toggle('active', tab.getAttribute('data-tab') === tabName);
  });
  await renderPreviewTable(tabName);
  await loadStats(tabName);
}

async function renderPreviewTable(tabName) {
  const container = document.getElementById('preview-body');
  container.innerHTML = '<div style="padding:40px;text-align:center;color:var(--color-text-tertiary);">加载中...</div>';

  // 如果 demo 标签对应的数据库表存在，优先查询数据库
  const dbTables = ShujianDB.getTables();
  const realTabName = tabName.replace(/^demo_/, '');
  const hasDbTable = dbTables.includes(realTabName);

  // Demo data (fallback when no DB table)
  if (DEMO_PREVIEW[tabName] && !hasDbTable) {
    const data = DEMO_PREVIEW[tabName];
    const columns = Object.keys(data[0]);
    const totalRows = tabName === 'demo_transactions' ? 200 : (tabName === 'demo_users' ? 10 : 10);

    let html = '<div style="overflow-x:auto;">';
    html += '<table class="preview-table">';
    html += '<thead><tr><th style="width:40px;">#</th>';
    columns.forEach(col => { html += '<th>' + escapeHtml(col) + '</th>'; });
    html += '</tr></thead><tbody>';
    data.forEach((row, idx) => {
      html += '<tr><td style="color:var(--color-text-tertiary);">' + (idx + 1) + '</td>';
      columns.forEach(col => {
        const val = String(row[col]);
        if (val === '_' || val === '' || val === '-') {
          html += '<td class="missing-cell" title="缺失值">' + (val === '-' ? '-' : '<span style="color:var(--color-success);font-style:normal;">NULL</span>') + '</td>';
        } else {
          html += '<td title="' + escapeHtml(val) + '">' + escapeHtml(val) + '</td>';
        }
      });
      html += '</tr>';
    });
    html += '</tbody></table></div>';
    html += '<div class="preview-row-count">显示前 10 行，共 ' + totalRows.toLocaleString() + ' 行 · ' + columns.length + ' 列';
    if (tabName === 'demo_transactions') html += ' <span style="margin-left:12px;">时间范围：2025-01-01 至 2026-06-30</span>';
    html += '</div>';
    container.innerHTML = html;
    return;
  }

  // Real data from ShujianDB (also used when demo DB table exists)
  const queryTab = hasDbTable ? realTabName : tabName;
  try {
    const data = ShujianDB.preview(queryTab, 10);
    const columns = data.columns;
    const rows = data.rows;
    const countRes = ShujianDB.query(`SELECT COUNT(*) as cnt FROM "${queryTab}"`);
    const total = countRes.rows[0]?.cnt || 0;

    let html = '<div style="overflow-x:auto;">';
    html += '<table class="preview-table">';
    html += '<thead><tr><th style="width:40px;">#</th>';
    columns.forEach(col => { html += '<th>' + escapeHtml(col) + '</th>'; });
    html += '</tr></thead><tbody>';
    rows.forEach((row, idx) => {
      html += '<tr><td style="color:var(--color-text-tertiary);">' + (idx + 1) + '</td>';
      columns.forEach(col => {
        const val = row[col];
        if (val === null || val === undefined || val === '') {
          html += '<td class="missing-cell" title="缺失值"><span style="color:var(--color-success);font-style:normal;">NULL</span></td>';
        } else {
          const s = String(val);
          html += '<td title="' + escapeHtml(s) + '">' + escapeHtml(s) + '</td>';
        }
      });
      html += '</tr>';
    });
    html += '</tbody></table></div>';
    html += '<div class="preview-row-count">显示前 ' + rows.length + ' 行，共 ' + total.toLocaleString() + ' 行 · ' + columns.length + ' 列</div>';
    container.innerHTML = html;
  } catch (e) {
    container.innerHTML = '<div style="padding:40px;text-align:center;color:var(--color-error);">加载预览失败：' + escapeHtml(e.message) + '</div>';
  }
}

// ====== STATS ======
async function loadStats(tabName) {
  const dbTables = ShujianDB.getTables();
  const realTabName = tabName.replace(/^demo_/, '');
  const hasDbTable = dbTables.includes(realTabName);

  // Demo data (fallback when no DB table)
  if (tabName === 'demo_transactions' && !hasDbTable) {
    const d = DEMO_MISSING;
    document.getElementById('q-completeness').textContent = d.completeness + '%';
    document.getElementById('q-completeness-bar').style.width = d.completeness + '%';
    document.getElementById('q-missing').textContent = d.total_missing + ' 个';
    document.getElementById('q-missing-desc').textContent = '分布在 ' + d.detail.length + ' 个字段中';
    document.getElementById('q-duplicate').textContent = d.duplicate_rows + ' 行';
    document.getElementById('q-time').textContent = '18 个月';
    document.getElementById('q-time-desc').textContent = d.time_range.min + ' 至 ' + d.time_range.max;
    renderDemoMissingTable();
    return;
  }

  if (tabName.startsWith('demo_') && !hasDbTable) {
    resetQualityCards();
    document.getElementById('missing-table-body').innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--color-text-tertiary);padding:16px;">演示数据无缺失值统计</td></tr>';
    return;
  }

  // Real data from ShujianDB (also used when demo DB table exists)
  const queryTab = hasDbTable ? realTabName : tabName;
  try {
    const stats = ShujianDB.stats(queryTab);
    const data = {
      table_name: queryTab,
      completeness: stats.completeness,
      total_missing: stats.missing.total_missing,
      missing_detail: stats.missing.fields,
      duplicate_rows: stats.duplicates.duplicate_rows,
      time_range: null
    };
    if (stats.time_range) {
      const schema = ShujianDB.getSchema(queryTab);
      const timeCol = schema.schema.find(c => c.isTime);
      data.time_range = {
        field: timeCol ? timeCol.name : '时间',
        min: stats.time_range.min,
        max: stats.time_range.max
      };
    }

    document.getElementById('q-completeness').textContent = data.completeness + '%';
    document.getElementById('q-completeness-bar').style.width = data.completeness + '%';
    document.getElementById('q-missing').textContent = data.total_missing + ' 个';
    document.getElementById('q-missing-desc').textContent = data.missing_detail.length > 0
      ? '分布在 ' + data.missing_detail.length + ' 个字段中'
      : '无缺失值';
    document.getElementById('q-duplicate').textContent = data.duplicate_rows + ' 行';
    if (data.time_range) {
      document.getElementById('q-time').textContent = data.time_range.field;
      document.getElementById('q-time-desc').textContent = data.time_range.min.substring(0, 10) + ' 至 ' + data.time_range.max.substring(0, 10);
    } else {
      document.getElementById('q-time').textContent = '-';
      document.getElementById('q-time-desc').textContent = '无时间字段';
    }
    renderRealMissingTable(data);
  } catch (e) {
    resetQualityCards();
    document.getElementById('missing-table-body').innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--color-text-tertiary);padding:16px;">加载统计失败</td></tr>';
  }
}

function resetQualityCards() {
  document.getElementById('q-completeness').textContent = '-';
  document.getElementById('q-completeness-bar').style.width = '0%';
  document.getElementById('q-missing').textContent = '-';
  document.getElementById('q-missing-desc').textContent = '-';
  document.getElementById('q-duplicate').textContent = '-';
  document.getElementById('q-time').textContent = '-';
  document.getElementById('q-time-desc').textContent = '-';
}

  html += '</tr>';
  tbody.innerHTML = html;

function renderRealMissingTable(data) {
  const tbody = document.getElementById('missing-table-body');
  if (!data.missing_detail || data.missing_detail.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--color-text-tertiary);padding:16px;">无缺失值，数据完整</td></tr>';
    return;
  }
  let html = '';
  data.missing_detail.forEach((item, idx) => {
    const barWidth = Math.min(item.rate, 100).toFixed(1);
    html += '<tr>';
    html += '<td style="color:var(--color-text-tertiary);">' + (idx + 1) + '</td>';
    html += '<td><strong>' + escapeHtml(item.field) + '</strong></td>';
    html += '<td>' + escapeHtml(data.table_name) + '</td>';
    html += '<td style="color:var(--color-warning);font-weight:var(--weight-semibold);">' + item.count + ' 条</td>';
    html += '<td>' + item.rate + '%</td>';
    html += '<td style="font-size:var(--text-xs);color:var(--color-text-secondary);">';
    html += '<div class="progress-bar" style="margin-bottom:4px;width:80px;display:inline-block;vertical-align:middle;">';
    html += '<div class="progress-fill warning" style="width:' + barWidth + '%;"></div>';
    html += '</div> ' + item.rate + '% 缺失</td>';
    html += '</tr>';
  });
  html += '<tr style="background:var(--color-bg-inset);">';
  html += '<td colspan="5" style="text-align:right;font-weight:var(--weight-semibold);color:var(--color-text);">合计</td>';
  html += '<td style="font-weight:var(--weight-semibold);color:var(--color-warning);">' + data.total_missing + ' 个缺失值</td>';
  html += '</tr>';
  tbody.innerHTML = html;
}

// ====== UPLOAD ======
function handleFileSelect(e) {
  const files = e.target.files;
  if (files && files.length > 0) uploadFile(files[0]);
  e.target.value = '';
}

function handleDrop(e) {
  e.preventDefault();
  e.stopPropagation();
  document.getElementById('upload-zone').classList.remove('drag-over');
  const files = e.dataTransfer.files;
  if (files && files.length > 0) uploadFile(files[0]);
}

async function uploadFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  if (!['csv','xlsx','xls'].includes(ext)) {
    showToast('不支持的文件格式：.' + ext + '，请上传 CSV 或 Excel 文件');
    return;
  }

  showToast('正在上传并解析：' + file.name + '...', 'success');
  try {
    let parsed;
    if (ext === 'csv') {
      parsed = await ShujianDB.parseCSV(file);
    } else {
      parsed = await ShujianDB.parseExcel(file);
    }
    const tableName = file.name.replace(/\.[^/.]+$/, '').replace(/[^a-zA-Z0-9_\u4e00-\u9fa5]/g, '_');
    ShujianDB.createTable(tableName, parsed.headers, parsed.rows);
    ShujianDB.metadata.tables = ShujianDB.metadata.tables.filter(t => t.table_name !== tableName);
    ShujianDB.metadata.tables.push({
      table_name: tableName,
      original_name: file.name,
      file_type: ext.toUpperCase(),
      file_size: file.size,
      row_count: parsed.count,
      col_count: parsed.headers.length,
      uploaded_at: new Date().toISOString()
    });
    ShujianDB.save();
    showToast('上传成功！表「' + tableName + '」已创建，共 ' + parsed.count + ' 行 ' + parsed.headers.length + ' 列', 'success');
    await loadTables();
  } catch (e) {
    showToast('上传失败：' + e.message, 'error');
  }
}

function handleDragOver(e) {
  e.preventDefault();
  e.stopPropagation();
  document.getElementById('upload-zone').classList.add('drag-over');
}

function handleDragLeave(e) {
  e.preventDefault();
  e.stopPropagation();
  document.getElementById('upload-zone').classList.remove('drag-over');
}

// ====== DELETE ======
async function handleDelete(tableName, originalName) {
  if (!confirm('确定要删除表「' + originalName + '」吗？此操作不可恢复。')) return;
  try {
    ShujianDB.dropTable(tableName);
    showToast('已删除「' + originalName + '」', 'success');
    await loadTables();
  } catch (e) {
    showToast('删除失败：' + e.message, 'error');
  }
}

// ====== QUALITY REPORT ======
function closeQualityReport() {
  const overlay = document.getElementById('qr-modal-overlay');
  if (overlay) overlay.style.display = 'none';
}

async function showQualityReport(tableName, originalName) {
  const overlay = document.getElementById('qr-modal-overlay');
  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <div class="qr-modal">
      <div class="qr-modal-header">
        <div class="qr-modal-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--brand-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="10"/></svg>
          数据质量诊断报告
        </div>
        <button class="qr-modal-close" onclick="closeQualityReport()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="qr-modal-body">
        <div class="qr-loading">正在分析数据质量，请稍候...</div>
      </div>
    </div>
  `;

  // 如果 tableName 以 demo_ 开头，映射到真实表名
  const dbTables = ShujianDB.getTables();
  const realTabName = tableName.replace(/^demo_/, '');
  const queryTab = dbTables.includes(realTabName) ? realTabName : tableName;

  try {
    const data = ShujianDB.qualityReport(queryTab);
    renderQualityReport(data, originalName);
  } catch (e) {
    overlay.querySelector('.qr-modal-body').innerHTML = '<div class="qr-empty">加载报告失败：' + escapeHtml(e.message) + '</div>';
  }
}

function renderQualityReport(data, originalName) {
  const body = document.querySelector('#qr-modal-overlay .qr-modal-body');
  const score = data.health_score;
  const scoreClass = score >= 80 ? 'good' : (score >= 50 ? 'warn' : 'bad');

  let html = '';

  // Score
  html += '<div class="qr-score">';
  html += '<div class="qr-score-ring ' + scoreClass + '">' + score + '</div>';
  html += '<div><div style="font-weight:var(--weight-semibold);">数据健康评分</div><div class="qr-score-label">' + escapeHtml(originalName) + ' · ' + data.overview.total_rows + ' 行 · ' + data.overview.total_cols + ' 列</div></div>';
  html += '</div>';

  // Issues
  html += '<div class="qr-section">';
  html += '<div class="qr-section-title">⚠️ 问题列表</div>';

  let hasIssue = false;

  if (data.missing.fields && data.missing.fields.length > 0) {
    hasIssue = true;
    data.missing.fields.forEach(m => {
      html += '<div class="qr-issue">';
      html += '<div class="qr-issue-title">缺失值：' + escapeHtml(m.field) + '</div>';
      html += '<div class="qr-issue-desc">该字段存在 ' + m.count + ' 个缺失值，缺失率 ' + m.rate + '%</div>';
      html += '<div class="qr-advice"><div class="qr-advice-title">💡 建议</div><div class="qr-advice-desc">' + (m.rate > 10 ? '缺失率较高，建议检查数据采集流程，或考虑删除该字段。' : '缺失率较低，可使用均值/中位数填充，或删除缺失行。') + '</div></div>';
      html += '</div>';
    });
  }

  if (data.duplicates.duplicate_rows > 0) {
    hasIssue = true;
    html += '<div class="qr-issue">';
    html += '<div class="qr-issue-title">重复行</div>';
    html += '<div class="qr-issue-desc">发现 ' + data.duplicates.duplicate_rows + ' 行完全重复的数据，重复率 ' + data.duplicates.duplicate_rate + '%</div>';
    html += '<div class="qr-advice"><div class="qr-advice-title">💡 建议</div><div class="qr-advice-desc">建议删除重复行，避免对统计结果产生偏差。</div></div>';
    html += '</div>';
  }

  if (data.pk_violations && data.pk_violations.length > 0) {
    hasIssue = true;
    data.pk_violations.forEach(pk => {
      html += '<div class="qr-issue error">';
      html += '<div class="qr-issue-title">主键重复：' + escapeHtml(pk.field) + '</div>';
      html += '<div class="qr-issue-desc">该字段存在 ' + pk.duplicate_count + ' 个重复值，可能不是唯一标识</div>';
      html += '<div class="qr-advice"><div class="qr-advice-title">💡 建议</div><div class="qr-advice-desc">检查数据源，确认该字段是否应为唯一标识，或更换主键字段。</div></div>';
      html += '</div>';
    });
  }

  if (data.type_issues && data.type_issues.length > 0) {
    hasIssue = true;
    data.type_issues.forEach(ti => {
      html += '<div class="qr-issue error">';
      html += '<div class="qr-issue-title">数据类型异常：' + escapeHtml(ti.field) + '</div>';
      html += '<div class="qr-issue-desc">' + escapeHtml(ti.issue) + ' · ' + escapeHtml(ti.detail) + '</div>';
      html += '<div class="qr-advice"><div class="qr-advice-title">💡 建议</div><div class="qr-advice-desc">清洗非法格式数据，统一为正确的数据类型。</div></div>';
      html += '</div>';
    });
  }

  if (data.business_issues && data.business_issues.length > 0) {
    hasIssue = true;
    data.business_issues.forEach(bi => {
      const advice = bi.issue.includes('负值')
        ? '金额出现负值可能是退款、冲销或录入错误，建议核实业务含义并标记异常数据。'
        : bi.issue.includes('极端异常')
          ? '极端值可能拉偏整体统计，建议单独分析或使用中位数替代均值。'
          : '核对业务规则，修正异常值或标记为待审核。';
      html += '<div class="qr-issue error">';
      html += '<div class="qr-issue-title">业务合理性：' + escapeHtml(bi.field) + '</div>';
      html += '<div class="qr-issue-desc">' + escapeHtml(bi.issue) + ' · ' + escapeHtml(bi.detail) + '</div>';
      html += '<div class="qr-advice"><div class="qr-advice-title">💡 建议</div><div class="qr-advice-desc">' + advice + '</div></div>';
      html += '</div>';
    });
  }

  if (!hasIssue) {
    html += '<div class="qr-issue success">';
    html += '<div class="qr-issue-title">✅ 未发现明显问题</div>';
    html += '<div class="qr-issue-desc">数据完整性良好，未检测到缺失值、重复值、异常值或类型问题。</div>';
    html += '</div>';
  }

  html += '</div>';

  // Outlier stats
  if (data.outliers.fields && data.outliers.fields.length > 0) {
    html += '<div class="qr-section">';
    html += '<div class="qr-section-title">📊 数值字段统计</div>';
    html += '<table class="missing-table"><thead><tr><th>字段</th><th>最小值</th><th>最大值</th><th>均值</th><th>负值</th><th>零值</th><th>极端值</th></tr></thead><tbody>';
    data.outliers.fields.forEach(f => {
      html += '<tr>';
      html += '<td><strong>' + escapeHtml(f.field) + '</strong></td>';
      html += '<td>' + f.min + '</td>';
      html += '<td>' + f.max + '</td>';
      html += '<td>' + f.mean + '</td>';
      html += '<td>' + (f.negative_count > 0 ? '<span style="color:var(--color-error);">' + f.negative_count + '</span>' : '0') + '</td>';
      html += '<td>' + f.zero_count + '</td>';
      html += '<td>' + (f.extreme_high_count + f.extreme_low_count > 0 ? '<span style="color:var(--color-warning);">' + (f.extreme_high_count + f.extreme_low_count) + '</span>' : '0') + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table>';
    html += '</div>';
  }

  body.innerHTML = html;
}

// ====== TOAST ======
function showToast(msg, type) {
  type = type || 'info';
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  let icon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>';
  if (type === 'success') icon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>';
  if (type === 'error') icon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>';
  el.innerHTML = icon + ' ' + escapeHtml(msg);
  document.body.appendChild(el);
  setTimeout(function() { el.remove(); }, 4000);
}

// ====== UTILS ======
function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, function(c) {
    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
  });
}

// ====== TABLE RELATIONS ======
function renderRelations() {
  const container = document.getElementById('relation-list');
  const relations = ShujianDB.getRelations();
  if (relations.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:20px;color:var(--color-text-tertiary);font-size:13px;">暂无关联配置，点击"新增关联"开始配置。</div>';
    return;
  }
  let html = '<table class="relation-table"><thead><tr><th>源表</th><th>关联字段</th><th></th><th>目标表</th><th>关联字段</th><th>说明</th><th>操作</th></tr></thead><tbody>';
  relations.forEach(r => {
    html += `<tr>`;
    html += `<td class="relation-link">${escapeHtml(r.from)}</td>`;
    html += `<td><code style="background:var(--color-bg-inset);padding:2px 6px;border-radius:var(--radius-sm);font-size:11px;">${escapeHtml(r.fromField)}</code></td>`;
    html += `<td class="relation-arrow">⟷</td>`;
    html += `<td class="relation-link">${escapeHtml(r.to)}</td>`;
    html += `<td><code style="background:var(--color-bg-inset);padding:2px 6px;border-radius:var(--radius-sm);font-size:11px;">${escapeHtml(r.toField)}</code></td>`;
    html += `<td>${escapeHtml(r.label || '-')}</td>`;
    html += `<td><button class="btn btn-secondary btn-sm" onclick="removeRelation('${escapeHtml(r.from)}','${escapeHtml(r.fromField)}','${escapeHtml(r.to)}','${escapeHtml(r.toField)}')">删除</button></td>`;
    html += `</tr>`;
  });
  html += '</tbody></table>';
  container.innerHTML = html;
}

function showAddRelationModal() {
  const tables = ShujianDB.getTables();
  if (tables.length < 2) {
    showToast('至少需要两个数据表才能配置关联', 'warning');
    return;
  }
  const tableOptions = tables.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'relation-modal';
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  overlay.innerHTML = `
    <div class="modal-box">
      <div class="modal-title">新增表关联</div>
      <div class="modal-field"><label>源表</label><select id="rel-from">${tableOptions}</select></div>
      <div class="modal-field"><label>源表关联字段</label><select id="rel-from-field"><option value="">请先选择源表</option></select></div>
      <div class="modal-field"><label>目标表</label><select id="rel-to">${tableOptions}</select></div>
      <div class="modal-field"><label>目标表关联字段</label><select id="rel-to-field"><option value="">请先选择目标表</option></select></div>
      <div class="modal-field"><label>说明（可选）</label><input type="text" id="rel-label" placeholder="例如：订单-商品关联"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary btn-sm" onclick="document.getElementById('relation-modal').remove()">取消</button>
        <button class="btn btn-primary btn-sm" onclick="addRelation()">确定</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  // 联动：选择表后加载字段
  document.getElementById('rel-from').addEventListener('change', function() { loadFieldsForSelect('rel-from-field', this.value); });
  document.getElementById('rel-to').addEventListener('change', function() { loadFieldsForSelect('rel-to-field', this.value); });
  // 初始加载第一个表的字段
  if (tables.length > 0) loadFieldsForSelect('rel-from-field', tables[0]);
  if (tables.length > 1) loadFieldsForSelect('rel-to-field', tables[1]);
}

function loadFieldsForSelect(selectId, tableName) {
  const sel = document.getElementById(selectId);
  const schema = ShujianDB.getSchema(tableName);
  if (!schema) { sel.innerHTML = '<option value="">无字段</option>'; return; }
  sel.innerHTML = schema.schema.map(f => `<option value="${escapeHtml(f.name)}">${escapeHtml(f.name)} (${f.type})</option>`).join('');
}

function addRelation() {
  const from = document.getElementById('rel-from').value;
  const fromField = document.getElementById('rel-from-field').value;
  const to = document.getElementById('rel-to').value;
  const toField = document.getElementById('rel-to-field').value;
  const label = document.getElementById('rel-label').value;
  if (!from || !fromField || !to || !toField) {
    showToast('请完整选择源表、关联字段、目标表和目标字段', 'warning');
    return;
  }
  if (from === to && fromField === toField) {
    showToast('不能关联同一个表的同一个字段', 'warning');
    return;
  }
  const ok = ShujianDB.addRelation(from, fromField, to, toField, label);
  if (!ok) {
    showToast('该关联关系已存在', 'warning');
    return;
  }
  document.getElementById('relation-modal').remove();
  renderRelations();
  showToast('关联关系已添加');
}

function removeRelation(from, fromField, to, toField) {
  ShujianDB.removeRelation(from, fromField, to, toField);
  renderRelations();
  showToast('关联关系已删除');
}

// ====== INIT ======
ShujianDB.init().then(() => loadTables());
</script>
