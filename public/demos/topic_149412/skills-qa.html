<style>
/* ===== 页面布局 ===== */
.qa-layout {
  display: flex; height: 100%;
}

/* ===== 左栏：技能列表 ===== */
.qa-left {
  width: 280px; min-width: 280px;
  background: var(--color-bg-elevated); border-right: 1px solid var(--color-border);
  display: flex; flex-direction: column; overflow: hidden;
}
.qa-left-header {
  padding: var(--space-4); flex-shrink: 0;
}
.qa-left-title {
  font-size: var(--text-base); font-weight: var(--weight-semibold); color: var(--color-text);
}
.qa-left-list {
  flex: 1; overflow-y: auto; padding: 0 var(--space-4) var(--space-4);
}

/* ===== 技能卡片 ===== */
.skill-card {
  background: var(--color-bg-inset); border: 1px solid var(--color-border);
  border-radius: var(--radius-md); padding: var(--space-4); margin-bottom: var(--space-3);
  cursor: pointer; transition: all 0.15s; display: flex; gap: var(--space-3);
  align-items: flex-start;
}
.skill-card:hover { border-color: var(--brand-primary-muted); }
.skill-card.active {
  border-color: var(--brand-primary); background: var(--brand-primary-light);
  box-shadow: 0 0 0 1px var(--brand-primary);
}
.skill-card.locked {
  opacity: 0.55; cursor: not-allowed;
}
.skill-card.locked:hover { border-color: var(--color-border); }
.skill-card .skill-icon-wrap {
  width: 40px; height: 40px; border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.skill-card.active .skill-icon-wrap { background: var(--brand-primary); color: #fff; }
.skill-card.locked .skill-icon-wrap { background: var(--color-bg-inset); color: var(--color-text-tertiary); }
.skill-card .skill-info { flex: 1; min-width: 0; }
.skill-card .skill-name {
  font-size: var(--text-sm); font-weight: var(--weight-semibold); margin-bottom: 2px;
  display: flex; align-items: center; gap: var(--space-2);
}
.skill-card.active .skill-name { color: var(--brand-primary); }
.skill-card.locked .skill-name { color: var(--color-text-secondary); }
.skill-card .skill-desc {
  font-size: var(--text-xs); color: var(--color-text-tertiary); line-height: 1.4;
}
.skill-card .skill-status {
  flex-shrink: 0; margin-top: 2px;
}
.skill-card .skill-status .check-icon {
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--color-success); color: #fff;
  display: flex; align-items: center; justify-content: center;
}
.skill-card .skill-status .lock-icon {
  color: var(--color-text-tertiary);
}

/* ===== 右栏：问答区 ===== */
.qa-right {
  flex: 1; display: flex; flex-direction: column; overflow: hidden;
  background: var(--color-bg);
}

/* 技能标签栏 */
.qa-tab-bar {
  display: flex; align-items: center; gap: 0;
  padding: var(--space-3) var(--space-5);
  border-bottom: 1px solid var(--color-border);
  background: var(--color-bg-elevated); flex-shrink: 0;
}
.qa-tab {
  padding: 6px 16px; border-radius: var(--radius-full);
  font-size: var(--text-sm); font-weight: var(--weight-medium);
  cursor: pointer; border: none; background: none; font-family: inherit;
  color: var(--color-text-secondary); transition: all 0.15s;
  display: flex; align-items: center; gap: 6px;
}
.qa-tab:hover { background: var(--color-bg-inset); }
.qa-tab.active { background: var(--brand-primary); color: #fff; }
.qa-tab.locked { color: var(--color-text-tertiary); cursor: not-allowed; }
.qa-tab.locked:hover { background: transparent; }

/* 聊天区域 */
.qa-chat {
  flex: 1; overflow-y: auto; padding: var(--space-5);
  display: flex; flex-direction: column;
}

/* 欢迎界面 */
.qa-welcome {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: var(--space-8); text-align: center;
}
.qa-welcome .welcome-avatar {
  width: 72px; height: 72px; border-radius: 50%;
  background: var(--brand-primary-light); display: flex; align-items: center;
  justify-content: center; margin-bottom: var(--space-5); position: relative;
}
.qa-welcome .welcome-avatar .star-badge {
  position: absolute; bottom: -2px; right: -2px;
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--color-warning); color: #fff;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 6px rgba(245,158,11,0.4);
}
.qa-welcome .welcome-title {
  font-size: var(--text-xl); font-weight: var(--weight-bold);
  color: var(--color-text); margin-bottom: var(--space-2); letter-spacing: -0.02em;
}
.qa-welcome .welcome-subtitle {
  font-size: var(--text-sm); color: var(--color-text-tertiary); margin-bottom: var(--space-6);
}
.qa-welcome .welcome-chips {
  display: flex; flex-wrap: wrap; gap: var(--space-2); justify-content: center; max-width: 480px;
}
.chip {
  display: inline-flex; align-items: center; padding: 8px 16px;
  border-radius: var(--radius-full); font-size: var(--text-sm); font-weight: var(--weight-medium);
  border: 1px solid var(--color-border); background: var(--color-bg-elevated);
  color: var(--color-text-secondary); cursor: pointer; transition: all 0.15s;
  font-family: inherit; white-space: nowrap;
}
.chip:hover { border-color: var(--brand-primary-muted); color: var(--brand-primary); background: var(--brand-primary-light); }

/* 消息列表 */
.qa-messages {
  flex: 1; display: flex; flex-direction: column; gap: var(--space-4);
  padding-bottom: var(--space-2);
}

/* 消息气泡 */
.message {
  display: flex; flex-direction: column; max-width: 80%; animation: msgIn 0.3s ease;
}
.message.user { align-self: flex-end; }
.message.ai { align-self: flex-start; }
@keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.message .msg-bubble {
  padding: var(--space-3) var(--space-4); border-radius: var(--radius-lg);
  font-size: var(--text-sm); line-height: 1.6;
}
.message.user .msg-bubble {
  background: var(--brand-primary); color: #fff;
  border-bottom-right-radius: var(--radius-sm);
}
.message.ai .msg-bubble {
  background: var(--color-bg-elevated); color: var(--color-text);
  border: 1px solid var(--color-border); border-bottom-left-radius: var(--radius-sm);
  box-shadow: var(--shadow-sm);
}
.message .msg-time {
  font-size: 11px; color: var(--color-text-tertiary); margin-top: 4px;
}
.message.user .msg-time { text-align: right; }

/* ===== Loading 动画 ===== */
.loading-msg {
  display: flex; align-items: center; gap: var(--space-2);
  padding: var(--space-3) var(--space-4); align-self: flex-start;
}
.loading-dots { display: flex; gap: 4px; }
.loading-dots span {
  width: 8px; height: 8px; border-radius: 50%; background: var(--brand-primary-muted);
  animation: bounce 1.4s infinite ease-in-out both;
}
.loading-dots span:nth-child(1) { animation-delay: -0.32s; }
.loading-dots span:nth-child(2) { animation-delay: -0.16s; }
.loading-dots span:nth-child(3) { animation-delay: 0s; }
@keyframes bounce {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
  40% { transform: scale(1); opacity: 1; }
}
.loading-text { font-size: var(--text-sm); color: var(--color-text-tertiary); }

/* ===== AI 回复内容样式 ===== */
.ai-content { word-break: break-word; }
.ai-content .big-number {
  font-size: 36px; font-weight: var(--weight-bold); color: var(--brand-primary);
  letter-spacing: -0.03em; line-height: 1.2; margin-bottom: var(--space-1);
}
.ai-content .big-number-label {
  font-size: var(--text-sm); color: var(--color-text-secondary); margin-bottom: var(--space-2);
}
.ai-content .insight-text {
  font-size: var(--text-sm); color: var(--color-text-secondary); margin-top: var(--space-3);
  padding: var(--space-3); background: var(--brand-primary-light); border-radius: var(--radius-md);
  border-left: 3px solid var(--brand-primary);
}
.ai-content .caliber-note {
  font-size: var(--text-xs); color: var(--color-text-tertiary); margin-top: var(--space-2);
  font-family: 'SF Mono', 'Cascadia Code', monospace;
}
.ai-content .section-title {
  font-size: var(--text-sm); font-weight: var(--weight-semibold); margin-bottom: var(--space-2); margin-top: var(--space-3);
}

/* 表格 */
.ai-content .mini-table {
  width: 100%; border-collapse: collapse; font-size: var(--text-sm); margin-bottom: var(--space-3);
}
.ai-content .mini-table th {
  text-align: left; padding: 8px 10px; font-weight: var(--weight-semibold);
  color: var(--color-text-secondary); border-bottom: 1px solid var(--color-border);
  background: var(--color-bg-inset);
}
.ai-content .mini-table td {
  padding: 8px 10px; border-bottom: 1px solid var(--color-border-light);
}
.ai-content .mini-table tr:last-child td { border-bottom: none; }
.ai-content .mini-table .rank { color: var(--brand-primary); font-weight: var(--weight-semibold); }

/* 图表容器 */
.chart-container { width: 100%; height: 300px; margin: var(--space-3) 0; }

/* 对比卡片 */
.q-compare-card {
  display: flex; gap: var(--space-4); margin-top: var(--space-3); flex-wrap: wrap;
}
.q-compare-card .q-card {
  flex: 1; min-width: 120px; text-align: center;
  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-bg-inset);
}
.q-compare-card .q-card .q-label {
  font-size: var(--text-xs); color: var(--color-text-tertiary); margin-bottom: var(--space-1);
}
.q-compare-card .q-card .q-value {
  font-size: var(--text-xl); font-weight: var(--weight-bold); color: var(--brand-primary);
}
.q-compare-card .q-card.q2 .q-value { color: var(--color-success); }

/* 口径变更对比框 */
.caliber-compare {
  margin-top: var(--space-4); padding: var(--space-4);
  background: var(--color-bg-inset); border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
}
.caliber-compare .cc-title {
  font-size: var(--text-sm); font-weight: var(--weight-semibold); margin-bottom: var(--space-3);
  display: flex; align-items: center; gap: var(--space-2);
}
.caliber-compare .cc-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 0; font-size: var(--text-sm);
}
.caliber-compare .cc-row .cc-label { color: var(--color-text-secondary); }
.caliber-compare .cc-row .cc-value-old {
  color: var(--color-text-tertiary); text-decoration: line-through;
}
.caliber-compare .cc-row .cc-value-new {
  color: var(--brand-primary); font-weight: var(--weight-bold);
}
.caliber-compare .cc-diff {
  margin-top: var(--space-2); padding-top: var(--space-2);
  border-top: 1px dashed var(--color-border);
  font-size: var(--text-sm); color: var(--color-text-secondary);
  display: flex; align-items: center; gap: var(--space-2);
}
.caliber-compare .cc-diff .diff-positive { color: var(--color-success); font-weight: var(--weight-semibold); }
.caliber-compare .cc-diff .diff-negative { color: var(--color-error); font-weight: var(--weight-semibold); }

/* ===== 输入区域 ===== */
.qa-input-area {
  padding: var(--space-3) var(--space-5); border-top: 1px solid var(--color-border);
  background: var(--color-bg-elevated); flex-shrink: 0;
}
.qa-input-row {
  display: flex; align-items: center; gap: var(--space-2);
}
.qa-input-row .qa-input {
  flex: 1; padding: 10px 14px; border: 1px solid var(--color-border);
  border-radius: var(--radius-full); font-family: inherit; font-size: var(--text-sm);
  background: var(--color-bg); color: var(--color-text); outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.qa-input-row .qa-input:focus {
  border-color: var(--brand-primary); box-shadow: 0 0 0 3px var(--brand-primary-light);
}
.qa-input-row .qa-input::placeholder { color: var(--color-text-tertiary); }
.qa-send-btn {
  width: 40px; height: 40px; border-radius: 50%; border: none;
  background: var(--brand-primary); color: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s; flex-shrink: 0;
}
.qa-send-btn:hover { background: var(--brand-primary-hover); }
.qa-send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* 下拉菜单 */
.qa-dropdown-wrap { position: relative; flex-shrink: 0; }
.qa-dropdown-btn {
  display: flex; align-items: center; gap: 4px;
  padding: 8px 12px; border-radius: var(--radius-full);
  border: 1px solid var(--color-border); background: var(--color-bg);
  font-family: inherit; font-size: var(--text-xs); font-weight: var(--weight-medium);
  color: var(--color-text-secondary); cursor: pointer; transition: all 0.15s;
}
.qa-dropdown-btn:hover { border-color: var(--brand-primary-muted); color: var(--brand-primary); }
.qa-dropdown-menu {
  position: absolute; bottom: calc(100% + 8px); right: 0;
  background: var(--color-bg-elevated); border: 1px solid var(--color-border);
  border-radius: var(--radius-md); box-shadow: var(--shadow-lg);
  min-width: 200px; z-index: 50; display: none; padding: var(--space-1);
}
.qa-dropdown-menu.show { display: block; animation: fadeIn 0.15s ease; }
.qa-dropdown-menu .dd-item {
  display: block; width: 100%; text-align: left; padding: 8px 12px;
  border: none; background: none; font-family: inherit; font-size: var(--text-sm);
  color: var(--color-text); cursor: pointer; border-radius: var(--radius-sm);
  transition: background 0.1s;
}
.qa-dropdown-menu .dd-item:hover { background: var(--brand-primary-light); color: var(--brand-primary); }

/* 空状态 */
.qa-empty {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; color: var(--color-text-tertiary);
}

/* 响应式 */
@media (max-width: 900px) {
  .qa-left { display: none; }
}
</style>
</head>

// 意图识别
function detectIntent(text) {
  const t = text.toLowerCase();

  // 规则1：如果问题包含"总"、"一共"、"整体"等词汇，且没有明确对比/拆分需求，强制为 metric_query 且无图表
  if (/总共|总计|一共|整体|全部|合计|累计|总共有|一共多少/.test(text) && !/对比|比较|vs|拆分|按.*分|各.*的|每个|趋势|走势/.test(text)) {
    return { type: 'metric_query', chartType: 'none' };
  }

  if (/top\s*\d+|前\s*\d+|排名|排行|最多|最少|最高|最低/.test(t)) {
    return { type: 'ranking', limit: extractLimit(t), dimension: extractDimension(text) };
  }

  // 季度对比优先于趋势：当问题明确包含季度对比语义时
  if (/对比|比较|vs|versus|差异|同比|环比/.test(t) && /q1|q2|q3|q4|季度/.test(t)) {
    return { type: 'comparison', quarters: extractQuarters(text) };
  }

  // 规则2：趋势分析只在用户明确要求时才触发，不因为包含年份就自动推断
  if (/趋势|走势|变化趋势|增长趋势|下降趋势|月度趋势|每日趋势|年度趋势/.test(t)) {
    return { type: 'trend', granularity: extractGranularity(t) };
  }

  if (/对比|比较|vs|versus|差异|同比|环比|q1|q2|q3|q4|季度/.test(t)) {
    return { type: 'comparison', quarters: extractQuarters(text) };
  }

  // 规则2：只有明确维度拆分需求才允许分组
  if (/拆分|分组|按.*看|按.*分|各.*的|每个.*的|分别/.test(t) && !/多少|什么|怎么/.test(t)) {
    return { type: 'breakdown', dimension: extractDimension(t) };
  }

  if (/占比|比例|构成|分布|份额|百分比/.test(t)) {
    return { type: 'composition' };
  }

  if (/多少|是什么|的$/.test(t) && !/怎么|为什么|如何/.test(t)) {
    return { type: 'metric_query' };
  }

  return { type: 'general' };
}

function extractLimit(text) {
  const m = text.match(/(?:top|前)\s*(\d+)/i);
  return m ? parseInt(m[1]) : 5;
}

function extractGranularity(text) {
  const t = text.toLowerCase();
  if (/日|天|daily/.test(t)) return 'day';
  if (/月|month/.test(t)) return 'month';
  if (/年|year|年度/.test(t)) return 'year';
  if (/周|week/.test(t)) return 'week';
  return 'month';
}

function extractQuarters(text) {
  const t = text.toLowerCase();
  const quarters = [];
  if (/q1|第一季|第一季度|一季度/.test(t)) quarters.push('Q1');
  if (/q2|第二季|第二季度|二季度/.test(t)) quarters.push('Q2');
  if (/q3|第三季|第三季度|三季度/.test(t)) quarters.push('Q3');
  if (/q4|第四季|第四季度|四季度/.test(t)) quarters.push('Q4');
  // 如果用户只提到"季度"但没有指定具体季度，默认返回 Q1 和 Q4
  if (quarters.length === 0 && /季度/.test(t)) return ['Q1', 'Q4'];
  return quarters;
}

function extractDimension(text) {
  const t = text.toLowerCase();
  if (/品类|类别|分类|种类/.test(t)) return '商品类别';
  if (/省份|地区|区域|省市|城市/.test(t)) return '用户省份';
  if (/商品|产品/.test(t)) return '商品名称';
  if (/用户|客户/.test(t)) return '用户ID';
  if (/时间|月份|日期/.test(t)) return '时间';
  return 'auto';
}

// 指标匹配
function resolveMetric(text, metrics) {
  if (!metrics || !metrics.length) return null;
  const t = text.toLowerCase();

  for (const m of metrics) {
    if (t.includes(m.name.toLowerCase())) return m;
  }

  const keywordMap = {
    '销售额': ['销售额', '销售', '收入', '营收', '实付', '金额', 'sales', 'revenue'],
    '订单数': ['订单数', '订单量', '单量', 'orders'],
    '客单价': ['客单价', '平均订单', 'aov'],
    '退款率': ['退款率', '退货率', '退款', 'refund'],
    '用户数': ['用户数', '用户量', '客户数', 'uv', 'users'],
    '购买数量': ['购买数量', '销量', 'quantity']
  };

  for (const m of metrics) {
    const keywords = keywordMap[m.name] || [m.name];
    for (const kw of keywords) {
      if (t.includes(kw.toLowerCase())) return m;
    }
  }
  return null;
}

function inferTableFromMetric(metric) {
  if (metric && metric.config && metric.config.table) {
    return metric.config.table;
  }
  const name = metric ? metric.name : '';
  if (/用户/.test(name)) return 'users';
  if (/商品|产品/.test(name)) return 'products';
  return 'transactions';
}

function findTimeField(fields) {
  if (!fields) return null;
  const f = fields.find(f => f.isTime);
  return f ? f.name : null;
}

function guessGroupField(fields, preferName) {
  if (!fields || !fields.length) return null;
  if (preferName) {
    const exact = fields.find(f => f.name === preferName);
    if (exact) return exact.name;
    // 模糊匹配
    const fuzzy = fields.find(f => f.type === 'string' && !f.isTime && (preferName.includes(f.name) || f.name.includes(preferName)));
    if (fuzzy) return fuzzy.name;
  }
  const candidates = fields.filter(f => f.type === 'string' && !f.isTime);
  return candidates.length > 0 ? candidates[0].name : fields[0].name;
}

// 时间解析
function extractTimeFilter(text) {
  const t = text.toLowerCase();
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth() + 1;

  // 上个月
  if (/上个?月|上.*个.*月|last month/.test(t)) {
    const lm = month === 1 ? 12 : month - 1;
    const ly = month === 1 ? year - 1 : year;
    return { label: '上个月', sql: `strftime('%Y-%m', "{timeField}") = '${ly}-${String(lm).padStart(2,'0')}'` };
  }

  // 最近7天
  if (/最近7天|近7天|最近一周|last 7 days/.test(t)) {
    const d7 = new Date(now); d7.setDate(d7.getDate() - 7);
    return { label: '最近7天', sql: `"{timeField}" >= '${d7.toISOString().slice(0,10)}'` };
  }

  // 最近30天
  if (/最近30天|近30天|最近一个月/.test(t)) {
    const d30 = new Date(now); d30.setDate(d30.getDate() - 30);
    return { label: '最近30天', sql: `"{timeField}" >= '${d30.toISOString().slice(0,10)}'` };
  }

  // 2024年
  const yearMatch = t.match(/(20\d{2})年?/);
  if (yearMatch) {
    const y = yearMatch[1];
    // 2024年6月
    const monthMatch = t.match(/(\d{1,2})月/);
    if (monthMatch) {
      const m = String(monthMatch[1]).padStart(2, '0');
      return { label: `${y}年${parseInt(m)}月`, sql: `strftime('%Y-%m', "{timeField}") = '${y}-${m}'` };
    }
    return { label: `${y}年`, sql: `strftime('%Y', "{timeField}") = '${y}'` };
  }

  // Q1 / Q2 / Q3 / Q4
  const qMatch = t.match(/q([1-4])/i);
  if (qMatch) {
    const q = parseInt(qMatch[1]);
    const startM = String((q - 1) * 3 + 1).padStart(2, '0');
    const endM = String(q * 3).padStart(2, '0');
    return { label: `Q${q}`, sql: `strftime('%m', "{timeField}") BETWEEN '${startM}' AND '${endM}'` };
  }

  // 今年
  if (/今年|本年|this year/.test(t)) {
    return { label: '今年', sql: `strftime('%Y', "{timeField}") = '${year}'` };
  }

  return null;
}

function buildWhereClause(timeFilter, timeField) {
  if (!timeFilter || !timeField || !timeFilter.sql) return '';
  return ' WHERE ' + timeFilter.sql.replace(/{timeField}/g, timeField);
}

// 根据 schema 自动推断聚合字段
function resolveAggField(fields, preferredField) {
  if (!fields || !fields.length) return { field: preferredField || 'value', isInferred: true };
  const fieldNames = fields.map(f => f.name);

  // 如果 preferredField 存在且在 schema 中，直接使用（精确匹配）
  if (preferredField && fieldNames.includes(preferredField)) {
    return { field: preferredField, isInferred: false };
  }

  // 按优先级推断金额/数值字段
  const priorityKeywords = [
    ['消费金额', '实付金额', '订单金额', '金额', '销售额', '营收', '收入'],
    ['购买数量', '数量', '销量', '订单数', '单量'],
    ['客单价', '单价', '价格'],
    ['实付订单', '实付'],
    ['退款金额', '退款'],
    ['成本', '利润']
  ];
  for (const keywords of priorityKeywords) {
    for (const kw of keywords) {
      const match = fields.find(f => f.name.includes(kw) && f.type === 'number');
      if (match) return { field: match.name, isInferred: true };
    }
  }

  //  fallback：找第一个 number 字段
  const firstNum = fields.find(f => f.type === 'number');
  if (firstNum) return { field: firstNum.name, isInferred: true };

  // 最后 fallback
  return { field: preferredField || fields[0].name, isInferred: true };
}

// SQL 生成
function generateSQL(intent, metric, tableName, schema, timeFilter) {
  const fields = schema ? schema.schema : [];
  const timeField = findTimeField(fields);

  let aggFunc = 'SUM';
  let preferredField = null;

  if (metric && metric.config) {
    preferredField = metric.config.field;
    const calcMap = { sum: 'SUM', count: 'COUNT', count_distinct: 'COUNT(DISTINCT', avg: 'AVG' };
    aggFunc = calcMap[metric.config.calc] || aggFunc;
    if (metric.config.calc === 'count_distinct') aggFunc = 'COUNT(DISTINCT';
  }

  const aggFieldInfo = resolveAggField(fields, preferredField);
  const aggField = aggFieldInfo.field;

  // 规则3：如果指标有复合公式（含运算符），直接使用公式而非拆解
  const isCompositeFormula = metric && metric.formula && /[\/\+\-\*]/.test(metric.formula.split('\n')[0]) && !metric.formula.includes('CASE WHEN');
  
  // 构建聚合表达式
  let aggExpr = '';
  if (isCompositeFormula) {
    // 复合公式：直接使用 formula（去掉 WHERE 注释部分）
    aggExpr = metric.formula.split('\n')[0].split('--')[0].trim();
    // 给字段名加引号：逐词处理，保护 SQL 关键词和纯英文，只给含中文的标识符加引号
    const sqlKw = new Set(['SUM','COUNT','DISTINCT','AVG','MIN','MAX','ROUND','NULLIF','COALESCE','CASE','WHEN','THEN','ELSE','END','AND','OR','NOT','NULL','AS','LIKE','IN','BETWEEN','IS','CAST','TRUE','FALSE']);
    aggExpr = aggExpr.replace(/[^\s()*+,\-\/]+/g, (match) => {
      if (sqlKw.has(match.toUpperCase())) return match;
      if (/^\d+\.?\d*$/.test(match)) return match;
      if (/^[a-zA-Z_]\w*$/.test(match)) return match; // 纯英文标识符不加引号
      return '"' + match + '"';
    });
  }

  const safeAgg = (func, field) => {
    if (func === 'COUNT(DISTINCT') return `COUNT(DISTINCT "${field}")`;
    return `${func}("${field}")`;
  };

  const where = buildWhereClause(timeFilter, timeField);

  let sql = '';
  switch (intent.type) {
    case 'metric_query': {
      const selectExpr = isCompositeFormula ? aggExpr : safeAgg(aggFunc, aggField);
      sql = `SELECT ${selectExpr} as value FROM "${tableName}"`;
      if (where) sql += where;
      else if (timeField) sql += `\n-- WHERE "${timeField}" BETWEEN '...' AND '...'`;
      break;
    }

    case 'breakdown':
    case 'composition': {
      let groupField = guessGroupField(fields, intent.dimension);
      // 如果主表找不到维度字段，搜索关联表
      if (groupField && intent.dimension && groupField !== intent.dimension && !groupField.includes('"')) {
        const rels = ShujianDB.getRelations();
        for (const r of rels) {
          const joinTable = (r.from === tableName) ? r.to : (r.to === tableName) ? r.from : null;
          if (joinTable) {
            const joinSchema = ShujianDB.getSchema(joinTable);
            if (joinSchema) {
              const match = joinSchema.schema.find(f => f.name === intent.dimension);
              if (match) { groupField = `"${joinTable}"."${match.name}"`; break; }
            }
          }
        }
      }
      // 智能维度替换：如果维度字段是 ID 且有关联表，替换为名称字段
      if (groupField && !groupField.includes('"')) {
        const joinInfo = ShujianDB.findJoinTable(groupField, tableName);
        if (joinInfo) {
          const joinSchema = ShujianDB.getSchema(joinInfo.joinTable);
          if (joinSchema) {
            const nameCol = joinSchema.schema.find(c => c.name.includes('名称') || c.name.includes('名'))
              || joinSchema.schema.find(c => c.type === 'string' && !c.name.includes('ID') && !c.isTime);
            if (nameCol) {
              groupField = `"${joinInfo.joinTable}"."${nameCol.name}"`;
            }
          }
        }
      }
      const selectExpr = isCompositeFormula ? aggExpr : safeAgg(aggFunc, aggField);
      sql = `SELECT ${groupField} as dimension, ${selectExpr} as value FROM "${tableName}"`;
      if (where) sql += where;
      sql += ` GROUP BY ${groupField} ORDER BY value DESC`;
      break;
    }

    case 'ranking': {
      let groupField = guessGroupField(fields, intent.dimension);
      // 如果主表找不到维度字段，搜索关联表
      if (groupField && intent.dimension && groupField !== intent.dimension && !groupField.includes('"')) {
        const rels = ShujianDB.getRelations();
        for (const r of rels) {
          const joinTable = (r.from === tableName) ? r.to : (r.to === tableName) ? r.from : null;
          if (joinTable) {
            const joinSchema = ShujianDB.getSchema(joinTable);
            if (joinSchema) {
              const match = joinSchema.schema.find(f => f.name === intent.dimension);
              if (match) { groupField = `"${joinTable}"."${match.name}"`; break; }
            }
          }
        }
      }
      // 智能维度替换：如果维度字段是 ID 且有关联表，替换为名称字段
      if (groupField && !groupField.includes('"')) {
        const joinInfo = ShujianDB.findJoinTable(groupField, tableName);
        if (joinInfo) {
          const joinSchema = ShujianDB.getSchema(joinInfo.joinTable);
          if (joinSchema) {
            const nameCol = joinSchema.schema.find(c => c.name.includes('名称') || c.name.includes('名'))
              || joinSchema.schema.find(c => c.type === 'string' && !c.name.includes('ID') && !c.isTime);
            if (nameCol) {
              groupField = `"${joinInfo.joinTable}"."${nameCol.name}"`;
            }
          }
        }
      }
      const selectExpr = isCompositeFormula ? aggExpr : safeAgg(aggFunc, aggField);
      sql = `SELECT ${groupField} as dimension, ${selectExpr} as value FROM "${tableName}"`;
      if (where) sql += where;
      sql += ` GROUP BY ${groupField} ORDER BY value DESC LIMIT ${intent.limit}`;
      break;
    }

    case 'trend': {
      const tf = timeField || '购买时间';
      const selectExpr = isCompositeFormula ? aggExpr : safeAgg(aggFunc, aggField);
      sql = `SELECT strftime('%Y-%m', "${tf}") as period, ${selectExpr} as value FROM "${tableName}"`;
      if (where) sql += where;
      sql += ` GROUP BY period ORDER BY period`;
      break;
    }

    case 'comparison': {
      const tf = timeField || '购买时间';
      const selectExpr = isCompositeFormula ? aggExpr : safeAgg(aggFunc, aggField);
      // 完整的季度映射 CASE
      const quarterCase = `CASE WHEN cast(strftime('%m', "${tf}") as int) BETWEEN 1 AND 3 THEN 'Q1' WHEN cast(strftime('%m', "${tf}") as int) BETWEEN 4 AND 6 THEN 'Q2' WHEN cast(strftime('%m', "${tf}") as int) BETWEEN 7 AND 9 THEN 'Q3' WHEN cast(strftime('%m', "${tf}") as int) BETWEEN 10 AND 12 THEN 'Q4' END`;
      sql = `SELECT ${quarterCase} as quarter, ${selectExpr} as value FROM "${tableName}"`;
      if (where) sql += where;
      sql += ` GROUP BY quarter HAVING quarter IS NOT NULL ORDER BY quarter`;
      break;
    }

    default: {
      const selectExpr = isCompositeFormula ? aggExpr : safeAgg(aggFunc, aggField);
      sql = `SELECT ${selectExpr} as value FROM "${tableName}"`;
      if (where) sql += where;
      else if (timeField) sql += `\n-- WHERE "${timeField}" BETWEEN '...' AND '...'`;
    }
  }

  return { sql, aggField, isInferred: aggFieldInfo.isInferred };
}

// 结果渲染

// 用大白话描述分析逻辑（替代 SQL 展示）
function buildAnalysisDescription(intent, metric, sql, timeFilter, dimensionField) {
  if (!metric && !sql) return '';
  const parts = [];

  // 从 sql 中提取计算方式和聚合字段
  let calcDesc = '';
  if (sql) {
    const sqlUpper = sql.toUpperCase();
    if (sqlUpper.includes('COUNT(DISTINCT')) {
      const m = sql.match(/COUNT\s*\(\s*DISTINCT\s+["']?([^"')\s]+)/i);
      calcDesc = m ? `对「${m[1]}」进行去重计数` : '去重计数';
    } else if (sqlUpper.includes('COUNT(*)')) {
      calcDesc = '统计总记录数';
    } else if (sqlUpper.includes('COUNT(')) {
      calcDesc = '计数统计';
    } else if (sqlUpper.includes('SUM(')) {
      const m = sql.match(/SUM\s*\(\s*["']?([^"')\s]+)/i);
      calcDesc = m ? `对「${m[1]}」进行求和` : '求和汇总';
    } else if (sqlUpper.includes('AVG(')) {
      const m = sql.match(/AVG\s*\(\s*["']?([^"')\s]+)/i);
      calcDesc = m ? `计算「${m[1]}」的平均值` : '求平均值';
    }
  }

  // 指标名
  if (metric) {
    parts.push(`查询指标「${metric.name}」`);
  }

  // 计算方式
  if (calcDesc) {
    parts.push(calcDesc);
  }

  // 时间筛选
  if (timeFilter && timeFilter.label) {
    parts.push(`时间范围限定在「${timeFilter.label}」`);
  }

  // 维度
  if (dimensionField && intent.type !== 'metric_query') {
    const dimDesc = intent.type === 'trend' ? '' : `按「${dimensionField}」分组`;
    if (dimDesc) parts.push(dimDesc);
  }

  // 趋势特殊说明
  if (intent.type === 'trend') {
    parts.push('按月汇总后查看变化趋势');
  }

  // 季度对比说明
  if (intent.type === 'comparison') {
    parts.push('按季度汇总后进行对比');
  }

  // 排序
  if (intent.type === 'ranking') {
    parts.push('按数值从高到低排列');
  }

  if (parts.length === 0) return '';
  return parts.join('，') + '。';
}

        tooltip: { trigger: 'axis' },
        grid: { left: 60, right: 30, top: 20, bottom: 30 },
        xAxis: { type: 'category', data: rows.map(r => r[columns[0]]), axisLabel: { fontSize: 13, fontWeight: 'bold', fontFamily: "'PingFang SC','Microsoft YaHei',sans-serif" } },
        yAxis: { type: 'value', axisLabel: { formatter: v => (v/10000).toFixed(0)+'万', fontSize: 11, fontFamily: "'PingFang SC','Microsoft YaHei',sans-serif" } },
        series: [{ type: 'bar', data: rows.map(r => ({ value: r[columns[1]], itemStyle: { color: '#4F46E5', borderRadius: [6, 6, 0, 0] } })), barWidth: 60, label: { show: true, position: 'top', formatter: p => (p.value/10000).toFixed(1)+'万', fontSize: 12, fontWeight: 'bold' } }]
      }
    });
    html += `<div class="chart-container" id="${chartId}"></div>`;
  } else {
    html += `<div class="section-title">查询结果</div>`;
    html += `<table class="mini-table"><thead><tr>`;
    columns.forEach(c => html += `<th>${escapeHtml(c)}</th>`);
    html += `</tr></thead><tbody>`;
    rows.forEach(row => {
      html += `<tr>`;
      columns.forEach(c => {
        const v = row[c];
        html += `<td>${escapeHtml(String(v !== null && v !== undefined ? v : 'NULL'))}</td>`;
      });
      html += `</tr>`;
    });
    html += `</tbody></table>`;
  }

  return { html, chartIds };
}

async function generateAIReply(text) {
  // 续问识别：如果文本很短（<=6字）且不含指标关键词，尝试作为追问处理
  const shortPatterns = /^.{1,6}[？?！!。]$/;
  const metricNames = (getMetricsConfig().metrics || []).map(m => m.name);
  const hasMetricKeyword = metricNames.some(n => text.includes(n));
  if (shortPatterns.test(text) && !hasMetricKeyword) {
    // 短句追问：从 chatHistory 获取上一次指标，拼接完整问题
    const msgs = document.querySelectorAll('.qa-message.user-msg .qa-msg-text, .qa-message.user .qa-msg-text');
    if (msgs.length > 0) {
      const lastUserText = msgs[msgs.length - 1].textContent || '';
      const lastMetric = metricNames.find(n => lastUserText.includes(n));
      if (lastMetric && !text.includes(lastMetric)) {
        text = lastMetric + text;
      }
    }
  }

  // ===== 第一步：意图识别 + 指标匹配 =====
  const intent = detectIntent(text);
  const metricsCfg = getMetricsConfig();
  const metrics = metricsCfg ? metricsCfg.metrics : [];
  const matchedMetric = resolveMetric(text, metrics);

  // 当检测到查询意图但未匹配到指标时，列出可用指标引导用户
  if (!matchedMetric && intent.type !== 'general') {
    const metricList = metrics.map(m => `「${m.name}」— ${m.description}`).join('<br>');
    const replyHtml = `
    <div style="padding:16px;background:var(--brand-primary-light);border-radius:var(--radius-lg);border:1px solid var(--brand-primary-muted);">
      <div style="font-size:15px;font-weight:var(--weight-semibold);color:var(--color-text);margin-bottom:8px;">🤔 未找到匹配的指标</div>
      <div style="font-size:13px;color:var(--color-text-secondary);line-height:1.7;">
        请问您想查询的是以下哪个指标？<br><br>
        ${metricList}<br><br>
        请尝试用指标名称重新提问，例如「2025年销售额多少」。
      </div>
    </div>
  `;
    return { html: replyHtml, chartIds: [] };
  }

  // ===== 第二步：提取时间过滤 =====
  const timeFilter = extractTimeFilter(text);

  // 反问：metric_query 且缺少时间范围时，提示用户补充
  if (intent.type === 'metric_query' && matchedMetric && !timeFilter) {
    const hasTotalKeyword = /全部|总计|所有|整体|累计|一共|总共/.test(text);
    if (!hasTotalKeyword) {
      const metricName = matchedMetric.name;
      const timeSuggestions = ['2025年', '2026年', '上个月', '最近7天'];
      const suggestions = timeSuggestions.map(s => `「${s}」`).join('、');
      const replyHtml = `
        <div style="padding:16px;background:var(--brand-primary-light);border-radius:var(--radius-lg);border:1px solid var(--brand-primary-muted);">
          <div style="font-size:15px;font-weight:var(--weight-semibold);color:var(--color-text);margin-bottom:8px;">💡 请补充时间范围</div>
          <div style="font-size:13px;color:var(--color-text-secondary);line-height:1.7;">
            您想查询哪个时间段的<strong>${escapeHtml(metricName)}</strong>呢？<br>
            数据库中的数据覆盖 2025-01-01 至 2026-06-30，您可以尝试输入：${suggestions}。<br>
            如需查看全部数据，可以说「${escapeHtml(metricName)}总计多少」。
          </div>
        </div>
      `;
      return { html: replyHtml, chartIds: [] };
    }
  }

  // ===== 第三步：尝试查询后端数据库 =====
  const firstTable = await getFirstTableName();
  let backendResult = null;
  let generatedSQL = '';
  let dimensionField = '';
  let sqlMeta = null;
  const confirmations = [];

  if (firstTable && intent.type !== 'general') {
    // 优先使用指标配置中的表名（如果在后端也存在）
    const tableName = inferTableFromMetric(matchedMetric);
    const allTables = await getBackendTables();
    const allTableNames = allTables;
    // 如果指标配置的表名在后端存在，优先用它
    const targetTable = (tableName && allTableNames.includes(tableName)) ? tableName : firstTable;
    const schema = await getTableSchema(targetTable);

    if (intent.dimension && intent.dimension !== 'auto') {
      dimensionField = intent.dimension;
    } else if (schema && schema.schema) {
      dimensionField = guessGroupField(schema.schema, '') || '';
    }

    sqlMeta = generateSQL(intent, matchedMetric, targetTable, schema, timeFilter);
    generatedSQL = sqlMeta.sql;

    // 收集确认项
    if (sqlMeta.isInferred) {
      confirmations.push(`聚合字段已自动推断为「${sqlMeta.aggField}」，请确认是否正确`);
    }
    if (dimensionField && !intent.dimension) {
      confirmations.push(`分组维度已自动推断为「${dimensionField}」，请确认是否正确`);
    }
    if (!timeFilter && intent.type !== 'general') {
      confirmations.push('未检测到时间范围，默认查询全部数据，如需指定时间请补充说明');
    }

    // 使用 ShujianDB.smartQuery 自动关联表
    const { sql: expandedSql, nameFields } = ShujianDB.smartQuery(generatedSQL, targetTable);
    try {
      backendResult = ShujianDB.query(expandedSql);
    } catch(e) {
      console.warn('DB query error:', e);
      backendResult = null;
    }
  }

  // ===== 第四步：渲染结果 =====
  let html = '';
  let chartIds = [];

  // 判断数据是否真正有效（有非 null 值）
  function hasValidData(result) {
    if (!result || !result.rows || result.rows.length === 0) return false;
    return result.rows.some(row => result.columns.some(col => row[col] !== null && row[col] !== undefined));
  }

  if (backendResult && hasValidData(backendResult)) {
    // 使用后端真实数据
    const result = buildResultHTML(backendResult, intent, matchedMetric, generatedSQL, timeFilter, dimensionField, confirmations);
    html += result.html;
    chartIds = result.chartIds;

    // 添加分析洞察
    if (intent.type === 'metric_query') {
      const val = parseFloat(backendResult.rows[0][backendResult.columns[0]]);
      if (!isNaN(val)) {
        const unit = matchedMetric && matchedMetric.unit ? matchedMetric.unit : '';
        const metricLabel = matchedMetric ? matchedMetric.name : '查询结果';
        const isCountInsight = matchedMetric && matchedMetric.config && (matchedMetric.config.calc === 'count' || matchedMetric.config.calc === 'count_distinct');
        const valDisplay = isCountInsight ? val.toLocaleString() : fmtMoneyFull(val);
        html += `<div class="insight-text">📊 <strong>${escapeHtml(metricLabel)}</strong>在${timeFilter ? '「' + escapeHtml(timeFilter.label) + '」' : '全部时间范围内'}的查询结果为 <strong>${valDisplay}${unit ? ' ' + unit : ''}</strong>（口径版本 ${matchedMetric ? (matchedMetric.version || 'v1.0') : 'v1.0'}）。该数值基于「${escapeHtml(sqlMeta.aggField)}」字段${matchedMetric && matchedMetric.config && matchedMetric.config.calc === 'count_distinct' ? '去重计数' : matchedMetric && matchedMetric.config && matchedMetric.config.calc === 'count' ? '计数' : '求和'}得出。</div>`;
      }
    } else if (intent.type === 'breakdown' || intent.type === 'ranking') {
      const total = backendResult.rows.reduce((sum, row) => sum + (parseFloat(row[backendResult.columns[1]]) || 0), 0);
      const maxRow = backendResult.rows.reduce((a, b) => (parseFloat(a[backendResult.columns[1]]) || 0) > (parseFloat(b[backendResult.columns[1]]) || 0) ? a : b);
      const topName = maxRow[backendResult.columns[0]];
      const topVal = parseFloat(maxRow[backendResult.columns[1]]) || 0;
      const metricLabel = matchedMetric ? matchedMetric.name : '数值';
      const topPct = total > 0 ? ((topVal / total) * 100).toFixed(1) : 0;
      html += `<div class="insight-text">📋 共查询到 <strong>${backendResult.rows.length}</strong> 条记录，「${escapeHtml(topName)}」以 ${fmtMoneyFull(topVal)} 排名第一，占总量的 ${topPct}%。${timeFilter ? '时间范围：' + escapeHtml(timeFilter.label) + '。' : ''}</div>`;
    } else if (intent.type === 'trend') {
      const vals = backendResult.rows.map(r => parseFloat(r[backendResult.columns[1]]) || 0);
      const maxVal = Math.max(...vals);
      const minVal = Math.min(...vals);
      const maxIdx = vals.indexOf(maxVal);
      const minIdx = vals.indexOf(minVal);
      const maxPeriod = backendResult.rows[maxIdx] ? backendResult.rows[maxIdx][backendResult.columns[0]] : '-';
      const minPeriod = backendResult.rows[minIdx] ? backendResult.rows[minIdx][backendResult.columns[0]] : '-';
      const trend = vals[vals.length-1] > vals[0] ? '上升' : '下降';
      html += `<div class="insight-text">📈 整体趋势呈<strong>${trend}</strong>态势。峰值出现在「${escapeHtml(String(maxPeriod))}」（${fmtMoneyFull(maxVal)}），最低点为「${escapeHtml(String(minPeriod))}」（${fmtMoneyFull(minVal)}）。</div>`;
    } else if (intent.type === 'comparison') {
      const metricLabel = matchedMetric ? matchedMetric.name : '数值';
      const cRows = backendResult.rows;
      const cCols = backendResult.columns;
      if (cRows.length >= 2) {
        const q1 = cRows[0][cCols[1]] || 0;
        const q2 = cRows[cRows.length - 1][cCols[1]] || 0;
        const diff = parseFloat(q2) - parseFloat(q1);
        const pct = q1 != 0 ? ((diff / parseFloat(q1)) * 100).toFixed(1) : 0;
        const direction = diff >= 0 ? '增长' : '下降';
        html += `<div class="insight-text">📊 ${escapeHtml(metricLabel)}季度对比：${escapeHtml(String(cRows[0][cCols[0]]))} 为 ${fmtMoneyFull(parseFloat(q1))}，${escapeHtml(String(cRows[cRows.length-1][cCols[0]]))} 为 ${fmtMoneyFull(parseFloat(q2))}，环比${direction} ${Math.abs(pct)}%。${timeFilter ? '时间范围：' + escapeHtml(timeFilter.label) + '。' : ''}</div>`;
      } else {
        html += `<div class="insight-text">📊 ${escapeHtml(metricLabel)}季度对比分析完成，${timeFilter ? '时间范围：' + escapeHtml(timeFilter.label) + '。' : ''}</div>`;
      }
    }

  } else {
    // ===== 无有效数据 → 阻断所有分析，仅输出统一提示 =====
    html += `<div style="text-align:center;padding:32px 20px;">`;
    html += `<div style="font-size:48px;margin-bottom:12px;">📊</div>`;
    html += `<div style="font-size:18px;font-weight:var(--weight-semibold);color:var(--color-text-secondary);margin-bottom:8px;">数据库暂无数据，无法生成分析。</div>`;
    html += `<div style="font-size:13px;color:var(--color-text-tertiary);max-width:360px;margin:0 auto;line-height:1.6;">`;
    if (timeFilter) {
      html += `您查询的时间范围是「${escapeHtml(timeFilter.label)}」，但数据库中暂无符合条件的记录。<br>`;
    }
    html += `请尝试调整时间范围，或先到「数据管理」页面上传对应时间段的数据。`;
    html += `</div></div>`;
  }

  return { html, chartIds };
}

function getOrdersFormula() {
  const metricsRaw = localStorage.getItem('shujian-metrics-config');
  if (metricsRaw) {
    try {
      const cfg = JSON.parse(metricsRaw);
      const m = cfg.metrics && cfg.metrics.find(m => m.name === '订单数');
      if (m && m.formula) return m.formula;
    } catch(e) {}
  }
  return "COUNT(DISTINCT 用户ID || '-' || 购买时间)";
}

// Skill A: 指标公式解释器 — 将 SQL 公式翻译为自然语言
function explainFormula(formula, metricName) {
  if (!formula) return '';
  const mainFormula = formula.split('\n')[0].split('--')[0].trim();
  
  // 复合公式解析（含运算符）
  if (/[\/\+\-\*]/.test(mainFormula) && !mainFormula.includes('CASE WHEN')) {
    return explainCompositeFormula(mainFormula, metricName);
  }
  
  // SUM 类
  const sumMatch = mainFormula.match(/SUM\s*\(\s*"?([^"()]+)"?\s*\)/i);
  if (sumMatch) {
    return `对「${sumMatch[1]}」字段求和，得到${metricName}的总值。`;
  }
  
  // COUNT DISTINCT 类
  const countDistMatch = mainFormula.match(/COUNT\s*\(\s*DISTINCT\s+"?([^"()]+)"?\s*\)/i);
  if (countDistMatch) {
    return `对「${countDistMatch[1]}」字段去重计数，统计不重复的记录数量。`;
  }
  
  // COUNT(*) 类
  if (/COUNT\s*\(\s*\*\s*\)/i.test(mainFormula)) {
    return `统计所有记录的总数。`;
  }
  
  // AVG 类
  const avgMatch = mainFormula.match(/AVG\s*\(\s*"?([^"()]+)"?\s*\)/i);
  if (avgMatch) {
    return `计算「${avgMatch[1]}」字段的平均值。`;
  }
  
  // ROUND 包裹
  const roundInner = mainFormula.match(/ROUND\s*\((.+?)(?:,\s*\d+\s*)?\)/i);
  if (roundInner) {
    return explainFormula(roundInner[1], metricName) + '（结果四舍五入）';
  }
  
  // NULLIF 包裹
  const nullifInner = mainFormula.match(/NULLIF\s*\(([^,]+),\s*0\s*\)/i);
  if (nullifInner) {
    return explainFormula(nullifInner[1], metricName) + '（分母为零时返回 NULL 而非报错）';
  }
  
  // 通用兜底
  if (mainFormula.length > 0) {
    return `${metricName}的计算公式为 ${mainFormula}。`;
  }
  return '';
}

function explainCompositeFormula(formula, metricName) {
  // 按 + - * / 拆分为左右两部分（考虑括号嵌套）
  // 简化版：找最外层的运算符
  const ops = [
    { re: /\((.+?)\)\s*([\/\+\-\*])\s*\((.+?)\)/, extract: (m) => ({ left: m[1], op: m[2], right: m[3] }) },
    { re: /(\S+)\s*([\/])\s*(\S+)/, extract: (m) => ({ left: m[1], op: m[2], right: m[3] }) }
  ];
  
  for (const opDef of ops) {
    const m = formula.match(opDef.re);
    if (m) {
      const parts = opDef.extract(m);
      const opNames = { '/': '除以', '+': '加上', '-': '减去', '*': '乘以' };
      const leftClean = parts.left.replace(/^\(/, '').replace(/\)$/, '');
      const rightClean = parts.right.replace(/^\(/, '').replace(/\)$/, '');
      return `${leftClean} ${opNames[parts.op] || parts.op} ${rightClean}，计算得出${metricName}。`;
    }
  }
  return `${metricName}的计算公式为 ${formula}。`;
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
}
