<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>采购记录 - AI采购单识别</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-icon"><span class="material-icons">receipt_long</span></div>
                <div>
                    <div class="sidebar-title">AI采购单识别</div>
                    <div class="sidebar-subtitle">智能记账工具</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a class="nav-item" href="index.html"><span class="material-icons">dashboard</span><span>仪表盘</span></a>
                <a class="nav-item" href="recognize.html"><span class="material-icons">photo_camera</span><span>图片识别</span></a>
                <a class="nav-item active" href="records.html"><span class="material-icons">list_alt</span><span>采购记录</span></a>
                <a class="nav-item" href="suppliers.html"><span class="material-icons">storefront</span><span>供应商管理</span></a>
                <a class="nav-item" href="reports.html"><span class="material-icons">bar_chart</span><span>报表统计</span></a>
                <a class="nav-item" href="settings.html"><span class="material-icons">settings</span><span>系统设置</span></a>
            </nav>
            <div class="sidebar-user">
                <div class="user-avatar"><span class="material-icons" style="font-size:20px;">person</span></div>
                <div class="user-info"><strong>商户名称</strong><small>普通用户</small></div>
            </div>
        </aside>

        <main class="main">
            <header class="toolbar">
                <div>
                    <h1 class="page-title">采购记录</h1>
                    <p class="page-desc" id="pageDesc">共 0 条记录</p>
                </div>
                <button class="btn btn-primary" onclick="location.href='record-edit.html'">
                    <span class="material-icons" style="font-size:18px;">add</span>
                    新增记录
                </button>
            </header>

            <!-- 筛选栏 -->
            <div class="card" style="padding:18px;">
                <div class="filter-bar">
                    <div class="filter-item">
                        <label>搜索</label>
                        <input type="text" id="searchInput" class="form-input" placeholder="供应商 / 货品 / 备注">
                    </div>
                    <div class="filter-item" style="flex:0.8;">
                        <label>日期从</label>
                        <input type="date" id="dateFrom" class="form-input">
                    </div>
                    <div class="filter-item" style="flex:0.8;">
                        <label>至</label>
                        <input type="date" id="dateTo" class="form-input">
                    </div>
                    <div class="filter-item">
                        <label>供应商</label>
                        <select id="supplierFilter" class="form-input"><option value="">全部</option></select>
                    </div>
                    <div class="filter-actions">
                        <button class="btn btn-primary" onclick="applyFilter();"><span class="material-icons" style="font-size:18px;">filter_alt</span>筛选</button>
                        <button class="btn btn-secondary" onclick="resetFilter();">重置</button>
                    </div>
                </div>
            </div>

            <!-- 记录列表 -->
            <div class="record-list" id="recordsList"></div>

            <!-- 分页 -->
            <div class="pagination" id="pagination"></div>
        </main>

        <nav class="bottom-nav">
            <a class="bottom-nav-btn" href="index.html"><span class="material-icons">dashboard</span><small>仪表盘</small></a>
            <a class="bottom-nav-btn" href="recognize.html"><span class="material-icons">photo_camera</span><small>识别</small></a>
            <a class="bottom-nav-btn active" href="records.html"><span class="material-icons">list_alt</span><small>记录</small></a>
            <a class="bottom-nav-btn" href="reports.html"><span class="material-icons">bar_chart</span><small>报表</small></a>
            <a class="bottom-nav-btn" href="settings.html"><span class="material-icons">settings</span><small>设置</small></a>
        </nav>
    </div>

    <script src="assets/js/db.js"></script>
    <script src="assets/js/utils.js"></script>
    <script>
        let currentPage = 1;
        const pageSize = 10;
        let totalPages = 1;

        async function initPage() {
            await DB.init();
            const suppliers = await DB.listSuppliers();
            const select = document.getElementById('supplierFilter');
            suppliers.forEach(function (s) {
                const opt = document.createElement('option');
                opt.value = s.name; opt.textContent = s.name;
                select.appendChild(opt);
            });
            loadRecords();
        }

        function getFilters() {
            return {
                keyword: document.getElementById('searchInput').value.trim(),
                dateFrom: document.getElementById('dateFrom').value,
                dateTo: document.getElementById('dateTo').value,
                supplier: document.getElementById('supplierFilter').value
            };
        }

        async function loadRecords() {
            const filters = getFilters();
            const records = await DB.listRecords({
                page: currentPage, pageSize: pageSize,
                keyword: filters.keyword, dateFrom: filters.dateFrom,
                dateTo: filters.dateTo, supplier: filters.supplier
            });

            const total = await DB.countRecords(filters);
            totalPages = Math.max(1, Math.ceil(total / pageSize));
            document.getElementById('pageDesc').textContent = '共 ' + total + ' 条记录';

            const list = document.getElementById('recordsList');
            if (records.length === 0) {
                list.innerHTML = '<div class="card"><div class="empty-state"><span class="material-icons">inbox</span><p>暂无记录</p><small>点击右上方"新增记录"开始记账</small></div></div>';
            } else {
                list.innerHTML = records.map(function (r) {
                    const itemsText = (r.items || []).map(function (i) { return (i.name || '') + ' ' + (i.weight || 0) + '斤'; }).join('、') || '—';
                    return '<div class="card record-card" onclick="location.href=\'record-edit.html?id=' + r.id + '\';">' +
                        '<div class="record-header">' +
                        '<div><span class="record-date">' + (r.date || '') + '</span></div>' +
                        '<div class="record-amount">¥' + Utils.formatMoney(r.totalAmount) + '</div>' +
                        '</div>' +
                        '<div class="record-supplier">' + (r.supplier || '未知供应商') + '</div>' +
                        '<div class="record-items">' + itemsText + '</div>' +
                        (r.note ? '<div class="record-note">备注：' + r.note + '</div>' : '') +
                        '<div class="record-actions" onclick="event.stopPropagation();">' +
                        '<button class="btn btn-secondary btn-sm" onclick="location.href=\'record-edit.html?id=' + r.id + '\';">编辑</button>' +
                        '<button class="btn btn-danger btn-sm" onclick="deleteRecord(' + r.id + ');">删除</button>' +
                        '</div>' +
                        '</div>';
                }).join('');
            }
            renderPagination();
        }

        function renderPagination() {
            const pag = document.getElementById('pagination');
            if (totalPages <= 1) { pag.innerHTML = ''; return; }
            pag.innerHTML = '<button class="btn btn-secondary btn-sm" onclick="goPage(' + (currentPage - 1) + ');" ' + (currentPage === 1 ? 'disabled' : '') + '>上一页</button>' +
                '<span class="pagination-info">第 ' + currentPage + ' / ' + totalPages + ' 页</span>' +
                '<button class="btn btn-secondary btn-sm" onclick="goPage(' + (currentPage + 1) + ');" ' + (currentPage === totalPages ? 'disabled' : '') + '>下一页</button>';
        }

        function goPage(page) {
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            loadRecords();
        }

        function applyFilter() { currentPage = 1; loadRecords(); }
        function resetFilter() {
            document.getElementById('searchInput').value = '';
            document.getElementById('dateFrom').value = '';
            document.getElementById('dateTo').value = '';
            document.getElementById('supplierFilter').value = '';
            currentPage = 1;
            loadRecords();
        }

        function deleteRecord(id) {
            Utils.showModal('确认删除这条记录？删除后无法恢复。', async function () {
                await DB.deleteRecord(id);
                Utils.showToast('已删除', 'success');
                loadRecords();
            });
        }

        initPage();
    </script>
</body>
</html>
