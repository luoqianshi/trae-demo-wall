<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑记录 - AI采购单识别</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-icon"><span class="material-icons">receipt_long</span></div>
                <div>
                    <div class="sidebar-title">AI采购单识别</div>
                    <div class="sidebar-subtitle">智能记账工具</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a class="nav-item" href="index.html"><span class="material-icons">dashboard</span><span>仪表盘</span></a>
                <a class="nav-item" href="recognize.html"><span class="material-icons">photo_camera</span><span>图片识别</span></a>
                <a class="nav-item active" href="records.html"><span class="material-icons">list_alt</span><span>采购记录</span></a>
                <a class="nav-item" href="suppliers.html"><span class="material-icons">storefront</span><span>供应商管理</span></a>
                <a class="nav-item" href="reports.html"><span class="material-icons">bar_chart</span><span>报表统计</span></a>
                <a class="nav-item" href="settings.html"><span class="material-icons">settings</span><span>系统设置</span></a>
            </nav>
            <div class="sidebar-user">
                <div class="user-avatar"><span class="material-icons" style="font-size:20px;">person</span></div>
                <div class="user-info"><strong>商户名称</strong><small>普通用户</small></div>
            </div>
        </aside>

        <main class="main">
            <header class="toolbar">
                <div>
                    <h1 class="page-title" id="pageTitle">新增采购记录</h1>
                    <p class="page-desc">填写采购单信息并保存</p>
                </div>
                <button class="btn btn-secondary" onclick="location.href='records.html'">
                    <span class="material-icons" style="font-size:18px;">arrow_back</span>
                    返回列表
                </button>
            </header>

            <div class="card">
                <div class="form-row three-col">
                    <div class="form-group">
                        <label class="form-label">采购日期 <span style="color:#ef4444;">*</span></label>
                        <input type="date" id="recDate" class="form-input">
                    </div>
                    <div class="form-group">
                        <label class="form-label">供应商 <span style="color:#ef4444;">*</span></label>
                        <select id="recSupplier" class="form-input"></select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">备注</label>
                        <input type="text" id="recNote" class="form-input" placeholder="选填">
                    </div>
                </div>

                <h4 style="margin:24px 0 14px;font-size:15px;font-weight:700;color:#1e293b;">
                    <span class="material-icons" style="font-size:18px;vertical-align:middle;margin-right:4px;color:#10b981;">shopping_basket</span>
                    货品明细
                </h4>

                <table class="items-table" id="itemsTable">
                    <thead>
                        <tr>
                            <th style="width:30%;">货品名称</th>
                            <th>重量(斤)</th>
                            <th>单价(元)</th>
                            <th>金额(元)</th>
                            <th style="width:50px;"></th>
                        </tr>
                    </thead>
                    <tbody id="itemsBody"></tbody>
                </table>

                <button class="btn btn-secondary" style="width:100%;" onclick="addItemRow();">
                    <span class="material-icons" style="font-size:18px;">add</span> 添加一行
                </button>

                <div style="margin-top:24px;padding:20px;background:linear-gradient(135deg,#ecfdf5,#d1fae5);border-radius:16px;display:flex;justify-content:space-between;align-items:center;">
                    <div>
                        <span style="font-size:14px;color:#065f46;font-weight:600;">合计金额</span>
                        <div style="font-size:12px;color:#10b981;" id="itemCount">共 0 项</div>
                    </div>
                    <span style="font-size:28px;font-weight:800;color:#059669;">¥<span id="totalAmount">0.00</span></span>
                </div>

                <div style="display:flex;gap:12px;margin-top:24px;justify-content:flex-end;">
                    <button class="btn btn-secondary" onclick="location.href='records.html'">取消</button>
                    <button class="btn btn-primary" onclick="saveRecord();">
                        <span class="material-icons" style="font-size:18px;">save</span> 保存记录
                    </button>
                </div>
            </div>
        </main>

        <nav class="bottom-nav">
            <a class="bottom-nav-btn" href="index.html"><span class="material-icons">dashboard</span><small>仪表盘</small></a>
            <a class="bottom-nav-btn" href="recognize.html"><span class="material-icons">photo_camera</span><small>识别</small></a>
            <a class="bottom-nav-btn active" href="records.html"><span class="material-icons">list_alt</span><small>记录</small></a>
            <a class="bottom-nav-btn" href="reports.html"><span class="material-icons">bar_chart</span><small>报表</small></a>
            <a class="bottom-nav-btn" href="settings.html"><span class="material-icons">settings</span><small>设置</small></a>
        </nav>
    </div>

    <script src="assets/js/db.js"></script>
    <script src="assets/js/utils.js"></script>
    <script>
        let recordId = null;
        let items = [];

        async function initPage() {
            await DB.init();
            const suppliers = await DB.listSuppliers();
            const select = document.getElementById('recSupplier');
            select.innerHTML = '<option value="">请选择供应商</option>' + suppliers.map(function (s) {
                return '<option value="' + s.name + '">' + s.name + '</option>';
            }).join('');

            const params = new URLSearchParams(location.search);
            const id = params.get('id');
            if (id) {
                recordId = parseInt(id, 10);
                document.getElementById('pageTitle').textContent = '编辑采购记录';
                const record = await DB.getRecord(recordId);
                if (record) {
                    document.getElementById('recDate').value = record.date;
                    document.getElementById('recSupplier').value = record.supplier;
                    document.getElementById('recNote').value = record.note || '';
                    items = record.items || [];
                }
            } else {
                document.getElementById('recDate').value = Utils.formatDate();
                items = [{ name: '', weight: 0, price: 0, amount: 0 }];
            }
            renderItems();
        }

        function renderItems() {
            const tbody = document.getElementById('itemsBody');
            if (items.length === 0) items = [{ name: '', weight: 0, price: 0, amount: 0 }];
            tbody.innerHTML = items.map(function (item, idx) {
                return '<tr>' +
                    '<td><input type="text" class="form-input" value="' + (item.name || '') + '" onchange="updateItem(' + idx + ',\'name\',this.value);" placeholder="货品名称"></td>' +
                    '<td><input type="number" class="form-input" value="' + (item.weight || 0) + '" step="0.01" onchange="updateItem(' + idx + ',\'weight\',this.value);"></td>' +
                    '<td><input type="number" class="form-input" value="' + (item.price || 0) + '" step="0.01" onchange="updateItem(' + idx + ',\'price\',this.value);"></td>' +
                    '<td><input type="number" class="form-input" value="' + (item.amount || 0) + '" step="0.01" onchange="updateItem(' + idx + ',\'amount\',this.value);"></td>' +
                    '<td><button style="background:none;border:none;cursor:pointer;color:#ef4444;" onclick="removeItem(' + idx + ');" title="删除"><span class="material-icons">delete</span></button></td>' +
                '</tr>';
            }).join('');
            updateTotal();
        }

        function updateItem(idx, field, value) {
            if (field === 'weight' || field === 'price' || field === 'amount') value = parseFloat(value) || 0;
            items[idx][field] = value;
            if (field === 'weight' || field === 'price') {
                items[idx].amount = items[idx].weight * items[idx].price;
                renderItems();
            }
            updateTotal();
        }

        function addItemRow() {
            items.push({ name: '', weight: 0, price: 0, amount: 0 });
            renderItems();
        }

        function removeItem(idx) {
            items.splice(idx, 1);
            if (items.length === 0) items = [{ name: '', weight: 0, price: 0, amount: 0 }];
            renderItems();
        }

        function updateTotal() {
            const validItems = items.filter(function (i) { return parseFloat(i.amount) > 0; });
            const total = validItems.reduce(function (sum, i) { return sum + (parseFloat(i.amount) || 0); }, 0);
            document.getElementById('totalAmount').textContent = Utils.formatMoney(total);
            document.getElementById('itemCount').textContent = '共 ' + validItems.length + ' 项';
        }

        async function saveRecord() {
            const date = document.getElementById('recDate').value;
            const supplier = document.getElementById('recSupplier').value;
            if (!date || !supplier) { Utils.showToast('请填写日期和供应商', 'error'); return; }

            const validItems = items.filter(function (i) { return i.name && parseFloat(i.amount) > 0; });
            if (validItems.length === 0) { Utils.showToast('请至少填写一项货品', 'error'); return; }

            const total = validItems.reduce(function (sum, i) { return sum + (parseFloat(i.amount) || 0); }, 0);
            const data = { date: date, supplier: supplier, items: validItems, totalAmount: total, note: document.getElementById('recNote').value };

            if (recordId) {
                await DB.updateRecord(recordId, data);
                Utils.showToast('更新成功！', 'success');
            } else {
                await DB.addRecord(data);
                Utils.showToast('保存成功！', 'success');
            }
            setTimeout(function () { location.href = 'records.html'; }, 1000);
        }

        initPage();
    </script>
</body>
</html>
