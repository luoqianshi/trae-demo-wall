<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>供应商管理 - AI采购单识别</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-icon"><span class="material-icons">receipt_long</span></div>
                <div>
                    <div class="sidebar-title">AI采购单识别</div>
                    <div class="sidebar-subtitle">智能记账工具</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a class="nav-item" href="index.html"><span class="material-icons">dashboard</span><span>仪表盘</span></a>
                <a class="nav-item" href="recognize.html"><span class="material-icons">photo_camera</span><span>图片识别</span></a>
                <a class="nav-item" href="records.html"><span class="material-icons">list_alt</span><span>采购记录</span></a>
                <a class="nav-item active" href="suppliers.html"><span class="material-icons">storefront</span><span>供应商管理</span></a>
                <a class="nav-item" href="reports.html"><span class="material-icons">bar_chart</span><span>报表统计</span></a>
                <a class="nav-item" href="settings.html"><span class="material-icons">settings</span><span>系统设置</span></a>
            </nav>
            <div class="sidebar-user">
                <div class="user-avatar"><span class="material-icons" style="font-size:20px;">person</span></div>
                <div class="user-info"><strong>商户名称</strong><small>普通用户</small></div>
            </div>
        </aside>

        <main class="main">
            <header class="toolbar">
                <div>
                    <h1 class="page-title">供应商管理</h1>
                    <p class="page-desc">管理常购供应商信息</p>
                </div>
            </header>

            <div class="page-layout">
                <!-- 添加/编辑表单 -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title"><span class="material-icons">add_business</span><span id="formTitle">添加供应商</span></h3>
                    </div>
                    <div class="form-group">
                        <label class="form-label">供应商名称 <span style="color:#ef4444;">*</span></label>
                        <input type="text" id="supplierName" class="form-input" placeholder="例如：鑫源果蔬批发">
                    </div>
                    <div class="form-row two-col">
                        <div class="form-group">
                            <label class="form-label">联系人</label>
                            <input type="text" id="supplierContact" class="form-input" placeholder="选填">
                        </div>
                        <div class="form-group">
                            <label class="form-label">联系电话</label>
                            <input type="text" id="supplierPhone" class="form-input" placeholder="选填">
                        </div>
                    </div>
                    <input type="hidden" id="supplierId">
                    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px;">
                        <button class="btn btn-secondary" id="cancelBtn" style="display:none;" onclick="resetForm();">取消</button>
                        <button class="btn btn-primary" onclick="saveSupplier();">
                            <span class="material-icons" style="font-size:18px;">save</span> 保存
                        </button>
                    </div>
                </div>

                <!-- 供应商列表 -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title"><span class="material-icons">storefront</span>供应商列表</h3>
                    </div>
                    <div class="supplier-list" id="supplierList"></div>
                </div>
            </div>
        </main>

        <nav class="bottom-nav">
            <a class="bottom-nav-btn" href="index.html"><span class="material-icons">dashboard</span><small>仪表盘</small></a>
            <a class="bottom-nav-btn" href="recognize.html"><span class="material-icons">photo_camera</span><small>识别</small></a>
            <a class="bottom-nav-btn" href="records.html"><span class="material-icons">list_alt</span><small>记录</small></a>
            <a class="bottom-nav-btn" href="reports.html"><span class="material-icons">bar_chart</span><small>报表</small></a>
            <a class="bottom-nav-btn" href="settings.html"><span class="material-icons">settings</span><small>设置</small></a>
        </nav>
    </div>

    <script src="assets/js/db.js"></script>
    <script src="assets/js/utils.js"></script>
    <script>
        async function initPage() {
            await DB.init();
            loadSuppliers();
        }

        async function loadSuppliers() {
            const suppliers = await DB.listSuppliers();
            const list = document.getElementById('supplierList');
            if (suppliers.length === 0) {
                list.innerHTML = '<div class="empty-state" style="padding:32px 0;"><span class="material-icons">inbox</span><p>暂无供应商</p></div>';
                return;
            }
            list.innerHTML = suppliers.map(function (s) {
                return '<div class="supplier-item">' +
                    '<div>' +
                    '<div class="supplier-name">' + s.name + '</div>' +
                    '<div class="supplier-meta">' + (s.contact ? '联系人：' + s.contact + ' ' : '') + (s.phone ? '电话：' + s.phone : '') + '</div>' +
                    '</div>' +
                    '<div style="display:flex;gap:8px;">' +
                    '<button class="btn btn-secondary btn-sm" onclick="editSupplier(' + s.id + ');">编辑</button>' +
                    '<button class="btn btn-danger btn-sm" onclick="deleteSupplier(' + s.id + ');">删除</button>' +
                    '</div>' +
                    '</div>';
            }).join('');
        }

        async function saveSupplier() {
            const name = document.getElementById('supplierName').value.trim();
            if (!name) { Utils.showToast('请填写供应商名称', 'error'); return; }

            const data = {
                name: name,
                contact: document.getElementById('supplierContact').value.trim(),
                phone: document.getElementById('supplierPhone').value.trim()
            };

            const id = document.getElementById('supplierId').value;
            if (id) {
                await DB.updateSupplier(parseInt(id, 10), data);
                Utils.showToast('供应商已更新', 'success');
            } else {
                await DB.addSupplier(data);
                Utils.showToast('供应商已添加', 'success');
            }
            resetForm();
            loadSuppliers();
        }

        async function editSupplier(id) {
            const s = await DB.getSupplier(id);
            if (!s) return;
            document.getElementById('supplierId').value = s.id;
            document.getElementById('supplierName').value = s.name;
            document.getElementById('supplierContact').value = s.contact || '';
            document.getElementById('supplierPhone').value = s.phone || '';
            document.getElementById('formTitle').textContent = '编辑供应商';
            document.getElementById('cancelBtn').style.display = 'inline-flex';
        }

        function resetForm() {
            document.getElementById('supplierId').value = '';
            document.getElementById('supplierName').value = '';
            document.getElementById('supplierContact').value = '';
            document.getElementById('supplierPhone').value = '';
            document.getElementById('formTitle').textContent = '添加供应商';
            document.getElementById('cancelBtn').style.display = 'none';
        }

        function deleteSupplier(id) {
            Utils.showModal('确认删除该供应商？如果已有采购记录引用该供应商，删除后记录中的供应商名称会保留但无法再次选择。', async function () {
                await DB.deleteSupplier(id);
                Utils.showToast('已删除', 'success');
                loadSuppliers();
            });
        }

        initPage();
    </script>
</body>
</html>
