<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>厨小白 - 厨房小白的成长伙伴</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0d5c0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    .app-container {
      width: 100%;
      max-width: 414px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #1a1a2e;
      position: relative;
    }
    .brand-header {
      text-align: center;
      padding: 24px 0;
      background: linear-gradient(180deg, #252540 0%, #1a1a2e 100%);
    }
    .brand-title {
      font-size: 36px;
      font-weight: bold;
      color: #d4a84b;
      text-shadow: 0 2px 10px rgba(212, 168, 75, 0.3);
      letter-spacing: 4px;
    }
    .brand-slogan {
      font-size: 16px;
      color: #888;
      margin-top: 8px;
    }
    .tab-content {
      display: none;
      flex: 1;
      padding: 16px;
      padding-bottom: 90px;
      overflow-y: auto;
    }
    .tab-content.active { display: block; }

    /* Tab 1: Free Recipes */
    .back-btn {
      display: none;
      background: transparent;
      border: none;
      color: #d4a84b;
      font-size: 16px;
      cursor: pointer;
      padding: 8px 0;
      margin-bottom: 12px;
    }
    .back-btn.show { display: block; }
    .recipe-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .recipe-card {
      background: #252540;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 2px solid transparent;
    }
    .recipe-card:hover {
      border-color: #d4a84b;
      transform: translateY(-2px);
    }
    .recipe-img {
      width: 100%;
      height: 80px;
      background: linear-gradient(135deg, #333 0%, #444 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
    }
    .recipe-info {
      padding: 8px;
    }
    .recipe-name {
      font-size: 12px;
      font-weight: bold;
      color: #e0d5c0;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .recipe-meta {
      font-size: 10px;
      color: #888;
      display: flex;
      justify-content: space-between;
    }
    .diff-tag {
      font-size: 9px;
      padding: 2px 5px;
      border-radius: 4px;
    }
    .diff-simple { background: rgba(76, 175, 80, 0.2); color: #81c784; }
    .diff-medium { background: rgba(255, 193, 7, 0.2); color: #ffd54f; }
    .diff-hard { background: rgba(244, 67, 54, 0.2); color: #e57373; }

    /* Tab 2: Premium Packages */
    .package-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .package-card {
      background: linear-gradient(135deg, #2d2a3d 0%, #1a1825 100%);
      border: 1px solid #d4a84b;
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .package-card::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 60px;
      height: 60px;
      background: rgba(212, 168, 75, 0.1);
      border-radius: 0 12px 0 100%;
    }
    .package-name {
      font-size: 14px;
      font-weight: bold;
      color: #d4a84b;
      margin-bottom: 8px;
    }
    .package-desc {
      font-size: 11px;
      color: #888;
    }
    .package-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: #d4a84b;
      color: #1a1a2e;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: bold;
    }

    /* Tab 3: Cuisines */
    .cuisine-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    .cuisine-btn {
      background: #252540;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      color: #e0d5c0;
      font-size: 14px;
    }
    .cuisine-btn.active {
      border-color: #d4a84b;
      background: rgba(212, 168, 75, 0.1);
      color: #d4a84b;
    }
    .cuisine-btn:hover {
      border-color: #d4a84b;
    }
    .cuisine-dishes {
      display: none;
    }
    .cuisine-dishes.active {
      display: block;
    }
    .dish-item {
      display: flex;
      background: #252540;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.3s;
    }
    .dish-item:hover {
      border: 1px solid #d4a84b;
    }
    .dish-info {
      flex: 1;
    }
    .dish-name {
      font-size: 14px;
      font-weight: bold;
      color: #e0d5c0;
    }
    .dish-meta {
      font-size: 11px;
      color: #888;
      margin-top: 4px;
    }
    .dish-arrow {
      color: #d4a84b;
      font-size: 18px;
    }

    /* Tab 4: My */
    .user-section {
      background: linear-gradient(135deg, #d4a84b 0%, #b8943e 100%);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 16px;
      text-align: center;
    }
    .avatar {
      width: 80px;
      height: 80px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      margin: 0 auto 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 36px;
    }
    .login-tip {
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: #252540;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }
    .stat-value {
      font-size: 24px;
      font-weight: bold;
      color: #d4a84b;
      margin-bottom: 4px;
    }
    .stat-label {
      font-size: 12px;
      color: #888;
    }
    .level-badge {
      background: linear-gradient(135deg, #d4a84b 0%, #c49a3d 100%);
      color: #1a1a2e;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 16px;
    }
    .menu-list {
      background: #252540;
      border-radius: 12px;
      overflow: hidden;
    }
    .menu-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      border-bottom: 1px solid #333;
      cursor: pointer;
      transition: background 0.3s;
    }
    .menu-item:last-child { border-bottom: none; }
    .menu-item:hover { background: #2d2d4a; }
    .menu-text { font-size: 14px; color: #e0d5c0; }
    .menu-arrow { color: #888; }

    /* Bottom Tab Bar */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 414px;
      background: #252540;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      border-top: 1px solid rgba(212, 168, 75, 0.2);
      z-index: 100;
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      padding: 6px 12px;
      color: #888;
      transition: all 0.3s;
    }
    .tab-item.active { color: #d4a84b; }
    .tab-icon { font-size: 22px; }
    .tab-label { font-size: 10px; }

    /* Recipe Detail Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .detail-modal {
      background: #252540;
      border-radius: 16px;
      width: 100%;
      max-width: 360px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .detail-header {
      padding: 16px;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .detail-close {
      font-size: 24px;
      cursor: pointer;
      color: #888;
    }
    .detail-img {
      width: 100%;
      height: 180px;
      background: linear-gradient(135deg, #333 0%, #444 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 64px;
    }
    .detail-content {
      padding: 20px;
    }
    .detail-name {
      font-size: 24px;
      font-weight: bold;
      color: #d4a84b;
      margin-bottom: 8px;
    }
    .detail-meta {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      font-size: 14px;
      color: #888;
    }
    .detail-section {
      margin-bottom: 16px;
    }
    .detail-section-title {
      font-size: 14px;
      font-weight: bold;
      color: #d4a84b;
      margin-bottom: 8px;
    }
    .ingredient-row {
      display: flex;
      padding: 8px 0;
      border-bottom: 1px solid #333;
      font-size: 13px;
    }
    .ingredient-row:last-child { border-bottom: none; }
    .ingredient-label {
      color: #888;
      width: 60px;
    }
    .ingredient-value {
      color: #e0d5c0;
      flex: 1;
    }
    .step-item {
      display: flex;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #333;
      font-size: 13px;
    }
    .step-item:last-child { border-bottom: none; }
    .step-num {
      background: #d4a84b;
      color: #1a1a2e;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 12px;
      font-weight: bold;
    }
    .step-text {
      color: #e0d5c0;
      flex: 1;
      line-height: 1.5;
    }
    .ai-teach-btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      margin-top: 20px;
      background: linear-gradient(135deg, #d4a84b 0%, #c49a3d 100%);
      color: #1a1a2e;
      transition: all 0.3s;
    }
    .ai-teach-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 4px 15px rgba(212, 168, 75, 0.4);
    }

    /* Teaching Page */
    .teaching-page {
      display: none;
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 414px;
      min-height: 100vh;
      background: #1a1a2e;
      z-index: 200;
      flex-direction: column;
    }
    .teaching-page.show { display: flex; }
    .teaching-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      background: #252540;
    }
    .teaching-back {
      color: #d4a84b;
      font-size: 16px;
      cursor: pointer;
    }
    .teaching-title {
      font-size: 18px;
      font-weight: bold;
      color: #d4a84b;
    }
    .chat-area {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }
    .chat-bubble {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .chat-bubble.ai {
      background: #1e3a2e;
      color: #e0d5c0;
      align-self: flex-start;
      border-left: 3px solid #d4a84b;
      border-bottom-left-radius: 4px;
    }
    .chat-bubble.user {
      background: #333;
      color: #e0d5c0;
      align-self: flex-end;
      border-right: 3px solid #d4a84b;
      border-bottom-right-radius: 4px;
    }
    .teaching-next-btn {
      background: linear-gradient(135deg, #d4a84b 0%, #c49a3d 100%);
      color: #1a1a2e;
      border: none;
      padding: 14px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      margin: 16px;
      cursor: pointer;
    }
    .timer-display {
      font-size: 28px;
      font-weight: bold;
      color: #d4a84b;
      text-align: right;
      margin-bottom: 8px;
    }
    .timer-bubble {
      background: #252540;
      padding: 8px 16px;
      border-radius: 20px;
      border: 2px solid #d4a84b;
    }
    .timer-warning {
      color: #ff6b6b;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .timeout-modal {
      background: #252540;
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      max-width: 280px;
    }
    .timeout-title {
      font-size: 18px;
      font-weight: bold;
      color: #d4a84b;
      margin-top: 12px;
    }
    .timeout-btn {
      background: #d4a84b;
      color: #1a1a2e;
      border: none;
      padding: 10px 24px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      margin-top: 20px;
      cursor: pointer;
    }

    /* Completion Modal */
    .completion-modal {
      background: #252540;
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      max-width: 300px;
    }
    .completion-emoji {
      font-size: 64px;
      margin-bottom: 16px;
    }
    .completion-title {
      font-size: 24px;
      font-weight: bold;
      color: #d4a84b;
      margin-bottom: 24px;
    }
    .share-btn {
      background: #d4a84b;
      color: #1a1a2e;
      border: none;
      padding: 14px 32px;
      border-radius: 25px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    /* AI Recommendation Card */
    .ai-card {
      background: #252540;
      border: 1px solid #d4a84b;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .ai-card-left {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .ai-card-avatar {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      background: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }
    .ai-card-name {
      font-size: 12px;
      color: #d4a84b;
      font-weight: bold;
    }
    .ai-card-right {
      flex: 1;
      display: flex;
      gap: 8px;
    }
    .ai-card-input {
      flex: 1;
      background: #1a1a2e;
      border: 1px solid #fff;
      border-radius: 20px;
      padding: 8px 12px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    .ai-card-input::placeholder {
      color: #666;
    }
    .ai-card-btn {
      background: #d4a84b;
      color: #1a1a2e;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .ai-recommend-result {
      margin-bottom: 12px;
      display: none;
    }
    .ai-recommend-result.show {
      display: block;
    }
    .ai-recommend-list {
      background: #fff;
      border-left: 4px solid #ff9800;
      border-radius: 8px;
      padding: 12px;
    }
    .ai-recommend-item {
      padding: 8px 12px;
      margin: 4px 0;
      background: #f5f5f5;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 14px;
      color: #333;
    }
    .ai-recommend-item:hover {
      background: #e0e0e0;
    }
    .ai-no-result {
      color: #999;
      font-size: 13px;
      padding: 8px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="brand-header">
      <h1 class="brand-title">厨小白</h1>
      <p class="brand-slogan">厨房小白的成长伙伴</p>
    </div>

    <!-- Tab 1: Free Recipes -->
    <div id="tab1" class="tab-content active">
      <button class="back-btn" id="backBtn" onclick="backToPackages()">< 返回</button>
      <!-- AI Recommendation Card -->
      <div class="ai-card">
        <div class="ai-card-left">
          <div class="ai-card-avatar">👩‍🍳</div>
          <div class="ai-card-name">小厨姐姐</div>
        </div>
        <div class="ai-card-right">
          <input type="text" class="ai-card-input" id="aiCardInput" placeholder="说个食材，帮你推荐菜谱..." onkeypress="if(event.key==='Enter') recommendFromCard()">
          <button class="ai-card-btn" onclick="recommendFromCard()">推荐</button>
        </div>
      </div>
      <div class="ai-recommend-result" id="aiRecommendResult"></div>
      <div class="recipe-grid" id="recipeGrid"></div>
    </div>

    <!-- Tab 2: Premium Packages -->
    <div id="tab2" class="tab-content">
      <div class="package-grid">
        <div class="package-card" onclick="showPackageDishes('走过路过别错过')">
          <div class="package-badge">5道菜</div>
          <div class="package-name">走过路过别错过</div>
          <div class="package-desc">新手入门必备</div>
        </div>
        <div class="package-card" onclick="showPackageDishes('镇店之宝')">
          <div class="package-badge">8道菜</div>
          <div class="package-name">镇店之宝</div>
          <div class="package-desc">精选招牌菜</div>
        </div>
        <div class="package-card" onclick="showPackageDishes('宝宝吃的香')">
          <div class="package-badge">6道菜</div>
          <div class="package-name">宝宝吃的香</div>
          <div class="package-desc">营养又健康</div>
        </div>
        <div class="package-card" onclick="showPackageDishes('爸妈的健康菜')">
          <div class="package-badge">7道菜</div>
          <div class="package-name">爸妈的健康菜</div>
          <div class="package-desc">养生家常菜</div>
        </div>
      </div>
    </div>

    <!-- Tab 3: Cuisines -->
    <div id="tab3" class="tab-content">
      <div class="cuisine-grid">
        <div class="cuisine-btn active" data-cuisine="all">全部</div>
        <div class="cuisine-btn" data-cuisine="chuan">川菜</div>
        <div class="cuisine-btn" data-cuisine="yue">粤菜</div>
        <div class="cuisine-btn" data-cuisine="lu">鲁菜</div>
        <div class="cuisine-btn" data-cuisine="xiang">湘菜</div>
        <div class="cuisine-btn" data-cuisine="dongbei">东北</div>
        <div class="cuisine-btn" data-cuisine="su">苏菜</div>
        <div class="cuisine-btn" data-cuisine="min">闽菜</div>
        <div class="cuisine-btn" data-cuisine="zhe">浙菜</div>
      </div>
      <div class="cuisine-dishes active" id="cuisineDishes"></div>
    </div>

    <!-- Tab 4: My -->
    <div id="tab4" class="tab-content">
      <div class="user-section">
        <div class="avatar">👤</div>
        <div class="login-tip">点击登录</div>
      </div>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value">0</div>
          <div class="stat-label">我的已购</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">0</div>
          <div class="stat-label">收藏</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">0</div>
          <div class="stat-label">分享</div>
        </div>
      </div>
      <div style="text-align: center; margin-bottom: 16px;">
        <span class="level-badge">Lv.1 厨房小白</span>
      </div>
      <div class="menu-list">
        <div class="menu-item">
          <span class="menu-text">🍽️ 忌口设置</span>
          <span class="menu-arrow">›</span>
        </div>
        <div class="menu-item">
          <span class="menu-text">ℹ️ 关于我们</span>
          <span class="menu-arrow">›</span>
        </div>
      </div>
    </div>

    <!-- Tab Bar -->
    <div class="tab-bar">
      <div class="tab-item active" data-tab="1">
        <span class="tab-icon">📖</span>
        <span class="tab-label">免费菜谱</span>
      </div>

      const chatArea = document.getElementById('chatArea');
      const btn = document.getElementById('nextStepBtn');
      const steps = currentDish.steps;

      // 清除之前的定时器
      clearInterval(timerInterval);

      if (currentStep < steps.length) {
        // 创建计时器显示区域
        const timerDiv = document.createElement('div');
        timerDiv.className = 'timer-display';
        timerDiv.innerHTML = '<span class="timer-bubble">⏱ 00:00</span>';
        
        // 创建AI气泡
        const aiBubble = document.createElement('div');
        aiBubble.className = 'chat-bubble ai';
        aiBubble.textContent = currentStep === 0 ? `准备好了吗？我们开始制作${currentDish.name}...` : `第${currentStep + 1}步：${steps[currentStep]}`;
        
        chatArea.appendChild(timerDiv);
        chatArea.appendChild(aiBubble);

        // 开始计时（从第二步开始）
        if (currentStep > 0 && currentStep <= steps.length) {
          const duration = stepDurations[Math.min(currentStep - 1, stepDurations.length - 1)];
          startTimer(duration, timerDiv);
        }

        chatArea.scrollTop = chatArea.scrollHeight;
        currentStep++;
        btn.textContent = currentStep >= steps.length ? '完成' : '下一步';
      } else {
        endTeaching();
        document.getElementById('completionModal').classList.add('show');
      }
    }

    function startTimer(duration, timerDiv) {
      remainingTime = duration;
      updateTimerDisplay(timerDiv);
      
      timerInterval = setInterval(() => {
        remainingTime--;
        updateTimerDisplay(timerDiv);
        
        if (remainingTime <= 0) {
          clearInterval(timerInterval);
          document.getElementById('timeoutModal').classList.add('show');
        }
      }, 1000);
    }

    function updateTimerDisplay(timerDiv) {
      const minutes = Math.floor(remainingTime / 60);
      const seconds = remainingTime % 60;
      const timeStr = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      
      const timerBubble = timerDiv.querySelector('.timer-bubble');
      timerBubble.textContent = `⏱ ${timeStr}`;
      
      // 最后5秒变红闪烁
      if (remainingTime <= 5) {
        timerBubble.classList.add('timer-warning');
      }
    }

    function continueTeaching() {
      // 关闭超时弹窗后继续下一步
      nextTeachingStep();
    }

    function endTeaching() {
      clearInterval(timerInterval);
      document.getElementById('teachingPage').classList.remove('show');
      currentStep = 0;
    }

    // AI Recommendation
    function recommendFromCard() {
      const input = document.getElementById('aiCardInput');
      const keyword = input.value.trim();
      if (!keyword) return;

      const resultDiv = document.getElementById('aiRecommendResult');
      const matchedRecipes = matchRecipes(keyword);

      if (matchedRecipes.length > 0) {
        resultDiv.innerHTML = `
          <div class="ai-recommend-list">
            ${matchedRecipes.map(r => 
              `<div class="ai-recommend-item" onclick="showRecipeDetail('${r.name}')">${r.emoji} ${r.name}</div>`
            ).join('')}
          </div>
        `;
      } else {
        resultDiv.innerHTML = `<div class="ai-no-result">暂时没有找到相关菜品，试试其他食材吧~</div>`;
      }

      resultDiv.classList.add('show');
      input.value = '';
    }

    function matchRecipes(keyword) {
      // 预设关键词映射
      const keywordMap = {
        '鸡蛋': ['蛋', '鸡'],
        '蛋': ['蛋'],
        '土豆': ['土豆'],
        '牛肉': ['牛肉', '牛'],
        '牛': ['牛肉', '牛'],
        '猪肉': ['肉'],
        '肉': ['肉'],
        '鸡': ['鸡'],
        '鱼': ['鱼'],
        '豆腐': ['豆腐'],
        '排骨': ['排骨'],
        '青菜': ['生菜', '西兰花', '花菜'],
        '茄子': ['茄子'],
        '黄瓜': ['黄瓜'],
        '西红柿': ['西红柿'],
        '辣椒': ['辣椒', '辣']
      };

      // 获取匹配关键词
      let searchTerms = keywordMap[keyword] || [keyword];
      
      // 匹配菜品
      const matched = recipes.filter(r => {
        return searchTerms.some(term => 
          r.name.includes(term) || 
          r.main.includes(term)
        );
      });

      return matched.slice(0, 5); // 返回最多5个推荐
    }

    // Initialize
    renderRecipes();
    renderCuisineDishes('all');
  </script>
</body>
