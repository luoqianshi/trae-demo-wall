        if (task.assignee && !project.members.some(m => m.id === task.assignee)) return '负责人不存在';

    // ============ AI 分析引擎（零随机数，全部基于真实数据） ============
    // [P2 FIX] 分析结果缓存
    let _analysisCache = null, _analysisCacheKey = '';
    function invalidateAnalysis() { _analysisCache = null; _analysisCacheKey = ''; }
    function getCachedAnalysis(project) {
        const key = project.id + '_' + project.tasks.length + '_' + project.tasks.filter(t=>t.status==='done').length;
        if (_analysisCacheKey === key && _analysisCache) return _analysisCache;
        _analysisCache = analyzeContributions(project);
        _analysisCacheKey = key;
        return _analysisCache;
    }

    function analyzeContributions(project) {
        try {
            const dims = ['任务完成度','产出质量','进度推动','技术深度','文件贡献','协作配合'];
            const techTags = ['后端','前端','算法','核心','安全','数据库','设计','运维'];
            const results = {};

            project.members.forEach(m => {
                const mTasks = project.tasks.filter(t => t.assignee === m.id);
                const total = mTasks.length, done = mTasks.filter(t=>t.status==='done'), prog = mTasks.filter(t=>t.status==='progress');
                const doneN = done.length;
                const highP = mTasks.filter(t=>t.priority==='high'), highDone = highP.filter(t=>t.status==='done');
                const withResult = done.filter(t=>t.result && t.result.length >= 15);
                const resultLen = done.reduce((s,t)=>s+(t.result?.length||0),0);
                const onTime = done.filter(t=>t.deadline&&t.completedAt&&t.completedAt<=t.deadline).length;
                const overdue = mTasks.filter(t=>t.deadline&&t.status!=='done'&&t.deadline<today());
                const techN = mTasks.filter(t=>(t.tags||[]).some(tg=>techTags.includes(tg))).length;
                const tags = [...new Set(mTasks.flatMap(t=>t.tags||[]))];

                const completion = total > 0 ? Math.round(doneN/total*100) : 0;
                const quality = doneN > 0 ? Math.min(100, Math.round((withResult.length/doneN)*60 + Math.min(resultLen/Math.max(doneN,1)/30*40, 40))) : 0;
                const progress = doneN > 0 ? Math.min(100, Math.round(onTime/Math.max(doneN,1)*50 + highDone.length*8 + prog.length*5)) : (prog.length>0 ? 25 : 0);
                const depth = total > 0 ? Math.min(100, Math.round(techN/total*50 + highP.length/Math.max(total,1)*30 + Math.min(tags.length*5,20))) : 0;
                const avgLen = total > 0 ? resultLen/Math.max(total,1) : 0;
                const fileContrib = Math.min(100, Math.round(avgLen*1.2 + withResult.length*8));
                const overduePenalty = overdue.length * 15;
                const collab = Math.max(0, Math.min(100, 60 + (total >= 2 ? 20 : total*10) + (onTime === doneN && doneN>0 ? 20 : 0) - overduePenalty));

                const scores = { '任务完成度':completion, '产出质量':quality, '进度推动':progress,
                                 '技术深度':depth, '文件贡献':fileContrib, '协作配合':collab };
                const totalScore = Math.round(Object.values(scores).reduce((a,b)=>a+b,0)/6);

                results[m.id] = { ...m, tasksTotal:total, tasksDone:doneN, tasksProgress:prog.length,
                    tasksOverdue:overdue.length, scores, totalScore, contributionPercent:0,
                    highTasks:highP.length, tags };
            });

            const sum = Object.values(results).reduce((s,r)=>s+r.totalScore,0);
            Object.values(results).forEach(r => r.contributionPercent = sum>0 ? Math.round(r.totalScore/sum*100) : 0);

            Object.values(results).forEach(r => {
                const parts = [];
                if (r.tasksDone === 0 && r.tasksTotal > 0) {
                    r.comment = `目前分配了${r.tasksTotal}个任务但尚未完成，需要尽快推进，建议优先处理高优先级任务。`;
                    r.level = 'low'; return;
                }
                if (r.totalScore >= 75) {
                    parts.push(`完成了${r.tasksDone}个任务（共${r.tasksTotal}个）`);
                    if (r.scores['任务完成度'] >= 90) parts.push('完成度极高');
                    if (r.scores['产出质量'] >= 75) parts.push('成果描述详实，产出质量高');
                    if (r.highTasks >= 2) parts.push(`承担了${r.highTasks}个高优先级任务，是核心贡献者`);
                    if (r.tasksOverdue === 0 && r.tasksDone > 0) parts.push('所有任务按时交付');
                    r.comment = parts.join('，') + '。';
                    r.level = 'high';
                } else if (r.totalScore >= 50) {
                    parts.push(`已完成${r.tasksDone}/${r.tasksTotal}个任务`);
                    if (r.tasksProgress > 0) parts.push(`${r.tasksProgress}个进行中`);
                    if (r.tasksOverdue > 0) parts.push(`有${r.tasksOverdue}个任务逾期，需注意`);
                    if (r.scores['产出质量'] < 60) parts.push('成果描述可以更详细');
                    r.comment = parts.join('，') + '，继续加油。';
                    r.level = 'mid';
                } else {
                    parts.push(`仅完成${r.tasksDone}/${r.tasksTotal}个任务`);
                    if (r.tasksOverdue > 0) parts.push(`${r.tasksOverdue}个任务已逾期`);
                    if (r.highTasks > 0 && r.scores['技术深度'] < 50) parts.push('高优先级任务完成不足');
                    r.comment = parts.join('，') + '，建议加强时间管理，主动与团队沟通。';
                    r.level = 'low';
                }
            });

            const insights = generateInsights(project, results);

            // 近7天活跃度（基于真实完成时间）
            const timeline = {};
            const days = [];
            for (let i=6; i>=0; i--) { const d=new Date(); d.setDate(d.getDate()-i); days.push(d.toISOString().slice(0,10)); }
            project.members.forEach(m => {
                timeline[m.id] = days.map((d, idx) => {
                    const completed = project.tasks.filter(t=>t.assignee===m.id&&t.completedAt===d).length;
                    const created = project.tasks.filter(t=>t.assignee===m.id&&t.createdAt===d).length;
                    const recency = (idx + 1) / 7 * 15;
                    return Math.min(100, Math.round(recency + completed*40 + created*20 + 10));
                });
            });

            return { dimensions:dims, members:results, insights, timelineData:timeline, days };
        } catch(e) {
            console.error('analyzeContributions error:', e);
            return { dimensions:[], members:{}, insights:[{type:'bad',icon:I.alert,text:'分析引擎出错'}], timelineData:{}, days:[] };
        }
    }

    function generateInsights(project, results) {
        const insights = [];
        const members = Object.values(results);
        const sorted = [...members].sort((a,b)=>b.totalScore-a.totalScore);
        const total = project.tasks.length, done = project.tasks.filter(t=>t.status==='done').length;
        const overdue = project.tasks.filter(t=>t.deadline&&t.status!=='done'&&t.deadline<today());
        const highProg = project.tasks.filter(t=>t.priority==='high'&&t.status==='progress');
        const highTodo = project.tasks.filter(t=>t.priority==='high'&&t.status==='todo');

        const avg = members.length > 0 ? members.reduce((s,m)=>s+m.tasksTotal,0)/members.length : 0;
        const overloaded = members.filter(m=>m.tasksTotal > avg*1.25);
        const underloaded = members.filter(m=>m.tasksTotal < avg*0.7 && m.tasksTotal >= 0);

        if (overloaded.length > 0 && underloaded.length > 0) {
            insights.push({ type:'warn', icon:I.alert, text:`工作量不均衡：${overloaded.map(m=>m.name).join('、')} 承担了${overloaded[0].tasksTotal}个任务，而${underloaded.map(m=>m.name).join('、')}只有${underloaded[0].tasksTotal}个，建议重新分配。` });
        } else if (overloaded.length > 0) {
            insights.push({ type:'warn', icon:I.alert, text:`${overloaded.map(m=>m.name).join('、')} 承担任务较多（${overloaded[0].tasksTotal}个），注意不要过度劳累。` });
        }
        if (overdue.length > 0) {
            const names = [...new Set(overdue.map(t=>{const m=project.members.find(x=>x.id===t.assignee);return m?.name;}))].filter(Boolean);
            insights.push({ type:'bad', icon:I.alert, text:`有 ${overdue.length} 个任务已逾期，涉及 ${names.join('、')}，需要立即跟进。` });
        }
        if (highProg.length >= 1) {
            insights.push({ type:'info', icon:I.zap, text:`当前有 ${highProg.length} 个高优先级任务进行中，请重点关注进度。` });
        }
        if (highTodo.length > 0) {
            insights.push({ type:'info', icon:I.target, text:`还有 ${highTodo.length} 个高优先级任务未开始，建议尽快启动。` });
        }
        const daysLeft = project.deadline ? daysBetween(today(), project.deadline) : null;
        const progressPct = total>0 ? Math.round(done/total*100) : 0;
        if (daysLeft !== null) {
            if (daysLeft < 0) insights.push({type:'bad', icon:I.alert, text:`项目已过截止日期${-daysLeft}天！`});
            else if (daysLeft <= 3 && progressPct < 90) insights.push({type:'bad', icon:I.alert, text:`距截止仅剩${daysLeft}天，进度${progressPct}%，有延期风险！`});
            else if (daysLeft <= 7 && progressPct < 75) insights.push({type:'warn', icon:I.alert, text:`距截止${daysLeft}天，进度${progressPct}%，需要加快节奏。`});
            else if (progressPct >= 80) insights.push({type:'good', icon:I.check, text:`项目进度良好（${progressPct}%），继续保持！`});
        }
        if (sorted[0] && sorted[0].contributionPercent >= 28) {
            insights.push({ type:'good', icon:I.sparkles, text:`${sorted[0].name} 是当前核心贡献者（贡献占比${sorted[0].contributionPercent}%），承担了主要工作。` });
        }
        if (progressPct === 100) insights.push({type:'good', icon:I.check, text:'所有任务已完成，可以准备交付！'});
        if (insights.length === 0) insights.push({type:'good', icon:I.check, text:'团队协作状态良好，继续保持。'});
        return insights;
    }

    function doCreate() {
        const name = $('pName')?.value?.trim() || createForm.name;

        if (!name) { toast('请输入项目名称','error'); return; }
        const valid = createForm.members.filter(m=>m.name.trim());
        if (valid.length<1) { toast('请至少添加一名成员','error'); return; }

        const members = valid.map((m,i)=>({ id:'m'+i, name:m.name.trim(), role:m.role.trim()||'成员', color:COLORS[i%COLORS.length] }));
        const project = { id:'p_'+uuid(), name, description:desc||'暂无描述', deadline:deadline||'', members, tasks:[], createdAt:today(), isDemo:false };

        const project = getProject();
        if (!project) { toast('项目不存在，已返回首页','warn'); setTimeout(()=>navigate('home'),100); return ''; }

        let tasks = project.tasks;
        if (searchQuery) {
            const q = searchQuery.toLowerCase();
            tasks = tasks.filter(t => t.title.toLowerCase().includes(q) || (t.description||'').toLowerCase().includes(q) || (t.tags||[]).some(tg=>tg.toLowerCase().includes(q)));
        }
        if (filterMember) tasks = tasks.filter(t => t.assignee === filterMember);

        const todo = tasks.filter(t=>t.status==='todo');
        const prog = tasks.filter(t=>t.status==='progress');
        const done = tasks.filter(t=>t.status==='done');
        const getMem = id => project.members.find(m=>m.id===id);
        const dn=project.tasks.filter(t=>t.status==='done').length, tot=project.tasks.length;
        const pct = tot>0?Math.round(dn/tot*100):0;
        const overdue = project.tasks.filter(t=>t.deadline&&t.status!=='done'&&t.deadline<today()).length;

        return `
        <div class="animate-fade-in">
            ${renderHeader(project, 'kanban')}

            <div class="max-w-7xl mx-auto px-4 sm:px-6 py-6">
                <div class="mb-5">
                    <h1 class="text-xl sm:text-2xl font-bold mb-1">${esc(project.name)}</h1>
                    <p class="text-muted dark:text-slate-400 text-sm mb-3">${esc(project.description)}</p>
                    <div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-sm">
                        <span class="flex items-center gap-1 text-muted dark:text-slate-400">${I.calendar} ${project.deadline||'无截止日期'}</span>
                        <span class="flex items-center gap-1"><span class="w-2 h-2 bg-green-500 rounded-full"></span>完成 ${dn}/${tot}（${pct}%）</span>
                        ${overdue>0?`<span class="flex items-center gap-1 text-red-500 font-medium">${I.alert} ${overdue}个逾期</span>`:''}
                        ${project.aiCategory?`<span class="text-xs bg-brand-50 dark:bg-brand-900/30 text-brand-700 dark:text-brand-300 px-2.5 py-1 rounded-full font-semibold">${I.sparkles} ${esc(project.aiCategory)}</span>`:''}
                    </div>
                </div>

                <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 sm:p-5 shadow-soft mb-5 no-print">
                    <div class="flex flex-col sm:flex-row sm:items-center gap-4">
                        <div class="flex-1">
                            <div class="flex items-center justify-between mb-2"><span class="text-sm font-semibold">整体进度</span><span class="text-sm font-bold text-brand-600 dark:text-brand-400">${pct}%</span></div>
                            <div class="h-2.5 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden"><div class="h-full bg-gradient-brand rounded-full transition-all duration-700" style="width:${pct}%"></div></div>
                            <div class="flex justify-between mt-2 text-xs text-muted dark:text-slate-400"><span>待办 ${todo.length}</span><span>进行中 ${prog.length}</span><span>已完成 ${done.length}</span></div>
                        </div>
                        <div class="flex items-center gap-2 flex-wrap border-t sm:border-t-0 sm:border-l border-slate-100 dark:border-slate-700 sm:pl-4 pt-3 sm:pt-0" id="memberFilters">
                            ${project.members.map(m=>{
                                const mc=project.tasks.filter(t=>t.assignee===m.id).length;
                                return `<button data-mem-filter="${m.id}" onclick="onFilterMember('${m.id}')" class="flex items-center gap-1.5 rounded-full pl-1 pr-3 py-1 transition-all ${filterMember===m.id?'bg-brand-50 dark:bg-brand-900/30 ring-2 ring-brand-500':'bg-slate-50 dark:bg-slate-700 hover:bg-slate-100 dark:hover:bg-slate-600'}">
                                    <div class="w-6 h-6 rounded-full flex items-center justify-center text-white text-xs font-bold" style="background:${m.color}">${avatar(m.name)}</div>
                                    <span class="text-xs font-medium">${esc(m.name)}</span>
                                    <span class="text-xs text-muted dark:text-slate-400">${mc}</span>
                                </button>`;
                            }).join('')}
                            ${filterMember?`<button onclick="onFilterMember('')" class="text-xs text-brand-600 dark:text-brand-400 font-semibold px-2">清除筛选</button>`:''}
                        </div>
                    </div>
                </div>

                <div class="flex gap-3 mb-5 no-print">
                    <div class="relative flex-1">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-muted dark:text-slate-400">${I.search}</span>
                        <input type="text" id="searchInput" value="${esc(searchQuery)}" placeholder="搜索任务标题、描述、标签... (按 / 快捷搜索)" oninput="onSearchInput(this.value)" class="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all">
                    </div>
                </div>

                ${tot===0?`
                <div class="bg-gradient-to-r from-brand-50 to-accent/10 dark:from-brand-900/20 dark:to-accent/10 rounded-2xl p-8 text-center border border-brand-100 dark:border-brand-800">
                    <div class="w-16 h-16 bg-white dark:bg-slate-800 rounded-2xl flex items-center justify-center text-brand-600 dark:text-brand-400 mx-auto mb-4 shadow-sm">${I.sparkles}</div>
                    <h3 class="text-lg font-bold mb-2">项目还没有任务</h3>
                    <p class="text-muted dark:text-slate-400 text-sm mb-5">让AI帮你智能拆解任务，或者手动添加</p>
                    <div class="flex flex-col sm:flex-row gap-3 justify-center">
                        <button onclick="aiBreakdownNow()" class="bg-gradient-brand text-white px-6 py-3 rounded-xl font-semibold hover:opacity-90 flex items-center justify-center gap-2">${I.zap} 一键AI拆题</button>
                        <button onclick="toggleAdd()" class="border border-slate-200 dark:border-slate-600 px-6 py-3 rounded-xl font-semibold hover:bg-slate-50 dark:hover:bg-slate-700">手动添加任务</button>
                    </div>
                </div>`:''}

                ${showAddTask?`
                <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-soft mb-5 animate-slide-down no-print">
                    <h3 class="font-bold mb-4 flex items-center gap-2">${I.plus} 添加新任务</h3>
                    <div class="grid sm:grid-cols-2 gap-3">
                        <div class="sm:col-span-2"><label class="text-xs font-semibold text-muted dark:text-slate-400 mb-1 block">任务名称 *</label><input type="text" id="ntTitle" placeholder="任务名称" class="w-full px-3 py-2.5 border border-slate-200 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500"></div>
                        <div><label class="text-xs font-semibold text-muted dark:text-slate-400 mb-1 block">负责人</label><select id="ntAssignee" class="w-full px-3 py-2.5 border border-slate-200 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-200 rounded-xl text-sm bg-white focus:ring-2 focus:ring-brand-500 focus:border-brand-500">${project.members.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></div>
                        <div><label class="text-xs font-semibold text-muted dark:text-slate-400 mb-1 block">优先级</label><select id="ntPriority" class="w-full px-3 py-2.5 border border-slate-200 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-200 rounded-xl text-sm bg-white focus:ring-2 focus:ring-brand-500 focus:border-brand-500"><option value="high">高</option><option value="med" selected>中</option><option value="low">低</option></select></div>
                        <div><label class="text-xs font-semibold text-muted dark:text-slate-400 mb-1 block">截止日期</label><input type="date" id="ntDeadline" class="w-full px-3 py-2.5 border border-slate-200 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500"></div>
                        <div><label class="text-xs font-semibold text-muted dark:text-slate-400 mb-1 block">标签（逗号分隔）</label><input type="text" id="ntTags" placeholder="后端, 核心" class="w-full px-3 py-2.5 border border-slate-200 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500"></div>
                        <div class="sm:col-span-2"><label class="text-xs font-semibold text-muted dark:text-slate-400 mb-1 block">任务描述</label><textarea id="ntDesc" rows="2" placeholder="描述任务内容..." class="w-full px-3 py-2.5 border border-slate-200 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-200 rounded-xl text-sm resize-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500"></textarea></div>
                    </div>
                    <div class="flex gap-3 mt-4 justify-end">
                        <button onclick="toggleAdd()" class="px-5 py-2.5 text-muted dark:text-slate-400 font-medium text-sm">取消</button>
                        <button onclick="doAddTask()" class="px-5 py-2.5 bg-gradient-brand text-white rounded-xl font-semibold text-sm hover:opacity-90">添加</button>
                    </div>
                </div>`:''}

                <div class="grid md:grid-cols-3 gap-4 lg:gap-5" id="kanbanCols">
                    ${renderCol('todo','待办',todo,project,'#94a3b8')}
                    ${renderCol('progress','进行中',prog,project,'#f59e0b')}
                    ${renderCol('done','已完成',done,project,'#10b981')}
                </div>
            </div>

            ${editingTask?renderTaskModal(project):''}

            <div id="completeModal" class="hidden fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4">
                <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 w-full max-w-md animate-scale-in">
                    <h3 class="text-lg font-bold mb-2">标记任务完成</h3>
                    <p class="text-muted dark:text-slate-400 text-sm mb-4">描述一下完成的成果（越详细，贡献分析越准确）：</p>
                    <textarea id="resultInput" rows="4" placeholder="例如：完成JWT认证模块，包含登录/注册/权限校验..." class="w-full px-4 py-3 border border-slate-200 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-200 rounded-xl text-sm resize-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500"></textarea>
                    <div class="flex gap-3 mt-4 justify-end">
                        <button onclick="closeComp()" class="px-5 py-2.5 text-muted dark:text-slate-400 font-medium text-sm">取消</button>
                        <button onclick="confirmComp()" class="px-5 py-2.5 bg-green-500 text-white rounded-xl font-semibold text-sm hover:bg-green-600">确认完成</button>
                    </div>
                </div>
            </div>
        </div>`;
    }

    function renderCol(status,title,tasks,project,color) {
        const pLabel={high:'高',med:'中',low:'低'},pClass={high:'priority-high',med:'priority-med',low:'priority-low'};
        const getMem=id=>project.members.find(m=>m.id===id);
        return`
        <div class="bg-slate-100/80 dark:bg-slate-800/50 rounded-2xl p-4 drop-zone" data-status="${status}" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event,'${status}')">
            <div class="flex items-center justify-between mb-4 px-1">
                <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full" style="background:${color}"></div><h3 class="font-bold">${title}</h3><span class="text-xs bg-white dark:bg-slate-700 px-2 py-0.5 rounded-full text-muted dark:text-slate-400 font-semibold">${tasks.length}</span></div>
                ${status==='todo'?`<button onclick="toggleAdd()" class="p-1.5 text-muted dark:text-slate-400 hover:text-brand-600 hover:bg-white dark:hover:bg-slate-700 rounded-lg transition-colors">${I.plus}</button>`:''}
            </div>
            <div class="space-y-3 max-h-[calc(100vh-340px)] min-h-[100px] overflow-y-auto pr-1 relative">
                <div class="drop-hint hidden absolute inset-0 border-2 border-dashed border-brand-400 rounded-xl bg-brand-50/50 dark:bg-brand-900/20 items-center justify-center text-brand-600 dark:text-brand-300 font-semibold text-sm z-10 pointer-events-none">放置到这里</div>
                ${tasks.map(task=>{
                    const m=getMem(task.assignee);
                    const od=task.deadline&&task.status!=='done'&&task.deadline<today();
                    return`
                    <div class="task-card bg-white dark:bg-slate-800 rounded-xl p-4 shadow-sm hover:shadow-md border border-transparent hover:border-brand-200 dark:hover:border-brand-500 ${task.status==='done'?'opacity-75':''}"
                         draggable="true" data-tid="${task.id}"
                         ondragstart="dragStart(event,'${task.id}')" ondragend="dragEnd(event)"
                         onclick="openTask('${task.id}')">
                        <div class="flex items-start justify-between gap-2 mb-2">
                            <h4 class="font-semibold text-sm leading-snug flex-1 ${task.status==='done'?'line-through text-slate-400 dark:text-slate-500':''}">${esc(task.title)}</h4>
                            <span class="text-[10px] px-2 py-0.5 rounded-full font-bold flex-shrink-0 ${pClass[task.priority]}">${pLabel[task.priority]}</span>
                        </div>
                        ${task.description&&task.status!=='done'?`<p class="text-xs text-muted dark:text-slate-400 mb-2 line-clamp-2">${esc(task.description)}</p>`:''}
                        ${task.result?`<p class="text-xs text-slate-600 dark:text-slate-300 bg-green-50 dark:bg-green-900/20 p-2 rounded-lg mb-2 line-clamp-2">${esc(task.result)}</p>`:''}
                        ${task.tags&&task.tags.length?`<div class="flex flex-wrap gap-1 mb-2">${task.tags.slice(0,3).map(tg=>`<span class="tag-chip">${esc(tg)}</span>`).join('')}</div>`:''}
                        <div class="flex items-center justify-between">
                            ${m?`<div class="flex items-center gap-1.5"><div class="w-6 h-6 rounded-full flex items-center justify-center text-white text-[10px] font-bold" style="background:${m.color}">${avatar(m.name)}</div><span class="text-xs text-muted dark:text-slate-400 font-medium">${esc(m.name)}</span></div>`:'<div></div>'}
                            ${task.deadline?`<div class="flex items-center gap-1 text-xs ${od?'text-red-500 font-bold':'text-muted dark:text-slate-400'}">${I.clock}${task.deadline.slice(5)}</div>`:''}
                        </div>
                    </div>`;
                }).join('')}
                ${tasks.length===0?`<div class="text-center py-10 text-xs text-slate-400 dark:text-slate-500"><div class="w-10 h-10 mx-auto mb-2 bg-white dark:bg-slate-700 rounded-full flex items-center justify-center opacity-60">${I.check}</div>暂无任务</div>`:''}
            </div>
        </div>`;
    }

    // [P0 FIX] 局部更新看板列 —— 搜索/筛选时不触发全量 render，保持搜索框焦点
    function updateKanbanView() {
        const project = getProject();
        if (!project) return;
        let tasks = project.tasks;
        if (searchQuery) {
            const q = searchQuery.toLowerCase();
            tasks = tasks.filter(t => t.title.toLowerCase().includes(q) || (t.description||'').toLowerCase().includes(q) || (t.tags||[]).some(tg=>tg.toLowerCase().includes(q)));
        }
        if (filterMember) tasks = tasks.filter(t => t.assignee === filterMember);

        const todo = tasks.filter(t=>t.status==='todo');
        const prog = tasks.filter(t=>t.status==='progress');
        const done = tasks.filter(t=>t.status==='done');

        const cols = $('kanbanCols');
        if (cols) {
            cols.innerHTML =
                renderCol('todo','待办',todo,project,'#94a3b8') +
                renderCol('progress','进行中',prog,project,'#f59e0b') +
                renderCol('done','已完成',done,project,'#10b981');
        }
    }

    // [P0 FIX] 搜索输入只触发局部更新，不丢失焦点
    function onSearchInput(val) {
        searchQuery = val;
        updateKanbanView();
    }

    // [P0 FIX] 成员筛选也只触发局部更新
    function onFilterMember(id) {
        filterMember = filterMember === id ? '' : id;
        document.querySelectorAll('[data-mem-filter]').forEach(btn => {
            const isActive = btn.dataset.memFilter === filterMember;
            btn.classList.toggle('bg-brand-50', isActive);
            btn.classList.toggle('dark:bg-brand-900', isActive);
            btn.classList.toggle('ring-2', isActive);
            btn.classList.toggle('ring-brand-500', isActive);
            btn.classList.toggle('bg-slate-50', !isActive);
            btn.classList.toggle('dark:bg-slate-700', !isActive);
            btn.classList.toggle('hover:bg-slate-100', !isActive);
        });
        updateKanbanView();
    }

    // 拖拽
    function dragStart(e,tid){dragId=tid;e.target.classList.add('dragging');e.dataTransfer.effectAllowed='move';}
    function dragEnd(e){dragId=null;e.target.classList.remove('dragging');document.querySelectorAll('.drop-zone').forEach(z=>z.classList.remove('drag-over'));}
    function dragOver(e){e.preventDefault();e.currentTarget.classList.add('drag-over');}
    function dragLeave(e){e.currentTarget.classList.remove('drag-over');}
    function drop(e,ns){
        e.preventDefault();e.currentTarget.classList.remove('drag-over');
        if(!dragId)return;
        const p=getProject(),t=p.tasks.find(x=>x.id===dragId);if(!t)return;
        if(ns==='done'&&t.status!=='done'){completingId=dragId;$('completeModal').classList.remove('hidden');$('completeModal').classList.add('flex');setTimeout(()=>$('resultInput')?.focus(),100);return;}
        t.status=ns;if(ns!=='done'){t.result='';t.completedAt=null;}else{t.completedAt=today();}
        saveProject(p);toast(ns==='todo'?'移至待办':ns==='progress'?'任务已开始':'任务已完成','success');render();
    }

    function toggleAdd(){showAddTask=!showAddTask;render();if(showAddTask)setTimeout(()=>$('ntTitle')?.focus(),100);}
    function doAddTask(){
        const p=getProject();
        const title=$('ntTitle')?.value?.trim();if(!title){toast('请输入任务名称','error');return;}
        const assignee=$('ntAssignee')?.value||p.members[0]?.id;
        const priority=$('ntPriority')?.value||'med';
        const deadline=$('ntDeadline')?.value||'';
        const tagsStr=$('ntTags')?.value?.trim()||'';
        const desc=$('ntDesc')?.value?.trim()||'';
        const tags=tagsStr?tagsStr.split(/[,，]/).map(s=>s.trim()).filter(Boolean):[];
        const newTask={id:'t_'+uuid(),title,assignee,status:'todo',priority,tags,description:desc,result:'',deadline,completedAt:null,createdAt:today()};
        // [P2 FIX] 数据校验
        const err = validateTask(newTask, p);
        if (err) { toast(err, 'error'); return; }
        p.tasks.push(newTask);
        saveProject(p);showAddTask=false;toast('任务已添加','success');render();
    }
    function aiBreakdownNow(){
        const p=getProject();
        if(!p.members||p.members.length===0){toast('请先添加成员','error');return;}
        const r=aiBreakdown(p.name,p.description,p.members);
        p.tasks.push(...r.tasks);p.aiCategory=r.category;saveProject(p);
        toast(`AI生成了${r.tasks.length}个新任务`,'success');render();
    }

    // 任务编辑弹窗
    function openTask(tid){editingTask=tid;render();setTimeout(()=>$('etTitle')?.focus(),100);}
    function closeTask(){editingTask=null;render();}

    function renderTaskModal(project){
        const t=project.tasks.find(x=>x.id===editingTask);if(!t)return'';
        return`
        <div class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4 no-print" onclick="if(event.target===this)closeTask()">
            <div class="bg-white dark:bg-slate-800 rounded-3xl w-full max-w-lg max-h-[90vh] overflow-y-auto animate-scale-in">
                <div class="sticky top-0 bg-white dark:bg-slate-800 border-b border-slate-100 dark:border-slate-700 px-6 py-4 flex items-center justify-between z-10">
                    <h3 class="font-bold text-lg">编辑任务</h3>
                    <button onclick="closeTask()" class="p-2 text-muted dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl transition-colors">${I.close}</button>
                </div>
                <div class="p-6 space-y-4">
                    <div><label class="text-xs font-semibold text-muted dark:text-slate-400 mb-1 block">任务名称</label><input id="etTitle" type="text" value="${esc(t.title)}" class="w-full px-3 py-2.5 border border-slate-200 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500"></div>
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="text-xs font-semibold text-muted dark:text-slate-400 mb-1 block">负责人</label><select id="etAssignee" class="w-full px-3 py-2.5 border border-slate-200 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-200 rounded-xl text-sm bg-white focus:ring-2 focus:ring-brand-500">${project.members.map(mm=>`<option value="${mm.id}"${mm.id===t.assignee?' selected':''}>${esc(mm.name)}</option>`).join('')}</select></div>
                        <div><label class="text-xs font-semibold text-muted dark:text-slate-400 mb-1 block">优先级</label><select id="etPriority" class="w-full px-3 py-2.5 border border-slate-200 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-200 rounded-xl text-sm bg-white focus:ring-2 focus:ring-brand-500"><option value="high"${t.priority==='high'?' selected':''}>高</option><option value="med"${t.priority==='med'?' selected':''}>中</option><option value="low"${t.priority==='low'?' selected':''}>低</option></select></div>
                        <div><label class="text-xs font-semibold text-muted dark:text-slate-400 mb-1 block">截止日期</label><input id="etDeadline" type="date" value="${t.deadline||''}" class="w-full px-3 py-2.5 border border-slate-200 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500"></div>
                        <div><label class="text-xs font-semibold text-muted dark:text-slate-400 mb-1 block">状态</label><select id="etStatus" class="w-full px-3 py-2.5 border border-slate-200 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-200 rounded-xl text-sm bg-white focus:ring-2 focus:ring-brand-500"><option value="todo"${t.status==='todo'?' selected':''}>待办</option><option value="progress"${t.status==='progress'?' selected':''}>进行中</option><option value="done"${t.status==='done'?' selected':''}>已完成</option></select></div>
                    </div>
                    <div><label class="text-xs font-semibold text-muted dark:text-slate-400 mb-1 block">标签（逗号分隔）</label><input id="etTags" type="text" value="${esc((t.tags||[]).join(', '))}" class="w-full px-3 py-2.5 border border-slate-200 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500"></div>
                    <div><label class="text-xs font-semibold text-muted dark:text-slate-400 mb-1 block">任务描述</label><textarea id="etDesc" rows="3" class="w-full px-3 py-2.5 border border-slate-200 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-200 rounded-xl text-sm resize-none focus:ring-2 focus:ring-brand-500">${esc(t.description||'')}</textarea></div>

    function saveTask(){
        const p=getProject(),t=p.tasks.find(x=>x.id===editingTask);if(!t)return;
        const newTitle=$('etTitle')?.value?.trim()||t.title;
        const newAssignee=$('etAssignee')?.value||t.assignee;
        const newPriority=$('etPriority')?.value||t.priority;
        const newDeadline=$('etDeadline')?.value||'';
        const newStatus=$('etStatus')?.value;
        // [P2 FIX] 数据校验
        const err = validateTask({title:newTitle, assignee:newAssignee, deadline:newDeadline, createdAt:t.createdAt}, p);
        if (err) { toast(err, 'error'); return; }
        t.title=newTitle; t.assignee=newAssignee; t.priority=newPriority; t.deadline=newDeadline;
        if(newStatus==='done'&&t.status!=='done'){t.completedAt=today();}
        else if(newStatus!=='done'){t.completedAt=null;}
        t.status=newStatus;
        const ts=$('etTags')?.value||'';t.tags=ts?ts.split(/[,，]/).map(s=>s.trim()).filter(Boolean):[];
        t.description=$('etDesc')?.value?.trim()||'';
        if($('etResult'))t.result=$('etResult')?.value?.trim()||t.result;
        saveProject(p);toast('任务已更新','success');closeTask();
    }
    function delTask(){
        if(!confirm('确定删除这个任务？'))return;
        const p=getProject();p.tasks=p.tasks.filter(x=>x.id!==editingTask);saveProject(p);
        toast('任务已删除','success');closeTask();
    }

    function closeComp(){completingId=null;const m=$('completeModal');if(m){m.classList.add('hidden');m.classList.remove('flex');}if($('resultInput'))$('resultInput').value='';}
    function confirmComp(){
        if(!completingId)return;const p=getProject(),t=p.tasks.find(x=>x.id===completingId);
        if(t){t.status='done';t.result=$('resultInput')?.value?.trim()||'任务已完成';t.completedAt=today();saveProject(p);toast('任务已完成！','success');}
        closeComp();render();
    }

    // [P2 FIX] 图表复用：已存在则 update，不存在才创建
    function initCharts(a){
        const isDark=document.documentElement.classList.contains('dark');
        const ms=Object.values(a.members),colors=ms.map(m=>m.color),bgs=ms.map(m=>m.color+'99');
        const chartFont={family:"Inter,PingFang SC,sans-serif",size:11};
        const gridColor=isDark?'#334155':'#e2e8f0';
        const gridLight=isDark?'#1e293b':'#f1f5f9';
        const textColor=isDark?'#94a3b8':'#64748b';

        Chart.defaults.font=chartFont;
        Chart.defaults.color=textColor;
        Chart.defaults.plugins.tooltip.backgroundColor=isDark?'rgba(30,41,59,0.95)':'rgba(15,23,42,0.92)';
        Chart.defaults.plugins.tooltip.padding=12;
        Chart.defaults.plugins.tooltip.cornerRadius=10;
        Chart.defaults.plugins.tooltip.titleFont={weight:'600',size:12};

        // Pie Chart
        const pie=$('pieChart');
        if(pie){
            if(charts.pie){
                charts.pie.data.labels=ms.map(m=>m.name);
                charts.pie.data.datasets[0].data=ms.map(m=>m.contributionPercent);
                charts.pie.data.datasets[0].backgroundColor=bgs;
                charts.pie.data.datasets[0].borderColor=colors;
                charts.pie.update();
            } else {
                charts.pie=new Chart(pie,{type:'doughnut',data:{labels:ms.map(m=>m.name),datasets:[{data:ms.map(m=>m.contributionPercent),backgroundColor:bgs,borderColor:colors,borderWidth:2,hoverOffset:8}]},options:{responsive:true,maintainAspectRatio:false,cutout:'65%',plugins:{legend:{position:'bottom',labels:{padding:16,usePointStyle:true,pointStyle:'circle',font:chartFont}},tooltip:{callbacks:{label:c=>` ${c.label}: ${c.raw}%`}}}}});
            }
        }
        // Radar Chart
        const radar=$('radarChart');
        if(radar){
            if(charts.radar){
                charts.radar.data.labels=a.dimensions;
                charts.radar.data.datasets=ms.map(m=>({label:m.name,data:a.dimensions.map(d=>m.scores[d]),borderColor:m.color,backgroundColor:m.color+'18',borderWidth:2,pointBackgroundColor:m.color,pointRadius:3,pointHoverRadius:5}));
                charts.radar.update();
            } else {
                charts.radar=new Chart(radar,{type:'radar',data:{labels:a.dimensions,datasets:ms.map(m=>({label:m.name,data:a.dimensions.map(d=>m.scores[d]),borderColor:m.color,backgroundColor:m.color+'18',borderWidth:2,pointBackgroundColor:m.color,pointRadius:3,pointHoverRadius:5}))},options:{responsive:true,maintainAspectRatio:false,scales:{r:{beginAtZero:true,max:100,ticks:{stepSize:20,font:chartFont,backdropColor:'transparent',color:textColor},pointLabels:{font:{...chartFont,size:12,weight:'500'},color:textColor},grid:{color:gridColor},angleLines:{color:gridColor}}},plugins:{legend:{position:'bottom',labels:{padding:16,usePointStyle:true,pointStyle:'circle',font:chartFont}}}}});
            }
        }
        // Timeline Chart
        const tl=$('tlChart');
        if(tl){
            if(charts.tl){
                charts.tl.data.labels=a.days.map(d=>d.slice(5));
                charts.tl.data.datasets=ms.map(m=>({label:m.name,data:a.timelineData[m.id],borderColor:m.color,backgroundColor:m.color+'12',tension:.4,fill:true,pointRadius:3,pointHoverRadius:5,borderWidth:2}));
                charts.tl.update();
            } else {
                charts.tl=new Chart(tl,{type:'line',data:{labels:a.days.map(d=>d.slice(5)),datasets:ms.map(m=>({label:m.name,data:a.timelineData[m.id],borderColor:m.color,backgroundColor:m.color+'12',tension:.4,fill:true,pointRadius:3,pointHoverRadius:5,borderWidth:2}))},options:{responsive:true,maintainAspectRatio:false,interaction:{intersect:false,mode:'index'},scales:{x:{grid:{display:false},ticks:{font:chartFont,color:textColor}},y:{beginAtZero:true,grid:{color:gridLight},ticks:{font:chartFont,color:textColor}}},plugins:{legend:{position:'bottom',labels:{padding:12,usePointStyle:true,pointStyle:'circle',font:chartFont}}}}});
            }
        }

        setTimeout(()=>{document.querySelectorAll('.num-counter').forEach(el=>{const t=parseInt(el.dataset.target);animateNumber(el,t,900);});},200);
    }

    // ============ 键盘快捷键 ============
    document.addEventListener('keydown', (e) => {
        if (['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) {
            if (e.key === 'Escape') {
                if (editingTask) closeTask();
                else if (showAddTask) toggleAdd();
                else closeComp();
            }
            return;
        }
        if (e.key === '/' && currentPage === 'kanban') { e.preventDefault(); $('searchInput')?.focus(); }
        if (e.key === 'n' && currentPage === 'kanban') { e.preventDefault(); toggleAdd(); }
        if (e.key === 'd') { e.preventDefault(); toggleDarkMode(); }
        if (e.key === 'Escape') {
            if (editingTask) closeTask();
            else if (showAddTask) toggleAdd();
            else closeComp();
        }
    });

    // 导入文件监听
    $('importInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) importData(file);
        e.target.value = '';
    });

    // ============ 主渲染 ============
    function render(){
        const app=$('app');let html='';
        switch(currentPage){
            case'home':html=renderHome();break;
            case'create':html=renderCreate();break;
            case'kanban':html=renderKanban();break;
            case'report':html=renderReport();break;
            default:html=renderHome();
        }
        app.innerHTML=html;
    }

    // ============ 初始化 ============
    initTheme();
    render();
    </script>
</body>
</html>
