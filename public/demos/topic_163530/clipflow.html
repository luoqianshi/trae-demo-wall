<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ClipFlow · 剪辑协作台</title>
<style>
/* ============ 主题变量 ============ */
:root {
  --bg-base: #0e0f13;
  --bg-surface: #15171d;
  --bg-elevated: #1c1f27;
  --bg-elevated-2: #232733;
  --bg-hover: #2b3040;
  --border: #2a2e3a;
  --border-strong: #3a3f4d;
  --text-primary: #f1f2f5;
  --text-secondary: #a8adb8;
  --text-muted: #6b7280;
  --accent: #f5a524;
  --accent-hover: #ffb838;
  --accent-soft: rgba(245, 165, 36, 0.12);
  --accent-contrast: #1a1206;
  --st-pending: #94a3b8;
  --st-progress: #3b82f6;
  --st-done: #10b981;
  --st-rework: #ef4444;
  --shadow-card: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.2);
  --shadow-card-hover: 0 2px 4px rgba(0,0,0,0.4), 0 12px 32px rgba(0,0,0,0.35);
  --shadow-glow: 0 0 0 1px rgba(245,165,36,0.4), 0 0 24px rgba(245,165,36,0.15);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg-base);
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font-family: inherit; cursor: pointer; }
.tnum { font-variant-numeric: tabular-nums; }
.font-display { letter-spacing: -0.02em; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg-elevated-2); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }

#app { height: 100vh; height: 100dvh; }
.page { display: none; height: 100%; flex-direction: column; }
.page.active { display: flex; }

/* ============ 通用按钮 ============ */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px; border-radius: 8px;
  font-size: 13px; font-weight: 500;
  border: 1px solid transparent;
  transition: all 0.15s; white-space: nowrap;
}
.btn-primary {
  background: var(--accent); color: var(--accent-contrast);
  font-weight: 600;
}
.btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
.btn-ghost {
  background: transparent; color: var(--text-secondary);
  border-color: var(--border);
}
.btn-ghost:hover { background: var(--bg-elevated); color: var(--text-primary); border-color: var(--border-strong); }
.icon-btn {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  background: transparent; border: 1px solid var(--border);
  border-radius: 8px; color: var(--text-secondary);
  transition: all 0.15s;
}
.icon-btn:hover { background: var(--bg-elevated); color: var(--text-primary); border-color: var(--border-strong); }

.chip {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10.5px; font-weight: 600;
  padding: 2px 8px; border-radius: 999px;
  letter-spacing: 0.02em;
}
.cf-status-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }

/* ============ 品牌标识 ============ */
.brand { display: flex; align-items: center; gap: 10px; color: var(--text-primary); }
.brand__mark { color: var(--accent); display: flex; }
.brand__mark svg { width: 28px; height: 28px; }
.brand__text { display: flex; flex-direction: column; line-height: 1; }
.brand__name { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; }
.brand__sub { font-size: 10px; color: var(--text-muted); margin-top: 3px; letter-spacing: 0.08em; }

/* ============ 工作台 Dashboard ============ */
.dashboard { background: var(--bg-base); overflow-y: auto; }
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: rgba(14,15,19,0.8); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.topbar__inner {
  max-width: 1240px; margin: 0 auto;
  height: 64px; padding: 0 32px;
  display: flex; align-items: center; gap: 24px;
}
.topbar__nav { flex: 1; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); }
.topbar__crumb { padding-left: 24px; border-left: 1px solid var(--border); margin-left: 12px; }
.main__inner { max-width: 1240px; margin: 0 auto; padding: 40px 32px 64px; }

.hero {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 48px; padding: 24px 0 48px;
  border-bottom: 1px solid var(--border); margin-bottom: 40px;
}
.hero__eyebrow {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--accent);
  background: var(--accent-soft); padding: 4px 10px;
  border-radius: 999px; margin: 0 0 18px; letter-spacing: 0.02em;
}
.hero__title { font-size: 44px; font-weight: 800; line-height: 1.1; letter-spacing: -0.03em; }
.hero__accent { color: var(--accent); }
.hero__desc { font-size: 15px; color: var(--text-secondary); max-width: 520px; line-height: 1.65; margin: 18px 0 0; }
.hero__stats { display: flex; gap: 32px; flex-shrink: 0; }
.stat { text-align: right; }
.stat__num { font-size: 32px; font-weight: 700; line-height: 1; }
.stat--accent .stat__num { color: var(--accent); }
.stat__label { font-size: 11px; color: var(--text-muted); margin-top: 6px; letter-spacing: 0.04em; }

.grid-section__head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 20px; }
.grid-section__title { font-size: 18px; font-weight: 600; }
.grid-section__count { font-size: 13px; color: var(--text-muted); }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }

/* 项目卡片 */
.card {
  position: relative; background: var(--bg-elevated);
  border: 1px solid var(--border); border-radius: 14px;
  overflow: hidden; cursor: pointer;
  transition: transform 0.2s cubic-bezier(0.22,1,0.36,1), box-shadow 0.2s, border-color 0.2s;
}
.card:hover { transform: translateY(-3px); box-shadow: var(--shadow-card-hover); border-color: var(--accent-bar); }
.card--overdue { border-color: rgba(239,68,68,0.45); }
.card--overdue:hover { border-color: var(--st-rework); }
.card__bar { height: 3px; background: var(--accent-bar); }
.card__body { padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 10px; }
.card__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.card__title { font-size: 17px; font-weight: 700; line-height: 1.3; flex: 1; }
.card__badge { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 999px; flex-shrink: 0; margin-top: 2px; }
.card__badge--danger { background: rgba(239,68,68,0.14); color: var(--st-rework); }
.card__badge--done { background: rgba(16,185,129,0.14); color: var(--st-done); }
.card__client { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-secondary); }
.card__meta { display: flex; align-items: center; gap: 16px; font-size: 11.5px; color: var(--text-muted); }
.card__meta-item { display: flex; align-items: center; gap: 5px; }
.card__countdown { display: flex; align-items: center; gap: 5px; color: var(--text-secondary); }
.card__countdown.is-overdue { color: var(--st-rework); }
.card__progress { margin-top: 4px; padding-top: 10px; border-top: 1px solid var(--border); }
.card__footer { display: flex; align-items: center; justify-content: space-between; font-size: 11.5px; color: var(--text-muted); }
.card__count { display: flex; align-items: center; gap: 5px; }
.card__count-label { margin-left: 1px; }
.card__shared { display: flex; align-items: center; gap: 5px; color: var(--accent); }
.card__shared--muted { color: var(--text-muted); }

/* 进度条 */
.progress { display: flex; align-items: center; gap: 10px; }
.progress__track { flex: 1; height: 6px; background: var(--bg-elevated-2); border-radius: 3px; overflow: hidden; }
.progress--sm .progress__track { height: 4px; }
.progress__fill { height: 100%; border-radius: 3px; transition: width 0.5s cubic-bezier(0.22,1,0.36,1), background-color 0.3s; }
.progress__label { font-size: 12px; color: var(--text-secondary); flex-shrink: 0; min-width: 40px; text-align: right; }
.progress__empty { color: var(--text-muted); font-size: 11px; }

/* ============ 项目详情页 ============ */
.pd { background: var(--bg-base); overflow: hidden; }
.pd .topbar {
  position: static; background: var(--bg-surface);
  height: 64px; flex-shrink: 0;
  display: flex; align-items: center; gap: 20px; padding: 0 24px;
}
.pd__topbar-left { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; }
.pd__title { font-size: 17px; font-weight: 700; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pd__meta { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }
.pd__meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text-muted); margin: 0 4px; }
.pd__center { flex-shrink: 0; }
.countdown {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; background: var(--bg-elevated);
  border: 1px solid var(--border); border-radius: 999px;
  font-size: 12.5px; font-weight: 500; color: var(--text-secondary);
}
.countdown.is-overdue { border-color: rgba(239,68,68,0.4); background: rgba(239,68,68,0.08); color: var(--st-rework); }
.pd__right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.pd__progress { width: 140px; }

.pd__body { flex: 1; display: flex; min-height: 0; }
.pd__todo {
  width: 360px; flex-shrink: 0;
  display: flex; flex-direction: column;
  border-right: 1px solid var(--border);
  background: var(--bg-surface);
  transition: width 0.25s cubic-bezier(0.22,1,0.36,1), opacity 0.2s;
  overflow: hidden;
}
.pd__todo.is-collapsed { width: 0; opacity: 0; border-right: none; }
.pd__todo-head { padding: 14px 18px 6px; border-bottom: 1px solid var(--border); }
.pd__todo-title { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--text-secondary); letter-spacing: 0.02em; }

.pd__canvas { flex: 1; min-width: 0; position: relative; background: var(--bg-surface); }

/* 待办清单 */
.todo-list { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.todo-list__head { display: flex; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--border); align-items: center; }
.status-filter { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
.status-filter__btn {
  padding: 5px 10px; font-size: 11.5px; border-radius: 999px;
  background: transparent; color: var(--text-muted);
  border: 1px solid var(--border);
  transition: all 0.15s;
}
.status-filter__btn:hover { color: var(--text-secondary); border-color: var(--border-strong); }
.status-filter__btn.active { background: var(--accent-soft); color: var(--accent); border-color: rgba(245,165,36,0.3); }
.todo-list__add { flex-shrink: 0; padding: 7px 12px; font-size: 12.5px; }
.todo-list__scroll { flex: 1; overflow-y: auto; padding: 12px; }
.todo-list__items { display: flex; flex-direction: column; gap: 8px; }
.todo-list__empty { padding: 40px 20px; text-align: center; color: var(--text-muted); }
.todo-list__empty svg { opacity: 0.4; margin-bottom: 12px; }
.todo-list__empty h4 { font-size: 14px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500; }
.todo-list__empty p { font-size: 12px; }

/* 待办条目 */
.todo {
  display: flex; background: var(--bg-elevated);
  border: 1px solid var(--border); border-radius: 10px;
  overflow: hidden; transition: border-color 0.2s, box-shadow 0.3s;
}
.todo:hover { border-color: var(--border-strong); }
.todo--highlight { animation: highlight-pulse 1s ease-in-out 3; border-color: var(--accent); }
.todo__bar { width: 3px; flex-shrink: 0; }
.todo__body { flex: 1; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.todo__head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.todo__status { font-weight: 600; }
.todo__submitter { display: inline-flex; align-items: center; gap: 3px; font-size: 10.5px; color: var(--text-muted); }
.todo__actions { display: flex; gap: 2px; margin-left: auto; }
.todo__mini-btn {
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  background: transparent; border: none; border-radius: 5px;
  color: var(--text-muted); transition: all 0.15s;
}
.todo__mini-btn:hover { background: var(--bg-elevated-2); color: var(--text-primary); }
.todo__mini-btn--danger:hover { color: var(--st-rework); background: rgba(239,68,68,0.1); }
.todo__content { font-size: 13px; color: var(--text-primary); line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.todo__foot { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; }
.todo__time { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-muted); }
.todo__advance {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; font-weight: 500; color: var(--text-secondary);
  background: transparent; border: none; padding: 4px 8px;
  border-radius: 6px; transition: all 0.15s;
}
.todo__advance:hover { color: var(--accent); background: var(--accent-soft); }
.todo__advance:disabled { opacity: 0.4; cursor: not-allowed; }

@keyframes highlight-pulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(245,165,36,0.5); }
  50% { box-shadow: 0 0 0 8px rgba(245,165,36,0); }
}

/* ============ 画布（HTML 模拟 LogicFlow） ============ */
.canvas-wrap { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--bg-surface); }
.canvas-grid {
  position: absolute; inset: 0;
  background-image:
    radial-gradient(circle, rgba(243,244,246,0.04) 1px, transparent 1px);
  background-size: 24px 24px;
  pointer-events: none;
}
.canvas-viewport {
  position: absolute; inset: 0;
  overflow: hidden;
  cursor: grab;
}
.canvas-viewport:active { cursor: grabbing; }
.canvas-content {
  position: absolute; top: 0; left: 0;
  transform-origin: 0 0;
  transition: transform 0.25s cubic-bezier(0.22,1,0.36,1);
}
.canvas-edges { position: absolute; top: 0; left: 0; pointer-events: none; overflow: visible; }

.cf-node {
  position: absolute;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: var(--shadow-card);
  overflow: hidden;
  transition: border-color 0.15s, box-shadow 0.2s;
}
.cf-node:hover { border-color: var(--border-strong); }
.cf-node__head {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 12px 6px; font-size: 11px;
  color: var(--text-muted); letter-spacing: 0.04em;
  border-bottom: 1px solid var(--border);
}
.cf-node__body { padding: 10px 12px 12px; }
.cf-node__title { font-size: 13.5px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; line-height: 1.3; }
.cf-node__content { font-size: 12px; color: var(--text-secondary); line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
.cf-node--text .cf-node__head { color: #a78bfa; }
.cf-node--netdisk .cf-node__head { color: #60a5fa; }
.cf-node--video .cf-node__head { color: #f87171; }
.cf-node--feedback .cf-node__head { color: var(--accent); }
.cf-node--netdisk { cursor: pointer; }
.cf-node--netdisk:hover { border-color: #60a5fa; box-shadow: 0 0 0 1px rgba(96,165,250,0.3); }
.cf-node--feedback { cursor: pointer; }
.cf-node--feedback:hover { border-color: var(--accent); box-shadow: var(--shadow-glow); }
.cf-node__netdisk-file {
  display: flex; align-items: center; gap: 8px;
  font-size: 12.5px; color: var(--text-primary);
}
.cf-node__netdisk-brand {
  font-size: 10px; padding: 2px 6px; border-radius: 4px;
  background: rgba(96,165,250,0.14); color: #60a5fa; font-weight: 600;
}

/* 画布工具栏 */
.canvas-toolbar {
  position: absolute; top: 16px; left: 16px;
  display: flex; gap: 6px;
  background: rgba(28,31,39,0.92); backdrop-filter: blur(10px);
  border: 1px solid var(--border); border-radius: 10px;
  padding: 6px; z-index: 5;
}
.canvas-toolbar__add {
  display: flex; gap: 4px; padding-right: 8px;
  border-right: 1px solid var(--border); margin-right: 4px;
}
.canvas-toolbar__zoom { display: flex; gap: 4px; align-items: center; }
.tb-btn {
  width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  background: transparent; border: 1px solid transparent;
  border-radius: 6px; color: var(--text-secondary);
  transition: all 0.12s;
}
.tb-btn:hover { background: var(--bg-elevated-2); color: var(--text-primary); }
.tb-btn--add { width: auto; padding: 0 8px; gap: 4px; font-size: 11.5px; }
.tb-zoom-label { font-size: 11px; color: var(--text-muted); padding: 0 4px; min-width: 36px; text-align: center; }

.canvas-empty {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 6px; color: var(--text-muted); pointer-events: none;
}
.canvas-empty p { font-size: 14px; color: var(--text-secondary); margin: 8px 0 0; }
.canvas-empty span { font-size: 12px; }

/* ============ 访客页 ============ */
.visitor { background: var(--bg-base); overflow: hidden; }
.vbar {
  height: 64px; flex-shrink: 0;
  display: flex; align-items: center; gap: 20px; padding: 0 24px;
  background: rgba(21,23,29,0.78); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  position: relative; z-index: 10;
}
.vbar::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
  background: linear-gradient(90deg, transparent 0%, rgba(245,165,36,0.3) 50%, transparent 100%);
}
.vbar__left { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; }
.vbar__badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; background: var(--accent-soft); color: var(--accent);
  border: 1px solid rgba(245,165,36,0.25); border-radius: 999px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.03em; flex-shrink: 0;
}
.vbar__title-wrap { min-width: 0; }
.vbar__title { font-size: 17px; font-weight: 700; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vbar__meta { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }
.vbar__meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text-muted); margin: 0 4px; }
.vbar__center { flex-shrink: 0; }
.vbar__right { flex-shrink: 0; }
.v-validity {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; background: var(--bg-elevated);
  border: 1px solid var(--border); border-radius: 999px;
  font-size: 12px; color: var(--text-muted);
}
.visitor__canvas { flex: 1; min-height: 0; position: relative; }

.fab {
  position: fixed; right: 28px; bottom: 32px; z-index: 50;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 13px 22px;
  background: linear-gradient(135deg, var(--accent) 0%, #ff9d3d 100%);
  color: var(--accent-contrast); border: none; border-radius: 999px;
  font-size: 14px; font-weight: 700;
  box-shadow: 0 8px 24px rgba(245,165,36,0.35), 0 2px 6px rgba(0,0,0,0.3);
  transition: transform 0.18s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.18s;
  animation: fab-pop 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.25s both;
}
.fab:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 12px 32px rgba(245,165,36,0.45), 0 4px 10px rgba(0,0,0,0.4); }
.fab:active { transform: translateY(0) scale(0.98); }
@keyframes fab-pop {
  0% { transform: scale(0); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

/* 链接失效空状态 */
.invalid { height: 100%; display: flex; align-items: center; justify-content: center; background: var(--bg-base); padding: 24px; }
.invalid__card {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  max-width: 420px; padding: 40px 32px;
  background: var(--bg-surface); border: 1px solid var(--border);
  border-radius: 16px; box-shadow: var(--shadow-card);
}
.invalid__icon {
  width: 80px; height: 80px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; margin-bottom: 20px;
}
.invalid__icon--revoked, .invalid__icon--missing { background: rgba(239,68,68,0.1); color: var(--st-rework); }
.invalid__icon--expired { background: rgba(245,165,36,0.1); color: var(--accent); }
.invalid__title { font-size: 22px; font-weight: 700; margin: 0 0 10px; }
.invalid__desc { font-size: 13.5px; color: var(--text-secondary); line-height: 1.7; margin: 0 0 24px; }

/* ============ 模态框 ============ */
.modal-mask {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.55); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  padding: 24px; opacity: 0; pointer-events: none;
  transition: opacity 0.2s;
}
.modal-mask.open { opacity: 1; pointer-events: auto; }
.modal {
  width: 100%; max-width: 480px;
  background: var(--bg-surface); border: 1px solid var(--border);
  border-radius: 14px; box-shadow: var(--shadow-card-hover);
  transform: translateY(12px); transition: transform 0.25s cubic-bezier(0.22,1,0.36,1);
  max-height: 90vh; display: flex; flex-direction: column;
}
.modal-mask.open .modal { transform: translateY(0); }
.modal__head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 22px; border-bottom: 1px solid var(--border);
}
.modal__title { font-size: 16px; font-weight: 700; }
.modal__close {
  width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
  background: transparent; border: none; border-radius: 6px; color: var(--text-muted);
}
.modal__close:hover { background: var(--bg-elevated); color: var(--text-primary); }
.modal__body { padding: 20px 22px; overflow-y: auto; }
.modal__foot {
  display: flex; gap: 10px; justify-content: flex-end;
  padding: 14px 22px; border-top: 1px solid var(--border);
}
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; letter-spacing: 0.02em; }
.form-input, .form-textarea, .form-select {
  width: 100%; padding: 9px 12px;
  background: var(--bg-elevated); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text-primary); font-size: 13.5px;
  font-family: inherit; transition: border-color 0.15s;
}
.form-input:focus, .form-textarea:focus, .form-select:focus { outline: none; border-color: var(--accent); }
.form-textarea { min-height: 88px; resize: vertical; line-height: 1.6; }
.form-row { display: flex; gap: 12px; }
.form-row > * { flex: 1; }

/* 分享链接卡片 */
.share-link-card {
  background: var(--bg-elevated); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 16px; margin-bottom: 16px;
}
.share-link-card__label { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; letter-spacing: 0.04em; }
.share-link-card__url {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; color: var(--accent); font-family: ui-monospace, monospace;
}
.share-link-card__copy {
  margin-left: auto; padding: 4px 10px; font-size: 11.5px;
  background: var(--bg-elevated-2); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text-secondary);
}
.share-link-card__copy:hover { color: var(--accent); border-color: rgba(245,165,36,0.4); }
.share-link-card__meta { display: flex; gap: 16px; margin-top: 12px; font-size: 11.5px; color: var(--text-muted); }
.share-link-card__meta strong { color: var(--text-secondary); font-weight: 500; }

/* Toast */
.toast-host { position: fixed; top: 80px; right: 24px; z-index: 300; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.toast {
  display: flex; align-items: flex-start; gap: 10px;
  background: var(--bg-elevated); border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: 10px; padding: 12px 14px;
  min-width: 280px; max-width: 380px;
  box-shadow: var(--shadow-card-hover);
  animation: toast-in 0.3s cubic-bezier(0.22,1,0.36,1);
  pointer-events: auto;
}
.toast--success { border-left-color: var(--st-done); }
.toast--info { border-left-color: var(--st-progress); }
.toast--warning { border-left-color: var(--accent); }
.toast--error { border-left-color: var(--st-rework); }
.toast__icon { flex-shrink: 0; margin-top: 1px; }
.toast__body { flex: 1; min-width: 0; }
.toast__title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.toast__msg { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
@keyframes toast-in {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}
.toast.leaving { animation: toast-out 0.2s ease forwards; }
@keyframes toast-out {
  to { opacity: 0; transform: translateX(20px); }
}

/* 响应式 */
@media (max-width: 768px) {
  .hero { flex-direction: column; align-items: flex-start; gap: 32px; }
  .hero__title { font-size: 32px; }
  .grid { grid-template-columns: 1fr; }

  .pd__todo { width: 280px; }
  .pd .topbar { padding: 0 16px; gap: 12px; }
  .pd__progress { display: none; }
}
</style>

};
const VALIDITY_DAYS = { '1d': 1, '3d': 3, '7d': 7 };
const VALIDITY_LABEL = { '1d': '1 天', '3d': '3 天', '7d': '7 天', 'forever': '永久' };

// ---- 日期工具 ----
function dayOffset(days) {
  const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}
function timeOffset(minutes) {
  const d = new Date(); d.setMinutes(d.getMinutes() + minutes);
  return d.toISOString();
}
function daysUntil(deadline) {
  const d = new Date(deadline + 'T23:59:59');
  return Math.floor((d.getTime() - Date.now()) / 86400000);
}
function isOverdue(deadline) { return daysUntil(deadline) < 0; }
function countdownText(deadline) {
  const d = daysUntil(deadline);
  if (d < 0) return `逾期 ${Math.abs(d)} 天`;
  if (d === 0) return '今天截止';
  return `剩余 ${d} 天`;
}
function formatDate(dateStr) {
  const d = new Date(dateStr);
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}
function relativeTime(iso) {
  const diff = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (diff < 60) return '刚刚';
  if (diff < 3600) return `${Math.floor(diff/60)} 分钟前`;
  if (diff < 86400) return `${Math.floor(diff/3600)} 小时前`;
  if (diff < 86400*7) return `${Math.floor(diff/86400)} 天前`;
  return formatDate(iso);
}
function formatDateTime(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

let state = {
  projects: buildMockData(),
  currentProjectId: null,
  todoFilter: 'all',
  collapsed: false,
  highlightId: null,
  canvasZoom: 1,
  canvasOffset: { x: 0, y: 0 },
};

// ---- 跨标签页同步（BroadcastChannel）----
let syncChannel = null;
try {
  syncChannel = new BroadcastChannel('clipflow-sync');
  syncChannel.onmessage = (e) => {
    if (e.data && e.data.type === 'NEW_TODO') {
      const { projectId, todo } = e.data;
      const p = state.projects.find(p => p.id === projectId);
      if (!p) return;
      // 避免重复添加
      if (p.todos.find(t => t.id === todo.id)) return;
      p.todos.unshift(todo);
      // 同步画布上的 feedback 节点
      const fbNode = p.canvas.nodes.find(n => n.type === 'feedback' && n.properties.todoId === todo.id);
      if (!fbNode) {
        p.canvas.nodes.push({
          id: 'node-feedback-' + todo.id, type: 'feedback',
          x: 460, y: 600, width: 280, height: 120,
          properties: { title: '修改意见', content: todo.content, todoId: todo.id, status: todo.status },
        });
      }
      toast(`甲方提交了新意见：${todo.content.slice(0, 20)}${todo.content.length > 20 ? '...' : ''}`, 'success', '收到新意见');
      rerenderCurrent();
    }
  };
} catch (e) { /* BroadcastChannel 不支持时静默 */ }

/* ===================================================================
   路由
   =================================================================== */
function parseHash() {
  const h = location.hash.replace(/^#\/?/, '');
  if (!h || h === 'dashboard') return { page: 'dashboard' };
  const m1 = h.match(/^project\/(.+)$/);
  if (m1) return { page: 'project', id: decodeURIComponent(m1[1]) };
  const m2 = h.match(/^p\/(.+)$/);
  if (m2) return { page: 'visitor', linkId: decodeURIComponent(m2[1]) };
  return { page: 'dashboard' };
}
function navigate(hash) { location.hash = hash; }
window.addEventListener('hashchange', route);

function route() {
  const r = parseHash();
  hideAllPages();
  if (r.page === 'dashboard') {
    showPage('page-dashboard');
    renderDashboard();
  } else if (r.page === 'project') {
    const p = state.projects.find(p => p.id === r.id);
    if (!p) { navigate('#/dashboard'); return; }
    state.currentProjectId = r.id;
    showPage('page-project');
    renderProjectDetail();
  } else if (r.page === 'visitor') {
    const p = state.projects.find(p => p.shareLink && p.shareLink.id === r.linkId);
    if (!p) { renderInvalid('missing'); return; }
    const link = p.shareLink;
    if (link.status === 'revoked') { renderInvalid('revoked'); return; }
    let linkState = 'active';
    if (link.validity !== 'forever') {
      const days = VALIDITY_DAYS[link.validity];
      const expireAt = new Date(link.createdAt).getTime() + days * 86400000;
      if (Date.now() > expireAt) linkState = 'expired';
    }
    if (linkState !== 'active') { renderInvalid(linkState); return; }
    state.currentProjectId = p.id;
    showPage('page-visitor');
    renderVisitor();
  }
}
function hideAllPages() {
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
}
function showPage(id) { document.getElementById(id).classList.add('active'); }

function rerenderCurrent() {
  const r = parseHash();
  if (r.page === 'dashboard') renderDashboard();
  else if (r.page === 'project') renderProjectDetail();
  else if (r.page === 'visitor') renderVisitor();
}

/* ===================================================================
   工作台 Dashboard 渲染
   =================================================================== */
function renderDashboard() {
  const projects = state.projects;
  // 统计
  const totalTodos = projects.reduce((s, p) => s + p.todos.length, 0);
  const totalDone = projects.reduce((s, p) => s + p.todos.filter(t => t.status === 'done').length, 0);
  document.getElementById('stat-projects').textContent = projects.length;
  document.getElementById('stat-todos').textContent = totalTodos;
  document.getElementById('stat-done').textContent = totalDone;
  document.getElementById('grid-count').textContent = projects.length;

  // 排序：逾期优先，然后按截止日期升序
  const sorted = [...projects].sort((a, b) => {
    const ao = isOverdue(a.deadline) ? 0 : 1;
    const bo = isOverdue(b.deadline) ? 0 : 1;
    if (ao !== bo) return ao - bo;
    return new Date(a.deadline).getTime() - new Date(b.deadline).getTime();
  });

  const grid = document.getElementById('project-grid');
  grid.innerHTML = sorted.map(p => projectCardHTML(p)).join('');
  // 绑定点击
  grid.querySelectorAll('[data-pid]').forEach(el => {
    el.addEventListener('click', () => navigate('#/project/' + el.dataset.pid));
  });
}

function projectCardHTML(p) {
  const done = p.todos.filter(t => t.status === 'done').length;
  const total = p.todos.length;
  const ratio = total === 0 ? null : done / total;
  const overdue = isOverdue(p.deadline);
  let accentBar = 'var(--border-strong)';
  if (overdue) accentBar = 'var(--st-rework)';
  else if (ratio === 1) accentBar = 'var(--st-done)';
  else if (total > 0) accentBar = 'var(--accent)';

  const progressColor = ratio === null ? 'var(--border-strong)'
    : ratio === 1 ? 'var(--st-done)'
    : ratio >= 0.71 ? '#6366f1'
    : ratio >= 0.31 ? 'var(--st-progress)'
    : 'var(--st-pending)';
  const progressWidth = ratio === null ? '0%' : Math.round(ratio * 100) + '%';

  let badge = '';
  if (overdue) badge = '<span class="card__badge card__badge--danger">逾期</span>';
  else if (ratio === 1) badge = '<span class="card__badge card__badge--done">已完成</span>';

  const sharedHTML = p.shareLink
    ? '<span class="card__shared"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg><span>已分享</span></span>'
    : '<span class="card__shared card__shared--muted"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 0 1 0 10h-2"/><line x1="8" y1="12" x2="16" y2="12"/></svg></span>';

  return `
    <article class="card ${overdue ? 'card--overdue' : ''}" data-pid="${p.id}" style="--accent-bar:${accentBar}">
      <div class="card__bar"></div>
      <div class="card__body">
        <div class="card__head">
          <h3 class="card__title font-display">${escapeHTML(p.name)}</h3>
          ${badge}
        </div>
        <div class="card__client">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>${escapeHTML(p.clientName)}</span>
        </div>
        <div class="card__meta">
          <div class="card__meta-item">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span class="tnum">${formatDate(p.deadline)}</span>
          </div>
          <div class="card__countdown ${overdue ? 'is-overdue' : ''}">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span>${countdownText(p.deadline)}</span>
          </div>
        </div>
        <div class="card__progress">
          <div class="progress progress--sm">
            <div class="progress__track">
              <div class="progress__fill" style="width:${progressWidth};background-color:${progressColor}"></div>
            </div>
          </div>
        </div>
        <div class="card__footer">
          <span class="card__count">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            <span class="tnum">${done}/${total}</span>
            <span class="card__count-label">意见</span>
          </span>
          ${sharedHTML}
        </div>
      </div>
    </article>
  `;
}

function getCurrentProject() {
  return state.projects.find(p => p.id === state.currentProjectId);
}
function projectProgress(p) {
  const total = p.todos.length;
  const done = p.todos.filter(t => t.status === 'done').length;
  return { total, done, ratio: total === 0 ? null : done / total };
}

function renderProjectDetail() {
  const p = getCurrentProject();
  if (!p) { navigate('#/dashboard'); return; }
  document.getElementById('pd-title').textContent = p.name;
  document.getElementById('pd-client').textContent = p.clientName;
  document.getElementById('pd-deadline').textContent = formatDate(p.deadline);
  const cd = document.getElementById('pd-countdown');
  const cdText = document.getElementById('pd-countdown-text');
  const overdue = isOverdue(p.deadline);
  cdText.textContent = countdownText(p.deadline);
  cd.classList.toggle('is-overdue', overdue);

  // 进度条
  const prog = projectProgress(p);
  const ratio = prog.ratio;
  const color = ratio === null ? 'var(--border-strong)'
    : ratio === 1 ? 'var(--st-done)'
    : ratio >= 0.71 ? '#6366f1'
    : ratio >= 0.31 ? 'var(--st-progress)'
    : 'var(--st-pending)';
  const width = ratio === null ? '0%' : Math.round(ratio * 100) + '%';
  const label = ratio === null ? '暂无意见' : Math.round(ratio * 100) + '%';
  document.getElementById('pd-progress').innerHTML = `
    <div class="progress progress--sm">
      <div class="progress__track"><div class="progress__fill" style="width:${width};background-color:${color}"></div></div>
      <div class="progress__label">${label}</div>

  // 折叠状态
  document.getElementById('pd-todo-panel').classList.toggle('is-collapsed', state.collapsed);

    : '<rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/>';

  renderTodoList();
  renderCanvas('pd-canvas-host', p.canvas, false);
}

function toggleTodoPanel() {

    { key: 'done', label: '已完成', count: p.todos.filter(t => t.status === 'done').length },

function cycleTodo(id) {
  const p = getCurrentProject(); if (!p) return;
  const t = p.todos.find(t => t.id === id); if (!t) return;
  if (t.status === 'pending') t.status = 'inProgress';
  else if (t.status === 'inProgress') t.status = 'done';
  else if (t.status === 'rework') t.status = 'inProgress';
  syncFeedbackNodeStatus(p, id);
  renderTodoList();
  renderCanvas('pd-canvas-host', p.canvas, false);
}

function deleteTodo(id) {
  if (!confirm('确认删除这条修改意见？删除后无法恢复。')) return;
  const p = getCurrentProject(); if (!p) return;
  p.todos = p.todos.filter(t => t.id !== id);
  p.canvas.nodes = p.canvas.nodes.filter(n => !(n.type === 'feedback' && n.properties.todoId === id));
  renderTodoList();
  renderCanvas('pd-canvas-host', p.canvas, false);
  toast('已删除意见', 'info');
}

function syncFeedbackNodeStatus(p, todoId) {
  const t = p.todos.find(t => t.id === todoId);
  if (!t) return;
  for (const n of p.canvas.nodes) {
    if (n.type === 'feedback' && n.properties.todoId === todoId) {
      n.properties.status = t.status;
      n.properties.content = n.properties.content || t.content;
    }
  }
}

              <label class="form-label">优先级</label>
              <select class="form-select" id="tf-priority">
                <option value="high" ${editing && editing.priority === 'high' ? 'selected' : ''}>高</option>
                <option value="medium" ${!editing || editing.priority === 'medium' ? 'selected' : ''}>中</option>
                <option value="low" ${editing && editing.priority === 'low' ? 'selected' : ''}>低</option>
              </select>
            </div>
            <div class="form-group" style="margin-bottom:0">
              <label class="form-label">提交人</label>
              <select class="form-select" id="tf-submitter">
                <option value="client" ${!editing || editing.submitter === 'client' ? 'selected' : ''}>甲方</option>
                <option value="editor" ${editing && editing.submitter === 'editor' ? 'selected' : ''}>剪辑师</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal__foot">
          <button class="btn btn-ghost" onclick="closeModal()">取消</button>
          <button class="btn btn-primary" onclick="saveTodoForm('${editing ? editing.id : ''}')">保存</button>
        </div>
      </div>
    </div>`;
  document.getElementById('modal-root').innerHTML = modal;
  setTimeout(() => document.getElementById('tf-content').focus(), 100);
}

function saveTodoForm(editId) {
  const content = document.getElementById('tf-content').value.trim();
  if (!content) { toast('请输入意见内容', 'warning'); return; }
  const priority = document.getElementById('tf-priority').value;
  const submitter = document.getElementById('tf-submitter').value;
  const p = getCurrentProject(); if (!p) return;

  if (editId) {
    const t = p.todos.find(t => t.id === editId);
    if (t) {
      t.content = content;
      t.priority = priority;
      t.submitter = submitter;
      t.submittedAt = new Date().toISOString();
      syncFeedbackNodeStatus(p, editId);
    }
    toast('已更新意见', 'success');
  } else {
    const newTodo = {
      id: 'todo-' + Date.now(),
      projectId: p.id,
      content, priority, submitter,
      status: 'pending',
      submittedAt: new Date().toISOString(),
      attachments: [],
    };
    p.todos.unshift(newTodo);
    p.canvas.nodes.push({
      id: 'node-feedback-' + newTodo.id, type: 'feedback',
      x: 460, y: 600, width: 280, height: 120,
      properties: { title: '修改意见', content, todoId: newTodo.id, status: 'pending' },
    });
    toast('已新增意见', 'success');
  }
  closeModal();
  renderTodoList();
  renderCanvas('pd-canvas-host', p.canvas, false);
}

/* ===================================================================
   画布渲染（HTML 模拟 LogicFlow）
   =================================================================== */
function renderCanvas(hostId, canvas, readonly) {
  const host = document.getElementById(hostId);
  if (!host) return;
  if (canvas.nodes.length === 0) {
    host.innerHTML = `
      <div class="canvas-wrap">
        <div class="canvas-grid"></div>
        <div class="canvas-empty">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <p>空白画布</p>
          <span>${readonly ? '暂无内容' : '从工具栏添加卡片'}</span>
        </div>
      </div>`;
    return;
  }
  // 计算画布尺寸
  const maxX = Math.max(...canvas.nodes.map(n => n.x + n.width));
  const maxY = Math.max(...canvas.nodes.map(n => n.y + n.height));
  const padding = 80;
  const contentW = maxX + padding;
  const contentH = maxY + padding;

  const toolbarHTML = readonly ? '' : `
    <div class="canvas-toolbar">
      <div class="canvas-toolbar__add">
        <button class="tb-btn tb-btn--add" title="添加文字备注" onclick="addCanvasNode('text')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          文字
        </button>
        <button class="tb-btn tb-btn--add" title="添加网盘链接" onclick="addCanvasNode('netdisk')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="12" x2="2" y2="12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
          网盘
        </button>
        <button class="tb-btn tb-btn--add" title="添加参考视频" onclick="addCanvasNode('video')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="17" x2="22" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/></svg>
          视频
        </button>
        <button class="tb-btn tb-btn--add" title="添加修改意见卡" onclick="addCanvasNode('feedback')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          意见
        </button>
      </div>
      <div class="canvas-toolbar__zoom">
        <button class="tb-btn" title="缩小" onclick="zoomCanvas(-0.1)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg></button>
        <span class="tb-zoom-label" id="zoom-label">100%</span>
        <button class="tb-btn" title="放大" onclick="zoomCanvas(0.1)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg></button>
        <button class="tb-btn" title="适应画布" onclick="fitCanvas()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></button>
        <button class="tb-btn" title="重置" onclick="resetCanvas()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></button>
      </div>
    </div>`;

  // 计算节点中心点用于连线
  const nodeMap = {};
  canvas.nodes.forEach(n => nodeMap[n.id] = n);
  const edgesHTML = canvas.edges.map(e => {
    const s = nodeMap[e.sourceNodeId]; const t = nodeMap[e.targetNodeId];
    if (!s || !t) return '';
    const sx = s.x + s.width / 2;
    const sy = s.y + s.height / 2;
    const tx = t.x + t.width / 2;
    const ty = t.y + t.height / 2;
    // 贝塞尔曲线
    const mx = (sx + tx) / 2;
    const path = `M ${sx} ${sy} C ${mx} ${sy}, ${mx} ${ty}, ${tx} ${ty}`;
    return `<path d="${path}" stroke="#3a3f4d" stroke-width="1.5" fill="none"/><circle cx="${tx}" cy="${ty}" r="3" fill="#3a3f4d"/>`;
  }).join('');

  const nodesHTML = canvas.nodes.map(n => canvasNodeHTML(n)).join('');

  host.innerHTML = `
    <div class="canvas-wrap">
      <div class="canvas-grid"></div>
      <div class="canvas-viewport" id="${hostId}-viewport">
        <div class="canvas-content" id="${hostId}-content" style="width:${contentW}px;height:${contentH}px;transform:translate(0px,0px) scale(1)">
          <svg class="canvas-edges" width="${contentW}" height="${contentH}">${edgesHTML}</svg>
          ${nodesHTML}
        </div>
      </div>
      ${toolbarHTML}
    </div>`;

  // 绑定节点点击
  host.querySelectorAll('.cf-node').forEach(el => {
    el.addEventListener('click', (ev) => {
      const nid = el.dataset.nid;
      const node = canvas.nodes.find(n => n.id === nid);

      if (node.type === 'netdisk' && node.properties.url) {
        window.open(node.properties.url, '_blank', 'noopener');
      } else if (node.type === 'feedback' && node.properties.todoId) {
        jumpToTodo(node.properties.todoId);
      }
    });
    el.addEventListener('dblclick', (ev) => {
      if (readonly) return;
      const nid = el.dataset.nid;
      openNodeEditDialog(nid);
    });
  });

  // 拖拽平移
  setupCanvasDrag(hostId);
  // 适应画布
  setTimeout(() => fitCanvas(hostId), 50);
}

function nodeTypeLabel(t) {

}

function setupCanvasDrag(hostId) {
  const viewport = document.getElementById(hostId + '-viewport');
  const content = document.getElementById(hostId + '-content');
  if (!viewport || !content) return;
  let dragging = false;
  let startX = 0, startY = 0;
  let originX = 0, originY = 0;
  viewport.addEventListener('mousedown', (e) => {
    if (e.target.closest('.cf-node') || e.target.closest('.canvas-toolbar')) return;
    dragging = true;
    startX = e.clientX; startY = e.clientY;
    const m = content.style.transform.match(/translate\(([-\d.]+)px,\s*([-\d.]+)px\)/);
    originX = m ? parseFloat(m[1]) : 0;
    originY = m ? parseFloat(m[2]) : 0;
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    const scale = state.canvasZoom;
    content.style.transform = `translate(${originX + dx}px, ${originY + dy}px) scale(${scale})`;
  });
  window.addEventListener('mouseup', () => { dragging = false; });
}

function zoomCanvas(delta) {
  const hostId = getCurrentCanvasHostId();
  if (!hostId) return;
  const content = document.getElementById(hostId + '-content');
  if (!content) return;
  let z = state.canvasZoom + delta;
  z = Math.max(0.25, Math.min(2, z));
  state.canvasZoom = z;
  const m = content.style.transform.match(/translate\(([-\d.]+)px,\s*([-\d.]+)px\)/);
  const x = m ? parseFloat(m[1]) : 0;
  const y = m ? parseFloat(m[2]) : 0;
  content.style.transform = `translate(${x}px, ${y}px) scale(${z})`;
  const label = document.getElementById('zoom-label');
  if (label) label.textContent = Math.round(z * 100) + '%';
}

function fitCanvas(hostIdArg) {
  const hostId = hostIdArg || getCurrentCanvasHostId();
  if (!hostId) return;
  const viewport = document.getElementById(hostId + '-viewport');
  const content = document.getElementById(hostId + '-content');
  if (!viewport || !content) return;
  const p = getCurrentProject();
  if (!p) return;
  const maxX = Math.max(...p.canvas.nodes.map(n => n.x + n.width));
  const maxY = Math.max(...p.canvas.nodes.map(n => n.y + n.height));
  const vw = viewport.clientWidth;
  const vh = viewport.clientHeight;
  const scaleX = (vw - 80) / maxX;
  const scaleY = (vh - 80) / maxY;
  let z = Math.min(scaleX, scaleY, 1);
  z = Math.max(0.25, z);
  state.canvasZoom = z;
  const ox = (vw - maxX * z) / 2;
  const oy = (vh - maxY * z) / 2;
  content.style.transform = `translate(${ox}px, ${oy}px) scale(${z})`;
  const label = document.getElementById('zoom-label');
  if (label) label.textContent = Math.round(z * 100) + '%';
}

function resetCanvas() {
  const hostId = getCurrentCanvasHostId();
  if (!hostId) return;
  const content = document.getElementById(hostId + '-content');
  if (!content) return;
  state.canvasZoom = 1;
  content.style.transform = `translate(20px, 20px) scale(1)`;
  const label = document.getElementById('zoom-label');
  if (label) label.textContent = '100%';
}

function getCurrentCanvasHostId() {
  const r = parseHash();
  if (r.page === 'project') return 'pd-canvas-host';
  if (r.page === 'visitor') return 'vs-canvas-host';
  return null;
}

    image: { thumbnail: '' },
    feedback: { title: '修改意见', content: '', todoId: '' },

  const id = 'node-' + type + '-' + Date.now();
  const maxY = Math.max(0, ...p.canvas.nodes.map(n => n.y + n.height));

        </div>
      </div>
    </div>`;
  document.getElementById('modal-root').innerHTML = modal;
}

function saveNodeEdit(nodeId) {
  const p = getCurrentProject(); if (!p) return;
  const node = p.canvas.nodes.find(n => n.id === nodeId);
  if (!node) return;
  const get = (id) => { const el = document.getElementById(id); return el ? el.value : ''; };
  if (node.type === 'text' || node.type === 'feedback') {
    node.properties.title = get('ne-title');
    node.properties.content = get('ne-content');
    if (node.type === 'feedback' && node.properties.todoId) {
      syncFeedbackNodeStatus(p, node.properties.todoId);
    }
  } else if (node.type === 'netdisk') {
    node.properties.fileName = get('ne-fileName');
    node.properties.brand = get('ne-brand');
    node.properties.url = get('ne-url');
  } else if (node.type === 'video') {
    node.properties.title = get('ne-title');
    node.properties.platform = get('ne-platform');
    node.properties.url = get('ne-url');
  }
  closeModal();
  renderCanvas('pd-canvas-host', p.canvas, false);
  renderTodoList();
  toast('卡片已更新', 'success');
}

function jumpToTodo(todoId) {
  const p = getCurrentProject(); if (!p) return;
  const todo = p.todos.find(t => t.id === todoId);
  if (!todo) return;
  if (state.todoFilter !== 'all' && state.todoFilter !== todo.status) {
    state.todoFilter = 'all';
  }
  renderTodoList();
  setTimeout(() => {
    const el = document.querySelector(`[data-todo-id="${todoId}"]`);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      state.highlightId = todoId;
      renderTodoList();
      setTimeout(() => { state.highlightId = null; renderTodoList(); }, 2000);
    }
  }, 50);
}

/* ===================================================================
   访客页
   =================================================================== */
function renderVisitor() {
  const p = getCurrentProject();
  if (!p || !p.shareLink) { renderInvalid('missing'); return; }
  const link = p.shareLink;
  document.getElementById('vs-title').textContent = p.name;
  document.getElementById('vs-client').textContent = p.clientName;
  document.getElementById('vs-deadline').textContent = formatDate(p.deadline);
  const cd = document.getElementById('vs-countdown');
  const cdText = document.getElementById('vs-countdown-text');
  const overdue = isOverdue(p.deadline);
  cdText.textContent = countdownText(p.deadline);
  cd.classList.toggle('is-overdue', overdue);

  // 有效期
  let validityText = '永久有效';
  if (link.validity !== 'forever') {
    const days = VALIDITY_DAYS[link.validity];
    const expireAt = new Date(link.createdAt).getTime() + days * 86400000;
    const remain = Math.ceil((expireAt - Date.now()) / 86400000);
    validityText = remain <= 0 ? '已过期' : `剩余 ${remain} 天`;
  }
  document.querySelector('#vs-validity span').textContent = validityText;

  renderCanvas('vs-canvas-host', p.canvas, true);
}

function openFeedbackForm() {
  const p = getCurrentProject();
  if (!p) return;
  const modal = `
    <div class="modal-mask open" id="feedback-mask" onclick="if(event.target.id==='feedback-mask')closeModal()">
      <div class="modal">
        <div class="modal__head">
          <div class="modal__title">提交修改意见</div>
          <button class="modal__close" onclick="closeModal()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="modal__body">
          <div class="form-group">
            <label class="form-label">意见内容 <span style="color:var(--st-rework)">*</span></label>
            <textarea class="form-textarea" id="ff-content" placeholder="请描述具体的修改要求，越详细越好..."></textarea>
          </div>
          <div class="form-row">
            <div class="form-group" style="margin-bottom:0">
              <label class="form-label">优先级</label>
              <select class="form-select" id="ff-priority">
                <option value="high">高</option>
                <option value="medium" selected>中</option>
                <option value="low">低</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal__foot">
          <button class="btn btn-ghost" onclick="closeModal()">取消</button>
          <button class="btn btn-primary" onclick="submitFeedback()">提交意见</button>
        </div>
      </div>
    </div>`;
  document.getElementById('modal-root').innerHTML = modal;
  setTimeout(() => document.getElementById('ff-content').focus(), 100);
}

function submitFeedback() {
  const content = document.getElementById('ff-content').value.trim();
  if (!content) { toast('请输入意见内容', 'warning'); return; }
  const priority = document.getElementById('ff-priority').value;
  const p = getCurrentProject(); if (!p) return;

  const newTodo = {
    id: 'todo-' + Date.now(),
    projectId: p.id,
    content, priority,
    status: 'pending',
    submitter: 'client',
    submittedAt: new Date().toISOString(),
    attachments: [],
  };
  p.todos.unshift(newTodo);
  p.canvas.nodes.push({
    id: 'node-feedback-' + newTodo.id, type: 'feedback',
    x: 460, y: 600, width: 280, height: 120,
    properties: { title: '修改意见', content, todoId: newTodo.id, status: 'pending' },
  });

  // 通过 BroadcastChannel 通知剪辑师端
  if (syncChannel) {
    try { syncChannel.postMessage({ type: 'NEW_TODO', projectId: p.id, todo: newTodo }); } catch (e) {}
  }

  closeModal();
  renderCanvas('vs-canvas-host', p.canvas, true);
  toast('意见已提交，剪辑师会尽快处理', 'success', '提交成功');
}

function renderInvalid(state) {
  hideAllPages();
  showPage('page-invalid');
  const icon = document.getElementById('invalid-icon');
  const title = document.getElementById('invalid-title');
  const desc = document.getElementById('invalid-desc');
  if (state === 'revoked') {
    icon.className = 'invalid__icon invalid__icon--revoked';
    icon.innerHTML = '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 0 1 0 10h-2"/><line x1="8" y1="12" x2="16" y2="12"/></svg>';
    title.textContent = '链接已被作废';
    desc.textContent = '剪辑师已重新生成分享链接，请联系对方获取最新链接。';
  } else if (state === 'expired') {
    icon.className = 'invalid__icon invalid__icon--expired';
    icon.innerHTML = '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';
    title.textContent = '链接已过期';
    desc.textContent = '该分享链接已超过有效期，请联系剪辑师重新分享。';
  } else {
    icon.className = 'invalid__icon invalid__icon--missing';
    icon.innerHTML = '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 0 1 0 10h-2"/><line x1="8" y1="12" x2="16" y2="12"/></svg>';
    title.textContent = '链接无效';
    desc.textContent = '该链接不存在或已失效，请确认链接是否完整。';
  }
}

/* ===================================================================
   分享对话框
   =================================================================== */
function openShareDialog() {
  const p = getCurrentProject();
  if (!p) return;
  // 若尚无分享链接，创建一个
  if (!p.shareLink) {
    const linkId = 'share-' + Math.random().toString(36).slice(2, 8);
    p.shareLink = {
      id: linkId, projectId: p.id,
      url: 'clipflow.com/p/' + linkId,
      validity: '7d', status: 'active',
      createdAt: new Date().toISOString(),
    };
  }
  const link = p.shareLink;
  const fullUrl = location.origin + location.pathname + '#/p/' + link.id;
  let validityText = '永久有效';
  if (link.validity !== 'forever') {
    const days = VALIDITY_DAYS[link.validity];
    const expireAt = new Date(link.createdAt).getTime() + days * 86400000;
    const remain = Math.ceil((expireAt - Date.now()) / 86400000);
    validityText = remain <= 0 ? '已过期' : `剩余 ${remain} 天`;
  }

  const validityOpts = ['1d','3d','7d','forever'].map(v =>
    `<option value="${v}" ${link.validity === v ? 'selected' : ''}>${VALIDITY_LABEL[v]}</option>`
  ).join('');

  const modal = `
    <div class="modal-mask open" id="share-mask" onclick="if(event.target.id==='share-mask')closeModal()">
      <div class="modal">
        <div class="modal__head">
          <div class="modal__title">分享项目</div>
          <button class="modal__close" onclick="closeModal()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="modal__body">
          <div class="share-link-card">
            <div class="share-link-card__label">分享链接</div>
            <div class="share-link-card__url">
              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">${escapeHTML(fullUrl)}</span>
              <button class="share-link-card__copy" onclick="copyShareLink('${escapeAttr(fullUrl)}')">复制</button>
            </div>
            <div class="share-link-card__meta">
              <span>状态：<strong style="color:var(--st-done)">${link.status === 'active' ? '有效' : '已作废'}</strong></span>
              <span>有效期：<strong>${validityText}</strong></span>
              <span>创建：<strong>${formatDate(link.createdAt)}</strong></span>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group" style="margin-bottom:0">
              <label class="form-label">有效期</label>
              <select class="form-select" id="sf-validity" onchange="updateShareValidity()">${validityOpts}</select>
            </div>
            <div class="form-group" style="margin-bottom:0;display:flex;align-items:flex-end">
              <button class="btn btn-ghost" onclick="revokeShare()" style="color:var(--st-rework);border-color:rgba(239,68,68,0.3)">作废链接</button>
            </div>
          </div>
          <p style="font-size:12px;color:var(--text-muted);margin-top:12px;line-height:1.6">
            甲方通过分享链接可只读查看画布并提交修改意见，意见会实时同步到你的待办清单。
          </p>
        </div>
        <div class="modal__foot">
          <button class="btn btn-primary" onclick="closeModal()">完成</button>
        </div>
      </div>
    </div>`;
  document.getElementById('modal-root').innerHTML = modal;
}

function copyShareLink(url) {
  // 尝试复制
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => toast('链接已复制', 'success'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = url; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('链接已复制', 'success'); } catch(e) { toast('复制失败，请手动选中复制', 'warning'); }
    document.body.removeChild(ta);
  }
}

function updateShareValidity() {
  const p = getCurrentProject(); if (!p || !p.shareLink) return;
  const v = document.getElementById('sf-validity').value;
  p.shareLink.validity = v;
  p.shareLink.createdAt = new Date().toISOString();
  closeModal();
  openShareDialog();
  toast('有效期已更新为 ' + VALIDITY_LABEL[v], 'success');
}

function revokeShare() {
  const p = getCurrentProject(); if (!p || !p.shareLink) return;
  if (!confirm('确认作废此分享链接？作废后甲方将无法访问。')) return;
  p.shareLink.status = 'revoked';
  closeModal();
  toast('链接已作废', 'info');
}

/* ===================================================================
   新建项目
   =================================================================== */
function openCreateDialog() {
  const modal = `
    <div class="modal-mask open" id="create-mask" onclick="if(event.target.id==='create-mask')closeModal()">
      <div class="modal">
        <div class="modal__head">
          <div class="modal__title">新建项目</div>
          <button class="modal__close" onclick="closeModal()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="modal__body">
          <div class="form-group">
            <label class="form-label">项目名称 <span style="color:var(--st-rework)">*</span></label>
            <input class="form-input" id="cp-name" placeholder="如：BrewLab 咖啡 30s 宣传片"/>
          </div>
          <div class="form-group">
            <label class="form-label">甲方名称</label>
            <input class="form-input" id="cp-client" placeholder="如：BrewLab 市场部"/>
          </div>
          <div class="form-group">
            <label class="form-label">截止日期</label>
            <input class="form-input" id="cp-deadline" type="date" value="${dayOffset(7)}"/>
          </div>
        </div>
        <div class="modal__foot">
          <button class="btn btn-ghost" onclick="closeModal()">取消</button>
          <button class="btn btn-primary" onclick="createProject()">创建</button>
        </div>
      </div>
    </div>`;
  document.getElementById('modal-root').innerHTML = modal;
  setTimeout(() => document.getElementById('cp-name').focus(), 100);
}

function createProject() {
  const name = document.getElementById('cp-name').value.trim();
  if (!name) { toast('请输入项目名称', 'warning'); return; }
  const client = document.getElementById('cp-client').value.trim() || '未填写';
  const deadline = document.getElementById('cp-deadline').value || dayOffset(7);
  const id = 'proj-' + Date.now();
  state.projects.unshift({
    id, name, clientName: client, deadline,
    canvas: { id: 'canvas-' + id, nodes: [], edges: [] },
    todos: [], shareLink: null,
  });
  closeModal();
  toast('项目已创建', 'success');
  renderDashboard();
  navigate('#/project/' + id);
}

/* ===================================================================
   Toast / Modal
   =================================================================== */
function toast(msg, type, title) {
  type = type || 'info';
  const host = document.getElementById('toast-host');
  const el = document.createElement('div');
  el.className = 'toast toast--' + type;
  const iconMap = {
    success: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
    info: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
    warning: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F5A524" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
    error: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
  };
  el.innerHTML = `
    <div class="toast__icon">${iconMap[type] || iconMap.info}</div>
    <div class="toast__body">
      ${title ? `<div class="toast__title">${escapeHTML(title)}</div>` : ''}
      <div class="toast__msg">${escapeHTML(msg)}</div>
    </div>`;
  host.appendChild(el);
  setTimeout(() => {
    el.classList.add('leaving');
    setTimeout(() => el.remove(), 200);
  }, 3500);
}

function closeModal() {
  document.getElementById('modal-root').innerHTML = '';
}

/* ===================================================================
   工具函数
   =================================================================== */
function escapeHTML(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
function escapeAttr(str) {
  if (str == null) return '';
  return String(str).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// 监听窗口大小变化，重新适应画布
window.addEventListener('resize', () => {
  const hostId = getCurrentCanvasHostId();
  if (hostId) {
    const content = document.getElementById(hostId + '-content');
    if (content) {
      // 保持当前缩放，不自动 fit，避免打断用户操作
    }
  }
});

/* ===================================================================
   启动
   =================================================================== */
document.addEventListener('DOMContentLoaded', () => {
  // 若没有 hash，默认跳到 dashboard
  if (!location.hash) {
    location.hash = '#/dashboard';
  } else {
    route();
  }
});
// 如果 DOMContentLoaded 已触发（脚本在 body 末尾），直接执行
if (document.readyState === 'interactive' || document.readyState === 'complete') {
  if (!location.hash) location.hash = '#/dashboard';
  else route();
}
</script>
