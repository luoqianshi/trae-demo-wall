<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>果果帮 · 识别结果 · v3</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --bg: #ede8e1;
    --card: #ffffff;
    --ink: #2a1e16;
    --ink-soft: #3a2a20;
    --brown: #7a4a36;
    --brown-deep: #5a3525;
    --ok: #3f8a6b;
    --muted: #6b574a;
    --soft: #b8a797;
    --iconbg: #f1ece4;
    --pink: #ffb199;
    --pink-deep: #ff8a8a;
    --bar1: #7a4a36;
    --bar2: #9b6a52;
    --bar3: #b8896f;
    --bar4: #c9a48e;
    --bar5: #d8c0ad;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    background: #ede8e1;
    margin: 0; padding: 0;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .phone {
    width: 390px; height: 844px;
    background: var(--bg);
    border-radius: 50px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.18), 0 0 0 12px #1a1a1a, 0 0 0 14px #2a2a2a;
    overflow: hidden; position: relative;
  }
  .notch {
    width: 120px; height: 32px; background: #1a1a1a;
    border-radius: 0 0 20px 20px;
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    z-index: 50;
  }
  .status-bar {
    position: absolute; top: 14px; left: 28px; right: 28px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; color: var(--ink); font-weight: 600;
    z-index: 40;
  }
  .home-indicator {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px; background: #1a1a1a; border-radius: 3px;
    z-index: 60;
  }

  /* ===== 顶部导航 ===== */
  .top-nav {
    position: absolute; top: 54px; left: 24px; right: 24px;
    display: flex; align-items: center; justify-content: space-between;
    z-index: 30;
  }

  /* ===== 主舞台：图片 + 检测框 · 居中突出 ===== */
  .stage {
    position: absolute;
    top: 100px;
    left: 28px; right: 28px;
    height: 580px;     /* 图片底顶到桃桃气泡上方，不留空白 */
  }
  .image-wrap {
    position: absolute; inset: 0;
    border-radius: 0; overflow: visible;
    transform: rotate(-1deg);
    transform-origin: center center;
    box-shadow:
      0 4px 8px -2px rgba(42,30,22,0.06),
      0 14px 32px -4px rgba(42,30,22,0.12);
    background: transparent;
  }
  .fruit-img {
    width: 100%; height: 100%; object-fit: contain; display: block;
    background: var(--bg);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .fruit-img.changing { opacity: 0.4; transform: scale(1.05); }
  #bboxContainer {
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: 5;
  }
  .bbox {
    position: absolute;
    border: 2px solid #e07040;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s ease;
    background: rgba(224,112,64,0.08);
    z-index: 6;
    pointer-events: auto;
    box-sizing: border-box;
  }
  .bbox:hover {
    border-color: #e07040;
    box-shadow: 0 0 12px rgba(224,112,64,0.4);
  }
  .bbox.active {
    border-color: #e07040;
    box-shadow: 0 0 0 2px #e07040, 0 0 12px rgba(224,112,64,0.5);
    background: rgba(224,112,64,0.10);
  }
  .bbox-label {
    position: absolute;
    top: -16px; left: -2px;
    background: #e07040;
    color: #fff;
    font-size: 8px;
    padding: 1px 5px;
    border-radius: 3px 3px 0 0;
    white-space: nowrap;
    font-weight: 500;
  }

  /* NO.1 徽章 — 单水果模式时挂在右上角 */
  .badge-top {
    position: absolute;
    top: 8px; right: 8px;
    background: linear-gradient(135deg, #d4a04e 0%, #b8813a 100%);
    color: #fff;
    font-size: 9px; font-weight: 700;
    padding: 3px 7px 3px 6px;
    border-radius: 10px;
    letter-spacing: 0.04em;
    box-shadow: 0 3px 8px rgba(184,129,58,0.45);
    display: flex; align-items: center; gap: 3px;
    z-index: 10;
  }
  .badge-top::after {
    content: '';
    position: absolute; bottom: -3px; right: 14px;
    width: 0; height: 0;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-top: 4px solid #b8813a;
  }
  .badge-top .crown { font-size: 9px; line-height: 1; }

  /* ===== 主图放大 · 居中突出 ===== */
  /* 详情全部走弹窗 */

  /* 底部双按钮 */
  .bottom-btns {
    position: absolute; left: 24px; right: 24px; bottom: 26px;
    display: flex; gap: 12px;
    z-index: 30;
  }
  .btn {
    flex: 1; height: 44px;
    border-radius: 22px;
    font-size: 11px;
    letter-spacing: 0.08em;
    display: flex; align-items: center; justify-content: center;
    text-decoration: none;
    transition: transform 0.15s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-secondary { background: var(--iconbg); color: var(--ink-soft); }
  .btn-primary { background: var(--brown); color: #fff; }

  /* ===== 最高分推荐（桃桃气泡，紧贴双按钮之上） ===== */
  .rec-bubble {
    position: absolute;
    left: 24px; right: 24px;
    bottom: 72px;
    display: flex; align-items: flex-start; gap: 8px;
    z-index: 30;
  }
  .rec-mascot {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: #fff;
    flex-shrink: 0;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .rec-mascot img { width: 100%; height: 100%; object-fit: contain; }
  .rec-bubble-body {
    flex: 1;
    background: #fff;
    border-radius: 14px;
    border-top-left-radius: 4px;
    padding: 10px 12px;
    font-size: 11.5px;
    line-height: 1.55;
    color: #3a2a20;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .rec-bubble-body > b { color: #7a4a36; font-weight: 600; }
  .rec-score {
    display: inline-block;
    background: #fdf3e0;
    color: #b87a3a;
    padding: 2px 7px;
    border-radius: 6px;
    font-size: 10.5px;
    margin-left: 4px;
    font-weight: 600;
  }

  /* ===== 候选详情弹窗 ===== */
  .modal-overlay {
    position: absolute; inset: 0;
    z-index: 200;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal-mask {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.35);
    animation: fadeIn 0.25s ease-out;
  }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  .bottom-sheet {
    position: relative;
    width: 390px;
    max-height: 80vh;
    background: #f5efe6;
    border-radius: 24px 24px 0 0;
    padding: 14px 16px 32px;
    overflow-y: auto;
    animation: slideUp 0.35s cubic-bezier(0.22,1,0.36,1);
    scrollbar-width: none;
  }
  .bottom-sheet::-webkit-scrollbar { display: none; }
  @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
  .drag-bar {
    width: 36px; height: 4px;
    border-radius: 2px; background: #d8cfc0;
    margin: 0 auto 12px;
  }
  .sheet-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .close-btn {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: #e8e0d5;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 14px; color: #9b8a79;
    border: none;
    transition: all 0.2s;
  }
  .close-btn:hover { background: #d8cfc0; color: var(--brown); }
  .sheet-title {
    display: flex; align-items: baseline; gap: 8px;
  }
  .sheet-title h2 {
    font-size: 16px; font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.01em;
    margin: 0;
  }
  .sheet-title .en {
    font-size: 9px; color: var(--soft);
    letter-spacing: 0.15em;
    font-weight: 500;
  }

  /* 弹窗内大卡：总分环 + 信息 */
  .modal-info-card {
    background: var(--card);
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(42,30,22,0.04);
  }
  .modal-info-row {
    display: flex; align-items: center; gap: 14px;
  }
  .score-ring {
    position: relative;
    width: 64px; height: 64px;
    flex-shrink: 0;
  }
  .score-ring svg { transform: rotate(-90deg); }
  .score-ring .value {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700;
    color: var(--brown);
    line-height: 1;
  }
  .modal-info-text { flex: 1; min-width: 0; }
  .modal-info-text h3 {
    font-size: 18px; font-weight: 700;
    color: var(--ink);
    margin: 0 0 2px;
    line-height: 1;
  }
  .modal-info-text .en {
    font-size: 8px; color: var(--soft);
    letter-spacing: 0.15em;
    display: block;
  }
  .modal-info-text .subtitle {
    font-size: 10px; color: var(--muted);
    margin-top: 4px;
  }
  .modal-info-text .reason {
    font-size: 10px; color: #9b6a52;
    font-style: italic;
    margin-top: 2px;
  }
  .modal-info-text .meta {
    display: flex; align-items: center; gap: 8px;
    margin-top: 8px;
    font-size: 9px;
  }
  .modal-info-text .score-tag {
    padding: 2px 8px;
    background: rgba(122,74,54,0.08);
    color: var(--brown);
    border-radius: 6px;
    font-weight: 600;
  }
  .modal-info-text .grade-text {
    font-weight: 600;
    letter-spacing: 0.04em;
  }

  /* 弹窗内雷达图 + 条形图 */
  .modal-radar-card {
    background: var(--card);
    border-radius: 20px;
    padding: 14px 16px;
    box-shadow: 0 2px 8px rgba(42,30,22,0.04);
  }
  .modal-radar-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .modal-radar-head h4 {
    font-size: 11px; color: var(--ink);
    font-weight: 600;
    letter-spacing: 0.08em;
    margin: 0;
  }
  .modal-radar-head .hint {
    font-size: 8px; color: var(--soft);
    letter-spacing: 0.05em;
  }
  .modal-radar-body {
    display: flex; align-items: center; gap: 12px;
  }
  .modal-radar-svg { width: 120px; height: 120px; flex-shrink: 0; }

  /* 弹窗内 5 维条形评分 */
  .bar-row {
    display: flex; align-items: center; gap: 8px;
    height: 22px;
    border-bottom: 1px dashed #e8e2d4;
  }
  .bar-row:last-child { border-bottom: none; }
  .bar-row .label {
    font-size: 10px; color: var(--muted);
    width: 38px; flex-shrink: 0;
    letter-spacing: 0.05em;
  }
  .bar-row .track {
    flex: 1 1 0%; min-width: 0;
    height: 6px;
    background: #f1ece4; border-radius: 3px;
    overflow: hidden;
  }
  .bar-row .fill {
    height: 100%; width: 0%;
    border-radius: 3px;
    transition: width 0.8s cubic-bezier(0.22,1,0.36,1);
  }
  /* 真实打开后立刻有占位宽度（headless 截图也能看到条形） */
  .bar-row .fill.preset { width: 80%; }
  .bar-row .val {
    font-size: 12px; font-weight: 700;
    width: 26px; text-align: right;
    flex-shrink: 0;
  }

  /* 雷达图动画 */
  @keyframes radarIn {
    from { opacity: 0; transform: scale(0.7); }
    to { opacity: 1; transform: scale(1); }
  }
  .radar-animate { animation: radarIn 0.5s ease-out both; }

  /* ===== 识别成功弹窗（桃桃 + 蜜瓜胶囊） ===== */
  .success-toast {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: #ffffff;
    border-radius: 24px;
    padding: 16px 20px 18px;
    display: flex; flex-direction: column;
    align-items: stretch;
    box-shadow: 0 20px 50px rgba(42,30,22,0.25);
    z-index: 80;
    width: 260px;
    text-align: left;
    pointer-events: none;
  }
  .success-toast.show {
    animation: successPop 2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  @keyframes successPop {
    0%   { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    15%  { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
    22%  { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    85%  { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(0.7); opacity: 0; }
  }
  .success-mascot {
    position: relative;
    width: 52px; height: 52px;
    flex-shrink: 0;
  }
  .success-mascot-img {
    width: 52px;
    height: 52px;
    object-fit: contain;
    display: block;
    flex-shrink: 0;
  }
  .success-mascot-wrap {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 12px;
    text-align: left;
    margin-bottom: 12px;
  }
  .success-copy {
    flex: 1;
    min-width: 0;
  }
  .success-toast {
    align-items: stretch;
    padding: 16px 20px 18px;
    width: 260px;
  }
  .success-copy {
    display: flex;
    flex-direction: column;
  }
  .success-line-1 {
    font-size: 11px;
    color: var(--ok);
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .success-line-2 {
    font-size: 14px;
    color: var(--ink);
    font-weight: 600;
    margin-top: 2px;
  }
  .success-progress {
    height: 3px;
    background: var(--iconbg);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 4px;
  }
  .success-progress-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, var(--ok), #5fa884);
    border-radius: 2px;
    transform-origin: left;
    transform: scaleX(0);
    animation: successBar 0.6s 0.2s cubic-bezier(0.65, 0, 0.35, 1) forwards;
  }
  @keyframes successBar {
    to { transform: scaleX(1); }
  }
  .success-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 11px;
    color: var(--muted);
    border-top: 1px dashed #e8e2d6;
    padding-top: 10px;
    margin-top: 10px;
  }
  .success-check {
    width: 14px;
    height: 14px;
    background: var(--ok);
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 9px;
    line-height: 1;
    transform: scale(0);
    animation: successCheck 0.4s 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  @keyframes successCheck {
    to { transform: scale(1); }
  }
</style>
</head>
<body>
  <div class="phone">
    <div class="notch"></div>
    <div class="status-bar">
      <span>9:41</span>
      <span style="font-size:10px;">●●●</span>
      <span style="font-size:10px;">📶</span>
    </div>

    <!-- 顶部导航 -->
    <div class="top-nav">
      <a href="scan.html" class="w-9 h-9 rounded-full bg-white flex items-center justify-center shadow-sm">
        <span class="text-[#3a2a20] text-sm">←</span>
      </a>
      <div class="text-[10px] text-[#b8a797] tracking-[0.2em] font-medium">SCAN RESULT</div>
      <div id="timerBadge" class="flex items-center gap-1 px-2.5 h-7 rounded-full bg-white shadow-sm" style="display:none;">
        <span class="w-1.5 h-1.5 rounded-full bg-[#3f8a6b]"></span>
        <span id="timerText" class="text-[9px] text-[#3a2a20] tracking-wider">--</span>
      </div>
    </div>

    <!-- 主舞台：图片 + 检测框 -->
    <div class="stage">
      <div class="image-wrap">
        <img class="fruit-img" id="mainImg" src="../picture/peach.png" alt="识别图片" />
        <div id="bboxContainer"></div>
        <div class="badge-top" id="no1Badge" style="display:none;">
          <span class="crown">👑</span>NO.1
        </div>
      </div>
    </div>

    <!-- 调试面板：尺寸/坐标对比（2026-06-18 临时加） -->
    <div id="debugPanel" style="position:absolute;bottom:80px;left:8px;right:8px;z-index:999;
      background:rgba(20,16,12,0.92);color:#e6dccf;font-size:9px;line-height:1.4;
      padding:8px 10px;border-radius:8px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      max-height:180px;overflow:auto;white-space:pre-wrap;word-break:break-all;">⏳ 调试面板加载中…</div>

    <!-- 主图区 · 不再有大白卡，详情全部走弹窗 -->

    <!-- 最高分推荐条（桃桃气泡） -->
    <div class="rec-bubble" id="recBubble">
      <div class="rec-mascot">
        <img src="assets/litchi.png" alt="桃桃">
      </div>
      <div class="rec-bubble-body">
        <b>桃桃：</b>果果帮已经结合你的 <b>饮食习惯</b>、<b>健康情况</b> 等数据，帮你挑出了最优秀的水果<span class="rec-score" id="recScore">蜜瓜 9.6</span>
      </div>
    </div>

    <!-- 底部双按钮 -->
    <div class="bottom-btns">
      <a href="scan.html" class="btn btn-secondary">再拍一张</a>
      <a href="paimomo.html" class="btn btn-primary">查看详情</a>
    </div>

    <div class="home-indicator"></div>

    <!-- ===== 识别成功弹窗 ===== -->
    <div id="successToast" class="success-toast" aria-hidden="true">
      <div class="success-mascot-wrap">
        <img class="success-mascot-img" src="assets/litchi.png" alt="水果角色">
        <div class="success-copy">
          <div class="success-line-1">识别成功 · <span id="successCount">1/1</span></div>
          <div class="success-line-2">发现新水果</div>
        </div>
      </div>
      <div class="success-progress"><div class="success-progress-fill"></div></div>
      <div class="success-row">
        <span class="success-check">✓</span>
        <span>已加入图鉴</span>
      </div>
    </div>

    <!-- ===== 候选详情弹窗 ===== -->
    <div id="modalOverlay" class="modal-overlay">
      <div class="modal-mask" onclick="closeModal()"></div>
      <div class="bottom-sheet">
        <div class="drag-bar"></div>
        <div class="sheet-head">
          <div class="sheet-title">
            <h2 id="modalFruitName">—</h2>
            <span class="en" id="modalEnName"></span>
          </div>
          <button class="close-btn" onclick="closeModal()">✕</button>
        </div>

        <!-- 水果信息卡 -->
        <div class="modal-info-card">
          <div class="modal-info-row">
            <div class="score-ring">
              <svg width="64" height="64" viewBox="0 0 64 64">
                <circle cx="32" cy="32" r="28" fill="none" stroke="#f1ece4" stroke-width="5"/>
                <circle id="modalScoreArc" cx="32" cy="32" r="28" fill="none" stroke="#7a4a36" stroke-width="5"
                  stroke-linecap="round" stroke-dasharray="0 176" transform="rotate(-90 32 32)"/>
              </svg>
              <span class="value" id="modalScoreValue">--</span>
            </div>
            <div class="modal-info-text">
              <h3 id="modalFruitName2">—</h3>
              <span class="en" id="modalEnName2"></span>
              <p class="subtitle" id="modalSubtitle">—</p>
              <p class="reason" id="modalReason" style="display:none;"></p>
              <div class="meta">
                <span class="score-tag" id="modalScoreTag">—</span>
                <span class="grade-text" id="modalGrade">—</span>
              </div>
            </div>
          </div>
        </div>

        <!-- 分维度评分卡 -->
        <div class="modal-radar-card">
          <div class="modal-radar-head">
            <h4>分维度评分</h4>
            <span class="hint">光泽 · 新鲜 · 色泽 · 形状 · 成熟</span>
          </div>
          <div class="modal-radar-body">
            <svg class="modal-radar-svg radar-animate" viewBox="-55 -55 110 110" id="modalRadarSvg" style="animation-delay:0.05s;">
              <polygon points="0,-40 38,-12 23.5,32.4 -23.5,32.4 -38,-12" fill="none" stroke="#f1ece4" stroke-width="0.8"/>

<script>

try {

};

// 当前选中的水果索引（豆包模式）
var selectedFruitIndex = 0;

// ================================================================
// 1. 分数归一化：自动检测 0-10 / 0-100 评分制
// ================================================================
function isTenScale(scores) {
  var dims = ['gloss', 'freshness', 'color', 'shape', 'ripeness'];
  for (var i = 0; i < dims.length; i++) {
    var v = scores[dims[i]];
    if (v != null && v > 10) return false;
  }
  return true;
}

function normalizeScores(scores, finalScore) {
  var dims = ['gloss', 'freshness', 'color', 'shape', 'ripeness'];
  var tenScale = isTenScale(scores || {});
  var out = {};
  dims.forEach(function(d) {
    var v = (scores || {})[d];
    if (v == null) v = tenScale ? 5 : 50;
    out[d] = v;
  });
  var fs = finalScore != null ? finalScore : 0;
  if (fs > 0) {
    out.overall = fs;
  } else {
    var sum = 0;
    dims.forEach(function(d) { sum += out[d]; });
    out.overall = sum / 5;
  }
  out._tenScale = tenScale;
  return out;
}

function toPct(value, tenScale) {
  return tenScale ? value * 10 : value;
}

// 获取当前水果的归一化分数
function getCurrentScores() {
  if (!apiResult) {
    return { overall: 5, gloss: 5, freshness: 5, color: 5, shape: 5, ripeness: 5, _tenScale: true };
  }
  if (apiResult.fruits && apiResult.fruits.length > 0) {
    var f = apiResult.fruits[selectedFruitIndex] || apiResult.fruits[0];
    return normalizeScores(f.scores || {}, f.final_score);
  }
  return normalizeScores(apiResult.scores || {}, apiResult.final_score);
}

// ================================================================
// 2. 主流程：填充数据
// ================================================================
var topScore = 0;     // 用于 NO.1 徽章
var bestIdx = 0;      // 最高分索引

if (apiResult && apiResult.success) {
  // 计算最高分（用于 NO.1 徽章）
  if (apiResult.fruits && apiResult.fruits.length > 0) {
    apiResult.fruits.forEach(function(f, i) {
      if ((f.final_score || 0) > topScore) { topScore = f.final_score; bestIdx = i; }
    });
  } else {
    topScore = apiResult.final_score || 0;
  }

  // 顶部耗时
  var loadTime = localStorage.getItem('scanTotalTime') || localStorage.getItem('scanLoadTime');
  if (loadTime) {
    var sec = parseFloat(loadTime);
    var timerEl = document.getElementById('timerBadge');
    var timerText = document.getElementById('timerText');
    if (timerEl) timerEl.style.display = '';
    if (timerText) {
      timerText.textContent = sec >= 60
        ? Math.floor(sec/60) + '分' + Math.floor(sec%60) + '秒'
        : sec.toFixed(1) + 's';
    }
  }

  // 替换主图（如果接口带了 imageDataURL）
  var imgPath = localStorage.getItem('scanImagePath');
  if (imgPath) {
    var imgEl = document.getElementById('mainImg');
    if (imgEl) imgEl.src = imgPath;
  }

  var engine = apiResult.engine || 'baidu';
  // 2026-06-17 更新：进入页面不再自动弹详情，改由桃桃"识别成功"弹窗承担入场反馈
  // 用户需点击底部"查看详情"按钮才打开详情弹窗
  if (engine === 'doubao' && apiResult.fruits && apiResult.fruits.length > 0) {
    // ============ 豆包模式：多水果 ============
    selectedFruitIndex = 0;
    drawBoundingBoxes(apiResult.fruits);
    document.getElementById('no1Badge').style.display = 'flex';
  } else {
    // ============ 百度模式：单水果 ============
    document.getElementById('no1Badge').style.display = 'flex';
  }

  // ============ 2026-06-18 调试面板：填充三组尺寸 + position ============
  fillDebugPanel();
} else {
  // 无接口数据 → 显示占位（主图保持默认）
}

// ================================================================
// 3. 豆包模式：选择水果（仅用于切换 bbox 高亮 + 打开弹窗）
// ================================================================
function selectFruit(index) {
  selectedFruitIndex = index;
  // 更新 bbox 高亮
  var boxes = document.querySelectorAll('.bbox');
  boxes.forEach(function(b, i) {
    b.className = 'bbox' + (i === index ? ' active' : '');
  });
}

function formatScore(val, tenScale) {
  if (tenScale) return val.toFixed(1);
  return Math.round(val);
}

function computeGrade(overall, tenScale) {
  var g = { text: '较差', color: '#c0392b' };
  if (tenScale) {
    if (overall >= 9) { g.text = '极佳'; g.color = '#2d8a4e'; }
    else if (overall >= 8) { g.text = '优秀'; g.color = '#3f8a6b'; }
    else if (overall >= 6) { g.text = '良好'; g.color = '#b8860b'; }
    else if (overall >= 4) { g.text = '一般'; g.color = '#c0392b'; }
  } else {
    if (overall >= 90) { g.text = '极佳'; g.color = '#2d8a4e'; }
    else if (overall >= 80) { g.text = '优秀'; g.color = '#3f8a6b'; }
    else if (overall >= 60) { g.text = '良好'; g.color = '#b8860b'; }
    else if (overall >= 40) { g.text = '一般'; g.color = '#c0392b'; }
  }
  return g;
}

// ================================================================
// 4. 雷达图 + 条形图更新
// ================================================================
var RADAR_ANGLES = [
  { x: 0,         y: -1 },
  { x: 0.951,     y: -0.309 },
  { x: 0.588,     y:  0.809 },
  { x: -0.588,    y:  0.809 },
  { x: -0.951,    y: -0.309 },
];
var RADAR_RADIUS = 40;

// ================================================================
// 5. 检测框绘制（豆包多水果）
// ================================================================

// ================================================================
// 5. 检测框绘制（豆包多水果）
// ================================================================
function drawBoundingBoxes(fruits) {
  var container = document.getElementById('bboxContainer');
  var img = document.getElementById('mainImg');
  container.innerHTML = '';
  function doDraw() {
    var imgW = img.clientWidth, imgH = img.clientHeight;
    var natW = img.naturalWidth || 1000, natH = img.naturalHeight || 1000;
    // 2026-06-18 修复：
    // 豆包返回的 position 坐标系不稳定（可能基于 1000×1000 想象，或超出图片实际范围），
    // 不能用 cover（max 缩放 + 长边裁切）—会把超出范围的部分按更大比例放大，
    // 导致框跑到图片外。
    // 改用 contain（min 缩放 + 短边留白）：图片整张放进容器，坐标系按图片实际像素，
    // 配合下面的坐标 clip 兜底，框一定在图片内。
    var scale = Math.min(imgW / natW, imgH / natH);
    var offX = (imgW - natW * scale) / 2;
    var offY = (imgH - natH * scale) / 2;
    fruits.forEach(function(f, i) {
      var pos = f.position;
      if (!pos || pos.length < 4) return;
      var x1 = pos[0], y1 = pos[1], x2 = pos[2], y2 = pos[3];
      // 坐标系兜底：clip 到图片实际像素范围内，避免框跑到图片外
      x1 = Math.max(0, Math.min(x1, natW));
      y1 = Math.max(0, Math.min(y1, natH));
      x2 = Math.max(0, Math.min(x2, natW));
      y2 = Math.max(0, Math.min(y2, natH));
      if (x2 <= x1 || y2 <= y1) return;  // 坐标全在图外/退化，跳过
      var left = x1 * scale + offX;
      var top = y1 * scale + offY;
      var width = (x2 - x1) * scale;
      var height = (y2 - y1) * scale;
      // 视觉边距：框外侧留 2px，避免贴边
      left = Math.max(0, left); top = Math.max(0, top);
      width = Math.min(width, imgW - left); height = Math.min(height, imgH - top);
      var box = document.createElement('div');
      box.className = 'bbox' + (i === 0 ? ' active' : '');
      box.style.cssText = 'left:' + left + 'px;top:' + top + 'px;width:' + width + 'px;height:' + height + 'px;';
      box.innerHTML = '<div class="bbox-label">' + (f.category || '') + ' ' + (f.final_score || 0) + '</div>';
      box.addEventListener('click', function(e) {
        e.stopPropagation();
        selectFruit(i);
        openModal(i);
      });
      container.appendChild(box);
    });
  }
  if (img.complete && img.naturalWidth > 0) doDraw();
  else img.addEventListener('load', doDraw);
  // 重绘时机：窗口尺寸变化
  window.addEventListener('resize', function() {
    if (apiResult && apiResult.fruits) drawBoundingBoxes(apiResult.fruits);
  });
}

// ================================================================
// 5.5 调试面板（2026-06-18 临时）
// 把"上传原图尺寸 / 压缩后尺寸（结果页用的图）/ 豆包返回的 position"全部打印出来
// ================================================================
function fillDebugPanel() {
  var panel = document.getElementById('debugPanel');
  if (!panel) return;

  var img = document.getElementById('mainImg');
  var lines = [];

  // ---- 1) 用户上传的原图（scan-loading.html 在压缩前存的）----
  var origSize = localStorage.getItem('scanOriginalSize') || '未记录';
  var compSize = localStorage.getItem('scanCompressedSize') || '未记录';
  lines.push('━━━ 原图（用户上传）━━━');
  lines.push(origSize);

  // ---- 2) 压缩后的图（即送到豆包的那张，结果页显示的也是这张）----
  var displayNatW = img.naturalWidth, displayNatH = img.naturalHeight;
  var displayRenderW = img.clientWidth, displayRenderH = img.clientHeight;
  lines.push('━━━ 压缩图（送豆包 + 结果页）━━━');
  lines.push(compSize + '  (localStorage 记录)');
  lines.push('naturalWidth × Height: ' + displayNatW + ' × ' + displayNatH);
  lines.push('clientWidth × Height : ' + displayRenderW + ' × ' + displayRenderH);

  // ---- 3) 豆包返回的 position ----
  if (apiResult && apiResult.fruits) {
    lines.push('━━━ 豆包返回 position ━━━');
    apiResult.fruits.forEach(function(f, i) {
      var p = f.position || [];
      var inside = (p[0] >= 0 && p[1] >= 0 && p[2] <= displayNatW && p[3] <= displayNatH);
      var flag = inside ? '✅ 在图内' : '❌ 超出图范围';
      lines.push('[' + i + '] ' + (f.category || '?') + ': [' +
        p[0] + ', ' + p[1] + ', ' + p[2] + ', ' + p[3] + ']  ' + flag);
    });
  } else {
    lines.push('⚠️ apiResult.fruits 为空');
  }

  // ---- 4) 简单判断坐标系 ----
  if (apiResult && apiResult.fruits && apiResult.fruits[0] && apiResult.fruits[0].position) {
    var p0 = apiResult.fruits[0].position;
    var maxX = Math.max(p0[0], p0[2]);
    var maxY = Math.max(p0[1], p0[3]);
    var guess = [];
    if (maxX > displayNatW * 1.05 || maxY > displayNatH * 1.05) {
      guess.push('坐标 > 图片像素 → 豆包可能按 1000×1000 或其它想象坐标系返回');
    }
    if (guess.length) lines.push('💡 ' + guess.join('；'));
  }

  panel.textContent = lines.join('\n');

  // 图片加载完成后，再刷新一次（保证 naturalWidth 已就绪）
  if (!img.complete || img.naturalWidth === 0) {
    img.addEventListener('load', fillDebugPanel, { once: true });
  }
}

// ================================================================
// 6. 候选详情弹窗
// ================================================================
function openModal(fruitIndex) {
  if (!apiResult || !apiResult.success) return;

  var fruitData, scores, overall, fruitName, enName, reason, finalScore, modalTenScale;
  if (apiResult.engine === 'doubao' && apiResult.fruits && apiResult.fruits.length > 0) {
    var idx = fruitIndex >= 0 ? fruitIndex : selectedFruitIndex;
    fruitData = apiResult.fruits[idx];
    if (!fruitData) return;
    scores = normalizeScores(fruitData.scores || {}, fruitData.final_score);
    modalTenScale = scores._tenScale;
    overall = scores.overall || (modalTenScale ? 5 : 50);
    fruitName = fruitData.category || fruitData.fruitName || '未知水果';
    enName = fruitData.enName || '';
    reason = fruitData.reason || '';
    finalScore = fruitData.final_score || 0;
  } else {
    fruitName = apiResult.fruitName || '未知水果';
    enName = apiResult.enName || '';
    scores = normalizeScores(apiResult.scores || {}, apiResult.final_score);
    modalTenScale = scores._tenScale;
    overall = scores.overall || (modalTenScale ? 5 : 50);
    reason = '';
    finalScore = overall;
  }

  // 标题
  document.getElementById('modalFruitName').textContent = fruitName;
  document.getElementById('modalEnName').textContent = enName;
  document.getElementById('modalFruitName2').textContent = fruitName;
  document.getElementById('modalEnName2').textContent = enName;
  document.getElementById('modalSubtitle').textContent = FRUIT_SUBTITLE[fruitName] || '新鲜好果 · 品质甄选';

  // 理由
  var mrEl = document.getElementById('modalReason');
  if (reason && reason.trim()) {
    mrEl.textContent = '💬 ' + reason.trim();
    mrEl.style.display = '';
  } else {
    mrEl.style.display = 'none';
  }

  // 分数环
  var circumference = 2 * Math.PI * 28;
  var overallPct = toPct(overall, modalTenScale);
  var arcLen = circumference * (overallPct / 100);
  var arc = document.getElementById('modalScoreArc');
  if (arc) {
    arc.setAttribute('stroke-dasharray', '0 ' + circumference.toFixed(1));
    setTimeout(function() {
      arc.setAttribute('stroke-dasharray', arcLen.toFixed(1) + ' ' + circumference.toFixed(1));
    }, 80);
  }
  document.getElementById('modalScoreValue').textContent = formatScore(overall, modalTenScale);

  // 评分标签
  document.getElementById('modalScoreTag').textContent = finalScore + (modalTenScale ? '/10' : '/100');

  // 等级
  var gInfo = computeGrade(overall, modalTenScale);
  var gEl = document.getElementById('modalGrade');
  gEl.textContent = gInfo.text;
  gEl.style.color = gInfo.color;

  // 雷达图 + 条形图
  updateModalRadar(scores);
  updateModalBars(scores);

  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

function updateModalRadar(scores) {
  var tenScale = scores._tenScale;
  var maxVal = tenScale ? 10 : 100;
  var values = [scores.gloss, scores.freshness, scores.color, scores.shape, scores.ripeness];
  var area = document.getElementById('modalRadarArea');
  var dots = [0,1,2,3,4].map(function(i) { return document.getElementById('modalDot' + i); });
  var cur = area.getAttribute('points').split(' ').map(function(s) {
    var xy = s.split(',').map(Number);
    return { x: xy[0], y: xy[1] };
  });
  var target = values.map(function(v, i) {
    var r = RADAR_RADIUS * ((v || 0) / maxVal);
    return { x: RADAR_ANGLES[i].x * r, y: RADAR_ANGLES[i].y * r };
  });
  var start = performance.now();
  var duration = 500;
  function tick(now) {
    var t = Math.min(1, (now - start) / duration);
    var e = 1 - Math.pow(1 - t, 3);
    var interp = cur.map(function(c, i) {
      return { x: c.x + (target[i].x - c.x) * e, y: c.y + (target[i].y - c.y) * e };
    });
    area.setAttribute('points', interp.map(function(p) { return p.x.toFixed(2) + ',' + p.y.toFixed(2); }).join(' '));
    dots.forEach(function(d, i) {
      d.setAttribute('cx', interp[i].x.toFixed(2));
      d.setAttribute('cy', interp[i].y.toFixed(2));
    });
    if (t < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function updateModalBars(scores) {
  var tenScale = scores._tenScale;
  var dims = [
    { key: 'gloss',     bar: 'modalBar0', val: 'modalVal0' },
    { key: 'freshness', bar: 'modalBar1', val: 'modalVal1' },
    { key: 'color',     bar: 'modalBar2', val: 'modalVal2' },
    { key: 'shape',     bar: 'modalBar3', val: 'modalVal3' },
    { key: 'ripeness',  bar: 'modalBar4', val: 'modalVal4' },
  ];
  dims.forEach(function(d, i) {
    var v = scores[d.key] || (tenScale ? 5 : 50);
    var barPct = toPct(v, tenScale);
    setTimeout(function() {
      document.getElementById(d.bar).style.width = Math.max(2, Math.min(100, barPct)) + '%';
      document.getElementById(d.val).textContent = tenScale ? v.toFixed(1) : Math.round(v);
    }, 50 + i * 80);
  });
}

// 键盘左右切换
document.addEventListener('keydown', function(e) {
  if (!apiResult || !apiResult.fruits || apiResult.fruits.length === 0) return;
  if (e.key === 'ArrowRight') {
    var next = (selectedFruitIndex + 1) % apiResult.fruits.length;
    selectFruit(next);
  }
  if (e.key === 'ArrowLeft') {
    var prev = (selectedFruitIndex - 1 + apiResult.fruits.length) % apiResult.fruits.length;
    selectFruit(prev);
  }
});

/* ===== 识别成功弹窗：进入页面 0.3s 后弹出，2s 后自动消失 ===== */
(function () {
  var toast = document.getElementById('successToast');
  var sub = document.getElementById('successSub');
  if (!toast) return;
  // 尝试用实际识别数量 / 水果名填充副标题（兼容 apiResult）
  try {
    if (typeof apiResult !== 'undefined' && apiResult && apiResult.fruits) {
      var total = apiResult.fruits.length;
      var name = (apiResult.fruits[0] && apiResult.fruits[0].name) || '水果';
      if (sub) sub.textContent = '已识别到 ' + total + ' 个' + name;
    }
  } catch (e) { /* keep default text */ }
  setTimeout(function () { toast.classList.add('show'); }, 300);
})();
</script>
