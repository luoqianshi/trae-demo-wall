<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>个人健康 — 果果帮</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#ede8e1;
    --card:#ffffff;
    --ink:#2a1e16;
    --ink-soft:#3a2a20;
    --muted:#6b574a;
    --muted-light:#b8a797;
    --ok:#3f8a6b;
    --brown:#7a4a36;
    --brown-text:#ffffff;
    --warm:#f1ece4;
    --gold:#d4a853;
    --red-soft:#e57373;
    --blue-soft:#64b5f6;
    --green-soft:#81c784;
    --orange-soft:#ffb74d;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#cfc8bf;
    display:flex;justify-content:center;align-items:center;
    min-height:100vh;
  }

  /* iPhone frame */
  .phone{
    position:relative;
    width:390px;height:844px;
    background:var(--bg);
    border-radius:48px;
    box-shadow:
      0 0 0 10px #1a1a1a,
      0 0 0 11px #2a2a2a,
      0 30px 60px rgba(0,0,0,.25);
    overflow:hidden;
    display:flex;flex-direction:column;
  }
  .phone::before{
    content:"";position:absolute;top:11px;left:50%;transform:translateX(-50%);
    width:120px;height:34px;background:#000;border-radius:20px;z-index:99;
  }

  /* Status bar */
  .statusbar{
    height:54px;padding:18px 32px 0;
    display:flex;justify-content:space-between;align-items:center;
    font-size:15px;font-weight:600;color:#1a1a1a;
    position:relative;z-index:2;flex-shrink:0;
  }
  .statusbar .right{display:flex;align-items:center;gap:6px;}
  .battery{
    width:26px;height:12px;border:1.2px solid #1a1a1a;border-radius:3px;position:relative;
    display:inline-flex;align-items:center;padding:1px;
  }
  .battery::after{
    content:"";position:absolute;right:-3px;top:3px;width:2px;height:4px;background:#1a1a1a;border-radius:0 1px 1px 0;
  }
  .battery .fill{display:block;width:88%;height:100%;background:#1a1a1a;border-radius:1px;}

  /* Top bar with back */
  .top-bar{
    padding:8px 18px 0;
    display:flex;align-items:center;
    gap:12px;flex-shrink:0;
  }
  .back-btn{
    width:36px;height:36px;border-radius:50%;background:#fff;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.03);cursor:pointer;
    transition:transform .15s ease;text-decoration:none;
  }
  .back-btn:active{transform:scale(.93);}
  .back-btn svg{width:18px;height:18px;color:var(--ink);}
  .top-title{
    font-size:19px;font-weight:700;color:var(--ink);
    flex:1;text-align:center;margin-right:36px;
  }

  /* Scrollable content */
  .page-scroll{
    flex:1;overflow-y:auto;padding:0 18px 90px;
    -webkit-overflow-scrolling:touch;
  }
  .page-scroll::-webkit-scrollbar{width:0;}

  /* ===== Welcome Dialog ===== */
  .dialog-overlay{
    position:absolute;inset:0;
    background:rgba(42,30,22,.45);
    z-index:50;display:flex;
    align-items:center;justify-content:center;
    opacity:0;pointer-events:none;
    transition:opacity .35s ease;
  }
  .dialog-overlay.show{opacity:1;pointer-events:auto;}

  .dialog-card{
    background:#fff;
    border-radius:28px;
    padding:32px 24px 24px;
    width:320px;
    box-shadow:0 20px 50px rgba(42,30,22,.18);
    text-align:center;
    transform:translateY(20px);
    transition:transform .4s cubic-bezier(.34,1.56,.64,1);
  }
  .dialog-overlay.show .dialog-card{transform:translateY(0);}

  .dialog-icon{
    width:72px;height:72px;border-radius:50%;
    background:linear-gradient(135deg,#f1ece4,#e8dfd3);
    margin:0 auto 16px;
    display:flex;align-items:center;justify-content:center;
  }
  .dialog-icon svg{width:40px;height:40px;color:var(--brown);}
  .dialog-title{
    font-size:22px;font-weight:700;color:var(--ink);
    margin-bottom:8px;
  }
  .dialog-desc{
    font-size:14px;color:var(--muted);
    line-height:1.6;margin-bottom:24px;
  }
  .dialog-btns{display:flex;gap:10px;}
  .btn-primary{
    flex:1;height:48px;border-radius:26px;
    background:var(--brown);color:#fff;
    font-size:15px;font-weight:600;
    border:none;cursor:pointer;
    letter-spacing:.5px;
    transition:transform .15s ease,box-shadow .15s ease;
    box-shadow:0 4px 12px rgba(122,74,54,.25);
  }
  .btn-primary:active{transform:scale(.96);}
  .btn-secondary{
    flex:1;height:48px;border-radius:26px;
    background:var(--warm);color:var(--ink);
    font-size:15px;font-weight:600;
    border:none;cursor:pointer;
    transition:transform .15s ease;
  }
  .btn-secondary:active{transform:scale(.96);}

  /* ===== Questionnaire Overlay ===== */
  .quiz-overlay{
    position:absolute;inset:0;
    background:var(--bg);
    z-index:55;display:flex;
    flex-direction:column;
    transform:translateX(100%);
    transition:transform .4s cubic-bezier(.4,0,.2,1);
  }
  .quiz-overlay.show{transform:translateX(0);}

  .quiz-header{
    padding:60px 18px 0;
    display:flex;align-items:center;
    gap:12px;flex-shrink:0;
  }
  .quiz-back{
    width:36px;height:36px;border-radius:50%;background:#fff;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.03);cursor:pointer;
    transition:transform .15s ease;
  }
  .quiz-back:active{transform:scale(.93);}
  .quiz-back svg{width:18px;height:18px;color:var(--ink);}
  .quiz-progress-wrap{flex:1;margin-right:36px;}
  .quiz-step-label{
    font-size:12px;color:var(--muted-light);
    margin-bottom:6px;display:flex;justify-content:space-between;
  }
  .quiz-step-label span{font-weight:600;color:var(--brown);}
  .quiz-bar{
    height:4px;border-radius:2px;
    background:#e8dfd3;overflow:hidden;
  }
  .quiz-bar-fill{
    height:100%;border-radius:2px;
    background:var(--brown);
    transition:width .5s cubic-bezier(.4,0,.2,1);
  }

  .quiz-body{
    flex:1;overflow-y:auto;
    padding:24px 24px 30px;
    -webkit-overflow-scrolling:touch;
  }
  .quiz-body::-webkit-scrollbar{width:0;}

  .quiz-question{
    font-size:22px;font-weight:700;color:var(--ink);
    margin-bottom:8px;line-height:1.4;
  }
  .quiz-hint{
    font-size:13px;color:var(--muted-light);
    margin-bottom:24px;
  }

  /* Questionnaire card wrapper */
  .quiz-stage{
    background:#f7f4ec;
    border-radius:20px;
    padding:20px 16px 18px;
    box-shadow:0 4px 16px rgba(0,0,0,.04);
    position:relative;overflow:visible;
  }
  .quiz-badge{
    position:absolute;
    top:-13px;left:16px;
    font-size:12px;font-weight:500;
    color:#b8a08a;
    background:#f7f4ec;
    padding:2px 8px;
    border-radius:6px;
    border:1px solid #e8d5c4;
    z-index:1;
  }
  .quiz-peach{
    position:absolute;
    top:-36px;right:-24px;
    width:72px;height:72px;
    object-fit:contain;
    z-index:2;
    filter:drop-shadow(0 3px 6px rgba(0,0,0,.08));
    pointer-events:none;
  }

  /* Age card grid (2 cols) */
  .age-grid{
    display:grid;grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .age-card{
    border:2px solid #e8d5c4;
    border-radius:14px;
    background:#fff;cursor:pointer;
    padding:13px 11px;
    text-align:center;
    transition:all .25s ease;
    user-select:none;
    position:relative;
  }
  .age-card .age-range{
    font-size:11px;color:#b8a08a;
    margin-bottom:4px;
  }
  .age-card .age-name{
    font-size:16px;font-weight:600;color:var(--muted);
    margin-bottom:6px;
    transition:color .25s ease;
  }
  .age-card .age-tip{
    font-size:10px;color:#c5baa9;
    line-height:1.5;
  }
  .age-card.selected{
    border:2.5px solid var(--brown);
    background:#fdf9f5;
  }
  .age-card.selected .age-name{color:var(--brown);}
  .age-card .age-check{
    position:absolute;top:6px;right:6px;
    width:18px;height:18px;border-radius:50%;
    background:var(--brown);
    display:none;align-items:center;justify-content:center;
  }
  .age-card.selected .age-check{display:flex;}
  .age-check svg{width:11px;height:11px;}

  /* Gender cards (side by side) */
  .gender-stage{
    background:#f7f4ec;
    border-radius:20px;
    padding:20px 16px 18px;
    box-shadow:0 4px 16px rgba(0,0,0,.04);
    position:relative;overflow:visible;
    display:flex;gap:12px;
  }
  .gender-card-new{
    flex:1;
    border:2px solid #e8d5c4;
    border-radius:16px;
    padding:14px 10px 10px;
    text-align:center;
    background:#fff;
    cursor:pointer;
    position:relative;
    transition:all .25s ease;
  }
  .gender-card-new.selected{
    border:2.5px solid var(--brown);
    background:#fdf9f5;
  }
  .gender-card-new .card-check{
    position:absolute;top:8px;right:8px;
    width:20px;height:20px;border-radius:50%;
    background:var(--brown);
    display:none;align-items:center;justify-content:center;
  }
  .gender-card-new.selected .card-check{display:flex;}
  .card-check svg{width:12px;height:12px;}
  .gender-card-new .card-img{
    width:56px;height:56px;
    margin:6px auto 6px;
    border-radius:50%;
    object-fit:contain;
    background:#f0e8db;
    padding:6px;
  }
  .gender-card-new .card-label{
    font-size:15px;font-weight:500;color:#8a7a6a;
  }
  .gender-card-new.selected .card-label{
    font-weight:600;color:var(--brown);
  }

  .step-disclaimer{
    text-align:center;
    font-size:11px;
    color:#c5baa9;
    line-height:1.6;
    margin-top:14px;
    padding:0 8px;
    letter-spacing:0.2px;
  }

  /* Disease checkboxes */
  .disease-grid{
    display:grid;grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .disease-tag{
    padding:12px 10px;border-radius:12px;
    border:2px solid #e8d5c4;
    background:#fff;cursor:pointer;
    text-align:center;
    font-size:14px;font-weight:500;color:var(--muted);
    transition:all .25s ease;
    user-select:none;
  }
  .disease-tag.checked{
    border:2.5px solid var(--brown);
    background:#fdf9f5;
    color:var(--brown);font-weight:600;
  }
  .disease-tag.none.checked{
    border-color:var(--ok);
    background:#f2f8f4;
    color:var(--ok);
  }

  /* Taste preferences */
  .taste-grid{
    display:grid;grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .taste-tag{
    padding:12px 10px;border-radius:12px;
    border:2px solid #e8d5c4;
    background:#fff;cursor:pointer;
    text-align:center;
    font-size:14px;font-weight:500;color:var(--muted);
    transition:all .25s ease;
    user-select:none;
  }
  .taste-tag.checked{
    border:2.5px solid var(--brown);
    background:#fdf9f5;
    color:var(--brown);font-weight:600;
  }

  .quiz-footer{
    padding:0 24px 34px;flex-shrink:0;
    display:flex;align-items:center;
  }
  .quiz-footer.step1{justify-content:space-between;}
  .quiz-footer.step2-3{justify-content:space-between;}
  .quiz-footer.step4{justify-content:space-between;}
  .quiz-arrow-btn{
    width:50px;height:50px;border-radius:50%;
    border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .2s ease;
    background:var(--brown);
    box-shadow:0 4px 14px rgba(122,74,54,.28);
  }
  .quiz-arrow-btn svg{width:22px;height:22px;color:#fff;stroke:#fff;}
  .quiz-arrow-btn:active{transform:scale(.92);}
  .quiz-arrow-btn:disabled{
    opacity:.35;pointer-events:none;
    box-shadow:none;
  }
  .quiz-skip-text{
    font-size:15px;color:var(--muted);cursor:pointer;
    font-weight:500;padding:10px 16px;border-radius:22px;
    transition:all .15s ease;border:none;background:none;
  }
  .quiz-skip-text:active{background:rgba(0,0,0,.05);}
  .quiz-done-btn{
    width:50px;height:50px;border-radius:50%;
    border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .2s ease;
    background:var(--ok);
    box-shadow:0 4px 14px rgba(63,138,107,.28);
  }
  .quiz-done-btn svg{width:24px;height:24px;color:#fff;stroke:#fff;}
  .quiz-done-btn:active{transform:scale(.92);}
  .btn-primary:disabled{
    opacity:.4;pointer-events:none;
  }

  /* ===== Health Dashboard ===== */
  .dash-section{display:none;}
  .dash-section.active{display:block;}

  /* Welcome card */
  .welcome-card{
    margin-top:14px;background:#fff;
    border-radius:22px;padding:20px;
    box-shadow:0 4px 16px rgba(0,0,0,.04);
    display:flex;align-items:center;gap:14px;
    animation:fadeSlideUp .5s ease;
  }
  @keyframes fadeSlideUp{
    from{opacity:0;transform:translateY(16px);}
    to{opacity:1;transform:translateY(0);}
  }
  .welcome-avatar{
    width:60px;height:60px;border-radius:50%;
    background:var(--warm);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;flex-shrink:0;
  }
  .welcome-avatar svg{width:34px;height:34px;color:var(--brown);}
  .welcome-info{flex:1;}
  .welcome-greeting{font-size:13px;color:var(--muted-light);margin-bottom:2px;}
  .welcome-name{font-size:20px;font-weight:700;color:var(--ink);}
  .welcome-tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
  .welcome-tag{
    font-size:10px;padding:3px 10px;border-radius:10px;
    background:var(--warm);color:var(--brown);font-weight:500;
  }
  .edit-profile{
    width:32px;height:32px;border-radius:50%;
    background:var(--warm);display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;transition:transform .15s ease;
  }
  .edit-profile:active{transform:scale(.93);}
  .edit-profile svg{width:16px;height:16px;color:var(--muted);}

  /* Summary cards row */
  .summary-row{
    display:flex;gap:10px;margin-top:12px;
    animation:fadeSlideUp .5s .1s ease both;
  }
  .summary-card{
    flex:1;background:#fff;border-radius:18px;
    padding:16px 14px;box-shadow:0 2px 8px rgba(0,0,0,.03);
    text-align:center;
  }
  .summary-card .sc-icon{
    width:36px;height:36px;border-radius:50%;
    margin:0 auto 8px;
    display:flex;align-items:center;justify-content:center;
  }
  .sc-icon.fruit{background:rgba(122,74,54,.1);}
  .sc-icon.fruit svg{width:18px;height:18px;color:var(--brown);}
  .sc-icon.calorie{background:rgba(63,138,107,.1);}
  .sc-icon.calorie svg{width:18px;height:18px;color:var(--ok);}
  .sc-icon.water{background:rgba(100,181,246,.1);}
  .sc-icon.water svg{width:18px;height:18px;color:#42a5f5;}
  .sc-value{font-size:22px;font-weight:700;color:var(--ink);line-height:1.2;}
  .sc-unit{font-size:11px;color:var(--muted-light);}
  .sc-label{font-size:11px;color:var(--muted-light);margin-top:2px;}

  /* Weekly fruit intake */
  .section-card{
    margin-top:14px;background:#fff;
    border-radius:22px;padding:18px;
    box-shadow:0 2px 10px rgba(0,0,0,.03);
    animation:fadeSlideUp .5s .2s ease both;
  }
  .section-head{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:14px;
  }
  .section-title{
    font-size:16px;font-weight:700;color:var(--ink);
    display:flex;align-items:center;gap:8px;
  }
  .section-title .st-dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--brown);
  }
  .section-date{
    font-size:11px;color:var(--muted-light);
  }

  /* Fruit day entries */
  .fruit-days{display:flex;flex-direction:column;gap:10px;}
  .fruit-day{
    display:flex;align-items:center;gap:12px;
    padding:10px 12px;border-radius:14px;
    background:var(--warm);
    transition:transform .15s ease;
  }
  .fruit-day:active{transform:scale(.98);}
  .fd-date{
    text-align:center;flex-shrink:0;width:36px;
  }
  .fd-day{font-size:18px;font-weight:700;color:var(--brown);line-height:1;}
  .fd-week{font-size:10px;color:var(--muted-light);}
  .fd-fruits{flex:1;display:flex;gap:6px;flex-wrap:wrap;}
  .fd-fruit{
    font-size:22px;width:34px;height:34px;
    border-radius:50%;background:#fff;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  .fd-amount{flex-shrink:0;text-align:right;}
  .fd-grams{font-size:14px;font-weight:600;color:var(--ink);}
  .fd-unit{font-size:10px;color:var(--muted-light);}
  .fd-empty{
    font-size:12px;color:var(--muted-light);
    text-align:center;padding:8px 0;
  }

  /* Calorie chart */
  .chart-wrap{
    margin-top:8px;
    height:220px;
    position:relative;
  }
  .chart-wrap canvas{width:100%!important;height:100%!important;}

  /* Weekly calorie summary */
  .calorie-summary{
    display:flex;gap:8px;margin-top:12px;
  }
  .cal-day{
    flex:1;text-align:center;
    padding:8px 4px;border-radius:10px;
    background:var(--warm);
  }
  .cal-day-name{font-size:10px;color:var(--muted-light);margin-bottom:2px;}
  .cal-day-val{font-size:14px;font-weight:700;color:var(--ink);}
  .cal-day-unit{font-size:9px;color:var(--muted-light);}

  /* Health recommendations */
  .recommend-list{display:flex;flex-direction:column;gap:10px;}
  .recommend-item{
    display:flex;gap:12px;padding:14px;
    border-radius:16px;
    border:1.5px solid #e8dfd3;
    background:#fff;
    transition:transform .15s ease;
  }
  .recommend-item:active{transform:scale(.98);}
  .rec-icon{
    width:44px;height:44px;border-radius:50%;
    flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-size:22px;
  }
  .rec-icon.tip{background:rgba(122,74,54,.08);}
  .rec-icon.warn{background:rgba(229,115,115,.1);}
  .rec-icon.good{background:rgba(63,138,107,.1);}
  .rec-icon.info{background:rgba(100,181,246,.1);}
  .rec-content{flex:1;}
  .rec-title{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:3px;}
  .rec-desc{font-size:12px;color:var(--muted);line-height:1.5;}

  /* Settings button in dashboard */
  .settings-bar{
    margin-top:14px;display:flex;gap:10px;
    animation:fadeSlideUp .5s .4s ease both;
  }
  .btn-settings{
    flex:1;height:44px;border-radius:22px;
    background:#fff;color:var(--muted);
    font-size:14px;font-weight:500;
    border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
    box-shadow:0 2px 6px rgba(0,0,0,.03);
    transition:transform .15s ease;
  }
  .btn-settings:active{transform:scale(.97);}
  .btn-settings svg{width:16px;height:16px;color:var(--brown);}

  /* Bottom nav */
  .bottom-nav{
    position:absolute;left:0;right:0;bottom:0;
    height:80px;background:#fff;
    border-radius:32px 32px 0 0;
    display:flex;justify-content:space-around;
    align-items:flex-start;
    padding:8px 30px 0;
    box-shadow:0 -2px 14px rgba(0,0,0,.04);
    z-index:10;
  }
  .nav-item{
    display:flex;flex-direction:column;align-items:center;gap:4px;
    cursor:pointer;padding:4px 16px;
    transition:transform .15s ease;text-decoration:none;min-width:56px;
  }
  .nav-item:active{transform:scale(.95);}
  .nav-item .nav-icon{width:26px;height:26px;display:flex;align-items:center;justify-content:center;}
  .nav-item .nav-icon svg{width:24px;height:24px;color:var(--muted);transition:color .2s ease;}
  .nav-item.active .nav-icon svg{color:var(--brown);}
  .nav-item .nav-label{font-size:10px;font-weight:500;color:var(--muted);transition:color .2s ease;}
  .nav-item.active .nav-label{color:var(--brown);font-weight:600;}

  .nav-camera{position:relative;margin-top:-28px;display:flex;flex-direction:column;align-items:center;}
  .nav-camera .camera-btn{

  /* Toast */
  .toast{
    position:absolute;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);

  /* Responsive: on small screens remove phone frame */

      </div>

<script>
(function(){
  /* ============ State ============ */
  var STORAGE_KEY = 'guoguobang_health_profile_v2';
  var profile = loadProfile();
  var currentStep = 1;
  var formData = {};

  /* ============ Profile Management ============ */
  function loadProfile(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    } catch(e){}
    return null;
  }

  function saveProfile(data){
    profile = data;
    profile.updatedAt = new Date().toISOString();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(profile));
  }

  function hasProfile(){ return profile && profile.gender && profile.ageGroup; }

  window.resetProfile = function(){
    localStorage.removeItem(STORAGE_KEY);
    profile = null;
    showToast('档案已重置');
    showWelcomeDialog();
    updateDashboard();
  };

  /* ============ Toast ============ */
  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timeout);
    t._timeout = setTimeout(function(){ t.classList.remove('show'); }, 2000);
  }

  /* ============ Welcome Dialog ============ */
  function showWelcomeDialog(){
    var d = document.getElementById('welcomeDialog');
    d.classList.add('show');
  }

  function hideWelcomeDialog(){
    document.getElementById('welcomeDialog').classList.remove('show');
  }

  window.skipProfile = function(){
    hideWelcomeDialog();
    profile = { skipped: true, createdAt: new Date().toISOString() };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(profile));
    updateDashboard();
    showToast('可随时在下方"编辑健康档案"中填写');
  };

  /* ============ Quiz ============ */
  window.openQuiz = function(){
    hideWelcomeDialog();
    formData = {};
    if(hasProfile()){
      formData = {
        gender: profile.gender,
        ageGroup: profile.ageGroup,
        diseases: profile.diseases ? profile.diseases.slice() : [],
        tastes: profile.tastes ? profile.tastes.slice() : []
      };
    }
    currentStep = 1;
    document.getElementById('quizOverlay').classList.add('show');
    renderStep();
  };

  function closeQuiz(){
    document.getElementById('quizOverlay').classList.remove('show');
    updateDashboard();
  }
  window.closeQuiz = closeQuiz;

  function renderStep(){
    var body = document.getElementById('quizBody');
    var footer = document.getElementById('quizFooter');
    var stepNames = ['性别','年龄','基础疾病','饮食偏好'];

    document.getElementById('stepNum').textContent = currentStep;
    document.getElementById('stepName').textContent = stepNames[currentStep-1];
    document.getElementById('quizBarFill').style.width = (currentStep/4*100)+'%';

    switch(currentStep){
      case 1: renderGender(body, footer); break;
      case 2: renderAge(body, footer); break;
      case 3: renderDisease(body, footer); break;
      case 4: renderTaste(body, footer); break;
    }
  }

  /* Step 1: Gender (方案 C - 切换式) */
  function renderGender(body, footer){
    var selected = formData.gender;

    body.innerHTML =
      '<div class="quiz-question">选择你的桃桃形象</div>'+
      '<div class="quiz-hint">用于计算基础代谢率和每日营养建议</div>'+
      '<div class="gender-stage">'+
        '<div class="quiz-badge">第1题 · 单选</div>'+
        '<div class="gender-card-new'+(selected==='male'?' selected':'')+'" data-g="male">'+
          '<div class="card-check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg></div>'+
          '<img class="card-img" src="picture/男性桃子形象.png" alt="男性桃桃">'+
          '<div class="card-label">男生</div>'+
        '</div>'+
        '<div class="gender-card-new'+(selected==='female'?' selected':'')+'" data-g="female">'+
          '<div class="card-check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg></div>'+
          '<img class="card-img" src="picture/女性桃子形象.png" alt="女性桃桃">'+
          '<div class="card-label">女生</div>'+
        '</div>'+
        '<img class="quiz-peach" src="picture/问卷调查.png" alt="桃桃">'+
      '</div>'+
      '<div class="step-disclaimer">相关内容仅作饮食参考，不可替代专业诊疗方案</div>';

    footer.className = 'quiz-footer step1';
    footer.innerHTML =
      '<button class="quiz-skip-text" onclick="closeQuiz()">跳过</button>'+
      '<button class="quiz-arrow-btn" id="stepNext" '+(selected?'':'disabled')+' onclick="nextStep()">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>'+
      '</button>';

    var nextBtn = document.getElementById('stepNext');
    var cards = body.querySelectorAll('.gender-card-new');

    cards.forEach(function(card){
      card.addEventListener('click', function(){
        var g = card.dataset.g;
        formData.gender = g;
        nextBtn.disabled = false;
        cards.forEach(function(c){
          c.classList.toggle('selected', c.dataset.g === g);
        });
      });
    });

    window.selectGender = function(g){
      formData.gender = g;
      nextBtn.disabled = false;
      cards.forEach(function(c){
        c.classList.toggle('selected', c.dataset.g === g);
      });
    };
  }

  /* Step 2: Age (方案 C - 滑动尺) */
  function renderAge(body, footer){
    var ageGroups = [
      {range:'0-3岁',   name:'幼儿',   key:'infant', tip:'果泥/果汁'},
      {range:'4-12岁',  name:'儿童',   key:'child',  tip:'适量鲜果'},
      {range:'13-18岁', name:'青少年', key:'teen',   tip:'护眼水果，保护视力'},
      {range:'19-35岁', name:'青年',   key:'young',  tip:'适量食用，注意控糖'},
      {range:'36-55岁', name:'中年',   key:'middle', tip:'低糖水果，减少负担'},
      {range:'56岁以上',name:'中老年', key:'senior', tip:'切小块服用'}
    ];

    var html = '<div class="quiz-question">你的年龄段是？</div>'+
      '<div class="quiz-hint">选择年龄段查看对应的水果食用建议</div>'+
      '<div class="quiz-stage">'+
        '<div class="quiz-badge">第2题 · 单选</div>'+
        '<div class="age-grid">';

    ageGroups.forEach(function(ag){
      var sel = formData.ageGroup === ag.key;
      html += '<div class="age-card'+(sel?' selected':'')+'" data-key="'+ag.key+'">'+
        '<div class="age-check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg></div>'+
        '<div class="age-range">'+ag.range+'</div>'+
        '<div class="age-name">'+ag.name+'</div>'+
        '<div class="age-tip">'+ag.tip+'</div>'+
      '</div>';
    });

    html += '</div>'+
      '<div class="step-disclaimer">相关内容仅作饮食参考，不可替代专业诊疗方案</div>'+
      '<img class="quiz-peach" src="picture/问卷调查.png" alt="桃桃">'+
      '</div>';

    body.innerHTML = html;

    footer.className = 'quiz-footer step2-3';
    footer.innerHTML =
      '<button class="quiz-arrow-btn" onclick="prevStep()">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>'+
      '</button>'+
      '<button class="quiz-arrow-btn" id="stepNext" '+(formData.ageGroup?'':'disabled')+' onclick="nextStep()">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>'+
      '</button>';

    var cards = body.querySelectorAll('.age-card');
    var nextBtn = document.getElementById('stepNext');

    cards.forEach(function(card){
      card.addEventListener('click', function(){
        formData.ageGroup = card.dataset.key;
        nextBtn.disabled = false;
        cards.forEach(function(c){
          c.classList.toggle('selected', c.dataset.key === card.dataset.key);
        });
      });
    });

    window.selectAge = function(key){
      formData.ageGroup = key;
      nextBtn.disabled = false;
      cards.forEach(function(c){
        c.classList.toggle('selected', c.dataset.key === key);
      });
    };
  }

  /* Step 3: Disease */
  function renderDisease(body, footer){
    var diseases = [
      {key:'diabetes',name:'糖尿病',emoji:'💉'},
      {key:'hypertension',name:'高血压',emoji:'🫀'},
      {key:'heart',name:'心脏病',emoji:'❤️'},
      {key:'obesity',name:'肥胖症',emoji:'⚖️'},
      {key:'allergy',name:'食物过敏',emoji:'🤧'},
      {key:'gout',name:'痛风',emoji:'🦶'},
      {key:'stomach',name:'胃病',emoji:'🫃'},
      {key:'none',name:'无基础疾病',emoji:'✅'}
    ];

    var html = '<div class="quiz-question">是否有基础疾病？</div>'+
      '<div class="quiz-hint">可多选，我们将据此调整饮食建议</div>'+
      '<div class="quiz-stage" style="text-align:left;">'+
      '<div class="quiz-badge">第3题 · 多选</div>'+
      '<div class="disease-grid">';

    diseases.forEach(function(d){
      var checked = formData.diseases && formData.diseases.indexOf(d.key) >= 0;
      html += '<div class="disease-tag'+(checked?' checked':'')+(d.key==='none'?' none':'')+'" data-key="'+d.key+'" onclick="toggleDisease(\''+d.key+'\', this)">'+
        d.name+
      '</div>';
    });
    html += '</div>'+
      '<div class="step-disclaimer">相关内容仅作饮食参考，不可替代专业诊疗方案</div>'+
      '<img class="quiz-peach" src="picture/问卷调查.png" alt="桃桃">'+
      '</div>';
    body.innerHTML = html;

    footer.className = 'quiz-footer step2-3';
    footer.innerHTML =
      '<button class="quiz-arrow-btn" onclick="prevStep()">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>'+
      '</button>'+
      '<button class="quiz-arrow-btn" onclick="nextStep()">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>'+
      '</button>';

    window.toggleDisease = function(key, el){
      if(!formData.diseases) formData.diseases = [];
      if(key === 'none'){
        formData.diseases = ['none'];
        document.querySelectorAll('.disease-tag').forEach(function(t){
          t.classList.toggle('checked', t.dataset.key === 'none');
        });
      } else {
        formData.diseases = formData.diseases.filter(function(d){ return d !== 'none'; });
        var noneEl = document.querySelector('.disease-tag.none');
        if(noneEl) noneEl.classList.remove('checked');

        var idx = formData.diseases.indexOf(key);
        if(idx >= 0) formData.diseases.splice(idx, 1);
        else formData.diseases.push(key);
        el.classList.toggle('checked', formData.diseases.indexOf(key) >= 0);
      }
    };
  }

  /* Step 4: Taste */
  function renderTaste(body, footer){
    var tastes = [
      {key:'sweet',name:'偏甜',emoji:'🍬'},
      {key:'sour',name:'偏酸',emoji:'🍋'},
      {key:'crispy',name:'喜欢吃脆一点',emoji:'🍎'},
      {key:'soft',name:'喜欢吃软一点',emoji:'🍌'},
      {key:'juicy',name:'喜欢多汁的',emoji:'💧'},
      {key:'light',name:'清淡口味',emoji:'🥒'},
      {key:'rich',name:'浓郁口味',emoji:'🍫'},
      {key:'spicy',name:'偏辣',emoji:'🌶️'}
    ];

    var html = '<div class="quiz-question">你的饮食偏好？</div>'+
      '<div class="quiz-hint">可多选，帮助我们推荐更适合你的水果</div>'+
      '<div class="quiz-stage" style="text-align:left;">'+
      '<div class="quiz-badge">第4题 · 多选</div>'+
      '<div class="taste-grid">';

    tastes.forEach(function(t){
      var checked = formData.tastes && formData.tastes.indexOf(t.key) >= 0;
      html += '<div class="taste-tag'+(checked?' checked':'')+'" onclick="toggleTaste(\''+t.key+'\', this)">'+
        t.name+
      '</div>';
    });
    html += '</div>'+
      '<div class="step-disclaimer">相关内容仅作饮食参考，不可替代专业诊疗方案</div>'+
      '<img class="quiz-peach" src="picture/问卷调查.png" alt="桃桃">'+
      '</div>';
    body.innerHTML = html;

    footer.className = 'quiz-footer step4';
    footer.innerHTML =
      '<button class="quiz-arrow-btn" onclick="prevStep()">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>'+
      '</button>'+
      '<button class="quiz-done-btn" onclick="submitProfile()">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'+
      '</button>';

    window.toggleTaste = function(key, el){
      if(!formData.tastes) formData.tastes = [];
      var idx = formData.tastes.indexOf(key);
      if(idx >= 0) formData.tastes.splice(idx, 1);
      else formData.tastes.push(key);
      el.classList.toggle('checked', formData.tastes.indexOf(key) >= 0);
    };
  }

  /* Navigation */
  function nextStep(){
    if(currentStep < 4){ currentStep++; renderStep(); scrollQuizTop(); }
  }
  window.nextStep = nextStep;

  function prevStep(){
    if(currentStep > 1){ currentStep--; renderStep(); scrollQuizTop(); }
  }
  window.prevStep = prevStep;

  function scrollQuizTop(){
    document.getElementById('quizBody').scrollTop = 0;
  }

  function submitProfile(){
    saveProfile({
      gender: formData.gender,
      ageGroup: formData.ageGroup,
      diseases: formData.diseases || [],
      tastes: formData.tastes || [],
      createdAt: new Date().toISOString()
    });
    closeQuiz();
    showToast('档案保存成功！');
    updateDashboard();
    renderCalorieChart();
  }
  window.submitProfile = submitProfile;

  /* ============ Dashboard ============ */
  function updateDashboard(){
    var hasP = hasProfile();

    // Welcome card
    var nameText = '未设置档案';
    var greetingText = '欢迎来到个人健康';
    var tagsHtml = '';

    if(hasP){
      var genderMap = {male:'男',female:'女'};
      var ageMap = {infant:'幼儿 (0-3岁)',child:'儿童 (4-12岁)',teen:'青少年 (13-18岁)',young:'青年 (19-35岁)',middle:'中年 (36-55岁)',senior:'中老年 (56岁以上)'};
      var genderEmoji = profile.gender === 'male' ? '🙋‍♂️' : '🙋‍♀️';

      greetingText = genderEmoji + ' ' + (profile.gender === 'male' ? '先生' : '女士') + '，你好';
      nameText = (ageMap[profile.ageGroup] || '');

      tagsHtml = '<span class="welcome-tag">'+(genderMap[profile.gender]||'')+'</span>';
      if(profile.diseases && profile.diseases.length > 0 && profile.diseases[0] !== 'none'){
        tagsHtml += '<span class="welcome-tag">需关注健康</span>';
      } else if(profile.diseases && profile.diseases[0] === 'none'){
        tagsHtml += '<span class="welcome-tag" style="background:rgba(63,138,107,.1);color:#3f8a6b;">身体健康</span>';
      }
      if(profile.tastes && profile.tastes.length > 0){
        var tasteLabels = {sweet:'爱甜',sour:'爱酸',crispy:'爱脆',soft:'爱软',juicy:'爱多汁',light:'清淡',rich:'浓郁',spicy:'爱辣'};
        var t = profile.tastes[0];
        tagsHtml += '<span class="welcome-tag">'+ (tasteLabels[t] || '') +'</span>';
      }
    }

    document.getElementById('welcomeGreeting').textContent = greetingText;
    document.getElementById('welcomeName').textContent = nameText;
    document.getElementById('welcomeTags').innerHTML = tagsHtml;

    // Fruit intake
    renderFruitIntake();
    // Recommendations
    renderRecommendations();
    // Calorie chart
    renderCalorieChart();
    // Calorie summary
    renderCalorieSummary();
    // Summary numbers
    updateSummaryCards();
  }

  /* Fruit intake data */
  function getFruitData(){
    var today = new Date();
    var dayOfWeek = today.getDay(); // 0=Sun
    var mondayOffset = dayOfWeek === 0 ? 6 : dayOfWeek - 1;

    var fruits = [
      {emoji:'🍎',name:'苹果',grams:180},
      {emoji:'🍌',name:'香蕉',grams:120},
      {emoji:'🍓',name:'草莓',grams:150},
      {emoji:'🍊',name:'橘子',grams:200},
      {emoji:'🍇',name:'葡萄',grams:100},
      {emoji:'🍑',name:'桃子',grams:160},
      {emoji:'🫐',name:'蓝莓',grams:80},
      {emoji:'🥝',name:'猕猴桃',grams:130},
      {emoji:'🍉',name:'西瓜',grams:300},
      {emoji:'🍍',name:'菠萝',grams:180},
      {emoji:'🥭',name:'芒果',grams:150},
      {emoji:'🍒',name:'樱桃',grams:100},
      {emoji:'🍋',name:'柠檬',grams:50},
      {emoji:'🍐',name:'梨',grams:180},
    ];

    var weekData = [];
    var dayNames = ['周一','周二','周三','周四','周五','周六','周日'];

    for(var i=6; i>=0; i--){
      var d = new Date(today);
      d.setDate(d.getDate() - i);
      var month = d.getMonth() + 1;
      var day = d.getDate();

      // Use deterministic pseudo-random based on date
      var seed = d.getFullYear() * 10000 + (month) * 100 + day;
      var rng = function(){ seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };

      var count = Math.floor(rng() * 3) + (i === 0 ? 1 : 0); // today gets at least 1
      var dayFruits = [];
      var totalGrams = 0;
      for(var j=0; j<count; j++){
        var idx = Math.floor(rng() * fruits.length);
        dayFruits.push(fruits[idx]);
        totalGrams += fruits[idx].grams;
      }

      weekData.push({
        dayIdx: 6-i,
        dayName: dayNames[6-i],
        date: month+'/'+day,
        fruits: dayFruits,
        totalGrams: totalGrams,
        calories: Math.round(totalGrams * 0.55 + rng() * 100)
      });
    }
    return weekData;
  }

  function renderFruitIntake(){
    var weekData = getFruitData();
    var container = document.getElementById('fruitDays');
    var now = new Date();
    var startDate = new Date(now); startDate.setDate(now.getDate()-6);
    document.getElementById('fruitDateRange').textContent =
      (startDate.getMonth()+1)+'/'+startDate.getDate()+' - '+(now.getMonth()+1)+'/'+now.getDate();

    var totalFruits = 0;
    var html = '';
    weekData.forEach(function(day){
      totalFruits += day.fruits.length;
      html += '<div class="fruit-day">'+
        '<div class="fd-date">'+
          '<div class="fd-day">'+day.date.split('/')[1]+'</div>'+
          '<div class="fd-week">'+day.dayName+'</div>'+
        '</div>'+
        '<div class="fd-fruits">';
      if(day.fruits.length === 0){
        html += '<span class="fd-empty">暂无记录</span>';
      } else {
        day.fruits.forEach(function(f){
          html += '<span class="fd-fruit" title="'+f.name+' '+f.grams+'g">'+f.emoji+'</span>';
        });
      }
      html += '</div>'+
        '<div class="fd-amount">'+
          '<div class="fd-grams">'+(day.totalGrams || 0)+'</div>'+
          '<div class="fd-unit">克</div>'+
        '</div>'+
      '</div>';
    });
    container.innerHTML = html;
    document.getElementById('totalFruit').textContent = totalFruits;
  }

  /* Calorie chart */
  function renderCalorieChart(){
    var weekData = getFruitData();
    var labels = weekData.map(function(d){ return d.dayName; });
    var calories = weekData.map(function(d){ return d.calories + 1400 + Math.floor(Math.random()*400); });

    // Adjust based on profile
    var dailyTarget = 2000;
    if(hasProfile()){
      if(profile.gender === 'female') dailyTarget = 1800;
      var ageMap = {infant:1200, child:1600, teen:2000, young:2100, middle:1900, senior:1800};
      dailyTarget = ageMap[profile.ageGroup] || 2000;
      if(profile.gender === 'female') dailyTarget = Math.round(dailyTarget * 0.85);
    }

    var ctx = document.getElementById('calorieChart').getContext('2d');

    // Destroy existing chart
    if(window._calorieChart) window._calorieChart.destroy();

    window._calorieChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: '摄入热量 (kcal)',
          data: calories,
          backgroundColor: calories.map(function(c){
            return c > dailyTarget ? 'rgba(229,115,115,0.7)' : 'rgba(122,74,54,0.6)';
          }),
          borderColor: calories.map(function(c){
            return c > dailyTarget ? 'rgba(229,115,115,1)' : 'rgba(122,74,54,1)';
          }),
          borderWidth: 1.5,
          borderRadius: 8,
          borderSkipped: false,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          annotation: undefined
        },
        scales: {
          y: {
            beginAtZero: false,
            min: 1200,
            max: 2800,
            ticks: {
              stepSize: 400,
              font: { size: 10 },
              color: '#b8a797'
            },
            grid: { color: 'rgba(0,0,0,0.04)' }
          },
          x: {
            ticks: {
              font: { size: 11, weight: '500' },
              color: '#6b574a'
            },
            grid: { display: false }
          }
        }
      },
      plugins: [{
        id: 'targetLine',
        afterDraw: function(chart){
          var ctx2 = chart.ctx;
          var yScale = chart.scales.y;
          var xScale = chart.scales.x;
          var y = yScale.getPixelForValue(dailyTarget);

          ctx2.save();
          ctx2.beginPath();
          ctx2.setLineDash([6, 4]);
          ctx2.strokeStyle = 'rgba(63,138,107,0.5)';
          ctx2.lineWidth = 1.5;
          ctx2.moveTo(xScale.left, y);
          ctx2.lineTo(xScale.right, y);
          ctx2.stroke();
          ctx2.restore();

          ctx2.save();
          ctx2.font = '10px -apple-system, sans-serif';
          ctx2.fillStyle = '#3f8a6b';
          ctx2.textAlign = 'right';
          ctx2.fillText('推荐 '+dailyTarget, xScale.right - 4, y - 6);
          ctx2.restore();
        }
      }]
    });
  }

  function renderCalorieSummary(){
    var weekData = getFruitData();
    var dayNames = ['一','二','三','四','五','六','日'];
    var container = document.getElementById('calorieSummary');
    var html = '';

    var dailyTarget = 2000;
    if(hasProfile()){
      if(profile.gender === 'female') dailyTarget = 1800;
    }

    weekData.forEach(function(day, i){
      var cal = day.calories + 1400 + (i*37%300);
      var over = cal > dailyTarget;
      html += '<div class="cal-day">'+
        '<div class="cal-day-name">周'+dayNames[i]+'</div>'+
        '<div class="cal-day-val" style="color:'+(over?'#e57373':'var(--ok)')+'">'+cal+'</div>'+
        '<div class="cal-day-unit">kcal</div>'+
      '</div>';
    });
    container.innerHTML = html;
  }

  /* Summary cards */
  function updateSummaryCards(){
    var weekData = getFruitData();
    var totalFruits = weekData.reduce(function(sum,d){ return sum + d.fruits.length; }, 0);
    var avgCal = Math.round(weekData.reduce(function(sum,d,i){ return sum + d.calories + 1400 + (i*37%300); }, 0) / 7);
    var waterScore = hasProfile() ? (profile.diseases && profile.diseases[0]==='none' ? 92 : 85) : 80;

    document.getElementById('totalFruit').textContent = totalFruits;
    document.getElementById('avgCalorie').textContent = avgCal.toLocaleString();
    document.getElementById('waterScore').textContent = waterScore;
  }

  /* Recommendations */
  function renderRecommendations(){
    var container = document.getElementById('recommendList');
    var recs = [];

    if(hasProfile()){
      // Profile-based recommendations
      if(profile.diseases && profile.diseases.indexOf('diabetes') >= 0){
        recs.push({icon:'warn',emoji:'⚠️',title:'低GI水果推荐',desc:'建议选择草莓、蓝莓、樱桃等低GI水果，每次摄入不超过150g，两餐之间食用为佳。'});
      }
      if(profile.diseases && profile.diseases.indexOf('hypertension') >= 0){
        recs.push({icon:'tip',emoji:'🍌',title:'高钾水果推荐',desc:'香蕉、猕猴桃、橙子富含钾元素，有助于调节血压，建议每日摄入一份。'});
      }
      if(profile.diseases && profile.diseases.indexOf('gout') >= 0){
        recs.push({icon:'warn',emoji:'🚫',title:'低嘌呤水果选择',desc:'避免榴莲、荔枝等高果糖水果，优先选择樱桃（有助降尿酸）、苹果、梨等。'});
      }
      if(profile.diseases && profile.diseases.indexOf('stomach') >= 0){
        recs.push({icon:'tip',emoji:'🍌',title:'温和水果推荐',desc:'选择香蕉、木瓜等温和水果，避免空腹食用柠檬、山楂等酸性水果。'});
      }

      // Age-based
      if(profile.ageGroup === 'infant'){
        recs.push({icon:'good',emoji:'🍼',title:'幼儿水果添加指南',desc:'适合果泥/果汁，少量分次食用，避免过敏，不加糖。'});
      }
      if(profile.ageGroup === 'child'){
        recs.push({icon:'good',emoji:'🧠',title:'儿童水果推荐',desc:'适量鲜果，种类经常轮换，补充维C助力成长发育。'});
      }
      if(profile.ageGroup === 'teen'){
        recs.push({icon:'good',emoji:'👁️',title:'护眼水果搭配',desc:'蓝莓、桑葚富含花青素，保护视力，缓解用眼疲劳。'});
      }
      if(profile.ageGroup === 'young'){
        recs.push({icon:'good',emoji:'💪',title:'适量食用，注意控糖',desc:'青年期代谢好，常规食用即可，避免摄入过多高糖水果。'});
      }
      if(profile.ageGroup === 'middle'){
        recs.push({icon:'good',emoji:'🍃',title:'低糖水果，减少负担',desc:'多选低糖水果（柚子、草莓），润肠通便，控制糖分摄入。'});
      }
      if(profile.ageGroup === 'senior'){
        recs.push({icon:'good',emoji:'🦴',title:'切小块服用，温和护胃',desc:'木瓜、熟香蕉软糯易消化，切小块细嚼慢咽，每日适量。'});
      }

      // Taste-based
      if(profile.tastes && profile.tastes.indexOf('sweet') >= 0){
        recs.push({icon:'tip',emoji:'🍯',title:'天然甜味替代',desc:'用芒果、蜜瓜、熟透的香蕉替代甜品，既能满足甜食欲望又更健康。'});
      }
      if(profile.tastes && profile.tastes.indexOf('crispy') >= 0){
        recs.push({icon:'tip',emoji:'🍎',title:'清脆水果推荐',desc:'苹果、梨、莲雾口感清脆爽口，低热量高纤维，是理想的零食替代。'});
      }

      // Gender-based
      if(profile.gender === 'female'){
        recs.push({icon:'info',emoji:'💪',title:'补铁水果清单',desc:'樱桃、石榴富含铁元素，搭配维C丰富的水果（如猕猴桃）可促进铁吸收。'});
      }
    }

    // Add a general recommendation if few recommendations
    if(recs.length < 2){
      recs.unshift({icon:'good',emoji:'🌈',title:'每日水果多样化',desc:'建议每天摄入至少3种不同颜色的水果，保证营养均衡。红、黄、绿、紫各色都有益处。'});
    }
    if(recs.length < 3){
      recs.push({icon:'info',emoji:'⏰',title:'最佳食用时间',desc:'水果建议在两餐之间（上午10点或下午3点）食用，有助于营养吸收且不影响正餐。'});
    }

    // Limit to 4
    recs = recs.slice(0, 4);

    var html = '';
    recs.forEach(function(r){
      html += '<div class="recommend-item">'+
        '<div class="rec-icon '+r.icon+'">'+r.emoji+'</div>'+
        '<div class="rec-content">'+
          '<div class="rec-title">'+r.title+'</div>'+
          '<div class="rec-desc">'+r.desc+'</div>'+
        '</div>'+
      '</div>';
    });
    container.innerHTML = html;
  }

  /* ============ Init ============ */
  function init(){
    if(!hasProfile() && (!profile || !profile.skipped)){
      // First visit
      showWelcomeDialog();
    } else {
      hideWelcomeDialog();
    }
    updateDashboard();
  }

  /* Expose for inline handlers */
  window.nextStep = nextStep;
  window.prevStep = prevStep;
  window.closeQuiz = closeQuiz;

  init();
})();
</script>
