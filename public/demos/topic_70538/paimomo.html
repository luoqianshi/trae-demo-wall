<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>LinShiYue</title>
<style>
  :root{
    --bg:#ede8e1;
    --card:#ffffff;
    --ink:#2a1e16;
    --ink-soft:#3a2a20;
    --muted:#6b574a;
    --ok:#3f8a6b;
    --brown:#7a4a36;
    --brown-text:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#cfc8bf;
    display:flex;justify-content:center;align-items:center;
    min-height:100vh;
  }

  /* iPhone frame */
  .phone{
    position:relative;
    width:390px;height:844px;
    background:var(--bg);
    border-radius:48px;
    box-shadow:
      0 0 0 10px #1a1a1a,
      0 0 0 11px #2a2a2a,
      0 30px 60px rgba(0,0,0,.25);
    overflow:hidden;
  }
  .phone::before{
    content:"";position:absolute;top:11px;left:50%;transform:translateX(-50%);
    width:120px;height:34px;background:#000;border-radius:20px;z-index:99;
  }

  /* Status bar */
  .statusbar{
    height:54px;padding:18px 32px 0;
    display:flex;justify-content:space-between;align-items:center;
    font-size:15px;font-weight:600;color:#1a1a1a;
    position:relative;z-index:2;
  }
  .statusbar .right{display:flex;align-items:center;gap:6px;}
  .battery{
    width:26px;height:12px;border:1.2px solid #1a1a1a;border-radius:3px;position:relative;
    display:inline-flex;align-items:center;padding:1px;
  }
  .battery::after{
    content:"";position:absolute;right:-3px;top:3px;width:2px;height:4px;background:#1a1a1a;border-radius:0 1px 1px 0;
  }
  .battery .fill{display:block;width:88%;height:100%;background:#1a1a1a;border-radius:1px;}

  /* Header */
  .header{
    padding:8px 28px 0;display:flex;justify-content:space-between;align-items:flex-start;
  }
  .avatar{
    position:relative;width:76px;height:76px;border-radius:50%;
    background:#000 url('picture/avatar-source.jpg') center/cover no-repeat;
    overflow:hidden;flex-shrink:0;
  }
  .crown{
    position:absolute;top:-6px;left:50%;transform:translateX(-50%);
    width:30px;height:18px;z-index:3;
  }
  .crown svg{width:100%;height:100%;}

  .top-actions{display:flex;gap:14px;padding-top:8px;}
  .circle-btn{
    width:54px;height:54px;border-radius:50%;background:#fff;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.04);
  }
  .circle-btn svg{width:22px;height:22px;color:#1a1a1a;}

  /* Greeting */
  .greeting{padding:24px 28px 0;}
  .greeting .hello{
    font-size:38px;font-weight:500;color:var(--ink);line-height:1.1;letter-spacing:-1px;
  }
  .greeting .name{
    font-size:46px;font-weight:800;color:var(--ink);line-height:1.1;letter-spacing:-1.5px;
    margin-top:2px;
  }

  /* Toolbar */
  .toolbar{
    margin-top:28px;padding:0 28px;display:flex;gap:18px;align-items:center;
  }
  .toolbar .circle-btn{width:62px;height:62px;}
  .toolbar .circle-btn svg{width:24px;height:24px;}

  /* Card stage */
  .stage{
    position:relative;margin:18px 18px 0;
    height:190px;
  }
  .card{
    position:absolute;inset:0;
    background:var(--card);
    border-radius:36px;
    box-shadow:0 4px 20px rgba(0,0,0,.04);
    padding:28px 28px;
    overflow:visible;
  }
  .card .label{
    font-size:16px;font-weight:600;color:var(--ink-soft);
  }
  .card .pct{
    font-size:44px;font-weight:800;color:var(--ink);
    line-height:1;letter-spacing:-1.2px;margin-top:4px;
  }
  .card .status{
    font-size:14px;font-weight:600;color:var(--ok);margin-top:6px;
  }
  .card .cta{
    position:absolute;left:24px;bottom:22px;
    background:var(--brown);color:var(--brown-text);
    padding:9px 22px;border-radius:26px;
    font-size:12px;font-weight:500;
    box-shadow:0 3px 8px rgba(122,74,54,.25);
    cursor:pointer;border:none;
  }
  /* 2026-06-28 改版：沿用原版三行骨架（label → 大数字 → 副文案），去掉徽章 */
  .card .label{font-size:14px;font-weight:500;color:var(--ink-soft);}
  .card .pct{
    font-size:42px;font-weight:700;color:var(--ink);
    line-height:1;letter-spacing:-1px;margin-top:4px;
  }
  .card .pct .unit{font-size:18px;font-weight:500;color:var(--muted);margin-left:4px;}
  .card .desc{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.4;letter-spacing:0.2px;}

  /* Peach character — vector SVG inline */
  .peach{
    position:absolute;
    right:-90px;top:-100px;
    width:340px;height:auto;
    z-index:5;
  }

  .home-indicator{
    position:absolute;bottom:84px;left:50%;transform:translateX(-50%);
    width:134px;height:5px;border-radius:3px;background:#1a1a1a;opacity:.85;z-index:11;
  }

  /* Module grid */
  .modules{
    position:absolute;
    left:18px;right:18px;
    top:510px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .mod{
    background:#fff;
    border-radius:24px;
    padding:16px 16px 14px;
    box-shadow:0 2px 8px rgba(0,0,0,.04);
    position:relative;
    min-height:96px;
    cursor:pointer;
    transition:transform .15s ease;
  }
  .mod:active{transform:scale(.97);}
  .mod .head{display:flex;align-items:center;gap:10px;}
  .mod .ico{
    width:36px;height:36px;border-radius:50%;
    background:#f1ece4;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .mod .ico svg{width:18px;height:18px;color:#7a4a36;}
  .mod .name{
    font-size:17px;font-weight:700;color:var(--ink);
    line-height:1.1;
  }
  .mod .sub{
    margin-top:10px;
    font-size:11px;color:#b8a797;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .mod.accent{
    background:#7a4a36;
  }
  .mod.accent .ico{background:#fff;}
  .mod.accent .name{color:#fff;}
  .mod.accent .sub{
    color:#e8d4ad;
    text-decoration:none;
    margin-top:14px;
  }
  .mod .arrow{
    position:absolute;right:16px;bottom:14px;
    font-size:16px;color:#b8a797;line-height:1;
  }
  .mod.accent .arrow{color:#e8d4ad;}

  /* Bottom navigation bar */
  .bottom-nav{
    position:absolute;
    left:0;right:0;bottom:0;
    height:80px;
    background:#fff;
    border-radius:32px 32px 0 0;
    display:flex;
    justify-content:space-around;
    align-items:flex-start;
    padding:8px 30px 0;
    box-shadow:0 -2px 14px rgba(0,0,0,.04);
    z-index:10;
  }
  .nav-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    cursor:pointer;
    padding:4px 16px;
    transition:transform .15s ease;
    text-decoration:none;
    min-width:56px;
  }
  .nav-item:active{transform:scale(.95);}
  .nav-item .nav-icon{
    width:26px;height:26px;
    display:flex;align-items:center;justify-content:center;
  }
  .nav-item .nav-icon svg{
    width:24px;height:24px;
    color:var(--muted);
    transition:color .2s ease;
  }
  .nav-item.active .nav-icon svg{color:var(--brown);}
  .nav-item .nav-label{
    font-size:10px;font-weight:500;
    color:var(--muted);
    transition:color .2s ease;
  }
  .nav-item.active .nav-label{
    color:var(--brown);
    font-weight:600;
  }

  /* Camera button — prominent raised circle */
  .nav-camera{
    position:relative;
    margin-top:-28px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .nav-camera .camera-btn{
    width:58px;height:58px;
    border-radius:50%;
    background:var(--brown);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(122,74,54,.35);
    cursor:pointer;
    transition:transform .15s ease,box-shadow .15s ease;
    position:relative;
  }
  .nav-camera .camera-btn::after{
    content:"";
    position:absolute;inset:-5px;
    border-radius:50%;
    border:3px solid #ede8e1;
    pointer-events:none;
  }
  .nav-camera .camera-btn:active{
    transform:scale(.92);
    box-shadow:0 3px 10px rgba(122,74,54,.3);
  }
  .nav-camera .camera-btn svg{
    width:28px;height:28px;
    color:#fff;
  }
  .nav-camera .nav-label{
    font-size:10px;font-weight:500;
    color:var(--muted);
    margin-top:2px;
  }

  /* ===== 客服弹层 ===== */
  .support-overlay{
    position:absolute;inset:0;z-index:200;
    background:rgba(42,30,22,0.45);
    display:none;align-items:flex-end;justify-content:center;
    opacity:0;transition:opacity .25s ease;
  }
  .support-overlay.show{display:flex;opacity:1;}
  .support-sheet{
    width:100%;
    background:var(--card);
    border-radius:24px 24px 0 0;
    padding:20px 22px 28px;
    box-shadow:0 -8px 24px rgba(42,30,22,0.12);
    transform:translateY(20px);
    transition:transform .25s ease;
  }
  .support-overlay.show .support-sheet{transform:translateY(0);}
  .support-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:14px;
  }
  .support-title{font-size:15px;font-weight:600;color:var(--ink);}
  .support-close{
    width:28px;height:28px;border-radius:50%;
    background:var(--bg);border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:14px;line-height:1;
  }
  .support-hint{
    font-size:12px;color:var(--muted);line-height:1.5;
    margin-bottom:14px;
  }
  .support-list{display:flex;flex-direction:column;gap:8px;}
  .support-item{
    width:100%;text-align:left;
    padding:12px 14px;
    background:var(--bg);
    border:1px solid transparent;
    border-radius:14px;
    font-size:13px;color:var(--ink-soft);
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .support-item:hover{border-color:var(--brown);background:#fff;}
  .support-reply{
    margin-top:10px;padding:10px 12px;
    background:#faf6ef;border-radius:10px;
    font-size:12px;color:var(--ink-soft);line-height:1.6;
    display:none;
  }
  .support-reply.show{display:block;}
  .support-footer{
    margin-top:16px;padding:10px 12px;
    background:var(--bg);border-radius:14px;
    display:flex;align-items:center;gap:10px;
    cursor:pointer;border:none;width:100%;text-align:left;
    transition:background .15s ease;
  }
  .support-footer:hover{background:#e3dccf;}
  .support-avatar{
    width:36px;height:36px;border-radius:50%;
    background:linear-gradient(135deg,#ffc1a8,#ff8a8a);
    display:flex;align-items:center;justify-content:center;
    font-size:18px;flex-shrink:0;position:relative;
    box-shadow:0 2px 6px rgba(0,0,0,.08);
  }
  .support-avatar::after{
    content:'';position:absolute;right:-1px;bottom:-1px;
    width:10px;height:10px;border-radius:50%;
    background:#3f8a6b;border:2px solid #fff;
  }
  .support-meta{flex:1;min-width:0;line-height:1.4;}
  .support-meta .t1{font-size:12px;font-weight:600;color:var(--ink);}
  .support-meta .t2{font-size:10px;color:var(--ok);margin-top:1px;}
  .support-arrow{color:var(--muted);font-size:14px;flex-shrink:0;}

</style>
</head>
<body>
  <div class="phone">

    <!-- Status bar -->
    <div class="statusbar">
      <div>14:44</div>
      <div class="right">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" fill="#1a8cff"/><path d="M12 2v3M12 19v3" stroke="#1a8cff" stroke-width="2" stroke-linecap="round"/></svg>
        <svg width="18" height="14" viewBox="0 0 18 14" fill="#1a1a1a"><rect x="0" y="9" width="3" height="5" rx="0.5"/><rect x="5" y="6" width="3" height="8" rx="0.5"/><rect x="10" y="3" width="3" height="11" rx="0.5"/><rect x="15" y="0" width="3" height="14" rx="0.5"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="#1a1a1a"><path d="M8 11.5l1.6-1.6a2.3 2.3 0 0 0-3.2 0L8 11.5zM3.5 7a6.4 6.4 0 0 1 9 0l-1.4 1.4a4.4 4.4 0 0 0-6.2 0L3.5 7zM0 3.5a10.7 10.7 0 0 1 16 0l-1.4 1.4a8.7 8.7 0 0 0-13.2 0L0 3.5z"/></svg>
        <span class="battery"><span class="fill"></span></span>
        <span style="font-weight:600;margin-left:-2px;">92</span>
      </div>
    </div>

    <!-- Header -->
    <div class="header">
      <div class="avatar">
        <div class="crown">
          <svg viewBox="0 0 30 18"><path d="M2 14 L5 4 L9 10 L15 2 L21 10 L25 4 L28 14 Z" fill="#f5c542" stroke="#c89222" stroke-width="1" stroke-linejoin="round"/><rect x="2" y="14" width="26" height="3" fill="#f5c542"/></svg>
        </div>
      </div>
      <div class="top-actions">
        <div class="circle-btn" id="supportBtn" title="客服">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 13v-2a8 8 0 0 1 16 0v2"/>
            <path d="M4 13v3a2 2 0 0 0 2 2h1v-6H6a2 2 0 0 0-2 1z"/>
            <path d="M20 13v3a2 2 0 0 1-2 2h-1v-6h1a2 2 0 0 1 2 1z"/>
            <path d="M18 18v.5a2.5 2.5 0 0 1-2.5 2.5H14"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- Greeting -->
    <div class="greeting">
      <div class="hello">下午好,</div>
      <div class="name">LinShiYue</div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
    </div>

    <!-- Card -->
    <div class="stage">
      <div class="card">
        <div class="label">今天已识别水果数</div>
        <div class="pct">10<span class="unit">种</span></div>
        <div class="desc">已解锁 20 种水果</div>
        <button class="cta" onclick="window.location.href='scan.html'">识别一下</button>
      </div>

      <!-- ============= Peach character (user's vector asset embedded into SVG canvas) ============= -->
      <svg class="peach" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" aria-label="桃桃" preserveAspectRatio="xMidYMid meet">
        <!-- soft ground shadow under the character -->
        <ellipse cx="400" cy="740" rx="180" ry="14" fill="#000" opacity=".10"/>
        <!-- the user's actual vector PNG embedded as SVG <image> so it lives in the same SVG canvas -->
        <image href="picture/peach.png" x="0" y="0" width="800" height="800" preserveAspectRatio="xMidYMid meet"/>
      </svg>
    </div>

    <!-- Module grid -->
    <div class="modules">
      <div class="mod" onclick="window.location.href='health.html'">
        <div class="head">
          <div class="ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 21s-7-4.5-7-10a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 5.5-7 10-7 10z"/>
              <path d="M9 11h2v2H9zM13 11h2v2h-2z"/>
            </svg>
          </div>
          <div class="name">个人健康</div>
        </div>
        <div class="sub">查看健康数据</div>
      </div>

      <div class="mod" onclick="window.location.href='tujian-v4-month.html'">
        <div class="head">
          <div class="ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3c4 0 7 3 7 7v3l2 4H3l2-4v-3c0-4 3-7 7-7z"/>
              <path d="M9 17a3 3 0 0 0 6 0"/>
            </svg>
          </div>
          <div class="name">水果图鉴</div>
        </div>
        <div class="sub">认识更多水果</div>
      </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
      <div class="nav-item active">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </div>
        <span class="nav-label">首页</span>
      </div>

      <div class="nav-camera">
        <div class="camera-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </div>
        <span class="nav-label">拍照</span>
      </div>

      <div class="nav-item">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <span class="nav-label">我的</span>
      </div>
    </div>

    <div class="home-indicator"></div>

    <!-- 客服弹层 -->
    <div class="support-overlay" id="supportOverlay" onclick="if(event.target===this)closeSupport()">
      <div class="support-sheet">
        <div class="support-head">
          <div class="support-title">客服小桃</div>
          <button class="support-close" onclick="closeSupport()" aria-label="关闭">✕</button>
        </div>
        <div class="support-hint">选个常见问题，小桃会立刻给你答案；找不到就点底部直接联系人工客服。</div>
        <div class="support-list" id="supportList">
          <button class="support-item" data-q="识别">水果识别结果准吗？</button>
          <button class="support-item" data-q="评分">分数是怎么打出来的？</button>
          <button class="support-item" data-q="隐私">我的图片会上传吗？</button>
          <button class="support-item" data-q="离线">支持离线识别吗？</button>
        </div>
        <div class="support-reply" id="supportReply"></div>
        <button class="support-footer" id="humanSupport" onclick="openHumanSupport()">
          <div class="support-avatar">🍑</div>
          <div class="support-meta">
            <div class="t1">小桃 · 专属客服</div>
            <div class="t2">在线 · 工作日 9:00-21:00</div>
          </div>
          <div class="support-arrow">›</div>
        </button>
      </div>
    </div>

  </div>

<script>
  // 2026-06-28 实现客服按钮
  var REPLIES = {
    '识别': '识别准确率在常见品类（苹果/香蕉/西瓜/葡萄/橙子等）约 92%，稀有品类约 78%。建议拍正面、充足光照、单一主体效果最好。',
    '评分': '从完整度、色泽、新鲜度、形状 4 个维度各打 0-10 分，再按权重算出综合分。同一张图多次识别结果会有小幅波动，属于正常。',
    '隐私': '图片会上传到豆包大模型做识别，<b>不会</b>用于模型训练，识别完成后临时缓存 30 分钟自动清除。本地不持久化保存原图。',
    '离线': '当前版本依赖云端豆包模型，<b>不支持</b>离线识别。离线模式在排期（预计下个版本）。'
  };
  document.getElementById('supportBtn').addEventListener('click', function() {
    document.getElementById('supportOverlay').classList.add('show');
    var r = document.getElementById('supportReply');
    r.classList.remove('show');
    r.textContent = '';
  });
  function closeSupport() {
    document.getElementById('supportOverlay').classList.remove('show');
  }
  document.querySelectorAll('.support-item').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var key = this.getAttribute('data-q');
      var reply = REPLIES[key] || '这个问题小桃还在学习～';
      var r = document.getElementById('supportReply');
      r.innerHTML = '💬 ' + reply;
      r.classList.add('show');
    });
  });
  function openHumanSupport() {
    var r = document.getElementById('supportReply');
    r.innerHTML = '💬 已召唤人工客服小桃，预计 30 秒内接入…<br><span style="color:#6b574a;font-size:11px;">（演示占位：真实场景会跳转到 IM/外呼系统）</span>';
